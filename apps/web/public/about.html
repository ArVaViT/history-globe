<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>History Globe</title>
    <!-- The old About page lives on in the documentation (docs/). Its sections were in
         Russian, with "-en" twins: an old link to a section lands in that section's language;
         a bare link, in the reader's language where the docs have it, else in English. -->
    <script>
      const h = location.hash.slice(1);
      const page =
        h.startsWith("sources") || h.startsWith("privacy")
          ? "sources.html"
          : h.startsWith("made")
            ? "methodology.html"
            : "";
      const docs = [
        "cs",
        "da",
        "de",
        "es",
        "fr",
        "it",
        "hu",
        "nl",
        "nb",
        "pl",
        "pt",
        "ro",
        "fi",
        "sv",
        "tl",
        "vi",
        "bg",
        "ru",
        "sr",
        "uk",
      ];
      const browser = (navigator.languages || [])
        .map((l) => l.toLowerCase().split("-")[0])
        .find((l) => l === "en" || docs.includes(l));
      const lang = h ? (h === "en" || h.endsWith("-en") ? "en" : "ru") : browser || "en";
      location.replace("docs/" + (lang === "en" ? "" : lang + "/") + page);
    </script>
    <meta http-equiv="refresh" content="0; url=docs/" />
  </head>
  <body>
    <p><a href="docs/">About</a></p>
  </body>
</html>
