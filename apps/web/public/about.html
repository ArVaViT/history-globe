<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>History Globe</title>
    <!-- The old About page lives on in the documentation (docs/): old links land in the
         matching language and section. -->
    <script>
      const h = location.hash.slice(1);
      const en = h === "en" || h.endsWith("-en");
      const page =
        h.startsWith("sources") || h.startsWith("privacy")
          ? "sources.html"
          : h.startsWith("made")
            ? "methodology.html"
            : "";
      location.replace("docs/" + (en ? "" : "ru/") + page);
    </script>
    <meta http-equiv="refresh" content="0; url=docs/ru/" />
  </head>
  <body>
    <p><a href="docs/ru/">О проекте</a> · <a href="docs/">About</a></p>
  </body>
</html>
