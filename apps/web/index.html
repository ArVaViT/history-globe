    <meta name="theme-color" content="#0c1520" />

    <link rel="canonical" href="https://historyglobe.app/" />
    <meta property="og:type" content="website" />

    <meta property="og:title" content="History Globe — библейская история на глобусе" />
    <meta
      property="og:description"

    <meta property="og:url" content="https://historyglobe.app/" />
    <meta property="og:image" content="https://historyglobe.app/og.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "History Globe",
        "url": "https://historyglobe.app/",
        "description": "A 3D globe of biblical history: the places the Bible names, linked to their verses, the states around them year by year, tours and lessons.",

        "isAccessibleForFree": true,

        "author": {
          "@type": "Person",
          "name": "Vadym Arnaut",
          "url": "https://historyglobe.app/docs/author.html"
        }
      }

    <div id="root"></div>
    <noscript>
      <p>
        History Globe — карта библейской истории. Без JavaScript карта не откроется, но все места и

        in English: <a href="en/places/">places</a>, <a href="en/tours/">tours</a>.
        <a href="ru/">О проекте</a> · <a href="en/">About</a> ·
        <a href="docs/ru/privacy.html">Конфиденциальность</a>.
