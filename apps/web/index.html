<!doctype html>
<html lang="en">
  <head>
    <!-- History Globe, https://historyglobe.app, by Vadym Arnaut. The data is CC BY 4.0: take it through the API, https://historyglobe.app/api/v1/, and credit it. The place articles and the answers are CC BY-NC-ND 4.0: quote them with a link; no commercial use, no changed or translated copies, no training. The site, its code and its design are all rights reserved: do not clone them. Details: https://historyglobe.app/docs/build.html and https://historyglobe.app/llms.txt. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Biblical history on a globe: the places of the Bible, the states around them and the routes, year by year, linked to their verses."
    />
    <meta name="theme-color" content="#0c1520" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>History Globe — biblical history on a globe</title>
    <link rel="canonical" href="https://historyglobe.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="History Globe" />
    <meta property="og:title" content="History Globe — biblical history on a globe" />
    <meta
      property="og:description"
      content="The places of the Bible, the states around them and the routes, year by year, on a 3D globe, linked to their verses. Free, in 11 languages."
    />
    <meta property="og:url" content="https://historyglobe.app/" />
    <meta property="og:image" content="https://historyglobe.app/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "History Globe",
        "url": "https://historyglobe.app/",
        "description": "A 3D globe of biblical history: the places the Bible names, linked to their verses, the states around them year by year, tours and lessons.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "inLanguage": ["cs", "de", "en", "es", "fr", "it", "nl", "pl", "pt", "ru", "uk"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": {
          "@type": "Person",
          "name": "Vadym Arnaut",
          "url": "https://historyglobe.app/docs/author.html"
        }
      }
    </script>
    <link rel="preconnect" href="https://tiles.mapterhorn.com" crossorigin />
    <!-- Inside another site's frame there is no title bar: the first screen below stays hidden. -->
    <script>
      if (/[?&]embed=1(&|$)/.test(location.search) || /\/embed\/v1\/?$/.test(location.pathname))
        document.documentElement.classList.add("hg-framed");
    </script>
    <!-- Without scripts the bar would cover the list below, and nothing would ever take it away. -->
    <noscript>
      <style>
        #hg-shell {
          display: none;
        }
        noscript p {
          margin: 16px;
          color: #f6efe1;
        }
        noscript a {
          color: inherit;
          text-decoration: underline;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <!-- The first screen: the title bar, drawn by the HTML and the stylesheet alone, while the
         scripts, the data and the map load. It has no words but the name, the same in every
         language; App.tsx removes it once its own bar is drawn in the same place. -->
    <div id="hg-shell" class="pointer-events-none fixed inset-0 font-sans" aria-hidden="true">
      <div
        class="absolute top-4 left-4 -m-4 flex flex-col gap-3 p-4 pr-5 max-md:inset-x-3 max-md:top-3 max-md:pr-4"
      >
        <div
          class="relative z-10 flex w-[360px] items-center gap-0.5 rounded-[20px] border border-line bg-paper/92 px-1.5 py-1.5 shadow-[0_12px_32px_-16px_rgba(20,14,8,0.45),0_2px_6px_-2px_rgba(20,14,8,0.12)] backdrop-blur-xl backdrop-saturate-150 max-md:w-full"
        >
          <span class="size-9 shrink-0"></span>
          <div class="flex-1 pl-1 font-serif text-[19px] font-semibold tracking-tight text-ink">
            History Globe
          </div>
          <span class="size-9 shrink-0"></span>
          <span class="size-9 shrink-0"></span>
          <span class="size-9 shrink-0"></span>
        </div>
      </div>
    </div>
    <noscript>
      <p>
        History Globe — an atlas of biblical history. The map needs JavaScript, but every place and
        tour is also listed: <a href="en/places/">places</a>, <a href="en/tours/">tours</a>,
        <a href="docs/privacy.html">privacy</a>. In every language:
        <a href="cs/" lang="cs">Čeština</a> · <a href="de/" lang="de">Deutsch</a> ·
        <a href="en/" lang="en">English</a> · <a href="es/" lang="es">Español</a> ·
        <a href="fr/" lang="fr">Français</a> · <a href="it/" lang="it">Italiano</a> ·
        <a href="nl/" lang="nl">Nederlands</a> · <a href="pl/" lang="pl">Polski</a> ·
        <a href="pt/" lang="pt">Português</a> · <a href="ru/" lang="ru">Русский</a> ·
        <a href="uk/" lang="uk">Українська</a>.
      </p>
    </noscript>
    <!-- The address robots.txt disallows, linked for the programs that ignore it (ADR 0017);
         no reader sees it. The build adds the beacon's script after the app's (vite.config.ts). -->
    <a href="export/" rel="nofollow" aria-hidden="true" tabindex="-1" hidden>Export</a>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
