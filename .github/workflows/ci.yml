# The part of `pnpm gate` that needs neither the data release nor a secret: format, lint,
# types, unit and pipeline tests. The rest (content checks, links, build, CSP, JS budget)
# needs `pnpm data`, a download of about 400 MB, and runs locally before a merge (AGENTS.md).
name: CI

on:
  pull_request:
    # "edited": a corrected title is checked again.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The squash commit takes the PR's title (AGENTS.md): a Conventional Commit, with the
      # project's own types for content, data and translations (CONTRIBUTING.md). The title
      # is passed through the environment, never into the script itself.
      - name: PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(build|chore|ci|content|data|dataset|docs|feat|fix|i18n|perf|refactor|revert|style|test)(\([a-z0-9 ,/-]+\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title is not a Conventional Commit: \"type(scope): summary\" (CONTRIBUTING.md)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pnpm, as pinned in packageManager
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # The unit tests include the checks that need no data: the content files' shape
      # (scripts/content-schemas.test.ts) and the documentation's HTML, which is published
      # unescaped (scripts/docs-html.test.ts). The three left out below read
      # apps/web/public/data, which `pnpm data` builds: they run in the local gate.
      - run: >-
          pnpm exec vitest run --exclude scripts/water-tiles.test.ts
          --exclude packages/core/src/selected-places.test.ts
          --exclude packages/core/src/selected-beside-towns.test.ts
      - run: python3 --version && pnpm test:pipeline
