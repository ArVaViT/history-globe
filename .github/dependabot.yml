# Dependency updates. A weekly look, grouped so a week is one PR per ecosystem; security fixes
# come as soon as they are published, whatever the schedule.
# Every PR passes `pnpm gate` before it is merged (AGENTS.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
      app:
        dependency-type: production
    ignore:
      # Pinned on purpose (ADR 0004): an upgrade is a PR of its own.
      - dependency-name: maplibre-gl
      # typescript-eslint does not support TypeScript 7 yet; lift this once it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
