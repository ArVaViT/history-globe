# Dependency updates. A weekly look, grouped so a week is one PR per ecosystem; security fixes
# are proposed as soon as they are published, whatever the schedule and the cooldown.
# Every PR passes `pnpm gate` before it is merged (AGENTS.md).
#
# The cooldown (ADR 0010): a version is proposed only once it has been out for some days, so
# that a hijacked release is usually found and pulled before it reaches us. pnpm refuses
# younger versions too (minimumReleaseAge, pnpm-workspace.yaml), for the same three days: a
# security fix younger than that fails `pnpm install` in CI until it is named in
# minimumReleaseAgeExclude there. `pnpm audit --fix` writes that entry with the fix.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      dev-tools:
        dependency-type: development
      app:
        dependency-type: production
    ignore:
      # Pinned on purpose (ADR 0004): an upgrade is a PR of its own.
      - dependency-name: maplibre-gl
      # typescript-eslint does not support TypeScript 7 yet; lift this once it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
