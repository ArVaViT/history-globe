# Places whose state the map must show (checked by scripts/build-polities.ts): for each
# period the place lies inside the polity named ("any": inside some polity), every year
# between the first and the last listed lies inside some polity, and a year with no state
# on purpose is listed under `blank` with the reason. A capital or a town that a correction
# was made for goes here, so that a later change to the data or the corrections cannot
# undo it unseen.
