# Dated events of biblical history, marked on the time slider. Only events with a
# year that mainstream scholarship states, each with its sources; "c." kept as
# approximate. Disputed early dates (the Exodus, the conquest) are left out (the kings
# from Saul are counted back from Solomon, below), and no
# title ties a verse to a disputed date (Luke 2:2 is not named with AD 6).
events:
  # The united monarchy before Solomon, counted back from Solomon's accession c. 970 BC
  # (Thiele) by David's forty years (2 Sam 5:4-5): conventional points, marked "c.".
  # Saul's own years are uncertain (the number in 1 Sam 13:1 is defective in the Hebrew).
  # Saul's death on Gilboa and David's taking of Zion are in battles.yaml, not again here.
  - id: saul-king
    year: "c. 1050 BC"
    title:
      en: "Saul is made king at Gilgal"
      ru: "Саула ставят царём в Галгале"
      uk: "Саула проголошують царем у Гілгалі"
      es: "Saúl es hecho rey en Gilgal"
      pt: "Saul é feito rei em Gilgal"
      de: "Saul wird in Gilgal zum König gemacht"
      fr: "Saül est fait roi à Guilgal"
    place: ab94aea
    ref: 1Sam.11.14-1Sam.11.15
    sources:
      - "1 Sam 11:14-15; the length of his reign is lost (1 Sam 13:1), so the year is a conventional estimate"
