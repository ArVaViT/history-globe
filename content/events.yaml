# Dated events of biblical history, marked on the time slider. Only events with a
# year that mainstream scholarship states, each with its sources; "c." kept as
# approximate. Disputed early dates (the Exodus, the conquest) are left out, and no
# title ties a verse to a disputed date (Luke 2:2 is not named with AD 6).
events:
  - id: temple-built
    year: "c. 966 BC"
    title:
      en: "Solomon begins the Temple"
      ru: "Соломон начинает строить Храм"
    place: a15257a
    sources:
      - "1 Kgs 6:1 (the fourth year of Solomon); Thiele's chronology"
