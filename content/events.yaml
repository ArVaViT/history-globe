# Dated events of biblical history, marked on the time slider. Only events with a
# year that mainstream scholarship states, each with its sources; "c." kept as
# approximate. Disputed early dates (the Exodus, the conquest) are left out, and no
# title ties a verse to a disputed date (Luke 2:2 is not named with AD 6).
events:
  - id: temple-built
    year: "c. 966 BC"
    title:
      en: "Solomon begins the Temple"
      ru: "Соломон начинает строить Храм"
    place: a15257a
    sources:
      - "1 Kgs 6:1 (the fourth year of Solomon); Thiele's chronology"
  - id: kingdom-divided
    year: "c. 931 BC"
    title:
      en: "The kingdom divides: Israel and Judah"
      ru: "Разделение царства на Израиль и Иудею"
    place: adf74d4
    sources:
      - "1 Kgs 12:1-20; Thiele's chronology"
  - id: samaria-falls
    year: "722 BC"
    title:
      en: "Samaria falls to Assyria"
      ru: "Падение Самарии, конец Израильского царства"
    place: a041bb3
    sources:
      - "2 Kgs 17:5-6"
      - "Babylonian Chronicle, ABC 1 i 28 (Shalmaneser V)"
  - id: sennacherib
    year: "701 BC"
    title:
      en: "Sennacherib besieges Lachish and Jerusalem"
      ru: "Сеннахирим осаждает Лахис и Иерусалим"
    place: a3cc590
    sources:
      - "2 Kgs 18:13-19:37"
      - "Sennacherib's Annals (Taylor Prism)"
  - id: nineveh-falls
    year: "612 BC"
    title:
      en: "Nineveh falls"
      ru: "Падение Ниневии"
    place: a70fd5d
    sources:
      - "Babylonian Chronicle, ABC 3"
  - id: jerusalem-falls
