# Corrections on top of Cliopatria for the biblical Levant (borders audit, 2026-09-29).
# An entry keeps a polity on the map for more years, reusing Cliopatria's last shape of
# it, or ends it sooner when Cliopatria keeps it too long. The shape is approximate: Judah's borders moved under Hezekiah and Josiah.
overrides:
  - polity: Kingdom of Judah
    last_year: "586 BC"
    reason: >-
      Cliopatria ends Judah in 702 BC, after Sennacherib's campaign. Judah remained a
      kingdom, vassal in turn to Assyria, Egypt and Babylon, until Jerusalem fell in 587
      or 586 BC.
    sources:
      - "2 Kgs 18-25"
      - "Jer 39:1-10; 52:4-16"
  - polity: Hamdanid Emirates
    last_year: "AD 1004"
    reason: >-
      Cliopatria draws the Hamdanids over Syria and the Jazira until 1259. The dynasty
      lost Mosul by 979 and Aleppo, its last seat, in 1004; Syria then passed to the
      Mirdasids, the Fatimids and from the 1070s the Seljuks, which the map shows.
    sources:
      - "M. Canard, Hamdanids, Encyclopaedia of Islam, 2nd ed., vol. 3 (1971)"
      - "H. Kennedy, The Prophet and the Age of the Caliphates, 3rd ed. (2016), ch. 9"
  - polity: Lakhmid Kingdom
    last_year: "AD 602"
    reason: >-
      Cliopatria draws the Lakhmid kingdom over al-Hira again in 629-633. The dynasty
      ended when Khosrow II deposed al-Nu'man III in 602; al-Hira was then held by Iyas
      ibn Qabisa of Tayyi' and a Persian governor until Khalid ibn al-Walid took it in 633.
    sources:
      - "I. Shahîd, Lakhmids, Encyclopaedia of Islam, 2nd ed., vol. 5 (1986)"
      - "G. Fisher, Between Empires: Arabs, Romans, and Sasanians in Late Antiquity (2011)"
  - polity: Ziyadid dynasty
    last_year: "AD 1018"
    reason: >-
      Cliopatria keeps the Ziyadids of Zabid until 1138. The last Ziyadid was murdered in
      1018 and power passed to his slave regents Nafis and Najah, whose Najahid line held
      the Tihama from 1022; Cliopatria's later Ziyadid shapes belong to the Najahids and
      Sulayhids.
    sources:
      - "C. E. Bosworth, The New Islamic Dynasties (1996), s.v. Ziyadids"
      - "G. R. Smith, Ziyadids, Encyclopaedia of Islam, 2nd ed., vol. 11 (2002)"
  - polity: Caliphate of Córdoba
    last_year: "AD 1031"
    reason: >-
      Cliopatria draws the Caliphate of Córdoba around Córdoba until 1071. The caliphate
      was abolished in 1031; Córdoba then became a taifa under the Banu Jahwar, which
      al-Mu'tamid of Seville annexed in 1070.
    sources:
      - "H. Kennedy, Muslim Spain and Portugal: A Political History of al-Andalus (1996)"
      - "C. E. Bosworth, The New Islamic Dynasties (1996), s.v. Spanish Umayyads"
  - polity: Latin Empire
    last_year: "AD 1261"
    reason: >-
      Cliopatria keeps the Latin Empire in Constantinople until 1278. Michael VIII's
      general Alexios Strategopoulos retook the city on 25 July 1261 and the Byzantine
      Empire was restored there.
    sources:
      - "R. L. Wolff, The Latin Empire of Constantinople, 1204-1261, in K. M. Setton (ed.), A History of the Crusades, vol. 2 (1969)"
      - "D. M. Nicol, The Last Centuries of Byzantium, 1261-1453, 2nd ed. (1993)"
  - polity: Almohad Caliphate
    last_year: "AD 1269"
    reason: >-
      Cliopatria draws the Almohads over all of Morocco until 1343. By 1248 the Marinids
      held Fez, and in 1269 they took Marrakesh, where the last Almohad caliph, Idris
      al-Wathiq, was killed.
    sources:
      - "A. K. Bennison, The Almoravid and Almohad Empires (2016)"
      - "C. E. Bosworth, The New Islamic Dynasties (1996), s.v. Almohads"
  - polity: Assyrian Egypt
    last_year: "652 BC"
    reason: >-
      Cliopatria draws "Assyrian Egypt" for 650-615 BC over the whole Assyrian realm, from
      Egypt to Iran, on top of the Neo-Assyrian Empire, which already includes Egypt in
      those years: every land was tinted twice and named twice. Assyrian rule in Egypt
      had ended by 656 BC, when Psamtik I reunited the country; the duplicate is dropped.
    sources:
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 13"
      - "A. K. Grayson, Assyrian Rule of Conquered Territory in Ancient Western Asia, in J. M. Sasson (ed.), Civilizations of the Ancient Near East (1995)"
  - polity: Hyksos
    last_year: "1550 BC"
    reason: >-
      Cliopatria draws the Hyksos over Canaan and Syria until 1400 BC. Their rule ended
      when Ahmose I took Avaris and then Sharuhen, about 1550 BC; the Levant after it was
      a land of Canaanite city-states under Egyptian overlordship, which Cliopatria does
      not draw, so it is left without a state rather than given the wrong one.
    sources:
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 8 (J. Bourriau)"
      - "D. B. Redford, Egypt, Canaan, and Israel in Ancient Times (1992), ch. 5"
  - polity: Kingdom of Israel
    last_year: "722 BC"
    reason: >-
      Samaria fell after a three-year siege by Shalmaneser V; the Babylonian
      Chronicle says he "ravaged Samaria" in his short reign (727-722 BC),
      and 2 Kings dates the capture to Hoshea's ninth year. Sargon II later
      claimed the conquest and in 720 BC put down a revolt in which Samaria
      took part, which is why some scholars write c. 720; 722 BC is the
      usual textbook year for the end of the kingdom.
    sources:
      - "2 Kgs 17:5-6"
      - "2 Kgs 18:9-10"
      - "Babylonian Chronicle ABC 1, i 27-28 (livius.org)"
      - "Wikipedia, Shalmaneser V; Sargon II; Hoshea"
  - polity: Kingdom of Commagene
    last_year: "AD 72"
    reason: >-
      Cliopatria draws Commagene until AD 77. Vespasian deposed Antiochus IV
      and annexed the kingdom for good in AD 72.
    sources:
      - "Wikipedia, Commagene; Antiochus IV of Commagene"

  - polity: Neo-Assyrian Empire
    last_year: "609 BC"
    reason: >-
      Nineveh fell to the Medes and Babylonians in 612 BC; the last king, Ashur-uballit II,
      held out at Harran until 610-609 BC. Cliopatria draws the empire until 601 BC; its
      heartland after 609 is left without a state rather than given the wrong one.
    sources:
      - "Babylonian Chronicle ABC 3 (Fall of Nineveh Chronicle)"
      - "Wikipedia, Ashur-uballit II; Fall of Nineveh"
  - polity: Kingdom of Pontus
    last_year: "AD 62"
    reason: >-
      Cliopatria draws the kingdom of Pontus until AD 67. Nero made Polemon II abdicate in
      AD 62 and Pontus became part of a Roman province.
    sources:
      - "Wikipedia, Polemon II of Pontus; Kingdom of Pontus"
  - polity: Kingdom of Cappadocia
    last_year: "AD 17"
    reason: >-
      Cliopatria draws the kingdom of Cappadocia until AD 22. Archelaus died in Rome in
      AD 17 and Tiberius made Cappadocia a province.
    sources:
      - "Wikipedia, Cappadocia (Roman province); Archelaus of Cappadocia"
  - polity: Mauretania
    last_year: "AD 40"
    reason: >-
      Cliopatria draws the kingdom of Mauretania until AD 42. Caligula had its last king,
      Ptolemy, executed in AD 40 and Rome annexed the kingdom.
    sources:
      - "Wikipedia, Ptolemy of Mauretania"
  - polity: Hittites
    last_year: "1180 BC"
    reason: >-
      Cliopatria draws the Hittite kingdom until 1151 BC. It ended about 1180 BC in the
      collapse at the end of the Bronze Age, when Hattusa was burnt and abandoned; the
      Neo-Hittite states of Syria and southern Anatolia took its place.
    sources:
      - "Wikipedia, Hittites (Hattusa burnt around 1180 BC; New Kingdom 1500-1180 BC)"
      - "Wikipedia, Hattusa (destroyed with the Hittite state around 1200 BC)"
  - polity: Neo-Hittite states
    last_year: "741 BC"
    reason: >-
      Cliopatria ends the Neo-Hittite (Syro-Hittite) states in 801 BC and gives their lands
      to Assyria from then. They remained kingdoms, at times tributary to Assyria, until
      Tiglath-pileser III and Sargon II took them one by one: Arpad in 740, Unqi in 738,
      Carchemish in 717, Melid in 712, Gurgum in 711 and Kummuh in 708 BC. Drawn on to 741
      BC, the year before the first annexation; the shape cannot be split by state.
    sources:
      - "Wikipedia, Tiglath-Pileser III (Arpad taken in 740 BC; provinces south of Arpad in 738 BC)"
      - "Wikipedia, Carchemish (taken by Sargon II in 717 BC, the last ruler of the House of Astiruwa)"
      - "Wikipedia, Sargon II (Melid 712, Gurgum 711, Kummuh 708 BC)"
      - "Wikipedia, Kummuh (a tributary state allied with Assyria from the 9th to the mid-8th century BC)"
  - polity: Neo-Babylonian Empire
    last_year: "539 BC"
    reason: >-
      Cliopatria draws the Neo-Babylonian Empire until 532 BC. After the battle of Opis
      the army of Cyrus entered Babylon without a battle in October 539 BC and Nabonidus
      was captured; the empire ended.
    sources:
      - "Nabonidus Chronicle (ABC 7) iii 12-16 (livius.org)"
      - "Wikipedia, Fall of Babylon (Persian forces entered Babylon on 12 October 539 BC)"
  - polity: Achaemenid Empire
    last_year: "330 BC"
    reason: >-
      Cliopatria draws the Achaemenid Empire over Mesopotamia and Iran until 328 BC.
      Alexander won at Gaugamela on 1 October 331 BC and took Babylon, Susa and Persepolis;
      Darius III was killed by Bessus in 330 BC.
    sources:
      - "Wikipedia, Darius III (reigned 336 BC to his death in 330 BC)"
      - "Wikipedia, Battle of Gaugamela (1 October 331 BC)"
  - polity: Kingdom of Bithynia
    last_year: "74 BC"
    reason: >-
      Cliopatria draws Bithynia until 68 BC. Nicomedes IV bequeathed the kingdom to Rome
      in 74 BC, one of his last acts as king, and it became a Roman province.
    sources:
      - "Wikipedia, Nicomedes IV of Bithynia (bequeathed the kingdom to Rome in 74 BC)"
      - "Wikipedia, Bithynia (bequeathed to the Roman Republic in 74 BC)"
  - polity: Parthian Empire
    last_year: "AD 224"
    reason: >-
      Cliopatria draws the Parthian Empire over Mesopotamia and Media until AD 237.
      Artabanus IV was defeated and killed by Ardashir I at Hormozdgan on 28 April 224,
      the end of the Arsacid era; Ardashir was crowned at Ctesiphon, probably in 226.
    sources:
      - "Wikipedia, Battle of Hormozdgan (28 April 224)"
      - "Wikipedia, Ardashir I (coronation at Ctesiphon in 226 according to Wiesehöfer)"
  - polity: Kingdom of Pergamon
    last_year: "133 BC"
    reason: >-
      Cliopatria draws the Attalid kingdom until 128 BC. Attalus III died in 133 BC and
      left his kingdom to the Roman people. Aristonicus, who claimed the throne as Eumenes
      III, fought Rome for it until the consul Perperna took his surrender in 130 BC; the
      revolt was over by 129 BC, and the land became the province of Asia.
    sources:
      - "Strabo, Geography 13.4.2 (Attalus Philometor reigned five years and left the Romans his heirs; they made the country a province, Asia) (LacusCurtius)"
      - "Livy, Periochae 58-59 (livius.org)"
      - "Wikipedia, Attalus III (138-133 BC; the uprising of Aristonicus put down in 129 BC)"
  - polity: Antigonid Macedonia
    last_year: "168 BC"
    reason: >-
      Cliopatria draws the Antigonid kingdom until 166 BC. Aemilius Paullus defeated
      Perseus at Pydna in 168 BC; the monarchy was abolished and Macedonia was divided into
      four tribute-paying republics (merides). Cliopatria draws them as Greek city-states
      from 165 BC.
    sources:
      - "Livy 44.40-42 (Pydna); 45.18 (the Senate's decision: Macedonia free, in four regions, paying half the old tribute); 45.29-30 (the four regions) (Perseus)"
      - "Wikipedia, Battle of Pydna (168 BC; the kingdom dissolved and replaced with four republics)"
      - "Wikipedia, Macedonia (Roman province) (four client republics, merides; province from 148/146 BC)"
  - polity: Cyrenaica
    last_year: "96 BC"
    reason: >-
      Cliopatria draws the kingdom of Ptolemy Apion until 93 BC. Apion died in 96 BC and
      left Cyrenaica to the Roman people; the Senate declared its cities free and made it a
      province only in 74 BC, but the kingdom ended in 96.
    sources:
      - "Livy, Periochae 70.5 (Ptolemy Apion of Cyrene makes the Roman people his heir; the Senate frees the towns) (livius.org)"
      - "Wikipedia, Ptolemy Apion (died 96 BC); Crete and Cyrenaica (Cyrenaica annexed as a province in 74 BC)"
  - polity: Ptolemaic Kingdom
    last_year: "30 BC"
    reason: >-
      Cliopatria draws the Ptolemaic kingdom in Egypt until 29 BC. Octavian took
      Alexandria in 30 BC, Cleopatra VII died, and Egypt was made a tributary province
      under Cornelius Gallus.
    sources:
      - "Cassius Dio 51.9-17 (51.17.1: he made Egypt tributary and gave it in charge of Cornelius Gallus) (LacusCurtius)"
      - "Wikipedia, Ptolemaic Kingdom (ended with the death of Cleopatra VII in 30 BC)"
  - polity: Thracian Kingdom
    last_year: "AD 46"
    reason: >-
      Cliopatria draws the Thracian (Sapaean) kingdom until AD 50. Its last king,
      Rhoemetalces III, was murdered (in AD 44 or 46; the accounts differ), and Claudius
      annexed the kingdom as the province of Thracia in AD 46.
    sources:
      - "Wikipedia, Thracia (Claudius annexed the kingdom as a province in AD 46)"
      - "Wikipedia, Sapaean kingdom (Roman client state until AD 46); Rhoemetalces III (murdered in AD 44)"
  - polity: Ankhwennefer
    last_year: "186 BC"
    reason: >-
      Cliopatria draws the Theban kingdom of Ankhwennefer (Chaonnophris) until 172 BC. The
      Ptolemaic army retook Thebes in 191 BC, and on 27 August 186 BC Komanos defeated his
      Egyptian and Nubian army south of Aswan, ending the Great Revolt of the Thebaid; Upper
      Egypt was Ptolemaic again.
    sources:
      - "Wikipedia, Ankhwennefer (pharaoh) (rule c. 201/200 to 187/186 BC; Thebes captured in 191; defeated c. 186 BC)"
      - "Wikipedia, Great Theban Revolt (Komanos defeated Chaonnophris south of Aswan on 27 August 186 BC)"
      - "W. Clarysse, The Great Revolt of the Egyptians (205-186 BC)"
  - polity: Rashidun Caliphate
    last_year: "AD 661"
    reason: >-
      Cliopatria draws the Rashidun Caliphate over Iraq, Iran and Arabia until 665, beside
      the Umayyads in Syria and Egypt. Ali was murdered in January 661; his son al-Hasan
      made peace with Mu'awiya and abdicated in the summer of 661, and Mu'awiya entered
      Kufa and was recognised as caliph. The lands are drawn as the Umayyads' from 662
      (annexed).
    sources:
      - "W. Madelung, The Succession to Muhammad (1997), ch. 7"
      - "Wikipedia, Hasan ibn Ali (caliph January-August 661); Mu'awiya I (entered Kufa in July or September 661 and was recognised as caliph)"
  - polity: Tulunids
    last_year: "AD 905"
    reason: >-
      Cliopatria draws the Tulunids over Egypt and Syria until 910. The Abbasid army of
      Muhammad ibn Sulayman al-Katib took Damascus in 904 and came before Fustat in January
      905; the last Tulunid, Shayban, surrendered, and Egypt and Syria were ruled by the
      caliph's governors again (annexed).
    sources:
      - "T. Bianquis, Autonomous Egypt from Ibn Tulun to Kafur, 868-969, in C. F. Petry (ed.), The Cambridge History of Egypt, vol. 1 (1998)"
      - "C. E. Bosworth, The New Islamic Dynasties (1996), s.v. Tulunids (868-905)"
      - "Wikipedia, Tulunids (autonomous from 868 until 905); Muhammad ibn Sulayman al-Katib"
  - polity: County of Edessa
    last_year: "AD 1150"
    reason: >-
      Cliopatria draws the county until 1151. Joscelin II was taken prisoner by Nur
      ad-Din's men in 1150, and his wife Beatrice sold Turbessel and what was left of the
      county to the emperor Manuel I; Nur ad-Din and the Sultan of Rum took those lands
      within a year.
    sources:
      - "S. Runciman, A History of the Crusades, vol. 2 (1952)"
      - "Wikipedia, County of Edessa; Joscelin II, Count of Edessa"
  - polity: Abbasid Caliphate
    last_year: "AD 1258"
    reason: >-
      Cliopatria draws the Abbasid Caliphate over Iraq until 1259. Hulagu took Baghdad,
      where the caliph al-Musta'sim surrendered on 10 February 1258 and was put to death;
      Iraq passed to the Mongols (annexed). The caliphs later kept at Cairo by the Mamluks
      held no land.
    sources:
      - "S. Runciman, A History of the Crusades, vol. 3 (1954), the fall of Baghdad"
      - "J. A. Boyle, Dynastic and Political History of the Il-Khans, in The Cambridge History of Iran, vol. 5 (1968)"
      - "Wikipedia, Siege of Baghdad (1258)"
  - polity: Principality of Antioch
    last_year: "AD 1268"
    reason: >-
      Cliopatria draws the principality until 1271. Baybars took Antioch by storm on 18
      May 1268; Bohemond VI kept only the title and the county of Tripoli, and the city
      and its land were the Mamluks' from then (annexed).
    sources:
      - "S. Runciman, A History of the Crusades, vol. 3 (1954), pp. 324-7"
      - "Wikipedia, Siege of Antioch (1268)"
  - polity: County of Tripoli
    last_year: "AD 1289"
    reason: >-
      Cliopatria draws the county until 1293. Qalawun took Tripoli by assault on 26 April
      1289 and had it razed; the county ended and its land was the Mamluks' (annexed).
    sources:
      - "S. Runciman, A History of the Crusades, vol. 3 (1954), the fall of Tripoli"
      - "Wikipedia, Fall of Tripoli (1289)"
  - polity: Kingdom of Jerusalem
    last_year: "AD 1291"
    reason: >-
      Cliopatria draws the coastal kingdom until 1293. Al-Ashraf Khalil took Acre on 18 May
      1291; Tyre, Sidon, Beirut and Haifa were given up in the following weeks and Atlit,
      the last castle, on 14 August, and nothing of the kingdom was left on the mainland
      (annexed).
    sources:
      - "S. Runciman, A History of the Crusades, vol. 3 (1954), the fall of Acre"
      - "Wikipedia, Siege of Acre (1291)"
starts:
  - polity: Kingdom of Israel
    first_year: "1010 BC"
    reason: >-
      Cliopatria begins the kingdom of Israel in 1000 BC, so the years of David's reign
      before it showed the hills of Judah and Israel without a state. David reigned forty
      years, seven in Hebron and thirty-three in Jerusalem, and Solomon's reign begins
      about 970 BC: David's begins about 1010 BC.
    sources:
      - "2 Sam 5:4-5; 1 Kgs 2:11"
      - "E. R. Thiele, The Mysterious Numbers of the Hebrew Kings (1983), ch. 2"
  - polity: Hyksos
    first_year: "1650 BC"
    reason: >-
      Cliopatria draws the Hyksos over Canaan from 1800 BC. Their rule, the Fifteenth
      Dynasty in Lower Egypt, began about 1650 BC; before it Canaan was a land of
      city-states, which Cliopatria does not draw.
    sources:
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 8 (J. Bourriau)"
      - "K. S. B. Ryholt, The Political Situation in Egypt during the Second Intermediate Period (1997)"
  - polity: Twenty-sixth Dynasty of Egypt
    first_year: "656 BC"
    reason: >-
      Psamtik I, founder of the Twenty-sixth Dynasty, was king from 664 BC under Assyria; by
      656 BC, when his daughter Nitocris was adopted as God's Wife of Amun at Thebes, he held
      all Egypt and had thrown off Assyrian rule. Cliopatria draws the dynasty only from
      615 BC and Assyria over Egypt until then.
    sources:
      - "Wikipedia, Psamtik I (Thebes in 656 BC; all Egypt by 654 BC)"
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 13 (A. B. Lloyd, The Late Period)"
  - polity: Hittites
    first_year: "1650 BC"
    reason: >-
      Cliopatria begins the Hittite kingdom in 1600 BC. Labarna, who took the name
      Hattusili I, made Hattusa the capital about 1650 BC (middle chronology); his
      successor Mursili I sacked Babylon in 1595 BC.
    sources:
      - "Wikipedia, Hittites (capital at Hattusa around 1650 BC; Babylon sacked 1595 BC, middle chronology)"
      - "Wikipedia, Hattusili I (1650-1620 BC, middle chronology)"
  - polity: Kingdom of Urartu
    first_year: "860 BC"
    reason: >-
      Cliopatria begins Urartu in 800 BC. The Nairi lands were united into one kingdom
      under Arame (about 860-843 BC), whose capitals Shalmaneser III captured; Sarduri I
      (about 832-820 BC) moved the capital to Tushpa. The shape drawn back to 860 is
      Cliopatria's first one, of 800 BC; the kingdom of the 850s was probably smaller.
    sources:
      - "Wikipedia, Urartu (Arame c. 860-843 BC; Sarduri I c. 832-820 BC, capital moved to Tushpa)"
      - "Wikipedia, Arame of Urartu (fought Shalmaneser III, r. 859-824 BC)"
clips:
  - polity: Philistia
    # The coastal plain from Nahal Besor to the Yarkon, east to the edge of the Shephelah:
    # Gaza, Ashkelon, Ashdod, Ekron and Gath, the five cities of Josh 13:3.
    within:
      - [34.2, 31.2]
      - [34.6, 31.15]
      - [34.95, 31.45]
      - [35.0, 31.85]
      - [34.85, 32.15]
      - [34.7, 32.15]
    reason: >-
      Cliopatria draws Philistia to the Jordan and into Galilee until 1000 BC, and over
      Samaria after it, so the map put David's Bethlehem and Saul's Gibeah in Philistia.
      The Philistines held the coastal plain and pressed into the hills (1 Sam 13); the
      land of their five cities is the plain.
    sources:
      - "Josh 13:2-3; 1 Sam 6:17"
      - "T. Dothan, The Philistines and Their Material Culture (1982)"
  - polity: Neo-Assyrian Empire
    # East of a line from the sea off western Cyprus to Raphia and down the Arabah:
    # Egypt and Sinai out, the Levant and Cyprus in.
    within:
      - [31.0, 37.0]
      - [34.2, 31.3]
      - [35.0, 29.5]
      - [36.5, 24.0]
      - [70.0, 10.0]
      - [70.0, 50.0]
      - [31.0, 50.0]
    first_year: "656 BC"
    last_year: "616 BC"
    reason: >-
      Assyrian rule in Egypt had ended by 656 BC, when Psamtik I held all Egypt; Cliopatria
      draws the Neo-Assyrian Empire over Egypt until 616 BC.
    sources:
      - "Wikipedia, Psamtik I"
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 13"
  # Neo-Assyrian Empire, 801-730 BC: three clips with years, one per stage of the advance
  # west of the Euphrates (Babylonia is drawn on its own in these years, bridges).
  # Tributary kingdoms are not provinces, so they stay out until annexed where the shape
  # allows it.
  - polity: Neo-Assyrian Empire
    # East of a line from the Euphrates bend to above Edessa (Til Barsip and Harran in;
    # Carchemish, Kummuh/Samosata, Arpad and Melid out), north of Babylonia.
    within:
      - [37.33, 35.84]
      - [42.0, 33.6]
      - [46.0, 35.0]
      - [48.0, 37.0]
      - [40.0, 38.6]
      - [39.48, 38.6]
    first_year: "801 BC"
    last_year: "741 BC"
    reason: >-
      Cliopatria draws from 801 BC the empire that Tiglath-pileser III and Sargon II built
      after 745 BC: Babylon, Carchemish, Kummuh, Arpad, Hamath and Damascus are Assyrian
      from 801. The reigns before Tiglath-pileser were "the low point of Assyrian royal
      power"; in 743 Sarduri II of Urartu reached "the Euphrates river border of
      Assyria". The kingdoms west of the river paid tribute at most; Arpad was annexed in
      740 BC, Damascus in 732, Carchemish in 717.
    sources:
      - "Wikipedia, Tiglath-Pileser III (low point of royal power before him; Euphrates border in 743; Arpad 740, Damascus 732 BC)"
      - "Wikipedia, Carchemish; Sargon II"
  - polity: Neo-Assyrian Empire
    # Arpad and the north Syrian kingdoms in; Hamath, Damascus and the coast to the south
    # out; north of Babylonia.
    within:
      - [35.8, 36.08]
      - [42.0, 33.6]
      - [46.0, 35.0]
      - [48.0, 37.0]
      - [40.0, 40.0]
      - [35.8, 40.0]
    first_year: "740 BC"
    last_year: "733 BC"
    reason: >-
      Arpad was taken in 740 BC after a three-year siege and made two provinces; Unqi and
      the lands south of Arpad followed in 738. Damascus stood until 732 and Hamath kept its
      own king until 720 BC, so the land south of about 35.6 degrees N stays out of Assyria
