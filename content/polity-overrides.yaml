vassals:
  - polity: Kingdom of Judah
    of: Neo-Assyrian Empire
    first_year: "c. 734 BC"
    last_year: "705 BC"
    label:
      en: "under Assyria"
      ru: "под Ассирией"
      uk: "під Ассирією"
      es: "bajo Asiria"
      pt: "sob a Assíria"
      de: "unter Assyrien"
      fr: "sous l’Assyrie"
      pl: "pod władzą Asyrii"
      it: "sotto l’Assiria"
      nl: "onder Assyrië"
      cs: "pod Asýrií"
      sv: "under Assyrien"
      nb: "under Assyria"
      tl: "sa ilalim ng Asiria"
      da: "under Assyrien"
      sr: "под Асиријом"
      hu: "Asszíria alatt"
      fi: "Assyrian alaisuudessa"
      vi: "thuộc A-si-ri"
      ro: "sub Asiria"
      bg: "под властта на Асирия"
    reason: >-
      Threatened by Israel and Aram-Damascus, Ahaz declared himself the servant of Tiglath-pileser III and sent him silver and gold; Assyrian lists put "Jehoahaz (Ahaz) of the land Judah" among the western rulers who paid tribute, a group the RINAP editors date to 734 BC. Judah stayed tributary until Hezekiah joined the rebellion that broke out after Sargon II died in 705 BC.
