# A polity the data names by one era for longer than it lasted (build-content.ts): a new
# name from the year given.
renamed:
  - polity: New Kingdom of Egypt
    first_year: "c. 1070 BC"
    name: Egypt of the Third Intermediate Period
    reason: >-
      The New Kingdom ended with the death of Ramesses XI (1077 BC in some chronologies,
      1069 BC in others); Egypt was then divided between the kings at Tanis and the high
      priests of Amun at Thebes, the Third Intermediate Period. Cliopatria calls it the New
      Kingdom until 801 BC.
    sources:
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 10 (J. van Dijk, The Amarna Period and the Later New Kingdom, c. 1352-1069 BC) and ch. 12 (J. Taylor, The Third Intermediate Period, 1069-664 BC)"
      - "Wikipedia, Third Intermediate Period of Egypt; New Kingdom of Egypt"
  # Cliopatria puts the two dynasties' names on each other's lands in 800-701 BC: its
  # "Twenty-third" holds the Delta with Tanis, Bubastis and Memphis, the seats of the
  # Twenty-second. Swapped in three steps through a name used for nothing else.
  - polity: Twenty-second Dynasty of Egypt
    first_year: "800 BC"
    name: Egypt (dynasty swap)
    reason: >-
      Step 1 of 3 of swapping the two dynasties' names (see the comment above).
    sources:
      - "Wikipedia, Twenty-second Dynasty of Egypt (Bubastis, Tanis); Twenty-third Dynasty of Egypt"
  - polity: Twenty-third Dynasty of Egypt
    first_year: "800 BC"
    name: Twenty-second Dynasty of Egypt
    reason: >-
      The Twenty-second (Libyan) Dynasty ruled from Bubastis and Tanis and held Memphis:
      the Delta shape Cliopatria names the Twenty-third is theirs.
    sources:
      - "Wikipedia, Twenty-second Dynasty of Egypt; Twenty-third Dynasty of Egypt"
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 12 (J. Taylor)"
  - polity: Egypt (dynasty swap)
    first_year: "800 BC"
    name: Twenty-third Dynasty of Egypt
    reason: >-
      The Twenty-third Dynasty is placed at Leontopolis by the older view and in Upper Egypt
      (Thebes, Heracleopolis) by the newer; either way not at Tanis, so it takes the other
      shape.
    sources:
      - "Wikipedia, Twenty-third Dynasty of Egypt"
  - polity: Twenty-third Dynasty of Egypt
    first_year: "c. 732 BC"
    name: Kingdom of Kush
    reason: >-
      Kush already held Upper Egypt as far as Thebes (Kashta had made his daughter
      Amenirdis heir to the God's Wife of Amun there) when Piye, in his twentieth year,
      marched north, took Hermopolis and received the submission of the kings of Middle
      Egypt and the Delta. The campaign is put around 732 BC in one reckoning; with Piye's
      reign dated 744-714 BC it would fall about 725 BC. After it his authority reached
      from Thebes to Herakleopolis, where the local king ruled as his vassal; this shape,
      the Nile valley south of Memphis, was Kushite at the latest from then.
    sources:
      - "Wikipedia, Third Intermediate Period of Egypt (Kashta and Amenirdis at Thebes; Piye's Year 20 campaign, around 732 BC)"
      - "Wikipedia, Piye (ruled Egypt 744-714 BC; ruler of Nubia and Upper Egypt; authority from Thebes to Herakleopolis after the campaign)"
  - polity: Twenty-second Dynasty of Egypt
    first_year: "c. 712 BC"
    name: Kingdom of Kush
    reason: >-
      Piye's campaign left the Delta kings, Tefnakht of Sais above all, in practice free
      of Kushite control. Kush took the Delta when Bakenranef of Sais (c. 718-713 BC) was
      defeated and, by tradition, burnt alive. Older chronology credits Shabaka with the
      conquest, newer work (after Sargon II's Tang-i Var inscription, c. 707/706 BC)
      credits Shebitku, around 712 BC; either way Kush held all Egypt from about then.
    sources:
      - "Wikipedia, Twenty-fifth Dynasty of Egypt (Shabaka and Shebitku chronology dispute; Shebitku conquered the entire Nile Valley around 712 BC)"
      - "Wikipedia, Bakenranef (ruled Lower Egypt from Sais c. 718-713 BC)"
      - "Wikipedia, Piye (the Delta kings left free after the campaign; Shebitku defeated Bakenranef at Sais)"
      - "Wikipedia, Shebitku; Shabaka (Tang-i Var: Shebitku king of Egypt by 707/706 BC)"
  - polity: Gutian Dynasty
    first_year: "c. 2112 BC"
    name: Third Dynasty of Ur
    reason: >-
      Cliopatria's only shape of the Gutians covers Sumer, Akkad and Susa in 2101-2001 BC:
      the years and lands of the Third Dynasty of Ur (2112/0-2004/3 BC in the middle
      chronology; the absolute dates are uncertain). Utu-hengal of Uruk ended Gutian rule
      by defeating Tirigan (c. 2119 BC); Ur-Namma founded the Ur III state, which fell to
      an Elamite army about 2004 BC.
    sources:
      - "Wikipedia, Third Dynasty of Ur (2112/0-2004/3 BC, middle chronology)"
      - "Wikipedia, Gutian rule in Mesopotamia (ended by Utu-hengal, c. 2119-2112 BC)"
  # Cliopatria names Alexander's empire "Ptolemaic Kingdom" in 332-325 BC, from Egypt to
  # the Indus. Renamed in three steps through a name used for nothing else, so that the
  # real Ptolemaic Kingdom from 308 BC keeps its name.
  - polity: Ptolemaic Kingdom
    first_year: "332 BC"
    name: Ptolemaic Kingdom (rename step)
    reason: >-
      Step 1 of 3 (see the comment above).
    sources:
      - "Wikipedia, Ptolemaic Kingdom (Ptolemy satrap from 323 BC, king from 305 BC)"
  - polity: Ptolemaic Kingdom (rename step)
    first_year: "323 BC"
    name: Ptolemaic Kingdom
    reason: >-
      Step 2 of 3: the shapes from 308 BC on are the Ptolemies' own.
    sources:
      - "Wikipedia, Ptolemaic Kingdom"
  - polity: Ptolemaic Kingdom (rename step)
    first_year: "332 BC"
    name: Macedonian Empire
    reason: >-
      Step 3 of 3: the shapes of 332-325 BC are Alexander's conquests, from Egypt and Asia
      Minor to the Indus. Ptolemy became satrap of Egypt only after Alexander's death in
      323 BC and took the title of king in 305 BC.
    sources:
      - "Wikipedia, Ptolemaic Kingdom (satrap 323, king 305 BC)"
      - "Wikipedia, Ptolemy I Soter"
  - polity: Kingdom of Armenia
    first_year: "AD 638"
    name: Principality of Armenia
    reason: >-
      There was no kingdom of Armenia in AD 638-646: the Sasanians abolished it in 428.
      Byzantine Armenia was led by a native "prince of Armenia" (ishkhan), David Saharuni
      and, from 638 or 640, Theodore Rshtuni, between Byzantium and the Arabs.
    sources:
      - "Wikipedia, Theodore Rshtuni (leading prince of Byzantine Armenia under the title Prince of Armenia from 638 or 640)"
  - polity: Roman Kingdom
    first_year: "509 BC"
    name: Roman Republic
    reason: >-
      Cliopatria draws the Roman Kingdom over Rome until 482 BC and the Republic beside it
      from 501. By the Roman tradition the last king, Tarquinius Superbus, was expelled and
      the first consuls elected in 509 BC.
    sources:
      - "Livy 1.57-60; 2.1"
      - "Wikipedia, Roman Kingdom (753-509 BC); Roman Republic (from 509 BC)"
  # Cliopatria's first Mamluk shape, 1241-1249, is Syria from Gaza to the Euphrates: the
  # Ayyubid princes' lands, years before the Mamluks took power in Egypt. Renamed in three
  # steps through a name used for nothing else, so the Mamluk shapes from 1250 keep theirs.
  - polity: Mamluk Sultanate
    first_year: "AD 1241"
    name: Mamluk Sultanate (rename step)
    reason: >-
      Step 1 of 3 (see the comment above).
    sources:
      - "Wikipedia, Mamluk Sultanate (1250-1517)"
  - polity: Mamluk Sultanate (rename step)
    first_year: "AD 1250"
    name: Mamluk Sultanate
    reason: >-
      Step 2 of 3: the Mamluks took power in Egypt in 1250, when the sultan Turanshah was
      murdered; the shapes from 1250 keep their name.
    sources:
      - "S. Runciman, A History of the Crusades, vol. 3 (1954), pp. 272-3"
  - polity: Mamluk Sultanate (rename step)
    first_year: "AD 1241"
    name: Ayyubid Sultanate
    reason: >-
      Step 3 of 3: in 1241-1249 Damascus, Aleppo, Hama, Homs and Kerak were ruled by
      Ayyubid princes, under or against as-Salih Ayyub of Egypt, who took Damascus in
      October 1245; the Mamluk Sultanate began only in 1250.
    sources:
      - "R. S. Humphreys, From Saladin to the Mongols (1977), ch. 8"
      - "S. Runciman, A History of the Crusades, vol. 3 (1954) (the siege of Damascus, April-October 1245)"

# Years a polity is drawn but did not exist (build-content.ts): cut out of the map.
absent:
  - polity: Kingdom of Commagene
    first_year: "AD 17"
    last_year: "AD 37"
    reason: >-
      When Antiochus III died in AD 17, Rome took Commagene over: in AD 18 Germanicus put it
      under a Roman governor of praetorian rank, Quintus Servaeus, and modern accounts treat
      it as joined to the province of Syria. Caligula gave the kingdom back to Antiochus IV
      in AD 38 (Dio tells it with the events of AD 37). Cliopatria draws it until AD 22.
    sources:
      - "Tacitus, Annals 2.42 (death of Antiochus, AD 17); 2.56 (Servaeus, AD 18)"
      - "Cassius Dio 59.8.2"
      - "Wikipedia, Commagene; Antiochus IV of Commagene (client king AD 38-72)"
  - polity: Kingdom of Armenia
    first_year: "AD 429"
    last_year: "AD 489"
    reason: >-
      Cliopatria draws the Kingdom of Armenia until AD 489. In 428 Bahram V deposed
      Artaxias IV at the nobles' request, abolished the kingdom and appointed a marzban.
    sources:
      - "Wikipedia, Sasanian Armenia (kingdom abolished 428; Marzpanate period)"
      - "Wikipedia, Arsacid dynasty of Armenia (12-428)"
# Years the data leaves a polity off the map although it existed (build-content.ts): its
# shape from just before is drawn on through them.
bridges:
  - polity: Nabataeans
    first_year: "26 BC"
    last_year: "21 BC"
    reason: >-
      Cliopatria leaves the Nabataeans off the map in these years, but Obodas III reigned
      from 30 to 9 BC, and a thousand Nabataeans under his minister Syllaeus marched with
      Aelius Gallus into Arabia (c. 26-24 BC; usually dated 25 BC).
    sources:
      - "Strabo, Geography 16.4.23-24"
      - "Cassius Dio 53.29"
      - "Wikipedia, List of Nabataean kings (Obodas III, 30-9 BC); Aelius Gallus"
  - polity: Kingdom of Commagene
    first_year: "AD 38"
    last_year: "AD 42"
    reason: >-
      Caligula restored the kingdom to Antiochus IV in AD 38; he deposed him again at an
      unknown date, and Claudius restored him in AD 41. Cliopatria draws it again only from
      AD 43.
    sources:
      - "Wikipedia, Antiochus IV of Commagene (client king AD 38-72)"
  - polity: Elam
    first_year: "2701 BC"
    last_year: "2302 BC"
    reason: >-
      Cliopatria leaves Elam off the map between its Proto-Elamite shape around Susa (to
      2701 BC) and 2201 BC. The Old Elamite period begins about 2700 BC; the Awan dynasty
      ruled until the kings of Akkad defeated it.
    sources:
      - "Wikipedia, Elam (Proto-Elamite c. 3200-2700 BC; Old Elamite from c. 2700 BC)"
      - "Wikipedia, Awan dynasty"
  - polity: Kingdom of Urartu
    first_year: "701 BC"
    last_year: "617 BC"
    reason: >-
      Cliopatria leaves Urartu off the map in 701-617 BC and draws Assyria over it. The
      kingdom stood throughout: Rusa II (about 680-639 BC) built Teishebaini (Karmir Blur),
      and Sarduri III, who called Ashurbanipal his "father", and Rusa III followed him.
    sources:
      - "Wikipedia, Urartu (Sarduri III, Rusa III; the Medes took Van in 590 BC)"
      - "Wikipedia, Rusa II (c. 680-639 BC)"
  - polity: Babylonia
    first_year: "801 BC"
    last_year: "730 BC"
    reason: >-
      Cliopatria gives Babylonia to Assyria from 801 BC. Babylon had its own kings, among
      them Nabonassar (747-734 BC) and the usurper Nabu-mukin-zeri (731-729 BC), until
      Tiglath-pileser III took the throne in 729 BC.
    sources:
      - "Wikipedia, Nabonassar; Nabu-mukin-zeri"
      - "Wikipedia, Tiglath-Pileser III (king of Babylon from 729 BC)"
  - polity: Kingdom of Armenia
    first_year: "AD 118"
    last_year: "AD 153"
    reason: >-
      Cliopatria leaves Armenia off the map in AD 118-153 (Roman, then Parthian). Hadrian
      recognised Vologases I as king of all Greater Armenia, a Roman client; after his death
      Antoninus Pius gave the throne to Sohaemus (144).
    sources:
      - "Wikipedia, Vologases I of Armenia (117-c. 140/144)"
      - "Wikipedia, Sohaemus of Armenia"
  - polity: Kingdom of Armenia
    first_year: "AD 371"
    last_year: "AD 386"
    reason: >-
      Cliopatria leaves Armenia off the map in AD 371-386 and draws the Sasanians over it.
      Pap (370-374/375), Varazdat (374-378) and Arshak III reigned, with Roman support,
      until the partition of 387.
    sources:
      - "Wikipedia, Pap of Armenia; Varazdat"
  - polity: Kingdom of Bithynia
    first_year: "84 BC"
    last_year: "79 BC"
    reason: >-
      Cliopatria leaves Bithynia off the map in 88-79 BC. Mithridates VI drove out
      Nicomedes IV in 88 BC, but under the Treaty of Dardanus (85) Sulla sent Curio to
      restore him (84 BC); he reigned until his death in 74 BC.
    sources:
      - "Appian, Mithridatic Wars 58; 60 (livius.org)"
      - "Wikipedia, Nicomedes IV of Bithynia (restored in 84 BC)"
  - polity: Kingdom of Cappadocia
    first_year: "84 BC"
    last_year: "79 BC"
    reason: >-
      Cliopatria leaves Cappadocia off the map in 88-79 BC. Ariobarzanes I, driven out by
      Mithridates in 89/88 BC, was restored under the Treaty of Dardanus (85) and reigned
      until 63/62 BC, though Mithridates held on to part of the country until Sulla
      ordered him to give it up.
    sources:
      - "Appian, Mithridatic Wars 58; 60; 64; 66 (livius.org)"
      - "Wikipedia, Ariobarzanes I of Cappadocia (95 to 63/62 BC)"
  - polity: Galatia
    first_year: "84 BC"
    last_year: "79 BC"
    reason: >-
      Mithridates VI held Galatia from 88 BC and had its tetrarchs killed in 86, all but
      three; the three who escaped raised an army and drove his satrap and garrisons out of
      Galatia. Cliopatria draws Galatia again only from 78 BC; its earlier shape is drawn
      through 84-79 BC.
    sources:
      - "Appian, Mithridatic Wars 46; 58 (livius.org)"
  - polity: Babylonia
    first_year: "721 BC"
    last_year: "710 BC"
    reason: >-
      Babylon under Marduk-apla-iddina II (Merodach-baladan), who reigned from Nisan 721 BC
      until Sargon II drove him out in 710 BC; Cliopatria draws Assyria over it.
    sources:
      - "Babylonian Chronicle ABC 1, i 29-43; ii 1-5 (livius.org)"
      - "Wikipedia, Marduk-apla-iddina II"
  - polity: Kingdom of Armenia
    first_year: "AD 161"
    last_year: "AD 164"
    reason: >-
      Cliopatria leaves Armenia off the map in AD 161-164 and draws Parthia over it. It
      remained a kingdom: Pacorus (Bakur), set up by Vologases IV, reigned in 161-163 and
      Sohaemus was restored by the Romans in 163 or 164.
    sources:
      - "Wikipedia, Pacorus of Armenia; Sohaemus of Armenia"

# Lands an empire took over when a polity ended (build-content.ts): the polity's last shape
# drawn as the empire's for those years, where the empire's own shape does not reach yet.
annexed:
  - polity: Kingdom of Israel
    by: Neo-Assyrian Empire
    first_year: "721 BC"
    last_year: "702 BC"
    reason: >-
      After Samaria fell in 722 BC the northern kingdom became Samerina, a province of the
      Neo-Assyrian Empire; Sargon II, who put down a revolt in which Samaria took part in
      720 BC, organised it under a governor, deported part of its people and settled others
      in its towns. Cliopatria's Assyrian shape reaches the land only from 701 BC, so
      without this the land of Israel was left without a state for twenty years.
    sources:
      - "2 Kgs 17:6, 24"
      - "Wikipedia, Samerina (province established after the conquest of Samaria, c. 722 BC); Sargon II"
  - polity: Kingdom of Commagene
    by: Roman Empire
    first_year: "AD 17"
    last_year: "AD 37"
    reason: >-
      Between the death of Antiochus III (AD 17) and the restoration under Caligula (AD 38),
      Commagene was under direct Roman rule: Tacitus says it was put under a Roman governor
      of praetorian rank in AD 18, and modern accounts treat it as part of the province of
      Syria.
    sources:
      - "Tacitus, Annals 2.42; 2.56"
      - "Wikipedia, Commagene; Antiochus III of Commagene"
  - polity: Kingdom of Pontus
    by: Roman Empire
    first_year: "AD 63"
    last_year: "AD 67"
    reason: >-
      After Polemon II's abdication in AD 62 Pontus was under direct Roman rule; the
      data's Roman shape reaches it only from AD 68.
    sources:
      - "Wikipedia, Polemon II of Pontus; Cappadocia (Roman province) (Pontus added to the province)"
  - polity: Kingdom of Cappadocia
    by: Roman Empire
    first_year: "AD 18"
    last_year: "AD 22"
    reason: >-
      Cappadocia was a Roman province from AD 17; the data's Roman shape reaches it only
      from AD 23.
    sources:
      - "Wikipedia, Cappadocia (Roman province)"
  - polity: Mauretania
    by: Roman Empire
    first_year: "AD 41"
    last_year: "AD 42"
    reason: >-
      Rome annexed Mauretania on Ptolemy's death in AD 40, though it had to put down the
      revolt of Aedemon and a second rising in AD 42 before Claudius organised the two
      provinces; the data's Roman shape reaches it only from AD 43.
    sources:
      - "Wikipedia, Ptolemy of Mauretania (section Annexation of Mauretania)"
  - polity: Neo-Babylonian Empire
    by: Achaemenid Empire
    first_year: "538 BC"
    last_year: "532 BC"
    reason: >-
      Babylonia was Persian from Cyrus's entry in October 539 BC; Cliopatria's Achaemenid
      shape reaches it only from 531 BC.
    sources:
      - "Nabonidus Chronicle (ABC 7) iii 12-16 (livius.org)"
      - "Wikipedia, Fall of Babylon"
  - polity: Achaemenid Empire
    by: Macedonian Empire
    first_year: "329 BC"
    last_year: "328 BC"
    reason: >-
      After Gaugamela (331 BC) and Darius's death (330 BC) the Persian lands were
      Alexander's; Cliopatria's shape of his empire reaches Mesopotamia and Iran only from
      327 BC.
    sources:
      - "Wikipedia, Darius III"
  - polity: Kingdom of Bithynia
    by: Roman Republic
    first_year: "73 BC"
    last_year: "68 BC"
    reason: >-
      Bithynia was Roman from the bequest of Nicomedes IV in 74 BC (overrun by
      Mithridates VI at the start of the Third Mithridatic War and won back by Rome);
      Cliopatria's Roman shape reaches it only from 67 BC.
    sources:
      - "Wikipedia, Nicomedes IV of Bithynia (the bequest led directly to the Third Mithridatic War)"
  - polity: Parthian Empire
    by: Sasanian Empire
    first_year: "AD 225"
    last_year: "AD 237"
    reason: >-
      After Hormozdgan (224) Ardashir I took the Parthian lands and was crowned at
      Ctesiphon, probably in 226; Cliopatria's Sasanian shape reaches Mesopotamia and
      Media only from AD 238.
    sources:
      - "Wikipedia, Ardashir I"
  # Armenia under a marzban: split around AD 439-450, where Cliopatria's own Sasanian
  # shape already covers it.
  - polity: Kingdom of Armenia
    by: Sasanian Empire
    first_year: "AD 429"
    last_year: "AD 438"
    reason: >-
      From 428 Persian Armenia was a Sasanian province governed by a marzban (the
      Marzpanate period); Cliopatria draws the kingdom on, and its Sasanian shape takes the
      land only in 439-450 and from 490.
    sources:
      - "Wikipedia, Sasanian Armenia (Marzpanate period from 428)"
  - polity: Kingdom of Armenia
    by: Sasanian Empire
    first_year: "AD 451"
    last_year: "AD 489"
    reason: >-
      As above: a Sasanian province under a marzban from 428; Cliopatria's Sasanian shape
      takes the land again only from 490.
    sources:
      - "Wikipedia, Sasanian Armenia (Marzpanate period from 428)"
  - polity: Kingdom of Pergamon
    by: Roman Republic
    first_year: "132 BC"
    last_year: "128 BC"
    reason: >-
      The kingdom passed to Rome by Attalus III's will in 133 BC; Rome fought Aristonicus
      for it until 130-129 BC and organised the province of Asia. Cliopatria's Roman shape
      reaches it only from 127 BC.
    sources:
      - "Strabo, Geography 13.4.2"
      - "Livy, Periochae 58-59"
      - "Wikipedia, Attalus III"
  - polity: Kingdom of Pergamon
    by: Roman Republic
    first_year: "84 BC"
    last_year: "79 BC"
    reason: >-
      Under the Treaty of Dardanus (85 BC) Mithridates gave up the province of Asia, which
      Sulla settled and fined in the winter of 85/84 BC; Cliopatria's Roman shape reaches
      it again only from 78 BC. The lands of the old Attalid kingdom are drawn as Roman in
      those years.
    sources:
      - "Appian, Mithridatic Wars 58; 61-63 (Sulla's settlement of Asia) (livius.org)"
      - "Wikipedia, Treaty of Dardanos"
  - polity: Antigonid Macedonia
    by: Greek City-States
    first_year: "167 BC"
    last_year: "166 BC"
    reason: >-
      After Pydna (168 BC) Macedonia was divided into four tribute-paying republics, which
      Cliopatria draws as Greek city-states from 165 BC; the same is drawn from 167 BC.
    sources:
      - "Livy 45.18; 45.29-30"
      - "Wikipedia, Macedonia (Roman province) (four client republics, merides)"
  - polity: Cyrenaica
    by: Roman Republic
    first_year: "95 BC"
    last_year: "93 BC"
    reason: >-
      Rome inherited Cyrenaica by Ptolemy Apion's will in 96 BC; Cliopatria's Roman shape
      reaches it only from 92 BC.
    sources:
      - "Livy, Periochae 70.5"
      - "Wikipedia, Ptolemy Apion"
  - polity: Ptolemaic Kingdom
    by: Roman Empire
    first_year: "29 BC"
    last_year: "29 BC"
    reason: >-
      Egypt was a Roman province from 30 BC; Cliopatria's Roman shape reaches it only from
      28 BC.
    sources:
      - "Cassius Dio 51.17.1"
      - "Wikipedia, Egypt (Roman province) (province from 30 BC)"
  - polity: Thracian Kingdom
    by: Roman Empire
    first_year: "AD 47"
    last_year: "AD 50"
    reason: >-
      Thrace was a Roman province from AD 46; Cliopatria's Roman shape reaches it only from
      AD 51.
    sources:
      - "Wikipedia, Thracia"
  - polity: Ankhwennefer
    by: Ptolemaic Kingdom
    first_year: "185 BC"
    last_year: "172 BC"
    reason: >-
      Upper Egypt with Thebes was Ptolemaic again after Ankhwennefer's defeat in 186 BC;
      Cliopatria's Ptolemaic shape leaves it to Ankhwennefer until 172 BC.
    sources:
      - "Wikipedia, Ankhwennefer (pharaoh); Great Theban Revolt"
  - polity: Rashidun Caliphate
    by: Umayyad Caliphate
    first_year: "AD 662"
    last_year: "AD 665"
    reason: >-
      After al-Hasan's abdication in 661 Mu'awiya's rule was acknowledged throughout the
      caliphate; Cliopatria's Umayyad shape takes in Iraq, Iran and Arabia only from 666.
    sources:
      - "Wikipedia, Mu'awiya I (Hasan abdicated and Mu'awiya's suzerainty was acknowledged throughout the Caliphate)"
  - polity: Tulunids
    by: Abbasid Caliphate
    first_year: "AD 906"
    last_year: "AD 910"
    reason: >-
      Egypt and Syria were Abbasid provinces again after 905; Cliopatria's Abbasid shape
      takes them in only from 911.
    sources:
      - "T. Bianquis, Autonomous Egypt from Ibn Tulun to Kafur, in The Cambridge History of Egypt, vol. 1 (1998)"
      - "Wikipedia, Tulunids"
  - polity: Abbasid Caliphate
    by: Mongol Empire
    first_year: "AD 1259"
    last_year: "AD 1259"
    reason: >-
      Iraq was Hulagu's from 1258; Cliopatria's Mongol shape takes it in only from 1260.
    sources:
      - "J. A. Boyle, Dynastic and Political History of the Il-Khans, in The Cambridge History of Iran, vol. 5 (1968)"
  - polity: Principality of Antioch
    by: Mamluk Sultanate
    first_year: "AD 1269"
    last_year: "AD 1271"
    reason: >-
      Antioch was Baybars' from 1268; Cliopatria's Mamluk shape takes it in only from 1272.
    sources:
      - "S. Runciman, A History of the Crusades, vol. 3 (1954), pp. 324-7"
  - polity: County of Tripoli
    by: Mamluk Sultanate
    first_year: "AD 1290"
    last_year: "AD 1293"
    reason: >-
      Tripoli was Qalawun's from 1289; Cliopatria's Mamluk shape takes it in only from 1294.
    sources:
      - "S. Runciman, A History of the Crusades, vol. 3 (1954), the fall of Tripoli"
  - polity: Kingdom of Jerusalem
    by: Mamluk Sultanate
    first_year: "AD 1292"
    last_year: "AD 1293"
    reason: >-
      The coast from Acre to Atlit was the Mamluks' from 1291; Cliopatria's Mamluk shape
      takes it in only from 1294.
    sources:
      - "S. Runciman, A History of the Crusades, vol. 3 (1954), the fall of Acre"

# Years a polity was a vassal or client (build-content.ts): drawn in the overlord's colour,
# lighter, with the label as a second line. Checked against the sources in two passes
# (draft and review, 2026-10-02).
vassals:
  - polity: Kingdom of Judah
    of: Neo-Assyrian Empire
    first_year: "c. 734 BC"
    last_year: "705 BC"
    label:
      en: "under Assyria"
      ru: "под Ассирией"
    reason: >-
      Threatened by Israel and Aram-Damascus, Ahaz declared himself the
      servant of Tiglath-pileser III and sent him silver and gold; Assyrian
      lists put "Jehoahaz (Ahaz) of the land Judah" among the western
      rulers who paid tribute, a group the RINAP editors date to 734 BC.
      Judah stayed tributary until Hezekiah joined the rebellion that broke
      out after Sargon II died in 705 BC.
    sources:
      - "2 Kgs 16:7-8"
      - "2 Kgs 18:7"
      - "RINAP 1, Tiglath-pileser III 47 (Nimrud tablet K 3751), rev. 10'-12' and editors' note 21 (oracc.museum.upenn.edu/rinap/rinap1/Q003460)"
      - "Wikipedia, Sennacherib's campaign in the Levant (rebellion after Sargon II's death in 705 BC)"

  - polity: Kingdom of Judah
    of: Neo-Assyrian Empire
    first_year: "701 BC"
    last_year: "c. 630 BC"
    label:
      en: "under Assyria"
      ru: "под Ассирией"
    reason: >-
      After Sennacherib's 701 BC campaign Hezekiah submitted, paid a heavy
      tribute and kept his throne as a reduced vassal; his son Manasseh is
      named among the western kings who served Esarhaddon (hauling building
      materials to Nineveh) and Ashurbanipal (bringing gifts and troops for
      his campaign against Egypt).
      Assyrian control of the west faded as the empire declined in the 630s,
      so the end date is approximate.
    sources:
      - "2 Kgs 18:13-16"
      - "RINAP 3, Sennacherib 22 (Chicago/Taylor prism) ii 73 - iii 49 (oracc.museum.upenn.edu/rinap/rinap3/Q003496)"
      - "RINAP 4, Esarhaddon 1 (Nineveh prism) v 54 - vi 1: Manasseh, king of Judah, among the kings ordered to supply building materials (oracc.museum.upenn.edu/rinap/rinap4/Q003230)"
      - "RINAP 5, Ashurbanipal 6, ii 25'-52': Manasseh, king of the land Judah, among the 22 kings called servants who belonged to him (oracc.museum.upenn.edu/rinap/rinap5/Q003705)"
      - "Wikipedia, History of ancient Israel and Judah (Judah a vassal of Assyria; Assyrian power collapsed in the 630s)"

  - polity: Kingdom of Judah
    of: Twenty-sixth Dynasty of Egypt
    first_year: "609 BC"
    last_year: "605 BC"
    label:
      en: "under Egypt"
      ru: "под Египтом"
    reason: >-
      After Josiah fell at Megiddo, Pharaoh Necho II deposed Jehoahaz,
      made Jehoiakim king and imposed a tribute of silver and gold on Judah.
      Egyptian overlordship ended when Nebuchadnezzar defeated the Egyptians
      at Carchemish in 605 BC; Jehoiakim then submitted to Babylon.
    sources:
