      After Sennacherib's 701 BC campaign Hezekiah submitted, paid a heavy tribute and kept his throne as a reduced vassal; his son Manasseh is named among the western kings who served Esarhaddon (hauling building materials to Nineveh) and Ashurbanipal (bringing gifts and troops for his campaign against Egypt). Assyrian control of the west faded as the empire declined in the 630s, so the end date is approximate.
    sources:
