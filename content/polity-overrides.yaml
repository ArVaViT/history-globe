# Corrections on top of Cliopatria for the biblical Levant (borders audit, 2026-09-29).
# An entry keeps a polity on the map for more years, reusing Cliopatria's last shape of
# it, or ends it sooner when Cliopatria keeps it too long. The shape is approximate: Judah's borders moved under Hezekiah and Josiah.
#
# The year a place changes hands: a place passes to the state that took it in the year of
# the event that tells it (events.yaml, battles.yaml), so the map in an event's year shows
# its outcome. The old state's last year is the year before (Samaria falls in 722 BC: Israel
# is drawn to 723 BC, Assyria from 722). The content build refuses an event, battle,
# question map or tour stop whose place changes state the year after it (TRANSFER_LAG in
# scripts/build-content.ts lists the real exceptions).
overrides:
  - polity: Kingdom of Judah
    last_year: "587 BC"
    reason: >-
      Cliopatria ends Judah in 702 BC, after Sennacherib's campaign. Judah remained a kingdom, vassal in turn to Assyria, Egypt and Babylon, until Jerusalem fell in 587 or 586 BC. The atlas dates the fall 586 BC (event jerusalem-falls), the first year the map shows the land as Babylon's.
    sources:
      - "2 Kgs 18-25"
      - "Jer 39:1-10; 52:4-16"
  - polity: Hamdanid Emirates
    last_year: "AD 1004"
    reason: >-
      Cliopatria draws the Hamdanids over Syria and the Jazira until 1259. The dynasty lost Mosul by 979 and Aleppo, its last seat, in 1004; Syria then passed to the Mirdasids, the Fatimids and from the 1070s the Seljuks, which the map shows.
    sources:
      - "M. Canard, Hamdanids, Encyclopaedia of Islam, 2nd ed., vol. 3 (1971)"
      - "H. Kennedy, The Prophet and the Age of the Caliphates, 3rd ed. (2016), ch. 9"
  - polity: Lakhmid Kingdom
    last_year: "AD 602"
    reason: >-
      Cliopatria draws the Lakhmid kingdom over al-Hira again in 629-633. The dynasty ended when Khosrow II deposed al-Nu'man III in 602; al-Hira was then held by Iyas ibn Qabisa of Tayyi' and a Persian governor until Khalid ibn al-Walid took it in 633.
    sources:
      - "I. Shahîd, Lakhmids, Encyclopaedia of Islam, 2nd ed., vol. 5 (1986)"
      - "G. Fisher, Between Empires: Arabs, Romans, and Sasanians in Late Antiquity (2011)"
  - polity: Ziyadid dynasty
    last_year: "AD 1018"
    reason: >-
      Cliopatria keeps the Ziyadids of Zabid until 1138. The last Ziyadid was murdered in 1018 and power passed to his slave regents Nafis and Najah, whose Najahid line held the Tihama from 1022; Cliopatria's later Ziyadid shapes belong to the Najahids and Sulayhids.
    sources:
      - "C. E. Bosworth, The New Islamic Dynasties (1996), s.v. Ziyadids"
      - "G. R. Smith, Ziyadids, Encyclopaedia of Islam, 2nd ed., vol. 11 (2002)"
  - polity: Caliphate of Córdoba
    last_year: "AD 1031"
    reason: >-
      Cliopatria draws the Caliphate of Córdoba around Córdoba until 1071. The caliphate was abolished in 1031; Córdoba then became a taifa under the Banu Jahwar, which al-Mu'tamid of Seville annexed in 1070.
    sources:
      - "H. Kennedy, Muslim Spain and Portugal: A Political History of al-Andalus (1996)"
      - "C. E. Bosworth, The New Islamic Dynasties (1996), s.v. Spanish Umayyads"
  - polity: Latin Empire
    last_year: "AD 1260"
    reason: >-
      Cliopatria keeps the Latin Empire in Constantinople until 1278. Michael VIII's general Alexios Strategopoulos retook the city on 25 July 1261 and the Byzantine Empire was restored there (event constantinople-1261): the city is the restored empire's from 1261 (annexed).
    sources:
      - "R. L. Wolff, The Latin Empire of Constantinople, 1204-1261, in K. M. Setton (ed.), A History of the Crusades, vol. 2 (1969)"
      - "D. M. Nicol, The Last Centuries of Byzantium, 1261-1453, 2nd ed. (1993)"
  - polity: Almohad Caliphate
    last_year: "AD 1269"
    reason: >-
      Cliopatria draws the Almohads over all of Morocco until 1343. By 1248 the Marinids held Fez, and in 1269 they took Marrakesh, where the last Almohad caliph, Idris al-Wathiq, was killed.
    sources:
      - "A. K. Bennison, The Almoravid and Almohad Empires (2016)"
      - "C. E. Bosworth, The New Islamic Dynasties (1996), s.v. Almohads"
  - polity: Assyrian Egypt
    last_year: "652 BC"
    reason: >-
      Cliopatria draws "Assyrian Egypt" for 650-615 BC over the whole Assyrian realm, from Egypt to Iran, on top of the Neo-Assyrian Empire, which already includes Egypt in those years: every land was tinted twice and named twice. Assyrian rule in Egypt had ended by 656 BC, when Psamtik I reunited the country; the duplicate is dropped.
    sources:
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 13"
      - "A. K. Grayson, Assyrian Rule of Conquered Territory in Ancient Western Asia, in J. M. Sasson (ed.), Civilizations of the Ancient Near East (1995)"
  - polity: Hyksos
    last_year: "1550 BC"
    reason: >-
      Cliopatria draws the Hyksos over Canaan and Syria until 1400 BC. Their rule ended when Ahmose I took Avaris and then Sharuhen, about 1550 BC; the Levant after it was a land of Canaanite city-states under Egyptian overlordship, which Cliopatria does not draw, so it is left without a state rather than given the wrong one.
    sources:
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 8 (J. Bourriau)"
      - "D. B. Redford, Egypt, Canaan, and Israel in Ancient Times (1992), ch. 5"
  - polity: Kingdom of Israel
    last_year: "723 BC"
    reason: >-
      Samaria fell after a three-year siege by Shalmaneser V; the Babylonian Chronicle says he "ravaged Samaria" in his short reign (727-722 BC), and 2 Kings dates the capture to Hoshea's ninth year. Sargon II later claimed the conquest and in 720 BC put down a revolt in which Samaria took part, which is why some scholars write c. 720; 722 BC is the usual textbook year for the end of the kingdom, the year of the event samaria-falls, and the first year the map shows Samaria as Assyria's (annexed).
    sources:
      - "2 Kgs 17:5-6"
      - "2 Kgs 18:9-10"
      - "Babylonian Chronicle ABC 1, i 27-28 (livius.org)"
      - "Wikipedia, Shalmaneser V; Sargon II; Hoshea"
  - polity: Kingdom of Commagene
    last_year: "AD 72"
    reason: >-
      Cliopatria draws Commagene until AD 77. Vespasian deposed Antiochus IV and annexed the kingdom for good in AD 72.
    sources:
      - "Wikipedia, Commagene; Antiochus IV of Commagene"

  - polity: Neo-Assyrian Empire
    last_year: "611 BC"
    reason: >-
      Nineveh fell to the Medes and Babylonians in 612 BC; the last king, Ashur-uballit II, held out at Harran until the Babylonians and the Medes took it in 610 BC (event harran-falls), and his attempt to retake it in 609 failed. Cliopatria draws the empire until 601 BC; the map ends it in 611 BC. Harran is Babylon's from 610 (extends); the heartland around Nineveh and Assur, which the Medes and the Babylonians divided in ways the sources do not draw, is left without a state until Cliopatria's shapes of 600 BC.
    sources:
      - "Babylonian Chronicle ABC 3 (Fall of Nineveh Chronicle)"
      - "Wikipedia, Ashur-uballit II; Fall of Nineveh"
  - polity: Kingdom of Pontus
    last_year: "AD 62"
    reason: >-
      Cliopatria draws the kingdom of Pontus until AD 67. Nero made Polemon II abdicate in AD 62 and Pontus became part of a Roman province.
    sources:
      - "Wikipedia, Polemon II of Pontus; Kingdom of Pontus"
  - polity: Kingdom of Cappadocia
    last_year: "AD 16"
    reason: >-
      Cliopatria draws the kingdom of Cappadocia until AD 22. Archelaus died in Rome in AD 17 and Tiberius made Cappadocia a province (the Cappadocia article): the kingdom is drawn to AD 16 and its land as Rome's from AD 17, the year of the event (annexed).
    sources:
      - "Tacitus, Annals 2.42"
      - "Cassius Dio 57.17.3-7"
      - "Wikipedia, Cappadocia (Roman province); Archelaus of Cappadocia"
  - polity: Mauretania
    last_year: "AD 40"
    reason: >-
      Cliopatria draws the kingdom of Mauretania until AD 42. Caligula had its last king, Ptolemy, executed in AD 40 and Rome annexed the kingdom.
    sources:
      - "Wikipedia, Ptolemy of Mauretania"
  - polity: Hittites
    last_year: "1180 BC"
    reason: >-
      Cliopatria draws the Hittite kingdom until 1151 BC. It ended about 1180 BC in the collapse at the end of the Bronze Age, when Hattusa was burnt and abandoned; the Neo-Hittite states of Syria and southern Anatolia took its place.
    sources:
      - "Wikipedia, Hittites (Hattusa burnt around 1180 BC; New Kingdom 1500-1180 BC)"
      - "Wikipedia, Hattusa (destroyed with the Hittite state around 1200 BC)"
  - polity: Neo-Hittite states
    last_year: "741 BC"
    reason: >-
      Cliopatria ends the Neo-Hittite (Syro-Hittite) states in 801 BC and gives their lands to Assyria from then. They remained kingdoms, at times tributary to Assyria, until Tiglath-pileser III and Sargon II took them one by one: Arpad in 740, Unqi in 738, Carchemish in 717, Melid in 712, Gurgum in 711 and Kummuh in 708 BC. Drawn on to 741 BC, the year before the first annexation; the shape cannot be split by state.
    sources:
      - "Wikipedia, Tiglath-Pileser III (Arpad taken in 740 BC; provinces south of Arpad in 738 BC)"
      - "Wikipedia, Carchemish (taken by Sargon II in 717 BC, the last ruler of the House of Astiruwa)"
      - "Wikipedia, Sargon II (Melid 712, Gurgum 711, Kummuh 708 BC)"
      - "Wikipedia, Kummuh (a tributary state allied with Assyria from the 9th to the mid-8th century BC)"
  - polity: Neo-Babylonian Empire
    last_year: "540 BC"
    reason: >-
      Cliopatria draws the Neo-Babylonian Empire until 532 BC. After the battle of Opis the army of Cyrus entered Babylon without a battle in October 539 BC and Nabonidus was captured; the empire ended. The map shows Babylon as Persian from 539 BC, the year of the event babylon-taken (annexed).
    sources:
      - "Nabonidus Chronicle (ABC 7) iii 12-16 (livius.org)"
      - "Wikipedia, Fall of Babylon (Persian forces entered Babylon on 12 October 539 BC)"
  - polity: Achaemenid Empire
    last_year: "331 BC"
    reason: >-
      Cliopatria draws the Achaemenid Empire over Mesopotamia and Iran until 328 BC. Alexander won at Gaugamela on 1 October 331 BC and took Babylon and Susa that year (clips) and Persepolis early in 330 BC (event persepolis-burned); Darius III was killed by Bessus in 330 BC. The empire is drawn to 331 BC and its land as Alexander's from 330 (annexed).
    sources:
      - "Wikipedia, Darius III (reigned 336 BC to his death in 330 BC)"
      - "Wikipedia, Battle of Gaugamela (1 October 331 BC)"
  - polity: Kingdom of Bithynia
    last_year: "75 BC"
    reason: >-
      Cliopatria draws Bithynia until 68 BC. Nicomedes IV bequeathed the kingdom to Rome in 74 BC, one of his last acts as king, and it became a Roman province (the Bithynia article): the kingdom is drawn to 75 BC and its land as Rome's from 74 BC, the year of the bequest (annexed).
    sources:
      - "Appian, Mithridatic Wars 71 (livius.org)"
      - "Livy, Periochae 93 (livius.org)"
      - "Wikipedia, Nicomedes IV of Bithynia (bequeathed the kingdom to Rome in 74 BC)"
      - "Wikipedia, Bithynia (bequeathed to the Roman Republic in 74 BC)"
  - polity: Parthian Empire
    last_year: "AD 224"
    reason: >-
      Cliopatria draws the Parthian Empire over Mesopotamia and Media until AD 237. Artabanus IV was defeated and killed by Ardashir I at Hormozdgan on 28 April 224, the end of the Arsacid era; Ardashir was crowned at Ctesiphon, probably in 226.
    sources:
      - "Wikipedia, Battle of Hormozdgan (28 April 224)"
      - "Wikipedia, Ardashir I (coronation at Ctesiphon in 226 according to Wiesehöfer)"
  - polity: Kingdom of Pergamon
    last_year: "134 BC"
    reason: >-
      Cliopatria draws the Attalid kingdom until 128 BC. Attalus III died in 133 BC and left his kingdom to the Roman people. Aristonicus, who claimed the throne as Eumenes III, fought Rome for it until the consul Perperna took his surrender in 130 BC; the revolt was over by 129 BC, and the land became the province of Asia. Drawn as Rome's from 133 BC, the year of the bequest (event pergamum-bequeathed; annexed).
    sources:
      - "Strabo, Geography 13.4.2 (Attalus Philometor reigned five years and left the Romans his heirs; they made the country a province, Asia) (LacusCurtius)"
      - "Livy, Periochae 58-59 (livius.org)"
      - "Wikipedia, Attalus III (138-133 BC; the uprising of Aristonicus put down in 129 BC)"
  - polity: Antigonid Macedonia
    last_year: "169 BC"
    reason: >-
      Cliopatria draws the Antigonid kingdom until 166 BC. Aemilius Paullus defeated Perseus at Pydna in 168 BC; the monarchy was abolished and Macedonia was divided into four tribute-paying republics (merides). Cliopatria draws them as Greek city-states from 165 BC; the map does from 168 BC, the year of Pydna (annexed).
    sources:
      - "Livy 44.40-42 (Pydna); 45.18 (the Senate's decision: Macedonia free, in four regions, paying half the old tribute); 45.29-30 (the four regions) (Perseus)"
      - "Wikipedia, Battle of Pydna (168 BC; the kingdom dissolved and replaced with four republics)"
      - "Wikipedia, Macedonia (Roman province) (four client republics, merides; province from 148/146 BC)"
  - polity: Cyrenaica
    last_year: "97 BC"
    reason: >-
      Cliopatria draws the kingdom of Ptolemy Apion until 93 BC. Apion died in 96 BC and left Cyrenaica to the Roman people (the Cyrene article); the Senate declared its cities free and made it a province only in 74 BC, but the kingdom ended in 96. Drawn to 97 BC and as Rome's from 96 BC, the year of the will (annexed).
    sources:
      - "Livy, Periochae 70.5 (Ptolemy Apion of Cyrene makes the Roman people his heir; the Senate frees the towns) (livius.org)"
      - "Wikipedia, Ptolemy Apion (died 96 BC); Crete and Cyrenaica (Cyrenaica annexed as a province in 74 BC)"
  - polity: Ptolemaic Kingdom
    last_year: "31 BC"
    reason: >-
      Cliopatria draws the Ptolemaic kingdom in Egypt until 29 BC. Octavian took Alexandria in 30 BC, Cleopatra VII died, and Egypt was made a tributary province under Cornelius Gallus. Drawn as Rome's from 30 BC, the year of the event egypt-roman (annexed).
    sources:
      - "Cassius Dio 51.9-17 (51.17.1: he made Egypt tributary and gave it in charge of Cornelius Gallus) (LacusCurtius)"
      - "Wikipedia, Ptolemaic Kingdom (ended with the death of Cleopatra VII in 30 BC)"
  - polity: Thracian Kingdom
    last_year: "AD 46"
    reason: >-
      Cliopatria draws the Thracian (Sapaean) kingdom until AD 50. Its last king, Rhoemetalces III, was murdered (in AD 44 or 46; the accounts differ), and Claudius annexed the kingdom as the province of Thracia in AD 46.
    sources:
      - "Wikipedia, Thracia (Claudius annexed the kingdom as a province in AD 46)"
      - "Wikipedia, Sapaean kingdom (Roman client state until AD 46); Rhoemetalces III (murdered in AD 44)"
  - polity: Ankhwennefer
    last_year: "186 BC"
    reason: >-
      Cliopatria draws the Theban kingdom of Ankhwennefer (Chaonnophris) until 172 BC. The Ptolemaic army retook Thebes in 191 BC, and on 27 August 186 BC Komanos defeated his Egyptian and Nubian army south of Aswan, ending the Great Revolt of the Thebaid; Upper Egypt was Ptolemaic again.
    sources:
      - "Wikipedia, Ankhwennefer (pharaoh) (rule c. 201/200 to 187/186 BC; Thebes captured in 191; defeated c. 186 BC)"
      - "Wikipedia, Great Theban Revolt (Komanos defeated Chaonnophris south of Aswan on 27 August 186 BC)"
      - "W. Clarysse, The Great Revolt of the Egyptians (205-186 BC)"
  - polity: Rashidun Caliphate
    last_year: "AD 661"
    reason: >-
      Cliopatria draws the Rashidun Caliphate over Iraq, Iran and Arabia until 665, beside the Umayyads in Syria and Egypt. Ali was murdered in January 661; his son al-Hasan made peace with Mu'awiya and abdicated in the summer of 661, and Mu'awiya entered Kufa and was recognised as caliph. The lands are drawn as the Umayyads' from 662 (annexed).
    sources:
      - "W. Madelung, The Succession to Muhammad (1997), ch. 7"
      - "Wikipedia, Hasan ibn Ali (caliph January-August 661); Mu'awiya I (entered Kufa in July or September 661 and was recognised as caliph)"
  - polity: Tulunids
    last_year: "AD 905"
    reason: >-
      Cliopatria draws the Tulunids over Egypt and Syria until 910. The Abbasid army of Muhammad ibn Sulayman al-Katib took Damascus in 904 and came before Fustat in January 905; the last Tulunid, Shayban, surrendered, and Egypt and Syria were ruled by the caliph's governors again (annexed).
    sources:
      - "T. Bianquis, Autonomous Egypt from Ibn Tulun to Kafur, 868-969, in C. F. Petry (ed.), The Cambridge History of Egypt, vol. 1 (1998)"
      - "C. E. Bosworth, The New Islamic Dynasties (1996), s.v. Tulunids (868-905)"
      - "Wikipedia, Tulunids (autonomous from 868 until 905); Muhammad ibn Sulayman al-Katib"
  - polity: County of Edessa
    last_year: "AD 1150"
    reason: >-
      Cliopatria draws the county until 1151. Joscelin II was taken prisoner by Nur ad-Din's men in 1150, and his wife Beatrice sold Turbessel and what was left of the county to the emperor Manuel I; Nur ad-Din and the Sultan of Rum took those lands within a year.
    sources:
      - "S. Runciman, A History of the Crusades, vol. 2 (1952)"
      - "Wikipedia, County of Edessa; Joscelin II, Count of Edessa"
  - polity: Abbasid Caliphate
    last_year: "AD 1257"
    reason: >-
      Cliopatria draws the Abbasid Caliphate over Iraq until 1259. Hulagu took Baghdad, where the caliph al-Musta'sim surrendered on 10 February 1258 and was put to death; Iraq passed to the Mongols, from 1258 on the map (event baghdad-1258; annexed). The caliphs later kept at Cairo by the Mamluks held no land.
    sources:
      - "S. Runciman, A History of the Crusades, vol. 3 (1954), the fall of Baghdad"
      - "J. A. Boyle, Dynastic and Political History of the Il-Khans, in The Cambridge History of Iran, vol. 5 (1968)"
      - "Wikipedia, Siege of Baghdad (1258)"
  - polity: Principality of Antioch
    last_year: "AD 1267"
    reason: >-
      Cliopatria draws the principality until 1271. Baybars took Antioch by storm on 18 May 1268; Bohemond VI kept only the title and the county of Tripoli, and the city and its land were the Mamluks' from then, 1268 on the map (event antioch-1268; annexed).
    sources:
      - "S. Runciman, A History of the Crusades, vol. 3 (1954), pp. 324-7"
      - "Wikipedia, Siege of Antioch (1268)"
  - polity: County of Tripoli
    last_year: "AD 1289"
    reason: >-
      Cliopatria draws the county until 1293. Qalawun took Tripoli by assault on 26 April 1289 and had it razed; the county ended and its land was the Mamluks' (annexed).
    sources:
      - "S. Runciman, A History of the Crusades, vol. 3 (1954), the fall of Tripoli"
      - "Wikipedia, Fall of Tripoli (1289)"
  - polity: Kingdom of Jerusalem
    last_year: "AD 1290"
    reason: >-
      Cliopatria draws the coastal kingdom until 1293. Al-Ashraf Khalil took Acre on 18 May 1291; Tyre, Sidon, Beirut and Haifa were given up in the following weeks and Atlit, the last castle, on 14 August, and nothing of the kingdom was left on the mainland: the Mamluks' from 1291 on the map (event acre-1291; annexed).
    sources:
      - "S. Runciman, A History of the Crusades, vol. 3 (1954), the fall of Acre"
      - "Wikipedia, Siege of Acre (1291)"
  - polity: Twenty-sixth Dynasty of Egypt
    last_year: "526 BC"
    reason: >-
      Cliopatria draws the Twenty-sixth Dynasty in Egypt until 501 BC. Cambyses defeated Psamtik III at Pelusium in 525 BC, took Memphis and made Egypt a Persian satrapy; Cyprus and the Libyans submitted to him the same year (annexed).
    sources:
      - "Herodotus 3.10-16; 3.19"
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 13 (A. B. Lloyd, The Late Period)"
  - polity: Thirtieth Dynasty of Egypt
    last_year: "344 BC"
    reason: >-
      Cliopatria draws the Thirtieth Dynasty until 338 BC. Artaxerxes III took Pelusium and Memphis in the winter of 343/342 BC; Nectanebo II fled south, and Egypt was a Persian satrapy again until Alexander came in 332 BC (annexed).
    sources:
      - "Diodorus Siculus 16.46-51"
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 13 (A. B. Lloyd, The Late Period)"
  - polity: Ostrogoths
    last_year: "AD 492"
    reason: >-
      Cliopatria draws Theoderic's Ostrogoths over northern Italy until AD 499 beside the Ostrogothic Kingdom of 500. From the fall of Ravenna in 493 they are the Ostrogothic Kingdom, drawn from then (starts).
    sources:
      - "Anonymus Valesianus, Pars Posterior 11.53-56"
      - "J. Moorhead, Theoderic in Italy (1992), ch. 1"
  - polity: Carthage
    last_year: "147 BC"
    reason: >-
      Cliopatria draws Carthage until 146 BC. Scipio Aemilianus took and destroyed the city in the spring of 146 BC (event carthage-destroyed), and its land became the province of Africa: the map shows it as Rome's from 146 BC (annexed).
    sources:
      - "Appian, Punic Wars 127-135"
      - "Polybius 38.19-22"
  - polity: Achaean League
    last_year: "147 BC"
    reason: >-
      Cliopatria draws the Achaean League until 146 BC. Lucius Mummius defeated the League's army and sacked Corinth in 146 BC (event corinth-destroyed); the League was dissolved and its cities put under the governor of Macedonia. The map shows them as Rome's from 146 BC (annexed).
    sources:
      - "Pausanias 7.15-16"
      - "Polybius 38.9-18"

  - polity: Philistia
    last_year: "605 BC"
    reason: >-
      Cliopatria ends Philistia in 702 BC and draws its cities as Assyria's own land from 701. They stayed kingdoms: in 701 BC Sennacherib gave Judah's lost towns to his vassal kings of Ashdod, Ekron and Gaza; Esarhaddon and Ashurbanipal list kings of Gaza, Ashkelon, Ekron and Ashdod among their vassals, and Padi's successor Ikausu dedicated a temple at Ekron. Philistia is drawn on, under Assyria to 630 BC (vassals), until Nebuchadnezzar took and destroyed Ashkelon in 604 BC (event ashkelon-destroyed) and the plain passed to Babylon (annexed).
    sources:
      - "RINAP 3, Sennacherib 22, iii 27b-37a"
      - "RINAP 4, Esarhaddon 1, v 54-vi 1"
      - "S. Gitin, T. Dothan and J. Naveh, A Royal Dedicatory Inscription from Ekron, Israel Exploration Journal 47 (1997)"
      - "Babylonian Chronicle ABC 5, obv. 18-20 (A. K. Grayson, Assyrian and Babylonian Chronicles, 1975)"

  # Map sweep, fourth batch (2026-11-24): Macedonia, Asia Minor, Cyprus, Syria and
  # Mesopotamia.
  - polity: Galatia
    last_year: "26 BC"
    reason: >-
      Cliopatria ends the kingdom of Galatia in 27 BC. Amyntas was killed in 25 BC and Augustus made his kingdom a province (the Galatia, Antioch of Pisidia and Iconium articles; the question where-was-galatia): the kingdom is drawn with its last shape to 26 BC, under Rome (vassals), and the province from 25 BC.
    sources:
      - "Cassius Dio 53.26.3"
      - "S. Mitchell, Anatolia: Land, Men, and Gods in Asia Minor, vol. 1 (1993), 61-63"
  - polity: Median Kingdom
    last_year: "551 BC"
    reason: >-
      Cliopatria ends the Median kingdom in 552 BC. The Nabonidus Chronicle puts Cyrus' victory over Astyages and the plunder of Ecbatana in the sixth year of Nabonidus, 550/549 BC (event astyages-defeated; the Ecbatana article): Media is drawn to 551 BC and as Persian from 550 BC (starts).
    sources:
      - "Nabonidus Chronicle (ABC 7) ii 1-4 (livius.org)"
      - "P. Briant, From Cyrus to Alexander: A History of the Persian Empire (2002), 31-33"
  - polity: Rhodes
    last_year: "AD 43"
    reason: >-
      Cliopatria draws Rhodes as a state only in 189-166 BC, with Lycia and Caria, and the island as Roman from 165 BC. Rome freed Lycia and Caria from Rhodes in 167 BC, but the island stayed a free city, Rome's ally by the treaty of 164 BC (the Rhodes article calls it a friend of Rome), until Claudius took its freedom away in AD 44. Drawn on as the island alone (clips), under Rome (vassals); it was free again in AD 53-72 (bridges).
    sources:
      - "Polybius 30.5; 30.31"
      - "Cassius Dio 60.24.4"
      - "R. M. Berthold, Rhodes in the Hellenistic Age (1984)"
# A change of shape Cliopatria puts at a round year, moved to the year it happened
# (build-content.ts): the shapes that begin in `data_year` begin in `first_year`, and the
# shapes before them end then.
# Only for a change no neighbour shares: when the neighbours' shapes change in the same
# round year, the build refuses the seam (it would draw one state over another), and a clip
# of the land that changed hands is used instead (Hattin 1187, Acre 1191, Larsa 1763 BC).
seams:
  - polity: Kingdom of Israel
    data_year: "901 BC"
    first_year: "931 BC"
    reason: >-
      Cliopatria divides the kingdom of David and Solomon at the turn of the century, in 901 BC. The northern tribes made Jeroboam king at Shechem on Solomon's death, which Thiele's chronology, the one the map's events follow, puts in 931/930 BC; the map shows the divided kingdoms from 931 BC, the year of the event kingdom-divided. Shishak's campaign against Rehoboam (c. 925 BC) falls after it.
    sources:
      - "1 Kgs 11:42-12:20; 14:25"
      - "E. R. Thiele, The Mysterious Numbers of the Hebrew Kings, new rev. ed. (1983)"
      - "K. A. Kitchen, On the Reliability of the Old Testament (2003), ch. 2"
  - polity: Kingdom of Judah
    data_year: "901 BC"
    first_year: "931 BC"
    reason: >-
      Judah under Rehoboam from the division of the kingdom, as for Israel above: Cliopatria's first shape of Judah is drawn from 931 BC instead of 901.
    sources:
      - "1 Kgs 12:16-24"
      - "E. R. Thiele, The Mysterious Numbers of the Hebrew Kings, new rev. ed. (1983)"
  # The Parthian invasion of Syria, Phoenicia and Judea (Map leftovers, 2026-11-24).
  - polity: Parthian Empire
    data_year: "41 BC"
    first_year: "40 BC"
    reason: >-
      Cliopatria draws Syria, Phoenicia and the Decapolis as Parthian from 41 BC. Pacorus and Barzapharnes, with Quintus Labienus, crossed the Euphrates in the spring of 40 BC, in the consulship of Calvinus and Pollio, took Syria and Phoenicia but Tyre, and in the same year took Jerusalem and made Antigonus king (event parthians-jerusalem); the Senate made Herod king against him that winter (event herod-made-king), and the map's vassal years of Judea under Parthia already run from 40 BC. The Parthian shape of 41-37 BC is drawn from 40 BC, the year of the events, and the land is Rome's, as in 42 BC, until then.
    sources:
      - "Cassius Dio 48.24.3-26.5"
      - "Josephus, Antiquities 14.330-369; Jewish War 1.248-273"
      - "Plutarch, Antony 30.1; 33.1"
  - polity: Roman Republic
    data_year: "41 BC"
    first_year: "40 BC"
    reason: >-
      As above: Rome's shape of 42 BC, with Syria, is drawn through 41 BC and its shape without Syria from 40 BC, the year the Parthians invaded.
    sources:
      - "Cassius Dio 48.24.3-26.5"
  - polity: Judea
    data_year: "41 BC"
    first_year: "40 BC"
    reason: >-
      As above: Judea's shape of 41-37 BC, cut back where Cliopatria gives the land east of the Jordan to the Parthians, is drawn from 40 BC.
    sources:
      - "Josephus, Antiquities 14.330-369"
  - polity: Kingdom of Osroene
    data_year: "41 BC"
    first_year: "40 BC"
    reason: >-
      As above: Osroene's shape of 41-37 BC, drawn back from the land the Parthian shape of those years takes west of it, is drawn from 40 BC.
    sources:
      - "Cassius Dio 48.24.3-26.5"

starts:
  - polity: Kingdom of Israel
    first_year: "1050 BC"
    reason: >-
      Cliopatria begins the kingdom of Israel in 1000 BC, so Saul's reign and the years of David's before it showed the hills of Judah and Israel without a state. David reigned forty years, seven in Hebron and thirty-three in Jerusalem, and Solomon's reign begins about 970 BC: David's begins about 1010 BC. Saul was made king about 1050 BC (the length of his reign is lost from 1 Sam 13:1; the map's events and tours date him so). Until 1011 BC the shape is cut to Saul's kingdom (clips).
    sources:
      - "1 Sam 10:17-11:15; 13:1; 2 Sam 5:4-5; 1 Kgs 2:11"
      - "E. R. Thiele, The Mysterious Numbers of the Hebrew Kings (1983), ch. 2"
      - "Y. Aharoni, The Land of the Bible: A Historical Geography, rev. ed. (1979)"
  - polity: Hyksos
    first_year: "1650 BC"
    reason: >-
      Cliopatria draws the Hyksos over Canaan from 1800 BC. Their rule, the Fifteenth Dynasty in Lower Egypt, began about 1650 BC; before it Canaan was a land of city-states, which Cliopatria does not draw.
    sources:
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 8 (J. Bourriau)"
      - "K. S. B. Ryholt, The Political Situation in Egypt during the Second Intermediate Period (1997)"
  - polity: Twenty-sixth Dynasty of Egypt
    first_year: "656 BC"
    reason: >-
      Psamtik I, founder of the Twenty-sixth Dynasty, was king from 664 BC under Assyria; by 656 BC, when his daughter Nitocris was adopted as God's Wife of Amun at Thebes, he held all Egypt and had thrown off Assyrian rule. Cliopatria draws the dynasty only from 615 BC and Assyria over Egypt until then.
    sources:
      - "Wikipedia, Psamtik I (Thebes in 656 BC; all Egypt by 654 BC)"
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 13 (A. B. Lloyd, The Late Period)"
  - polity: Hittites
    first_year: "1650 BC"
    reason: >-
      Cliopatria begins the Hittite kingdom in 1600 BC. Labarna, who took the name Hattusili I, made Hattusa the capital about 1650 BC (middle chronology); his successor Mursili I sacked Babylon in 1595 BC.
    sources:
      - "Wikipedia, Hittites (capital at Hattusa around 1650 BC; Babylon sacked 1595 BC, middle chronology)"
      - "Wikipedia, Hattusili I (1650-1620 BC, middle chronology)"
  - polity: Kingdom of Urartu
    first_year: "860 BC"
    reason: >-
      Cliopatria begins Urartu in 800 BC. The Nairi lands were united into one kingdom under Arame (about 860-843 BC), whose capitals Shalmaneser III captured; Sarduri I (about 832-820 BC) moved the capital to Tushpa. The shape drawn back to 860 is Cliopatria's first one, of 800 BC; the kingdom of the 850s was probably smaller.
    sources:
      - "Wikipedia, Urartu (Arame c. 860-843 BC; Sarduri I c. 832-820 BC, capital moved to Tushpa)"
      - "Wikipedia, Arame of Urartu (fought Shalmaneser III, r. 859-824 BC)"
  - polity: Thirtieth Dynasty of Egypt
    first_year: "404 BC"
    reason: >-
      Cliopatria draws Egypt as Persian until 384 BC and the Thirtieth Dynasty only from 383 BC. Amyrtaeus of Sais rose against Persia on the death of Darius II in 404 BC and was recognised as king in Upper Egypt by 400 BC; his Twenty-eighth Dynasty and then the Twenty-ninth and Thirtieth kept Egypt independent until 343 BC. The shape is drawn from 404 BC and renamed for each dynasty (renamed).
    sources:
      - "Diodorus Siculus 14.35; 15.42-43"
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 13 (A. B. Lloyd, The Late Period)"
      - "Wikipedia, Twenty-eighth Dynasty of Egypt; Twenty-ninth Dynasty of Egypt"
  - polity: Ostrogothic Kingdom
    first_year: "AD 493"
    reason: >-
      Cliopatria draws the Ostrogothic Kingdom from AD 500. Theoderic took Ravenna and killed Odoacer in 493 and ruled Italy from then; the years 493-499 take the kingdom's first shape.
    sources:
      - "Anonymus Valesianus, Pars Posterior 11.53-56"
      - "J. Moorhead, Theoderic in Italy (1992), ch. 1"
  - polity: Kingdom of Cyprus
    first_year: "AD 1191"
    reason: >-
      Cliopatria draws the Lusignan kingdom from 1192 and Cyprus as Byzantine before it. Richard I took the island from Isaac Comnenus in May 1191 (event cyprus-1191) and sold it to the Templars, who held it into 1192; Guy of Lusignan bought it in 1192 and ruled it as lord until 1194, and his brother Aimery was crowned king in 1197. The map shows Cyprus as Latin from 1191; the name of the kingdom for 1191-1196 is Cliopatria's simplification, kept here.
    sources:
      - "Roger of Howden, Gesta Regis Ricardi"
      - "P. W. Edbury, The Kingdom of Cyprus and the Crusades, 1191-1374 (1991)"
  # Map sweep, fourth batch (2026-11-24).
  - polity: Achaemenid Empire
    first_year: "550 BC"
    reason: >-
      Cliopatria begins the Achaemenid Empire in 551 BC. Cyrus defeated Astyages and took Ecbatana in the sixth year of Nabonidus, 550/549 BC (event astyages-defeated; the Ecbatana article); Media is drawn until then (overrides) and the empire from 550 BC.
    sources:
      - "Nabonidus Chronicle (ABC 7) ii 1-4 (livius.org)"
      - "P. Briant, From Cyrus to Alexander: A History of the Persian Empire (2002), 31-33"
  - polity: Assyria
    first_year: "1808 BC"
    reason: >-
      Cliopatria begins Shamshi-Adad I's kingdom of Upper Mesopotamia in 1801 BC and draws no state over Assur before it. By the Assyrian King List he took Assur from Erishum II and reigned 33 years, 1808-1776 BC in the middle chronology (event shamshi-adad; the Asshur article); his kingdom is drawn from 1808 BC with its first shape. Assur's earlier years as a city-state are left without a state, as before.
    sources:
      - "Assyrian King List (J. B. Pritchard, ed., Ancient Near Eastern Texts, 3rd ed., 1969, 564)"
      - "M. Van De Mieroop, A History of the Ancient Near East, ca. 3000-323 BC, 3rd ed. (2016), ch. 6"
