# A polity the data names by one era for longer than it lasted (build-content.ts): a new
# name from the year given.
renamed:
  - polity: New Kingdom of Egypt
    first_year: "c. 1070 BC"
    name: Egypt of the Third Intermediate Period
    reason: >-
      The New Kingdom ended with the death of Ramesses XI (1077 BC in some chronologies, 1069 BC in others); Egypt was then divided between the kings at Tanis and the high priests of Amun at Thebes, the Third Intermediate Period. Cliopatria calls it the New Kingdom until 801 BC.
    sources:
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 10 (J. van Dijk, The Amarna Period and the Later New Kingdom, c. 1352-1069 BC) and ch. 12 (J. Taylor, The Third Intermediate Period, 1069-664 BC)"
      - "Wikipedia, Third Intermediate Period of Egypt; New Kingdom of Egypt"
  # Cliopatria puts the two dynasties' names on each other's lands in 800-701 BC: its
  # "Twenty-third" holds the Delta with Tanis, Bubastis and Memphis, the seats of the
  # Twenty-second. Swapped in three steps through a name used for nothing else.
  - polity: Twenty-second Dynasty of Egypt
    first_year: "800 BC"
    name: Egypt (dynasty swap)
    reason: >-
      Step 1 of 3 of swapping the two dynasties' names (see the comment above).
    sources:
      - "Wikipedia, Twenty-second Dynasty of Egypt (Bubastis, Tanis); Twenty-third Dynasty of Egypt"
  - polity: Twenty-third Dynasty of Egypt
    first_year: "800 BC"
    name: Twenty-second Dynasty of Egypt
    reason: >-
      The Twenty-second (Libyan) Dynasty ruled from Bubastis and Tanis and held Memphis: the Delta shape Cliopatria names the Twenty-third is theirs.
    sources:
      - "Wikipedia, Twenty-second Dynasty of Egypt; Twenty-third Dynasty of Egypt"
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 12 (J. Taylor)"
  - polity: Egypt (dynasty swap)
    first_year: "800 BC"
    name: Twenty-third Dynasty of Egypt
    reason: >-
      The Twenty-third Dynasty is placed at Leontopolis by the older view and in Upper Egypt (Thebes, Heracleopolis) by the newer; either way not at Tanis, so it takes the other shape.
    sources:
      - "Wikipedia, Twenty-third Dynasty of Egypt"
  - polity: Twenty-third Dynasty of Egypt
    first_year: "c. 732 BC"
    name: Kingdom of Kush
    reason: >-
      Kush already held Upper Egypt as far as Thebes (Kashta had made his daughter Amenirdis heir to the God's Wife of Amun there) when Piye, in his twentieth year, marched north, took Hermopolis and received the submission of the kings of Middle Egypt and the Delta. The campaign is put around 732 BC in one reckoning; with Piye's reign dated 744-714 BC it would fall about 725 BC. After it his authority reached from Thebes to Herakleopolis, where the local king ruled as his vassal; this shape, the Nile valley south of Memphis, was Kushite at the latest from then.
    sources:
      - "Wikipedia, Third Intermediate Period of Egypt (Kashta and Amenirdis at Thebes; Piye's Year 20 campaign, around 732 BC)"
      - "Wikipedia, Piye (ruled Egypt 744-714 BC; ruler of Nubia and Upper Egypt; authority from Thebes to Herakleopolis after the campaign)"
  - polity: Twenty-second Dynasty of Egypt
    first_year: "c. 712 BC"
    name: Kingdom of Kush
    reason: >-
      Piye's campaign left the Delta kings, Tefnakht of Sais above all, in practice free of Kushite control. Kush took the Delta when Bakenranef of Sais (c. 718-713 BC) was defeated and, by tradition, burnt alive. Older chronology credits Shabaka with the conquest, newer work (after Sargon II's Tang-i Var inscription, c. 707/706 BC) credits Shebitku, around 712 BC; either way Kush held all Egypt from about then.
    sources:
      - "Wikipedia, Twenty-fifth Dynasty of Egypt (Shabaka and Shebitku chronology dispute; Shebitku conquered the entire Nile Valley around 712 BC)"
      - "Wikipedia, Bakenranef (ruled Lower Egypt from Sais c. 718-713 BC)"
      - "Wikipedia, Piye (the Delta kings left free after the campaign; Shebitku defeated Bakenranef at Sais)"
      - "Wikipedia, Shebitku; Shabaka (Tang-i Var: Shebitku king of Egypt by 707/706 BC)"
  - polity: Gutian Dynasty
    first_year: "c. 2112 BC"
    name: Third Dynasty of Ur
    reason: >-
      Cliopatria's only shape of the Gutians covers Sumer, Akkad and Susa in 2101-2001 BC: the years and lands of the Third Dynasty of Ur (2112/0-2004/3 BC in the middle chronology; the absolute dates are uncertain). Utu-hengal of Uruk ended Gutian rule by defeating Tirigan (c. 2119 BC); Ur-Namma founded the Ur III state, which fell to an Elamite army about 2004 BC.
    sources:
      - "Wikipedia, Third Dynasty of Ur (2112/0-2004/3 BC, middle chronology)"
      - "Wikipedia, Gutian rule in Mesopotamia (ended by Utu-hengal, c. 2119-2112 BC)"
  # Cliopatria names Alexander's empire "Ptolemaic Kingdom" in 332-325 BC, from Egypt to
  # the Indus. Renamed in three steps through a name used for nothing else, so that the
  # real Ptolemaic Kingdom from 308 BC keeps its name.
  - polity: Ptolemaic Kingdom
    first_year: "332 BC"
    name: Ptolemaic Kingdom (rename step)
    reason: >-
      Step 1 of 3 (see the comment above).
    sources:
      - "Wikipedia, Ptolemaic Kingdom (Ptolemy satrap from 323 BC, king from 305 BC)"
  - polity: Ptolemaic Kingdom (rename step)
    first_year: "323 BC"
    name: Ptolemaic Kingdom
    reason: >-
      Step 2 of 3: the shapes from 323 BC on are the Ptolemies' own (Egypt as cut from the Macedonian Empire in 323-309 BC, clips; Cliopatria's own from 308 BC).
    sources:
      - "Wikipedia, Ptolemaic Kingdom"
  - polity: Ptolemaic Kingdom (rename step)
    first_year: "332 BC"
    name: Macedonian Empire
    reason: >-
      Step 3 of 3: the shapes of 332-325 BC are Alexander's conquests, from Egypt and Asia Minor to the Indus. Ptolemy became satrap of Egypt only after Alexander's death in 323 BC and took the title of king in 305 BC.
    sources:
      - "Wikipedia, Ptolemaic Kingdom (satrap 323, king 305 BC)"
      - "Wikipedia, Ptolemy I Soter"
  # Cliopatria names Rome "Roman Empire" from 32 BC, the year before Actium. The site dates
  # the Empire from 27 BC: the Senate named Octavian Augustus that year (event
  # augustus-named) and the Rome article has him "the first emperor in 27 BC". Renamed in
  # three steps through a name used for nothing else, so that Rome is the Roman Republic
  # in 32-28 BC and the Roman Empire from 27 BC.
  - polity: Roman Empire
    first_year: "32 BC"
    name: Roman Empire (rename step)
    reason: >-
      Step 1 of 3 (see the comment above).
    sources:
      - "Cassius Dio 53.16.6-8 (the name Augustus, January 27 BC)"
  - polity: Roman Empire (rename step)
    first_year: "27 BC"
    name: Roman Empire
    reason: >-
      Step 2 of 3: from 27 BC, when the Senate named Octavian Augustus (event augustus-named; the Rome article: "Augustus became the first emperor in 27 BC"), Rome is the Roman Empire.
    sources:
      - "Cassius Dio 53.16.6-8"
      - "Res Gestae Divi Augusti 34"
  - polity: Roman Empire (rename step)
    first_year: "32 BC"
    name: Roman Republic
    reason: >-
      Step 3 of 3: in 32-28 BC, the years of the war with Antony and Cleopatra, Actium (31 BC, event actium) and the taking of Egypt (30 BC, event egypt-roman), Rome is drawn as the Roman Republic, as the site's events and the Rome article have it until 27 BC.
    sources:
      - "Cassius Dio 50.1-53.16"
      - "Res Gestae Divi Augusti 34"
  - polity: Kingdom of Armenia
    first_year: "AD 638"
    name: Principality of Armenia
    reason: >-
      There was no kingdom of Armenia in AD 638-646: the Sasanians abolished it in 428. Byzantine Armenia was led by a native "prince of Armenia" (ishkhan), David Saharuni and, from 638 or 640, Theodore Rshtuni, between Byzantium and the Arabs.
    sources:
      - "Wikipedia, Theodore Rshtuni (leading prince of Byzantine Armenia under the title Prince of Armenia from 638 or 640)"
  - polity: Roman Kingdom
    first_year: "509 BC"
    name: Roman Republic
    reason: >-
      Cliopatria draws the Roman Kingdom over Rome until 482 BC and the Republic beside it from 501. By the Roman tradition the last king, Tarquinius Superbus, was expelled and the first consuls elected in 509 BC.
    sources:
      - "Livy 1.57-60; 2.1"
      - "Wikipedia, Roman Kingdom (753-509 BC); Roman Republic (from 509 BC)"
  # Cliopatria's first Mamluk shape, 1241-1249, is Syria from Gaza to the Euphrates: the
  # Ayyubid princes' lands, years before the Mamluks took power in Egypt. Renamed in three
  # steps through a name used for nothing else, so the Mamluk shapes from 1250 keep theirs.
  - polity: Mamluk Sultanate
    first_year: "AD 1241"
    name: Mamluk Sultanate (rename step)
    reason: >-
      Step 1 of 3 (see the comment above).
    sources:
      - "Wikipedia, Mamluk Sultanate (1250-1517)"
  - polity: Mamluk Sultanate (rename step)
    first_year: "AD 1250"
    name: Mamluk Sultanate
    reason: >-
      Step 2 of 3: the Mamluks took power in Egypt in 1250, when the sultan Turanshah was murdered; the shapes from 1250 keep their name.
    sources:
      - "S. Runciman, A History of the Crusades, vol. 3 (1954), pp. 272-3"
  - polity: Mamluk Sultanate (rename step)
    first_year: "AD 1241"
    name: Ayyubid Sultanate
    reason: >-
      Step 3 of 3: in 1241-1249 Damascus, Aleppo, Hama, Homs and Kerak were ruled by Ayyubid princes, under or against as-Salih Ayyub of Egypt, who took Damascus in October 1245; the Mamluk Sultanate began only in 1250.
    sources:
      - "R. S. Humphreys, From Saladin to the Mongols (1977), ch. 8"
      - "S. Runciman, A History of the Crusades, vol. 3 (1954) (the siege of Damascus, April-October 1245)"
  # The three dynasties of independent Egypt, 404-343 BC, on the one shape (starts):
  # renamed in three steps.
  - polity: Thirtieth Dynasty of Egypt
    first_year: "404 BC"
    name: Twenty-eighth Dynasty of Egypt
    reason: >-
      Amyrtaeus of Sais, the only king of the Twenty-eighth Dynasty, 404-399 BC.
    sources:
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 13 (A. B. Lloyd, The Late Period)"
      - "Wikipedia, Twenty-eighth Dynasty of Egypt"
  - polity: Twenty-eighth Dynasty of Egypt
    first_year: "399 BC"
    name: Twenty-ninth Dynasty of Egypt
    reason: >-
      Nepherites I of Mendes overthrew Amyrtaeus in 399 BC; his dynasty, with Hakor, ruled until 380 BC.
    sources:
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 13 (A. B. Lloyd, The Late Period)"
      - "Wikipedia, Twenty-ninth Dynasty of Egypt"
  - polity: Twenty-ninth Dynasty of Egypt
    first_year: "380 BC"
    name: Thirtieth Dynasty of Egypt
    reason: >-
      Nectanebo I of Sebennytos took the throne in 380 BC; Nectanebo II, the last of his dynasty, lost Egypt to Artaxerxes III in 343 BC.
    sources:
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 13 (A. B. Lloyd, The Late Period)"
      - "Wikipedia, Thirtieth Dynasty of Egypt"
  - polity: Nicaean Empire
    first_year: "AD 1261"
    name: Byzantine Empire
    reason: >-
      Michael VIII's empire of Nicaea retook Constantinople in 1261 and was the Byzantine Empire again; Cliopatria keeps the name of Nicaea until 1278.
    sources:
      - "D. M. Nicol, The Last Centuries of Byzantium, 1261-1453, 2nd ed. (1993)"

# Years a polity is drawn but did not exist (build-content.ts): cut out of the map.
absent:
  - polity: Kingdom of Commagene
    first_year: "AD 17"
    last_year: "AD 37"
    reason: >-
      When Antiochus III died in AD 17, Rome took Commagene over: in AD 18 Germanicus put it under a Roman governor of praetorian rank, Quintus Servaeus, and modern accounts treat it as joined to the province of Syria. Caligula gave the kingdom back to Antiochus IV in AD 38 (Dio tells it with the events of AD 37). Cliopatria draws it until AD 22.
    sources:
      - "Tacitus, Annals 2.42 (death of Antiochus, AD 17); 2.56 (Servaeus, AD 18)"
      - "Cassius Dio 59.8.2"
      - "Wikipedia, Commagene; Antiochus IV of Commagene (client king AD 38-72)"
  - polity: Kingdom of Armenia
    first_year: "AD 429"
    last_year: "AD 489"
    reason: >-
      Cliopatria draws the Kingdom of Armenia until AD 489. In 428 Bahram V deposed Artaxias IV at the nobles' request, abolished the kingdom and appointed a marzban.
    sources:
      - "Wikipedia, Sasanian Armenia (kingdom abolished 428; Marzpanate period)"
      - "Wikipedia, Arsacid dynasty of Armenia (12-428)"
# Years the data leaves a polity off the map although it existed (build-content.ts): its
# shape from just before is drawn on through them.
bridges:
  - polity: Babylonia
    first_year: "1151 BC"
    last_year: "1102 BC"
    reason: >-
      Cliopatria draws Elam over Babylonia in 1151-1102 BC (clips). The Second Dynasty of Isin ruled Babylonia after the brief Elamite occupation that ended the Kassites about 1155 BC; Nebuchadnezzar I, king of Babylon from about 1126 BC (event nebuchadnezzar-i), took the war to Elam and brought Marduk's statue back. Babylonia is drawn with its shape of 1200-1151 BC.
    sources:
      - "J. A. Brinkman, A Political History of Post-Kassite Babylonia, 1158-722 B.C. (1968)"
      - "The Cambridge Ancient History, 3rd ed., vol. II/2 (1975), ch. 31"
  - polity: Babylonia
    first_year: "626 BC"
    last_year: "617 BC"
    reason: >-
      Nabopolassar took the throne of Babylon in November 626 BC and fought the Assyrians in Babylonia for the next decade; Cliopatria draws Babylon as Assyrian until 616 BC (clips). Babylonia is drawn with its shape of 650-631 BC.
    sources:
      - "Babylonian Chronicle ABC 2 (Chronicle of the Early Years of Nabopolassar) (A. K. Grayson, Assyrian and Babylonian Chronicles, 1975)"
      - "J. Oates, The Fall of Assyria (635-609 B.C.), in The Cambridge Ancient History, 2nd ed., vol. III/2 (1991), ch. 25"
  - polity: Nabataeans
    first_year: "26 BC"
    last_year: "21 BC"
    reason: >-
      Cliopatria leaves the Nabataeans off the map in these years, but Obodas III reigned from 30 to 9 BC, and a thousand Nabataeans under his minister Syllaeus marched with Aelius Gallus into Arabia (c. 26-24 BC; usually dated 25 BC).
    sources:
      - "Strabo, Geography 16.4.23-24"
      - "Cassius Dio 53.29"
      - "Wikipedia, List of Nabataean kings (Obodas III, 30-9 BC); Aelius Gallus"
  - polity: Kingdom of Commagene
    first_year: "AD 38"
    last_year: "AD 42"
    reason: >-
      Caligula restored the kingdom to Antiochus IV in AD 38; he deposed him again at an unknown date, and Claudius restored him in AD 41. Cliopatria draws it again only from AD 43.
    sources:
      - "Wikipedia, Antiochus IV of Commagene (client king AD 38-72)"
  - polity: Elam
    first_year: "2701 BC"
    last_year: "2302 BC"
    reason: >-
      Cliopatria leaves Elam off the map between its Proto-Elamite shape around Susa (to 2701 BC) and 2201 BC. The Old Elamite period begins about 2700 BC; the Awan dynasty ruled until the kings of Akkad defeated it.
    sources:
      - "Wikipedia, Elam (Proto-Elamite c. 3200-2700 BC; Old Elamite from c. 2700 BC)"
      - "Wikipedia, Awan dynasty"
  - polity: Kingdom of Urartu
    first_year: "701 BC"
    last_year: "617 BC"
    reason: >-
      Cliopatria leaves Urartu off the map in 701-617 BC and draws Assyria over it. The kingdom stood throughout: Rusa II (about 680-639 BC) built Teishebaini (Karmir Blur), and Sarduri III, who called Ashurbanipal his "father", and Rusa III followed him.
    sources:
      - "Wikipedia, Urartu (Sarduri III, Rusa III; the Medes took Van in 590 BC)"
      - "Wikipedia, Rusa II (c. 680-639 BC)"
  - polity: Babylonia
    first_year: "801 BC"
    last_year: "730 BC"
    reason: >-
      Cliopatria gives Babylonia to Assyria from 801 BC. Babylon had its own kings, among them Nabonassar (747-734 BC) and the usurper Nabu-mukin-zeri (731-729 BC), until Tiglath-pileser III took the throne in 729 BC.
    sources:
      - "Wikipedia, Nabonassar; Nabu-mukin-zeri"
      - "Wikipedia, Tiglath-Pileser III (king of Babylon from 729 BC)"
  - polity: Kingdom of Armenia
    first_year: "AD 118"
    last_year: "AD 153"
    reason: >-
      Cliopatria leaves Armenia off the map in AD 118-153 (Roman, then Parthian). Hadrian recognised Vologases I as king of all Greater Armenia, a Roman client; after his death Antoninus Pius gave the throne to Sohaemus (144).
    sources:
      - "Wikipedia, Vologases I of Armenia (117-c. 140/144)"
      - "Wikipedia, Sohaemus of Armenia"
  - polity: Kingdom of Armenia
    first_year: "AD 371"
    last_year: "AD 386"
    reason: >-
      Cliopatria leaves Armenia off the map in AD 371-386 and draws the Sasanians over it. Pap (370-374/375), Varazdat (374-378) and Arshak III reigned, with Roman support, until the partition of 387.
    sources:
      - "Wikipedia, Pap of Armenia; Varazdat"
  - polity: Kingdom of Bithynia
    first_year: "84 BC"
    last_year: "79 BC"
    reason: >-
      Cliopatria leaves Bithynia off the map in 88-79 BC. Mithridates VI drove out Nicomedes IV in 88 BC, but under the Treaty of Dardanus (85) Sulla sent Curio to restore him (84 BC); he reigned until his death in 74 BC.
    sources:
      - "Appian, Mithridatic Wars 58; 60 (livius.org)"
      - "Wikipedia, Nicomedes IV of Bithynia (restored in 84 BC)"
  - polity: Kingdom of Cappadocia
    first_year: "84 BC"
    last_year: "79 BC"
    reason: >-
      Cliopatria leaves Cappadocia off the map in 88-79 BC. Ariobarzanes I, driven out by Mithridates in 89/88 BC, was restored under the Treaty of Dardanus (85) and reigned until 63/62 BC, though Mithridates held on to part of the country until Sulla ordered him to give it up.
    sources:
      - "Appian, Mithridatic Wars 58; 60; 64; 66 (livius.org)"
      - "Wikipedia, Ariobarzanes I of Cappadocia (95 to 63/62 BC)"
  - polity: Galatia
    first_year: "84 BC"
    last_year: "79 BC"
    reason: >-
      Mithridates VI held Galatia from 88 BC and had its tetrarchs killed in 86, all but three; the three who escaped raised an army and drove his satrap and garrisons out of Galatia. Cliopatria draws Galatia again only from 78 BC; its earlier shape is drawn through 84-79 BC.
    sources:
      - "Appian, Mithridatic Wars 46; 58 (livius.org)"
  - polity: Babylonia
    first_year: "721 BC"
    last_year: "710 BC"
    reason: >-
      Babylon under Marduk-apla-iddina II (Merodach-baladan), who reigned from Nisan 721 BC until Sargon II drove him out in 710 BC; Cliopatria draws Assyria over it.
    sources:
      - "Babylonian Chronicle ABC 1, i 29-43; ii 1-5 (livius.org)"
      - "Wikipedia, Marduk-apla-iddina II"
  - polity: Kingdom of Armenia
    first_year: "AD 161"
    last_year: "AD 164"
    reason: >-
      Cliopatria leaves Armenia off the map in AD 161-164 and draws Parthia over it. It remained a kingdom: Pacorus (Bakur), set up by Vologases IV, reigned in 161-163 and Sohaemus was restored by the Romans in 163 or 164.
    sources:
      - "Wikipedia, Pacorus of Armenia; Sohaemus of Armenia"
  # Map sweep, fourth batch (2026-11-24).
  - polity: Kingdom of Osroene
    first_year: "AD 117"
    last_year: "AD 126"
    reason: >-
      Cliopatria leaves Osroene off the map in AD 114-126 and draws it as Roman. Trajan held it from 114/116, but Hadrian gave up Mesopotamia on his accession in 117 and Osroene was a kingdom again, under Parthamaspates and then Ma'nu VII (the Mesopotamia article); Rome's shape is cut back from it in these years (clips).
    sources:
      - "Historia Augusta, Hadrian 5.1-4"
      - "Wikipedia, Osroene"
  - polity: Rhodes
    first_year: "AD 53"
    last_year: "AD 72"
    reason: >-
      Claudius took Rhodes' freedom away in AD 44 and gave it back in 53, on the plea of the young Nero; Vespasian made the island part of a province early in the 70s (Suetonius names Rhodes among the free states he reduced; the year is not recorded, about AD 73 is usual). Drawn as a free state under Rome (vassals) in AD 53-72, with its shape of AD 43, the island alone.
    sources:
      - "Tacitus, Annals 12.58"
      - "Suetonius, Vespasian 8.4"
      - "R. M. Berthold, Rhodes in the Hellenistic Age (1984)"

# Lands an empire took over when a polity ended (build-content.ts): the polity's last shape
# drawn as the empire's for those years, where the empire's own shape does not reach yet.
annexed:
  - polity: Kingdom of Israel
    by: Neo-Assyrian Empire
    first_year: "733 BC"
    last_year: "702 BC"
    reason: >-
      In 733-732 BC Tiglath-pileser III took Galilee, Gilead, the Jezreel Valley and the coast and made them provinces (Magiddu, Du'ru, Gal'aza), leaving Hoshea the hill country around Samaria, which is drawn over this shape until 723 BC (clips). After Samaria fell in 722 BC the northern kingdom became Samerina, a province of the Neo-Assyrian Empire; Sargon II, who put down a revolt in which Samaria took part in 720 BC, organised it under a governor, deported part of its people and settled others in its towns. Cliopatria's Assyrian shape reaches the land only from 701 BC, so without this the land of Israel was left without a state for twenty years. The shape is Israel's last before 733 BC.
    sources:
      - "2 Kgs 17:6, 24"
      - "Wikipedia, Samerina (province established after the conquest of Samaria, c. 722 BC); Sargon II"
  - polity: Kingdom of Commagene
    by: Roman Empire
    first_year: "AD 17"
    last_year: "AD 37"
    reason: >-
      Between the death of Antiochus III (AD 17) and the restoration under Caligula (AD 38), Commagene was under direct Roman rule: Tacitus says it was put under a Roman governor of praetorian rank in AD 18, and modern accounts treat it as part of the province of Syria.
    sources:
      - "Tacitus, Annals 2.42; 2.56"
      - "Wikipedia, Commagene; Antiochus III of Commagene"
  - polity: Kingdom of Pontus
    by: Roman Empire
    first_year: "AD 63"
    last_year: "AD 67"
    reason: >-
      After Polemon II's abdication in AD 62 Pontus was under direct Roman rule; the data's Roman shape reaches it only from AD 68.
    sources:
      - "Wikipedia, Polemon II of Pontus; Cappadocia (Roman province) (Pontus added to the province)"
  - polity: Kingdom of Cappadocia
    by: Roman Empire
    first_year: "AD 17"
    last_year: "AD 22"
    reason: >-
      Cappadocia was a Roman province from AD 17; the data's Roman shape reaches it only from AD 23.
    sources:
      - "Wikipedia, Cappadocia (Roman province)"
  - polity: Mauretania
    by: Roman Empire
    first_year: "AD 41"
    last_year: "AD 42"
    reason: >-
      Rome annexed Mauretania on Ptolemy's death in AD 40, though it had to put down the revolt of Aedemon and a second rising in AD 42 before Claudius organised the two provinces; the data's Roman shape reaches it only from AD 43.
    sources:
      - "Wikipedia, Ptolemy of Mauretania (section Annexation of Mauretania)"
  - polity: Neo-Babylonian Empire
    by: Achaemenid Empire
    first_year: "539 BC"
    last_year: "532 BC"
    reason: >-
      Babylonia was Persian from Cyrus's entry in October 539 BC; Cliopatria's Achaemenid shape reaches it only from 531 BC.
    sources:
      - "Nabonidus Chronicle (ABC 7) iii 12-16 (livius.org)"
      - "Wikipedia, Fall of Babylon"
  - polity: Achaemenid Empire
    by: Macedonian Empire
    first_year: "330 BC"
    last_year: "328 BC"
    reason: >-
      After Gaugamela (331 BC) and Darius's death (330 BC) the Persian lands were Alexander's; Cliopatria's shape of his empire reaches Mesopotamia and Iran only from 327 BC.
    sources:
      - "Wikipedia, Darius III"
  - polity: Kingdom of Bithynia
    by: Roman Republic
    first_year: "74 BC"
    last_year: "68 BC"
    reason: >-
      Bithynia was Roman from the bequest of Nicomedes IV in 74 BC (overrun by Mithridates VI at the start of the Third Mithridatic War and won back by Rome); Cliopatria's Roman shape reaches it only from 67 BC.
    sources:
      - "Wikipedia, Nicomedes IV of Bithynia (the bequest led directly to the Third Mithridatic War)"
  - polity: Parthian Empire
    by: Sasanian Empire
    first_year: "AD 225"
    last_year: "AD 237"
    reason: >-
      After Hormozdgan (224) Ardashir I took the Parthian lands and was crowned at Ctesiphon, probably in 226; Cliopatria's Sasanian shape reaches Mesopotamia and Media only from AD 238.
    sources:
      - "Wikipedia, Ardashir I"
  # Armenia under a marzban: split around AD 439-450, where Cliopatria's own Sasanian
  # shape already covers it.
  - polity: Kingdom of Armenia
    by: Sasanian Empire
    first_year: "AD 429"
    last_year: "AD 438"
    reason: >-
      From 428 Persian Armenia was a Sasanian province governed by a marzban (the Marzpanate period); Cliopatria draws the kingdom on, and its Sasanian shape takes the land only in 439-450 and from 490.
    sources:
      - "Wikipedia, Sasanian Armenia (Marzpanate period from 428)"
  - polity: Kingdom of Armenia
    by: Sasanian Empire
    first_year: "AD 451"
    last_year: "AD 489"
    reason: >-
      As above: a Sasanian province under a marzban from 428; Cliopatria's Sasanian shape takes the land again only from 490.
    sources:
      - "Wikipedia, Sasanian Armenia (Marzpanate period from 428)"
  - polity: Kingdom of Pergamon
    by: Roman Republic
    first_year: "133 BC"
    last_year: "128 BC"
    reason: >-
      The kingdom passed to Rome by Attalus III's will in 133 BC; Rome fought Aristonicus for it until 130-129 BC and organised the province of Asia. Cliopatria's Roman shape reaches it only from 127 BC.
    sources:
      - "Strabo, Geography 13.4.2"
      - "Livy, Periochae 58-59"
      - "Wikipedia, Attalus III"
  - polity: Kingdom of Pergamon
    by: Roman Republic
    first_year: "84 BC"
    last_year: "79 BC"
    reason: >-
      Under the Treaty of Dardanus (85 BC) Mithridates gave up the province of Asia, which Sulla settled and fined in the winter of 85/84 BC; Cliopatria's Roman shape reaches it again only from 78 BC. The lands of the old Attalid kingdom are drawn as Roman in those years.
    sources:
      - "Appian, Mithridatic Wars 58; 61-63 (Sulla's settlement of Asia) (livius.org)"
      - "Wikipedia, Treaty of Dardanos"
  - polity: Antigonid Macedonia
    by: Greek City-States
    first_year: "168 BC"
    last_year: "166 BC"
    reason: >-
      After Pydna (168 BC) Macedonia was divided into four tribute-paying republics, which Cliopatria draws as Greek city-states from 165 BC; the same is drawn from 167 BC.
    sources:
      - "Livy 45.18; 45.29-30"
      - "Wikipedia, Macedonia (Roman province) (four client republics, merides)"
  - polity: Cyrenaica
    by: Roman Republic
    first_year: "96 BC"
    last_year: "93 BC"
    reason: >-
      Rome inherited Cyrenaica by Ptolemy Apion's will in 96 BC; Cliopatria's Roman shape reaches it only from 92 BC.
    sources:
      - "Livy, Periochae 70.5"
      - "Wikipedia, Ptolemy Apion"
  - polity: Ptolemaic Kingdom
    by: Roman Republic
    first_year: "30 BC"
    last_year: "29 BC"
    reason: >-
      Egypt was a Roman province from 30 BC; Cliopatria's Roman shape reaches it only from 28 BC. Drawn under the Roman Republic, as Rome is drawn until Octavian was named Augustus in 27 BC (renamed).
    sources:
      - "Cassius Dio 51.17.1"
      - "Wikipedia, Egypt (Roman province) (province from 30 BC)"
  - polity: Thracian Kingdom
    by: Roman Empire
    first_year: "AD 47"
    last_year: "AD 50"
    reason: >-
      Thrace was a Roman province from AD 46; Cliopatria's Roman shape reaches it only from AD 51.
    sources:
      - "Wikipedia, Thracia"
  - polity: Ankhwennefer
    by: Ptolemaic Kingdom
    first_year: "185 BC"
    last_year: "172 BC"
    reason: >-
      Upper Egypt with Thebes was Ptolemaic again after Ankhwennefer's defeat in 186 BC; Cliopatria's Ptolemaic shape leaves it to Ankhwennefer until 172 BC.
    sources:
      - "Wikipedia, Ankhwennefer (pharaoh); Great Theban Revolt"
  - polity: Rashidun Caliphate
    by: Umayyad Caliphate
    first_year: "AD 662"
    last_year: "AD 665"
    reason: >-
      After al-Hasan's abdication in 661 Mu'awiya's rule was acknowledged throughout the caliphate; Cliopatria's Umayyad shape takes in Iraq, Iran and Arabia only from 666.
    sources:
      - "Wikipedia, Mu'awiya I (Hasan abdicated and Mu'awiya's suzerainty was acknowledged throughout the Caliphate)"
  - polity: Tulunids
    by: Abbasid Caliphate
    first_year: "AD 906"
    last_year: "AD 910"
    reason: >-
      Egypt and Syria were Abbasid provinces again after 905; Cliopatria's Abbasid shape takes them in only from 911.
    sources:
      - "T. Bianquis, Autonomous Egypt from Ibn Tulun to Kafur, in The Cambridge History of Egypt, vol. 1 (1998)"
      - "Wikipedia, Tulunids"
  - polity: Abbasid Caliphate
    by: Mongol Empire
    first_year: "AD 1258"
    last_year: "AD 1259"
    reason: >-
      Iraq was Hulagu's from 1258; Cliopatria's Mongol shape takes it in only from 1260.
    sources:
      - "J. A. Boyle, Dynastic and Political History of the Il-Khans, in The Cambridge History of Iran, vol. 5 (1968)"
  - polity: Principality of Antioch
    by: Mamluk Sultanate
    first_year: "AD 1268"
    last_year: "AD 1271"
    reason: >-
      Antioch was Baybars' from 1268; Cliopatria's Mamluk shape takes it in only from 1272.
    sources:
      - "S. Runciman, A History of the Crusades, vol. 3 (1954), pp. 324-7"
  - polity: County of Tripoli
    by: Mamluk Sultanate
    first_year: "AD 1290"
    last_year: "AD 1293"
    reason: >-
      Tripoli was Qalawun's from 1289; Cliopatria's Mamluk shape takes it in only from 1294.
    sources:
      - "S. Runciman, A History of the Crusades, vol. 3 (1954), the fall of Tripoli"
  - polity: Kingdom of Jerusalem
    by: Mamluk Sultanate
    first_year: "AD 1291"
    last_year: "AD 1293"
    reason: >-
      The coast from Acre to Atlit was the Mamluks' from 1291; Cliopatria's Mamluk shape takes it in only from 1294.
    sources:
      - "S. Runciman, A History of the Crusades, vol. 3 (1954), the fall of Acre"
  - polity: Twenty-sixth Dynasty of Egypt
    by: Achaemenid Empire
    first_year: "525 BC"
    last_year: "502 BC"
    reason: >-
      Egypt and Cyprus were Persian from Cambyses' conquest in 525 BC (event cambyses-egypt); Cliopatria's Achaemenid shape reaches them only from 501 BC.
    sources:
      - "Herodotus 3.10-16; 3.19; 3.91"
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 13 (A. B. Lloyd, The Late Period)"
  - polity: Thirtieth Dynasty of Egypt
    by: Achaemenid Empire
    first_year: "343 BC"
    last_year: "339 BC"
    reason: >-
      Artaxerxes III reconquered Egypt in 343 BC (event artaxerxes-iii-egypt); Cliopatria's Achaemenid shape reaches it only from 338 BC.
    sources:
      - "Diodorus Siculus 16.46-51"
      - "I. Shaw (ed.), The Oxford History of Ancient Egypt (2000), ch. 13 (A. B. Lloyd, The Late Period)"
  - polity: Carthage
    by: Roman Republic
    first_year: "146 BC"
    last_year: "146 BC"
    reason: >-
      Carthage was destroyed and its land made the province of Africa in 146 BC; Cliopatria's Roman shape reaches it from 145 BC.
    sources:
      - "Appian, Punic Wars 135"
  - polity: Achaean League
    by: Roman Republic
    first_year: "146 BC"
    last_year: "146 BC"
    reason: >-
      The League's cities were Rome's from Mummius' victory in 146 BC; Cliopatria's Roman shape reaches them from 145 BC.
    sources:
      - "Pausanias 7.16.9-10"
  - polity: Latin Empire
    by: Byzantine Empire
    first_year: "AD 1261"
    last_year: "AD 1278"
    reason: >-
      Constantinople was the restored Byzantine Empire's from 1261; Cliopatria draws no shape of it there until 1279, so the Latin Empire's last shape is drawn as Byzantine.
    sources:
      - "D. M. Nicol, The Last Centuries of Byzantium, 1261-1453, 2nd ed. (1993)"

  - polity: Philistia
    by: Babylonia
    first_year: "604 BC"
    last_year: "602 BC"
    reason: >-
      Nebuchadnezzar took Ashkelon in Kislev 604 BC, carried off its king and turned it into a mound and heaps of ruins (event ashkelon-destroyed); Ekron was destroyed in the same campaign. Cliopatria's Babylonian shape reaches the plain only from 601 BC; until then the map names Nabopolassar's and Nebuchadnezzar's kingdom Babylonia.
    sources:
      - "Babylonian Chronicle ABC 5, obv. 18-20 (A. K. Grayson, Assyrian and Babylonian Chronicles, 1975)"
      - "L. E. Stager, Ashkelon and the Archaeology of Destruction: Kislev 604 BCE, Eretz-Israel 25 (1996)"
# Years a polity was a vassal or client (build-content.ts): drawn in the overlord's colour,
# lighter, with the label as a second line. Checked against the sources in two passes
