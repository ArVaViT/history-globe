# Abraham's journey, Genesis 11:31-23:19, in the order of the text; his burial
# (25:8-10) opens the Isaac tour.
# The tour's year (1900 BC) is a conventional point for the map, not a date: the age of
# the patriarchs is disputed (the slider says so for the Middle Bronze Age), with
# proposals from c. 2100 to c. 1500 BC and later.
id: abraham
title:
  en: "Abraham's journey"
  ru: "Путь Авраама"
  uk: "Подорож Авраама"
  es: "El viaje de Abraham"
  pt: "A jornada de Abraão"
  de: "Abrahams Reise"
  fr: "Le voyage d’Abraham"
year: "1900 BC"
people: ["Abraham@Gen.11.26-1Pe"]
approximate: true
stops:
  - place: a6cf75c # Ur
    ref: Gen.11.31
    note:
      en: "Terah takes Abram and his family out of Ur of the Chaldeans."
      ru: "Фарра выводит Аврама и семью из Ура Халдейского."
      uk: "Тара виводить Аврама та його родину з Уру Халдейського."
      es: "Tara saca a Abram y a su familia de Ur de los caldeos."
      pt: "Terá tira Abrão e a sua família de Ur dos Caldeus."
      de: "Tarach führt Abram und seine Familie aus Ur in Chaldäa hinaus."
      fr: "Térach emmène Abram et sa famille hors d’Ur en Chaldée."
  - place: a6d9af3 # Haran
    ref: Gen.11.31-Gen.11.32
    note:
      en: "They settle in Haran, where Terah dies."
      ru: "Они поселяются в Харране; там умирает Фарра."
      uk: "Вони оселяються в Харані, де Тара помирає."
      es: "Se establecen en Harán, donde muere Tara."
      pt: "Eles se estabelecem em Harã, onde Terá morre."
      de: "Sie lassen sich in Haran nieder, wo Tarach stirbt."
      fr: "Ils s’établissent à Haran, où Térach meurt."
  - place: adf74d4 # Shechem
    ref: Gen.12.6-Gen.12.7
    note:
      en: "In Canaan the Lord appears to Abram at Shechem."
      ru: "В Ханаане Господь является Авраму у Сихема."
      uk: "У Ханаані Господь являється Авраму в Сихемі."
      es: "En Canaán el Señor se aparece a Abram en Siquem."
      pt: "Em Canaã, o Senhor aparece a Abrão em Siquém."
      de: "In Kanaan erscheint der Herr Abram bei Sichem."
      fr: "En Canaan, le Seigneur apparaît à Abram à Sichem."
  - place: a64f355 # Bethel
    ref: Gen.12.8
    note:
      en: "He pitches his tent between Bethel and Ai and builds an altar."
      ru: "Ставит шатёр между Вефилем и Гаем и строит жертвенник."
      uk: "Він ставить свій намет між Бет-Елом і Гаєм і будує жертовник."
      es: "Planta su tienda entre Betel y Hai y levanta un altar."
      pt: "Arma a sua tenda entre Betel e Ai e constrói um altar."
      de: "Er schlägt sein Zelt zwischen Bethel und Ai auf und baut einen Altar."
      fr: "Il dresse sa tente entre Béthel et Aï et y bâtit un autel."
  - place: af301ca # Egypt
    ref: Gen.12.10
    note:
      en: "Famine drives him down to Egypt."
      ru: "Голод уводит его в Египет."
      uk: "Голод змушує його зійти до Єгипту."
      es: "El hambre lo obliga a bajar a Egipto."
      pt: "A fome o faz descer ao Egito."
      de: "Hungersnot treibt ihn nach Ägypten hinab."
      fr: "La famine le pousse à descendre en Égypte."
  - place: a85151a # Hebron
    ref: Gen.13.18
    note:
      en: "He settles by the oaks of Mamre at Hebron."
      ru: "Поселяется у дубравы Мамре, что в Хевроне."
      uk: "Він оселяється біля дубів Мамре в Хевроні."
      es: "Se establece junto a las encinas de Mamre, en Hebrón."
      pt: "Estabelece-se junto aos carvalhos de Manre, em Hebrom."
      de: "Er lässt sich bei den Eichen von Mamre in Hebron nieder."
      fr: "Il s’établit près des chênes de Mamré, à Hébron."
  - place: a513646 # Dan
    ref: Gen.14.14
    note:
      en: "He pursues the kings who took Lot as far as Dan."
      ru: "Преследует царей, пленивших Лота, до Дана."
      uk: "Він переслідує царів, що забрали Лота, аж до Дана."
      es: "Persigue hasta Dan a los reyes que se llevaron a Lot."
      pt: "Persegue até Dã os reis que levaram Ló."
      de: "Er verfolgt die Könige, die Lot gefangen genommen haben, bis nach Dan."
      fr: "Il poursuit jusqu’à Dan les rois qui avaient emmené Lot."
  - place: aad7e4e # Salem
    ref: Gen.14.18
    note:
      en: "Melchizedek, king of Salem, brings out bread and wine."
      ru: "Мелхиседек, царь Салимский, выносит хлеб и вино."
      uk: "Мелхиседек, цар Салима, виносить хліб і вино."
      es: "Melquisedec, rey de Salem, saca pan y vino."
      pt: "Melquisedeque, rei de Salém, traz pão e vinho."
      de: "Melchisedek, der König von Salem, bringt Brot und Wein heraus."
      fr: "Melchisédek, roi de Salem, apporte du pain et du vin."
  - place: a3f5814 # Gerar
    ref: Gen.20.1
    note:
      en: "He stays for a time in Gerar."
      ru: "Какое-то время живёт в Гераре."
      uk: "Якийсь час він живе в Герарі."
      es: "Permanece un tiempo en Gerar."
      pt: "Permanece por algum tempo em Gerar."
      de: "Er hält sich eine Zeit lang in Gerar auf."
      fr: "Il séjourne quelque temps à Guérar."
  - place: a075d61 # Beersheba
    ref: Gen.21.31
    note:
      en: "Abraham and Abimelech swear an oath, and the place is called Beersheba."
      ru: "Авраам и Авимелех клянутся друг другу, и место названо Вирсавией."
      uk: "Авраам і Авімелех складають присягу, і те місце дістає назву Беер-Шева."
      es: "Abraham y Abimelec se juran un pacto, y el lugar se llama Beerseba."
      pt: "Abraão e Abimeleque fazem um juramento, e o lugar é chamado Berseba."
      de: "Abraham und Abimelech schwören einander einen Eid, und der Ort heißt Beerscheba."
      fr: "Abraham et Abimélec prêtent serment, et le lieu est appelé Beer-Schéba."
  - place: adaf385 # Moriah
    ref: Gen.22.2-Gen.22.13
    note:
      en: "The binding of Isaac on a mountain in the land of Moriah."
      ru: "Жертвоприношение Исаака на горе в земле Мориа."
      uk: "Зв’язування Ісаака на горі в землі Морія."
      es: "El sacrificio de Isaac en un monte de la tierra de Moriah."
      pt: "Isaque é amarrado para o sacrifício num monte da terra de Moriá."
      de: "Die Bindung Isaaks auf einem Berg im Land Morija."
      fr: "La ligature d’Isaac sur une montagne du pays de Morija."
  - place: ae00861 # Machpelah
    ref: Gen.23.19
    note:
      en: "Sarah is buried in the cave of Machpelah; later Abraham too (Gen 25:9)."
      ru: "Сарра погребена в пещере Махпела; позже там же — Авраам (Быт 25:9)."
      uk: "Сарру ховають у печері Махпела; пізніше там ховають і Авраама (Бут 25:9)."
      es: "Sara es sepultada en la cueva de Macpela; más tarde también Abraham (Gn 25:9)."
      pt: "Sara é sepultada na caverna de Macpela; mais tarde, também Abraão (Gn 25:9)."
      de: "Sara wird in der Höhle Machpela begraben, später auch Abraham (1. Mose 25,9)."
      fr: "Sara est ensevelie dans la caverne de Macpéla ; plus tard Abraham y est aussi enseveli (Gn 25:9)."
