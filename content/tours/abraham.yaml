intro:
  en:
    - "Genesis 11:31–23:19 tells how Terah took his son Abram, Abram's wife Sarai and his grandson Lot out of Ur of the Chaldeans to go to the land of Canaan, and how they settled at Haran on the way. Genesis tells of Terah's death in Haran before the Lord's call to Abram; at the Lord's word Abram went on, with the promise that he would become a great nation, and came through Shechem and Bethel into the hill country of Canaan. The tour follows him in the order of the text: down to Egypt in a famine and back, to the oaks of Mamre at Hebron, north to Dan in pursuit of the kings who had taken Lot, to Melchizedek at Salem, south to Gerar and Beersheba, to the land of Moriah with Isaac, and back to Hebron, where he buried Sarah in the cave of Machpelah. His own burial there opens the tour of Isaac."
    - "Genesis gives Abraham's ages but no date that ties him to the history known from other sources, and scholars disagree on whether and when the stories of the patriarchs can be placed in history; the Encyclopaedia Britannica of 1911 already noted that the narratives are not contemporary with what they tell. The map sets the tour at 1900 BC as a conventional point, not a date. Two places are uncertain: Ur is usually identified with Tell el-Muqayyar in southern Iraq, though some have sought it in northern Mesopotamia near Haran, and the mountain in the land of Moriah is placed by Jewish tradition on the Temple hill in Jerusalem, by the Samaritans on Mount Gerizim."
    - "The text gives one leg its days: setting out, as it seems, from Beersheba, to which he returned, Abraham saw the place of the sacrifice on the third day. The other travel times are estimates, measured in straight lines between the places, which the real ways only lengthen."
  ru:
    - "Быт 11:31–23:19 рассказывает, как Фарра взял своего сына Аврама, жену Аврама Сару и своего внука Лота из Ура Халдейского, чтобы идти в землю Ханаанскую, и как по дороге они поселились в Харране. Книга Бытия рассказывает о смерти Фарры в Харране прежде призвания Аврама Господом; по слову Господа Аврам пошёл дальше, получив обетование, что от него произойдёт великий народ, и через Сихем и Вефиль пришёл в горную страну Ханаана. Тур следует за ним в порядке текста: в Египет во время голода и обратно, к дубраве Мамре у Хеврона, на север до Дана в погоне за царями, пленившими Лота, к Мелхиседеку в Салим, на юг в Герар и Вирсавию, в землю Мориа с Исааком и обратно в Хеврон, где он похоронил Сарру в пещере Махпела. Его собственным погребением там открывается тур Исаака."
    - "Книга Бытия называет возраст Авраама, но не даёт ни одной даты, которая связывала бы его с историей, известной из других источников, и учёные расходятся в том, можно ли и когда поместить рассказы о патриархах в историю; Британская энциклопедия 1911 года уже отмечала, что эти повествования не современны тому, о чём рассказывают. Карта относит тур к 1900 г. до н. э. как к условной точке, а не к дате. Два места неясны: Ур обычно отождествляют с Телль-эль-Мукайяром на юге Ирака, хотя некоторые искали его на севере Месопотамии близ Харрана, а гору в земле Мориа иудейское предание помещает на Храмовой горе в Иерусалиме, самаряне — на горе Гаризим."
    - "Для одного отрезка текст указывает дни: выйдя, по-видимому, из Вирсавии, куда он и вернулся, Авраам увидел место жертвоприношения на третий день. Остальное время в пути — оценки, измеренные по прямой между местами, а настоящие пути только удлиняют его."
  uk:
    - "Бут 11:31–23:19 розповідає, як Терах узяв свого сина Аврама, Аврамову дружину Сару та свого онука Лота з Уру Халдейського, щоб іти до землі ханаанської, і як дорогою вони оселилися в Харані. Книга Буття розповідає про смерть Тераха в Харані перед тим, як Господь покликав Аврама; за словом Господа Аврам пішов далі з обітницею, що стане великим народом, і через Сихем і Бет-Ел прийшов у гірський край Ханаану. Тур іде за ним у порядку тексту: до Єгипту під час голоду й назад, до дубів Мамре біля Хеврону, на північ до Дану в погоні за царями, що забрали Лота, до Мелхиседека в Салімі, на південь до Герара й Беер-Шеви, до землі Морія з Ісааком і назад до Хеврону, де він поховав Сарру в печері Махпела. Його власний похорон там відкриває тур Ісаака."
    - "Книга Буття подає вік Авраама, але жодної дати, яка пов’язувала б його з історією, відомою з інших джерел, і вчені розходяться в тому, чи можна, і коли, вмістити оповіді про патріархів в історію; Британська енциклопедія 1911 року вже зазначала, що ці оповіді не сучасні тому, про що розповідають. Мапа відносить тур до 1900 р. до н. е. як до умовної точки, а не дати. Два місця непевні: Ур зазвичай ототожнюють з Телль-ель-Мукайяром на півдні Іраку, хоча дехто шукав його на півночі Месопотамії поблизу Харана, а гору в землі Морія юдейське передання розміщує на Храмовій горі в Єрусалимі, самаряни — на горі Гарізім."
    - "Для одного відтинку текст подає дні: вирушивши, як видно, з Беер-Шеви, куди він і повернувся, Авраам побачив місце жертвоприношення третього дня. Решта часу в дорозі — оцінки, виміряні по прямій між місцями, а справжні шляхи лише видовжують його."
  es:
    - "Génesis 11:31–23:19 cuenta cómo Taré sacó a su hijo Abram, a Sarai, mujer de Abram, y a su nieto Lot de Ur de los caldeos para ir a la tierra de Canaán, y cómo se establecieron en Harán por el camino. El Génesis narra la muerte de Taré en Harán antes del llamamiento del Señor a Abram; por palabra del Señor, Abram siguió adelante, con la promesa de que llegaría a ser una gran nación, y llegó por Siquem y Betel a la región montañosa de Canaán. El recorrido lo sigue en el orden del texto: baja a Egipto durante un hambre y vuelve, va a las encinas de Mamre en Hebrón, al norte hasta Dan persiguiendo a los reyes que se habían llevado a Lot, a Melquisedec en Salem, al sur a Gerar y Beerseba, a la tierra de Moriah con Isaac, y de vuelta a Hebrón, donde sepultó a Sara en la cueva de Macpela. Su propia sepultura allí abre el recorrido de Isaac."
    - "El Génesis da las edades de Abraham, pero ninguna fecha que lo vincule a la historia conocida por otras fuentes, y los estudiosos no se ponen de acuerdo sobre si los relatos de los patriarcas pueden situarse en la historia, ni cuándo; la Encyclopaedia Britannica de 1911 ya señalaba que los relatos no son contemporáneos de lo que cuentan. El mapa sitúa el recorrido en el 1900 a.C. como punto convencional, no como fecha. Dos lugares son inciertos: Ur suele identificarse con Tell el-Muqayyar, en el sur de Irak, aunque algunos la han buscado en el norte de Mesopotamia, cerca de Harán, y el monte de la tierra de Moriah lo sitúa la tradición judía en la colina del Templo de Jerusalén, y los samaritanos en el monte Gerizim."
    - "El texto da los días de un solo tramo: partiendo, al parecer, de Beerseba, adonde volvió, Abraham vio el lugar del sacrificio al tercer día. Los demás tiempos de viaje son estimaciones, medidas en línea recta entre los lugares, que los caminos reales no hacen sino alargar."
  pt:
    - "Gênesis 11:31–23:19 conta como Terá tirou seu filho Abrão, Sarai, mulher de Abrão, e seu neto Ló de Ur dos Caldeus para ir à terra de Canaã, e como se estabeleceram em Harã pelo caminho. Gênesis relata a morte de Terá em Harã antes do chamado do Senhor a Abrão; pela palavra do Senhor, Abrão seguiu adiante, com a promessa de que se tornaria uma grande nação, e chegou, passando por Siquém e Betel, à região montanhosa de Canaã. O percurso o acompanha na ordem do texto: desce ao Egito durante uma fome e volta, vai aos carvalhos de Manre em Hebrom, ao norte até Dã perseguindo os reis que tinham levado Ló, a Melquisedeque em Salém, ao sul a Gerar e Berseba, à terra de Moriá com Isaque, e de volta a Hebrom, onde sepultou Sara na caverna de Macpela. O seu próprio sepultamento ali abre o percurso de Isaque."
    - "Gênesis dá as idades de Abraão, mas nenhuma data que o ligue à história conhecida por outras fontes, e os estudiosos discordam sobre se e quando as histórias dos patriarcas podem ser situadas na história; a Encyclopaedia Britannica de 1911 já observava que as narrativas não são contemporâneas daquilo que contam. O mapa situa o percurso em 1900 a.C. como ponto convencional, não como data. Dois lugares são incertos: Ur é geralmente identificada com Tell el-Muqayyar, no sul do Iraque, embora alguns a tenham procurado no norte da Mesopotâmia, perto de Harã, e o monte na terra de Moriá é situado pela tradição judaica na colina do Templo em Jerusalém, e pelos samaritanos no monte Gerizim."
    - "O texto dá os dias de um só trecho: partindo, ao que parece, de Berseba, para onde voltou, Abraão viu o lugar do sacrifício no terceiro dia. Os demais tempos de viagem são estimativas, medidas em linha reta entre os lugares, que os caminhos reais só tornam mais longos."
  de:
    - "1 Mo 11:31–23:19 erzählt, wie Terach seinen Sohn Abram, Abrams Frau Sarai und seinen Enkel Lot aus Ur in Chaldäa führte, um ins Land Kanaan zu ziehen, und wie sie sich unterwegs in Haran niederließen. Die Genesis erzählt vom Tod Terachs in Haran vor dem Ruf des Herrn an Abram; auf das Wort des Herrn zog Abram weiter, mit der Verheißung, dass er zu einem großen Volk werden solle, und kam über Sichem und Bethel in das Bergland Kanaans. Die Tour folgt ihm in der Reihenfolge des Textes: hinab nach Ägypten in einer Hungersnot und zurück, zu den Eichen von Mamre bei Hebron, nach Norden bis Dan bei der Verfolgung der Könige, die Lot gefangen genommen hatten, zu Melchisedek in Salem, nach Süden nach Gerar und Beerscheba, mit Isaak in das Land Morija und zurück nach Hebron, wo er Sara in der Höhle Machpela begrub. Sein eigenes Begräbnis dort eröffnet die Tour über Isaak."
    - "Die Genesis nennt die Lebensalter Abrahams, aber kein Datum, das ihn mit der aus anderen Quellen bekannten Geschichte verbindet, und die Forscher sind uneins, ob und wann sich die Erzählungen von den Erzvätern geschichtlich einordnen lassen; schon die Encyclopaedia Britannica von 1911 bemerkte, dass die Erzählungen nicht aus der Zeit stammen, von der sie berichten. Die Karte setzt die Tour in das Jahr 1900 v. Chr. als konventionellen Bezugspunkt, nicht als Datum. Zwei Orte sind unsicher: Ur wird gewöhnlich mit Tell el-Muqayyar im Süden des Irak gleichgesetzt, doch manche haben es im nördlichen Mesopotamien nahe Haran gesucht, und den Berg im Land Morija verlegt die jüdische Überlieferung auf den Tempelberg in Jerusalem, die Samaritaner auf den Garizim."
    - "Der Text gibt für eine Strecke die Tage an: Abraham, der offenbar von Beerscheba aufbrach, wohin er auch zurückkehrte, sah die Opferstätte am dritten Tag. Die übrigen Reisezeiten sind Schätzungen, gemessen in geraden Linien zwischen den Orten, die die wirklichen Wege nur verlängern."
  fr:
    - "Gn 11:31–23:19 raconte comment Térach emmena son fils Abram, Saraï, la femme d’Abram, et son petit-fils Lot hors d’Ur en Chaldée pour aller au pays de Canaan, et comment ils s’établirent en chemin à Haran. La Genèse rapporte la mort de Térach à Haran avant l’appel de l’Éternel à Abram ; sur la parole de l’Éternel, Abram poursuivit sa route, avec la promesse qu’il deviendrait une grande nation, et arriva par Sichem et Béthel dans la montagne de Canaan. Le parcours le suit dans l’ordre du texte : descente en Égypte lors d’une famine et retour, aux chênes de Mamré à Hébron, au nord jusqu’à Dan à la poursuite des rois qui avaient emmené Lot, chez Melchisédek à Salem, au sud à Guérar et Beer-Schéba, au pays de Morija avec Isaac, et retour à Hébron, où il enterra Sara dans la caverne de Macpéla. Sa propre sépulture en ce lieu ouvre le parcours d’Isaac."
    - "La Genèse donne les âges d’Abraham, mais aucune date qui le rattache à l’histoire connue par d’autres sources, et les spécialistes divergent sur la question de savoir si et quand les récits des patriarches peuvent être situés dans l’histoire ; l’Encyclopaedia Britannica de 1911 notait déjà que ces récits ne sont pas contemporains de ce qu’ils racontent. La carte place le parcours en 1900 av. J.-C. comme repère conventionnel, non comme une date. Deux lieux sont incertains : Ur est d’ordinaire identifiée à Tell el-Muqayyar, dans le sud de l’Irak, bien que certains l’aient cherchée dans le nord de la Mésopotamie, près de Haran, et la montagne du pays de Morija est placée par la tradition juive sur la colline du Temple à Jérusalem, par les Samaritains sur le mont Garizim."
    - "Le texte donne les jours d’un trajet : parti, semble-t-il, de Beer-Schéba, où il revint, Abraham vit le lieu du sacrifice le troisième jour. Les autres durées de trajet sont des estimations, mesurées en ligne droite entre les lieux, que les chemins réels ne font qu’allonger."
  pl:
    - "Księga Rodzaju (Rdz 11:31–23:19) opowiada, jak Terach zabrał swego syna Abrama, żonę Abrama Saraj i swego wnuka Lota z Ur Chaldejskiego, by iść do ziemi Kanaan, i jak po drodze osiedlili się w Charanie. Księga Rodzaju opowiada o śmierci Teracha w Charanie przed wezwaniem Pana skierowanym do Abrama; na słowo Pana Abram ruszył dalej, z obietnicą, że stanie się wielkim narodem, i przez Sychem i Betel przybył w góry Kanaanu. Trasa podąża za nim w kolejności tekstu: w dół do Egiptu w czasie głodu i z powrotem, do dębów Mamre w Hebronie, na północ do Dan w pościgu za królami, którzy uprowadzili Lota, do Melchizedeka w Salemie, na południe do Geraru i Beer-Szeby, do ziemi Moria z Izaakiem i z powrotem do Hebronu, gdzie pochował Sarę w jaskini Makpela. Jego własny pogrzeb w tym miejscu otwiera trasę Izaaka."
    - "Księga Rodzaju podaje wiek Abrahama, ale żadnej daty, która wiązałaby go z historią znaną z innych źródeł, a badacze nie są zgodni, czy i kiedy opowieści o patriarchach można umieścić w historii; już Encyclopaedia Britannica z 1911 roku zauważała, że te opowiadania nie są współczesne wydarzeniom, o których mówią. Mapa umieszcza trasę w roku 1900 p.n.e. jako punkt umowny, a nie datę. Dwa miejsca są niepewne: Ur utożsamia się zwykle z Tell el-Mukajjar w południowym Iraku, choć niektórzy szukali go w północnej Mezopotamii koło Charanu, a górę w ziemi Moria tradycja żydowska umieszcza na wzgórzu świątynnym w Jerozolimie, Samarytanie zaś na górze Garizim."
    - "Tekst podaje liczbę dni jednego odcinka: wyruszywszy, jak się zdaje, z Beer-Szeby, do której potem wrócił, Abraham ujrzał miejsce ofiary trzeciego dnia. Pozostałe czasy przejazdu są szacunkami, mierzonymi w linii prostej między miejscami, a rzeczywiste drogi mogą je tylko wydłużyć."
  it:
    - "Gen 11:31–23:19 racconta come Terach prese suo figlio Abramo, Sarai, moglie di Abramo, e suo nipote Lot e li condusse fuori da Ur dei Caldei per andare nel paese di Canaan, e come lungo la strada si stabilirono a Carran. La Genesi narra la morte di Terach a Carran prima della chiamata del Signore ad Abramo; alla parola del Signore Abramo proseguì, con la promessa che sarebbe diventato una grande nazione, e giunse per Sichem e Betel nella regione montuosa di Canaan. L’itinerario lo segue nell’ordine del testo: giù in Egitto durante una carestia e ritorno, alle querce di Mamre a Ebron, a nord fino a Dan all’inseguimento dei re che avevano preso Lot, da Melchisedek a Salem, a sud a Gerar e Bersabea, nel paese di Moria con Isacco, e di nuovo a Ebron, dove seppellì Sara nella caverna di Macpela. La sua stessa sepoltura in quel luogo apre l’itinerario di Isacco."
    - "La Genesi indica le età di Abramo, ma nessuna data che lo leghi alla storia nota da altre fonti, e gli studiosi non concordano se e quando i racconti dei patriarchi possano essere collocati nella storia; già l’Encyclopaedia Britannica del 1911 osservava che i racconti non sono contemporanei di ciò che narrano. La mappa colloca l’itinerario nel 1900 a.C. come punto convenzionale, non come una data. Due luoghi sono incerti: Ur è di solito identificata con Tell el-Muqayyar, nell’Iraq meridionale, anche se alcuni l’hanno cercata nella Mesopotamia settentrionale presso Carran, e il monte nel paese di Moria è posto dalla tradizione ebraica sulla collina del Tempio a Gerusalemme, dai Samaritani sul monte Garizim."
    - "Il testo indica i giorni di un tratto: partito, a quanto pare, da Bersabea, dove poi tornò, Abramo vide il luogo del sacrificio il terzo giorno. Gli altri tempi di viaggio sono stime, misurate in linea retta tra i luoghi, che i cammini reali non fanno che allungare."
  nl:
    - "Gen 11:31–23:19 vertelt hoe Terach zijn zoon Abram, Abrams vrouw Sarai en zijn kleinzoon Lot wegvoerde uit Ur der Chaldeeën om naar het land Kanaän te gaan, en hoe zij zich onderweg te Haran vestigden. Genesis vertelt over de dood van Terach te Haran vóór de roeping van Abram door de HEER; op het woord van de HEER trok Abram verder, met de belofte dat hij tot een groot volk zou worden, en kwam via Sichem en Bethel in het bergland van Kanaän. De route volgt hem in de volgorde van de tekst: af naar Egypte bij een hongersnood en terug, naar de eiken van Mamre bij Hebron, noordwaarts tot Dan bij de achtervolging van de koningen die Lot hadden meegevoerd, naar Melchizedek te Salem, zuidwaarts naar Gerar en Berseba, met Isaak naar het land Moria, en terug naar Hebron, waar hij Sara begroef in de spelonk van Machpela. Zijn eigen begrafenis daar opent de route van Isaak."
    - "Genesis geeft de leeftijden van Abraham, maar geen datum die hem verbindt met de geschiedenis die uit andere bronnen bekend is, en geleerden zijn het oneens over de vraag of en wanneer de verhalen over de aartsvaders in de geschiedenis te plaatsen zijn; de Encyclopaedia Britannica van 1911 merkte al op dat de verhalen niet gelijktijdig zijn met wat zij vertellen. De kaart plaatst de route in 1900 v.Chr. als conventioneel punt, niet als datum. Twee plaatsen zijn onzeker: Ur wordt gewoonlijk geïdentificeerd met Tell el-Muqayyar in het zuiden van Irak, al hebben sommigen het gezocht in het noorden van Mesopotamië bij Haran, en de berg in het land Moria wordt door de Joodse overlevering op de tempelberg in Jeruzalem geplaatst, door de Samaritanen op de Gerizim."
    - "De tekst geeft voor één traject de dagen: Abraham, die naar het schijnt vertrok vanuit Berseba, waarheen hij ook terugkeerde, zag de plaats van het offer op de derde dag. De andere reistijden zijn schattingen, gemeten in rechte lijnen tussen de plaatsen, die de werkelijke wegen alleen maar langer maken."
  cs:
    - "Kniha Genesis (Gn 11:31–23:19) vypráví, jak Terach vzal svého syna Abrama, Abramovu ženu Sáraj a svého vnuka Lota z Uru Chaldejských, aby šli do země Kanaán, a jak se cestou usadili v Cháranu. Genesis vypráví o Terachově smrti v Cháranu před Hospodinovým povoláním Abrama; na Hospodinovo slovo šel Abram dál, se zaslíbením, že se stane velikým národem, a přes Šekem a Bét-el přišel do hor Kanaánu. Trasa ho sleduje v pořadí textu: dolů do Egypta za hladomoru a zpět, k dubům v Mamre u Hebronu, na sever k Danu při pronásledování králů, kteří odvedli Lota, k Melchisedekovi do Šalému, na jih do Geraru a Beer-šeby, do země Moria s Izákem a zpět do Hebronu, kde pohřbil Sáru v jeskyni Makpela. Jeho vlastní pohřeb na tomto místě otevírá trasu o Izákovi."
    - "Genesis uvádí Abrahamův věk, ale žádné datum, které by ho spojovalo s dějinami známými z jiných pramenů, a badatelé se neshodnou, zda a kdy lze příběhy patriarchů zasadit do dějin; už Encyclopaedia Britannica z roku 1911 poznamenala, že tato vyprávění nejsou současná s tím, o čem vypovídají. Mapa klade trasu do roku 1900 př. n. l. jako do smluveného bodu, nikoli data. Dvě místa jsou nejistá: Ur se obvykle ztotožňuje s Tell el-Mukajjar v jižním Iráku, ačkoli ho někteří hledali v severní Mezopotámii u Cháranu, a horu v zemi Moria klade židovská tradice na chrámovou horu v Jeruzalémě, Samaritáni na horu Gerizim."
    - "U jednoho úseku text uvádí dny: Abraham, který vyšel, jak se zdá, z Beer-šeby, kam se pak vrátil, uviděl místo oběti třetího dne. Ostatní doby cesty jsou odhady měřené vzdušnou čarou mezi místy, které skutečné cesty mohou jen prodloužit."
  sv:
    - "1 Mos 11:31–23:19 berättar hur Tera tog sin son Abram, Abrams hustru Sarai och sin sonson Lot med sig ut från Ur i Kaldeen för att gå till Kanaans land, och hur de på vägen bosatte sig i Harran. Första Moseboken berättar om Teras död i Harran före Herrens kallelse av Abram; på Herrens ord drog Abram vidare, med löftet att han skulle bli ett stort folk, och kom genom Shekem och Betel upp i Kanaans bergsland. Rundturen följer honom i textens ordning: ned till Egypten under en hungersnöd och tillbaka, till Mamres ekar vid Hebron, norrut till Dan i förföljelse av de kungar som hade tagit Lot, till Melkisedek i Salem, söderut till Gerar och Beer Sheva, till Moria land med Isak och tillbaka till Hebron, där han begravde Sara i grottan i Makpela. Hans egen begravning där inleder rundturen om Isak."
    - "Första Moseboken anger Abrahams åldrar men ingen datering som knyter honom till den historia som är känd från andra källor, och forskarna är oense om huruvida och när patriarkberättelserna kan placeras i historien; redan Encyclopaedia Britannica från 1911 påpekade att berättelserna inte är samtida med det de berättar om. Kartan förlägger rundturen till 1900 f.Kr. som en konventionell punkt, inte som en datering. Två platser är osäkra: Ur identifieras vanligen med Tell el-Muqayyar i södra Irak, även om somliga har sökt det i norra Mesopotamien nära Harran, och berget i Moria land förläggs av judisk tradition till tempelberget i Jerusalem, av samariterna till berget Gerisim."
    - "Texten anger dagarna för en etapp: Abraham, som efter allt att döma bröt upp från Beer Sheva, dit han också återvände, såg offerplatsen på tredje dagen. Övriga restider är uppskattningar, mätta fågelvägen mellan platserna, och de verkliga vägarna gör dem bara längre."
  nb:
    - "1 Mos 11:31–23:19 forteller hvordan Tarah tok sin sønn Abram, Abrams hustru Sarai og sin sønnesønn Lot med seg ut fra Ur i Kaldea for å dra til Kanaans land, og hvordan de bosatte seg i Harran underveis. Første Mosebok forteller om Tarahs død i Harran før Herrens kall til Abram; på Herrens ord dro Abram videre, med løftet om at han skulle bli et stort folk, og kom gjennom Sikem og Betel inn i Kanaans fjelland. Rundturen følger ham i tekstens rekkefølge: ned til Egypt under en hungersnød og tilbake, til Mamres eiker ved Hebron, nordover til Dan i forfølgelsen av kongene som hadde tatt Lot, til Melkisedek i Salem, sørover til Gerar og Beer-Sjeba, til Moria land med Isak og tilbake til Hebron, der han gravla Sara i Makpela-hulen. Hans egen gravferd der innleder rundturen om Isak."
    - "Første Mosebok oppgir Abrahams alder, men ingen datering som knytter ham til historien kjent fra andre kilder, og forskerne er uenige om hvorvidt og når patriarkfortellingene kan plasseres i historien; allerede Encyclopaedia Britannica fra 1911 påpekte at fortellingene ikke er samtidige med det de forteller om. Kartet setter rundturen til 1900 f.Kr. som et konvensjonelt punkt, ikke som en datering. To steder er usikre: Ur blir vanligvis identifisert med Tell el-Muqayyar i Sør-Irak, selv om noen har lett etter det i Nord-Mesopotamia nær Harran, og fjellet i Moria land blir av jødisk tradisjon plassert på tempelhøyden i Jerusalem, av samaritanene på fjellet Garisim."
    - "Teksten oppgir dagene for én etappe: Abraham, som etter alt å dømme dro ut fra Beer-Sjeba, dit han også vendte tilbake, så offerstedet på den tredje dagen. De andre reisetidene er anslag, målt i luftlinje mellom stedene, og de virkelige veiene gjør dem bare lengre."
  tl:
    - "Isinasalaysay ng Gen 11:31–23:19 kung paanong inilabas ni Thare ang kaniyang anak na si Abram, ang asawa ni Abram na si Sarai at ang kaniyang apong si Lot sa Ur ng mga Caldeo upang magtungo sa lupain ng Canaan, at kung paanong nanirahan sila sa Haran sa daan. Isinasalaysay ng Genesis ang pagkamatay ni Thare sa Haran bago ang pagtawag ng Panginoon kay Abram; ayon sa salita ng Panginoon ay nagpatuloy si Abram, na may pangakong siya'y magiging isang malaking bansa, at dumaan sa Sichem at Beth-el papasok sa lupaing maburol ng Canaan. Sinusundan siya ng paglalakbay ayon sa pagkakasunod ng teksto: pababa sa Egipto sa panahon ng taggutom at pabalik, sa mga ensina ng Mamre sa Hebron, pahilaga sa Dan sa paghabol sa mga haring bumihag kay Lot, kay Melquisedec sa Salem, patimog sa Gerar at Beer-seba, sa lupain ng Moria kasama si Isaac, at pabalik sa Hebron, kung saan inilibing niya si Sara sa yungib ng Macpela. Ang kaniyang sariling paglilibing doon ang nagbubukas sa paglalakbay ni Isaac."
    - "Ibinibigay ng Genesis ang mga gulang ni Abraham ngunit walang petsang nag-uugnay sa kaniya sa kasaysayang nalalaman mula sa ibang mga mapagkukunan, at hindi nagkakaisa ang mga iskolar kung mailalagay ba at kailan sa kasaysayan ang mga salaysay tungkol sa mga patriarka; napansin na ng Encyclopaedia Britannica ng 1911 na ang mga salaysay ay hindi kapanahon ng kanilang isinasalaysay. Inilalagay ng mapa ang paglalakbay sa 1900 BK bilang isang kumbensiyonal na tanda, hindi bilang petsa. Dalawang dako ang hindi tiyak: ang Ur ay karaniwang kinikilalang Tell el-Muqayyar sa timugang Iraq, bagaman hinanap ito ng ilan sa hilagang Mesopotamia malapit sa Haran, at ang bundok sa lupain ng Moria ay inilalagay ng tradisyong Judio sa burol ng Templo sa Jerusalem, at ng mga Samaritano sa Bundok Gerizim."
    - "Ibinibigay ng teksto ang mga araw ng isang bahagi ng paglalakbay: sa pag-alis, sa wari'y mula sa Beer-seba, na doon siya bumalik, ay natanaw ni Abraham ang dako ng paghahain nang ikatlong araw. Ang iba pang oras ng paglalakbay ay mga tantiya, na sinusukat nang tuwid sa pagitan ng mga dako, na lalo lamang pinahahaba ng tunay na mga daan."
  da:
    - "1 Mos 11:31–23:19 fortæller, hvordan Tera tog sin søn Abram, Abrams hustru Sarai og sin sønnesøn Lot med ud af Ur i Kaldæa for at drage til Kana'ans land, og hvordan de på vejen bosatte sig i Karan. 1 Mosebog fortæller om Teras død i Karan før Herrens kald til Abram; på Herrens ord drog Abram videre, med løftet om, at han skulle blive et stort folk, og kom gennem Sikem og Betel ind i Kana'ans bjergland. Turen følger ham i tekstens rækkefølge: ned til Egypten under en hungersnød og tilbage, til Mamres egelunde i Hebron, nordpå til Dan i forfølgelsen af de konger, der havde ført Lot bort, til Melkisedek i Salem, sydpå til Gerar og Beersheba, til Morijas land med Isak og tilbage til Hebron, hvor han begravede Sara i Makpelas hule. Hans egen begravelse dér indleder turen om Isak."
    - "1 Mosebog angiver Abrahams alder, men ingen dato, der knytter ham til den historie, man kender fra andre kilder, og forskerne er uenige om, hvorvidt og hvornår patriarkfortællingerne kan placeres i historien; Encyclopaedia Britannica fra 1911 bemærkede allerede, at fortællingerne ikke er samtidige med det, de beretter. Kortet henlægger turen til 1900 f.Kr. som et konventionelt holdepunkt, ikke som en datering. To steder er usikre: Ur identificeres normalt med Tell el-Muqayyar i det sydlige Irak, men nogle har søgt det i det nordlige Mesopotamien nær Karan, og bjerget i Morijas land placeres af jødisk tradition på tempelhøjen i Jerusalem og af samaritanerne på Garizimbjerget."
    - "Teksten angiver dagene for én strækning: efter at være draget af sted, som det synes, fra Beersheba, hvortil han vendte tilbage, så Abraham offerstedet på den tredje dag. De øvrige rejsetider er skøn, målt i lige linje mellem stederne, og de virkelige veje gør dem kun længere."
  sr:
    - "Постање 11,31–23,19 приповеда како је Тара повео свог сина Аврама, Аврамову жену Сару и свог унука Лота из Ура халдејског да иду у земљу хананску, и како су се успут настанили у Харану. Постање приповеда о Тариној смрти у Харану пре Господњег позива Авраму; на реч Господњу Аврам је пошао даље, с обећањем да ће постати велики народ, и преко Сихема и Ветиља дошао у брдски крај Ханана. Пут га прати редом текста: доле у Египат у време глади и натраг, до дубраве Мамрије код Хеврона, на север до Дана у потери за царевима који су одвели Лота, до Мелхиседека у Салиму, на југ до Герара и Вирсавеје, у земљу Морију с Исаком и натраг у Хеврон, где је сахранио Сару у пећини Макпели. Његова сопствена сахрана тамо отвара пут о Исаку."
    - "Постање наводи Аврамове године, али ниједан датум који би га везао за историју познату из других извора, и научници се не слажу да ли се и када приче о патријарсима могу сместити у историју; Енциклопедија Британика из 1911. већ је приметила да приповести нису савремене ономе о чему приповедају. Карта смешта пут у 1900. п. н. е. као уговорену тачку, а не као датум. Два места су несигурна: Ур се обично поистовећује с Тел ел Мукајаром у јужном Ираку, мада су га неки тражили у северној Месопотамији близу Харана, а брдо у земљи Морији јеврејско предање смешта на Храмовну гору у Јерусалиму, а Самарјани на гору Гаризин."
    - "Текст за један део пута даје дане: кренувши, како изгледа, из Вирсавеје, у коју се и вратио, Аврам је трећег дана угледао место жртве. Остала трајања пута процене су, мерене правом линијом између места, а стварни путеви их само продужавају."
  hu:
    - "Az 1Móz 11:31–23:19 elbeszéli, hogyan vitte ki Táré a fiát, Ábrámot, Ábrám feleségét, Száráit és unokáját, Lótot a káldeai Urból, hogy Kánaán földjére menjenek, és hogyan telepedtek le útközben Háránban. Mózes első könyve Táré háránbeli halálát az Úr Ábrámhoz intézett hívása előtt beszéli el; az Úr szavára Ábrám továbbment azzal az ígérettel, hogy nagy néppé lesz, és Sikemen és Bételen át Kánaán hegyvidékére jutott. A túra a szöveg sorrendjében követi: le Egyiptomba egy éhínség idején és vissza, a mamrei tölgyeshez Hebronnál, északra Dánig a Lótot elhurcoló királyok üldözésében, Melkizedekhez Sálembe, délre Gerárba és Beérsebába, Móriá földjére Izsákkal, és vissza Hebronba, ahol Sárát a makpélai barlangban temette el. Saját temetése ott nyitja meg Izsák túráját."
    - "Mózes első könyve megadja Ábrahám életkorait, de nem ad olyan dátumot, amely a más forrásokból ismert történelemhez kötné, és a kutatók nem értenek egyet abban, hogy a pátriárkák történetei elhelyezhetők-e a történelemben, és ha igen, mikor; az 1911-es Encyclopaedia Britannica már megjegyezte, hogy az elbeszélések nem egykorúak azzal, amiről szólnak. A térkép a túrát megállapodásszerű pontként, nem dátumként teszi Kr. e. 1900-ra. Két hely bizonytalan: Urt általában a dél-iraki Tell el-Mukajjarral azonosítják, bár egyesek Észak-Mezopotámiában, Hárán közelében keresték, a Móriá földjén lévő hegyet pedig a zsidó hagyomány a jeruzsálemi Templom-hegyre, a szamaritánusok a Garizim-hegyre helyezik."
    - "A szöveg egy szakasznak megadja a napjait: Ábrahám, aki úgy tűnik, Beérsebából indult, ahová vissza is tért, a harmadik napon látta meg az áldozat helyét. A többi utazási idő becslés, a helyek közötti légvonalban mérve, amit a valódi utak csak meghosszabbítanak."
  fi:
    - "1 Moos 11:31–23:19 kertoo, kuinka Terah otti poikansa Abramin, Abramin vaimon Saarain ja pojanpoikansa Lootin mukaansa Kaldean Urista lähteäkseen Kanaanin maahan ja kuinka he asettuivat matkalla asumaan Harraniin. Ensimmäinen Mooseksen kirja kertoo Terahin kuolemasta Harranissa ennen Herran kutsua Abramille; Herran sanasta Abram jatkoi matkaa saaden lupauksen, että hänestä tulisi suuri kansa, ja tuli Sikemin ja Betelin kautta Kanaanin vuoristoon. Kierros seuraa häntä tekstin järjestyksessä: nälänhädän aikana alas Egyptiin ja takaisin, Mamren tammistoon Hebronin luo, pohjoiseen Daniin asti ajamaan takaa kuninkaita, jotka olivat vieneet Lootin, Melkisedekin luo Salemiin, etelään Gerariin ja Beersebaan, Iisakin kanssa Morian maahan ja takaisin Hebroniin, jossa hän hautasi Saaran Makpelan luolaan. Hänen oma hautaamisensa sinne aloittaa Iisakin kierroksen."
    - "Ensimmäinen Mooseksen kirja ilmoittaa Abrahamin iän, mutta ei mitään ajankohtaa, joka liittäisi hänet muista lähteistä tunnettuun historiaan, ja tutkijat ovat eri mieltä siitä, voiko patriarkkakertomuksia sijoittaa historiaan ja milloin; jo vuoden 1911 Encyclopaedia Britannica totesi, etteivät kertomukset ole samanaikaisia kertomiensa tapahtumien kanssa. Kartta sijoittaa kierroksen vuoteen 1900 eaa. sovinnaisena kiintopisteenä, ei ajoituksena. Kaksi paikkaa on epävarmoja: Ur samastetaan yleensä Tell el-Muqayyariin Etelä-Irakissa, mutta jotkut ovat etsineet sitä Pohjois-Mesopotamiasta Harranin läheltä, ja vuoren Morian maassa juutalainen perimätieto sijoittaa Jerusalemin temppelivuorelle, samarialaiset Garissimin vuorelle."
    - "Teksti ilmoittaa yhden osuuden päivät: lähdettyään liikkeelle ilmeisesti Beersebasta, jonne hän myös palasi, Abraham näki uhripaikan kolmantena päivänä. Muut matka-ajat ovat arvioita, jotka on mitattu suoraa viivaa paikkojen välillä; todelliset tiet vain pidentävät niitä."
  vi:
    - "Sáng 11:31–23:19 thuật lại việc Tha-rê dẫn Áp-ram con trai mình, Sa-rai vợ Áp-ram và Lót cháu mình ra khỏi U-rơ của người Canh-đê để đi đến xứ Ca-na-an, và việc họ định cư tại Cha-ran trên đường đi. Sách Sáng thế ký kể về cái chết của Tha-rê tại Cha-ran trước khi Đức Giê-hô-va gọi Áp-ram; theo lời Đức Giê-hô-va, Áp-ram đi tiếp, với lời hứa rằng người sẽ trở nên một dân lớn, và qua Si-chem và Bê-tên mà vào miền núi Ca-na-an. Chuyến đi theo người đúng thứ tự của bản văn: xuống Ê-díp-tô lúc đói kém rồi trở về, đến những cây sồi của Mam-rê ở Hếp-rôn, lên phía bắc đến Đan để đuổi theo các vua đã bắt Lót, đến Mên-chi-xê-đéc tại Sa-lem, xuống phía nam đến Ghê-ra và Bê-e-Sê-ba, đến xứ Mô-ri-a với Y-sác, và trở về Hếp-rôn, nơi người chôn Sa-ra trong hang đá Mặc-bê-la. Việc chôn chính người tại đó mở đầu chuyến đi của Y-sác."
    - "Sách Sáng thế ký cho biết tuổi của Áp-ra-ham nhưng không có niên đại nào gắn ông với lịch sử được biết từ các nguồn khác, và các học giả bất đồng về việc các câu chuyện về các tổ phụ có thể được đặt vào lịch sử hay không và vào lúc nào; Encyclopaedia Britannica năm 1911 đã ghi nhận rằng các câu chuyện ấy không cùng thời với những điều chúng kể. Bản đồ đặt chuyến đi vào năm 1900 TCN như một mốc quy ước, không phải một niên đại. Hai địa điểm chưa chắc chắn: U-rơ thường được đồng nhất với Tell el-Muqayyar ở miền nam Iraq, dù có người tìm nó ở miền bắc Mê-sô-bô-ta-mi gần Cha-ran, còn ngọn núi trong xứ Mô-ri-a được truyền thống Do Thái đặt trên đồi Đền thờ ở Giê-ru-sa-lem, và người Sa-ma-ri đặt trên núi Ga-ri-xim."
    - "Bản văn cho biết số ngày của một chặng: ra đi, có lẽ, từ Bê-e-Sê-ba, là nơi ông trở về sau đó, đến ngày thứ ba Áp-ra-ham thấy nơi dâng của lễ. Các thời gian đi đường khác là ước tính, đo theo đường thẳng giữa các địa điểm, mà những lối đi thật chỉ làm dài thêm."
  ro:
    - "Fac 11:31–23:19 povestește cum Terah l-a luat pe fiul său Avram, pe soția lui Avram, Sarai, și pe nepotul său Lot și i-a scos din Urul Haldeilor ca să meargă în țara Canaan, și cum s-au așezat pe drum la Haran. Cartea Facerii povestește moartea lui Terah în Haran înainte de chemarea lui Avram de către Domnul; la cuvântul Domnului, Avram a mers mai departe, cu făgăduința că va ajunge un neam mare, și a venit prin Sihem și Betel în ținutul muntos al Canaanului. Călătoria îl urmează în ordinea textului: jos în Egipt pe vreme de foamete și înapoi, la stejarii lui Mamre, la Hebron, spre nord până la Dan, în urmărirea regilor care îl luaseră pe Lot, la Melhisedec, la Salem, spre sud la Gherar și Beer-Șeba, în țara Moria cu Isaac și înapoi la Hebron, unde a îngropat-o pe Sara în peștera Macpela. Propria lui îngropare acolo deschide călătoria lui Isaac."
    - "Cartea Facerii dă vârstele lui Avraam, dar nicio dată care să-l lege de istoria cunoscută din alte surse, iar cercetătorii nu sunt de acord dacă și când pot fi așezate în istorie povestirile patriarhilor; Encyclopaedia Britannica din 1911 nota deja că narațiunile nu sunt contemporane cu ceea ce povestesc. Harta așază călătoria în 1900 î.Hr. ca punct convențional, nu ca dată. Două locuri sunt nesigure: Ur este identificat de obicei cu Tell el-Muqayyar, în sudul Irakului, deși unii l-au căutat în nordul Mesopotamiei, lângă Haran, iar muntele din țara Moria este așezat de tradiția iudaică pe colina Templului din Ierusalim, iar de samariteni pe Muntele Garizim."
    - "Textul dă zilele unei singure etape: pornind, după cât se pare, de la Beer-Șeba, unde s-a și întors, Avraam a văzut locul jertfei în a treia zi. Celelalte durate de drum sunt estimări, măsurate în linie dreaptă între locuri, pe care drumurile reale nu fac decât să le lungească."
  bg:
    - "Битие 11:31–23:19 разказва как Тара изведе сина си Аврам, жената на Аврам Сара и внука си Лот от Ур Халдейски, за да отидат в Ханаанската земя, и как те се заселиха по пътя в Харан. Битие разказва за смъртта на Тара в Харан преди призива на Господа към Аврам; по словото на Господа Аврам продължи, с обещанието, че ще стане голям народ, и през Сихем и Ветил дойде в планинската област на Ханаан. Маршрутът го следва в реда на текста: надолу в Египет по време на глад и обратно, до дъбравата Мамре при Хеврон, на север до Дан в преследване на царете, които бяха пленили Лот, при Мелхиседек в Салим, на юг до Герар и Вирсавия, в земята Мория с Исаак и обратно в Хеврон, където погреба Сара в пещерата Махпела. Неговото собствено погребение там открива маршрута за Исаак."
    - "Битие дава възрастта на Авраам, но нито една дата, която да го свързва с историята, известна от други извори, и учените не са съгласни дали и кога разказите за патриарсите могат да бъдат поставени в историята; Енциклопедия Британика от 1911 г. вече отбелязва, че разказите не са съвременни на това, което разказват. Картата поставя маршрута в 1900 г. пр.н.е. като условна точка, а не като дата. Две места са несигурни: Ур обикновено се отъждествява с Тел ел-Мукаяр в Южен Ирак, макар че някои са го търсили в Северна Месопотамия близо до Харан, а планината в земята Мория юдейската традиция поставя на Храмовия хълм в Йерусалим, а самаряните — на планината Гаризин."
    - "Текстът дава дните на един участък: като тръгна, както изглежда, от Вирсавия, където се и върна, Авраам видя мястото на жертвоприношението на третия ден. Другите времена за път са оценки, мерени по права линия между местата, а действителните пътища само ги удължават."
stops:
  - place: a6cf75c # Ur
    ref: Gen.11.31
    note:
      en: "Terah takes Abram and his family out of Ur of the Chaldeans."
      ru: "Фарра выводит Аврама и семью из Ура Халдейского."
      uk: "Терах виводить Аврама та його родину з Уру Халдейського."
      es: "Taré saca a Abram y a su familia de Ur de los caldeos."
      pt: "Terá tira Abrão e a sua família de Ur dos Caldeus."
      de: "Terach führt Abram und seine Familie aus Ur in Chaldäa hinaus."
      fr: "Térach emmène Abram et sa famille hors d’Ur en Chaldée."
      pl: "Terach wyprowadza Abrama i jego rodzinę z Ur Chaldejskiego."
      it: "Terach conduce Abramo e la sua famiglia fuori da Ur dei Caldei."
      nl: "Terach voert Abram en zijn gezin weg uit Ur der Chaldeeën."
      cs: "Terach vyvádí Abrama a jeho rodinu z Uru Chaldejských."
      sv: "Tera för Abram och hans familj ut från Ur i Kaldeen."
      nb: "Tarah fører Abram og hans familie ut fra Ur i Kaldea."
      tl: "Inilalabas ni Thare si Abram at ang kaniyang pamilya sa Ur ng mga Caldeo."
      da: "Tera fører Abram og hans familie ud af Ur i Kaldæa."
      sr: "Тара изводи Аврама и његову породицу из Ура халдејског."
      hu: "Táré kivezeti Ábrámot és családját a káldeai Urból."
      fi: "Terah vie Abramin ja tämän perheen pois Kaldean Urista."
      vi: "Tha-rê đem Áp-ram và gia đình người ra khỏi U-rơ của người Canh-đê."
      ro: "Terah îl ia pe Avram împreună cu familia lui și îi scoate din Urul Haldeilor."
      bg: "Тара извежда Аврам и семейството му от Ур Халдейски."
    story:
      en: "Terah took Abram his son, Lot his grandson and Sarai his daughter-in-law, Abram's wife, and they went out together from Ur of the Chaldeans to go to the land of Canaan. Ur is usually identified with Tell el-Muqayyar in the far south of Iraq, one of the great Sumerian cities, sacred to the moon god, where Leonard Woolley excavated the Royal Cemetery and the ziggurat in 1922–1934; an old tradition points to Urfa in Turkey instead, and some scholars to an Ur in northern Mesopotamia."
      ru: "Фарра взял Аврама, своего сына, Лота, своего внука, и Сару, свою невестку, жену Аврама, и они вышли вместе из Ура Халдейского, чтобы идти в землю Ханаанскую. Ур обычно отождествляют с Телль-эль-Мукайяром на крайнем юге Ирака, одним из великих шумерских городов, посвящённым богу луны, где Леонард Вулли в 1922–1934 гг. раскопал Царское кладбище и зиккурат; древнее предание указывает вместо этого на Урфу в Турции, а некоторые учёные — на Ур на севере Месопотамии."
      uk: "Терах узяв Аврама, свого сина, Лота, свого онука, і Сару, свою невістку, Аврамову дружину, і вони вийшли разом з Уру Халдейського, щоб іти до землі ханаанської. Ур зазвичай ототожнюють з Телль-ель-Мукайяром на крайньому півдні Іраку, одним із великих шумерських міст, присвяченим богові місяця, де Леонард Вуллі в 1922–1934 рр. розкопав Царський цвинтар і зикурат; давнє передання натомість указує на Урфу в Туреччині, а деякі вчені — на Ур на півночі Месопотамії."
      es: "Taré tomó a Abram su hijo, a Lot su nieto y a Sarai su nuera, mujer de Abram, y salieron juntos de Ur de los caldeos para ir a la tierra de Canaán. Ur suele identificarse con Tell el-Muqayyar, en el extremo sur de Irak, una de las grandes ciudades sumerias, consagrada al dios de la luna, donde Leonard Woolley excavó el Cementerio Real y el zigurat en 1922–1934; una antigua tradición señala en cambio Urfa, en Turquía, y algunos estudiosos una Ur del norte de Mesopotamia."
      pt: "Terá tomou seu filho Abrão, seu neto Ló e sua nora Sarai, mulher de Abrão, e saíram juntos de Ur dos Caldeus para ir à terra de Canaã. Ur é geralmente identificada com Tell el-Muqayyar, no extremo sul do Iraque, uma das grandes cidades sumérias, consagrada ao deus da lua, onde Leonard Woolley escavou o Cemitério Real e o zigurate em 1922–1934; uma antiga tradição aponta, em vez disso, para Urfa, na Turquia, e alguns estudiosos para uma Ur no norte da Mesopotâmia."
      de: "Terach nahm seinen Sohn Abram, seinen Enkel Lot und seine Schwiegertochter Sarai, Abrams Frau, und sie zogen miteinander aus Ur in Chaldäa aus, um ins Land Kanaan zu gehen. Ur wird gewöhnlich mit Tell el-Muqayyar im äußersten Süden des Irak gleichgesetzt, einer der großen sumerischen Städte, dem Mondgott geweiht, wo Leonard Woolley 1922–1934 den Königsfriedhof und die Zikkurat ausgrub; eine alte Überlieferung verweist stattdessen auf Urfa in der Türkei, und einige Forscher auf ein Ur im nördlichen Mesopotamien."
      fr: "Térach prit Abram, son fils, Lot, son petit-fils, et Saraï, sa belle-fille, femme d’Abram, et ils sortirent ensemble d’Ur en Chaldée pour aller au pays de Canaan. Ur est d’ordinaire identifiée à Tell el-Muqayyar, à l’extrême sud de l’Irak, l’une des grandes cités sumériennes, consacrée au dieu de la lune, où Leonard Woolley fouilla le cimetière royal et la ziggourat en 1922–1934 ; une ancienne tradition désigne plutôt Urfa, en Turquie, et certains spécialistes une Ur du nord de la Mésopotamie."
      pl: "Terach wziął swego syna Abrama, swego wnuka Lota i swoją synową Saraj, żonę Abrama, i wyszli razem z Ur Chaldejskiego, by iść do ziemi Kanaan. Ur utożsamia się zwykle z Tell el-Mukajjar na dalekim południu Iraku, jednym z wielkich miast sumeryjskich, poświęconym bogu księżyca, gdzie Leonard Woolley odkopał w latach 1922–1934 Cmentarz Królewski i ziggurat; dawna tradycja wskazuje natomiast Urfę w Turcji, a niektórzy badacze pewne Ur w północnej Mezopotamii."
      it: "Terach prese Abramo suo figlio, Lot suo nipote e Sarai sua nuora, moglie di Abramo, e uscirono insieme da Ur dei Caldei per andare nel paese di Canaan. Ur è di solito identificata con Tell el-Muqayyar, nell’estremo sud dell’Iraq, una delle grandi città sumere, sacra al dio della luna, dove Leonard Woolley scavò il Cimitero reale e la ziggurat nel 1922–1934; un’antica tradizione indica invece Urfa, in Turchia, e alcuni studiosi una Ur della Mesopotamia settentrionale."
      nl: "Terach nam zijn zoon Abram, zijn kleinzoon Lot en zijn schoondochter Sarai, de vrouw van Abram, en zij trokken samen weg uit Ur der Chaldeeën om naar het land Kanaän te gaan. Ur wordt gewoonlijk geïdentificeerd met Tell el-Muqayyar in het uiterste zuiden van Irak, een van de grote Sumerische steden, gewijd aan de maangod, waar Leonard Woolley in 1922–1934 de koninklijke begraafplaats en de ziggoerat opgroef; een oude overlevering wijst in plaats daarvan op Urfa in Turkije, en sommige geleerden op een Ur in het noorden van Mesopotamië."
      cs: "Terach vzal svého syna Abrama, svého vnuka Lota a svou snachu Sáraj, Abramovu ženu, a vyšli spolu z Uru Chaldejských, aby šli do země Kanaán. Ur se obvykle ztotožňuje s Tell el-Mukajjar na dalekém jihu Iráku, jedním z velkých sumerských měst, zasvěceným bohu měsíce, kde Leonard Woolley v letech 1922–1934 odkryl Královský hřbitov a zikkurat; stará tradice místo toho ukazuje na Urfu v Turecku a někteří badatelé na jiný Ur v severní Mezopotámii."
      sv: "Tera tog sin son Abram, sin sonson Lot och sin sonhustru Sarai, Abrams hustru, och de drog tillsammans ut från Ur i Kaldeen för att gå till Kanaans land. Ur identifieras vanligen med Tell el-Muqayyar längst i söder i Irak, en av de stora sumeriska städerna, helgad åt månguden, där Leonard Woolley grävde ut den kungliga gravplatsen och zigguraten 1922–1934; en gammal tradition pekar i stället på Urfa i Turkiet, och somliga forskare på ett Ur i norra Mesopotamien."
      nb: "Tarah tok Abram, sin sønn, Lot, sin sønnesønn, og Sarai, sin sønnekone, Abrams hustru, og de dro sammen ut fra Ur i Kaldea for å reise til Kanaans land. Ur blir vanligvis identifisert med Tell el-Muqayyar helt sør i Irak, en av de store sumeriske byene, viet til månesguden, der Leonard Woolley gravde ut den kongelige gravplassen og zigguraten i 1922–1934; en gammel tradisjon peker i stedet på Urfa i Tyrkia, og noen forskere på et Ur i Nord-Mesopotamia."
      tl: "Ipinagsama ni Thare si Abram na kaniyang anak, si Lot na kaniyang apo at si Sarai na kaniyang manugang, asawa ni Abram, at samasama silang umalis sa Ur ng mga Caldeo upang magtungo sa lupain ng Canaan. Ang Ur ay karaniwang kinikilalang Tell el-Muqayyar sa dulong timog ng Iraq, isa sa mga dakilang lungsod ng mga Sumerio, banal sa diyos ng buwan, kung saan hinukay ni Leonard Woolley ang Maharlikang Libingan at ang ziggurat noong 1922–1934; itinuturo naman ng isang matandang tradisyon ang Urfa sa Turkey, at ng ilang iskolar ang isang Ur sa hilagang Mesopotamia."
      da: "Tera tog sin søn Abram, sin sønnesøn Lot og sin svigerdatter Sarai, Abrams hustru, og de drog sammen ud fra Ur i Kaldæa for at drage til Kana'ans land. Ur identificeres normalt med Tell el-Muqayyar i det yderste syd af Irak, en af de store sumeriske byer, viet til måneguden, hvor Leonard Woolley udgravede kongegravene og zigguraten i 1922–1934; en gammel tradition peger i stedet på Urfa i Tyrkiet, og nogle forskere på et Ur i det nordlige Mesopotamien."
      sr: "Тара је узео свог сина Аврама, свог унука Лота и своју снаху Сару, Аврамову жену, и пошли су заједно из Ура халдејског да иду у земљу хананску. Ур се обично поистовећује с Тел ел Мукајаром на крајњем југу Ирака, једним од великих сумерских градова, посвећеним богу месеца, где је Леонард Вули 1922–1934. ископао Краљевско гробље и зикурат; једно старо предање уместо тога упућује на Урфу у Турској, а неки научници на један Ур у северној Месопотамији."
      hu: "Táré fogta a fiát, Ábrámot, az unokáját, Lótot és a menyét, Száráit, Ábrám feleségét, és együtt kimentek a káldeai Urból, hogy Kánaán földjére menjenek. Urt általában a messzi dél-iraki Tell el-Mukajjarral azonosítják, a nagy sumer városok egyikével, amely a holdisten szent városa volt, és ahol Leonard Woolley 1922–1934-ben feltárta a királyi temetőt és a zikkuratot; egy régi hagyomány viszont a törökországi Urfára mutat, egyes kutatók pedig egy észak-mezopotámiai Urra."
      fi: "Terah otti poikansa Abramin, pojanpoikansa Lootin ja miniänsä Saarain, Abramin vaimon, ja he lähtivät yhdessä Kaldean Urista mennäkseen Kanaanin maahan. Ur samastetaan yleensä Tell el-Muqayyariin Irakin eteläisimmässä osassa; se oli yksi suurista sumerilaiskaupungeista ja kuujumalan pyhä kaupunki, ja Leonard Woolley kaivoi siellä esiin kuninkaallisen hautausmaan ja zikkuratin vuosina 1922–1934. Vanha perimätieto viittaa sen sijaan Urfaan Turkissa, ja jotkut tutkijat Pohjois-Mesopotamiassa sijainneeseen Uriin."
      vi: "Tha-rê dẫn Áp-ram con trai mình, Lót cháu mình và Sa-rai dâu mình, vợ Áp-ram, và họ cùng nhau ra khỏi U-rơ của người Canh-đê để đi đến xứ Ca-na-an. U-rơ thường được đồng nhất với Tell el-Muqayyar ở tận miền nam Iraq, một trong những thành lớn của người Sumer, thánh địa của thần mặt trăng, nơi Leonard Woolley khai quật Nghĩa trang Hoàng gia và tháp ziggurat trong những năm 1922–1934; một truyền thống xưa lại chỉ về Urfa ở Thổ Nhĩ Kỳ, và một số học giả chỉ về một U-rơ ở miền bắc Mê-sô-bô-ta-mi."
      ro: "Terah l-a luat pe fiul său Avram, pe nepotul său Lot și pe nora sa Sarai, soția lui Avram, și au ieșit împreună din Urul Haldeilor ca să meargă în țara Canaan. Ur este identificat de obicei cu Tell el-Muqayyar, în extremitatea sudică a Irakului, unul dintre marile orașe sumeriene, închinat zeului lunii, unde Leonard Woolley a săpat Cimitirul Regal și zigguratul în 1922–1934; o veche tradiție arată în schimb spre Urfa, în Turcia, iar unii cercetători spre un Ur din nordul Mesopotamiei."
      bg: "Тара взе сина си Аврам, внука си Лот и снаха си Сара, жената на Аврам, и те излязоха заедно от Ур Халдейски, за да отидат в Ханаанската земя. Ур обикновено се отъждествява с Тел ел-Мукаяр в най-южната част на Ирак — един от големите шумерски градове, посветен на лунния бог, където Леонард Уули разкопа Царското гробище и зикурата през 1922–1934 г.; едно старо предание сочи вместо това Урфа в Турция, а някои учени — Ур в Северна Месопотамия."
  - place: a6d9af3 # Haran
    ref: Gen.11.31-Gen.11.32
    note:
      en: "They settle in Haran, where Terah dies."
      ru: "Они поселяются в Харране; там умирает Фарра."
      uk: "Вони оселяються в Харані, де Терах помирає."
      es: "Se establecen en Harán, donde muere Taré."
      pt: "Eles se estabelecem em Harã, onde Terá morre."
      de: "Sie lassen sich in Haran nieder, wo Terach stirbt."
      fr: "Ils s’établissent à Haran, où Térach meurt."
      pl: "Osiedlają się w Charanie, gdzie umiera Terach."
      it: "Si stabiliscono a Carran, dove Terach muore."
      nl: "Zij vestigen zich in Haran, waar Terach sterft."
      cs: "Usazují se v Cháranu, kde Terach umírá."
      sv: "De bosätter sig i Harran, där Tera dör."
      nb: "De slår seg ned i Harran, hvor Tarah dør."
      tl: "Nanunuluyan sila sa Haran, at doon namamatay si Thare."
      da: "De bosætter sig i Karan, hvor Tera dør."
      sr: "Настањују се у Харану, где Тара умире."
      hu: "Háránban telepednek le, ahol Táré meghal."
      fi: "He asettuvat asumaan Harraniin, jossa Terah kuolee."
      vi: "Họ định cư tại Cha-ran, nơi Tha-rê qua đời."
      ro: "Se așază în Haran, unde Terah moare."
      bg: "Те се заселват в Харан, където Тара умира."
    story:
      en: "They came to Haran and settled there, and there Terah died. Haran is Harran in south-eastern Turkey, on the Balikh, a tributary of the Euphrates, where the routes from Mesopotamia to Syria and Anatolia crossed, and like Ur a city of the moon god."
      ru: "Они пришли в Харран и поселились там, и там Фарра умер. Харран — это Харран на юго-востоке Турции, на реке Балих, притоке Евфрата, где пересекались пути из Месопотамии в Сирию и Анатолию, и, как и Ур, город бога луны."
      uk: "Вони прийшли до Харана й оселилися там, і там Терах помер. Харан — це Харран на південному сході Туреччини, на річці Баліх, притоці Євфрату, де перетиналися шляхи з Месопотамії до Сирії та Анатолії, і, як і Ур, місто бога місяця."
      es: "Llegaron a Harán y se establecieron allí, y allí murió Taré. Harán es Harran, en el sureste de Turquía, junto al Balikh, afluente del Éufrates, donde se cruzaban las rutas de Mesopotamia hacia Siria y Anatolia, y, como Ur, una ciudad del dios de la luna."
      pt: "Chegaram a Harã e estabeleceram-se ali, e ali morreu Terá. Harã é Harran, no sudeste da Turquia, junto ao Balikh, afluente do Eufrates, onde se cruzavam as rotas da Mesopotâmia para a Síria e a Anatólia, e, como Ur, uma cidade do deus da lua."
      de: "Sie kamen nach Haran und ließen sich dort nieder, und dort starb Terach. Haran ist Harran im Südosten der Türkei, am Balikh, einem Nebenfluss des Euphrat, wo sich die Wege von Mesopotamien nach Syrien und Anatolien kreuzten, und wie Ur eine Stadt des Mondgottes."
      fr: "Ils vinrent à Haran et s’y établirent, et là Térach mourut. Haran est Harran, dans le sud-est de la Turquie, sur le Balikh, un affluent de l’Euphrate, là où se croisaient les routes de la Mésopotamie vers la Syrie et l’Anatolie, et, comme Ur, une ville du dieu de la lune."
      pl: "Przybyli do Charanu i osiedlili się tam, i tam umarł Terach. Charan to Harran w południowo-wschodniej Turcji, nad Balichem, dopływem Eufratu, gdzie krzyżowały się szlaki z Mezopotamii do Syrii i Anatolii, i podobnie jak Ur miasto boga księżyca."
      it: "Giunsero a Carran e vi si stabilirono, e lì Terach morì. Carran è Harran, nella Turchia sud-orientale, sul Balikh, un affluente dell’Eufrate, dove si incrociavano le vie dalla Mesopotamia verso la Siria e l’Anatolia, e come Ur una città del dio della luna."
      nl: "Zij kwamen te Haran en vestigden zich daar, en daar stierf Terach. Haran is Harran in het zuidoosten van Turkije, aan de Balikh, een zijrivier van de Eufraat, waar de wegen van Mesopotamië naar Syrië en Anatolië elkaar kruisten, en net als Ur een stad van de maangod."
      cs: "Přišli do Cháranu a usadili se tam, a tam Terach zemřel. Cháran je Harran v jihovýchodním Turecku, na Balichu, přítoku Eufratu, kde se křížily cesty z Mezopotámie do Sýrie a Anatolie, a stejně jako Ur to bylo město boha měsíce."
      sv: "De kom till Harran och bosatte sig där, och där dog Tera. Platsen är Harran i sydöstra Turkiet, vid Balikh, en biflod till Eufrat, där vägarna från Mesopotamien till Syrien och Anatolien korsades, och liksom Ur en stad helgad åt månguden."
      nb: "De kom til Harran og bosatte seg der, og der døde Tarah. Stedet er Harran i det sørøstlige Tyrkia, ved Balikh, en sideelv til Eufrat, der rutene fra Mesopotamia til Syria og Anatolia krysset hverandre, og i likhet med Ur en by viet til månesguden."
      tl: "Dumating sila sa Haran at nanirahan doon, at doon namatay si Thare. Ang Haran ay ang Harran sa timog-silangang Turkey, sa Balikh, isang sanga ng Eufrates, kung saan nagsasalubong ang mga daan mula Mesopotamia patungong Siria at Anatolia, at gaya ng Ur ay isang lungsod ng diyos ng buwan."
      da: "De kom til Karan og bosatte sig dér, og dér døde Tera. Karan er Harran i det sydøstlige Tyrkiet ved Balikh, en biflod til Eufrat, hvor vejene fra Mesopotamien til Syrien og Anatolien krydsede hinanden, og ligesom Ur en by for måneguden."
      sr: "Дошли су до Харана и онде се настанили, и тамо је Тара умро. Харан је данашњи Харан у југоисточној Турској, на Балиху, притоци Еуфрата, где су се укрштали путеви из Месопотамије за Сирију и Анадолију, и као Ур град бога месеца."
      hu: "Háránba érkeztek, ott letelepedtek, és ott halt meg Táré. Hárán a délkelet-törökországi Harran a Balih, az Eufrátesz egyik mellékfolyója mentén, ahol a Mezopotámiából Szíriába és Anatóliába vezető utak keresztezték egymást, és Urhoz hasonlóan a holdisten városa volt."
      fi: "He tulivat Harraniin ja asettuivat sinne, ja siellä Terah kuoli. Harran on nykyinen Harran Kaakkois-Turkissa Balikh-joen, Eufratin sivujoen, varrella, missä reitit Mesopotamiasta Syyriaan ja Anatoliaan risteytyivät, ja Urin tavoin se oli kuujumalan kaupunki."
      vi: "Họ đến Cha-ran và định cư tại đó, và Tha-rê qua đời tại đó. Cha-ran là Harran ở đông nam Thổ Nhĩ Kỳ, bên sông Balikh, một phụ lưu của sông Ơ-phơ-rát, nơi các con đường từ Mê-sô-bô-ta-mi đến Sy-ri và Anatolia giao nhau, và cũng như U-rơ, là một thành của thần mặt trăng."
      ro: "Au venit la Haran și s-au așezat acolo, iar acolo a murit Terah. Haran este Harran, în sud-estul Turciei, pe Balih, un afluent al Eufratului, unde se încrucișau drumurile din Mesopotamia spre Siria și Anatolia, și, ca și Ur, o cetate a zeului lunii."
      bg: "Те дойдоха до Харан и се заселиха там, и там Тара умря. Харан е днешният Харан в Югоизточна Турция, на Балих, приток на Ефрат, където се пресичаха пътищата от Месопотамия към Сирия и Анадола, и подобно на Ур беше град на лунния бог."
  - place: adf74d4 # Shechem
    ref: Gen.12.6-Gen.12.7
    note:
      en: "In Canaan the Lord appears to Abram at Shechem."
      ru: "В Ханаане Господь является Авраму у Сихема."
      uk: "У Ханаані Господь являється Авраму в Сихемі."
      es: "En Canaán el Señor se aparece a Abram en Siquem."
      pt: "Em Canaã, o Senhor aparece a Abrão em Siquém."
      de: "In Kanaan erscheint der Herr Abram bei Sichem."
      fr: "En Canaan, le Seigneur apparaît à Abram à Sichem."
      pl: "W Kanaanie Pan ukazuje się Abramowi w Sychem."
      it: "In Canaan il Signore appare ad Abramo a Sichem."
      nl: "In Kanaän verschijnt de HEER aan Abram bij Sichem."
      cs: "V Kanaánu se Hospodin zjevuje Abramovi v Šekemu."
      sv: "I Kanaan visar sig Herren för Abram vid Shekem."
      nb: "I Kanaan viser Herren seg for Abram ved Sikem."
      tl: "Sa Canaan, napakikita ang Panginoon kay Abram sa Sichem."
      da: "I Kana'an viser Herren sig for Abram ved Sikem."
      sr: "У Ханану се Господ јавља Авраму код Сихема."
      hu: "Kánaánban az Úr megjelenik Ábrámnak Sikemnél."
      fi: "Kanaanissa Herra ilmestyy Abramille Sikemissä."
      vi: "Tại Ca-na-an, Đức Giê-hô-va hiện ra cùng Áp-ram ở Si-chem."
      ro: "În Canaan, Domnul i se arată lui Avram la Sihem."
      bg: "В Ханаан Господ се явява на Аврам при Сихем."
    story:
      en: "At the Lord's word Abram left Haran, seventy-five years old, with Sarai, Lot and all their goods and people, and came into Canaan as far as the place of Shechem, to the oak of Moreh; the Canaanites were then in the land. There the Lord appeared to Abram and said that he would give this land to his descendants, and Abram built an altar to the Lord. Shechem lay at Tell Balata, in the pass between Mount Ebal and Mount Gerizim, where the roads of the central hills cross."
      ru: "По слову Господа Аврам вышел из Харрана семидесяти пяти лет от роду вместе с Сарой, Лотом и всем их имуществом и людьми и пришёл в Ханаан до места Сихема, до дубравы Море; в той земле тогда жили хананеи. Там Господь явился Авраму и сказал, что даст эту землю его потомству, и Аврам построил там жертвенник Господу. Сихем лежал на Телль-Балата, в проходе между горами Гевал и Гаризим, где пересекаются дороги центрального нагорья."
      uk: "За словом Господа Аврам вийшов з Харана сімдесяти п’яти років, разом із Сарою, Лотом і всім їхнім майном і людьми, і прийшов до Ханаану аж до місця Сихема, до дуба Море; у тій землі тоді жили ханаанеї. Там Господь з’явився Аврамові й сказав, що дасть цю землю його нащадкам, і Аврам збудував там жертовник Господеві. Сихем лежав на Телль-Балата, у проході між горами Ебал і Гарізім, де перетинаються дороги центрального нагір’я."
      es: "Por palabra del Señor, Abram salió de Harán a los setenta y cinco años, con Sarai, Lot y todos sus bienes y su gente, y entró en Canaán hasta el lugar de Siquem, hasta la encina de Moreh; el cananeo estaba entonces en la tierra. Allí el Señor se apareció a Abram y le dijo que daría esta tierra a su descendencia, y Abram edificó un altar al Señor. Siquem estaba en Tell Balata, en el paso entre el monte Ebal y el monte Gerizim, donde se cruzan los caminos de las colinas centrales."
      pt: "Pela palavra do Senhor, Abrão saiu de Harã aos setenta e cinco anos, com Sarai, Ló e todos os seus bens e a sua gente, e entrou em Canaã até o lugar de Siquém, até o carvalho de Moré; os cananeus estavam então na terra. Ali o Senhor apareceu a Abrão e disse que daria esta terra à sua descendência, e Abrão edificou um altar ao Senhor. Siquém ficava em Tell Balata, no desfiladeiro entre o monte Ebal e o monte Gerizim, onde se cruzam as estradas das colinas centrais."
      de: "Auf das Wort des Herrn verließ Abram Haran, fünfundsiebzig Jahre alt, mit Sarai, Lot und all ihrer Habe und ihren Leuten, und kam nach Kanaan bis an die Stätte Sichem, zur Eiche More; damals wohnten die Kanaaniter im Land. Dort erschien der Herr Abram und sagte, er werde dieses Land seinen Nachkommen geben, und Abram baute dem Herrn einen Altar. Sichem lag am Tell Balata, im Pass zwischen dem Ebal und dem Garizim, wo sich die Straßen des mittleren Berglands kreuzen."
      fr: "Sur la parole de l’Éternel, Abram quitta Haran, âgé de soixante-quinze ans, avec Saraï, Lot et tous leurs biens et leurs gens, et entra en Canaan jusqu’au lieu nommé Sichem, jusqu’au chêne de Moré ; les Cananéens étaient alors dans le pays. Là, l’Éternel apparut à Abram et dit qu’il donnerait ce pays à sa postérité, et Abram bâtit un autel à l’Éternel. Sichem se trouvait à Tell Balata, dans le col entre le mont Ébal et le mont Garizim, là où se croisent les routes des collines centrales."
      pl: "Na słowo Pana Abram opuścił Charan w wieku siedemdziesięciu pięciu lat, z Saraj, Lotem i całym ich dobytkiem i ludźmi, i przybył do Kanaanu aż do miejsca Sychem, do dębu More; Kananejczycy mieszkali wtedy w tej ziemi. Tam Pan ukazał się Abramowi i powiedział, że da tę ziemię jego potomstwu, a Abram zbudował ołtarz Panu. Sychem leżało na Tell Balata, w przełęczy między górą Ebal a górą Garizim, gdzie krzyżują się drogi środkowych gór."
      it: "Alla parola del Signore Abramo lasciò Carran, all’età di settantacinque anni, con Sarai, Lot e tutti i loro beni e le loro persone, ed entrò in Canaan fino al luogo di Sichem, alla quercia di Morè; allora nel paese c’erano i Cananei. Lì il Signore apparve ad Abramo e disse che avrebbe dato questo paese alla sua discendenza, e Abramo costruì un altare al Signore. Sichem sorgeva a Tell Balata, nel passo tra il monte Ebal e il monte Garizim, dove si incrociano le strade delle colline centrali."
      nl: "Op het woord van de HEER verliet Abram Haran, vijfenzeventig jaar oud, met Sarai, Lot en al hun bezittingen en mensen, en kwam in Kanaän tot aan de plaats Sichem, bij de eik van More; de Kanaänieten woonden toen in het land. Daar verscheen de HEER aan Abram en zei dat Hij dit land aan zijn nakomelingen zou geven, en Abram bouwde een altaar voor de HEER. Sichem lag bij Tell Balata, in de pas tussen de Ebal en de Gerizim, waar de wegen van het centrale bergland elkaar kruisen."
      cs: "Na Hospodinovo slovo opustil Abram Cháran ve věku sedmdesáti pěti let se Sáraj, Lotem a vším jejich majetkem a lidmi a přišel do Kanaánu až k místu Šekem, k dubu Móre; v zemi tehdy byli Kenaanci. Tam se Hospodin Abramovi ukázal a řekl, že tuto zemi dá jeho potomstvu, a Abram postavil Hospodinu oltář. Šekem ležel na Tell Balata, v průsmyku mezi horou Ébal a horou Gerizim, kde se kříží cesty středních hor."
      sv: "På Herrens ord lämnade Abram Harran, sjuttiofem år gammal, med Sarai, Lot och allt deras gods och folk, och kom in i Kanaan ända till platsen vid Shekem, till Mores terebint; kananeerna bodde då i landet. Där visade sig Herren för Abram och sade att han skulle ge detta land åt hans avkomlingar, och Abram byggde ett altare åt Herren. Shekem låg vid Tell Balata, i passet mellan berget Eval och berget Gerisim, där vägarna i de centrala bergen korsas."
      nb: "På Herrens ord forlot Abram Harran, syttifem år gammel, med Sarai, Lot og alt deres gods og folk, og kom inn i Kanaan helt til stedet ved Sikem, til Mores terebinte; kanaaneerne bodde da i landet. Der viste Herren seg for Abram og sa at han ville gi dette landet til hans etterkommere, og Abram bygde et alter for Herren. Sikem lå ved Tell Balata, i passet mellom fjellet Ebal og fjellet Garisim, der veiene i det sentrale fjellandet krysser hverandre."
      tl: "Ayon sa salita ng Panginoon ay umalis si Abram sa Haran, na may pitumpu't limang taon, kasama si Sarai, si Lot at ang lahat ng kanilang pag-aari at mga tao, at pumasok sa Canaan hanggang sa dako ng Sichem, sa ensina ng Moreh; noo'y nasa lupain ang mga Cananeo. Doon ay napakita ang Panginoon kay Abram at sinabing ibibigay niya ang lupaing ito sa kaniyang lahi, at nagtayo si Abram ng isang dambana sa Panginoon. Ang Sichem ay nasa Tell Balata, sa daanan sa pagitan ng Bundok Ebal at Bundok Gerizim, kung saan nagsasalubong ang mga daan ng gitnang kaburulan."
      da: "På Herrens ord forlod Abram Karan, femoghalvfjerds år gammel, med Sarai, Lot og al deres ejendom og deres folk og kom ind i Kana'an til stedet Sikem, til Mores eg; kana'anæerne boede dengang i landet. Dér viste Herren sig for Abram og sagde, at han ville give hans efterkommere dette land, og Abram byggede et alter for Herren. Sikem lå ved Tell Balata, i passet mellem Ebalbjerget og Garizimbjerget, hvor vejene i det centrale bjergland krydses."
      sr: "На реч Господњу Аврам је напустио Харан, стар седамдесет и пет година, са Саром, Лотом и свим њиховим иметком и људима, и дошао у Ханан до места Сихема, до равнице Море; Хананеји су тада били у тој земљи. Ту се Господ јавио Авраму и рекао да ће ову земљу дати његовом семену, и Аврам је начинио жртвеник Господу. Сихем је лежао код Тел Балате, у превоју између горе Гевила и горе Гаризина, где се укрштају путеви средишњих брда."
      hu: "Az Úr szavára Ábrám hetvenöt évesen elhagyta Háránt Száraival, Lóttal és minden javukkal és embereikkel, és bejött Kánaánba egészen Sikem helyéig, Móré tölgyéig; akkor kánaániak laktak azon a földön. Ott megjelent az Úr Ábrámnak, és azt mondta, hogy ezt a földet az utódainak adja, Ábrám pedig oltárt épített az Úrnak. Sikem a Tell Balátán feküdt, az Ébál-hegy és a Garizim-hegy közötti hágóban, ahol a középső hegyvidék útjai keresztezik egymást."
      fi: "Herran sanasta Abram lähti Harranista seitsemänkymmenenviiden vuoden ikäisenä Saarain, Lootin ja kaiken omaisuutensa ja väkensä kanssa ja tuli Kanaaniin Sikemin paikkakunnalle, Mooren tammelle asti; kanaanilaiset asuivat silloin siinä maassa. Siellä Herra ilmestyi Abramille ja sanoi antavansa tämän maan hänen jälkeläisilleen, ja Abram rakensi alttarin Herralle. Sikem sijaitsi Tell Balatalla Ebalvuoren ja Garissimin vuoren välisessä solassa, jossa keskisen vuoriston tiet risteävät."
      vi: "Theo lời Đức Giê-hô-va, Áp-ram rời Cha-ran khi được bảy mươi lăm tuổi, cùng với Sa-rai, Lót và mọi tài vật cùng người của họ, và vào xứ Ca-na-an cho đến chỗ Si-chem, nơi Rừng Sồi Mô-rê; lúc đó dân Ca-na-an ở trong xứ. Tại đó Đức Giê-hô-va hiện ra cùng Áp-ram và phán rằng Ngài sẽ ban xứ này cho dòng dõi người, và Áp-ram lập một bàn thờ cho Đức Giê-hô-va. Si-chem nằm tại Tell Balata, trong đèo giữa núi Ê-banh và núi Ga-ri-xim, nơi các con đường của miền núi trung tâm giao nhau."
      ro: "La cuvântul Domnului, Avram a plecat din Haran, în vârstă de șaptezeci și cinci de ani, cu Sarai, cu Lot și cu toate bunurile și oamenii lor, și a venit în Canaan până la locul Sihem, la stejarul lui Moreh; canaaniții erau atunci în țară. Acolo Domnul i s-a arătat lui Avram și i-a spus că va da țara aceasta urmașilor lui, iar Avram a zidit un altar Domnului. Sihem se afla la Tell Balata, în trecătoarea dintre Muntele Ebal și Muntele Garizim, unde se încrucișează drumurile din munții centrali."
      bg: "По словото на Господа Аврам напусна Харан на седемдесет и пет години, със Сара, Лот и целия им имот и хора, и дойде в Ханаан до мястото Сихем, до дъба Море; ханаанците тогава живееха в тази земя. Там Господ се яви на Аврам и каза, че ще даде тази земя на потомството му, и Аврам издигна олтар на Господа. Сихем се намираше при Тел Балата, в прохода между планината Гевал и планината Гаризин, където се пресичат пътищата на централните хълмове."
  - place: a64f355 # Bethel
    ref: Gen.12.8
    note:
      en: "He pitches his tent between Bethel and Ai and builds an altar."
      ru: "Ставит шатёр между Вефилем и Гаем и строит жертвенник."
      uk: "Він ставить свій намет між Бет-Елом і Гаєм і будує жертовник."
      es: "Planta su tienda entre Betel y Hai y levanta un altar."
      pt: "Arma a sua tenda entre Betel e Ai e constrói um altar."
      de: "Er schlägt sein Zelt zwischen Bethel und Ai auf und baut einen Altar."
      fr: "Il dresse sa tente entre Béthel et Aï et y bâtit un autel."
      pl: "Rozbija namiot między Betel a Aj i buduje ołtarz."
      it: "Pianta la tenda tra Betel e Ai e vi costruisce un altare."
      nl: "Hij slaat zijn tent op tussen Bethel en Ai en bouwt een altaar."
      cs: "Rozbíjí stan mezi Bét-elem a Aj a staví oltář."
      sv: "Han slår upp sitt tält mellan Betel och Ai och bygger ett altare."
      nb: "Han slår opp teltet sitt mellom Betel og Ai og bygger et alter."
      tl: "Itinatayo niya ang kaniyang tolda sa pagitan ng Beth-el at Hai at nagtatayo ng isang dambana."
      da: "Han slår sit telt op mellem Betel og Aj og bygger et alter."
      sr: "Разапиње шатор између Ветиља и Гаја и подиже жртвеник."
      hu: "Sátrát Bétel és Aj között veti fel, és oltárt épít."
      fi: "Hän pystyttää telttansa Betelin ja Ain välille ja rakentaa alttarin."
      vi: "Người dựng trại giữa Bê-tên và A-hi, và lập một bàn thờ."
      ro: "Își întinde cortul între Betel și Ai și zidește un altar."
      bg: "Той разпъва шатъра си между Ветил и Гай и издига олтар."
    story:
      en: "From there he moved on to the hill country east of Bethel and pitched his tent with Bethel to the west and Ai to the east; there he built an altar to the Lord and called on the name of the Lord. Bethel is usually identified with the village of Beitin, on the watershed road about 16 km north of Jerusalem."
      ru: "Оттуда он двинулся к горной стране к востоку от Вефиля и поставил свой шатёр так, что Вефиль был на западе, а Гай на востоке; там он построил жертвенник Господу и призвал имя Господа. Вефиль обычно отождествляют с деревней Бейтин на дороге по водоразделу примерно в 16 км к северу от Иерусалима."
      uk: "Звідти він перейшов у гірський край на схід від Бет-Елу й поставив свій намет так, що Бет-Ел був на заході, а Гай на сході; там він збудував жертовник Господеві й прикликав ім’я Господа. Бет-Ел зазвичай ототожнюють із селом Бейтін на дорозі вододілом приблизно за 16 км на північ від Єрусалима."
      es: "De allí pasó a la región montañosa al oriente de Betel y plantó su tienda, teniendo Betel al occidente y Hai al oriente; allí edificó un altar al Señor e invocó el nombre del Señor. Betel suele identificarse con la aldea de Beitin, en el camino de la divisoria de aguas, unos 16 km al norte de Jerusalén."
      pt: "Dali passou para a região montanhosa a leste de Betel e armou a sua tenda, tendo Betel a oeste e Ai a leste; ali edificou um altar ao Senhor e invocou o nome do Senhor. Betel é geralmente identificada com a aldeia de Beitin, na estrada do divisor de águas, cerca de 16 km ao norte de Jerusalém."
      de: "Von dort zog er weiter in das Bergland östlich von Bethel und schlug sein Zelt so auf, dass er Bethel im Westen und Ai im Osten hatte; dort baute er dem Herrn einen Altar und rief den Namen des Herrn an. Bethel wird gewöhnlich mit dem Dorf Beitin gleichgesetzt, an der Wasserscheidenstraße etwa 16 km nördlich von Jerusalem."
      fr: "De là, il se transporta vers la montagne à l’orient de Béthel et dressa sa tente, ayant Béthel à l’occident et Aï à l’orient ; il y bâtit un autel à l’Éternel et invoqua le nom de l’Éternel. Béthel est d’ordinaire identifiée au village de Beitin, sur la route de la ligne de partage des eaux, à environ 16 km au nord de Jérusalem."
      pl: "Stamtąd przeniósł się w góry na wschód od Betel i rozbił namiot, mając Betel na zachodzie, a Aj na wschodzie; tam zbudował ołtarz Panu i wzywał imienia Pana. Betel utożsamia się zwykle z wsią Bajtin, przy drodze grzbietowej około 16 km na północ od Jerozolimy."
      it: "Di là si trasferì sulle montagne a oriente di Betel e piantò la tenda, avendo Betel a occidente e Ai a oriente; lì costruì un altare al Signore e invocò il nome del Signore. Betel è di solito identificata con il villaggio di Beitin, sulla strada dello spartiacque, circa 16 km a nord di Gerusalemme."
      nl: "Van daar trok hij verder naar het bergland ten oosten van Bethel en sloeg zijn tent op met Bethel in het westen en Ai in het oosten; daar bouwde hij een altaar voor de HEER en riep de naam van de HEER aan. Bethel wordt gewoonlijk geïdentificeerd met het dorp Beitin, aan de weg over de waterscheiding zo'n 16 km ten noorden van Jeruzalem."
      cs: "Odtud se přesunul do hor východně od Bét-elu a rozbil stan tak, že Bét-el měl na západě a Aj na východě; tam postavil Hospodinu oltář a vzýval Hospodinovo jméno. Bét-el se obvykle ztotožňuje s vesnicí Bajtín u cesty po rozvodí asi 16 km severně od Jeruzaléma."
      sv: "Därifrån drog han vidare till bergslandet öster om Betel och slog upp sitt tält med Betel i väster och Ai i öster; där byggde han ett altare åt Herren och åkallade Herrens namn. Betel identifieras vanligen med byn Beitin, vid vattendelarvägen omkring 16 km norr om Jerusalem."
      nb: "Derfra dro han videre til fjellandet øst for Betel og slo opp teltet sitt med Betel i vest og Ai i øst; der bygde han et alter for Herren og påkalte Herrens navn. Betel blir vanligvis identifisert med landsbyen Beitin, ved vannskilleveien omkring 16 km nord for Jerusalem."
      tl: "Mula roon ay lumipat siya sa lupaing maburol sa silangan ng Beth-el at itinayo ang kaniyang tolda na nasa kanluran ang Beth-el at nasa silangan ang Hai; doon ay nagtayo siya ng dambana sa Panginoon at sinambitla ang pangalan ng Panginoon. Ang Beth-el ay karaniwang kinikilalang nayon ng Beitin, sa daan sa tagaytay ng hatian ng tubig, mga 16 km sa hilaga ng Jerusalem."
      da: "Derfra drog han videre til bjerglandet øst for Betel og slog sit telt op med Betel mod vest og Aj mod øst; dér byggede han et alter for Herren og påkaldte Herrens navn. Betel identificeres normalt med landsbyen Beitin ved vandskelsvejen omkring 16 km nord for Jerusalem."
      sr: "Оданде је прешао у брдски крај источно од Ветиља и разапео свој шатор, тако да му је Ветиљ био са запада, а Гај с истока; онде је начинио жртвеник Господу и призвао име Господње. Ветиљ се обично поистовећује са селом Бејтин, на путу по развођу, око 16 км северно од Јерусалима."
      hu: "Onnan továbbvonult a Bételtől keletre fekvő hegyvidékre, és úgy ütötte fel sátrát, hogy Bétel nyugatra, Aj keletre esett; ott oltárt épített az Úrnak, és segítségül hívta az Úr nevét. Bételt általában Beitín falujával azonosítják, a vízválasztó úton, Jeruzsálemtől mintegy 16 km-re északra."
      fi: "Sieltä hän siirtyi vuoristoon Betelin itäpuolelle ja pystytti telttansa niin, että Betel oli lännessä ja Ai idässä; siellä hän rakensi alttarin Herralle ja huusi avuksi Herran nimeä. Betel samastetaan yleensä Beitinin kylään vedenjakajaa seuraavan tien varrella noin 16 km Jerusalemista pohjoiseen."
      vi: "Từ đó người dời đến miền núi phía đông Bê-tên và đóng trại, phía tây có Bê-tên, phía đông có A-hi; tại đó người lập một bàn thờ cho Đức Giê-hô-va và cầu khẩn danh Đức Giê-hô-va. Bê-tên thường được đồng nhất với làng Beitin, trên con đường dọc đường phân thủy, khoảng 16 km về phía bắc Giê-ru-sa-lem."
      ro: "De acolo a trecut în ținutul muntos de la răsărit de Betel și și-a întins cortul având Betelul la apus și Ai la răsărit; acolo a zidit un altar Domnului și a chemat numele Domnului. Betel este identificat de obicei cu satul Beitin, pe drumul de pe cumpăna apelor, la circa 16 km nord de Ierusalim."
      bg: "Оттам той се премести в планинската област на изток от Ветил и разпъна шатъра си, като Ветил беше на запад, а Гай на изток; там издигна олтар на Господа и призова името Господне. Ветил обикновено се отъждествява със село Бейтин на пътя по вододела, на около 16 км северно от Йерусалим."
  - place: af301ca # Egypt
    ref: Gen.12.10
    note:
      en: "Famine drives him down to Egypt."
      ru: "Голод уводит его в Египет."
      uk: "Голод змушує його зійти до Єгипту."
      es: "El hambre lo obliga a bajar a Egipto."
      pt: "A fome o faz descer ao Egito."
      de: "Hungersnot treibt ihn nach Ägypten hinab."
      fr: "La famine le pousse à descendre en Égypte."
      pl: "Głód zmusza go do zejścia do Egiptu."
      it: "La carestia lo fa scendere in Egitto."
      nl: "Een hongersnood drijft hem naar Egypte."
      cs: "Hlad ho žene dolů do Egypta."
      sv: "Hungersnöd driver honom ner till Egypten."
      nb: "Hungersnød driver ham ned til Egypt."
      tl: "Dahil sa taggutom ay napipilitan siyang lumusong sa Egipto."
      da: "Hungersnød driver ham ned til Egypten."
      sr: "Глад га тера доле у Египат."
      hu: "Az éhínség Egyiptomba kényszeríti."
      fi: "Nälänhätä ajaa hänet alas Egyptiin."
      vi: "Nạn đói buộc người phải xuống Ê-díp-tô."
      ro: "Foametea îl face să coboare în Egipt."
      bg: "Гладът го отвежда надолу в Египет."
    story:
      en: "Abram journeyed on towards the south, and when there was a famine in the land, he went down to Egypt to stay there for a time, for the famine was severe."
      ru: "Аврам продолжал путь к югу, и когда в земле настал голод, он сошёл в Египет, чтобы пожить там какое-то время, потому что голод был сильный."
      uk: "Аврам ішов далі на південь, і коли в краю настав голод, він зійшов до Єгипту, щоб пожити там деякий час, бо голод був тяжкий."
      es: "Abram siguió viajando hacia el sur, y cuando hubo hambre en la tierra, bajó a Egipto para residir allí un tiempo, porque el hambre era grave."
      pt: "Abrão continuou a viajar em direção ao sul, e, quando houve fome na terra, desceu ao Egito para viver ali por algum tempo, pois a fome era severa."
      de: "Abram zog weiter nach Süden, und als eine Hungersnot im Land herrschte, zog er hinab nach Ägypten, um sich dort eine Zeit lang aufzuhalten, denn die Hungersnot war schwer."
      fr: "Abram continua sa route vers le midi, et quand il y eut une famine dans le pays, il descendit en Égypte pour y séjourner un temps, car la famine était grande."
      pl: "Abram wędrował dalej ku południu, a gdy w kraju nastał głód, zszedł do Egiptu, by przebywać tam przez pewien czas, bo głód był ciężki."
      it: "Abramo proseguì verso il mezzogiorno, e quando venne una carestia nel paese, scese in Egitto per soggiornarvi per un tempo, perché la carestia era grave."
      nl: "Abram trok verder naar het zuiden, en toen er een hongersnood in het land was, ging hij af naar Egypte om daar een tijd te verblijven, want de hongersnood was zwaar."
      cs: "Abram putoval dál k jihu, a když v zemi nastal hlad, sestoupil do Egypta, aby tam nějaký čas pobyl, neboť hlad byl krutý."
      sv: "Abram drog vidare söderut, och när det blev hungersnöd i landet gick han ned till Egypten för att bo där en tid, ty hungersnöden var svår."
      nb: "Abram dro videre mot sør, og da det ble hungersnød i landet, dro han ned til Egypt for å bo der en tid, for hungersnøden var hard."
      tl: "Nagpatuloy si Abram sa paglalakbay patimog, at nang magkaroon ng taggutom sa lupain, bumaba siya sa Egipto upang manirahan doon nang ilang panahon, sapagka't mahigpit ang taggutom."
      da: "Abram drog videre mod syd, og da der kom hungersnød i landet, drog han ned til Egypten for at bo der en tid, for hungersnøden var svær."
      sr: "Аврам је путовао даље према југу, а кад је наступила глад у земљи, сишао је у Египат да се онде задржи неко време, јер је глад била велика."
      hu: "Ábrám továbbvándorolt dél felé, és amikor éhínség lett az országban, lement Egyiptomba, hogy egy ideig ott tartózkodjon, mert súlyos volt az éhínség."
      fi: "Abram jatkoi vaellustaan etelää kohti, ja kun maahan tuli nälänhätä, hän meni Egyptiin asuakseen siellä jonkin aikaa, sillä nälänhätä oli kova."
      vi: "Áp-ram tiếp tục đi về phía nam, và khi trong xứ có cơn đói kém, người xuống Ê-díp-tô để kiều ngụ một thời gian, vì sự đói kém rất lớn."
      ro: "Avram a mers mai departe spre sud, iar când a venit o foamete în țară, a coborât în Egipt ca să locuiască acolo o vreme, căci foametea era grea."
      bg: "Аврам продължи пътя си към юг и когато настана глад в земята, слезе в Египет, за да поживее там, защото гладът беше тежък."
  - place: a85151a # Hebron
    ref: Gen.13.18
    note:
      en: "He settles by the oaks of Mamre at Hebron."
      ru: "Поселяется у дубравы Мамре, что в Хевроне."
      uk: "Він оселяється біля дубів Мамре в Хевроні."
      es: "Se establece junto a las encinas de Mamre, en Hebrón."
      pt: "Estabelece-se junto aos carvalhos de Manre, em Hebrom."
      de: "Er lässt sich bei den Eichen von Mamre in Hebron nieder."
      fr: "Il s’établit près des chênes de Mamré, à Hébron."
      pl: "Osiada przy dębach Mamre w Hebronie."
      it: "Si stabilisce presso le querce di Mamre, a Ebron."
      nl: "Hij vestigt zich bij de eiken van Mamre, bij Hebron."
      cs: "Usazuje se u dubů v Mamre u Hebronu."
      sv: "Han bosätter sig vid Mamres ekar i Hebron."
      nb: "Han bosetter seg ved Mamres eiker i Hebron."
      tl: "Nanunuluyan siya sa mga ensina ng Mamre sa Hebron."
      da: "Han bosætter sig ved Mamres egelunde i Hebron."
      sr: "Насељава се код дубраве Мамрије, која је код Хеврона."
      hu: "Hebronban, a mamrei tölgyesnél telepszik le."
      fi: "Hän asettuu asumaan Mamren tammistoon Hebronin luo."
      vi: "Người định cư bên những cây sồi của Mam-rê ở Hếp-rôn."
      ro: "Se așază lângă stejarii lui Mamre, la Hebron."
      bg: "Той се заселва при дъбравата Мамре в Хеврон."
    story:
      en: "Back from Egypt, Abram and Lot parted because the land could not support both their flocks; Lot chose the plain of the Jordan. Abram moved his tent and came to live by the oaks of Mamre at Hebron, high in the hills of Judah, and built an altar to the Lord there."
      ru: "Вернувшись из Египта, Аврам и Лот разошлись, потому что земля не могла прокормить стада обоих; Лот выбрал окрестность Иордана. Аврам перенёс свой шатёр и поселился у дубравы Мамре у Хеврона, высоко в горах Иудеи, и построил там жертвенник Господу."
      uk: "Повернувшись з Єгипту, Аврам і Лот розійшлися, бо земля не могла прогодувати отар їх обох; Лот вибрав околицю Йордану. Аврам переніс свій намет і оселився біля дубів Мамре в Хевроні, високо в горах Юдеї, і збудував там жертовник Господеві."
      es: "De vuelta de Egipto, Abram y Lot se separaron porque la tierra no podía sostener los rebaños de ambos; Lot escogió la llanura del Jordán. Abram trasladó su tienda y fue a vivir junto a las encinas de Mamre, en Hebrón, en lo alto de los montes de Judá, y edificó allí un altar al Señor."
      pt: "De volta do Egito, Abrão e Ló separaram-se porque a terra não podia sustentar os rebanhos de ambos; Ló escolheu a planície do Jordão. Abrão mudou a sua tenda e foi morar junto aos carvalhos de Manre, em Hebrom, no alto dos montes de Judá, e edificou ali um altar ao Senhor."
      de: "Aus Ägypten zurückgekehrt, trennten sich Abram und Lot, weil das Land ihre beiden Herden nicht ernähren konnte; Lot wählte die Jordanebene. Abram brach mit seinem Zelt auf und ließ sich bei den Eichen von Mamre bei Hebron nieder, hoch im Bergland von Juda, und baute dort dem Herrn einen Altar."
      fr: "Revenus d’Égypte, Abram et Lot se séparèrent, parce que le pays ne pouvait nourrir leurs deux troupeaux ; Lot choisit la plaine du Jourdain. Abram leva sa tente et vint habiter près des chênes de Mamré, à Hébron, haut dans les collines de Juda, et y bâtit un autel à l’Éternel."
      pl: "Po powrocie z Egiptu Abram i Lot rozstali się, bo ziemia nie mogła wyżywić stad ich obu; Lot wybrał równinę Jordanu. Abram przeniósł swój namiot i zamieszkał przy dębach Mamre w Hebronie, wysoko w górach Judy, i zbudował tam ołtarz Panu."
      it: "Tornati dall’Egitto, Abramo e Lot si separarono perché il paese non poteva sostenere le greggi di entrambi; Lot scelse la pianura del Giordano. Abramo levò la tenda e venne ad abitare alle querce di Mamre, a Ebron, in alto sulle colline di Giuda, e vi costruì un altare al Signore."
      nl: "Terug uit Egypte gingen Abram en Lot uiteen, omdat het land hun beider kudden niet kon onderhouden; Lot koos de vlakte van de Jordaan. Abram brak zijn tent op en ging wonen bij de eiken van Mamre bij Hebron, hoog in het bergland van Juda, en bouwde daar een altaar voor de HEER."
      cs: "Po návratu z Egypta se Abram a Lot rozešli, protože země neuživila stáda obou; Lot si vybral jordánský okrsek. Abram přenesl svůj stan a usadil se u dubů v Mamre u Hebronu, vysoko v judských horách, a postavil tam Hospodinu oltář."
      sv: "Tillbaka från Egypten skildes Abram och Lot åt, eftersom landet inte kunde bära bådas hjordar; Lot valde Jordanslätten. Abram flyttade sitt tält och bosatte sig vid Mamres ekar i Hebron, högt uppe i Juda bergsbygd, och byggde där ett altare åt Herren."
      nb: "Tilbake fra Egypt skiltes Abram og Lot fordi landet ikke kunne bære begges buskap; Lot valgte Jordansletten. Abram flyttet teltet sitt og kom og bosatte seg ved Mamres eiker i Hebron, høyt oppe i Judas fjelland, og bygde et alter for Herren der."
      tl: "Pagbalik mula sa Egipto ay naghiwalay sina Abram at Lot sapagka't hindi makayanan ng lupain ang mga kawan nilang dalawa; pinili ni Lot ang kapatagan ng Jordan. Binuhat ni Abram ang kaniyang tolda at tumahan sa mga ensina ng Mamre sa Hebron, sa kataasan ng kaburulan ng Juda, at nagtayo roon ng dambana sa Panginoon."
      da: "Efter hjemkomsten fra Egypten skiltes Abram og Lot, fordi landet ikke kunne bære begges hjorder; Lot valgte Jordansletten. Abram flyttede sit telt og bosatte sig ved Mamres egelunde i Hebron, højt oppe i Judas bjerge, og byggede dér et alter for Herren."
      sr: "Вративши се из Египта, Аврам и Лот су се раздвојили, јер земља није могла да издржи стада обојице; Лот је изабрао равницу јорданску. Аврам је дигао шатор и дошао да живи код дубраве Мамрије у Хеврону, високо у брдима Јуде, и онде начинио жртвеник Господу."
      hu: "Egyiptomból visszatérve Ábrám és Lót elváltak, mert a föld nem bírta el mindkettőjük nyájait; Lót a Jordán síkságát választotta. Ábrám továbbvitte sátrát, és a mamrei tölgyesnél telepedett le Hebronban, magasan Júda hegyei között, és ott oltárt épített az Úrnak."
      fi: "Egyptistä palattuaan Abram ja Loot erosivat, koska maa ei riittänyt heidän molempien laumoilleen; Loot valitsi Jordanin lakeuden. Abram siirsi telttansa ja asettui asumaan Mamren tammistoon Hebronin luo, korkealle Juudan vuoristoon, ja rakensi sinne alttarin Herralle."
      vi: "Từ Ê-díp-tô trở về, Áp-ram và Lót chia rẽ nhau vì xứ không đủ nuôi bầy súc vật của cả hai; Lót chọn đồng bằng bên sông Giô-đanh. Áp-ram dời trại đến ở bên những cây sồi của Mam-rê tại Hếp-rôn, trên cao giữa miền núi Giu-đa, và lập tại đó một bàn thờ cho Đức Giê-hô-va."
      ro: "Întors din Egipt, Avram și Lot s-au despărțit, pentru că țara nu putea hrăni turmele amândurora; Lot a ales câmpia Iordanului. Avram și-a mutat cortul și a venit să locuiască lângă stejarii lui Mamre, la Hebron, sus în munții lui Iuda, și a zidit acolo un altar Domnului."
      bg: "Като се върнаха от Египет, Аврам и Лот се разделиха, защото земята не можеше да изхранва стадата и на двамата; Лот избра равнината на Йордан. Аврам вдигна шатъра си и дойде да живее при дъбравата Мамре в Хеврон, високо в Юдейските хълмове, и издигна там олтар на Господа."
  - place: a513646 # Dan
    ref: Gen.14.14
    note:
      en: "He pursues the kings who took Lot as far as Dan."
      ru: "Преследует царей, пленивших Лота, до Дана."
      uk: "Він переслідує царів, що забрали Лота, аж до Дана."
      es: "Persigue hasta Dan a los reyes que se llevaron a Lot."
      pt: "Persegue até Dã os reis que levaram Ló."
      de: "Er verfolgt die Könige, die Lot gefangen genommen haben, bis nach Dan."
      fr: "Il poursuit jusqu’à Dan les rois qui avaient emmené Lot."
      pl: "Ściga królów, którzy uprowadzili Lota, aż do Dan."
      it: "Insegue fino a Dan i re che avevano preso Lot."
      nl: "Hij achtervolgt de koningen die Lot hebben meegevoerd tot aan Dan."
      cs: "Pronásleduje krále, kteří odvedli Lota, až k Danu."
      sv: "Han förföljer de kungar som tog Lot till fånga, ända till Dan."
      nb: "Han forfølger kongene som hadde tatt Lot, helt til Dan."
      tl: "Hinahabol niya hanggang sa Dan ang mga haring bumihag kay Lot."
      da: "Han forfølger de konger, der havde ført Lot bort, lige til Dan."
      sr: "Гони цареве који су одвели Лота у ропство, све до Дана."
      hu: "Üldözőbe veszi a Lótot elhurcoló királyokat, egészen Dánig."
      fi: "Hän ajaa takaa kuninkaita, jotka veivät Lootin, aina Daniin saakka."
      vi: "Người đuổi theo các vua đã bắt Lót, cho đến tận Đan."
      ro: "Îi urmărește până la Dan pe regii care îl luaseră pe Lot."
      bg: "Той преследва царете, пленили Лот, чак до Дан."
    story:
      en: "When four kings from the east defeated the kings of the plain and carried off Lot, Abram armed his three hundred and eighteen trained servants, born in his household, and pursued them as far as Dan, the town at the foot of Mount Hermon by the springs of the Jordan, known in earlier times as Laish."
      ru: "Когда четыре царя с востока разбили царей долины и увели Лота, Аврам вооружил триста восемнадцать обученных рабов, рождённых в его доме, и преследовал их до Дана, города у подножия горы Ермон у истоков Иордана, в прежние времена известного как Лаис."
      uk: "Коли чотири царі зі сходу розбили царів долини й забрали Лота, Аврам озброїв триста вісімнадцять навчених слуг, що народилися в його домі, і переслідував їх аж до Дану, міста біля підніжжя гори Хермон при джерелах Йордану, відомого в давніші часи як Лаїш."
      es: "Cuando cuatro reyes del oriente derrotaron a los reyes de la llanura y se llevaron a Lot, Abram armó a sus trescientos dieciocho criados adiestrados, nacidos en su casa, y los persiguió hasta Dan, la ciudad al pie del monte Hermón, junto a las fuentes del Jordán, conocida en tiempos anteriores como Lais."
      pt: "Quando quatro reis do oriente derrotaram os reis da planície e levaram Ló, Abrão armou os seus trezentos e dezoito homens treinados, nascidos em sua casa, e perseguiu-os até Dã, a cidade ao pé do monte Hermom, junto às nascentes do Jordão, conhecida em tempos anteriores como Laís."
      de: "Als vier Könige aus dem Osten die Könige der Ebene besiegten und Lot verschleppten, rüstete Abram seine dreihundertachtzehn geübten, in seinem Haus geborenen Knechte und verfolgte sie bis nach Dan, der Stadt am Fuß des Hermon bei den Quellen des Jordan, die in früherer Zeit Lajisch hieß."
      fr: "Quand quatre rois venus de l’orient battirent les rois de la plaine et emmenèrent Lot, Abram arma ses trois cent dix-huit serviteurs exercés, nés dans sa maison, et les poursuivit jusqu’à Dan, la ville au pied du mont Hermon, près des sources du Jourdain, appelée autrefois Laïs."
      pl: "Gdy czterej królowie ze wschodu pokonali królów równiny i uprowadzili Lota, Abram uzbroił trzystu osiemnastu wyćwiczonych sług urodzonych w jego domu i ścigał ich aż do Dan, miasta u stóp góry Hermon przy źródłach Jordanu, znanego dawniej jako Lajisz."
      it: "Quando quattro re venuti dall’oriente sconfissero i re della pianura e portarono via Lot, Abramo armò i suoi trecentodiciotto servi addestrati, nati in casa sua, e li inseguì fino a Dan, la città ai piedi del monte Ermon presso le sorgenti del Giordano, nota in tempi più antichi come Lais."
      nl: "Toen vier koningen uit het oosten de koningen van de vlakte versloegen en Lot wegvoerden, wapende Abram zijn driehonderdachttien geoefende knechten, geboren in zijn huis, en achtervolgde hen tot aan Dan, de stad aan de voet van de Hermon bij de bronnen van de Jordaan, die vroeger Laïs heette."
      cs: "Když čtyři králové z východu porazili krále okrsku a odvedli Lota, Abram vyzbrojil tři sta osmnáct vycvičených služebníků zrozených v jeho domě a pronásledoval je až k Danu, městu na úpatí hory Hermon u pramenů Jordánu, dříve známému jako Lajiš."
      sv: "När fyra kungar från öster hade besegrat kungarna på slätten och fört bort Lot, beväpnade Abram sina tre hundra arton övade tjänare, födda i hans hus, och förföljde dem ända till Dan, staden vid foten av Hermon vid Jordans källor, som i äldre tid hette Lajish."
      nb: "Da fire konger fra øst hadde slått kongene på sletten og ført Lot bort, væpnet Abram sine tre hundre og atten øvede tjenere, født i hans hus, og forfulgte dem helt til Dan, byen ved foten av Hermon ved Jordans kilder, som i tidligere tider het Lajisj."
      tl: "Nang talunin ng apat na hari mula sa silangan ang mga hari ng kapatagan at bihagin si Lot, ipinagsama ni Abram ang kaniyang tatlong daan at labingwalong subok na lalake, na ipinanganak sa kaniyang bahay, at hinabol sila hanggang sa Dan, ang bayan sa paanan ng Bundok Hermon sa tabi ng mga bukal ng Jordan, na noong una ay kilala bilang Lais."
      da: "Da fire konger fra øst havde slået slettens konger og ført Lot bort, væbnede Abram sine tre hundrede og atten øvede tjenere, der var født i hans hus, og forfulgte dem helt til Dan, byen ved foden af Hermonbjerget ved Jordans kilder, som tidligere hed Lais."
      sr: "Кад су четири цара са истока потукла цареве равнице и одвела Лота, Аврам је наоружао својих триста осамнаест извежбаних слугу, рођених у његовој кући, и гонио их све до Дана, града у подножју горе Ермона код извора Јордана, који се раније звао Лаис."
      hu: "Amikor négy keleti király legyőzte a síkság királyait, és elhurcolta Lótot, Ábrám felfegyverezte háromszáztizennyolc gyakorlott, házában született szolgáját, és üldözte őket egészen Dánig, a Hermon-hegy lábánál, a Jordán forrásainál fekvő városig, amelyet korábban Laisának hívtak."
      fi: "Kun neljä kuningasta idästä oli voittanut lakeuden kuninkaat ja vienyt Lootin mukanaan, Abram aseisti kolmesataakahdeksantoista harjaantunutta palvelijaansa, jotka olivat syntyneet hänen kodissaan, ja ajoi heitä takaa aina Daniin, kaupunkiin Hermonvuoren juurella Jordanin lähteillä, joka oli aiemmin tunnettu nimellä Lais."
      vi: "Khi bốn vua từ phương đông đánh bại các vua của đồng bằng và bắt Lót đi, Áp-ram chiêu tập ba trăm mười tám gia nhân đã tập luyện, sinh ra trong nhà mình, và đuổi theo họ đến tận Đan, thành dưới chân núi Hẹt-môn bên các nguồn sông Giô-đanh, thuở trước gọi là La-ít."
      ro: "Când patru regi din răsărit i-au învins pe regii câmpiei și l-au luat pe Lot, Avram și-a înarmat cei trei sute optsprezece slujitori deprinși la luptă, născuți în casa lui, și i-a urmărit până la Dan, cetatea de la poalele Muntelui Hermon, lângă izvoarele Iordanului, cunoscută în vremuri mai vechi ca Laișa."
      bg: "Когато четирима царе от изток разбиха царете на равнината и отведоха Лот, Аврам въоръжи тристата и осемнадесетте си обучени слуги, родени в дома му, и ги преследва чак до Дан — града в подножието на планината Ермон при изворите на Йордан, познат в по-ранни времена като Лаис."
  - place: aad7e4e # Salem
    ref: Gen.14.18
    note:
      en: "Melchizedek, king of Salem, brings out bread and wine."
      ru: "Мелхиседек, царь Салимский, выносит хлеб и вино."
      uk: "Мелхиседек, цар Саліма, виносить хліб і вино."
      es: "Melquisedec, rey de Salem, saca pan y vino."
      pt: "Melquisedeque, rei de Salém, traz pão e vinho."
      de: "Melchisedek, der König von Salem, bringt Brot und Wein heraus."
      fr: "Melchisédek, roi de Salem, apporte du pain et du vin."
      pl: "Melchizedek, król Salemu, wynosi chleb i wino."
      it: "Melchisedek, re di Salem, porta fuori pane e vino."
      nl: "Melchizedek, de koning van Salem, brengt brood en wijn naar buiten."
      cs: "Melchisedek, král Šalému, vynáší chléb a víno."
      sv: "Melkisedek, kung av Salem, bär fram bröd och vin."
      nb: "Melkisedek, konge av Salem, bærer frem brød og vin."
      tl: "Naglalabas ng tinapay at alak si Melquisedec, na hari sa Salem."
      da: "Melkisedek, Salems konge, bringer brød og vin frem."
      sr: "Мелхиседек, цар салимски, износи хлеб и вино."
      hu: "Melkizedek, Sálem királya kenyeret és bort visz elé."
      fi: "Melkisedek, Salemin kuningas, tuo esiin leipää ja viiniä."
      vi: "Mên-chi-xê-đéc, vua Sa-lem, đem bánh và rượu ra."
      ro: "Melhisedec, regele Salemului, aduce pâine și vin."
      bg: "Мелхиседек, царят на Салим, изнася хляб и вино."
    story:
      en: "After Abram's return from defeating the kings, Melchizedek, king of Salem and priest of God Most High, brought out bread and wine and blessed Abram by God Most High, possessor of heaven and earth, and Abram gave him a tenth of everything. The Genesis Apocryphon from Qumran and Josephus identify Salem with Jerusalem, as the map does."
      ru: "Когда Аврам возвращался после поражения царей, Мелхиседек, царь Салимский и священник Бога Всевышнего, вынес хлеб и вино и благословил Аврама от Бога Всевышнего, Владыки неба и земли, и Аврам дал ему десятую часть из всего. Кумранский Апокриф Бытия и Иосиф Флавий отождествляют Салим с Иерусалимом, как и карта."
      uk: "Коли Аврам повертався після перемоги над царями, Мелхиседек, цар Саліма і священик Всевишнього Бога, виніс хліб і вино й благословив Аврама від Всевишнього Бога, Володаря неба й землі, і Аврам дав йому десятину з усього. Апокриф Буття з Кумрану та Йосип Флавій ототожнюють Салім з Єрусалимом, як і мапа."
      es: "Al volver Abram de derrotar a los reyes, Melquisedec, rey de Salem y sacerdote del Dios Alto, sacó pan y vino y bendijo a Abram por el Dios Alto, poseedor de los cielos y de la tierra, y Abram le dio el diezmo de todo. El Génesis apócrifo de Qumrán y Flavio Josefo identifican Salem con Jerusalén, como hace el mapa."
      pt: "Quando Abrão voltou de derrotar os reis, Melquisedeque, rei de Salém e sacerdote do Deus Altíssimo, trouxe pão e vinho e abençoou Abrão pelo Deus Altíssimo, Possuidor dos céus e da terra, e Abrão deu-lhe o dízimo de tudo. O Gênesis Apócrifo de Qumran e Flávio Josefo identificam Salém com Jerusalém, como faz o mapa."
      de: "Nach Abrams Rückkehr vom Sieg über die Könige brachte Melchisedek, König von Salem und Priester Gottes des Höchsten, Brot und Wein heraus und segnete Abram im Namen Gottes des Höchsten, des Besitzers von Himmel und Erde, und Abram gab ihm den Zehnten von allem. Das Genesis-Apokryphon aus Qumran und Josephus setzen Salem mit Jerusalem gleich, wie die Karte."
      fr: "Au retour d’Abram, après sa victoire sur les rois, Melchisédek, roi de Salem et sacrificateur du Dieu Très-Haut, apporta du pain et du vin et bénit Abram par le Dieu Très-Haut, maître du ciel et de la terre, et Abram lui donna la dîme de tout. L’Apocryphe de la Genèse, trouvé à Qumrân, et Josèphe identifient Salem à Jérusalem, comme le fait la carte."
      pl: "Gdy Abram wrócił po pokonaniu królów, Melchizedek, król Salemu i kapłan Boga Najwyższego, wyniósł chleb i wino i pobłogosławił Abrama w imię Boga Najwyższego, Stwórcy nieba i ziemi, a Abram dał mu dziesięcinę ze wszystkiego. Apokryf Księgi Rodzaju z Kumran i Józef Flawiusz utożsamiają Salem z Jerozolimą, podobnie jak mapa."
      it: "Al ritorno di Abramo dalla vittoria sui re, Melchisedek, re di Salem e sacerdote del Dio altissimo, portò fuori pane e vino e benedisse Abramo per il Dio altissimo, padrone del cielo e della terra, e Abramo gli diede la decima di tutto. L’Apocrifo della Genesi di Qumran e Giuseppe Flavio identificano Salem con Gerusalemme, come fa la mappa."
      nl: "Na de terugkeer van Abram van de overwinning op de koningen bracht Melchizedek, koning van Salem en priester van God de Allerhoogste, brood en wijn naar buiten en zegende Abram door God de Allerhoogste, de bezitter van hemel en aarde, en Abram gaf hem een tiende van alles. Het Genesis-apocryphon uit Qumran en Josephus stellen Salem gelijk aan Jeruzalem, zoals de kaart doet."
      cs: "Když se Abram vrátil po porážce králů, Melchisedek, král Šalému a kněz Boha Nejvyššího, vynesl chléb a víno a požehnal Abramovi Bohem Nejvyšším, vlastníkem nebe i země, a Abram mu dal desátek ze všeho. Apokryf Genesis z Kumránu a Josefus Flavius ztotožňují Šalém s Jeruzalémem, stejně jako mapa."
      sv: "När Abram kom tillbaka efter att ha besegrat kungarna, bar Melkisedek, kung i Salem och präst åt Gud den Högste, fram bröd och vin och välsignade Abram av Gud den Högste, som äger himmel och jord, och Abram gav honom tionde av allt. Genesisapokryfen från Qumran och Josefus identifierar Salem med Jerusalem, liksom kartan gör."
      nb: "Etter at Abram kom tilbake fra seieren over kongene, bar Melkisedek, konge i Salem og prest for Den høyeste Gud, fram brød og vin og velsignet Abram ved Den høyeste Gud, som eier himmel og jord, og Abram ga ham tiende av alt. Genesis-apokryfen fra Qumran og Josefus identifiserer Salem med Jerusalem, slik kartet gjør."
      tl: "Pagbalik ni Abram mula sa pagtalo sa mga hari, naglabas ng tinapay at alak si Melquisedec, hari sa Salem at saserdote ng Kataastaasang Diyos, at binasbasan si Abram sa pangalan ng Kataastaasang Diyos, na may-ari ng langit at ng lupa, at binigyan siya ni Abram ng ikasampung bahagi ng lahat. Kinikilala ng Apokripon ng Genesis mula sa Qumran at ni Josefo ang Salem na Jerusalem, gaya ng mapa."
      da: "Efter Abrams hjemkomst fra sejren over kongerne bragte Melkisedek, konge i Salem og den højeste Guds præst, brød og vin frem og velsignede Abram ved den højeste Gud, som ejer himmel og jord, og Abram gav ham tiende af alt. Genesis-apokryfen fra Qumran og Josefus identificerer Salem med Jerusalem, ligesom kortet gør."
      sr: "Кад се Аврам вратио пошто је потукао цареве, Мелхиседек, цар салимски и свештеник Бога Вишњег, изнео је хлеб и вино и благословио Аврама Богом Вишњим, чије је небо и земља, а Аврам му је дао десетак од свега. Апокриф Постања из Кумрана и Јосиф Флавије поистовећују Салим с Јерусалимом, као и карта."
      hu: "Miután Ábrám visszatért a királyok legyőzéséből, Melkizedek, Sálem királya és a Magasságos Isten papja kenyeret és bort hozott ki, és megáldotta Ábrámot a Magasságos Isten, ég és föld birtokosa nevében, Ábrám pedig mindenből tizedet adott neki. A qumráni Genezis-apokrifon és Josephus Flavius Sálemet Jeruzsálemmel azonosítja, ahogy a térkép is."
      fi: "Kun Abram palasi voitettuaan kuninkaat, Melkisedek, Salemin kuningas ja Jumalan, Korkeimman, pappi, toi leipää ja viiniä ja siunasi Abramin Jumalan, Korkeimman, taivaan ja maan omistajan, nimessä, ja Abram antoi hänelle kymmenykset kaikesta. Qumranin Genesis-apokryfi ja Josephus samastavat Salemin Jerusalemiin, kuten kartta tekee."
      vi: "Sau khi Áp-ram đánh bại các vua trở về, Mên-chi-xê-đéc, vua Sa-lem và thầy tế lễ của Đức Chúa Trời Chí cao, đem bánh và rượu ra và nhân danh Đức Chúa Trời Chí cao, là Đấng dựng nên trời và đất, chúc phước cho Áp-ram, và Áp-ram dâng cho vua một phần mười về mọi vật. Ngụy thư Sáng thế từ Qumran và Josephus đồng nhất Sa-lem với Giê-ru-sa-lem, như bản đồ."
      ro: "După întoarcerea lui Avram de la înfrângerea regilor, Melhisedec, regele Salemului și preot al Dumnezeului Celui Preaînalt, a adus pâine și vin și l-a binecuvântat pe Avram în numele Dumnezeului Celui Preaînalt, stăpânul cerului și al pământului, iar Avram i-a dat zeciuială din toate. Apocriful Genezei de la Qumran și Josephus Flavius identifică Salemul cu Ierusalimul, ca și harta."
      bg: "След като Аврам се върна от поражението на царете, Мелхиседек, цар на Салим и свещеник на Всевишния Бог, изнесе хляб и вино и благослови Аврам от Всевишния Бог, Владетеля на небето и на земята, а Аврам му даде десетък от всичко. Апокрифът на Битие от Кумран и Йосиф Флавий отъждествяват Салим с Йерусалим, както прави и картата."
  - place: a3f5814 # Gerar
    ref: Gen.20.1
    note:
      en: "He stays for a time in Gerar."
      ru: "Какое-то время живёт в Гераре."
      uk: "Якийсь час він живе в Герарі."
      es: "Permanece un tiempo en Gerar."
      pt: "Permanece por algum tempo em Gerar."
      de: "Er hält sich eine Zeit lang in Gerar auf."
      fr: "Il séjourne quelque temps à Guérar."
      pl: "Przez pewien czas przebywa w Gerarze."
      it: "Si ferma per un tempo a Gerar."
      nl: "Hij verblijft enige tijd in Gerar."
      cs: "Nějakou dobu pobývá v Geraru."
      sv: "Han stannar en tid i Gerar."
      nb: "Han oppholder seg en tid i Gerar."
      tl: "Nananatili siya nang ilang panahon sa Gerar."
      da: "Han opholder sig en tid i Gerar."
      sr: "Извесно време борави у Герару."
      hu: "Egy ideig Gerárban tartózkodik."
      fi: "Hän oleskelee jonkin aikaa Gerarissa."
      vi: "Người lưu lại một thời gian ở Ghê-ra."
      ro: "Locuiește o vreme în Gherar."
      bg: "Той живее известно време в Герар."
    story:
      en: "Abraham journeyed from there into the Negev and lived between Kadesh and Shur, and stayed for a time in Gerar. Gerar is now usually identified with Tel Haror, a large mound on Nahal Gerar some 27 km north-west of Beersheba."
      ru: "Авраам двинулся оттуда в Негев и поселился между Кадесом и Суром, и какое-то время жил в Гераре. Герар ныне обычно отождествляют с Тель-Харором, большим холмом на Нахаль-Герар примерно в 27 км к северо-западу от Вирсавии."
      uk: "Авраам вирушив звідти до Негеву й оселився між Кадешем і Шуром, і якийсь час жив у Герарі. Герар нині зазвичай ототожнюють з Тель-Харором, великим пагорбом на Нахаль-Герар приблизно за 27 км на північний захід від Беер-Шеви."
      es: "De allí Abraham viajó al Néguev, habitó entre Cades y Shur y residió un tiempo en Gerar. Gerar se identifica hoy por lo general con Tel Haror, un gran montículo junto al Nahal Gerar, a unos 27 km al noroeste de Beerseba."
      pt: "Dali Abraão viajou para o Neguev, habitou entre Cades e Sur e viveu por algum tempo em Gerar. Gerar é hoje geralmente identificada com Tel Haror, um grande montículo junto ao Nahal Gerar, cerca de 27 km a noroeste de Berseba."
      de: "Abraham zog von dort in den Negev, wohnte zwischen Kadesch und Schur und hielt sich eine Zeit lang in Gerar auf. Gerar wird heute gewöhnlich mit Tel Haror gleichgesetzt, einem großen Hügel am Nahal Gerar etwa 27 km nordwestlich von Beerscheba."
      fr: "Abraham partit de là pour le Négev et s’établit entre Kadès et Schur, et séjourna quelque temps à Guérar. Guérar est aujourd’hui d’ordinaire identifiée à Tel Haror, un grand tell sur le Nahal Gerar, à quelque 27 km au nord-ouest de Beer-Schéba."
      pl: "Abraham wyruszył stamtąd do Negewu i zamieszkał między Kadesz a Szur, a przez pewien czas przebywał w Gerarze. Gerar utożsamia się dziś zwykle z Tel Haror, dużym wzgórzem nad Nachal Gerar, około 27 km na północny zachód od Beer-Szeby."
      it: "Abramo partì di là verso il Negheb e abitò tra Kades e Sur, e soggiornò per un tempo a Gerar. Gerar è oggi di solito identificata con Tel Haror, un grande tell sul Nahal Gerar, circa 27 km a nord-ovest di Bersabea."
      nl: "Abraham trok van daar naar de Negev, woonde tussen Kades en Sur en verbleef enige tijd in Gerar. Gerar wordt nu gewoonlijk geïdentificeerd met Tel Haror, een grote heuvel aan de Nahal Gerar zo'n 27 km ten noordwesten van Berseba."
      cs: "Abraham odtud putoval do Negevu a usadil se mezi Kadešem a Šúrem a nějaký čas pobýval v Geraru. Gerar se dnes obvykle ztotožňuje s Tel Haror, velkým pahorkem nad Nachal Gerar asi 27 km severozápadně od Beer-šeby."
      sv: "Abraham drog därifrån till Negev och bodde mellan Kadesh och Shur, och han uppehöll sig en tid i Gerar. Gerar identifieras nu vanligen med Tel Haror, en stor kulle vid Nahal Gerar omkring 27 km nordväst om Beer Sheva."
      nb: "Abraham dro derfra til Negev og bodde mellom Kadesj og Sjur, og han oppholdt seg en tid i Gerar. Gerar blir nå vanligvis identifisert med Tel Haror, en stor haug ved Nahal Gerar omkring 27 km nordvest for Beer-Sjeba."
      tl: "Mula roon ay naglakbay si Abraham sa Negeb at tumahan sa pagitan ng Cades at Shur, at nakipamayan nang ilang panahon sa Gerar. Ang Gerar ay karaniwang kinikilala ngayong Tel Haror, isang malaking bunton sa Nahal Gerar mga 27 km sa hilagang-kanluran ng Beer-seba."
      da: "Abraham drog derfra ind i Negev og boede mellem Kades og Sur og opholdt sig en tid i Gerar. Gerar identificeres nu normalt med Tel Haror, en stor høj ved Nahal Gerar omkring 27 km nordvest for Beersheba."
      sr: "Аврам је оданде отишао у Негев и живео између Кадиса и Сура, и неко време боравио у Герару. Герар се данас обично поистовећује с Тел Харором, великом хумком на Нахал Герару око 27 км северозападно од Вирсавеје."
      hu: "Ábrahám onnan a Negevbe vándorolt, Kádes és Súr között lakott, és egy ideig Gerárban tartózkodott. Gerárt ma általában a Tel Harorral azonosítják, egy nagy halommal a Gerár-patak mentén, Beérsebától mintegy 27 km-re északnyugatra."
      fi: "Abraham siirtyi sieltä Negeviin ja asettui Kadeksen ja Suurin välille ja asui jonkin aikaa Gerarissa. Gerar samastetaan nykyään yleensä Tel Haroriin, suureen kumpuun Nahal Gerarin varrella noin 27 km Beersebasta luoteeseen."
      vi: "Từ đó Áp-ra-ham đi đến miền Nê-ghép, ở giữa khoảng Ca-đe và Su-rơ, và kiều ngụ một thời gian tại Ghê-ra. Ghê-ra nay thường được đồng nhất với Tel Haror, một gò lớn bên Nahal Gerar, cách Bê-e-Sê-ba khoảng 27 km về phía tây bắc."
      ro: "Avraam a plecat de acolo în Neghev și a locuit între Cades și Șur, și a stat o vreme în Gherar. Gherar este identificat astăzi de obicei cu Tel Haror, o movilă mare pe Nahal Gerar, la circa 27 km nord-vest de Beer-Șeba."
      bg: "Оттам Авраам тръгна към Негев и живя между Кадеш и Сур, и поживя известно време в Герар. Днес Герар обикновено се отъждествява с Тел Харор — голяма могила на Нахал Герар на около 27 км северозападно от Вирсавия."
  - place: ad2f6c2 # Beersheba
    ref: Gen.21.31
    note:
      en: "Abraham and Abimelech swear an oath, and the place is called Beersheba."
      ru: "Авраам и Авимелех клянутся друг другу, и место названо Вирсавией."
      uk: "Авраам і Авімелех складають присягу, і те місце дістає назву Беер-Шева."
      es: "Abraham y Abimelec se juran un pacto, y el lugar se llama Beerseba."
      pt: "Abraão e Abimeleque fazem um juramento, e o lugar é chamado Berseba."
      de: "Abraham und Abimelech schwören einander einen Eid, und der Ort heißt Beerscheba."
      fr: "Abraham et Abimélec prêtent serment, et le lieu est appelé Beer-Schéba."
      pl: "Abraham i Abimelek składają sobie przysięgę, a miejsce nazwano Beer-Szeba."
      it: "Abramo e Abimelech si scambiano un giuramento, e il luogo è chiamato Bersabea."
      nl: "Abraham en Abimelech zweren een eed, en de plaats wordt Berseba genoemd."
      cs: "Abraham a Abimelek si přísahají a místo se nazývá Beer-šeba."
      sv: "Abraham och Avimelek svär en ed, och platsen kallas Beer Sheva."
      nb: "Abraham og Abimelek sverger en ed, og stedet kalles Beer-Sjeba."
      tl: "Nanunumpa sina Abraham at Abimelech, at ang dako ay tinatawag na Beer-seba."
      da: "Abraham og Abimelek aflægger ed, og stedet kaldes Beersheba."
      sr: "Аврам и Авимелех полажу заклетву, и место се назива Вирсавеја."
      hu: "Ábrahám és Abimélek esküt tesznek, és a helyet Beérsebának nevezik."
      fi: "Abraham ja Abimelek vannovat valan, ja paikka saa nimen Beerseba."
      vi: "Áp-ra-ham và A-bi-mê-léc thề với nhau, và nơi ấy được gọi là Bê-e-Sê-ba."
      ro: "Avraam și Abimelec fac un jurământ, iar locul este numit Beer-Șeba."
      bg: "Авраам и Авимелех си дават клетва и мястото е наречено Вирсавия."
    story:
      en: "Abimelech, king of Gerar, and Phichol, the commander of his army, came to Abraham to make a covenant; Abraham complained about a well that Abimelech's servants had seized, set apart seven ewe lambs as witness that he had dug it, and the two swore an oath, so the place was called Beersheba. Abraham planted a grove there and called on the name of the Lord. The town of the Israelite kings stood on the mound of Tel Sheva, east of the modern city."
      ru: "Авимелех, царь Герарский, и Фихол, военачальник его, пришли к Аврааму заключить союз; Авраам упрекнул Авимелеха за колодец, который отняли рабы Авимелеха, отделил семь агниц в свидетельство того, что он выкопал его, и оба поклялись, поэтому место назвали Вирсавией. Авраам насадил там рощу и призвал имя Господа. Город израильских царей стоял на холме Тель-Шева, к востоку от современного города."
      uk: "Авімелех, цар Герара, і Піхол, начальник його війська, прийшли до Авраама укласти союз; Авраам дорікнув за криницю, яку захопили слуги Авімелеха, відділив сім ягничок на свідчення, що він її викопав, і обидва склали присягу, тож те місце назвали Беер-Шевою. Авраам насадив там гай і прикликав ім’я Господа. Місто ізраїльських царів стояло на пагорбі Тель-Шева, на схід від сучасного міста."
      es: "Abimelec, rey de Gerar, y Ficol, jefe de su ejército, fueron a Abraham para hacer un pacto; Abraham se quejó de un pozo del que se habían apoderado los siervos de Abimelec, apartó siete corderas como testimonio de que él lo había cavado, y los dos se juramentaron, por lo que el lugar se llamó Beerseba. Abraham plantó allí un bosque e invocó el nombre del Señor. La ciudad de los reyes israelitas estaba en el montículo de Tel Sheva, al este de la ciudad moderna."
      pt: "Abimeleque, rei de Gerar, e Ficol, o capitão do seu exército, vieram a Abraão para fazer uma aliança; Abraão queixou-se de um poço de que os servos de Abimeleque se tinham apoderado, separou sete cordeiras como testemunho de que o tinha cavado, e os dois fizeram um juramento, por isso o lugar foi chamado Berseba. Abraão plantou ali um bosque e invocou o nome do Senhor. A cidade dos reis israelitas ficava no montículo de Tel Sheva, a leste da cidade moderna."
      de: "Abimelech, der König von Gerar, und Phichol, sein Heerführer, kamen zu Abraham, um einen Bund zu schließen; Abraham beschwerte sich über einen Brunnen, den Abimelechs Knechte an sich gerissen hatten, sonderte sieben Lämmer zum Zeugnis aus, dass er ihn gegraben hatte, und die beiden schworen einander einen Eid, daher wurde der Ort Beerscheba genannt. Abraham pflanzte dort einen Hain und rief den Namen des Herrn an. Die Stadt der israelitischen Könige lag auf dem Hügel Tel Scheva, östlich der heutigen Stadt."
      fr: "Abimélec, roi de Guérar, et Picol, chef de son armée, vinrent à Abraham pour conclure une alliance ; Abraham se plaignit d’un puits dont les serviteurs d’Abimélec s’étaient emparés, mit à part sept jeunes brebis comme témoignage qu’il l’avait creusé, et tous deux prêtèrent serment ; aussi le lieu fut-il appelé Beer-Schéba. Abraham y planta des tamaris et invoqua le nom de l’Éternel. La ville des rois israélites se trouvait sur le tell de Tel Sheva, à l’est de la ville moderne."
      pl: "Abimelek, król Geraru, i Pikol, dowódca jego wojska, przyszli do Abrahama, by zawrzeć przymierze; Abraham uskarżał się na studnię, którą zagarnęli słudzy Abimeleka, odłączył siedem jagniąt jako świadectwo, że to on ją wykopał, i obaj złożyli przysięgę, dlatego miejsce nazwano Beer-Szeba. Abraham zasadził tam gaj i wzywał imienia Pana. Miasto królów izraelskich stało na wzgórzu Tel Szewa, na wschód od współczesnego miasta."
      it: "Abimelech, re di Gerar, e Picol, capo del suo esercito, vennero da Abramo per fare un’alleanza; Abramo si lamentò di un pozzo di cui i servi di Abimelech si erano impadroniti, mise da parte sette agnelle come testimonianza di averlo scavato, e i due fecero giuramento, perciò il luogo fu chiamato Bersabea. Abramo vi piantò un tamerisco e invocò il nome del Signore. La città dei re israeliti sorgeva sul tell di Tel Sheva, a est della città moderna."
      nl: "Abimelech, de koning van Gerar, en Pichol, zijn legeroverste, kwamen naar Abraham om een verbond te sluiten; Abraham klaagde over een put die de knechten van Abimelech in beslag hadden genomen, zonderde zeven ooilammeren af als getuigenis dat hij hem gegraven had, en de twee zwoeren een eed, zodat de plaats Berseba werd genoemd. Abraham plantte daar een bosje en riep de naam van de HEER aan. De stad van de Israëlitische koningen lag op de heuvel Tel Sheva, ten oosten van de huidige stad."
      cs: "Abimelek, král Geraru, a Pikol, velitel jeho vojska, přišli k Abrahamovi uzavřít smlouvu; Abraham si stěžoval na studnu, které se zmocnili Abimelekovi služebníci, oddělil sedm jehniček na svědectví, že ji vykopal on, a oba si přísahali, a proto se místo nazývá Beer-šeba. Abraham tam vysadil háj a vzýval Hospodinovo jméno. Město izraelských králů stálo na pahorku Tel Ševa východně od moderního města."
      sv: "Avimelek, kung i Gerar, och Pikol, hans härförare, kom till Abraham för att sluta förbund; Abraham klagade över en brunn som Avimeleks tjänare hade tagit, ställde fram sju lamm som vittnesbörd om att han hade grävt den, och de två svor en ed, så att platsen kallades Beer Sheva. Abraham planterade en lund där och åkallade Herrens namn. De israelitiska kungarnas stad låg på kullen Tel Sheva, öster om den moderna staden."
      nb: "Abimelek, kongen i Gerar, og Pikol, hans hærfører, kom til Abraham for å slutte en pakt; Abraham klaget over en brønn som Abimeleks tjenere hadde tatt, satte til side sju lam som vitnesbyrd om at han hadde gravd den, og de to sverget en ed, så stedet ble kalt Beer-Sjeba. Abraham plantet en lund der og påkalte Herrens navn. De israelittiske kongenes by lå på haugen Tel Sheva, øst for den moderne byen."
      tl: "Dumating kay Abraham si Abimelech, hari sa Gerar, at si Ficol, ang kapitan ng kaniyang hukbo, upang makipagtipan; pinagwikaan ni Abraham si Abimelech dahil sa isang balon na inagaw ng mga bataan ni Abimelech, ibinukod ang pitong korderong babae bilang patotoo na hinukay niya ito, at nanumpa silang dalawa, kaya't tinawag ang dakong yaon na Beer-seba. Nagtanim doon si Abraham ng isang kakahuyan at sinambitla ang pangalan ng Panginoon. Ang bayan ng mga haring Israelita ay nakatayo sa bunton ng Tel Sheva, sa silangan ng makabagong lungsod."
      da: "Abimelek, Gerars konge, og Pikol, hans hærfører, kom til Abraham for at slutte pagt; Abraham klagede over en brønd, som Abimeleks tjenere havde taget, satte syv hunlam til side som vidnesbyrd om, at han havde gravet den, og de to svor en ed, og derfor blev stedet kaldt Beersheba. Abraham plantede en lund dér og påkaldte Herrens navn. De israelitiske kongers by lå på højen Tel Sheva øst for den moderne by."
      sr: "Авимелех, цар герарски, и Фихол, војвода његов, дошли су Авраму да склопе савез; Аврам се пожалио због студенца који су Авимелехове слуге отеле, одвојио седам јагањаца као сведочанство да га је он ископао, и њих двојица су се заклела, па се место прозвало Вирсавеја. Аврам је онде посадио луг и призвао име Господње. Град израиљских царева стајао је на хумци Тел Шева, источно од савременог града."
      hu: "Abimélek, Gerár királya és Pikhól, seregének vezére eljött Ábrahámhoz, hogy szövetséget kössenek; Ábrahám panaszt tett egy kút miatt, amelyet Abimélek szolgái elvettek, hét nőstény bárányt különített el tanúságul, hogy ő ásta, és ketten megesküdtek, ezért nevezték a helyet Beérsebának. Ábrahám ligetet ültetett ott, és segítségül hívta az Úr nevét. Az izráeli királyok városa a Tel Seva halmán állt, a mai várostól keletre."
      fi: "Gerarin kuningas Abimelek ja hänen sotapäällikkönsä Pikol tulivat Abrahamin luo tekemään liiton; Abraham valitti kaivosta, jonka Abimelekin palvelijat olivat anastaneet, erotti seitsemän uuhikaritsaa todisteeksi siitä, että hän oli kaivanut sen, ja he molemmat vannoivat valan, ja niin paikkaa kutsuttiin Beersebaksi. Abraham istutti sinne lehdon ja huusi avuksi Herran nimeä. Israelin kuninkaiden aikainen kaupunki oli Tel Shevan kummulla nykyisen kaupungin itäpuolella."
      vi: "A-bi-mê-léc, vua Ghê-ra, và Phi-côn, quan tổng binh của vua, đến cùng Áp-ra-ham để lập giao ước; Áp-ra-ham phàn nàn về một cái giếng mà đầy tớ của A-bi-mê-léc đã chiếm đoạt, để riêng bảy con chiên tơ làm chứng rằng mình đã đào giếng ấy, và hai người thề nguyện cùng nhau, nên nơi ấy được gọi là Bê-e-Sê-ba. Áp-ra-ham trồng một lùm cây tại đó và cầu khẩn danh Đức Giê-hô-va. Thành của các vua Y-sơ-ra-ên đứng trên gò Tel Sheva, ở phía đông thành phố ngày nay."
      ro: "Abimelec, regele Gherarului, și Fihol, căpetenia oștirii lui, au venit la Avraam ca să încheie un legământ; Avraam s-a plâns de o fântână pe care o luaseră slujitorii lui Abimelec, a pus deoparte șapte mielușele ca mărturie că el o săpase, iar cei doi au jurat, de aceea locul a fost numit Beer-Șeba. Avraam a sădit acolo o dumbravă și a chemat numele Domnului. Cetatea regilor israeliți se afla pe movila Tel Sheva, la est de orașul modern."
      bg: "Авимелех, царят на Герар, и Фихол, военачалникът му, дойдоха при Авраам да сключат съюз; Авраам се оплака за един кладенец, който слугите на Авимелех бяха отнели, отдели седем женски агнета като свидетелство, че той го е изкопал, и двамата се заклеха, затова мястото беше наречено Вирсавия. Авраам насади там дъбрава и призова името Господне. Градът на израилските царе стоеше на могилата Тел Шева, на изток от днешния град."
  - place: adaf385 # Moriah
    ref: Gen.22.2-Gen.22.13
    took: { days: 3, about: true, ref: Gen.22.4 }
    note:
      en: "The binding of Isaac on a mountain in the land of Moriah."
      ru: "Жертвоприношение Исаака на горе в земле Мориа."
      uk: "Зв’язування Ісаака на горі в землі Морія."
      es: "El sacrificio de Isaac en un monte de la tierra de Moriah."
      pt: "Isaque é amarrado para o sacrifício num monte da terra de Moriá."
      de: "Die Bindung Isaaks auf einem Berg im Land Morija."
      fr: "La ligature d’Isaac sur une montagne du pays de Morija."
      pl: "Związanie Izaaka na górze w ziemi Moria."
      it: "Il sacrificio di Isacco su un monte nel paese di Moria."
      nl: "De binding van Isaak op een berg in het land Moria."
      cs: "Svázání Izáka na hoře v zemi Moria."
      sv: "Isaks bindning på ett berg i Moria land."
      nb: "Isaks offerbinding på et fjell i Moria land."
      tl: "Ang paggapos kay Isaac sa isang bundok sa lupain ng Moria."
      da: "Bindingen af Isak på et bjerg i Morijas land."
      sr: "Приношење Исака на жртву на једном брду у земљи Морији."
      hu: "Izsák megkötözése egy hegyen, Móriá földjén."
      fi: "Iisakin sitominen vuorella Morian maassa."
      vi: "Việc trói Y-sác trên một ngọn núi trong xứ Mô-ri-a."
      ro: "Legarea lui Isaac pe un munte din țara Moria."
      bg: "Обвързването на Исаак на една планина в земята Мория."
    story:
      en: "God tested Abraham and told him to take his only son Isaac, whom he loved, to the land of Moriah and offer him there as a burnt offering on one of the mountains. Abraham set out early with Isaac, two servants and wood for the offering, and on the third day he saw the place from afar. Isaac carried the wood and asked where the lamb was; Abraham answered that God would provide himself a lamb. Abraham built the altar, bound Isaac and took the knife, but the angel of the Lord called to him from heaven to do the boy no harm; Abraham saw a ram caught in a thicket by its horns and offered it instead of his son. Afterwards they went back together to Beersheba."
      ru: "Бог испытал Авраама и велел ему взять единственного сына Исаака, которого он любил, пойти в землю Мориа и принести его там во всесожжение на одной из гор. Авраам рано отправился в путь с Исааком, двумя слугами и дровами для всесожжения и на третий день увидел то место издалека. Исаак нёс дрова и спросил, где агнец; Авраам ответил, что Бог усмотрит Себе агнца. Авраам устроил жертвенник, связал Исаака и взял нож, но Ангел Господень воззвал к нему с неба, чтобы он не делал отроку ничего; Авраам увидел овна, запутавшегося в чаще рогами, и принёс его вместо сына. Потом они вместе вернулись в Вирсавию."
      uk: "Бог випробував Авраама й звелів йому взяти свого єдиного сина Ісаака, якого він любив, піти до землі Морія й принести його там у цілопалення на одній з гір. Авраам рано вирушив з Ісааком, двома слугами й дровами для цілопалення і третього дня побачив те місце здалеку. Ісаак ніс дрова й спитав, де ягня; Авраам відповів, що Бог Сам собі вибере ягня. Авраам збудував жертовник, зв’язав Ісаака й узяв ножа, але ангел Господній закликав до нього з неба не чинити хлопцеві зла; Авраам побачив барана, що заплутався рогами в гущавині, і приніс його замість сина. Потім вони разом повернулися до Беер-Шеви."
      es: "Dios probó a Abraham y le dijo que tomara a su único hijo Isaac, a quien amaba, y fuera a la tierra de Moriah para ofrecerlo allí en holocausto sobre uno de los montes. Abraham salió de madrugada con Isaac, dos criados y leña para el holocausto, y al tercer día vio el lugar de lejos. Isaac llevaba la leña y preguntó dónde estaba el cordero; Abraham respondió que Dios se proveería de cordero. Abraham edificó el altar, ató a Isaac y tomó el cuchillo, pero el ángel del Señor lo llamó desde el cielo para que no hiciera daño al muchacho; Abraham vio un carnero trabado por los cuernos en un zarzal y lo ofreció en lugar de su hijo. Después volvieron juntos a Beerseba."
      pt: "Deus pôs Abraão à prova e disse-lhe que tomasse o seu único filho, Isaque, a quem amava, e fosse à terra de Moriá para oferecê-lo ali em holocausto sobre um dos montes. Abraão partiu de madrugada com Isaque, dois servos e lenha para o holocausto, e no terceiro dia viu o lugar de longe. Isaque levava a lenha e perguntou onde estava o cordeiro; Abraão respondeu que Deus proveria para si o cordeiro. Abraão edificou o altar, amarrou Isaque e tomou a faca, mas o anjo do Senhor chamou-o do céu para que não fizesse mal ao menino; Abraão viu um carneiro preso pelos chifres num arbusto e ofereceu-o em lugar de seu filho. Depois voltaram juntos para Berseba."
      de: "Gott prüfte Abraham und sagte ihm, er solle seinen einzigen Sohn Isaak, den er liebte, in das Land Morija bringen und ihn dort auf einem der Berge als Brandopfer darbringen. Abraham brach früh mit Isaak, zwei Knechten und Holz für das Opfer auf und sah am dritten Tag die Stätte von ferne. Isaak trug das Holz und fragte, wo das Lamm sei; Abraham antwortete, Gott werde sich ein Lamm ersehen. Abraham baute den Altar, band Isaak und nahm das Messer, doch der Engel des Herrn rief ihm vom Himmel zu, dem Knaben nichts zu tun; Abraham sah einen Widder, der sich mit seinen Hörnern im Gestrüpp verfangen hatte, und opferte ihn an Stelle seines Sohnes. Danach gingen sie miteinander zurück nach Beerscheba."
      fr: "Dieu mit Abraham à l’épreuve et lui dit de prendre son fils unique Isaac, qu’il aimait, d’aller au pays de Morija et de l’y offrir en holocauste sur l’une des montagnes. Abraham partit de bon matin avec Isaac, deux serviteurs et du bois pour l’holocauste, et le troisième jour il vit le lieu de loin. Isaac portait le bois et demanda où était l’agneau ; Abraham répondit que Dieu se pourvoirait lui-même de l’agneau. Abraham bâtit l’autel, lia Isaac et prit le couteau, mais l’ange de l’Éternel l’appela du ciel pour qu’il ne fasse aucun mal à l’enfant ; Abraham vit un bélier retenu dans un buisson par les cornes et l’offrit à la place de son fils. Ensuite, ils s’en retournèrent ensemble à Beer-Schéba."
      pl: "Bóg wystawił Abrahama na próbę i polecił mu wziąć swego jedynego syna Izaaka, którego kochał, do ziemi Moria i złożyć go tam w ofierze całopalnej na jednej z gór. Abraham wyruszył wcześnie rano z Izaakiem, dwoma sługami i drwami na ofiarę, a trzeciego dnia ujrzał to miejsce z daleka. Izaak niósł drwa i zapytał, gdzie jest jagnię; Abraham odpowiedział, że Bóg sam upatrzy sobie jagnię. Abraham zbudował ołtarz, związał Izaaka i wziął nóż, lecz anioł Pana zawołał do niego z nieba, by nie czynił chłopcu nic złego; Abraham zobaczył barana uwikłanego rogami w gęstwinie i złożył go w ofierze zamiast syna. Potem wrócili razem do Beer-Szeby."
      it: "Dio mise alla prova Abramo e gli disse di prendere il suo unico figlio Isacco, che egli amava, di andare nel paese di Moria e di offrirlo là in olocausto su uno dei monti. Abramo partì di buon mattino con Isacco, due servi e la legna per l’olocausto, e il terzo giorno vide il luogo da lontano. Isacco portava la legna e chiese dove fosse l’agnello; Abramo rispose che Dio stesso avrebbe provveduto l’agnello. Abramo costruì l’altare, legò Isacco e prese il coltello, ma l’angelo del Signore lo chiamò dal cielo perché non facesse alcun male al ragazzo; Abramo vide un montone preso per le corna in un cespuglio e lo offrì al posto di suo figlio. Poi tornarono insieme a Bersabea."
      nl: "God beproefde Abraham en zei hem zijn enige zoon Isaak, die hij liefhad, naar het land Moria te brengen en hem daar op een van de bergen als brandoffer te offeren. Abraham vertrok vroeg met Isaak, twee knechten en hout voor het offer, en op de derde dag zag hij de plaats van verre. Isaak droeg het hout en vroeg waar het lam was; Abraham antwoordde dat God Zichzelf een lam zou voorzien. Abraham bouwde het altaar, bond Isaak en nam het mes, maar de engel van de HEER riep hem vanuit de hemel toe de jongen geen kwaad te doen; Abraham zag een ram die met zijn horens in het struikgewas vastzat, en offerde die in plaats van zijn zoon. Daarna gingen zij samen terug naar Berseba."
      cs: "Bůh Abrahama zkoušel a řekl mu, aby vzal svého jediného syna Izáka, kterého miloval, do země Moria a obětoval ho tam v zápalnou oběť na jedné z hor. Abraham vyšel časně ráno s Izákem, dvěma služebníky a dřívím k oběti a třetího dne uviděl to místo zdálky. Izák nesl dříví a zeptal se, kde je beránek; Abraham odpověděl, že si Bůh sám vyhlédne beránka. Abraham postavil oltář, svázal Izáka a vzal nůž, ale Hospodinův anděl na něj zavolal z nebe, aby chlapci neublížil; Abraham uviděl berana zapleteného rohy v houští a obětoval ho místo svého syna. Potom se spolu vrátili do Beer-šeby."
      sv: "Gud prövade Abraham och sade åt honom att ta sin ende son Isak, som han älskade, till Moria land och offra honom där som brännoffer på ett av bergen. Abraham bröt upp tidigt med Isak, två tjänare och ved till offret, och på tredje dagen såg han platsen på avstånd. Isak bar veden och frågade var lammet fanns; Abraham svarade att Gud själv skulle utse åt sig ett lamm. Abraham byggde altaret, band Isak och tog kniven, men Herrens ängel ropade till honom från himlen att inte göra pojken något ont; Abraham såg en vädur som hade fastnat med hornen i ett snår och offrade den i stället för sin son. Sedan gick de tillsammans tillbaka till Beer Sheva."
      nb: "Gud prøvde Abraham og ba ham ta sin eneste sønn Isak, som han elsket, til Moria land og ofre ham der som brennoffer på et av fjellene. Abraham dro tidlig av sted med Isak, to tjenere og ved til offeret, og på den tredje dagen så han stedet langt borte. Isak bar veden og spurte hvor lammet var; Abraham svarte at Gud selv ville utse seg et lam. Abraham bygde alteret, bandt Isak og tok kniven, men Herrens engel ropte til ham fra himmelen at han ikke skulle gjøre gutten noe; Abraham så en vær som satt fast i et kratt med hornene, og ofret den i stedet for sønnen. Etterpå dro de sammen tilbake til Beer-Sjeba."
      tl: "Sinubok ng Diyos si Abraham at sinabihang dalhin ang kaniyang bugtong na anak na si Isaac, na kaniyang minamahal, sa lupain ng Moria at ihain siya roon bilang handog na susunugin sa ibabaw ng isa sa mga bundok. Bumangong maaga si Abraham at umalis kasama si Isaac, ang dalawang alila at ang kahoy para sa handog, at nang ikatlong araw ay natanaw niya ang dako sa malayo. Pinasan ni Isaac ang kahoy at nagtanong kung nasaan ang kordero; sumagot si Abraham na ang Diyos ang maghahanda ng kordero. Nagtayo si Abraham ng dambana, tinalian si Isaac at hinawakan ang sundang, ngunit tinawag siya ng anghel ng Panginoon mula sa langit na huwag gawan ng masama ang bata; nakita ni Abraham ang isang tupang lalake na huli sa dawag sa kaniyang mga sungay at inihandog ito na inihalili sa kaniyang anak. Pagkatapos ay samasama silang bumalik sa Beer-seba."
      da: "Gud prøvede Abraham og sagde, at han skulle tage sin eneste søn Isak, som han elskede, til Morijas land og ofre ham dér som brændoffer på et af bjergene. Abraham drog tidligt af sted med Isak, to tjenere og brænde til offeret, og på den tredje dag så han stedet langt borte. Isak bar brændet og spurgte, hvor lammet var; Abraham svarede, at Gud selv ville udse sig lammet. Abraham byggede alteret, bandt Isak og tog kniven, men Herrens engel råbte til ham fra himlen, at han ikke måtte gøre drengen noget; Abraham så en vædder, der havde viklet sig fast i et krat med hornene, og ofrede den i stedet for sin søn. Derefter gik de sammen tilbage til Beersheba."
      sr: "Бог је искушао Аврама и рекао му да узме свог јединог сина Исака, кога је волео, у земљу Морију и да га тамо принесе на жртву паљеницу на једном од брда. Аврам је рано кренуо с Исаком, двојицом слугу и дрвима за жртву, и трећег дана угледао место издалека. Исак је носио дрва и питао где је јагње; Аврам је одговорио да ће се Бог сам постарати за јагње. Аврам је начинио жртвеник, свезао Исака и узео нож, али анђео Господњи викнуо га је с неба да не чини ништа детету; Аврам је угледао овна који се роговима заплео у честар и принео га на жртву место сина свог. Потом су се заједно вратили у Вирсавеју."
      hu: "Isten próbára tette Ábrahámot, és azt mondta neki, hogy vigye egyetlen fiát, Izsákot, akit szeretett, Móriá földjére, és ott áldozza fel égőáldozatul az egyik hegyen. Ábrahám korán elindult Izsákkal, két szolgával és az áldozathoz való fával, és a harmadik napon messziről meglátta a helyet. Izsák vitte a fát, és megkérdezte, hol van a bárány; Ábrahám azt felelte, hogy Isten majd gondoskodik magának bárányról. Ábrahám megépítette az oltárt, megkötözte Izsákot, és fogta a kést, de az Úr angyala kiáltott neki az égből, hogy ne bántsa a fiút; Ábrahám meglátott egy kost, amely szarvánál fogva fennakadt a bozótban, és azt áldozta fel a fia helyett. Azután együtt visszamentek Beérsebába."
      fi: "Jumala koetteli Abrahamia ja käski hänen viedä ainoan poikansa Iisakin, jota hän rakasti, Morian maahan ja uhrata hänet siellä polttouhriksi yhdellä vuorista. Abraham lähti varhain liikkeelle Iisakin, kahden palvelijan ja uhripuiden kanssa, ja kolmantena päivänä hän näki paikan kaukaa. Iisak kantoi puita ja kysyi, missä lammas oli; Abraham vastasi, että Jumala katsoisi itselleen lampaan. Abraham rakensi alttarin, sitoi Iisakin ja otti veitsen, mutta Herran enkeli huusi hänelle taivaasta, ettei hän saanut tehdä pojalle pahaa; Abraham näki oinaan, joka oli takertunut sarvistaan pensaikkoon, ja uhrasi sen poikansa sijasta. Sen jälkeen he palasivat yhdessä Beersebaan."
      vi: "Đức Chúa Trời thử Áp-ra-ham và bảo ông đem con một của mình là Y-sác, đứa con ông yêu dấu, đến xứ Mô-ri-a và dâng nó tại đó làm của lễ thiêu trên một trong các ngọn núi. Áp-ra-ham dậy sớm lên đường cùng Y-sác, hai đầy tớ và củi cho của lễ, và đến ngày thứ ba ông thấy nơi ấy từ đằng xa. Y-sác vác củi và hỏi chiên con ở đâu; Áp-ra-ham đáp rằng chính Đức Chúa Trời sẽ sắm sẵn chiên con. Áp-ra-ham lập bàn thờ, trói Y-sác và cầm lấy dao, nhưng thiên sứ của Đức Giê-hô-va từ trên trời gọi ông, bảo đừng làm hại đứa trẻ; Áp-ra-ham thấy một con chiên đực có sừng mắc trong bụi cây và dâng nó thay cho con mình. Sau đó họ cùng nhau trở về Bê-e-Sê-ba."
      ro: "Dumnezeu l-a încercat pe Avraam și i-a spus să-l ia pe singurul său fiu, Isaac, pe care îl iubea, în țara Moria și să-l aducă acolo ardere de tot pe unul dintre munți. Avraam a pornit dis-de-dimineață cu Isaac, cu doi slujitori și cu lemne pentru jertfă, iar în a treia zi a văzut locul de departe. Isaac ducea lemnele și a întrebat unde este mielul; Avraam a răspuns că Dumnezeu își va purta singur de grijă de miel. Avraam a zidit altarul, l-a legat pe Isaac și a luat cuțitul, dar îngerul Domnului l-a strigat din cer să nu-i facă niciun rău băiatului; Avraam a văzut un berbec prins de coarne într-un tufiș și l-a adus jertfă în locul fiului său. Apoi s-au întors împreună la Beer-Șeba."
      bg: "Бог изпита Авраам и му каза да вземе единствения си син Исаак, когото обичаше, в земята Мория и да го принесе там във всеизгаряне на една от планините. Авраам тръгна рано с Исаак, двама слуги и дърва за всеизгарянето и на третия ден видя мястото отдалеч. Исаак носеше дървата и попита къде е агнето; Авраам отговори, че Бог сам ще си промисли агне. Авраам издигна олтара, върза Исаак и взе ножа, но ангелът Господен му извика от небето да не прави зло на момчето; Авраам видя овен, заплетен с рогата си в храст, и го принесе вместо сина си. После двамата се върнаха заедно във Вирсавия."
  - place: ae00861 # Machpelah
    ref: Gen.23.19
    note:
      en: "Sarah is buried in the cave of Machpelah; later Abraham too (Gen 25:9)."
      ru: "Сарра погребена в пещере Махпела; позже там же — Авраам (Быт 25:9)."
      uk: "Сарру ховають у печері Махпела; пізніше там ховають і Авраама (Бут 25:9)."
      es: "Sara es sepultada en la cueva de Macpela; más tarde también Abraham (Gn 25:9)."
      pt: "Sara é sepultada na caverna de Macpela; mais tarde, também Abraão (Gn 25:9)."
      de: "Sara wird in der Höhle Machpela begraben, später auch Abraham (1. Mose 25,9)."
      fr: "Sara est ensevelie dans la caverne de Macpéla ; plus tard Abraham y est aussi enseveli (Gn 25:9)."
      pl: "Sara zostaje pochowana w jaskini Makpela; później także Abraham (Rdz 25,9)."
      it: "Sara è sepolta nella caverna di Macpela; più tardi vi sarà sepolto anche Abramo (Gen 25,9)."
      nl: "Sara wordt begraven in de spelonk van Machpela; later ook Abraham (Gen. 25:9)."
      cs: "Sára je pohřbena v jeskyni Makpela; později i Abraham (Gn 25,9)."
      sv: "Sara begravs i grottan i Makpela; senare även Abraham (1 Mos 25:9)."
      nb: "Sara blir gravlagt i Makpela-hulen; senere også Abraham (1 Mos 25,9)."
      tl: "Inililibing si Sara sa yungib ng Macpela; at kalaunan ay si Abraham din (Gen 25:9)."
      da: "Sara bliver begravet i Makpelas hule; senere også Abraham (1 Mos 25,9)."
      sr: "Сара је сахрањена у пећини Макпели; касније и Аврам (Пост 25,9)."
      hu: "Sárát a makpélai barlangban temetik el; később Ábrahámot is (1Móz 25,9)."
      fi: "Saara haudataan Makpelan luolaan; myöhemmin myös Abraham (1. Moos. 25:9)."
      vi: "Sa-ra được chôn trong hang đá Mặc-bê-la; về sau Áp-ra-ham cũng được chôn tại đó (Sáng 25:9)."
      ro: "Sara este îngropată în peștera Macpela; mai târziu și Avraam (Geneza 25:9)."
      bg: "Сара е погребана в пещерата Махпела; по-късно там е погребан и Авраам (Бит. 25:9)."
    story:
      en: "Sarah died at Kiriath-arba, that is Hebron, a hundred and twenty-seven years old. Abraham, a stranger among the Hittites there, bought from Ephron the field of Machpelah with its cave and trees for four hundred shekels of silver, and buried Sarah in the cave, opposite Mamre; later Isaac and Ishmael buried Abraham beside her. The cave is placed under the great stone enclosure in Hebron known as the Cave of the Patriarchs, usually attributed to Herod the Great."
      ru: "Сарра умерла в Кириаф-Арбе, то есть в Хевроне, ста двадцати семи лет. Авраам, пришлец среди живших там сынов Хетовых, купил у Ефрона поле Махпела с пещерой и деревьями за четыреста сиклей серебра и похоронил Сарру в пещере, против Мамре; позже Исаак и Измаил похоронили Авраама рядом с ней. Пещеру помещают под большой каменной оградой в Хевроне, известной как Пещера Патриархов, которую обычно приписывают Ироду Великому."
      uk: "Сарра померла в Кір’ят-Арбі, тобто в Хевроні, ста двадцяти семи років. Авраам, чужинець серед хетеїв, що жили там, купив в Ефрона поле Махпела з печерою й деревами за чотириста шеклів срібла й поховав Сарру в печері, навпроти Мамре; пізніше Ісаак та Ізмаїл поховали Авраама поруч із нею. Печеру розміщують під великою кам’яною огорожею в Хевроні, відомою як Печера Патріархів, яку зазвичай приписують Іродові Великому."
      es: "Sara murió en Quiriat-arba, que es Hebrón, a los ciento veintisiete años. Abraham, extranjero entre los heteos de allí, compró a Efrón el campo de Macpela con su cueva y sus árboles por cuatrocientos siclos de plata, y sepultó a Sara en la cueva, frente a Mamre; más tarde Isaac e Ismael sepultaron a Abraham junto a ella. La cueva se sitúa bajo el gran recinto de piedra de Hebrón conocido como la Cueva de los Patriarcas, atribuido por lo general a Herodes el Grande."
      pt: "Sara morreu em Quiriate-Arba, isto é, Hebrom, aos cento e vinte e sete anos. Abraão, estrangeiro entre os heteus dali, comprou de Efrom o campo de Macpela, com a sua caverna e as suas árvores, por quatrocentos siclos de prata, e sepultou Sara na caverna, em frente a Manre; mais tarde Isaque e Ismael sepultaram Abraão ao lado dela. A caverna é situada sob o grande recinto de pedra de Hebrom conhecido como Caverna dos Patriarcas, geralmente atribuído a Herodes, o Grande."
      de: "Sara starb in Kirjat-Arba, das ist Hebron, hundertsiebenundzwanzig Jahre alt. Abraham, ein Fremdling unter den Hethitern dort, kaufte von Efron das Feld Machpela mit seiner Höhle und seinen Bäumen für vierhundert Schekel Silber und begrub Sara in der Höhle, gegenüber von Mamre; später begruben Isaak und Ismael Abraham neben ihr. Die Höhle wird unter der großen steinernen Umfassung in Hebron angenommen, die als Patriarchengrab bekannt ist und gewöhnlich Herodes dem Großen zugeschrieben wird."
      fr: "Sara mourut à Kirjath-Arba, qui est Hébron, âgée de cent vingt-sept ans. Abraham, étranger parmi les Héthiens du lieu, acheta à Éphron le champ de Macpéla, avec sa caverne et ses arbres, pour quatre cents sicles d’argent, et enterra Sara dans la caverne, vis-à-vis de Mamré ; plus tard, Isaac et Ismaël enterrèrent Abraham auprès d’elle. La caverne est située sous la grande enceinte de pierre d’Hébron connue sous le nom de tombeau des Patriarches, attribuée d’ordinaire à Hérode le Grand."
      pl: "Sara umarła w Kiriat-Arba, czyli w Hebronie, w wieku stu dwudziestu siedmiu lat. Abraham, przybysz wśród tamtejszych Chetytów, kupił od Efrona pole Makpela z jaskinią i drzewami za czterysta syklów srebra i pochował Sarę w jaskini naprzeciw Mamre; później Izaak i Izmael pochowali Abrahama obok niej. Jaskinię umieszcza się pod wielkim kamiennym ogrodzeniem w Hebronie, znanym jako Grota Patriarchów, przypisywanym zwykle Herodowi Wielkiemu."
      it: "Sara morì a Kiriat-Arba, cioè Ebron, all’età di centoventisette anni. Abramo, straniero tra gli Ittiti del luogo, comprò da Efron il campo di Macpela con la sua caverna e i suoi alberi per quattrocento sicli d’argento, e seppellì Sara nella caverna, di fronte a Mamre; più tardi Isacco e Ismaele seppellirono Abramo accanto a lei. La caverna è situata sotto il grande recinto di pietra di Ebron noto come Tomba dei Patriarchi, di solito attribuito a Erode il Grande."
      nl: "Sara stierf te Kirjat-Arba, dat is Hebron, honderdzevenentwintig jaar oud. Abraham, een vreemdeling onder de Hethieten daar, kocht van Efron het veld van Machpela met de spelonk en de bomen voor vierhonderd sikkels zilver, en begroef Sara in de spelonk, tegenover Mamre; later begroeven Isaak en Ismaël Abraham naast haar. De spelonk wordt gesitueerd onder de grote stenen ommuring in Hebron die bekendstaat als het Graf van de Aartsvaders, die gewoonlijk wordt toegeschreven aan Herodes de Grote."
      cs: "Sára zemřela v Kirjat-arbě, to je v Hebronu, ve věku sto dvaceti sedmi let. Abraham, cizinec mezi tamními Chetejci, koupil od Efróna pole Makpela s jeskyní a stromy za čtyři sta šekelů stříbra a pohřbil Sáru v jeskyni naproti Mamre; později pohřbili Izák a Jišmael Abrahama vedle ní. Jeskyně se klade pod velký kamenný ohrazený areál v Hebronu, známý jako Jeskyně patriarchů, obvykle připisovaný Herodovi Velikému."
      sv: "Sara dog i Kirjat-Arba, det är Hebron, hundra tjugosju år gammal. Abraham, en främling bland hetiterna där, köpte av Efron åkern i Makpela med dess grotta och träd för fyra hundra siklar silver och begravde Sara i grottan, gent emot Mamre; senare begravde Isak och Ismael Abraham bredvid henne. Grottan förläggs under den stora stenomfattningen i Hebron som kallas Patriarkernas grotta och som vanligen tillskrivs Herodes den store."
      nb: "Sara døde i Kirjat-Arba, det er Hebron, hundre og tjuesju år gammel. Abraham, en fremmed blant hetittene der, kjøpte av Efron Makpela-marken med hulen og trærne for fire hundre sekel sølv og gravla Sara i hulen, midt imot Mamre; senere gravla Isak og Ismael Abraham ved siden av henne. Hulen plasseres under den store steinomfriningen i Hebron som kalles Patriarkenes hule, og som vanligvis tilskrives Herodes den store."
      tl: "Namatay si Sara sa Kiriatharba, na siyang Hebron, na may isang daan at dalawampu't pitong taon. Si Abraham, na tagaibang bayan sa gitna ng mga Hetheo roon, ay bumili kay Ephron ng parang ng Macpela pati ng yungib at mga punong kahoy nito sa halagang apat na raang siklong pilak, at inilibing si Sara sa yungib, sa tapat ng Mamre; nang maglaon ay inilibing ni Isaac at ni Ismael si Abraham sa tabi niya. Inilalagay ang yungib sa ilalim ng malaking batong bakuran sa Hebron na kilala bilang Yungib ng mga Patriarka, na karaniwang iniuugnay kay Herodes na Dakila."
      da: "Sara døde i Kirjat-Arba, det er Hebron, hundrede og syvogtyve år gammel. Abraham, en fremmed blandt hittitterne dér, købte af Efron Makpelas mark med hulen og træerne for fire hundrede sekel sølv og begravede Sara i hulen over for Mamre; senere begravede Isak og Ismael Abraham ved siden af hende. Hulen placeres under den store stenindhegning i Hebron, kendt som Patriarkernes Hule, som normalt tilskrives Herodes den Store."
      sr: "Сара је умрла у Киријат-Арви, а то је Хеврон, стара сто двадесет и седам година. Аврам, дошљак међу Хетејима онде, купио је од Ефрона њиву Макпелу с пећином и дрвећем за четири стотине сикала сребра и сахранио Сару у пећини према Мамрији; касније су Исак и Исмаило сахранили Аврама поред ње. Пећина се смешта испод великог каменог ограђеног простора у Хеврону познатог као Пећина патријараха, који се обично приписује Ироду Великом."
      hu: "Sára százhuszonhét évesen meghalt Kirját-Arbában, azaz Hebronban. Ábrahám, aki jövevény volt az ottani hettiták között, megvette Efróntól a makpélai mezőt a barlanggal és a fákkal négyszáz ezüstsékelért, és eltemette Sárát a barlangba, Mamréval szemben; később Izsák és Izmael Ábrahámot is mellé temette. A barlangot a hebroni nagy kőkerítés alá helyezik, amelyet a Pátriárkák barlangjaként ismernek, és amelyet általában Nagy Heródesnek tulajdonítanak."
      fi: "Saara kuoli Kirjat-Arbassa, se on Hebronissa, sadan kahdenkymmenenseitsemän vuoden ikäisenä. Abraham, joka oli muukalainen siellä asuvien heettiläisten keskuudessa, osti Efronilta Makpelan pellon luolineen ja puineen neljälläsadalla hopeasekelillä ja hautasi Saaran luolaan vastapäätä Mamrea; myöhemmin Iisak ja Ismael hautasivat Abrahamin hänen viereensä. Luolan katsotaan olevan Hebronissa sijaitsevan suuren kivimuurin ympäröimän rakennuksen, Patriarkkojen luolan, alla; rakennus luetaan yleensä Herodes Suuren rakentamaksi."
      vi: "Sa-ra qua đời tại Ki-ri-át-A-ra-ba, tức là Hếp-rôn, hưởng thọ một trăm hai mươi bảy tuổi. Áp-ra-ham, một khách kiều ngụ giữa dân họ Hếch ở đó, mua của Ép-rôn cánh đồng Mặc-bê-la cùng hang đá và cây cối với giá bốn trăm siếc-lơ bạc, và chôn Sa-ra trong hang, đối ngang Mam-rê; về sau Y-sác và Ích-ma-ên chôn Áp-ra-ham bên cạnh bà. Hang được đặt dưới khu tường đá lớn ở Hếp-rôn gọi là Hang các Tổ phụ, thường được cho là do Hê-rốt Đại đế xây dựng."
      ro: "Sara a murit la Chiriat-Arba, adică Hebron, în vârstă de o sută douăzeci și șapte de ani. Avraam, străin printre hetiții de acolo, a cumpărat de la Efron ogorul Macpela, cu peștera și copacii lui, cu patru sute de sicli de argint și a îngropat-o pe Sara în peșteră, în fața lui Mamre; mai târziu, Isaac și Ismael l-au îngropat pe Avraam lângă ea. Peștera este așezată sub marea incintă de piatră din Hebron cunoscută ca Peștera Patriarhilor, atribuită de obicei lui Irod cel Mare."
      bg: "Сара умря в Кириат-арва, тоест Хеврон, на сто двадесет и седем години. Авраам, пришълец сред хетейците там, купи от Ефрон нивата Махпела с пещерата и дърветата ѝ за четиристотин сребърни сикли и погреба Сара в пещерата срещу Мамре; по-късно Исаак и Исмаил погребаха Авраам до нея. Пещерата се поставя под голямата каменна ограда в Хеврон, известна като Пещерата на патриарсите, която обикновено се приписва на Ирод Велики."
