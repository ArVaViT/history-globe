# From Saul the persecutor to the church at Antioch: Acts 7-11, with Acts 22:3 for his
# birth in Tarsus and Gal 1:17 for Arabia, in the order of the story. The tour's year
# (AD 34) is a conventional point for the conversion, usually dated c. AD 33-36.
# Arabia, which Acts does not mention, is placed between the first preaching in
# Damascus and the escape from it.
id: saul
title:
  en: "The conversion of Saul"
  ru: "Обращение Савла"
  uk: "Навернення Савла"
  es: "La conversión de Saúl"
  pt: "A conversão de Saulo"
  de: "Die Bekehrung des Saulus"
  fr: "La conversion de Saül"
  pl: "Nawrócenie Saula"
  it: "La conversione di Saulo"
  nl: "De bekering van Saulus"
  cs: "Obrácení Saulovo"
  sv: "Sauls omvändelse"
  nb: "Sauls omvendelse"
  tl: "Ang pagbabagong-loob ni Saul"
  da: "Sauls omvendelse"
year: "AD 34"
people: ["Paul@Act.7.58-2Pe"]
approximate: true
stops:
  - place: a666ea0 # Tarsus
    ref: Acts.22.3
    note:
      en: "Saul is born in Tarsus of Cilicia and brought up in Jerusalem at the feet of Gamaliel."
      ru: "Савл, уроженец Тарса Киликийского, воспитывается в Иерусалиме при ногах Гамалиила."
      uk: "Савл народжується в Тарсі Кілікійському й виховується в Єрусалимі при ногах Гамаліїла."
      es: "Saúl nace en Tarso de Cilicia y se cría en Jerusalén a los pies de Gamaliel."
      pt: "Saulo nasce em Tarso, na Cilícia, e é criado em Jerusalém aos pés de Gamaliel."
      de: "Saulus wird in Tarsus in Kilikien geboren und in Jerusalem zu den Füßen Gamaliëls erzogen."
      fr: "Saül naît à Tarse en Cilicie et est élevé à Jérusalem aux pieds de Gamaliel."
      pl: "Saul rodzi się w Tarsie w Cylicji i wychowuje się w Jerozolimie u stóp Gamaliela."
      it: "Saulo nasce a Tarso di Cilicia ed è educato a Gerusalemme ai piedi di Gamaliele."
      nl: "Saulus wordt geboren in Tarsus in Cilicië en in Jeruzalem opgevoed aan de voeten van Gamaliël."
      cs: "Saul se rodí v Tarsu v Kilikii a je vychován v Jeruzalémě u nohou Gamalielových."
      sv: "Saul föds i Tarsos i Kilikien och fostras i Jerusalem vid Gamaliels fötter."
      nb: "Saul blir født i Tarsos i Kilikia og vokser opp i Jerusalem ved Gamaliels føtter."
      tl: "Si Saul ay ipinanganak sa Tarso ng Cilicia at pinalaki sa Jerusalem sa paanan ni Gamaliel."
      da: "Saul fødes i Tarsus i Kilikien og opdrages i Jerusalem ved Gamaliels fødder."
  - place: a15257a # Jerusalem
    ref: Acts.7.58-Acts.8.3
    note:
      en: "The witnesses who stone Stephen lay their clothes at Saul's feet; he approves, and persecutes the church."
      ru: "Свидетели, побивающие Стефана, кладут одежды у ног Савла; он одобряет убиение и гонит церковь."
      uk: "Свідки, що кидають каміння в Стефана, кладуть свою одежу до ніг Савла; він схвалює це й переслідує церкву."
      es: "Los testigos que apedrean a Esteban dejan sus ropas a los pies de Saúl; él consiente y persigue a la iglesia."
      pt: "As testemunhas que apedrejam Estêvão depõem as suas vestes aos pés de Saulo; ele aprova e persegue a igreja."
      de: "Die Zeugen, die Stephanus steinigen, legen ihre Kleider zu den Füßen des Saulus nieder; er billigt es und verfolgt die Gemeinde."
      fr: "Les témoins qui lapident Étienne déposent leurs vêtements aux pieds de Saül ; il approuve et persécute l’Église."
      pl: "Świadkowie kamienujący Szczepana składają swe szaty u stóp Saula; on przyzwala na to i prześladuje Kościół."
      it: "I testimoni che lapidano Stefano depongono le loro vesti ai piedi di Saulo; egli approva e perseguita la chiesa."
      nl: "De getuigen die Stefanus stenigen, leggen hun kleren neer aan de voeten van Saulus; hij keurt het goed en vervolgt de gemeente."
      cs: "Svědkové, kteří kamenují Štěpána, kladou svá roucha k nohám Saulovým; on s tím souhlasí a pronásleduje církev."
      sv: "Vittnena som stenar Stefanos lägger sina kläder vid Sauls fötter; han ger sitt bifall och förföljer församlingen."
      nb: "Vitnene som steiner Stefanus, legger sine klær ved Sauls føtter; han samtykker og forfølger menigheten."
      tl: "Inilapag ng mga saksing bumato kay Esteban ang kanilang mga damit sa paanan ni Saul; sang-ayon siya, at inusig ang iglesya."
      da: "Vidnerne, som stener Stefanus, lægger deres klæder for Sauls fødder; han billiger det og forfølger menigheden."
  - place: a69c1d4 # Damascus
    ref: Acts.9.1-Acts.9.20
    note:
      en: "Near Damascus a light from heaven; in the street called Straight, Ananias lays hands on him, and he is baptised."
      ru: "У Дамаска его осиявает свет с неба; на улице, называемой Прямой, Анания возлагает на него руки, и он крестится."
      uk: "Біля Дамаска світло з неба; на вулиці, що зветься Пряма, Ананія покладає на нього руки, і він приймає хрещення."
      es: "Cerca de Damasco, una luz del cielo; en la calle llamada Derecha, Ananías le impone las manos, y es bautizado."
      pt: "Perto de Damasco, uma luz do céu; na rua chamada Direita, Ananias impõe as mãos sobre ele, e ele é batizado."
      de: "Bei Damaskus ein Licht vom Himmel; in der Straße, die „die Gerade“ heißt, legt Hananias ihm die Hände auf, und er wird getauft."
      fr: "Près de Damas, une lumière du ciel ; dans la rue appelée la rue Droite, Ananias lui impose les mains, et il est baptisé."
      pl: "Pod Damaszkiem światłość z nieba; na ulicy zwanej Prostą Ananiasz wkłada na niego ręce i Saul zostaje ochrzczony."
      it: "Presso Damasco una luce dal cielo; nella via detta Diritta Anania gli impone le mani, ed egli è battezzato."
      nl: "Bij Damascus een licht uit de hemel; in de straat die de Rechte heet, legt Ananias hem de handen op, en hij wordt gedoopt."
      cs: "U Damašku světlo z nebe; v ulici zvané Přímá vkládá na něho Ananiáš ruce a on je pokřtěn."
      sv: "Nära Damaskus ett ljus från himmelen; i gatan som kallas Raka gatan lägger Ananias händerna på honom, och han döps."
      nb: "Nær Damaskus kommer et lys fra himmelen; i gaten som kalles Den rette, legger Ananias hendene på ham, og han blir døpt."
      tl: "Malapit sa Damasco, isang liwanag mula sa langit; sa lansangang tinatawag na Tuwid, ipinatong ni Ananias ang kaniyang mga kamay sa kaniya, at siya'y binautismuhan."
      da: "Nær Damaskus et lys fra himlen; i gaden, der kaldes Den Lige, lægger Ananias hænderne på ham, og han bliver døbt."
  - place: a0f4ea8 # Arabia
    ref: Gal.1.17
    note:
      en: "He goes away into Arabia, and then returns to Damascus."
      ru: "Он уходит в Аравию и затем возвращается в Дамаск."
      uk: "Він іде в Аравію, а потім повертається до Дамаска."
      es: "Se va a Arabia y luego vuelve a Damasco."
      pt: "Parte para a Arábia e depois volta a Damasco."
      de: "Er zieht fort nach Arabien und kehrt dann nach Damaskus zurück."
      fr: "Il s’en va en Arabie, puis retourne à Damas."
      pl: "Odchodzi do Arabii, a potem wraca do Damaszku."
      it: "Se ne va in Arabia, poi torna a Damasco."
      nl: "Hij gaat weg naar Arabië en keert dan terug naar Damascus."
      cs: "Odchází do Arábie a potom se vrací do Damašku."
      sv: "Han drar bort till Arabien och återvänder sedan till Damaskus."
      nb: "Han drar bort til Arabia og vender så tilbake til Damaskus."
      tl: "Pumunta siya sa Arabia, at pagkatapos ay bumalik sa Damasco."
      da: "Han drager bort til Arabien og vender derefter tilbage til Damaskus."
  - place: a69c1d4 # Damascus
    ref: Acts.9.22-Acts.9.25
    note:
      en: "When the Jews plot to kill him, the disciples let him down over the wall in a basket."
      ru: "Когда иудеи сговариваются убить его, ученики спускают его по стене в корзине."
      uk: "Коли юдеї замишляють убити його, учні спускають його через мур у кошику."
      es: "Cuando los judíos traman matarlo, los discípulos lo descuelgan por el muro en una canasta."
      pt: "Quando os judeus conspiram para matá-lo, os discípulos o descem pelo muro num cesto."
      de: "Als die Juden einen Anschlag auf sein Leben planen, lassen die Jünger ihn in einem Korb über die Mauer hinab."
      fr: "Quand les Juifs complotent de le tuer, les disciples le descendent par la muraille dans une corbeille."
      pl: "Gdy Żydzi spiskują, by go zabić, uczniowie spuszczają go po murze w koszu."
      it: "Quando i Giudei tramano di ucciderlo, i discepoli lo calano giù dalle mura in una cesta."
      nl: "Als de Joden samenspannen om hem te doden, laten de discipelen hem in een mand over de muur neer."
      cs: "Když Židé kují úklady, aby ho zabili, spouštějí ho učedníci v koši přes hradbu."
      sv: "När judarna sammansvär sig för att döda honom firar lärjungarna ner honom över muren i en korg."
      nb: "Da jødene legger planer om å drepe ham, firer disiplene ham ned over muren i en kurv."
      tl: "Nang magsabwatan ang mga Judio upang patayin siya, ibinaba siya ng mga alagad sa ibabaw ng pader sa isang bakol."
      da: "Da jøderne lægger planer om at dræbe ham, lader disciplene ham ned over muren i en kurv."
  - place: a15257a # Jerusalem
    ref: Acts.9.26-Acts.9.29
    note:
      en: "In Jerusalem the disciples fear him until Barnabas brings him to the apostles."
      ru: "В Иерусалиме ученики боятся его, пока Варнава не приводит его к Апостолам."
      uk: "В Єрусалимі учні бояться його, поки Варнава не приводить його до апостолів."
      es: "En Jerusalén los discípulos le temen hasta que Bernabé lo lleva a los apóstoles."
      pt: "Em Jerusalém os discípulos o temem, até que Barnabé o leva aos apóstolos."
      de: "In Jerusalem fürchten ihn die Jünger, bis Barnabas ihn zu den Aposteln bringt."
      fr: "À Jérusalem, les disciples le craignent jusqu’à ce que Barnabas l’amène aux apôtres."
      pl: "W Jerozolimie uczniowie boją się go, aż Barnaba przyprowadza go do apostołów."
      it: "A Gerusalemme i discepoli hanno paura di lui, finché Barnaba lo conduce dagli apostoli."
      nl: "In Jeruzalem zijn de discipelen bang voor hem tot Barnabas hem bij de apostelen brengt."
      cs: "V Jeruzalémě se ho učedníci bojí, dokud ho Barnabáš nepřivede k apoštolům."
      sv: "I Jerusalem är lärjungarna rädda för honom tills Barnabas för honom till apostlarna."
      nb: "I Jerusalem er disiplene redde for ham, til Barnabas fører ham til apostlene."
      tl: "Sa Jerusalem, natakot sa kaniya ang mga alagad hanggang dalhin siya ni Bernabe sa mga apostol."
      da: "I Jerusalem frygter disciplene ham, indtil Barnabas fører ham til apostlene."
  - place: a58735e # Caesarea
    ref: Acts.9.30
    note:
      en: "The brothers bring him down to Caesarea and send him off to Tarsus."
      ru: "Братья отводят его в Кесарию и отправляют в Тарс."
      uk: "Брати відводять його до Кесарії й відсилають до Тарса."
      es: "Los hermanos lo bajan a Cesarea y lo envían a Tarso."
      pt: "Os irmãos o levam até Cesareia e o enviam a Tarso."
      de: "Die Brüder geleiten ihn hinab nach Caesarea und schicken ihn nach Tarsus."
      fr: "Les frères le conduisent à Césarée et le font partir pour Tarse."
      pl: "Bracia sprowadzają go do Cezarei i odsyłają do Tarsu."
      it: "I fratelli lo accompagnano a Cesarea e lo mandano a Tarso."
      nl: "De broeders brengen hem af naar Caesarea en sturen hem weg naar Tarsus."
      cs: "Bratří ho vedou dolů do Cesareje a posílají ho do Tarsu."
      sv: "Bröderna för honom ner till Caesarea och skickar iväg honom till Tarsos."
      nb: "Brødrene fører ham ned til Cæsarea og sender ham av sted til Tarsos."
      tl: "Dinala siya ng mga kapatid sa Cesarea at pinalakad patungong Tarso."
      da: "Brødrene fører ham ned til Cæsarea og sender ham af sted til Tarsus."
  - place: a666ea0 # Tarsus
    ref: Acts.11.25
    note:
      en: "Years later Barnabas goes to Tarsus to look for Saul."
      ru: "Спустя годы Варнава идёт в Тарс искать Савла."
      uk: "Роками пізніше Варнава йде до Тарса шукати Савла."
      es: "Años después Bernabé va a Tarso a buscar a Saúl."
      pt: "Anos depois, Barnabé vai a Tarso procurar Saulo."
      de: "Jahre später geht Barnabas nach Tarsus, um Saulus zu suchen."
      fr: "Des années plus tard, Barnabas va à Tarse chercher Saül."
      pl: "Lata później Barnaba udaje się do Tarsu, aby szukać Saula."
      it: "Anni dopo Barnaba va a Tarso a cercare Saulo."
      nl: "Jaren later gaat Barnabas naar Tarsus om Saulus te zoeken."
      cs: "O léta později jde Barnabáš do Tarsu hledat Saula."
      sv: "År senare reser Barnabas till Tarsos för att söka upp Saul."
      nb: "År senere drar Barnabas til Tarsos for å lete etter Saul."
      tl: "Pagkaraan ng maraming taon, pumunta si Bernabe sa Tarso upang hanapin si Saul."
      da: "År senere drager Barnabas til Tarsus for at lede efter Saul."
  - place: ae41ab4 # Antioch
    ref: Acts.11.26
    note:
      en: "A whole year they teach in Antioch, where the disciples are first called Christians."
      ru: "Целый год они учат в Антиохии, где учеников впервые начинают называть христианами."
      uk: "Цілий рік вони навчають в Антіохії, де учнів уперше названо християнами."
      es: "Todo un año enseñan en Antioquía, donde los discípulos son llamados cristianos por primera vez."
      pt: "Durante um ano inteiro ensinam em Antioquia, onde os discípulos são chamados cristãos pela primeira vez."
      de: "Ein ganzes Jahr lehren sie in Antiochia, wo die Jünger zuerst Christen genannt werden."
      fr: "Toute une année, ils enseignent à Antioche, où les disciples sont appelés chrétiens pour la première fois."
      pl: "Przez cały rok nauczają w Antiochii, gdzie uczniowie po raz pierwszy zostali nazwani chrześcijanami."
      it: "Per un anno intero insegnano ad Antiochia, dove i discepoli sono chiamati per la prima volta Cristiani."
      nl: "Een heel jaar onderwijzen zij in Antiochië, waar de discipelen voor het eerst Christenen worden genoemd."
      cs: "Celý rok učí v Antiochii, kde jsou učedníci poprvé nazváni křesťany."
      sv: "Ett helt år undervisar de i Antiochia, där lärjungarna först kallas kristna."
      nb: "Et helt år underviser de i Antiokia, hvor disiplene først blir kalt kristne."
      tl: "Sa loob ng isang buong taon ay nagturo sila sa Antioquia, kung saan unang tinawag na mga Kristiyano ang mga alagad."
      da: "Et helt år underviser de i Antiokia, hvor disciplene først kaldes kristne."
