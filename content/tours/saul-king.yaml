# Saul, the first king, 1 Samuel 9-31, in the order of the text. The tour's year (1050 BC)
# is the conventional start of his reign (c. 1050-1010 BC), a point for the map rather than
# a date. The Samuel tour holds the assembly at Gilgal (11:14-15); the David tour holds
# the battle on Mount Gilboa (31:1-6), so this one takes up the story after it.
id: saul-king
title:
  en: "Saul, the first king"
  ru: "Саул, первый царь"
  uk: "Саул, перший цар"
  es: "Saúl, el primer rey"
  pt: "Saul, o primeiro rei"
  de: "Saul, der erste König"
  fr: "Saül, le premier roi"
  pl: "Saul, pierwszy król"
  it: "Saul, il primo re"
  nl: "Saul, de eerste koning"
  cs: "Saul, první král"
  sv: "Saul, den förste kungen"
  nb: "Saul, den første konge"
  tl: "Si Saul, ang unang hari"
  da: "Saul, den første konge"
  sr: "Саул, први цар"
  hu: "Saul, az első király"
  fi: "Saul, ensimmäinen kuningas"
  vi: "Sau-lơ, vua đầu tiên"
  ro: "Saul, primul rege"
  bg: "Саул, първият цар"
year: "1050 BC"
people: ["Saul@1Sa.9.2-Act"]
approximate: true
stops:
  - place: a4d0250 # Land of Zuph
    ref: 1Sam.9.3-1Sam.10.1
    note:
      en: "Looking for his father's lost asses, Saul comes to the land of Zuph, and there Samuel anoints him captain over the Lord's inheritance."
      ru: "Разыскивая пропавших ослиц отца, Саул приходит в землю Цуф, и там Самуил помазывает его в правителя наследия Господня."
      uk: "Шукаючи загублених ослиць свого батька, Саул приходить до землі Цуф, і там Самуїл помазує його вождем над Господнім уділом."
      es: "Buscando las asnas perdidas de su padre, Saúl llega a la tierra de Zuf, y allí Samuel lo unge caudillo sobre la heredad del Señor."
      pt: "Procurando as jumentas perdidas de seu pai, Saul chega à terra de Zufe, e ali Samuel o unge comandante sobre a herança do Senhor."
      de: "Auf der Suche nach den verlorenen Eseln seines Vaters kommt Saul in das Land Zuf, und dort salbt Samuel ihn zum Fürsten über das Erbteil des Herrn."
      fr: "À la recherche des ânesses perdues de son père, Saül arrive au pays de Tsuph, et là Samuel l’oint chef sur l’héritage de l’Éternel."
      pl: "Szukając zaginionych oślic swego ojca, Saul przychodzi do ziemi Sufu i tam Samuel namaszcza go na wodza nad dziedzictwem Pana."
      it: "Cercando le asine smarrite di suo padre, Saul giunge alla terra di Suf, e là Samuele lo unge capo sull’eredità del Signore."
      nl: "Op zoek naar de verloren ezelinnen van zijn vader komt Saul in het land Zuf, en daar zalft Samuël hem tot vorst over het erfdeel van de HEER."
      cs: "Saul hledá ztracené oslice svého otce, přichází do země Súf a tam ho Samuel pomazává za vůdce nad dědictvím Hospodinovým."
      sv: "På jakt efter sin fars bortkomna åsnor kommer Saul till Sufs land, och där smörjer Samuel honom till furste över Herrens arvedel."
      nb: "På leting etter sin fars bortkomne esler kommer Saul til Sufs land, og der salver Samuel ham til fyrste over Herrens arv."
      tl: "Habang hinahanap ang nawalang mga asno ng kaniyang ama, dumating si Saul sa lupain ng Suph, at doon pinahiran siya ni Samuel bilang pinuno sa mana ng Panginoon."
      da: "På jagt efter sin fars forsvundne æsler kommer Saul til Zufs land, og der salver Samuel ham til fyrste over Herrens arv."
      sr: "Тражећи изгубљене магарице свог оца, Саул долази у земљу Суф, и ту га Самуило помазује за вођу над наследством Господњим."
      hu: "Atyja elveszett szamarait keresve Saul Cúf földjére jut, és ott Sámuel az Úr örökségének vezérévé keni."
      fi: "Etsiessään isänsä kadonneita aasintammoja Saul tulee Sufin maahan, ja siellä Samuel voitelee hänet Herran perintöosan päämieheksi."
      vi: "Đi tìm những lừa cái bị lạc của cha mình, Sau-lơ đến đất Xu-phơ, và tại đó Sa-mu-ên xức dầu cho người làm quan cai trị cơ nghiệp của Đức Giê-hô-va."
      ro: "Căutând măgărițele pierdute ale tatălui său, Saul ajunge în ținutul Țuf, iar acolo Samuel îl unge căpetenie peste moștenirea Domnului."
      bg: "Търсейки изгубените ослици на баща си, Саул идва в земята Цуф и там Самуил го помазва за началник над Господнето наследство."
  - place: a736f6c # Mizpah
    ref: 1Sam.10.17-1Sam.10.24
    note:
      en: 'At Mizpah the lot falls on Saul, hidden among the stuff, and the people shout: "God save the king."'
      ru: "В Массифе жребий указывает на Саула, скрывшегося в обозе, и народ восклицает: «да живет царь!»"
      uk: "У Міцпі жереб падає на Саула, що сховався серед речей, і народ кричить: «Нехай жиє царь!»"
      es: "En Mizpa la suerte cae sobre Saúl, escondido entre el bagaje, y el pueblo grita: «Viva el rey»."
      pt: "Em Mispá a sorte cai sobre Saul, escondido no meio da bagagem, e o povo grita: “Viva o rei!”"
      de: "In Mizpa trifft das Los Saul, der sich beim Gerät versteckt hat, und das Volk jauchzt: „Glück zu dem König!“"
      fr: "À Mitspa, le sort tombe sur Saül, caché vers les bagages, et le peuple s’écrie : « Vive le roi ! »"
      pl: "W Mispie los pada na Saula, ukrytego między sprzętem, i lud woła: „Niech żyje król!”"
      it: "A Mizpa la sorte cade su Saul, nascosto fra i bagagli, e il popolo grida: «Viva il re!»"
      nl: "Te Mizpa valt het lot op Saul, die zich tussen het gerei heeft verborgen, en het volk juicht: “de koning leve!”"
      cs: "V Micpě padá los na Saula, skrytého mezi nádobím, a lid zvolá: „Živ buď král!“"
      sv: "I Mispa träffar lotten Saul, som gömmer sig bland trossen, och folket ropar: ”Leve konungen!”"
      nb: "I Mispa faller loddet på Saul, som har gjemt seg blant bagasjen, og folket roper: «Kongen leve!»"
      tl: "Sa Mizpa, nahulog ang palad kay Saul, na nakatago sa mga kagamitan, at sumigaw ang bayan: “Mabuhay ang hari.”"
      da: "I Mispa falder lodden på Saul, skjult blandt bagagen, og folket råber: »Kongen leve!«"
      sr: "У Масфи ждреб пада на Саула, скривеног међу пртљагом, и народ виче: „Да живи цар!“"
      hu: "Micpában a sors Saulra esik, aki a holmik között rejtőzik, és a nép így kiált: „Éljen a király!”"
      fi: "Mispassa arpa lankeaa Sauliin, joka on piiloutunut tavaroiden sekaan, ja kansa huutaa: ”Eläköön kuningas!”"
      vi: "Tại Mích-ba, thăm rơi trúng Sau-lơ đang ẩn giữa đồ đạc, và dân sự hô lên: “Nguyện vua vạn tuế!”"
      ro: "La Mițpa, sorțul cade pe Saul, ascuns printre bagaje, iar poporul strigă urarea de viață lungă pentru rege."
      bg: "В Мицпа жребият пада върху Саул, скрит между багажа, и народът извиква: „Да е жив царят!“"
  - place: af92088 # Jabesh-gilead
    ref: 1Sam.11.1-1Sam.11.11
    note:
      en: "Nahash the Ammonite besieges Jabesh-gilead; Saul gathers Israel, breaks into their camp in the morning watch and smites the Ammonites."
      ru: "Наас Аммонитянин осаждает Иавис Галаадский; Саул собирает Израиль, в утреннюю стражу врывается в их стан и поражает Аммонитян."
      uk: "Наас Аммонітянин облягає Явіс Гілеадський; Саул збирає Ізраїль, уривається в їхній табір під ранішню сторожу й розбиває аммонітян."
      es: "Nahas el amonita sitia Jabes de Galaad; Saúl reúne a Israel, irrumpe en su campamento en la vigilia de la mañana y hiere a los amonitas."
      pt: "Naás, o amonita, cerca Jabes-Gileade; Saul reúne Israel, irrompe no acampamento deles na vigília da manhã e fere os amonitas."
      de: "Nahas, der Ammoniter, belagert Jabesch in Gilead; Saul versammelt Israel, bricht in der Morgenwache in ihr Lager ein und schlägt die Ammoniter."
      fr: "Nachasch l’Ammonite assiège Jabès en Galaad ; Saül rassemble Israël, pénètre dans leur camp à la veille du matin et bat les Ammonites."
      pl: "Nachasz Ammonita oblega Jabesz-Gilead; Saul zgromadza Izraela, wdziera się do ich obozu o straży porannej i bije Ammonitów."
      it: "Naas l’Ammonita assedia Iabes di Galaad; Saul raduna Israele, irrompe nel loro accampamento alla veglia del mattino e sconfigge gli Ammoniti."
      nl: "Nachas, de Ammoniet, belegert Jabes in Gilead; Saul roept Israël bijeen, valt in de morgenwake hun kamp binnen en slaat de Ammonieten."
      cs: "Nachaš Amónský obléhá Jabeš gileadský; Saul svolává Izrael, v jitřní hlídce vniká do jejich tábora a bije Amónce."
      sv: "Ammoniten Nachash belägrar Javesh-Gilead; Saul samlar Israel, bryter in i deras läger vid morgonväkten och slår ammoniterna."
      nb: "Nahasj ammonitten kringsetter Jabesj-Gilead; Saul samler Israel, bryter inn i deres leir i morgenvakten og slår ammonittene."
      tl: "Kinubkob ni Naas na Ammonita ang Jabes-galaad; tinipon ni Saul ang Israel, sinalakay ang kanilang kampo sa pagbabantay sa umaga at pinatay ang mga Ammonita."
      da: "Nahasj ammoniteren belejrer Jabesj i Gilead; Saul samler Israel, bryder ind i deres lejr i morgenvagten og slår ammoniterne."
      sr: "Нас Амонац опседа Јавис Галадски; Саул окупља Израиља, у јутарњој стражи упада у њихов логор и туче Амонце."
      hu: "Náhás, az ammonita ostrom alá veszi Jábés-Gileádot; Saul összegyűjti Izráelt, a hajnali őrváltáskor betör a táborukba, és megveri az ammonitákat."
      fi: "Ammonilainen Nahas piirittää Jabes-Gileadia; Saul kokoaa Israelin, tunkeutuu heidän leiriinsä aamuvartiossa ja lyö ammonilaiset."
      vi: "Na-hách người Am-môn vây Gia-be Ga-la-át; Sau-lơ nhóm Y-sơ-ra-ên, xông vào trại quân chúng trong canh sáng và đánh người Am-môn."
      ro: "Nahaș amonitul asediază Iabeșul din Galaad; Saul strânge Israelul, pătrunde în tabăra lor în straja dimineții și îi bate pe amoniți."
      bg: "Амонецът Наас обсажда Явис Галаадски; Саул събира Израил, нахлува в стана им при утринната стража и поразява амонците."
  - place: ab94aea # Gilgal
    ref: 1Sam.13.8-1Sam.13.14
    note:
      en: "At Gilgal, tired of waiting seven days for Samuel, Saul offers the burnt offering himself; Samuel tells him his kingdom shall not continue."
      ru: "В Галгале, не дождавшись Самуила за семь дней, Саул сам возносит всесожжение; Самуил говорит ему: «не устоять царствованию твоему»."
      uk: "У Гілгалі, втомившись сім днів чекати Самуїла, Саул сам приносить цілопалення; Самуїл каже йому, що його царство не втримається."
      es: "En Gilgal, cansado de esperar siete días a Samuel, Saúl mismo ofrece el holocausto; Samuel le dice que su reino no será duradero."
      pt: "Em Gilgal, cansado de esperar sete dias por Samuel, Saul oferece ele mesmo o holocausto; Samuel lhe diz que o seu reino não continuará."
      de: "In Gilgal, des siebentägigen Wartens auf Samuel müde, bringt Saul das Brandopfer selbst dar; Samuel sagt ihm, sein Königtum werde keinen Bestand haben."
      fr: "À Guilgal, las d’attendre Samuel pendant sept jours, Saül offre lui-même l’holocauste ; Samuel lui dit que son royaume ne durera pas."
      pl: "W Gilgal, zmęczony siedmiodniowym oczekiwaniem na Samuela, Saul sam składa całopalenie; Samuel oznajmia mu, że jego królestwo się nie utrzyma."
      it: "A Gàlgala, stanco di aspettare Samuele per sette giorni, Saul offre egli stesso l’olocausto; Samuele gli dice che il suo regno non durerà."
      nl: "Te Gilgal, moe van het zeven dagen wachten op Samuël, brengt Saul zelf het brandoffer; Samuël zegt hem dat zijn koninkrijk niet zal standhouden."
      cs: "V Gilgalu, unaven sedmidenním čekáním na Samuele, přináší Saul zápalnou oběť sám; Samuel mu říká, že jeho království nezůstane."
      sv: "I Gilgal, trött på att vänta sju dagar på Samuel, offrar Saul brännoffret själv; Samuel säger honom att hans kungadöme inte ska bestå."
      nb: "I Gilgal, lei av å vente sju dager på Samuel, ofrer Saul brennofferet selv; Samuel sier ham at hans kongedømme ikke skal bestå."
      tl: "Sa Gilgal, na pagod sa paghihintay ng pitong araw kay Samuel, inihandog mismo ni Saul ang handog na susunugin; sinabi sa kaniya ni Samuel na hindi magpapatuloy ang kaniyang kaharian."
      da: "I Gilgal, træt af at vente syv dage på Samuel, ofrer Saul selv brændofferet; Samuel siger til ham, at hans kongedømme ikke skal bestå."
      sr: "У Галгалу, уморан од чекања Самуила седам дана, Саул сам приноси жртву паљеницу; Самуило му каже да његово царство неће остати."
      hu: "Gilgálban, belefáradva abba, hogy hét napig várjon Sámuelre, Saul maga mutatja be az égőáldozatot; Sámuel megmondja neki, hogy országa nem marad meg."
      fi: "Gilgalissa Saul kyllästyy odottamaan Samuelia seitsemän päivää ja uhraa polttouhrin itse; Samuel sanoo hänelle, ettei hänen kuninkuutensa pysy."
      vi: "Tại Ghinh-ganh, mệt vì đợi Sa-mu-ên bảy ngày, Sau-lơ tự mình dâng của lễ thiêu; Sa-mu-ên nói với người rằng nước người sẽ chẳng còn bền."
      ro: "La Ghilgal, obosit să-l mai aștepte șapte zile pe Samuel, Saul aduce el însuși arderea de tot; Samuel îi spune că domnia lui nu va dăinui."
      bg: "В Галгал, уморен да чака Самуил седем дни, Саул сам принася всеизгарянето; Самуил му казва, че царството му няма да устои."
  - place: adea06c # Michmash
    ref: 1Sam.13.23-1Sam.14.15
    note:
      en: "At the passage of Michmash Jonathan and his armourbearer climb up to the Philistine garrison, and there is a very great trembling in their camp."
      ru: "У переправы Михмасской Ионафан с оруженосцем взбирается к отряду Филистимлян, и в их стане поднимается ужас великий от Господа."
      uk: "На переході Міхмас Йонатан і його зброєносець видираються до філістимського гарнізону, і в їхньому таборі здіймається дуже великий трепет."
      es: "En el paso de Micmas Jonatán y su escudero suben hasta la guarnición filistea, y hay un gran temblor en su campamento."
      pt: "Na passagem de Micmás, Jônatas e o seu escudeiro sobem até o destacamento filisteu, e há um tremor muito grande no acampamento deles."
      de: "Am Pass von Michmas klettern Jonatan und sein Waffenträger zur Besatzung der Philister hinauf, und ein sehr großes Zittern ergreift deren Lager."
      fr: "Au défilé de Micmasch, Jonathan et son écuyer grimpent jusqu’au poste des Philistins, et une très grande terreur saisit leur camp."
      pl: "Na przesmyku Mikmas Jonatan i jego giermek wspinają się do filistyńskiej załogi i w ich obozie powstaje bardzo wielkie drżenie."
      it: "Al passo di Micmas Gionata e il suo scudiero salgono verso il presidio filisteo, e nel loro campo c’è un tremito grandissimo."
      nl: "Bij de pas van Michmas klimmen Jonatan en zijn wapendrager omhoog naar de Filistijnse wachtpost, en er ontstaat een zeer grote beving in hun kamp."
      cs: "U michmaského průsmyku vystupují Jonatan a jeho zbrojnoš k pelištejské posádce a v jejich táboře nastává velmi veliký třas."
      sv: "Vid passet i Mikmas klättrar Jonatan och hans vapendragare upp till filistéernas postering, och en mycket stor skräck griper deras läger."
      nb: "Ved skaret ved Mikmas klatrer Jonatan og hans våpenbærer opp til filisternes vaktpost, og det blir en meget stor skjelving i deres leir."
      tl: "Sa daanan ng Michmas, umakyat sina Jonathan at ang kaniyang tagapagdala ng sandata sa pulutong ng mga Filisteo, at nagkaroon ng napakalaking panginginig sa kanilang kampo."
      da: "Ved passet ved Mikmas klatrer Jonatan og hans våbendrager op til filistrenes forpost, og der kommer en meget stor skælven i deres lejr."
      sr: "На кланцу михмаском Јонатан и његов штитоноша пењу се до филистејске страже, и у њиховом логору настаје врло велики страх."
      hu: "A mikmási átjárónál Jonatán és fegyverhordozója felmásznak a filiszteusok őrségéhez, és igen nagy rettegés támad a táborukban."
      fi: "Mikmaksen solassa Jonatan ja hänen aseenkantajansa kiipeävät filistealaisten vartioasemalle, ja heidän leirissään syntyy hyvin suuri vavistus."
      vi: "Tại ải Mích-ma, Giô-na-than cùng người vác binh khí leo lên đồn quân Phi-li-tin, và có một sự run rẩy rất lớn trong trại quân chúng."
      ro: "La trecătoarea Micmaș, Ionatan și purtătorul lui de arme urcă până la straja filistenilor, iar în tabăra lor se face o mare spaimă."
      bg: "При прохода на Михмас Йонатан и оръженосецът му се изкачват до филистимската стража и в стана им настава много голям ужас."
  - place: ab94aea # Gilgal
    ref: 1Sam.15.12-1Sam.15.33
    note:
      en: 'Back in Gilgal from the war with Amalek, Saul has spared what he was told to destroy: "to obey is better than sacrifice," and the kingdom is torn from him.'
      ru: "Вернувшись в Галгал с войны с Амаликом, Саул пощадил то, что велено было истребить: «послушание лучше жертвы», и царство отторгнуто от него."
      uk: "Знову в Гілгалі після війни з Амалеком Саул пощадив те, що було велено знищити: «покора лучша за жертви», і царство відібрано від нього."
      es: "De vuelta en Gilgal de la guerra contra Amalec, Saúl ha perdonado lo que se le mandó destruir: «el obedecer es mejor que los sacrificios», y el reino le es arrebatado."
      pt: "De volta a Gilgal, da guerra contra Amaleque, Saul poupou o que lhe fora mandado destruir: “a obediência é melhor do que o sacrifício”, e o reino lhe é arrancado."
      de: "Zurück in Gilgal vom Krieg gegen Amalek, hat Saul verschont, was er vernichten sollte: „Gehorsam ist besser denn Opfer“, und das Königtum wird ihm entrissen."
      fr: "De retour à Guilgal après la guerre contre Amalek, Saül a épargné ce qu’il avait reçu l’ordre de détruire : « l’obéissance vaut mieux que les sacrifices », et le royaume lui est arraché."
      pl: "Z powrotem w Gilgal po wojnie z Amalekiem Saul oszczędził to, co miał zniszczyć: „posłuszeństwo lepsze jest niżeli ofiara”, i królestwo zostaje mu wydarte."
      it: "Tornato a Gàlgala dalla guerra contro Amalek, Saul ha risparmiato ciò che gli era stato ordinato di distruggere: «l’ubbidienza val meglio che il sacrifizio», e il regno gli viene strappato."
      nl: "Terug te Gilgal van de oorlog tegen Amalek heeft Saul gespaard wat hij moest verdelgen: “gehoorzamen is beter dan slachtoffer”, en het koninkrijk wordt van hem weggescheurd."
      cs: "Zpět v Gilgalu z války s Amalekem; Saul ušetřil, co mu bylo přikázáno zničit: „poslouchati lépe jest, nežli obětovati“, a království je od něho odtrženo."
      sv: "Åter i Gilgal från kriget mot Amalek har Saul skonat det han blivit befalld att förgöra: ”lydnad är bättre än offer”, och kungadömet rivs ifrån honom."
      nb: "Tilbake i Gilgal fra krigen mot Amalek har Saul spart det han var blitt befalt å ødelegge: «lydighet er bedre enn slaktoffer», og kongedømmet blir revet fra ham."
      tl: "Pagbalik sa Gilgal mula sa digmaan sa Amalec, iniligtas ni Saul ang iniutos na wasakin: “ang pagsunod ay maigi kay sa hain,” at inagaw sa kaniya ang kaharian."
      da: "Tilbage i Gilgal fra krigen mod Amalek har Saul skånet det, han var blevet pålagt at udrydde: »at adlyde er bedre end Offer«, og kongedømmet rives fra ham."
      sr: "Опет у Галгалу, из рата с Амаликом, Саул је поштедео оно што му је било речено да уништи: „послушност је боља од жртве“, и царство му се отима."
      hu: "Az Amálek elleni háborúból visszatérve Gilgálban kiderül, hogy Saul megkímélte azt, amit el kellett volna pusztítania: „jobb az engedelmesség a véres áldozatnál”, és az országot elszakítják tőle."
      fi: "Takaisin Gilgalissa sodasta Amalekia vastaan Saul on säästänyt sen, mikä hänen piti hävittää: ”kuuliaisuus on parempi kuin uhri”, ja kuninkuus revitään häneltä."
      vi: "Trở về Ghinh-ganh sau cuộc chiến với A-ma-léc, Sau-lơ đã tha những gì mình được truyền phải hủy diệt: “sự vâng lời tốt hơn của tế lễ”, và nước bị xé khỏi người."
      ro: "Întors la Ghilgal din războiul cu Amalec, Saul a cruțat ceea ce i se poruncise să nimicească: „ascultarea, mai bună este decât jertfa bună”, iar domnia îi este smulsă."
      bg: "Върнал се в Галгал от войната с Амалик, Саул е пощадил онова, което му е било заповядано да изтреби: „послушването е по-добро от жъртвата“, и царството му е отнето."
  - place: aca444b # En-dor
    ref: 1Sam.28.7-1Sam.28.25
    note:
      en: "Before the last battle, disguised, he goes by night to a woman with a familiar spirit at En-dor and hears that tomorrow he and his sons will be with Samuel."
      ru: "Перед последней битвой он, переодевшись, идёт ночью к волшебнице в Аэндор и слышит, что завтра он и сыновья его будут с Самуилом."
      uk: "Перед останнім боєм, переодягнений, він іде вночі до жінки, що має дух ворожбитський, в Ен-Дорі й чує, що завтра він і його сини будуть із Самуїлом."
      es: "Antes de la última batalla, disfrazado, va de noche a una mujer que tiene espíritu de adivinación en Endor y oye que mañana él y sus hijos estarán con Samuel."
      pt: "Antes da última batalha, disfarçado, vai de noite a uma mulher com espírito familiar em En-Dor e ouve que, no dia seguinte, ele e os filhos estarão com Samuel."
      de: "Vor der letzten Schlacht geht er verkleidet bei Nacht in En-Dor zu einer Frau, die einen Wahrsagegeist hat, und hört, dass er und seine Söhne morgen bei Samuel sein werden."
      fr: "Avant la dernière bataille, déguisé, il va de nuit chez une femme qui évoque les esprits à En-Dor et apprend que le lendemain lui et ses fils seront avec Samuel."
      pl: "Przed ostatnią bitwą, przebrany, idzie nocą do kobiety wywołującej duchy w En-Dor i słyszy, że jutro on i jego synowie będą z Samuelem."
      it: "Prima dell’ultima battaglia, travestito, va di notte da una donna evocatrice di spiriti a Endor e sente che l’indomani lui e i suoi figli saranno con Samuele."
      nl: "Vóór de laatste slag gaat hij vermomd 's nachts naar een vrouw met een waarzeggende geest te En-Dor en hoort dat hij en zijn zonen morgen bij Samuël zullen zijn."
      cs: "Před poslední bitvou jde přestrojen v noci k ženě s duchem věštícím v Én-dóru a slyší, že zítra bude on i jeho synové se Samuelem."
      sv: "Före den sista striden går han förklädd om natten till en kvinna med spådomsande i En-Dor och får höra att han och hans söner i morgon ska vara hos Samuel."
      nb: "Før det siste slaget går han forkledd om natten til en kvinne som manet frem ånder, i En-Dor, og hører at i morgen skal han og hans sønner være hos Samuel."
      tl: "Bago ang huling labanan, nagbalatkayo siya at pumunta nang gabi sa isang babaing may espiritu ng pagsanib sa En-dor, at narinig na bukas ay masasama siya at ang kaniyang mga anak kay Samuel."
      da: "Før den sidste kamp går han forklædt om natten til en kvinde med en dødningeånd i En-Dor og hører, at han og hans sønner i morgen skal være hos Samuel."
      sr: "Пред последњу битку, прерушен, иде ноћу к жени с духом врачарским у Ендор и чује да ће сутра он и синови његови бити са Самуилом."
      hu: "Az utolsó csata előtt álruhában éjjel elmegy Én-Dórba egy halottidézéssel foglalkozó asszonyhoz, és meghallja, hogy másnap ő és fiai Sámuellel lesznek."
      fi: "Ennen viimeistä taistelua hän menee valepuvussa yöllä En-Dorin vainajia manaavan naisen luo ja kuulee, että huomenna hän ja hänen poikansa ovat Samuelin kanssa."
      vi: "Trước trận chiến cuối cùng, cải trang, người ban đêm đến một người đàn bà đồng bóng ở Ên-Đô-rơ và nghe rằng ngày mai người cùng các con trai sẽ ở với Sa-mu-ên."
      ro: "Înaintea ultimei bătălii, deghizat, merge noaptea la o femeie care cheamă morții, la En-Dor, și află că a doua zi el și fiii lui vor fi cu Samuel."
      bg: "Преди последната битка той отива преоблечен нощем при една жена, която гадае чрез дух, в Ен-Дор и чува, че утре той и синовете му ще бъдат при Самуил."
  - place: a2a8df0 # Beth-shan
    ref: 1Sam.31.8-1Sam.31.10
    note:
      en: "The day after the battle the Philistines find Saul and his three sons fallen on Mount Gilboa and fasten his body to the wall of Beth-shan."
      ru: "На другой день после битвы Филистимляне находят Саула и трёх его сыновей, павших на горе Гелвуе, и вешают его тело на стене Беф-Сана."
      uk: "Наступного дня після бою філістимляни знаходять Саула та трьох його синів полеглими на горі Гільбоа й прибивають його тіло до муру Бет-Шеана."
      es: "Al día siguiente de la batalla los filisteos encuentran a Saúl y a sus tres hijos caídos en el Monte Gilboa y clavan su cuerpo en el muro de Bet-seán."
      pt: "No dia seguinte à batalha, os filisteus encontram Saul e seus três filhos caídos no Monte Gilboa e prendem o seu corpo ao muro de Bete-Seã."
      de: "Am Tag nach der Schlacht finden die Philister Saul und seine drei Söhne gefallen auf dem Gebirge Gilboa und heften seinen Leichnam an die Mauer von Bet-Schean."
      fr: "Le lendemain de la bataille, les Philistins trouvent Saül et ses trois fils tombés sur le Mont Guilboa et attachent son corps au mur de Beth-Schean."
      pl: "Dzień po bitwie Filistyni znajdują Saula i jego trzech synów poległych na górze Gilboa i przybijają jego ciało do muru Bet-Szean."
      it: "Il giorno dopo la battaglia i Filistei trovano Saul e i suoi tre figli caduti sul Monte Gelboe e fissano il suo corpo al muro di Beth-Shean."
      nl: "De dag na de slag vinden de Filistijnen Saul en zijn drie zonen gevallen op de berg Gilboa en bevestigen zijn lichaam aan de muur van Beth-Sean."
      cs: "Den po bitvě nalézají Pelištejci Saula a jeho tři syny padlé na hoře Gilboa a přibíjejí jeho tělo ke zdi Bét-šanu."
      sv: "Dagen efter striden finner filistéerna Saul och hans tre söner stupade på berget Gilboa och fäster hans kropp vid muren i Bet-Shean."
      nb: "Dagen etter slaget finner filisterne Saul og hans tre sønner falt på Gilboa og fester hans lik til muren i Bet-Sjean."
      tl: "Kinabukasan ng labanan, natagpuan ng mga Filisteo si Saul at ang kaniyang tatlong anak na nabuwal sa Bundok Gilboa at ipinako ang kaniyang bangkay sa pader ng Beth-san."
      da: "Dagen efter slaget finder filistrene Saul og hans tre sønner faldet på Gilboa-bjerget og fæstner hans lig til muren i Bet-Sjan."
      sr: "Дан после битке Филистеји налазе Саула и његова три сина где су пали на гори Гелвуји и приковавају његово тело на зид Вет-Сана."
      hu: "A csata másnapján a filiszteusok megtalálják Sault és három fiát elesve a Gilbóa-hegyen, és holttestét Bét-Seán falára erősítik."
      fi: "Taistelua seuraavana päivänä filistealaiset löytävät Saulin ja hänen kolme poikaansa kaatuneina Gilboavuorelta ja kiinnittävät hänen ruumiinsa Bet-Seanin muuriin."
      vi: "Ngày sau trận đánh, người Phi-li-tin thấy Sau-lơ và ba con trai người nằm sải trên Núi Ghinh-bô-a, và đóng thây người vào tường thành Bết-San."
      ro: "A doua zi după bătălie, filistenii îi găsesc pe Saul și pe cei trei fii ai lui căzuți pe Muntele Ghilboa și îi atârnă trupul pe zidul Bet-Șanului."
      bg: "На другия ден след битката филистимците намират Саул и тримата му синове паднали на планината Гелвуя и приковават тялото му на стената на Бет-Сан."
  - place: af92088 # Jabesh-gilead
    ref: 1Sam.31.11-1Sam.31.13
    note:
      en: "The valiant men of Jabesh-gilead, whom he once saved, go all night, take the bodies from the wall, and bury their bones under a tree at Jabesh."
      ru: "Сильные люди из Иависа Галаадского, которых он некогда спас, идут всю ночь, снимают тела со стены и погребают кости под дубом в Иависе."
      uk: "Хоробрі мужі Явіс Гілеадського, яких він колись урятував, ідуть цілу ніч, знімають тіла з муру й ховають їхні кістки під деревом у Явісі."
      es: "Los valientes de Jabes de Galaad, a quienes él salvó una vez, caminan toda la noche, bajan los cuerpos del muro y sepultan sus huesos bajo un árbol en Jabes."
      pt: "Os homens valentes de Jabes-Gileade, a quem ele outrora salvou, caminham a noite toda, tiram os corpos do muro e sepultam os seus ossos debaixo de uma árvore em Jabes."
      de: "Die tapferen Männer von Jabesch in Gilead, die er einst gerettet hatte, gehen die ganze Nacht, nehmen die Leichname von der Mauer und begraben ihre Gebeine unter einem Baum bei Jabesch."
      fr: "Les vaillants hommes de Jabès en Galaad, qu’il avait jadis sauvés, marchent toute la nuit, enlèvent les corps du mur et enterrent leurs os sous un arbre à Jabès."
      pl: "Dzielni mężowie z Jabesz-Gilead, których niegdyś uratował, idą całą noc, zdejmują ciała z muru i chowają ich kości pod drzewem w Jabesz."
      it: "I valorosi di Iabes di Galaad, che egli aveva un tempo salvato, camminano tutta la notte, tolgono i corpi dal muro e ne seppelliscono le ossa sotto un albero a Iabes."
      nl: "De dappere mannen van Jabes in Gilead, die hij eens had gered, trekken de hele nacht, nemen de lichamen van de muur en begraven hun beenderen onder een boom te Jabes."
      cs: "Stateční muži z Jabeše gileadského, které kdysi zachránil, jdou celou noc, snímají těla ze zdi a pochovávají jejich kosti pod stromem v Jábeši."
      sv: "De tappra männen i Javesh-Gilead, som han en gång räddade, går hela natten, tar ner kropparna från muren och begraver deras ben under ett träd i Javesh."
      nb: "De djerve mennene fra Jabesj-Gilead, som han en gang reddet, drar gjennom hele natten, tar likene ned fra muren og begraver deres ben under et tre i Jabesj."
      tl: "Ang mga matapang na lalaki ng Jabes-galaad, na minsan ay iniligtas niya, ay naglakbay buong gabi, kinuha ang mga bangkay sa pader, at inilibing ang kanilang mga buto sa ilalim ng isang punungkahoy sa Jabes."
      da: "De tapre mænd fra Jabesj i Gilead, som han engang reddede, drager hele natten, tager ligene ned fra muren og begraver deres ben under et træ i Jabesj."
      sr: "Јунаци из Јависа Галадског, које је он некада спасао, иду целу ноћ, скидају тела са зида и сахрањују њихове кости под дрветом у Јавису."
      hu: "Jábés-Gileád vitéz férfiai, akiket egykor megmentett, egész éjjel úton vannak, leveszik a holttesteket a falról, és csontjaikat egy fa alatt temetik el Jábésben."
      fi: "Jabes-Gileadin urhoolliset miehet, jotka hän oli kerran pelastanut, kulkevat koko yön, ottavat ruumiit alas muurilta ja hautaavat heidän luunsa puun alle Jabesissa."
      vi: "Những người dõng sĩ của Gia-be Ga-la-át, mà người đã từng giải cứu, đi trọn đêm, gỡ các thây khỏi tường thành, và chôn cốt họ dưới một cây tại Gia-be."
      ro: "Vitejii din Iabeșul Galaadului, pe care îi salvase odinioară, merg toată noaptea, iau trupurile de pe zid și le îngroapă oasele sub un copac la Iabeș."
      bg: "Храбрите мъже от Явис Галаадски, които той някога беше спасил, вървят цяла нощ, снемат телата от стената и погребват костите им под едно дърво в Явис."
