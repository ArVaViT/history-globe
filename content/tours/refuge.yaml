# The six cities of refuge: Moses sets apart three east of the Jordan (Deut 4:41-43; the
# law is Num 35:9-34) and Joshua three west of it (Josh 20:7), in the order of the text.
# The tour's year (1406 BC) follows the Exodus and conquest tours' reckoning (1 Kgs 6:1);
# the later date, c. 1220 BC, is also held. A point for the map. Kedesh uses the map's
# record tagged for Josh 20:7 (a duplicate of Kedesh at Tel Kedesh), so the three western
# cities stay in the order of that verse.
id: refuge
title:
  en: "The six cities of refuge"
  ru: "Шесть городов убежища"
  uk: "Шість міст-сховищ"
  es: "Las seis ciudades de refugio"
  pt: "As seis cidades de refúgio"
  de: "Die sechs Freistädte"
  fr: "Les six villes de refuge"
  pl: "Sześć miast ucieczki"
  it: "Le sei città di rifugio"
  nl: "De zes vrijsteden"
  cs: "Šest útočištných měst"
  sv: "De sex tillflyktsstäderna"
  nb: "De seks tilfluktsbyene"
  tl: "Ang anim na lungsod na kanlungan"
year: "1406 BC"
# Where the cities were, not a journey: no time on foot.
walked: false
approximate: true
stops:
  - place: a0cd098 # Bezer
    ref: Deut.4.41-Deut.4.43
    note:
      en: 'Moses sets apart three cities east of the Jordan, "that the slayer might flee thither, which should kill his neighbour unawares": first Bezer in the wilderness, on the plain, of Reuben.'
      ru: "Моисей отделяет три города к востоку от Иордана, «чтоб убегал туда убийца, который убьет ближнего своего без намерения»: первый Бецер в пустыне, на равнине, в колене Рувимовом."
      uk: "Мойсей відокремлює три міста на схід від Йордану, «щоб втїкав туди убийця, що ненароком вбив ближнього свого»: першим Бецер у пустелі, на рівнині, у наділі Рувима."
      es: "Moisés aparta tres ciudades al este del Jordán, «para que huyese allí el homicida que matase á su prójimo por yerro»: primero Beser, en el desierto, en la llanura, de los rubenitas."
      pt: "Moisés separa três cidades a leste do Jordão, “para que o homicida pudesse fugir para lá, aquele que matasse o seu próximo sem intenção”: primeiro Bezer, no deserto, na planície, dos rubenitas."
      de: "Mose sondert drei Städte östlich des Jordan aus, „daß dahin flöhe, wer seinen Nächsten totschlägt unversehens“: zuerst Bezer in der Wüste, im ebenen Land, im Gebiet Rubens."
      fr: "Moïse met à part trois villes à l’orient du Jourdain, « afin qu’elles servissent de refuge au meurtrier qui aurait involontairement tué son prochain » : d’abord Betser, dans le désert, dans la plaine, chez les Rubénites."
      pl: "Mojżesz wyznacza trzy miasta na wschód od Jordanu, „aby tam uciekał mężobójca, któryby zabił bliźniego swego z nieobaczenia”: najpierw Beser na pustyni, na równinie, w ziemi Rubena."
      it: "Mosè mette da parte tre città a est del Giordano, «perché servissero di rifugio all’omicida che avesse ucciso il suo prossimo involontariamente»: prima Beser, nel deserto, sull’altopiano, per Ruben."
      nl: "Mozes zondert drie steden ten oosten van de Jordaan af, “Opdat daarheen vlood de doodslager, die zijn naaste onwetende doodslaat”: eerst Bezer in de woestijn, in het vlakke land, van Ruben."
      cs: "Mojžíš odděluje tři města na východ od Jordánu, „aby utekl do nich vražedlník, kterýž by zabil bližního svého nechtě“: nejprve Beser na poušti, na rovině, v území Rúbenově."
      sv: "Mose avskiljer tre städer öster om Jordan, ”till vilka en dråpare skulle kunna fly, om han hade dräpt någon utan vett och vilja”: först Beser i öknen, på slättlandet, för Rubens stam."
      nb: "Moses utskiller tre byer øst for Jordan, «en manndraper som hadde slått sin næste ihjel av vanvare og uten før å ha båret hat til ham, kunde fly dit»: først Beser i ørkenen, på sletten, for Ruben."
      tl: "Ibinukod ni Moises ang tatlong lungsod sa silangan ng Jordan, “upang ang nakamatay ng tao ay tumakas doon, na nakamatay sa kaniyang kapuwa na hindi sinasadya”: una ang Beser sa ilang, sa kapatagan, ng Ruben."
  - place: a95147f # Ramoth
    ref: Deut.4.43
    note:
      en: "Ramoth in Gilead, of the Gadites: Ramoth-gilead, where Ahab would fall."
      ru: "Рамоф в Галааде, в колене Гадовом: тот Рамоф Галаадский, где падёт Ахав."
      uk: "Рамот у Гілеаді, в наділі Гада: Рамот Гілеадський, де впаде Ахав."
      es: "Ramot en Galaad, de los gaditas: Ramot de Galaad, donde caería Acab."
      pt: "Ramote em Gileade, dos gaditas: Ramote-Gileade, onde Acabe cairia."
      de: "Ramot in Gilead im Gebiet der Gaditer: das Ramot in Gilead, wo Ahab fallen sollte."
      fr: "Ramoth en Galaad, chez les Gadites : Ramoth en Galaad, où Achab devait tomber."
      pl: "Ramot w Gileadzie, w ziemi Gadytów: to Ramot w Gileadzie, gdzie padnie Achab."
      it: "Ramot in Galaad, per i Gaditi: Ramot di Galaad, dove cadrà Acab."
      nl: "Ramot in Gilead, van de Gadieten, waar Achab zou vallen."
      cs: "Rámot v Gileadu, v území Gádově: Rámot v Gileadu, kde padne Achab."
      sv: "Ramot i Gilead, för gaditerna: Ramot i Gilead, där Achav skulle falla."
      nb: "Ramot i Gilead, for gadittene: Ramot-Gilead, hvor Akab skulle falle."
      tl: "Ang Ramoth sa Gilead, ng mga Gadita: ang Ramoth-galaad, kung saan mabubuwal si Achab."
  - place: abb5c1e # Golan
    ref: Deut.4.43
    note:
      en: "Golan in Bashan, of Manasseh, the northernmost of the three."
      ru: "Голан в Васане, в колене Манассиином, самый северный из трёх."
      uk: "Голан у Башані, в наділі Манасії, найпівнічніше з трьох."
      es: "Golán en Basán, de Manasés, la más septentrional de las tres."
      pt: "Golã em Basã, de Manassés, a mais setentrional das três."
      de: "Golan in Baschan im Gebiet Manasses, die nördlichste der drei."
      fr: "Golan en Basan, chez les Manassites, la plus septentrionale des trois."
      pl: "Golan w Baszanie, w ziemi Manassesa, najdalej na północ spośród tych trzech."
      it: "Golan in Basan, per Manasse, la più settentrionale delle tre."
      nl: "Golan in Basan, van Manasse, de noordelijkste van de drie."
      cs: "Golán v Bášanu, v území Manasesově, nejsevernější ze tří."
      sv: "Golan i Bashan, för Manasse stam, den nordligaste av de tre."
      nb: "Golan i Basan, for Manasse, den nordligste av de tre."
      tl: "Ang Golan sa Basan, ng Manases, ang pinakahilaga sa tatlo."
  - place: a662eed # Kedesh
    ref: Josh.20.1-Josh.20.7
    note:
      en: 'After the conquest the land west of the Jordan gets its three, "that the slayer that killeth any person unawares and unwittingly may flee thither": first Kedesh in Galilee in mount Naphtali.'
      ru: "После завоевания три города получает и земля к западу от Иордана, «чтобы мог убегать туда убийца, убивший человека по ошибке, без умысла»: первый Кедес в Галилее, на горе Неффалимовой."
      uk: "Після завоювання земля на захід від Йордану дістає свої три, «щоб убийця, той хто необачно, ненароком убє чоловіка, утїкав туди»: першим Кедес у Галілеї на горі Нефталимовій."
      es: "Después de la conquista, la tierra al oeste del Jordán recibe sus tres, «para que se acoja allí el homicida que matare á alguno por yerro y no á sabiendas»: primero Cedes en Galilea, en el monte de Neftalí."
      pt: "Depois da conquista, a terra a oeste do Jordão recebe as suas três, “para que o homicida que matar qualquer pessoa acidentalmente ou sem intenção possa fugir para lá”: primeiro Quedes, na Galileia, no monte Naftali."
      de: "Nach der Eroberung erhält das Land westlich des Jordan seine drei, „dahin fliehen möge ein Totschläger, der eine Seele unversehens und unwissend schlägt“: zuerst Kedesch in Galiläa auf dem Gebirge Naftali."
      fr: "Après la conquête, le pays à l’occident du Jourdain reçoit les siennes, « où pourra s’enfuir le meurtrier qui aura tué quelqu’un involontairement, sans intention » : d’abord Kédesch en Galilée, dans la montagne de Nephthali."
      pl: "Po podboju ziemia na zachód od Jordanu otrzymuje swoje trzy, „aby tam uciekł mężobójca, coby zabił człowieka nie chcąc, z niewiadomości”: najpierw Kedesz w Galilei, w górach Neftalego."
      it: "Dopo la conquista il paese a ovest del Giordano riceve le sue tre, «affinché l’omicida che avrà ucciso qualcuno senza averne l’intenzione, possa ricoverarvisi»: prima Kedes in Galilea, sui monti di Neftali."
      nl: "Na de verovering krijgt het land ten westen van de Jordaan zijn drie, “Dat daarhenen vliede de doodslager, die een ziel door dwaling, niet met wetenschap, verslaat”: eerst Kedes in Galilea in het gebergte Naftali."
      cs: "Po dobytí země dostává tři města i země západně od Jordánu, „aby tam utekl vražedlník, kterýž by zabil člověka nechtě a z nevědomí“: nejprve Kedeš v Galileji na pohoří Neftalí."
      sv: "Efter erövringen får landet väster om Jordan sina tre, ”de städer till vilka en dråpare som ouppsåtligen, utan vett och vilja, har dödat någon må kunna fly”: först Kedesh i Galileen, i Naftalis bergsbygd."
      nb: "Etter erobringen får landet vest for Jordan sine tre, «en manndraper som av vanvare, uten å ville det, slår nogen ihjel, kan fly dit»: først Kedesj i Galilea i Naftali-fjellene."
      tl: "Pagkatapos ng pananakop, ang lupain sa kanluran ng Jordan ay nagkaroon ng tatlo nito, “upang matakasan ng nakamatay, na nakapatay sa sinoman na hindi sinasadya at hindi kusa”: una ang Cedes sa Galilea sa lupaing maburol ng Nephtali."
  - place: adf74d4 # Shechem
    ref: Josh.20.7
    note:
      en: "Shechem in mount Ephraim, between Ebal and Gerizim, where Joshua will renew the covenant."
      ru: "Сихем на горе Ефремовой, между Гевалом и Гаризимом, где Иисус Навин обновит завет."
      uk: "Сихем на горі Єфремовій, між Евалом і Гарізімом, де Ісус Навин оновить союз."
      es: "Siquem en el monte de Efraín, entre Ebal y Gerizim, donde Josué renovará el pacto."
      pt: "Siquém, no monte Efraim, entre Ebal e Gerizim, onde Josué renovará a aliança."
      de: "Sichem auf dem Gebirge Ephraim, zwischen Ebal und Garizim, wo Josua den Bund erneuern wird."
      fr: "Sichem dans la montagne d’Éphraïm, entre l’Ébal et le Garizim, où Josué renouvellera l’alliance."
      pl: "Sychem w górach Efraima, między Ebal a Garizim, gdzie Jozue odnowi przymierze."
      it: "Sichem sul monte Efraim, tra l’Ebal e il Gherizim, dove Giosuè rinnoverà l’alleanza."
      nl: "Sichem in het Bergland van Efraïm, tussen Ebal en Gerizim, waar Jozua het verbond zal vernieuwen."
      cs: "Šekem na pohoří Efrajim, mezi Ébalem a Gerizimem, kde Jozue obnoví smlouvu."
      sv: "Shekem i Efraims bergsbygd, mellan Ebal och Gerizim, där Josua ska förnya förbundet."
      nb: "Sikem i Efraims fjell, mellom Ebal og Gerisim, hvor Josva skal fornye pakten."
      tl: "Ang Sichem sa lupaing maburol ng Ephraim, sa pagitan ng Ebal at Gerizim, kung saan babaguhin ni Josue ang tipan."
  - place: a85151a # Hebron
    ref: Josh.20.7-Josh.20.9
    note:
      en: 'Kirjath-arba, which is Hebron, in the mountain of Judah. The cities are "for all the children of Israel, and for the stranger that sojourneth among them", until the slayer stands before the congregation.'
      ru: "Кириаф-Арбы, иначе Хеврон, на горе Иудиной. Города назначены «для всех сынов Израилевых и для пришельцев, живущих у них», доколе убивший не предстанет пред общество на суд."
      uk: "Кіріят-Арба, тобто Хеврон, на горі Юди. Ці міста призначено «про всїх синів Ізраїля і про чужениць, що пробували між ними», доки вбивця не постане перед громадою."
      es: "Quiriat-arba, que es Hebrón, en el monte de Judá. Las ciudades son «para todos los hijos de Israel, y para el extranjero que morase entre ellos», hasta que el homicida comparezca ante la congregación."
      pt: "Quiriate-Arba, que é Hebrom, na região montanhosa de Judá. As cidades são “para todos os filhos de Israel, e para o estrangeiro que vive entre eles”, até que o homicida compareça perante a congregação."
      de: "Kirjat-Arba, das ist Hebron, auf dem Gebirge Juda. Die Städte sind „allen Kindern Israel und den Fremdlingen, die unter ihnen wohnten“ bestimmt, bis der Totschläger vor der Gemeinde steht."
      fr: "Kirjath-Arba, qui est Hébron, dans la montagne de Juda. Ces villes sont « pour tous les enfants d’Israël et pour l’étranger en séjour au milieu d’eux », jusqu’à ce que le meurtrier comparaisse devant l’assemblée."
      pl: "Kiriat-Arba, czyli Hebron, w górach Judy. Miasta służą „wszystkim synom Izraelskim, i cudzoziemcom, którzy mieszkali w pośrodku ich”, dopóki mężobójca nie stanie przed zgromadzeniem."
      it: "Kiriat-Arba, cioè Ebron, sui monti di Giuda. Le città sono assegnate «a tutti i figliuoli d’Israele e allo straniero dimorante fra loro», finché l’omicida compaia davanti alla comunità."
      nl: "Kirjat-Arba, dat is Hebron, in het gebergte van Juda. De steden zijn “voor al de kinderen Israëls, en voor den vreemdeling, die in het midden van henlieden verkeert”, totdat de doodslager voor de vergadering staat."
      cs: "Kirjat-arba, to jest Hebron, na pohoří Juda. Města jsou „všechněm synům Izraelským, i příchozímu, kterýž pohostinu jest mezi nimi“, dokud vrah nestane před shromážděním."
      sv: "Kirjat-Arba, det vill säga Hebron, i Judas bergsbygd. Städerna gäller ”för alla Israels barn, och för de främlingar som bodde ibland dem”, tills dråparen står inför menigheten."
      nb: "Kirjat-Arba, det er Hebron, i Judas fjell. Byene er «for alle Israels barn og for de fremmede som opholder sig blandt dem», til manndraperen står frem for menigheten."
      tl: "Ang Chiriath-arba, na siyang Hebron, sa lupaing maburol ng Juda. Ang mga bayan ay “sa lahat ng mga anak ni Israel, at sa taga ibang lupa na tumatahan sa gitna nila”, hanggang sa humarap ang nakamatay sa kapisanan."
