      url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=4:section=84"
    note:
      en: "The last town of Galilee to hold out. Its leader, John of Gischala, asks Titus for a sabbath's truce and escapes by night to Jerusalem; the town then opens its gates."
      ru: "Последний непокорённый город Галилеи. Его вождь Иоанн Гисхальский просит у Тита перемирия на субботу и ночью бежит в Иерусалим; город сдаётся."
      uk: "Останнє місто Галілеї, що трималося. Його ватажок Іоанн Гісхальський просить у Тита перемир’я на суботу й уночі тікає до Єрусалима; після цього місто відчиняє ворота."
      es: "La última ciudad de Galilea que resiste. Su jefe, Juan de Giscala, pide a Tito una tregua por el sábado y huye de noche a Jerusalén; la ciudad abre entonces sus puertas."
      pt: "A última cidade da Galileia a resistir. O seu chefe, João de Giscala, pede a Tito uma trégua por causa do sábado e foge de noite para Jerusalém; a cidade então abre as portas."
      de: "Die letzte Stadt Galiläas, die noch standhält. Ihr Anführer Johannes von Gischala bittet Titus um Waffenruhe für den Sabbat und entkommt bei Nacht nach Jerusalem; daraufhin öffnet die Stadt ihre Tore."
      fr: "Dernière ville de Galilée à résister. Son chef, Jean de Gischala, demande à Titus une trêve pour le sabbat et s’enfuit de nuit à Jérusalem ; la ville ouvre alors ses portes."
      pl: "Ostatnie miasto Galilei, które jeszcze stawia opór. Jego przywódca, Jan z Gischali, prosi Tytusa o rozejm na szabat i nocą ucieka do Jerozolimy; potem miasto otwiera bramy."
      it: "L’ultima città della Galilea a resistere. Il suo capo, Giovanni di Giscala, chiede a Tito una tregua per il sabato e fugge di notte a Gerusalemme; la città allora apre le porte."
      nl: "De laatste stad van Galilea die standhoudt. Haar leider, Johannes van Gischala, vraagt Titus om een wapenstilstand voor de sabbat en ontsnapt 's nachts naar Jeruzalem; daarna opent de stad haar poorten."
      cs: "Poslední město v Galileji, které se ještě drží. Jeho vůdce Jan z Gischaly žádá Tita o sobotní příměří a v noci uniká do Jeruzaléma; město poté otevře brány."
      sv: "Den sista staden i Galileen som håller stånd. Dess ledare, Johannes från Gischala, ber Titus om vapenvila under sabbaten och flyr under natten till Jerusalem; staden öppnar sedan sina portar."
      nb: "Galileas siste by som holder stand. Lederen, Johannes av Gischala, ber Titus om våpenhvile for sabbaten og slipper unna om natten til Jerusalem; byen åpner så portene."
      tl: "Ang huling bayan ng Galilea na lumalaban. Ang pinuno nito, si Juan ng Gischala, ay humihingi kay Tito ng tigil-labanan para sa isang Sabbath at tumatakas nang gabi patungong Jerusalem; pagkatapos ay binubuksan ng bayan ang mga pintuan nito."
      da: "Den sidste by i Galilæa, der holder stand. Dens leder, Johannes fra Gischala, beder Titus om en sabbatsvåbenhvile og slipper om natten væk til Jerusalem; derefter åbner byen sine porte."
      sr: "Последњи град Галилеје који се још држи. Његов вођа, Јован из Гишале, тражи од Тита примирје због суботе и ноћу бежи у Јерусалим; град затим отвара капије."
      hu: "Galilea utolsó városa, amely még ellenáll. Vezére, Gischalai János szombati fegyverszünetet kér Titusztól, és éjjel Jeruzsálembe szökik; a város ezután megnyitja kapuit."
      fi: "Galilean viimeinen kaupunki, joka pitää puolensa. Sen johtaja Giskalan Johannes pyytää Titukselta sapatinpäivän aselepoa ja pakenee yöllä Jerusalemiin; sen jälkeen kaupunki avaa porttinsa."
      vi: "Thị trấn cuối cùng của Ga-li-lê còn cầm cự. Thủ lĩnh của nó là Johannes ở Gischala xin Titus một cuộc đình chiến nhân ngày Sa-bát rồi trốn đến Giê-ru-sa-lem trong đêm; sau đó thị trấn mở cổng."
      ro: "Ultimul oraș din Galileea care rezistă. Conducătorul său, Ioan din Giscala, îi cere lui Titus un armistițiu pe durata sabatului și fuge noaptea la Ierusalim; apoi orașul își deschide porțile."
      bg: "Последният град в Галилея, който още се съпротивлява. Водачът му Йоан от Гискала моли Тит за примирие за съботата и през нощта бяга в Йерусалим; тогава градът отваря портите си."
  - place: a15257a # Jerusalem
    year: "AD 70"
    source:
      cite:
        en: "Josephus, Jewish War 6.249"
        ru: "Иосиф Флавий, Иудейская война 6.249"
        uk: "Йосип Флавій, Юдейська війна 6.249"
