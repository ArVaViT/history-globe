      url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=6:section=249"
    note:
      en: "Titus besieges the city from Passover of AD 70. In late summer the Temple burns, on the day, Josephus notes, that the first Temple burned under Babylon; within a month the whole city is taken."
      ru: "Тит осаждает город с Пасхи 70 года. В конце лета горит храм, в тот же день, замечает Иосиф, что и первый храм при Вавилоне; через месяц взят весь город."
      uk: "Тит облягає місто від Пасхи 70 року. Пізнього літа горить храм, у той самий день, зазначає Йосип Флавій, коли за вавилонян горів перший храм; за місяць беруть усе місто."
      es: "Tito sitia la ciudad desde la Pascua del año 70 d. C. A finales del verano arde el Templo, el mismo día, anota Josefo, en que ardió el primer Templo bajo Babilonia; antes de un mes cae toda la ciudad."
      pt: "Tito cerca a cidade a partir da Páscoa do ano 70 d.C. No fim do verão o Templo arde, no mesmo dia, observa Josefo, em que o primeiro Templo foi queimado pelos babilônios; dentro de um mês a cidade inteira é tomada."
      de: "Titus belagert die Stadt vom Passafest des Jahres 70 n. Chr. an. Im Spätsommer brennt der Tempel, an demselben Tag, wie Josephus bemerkt, an dem einst der erste Tempel durch Babylon verbrannt war; innerhalb eines Monats ist die ganze Stadt eingenommen."
      fr: "Titus assiège la ville à partir de la Pâque de l’an 70 apr. J.-C. À la fin de l’été, le Temple brûle, le jour même, note Josèphe, où le premier Temple avait brûlé sous les Babyloniens ; dans le mois qui suit, la ville entière est prise."
      pl: "Tytus oblega miasto od Paschy 70 r. n.e. Pod koniec lata Świątynia płonie, w tym samym dniu, w którym, jak zauważa Józef Flawiusz, Babilończycy spalili pierwszą Świątynię; w ciągu miesiąca zdobyte zostaje całe miasto."
      it: "Tito assedia la città dalla Pasqua del 70 d.C. Alla fine dell’estate il Tempio brucia, nello stesso giorno, nota Giuseppe, in cui bruciò il primo Tempio per mano dei Babilonesi; entro un mese l’intera città è presa."
      nl: "Titus belegert de stad vanaf het Pascha van het jaar 70 n.Chr. Aan het eind van de zomer brandt de tempel, op de dag, merkt Josephus op, waarop ook de eerste tempel onder Babylon brandde; binnen een maand is de hele stad ingenomen."
      cs: "Titus obléhá město od Pesachu roku 70 n. l. Koncem léta chrám hoří, a to, jak poznamenává Josefus, v týž den, kdy za Babylonu shořel první chrám; do měsíce je dobyto celé město."
      sv: "Titus belägrar staden från påsken år 70 e.Kr. Sent på sommaren brinner templet, på samma dag, påpekar Josefus, som det första templet brann under Babylon; inom en månad är hela staden intagen."
      nb: "Titus beleirer byen fra påsken i 70 e.Kr. Sent på sommeren brenner tempelet, samme dag, bemerker Josefus, som det første tempelet ble brent av babylonerne; innen en måned er hele byen inntatt."
      tl: "Kinukubkob ni Tito ang lungsod mula sa Paskua ng 70 AD. Sa huling bahagi ng tag-araw ay nasusunog ang Templo, sa mismong araw, ayon kay Josephus, na nasunog ang unang Templo sa ilalim ng Babilonia; sa loob ng isang buwan ay nasasakop ang buong lungsod."
      da: "Titus belejrer byen fra påsken år 70 e.Kr. Sidst på sommeren brænder templet, på samme dag, bemærker Josefus, som det første tempel brændte under Babylon; inden for en måned er hele byen indtaget."
      sr: "Тит опседа град од Пасхе 70. н. е. Крајем лета Храм гори, и то, напомиње Јосиф, на исти дан када су Вавилонци спалили први Храм; за мање од месец дана заузет је цео град."
      hu: "Titusz Kr. u. 70 páskájától ostromolja a várost. Nyár végén leég a templom, azon a napon, jegyzi meg Josephus, amelyen az első templomot a babiloniak felégették; egy hónapon belül az egész várost elfoglalják."
      fi: "Titus piirittää kaupunkia vuoden 70 jaa. pääsiäisestä alkaen. Loppukesällä temppeli palaa, kuten Josephus huomauttaa, samana päivänä, jona babylonialaiset olivat polttaneet ensimmäisen temppelin; kuukauden kuluessa koko kaupunki on vallattu."
      vi: "Titus vây thành từ lễ Vượt Qua năm 70 SCN. Cuối mùa hè đền thờ bị thiêu, đúng vào ngày mà, như Josephus ghi nhận, đền thờ thứ nhất đã bị người Ba-by-lôn thiêu; trong vòng một tháng cả thành bị chiếm."
      ro: "Titus asediază cetatea de la Paștile anului 70 d.Hr. La sfârșitul verii Templul arde, chiar în ziua, notează Josephus, în care arsese primul Templu sub Babilon; în mai puțin de o lună întreaga cetate este cucerită."
      bg: "Тит обсажда града от Пасхата на 70 г. н.е. В края на лятото храмът гори в същия ден, отбелязва Йосиф, в който първият храм изгорял при Вавилон; в рамките на месец целият град е превзет."
  - place: afc8e7a # Rome
