    note:
      en: "November of AD 66: Cestius Gallus, governor of Syria, falls back from Jerusalem, and on the descent of Beth-horon the rebels rout his army and take its engines. Rome now sends Vespasian."
      ru: "Ноябрь 66 года: наместник Сирии Цестий Галл отходит от Иерусалима, и на спуске у Вефорона повстанцы разбивают его войско и захватывают машины. Тогда Рим посылает Веспасиана."
      uk: "Листопад 66 року: Цестій Галл, намісник Сирії, відступає від Єрусалима, і на спуску біля Бет-Хорону повстанці розбивають його військо й захоплюють його облогові машини. Тепер Рим посилає Веспасіана."
      es: "Noviembre del año 66 d. C.: Cestio Galo, gobernador de Siria, se retira de Jerusalén, y en la bajada de Bet-horón los rebeldes ponen en fuga a su ejército y se apoderan de sus máquinas. Roma envía ahora a Vespasiano."
      pt: "Novembro do ano 66 d.C.: Céstio Galo, governador da Síria, recua de Jerusalém e, na descida de Bete-Horom, os rebeldes desbaratam o seu exército e tomam as suas máquinas de guerra. Roma envia agora Vespasiano."
      de: "November des Jahres 66 n. Chr.: Cestius Gallus, der Statthalter von Syrien, zieht sich von Jerusalem zurück, und beim Abstieg von Bet-Horon schlagen die Aufständischen sein Heer in die Flucht und erbeuten seine Kriegsmaschinen. Rom entsendet nun Vespasian."
      fr: "Novembre de l’an 66 apr. J.-C. : Cestius Gallus, gouverneur de Syrie, se replie de Jérusalem, et dans la descente de Beth-Horon les rebelles mettent son armée en déroute et s’emparent de ses machines de guerre. Rome envoie alors Vespasien."
      pl: "Listopad 66 r. n.e.: Cestiusz Gallus, namiestnik Syrii, wycofuje się spod Jerozolimy, a na zejściu pod Bet-Choron powstańcy rozbijają jego wojsko i zdobywają machiny. Rzym wysyła teraz Wespazjana."
      it: "Novembre del 66 d.C.: Cestio Gallo, governatore della Siria, si ritira da Gerusalemme, e nella discesa di Bet-Oron i ribelli mettono in rotta il suo esercito e si impadroniscono delle sue macchine da guerra. Roma manda ora Vespasiano."
      nl: "November van het jaar 66 n.Chr.: Cestius Gallus, gouverneur van Syrië, trekt zich terug van Jeruzalem, en bij de afdaling van Beth-Horon slaan de opstandelingen zijn leger op de vlucht en maken zijn belegeringswerktuigen buit. Rome stuurt nu Vespasianus."
      cs: "Listopad roku 66 n. l.: Cestius Gallus, místodržitel Sýrie, ustupuje od Jeruzaléma a při sestupu u Bét-choronu povstalci rozbíjejí jeho vojsko a berou mu válečné stroje. Řím nyní posílá Vespasiana."
      sv: "November år 66 e.Kr.: Cestius Gallus, Syriens ståthållare, drar sig tillbaka från Jerusalem, och i nedfarten vid Bet-Horon slår upprorsmännen hans här på flykten och tar dess krigsmaskiner. Nu sänder Rom Vespasianus."
      nb: "November 66 e.Kr.: Cestius Gallus, guvernør i Syria, trekker seg tilbake fra Jerusalem, og i skråningen ned fra Bet-Horon slår opprørerne hæren hans på flukt og tar beleiringsmaskinene. Nå sender Roma Vespasian."
      tl: "Nobyembre ng 66 AD: umuurong mula sa Jerusalem si Cestio Gallo, gobernador ng Siria, at sa pagbaba sa Beth-horon ay tinatalo ng mga rebelde ang kaniyang hukbo at kinukuha ang mga makina nito. Si Vespasiano na ang isinusugo ng Roma."
      da: "November 66 e.Kr.: Cestius Gallus, Syriens statholder, trækker sig tilbage fra Jerusalem, og på nedstigningen ved Bet-Horon slår oprørerne hans hær på flugt og tager dens krigsmaskiner. Nu sender Rom Vespasian."
      sr: "Новембар 66. н. е.: Цестије Гал, намесник Сирије, одступа од Јерусалима, а на силазу код Вет-Орона устаници разбијају његову војску и узимају јој опсадне справе. Рим сада шаље Веспазијана."
      hu: "Kr. u. 66 novembere: Cestius Gallus, Szíria helytartója, visszavonul Jeruzsálem alól, és a bét-hóroni lejtőn a felkelők szétverik seregét, és elfoglalják hadigépeit. Róma most Vespasianust küldi."
      fi: "Marraskuu 66 jaa.: Cestius Gallus, Syyrian käskynhaltija, vetäytyy Jerusalemista, ja Bet-Horonin rinteellä kapinalliset lyövät hänen armeijansa ja ottavat sen piirityskoneet. Rooma lähettää nyt Vespasianuksen."
      vi: "Tháng 11 năm 66 SCN: Cestius Gallus, tổng đốc Sy-ri, rút lui khỏi Giê-ru-sa-lem, và trên dốc Bết-Hô-rôn quân nổi dậy đánh tan quân của ông và chiếm các máy công thành. Rô-ma nay sai Vespasianus đến."
      ro: "Noiembrie 66 d.Hr.: Cestius Gallus, guvernatorul Siriei, se retrage de la Ierusalim, iar la coborârea de la Bet-Horon rebelii îi zdrobesc armata și îi iau mașinile de război. Roma îl trimite acum pe Vespasian."
      bg: "Ноември 66 г. н.е.: Цестий Гал, управител на Сирия, се оттегля от Йерусалим и при слизането от Бет-Орон бунтовниците разбиват армията му и вземат обсадните му машини. Сега Рим изпраща Веспасиан."
