    note:
      en: "Vespasian and Titus hold one triumph together. The Temple's golden table and lampstand are carried through Rome, as the Arch of Titus still shows them."
      ru: "Веспасиан и Тит справляют общий триумф. Через Рим несут золотые стол и светильник из храма, как их и сейчас изображает арка Тита."
      uk: "Веспасіан і Тит справляють спільний тріумф. Золотий стіл і світильник з храму несуть Римом, як їх і досі показує арка Тита."
      es: "Vespasiano y Tito celebran juntos un solo triunfo. La mesa de oro y el candelabro del Templo son llevados por Roma, tal como todavía los muestra el Arco de Tito."
      pt: "Vespasiano e Tito celebram juntos um só triunfo. A mesa de ouro e o candelabro do Templo são levados em cortejo por Roma, como o Arco de Tito ainda os mostra."
      de: "Vespasian und Titus feiern gemeinsam einen Triumph. Der goldene Tisch und der Leuchter des Tempels werden durch Rom getragen, so wie der Titusbogen sie noch heute zeigt."
      fr: "Vespasien et Titus célèbrent ensemble un seul triomphe. La table d’or et le chandelier du Temple sont portés à travers Rome, comme l’arc de Titus les montre encore."
      pl: "Wespazjan i Tytus odbywają wspólny triumf. Przez Rzym niesione są złoty stół i świecznik ze Świątyni, tak jak do dziś przedstawia je Łuk Tytusa."
      it: "Vespasiano e Tito celebrano un solo trionfo insieme. La tavola d’oro e il candelabro del Tempio sono portati per Roma, come li mostra ancora l’Arco di Tito."
      nl: "Vespasianus en Titus houden samen één triomftocht. De gouden tafel en de kandelaar van de tempel worden door Rome gedragen, zoals de Boog van Titus ze nog altijd toont."
      cs: "Vespasianus a Titus slaví jeden společný triumf. Zlatý stůl a svícen z chrámu nesou v průvodu Římem, jak je dosud zobrazuje Titův oblouk."
      sv: "Vespasianus och Titus håller en gemensam triumf. Templets gyllene bord och ljusstake bärs genom Rom, så som Titusbågen ännu i dag visar dem."
      nb: "Vespasian og Titus holder én felles triumf. Tempelets gullbord og lysestake bæres gjennom Roma, slik Titusbuen fortsatt viser dem."
      tl: "Nagdaraos sina Vespasiano at Tito ng iisang prusisyon ng tagumpay nang magkasama. Dinadala sa mga lansangan ng Roma ang gintong mesa at ang kandelero ng Templo, gaya ng ipinakikita pa rin ng Arko ni Tito."
      da: "Vespasian og Titus holder én triumf sammen. Templets gyldne bord og lysestage bæres gennem Rom, sådan som Titusbuen stadig viser dem."
      sr: "Веспазијан и Тит славе један заједнички тријумф. Храмски златни сто и свећњак носе се кроз Рим, као што их Титов славолук и данас приказује."
      hu: "Vespasianus és Titusz közös diadalmenetet tart. A templom arany asztalát és gyertyatartóját végigviszik Rómán, ahogyan a Titusz-diadalív ma is mutatja őket."
      fi: "Vespasianus ja Titus viettävät yhteisen riemusaaton. Temppelin kultainen pöytä ja lampunjalka kannetaan Rooman halki, kuten Tituksen riemukaari niitä yhä esittää."
      vi: "Vespasianus và Titus cùng cử hành một cuộc khải hoàn. Chiếc bàn và chân đèn bằng vàng của đền thờ được rước qua Rô-ma, như Khải Hoàn Môn Titus vẫn còn khắc họa."
      ro: "Vespasian și Titus sărbătoresc un singur triumf împreună. Masa de aur și sfeșnicul Templului sunt purtate prin Roma, așa cum le arată și astăzi Arcul lui Titus."
      bg: "Веспасиан и Тит празнуват общ триумф. Златната маса и светилникът на храма са пренесени през Рим, както ги показва и до днес Титовата арка."
