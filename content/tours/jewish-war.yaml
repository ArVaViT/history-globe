    note:
      en: "Eleazar son of Ananias, captain of the Temple, persuades the priests to accept no sacrifice from a foreigner, and so stops the offering for the emperor: «the foundation of the war», Josephus writes."
      ru: "Начальник храма Елеазар, сын Анании, убеждает священников не принимать жертв от чужеземцев и тем прекращает жертву за императора: это, пишет Иосиф, и положило основание войне."
      uk: "Елеазар, син Ананії, начальник храму, переконує священиків не приймати жертви від чужоземця і так припиняє жертву за імператора: це «основа війни», пише Йосип Флавій."
      es: "Eleazar, hijo de Ananías, jefe de la guardia del Templo, persuade a los sacerdotes de que no acepten sacrificio de ningún extranjero, y así detiene la ofrenda por el emperador: «el fundamento de la guerra», escribe Josefo."
      pt: "Eleazar, filho de Ananias, capitão do Templo, persuade os sacerdotes a não aceitar sacrifício de nenhum estrangeiro e, assim, faz cessar a oferta pelo imperador: “o fundamento da guerra”, escreve Josefo."
      de: "Eleasar, der Sohn des Ananias, Hauptmann des Tempels, überredet die Priester, von keinem Fremden ein Opfer anzunehmen, und stellt so das Opfer für den Kaiser ein: „die Grundlage des Krieges“, schreibt Josephus."
      fr: "Éléazar, fils d’Ananias, commandant du Temple, persuade les prêtres de n’accepter aucun sacrifice d’un étranger, et fait ainsi cesser l’offrande pour l’empereur : « le fondement de la guerre », écrit Josèphe."
      pl: "Eleazar, syn Ananiasza, dowódca straży Świątyni, przekonuje kapłanów, by nie przyjmowali ofiary od cudzoziemca, i tym samym wstrzymuje ofiary za cesarza: „fundament wojny”, pisze Józef Flawiusz."
      it: "Eleazaro figlio di Anania, capitano del Tempio, persuade i sacerdoti a non accettare sacrifici da uno straniero, e così pone fine all’offerta per l’imperatore: «il fondamento della guerra», scrive Giuseppe."
      nl: "Eleazar, de zoon van Ananias, tempeloverste, haalt de priesters over van geen enkele vreemdeling nog een offer aan te nemen, en maakt zo een einde aan het offer voor de keizer: “de grondslag van de oorlog”, schrijft Josephus."
      cs: "Eleazar, syn Ananiášův, velitel chrámové stráže, přemlouvá kněze, aby nepřijímali žádnou oběť od cizince, a tak zastavuje oběť za císaře: „základ války“, píše Josefus."
      sv: "Eleasar, Ananias’ son, tempelvaktens befälhavare, övertalar prästerna att inte ta emot något offer från en utlänning, och stoppar därmed offret för kejsaren: ”krigets grund”, skriver Josefus."
      nb: "Eleasar, Ananias' sønn, leder for tempelvakten, overtaler prestene til ikke å ta imot noe offer fra en utlending, og stanser dermed ofringen for keiseren: «krigens grunnvoll», skriver Josefus."
      tl: "Hinihikayat ni Eleazar na anak ni Ananias, kapitan ng Templo, ang mga saserdote na huwag tumanggap ng hain mula sa isang dayuhan, at sa gayon ay pinatitigil ang handog para sa emperador: “ang pundasyon ng digmaan”, sulat ni Josephus."
      da: "Eleazar, Ananias' søn, tempelvagtens høvedsmand, overtaler præsterne til ikke at modtage noget offer fra en udlænding og bringer således offeret for kejseren til ophør: »grundvolden til krigen«, skriver Josefus."
      sr: "Елеазар, син Ананијин, заповедник Храма, наговара свештенике да не примају жртву ни од једног странца, и тако обуставља жртву за цара: „темељ рата“, пише Јосиф."
      hu: "Eleázár, Ananiás fia, a templom parancsnoka, rábeszéli a papokat, hogy ne fogadjanak el áldozatot idegentől, és így megszünteti a császárért bemutatott áldozatot: „a háború alapja”, írja Josephus."
      fi: "Eleazar, Ananiaksen poika, temppelin päällikkö, taivuttaa papit olemaan ottamatta vastaan uhria muukalaiselta ja lopettaa näin keisarin puolesta toimitettavan uhrin: ”sodan perusta”, kirjoittaa Josephus."
      vi: "Eleazar con trai A-na-nia, viên chỉ huy đền thờ, thuyết phục các thầy tế lễ không nhận của lễ từ người ngoại bang, và như vậy chấm dứt của lễ dâng vì hoàng đế: “nền tảng của cuộc chiến”, Josephus viết."
      ro: "Eleazar, fiul lui Anania, căpetenia Templului, îi convinge pe preoți să nu primească nicio jertfă de la un străin și astfel face să înceteze jertfa pentru împărat: „temelia războiului”, scrie Josephus."
      bg: "Елеазар, син на Ананий, началник на храма, убеждава свещениците да не приемат жертва от чужденец и така спира приношението за императора: „основата на войната“, пише Йосиф."
