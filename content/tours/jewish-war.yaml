    note:
      en: "Three fortresses still hold out. The new legate Lucilius Bassus takes Herod's hill-palace of Herodium first."
      ru: "Ещё держатся три крепости. Новый легат Луцилий Басс первым берёт Иродион, дворец-крепость Ирода на холме."
      uk: "Три фортеці ще тримаються. Новий легат Луцилій Басс першим бере Іродіон, палац-фортецю Ірода на пагорбі."
      es: "Tres fortalezas resisten todavía. El nuevo legado Lucilio Baso toma primero el Herodión, el palacio de Herodes sobre una colina."
      pt: "Três fortalezas ainda resistem. O novo legado Lucílio Basso toma primeiro o palácio de Herodes sobre a colina, o Heródio."
      de: "Drei Festungen halten noch aus. Der neue Legat Lucilius Bassus nimmt zuerst das Herodeion ein, den Hügelpalast des Herodes."
      fr: "Trois forteresses tiennent encore. Le nouveau légat Lucilius Bassus prend d’abord l’Hérodion, le palais d’Hérode sur sa colline."
      pl: "Trzy twierdze jeszcze się trzymają. Nowy legat Lucyliusz Bassus zdobywa najpierw Herodion, pałac Heroda na wzgórzu."
      it: "Tre fortezze resistono ancora. Il nuovo legato Lucilio Basso prende anzitutto l’Herodion, il palazzo-fortezza di Erode sulla collina."
      nl: "Drie vestingen houden nog stand. De nieuwe legaat Lucilius Bassus neemt eerst Herodes' bergpaleis Herodion in."
      cs: "Tři pevnosti se ještě drží. Nový legát Lucilius Bassus dobývá jako první Herodeion, Herodův palác na vrchu."
      sv: "Tre fästningar håller fortfarande stånd. Den nye legaten Lucilius Bassus intar först Herodion, Herodes’ palatsfästning på en kulle."
      nb: "Tre festninger holder fortsatt stand. Den nye legaten Lucilius Bassus inntar først Herodes' slott på høyden, Herodion."
      tl: "Tatlong kuta ang lumalaban pa. Unang sinasakop ng bagong legado na si Lucilio Basso ang Herodium, ang palasyo ni Herodes sa burol."
      da: "Tre fæstninger holder stadig stand. Den nye legat Lucilius Bassus indtager først Herodes' bjergpalads Herodion."
      sr: "Три тврђаве још се држе. Нови легат Луцилије Бас прво осваја Иродову палату на брду, Иродион."
      hu: "Három erőd még tartja magát. Az új legátus, Lucilius Bassus, először Heródes hegyi palotáját, Herodiont veszi be."
      fi: "Kolme linnoitusta pitää yhä puolensa. Uusi legaatti Lucilius Bassus valtaa ensimmäisenä Herodeionin, Herodeksen kukkulapalatsin."
      vi: "Ba pháo đài vẫn còn cầm cự. Vị tư lệnh mới là Lucilius Bassus chiếm trước hết Herodium, cung điện trên đồi của Hê-rốt."
      ro: "Trei fortărețe încă mai rezistă. Noul legat Lucilius Bassus cucerește mai întâi Herodium, palatul-fortăreață al lui Irod de pe deal."
      bg: "Три крепости още се държат. Новият легат Луцилий Бас превзема първо Иродион, двореца на Ирод върху хълма."
  - place: "697700" # Machaerus
    year: "AD 72"
    source:
      cite:
        en: "Josephus, Jewish War 7.164"
        ru: "Иосиф Флавий, Иудейская война 7.164"
        uk: "Йосип Флавій, Юдейська війна 7.164"
        es: "Flavio Josefo, Guerra de los judíos 7.164"
        pt: "Josefo, A Guerra dos Judeus 7.164"
        de: "Josephus, Der Jüdische Krieg 7.164"
        fr: "Josèphe, Guerre des Juifs 7.164"
        pl: "Józef Flawiusz, Wojna żydowska 7.164"
        it: "Giuseppe Flavio, La guerra giudaica 7.164"
        nl: "Josephus, De Joodse Oorlog 7.164"
        cs: "Josefus Flavius, Židovská válka 7.164"
        sv: "Josefus, Judiska kriget 7.164"
        nb: "Josefus, Den jødiske krig 7.164"
        tl: "Josephus, Ang Digmaang Judio 7.164"
        da: "Josefus, Den jødiske krig 7.164"
        sr: "Јосиф Флавије, Јеврејски рат 7.164"
        hu: "Josephus Flavius, A zsidó háború 7.164"
        fi: "Josephus, Juutalaissota 7.164"
        vi: "Josephus, Chiến tranh Do Thái 7.164"
        ro: "Josephus Flavius, Războiul iudaic 7.164"
        bg: "Йосиф Флавий, Юдейската война 7.164"
      url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=7:section=163"
    note:
      en: "Machaerus, beyond the Dead Sea, where Josephus elsewhere says John the Baptist was put to death, surrenders to Bassus in return for the life of a captured young defender."
      ru: "Махерон за Мёртвым морем, где, по словам Иосифа в «Древностях», был казнён Иоанн Креститель, сдаётся Бассу в обмен на жизнь пленённого юноши из защитников."
      uk: "Махерон, за Мертвим морем, де, як Йосип Флавій розповідає в іншому місці, стратили Івана Хрестителя, здається Бассу в обмін на життя полоненого молодого оборонця."
      es: "Maqueronte, al otro lado del Mar Muerto, donde, según dice Josefo en otro lugar, fue ejecutado Juan el Bautista, se rinde a Baso a cambio de la vida de un joven defensor capturado."
      pt: "Maquero, além do Mar Morto, onde Josefo diz em outro lugar que João Batista foi morto, rende-se a Basso em troca da vida de um jovem defensor capturado."
      de: "Machaerus jenseits des Toten Meeres, wo Johannes der Täufer, wie Josephus an anderer Stelle sagt, hingerichtet wurde, ergibt sich dem Bassus im Tausch gegen das Leben eines gefangenen jungen Verteidigers."
      fr: "Machéronte, au-delà de la mer Morte, où Josèphe dit ailleurs que Jean-Baptiste fut mis à mort, se rend à Bassus en échange de la vie d’un jeune défenseur capturé."
      pl: "Macheront za Morzem Martwym, gdzie, jak Józef Flawiusz pisze w innym miejscu, stracono Jana Chrzciciela, poddaje się Bassusowi w zamian za życie pojmanego młodego obrońcy."
      it: "Macheronte, oltre il Mar Morto, dove, come Giuseppe scrive altrove, fu messo a morte Giovanni Battista, si arrende a Basso in cambio della vita di un giovane difensore catturato."
      nl: "Machaerus, aan de overkant van de Dode Zee, waar Johannes de Doper volgens Josephus elders ter dood werd gebracht, geeft zich over aan Bassus in ruil voor het leven van een gevangen jonge verdediger."
      cs: "Machairús za Mrtvým mořem, kde byl, jak Josefus uvádí jinde, popraven Jan Křtitel, se vzdává Bassovi výměnou za život zajatého mladého obránce."
      sv: "Machaerus, bortom Döda havet, där Johannes döparen enligt Josefus på annat håll blev avrättad, kapitulerar inför Bassus mot att en tillfångatagen ung försvarare får behålla livet."
      nb: "Machaerus, hinsides Dødehavet, hvor Døperen Johannes ifølge Josefus et annet sted ble henrettet, overgir seg til Bassus til gjengjeld for livet til en ung forsvarer som er tatt til fange."
      tl: "Ang Machaerus, sa kabila ng Dagat na Patay, kung saan ayon sa ibang akda ni Josephus ay pinatay si Juan Bautista, ay sumusuko kay Basso kapalit ng buhay ng isang nabihag na batang tagapagtanggol."
      da: "Machaerus, på den anden side af Det Døde Hav, hvor Josefus andetsteds siger, at Johannes Døberen blev henrettet, overgiver sig til Bassus mod at få en tilfangetagen ung forsvarers liv skånet."
      sr: "Махерон, с оне стране Мртвог мора, где је, како Јосиф на другом месту каже, погубљен Јован Крститељ, предаје се Басу у замену за живот једног заробљеног младог бранитеља."
      hu: "Machaerus a Holt-tengeren túl, ahol Josephus egy másik helyen elmondja, hogy Keresztelő Jánost kivégezték, megadja magát Bassusnak egy fogságba esett fiatal védő életéért cserébe."
      fi: "Machaerus Kuolleenmeren takana, jossa Josephus toisaalla sanoo Johannes Kastajan surmatun, antautuu Bassukselle sitä vastaan, että vangiksi joutuneen nuoren puolustajan henki säästetään."
      vi: "Machaerus, bên kia Biển Chết, nơi mà theo Josephus ở một chỗ khác, Giăng Báp-tít bị xử tử, đầu hàng Bassus để đổi lấy mạng sống của một thanh niên bị bắt trong số những người bảo vệ."
      ro: "Machaerus, dincolo de Marea Moartă, unde, spune Josephus în altă parte, a fost omorât Ioan Botezătorul, se predă lui Bassus în schimbul vieții unui tânăr apărător capturat."
      bg: "Махерон, отвъд Мъртво море, където според Йосиф на друго място Йоан Кръстител бил умъртвен, се предава на Бас в замяна на живота на един пленен млад защитник."
  - place: "687968" # Masada
    year: "AD 73"
    source:
      cite:
        en: "Josephus, Jewish War 7.252"
        ru: "Иосиф Флавий, Иудейская война 7.252"
        uk: "Йосип Флавій, Юдейська війна 7.252"
        es: "Flavio Josefo, Guerra de los judíos 7.252"
        pt: "Josefo, A Guerra dos Judeus 7.252"
        de: "Josephus, Der Jüdische Krieg 7.252"
        fr: "Josèphe, Guerre des Juifs 7.252"
        pl: "Józef Flawiusz, Wojna żydowska 7.252"
        it: "Giuseppe Flavio, La guerra giudaica 7.252"
        nl: "Josephus, De Joodse Oorlog 7.252"
        cs: "Josefus Flavius, Židovská válka 7.252"
        sv: "Josefus, Judiska kriget 7.252"
        nb: "Josefus, Den jødiske krig 7.252"
        tl: "Josephus, Ang Digmaang Judio 7.252"
        da: "Josefus, Den jødiske krig 7.252"
        sr: "Јосиф Флавије, Јеврејски рат 7.252"
        hu: "Josephus Flavius, A zsidó háború 7.252"
        fi: "Josephus, Juutalaissota 7.252"
        vi: "Josephus, Chiến tranh Do Thái 7.252"
        ro: "Josephus Flavius, Războiul iudaic 7.252"
        bg: "Йосиф Флавий, Юдейската война 7.252"
      url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=7:section=252"
    note:
      en: "The last stronghold. Flavius Silva builds a ramp against the rock; when the wall is breached, the defenders under Eleazar son of Jair take their own lives, 960 in all. AD 73 or 74."
      ru: "Последняя твердыня. Флавий Сильва насыпает вал к скале; когда стена пробита, защитники во главе с Елеазаром, сыном Яира, лишают себя жизни, всего 960 человек. 73 или 74 год."
      uk: "Остання твердиня. Флавій Сільва зводить насип до скелі; коли в стіні пробито пролом, оборонці на чолі з Елеазаром, сином Яіра, накладають на себе руки, усього 960 осіб. 73 або 74 рік."
      es: "La última fortaleza. Flavio Silva levanta una rampa contra la roca; cuando se abre brecha en el muro, los defensores, al mando de Eleazar, hijo de Jair, se quitan la vida, 960 en total. Año 73 o 74 d. C."
      pt: "A última fortaleza. Flávio Silva constrói uma rampa contra a rocha; quando a muralha é rompida, os defensores sob Eleazar, filho de Jair, tiram a própria vida, 960 ao todo. Ano 73 ou 74 d.C."
      de: "Das letzte Bollwerk. Flavius Silva schüttet eine Rampe gegen den Felsen auf; als die Mauer durchbrochen ist, nehmen sich die Verteidiger unter Eleasar, dem Sohn des Jair, das Leben, insgesamt 960. 73 oder 74 n. Chr."
      fr: "Le dernier bastion. Flavius Silva construit une rampe contre le rocher ; quand une brèche est ouverte dans le mur, les défenseurs, commandés par Éléazar, fils de Jaïr, se donnent la mort : 960 en tout. An 73 ou 74 apr. J.-C."
      pl: "Ostatnia twierdza. Flawiusz Sylwa buduje rampę przy skale; gdy mur zostaje przebity, obrońcy pod wodzą Eleazara, syna Jaira, odbierają sobie życie, w sumie 960 osób. Rok 73 lub 74 n.e."
      it: "L’ultima roccaforte. Flavio Silva costruisce una rampa contro la roccia; quando si apre una breccia nel muro, i difensori guidati da Eleazaro figlio di Iair si tolgono la vita, 960 in tutto. 73 o 74 d.C."
      nl: "De laatste vesting. Flavius Silva werpt een stormhelling op tegen de rots; als de muur is doorbroken, nemen de verdedigers onder Eleazar, de zoon van Jaïr, zichzelf het leven, in totaal 960. 73 of 74 n.Chr."
      cs: "Poslední pevnost. Flavius Silva staví ke skále násep; když je hradba prolomena, obránci pod vedením Eleazara, syna Jairova, si sami berou život, celkem 960. Rok 73 nebo 74 n. l."
      sv: "Den sista fästningen. Flavius Silva bygger en ramp mot klippan; när muren är genombruten tar försvararna under Eleasar, Jairs son, sina egna liv, 960 till antalet. År 73 eller 74 e.Kr."
      nb: "Den siste festningen. Flavius Silva bygger en rampe mot fjellet; da muren er brutt gjennom, tar forsvarerne under Eleasar, Jairs sønn, sitt eget liv, 960 i alt. 73 eller 74 e.Kr."
      tl: "Ang huling kuta. Nagtatayo si Flavio Silva ng isang rampa laban sa bato; nang mabutas ang pader, kinikitil ng mga tagapagtanggol sa pamumuno ni Eleazar na anak ni Jair ang sarili nilang buhay, 960 lahat. 73 o 74 AD."
      da: "Den sidste højborg. Flavius Silva bygger en rampe op mod klippen; da muren er brudt igennem, tager forsvarerne under Eleazar, Jairs søn, deres eget liv, i alt 960. År 73 eller 74 e.Kr."
      sr: "Последње упориште. Флавије Силва гради насип уз стену; када је зид пробијен, бранитељи под Елеазаром, сином Јаировим, одузимају себи живот, укупно њих 960. Година 73. или 74. н. е."
      hu: "Az utolsó erődítmény. Flavius Silva rámpát építtet a sziklához; amikor a falat áttörik, a védők Jáir fiának, Eleázárnak a vezetésével önkezükkel vetnek véget életüknek, összesen 960-an. Kr. u. 73 vagy 74."
      fi: "Viimeinen linnake. Flavius Silva rakentaa rampin kalliota vasten; kun muuri murtuu, puolustajat Eleazarin, Jairin pojan, johdolla riistävät itseltään hengen, yhteensä 960. Vuonna 73 tai 74 jaa."
      vi: "Thành trì cuối cùng. Flavius Silva xây một con dốc đắp áp vào vách đá; khi tường thành bị phá thủng, những người bảo vệ dưới quyền Eleazar con trai Jair tự kết liễu đời mình, tổng cộng 960 người. Năm 73 hoặc 74 SCN."
      ro: "Ultima fortăreață. Flavius Silva ridică o rampă sprijinită de stâncă; când zidul este spart, apărătorii conduși de Eleazar, fiul lui Iair, își iau singuri viața, 960 în total. 73 sau 74 d.Hr."
      bg: "Последната твърдина. Флавий Силва издига насип срещу скалата; когато стената е пробита, защитниците под водачеството на Елеазар, син на Яир, отнемат собствения си живот, общо 960. 73 или 74 г. н.е."
