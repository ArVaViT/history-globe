    note:
      en: "Spring of AD 66: the Greeks of Caesarea profane the Jews' synagogue on a sabbath; the governor Florus, paid eight talents to help the Jews, has left the city. Josephus marks it as the war's beginning."
      ru: "Весна 66 года: кесарийские греки в субботу оскверняют синагогу иудеев; прокуратор Флор, получивший от них восемь талантов за защиту, уехал из города. Иосиф считает это началом войны."
      uk: "Весна 66 року: греки Кесарії в суботу осквернюють юдейську синагогу; намісник Флор, якому юдеї заплатили вісім талантів, щоб він їм допоміг, покинув місто. Йосип Флавій вважає це початком війни."
      es: "Primavera del año 66 d. C.: los griegos de Cesarea profanan la sinagoga de los judíos en sábado; el gobernador Floro, a quien se habían pagado ocho talentos para que ayudara a los judíos, ha abandonado la ciudad. Josefo lo señala como el comienzo de la guerra."
      pt: "Primavera do ano 66 d.C.: os gregos de Cesareia profanam a sinagoga dos judeus num sábado; o governador Floro, pago com oito talentos para ajudar os judeus, deixou a cidade. Josefo assinala isso como o começo da guerra."
      de: "Frühjahr des Jahres 66 n. Chr.: Die Griechen von Caesarea entweihen an einem Sabbat die Synagoge der Juden; der Statthalter Florus, der acht Talente erhalten hatte, um den Juden zu helfen, hat die Stadt verlassen. Josephus sieht darin den Beginn des Krieges."
      fr: "Printemps de l’an 66 apr. J.-C. : les Grecs de Césarée profanent la synagogue des Juifs un jour de sabbat ; le gouverneur Florus, qui a reçu huit talents pour aider les Juifs, a quitté la ville. Josèphe y voit le commencement de la guerre."
      pl: "Wiosna 66 r. n.e.: Grecy z Cezarei bezczeszczą w szabat synagogę Żydów; namiestnik Florus, któremu Żydzi zapłacili osiem talentów za pomoc, opuścił miasto. Józef Flawiusz uznaje to za początek wojny."
      it: "Primavera del 66 d.C.: i Greci di Cesarea profanano di sabato la sinagoga dei Giudei; il governatore Floro, pagato otto talenti per aiutare i Giudei, ha lasciato la città. Giuseppe indica questo come l’inizio della guerra."
      nl: "Lente van het jaar 66 n.Chr.: de Grieken van Caesarea ontwijden op een sabbat de synagoge van de Joden; de gouverneur Florus, die acht talenten had ontvangen om de Joden te helpen, heeft de stad verlaten. Josephus beschouwt dit als het begin van de oorlog."
      cs: "Jaro roku 66 n. l.: Řekové v Cesareji znesvěcují synagogu Židů o sabatu; místodržitel Florus, kterému bylo zaplaceno osm talentů za pomoc Židům, město opustil. Josefus to označuje za začátek války."
      sv: "Våren år 66 e.Kr.: Caesareas greker vanhelgar judarnas synagoga en sabbat; ståthållaren Florus, som fått åtta talenter för att hjälpa judarna, har lämnat staden. Josefus anger detta som krigets början."
      nb: "Våren 66 e.Kr.: grekerne i Cæsarea vanhelliger jødenes synagoge på en sabbat; guvernør Florus, som hadde fått åtte talenter for å hjelpe jødene, har forlatt byen. Josefus regner det som krigens begynnelse."
      tl: "Tagsibol ng 66 AD: nilalapastangan ng mga Griyego ng Cesarea ang sinagoga ng mga Judio sa araw ng Sabbath; ang gobernador na si Floro, na binayaran ng walong talento upang tulungan ang mga Judio, ay umalis na sa lungsod. Itinuturing ito ni Josephus na simula ng digmaan."
      da: "Foråret 66 e.Kr.: grækerne i Cæsarea vanhelliger jødernes synagoge på en sabbat; landshøvdingen Florus, som har fået otte talenter af jøderne for at hjælpe dem, har forladt byen. Josefus regner det for krigens begyndelse."
      sr: "Пролеће 66. н. е.: Грци у Цезареји у суботу скрнаве јеврејску синагогу; намесник Флор, коме су Јевреји платили осам таланата да им помогне, напустио је град. Јосиф то сматра почетком рата."
      hu: "Kr. u. 66 tavasza: Cézárea görögjei szombaton megszentségtelenítik a zsidók zsinagógáját; Florus helytartó, akit nyolc talentummal fizettek meg azért, hogy segítsen a zsidóknak, elhagyta a várost. Josephus ezt jelöli meg a háború kezdeteként."
      fi: "Kevät 66 jaa.: Kesarean kreikkalaiset häpäisevät juutalaisten synagogan sapattina; käskynhaltija Florus, jolle oli maksettu kahdeksan talenttia, jotta hän auttaisi juutalaisia, on lähtenyt kaupungista. Josephus pitää tätä sodan alkuna."
      vi: "Mùa xuân năm 66 SCN: người Hy Lạp ở Sê-sa-rê làm ô uế nhà hội của người Do Thái vào ngày Sa-bát; tổng đốc Florus, đã nhận tám ta-lâng để giúp người Do Thái, đã rời khỏi thành. Josephus xem đó là sự khởi đầu của cuộc chiến."
      ro: "Primăvara anului 66 d.Hr.: grecii din Cezareea pângăresc într-o zi de sabat sinagoga iudeilor; guvernatorul Florus, plătit cu opt talanți ca să-i ajute pe iudei, a părăsit cetatea. Josephus socotește acest fapt începutul războiului."
      bg: "Пролетта на 66 г. н.е.: гърците в Кесария оскверняват синагогата на юдеите в събота; управителят Флор, получил осем таланта, за да помогне на юдеите, е напуснал града. Йосиф отбелязва това като началото на войната."
