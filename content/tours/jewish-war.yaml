    note:
      en: "Gamla on its camel's-hump ridge beats back the first assault; a month later the Romans break in, and the town is destroyed."
      ru: "Гамала на хребте, похожем на верблюжий горб, отбивает первый приступ; через месяц римляне врываются в город, и он уничтожен."
      uk: "Гамала на своєму хребті, подібному до верблюжого горба, відбиває перший штурм; через місяць римляни вриваються, і місто руйнують."
      es: "Gamala, sobre su cresta en forma de joroba de camello, rechaza el primer asalto; un mes después los romanos irrumpen, y la ciudad es destruida."
      pt: "Gamala, sobre a sua crista em forma de corcova de camelo, repele o primeiro assalto; um mês depois os romanos irrompem, e a cidade é destruída."
      de: "Gamla auf seinem Bergrücken in Form eines Kamelhöckers wehrt den ersten Sturm ab; einen Monat später brechen die Römer ein, und die Stadt wird zerstört."
      fr: "Gamala, sur sa crête en bosse de chameau, repousse le premier assaut ; un mois plus tard, les Romains y pénètrent, et la ville est détruite."
      pl: "Gamala na grzbiecie przypominającym garb wielbłąda odpiera pierwszy szturm; miesiąc później Rzymianie wdzierają się do miasta, a miasto zostaje zburzone."
      it: "Gamla, sul suo crinale a forma di gobba di cammello, respinge il primo assalto; un mese dopo i Romani irrompono, e la città è distrutta."
      nl: "Gamla, op zijn bergrug in de vorm van een kamelenbult, slaat de eerste aanval af; een maand later breken de Romeinen binnen, en de stad wordt verwoest."
      cs: "Gamla na hřbetu podobném velbloudímu hrbu odráží první útok; o měsíc později Římané vtrhnou dovnitř a město je zničeno."
      sv: "Gamla, på sin kamelpuckelformade ås, slår tillbaka det första anfallet; en månad senare bryter sig romarna in, och staden förstörs."
      nb: "Gamla, på en åsrygg formet som en kamelpukkel, slår tilbake det første angrepet; en måned senere bryter romerne inn, og byen blir ødelagt."
      tl: "Ang Gamla sa tagaytay nitong hugis umbok ng kamelyo ay nagtataboy sa unang pagsalakay; makalipas ang isang buwan ay nakapapasok nang sapilitan ang mga Romano, at winawasak ang bayan."
      da: "Gamla på sin kamelpukkelformede højderyg slår det første angreb tilbage; en måned senere bryder romerne ind, og byen ødelægges."
      sr: "Гамла на гребену налик камиљој грбини одбија први напад; месец дана касније Римљани проваљују и град бива разорен."
      hu: "A tevepúp alakú gerincen fekvő Gamla visszaveri az első rohamot; egy hónappal később a rómaiak betörnek, és a várost elpusztítják."
      fi: "Gamla kamelin kyttyrää muistuttavalla harjanteellaan torjuu ensimmäisen hyökkäyksen; kuukautta myöhemmin roomalaiset murtautuvat sisään, ja kaupunki tuhotaan."
      vi: "Gamla trên sống đồi hình bướu lạc đà đẩy lui đợt tấn công đầu tiên; một tháng sau người La Mã phá vào, và thị trấn bị hủy diệt."
      ro: "Gamla, pe creasta ei în formă de cocoașă de cămilă, respinge primul asalt; o lună mai târziu romanii pătrund înăuntru, iar orașul este distrus."
      bg: "Гамла на хребета си, оприличен на камилска гърбица, отблъсква първия щурм; месец по-късно римляните нахлуват и градът е разрушен."
  - place: "678165" # Gischala
    year: "AD 67"
