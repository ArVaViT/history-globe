    note:
      en: "Titus rides into Tarichaea from the shore, and the Romans, on rafts, chase those who fled onto the Sea of Galilee: the lake, Josephus says, was red with blood."
      ru: "Тит врывается в Тарихею со стороны берега, а бежавших на Галилейское море римляне настигают на плотах: озеро, пишет Иосиф, покраснело от крови."
      uk: "Тит в’їжджає до Тарихеї з боку берега, а римляни на плотах наздоганяють тих, хто втік на Галілейське море: озеро, каже Йосип Флавій, почервоніло від крові."
      es: "Tito entra a caballo en Tariquea desde la orilla, y los romanos persiguen a los que huyeron sobre balsas al Mar de Galilea: el lago, dice Josefo, estaba rojo de sangre."
      pt: "Tito entra a cavalo em Tariqueia pela margem, e os romanos perseguem os que fugiram em jangadas para o Mar da Galileia: o lago, diz Josefo, ficou vermelho de sangue."
      de: "Titus reitet vom Ufer her in Tarichea ein, und die Römer setzen auf Flößen denen nach, die auf den See Genezareth geflohen waren: Der See, sagt Josephus, war rot von Blut."
      fr: "Titus pénètre à cheval dans Tarichées depuis le rivage, et les Romains poursuivent sur la mer de Galilée ceux qui s’y étaient enfuis sur des radeaux : le lac, dit Josèphe, était rouge de sang."
      pl: "Tytus wjeżdża do Tarychei od strony brzegu, a Rzymianie ścigają tych, którzy uciekli na tratwach na Jezioro Galilejskie: jezioro, mówi Józef Flawiusz, było czerwone od krwi."
      it: "Tito entra a cavallo a Tarichea dalla riva, e i Romani inseguono quelli che erano fuggiti su zattere sul Lago di Tiberiade: il lago, dice Giuseppe, era rosso di sangue."
      nl: "Titus rijdt vanaf de oever Tarichea binnen, en de Romeinen achtervolgen wie op vlotten het Meer van Galilea op is gevlucht: het meer, zegt Josephus, was rood van het bloed."
      cs: "Titus vjíždí do Tarichey od břehu a Římané na vorech pronásledují ty, kdo uprchli na Galilejské jezero: jezero, říká Josefus, bylo rudé krví."
      sv: "Titus rider in i Tarichea från strandsidan, och romarna jagar dem som flytt ut på Galileiska sjön på flottar: sjön, säger Josefus, var röd av blod."
      nb: "Titus rir inn i Tarikea fra stranden, og romerne jager dem som flyktet ut på Galileasjøen på flåter: sjøen, sier Josefus, var rød av blod."
      tl: "Pumapasok si Tito sa Tarichea mula sa baybayin, at hinahabol ng mga Romano ang mga tumakas sa Dagat ng Galilea sakay ng mga balsa: ang lawa, ayon kay Josephus, ay namula sa dugo."
      da: "Titus rider ind i Tarichea fra stranden, og romerne forfølger dem, der var flygtet ud på Genesaret Sø på tømmerflåder: søen, siger Josefus, var rød af blod."
      sr: "Тит на коњу улази у Тарихеју с обале, а Римљани гоне оне који су на сплавовима побегли на Галилејско море: језеро је, каже Јосиф, било црвено од крви."
      hu: "Titusz a part felől belovagol Tarichea városába, a rómaiak pedig üldözik azokat, akik tutajokon a Galileai-tengerre menekültek: a tó, mondja Josephus, vörös volt a vértől."
      fi: "Titus ratsastaa Taricheaan rannalta, ja roomalaiset ajavat takaa niitä, jotka olivat paenneet lautoilla Galileanjärvelle: järvi, sanoo Josephus, oli verestä punainen."
      vi: "Titus phi ngựa từ bờ hồ vào Tarichaea, và người La Mã dùng bè đuổi theo những kẻ đã trốn ra Biển Ga-li-lê: Josephus nói rằng mặt hồ đỏ ngầu máu."
      ro: "Titus intră călare în Tarichea dinspre țărm, iar romanii, pe plute, îi urmăresc pe cei care fugiseră pe Marea Galileii: lacul, spune Josephus, era roșu de sânge."
      bg: "Тит навлиза на кон в Тарихея откъм брега, а римляните гонят онези, които са избягали на салове по Галилейското езеро: езерото, казва Йосиф, почервенало от кръв."
