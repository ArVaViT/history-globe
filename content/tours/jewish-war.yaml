        fr: "Josèphe, Guerre des Juifs 6.249"
        pl: "Józef Flawiusz, Wojna żydowska 6.249"
        it: "Giuseppe Flavio, La guerra giudaica 6.249"
        nl: "Josephus, De Joodse Oorlog 6.249"
        cs: "Josefus Flavius, Židovská válka 6.249"
        sv: "Josefus, Judiska kriget 6.249"
        nb: "Josefus, Den jødiske krig 6.249"
        tl: "Josephus, Ang Digmaang Judio 6.249"
        da: "Josefus, Den jødiske krig 6.249"
        sr: "Јосиф Флавије, Јеврејски рат 6.249"
