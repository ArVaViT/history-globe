    note:
      en: "Sepphoris, the largest city of Galilee, keeps faith with Rome and asks Vespasian for a garrison, before his army has even reached Galilee."
      ru: "Сепфорис, крупнейший город Галилеи, остаётся верен Риму и просит у Веспасиана гарнизон ещё до прихода его войска в Галилею."
      uk: "Сепфоріс, найбільше місто Галілеї, залишається вірним Риму й просить у Веспасіана гарнізон, ще до того як його військо дійшло до Галілеї."
      es: "Séforis, la mayor ciudad de Galilea, se mantiene fiel a Roma y pide a Vespasiano una guarnición antes incluso de que su ejército haya llegado a Galilea."
      pt: "Séforis, a maior cidade da Galileia, mantém a fidelidade a Roma e pede a Vespasiano uma guarnição, antes mesmo de o exército dele ter chegado à Galileia."
      de: "Sepphoris, die größte Stadt Galiläas, hält Rom die Treue und bittet Vespasian um eine Garnison, noch ehe sein Heer überhaupt Galiläa erreicht hat."
      fr: "Sepphoris, la plus grande ville de Galilée, reste fidèle à Rome et demande une garnison à Vespasien, avant même que son armée ait atteint la Galilée."
      pl: "Sefforis, największe miasto Galilei, zachowuje wierność Rzymowi i prosi Wespazjana o załogę, zanim jego wojsko w ogóle dotarło do Galilei."
      it: "Sefforis, la più grande città della Galilea, resta fedele a Roma e chiede a Vespasiano una guarnigione, prima ancora che il suo esercito sia giunto in Galilea."
      nl: "Sepphoris, de grootste stad van Galilea, blijft Rome trouw en vraagt Vespasianus om een garnizoen, nog voordat zijn leger Galilea heeft bereikt."
      cs: "Sepforis, největší město Galileje, zachovává věrnost Římu a žádá Vespasiana o posádku, ještě než jeho vojsko do Galileje vůbec dorazí."
      sv: "Sepforis, Galileens största stad, förblir Rom trogen och ber Vespasianus om en garnison, innan hans här ens har nått Galileen."
      nb: "Sepforis, Galileas største by, holder seg tro mot Roma og ber Vespasian om en garnison, før hæren hans i det hele tatt har nådd Galilea."
      tl: "Ang Sepphoris, ang pinakamalaking lungsod ng Galilea, ay nananatiling tapat sa Roma at humihingi kay Vespasiano ng garison, bago pa man makarating sa Galilea ang kaniyang hukbo."
      da: "Sepforis, Galilæas største by, forbliver tro mod Rom og beder Vespasian om en garnison, før hans hær overhovedet er nået til Galilæa."
      sr: "Сефорис, највећи град Галилеје, остаје веран Риму и тражи од Веспазијана посаду, још пре него што је његова војска стигла у Галилеју."
      hu: "Sepphórisz, Galilea legnagyobb városa hű marad Rómához, és helyőrséget kér Vespasianustól, még mielőtt hadserege Galileába érkezett volna."
      fi: "Sepphoris, Galilean suurin kaupunki, pysyy uskollisena Roomalle ja pyytää Vespasianukselta varusväkeä, ennen kuin hänen armeijansa on edes saapunut Galileaan."
      vi: "Sepphoris, thành lớn nhất Ga-li-lê, giữ lòng trung thành với Rô-ma và xin Vespasianus một đồn binh, trước cả khi quân của ông đến Ga-li-lê."
      ro: "Sepphoris, cea mai mare cetate a Galileii, rămâne credincioasă Romei și cere o garnizoană de la Vespasian, înainte ca armata lui să fi ajuns măcar în Galileea."
      bg: "Сефорис, най-големият град в Галилея, остава верен на Рим и моли Веспасиан за гарнизон, още преди армията му да е стигнала до Галилея."
  - place: adbbb54 # Jotbah: Jotapata
    year: "AD 67"
    source:
      cite:
        en: "Josephus, Jewish War 3.141"
        ru: "Иосиф Флавий, Иудейская война 3.141"
        uk: "Йосип Флавій, Юдейська війна 3.141"
