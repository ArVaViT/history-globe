      url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=3:section=141"
    note:
      en: "Jotapata, probably the Jotbah of 2 Kings 21:19, where Josephus himself commands, holds Vespasian for forty-seven days. When it falls Josephus hides in a cistern, gives himself up, and foretells that Vespasian will be emperor."
      ru: "Иотапата (вероятно, библейская Ятба, 4 Цар 21:19), где начальствует сам Иосиф, сорок семь дней держится против Веспасиана. Когда город пал, Иосиф скрывается в пещере, сдаётся и предсказывает Веспасиану императорскую власть."
      uk: "Йотапата, імовірно та сама Йотба з 2 Цар 21:19, де сам Йосип Флавій веде оборону, тримає Веспасіана сорок сім днів. Коли місто падає, Йосип Флавій ховається в цистерні, здається і провіщає, що Веспасіан буде імператором."
      es: "Jotapata, probablemente la Jotba de 2 R 21:19, donde manda el propio Josefo, contiene a Vespasiano durante cuarenta y siete días. Cuando cae, Josefo se esconde en una cisterna, se entrega y predice que Vespasiano será emperador."
      pt: "Jotapata, provavelmente a Jotbá de 2Rs 21:19, onde o próprio Josefo comanda, detém Vespasiano por quarenta e sete dias. Quando cai, Josefo se esconde numa cisterna, entrega-se e prediz que Vespasiano será imperador."
      de: "Jotapata, wahrscheinlich das Jotba von 2. Kön 21,19, wo Josephus selbst den Befehl führt, hält Vespasian siebenundvierzig Tage lang auf. Als es fällt, versteckt sich Josephus in einer Zisterne, ergibt sich und sagt voraus, dass Vespasian Kaiser werden wird."
      fr: "Jotapata, probablement la Jotba de 2 R 21:19, où Josèphe lui-même commande, tient tête à Vespasien pendant quarante-sept jours. Quand elle tombe, Josèphe se cache dans une citerne, se rend et prédit que Vespasien sera empereur."
      pl: "Jotapata, prawdopodobnie Jotba z 2 Krl 21,19, gdzie dowodzi sam Józef Flawiusz, wstrzymuje Wespazjana przez czterdzieści siedem dni. Gdy upada, Józef Flawiusz ukrywa się w cysternie, poddaje się i przepowiada, że Wespazjan zostanie cesarzem."
      it: "Iotapata, probabilmente la Iotba di 2 Re 21,19, dove comanda Giuseppe stesso, tiene testa a Vespasiano per quarantasette giorni. Quando cade, Giuseppe si nasconde in una cisterna, si arrende e predice che Vespasiano sarà imperatore."
      nl: "Jotapata, waarschijnlijk het Jotba van 2 Kon. 21:19, waar Josephus zelf het bevel voert, houdt Vespasianus zevenenveertig dagen tegen. Als de stad valt, verbergt Josephus zich in een cisterne, geeft zich over en voorspelt dat Vespasianus keizer zal worden."
      cs: "Jotapata, pravděpodobně Jotba z 2 Kr 21,19, kde sám Josefus velí, vzdoruje Vespasianovi čtyřicet sedm dní. Když město padne, Josefus se ukrývá v cisterně, vzdává se a předpovídá, že Vespasianus bude císařem."
      sv: "Jotapata, sannolikt det Jotva som nämns i 2 Kung 21:19, där Josefus själv har befälet, håller stånd mot Vespasianus i fyrtiosju dagar. När staden faller gömmer sig Josefus i en cistern, ger sig fången och förutsäger att Vespasianus ska bli kejsare."
      nb: "Jotapata, trolig Jotba i 2 Kong 21,19, hvor Josefus selv har kommandoen, holder Vespasian tilbake i førtisju dager. Da byen faller, gjemmer Josefus seg i en sisterne, gir seg over og forutsier at Vespasian skal bli keiser."
      tl: "Ang Jotapata, marahil ang Jotba ng 2 Hari 21:19, kung saan si Josephus mismo ang namumuno, ay nakahahadlang kay Vespasiano sa loob ng apatnapu't pitong araw. Nang bumagsak ito, nagtatago si Josephus sa isang imbakan ng tubig, sumusuko, at inihuhula na magiging emperador si Vespasiano."
      da: "Jotapata, sandsynligvis det Jotba, der nævnes i 2 Kong 21,19, hvor Josefus selv har kommandoen, holder stand mod Vespasian i syvogfyrre dage. Da byen falder, skjuler Josefus sig i en cisterne, overgiver sig og forudsiger, at Vespasian skal blive kejser."
      sr: "Јотапата, вероватно Јотва из 2. Цар 21,19, где заповеда сам Јосиф, задржава Веспазијана четрдесет седам дана. Кад град падне, Јосиф се скрива у цистерни, предаје се и прориче да ће Веспазијан постати цар."
      hu: "Jotapata, valószínűleg a 2Kir 21,19 Jotbája, ahol maga Josephus a parancsnok, negyvenhét napig feltartóztatja Vespasianust. Amikor elesik, Josephus egy ciszternában rejtőzik el, megadja magát, és megjövendöli, hogy Vespasianus császár lesz."
      fi: "Jotapata, luultavasti 2. Kun. 21:19:ssä mainittu Jotba, jossa Josephus itse on komentajana, pidättelee Vespasianusta neljäkymmentäseitsemän päivää. Kun kaupunki kukistuu, Josephus piiloutuu vesisäiliöön, antautuu ja ennustaa Vespasianuksen tulevan keisariksi."
      vi: "Jotapata, có lẽ là Giốt-ba trong 2 Các Vua 21:19, nơi chính Josephus chỉ huy, cầm chân Vespasianus bốn mươi bảy ngày. Khi thành thất thủ, Josephus trốn trong một bể chứa nước, ra đầu hàng, và tiên báo rằng Vespasianus sẽ làm hoàng đế."
      ro: "Iotapata, probabil Iotba din 2 Regi 21:19, unde comandă chiar Josephus, îl ține pe Vespasian pe loc patruzeci și șapte de zile. Când cade, Josephus se ascunde într-o cisternă, se predă și prevestește că Vespasian va fi împărat."
      bg: "Йотапата, вероятно Йотва от 4 Царе 21:19, където сам Йосиф командва, задържа Веспасиан четиридесет и седем дни. Когато градът пада, Йосиф се крие в една цистерна, предава се и предсказва, че Веспасиан ще стане император."
