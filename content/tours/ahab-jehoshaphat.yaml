# Ahab's wars with Syria and Jehoshaphat's reign, 1 Kings 20 and 22 with 2 Chronicles
# 17-20, in the order of the story: each book's stops keep their own order, and Jehoshaphat's
# third year (2 Chr 17) comes first because it is the earliest. Elijah's part (1 Kgs 17-19,
# 21) is in his own tour. The tour's year (853 BC) is Ahab's death at Ramoth-gilead, the
# usual date from Shalmaneser III's annals (Qarqar, 853 BC; Thiele). Jehoshaphat's
# teaching mission in his third year carries 870 BC (his reign c. 872-848 BC, the first
# years with Asa). The siege of Samaria and the battle of Aphek fall some years before
# 853; the ships at Ezion-geber, built with Ahaziah, just after it. Micaiah prophesies at
# the gate of Samaria (1 Kgs 22:10), so his scene is told there.
id: ahab-jehoshaphat
title:
  en: "Ahab and Jehoshaphat"
  ru: "Ахав и Иосафат"
  uk: "Ахав і Йосафат"
  es: "Acab y Josafat"
  pt: "Acabe e Josafá"
  de: "Ahab und Josaphat"
  fr: "Achab et Josaphat"
  pl: "Achab i Jozafat"
  it: "Acab e Giosafat"
  nl: "Achab en Josafat"
  cs: "Achab a Jozafat"
  sv: "Achav och Josafat"
  nb: "Akab og Josjafat"
  tl: "Si Achab at si Josaphat"
  da: "Akab og Josafat"
  sr: "Ахав и Јосафат"
  hu: "Aháb és Jósafát"
  fi: "Ahab ja Josafat"
  vi: "A-háp và Giô-sa-phát"
  ro: "Ahab și Iosafat"
  bg: "Ахав и Йосафат"
year: "853 BC"
# Where the story happens, told of two kings: no time on foot.
walked: false
people: ["Ahab@1Ki.16.28-Mic", "Jehoshaphat@1Ki.15.24-Mat"]
approximate: true
stops:
  - place: a15257a # Jerusalem
    ref: 2Chr.17.1-2Chr.17.19
    year: "870 BC"
    note:
      en: "Jehoshaphat king of Judah strengthens the land and in his third year sends princes and Levites with the book of the law to teach in all the cities of Judah."
      ru: "Иосафат, царь Иудейский, укрепляет страну и в третий год посылает князей и левитов с книгой закона учить народ по всем городам Иудеи."
      uk: "Йосафат, цар Юди, зміцнює країну й на третій рік свого царювання посилає князів і левітів з книгою закону навчати по всіх містах Юди."
      es: "Josafat, rey de Judá, fortalece el país y en su tercer año envía príncipes y levitas con el libro de la ley para enseñar en todas las ciudades de Judá."
      pt: "Josafá, rei de Judá, fortalece a terra e, no seu terceiro ano, envia príncipes e levitas com o livro da lei para ensinar em todas as cidades de Judá."
      de: "Josaphat, der König von Juda, stärkt das Land und sendet im dritten Jahr Oberste und Leviten mit dem Gesetzbuch aus, um in allen Städten Judas zu lehren."
      fr: "Josaphat, roi de Juda, fortifie le pays et, la troisième année de son règne, envoie des chefs et des Lévites avec le livre de la loi enseigner dans toutes les villes de Juda."
      pl: "Jozafat, król Judy, umacnia kraj i w trzecim roku swego panowania wysyła książąt i Lewitów z księgą Prawa, by nauczali we wszystkich miastach Judy."
      it: "Giosafat, re di Giuda, rafforza il paese e nel suo terzo anno manda capi e Leviti con il libro della legge a istruire in tutte le città di Giuda."
      nl: "Josafat, de koning van Juda, versterkt het land en zendt in zijn derde jaar vorsten en Levieten met het wetboek eropuit om les te geven in alle steden van Juda."
      cs: "Jozafat, judský král, upevňuje zemi a ve třetím roce vysílá knížata a levity s knihou zákona, aby učili ve všech městech Judských."
      sv: "Josafat, kung av Juda, stärker landet och sänder under sitt tredje år furstar och leviter med lagboken för att undervisa i alla Judas städer."
      nb: "Josjafat, konge av Juda, styrker landet og sender i sitt tredje år fyrster og levitter med lovboken for å undervise i alle Judas byer."
      tl: "Pinalalakas ni Josaphat na hari ng Juda ang lupain at, sa ikatlong taon niya, nagsusugo ng mga pinuno at mga Levita na may aklat ng kautusan upang magturo sa lahat ng mga bayan ng Juda."
      da: "Josafat, Judas konge, styrker landet og sender i sit tredje regeringsår fyrster og leviter med lovbogen ud for at undervise i alle Judas byer."
      sr: "Јосафат, цар јудејски, учвршћује земљу и треће године шаље кнезове и левите с књигом закона да поучавају по свим градовима Јудиним."
      hu: "Jósafát, Júda királya megerősíti az országot, és uralkodásának harmadik évében fejedelmeket és lévitákat küld a törvény könyvével, hogy Júda valamennyi városában tanítsanak."
      fi: "Juudan kuningas Josafat vahvistaa maata ja lähettää hallintonsa kolmantena vuonna ruhtinaita ja leeviläisiä lain kirja mukanaan opettamaan kaikkiin Juudan kaupunkeihin."
      vi: "Giô-sa-phát, vua Giu-đa, củng cố xứ sở và, vào năm thứ ba triều mình, sai các quan trưởng và người Lê-vi mang sách luật pháp đi dạy trong mọi thành của Giu-đa."
      ro: "Iosafat, regele lui Iuda, întărește țara și, în al treilea an al domniei sale, trimite căpetenii și leviți cu cartea legii ca să învețe poporul în toate cetățile lui Iuda."
      bg: "Йосафат, царят на Юда, укрепва страната и в третата си година изпраща князе и левити с книгата на закона да поучават във всички градове на Юда."
  - place: a041bb3 # Samaria
    ref: 1Kgs.20.1-1Kgs.20.21
    note:
      en: 'Ben-hadad of Syria with thirty-two kings besieges Samaria; a prophet tells Ahab, "I will deliver it into thine hand this day", and the young men of the princes of the provinces rout the Syrians.'
      ru: "Венадад Сирийский с тридцатью двумя царями осаждает Самарию; пророк говорит Ахаву: «Я сегодня предам его в руку твою», и слуги областных начальников обращают Сириян в бегство."
      uk: "Бен-Гадад Сирійський із тридцятьма двома царями облягає Самарію; пророк каже Ахавові: «Я сьогоднї подам її тобі в руки», і слуги князів областей розбивають сирійців."
      es: "Ben-adad de Siria, con treinta y dos reyes, sitia Samaria; un profeta dice a Acab: «he aquí yo te la entregaré hoy en tu mano», y los jóvenes de los príncipes de las provincias derrotan a los sirios."
      pt: "Ben-Hadade, da Síria, com trinta e dois reis, cerca Samaria; um profeta diz a Acabe: “hoje a entregarei nas suas mãos”, e os jovens dos chefes das províncias põem os sírios em fuga."
      de: "Ben-Hadad von Syrien belagert mit zweiunddreißig Königen Samaria; ein Prophet sagt Ahab: „Ich will ihn heute in deine Hand geben“, und die jungen Männer der Fürsten der Provinzen schlagen die Syrer in die Flucht."
      fr: "Ben-Hadad de Syrie, avec trente-deux rois, assiège Samarie ; un prophète dit à Achab : « Je vais la livrer aujourd’hui entre tes mains », et les jeunes gens des chefs des provinces mettent les Syriens en déroute."
      pl: "Ben-Hadad z Syrii wraz z trzydziestoma dwoma królami oblega Samarię; prorok mówi Achabowi: „Oto Ja je dam w rękę twoję dzisiaj”, a słudzy książąt powiatowych rozgramiają Syryjczyków."
      it: "Ben-Adad di Siria, con trentadue re, assedia Samaria; un profeta dice ad Acab: «oggi io la darò in tuo potere», e i servi dei capi delle province mettono in rotta i Siri."
      nl: "Ben-Hadad van Syrië belegert met tweeëndertig koningen Samaria; een profeet zegt tot Achab: “Zie, Ik zal ze heden in uw hand geven”, en de jonge mannen van de vorsten der gewesten slaan de Syriërs op de vlucht."
      cs: "Ben-hadad Syrský se třiceti dvěma králi obléhá Samaří; prorok říká Achabovi: „dám je dnes v ruku tvou“, a mládenci knížat krajů Syřany rozmetají."
      sv: "Ben-Hadad av Syrien belägrar Samaria med trettiotvå kungar; en profet säger till Achav: ”jag vill i dag giva den i din hand”, och provinsfurstarnas unga män slår syrierna på flykten."
      nb: "Ben-Hadad av Syria kringsetter Samaria med to og tretti konger; en profet sier til Akab: «Jeg gir den idag i din hånd», og de unge mennene hos fyrstene over landsdelene slår syrerne på flukt."
      tl: "Kinukubkob ni Ben-adad ng Siria, kasama ang tatlumpu't dalawang hari, ang Samaria; sinasabi ng isang propeta kay Achab, “aking ibibigay sa iyong kamay sa araw na ito”, at pinatatakbo ng mga bataan ng mga prinsipe ng mga lalawigan ang mga taga-Siria."
      da: "Ben-Hadad af Syrien belejrer Samaria med toogtredive konger; en profet siger til Akab: »jeg vil give den i Dag i din Haand«, og provinsfyrsternes unge mænd slår syrerne på flugt."
      sr: "Вен-Адад сирски с тридесет и два цара опколи Самарију; један пророк говори Ахаву: „ја ћу ти га дати у руке данас“, и момци кнезова земаљских разбијају Сиријце."
      hu: "Ben-Hadad, Szíria királya harminckét királlyal ostrom alá veszi Szamáriát; egy próféta ezt mondja Ahábnak: „e mai napon kezedbe adom azt”, és a tartományok fejedelmeinek ifjai megfutamítják a szíriaiakat."
      fi: "Syyrian kuningas Benhadad piirittää Samariaa kolmenkymmenenkahden kuninkaan kanssa; profeetta sanoo Ahabille: ”Katso, minä annan sen tänä päivänä sinun käsiisi”, ja maakuntien päämiesten nuoret miehet ajavat syyrialaiset pakoon."
      vi: "Bên-Ha-đát, vua Sy-ri, cùng ba mươi hai vua vây hãm Sa-ma-ri; một tiên tri nói với A-háp: “Kìa, ngày nay, ta sẽ phó nó vào tay ngươi”, và các trai trẻ của những quan cai các tỉnh đánh tan quân Sy-ri."
      ro: "Ben-Hadad al Siriei, împreună cu treizeci și doi de regi, asediază Samaria; un profet îi spune lui Ahab: „Iată eu o voiu da pre ea astăzi în mâna ta”, iar tinerii căpeteniilor ținuturilor îi pun pe fugă pe sirieni."
      bg: "Венадад Сирийски с тридесет и двама царе обсажда Самария; един пророк казва на Ахав: „аз го предавам в ръцете ти днес“, и момците на областните князе разбиват сирийците."
  - place: a6fc60d # Aphek
    ref: 1Kgs.20.26-1Kgs.20.34
    note:
      en: "A year later Ben-hadad comes up to Aphek, the Syrians saying the Lord is a God of the hills and not of the valleys; Israel smites them, a wall falls on 27,000 in Aphek, and Ahab lets Ben-hadad go for a covenant."
      ru: "Через год Венадад выступает к Афеку: Сирияне говорят, что Господь есть Бог гор, а не Бог долин; Израиль поражает их, в Афеке стена падает на двадцать семь тысяч, и Ахав отпускает Венадада, заключив договор."
      uk: "Через рік Бен-Гадад приходить до Афека, а сирійці кажуть, що Господь — Бог гір, а не долин; Ізраїль розбиває їх, у Афеку стіна падає на 27 000 чоловіків, і Ахав відпускає Бен-Гадада за угоду."
      es: "Un año después Ben-adad sube a Afec, pues los sirios dicen que el Señor es un dios de los montes y no de los valles; Israel los derrota, un muro cae sobre 27 000 en Afec, y Acab deja ir a Ben-adad a cambio de un pacto."
      pt: "Um ano depois, Ben-Hadade sobe a Afeque, dizendo os sírios que o Senhor é um Deus dos montes e não dos vales; Israel os fere, um muro cai sobre 27.000 homens em Afeque, e Acabe deixa Ben-Hadade partir em troca de uma aliança."
      de: "Ein Jahr später zieht Ben-Hadad nach Afek herauf, wobei die Syrer sagen, der Herr sei ein Gott der Berge und nicht der Täler; Israel schlägt sie, in Afek stürzt eine Mauer auf 27 000 Mann, und Ahab lässt Ben-Hadad gegen einen Bund frei."
      fr: "Un an plus tard, Ben-Hadad monte à Aphek, les Syriens disant que l’Éternel est un dieu des montagnes et non un dieu des vallées ; Israël les bat, une muraille s’écroule sur 27 000 hommes à Aphek, et Achab laisse partir Ben-Hadad en échange d’une alliance."
      pl: "Rok później Ben-Hadad wyrusza pod Afek, a Syryjczycy mówią, że Pan jest Bogiem gór, a nie dolin; Izrael ich pobija, mur przygniata w Afek 27 000 ludzi, a Achab wypuszcza Ben-Hadada w zamian za przymierze."
      it: "Un anno dopo Ben-Adad sale ad Afek, mentre i Siri dicono che il Signore è un Dio dei monti e non delle valli; Israele li sconfigge, un muro cade su 27.000 uomini in Afek, e Acab lascia andare Ben-Adad in cambio di un’alleanza."
      nl: "Een jaar later trekt Ben-Hadad op naar Afek, want de Syriërs zeggen dat de HEER een God der bergen is en niet der dalen; Israël verslaat hen, een muur valt op 27.000 man in Afek, en Achab laat Ben-Hadad gaan tegen een verbond."
      cs: "O rok později přitahuje Ben-hadad k Afeku, protože Syřané říkají, že Hospodin je Bůh hor, a ne údolí; Izrael je poráží, v Afeku padne zeď na 27 000 mužů a Achab propustí Ben-hadada za smlouvu."
      sv: "Ett år senare drar Ben-Hadad upp till Afek, och syrierna säger att Herren är en bergsgud och inte en dalgud; Israel slår dem, en mur faller över 27 000 man i Afek, och Achav låter Ben-Hadad gå mot ett förbund."
      nb: "Et år senere drar Ben-Hadad opp til Afek, idet syrerne sier at Herren er en Gud for fjellene og ikke for dalene; Israel slår dem, en mur faller over 27 000 mann i Afek, og Akab lar Ben-Hadad gå mot en pakt."
      tl: "Pagkaraan ng isang taon ay umaahon si Ben-adad sa Aphec, sapagka't sinasabi ng mga taga-Siria na ang Panginoon ay Dios ng mga burol at hindi ng mga libis; sinasaktan sila ng Israel, isang pader ang bumabagsak sa 27,000 sa Aphec, at pinalalaya ni Achab si Ben-adad kapalit ng isang tipan."
      da: "Et år senere drager Ben-Hadad op til Afek, idet syrerne siger, at Herren er en gud for bjergene og ikke for dalene; Israel slår dem, en mur falder over 27.000 mand i Afek, og Akab lader Ben-Hadad gå mod en pagt."
      sr: "Годину дана касније Вен-Адад долази к Афеку, јер Сиријци кажу да је Господ Бог горски, а не долински; Израиљ их туче, зид пада на двадесет и седам хиљада у Афеку, а Ахав пушта Вен-Адада да склопи савез."
      hu: "Egy évvel később Ben-Hadad Áfekhez vonul; a szíriaiak azt mondják, hogy az Úr a hegyek istene, nem a völgyeké; Izráel megveri őket, Áfekben egy fal ráomlik 27 000 emberre, Aháb pedig szövetségért szabadon bocsátja Ben-Hadadot."
      fi: "Vuotta myöhemmin Benhadad nousee Afekiin, ja syyrialaiset sanovat Herran olevan vuorten eikä laaksojen Jumala; Israel lyö heidät, muuri kaatuu 27 000 miehen päälle Afekissa, ja Ahab päästää Benhadadin menemään liiton vastineeksi."
      vi: "Một năm sau, Bên-Ha-đát kéo lên A-phéc, người Sy-ri nói rằng Đức Giê-hô-va là Đức Chúa Trời của núi chứ không phải của trũng; Y-sơ-ra-ên đánh bại chúng, một bức tường sập đè lên hai mươi bảy ngàn người tại A-phéc, và A-háp tha Bên-Ha-đát để lập giao ước."
      ro: "Un an mai târziu, Ben-Hadad urcă la Afec, căci sirienii spun că Domnul este un Dumnezeu al munților, nu al văilor; Israel îi bate, un zid cade peste 27.000 de oameni în Afec, iar Ahab îl lasă pe Ben-Hadad să plece în schimbul unui legământ."
      bg: "Година по-късно Венадад идва при Афек, а сирийците казват, че Господ е Бог на планините, а не на доловете; Израил ги поразява, в Афек една стена пада върху 27 000 души и Ахав пуска Венадад срещу договор."
  - place: a041bb3 # Samaria
    ref: 1Kgs.22.1-1Kgs.22.28
    note:
      en: 'In the third year without war Jehoshaphat comes down to Ahab and agrees to go up with him to Ramoth-gilead. At the gate of Samaria some four hundred prophets promise victory; Micaiah alone sees Israel scattered "as sheep that have not a shepherd", and is put in prison.'
      ru: "На третий год без войны Иосафат приходит к Ахаву и соглашается идти с ним на Рамоф Галаадский. У ворот Самарии около четырёхсот пророков сулят победу; один Михей видит Израильтян, рассеянных «как овец, у которых нет пастыря», и его сажают в темницу."
      uk: "На третій рік без війни Йосафат приходить до Ахава й погоджується піти з ним на Рамот Гілеадський. Біля брами Самарії близько чотирьохсот пророків обіцяють перемогу; лише Михей бачить Ізраїль розсіяним, «наче вівцї, що нема в їх пастуха», і його кидають до в’язниці."
      es: "En el tercer año sin guerra Josafat baja a ver a Acab y acepta subir con él a Ramot de Galaad. A la puerta de Samaria unos cuatrocientos profetas prometen la victoria; solo Micaías ve a Israel esparcido «como ovejas que no tienen pastor», y es metido en la cárcel."
      pt: "No terceiro ano sem guerra, Josafá desce até Acabe e concorda em subir com ele a Ramote-Gileade. À porta de Samaria, cerca de quatrocentos profetas prometem vitória; somente Micaías vê Israel espalhado “como ovelhas que não têm pastor”, e é lançado na prisão."
      de: "Im dritten Jahr ohne Krieg kommt Josaphat zu Ahab hinab und willigt ein, mit ihm nach Ramot in Gilead hinaufzuziehen. Am Tor von Samaria verheißen etwa vierhundert Propheten den Sieg; allein Michaja sieht Israel zerstreut „wie die Schafe, die keinen Hirten haben“, und wird ins Gefängnis geworfen."
      fr: "La troisième année sans guerre, Josaphat descend chez Achab et accepte de monter avec lui à Ramoth en Galaad. À la porte de Samarie, quelque quatre cents prophètes promettent la victoire ; Michée seul voit Israël dispersé « comme des brebis qui n’ont point de berger », et il est jeté en prison."
      pl: "W trzecim roku bez wojny Jozafat przybywa do Achaba i zgadza się wyruszyć z nim na Ramot w Gileadzie. U bramy Samarii około czterystu proroków obiecuje zwycięstwo; jedynie Michajasz widzi Izraela rozproszonego „jako owce, które nie mają pasterza”, i zostaje wtrącony do więzienia."
      it: "Nel terzo anno senza guerra Giosafat scende da Acab e accetta di salire con lui a Ramot di Galaad. Alla porta di Samaria circa quattrocento profeti promettono la vittoria; solo Michea vede Israele disperso «come pecore che non hanno pastore», ed è messo in prigione."
      nl: "In het derde jaar zonder oorlog komt Josafat bij Achab en stemt ermee in met hem op te trekken naar Ramot in Gilead. Bij de poort van Samaria beloven zo'n vierhonderd profeten de overwinning; alleen Michaja ziet Israël verstrooid “gelijk schapen, die geen herder hebben”, en wordt in de gevangenis gezet."
      cs: "Ve třetím roce bez války přijíždí Jozafat k Achabovi a svoluje, že s ním vytáhne na Rámot v Gileadu. U brány Samaří asi čtyři sta proroků slibuje vítězství; jen Micheáš vidí Izrael rozptýlený „jako ovce, kteréž nemají pastýře“, a je uvržen do vězení."
      sv: "Under det tredje året utan krig går Josafat ner till Achav och går med på att dra upp med honom till Ramot i Gilead. Vid Samarias port lovar omkring fyra hundra profeter seger; Mikaja ensam ser Israel förskingrat ”likt får som icke hava någon herde” och sätts i fängelse."
      nb: "I det tredje året uten krig kommer Josjafat ned til Akab og går med på å dra opp med ham til Ramot-Gilead. Ved porten i Samaria lover omkring fire hundre profeter seier; bare Mikaja ser Israel spredt «likesom en fårehjord som ikke har hyrde», og blir satt i fengsel."
      tl: "Sa ikatlong taong walang digmaan ay bumababa si Josaphat kay Achab at pumapayag na umahon na kasama niya sa Ramoth-galaad. Sa pintuang-bayan ng Samaria, may humigit-kumulang apat na raang propeta ang nangangako ng tagumpay; si Michaia lamang ang nakakakita sa Israel na nangangalat “na gaya ng mga tupa na walang pastor”, at ibinibilanggo siya."
      da: "I det tredje år uden krig kommer Josafat ned til Akab og går med til at drage op med ham til Ramot i Gilead. Ved Samarias port lover omkring fire hundrede profeter sejr; Mikaja alene ser Israel adspredt »ligesom Faarene, der ingen Hyrde have«, og bliver kastet i fængsel."
      sr: "Треће године без рата Јосафат силази к Ахаву и пристаје да с њим иде на Рамот Галадски. На вратима самаријским око четири стотине пророка обећава победу; само Михеја види Израиља разасутог „као овце које немају пастира“ и бацају га у тамницу."
      hu: "A háború nélküli harmadik évben Jósafát lemegy Ahábhoz, és vállalja, hogy felvonul vele Rámót-Gileád ellen. Szamária kapujánál mintegy négyszáz próféta győzelmet ígér; csak Mikeás látja Izráelt szétszéledve, „mint a juhokat, a melyeknek nincsen pásztoruk”, és börtönbe vetik."
      fi: "Kun sotaa ei ole ollut kolmeen vuoteen, Josafat tulee alas Ahabin luo ja suostuu lähtemään hänen kanssaan Ramot-Gileadiin. Samarian portilla noin neljäsataa profeettaa lupaa voittoa; vain Mikaja näkee Israelin hajallaan ”niinkuin lampaat, joilla ei ole paimenta”, ja hänet pannaan vankilaan."
      vi: "Vào năm thứ ba không có chiến tranh, Giô-sa-phát xuống gặp A-háp và đồng ý cùng người đi lên Ra-mốt Ga-la-át. Tại cửa thành Sa-ma-ri, độ bốn trăm tiên tri hứa là sẽ thắng; chỉ một mình Mi-ca-gia thấy Y-sơ-ra-ên bị tản lạc “như bầy chiên không có người chăn”, và bị bỏ tù."
      ro: "În al treilea an fără război, Iosafat coboară la Ahab și se învoiește să urce cu el la Ramot din Galaad. La poarta Samariei, vreo patru sute de profeți făgăduiesc biruința; numai Micaia vede pe Israel risipit ca niște oi fără păstor și este aruncat în temniță."
      bg: "В третата година без война Йосафат слиза при Ахав и се съгласява да тръгне с него срещу Рамот Галаадски. При портата на Самария около четиристотин пророци обещават победа; единствен Михей вижда Израил разпръснат „като овци които нямат овчар“ и е хвърлен в тъмница."
  - place: a2fe63c # Ramoth-gilead
    ref: 1Kgs.22.29-1Kgs.22.36
    note:
      en: "At Ramoth-gilead Ahab goes into the battle disguised; a bow drawn at a venture strikes him between the joints of the harness, and he dies at even in his chariot."
      ru: "У Рамофа Галаадского Ахав идёт в бой переодетым; случайно пущенная стрела ранит его сквозь швы лат, и вечером он умирает в колеснице."
      uk: "Під Рамотом Гілеадським Ахав іде в бій перевдягнений; стріла, пущена навмання, влучає в нього між частинами обладунку, і він помирає ввечері у своїй колісниці."
      es: "En Ramot de Galaad Acab entra en la batalla disfrazado; una flecha lanzada al azar lo hiere entre las junturas de la armadura, y muere al atardecer en su carro."
      pt: "Em Ramote-Gileade, Acabe entra na batalha disfarçado; um arco disparado ao acaso o fere entre as juntas da armadura, e ele morre ao entardecer em seu carro."
      de: "Bei Ramot in Gilead zieht Ahab verkleidet in die Schlacht; ein aufs Geratewohl gespannter Bogen trifft ihn zwischen Panzer und Schurz, und am Abend stirbt er in seinem Wagen."
      fr: "À Ramoth en Galaad, Achab entre dans la bataille déguisé ; un homme tire de son arc au hasard et le frappe entre les jointures de la cuirasse, et il meurt le soir dans son char."
      pl: "Pod Ramot w Gileadzie Achab idzie do bitwy w przebraniu; strzała wypuszczona na los szczęścia trafia go między spojenia pancerza i umiera wieczorem na swoim rydwanie."
      it: "A Ramot di Galaad Acab entra in battaglia travestito; una freccia scoccata a caso lo colpisce tra le giunture della corazza, ed egli muore verso sera sul suo carro."
      nl: "Bij Ramot in Gilead trekt Achab vermomd ten strijde; een op goed geluk afgeschoten pijl treft hem tussen de voegen van het harnas, en 's avonds sterft hij in zijn wagen."
      cs: "U Rámot v Gileadu jde Achab do bitvy přestrojen; šíp vystřelený nazdařbůh ho zasáhne mezi spoje pancíře a on večer umírá na svém voze."
      sv: "Vid Ramot i Gilead går Achav förklädd in i striden; en båge som spänns på måfå träffar honom mellan pansarets fogar, och han dör vid aftontid i sin vagn."
      nb: "Ved Ramot-Gilead går Akab forkledd inn i slaget; en bue som blir spent på måfå, treffer ham mellom skjøtene i brynjen, og han dør mot aftenen i sin vogn."
      tl: "Sa Ramoth-galaad ay pumapasok si Achab sa labanan na nagbabalatkayo; isang panang ipinana sa pagbabakasakali ang tumatama sa kaniya sa pagitan ng mga pagkakasugpong ng sakbat, at namamatay siya sa kaniyang karo pagsapit ng hapon."
      da: "Ved Ramot i Gilead går Akab forklædt i kamp; en bue, der spændes på må og få, rammer ham mellem pansrets sammenføjninger, og han dør om aftenen i sin vogn."
      sr: "Код Рамота Галадског Ахав иде у бој прерушен; лук напет на срећу погађа га међу зглобове оклопа, и он увече умире у својим колима."
      hu: "Rámót-Gileádnál Aháb álruhában megy a csatába; találomra kilőtt nyíl éri a vért illesztéke között, és este meghal a szekerében."
      fi: "Ramot-Gileadissa Ahab lähtee taisteluun valepuvussa; umpimähkään jännitetystä jousesta lentänyt nuoli osuu häneen haarniskan liitosten väliin, ja hän kuolee illalla vaunuissaan."
      vi: "Tại Ra-mốt Ga-la-át, A-háp cải trang ra trận; một mũi tên bắn tình cờ trúng người nơi giáp đầu nối của áo giáp, và đến chiều người chết trong xe mình."
      ro: "La Ramot din Galaad, Ahab intră în luptă deghizat; o săgeată trasă la întâmplare îl lovește între încheieturile platoșei, iar el moare seara în carul său."
      bg: "При Рамот Галаадски Ахав влиза в боя преоблечен; стрела, пусната наслуки, го улучва между сглобките на бронята и той умира вечерта в колесницата си."
  - place: a041bb3 # Samaria
    ref: 1Kgs.22.37-1Kgs.22.40
    note:
      en: "The king is brought to Samaria and buried; the chariot is washed in the pool of Samaria, and the dogs lick up his blood, according to the word of the Lord (1 Kgs 21:19)."
      ru: "Царя привозят в Самарию и хоронят; колесницу обмывают на пруде Самарийском, и псы лижут его кровь, по слову Господа (3 Цар 21:19)."
      uk: "Царя привозять до Самарії й ховають; колісницю миють у самарійському ставку, і пси злизують його кров за словом Господа (1 Цар 21:19)."
      es: "El rey es llevado a Samaria y sepultado; el carro se lava en el estanque de Samaria, y los perros lamen su sangre, conforme a la palabra del Señor (1 R 21:19)."
      pt: "O rei é levado a Samaria e sepultado; o carro é lavado no tanque de Samaria, e os cães lambem o seu sangue, conforme a palavra do Senhor (1Rs 21:19)."
      de: "Der König wird nach Samaria gebracht und begraben; der Wagen wird am Teich von Samaria gewaschen, und die Hunde lecken sein Blut, nach dem Wort des Herrn (1. Kön 21,19)."
      fr: "Le roi est ramené à Samarie et enseveli ; on lave le char à l’étang de Samarie, et les chiens lèchent son sang, selon la parole de l’Éternel (1 R 21:19)."
      pl: "Króla przywożą do Samarii i chowają; rydwan zostaje obmyty przy sadzawce w Samarii, a psy zlizują jego krew, według słowa Pana (1 Krl 21,19)."
      it: "Il re è portato a Samaria e sepolto; il carro è lavato nello stagno di Samaria e i cani leccano il suo sangue, secondo la parola del Signore (1 Re 21,19)."
      nl: "De koning wordt naar Samaria gebracht en begraven; de wagen wordt gewassen bij de vijver van Samaria, en de honden likken zijn bloed op, naar het woord van de HEER (1 Kon. 21:19)."
      cs: "Král je odvezen do Samaří a pohřben; vůz se omývá u samařského rybníka a psi lížou jeho krev podle slova Hospodinova (1 Kr 21,19)."
      sv: "Kungen förs till Samaria och begravs; vagnen sköljs vid Samarias damm, och hundarna slickar upp hans blod, enligt Herrens ord (1 Kung 21:19)."
      nb: "Kongen blir ført til Samaria og gravlagt; vognen blir vasket i dammen i Samaria, og hundene slikker hans blod, etter Herrens ord (1 Kong 21,19)."
      tl: "Dinadala ang hari sa Samaria at inililibing; hinuhugasan ang karo sa tangke ng Samaria, at hinihimuran ng mga aso ang kaniyang dugo, ayon sa salita ng Panginoon (1 Hari 21:19)."
      da: "Kongen bringes til Samaria og begraves; vognen skylles i Samarias dam, og hundene slikker hans blod, efter Herrens ord (1 Kong 21,19)."
      sr: "Цара доносе у Самарију и сахрањују; кола се перу у самаријској бари, а пси лижу његову крв, по речи Господњој (1. Цар 21,19)."
      hu: "A királyt Szamáriába viszik és eltemetik; a szekeret Szamária tavában mossák, és az ebek felnyalják a vérét, az Úr szava szerint (1Kir 21,19)."
      fi: "Kuningas tuodaan Samariaan ja haudataan; vaunut pestään Samarian lammikossa, ja koirat nuolevat hänen verensä Herran sanan mukaan (1. Kun. 21:19)."
      vi: "Vua được đem về Sa-ma-ri và được chôn; xe được rửa tại ao Sa-ma-ri, và chó liếm huyết người, theo lời Đức Giê-hô-va đã phán (1 Các Vua 21:19)."
      ro: "Regele este adus la Samaria și îngropat; carul este spălat la iazul Samariei, iar câinii îi ling sângele, după cuvântul Domnului (1 Regi 21:19)."
      bg: "Царят е откаран в Самария и погребан; колесницата е измита при Самарийския водоем и кучетата лочат кръвта му според словото на Господа (3 Царе 21:19)."
  - place: a15257a # Jerusalem
    ref: 2Chr.19.1-2Chr.19.11
    note:
      en: 'Jehoshaphat returns in peace to Jerusalem; Jehu the son of Hanani rebukes him: "Shouldest thou help the ungodly?" The king sets judges in the fortified cities and in Jerusalem.'
      ru: "Иосафат возвращается с миром в Иерусалим; Ииуй, сын Анании, обличает его: «следовало ли тебе помогать нечестивцу?» Царь ставит судей по укреплённым городам и в Иерусалиме."
      uk: "Йосафат з миром повертається до Єрусалима; Єгу, син Ханані, докоряє йому: «Чи слїд було тобі помагати нечестивцеві?» Цар ставить суддів по укріплених містах і в Єрусалимі."
      es: "Josafat vuelve en paz a Jerusalén; Jehú, hijo de Hanani, lo reprende: «¿Al impío das ayuda, y amas á los que aborrecen á Jehová?» El rey pone jueces en las ciudades fortificadas y en Jerusalén."
      pt: "Josafá volta em paz a Jerusalém; Jeú, filho de Hanani, o repreende: “Você deveria ajudar os ímpios?” O rei estabelece juízes nas cidades fortificadas e em Jerusalém."
      de: "Josaphat kehrt in Frieden nach Jerusalem zurück; Jehu, der Sohn Hananis, tadelt ihn: „Sollst du so dem Gottlosen helfen?“ Der König setzt Richter in den festen Städten und in Jerusalem ein."
      fr: "Josaphat revient en paix à Jérusalem ; Jéhu, fils de Hanani, le reprend : « Doit-on secourir le méchant ? » Le roi établit des juges dans les villes fortes et à Jérusalem."
      pl: "Jozafat wraca w pokoju do Jerozolimy; Jehu, syn Chananiego, gani go: „Izaliś niezbożnemu miał pomagać…” Król ustanawia sędziów w miastach obwarowanych i w Jerozolimie."
      it: "Giosafat torna in pace a Gerusalemme; Ieu, figlio di Canani, lo rimprovera: «Dovevi tu dare aiuto ad un empio e amar quelli che odiano l’Eterno?» Il re stabilisce giudici nelle città fortificate e a Gerusalemme."
      nl: "Josafat keert in vrede terug naar Jeruzalem; Jehu, de zoon van Chanani, berispt hem: “Zoudt gij den goddeloze helpen, en die den HEERE haten, liefhebben?” De koning stelt rechters aan in de versterkte steden en in Jeruzalem."
      cs: "Jozafat se v pokoji vrací do Jeruzaléma; Jehú, syn Chananiho, ho kárá: „Zdaliž jsi bezbožnému měl pomáhati?“ Král ustanovuje soudce v opevněných městech i v Jeruzalémě."
      sv: "Josafat vänder i frid tillbaka till Jerusalem; Jehu, Hananis son, tillrättavisar honom: ”Skall man då hjälpa den ogudaktige?” Kungen sätter domare i de befästa städerna och i Jerusalem."
      nb: "Josjafat vender i fred tilbake til Jerusalem; Jehu, Hananis sønn, refser ham: «Skal en hjelpe den ugudelige?» Kongen setter dommere i de befestede byene og i Jerusalem."
      tl: "Bumabalik si Josaphat nang payapa sa Jerusalem; sinasaway siya ni Jehu na anak ni Hanani: “Tutulungan mo ba ang mga masama?” Naglalagay ang hari ng mga hukom sa mga bayang nakukutaan at sa Jerusalem."
      da: "Josafat vender i fred tilbage til Jerusalem; Jehu, Hananis søn, irettesætter ham: »Skal du hjælpe den ugudelige?« Kongen sætter dommere i de befæstede byer og i Jerusalem."
      sr: "Јосафат се у миру враћа у Јерусалим; Јуј син Ананијев кори га: „Безбожнику ли помажеш?“ Цар поставља судије по утврђеним градовима и у Јерусалиму."
      hu: "Jósafát békességben tér vissza Jeruzsálembe; Jéhu, Hanáni fia megfeddi: „Avagy az istentelennek kellett-é segítségül lenned”? A király bírákat rendel az erődített városokba és Jeruzsálembe."
      fi: "Josafat palaa rauhassa Jerusalemiin; Jehu, Hananin poika, nuhtelee häntä: ”Oliko sinun autettava jumalatonta…” Kuningas asettaa tuomareita varustettuihin kaupunkeihin ja Jerusalemiin."
      vi: "Giô-sa-phát bình an trở về Giê-ru-sa-lem; Giê-hu, con trai Ha-na-ni, quở trách người: “Vua há giúp đỡ kẻ hung ác…” Vua đặt các quan xét trong những thành có đồn lũy và tại Giê-ru-sa-lem."
      ro: "Iosafat se întoarce în pace la Ierusalim; Iehu, fiul lui Hanani, îl mustră: „cum ajuți păcătosului…?” Regele pune judecători în cetățile întărite și în Ierusalim."
      bg: "Йосафат се връща с мир в Йерусалим; Йеху, синът на Ханани, го изобличава: „На нечестивия ли помагаш?“ Царят поставя съдии в укрепените градове и в Йерусалим."
  - place: a51df0e # Engedi
    ref: 2Chr.20.1-2Chr.20.19
    note:
      en: 'Moab, Ammon and mount Seir come against Judah and stand at Hazazon-tamar, which is En-gedi. Jehoshaphat proclaims a fast and prays, "neither know we what to do: but our eyes are upon thee"; Jahaziel answers, "the battle is not yours, but God''s".'
      ru: "Моавитяне, Аммонитяне и жители горы Сеира идут на Иудею и стоят у Ен-Гадди, в Хацацон-Фамаре. Иосафат объявляет пост и молится: «мы не знаем, что делать, но к Тебе очи наши!»; Иозиил отвечает: «не ваша война, а Божия»."
      uk: "Моав, Аммон і гора Сеір виступають проти Юди й стають у Хацацон-Тамарі, тобто в Ен-Геді. Йосафат оголошує піст і молиться: «ми не відаємо, що робити, а тілько до тебе очі наші»; Яхазіїл відповідає: «не ваша се війна, а Божа»."
      es: "Moab, Amón y el Monte Seir marchan contra Judá y se detienen en Hazezon-tamar, que es Engadi. Josafat proclama un ayuno y ora: «no sabemos lo que hemos de hacer, mas á ti volvemos nuestros ojos»; Jahaziel responde: «no es vuestra la guerra, sino de Dios»."
      pt: "Moabe, Amom e o monte Seir marcham contra Judá e param em Hazazom-Tamar, que é En-Gedi. Josafá proclama um jejum e ora: “Não sabemos o que fazer, mas os nossos olhos estão postos em ti”; Jaaziel responde: “a batalha não é de vocês, mas de Deus”."
      de: "Moab, Ammon und das Gebirge Seir ziehen gegen Juda und lagern bei Hazezon-Tamar, das ist En-Gedi. Josaphat ruft ein Fasten aus und betet: „Wir wissen nicht, was wir tun sollen; sondern unsre Augen sehen nach dir“; Jahasiël antwortet: „ihr streitet nicht, sondern Gott“."
      fr: "Moab, Ammon et le Mont Séir marchent contre Juda et sont à Hatsatson-Thamar, qui est En-Guédi. Josaphat proclame un jeûne et prie : « nous ne savons que faire, mais nos yeux sont sur toi » ; Jachaziel répond : « ce ne sera pas vous qui combattrez, ce sera Dieu »."
      pl: "Moab, Ammon i góra Seir wyruszają przeciw Judzie i zatrzymują się w Chasason-Tamar, czyli w En-Gedi. Jozafat ogłasza post i modli się: „nie wiemy, co czynić mamy, tylko ku tobie obracamy oczy nasze”; Jachaziel odpowiada: „nie wasza jest walka, ale Boża”."
      it: "Moab, Ammon e il monte Seir vengono contro Giuda e si accampano a Casason-Tamar, cioè En-Ghedi. Giosafat proclama un digiuno e prega: «non sappiamo che fare, ma gli occhi nostri sono su te»; Iacaziel risponde: «questa non è battaglia vostra, ma di Dio»."
      nl: "Moab, Ammon en het gebergte Seïr trekken tegen Juda op en staan bij Hazezon-Tamar, dat is En-Gedi. Josafat roept een vasten uit en bidt: “wij weten niet, wat wij doen zullen; maar onze ogen zijn op U”; Jahaziël antwoordt: “de strijd is niet uwe, maar Gods”."
      cs: "Moáb, Amón a hora Seír táhnou proti Judovi a staví se v Chacacon-tamar, což je Én-gedi. Jozafat vyhlašuje půst a modlí se: „aniž my víme, co bychom činiti měli, toliko na tě patří oči naše“; Jachaziel odpovídá: „ne váš bude boj, ale Boží“."
      sv: "Moab, Ammon och Seirs berg drar mot Juda och slår läger vid Hasason-Tamar, det vill säga En-Gedi. Josafat utlyser fasta och ber: ”själva veta vi icke vad vi skola göra, utan till dig se våra ögon”; Jachasiel svarar: ”striden är icke eder, utan Guds”."
      nb: "Moab, Ammon og Se'ir-fjellet drar mot Juda og står ved Haseson-Tamar, det er En-Gedi. Josjafat utroper en faste og ber: «vi vet ikke hvad vi skal gjøre; men til dig er våre øine vendt»; Jahasiel svarer: «dette er ikke eders krig, men Guds»."
      tl: "Ang Moab, Ammon at bundok ng Seir ay sumasalakay sa Juda at nakahimpil sa Hasason-tamar, na siyang En-gedi. Nagpapahayag si Josaphat ng ayuno at nananalangin, “ni hindi man nalalaman namin kung anong marapat gawin; nguni't ang aming mga mata ay nasa iyo”; sumasagot si Jahaziel, “ang pakikipagbaka ay hindi inyo, kundi sa Dios”."
      da: "Moab, Ammon og Se'irs bjerge drager imod Juda og slår lejr ved Hasason-Tamar, det vil sige En-Gedi. Josafat udråber en faste og beder: »vi vide ikke, hvad vi skulle gøre; men vore Øjne ere vendte til dig«; Jahaziel svarer: »Krigen er ikke eders, men Guds«."
      sr: "Моав, Амон и гора Сир дижу се на Јуду и стају у Асасон-Тамару, а то је Енгад. Јосафат оглашава пост и моли се: „нити знамо шта бисмо чинили, него су очи наше упрте у Те“; Јазило одговара: „није ваш рат него Божји“."
      hu: "Moáb, Ammon és a Széir-hegy lakói Júda ellen jönnek, és Hacecon-Támárnál, azaz Én-Gedinél állnak. Jósafát bőjtöt hirdet és imádkozik: „Nem tudjuk, mit cselekedjünk, hanem csak te reád néznek a mi szemeink”; Jahaziél így felel: „nem ti harczoltok velök, hanem az Isten”."
      fi: "Moab, Ammon ja Seirin vuoristo hyökkäävät Juudaa vastaan ja asettuvat Hasason-Tamariin, se on En-Gedi. Josafat kuuluttaa paaston ja rukoilee: ”emmekä itse tiedä mitä tehdä, vaan sinuun meidän silmämme katsovat”; Jahasiel vastaa: ”sota ei ole teidän, vaan Jumalan”."
      vi: "Mô-áp, Am-môn và núi Sê-i-rơ kéo đến đánh Giu-đa và đóng tại Hát-sát-son-Tha-ma, tức là Ên-ghê-đi. Giô-sa-phát truyền cấm ăn và cầu nguyện: “chúng tôi cũng không biết điều gì mình phải làm; nhưng con mắt chúng tôi ngửa trông Chúa!”; Gia-ha-xi-ên đáp: “trận giặc này chẳng phải của các ngươi đâu, bèn là của Đức Chúa Trời”."
      ro: "Moab, Amon și muntele Seir vin împotriva lui Iuda și se așază la Hațațon-Tamar, adică En-Ghedi. Iosafat vestește un post și se roagă, mărturisind că nu știu ce să facă, dar ochii lor sunt îndreptați spre Domnul; Iahaziel răspunde că lupta nu este a lor, ci a lui Dumnezeu."
      bg: "Моав, Амон и планината Сеир настъпват срещу Юда и застават при Хацацон-Тамар, който е Ен-Гади. Йосафат обявява пост и се моли: „не знаем що да правим; но към тебе са очите ни“; Яхазиил отговаря: „боят не е ваш но Божий“."
  - place: a2e3aa0 # Tekoa
    ref: 2Chr.20.20-2Chr.20.25
    note:
      en: 'Early in the morning Judah goes out to the wilderness of Tekoa with singers before the army, "Praise the Lord; for his mercy endureth for ever"; the enemies destroy one another, and the spoil takes three days to gather.'
      ru: "Рано утром Иудеи выходят в пустыню Фекойскую с певцами впереди войска: «славьте Господа, ибо вовек милость Его!»; враги истребляют друг друга, и добычу собирают три дня."
      uk: "Рано-вранці Юда виходить до пустелі Текоя, а перед військом ідуть співці: «хвалїте Господа, бо віковічна милость його!»; вороги винищують одне одного, і здобич збирають три дні."
      es: "De mañana Judá sale al desierto de Tecoa con cantores delante del ejército: «Glorificad á Jehová, porque su misericordia es para siempre»; los enemigos se destruyen unos a otros, y el despojo tarda tres días en recogerse."
      pt: "De manhã cedo, Judá sai para o deserto de Tecoa com cantores à frente do exército: “Deem graças ao SENHOR, pois a sua misericórdia dura para sempre”; os inimigos destroem uns aos outros, e o despojo leva três dias para ser recolhido."
      de: "Früh am Morgen zieht Juda zur Wüste Tekoa hinaus, Sänger vor dem Heer, die sprechen: „Danket dem HERRN; denn sein Barmherzigkeit währet ewiglich“; die Feinde vernichten einander, und das Einsammeln der Beute dauert drei Tage."
      fr: "De bon matin, Juda sort vers le désert de Tekoa, des chantres marchant devant l’armée : « Louez l’Éternel, car sa miséricorde dure à toujours ! » ; les ennemis s’entre-détruisent, et il faut trois jours pour recueillir le butin."
      pl: "Wczesnym rankiem Juda wychodzi na pustynię Tekoa, a przed wojskiem idą śpiewacy: „Wysławiajcie Pana, albowiem na wieki miłosierdzie jego”; wrogowie niszczą się nawzajem, a zebranie łupów trwa trzy dni."
      it: "La mattina presto Giuda esce verso il deserto di Tekoa con i cantori davanti all’esercito: «Celebrate l’Eterno, perché la sua benignità dura in perpetuo»; i nemici si distruggono a vicenda, e per raccogliere il bottino occorrono tre giorni."
      nl: "Vroeg in de morgen trekt Juda uit naar de woestijn van Tekoa, met zangers voor het leger uit: “Looft den HEERE, want Zijn goedertierenheid is tot in eeuwigheid!”; de vijanden vernietigen elkaar, en het kost drie dagen om de buit bijeen te brengen."
      cs: "Za časného jitra vychází Juda na poušť Tekoa a před vojskem jdou zpěváci: „Oslavujte Hospodina, nebo na věky milosrdenství jeho“; nepřátelé se navzájem hubí a sbírání kořisti trvá tři dny."
      sv: "Tidigt på morgonen drar Juda ut mot Tekoas öken med sångare framför hären: ”Tacken HERREN, ty hans nåd varar evinnerligen”; fienderna förgör varandra, och det tar tre dagar att samla in bytet."
      nb: "Tidlig om morgenen drar Juda ut til Tekoa-ørkenen med sangere foran hæren: «Lov Herren, for hans miskunnhet varer evindelig!» Fiendene tilintetgjør hverandre, og det tar tre dager å samle byttet."
      tl: "Maaga sa kinaumagahan ay lumalabas ang Juda patungo sa ilang ng Tecoa na may mga mang-aawit sa unahan ng hukbo, “Mangagpasalamat kayo sa Panginoon; sapagka't ang kaniyang kaawaan ay magpakailan man”; nililipol ng mga kaaway ang isa't isa, at tatlong araw ang inaabot ng pagtitipon ng samsam."
      da: "Tidligt om morgenen drager Juda ud til Tekoa-ørkenen med sangere foran hæren, der siger: »Lover Herren, thi hans Miskundhed er evindelig«; fjenderne ødelægger hinanden, og det tager tre dage at samle byttet."
      sr: "Рано ујутру Јуда излази у пустињу текујску, а певачи иду пред војском: „Хвалите Господа, јер је довека милост Његова“; непријатељи се међусобно истребљују, и плен се купи три дана."
      hu: "Júda kora reggel kivonul a tekóai pusztára, a sereg előtt énekesekkel, akik ezt mondják: „Tiszteljétek az Urat, mert örökkévaló az ő irgalmassága”; az ellenségek kiirtják egymást, a zsákmány összegyűjtése pedig három napig tart."
      fi: "Varhain aamulla Juuda lähtee Tekoan erämaahan laulajat sotajoukon edellä: ”Kiittäkää Herraa, sillä hänen armonsa pysyy iankaikkisesti”; viholliset tuhoavat toisensa, ja saaliin kokoamiseen menee kolme päivää."
      vi: "Sáng sớm, Giu-đa ra đồng vắng Thê-cô-a, có những người ca xướng đi trước đạo binh: “Hãy ngợi khen Đức Giê-hô-va, vì sự thương xót Ngài hằng có đời đời”; quân thù tự giết lẫn nhau, và phải mất ba ngày để thu của cướp."
      ro: "Dis-de-dimineață, Iuda iese spre pustiul Tecoa, cu cântăreți înaintea oștirii care Îl laudă pe Domnul, căci îndurarea Lui ține în veac; dușmanii se nimicesc unii pe alții, iar prada se strânge în trei zile."
      bg: "Рано сутринта Юда излиза към пустинята Текоя с певци пред войската: „Славословете Господа, защото милостта му е въ век“; враговете се избиват един друг, а плячката се събира три дни."
  - place: a71f834 # Valley of Beracah
    ref: 2Chr.20.26-2Chr.20.30
    note:
      en: "On the fourth day they bless the Lord in a valley called from then the valley of Berachah, Blessing, and return to Jerusalem with psalteries, harps and trumpets."
      ru: "В четвёртый день они благословляют Господа в долине, которую с тех пор зовут долиною благословения, и возвращаются в Иерусалим с псалтирями, цитрами и трубами."
      uk: "На четвертий день вони благословляють Господа в долині, яку відтоді називають долиною Берахи, тобто благословення, і повертаються до Єрусалима з псалтирями, арфами й сурмами."
      es: "Al cuarto día bendicen al Señor en un valle que desde entonces se llama valle de Beraca, es decir, Bendición, y vuelven a Jerusalén con salterios, arpas y trompetas."
      pt: "No quarto dia bendizem o Senhor num vale chamado desde então Vale de Beraca, Bênção, e voltam a Jerusalém com saltérios, harpas e trombetas."
      de: "Am vierten Tag loben sie den Herrn in einem Tal, das seither Tal Beracha, Lob, heißt, und kehren mit Psaltern, Harfen und Trompeten nach Jerusalem zurück."
      fr: "Le quatrième jour, ils s’assemblent et bénissent l’Éternel dans une vallée qui s’appelle depuis lors vallée de Beraca, c’est-à-dire de la bénédiction, puis rentrent à Jérusalem avec des luths, des harpes et des trompettes."
      pl: "Czwartego dnia błogosławią Pana w dolinie, którą od tego czasu nazwano doliną Beraka, czyli Błogosławieństwa, i wracają do Jerozolimy z harfami, cytrami i trąbami."
      it: "Il quarto giorno benedicono il Signore in una valle che da allora si chiama Valle di Benedizione (Beracà), e tornano a Gerusalemme con saltèri, arpe e trombe."
      nl: "Op de vierde dag loven zij de HEER in een dal dat sindsdien het dal van Beracha, Zegen, heet, en keren terug naar Jeruzalem met luiten, harpen en trompetten."
      cs: "Čtvrtého dne dobrořečí Hospodinu v údolí, které se od té doby nazývá údolí Beracha, Dobrořečení, a vracejí se do Jeruzaléma s loutnami, harfami a trubkami."
      sv: "På fjärde dagen lovar de Herren i en dal som sedan dess kallas Berakadalen, Välsignelsens dal, och återvänder till Jerusalem med psaltare, harpor och trumpeter."
      nb: "På den fjerde dagen lover de Herren i en dal som siden kalles Beraka-dalen, Lovprisningens dal, og vender tilbake til Jerusalem med harper, siterer og trompeter."
      tl: "Sa ikaapat na araw ay pinupuri nila ang Panginoon sa isang libis na mula noon ay tinatawag na Libis ng Baracah, Pagpapala, at bumabalik sa Jerusalem na may mga salterio, mga alpa at mga pakakak."
      da: "På den fjerde dag velsigner de Herren i en dal, der siden kaldes Berakas dal, Velsignelsens dal, og vender tilbage til Jerusalem med psaltere, harper og trompeter."
      sr: "Четвртог дана благосиљају Господа у једној долини, која се од тада зове долина Благослова, и враћају се у Јерусалим са псалтирима, гуслама и трубама."
      hu: "A negyedik napon egy völgyben áldják az Urat, amelyet attól fogva Beraka-völgynek, azaz Áldás völgyének neveznek, majd lantokkal, hárfákkal és trombitákkal térnek vissza Jeruzsálembe."
      fi: "Neljäntenä päivänä he kiittävät Herraa laaksossa, jota siitä lähtien kutsutaan Beraka-laaksoksi, Siunauksen laaksoksi, ja palaavat Jerusalemiin harppujen, kanteleiden ja torvien soidessa."
      vi: "Đến ngày thứ tư, họ ngợi khen Đức Giê-hô-va trong một thung lũng từ đó gọi là trũng Bê-ra-ca, nghĩa là Phước lành, rồi trở về Giê-ru-sa-lem với đàn cầm, đàn sắt và kèn."
      ro: "În a patra zi Îl binecuvântează pe Domnul într-o vale numită de atunci Valea Beraca, adică a Binecuvântării, și se întorc la Ierusalim cu lăute, harfe și trâmbițe."
      bg: "На четвъртия ден те благославят Господа в една долина, наречена оттогава долината Бераха, „Благословение“, и се връщат в Йерусалим с псалтири, арфи и тръби."
  - place: a8e53d5 # Ezion-geber
    ref: 2Chr.20.35-2Chr.20.37
    note:
      en: "At the last Jehoshaphat joins Ahaziah, Ahab's son, to build ships at Ezion-geber for Tarshish; Eliezer of Mareshah prophesies against the alliance, and the ships are broken."
      ru: "Под конец Иосафат вступает в союз с Охозией, сыном Ахава, чтобы строить в Ецион-Гавере корабли для Фарсиса; Елиезер из Мареши пророчествует против союза, и корабли разбиваются."
      uk: "Наприкінці Йосафат об’єднується з Охозією, сином Ахава, щоб збудувати кораблі в Еціон-Гевері для Тарсису; Еліезер з Мареші пророкує проти цього союзу, і кораблі розбиваються."
      es: "Al final Josafat se une a Ocozías, hijo de Acab, para construir naves en Ezión-geber con destino a Tarsis; Eliezer de Maresa profetiza contra la alianza, y las naves se destrozan."
      pt: "No fim, Josafá se associa a Acazias, filho de Acabe, para construir navios em Eziom-Geber com destino a Társis; Eliézer, de Maressa, profetiza contra a aliança, e os navios se quebram."
      de: "Zuletzt tut sich Josaphat mit Ahasja, Ahabs Sohn, zusammen, um in Ezjon-Geber Schiffe für Tarsis zu bauen; Elieser von Maresa weissagt gegen das Bündnis, und die Schiffe zerbrechen."
      fr: "À la fin, Josaphat s’associe à Achazia, fils d’Achab, pour construire à Etsjon-Guéber des navires destinés à Tarsis ; Éliézer, de Maréscha, prophétise contre cette alliance, et les navires sont brisés."
      pl: "Na koniec Jozafat łączy się z Ochozjaszem, synem Achaba, aby zbudować w Esjon-Geber okręty do Tarszisz; Eliezer z Mareszy prorokuje przeciw temu sojuszowi i okręty ulegają rozbiciu."
      it: "Alla fine Giosafat si associa ad Acazia, figlio di Acab, per costruire a Ezion-Gheber navi destinate a Tarsis; Eliezer di Maresa profetizza contro l’alleanza, e le navi si infrangono."
      nl: "Ten slotte slaat Josafat de handen ineen met Achazia, de zoon van Achab, om te Ezeon-Geber schepen voor Tarsis te bouwen; Eliëzer van Maresa profeteert tegen dit bondgenootschap, en de schepen worden verbrijzeld."
      cs: "Nakonec se Jozafat spojuje s Achazjášem, Achabovým synem, aby v Ecjon-geberu postavili lodi do Taršíše; Eliezer z Mareši prorokuje proti tomuto spojenectví a lodi se rozbijí."
      sv: "Till sist ansluter sig Josafat till Achasja, Achavs son, för att bygga skepp i Esjon-Geber till Tarshish; Elieser från Maresha profeterar mot förbundet, och skeppen går i kras."
      nb: "Til slutt slår Josjafat seg sammen med Akabs sønn Ahasja for å bygge skip i Esjon-Geber til Tarsis; Elieser fra Maresja profeterer mot forbundet, og skipene blir knust."
      tl: "Sa wakas ay nakikipisan si Josaphat kay Ochozias, anak ni Achab, upang gumawa ng mga sasakyang dagat sa Esion-geber patungong Tharsis; nanghuhula si Eliezer ng Maresa laban sa pakikipagkasundo, at nababasag ang mga sasakyan."
      da: "Til sidst slår Josafat sig sammen med Akazja, Akabs søn, om at bygge skibe i Esjon-Geber til Tarsis; Eliezer fra Maresja profeterer imod forbundet, og skibene går i stykker."
      sr: "На крају Јосафат се удружује с Охозијом, Ахавовим сином, да граде лађе у Есион-Гаверу за Тарсис; Елијезер из Марисе пророкује против тог савеза, и лађе се разбијају."
      hu: "Végül Jósafát társul Ahazjával, Aháb fiával, hogy hajókat építsenek Ecjón-Gébernél Tarsisba; a maresai Eliézer az összefogás ellen prófétál, és a hajók összetörnek."
      fi: "Lopuksi Josafat liittyy Ahabin pojan Ahasjan kanssa rakentamaan laivoja Esjon-Geberiin Tarsisiin lähtemään; Maresan Elieser ennustaa liittoa vastaan, ja laivat särkyvät."
      vi: "Cuối cùng, Giô-sa-phát liên kết với A-cha-xia, con của A-háp, để đóng tàu tại Ê-xi-ôn-Ghê-be đi Ta-rê-si; Ê-li-ê-xe ở Ma-rê-sa nói tiên tri chống lại liên minh ấy, và các tàu bị đắm."
      ro: "La urmă, Iosafat se unește cu Ahazia, fiul lui Ahab, ca să construiască la Ețion-Gheber corăbii pentru Tarsis; Eliezer din Mareșa prorocește împotriva alianței, iar corăbiile se sfărâmă."
      bg: "Накрая Йосафат се съюзява с Охозия, сина на Ахав, за да строят кораби в Ецион-Гавер за Тарсис; Елиезер от Мареша пророкува против съюза и корабите се разбиват."
