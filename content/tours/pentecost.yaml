      nl: "Asia, de provincie van Efeze, waar Paulus drie jaar zal onderwijzen en waar de zeven gemeenten van Openbaring zullen staan."
      cs: "Asie, provincie s Efezem, kde bude Pavel tři roky učit a kde budou stát sedm církví Zjevení."
      sv: "Asien, Efesos’ provins, där Paulus ska undervisa i tre år och där Uppenbarelsebokens sju församlingar ska ligga."
      nb: "Asia, provinsen med Efesos, hvor Paulus skal undervise i tre år og Johannes' Åpenbarings sju menigheter skal stå."
      tl: "Asia, ang lalawigan ng Efeso, kung saan magtuturo si Pablo nang tatlong taon at kung saan itatayo ang pitong iglesia ng Apocalipsis."
  - place: ab8ae56 # Phrygia
