      ru: "Египет с большой иудейской общиной Александрии, города Аполлоса (Деян 18:24)."
      uk: "Єгипет, з великою юдейською громадою Александрії, містом Аполлоса (Дії 18:24)."
      es: "Egipto, con la gran comunidad judía de Alejandría, la ciudad de Apolos (Hch 18:24)."
      pt: "O Egito, com a grande comunidade judaica de Alexandria, a cidade de Apolo (At 18:24)."
      de: "Ägypten, mit der großen jüdischen Gemeinde von Alexandria, der Stadt des Apollos (Apg 18,24)."
      fr: "L’Égypte, avec la grande communauté juive d’Alexandrie, la ville d’Apollos (Ac 18:24)."
      pl: "Egipt, z wielką wspólnotą żydowską Aleksandrii, miastem Apollosa (Dz 18,24)."
