      cs: "Egypt s velkou židovskou obcí v Alexandrii, městě Apollově (Sk 18,24)."
      sv: "Egypten, med den stora judiska församlingen i Alexandria, Apollos’ stad (Apg 18:24)."
      nb: "Egypt, med Aleksandrias store jødiske samfunn, Apollos' by (Apg 18,24)."
      tl: "Egipto, na may dakilang pamayanang Judio ng Alejandria, ang lungsod ni Apolos (Gawa 18:24)."
  - place: a81cdb5 # Cyrene
    ref: Acts.2.10
    note:
      en: '"The parts of Libya about Cyrene": Simon who carried the cross was of Cyrene, and men of Cyprus and Cyrene will preach the Lord Jesus to the Greeks at Antioch (Acts 11:20).'
      ru: "Из «частей Ливии, прилежащих к Киринее»: из Киринеи был Симон, нёсший крест, а Кипряне и Киринейцы будут благовествовать Еллинам в Антиохии (Деян 11:20)."
      uk: "«В сторонах Ливийських, що коло Киринеї»: Симон, який ніс хрест, був з Кирени, а мужі з Кіпру й Кирени проповідуватимуть Господа Ісуса еллінам в Антіохії (Дії 11:20)."
      es: "«Las partes de Africa que está de la otra parte de Cirene»: Simón, el que llevó la cruz, era de Cirene, y hombres de Chipre y de Cirene anunciarán al Señor Jesús a los griegos en Antioquía (Hch 11:20)."
      pt: "“As partes da Líbia próximas a Cirene”: Simão, que carregou a cruz, era de Cirene, e homens de Chipre e de Cirene pregarão o Senhor Jesus aos gregos em Antioquia (At 11:20)."
      de: "„an den Enden von Lybien bei Kyrene“: Simon, der das Kreuz trug, war aus Kyrene, und Männer aus Zypern und Kyrene werden in Antiochia den Griechen den Herrn Jesus predigen (Apg 11,20)."
      fr: "« Le territoire de la Libye voisine de Cyrène » : Simon qui porta la croix était de Cyrène, et des hommes de Chypre et de Cyrène annonceront le Seigneur Jésus aux Grecs à Antioche (Ac 11:20)."
      pl: "„w stronach Libii, która jest podle Cyreny”: Szymon, który niósł krzyż, pochodził z Cyreny, a mężowie z Cypru i Cyreny będą głosić Pana Jezusa Grekom w Antiochii (Dz 11,20)."
      it: "«Le parti della Libia Cirenaica»: Simone che portò la croce era di Cirene, e uomini di Cipro e di Cirene annunceranno il Signore Gesù ai Greci ad Antiochia (At 11,20)."
      nl: "“De delen van Libië, hetwelk bij Cyrene ligt”: Simon, die het kruis droeg, was van Cyrene, en mannen uit Cyprus en Cyrene zullen de Heere Jezus aan de Grieken te Antiochië verkondigen (Hand. 11:20)."
      cs: "„v krajinách Libye, kteráž jest vedle Cyrénu“: Šimon, který nesl kříž, byl z Kyrény a muži z Kypru a Kyrény budou v Antiochii hlásat Pána Ježíše Řekům (Sk 11,20)."
      sv: "”Libyens bygder, åt Cyrene till”: Simon som bar korset var från Kyrene, och män från Cypern och Kyrene ska förkunna Herren Jesus för grekerna i Antiochia (Apg 11:20)."
      nb: "«landskapene i Libya ved Kyrene»: Simon som bar korset, var fra Kyrene, og menn fra Kypros og Kyrene skal forkynne Herren Jesus for grekerne i Antiokia (Apg 11,20)."
      tl: "“Mga sakop ng Libia na karatig ng Cirene”: si Simon na nagpasan ng krus ay taga-Cirene, at ang mga lalaking taga-Chipre at Cirene ay mangangaral ng Panginoong Jesus sa mga Griego sa Antioquia (Gawa 11:20)."
  - place: afc8e7a # Rome
    ref: Acts.2.10
    note:
      en: '"Strangers of Rome, Jews and proselytes", the westernmost of the list; Cretans and Arabians close it.'
      ru: "«пришедшие из Рима, Иудеи и прозелиты», самые западные в списке; замыкают его критяне и аравитяне."
      uk: "«Захожі Римляне, й Жиди, і нововірцї» — найзахідніші в переліку; критяни й араби замикають його."
      es: "«Romanos extranjeros, tanto Judíos como convertidos», los más occidentales de la lista; cretenses y árabes la cierran."
      pt: "“Visitantes de Roma, tanto judeus como prosélitos”, os mais ocidentais da lista; cretenses e árabes a encerram."
      de: "„Ausländer von Rom, Juden und Judengenossen“, die westlichsten der Liste; Kreter und Araber beschließen sie."
      fr: "« Ceux qui sont venus de Rome, Juifs et prosélytes », les plus occidentaux de la liste ; les Crétois et les Arabes la ferment."
      pl: "„przychodniowie Rzymscy; Żydowie, i nowonawróceni”, najdalej na zachód na liście; Kreteńczycy i Arabowie ją zamykają."
      it: "«Avventizi Romani, tanto Giudei che proseliti», l’estremo occidente dell’elenco; Cretesi e Arabi lo chiudono."
      nl: "“Uitlandse Romeinen, beiden Joden en Jodengenoten”, het westelijkste van de lijst; Kretenzen en Arabieren sluiten die af."
      cs: "„hosté Římané, Židé, i vnově na víru obrácení“, nejzápadnější z výčtu; Kretští a Arabští jej uzavírají."
      sv: "”hitflyttade främlingar från Rom”, judar och proselyter, den västligaste i uppräkningen; kretenser och araber avslutar den."
      nb: "«vi tilreisende fra Rom, både jøder og tilhengere av jødenes tro», det vestligste i listen; kretere og arabere avslutter den."
      tl: "“Mga nakikipamayang galing sa Roma, mga Judio, at gayon din ang mga naging Judio”, ang pinakakanluran sa talaan; sinasarhan ito ng mga taga-Creta at mga Arabe."
  - place: a15257a # Jerusalem
    ref: Acts.2.14-Acts.2.47
    note:
      en: 'Peter stands up with the eleven: this is what Joel foretold, and Jesus whom you crucified God has raised up. About three thousand are baptised, "and the Lord added to the church daily such as should be saved".'
      ru: "Пётр встаёт с одиннадцатью: это то, о чём говорил Иоиль, и Иисуса, Которого вы распяли, Бог воскресил. Крестятся около трёх тысяч, «Господь же ежедневно прилагал спасаемых к Церкви»."
      uk: "Петро встає з одинадцятьма: це те, що провістив Йоїл, і Ісуса, якого ви розіп’яли, Бог воскресив. Близько трьох тисяч приймають хрещення, «Господь же прибавляв спасенників у церкву що-дня»."
      es: "Pedro se pone en pie con los once: esto es lo que anunció Joel, y a Jesús, a quien vosotros crucificasteis, Dios lo ha resucitado. Unos tres mil son bautizados, «y el Señor añadía cada día á la iglesia los que habían de ser salvos»."
      pt: "Pedro se levanta com os onze: isto é o que Joel predisse, e Jesus, a quem vocês crucificaram, Deus ressuscitou. Cerca de três mil são batizados, “e o Senhor acrescentava à igreja, dia a dia, os que iam sendo salvos”."
      de: "Petrus tritt mit den Elfen auf: Das ist, was Joel vorhergesagt hat, und Jesus, den ihr gekreuzigt habt, hat Gott auferweckt. Etwa dreitausend lassen sich taufen, „Der HERR aber tat hinzu täglich, die da selig wurden, zu der Gemeinde“."
      fr: "Pierre se lève avec les onze : c’est ce que Joël avait annoncé, et Jésus que vous avez crucifié, Dieu l’a ressuscité. Environ trois mille personnes sont baptisées, et « le Seigneur ajoutait chaque jour à l’Église ceux qui étaient sauvés »."
      pl: "Piotr powstaje z jedenastoma: to jest to, co zapowiedział Joel, a Jezusa, którego ukrzyżowaliście, Bóg wskrzesił. Około trzech tysięcy zostaje ochrzczonych, „a Pan przydawał zborowi na każdy dzień tych, którzy mieli być zbawieni”."
      it: "Pietro si leva in piedi con gli undici: questo è ciò che Gioele aveva predetto, e Dio ha risuscitato Gesù, che voi avete crocifisso. Circa tremila sono battezzati, «e il Signore aggiungeva ogni giorno alla loro comunità quelli che erano sulla via della salvazione»."
      nl: "Petrus staat op met de elf: dit is wat Joël heeft voorzegd, en Jezus, die gij gekruisigd hebt, heeft God opgewekt. Ongeveer drieduizend worden gedoopt, “En de Heere deed dagelijks tot de Gemeente, die zalig werden”."
      cs: "Petr povstává s jedenácti: to je, co předpověděl Joel, a Ježíše, kterého jste ukřižovali, Bůh vzkřísil. Pokřtěno je asi tři tisíce, „Pán pak přidával církvi na každý den těch, kteříž by spaseni byli“."
      sv: "Petrus står upp med de elva: detta är vad Joel förutsade, och Jesus som ni korsfäste har Gud uppväckt. Omkring tre tusen döps, ”och Herren ökade församlingen, dag efter dag, med dem som läto sig frälsas”."
      nb: "Peter står frem sammen med de elleve: dette er det Joel forutsa, og Jesus, som dere korsfestet, har Gud oppreist. Omkring tre tusen blir døpt, og «Herren la hver dag dem som lot sig frelse, til menigheten»."
      tl: "Tumatayo si Pedro kasama ang labing-isa: ito ang inihula ni Joel, at si Jesus na ipinako ninyo sa krus ay muling binuhay ng Dios. Mga tatlong libo ang nabautismuhan, at “idinaragdag sa kanila ng Panginoon araw-araw yaong nangaliligtas”."
