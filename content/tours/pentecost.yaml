# Pentecost, Acts 2: the lands the pilgrims in Jerusalem came from (2:9-11), in the order
# of the text, between the outpouring (2:1-13) and Peter's word and the three thousand
# (2:14-47). Parthia, Media, Elam, Crete and Arabia have no place tagged for these verses
# and are told at the stops beside them; Judea, the host land, is left out. The tour's year (AD 30) is
# the conventional point of the crucifixion and of this Pentecost (AD 33 is also held).
# Peter's ministry from this day on is in his own tour.
id: pentecost
title:
  en: "Pentecost: where the pilgrims came from"
  ru: "Пятидесятница: откуда пришли паломники"
  uk: "П’ятдесятниця: звідки прийшли прочани"
  es: "Pentecostés: de dónde venían los peregrinos"
  pt: "Pentecostes: de onde vieram os peregrinos"
  de: "Pfingsten: Woher die Pilger kamen"
  fr: "La Pentecôte : d’où venaient les pèlerins"
  pl: "Pięćdziesiątnica: skąd przybyli pielgrzymi"
  it: "Pentecoste: da dove venivano i pellegrini"
  nl: "Pinksteren: waar de pelgrims vandaan kwamen"
  cs: "Letnice: odkud přišli poutníci"
  sv: "Pingst: varifrån pilgrimerna kom"
  nb: "Pinse: hvor pilegrimene kom fra"
  tl: "Pentecostes: saan nanggaling ang mga peregrino"
  da: "Pinse: hvor pilgrimmene kom fra"
  sr: "Педесетница: одакле су дошли ходочасници"
  hu: "Pünkösd: honnan jöttek a zarándokok"
  fi: "Helluntai: mistä pyhiinvaeltajat tulivat"
  vi: "Lễ Ngũ Tuần: các khách hành hương đến từ đâu"
  ro: "Cincizecimea: de unde veneau pelerinii"
  bg: "Петдесетница: откъде дойдоха поклонниците"
year: "AD 30"
# The lands of a list, not a journey: no time on foot.
walked: false
approximate: true
stops:
  - place: a15257a # Jerusalem
    ref: Acts.2.1-Acts.2.13
    note:
      en: 'On the day of Pentecost the Spirit comes with a sound from heaven and tongues as of fire; devout Jews "out of every nation under heaven" hear the Galileans, each in his own language.'
      ru: "В день Пятидесятницы сходит Дух с шумом с неба и языками как бы огненными; набожные Иудеи «из всякого народа под небом» слышат Галилеян, каждый на своём наречии."
      uk: "У день П’ятдесятниці Дух приходить із шумом з неба й язиками ніби вогненними; побожні юдеї «з усякого народу під небом» чують галилеян, кожен своєю мовою."
      es: "El día de Pentecostés el Espíritu viene con un estruendo del cielo y lenguas como de fuego; judíos piadosos «de todas las naciones debajo del cielo» oyen a los galileos, cada uno en su propia lengua."
      pt: "No dia de Pentecostes o Espírito vem com um som do céu e línguas como de fogo; judeus piedosos “de todas as nações sob o céu” ouvem os galileus, cada um em sua própria língua."
      de: "Am Pfingsttag kommt der Geist mit einem Brausen vom Himmel und mit Zungen wie von Feuer; gottesfürchtige Juden „aus allerlei Volk, das unter dem Himmel ist“ hören die Galiläer, jeder in seiner eigenen Sprache."
      fr: "Le jour de la Pentecôte, l’Esprit vient avec un bruit du ciel et des langues semblables à du feu ; des Juifs pieux « de toutes les nations qui sont sous le ciel » entendent les Galiléens, chacun dans sa propre langue."
      pl: "W dzień Pięćdziesiątnicy Duch przychodzi z szumem z nieba i w językach jakby ognistych; pobożni Żydzi „z każdego narodu tych, którzy są pod niebem” słyszą Galilejczyków, każdy w swoim języku."
      it: "Il giorno di Pentecoste lo Spirito scende con un suono dal cielo e lingue come di fuoco; Giudei religiosi «d’ogni nazione di sotto il cielo» sentono parlare i Galilei, ciascuno nella propria lingua."
      nl: "Op de dag van Pinksteren komt de Geest met een geluid uit de hemel en tongen als van vuur; vrome Joden “van allen volke dergenen, die onder den hemel zijn” horen de Galileeërs, ieder in zijn eigen taal."
      cs: "V den Letnic přichází Duch se zvukem z nebe a jazyky jako z ohně; zbožní Židé „ze všelikého národu, kterýž pod nebem jest“ slyší Galilejské, každý ve svém jazyce."
      sv: "På pingstdagen kommer Anden med ett dån från himmelen och tungor såsom av eld; fromma judiska män ”från allahanda folk under himmelen” hör galileerna, var och en på sitt eget språk."
      nb: "På pinsedagen kommer Ånden med en lyd fra himmelen og tunger som av ild; fromme jøder «fra alle folkeslag under himmelen» hører galileerne, hver på sitt eget språk."
      tl: "Sa araw ng Pentecostes, bumababa ang Espiritu na may tunog mula sa langit at mga dilang tulad ng apoy; naririnig ng mga relihiosong Judio “buhat sa bawa't bansa sa ilalim ng langit” ang mga taga-Galilea, bawat isa sa sarili niyang wika."
      da: "På pinsedagen kommer Ånden med en lyd fra himlen og tunger som af ild; gudfrygtige jøder »af alle Folkeslag under Himmelen« hører galilæerne, hver på sit eget sprog."
      sr: "На дан Педесетнице Дух силази уз шум с неба и језике као огњене; побожни Јевреји „из сваког народа који је под небом“ чују Галилејце, сваки на свом језику."
      hu: "Pünkösd napján a Lélek mennyei zúgással és tűzként megjelenő nyelvekkel száll alá; az istenfélő zsidók „minden nép közül, melyek az ég alatt vannak”, mindannyian a maguk nyelvén hallják a galileaiakat."
      fi: "Helluntaipäivänä Henki tulee äänenä taivaasta ja tulen kaltaisina kielinä; jumalaapelkääväiset juutalaiset ”kaikkinaisista kansoista, mitä taivaan alla on”, kuulevat galilealaisten puhuvan, kukin omalla kielellään."
      vi: "Đến ngày lễ Ngũ Tuần, Đức Thánh Linh giáng xuống với một tiếng từ trời và những lưỡi như lửa; những người Giu-đa mộ đạo “từ các dân thiên hạ đến” nghe các người Ga-li-lê nói, ai nấy đều nghe bằng tiếng riêng của mình."
      ro: "În ziua Cincizecimii, Duhul vine cu un vuiet din cer și cu limbi ca de foc; iudei evlavioși „dintru tot neamul ce este supt cer” îi aud pe galileeni, fiecare în limba lui."
      bg: "В деня на Петдесетница Духът идва с шум от небето и езици като от огън; благочестиви юдеи „от всеки народ що има под небето“ чуват галилейците всеки на своя език."
  - place: a43f60f # Mesopotamia
    ref: Acts.2.9
    note:
      en: "First the east: Parthians, Medes, Elamites and the dwellers in Mesopotamia, where Jews had lived since the exile."
      ru: "Сначала восток: Парфяне, Мидяне, Еламиты и жители Месопотамии, где иудеи жили со времён плена."
      uk: "Спершу схід: парфяни, мідяни, еламіти й жителі Месопотамії, де юдеї жили від часів вигнання."
      es: "Primero el oriente: partos, medos, elamitas y los habitantes de Mesopotamia, donde los judíos vivían desde el destierro."
      pt: "Primeiro o oriente: partos, medos, elamitas e os habitantes da Mesopotâmia, onde havia judeus desde o exílio."
      de: "Zuerst der Osten: Parther, Meder, Elamiter und die Bewohner Mesopotamiens, wo seit dem Exil Juden lebten."
      fr: "D’abord l’Orient : Parthes, Mèdes, Élamites et les habitants de la Mésopotamie, où des Juifs vivaient depuis l’exil."
      pl: "Najpierw wschód: Partowie, Medowie, Elamici i mieszkańcy Mezopotamii, gdzie Żydzi mieszkali od czasów wygnania."
      it: "Prima l’oriente: Parti, Medi, Elamiti e gli abitanti della Mesopotamia, dove i Giudei vivevano fin dall’esilio."
      nl: "Eerst het oosten: Parthen, Meden, Elamieten en de bewoners van Mesopotamië, waar sinds de ballingschap Joden hadden gewoond."
      cs: "Nejprve východ: Parthové, Médové, Elamité a obyvatelé Mezopotámie, kde Židé žili od vyhnanství."
      sv: "Först österut: parter, meder, elamiter och de som bor i Mesopotamien, där judar hade bott sedan landsflykten."
      nb: "Først øst: partere, medere, elamitter og de som bor i Mesopotamia, hvor jøder hadde bodd siden landflyktigheten."
      tl: "Una ang silangan: mga Parto, mga Medo, mga Elamita at ang mga naninirahan sa Mesopotamia, kung saan nanirahan ang mga Judio mula pa sa pagkabihag."
      da: "Først øst: parthere, medere, elamitter og dem, der bor i Mesopotamien, hvor jøder havde boet siden landflygtigheden."
      sr: "Најпре исток: Парти, Миђани, Еламљани и становници Месопотамије, где су Јевреји живели од прогонства."
      hu: "Először a kelet: párthusok, médek, elámiták és a Mezopotámiában lakók, ahol a zsidók a számkivetés óta éltek."
      fi: "Ensin itä: partialaiset, meedialaiset, elamilaiset ja Mesopotamian asukkaat, jossa juutalaisia oli asunut pakkosiirtolaisuudesta asti."
      vi: "Trước hết là phương đông: người Bạt-thê, Mê-đi, Ê-la-mít và những kẻ ở tại Mê-sô-bô-ta-mi, nơi người Giu-đa đã sống từ thời lưu đày."
      ro: "Întâi răsăritul: parți, mezi, elamiți și locuitorii Mesopotamiei, unde iudeii trăiau încă din vremea exilului."
      bg: "Първо изтокът: партяни, мидяни, еламити и живеещите в Месопотамия, където юдеи живееха още от изгнанието."
