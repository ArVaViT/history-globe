      pl: "Frygia w głębi lądu, którą Paweł przemierzy dwukrotnie w swoich podróżach."
      it: "La Frigia, nell’entroterra, che Paolo attraverserà due volte nei suoi viaggi."
      nl: "Frygië in het binnenland, dat Paulus op zijn reizen tweemaal zal doortrekken."
      cs: "Frygie ve vnitrozemí, kterou Pavel na svých cestách dvakrát projde."
      sv: "Frygien i inlandet, som Paulus ska färdas genom två gånger på sina resor."
      nb: "Frygia inne i landet, som Paulus skal krysse to ganger på sine reiser."
      tl: "Frigia sa kalooban ng lupain, na dalawang beses na daraanan ni Pablo sa kaniyang mga paglalakbay."
      da: "Frygien inde i landet, som Paulus skal krydse to gange på sine rejser."
      sr: "Фригија у унутрашњости, коју ће Павле двапут прећи на својим путовањима."
      hu: "Frígia a szárazföld belsejében, amelyen Pál útjai során kétszer halad át."
      fi: "Fryygia sisämaassa, jonka Paavali ylittää kahdesti matkoillaan."
      vi: "Phi-ri-gi ở trong nội địa, mà Phao-lô sẽ hai lần đi ngang qua trong các chuyến hành trình của mình."
      ro: "Frigia, în interior, pe care Pavel o va străbate de două ori în călătoriile sale."
      bg: "Фригия във вътрешността, която Павел ще прекоси два пъти в пътуванията си."
