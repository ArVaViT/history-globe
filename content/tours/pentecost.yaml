      sr: "Кападокија, у срцу Мале Азије: Петар ће писати своју посланицу њеним црквама (1. Пет 1,1)."
      hu: "Kappadókia, Kis-Ázsia szívében: Péter levelét az itteni gyülekezeteknek írja (1Pt 1,1)."
      fi: "Kappadokia, Vähän-Aasian sydämessä: Pietari kirjoittaa kirjeensä sen seurakunnille (1. Piet. 1:1)."
      vi: "Cáp-ba-đốc, ở giữa miền Tiểu Á: Phi-e-rơ sẽ viết thư gởi cho các Hội thánh ở đó (1 Phi-e-rơ 1:1)."
      ro: "Capadocia, în inima Asiei Mici: Petru le va scrie bisericilor de acolo epistola sa (1 Petru 1:1)."
      bg: "Кападокия, в сърцето на Мала Азия: Петър ще напише посланието си до нейните църкви (1 Петр. 1:1)."
  - place: a83a43e # Pontus
    ref: Acts.2.9
    note:
      en: "Pontus on the Black Sea, the home of Aquila, whom Paul will meet at Corinth (Acts 18:2)."
      ru: "Понт на Чёрном море, родина Акилы, которого Павел встретит в Коринфе (Деян 18:2)."
      uk: "Понт на Чорному морі, батьківщина Акили, з яким Павло зустрінеться в Коринті (Дії 18:2)."
      es: "El Ponto, junto al mar Negro, patria de Aquila, a quien Pablo encontrará en Corinto (Hch 18:2)."
      pt: "O Ponto, no Mar Negro, terra de Áquila, que Paulo encontrará em Corinto (At 18:2)."
      de: "Pontus am Schwarzen Meer, die Heimat des Aquila, den Paulus in Korinth treffen wird (Apg 18,2)."
      fr: "Le Pont, sur la mer Noire, patrie d’Aquilas, que Paul rencontrera à Corinthe (Ac 18:2)."
      pl: "Pont nad Morzem Czarnym, ojczyzna Akwili, którego Paweł spotka w Koryncie (Dz 18,2)."
      it: "Il Ponto, sul Mar Nero, patria di Aquila, che Paolo incontrerà a Corinto (At 18,2)."
      nl: "Pontus aan de Zwarte Zee, de woonplaats van Aquila, die Paulus te Korinthe zal ontmoeten (Hand. 18:2)."
      cs: "Pontus při Černém moři, domov Akvily, s nímž se Pavel setká v Korintu (Sk 18,2)."
      sv: "Pontos vid Svarta havet, hemland för Aquila, som Paulus ska möta i Korinth (Apg 18:2)."
      nb: "Pontos ved Svartehavet, Akvilas' hjemland, som Paulus skal møte i Korint (Apg 18,2)."
      tl: "Ponto sa Dagat Itim, ang tahanan ni Aquila, na makikilala ni Pablo sa Corinto (Gawa 18:2)."
      da: "Pontus ved Sortehavet, Akvilas hjemland, som Paulus skal møde i Korinth (ApG 18,2)."
      sr: "Понт на Црном мору, домовина Акиле, кога ће Павле срести у Коринту (Дап 18,2)."
      hu: "Pontus a Fekete-tenger mellett, Akvila hazája, akivel Pál Korinthusban találkozik (ApCsel 18,2)."
      fi: "Pontos Mustanmeren rannalla, Akylaan kotiseutu; hänet Paavali tapaa Korintissa (Ap. t. 18:2)."
      vi: "Bông bên Biển Đen, quê hương của A-qui-la, người mà Phao-lô sẽ gặp tại Cô-rinh-tô (Công vụ 18:2)."
      ro: "Pontul, la Marea Neagră, patria lui Acvila, pe care Pavel îl va întâlni la Corint (Faptele Apostolilor 18:2)."
      bg: "Понт на Черно море, родината на Акила, когото Павел ще срещне в Коринт (Деян. 18:2)."
  - place: a197f19 # Asia
    ref: Acts.2.9
    note:
      en: "Asia, the province of Ephesus, where Paul will teach for three years and the seven churches of Revelation will stand."
      ru: "Асия, провинция с Ефесом, где Павел будет учить три года и где встанут семь церквей Откровения."
      uk: "Азія, провінція Ефеса, де Павло навчатиме три роки й де стоятимуть сім церков Одкровення."
      es: "Asia, la provincia de Éfeso, donde Pablo enseñará durante tres años y donde estarán las siete iglesias del Apocalipsis."
      pt: "A Ásia, a província de Éfeso, onde Paulo ensinará por três anos e onde se erguerão as sete igrejas do Apocalipse."
      de: "Asia, die Provinz von Ephesus, wo Paulus drei Jahre lehren wird und wo die sieben Gemeinden der Offenbarung stehen werden."
      fr: "L’Asie, la province d’Éphèse, où Paul enseignera pendant trois ans et où se dresseront les sept Églises de l’Apocalypse."
      pl: "Azja, prowincja Efezu, gdzie Paweł będzie nauczał przez trzy lata i gdzie staną siedem Kościołów z Apokalipsy."
      it: "L’Asia, la provincia di Efeso, dove Paolo insegnerà per tre anni e dove sorgeranno le sette chiese dell’Apocalisse."
      nl: "Asia, de provincie van Efeze, waar Paulus drie jaar zal onderwijzen en waar de zeven gemeenten van Openbaring zullen staan."
      cs: "Asie, provincie s Efezem, kde bude Pavel tři roky učit a kde budou stát sedm církví Zjevení."
      sv: "Asien, Efesos’ provins, där Paulus ska undervisa i tre år och där Uppenbarelsebokens sju församlingar ska ligga."
      nb: "Asia, provinsen med Efesos, hvor Paulus skal undervise i tre år og Johannes' Åpenbarings sju menigheter skal stå."
      tl: "Asia, ang lalawigan ng Efeso, kung saan magtuturo si Pablo nang tatlong taon at kung saan itatayo ang pitong iglesia ng Apocalipsis."
      da: "Asia, Efesos' provins, hvor Paulus skal undervise i tre år, og hvor Johannes' Åbenbarings syv menigheder skal ligge."
      sr: "Азија, провинција Ефеса, где ће Павле поучавати три године и где ће стајати седам цркава из Откривења."
      hu: "Ázsia, Efezus provinciája, ahol Pál három évig tanít, és ahol a Jelenések könyvének hét gyülekezete áll majd."
      fi: "Aasia, Efesoksen provinssi, jossa Paavali opettaa kolme vuotta ja jossa Ilmestyskirjan seitsemän seurakuntaa tulevat olemaan."
      vi: "A-si, tỉnh của Ê-phê-sô, nơi Phao-lô sẽ dạy dỗ trong ba năm và là nơi có bảy Hội thánh trong sách Khải huyền."
      ro: "Asia, provincia Efesului, unde Pavel va învăța trei ani și unde se vor afla cele șapte biserici din Apocalipsa."
      bg: "Азия, провинцията на Ефес, където Павел ще поучава три години и където ще стоят седемте църкви от Откровението."
  - place: ab8ae56 # Phrygia
    ref: Acts.2.10
