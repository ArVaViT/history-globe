      it: "Il Ponto, sul Mar Nero, patria di Aquila, che Paolo incontrerà a Corinto (At 18,2)."
      nl: "Pontus aan de Zwarte Zee, de woonplaats van Aquila, die Paulus te Korinthe zal ontmoeten (Hand. 18:2)."
      cs: "Pontus při Černém moři, domov Akvily, s nímž se Pavel setká v Korintu (Sk 18,2)."
      sv: "Pontos vid Svarta havet, hemland för Aquila, som Paulus ska möta i Korinth (Apg 18:2)."
      nb: "Pontos ved Svartehavet, Akvilas' hjemland, som Paulus skal møte i Korint (Apg 18,2)."
      tl: "Ponto sa Dagat Itim, ang tahanan ni Aquila, na makikilala ni Pablo sa Corinto (Gawa 18:2)."
  - place: a197f19 # Asia
