# Isaac, Genesis 24:62-26:33, in the order of the text, between the Abraham tour and the
# Jacob tour (his death at Mamre, 35:27-29, is a stop of the Jacob tour). The tour's year
# (1850 BC) is a conventional point for the map between those two tours, not a date: the
# age of the patriarchs is disputed.
id: isaac
title:
  en: "Isaac and the wells"
  ru: "Исаак и колодцы"
  uk: "Ісаак і колодязі"
  es: "Isaac y los pozos"
  pt: "Isaque e os poços"
  de: "Isaak und die Brunnen"
  fr: "Isaac et les puits"
  pl: "Izaak i studnie"
  it: "Isacco e i pozzi"
  nl: "Isaak en de putten"
  cs: "Izák a studny"
  sv: "Isak och brunnarna"
  nb: "Isak og brønnene"
  tl: "Si Isaac at ang mga balon"
  da: "Isak og brøndene"
  sr: "Исак и студенци"
  hu: "Izsák és a kutak"
  fi: "Iisak ja kaivot"
  vi: "Y-sác và những cái giếng"
  ro: "Isaac și fântânile"
  bg: "Исаак и кладенците"
year: "1850 BC"
people: ["Isaac@Gen.17.19-Jas"]
approximate: true
stops:
  - place: a70e842 # Beer-lahai-roi
    ref: Gen.24.62-Gen.24.67
    note:
      en: "Coming from Beer-lahai-roi, Isaac meets Rebekah in the field at evening and takes her into his mother Sarah's tent."
      ru: "Придя из Беэр-лахай-рои, Исаак вечером в поле встречает Ревекку и вводит её в шатёр Сарры, матери своей."
      uk: "Прибувши від Беер-Лахай-Рої, Ісаак зустрічає Ревеку в полі ввечері й вводить її в намет своєї матері Сарри."
      es: "Al venir de Beer-lahai-roi, Isaac encuentra a Rebeca en el campo al atardecer y la lleva a la tienda de su madre Sara."
      pt: "Vindo de Beer-Laai-Roi, Isaque encontra Rebeca no campo ao entardecer e a leva para a tenda de Sara, sua mãe."
      de: "Von Beer-Lachai-Roï kommend, begegnet Isaak am Abend auf dem Feld Rebekka und führt sie in das Zelt seiner Mutter Sara."
      fr: "Venant de Beer-Lachaï-Roï, Isaac rencontre Rebecca dans les champs au soir et la conduit dans la tente de sa mère Sara."
      pl: "Idąc od Beer-Lachaj-Roj, Izaak spotyka Rebekę na polu wieczorem i wprowadza ją do namiotu swej matki Sary."
      it: "Venendo da Beer-Lacai-Roi, Isacco incontra Rebecca nei campi a sera e la conduce nella tenda di sua madre Sara."
      nl: "Komend van Beër-Lachai-Roï ontmoet Isaak 's avonds Rebekka in het veld en brengt haar in de tent van zijn moeder Sara."
      cs: "Izák přichází od Beer-lachaj-roí, večer potkává Rebeku na poli a uvádí ji do stanu své matky Sáry."
      sv: "På väg från Beer-Lachaj-Roi möter Isak Rebecka på fältet mot aftonen och för henne in i sin moder Saras tält."
      nb: "På vei fra Beer-Lahai-Roi møter Isak Rebekka på marken om aftenen og fører henne inn i sin mor Saras telt."
      tl: "Pagdating mula sa Beer-lahai-roi, nasasalubong ni Isaac si Rebeca sa parang sa dakong hapon at dinadala siya sa tolda ni Sara na kaniyang ina."
      da: "Kommende fra Be'er-Lahaj-Ro'i møder Isak Rebekka på marken ved aftentid og fører hende ind i sin mor Saras telt."
      sr: "Долазећи од Вир-Лахај-Роја, Исак среће Ревеку на пољу у сумрак и уводи је у шатор своје матере Саре."
      hu: "A Beér-Lahaj-Roi felől érkező Izsák estefelé a mezőn találkozik Rebekával, és anyja, Sára sátrába viszi."
      fi: "Beer-Lahai-Roista tullessaan Iisak kohtaa Rebekan kedolla illalla ja vie hänet äitinsä Saaran telttaan."
      vi: "Từ Bê-e-La-chai-Roi đến, Y-sác gặp Rê-be-ca ngoài đồng lúc chiều tối và đem nàng vào trại của Sa-ra, mẹ mình."
      ro: "Venind de la Beer-Lahai-Roi, Isaac o întâlnește seara pe Rebeca în câmp și o duce în cortul mamei sale, Sara."
      bg: "Идвайки от Беер-Лахай-Рои, Исаак среща Ревека вечерта в полето и я въвежда в шатъра на майка си Сара."
  - place: ae00861 # Machpelah
    ref: Gen.25.8-Gen.25.10
    note:
      en: "Isaac and Ishmael bury their father Abraham in the cave of Machpelah, beside Sarah."
      ru: "Исаак и Измаил погребают отца своего Авраама в пещере Махпела, рядом с Саррой."
      uk: "Ісаак та Ізмаїл ховають свого батька Авраама в печері Махпела, поруч із Саррою."
      es: "Isaac e Ismael sepultan a su padre Abraham en la cueva de Macpela, junto a Sara."
      pt: "Isaque e Ismael sepultam o pai, Abraão, na caverna de Macpela, ao lado de Sara."
      de: "Isaak und Ismael begraben ihren Vater Abraham in der Höhle Machpela, neben Sara."
      fr: "Isaac et Ismaël ensevelissent leur père Abraham dans la caverne de Macpéla, à côté de Sara."
      pl: "Izaak i Izmael chowają swego ojca Abrahama w jaskini Makpela, obok Sary."
      it: "Isacco e Ismaele seppelliscono il loro padre Abramo nella caverna di Macpela, accanto a Sara."
      nl: "Isaak en Ismaël begraven hun vader Abraham in de spelonk van Machpela, naast Sara."
      cs: "Izák a Jišmael pohřbívají svého otce Abrahama v jeskyni Makpela vedle Sáry."
      sv: "Isak och Ismael begraver sin fader Abraham i grottan i Makpela, bredvid Sara."
      nb: "Isak og Ismael gravlegger sin far Abraham i Makpela-hulen, ved siden av Sara."
      tl: "Inilibing nina Isaac at Ismael ang kanilang amang si Abraham sa yungib ng Macpela, sa tabi ni Sara."
      da: "Isak og Ismael begraver deres far Abraham i Makpelas hule ved siden af Sara."
      sr: "Исак и Исмаило сахрањују оца свог Аврама у пећини Макпели, поред Саре."
      hu: "Izsák és Izmael a makpélai barlangban temetik el atyjukat, Ábrahámot, Sára mellé."
      fi: "Iisak ja Ismael hautaavat isänsä Abrahamin Makpelan luolaan Saaran viereen."
      vi: "Y-sác và Ích-ma-ên chôn cha mình là Áp-ra-ham trong hang đá Mặc-bê-la, bên cạnh Sa-ra."
      ro: "Isaac și Ismael îl îngroapă pe tatăl lor, Avraam, în peștera Macpela, lângă Sara."
      bg: "Исаак и Исмаил погребват баща си Авраам в пещерата Махпела, до Сара."
  - place: a3f5814 # Gerar
    ref: Gen.26.1-Gen.26.14
    note:
      en: "In a famine Isaac goes to Abimelech king of the Philistines at Gerar, calls Rebekah his sister, and reaps a hundredfold."
      ru: "Во время голода Исаак идёт к Авимелеху, царю Филистимскому, в Герар, называет Ревекку сестрой и получает урожай во сто крат."
      uk: "У голод Ісаак іде до Авімелеха, царя філістимлян, у Герар, називає Ревеку сестрою й збирає стократний урожай."
      es: "En una hambruna Isaac va a Gerar, a Abimelec, rey de los filisteos, dice que Rebeca es su hermana y cosecha el ciento por uno."
      pt: "Numa fome, Isaque vai a Abimeleque, rei dos filisteus, em Gerar, chama Rebeca de sua irmã e colhe a cem por um."
      de: "In einer Hungersnot geht Isaak zu Abimelech, dem König der Philister, nach Gerar, nennt Rebekka seine Schwester und erntet hundertfältig."
      fr: "Pendant une famine, Isaac va chez Abimélec, roi des Philistins, à Guérar, appelle Rebecca sa sœur, et récolte le centuple."
      pl: "W czasie głodu Izaak udaje się do Abimeleka, króla Filistynów, w Gerarze, nazywa Rebekę swoją siostrą i zbiera plon stokrotny."
      it: "Durante una carestia Isacco va da Abimelech, re dei Filistei, a Gerar, chiama Rebecca sua sorella e raccoglie il centuplo."
      nl: "In een hongersnood gaat Isaak naar Abimelech, de koning van de Filistijnen, te Gerar, noemt Rebekka zijn zuster en oogst honderdvoud."
      cs: "Za hladu jde Izák k Abimelekovi, králi Pelištejců, do Gerar, nazývá Rebeku svou sestrou a sklidí stonásobek."
      sv: "Under en hungersnöd drar Isak till Avimelek, filistéernas kung, i Gerar, kallar Rebecka sin syster och skördar hundrafalt."
      nb: "I en hungersnød drar Isak til Abimelek, filisternes konge, i Gerar, kaller Rebekka sin søster og høster hundre fold."
      tl: "Sa panahon ng taggutom, pumunta si Isaac kay Abimelech na hari ng mga Filisteo sa Gerar, tinawag niyang kapatid si Rebeca, at umani siya ng tigisang daan."
      da: "I en hungersnød drager Isak til Abimelek, filistrenes konge, i Gerar, kalder Rebekka sin søster og høster hundredfold."
      sr: "У глади Исак одлази Авимелеху, цару филистејском, у Герар, назива Ревеку сестром својом и жање сто пута више."
      hu: "Éhínség idején Izsák Abimélekhez, a filiszteusok királyához megy Gerárba, Rebekát a húgának mondja, és százszoros termést arat."
      fi: "Nälänhädän aikana Iisak menee filistealaisten kuninkaan Abimelekin luo Gerariin, sanoo Rebekkaa sisarekseen ja korjaa satakertaisen sadon."
      vi: "Trong cơn đói kém, Y-sác đến A-bi-mê-léc, vua dân Phi-li-tin, tại Ghê-ra, gọi Rê-be-ca là em gái mình, và gặt được gấp trăm lần."
      ro: "Pe vreme de foamete, Isaac merge la Abimelec, regele filistenilor, în Gherar, spune că Rebeca este sora lui și culege însutit."
      bg: "По време на глад Исаак отива при Авимелех, филистимския цар, в Герар, нарича Ревека своя сестра и пожънва стократно."
  - place: a816ed9 # Valley of Gerar
    ref: Gen.26.15-Gen.26.19
    note:
      en: "Sent away, he camps in the Valley of Gerar and digs again the wells of his father Abraham, which the Philistines had stopped."
      ru: "Удалившись, он располагается в долине Герарской и вновь выкапывает колодцы отца своего Авраама, заваленные Филистимлянами."
      uk: "Відісланий, він стає табором у Герарській долині й знову копає колодязі свого батька Авраама, які філістимляни позасипали."
      es: "Despedido de allí, acampa en el Valle de Gerar y vuelve a cavar los pozos de su padre Abraham, que los filisteos habían cegado."
      pt: "Mandado embora, acampa no Vale de Gerar e cava de novo os poços de seu pai Abraão, que os filisteus haviam entupido."
      de: "Fortgeschickt, lagert er im Tal von Gerar und gräbt die Brunnen seines Vaters Abraham wieder auf, die die Philister zugestopft hatten."
      fr: "Renvoyé, il campe dans la vallée de Guérar et creuse de nouveau les puits de son père Abraham, que les Philistins avaient comblés."
      pl: "Odprawiony stamtąd, rozbija obóz w dolinie Gerar i na nowo kopie studnie swego ojca Abrahama, które Filistyni zasypali."
      it: "Mandato via, si accampa nella valle di Gerar e scava di nuovo i pozzi di suo padre Abramo, che i Filistei avevano otturato."
      nl: "Weggestuurd slaat hij zijn kamp op in het dal van Gerar en graaft opnieuw de putten van zijn vader Abraham, die de Filistijnen hadden dichtgestopt."
      cs: "Vyhnán se utábořuje v Gerárském údolí a znovu kope studny svého otce Abrahama, které Pelištejci zacpali."
      sv: "Bortvisad slår han läger i Gerars dal och gräver åter upp sin fader Abrahams brunnar, som filistéerna hade täppt till."
      nb: "Han blir sendt bort, slår leir i Gerar-dalen og graver på ny sin far Abrahams brønner, som filisterne hadde tettet igjen."
      tl: "Pinaalis, nagkampo siya sa libis ng Gerar at muling hinukay ang mga balon ng kaniyang amang si Abraham, na tinabunan ng mga Filisteo."
      da: "Bortvist slår han lejr i Gerars Dal og graver påny sin far Abrahams brønde, som filistrene havde tilstoppet."
      sr: "Отеран, логорује у долини Герарској и поново копа студенце оца свог Аврама, које су Филистеји затрли."
      hu: "Elküldik, ezért a Gerár-völgyben tanyázik, és újra kiássa atyja, Ábrahám kútjait, amelyeket a filiszteusok betömtek."
      fi: "Pois lähetettynä hän leiriytyy Gerarin laaksoon ja kaivaa uudelleen isänsä Abrahamin kaivot, jotka filistealaiset olivat tukkineet."
      vi: "Bị đuổi đi, người đóng trại trong Trũng Ghê-ra và đào lại các giếng của cha mình là Áp-ra-ham mà người Phi-li-tin đã lấp."
      ro: "Alungat, își așază tabăra în Valea Gherarului și sapă din nou fântânile tatălui său, Avraam, pe care filistenii le astupaseră."
      bg: "Отпратен, той се разполага в Герарската долина и отново изкопава кладенците на баща си Авраам, които филистимците бяха затрупали."
  - place: a43608b # Esek
    ref: Gen.26.20
    note:
      en: "The herdmen of Gerar strive with his over the water, and he calls the well Esek, contention."
      ru: "Пастухи Герарские спорят с его пастухами о воде, и он называет колодец Есек (спор)."
      uk: "Пастухи Герара сперечаються з його пастухами через воду, і він називає колодязь Есек, чвара."
      es: "Los pastores de Gerar riñen con los suyos por el agua, y él llama al pozo Esec, contienda."
      pt: "Os pastores de Gerar discutem com os dele por causa da água, e ele chama o poço Eseque, contenda."
      de: "Die Hirten von Gerar streiten mit seinen Hirten um das Wasser, und er nennt den Brunnen Esek, Streit."
      fr: "Les bergers de Guérar se disputent avec les siens au sujet de l’eau, et il appelle le puits Ések, querelle."
      pl: "Pasterze z Gerar kłócą się z jego pasterzami o wodę, a on nazywa studnię Esek, czyli Spór."
      it: "I pastori di Gerar litigano con i suoi per l’acqua, ed egli chiama il pozzo Esek, «contesa»."
      nl: "De herders van Gerar twisten met de zijne om het water, en hij noemt de put Esek, twist."
      cs: "Pastýři z Gerar se přou s jeho pastýři o vodu a on nazývá studnu Esek, Svár."
      sv: "Gerars herdar tvistar med hans herdar om vattnet, och han kallar brunnen Esek, Tvist."
      nb: "Gjeterne fra Gerar trettet med hans gjetere om vannet, og han kaller brønnen Esek, strid."
      tl: "Nakipagtalo ang mga pastol ng Gerar sa kaniyang mga pastol tungkol sa tubig, at tinawag niyang Esec ang balon, na ang ibig sabihin ay pagtatalo."
      da: "Gerars hyrder strides med hans hyrder om vandet, og han kalder brønden Esek, strid."
      sr: "Пастири герарски свађају се с његовима око воде, и он назива студенац Есек, свађа."
      hu: "Gerár pásztorai versengenek vele a vízért, ő pedig a kutat Eszeknek nevezi, ami versengést jelent."
      fi: "Gerarin paimenet riitelevät hänen paimentensa kanssa vedestä, ja hän antaa kaivolle nimen Esek, riita."
      vi: "Bọn chăn chiên Ghê-ra tranh giành nước với người, và người đặt tên giếng ấy là Ê-sét, nghĩa là tranh giành."
      ro: "Păstorii din Gherar se ceartă cu ai lui pentru apă, iar el numește fântâna Esec, adică ceartă."
      bg: "Герарските пастири се карат с неговите за водата и той нарича кладенеца Есек, „препирня“."
  - place: aa454f7 # Sitnah
    ref: Gen.26.21
    note:
      en: "They strive over the next well too, and he calls it Sitnah, hatred."
      ru: "О следующем колодце тоже спорят, и он называет его Ситна (вражда)."
      uk: "Вони сперечаються й про наступний колодязь, і він називає його Ситна, ворожнеча."
      es: "También riñen por el siguiente pozo, y lo llama Sitna, enemistad."
      pt: "Discutem também por causa do poço seguinte, e ele o chama Sitna, ódio."
      de: "Auch um den nächsten Brunnen streiten sie, und er nennt ihn Sitna, Feindschaft."
      fr: "Ils se disputent aussi pour le puits suivant, et il l’appelle Sitna, haine."
      pl: "Kłócą się też o następną studnię, a on nazywa ją Sitna, czyli Nienawiść."
      it: "Litigano anche per il pozzo seguente, ed egli lo chiama Sitna, «odio»."
      nl: "Ook over de volgende put twisten zij, en hij noemt die Sitna, haat."
      cs: "Přou se i o další studnu a on ji nazývá Sitna, Nenávist."
      sv: "De tvistar om nästa brunn också, och han kallar den Sitna, Hat."
      nb: "De trettet også om den neste brønnen, og han kaller den Sitna, fiendskap."
      tl: "Pinagtalunan din nila ang sumunod na balon, at tinawag niya itong Sitnah, na ang ibig sabihin ay pagkapoot."
      da: "De strides også om den næste brønd, og han kalder den Sitna, had."
      sr: "Свађају се и око следећег студенца, и он га назива Ситна, мржња."
      hu: "A következő kút miatt is versengenek, és Sitnának nevezi, ami gyűlöletet jelent."
      fi: "He riitelevät seuraavastakin kaivosta, ja hän antaa sille nimen Sitna, viha."
      vi: "Họ cũng tranh giành cái giếng kế đó, và người đặt tên là Sít-na, nghĩa là thù ghét."
      ro: "Se ceartă și pentru fântâna următoare, iar el o numește Sitna, adică vrăjmășie."
      bg: "Карат се и за следващия кладенец и той го нарича Ситна, „вражда“."
  - place: ab1d954 # Rehoboth
    ref: Gen.26.22
    note:
      en: 'Over a third well no one strives, and he names it Rehoboth: "For now the LORD hath made room for us".'
      ru: "О третьем колодце уже не спорят, и он называет его Реховоф: «теперь Господь дал нам пространное место»."
      uk: "Через третій колодязь ніхто не сперечається, і він називає його Реховот: «Роспросторив Господь займище наше»."
      es: "Por un tercer pozo nadie riñe, y lo llama Rehobot: «Porque ahora nos ha hecho ensanchar Jehová»."
      pt: "Por um terceiro poço ninguém discute, e ele lhe dá o nome de Reobote: “Porque agora o SENHOR abriu espaço para nós”."
      de: "Um einen dritten Brunnen streitet niemand, und er nennt ihn Rehobot: „Nun hat uns der HERR Raum gemacht“."
      fr: "Pour un troisième puits, personne ne se dispute, et il le nomme Rehoboth : « l’Éternel nous a maintenant mis au large »."
      pl: "O trzecią studnię nikt się nie kłóci, i nadaje jej imię Rechobot: „Oto, teraz rozszerzył nas Pan, i urośliśmy na ziemi”."
      it: "Per un terzo pozzo nessuno litiga, ed egli lo chiama Recobot: «ora l’Eterno ci ha messi al largo»."
      nl: "Over een derde put twist niemand, en hij noemt die Rehobot: “Want nu heeft ons de HEERE ruimte gemaakt”."
      cs: "O třetí studnu se nikdo nepře a on ji nazývá Rechobót: „Nyní uprostrannil nám Hospodin“."
      sv: "Om en tredje brunn tvistar ingen, och han ger den namnet Rehovot: ”Nu har ju HERREN givit oss utrymme”."
      nb: "Om en tredje brønn trettet ingen, og han gir den navnet Rehobot: «Nu har Herren gjort det rummelig for oss»."
      tl: "Sa ikatlong balon ay walang nakipagtalo, at pinangalanan niya itong Rehoboth: “Sapagka't ngayo'y binigyan tayo ng Panginoon ng kaluwagan”."
      da: "Om en tredje brønd strides ingen, og han kalder den Rehobot: »thi nu har Herren gjort Rum for os«."
      sr: "Око трећег студенца нико се не свађа, и он га назива Реховот: „Сад нам даде Господ простора да растемо у овој земљи.“"
      hu: "A harmadik kút miatt senki sem versengett, és Rehóbótnak nevezi: „Immár tágas helyet szerzett az Úr minékünk”."
      fi: "Kolmannesta kaivosta ei kukaan riitele, ja hän antaa sille nimen Rehobot: ”Nyt Herra on antanut meille tilaa”."
      vi: "Về cái giếng thứ ba, không ai tranh giành, và người đặt tên là Rê-hô-bốt: “Bây giờ Đức Giê-hô-va đã để cho chúng ta được ở rộng rãi”."
      ro: "Pentru a treia fântână nu se mai ceartă nimeni, iar el o numește Rehobot: „acum ne-au lățit pre noi Domnul”."
      bg: "За трети кладенец никой не се кара и той го нарича Реховот: „Защото сега ни разпространи Господ“."
  - place: a075d61 # Beersheba
    ref: Gen.26.23-Gen.26.33
    note:
      en: 'At Beersheba the Lord appears to him by night: "fear not, for I am with thee"; he builds an altar, makes peace with Abimelech, and his servants find water.'
      ru: "В Вирсавии ночью ему является Господь: «не бойся, ибо Я с тобою»; он устраивает жертвенник, заключает мир с Авимелехом, и рабы его находят воду."
      uk: "У Беер-Шеві Господь являється йому вночі: «Не бійся, бо я з тобою»; він будує жертовник, мириться з Авімелехом, і його слуги знаходять воду."
      es: "En Beerseba el Señor se le aparece de noche: «no temas, que yo soy contigo»; edifica un altar, hace las paces con Abimelec, y sus siervos hallan agua."
      pt: "Em Berseba o Senhor lhe aparece de noite: “Não tenha medo, pois eu estou com você”; ele constrói um altar, faz as pazes com Abimeleque, e os seus servos encontram água."
      de: "In Beerscheba erscheint ihm der Herr bei Nacht: „Fürchte dich nicht; denn ich bin mit dir“; er baut einen Altar, schließt Frieden mit Abimelech, und seine Knechte finden Wasser."
      fr: "À Beer-Schéba, l’Éternel lui apparaît dans la nuit : « ne crains point, car je suis avec toi » ; il bâtit un autel, fait la paix avec Abimélec, et ses serviteurs trouvent de l’eau."
      pl: "W Beer-Szebie ukazuje mu się Pan w nocy: „nie bój się, bom Ja jest z tobą”; Izaak buduje ołtarz, zawiera pokój z Abimelekiem, a jego słudzy znajdują wodę."
      it: "A Bersabea il Signore gli appare di notte: «non temere, poiché io sono teco»; egli costruisce un altare, fa pace con Abimelech, e i suoi servi trovano acqua."
      nl: "Te Berseba verschijnt de HEER hem 's nachts: “vrees niet; want Ik ben met u”; hij bouwt een altaar, sluit vrede met Abimelech, en zijn knechten vinden water."
      cs: "V Beer-šebě se mu Hospodin zjevuje v noci: „neboj se, nebo s tebou já jsem“; Izák staví oltář, uzavírá pokoj s Abimelekem a jeho služebníci nacházejí vodu."
      sv: "I Beer Sheva visar sig Herren för honom om natten: ”Frukta icke, ty jag är med dig”; han bygger ett altare, sluter fred med Avimelek, och hans tjänare finner vatten."
      nb: "I Beer-Sjeba åpenbarer Herren seg for ham om natten: «frykt ikke, for jeg er med dig»; han bygger et alter, slutter fred med Abimelek, og hans tjenere finner vann."
      tl: "Sa Beer-seba ay napakita sa kaniya ang Panginoon nang gabi: “huwag kang matakot, sapagka't ako'y sumasaiyo”; nagtayo siya ng dambana, nakipagpayapaan kay Abimelech, at nakasumpong ng tubig ang kaniyang mga lingkod."
      da: "I Beersheba åbenbarer Herren sig for ham om natten: »frygt ikke, thi jeg er med dig«; han bygger et alter, slutter fred med Abimelek, og hans tjenere finder vand."
      sr: "У Вирсавеји му се Господ јавља ноћу: „Не бој се, јер сам ја с тобом“; подиже жртвеник, склапа мир с Авимелехом, и његове слуге налазе воду."
      hu: "Beérsebában éjszaka megjelenik neki az Úr: „Ne félj, mert te veled vagyok”; oltárt épít, békét köt Abimélekkel, és szolgái vizet találnak."
      fi: "Beerseban luona Herra ilmestyy hänelle yöllä: ”älä pelkää, sillä minä olen sinun kanssasi”; hän rakentaa alttarin, tekee rauhan Abimelekin kanssa, ja hänen palvelijansa löytävät vettä."
      vi: "Tại Bê-e-Sê-ba, Đức Giê-hô-va hiện đến cùng người ban đêm: “chớ sợ chi, ta ở cùng ngươi”; người lập một bàn thờ, làm hòa với A-bi-mê-léc, và các đầy tớ người tìm được nước."
      ro: "La Beer-Șeba, Domnul i Se arată noaptea: „nu te teme, că cu tine sunt”; el zidește un altar, face pace cu Abimelec, iar slujitorii lui găsesc apă."
      bg: "Във Вирсавия Господ му се явява през нощта: „не бой се, защото аз съм с тебе“; той издига олтар, сключва мир с Авимелех и слугите му намират вода."
