# Jeremiah, in the order of the book. The tour's year (627 BC) is the thirteenth year of
# Josiah, when the word of the Lord first came to him (Jer 1:2; 626 BC is also held). Stops
# the book dates carry their own year: the beginning of Jehoiakim's reign (609 BC, 26:1), the
# tenth year of Zedekiah (588 BC, 32:1) and the taking of Jerusalem, 587 BC as in the tour of
# its fall (586 BC is also held), which the later stops follow.
id: jeremiah
title:
  en: "Jeremiah the prophet"
  ru: "Пророк Иеремия"
  uk: "Пророк Єремія"
  es: "El profeta Jeremías"
  pt: "Jeremias, o profeta"
  de: "Der Prophet Jeremia"
  fr: "Jérémie le prophète"
  pl: "Prorok Jeremiasz"
  it: "Il profeta Geremia"
  nl: "De profeet Jeremia"
  cs: "Prorok Jeremjáš"
  sv: "Profeten Jeremia"
  nb: "Profeten Jeremia"
  tl: "Ang propetang si Jeremias"
  da: "Profeten Jeremias"
  sr: "Пророк Јеремија"
  hu: "Jeremiás próféta"
  fi: "Profeetta Jeremia"
  vi: "Tiên tri Giê-rê-mi"
  ro: "Profetul Ieremia"
  bg: "Пророк Йеремия"
year: "627 BC"
people: ["Jeremiah@2Ch.35.25-Mat"]
approximate: true
stops:
  - place: ab34789 # Anathoth
    ref: Jer.1.1-Jer.1.10
    note:
      en: 'Jeremiah, of the priests in Anathoth, is called a prophet to the nations and answers, "I cannot speak: for I am a child."'
      ru: "Иеремия, из священников в Анафофе, поставлен пророком для народов и отвечает: «я не умею говорить, ибо я еще молод»."
      uk: "Єремія, зі священиків в Анатоті, покликаний бути пророком для народів і відповідає: «я ж не вмію говорити, бо ще молодий»."
      es: "Jeremías, de los sacerdotes de Anatot, es llamado profeta a las naciones y responde: «no sé hablar, porque soy niño»."
      pt: "Jeremias, dos sacerdotes de Anatote, é chamado profeta para as nações e responde: “não sei falar; pois sou um menino.”"
      de: "Jeremia, aus den Priestern in Anatot, wird zum Propheten für die Völker berufen und antwortet: „ich tauge nicht, zu predigen; denn ich bin zu jung“."
      fr: "Jérémie, d’entre les sacrificateurs d’Anathoth, est appelé prophète pour les nations et répond : « je ne sais point parler, car je suis un enfant »."
      pl: "Jeremiasz, z kapłanów w Anatot, zostaje powołany na proroka narodów i odpowiada: „nie umiem mówić, bom jest dziecięciem.”"
      it: "Geremia, di famiglia sacerdotale di Anatòt, è chiamato profeta delle nazioni e risponde: «io non so parlare, poiché non sono che un fanciullo»."
      nl: "Jeremia, uit de priesters te Anatot, wordt geroepen tot profeet voor de volken en antwoordt: “ik kan niet spreken, want ik ben jong.”"
      cs: "Jeremjáš z kněží v Anatótu je povolán za proroka národům a odpovídá: „neumím mluviti, nebo dítě jsem“."
      sv: "Jeremia, en av prästerna i Anatot, kallas till profet för folken och svarar: ”jag förstår icke att tala, ty jag är för ung.”"
      nb: "Jeremia, av prestene i Anatot, blir kalt til profet for folkene og svarer: «jeg forstår ikke å tale; for jeg er ung»."
      tl: "Si Jeremias, na mula sa mga saserdote sa Anathoth, ay tinawag na propeta sa mga bansa at sumagot, “hindi ako marunong magsalita: sapagka't ako'y bata.”"
      da: "Jeremias, af præsterne i Anatot, kaldes til profet for folkeslagene og svarer: »se, jeg forstaar ikke at tale, thi jeg er ung.«"
      sr: "Јеремија, из свештеника у Анатоту, бива позван за пророка народима и одговара: „Ево, не знам говорити, јер сам дете.“"
      hu: "Jeremiást, az anatóti papok egyikét prófétává hívják a népek számára, ő pedig így felel: „Ímé, én nem tudok beszélni; hiszen ifjú vagyok én!”"
      fi: "Jeremia, yksi Anatotin papeista, kutsutaan kansojen profeetaksi, ja hän vastaa: ”en minä kykene puhumaan, sillä minä olen nuori”."
      vi: "Giê-rê-mi, thuộc dòng thầy tế lễ ở A-na-tốt, được gọi làm tiên tri cho các nước, và thưa: “tôi chẳng biết nói chi, vì tôi là con trẻ”."
      ro: "Ieremia, dintre preoții din Anatot, este chemat să fie profet al neamurilor și răspunde: „iată nu știu grăì, că tânăr sunt eu”."
      bg: "Йеремия, от свещениците в Анатот, е призован за пророк на народите и отговаря: „не зная да говоря, защото съм дете.“"
  - place: a37c8e6 # Valley of Hinnom
    ref: Jer.19.1-Jer.19.11
    note:
      en: "The Lord sends him to the Valley of Hinnom to break a potter's earthen bottle before the elders: so He will break this people and this city."
      ru: "Господь посылает его в долину Еннома разбить перед старейшинами глиняный кувшин: так Он сокрушит народ сей и город сей."
      uk: "Господь посилає його до долини Гінном розбити перед старійшинами гончарну глиняну пляшку: так Він розіб’є цей народ і це місто."
      es: "El Señor lo envía al Valle de Hinnom a romper ante los ancianos una vasija de barro de alfarero: así quebrantará a este pueblo y a esta ciudad."
      pt: "O Senhor o envia ao Vale de Hinom para quebrar diante dos anciãos o jarro de barro de um oleiro: assim Ele quebrará este povo e esta cidade."
      de: "Der Herr sendet ihn ins Hinnomtal, um vor den Ältesten den irdenen Krug eines Töpfers zu zerbrechen: So wird er dieses Volk und diese Stadt zerbrechen."
      fr: "L’Éternel l’envoie à la vallée de Hinnom pour briser devant les anciens un vase de terre du potier : ainsi il brisera ce peuple et cette ville."
      pl: "Pan posyła go do Doliny Hinnom, aby przed starszymi stłukł gliniany dzban garncarza: tak Pan stłucze ten lud i to miasto."
      it: "Il Signore lo manda nella Valle di Innom a spezzare davanti agli anziani una brocca di terracotta del vasaio: così spezzerà questo popolo e questa città."
      nl: "De HEER zendt hem naar het Dal van Hinnom om voor de oudsten een aarden kruik van een pottenbakker te breken: zo zal Hij dit volk en deze stad breken."
      cs: "Hospodin ho posílá do Hinómova údolí, aby před staršími rozbil hliněnou láhev hrnčířovu: tak rozbije tento lid i toto město."
      sv: "Herren sänder honom till Hinnoms dal för att krossa en krukmakares lerflaska inför de äldste: så ska han krossa detta folk och denna stad."
      nb: "Herren sender ham til Hinnom-dalen for å knuse en pottemakers leirkrukke for de eldste: slik vil han knuse dette folk og denne by."
      tl: "Sinugo siya ng Panginoon sa Libis ng Hinnom upang basagin sa harap ng matatanda ang sisidlang lupa ng magpapalayok: ganito babasagin ng Panginoon ang bayang ito at ang lungsod na ito."
      da: "Herren sender ham til Hinnoms Dal for at knuse en pottemagers lerkrukke for de ældste: således vil han knuse dette folk og denne by."
      sr: "Господ га шаље у долину Еномову да пред старешинама разбије земљани крчаг: тако ће разбити овај народ и овај град."
      hu: "Az Úr a Hinnom-völgybe küldi, hogy a vének előtt összetörjön egy fazekas agyagpalackját: így töri össze majd ezt a népet és ezt a várost."
      fi: "Herra lähettää hänet Hinnomin laaksoon särkemään savenvalajan saviastian vanhinten edessä: niin hän särkee tämän kansan ja tämän kaupungin."
      vi: "Đức Giê-hô-va sai người đến Trũng Hi-nôm để đập bể cái bình đất của thợ gốm trước mặt các trưởng lão: Ngài cũng sẽ đập bể dân này và thành này như vậy."
      ro: "Domnul îl trimite în Valea Hinom să spargă un vas de lut al olarului înaintea bătrânilor: tot așa va sfărâma El poporul acesta și cetatea aceasta."
      bg: "Господ го изпраща в долината Еном да строши пред старейшините едно глинено грънчарско шише: така Той ще съкруши този народ и този град."
  - place: a15257a # Jerusalem
    ref: Jer.26.1-Jer.26.19
    year: "609 BC"
    note:
      en: 'For his words in the court of the Temple the priests and the prophets would have him die; the elders recall Micah: "Jerusalem shall become heaps."'
      ru: "За слова во дворе храма священники и пророки требуют его смерти; старейшины вспоминают пророчество Михея: «Иерусалим сделается грудою развалин»."
      uk: "За слова на дворі храму священики й пророки хочуть, щоб він умер; старійшини згадують Михея: «Ерусалим обернеться в купу розвалин»."
      es: "Por sus palabras en el atrio del Templo, los sacerdotes y los profetas quieren que muera; los ancianos recuerdan a Miqueas: «Jerusalem vendrá á ser montones»."
      pt: "Por suas palavras no átrio do Templo, os sacerdotes e os profetas querem que ele morra; os anciãos lembram Miqueias: “Jerusalém se tornará um amontoado de ruínas.”"
      de: "Wegen seiner Worte im Vorhof des Tempels wollen die Priester und Propheten ihn sterben lassen; die Ältesten erinnern an Micha: „Jerusalem wird zum Steinhaufen werden“."
      fr: "Pour ses paroles dans le parvis du temple, les sacrificateurs et les prophètes voudraient le faire mourir ; les anciens rappellent Michée : « Jérusalem deviendra un monceau de pierres »."
      pl: "Za jego słowa na dziedzińcu świątyni kapłani i prorocy chcą jego śmierci; starsi przypominają Micheasza: „Jeruzalem jako gromady rumu będzie.”"
      it: "Per le sue parole nel cortile del Tempio i sacerdoti e i profeti vogliono che muoia; gli anziani ricordano Michea: «Gerusalemme diventerà un monte di ruine»."
      nl: "Om zijn woorden in het voorhof van de tempel willen de priesters en de profeten hem laten sterven; de oudsten herinneren aan Micha: “Sion zal als een akker geploegd, en Jeruzalem tot steen hopen worden.”"
      cs: "Pro jeho slova v nádvoří chrámu ho kněží a proroci chtějí usmrtit; starší připomínají Micheáše: „Sion jako pole orán bude, a Jeruzalém jako hromady“."
      sv: "För sina ord i templets förgård vill prästerna och profeterna döda honom; de äldste påminner om Mika: ”Jerusalem skall bliva en stenhop.”"
      nb: "For sine ord i tempelgården vil prestene og profetene ha ham drept; de eldste minner om Mika: «Jerusalem bli til grusdynger»."
      tl: "Dahil sa kaniyang mga salita sa looban ng Templo, nais ng mga saserdote at ng mga propeta na siya'y mamatay; naalala ng matatanda si Mikas: “ang Jerusalem ay magiging mga bunton.”"
      da: "For hans ord i templets forgård vil præsterne og profeterne have ham dræbt; de ældste mindes Mika: »Jerusalem [skal] blive til Stenhobe«."
      sr: "Због његових речи у дворишту храма свештеници и пророци хтели би да он умре; старешине се сећају Михе: „Јерусалим ће постати гомила.“"
      hu: "A templom udvarán mondott szavaiért a papok és a próféták halálra akarják adni; a vének Mikeásra emlékeztetnek: „Jeruzsálem elpusztul”."
      fi: "Temppelin esipihalla puhumiensa sanojen tähden papit ja profeetat tahtovat hänen kuolevan; vanhimmat muistavat Miikan: ”Jerusalem tulee kiviraunioksi”."
      vi: "Vì những lời người nói trong hành lang đền thờ, các thầy tế lễ và các tiên tri muốn giết người; các trưởng lão nhắc đến Mi-chê: “Giê-ru-sa-lem sẽ trở nên gò đống”."
      ro: "Pentru cuvintele sale din curtea Templului, preoții și profeții vor să-l omoare; bătrânii îl amintesc pe Mica: „Ierusalimul ca o movilă de pietre va fì”."
      bg: "Заради думите му в двора на храма свещениците и пророците искат смъртта му; старейшините припомнят Михей: „Ерусалим ще бъде грамади от развалини“."
  - place: ab34789 # Anathoth
    ref: Jer.32.1-Jer.32.15
    year: "588 BC"
    note:
      en: 'Shut up in the court of the prison while the army of the king of Babylon besieges Jerusalem, he buys his cousin''s field in Anathoth: "Houses and fields and vineyards shall be possessed again in this land."'
      ru: "Заключённый во дворе стражи, когда войско царя Вавилонского осаждает Иерусалим, он покупает поле двоюродного брата в Анафофе: «домы и поля и виноградники будут снова покупаемы в земле сей»."
      uk: "Замкнений на дворі в’язниці, поки військо царя Вавилона облягає Єрусалим, він купує поле свого двоюрідного брата в Анатоті: «Будуть колись ізнов купуватись доми й поля й виноградники в сїй землї»."
      es: "Encerrado en el patio de la cárcel mientras el ejército del rey de Babilonia sitia Jerusalén, compra el campo de su primo en Anatot: «Aun se comprarán casas, y heredades, y viñas en esta tierra»."
      pt: "Preso no pátio da guarda enquanto o exército do rei da Babilônia cerca Jerusalém, compra o campo de seu primo em Anatote: “Casas, campos e vinhas ainda serão comprados novamente nesta terra.”"
      de: "Im Vorhof des Gefängnisses eingeschlossen, während das Heer des Königs von Babylon Jerusalem belagert, kauft er den Acker seines Vetters in Anatot: „Noch soll man Häuser, Äcker und Weinberge kaufen in diesem Lande.“"
      fr: "Enfermé dans la cour de la prison pendant que l’armée du roi de Babylone assiège Jérusalem, il achète le champ de son cousin à Anathoth : « On achètera encore des maisons, des champs et des vignes, dans ce pays. »"
      pl: "Zamknięty na dziedzińcu straży, gdy wojsko króla Babilonu oblega Jerozolimę, kupuje pole swego stryjecznego brata w Anatot: „Jeszcze będą kupowane domy, i role, i winnice w tej ziemi.”"
      it: "Rinchiuso nel cortile della prigione mentre l’esercito del re di Babilonia assedia Gerusalemme, compra il campo di suo cugino ad Anatòt: «Si compreranno ancora delle case, de’ campi e delle vigne, in questo paese»."
      nl: "Opgesloten in het voorhof van de gevangenis terwijl het leger van de koning van Babylon Jeruzalem belegert, koopt hij het veld van zijn neef te Anatot: “Er zullen nog huizen, en velden, en wijngaarden in dit land gekocht worden.”"
      cs: "Zavřen v nádvoří stráže, zatímco vojsko krále babylonského obléhá Jeruzalém, kupuje pole svého bratrance v Anatótu: „Ještěť kupováni budou domové, a rolí, i vinice v zemi této.“"
      sv: "Instängd i fängelsegården medan den babyloniske kungens här belägrar Jerusalem köper han sin kusins åker i Anatot: ”Ännu en gång skall man komma att i detta land köpa hus och åkrar och vingårdar.”"
      nb: "Innestengt i fengselsgården mens kongen av Babylons hær kringsetter Jerusalem, kjøper han sin fetters mark i Anatot: «Ennu en gang skal det kjøpes hus og marker og vingårder i dette land.»"
      tl: "Nakakulong sa looban ng bantay habang kinukubkob ng hukbo ng hari ng Babilonia ang Jerusalem, binili niya ang bukid ng kaniyang pinsan sa Anathoth: “Mga bahay, at mga parang, at mga ubasan ay mangabibili pa uli sa lupaing ito.”"
      da: "Spærret inde i fængslets forgård, mens Babylons konges hær belejrer Jerusalem, køber han sin fætters mark i Anatot: »Endnu skal der købes Huse og Agre og Vingaarde i dette Land.«"
      sr: "Затворен у трему од тамнице док војска цара вавилонског опседа Јерусалим, купује њиву свог рођака у Анатоту: „Још ће се куповати куће и њиве и виногради у овој земљи.“"
      hu: "A börtön udvarában elzárva, amíg Babilon királyának serege ostromolja Jeruzsálemet, megveszi unokatestvére mezejét Anatótban: „Még házakat, mezőket és szőlőket fognak venni e földön.”"
      fi: "Vankilan esipihaan suljettuna, kun Babylonin kuninkaan sotajoukko piirittää Jerusalemia, hän ostaa serkkunsa pellon Anatotissa: ”Vielä kerran ostetaan tässä maassa taloja ja peltoja ja viinitarhoja”."
      vi: "Bị giam trong hành lang lính canh khi đạo binh của vua Ba-by-lôn vây Giê-ru-sa-lem, người mua ruộng của anh em chú bác mình ở A-na-tốt: “Người ta sẽ còn mua nhà, ruộng, và vườn nho trong đất nầy.”"
      ro: "Închis în curtea temniței, în timp ce oastea regelui Babilonului asediază Ierusalimul, cumpără ogorul vărului său din Anatot: „încă se vor mai cumpărà case și țarine și vii în pământul acesta”."
      bg: "Затворен в двора на тъмницата, докато войската на вавилонския цар обсажда Йерусалим, той купува нивата на братовчед си в Анатот: „Къщи, и ниви, и лозя ще се добият пак в таз земя.“"
  - place: a15257a # Jerusalem
    ref: Jer.38.6-Jer.38.28
    year: "587 BC"
    note:
      en: "Thrown into a dungeon in the court of the prison, he sinks in the mire; Ebed-melech the Ethiopian draws him out with cords, and he stays in the court of the prison until the day Jerusalem is taken."
      ru: "Брошенный в яму во дворе стражи, он погружается в грязь; Авдемелех Ефиоплянин вытаскивает его на верёвках, и он остаётся во дворе стражи до того дня, когда взят Иерусалим."
      uk: "Кинутий до рову на дворі в’язниці, він грузне в багнюці; ефіоп Ебед-Мелех витягає його мотузками, і він залишається на дворі в’язниці до дня, коли Єрусалим буде взято."
      es: "Arrojado a un calabozo en el patio de la cárcel, se hunde en el lodo; Ebed-melec el etíope lo saca con cuerdas, y permanece en el patio de la cárcel hasta el día en que Jerusalén es tomada."
      pt: "Lançado numa masmorra no pátio da guarda, afunda na lama; Ebede-Meleque, o etíope, o tira com cordas, e ele permanece no pátio da guarda até o dia em que Jerusalém é tomada."
      de: "In ein Verlies im Vorhof des Gefängnisses geworfen, versinkt er im Schlamm; Ebed-Melech, der Äthiopier, zieht ihn mit Stricken heraus, und er bleibt im Vorhof des Gefängnisses bis zu dem Tag, an dem Jerusalem eingenommen wird."
      fr: "Jeté dans une citerne de la cour de la prison, il s’enfonce dans la boue ; Ébed-Mélec l’Éthiopien le fait remonter avec des cordes, et il reste dans la cour de la prison jusqu’au jour où Jérusalem est prise."
      pl: "Wrzucony do lochu na dziedzińcu straży, grzęźnie w błocie; Ebed-Melek Etiopczyk wyciąga go sznurami, a on pozostaje na dziedzińcu straży aż do dnia zdobycia Jerozolimy."
      it: "Gettato in una cisterna nel cortile della prigione, affonda nel fango; Ebed-Melech l’Etiope lo tira fuori con delle corde, ed egli resta nel cortile della prigione fino al giorno in cui Gerusalemme è presa."
      nl: "In een kerker in het voorhof van de gevangenis geworpen zakt hij weg in de modder; Ebed-Melech, de Ethiopiër, trekt hem met touwen omhoog, en hij blijft in het voorhof van de gevangenis tot de dag dat Jeruzalem wordt ingenomen."
      cs: "Vržen do žaláře v nádvoří stráže, vězí v bahně; Eved-melek Etiopan ho vytahuje provazy a on zůstává v nádvoří stráže až do dne dobytí Jeruzaléma."
      sv: "Nedkastad i en fängelsehåla i fängelsegården sjunker han i dyn; etiopiern Eved-Melek drar upp honom med rep, och han blir kvar i fängelsegården till den dag då Jerusalem intas."
      nb: "Kastet i en brønn i fengselsgården synker han ned i dyndet; Ebed-Melek, etiopieren, drar ham opp med rep, og han blir i fengselsgården til den dag Jerusalem blir inntatt."
      tl: "Inihagis sa isang hukay sa looban ng bantay, lumubog siya sa burak; iniahon siya ni Ebed-melec na taga-Etiopia sa pamamagitan ng mga lubid, at nanatili siya sa looban ng bantay hanggang sa araw na masakop ang Jerusalem."
      da: "Kastet i en cisterne i fængslets forgård synker han ned i dyndet; etiopieren Ebed-Melek trækker ham op med reb, og han bliver i fængslets forgård til den dag, Jerusalem indtages."
      sr: "Бачен у јаму у трему од тамнице, тоне у глиб; Авдемелех Етиопљанин извлачи га ужима, и он остаје у трему од тамнице до дана кад је Јерусалим освојен."
      hu: "A börtön udvarán levő verembe vetik, és elmerül az iszapban; az etióp Ebed-Melek köteleken húzza ki, ő pedig a börtön udvarában marad Jeruzsálem elfoglalásának napjáig."
      fi: "Vankilan esipihan kuoppaan heitettynä hän vajoaa liejuun; etiopialainen Ebed-Melek vetää hänet ylös köysillä, ja hän pysyy vankilan esipihassa siihen päivään asti, jona Jerusalem vallataan."
      vi: "Bị quăng xuống một cái hố trong hành lang lính canh, người bị lút dưới bùn; Ê-bết-Mê-lết, người Ê-thi-ô-bi, dùng dây kéo người lên, và người ở trong hành lang lính canh cho đến ngày Giê-ru-sa-lem bị chiếm."
      ro: "Aruncat într-o groapă din curtea temniței, se afundă în noroi; Ebed-Melec etiopianul îl scoate cu funii, iar el rămâne în curtea temniței până în ziua în care este cucerit Ierusalimul."
      bg: "Хвърлен в ров в двора на тъмницата, той затъва в тинята; етиопецът Авдемелех го изтегля с въжета и той остава в двора на тъмницата до деня, в който Йерусалим е превзет."
  - place: a6d57ed # Ramah
    ref: Jer.40.1-Jer.40.5
    year: "587 BC"
    note:
      en: "At Ramah, among the captives in chains bound for Babylon, Nebuzar-adan sets him free to go where he will."
      ru: "В Раме, среди скованных пленников, которых ведут в Вавилон, Навузардан освобождает его и отпускает, куда он захочет."
      uk: "У Рамі, серед полонених у кайданах, що йдуть до Вавилона, Навузардан звільняє його йти, куди він схоче."
      es: "En Ramá, entre los cautivos encadenados rumbo a Babilonia, Nabuzaradán lo deja libre para que vaya adonde quiera."
      pt: "Em Ramá, entre os cativos acorrentados a caminho da Babilônia, Nebuzaradã o liberta para ir aonde quiser."
      de: "In Rama, unter den gefesselten Gefangenen auf dem Weg nach Babylon, lässt Nebusaradan ihn frei, damit er gehen kann, wohin er will."
      fr: "À Rama, parmi les captifs enchaînés en route vers Babylone, Nebuzaradan le met en liberté d’aller où il voudra."
      pl: "W Ramie, wśród jeńców w kajdanach prowadzonych do Babilonu, Nebuzaradan uwalnia go, aby poszedł, dokąd zechce."
      it: "A Rama, fra i prigionieri in catene diretti a Babilonia, Nebuzaradan lo mette in libertà perché vada dove vuole."
      nl: "Te Rama, onder de gevangenen in boeien op weg naar Babylon, laat Nebuzaradan hem vrij om te gaan waarheen hij wil."
      cs: "V Rámě, mezi spoutanými zajatci na cestě do Babylóna, ho Nebuzaradan propouští, aby šel, kam chce."
      sv: "I Rama, bland de fjättrade fångarna på väg till Babylon, sätter Nebusaradan honom fri att gå vart han vill."
      nb: "I Rama, blant fangene i lenker på vei til Babylon, setter Nebusaradan ham fri til å gå hvor han vil."
      tl: "Sa Rama, sa gitna ng mga bihag na nakagapos na patungong Babilonia, pinalaya siya ni Nabuzaradan upang pumaroon kung saan niya naisin."
      da: "I Rama, blandt de lænkede fanger på vej til Babylon, sætter Nebuzaradan ham fri til at gå, hvorhen han vil."
      sr: "У Рами, међу робљем у оковима на путу у Вавилон, Невузардан га пушта да иде куда хоће."
      hu: "Rámában, a Babilonba induló, láncra vert foglyok között Nebuzaradán szabadon bocsátja, hogy oda menjen, ahová akar."
      fi: "Ramassa, Babyloniin vietävien kahlehdittujen vankien joukossa, Nebusaradan vapauttaa hänet menemään minne tahtoo."
      vi: "Tại Ra-ma, giữa những phu tù bị xiềng đem qua Ba-by-lôn, Nê-bu-xa-ra-đan thả người đi đến nơi nào tùy ý."
      ro: "La Rama, printre captivii legați în lanțuri pentru Babilon, Nebuzaradan îl eliberează să meargă unde vrea."
      bg: "В Рама, сред оковените пленници, водени към Вавилон, Навузардан го освобождава да иде, където иска."
  - place: a736f6c # Mizpah
    ref: Jer.40.6
    year: "587 BC"
    note:
      en: "He stays with Gedaliah at Mizpah, among the people left in the land."
      ru: "Он остаётся с Годолией в Массифе, среди народа, оставшегося в стране."
      uk: "Він залишається з Гедалією в Міцпі, серед людей, що лишилися в краї."
      es: "Se queda con Gedalías en Mizpa, entre la gente que ha quedado en el país."
      pt: "Fica com Gedalias em Mispá, entre o povo deixado na terra."
      de: "Er bleibt bei Gedalja in Mizpa unter dem Volk, das im Land zurückgeblieben ist."
      fr: "Il demeure auprès de Guedalia à Mitspa, parmi le peuple resté dans le pays."
      pl: "Zatrzymuje się u Gedaliasza w Mispie, wśród ludzi pozostawionych w kraju."
      it: "Rimane con Godolia a Mizpa, fra il popolo lasciato nel paese."
      nl: "Hij blijft bij Gedalja te Mizpa, onder het volk dat in het land is achtergebleven."
      cs: "Zůstává u Gedaljáše v Micpě mezi lidem, který v zemi zbyl."
      sv: "Han stannar hos Gedalja i Mispa, bland dem som lämnats kvar i landet."
      nb: "Han blir hos Gedalja i Mispa, blant folket som var igjen i landet."
      tl: "Nanatili siya kay Gedalias sa Mizpa, sa gitna ng mga taong naiwan sa lupain."
      da: "Han bliver hos Gedalja i Mispa, blandt det folk, der er blevet tilbage i landet."
      sr: "Остаје код Годолије у Масфи, међу народом који је остао у земљи."
      hu: "Gedaljánál marad Micpában, az országban hagyott nép között."
      fi: "Hän jää Gedaljan luo Mispaan maahan jääneen kansan keskuuteen."
      vi: "Người ở với Ghê-đa-lia tại Mích-ba, giữa những người còn lại trong xứ."
      ro: "Rămâne cu Ghedalia la Mițpa, printre oamenii lăsați în țară."
      bg: "Той остава при Годолия в Мицпа, сред народа, оставен в земята."
  - place: adb008c # Tahpanhes
    ref: Jer.43.5-Jer.43.13
    year: "587 BC"
    note:
      en: "Taken down to Egypt against his word, at Tahpanhes he is told to hide great stones at the entry of Pharaoh's house: Nebuchadnezzar will set his throne upon them."
      ru: "Уведённый в Египет вопреки его слову, в Тафнисе ему велено скрыть большие камни при входе в дом фараона: на них Навуходоносор поставит свой престол."
      uk: "Відведений до Єгипту всупереч своєму слову, у Тафнісі він отримує веління сховати великі камені при вході до дому фараона: на них Навуходоносор поставить свій престол."
      es: "Llevado a Egipto contra su palabra, en Tafnes recibe la orden de esconder grandes piedras a la entrada de la casa del Faraón: Nabucodonosor pondrá su trono sobre ellas."
      pt: "Levado ao Egito contra a sua palavra, em Tafnes recebe a ordem de esconder grandes pedras à entrada da casa do Faraó: Nabucodonosor porá nelas o seu trono."
      de: "Gegen sein Wort nach Ägypten hinabgeführt, wird ihm in Tachpanhes gesagt, große Steine am Eingang des Hauses des Pharao zu verbergen: Nebukadnezar wird seinen Thron darauf aufstellen."
      fr: "Emmené en Égypte contre sa parole, il reçoit à Tachpanès l’ordre de cacher de grandes pierres à l’entrée de la maison de Pharaon : Nebucadnetsar y placera son trône."
      pl: "Zabrany do Egiptu wbrew swemu słowu, w Tachpanches otrzymuje polecenie ukrycia wielkich kamieni u wejścia do domu Faraona: Nabuchodonozor postawi na nich swój tron."
      it: "Condotto in Egitto contro la sua parola, a Tafni riceve l’ordine di nascondere grandi pietre all’ingresso della casa del faraone: Nabucodonosor vi porrà il suo trono."
      nl: "Tegen zijn woord in naar Egypte gebracht, krijgt hij te Tachpanhes de opdracht grote stenen te verbergen bij de ingang van het huis van Farao: Nebukadnessar zal er zijn troon op zetten."
      cs: "Navzdory svému slovu odvlečen do Egypta, je v Tachpanchés poučen, aby u vchodu do faraonova domu ukryl veliké kameny: Nebukadnesar na nich postaví svůj trůn."
      sv: "Bortförd till Egypten mot sitt ord får han i Tachpanches order att gömma stora stenar vid ingången till faraos hus: Nebukadnessar ska sätta sin tron på dem."
      nb: "Ført ned til Egypt mot sitt ord får han i Tahpanhes befaling om å skjule store stener ved inngangen til Faraos hus: Nebukadnesar skal sette sin trone over dem."
      tl: "Dinala sa Egipto laban sa kaniyang salita, sa Taphnes ay sinabihan siyang magtago ng malalaking bato sa pasukan ng bahay ni Faraon: ilalagay doon ni Nabucodonosor ang kaniyang luklukan."
      da: "Ført ned til Egypten mod sit ord får han i Takpanes besked om at skjule store sten ved indgangen til Faraos hus: Nebukadnezar skal sætte sin trone på dem."
      sr: "Одведен у Египат противно својој речи, у Тафнесу добија заповест да сакрије велико камење на улазу у кућу фараонову: Навуходоносор ће на њему поставити свој престо."
      hu: "Szava ellenére Egyiptomba viszik; Tahpanhészben azt a parancsot kapja, hogy rejtsen el nagy köveket a fáraó házának bejáratánál: Nabukodonozor azokra állítja majd trónját."
      fi: "Egyptiin vietynä hänen sanaansa vastaan hänen käsketään Tahpanhesissa kätkeä suuria kiviä faraon talon sisäänkäynnille: Nebukadnessar pystyttää niiden päälle valtaistuimensa."
      vi: "Bị đem xuống Ê-díp-tô trái với lời mình, tại Tác-pha-nết người được truyền giấu những cục đá lớn nơi cửa nhà Pha-ra-ôn: Nê-bu-cát-nết-sa sẽ đặt ngai mình trên những đá ấy."
      ro: "Dus în Egipt împotriva cuvântului său, la Tahpanes i se poruncește să ascundă pietre mari la intrarea casei lui Faraon: Nebucadnețar își va așeza tronul pe ele."
      bg: "Отведен в Египет против словото му, в Тафнис му е казано да скрие големи камъни при входа на фараоновия дом: Навуходоносор ще постави престола си върху тях."
