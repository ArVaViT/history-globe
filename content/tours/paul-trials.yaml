# Paul's arrest and trials, Acts 21:27-26:32, in the order of the text, between the third
# journey and the voyage to Rome. The tour's year (AD 57) is the usual date of the arrest,
# a point for the map; Festus succeeds Felix "after two years" (24:27), c. AD 59, and the
# stops from then carry that year. Antipatris (23:31) has no point on the map.
id: paul-trials
title:
  en: "Paul's arrest and trials"
  ru: "Арест и суды Павла"
  uk: "Арешт і суди над Павлом"
  es: "Arresto y juicios de Pablo"
  pt: "A prisão e os julgamentos de Paulo"
  de: "Verhaftung und Prozesse des Paulus"
  fr: "L’arrestation et les procès de Paul"
  pl: "Pojmanie i procesy Pawła"
  it: "L’arresto e i processi di Paolo"
  nl: "De gevangenneming en de processen van Paulus"
  cs: "Pavlovo zatčení a soudy"
  sv: "Paulus’ gripande och rättegångar"
  nb: "Paulus' pågripelse og rettergang"
  tl: "Ang pagkakadakip at mga paglilitis kay Pablo"
  da: "Paulus' anholdelse og retssager"
  sr: "Павлово хапшење и суђења"
year: "AD 57"
people: ["Paul@Act.7.58-2Pe"]
approximate: true
stops:
  - place: a15257a # Jerusalem
    ref: Acts.21.27-Acts.23.11
    note:
      en: 'Seized in the Temple and bound with two chains, Paul speaks to the people and before the council; by night the Lord stands by him: "as thou hast testified of me in Jerusalem, so must thou bear witness also at Rome."'
      ru: "Схваченный в храме и скованный двумя цепями, Павел говорит к народу и перед синедрионом; ночью Господь, явившись ему, говорит: «как ты свидетельствовал о Мне в Иерусалиме, так надлежит тебе свидетельствовать и в Риме»."
      uk: "Схоплений у храмі й закутий у два ланцюги, Павло говорить до народу й перед радою; уночі Господь стає біля нього: «як бо ти сьвідкував про мене в Єрусалимі, так ти маєш і в Римі сьвідкувати»."
      es: "Apresado en el Templo y atado con dos cadenas, Pablo habla al pueblo y ante el concilio; de noche el Señor se le presenta: «como has testificado de mí en Jerusalem, así es menester testifiques también en Roma»."
      pt: "Preso no Templo e atado com duas correntes, Paulo fala ao povo e diante do conselho; à noite o Senhor está ao seu lado: “assim como você testemunhou a meu respeito em Jerusalém, assim você deve testemunhar também em Roma.”"
      de: "Im Tempel ergriffen und mit zwei Ketten gebunden, spricht Paulus zum Volk und vor dem Hohen Rat; in der Nacht steht der Herr ihm bei: „Sei getrost, Paulus! denn wie du von mir zu Jerusalem gezeugt hast, also mußt du auch zu Rom zeugen.“"
      fr: "Saisi dans le temple et lié de deux chaînes, Paul parle au peuple et devant le sanhédrin ; la nuit, le Seigneur se tient près de lui : « de même que tu as rendu témoignage de moi dans Jérusalem, il faut aussi que tu rendes témoignage dans Rome »."
      pl: "Schwytany w świątyni i skuty dwoma łańcuchami, Paweł przemawia do ludu i przed radą; w nocy Pan staje przy nim: „jakoś o mnie świadczył w Jeruzalemie, tak musisz świadczyć i w Rzymie.”"
      it: "Preso nel Tempio e legato con due catene, Paolo parla al popolo e davanti al sinedrio; di notte il Signore gli sta accanto: «come hai reso testimonianza di me a Gerusalemme, così bisogna che tu la renda anche a Roma»."
      nl: "In de tempel gegrepen en met twee ketenen gebonden, spreekt Paulus tot het volk en voor de Raad; 's nachts staat de Heere hem bij: “gelijk gij te Jeruzalem van Mij betuigd hebt alzo moet gij ook te Rome getuigen.”"
      cs: "Pavel, chycen v chrámě a spoután dvěma řetězy, mluví k lidu i před radou; v noci u něho stojí Pán: „jakož jsi svědčil o mně v Jeruzalémě, tak musíš svědčiti i v Římě“."
      sv: "Gripen i templet och bunden med två kedjor talar Paulus till folket och inför rådet; om natten står Herren hos honom: ”såsom du har vittnat om mig i Jerusalem, så måste du ock vittna i Rom.”"
      nb: "Grepet i templet og bundet med to lenker taler Paulus til folket og for rådet; om natten står Herren ham bi: «likesom du vidnet om mig i Jerusalem, således skal du også vidne i Rom.»"
      tl: "Dinakip sa Templo at ginapos ng dalawang tanikala, nagsalita si Pablo sa bayan at sa harap ng sanedrin; kinagabihan ay lumapit sa kaniya ang Panginoon: “kung paano ang pagkapatotoo mo tungkol sa akin sa Jerusalem, ay kailangang patotohanan mo rin gayon sa Roma.”"
      da: "Grebet i templet og bundet med to lænker taler Paulus til folket og for rådet; om natten står Herren ham bi: »ligesom du har vidnet om mig i Jerusalem, saaledes skal du ogsaa vidne i Rom.«"
      sr: "Ухваћен у храму и свезан двоструким оковима, Павле говори народу и пред већем; те ноћи Господ стаје пред њега: „јер као што си сведочио за мене у Јерусалиму, тако ти ваља и у Риму сведочити.“"
  - place: a58735e # Caesarea
    ref: Acts.23.23-Acts.24.27
    note:
      en: "Led out by night under guard by way of Antipatris to Caesarea, he answers before the governor Felix, who trembles as Paul reasons of righteousness and judgment to come, and keeps him bound two years."
      ru: "Ночью под стражей его уводят через Антипатриду в Кесарию; он отвечает перед правителем Феликсом, который приходит в страх от слов о правде и будущем суде и два года держит его в узах."
      uk: "Виведений уночі під охороною через Антипатриду до Кесарії, він відповідає перед намісником Феликсом, який тремтить, коли Павло розмірковує про праведність і прийдешній суд, і тримає його в кайданах два роки."
      es: "Conducido de noche bajo custodia por Antípatris hasta Cesarea, responde ante el gobernador Félix, que se estremece mientras Pablo discurre sobre la justicia y el juicio venidero, y lo mantiene atado dos años."
      pt: "Levado de noite sob guarda, por Antipátris, a Cesareia, responde diante do governador Félix, que treme quando Paulo trata da justiça e do juízo vindouro, e o mantém preso por dois anos."
      de: "Bei Nacht unter Bewachung über Antipatris nach Caesarea geführt, verantwortet er sich vor dem Statthalter Felix, der erschrickt, als Paulus von der Gerechtigkeit und dem künftigen Gericht redet, und ihn zwei Jahre lang in Haft hält."
      fr: "Emmené de nuit sous escorte par Antipatris jusqu’à Césarée, il comparaît devant le gouverneur Félix, qui est effrayé quand Paul parle de la justice et du jugement à venir, et le garde enchaîné deux ans."
      pl: "Wyprowadzony nocą pod strażą przez Antypatris do Cezarei, broni się przed namiestnikiem Feliksem, który drży, gdy Paweł rozprawia o sprawiedliwości i przyszłym sądzie, i przetrzymuje go w więzach dwa lata."
      it: "Condotto fuori di notte sotto scorta per Antipatride fino a Cesarea, risponde davanti al governatore Felice, che trema quando Paolo parla di giustizia e di giudizio futuro, e lo tiene in catene per due anni."
      nl: "'s Nachts onder bewaking via Antipatris naar Caesarea gebracht, verantwoordt hij zich voor stadhouder Felix, die beeft als Paulus spreekt over rechtvaardigheid en het komende oordeel, en hem twee jaar gebonden houdt."
      cs: "Veden v noci pod stráží přes Antipatridu do Cesareje, odpovídá před správcem Felixem, který se zděsí, když Pavel mluví o spravedlnosti a budoucím soudu, a drží ho spoutaného dva roky."
      sv: "Förd ut om natten under bevakning via Antipatris till Caesarea svarar han inför ståthållaren Felix, som blir förskräckt när Paulus talar om rättfärdighet och den tillstundande domen, och som håller honom bunden i två år."
      nb: "Ført ut om natten under bevoktning, via Antipatris til Cæsarea, forsvarer han seg for landshøvdingen Feliks, som blir forferdet da Paulus taler om rettferd og den kommende dom, og som holder ham bundet i to år."
      tl: "Inilabas nang gabi sa ilalim ng bantay, dumaan sa Antipatris patungong Cesarea, at sumagot siya sa harap ng gobernador na si Felix, na nanginig nang pangatwiranan ni Pablo ang katuwiran at ang paghuhuling darating, at pinanatili siyang gapos nang dalawang taon."
      da: "Ført ud om natten under bevogtning via Antipatris til Cæsarea svarer han for landshøvdingen Felix, som bæver, da Paulus taler om retfærdighed og den kommende dom, og som holder ham bundet i to år."
      sr: "Изведен ноћу под стражом преко Антипатриде у Цезареју, одговара пред намесником Феликсом, који се уплашио кад је Павле говорио о правди и будућем суду, и држи га свезаног две године."
  - place: a15257a # Jerusalem
    ref: Acts.25.1-Acts.25.5
    year: "AD 59"
    note:
      en: "Festus, the new governor, goes up to Jerusalem, where the high priest and the chief of the Jews ask for Paul to be brought there, laying wait to kill him on the way."
      ru: "Новый правитель Фест приходит в Иерусалим, и первосвященник со знатнейшими из Иудеев просят вызвать Павла туда, злоумышляя убить его на дороге."
      uk: "Фест, новий намісник, їде до Єрусалима, де первосвященик і старшини юдеїв просять привести туди Павла, підстерігаючи, щоб убити його дорогою."
      es: "Festo, el nuevo gobernador, sube a Jerusalén, donde el sumo sacerdote y los principales de los judíos piden que Pablo sea llevado allá, tendiéndole una emboscada para matarlo en el camino."
      pt: "Festo, o novo governador, sobe a Jerusalém, onde o sumo sacerdote e os principais dos judeus pedem que Paulo seja levado para lá, armando emboscada para matá-lo no caminho."
      de: "Festus, der neue Statthalter, geht nach Jerusalem hinauf, wo der Hohepriester und die Vornehmsten der Juden darum bitten, Paulus dorthin kommen zu lassen, und ihm unterwegs auflauern, um ihn zu töten."
      fr: "Festus, le nouveau gouverneur, monte à Jérusalem, où le grand-prêtre et les principaux des Juifs demandent que Paul y soit amené, lui dressant des embûches pour le tuer en chemin."
      pl: "Festus, nowy namiestnik, udaje się do Jerozolimy, gdzie arcykapłan i przedniejsi Żydzi proszą, aby Pawła tam sprowadzono, czyhając na to, by zabić go w drodze."
      it: "Festo, il nuovo governatore, sale a Gerusalemme, dove il sommo sacerdote e i principali dei Giudei chiedono che Paolo vi sia portato, tendendogli un agguato per ucciderlo lungo la via."
      nl: "Festus, de nieuwe stadhouder, gaat naar Jeruzalem, waar de hogepriester en de leiders van de Joden vragen dat Paulus daarheen wordt gebracht, terwijl zij op de weg een hinderlaag leggen om hem te doden."
      cs: "Festus, nový správce, jde do Jeruzaléma, kde nejvyšší kněz a přední Židé žádají, aby byl Pavel přiveden tam, a číhají, aby ho cestou zabili."
      sv: "Festus, den nye ståthållaren, drar upp till Jerusalem, där översteprästen och judarnas främsta begär att Paulus ska föras dit, medan de lurpassar på att döda honom på vägen."
      nb: "Festus, den nye landshøvdingen, drar opp til Jerusalem, hvor yppersteprestene og jødenes første menn ber om at Paulus må føres dit, mens de lurer på å drepe ham underveis."
      tl: "Umahon sa Jerusalem si Festo, ang bagong gobernador, kung saan hiniling ng pinunong saserdote at ng mga pinuno ng mga Judio na dalhin doon si Pablo, na nag-aabang upang patayin siya sa daan."
      da: "Festus, den nye landshøvding, drager op til Jerusalem, hvor ypperstepræsten og jødernes ledende mænd beder om, at Paulus føres derhen, mens de lurer på at dræbe ham undervejs."
      sr: "Фист, нови намесник, иде у Јерусалим, где првосвештеник и главари јудејски траже да Павле буде доведен тамо, а на путу постављају заседу да га убију."
  - place: a58735e # Caesarea
    ref: Acts.25.6-Acts.26.32
    year: "AD 59"
    note:
      en: 'Back in Caesarea Paul appeals to Caesar, and before Agrippa tells of his conversion; Agrippa answers: "Almost thou persuadest me to be a Christian."'
      ru: "В Кесарии Павел требует суда кесарева и перед Агриппой рассказывает о своём обращении; Агриппа отвечает: «ты немного не убеждаешь меня сделаться Христианином»."
      uk: "Повернувшись до Кесарії, Павло звертається до кесаря, а перед Агриппою розповідає про своє навернення; Агриппа відповідає: «О мало не вговорив єси мене бути Християнином»."
      es: "De vuelta en Cesarea Pablo apela al César, y ante Agripa cuenta su conversión; Agripa responde: «Por poco me persuades á ser Cristiano»."
      pt: "De volta a Cesareia, Paulo apela a César e diante de Agripa conta a sua conversão; Agripa responde: “Com um pouco de persuasão você está tentando me fazer cristão?”"
      de: "Wieder in Caesarea beruft sich Paulus auf den Kaiser und erzählt vor Agrippa von seiner Bekehrung; Agrippa antwortet: „Es fehlt nicht viel, du überredest mich, daß ich ein Christ würde.“"
      fr: "De retour à Césarée, Paul en appelle à César et, devant Agrippa, raconte sa conversion ; Agrippa répond : « Tu vas bientôt me persuader de devenir chrétien ! »"
      pl: "Z powrotem w Cezarei Paweł odwołuje się do cesarza, a przed Agryppą opowiada o swoim nawróceniu; Agryppa odpowiada: „Mało byś mnie nie namówił, żebym został chrześcijaninem.”"
      it: "Di nuovo a Cesarea Paolo si appella a Cesare e davanti ad Agrippa racconta la sua conversione; Agrippa risponde: «Per poco non mi persuadi a diventar cristiano»."
      nl: "Terug in Caesarea doet Paulus een beroep op de keizer en vertelt voor Agrippa over zijn bekering; Agrippa antwoordt: “Gij beweegt mij bijna een Christen te worden.”"
      cs: "Zpět v Cesareji se Pavel odvolává k císaři a před Agrippou vypráví o svém obrácení; Agrippa odpovídá: „Téměř bys mne k tomu naklonil, abych byl křesťanem.“"
      sv: "Åter i Caesarea vädjar Paulus till kejsaren och berättar inför Agrippa om sin omvändelse; Agrippa svarar: ”Föga fattas att du övertalar mig och gör mig till kristen.”"
      nb: "Tilbake i Cæsarea appellerer Paulus til keiseren, og for Agrippa forteller han om sin omvendelse; Agrippa svarer: «Det mangler lite i at du overtaler mig til å bli en kristen.»"
      tl: "Pagbalik sa Cesarea, umapela si Pablo kay Cesar, at sa harap ni Agripa ay isinaysay ang kaniyang pagbabalik-loob; sumagot si Agripa: “Sa kakaunting paghikayat ay ibig mo akong maging Cristiano.”"
      da: "Tilbage i Cæsarea påkalder Paulus kejseren, og for Agrippa fortæller han om sin omvendelse; Agrippa svarer: »Der fattes lidet i, at du overtaler mig til at blive en Kristen.«"
      sr: "Опет у Цезареји Павле призива Цезара, и пред Агрипом приповеда о свом обраћењу; Агрипа одговара: „Још мало па ћеш ме наговорити да будем хришћанин.“"
