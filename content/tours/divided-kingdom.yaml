# The kingdom divides, 1 Kings 11:29-14:26, in the order of the text, from Ahijah's word
# to Jeroboam late in Solomon's reign (the Solomon tour ends with his death, 11:42-43).
# The tour's year (931 BC) is the usual date of the division (930 BC is also held).
# Shishak's campaign, in Rehoboam's fifth year (14:25), is put at c. 925 BC on that
# reckoning; his relief at Karnak records it. That stop carries it.
id: divided-kingdom
title:
  en: "The kingdom divides"
  ru: "Разделение царства"
  uk: "Поділ царства"
  es: "El reino se divide"
  pt: "O reino se divide"
  de: "Das Reich teilt sich"
  fr: "Le royaume se divise"
year: "931 BC"
approximate: true
stops:
  - place: a15257a # Jerusalem
    ref: 1Kgs.11.29-1Kgs.11.31
    note:
      en: "As Jeroboam goes out of Jerusalem, the prophet Ahijah the Shilonite tears a new garment into twelve pieces and gives him ten: ten tribes will be his."
      ru: "Когда Иеровоам выходит из Иерусалима, пророк Ахия Силомлянин раздирает новую одежду на двенадцать частей и даёт ему десять: десять колен будут его."
      uk: "Коли Єровоам виходить з Єрусалима, пророк Ахія з Шіло розриває нове вбрання на дванадцять шматків і дає йому десять: десять колін буде його."
      es: "Cuando Jeroboam sale de Jerusalén, el profeta Ahías el silonita rasga en doce pedazos un manto nuevo y le da diez: diez tribus serán suyas."
      pt: "Quando Jeroboão sai de Jerusalém, o profeta Aías, o silonita, rasga uma veste nova em doze pedaços e lhe dá dez: dez tribos serão dele."
      de: "Als Jerobeam aus Jerusalem hinausgeht, zerreißt der Prophet Ahija von Silo ein neues Kleid in zwölf Stücke und gibt ihm zehn: Zehn Stämme werden ihm gehören."
      fr: "Comme Jéroboam sort de Jérusalem, le prophète Achija de Silo déchire un manteau neuf en douze morceaux et lui en donne dix : dix tribus seront à lui."
  - place: af301ca # Egypt
    ref: 1Kgs.11.40
    note:
      en: "Solomon seeks to kill him, and Jeroboam flees to Shishak king of Egypt until Solomon's death."
      ru: "Соломон хочет умертвить его, и Иеровоам убегает в Египет к Сусакиму, царю Египетскому, до смерти Соломоновой."
      uk: "Соломон хоче його вбити, і Єровоам тікає до Сусакіма, царя Єгипту, аж до смерті Соломона."
      es: "Salomón procura matarlo, y Jeroboam huye a Sisac, rey de Egipto, hasta la muerte de Salomón."
      pt: "Salomão procura matá-lo, e Jeroboão foge para Sisaque, rei do Egito, até a morte de Salomão."
      de: "Salomo trachtet danach, ihn zu töten, und Jerobeam flieht zu Schischak, dem König von Ägypten, bis zu Salomos Tod."
      fr: "Salomon cherche à le faire mourir, et Jéroboam s’enfuit auprès de Schischak, roi d’Égypte, jusqu’à la mort de Salomon."
  - place: adf74d4 # Shechem
    ref: 1Kgs.12.1-1Kgs.12.20
    note:
      en: 'At Shechem Rehoboam will not lighten the yoke, and Israel answers: "to your tents, O Israel: now see to thine own house, David." Rehoboam reigns only over those who dwell in the cities of Judah.'
      ru: "В Сихеме Ровоам не облегчает иго, и Израиль отвечает: «по шатрам своим, Израиль! теперь знай свой дом, Давид!» Ровоам царствует лишь над жившими в городах Иудиных."
      uk: "У Сихемі Ровоам не хоче полегшити ярмо, і Ізраїль відповідає: «Гей, Ізраїлю, додому! Дивись на свій дом, Давиде!» Ровоам царює лише над тими, хто живе в містах Юди."
      es: "En Siquem Roboam no quiere aligerar el yugo, e Israel responde: «¡Israel, á tus estancias! ¡Provee ahora en tu casa, David!» Roboam reina solo sobre los que habitan en las ciudades de Judá."
      pt: "Em Siquém, Roboão não quer aliviar o jugo, e Israel responde: “Às suas tendas, ó Israel! Agora cuide da sua própria casa, Davi.” Roboão reina apenas sobre os que habitam nas cidades de Judá."
      de: "In Sichem will Rehabeam das Joch nicht erleichtern, und Israel antwortet: „Israel, hebe dich zu deinen Hütten! So, siehe nun du zu deinem Hause, David!“ Rehabeam herrscht nur über die, die in den Städten Judas wohnen."
      fr: "À Sichem, Roboam refuse d’alléger le joug, et Israël répond : « À tes tentes, Israël ! Maintenant, pourvois à ta maison, David ! » Roboam ne règne que sur ceux qui habitent les villes de Juda."
  - place: a8a9ff9 # Penuel
    ref: 1Kgs.12.25
    note:
      en: "Jeroboam builds Shechem in mount Ephraim and dwells there, and from there goes out and builds Penuel."
      ru: "Иеровоам обстраивает Сихем на горе Ефремовой и живёт в нём, а оттуда идёт и строит Пенуэл."
      uk: "Єровоам будує Сихем на горі Єфремовій і живе там, а звідти виходить і будує Пенуел."
      es: "Jeroboam edifica Siquem en el monte de Efraín y habita en ella, y desde allí sale y edifica Peniel."
      pt: "Jeroboão edifica Siquém no monte Efraim e habita ali, e dali sai e edifica Peniel."
      de: "Jerobeam baut Sichem im Gebirge Ephraim und wohnt dort, und von dort zieht er aus und baut Penuel."
      fr: "Jéroboam bâtit Sichem dans la montagne d’Éphraïm et y demeure, puis en sort et bâtit Peniel."
  - place: a513646 # Dan
    ref: 1Kgs.12.28-1Kgs.12.30
    note:
      en: 'So that the people need not go up to Jerusalem, he makes two calves of gold, one for Bethel and one for Dan: "behold thy gods, O Israel."'
      ru: "Чтобы народ не ходил в Иерусалим, он делает двух золотых тельцов и ставит одного в Вефиле, а другого в Дане: «вот боги твои, Израиль»."
      uk: "Щоб народ не ходив до Єрусалима, він робить двох золотих телят, одного для Бет-Елу, а другого для Дана: «ось тобі власні боги, Ізраїлю»."
      es: "Para que el pueblo no tenga que subir a Jerusalén, hace dos becerros de oro, uno para Betel y otro para Dan: «he aquí tus dioses, oh Israel»."
      pt: "Para que o povo não precise subir a Jerusalém, faz dois bezerros de ouro, um para Betel e outro para Dã: “Eis aqui os seus deuses, ó Israel.”"
      de: "Damit das Volk nicht nach Jerusalem hinaufziehen muss, macht er zwei goldene Kälber, eines für Bethel und eines für Dan: „siehe, da sind deine Götter, Israel“."
      fr: "Pour que le peuple n’ait plus à monter à Jérusalem, il fait deux veaux d’or, l’un pour Béthel et l’autre pour Dan : « Israël ! voici ton Dieu. »"
  - place: a64f355 # Bethel
    ref: 1Kgs.13.1-1Kgs.13.5
    note:
      en: 'At Bethel a man of God from Judah cries against the altar, "O altar, altar," foretells Josiah, and the altar is rent.'
      ru: "В Вефиле человек Божий из Иудеи взывает к жертвеннику: «жертвенник, жертвенник!», предрекает Иосию, и жертвенник распадается."
      uk: "У Бет-Елі чоловік Божий з Юди кличе проти жертовника: «Жертівнику, о жертівнику!», провіщає Йосію, і жертовник розколюється."
      es: "En Betel un varón de Dios venido de Judá clama contra el altar: «Altar, altar»; anuncia a Josías, y el altar se rompe."
      pt: "Em Betel, um homem de Deus de Judá clama contra o altar: “Altar! Altar!”, prediz Josias, e o altar se fende."
      de: "In Bethel ruft ein Mann Gottes aus Juda wider den Altar: „Altar, Altar!“, weissagt Josia, und der Altar reißt."
      fr: "À Béthel, un homme de Dieu venu de Juda crie contre l’autel : « Autel ! Autel ! », annonce Josias, et l’autel se fend."
  - place: aa4680a # Shiloh
    ref: 1Kgs.14.1-1Kgs.14.16
    note:
      en: "Disguised, Jeroboam's wife goes to Shiloh to ask the blind Ahijah about her sick son; he knows her at the door and foretells the end of Jeroboam's house."
      ru: "Переодевшись, жена Иеровоама идёт в Силом спросить слепого Ахию о больном сыне; он узнаёт её у двери и предрекает конец дома Иеровоамова."
      uk: "Переодягнена, дружина Єровоама йде до Шіло, щоб спитати сліпого Ахію про свого хворого сина; він пізнає її при дверях і провіщає кінець дому Єровоама."
      es: "Disfrazada, la mujer de Jeroboam va a Silo para consultar al ciego Ahías sobre su hijo enfermo; él la reconoce en la puerta y anuncia el fin de la casa de Jeroboam."
      pt: "Disfarçada, a mulher de Jeroboão vai a Siló perguntar ao cego Aías sobre o seu filho doente; ele a reconhece à porta e prediz o fim da casa de Jeroboão."
      de: "Verkleidet geht Jerobeams Frau nach Silo, um den blinden Ahija nach ihrem kranken Sohn zu fragen; er erkennt sie an der Tür und kündigt das Ende von Jerobeams Haus an."
      fr: "Déguisée, la femme de Jéroboam va à Silo interroger Achija, devenu aveugle, au sujet de son fils malade ; il la reconnaît à la porte et annonce la fin de la maison de Jéroboam."
  - place: a80d317 # Tirzah
    ref: 1Kgs.14.17-1Kgs.14.18
    note:
      en: "As she comes to Tirzah and crosses the threshold, the child dies."
      ru: "Она приходит в Фирцу, и едва переступает порог дома, дитя умирает."
      uk: "Коли вона приходить до Тірци й переступає поріг, дитина вмирає."
      es: "Cuando ella llega a Tirsa y cruza el umbral, el niño muere."
      pt: "Quando ela chega a Tirza e cruza a soleira, a criança morre."
      de: "Als sie nach Tirza kommt und die Schwelle überschreitet, stirbt das Kind."
      fr: "Comme elle arrive à Thirtsa et franchit le seuil, l’enfant meurt."
  - place: a15257a # Jerusalem
    ref: 1Kgs.14.25-1Kgs.14.26
    year: "925 BC"
    note:
      en: "In Rehoboam's fifth year Shishak king of Egypt comes up against Jerusalem and takes the treasures of the house of the Lord and the golden shields of Solomon."
      ru: "На пятом году Ровоама Сусаким, царь Египетский, выходит против Иерусалима и забирает сокровища дома Господня и золотые щиты Соломона."
      uk: "На п’ятий рік Ровоама Сусакім, цар Єгипту, виступає проти Єрусалима й забирає скарби дому Господнього та золоті щити Соломона."
      es: "En el quinto año de Roboam, Sisac, rey de Egipto, sube contra Jerusalén y se lleva los tesoros de la casa del Señor y los escudos de oro de Salomón."
      pt: "No quinto ano de Roboão, Sisaque, rei do Egito, sobe contra Jerusalém e toma os tesouros da casa do Senhor e os escudos de ouro de Salomão."
      de: "Im fünften Jahr Rehabeams zieht Schischak, der König von Ägypten, gegen Jerusalem herauf und nimmt die Schätze des Hauses des Herrn und die goldenen Schilde Salomos."
      fr: "La cinquième année de Roboam, Schischak, roi d’Égypte, monte contre Jérusalem et prend les trésors de la maison de l’Éternel et les boucliers d’or de Salomon."
