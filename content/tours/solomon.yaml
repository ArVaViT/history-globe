# Solomon, 1 Kings 1-11, in the order of the text. The tour's year (970 BC) is the
# conventional start of his reign (c. 970-931 BC, Thiele); the Temple stop shows his
# fourth year (1 Kgs 6:1), the last his death. Points for the map.
id: solomon
title:
  en: "Solomon"
  ru: "Царь Соломон"
  uk: "Соломон"
  es: "Salomón"
  pt: "Salomão"
  de: "Salomo"
  fr: "Salomon"
  pl: "Salomon"
  it: "Salomone"
  nl: "Salomo"
  cs: "Šalomoun"
  sv: "Salomo"
year: "970 BC"
# Solomon's deeds where they were done, not a journey: no time on foot.
walked: false
people: ["Solomon@2Sa.5.14-Act"]
approximate: true
stops:
  - place: a2a303c # Gihon
    ref: 1Kgs.1.38-1Kgs.1.39
    note:
      en: 'At Gihon Zadok anoints Solomon, and all the people say: "God save king Solomon."'
      ru: "У Гиона Садок помазывает Соломона, и весь народ восклицает: «да живет царь Соломон!»"
      uk: "У Гіхоні Садок помазує Соломона, і весь народ каже: «Нехай живе царь Соломон!»"
      es: "En Gihón Sadoc unge a Salomón, y todo el pueblo dice: «¡Viva el rey Salomón!»"
      pt: "Em Giom, Zadoque unge Salomão, e todo o povo diz: “Viva o rei Salomão!”"
      de: "Am Gihon salbt Zadok Salomo, und alles Volk spricht: „Glück dem König Salomo!“"
      fr: "À Guihon, Tsadok oint Salomon, et tout le peuple dit : « Vive le roi Salomon ! »"
      pl: "W Gichon Sadok namaszcza Salomona, a cały lud woła: „Niech żyje król Salomon!”"
      it: "A Ghicon Zadok unge Salomone, e tutto il popolo dice: «Viva il re Salomone!»"
      nl: "Te Gihon zalft Sadok Salomo, en heel het volk zegt: “De koning Salomo leve!”"
      cs: "U Gichónu pomazává Sádok Šalomouna a všechen lid říká: „Živ buď král Šalomoun.“"
      sv: "Vid Gihon smörjer Sadok Salomo, och allt folket ropar: ”Leve konung Salomo!”"
  - place: aede336 # Gibeon
    ref: 1Kgs.3.4-1Kgs.3.15
    note:
      en: "At Gibeon the Lord appears to him in a dream, and he asks for an understanding heart."
      ru: "В Гаваоне Господь является ему во сне, и он просит сердце разумное."
      uk: "У Гаваоні Господь являється йому уві сні, і він просить розумного серця."
      es: "En Gabaón el Señor se le aparece en sueños, y él pide un corazón entendido."
      pt: "Em Gibeão o Senhor lhe aparece em sonho, e ele pede um coração entendido."
      de: "In Gibeon erscheint ihm der Herr im Traum, und er bittet um ein verständiges Herz."
      fr: "À Gabaon, l’Éternel lui apparaît en songe, et il demande un cœur intelligent."
      pl: "W Gibeon Pan ukazuje mu się we śnie, a on prosi o serce rozumne."
      it: "A Gabaon il Signore gli appare in sogno, ed egli chiede un cuore intelligente."
      nl: "Te Gibeon verschijnt de HEER hem in een droom, en hij vraagt om een verstandig hart."
      cs: "V Gibeonu se mu Hospodin zjevuje ve snu a on prosí o srdce rozumné."
      sv: "I Gibeon visar sig Herren för honom i en dröm, och han ber om ett förståndigt hjärta."
  - place: a160272 # Tyre
    ref: 1Kgs.5.1-1Kgs.5.12
    note:
      en: "Hiram king of Tyre sends cedar for the Temple, and the two make a treaty."
      ru: "Хирам, царь Тирский, даёт кедры для Храма, и они заключают союз."
      uk: "Хірам, цар Тіру, посилає кедр для храму, і вони складають угоду."
      es: "Hiram, rey de Tiro, envía cedro para el Templo, y los dos hacen un tratado."
      pt: "Hirão, rei de Tiro, envia cedro para o Templo, e os dois fazem um tratado."
      de: "Hiram, der König von Tyrus, sendet Zedernholz für den Tempel, und die beiden schließen einen Vertrag."
      fr: "Hiram, roi de Tyr, envoie du cèdre pour le temple, et les deux concluent un traité."
      pl: "Hiram, król Tyru, przysyła cedr na świątynię i obaj zawierają układ."
      it: "Chiram, re di Tiro, manda cedro per il Tempio, e i due stringono un trattato."
      nl: "Hiram, de koning van Tyrus, zendt ceder voor de tempel, en de twee sluiten een verdrag."
      cs: "Chíram, král Týru, posílá cedry pro chrám a oba uzavírají smlouvu."
      sv: "Hiram, kung av Tyros, sänder cederträ till templet, och de två sluter ett fördrag."
  - place: a15257a # Jerusalem
    ref: 1Kgs.6.1-1Kgs.8.11
    year: "966 BC"
    note:
      en: "In his fourth year he begins the Temple; at its dedication the cloud fills the house of the Lord."
      ru: "В четвёртый год царствования он начинает строить Храм; при освящении облако наполняет дом Господень."
      uk: "На четвертий рік свого царювання він починає будувати храм; при його освяченні хмара наповнює дім Господній."
      es: "En su cuarto año comienza el Templo; en su dedicación la nube llena la casa del Señor."
      pt: "No seu quarto ano ele começa o Templo; na sua dedicação, a nuvem enche a casa do Senhor."
      de: "In seinem vierten Jahr beginnt er den Tempel; bei dessen Einweihung erfüllt die Wolke das Haus des Herrn."
      fr: "La quatrième année de son règne, il commence le temple ; à sa dédicace, la nuée remplit la maison de l’Éternel."
      pl: "W czwartym roku swego panowania zaczyna budowę świątyni; podczas jej poświęcenia obłok napełnia dom Pański."
      it: "Nel suo quarto anno inizia il Tempio; alla sua dedicazione la nuvola riempie la casa del Signore."
      nl: "In zijn vierde jaar begint hij de tempel te bouwen; bij de inwijding vult de wolk het huis van de HEER."
      cs: "Ve čtvrtém roce začíná stavět chrám; při jeho posvěcení naplňuje dům Hospodinův oblak."
      sv: "I sitt fjärde år påbörjar han templet; vid invigningen fyller molnet Herrens hus."
  - place: a8554e3 # Megiddo
    ref: 1Kgs.9.15
    note:
      en: "With the levy he raises he builds the wall of Jerusalem, Hazor, Megiddo and Gezer."
      ru: "Наложив подать, он строит стену Иерусалимскую, Гацор, Мегиддо и Газер."
      uk: "З данини, яку він збирає, він будує мур Єрусалима, Гацор, Мегіддо і Гезер."
      es: "Con el tributo que levanta edifica el muro de Jerusalén, Hazor, Meguido y Gezer."
      pt: "Com o trabalho forçado que recruta, edifica o muro de Jerusalém, Hazor, Megido e Gezer."
      de: "Mit dem Frondienst, den er aushebt, baut er die Mauer Jerusalems, Hazor, Megiddo und Geser."
      fr: "Avec les hommes de corvée qu’il lève, il bâtit la muraille de Jérusalem, Hatsor, Meguiddo et Guézer."
      pl: "Z pracy przymusowej, którą nakłada, buduje mur Jerozolimy, Chasor, Megiddo i Gezer."
      it: "Con la comandata che arruola costruisce il muro di Gerusalemme, Asor, Meghiddo e Ghezer."
      nl: "Met de heffing die hij opbrengt bouwt hij de muur van Jeruzalem, Hazor, Megiddo en Gezer."
      cs: "Z nucených prací, které vybírá, staví jeruzalémskou hradbu, Chacor, Megido a Gezer."
      sv: "Med det arbetsfolk han bådar upp bygger han Jerusalems mur, Hasor, Megiddo och Geser."
  - place: a8e53d5 # Ezion-geber
    ref: 1Kgs.9.26-1Kgs.9.28
    note:
      en: "At Ezion-geber on the Red Sea he builds ships, and his servants and Hiram's sailors bring gold from Ophir."
      ru: "В Ецион-Гавере на берегу Чермного моря он строит корабль, и его подданные вместе с моряками Хирама привозят золото из Офира."
      uk: "В Еціон-Гевері на Червоному морі він будує кораблі, і його слуги та моряки Хірама привозять золото з Офіру."
      es: "En Ezión-geber, junto al Mar Rojo, construye naves, y sus siervos y los marineros de Hiram traen oro de Ofir."
      pt: "Em Eziom-Geber, no Mar Vermelho, constrói navios, e seus servos e os marinheiros de Hirão trazem ouro de Ofir."
      de: "In Ezjon-Geber am Roten Meer baut er Schiffe, und seine Knechte und Hirams Seeleute bringen Gold aus Ofir."
      fr: "À Etsjon-Guéber, sur la Mer Rouge, il construit des navires, et ses serviteurs et les matelots de Hiram rapportent de l’or d’Ophir."
      pl: "W Esjon-Geber nad Morzem Czerwonym buduje okręty, a jego słudzy i marynarze Hirama sprowadzają złoto z Ofiru."
      it: "A Ezion-Gheber, sul Mar Rosso, costruisce navi, e i suoi servi e i marinai di Chiram portano oro da Ofir."
      nl: "Te Ezeon-Geber aan de Rode Zee bouwt hij schepen, en zijn knechten en de zeelieden van Hiram brengen goud uit Ofir."
      cs: "V Ecjon-geberu při Rudém moři staví lodi a jeho služebníci i Chíramovi námořníci vozí zlato z Ofíru."
      sv: "Vid Esjon-Geber vid Sävhavet bygger han skepp, och hans tjänare och Hirams sjömän hämtar guld från Ofir."
  - place: a81ab85 # Sheba
    ref: 1Kgs.10.1-1Kgs.10.13
    note:
      en: "The queen of Sheba hears of his fame and comes to test him with hard questions."
      ru: "Царица Савская, услышав о славе Соломона, приходит испытать его загадками."
      uk: "Цариця Савська чує про його славу й приходить випробувати його важкими питаннями."
      es: "La reina de Seba oye de su fama y viene a probarlo con preguntas difíciles."
      pt: "A rainha de Sabá ouve falar da sua fama e vem testá-lo com perguntas difíceis."
      de: "Die Königin von Scheba hört von seinem Ruhm und kommt, ihn mit schweren Fragen zu prüfen."
      fr: "La reine de Schéba apprend sa renommée et vient l’éprouver par des énigmes."
      pl: "Królowa Szeby słyszy o jego sławie i przybywa, by wypróbować go trudnymi pytaniami."
      it: "La regina di Saba sente parlare della sua fama e viene a metterlo alla prova con domande difficili."
      nl: "De koningin van Seba hoort van zijn roem en komt hem met moeilijke vragen op de proef stellen."
      cs: "Královna ze Šeby slyší o jeho slávě a přichází ho zkoušet těžkými otázkami."
      sv: "Drottningen av Saba får höra om hans rykte och kommer för att sätta honom på prov med svåra frågor."
  - place: a15257a # Jerusalem
    ref: 1Kgs.11.42-1Kgs.11.43
    year: "931 BC"
    note:
      en: "After forty years' reign in Jerusalem Solomon dies and is buried in the city of David."
      ru: "Процарствовав в Иерусалиме сорок лет, Соломон умирает и погребён в городе Давида."
      uk: "Після сорока років царювання в Єрусалимі Соломон помирає і його ховають у Місті Давида."
      es: "Tras cuarenta años de reinado en Jerusalén, Salomón muere y es sepultado en la Ciudad de David."
      pt: "Depois de quarenta anos de reinado em Jerusalém, Salomão morre e é sepultado na Cidade de Davi."
      de: "Nach vierzig Jahren Herrschaft in Jerusalem stirbt Salomo und wird in der Stadt Davids begraben."
      fr: "Après quarante ans de règne à Jérusalem, Salomon meurt et est enseveli dans la Cité de David."
      pl: "Po czterdziestu latach panowania w Jerozolimie Salomon umiera i zostaje pochowany w Mieście Dawida."
      it: "Dopo quarant’anni di regno a Gerusalemme Salomone muore ed è sepolto nella Città di Davide."
      nl: "Na veertig jaar regeren in Jeruzalem sterft Salomo en wordt begraven in de Stad van David."
      cs: "Po čtyřiceti letech kralování v Jeruzalémě Šalomoun umírá a je pochován ve Městě Davidově."
      sv: "Efter fyrtio års regering i Jerusalem dör Salomo och begravs i Davids stad."
