    note:
      en: "When war breaks out in Alexandria he leaves for Caesarea. Though he is not yet a presbyter, the bishops of Palestine ask him to preach and expound the Scriptures in church, and his own bishop Demetrius protests in a letter."
      ru: "Когда в Александрии вспыхивает война, он уезжает в Кесарию. Хотя он ещё не пресвитер, епископы Палестины просят его проповедовать и толковать Писание в церкви, и его собственный епископ Димитрий протестует в письме."
      uk: "Коли в Александрії спалахує війна, він вирушає до Кесарії. Хоч він ще не пресвітер, єпископи Палестини просять його проповідувати й тлумачити Писання в церкві, а його власний єпископ Димитрій протестує в листі."
      es: "Cuando estalla la guerra en Alejandría, parte hacia Cesarea. Aunque aún no es presbítero, los obispos de Palestina le piden que predique y exponga las Escrituras en la iglesia, y su propio obispo Demetrio protesta en una carta."
      pt: "Quando estoura a guerra em Alexandria, ele parte para Cesareia. Embora ainda não seja presbítero, os bispos da Palestina lhe pedem que pregue e exponha as Escrituras na igreja, e o seu próprio bispo, Demétrio, protesta numa carta."
      de: "Als in Alexandria Krieg ausbricht, geht er nach Caesarea. Obwohl er noch kein Presbyter ist, bitten ihn die Bischöfe Palästinas, in der Kirche zu predigen und die Schriften auszulegen, und sein eigener Bischof Demetrius protestiert in einem Brief."
      fr: "Quand la guerre éclate à Alexandrie, il part pour Césarée. Bien qu’il ne soit pas encore prêtre, les évêques de Palestine lui demandent de prêcher et d’expliquer les Écritures à l’église, et son propre évêque Démétrius proteste dans une lettre."
      pl: "Gdy w Aleksandrii wybucha wojna, wyjeżdża do Cezarei. Choć nie jest jeszcze prezbiterem, biskupi Palestyny proszą go, by głosił i wykładał Pisma w kościele, a jego własny biskup Demetriusz protestuje w liście."
      it: "Quando scoppia la guerra ad Alessandria, parte per Cesarea. Benché non sia ancora presbitero, i vescovi della Palestina gli chiedono di predicare e di spiegare le Scritture in chiesa, e il suo vescovo Demetrio protesta con una lettera."
      nl: "Als er oorlog uitbreekt in Alexandrië, vertrekt hij naar Caesarea. Hoewel hij nog geen presbyter is, vragen de bisschoppen van Palestina hem in de kerk te preken en de Schriften uit te leggen, en zijn eigen bisschop Demetrius protesteert in een brief."
      cs: "Když v Alexandrii vypukne válka, odchází do Cesareje. Ačkoli ještě není presbyterem, biskupové Palestiny ho žádají, aby kázal a vykládal Písma v kostele, a jeho vlastní biskup Démétrios protestuje dopisem."
      sv: "När krig bryter ut i Alexandria lämnar han staden för Caesarea. Fastän han ännu inte är presbyter ber Palestinas biskopar honom att predika och utlägga Skrifterna i kyrkan, och hans egen biskop Demetrios protesterar i ett brev."
      nb: "Da krig bryter ut i Aleksandria, drar han til Cæsarea. Selv om han ennå ikke er presbyter, ber biskopene i Palestina ham preke og utlegge Skriftene i kirken, og hans egen biskop Demetrios protesterer i et brev."
      tl: "Nang sumiklab ang digmaan sa Alejandria ay umaalis siya patungong Cesarea. Bagaman hindi pa siya presbitero, hinihiling sa kaniya ng mga obispo ng Palestina na mangaral at magpaliwanag ng mga Kasulatan sa simbahan, at tumututol ang sarili niyang obispong si Demetrio sa isang liham."
      da: "Da der bryder krig ud i Alexandria, rejser han til Cæsarea. Skønt han endnu ikke er presbyter, beder Palæstinas biskopper ham prædike og udlægge Skrifterne i kirken, og hans egen biskop Demetrios protesterer i et brev."
      sr: "Када у Александрији избије рат, одлази у Цезареју. Иако још није презвитер, палестински епископи траже од њега да у цркви проповеда и тумачи Писмо, а његов епископ Димитрије писмом протестује."
      hu: "Amikor Alexandriában háború tör ki, Cézáreába távozik. Bár még nem presbiter, Palesztina püspökei kérik, hogy prédikáljon és magyarázza a Szentírást az egyházban, saját püspöke, Démétriosz pedig levélben tiltakozik."
      fi: "Kun Aleksandriassa syttyy sota, hän lähtee Kesareaan. Vaikka hän ei vielä ole presbyteeri, Palestiinan piispat pyytävät häntä saarnaamaan ja selittämään Raamattua kirkossa, ja hänen oma piispansa Demetrios vastustaa tätä kirjeessään."
      vi: "Khi chiến tranh nổ ra ở A-léc-xan-tri, ông đến Sê-sa-rê. Dù ông chưa là trưởng lão, các giám mục Palestine vẫn xin ông giảng và giải nghĩa Kinh Thánh trong nhà thờ, và giám mục của chính ông là Demetrius phản đối bằng một lá thư."
      ro: "Când izbucnește războiul la Alexandria, pleacă la Cezareea. Deși nu este încă presbiter, episcopii Palestinei îi cer să predice și să tâlcuiască Scripturile în biserică, iar propriul său episcop, Dimitrie, protestează printr-o scrisoare."
      bg: "Когато в Александрия избухва война, той заминава за Кесария. Макар още да не е презвитер, палестинските епископи го молят да проповядва и да тълкува Писанията в църквата, а собственият му епископ Димитрий протестира с писмо."
  - place: ae41ab4 # Antioch
    year: "AD 232"
