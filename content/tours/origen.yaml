    note:
      en: "In Athens he finishes his commentary on Ezekiel and begins the one on the Song of Songs, which he completes after his return to Caesarea."
      ru: "В Афинах он заканчивает толкование на Иезекииля и начинает толкование на Песнь песней, которое завершает уже по возвращении в Кесарию."
      uk: "В Афінах він завершує свій коментар до Книги Єзекіїля й починає коментар до Пісні над піснями, який закінчує після повернення до Кесарії."
      es: "En Atenas termina su comentario a Ezequiel y empieza el del Cantar de los Cantares, que completa tras volver a Cesarea."
      pt: "Em Atenas ele conclui o seu comentário sobre Ezequiel e começa o do Cântico dos Cânticos, que termina depois de voltar a Cesareia."
      de: "In Athen schließt er seinen Kommentar zu Hesekiel ab und beginnt den zum Hohenlied, den er nach seiner Rückkehr nach Caesarea vollendet."
      fr: "À Athènes, il achève son commentaire sur Ézéchiel et commence celui sur le Cantique des cantiques, qu’il termine après son retour à Césarée."
      pl: "W Atenach kończy komentarz do Ezechiela i zaczyna komentarz do Pieśni nad Pieśniami, który ukończy po powrocie do Cezarei."
      it: "Ad Atene termina il commento a Ezechiele e comincia quello al Cantico dei Cantici, che completa dopo il ritorno a Cesarea."
      nl: "In Athene voltooit hij zijn commentaar op Ezechiël en begint hij aan dat op het Hooglied, dat hij na zijn terugkeer in Caesarea afrondt."
      cs: "V Aténách dokončuje svůj komentář k Ezechielovi a začíná komentář k Písni písní, který dokončí po návratu do Cesareje."
      sv: "I Aten avslutar han sin kommentar till Hesekiel och påbörjar den till Höga visan, som han fullbordar efter sin återkomst till Caesarea."
      nb: "I Aten fullfører han kommentaren sin til Esekiel og begynner på den til Høysangen, som han avslutter etter at han er vendt tilbake til Cæsarea."
      tl: "Sa Atenas ay tinatapos niya ang kaniyang komentaryo sa Ezekiel at sinisimulan ang sa Awit ng mga Awit, na kinukumpleto niya pagbalik niya sa Cesarea."
      da: "I Athen afslutter han sin kommentar til Ezekiel og begynder på kommentaren til Højsangen, som han fuldfører efter sin tilbagekomst til Cæsarea."
      sr: "У Атини завршава свој коментар на Језекиља и почиње онај на Песму над песмама, који довршава по повратку у Цезареју."
      hu: "Athénben befejezi Ezékiel könyvéhez írt kommentárját, és megkezdi az Énekek énekéhez írottat, amelyet Cézáreába való visszatérése után fejez be."
      fi: "Ateenassa hän saa valmiiksi Hesekielin selityksensä ja aloittaa Laulujen laulun selityksen, jonka hän päättää palattuaan Kesareaan."
      vi: "Ở A-thên, ông hoàn thành bản chú giải sách Ê-xê-chi-ên và bắt đầu bản chú giải sách Nhã Ca, mà ông hoàn tất sau khi trở về Sê-sa-rê."
      ro: "La Atena își încheie comentariul la Ezechiel și îl începe pe cel la Cântarea Cântărilor, pe care îl termină după întoarcerea la Cezareea."
      bg: "В Атина той завършва тълкуванието си на Езекиил и започва тълкуванието на Песен на песните, което довършва след завръщането си в Кесария."
  - place: a160272 # Tyre
    year: "AD 253"
    source:
      cite:
