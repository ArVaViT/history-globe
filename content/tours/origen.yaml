    note:
      en: "Mammaea, the emperor's mother, has heard of him and wants to test his understanding of divine things. Staying at Antioch, she sends a military escort to bring him."
      ru: "Мамея, мать императора, наслышана о нём и хочет испытать его познания в божественном. Находясь в Антиохии, она посылает за ним воинскую стражу."
      uk: "Мамея, мати імператора, чула про нього й хоче випробувати його розуміння божественного. Перебуваючи в Антіохії, вона посилає по нього військовий ескорт."
      es: "Mamea, la madre del emperador, ha oído hablar de él y quiere poner a prueba su comprensión de las cosas divinas. Mientras reside en Antioquía, le envía una escolta militar para que lo lleve ante ella."
      pt: "Mameia, mãe do imperador, ouviu falar dele e quer pôr à prova o seu entendimento das coisas divinas. Hospedada em Antioquia, envia uma escolta militar para buscá-lo."
      de: "Mammäa, die Mutter des Kaisers, hat von ihm gehört und will sein Verständnis der göttlichen Dinge prüfen. Während sie sich in Antiochia aufhält, schickt sie eine militärische Eskorte, die ihn holen soll."
      fr: "Mammée, la mère de l’empereur, a entendu parler de lui et veut éprouver son intelligence des choses divines. Séjournant à Antioche, elle envoie une escorte militaire pour le faire venir."
      pl: "Mammea, matka cesarza, słyszała o nim i chce sprawdzić jego rozumienie spraw Bożych. Przebywając w Antiochii, wysyła po niego eskortę wojskową."
      it: "Mammea, la madre dell’imperatore, ha sentito parlare di lui e vuole mettere alla prova la sua comprensione delle cose divine. Trovandosi ad Antiochia, manda una scorta militare a prenderlo."
      nl: "Mammaea, de moeder van de keizer, heeft van hem gehoord en wil zijn inzicht in goddelijke zaken op de proef stellen. Terwijl zij in Antiochië verblijft, stuurt zij een militair escorte om hem te halen."
      cs: "Mamaea, císařova matka, o něm slyšela a chce vyzkoušet jeho chápání božských věcí. Pobývá v Antiochii a posílá vojenský doprovod, aby ho přivedl."
      sv: "Mammaea, kejsarens mor, har hört talas om honom och vill pröva hans förståelse av gudomliga ting. Under sin vistelse i Antiochia sänder hon en militär eskort för att hämta honom."
      nb: "Mamaea, keiserens mor, har hørt om ham og vil prøve hans innsikt i guddommelige ting. Mens hun oppholder seg i Antiokia, sender hun en militæreskorte for å hente ham."
      tl: "Narinig na ni Mammea, ina ng emperador, ang tungkol sa kaniya at nais niyang subukin ang kaniyang pagkaunawa sa mga bagay na banal. Habang nasa Antioquia, nagsusugo siya ng isang eskoltang militar upang dalhin siya."
      da: "Mammaia, kejserens mor, har hørt om ham og vil prøve hans forståelse af guddommelige ting. Hun opholder sig i Antiokia og sender en militær eskorte for at hente ham."
      sr: "Мамеја, царева мајка, чула је за њега и жели да провери његово разумевање божанских ствари. Боравећи у Антиохији, шаље војну пратњу да га доведе."
      hu: "Mammaea, a császár anyja, hallott róla, és próbára akarja tenni az isteni dolgokban való jártasságát. Antiókhiában időzve katonai kíséretet küld érte."
      fi: "Mammaea, keisarin äiti, on kuullut hänestä ja haluaa koetella hänen ymmärrystään jumalallisista asioista. Antiokiassa oleskellessaan hän lähettää sotilassaattueen noutamaan hänet."
      vi: "Mammaea, mẹ của hoàng đế, đã nghe về ông và muốn thử sự hiểu biết của ông về những điều thiêng liêng. Đang ở An-ti-ốt, bà sai một đội lính hộ tống đến đón ông."
      ro: "Mamea, mama împăratului, a auzit de el și vrea să-i pună la încercare priceperea în cele dumnezeiești. Aflându-se la Antiohia, ea trimite o escortă militară să-l aducă."
      bg: "Мамея, майката на императора, е чула за него и иска да изпита разбирането му за божествените неща. Намирайки се в Антиохия, тя изпраща военен ескорт да го доведе."
  - place: a1fe6e7 # Athens
