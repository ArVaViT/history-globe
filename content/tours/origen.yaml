    note:
      en: "His father Leonides is in prison, and the boy Origen is set on martyrdom too. His mother hides all his clothes to keep him at home, so he writes to his father instead: «Take heed not to change your mind on our account.»"
      ru: "Его отец Леонид в темнице, и мальчик Ориген тоже рвётся к мученичеству. Мать прячет всю его одежду, чтобы удержать дома, и тогда он пишет отцу: «Держись, не передумай ради нас!»"
      uk: "Його батько Леонід у в’язниці, і хлопець Оріген теж прагне мучеництва. Мати ховає весь його одяг, щоб утримати вдома, і він пише батькові: «Стережись, щоб через нас не змінити свого наміру»."
      es: "Su padre Leónidas está en la cárcel, y el muchacho Orígenes también está decidido al martirio. Su madre le esconde toda la ropa para retenerlo en casa, y él escribe entonces a su padre: «Cuida de no cambiar de parecer por causa nuestra»."
      pt: "O pai, Leônidas, está na prisão, e o menino Orígenes também anseia pelo martírio. A mãe esconde todas as suas roupas para mantê-lo em casa, e então ele escreve ao pai: “Cuida de não mudar de ideia por nossa causa.”"
      de: "Sein Vater Leonides sitzt im Gefängnis, und der Knabe Origenes ist ebenfalls fest zum Martyrium entschlossen. Seine Mutter versteckt alle seine Kleider, um ihn zu Hause zu halten, und so schreibt er stattdessen seinem Vater: „Gib acht, dass du unseretwegen deine Meinung nicht änderst.“"
      fr: "Son père Léonide est en prison, et le jeune Origène est lui aussi résolu au martyre. Sa mère cache tous ses vêtements pour le retenir à la maison ; il écrit donc à son père : « Garde-toi de changer d’avis à cause de nous. »"
      pl: "Jego ojciec Leonides siedzi w więzieniu, a chłopiec Orygenes też chce umrzeć męczeńską śmiercią. Matka ukrywa wszystkie jego ubrania, by zatrzymać go w domu, więc chłopiec pisze zamiast tego do ojca: „Uważaj, byś nie zmienił zdania z naszego powodu.”"
      it: "Suo padre Leonide è in prigione, e il fanciullo Origene anela anch’egli al martirio. Sua madre gli nasconde tutti i vestiti per tenerlo in casa, così egli scrive al padre: «Fa’ attenzione a non cambiare idea per causa nostra.»"
      nl: "Zijn vader Leonides zit in de gevangenis, en ook de jonge Origenes is op het martelaarschap gebrand. Zijn moeder verbergt al zijn kleren om hem thuis te houden, en dus schrijft hij zijn vader: “Pas op dat u om onzentwil niet van gedachten verandert.”"
      cs: "Jeho otec Leonidés je ve vězení a chlapec Órigenés také touží po mučednictví. Matka mu ukryje všechny šaty, aby ho udržela doma, a tak alespoň píše otci: „Dej pozor, abys kvůli nám nezměnil úmysl.“"
      sv: "Hans far Leonides sitter i fängelse, och pojken Origenes är också fast besluten att dö martyrdöden. Hans mor gömmer alla hans kläder för att hålla honom hemma, och då skriver han i stället till sin far: ”Se till att du inte ändrar dig för vår skull.”"
      nb: "Faren Leonides sitter i fengsel, og gutten Origenes er også fast bestemt på martyrdøden. Moren skjuler alle klærne hans for å holde ham hjemme, så han skriver til faren i stedet: «Pass på at du ikke skifter mening for vår skyld.»"
      tl: "Nasa bilangguan ang kaniyang amang si Leonides, at ang batang si Origen ay nananabik din sa pagkamartir. Itinatago ng kaniyang ina ang lahat ng kaniyang damit upang manatili siya sa bahay, kaya sumusulat na lamang siya sa kaniyang ama: “Mag-ingat kang huwag magbago ng iyong isip dahil sa amin.”"
      da: "Hans far Leonides sidder i fængsel, og drengen Origenes er også opsat på at lide martyrdøden. Hans mor skjuler alt hans tøj for at holde ham hjemme, så han skriver i stedet til sin far: »Pas på, at du ikke ændrer mening for vores skyld.«"
      sr: "Отац Леонид је у тамници, а и дечак Ориген жуди за мучеништвом. Мајка му крије сву одећу да би га задржала код куће, па он уместо тога пише оцу: „Пази да због нас не промениш мишљење.“"
      hu: "Apja, Leonidész börtönben van, és a fiú, Órigenész maga is a vértanúságra vágyik. Anyja elrejti minden ruháját, hogy otthon tartsa, ezért inkább apjának ír: „Vigyázz, hogy miattunk meg ne változtasd elhatározásodat.”"
      fi: "Hänen isänsä Leonides on vankilassa, ja poika Origeneskin on päättänyt kuolla marttyyrina. Hänen äitinsä kätkee kaikki hänen vaatteensa pitääkseen hänet kotona, joten hän kirjoittaa sen sijaan isälleen: ”Varo muuttamasta mieltäsi meidän tähtemme.”"
      vi: "Cha ông là Leonides đang ở trong tù, và cậu bé Origen cũng quyết chí tử đạo. Mẹ cậu giấu hết quần áo của cậu để giữ cậu ở nhà, nên cậu viết thư cho cha: “Xin cha cẩn thận, đừng đổi ý vì chúng con.”"
      ro: "Tatăl său, Leonid, se află în închisoare, iar băiatul Origen vrea și el cu tot dinadinsul martiriul. Mama lui îi ascunde toate hainele ca să-l țină acasă, așa că îi scrie tatălui său: „Ia seama să nu-ți schimbi gândul din pricina noastră.”"
      bg: "Баща му Леонид е в затвора, а момчето Ориген също е обзето от желание за мъченичество. Майка му скрива всичките му дрехи, за да го задържи у дома, и затова той пише на баща си: „Пази се да не промениш решението си заради нас.“"
