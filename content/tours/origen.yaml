# Origen, from Alexandria to Tyre, as Eusebius tells it in the sixth book of his Church
# History, which is mostly about him, and Jerome in his Lives of Illustrious Men. The years
# are approximate: his father's death in the tenth year of Severus (202); Rome under bishop
# Zephyrinus (199-217), usually put about 212; the "war" in Alexandria that drove him to
# Caesarea, usually Caracalla's massacre of 215; Mammaea at Antioch, about 232; Athens,
# where he finished his work on Ezekiel, about 240; his death under Gallus, about 253. Each
# stop links the free translation of the Nicene and Post-Nicene Fathers (public domain) at
# New Advent; its page holds the whole book, and the cite gives the section. Not one way
# travelled: no time on foot. English and Russian first; the other languages wait for the
# translation pass (docs/translation-debt.md).
