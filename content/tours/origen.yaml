    note:
      en: "While Zephyrinus is bishop of Rome, Origen goes there, «desiring to see the most ancient church of Rome». After a short stay he returns to teach in Alexandria."
      ru: "При епископе Зефирине Ориген едет в Рим: «Я захотел увидеть самую древнюю Церковь — Римскую». Пробыв там недолго, он возвращается учить в Александрию."
      uk: "Коли єпископом Рима є Зефірин, Оріген їде туди, «бажаючи побачити найдавнішу церкву Рима». Пробувши там недовго, він повертається до Александрії навчати."
      es: "Mientras Ceferino es obispo de Roma, Orígenes va allí, «deseando ver la antiquísima Iglesia de Roma». Tras una breve estancia vuelve a enseñar en Alejandría."
      pt: "Quando Zeferino é bispo de Roma, Orígenes vai até lá, “desejando ver a antiquíssima igreja de Roma”. Depois de uma breve estada, volta a ensinar em Alexandria."
      de: "Während Zephyrinus Bischof von Rom ist, reist Origenes dorthin, „da er die älteste Kirche Roms sehen wollte“. Nach kurzem Aufenthalt kehrt er zurück, um in Alexandria zu lehren."
      fr: "Alors que Zéphyrin est évêque de Rome, Origène s’y rend, « désirant voir la très antique Église de Rome ». Après un court séjour, il retourne enseigner à Alexandrie."
      pl: "Gdy biskupem Rzymu jest Zefiryn, Orygenes udaje się tam, „pragnąc zobaczyć najstarszy Kościół Rzymu”. Po krótkim pobycie wraca nauczać do Aleksandrii."
      it: "Mentre Zefirino è vescovo di Roma, Origene vi si reca, «desiderando vedere la chiesa più antica di Roma». Dopo un breve soggiorno torna a insegnare ad Alessandria."
      nl: "Terwijl Zefyrinus bisschop van Rome is, gaat Origenes erheen, “verlangend de oudste kerk van Rome te zien”. Na een kort verblijf keert hij terug om in Alexandrië les te geven."
      cs: "Za římského biskupa Zefyrina se Órigenés vydává do Říma, neboť „toužil spatřit nejstarší církev římskou“. Po krátkém pobytu se vrací učit do Alexandrie."
      sv: "Medan Zephyrinus är biskop av Rom reser Origenes dit, ”i önskan att se Roms äldsta kyrka”. Efter en kort vistelse återvänder han för att undervisa i Alexandria."
      nb: "Mens Zefyrinus er biskop i Roma, reiser Origenes dit, «i ønske om å se Romas eldste kirke». Etter et kort opphold vender han tilbake for å undervise i Aleksandria."
      tl: "Habang si Zefirino ang obispo ng Roma, pumupunta roon si Origen, “na nagnanais makita ang pinakamatandang iglesia ng Roma”. Pagkaraan ng maikling pamamalagi ay bumabalik siya upang magturo sa Alejandria."
      da: "Mens Zephyrinus er biskop af Rom, rejser Origenes derhen, »fordi han ønskede at se Roms ældste kirke«. Efter et kort ophold vender han tilbage for at undervise i Alexandria."
      sr: "Док је Зефирин епископ римски, Ориген одлази тамо, „желећи да види најстарију цркву римску“. После кратког боравка враћа се да подучава у Александрији."
      hu: "Amíg Zephyrinus Róma püspöke, Órigenész odamegy, „hogy meglássa Róma legősibb egyházát”. Rövid ottlét után visszatér Alexandriába tanítani."
      fi: "Zefyrinuksen ollessa Rooman piispa Origenes matkustaa sinne ”halutessaan nähdä Rooman vanhimman seurakunnan”. Lyhyen oleskelun jälkeen hän palaa opettamaan Aleksandriaan."
      vi: "Khi Zephyrinus làm giám mục Rô-ma, Origen đến đó, “muốn thấy Hội thánh Rô-ma cổ xưa nhất”. Sau một thời gian ngắn, ông trở về dạy ở A-léc-xan-tri."
      ro: "Pe când Zefirin este episcop al Romei, Origen merge acolo, „dorind să vadă cea mai veche Biserică a Romei”. După o scurtă ședere se întoarce să predea la Alexandria."
      bg: "Докато Зефирин е епископ на Рим, Ориген отива там, „желаейки да види най-древната църква на Рим“. След кратък престой се връща да преподава в Александрия."
