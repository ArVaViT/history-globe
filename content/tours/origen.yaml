    note:
      en: "Under Decius he is tortured, with the iron collar and his feet stretched in the stocks, but his judge takes care not to kill him. He lives until the time of Gallus, «until his sixty-ninth year, and died at Tyre, in which city he also was buried»."
      ru: "При Декии его пытают железным ошейником и колодками, растягивая ноги, но судья старается не довести его до смерти. Он доживает до времён Галла, «до шестьдесят девятого года, и умер в Тире, где и погребён»."
      uk: "За Деція його катують залізним нашийником і розтягненням ніг у колодках, але суддя дбає, щоб не вбити його. Він доживає до часів Галла, «до шістдесят дев’ятого року життя, і помер у Тірі, де його й поховано»."
      es: "Bajo Decio es torturado, con el collar de hierro y los pies estirados en el cepo, pero su juez cuida de no matarlo. Vive hasta el tiempo de Galo, «hasta su sexagésimo noveno año, y murió en Tiro, ciudad en la que también fue sepultado»."
      pt: "Sob Décio é torturado, com o colar de ferro e os pés esticados no tronco, mas o juiz toma cuidado para não o matar. Vive até o tempo de Galo, “até o seu sexagésimo nono ano, e morreu em Tiro, cidade em que também foi sepultado”."
      de: "Unter Decius wird er gefoltert, mit dem eisernen Halsring und mit im Block gespreizten Füßen, doch sein Richter achtet darauf, ihn nicht zu töten. Er lebt bis zur Zeit des Gallus, „bis in sein neunundsechzigstes Jahr, und starb in Tyrus, in welcher Stadt er auch begraben wurde“."
      fr: "Sous Dèce, il est torturé, avec le carcan de fer et les pieds étirés dans les ceps, mais son juge prend soin de ne pas le tuer. Il vit jusqu’au temps de Gallus, « jusqu’à sa soixante-neuvième année, et mourut à Tyr, ville où il fut aussi enseveli »."
      pl: "Za Decjusza jest torturowany: zakuty w żelazną obrożę, z nogami rozciągniętymi w dybach, lecz sędzia dba o to, by go nie zabić. Żyje do czasów Gallusa, „aż do swego sześćdziesiątego dziewiątego roku, i umarł w Tyrze, w którym to mieście został też pochowany”."
      it: "Sotto Decio è torturato, con il collare di ferro e i piedi stirati nei ceppi, ma il suo giudice si guarda dall’ucciderlo. Vive fino al tempo di Gallo, «fino al suo sessantanovesimo anno, e morì a Tiro, città nella quale fu anche sepolto»."
      nl: "Onder Decius wordt hij gefolterd, met de ijzeren halsband en met zijn voeten uitgerekt in het blok, maar zijn rechter zorgt ervoor hem niet te doden. Hij leeft tot de tijd van Gallus, “tot zijn negenenzestigste jaar, en stierf te Tyrus, in welke stad hij ook begraven werd”."
      cs: "Za Decia je mučen železným obojkem a kládou, v níž mu roztahují nohy, ale jeho soudce dbá, aby ho nezabil. Dožívá se doby Gallovy, „do svého šedesátého devátého roku, a zemřel v Týru, v němž byl také pohřben“."
      sv: "Under Decius torteras han, med järnkrage och fötterna utsträckta i stocken, men hans domare ser till att inte döda honom. Han lever till Gallus’ tid, ”till sitt sextionionde år, och dog i Tyros, i vilken stad han också begravdes”."
      nb: "Under Decius blir han torturert, med jernhalsbånd og med føttene strukket i stokken, men dommeren passer på ikke å ta livet av ham. Han lever til Gallus' tid, «til sitt sekstiniende år, og døde i Tyros, i hvilken by han også ble gravlagt»."
      tl: "Sa ilalim ni Decio ay pinahihirapan siya, may kuwelyong bakal at nakaunat ang kaniyang mga paa sa mga pangaw, ngunit nag-iingat ang kaniyang hukom na huwag siyang patayin. Nabubuhay siya hanggang sa panahon ni Gallo, “hanggang sa kaniyang ikaanimnapu't siyam na taon, at namatay sa Tiro, na sa lungsod ding iyon ay inilibing siya”."
      da: "Under Decius bliver han tortureret med jernhalsbånd og med fødderne spændt ud i blokken, men hans dommer sørger for ikke at dræbe ham. Han lever til Gallus' tid, »til sit niogtredsindstyvende år, og døde i Tyrus, i hvilken by han også blev begravet«."
      sr: "За Декија је мучен гвозденим оковратником, а ноге су му растезали у кладама, али његов судија пази да га не убије. Живи до времена Гала, „до своје шездесет девете године, и умро је у Тиру, у ком је граду и сахрањен“."
      hu: "Decius alatt megkínozzák vasgallérral, lábát a kalodában kifeszítve, de bírája vigyáz, hogy meg ne ölje. Gallus idejéig él, „hatvankilencedik évéig, és Tírusz városában halt meg, ahol el is temették”."
      fi: "Deciuksen aikana häntä kidutetaan rautapannalla ja jalat jalkapuuhun venytettyinä, mutta hänen tuomarinsa varoo tappamasta häntä. Hän elää Galluksen aikaan asti, ”kuudenkymmenenyhdeksänteen ikävuoteensa asti, ja kuoli Tyroksessa, johon kaupunkiin hänet myös haudattiin”."
      vi: "Dưới thời Decius, ông bị tra tấn, bị đeo gông sắt và hai chân bị kéo giãn trong cùm, nhưng vị quan xử án cẩn thận không để ông chết. Ông sống đến thời Gallus, “đến năm thứ sáu mươi chín, và qua đời tại Ty-rơ, cũng là nơi ông được chôn”."
      ro: "Sub Deciu este supus torturii, cu cercul de fier la gât și cu picioarele întinse în butuci, dar judecătorul său are grijă să nu-l omoare. Trăiește până pe vremea lui Gallus, „până în al șaizeci și nouălea an, și a murit la Tir, cetate în care a și fost îngropat”."
      bg: "При Деций е измъчван с железен нашийник и с крака, разтегнати в клада, но съдията му внимава да не го убие. Той живее до времето на Гал, „до шестдесет и деветата си година, и умря в Тир, в който град е и погребан“."
