# Philip the evangelist, one of the seven: Acts 6, 8 and 21, in the order of the text.
# The tour's year (AD 34) is a conventional point, as for the conversion of Saul.
id: philip
title:
  en: "Philip the evangelist"
  ru: "Филипп благовестник"
  uk: "Пилип-євангеліст"
  es: "Felipe el evangelista"
  pt: "Filipe, o evangelista"
  de: "Philippus der Evangelist"
  fr: "Philippe l’évangéliste"
  pl: "Filip Ewangelista"
  it: "Filippo l’evangelista"
  nl: "Filippus de evangelist"
  cs: "Filip evangelista"
  sv: "Evangelisten Filippos"
year: "AD 34"
approximate: true
stops:
  - place: a15257a # Jerusalem
    ref: Acts.6.1-Acts.6.7
    note:
      en: "In Jerusalem Philip is chosen with Stephen among the seven to serve the tables."
      ru: "В Иерусалиме Филипп избран вместе со Стефаном в число семи, чтобы пещись о столах."
      uk: "В Єрусалимі Пилипа обирають разом зі Стефаном серед семи служити при столах."
      es: "En Jerusalén Felipe es elegido con Esteban entre los siete para servir a las mesas."
      pt: "Em Jerusalém, Filipe é escolhido com Estêvão entre os sete para servir às mesas."
      de: "In Jerusalem wird Philippus mit Stephanus unter den Sieben erwählt, um die Tische zu bedienen."
      fr: "À Jérusalem, Philippe est choisi avec Étienne parmi les sept pour servir aux tables."
      pl: "W Jerozolimie Filip zostaje wybrany wraz ze Szczepanem spośród siedmiu do posługi przy stołach."
      it: "A Gerusalemme Filippo è scelto con Stefano fra i sette per servire alle mense."
      nl: "In Jeruzalem wordt Filippus met Stefanus gekozen onder de zeven om de tafels te dienen."
      cs: "V Jeruzalémě je Filip spolu se Štěpánem zvolen mezi sedm, aby posluhovali u stolů."
      sv: "I Jerusalem utses Filippos tillsammans med Stefanos bland de sju för att tjäna vid borden."
  - place: a282dce # Samaria (region)
    ref: Acts.8.5-Acts.8.13
    note:
      en: "He goes down to the city of Samaria and preaches Christ, and the people with one accord give heed to him."
      ru: "Он приходит в город Самарийский и проповедует Христа, и народ единодушно внимает ему."
      uk: "Він сходить до міста Самарії й проповідує Христа, і народ однодушно слухає його."
      es: "Baja a la ciudad de Samaria y predica a Cristo, y el pueblo, de común acuerdo, presta atención a lo que dice."
      pt: "Desce à cidade de Samaria e prega a Cristo, e o povo, unânime, dá atenção a ele."
      de: "Er geht hinab in die Stadt Samaria und predigt Christus, und das Volk hört einmütig auf ihn."
      fr: "Il descend dans la ville de Samarie et prêche le Christ, et le peuple écoute Philippe d’un commun accord."
      pl: "Schodzi do miasta Samarii i głosi Chrystusa, a lud jednomyślnie zważa na jego słowa."
      it: "Scende nella città di Samaria e predica Cristo, e la folla ascolta unanime le sue parole."
      nl: "Hij gaat af naar de stad Samaria en predikt Christus, en het volk slaat eensgezind acht op hem."
      cs: "Sestupuje do města Samaří a káže Krista a lid jednomyslně dbá na jeho slova."
      sv: "Han går ner till staden Samaria och predikar Kristus, och folket lyssnar enigt till honom."
  - place: aa8edd2 # Gaza
    ref: Acts.8.26-Acts.8.39
    note:
      en: "On the desert road from Jerusalem to Gaza he baptises the Ethiopian eunuch."
      ru: "На пустынной дороге из Иерусалима в Газу он крестит евнуха-ефиоплянина."
      uk: "На пустельній дорозі з Єрусалима до Гази він хрестить ефіопського скопця."
      es: "En el camino desierto de Jerusalén a Gaza bautiza al eunuco etíope."
      pt: "Na estrada deserta de Jerusalém a Gaza, batiza o eunuco etíope."
      de: "Auf der Wüstenstraße von Jerusalem nach Gaza tauft er den äthiopischen Kämmerer."
      fr: "Sur la route déserte de Jérusalem à Gaza, il baptise l’eunuque éthiopien."
      pl: "Na pustynnej drodze z Jerozolimy do Gazy chrzci etiopskiego eunucha."
      it: "Sulla via deserta da Gerusalemme a Gaza battezza l’eunuco etiope."
      nl: "Op de woestijnweg van Jeruzalem naar Gaza doopt hij de Ethiopische kamerling."
      cs: "Na pusté cestě z Jeruzaléma do Gazy křtí etiopského dvořana."
      sv: "På ökenvägen från Jerusalem till Gaza döper han den etiopiske eunucken."
  - place: a30c937 # Ashdod (Azotus)
    ref: Acts.8.40
    note:
      en: "Philip is found at Ashdod (Azotus) and preaches in all the towns on the way to Caesarea."
      ru: "Филипп оказывается в Азоте и благовествует всем городам на пути в Кесарию."
      uk: "Пилипа знаходять в Ашдоді (Азот), і він проповідує по всіх містах на шляху до Кесарії."
      es: "Felipe es hallado en Asdod (Azoto) y predica en todas las ciudades de camino a Cesarea."
      pt: "Filipe é achado em Asdode (Azoto) e prega em todas as cidades do caminho até Cesareia."
      de: "Philippus wird in Aschdod (Azotus) gefunden und predigt in allen Städten auf dem Weg nach Caesarea."
      fr: "Philippe se retrouve à Asdod (Azot) et prêche dans toutes les villes jusqu’à Césarée."
      pl: "Filip zostaje odnaleziony w Aszdod (Azot) i głosi we wszystkich miastach w drodze do Cezarei."
      it: "Filippo si ritrova ad Asdod (Azoto) e predica in tutte le città lungo la via fino a Cesarea."
      nl: "Filippus wordt gevonden te Asdod (Azotus) en predikt in alle steden op weg naar Caesarea."
      cs: "Filip je nalezen v Ašdodu (Azot) a káže ve všech městech na cestě do Cesareje."
      sv: "Filippos påträffas i Ashdod (Azotus) och förkunnar i alla städer på vägen till Caesarea."
  - place: a58735e # Caesarea
    ref: Acts.21.8-Acts.21.9
    note:
      en: "Years later Paul stays in Caesarea at the house of Philip, whose four daughters prophesy."
      ru: "Спустя годы Павел останавливается в Кесарии в доме Филиппа, чьи четыре дочери пророчествуют."
      uk: "Роками пізніше Павло зупиняється в Кесарії в домі Пилипа, чотири доньки якого пророкують."
      es: "Años después Pablo se hospeda en Cesarea en casa de Felipe, cuyas cuatro hijas profetizan."
      pt: "Anos depois, Paulo se hospeda em Cesareia na casa de Filipe, cujas quatro filhas profetizam."
      de: "Jahre später wohnt Paulus in Caesarea im Haus des Philippus, dessen vier Töchter weissagen."
      fr: "Des années plus tard, Paul séjourne à Césarée chez Philippe, dont les quatre filles prophétisent."
      pl: "Lata później Paweł zatrzymuje się w Cezarei w domu Filipa, którego cztery córki prorokują."
      it: "Anni dopo Paolo alloggia a Cesarea in casa di Filippo, le cui quattro figlie profetizzano."
      nl: "Jaren later logeert Paulus te Caesarea in het huis van Filippus, wiens vier dochters profeteren."
      cs: "O léta později se Pavel zastavuje v Cesareji v domě Filipově, jehož čtyři dcery prorokují."
      sv: "År senare bor Paulus i Caesarea i Filippos’ hus, vars fyra döttrar profeterar."
