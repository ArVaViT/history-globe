# The letters to the seven churches, Revelation 1-3, in the order John is told to send
# them: a round from Ephesus north and back south-east. The tour's year (AD 95) is the
# traditional date under Domitian (Irenaeus); an earlier date, c. AD 68, is also held.
id: seven-churches
title:
  en: "The seven churches of Revelation"
  ru: "Семь церквей Откровения"
year: "AD 95"
approximate: true
stops:
  - place: a8f60f3 # Patmos
    ref: Rev.1.9-Rev.1.11
    note:
      en: "On the island called Patmos John is told to write what he sees and send it to the seven churches in Asia."
      ru: "На острове, называемом Патмос, Иоанну велено написать увиденное и послать семи церквам в Асии."
  - place: a5feb15 # Ephesus
    ref: Rev.2.1-Rev.2.7
    note:
      en: 'Ephesus: "you have left your first love."'
      ru: "Ефес: «ты оставил первую любовь твою»."
  - place: a2e65fb # Smyrna
    ref: Rev.2.8-Rev.2.11
    note:
      en: 'Smyrna: "be faithful unto death, and I will give you the crown of life."'
      ru: "Смирна: «будь верен до смерти, и дам тебе венец жизни»."
  - place: a75d2c1 # Pergamum
    ref: Rev.2.12-Rev.2.17
    note:
      en: "Pergamum, where Satan's throne is and Antipas, the faithful witness, was killed."
      ru: "Пергам, где престол сатаны и где умерщвлён верный свидетель Антипа."
  - place: a94b661 # Thyatira
    ref: Rev.2.18-Rev.2.29
    note:
      en: "Thyatira: its last works are more than the first, but it tolerates the woman Jezebel."
      ru: "Фиатира: последние дела её больше первых, но она попускает жене Иезавели."
  - place: aab4a5f # Sardis
    ref: Rev.3.1-Rev.3.6
    note:
      en: 'Sardis: "you have a name that you live, and are dead."'
      ru: "Сардис: «ты носишь имя, будто жив, но ты мёртв»."
  - place: a1c7cc1 # Philadelphia
    ref: Rev.3.7-Rev.3.13
    note:
      en: 'Philadelphia: "I have set before you an open door, which no one can shut."'
      ru: "Филадельфия: «Я отворил перед тобою дверь, и никто не может затворить её»."
  - place: a83fb1e # Laodicea
    ref: Rev.3.14-Rev.3.22
    note:
      en: 'Laodicea, neither cold nor hot: "Behold, I stand at the door and knock."'
      ru: "Лаодикия, ни холодная, ни горячая: «Се, стою у двери и стучу»."
