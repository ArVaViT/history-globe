# The letters to the seven churches, Revelation 1-3, in the order John is told to send
# them: a round from Ephesus north and back south-east. The tour's year (AD 95) is the
# traditional date under Domitian (Irenaeus); an earlier date, c. AD 68, is also held.
id: seven-churches
title:
  en: "The seven churches of Revelation"
  ru: "Семь церквей Откровения"
  uk: "Сім церков Одкровення"
  es: "Las siete iglesias del Apocalipsis"
  pt: "As sete igrejas do Apocalipse"
  de: "Die sieben Gemeinden der Offenbarung"
  fr: "Les sept Églises de l’Apocalypse"
  pl: "Siedem Kościołów z Apokalipsy"
  it: "Le sette chiese dell’Apocalisse"
  nl: "De zeven gemeenten van Openbaring"
  cs: "Sedm církví Zjevení"
  sv: "Uppenbarelsebokens sju församlingar"
  nb: "De sju menigheter i Johannes' Åpenbaring"
  tl: "Ang pitong iglesya ng Apocalipsis"
year: "AD 95"
approximate: true
stops:
  - place: a8f60f3 # Patmos
    ref: Rev.1.9-Rev.1.11
    note:
      en: "On the island called Patmos John is told to write what he sees and send it to the seven churches in Asia."
      ru: "На острове, называемом Патмос, Иоанну велено написать увиденное и послать семи церквам в Асии."
      uk: "На острові Патмос Іванові велять записати те, що він бачить, і послати до семи церков в Азії."
      es: "En la isla llamada Patmos se manda a Juan escribir lo que ve y enviarlo a las siete iglesias de Asia."
      pt: "Na ilha chamada Patmos, João recebe a ordem de escrever o que vê e de enviá-lo às sete igrejas da Ásia."
      de: "Auf der Insel Patmos wird Johannes aufgetragen, aufzuschreiben, was er sieht, und es an die sieben Gemeinden in Asia zu senden."
      fr: "Dans l’île appelée Patmos, Jean reçoit l’ordre d’écrire ce qu’il voit et de l’envoyer aux sept Églises d’Asie."
      pl: "Na wyspie zwanej Patmos Jan otrzymuje polecenie, by napisał to, co widzi, i posłał do siedmiu Kościołów w Azji."
      it: "Nell’isola detta Patmos Giovanni riceve l’ordine di scrivere ciò che vede e di inviarlo alle sette chiese dell’Asia."
      nl: "Op het eiland Patmos krijgt Johannes de opdracht op te schrijven wat hij ziet en het te sturen naar de zeven gemeenten in Asia."
      cs: "Na ostrově zvaném Patmos je Janovi řečeno, aby napsal, co vidí, a poslal to sedmi církvím v Asii."
      sv: "På ön som heter Patmos får Johannes befallning att skriva upp vad han ser och sända det till de sju församlingarna i Asien."
      nb: "På øya som kalles Patmos, får Johannes beskjed om å skrive det han ser, og sende det til de sju menigheter i Asia."
      tl: "Sa pulong tinatawag na Patmos, sinabihan si Juan na isulat ang kaniyang nakikita at ipadala ito sa pitong iglesya sa Asia."
  - place: a5feb15 # Ephesus
    ref: Rev.2.1-Rev.2.7
    by: sea
    note:
      en: 'Ephesus: "thou hast left thy first love."'
      ru: "Ефес: «ты оставил первую любовь твою»."
      uk: "Ефес: «ти любов твою перву оставив»."
      es: "Éfeso: «has dejado tu primer amor»."
      pt: "Éfeso: “você abandonou o seu primeiro amor.”"
      de: "Ephesus: „daß du die erste Liebe verlässest“."
      fr: "Éphèse : « tu as abandonné ton premier amour »."
      pl: "Efez: „żeś miłość twoję pierwszą opuścił.”"
      it: "Efeso: «hai lasciato il tuo primo amore»."
      nl: "Efeze: “Ik heb tegen u, dat gij uw eerste liefde hebt verlaten.”"
      cs: "Efez: „jsi tu první lásku svou opustil“."
      sv: "Efesos: ”du har övergivit din första kärlek.”"
      nb: "Efesos: «du har forlatt din første kjærlighet»."
      tl: "Efeso: “iniwan ang iyong unang pagibig.”"
  - place: a2e65fb # Smyrna
    ref: Rev.2.8-Rev.2.11
    note:
      en: 'Smyrna: "be thou faithful unto death, and I will give thee a crown of life."'
      ru: "Смирна: «будь верен до смерти, и дам тебе венец жизни»."
      uk: "Смирна: «Будь вірний аж до смерти, і дам тобі вінець життя»."
      es: "Esmirna: «Sé fiel hasta la muerte, y yo te daré la corona de la vida»."
      pt: "Esmirna: “Seja fiel até a morte, e eu lhe darei a coroa da vida.”"
      de: "Smyrna: „Sei getreu bis an den Tod, so will ich dir die Krone des Lebens geben.“"
      fr: "Smyrne : « Sois fidèle jusqu’à la mort, et je te donnerai la couronne de vie. »"
      pl: "Smyrna: „Bądź wierny aż do śmierci, a dam ci koronę żywota.”"
      it: "Smirne: «Sii fedele fino alla morte, e io ti darò la corona della vita»."
      nl: "Smyrna: “Zijt getrouw tot den dood, en Ik zal u geven de kroon des levens.”"
      cs: "Smyrna: „Budiž věrný až do smrti, a dámť korunu života.“"
      sv: "Smyrna: ”Var trogen intill döden, så skall jag giva dig livets krona.”"
      nb: "Smyrna: «Vær tro inntil døden, så vil jeg gi dig livsens krone!»"
      tl: "Smirna: “Magtapat ka hanggang sa kamatayan, at bibigyan kita ng putong ng buhay.”"
  - place: a75d2c1 # Pergamum
    ref: Rev.2.12-Rev.2.17
    note:
      en: "Pergamum, where Satan's seat is and Antipas, the faithful martyr, was slain."
      ru: "Пергам, где престол сатаны и где умерщвлён верный свидетель Антипа."
      uk: "Пергам, де престіл сатани й де вбито Антипу, вірного мученика."
      es: "Pérgamo, donde está el trono de Satanás y fue muerto Antipas, el fiel mártir."
      pt: "Pérgamo, onde está o trono de Satanás e onde foi morto Antipas, o mártir fiel."
      de: "Pergamon, wo der Thron des Satans steht und Antipas, der treue Märtyrer, getötet wurde."
      fr: "Pergame, où est le trône de Satan et où Antipas, le témoin fidèle, a été mis à mort."
      pl: "Pergamon, gdzie jest tron szatana i gdzie zabito Antypasa, wiernego męczennika."
      it: "Pergamo, dove ha sede Satana e dove fu ucciso Antipa, il fedele martire."
      nl: "Pergamum, waar de troon van de satan is en waar Antipas, de getrouwe getuige, werd gedood."
      cs: "Pergamon, kde je stolice satanova a kde byl zabit Antipas, věrný svědek."
      sv: "Pergamon, ”där varest Satan har sin tron” och där Antipas, ”mitt vittne, min trogne tjänare”, blev dräpt."
      nb: "Pergamon, hvor Satans trone står og Antipas, det trofaste vitne, ble slått ihjel."
      tl: "Ang Pergamo, kung saan naroon ang luklukan ni Satanas at kung saan pinatay si Antipas, ang tapat na martir."
  - place: a94b661 # Thyatira
    ref: Rev.2.18-Rev.2.29
    note:
      en: "Thyatira: its last works are more than the first, but it tolerates the woman Jezebel."
      ru: "Фиатира: последние дела её больше первых, но она попускает жене Иезавели."
      uk: "Тіатира: її останні діла кращі за перші, але вона терпить жінку Єзавель."
      es: "Tiatira: sus últimas obras son más que las primeras, pero tolera a la mujer Jezabel."
      pt: "Tiatira: as suas últimas obras são mais numerosas que as primeiras, mas ela tolera a mulher Jezabel."
      de: "Thyatira: Seine letzten Werke sind mehr als die ersten, aber es duldet die Frau Isebel."
      fr: "Thyatire : ses dernières œuvres sont plus nombreuses que les premières, mais elle laisse la femme Jézabel."
      pl: "Tiatyra: jej ostatnie uczynki są liczniejsze niż pierwsze, lecz znosi kobietę Izebel."
      it: "Tiatira: le sue ultime opere sono più numerose delle prime, ma tollera la donna Gezabele."
      nl: "Thyatira: zijn laatste werken zijn meer dan de eerste, maar het duldt de vrouw Izebel."
      cs: "Tyatira: její poslední skutky jsou větší než první, ale snáší ženu Jezábel."
      sv: "Tyatira: dess sista gärningar är flera än de första, men den tolererar kvinnan Isebel."
      nb: "Tyatira: dets siste gjerninger er flere enn de første, men det tåler kvinnen Jesabel."
      tl: "Tiatira: ang huli nitong mga gawa ay higit kaysa una, ngunit pinahihintulutan nito ang babaing si Jezabel."
  - place: aab4a5f # Sardis
    ref: Rev.3.1-Rev.3.6
    note:
      en: 'Sardis: "thou hast a name that thou livest, and art dead."'
      ru: "Сардис: «ты носишь имя, будто жив, но ты мертв»."
      uk: "Сарди: «маєш імя, що живеш, а мертвий єси»."
      es: "Sardis: «tienes nombre que vives, y estás muerto»."
      pt: "Sardes: “você tem a reputação de estar vivo, mas está morto.”"
      de: "Sardes: „du hast den Namen, daß du lebest, und bist tot.“"
      fr: "Sardes : « tu passes pour être vivant, et tu es mort »."
      pl: "Sardes: „masz imię, że żyjesz; aleś jest umarły.”"
      it: "Sardi: «tu hai nome di vivere e sei morto»."
      nl: "Sardes: “Ik weet uw werken, dat gij den naam hebt, dat gij leeft, en gij zijt dood.”"
      cs: "Sardy: „máš jméno, že jsi živ, ale jsi mrtvý“."
      sv: "Sardes: ”Du har det namnet om dig, att du lever, men du är död.”"
      nb: "Sardes: «du har navn av at du lever, og du er død»."
      tl: "Sardis: “ikaw ay may pangalang ikaw ay nabubuhay, at ikaw ay patay.”"
  - place: a1c7cc1 # Philadelphia
    ref: Rev.3.7-Rev.3.13
    note:
      en: 'Philadelphia: "I have set before thee an open door, and no man can shut it."'
      ru: "Филадельфия: «Я отворил перед тобою дверь, и никто не может затворить ее»."
      uk: "Філадельфія: «дав я перед тобою незачинені двері, і нїхто не може зачинити їх»."
      es: "Filadelfia: «he dado una puerta abierta delante de ti, la cual ninguno puede cerrar»."
      pt: "Filadélfia: “eis que coloquei diante de você uma porta aberta, a qual ninguém pode fechar.”"
      de: "Philadelphia: „Siehe, ich habe vor dir gegeben eine offene Tür, und niemand kann sie zuschließen.“"
      fr: "Philadelphie : « j’ai mis devant toi une porte ouverte, que personne ne peut fermer »."
      pl: "Filadelfia: „otom wystawił przed tobą drzwi otworzone, a żaden nie może ich zamknąć.”"
      it: "Filadelfia: «Ecco, io ti ho posta dinanzi una porta aperta, che nessuno può chiudere»."
      nl: "Filadelfia: “Zie, Ik heb een geopende deur voor u gegeven, en niemand kan die sluiten.”"
      cs: "Filadelfie: „postavil jsem před tebou dveře otevřené, a žádnýť jich nemůže zavříti“."
      sv: "Filadelfia: ”Se, jag har låtit dig finna en öppen dörr, som ingen kan tillsluta.”"
      nb: "Filadelfia: «se, jeg har satt foran dig en åpnet dør, og ingen kan lukke den til»."
      tl: "Filadelfia: “narito, inilagay ko sa harapan mo ang isang pintuang bukas, na di mailalapat ng sinoman.”"
  - place: a83fb1e # Laodicea
    ref: Rev.3.14-Rev.3.22
    note:
      en: 'Laodicea, neither cold nor hot: "Behold, I stand at the door, and knock."'
      ru: "Лаодикия, ни холодная, ни горячая: «Се, стою у двери и стучу»."
      uk: "Лаодікея, ні холодна, ні гаряча: «Ось, стою під дверми і стукаю»."
      es: "Laodicea, ni fría ni caliente: «He aquí, yo estoy á la puerta y llamo»."
      pt: "Laodiceia, nem fria nem quente: “Eis que estou à porta e bato.”"
      de: "Laodizea, weder kalt noch warm: „Siehe, ich stehe vor der Tür und klopfe an.“"
      fr: "Laodicée, ni froide ni chaude : « Voici, je me tiens à la porte, et je frappe. »"
      pl: "Laodycea, ani zimna, ani gorąca: „Oto stoję u drzwi i kołaczę.”"
      it: "Laodicea, né fredda né calda: «Ecco, io sto alla porta e picchio»."
      nl: "Laodicea, noch koud noch heet: “Zie, Ik sta aan de deur, en Ik klop.”"
      cs: "Laodikeia, ani studená, ani horká: „stojímť u dveří, a tluku“."
      sv: "Laodikeia, varken kall eller varm: ”Se, jag står för dörren och klappar.”"
      nb: "Laodikea, hverken kald eller varm: «Se, jeg står for døren og banker.»"
      tl: "Laodicea, na hindi malamig ni mainit: “Narito ako'y nakatayo sa pintuan at tumutuktok.”"
