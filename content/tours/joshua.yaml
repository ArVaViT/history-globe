# The conquest under Joshua, Joshua 6-24, in the order of the text. The tour's year
# (1406 BC) follows the Exodus tour's reckoning (1 Kgs 6:1, then forty years in the
# wilderness); the later date, c. 1220 BC, is also held, and the archaeology of Jericho
# and Ai is disputed (place-life.yaml leaves them undated). A point for the map.
id: joshua
title:
  en: "The conquest of Canaan"
  ru: "Завоевание Ханаана"
  uk: "Завоювання Ханаану"
  es: "La conquista de Canaán"
  pt: "A conquista de Canaã"
  de: "Die Eroberung Kanaans"
  fr: "La conquête de Canaan"
  pl: "Podbój Kanaanu"
  it: "La conquista di Canaan"
  nl: "De verovering van Kanaän"
  cs: "Dobytí Kanaánu"
  sv: "Erövringen av Kanaan"
  nb: "Erobringen av Kanaan"
  tl: "Ang pananakop sa Canaan"
  da: "Erobringen af Kana'an"
  sr: "Освајање Ханана"
year: "1406 BC"
people: ["Joshua@Exo.17.9-Heb"]
approximate: true
stops:
  - place: a231f80 # Jericho
    ref: Josh.6.1-Josh.6.21
    note:
      en: "The people shout, the trumpets sound, and the wall of Jericho falls down."
      ru: "Народ восклицает, трубят трубы, и стена Иерихона обрушивается."
      uk: "Народ кричить, сурми лунають, і мур Єрихону падає."
      es: "El pueblo grita, suenan las trompetas, y el muro de Jericó se derrumba."
      pt: "O povo grita, as trombetas soam, e o muro de Jericó cai."
      de: "Das Volk erhebt ein Geschrei, die Posaunen erschallen, und die Mauer Jerichos fällt um."
      fr: "Le peuple pousse des cris, les trompettes sonnent, et la muraille de Jéricho s’écroule."
      pl: "Lud wznosi okrzyk, rozbrzmiewają trąby i mur Jerycha się wali."
      it: "Il popolo grida, le trombe suonano e le mura di Gerico crollano."
      nl: "Het volk schreeuwt, de bazuinen klinken, en de muur van Jericho valt neer."
      cs: "Lid zvolá, zatroubí trouby a hradba Jericha padá."
      sv: "Folket ropar, trumpeterna ljuder, och Jerikos mur faller."
      nb: "Folket roper, basunene lyder, og Jerikos mur faller."
      tl: "Sumigaw ang bayan, humihip ang mga pakakak, at gumuho ang pader ng Jerico."
      da: "Folket råber, trompeterne lyder, og Jerikos mur falder."
      sr: "Народ виче, трубе трубе, и зид Јерихона пада."
  - place: a7e13e1 # Ai
    ref: Josh.8.1-Josh.8.29
    note:
      en: "Ai is taken by ambush and burnt, and left a heap of ruins for ever."
      ru: "Гай взят засадой и сожжён, обращён в вечные развалины."
      uk: "Гай здобуто засідкою й спалено, і він лишається купою руїн навіки."
      es: "Hai es tomada por emboscada e incendiada, y queda para siempre como un montón de ruinas."
      pt: "Ai é tomada por emboscada e incendiada, e deixada como um monte de ruínas para sempre."
      de: "Ai wird durch einen Hinterhalt eingenommen und verbrannt und für immer als Trümmerhaufen zurückgelassen."
      fr: "Aï est prise par embuscade et incendiée, et reste à jamais un monceau de ruines."
      pl: "Aj zostaje zdobyty z zasadzki i spalony, i pozostawiony na zawsze stosem ruin."
      it: "Ai è presa con un’imboscata e incendiata, e resta per sempre un mucchio di rovine."
      nl: "Ai wordt door een hinderlaag ingenomen en verbrand, en voor altijd tot een puinhoop gemaakt."
      cs: "Aj je dobyto ze zálohy a vypáleno a zůstává navždy hromadou trosek."
      sv: "Ai intas genom ett bakhåll och bränns, och lämnas som en ruinhög för alltid."
      nb: "Ai blir inntatt ved et bakhold og brent, og ligger for alltid som en ruinhaug."
      tl: "Nasakop ang Hai sa pamamagitan ng pananambang at sinunog, at ginawang bunton ng kagibaan magpakailan man."
      da: "Aj indtages ved baghold og brændes og efterlades som en evig ruinhob."
      sr: "Гај бива освојен заседом и спаљен, и остављен као гомила рушевина довека."
  - place: aa5cc66 # Mount Ebal
    ref: Josh.8.30-Josh.8.35
    note:
      en: "On Mount Ebal Joshua builds an altar and writes a copy of the law of Moses on the stones."
      ru: "На горе Гевал Иисус устраивает жертвенник и пишет на камнях список с закона Моисеева."
      uk: "На горі Евал Ісус Навин будує жертовник і пише на камінні список закону Мойсея."
      es: "En el Monte Ebal Josué edifica un altar y escribe en las piedras una copia de la ley de Moisés."
      pt: "No Monte Ebal, Josué constrói um altar e escreve nas pedras uma cópia da lei de Moisés."
      de: "Auf dem Berg Ebal baut Josua einen Altar und schreibt eine Abschrift des Gesetzes des Mose auf die Steine."
      fr: "Sur le Mont Ébal, Josué bâtit un autel et écrit sur les pierres une copie de la loi de Moïse."
      pl: "Na górze Ebal Jozue buduje ołtarz i pisze na kamieniach odpis Prawa Mojżesza."
      it: "Sul Monte Ebal Giosuè costruisce un altare e scrive sulle pietre una copia della legge di Mosè."
      nl: "Op de berg Ebal bouwt Jozua een altaar en schrijft op de stenen een afschrift van de wet van Mozes."
      cs: "Na hoře Ébal staví Jozue oltář a píše na kameny opis zákona Mojžíšova."
      sv: "På berget Ebal bygger Josua ett altare och skriver en avskrift av Moses lag på stenarna."
      nb: "På Ebal bygger Josva et alter og skriver en avskrift av Moses' lov på stenene."
      tl: "Sa Bundok Ebal ay nagtayo si Josue ng dambana at isinulat sa mga bato ang isang sipi ng kautusan ni Moises."
      da: "På Ebal-bjerget bygger Josva et alter og skriver en afskrift af Moses' lov på stenene."
      sr: "На гори Гевалу Исус подиже жртвеник и пише на камењу препис закона Мојсијевог."
  - place: aede336 # Gibeon
    ref: Josh.9.3-Josh.9.27
    note:
      en: "The men of Gibeon, pretending to come from far away, obtain a treaty."
      ru: "Жители Гаваона, выдав себя за пришедших издалека, добиваются мира."
      uk: "Мужі Гаваону, прикинувшись, що прийшли здалеку, домагаються союзу."
      es: "Los hombres de Gabaón, fingiendo venir de lejos, obtienen un tratado."
      pt: "Os homens de Gibeão, fingindo vir de longe, obtêm um tratado."
      de: "Die Männer von Gibeon, die vorgeben, aus der Ferne zu kommen, erlangen einen Bund."
      fr: "Les hommes de Gabaon, feignant de venir d’un pays éloigné, obtiennent un traité."
      pl: "Mężowie z Gibeon, udając, że przybyli z daleka, uzyskują układ."
      it: "Gli uomini di Gabaon, fingendo di venire da lontano, ottengono un trattato."
      nl: "De mannen van Gibeon, die doen alsof zij van ver komen, krijgen een verdrag."
      cs: "Muži z Gibeonu, kteří předstírají, že přišli z daleka, získávají smlouvu."
      sv: "Männen från Gibeon, som låtsas komma från långt borta, får ett fördrag."
      nb: "Mennene fra Gibeon, som later som de kommer langveis fra, oppnår en pakt."
      tl: "Ang mga tao ng Gabaon, na nagkunwaring galing sa malayo, ay nagkamit ng kasunduan."
      da: "Gibeons mænd, der foregiver at komme langvejs fra, får en traktat."
      sr: "Људи из Гаваона, претварајући се да долазе издалека, добијају савез."
  - place: a75b45e # Beth-horon
    ref: Josh.10.10-Josh.10.11
    note:
      en: "As the Amorites flee down the descent of Beth-horon, the Lord casts great hailstones on them."
      ru: "Когда Аморреи бегут по скату горы Вефоронской, Господь бросает на них с небес большие камни града."
      uk: "Коли амореї тікають по спуску Бет-Хорону, Господь кидає на них великий град."
      es: "Mientras los amorreos huyen por la bajada de Bet-horón, el Señor arroja sobre ellos grandes piedras de granizo."
      pt: "Enquanto os amorreus fogem pela descida de Bete-Horom, o Senhor lança sobre eles grandes pedras de granizo."
      de: "Als die Amoriter den Abhang von Bet-Horon hinabfliehen, wirft der Herr große Hagelsteine auf sie."
      fr: "Tandis que les Amoréens fuient dans la descente de Beth-Horon, l’Éternel jette sur eux de grosses pierres."
      pl: "Gdy Amoryci uciekają zboczem Bet-Choron, Pan zsyła na nich wielkie kamienie gradu."
      it: "Mentre gli Amorei fuggono lungo la discesa di Bet-Oron, il Signore getta su di loro grosse pietre di grandine."
      nl: "Terwijl de Amorieten vluchten langs de helling van Beth-Horon, laat de HEER grote hagelstenen op hen neervallen."
      cs: "Když Amorejští prchají po svahu Bét-choronu, Hospodin na ně vrhá veliké kroupy."
      sv: "När amoréerna flyr nedför sluttningen vid Bet-Horon låter Herren stora hagelstenar falla över dem."
      nb: "Mens amorittene flykter ned skråningen fra Bet-Horon, kaster Herren store hagelsten over dem."
      tl: "Habang tumatakas ang mga Amorrheo sa babaan sa Beth-horon, binagsakan sila ng Panginoon ng malalaking batong granizo."
      da: "Mens amoritterne flygter ned ad skråningen ved Bet-Horon, lader Herren store hagl falde på dem."
      sr: "Док Аморејци беже низ стрмен пут од Вет-Орона, Господ баца на њих велико камење с неба."
  - place: a2e6de9 # Valley of Aijalon
    ref: Josh.10.12-Josh.10.14
    note:
      en: '"Sun, stand thou still upon Gibeon; and thou, Moon, in the valley of Ajalon."'
      ru: "«Стой, солнце, над Гаваоном, и луна, над долиною Аиалонскою!»"
      uk: "«Сонце, стій над Габаоном; місяцю, над Аялоном!»"
      es: "«Sol, detente en Gabaón; y tú, Luna, en el valle de Ajalón»."
      pt: "“Sol, pare sobre Gibeom! E você, lua, pare no vale de Aijalom!”"
      de: "„Sonne, stehe still zu Gibeon, und Mond, im Tal Ajalon!“"
      fr: "« Soleil, arrête-toi sur Gabaon, et toi, lune, sur la vallée d’Ajalon ! »"
      pl: "„Słońce w Gabaon zastanów się, a miesiącu w dolinie Ajalon!”"
      it: "«Sole, fermati su Gabaon, e tu, luna, sulla valle d’Aialon!»"
      nl: "“Zon, sta stil te Gibeon, en gij, maan, in het dal van Ajalon!”"
      cs: "„Slunce v Gabaon zastav se, a měsíc v údolí Aialon.“"
      sv: "”Du sol, stå stilla i Gibeon, du måne, i Ajalons dal!”"
      nb: "«Stå stille, sol, i Gibeon, og du måne, i Ajalons dal!»"
      tl: "“Araw, tumigil ka sa Gabaon; At ikaw, Buwan, sa libis ng Ajalon.”"
      da: "»Sol, staa stille i Gibeon, og Maane, i Ajalons Dal!«"
      sr: "„Стани сунце над Гаваоном, и месече над долином елонском.“"
  - place: abf8e4e # Makkedah
    ref: Josh.10.16-Josh.10.27
    note:
      en: "The five kings hide in the cave at Makkedah and are brought out."
      ru: "Пять царей скрываются в пещере в Македе, и их выводят оттуда."
      uk: "П’ятеро царів ховаються в печері біля Македи, і їх виводять."
      es: "Los cinco reyes se esconden en la cueva de Maceda y son sacados."
      pt: "Os cinco reis se escondem na caverna de Maquedá e são tirados dali."
      de: "Die fünf Könige verbergen sich in der Höhle bei Makkeda und werden herausgeholt."
      fr: "Les cinq rois se cachent dans la caverne de Makkéda et en sont tirés."
      pl: "Pięciu królów ukrywa się w jaskini w Makkedzie i zostaje z niej wyprowadzonych."
      it: "I cinque re si nascondono nella caverna di Makkeda e ne vengono tirati fuori."
      nl: "De vijf koningen verbergen zich in de spelonk te Makkeda en worden naar buiten gebracht."
      cs: "Pět králů se skrývá v jeskyni u Makedy a jsou vyvedeni."
      sv: "De fem kungarna gömmer sig i grottan vid Mackeda och förs ut."
      nb: "De fem kongene gjemmer seg i hulen ved Makkeda og blir ført ut."
      tl: "Nagtago ang limang hari sa yungib sa Maceda at inilabas."
      da: "De fem konger skjuler sig i hulen ved Makkeda og bringes ud."
      sr: "Пет царева крије се у пећини у Макиди и бивају изведени."
  - place: a3cc590 # Lachish
    ref: Josh.10.31-Josh.10.32
    note:
      en: "Lachish is taken on the second day."
      ru: "Лахис взят на другой день."
      uk: "Лахіш здобуто на другий день."
      es: "Laquis es tomada al segundo día."
      pt: "Laquis é tomada no segundo dia."
      de: "Lachisch wird am zweiten Tag eingenommen."
      fr: "Lakis est prise le deuxième jour."
      pl: "Lakisz zostaje zdobyty drugiego dnia."
      it: "Lachis è presa il secondo giorno."
      nl: "Lachis wordt op de tweede dag ingenomen."
      cs: "Lachiš je dobyto druhého dne."
      sv: "Lakish intas på andra dagen."
      nb: "Lakisj blir inntatt den andre dagen."
      tl: "Nasakop ang Lachis sa ikalawang araw."
      da: "Lakisj indtages på den anden dag."
      sr: "Лахис бива освојен другог дана."
  - place: a6f33c5 # Hazor
    ref: Josh.11.10-Josh.11.11
    note:
      en: "Hazor, once the head of all those kingdoms, is taken and burnt with fire."
      ru: "Асор, прежде бывший главою всех этих царств, взят и сожжён огнём."
      uk: "Гацор, колись голову всіх тих царств, здобуто й спалено вогнем."
      es: "Hazor, antaño cabeza de todos aquellos reinos, es tomada y quemada a fuego."
      pt: "Hazor, outrora a cabeça de todos aqueles reinos, é tomada e queimada a fogo."
      de: "Hazor, einst das Haupt aller jener Königreiche, wird eingenommen und mit Feuer verbrannt."
      fr: "Hatsor, jadis la tête de tous ces royaumes, est prise et brûlée par le feu."
      pl: "Chasor, niegdyś głowa wszystkich tych królestw, zostaje zdobyty i spalony ogniem."
      it: "Asor, un tempo capo di tutti quei regni, è presa e arsa col fuoco."
      nl: "Hazor, eens het hoofd van al die koninkrijken, wordt ingenomen en met vuur verbrand."
      cs: "Chacor, někdejší hlava všech těch království, je dobyt a vypálen ohněm."
      sv: "Hasor, en gång huvudstad för alla de kungadömena, intas och bränns upp i eld."
      nb: "Hasor, som en gang var hodet for alle disse rikene, blir inntatt og brent opp med ild."
      tl: "Ang Hasor, na dating pangulo ng lahat ng kahariang yaon, ay nasakop at sinunog ng apoy."
      da: "Hazor, engang hovedet for alle disse riger, indtages og brændes med ild."
      sr: "Асор, некада глава свих тих царстава, бива освојен и спаљен огњем."
  - place: aa4680a # Shiloh
    ref: Josh.18.1
    year: "1400 BC"
    note:
      en: "The whole congregation gathers at Shiloh and sets up the tabernacle there."
      ru: "Всё общество собирается в Силом и ставит там скинию собрания."
      uk: "Вся громада збирається в Шіло й ставить там скинію."
      es: "Toda la congregación se reúne en Silo y levanta allí el tabernáculo."
      pt: "Toda a congregação se reúne em Siló e arma ali o tabernáculo."
      de: "Die ganze Gemeinde versammelt sich in Silo und richtet dort die Stiftshütte auf."
      fr: "Toute l’assemblée se réunit à Silo et y dresse le tabernacle."
      pl: "Całe zgromadzenie zbiera się w Szilo i stawia tam przybytek."
      it: "Tutta la comunità si raduna a Silo e vi erige il tabernacolo."
      nl: "De hele gemeente verzamelt zich te Silo en richt daar de tabernakel op."
      cs: "Celé shromáždění se schází v Šílu a staví tam stánek."
      sv: "Hela menigheten samlas i Shilo och sätter upp uppenbarelsetältet där."
      nb: "Hele menigheten samles i Sjilo og reiser tabernaklet der."
      tl: "Nagkatipon ang buong kapulungan sa Shiloh at itinayo roon ang tabernakulo."
      da: "Hele menigheden samles i Silo og rejser Åbenbaringsteltet der."
      sr: "Сав збор окупља се у Силу и ту подиже скинију."
  - place: adf74d4 # Shechem
    ref: Josh.24.1-Josh.24.28
    year: "1400 BC"
    note:
      en: 'At Shechem Joshua renews the covenant: "choose you this day whom ye will serve."'
      ru: "В Сихеме Иисус возобновляет завет: «изберите себе ныне, кому служить»."
      uk: "У Сихемі Ісус Навин оновлює союз: «вибирайте тепер, кому хочете служити»."
      es: "En Siquem Josué renueva el pacto: «escogeos hoy á quién sirváis»."
      pt: "Em Siquém, Josué renova a aliança: “escolham hoje a quem vão servir”."
      de: "In Sichem erneuert Josua den Bund: „so erwählt euch heute, wem ihr dienen wollt“."
      fr: "À Sichem, Josué renouvelle l’alliance : « choisissez aujourd’hui qui vous voulez servir »."
      pl: "W Sychem Jozue odnawia przymierze: „obierzcież sobie dziś, komu byście służyli”."
      it: "A Sichem Giosuè rinnova l’alleanza: «scegliete oggi a chi volete servire»."
      nl: "Te Sichem vernieuwt Jozua het verbond: “kiest u heden, wien gij dienen zult.”"
      cs: "V Šekemu Jozue obnovuje smlouvu: „vyvolte sobě dnes, komu byste sloužili“."
      sv: "I Shekem förnyar Josua förbundet: ”utväljen åt eder i dag vem I viljen tjäna.”"
      nb: "I Sikem fornyer Josva pakten: «velg idag hvem I vil tjene»."
      tl: "Sa Sichem ay binago ni Josue ang tipan: “piliin ninyo sa araw na ito kung sino ang inyong paglilingkuran.”"
      da: "I Sikem fornyer Josva pagten: »udvælger eder i Dag, hvem I ville tjene«."
      sr: "У Сихему Исус обнавља савез: „изаберите себи данас коме ћете служити.“"
