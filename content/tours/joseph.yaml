# Joseph, Genesis 37-50, in the order of the text. The tour's year (1700 BC) is a
# conventional point for the map, like Abraham's: the age of the patriarchs is disputed,
# and the slider says so for the Middle Bronze Age. With the Exodus at 1446 BC it fits a
# short stay in Egypt; the 430 years of Exod 12:40 would put Joseph near 1900 BC.
id: joseph
title:
  en: "Joseph in Egypt"
  ru: "Иосиф в Египте"
  uk: "Йосип у Єгипті"
  es: "José en Egipto"
  pt: "José no Egito"
  de: "Josef in Ägypten"
  fr: "Joseph en Égypte"
  pl: "Józef w Egipcie"
  it: "Giuseppe in Egitto"
  nl: "Jozef in Egypte"
  cs: "Josef v Egyptě"
  sv: "Josef i Egypten"
  nb: "Josef i Egypt"
  tl: "Si Jose sa Egipto"
  da: "Josef i Egypten"
  sr: "Јосиф у Египту"
  hu: "József Egyiptomban"
  fi: "Joosef Egyptissä"
  vi: "Giô-sép tại Ê-díp-tô"
  ro: "Iosif în Egipt"
  bg: "Йосиф в Египет"
year: "1700 BC"
people: ["Joseph@Gen.30.24-Rev"]
approximate: true
stops:
  - place: a375f5a # Valley of Hebron
    ref: Gen.37.14
    note:
      en: "Israel sends Joseph from the valley of Hebron to see how his brothers are."
      ru: "Израиль посылает Иосифа из долины Хевронской узнать, здоровы ли братья."
      uk: "Ізраїль посилає Йосипа з Хевронської долини побачити, як поживають його брати."
      es: "Israel envía a José desde el valle de Hebrón para ver cómo están sus hermanos."
      pt: "Israel envia José do vale de Hebrom para ver como estão os seus irmãos."
      de: "Israel sendet Josef aus dem Tal von Hebron, um nachzusehen, wie es seinen Brüdern geht."
      fr: "Israël envoie Joseph de la vallée d’Hébron voir comment vont ses frères."
      pl: "Izrael posyła Józefa z Doliny Hebronu, aby zobaczył, jak się mają jego bracia."
      it: "Israele manda Giuseppe dalla valle di Ebron a vedere come stanno i suoi fratelli."
      nl: "Israël zendt Jozef uit het dal van Hebron om te zien hoe het met zijn broers gaat."
      cs: "Izrael posílá Josefa z údolí Hebronu, aby se podíval, jak se mají jeho bratři."
      sv: "Israel sänder Josef från Hebrons dal för att se hur det står till med hans bröder."
      nb: "Israel sender Josef fra Hebrons dal for å se hvordan det står til med brødrene."
      tl: "Sinugo ni Israel si Jose mula sa libis ng Hebron upang alamin kung kumusta ang kaniyang mga kapatid."
      da: "Israel sender Josef fra Hebrons dal for at se, hvordan det står til med hans brødre."
      sr: "Израиљ шаље Јосифа из долине хевронске да види како су његова браћа."
      hu: "Izráel elküldi Józsefet a hebroni völgyből, hogy nézze meg, hogy vannak testvérei."
      fi: "Israel lähettää Joosefin Hebronin laaksosta katsomaan, miten hänen veljillään on."
      vi: "Y-sơ-ra-ên sai Giô-sép từ trũng Hếp-rôn đi xem các anh mình ra sao."
      ro: "Israel îl trimite pe Iosif din valea Hebronului să vadă cum le merge fraților săi."
      bg: "Израил изпраща Йосиф от Хевронската долина да види как са братята му."
  - place: adf74d4 # Shechem
    ref: Gen.37.14-Gen.37.16
    note:
      en: "He comes to Shechem and wanders in the field looking for them."
      ru: "Он приходит в Сихем и блуждает в поле, ища их."
      uk: "Він приходить до Сихема й блукає полем, шукаючи їх."
      es: "Llega a Siquem y anda errante por el campo buscándolos."
      pt: "Chega a Siquém e vaga pelo campo à procura deles."
      de: "Er kommt nach Sichem und irrt auf dem Feld umher, um sie zu suchen."
      fr: "Il arrive à Sichem et erre dans la campagne à leur recherche."
      pl: "Przychodzi do Sychem i błąka się po polu, szukając ich."
      it: "Giunge a Sichem e vaga per i campi cercandoli."
      nl: "Hij komt te Sichem en dwaalt in het veld rond op zoek naar hen."
      cs: "Přichází do Šekemu a bloudí po poli a hledá je."
      sv: "Han kommer till Shekem och irrar omkring på marken och söker efter dem."
      nb: "Han kommer til Sikem og farer omkring på marken og leter etter dem."
      tl: "Dumating siya sa Sichem at gumala sa bukid na hinahanap sila."
      da: "Han kommer til Sikem og vandrer rundt på marken for at lede efter dem."
      sr: "Долази у Сихем и лута по пољу тражећи их."
      hu: "Sikembe érkezik, és a mezőn bolyong, őket keresve."
      fi: "Hän tulee Sikemiin ja harhailee pellolla etsien heitä."
      vi: "Người đến Si-chem và đi lang thang ngoài đồng tìm họ."
      ro: "Ajunge la Sihem și rătăcește pe câmp căutându-i."
      bg: "Той идва в Сихем и се лута в полето, търсейки ги."
  - place: ab635e4 # Dothan
    ref: Gen.37.17-Gen.37.28
    note:
      en: "At Dothan his brothers throw him into a pit and sell him to the Ishmaelites for twenty pieces of silver."
      ru: "В Дофане братья бросают его в ров и продают Измаильтянам за двадцать сребренников."
      uk: "У Дофані брати кидають його в яму й продають ізмаїльтянам за двадцять срібняків."
      es: "En Dotán sus hermanos lo echan en una cisterna y lo venden a los ismaelitas por veinte piezas de plata."
      pt: "Em Dotã, os irmãos o lançam numa cisterna e o vendem aos ismaelitas por vinte peças de prata."
      de: "In Dotan werfen seine Brüder ihn in eine Grube und verkaufen ihn für zwanzig Silberstücke an die Ismaeliter."
      fr: "À Dothan, ses frères le jettent dans une citerne et le vendent aux Ismaélites pour vingt pièces d’argent."
      pl: "W Dotan bracia wrzucają go do studni i sprzedają Izmaelitom za dwadzieścia srebrników."
      it: "A Dotan i suoi fratelli lo gettano in una cisterna e lo vendono agli Ismaeliti per venti pezzi d’argento."
      nl: "Te Dotan gooien zijn broers hem in een put en verkopen hem voor twintig zilverstukken aan de Ismaëlieten."
      cs: "V Dótanu ho bratři vhazují do jámy a prodávají Jišmaelcům za dvacet stříbrných."
      sv: "I Dotan kastar hans bröder honom i en grop och säljer honom till ismaeliterna för tjugo silverpenningar."
      nb: "I Dotan kaster brødrene ham i en brønn og selger ham til ismaelittene for tyve sølvstykker."
      tl: "Sa Dotan ay inihagis siya ng kaniyang mga kapatid sa isang balon at ipinagbili sa mga Ismaelita sa halagang dalawampung putol na pilak."
      da: "I Dotan kaster hans brødre ham i en cisterne og sælger ham til ismaelitterne for tyve sølvstykker."
      sr: "У Дотаиму га браћа бацају у јаму и продају Исмаилићанима за двадесет сребрњака."
      hu: "Dótánnál testvérei verembe vetik, és húsz ezüstért eladják az izmaelitáknak."
      fi: "Dotanissa hänen veljensä heittävät hänet kuoppaan ja myyvät hänet ismaelilaisille kahdestakymmenestä hopeapenningistä."
      vi: "Tại Đô-than, các anh quăng người xuống một cái hố và bán người cho dân Ích-ma-ên giá hai mươi miếng bạc."
      ro: "La Dotan, frații îl aruncă într-o groapă și îl vând ismaeliților pentru douăzeci de arginți."
      bg: "При Дотан братята му го хвърлят в един ров и го продават на исмаилтяните за двадесет сребърника."
  - place: af301ca # Egypt
    ref: Gen.39.1-Gen.39.6
    note:
      en: "In Egypt Potiphar, the captain of Pharaoh's guard, buys him, and the Lord is with Joseph."
      ru: "В Египте его покупает Потифар, начальник телохранителей фараона, и Господь с Иосифом."
      uk: "У Єгипті Потіфар, начальник охорони фараона, купує його, і Господь з Йосипом."
      es: "En Egipto lo compra Potifar, capitán de la guardia del Faraón, y el Señor está con José."
      pt: "No Egito, Potifar, capitão da guarda do Faraó, o compra, e o Senhor está com José."
      de: "In Ägypten kauft ihn Potiphar, der Oberste der Leibwache des Pharao, und der Herr ist mit Josef."
      fr: "En Égypte, Potiphar, chef des gardes de Pharaon, l’achète, et l’Éternel est avec Joseph."
      pl: "W Egipcie kupuje go Potifar, dowódca straży Faraona, i Pan jest z Józefem."
      it: "In Egitto Potifar, capo delle guardie del faraone, lo compra, e il Signore è con Giuseppe."
      nl: "In Egypte koopt Potifar, de overste van de lijfwacht van Farao, hem, en de HEER is met Jozef."
      cs: "V Egyptě ho kupuje Potifar, velitel faraonovy stráže, a Hospodin je s Josefem."
      sv: "I Egypten köper Potifar, befälhavare för faraos livvakt, honom, och Herren är med Josef."
      nb: "I Egypt kjøper Potifar, Faraos livvaktsjef, ham, og Herren er med Josef."
      tl: "Sa Egipto ay binili siya ni Potiphar, ang kapitan ng bantay ni Faraon, at ang Panginoon ay sumasa kay Jose."
      da: "I Egypten køber Potifar, øverste for Faraos livvagt, ham, og Herren er med Josef."
      sr: "У Египту га купује Петефрије, заповедник фараонове страже, и Господ је с Јосифом."
      hu: "Egyiptomban Potifár, a fáraó testőrségének parancsnoka megveszi, és az Úr Józseffel van."
      fi: "Egyptissä faraon henkivartioston päällikkö Potifar ostaa hänet, ja Herra on Joosefin kanssa."
      vi: "Tại Ê-díp-tô, Phô-ti-pha, quan chỉ huy đội thị vệ của Pha-ra-ôn, mua người, và Đức Giê-hô-va ở cùng Giô-sép."
      ro: "În Egipt îl cumpără Potifar, căpetenia gărzii lui Faraon, iar Domnul este cu Iosif."
      bg: "В Египет го купува Потифар, началникът на фараоновата стража, и Господ е с Йосиф."
  - place: acd9137 # Heliopolis (On)
    ref: Gen.41.41-Gen.41.45
    note:
      en: "Set over all the land of Egypt, he is given Asenath, daughter of Poti-pherah, priest of On, that is Heliopolis."
      ru: "Поставленный над всею землёю Египетскою, он получает в жёны Асенефу, дочь Потифера, жреца Илиопольского."
      uk: "Поставлений над усією землею Єгипту, він отримує Асенефу, дочку Потіфери, священика Она, тобто Геліополя."
      es: "Puesto sobre toda la tierra de Egipto, recibe por mujer a Asenat, hija de Potifera, sacerdote de On, es decir, Heliópolis."
      pt: "Posto sobre toda a terra do Egito, recebe Asenate, filha de Potífera, sacerdote de Om, isto é, Heliópolis."
      de: "Über das ganze Land Ägypten gesetzt, erhält er Asnat zur Frau, die Tochter Potiferas, des Priesters von On, das ist Heliopolis."
      fr: "Établi sur tout le pays d’Égypte, il reçoit pour femme Asnath, fille de Poti-Phéra, prêtre d’On, c’est-à-dire Héliopolis."
      pl: "Ustanowiony nad całą ziemią Egiptu, otrzymuje Asenat, córkę Potifery, kapłana On, czyli Heliopolis."
      it: "Posto a capo di tutto il paese d’Egitto, riceve in moglie Asenat, figlia di Potifera, sacerdote di On, cioè Eliopoli."
      nl: "Aangesteld over heel Egypte krijgt hij Asnat, de dochter van Potifera, priester van On, dat is Heliopolis."
      cs: "Ustanoven nad celou egyptskou zemí, dostává za ženu Asenat, dceru Poti-fery, kněze v On, to jest v Héliopoli."
      sv: "Satt över hela Egyptens land får han Asenat, dotter till Potifera, präst i On, det vill säga Heliopolis."
      nb: "Satt over hele Egypt får han Asenat, datter av Potifera, presten i On, det vil si Heliopolis."
      tl: "Itinalaga sa buong lupain ng Egipto, ibinigay sa kaniya si Asenath, anak ni Potiphera, saserdote sa On, na siyang Heliopolis."
      da: "Sat over hele Egyptens land får han Asenat, datter af Potifera, præst i On, det er Heliopolis."
      sr: "Постављен над целом земљом египатском, добија Асенету, кћер Потифере, свештеника онског, то јест Хелиополиса."
      hu: "Egész Egyiptom fölé helyezve feleségül kapja Aszenátot, Potifera leányát, On, azaz Héliopolisz papjáét."
      fi: "Koko Egyptin maan hallitsijaksi asetettuna hän saa vaimokseen Asenatin, Onin, se on Heliopoliin, papin Potiferan tyttären."
      vi: "Được đặt cai trị cả xứ Ê-díp-tô, người được ban Ách-nát, con gái Phô-ti-phê-ra, thầy tế lễ thành Ôn, tức là Hê-li-ô-bô-li."
      ro: "Pus peste toată țara Egiptului, primește de soție pe Asenat, fiica lui Potifera, preotul din On, adică Heliopolis."
      bg: "Поставен над цялата египетска земя, той получава за жена Асенета, дъщерята на Потифера, жреца на Он, тоест Хелиополис."
  - place: a60f092 # Goshen
    ref: Gen.46.28-Gen.46.30
    note:
      en: "In Goshen he meets his father Israel, falls on his neck and weeps a long while."
      ru: "В Гесеме он встречает отца своего Израиля, падает ему на шею и долго плачет."
      uk: "У Гошені він зустрічає свого батька Ізраїля, падає йому на шию й довго плаче."
      es: "En Gosén se encuentra con su padre Israel, se echa sobre su cuello y llora largo rato."
      pt: "Em Gósen encontra seu pai Israel, lança-se ao seu pescoço e chora por muito tempo."
      de: "In Goschen trifft er seinen Vater Israel, fällt ihm um den Hals und weint lange."
      fr: "À Gosen, il rencontre son père Israël, se jette à son cou et pleure longtemps."
      pl: "W Goszen spotyka swego ojca Izraela, pada mu na szyję i długo płacze."
      it: "A Gosen incontra suo padre Israele, gli si getta al collo e piange a lungo."
      nl: "In Gosen ontmoet hij zijn vader Israël, valt hem om de hals en weent lange tijd."
      cs: "V Gošenu se setkává se svým otcem Izraelem, padá mu kolem krku a dlouho pláče."
      sv: "I Goshen möter han sin fader Israel, faller honom om halsen och gråter länge."
      nb: "I Gosen møter han sin far Israel, faller ham om halsen og gråter lenge."
      tl: "Sa Gosen ay sinalubong niya ang kaniyang amang si Israel, yumakap sa leeg nito at umiyak nang matagal."
      da: "I Gosjen møder han sin far Israel, falder ham om halsen og græder længe."
      sr: "У Гесему среће оца свог Израиља, пада му око врата и дуго плаче."
      hu: "Gósenben találkozik atyjával, Izráellel, a nyakába borul, és sokáig sír."
      fi: "Gosenissa hän tapaa isänsä Israelin, lankeaa tämän kaulaan ja itkee pitkän aikaa."
      vi: "Tại Gô-sen, người gặp cha mình là Y-sơ-ra-ên, ôm lấy cổ và khóc lâu."
      ro: "În Gosen își întâlnește tatăl, pe Israel, i se aruncă de gât și plânge multă vreme."
      bg: "В Гесем той посреща баща си Израил, хвърля се на врата му и дълго плаче."
  - place: a2f186d # Atad
    ref: Gen.50.10-Gen.50.11
    note:
      en: "At the threshing floor of Atad beyond the Jordan they mourn Jacob seven days."
      ru: "У Горен-гаатада при Иордане семь дней плачут по Иакову."
      uk: "На току Горен-га-Атад за Йорданом вони оплакують Якова сім днів."
      es: "En la era de Atad, al otro lado del Jordán, hacen duelo por Jacob siete días."
      pt: "Na eira de Atade, além do Jordão, pranteiam Jacó por sete dias."
      de: "An der Tenne Atad jenseits des Jordan halten sie sieben Tage lang die Trauer um Jakob."
      fr: "À l’aire d’Athad, au-delà du Jourdain, ils font le deuil de Jacob pendant sept jours."
      pl: "Na klepisku Atad za Jordanem opłakują Jakuba przez siedem dni."
      it: "All’aia di Atad, al di là del Giordano, fanno lutto per Giacobbe per sette giorni."
      nl: "Bij de dorsvloer van Atad aan de overzijde van de Jordaan rouwen zij zeven dagen om Jakob."
      cs: "Na humně Atad za Jordánem oplakávají Jákoba sedm dní."
      sv: "Vid Atads tröskplats på andra sidan Jordan sörjer de Jakob i sju dagar."
      nb: "Ved treskeplassen Goren-Haatad på hin side Jordan sørger de over Jakob i sju dager."
      tl: "Sa giikan ni Atad sa dako pa roon ng Jordan ay ipinagluksa nila si Jacob nang pitong araw."
      da: "Ved Atads tærskeplads hinsides Jordan sørger de over Jakob i syv dage."
      sr: "На гумну Хатадовом преко Јордана оплакују Јакова седам дана."
      hu: "Az Átád szérűjénél, a Jordánon túl hét napig gyászolják Jákóbot."
      fi: "Atadin puimatantereella Jordanin takana he surevat Jaakobia seitsemän päivää."
      vi: "Tại Gô-ren-A-tát bên kia sông Giô-đanh, họ để tang Gia-cốp bảy ngày."
      ro: "La aria lui Atad, dincolo de Iordan, îl jelesc pe Iacov șapte zile."
      bg: "При гумното Атад отвъд Йордан те оплакват Яков седем дни."
  - place: ae00861 # Machpelah
    ref: Gen.50.12-Gen.50.13
    note:
      en: "Jacob is buried in the cave of the field of Machpelah, which Abraham bought."
      ru: "Иакова погребают в пещере на поле Махпела, которую купил Авраам."
      uk: "Якова ховають у печері поля Махпела, яке купив Авраам."
      es: "Jacob es sepultado en la cueva del campo de Macpela, que Abraham compró."
      pt: "Jacó é sepultado na caverna do campo de Macpela, que Abraão comprou."
      de: "Jakob wird in der Höhle auf dem Feld Machpela begraben, das Abraham gekauft hatte."
      fr: "Jacob est enseveli dans la caverne du champ de Macpéla, qu’Abraham avait achetée."
      pl: "Jakub zostaje pochowany w jaskini na polu Makpela, które kupił Abraham."
      it: "Giacobbe è sepolto nella caverna del campo di Macpela, che Abramo aveva comprato."
      nl: "Jakob wordt begraven in de spelonk van het veld van Machpela, dat Abraham heeft gekocht."
      cs: "Jákob je pohřben v jeskyni na poli Makpela, které koupil Abraham."
      sv: "Jakob begravs i grottan på Makpelas åker, som Abraham köpte."
      nb: "Jakob blir gravlagt i hulen på Makpela-marken, som Abraham kjøpte."
      tl: "Inilibing si Jacob sa yungib ng bukid ng Macpela, na binili ni Abraham."
      da: "Jakob bliver begravet i hulen på Makpelas mark, som Abraham købte."
      sr: "Јаков је сахрањен у пећини на њиви Макпели, коју је купио Аврам."
      hu: "Jákóbot a makpélai mező barlangjában temetik el, amelyet Ábrahám vásárolt."
      fi: "Jaakob haudataan Makpelan pellon luolaan, jonka Abraham osti."
      vi: "Gia-cốp được chôn trong hang của đồng ruộng Mặc-bê-la, mà Áp-ra-ham đã mua."
      ro: "Iacov este îngropat în peștera din ogorul Macpela, pe care o cumpărase Avraam."
      bg: "Яков е погребан в пещерата на нивата Махпела, която Авраам беше купил."
