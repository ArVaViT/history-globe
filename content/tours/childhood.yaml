# The childhood of Jesus, Luke 1-2, in Luke's order only (Matthew's account is in the tour
# of His life). The census of Luke 2:1-3 is not cited, so that no stop ties the birth to a
# disputed date. The tour's year (5 BC) is the conventional point of the birth (c. 6-4 BC);
# the visit at twelve years old carries AD 8, counted from it (c. AD 7-9 with the birth's
# uncertainty). The return to Nazareth (2:39) is Luke's; it is not set against Matthew's
# flight to Egypt.
id: childhood
title:
  en: "The childhood of Jesus, after Luke"
  ru: "Детство Иисуса, по Луке"
  uk: "Дитинство Ісуса за Лукою"
  es: "La infancia de Jesús, según Lucas"
  pt: "A infância de Jesus, segundo Lucas"
  de: "Die Kindheit Jesu nach Lukas"
  fr: "L’enfance de Jésus, selon Luc"
  pl: "Dzieciństwo Jezusa według Łukasza"
  it: "L’infanzia di Gesù, secondo Luca"
  nl: "De jeugd van Jezus, volgens Lukas"
  cs: "Dětství Ježíšovo podle Lukáše"
  sv: "Jesu barndom, enligt Lukas"
  nb: "Jesu barndom, etter Lukas"
  tl: "Ang kabataan ni Jesus, ayon kay Lucas"
  da: "Jesu barndom efter Lukas"
year: "5 BC"
people: ["Jesus@Isa.7.14-Rev"]
approximate: true
stops:
  - place: af5884f # Nazareth
    ref: Luke.1.26-Luke.1.38
    note:
      en: 'In Nazareth the angel Gabriel is sent to Mary, and she answers: "Behold the handmaid of the Lord; be it unto me according to thy word."'
      ru: "В Назарет послан Ангел Гавриил к Марии, и Она отвечает: «се, Раба Господня; да будет Мне по слову твоему»."
      uk: "У Назареті ангел Гавриїл посланий до Марії, і вона відповідає: «Се рабиня Господня: нехай станеть ся менї по слову твоєму»."
      es: "En Nazaret el ángel Gabriel es enviado a María, y ella responde: «He aquí la sierva del Señor; hágase á mí conforme á tu palabra»."
      pt: "Em Nazaré o anjo Gabriel é enviado a Maria, e ela responde: “Eis aqui a serva do Senhor; que se cumpra em mim segundo a sua palavra.”"
      de: "In Nazareth wird der Engel Gabriel zu Maria gesandt, und sie antwortet: „Siehe ich bin des HERRN Magd; mir geschehe, wie du gesagt hast.“"
      fr: "À Nazareth, l’ange Gabriel est envoyé à Marie, qui répond : « Je suis la servante du Seigneur ; qu’il me soit fait selon ta parole ! »"
      pl: "W Nazarecie anioł Gabriel zostaje posłany do Marii, a ona odpowiada: „Oto służebnica Pańska; niechże mi się stanie według słowa twego.”"
      it: "A Nazaret l’angelo Gabriele è mandato a Maria, ed ella risponde: «Ecco, io son l’ancella del Signore; siami fatto secondo la tua parola»."
      nl: "Te Nazareth wordt de engel Gabriël naar Maria gezonden, en zij antwoordt: “Zie, de dienstmaagd des Heeren; mij geschiede naar uw woord.”"
      cs: "V Nazaretu je k Marii poslán anděl Gabriel a ona odpovídá: „Aj, služebnice Páně, staniž mi se podle slova tvého.“"
      sv: "I Nasaret sänds ängeln Gabriel till Maria, och hon svarar: ”Se, jag är Herrens tjänarinna; ske mig såsom du har sagt.”"
      nb: "I Nasaret blir engelen Gabriel sendt til Maria, og hun svarer: «Se, jeg er Herrens tjenerinne; mig skje efter ditt ord!»"
      tl: "Sa Nazaret, isinugo ang anghel na si Gabriel kay Maria, at sumagot siya: “Narito, ang alipin ng Panginoon; mangyari sa akin ang ayon sa iyong salita.”"
      da: "I Nazaret sendes engelen Gabriel til Maria, og hun svarer: »Se, jeg er Herrens Tjenerinde; mig ske efter dit Ord!«"
  - place: a112427 # Bethlehem
    ref: Luke.2.4-Luke.2.20
    note:
      en: 'In Bethlehem, the city of David, Mary lays her firstborn in a manger; to shepherds in the fields a multitude of the heavenly host praises God: "Glory to God in the highest, and on earth peace, good will toward men."'
      ru: "В Вифлееме, городе Давидовом, Мария полагает Первенца в ясли; пастухам в поле является воинство небесное, славящее Бога: «слава в вышних Богу, и на земле мир, в человеках благоволение!»"
      uk: "У Вифлеємі, місті Давида, Марія кладе свого первістка в ясла; пастухам у полі безліч небесного воїнства славить Бога: «Слава на вишинах Богу, а на землї впокій, між людьми благоволеннє»."
      es: "En Belén, la ciudad de David, María acuesta a su primogénito en un pesebre; a unos pastores en el campo una multitud del ejército celestial alaba a Dios: «Gloria en las alturas á Dios, y en la tierra paz, buena voluntad para con los hombres»."
      pt: "Em Belém, a cidade de Davi, Maria deita o seu primogênito numa manjedoura; a pastores nos campos uma multidão do exército celestial louva a Deus: “Glória a Deus nas maiores alturas, e paz na terra, boa vontade para com os homens.”"
      de: "In Bethlehem, der Stadt Davids, legt Maria ihren erstgeborenen Sohn in eine Krippe; den Hirten auf dem Feld lobt die Menge der himmlischen Heerscharen Gott: „Ehre sei Gott in der Höhe und Frieden auf Erden und den Menschen ein Wohlgefallen.“"
      fr: "À Bethléhem, la ville de David, Marie couche son premier-né dans une crèche ; à des bergers dans les champs, une multitude de l’armée céleste loue Dieu : « Gloire à Dieu dans les lieux très hauts, et paix sur la terre parmi les hommes qu’il agrée ! »"
      pl: "W Betlejem, mieście Dawida, Maria kładzie swego pierworodnego w żłobie; pasterzom na polu mnóstwo wojska niebieskiego wielbi Boga: „Chwała na wysokościach Bogu, a na ziemi pokój, w ludziach dobre upodobanie.”"
      it: "A Betlemme, la città di Davide, Maria depone il suo primogenito in una mangiatoia; ai pastori nei campi una moltitudine dell’esercito celeste loda Dio: «Gloria a Dio ne’ luoghi altissimi, pace in terra fra gli uomini ch’Egli gradisce!»"
      nl: "In Bethlehem, de stad van David, legt Maria haar eerstgeborene in een kribbe; aan herders in het veld looft een menigte van het hemelse heir God: “Ere zij God in de hoogste hemelen, en vrede op aarde, in de mensen een welbehagen.”"
      cs: "V Betlémě, městě Davidově, Marie klade svého prvorozeného do jeslí; pastýřům na polích chválí Boha zástup nebeského vojska: „Sláva na výsostech Bohu, a na zemi pokoj, lidem dobrá vůle.“"
      sv: "I Betlehem, Davids stad, lägger Maria sin förstfödde son i en krubba; för herdarna på marken lovar en stor hop av den himmelska härskaran Gud: ”Ära vare Gud i höjden, och frid på jorden, bland människor till vilka han har behag!”"
      nb: "I Betlehem, Davids by, legger Maria sin førstefødte i en krybbe; for gjeterne på marken priser en himmelsk hærskare Gud: «Ære være Gud i det høieste, og fred på jorden, i mennesker hans velbehag!»"
      tl: "Sa Bethlehem, ang bayan ni David, inihiga ni Maria ang kaniyang panganay sa isang sabsaban; sa mga pastol sa mga bukid, pinuri ng isang karamihan ng hukbong makalangit ang Diyos: “Luwalhati sa Dios sa kataastaasan, At sa lupa'y kapayapaan sa mga taong kinalulugdan niya.”"
      da: "I Betlehem, Davids by, lægger Maria sin førstefødte i en krybbe; for hyrderne på marken lovpriser en mængde af himmelske hærskarer Gud: »Ære være Gud i det højeste! og Fred paa Jorden! i Mennesker Velbehag!«"
  - place: a15257a # Jerusalem
    ref: Luke.2.22-Luke.2.38
    note:
      en: 'In the Temple at Jerusalem Simeon takes the child in his arms: "Lord, now lettest thou thy servant depart in peace"; Anna speaks of Him to all who look for redemption.'
      ru: "В храме в Иерусалиме Симеон берёт Младенца на руки: «Ныне отпускаешь раба Твоего, Владыко, по слову Твоему, с миром»; Анна говорит о Нём всем, ожидавшим избавления."
      uk: "У храмі в Єрусалимі Симеон бере дитя на руки: «Нинї відпускаєш раба твого, Владико, по глаголу твоєму, з упокоєм»; Анна говорить про Нього всім, хто чекає визволення."
      es: "En el Templo de Jerusalén Simeón toma al niño en sus brazos: «Ahora despides, Señor, á tu siervo, conforme á tu palabra, en paz»; Ana habla de él a todos los que esperaban la redención."
      pt: "No Templo, em Jerusalém, Simeão toma o menino nos braços: “Agora despedes o teu servo, Soberano… em paz”; Ana fala dele a todos os que esperam a redenção."
      de: "Im Tempel zu Jerusalem nimmt Simeon das Kind auf seine Arme: „HERR, nun läßt du deinen Diener in Frieden fahren“; Hanna spricht von ihm zu allen, die auf die Erlösung warten."
      fr: "Dans le temple de Jérusalem, Siméon prend l’enfant dans ses bras : « Maintenant, Seigneur, tu laisses ton serviteur s’en aller en paix » ; Anne parle de lui à tous ceux qui attendent la délivrance."
      pl: "W świątyni jerozolimskiej Symeon bierze dziecię w ramiona: „Teraz puszczasz sługę twego, Panie! według słowa twego, w pokoju”; Anna mówi o Nim wszystkim, którzy oczekują odkupienia."
      it: "Nel Tempio di Gerusalemme Simeone prende il bambino fra le braccia: «Ora, o mio Signore, tu lasci andare in pace il tuo servo»; Anna parla di lui a tutti quelli che attendono la redenzione."
      nl: "In de tempel te Jeruzalem neemt Simeon het kind in zijn armen: “Nu laat Gij, Heere! Uw dienstknecht gaan in vrede”; Anna spreekt over Hem tot allen die op verlossing wachten."
      cs: "V chrámě v Jeruzalémě bere Simeon dítě do náručí: „Nyní propouštíš služebníka svého, Pane, podle slova svého v pokoji“; Anna o něm mluví všem, kdo očekávají vykoupení."
      sv: "I templet i Jerusalem tar Simeon barnet i sin famn: ”Herre, nu låter du din tjänare fara hädan i frid”; Hanna talar om honom för alla som väntar på förlossning."
      nb: "I templet i Jerusalem tar Simeon barnet i sine armer: «Herre! nu lar du din tjener fare herfra i fred»; Anna taler om ham til alle som venter på forløsning."
      tl: "Sa Templo sa Jerusalem, kinalong ni Simeon ang sanggol: “Ngayo'y papanawin mo, Panginoon, ang iyong alipin”; nagsalita si Ana tungkol sa Kaniya sa lahat ng naghihintay ng katubusan."
      da: "I templet i Jerusalem tager Simeon barnet i sine arme: »Herre! nu lader du din Tjener fare i Fred, efter dit Ord«; Anna taler om ham til alle, der venter på forløsning."
  - place: af5884f # Nazareth
    ref: Luke.2.39-Luke.2.40
    note:
      en: "They return to Galilee, to their own city Nazareth, and the child grows, filled with wisdom."
      ru: "Они возвращаются в Галилею, в свой город Назарет, и Младенец возрастает, исполняясь премудрости."
      uk: "Вони повертаються до Галілеї, до свого міста Назарета, і дитя росте, сповнюючись мудрості."
      es: "Vuelven a Galilea, a su ciudad de Nazaret, y el niño crece, lleno de sabiduría."
      pt: "Voltam à Galileia, à sua própria cidade, Nazaré, e o menino cresce, cheio de sabedoria."
      de: "Sie kehren nach Galiläa zurück, in ihre Stadt Nazareth, und das Kind wächst, voller Weisheit."
      fr: "Ils retournent en Galilée, dans leur ville de Nazareth, et l’enfant grandit, rempli de sagesse."
      pl: "Wracają do Galilei, do swego miasta Nazaret, a dziecię rośnie, napełnione mądrością."
      it: "Tornano in Galilea, alla loro città di Nazaret, e il bambino cresce, pieno di sapienza."
      nl: "Zij keren terug naar Galilea, naar hun eigen stad Nazareth, en het kind groeit op, vervuld van wijsheid."
      cs: "Vracejí se do Galileje, do svého města Nazareta, a dítě roste, naplněno moudrostí."
      sv: "De vänder tillbaka till Galileen, till sin egen stad Nasaret, och barnet växer upp, fyllt av vishet."
      nb: "De vender tilbake til Galilea, til sin egen by Nasaret, og barnet vokser og fylles med visdom."
      tl: "Bumalik sila sa Galilea, sa kanilang sariling lungsod ng Nazaret, at lumaki ang bata, puspos ng karunungan."
      da: "De vender tilbage til Galilæa, til deres egen by Nazaret, og barnet vokser og fyldes af visdom."
  - place: a15257a # Jerusalem
    ref: Luke.2.41-Luke.2.50
    year: "AD 8"
    note:
      en: 'At twelve He stays behind in Jerusalem after the Passover and is found in the Temple among the teachers: "wist ye not that I must be about my Father''s business?"'
      ru: "В двенадцать лет Он остаётся в Иерусалиме после Пасхи, и Его находят в храме посреди учителей: «или вы не знали, что Мне должно быть в том, что принадлежит Отцу Моему?»"
      uk: "У дванадцять років Він залишається в Єрусалимі після Пасхи, і Його знаходять у храмі серед учителів: «хиба ж не знали, що в тому, що єсть Отця мого, треба бути менї?»"
      es: "A los doce años se queda en Jerusalén después de la Pascua y lo encuentran en el Templo entre los doctores: «¿No sabíais que en los negocios de mi Padre me conviene estar?»"
      pt: "Aos doze anos, Ele fica em Jerusalém depois da Páscoa e é encontrado no Templo entre os mestres: “Não sabiam que eu devo estar na casa de meu Pai?”"
      de: "Mit zwölf Jahren bleibt er nach dem Passafest in Jerusalem zurück und wird im Tempel unter den Lehrern gefunden: „Wisset ihr nicht, daß ich sein muß in dem, das meines Vaters ist?“"
      fr: "À douze ans, il reste à Jérusalem après la Pâque et on le trouve dans le temple au milieu des docteurs : « Ne saviez-vous pas qu’il faut que je m’occupe des affaires de mon Père ? »"
      pl: "W wieku dwunastu lat zostaje w Jerozolimie po święcie Paschy i zostaje odnaleziony w świątyni wśród nauczycieli: „Izaliście nie wiedzieli, iż w tych rzeczach, które są Ojca mego, ja być muszę?”"
      it: "A dodici anni rimane a Gerusalemme dopo la Pasqua e lo si ritrova nel Tempio in mezzo ai dottori: «Non sapevate ch’io dovea trovarmi nella casa del Padre mio?»"
      nl: "Op zijn twaalfde blijft Hij na het Pascha achter in Jeruzalem en wordt in de tempel gevonden te midden van de leraars: “Wist gij niet, dat Ik moet zijn in de dingen Mijns Vaders?”"
      cs: "Ve dvanácti letech zůstává po velikonocích v Jeruzalémě a je nalezen v chrámě mezi učiteli: „Zdaliž jste nevěděli, že v těch věcech, kteréž jsou Otce mého, musím já býti?“"
      sv: "Vid tolv års ålder stannar han kvar i Jerusalem efter påsken och återfinns i templet bland lärarna: ”Vissten I då icke att jag bör vara där min Fader bor?”"
      nb: "Som tolvåring blir han igjen i Jerusalem etter påsken og blir funnet i templet blant lærerne: «Visste I ikke at jeg må være i min Faders hus?»"
      tl: "Sa edad na labindalawa, nagpaiwan Siya sa Jerusalem pagkatapos ng Paskua at natagpuan sa Templo sa gitna ng mga guro: “di baga talastas ninyo na dapat akong maglumagak sa bahay ng aking Ama?”"
      da: "Som tolvårig bliver han tilbage i Jerusalem efter påsken og findes i templet blandt lærerne: »Vidste I ikke, at jeg bør være i min Faders Gerning?«"
  - place: af5884f # Nazareth
    ref: Luke.2.51-Luke.2.52
    year: "AD 8"
    note:
      en: "He goes down with them to Nazareth and is subject unto them, and increases in wisdom and stature, and in favour with God and man."
      ru: "Он приходит с ними в Назарет и находится в повиновении у них, преуспевая в премудрости и возрасте и в любви у Бога и человеков."
      uk: "Він іде з ними до Назарета й слухняний їм, і росте мудрістю й віком, і в ласці в Бога та людей."
      es: "Baja con ellos a Nazaret y les está sujeto, y crece en sabiduría y en estatura, y en gracia ante Dios y ante los hombres."
      pt: "Desce com eles a Nazaré e lhes é submisso, e cresce em sabedoria e estatura, e em graça diante de Deus e dos homens."
      de: "Er geht mit ihnen nach Nazareth hinab und ist ihnen untertan und nimmt zu an Weisheit, Alter und Gnade bei Gott und den Menschen."
      fr: "Il descend avec eux à Nazareth et leur est soumis, et il croît en sagesse, en stature et en grâce devant Dieu et devant les hommes."
      pl: "Schodzi z nimi do Nazaretu i jest im poddany, i wzrasta w mądrości, we wzroście i w łasce u Boga i u ludzi."
      it: "Scende con loro a Nazaret e sta loro sottomesso, e cresce in sapienza, in statura e in grazia davanti a Dio e davanti agli uomini."
      nl: "Hij gaat met hen mee naar Nazareth en is hun onderdanig, en neemt toe in wijsheid en grootte, en in genade bij God en de mensen."
      cs: "Sestupuje s nimi do Nazareta a je jim poddán a prospívá moudrostí i věkem a milostí u Boha i u lidí."
      sv: "Han följer med dem ner till Nasaret och är dem underdånig, och han växer till i ålder och vishet och nåd inför Gud och människor."
      nb: "Han drar ned med dem til Nasaret og er dem lydig, og han vokser til i visdom og vekst og i nåde hos Gud og mennesker."
      tl: "Bumaba Siyang kasama nila sa Nazaret at nagpasakop sa kanila, at lumago sa karunungan at sa tangkad, at sa lingap ng Diyos at ng mga tao."
      da: "Han drager med dem ned til Nazaret og er dem lydig, og han tiltager i visdom og vækst og i yndest hos Gud og mennesker."
