# Jacob, Genesis 28-46, in the order of the text. The tour's year (1800 BC) is a
# conventional point for the map between the Abraham and Joseph tours: the age of the
# patriarchs is disputed, and the slider says so for the Middle Bronze Age.
id: jacob
title:
  en: "Jacob"
  ru: "Иаков"
  uk: "Яків"
  es: "Jacob"
  pt: "Jacó"
  de: "Jakob"
  fr: "Jacob"
  pl: "Jakub"
  it: "Giacobbe"
  nl: "Jakob"
  cs: "Jákob"
  sv: "Jakob"
  nb: "Jakob"
  tl: "Jacob"
  da: "Jakob"
year: "1800 BC"
people: ["Israel@Gen.25.26-Rev"]
approximate: true
stops:
  - place: a075d61 # Beersheba
    ref: Gen.28.10
    note:
      en: "Jacob leaves Beersheba and sets out for Haran."
      ru: "Иаков выходит из Вирсавии и идёт в Харран."
      uk: "Яків залишає Беер-Шеву й вирушає до Харану."
      es: "Jacob sale de Beerseba y emprende el camino hacia Harán."
      pt: "Jacó deixa Berseba e parte para Harã."
      de: "Jakob verlässt Beerscheba und macht sich auf nach Haran."
      fr: "Jacob quitte Beer-Schéba et part pour Haran."
      pl: "Jakub opuszcza Beer-Szebę i wyrusza do Charanu."
      it: "Giacobbe lascia Bersabea e si mette in cammino verso Carran."
      nl: "Jakob verlaat Berseba en trekt naar Haran."
      cs: "Jákob odchází z Beer-šeby a vydává se do Cháranu."
      sv: "Jakob lämnar Beer Sheva och beger sig mot Harran."
      nb: "Jakob forlater Beer-Sjeba og drar mot Harran."
      tl: "Umalis si Jacob sa Beer-seba at naglakbay patungong Haran."
      da: "Jakob forlader Beersheba og begiver sig på vej mod Karan."
  - place: a64f355 # Bethel
    ref: Gen.28.11-Gen.28.19
    note:
      en: 'He dreams of a ladder reaching to heaven: "Surely the LORD is in this place; and I knew it not."'
      ru: "Ему снится лестница до неба: «истинно Господь присутствует на месте сем; а я не знал!»"
      uk: "Йому сниться драбина до неба: «Певно єсть Господь на врочищі сьому, а я й не знав»."
      es: "Sueña con una escala que llega al cielo: «Ciertamente Jehová está en este lugar, y yo no lo sabía»."
      pt: "Sonha com uma escada que chega ao céu: “Certamente o SENHOR está neste lugar, e eu não sabia.”"
      de: "Ihm träumt von einer Leiter, die bis an den Himmel reicht: „Gewiß ist der HERR an diesem Ort, und ich wußte es nicht“."
      fr: "Il rêve d’une échelle qui touche le ciel : « Certainement, l’Éternel est en ce lieu, et moi, je ne le savais pas ! »"
      pl: "Śni o drabinie sięgającej nieba: „Zaprawdę Pan jest na tem miejscu, a jam nie wiedział.”"
      it: "Sogna una scala che arriva al cielo: «Certo, l’Eterno è in questo luogo ed io non lo sapevo!»"
      nl: "Hij droomt van een ladder die tot de hemel reikt: “Gewisselijk is de HEERE aan deze plaats, en ik heb het niet geweten!”"
      cs: "Zdá se mu o žebříku sahajícím do nebe: „V pravdě Hospodin jest na místě tomto, a já jsem nevěděl.“"
      sv: "Han drömmer om en stege som når upp till himmelen: ”HERREN är sannerligen på denna plats, och jag visste det icke!”"
      nb: "Han drømmer om en stige som når opp til himmelen: «Sannelig, Herren er på dette sted, og jeg visste det ikke.»"
      tl: "Nanaginip siya ng isang hagdan na umaabot sa langit: “Tunay na ang Panginoon ay nasa dakong ito, at hindi ko nalalaman.”"
      da: "Han drømmer om en stige, der rækker til himlen: »Sandelig, Herren er paa dette Sted, og jeg vidste det ikke.«"
  - place: a6d9af3 # Haran
    ref: Gen.29.4-Gen.29.30
    note:
      en: "In Haran he serves seven years for Rachel, and they seem to him but a few days."
      ru: "В Харране он служит за Рахиль семь лет, и они кажутся ему за несколько дней."
      uk: "У Харані він служить сім років за Рахіль, і вони здаються йому кількома днями."
      es: "En Harán sirve siete años por Raquel, y le parecen pocos días."
      pt: "Em Harã serve sete anos por Raquel, e lhe parecem apenas poucos dias."
      de: "In Haran dient er sieben Jahre um Rahel, und sie kommen ihm vor wie wenige Tage."
      fr: "À Haran, il sert sept ans pour Rachel, et ils lui semblent n’être que quelques jours."
      pl: "W Charanie służy siedem lat za Rachelę, a wydaje mu się to zaledwie kilkoma dniami."
      it: "A Carran serve sette anni per Rachele, e gli sembrano pochi giorni."
      nl: "In Haran dient hij zeven jaar voor Rachel, en zij komen hem voor als maar een paar dagen."
      cs: "V Cháranu slouží sedm let za Ráchel a zdá se mu to jen několik dní."
      sv: "I Harran tjänar han sju år för Rakel, och de tycks honom bara några dagar."
      nb: "I Harran tjener han i sju år for Rakel, og de synes ham bare som noen få dager."
      tl: "Sa Haran ay naglingkod siya ng pitong taon dahil kay Raquel, at sa kaniya'y tila ilang araw lamang ang mga iyon."
      da: "I Karan tjener han syv år for Rakel, og de forekommer ham kun som nogle få dage."
  - place: ae5bfe9 # Mahanaim
    ref: Gen.32.1-Gen.32.2
    note:
      en: 'The angels of God meet him: "This is God''s host."'
      ru: "Его встречают Ангелы Божии: «это ополчение Божие»."
      uk: "Ангели Божі зустрічають його: «Се Божий полк»."
      es: "Los ángeles de Dios le salen al encuentro: «El campo de Dios es este»."
      pt: "Os anjos de Deus o encontram: “Este é o exército de Deus.”"
      de: "Die Engel Gottes begegnen ihm: „Es sind Gottes Heere.“"
      fr: "Les anges de Dieu viennent à sa rencontre : « C’est le camp de Dieu ! »"
      pl: "Spotykają go aniołowie Boży: „Obóz to Boży.”"
      it: "Gli angeli di Dio gli vengono incontro: «Questo è il campo di Dio»."
      nl: "De engelen van God ontmoeten hem: “Dit is een heirleger Gods!”"
      cs: "Potkávají se s ním andělé Boží: „Vojsko Boží jest toto.“"
      sv: "Guds änglar möter honom: ”Detta är Guds skara.”"
      nb: "Guds engler møter ham: «Dette er Guds leir.»"
      tl: "Sinalubong siya ng mga anghel ng Dios: “Ito'y hukbo ng Dios.”"
      da: "Guds engle møder ham: »Denne er Guds Hær.«"
  - place: a8a9ff9 # Penuel
    ref: Gen.32.24-Gen.32.31
    note:
      en: 'He wrestles until daybreak, is named Israel, and calls the place Penuel: "I have seen God face to face."'
      ru: "Он борется до зари, получает имя Израиль и называет место Пенуэл: «я видел Бога лицем к лицу»."
      uk: "Він б’ється до світанку, дістає ім’я Ізраїль і називає те місце Пенуел: «бачив бо я Бога лицем до лиця»."
      es: "Lucha hasta el amanecer, recibe el nombre de Israel y llama al lugar Peniel: «vi á Dios cara á cara»."
      pt: "Luta até o romper do dia, recebe o nome Israel e chama o lugar Peniel: “Vi a Deus face a face.”"
      de: "Er ringt bis zum Anbruch der Morgenröte, wird Israel genannt und nennt den Ort Penuel: „denn ich habe Gott von Angesicht gesehen“."
      fr: "Il lutte jusqu’au lever du jour, reçoit le nom d’Israël et appelle le lieu Peniel : « j’ai vu Dieu face à face »."
      pl: "Zmaga się do świtu, otrzymuje imię Izrael i nazywa to miejsce Penuel: „Iżem widział Boga twarzą w twarz.”"
      it: "Lotta fino all’alba, riceve il nome di Israele e chiama il luogo Penuel: «ho veduto Iddio a faccia a faccia»."
      nl: "Hij worstelt tot het aanbreken van de dag, krijgt de naam Israël en noemt de plaats Peniël: “ik heb God gezien van aangezicht tot aangezicht”."
      cs: "Zápasí až do svítání, dostává jméno Izrael a nazývá místo Penuel: „nebo jsem prý viděl Boha tváří v tvář“."
      sv: "Han brottas till gryningen, får namnet Israel och kallar platsen Penuel: ”jag har sett Gud ansikte mot ansikte”."
      nb: "Han kjemper til det gryr av dag, får navnet Israel og kaller stedet Penuel: «jeg har sett Gud åsyn til åsyn»."
      tl: "Nakipagbuno siya hanggang sa pagbubukang-liwayway, tinawag na Israel, at pinangalanan niyang Peniel ang dako: “nakita ko ang Dios ng mukhaan.”"
      da: "Han kæmper til daggry, får navnet Israel og kalder stedet Penuel: »jeg har set Gud Ansigt til Ansigt«."
  - place: a0905b5 # Succoth
    ref: Gen.33.17
    note:
      en: "At Succoth he builds a house and booths for his cattle."
      ru: "В Сокхофе он строит себе дом и шалаши для скота."
      uk: "У Сокхоті він будує дім і колиби для своєї худоби."
      es: "En Sucot edifica una casa y cabañas para su ganado."
      pt: "Em Sucote constrói uma casa e cabanas para o seu gado."
      de: "In Sukkot baut er sich ein Haus und Hütten für sein Vieh."
      fr: "À Succoth, il bâtit une maison et fait des cabanes pour son bétail."
      pl: "W Sukkot buduje dom i szałasy dla swego bydła."
      it: "A Succot si costruisce una casa e fa delle capanne per il suo bestiame."
      nl: "Te Sukkot bouwt hij een huis en hutten voor zijn vee."
      cs: "V Sukotu si staví dům a stany pro svůj dobytek."
      sv: "I Suckot bygger han ett hus och hyddor åt sin boskap."
      nb: "I Sukkot bygger han et hus og hytter til sin buskap."
      tl: "Sa Succoth ay nagtayo siya ng bahay at ng mga balag para sa kaniyang mga hayop."
      da: "I Sukkot bygger han et hus og løvhytter til sit kvæg."
  - place: adf74d4 # Shechem
    ref: Gen.33.18-Gen.33.20
    note:
      en: "He comes safely to Shechem in the land of Canaan and sets up an altar."
      ru: "Он благополучно приходит в Сихем в земле Ханаанской и ставит там жертвенник."
      uk: "Він благополучно приходить до Сихема в землі Ханаан і ставить жертовник."
      es: "Llega sano y salvo a Siquem, en la tierra de Canaán, y levanta un altar."
      pt: "Chega em segurança a Siquém, na terra de Canaã, e levanta um altar."
      de: "Er kommt wohlbehalten nach Sichem im Land Kanaan und errichtet einen Altar."
      fr: "Il arrive sain et sauf à Sichem, dans le pays de Canaan, et dresse un autel."
      pl: "Szczęśliwie dociera do Sychem w ziemi Kanaan i stawia ołtarz."
      it: "Giunge sano e salvo a Sichem, nel paese di Canaan, ed erige un altare."
      nl: "Hij komt behouden te Sichem in het land Kanaän en richt een altaar op."
      cs: "Bezpečně přichází do Šekemu v zemi Kanaán a staví oltář."
      sv: "Han kommer välbehållen till Shekem i Kanaans land och reser ett altare."
      nb: "Han kommer uskadd til Sikem i Kanaans land og reiser et alter."
      tl: "Ligtas siyang dumating sa Sichem sa lupain ng Canaan at nagtayo ng dambana."
      da: "Han når sikkert til Sikem i Kana'ans land og rejser et alter."
  - place: a64f355 # Bethel
    ref: Gen.35.6-Gen.35.15
    note:
      en: "Back at Bethel God appears to him again and confirms the name Israel."
      ru: "В Вефиле Бог снова является ему и подтверждает имя Израиль."
      uk: "Знову в Бет-Елі Бог являється йому ще раз і підтверджує ім’я Ізраїль."
      es: "De nuevo en Betel, Dios se le aparece otra vez y confirma el nombre de Israel."
      pt: "De volta a Betel, Deus lhe aparece de novo e confirma o nome Israel."
      de: "Wieder in Bethel erscheint ihm Gott noch einmal und bestätigt den Namen Israel."
      fr: "De retour à Béthel, Dieu lui apparaît de nouveau et confirme le nom d’Israël."
      pl: "Z powrotem w Betel Bóg ukazuje mu się ponownie i potwierdza imię Izrael."
      it: "Di nuovo a Betel Dio gli appare ancora e conferma il nome di Israele."
      nl: "Weer te Bethel verschijnt God hem opnieuw en bevestigt de naam Israël."
      cs: "Zpět v Bét-elu se mu Bůh znovu zjevuje a potvrzuje jméno Izrael."
      sv: "Åter i Betel visar sig Gud för honom på nytt och bekräftar namnet Israel."
      nb: "Tilbake i Betel viser Gud seg for ham igjen og stadfester navnet Israel."
      tl: "Pagbalik sa Beth-el ay muling napakita sa kaniya ang Dios at pinagtibay ang pangalang Israel."
      da: "Tilbage i Betel viser Gud sig for ham igen og stadfæster navnet Israel."
  - place: a112427 # Bethlehem
    ref: Gen.35.16-Gen.35.20
    note:
      en: "On the way to Ephrath, that is Bethlehem, Rachel dies giving birth, and Jacob sets a pillar on her grave."
      ru: "На дороге в Ефрафу, то есть Вифлеем, умирает Рахиль, родив сына, и Иаков ставит памятник над её гробом."
      uk: "Дорогою до Ефрати, тобто Вифлеєма, Рахіль помирає, народжуючи, і Яків ставить стовп на її гробі."
      es: "De camino a Efrata, que es Belén, Raquel muere al dar a luz, y Jacob pone una columna sobre su sepultura."
      pt: "No caminho para Efrata, isto é, Belém, Raquel morre ao dar à luz, e Jacó levanta uma coluna sobre o seu túmulo."
      de: "Auf dem Weg nach Efrata, das ist Bethlehem, stirbt Rahel bei der Geburt, und Jakob richtet ein Mal auf ihrem Grab auf."
      fr: "Sur le chemin d’Éphrata, c’est-à-dire Bethléhem, Rachel meurt en mettant au monde un enfant, et Jacob dresse un monument sur sa tombe."
      pl: "W drodze do Efraty, czyli Betlejem, Rachela umiera przy porodzie, a Jakub stawia słup na jej grobie."
      it: "Sulla via di Efrata, cioè Betlemme, Rachele muore partorendo, e Giacobbe erige una stele sulla sua tomba."
      nl: "Op weg naar Efrata, dat is Bethlehem, sterft Rachel bij de bevalling, en Jakob zet een gedenkteken op haar graf."
      cs: "Na cestě do Efraty, to jest do Betléma, Ráchel při porodu umírá a Jákob staví na jejím hrobě sloup."
      sv: "På vägen till Efrata, det vill säga Betlehem, dör Rakel i barnsäng, och Jakob reser en vård på hennes grav."
      nb: "På veien til Efrat, det er Betlehem, dør Rakel i barnsnød, og Jakob reiser en støtte på hennes grav."
      tl: "Sa daan patungong Ephrata, na siyang Bethlehem, namatay si Raquel sa panganganak, at nagtayo si Jacob ng haligi sa kaniyang libingan."
      da: "På vejen til Efrat, det er Betlehem, dør Rakel i barselseng, og Jakob rejser en støtte på hendes grav."
  - place: a85151a # Hebron
    ref: Gen.35.27-Gen.35.29
    note:
      en: "He comes to his father Isaac at Mamre, which is Hebron; Isaac dies, and Esau and Jacob bury him."
      ru: "Он приходит к отцу своему Исааку в Мамре, то есть Хеврон; Исаак умирает, и Исав с Иаковом погребают его."
      uk: "Він приходить до свого батька Ісаака в Мамре, тобто Хеврон; Ісаак помирає, і Ісав та Яків ховають його."
      es: "Llega junto a su padre Isaac, en Mamre, que es Hebrón; Isaac muere, y Esaú y Jacob lo sepultan."
      pt: "Chega a seu pai Isaque em Manre, que é Hebrom; Isaque morre, e Esaú e Jacó o sepultam."
      de: "Er kommt zu seinem Vater Isaak nach Mamre, das ist Hebron; Isaak stirbt, und Esau und Jakob begraben ihn."
      fr: "Il arrive chez son père Isaac à Mamré, qui est Hébron ; Isaac meurt, et Ésaü et Jacob l’ensevelissent."
      pl: "Przychodzi do swego ojca Izaaka w Mamre, czyli w Hebronie; Izaak umiera, a Ezaw i Jakub go chowają."
      it: "Giunge da suo padre Isacco a Mamre, cioè Ebron; Isacco muore, ed Esaù e Giacobbe lo seppelliscono."
      nl: "Hij komt bij zijn vader Isaak te Mamre, dat is Hebron; Isaak sterft, en Ezau en Jakob begraven hem."
      cs: "Přichází k otci Izákovi do Mamre, to jest do Hebronu; Izák umírá a Ezau s Jákobem ho pohřbívají."
      sv: "Han kommer till sin fader Isak i Mamre, det vill säga Hebron; Isak dör, och Esau och Jakob begraver honom."
      nb: "Han kommer til sin far Isak i Mamre, det er Hebron; Isak dør, og Esau og Jakob gravlegger ham."
      tl: "Pumaroon siya sa kaniyang amang si Isaac sa Mamre, na siyang Hebron; namatay si Isaac, at inilibing siya nina Esau at Jacob."
      da: "Han kommer til sin far Isak i Mamre, det er Hebron; Isak dør, og Esau og Jakob begraver ham."
  - place: a075d61 # Beersheba
    ref: Gen.46.1-Gen.46.4
    year: "1700 BC"
    note:
      en: 'At Beersheba God speaks to him: "Fear not to go down into Egypt."'
      ru: "В Вирсавии Бог говорит ему: «не бойся идти в Египет»."
      uk: "У Беер-Шеві Бог говорить до нього: «Не опасуйся спуститись у Египет»."
      es: "En Beerseba Dios le habla: «no temas de descender á Egipto»."
      pt: "Em Berseba, Deus lhe fala: “Não tenha medo de descer ao Egito.”"
      de: "In Beerscheba spricht Gott zu ihm: „fürchte dich nicht, nach Ägypten hinabzuziehen“."
      fr: "À Beer-Schéba, Dieu lui parle : « Ne crains point de descendre en Égypte. »"
      pl: "W Beer-Szebie Bóg przemawia do niego: „nie bój się zstąpić do Egiptu.”"
      it: "A Bersabea Dio gli parla: «non temere di scendere in Egitto»."
      nl: "Te Berseba spreekt God tot hem: “vrees niet van af te trekken naar Egypte.”"
      cs: "V Beer-šebě k němu mluví Bůh: „Neboj se sstoupiti do Egypta.“"
      sv: "I Beer Sheva talar Gud till honom: ”frukta icke för att draga ned till Egypten”."
      nb: "I Beer-Sjeba taler Gud til ham: «frykt ikke for å dra ned til Egypten»."
      tl: "Sa Beer-seba ay nagsalita sa kaniya ang Dios: “huwag kang matakot na bumaba sa Egipto.”"
      da: "I Beersheba taler Gud til ham: »frygt ikke for at drage ned til Ægypten«."
  - place: af301ca # Egypt
    ref: Gen.46.5-Gen.46.7
    year: "1700 BC"
    note:
      en: "Jacob and all his family come into Egypt."
      ru: "Иаков и весь род его приходят в Египет."
      uk: "Яків і вся його родина приходять до Єгипту."
      es: "Jacob y toda su familia entran en Egipto."
      pt: "Jacó e toda a sua família entram no Egito."
      de: "Jakob und seine ganze Familie kommen nach Ägypten."
      fr: "Jacob et toute sa famille entrent en Égypte."
      pl: "Jakub i cała jego rodzina przybywają do Egiptu."
      it: "Giacobbe e tutta la sua famiglia entrano in Egitto."
      nl: "Jakob en heel zijn gezin komen in Egypte."
      cs: "Jákob a celá jeho rodina přicházejí do Egypta."
      sv: "Jakob och hela hans familj kommer till Egypten."
      nb: "Jakob og hele hans familie kommer til Egypt."
      tl: "Pumasok sa Egipto si Jacob at ang buo niyang sambahayan."
      da: "Jakob og hele hans slægt kommer til Egypten."
