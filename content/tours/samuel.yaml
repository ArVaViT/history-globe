# Samuel and the ark, 1 Samuel 1-11 and 25, in the order of the text. The tour's year
# (1070 BC) is a conventional point for the map before Saul's kingship (c. 1050 BC);
# the chronology of the judges' last years is uncertain.
id: samuel
title:
  en: "Samuel and the ark"
  ru: "Самуил и ковчег"
  uk: "Самуїл і ковчег"
  es: "Samuel y el arca"
  pt: "Samuel e a arca"
  de: "Samuel und die Lade"
  fr: "Samuel et l’arche"
  pl: "Samuel i arka"
  it: "Samuele e l’arca"
  nl: "Samuël en de ark"
  cs: "Samuel a truhla"
  sv: "Samuel och arken"
  nb: "Samuel og arken"
  tl: "Si Samuel at ang kaban"
  da: "Samuel og arken"
  sr: "Самуило и ковчег"
year: "1070 BC"
people: ["Samuel@1Sa.1.20-Heb"]
approximate: true
stops:
  - place: a90f6e1 # Ramah
    ref: 1Sam.1.19-1Sam.1.20
    note:
      en: "At Ramah Hannah bears a son and names him Samuel: asked of the Lord."
      ru: "В Раме Анна рождает сына и нарекает ему имя Самуил: от Господа испросила его."
      uk: "У Рамі Анна народжує сина й дає йому ім’я Самуїл: випрошений у Господа."
      es: "En Ramá Ana da a luz un hijo y lo llama Samuel: pedido al Señor."
      pt: "Em Ramá, Ana dá à luz um filho e lhe dá o nome de Samuel: pedido ao Senhor."
      de: "In Rama gebiert Hanna einen Sohn und nennt ihn Samuel: vom Herrn erbeten."
      fr: "À Rama, Anne met au monde un fils et l’appelle Samuel : demandé à l’Éternel."
      pl: "W Ramie Anna rodzi syna i nazywa go Samuel: wyproszony od Pana."
      it: "A Rama Anna partorisce un figlio e lo chiama Samuele: chiesto al Signore."
      nl: "Te Rama baart Hanna een zoon en noemt hem Samuël: van de HEER verzocht."
      cs: "V Rámě rodí Chana syna a dává mu jméno Samuel: vyprošený od Hospodina."
      sv: "I Rama föder Hanna en son och ger honom namnet Samuel: utbedd av Herren."
      nb: "I Rama føder Hanna en sønn og kaller ham Samuel: utbedt av Herren."
      tl: "Sa Rama, nanganak si Ana ng isang lalaki at pinangalanan siyang Samuel: hiningi sa Panginoon."
      da: "I Rama føder Hanna en søn og kalder ham Samuel: bedt af Herren."
      sr: "У Рами Ана рађа сина и даје му име Самуило: измољен од Господа."
  - place: aa4680a # Shiloh
    ref: 1Sam.1.24-1Sam.3.21
    note:
      en: 'Brought to the house of the Lord at Shiloh, the boy answers: "Speak; for thy servant heareth."'
      ru: "Приведённый в дом Господень в Силоме, отрок отвечает: «говори, ибо слышит раб Твой»."
      uk: "Приведений до дому Господнього в Шіло, хлопець відповідає: «Глаголи, твій раб чує»."
      es: "Llevado a la casa del Señor en Silo, el niño responde: «Habla, que tu siervo oye»."
      pt: "Levado à casa do Senhor em Siló, o menino responde: “Fala, porque o teu servo ouve.”"
      de: "In das Haus des Herrn nach Silo gebracht, antwortet der Knabe: „Rede, denn dein Knecht hört.“"
      fr: "Amené à la maison de l’Éternel à Silo, l’enfant répond : « Parle, car ton serviteur écoute. »"
      pl: "Przyprowadzony do domu Pańskiego w Szilo, chłopiec odpowiada: „Mów Panie, bo sługa twój słucha.”"
      it: "Condotto alla casa del Signore a Silo, il ragazzo risponde: «Parla, poiché il tuo servo ascolta»."
      nl: "Naar het huis van de HEER te Silo gebracht, antwoordt de jongen: “Spreek, want Uw knecht hoort.”"
      cs: "Přivedený do domu Hospodinova v Šílu odpovídá chlapec: „Mluv, nebo slyší služebník tvůj.“"
      sv: "Förd till Herrens hus i Shilo svarar gossen: ”Tala, din tjänare hör.”"
      nb: "Ført til Herrens hus i Sjilo svarer gutten: «Tal, din tjener hører!»"
      tl: "Dinala sa bahay ng Panginoon sa Shiloh, sumagot ang bata: “Magsalita ka; sapagka't dinirinig ng iyong lingkod.”"
      da: "Bragt til Herrens hus i Silo svarer drengen: »Tal, thi din Tjener hører.«"
      sr: "Доведен у дом Господњи у Силу, дечак одговара: „Говори, чује слуга твој.“"
  - place: abfdefc # Ebenezer
    ref: 1Sam.4.1-1Sam.4.11
    note:
      en: "At Ebenezer the Philistines take the ark of God; Hophni and Phinehas die."
      ru: "У Авен-Езера Филистимляне берут ковчег Божий; Офни и Финеес умирают."
      uk: "В Авен-Езері філістимляни забирають ковчег Божий; Офні і Финеєс гинуть."
      es: "En Ebenezer los filisteos toman el arca de Dios; Ofni y Finees mueren."
      pt: "Em Ebenézer, os filisteus tomam a arca de Deus; Hofni e Finéias morrem."
      de: "Bei Eben-Eser nehmen die Philister die Lade Gottes; Hofni und Pinhas sterben."
      fr: "À Ében-Ézer, les Philistins prennent l’arche de Dieu ; Hophni et Phinées meurent."
      pl: "W Eben-Ezer Filistyni zabierają arkę Bożą; Chofni i Pinchas giną."
      it: "A Eben-Ezer i Filistei prendono l’arca di Dio; Ofni e Pincas muoiono."
      nl: "Te Eben-Haëzer nemen de Filistijnen de ark van God; Chofni en Pinechas sterven."
      cs: "U Eben-ezeru berou Pelištejci truhlu Boží; Chofni a Pinchas umírají."
      sv: "Vid Even-Haeser tar filistéerna Guds ark; Hofni och Pinechas dör."
      nb: "Ved Eben-Eser tar filisterne Guds ark; Hofni og Pinhas dør."
      tl: "Sa Ebenezer, kinuha ng mga Filisteo ang kaban ng Diyos; namatay sina Ophni at Phinees."
      da: "Ved Eben-Ezer tager filistrene Guds ark; Hofni og Pinehas dør."
      sr: "Код Евен-Езера Филистеји узимају ковчег Божји; Офније и Финес гину."
  - place: a30c937 # Ashdod
    ref: 1Sam.5.1-1Sam.5.7
    note:
      en: "In the temple of Dagon at Ashdod the idol falls on its face before the ark of the Lord."
      ru: "В храме Дагона в Азоте идол падает лицом к земле пред ковчегом Господним."
      uk: "У храмі Дагона в Ашдоді ідол падає обличчям перед ковчегом Господнім."
      es: "En el templo de Dagón, en Asdod, el ídolo cae de bruces ante el arca del Señor."
      pt: "No templo de Dagom, em Asdode, o ídolo cai de rosto diante da arca do Senhor."
      de: "Im Tempel Dagons in Aschdod fällt das Götzenbild vor der Lade des Herrn auf sein Angesicht."
      fr: "Dans le temple de Dagon à Asdod, l’idole tombe face contre terre devant l’arche de l’Éternel."
      pl: "W świątyni Dagona w Aszdod bożek pada twarzą na ziemię przed arką Pańską."
      it: "Nel tempio di Dagon ad Asdod l’idolo cade con la faccia a terra davanti all’arca del Signore."
      nl: "In de tempel van Dagon te Asdod valt het beeld op zijn aangezicht neer voor de ark van de HEER."
      cs: "V chrámě Dágonově v Ašdodu padá modla před truhlou Hospodinovou na tvář."
      sv: "I Dagons tempel i Ashdod faller avguden på sitt ansikte inför Herrens ark."
      nb: "I Dagons tempel i Asjdod faller avgudsbildet på sitt ansikt for Herrens ark."
      tl: "Sa bahay ni Dagon sa Asdod, ang diyus-diyosan ay nabuwal na nakadapa sa harap ng kaban ng Panginoon."
      da: "I Dagons tempel i Asdod falder afgudsbilledet på sit ansigt for Herrens ark."
      sr: "У храму Дагоновом у Азоту идол пада ничице пред ковчегом Господњим."
  - place: a3b5b53 # Beth-shemesh
    ref: 1Sam.6.12-1Sam.6.20
    note:
      en: "Two cows carry the ark straight along the road to Beth-shemesh."
      ru: "Две коровы везут ковчег прямо по дороге к Вефсамису."
      uk: "Дві корови несуть ковчег прямо дорогою до Бет-Шемеша."
      es: "Dos vacas llevan el arca derecho por el camino a Bet-semes."
      pt: "Duas vacas levam a arca em linha reta pelo caminho até Bete-Semes."
      de: "Zwei Kühe bringen die Lade geradewegs auf der Straße nach Bet-Schemesch."
      fr: "Deux vaches portent l’arche tout droit sur la route de Beth-Schémesch."
      pl: "Dwie krowy niosą arkę prosto drogą do Bet-Szemesz."
      it: "Due vacche portano l’arca dritte lungo la strada verso Bet-Semes."
      nl: "Twee koeien brengen de ark rechtstreeks over de weg naar Beth-Semes."
      cs: "Dvě krávy nesou truhlu přímo po cestě do Bét-šemeše."
      sv: "Två kor drar arken rakt fram längs vägen till Bet-Shemesh."
      nb: "To kyr drar arken rett frem langs veien til Bet-Sjemesj."
      tl: "Dalawang baka ang nagdala ng kaban nang tuwid sa daan patungong Beth-semes."
      da: "To køer fører arken ret ad vejen til Bet-Sjemesj."
      sr: "Две краве носе ковчег право путем у Вет-Семес."
  - place: a9bba61 # Kiriath-jearim
    ref: 1Sam.7.1-1Sam.7.2
    note:
      en: "The men of Kiriath-jearim bring the ark into the house of Abinadab; twenty years pass, and all Israel laments after the Lord."
      ru: "Жители Кириаф-Иарима вносят ковчег в дом Аминадава; проходит лет двадцать, и весь дом Израилев обращается к Господу."
      uk: "Мужі Кіріят-Єарима вносять ковчег до дому Авінадава; минає двадцять років, і весь Ізраїль тужить за Господом."
      es: "Los hombres de Quiriat-jearim llevan el arca a la casa de Abinadab; pasan veinte años, y todo Israel lamenta en pos del Señor."
      pt: "Os homens de Quiriate-Jearim levam a arca para a casa de Abinadabe; passam-se vinte anos, e todo o Israel se lamenta, buscando o Senhor."
      de: "Die Männer von Kirjat-Jearim bringen die Lade in das Haus Abinadabs; zwanzig Jahre vergehen, und ganz Israel klagt dem Herrn nach."
      fr: "Les hommes de Kirjath-Jearim amènent l’arche dans la maison d’Abinadab ; vingt ans passent, et tout Israël soupire après l’Éternel."
      pl: "Mieszkańcy Kiriat-Jearim wnoszą arkę do domu Abinadaba; mija dwadzieścia lat, a cały Izrael wzdycha do Pana."
      it: "Gli uomini di Kiriat-Iearim portano l’arca nella casa di Abinadab; passano vent’anni, e tutto Israele sospira dietro al Signore."
      nl: "De mannen van Kirjat-Jearim brengen de ark in het huis van Abinadab; twintig jaar gaan voorbij, en heel Israël klaagt naar de HEER."
      cs: "Muži z Kirjat-jearímu přenášejí truhlu do domu Abinadabova; uplyne dvacet let a celý Izrael lká za Hospodinem."
      sv: "Männen i Kirjat-Jearim för arken in i Avinadavs hus; tjugo år går, och hela Israel klagar efter Herren."
      nb: "Mennene fra Kirjat-Jearim fører arken inn i Abinadabs hus; tyve år går, og hele Israel klager etter Herren."
      tl: "Dinala ng mga tao ng Kiriath-jearim ang kaban sa bahay ni Abinadab; lumipas ang dalawampung taon, at ang buong Israel ay nanangis sa Panginoon."
      da: "Mændene fra Kirjat-Jearim bringer arken ind i Abinadabs hus; tyve år går, og hele Israel sukker efter Herren."
      sr: "Људи из Киријат-Јарима уносе ковчег у дом Авинадавов; пролази двадесет година, и сав Израиљ тужи за Господом."
  - place: a736f6c # Mizpah
    ref: 1Sam.7.5-1Sam.7.12
    note:
      en: 'At Mizpah Samuel prays and Israel prevails; between Mizpah and Shen Samuel sets up a stone: "Hitherto hath the LORD helped us."'
      ru: "В Массифе Самуил молится, и Израиль побеждает; между Массифою и Сеном Самуил ставит камень: «до сего места помог нам Господь»."
      uk: "У Міцпі Самуїл молиться, і Ізраїль перемагає; між Міцпою і Сеном Самуїл ставить камінь: «Ось поки Господь дав нам підмогу!»"
      es: "En Mizpa Samuel ora e Israel prevalece; entre Mizpa y Sen Samuel levanta una piedra: «Hasta aquí nos ayudó Jehová»."
      pt: "Em Mispá, Samuel ora e Israel prevalece; entre Mispá e Sem, Samuel levanta uma pedra: “Até aqui o SENHOR nos ajudou.”"
      de: "In Mizpa betet Samuel, und Israel siegt; zwischen Mizpa und Schen richtet Samuel einen Stein auf: „Bis hierher hat uns der HERR geholfen.“"
      fr: "À Mitspa, Samuel prie et Israël l’emporte ; entre Mitspa et Schen, Samuel dresse une pierre : « Jusqu’ici l’Éternel nous a secourus. »"
      pl: "W Mispie Samuel się modli i Izrael zwycięża; między Mispą a Szen Samuel stawia kamień: „Aż póty pomagał nam Pan.”"
      it: "A Mizpa Samuele prega e Israele prevale; tra Mizpa e Sen Samuele erige una pietra: «Fin qui l’Eterno ci ha soccorsi»."
      nl: "Te Mizpa bidt Samuël en Israël behaalt de overwinning; tussen Mizpa en Sen richt Samuël een steen op: “Tot hiertoe heeft de HEERE ons geholpen.”"
      cs: "V Micpě se Samuel modlí a Izrael vítězí; mezi Micpou a Šenem staví Samuel kámen: „Až potud pomáhal nám Hospodin.“"
      sv: "I Mispa ber Samuel och Israel segrar; mellan Mispa och Shen reser Samuel en sten: ”Allt härintill har HERREN hjälpt oss.”"
      nb: "I Mispa ber Samuel og Israel seirer; mellom Mispa og Sjen reiser Samuel en sten: «Hittil har Herren hjulpet oss.»"
      tl: "Sa Mizpa ay nanalangin si Samuel at nanaig ang Israel; sa pagitan ng Mizpa at Sen ay naglagay si Samuel ng isang bato: “Hanggang dito'y tinulungan tayo ng Panginoon.”"
      da: "I Mispa beder Samuel, og Israel sejrer; mellem Mispa og Sjen rejser Samuel en sten: »Hidindtil har Herren hjulpet os.«"
      sr: "У Масфи Самуило се моли и Израиљ побеђује; између Масфе и Сена Самуило подиже камен: „Довде нам Господ поможе.“"
  - place: ab94aea # Gilgal
    ref: 1Sam.11.14-1Sam.11.15
    year: "1050 BC"
    note:
      en: "At Gilgal the people make Saul king before the Lord."
      ru: "В Галгале народ поставляет Саула царём пред Господом."
      uk: "У Гілгалі народ ставить Саула царем перед Господом."
      es: "En Gilgal el pueblo hace rey a Saúl delante del Señor."
      pt: "Em Gilgal o povo faz Saul rei perante o Senhor."
      de: "In Gilgal machen die Leute Saul vor dem Herrn zum König."
      fr: "À Guilgal, le peuple établit Saül roi devant l’Éternel."
      pl: "W Gilgal lud ustanawia Saula królem przed Panem."
      it: "A Gàlgala il popolo fa re Saul davanti al Signore."
      nl: "Te Gilgal maakt het volk Saul tot koning voor het aangezicht van de HEER."
      cs: "V Gilgalu ustanovuje lid Saula králem před Hospodinem."
      sv: "I Gilgal gör folket Saul till kung inför Herren."
      nb: "I Gilgal gjør folket Saul til konge for Herrens åsyn."
      tl: "Sa Gilgal, ginawang hari ng bayan si Saul sa harap ng Panginoon."
      da: "I Gilgal gør folket Saul til konge for Herrens ansigt."
      sr: "У Галгалу народ чини Саула царем пред Господом."
  - place: a90f6e1 # Ramah
    ref: 1Sam.25.1
    year: "1015 BC"
    note:
      en: "Samuel dies, and all Israel mourns him and buries him at his house in Ramah."
      ru: "Самуил умирает; весь Израиль плачет о нём и погребает его в доме его, в Раме."
      uk: "Самуїл помирає, і весь Ізраїль оплакує його й ховає його в його домі в Рамі."
      es: "Samuel muere, y todo Israel hace duelo por él y lo sepulta en su casa de Ramá."
      pt: "Samuel morre, e todo o Israel o pranteia e o sepulta em sua casa, em Ramá."
      de: "Samuel stirbt, und ganz Israel hält die Totenklage um ihn und begräbt ihn in seinem Haus in Rama."
      fr: "Samuel meurt, et tout Israël le pleure et l’enterre dans sa demeure à Rama."
      pl: "Samuel umiera, a cały Izrael go opłakuje i chowa w jego domu w Ramie."
      it: "Samuele muore, e tutto Israele lo piange e lo seppellisce nella sua casa a Rama."
      nl: "Samuël sterft, en heel Israël rouwt om hem en begraaft hem in zijn huis te Rama."
      cs: "Samuel umírá, celý Izrael ho oplakává a pochovává ho v jeho domě v Rámě."
      sv: "Samuel dör, och hela Israel sörjer honom och begraver honom i hans hus i Rama."
      nb: "Samuel dør, og hele Israel sørger over ham og gravlegger ham ved hans hus i Rama."
      tl: "Namatay si Samuel, at ang buong Israel ay nagdalamhati sa kaniya at inilibing siya sa kaniyang bahay sa Rama."
      da: "Samuel dør, og hele Israel sørger over ham og begraver ham i hans hus i Rama."
      sr: "Самуило умире, и сав Израиљ га оплакује и сахрањује га у његовој кући у Рами."
