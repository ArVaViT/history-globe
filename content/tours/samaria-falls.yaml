stops:
  - place: a6f33c5 # Hazor
    ref: 2Kgs.15.29
    note:
      en: "In the days of Pekah, Tiglath-pileser king of Assyria takes Ijon, Abel-beth-maachah, Janoah, Kedesh, Hazor, Gilead and Galilee, all the land of Naphtali, and carries the people captive to Assyria."
      ru: "Во дни Факея Феглаффелласар, царь Ассирийский, берёт Ион, Авел-Беф-Мааху, Ианох, Кедес, Асор, Галаад и Галилею, всю землю Неффалимову, и переселяет жителей в Ассирию."
      uk: "За днів Факея Тіглатпаласар, цар Ассирії, здобуває Іййон, Авел-Бет-Мааху, Яноах, Кедес, Гацор, Гілеад і Галілею, всю землю Нефталимову, і виводить народ у полон до Ассирії."
      es: "En los días de Peka, Tiglat-pileser, rey de Asiria, toma Ijón, Abel-bet-maaca, Janoa, Cedes, Hazor, Galaad y Galilea, toda la tierra de Neftalí, y lleva cautivo al pueblo a Asiria."
      pt: "Nos dias de Peca, Tiglate-Pileser, rei da Assíria, toma Ijom, Abel-Bete-Maaca, Janoa, Quedes, Hazor, Gileade e a Galileia, toda a terra de Naftali, e leva o povo cativo para a Assíria."
      de: "In den Tagen Pekachs nimmt Tiglat-Pileser, der König von Assyrien, Ijon, Abel-Bet-Maacha, Janoach, Kedesch, Hazor, Gilead und Galiläa, das ganze Land Naftali, ein und führt das Volk gefangen nach Assyrien."
      fr: "Du temps de Péka, Tiglath-Piléser, roi d’Assyrie, prend Ijjon, Abel-Beth-Maaca, Janoach, Kédesch, Hatsor, Galaad et la Galilée, tout le pays de Nephthali, et emmène le peuple captif en Assyrie."
      pl: "Za dni Pekacha Tiglat-Pileser, król Asyrii, zdobywa Ijjon, Abel-Bet-Maaka, Janoach, Kedesz, Chasor, Gilead i Galileę, całą ziemię Neftalego, i uprowadza lud w niewolę do Asyrii."
      it: "Ai giorni di Pekach, Tiglat-Pilèser, re d’Assiria, prende Ion, Abel-Bet-Maacà, Ianoach, Kedes, Asor, Galaad e la Galilea, tutto il paese di Neftali, e deporta il popolo in Assiria."
      nl: "In de dagen van Pekach neemt Tiglat-Pileser, de koning van Assyrië, Ijon, Abel-Beth-Maächa, Janoach, Kedes, Hazor, Gilead en Galilea in, het hele land Naftali, en voert het volk gevankelijk weg naar Assyrië."
      cs: "Za dnů Pekacha dobývá Tiglatpilesar, král asyrský, Ijón, Ábel-bét-maaku, Janoach, Kedeš, Chacor, Gilead a Galileu, celou zemi Neftalí, a odvádí lid do zajetí do Asýrie."
      sv: "På Pekachs tid intar Tiglat-Pileser, kung av Assyrien, Ijon, Abel-Bet-Maaka, Janoach, Kedesh, Hasor, Gilead och Galileen, hela Naftalis land, och för folket som fångar till Assyrien."
      nb: "I Pekahs dager inntar Tiglat-Pileser, kongen i Assyria, Ijon, Abel-Bet-Maaka, Janoah, Kedesj, Hasor, Gilead og Galilea, hele Naftalis land, og fører folket bort som fanger til Assyria."
      tl: "Nang mga kaarawan ni Peka, kinuha ni Tiglath-pileser na hari ng Asiria ang Ihion, Abel-bethmaacha, Janoa, Cedes, Hasor, Gilead at Galilea, ang buong lupain ng Nephtali, at dinalang bihag ang mga tao sa Asiria."
      da: "I Pekas dage indtager Tiglat-Pileser, Assyriens konge, Ijjon, Abel-Bet-Maaka, Janoa, Kedesj, Hazor, Gilead og Galilæa, hele Naftalis land, og fører folket bort som fanger til Assyrien."
      sr: "У време Фекаја Теглат-Феласар, цар асирски, осваја Ијон, Авел-Вет-Маху, Јанох, Кедес, Асор, Галад и Галилеју, сву земљу Нефталимову, и одводи народ у ропство у Асирију."
      hu: "Pekah napjaiban Tiglat-Pileszer, Asszíria királya elfoglalja Ijjónt, Ábel-Bét-Maakát, Jánóahot, Kedest, Hácórt, Gileádot és Galileát, Naftáli egész földjét, és a népet fogságban Asszíriába viszi."
      fi: "Pekahin päivinä Assyrian kuningas Tiglat-Pileser valtaa Ijonin, Abel-Bet-Maakan, Janoahin, Kedeksen, Hasorin, Gileadin ja Galilean, koko Naftalin maan, ja vie kansan vankeuteen Assyriaan."
      vi: "Trong đời Phê-ca, Tiếc-la-Phi-lê-se, vua A-si-ri, chiếm lấy Y-giôn, A-bên-Bết-Ma-ca, Gia-nô-ác, Kê-đe, Hát-so, Ga-la-át và Ga-li-lê, cả địa phận Nép-ta-li, và đem dân sự sang A-si-ri làm phu tù."
      ro: "În zilele lui Pecah, Tiglat-Pileser, regele Asiriei, ia Ionul, Abel-Bet-Maaca, Ianoahul, Chedeșul, Hațorul, Galaadul și Galileea, tot ținutul lui Neftali, și duce poporul în robie în Asiria."
      bg: "В дните на Факей Теглатфеласар, царят на Асирия, превзема Йон, Авел-Бет-Мааха, Янох, Кедес, Хацор, Галаад и Галилея, цялата земя на Нефталим, и отвежда народа в плен в Асирия."
  - place: a15257a # Jerusalem
    ref: 2Kgs.16.5-2Kgs.16.8
    note:
      en: 'Rezin of Syria and Pekah of Israel besiege Ahaz in Jerusalem; Ahaz sends the silver and gold of the Temple and of the king''s house to the king of Assyria: "I am thy servant and thy son."'
      ru: "Рецин Сирийский и Факей Израильский осаждают Ахаза в Иерусалиме; Ахаз посылает царю Ассирийскому серебро и золото из дома Господня и из сокровищниц царских: «раб твой и сын твой я»."
      uk: "Рецін Сирійський і Факей Ізраїльський облягають Ахаза в Єрусалимі; Ахаз посилає срібло й золото з храму та з царського дому цареві Ассирії: «Я раб твій і син твій»."
      es: "Rezín de Siria y Peka de Israel sitian a Acaz en Jerusalén; Acaz envía la plata y el oro del Templo y de la casa del rey al rey de Asiria: «Yo soy tu siervo y tu hijo»."
      pt: "Rezim, da Síria, e Peca, de Israel, cercam Acaz em Jerusalém; Acaz envia ao rei da Assíria a prata e o ouro do Templo e da casa do rei: “Eu sou seu servo e seu filho.”"
      de: "Rezin von Syrien und Pekach von Israel belagern Ahas in Jerusalem; Ahas schickt das Silber und Gold des Tempels und des Königshauses dem König von Assyrien: „Ich bin dein Knecht und dein Sohn.“"
      fr: "Retsin de Syrie et Péka d’Israël assiègent Achaz dans Jérusalem ; Achaz envoie au roi d’Assyrie l’argent et l’or du temple et de la maison du roi : « Je suis ton serviteur et ton fils. »"
      pl: "Resin z Syrii i Pekach z Izraela oblegają Achaza w Jerozolimie; Achaz posyła srebro i złoto ze świątyni i z domu królewskiego królowi Asyrii: „Sługa twój i syn twój jestem.”"
      it: "Resin di Siria e Pekach d’Israele assediano Acaz a Gerusalemme; Acaz manda al re d’Assiria l’argento e l’oro del Tempio e della casa del re: «Io son tuo servo e tuo figliuolo»."
      nl: "Rezin van Syrië en Pekach van Israël belegeren Achaz in Jeruzalem; Achaz stuurt het zilver en goud van de tempel en van het huis van de koning naar de koning van Assyrië: “Ik ben uw knecht en uw zoon.”"
      cs: "Resín Syrský a Pekach Izraelský oblehají Achaza v Jeruzalémě; Achaz posílá králi asyrskému stříbro a zlato z chrámu i z domu královského: „Služebník tvůj a syn tvůj jsem.“"
      sv: "Resin av Syrien och Pekach av Israel belägrar Achas i Jerusalem; Achas sänder silvret och guldet från templet och kungens hus till Assyriens kung: ”Jag är din tjänare och din son.”"
      nb: "Resin av Syria og Pekah av Israel kringsetter Ahas i Jerusalem; Ahas sender sølvet og gullet fra templet og kongens hus til kongen i Assyria: «Jeg er din tjener og din sønn»."
      tl: "Kinubkob nina Rezin ng Siria at Peka ng Israel si Achaz sa Jerusalem; ipinadala ni Achaz ang pilak at ginto ng Templo at ng bahay ng hari sa hari ng Asiria: “Ako ang iyong lingkod at ang iyong anak.”"
      da: "Retsin af Syrien og Peka af Israel belejrer Akaz i Jerusalem; Akaz sender sølvet og guldet fra templet og kongens hus til Assyriens konge: »Jeg er din Tjener og din Søn«."
      sr: "Ресин сирски и Фекај израиљски опседају Ахаза у Јерусалиму; Ахаз шаље сребро и злато из храма и из дома царског цару асирском: „Слуга сам твој.“"
      hu: "Recin, Szíria királya és Pekah, Izráel királya ostrom alá veszik Áházt Jeruzsálemben; Áház a templom és a királyi ház ezüstjét és aranyát elküldi Asszíria királyának: „Te szolgád és a te fiad vagyok”."
      fi: "Syyrian Resin ja Israelin Pekah piirittävät Ahasta Jerusalemissa; Ahas lähettää temppelin ja kuninkaan talon hopean ja kullan Assyrian kuninkaalle: ”Minä olen sinun palvelijasi ja sinun poikasi.”"
      vi: "Rê-xin của Sy-ri và Phê-ca của Y-sơ-ra-ên vây A-cha tại Giê-ru-sa-lem; A-cha gởi bạc và vàng của đền thờ và của cung vua cho vua A-si-ri: “Tôi là kẻ tôi tớ vua, là con trai vua”."
      ro: "Rețin al Siriei și Pecah al lui Israel îl asediază pe Ahaz în Ierusalim; Ahaz îi trimite regelui Asiriei argintul și aurul Templului și ale casei regelui: „robul tău și fiul tău sunt eu”."
      bg: "Рецин Сирийски и Факей Израилски обсаждат Ахаз в Йерусалим; Ахаз изпраща среброто и златото от храма и от царския дом на асирийския цар: „Аз съм раб твой и син твой“."
  - place: a69c1d4 # Damascus
    ref: 2Kgs.16.9-2Kgs.16.11
    note:
      en: "The king of Assyria takes Damascus, carries its people to Kir and slays Rezin; Ahaz meets him there and sends home the pattern of its altar."
      ru: "Царь Ассирийский берёт Дамаск, переселяет его жителей в Кир и умерщвляет Рецина; Ахаз встречает его там и посылает домой чертёж тамошнего жертвенника."
      uk: "Цар Ассирії здобуває Дамаск, виводить його народ до Кіру й убиває Реціна; Ахаз зустрічає його там і посилає додому зразок його жертовника."
      es: "El rey de Asiria toma Damasco, lleva a su pueblo a Kir y mata a Rezín; Acaz sale a su encuentro allí y envía a casa el modelo de su altar."
      pt: "O rei da Assíria toma Damasco, leva o seu povo para Quir e mata Rezim; Acaz vai ao seu encontro ali e envia para casa o modelo do altar de lá."
      de: "Der König von Assyrien nimmt Damaskus ein, führt sein Volk nach Kir und tötet Rezin; Ahas trifft ihn dort und schickt das Vorbild seines Altars heim."
      fr: "Le roi d’Assyrie prend Damas, emmène son peuple à Kir et tue Retsin ; Achaz va à sa rencontre et envoie chez lui le modèle de son autel."
      pl: "Król Asyrii zdobywa Damaszek, uprowadza jego lud do Kir i zabija Resina; Achaz spotyka go tam i przesyła do domu wzór tamtejszego ołtarza."
      it: "Il re d’Assiria prende Damasco, ne deporta il popolo a Kir e uccide Resin; Acaz lo incontra là e manda a casa il modello del suo altare."
      nl: "De koning van Assyrië neemt Damascus in, voert het volk naar Kir en doodt Rezin; Achaz ontmoet hem daar en stuurt het model van zijn altaar naar huis."
      cs: "Král asyrský dobývá Damašek, odvádí jeho lid do Kíru a zabíjí Resína; Achaz se s ním tam setkává a posílá domů vzor tamního oltáře."
      sv: "Assyriens kung intar Damaskus, för dess folk till Kir och dräper Resin; Achas möter honom där och skickar hem mönstret till dess altare."
      nb: "Kongen i Assyria inntar Damaskus, fører folket til Kir og dreper Resin; Ahas møter ham der og sender hjem mønsteret av dets alter."
      tl: "Kinuha ng hari ng Asiria ang Damasco, dinala ang mga tao nito sa Cir at pinatay si Rezin; nakipagkita si Achaz sa kaniya roon at ipinadala sa tahanan ang huwaran ng dambana nito."
      da: "Assyriens konge indtager Damaskus, fører dets folk til Kir og dræber Retsin; Akaz møder ham der og sender et billede af dets alter hjem."
      sr: "Цар асирски осваја Дамаск, одводи његов народ у Кир и убија Ресина; Ахаз га тамо среће и шаље кући узор његовог жртвеника."
      hu: "Asszíria királya elfoglalja Damaszkuszt, népét Kirbe viszi, Recint pedig megöli; Áház ott találkozik vele, és hazaküldi oltárának mintáját."
      fi: "Assyrian kuningas valtaa Damaskoksen, vie sen kansan Kiriin ja surmaa Resinin; Ahas tapaa hänet siellä ja lähettää kotiin sen alttarin mallin."
      vi: "Vua A-si-ri chiếm Đa-mách, đem dân cư nó sang Ki-rơ và giết Rê-xin; A-cha đến gặp vua tại đó và gởi về kiểu mẫu bàn thờ của nó."
      ro: "Regele Asiriei ia Damascul, îi duce pe locuitori la Chir și îl ucide pe Rețin; Ahaz se întâlnește cu el acolo și trimite acasă modelul altarului de acolo."
      bg: "Асирийският цар превзема Дамаск, отвежда жителите му в Кир и убива Рецин; Ахаз го среща там и изпраща у дома образеца на тамошния олтар."
  - place: a041bb3 # Samaria
    ref: 2Kgs.17.3-2Kgs.17.5
    year: "725 BC"
    note:
      en: "Hoshea withholds tribute and sends to So king of Egypt; Shalmaneser king of Assyria shuts him up in prison and besieges Samaria three years."
      ru: "Осия перестаёт платить дань и посылает к Сигору, царю Египетскому; Салманассар, царь Ассирийский, заключает его в темницу и три года осаждает Самарию."
      uk: "Осія затримує данину й посилає до Со, царя Єгипту; Салманассар, цар Ассирії, замикає його у в’язниці й облягає Самарію три роки."
      es: "Oseas retiene el tributo y envía mensajeros a Sua, rey de Egipto; Salmanasar, rey de Asiria, lo encierra en prisión y sitia Samaria durante tres años."
      pt: "Oseias retém o tributo e envia mensageiros a Sô, rei do Egito; Salmaneser, rei da Assíria, o prende e cerca Samaria por três anos."
      de: "Hosea hält den Tribut zurück und sendet zu So, dem König von Ägypten; Salmanassar, der König von Assyrien, setzt ihn im Gefängnis fest und belagert Samaria drei Jahre lang."
      fr: "Osée retient le tribut et envoie vers So, roi d’Égypte ; Salmanasar, roi d’Assyrie, le fait enfermer en prison et assiège Samarie pendant trois ans."
      pl: "Ozeasz wstrzymuje daninę i wysyła posłów do So, króla Egiptu; Salmanasar, król Asyrii, zamyka go w więzieniu i oblega Samarię przez trzy lata."
      it: "Osea rifiuta il tributo e manda messaggeri a So, re d’Egitto; Salmanàssar, re d’Assiria, lo rinchiude in prigione e assedia Samaria per tre anni."
      nl: "Hosea houdt de schatting achter en zendt naar So, de koning van Egypte; Salmaneser, de koning van Assyrië, sluit hem op in de gevangenis en belegert Samaria drie jaar."
      cs: "Hóšea zadržuje plat a posílá k Sevému, králi egyptskému; Salmanasar, král asyrský, ho dává uvěznit a obléhá Samaří tři roky."
      sv: "Hosea håller inne tributen och sänder bud till So, Egyptens kung; Salmanassar, Assyriens kung, spärrar in honom i fängelse och belägrar Samaria i tre år."
      nb: "Hosea holder tilbake skatten og sender bud til So, kongen i Egypt; Salmanassar, kongen i Assyria, setter ham i fengsel og kringsetter Samaria i tre år."
      tl: "Pinigil ni Oseas ang tributo at nagsugo kay So na hari ng Egipto; ikinulong siya ni Salmanasar na hari ng Asiria sa bilangguan at kinubkob ang Samaria nang tatlong taon."
      da: "Hosjea tilbageholder tributten og sender bud til So, Egyptens konge; Salmanassar, Assyriens konge, spærrer ham inde i fængsel og belejrer Samaria i tre år."
      sr: "Осија ускраћује данак и шаље Соју, цару египатском; Салманасар, цар асирски, затвара га у тамницу и три године опседа Самарију."
      hu: "Hósea megtagadja az adót, és követet küld Szóhoz, Egyiptom királyához; Salmanasszár, Asszíria királya börtönbe zárja, és három évig ostromolja Szamáriát."
      fi: "Hosea pidättää veron ja lähettää sanan Egyptin kuninkaalle Soolle; Assyrian kuningas Salmanassar sulkee hänet vankilaan ja piirittää Samariaa kolme vuotta."
      vi: "Ô-sê không nộp thuế và sai sứ đến Sô, vua Ê-díp-tô; Sanh-ma-na-sa, vua A-si-ri, bắt người xiềng lại và hạ ngục, rồi vây Sa-ma-ri ba năm."
      ro: "Osea nu mai plătește tributul și trimite soli la So, regele Egiptului; Salmanasar, regele Asiriei, îl închide în temniță și asediază Samaria trei ani."
      bg: "Осия спира данъка и изпраща пратеници при Сигор, египетския цар; Салманасар, царят на Асирия, го затваря в тъмница и обсажда Самария три години."
  - place: abf176f # Halah
    ref: 2Kgs.17.6
    year: "722 BC"
    note:
      en: "In Hoshea's ninth year Samaria is taken, and Israel is carried away into Assyria and placed in Halah and in Habor by the river of Gozan, and in the cities of the Medes."
      ru: "В девятый год Осии Самария взята, и Израильтян переселяют в Ассирию и поселяют в Халахе и в Хаворе, при реке Гозан, и в городах Мидийских."
      uk: "На дев’ятий рік Осії Самарію здобувають, і Ізраїль виводять до Ассирії й поселяють у Халаху та в Хаворі над рікою Гозан і в містах мідян."
      es: "En el año noveno de Oseas Samaria es tomada, e Israel es llevado a Asiria y establecido en Halah y en Habor, junto al río Gozán, y en las ciudades de los medos."
      pt: "No nono ano de Oseias, Samaria é tomada, e Israel é levado cativo para a Assíria e colocado em Halá, junto a Habor, o rio de Gozã, e nas cidades dos medos."
      de: "Im neunten Jahr Hoseas wird Samaria eingenommen, und Israel wird nach Assyrien weggeführt und in Halach und am Habor, dem Fluss von Gosan, und in den Städten der Meder angesiedelt."
      fr: "La neuvième année d’Osée, Samarie est prise, et Israël est emmené captif en Assyrie et établi à Chalach, sur le Chabor, fleuve de Gozan, et dans les villes des Mèdes."
      pl: "W dziewiątym roku Ozeasza Samaria zostaje zdobyta, a Izrael uprowadzony do Asyrii i osiedlony w Chalach i w Chabur nad rzeką Gozan oraz w miastach Medów."
      it: "Nel nono anno di Osea Samaria è presa, e Israele è deportato in Assiria e collocato a Chelach e a Cabor, presso il fiume Gozan, e nelle città dei Medi."
      nl: "In het negende jaar van Hosea wordt Samaria ingenomen, en Israël wordt weggevoerd naar Assyrië en gevestigd in Chalach en aan de Chabor, de rivier van Gozan, en in de steden van de Meden."
      cs: "V devátém roce Hóšeově je Samaří dobyto a Izrael odveden do Asýrie a usazen v Chalachu a v Chabóru u řeky Gózan a v městech Médských."
      sv: "I Hoseas nionde år intas Samaria, och Israel förs bort till Assyrien och bosätts i Halach och i Habor vid Gosans flod och i Mediens städer."
      nb: "I Hoseas niende år blir Samaria inntatt, og Israel blir bortført til Assyria og plassert i Halah og i Habor ved Gosan-elven og i medernes byer."
      tl: "Sa ikasiyam na taon ni Oseas ay nakuha ang Samaria, at dinala ang Israel sa Asiria at inilagay sa Hala at sa Habor sa tabi ng ilog Gozan, at sa mga lungsod ng mga Medo."
      da: "I Hosjeas niende år indtages Samaria, og Israel føres bort til Assyrien og anbringes i Halah og i Habor ved floden Gozan og i medernes byer."
      sr: "Девете године Осијине Самарија бива освојена, а Израиљ одведен у Асирију и насељен у Хали и у Хавору на води Гозану и у градовима мидским."
      hu: "Hósea kilencedik évében Szamáriát elfoglalják, Izráelt Asszíriába hurcolják, és Halahban, Hábórban, a Gózán folyó mellett és a médek városaiban telepítik le."
      fi: "Hosean yhdeksäntenä vuonna Samaria vallataan, ja Israel viedään Assyriaan ja sijoitetaan Halahiin ja Haboriin, Gosanin joen varrelle, sekä meedialaisten kaupunkeihin."
      vi: "Vào năm thứ chín đời Ô-sê, Sa-ma-ri bị chiếm, và Y-sơ-ra-ên bị đem sang A-si-ri, lập ở tại Cha-la và trên bờ Cha-bo, sông của Gô-xan, cùng trong các thành nước Mê-đi."
      ro: "În al nouălea an al lui Osea, Samaria este cucerită, iar Israel este dus în Asiria și așezat în Halah și pe Habor, râul Gozanului, și în cetățile mezilor."
      bg: "В деветата година на Осия Самария е превзета, а Израил е отведен в Асирия и заселен в Халах и в Хавор при реката на Гозан, и в мидийските градове."
