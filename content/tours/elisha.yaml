# Elisha, 2 Kings 2 - 8, in the order of the text, from where the Elijah tour ends. The
# tour's year (850 BC) falls in the reign of Jehoram of Israel (c. 852-841 BC); the text
# sets 2 Kgs 3:1-8:15 in his reign, though chapters 4-7 do not name the king. A point for
# the map rather than a date.
id: elisha
title:
  en: "Elisha the prophet"
  ru: "Пророк Елисей"
  uk: "Пророк Єлисей"
  es: "El profeta Eliseo"
  pt: "Eliseu, o profeta"
  de: "Der Prophet Elisa"
  fr: "Élisée le prophète"
  pl: "Prorok Elizeusz"
  it: "Il profeta Eliseo"
  nl: "De profeet Elisa"
  cs: "Prorok Elíša"
  sv: "Profeten Elisha"
year: "850 BC"
people: ["Elisha@1Ki.19.16-Luk"]
approximate: true
stops:
  - place: a231f80 # Jericho
    ref: 2Kgs.2.15-2Kgs.2.22
    note:
      en: "At Jericho the sons of the prophets see that the spirit of Elijah rests on Elisha; he throws salt into the spring and heals its water."
      ru: "В Иерихоне сыны пророков видят, что дух Илии почиет на Елисее; он бросает соль в источник, и вода становится здоровою."
      uk: "В Єрихоні сини пророків бачать, що дух Іллі спочиває на Єлисеєві; він кидає сіль у джерело й оздоровлює його воду."
      es: "En Jericó los hijos de los profetas ven que el espíritu de Elías reposa sobre Eliseo; él echa sal en la fuente y sana sus aguas."
      pt: "Em Jericó, os filhos dos profetas veem que o espírito de Elias repousa sobre Eliseu; ele lança sal na fonte e sara as suas águas."
      de: "In Jericho sehen die Prophetenjünger, dass der Geist Elias auf Elisa ruht; er wirft Salz in die Quelle und macht ihr Wasser gesund."
      fr: "À Jéricho, les fils des prophètes voient que l’esprit d’Élie repose sur Élisée ; il jette du sel dans la source et en guérit l’eau."
      pl: "W Jerychu synowie proroków widzą, że duch Eliasza spoczął na Elizeuszu; wrzuca sól do źródła i uzdrawia jego wodę."
      it: "A Gerico i figli dei profeti vedono che lo spirito di Elia riposa su Eliseo; egli getta del sale nella sorgente e ne risana l’acqua."
      nl: "Te Jericho zien de profetenzonen dat de geest van Elia op Elisa rust; hij werpt zout in de bron en maakt het water gezond."
      cs: "V Jerichu vidí synové proroků, že duch Elijášův spočívá na Elíšovi; ten vhazuje sůl do pramene a uzdravuje jeho vodu."
      sv: "I Jeriko ser profetlärjungarna att Elias ande vilar över Elisha; han kastar salt i källan och gör dess vatten friskt."
  - place: a64f355 # Bethel
    ref: 2Kgs.2.23-2Kgs.2.24
    note:
      en: 'On the road to Bethel little children mock him, "Go up, thou bald head", and two she bears come out of the wood.'
      ru: "По дороге в Вефиль дети насмехаются над ним: «иди, плешивый!», и из леса выходят две медведицы."
      uk: "Дорогою до Бет-Елу малі діти глузують з нього: «Ходи лисий», і з лісу виходять дві ведмедиці."
      es: "En el camino a Betel unos niños se burlan de él: «¡Calvo, sube! ¡calvo, sube!», y salen del bosque dos osas."
      pt: "No caminho para Betel, meninos zombam dele: “Suba, seu careca!”, e duas ursas saem do bosque."
      de: "Auf dem Weg nach Bethel verspotten ihn kleine Kinder: „Kahlkopf, komm herauf!“, und zwei Bärinnen kommen aus dem Wald."
      fr: "Sur le chemin de Béthel, de petits garçons se moquent de lui : « Monte, chauve ! », et deux ourses sortent de la forêt."
      pl: "Na drodze do Betel małe dzieci naśmiewają się z niego: „Idźże łysy, idźże łysy!”, a z lasu wychodzą dwie niedźwiedzice."
      it: "Sulla strada di Betel dei ragazzini lo scherniscono: «Sali calvo!», e due orse escono dal bosco."
      nl: "Op de weg naar Bethel bespotten kleine kinderen hem: “Kaalkop, ga op”, en twee berinnen komen uit het woud."
      cs: "Na cestě do Bét-elu se mu posmívají malé děti: „Jdi lysý, jdi lysý!“ a z lesa vyběhnou „dvě nedvědice“."
      sv: "På vägen till Betel gör småbarn narr av honom: ”Upp med dig, du flintskalle!”, och två björninnor kommer ut ur skogen."
  - place: ac86af5 # Shunem
    ref: 2Kgs.4.8-2Kgs.4.17
    note:
      en: "In Shunem a woman makes him a small room on the wall, and he tells her she will have a son."
      ru: "В Сонаме женщина устраивает для него горницу над стеною, и он предсказывает ей рождение сына."
      uk: "У Сунемі жінка робить для нього маленьку кімнатку на стіні, і він каже їй, що вона матиме сина."
      es: "En Sunem una mujer le prepara un pequeño aposento en el muro, y él le dice que tendrá un hijo."
      pt: "Em Suném, uma mulher lhe faz um pequeno quarto no muro, e ele lhe diz que ela terá um filho."
      de: "In Schunem baut ihm eine Frau ein kleines Zimmer an der Mauer, und er sagt ihr, dass sie einen Sohn bekommen wird."
      fr: "À Sunem, une femme lui fait une petite chambre haute sur le mur, et il lui annonce qu’elle aura un fils."
      pl: "W Szunem pewna kobieta urządza dla niego małą izdebkę na murze, a on mówi jej, że będzie miała syna."
      it: "A Sunem una donna gli prepara una piccola camera sul muro, ed egli le annuncia che avrà un figlio."
      nl: "Te Sunem maakt een vrouw voor hem een kleine kamer op de muur, en hij zegt haar dat zij een zoon zal krijgen."
      cs: "V Šúnemu pro něho žena udělá malý pokojík na zdi a on jí říká, že bude mít syna."
      sv: "I Shunem bygger en kvinna ett litet rum åt honom på muren, och han säger henne att hon ska få en son."
  - place: a3e21c6 # Mount Carmel
    ref: 2Kgs.4.18-2Kgs.4.37
    note:
      en: "When the boy dies, his mother rides to Elisha at Mount Carmel and will not leave him; he goes back with her to Shunem and raises the boy."
      ru: "Когда мальчик умирает, мать едет к Елисею на гору Кармил: «не отстану от тебя»; он идёт с нею в Сонам и воскрешает ребёнка."
      uk: "Коли хлопець помирає, його мати скаче до Єлисея на гору Кармель і не хоче його залишити; він повертається з нею до Сунему й воскрешає хлопця."
      es: "Cuando el niño muere, su madre cabalga hasta Eliseo, en el Monte Carmelo, y no quiere dejarlo; él vuelve con ella a Sunem y resucita al niño."
      pt: "Quando o menino morre, a mãe cavalga até Eliseu no Monte Carmelo e não o deixa; ele volta com ela a Suném e ressuscita o menino."
      de: "Als der Knabe stirbt, reitet seine Mutter zu Elisa auf den Karmel und lässt nicht von ihm ab; er geht mit ihr nach Schunem zurück und erweckt den Knaben."
      fr: "Quand l’enfant meurt, sa mère se rend auprès d’Élisée au Mont Carmel et ne veut pas le quitter ; il retourne avec elle à Sunem et ressuscite l’enfant."
      pl: "Gdy chłopiec umiera, jego matka jedzie do Elizeusza na górę Karmel i nie chce go opuścić; on wraca z nią do Szunem i wskrzesza chłopca."
      it: "Quando il ragazzo muore, sua madre cavalca fino a Eliseo sul Monte Carmelo e non vuole lasciarlo; egli torna con lei a Sunem e risuscita il ragazzo."
      nl: "Als de jongen sterft, rijdt zijn moeder naar Elisa op de Karmel en wil hem niet verlaten; hij gaat met haar terug naar Sunem en wekt de jongen op."
      cs: "Když chlapec umírá, jede jeho matka k Elíšovi na horu Karmel a nechce ho opustit; vrací se s ní do Šúnemu a chlapce křísí."
      sv: "När pojken dör rider hans mor till Elisha på Karmel och vill inte lämna honom; han går tillbaka med henne till Shunem och uppväcker pojken."
  - place: a6399b3 # Gilgal
    ref: 2Kgs.4.38-2Kgs.4.41
    note:
      en: 'At Gilgal, in a famine, the sons of the prophets cry out, "O thou man of God, there is death in the pot"; he throws in meal and it is harmless.'
      ru: "В Галгале, во время голода, сыны пророков кричат: «смерть в котле, человек Божий!»; он всыпает муку, и вреда больше нет."
      uk: "У Гілгалі, під час голоду, сини пророків кричать: «Смерть у казанї, чоловіче Божий!»; він кидає туди борошна, і страва стає нешкідливою."
      es: "En Gilgal, durante una hambruna, los hijos de los profetas claman: «¡Varón de Dios, la muerte en la olla!»; él echa harina y ya no hay daño."
      pt: "Em Gilgal, numa fome, os filhos dos profetas clamam: “Homem de Deus, há morte na panela!”; ele lança farinha, e o cozido se torna inofensivo."
      de: "In Gilgal rufen die Prophetenjünger in einer Hungersnot: „O Mann Gottes, der Tod im Topf!“; er wirft Mehl hinein, und es ist unschädlich."
      fr: "À Guilgal, pendant une famine, les fils des prophètes s’écrient : « La mort est dans le pot, homme de Dieu ! » ; il y jette de la farine, et le plat est inoffensif."
      pl: "W Gilgal, podczas głodu, synowie proroków wołają: „Śmierć w garncu, mężu Boży!”; Elizeusz wrzuca mąkę i potrawa staje się nieszkodliwa."
      it: "A Gàlgala, durante una carestia, i figli dei profeti gridano: «C’è la morte, nella marmitta, o uomo di Dio!»; egli vi getta della farina ed essa non fa più male."
      nl: "Te Gilgal roepen de profetenzonen in een hongersnood: “Man Gods, de dood is in den pot!”; hij werpt er meel in en het is onschadelijk."
      cs: "V Gilgalu za hladu synové proroků křičí: „Smrt v hrnci, muži Boží!“; on do hrnce nasype mouku a nic zlého v něm není."
      sv: "I Gilgal, under en hungersnöd, ropar profetlärjungarna: ”Döden är i grytan, du gudsman!”; han kastar i mjöl, och det blir ofarligt."
  - place: ae686c9 # Jordan
    ref: 2Kgs.5.1-2Kgs.5.14
    note:
      en: "Naaman, captain of the host of the king of Syria, dips himself seven times in the Jordan at Elisha's word and is cleansed of his leprosy."
      ru: "Нееман, военачальник царя Сирийского, по слову Елисея семь раз окунается в Иордане и очищается от проказы."
      uk: "Нааман, начальник війська царя Сирії, за словом Єлисея занурюється сім разів у Йордан і очищується від своєї прокази."
      es: "Naamán, general del ejército del rey de Siria, se sumerge siete veces en el Jordán por palabra de Eliseo y queda limpio de su lepra."
      pt: "Naamã, comandante do exército do rei da Síria, mergulha sete vezes no Jordão por palavra de Eliseu e é purificado da sua lepra."
      de: "Naaman, der Feldhauptmann des Königs von Syrien, taucht auf Elisas Wort siebenmal im Jordan unter und wird von seinem Aussatz rein."
      fr: "Naaman, chef de l’armée du roi de Syrie, se plonge sept fois dans le Jourdain sur la parole d’Élisée et est purifié de sa lèpre."
      pl: "Naaman, wódz wojska króla Syrii, zanurza się siedem razy w Jordanie na słowo Elizeusza i zostaje oczyszczony z trądu."
      it: "Naaman, capo dell’esercito del re di Siria, si immerge sette volte nel Giordano alla parola di Eliseo ed è purificato dalla lebbra."
      nl: "Naäman, de legeroverste van de koning van Syrië, dompelt zich op het woord van Elisa zevenmaal onder in de Jordaan en wordt van zijn melaatsheid gereinigd."
      cs: "Námán, velitel vojska krále syrského, se na Elíšovo slovo sedmkrát ponoří v Jordánu a je očištěn od svého malomocenství."
      sv: "Naaman, överste för den syriske kungens här, doppar sig sju gånger i Jordan på Elishas ord och renas från sin spetälska."
  - place: ab635e4 # Dothan
    ref: 2Kgs.6.13-2Kgs.6.18
    note:
      en: "At Dothan the Syrians surround the city; Elisha's servant sees the mountain full of horses and chariots of fire."
      ru: "В Дофаиме Сирияне окружают город; слуга Елисея видит, что гора полна коней и колесниц огненных."
      uk: "У Дофані сирійці оточують місто; слуга Єлисея бачить гору, повну коней і вогняних колісниць."
      es: "En Dotán los sirios rodean la ciudad; el criado de Eliseo ve el monte lleno de caballos y de carros de fuego."
      pt: "Em Dotã, os sírios cercam a cidade; o servo de Eliseu vê o monte cheio de cavalos e carros de fogo."
      de: "In Dotan umzingeln die Syrer die Stadt; Elisas Diener sieht den Berg voll feuriger Rosse und Wagen."
      fr: "À Dothan, les Syriens entourent la ville ; le serviteur d’Élisée voit la montagne pleine de chevaux et de chars de feu."
      pl: "W Dotan Syryjczycy otaczają miasto; sługa Elizeusza widzi górę pełną koni i rydwanów ognistych."
      it: "A Dotan i Siri circondano la città; il servo di Eliseo vede il monte pieno di cavalli e di carri di fuoco."
      nl: "Te Dotan omsingelen de Syriërs de stad; de dienaar van Elisa ziet de berg vol paarden en wagens van vuur."
      cs: "V Dótanu Syřané obkličují město; Elíšův služebník vidí horu plnou ohnivých koní a vozů."
      sv: "I Dotan omringar syrierna staden; Elishas tjänare ser berget fullt av hästar och eldvagnar."
  - place: a041bb3 # Samaria
    ref: 2Kgs.6.24-2Kgs.7.1
    note:
      en: "Ben-hadad besieges Samaria and the city starves; Elisha says that tomorrow a measure of fine flour will be sold for a shekel at its gate."
      ru: "Венадад осаждает Самарию, в городе голод; Елисей говорит, что завтра мера лучшей муки будет по сиклю у ворот Самарии."
      uk: "Бен-Гадад облягає Самарію, і в місті голод; Єлисей каже, що завтра біля її брами міру пшеничного борошна продаватимуть за шекель."
      es: "Ben-adad sitia Samaria y la ciudad pasa hambre; Eliseo dice que mañana se venderá a su puerta una medida de flor de harina por un siclo."
      pt: "Ben-Hadade cerca Samaria, e a cidade passa fome; Eliseu diz que amanhã uma medida de farinha fina será vendida por um siclo à sua porta."
      de: "Ben-Hadad belagert Samaria, und die Stadt hungert; Elisa sagt, dass morgen an ihrem Tor ein Maß Feinmehl für einen Schekel verkauft werden wird."
      fr: "Ben-Hadad assiège Samarie, et la ville est affamée ; Élisée annonce que le lendemain une mesure de fleur de farine se vendra un sicle à sa porte."
      pl: "Ben-Hadad oblega Samarię i miasto głoduje; Elizeusz mówi, że jutro u jej bramy miara najczystszej mąki będzie sprzedawana za sykl."
      it: "Ben-Adad assedia Samaria e la città soffre la fame; Eliseo dice che l’indomani alla sua porta una misura di fior di farina si venderà per un siclo."
      nl: "Ben-Hadad belegert Samaria en de stad lijdt honger; Elisa zegt dat morgen een maat fijn meel voor een sikkel bij haar poort zal worden verkocht."
      cs: "Ben-hadad obléhá Samaří a město hladoví; Elíša říká, že zítra se u jeho brány bude prodávat míra jemné mouky za šekel."
      sv: "Ben-Hadad belägrar Samaria, och staden svälter; Elisha säger att i morgon ska ett mått fint mjöl säljas för en sikel i stadens port."
  - place: a69c1d4 # Damascus
    ref: 2Kgs.8.7-2Kgs.8.15
    note:
      en: "In Damascus, where Ben-hadad lies sick, Elisha weeps before Hazael, who will be king of Syria."
      ru: "В Дамаске, где болен Венадад, Елисей плачет перед Азаилом, которому быть царём Сирии."
      uk: "У Дамаску, де хворіє Бен-Гадад, Єлисей плаче перед Азаїлом, який стане царем Сирії."
      es: "En Damasco, donde Ben-adad yace enfermo, Eliseo llora ante Hazael, que será rey de Siria."
      pt: "Em Damasco, onde Ben-Hadade jaz doente, Eliseu chora diante de Hazael, que será rei da Síria."
      de: "In Damaskus, wo Ben-Hadad krank liegt, weint Elisa vor Hasaël, der König von Syrien werden wird."
      fr: "À Damas, où Ben-Hadad est malade, Élisée pleure devant Hazaël, qui sera roi de Syrie."
      pl: "W Damaszku, gdzie Ben-Hadad leży chory, Elizeusz płacze przed Chazaelem, który zostanie królem Syrii."
      it: "A Damasco, dove Ben-Adad giace malato, Eliseo piange davanti a Cazaèl, che sarà re di Siria."
      nl: "Te Damascus, waar Ben-Hadad ziek ligt, weent Elisa voor Hazaël, die koning van Syrië zal worden."
      cs: "V Damašku, kde Ben-hadad leží nemocen, pláče Elíša před Chazaelem, který bude králem Sýrie."
      sv: "I Damaskus, där Ben-Hadad ligger sjuk, gråter Elisha inför Hasael, som ska bli kung över Syrien."
