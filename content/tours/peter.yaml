# The apostle Peter in Acts 2-12, from Pentecost to the death of Herod Agrippa I, in the
# order of the text. The tour's year (AD 40) is a point for the map between Pentecost
# (c. AD 30) and Herod's death in AD 44 (Josephus, Antiquities 19.343-350).
id: peter
title:
  en: "The apostle Peter"
  ru: "Апостол Пётр"
  uk: "Апостол Петро"
  es: "El apóstol Pedro"
  pt: "O apóstolo Pedro"
  de: "Der Apostel Petrus"
  fr: "L’apôtre Pierre"
  pl: "Apostoł Piotr"
  it: "L’apostolo Pietro"
  nl: "De apostel Petrus"
  cs: "Apoštol Petr"
  sv: "Aposteln Petrus"
  nb: "Apostelen Peter"
  tl: "Ang apostol na si Pedro"
  da: "Apostlen Peter"
  sr: "Апостол Петар"
  hu: "Péter apostol"
  fi: "Apostoli Pietari"
  vi: "Sứ đồ Phi-e-rơ"
  ro: "Apostolul Petru"
  bg: "Апостол Петър"
year: "AD 40"
people: ["Peter@Mat.4.18-2Pe"]
approximate: true
stops:
  - place: a15257a # Jerusalem
    ref: Acts.2.14-Acts.2.41
    year: "AD 30"
    note:
      en: "At Pentecost Peter stands with the eleven and speaks; about three thousand are baptised."
      ru: "В день Пятидесятницы Пётр, став с одиннадцатью, говорит народу; крестятся около трёх тысяч."
      uk: "На П’ятдесятницю Петро стає з одинадцятьма й промовляє; близько трьох тисяч приймають хрещення."
      es: "En Pentecostés Pedro se pone en pie con los once y habla; unos tres mil son bautizados."
      pt: "No Pentecostes, Pedro se levanta com os onze e fala; cerca de três mil são batizados."
      de: "An Pfingsten tritt Petrus mit den Elfen auf und redet; etwa dreitausend lassen sich taufen."
      fr: "À la Pentecôte, Pierre se lève avec les onze et parle ; environ trois mille personnes sont baptisées."
      pl: "W Pięćdziesiątnicę Piotr staje z jedenastoma i przemawia; około trzech tysięcy zostaje ochrzczonych."
      it: "A Pentecoste Pietro si leva con gli undici e parla; circa tremila sono battezzati."
      nl: "Met Pinksteren staat Petrus op met de elf en spreekt; ongeveer drieduizend worden gedoopt."
      cs: "O Letnicích povstává Petr s jedenácti a mluví; pokřtěno je asi tři tisíce."
      sv: "Vid pingst står Petrus upp med de elva och talar; omkring tre tusen döps."
      nb: "På pinsedagen står Peter frem sammen med de elleve og taler; omkring tre tusen blir døpt."
      tl: "Sa Pentecostes, tumatayo si Pedro kasama ang labing-isa at nagsasalita; mga tatlong libo ang nabautismuhan."
      da: "Ved pinse står Peter sammen med de elleve og taler; omkring tre tusind lader sig døbe."
      sr: "На Педесетницу Петар стаје са једанаесторицом и говори; око три хиљаде се крштава."
      hu: "Pünkösdkor Péter a tizenegyekkel feláll és beszél; mintegy háromezren keresztelkednek meg."
      fi: "Helluntaina Pietari seisoo yhdentoista kanssa ja puhuu; noin kolmetuhatta kastetaan."
      vi: "Vào lễ Ngũ Tuần, Phi-e-rơ đứng cùng mười một sứ đồ và giảng; khoảng ba ngàn người chịu báp têm."
      ro: "La Cincizecime, Petru stă în picioare cu cei unsprezece și vorbește; cam trei mii sunt botezați."
      bg: "На Петдесетница Петър застава с единадесетте и говори; около три хиляди се кръщават."
  - place: a282dce # Samaria (region)
    ref: Acts.8.14-Acts.8.25
    note:
      en: "Sent with John to Samaria, he rebukes Simon, who wanted to buy the gift of God with money."
      ru: "Посланный с Иоанном в Самарию, он обличает Симона, помыслившего получить дар Божий за деньги."
      uk: "Посланий з Іваном до Самарії, він докоряє Симонові, який хотів купити дар Божий за гроші."
      es: "Enviado con Juan a Samaria, reprende a Simón, que quería comprar con dinero el don de Dios."
      pt: "Enviado com João a Samaria, repreende Simão, que queria comprar o dom de Deus com dinheiro."
      de: "Mit Johannes nach Samaria gesandt, weist er Simon zurecht, der die Gabe Gottes mit Geld kaufen wollte."
      fr: "Envoyé avec Jean en Samarie, il reprend Simon, qui voulait acheter le don de Dieu avec de l’argent."
      pl: "Posłany z Janem do Samarii, gani Szymona, który chciał kupić dar Boży za pieniądze."
      it: "Mandato con Giovanni in Samaria, rimprovera Simone, che voleva comprare con denaro il dono di Dio."
      nl: "Met Johannes naar Samaria gezonden berispt hij Simon, die de gave van God met geld wilde kopen."
      cs: "Poslán s Janem do Samaří, kárá Šimona, který chtěl dar Boží koupit za peníze."
      sv: "Sänd med Johannes till Samaria tillrättavisar han Simon, som ville köpa Guds gåva för pengar."
      nb: "Sendt med Johannes til Samaria refser han Simon, som ville kjøpe Guds gave med penger."
      tl: "Isinugo kasama ni Juan sa Samaria, sinasaway niya si Simon, na nais bumili ng kaloob ng Dios sa pamamagitan ng salapi."
      da: "Sendt sammen med Johannes til Samaria irettesætter han Simon, som ville købe Guds gave for penge."
      sr: "Послан с Јованом у Самарију, кори Симона, који је хтео да купи дар Божји новцем."
      hu: "Jánossal Szamáriába küldik, ahol megdorgálja Simont, aki pénzen akarta megvenni Isten ajándékát."
      fi: "Johanneksen kanssa Samariaan lähetettynä hän nuhtelee Simonia, joka halusi ostaa Jumalan lahjan rahalla."
      vi: "Được sai cùng Giăng đến Sa-ma-ri, người quở trách Si-môn, kẻ muốn lấy tiền mua ơn ban của Đức Chúa Trời."
      ro: "Trimis împreună cu Ioan în Samaria, îl mustră pe Simon, care voia să cumpere cu bani darul lui Dumnezeu."
      bg: "Изпратен с Йоан в Самария, той изобличава Симон, който искаше да купи Божия дар с пари."
  - place: a2c5cc7 # Lydda
    ref: Acts.9.32-Acts.9.35
    note:
      en: "In Lod (Lydda) he heals Aeneas, bedridden for eight years."
      ru: "В Лидде он исцеляет Энея, восемь лет лежавшего в постели."
      uk: "У Лідді він зцілює Енея, що вісім років лежав у ліжку."
      es: "En Lida (Lod) sana a Eneas, postrado en cama desde hacía ocho años."
      pt: "Em Lida (Lod) cura Enéias, acamado havia oito anos."
      de: "In Lod (Lydda) heilt er Äneas, der acht Jahre lang bettlägerig war."
      fr: "À Lydde, il guérit Énée, couché depuis huit ans."
      pl: "W Lod (Lyddzie) uzdrawia Eneasza, od ośmiu lat przykutego do łoża."
      it: "A Lidda (Lod) guarisce Enea, paralitico da otto anni."
      nl: "In Lydda geneest hij Aeneas, die acht jaar bedlegerig was."
      cs: "V Lodu (Lydda) uzdravuje Ainéa, osm let upoutaného na lože."
      sv: "I Lod (Lydda) botar han Aineas, som legat sängliggande i åtta år."
      nb: "I Lod (Lydda) helbreder han Æneas, som hadde ligget syk til sengs i åtte år."
      tl: "Sa Lod (Lida) ay pinagagaling niya si Eneas, na walong taon nang nakaratay."
      da: "I Lydda (Lod) helbreder han Æneas, der havde ligget til sengs i otte år."
      sr: "У Лиди (Лоду) исцељује Енеју, који је осам година лежао у постељи."
      hu: "Lódban (Lüddában) meggyógyítja a nyolc éve ágyban fekvő Éneást."
      fi: "Lodissa (Lyddassa) hän parantaa Aineaan, joka oli maannut vuoteessa kahdeksan vuotta."
      vi: "Tại Ly-đa (Lod), người chữa lành Ê-nê, đã nằm liệt tám năm."
      ro: "În Lida îl vindecă pe Enea, țintuit la pat de opt ani."
      bg: "В Лида той изцелява Еней, прикован на легло от осем години."
  - place: ae023a9 # Joppa
    ref: Acts.9.36-Acts.10.23
    note:
      en: "In Joppa he raises Tabitha, and on the housetop sees the vision of the sheet."
      ru: "В Иоппии он воскрешает Тавифу и на кровле дома ему является видение полотна."
      uk: "В Яффі він воскрешає Тавіту, а на даху бачить видіння простирадла."
      es: "En Jope resucita a Tabita, y en la azotea ve la visión del lienzo."
      pt: "Em Jope ressuscita Tabita e, no terraço da casa, vê a visão do lençol."
      de: "In Joppe erweckt er Tabita und sieht auf dem Dach das Gesicht des Tuches."
      fr: "À Joppé, il ressuscite Tabitha, et sur le toit de la maison il voit la vision de la nappe."
      pl: "W Jafie wskrzesza Tabitę, a na dachu domu ogląda widzenie płótna."
      it: "A Giaffa risuscita Tabita e, sul tetto, ha la visione del lenzuolo."
      nl: "In Joppe wekt hij Tabita op, en op het dak ziet hij het visioen van het kleed."
      cs: "V Joppe křísí Tabitu a na střeše vidí vidění plátna."
      sv: "I Joppe uppväcker han Tabita, och på taket ser han synen av duken."
      nb: "I Jaffa oppvekker han Tabita, og på hustaket ser han synet med duken."
      tl: "Sa Joppa ay binubuhay niya si Tabita, at sa bubungan ay nakikita ang pangitain ng kumot."
      da: "I Joppe opvækker han Tabita, og på taget ser han synet af dugen."
      sr: "У Јопи васкрсава Тавиту, а на крову види виђење о платну."
      hu: "Joppéban feltámasztja Tabitát, és a háztetőn megpillantja a lepedő látomását."
      fi: "Joppessa hän herättää Tabitan kuolleista ja näkee katolla näyn lakanasta."
      vi: "Tại Giốp-bê, người khiến Ta-bi-tha sống lại, và trên nóc nhà thấy dị tượng cái khăn lớn."
      ro: "În Iafo o învie pe Tabita, iar pe acoperișul casei are vedenia pânzei."
      bg: "В Яфа той възкресява Тавита и на покрива на къщата вижда видението с платното."
  - place: a58735e # Caesarea
    ref: Acts.10.24-Acts.10.48
    note:
      en: "In Caesarea, as Peter speaks in the house of the centurion Cornelius, the Holy Spirit falls on all who hear the word."
      ru: "В Кесарии, пока Пётр говорит в доме сотника Корнилия, Дух Святой сходит на всех, слушающих слово."
      uk: "У Кесарії, коли Петро говорить у домі сотника Корнилія, Дух Святий сходить на всіх, хто слухає слово."
      es: "En Cesarea, mientras Pedro habla en casa del centurión Cornelio, el Espíritu Santo cae sobre todos los que oyen la palabra."
      pt: "Em Cesareia, enquanto Pedro fala na casa do centurião Cornélio, o Espírito Santo cai sobre todos os que ouvem a palavra."
      de: "In Caesarea fällt der Heilige Geist auf alle, die das Wort hören, als Petrus im Haus des Hauptmanns Kornelius redet."
      fr: "À Césarée, pendant que Pierre parle dans la maison du centurion Corneille, le Saint-Esprit descend sur tous ceux qui entendent la parole."
      pl: "W Cezarei, gdy Piotr przemawia w domu setnika Korneliusza, Duch Święty zstępuje na wszystkich, którzy słuchają słowa."
      it: "A Cesarea, mentre Pietro parla in casa del centurione Cornelio, lo Spirito Santo scende su tutti quelli che ascoltano la parola."
      nl: "In Caesarea, terwijl Petrus spreekt in het huis van de hoofdman Cornelius, valt de Heilige Geest op allen die het woord horen."
      cs: "V Cesareji, když Petr mluví v domě setníka Kornelia, padá Duch svatý na všechny, kdo slyší slovo."
      sv: "I Caesarea, medan Petrus talar i hundrahövitsmannen Cornelius’ hus, faller den helige Ande över alla som hör ordet."
      nb: "I Cæsarea, mens Peter taler i høvedsmannen Kornelius' hus, faller Den hellige ånd over alle som hører ordet."
      tl: "Sa Cesarea, habang nagsasalita si Pedro sa bahay ng senturyon na si Cornelio, bumababa ang Espiritu Santo sa lahat ng nakikinig ng salita."
      da: "I Cæsarea, mens Peter taler i høvedsmanden Kornelius' hus, falder Helligånden over alle, der hører ordet."
      sr: "У Цезареји, док Петар говори у кући стотника Корнилија, Дух Свети пада на све који слушају реч."
      hu: "Cézáreában, miközben Péter Kornélius százados házában beszél, a Szentlélek leszáll mindazokra, akik hallják az igét."
      fi: "Kesareassa, kun Pietari puhuu sadanpäämies Korneliuksen talossa, Pyhä Henki laskeutuu kaikkien päälle, jotka kuulevat sanan."
      vi: "Tại Sê-sa-rê, khi Phi-e-rơ nói trong nhà viên đội trưởng Cọt-nây, Đức Thánh Linh giáng trên mọi người nghe lời."
      ro: "În Cezareea, pe când Petru vorbește în casa sutașului Corneliu, Duhul Sfânt Se coboară peste toți cei ce ascultă cuvântul."
      bg: "В Кесария, докато Петър говори в дома на стотника Корнилий, Светият Дух слиза върху всички, които слушат словото."
  - place: a15257a # Jerusalem
    ref: Acts.11.2-Acts.12.17
    note:
      en: "Back in Jerusalem he tells the church about Cornelius; imprisoned by Herod, he is led out by an angel."
      ru: "Вернувшись в Иерусалим, он рассказывает церкви о Корнилии; заключённого Иродом, его выводит из темницы Ангел."
      uk: "Знову в Єрусалимі він розповідає церкві про Корнилія; ув’язненого Іродом, його виводить ангел."
      es: "De vuelta en Jerusalén cuenta a la iglesia lo de Cornelio; encarcelado por Herodes, un ángel lo saca."
      pt: "De volta a Jerusalém, conta à igreja sobre Cornélio; preso por Herodes, é conduzido para fora por um anjo."
      de: "Wieder in Jerusalem berichtet er der Gemeinde von Kornelius; von Herodes ins Gefängnis geworfen, wird er von einem Engel hinausgeführt."
      fr: "De retour à Jérusalem, il raconte à l’Église l’histoire de Corneille ; emprisonné par Hérode, il est conduit dehors par un ange."
      pl: "Z powrotem w Jerozolimie opowiada Kościołowi o Korneliuszu; uwięziony przez Heroda, zostaje wyprowadzony przez anioła."
      it: "Di nuovo a Gerusalemme racconta alla chiesa quanto è accaduto con Cornelio; imprigionato da Erode, è condotto fuori da un angelo."
      nl: "Terug in Jeruzalem vertelt hij de gemeente over Cornelius; door Herodes gevangengezet wordt hij door een engel naar buiten geleid."
      cs: "Zpět v Jeruzalémě vypráví církvi o Korneliovi; uvězněn Herodem, je andělem vyveden ven."
      sv: "Åter i Jerusalem berättar han för församlingen om Cornelius; fängslad av Herodes förs han ut av en ängel."
      nb: "Tilbake i Jerusalem forteller han menigheten om Kornelius; satt i fengsel av Herodes blir han ført ut av en engel."
      tl: "Pagbalik sa Jerusalem, isinasalaysay niya sa iglesya ang tungkol kay Cornelio; ibinilanggo ni Herodes, inilabas siya ng isang anghel."
      da: "Tilbage i Jerusalem fortæller han menigheden om Kornelius; fængslet af Herodes føres han ud af en engel."
      sr: "Опет у Јерусалиму приповеда цркви о Корнилију; кад га Ирод затвори, анђео га изводи."
      hu: "Jeruzsálembe visszatérve elmondja a gyülekezetnek a Kornéliusszal történteket; Heródes börtönbe veti, de egy angyal kivezeti."
      fi: "Takaisin Jerusalemissa hän kertoo seurakunnalle Korneliuksesta; Herodeksen vangitsemana hänet johdattaa ulos enkeli."
      vi: "Trở lại Giê-ru-sa-lem, người thuật cho Hội thánh nghe về Cọt-nây; bị Hê-rốt bỏ tù, người được một thiên sứ dẫn ra."
      ro: "Întors la Ierusalim, îi povestește bisericii despre Corneliu; întemnițat de Irod, este scos afară de un înger."
      bg: "Обратно в Йерусалим той разказва на църквата за Корнилий; хвърлен в тъмница от Ирод, той е изведен от един ангел."
  - place: a58735e # Caesarea
    ref: Acts.12.19-Acts.12.23
    year: "AD 44"
    note:
      en: "In Caesarea Herod, who did not give God the glory, is struck by the angel of the Lord and dies."
      ru: "В Кесарии Ирода, не воздавшего славы Богу, поражает Ангел Господень, и он умирает."
      uk: "У Кесарії Ірода, який не віддав Богові слави, вражає ангел Господній, і той помирає."
      es: "En Cesarea Herodes, que no dio la gloria a Dios, es herido por el ángel del Señor y muere."
      pt: "Em Cesareia, Herodes, que não deu a glória a Deus, é ferido pelo anjo do Senhor e morre."
      de: "In Caesarea wird Herodes, der Gott nicht die Ehre gab, vom Engel des Herrn geschlagen und stirbt."
      fr: "À Césarée, Hérode, qui n’avait pas donné gloire à Dieu, est frappé par l’ange du Seigneur et meurt."
      pl: "W Cezarei Herod, który nie oddał Bogu chwały, zostaje uderzony przez anioła Pańskiego i umiera."
      it: "A Cesarea Erode, che non diede gloria a Dio, è colpito dall’angelo del Signore e muore."
      nl: "In Caesarea wordt Herodes, die God de eer niet gaf, door de engel van de Heer geslagen en sterft."
      cs: "V Cesareji je Herodes, který nedal Bohu slávu, udeřen andělem Hospodinovým a umírá."
      sv: "I Caesarea slås Herodes, som inte gav Gud äran, av Herrens ängel och dör."
      nb: "I Cæsarea blir Herodes, som ikke gav Gud æren, slått av Herrens engel og dør."
      tl: "Sa Cesarea, si Herodes, na hindi nagbigay ng kaluwalhatian sa Diyos, ay sinaktan ng anghel ng Panginoon at namatay."
      da: "I Cæsarea bliver Herodes, som ikke gav Gud æren, ramt af Herrens engel og dør."
      sr: "У Цезареји Ирода, који није дао славу Богу, удара анђео Господњи и он умире."
      hu: "Cézáreában Heródest, aki nem Istennek adta a dicsőséget, megüti az Úr angyala, és meghal."
      fi: "Kesareassa Herodes, joka ei antanut kunniaa Jumalalle, joutuu Herran enkelin lyömäksi ja kuolee."
      vi: "Tại Sê-sa-rê, Hê-rốt, vì chẳng nhường sự vinh hiển cho Đức Chúa Trời, bị thiên sứ của Chúa đánh và chết."
      ro: "În Cezareea, Irod, care nu I-a dat slavă lui Dumnezeu, este lovit de îngerul Domnului și moare."
      bg: "В Кесария Ирод, който не отдаде славата на Бога, е поразен от ангела Господен и умира."
