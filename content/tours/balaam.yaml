# Balaam, Numbers 22-24, with the end of his story in Numbers 25 and 31, in the order of
# the text. The tour's year (1407 BC) follows the Exodus tour's reckoning (1 Kgs 6:1): the
# fortieth year, on the plains of Moab before the crossing in 1406 BC; the later date,
# c. 1220 BC, is also held. A point for the map. Balaam's way from Pethor to Moab is told
# (the ass on the road, 22:21-35) but no station of it is named; the three heights he is
# taken to are Moab's, east of the Jordan, and the map shows OpenBible's most likely sites.
# Midian is the map's point for the land east of the Gulf of Aqaba; the Midianites of
# Numbers 25 and 31 were then near Moab (22:4), so the last stop marks the people, not
# the battlefield.
