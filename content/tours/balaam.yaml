  - place: aa9e754 # Pethor
    ref: Num.22.1-Num.22.21
    note:
      en: 'Balak king of Moab sends princes to Balaam at Pethor by the River: "curse me this people; for they are too mighty for me". God lets him go, but only to speak the word given him.'
      ru: "Валак, царь Моавитский, посылает послов к Валааму в Пефор, что на реке Евфрате: «прокляни мне народ сей, ибо он сильнее меня». Бог отпускает его, но только говорить то, что Он скажет."
      uk: "Валак, цар Моаву, посилає князів до Валаама в Пефор над Рікою: «прийди та проклени менї сей люд: надто бо він потужен проти мене». Бог дозволяє йому йти, але лише щоб промовити слово, яке йому дано."
      es: "Balac, rey de Moab, envía príncipes a Balaam, a Petor, junto al Éufrates: «maldíceme este pueblo, porque es más fuerte que yo». Dios le deja ir, pero solo para decir la palabra que se le dé."
      pt: "Balaque, rei de Moabe, envia príncipes a Balaão em Petor, junto ao Rio: “amaldiçoe este povo para mim; pois eles são poderosos demais para mim”. Deus o deixa ir, mas apenas para dizer a palavra que lhe for dada."
      de: "Balak, der König von Moab, sendet Fürsten zu Bileam nach Petor am Strom: „verfluche mir das Volk (denn es ist mir zu mächtig)“. Gott lässt ihn ziehen, aber nur, um das Wort zu sprechen, das ihm gegeben wird."
      fr: "Balak, roi de Moab, envoie des chefs à Balaam à Pethor, près du fleuve : « maudis-moi ce peuple, car il est plus puissant que moi ». Dieu le laisse partir, mais seulement pour dire la parole qui lui sera donnée."
      pl: "Balak, król Moabu, wysyła książąt do Balaama w Petor nad Rzeką: „przeklinaj mnie kwoli lud ten, bo możniejszy jest nad mię”. Bóg pozwala mu iść, lecz tylko po to, by wypowiedział słowo, które mu zostanie dane."
      it: "Balak, re di Moab, manda dei principi a Balaam, a Petor presso il Fiume: «maledicimi questo popolo; poiché è troppo potente per me». Dio lo lascia partire, ma solo perché dica la parola che gli sarà data."
      nl: "Balak, de koning van Moab, stuurt vorsten naar Bileam te Petor aan de Rivier: “vervloek mij dit volk, want het is machtiger dan ik”. God laat hem gaan, maar alleen om het woord te spreken dat hem wordt gegeven."
      cs: "Balak, král Moábu, posílá knížata k Bileámovi do Petóru u Eufratu: „zlořeč mně k vůli lidu tomuto, nebo silnější mne jest“. Bůh mu dovolí jít, ale jen mluvit slovo, které mu bude dáno."
      sv: "Balak, Moabs kung, sänder furstar till Bileam i Petor vid Floden: ”Så kom nu och förbanna åt mig detta folk, ty det är mig för mäktigt”. Gud låter honom gå, men bara för att tala det ord som läggs i hans mun."
      nb: "Balak, Moabs konge, sender fyrster til Bileam i Petor ved Eufrat: «forbann dette folk for mig, for det er mig for mektig!» Gud lar ham dra, men bare for å tale det ord som blir gitt ham."
      tl: "Nagsusugo si Balac na hari ng Moab ng mga pinuno kay Balaam sa Pethor sa tabi ng ilog: “sumpain mo sa akin ang bayang ito; sapagka't sila'y totoong makapangyarihan kay sa akin”. Pinapayagan siya ng Dios na yumaon, ngunit upang salitain lamang ang salitang ibinigay sa kaniya."
      da: "Balak, Moabs konge, sender fyrster til Bileam i Petor ved Eufrat: »forband mig dette Folk, thi det er mig for mægtigt«. Gud lader ham tage af sted, men kun for at tale det ord, der bliver givet ham."
      sr: "Валак, цар моавски, шаље кнезове Валаму у Фетор на Еуфрату: „прокуни ми овај народ, јер је јачи од мене“. Бог га пушта да иде, али само да говори реч која му буде дана."
      hu: "Bálák, Moáb királya fejedelmeket küld Bálámhoz a Folyó melletti Petórba: „átkozd meg érettem e népet, mert erősebb nálamnál”. Isten elengedi, de csak azért, hogy azt mondja, amit neki adnak a szájába."
      fi: "Moabin kuningas Balak lähettää ruhtinaita Bileamin luo Petoriin Joen varrelle: ”kiroa minun puolestani tämä kansa, sillä se on minua väkevämpi”. Jumala antaa hänen lähteä, mutta vain puhumaan se sana, joka hänelle annetaan."
      vi: "Ba-lác, vua Mô-áp, sai các quan trưởng đến Ba-la-am tại Phê-thô-rơ gần Sông Ơ-phơ-rát: “rủa sả dân nầy cho ta, vì nó mạnh hơn ta”. Đức Chúa Trời cho phép người đi, nhưng chỉ để nói lời đã được truyền cho."
      ro: "Balac, regele Moabului, trimite căpetenii la Balaam, la Petor, lângă Râu: „vino de blesteamă mie pre poporul acesta, că mai tare decât mine este”. Dumnezeu îl lasă să meargă, dar numai ca să rostească cuvântul care i se va da."
      bg: "Валак, царят на Моав, изпраща князе при Валаам в Петор край Реката: „прокълни ми тези люде, защото са по-силни от мене“. Бог го пуска да иде, но само за да говори словото, което му е дадено."
  - place: a6c0a5f # Ir-moab
    ref: Num.22.22-Num.22.38
    note:
      en: "On the road the ass sees the angel of the Lord with a drawn sword and speaks; Balak meets Balaam at a city of Moab on the border of the Arnon."
      ru: "В дороге ослица видит Ангела Господня с обнажённым мечом и говорит; Валак встречает Валаама в городе Моавитском на границе при Арноне."
      uk: "Дорогою ослиця бачить ангела Господнього з оголеним мечем і заговорює; Валак зустрічає Валаама в моавському місті на межі Арнону."
      es: "En el camino la asna ve al ángel del Señor con la espada desenvainada y habla; Balac sale al encuentro de Balaam en una ciudad de Moab, en el límite del Arnón."
      pt: "No caminho, a jumenta vê o anjo do Senhor com a espada desembainhada e fala; Balaque encontra Balaão numa cidade de Moabe, na fronteira do Arnom."
      de: "Unterwegs sieht die Eselin den Engel des Herrn mit gezücktem Schwert und redet; Balak trifft Bileam in einer Stadt Moabs an der Grenze des Arnon."
      fr: "En chemin, l’ânesse voit l’ange de l’Éternel l’épée nue et parle ; Balak rencontre Balaam dans une ville de Moab, sur la frontière de l’Arnon."
      pl: "W drodze oślica widzi anioła Pana z dobytym mieczem i przemawia; Balak spotyka Balaama w moabskim mieście na granicy Arnonu."
      it: "Per strada l’asina vede l’angelo del Signore con la spada sguainata e parla; Balak incontra Balaam in una città di Moab, sul confine dell’Arnon."
      nl: "Onderweg ziet de ezelin de engel van de HEER met getrokken zwaard en spreekt; Balak ontmoet Bileam in een stad van Moab aan de grens van de Arnon."
      cs: "Na cestě oslice vidí anděla Hospodinova s taseným mečem a promluví; Balak se s Bileámem setkává ve městě Moábu na hranici Arnonu."
      sv: "På vägen ser åsnan Herrens ängel med draget svärd och talar; Balak möter Bileam i en stad i Moab vid gränsen där Arnon flyter."
      nb: "På veien ser eselet Herrens engel med draget sverd og taler; Balak møter Bileam i en by i Moab ved grensen til Arnon."
      tl: "Sa daan ay nakikita ng asno ang anghel ng Panginoon na may hawak na bunot na tabak at nagsasalita; sinasalubong ni Balac si Balaam sa isang bayan ng Moab sa hangganan ng Arnon."
      da: "På vejen ser æselet Herrens engel med draget sværd og taler; Balak møder Bileam i en by i Moab ved Arnons grænse."
      sr: "На путу магарица види анђела Господњег с исуканим мачем и проговара; Валак среће Валама у једном моавском граду на међи Арнона."
      hu: "Az úton a szamár meglátja az Úr angyalát kivont karddal, és megszólal; Bálák egy moábi városban, az Arnon határán találkozik Bálámmal."
      fi: "Tiellä aasi näkee Herran enkelin paljastettu miekka kädessä ja puhuu; Balak tapaa Bileamin Moabin kaupungissa Arnonin rajalla."
      vi: "Dọc đường, con lừa thấy thiên sứ của Đức Giê-hô-va cầm gươm tuốt trần và cất tiếng nói; Ba-lác gặp Ba-la-am tại một thành của Mô-áp, nơi bờ cõi Ạt-nôn."
      ro: "Pe drum, măgărița îl vede pe îngerul Domnului cu sabia scoasă și vorbește; Balac îl întâmpină pe Balaam la o cetate a Moabului, la hotarul Arnonului."
      bg: "По пътя ослицата вижда ангела Господен с изваден меч и проговаря; Валак посреща Валаам в един моавски град на границата при Арнон."
  - place: aeb19d6 # Kiriath-huzoth
    ref: Num.22.39-Num.22.40
    note:
      en: "They come to Kiriath-huzoth, where Balak offers oxen and sheep and sends to Balaam and the princes with him."
      ru: "Они приходят в Кириаф-Хуцоф; Валак закалывает волов и овец и посылает Валааму и князьям, бывшим с ним."
      uk: "Вони приходять до Кіріат-Хуцоту, де Валак приносить у жертву волів і овець і посилає частини Валаамові та князям, що з ним."
      es: "Llegan a Quiriat-huzot, donde Balac ofrece bueyes y ovejas y envía a Balaam y a los príncipes que están con él."
      pt: "Chegam a Quiriate-Huzote, onde Balaque oferece bois e ovelhas e envia a Balaão e aos príncipes que estão com ele."
      de: "Sie kommen nach Kirjat-Huzot, wo Balak Rinder und Schafe opfert und zu Bileam und den Fürsten bei ihm sendet."
      fr: "Ils arrivent à Kirjath-Hutsoth, où Balak offre des bœufs et des brebis et en envoie à Balaam et aux chefs qui sont avec lui."
      pl: "Docierają do Kiriat-Chuzot, gdzie Balak składa w ofierze woły i owce i posyła do Balaama oraz do towarzyszących mu książąt."
      it: "Giungono a Kiriat-Cusot, dove Balak offre buoi e pecore e ne manda a Balaam e ai principi che sono con lui."
      nl: "Zij komen te Kirjat-Chuzot, waar Balak ossen en schapen offert en een deel zendt naar Bileam en de vorsten die bij hem zijn."
      cs: "Přicházejí do Kirjat-chucótu, kde Balak obětuje voly a ovce a posílá Bileámovi i knížatům, kteří jsou s ním."
      sv: "De kommer till Kirjat-Husot, där Balak offrar oxar och får och sänder bud till Bileam och furstarna som är med honom."
      nb: "De kommer til Kirjat-Husot, hvor Balak ofrer okser og småfe og sender bud til Bileam og fyrstene som er med ham."
      tl: "Dumarating sila sa Chiriath-huzoth, kung saan naghahandog si Balac ng mga baka at tupa at nagpapadala kay Balaam at sa mga pinunong kasama niya."
      da: "De kommer til Kirjat-Husot, hvor Balak ofrer okser og får og sender bud til Bileam og de fyrster, der er med ham."
      sr: "Долазе у Киријат-Хусот, где Валак приноси волове и овце и шаље Валаму и кнезовима који су с њим."
      hu: "Kirját-Huccótba érkeznek, ahol Bálák ökröket és juhokat áldoz, és küld Bálámnak meg a vele levő fejedelmeknek."
      fi: "He tulevat Kirjat-Husotiin, jossa Balak uhraa härkiä ja lampaita ja lähettää Bileamille ja hänen kanssaan oleville ruhtinaille."
      vi: "Họ đến Ki-ri-át-Hu-xốt, nơi Ba-lác tế bò và chiên, rồi sai mời Ba-la-am và các quan trưởng đi với người."
      ro: "Ajung la Chiriat-Huțot, unde Balac jertfește boi și oi și trimite din ele lui Balaam și căpeteniilor care erau cu el."
      bg: "Те идват в Кириат-Хуцот, където Валак принася волове и овце и изпраща от тях на Валаам и на князете, които са с него."
  - place: a577c27 # Bamoth-baal
    ref: Num.22.41-Num.23.12
    note:
      en: 'From the high places of Baal Balaam sees the edge of the camp; seven altars, and the first oracle: "How shall I curse, whom God hath not cursed?"'
      ru: "С высот Вааловых Валаам видит часть народа; семь жертвенников и первое слово: «Как прокляну я? Бог не проклинает его»."
      uk: "З високих місць Ваала Валаам бачить край табору; сім жертовників і перше пророцтво: «Як я, царю, того зважусь клясти-проклинати, кого Бог сподобив ласки, Господь благодати?»"
      es: "Desde los altos de Baal Balaam ve el extremo del campamento; siete altares, y el primer oráculo: «¿Por qué maldeciré yo al que Dios no maldijo?»"
      pt: "Dos lugares altos de Baal, Balaão vê a extremidade do acampamento; sete altares, e o primeiro oráculo: “Como amaldiçoarei a quem Deus não amaldiçoou?”"
      de: "Von den Höhen Baals sieht Bileam das Ende des Lagers; sieben Altäre, und der erste Spruch: „Wie soll ich fluchen, dem Gott nicht flucht?“"
      fr: "Des hauts lieux de Baal, Balaam voit l’extrémité du camp ; sept autels, et le premier oracle : « Comment maudirais-je celui que Dieu n’a point maudit ? »"
      pl: "Z wyżyn Baala Balaam widzi skraj obozu; siedem ołtarzy i pierwsza wyrocznia: „Jakoż ja przeklinać mam, kogo Bóg nie przeklina?”"
      it: "Dalle alture di Baal Balaam vede l’estremità dell’accampamento; sette altari, e il primo oracolo: «Come farò a maledire? Iddio non l’ha maledetto»."
      nl: "Vanaf de hoogten van Baäl ziet Bileam het uiteinde van het kamp; zeven altaren, en de eerste godsspraak: “Wat zal ik vloeken, dien God niet vloekt?”"
      cs: "Z výšin Baalových vidí Bileám kraj tábora; sedm oltářů a první výrok: „Proč bych zlořečil, komuž Bůh silný nezlořečí?“"
      sv: "Från Baals höjder ser Bileam utkanten av lägret; sju altaren, och det första oraklet: ”Huru kan jag förbanna den gud ej förbannar?”"
      nb: "Fra Baals offerhauger ser Bileam enden av leiren; sju altere, og det første orakel: «Hvorledes skal jeg forbanne den Gud ikke forbanner?»"
      tl: "Mula sa matataas na dako ni Baal ay nakikita ni Balaam ang dulo ng kampo; pitong dambana, at ang unang pahayag: “Paanong aking susumpain ang hindi sinumpa ng Dios?”"
      da: "Fra Ba'als høje ser Bileam udkanten af lejren; syv altre og det første udsagn: »Hvorledes skal jeg forbande, da Gud ikke forbander ham?«"
      sr: "С висина Валових Валам види крај логора; седам жртвеника и прво пророштво: „Како бих клео оног кога не куне Бог?“"
      hu: "Baál magaslatairól Bálám a tábor szélét látja; hét oltár, és az első jövendölés: „Mit átkozzam azt, a kit Isten nem átkoz…”"
      fi: "Baalin korkeuksilta Bileam näkee leirin laidan; seitsemän alttaria ja ensimmäinen ennustus: ”Kuinka minä kiroaisin sen, jota ei Jumala kiroa…”"
      vi: "Từ các nơi cao của Ba-anh, Ba-la-am thấy một đầu trại quân; bảy bàn thờ, và lời sấm thứ nhất: “Kẻ mà Đức Chúa Trời không rủa sả, tôi sẽ rủa sả làm sao?”"
      ro: "De pe înălțimile lui Baal, Balaam vede marginea taberei; șapte altare și primul oracol: „Cum voiu blestemà pre cel ce nu-l blestemă Domnul?”"
      bg: "От Вааловите височини Валаам вижда края на стана; седем олтара и първото пророчество: „Как да прокълна когото Бог не проклева?“"
  - place: afd9259 # Pisgah
    ref: Num.23.13-Num.23.26
    note:
      en: "On the top of Pisgah, in the field of Zophim, the second oracle: God is not a man that He should lie; what He has blessed Balaam cannot reverse."
      ru: "На вершине Фасги, на месте стражей, второе слово: Бог не человек, чтобы Ему лгать; что Он благословил, того Валаам не может отменить."
      uk: "На вершині Фасги, на Цофімському полі, друге пророцтво: Бог не людина, щоб брехати; що Він поблагословив, того Валаам не може скасувати."
      es: "En la cumbre de Pisga, en el campo de Zofim, el segundo oráculo: Dios no es hombre para que mienta; lo que él ha bendecido, Balaam no puede revocarlo."
      pt: "No cume de Pisga, no campo de Zofim, o segundo oráculo: Deus não é homem para que minta; o que Ele abençoou, Balaão não pode reverter."
      de: "Auf dem Gipfel des Pisga, im Feld der Zofim, der zweite Spruch: Gott ist kein Mensch, dass er lüge; was er gesegnet hat, kann Bileam nicht umkehren."
      fr: "Au sommet du Pisga, dans le champ des Tsophim, le deuxième oracle : Dieu n’est point un homme pour mentir ; ce qu’il a béni, Balaam ne peut le révoquer."
      pl: "Na szczycie Pisgi, na polu Sofim, druga wyrocznia: Bóg nie jest człowiekiem, aby kłamał; tego, co On pobłogosławił, Balaam nie może odwrócić."
      it: "In cima al Pisga, nel campo di Zofim, il secondo oracolo: Dio non è un uomo, perché mentisca; ciò che Egli ha benedetto, Balaam non può revocarlo."
      nl: "Op de top van Pisga, op het veld van Zofim, de tweede godsspraak: God is geen mens dat Hij liegen zou; wat Hij gezegend heeft, kan Bileam niet ongedaan maken."
      cs: "Na vrcholu Pisgy, na poli Sófim, druhý výrok: Bůh není člověk, aby lhal; co požehnal, to Bileám nemůže obrátit."
      sv: "På Pisgas topp, på Sofims fält, det andra oraklet: ”Gud är icke en människa, så att han kan ljuga”; vad han har välsignat kan Bileam inte upphäva."
      nb: "På toppen av Pisga, på Sofims mark, det andre orakel: Gud er ikke et menneske som lyver; det han har velsignet, kan Bileam ikke omstøte."
      tl: "Sa taluktok ng Pisga, sa parang ng Sophim, ang ikalawang pahayag: ang Dios ay hindi tao na magsisinungaling; ang kaniyang pinagpala ay hindi na mababago ni Balaam."
      da: "På toppen af Pisga, på Sofims mark, det andet udsagn: Gud er ikke et menneske, så han skulle lyve; det, han har velsignet, kan Bileam ikke omstøde."
      sr: "На врху Фазге, у пољу Зофиму, друго пророштво: Бог није човек да слаже; што је благословио, Валам не може преокренути."
      hu: "A Piszga tetején, a Cófim mezején hangzik a második jövendölés: Isten nem ember, hogy hazudjék; amit megáldott, azt Bálám nem fordíthatja vissza."
      fi: "Pisgan huipulla, Sofimin kedolla, toinen ennustus: Jumala ei ole ihminen, joka valehtelisi; mitä hän on siunannut, sitä Bileam ei voi peruuttaa."
      vi: "Trên đỉnh Phích-ga, trong đồng Xô-phim, là lời sấm thứ hai: Đức Chúa Trời chẳng phải là người để nói dối; điều Ngài đã ban phước thì Ba-la-am không thể đổi lại."
      ro: "Pe vârful Pisga, în ținutul Țofim, al doilea oracol: Dumnezeu nu este om ca să mintă; ce a binecuvântat El, Balaam nu poate întoarce."
      bg: "На върха на Фасга, в полето Цофим, второто пророчество: Бог не е човек, за да лъже; каквото Той е благословил, Валаам не може да отмени."
  - place: a9ef72b # Peor
    ref: Num.23.27-Num.24.25
    note:
      en: 'From the top of Peor, looking toward Jeshimon, Balaam blesses the tents of Jacob and sees the far-off king: "there shall come a Star out of Jacob, and a Sceptre shall rise out of Israel". Then he returns to his place.'
      ru: "С вершины Фегора, обращённого к пустыне, Валаам благословляет шатры Иакова и видит грядущего царя: «Восходит звезда от Иакова и восстает жезл от Израиля». Затем он уходит обратно в своё место."
      uk: "З вершини Пеору, дивлячись на Єшимон, Валаам благословляє намети Якова й бачить далекого царя: «сходить зоря із Якова, здіймається берло з Ізраїля». Потім він повертається на своє місце."
      es: "Desde la cumbre de Peor, que mira hacia Jesimón, Balaam bendice las tiendas de Jacob y ve al rey lejano: «saldrá ESTRELLA de Jacob, y levantaráse cetro de Israel». Luego vuelve a su lugar."
      pt: "Do cume de Peor, olhando para Jesimom, Balaão abençoa as tendas de Jacó e vê o rei distante: “Uma estrela sairá de Jacó. Um cetro se levantará de Israel”. Depois volta para o seu lugar."
      de: "Vom Gipfel des Peor aus, mit Blick auf die Wüste Jeschimon, segnet Bileam die Zelte Jakobs und sieht den fernen König: „Es wird ein Stern aus Jakob aufgehen und ein Zepter aus Israel aufkommen“. Dann kehrt er an seinen Ort zurück."
      fr: "Du sommet du Peor, face à Jeschimon, Balaam bénit les tentes de Jacob et voit le roi lointain : « Un astre sort de Jacob, un sceptre s’élève d’Israël. » Puis il retourne chez lui."
      pl: "Ze szczytu Peor, patrząc ku Jeszimon, Balaam błogosławi namioty Jakuba i widzi dalekiego króla: „wynijdzie gwiazda z Jakuba i powstanie laska z Izraela”. Potem wraca na swoje miejsce."
      it: "Dalla cima del Peor, che guarda verso Iesimon, Balaam benedice le tende di Giacobbe e vede il re lontano: «un astro sorge da Giacobbe, e uno scettro s’eleva da Israele». Poi torna al suo luogo."
      nl: "Vanaf de top van Peor, uitkijkend naar Jesimon, zegent Bileam de tenten van Jakob en ziet de koning in de verte: “Er zal een ster voortkomen uit Jakob, en er zal een scepter uit Israël opkomen”. Dan keert hij terug naar zijn plaats."
      cs: "Z vrcholu Peóru, s pohledem k Ješimonu, žehná Bileám stanům Jákobovým a vidí vzdáleného krále: „Vyjdeť hvězda z Jákoba, a povstane berla z Izraele“. Potom se vrací na své místo."
      sv: "Från Peors topp, med blicken mot Jeshimon, välsignar Bileam Jakobs tält och ser den avlägsne konungen: ”En stjärna träder fram ur Jakob, och en spira höjer sig ur Israel.” Sedan vänder han tillbaka till sin plats."
      nb: "Fra toppen av Peor, med utsikt mot Jesjimon, velsigner Bileam Jakobs telt og ser den fjerne kongen: «en stjerne stiger op av Jakob, et spir løfter sig fra Israel». Så vender han tilbake til sitt hjemsted."
      tl: "Mula sa taluktok ng Peor, na nakatungo sa Jesimon, pinagpapala ni Balaam ang mga tolda ni Jacob at nakikita ang haring malayo pa: “Lalabas ang isang bituin sa Jacob, At may isang setro na lilitaw sa Israel”. Pagkatapos ay bumabalik siya sa kaniyang dako."
      da: "Fra Peors top, med udsyn mod Jesjimon, velsigner Bileam Jakobs telte og skuer den fjerne konge: »der opgaar en Stjerne af Jakob, og der hæver sig et Spir af Israel«. Derpå vender han tilbage til sit sted."
      sr: "С врха Фегора, гледајући према Гесимону, Валам благосиља шаторе Јаковљеве и види далеког цара: „изаћи ће звезда из Јакова и устаће палица из Израиља“. Затим се враћа на своје место."
      hu: "A Peór tetejéről, a Jesimón felé nézve Bálám megáldja Jákób sátrait, és meglátja a messzi királyt: „Csillag származik Jákóbból, és királyi pálcza támad Izráelből”. Azután visszatér a helyére."
      fi: "Peorin huipulta, Jesimonia kohti katsoen, Bileam siunaa Jaakobin majat ja näkee kaukaisen kuninkaan: ”Tähti nousee Jaakobista, ja valtikka kohoaa Israelista”. Sitten hän palaa paikkaansa."
      vi: "Từ đỉnh Phê-ô, nhìn về phía Giê-si-môn, Ba-la-am chúc phước cho các trại của Gia-cốp và thấy vị vua ở xa: “Một ngôi sao hiện ra từ Gia-cốp, Một cây phủ việt trồi lên từ Y-sơ-ra-ên”. Rồi người trở về chỗ mình."
      ro: "De pe vârful Peorului, privind spre Ieșimon, Balaam binecuvântează corturile lui Iacov și îl vede pe regele cel îndepărtat: „răsărì-va o stea din Iacov, și se va sculà un om din Israil”. Apoi se întoarce la locul său."
      bg: "От върха на Фегор, който гледа към Йесимон, Валаам благославя шатрите на Яков и вижда далечния цар: „Ще излезе звезда от Якова, И ще се въздигне скиптър от Израиля“. После се връща на мястото си."
  - place: af64fb3 # Shittim
    ref: Num.25.1-Num.25.9
    by: untold
    note:
      en: "At Shittim the people go after the daughters of Moab and join themselves to Baal-peor; a plague takes twenty-four thousand before Phinehas stays it."
      ru: "В Ситтиме народ блудодействует с дочерями Моава и прилепляется к Ваал-Фегору; поражение уносит двадцать четыре тысячи, пока Финеес не останавливает его."
      uk: "У Ситтімі народ іде за доньками Моаву й пристає до Ваал-Пеора; мор забирає двадцять чотири тисячі, поки Финеєс не зупиняє його."
      es: "En Sitim el pueblo se va tras las hijas de Moab y se une a Baal-peor; una plaga mata a veinticuatro mil antes de que Finees la detenga."
      pt: "Em Sitim o povo vai atrás das filhas de Moabe e se une a Baal-Peor; uma praga leva vinte e quatro mil antes que Finéias a detenha."
      de: "In Schittim laufen die Männer des Volkes den Töchtern Moabs nach und hängen sich an Baal-Peor; eine Plage rafft vierundzwanzigtausend dahin, bis Pinhas ihr Einhalt gebietet."
      fr: "À Sittim, le peuple se livre aux filles de Moab et s’attache à Baal-Peor ; une plaie en emporte vingt-quatre mille avant que Phinées l’arrête."
      pl: "W Szittim lud idzie za córkami Moabu i przyłącza się do Baal-Peor; zaraza zabiera dwadzieścia cztery tysiące, zanim Pinchas ją powstrzymuje."
      it: "A Sittim il popolo segue le figlie di Moab e si unisce a Baal-Peor; una piaga porta via ventiquattromila persone, finché Pincas la ferma."
      nl: "Te Sittim lopen de mensen de dochters van Moab achterna en verbinden zich aan Baäl-Peor; een plaag velt vierentwintigduizend voordat Pinechas die stuit."
      cs: "V Šitimu lid chodí za moábskými dcerami a přidává se k Báal-peórovi; mor vezme dvacet čtyři tisíce, než jej Pinchas zastaví."
      sv: "I Shittim går folket efter Moabs döttrar och binder sig vid Baal-Peor; en plåga tar tjugofyra tusen innan Pinechas hejdar den."
      nb: "I Sjittim løper folket etter Moabs døtre og slutter seg til Baal-Peor; en plage tar fire og tyve tusen før Pinhas stanser den."
      tl: "Sa Sittim, sinusundan ng bayan ang mga anak na babae ng Moab at nakikilakip sa Baal-peor; dalawang pu't apat na libo ang kinukuha ng salot bago ito pigilin ni Phinees."
      da: "I Sjittim følger folket efter Moabs døtre og slutter sig til Ba'al-Peor; en plage tager fireogtyve tusind, før Pinehas standser den."
      sr: "У Ситиму народ иде за кћерима моавским и приклања се Велфегору; помор односи двадесет и четири хиљаде пре него што га Финес заустави."
      hu: "Sittimben a nép Moáb leányai után megy, és Baál-Peórhoz csatlakozik; csapás sújt huszonnégyezer embert, mielőtt Fineás megállítja."
      fi: "Sittimissä kansa lähtee moabilaisten tyttärien perään ja liittyy Baal-Peoriin; vitsaus vie kaksikymmentäneljätuhatta, ennen kuin Pinehas pysäyttää sen."
      vi: "Tại Si-tim, dân sự đi theo các con gái Mô-áp và gắn mình với Ba-anh-Phê-ô; một tai vạ cất đi hai mươi bốn ngàn người cho đến khi Phi-nê-a chặn nó lại."
      ro: "La Sitim, poporul aleargă după fiicele Moabului și se alipește de Baal-Peor; o urgie ia douăzeci și patru de mii de oameni până ce Fineas o oprește."
      bg: "В Ситим народът тръгва след моавските дъщери и се прилепя към Ваал-Фегор; мор отнема двадесет и четири хиляди, преди Финеес да го спре."
  - place: acc6d8e # Midian
    ref: Num.31.1-Num.31.16
    by: untold
    note:
      en: 'Israel goes to war on Midian: five kings fall, and "Balaam also the son of Beor they slew with the sword". Moses says the trespass at Peor came "through the counsel of Balaam".'
      ru: "Израиль идёт войной на Мадиам: падают пять царей, и «Валаама, сына Веорова, убили мечом». Моисей говорит, что отступление в Фегоре было «по совету Валаамову»."
      uk: "Ізраїль іде війною на Мадіам: падають п’ять царів, і «Білеама Бейоренка вбили мечем». Мойсей каже, що гріх у Пеорі стався «по радї Білеама»."
      es: "Israel va a la guerra contra Madián: caen cinco reyes, y «á Balaam también, hijo de Beor, mataron á cuchillo». Moisés dice que la transgresión de Peor vino «por consejo de Balaam»."
      pt: "Israel faz guerra contra Midiã: cinco reis caem, e “também mataram Balaão, filho de Beor, à espada”. Moisés diz que a transgressão em Peor veio “por conselho de Balaão”."
      de: "Israel zieht gegen Midian in den Krieg: Fünf Könige fallen, und „Bileam, den Sohn Beors, erwürgten sie auch mit dem Schwert“. Mose sagt, die Verfehlung am Peor sei „durch Bileams Rat“ geschehen."
      fr: "Israël part en guerre contre Madian : cinq rois tombent, et « ils tuèrent aussi par l’épée Balaam, fils de Beor ». Moïse dit que la faute commise à Peor est venue « sur la parole de Balaam »."
      pl: "Izrael wyrusza na wojnę przeciw Madianowi: pada pięciu królów, a „Balaama, syna Beorowego, zabili mieczem”. Mojżesz mówi, że wykroczenie w Peor stało się „za radą Balaamową”."
      it: "Israele muove guerra a Madian: cadono cinque re, e «uccisero pure con la spada Balaam, figliuolo di Beor». Mosè dice che la colpa di Peor venne «a suggestione di Balaam»."
      nl: "Israël trekt ten strijde tegen Midian: vijf koningen vallen, en “ook doodden zij met het zwaard Bileam, den zoon van Beor”. Mozes zegt dat de overtreding bij Peor kwam “door den raad van Bileam”."
      cs: "Izrael táhne do války proti Midjánu: padne pět králů a „Baláma také, syna Beorova, zabili mečem“. Mojžíš říká, že provinění u Peóru přišlo „podlé rady Balámovy“."
      sv: "Israel drar i krig mot Midjan: fem kungar faller, och ”Bileam, Beors son, dräpte de ock med svärd”. Mose säger att överträdelsen vid Peor kom ”på Bileams inrådan”."
      nb: "Israel drar i krig mot Midjan: fem konger faller, og «også Bileam, Beors sønn, slo de ihjel med sverdet». Moses sier at synden ved Peor skjedde «på Bileams råd»."
      tl: "Nakikidigma ang Israel sa Midian: limang hari ang nabubuwal, at “si Balaam man na anak ni Beor ay kanilang pinatay ng tabak”. Sinasabi ni Moises na ang pagsalangsang sa Peor ay nangyari “sa payo ni Balaam”."
      da: "Israel drager i krig mod Midjan: fem konger falder, og »ogsaa sloge de Bileam, Beors Søn, ihjel med Sværdet«. Moses siger, at overtrædelsen ved Peor skete »paa Bileams Ord«."
      sr: "Израиљ иде у рат на Мадијам: пет царева пада, и „Валама сина Веоровог убише мачем“. Мојсије каже да је грех на Фегору дошао „по речи Валамовој“."
      hu: "Izráel hadba vonul Midián ellen: öt király esik el, és „Bálámot a Beór fiát is megölék fegyverrel”. Mózes szerint a peóri vétek „Bálám tanácsából” történt."
      fi: "Israel käy sotaan Midiania vastaan: viisi kuningasta kaatuu, ja ”Myös Bileamin, Beorin pojan, he surmasivat miekalla”. Mooses sanoo Peorin rikkomuksen tapahtuneen ”Bileamin neuvosta”."
      vi: "Y-sơ-ra-ên ra trận đánh Ma-đi-an: năm vua ngã xuống, và người ta “cũng lấy gươm giết Ba-la-am, con trai của Bê-ô”. Môi-se nói rằng tội ở Phê-ô xảy ra “theo mưu kế của Ba-la-am”."
      ro: "Israel pornește la război împotriva lui Madian: cad cinci regi, iar „pre Valaam feciorul lui Veor l-a omorît cu sabia”. Moise spune că păcatul de la Peor a venit „după cuvântul lui Valaam”."
      bg: "Израил воюва срещу Мадиам: падат пет царе, и „Валаама сина Веорова убиха с нож“. Мойсей казва, че прегрешението при Фегор е станало „по съвета на Валаама“."
