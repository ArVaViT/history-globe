    note:
      en: "«To Carthage I came, where a cauldron of unholy loves bubbled up all around me.» Here he studies rhetoric, and here he falls in with the Manichaeans."
      ru: "«Я прибыл в Карфаген; кругом меня котлом кипела позорная любовь». Здесь он учится риторике и здесь же попадает к манихеям."
      uk: "«Я прибув до Карфагена, де довкола мене кипів казан нечестивих любощів». Тут він вивчає риторику і тут сходиться з маніхеями."
      es: "«Vine a Cartago, y por todas partes bullía en torno mío una caldera de amores impuros». Allí estudia retórica, y allí se junta con los maniqueos."
      pt: "“Cheguei a Cartago, onde por toda parte, ao meu redor, borbulhava um caldeirão de amores profanos.” Ali ele estuda retórica, e ali se junta aos maniqueus."
      de: "„Nach Karthago kam ich, wo rings um mich ein Kessel unheiliger Liebschaften brodelte.“ Hier studiert er Rhetorik, und hier gerät er unter die Manichäer."
      fr: "« Je vins à Carthage, où bouillonnait autour de moi un chaudron d’amours impies. » Il y étudie la rhétorique, et c’est là qu’il se lie aux manichéens."
      pl: "„Przybyłem do Kartaginy, a wokół mnie kipiał kocioł nieczystych miłości.” Tu studiuje retorykę i tu przystaje do manichejczyków."
      it: "«Venni a Cartagine, e tutt’intorno a me ribolliva una caldaia di amori impuri.» Qui studia retorica, e qui si lega ai manichei."
      nl: "“Naar Carthago kwam ik, waar rondom mij een ketel van onheilige liefdes opborrelde.” Hier studeert hij retorica, en hier raakt hij betrokken bij de manicheeën."
      cs: "„Přišel jsem do Kartága, kde se všude kolem mne vařil kotel nesvatých lásek.“ Studuje zde rétoriku a zde se dostává mezi manichejce."
      sv: "”Till Kartago kom jag, där en kittel av ohelig kärlek sjöd runt omkring mig.” Här studerar han retorik, och här hamnar han bland manikeerna."
      nb: "«Til Kartago kom jeg, og rundt meg boblet en gryte av vanhellig kjærlighet.» Her studerer han retorikk, og her havner han blant manikeerne."
      tl: "“Dumating ako sa Cartago, kung saan ang isang kaldero ng mga di-banal na pag-ibig ay bumubula sa paligid ko.” Dito siya nag-aaral ng retorika, at dito siya napapasama sa mga Manikeo."
      da: "»Til Karthago kom jeg, hvor en kedel af vanhellig elskov sydede rundt om mig.« Her studerer han retorik, og her havner han blandt manikæerne."
      sr: "„Дођох у Картагину, где је свуда око мене кључао котао нечистих љубави.“ Овде учи реторику и овде се здружује с манихејцима."
      hu: "„Karthágóba érkeztem, ahol a szentségtelen szerelmek üstje fortyogott körülöttem.” Itt retorikát tanul, és itt kerül a manicheusok közé."
      fi: "”Karthagoon minä tulin, ja siellä kaikkialla ympärilläni kuohui jumalattomien rakkauksien pata.” Täällä hän opiskelee retoriikkaa, ja täällä hän ajautuu manikeolaisten seuraan."
      vi: "“Tôi đến Carthage, nơi một vạc những tình yêu ô uế sôi sục quanh tôi.” Tại đây ông học hùng biện, và tại đây ông kết giao với phái Mani."
      ro: "„Am venit la Cartagina, unde un cazan de iubiri nesfinte fierbea de jur împrejurul meu.” Aici studiază retorica și aici intră în cercul maniheilor."
      bg: "„Дойдох в Картаген, където край мен от всички страни кипеше котел от нечисти любови.“ Тук той учи риторика и тук се сближава с манихеите."
