    note:
      en: "In his sixteenth year he is home again from school at Madaura. His father, «but a poor freeman of Thagaste», pays for him to go on to Carthage, more by resolve than by means."
      ru: "На шестнадцатом году он снова дома после учёбы в Мадавре. Его отец, который «был в Тагасте человеком довольно бедным», скорее честолюбием, чем средствами, собирает деньги, чтобы послать его дальше, в Карфаген."
      uk: "На шістнадцятому році життя він знову вдома після навчання в Мадаврі. Батько, «лише бідний громадянин Тагасту», платить за те, щоб він їхав далі, до Карфагена, і то більше завдяки рішучості, ніж статкам."
      es: "En su decimosexto año vuelve a casa desde la escuela de Madaura. Su padre, «no más que un pobre hombre libre de Tagaste», corre con los gastos para que siga a Cartago, más por empeño que por recursos."
      pt: "No seu décimo sexto ano de vida, ele está de novo em casa, de volta da escola de Madaura. O pai, “apenas um pobre cidadão livre de Tagaste”, paga para que ele siga até Cartago, mais por determinação do que por recursos."
      de: "Im sechzehnten Lebensjahr ist er nach der Schule in Madaura wieder zu Hause. Sein Vater, „nur ein armer Bürger von Thagaste“, bringt das Geld auf, damit er nach Karthago weiterziehen kann, mehr aus Entschlossenheit als aus Vermögen."
      fr: "Dans sa seizième année, il est de retour chez lui après ses études à Madaure. Son père, « rien qu’un pauvre homme libre de Thagaste », lui paie la suite de ses études à Carthage, plus par volonté que grâce à ses moyens."
      pl: "W szesnastym roku życia jest znów w domu po nauce w Madaurze. Jego ojciec, „zaledwie ubogi obywatel Tagaste”, łoży na jego dalszą naukę w Kartaginie, bardziej z determinacji niż z zamożności."
      it: "Nel suo sedicesimo anno è di nuovo a casa dopo gli studi a Madaura. Suo padre, «solo un povero cittadino libero di Tagaste», gli paga il proseguimento degli studi a Cartagine, più con la determinazione che con i mezzi."
      nl: "In zijn zestiende jaar is hij terug van school in Madaura en weer thuis. Zijn vader, “slechts een arme burger van Thagaste”, betaalt ervoor dat hij verder kan studeren in Carthago, meer uit vastberadenheid dan uit vermogen."
      cs: "V šestnáctém roce života je zase doma po studiu v Madauře. Otec, „jen chudý měšťan z Thagasty“, mu platí další studium v Kartágu, spíš z odhodlání než z dostatku prostředků."
      sv: "På sitt sextonde år är han hemma igen efter skolan i Madaura. Fadern, ”en fattig fri man i Thagaste”, bekostar hans fortsatta studier i Kartago, mer av beslutsamhet än av tillgångar."
      nb: "I sitt sekstende år er han tilbake hjemme fra skolen i Madaura. Faren, «bare en fattig fri borger i Tagaste», betaler for at han kan dra videre til Kartago, mer av vilje enn av evne."
      tl: "Sa kaniyang ikalabing-anim na taon ay nakauwi siyang muli mula sa pag-aaral sa Madaura. Ang kaniyang ama, “isang hamak na malayang tao lamang sa Thagaste”, ang nagbabayad upang makapagpatuloy siya sa Cartago, higit dahil sa matibay na pasya kaysa sa kaya ng kaniyang kabuhayan."
      da: "I sit sekstende år er han hjemme igen fra skolen i Madaura. Hans far, »kun en fattig fri borger i Thagaste«, betaler for, at han kan rejse videre til Karthago, mere af beslutsomhed end af velstand."
      sr: "У шеснаестој години поново је код куће, по повратку из школе у Мадаури. Отац, „тек сиромашан грађанин Тагасте“, плаћа му даље школовање у Картагини, више из решености него из могућности."
      hu: "Tizenhatodik évében újra otthon van, a madaurai iskolából hazatérve. Apja, „csupán szegény thagastei szabad polgár”, inkább elszántságból, mint tehetősségből fizeti, hogy Karthágóban tanulhasson tovább."
      fi: "Kuudentenatoista ikävuotenaan hän on taas kotona Madauran koulusta. Hänen isänsä, ”vain köyhä Thagasten vapaa mies”, kustantaa hänen jatko-opintonsa Karthagossa, pikemmin päättäväisyydellä kuin varoilla."
      vi: "Vào năm mười sáu tuổi, ông lại về nhà sau khi học ở Madaura. Cha ông, “chỉ là một người tự do nghèo ở Thagaste”, chu cấp cho ông học tiếp ở Carthage, bằng quyết tâm nhiều hơn là bằng của cải."
      ro: "În al șaisprezecelea an al vieții se întoarce acasă de la școala din Madaura. Tatăl său, „doar un om liber sărac din Thagaste”, îi plătește studiile mai departe la Cartagina, mai mult din hotărâre decât din mijloace."
      bg: "В шестнадесетата си година той е отново у дома след училището в Мадавра. Баща му, „само беден свободен човек от Тагасте“, плаща, за да продължи той в Картаген, по-скоро с решителност, отколкото със средства."
