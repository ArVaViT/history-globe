    note:
      en: "He is persuaded to go to Rome and teach there what he had taught at Carthage. His mother laments it in vain."
      ru: "Его уговаривают ехать в Рим и преподавать там то же, что он преподавал в Карфагене. Мать тщетно оплакивает его отъезд."
      uk: "Його вмовляють поїхати до Рима й викладати там те, що він викладав у Карфагені. Мати марно оплакує його від’їзд."
      es: "Lo convencen de ir a Roma y enseñar allí lo que había enseñado en Cartago. Su madre lo lamenta en vano."
      pt: "Convencem-no a ir a Roma e ensinar ali o que ensinara em Cartago. A mãe lamenta isso em vão."
      de: "Man überredet ihn, nach Rom zu gehen und dort zu lehren, was er in Karthago gelehrt hatte. Seine Mutter beklagt es vergeblich."
      fr: "On le persuade d’aller à Rome y enseigner ce qu’il avait enseigné à Carthage. Sa mère s’en lamente en vain."
      pl: "Daje się namówić na wyjazd do Rzymu, by nauczać tam tego, czego nauczał w Kartaginie. Matka na próżno nad tym rozpacza."
      it: "Viene persuaso ad andare a Roma e a insegnare là ciò che aveva insegnato a Cartagine. Sua madre se ne duole invano."
      nl: "Men haalt hem over om naar Rome te gaan en daar te onderwijzen wat hij in Carthago had onderwezen. Zijn moeder beklaagt het tevergeefs."
      cs: "Je přemluven, aby odešel do Říma a učil tam to, co učil v Kartágu. Matka nad tím marně naříká."
      sv: "Han övertalas att resa till Rom och undervisa där i det han hade undervisat i Kartago. Hans mor klagar förgäves över det."
      nb: "Han blir overtalt til å dra til Roma og undervise der i det samme som han hadde lært bort i Kartago. Moren sørger over det forgjeves."
      tl: "Hinihikayat siyang pumunta sa Roma at doon ituro ang itinuro niya sa Cartago. Walang saysay ang pananaghoy ng kaniyang ina rito."
      da: "Han lader sig overtale til at rejse til Rom og undervise dér i det, han havde undervist i i Karthago. Hans mor begræder det forgæves."
      sr: "Наговарају га да оде у Рим и тамо предаје оно што је предавао у Картагини. Мајка због тога узалуд јадикује."
      hu: "Rábeszélik, hogy menjen Rómába, és tanítsa ott, amit Karthágóban tanított. Anyja hiába siratja."
      fi: "Hänet taivutetaan lähtemään Roomaan opettamaan siellä sitä, mitä hän oli opettanut Karthagossa. Hänen äitinsä valittaa sitä turhaan."
      vi: "Ông được thuyết phục đến Rô-ma dạy ở đó điều ông đã dạy ở Carthage. Mẹ ông than khóc vì chuyện ấy, nhưng vô ích."
      ro: "Este convins să meargă la Roma și să predea acolo ceea ce predase la Cartagina. Mama lui îi deplânge în zadar plecarea."
      bg: "Убеждават го да отиде в Рим и да преподава там онова, което е преподавал в Картаген. Майка му напразно скърби за това."
