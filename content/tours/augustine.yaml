# Augustine, from Thagaste to Hippo, as he tells it in the Confessions and in his letter to
# Valerius after his ordination. The years are the usual ones, from his own count of his
# age (he was born in 354): Carthage in his seventeenth year, Rome 383, Milan 384, the
# garden 386, Ostia 387, Hippo 391 (the letter does not name the city; his ordination
# there is in Possidius, Life of Augustine 4). Each stop links the free translation of the
# Nicene and Post-Nicene Fathers (public domain) at New Advent; its page holds the whole
# book, and the cite gives the chapter (Milan's links Book VIII, the garden). Not one way
# travelled: no time on foot. English and Russian first; the other languages wait for the
# translation pass (docs/translation-debt.md).
