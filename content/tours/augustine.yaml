    note:
      en: "Milan asks Rome for a teacher of rhetoric, and he is sent: «to Milan I came, unto Ambrose the bishop». Two years later, weeping in a garden, he hears a child's voice from a neighbouring house: «Take up and read.»"
      ru: "Милан просит у Рима учителя риторики, и посылают его: «Я приехал в Медиолан к епископу Амвросию». Через два года, плача в саду, он слышит из соседнего дома детский голос: «Возьми, читай!»"
      uk: "Мілан просить Рим прислати вчителя риторики, і посилають його: «до Мілана я прибув, до єпископа Амвросія». Через два роки, плачучи в саду, він чує з сусіднього будинку голос дитини: «Візьми й читай»."
      es: "Milán pide a Roma un maestro de retórica, y lo envían a él: «vine a Milán, al obispo Ambrosio». Dos años después, llorando en un jardín, oye la voz de un niño desde una casa vecina: «Toma y lee»."
      pt: "Milão pede a Roma um mestre de retórica, e ele é enviado: “cheguei a Milão, a Ambrósio, o bispo”. Dois anos depois, chorando num jardim, ouve de uma casa vizinha a voz de uma criança: “Toma e lê.”"
      de: "Mailand bittet Rom um einen Lehrer der Rhetorik, und er wird geschickt: „nach Mailand kam ich, zu Ambrosius, dem Bischof“. Zwei Jahre später hört er, weinend in einem Garten, aus einem Nachbarhaus die Stimme eines Kindes: „Nimm und lies.“"
      fr: "Milan demande à Rome un maître de rhétorique, et il y est envoyé : « je vins à Milan, auprès d’Ambroise, l’évêque ». Deux ans plus tard, pleurant dans un jardin, il entend la voix d’un enfant dans une maison voisine : « Prends et lis. »"
      pl: "Mediolan prosi Rzym o nauczyciela retoryki i posyłają tam właśnie jego: „przybyłem do Mediolanu, do biskupa Ambrożego”. Dwa lata później, płacząc w ogrodzie, słyszy z sąsiedniego domu głos dziecka: „Weź i czytaj.”"
      it: "Milano chiede a Roma un maestro di retorica, ed egli viene mandato: «venni a Milano, dal vescovo Ambrogio». Due anni dopo, piangendo in un giardino, sente la voce di un bambino da una casa vicina: «Prendi e leggi.»"
      nl: "Milaan vraagt Rome om een leraar retorica, en hij wordt gestuurd: “naar Milaan kwam ik, tot Ambrosius, de bisschop”. Twee jaar later hoort hij, huilend in een tuin, de stem van een kind uit een naburig huis: “Neem en lees.”"
      cs: "Milán žádá Řím o učitele rétoriky a on je poslán: „do Milána jsem přišel k biskupu Ambrožovi“. O dva roky později, když pláče v zahradě, uslyší ze sousedního domu dětský hlas: „Vezmi a čti.“"
      sv: "Milano ber Rom om en lärare i retorik, och han sänds: ”till Milano kom jag, till biskop Ambrosius”. Två år senare hör han, gråtande i en trädgård, en barnröst från ett grannhus: ”Tag och läs.”"
      nb: "Milano ber Roma om en lærer i retorikk, og han blir sendt: «til Milano kom jeg, til biskop Ambrosius». To år senere, gråtende i en hage, hører han en barnestemme fra et nabohus: «Ta og les.»"
      tl: "Humihingi ang Milan sa Roma ng isang guro ng retorika, at siya ang ipinadadala: “sa Milan ako dumating, kay Ambrosio na obispo”. Makalipas ang dalawang taon, habang umiiyak sa isang halamanan, naririnig niya ang tinig ng isang bata mula sa kalapit na bahay: “Kunin mo at basahin.”"
      da: "Milano beder Rom om en lærer i retorik, og han bliver sendt: »til Milano kom jeg, til biskop Ambrosius«. To år senere hører han grædende i en have et barns stemme fra et nabohus: »Tag og læs.«"
      sr: "Милано тражи од Рима учитеља реторике и шаљу њега: „у Милано дођох, к Амвросију епископу“. Две године касније, плачући у врту, чује из суседне куће дечји глас: „Узми и читај.“"
      hu: "Milánó retorikatanárt kér Rómától, és őt küldik: „Milánóba jöttem Ambrosius püspökhöz”. Két évvel később egy kertben sírva egy gyermek hangját hallja a szomszéd házból: „Vedd és olvasd.”"
      fi: "Milano pyytää Roomasta retoriikan opettajaa, ja hänet lähetetään: ”Milanoon minä tulin, piispa Ambrosiuksen luo”. Kaksi vuotta myöhemmin hän itkee puutarhassa ja kuulee naapuritalosta lapsen äänen: ”Ota ja lue.”"
      vi: "Milan xin Rô-ma một thầy dạy hùng biện, và ông được cử đi: “tôi đến Milan, đến với Ambrose, vị giám mục”. Hai năm sau, đang khóc trong một khu vườn, ông nghe tiếng một đứa trẻ từ ngôi nhà bên cạnh: “Hãy cầm lên mà đọc.”"
      ro: "Milanul cere Romei un profesor de retorică, iar el este trimis: „am venit la Milan, la episcopul Ambrozie”. Doi ani mai târziu, plângând într-o grădină, aude glasul unui copil dintr-o casă vecină: „Ia și citește.”"
      bg: "Милано иска от Рим учител по риторика и той е изпратен: „в Милано дойдох при епископ Амвросий“. Две години по-късно, плачейки в една градина, чува детски глас от съседна къща: „Вземи и чети.“"
  - place: "422995" # Ostia
    year: "AD 387"
    source:
      cite:
        en: "Augustine, Confessions 9.8, 9.10-11"
        ru: "Августин, Исповедь 9.8, 9.10-11"
        uk: "Августин, Сповідь 9.8, 9.10-11"
        es: "Agustín, Confesiones 9.8, 9.10-11"
        pt: "Agostinho, Confissões 9.8, 9.10-11"
        de: "Augustinus, Bekenntnisse 9.8, 9.10-11"
        fr: "Augustin, Confessions 9.8, 9.10-11"
        pl: "Augustyn, Wyznania 9.8, 9.10-11"
        it: "Agostino, Confessioni 9.8, 9.10-11"
        nl: "Augustinus, Belijdenissen 9.8, 9.10-11"
        cs: "Augustin, Vyznání 9.8, 9.10-11"
        sv: "Augustinus, Bekännelser 9.8, 9.10-11"
        nb: "Augustin, Bekjennelser 9.8, 9.10-11"
        tl: "Agustin, Mga Pagtatapat 9.8, 9.10-11"
        da: "Augustin, Bekendelser 9.8, 9.10-11"
        sr: "Августин, Исповести 9.8, 9.10-11"
        hu: "Augustinus, Vallomások 9.8, 9.10-11"
        fi: "Augustinus, Tunnustukset 9.8, 9.10-11"
        vi: "Augustine, Tự thú 9.8, 9.10-11"
        ro: "Augustin, Confesiuni 9.8, 9.10-11"
        bg: "Августин, Изповеди 9.8, 9.10-11"
      url: "https://www.newadvent.org/fathers/110109.htm"
    note:
      en: "On their way back to Africa, he and his mother rest at Ostia before the voyage. Leaning at a window over the garden of the house, they talk alone of the life to come; there, at Ostia, Monica dies."
      ru: "На пути обратно в Африку он и мать отдыхают в Остии перед плаванием. Опершись на окно, выходящее в сад дома, они беседуют наедине о будущей жизни; там, в Остии, Моника умирает."
      uk: "Дорогою назад до Африки він із матір’ю відпочиває в Остії перед плаванням. Спершись на вікно над садом будинку, вони наодинці розмовляють про майбутнє життя; саме там, в Остії, помирає Моніка."
      es: "De regreso a África, él y su madre descansan en Ostia antes de la travesía. Apoyados en una ventana que da al jardín de la casa, hablan a solas de la vida venidera; allí, en Ostia, muere Mónica."
      pt: "No caminho de volta à África, ele e a mãe descansam em Óstia antes da travessia. Debruçados numa janela sobre o jardim da casa, conversam a sós sobre a vida futura; ali, em Óstia, Mônica morre."
      de: "Auf der Rückreise nach Afrika rasten er und seine Mutter vor der Überfahrt in Ostia. An ein Fenster gelehnt, das auf den Garten des Hauses hinausgeht, sprechen sie allein miteinander über das künftige Leben; dort in Ostia stirbt Monika."
      fr: "Sur le chemin du retour en Afrique, lui et sa mère font halte à Ostie avant la traversée. Accoudés à une fenêtre qui donne sur le jardin de la maison, ils s’entretiennent seuls de la vie à venir ; c’est là, à Ostie, que meurt Monique."
      pl: "W drodze powrotnej do Afryki on i jego matka odpoczywają w Ostii przed podróżą morską. Oparci o okno nad ogrodem domu rozmawiają sam na sam o życiu przyszłym; tam, w Ostii, umiera Monika."
      it: "Sulla via del ritorno in Africa, lui e sua madre sostano a Ostia prima della traversata. Appoggiati a una finestra sul giardino della casa, parlano da soli della vita futura; là, a Ostia, Monica muore."
      nl: "Op de terugweg naar Afrika rusten hij en zijn moeder in Ostia uit voor de overtocht. Leunend in een venster dat uitziet op de tuin van het huis, spreken zij onder vier ogen over het komende leven; daar, in Ostia, sterft Monica."
      cs: "Na zpáteční cestě do Afriky odpočívají s matkou před plavbou v Ostii. Opřeni o okno nad zahradou domu rozmlouvají o samotě o životě budoucím; tam, v Ostii, Monika umírá."
      sv: "På hemvägen till Afrika vilar han och hans mor i Ostia före sjöresan. Lutade mot ett fönster som vetter mot husets trädgård talar de i enrum om det kommande livet; där, i Ostia, dör Monika."
      nb: "På vei tilbake til Afrika hviler han og moren i Ostia før sjøreisen. Lent mot et vindu ut mot hagen til huset snakker de alene om det kommende livet; der, i Ostia, dør Monika."
      tl: "Pabalik sa Africa, nagpapahinga sila ng kaniyang ina sa Ostia bago ang paglalayag. Nakasandal sa isang bintana sa ibabaw ng halamanan ng bahay, silang dalawa lamang ang nag-uusap tungkol sa buhay na darating; doon, sa Ostia, namamatay si Monica."
      da: "På vej tilbage til Afrika hviler han og hans mor sig i Ostia før overfarten. Lænet op ad et vindue med udsigt over husets have taler de alene sammen om det kommende liv; dér i Ostia dør Monika."
      sr: "На повратку у Африку он и мајка одмарају се у Остији пре пловидбе. Наслоњени на прозор над вртом куће, насамо разговарају о животу који долази; ту, у Остији, умире Моника."
      hu: "Afrikába visszatérőben anyjával együtt Ostiában pihen a tengeri út előtt. A ház kertjére néző ablaknál támaszkodva kettesben beszélgetnek az eljövendő életről; ott, Ostiában hal meg Mónika."
      fi: "Paluumatkalla Afrikkaan hän ja hänen äitinsä lepäävät Ostiassa ennen merimatkaa. Talon puutarhan puolella olevaan ikkunaan nojaten he keskustelevat kahden kesken tulevasta elämästä; siellä, Ostiassa, Monika kuolee."
      vi: "Trên đường trở về Africa, ông và mẹ nghỉ lại ở Ostia trước chuyến vượt biển. Tựa bên cửa sổ nhìn xuống vườn của ngôi nhà, hai mẹ con trò chuyện riêng với nhau về đời sống mai sau; tại đó, ở Ostia, Monica qua đời."
      ro: "Pe drumul de întoarcere în Africa, el și mama lui se odihnesc la Ostia înainte de călătoria pe mare. Sprijiniți la o fereastră care dă spre grădina casei, vorbesc numai ei doi despre viața viitoare; acolo, la Ostia, Monica moare."
      bg: "На път обратно за Африка той и майка му си почиват в Остия преди плаването. Облегнати на прозореца над градината на къщата, те разговарят насаме за бъдещия живот; там, в Остия, Моника умира."
  - place: "305090" # Hippo Regius
    year: "AD 391"
    source:
      cite:
        en: "Augustine, Letter 21"
        ru: "Августин, Письмо 21"
        uk: "Августин, Лист 21"
        es: "Agustín, Carta 21"
        pt: "Agostinho, Carta 21"
        de: "Augustinus, Brief 21"
        fr: "Augustin, Lettre 21"
        pl: "Augustyn, List 21"
        it: "Agostino, Lettera 21"
        nl: "Augustinus, Brief 21"
        cs: "Augustin, List 21"
        sv: "Augustinus, Brev 21"
        nb: "Augustin, Brev 21"
        tl: "Agustin, Liham 21"
        da: "Augustin, Brev 21"
        sr: "Августин, Писмо 21"
        hu: "Augustinus, Levelek 21"
        fi: "Augustinus, Kirje 21"
        vi: "Augustine, Thư 21"
        ro: "Augustin, Scrisoarea 21"
        bg: "Августин, Писмо 21"
      url: "https://www.newadvent.org/fathers/1102021.htm"
    note:
      en: "Ordained presbyter to help bishop Valerius, he writes asking for time till Easter to study the Scriptures: he has had to take «the second place at the helm» before he knew how to handle an oar."
      ru: "Рукоположенный в пресвитеры в помощь епископу Валерию, он просит у него времени до Пасхи, чтобы изучать Писание: ему пришлось занять «второе место у руля», когда он ещё не умел держать весло."
      uk: "Висвячений на пресвітера, щоб допомагати єпископові Валерію, він пише з проханням дати йому час до Великодня для вивчення Писань: йому довелося посісти «друге місце при кермі», коли він ще не вмів поводитися з веслом."
      es: "Ordenado presbítero para ayudar al obispo Valerio, le escribe pidiendo tiempo hasta la Pascua para estudiar las Escrituras: ha tenido que ocupar «el segundo puesto al timón» antes de saber manejar un remo."
      pt: "Ordenado presbítero para auxiliar o bispo Valério, escreve pedindo tempo até a Páscoa para estudar as Escrituras: teve de assumir “o segundo lugar ao leme” antes de saber manejar um remo."
      de: "Zum Presbyter geweiht, um Bischof Valerius zu helfen, schreibt er ihm und bittet um Zeit bis Ostern, um die Schrift zu studieren: Er hat „den zweiten Platz am Steuer“ einnehmen müssen, ehe er mit dem Ruder umzugehen wusste."
      fr: "Ordonné prêtre pour assister l’évêque Valère, il écrit pour demander un délai jusqu’à Pâques afin d’étudier les Écritures : il a dû prendre « la seconde place à la barre » avant de savoir manier la rame."
      pl: "Wyświęcony na prezbitera, by pomagać biskupowi Waleriuszowi, pisze z prośbą o czas do Wielkanocy na studiowanie Pisma: musiał objąć „drugie miejsce przy sterze”, zanim nauczył się władać wiosłem."
      it: "Ordinato presbitero per aiutare il vescovo Valerio, scrive chiedendo tempo fino a Pasqua per studiare le Scritture: ha dovuto prendere «il secondo posto al timone» prima di saper maneggiare un remo."
      nl: "Tot presbyter gewijd om bisschop Valerius te helpen, vraagt hij schriftelijk om tijd tot Pasen om de Schriften te bestuderen: hij heeft “de tweede plaats aan het roer” moeten innemen voordat hij wist hoe men een riem hanteert."
      cs: "Vysvěcen na presbytera, aby pomáhal biskupu Valeriovi, žádá dopisem o čas do Velikonoc ke studiu Písma: musel zaujmout „druhé místo u kormidla“, dřív než se naučil zacházet s veslem."
      sv: "Vigd till presbyter för att bistå biskop Valerius skriver han och ber om tid fram till påsk för att studera Skrifterna: han har tvingats ta ”andra platsen vid rodret” innan han kunde hantera en åra."
      nb: "Ordinert til presbyter for å hjelpe biskop Valerius, skriver han og ber om tid til påske for å studere Skriftene: han har måttet ta «annenplassen ved roret» før han visste hvordan han skulle håndtere en åre."
      tl: "Inordenahang presbitero upang tulungan ang obispong si Valerio, sumusulat siya upang humingi ng panahon hanggang Pasko ng Pagkabuhay para pag-aralan ang mga Kasulatan: kinailangan niyang kunin ang “ikalawang puwesto sa timon” bago pa man niya natutuhang humawak ng sagwan."
      da: "Ordineret til presbyter for at hjælpe biskop Valerius skriver han og beder om tid indtil påske til at studere Skrifterne: han har måttet overtage »den anden plads ved roret«, før han vidste, hvordan man fører en åre."
      sr: "Рукоположен за презвитера да помаже епископу Валерију, пише му и моли за време до Ускрса да проучава Писмо: морао је да заузме „друго место за кормилом“ пре него што је знао да рукује веслом."
      hu: "Valerius püspök segítőjéül presbiterré szentelik, és levélben húsvétig kér időt a Szentírás tanulmányozására: „a második helyet a kormánynál” kellett elfoglalnia, mielőtt tudta volna, hogyan kell bánni az evezővel."
      fi: "Presbyteeriksi vihittynä auttamaan piispa Valeriusta hän kirjoittaa ja pyytää aikaa pääsiäiseen asti Raamatun opiskeluun: hänen on täytynyt ottaa ”toinen paikka ruorin ääressä” ennen kuin hän osasi käsitellä airoa."
      vi: "Được phong làm trưởng lão để giúp giám mục Valerius, ông viết xin thời gian đến lễ Phục Sinh để nghiên cứu Kinh Thánh: ông đã phải đảm nhận “vị trí thứ hai ở bánh lái” trước khi biết cầm mái chèo."
      ro: "Hirotonit presbiter ca să-l ajute pe episcopul Valeriu, îi scrie cerându-i răgaz până la Paști pentru a studia Scripturile: a trebuit să ocupe „locul al doilea la cârmă” înainte de a ști să țină o vâslă."
      bg: "Ръкоположен за презвитер, за да помага на епископ Валерий, той пише с молба за време до Великден, за да изучи Писанията: наложило му се е да заеме „второто място при кормилото“, преди да е умеел да държи веслото."
