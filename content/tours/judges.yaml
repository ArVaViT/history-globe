# Three judges: Deborah, Gideon and Samson, Judges 4-16, in the order of the text. The
# tour's year (1150 BC) is a conventional point for the map: the period of the judges
# cannot be dated stop by stop, and its chronology is disputed.
id: judges
title:
  en: "Deborah, Gideon, Samson"
  ru: "Девора, Гедеон, Самсон"
  uk: "Дебора, Гедеон, Самсон"
  es: "Débora, Gedeón, Sansón"
  pt: "Débora, Gideão, Sansão"
  de: "Debora, Gideon, Simson"
  fr: "Débora, Gédéon, Samson"
  pl: "Debora, Gedeon, Samson"
  it: "Debora, Gedeone, Sansone"
  nl: "Debora, Gideon, Simson"
  cs: "Debora, Gedeon, Samson"
  sv: "Debora, Gideon, Simson"
  nb: "Debora, Gideon, Samson"
  tl: "Debora, Gedeon, Samson"
  da: "Debora, Gideon, Samson"
  sr: "Девора, Гедеон, Самсон"
  hu: "Debóra, Gedeon, Sámson"
  fi: "Debora, Gideon, Simson"
  vi: "Đê-bô-ra, Ghê-đê-ôn, Sam-sôn"
  ro: "Debora, Ghedeon, Samson"
  bg: "Девора, Гедеон, Самсон"
year: "1150 BC"
approximate: true
stops:
  - place: a6d57ed # Ramah
    ref: Judg.4.4-Judg.4.5
    note:
      en: "Deborah judges Israel under her palm tree between Ramah and Bethel."
      ru: "Девора судит Израиль под пальмою Девориною между Рамою и Вефилем."
      uk: "Дебора судить Ізраїль під своєю пальмою між Рамою і Бет-Елом."
      es: "Débora juzga a Israel bajo su palmera, entre Ramá y Betel."
      pt: "Débora julga Israel debaixo da sua palmeira, entre Ramá e Betel."
      de: "Debora richtet Israel unter ihrer Palme zwischen Rama und Bethel."
      fr: "Débora juge Israël sous son palmier, entre Rama et Béthel."
      pl: "Debora sądzi Izraela pod swoją palmą między Ramą a Betel."
      it: "Debora giudica Israele sotto la sua palma tra Rama e Betel."
      nl: "Debora is rechter over Israël onder haar palmboom tussen Rama en Bethel."
      cs: "Debora soudí Izrael pod svou palmou mezi Rámou a Bét-elem."
      sv: "Debora dömer Israel under sin palm mellan Rama och Betel."
      nb: "Debora dømmer Israel under sin palme mellom Rama og Betel."
      tl: "Humahatol si Debora sa Israel sa ilalim ng kaniyang puno ng palma sa pagitan ng Rama at Beth-el."
      da: "Debora dømmer Israel under sin palme mellem Rama og Betel."
      sr: "Девора суди Израиљу под својом палмом између Раме и Ветиља."
      hu: "Debóra pálmafája alatt ítélkezik Izráelben Ráma és Bétel között."
      fi: "Debora tuomitsee Israelia palmunsa alla Raman ja Betelin välillä."
      vi: "Đê-bô-ra xét đoán Y-sơ-ra-ên dưới cây chà là của bà giữa Ra-ma và Bê-tên."
      ro: "Debora judecă Israelul sub finicul ei, între Rama și Betel."
      bg: "Девора съди Израил под своята палма между Рама и Ветил."
  - place: acd63ee # Mount Tabor
    ref: Judg.4.12-Judg.4.16
    note:
      en: "Barak comes down from Mount Tabor with ten thousand men, and the Lord discomfits Sisera and all his chariots."
      ru: "Варак сходит с горы Фавора с десятью тысячами, и Господь приводит в замешательство Сисару и все колесницы его."
      uk: "Варак сходить з гори Фавор з десятьма тисячами чоловіків, і Господь повергає в замішання Сісару та всі його колісниці."
      es: "Barac baja del Monte Tabor con diez mil hombres, y el Señor desbarata a Sísara y a todos sus carros."
      pt: "Baraque desce do Monte Tabor com dez mil homens, e o Senhor derrota Sísera e todos os seus carros."
      de: "Barak zieht mit zehntausend Mann vom Berg Tabor hinab, und der Herr verwirrt Sisera und alle seine Wagen."
      fr: "Barak descend du Mont Thabor avec dix mille hommes, et l’Éternel met en déroute Sisera et tous ses chars."
      pl: "Barak schodzi z góry Tabor z dziesięcioma tysiącami mężów, a Pan wprawia w popłoch Siserę i wszystkie jego rydwany."
      it: "Barak scende dal Monte Tabor con diecimila uomini, e il Signore mette in rotta Sisara e tutti i suoi carri."
      nl: "Barak daalt met tienduizend man van de berg Tabor af, en de HEER brengt Sisera en al zijn wagens in verwarring."
      cs: "Bárak sestupuje z hory Tábor s deseti tisíci muži a Hospodin uvádí Siseru i všechny jeho vozy do zmatku."
      sv: "Barak går ner från berget Tabor med tio tusen man, och Herren sänder förvirring över Sisera och alla hans vagnar."
      nb: "Barak kommer ned fra Tabor med ti tusen mann, og Herren kaster Sisera og alle hans vogner ut i forvirring."
      tl: "Bumababa si Barac mula sa Bundok Thabor na may sampung libong lalaki, at ginugulo ng Panginoon si Sisara at ang lahat niyang karo."
      da: "Barak kommer ned fra Tabor med ti tusind mand, og Herren forvirrer Sisera og alle hans stridsvogne."
      sr: "Варак силази с горе Тавора са десет хиљада људи, и Господ разбија Сисару и сва његова кола."
      hu: "Bárák tízezer emberrel leszáll a Tábor-hegyről, és az Úr megzavarja Siserát és minden harci szekerét."
      fi: "Barak laskeutuu Taborvuorelta kymmenentuhatta miestä mukanaan, ja Herra saattaa Siseran ja kaikki hänen vaununsa hämmennyksiin."
      vi: "Ba-rác đi xuống từ Núi Tha-bô với mười ngàn người, và Đức Giê-hô-va làm cho Si-sê-ra cùng hết thảy xe cộ người vỡ chạy."
      ro: "Barac coboară de pe Muntele Tabor cu zece mii de oameni, iar Domnul îl pune în derută pe Sisera cu toate carele lui."
      bg: "Варак слиза от планината Тавор с десет хиляди мъже и Господ разбива Сисара и всичките му колесници."
  - place: a5a6458 # Kishon
    ref: Judg.5.19-Judg.5.21
    note:
      en: 'Deborah''s song: "The river of Kishon swept them away."'
      ru: "Песнь Деворы: «Поток Киссон увлек их»."
      uk: "Пісня Дебори: «Той Кисон, бурчак (потужний), різко рвав і нїс їх»."
      es: "El cántico de Débora: «Barriólos el torrente de Cisón»."
      pt: "O cântico de Débora: “O ribeiro de Quisom os arrastou.”"
      de: "Deboras Lied: „Der Bach Kison wälzte sie.“"
      fr: "Le cantique de Débora : « Le torrent de Kison les a entraînés. »"
      pl: "Pieśń Debory: „Potok Cyson porwał je”."
      it: "Il canto di Debora: «Il torrente di Kison li travolse»."
      nl: "Het lied van Debora: “De beek Kison wentelde hen weg.”"
      cs: "Deborina píseň: „Potok Císon smetl je.“"
      sv: "Deboras sång: ”Bäcken Kison ryckte dem bort.”"
      nb: "Deboras sang: «Kisons bekk rev dem bort»."
      tl: "Awit ni Debora: “Tinangay sila ng ilog Cison.”"
      da: "Deboras sang: »Bækken Kison bortfejede dem.«"
      sr: "Деворина песма: „Поток Кисон однесе их.“"
      hu: "Debóra éneke: „A Kison patakja seprette el őket”."
      fi: "Deboran laulu: ”Kiisonin puro tempasi heidät mukaansa”."
      vi: "Bài ca của Đê-bô-ra: “Khe Ki-sôn đã kéo trôi chúng nó”."
      ro: "Cântarea Deborei: pârâul Chison i-a măturat."
      bg: "Песента на Девора: „Реката Кисон ги завлече“."
  - place: abd637f # Ophrah
    ref: Judg.6.11-Judg.6.24
    note:
      en: "At Ophrah the angel of the Lord finds Gideon threshing wheat by the winepress."
      ru: "В Офре Ангел Господень находит Гедеона, выколачивающего пшеницу в точиле."
      uk: "В Офрі ангел Господній застає Гедеона, що молотить пшеницю біля давильні."
      es: "En Ofra el ángel del Señor encuentra a Gedeón trillando trigo junto al lagar."
      pt: "Em Ofra, o anjo do Senhor encontra Gideão malhando trigo no lagar."
      de: "In Ofra findet der Engel des Herrn Gideon, der in der Kelter Weizen ausklopft."
      fr: "À Ophra, l’ange de l’Éternel trouve Gédéon battant du froment au pressoir."
      pl: "W Ofrze anioł Pański zastaje Gedeona młócącego pszenicę przy tłoczni."
      it: "A Ofra l’angelo del Signore trova Gedeone che batte il grano nel tino."
      nl: "Te Ofra vindt de engel van de HEER Gideon, tarwe dorsend bij de wijnpers."
      cs: "V Ofře nalézá anděl Hospodinův Gedeona, jak mlátí pšenici u lisu."
      sv: "I Ofra finner Herrens ängel Gideon när han klappar ut vete i vinpressen."
      nb: "I Ofra finner Herrens engel Gideon mens han tresker hvete ved vinpressen."
      tl: "Sa Ophra, natagpuan ng anghel ng Panginoon si Gedeon na gumigiik ng trigo sa pisaan ng ubas."
      da: "I Ofra finder Herrens engel Gideon, der tærsker hvede ved vinpersen."
      sr: "У Офри анђео Господњи налази Гедеона где врше пшеницу крај каце."
      hu: "Ofrában az Úr angyala a szőlőprésnél búzát csépelő Gedeont találja."
      fi: "Ofrassa Herran enkeli tapaa Gideonin puimassa nisuja viinikuurnan luona."
      vi: "Tại Óp-ra, thiên sứ của Đức Giê-hô-va gặp Ghê-đê-ôn đang đập lúa mì trong bàn ép nho."
      ro: "La Ofra, îngerul Domnului îl găsește pe Ghedeon treierând grâu lângă teasc."
      bg: "В Офра ангелът Господен намира Гедеон да вършее жито при лина."
  - place: ae3cace # Harod
    ref: Judg.7.1-Judg.7.22
    note:
      en: "Camped by the spring of Harod, Gideon keeps three hundred men who lapped the water, and Midian is routed."
      ru: "Расположившись станом у источника Харода, Гедеон оставляет триста человек, лакавших воду, и Мадианитяне обращены в бегство."
      uk: "Стоячи табором біля джерела Харод, Гедеон залишає триста чоловіків, що лакали воду, і Мадіам розбито."
      es: "Acampado junto a la fuente de Harod, Gedeón se queda con trescientos hombres que lamieron el agua, y Madián es puesto en fuga."
      pt: "Acampado junto à fonte de Harode, Gideão fica com trezentos homens que lamberam a água, e Midiã é posta em fuga."
      de: "An der Quelle Harod gelagert, behält Gideon dreihundert Mann, die das Wasser geleckt haben, und Midian wird in die Flucht geschlagen."
      fr: "Campé près de la source de Harod, Gédéon garde trois cents hommes qui ont lapé l’eau, et Madian est mis en déroute."
      pl: "Rozbiwszy obóz przy źródle Charod, Gedeon zatrzymuje trzystu mężów, którzy chłeptali wodę, i Madian zostaje rozgromiony."
      it: "Accampato presso la sorgente di Carod, Gedeone tiene con sé trecento uomini che hanno lappato l’acqua, e Madian è messo in rotta."
      nl: "Gelegerd bij de bron van Charod houdt Gideon driehonderd man over die het water oplikten, en Midian wordt op de vlucht gejaagd."
      cs: "Utábořen u pramene Charod si Gedeon ponechává tři sta mužů, kteří chlemtali vodu, a Midján je rozprášen."
      sv: "Vid källan Harod, där han har slagit läger, behåller Gideon de tre hundra män som läppjade vattnet, och Midjan drivs på flykt."
      nb: "Gideon slår leir ved Harod-kilden og beholder tre hundre mann som lepjet vannet, og Midjan blir slått på flukt."
      tl: "Nagkampo sa bukal ng Harod, itinira ni Gedeon ang tatlong daang lalaking dumila ng tubig, at napatalsik ang Midian."
      da: "Lejret ved Harods kilde beholder Gideon tre hundrede mand, som lappede vandet, og Midjan bliver slået på flugt."
      sr: "Логоровани код извора Харода, Гедеон задржава три стотине људи који су лизали воду, и Мадијам бива разбијен."
      hu: "A Harod forrásánál táborozva Gedeon háromszáz férfit tart meg, akik a vizet nyalták, és Midiánt megfutamítják."
      fi: "Harodin lähteen luona leiriytyneenä Gideon pitää kolmesataa miestä, jotka lipoivat vettä, ja Midian ajetaan pakoon."
      vi: "Đóng trại bên suối Ha-rốt, Ghê-đê-ôn giữ lại ba trăm người đã liếm nước, và Ma-đi-an bị đánh tan."
      ro: "Tăbărât lângă izvorul Harod, Ghedeon păstrează trei sute de oameni care au lipăit apa, iar Madianul este pus pe fugă."
      bg: "Разположен на стан при извора Харод, Гедеон задържа тристата мъже, които лочеха водата, и Мадиам е разбит."
  - place: a08174b # Zorah
    ref: Judg.13.2-Judg.13.25
    note:
      en: "In Zorah the angel of the Lord announces Samson's birth to Manoah's wife."
      ru: "В Цоре Ангел Господень возвещает жене Маноя о рождении Самсона."
      uk: "У Цорі ангел Господній сповіщає дружині Маноя про народження Самсона."
      es: "En Zora el ángel del Señor anuncia el nacimiento de Sansón a la mujer de Manoa."
      pt: "Em Zorá, o anjo do Senhor anuncia à mulher de Manoá o nascimento de Sansão."
      de: "In Zora kündigt der Engel des Herrn der Frau Manoachs die Geburt Simsons an."
      fr: "À Tsorea, l’ange de l’Éternel annonce la naissance de Samson à la femme de Manoach."
      pl: "W Sorze anioł Pański zwiastuje żonie Manoacha narodziny Samsona."
      it: "A Zorea l’angelo del Signore annuncia la nascita di Sansone alla moglie di Manoach."
      nl: "Te Zora kondigt de engel van de HEER aan de vrouw van Manoach de geboorte van Simson aan."
      cs: "V Corey oznamuje anděl Hospodinův Manóachově ženě Samsonovo narození."
      sv: "I Sora tillkännager Herrens ängel Simsons födelse för Manoachs hustru."
      nb: "I Sora forkynner Herrens engel Samsons fødsel for Manoahs hustru."
      tl: "Sa Sora, ibinalita ng anghel ng Panginoon sa asawa ni Manoa ang pagsilang ni Samson."
      da: "I Zora kundgør Herrens engel Samsons fødsel for Manoas hustru."
      sr: "У Сараји анђео Господњи најављује рођење Самсоново жени Маноји."
      hu: "Corában az Úr angyala hírül adja Mánoah feleségének Sámson születését."
      fi: "Soraassa Herran enkeli ilmoittaa Simsonin syntymästä Manoahin vaimolle."
      vi: "Tại Xô-rê-a, thiên sứ của Đức Giê-hô-va báo tin Sam-sôn sẽ sinh ra cho vợ Ma-nô-a."
      ro: "În Țorea, îngerul Domnului îi vestește soției lui Manoah nașterea lui Samson."
      bg: "В Цора ангелът Господен известява на жената на Маной раждането на Самсон."
  - place: a21f909 # Timnah
    ref: Judg.14.1-Judg.14.6
    note:
      en: "On the way to Timnah the Spirit of the Lord comes upon Samson and he tears a young lion apart."
      ru: "На пути в Фимнафу на Самсона сходит Дух Господень, и он растерзывает молодого льва."
      uk: "Дорогою до Тімни Дух Господній сходить на Самсона, і він роздирає молодого лева."
      es: "De camino a Timna el Espíritu del Señor viene sobre Sansón, y él despedaza a un león joven."
      pt: "No caminho para Timna, o Espírito do Senhor vem sobre Sansão, e ele despedaça um leão novo."
      de: "Auf dem Weg nach Timna kommt der Geist des Herrn über Simson, und er zerreißt einen jungen Löwen."
      fr: "En allant à Thimna, l’Esprit de l’Éternel saisit Samson, et il déchire un jeune lion."
      pl: "W drodze do Timny Duch Pański zstępuje na Samsona i rozdziera młodego lwa."
      it: "Sulla via di Timna lo Spirito del Signore scende su Sansone, ed egli squarcia un giovane leone."
      nl: "Op weg naar Timna komt de Geest van de HEER over Simson en hij scheurt een jonge leeuw uiteen."
      cs: "Na cestě do Timny přichází na Samsona Duch Hospodinův a on roztrhá mladého lva."
      sv: "På väg till Timna kommer Herrens Ande över Simson, och han sliter sönder ett ungt lejon."
      nb: "På veien til Timna kommer Herrens Ånd over Samson, og han river en ung løve i stykker."
      tl: "Sa daan patungong Timna, sumasakaniya ang Espiritu ng Panginoon at pinunit ni Samson ang isang batang leon."
      da: "På vejen til Timna kommer Herrens Ånd over Samson, og han river en ung løve itu."
      sr: "На путу у Тамну Дух Господњи силази на Самсона, и он раздире младог лава."
      hu: "Timna felé menet az Úr Lelke Sámsonra száll, és szétszakít egy fiatal oroszlánt."
      fi: "Matkalla Timnaan Herran Henki tulee Simsonin päälle, ja hän repii nuoren leijonan kappaleiksi."
      vi: "Trên đường đến Thim-na, Thần của Đức Giê-hô-va cảm động Sam-sôn và người xé một con sư tử tơ."
      ro: "Pe drumul spre Timna, Duhul Domnului vine peste Samson, iar el sfâșie un pui de leu."
      bg: "По пътя към Тимна Духът Господен слиза върху Самсон и той разкъсва млад лъв."
  - place: a339971 # Valley of Sorek
    ref: Judg.16.4-Judg.16.20
    note:
      en: "In the valley of Sorek he loves Delilah, who betrays the secret of his strength."
      ru: "В долине Сорек он любит Далиду, и та выдаёт тайну его силы."
      uk: "У долині Сорек він кохає Далілу, яка видає таємницю його сили."
      es: "En el valle de Sorec ama a Dalila, que traiciona el secreto de su fuerza."
      pt: "No vale de Soreque ele ama Dalila, que trai o segredo da sua força."
      de: "Im Tal Sorek liebt er Delila, die das Geheimnis seiner Kraft verrät."
      fr: "Dans la vallée de Sorek, il aime Delila, qui trahit le secret de sa force."
      pl: "W dolinie Sorek kocha Dalilę, która zdradza tajemnicę jego siły."
      it: "Nella valle di Sorek ama Dalila, che tradisce il segreto della sua forza."
      nl: "In het dal van Sorek heeft hij Delila lief, die het geheim van zijn kracht verraadt."
      cs: "V údolí Sórek miluje Dalilu, která vyzradí tajemství jeho síly."
      sv: "I Soreks dal blir han förälskad i Delila, som förråder hemligheten bakom hans styrka."
      nb: "I Sorek-dalen elsker han Dalila, som forråder hemmeligheten ved hans styrke."
      tl: "Sa libis ng Sorec ay umibig siya kay Dalila, na nagkanulo sa lihim ng kaniyang lakas."
      da: "I Soreks dal elsker han Dalila, som forråder hemmeligheden bag hans styrke."
      sr: "У долини Сорек заљубљује се у Далиду, која одаје тајну његове снаге."
      hu: "A Szórek-völgyben megszereti Delilát, aki elárulja erejének titkát."
      fi: "Sorekin laaksossa hän rakastaa Delilaa, joka paljastaa hänen voimansa salaisuuden."
      vi: "Trong trũng Sô-réc, người yêu Đa-li-la, là người phản bội bí mật về sức mạnh của người."
      ro: "În Valea Sorec o iubește pe Dalila, care trădează taina puterii lui."
      bg: "В долината Сорек той обиква Далила, която издава тайната на силата му."
  - place: aa8edd2 # Gaza
    ref: Judg.16.21-Judg.16.30
    note:
      en: "Blinded and bound in Gaza, he brings down the house on the lords of the Philistines."
      ru: "Ослеплённый и скованный в Газе, он обрушивает дом на владельцев Филистимских."
      uk: "Осліплений і закутий у Газі, він обвалює дім на володарів філістимлян."
      es: "Cegado y atado en Gaza, derriba la casa sobre los príncipes de los filisteos."
      pt: "Cego e preso em Gaza, derruba a casa sobre os senhores dos filisteus."
      de: "Geblendet und gefesselt in Gaza, bringt er das Haus über den Fürsten der Philister zum Einsturz."
      fr: "Aveuglé et enchaîné à Gaza, il fait s’écrouler la maison sur les princes des Philistins."
      pl: "Oślepiony i skuty w Gazie, wali dom na władców Filistynów."
      it: "Accecato e incatenato a Gaza, fa crollare la casa sui signori dei Filistei."
      nl: "Verblind en gebonden te Gaza haalt hij het huis neer op de vorsten van de Filistijnen."
      cs: "Oslepen a spoután v Gaze, zboří dům na vládce Pelištejců."
      sv: "Förblindad och fjättrad i Gaza river han ner huset över filistéernas furstar."
      nb: "Blindet og bundet i Gasa velter han huset over filisterfyrstene."
      tl: "Bulag at nakagapos sa Gaza, ibinuwal niya ang bahay sa ibabaw ng mga pinuno ng mga Filisteo."
      da: "Blindet og lænket i Gaza bringer han huset til at styrte sammen over filistrenes fyrster."
      sr: "Ослепљен и свезан у Гази, обара кућу на кнезове филистејске."
      hu: "Gázában megvakítva és megkötözve ráomlasztja a házat a filiszteusok fejedelmeire."
      fi: "Sokaistuna ja kahlehdittuna Gazassa hän kaataa talon filistealaisten ruhtinaiden päälle."
      vi: "Bị mù và bị xiềng tại Ga-xa, người làm sập nhà đè trên các quan trưởng của người Phi-li-tin."
      ro: "Orbit și legat în Gaza, el prăbușește casa peste domnitorii filistenilor."
      bg: "Ослепен и окован в Газа, той събаря дома върху филистимските князе."
