# The return from exile under Ezra (Ezra 7-8, the seventh year of Artaxerxes I, c. 458 BC)
# and Nehemiah (Neh 1-12, his twentieth year, c. 445 BC). The tour's year is Ezra's;
# Nehemiah's stops show 445 BC: the wall finished in Elul (6:15), the law read in the
# seventh month after it (Neh 8), and the dedication of the wall (12:27, not dated) with
# them. The first return under Cyrus (Ezra 1-6) is its own tour.
id: return
title:
  en: "The return: Ezra and Nehemiah"
  ru: "Возвращение: Ездра и Неемия"
  uk: "Повернення: Ездра і Неемія"
  es: "El regreso: Esdras y Nehemías"
  pt: "O retorno: Esdras e Neemias"
  de: "Die Rückkehr: Esra und Nehemia"
  fr: "Le retour : Esdras et Néhémie"
  pl: "Powrót: Ezdrasz i Nehemiasz"
  it: "Il ritorno: Esdra e Neemia"
  nl: "De terugkeer: Ezra en Nehemia"
  cs: "Návrat: Ezdráš a Nehemjáš"
year: "458 BC"
people: ["Ezra@Ezr.7.1-Neh", "Nehemiah@Neh.1.1-"]
approximate: true
stops:
  # Ahava is only known to be near Babylon; OpenBible puts it on Babylon itself, so the
  # setting out from Babylon (Ezra 7:9) is told here rather than as a stop in the same spot.
  - place: a6c3859 # Ahava
    ref: Ezra.8.15-Ezra.8.30
    note:
      en: "Leaving Babylon, Ezra and the exiles gather by the river that runs to Ahava, fast and pray for a safe journey."
      ru: "Выйдя из Вавилона, Ездра и возвращающиеся изгнанники собираются у реки, втекающей в Агаву, постятся и молятся о благополучном пути."
      uk: "Залишаючи Вавилон, Ездра й вигнанці збираються біля ріки, що тече до Агави, постять і моляться про безпечну дорогу."
      es: "Al salir de Babilonia, Esdras y los desterrados se reúnen junto al río que corre hacia Ahava, ayunan y oran por un viaje seguro."
      pt: "Ao deixar a Babilônia, Esdras e os exilados se reúnem junto ao rio que corre para Aava, jejuam e oram por uma viagem segura."
      de: "Esra und die Verbannten verlassen Babylon, versammeln sich am Fluss, der nach Ahawa fließt, und fasten und beten um eine sichere Reise."
      fr: "Quittant Babylone, Esdras et les exilés se rassemblent près du fleuve qui coule vers Ahava, jeûnent et prient pour un heureux voyage."
      pl: "Opuszczając Babilon, Ezdrasz i wygnańcy zbierają się nad rzeką płynącą do Ahawa, poszczą i modlą się o szczęśliwą podróż."
      it: "Lasciando Babilonia, Esdra e gli esuli si radunano presso il fiume che scorre verso Aava, digiunano e pregano per un viaggio sicuro."
      nl: "Ezra en de ballingen verlaten Babylon en verzamelen zich bij de rivier die naar Ahava loopt, vasten en bidden om een veilige reis."
      cs: "Při odchodu z Babylóna se Ezdráš a vyhnanci shromažďují u řeky, která teče k Ahavě, postí se a modlí za bezpečnou cestu."
  - place: a15257a # Jerusalem
    ref: Ezra.8.31-Ezra.8.32
    note:
      en: "They reach Jerusalem and rest three days."
      ru: "Приходят в Иерусалим и отдыхают три дня."
      uk: "Вони доходять до Єрусалима й відпочивають три дні."
      es: "Llegan a Jerusalén y descansan tres días."
      pt: "Chegam a Jerusalém e descansam três dias."
      de: "Sie erreichen Jerusalem und ruhen drei Tage."
      fr: "Ils arrivent à Jérusalem et s’y reposent trois jours."
      pl: "Docierają do Jerozolimy i odpoczywają trzy dni."
      it: "Giungono a Gerusalemme e si riposano tre giorni."
      nl: "Zij bereiken Jeruzalem en rusten er drie dagen."
      cs: "Dorazí do Jeruzaléma a tři dny odpočívají."
  - place: a033b84 # Susa
    ref: Neh.1.1-Neh.1.4
    year: "445 BC"
    note:
      en: "At Susa Nehemiah hears that the walls of Jerusalem lie broken."
      ru: "В Сузах Неемия слышит, что стены Иерусалима разрушены."
      uk: "У Сузах Неемія чує, що мури Єрусалима зруйновані."
      es: "En Susa Nehemías se entera de que los muros de Jerusalén están derribados."
      pt: "Em Susã, Neemias ouve que os muros de Jerusalém estão derrubados."
      de: "In Susa hört Nehemia, dass die Mauern Jerusalems niedergerissen liegen."
      fr: "À Suse, Néhémie apprend que les murailles de Jérusalem sont en ruine."
      pl: "W Suzie Nehemiasz słyszy, że mury Jerozolimy leżą w gruzach."
      it: "A Susa Neemia apprende che le mura di Gerusalemme sono in rovina."
      nl: "Te Susa hoort Nehemia dat de muren van Jeruzalem in puin liggen."
      cs: "V Susách se Nehemjáš dozvídá, že jeruzalémské hradby leží v rozvalinách."
  - place: a15257a # Jerusalem
    ref: Neh.2.11-Neh.2.18
    year: "445 BC"
    note:
      en: "Nehemiah inspects the walls by night and the rebuilding begins."
      ru: "Неемия ночью осматривает стены, и начинается восстановление."
      uk: "Неемія вночі оглядає мури, і починається відбудова."
      es: "Nehemías inspecciona los muros de noche y comienza la reconstrucción."
      pt: "Neemias inspeciona os muros de noite, e começa a reconstrução."
      de: "Nehemia besichtigt nachts die Mauern, und der Wiederaufbau beginnt."
      fr: "Néhémie inspecte les murailles de nuit, et la reconstruction commence."
      pl: "Nehemiasz nocą ogląda mury i zaczyna się odbudowa."
      it: "Neemia ispeziona le mura di notte e comincia la ricostruzione."
      nl: "Nehemia inspecteert 's nachts de muren en de herbouw begint."
      cs: "Nehemjáš v noci obhlíží hradby a začíná stavba."
  - place: ae6bfe2 # Ono
    ref: Neh.6.1-Neh.6.4
    year: "445 BC"
    note:
      en: 'Sanballat and Geshem call him to meet them in the plain of Ono, meaning him harm; he answers: "I am doing a great work, so that I cannot come down."'
      ru: "Санаваллат и Гешем зовут его встретиться на равнине Оно, замышляя зло; он отвечает: «я занят большим делом, не могу сойти»."
      uk: "Санаваллат і Гешем кличуть його зустрітися з ними в долині Оно, замишляючи лихе; він відповідає: «Я маю роботу коло великого дїла; не можу зійти»."
      es: "Sanbalat y Gesem lo citan para encontrarse en el campo de Ono, con la intención de hacerle daño; él responde: «Yo hago una grande obra, y no puedo ir»."
      pt: "Sambalá e Gesém o convidam a encontrá-los na planície de Ono, com más intenções; ele responde: “Estou realizando uma grande obra, de modo que não posso descer.”"
      de: "Sanballat und Geschem rufen ihn zu einer Zusammenkunft in die Ebene von Ono, in böser Absicht; er antwortet: „Ich habe ein großes Geschäft auszurichten, ich kann nicht hinabkommen.“"
      fr: "Sanballat et Guéschem l’invitent à les rencontrer dans la plaine d’Ono, dans l’intention de lui nuire ; il répond : « J’ai un grand ouvrage à exécuter, et je ne puis descendre. »"
      pl: "Sanballat i Geszem wzywają go na spotkanie w równinie Ono, knując zło; on odpowiada: „Zacząłem robotę wielką, przetoż nie mogę zjechać.”"
      it: "Sanballàt e Geshem lo invitano a incontrarli nella pianura di Ono, con l’intenzione di fargli del male; egli risponde: «Io sto facendo un gran lavoro, e non posso scendere»."
      nl: "Sanballat en Gesem nodigen hem uit voor een ontmoeting in de vlakte van Ono, met kwade bedoelingen; hij antwoordt: “Ik doe een groot werk, zodat ik niet zal kunnen afkomen.”"
      cs: "Sanbalat a Gešem ho zvou na setkání na rovině Onó se zlým úmyslem; odpovídá: „Dílo veliké dělám, protož nemohu odjíti.“"
  - place: a0293ff # Water Gate
    ref: Neh.8.1-Neh.8.8
    year: "445 BC"
    note:
      en: "In the seventh month all the people gather in the street before the Water Gate; Ezra reads the book of the law from morning until midday, the Levites give the sense, and the people understand the reading."
      ru: "В седьмой месяц весь народ собирается на площади перед Водяными воротами, Ездра читает книгу закона от рассвета до полудня, левиты поясняют, и народ понимает прочитанное."
      uk: "На сьомий місяць увесь народ збирається на майдані перед Водяними воротами; Ездра читає книгу закону від ранку до полудня, левіти пояснюють зміст, і народ розуміє читання."
      es: "En el mes séptimo todo el pueblo se reúne en la plaza ante la Puerta de las Aguas; Esdras lee el libro de la ley desde la mañana hasta el mediodía, los levitas dan el sentido, y el pueblo entiende la lectura."
      pt: "No sétimo mês todo o povo se reúne na praça diante da Porta das Águas; Esdras lê o livro da lei desde a manhã até o meio-dia, os levitas dão o sentido, e o povo entende a leitura."
      de: "Im siebten Monat versammelt sich das ganze Volk auf dem Platz vor dem Wassertor; Esra liest vom Morgen bis zum Mittag aus dem Buch des Gesetzes vor, die Leviten geben den Sinn an, und das Volk versteht das Vorgelesene."
      fr: "Le septième mois, tout le peuple se rassemble sur la place devant la Porte des Eaux ; Esdras lit le livre de la loi depuis le matin jusqu’à midi, les Lévites en donnent le sens, et le peuple comprend la lecture."
      pl: "W siódmym miesiącu cały lud zbiera się na placu przed Bramą Wodną; Ezdrasz czyta księgę Prawa od rana do południa, Lewici wyjaśniają jej sens, a lud rozumie czytanie."
      it: "Nel settimo mese tutto il popolo si raduna nella piazza davanti alla Porta delle Acque; Esdra legge il libro della legge dal mattino fino a mezzogiorno, i Leviti ne spiegano il senso e il popolo comprende la lettura."
      nl: "In de zevende maand verzamelt heel het volk zich op het plein voor de Waterpoort; Ezra leest het wetboek voor van de morgen tot de middag, de Levieten geven de zin, en het volk begrijpt wat er gelezen wordt."
      cs: "V sedmém měsíci se všechen lid shromažďuje na prostranství před Vodní branou; Ezdráš čte knihu zákona od rána do poledne, levité vykládají smysl a lid čtení rozumí."
  - place: a15257a # Jerusalem
    ref: Neh.12.27-Neh.12.43
    year: "445 BC"
    note:
      en: 'At the dedication of the wall two great choirs go along it in opposite directions, "so that the joy of Jerusalem was heard even afar off."'
      ru: "При освящении стены два больших хора идут по ней в разные стороны, «и веселие Иерусалима далеко было слышно»."
      uk: "На освяченні муру два великі хори йдуть по ньому у протилежних напрямах, «і далеко було чути радощі Ерусалиму»."
      es: "En la dedicación del muro dos grandes coros lo recorren en sentidos opuestos, «y el alborozo de Jerusalem fué oído de lejos»."
      pt: "Na dedicação do muro, dois grandes coros o percorrem em direções opostas, “de modo que a alegria de Jerusalém foi ouvida até de longe.”"
      de: "Bei der Einweihung der Mauer ziehen zwei große Chöre in entgegengesetzten Richtungen an ihr entlang, und „man hörte die Freude Jerusalems ferne“."
      fr: "À la dédicace de la muraille, deux grands chœurs la parcourent en sens opposé, « et les cris de joie de Jérusalem furent entendus au loin »."
      pl: "Podczas poświęcenia muru dwa wielkie chóry idą po nim w przeciwnych kierunkach, tak że „było słyszeć wesele Jeruzalemskie daleko.”"
      it: "Alla dedicazione delle mura due grandi cori le percorrono in direzioni opposte, e «la gioia di Gerusalemme si sentiva di lontano»."
      nl: "Bij de inwijding van de muur gaan twee grote koren er in tegenovergestelde richting overheen, “zodat de vrolijkheid van Jeruzalem tot van verre gehoord werd.”"
      cs: "Při posvěcení hradby po ní jdou dva veliké sbory opačnými směry, „tak že bylo slyšáno veselí Jeruzaléma opodál“."
