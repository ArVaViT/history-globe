    note:
      en: "A straight course to Samothrace."
      ru: "Прямым путём к Самофракии."
      uk: "Прямим курсом до Самотракії."
      es: "Rumbo directo a Samotracia."
      pt: "Rumo direto a Samotrácia."
      de: "Auf geradem Kurs nach Samothrake."
      fr: "Route directe vers Samothrace."
      pl: "Prosta droga do Samotraki."
      it: "Rotta diretta verso Samotracia."
      nl: "Een rechte koers naar Samothrake."
      cs: "Přímá plavba na Samothráké."
      sv: "Rak kurs till Samothrake."
      nb: "Rett kurs til Samotrake."
      tl: "Tuwirang paglalayag patungong Samotracia."
      da: "Ret kurs mod Samothrake."
      sr: "Пловидба право до Самотраке."
      hu: "Egyenes úton Szamothrakéba."
      fi: "Suora matka Samothrakeen."
      vi: "Đi thẳng đến Sa-mô-tra-xơ."
      ro: "Drum drept spre Samotracia."
      bg: "Направо към Самотраки."
    story:
      en: "Setting sail from Troas, they ran a straight course to Samothrace, the high, rocky island off the coast of Thrace, known for its sanctuary of the Great Gods. With its mountain seen far out to sea, it was the halt on the way across the northern Aegean."
      ru: "Отплыв из Троады, они прямым путём пришли в Самофракию, высокий скалистый остров у побережья Фракии, известный святилищем Великих богов. Его гора видна далеко с моря, и он был остановкой на пути через северную часть Эгейского моря."
      uk: "Відпливши з Троади, вони прямим курсом прибули до Самотракії, високого скелястого острова біля узбережжя Фракії, відомого святилищем Великих богів. Його гору видно далеко з моря, і він був зупинкою на шляху через північну частину Егейського моря."
      es: "Zarpando de Troas, navegaron en línea recta a Samotracia, la isla alta y rocosa frente a la costa de Tracia, conocida por su santuario de los Grandes Dioses. Con su montaña visible desde muy lejos en el mar, era la escala en la travesía del norte del Egeo."
      pt: "Navegando de Trôade, seguiram em rota direta para Samotrácia, a ilha alta e rochosa diante da costa da Trácia, conhecida pelo seu santuário dos Grandes Deuses. Com a sua montanha avistada de muito longe no mar, era a escala na travessia do norte do Egeu."
      de: "Von Troas aus fuhren sie auf geradem Kurs nach Samothrake, der hohen, felsigen Insel vor der Küste Thrakiens, bekannt für ihr Heiligtum der Großen Götter. Mit ihrem weit draußen auf See sichtbaren Berg war sie die Zwischenstation auf dem Weg über die nördliche Ägäis."
      fr: "Partis de Troas, ils firent voile directement vers Samothrace, l’île haute et rocheuse au large de la côte de Thrace, connue pour son sanctuaire des Grands Dieux. Sa montagne se voyant de très loin en mer, elle était l’escale sur la route à travers le nord de l’Égée."
      pl: "Odpłynąwszy z Troady, popłynęli prosto do Samotraki, wysokiej, skalistej wyspy u wybrzeży Tracji, znanej z sanktuarium Wielkich Bogów. Jej góra, widoczna daleko z morza, czyniła ją przystankiem w drodze przez północne Morze Egejskie."
      it: "Salpati da Troade, fecero rotta diretta verso Samotracia, l’isola alta e rocciosa al largo della costa della Tracia, nota per il suo santuario dei Grandi Dèi. Con il suo monte visibile da lontano in mare, era la tappa sulla traversata dell’Egeo settentrionale."
      nl: "Vanuit Troas afgevaren, voeren zij in een rechte koers naar Samothrake, het hoge, rotsachtige eiland voor de kust van Thracië, bekend om zijn heiligdom van de Grote Goden. Met zijn berg die ver op zee te zien was, was het de tussenhalte op de weg over het noorden van de Egeïsche Zee."
      cs: "Vypluli z Troady a pluli přímo na Samothráké, vysoký skalnatý ostrov u pobřeží Thrákie, známý svatyní Velkých bohů. Její hora, viditelná daleko na moři, z ní činila zastávku na cestě přes severní Egejské moře."
      sv: "De lade ut från Troas och höll rak kurs mot Samothrake, den höga, klippiga ön utanför Thrakiens kust, känd för sin helgedom åt de stora gudarna. Med sitt berg synligt långt ute till havs var den rastplatsen på vägen över norra Egeiska havet."
      nb: "De seilte ut fra Troas og holdt rett kurs til Samotrake, den høye, klippefulle øya utenfor kysten av Trakia, kjent for sin helligdom for de store gudene. Med fjellet sitt synlig langt til havs var den stoppestedet på veien over det nordlige Egeerhavet."
      tl: "Pagtulak sa Troas, tuwiran nilang pinunta ang Samotracia, ang mataas at mabatong pulo sa tapat ng baybayin ng Tracia, na kilala sa santuwaryo nito ng mga Dakilang Diyos. Sa bundok nitong natatanaw mula sa malayo sa dagat, ito ang hintuan sa pagtawid sa hilagang Aegeo."
      da: "De sejlede fra Troas og styrede lige mod Samothrake, den høje, klippefyldte ø ud for Thrakiens kyst, kendt for sin helligdom for De Store Guder. Med sit bjerg, der kunne ses langt ude på havet, var øen rastestedet på vejen over det nordlige Ægæiske Hav."
      sr: "Отпловивши из Троаде, пловили су право до Самотраке, високог, стеновитог острва поред обале Тракије, познатог по светилишту Великих богова. Са својом планином, која се види далеко на мору, била је станица на путу преко северног Егејског мора."
      hu: "Troászból elhajózva egyenesen Szamothrakéba futottak, a trák part előtti magas, sziklás szigetre, amely a Nagy Istenek szentélyéről volt ismert. Hegye messziről látszott a tengeren, és a sziget az északi Égei-tengeren való átkelés pihenőhelye volt."
      fi: "Troaksesta purjehdittuaan he kulkivat suoraan Samothrakeen, korkealle ja kallioiselle saarelle Traakian rannikon edustalla, joka tunnettiin Suurten jumalien pyhäköstä. Kauas merelle näkyvine vuorineen se oli välipysähdys pohjoisen Egeanmeren ylityksellä."
      vi: "Từ Trô-ách xuống thuyền, họ đi thẳng đến Sa-mô-tra-xơ, hòn đảo cao và nhiều đá ngoài khơi Thrace, nổi tiếng với đền thánh của các Đại Thần. Với ngọn núi nhìn thấy từ rất xa ngoài biển, đảo là chặng dừng trên đường vượt qua miền bắc biển Aegea."
      ro: "Pornind pe mare de la Troa, au mers drept spre Samotracia, insula înaltă și stâncoasă din fața coastei Traciei, cunoscută pentru sanctuarul Marilor Zei. Cu muntele ei văzut de departe din larg, era popasul pe drumul de traversare a nordului Mării Egee."
      bg: "Като отплаваха от Троада, те минаха направо до Самотраки — високия скалист остров край бреговете на Тракия, известен със светилището си на Великите богове. С планината си, видима далеч в морето, той беше спирката по пътя през северно Егейско море."
