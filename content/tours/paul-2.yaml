    story:
      en: "From Neapolis they went inland to Philippi, a leading city of that district of Macedonia and a Roman colony, settled after the battles of 42 BC on its plain. On the sabbath they went out of the city to a riverside place of prayer and spoke to the women there; Lydia, a dealer in purple cloth from Thyatira who worshipped God, listened, the Lord opened her heart, and she and her household were baptised and took them into her house. Paul drove a spirit of divination out of a slave girl whose fortune-telling brought her masters much profit; they dragged Paul and Silas before the magistrates as Jews who disturbed the city. The two were beaten and thrown into the inner prison with their feet in the stocks. At midnight, as they prayed and sang, an earthquake opened the doors; the jailer, about to kill himself, was stopped by Paul and believed with all his household. The next day the magistrates, learning that the men they had beaten were Romans, came and asked them to leave the city."
      ru: "Из Неаполя они пошли в глубь страны, в Филиппы, первый город той части Македонии и римскую колонию, заселённую после сражений 42 г. до н. э. на её равнине. В субботу они вышли за город к месту молитвы у реки и говорили с собравшимися там женщинами; Лидия, торговавшая багряницей, из Фиатир, чтившая Бога, слушала, Господь открыл её сердце, и она крестилась вместе с домашними и приняла их в свой дом. Павел изгнал прорицательный дух из служанки, гадания которой приносили её господам большой доход; те повлекли Павла и Силу к начальникам как иудеев, возмущающих город. Обоих избили и бросили во внутреннюю темницу, забив их ноги в колоды. В полночь, когда они молились и пели, землетрясение открыло двери; темничного стража, готового убить себя, остановил Павел, и он уверовал со всем своим домом. На следующий день начальники, узнав, что избитые ими люди — римляне, пришли и попросили их удалиться из города."
      uk: "З Неаполя вони пішли вглиб краю до Філіпп, першого міста тієї частини Македонії й римської колонії, заселеної після битв 42 р. до н. е. на її рівнині. У суботу вони вийшли за місто до місця молитви над річкою й говорили до жінок, що там зібралися; Лідія, торговиця багряницею з Тіятир, що шанувала Бога, слухала, Господь відкрив її серце, і вона охрестилася разом зі своїм домом і прийняла їх у свою оселю. Павло вигнав віщого духа з дівчини-служниці, чиє ворожіння приносило її панам великий заробіток; ті потягли Павла й Силу до начальників як юдеїв, що бентежать місто. Обох побили й кинули до внутрішньої в’язниці, забивши їм ноги в колоду. Опівночі, коли вони молилися й співали, землетрус відчинив двері; в’язничного сторожа, що хотів був убити себе, зупинив Павло, і він увірував з усім своїм домом. Наступного дня начальники, дізнавшись, що побиті ними люди — римляни, прийшли й попросили їх залишити місто."
      es: "Desde Neápolis subieron tierra adentro a Filipos, ciudad principal de aquel distrito de Macedonia y colonia romana, poblada después de las batallas del 42 a.C. libradas en su llanura. El sábado salieron de la ciudad a un lugar de oración junto al río y hablaron a las mujeres que estaban allí; Lidia, vendedora de púrpura de Tiatira que adoraba a Dios, escuchaba; el Señor le abrió el corazón, y ella y su familia fueron bautizadas y los recibieron en su casa. Pablo expulsó un espíritu de adivinación de una esclava cuyas adivinaciones daban mucha ganancia a sus amos; estos arrastraron a Pablo y a Silas ante los magistrados como judíos que alborotaban la ciudad. Los dos fueron azotados y echados en el calabozo interior con los pies en el cepo. A medianoche, mientras oraban y cantaban, un terremoto abrió las puertas; el carcelero, que iba a matarse, fue detenido por Pablo y creyó con toda su casa. Al día siguiente, los magistrados, al saber que los hombres a quienes habían azotado eran romanos, vinieron y les pidieron que salieran de la ciudad."
      pt: "De Neápolis subiram para o interior, até Filipos, cidade principal daquele distrito da Macedônia e colônia romana, povoada depois das batalhas de 42 a.C. travadas na sua planície. No sábado saíram da cidade para um lugar de oração à beira do rio e falaram às mulheres que ali estavam; Lídia, vendedora de púrpura de Tiatira que adorava a Deus, ouvia; o Senhor abriu o seu coração, e ela e a sua casa foram batizadas e os receberam em sua casa. Paulo expulsou um espírito de adivinhação de uma escrava cujas adivinhações davam muito lucro aos seus senhores; estes arrastaram Paulo e Silas perante os magistrados como judeus que perturbavam a cidade. Os dois foram açoitados e lançados no cárcere interior, com os pés presos no tronco. À meia-noite, enquanto oravam e cantavam, um terremoto abriu as portas; o carcereiro, que estava prestes a se matar, foi impedido por Paulo e creu com toda a sua casa. No dia seguinte, os magistrados, sabendo que os homens que tinham açoitado eram romanos, vieram e pediram-lhes que saíssem da cidade."
      de: "Von Neapolis zogen sie landeinwärts nach Philippi, einer führenden Stadt jenes Bezirks von Mazedonien und römischen Kolonie, die nach den Schlachten von 42 v. Chr. in ihrer Ebene besiedelt worden war. Am Sabbat gingen sie aus der Stadt hinaus an eine Gebetsstätte am Fluss und redeten zu den Frauen dort; Lydia, eine Purpurhändlerin aus Thyatira, die Gott verehrte, hörte zu, der Herr öffnete ihr das Herz, und sie wurde mit ihrem Haus getauft und nahm sie in ihr Haus auf. Paulus trieb einer Magd einen Wahrsagegeist aus, deren Wahrsagen ihren Herren viel Gewinn einbrachte; diese schleppten Paulus und Silas als Juden, die die Stadt in Unruhe brächten, vor die Stadtobersten. Die beiden wurden geschlagen und in das innerste Gefängnis geworfen, die Füße im Block. Um Mitternacht, als sie beteten und sangen, öffnete ein Erdbeben die Türen; der Kerkermeister, der sich töten wollte, wurde von Paulus zurückgehalten und kam mit seinem ganzen Haus zum Glauben. Am nächsten Tag erfuhren die Stadtobersten, dass die Männer, die sie hatten schlagen lassen, Römer waren, kamen und baten sie, die Stadt zu verlassen."
      fr: "De Néapolis, ils montèrent dans l’intérieur jusqu’à Philippes, la première ville de ce district de Macédoine et une colonie romaine, peuplée après les batailles livrées dans sa plaine en 42 av. J.-C. Le jour du sabbat, ils sortirent de la ville vers un lieu de prière au bord d’une rivière et parlèrent aux femmes qui s’y trouvaient ; Lydie, marchande de pourpre de Thyatire, qui craignait Dieu, écoutait, le Seigneur lui ouvrit le cœur, et elle fut baptisée avec sa famille et les reçut dans sa maison. Paul chassa un esprit de divination d’une servante dont les prédictions rapportaient beaucoup à ses maîtres ; ceux-ci traînèrent Paul et Silas devant les magistrats comme des Juifs qui troublaient la ville. Les deux furent battus et jetés dans la prison intérieure, les pieds dans les ceps. À minuit, tandis qu’ils priaient et chantaient, un tremblement de terre ouvrit les portes ; le geôlier, sur le point de se tuer, fut retenu par Paul et crut avec toute sa famille. Le lendemain, les magistrats, apprenant que les hommes qu’ils avaient fait battre étaient Romains, vinrent les prier de quitter la ville."
      pl: "Z Neapolis ruszyli w głąb lądu do Filippi, pierwszego miasta tej części Macedonii i rzymskiej kolonii, osadzonej po bitwach stoczonych na jej równinie w 42 p.n.e. W szabat wyszli za miasto na miejsce modlitwy nad rzeką i przemawiali do zebranych tam kobiet; Lidia, sprzedawczyni purpury z Tiatyry, czcząca Boga, słuchała, Pan otworzył jej serce, a ona i jej dom zostali ochrzczeni i przyjęła ich do swego domu. Paweł wypędził ducha wieszczego z niewolnicy, której wróżby przynosiły jej panom wielki zysk; ci zawlekli Pawła i Sylasa przed urzędników jako Żydów, którzy zakłócają spokój miasta. Obaj zostali ubiczowani i wtrąceni do wewnętrznego więzienia z nogami zakutymi w dyby. O północy, gdy się modlili i śpiewali, trzęsienie ziemi otworzyło drzwi; strażnik więzienny, który chciał się zabić, został powstrzymany przez Pawła i uwierzył wraz z całym swoim domem. Nazajutrz urzędnicy, dowiedziawszy się, że ludzie, których ubiczowali, są Rzymianami, przyszli i poprosili ich, by opuścili miasto."
      it: "Da Neapoli salirono nell’entroterra a Filippi, città primaria di quel distretto della Macedonia e colonia romana, popolata dopo le battaglie del 42 a.C. nella sua pianura. Il sabato uscirono dalla città verso un luogo di preghiera lungo un fiume e parlarono alle donne che vi erano; Lidia, commerciante di porpora di Tiatiri che temeva Dio, ascoltava, il Signore le aprì il cuore, ed ella fu battezzata con la sua famiglia e li accolse in casa sua. Paolo scacciò uno spirito indovino da una serva le cui predizioni procuravano molto guadagno ai suoi padroni; questi trascinarono Paolo e Sila davanti ai magistrati come Giudei che turbavano la città. I due furono battuti e gettati nella prigione più interna con i piedi nei ceppi. A mezzanotte, mentre pregavano e cantavano, un terremoto aprì le porte; il carceriere, che stava per uccidersi, fu fermato da Paolo e credette con tutta la sua famiglia. Il giorno dopo i magistrati, saputo che gli uomini che avevano fatto battere erano Romani, vennero a pregarli di lasciare la città."
      nl: "Van Neapolis trokken zij landinwaarts naar Filippi, een vooraanstaande stad van dat district van Macedonië en een Romeinse kolonie, die na de veldslagen van 42 v.Chr. op haar vlakte werd gesticht. Op de sabbat gingen zij de stad uit naar een gebedsplaats aan de rivier en spraken tot de vrouwen daar; Lydia, een purperverkoopster uit Thyatira die God vereerde, luisterde, de Heer opende haar hart, en zij werd met haar huisgezin gedoopt en nam hen in haar huis op. Paulus dreef een waarzeggende geest uit een slavin wier waarzeggerij haar meesters veel winst opbracht; zij sleepten Paulus en Silas voor de overheden als Joden die de stad in beroering brachten. De twee werden gegeseld en in de binnenste gevangenis geworpen, met hun voeten in het blok. Om middernacht, terwijl zij baden en zongen, opende een aardbeving de deuren; de cipier, die op het punt stond zich te doden, werd door Paulus tegengehouden en kwam met zijn hele huisgezin tot geloof. De volgende dag hoorden de overheden dat de mannen die zij hadden laten geselen Romeinen waren, en zij kwamen en vroegen hun de stad te verlaten."
      cs: "Z Neapole se vydali do vnitrozemí do Filip, předního města té části Makedonie a římské kolonie, osídlené po bitvách roku 42 př. n. l. na její rovině. V sobotu vyšli za město na modlitebné místo u řeky a mluvili k ženám, které se tam sešly; Lydie, obchodnice s purpurem z Thyatiry, která ctila Boha, naslouchala, Pán jí otevřel srdce a ona i její dům byli pokřtěni a přijala je do svého domu. Pavel vyhnal věšteckého ducha z otrokyně, jejíž věštění přinášelo jejím pánům velký zisk; ti odvlekli Pavla a Silase před úředníky jako Židy, kteří pobuřují město. Oba byli zbiti a vsazeni do vnitřního vězení s nohama v kládě. O půlnoci, když se modlili a zpívali, otevřelo zemětřesení dveře; žalářníka, který se chtěl zabít, Pavel zadržel a on uvěřil s celým svým domem. Druhý den úředníci, když se dozvěděli, že muži, které dali zbít, jsou Římané, přišli a požádali je, aby opustili město."
      sv: "Från Neapolis drog de inåt landet till Filippi, en ledande stad i denna del av Makedonien och en romersk koloni, där nybyggare bosattes efter slagen på stadens slätt år 42 f.Kr. På sabbaten gick de ut ur staden till en bönplats vid floden och talade med kvinnorna där; Lydia, en purpurhandlerska från Tyatira som fruktade Gud, lyssnade, Herren öppnade hennes hjärta, och hon och hennes husfolk döptes, och hon tog emot dem i sitt hus. Paulus drev ut en spådomsande ur en tjänsteflicka vars spådomar gav hennes herrar stor inkomst; de släpade Paulus och Silas inför domarna som judar som störde ordningen i staden. De två blev piskade och kastade i det innersta fängelset med fötterna i stocken. Vid midnatt, medan de bad och sjöng, öppnade en jordbävning dörrarna; fångvaktaren, som stod i begrepp att ta livet av sig, hejdades av Paulus och kom till tro med hela sitt hus. Dagen därpå, när domarna fick veta att männen de hade låtit piska var romare, kom de och bad dem lämna staden."
      nb: "Fra Neapolis dro de inn i landet til Filippi, en ledende by i denne delen av Makedonia og en romersk koloni, der det ble bosatt kolonister etter slagene på sletten der i 42 f.Kr. På sabbaten gikk de ut av byen til et bønnested ved elven og talte med kvinnene der; Lydia, en purpurhandlerske fra Tyatira som dyrket Gud, lyttet, Herren åpnet hennes hjerte, og hun og huset hennes ble døpt, og hun tok dem inn i sitt hus. Paulus drev en spådomsånd ut av en trellkvinne hvis spådommer skaffet herrene hennes stor fortjeneste; de slepte Paulus og Silas fram for byens øvrighet som jøder som skapte uro i byen. De to ble slått og kastet i det innerste fengselet med føttene i stokken. Ved midnatt, mens de ba og sang, åpnet et jordskjelv dørene; fangevokteren, som var i ferd med å ta livet av seg, ble stanset av Paulus og kom til tro med hele sitt hus. Dagen etter, da øvrigheten fikk vite at mennene de hadde latt slå, var romere, kom de og ba dem forlate byen."
      tl: "Mula sa Neapolis ay pumasok sila sa kalupaan patungong Filipos, isang pangunahing bayan sa purok na iyon ng Macedonia at isang koloniyang Romano, na pinanirahan pagkatapos ng mga labanan noong 42 BK sa kapatagan nito. Nang araw ng sabbath ay lumabas sila ng bayan sa isang mapapanalanginan sa tabi ng ilog at nakipagsalitaan sa mga babaing naroon; si Lidia, isang mangangalakal ng kayong kulay-ube na taga-Tiatira na sumasamba sa Diyos, ay nakinig, binuksan ng Panginoon ang kaniyang puso, at siya at ang kaniyang sangbahayan ay nabautismuhan at tinanggap sila sa kaniyang bahay. Pinalayas ni Pablo ang isang espiritu ng panghuhula mula sa isang aliping dalaga na ang panghuhula ay nagdadala ng maraming pakinabang sa kaniyang mga panginoon; kinaladkad nila sina Pablo at Silas sa harap ng mga hukom bilang mga Judiong nanggugulo sa bayan. Ang dalawa ay hinampas at ipinasok sa kalooblooban ng bilangguan, at piniit ang kanilang mga paa sa mga pangawan. Sa hatinggabi, habang sila'y nananalangin at umaawit, binuksan ng isang lindol ang mga pinto; ang tagapamahala ng bilangguan, na magpapakamatay sana, ay pinigilan ni Pablo at sumampalataya kasama ng kaniyang buong sangbahayan. Kinabukasan, nang malaman ng mga hukom na mga Romano ang mga lalaking kanilang hinampas, ay dumating sila at ipinamanhik na umalis sila sa bayan."
      da: "Fra Neapolis drog de ind i landet til Filippi, en af de førende byer i den del af Makedonien og en romersk koloni, grundlagt efter slagene på dens slette i 42 f.Kr. På sabbatten gik de uden for byen til et bedested ved en flod og talte til kvinderne der; Lydia, en purpurhandlerske fra Thyatira, som dyrkede Gud, lyttede, Herren åbnede hendes hjerte, og hun og hendes hus blev døbt og tog dem ind i sit hus. Paulus uddrev en spådomsånd af en slavepige, hvis spådomme skaffede hendes herrer stor fortjeneste; de slæbte Paulus og Silas frem for øvrigheden som jøder, der skabte uro i byen. De to blev pisket og kastet i det inderste fængsel med fødderne i blokken. Ved midnat, mens de bad og sang, åbnede et jordskælv dørene; fangevogteren, der ville dræbe sig selv, blev standset af Paulus og kom til tro med hele sit hus. Næste dag fik øvrigheden at vide, at de mænd, den havde ladet piske, var romere, og kom og bad dem forlade byen."
      sr: "Из Неапоља су отишли у унутрашњост, у Филипе, први град тог дела Македоније и римску колонију, насељену после битака 42. п. н. е. на његовој равници. У суботу су изашли изван града, на место молитве поред реке, и говорили женама које су се ту окупиле; Лидија, продавачица скерлета из Тијатире, која је поштовала Бога, слушала је, Господ јој је отворио срце, и она и њен дом крстили су се, а она их је примила у своју кућу. Павле је истерао дух погађачки из једне робиње чије је врачање доносило велики добитак њеним господарима; они су одвукли Павла и Силу пред власти као Јевреје који буне град. Обојица су шибани и бачени у најдоњу тамницу с ногама у кладама. У поноћ, док су се молили и певали, земљотрес је отворио врата; тамничара, који је хтео да се убије, зауставио је Павле, и он је поверовао са свим својим домом. Сутрадан су власти, сазнавши да су људи које су шибали Римљани, дошле и замолиле их да напусте град."
      hu: "Neapoliszból beljebb mentek Filippibe, Macedónia azon kerületének egyik vezető városába és római kolóniába, amelyet a síkságán Kr. e. 42-ben vívott csaták után telepítettek be. Szombaton kimentek a városból egy folyóparti imádkozóhelyre, és szóltak az ott lévő asszonyokhoz; Lídia, egy thiatirai bíborárus asszony, aki tisztelte Istent, hallgatta őket, az Úr megnyitotta a szívét, és ő meg a háza népe megkeresztelkedett, és házába fogadta őket. Pál kiűzte a jövendőmondás lelkét egy szolgálólányból, akinek jóslása sok hasznot hozott urainak; azok a hatóságok elé hurcolták Pált és Szilászt mint a várost felforgató zsidókat. Kettejüket megvesszőzték, és a belső börtönbe vetették, lábukat kalodába zárva. Éjfélkor, amikor imádkoztak és énekeltek, földrengés nyitotta meg az ajtókat; a börtönőrt, aki meg akarta ölni magát, Pál visszatartotta, és ő egész házanépével hitt. Másnap a hatóságok, megtudva, hogy akiket megvesszőztek, rómaiak, eljöttek, és kérték őket, hogy hagyják el a várost."
      fi: "Neapoliista he menivät sisämaahan Filippiin, joka oli Makedonian sen osan ensimmäisiä kaupunkeja ja roomalainen siirtokunta, perustettu sen tasangolla vuonna 42 eaa. käytyjen taistelujen jälkeen. Sapattina he menivät kaupungin ulkopuolelle joen rannalla olevaan rukouspaikkaan ja puhuivat siellä oleville naisille; tyatiralainen purppurakankaiden kauppias Lydia, joka palveli Jumalaa, kuunteli, Herra avasi hänen sydämensä, ja hänet ja hänen perhekuntansa kastettiin, ja hän otti heidät kotiinsa. Paavali ajoi tietäjähengen ulos orjatytöstä, jonka ennustaminen tuotti hänen isännilleen paljon tuloja; he raahasivat Paavalin ja Silaan päälliköiden eteen juutalaisina, jotka häiritsivät kaupungin rauhaa. Heitä lyötiin raipoilla, ja heidät heitettiin sisimpään vankihuoneeseen jalat jalkapuussa. Keskiyöllä, kun he rukoilivat ja lauloivat, maanjäristys avasi ovet; Paavali esti vanginvartijaa, joka aikoi surmata itsensä, ja tämä uskoi koko perhekuntansa kanssa. Seuraavana päivänä päälliköt saivat tietää, että miehet, joita he olivat lyöttäneet, olivat roomalaisia, ja tulivat pyytämään heitä lähtemään kaupungista."
      vi: "Từ Nê-a-bô-li họ đi vào nội địa đến Phi-líp, một thành hàng đầu của miền ấy thuộc xứ Ma-xê-đoan và là thuộc địa La Mã, được lập sau các trận đánh năm 42 TCN trên đồng bằng của thành. Ngày Sa-bát, họ ra ngoài thành đến một nơi cầu nguyện bên sông và giảng cho những phụ nữ ở đó; Ly-đi, một người buôn hàng sắc tía quê ở Thi-a-ti-rơ, vẫn kính sợ Đức Chúa Trời, lắng nghe, Chúa mở lòng cho bà, và bà cùng cả nhà chịu phép báp-tem rồi mời họ vào nhà mình. Phao-lô đuổi một quỷ bói khoa ra khỏi một đứa đầy tớ gái mà nghề bói của nó làm lợi lớn cho chủ; các chủ nó kéo Phao-lô và Si-la đến trước các quan như là người Giu-đa làm rối loạn thành. Hai người bị đánh đòn rồi bị bỏ vào ngục tối, chân bị tra vào cùm. Lúc nửa đêm, đang khi họ cầu nguyện và hát, một cơn động đất làm các cửa mở ra; người đề lao toan tự sát thì được Phao-lô ngăn lại, và người tin cùng cả nhà mình. Hôm sau, các quan biết những người mình đã đánh đòn là người Rô-ma, bèn đến xin họ lìa khỏi thành."
      ro: "De la Neapolis au mers spre interior la Filipi, cetate de frunte a acelui ținut al Macedoniei și colonie romană, populată după bătăliile din 42 î.Hr. de pe câmpia ei. În ziua sabatului au ieșit din cetate la un loc de rugăciune de lângă râu și le-au vorbit femeilor de acolo; Lidia, o negustoreasă de stofe de purpură din Tiatira, care se închina lui Dumnezeu, a ascultat, Domnul i-a deschis inima, iar ea și casa ei s-au botezat și i-au primit în casa ei. Pavel a scos un duh de ghicire dintr-o slujnică a cărei prezicere le aducea stăpânilor ei mult câștig; aceștia i-au târât pe Pavel și pe Sila înaintea dregătorilor ca pe niște iudei care tulburau cetatea. Cei doi au fost bătuți cu nuiele și aruncați în temnița cea dinăuntru, cu picioarele în butuci. La miezul nopții, pe când se rugau și cântau, un cutremur a deschis ușile; temnicerul, care era gata să se omoare, a fost oprit de Pavel și a crezut cu toată casa lui. A doua zi, dregătorii, aflând că oamenii pe care îi bătuseră erau romani, au venit și i-au rugat să plece din cetate."
      bg: "От Неапол те продължиха навътре в сушата към Филипи, първия град на онази част от Македония и римска колония, заселена след битките в равнината му през 42 г. пр.н.е. В събота излязоха вън от града при едно място за молитва край реката и говориха на жените там; Лидия, търговка на багреници от Тиатира, която почиташе Бога, слушаше, Господ отвори сърцето ѝ, тя и домът ѝ се кръстиха и тя ги прие в къщата си. Павел изгони дух на предсказване от една слугиня, чието гадаене носеше голяма печалба на господарите ѝ; те завлякоха Павел и Сила пред началниците като юдеи, които смущават града. Двамата бяха бити и хвърлени в най-вътрешната тъмница с нозе, стегнати в клада. В полунощ, докато се молеха и пееха, земетресение отвори вратите; тъмничният страж, който щеше да се самоубие, беше спрян от Павел и повярва с целия си дом. На следващия ден началниците, като научиха, че хората, които бяха били, са римляни, дойдоха и ги помолиха да напуснат града."
  - place: a4bdea7
    ref: Acts.17.1
    note:
