    story:
      en: "At Thessalonica, founded by Cassander about 315 BC and by then the seat of the Roman governor of Macedonia, there was a synagogue of the Jews. As was his custom, Paul went in and for three sabbaths reasoned with them from the Scriptures that the Christ had to suffer and rise from the dead, and that this Jesus was the Christ. Some of the Jews were persuaded, with a great number of God-fearing Greeks and not a few of the leading women. Jews who did not believe gathered a mob, set the city in an uproar and attacked the house of Jason; not finding Paul and Silas, they dragged Jason and some brothers before the city's rulers, the politarchs, as inscriptions of Thessalonica call them, crying that these men acted against the decrees of Caesar, saying there was another king, Jesus. Jason and the others had to give security before they were released."
      ru: "В Фессалонике, основанной Кассандром около 315 г. до н. э. и к тому времени ставшей резиденцией римского наместника Македонии, была иудейская синагога. По своему обыкновению Павел вошёл туда и три субботы рассуждал с ними по Писаниям, что Христу надлежало пострадать и воскреснуть из мёртвых и что этот Иисус и есть Христос. Некоторые из иудеев убедились, а также множество чтущих Бога эллинов и немало знатных женщин. Неуверовавшие иудеи собрали толпу, возмутили город и напали на дом Иасона; не найдя Павла и Силы, они повлекли Иасона и нескольких братьев к городским начальникам — политархам, как их называют надписи Фессалоники, — крича, что эти люди поступают против повелений кесаря, говоря, что есть другой царь, Иисус. Иасону и остальным пришлось дать залог, прежде чем их отпустили."
      uk: "У Солуні, заснованому Кассандром близько 315 р. до н. е. і на той час осідку римського намісника Македонії, була синагога юдеїв. За своїм звичаєм Павло ввійшов туди й три суботи міркував з ними на підставі Писань, що Христос мав постраждати й воскреснути з мертвих і що цей Ісус і є Христос. Дехто з юдеїв переконався, а з ними велика кількість богобійних греків і чимало знатних жінок. Юдеї, які не повірили, зібрали натовп, збурили місто й напали на дім Ясона; не знайшовши Павла й Сили, вони потягли Ясона й кількох братів до міських урядників — політархів, як їх називають написи Солуня, — кричачи, що ці люди діють проти постанов кесаря, кажучи, що є інший цар, Ісус. Ясон та інші мусили дати поруку, перш ніж їх відпустили."
      es: "En Tesalónica, fundada por Casandro hacia el 315 a.C. y para entonces sede del gobernador romano de Macedonia, había una sinagoga de los judíos. Como acostumbraba, Pablo entró y durante tres sábados discutió con ellos a partir de las Escrituras que el Cristo tenía que padecer y resucitar de los muertos, y que este Jesús era el Cristo. Algunos de los judíos se convencieron, junto con un gran número de griegos temerosos de Dios y no pocas mujeres principales. Los judíos que no creyeron reunieron una turba, alborotaron la ciudad y asaltaron la casa de Jasón; al no encontrar a Pablo y a Silas, arrastraron a Jasón y a algunos hermanos ante las autoridades de la ciudad, los politarcas, como los llaman las inscripciones de Tesalónica, gritando que aquellos hombres actuaban contra los decretos de César diciendo que había otro rey, Jesús. Jasón y los demás tuvieron que dar fianza antes de ser puestos en libertad."
      pt: "Em Tessalônica, fundada por Cassandro por volta de 315 a.C. e então sede do governador romano da Macedônia, havia uma sinagoga dos judeus. Segundo o seu costume, Paulo entrou e, durante três sábados, discutiu com eles a partir das Escrituras que o Cristo tinha de sofrer e ressuscitar dentre os mortos, e que este Jesus era o Cristo. Alguns dos judeus foram persuadidos, com uma grande multidão de gregos tementes a Deus e não poucas mulheres de destaque. Os judeus que não creram ajuntaram uma turba, alvoroçaram a cidade e invadiram a casa de Jasão; não encontrando Paulo e Silas, arrastaram Jasão e alguns irmãos perante as autoridades da cidade, os politarcas, como as inscrições de Tessalônica os chamam, gritando que aqueles homens agiam contra os decretos de César, dizendo que havia outro rei, Jesus. Jasão e os outros tiveram de dar fiança antes de serem soltos."
      de: "In Thessalonich, um 315 v. Chr. von Kassander gegründet und damals Sitz des römischen Statthalters von Mazedonien, gab es eine Synagoge der Juden. Wie es seine Gewohnheit war, ging Paulus hinein und redete an drei Sabbaten mit ihnen aus der Schrift und legte dar, dass der Christus leiden und von den Toten auferstehen musste und dass dieser Jesus der Christus sei. Einige der Juden ließen sich überzeugen, dazu eine große Menge gottesfürchtiger Griechen und nicht wenige der vornehmsten Frauen. Juden, die nicht glaubten, rotteten einen Haufen zusammen, brachten die Stadt in Aufruhr und stürmten das Haus Jasons; da sie Paulus und Silas nicht fanden, schleiften sie Jason und einige Brüder vor die Obersten der Stadt, die Politarchen, wie Inschriften aus Thessalonich sie nennen, und schrien, diese Männer handelten gegen die Gebote des Kaisers und sagten, ein anderer sei König, Jesus. Jason und die anderen mussten Bürgschaft leisten, bevor sie freigelassen wurden."
      fr: "À Thessalonique, fondée par Cassandre vers 315 av. J.-C. et alors siège du gouverneur romain de Macédoine, il y avait une synagogue des Juifs. Selon sa coutume, Paul y entra et, pendant trois sabbats, discuta avec eux d’après les Écritures, montrant que le Christ devait souffrir et ressusciter des morts, et que ce Jésus était le Christ. Quelques Juifs furent persuadés, avec une grande multitude de Grecs craignant Dieu et beaucoup de femmes de premier rang. Des Juifs qui ne crurent pas rassemblèrent une foule, mirent la ville en agitation et assaillirent la maison de Jason ; ne trouvant pas Paul et Silas, ils traînèrent Jason et quelques frères devant les magistrats de la ville, les politarques, comme les appellent les inscriptions de Thessalonique, en criant que ces hommes agissaient contre les édits de César, disant qu’il y avait un autre roi, Jésus. Jason et les autres durent fournir une caution avant d’être relâchés."
      pl: "W Tesalonice, założonej przez Kassandra około 315 p.n.e., a wówczas siedzibie rzymskiego namiestnika Macedonii, była synagoga żydowska. Paweł, zgodnie ze swoim zwyczajem, wszedł do niej i przez trzy szabaty rozprawiał z nimi na podstawie Pism, że Chrystus musiał cierpieć i powstać z martwych i że tym Chrystusem jest ten Jezus. Niektórzy z Żydów dali się przekonać, a wraz z nimi wielka liczba bogobojnych Greków i niemało znakomitych kobiet. Żydzi, którzy nie uwierzyli, zebrali tłum, wywołali w mieście zamieszki i napadli na dom Jazona; nie znalazłszy Pawła i Sylasa, zawlekli Jazona i kilku braci przed władze miasta, politarchów, jak nazywają ich napisy z Tesaloniki, krzycząc, że ci ludzie działają wbrew dekretom cesarza, mówiąc, że jest inny król, Jezus. Jazon i pozostali musieli złożyć poręczenie, zanim ich wypuszczono."
      it: "A Tessalonica, fondata da Cassandro verso il 315 a.C. e allora sede del governatore romano della Macedonia, c’era una sinagoga dei Giudei. Come era sua abitudine, Paolo vi entrò e per tre sabati discusse con loro in base alle Scritture, mostrando che il Cristo doveva soffrire e risuscitare dai morti, e che questo Gesù era il Cristo. Alcuni dei Giudei furono persuasi, con un gran numero di Greci timorati di Dio e non poche donne ragguardevoli. I Giudei che non avevano creduto radunarono una folla, misero in tumulto la città e assalirono la casa di Giasone; non trovando Paolo e Sila, trascinarono Giasone e alcuni fratelli davanti ai capi della città, i politarchi, come li chiamano le iscrizioni di Tessalonica, gridando che costoro agivano contro i decreti di Cesare, dicendo che c’era un altro re, Gesù. Giasone e gli altri dovettero dare una cauzione prima di essere rilasciati."
      nl: "Te Tessalonica, rond 315 v.Chr. gesticht door Cassander en toen de zetel van de Romeinse stadhouder van Macedonië, was een synagoge van de Joden. Zoals zijn gewoonte was, ging Paulus naar binnen en sprak drie sabbatten met hen uit de Schriften, en toonde aan dat de Christus moest lijden en opstaan uit de doden, en dat deze Jezus de Christus was. Sommigen van de Joden werden overtuigd, met een grote menigte godvrezende Grieken en niet weinig van de voornaamste vrouwen. Joden die niet geloofden, brachten een menigte op de been, zetten de stad in rep en roer en vielen het huis van Jason aan; toen zij Paulus en Silas niet vonden, sleepten zij Jason en enkele broeders voor de bestuurders van de stad, de politarchen, zoals inscripties uit Tessalonica hen noemen, en riepen dat deze mannen tegen de verordeningen van de keizer handelden en zeiden dat er een andere koning was, Jezus. Jason en de anderen moesten borg stellen voordat zij werden vrijgelaten."
      cs: "V Tesalonice, kterou založil Kassandros kolem roku 315 př. n. l. a která byla tehdy sídlem římského místodržitele Makedonie, byla židovská synagoga. Pavel podle svého zvyku vešel dovnitř a tři soboty s nimi rozmlouval na základě Písem, že Kristus musel trpět a vstát z mrtvých a že tento Ježíš je Kristus. Někteří ze Židů se dali přesvědčit, a s nimi velké množství bohabojných Řeků a nemálo předních žen. Židé, kteří neuvěřili, shromáždili dav, pobouřili město a napadli Jasónův dům; když nenašli Pavla a Silase, odvlekli Jasóna a několik bratrů před městské představené, politarchy, jak je nazývají nápisy z Tesaloniky, a křičeli, že tito lidé jednají proti císařovým nařízením, když říkají, že je jiný král, Ježíš. Jasón a ostatní museli složit záruku, než byli propuštěni."
      sv: "I Tessalonike, grundat av Kassandros omkring 315 f.Kr. och då säte för den romerske ståthållaren i Makedonien, fanns en judisk synagoga. Som han brukade gick Paulus in och samtalade under tre sabbater med dem utifrån skrifterna om att Messias måste lida och uppstå från de döda, och att denne Jesus var Messias. Några av judarna lät sig övertygas, liksom en stor mängd gudfruktiga greker och inte så få av de förnämsta kvinnorna. Judar som inte trodde samlade en folkhop, satte staden i uppror och anföll Jasons hus; när de inte fann Paulus och Silas släpade de Jason och några bröder inför stadens styresmän, politarkerna, som inskrifter från Tessalonike kallar dem, och ropade att dessa män handlade mot kejsarens påbud och sade att det fanns en annan konung, Jesus. Jason och de andra måste ställa borgen innan de släpptes."
      nb: "I Tessalonika, grunnlagt av Kassandros omkring 315 f.Kr. og da setet for den romerske stattholderen i Makedonia, var det en jødisk synagoge. Som han pleide, gikk Paulus inn og samtalte i tre sabbater med dem ut fra skriftene om at Messias måtte lide og stå opp fra de døde, og at denne Jesus var Messias. Noen av jødene lot seg overbevise, sammen med en stor mengde gudfryktige grekere og ikke så få av de fremste kvinnene. Jøder som ikke trodde, samlet en mobb, satte byen i opprør og angrep Jasons hus; da de ikke fant Paulus og Silas, slepte de Jason og noen brødre fram for byens styresmenn, politarkene, som innskrifter fra Tessalonika kaller dem, og ropte at disse mennene handlet mot keiserens forordninger og sa at det fantes en annen konge, Jesus. Jason og de andre måtte stille sikkerhet før de ble løslatt."
      tl: "Sa Tesalonica, na itinatag ni Cassander noong mga 315 BK at noon ay luklukan ng Romanong gobernador ng Macedonia, ay may isang sinagoga ng mga Judio. Ayon sa kaniyang ugali ay pumasok si Pablo at sa tatlong sabbath ay nangatuwiran sa kanila mula sa mga Kasulatan na kinakailangang si Cristo ay maghirap at muling mabuhay mula sa mga patay, at na itong si Jesus ang siyang Cristo. Nahikayat ang ilan sa mga Judio, kasama ang lubhang maraming Griegong sumasamba sa Diyos at hindi kakaunting mararangal na babae. Nagtipon ng isang karamihan ang mga Judiong hindi sumampalataya, ginulo ang bayan at nilusob ang bahay ni Jason; nang hindi masumpungan sina Pablo at Silas, kinaladkad nila si Jason at ang ilang kapatid sa harap ng mga punong bayan, ang mga politarka, gaya ng tawag sa kanila ng mga inskripsiyon ng Tesalonica, na isinisigaw na ang mga taong ito ay gumagawa laban sa mga utos ni Cesar, na nagsasabing may ibang hari, si Jesus. Kinailangang magbigay ng piyansa si Jason at ang iba bago sila pinalaya."
      da: "I Thessalonika, grundlagt af Kassander omkring 315 f.Kr. og på den tid sæde for den romerske statholder i Makedonien, var der en synagoge for jøderne. Efter sin vane gik Paulus derind og drøftede på tre sabbatter med dem ud fra Skrifterne, at Kristus måtte lide og opstå fra de døde, og at denne Jesus var Kristus. Nogle af jøderne blev overbevist, sammen med en stor mængde gudfrygtige grækere og ikke få af de fornemste kvinder. Jøder, som ikke troede, samlede en hob, bragte byen i oprør og stormede Jasons hus; da de ikke fandt Paulus og Silas, slæbte de Jason og nogle brødre frem for byens øvrighed, politarkerne, som indskrifter fra Thessalonika kalder dem, og råbte, at disse mænd handlede imod kejserens befalinger og sagde, at der var en anden konge, Jesus. Jason og de andre måtte stille sikkerhed, før de blev løsladt."
      sr: "У Солуну, који је основао Касандар око 315. п. н. е. и који је тада био седиште римског намесника Македоније, била је јеврејска синагога. По свом обичају Павле је ушао и три суботе разговарао с њима из Писма да је Христос морао пострадати и васкрснути из мртвих, и да је овај Исус Христос. Неки од Јевреја били су уверени, а с њима и велико мноштво побожних Грка и не мало угледних жена. Јевреји који нису поверовали скупили су руљу, узбунили град и напали кућу Јасонову; не нашавши Павла и Силу, одвукли су Јасона и неке од браће пред градске старешине, политархе, како их зову натписи Солуна, вичући да ови људи раде против ћесаревих заповести, говорећи да има други цар, Исус. Јасон и остали морали су да дају јемство пре него што су пуштени."
      hu: "Thesszalonikában, amelyet Kasszandrosz alapított Kr. e. 315 körül, és amely ekkor már Macedónia római helytartójának székhelye volt, volt a zsidóknak zsinagógája. Pál szokása szerint bement, és három szombaton át az Írásokból érvelt nekik, hogy a Krisztusnak szenvednie kellett, és fel kellett támadnia a halálból, és hogy ez a Jézus a Krisztus. A zsidók közül némelyek meggyőződtek, és velük az istenfélő görögök nagy sokasága és az előkelő asszonyok közül nem kevesen. A nem hívő zsidók csőcseléket gyűjtöttek, felháborították a várost, és megrohanták Jáson házát; mivel Pált és Szilászt nem találták, Jásont és néhány testvért a város elöljárói, a thesszalonikai feliratok szóhasználatával a politarchék elé hurcolták, azt kiáltozva, hogy ezek az emberek a császár rendeletei ellen cselekszenek, mert azt mondják, hogy van egy másik király, Jézus. Jásonnak és a többieknek biztosítékot kellett adniuk, mielőtt elengedték őket."
      fi: "Tessalonikassa, jonka Kassandros perusti noin 315 eaa. ja joka oli siihen aikaan Makedonian roomalaisen käskynhaltijan istuinpaikka, oli juutalaisten synagoga. Tapansa mukaan Paavali meni sinne ja keskusteli kolmena sapattina heidän kanssaan kirjoitusten pohjalta osoittaen, että Kristuksen piti kärsiä ja nousta kuolleista ja että tämä Jeesus oli Kristus. Osa juutalaisista vakuuttui, ja samoin suuri joukko jumalaapelkääväisiä kreikkalaisia ja useat johtavat naiset. Juutalaiset, jotka eivät uskoneet, kokosivat väkijoukon, saivat kaupungin kuohuksiin ja hyökkäsivät Jasonin talolle; kun he eivät löytäneet Paavalia ja Silasta, he raahasivat Jasonin ja muutamia veljiä kaupungin hallitusmiesten, politarkkien, kuten Tessalonikan kirjoitukset heitä kutsuvat, eteen ja huusivat, että nämä miehet toimivat keisarin asetuksia vastaan sanoen, että oli toinen kuningas, Jeesus. Jasonin ja muiden oli annettava takaus, ennen kuin heidät päästettiin vapaiksi."
      vi: "Tại Tê-sa-lô-ni-ca, thành do Cassander lập khoảng năm 315 TCN và lúc ấy là nơi đóng trụ sở của quan tổng đốc La Mã xứ Ma-xê-đoan, có một nhà hội của người Giu-đa. Theo thói quen, Phao-lô vào đó và trong ba ngày Sa-bát lấy Kinh Thánh biện luận với họ rằng Đấng Christ phải chịu thương khó và từ kẻ chết sống lại, và Đức Chúa Giê-su nầy là Đấng Christ. Một vài người Giu-đa được thuyết phục, cùng rất nhiều người Gờ-réc kính sợ Đức Chúa Trời và không ít phụ nữ sang trọng. Những người Giu-đa không tin tụ tập một đám đông, gây loạn trong thành và xông vào nhà Gia-sôn; không tìm được Phao-lô và Si-la, họ kéo Gia-sôn và mấy anh em đến trước các nhà cầm quyền của thành, là các politarch, như các bia khắc của Tê-sa-lô-ni-ca gọi họ, la lên rằng những người này làm nghịch mạng Sê-sa, nói rằng có một vua khác là Giê-su. Gia-sôn và những người kia phải nộp tiền bảo lãnh mới được thả."
      ro: "La Tesalonic, întemeiat de Casandru pe la 315 î.Hr. și pe atunci reședința guvernatorului roman al Macedoniei, era o sinagogă a iudeilor. După obiceiul său, Pavel a intrat și trei sabate a discutat cu ei din Scripturi, arătând că Hristos trebuia să pătimească și să învieze din morți și că acest Isus este Hristosul. Unii dintre iudei s-au lăsat convinși, împreună cu o mare mulțime de greci temători de Dumnezeu și nu puține femei de frunte. Iudeii care nu credeau au strâns o gloată, au întărâtat cetatea și au năvălit asupra casei lui Iason; negăsindu-i pe Pavel și pe Sila, i-au târât pe Iason și pe câțiva frați înaintea mai-marilor cetății, politarhii, cum îi numesc inscripțiile din Tesalonic, strigând că acești oameni lucrează împotriva poruncilor Cezarului, spunând că este un alt împărat, Isus. Iason și ceilalți au trebuit să dea chezășie înainte de a fi lăsați liberi."
      bg: "В Солун, основан от Касандър около 315 г. пр.н.е. и по това време седалище на римския управител на Македония, имаше юдейска синагога. По обичая си Павел влезе и в продължение на три съботи разискваше с тях от Писанията, че Христос трябваше да пострада и да възкръсне от мъртвите и че този Исус е Христос. Някои от юдеите се убедиха, а с тях и голямо множество богобоязливи гърци и не малко от първенките. Юдеите, които не повярваха, събраха тълпа, размириха града и нападнаха къщата на Язон; като не намериха Павел и Сила, завлякоха Язон и някои от братята пред управниците на града — политарсите, както ги наричат надписите от Солун, — като викаха, че тези хора действат против повеленията на Кесаря и казват, че има друг цар, Исус. Язон и другите трябваше да дадат поръчителство, преди да бъдат пуснати."
  - place: a62fe31
    ref: Acts.17.10-Acts.17.14
    note:
      en: "The Bereans search the Scriptures daily."
      ru: "Верийцы ежедневно разбирают Писания."
      uk: "Береяни щодня досліджують Писання."
      es: "Los de Berea escudriñan cada día las Escrituras."
      pt: "Os bereanos examinam as Escrituras diariamente."
      de: "Die Beröer forschen täglich in der Schrift."
      fr: "Les Béréens examinent chaque jour les Écritures."
      pl: "Berejczycy codziennie badają Pisma."
      it: "I Berei esaminano ogni giorno le Scritture."
      nl: "De Bereeërs onderzoeken dagelijks de Schriften."
      cs: "Beroijští denně zkoumají Písma."
      sv: "Beroiaborna rannsakar skrifterna varje dag."
      nb: "Berøerne gransker skriftene daglig."
      tl: "Sinasaliksik araw-araw ng mga taga-Berea ang mga Kasulatan."
      da: "Beræerne gransker Skrifterne dagligt."
      sr: "Веријци свакога дана истражују Писма."
      hu: "A beroiaiak naponta kutatják az Írásokat."
      fi: "Beroialaiset tutkivat kirjoituksia päivittäin."
      vi: "Người Bê-rê ngày ngày tra xem Kinh Thánh."
      ro: "Bereenii cercetează Scripturile în fiecare zi."
      bg: "Верийците изследват Писанията всеки ден."
    story:
      en: "The brothers sent Paul and Silas away by night to Berea, today Veria, on the slope of Mount Bermion west of Thessalonica. There the Jews of the synagogue received the word eagerly and examined the Scriptures every day to see whether these things were so; many believed, with not a few Greek women of standing and men. When the Jews of Thessalonica heard of it, they came and stirred up the crowds, and the brothers at once sent Paul off towards the sea, while Silas and Timothy stayed behind."
      ru: "Братья ночью отправили Павла и Силу в Верию, которая и ныне носит это имя, на склоне горы Вермион к западу от Фессалоники. Там иудеи синагоги приняли слово с усердием и ежедневно исследовали Писания, так ли это; многие уверовали, а также немало знатных эллинских женщин и мужчин. Когда фессалоникские иудеи узнали об этом, они пришли и стали возмущать толпы, и братья тотчас отправили Павла к морю, а Сила и Тимофей остались там."
      uk: "Брати вночі вислали Павла й Силу до Верії, що й нині має цю назву, на схилі гори Вермій на захід від Солуня. Там юдеї синагоги прийняли слово з охотою й щодня досліджували Писання, чи так воно є; багато хто увірував, а також чимало знатних грецьких жінок і чоловіків. Коли солунські юдеї почули про це, вони прийшли й підбурили натовпи, і брати одразу відіслали Павла до моря, а Сила й Тимофій залишилися там."
      es: "Los hermanos enviaron de noche a Pablo y a Silas a Berea, hoy Veria, en la ladera del monte Bermio, al oeste de Tesalónica. Allí los judíos de la sinagoga recibieron la palabra con avidez y examinaban cada día las Escrituras para ver si estas cosas eran así; muchos creyeron, junto con no pocas mujeres griegas distinguidas y hombres. Cuando los judíos de Tesalónica lo supieron, vinieron y agitaron a las multitudes, y los hermanos enviaron enseguida a Pablo hacia el mar, mientras Silas y Timoteo se quedaban allí."
      pt: "Os irmãos enviaram Paulo e Silas de noite para Bereia, hoje Véria, na encosta do monte Bérmio, a oeste de Tessalônica. Ali os judeus da sinagoga receberam a palavra com avidez e examinavam as Escrituras todos os dias para ver se estas coisas eram assim; muitos creram, com não poucas mulheres gregas de destaque e homens. Quando os judeus de Tessalônica souberam disso, vieram e agitaram as multidões, e os irmãos enviaram imediatamente Paulo em direção ao mar, enquanto Silas e Timóteo ficaram lá."
      de: "Die Brüder schickten Paulus und Silas bei Nacht nach Beröa, dem heutigen Veria, am Hang des Bermion westlich von Thessalonich. Dort nahmen die Juden der Synagoge das Wort bereitwillig auf und forschten täglich in der Schrift, ob es sich so verhielte; viele kamen zum Glauben, dazu nicht wenige angesehene griechische Frauen und Männer. Als die Juden von Thessalonich davon hörten, kamen sie und wiegelten die Menge auf, und die Brüder schickten Paulus sogleich fort zum Meer, während Silas und Timotheus zurückblieben."
      fr: "Les frères firent partir de nuit Paul et Silas pour Bérée, aujourd’hui Véria, sur le versant du mont Bermion, à l’ouest de Thessalonique. Là, les Juifs de la synagogue reçurent la parole avec empressement et examinaient chaque jour les Écritures pour voir si ce qu’on leur disait était exact ; beaucoup crurent, ainsi que bon nombre de femmes grecques de distinction et d’hommes. Quand les Juifs de Thessalonique l’apprirent, ils vinrent agiter la foule, et les frères firent aussitôt partir Paul du côté de la mer, tandis que Silas et Timothée restaient sur place."
      pl: "Bracia wysłali Pawła i Sylasa nocą do Berei, dziś Weria, na zboczu góry Bermion na zachód od Tesaloniki. Tam Żydzi z synagogi przyjęli słowo z zapałem i codziennie badali Pisma, czy tak jest istotnie; wielu uwierzyło, a z nimi niemało szanowanych greckich kobiet i mężczyzn. Gdy Żydzi z Tesaloniki dowiedzieli się o tym, przyszli i podburzyli tłumy, a bracia natychmiast wyprawili Pawła w stronę morza, podczas gdy Sylas i Tymoteusz zostali na miejscu."
      it: "I fratelli fecero partire di notte Paolo e Sila per Berea, oggi Veria, sul pendio del monte Bermio a ovest di Tessalonica. Lì i Giudei della sinagoga accolsero la parola con prontezza ed esaminavano ogni giorno le Scritture per vedere se le cose stavano così; molti credettero, con non poche donne greche ragguardevoli e uomini. Quando i Giudei di Tessalonica lo seppero, vennero ad agitare le folle, e i fratelli fecero subito partire Paolo verso il mare, mentre Sila e Timoteo rimasero lì."
      nl: "De broeders zonden Paulus en Silas 's nachts weg naar Berea, het huidige Veria, op de helling van de berg Bermion ten westen van Tessalonica. Daar namen de Joden van de synagoge het woord gretig aan en onderzochten dagelijks de Schriften of deze dingen zo waren; velen kwamen tot geloof, met niet weinig aanzienlijke Griekse vrouwen en mannen. Toen de Joden van Tessalonica ervan hoorden, kwamen zij en hitsten de scharen op, en de broeders zonden Paulus terstond weg naar de zee, terwijl Silas en Timoteüs achterbleven."
      cs: "Bratři poslali Pavla a Silase v noci do Beroie, dnešní Verie, na úbočí hory Bermion západně od Tesaloniky. Tam Židé ze synagogy přijali slovo s ochotou a denně zkoumali Písma, zda je tomu tak; mnozí uvěřili, a s nimi nemálo vážených řeckých žen i mužů. Když se o tom dozvěděli Židé z Tesaloniky, přišli a poštvali zástupy, a bratři ihned poslali Pavla směrem k moři, zatímco Silas a Timoteus zůstali na místě."
      sv: "Bröderna sände om natten i väg Paulus och Silas till Beroia, i dag Veria, på sluttningen av berget Bermion väster om Tessalonike. Där tog judarna i synagogan villigt emot ordet och rannsakade skrifterna varje dag för att se om det förhöll sig så; många kom till tro, liksom inte så få ansedda grekiska kvinnor och män. När judarna i Tessalonike hörde det, kom de dit och uppviglade folkmassorna, och bröderna sände genast i väg Paulus mot havet, medan Silas och Timoteus stannade kvar."
      nb: "Brødrene sendte Paulus og Silas av sted om natten til Berøa, i dag Veria, i skråningen av fjellet Bermion vest for Tessalonika. Der tok jødene i synagogen ivrig imot ordet og gransket skriftene hver dag for å se om det forholdt seg slik; mange kom til tro, sammen med ikke så få ansette greske kvinner og menn. Da jødene i Tessalonika hørte om det, kom de og egget opp folkemengdene, og brødrene sendte straks Paulus av sted mot havet, mens Silas og Timoteus ble igjen."
      tl: "Pinayaon ng mga kapatid sa gabi sina Pablo at Silas sa Berea, na ngayo'y Veria, sa dalisdis ng bundok Bermion sa kanluran ng Tesalonica. Doon ay tinanggap ng mga Judio sa sinagoga ang salita nang buong pagsisikap at sinisiyasat araw-araw ang mga Kasulatan kung tunay nga ang mga bagay na ito; marami ang sumampalataya, kasama ang hindi kakaunting mga babaing Griega na may mataas na kalagayan at mga lalaki. Nang mabalitaan ito ng mga Judio sa Tesalonica, dumating sila at inudyukan ang mga karamihan, at pagdaka'y pinayaon ng mga kapatid si Pablo patungo sa dagat, samantalang naiwan sina Silas at Timoteo."
      da: "Brødrene sendte Paulus og Silas bort om natten til Berøa, i dag Veria, på skråningen af bjerget Bermion vest for Thessalonika. Der tog jøderne i synagogen ivrigt imod ordet og ransagede dagligt Skrifterne for at se, om det forholdt sig sådan; mange troede, sammen med ikke få fornemme græske kvinder og mænd. Da jøderne i Thessalonika hørte om det, kom de og ophidsede skarerne, og brødrene sendte straks Paulus af sted mod havet, mens Silas og Timotheus blev tilbage."
      sr: "Браћа су ноћу оправила Павла и Силу у Верију, која и данас носи то име, на падини планине Бермион западно од Солуна. Тамо су Јевреји из синагоге примили реч са свим срцем и сваки дан истраживали Писмо да ли је то тако; многи су поверовали, а с њима и не мало угледних грчких жена и људи. Кад су солунски Јевреји то чули, дошли су и побунили народ, а браћа су одмах послала Павла према мору, док су Сила и Тимотије остали тамо."
      hu: "A testvérek éjjel Bereába, a mai Vériába küldték Pált és Szilászt, amely a Bermion-hegy lejtőjén fekszik, Thesszalonikától nyugatra. Ott a zsinagóga zsidói buzgón fogadták az igét, és mindennap vizsgálták az Írásokat, hogy valóban így van-e; sokan hittek, és velük nem kevés előkelő görög asszony és férfi. Amikor a thesszalonikai zsidók ezt meghallották, odajöttek, és felizgatták a sokaságot, a testvérek pedig Pált azonnal elküldték a tenger felé, Szilász és Timóteus pedig ott maradt."
      fi: "Veljet lähettivät Paavalin ja Silaan yöllä Beroiaan, nykyiseen Veriaan, Bermion-vuoren rinteelle Tessalonikasta länteen. Siellä synagogan juutalaiset ottivat sanan halukkaasti vastaan ja tutkivat joka päivä kirjoituksia nähdäkseen, oliko asia niin; monet uskoivat, ja samoin useat arvossa pidetyt kreikkalaiset naiset ja miehet. Kun Tessalonikan juutalaiset kuulivat siitä, he tulivat ja kiihottivat kansanjoukkoja, ja veljet lähettivät heti Paavalin matkaan meren suuntaan, mutta Silas ja Timoteus jäivät sinne."
      vi: "Anh em đưa Phao-lô và Si-la đi trong đêm đến Bê-rê, nay là Veria, trên sườn núi Bermion ở phía tây Tê-sa-lô-ni-ca. Tại đó, người Giu-đa trong nhà hội sẵn lòng nhận lấy đạo và ngày nào cũng tra xem Kinh Thánh để xét những điều ấy có thật chăng; nhiều người tin theo, cùng không ít phụ nữ Gờ-réc sang trọng và đàn ông. Khi người Giu-đa ở Tê-sa-lô-ni-ca hay biết, họ đến xui giục đoàn dân, và anh em lập tức đưa Phao-lô đi về phía biển, còn Si-la và Ti-mô-thê ở lại."
      ro: "Frații i-au trimis noaptea pe Pavel și pe Sila la Berea, astăzi Veria, pe povârnișul muntelui Bermion, la vest de Tesalonic. Acolo iudeii din sinagogă au primit cuvântul cu toată râvna și cercetau Scripturile în fiecare zi, ca să vadă dacă lucrurile sunt așa; mulți au crezut, împreună cu nu puține femei grecoaice de vază și bărbați. Când au aflat iudeii din Tesalonic, au venit și au întărâtat mulțimile, iar frații l-au trimis îndată pe Pavel spre mare, în timp ce Sila și Timotei au rămas acolo."
      bg: "Братята изпратиха Павел и Сила през нощта във Верия, която и днес носи това име, на склона на планината Бермион на запад от Солун. Там юдеите от синагогата приеха словото с усърдие и всеки ден изследваха Писанията дали това е така; мнозина повярваха, а също и не малко знатни гъркини и мъже. Когато солунските юдеи научиха за това, дойдоха и разбунтуваха множествата, и братята веднага изпратиха Павел към морето, а Сила и Тимотей останаха там."
  - place: a1fe6e7
    ref: Acts.17.15-Acts.17.34
    by: untold
    note:
      en: "Paul at the Areopagus."
      ru: "Павел в Ареопаге."
      uk: "Павло на Ареопазі."
      es: "Pablo en el Areópago."
      pt: "Paulo no Areópago."
      de: "Paulus auf dem Areopag."
      fr: "Paul à l’Aréopage."
      pl: "Paweł na Areopagu."
      it: "Paolo all’Areòpago."
      nl: "Paulus op de Areopagus."
      cs: "Pavel na Areopagu."
      sv: "Paulus på Areopagen."
      nb: "Paulus på Areopagos."
      tl: "Si Pablo sa Areopago."
      da: "Paulus på Areopagos."
      sr: "Павле на Ареопагу."
      hu: "Pál az Areopáguszon."
      fi: "Paavali Areiopagilla."
      vi: "Phao-lô tại A-rê-ô-ba-gơ."
      ro: "Pavel în Areopag."
      bg: "Павел в Ареопага."
    story:
      en: "Those who escorted Paul brought him to Athens; the text does not say whether they went by sea or by land. Waiting there for Silas and Timothy, Paul was troubled to see the city full of idols. He reasoned in the synagogue with the Jews and the devout, and every day in the marketplace with whoever was there; Epicurean and Stoic philosophers met him and brought him to the Areopagus to hear his new teaching. Paul spoke of the unknown God whom they worshipped without knowing him, the Maker of the world, who now calls all people to repent and has appointed a day of judgement by the man he raised from the dead. At the mention of the resurrection some mocked, others said they would hear him again, and some joined him and believed, among them Dionysius the Areopagite and a woman named Damaris."
      ru: "Сопровождавшие Павла довели его до Афин; текст не говорит, шли ли они морем или сушей. Ожидая там Силу и Тимофея, Павел возмутился духом, видя город, полный идолов. Он рассуждал в синагоге с иудеями и чтущими Бога, а ежедневно на площади — со всеми, кто там был; эпикурейские и стоические философы встретились с ним и привели его в ареопаг, чтобы услышать его новое учение. Павел говорил о неведомом Боге, Которого они чтили, не зная Его, Творце мира, Который ныне призывает всех людей покаяться и назначил день суда через Мужа, Которого воскресил из мёртвых. Услышав о воскресении, одни насмехались, другие говорили, что послушают его в другой раз, а некоторые присоединились к нему и уверовали, среди них Дионисий Ареопагит и женщина по имени Дамарь."
      uk: "Ті, хто супроводжував Павла, довели його до Афін; текст не каже, чи йшли вони морем, чи суходолом. Чекаючи там на Силу й Тимофія, Павло був стривожений, бачачи місто, повне ідолів. Він міркував у синагозі з юдеями й побожними, а щодня на майдані — з усіма, хто там був; філософи-епікурейці й стоїки зустрілися з ним і привели його на Ареопаг, щоб почути його нову науку. Павло говорив про невідомого Бога, Якому вони поклонялися, не знаючи Його, Творця світу, Який нині кличе всіх людей покаятися і призначив день суду через Мужа, Якого воскресив з мертвих. Почувши про воскресіння, одні глузували, інші казали, що послухають його іншим разом, а деякі пристали до нього й увірували, серед них Діонісій Ареопагіт і жінка на ім’я Дамара."
      es: "Los que acompañaban a Pablo lo llevaron hasta Atenas; el texto no dice si fueron por mar o por tierra. Mientras esperaba allí a Silas y a Timoteo, a Pablo le dolía ver la ciudad llena de ídolos. Discutía en la sinagoga con los judíos y los piadosos, y cada día en la plaza con quienes se encontraban allí; filósofos epicúreos y estoicos se toparon con él y lo llevaron al Areópago para oír su nueva doctrina. Pablo habló del Dios no conocido al que honraban sin conocerlo, el Hacedor del mundo, que ahora llama a todos los hombres a arrepentirse y ha fijado un día de juicio por medio del hombre al que resucitó de los muertos. Al oír hablar de la resurrección, unos se burlaron, otros dijeron que lo oirían otra vez, y algunos se unieron a él y creyeron, entre ellos Dionisio el del Areópago y una mujer llamada Dámaris."
      pt: "Os que escoltavam Paulo levaram-no até Atenas; o texto não diz se foram por mar ou por terra. Enquanto esperava ali por Silas e Timóteo, Paulo indignava-se ao ver a cidade cheia de ídolos. Discutia na sinagoga com os judeus e os devotos, e todos os dias na praça com quem ali estivesse; filósofos epicureus e estoicos encontraram-se com ele e o levaram ao Areópago para ouvir o seu novo ensino. Paulo falou do Deus desconhecido a quem adoravam sem o conhecer, o Criador do mundo, que agora chama todas as pessoas ao arrependimento e determinou um dia de juízo por meio do homem que ressuscitou dentre os mortos. Ao ouvirem falar da ressurreição, alguns zombaram, outros disseram que o ouviriam novamente, e alguns se juntaram a ele e creram, entre eles Dionísio, o areopagita, e uma mulher chamada Dâmaris."
      de: "Die Paulus geleiteten, brachten ihn nach Athen; der Text sagt nicht, ob sie auf dem See- oder auf dem Landweg reisten. Während er dort auf Silas und Timotheus wartete, ergrimmte Paulus, als er die Stadt voller Götzenbilder sah. Er redete in der Synagoge mit den Juden und den Gottesfürchtigen und täglich auf dem Markt mit allen, die sich dort einfanden; epikureische und stoische Philosophen trafen auf ihn und brachten ihn auf den Areopag, um seine neue Lehre zu hören. Paulus sprach von dem unbekannten Gott, den sie verehrten, ohne ihn zu kennen, dem Schöpfer der Welt, der nun alle Menschen zur Umkehr ruft und einen Tag des Gerichts bestimmt hat durch den Mann, den er von den Toten auferweckt hat. Als von der Auferstehung die Rede war, spotteten einige, andere sagten, sie wollten ihn noch einmal hören, und einige schlossen sich ihm an und wurden gläubig, unter ihnen Dionysius der Areopagit und eine Frau namens Damaris."
      fr: "Ceux qui accompagnaient Paul le conduisirent jusqu’à Athènes ; le texte ne dit pas s’ils allèrent par mer ou par terre. En y attendant Silas et Timothée, Paul fut irrité de voir la ville pleine d’idoles. Il discutait dans la synagogue avec les Juifs et les hommes craignant Dieu, et chaque jour sur la place publique avec ceux qui s’y trouvaient ; des philosophes épicuriens et stoïciens le rencontrèrent et le menèrent à l’Aréopage pour entendre sa nouvelle doctrine. Paul parla du dieu inconnu qu’ils révéraient sans le connaître, le Créateur du monde, qui appelle maintenant tous les hommes à se repentir et a fixé un jour de jugement par l’homme qu’il a ressuscité des morts. À la mention de la résurrection, les uns se moquèrent, d’autres dirent qu’ils l’entendraient encore, et quelques-uns s’attachèrent à lui et crurent, parmi lesquels Denys l’aréopagite et une femme nommée Damaris."
      pl: "Ci, którzy odprowadzali Pawła, zaprowadzili go do Aten; tekst nie mówi, czy podróżowali morzem, czy lądem. Czekając tam na Sylasa i Tymoteusza, Paweł oburzał się, widząc miasto pełne bożków. Rozprawiał w synagodze z Żydami i bogobojnymi, a codziennie na rynku z każdym, kogo tam spotkał; epikurejscy i stoiccy filozofowie spotkali się z nim i zaprowadzili go na Areopag, by usłyszeć jego nową naukę. Paweł mówił o nieznanym Bogu, którego czcili, nie znając Go, o Stwórcy świata, który teraz wzywa wszystkich ludzi do nawrócenia i wyznaczył dzień sądu przez człowieka, którego wskrzesił z martwych. Na wzmiankę o zmartwychwstaniu jedni drwili, inni mówili, że posłuchają go jeszcze, a niektórzy przyłączyli się do niego i uwierzyli, wśród nich Dionizy Areopagita i kobieta imieniem Damaris."
      it: "Quelli che accompagnavano Paolo lo condussero ad Atene; il testo non dice se vi andarono per mare o per terra. Mentre aspettava lì Sila e Timoteo, Paolo si inaspriva vedendo la città piena di idoli. Discuteva nella sinagoga con i Giudei e con i timorati di Dio, e ogni giorno nella piazza con chi vi si trovava; filosofi epicurei e stoici lo incontrarono e lo condussero all’Areòpago per udire la sua nuova dottrina. Paolo parlò del Dio sconosciuto che essi adoravano senza conoscerlo, il Creatore del mondo, che ora chiama tutti gli uomini a ravvedersi e ha stabilito un giorno di giudizio per mezzo dell’uomo che ha risuscitato dai morti. Alla menzione della risurrezione alcuni lo derisero, altri dissero che lo avrebbero ascoltato di nuovo, e alcuni si unirono a lui e credettero, fra i quali Dionisio l’Areopagita e una donna chiamata Damaris."
      nl: "Zij die Paulus begeleidden, brachten hem naar Athene; de tekst zegt niet of zij over zee of over land reisden. Terwijl hij daar op Silas en Timoteüs wachtte, werd Paulus diep bewogen toen hij zag dat de stad vol afgodsbeelden was. Hij sprak in de synagoge met de Joden en de godvrezenden, en dagelijks op de markt met wie er maar was; epicurische en stoïsche filosofen kwamen hem tegen en brachten hem naar de Areopagus om zijn nieuwe leer te horen. Paulus sprak over de onbekende God die zij vereerden zonder Hem te kennen, de Maker van de wereld, die nu alle mensen oproept zich te bekeren en een dag van het oordeel heeft bepaald door de man die Hij uit de doden heeft opgewekt. Bij de vermelding van de opstanding spotten sommigen, anderen zeiden dat zij hem nog eens wilden horen, en sommigen sloten zich bij hem aan en kwamen tot geloof, onder wie Dionysius de Areopagiet en een vrouw genaamd Damaris."
      cs: "Ti, kdo Pavla doprovázeli, ho přivedli do Atén; text neříká, zda šli po moři, či po souši. Zatímco tam čekal na Silase a Timotea, Pavla rmoutilo, že vidí město plné model. Rozmlouval v synagoze se Židy a s bohabojnými a denně na tržišti s každým, kdo tam byl; epikurejští a stoičtí filozofové se s ním setkali a přivedli ho na Areopag, aby slyšeli jeho nové učení. Pavel mluvil o neznámém Bohu, jehož ctili, aniž ho znali, o Stvořiteli světa, který nyní vyzývá všechny lidi k pokání a určil den soudu skrze muže, kterého vzkřísil z mrtvých. Při zmínce o vzkříšení se jedni posmívali, jiní říkali, že ho uslyší ještě jindy, a někteří se k němu přidali a uvěřili, mezi nimi Dionýsios Areopagita a žena jménem Damaris."
      sv: "De som ledsagade Paulus förde honom till Aten; texten säger inte om de reste sjövägen eller landvägen. Medan Paulus väntade där på Silas och Timoteus upprördes han av att se staden full av avgudabilder. Han samtalade i synagogan med judarna och de gudfruktiga och varje dag på torget med dem som fanns där; epikureiska och stoiska filosofer mötte honom och förde honom till Areopagen för att höra hans nya lära. Paulus talade om den okände Guden som de dyrkade utan att känna honom, världens skapare, som nu kallar alla människor till bättring och har fastställt en domens dag genom den man som han har uppväckt från de döda. När uppståndelsen nämndes hånade somliga, andra sade att de ville höra honom igen, och några slöt sig till honom och kom till tro, bland dem Dionysios areopagiten och en kvinna som hette Damaris."
      nb: "De som fulgte Paulus, førte ham til Aten; teksten sier ikke om de reiste sjøveien eller landeveien. Mens Paulus ventet der på Silas og Timoteus, ble han opprørt over å se byen full av avgudsbilder. Han samtalte i synagogen med jødene og de gudfryktige, og hver dag på torget med dem som var der; epikureiske og stoiske filosofer møtte ham og førte ham til Areopagos for å høre hans nye lære. Paulus talte om den ukjente Gud som de dyrket uten å kjenne ham, verdens skaper, som nå kaller alle mennesker til omvendelse og har fastsatt en dommens dag ved den mann han oppreiste fra de døde. Da oppstandelsen ble nevnt, spottet noen, andre sa at de ville høre ham igjen, og noen sluttet seg til ham og kom til tro, blant dem Dionysios areopagitten og en kvinne som het Damaris."
      tl: "Dinala si Pablo ng mga naghatid sa kaniya hanggang sa Atenas; hindi sinasabi ng teksto kung naglakbay sila sa dagat o sa lupa. Habang hinihintay doon sina Silas at Timoteo, namuhi ang loob ni Pablo nang makita niyang puno ng diyos-diyosan ang bayan. Nakipagmatuwiran siya sa sinagoga sa mga Judio at sa mga masisipag sa kabanalan, at araw-araw sa pamilihan sa sinumang naroon; nakatagpo niya ang mga pilosopong Epicureo at Estoico at dinala siya sa Areopago upang marinig ang kaniyang bagong aral. Nagsalita si Pablo tungkol sa Diyos na hindi kilala na kanilang sinasamba nang hindi nakikilala, ang Maylalang ng sanglibutan, na ngayo'y tumatawag sa lahat ng tao na magsisi at nagtakda ng isang araw ng paghuhukom sa pamamagitan ng taong kaniyang binuhay mula sa mga patay. Nang mabanggit ang pagkabuhay na maguli, ang ilan ay nanuya, ang iba ay nagsabing pakikinggan nila siyang muli, at ang ilan ay nakisama sa kaniya at sumampalataya, kabilang si Dionisio na Areopagita at isang babaing nagngangalang Damaris."
      da: "De, som ledsagede Paulus, bragte ham til Athen; teksten siger ikke, om de rejste til søs eller over land. Mens Paulus ventede der på Silas og Timotheus, harmedes han over at se byen fuld af afgudsbilleder. Han drøftede i synagogen med jøderne og de gudfrygtige og hver dag på torvet med dem, der var der; epikuræiske og stoiske filosoffer mødte ham og førte ham til Areopagos for at høre hans nye lære. Paulus talte om den ukendte Gud, som de dyrkede uden at kende ham, verdens skaber, som nu kalder alle mennesker til omvendelse og har fastsat en dommens dag ved den mand, han har oprejst fra de døde. Da opstandelsen blev nævnt, spottede nogle, andre sagde, at de ville høre ham igen, og nogle sluttede sig til ham og troede, blandt dem Areopagiten Dionysios og en kvinde ved navn Damaris."
      sr: "Они који су пратили Павла довели су га до Атине; текст не каже да ли су ишли морем или копном. Чекајући тамо Силу и Тимотија, Павле се узнемирио гледајући град пун идола. Расправљао је у синагоги с Јеврејима и побожнима, и сваки дан на тргу с ким би се затекао; епикурејски и стоички философи срели су се с њим и одвели га на Ареопаг да чују његову нову науку. Павле је говорио о непознатом Богу кога су поштовали не знајући га, Творцу света, који сада позива све људе да се покају и који је одредио дан суда преко човека кога је васкрсао из мртвих. При спомену васкрсења једни су се ругали, други су рекли да ће га опет слушати, а неки су пристали уза њ и поверовали, међу њима Дионисије Ареопагит и жена по имену Дамара."
      hu: "Akik Pált kísérték, Athénba vitték; a szöveg nem mondja meg, tengeren vagy szárazföldön mentek-e. Miközben ott Szilászra és Timóteusra várt, Pált felindította, hogy a város tele van bálványokkal. A zsinagógában a zsidókkal és az istenfélőkkel vitatkozott, a piacon pedig mindennap azokkal, akik éppen ott voltak; epikureus és sztoikus filozófusok találkoztak vele, és az Areopáguszra vitték, hogy meghallgassák új tanítását. Pál az ismeretlen Istenről beszélt, akit ismeretlenül tiszteltek, a világ Alkotójáról, aki most minden embert megtérésre hív, és napot rendelt az ítéletre az által a férfi által, akit feltámasztott a halálból. A feltámadás említésére némelyek gúnyolódtak, mások azt mondták, hogy még meghallgatják, néhányan pedig csatlakoztak hozzá és hittek, köztük az areopágita Dionüsziosz és egy Damaris nevű asszony."
      fi: "Paavalin saattajat veivät hänet Ateenaan; teksti ei kerro, kulkivatko he meritse vai maitse. Odottaessaan siellä Silasta ja Timoteusta Paavali kiivastui nähdessään kaupungin olevan täynnä epäjumalankuvia. Hän keskusteli synagogassa juutalaisten ja jumalaapelkääväisten kanssa ja joka päivä torilla niiden kanssa, jotka siellä sattuivat olemaan; epikurolaiset ja stoalaiset filosofit kohtasivat hänet ja veivät hänet Areiopagille kuullakseen hänen uutta oppiaan. Paavali puhui tuntemattomasta Jumalasta, jota he palvelivat tuntematta häntä, maailman Luojasta, joka nyt kutsuu kaikkia ihmisiä parannukseen ja on määrännyt tuomion päivän sen miehen kautta, jonka hän herätti kuolleista. Kun ylösnousemus mainittiin, toiset ivasivat, toiset sanoivat kuulevansa häntä vielä toistekin, ja muutamat liittyivät häneen ja uskoivat, heidän joukossaan Areiopagin jäsen Dionysios ja nainen nimeltä Damaris."
      vi: "Những người dẫn Phao-lô đưa ông đến A-thên; bản văn không nói họ đi đường biển hay đường bộ. Trong khi đợi Si-la và Ti-mô-thê ở đó, Phao-lô động lòng khi thấy thành đầy những thần tượng. Ông biện luận trong nhà hội với người Giu-đa và những người kính sợ Đức Chúa Trời, và mỗi ngày tại chợ với bất cứ ai có mặt; các nhà triết học phái Epicuriens và phái Stociens gặp ông và đem ông đến A-rê-ô-ba-gơ để nghe đạo mới của ông. Phao-lô nói về Đấng Chúa không biết mà họ thờ mà không biết Ngài, là Đấng dựng nên thế giới, Đấng nay biểu mọi người phải ăn năn và đã chỉ định một ngày phán xét bởi Người mà Ngài đã khiến từ kẻ chết sống lại. Khi nghe nói đến sự sống lại, kẻ thì nhạo báng, người thì nói sẽ nghe ông lần khác, và có mấy người theo ông và tin, trong đó có Đê-ni, quan tòa nơi A-rê-ô-ba-gơ, và một người đàn bà tên là Đa-ma-ri."
      ro: "Cei care îl însoțeau pe Pavel l-au dus la Atena; textul nu spune dacă au mers pe mare sau pe uscat. Așteptându-i acolo pe Sila și pe Timotei, Pavel se tulbura văzând cetatea plină de idoli. Discuta în sinagogă cu iudeii și cu cei cucernici, iar în piață, în fiecare zi, cu cei care se aflau acolo; filozofi epicurei și stoici s-au întâlnit cu el și l-au dus în Areopag ca să audă învățătura lui cea nouă. Pavel a vorbit despre Dumnezeul necunoscut, pe care ei îl cinsteau fără să-l cunoască, Făcătorul lumii, care acum cheamă pe toți oamenii la pocăință și a rânduit o zi de judecată prin bărbatul pe care l-a înviat din morți. La pomenirea învierii, unii și-au bătut joc, alții au spus că îl vor mai asculta, iar câțiva s-au alipit de el și au crezut, printre ei Dionisie Areopagitul și o femeie numită Damaris."
      bg: "Онези, които придружаваха Павел, го доведоха до Атина; текстът не казва дали са пътували по море или по суша. Докато чакаше там Сила и Тимотей, Павел се смущаваше, като гледаше града пълен с идоли. Той разискваше в синагогата с юдеите и с набожните и всеки ден на пазара с когото се случеше; епикурейски и стоически философи се срещнаха с него и го заведоха на Ареопага, за да чуят новото му учение. Павел говори за непознатия Бог, когото те почитаха, без да го познават — Създателя на света, който сега призовава всички хора да се покаят и е определил ден за съд чрез човека, когото е възкресил от мъртвите. При споменаването на възкресението едни се присмяха, други казаха, че ще го чуят пак, а някои се присъединиха към него и повярваха, между тях Дионисий Ареопагит и една жена на име Дамарис."
  - place: a6f437a
    ref: Acts.18.1-Acts.18.17
    note:
