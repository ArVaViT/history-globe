    story:
      en: "The next day they came to Neapolis, today Kavala, a harbour founded by settlers from Thasos that served as the port of Philippi; in Roman times the Via Egnatia, the road across the Balkans, came down to the sea here."
      ru: "На следующий день они прибыли в Неаполь, ныне Кавала, — гавань, основанную поселенцами с Фасоса и служившую портом Филипп; в римское время здесь к морю спускалась Эгнатиева дорога, пересекавшая Балканы."
      uk: "Наступного дня вони прибули до Неаполя, нині Кавала, — гавані, заснованої поселенцями з Тасосу, що була портом Філіпп; за римських часів тут до моря спускалася Егнатієва дорога, що перетинала Балкани."
      es: "Al día siguiente llegaron a Neápolis, hoy Cavala, un puerto fundado por colonos de Tasos que servía de puerto a Filipos; en época romana, la Vía Egnatia, el camino que atravesaba los Balcanes, bajaba aquí hasta el mar."
      pt: "No dia seguinte chegaram a Neápolis, hoje Kavala, um porto fundado por colonos de Tasos que servia de porto a Filipos; na época romana, a Via Egnácia, a estrada que atravessava os Bálcãs, descia aqui até o mar."
      de: "Am nächsten Tag kamen sie nach Neapolis, dem heutigen Kavala, einem von Siedlern aus Thasos gegründeten Hafen, der Philippi als Hafen diente; in römischer Zeit führte hier die Via Egnatia, die Straße quer über den Balkan, zum Meer hinab."
      fr: "Le lendemain, ils arrivèrent à Néapolis, aujourd’hui Kavala, un port fondé par des colons de Thasos qui servait de port à Philippes ; à l’époque romaine, la via Egnatia, la route qui traversait les Balkans, descendait ici jusqu’à la mer."
      pl: "Nazajutrz przybyli do Neapolis, dziś Kawala, portu założonego przez osadników z Tasos, który służył jako port Filippi; w czasach rzymskich schodziła tu do morza Via Egnatia, droga przez Bałkany."
      it: "Il giorno seguente giunsero a Neapoli, oggi Kavala, un porto fondato da coloni di Taso che serviva da porto a Filippi; in età romana la via Egnazia, la strada che attraversava i Balcani, scendeva qui fino al mare."
      nl: "De volgende dag kwamen zij te Neapolis, het huidige Kavala, een haven gesticht door kolonisten uit Thasos, die als haven van Filippi diende; in de Romeinse tijd kwam hier de Via Egnatia, de weg dwars over de Balkan, uit bij de zee."
      cs: "Druhý den přišli do Neapole, dnešní Kavaly, přístavu založeného osadníky z Thasu, který sloužil jako přístav Filip; v římské době zde k moři sestupovala Via Egnatia, silnice přes Balkán."
      sv: "Dagen därpå kom de till Neapolis, i dag Kavala, en hamn grundad av nybyggare från Thasos som tjänade som Filippis hamn; på romersk tid nådde Via Egnatia, vägen tvärs över Balkan, havet här."
      nb: "Dagen etter kom de til Neapolis, i dag Kavala, en havn grunnlagt av nybyggere fra Thasos som tjente som Filippis havn; i romersk tid nådde Via Egnatia, veien tvers over Balkan, havet her."
      tl: "Nang sumunod na araw ay dumating sila sa Neapolis, na ngayo'y Kavala, isang daungang itinatag ng mga nanirahang mula sa Thasos na nagsilbing daungan ng Filipos; noong panahon ng mga Romano, dito bumababa sa dagat ang Via Egnatia, ang daang tumatawid sa Balkan."
      da: "Næste dag kom de til Neapolis, i dag Kavala, en havn grundlagt af bosættere fra Thasos, som tjente som Filippis havn; i romersk tid nåede Via Egnatia, vejen tværs over Balkan, her ned til havet."
      sr: "Сутрадан су дошли у Неапољ, данас Кавалу, луку коју су основали досељеници са Тасоса и која је служила као пристаниште Филипа; у римско доба Егнатијев пут, пут преко Балкана, овде се спуштао до мора."
      hu: "Másnap Neapoliszba, a mai Kavalába érkeztek, a thászoszi telepesek által alapított kikötőbe, amely Filippi kikötőjeként szolgált; a római korban itt ért le a tengerhez a Via Egnatia, a Balkánon átvezető út."
      fi: "Seuraavana päivänä he tulivat Neapoliin, nykyiseen Kavalaan, Thasokselta tulleiden siirtolaisten perustamaan satamaan, joka toimi Filippin satamana; roomalaisaikana Balkanin poikki kulkeva Via Egnatia -tie laskeutui täällä merelle."
      vi: "Ngày hôm sau họ đến Nê-a-bô-li, nay là Kavala, một hải cảng do những người định cư từ Thasos lập nên, dùng làm cảng của Phi-líp; vào thời La Mã, Via Egnatia, con đường băng qua bán đảo Balkan, xuống đến biển tại đây."
      ro: "A doua zi au ajuns la Neapolis, astăzi Kavala, un port întemeiat de coloniști din Thasos, care slujea drept port al Filipiului; în vremea romană, Via Egnatia, drumul peste Balcani, cobora aici la mare."
      bg: "На следващия ден стигнаха до Неапол, днес Кавала — пристанище, основано от заселници от Тасос, което служеше за пристанище на Филипи; в римско време Виа Егнация, пътят през Балканите, слизаше тук до морето."
  - place: a49e1d0
    ref: Acts.16.12-Acts.16.40
    note:
