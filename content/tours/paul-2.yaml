# Paul's second missionary journey, Acts 15:36–18:22. Named towns only, in the order of the
# text; regions crossed "in passing" (Syria and Cilicia, Phrygia and Galatia, Mysia) are left
# out rather than drawn as guessed stops. Year approximate: Pauline chronology is debated.
# Berea to Athens (Acts 17:14-15, "as it were to the sea") leaves open whether by sea or by
# road: that leg is untold.
id: paul-2
title:
  en: "Paul's second journey"
  ru: "Второе путешествие Павла"
  uk: "Друга подорож Павла"
  es: "El segundo viaje de Pablo"
  pt: "A segunda viagem de Paulo"
  de: "Die zweite Reise des Paulus"
  fr: "Le deuxième voyage de Paul"
  pl: "Druga podróż Pawła"
  it: "Il secondo viaggio di Paolo"
  nl: "De tweede reis van Paulus"
  cs: "Druhá Pavlova cesta"
  sv: "Paulus’ andra resa"
  nb: "Paulus' andre reise"
  tl: "Ang ikalawang paglalakbay ni Pablo"
  da: "Paulus' anden rejse"
  sr: "Павлово друго путовање"
  hu: "Pál második útja"
  fi: "Paavalin toinen matka"
  vi: "Cuộc hành trình thứ hai của Phao-lô"
  ro: "A doua călătorie a lui Pavel"
  bg: "Второто пътуване на Павел"
year: "AD 50"
people: ["Paul@Act.7.58-2Pe"]
approximate: true
intro:
  en:
    - "Acts 15:36–18:22 tells of Paul's second journey. After the council at Jerusalem Paul proposed to Barnabas that they visit the brothers in every town where they had preached. Barnabas wanted to take John, called Mark, Paul would not, and they parted: Barnabas sailed to Cyprus with Mark, and Paul set out with Silas. They went through Syria and Cilicia to Derbe and Lystra, where Timothy joined them, crossed Phrygia and the region of Galatia, and, kept by the Spirit from speaking in Asia and from entering Bithynia, came down to Troas. A vision called them over to Macedonia, where Paul founded churches at Philippi, Thessalonica and Berea; driven on each time, he went to Athens and then to Corinth, where he stayed a year and six months, before sailing by way of Ephesus to Caesarea, going up to greet the church and returning to Antioch."
    - "This journey holds the best fixed dates of Paul's life. At Corinth Paul found Aquila and Priscilla, lately come from Italy because Claudius had ordered all Jews to leave Rome; Suetonius tells of the expulsion and Orosius puts it in the ninth year of Claudius, AD 49. Later the Jews of Corinth brought Paul before Gallio, proconsul of Achaia, whose year of office, 51–52, is known from an inscription at Delphi. Paul's months at Corinth therefore fall about AD 50–52, and the journey around them; the Catholic Encyclopedia of 1911 dated it 50–53, and the map shows it at AD 50."
    - "From Troas to Philippi the narrative speaks in the first person plural, and the text gives one crossing its days: from Troas to Samothrace and the next day to Neapolis. Other travel times given with the stops are estimates. The regions crossed on the way to Troas are not named as towns, and that leg, like the way from Berea to Athens, is not traced."
  ru:
    - "О втором путешествии Павла рассказывает Деян 15:36–18:22. После Иерусалимского собора Павел предложил Варнаве посетить братьев во всех городах, где они проповедовали. Варнава хотел взять Иоанна, называемого Марком, Павел не соглашался, и они разлучились: Варнава с Марком отплыл на Кипр, а Павел отправился в путь с Силой. Они прошли Сирию и Киликию до Дервии и Листры, где к ним присоединился Тимофей, пересекли Фригию и Галатийскую страну и, не допущенные Духом проповедовать в Асии и войти в Вифинию, спустились в Троаду. Видение призвало их в Македонию, где Павел основал церкви в Филиппах, Фессалонике и Верии; каждый раз вынужденный уходить, он пришёл в Афины, а затем в Коринф, где пробыл год и шесть месяцев, после чего отплыл через Ефес в Кесарию, поднялся приветствовать церковь и вернулся в Антиохию."
    - "На это путешествие приходятся самые надёжные даты жизни Павла. В Коринфе Павел нашёл Акилу и Прискиллу, недавно пришедших из Италии, потому что Клавдий повелел всем иудеям покинуть Рим; Светоний рассказывает об изгнании, а Орозий относит его к девятому году Клавдия, 49 г. н. э. Позже коринфские иудеи привели Павла к Галлиону, проконсулу Ахаии, год правления которого, 51–52, известен по надписи из Дельф. Поэтому месяцы Павла в Коринфе приходятся примерно на 50–52 гг. н. э., а путешествие — на время вокруг них; Католическая энциклопедия 1911 года датировала его 50–53 гг., и на карте оно показано под 50 г. н. э."
    - "От Троады до Филипп повествование ведётся от первого лица множественного числа, и для одного перехода текст указывает дни: из Троады в Самофракию и на следующий день в Неаполь. Остальное время в пути, указанное у остановок, — оценки. Области, пройденные по пути в Троаду, названы не как города, и этот отрезок, как и путь из Верии в Афины, на карте не прочерчен."
  uk:
    - "Про другу подорож Павла розповідає Дії 15:36–18:22. Після Єрусалимського собору Павло запропонував Варнаві відвідати братів у кожному місті, де вони проповідували. Варнава хотів узяти Івана, званого Марком, Павло не погоджувався, і вони розлучилися: Варнава з Марком відплив на Кіпр, а Павло вирушив у дорогу з Силою. Вони пройшли Сирію й Кілікію до Дервії та Лістри, де до них приєднався Тимофій, перетнули Фригію й Галатійський край і, оскільки Дух не дозволив їм говорити в Азії та ввійти до Віфінії, спустилися до Троади. Видіння покликало їх до Македонії, де Павло заснував церкви у Філіппах, Солуні й Верії; щоразу змушений іти далі, він прийшов до Афін, а потім до Коринта, де пробув рік і шість місяців, перш ніж відплисти через Ефес до Кесарії, піднятися привітати церкву й повернутися до Антіохії."
    - "На цю подорож припадають найнадійніші дати життя Павла. У Коринті Павло знайшов Акилу й Прискиллу, які недавно прибули з Італії, бо Клавдій наказав усім юдеям залишити Рим; Светоній розповідає про вигнання, а Орозій відносить його до дев’ятого року Клавдія, 49 р. н. е. Пізніше коринтські юдеї привели Павла до Галліона, проконсула Ахаї, рік урядування якого, 51–52, відомий з напису в Дельфах. Отже, місяці Павла в Коринті припадають приблизно на 50–52 рр. н. е., а подорож — на час довкола них; Католицька енциклопедія 1911 року датувала її 50–53 рр., і на мапі її показано під 50 р. н. е."
    - "Від Троади до Філіпп оповідь ведеться від першої особи множини, і для одного переходу текст подає дні: з Троади до Самотракії і наступного дня до Неаполя. Решта часу в дорозі, вказаного біля зупинок, — це оцінки. Краї, пройдені дорогою до Троади, названо не як міста, і цей відтинок, як і шлях з Верії до Афін, на мапі не прокреслено."
  es:
    - "Hechos 15:36–18:22 narra el segundo viaje de Pablo. Después del concilio de Jerusalén, Pablo propuso a Bernabé visitar a los hermanos en todas las ciudades donde habían predicado. Bernabé quería llevar a Juan, llamado Marcos; Pablo no quiso, y se separaron: Bernabé navegó a Chipre con Marcos, y Pablo partió con Silas. Atravesaron Siria y Cilicia hasta Derbe y Listra, donde se les unió Timoteo, cruzaron Frigia y la región de Galacia y, impedidos por el Espíritu de hablar en Asia y de entrar en Bitinia, bajaron a Troas. Una visión los llamó a pasar a Macedonia, donde Pablo fundó iglesias en Filipos, Tesalónica y Berea; expulsado cada vez, fue a Atenas y luego a Corinto, donde se quedó un año y seis meses, antes de navegar por Éfeso hasta Cesarea, subir a saludar a la iglesia y volver a Antioquía."
    - "Este viaje contiene las fechas mejor fijadas de la vida de Pablo. En Corinto, Pablo encontró a Aquila y Priscila, recién llegados de Italia porque Claudio había mandado que todos los judíos salieran de Roma; Suetonio relata la expulsión y Orosio la sitúa en el noveno año de Claudio, el 49 d.C. Más tarde los judíos de Corinto llevaron a Pablo ante Galión, procónsul de Acaya, cuyo año de mandato, 51–52, se conoce por una inscripción de Delfos. Los meses de Pablo en Corinto caen, por tanto, hacia el 50–52 d.C., y el viaje en torno a ellos; la Enciclopedia Católica de 1911 lo fechaba en 50–53, y el mapa lo muestra en el 50 d.C."
    - "De Troas a Filipos el relato habla en primera persona del plural, y el texto da los días de una sola travesía: de Troas a Samotracia y al día siguiente a Neápolis. Los demás tiempos de viaje indicados en las paradas son estimaciones. Las regiones atravesadas camino de Troas no se nombran como ciudades, y ese tramo, como el camino de Berea a Atenas, no se traza."
  pt:
    - "Atos 15:36–18:22 narra a segunda viagem de Paulo. Depois do concílio de Jerusalém, Paulo propôs a Barnabé visitarem os irmãos em todas as cidades onde tinham pregado. Barnabé queria levar João, chamado Marcos; Paulo não quis, e eles se separaram: Barnabé navegou para Chipre com Marcos, e Paulo partiu com Silas. Atravessaram a Síria e a Cilícia até Derbe e Listra, onde Timóteo se juntou a eles, cruzaram a Frígia e a região da Galácia e, impedidos pelo Espírito de falar na Ásia e de entrar na Bitínia, desceram a Trôade. Uma visão chamou-os a passar à Macedônia, onde Paulo fundou igrejas em Filipos, Tessalônica e Bereia; expulso a cada vez, foi para Atenas e depois para Corinto, onde ficou um ano e seis meses, antes de navegar, passando por Éfeso, até Cesareia, subir para saudar a igreja e voltar a Antioquia."
    - "Esta viagem contém as datas mais bem fixadas da vida de Paulo. Em Corinto, Paulo encontrou Áquila e Priscila, recém-chegados da Itália porque Cláudio havia ordenado que todos os judeus saíssem de Roma; Suetônio relata a expulsão e Orósio a situa no nono ano de Cláudio, 49 d.C. Mais tarde, os judeus de Corinto levaram Paulo perante Gálio, procônsul da Acaia, cujo ano de mandato, 51–52, é conhecido por uma inscrição de Delfos. Os meses de Paulo em Corinto caem, portanto, por volta de 50–52 d.C., e a viagem em torno deles; a Enciclopédia Católica de 1911 datava-a de 50–53, e o mapa a mostra em 50 d.C."
    - "De Trôade a Filipos, a narrativa fala na primeira pessoa do plural, e o texto dá os dias de uma única travessia: de Trôade a Samotrácia e, no dia seguinte, a Neápolis. Os demais tempos de viagem indicados nas paradas são estimativas. As regiões atravessadas a caminho de Trôade não são nomeadas como cidades, e esse trecho, como o caminho de Bereia a Atenas, não é traçado."
  de:
    - "Apg 15:36–18:22 erzählt von der zweiten Reise des Paulus. Nach dem Apostelkonzil in Jerusalem schlug Paulus Barnabas vor, die Brüder in allen Städten zu besuchen, in denen sie gepredigt hatten. Barnabas wollte Johannes, genannt Markus, mitnehmen, Paulus wollte es nicht, und sie trennten sich: Barnabas segelte mit Markus nach Zypern, und Paulus brach mit Silas auf. Sie zogen durch Syrien und Kilikien nach Derbe und Lystra, wo Timotheus sich ihnen anschloss, durchquerten Phrygien und das Land Galatien und kamen, vom Geist gehindert, in Asien zu reden und nach Bithynien zu ziehen, hinab nach Troas. Ein Gesicht rief sie hinüber nach Mazedonien, wo Paulus Gemeinden in Philippi, Thessalonich und Beröa gründete; jedes Mal weitergetrieben, ging er nach Athen und dann nach Korinth, wo er ein Jahr und sechs Monate blieb, bevor er über Ephesus nach Caesarea segelte, hinaufzog, um die Gemeinde zu grüßen, und nach Antiochia zurückkehrte."
    - "Diese Reise enthält die am besten gesicherten Daten im Leben des Paulus. In Korinth traf Paulus Aquila und Priscilla, die vor Kurzem aus Italien gekommen waren, weil Klaudius allen Juden befohlen hatte, Rom zu verlassen; Sueton berichtet von der Vertreibung, und Orosius setzt sie in das neunte Jahr des Klaudius, 49 n. Chr. Später brachten die Juden von Korinth Paulus vor Gallio, den Prokonsul von Achaja, dessen Amtsjahr 51–52 aus einer Inschrift in Delphi bekannt ist. Die Monate des Paulus in Korinth fallen also etwa in die Jahre 50–52 n. Chr. und die Reise in die Zeit um sie herum; die Catholic Encyclopedia von 1911 datierte sie auf 50–53, und die Karte zeigt sie im Jahr 50 n. Chr."
    - "Von Troas bis Philippi spricht die Erzählung in der ersten Person Plural, und der Text gibt für eine Überfahrt die Tage an: von Troas nach Samothrake und am nächsten Tag nach Neapolis. Die übrigen bei den Stationen angegebenen Reisezeiten sind Schätzungen. Die auf dem Weg nach Troas durchzogenen Landschaften werden nicht mit Städten benannt, und diese Strecke wird, wie der Weg von Beröa nach Athen, nicht nachgezeichnet."
  fr:
    - "Ac 15:36–18:22 raconte le deuxième voyage de Paul. Après le concile de Jérusalem, Paul proposa à Barnabas d’aller visiter les frères dans toutes les villes où ils avaient prêché. Barnabas voulait emmener Jean, surnommé Marc, Paul ne le voulait pas, et ils se séparèrent : Barnabas s’embarqua pour Chypre avec Marc, et Paul partit avec Silas. Ils traversèrent la Syrie et la Cilicie jusqu’à Derbe et Lystre, où Timothée se joignit à eux, parcoururent la Phrygie et le pays de Galatie et, empêchés par l’Esprit de parler en Asie et d’entrer en Bithynie, descendirent à Troas. Une vision les appela à passer en Macédoine, où Paul fonda des Églises à Philippes, à Thessalonique et à Bérée ; chassé chaque fois plus loin, il gagna Athènes puis Corinthe, où il resta un an et six mois, avant de s’embarquer, en passant par Éphèse, pour Césarée, de monter saluer l’Église et de revenir à Antioche."
    - "Ce voyage contient les dates les mieux établies de la vie de Paul. À Corinthe, Paul trouva Aquilas et Priscille, récemment arrivés d’Italie parce que Claude avait ordonné à tous les Juifs de quitter Rome ; Suétone rapporte l’expulsion et Orose la place dans la neuvième année de Claude, en 49 apr. J.-C. Plus tard, les Juifs de Corinthe menèrent Paul devant Gallion, proconsul d’Achaïe, dont l’année de charge, 51–52, est connue par une inscription de Delphes. Les mois de Paul à Corinthe se situent donc vers 50–52 apr. J.-C., et le voyage autour d’eux ; la Catholic Encyclopedia de 1911 le datait de 50–53, et la carte le place en 50 apr. J.-C."
    - "De Troas à Philippes, le récit parle à la première personne du pluriel, et le texte donne les jours d’une traversée : de Troas à Samothrace et, le lendemain, à Néapolis. Les autres durées de trajet indiquées aux étapes sont des estimations. Les régions traversées en route vers Troas ne sont pas nommées comme des villes, et ce trajet, comme le chemin de Bérée à Athènes, n’est pas tracé."
  pl:
    - "Dzieje Apostolskie (Dz 15:36–18:22) opowiadają o drugiej podróży Pawła. Po soborze jerozolimskim Paweł zaproponował Barnabie, by odwiedzili braci w każdym mieście, w którym głosili. Barnaba chciał zabrać Jana zwanego Markiem, Paweł się nie zgodził i rozstali się: Barnaba odpłynął z Markiem na Cypr, a Paweł wyruszył z Sylasem. Przeszli przez Syrię i Cylicję do Derbe i Listry, gdzie dołączył do nich Tymoteusz, przemierzyli Frygię i krainę galacką, a powstrzymani przez Ducha od głoszenia w Azji i od wejścia do Bitynii, zeszli do Troady. Widzenie wezwało ich do Macedonii, gdzie Paweł założył Kościoły w Filippi, Tesalonice i Berei; za każdym razem zmuszony iść dalej, udał się do Aten, a potem do Koryntu, gdzie pozostał rok i sześć miesięcy, po czym przez Efez popłynął do Cezarei, poszedł pozdrowić Kościół i wrócił do Antiochii."
    - "Ta podróż zawiera najlepiej ustalone daty w życiu Pawła. W Koryncie Paweł spotkał Akwilę i Pryscyllę, którzy niedawno przybyli z Italii, ponieważ Klaudiusz nakazał wszystkim Żydom opuścić Rzym; Swetoniusz pisze o tym wypędzeniu, a Orozjusz umieszcza je w dziewiątym roku Klaudiusza, czyli w 49 n.e. Później Żydzi z Koryntu stawili Pawła przed Gallionem, prokonsulem Achai, którego rok urzędowania, 51–52, znany jest z napisu w Delfach. Miesiące Pawła w Koryncie przypadają więc mniej więcej na lata 50–52 n.e., a podróż na czas wokół nich; Catholic Encyclopedia z 1911 roku datowała ją na lata 50–53, a mapa pokazuje ją w roku 50 n.e."
    - "Od Troady do Filippi narracja prowadzona jest w pierwszej osobie liczby mnogiej, a tekst podaje liczbę dni jednej przeprawy: z Troady do Samotraki i nazajutrz do Neapolis. Pozostałe czasy przejazdu podane przy przystankach są szacunkami. Krainy przemierzone w drodze do Troady nie są wymienione jako miasta, a ten odcinek, podobnie jak droga z Berei do Aten, nie jest wyrysowany."
  it:
    - "At 15:36–18:22 racconta il secondo viaggio di Paolo. Dopo il concilio di Gerusalemme Paolo propose a Barnaba di visitare i fratelli in ogni città dove avevano predicato. Barnaba voleva prendere Giovanni, detto Marco, Paolo non volle, e si separarono: Barnaba navigò verso Cipro con Marco, e Paolo partì con Sila. Attraversarono la Siria e la Cilicia fino a Derbe e Listra, dove Timoteo si unì a loro, percorsero la Frigia e il paese della Galazia e, trattenuti dallo Spirito dal parlare in Asia e dall’entrare in Bitinia, scesero a Troade. Una visione li chiamò a passare in Macedonia, dove Paolo fondò chiese a Filippi, Tessalonica e Berea; cacciato ogni volta più avanti, andò ad Atene e poi a Corinto, dove rimase un anno e sei mesi, prima di navigare, passando per Efeso, fino a Cesarea, salire a salutare la chiesa e tornare ad Antiochia."
    - "Questo viaggio contiene le date meglio fissate della vita di Paolo. A Corinto Paolo trovò Aquila e Priscilla, venuti di recente dall’Italia perché Claudio aveva ordinato a tutti i Giudei di lasciare Roma; Svetonio narra l’espulsione e Orosio la pone nel nono anno di Claudio, il 49 d.C. Più tardi i Giudei di Corinto condussero Paolo davanti a Gallione, proconsole d’Acaia, il cui anno di carica, il 51–52, è noto da un’iscrizione di Delfi. I mesi di Paolo a Corinto cadono dunque verso il 50–52 d.C., e il viaggio intorno a essi; la Catholic Encyclopedia del 1911 lo datava al 50–53, e la mappa lo colloca nel 50 d.C."
    - "Da Troade a Filippi il racconto parla alla prima persona plurale, e il testo indica i giorni di una traversata: da Troade a Samotracia e il giorno dopo a Neapoli. Gli altri tempi di viaggio indicati per le tappe sono stime. Le regioni attraversate sulla via di Troade non sono nominate come città, e quel tratto, come il cammino da Berea ad Atene, non è tracciato."
  nl:
    - "Hand 15:36–18:22 vertelt over de tweede reis van Paulus. Na het concilie van Jeruzalem stelde Paulus Barnabas voor de broeders te bezoeken in alle steden waar zij gepredikt hadden. Barnabas wilde Johannes, genaamd Marcus, meenemen, Paulus wilde dat niet, en zij gingen uiteen: Barnabas voer met Marcus naar Cyprus, en Paulus vertrok met Silas. Zij trokken door Syrië en Cilicië naar Derbe en Lystra, waar Timoteüs zich bij hen voegde, gingen door Frygië en het Galatische land en kwamen, door de Geest verhinderd in Asia te spreken en Bithynië binnen te gaan, af naar Troas. Een visioen riep hen over naar Macedonië, waar Paulus gemeenten stichtte te Filippi, Tessalonica en Berea; telkens verder gedreven, ging hij naar Athene en daarna naar Korinthe, waar hij een jaar en zes maanden bleef, voordat hij via Efeze naar Caesarea voer, opging om de gemeente te groeten en naar Antiochië terugkeerde."
    - "Deze reis bevat de best vastgestelde data uit het leven van Paulus. Te Korinthe vond Paulus Aquila en Priscilla, die kort tevoren uit Italië gekomen waren omdat Claudius alle Joden bevolen had Rome te verlaten; Suetonius vertelt over de verdrijving, en Orosius plaatst haar in het negende jaar van Claudius, 49 n.Chr. Later brachten de Joden van Korinthe Paulus voor Gallio, proconsul van Achaja, wiens ambtsjaar, 51–52, bekend is uit een inscriptie te Delphi. De maanden van Paulus te Korinthe vallen dus rond 50–52 n.Chr., en de reis daaromheen; de Catholic Encyclopedia van 1911 dateerde haar op 50–53, en de kaart toont haar in 50 n.Chr."
    - "Van Troas tot Filippi spreekt het verhaal in de eerste persoon meervoud, en de tekst geeft voor één overtocht de dagen: van Troas naar Samothrake en de volgende dag naar Neapolis. De andere reistijden bij de haltes zijn schattingen. De streken die op weg naar Troas werden doorkruist, worden niet als steden genoemd, en dat traject wordt, net als de weg van Berea naar Athene, niet getekend."
  cs:
    - "Skutky apoštolů (Sk 15:36–18:22) vyprávějí o Pavlově druhé cestě. Po jeruzalémském sněmu navrhl Pavel Barnabášovi, aby navštívili bratry v každém městě, kde kázali. Barnabáš chtěl vzít s sebou Jana zvaného Marek, Pavel nechtěl, a tak se rozešli: Barnabáš odplul s Markem na Kypr a Pavel se vydal na cestu se Silasem. Prošli Sýrií a Kilikií do Derbe a Lystry, kde se k nim připojil Timoteus, prošli Frygií a galatským krajem, a protože jim Duch nedovolil mluvit v Asii ani vstoupit do Bithýnie, sestoupili do Troady. Vidění je povolalo do Makedonie, kde Pavel založil církve ve Filipech, Tesalonice a Beroii; pokaždé byl nucen jít dál, a tak odešel do Atén a pak do Korintu, kde zůstal rok a šest měsíců, než přes Efez odplul do Cesareje, vystoupil pozdravit církev a vrátil se do Antiochie."
    - "Tato cesta obsahuje nejpevněji určená data Pavlova života. V Korintu Pavel nalezl Akvilu a Priscillu, kteří nedávno přišli z Itálie, protože Klaudius nařídil všem Židům opustit Řím; o tomto vyhnání píše Suetonius a Orosius je klade do devátého roku Klaudiovy vlády, tedy do roku 49 n. l. Později Židé z Korintu předvedli Pavla před Gallióna, prokonzula Achaje, jehož rok v úřadu, 51–52, je znám z nápisu v Delfách. Pavlovy měsíce v Korintu tedy připadají asi na léta 50–52 n. l. a cesta na dobu kolem nich; Catholic Encyclopedia z roku 1911 ji datovala do let 50–53 a mapa ji ukazuje v roce 50 n. l."
    - "Od Troady do Filip vypráví text v první osobě množného čísla a u jedné plavby uvádí dny: z Troady na Samothráké a druhý den do Neapole. Ostatní doby cesty uvedené u zastávek jsou odhady. Kraje, jimiž cesta do Troady vedla, nejsou jmenovány jako města a tento úsek, stejně jako cesta z Beroie do Atén, není zakreslen."
  sv:
    - "Apg 15:36–18:22 berättar om Paulus’ andra resa. Efter mötet i Jerusalem föreslog Paulus Barnabas att de skulle besöka bröderna i alla de städer där de hade förkunnat. Barnabas ville ta med Johannes, som kallades Markus, men Paulus ville inte, och de skildes åt: Barnabas seglade till Cypern med Markus, och Paulus bröt upp med Silas. De drog genom Syrien och Cilicien till Derbe och Lystra, där Timoteus anslöt sig till dem, korsade Frygien och det galatiska landet och kom, hindrade av Anden från att tala i Asien och från att fara in i Bitynien, ned till Troas. En syn kallade dem över till Makedonien, där Paulus grundade församlingar i Filippi, Tessalonike och Beroia; varje gång driven vidare gick han till Aten och sedan till Korinth, där han stannade ett år och sex månader, innan han seglade över Efesos till Caesarea, gick upp för att hälsa församlingen och återvände till Antiochia."
    - "Denna resa rymmer de säkraste dateringarna i Paulus’ liv. I Korinth fann Paulus Aquila och Priscilla, som nyligen hade kommit från Italien eftersom Claudius hade befallt alla judar att lämna Rom; Suetonius berättar om fördrivningen, och Orosius förlägger den till Claudius’ nionde regeringsår, 49 e.Kr. Senare förde judarna i Korinth Paulus inför Gallio, prokonsul i Achaia, vars ämbetsår, 51–52, är känt från en inskrift i Delfi. Paulus’ månader i Korinth infaller därför omkring 50–52 e.Kr., och resan runt dem; Catholic Encyclopedia från 1911 daterade den till 50–53, och kartan visar den år 50 e.Kr."
    - "Från Troas till Filippi talar berättelsen i första person plural, och texten anger dagarna för en överfart: från Troas till Samothrake och dagen därpå till Neapolis. Övriga restider som anges vid stationerna är uppskattningar. De landskap som korsades på vägen till Troas nämns inte som städer, och den sträckan, liksom vägen från Beroia till Aten, är inte utritad."
  nb:
    - "Apg 15:36–18:22 forteller om Paulus' andre reise. Etter møtet i Jerusalem foreslo Paulus for Barnabas at de skulle besøke brødrene i hver by der de hadde forkynt. Barnabas ville ta med Johannes, som ble kalt Markus, Paulus ville ikke, og de skiltes: Barnabas seilte til Kypros med Markus, og Paulus brøt opp med Silas. De dro gjennom Syria og Kilikia til Derbe og Lystra, der Timoteus sluttet seg til dem, krysset Frygia og det galatiske landet og kom, hindret av Ånden fra å tale i Asia og fra å dra inn i Bitynia, ned til Troas. Et syn kalte dem over til Makedonia, der Paulus grunnla menigheter i Filippi, Tessalonika og Berøa; drevet videre hver gang dro han til Aten og så til Korint, der han ble i et år og seks måneder, før han seilte om Efesos til Cæsarea, dro opp for å hilse menigheten og vendte tilbake til Antiokia."
    - "Denne reisen rommer de sikreste dateringene i Paulus' liv. I Korint fant Paulus Akvilas og Priskilla, som nylig var kommet fra Italia fordi Klaudius hadde befalt alle jøder å forlate Roma; Sveton forteller om utvisningen, og Orosius setter den til Klaudius' niende regjeringsår, 49 e.Kr. Senere førte jødene i Korint Paulus fram for Gallio, prokonsul i Akaia, hvis embetsår, 51–52, er kjent fra en innskrift i Delfi. Paulus' måneder i Korint faller derfor omkring 50–52 e.Kr., og reisen omkring dem; Catholic Encyclopedia fra 1911 daterte den til 50–53, og kartet viser den i 50 e.Kr."
    - "Fra Troas til Filippi taler fortellingen i første person flertall, og teksten oppgir dagene for én overfart: fra Troas til Samotrake og dagen etter til Neapolis. Andre reisetider som er oppgitt ved stoppestedene, er anslag. Landskapene som ble krysset på veien til Troas, er ikke nevnt som byer, og den strekningen, i likhet med veien fra Berøa til Aten, er ikke tegnet inn."
  tl:
    - "Isinasalaysay ng Gawa 15:36–18:22 ang ikalawang paglalakbay ni Pablo. Pagkatapos ng konseho sa Jerusalem, iminungkahi ni Pablo kay Bernabe na dalawin nila ang mga kapatid sa bawat bayang kanilang pinangaralan. Ibig ni Bernabe na isama si Juan na tinatawag na Marcos, ayaw ni Pablo, at sila'y naghiwalay: naglayag si Bernabe sa Chipre kasama ni Marcos, at umalis si Pablo kasama ni Silas. Tinahak nila ang Siria at Cilicia hanggang Derbe at Listra, kung saan sumama sa kanila si Timoteo, tinawid ang Frigia at ang lupain ng Galacia, at, palibhasa'y pinagbawalan ng Espiritu na magsalita sa Asia at pumasok sa Bitinia, lumusong sa Troas. Tinawag sila ng isang pangitain patawid sa Macedonia, kung saan nagtatag si Pablo ng mga iglesia sa Filipos, Tesalonica at Berea; palibhasa'y itinataboy sa bawat pagkakataon, nagtungo siya sa Atenas at pagkatapos sa Corinto, kung saan siya tumahan nang isang taon at anim na buwan, bago naglayag sa pamamagitan ng Efeso patungong Cesarea, umahon upang bumati sa iglesia, at bumalik sa Antioquia."
    - "Nasa paglalakbay na ito ang pinakatiyak na mga petsa sa buhay ni Pablo. Sa Corinto ay nasumpungan ni Pablo sina Aquila at Priscila, na hindi pa nalalaong nanggaling sa Italia sapagka't ipinag-utos ni Claudio na magsialis sa Roma ang lahat ng mga Judio; isinasalaysay ni Suetonius ang pagpapaalis na ito at inilalagay ito ni Orosius sa ikasiyam na taon ni Claudio, 49 AD. Nang maglaon ay dinala ng mga Judio sa Corinto si Pablo sa harap ni Galion, prokonsul ng Acaya, na ang taon ng panunungkulan, 51–52, ay nalalaman mula sa isang inskripsiyon sa Delphi. Kaya ang mga buwan ni Pablo sa Corinto ay pumapatak sa mga 50–52 AD, at ang paglalakbay ay nakapalibot dito; pinetsahan ito ng Catholic Encyclopedia ng 1911 sa 50–53, at ipinapakita ito ng mapa sa 50 AD."
    - "Mula Troas hanggang Filipos, nagsasalita ang salaysay sa unang panauhang maramihan, at ibinibigay ng teksto ang mga araw ng isang pagtawid: mula Troas hanggang Samotracia at kinabukasan hanggang Neapolis. Ang iba pang oras ng paglalakbay na nakalagay sa mga hintuan ay mga tantiya. Ang mga lupaing tinahak patungong Troas ay hindi binabanggit bilang mga bayan, at ang bahaging iyon, gaya ng daan mula Berea hanggang Atenas, ay hindi iginuguhit."
  da:
    - "ApG 15:36–18:22 fortæller om Paulus' anden rejse. Efter apostelmødet i Jerusalem foreslog Paulus Barnabas, at de skulle besøge brødrene i hver by, hvor de havde forkyndt. Barnabas ville tage Johannes, kaldet Markus, med, men det ville Paulus ikke, og de skiltes: Barnabas sejlede med Markus til Cypern, og Paulus drog af sted med Silas. De drog gennem Syrien og Kilikien til Derbe og Lystra, hvor Timotheus sluttede sig til dem, krydsede Frygien og det galatiske land og kom, efter at Ånden havde hindret dem i at tale i Asien og i at drage ind i Bithynien, ned til Troas. Et syn kaldte dem over til Makedonien, hvor Paulus grundlagde menigheder i Filippi, Thessalonika og Berøa; drevet videre hver gang drog han til Athen og derefter til Korinth, hvor han blev et år og seks måneder, før han sejlede via Efesos til Cæsarea, drog op for at hilse på menigheden og vendte tilbage til Antiokia."
    - "Denne rejse rummer de bedst fastlagte datoer i Paulus' liv. I Korinth traf Paulus Akvila og Priskilla, der nylig var kommet fra Italien, fordi Klaudius havde befalet alle jøder at forlade Rom; Suetonius fortæller om udvisningen, og Orosius henlægger den til Klaudius' niende år, 49 e.Kr. Senere førte jøderne i Korinth Paulus frem for Gallio, prokonsul i Akaja, hvis embedsår, 51–52, kendes fra en inskription i Delfi. Paulus' måneder i Korinth falder derfor omkring 50–52 e.Kr., og rejsen omkring dem; Catholic Encyclopedia fra 1911 daterede den til 50–53, og kortet viser den i 50 e.Kr."
    - "Fra Troas til Filippi taler beretningen i første person flertal, og teksten angiver dagene for én overfart: fra Troas til Samothrake og næste dag til Neapolis. Andre rejsetider, der er angivet ved de enkelte stop, er skøn. De egne, der blev krydset på vejen til Troas, nævnes ikke som byer, og den strækning er, ligesom vejen fra Berøa til Athen, ikke tegnet ind."
  sr:
    - "Дела апостолска, од 15:36 до 18:22, приповедају о Павловом другом путовању. После сабора у Јерусалиму Павле је предложио Варнави да обиђу браћу у сваком граду где су проповедали. Варнава је хтео да поведе Јована прозваног Марко, Павле није хтео, и разишли су се: Варнава је с Марком отпловио на Кипар, а Павле је кренуо са Силом. Прошли су кроз Сирију и Киликију до Дерве и Листре, где им се придружио Тимотије, прешли Фригију и галатијску земљу и, пошто их је Дух спречио да говоре у Азији и да уђу у Витинију, сишли у Троаду. Једно виђење позвало их је да пређу у Македонију, где је Павле основао цркве у Филипима, Солуну и Верији; гоњен сваки пут даље, отишао је у Атину, а затим у Коринт, где је остао годину и шест месеци, пре него што је преко Ефеса отпловио у Цезареју, отишао горе да поздрави цркву и вратио се у Антиохију."
    - "Ово путовање садржи најпоузданије утврђене датуме Павловог живота. У Коринту је Павле нашао Акилу и Прискилу, који су скоро дошли из Италије јер је Клаудије заповедио да сви Јевреји напусте Рим; Светоније приповеда о прогонству, а Оросије га смешта у девету годину Клаудијеве владавине, 49. н. е. Касније су коринтски Јевреји довели Павла пред Галиона, намесника Ахаје, чија је година службе, 51–52, позната из натписа у Делфима. Павлови месеци у Коринту падају, дакле, око 50–52. н. е., а путовање око њих; Католичка енциклопедија из 1911. датирала га је у 50–53, а карта га приказује у 50. н. е."
    - "Од Троаде до Филипа приповест говори у првом лицу множине, и текст за један прелаз даје дане: од Троаде до Самотраке и сутрадан до Неапоља. Остала трајања пута наведена уз станице процене су. Крајеви кроз које се прошло на путу до Троаде нису именовани као градови, и тај део пута, као ни пут од Верије до Атине, није уцртан."
  hu:
    - "Az ApCsel 15:36–18:22 Pál második útjáról szól. A jeruzsálemi zsinat után Pál azt javasolta Barnabásnak, hogy látogassák meg a testvéreket minden városban, ahol prédikáltak. Barnabás magukkal akarta vinni a Márknak nevezett Jánost, Pál nem akarta, és elváltak: Barnabás Márkkal Ciprusra hajózott, Pál pedig Szilásszal indult útnak. Szírián és Kilikián át Derbébe és Lisztrába mentek, ahol Timóteus csatlakozott hozzájuk, átkeltek Frígián és Galácia vidékén, és mivel a Lélek megakadályozta, hogy Ázsiában szóljanak és hogy Bithüniába menjenek, lejöttek Troászba. Egy látomás Macedóniába hívta át őket, ahol Pál gyülekezeteket alapított Filippiben, Thesszalonikában és Bereában; mindannyiszor továbbűzve Athénba, majd Korinthusba ment, ahol egy évig és hat hónapig maradt, mielőtt Efezuson át Cézáreába hajózott, felment köszönteni a gyülekezetet, és visszatért Antiókhiába."
    - "Ez az út hordozza Pál életének legbiztosabb dátumait. Korinthusban Pál Akvilára és Priszcillára talált, akik nemrég jöttek Itáliából, mert Klaudius megparancsolta, hogy minden zsidó hagyja el Rómát; Suetonius beszámol a kiűzésről, Orosius pedig Klaudius kilencedik évére, Kr. u. 49-re teszi. Később a korinthusi zsidók Pált Gallió, Akhája prokonzulja elé vitték, akinek hivatali éve, 51–52, egy delphoi feliratból ismert. Pál korinthusi hónapjai tehát nagyjából Kr. u. 50–52-re esnek, és körülöttük az út; az 1911-es Catholic Encyclopedia 50–53-ra keltezte, a térkép pedig Kr. u. 50-nél mutatja."
    - "Troásztól Filippiig az elbeszélés többes szám első személyben szól, és a szöveg egy átkelésnek megadja a napjait: Troászból Szamothrakéba, és másnap Neapoliszba. Az állomásoknál megadott többi utazási idő becslés. A Troász felé vezető úton bejárt vidékeket a szöveg nem városokként nevezi meg, és ez a szakasz, akárcsak a Bereából Athénba vezető út, nincs berajzolva."
  fi:
    - "Apt 15:36–18:22 kertoo Paavalin toisesta matkasta. Jerusalemin apostolikokouksen jälkeen Paavali ehdotti Barnabaalle, että he kävisivät katsomassa veljiä kaikissa kaupungeissa, joissa he olivat julistaneet. Barnabas halusi ottaa mukaan Johanneksen, jota kutsuttiin Markukseksi, Paavali ei suostunut, ja he erosivat: Barnabas purjehti Markuksen kanssa Kyprokselle, ja Paavali lähti matkaan Silaan kanssa. He kulkivat Syyrian ja Kilikian kautta Derbeen ja Lystraan, jossa Timoteus liittyi heihin, kulkivat Frygian ja Galatian maan halki ja tulivat, kun Henki oli estänyt heitä puhumasta Aasiassa ja menemästä Bityniaan, alas Troakseen. Näky kutsui heidät Makedoniaan, jossa Paavali perusti seurakunnat Filippiin, Tessalonikaan ja Beroiaan; joka kerta eteenpäin ajettuna hän meni Ateenaan ja sitten Korinttiin, jossa hän viipyi vuoden ja kuusi kuukautta, ennen kuin purjehti Efesoksen kautta Kesareaan, nousi tervehtimään seurakuntaa ja palasi Antiokiaan."
    - "Tähän matkaan liittyvät Paavalin elämän parhaiten vahvistetut ajankohdat. Korintissa Paavali tapasi Akylaksen ja Priskillan, jotka olivat äskettäin tulleet Italiasta, koska Klaudius oli käskenyt kaikkien juutalaisten poistua Roomasta; Suetonius kertoo karkotuksesta, ja Orosius ajoittaa sen Klaudiuksen yhdeksänteen hallitusvuoteen, vuoteen 49 jaa. Myöhemmin Korintin juutalaiset veivät Paavalin Akaian käskynhaltijan Gallion eteen, jonka virkavuosi 51–52 tunnetaan Delfoin kirjoituksesta. Paavalin kuukaudet Korintissa osuvat siis noin vuosiin 50–52 jaa., ja matka niiden ympärille; vuoden 1911 Catholic Encyclopedia ajoitti sen vuosiin 50–53, ja kartta näyttää sen vuonna 50 jaa."
    - "Troaksesta Filippiin kertomus puhuu monikon ensimmäisessä persoonassa, ja teksti ilmoittaa yhden ylityksen päivät: Troaksesta Samothrakeen ja seuraavana päivänä Neapoliin. Muut pysähdyspaikkojen yhteydessä annetut matka-ajat ovat arvioita. Troakseen johtaneen matkan varrella kuljettuja seutuja ei mainita kaupunkeina, eikä tätä osuutta, kuten ei myöskään matkaa Beroiasta Ateenaan, ole piirretty karttaan."
  vi:
    - "Công 15:36–18:22 thuật lại cuộc hành trình thứ hai của Phao-lô. Sau hội nghị tại Giê-ru-sa-lem, Phao-lô đề nghị với Ba-na-ba trở lại thăm anh em trong mọi thành mà họ đã giảng đạo. Ba-na-ba muốn đem theo Giăng cũng gọi là Mác, Phao-lô không chịu, và hai người phân rẽ nhau: Ba-na-ba cùng Mác đi thuyền sang Chíp-rơ, còn Phao-lô lên đường với Si-la. Họ trải qua xứ Sy-ri và xứ Si-li-si đến Đẹt-bơ và Lít-trơ, nơi Ti-mô-thê nhập đoàn, băng qua xứ Phi-ri-gi và miền Ga-la-ti, rồi, vì bị Thánh Linh ngăn không cho giảng đạo trong cõi A-si và không cho vào xứ Bi-thi-ni, họ xuống Trô-ách. Một sự hiện thấy gọi họ sang Ma-xê-đoan, nơi Phao-lô lập các Hội thánh tại Phi-líp, Tê-sa-lô-ni-ca và Bê-rê; lần nào cũng bị đuổi đi, ông đến A-thên rồi Cô-rinh-tô, ở lại đó một năm sáu tháng, trước khi đi thuyền qua Ê-phê-sô đến Sê-sa-rê, lên chào thăm Hội thánh và trở về An-ti-ốt."
    - "Cuộc hành trình này chứa những niên đại chắc chắn nhất trong đời Phao-lô. Tại Cô-rinh-tô, Phao-lô gặp A-qui-la và Bê-rít-sin, mới từ Y-ta-li đến vì vua Cơ-lốt đã truyền mọi người Giu-đa phải rời khỏi Rô-ma; Suetonius kể về cuộc trục xuất ấy và Orosius đặt nó vào năm thứ chín đời Cơ-lốt, tức năm 49. Về sau người Giu-đa ở Cô-rinh-tô đem Phao-lô đến trước Ga-li-ôn, quan trấn thủ xứ A-chai, mà năm tại chức, 51–52, được biết qua một bia khắc tại Delphi. Vậy những tháng Phao-lô ở Cô-rinh-tô rơi vào khoảng năm 50–52, và cuộc hành trình bao quanh khoảng ấy; Catholic Encyclopedia năm 1911 định niên đại là 50–53, và bản đồ thể hiện cuộc hành trình vào năm 50."
    - "Từ Trô-ách đến Phi-líp, bản văn kể ở ngôi thứ nhất số nhiều, và cho biết số ngày của một chặng vượt biển: từ Trô-ách đến Sa-mô-tra-xơ và ngày hôm sau đến Nê-a-bô-li. Các thời gian đi đường khác ghi kèm các điểm dừng là ước tính. Những miền đi qua trên đường đến Trô-ách không được nêu thành tên thành, và chặng ấy, cũng như đường từ Bê-rê đến A-thên, không được vẽ trên bản đồ."
  ro:
    - "Fapte 15:36–18:22 povestește a doua călătorie a lui Pavel. După Conciliul de la Ierusalim, Pavel i-a propus lui Barnaba să-i cerceteze pe frații din fiecare cetate în care propovăduiseră. Barnaba voia să-l ia pe Ioan, numit Marcu, Pavel nu voia, și s-au despărțit: Barnaba a navigat cu Marcu spre Cipru, iar Pavel a pornit cu Sila. Au trecut prin Siria și Cilicia până la Derba și Listra, unde li s-a alăturat Timotei, au străbătut Frigia și ținutul Galatiei și, opriți de Duhul să vorbească în Asia și să intre în Bitinia, au coborât la Troa. O vedenie i-a chemat să treacă în Macedonia, unde Pavel a întemeiat biserici la Filipi, Tesalonic și Berea; alungat de fiecare dată mai departe, a mers la Atena și apoi la Corint, unde a stat un an și șase luni, înainte de a naviga prin Efes la Cezareea, de a urca să salute biserica și de a se întoarce la Antiohia."
    - "Această călătorie cuprinde cele mai sigure date din viața lui Pavel. La Corint, Pavel i-a găsit pe Acvila și Priscila, veniți de curând din Italia pentru că Claudiu poruncise ca toți iudeii să părăsească Roma; Suetoniu povestește despre izgonire, iar Orosius o așază în al nouălea an al lui Claudiu, 49 d.Hr. Mai târziu, iudeii din Corint l-au adus pe Pavel înaintea lui Galion, proconsulul Ahaiei, al cărui an de slujbă, 51–52, este cunoscut dintr-o inscripție de la Delfi. Lunile petrecute de Pavel la Corint cad deci pe la 50–52 d.Hr., iar călătoria în jurul lor; Catholic Encyclopedia din 1911 o data în 50–53, iar harta o arată în anul 50 d.Hr."
    - "De la Troa până la Filipi, narațiunea vorbește la persoana întâi plural, iar textul dă zilele unei singure traversări: de la Troa la Samotracia și a doua zi la Neapolis. Celelalte durate de drum date la opriri sunt estimări. Ținuturile străbătute pe drumul spre Troa nu sunt numite ca cetăți, iar acest tronson, ca și drumul de la Berea la Atena, nu este trasat."
  bg:
    - "Деяния, от 15:36 до 18:22, разказват за второто пътуване на Павел. След събора в Йерусалим Павел предложи на Варнава да посетят братята във всеки град, където бяха проповядвали. Варнава искаше да вземе Йоан, наричан Марко, Павел не искаше и те се разделиха: Варнава отплава с Марко за Кипър, а Павел тръгна със Сила. Те минаха през Сирия и Киликия до Дервия и Листра, където Тимотей се присъедини към тях, прекосиха Фригия и Галатийската област и, възпрени от Духа да говорят в Азия и да влязат във Витиния, слязоха в Троада. Едно видение ги призова да минат в Македония, където Павел основа църкви във Филипи, Солун и Верия; прогонван всеки път, той отиде в Атина и после в Коринт, където остана година и шест месеца, преди да отплава през Ефес за Кесария, да възлезе да поздрави църквата и да се върне в Антиохия."
    - "Това пътуване съдържа най-сигурно установените дати в живота на Павел. В Коринт Павел намери Акила и Прискила, наскоро дошли от Италия, защото Клавдий беше заповядал всички юдеи да напуснат Рим; Светоний разказва за изгонването, а Орозий го поставя в деветата година на Клавдий, 49 г. н.е. По-късно коринтските юдеи доведоха Павел пред Галион, проконсул на Ахая, чиято година на служба, 51–52 г., е известна от надпис в Делфи. Така месеците на Павел в Коринт се падат около 50–52 г. н.е., а пътуването е около тях; Католическата енциклопедия от 1911 г. го датира в 50–53 г., а картата го показва в 50 г. н.е."
    - "От Троада до Филипи разказът е в първо лице множествено число и текстът дава дните на едно преплаване: от Троада до Самотраки и на следващия ден до Неапол. Другите времена за път, дадени при спирките, са оценки. Областите, прекосени по пътя към Троада, не са назовани като градове и този участък, както и пътят от Верия до Атина, не е начертан."
stops:
  - place: ae41ab4
    ref: Acts.15.35-Acts.15.40
    note:
      en: "Paul and Silas set out from Antioch."
      ru: "Павел и Сила выходят из Антиохии."
      uk: "Павло й Сила вирушають з Антіохії."
      es: "Pablo y Silas parten de Antioquía."
      pt: "Paulo e Silas partem de Antioquia."
      de: "Paulus und Silas brechen von Antiochia auf."
      fr: "Paul et Silas quittent Antioche."
      pl: "Paweł i Sylas wyruszają z Antiochii."
      it: "Paolo e Sila partono da Antiochia."
      nl: "Paulus en Silas vertrekken uit Antiochië."
      cs: "Pavel a Silas vyrážejí z Antiochie."
      sv: "Paulus och Silas bryter upp från Antiochia."
      nb: "Paulus og Silas bryter opp fra Antiokia."
      tl: "Umalis sina Pablo at Silas mula sa Antioquia."
      da: "Paulus og Silas bryder op fra Antiokia."
      sr: "Павле и Сила полазе из Антиохије."
      hu: "Pál és Szilász elindulnak Antiókhiából."
      fi: "Paavali ja Silas lähtevät Antiokiasta."
      vi: "Phao-lô và Si-la lên đường từ An-ti-ốt."
      ro: "Pavel și Sila pornesc din Antiohia."
      bg: "Павел и Сила тръгват от Антиохия."
    story:
      en: "Paul and Barnabas stayed at Antioch, teaching and preaching the word of the Lord with many others. Some days later Paul proposed that they go back to visit the brothers in every town where they had preached. Barnabas wanted to take John, called Mark, but Paul thought it wrong to take a man who had left them in Pamphylia, and the dispute grew so sharp that they parted. Barnabas took Mark and sailed to Cyprus; Paul chose Silas and set out, commended by the brothers to the grace of God, and went through Syria and Cilicia strengthening the churches."
      ru: "Павел и Варнава оставались в Антиохии, уча и благовествуя слово Господне вместе со многими другими. Через несколько дней Павел предложил снова посетить братьев во всех городах, где они проповедовали. Варнава хотел взять Иоанна, называемого Марком, но Павел считал неправильным брать человека, который оставил их в Памфилии, и спор стал так резок, что они разлучились. Варнава взял Марка и отплыл на Кипр; Павел избрал Силу и отправился, порученный братьями благодати Божией, и проходил Сирию и Киликию, утверждая церкви."
      uk: "Павло й Варнава залишалися в Антіохії, навчаючи й благовістячи слово Господнє разом із багатьма іншими. Через кілька днів Павло запропонував знову відвідати братів у кожному місті, де вони проповідували. Варнава хотів узяти Івана, званого Марком, але Павло вважав неправильним брати того, хто залишив їх у Памфілії, і суперечка стала така гостра, що вони розлучилися. Варнава взяв Марка й відплив на Кіпр; Павло вибрав Силу й вирушив, переданий братами благодаті Божій, і проходив Сирію та Кілікію, зміцнюючи церкви."
      es: "Pablo y Bernabé se quedaron en Antioquía, enseñando y anunciando la palabra del Señor con otros muchos. Algunos días después, Pablo propuso volver a visitar a los hermanos en todas las ciudades donde habían predicado. Bernabé quería llevar a Juan, llamado Marcos, pero a Pablo no le parecía bien llevar a quien los había abandonado en Panfilia, y la disputa se hizo tan aguda que se separaron. Bernabé tomó a Marcos y navegó a Chipre; Pablo escogió a Silas y partió, encomendado por los hermanos a la gracia de Dios, y recorrió Siria y Cilicia confirmando a las iglesias."
      pt: "Paulo e Barnabé permaneceram em Antioquia, ensinando e pregando a palavra do Senhor com muitos outros. Alguns dias depois, Paulo propôs que voltassem para visitar os irmãos em todas as cidades onde tinham pregado. Barnabé queria levar João, chamado Marcos, mas Paulo achava errado levar alguém que os tinha abandonado na Panfília, e a contenda tornou-se tão acalorada que se separaram. Barnabé levou Marcos e navegou para Chipre; Paulo escolheu Silas e partiu, confiado pelos irmãos à graça de Deus, e passou pela Síria e pela Cilícia fortalecendo as igrejas."
      de: "Paulus und Barnabas blieben in Antiochia und lehrten und verkündigten mit vielen anderen das Wort des Herrn. Einige Tage später schlug Paulus vor, zurückzukehren und die Brüder in allen Städten zu besuchen, in denen sie gepredigt hatten. Barnabas wollte Johannes, genannt Markus, mitnehmen, doch Paulus hielt es für falsch, einen Mann mitzunehmen, der sie in Pamphylien verlassen hatte, und der Streit wurde so heftig, dass sie sich trennten. Barnabas nahm Markus mit und segelte nach Zypern; Paulus wählte Silas und brach auf, von den Brüdern der Gnade Gottes befohlen, und zog durch Syrien und Kilikien und stärkte die Gemeinden."
      fr: "Paul et Barnabas demeurèrent à Antioche, enseignant et annonçant avec beaucoup d’autres la parole du Seigneur. Quelques jours plus tard, Paul proposa de retourner visiter les frères dans toutes les villes où ils avaient prêché. Barnabas voulait emmener Jean, surnommé Marc, mais Paul jugea mauvais de prendre un homme qui les avait quittés en Pamphylie, et le différend devint si vif qu’ils se séparèrent. Barnabas prit Marc et s’embarqua pour Chypre ; Paul choisit Silas et partit, recommandé par les frères à la grâce de Dieu, et parcourut la Syrie et la Cilicie en fortifiant les Églises."
      pl: "Paweł i Barnaba pozostali w Antiochii, nauczając i głosząc wraz z wieloma innymi słowo Pańskie. Po kilku dniach Paweł zaproponował, by wrócili i odwiedzili braci w każdym mieście, w którym głosili. Barnaba chciał zabrać Jana zwanego Markiem, lecz Paweł uważał, że nie należy brać człowieka, który opuścił ich w Pamfilii, i spór stał się tak ostry, że się rozstali. Barnaba wziął Marka i odpłynął na Cypr; Paweł wybrał Sylasa i wyruszył, polecony przez braci łasce Bożej, i przeszedł przez Syrię i Cylicję, umacniając Kościoły."
      it: "Paolo e Barnaba rimasero ad Antiochia, insegnando e annunciando con molti altri la parola del Signore. Alcuni giorni dopo Paolo propose di tornare a visitare i fratelli in ogni città dove avevano predicato. Barnaba voleva prendere Giovanni, detto Marco, ma Paolo riteneva sbagliato prendere con sé uno che li aveva lasciati in Panfilia, e il contrasto si fece così aspro che si separarono. Barnaba prese Marco e navigò verso Cipro; Paolo scelse Sila e partì, raccomandato dai fratelli alla grazia di Dio, e percorse la Siria e la Cilicia confermando le chiese."
      nl: "Paulus en Barnabas bleven te Antiochië en leerden en verkondigden met vele anderen het woord van de Heer. Enkele dagen later stelde Paulus voor terug te gaan en de broeders te bezoeken in alle steden waar zij gepredikt hadden. Barnabas wilde Johannes, genaamd Marcus, meenemen, maar Paulus vond het niet juist iemand mee te nemen die hen in Pamfylië verlaten had, en het geschil werd zo scherp dat zij uiteengingen. Barnabas nam Marcus mee en voer naar Cyprus; Paulus koos Silas en vertrok, door de broeders aan de genade van God opgedragen, en trok door Syrië en Cilicië en versterkte de gemeenten."
      cs: "Pavel a Barnabáš zůstali v Antiochii a s mnoha dalšími učili a kázali slovo Páně. Po několika dnech Pavel navrhl, aby se vrátili a navštívili bratry v každém městě, kde kázali. Barnabáš chtěl vzít s sebou Jana zvaného Marek, ale Pavel pokládal za nesprávné brát člověka, který je opustil v Pamfylii, a spor se tak vyostřil, že se rozešli. Barnabáš vzal Marka a odplul na Kypr; Pavel si vybral Silase a vydal se na cestu, svěřen bratřími milosti Boží, a procházel Sýrií a Kilikií a utvrzoval církve."
      sv: "Paulus och Barnabas stannade i Antiochia och undervisade och förkunnade Herrens ord tillsammans med många andra. Några dagar senare föreslog Paulus att de skulle fara tillbaka och besöka bröderna i alla de städer där de hade förkunnat. Barnabas ville ta med Johannes, som kallades Markus, men Paulus tyckte att det var fel att ta med en man som hade lämnat dem i Pamfylien, och tvisten blev så skarp att de skildes åt. Barnabas tog med sig Markus och seglade till Cypern; Paulus valde Silas och bröt upp, anbefalld av bröderna åt Guds nåd, och drog genom Syrien och Cilicien och styrkte församlingarna."
      nb: "Paulus og Barnabas ble i Antiokia og lærte og forkynte Herrens ord sammen med mange andre. Noen dager senere foreslo Paulus at de skulle dra tilbake og besøke brødrene i hver by der de hadde forkynt. Barnabas ville ta med Johannes, som ble kalt Markus, men Paulus mente det var galt å ta med en mann som hadde forlatt dem i Pamfylia, og striden ble så skarp at de skiltes. Barnabas tok Markus med seg og seilte til Kypros; Paulus valgte Silas og brøt opp, overgitt av brødrene til Guds nåde, og dro gjennom Syria og Kilikia og styrket menighetene."
      tl: "Nanatili sa Antioquia sina Pablo at Bernabe, na nagtuturo at nangangaral ng salita ng Panginoon kasama ng marami pang iba. Pagkaraan ng ilang araw ay iminungkahi ni Pablo na bumalik sila upang dalawin ang mga kapatid sa bawat bayang kanilang pinangaralan. Ibig ni Bernabe na isama si Juan na tinatawag na Marcos, ngunit inakala ni Pablo na hindi nararapat isama ang taong humiwalay sa kanila sa Pamfilia, at naging mainit ang pagtatalo ano pa't sila'y naghiwalay. Isinama ni Bernabe si Marcos at naglayag sa Chipre; hinirang ni Pablo si Silas at umalis, na ipinagtagubilin ng mga kapatid sa biyaya ng Diyos, at tinahak ang Siria at Cilicia na pinatitibay ang mga iglesia."
      da: "Paulus og Barnabas blev i Antiokia, hvor de sammen med mange andre lærte og forkyndte Herrens ord. Nogle dage senere foreslog Paulus, at de skulle drage tilbage og besøge brødrene i hver by, hvor de havde forkyndt. Barnabas ville tage Johannes, kaldet Markus, med, men Paulus mente, at det var forkert at tage en mand med, som havde forladt dem i Pamfylien, og striden blev så skarp, at de skiltes. Barnabas tog Markus med og sejlede til Cypern; Paulus valgte Silas og drog af sted, anbefalet af brødrene til Guds nåde, og drog gennem Syrien og Kilikien og styrkede menighederne."
      sr: "Павле и Варнава остали су у Антиохији, учећи и проповедајући реч Господњу с многим другима. После неколико дана Павле је предложио да се врате и обиђу браћу у сваком граду где су проповедали. Варнава је хтео да поведе Јована прозваног Марко, али Павле је сматрао да не ваља водити човека који их је оставио у Памфилији, и распра је постала тако оштра да су се разишли. Варнава је узео Марка и отпловио на Кипар; Павле је изабрао Силу и кренуо, предан од браће благодати Божјој, и пролазио кроз Сирију и Киликију утврђујући цркве."
      hu: "Pál és Barnabás Antiókhiában maradt, sok mással együtt tanítva és hirdetve az Úr igéjét. Néhány nap múlva Pál azt javasolta, hogy menjenek vissza, és látogassák meg a testvéreket minden városban, ahol prédikáltak. Barnabás magukkal akarta vinni a Márknak nevezett Jánost, de Pál helytelennek tartotta, hogy olyan embert vigyenek, aki Pamfíliában elhagyta őket, és a vita annyira kiéleződött, hogy elváltak. Barnabás maga mellé vette Márkot, és Ciprusra hajózott; Pál Szilászt választotta, és a testvérektől Isten kegyelmére bízva elindult, és Szírián és Kilikián át ment, erősítve a gyülekezeteket."
      fi: "Paavali ja Barnabas viipyivät Antiokiassa opettaen ja julistaen monien muiden kanssa Herran sanaa. Muutamien päivien kuluttua Paavali ehdotti, että he lähtisivät takaisin katsomaan veljiä kaikissa kaupungeissa, joissa he olivat julistaneet. Barnabas halusi ottaa mukaan Johanneksen, jota kutsuttiin Markukseksi, mutta Paavali piti vääränä ottaa mukaan miestä, joka oli jättänyt heidät Pamfyliassa, ja kiista kävi niin kiivaaksi, että he erosivat. Barnabas otti Markuksen mukaansa ja purjehti Kyprokselle; Paavali valitsi Silaan ja lähti matkaan veljien jättämänä Jumalan armon haltuun ja kulki Syyrian ja Kilikian kautta vahvistaen seurakuntia."
      vi: "Phao-lô và Ba-na-ba ở lại An-ti-ốt, cùng nhiều người khác dạy dỗ và rao giảng đạo Chúa. Ít ngày sau, Phao-lô đề nghị trở lại thăm anh em trong mọi thành mà họ đã giảng đạo. Ba-na-ba muốn đem theo Giăng cũng gọi là Mác, nhưng Phao-lô cho là không nên đem theo người đã lìa họ tại xứ Bam-phi-ly, và cuộc cãi lẫy dữ dội đến nỗi hai người phân rẽ nhau. Ba-na-ba đem Mác đi thuyền sang Chíp-rơ; Phao-lô chọn Si-la và lên đường, được anh em giao phó cho ân điển Đức Chúa Trời, rồi trải qua xứ Sy-ri và xứ Si-li-si, làm cho các Hội thánh được vững bền."
      ro: "Pavel și Barnaba au rămas la Antiohia, învățând și vestind cuvântul Domnului împreună cu mulți alții. După câteva zile, Pavel a propus să se întoarcă să-i cerceteze pe frații din fiecare cetate în care propovăduiseră. Barnaba voia să-l ia pe Ioan, numit Marcu, dar Pavel socotea că nu se cuvine să ia cu ei un om care îi părăsise în Pamfilia, iar neînțelegerea s-a ascuțit atât de mult încât s-au despărțit. Barnaba l-a luat pe Marcu și a navigat spre Cipru; Pavel l-a ales pe Sila și a pornit, încredințat de frați harului lui Dumnezeu, și a străbătut Siria și Cilicia, întărind bisericile."
      bg: "Павел и Варнава останаха в Антиохия, като поучаваха и проповядваха словото Господне заедно с много други. След няколко дни Павел предложи да се върнат и да посетят братята във всеки град, където бяха проповядвали. Варнава искаше да вземе Йоан, наричан Марко, но Павел смяташе, че не е редно да вземат човек, който ги беше напуснал в Памфилия, и спорът стана толкова остър, че те се разделиха. Варнава взе Марко и отплава за Кипър; Павел избра Сила и тръгна, препоръчан от братята на Божията благодат, и минаваше през Сирия и Киликия, като утвърждаваше църквите."
  - place: aa401a9
    ref: Acts.16.1
