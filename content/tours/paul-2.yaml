    story:
      en: "Paul came again to Derbe, the farthest town of his first journey; this time he came from the east, after going through Syria and Cilicia."
      ru: "Павел снова пришёл в Дервию, самый дальний город своего первого путешествия; на этот раз он пришёл с востока, пройдя Сирию и Киликию."
      uk: "Павло знову прийшов до Дервії, найдальшого міста своєї першої подорожі; цього разу він прийшов зі сходу, пройшовши Сирію та Кілікію."
      es: "Pablo llegó de nuevo a Derbe, la ciudad más lejana de su primer viaje; esta vez venía del este, después de recorrer Siria y Cilicia."
      pt: "Paulo chegou de novo a Derbe, a cidade mais distante da sua primeira viagem; desta vez vinha do leste, depois de passar pela Síria e pela Cilícia."
      de: "Paulus kam wieder nach Derbe, der entferntesten Stadt seiner ersten Reise; diesmal kam er von Osten, nachdem er durch Syrien und Kilikien gezogen war."
      fr: "Paul revint à Derbe, la ville la plus éloignée de son premier voyage ; cette fois, il arrivait de l’est, après avoir traversé la Syrie et la Cilicie."
      pl: "Paweł przybył ponownie do Derbe, najdalszego miasta swojej pierwszej podróży; tym razem przyszedł od wschodu, po przejściu przez Syrię i Cylicję."
      it: "Paolo tornò a Derbe, la città più lontana del suo primo viaggio; questa volta vi giunse da est, dopo aver attraversato la Siria e la Cilicia."
      nl: "Paulus kwam opnieuw te Derbe, de verste stad van zijn eerste reis; ditmaal kwam hij uit het oosten, nadat hij door Syrië en Cilicië was getrokken."
      cs: "Pavel přišel znovu do Derbe, nejvzdálenějšího města své první cesty; tentokrát přišel od východu, poté co prošel Sýrií a Kilikií."
      sv: "Paulus kom åter till Derbe, den yttersta staden på hans första resa; denna gång kom han österifrån, efter att ha dragit genom Syrien och Cilicien."
      nb: "Paulus kom igjen til Derbe, den fjerneste byen på hans første reise; denne gangen kom han fra øst, etter å ha dratt gjennom Syria og Kilikia."
      tl: "Muling dumating si Pablo sa Derbe, ang pinakamalayong bayan ng kaniyang unang paglalakbay; sa pagkakataong ito ay dumating siya mula sa silangan, pagkatapos tahakin ang Siria at Cilicia."
      da: "Paulus kom igen til Derbe, den fjerneste by på hans første rejse; denne gang kom han fra øst, efter at være draget gennem Syrien og Kilikien."
      sr: "Павле је поново дошао у Дерву, најдаљи град свог првог путовања; овај пут дошао је са истока, пошто је прошао кроз Сирију и Киликију."
      hu: "Pál ismét Derbébe érkezett, első útjának legtávolabbi városába; ezúttal keletről jött, miután Szírián és Kilikián át haladt."
      fi: "Paavali tuli jälleen Derbeen, ensimmäisen matkansa kaukaisimpaan kaupunkiin; tällä kertaa hän tuli idästä kuljettuaan Syyrian ja Kilikian kautta."
      vi: "Phao-lô lại đến Đẹt-bơ, thành xa nhất của cuộc hành trình thứ nhất; lần này ông đến từ phía đông, sau khi đã trải qua xứ Sy-ri và xứ Si-li-si."
      ro: "Pavel a venit din nou la Derba, cea mai îndepărtată cetate a primei sale călătorii; de data aceasta a venit dinspre răsărit, după ce străbătuse Siria și Cilicia."
      bg: "Павел дойде отново в Дервия, най-далечния град от първото му пътуване; този път той дойде от изток, след като беше минал през Сирия и Киликия."
  - place: af0719d
    ref: Acts.16.2-Acts.16.3
    note:
      en: "Timothy joins them."
      ru: "К ним присоединяется Тимофей."
      uk: "До них приєднується Тимофій."
      es: "Timoteo se une a ellos."
      pt: "Timóteo junta-se a eles."
      de: "Timotheus schließt sich ihnen an."
      fr: "Timothée se joint à eux."
      pl: "Dołącza do nich Tymoteusz."
      it: "Timoteo si unisce a loro."
      nl: "Timoteüs voegt zich bij hen."
      cs: "Připojuje se k nim Timoteus."
      sv: "Timoteus ansluter sig till dem."
      nb: "Timoteus slutter seg til dem."
      tl: "Sumasama sa kanila si Timoteo."
      da: "Timotheus slutter sig til dem."
      sr: "Придружује им се Тимотије."
      hu: "Timóteus csatlakozik hozzájuk."
      fi: "Timoteus liittyy heihin."
      vi: "Ti-mô-thê nhập bọn với họ."
      ro: "Timotei li se alătură."
      bg: "Тимотей се присъединява към тях."
    story:
      en: "At Lystra there was a disciple named Timothy, the son of a Jewish woman who believed and of a Greek father; the brothers at Lystra and Iconium spoke well of him. Paul wanted him to come along, and circumcised him because of the Jews in those parts, who all knew that his father was a Greek. As they went through the towns, they delivered the decisions of the apostles and elders at Jerusalem, and the churches grew stronger in the faith and larger in number every day."
      ru: "В Листре был ученик по имени Тимофей, сын уверовавшей иудеянки и отца-эллина; братья в Листре и Иконии отзывались о нём хорошо. Павел пожелал взять его с собой и обрезал его ради иудеев тех мест, которые все знали, что его отец был эллин. Проходя по городам, они передавали постановления апостолов и пресвитеров в Иерусалиме, и церкви утверждались в вере и ежедневно умножались числом."
      uk: "У Лістрі був учень на ім’я Тимофій, син віруючої юдейки й батька-грека; брати в Лістрі та Іконії добре про нього відгукувалися. Павло захотів узяти його з собою і обрізав його задля юдеїв у тих краях, бо всі знали, що його батько був грек. Проходячи містами, вони передавали постанови апостолів і старійшин у Єрусалимі, і церкви зміцнювалися у вірі й щодня збільшувалися числом."
      es: "En Listra había un discípulo llamado Timoteo, hijo de una mujer judía creyente y de padre griego; los hermanos de Listra y de Iconio daban buen testimonio de él. Pablo quiso que fuera con él, y lo circuncidó por causa de los judíos de aquellos lugares, que sabían todos que su padre era griego. Al pasar por las ciudades, entregaban las decisiones de los apóstoles y los ancianos de Jerusalén, y las iglesias se afirmaban en la fe y crecían en número cada día."
      pt: "Em Listra havia um discípulo chamado Timóteo, filho de uma judia crente e de pai grego; os irmãos de Listra e de Icônio davam bom testemunho dele. Paulo quis que ele o acompanhasse e o circuncidou por causa dos judeus daquelas regiões, pois todos sabiam que o seu pai era grego. Ao passarem pelas cidades, entregavam as decisões dos apóstolos e presbíteros de Jerusalém, e as igrejas eram fortalecidas na fé e cresciam em número a cada dia."
      de: "In Lystra war ein Jünger namens Timotheus, der Sohn einer gläubigen jüdischen Frau und eines griechischen Vaters; die Brüder in Lystra und Ikonion gaben ihm ein gutes Zeugnis. Paulus wollte ihn mitnehmen und beschnitt ihn um der Juden willen, die in jener Gegend lebten und alle wussten, dass sein Vater ein Grieche war. Als sie durch die Städte zogen, überbrachten sie die Beschlüsse der Apostel und Ältesten in Jerusalem, und die Gemeinden wurden im Glauben gefestigt und wuchsen täglich an Zahl."
      fr: "Il y avait à Lystre un disciple nommé Timothée, fils d’une femme juive croyante et d’un père grec ; les frères de Lystre et d’Icone rendaient de lui un bon témoignage. Paul voulut l’emmener et le circoncit à cause des Juifs de ces régions, qui savaient tous que son père était grec. En passant par les villes, ils transmettaient les décisions des apôtres et des anciens de Jérusalem, et les Églises se fortifiaient dans la foi et augmentaient en nombre de jour en jour."
      pl: "W Listrze był uczeń imieniem Tymoteusz, syn wierzącej Żydówki i ojca Greka; bracia w Listrze i Ikonium wydawali o nim dobre świadectwo. Paweł chciał, by z nim poszedł, i obrzezał go ze względu na Żydów w tamtych stronach, którzy wszyscy wiedzieli, że jego ojciec był Grekiem. Przechodząc przez miasta, przekazywali postanowienia apostołów i starszych w Jerozolimie, a Kościoły umacniały się w wierze i z każdym dniem rosły w liczbę."
      it: "A Listra c’era un discepolo di nome Timoteo, figlio di una donna giudea credente e di padre greco; i fratelli di Listra e di Icònio ne parlavano bene. Paolo volle che venisse con lui, e lo circoncise a motivo dei Giudei di quei luoghi, che sapevano tutti che suo padre era greco. Passando per le città, trasmettevano le decisioni degli apostoli e degli anziani di Gerusalemme, e le chiese si rafforzavano nella fede e crescevano di numero ogni giorno."
      nl: "Te Lystra was een discipel genaamd Timoteüs, de zoon van een Joodse vrouw die gelovig was en van een Griekse vader; de broeders te Lystra en Ikonium spraken goed over hem. Paulus wilde hem meenemen en besneed hem vanwege de Joden in die streken, die allen wisten dat zijn vader een Griek was. Terwijl zij door de steden trokken, brachten zij de besluiten over van de apostelen en oudsten te Jeruzalem, en de gemeenten werden versterkt in het geloof en namen dagelijks in aantal toe."
      cs: "V Lystře byl učedník jménem Timoteus, syn věřící Židovky a otce Řeka; bratři v Lystře a Ikoniu o něm dobře mluvili. Pavel chtěl, aby šel s ním, a obřezal ho kvůli Židům v těch končinách, kteří všichni věděli, že jeho otec byl Řek. Když procházeli městy, předávali rozhodnutí apoštolů a starších v Jeruzalémě, a církve se upevňovaly ve víře a den ode dne rostly v počtu."
      sv: "I Lystra fanns en lärjunge som hette Timoteus, son till en troende judisk kvinna och en grekisk fader; bröderna i Lystra och Ikonion gav honom gott vittnesbörd. Paulus ville att han skulle följa med, och han omskar honom för de judars skull som bodde i dessa trakter, eftersom alla visste att hans fader var grek. När de drog genom städerna överlämnade de de beslut som apostlarna och de äldste i Jerusalem hade fattat, och församlingarna blev starkare i tron och växte i antal för var dag."
      nb: "I Lystra var det en disippel som het Timoteus, sønn av en jødisk kvinne som trodde, og av en gresk far; brødrene i Lystra og Ikonium hadde godt å si om ham. Paulus ville ha ham med, og han omskar ham for de jødenes skyld som bodde på de stedene, for alle visste at faren hans var greker. Mens de dro gjennom byene, overleverte de beslutningene som apostlene og de eldste i Jerusalem hadde tatt, og menighetene ble sterkere i troen og vokste i tall for hver dag."
      tl: "Sa Listra ay may isang alagad na nagngangalang Timoteo, anak ng isang Judiang sumasampalataya at ng isang amang Griego; mabuti ang patotoo tungkol sa kaniya ng mga kapatid sa Listra at Iconio. Ibig ni Pablo na sumama siya, at tinuli niya siya dahil sa mga Judio sa mga dakong yaon, na nakaaalam na lahat na Griego ang kaniyang ama. Sa kanilang pagtahak sa mga bayan, ibinigay nila ang mga pasiya ng mga apostol at ng mga matanda sa Jerusalem, at ang mga iglesia ay lalong tumibay sa pananampalataya at dumami ang bilang araw-araw."
      da: "I Lystra var der en discipel ved navn Timotheus, søn af en troende jødisk kvinde og en græsk far; brødrene i Lystra og Ikonion gav ham godt vidnesbyrd. Paulus ønskede, at han skulle drage med, og omskar ham af hensyn til jøderne på de egne, som alle vidste, at hans far var græker. Mens de drog gennem byerne, overbragte de de bestemmelser, apostlene og de ældste i Jerusalem havde truffet, og menighederne blev stærkere i troen og voksede i antal hver dag."
      sr: "У Листри је био један ученик по имену Тимотије, син Јеврејке која је веровала и оца Грка; браћа у Листри и Иконију добро су сведочила о њему. Павле је хтео да пође с њим, и обрезао га је ради Јевреја у оним местима, који су сви знали да му је отац Грк. Пролазећи кроз градове, предавали су им одлуке апостола и старешина у Јерусалиму, и цркве су се утврђивале у вери и сваки дан бивале све бројније."
      hu: "Lisztrában volt egy Timóteus nevű tanítvány, egy hívő zsidó asszony és egy görög apa fia; a lisztrai és ikóniumi testvérek jót mondtak róla. Pál magával akarta vinni, és körülmetélte az azon a vidéken élő zsidók miatt, akik mind tudták, hogy az apja görög. Ahogy átmentek a városokon, átadták a jeruzsálemi apostolok és vének határozatait, a gyülekezetek pedig napról napra erősödtek a hitben, és gyarapodtak létszámban."
      fi: "Lystrassa oli opetuslapsi nimeltä Timoteus, uskovan juutalaisen naisen ja kreikkalaisen isän poika; Lystran ja Ikonionin veljet puhuivat hänestä hyvää. Paavali halusi ottaa hänet mukaansa ja ympärileikkasi hänet niillä seuduilla asuvien juutalaisten tähden, sillä kaikki tiesivät, että hänen isänsä oli kreikkalainen. Kulkiessaan kaupunkien läpi he antoivat tiedoksi apostolien ja Jerusalemin vanhimpien päätökset, ja seurakunnat vahvistuivat uskossa ja kasvoivat päivä päivältä."
      vi: "Tại Lít-trơ có một môn đồ tên là Ti-mô-thê, con của một người đàn bà Giu-đa đã tin, còn cha là người Gờ-réc; anh em ở Lít-trơ và Y-cô-ni đều làm chứng tốt về người. Phao-lô muốn đem người theo, và làm phép cắt bì cho người vì cớ những người Giu-đa ở các nơi đó, vì ai nấy đều biết cha người là người Gờ-réc. Đi qua các thành, họ truyền lại những điều mà các sứ đồ và trưởng lão tại Giê-ru-sa-lem đã quyết định, và các Hội thánh càng ngày càng vững vàng trong đức tin và thêm số người."
      ro: "La Listra era un ucenic numit Timotei, fiul unei femei iudee credincioase și al unui tată grec; frații din Listra și Iconia îl vorbeau de bine. Pavel a vrut să-l ia cu el și l-a tăiat împrejur din cauza iudeilor din acele părți, care știau toți că tatăl lui era grec. Pe când treceau prin cetăți, le predau hotărârile apostolilor și prezbiterilor din Ierusalim, iar bisericile se întăreau în credință și sporeau la număr în fiecare zi."
      bg: "В Листра имаше ученик на име Тимотей, син на вярваща юдейка и на баща грък; братята в Листра и Икония свидетелстваха добре за него. Павел искаше той да тръгне с него и го обряза заради юдеите по онези места, които всички знаеха, че баща му е грък. Като минаваха през градовете, те предаваха решенията на апостолите и презвитерите в Йерусалим, и църквите се утвърждаваха във вярата и всеки ден растяха на брой."
  - place: a91c509
    ref: Acts.16.8-Acts.16.10
    by: untold
    note:
      en: "The vision of the man of Macedonia."
      ru: "Видение мужа Македонянина."
      uk: "Видіння македонянина."
      es: "La visión del varón macedonio."
      pt: "A visão do homem da Macedônia."
      de: "Das Gesicht des Mannes aus Mazedonien."
      fr: "La vision de l’homme de Macédoine."
      pl: "Widzenie męża Macedończyka."
      it: "La visione dell’uomo di Macedonia."
      nl: "Het visioen van de man uit Macedonië."
      cs: "Vidění muže z Makedonie."
      sv: "Synen av mannen från Makedonien."
      nb: "Synet av mannen fra Makedonia."
      tl: "Ang pangitain ng lalaking taga-Macedonia."
      da: "Synet af manden fra Makedonien."
      sr: "Виђење човека македонског."
      hu: "A macedón férfi látomása."
      fi: "Makedonialaisen miehen näky."
      vi: "Dị tượng người Ma-xê-đoan."
      ro: "Vedenia bărbatului macedonean."
      bg: "Видението за македонеца."
    story:
      en: "They went through Phrygia and the region of Galatia, forbidden by the Holy Spirit to speak the word in Asia; when they came to Mysia they tried to go into Bithynia, but the Spirit did not allow them, and passing by Mysia they came down to Troas. Alexandria Troas, a Roman colony on the Aegean coast of the Troad, was the chief harbour for the crossing from Asia to Macedonia. There Paul saw a vision in the night: a man of Macedonia stood and begged him to come over and help them. From here the narrative speaks in the first person plural: they sought at once to go to Macedonia, concluding that God had called them to preach the gospel there."
      ru: "Они прошли через Фригию и Галатийскую страну, так как Дух Святой не допустил их проповедовать слово в Асии; дойдя до Мисии, они пытались идти в Вифинию, но Дух не позволил им, и, миновав Мисию, они спустились в Троаду. Александрия Троада, римская колония на эгейском побережье Троады, была главной гаванью для переправы из Асии в Македонию. Здесь Павлу было ночью видение: стоял некий македонянин и просил его прийти и помочь им. С этого места повествование ведётся от первого лица множественного числа: они тотчас стали искать пути в Македонию, заключив, что Бог призвал их благовествовать там."
      uk: "Вони пройшли Фригію й Галатійський край, бо Святий Дух заборонив їм проповідувати слово в Азії; дійшовши до Місії, вони намагалися піти до Віфінії, але Дух не пустив їх, і, минувши Місію, вони спустилися до Троади. Александрія Троада, римська колонія на егейському узбережжі Троади, була головною гаванню для переправи з Азії до Македонії. Тут Павлові вночі було видіння: стояв один македонянин і благав його перейти й допомогти їм. Відтепер оповідь ведеться від першої особи множини: вони одразу почали шукати, як дістатися до Македонії, зрозумівши, що Бог покликав їх благовістити там."
      es: "Atravesaron Frigia y la región de Galacia, porque el Espíritu Santo les prohibió hablar la palabra en Asia; al llegar a Misia intentaron ir a Bitinia, pero el Espíritu no se lo permitió, y pasando por Misia bajaron a Troas. Alejandría de Troas, colonia romana en la costa egea de la Tróade, era el principal puerto para la travesía de Asia a Macedonia. Allí Pablo tuvo de noche una visión: un hombre de Macedonia estaba en pie y le rogaba que pasara a ayudarlos. Desde aquí el relato habla en primera persona del plural: procuraron enseguida partir a Macedonia, convencidos de que Dios los había llamado a anunciar allí el evangelio."
      pt: "Atravessaram a Frígia e a região da Galácia, impedidos pelo Espírito Santo de anunciar a palavra na Ásia; quando chegaram à Mísia, tentaram ir para a Bitínia, mas o Espírito não lhes permitiu, e, passando pela Mísia, desceram a Trôade. Alexandria Trôade, colônia romana na costa egeia da Tróade, era o principal porto para a travessia da Ásia para a Macedônia. Ali Paulo teve uma visão durante a noite: um homem da Macedônia estava em pé e lhe rogava que passasse para ajudá-los. Daqui em diante a narrativa fala na primeira pessoa do plural: procuraram imediatamente partir para a Macedônia, concluindo que Deus os havia chamado para pregar ali o Evangelho."
      de: "Sie zogen durch Phrygien und das Land Galatien, da der Heilige Geist ihnen verwehrte, das Wort in Asien zu reden; als sie nach Mysien kamen, versuchten sie, nach Bithynien zu ziehen, doch der Geist ließ es ihnen nicht zu, und sie zogen an Mysien vorüber und kamen hinab nach Troas. Alexandria Troas, eine römische Kolonie an der ägäischen Küste der Troas, war der wichtigste Hafen für die Überfahrt von Asien nach Mazedonien. Dort sah Paulus in der Nacht ein Gesicht: Ein Mann aus Mazedonien stand da und bat ihn, herüberzukommen und ihnen zu helfen. Von hier an spricht die Erzählung in der ersten Person Plural: Sie suchten sogleich nach Mazedonien zu reisen, gewiss, dass Gott sie berufen hatte, dort das Evangelium zu verkündigen."
      fr: "Ils traversèrent la Phrygie et le pays de Galatie, le Saint-Esprit leur ayant interdit d’annoncer la parole en Asie ; arrivés en Mysie, ils tentèrent d’entrer en Bithynie, mais l’Esprit ne le leur permit pas, et, passant par la Mysie, ils descendirent à Troas. Alexandrie de Troade, colonie romaine sur la côte égéenne de la Troade, était le principal port pour la traversée de l’Asie vers la Macédoine. Là, Paul eut une vision pendant la nuit : un Macédonien se tenait devant lui et le suppliait de passer les secourir. À partir d’ici, le récit parle à la première personne du pluriel : ils cherchèrent aussitôt à se rendre en Macédoine, concluant que Dieu les appelait à y annoncer la bonne nouvelle."
      pl: "Przeszli przez Frygię i krainę galacką, gdyż Duch Święty zabronił im głosić słowo w Azji; gdy przybyli do Myzji, próbowali pójść do Bitynii, lecz Duch im nie pozwolił, więc minąwszy Myzję, zeszli do Troady. Aleksandria Troada, rzymska kolonia na egejskim wybrzeżu Troady, była głównym portem przeprawy z Azji do Macedonii. Tam Paweł miał w nocy widzenie: pewien Macedończyk stał i prosił go, by przeprawił się i im pomógł. Odtąd narracja prowadzona jest w pierwszej osobie liczby mnogiej: od razu starali się udać do Macedonii, wnioskując, że Bóg powołał ich, by tam głosili Ewangelię."
      it: "Attraversarono la Frigia e il paese della Galazia, poiché lo Spirito Santo aveva vietato loro di annunciare la parola in Asia; giunti in Misia, tentarono di andare in Bitinia, ma lo Spirito non lo permise loro, e oltrepassata la Misia scesero a Troade. Alessandria Troade, colonia romana sulla costa egea della Troade, era il porto principale per la traversata dall’Asia alla Macedonia. Lì Paolo ebbe di notte una visione: un uomo macedone gli stava davanti e lo supplicava di passare ad aiutarli. Da qui il racconto parla alla prima persona plurale: cercarono subito di partire per la Macedonia, concludendo che Dio li aveva chiamati ad annunciarvi il vangelo."
      nl: "Zij trokken door Frygië en het Galatische land, omdat de Heilige Geest hun verbood het woord in Asia te spreken; toen zij bij Mysië kwamen, probeerden zij naar Bithynië te reizen, maar de Geest liet het hun niet toe, en Mysië voorbijtrekkend kwamen zij af naar Troas. Alexandria Troas, een Romeinse kolonie aan de Egeïsche kust van de Troas, was de belangrijkste haven voor de overtocht van Asia naar Macedonië. Daar zag Paulus 's nachts een visioen: een man uit Macedonië stond daar en smeekte hem over te komen en hen te helpen. Vanaf hier spreekt het verhaal in de eerste persoon meervoud: zij zochten terstond naar Macedonië te reizen, in de overtuiging dat God hen geroepen had daar het Evangelie te verkondigen."
      cs: "Prošli Frygií a galatským krajem, protože jim Duch svatý zakázal mluvit slovo v Asii; když přišli do Mýsie, pokoušeli se jít do Bithýnie, ale Duch jim to nedovolil, a tak minuli Mýsii a sestoupili do Troady. Alexandreia Troas, římská kolonie na egejském pobřeží Troady, byla hlavním přístavem pro přeplavbu z Asie do Makedonie. Tam měl Pavel v noci vidění: stál před ním jakýsi Makedonec a prosil ho, aby se přeplavil a pomohl jim. Odtud vypráví text v první osobě množného čísla: hned se snažili odejít do Makedonie, neboť usoudili, že je tam Bůh povolal kázat evangelium."
      sv: "De drog genom Frygien och det galatiska landet, eftersom den helige Ande hindrade dem från att förkunna ordet i Asien; när de kom till Mysien försökte de fara in i Bitynien, men Anden tillät dem inte, och de drog förbi Mysien och kom ned till Troas. Alexandria Troas, en romersk koloni vid Egeiska havets kust i Troaden, var den viktigaste hamnen för överfarten från Asien till Makedonien. Där såg Paulus en syn om natten: en makedonisk man stod och bad honom att komma över och hjälpa dem. Härifrån talar berättelsen i första person plural: de sökte genast att komma till Makedonien, i förvissning om att Gud hade kallat dem att förkunna evangelium där."
      nb: "De dro gjennom Frygia og det galatiske landet, ettersom Den hellige ånd hindret dem i å tale ordet i Asia; da de kom til Mysia, prøvde de å dra inn i Bitynia, men Ånden tillot dem det ikke, og de dro forbi Mysia og kom ned til Troas. Alexandria Troas, en romersk koloni ved Egeerhavets kyst i Troas-landskapet, var den viktigste havnen for overfarten fra Asia til Makedonia. Der så Paulus et syn om natten: en makedonsk mann sto og ba ham komme over og hjelpe dem. Herfra taler fortellingen i første person flertall: de søkte straks å komme til Makedonia, fordi de forsto at Gud hadde kalt dem til å forkynne evangeliet der."
      tl: "Tinahak nila ang Frigia at ang lupain ng Galacia, palibhasa'y pinagbawalan ng Espiritu Santo na saysayin ang salita sa Asia; nang dumating sila sa Misia ay pinagsikapan nilang pumasok sa Bitinia, ngunit hindi sila tinulutan ng Espiritu, at pagkaraan sa Misia ay lumusong sila sa Troas. Ang Alexandria Troas, isang koloniyang Romano sa baybayin ng Aegeo sa Troad, ang pangunahing daungan para sa pagtawid mula Asia patungong Macedonia. Doon ay nakakita si Pablo ng isang pangitain sa gabi: isang lalaking taga-Macedonia ang nakatayo at namamanhik sa kaniya na tumawid at tulungan sila. Mula rito ay nagsasalita ang salaysay sa unang panauhang maramihan: pagdaka'y pinagsikapan nilang magtungo sa Macedonia, na pinatutunayang tinawag sila ng Diyos upang ipangaral doon ang evangelio."
      da: "De drog gennem Frygien og det galatiske land, da Helligånden havde forbudt dem at tale ordet i Asien; da de kom til Mysien, forsøgte de at drage ind i Bithynien, men Ånden tillod dem det ikke, og de drog forbi Mysien og kom ned til Troas. Alexandria Troas, en romersk koloni på kysten af landskabet Troas ud mod Det Ægæiske Hav, var hovedhavnen for overfarten fra Asien til Makedonien. Der så Paulus et syn om natten: en mand fra Makedonien stod og bad ham komme over og hjælpe dem. Herfra taler beretningen i første person flertal: de søgte straks at komme til Makedonien, idet de sluttede, at Gud havde kaldet dem til at forkynde evangeliet der."
      sr: "Прошли су кроз Фригију и галатијску земљу, јер им је Дух Свети забранио да говоре реч у Азији; кад су дошли у Мисију, покушали су да оду у Витинију, али Дух им није дао, па су, прошавши Мисију, сишли у Троаду. Александрија Троада, римска колонија на егејској обали Троаде, била је главна лука за прелазак из Азије у Македонију. Ту је Павле ноћу видео виђење: један човек из Македоније стајао је и молио га да пређе и помогне им. Одавде приповест говори у првом лицу множине: одмах су гледали да пођу у Македонију, закључивши да их је Бог позвао да тамо проповедају јеванђеље."
      hu: "Átmentek Frígián és Galácia vidékén, mert a Szentlélek megtiltotta nekik, hogy Ázsiában hirdessék az igét; amikor Müsiába értek, megpróbáltak Bithüniába menni, de a Lélek nem engedte őket, és Müsia mellett elhaladva lementek Troászba. Alexandria Troas, római kolónia a Troász-vidék égei-tengeri partján, volt az Ázsiából Macedóniába való átkelés fő kikötője. Ott Pál éjjel látomást látott: egy macedón férfi állt előtte, és kérte, hogy jöjjön át, és segítsen rajtuk. Innentől az elbeszélés többes szám első személyben szól: azonnal igyekeztek Macedóniába menni, arra következtetve, hogy Isten hívta őket oda az evangélium hirdetésére."
      fi: "He kulkivat Frygian ja Galatian maan kautta, sillä Pyhä Henki oli kieltänyt heitä julistamasta sanaa Aasiassa; tultuaan Mysiaan he yrittivät mennä Bityniaan, mutta Henki ei sallinut sitä, ja he kulkivat Mysian ohi ja tulivat alas Troakseen. Aleksandria Troas, roomalainen siirtokunta Troaksen seudun Egeanmeren rannikolla, oli tärkein satama Aasiasta Makedoniaan suuntautuvalle ylitykselle. Siellä Paavali näki yöllä näyn: makedonialainen mies seisoi ja pyysi häntä tulemaan yli auttamaan heitä. Tästä eteenpäin kertomus puhuu monikon ensimmäisessä persoonassa: he pyrkivät heti Makedoniaan, koska päättelivät Jumalan kutsuneen heidät julistamaan siellä evankeliumia."
      vi: "Họ trải qua xứ Phi-ri-gi và miền Ga-la-ti, vì Đức Thánh Linh cấm họ giảng đạo trong cõi A-si; khi đến xứ My-si, họ tìm cách vào xứ Bi-thi-ni, nhưng Thánh Linh không cho phép, nên họ đi qua xứ My-si mà xuống Trô-ách. Alexandria Troas, một thuộc địa La Mã trên bờ biển Aegea của miền Troad, là hải cảng chính cho chuyến vượt biển từ A-si sang Ma-xê-đoan. Tại đó, ban đêm Phao-lô thấy một sự hiện thấy: một người Ma-xê-đoan đứng nài xin ông qua giúp họ. Từ đây bản văn kể ở ngôi thứ nhất số nhiều: họ liền tìm cách sang Ma-xê-đoan, vì đã định rằng Đức Chúa Trời gọi họ rao truyền Tin Lành ở đó."
      ro: "Au străbătut Frigia și ținutul Galatiei, fiind opriți de Duhul Sfânt să vestească cuvântul în Asia; când au ajuns în Misia, au încercat să meargă în Bitinia, dar Duhul nu i-a lăsat, și trecând pe lângă Misia au coborât la Troa. Alexandria Troas, colonie romană pe coasta egeeană a Troadei, era portul principal pentru traversarea din Asia în Macedonia. Acolo Pavel a avut noaptea o vedenie: un bărbat macedonean stătea și îl ruga să treacă la ei și să-i ajute. De aici narațiunea vorbește la persoana întâi plural: au căutat îndată să plece în Macedonia, încheind că Dumnezeu îi chemase să vestească Evanghelia acolo."
      bg: "Те минаха през Фригия и Галатийската област, понеже Светият Дух им забрани да говорят словото в Азия; когато стигнаха до Мизия, опитаха да идат във Витиния, но Духът не им позволи, и като отминаха Мизия, слязоха в Троада. Александрия Троада, римска колония на егейския бряг на Троада, беше главното пристанище за преминаване от Азия в Македония. Там Павел видя нощем видение: един македонец стоеше и го молеше да мине и да им помогне. Оттук разказът е в първо лице множествено число: те веднага потърсиха да идат в Македония, понеже заключиха, че Бог ги е призовал да проповядват там благовестието."
  - place: a68750d
