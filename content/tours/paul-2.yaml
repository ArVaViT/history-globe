      pl: "Przybicie do Cezarei."
      it: "Sbarco a Cesarea."
      nl: "Landing te Caesarea."
      cs: "Přistání v Cesareji."
      sv: "Landstigning i Caesarea."
      nb: "Landgang i Cæsarea."
      tl: "Dumaong sa Cesarea."
