    note:
      en: "A short stay in Ephesus."
      ru: "Недолгое пребывание в Ефесе."
      uk: "Короткий побут в Ефесі."
      es: "Breve estancia en Éfeso."
      pt: "Uma curta estadia em Éfeso."
      de: "Ein kurzer Aufenthalt in Ephesus."
      fr: "Court séjour à Éphèse."
      pl: "Krótki pobyt w Efezie."
      it: "Una breve sosta a Efeso."
      nl: "Een kort verblijf in Efeze."
      cs: "Krátký pobyt v Efezu."
      sv: "Ett kort uppehåll i Efesos."
      nb: "Et kort opphold i Efesos."
      tl: "Maikling pananatili sa Efeso."
      da: "Et kort ophold i Efesos."
      sr: "Кратак боравак у Ефесу."
      hu: "Rövid tartózkodás Efezusban."
      fi: "Lyhyt oleskelu Efesoksessa."
      vi: "Lưu lại ngắn ngày tại Ê-phê-sô."
      ro: "Un scurt popas în Efes."
      bg: "Кратък престой в Ефес."
    story:
      en: "They crossed the Aegean to Ephesus, the residence of the proconsul of Asia and one of the largest cities of the East. Paul left Priscilla and Aquila there, went into the synagogue and reasoned with the Jews. When they asked him to stay longer, he declined, but took his leave, promising to come back if God willed, and set sail from Ephesus."
      ru: "Они пересекли Эгейское море и пришли в Ефес, резиденцию проконсула Асии и один из крупнейших городов Востока. Павел оставил там Прискиллу и Акилу, вошёл в синагогу и рассуждал с иудеями. Когда они просили его остаться дольше, он не согласился, но простился с ними, обещав вернуться, если будет угодно Богу, и отплыл из Ефеса."
      uk: "Вони перетнули Егейське море й прибули до Ефеса, осідку проконсула Азії й одного з найбільших міст Сходу. Павло залишив там Прискиллу й Акилу, ввійшов до синагоги й міркував з юдеями. Коли вони просили його побути довше, він не погодився, але попрощався, пообіцявши повернутися, якщо буде воля Божа, і відплив з Ефеса."
      es: "Cruzaron el Egeo hasta Éfeso, residencia del procónsul de Asia y una de las mayores ciudades de Oriente. Pablo dejó allí a Priscila y Aquila, entró en la sinagoga y discutió con los judíos. Cuando le pidieron que se quedara más tiempo, no accedió, sino que se despidió prometiendo volver si Dios quería, y zarpó de Éfeso."
      pt: "Atravessaram o Egeu até Éfeso, residência do procônsul da Ásia e uma das maiores cidades do Oriente. Paulo deixou ali Priscila e Áquila, entrou na sinagoga e discutiu com os judeus. Quando lhe pediram que ficasse mais tempo, recusou, mas despediu-se prometendo voltar se Deus quisesse, e zarpou de Éfeso."
      de: "Sie fuhren über die Ägäis nach Ephesus, dem Sitz des Prokonsuls von Asien und einer der größten Städte des Ostens. Paulus ließ Priscilla und Aquila dort, ging in die Synagoge und redete mit den Juden. Als sie ihn baten, länger zu bleiben, lehnte er ab, nahm aber Abschied mit dem Versprechen, wiederzukommen, wenn Gott es wolle, und segelte von Ephesus ab."
      fr: "Ils traversèrent l’Égée jusqu’à Éphèse, résidence du proconsul d’Asie et l’une des plus grandes villes de l’Orient. Paul y laissa Priscille et Aquilas, entra dans la synagogue et discuta avec les Juifs. Quand ils lui demandèrent de rester plus longtemps, il refusa, mais prit congé en promettant de revenir si Dieu le voulait, et partit d’Éphèse par mer."
      pl: "Przepłynęli przez Morze Egejskie do Efezu, siedziby prokonsula Azji i jednego z największych miast Wschodu. Paweł zostawił tam Pryscyllę i Akwilę, wszedł do synagogi i rozprawiał z Żydami. Gdy prosili go, by został dłużej, odmówił, lecz pożegnał się, obiecując, że wróci, jeśli Bóg zechce, i odpłynął z Efezu."
      it: "Attraversarono l’Egeo fino a Efeso, residenza del proconsole d’Asia e una delle più grandi città dell’Oriente. Paolo vi lasciò Priscilla e Aquila, entrò nella sinagoga e discusse con i Giudei. Quando gli chiesero di restare più a lungo, rifiutò, ma prese congedo promettendo di tornare se Dio voleva, e salpò da Efeso."
      nl: "Zij staken de Egeïsche Zee over naar Efeze, de residentie van de proconsul van Asia en een van de grootste steden van het Oosten. Paulus liet Priscilla en Aquila daar achter, ging de synagoge binnen en sprak met de Joden. Toen zij hem vroegen langer te blijven, weigerde hij, maar nam afscheid met de belofte terug te komen als God het wilde, en voer af van Efeze."
      cs: "Přepluli Egejské moře do Efezu, sídla prokonzula Asie a jednoho z největších měst Východu. Pavel tam zanechal Priscillu a Akvilu, vešel do synagogy a rozmlouval se Židy. Když ho prosili, aby zůstal déle, odmítl, ale rozloučil se se slibem, že se vrátí, bude-li Bůh chtít, a z Efezu odplul."
      sv: "De korsade Egeiska havet till Efesos, residensstad för prokonsuln i Asien och en av de största städerna i Östern. Paulus lämnade Priscilla och Aquila där, gick in i synagogan och samtalade med judarna. När de bad honom stanna längre avböjde han, men tog avsked och lovade att komma tillbaka om Gud ville, och seglade från Efesos."
      nb: "De krysset Egeerhavet til Efesos, residensbyen for prokonsulen i Asia og en av de største byene i Østen. Paulus lot Priskilla og Akvilas bli igjen der, gikk inn i synagogen og samtalte med jødene. Da de ba ham bli lenger, avslo han, men tok farvel og lovet å komme tilbake om Gud ville, og seilte fra Efesos."
      tl: "Tinawid nila ang Aegeo patungong Efeso, ang tahanan ng prokonsul ng Asia at isa sa pinakamalalaking lungsod ng Silangan. Iniwan ni Pablo roon sina Priscila at Aquila, pumasok sa sinagoga at nangatuwiran sa mga Judio. Nang hilingin nilang manatili pa siya nang mas matagal, tumanggi siya, ngunit nagpaalam at nangakong babalik kung loobin ng Diyos, at naglayag mula sa Efeso."
      da: "De krydsede Det Ægæiske Hav til Efesos, residens for prokonsulen i Asien og en af de største byer i Østen. Paulus lod Priskilla og Akvila blive der, gik ind i synagogen og drøftede med jøderne. Da de bad ham blive længere, afslog han, men tog afsked og lovede at komme tilbage, om Gud ville, og sejlede fra Efesos."
      sr: "Прешли су Егејско море до Ефеса, седишта намесника Азије и једног од највећих градова Истока. Павле је тамо оставио Прискилу и Акилу, ушао у синагогу и расправљао с Јеврејима. Кад су га замолили да остане дуже, није хтео, него се опростио обећавши да ће се вратити ако Бог хоће, и отпловио из Ефеса."
      hu: "Átkeltek az Égei-tengeren Efezusba, Ázsia prokonzuljának székhelyére, Kelet egyik legnagyobb városába. Pál ott hagyta Priszcillát és Akvilát, bement a zsinagógába, és vitatkozott a zsidókkal. Amikor kérték, hogy maradjon tovább, nem vállalta, hanem elbúcsúzott, megígérve, hogy ha Isten akarja, visszajön, és elhajózott Efezusból."
      fi: "He ylittivät Egeanmeren Efesokseen, Aasian käskynhaltijan asuinkaupunkiin ja yhteen idän suurimmista kaupungeista. Paavali jätti Priskillan ja Akylaksen sinne, meni synagogaan ja keskusteli juutalaisten kanssa. Kun he pyysivät häntä viipymään kauemmin, hän kieltäytyi mutta sanoi jäähyväiset ja lupasi palata, jos Jumala suo, ja lähti purjehtimaan Efesoksesta."
      vi: "Họ vượt biển Aegea đến Ê-phê-sô, nơi ở của quan trấn thủ xứ A-si và là một trong những thành lớn nhất phương Đông. Phao-lô để Bê-rít-sin và A-qui-la lại đó, vào nhà hội và biện luận với người Giu-đa. Khi họ xin ông ở lại lâu hơn, ông từ chối, nhưng từ giã họ và hứa sẽ trở lại nếu Đức Chúa Trời muốn, rồi từ Ê-phê-sô xuống thuyền đi."
      ro: "Au traversat Marea Egee la Efes, reședința proconsulului Asiei și unul dintre cele mai mari orașe ale Răsăritului. Pavel i-a lăsat acolo pe Priscila și Acvila, a intrat în sinagogă și a discutat cu iudeii. Când l-au rugat să rămână mai mult, n-a primit, ci și-a luat rămas bun, făgăduind că se va întoarce dacă va voi Dumnezeu, și a plecat pe mare din Efes."
      bg: "Те прекосиха Егейско море до Ефес, седалището на проконсула на Азия и един от най-големите градове на Изтока. Павел остави там Прискила и Акила, влезе в синагогата и разискваше с юдеите. Когато го помолиха да остане по-дълго, той отказа, но се сбогува с обещание да се върне, ако Бог иска, и отплава от Ефес."
