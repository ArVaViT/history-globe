    story:
      en: "From Athens Paul went to Corinth, refounded by Julius Caesar as a Roman colony in 44 BC and the seat of the proconsul of Achaia. There he found Aquila, a Jew born in Pontus, and his wife Priscilla, lately come from Italy because Claudius had ordered all Jews to leave Rome; they were tentmakers, as he was, and he lived and worked with them. When Silas and Timothy came from Macedonia, Paul testified to the Jews that Jesus was the Christ; when they opposed him, he turned to the Gentiles and taught in the house of a God-fearing man named Justus next to the synagogue, and Crispus, the ruler of the synagogue, believed with all his household. In a vision the Lord told Paul not to be afraid, and he stayed a year and six months. When Gallio was proconsul, the Jews brought Paul before his judgement seat, but Gallio refused to judge a question of words, names and their own law and drove them away."
      ru: "Из Афин Павел пришёл в Коринф, восстановленный Юлием Цезарем как римская колония в 44 г. до н. э. и ставший резиденцией проконсула Ахаии. Там он нашёл Акилу, иудея родом из Понта, и его жену Прискиллу, недавно пришедших из Италии, потому что Клавдий повелел всем иудеям покинуть Рим; они, как и он, делали палатки, и он жил и работал у них. Когда Сила и Тимофей пришли из Македонии, Павел свидетельствовал иудеям, что Иисус есть Христос; когда они воспротивились, он обратился к язычникам и учил в доме чтущего Бога человека по имени Иуст, рядом с синагогой, и Крисп, начальник синагоги, уверовал со всем своим домом. В видении Господь сказал Павлу не бояться, и он пробыл там год и шесть месяцев. Когда проконсулом был Галлион, иудеи привели Павла к его судилищу, но Галлион отказался судить спор о словах, именах и их собственном законе и прогнал их."
      uk: "З Афін Павло прийшов до Коринта, відновленого Юлієм Цезарем як римська колонія 44 р. до н. е., осідку проконсула Ахаї. Там він знайшов Акилу, юдея родом з Понту, і його дружину Прискиллу, які недавно прибули з Італії, бо Клавдій наказав усім юдеям залишити Рим; вони, як і він, виготовляли намети, і він жив і працював у них. Коли Сила й Тимофій прийшли з Македонії, Павло свідчив юдеям, що Ісус є Христос; коли вони стали йому противитися, він звернувся до язичників і навчав у домі богобійного чоловіка на ім’я Юст, поруч із синагогою, і Крисп, старшина синагоги, увірував з усім своїм домом. У видінні Господь сказав Павлові не боятися, і він пробув там рік і шість місяців. Коли проконсулом був Галліон, юдеї привели Павла до його судового крісла, але Галліон відмовився судити суперечку про слова, імена та їхній власний закон і прогнав їх."
      es: "De Atenas Pablo fue a Corinto, refundada por Julio César como colonia romana en el 44 a.C. y sede del procónsul de Acaya. Allí encontró a Aquila, un judío natural del Ponto, y a su mujer Priscila, recién llegados de Italia porque Claudio había mandado que todos los judíos salieran de Roma; eran fabricantes de tiendas, como él, y vivió y trabajó con ellos. Cuando Silas y Timoteo llegaron de Macedonia, Pablo testificó a los judíos que Jesús era el Cristo; como se le oponían, se volvió a los gentiles y enseñó en la casa de un hombre temeroso de Dios llamado Justo, junto a la sinagoga, y Crispo, el jefe de la sinagoga, creyó con toda su casa. En una visión, el Señor le dijo a Pablo que no temiera, y se quedó un año y seis meses. Siendo Galión procónsul, los judíos llevaron a Pablo ante su tribunal, pero Galión se negó a juzgar una cuestión de palabras, de nombres y de su propia ley, y los echó del tribunal."
      pt: "De Atenas Paulo foi para Corinto, refundada por Júlio César como colônia romana em 44 a.C. e sede do procônsul da Acaia. Ali encontrou Áquila, um judeu natural do Ponto, e sua esposa Priscila, recém-chegados da Itália porque Cláudio havia ordenado que todos os judeus saíssem de Roma; eram fabricantes de tendas, como ele, e ele morou e trabalhou com eles. Quando Silas e Timóteo chegaram da Macedônia, Paulo testemunhou aos judeus que Jesus era o Cristo; como se opunham a ele, voltou-se para os gentios e ensinou na casa de um homem temente a Deus chamado Justo, ao lado da sinagoga, e Crispo, o chefe da sinagoga, creu com toda a sua casa. Numa visão, o Senhor disse a Paulo que não tivesse medo, e ele ficou um ano e seis meses. Quando Gálio era procônsul, os judeus levaram Paulo ao seu tribunal, mas Gálio recusou-se a julgar uma questão de palavras, de nomes e da própria lei deles e os expulsou."
      de: "Von Athen ging Paulus nach Korinth, das Julius Caesar 44 v. Chr. als römische Kolonie neu gegründet hatte und das Sitz des Prokonsuls von Achaja war. Dort fand er Aquila, einen in Pontus geborenen Juden, und dessen Frau Priscilla, die vor Kurzem aus Italien gekommen waren, weil Klaudius allen Juden befohlen hatte, Rom zu verlassen; sie waren Zeltmacher wie er, und er wohnte und arbeitete bei ihnen. Als Silas und Timotheus aus Mazedonien kamen, bezeugte Paulus den Juden, dass Jesus der Christus sei; als sie ihm widerstrebten, wandte er sich zu den Heiden und lehrte im Haus eines gottesfürchtigen Mannes namens Justus neben der Synagoge, und Krispus, der Vorsteher der Synagoge, kam mit seinem ganzen Haus zum Glauben. In einem Gesicht sagte der Herr zu Paulus, er solle sich nicht fürchten, und er blieb ein Jahr und sechs Monate. Als Gallio Prokonsul war, brachten die Juden Paulus vor seinen Richterstuhl, doch Gallio lehnte es ab, über eine Frage von Worten, Namen und ihrem eigenen Gesetz zu richten, und trieb sie fort."
      fr: "D’Athènes, Paul se rendit à Corinthe, refondée par Jules César comme colonie romaine en 44 av. J.-C. et siège du proconsul d’Achaïe. Il y trouva Aquilas, un Juif originaire du Pont, et sa femme Priscille, récemment arrivés d’Italie parce que Claude avait ordonné à tous les Juifs de quitter Rome ; ils étaient faiseurs de tentes, comme lui, et il demeura et travailla chez eux. Quand Silas et Timothée arrivèrent de Macédoine, Paul attesta aux Juifs que Jésus était le Christ ; comme ils s’opposaient à lui, il se tourna vers les païens et enseigna dans la maison d’un homme craignant Dieu nommé Justus, contiguë à la synagogue, et Crispus, le chef de la synagogue, crut avec toute sa famille. Dans une vision, le Seigneur dit à Paul de ne pas craindre, et il resta un an et six mois. Du temps que Gallion était proconsul, les Juifs menèrent Paul devant son tribunal, mais Gallion refusa de juger une question de mots, de noms et de leur propre loi, et les renvoya."
      pl: "Z Aten Paweł udał się do Koryntu, odbudowanego przez Juliusza Cezara jako rzymska kolonia w 44 p.n.e. i będącego siedzibą prokonsula Achai. Spotkał tam Akwilę, Żyda urodzonego w Poncie, i jego żonę Pryscyllę, którzy niedawno przybyli z Italii, ponieważ Klaudiusz nakazał wszystkim Żydom opuścić Rzym; podobnie jak on wyrabiali namioty, więc mieszkał i pracował u nich. Gdy Sylas i Tymoteusz przybyli z Macedonii, Paweł świadczył Żydom, że Jezus jest Chrystusem; gdy mu się sprzeciwili, zwrócił się do pogan i nauczał w domu bogobojnego człowieka imieniem Justus, obok synagogi, a Kryspus, przełożony synagogi, uwierzył wraz z całym swoim domem. W widzeniu Pan powiedział Pawłowi, by się nie bał, i pozostał tam rok i sześć miesięcy. Gdy prokonsulem był Gallion, Żydzi stawili Pawła przed jego trybunałem, lecz Gallion odmówił rozstrzygania sporu o słowa, imiona i ich własne prawo i przepędził ich."
      it: "Da Atene Paolo andò a Corinto, rifondata da Giulio Cesare come colonia romana nel 44 a.C. e sede del proconsole d’Acaia. Lì trovò Aquila, un Giudeo originario del Ponto, e sua moglie Priscilla, venuti di recente dall’Italia perché Claudio aveva ordinato a tutti i Giudei di lasciare Roma; erano fabbricanti di tende, come lui, ed egli abitò e lavorò con loro. Quando Sila e Timoteo arrivarono dalla Macedonia, Paolo attestò ai Giudei che Gesù era il Cristo; poiché gli si opponevano, si volse ai Gentili e insegnò in casa di un uomo timorato di Dio chiamato Giusto, accanto alla sinagoga, e Crispo, il capo della sinagoga, credette con tutta la sua casa. In una visione il Signore disse a Paolo di non temere, ed egli rimase un anno e sei mesi. Quando Gallione era proconsole, i Giudei condussero Paolo davanti al suo tribunale, ma Gallione rifiutò di giudicare una questione di parole, di nomi e della loro legge, e li cacciò via."
      nl: "Van Athene ging Paulus naar Korinthe, dat in 44 v.Chr. door Julius Caesar als Romeinse kolonie opnieuw was gesticht en de zetel was van de proconsul van Achaja. Daar vond hij Aquila, een Jood geboren in Pontus, en zijn vrouw Priscilla, die kort tevoren uit Italië gekomen waren omdat Claudius alle Joden bevolen had Rome te verlaten; zij waren tentenmakers, net als hij, en hij woonde en werkte bij hen. Toen Silas en Timoteüs uit Macedonië kwamen, betuigde Paulus de Joden dat Jezus de Christus was; toen zij zich tegen hem verzetten, keerde hij zich tot de heidenen en leerde in het huis van een godvrezend man genaamd Justus naast de synagoge, en Crispus, de overste van de synagoge, kwam met zijn hele huisgezin tot geloof. In een visioen zei de Heer tot Paulus dat hij niet bevreesd moest zijn, en hij bleef een jaar en zes maanden. Toen Gallio proconsul was, brachten de Joden Paulus voor zijn rechterstoel, maar Gallio weigerde te oordelen over een kwestie van woorden, namen en hun eigen wet en joeg hen weg."
      cs: "Z Atén odešel Pavel do Korintu, který obnovil Julius Caesar jako římskou kolonii roku 44 př. n. l. a který byl sídlem prokonzula Achaje. Tam nalezl Akvilu, Žida narozeného v Pontu, a jeho ženu Priscillu, kteří nedávno přišli z Itálie, protože Klaudius nařídil všem Židům opustit Řím; stejně jako on vyráběli stany, a tak u nich bydlel a pracoval. Když přišli Silas a Timoteus z Makedonie, Pavel dosvědčoval Židům, že Ježíš je Kristus; když se mu stavěli na odpor, obrátil se k pohanům a učil v domě bohabojného muže jménem Justus vedle synagogy, a Krispos, představený synagogy, uvěřil s celým svým domem. Ve vidění Pán řekl Pavlovi, aby se nebál, a Pavel zůstal rok a šest měsíců. Když byl prokonzulem Gallión, Židé předvedli Pavla před jeho soudní stolec, ale Gallión odmítl soudit spor o slova, jména a jejich vlastní Zákon a vyhnal je."
      sv: "Från Aten gick Paulus till Korinth, som Julius Caesar hade grundat på nytt som romersk koloni år 44 f.Kr. och som var säte för prokonsuln i Achaia. Där fann han Aquila, en jude född i Pontus, och hans hustru Priscilla, som nyligen hade kommit från Italien eftersom Claudius hade befallt alla judar att lämna Rom; de var tältmakare, liksom han, och han bodde och arbetade hos dem. När Silas och Timoteus kom från Makedonien vittnade Paulus för judarna om att Jesus var Messias; när de satte sig emot honom vände han sig till hedningarna och undervisade i huset hos en gudfruktig man som hette Justus, intill synagogan, och Crispus, synagogföreståndaren, kom till tro med hela sitt hus. I en syn sade Herren till Paulus att han inte skulle vara rädd, och han stannade ett år och sex månader. När Gallio var prokonsul förde judarna Paulus inför hans domstol, men Gallio vägrade att döma i en fråga om ord och namn och deras egen lag och visade bort dem."
      nb: "Fra Aten dro Paulus til Korint, som Julius Caesar hadde grunnlagt på nytt som romersk koloni i 44 f.Kr., og som var setet for prokonsulen i Akaia. Der fant han Akvilas, en jøde født i Pontus, og hans kone Priskilla, som nylig var kommet fra Italia fordi Klaudius hadde befalt alle jøder å forlate Roma; de var teltmakere, som han, og han bodde og arbeidet hos dem. Da Silas og Timoteus kom fra Makedonia, vitnet Paulus for jødene om at Jesus var Messias; da de sto ham imot, vendte han seg til hedningene og underviste i huset til en gudfryktig mann som het Justus, ved siden av synagogen, og Krispos, synagogeforstanderen, kom til tro med hele sitt hus. I et syn sa Herren til Paulus at han ikke skulle være redd, og han ble der i et år og seks måneder. Da Gallio var prokonsul, førte jødene Paulus fram for hans domstol, men Gallio nektet å dømme i et spørsmål om ord og navn og deres egen lov og jaget dem bort."
      tl: "Mula sa Atenas ay nagtungo si Pablo sa Corinto, na muling itinatag ni Julio Cesar bilang koloniyang Romano noong 44 BK at luklukan ng prokonsul ng Acaya. Doon ay nasumpungan niya si Aquila, isang Judiong tubo sa Ponto, at ang asawa nitong si Priscila, na hindi pa nalalaong nanggaling sa Italia sapagka't ipinag-utos ni Claudio na magsialis sa Roma ang lahat ng mga Judio; gumagawa sila ng mga tolda, gaya niya, at nakipanuluyan at nakigawa siya sa kanila. Nang dumating sina Silas at Timoteo mula sa Macedonia, nagpatotoo si Pablo sa mga Judio na si Jesus ang Cristo; nang sumalungat sila, bumaling siya sa mga Gentil at nagturo sa bahay ng isang lalaking sumasamba sa Diyos na nagngangalang Justo, na karugtong ng sinagoga, at si Crispo, ang pinuno sa sinagoga, ay sumampalataya kasama ng buong sangbahayan niya. Sa isang pangitain ay sinabi ng Panginoon kay Pablo na huwag matakot, at tumahan siya roon nang isang taon at anim na buwan. Nang si Galion ay prokonsul, dinala ng mga Judio si Pablo sa harap ng kaniyang hukuman, ngunit tumanggi si Galion na humatol sa usapin tungkol sa mga salita, mga pangalan at sa kanilang sariling kautusan, at pinalayas sila."
      da: "Fra Athen drog Paulus til Korinth, som Julius Cæsar havde genopbygget som romersk koloni i 44 f.Kr., og som var sæde for prokonsulen i Akaja. Der traf han Akvila, en jøde født i Pontus, og hans hustru Priskilla, der nylig var kommet fra Italien, fordi Klaudius havde befalet alle jøder at forlade Rom; de var teltmagere ligesom han, og han boede og arbejdede hos dem. Da Silas og Timotheus kom fra Makedonien, vidnede Paulus for jøderne, at Jesus var Kristus; da de stod ham imod, vendte han sig til hedningerne og underviste i huset hos en gudfrygtig mand ved navn Justus ved siden af synagogen, og Krispus, synagogeforstanderen, kom til tro med hele sit hus. I et syn sagde Herren til Paulus, at han ikke skulle frygte, og han blev der et år og seks måneder. Da Gallio var prokonsul, førte jøderne Paulus frem for hans domstol, men Gallio nægtede at dømme i et spørgsmål om ord, navne og deres egen lov og drev dem bort."
      sr: "Из Атине Павле је отишао у Коринт, који је Јулије Цезар поново основао као римску колонију 44. п. н. е. и који је био седиште намесника Ахаје. Тамо је нашао Акилу, Јеврејина родом из Понта, и његову жену Прискилу, који су скоро дошли из Италије јер је Клаудије заповедио да сви Јевреји напусте Рим; били су шатораши, као и он, и он је живео и радио с њима. Кад су Сила и Тимотије дошли из Македоније, Павле је сведочио Јеврејима да је Исус Христос; кад су му се успротивили, окренуо се незнабошцима и учио у кући једног богобојазног човека по имену Јуст, поред синагоге, а Крисп, старешина синагоге, поверовао је са свим својим домом. У виђењу Господ је рекао Павлу да се не боји, и он је остао годину и шест месеци. Кад је Галион био намесник, Јевреји су довели Павла пред његову судницу, али Галион је одбио да суди о препирци око речи, имена и њиховог сопственог закона и отерао их је."
      hu: "Athénból Pál Korinthusba ment, amelyet Julius Caesar Kr. e. 44-ben római kolóniaként újraalapított, és amely Akhája prokonzuljának székhelye volt. Ott Akvilára talált, egy pontusi születésű zsidóra, és feleségére, Priszcillára, akik nemrég jöttek Itáliából, mert Klaudius megparancsolta, hogy minden zsidó hagyja el Rómát; sátorkészítők voltak, mint ő, és náluk lakott és dolgozott. Amikor Szilász és Timóteus megérkezett Macedóniából, Pál bizonyságot tett a zsidóknak, hogy Jézus a Krisztus; amikor ellene szegültek, a pogányokhoz fordult, és egy Justus nevű istenfélő ember házában tanított a zsinagóga szomszédságában, Krispus, a zsinagóga elöljárója pedig egész házanépével hitt. Egy látomásban az Úr azt mondta Pálnak, hogy ne féljen, és ő egy évig és hat hónapig maradt. Amikor Gallió volt a prokonzul, a zsidók Pált az ítélőszéke elé vitték, de Gallió nem volt hajlandó ítélni egy szavakról, nevekről és a saját törvényükről szóló kérdésben, és elűzte őket."
      fi: "Ateenasta Paavali meni Korinttiin, jonka Julius Caesar oli perustanut uudelleen roomalaiseksi siirtokunnaksi vuonna 44 eaa. ja joka oli Akaian käskynhaltijan istuinpaikka. Siellä hän tapasi Pontoksessa syntyneen juutalaisen Akylaksen ja tämän vaimon Priskillan, jotka olivat äskettäin tulleet Italiasta, koska Klaudius oli käskenyt kaikkien juutalaisten poistua Roomasta; he olivat teltantekijöitä niin kuin hänkin, ja hän asui ja teki työtä heidän luonaan. Kun Silas ja Timoteus tulivat Makedoniasta, Paavali todisti juutalaisille, että Jeesus oli Kristus; kun he vastustivat häntä, hän kääntyi pakanoiden puoleen ja opetti jumalaapelkääväisen Justus-nimisen miehen talossa synagogan vieressä, ja synagogan esimies Krispus uskoi koko perhekuntansa kanssa. Herra sanoi Paavalille näyssä, ettei hänen pitänyt pelätä, ja hän viipyi siellä vuoden ja kuusi kuukautta. Kun Gallio oli käskynhaltijana, juutalaiset veivät Paavalin hänen tuomioistuimensa eteen, mutta Gallio kieltäytyi ratkaisemasta kysymystä sanoista, nimistä ja heidän omasta laistaan ja ajoi heidät pois."
      vi: "Từ A-thên Phao-lô đến Cô-rinh-tô, thành được Julius Caesar tái lập làm thuộc địa La Mã năm 44 TCN và là nơi đóng trụ sở của quan trấn thủ xứ A-chai. Tại đó ông gặp A-qui-la, một người Giu-đa sinh ở xứ Bông, và vợ là Bê-rít-sin, mới từ Y-ta-li đến vì vua Cơ-lốt đã truyền mọi người Giu-đa phải rời khỏi Rô-ma; họ làm nghề may trại như ông, và ông ở và làm việc với họ. Khi Si-la và Ti-mô-thê từ Ma-xê-đoan đến, Phao-lô làm chứng với người Giu-đa rằng Đức Chúa Giê-su là Đấng Christ; khi họ chống cự, ông quay sang người ngoại và dạy dỗ trong nhà một người kính sợ Đức Chúa Trời tên là Giúc-tu, ở sát nhà hội, và Cơ-rít-bu, chủ nhà hội, tin cùng cả nhà mình. Trong một sự hiện thấy, Chúa bảo Phao-lô đừng sợ, và ông ở lại một năm sáu tháng. Khi Ga-li-ôn làm quan trấn thủ, người Giu-đa đem Phao-lô đến trước tòa ông, nhưng Ga-li-ôn từ chối xét xử một việc về lời nói, danh hiệu và luật pháp riêng của họ, và đuổi họ đi."
      ro: "De la Atena Pavel a mers la Corint, reîntemeiat de Iulius Cezar ca colonie romană în 44 î.Hr. și reședința proconsulului Ahaiei. Acolo l-a găsit pe Acvila, un iudeu născut în Pont, și pe soția lui, Priscila, veniți de curând din Italia pentru că Claudiu poruncise ca toți iudeii să părăsească Roma; erau făcători de corturi, ca și el, iar el a locuit și a lucrat cu ei. Când Sila și Timotei au venit din Macedonia, Pavel le-a mărturisit iudeilor că Isus este Hristosul; când i s-au împotrivit, s-a întors la neamuri și a învățat în casa unui om temător de Dumnezeu numit Iust, lângă sinagogă, iar Crisp, mai-marele sinagogii, a crezut cu toată casa lui. Într-o vedenie Domnul i-a spus lui Pavel să nu se teamă, iar el a rămas un an și șase luni. Când Galion era proconsul, iudeii l-au adus pe Pavel înaintea scaunului său de judecată, dar Galion a refuzat să judece o neînțelegere despre cuvinte, nume și legea lor și i-a alungat."
      bg: "От Атина Павел отиде в Коринт, основан наново от Юлий Цезар като римска колония през 44 г. пр.н.е. и седалище на проконсула на Ахая. Там намери Акила, юдеин, роден в Понт, и жена му Прискила, наскоро дошли от Италия, защото Клавдий беше заповядал всички юдеи да напуснат Рим; те правеха шатри като него и той живееше и работеше с тях. Когато Сила и Тимотей дойдоха от Македония, Павел свидетелстваше на юдеите, че Исус е Христос; когато те му се противопоставиха, той се обърна към езичниците и поучаваше в къщата на един богобоязлив човек на име Юст до синагогата, а Крисп, началникът на синагогата, повярва с целия си дом. Във видение Господ каза на Павел да не се бои и той остана година и шест месеца. Когато Галион беше проконсул, юдеите доведоха Павел пред съдийското му място, но Галион отказа да съди спор за думи, имена и техния собствен закон и ги изгони."
