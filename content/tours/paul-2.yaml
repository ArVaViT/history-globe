      fr: "Cenchrées, le port de Corinthe."
      pl: "Kenchrea, port Koryntu."
      it: "Cencre, il porto di Corinto."
      nl: "Kenchreeën, de haven van Korinthe."
      cs: "Kenchreje, přístav Korintu."
      sv: "Kenchreai, Korinths hamn."
      nb: "Kenkreae, Korints havn."
      tl: "Cencrea, ang daungan ng Corinto."
      da: "Kenkreæ, Korinths havn."
      sr: "Кенхреја, пристаниште Коринта."
      hu: "Kenkhreai, Korinthus kikötője."
      fi: "Kenkreat, Korintin satama."
      vi: "Xen-cơ-rê, hải cảng của Cô-rinh-tô."
      ro: "Chencrea, portul Corintului."
      bg: "Кенхрея, пристанището на Коринт."
    story:
      en: "After staying many days more, Paul took leave of the brothers and set out for Syria with Priscilla and Aquila. At Cenchreae, Corinth's eastern harbour on the Saronic Gulf, some seventy stadia from the city as Strabo gives it, he had his hair cut off, for he had taken a vow."
      ru: "Пробыв ещё много дней, Павел простился с братьями и отплыл в Сирию вместе с Прискиллой и Акилой. В Кенхреях, восточной гавани Коринфа на Сароническом заливе, примерно в семидесяти стадиях от города, по Страбону, он остриг голову, потому что дал обет."
      uk: "Пробувши ще багато днів, Павло попрощався з братами й відплив до Сирії разом із Прискиллою та Акилою. У Кенхреях, східній гавані Коринта на Саронічній затоці, приблизно за сімдесят стадіїв від міста, за Страбоном, він обстриг голову, бо дав обітницю."
      es: "Después de quedarse todavía muchos días, Pablo se despidió de los hermanos y partió hacia Siria con Priscila y Aquila. En Cencrea, el puerto oriental de Corinto en el golfo Sarónico, a unos setenta estadios de la ciudad según Estrabón, se rapó la cabeza, porque había hecho un voto."
      pt: "Depois de ficar ainda muitos dias, Paulo despediu-se dos irmãos e partiu para a Síria com Priscila e Áquila. Em Cencreia, o porto oriental de Corinto no golfo Sarônico, a cerca de setenta estádios da cidade segundo Estrabão, raspou a cabeça, pois tinha feito um voto."
      de: "Nachdem er noch viele Tage geblieben war, nahm Paulus Abschied von den Brüdern und brach mit Priscilla und Aquila nach Syrien auf. In Kenchreä, dem östlichen Hafen Korinths am Saronischen Golf, nach Strabon etwa siebzig Stadien von der Stadt entfernt, ließ er sich das Haar scheren, denn er hatte ein Gelübde abgelegt."
      fr: "Après être resté encore de nombreux jours, Paul prit congé des frères et s’embarqua pour la Syrie avec Priscille et Aquilas. À Cenchrées, le port oriental de Corinthe sur le golfe Saronique, à quelque soixante-dix stades de la ville selon Strabon, il se fit couper les cheveux, car il avait fait un vœu."
      pl: "Pozostawszy jeszcze wiele dni, Paweł pożegnał się z braćmi i wyruszył do Syrii z Pryscyllą i Akwilą. W Kenchrei, wschodnim porcie Koryntu nad Zatoką Sarońską, około siedemdziesięciu stadiów od miasta według Strabona, ostrzygł sobie włosy, gdyż złożył ślub."
      it: "Dopo essere rimasto ancora molti giorni, Paolo prese congedo dai fratelli e salpò per la Siria con Priscilla e Aquila. A Cencre, il porto orientale di Corinto sul golfo Saronico, a circa settanta stadi dalla città secondo Strabone, si fece tagliare i capelli, perché aveva fatto un voto."
      nl: "Nadat hij nog vele dagen gebleven was, nam Paulus afscheid van de broeders en vertrok met Priscilla en Aquila naar Syrië. Te Kenchreeën, de oostelijke haven van Korinthe aan de Saronische Golf, volgens Strabo zo'n zeventig stadiën van de stad, liet hij zijn haar afknippen, want hij had een gelofte gedaan."
      cs: "Když tam Pavel pobyl ještě mnoho dní, rozloučil se s bratřími a vydal se s Priscillou a Akvilou do Sýrie. V Kenchrejích, východním přístavu Korintu na Saronském zálivu, podle Strabóna asi sedmdesát stadií od města, si dal ostříhat vlasy, protože složil slib."
      sv: "Efter att ha stannat ännu många dagar tog Paulus avsked av bröderna och bröt upp mot Syrien med Priscilla och Aquila. I Kenchreai, Korinths östra hamn vid Saroniska viken, omkring sjuttio stadier från staden enligt Strabon, lät han klippa av sig håret, eftersom han hade avlagt ett löfte."
      nb: "Etter å ha blitt der mange dager til tok Paulus farvel med brødrene og brøt opp mot Syria sammen med Priskilla og Akvilas. I Kenkreae, Korints østlige havn ved Den saroniske bukt, omkring sytti stadier fra byen etter Strabons oppgave, lot han håret klippe, for han hadde avlagt et løfte."
      tl: "Pagkatapos tumira pa roon nang maraming araw, nagpaalam si Pablo sa mga kapatid at lumayag patungong Siria kasama sina Priscila at Aquila. Sa Cencrea, ang silangang daungan ng Corinto sa Golpo ng Saronic, na mga pitumpung estadia mula sa lungsod ayon kay Strabo, ay inahit niya ang kaniyang buhok, sapagka't siya'y may panata."
      da: "Efter at være blevet der endnu mange dage tog Paulus afsked med brødrene og drog mod Syrien med Priskilla og Akvila. I Kenkreæ, Korinths østlige havn ved Den Saroniske Bugt, omkring halvfjerds stadier fra byen ifølge Strabon, lod han sit hår klippe af, for han havde aflagt et løfte."
      sr: "Пошто је остао још много дана, Павле се опростио с браћом и кренуо у Сирију с Прискилом и Акилом. У Кенхреји, источној луци Коринта на Саронском заливу, седамдесетак стадија од града како наводи Страбон, остригао је косу, јер се беше заветовао."
      hu: "Miután még sok napig ott maradt, Pál elbúcsúzott a testvérektől, és Priszcillával és Akvilával Szíria felé indult. Kenkhreaiban, Korinthus keleti kikötőjében a Szaróni-öbölben, Sztrabón adata szerint mintegy hetven stadionnyira a várostól, levágatta a haját, mert fogadalmat tett."
      fi: "Viivyttyään siellä vielä monta päivää Paavali sanoi veljille jäähyväiset ja lähti Priskillan ja Akylaksen kanssa kohti Syyriaa. Kenkreissä, Korintin itäisessä satamassa Saroninlahden rannalla, Strabonin mukaan noin seitsemänkymmenen stadionin päässä kaupungista, hän leikkautti tukkansa, sillä hän oli tehnyt lupauksen."
      vi: "Sau khi ở lại thêm nhiều ngày, Phao-lô từ giã anh em và lên đường sang xứ Sy-ri cùng Bê-rít-sin và A-qui-la. Tại Xen-cơ-rê, hải cảng phía đông của Cô-rinh-tô trên vịnh Saronic, cách thành chừng bảy mươi stadia theo Strabo, ông cạo đầu vì đã có lời thề nguyện."
      ro: "După ce a mai rămas multe zile, Pavel și-a luat rămas bun de la frați și a pornit spre Siria cu Priscila și Acvila. La Chencrea, portul de răsărit al Corintului, pe Golful Saronic, la vreo șaptezeci de stadii de oraș după Strabon, și-a tuns părul, pentru că făcuse o făgăduință."
      bg: "След като остана още много дни, Павел се сбогува с братята и тръгна за Сирия с Прискила и Акила. В Кенхрея, източното пристанище на Коринт на Сароническия залив, на около седемдесет стадия от града според Страбон, той остриза косата си, защото беше дал обет."
