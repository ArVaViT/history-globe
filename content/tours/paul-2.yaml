    story:
      en: "He landed at Caesarea, the city Herod the Great built with an artificial harbour on the coast of the Sharon plain and the seat of the Roman governors of Judea."
      ru: "Он высадился в Кесарии, городе, который Ирод Великий построил с искусственной гаванью на побережье Саронской равнины и который был резиденцией римских наместников Иудеи."
      uk: "Він висадився в Кесарії, місті, яке Ірод Великий збудував зі штучною гаванню на узбережжі Саронської рівнини і яке було осідком римських намісників Юдеї."
      es: "Desembarcó en Cesarea, la ciudad que Herodes el Grande construyó con un puerto artificial en la costa de la llanura de Sarón, sede de los gobernadores romanos de Judea."
      pt: "Desembarcou em Cesareia, a cidade que Herodes, o Grande, construiu com um porto artificial na costa da planície de Sarom, sede dos governadores romanos da Judeia."
      de: "Er landete in Caesarea, der Stadt, die Herodes der Große mit einem künstlichen Hafen an der Küste der Scharon-Ebene erbaut hatte, dem Sitz der römischen Statthalter von Judäa."
      fr: "Il débarqua à Césarée, la ville qu’Hérode le Grand bâtit avec un port artificiel sur la côte de la plaine de Saron, siège des gouverneurs romains de Judée."
      pl: "Wylądował w Cezarei, mieście, które Herod Wielki zbudował wraz ze sztucznym portem na wybrzeżu równiny Szaron, siedzibie rzymskich namiestników Judei."
      it: "Sbarcò a Cesarea, la città che Erode il Grande costruì con un porto artificiale sulla costa della pianura di Saron, sede dei governatori romani della Giudea."
      nl: "Hij ging aan land te Caesarea, de stad die Herodes de Grote met een kunstmatige haven bouwde aan de kust van de Saronvlakte, en de zetel van de Romeinse stadhouders van Judea."
      cs: "Přistál v Cesareji, městě, které Herodes Veliký vystavěl s umělým přístavem na pobřeží Šáronské roviny a které bylo sídlem římských místodržitelů Judska."
      sv: "Han landsteg i Caesarea, den stad som Herodes den store byggde med en konstgjord hamn på Saronslättens kust och säte för de romerska ståthållarna i Judeen."
      nb: "Han gikk i land i Cæsarea, byen som Herodes den store bygde med en kunstig havn på kysten av Saron-sletten, og setet for de romerske stattholderne i Judea."
      tl: "Lumunsad siya sa Cesarea, ang lungsod na itinayo ni Herodes na Dakila na may artipisyal na daungan sa baybayin ng kapatagan ng Saron, at luklukan ng mga Romanong gobernador ng Judea."
      da: "Han landede i Cæsarea, den by, Herodes den Store byggede med en kunstig havn på kysten af Saronsletten, og som var sæde for de romerske statholdere i Judæa."
      sr: "Пристао је у Цезареји, граду који је Ирод Велики саградио с вештачком луком на обали равнице Сарон и који је био седиште римских намесника Јудеје."
      hu: "Cézáreában kötött ki, abban a városban, amelyet Nagy Heródes mesterséges kikötővel épített a Sárón-síkság partján, és amely Júdea római helytartóinak székhelye volt."
      fi: "Hän nousi maihin Kesareassa, kaupungissa, jonka Herodes Suuri rakensi keinotekoisine satamineen Saaronin tasangon rannikolle ja joka oli Juudean roomalaisten käskynhaltijoiden istuinpaikka."
      vi: "Ông đổ bộ tại Sê-sa-rê, thành mà Hê-rốt Đại đế đã xây với một hải cảng nhân tạo trên bờ biển đồng bằng Sa-rôn, và là nơi đóng trụ sở của các quan tổng đốc La Mã xứ Giu-đê."
      ro: "A debarcat la Cezareea, orașul pe care Irod cel Mare l-a construit cu un port artificial pe coasta câmpiei Saronului, reședința guvernatorilor romani ai Iudeii."
      bg: "Той слезе на брега в Кесария — града, който Ирод Велики построи с изкуствено пристанище на брега на равнината Сарон, седалището на римските управители на Юдея."
  - place: a15257a
    ref: Acts.18.22
    note:
      en: "Paul greets the church."
      ru: "Павел приветствует церковь."
      uk: "Павло вітає церкву."
      es: "Pablo saluda a la iglesia."
      pt: "Paulo saúda a igreja."
      de: "Paulus grüßt die Gemeinde."
      fr: "Paul salue l’Église."
      pl: "Paweł pozdrawia Kościół."
      it: "Paolo saluta la chiesa."
      nl: "Paulus groet de gemeente."
      cs: "Pavel zdraví církev."
      sv: "Paulus hälsar församlingen."
      nb: "Paulus hilser menigheten."
      tl: "Binabati ni Pablo ang iglesia."
      da: "Paulus hilser menigheden."
      sr: "Павле поздравља цркву."
      hu: "Pál köszönti a gyülekezetet."
      fi: "Paavali tervehtii seurakuntaa."
      vi: "Phao-lô chào thăm Hội thánh."
      ro: "Pavel salută biserica."
      bg: "Павел поздравява църквата."
    story:
      en: "From Caesarea Paul went up and greeted the church; the map places this visit at Jerusalem."
      ru: "Из Кесарии Павел поднялся и приветствовал церковь; на карте это посещение отнесено к Иерусалиму."
      uk: "З Кесарії Павло піднявся й привітав церкву; на мапі цей візит віднесено до Єрусалима."
      es: "Desde Cesarea Pablo subió y saludó a la iglesia; el mapa sitúa esta visita en Jerusalén."
      pt: "De Cesareia Paulo subiu e saudou a igreja; o mapa situa esta visita em Jerusalém."
      de: "Von Caesarea zog Paulus hinauf und grüßte die Gemeinde; die Karte setzt diesen Besuch in Jerusalem an."
      fr: "De Césarée, Paul monta et salua l’Église ; la carte situe cette visite à Jérusalem."
      pl: "Z Cezarei Paweł poszedł w górę i pozdrowił Kościół; mapa umieszcza te odwiedziny w Jerozolimie."
      it: "Da Cesarea Paolo salì e salutò la chiesa; la mappa colloca questa visita a Gerusalemme."
      nl: "Van Caesarea ging Paulus op en groette de gemeente; de kaart plaatst dit bezoek in Jeruzalem."
      cs: "Z Cesareje Pavel vystoupil a pozdravil církev; mapa tuto návštěvu klade do Jeruzaléma."
      sv: "Från Caesarea gick Paulus upp och hälsade församlingen; kartan förlägger detta besök till Jerusalem."
      nb: "Fra Cæsarea dro Paulus opp og hilste menigheten; kartet legger dette besøket til Jerusalem."
      tl: "Mula sa Cesarea ay umahon si Pablo at bumati sa iglesia; inilalagay ng mapa ang pagdalaw na ito sa Jerusalem."
      da: "Fra Cæsarea drog Paulus op og hilste på menigheden; kortet henlægger dette besøg til Jerusalem."
      sr: "Из Цезареје Павле је отишао горе и поздравио цркву; мапа ову посету смешта у Јерусалим."
      hu: "Cézáreából Pál felment, és köszöntötte a gyülekezetet; a térkép ezt a látogatást Jeruzsálembe helyezi."
      fi: "Kesareasta Paavali nousi ylös ja tervehti seurakuntaa; kartta sijoittaa tämän käynnin Jerusalemiin."
      vi: "Từ Sê-sa-rê Phao-lô đi lên và chào thăm Hội thánh; bản đồ đặt chuyến thăm này tại Giê-ru-sa-lem."
      ro: "De la Cezareea Pavel a urcat și a salutat biserica; harta așază această vizită la Ierusalim."
      bg: "От Кесария Павел възлезе и поздрави църквата; картата отнася това посещение към Йерусалим."
  - place: ae41ab4
    ref: Acts.18.22
    note:
      en: "Back to Antioch."
      ru: "Возвращение в Антиохию."
      uk: "Назад до Антіохії."
      es: "De vuelta a Antioquía."
      pt: "De volta a Antioquia."
      de: "Zurück nach Antiochia."
      fr: "Retour à Antioche."
      pl: "Powrót do Antiochii."
      it: "Di nuovo ad Antiochia."
      nl: "Terug naar Antiochië."
      cs: "Zpět do Antiochie."
      sv: "Tillbaka till Antiochia."
      nb: "Tilbake til Antiokia."
      tl: "Pabalik sa Antioquia."
      da: "Tilbage til Antiokia."
      sr: "Натраг у Антиохију."
      hu: "Vissza Antiókhiába."
      fi: "Takaisin Antiokiaan."
      vi: "Trở về An-ti-ốt."
      ro: "Înapoi la Antiohia."
      bg: "Обратно в Антиохия."
    story:
      en: "Then he went down to Antioch, where the journey had begun, and after spending some time there set out again."
      ru: "Затем он спустился в Антиохию, откуда началось путешествие, и, проведя там некоторое время, снова отправился в путь."
      uk: "Потім він спустився до Антіохії, звідки почалася подорож, і, провівши там деякий час, знову вирушив у дорогу."
      es: "Luego bajó a Antioquía, donde había comenzado el viaje, y después de pasar allí algún tiempo partió de nuevo."
      pt: "Depois desceu para Antioquia, onde a viagem tinha começado, e, após passar ali algum tempo, partiu de novo."
      de: "Dann zog er hinab nach Antiochia, wo die Reise begonnen hatte, und nachdem er dort einige Zeit verbracht hatte, brach er wieder auf."
      fr: "Puis il descendit à Antioche, où le voyage avait commencé, et, après y avoir passé quelque temps, il repartit."
      pl: "Potem zszedł do Antiochii, gdzie podróż się zaczęła, a spędziwszy tam pewien czas, wyruszył znowu."
      it: "Poi scese ad Antiochia, dove il viaggio era cominciato, e dopo esservi rimasto per qualche tempo ripartì."
      nl: "Daarna ging hij af naar Antiochië, waar de reis begonnen was, en nadat hij daar enige tijd had doorgebracht, vertrok hij opnieuw."
      cs: "Potom sestoupil do Antiochie, kde cesta začala, a když tam nějaký čas pobyl, vydal se znovu na cestu."
      sv: "Sedan for han ned till Antiochia, där resan hade börjat, och efter att ha stannat där en tid bröt han upp igen."
      nb: "Så dro han ned til Antiokia, der reisen hadde begynt, og etter å ha vært der en tid brøt han opp igjen."
      tl: "Pagkatapos ay lumusong siya sa Antioquia, kung saan nagsimula ang paglalakbay, at pagkagugol doon ng ilang panahon ay muling umalis."
      da: "Derefter drog han ned til Antiokia, hvor rejsen var begyndt, og efter at have opholdt sig der nogen tid drog han af sted igen."
      sr: "Затим је сишао у Антиохију, где је путовање почело, и пошто је тамо провео неко време, поново је кренуо."
      hu: "Aztán lement Antiókhiába, ahol az út elkezdődött, és miután ott töltött egy kis időt, ismét útnak indult."
      fi: "Sitten hän meni alas Antiokiaan, josta matka oli alkanut, ja vietettyään siellä jonkin aikaa lähti jälleen matkaan."
      vi: "Rồi ông xuống An-ti-ốt, nơi cuộc hành trình đã bắt đầu, và sau khi ở đó ít lâu lại lên đường."
      ro: "Apoi a coborât la Antiohia, unde începuse călătoria, și după ce a petrecut acolo câtva timp a pornit din nou."
      bg: "После той слезе в Антиохия, откъдето беше започнало пътуването, и след като прекара там известно време, тръгна отново."
