    story:
      en: "Leaving Philippi, they went west along the road and passed through Amphipolis, the old city on the Strymon a few kilometres above its mouth, which, Thucydides says, was named for the Strymon flowing round it on two sides. Acts tells of no stay there."
      ru: "Покинув Филиппы, они пошли по дороге на запад и прошли через Амфиполь, древний город на Стримоне в нескольких километрах выше его устья, который, по словам Фукидида, был назван так по Стримону, обтекающему его с двух сторон. О пребывании там Деяния не рассказывают."
      uk: "Залишивши Філіппи, вони пішли дорогою на захід і пройшли через Амфіполіс, давнє місто на Стримоні за кілька кілометрів вище від його гирла, яке, за словами Фукідіда, дістало назву від Стримону, що обтікає його з двох боків. Про перебування там Дії не розповідають."
      es: "Al salir de Filipos, siguieron el camino hacia el oeste y pasaron por Anfípolis, la antigua ciudad sobre el Estrimón, a pocos kilómetros río arriba de su desembocadura, que, según dice Tucídides, recibió su nombre del Estrimón, que la rodea por dos lados. Los Hechos no hablan de ninguna estancia allí."
      pt: "Saindo de Filipos, seguiram pela estrada para o oeste e passaram por Anfípolis, a antiga cidade sobre o Estrímon, poucos quilômetros acima da sua foz, que, segundo Tucídides, recebeu o nome do Estrímon, que a rodeia por dois lados. Atos não fala de nenhuma estadia ali."
      de: "Sie verließen Philippi, zogen auf der Straße nach Westen und kamen durch Amphipolis, die alte Stadt am Strymon einige Kilometer oberhalb seiner Mündung, die, wie Thukydides sagt, nach dem Strymon benannt war, der sie auf zwei Seiten umfließt. Von einem Aufenthalt dort berichtet die Apostelgeschichte nicht."
      fr: "Quittant Philippes, ils suivirent la route vers l’ouest et passèrent par Amphipolis, la vieille ville sur le Strymon, à quelques kilomètres en amont de son embouchure, qui, selon Thucydide, fut nommée d’après le Strymon qui la contourne de deux côtés. Les Actes ne mentionnent aucun séjour à cet endroit."
      pl: "Opuściwszy Filippi, ruszyli drogą na zachód i przeszli przez Amfipolis, stare miasto nad Strymonem kilka kilometrów powyżej jego ujścia, które, jak mówi Tukidydes, nazwano od Strymonu opływającego je z dwóch stron. Dzieje nie wspominają o pobycie w nim."
      it: "Lasciata Filippi, proseguirono verso ovest lungo la strada e passarono per Anfipoli, l’antica città sullo Strimone pochi chilometri a monte della foce, che, dice Tucidide, fu chiamata così per lo Strimone che la cinge da due lati. Gli Atti non riferiscono alcuna sosta in quel luogo."
      nl: "Zij verlieten Filippi, trokken over de weg naar het westen en gingen door Amfipolis, de oude stad aan de Strymon enkele kilometers boven de monding, die, zoals Thucydides zegt, genoemd was naar de Strymon die haar aan twee zijden omstroomt. Handelingen vermeldt geen verblijf daar."
      cs: "Opustili Filipy, vydali se po silnici na západ a prošli Amfipolí, starým městem na Strymónu několik kilometrů nad jeho ústím, které podle Thúkydida dostalo jméno podle Strymónu, jenž je obtéká ze dvou stran. Skutky se o pobytu v něm nezmiňují."
      sv: "När de lämnade Filippi drog de västerut längs vägen och passerade genom Amfipolis, den gamla staden vid Strymon några kilometer ovanför dess mynning, som enligt Thukydides fick sitt namn av att Strymon flyter runt den på två sidor. Apostlagärningarna berättar inte om något uppehåll där."
      nb: "Fra Filippi dro de vestover langs veien og gjennom Amfipolis, den gamle byen ved Strymon noen kilometer ovenfor munningen, som ifølge Thukydid fikk navnet sitt fordi Strymon renner rundt den på to sider. Apostlenes gjerninger forteller ikke om noe opphold der."
      tl: "Pag-alis sa Filipos ay nagtungo sila pakanluran sa kahabaan ng daan at dumaan sa Amfipolis, ang matandang lungsod sa ilog Strymon na ilang kilometro sa itaas ng bunganga nito, na, ayon kay Tucidides, ay ipinangalan sa Strymon na umiikot dito sa dalawang panig. Walang binabanggit na pananatili roon ang Mga Gawa."
      da: "Fra Filippi drog de mod vest ad vejen og kom gennem Amfipolis, den gamle by ved Strymon nogle få kilometer oven for flodens munding, som ifølge Thukydid blev opkaldt efter Strymon, der løber rundt om den på to sider. Apostlenes Gerninger fortæller ikke om noget ophold der."
      sr: "Напустивши Филипе, ишли су путем на запад и прошли кроз Амфипољ, стари град на Стримону неколико километара изнад његовог ушћа, који је, како каже Тукидид, назван по Стримону што га оптиче с две стране. Дела не приповедају ни о каквом задржавању тамо."
      hu: "Filippiből elindulva nyugatra mentek az úton, és áthaladtak Amphipoliszon, a Sztrümón partján, néhány kilométerrel a torkolata fölött fekvő régi városon, amely Thuküdidész szerint a két oldalról körülfolyó Sztrümónról kapta a nevét. Az ApCsel nem szól ottani tartózkodásról."
      fi: "Filippistä he lähtivät tietä pitkin länteen ja kulkivat Amfipoliin kautta; se oli vanha kaupunki Strymon-joen varrella muutaman kilometrin päässä sen suulta, ja Thukydideen mukaan se nimettiin sen ympäri kahdelta puolelta virtaavan Strymonin mukaan. Apostolien teot ei kerro oleskelusta siellä."
      vi: "Rời Phi-líp, họ đi về phía tây theo con đường và đi ngang qua Am-phi-bô-lít, thành cổ bên sông Strymon, cách cửa sông vài cây số về phía thượng lưu, mà theo Thukydides, được đặt tên theo sông Strymon chảy vòng quanh thành ở hai phía. Sách Công vụ không kể việc họ dừng lại ở đó."
      ro: "Plecând din Filipi, au mers spre apus pe drum și au trecut prin Amfipolis, vechea cetate de pe Strimon, la câțiva kilometri în amonte de gura lui, care, după Tucidide, a fost numită după Strimonul ce o înconjura din două părți. Faptele nu povestesc niciun popas acolo."
      bg: "Като напуснаха Филипи, тръгнаха на запад по пътя и минаха през Амфипол, стария град на Стримон на няколко километра над устието му, който, както казва Тукидид, бил наречен на Стримон, който го обтича от две страни. Деяния не разказват за престой там."
