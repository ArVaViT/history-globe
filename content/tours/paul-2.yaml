    story:
      en: "They passed through Apollonia, a small town of Mygdonia on the Via Egnatia between Amphipolis and Thessalonica, south of Lake Bolbe. Acts names it only in passing."
      ru: "Они прошли через Аполлонию, небольшой город Мигдонии на Эгнатиевой дороге между Амфиполем и Фессалоникой, к югу от озера Болба. Деяния упоминают её лишь мимоходом."
      uk: "Вони пройшли через Аполлонію, невелике місто Мигдонії на Егнатієвій дорозі між Амфіполісом і Солунем, на південь від озера Больба. Дії згадують її лише мимохідь."
      es: "Pasaron por Apolonia, una pequeña ciudad de Migdonia en la Vía Egnatia, entre Anfípolis y Tesalónica, al sur del lago Bolbe. Los Hechos solo la nombran de paso."
      pt: "Passaram por Apolônia, uma pequena cidade da Migdônia na Via Egnácia, entre Anfípolis e Tessalônica, ao sul do lago Bolbe. Atos menciona-a apenas de passagem."
      de: "Sie kamen durch Apollonia, eine kleine Stadt in Mygdonien an der Via Egnatia zwischen Amphipolis und Thessalonich, südlich des Bolbe-Sees. Die Apostelgeschichte nennt sie nur im Vorübergehen."
      fr: "Ils passèrent par Apollonie, petite ville de Mygdonie sur la via Egnatia, entre Amphipolis et Thessalonique, au sud du lac Bolbé. Les Actes ne la nomment qu’en passant."
      pl: "Przeszli przez Apollonię, małe miasto w Mygdonii przy Via Egnatia, między Amfipolis a Tesaloniką, na południe od jeziora Bolbe. Dzieje wymieniają ją tylko mimochodem."
      it: "Passarono per Apollonia, piccola città della Migdonia sulla via Egnazia tra Anfipoli e Tessalonica, a sud del lago Bolbe. Gli Atti la nominano solo di passaggio."
      nl: "Zij gingen door Apollonia, een stadje in Mygdonië aan de Via Egnatia tussen Amfipolis en Tessalonica, ten zuiden van het Bolbemeer. Handelingen noemt het slechts in het voorbijgaan."
      cs: "Prošli Apollonií, malým městem v Mygdonii na Via Egnatia mezi Amfipolí a Tesalonikou, jižně od jezera Bolbe. Skutky ji jmenují jen mimochodem."
      sv: "De passerade genom Apollonia, en liten stad i Mygdonien vid Via Egnatia mellan Amfipolis och Tessalonike, söder om Bolbesjön. Apostlagärningarna nämner den bara i förbigående."
      nb: "De dro gjennom Apollonia, en liten by i Mygdonia ved Via Egnatia mellom Amfipolis og Tessalonika, sør for Bolbe-sjøen. Apostlenes gjerninger nevner den bare i forbifarten."
      tl: "Dumaan sila sa Apolonia, isang maliit na bayan ng Mygdonia sa Via Egnatia sa pagitan ng Amfipolis at Tesalonica, sa timog ng lawa ng Bolbe. Binabanggit lamang ito ng Mga Gawa sa pagdaan."
      da: "De drog gennem Apollonia, en lille by i Mygdonien ved Via Egnatia mellem Amfipolis og Thessalonika, syd for Bolbesøen. Apostlenes Gerninger nævner den kun i forbifarten."
      sr: "Прошли су кроз Аполонију, мали град Мигдоније на Егнатијевом путу између Амфипоља и Солуна, јужно од језера Болбе. Дела је помињу само узгред."
      hu: "Áthaladtak Apollónián, Mügdonia egy kis városán a Via Egnatián, Amphipolisz és Thesszalonika között, a Bolbé-tótól délre. Az ApCsel csak futólag említi."
      fi: "He kulkivat Apollonian kautta; se oli pieni Mygdonian kaupunki Via Egnatian varrella Amfipoliin ja Tessalonikan välillä, Bolbe-järven eteläpuolella. Apostolien teot mainitsee sen vain ohimennen."
      vi: "Họ đi ngang qua A-bô-lô-ni, một thị trấn nhỏ của Mygdonia trên Via Egnatia, giữa Am-phi-bô-lít và Tê-sa-lô-ni-ca, ở phía nam hồ Bolbe. Sách Công vụ chỉ nêu tên nơi này khi đi ngang qua."
      ro: "Au trecut prin Apolonia, un mic oraș al Migdoniei pe Via Egnatia, între Amfipolis și Tesalonic, la sud de lacul Bolbe. Faptele o numesc doar în treacăt."
      bg: "Минаха през Аполония — малък град в Мигдония на Виа Егнация между Амфипол и Солун, южно от езерото Болбе. Деяния я назовават само мимоходом."
  - place: afa9d8e
    ref: Acts.17.1-Acts.17.9
