# The Levite of Ephraim and the war of Israel with Benjamin, Judges 19-21, in the order of
# the text. The chapters are not dated ("in those days there was no king in Israel"); the
# tour's year (1150 BC) is the point of the Judges tour, for the map only. Phinehas the son
# of Eleazar serving before the ark (20:28) sets the story early in the period, like the
# Danites' migration. The Levite's home on mount Ephraim has no place on the map. "The
# house of God" where Israel asks counsel (20:18, 26; 21:2) is Hebrew beth-el: most modern
# translations and commentators read the town of Bethel, where the ark then stood (20:27),
# and the Synodal itself names Bethel in 20:31; the KJV and Synodal keep "house of God",
# and some take it as the sanctuary wherever it stood. The stop says so.
id: benjamin-war
title:
  en: "The war with Benjamin"
  ru: "Война с Вениамином"
  uk: "Війна з Веніяміном"
  es: "La guerra contra Benjamín"
  pt: "A guerra contra Benjamim"
  de: "Der Krieg gegen Benjamin"
  fr: "La guerre contre Benjamin"
  pl: "Wojna z Beniaminem"
  it: "La guerra contro Beniamino"
  nl: "De oorlog met Benjamin"
  cs: "Válka s Benjamínem"
  sv: "Kriget mot Benjamin"
  nb: "Krigen mot Benjamin"
  tl: "Ang digmaan laban sa Benjamin"
  da: "Krigen mod Benjamin"
  sr: "Рат с Венијамином"
  hu: "A Benjámin elleni háború"
  fi: "Sota Benjaminia vastaan"
  vi: "Cuộc chiến với Bên-gia-min"
  ro: "Războiul cu Beniamin"
  bg: "Войната с Вениамин"
year: "1150 BC"
# Where the story happens, told of a Levite and then of all Israel: no time on foot.
walked: false
approximate: true
stops:
  - place: a112427 # Bethlehem
    ref: Judg.19.1-Judg.19.9
    note:
      en: "A Levite of mount Ephraim goes to Bethlehem-judah to bring back his concubine; her father keeps him feasting for five days."
      ru: "Левит с горы Ефремовой идёт в Вифлеем Иудейский вернуть наложницу; её отец пять дней удерживает его угощением."
      uk: "Левіт з гори Єфремової іде до Вифлеєму Юдиного, щоб повернути свою наложницю; її батько тримає його п’ять днів на бенкеті."
      es: "Un levita del monte de Efraín va a Belén de Judá para recuperar a su concubina; el padre de ella lo retiene cinco días de banquete."
      pt: "Um levita do monte Efraim vai a Belém de Judá para trazer de volta a sua concubina; o pai dela o retém em banquetes por cinco dias."
      de: "Ein Levit vom Gebirge Ephraim geht nach Bethlehem in Juda, um seine Nebenfrau zurückzuholen; ihr Vater hält ihn fünf Tage lang bei Tisch fest."
      fr: "Un Lévite de la montagne d’Éphraïm se rend à Bethléhem de Juda pour ramener sa concubine ; le père de celle-ci le retient cinq jours de festin."
      pl: "Lewita z gór Efraima udaje się do Betlejem Judzkiego, aby sprowadzić z powrotem swoją nałożnicę; jej ojciec zatrzymuje go na ucztowaniu przez pięć dni."
      it: "Un Levita delle montagne di Efraim va a Betlemme di Giuda per riprendersi la concubina; il padre di lei lo trattiene a banchettare per cinque giorni."
      nl: "Een Leviet uit het Bergland van Efraïm gaat naar Bethlehem in Juda om zijn bijvrouw terug te halen; haar vader houdt hem vijf dagen lang aan tafel."
      cs: "Levita z pohoří Efrajim jde do Betléma Judského, aby přivedl zpět svou ženinu; její otec ho zdržuje při hodování pět dní."
      sv: "En levit från Efraims bergsbygd drar till Betlehem i Juda för att hämta tillbaka sin bihustru; hennes far håller kvar honom i fem dagar av festande."
      nb: "En levitt fra Efraims fjell drar til Betlehem i Juda for å hente tilbake sin medhustru; hennes far holder ham der med fest i fem dager."
      tl: "Isang Levita sa lupaing maburol ng Ephraim ay pumupunta sa Bethlehem-juda upang bawiin ang kaniyang kinakasama; pinipigil siya ng ama nito na nagpipiging sa loob ng limang araw."
      da: "En levit fra Efraims bjergland rejser til Betlehem i Juda for at hente sin medhustru tilbage; hendes far holder ham fast med festmåltider i fem dage."
      sr: "Левит из горе Јефремове одлази у Витлејем Јудин да доведе натраг своју иночу; њен отац га задржава на гозби пет дана."
      hu: "Efraim hegyvidékének egy lévitája a júdai Betlehembe megy, hogy visszahozza ágyasát; az asszony apja öt napig vendégeskedéssel tartja vissza."
      fi: "Efraimin vuoriseudun leeviläinen lähtee Juudan Betlehemiin hakemaan takaisin sivuvaimoaan; tämän isä pitää häntä juhlimassa viisi päivää."
      vi: "Một người Lê-vi ở núi Ép-ra-im đi đến Bết-lê-hem của Giu-đa để đem vợ bé mình về; cha nàng giữ người lại ăn tiệc trong năm ngày."
      ro: "Un levit din muntele lui Efraim merge la Betleemul lui Iuda ca să-și aducă înapoi țiitoarea; tatăl ei îl ține la ospăț cinci zile."
      bg: "Един левит от Ефремовата планина отива във Витлеем Юдейски, за да върне наложницата си; баща ѝ го задържа на гощавка пет дни."
  - place: a403c45 # Jebus
    ref: Judg.19.10-Judg.19.12
    note:
      en: "With the day far spent they reach Jebus, which is Jerusalem; the Levite will not lodge in a city of strangers and goes on to Gibeah."
      ru: "К вечеру они доходят до Иевуса, что ныне Иерусалим; левит не хочет ночевать в городе иноплеменников и идёт дальше, к Гиве."
      uk: "Коли день уже хилиться, вони доходять до Євусу, тобто Єрусалима; левіт не хоче зупинятися в місті чужинців і йде далі до Гіви."
      es: "Con el día ya avanzado llegan a Jebús, que es Jerusalén; el levita no quiere hospedarse en una ciudad de extranjeros y sigue hasta Gabaa."
      pt: "Com o dia já avançado, chegam a Jebus, que é Jerusalém; o levita não quer pernoitar numa cidade de estrangeiros e segue para Gibeá."
      de: "Als der Tag fast vorüber ist, erreichen sie Jebus, das ist Jerusalem; der Levit will nicht in einer Stadt von Fremden übernachten und zieht weiter nach Gibea."
      fr: "Le jour étant fort avancé, ils arrivent à Jébus, qui est Jérusalem ; le Lévite refuse de loger dans une ville d’étrangers et poursuit jusqu’à Guibea."
      pl: "Gdy dzień jest już mocno posunięty, docierają do Jebus, czyli Jerozolimy; Lewita nie chce nocować w mieście obcych i idzie dalej do Gibei."
      it: "A giorno inoltrato raggiungono Gebus, cioè Gerusalemme; il Levita non vuole alloggiare in una città di stranieri e prosegue fino a Gabaa."
      nl: "Als de dag al ver gevorderd is, bereiken zij Jebus, dat is Jeruzalem; de Leviet wil niet overnachten in een stad van vreemden en gaat door naar Gibea."
      cs: "Když se den chýlí, docházejí k Jebúsu, což je Jeruzalém; Levita nechce přenocovat v cizím městě a jde dál do Gibeje."
      sv: "När dagen är långt framskriden når de Jevus, det vill säga Jerusalem; leviten vill inte övernatta i en främlingarnas stad och fortsätter till Giva."
      nb: "Da dagen er langt på vei, kommer de til Jebus, det er Jerusalem; levitten vil ikke ta herberge i en fremmed by og drar videre til Gibea."
      tl: "Nang malapit nang lumubog ang araw ay umaabot sila sa Jebus, na siyang Jerusalem; ayaw tumuloy ng Levita sa bayan ng mga dayuhan at nagpapatuloy sa Gibea."
      da: "Da dagen er fremskreden, når de Jebus, det er Jerusalem; leviten vil ikke overnatte i en fremmeds by og går videre til Gibea."
      sr: "Кад је дан био већ на измаку, стижу до Јевуса, то јест Јерусалима; левит не хтеде да заноћи у туђинском граду и иде даље у Гавају."
      hu: "A nap már lehanyatlóban, Jebúzhoz érnek, azaz Jeruzsálemhez; a lévita nem akar idegenek városában megszállni, ezért tovább megy Gibeába."
      fi: "Päivän jo kuluttua pitkälle he saapuvat Jebusiin, se on Jerusalem; leeviläinen ei suostu yöpymään vieraiden kaupungissa ja jatkaa Gibeaan."
      vi: "Khi ngày đã xế, họ đến Giê-bu, tức là Giê-ru-sa-lem; người Lê-vi không chịu nghỉ đêm trong một thành của người ngoại và đi tiếp đến Ghi-bê-a."
      ro: "Când ziua e pe sfârșite, ajung la Iebus, adică Ierusalim; levitul nu vrea să rămână peste noapte într-o cetate de străini și merge mai departe, la Ghibea."
      bg: "Когато денят вече е превалял, те стигат до Йевус, който е Йерусалим; левитът не иска да нощува в град на чужденци и продължава към Гива."
  - place: ac24f5f # Gibeah
    ref: Judg.19.13-Judg.19.30
    note:
      en: "At Gibeah of Benjamin no one takes them in but an old man; the men of the city abuse the concubine through the night, and she dies at the door. The Levite cuts her body into twelve pieces and sends them through all the coasts of Israel."
      ru: "В Гиве Вениаминовой их не пускает в дом никто, кроме одного старика; мужчины города всю ночь насилуют наложницу, и она умирает у порога. Левит разрезает её тело на двенадцать частей и рассылает во все пределы Израилевы."
      uk: "У Гіві Веніяминовій ніхто, окрім одного старого, не пускає їх до себе; чоловіки міста наруговуються над наложницею всю ніч, і вона вмирає біля дверей. Левіт розрізає її тіло на дванадцять частин і розсилає по всіх межах Ізраїлю."
      es: "En Gabaa de Benjamín nadie los recoge, salvo un anciano; los hombres de la ciudad abusan de la concubina durante la noche, y ella muere a la puerta. El levita corta su cuerpo en doce pedazos y los envía por todos los confines de Israel."
      pt: "Em Gibeá de Benjamim ninguém os recebe, a não ser um velho; os homens da cidade abusam da concubina durante a noite, e ela morre à porta. O levita corta o corpo dela em doze pedaços e os envia por todos os territórios de Israel."
      de: "In Gibea in Benjamin nimmt sie niemand auf außer einem alten Mann; die Männer der Stadt missbrauchen die Nebenfrau die ganze Nacht hindurch, und sie stirbt an der Tür. Der Levit zerstückelt ihren Leichnam in zwölf Teile und sendet sie in alle Gebiete Israels."
      fr: "À Guibea de Benjamin, personne ne les accueille sauf un vieillard ; les hommes de la ville abusent de la concubine toute la nuit, et elle meurt à la porte. Le Lévite coupe son corps en douze morceaux et les envoie dans tout le territoire d’Israël."
      pl: "W Gibei Beniaminowej nikt ich nie przyjmuje prócz jednego starca; mężowie miasta znęcają się nad nałożnicą przez całą noc, a ona umiera u drzwi. Lewita rozcina jej ciało na dwanaście części i rozsyła je po wszystkich krainach Izraela."
      it: "A Gabaa di Beniamino nessuno li accoglie tranne un vecchio; gli uomini della città violentano la concubina per tutta la notte, ed ella muore sulla soglia. Il Levita ne taglia il corpo in dodici pezzi e li manda in tutto il territorio d’Israele."
      nl: "Te Gibea in Benjamin neemt niemand hen op behalve een oude man; de mannen van de stad misbruiken de bijvrouw de hele nacht, en zij sterft aan de deur. De Leviet snijdt haar lichaam in twaalf stukken en stuurt die door alle gebieden van Israël."
      cs: "V Gibeji Benjamínově je nikdo nepřijme než jeden stařec; muži města týrají ženinu celou noc a ona umírá u dveří. Levita rozsekává její tělo na dvanáct kusů a rozesílá je do všech končin Izraele."
      sv: "I Giva i Benjamin tar ingen emot dem utom en gammal man; stadens män misshandlar bihustrun hela natten, och hon dör vid dörren. Leviten styckar hennes kropp i tolv delar och sänder dem genom hela Israels område."
      nb: "I Benjamins Gibea er det ingen som tar dem inn unntatt en gammel mann; mennene i byen misbruker medhustruen natten igjennom, og hun dør ved døren. Levitten skjærer kroppen hennes i tolv stykker og sender dem rundt i hele Israels land."
      tl: "Sa Gibea ng Benjamin ay walang tumatanggap sa kanila kundi isang matanda; inaabuso ng mga lalaki ng bayan ang kinakasama sa buong magdamag, at namamatay siya sa pintuan. Pinuputol ng Levita ang kaniyang bangkay sa labindalawang piraso at ipinadadala sa lahat ng hangganan ng Israel."
      da: "I Benjamins Gibea tager ingen imod dem undtagen en gammel mand; byens mænd mishandler medhustruen natten igennem, og hun dør ved døren. Leviten skærer hendes legeme i tolv stykker og sender dem ud over hele Israels land."
      sr: "У Гаваји венијаминовој нико их не прима осим једног старца; људи из града ружно поступају с иночом целу ноћ, и она умире на вратима. Левит расече њено тело на дванаест комада и разашиље по свим крајевима Израиљевим."
      hu: "A benjámini Gibeában egy öreg emberen kívül senki sem fogadja be őket; a város férfiai egész éjszaka gyalázzák az ágyast, aki az ajtónál meghal. A lévita tizenkét darabra vágja a testét, és elküldi Izráel minden határába."
      fi: "Benjaminin Gibeassa ei kukaan ota heitä luokseen paitsi vanha mies; kaupungin miehet pahoinpitelevät sivuvaimoa läpi yön, ja hän kuolee oven ääreen. Leeviläinen paloittelee hänen ruumiinsa kahteentoista osaan ja lähettää ne kaikkiin Israelin alueisiin."
      vi: "Tại Ghi-bê-a của Bên-gia-min, không ai tiếp rước họ ngoài một ông già; những người trong thành làm nhục người vợ bé suốt đêm, và nàng chết nơi cửa. Người Lê-vi chặt thây nàng ra làm mười hai đoạn và gởi đi khắp địa phận Y-sơ-ra-ên."
      ro: "La Ghibea lui Beniamin nimeni nu-i primește în afară de un bătrân; bărbații cetății o batjocoresc pe țiitoare toată noaptea, iar ea moare la ușă. Levitul îi taie trupul în douăsprezece bucăți și le trimite prin toate hotarele lui Israel."
      bg: "В Гива Вениаминова никой не ги приема освен един старец; мъжете на града малтретират наложницата цяла нощ и тя умира на прага. Левитът разсича тялото ѝ на дванадесет части и ги разпраща по всички предели на Израил."
  - place: a736f6c # Mizpah
    ref: Judg.20.1-Judg.20.17
    note:
      en: 'All Israel, "from Dan even to Beer-sheba", gathers to the Lord at Mizpah; Benjamin refuses to give up the men of Gibeah.'
      ru: "Весь Израиль, «от Дана до Вирсавии», собирается пред Господа в Массифу; Вениамин отказывается выдать развращённых людей Гивы."
      uk: "Увесь Ізраїль, «від Дана аж до Берсабиї», збирається до Господа в Міцпі; Веніямин відмовляється видати мужів Гіви."
      es: "Todo Israel, «desde Dan hasta Beer-seba», se reúne ante el Señor en Mizpa; Benjamín se niega a entregar a los hombres de Gabaa."
      pt: "Todo o Israel, “desde Dã até Berseba”, reúne-se perante o Senhor em Mispá; Benjamim recusa-se a entregar os homens de Gibeá."
      de: "Ganz Israel versammelt sich „von Dan bis gen Beer-Seba“ bei dem Herrn in Mizpa; Benjamin weigert sich, die Männer von Gibea auszuliefern."
      fr: "Tout Israël, « depuis Dan jusqu’à Beer-Schéba », se rassemble devant l’Éternel à Mitspa ; Benjamin refuse de livrer les hommes de Guibea."
      pl: "Cały Izrael, „od Dan aż do Beerseba”, zgromadza się przed Panem w Mispie; Beniamin odmawia wydania mężów z Gibei."
      it: "Tutto Israele, «da Dan fino a Beer-Sceba», si raduna davanti al Signore a Mizpa; Beniamino rifiuta di consegnare gli uomini di Gabaa."
      nl: "Heel Israël, “van Dan af tot Ber-seba toe”, verzamelt zich bij de HEER te Mizpa; Benjamin weigert de mannen van Gibea uit te leveren."
      cs: "Celý Izrael, „od Dan až do Bersabé“, se shromažďuje k Hospodinu v Micpě; Benjamín odmítá vydat muže z Gibeje."
      sv: "Hela Israel, ”från Dan ända till Beer-Seba”, samlas inför Herren i Mispa; Benjamin vägrar att lämna ut männen i Giva."
      nb: "Hele Israel, «like fra Dan og til Be'erseba», samles for Herren i Mispa; Benjamin nekter å utlevere mennene fra Gibea."
      tl: "Ang buong Israel, “mula sa Dan hanggang sa Beer-seba”, ay nagtipon sa Panginoon sa Mizpa; tumangging ibigay ng Benjamin ang mga lalaki ng Gibea."
      da: "Hele Israel, »fra Dan indtil Beersaba«, samles for Herren i Mispa; Benjamin nægter at udlevere Gibeas mænd."
      sr: "Сав Израиљ, „од Дана до Вирсавеје“, окупља се Господу у Масфи; Венијамин одбија да изда људе из Гаваје."
      hu: "Egész Izráel, „Dántól fogva Bersebáig”, összegyűlik az Úrhoz Micpában; Benjámin nem hajlandó kiadni Gibea férfiait."
      fi: "Koko Israel, ”Daanista aina Beersebaan saakka”, kokoontuu Herran eteen Mispaan; Benjamin kieltäytyy luovuttamasta Gibean miehiä."
      vi: "Cả Y-sơ-ra-ên, “từ Đan cho đến Bê-e-sê-ba”, nhóm hiệp lại trước mặt Đức Giê-hô-va tại Mích-ba; Bên-gia-min không chịu nộp những người ở Ghi-bê-a."
      ro: "Tot Israelul, „dela Dan până la Virsavee”, se adună la Domnul la Mițpa; Beniamin refuză să-i predea pe oamenii din Ghibea."
      bg: "Целият Израил, „от Дан до Вирсавее“, се събира пред Господа в Мицпа; Вениамин отказва да предаде мъжете на Гива."
  - place: a64f355 # Bethel
    ref: Judg.20.18-Judg.20.28
    note:
      en: "At the house of God, in Hebrew Beth-el and usually taken as the town of Bethel, Israel asks who shall go up first; twice beaten, they weep and fast before the ark, where Phinehas the son of Eleazar serves, and are told to go up once more."
      ru: "В доме Божием (по-еврейски Бет-Эль, обычно понимаемом как город Вефиль) Израиль вопрошает, кому идти первым; дважды разбитые, они плачут и постятся пред ковчегом, при котором служит Финеес, сын Елеазара, и получают повеление идти снова."
      uk: "У домі Божому, івритом Бет-Ел, який зазвичай ототожнюють з містом Бет-Елом, Ізраїль питає, хто піде першим; двічі розбиті, вони плачуть і постять перед ковчегом, при якому служить Финеєс, син Елеазара, і чують веління вийти ще раз."
      es: "En la casa de Dios, en hebreo Betel, que por lo común se toma por la ciudad de Betel, Israel pregunta quién subirá primero; derrotados dos veces, lloran y ayunan ante el arca, donde sirve Finees, hijo de Eleazar, y se les manda subir una vez más."
      pt: "Na casa de Deus, em hebraico Betel e geralmente identificada com a cidade de Betel, Israel pergunta quem deve subir primeiro; derrotados duas vezes, choram e jejuam diante da arca, onde serve Finéias, filho de Eleazar, e são mandados subir mais uma vez."
      de: "Am Haus Gottes, auf Hebräisch Beth-El und gewöhnlich als die Stadt Bethel verstanden, fragt Israel, wer zuerst hinaufziehen soll; zweimal geschlagen, weinen und fasten sie vor der Lade, bei der Pinhas, der Sohn Eleasars, dient, und es wird ihnen gesagt, noch einmal hinaufzuziehen."
      fr: "À la maison de Dieu, en hébreu Béthel et ordinairement identifiée à la ville de Béthel, Israël demande qui montera le premier ; deux fois battu, il pleure et jeûne devant l’arche, où sert Phinées, fils d’Éléazar, et il reçoit l’ordre de monter encore une fois."
      pl: "W domu Bożym, po hebrajsku Bet-El, zwykle utożsamianym z miastem Betel, Izrael pyta, kto ma wyruszyć pierwszy; dwukrotnie pobity, płacze i pości przed arką, przy której służy Pinchas, syn Eleazara, i otrzymuje polecenie, by wyruszyć jeszcze raz."
      it: "Alla casa di Dio, in ebraico Beth-El e di solito intesa come la città di Betel, Israele chiede chi debba salire per primo; sconfitti due volte, piangono e digiunano davanti all’arca, dove serve Pincas, figlio di Eleazaro, e ricevono l’ordine di salire ancora una volta."
      nl: "Bij het huis van God, in het Hebreeuws Beth-El en gewoonlijk opgevat als de stad Bethel, vraagt Israël wie het eerst zal optrekken; tweemaal verslagen wenen en vasten zij voor de ark, waar Pinechas, de zoon van Eleazar, dienst doet, en krijgen te horen dat zij nog eenmaal moeten optrekken."
      cs: "V domě Božím, hebrejsky Bét-el, což se obvykle považuje za město Bét-el, se Izrael ptá, kdo má vytáhnout první; dvakrát poražení pláčou a postí se před truhlou, u níž slouží Pinchas, syn Eleazarův, a dostávají pokyn vytáhnout ještě jednou."
      sv: "Vid Guds hus, på hebreiska Betel och vanligen uppfattat som staden Betel, frågar Israel vem som ska gå upp först; två gånger slagna gråter och fastar de inför arken, där Pinechas, Eleasars son, tjänstgör, och får beskedet att gå upp ännu en gång."
      nb: "Ved Guds hus, på hebraisk Betel og vanligvis forstått som byen Betel, spør Israel hvem som skal dra opp først; to ganger slått gråter og faster de foran arken, hvor Pinhas, Eleasars sønn, gjør tjeneste, og får beskjed om å dra opp enda en gang."
      tl: "Sa bahay ng Diyos, na sa Hebreo ay Beth-el at karaniwang itinuturing na bayan ng Beth-el, nagtanong ang Israel kung sino ang unang aahon; dalawang beses na natalo, umiyak at nag-ayuno sila sa harap ng kaban, na pinaglilingkuran ni Phinees na anak ni Eleazar, at sinabihan silang umahon muli."
      da: "Ved Guds hus, på hebraisk Bet-El og sædvanligvis opfattet som byen Betel, spørger Israel, hvem der skal drage op først; to gange slået græder og faster de foran arken, hvor Pinehas, Eleazars søn, gør tjeneste, og får besked om at drage op endnu en gang."
      sr: "У дому Божјем, на хебрејском Ветиљ, који се обично схвата као град Ветиљ, Израиљ пита ко ће први ићи; два пута потучени, плачу и посте пред ковчегом, код кога служи Финес син Елеазаров, и добијају заповест да иду још једном."
      hu: "Isten házánál, amely héberül Béth-El, és többnyire Bétel városaként értelmezik, Izráel megkérdezi, ki vonuljon fel elsőként; kétszer is vereséget szenvednek, sírnak és bőjtölnek a láda előtt, ahol Fineás, Eleázár fia szolgál, és azt a választ kapják, hogy vonuljanak fel még egyszer."
      fi: "Jumalan huoneessa, hepreaksi Bet-El ja yleensä Betelin kaupungiksi katsottu, Israel kysyy, kuka nousee ensimmäisenä; kahdesti lyötyinä he itkevät ja paastoavat arkin edessä, jota palvelee Pinehas, Eleasarin poika, ja heitä käsketään nousta vielä kerran."
      vi: "Tại nhà Đức Chúa Trời, tiếng Hê-bơ-rơ là Bê-tên và thường được hiểu là thành Bê-tên, Y-sơ-ra-ên hỏi ai phải đi lên trước; hai lần bị thua, họ khóc lóc và kiêng ăn trước hòm giao ước, nơi Phi-nê-a, con trai Ê-lê-a-sa, đang phục vụ, và được truyền phải đi lên một lần nữa."
      ro: "La casa lui Dumnezeu, în ebraică Bet-El, înțeleasă de obicei drept cetatea Betel, Israel întreabă cine să urce primul; bătuți de două ori, plâng și postesc înaintea chivotului, unde slujește Fineas, fiul lui Eleazar, și li se spune să mai urce o dată."
      bg: "В Божия дом — на еврейски Бет-Ел, обикновено разбиран като град Ветил — Израил пита кой да възлезе пръв; два пъти разбити, те плачат и постят пред ковчега, при който служи Финеес, синът на Елеазар, и им е казано да възлязат още веднъж."
  - place: ac24f5f # Gibeah
    ref: Judg.20.29-Judg.20.44
    note:
      en: "An ambush is set round Gibeah; the city is taken and burned, and Benjamin is smitten: 25,100 men fall that day."
      ru: "Вокруг Гивы ставят засаду; город взят и сожжён, Вениамин разбит: в тот день падают двадцать пять тысяч сто человек."
      uk: "Навколо Гіви влаштовують засідку; місто здобуто й спалено, а Веніямина розбито: того дня падає 25 100 чоловіків."
      es: "Se tiende una emboscada alrededor de Gabaa; la ciudad es tomada e incendiada, y Benjamín es herido: aquel día caen 25 100 hombres."
      pt: "Prepara-se uma emboscada ao redor de Gibeá; a cidade é tomada e incendiada, e Benjamim é ferido: caem 25.100 homens naquele dia."
      de: "Rings um Gibea wird ein Hinterhalt gelegt; die Stadt wird eingenommen und verbrannt, und Benjamin wird geschlagen: 25 100 Mann fallen an diesem Tag."
      fr: "Une embuscade est dressée autour de Guibea ; la ville est prise et incendiée, et Benjamin est battu : 25 100 hommes tombent ce jour-là."
      pl: "Wokół Gibei zostaje zastawiona zasadzka; miasto zostaje zdobyte i spalone, a Beniamin pobity: tego dnia pada 25 100 mężów."
      it: "Si tende un’imboscata intorno a Gabaa; la città è presa e incendiata, e Beniamino è sconfitto: quel giorno cadono 25.100 uomini."
      nl: "Rondom Gibea wordt een hinderlaag gelegd; de stad wordt ingenomen en verbrand, en Benjamin wordt verslagen: die dag vallen 25.100 man."
      cs: "Kolem Gibeje je nastražena léčka; město je dobyto a vypáleno a Benjamín poražen: toho dne padne 25 100 mužů."
      sv: "Ett bakhåll läggs runt Giva; staden intas och bränns, och Benjamin slås: 25 100 män faller den dagen."
      nb: "Det legges et bakhold rundt Gibea; byen blir inntatt og brent, og Benjamin blir slått: 25 100 mann faller den dagen."
      tl: "Naglagay ng pananambang sa palibot ng Gibea; nasakop at nasunog ang lungsod, at nasaktan ang Benjamin: 25,100 lalaki ang nabuwal sa araw na iyon."
      da: "Der lægges et baghold rundt om Gibea; byen indtages og brændes, og Benjamin slås: 25.100 mand falder den dag."
      sr: "Око Гаваје се поставља заседа; град је освојен и спаљен, а Венијамин потучен: тога дана пада двадесет и пет хиљада и сто људи."
      hu: "Gibea körül leshelyet állítanak; a várost elfoglalják és felégetik, Benjámint pedig megverik: azon a napon 25 100 férfi esik el."
      fi: "Gibean ympärille asetetaan väijytys; kaupunki valloitetaan ja poltetaan, ja Benjamin lyödään: sinä päivänä kaatuu 25 100 miestä."
      vi: "Họ đặt quân phục binh chung quanh Ghi-bê-a; thành bị chiếm và bị đốt, và Bên-gia-min bị đánh bại: hai mươi lăm ngàn một trăm người ngã xuống trong ngày ấy."
      ro: "În jurul Ghibei se pune o pândă; cetatea este cucerită și arsă, iar Beniamin este lovit: în ziua aceea cad 25.100 de bărbați."
      bg: "Около Гива е поставена засада; градът е превзет и изгорен, а Вениамин е поразен: в този ден падат 25 100 мъже."
  - place: a45acc3 # Rimmon
    ref: Judg.20.45-Judg.20.48
    note:
      en: "Six hundred men flee to the rock of Rimmon in the wilderness and stay there four months, all that is left of the tribe."
      ru: "Шестьсот человек бегут к скале Риммону в пустыне и остаются там четыре месяца, всё, что уцелело от колена."
      uk: "Шістсот чоловіків тікають до скелі Риммон у пустелі й лишаються там чотири місяці — усе, що залишилося від коліна."
      es: "Seiscientos hombres huyen a la peña de Rimón, en el desierto, y permanecen allí cuatro meses: es todo lo que queda de la tribu."
      pt: "Seiscentos homens fogem para a rocha de Rimom, no deserto, e ficam ali quatro meses, tudo o que resta da tribo."
      de: "Sechshundert Mann fliehen zum Felsen Rimmon in der Wüste und bleiben dort vier Monate, alles, was vom Stamm übrig ist."
      fr: "Six cents hommes s’enfuient au rocher de Rimmon, dans le désert, et y restent quatre mois : tout ce qui reste de la tribu."
      pl: "Sześciuset mężów ucieka do skały Rimmon na pustyni i pozostaje tam cztery miesiące — to wszystko, co zostało z plemienia."
      it: "Seicento uomini fuggono verso la roccia di Rimmon, nel deserto, e vi restano quattro mesi: è tutto ciò che resta della tribù."
      nl: "Zeshonderd man vluchten naar de rots van Rimmon in de woestijn en blijven daar vier maanden, al wat er van de stam over is."
      cs: "Šest set mužů prchá ke skále Rimmon na poušti a zůstává tam čtyři měsíce, vše, co z kmene zbylo."
      sv: "Sex hundra man flyr till Rimmons klippa i öknen och stannar där i fyra månader, allt som finns kvar av stammen."
      nb: "Seks hundre mann flykter til Rimmons klippe i ørkenen og blir der i fire måneder, alt som er igjen av stammen."
      tl: "Anim na raang lalaki ang tumakas patungo sa bato ng Rimmon sa ilang at nanatili roon nang apat na buwan, ang lahat ng natira sa lipi."
      da: "Seks hundrede mand flygter til Rimmons klippe i ørkenen og bliver der i fire måneder, alt hvad der er tilbage af stammen."
      sr: "Шест стотина људи бежи у пустињу к стени Римону и тамо остаје четири месеца, све што је остало од племена."
      hu: "Hatszáz férfi a pusztába, a Rimmón sziklájához menekül, és négy hónapig ott marad; ennyi maradt a törzsből."
      fi: "Kuusisataa miestä pakenee Rimmonin kalliolle erämaahan ja pysyy siellä neljä kuukautta; heitä on kaikki, mitä sukukunnasta on jäljellä."
      vi: "Sáu trăm người chạy trốn đến hòn đá Rim-môn trong đồng vắng và ở đó bốn tháng, là tất cả những gì còn lại của chi phái."
      ro: "Șase sute de bărbați fug la stânca Rimon, în pustiu, și rămân acolo patru luni: tot ce a mai rămas din seminție."
      bg: "Шестстотин мъже бягат към скалата Римон в пустинята и остават там четири месеца — всичко, което е останало от племето."
  - place: af92088 # Jabesh-gilead
    ref: Judg.21.1-Judg.21.14
    note:
      en: "Israel has sworn not to give Benjamin wives. Jabesh-gilead sent no one to Mizpah: twelve thousand men smite it and bring four hundred virgins to the camp at Shiloh."
      ru: "Израиль поклялся не отдавать дочерей Вениамину. Из Иависа Галаадского никто не приходил в Массифу: двенадцать тысяч поражают его и приводят четыреста девиц в стан в Силом."
      uk: "Ізраїль поклявся не давати Веніяминові жінок. Явіс Гілеадський нікого не прислав до Міцпи: дванадцять тисяч чоловіків б’ють його й приводять чотириста дів до табору в Шіло."
      es: "Israel ha jurado no dar mujeres a Benjamín. Jabes de Galaad no envió a nadie a Mizpa: doce mil hombres la hieren y llevan cuatrocientas vírgenes al campamento de Silo."
      pt: "Israel jurou não dar mulheres a Benjamim. Jabes-Gileade não enviou ninguém a Mispá: doze mil homens a ferem e levam quatrocentas virgens ao acampamento em Siló."
      de: "Israel hat geschworen, Benjamin keine Frauen zu geben. Jabesch in Gilead hat niemanden nach Mizpa gesandt: Zwölftausend Mann schlagen es und bringen vierhundert Jungfrauen ins Lager nach Silo."
      fr: "Israël a juré de ne pas donner de femmes à Benjamin. Jabès en Galaad n’avait envoyé personne à Mitspa : douze mille hommes la frappent et amènent quatre cents vierges au camp de Silo."
      pl: "Izrael poprzysiągł, że nie da Beniaminowi żon. Jabesz-Gilead nie wysłało nikogo do Mispy: dwanaście tysięcy mężów je pobija i sprowadza czterysta dziewic do obozu w Szilo."
      it: "Israele ha giurato di non dare mogli a Beniamino. Iabes di Galaad non aveva mandato nessuno a Mizpa: dodicimila uomini la colpiscono e portano quattrocento vergini all’accampamento di Silo."
      nl: "Israël heeft gezworen Benjamin geen vrouwen te geven. Jabes in Gilead had niemand naar Mizpa gestuurd: twaalfduizend man slaan het en brengen vierhonderd maagden naar het kamp te Silo."
      cs: "Izrael přísahal, že Benjamínovi nedá ženy. Jabeš gileadský neposlal nikoho do Micpy: dvanáct tisíc mužů jej poráží a přivádí do tábora v Šílu čtyři sta panen."
      sv: "Israel har svurit att inte ge Benjamin några hustrur. Javesh-Gilead sände ingen till Mispa: tolv tusen man slår staden och för fyra hundra jungfrur till lägret i Shilo."
      nb: "Israel har sverget å ikke gi Benjamin hustruer. Jabesj-Gilead sendte ingen til Mispa: tolv tusen mann slår byen og fører fire hundre jomfruer til leiren i Sjilo."
      tl: "Sumumpa ang Israel na hindi magbibigay ng mga asawa sa Benjamin. Walang ipinadala ang Jabes-galaad sa Mizpa: labindalawang libong lalaki ang sumalakay rito at nagdala ng apat na raang dalaga sa kampo sa Shiloh."
      da: "Israel har svoret ikke at give Benjamin hustruer. Jabesj i Gilead sendte ingen til Mispa: tolv tusind mand slår byen og bringer fire hundrede jomfruer til lejren i Silo."
      sr: "Израиљ се заклео да неће давати жене Венијамину. Јавис Галадски није послао никога у Масфу: дванаест хиљада људи туче га и доводи четири стотине девојака у логор у Силу."
      hu: "Izráel megesküdött, hogy nem ad feleséget Benjáminnak. Jábés-Gileád senkit sem küldött Micpába: tizenkétezer férfi megveri, és négyszáz szüzet visz a silói táborba."
      fi: "Israel on vannonut, ettei anna Benjaminille vaimoja. Jabes-Gilead ei lähettänyt ketään Mispaan: kaksitoista tuhatta miestä lyö sen ja tuo neljäsataa neitsyttä leiriin Siloon."
      vi: "Y-sơ-ra-ên đã thề không gả con gái cho Bên-gia-min. Gia-be Ga-la-át không cử ai đến Mích-ba: mười hai ngàn người đánh thành ấy và đem bốn trăm trinh nữ về trại quân tại Si-lô."
      ro: "Israel a jurat să nu-i dea lui Beniamin femei. Iabeș din Galaad nu trimisese pe nimeni la Mițpa: douăsprezece mii de bărbați o lovesc și aduc patru sute de fecioare în tabăra de la Silo."
      bg: "Израил се е заклел да не дава жени на Вениамин. Явис Галаадски не е пратил никого в Мицпа: дванадесет хиляди мъже го поразяват и довеждат четиристотин девици в стана в Силом."
  - place: aa4680a # Shiloh
    ref: Judg.21.15-Judg.21.25
    note:
      en: 'At the yearly feast of the Lord in Shiloh the Benjamites, hidden in the vineyards, catch wives from the daughters of Shiloh as they come out to dance. "In those days there was no king in Israel: every man did that which was right in his own eyes."'
      ru: "На ежегодном празднике Господнем в Силоме Вениамитяне, засев в виноградниках, хватают себе жён из девиц Силомских, вышедших плясать. «В те дни не было царя у Израиля; каждый делал то, что ему казалось справедливым»."
      uk: "На щорічному святі Господа в Шіло веніяминяни, сховані у виноградниках, хапають собі жінок з-поміж дочок Шіло, коли ті виходять танцювати. «Того часу не було царя в Ізраїлї; кожен чинив, що йому здавалось добрим.»"
      es: "En la fiesta anual del Señor en Silo, los benjamitas, ocultos en las viñas, arrebatan esposas de entre las hijas de Silo cuando salen a danzar. «En estos días no había rey en Israel: cada uno hacía lo recto delante de sus ojos»."
      pt: "Na festa anual do Senhor em Siló, os benjamitas, escondidos nas vinhas, capturam esposas entre as filhas de Siló quando elas saem para dançar. “Naqueles dias não havia rei em Israel. Cada um fazia o que era certo aos seus próprios olhos.”"
      de: "Beim jährlichen Fest des Herrn in Silo fangen die Benjaminiter, in den Weinbergen versteckt, sich Frauen unter den Töchtern Silos, als diese zum Tanz herauskommen. „Zu der Zeit war kein König in Israel; ein jeglicher tat, was ihn recht deuchte.“"
      fr: "À la fête annuelle de l’Éternel à Silo, les Benjamites, cachés dans les vignes, enlèvent des femmes parmi les filles de Silo au moment où elles sortent pour danser. « En ce temps-là, il n’y avait point de roi en Israël. Chacun faisait ce qui lui semblait bon. »"
      pl: "Podczas corocznego święta Pana w Szilo Beniaminici, ukryci w winnicach, porywają sobie żony spośród córek Szilo, gdy wychodzą do tańca. „W one dni nie było króla w Izraelu; każdy, co mu się dobrego zdało to czynił.”"
      it: "Alla festa annuale del Signore a Silo i Beniaminiti, nascosti nelle vigne, rapiscono delle mogli fra le figlie di Silo mentre escono per danzare. «In quel tempo, non v’era re in Israele; ognun facea quel che gli pareva meglio»."
      nl: "Op het jaarlijkse feest van de HEER te Silo vangen de Benjaminieten, verscholen in de wijngaarden, vrouwen uit de dochters van Silo als die naar buiten komen om te dansen. “In die dagen was er geen koning in Israël; een iegelijk deed, wat recht was in zijn ogen.”"
      cs: "Při každoroční slavnosti Hospodinově v Šílu chytají Benjamínovci, ukrytí ve vinicích, manželky z dcer Šílo, když vycházejí tančit. „Těch dnů nebylo krále v Izraeli, ale každý, což se mu vidělo, to činil.“"
      sv: "Vid Herrens årliga fest i Shilo fångar benjaminiterna, gömda i vingårdarna, sig hustrur bland Shilos döttrar när de kommer ut för att dansa. ”På den tiden fanns ingen konung i Israel; var och en gjorde vad honom behagade.”"
      nb: "Ved Herrens årlige fest i Sjilo fanger benjaminittene, skjult i vingårdene, hustruer blant Sjilos døtre når disse kommer ut for å danse. «I de dager var det ingen konge i Israel; hver mann gjorde hvad rett var i hans øine.»"
      tl: "Sa taunang kapistahan ng Panginoon sa Shiloh, ang mga Benjamita, na nagtago sa mga ubasan, ay humuli ng mga asawa mula sa mga anak na babae ng Shiloh nang lumabas ang mga ito upang sumayaw. “Nang mga araw na yao'y walang hari sa Israel: ginagawa ng bawa't isa ang matuwid sa kaniyang sariling mga mata.”"
      da: "Ved Herrens årlige fest i Silo fanger benjaminitterne, skjult i vingårdene, hustruer blandt Silos døtre, da de kommer ud for at danse. »I disse Dage var ingen Konge i Israel; hver gjorde det, som var ret for hans Øjne.«"
      sr: "На годишњем празнику Господњем у Силу Венијаминовци, скривени по виноградима, хватају себи жене из кћери силонских док излазе да играју коло. „У оно време не беше цара у Израиљу; сваки чињаше шта му беше драго.“"
      hu: "Az Úr évenkénti silói ünnepén a benjáminiták a szőlőkben elrejtőzve feleséget ragadnak Siló leányai közül, amikor azok táncolni kijönnek. „Ebben az időben nem volt király Izráelben; azért mindenki azt cselekedte, a mi jónak látszott az ő szemei előtt.”"
      fi: "Herran vuotuisilla juhlilla Silossa benjaminilaiset, viinitarhoihin kätkeytyneinä, siepaavat itselleen vaimot Silon tyttärien joukosta näiden tullessa ulos tanssimaan. ”Siihen aikaan ei ollut kuningasta Israelissa; jokainen teki sitä, mikä hänen omasta mielestään oli oikein.”"
      vi: "Trong lễ hằng năm của Đức Giê-hô-va tại Si-lô, người Bên-gia-min, nấp trong các vườn nho, bắt lấy vợ trong số các con gái Si-lô khi họ ra nhảy múa. “Đang lúc đó, không có vua trong Y-sơ-ra-ên; ai nấy làm theo ý mình lấy làm phải.”"
      ro: "La sărbătoarea anuală a Domnului de la Silo, beniamiții, ascunși în vii, își răpesc soții dintre fiicele din Silo când ies să joace. „În zilele acelea nu erà împărat în Israil, pentru aceea tot omul ce se păreà drept înaintea ochilor lui, făceà.”"
      bg: "На ежегодния Господен празник в Силом вениаминците, скрити в лозята, грабват жени измежду силомските дъщери, когато те излизат да играят. „В онези дни нямаше цар в Израил: всеки правеше що му се виждаше угодно.“"
