      uk: "«Ось він ійде на Аїят»: ассирієць входить у землю Веніяминову з півночі, до давнього Гаю."
      es: "«Vino hasta Ajad»: el asirio entra en Benjamín desde el norte, por el antiguo Hai."
      pt: "“Ele chegou a Aiate”: o assírio entra em Benjamim vindo do norte, no antigo Ai."
      de: "„Er kommt gen Ajath“: Der Assyrer dringt von Norden in Benjamin ein, beim Ai der alten Zeit."
      fr: "« Il marche sur Ajjath » : l’Assyrien entre en Benjamin par le nord, à l’Aï d’autrefois."
      pl: "„Przyciągnie do Ajat”: Asyryjczyk wkracza do ziemi Beniamina od północy, do dawnego Aj."
      it: "«L’Assiro marcia contro Aiath»: l’Assiro entra in Beniamino da nord, presso l’antica Ai."
      nl: "“Hij komt te Ajath”: de Assyriër trekt Benjamin binnen uit het noorden, bij het Ai van weleer."
      cs: "„Přitáhne do Aiat“: Asyřan vstupuje od severu do území Benjamínova, k někdejšímu Aj."
      sv: "”Han kommer över Ajat”: assyriern tågar in i Benjamin från norr, vid det forna Ai."
      nb: "«Han kommer over Ajat»: assyreren går inn i Benjamin fra nord, ved det gamle Ai."
      tl: "“Siya'y dumating sa Ajad”: pumapasok ang Asiryano sa Benjamin mula sa hilaga, sa Hai noong una."
