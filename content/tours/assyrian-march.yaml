      nb: "«i Mikmas lar han sitt tren bli igjen»: trosset blir igjen foran skaret."
      tl: "“sa Michmas inilalapag niya ang kaniyang mga daladalahan”: naiiwan ang mga bagahe bago ang daanan."
  - place: a264254 # Geba
    ref: Isa.10.29
    note:
      en: '"They are gone over the passage": the pass of Michmash, where Jonathan once climbed; at Geba they lodge for the night.'
      ru: "«Проходят теснины»: теснины Михмаса, где когда-то поднимался Ионафан; «в Геве ночлег их»."
      uk: "«Переходять тїснини»: михмаський прохід, де колись видерся Йонатан; у Гебі вони ночують."
      es: "«Pasaron el vado»: el paso de Micmas, por donde Jonatán subió en otro tiempo; en Geba pasan la noche."
      pt: "“Eles atravessaram o desfiladeiro”: o desfiladeiro de Micmás, por onde Jônatas subiu outrora; em Geba passam a noite."
      de: "„Sie ziehen durch den engen Weg“: der Pass von Michmas, wo einst Jonatan hinaufkletterte; in Geba übernachten sie."
      fr: "« Ils passent le défilé » : le défilé de Micmasch, où Jonathan avait jadis grimpé ; à Guéba, ils passent la nuit."
      pl: "„Przejdą bród”: przesmyk Mikmas, gdzie niegdyś wspinał się Jonatan; w Gebie zatrzymują się na nocleg."
      it: "«Valicano il passo»: il passo di Micmas, dove un tempo salì Gionata; a Gheba passano la notte."
      nl: "“Zij trekken door den doorgang”: de pas van Michmas, waar Jonatan eens omhoogklom; te Geba overnachten zij."
      cs: "„Projdou průchod“: michmaský průsmyk, kde kdysi vystoupil Jonatan; v Gebě přenocují."
      sv: "”De draga fram över passet”: Mikmaspasset, där Jonatan en gång klättrade upp; i Geba tar de nattkvarter."
      nb: "«De drar gjennem skaret»: skaret ved Mikmas, hvor Jonatan en gang klatret opp; ved Geba tar de natteleie."
      tl: "“Sila'y nangagdaraan sa landas”: ang daanan ng Michmas, na minsa'y inakyat ni Jonathan; sa Geba sila nagpapalipas ng gabi."
