  - place: afdda14 # Nob
    ref: Isa.10.32
    note:
      en: '"As yet shall he remain at Nob that day": at the priests'' town (1 Sam 22:19), within sight of Jerusalem.'
      ru: "«Еще день простоит он в Нове»: в Номве, городе священников (1 Цар 22:19), в виду Иерусалима."
      uk: "«Ще лиш день простоїть він у Нобі»: у місті священиків (1 Сам 22:19), на виду в Єрусалима."
      es: "«Aún vendrá día cuando reposará en Nob»: en la ciudad de los sacerdotes (1 S 22:19), a la vista de Jerusalén."
      pt: "“Ainda hoje ele fará uma parada em Nobe”: na cidade dos sacerdotes (1Sm 22:19), à vista de Jerusalém."
      de: "„Man bleibt vielleicht einen Tag zu Nob“: in der Priesterstadt (1. Sam 22,19), in Sichtweite von Jerusalem."
      fr: "« Encore un jour de halte à Nob » : à la ville des sacrificateurs (1 S 22:19), en vue de Jérusalem."
      pl: "„Jeszcze przez dzień zastanowiwszy się w Nobie”: w mieście kapłanów (1 Sm 22,19), w zasięgu wzroku Jerozolimy."
      it: "«Oggi stesso sosterà a Nob»: alla città dei sacerdoti (1 Sam 22,19), in vista di Gerusalemme."
      nl: "“Nog een dag blijft hij te Nob”: in de priesterstad (1 Sam. 22:19), in het zicht van Jeruzalem."
      cs: "„Ještě téhož dne zastavě se v Nobe“: ve městě kněží (1 S 22,19), na dohled od Jeruzaléma."
      sv: "”Ännu samma dag står han i Nob”: i prästernas stad (1 Sam 22:19), inom synhåll från Jerusalem."
      nb: "«Allerede samme dag står han i Nob»: ved prestebyen (1 Sam 22,19), innen syne av Jerusalem."
      tl: "“Sa araw ding ito ay titigil siya sa Nob”: sa bayan ng mga saserdote (1 Sam 22:19), na natatanaw na ang Jerusalem."
  - place: a15257a # Jerusalem
    ref: Isa.10.32-Isa.10.34
    note:
      en: 'He shakes his hand against "the mount of the daughter of Zion, the hill of Jerusalem": here the picture ends. The Lord of hosts lops the bough with terror, the high ones of stature are hewn down, and Lebanon falls by a mighty one.'
      ru: "Он «грозит рукою своею горе Сиону, холму Иерусалимскому»: здесь картина обрывается. Господь Саваоф страшною силою сорвёт ветви, величающиеся ростом будут срублены, и Ливан падёт от Всемогущего."
      uk: "Він погрожує рукою «Сионові, узгіррю Ерусалимському»: тут картина закінчується. Господь Саваот обтинає віття жахом, високі на зріст зрубані, і Ліван падає від могутнього."
      es: "Alza su mano «al monte de la hija de Sión, al collado de Jerusalem»: aquí termina la imagen. El Señor de los ejércitos desgaja el ramo con terror, los de gran altura son cortados, y el Líbano cae ante un poderoso."
      pt: "Ele sacode a mão contra “o monte da filha de Sião, a colina de Jerusalém”: aqui termina o quadro. O Senhor dos Exércitos corta o ramo com terror, os de alta estatura são derrubados, e o Líbano cai pela mão de um poderoso."
      de: "Er regt seine Hand „wider den Berg der Tochter Zion, wider den Hügel Jerusalems“: Hier endet das Bild. Der Herr Zebaoth verhaut die Äste mit Macht, die Hochgewachsenen werden gefällt, und der Libanon fällt durch einen Mächtigen."
      fr: "Il menace de sa main « la montagne de la fille de Sion, la colline de Jérusalem » : ici s’arrête le tableau. L’Éternel des armées brise les rameaux avec violence, les plus grands sont coupés, et le Liban tombe sous le Puissant."
      pl: "Wygraża ręką „górze córki Syońskiej, i pagórkowi Jeruzalemskiemu”: tu obraz się kończy. Pan Zastępów obcina gałąź przerażeniem, wysocy wzrostem zostają wycięci, a Liban pada z ręki potężnego."
      it: "Agita il pugno contro «il monte della figlia di Sion, contro la collina di Gerusalemme»: qui il quadro si interrompe. Il Signore degli eserciti stronca i rami con terrore, i più alti sono tagliati, e il Libano cade sotto i colpi del Potente."
      nl: "Hij beweegt zijn hand tegen “den berg der dochter van Sion, den heuvel van Jeruzalem”: hier eindigt het beeld. De HEER der heerscharen kapt de takken af met schrik, de hoog van gestalte worden omgehouwen, en de Libanon valt door een machtige."
      cs: "Hrozí rukou „hoře dcery Sionské, pahrbku Jeruzalémskému“: tady obraz končí. Hospodin zástupů s hrůzou ořezává ratolest, ti, kdo jsou vysokého zrostu, jsou podťati a Libanon padne rukou mocného."
      sv: "Han lyfter sin hand mot ”dottern Sions berg, mot Jerusalems höjd”: här slutar bilden. Herren Sebaot avhugger den lummiga kronan med förskräckande makt, de resliga stammarna fälls, och Libanon faller för den väldige."
      nb: "Han svinger sin hånd mot «Sions datters berg, mot Jerusalem-haugen»: her slutter bildet. Hærskarenes Herre hugger av grenene med forferdelse, de høyvokste blir felt, og Libanon faller for en mektig."
      tl: "Iniuunat niya ang kaniyang kamay laban sa “bundok ng anak na babae ng Sion, na burol ng Jerusalem”: dito nagtatapos ang larawan. Puputulin ng Panginoon ng mga hukbo ang mga sanga nang may kakilakilabot, ibubuwal ang mga mataas sa anyo, at ang Libano ay mawawasak sa pamamagitan ng isang makapangyarihan."
