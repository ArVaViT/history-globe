    note:
      en: "Rhegium."
      ru: "Ригия."
      uk: "Регій."
      es: "Regio."
      pt: "Régio."
      de: "Rhegion."
      fr: "Rhegium."
      pl: "Regium."
      it: "Reggio."
      nl: "Regium."
      cs: "Regium."
      sv: "Rhegion."
      nb: "Regium."
      tl: "Regio."
      da: "Regium."
      sr: "Ригија."
      hu: "Régium."
      fi: "Region."
      vi: "Rê-ghi-um."
      ro: "Regium."
      bg: "Ригия."
    story:
      en: "From there they made a circuit and came to Rhegium, today Reggio Calabria, on the Italian shore of the Strait of Messina. After one day a south wind sprang up."
      ru: "Оттуда, обогнув берег, они прибыли в Ригию, ныне Реджо-Калабрия, на италийском берегу Мессинского пролива. Через день подул южный ветер."
      uk: "Звідти, обігнувши берег, вони прибули до Регія, нині Реджо-Калабрія, на італійському березі Мессінської протоки. Через день повіяв південний вітер."
      es: "De allí, costeando, llegaron a Regio, hoy Reggio Calabria, en la orilla italiana del estrecho de Mesina. Al cabo de un día se levantó un viento del sur."
      pt: "Dali, contornando a costa, chegaram a Régio, hoje Reggio Calabria, na margem italiana do estreito de Messina. Depois de um dia começou a soprar um vento sul."
      de: "Von dort fuhren sie im Bogen weiter und kamen nach Rhegion, dem heutigen Reggio Calabria, an der italienischen Küste der Straße von Messina. Nach einem Tag kam Südwind auf."
      fr: "De là, en suivant la côte, ils arrivèrent à Rhegium, aujourd’hui Reggio de Calabre, sur la rive italienne du détroit de Messine. Au bout d’un jour, un vent du sud se leva."
      pl: "Stamtąd, płynąc okrężną drogą, przybyli do Regium, dziś Reggio Calabria, na italskim brzegu Cieśniny Mesyńskiej. Po jednym dniu powiał wiatr z południa."
      it: "Di là, costeggiando, giunsero a Reggio, oggi Reggio Calabria, sulla sponda italiana dello stretto di Messina. Dopo un giorno si levò un vento del sud."
      nl: "Vandaar voeren zij met een omweg en kwamen te Regium, het huidige Reggio Calabria, aan de Italiaanse kust van de Straat van Messina. Na één dag stak er een zuidenwind op."
      cs: "Odtud pluli oklikou a přišli do Regia, dnešního Reggia Calabria, na italském břehu Messinské úžiny. Po jednom dni zavanul jižní vítr."
      sv: "Därifrån seglade de runt och kom till Rhegion, i dag Reggio Calabria, på den italienska stranden av Messinasundet. Efter en dag blåste en sydlig vind upp."
      nb: "Derfra seilte de i en bue og kom til Regium, i dag Reggio Calabria, på den italienske siden av Messinastredet. Etter én dag blåste det opp en sønnavind."
      tl: "Mula roon ay nagsiligid sila at dumating sa Regio, na ngayo'y Reggio Calabria, sa baybaying Italiano ng Kipot ng Messina. Pagkaraan ng isang araw ay humihip ang hanging timugan."
      da: "Derfra sejlede de i en bue og kom til Regium, i dag Reggio Calabria, på den italienske side af Messinastrædet. Efter en dag blæste der en søndenvind op."
      sr: "Одатле су обишли и дошли у Ригију, данас Ређо ди Калабрију, на италијанској обали Месинског мореуза. После једног дана дунуо је јужни ветар."
      hu: "Onnan körbehajózva Régiumba, a mai Reggio Calabriába érkeztek, a Messinai-szoros itáliai partján. Egy nap múlva déli szél támadt."
      fi: "Sieltä he kiersivät ja tulivat Regioniin, nykyiseen Reggio Calabriaan, Messinan salmen Italian puoleiselle rannalle. Yhden päivän kuluttua alkoi puhaltaa etelätuuli."
      vi: "Từ đó họ đi vòng và đến Rê-ghi-um, nay là Reggio Calabria, trên bờ biển Y-ta-li của eo biển Messina. Sau một ngày, gió nam nổi lên."
      ro: "De acolo au ocolit și au ajuns la Regium, astăzi Reggio Calabria, pe țărmul italian al strâmtorii Messina. După o zi a început să sufle vântul de miazăzi."
      bg: "Оттам заобиколиха и стигнаха до Ригия, днес Реджо Калабрия, на италианския бряг на Месинския проток. След един ден подухна южен вятър."
