# Paul's voyage to Rome, Acts 27:1–28:16. Named harbours and islands in the order of the text.
# The identification of Melita with Malta, and the exact shipwreck site, are debated.
# Year approximate: AD 60 stands for the arrival in Rome on the usual chronology (the ship
# leaves Crete after "the fast", 27:9, in the autumn of 59, and winters three months on
# Melita, 28:11). Source for the stop list: research note 16, section 4.4.
id: paul-rome
title:
  en: "Paul's voyage to Rome"
  ru: "Путь Павла в Рим"
  uk: "Плавання Павла до Рима"
  es: "El viaje de Pablo a Roma"
  pt: "A viagem de Paulo a Roma"
  de: "Die Reise des Paulus nach Rom"
  fr: "Le voyage de Paul vers Rome"
year: "AD 60"
people: ["Paul@Act.7.58-2Pe"]
approximate: true
stops:
  - place: a58735e
    # Caesarea is named in 25:13-24, where Paul is held; 27:1-2 sails from there
    # without naming it (listed in build-content as a stop named by its context).
    ref: Acts.27.1-Acts.27.2
    note:
      en: "Held at Caesarea, Paul sails for Italy as a prisoner."
      ru: "Из Кесарии, где его держали под стражей, Павел отплывает в Италию."
      uk: "Утримуваний у Кесарії, Павло відпливає до Італії як в’язень."
      es: "Retenido en Cesarea, Pablo zarpa para Italia como preso."
      pt: "Detido em Cesareia, Paulo navega para a Itália como prisioneiro."
      de: "In Caesarea in Haft, segelt Paulus als Gefangener nach Italien."
      fr: "Détenu à Césarée, Paul s’embarque pour l’Italie comme prisonnier."
  - place: a98e4d7
    ref: Acts.27.3
    by: sea
    note:
      en: "Julius lets Paul visit friends."
      ru: "Юлий позволяет Павлу сходить к друзьям."
      uk: "Юлій дозволяє Павлові відвідати друзів."
      es: "Julio permite a Pablo visitar a sus amigos."
      pt: "Júlio permite que Paulo visite amigos."
      de: "Julius erlaubt Paulus, Freunde zu besuchen."
      fr: "Julius permet à Paul d’aller chez des amis."
  - place: aa4b3e2
    ref: Acts.27.5-Acts.27.6
    by: sea
    note:
      en: "Transfer to a ship of Alexandria."
      ru: "Пересадка на александрийский корабль."
      uk: "Пересадка на александрійський корабель."
      es: "Trasbordo a una nave de Alejandría."
      pt: "Transferência para um navio de Alexandria."
      de: "Umstieg auf ein Schiff aus Alexandria."
      fr: "Transfert sur un navire d’Alexandrie."
  - place: ab793ce
    ref: Acts.27.7
    by: sea
    note:
      en: "Slowly off Cnidus."
      ru: "Медленное плавание мимо Книда."
      uk: "Повільно біля Кніда."
      es: "Avanzan despacio frente a Gnido."
      pt: "Lentamente diante de Cnido."
      de: "Langsam vor Knidos."
      fr: "Navigation lente au large de Cnide."
  - place: a1c44ea
    ref: Acts.27.7
    by: sea
    note:
      en: "Under the lee of Crete at Salmone."
      ru: "Под Критом у Салмоны."
      uk: "Під захистом Криту біля Салмони."
      es: "Al abrigo de Creta, junto a Salmona."
      pt: "Ao abrigo de Creta, em Salmona."
      de: "Im Schutz Kretas bei Salmone."
      fr: "À l’abri de la Crète, vers Salmone."
  - place: aae626a
    ref: Acts.27.8-Acts.27.12
    by: sea
    note:
      en: 'Fair Havens; Paul warns that "this voyage will be with hurt and much damage, not only of the lading and ship, but also of our lives."'
      ru: "Хорошие Пристани; Павел предупреждает, что «плавание будет с затруднениями и с большим вредом не только для груза и корабля, но и для нашей жизни»."
      uk: "Добрі Пристані; Павло застерігає: «з утратою і з великою шкодою, не тільки для тягару і для статку, та й для душ наших буде плаваннє»."
      es: "Buenos Puertos; Pablo advierte que «con trabajo y mucho daño, no sólo de la cargazón y de la nave, mas aun de nuestras personas, habrá de ser la navegación»."
      pt: "Bons Portos; Paulo adverte que “a viagem trará prejuízo e grande perda, não só da carga e do navio, mas também de nossas vidas.”"
      de: "Schönhafen; Paulus warnt: „ich sehe, daß die Schiffahrt will mit Leid und großem Schaden ergehen, nicht allein der Last und des Schiffes sondern auch unsers Lebens“."
      fr: "Beaux-Ports ; Paul avertit : « la navigation ne se fera pas sans péril et sans beaucoup de dommage, non seulement pour la cargaison et pour le navire, mais encore pour nos personnes »."
  - place: aca2b0a
    ref: Acts.27.14-Acts.27.17
    by: sea
    note:
      en: "The tempestuous wind Euroclydon drives the ship past Cauda."
      ru: "Бурный ветер эвроклидон несёт корабль мимо Клавды."
      uk: "Бурхливий вітер Евроклідон несе корабель повз Клавду."
      es: "El viento tempestuoso Euroclidón arrastra la nave más allá de Clauda."
      pt: "O vento tempestuoso Euroclidão arrasta o navio além de Cauda."
      de: "Der stürmische Wind Euroklydon treibt das Schiff an Kauda vorbei."
      fr: "Le vent impétueux Euraquilon emporte le navire au-delà de Clauda."
