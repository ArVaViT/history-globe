    sailed: { days: 1, ref: Acts.28.13 }
    note:
      en: "Seven days with the brothers."
      ru: "Семь дней у братьев."
      uk: "Сім днів з братами."
      es: "Siete días con los hermanos."
      pt: "Sete dias com os irmãos."
      de: "Sieben Tage bei den Brüdern."
      fr: "Sept jours avec les frères."
      pl: "Siedem dni z braćmi."
      it: "Sette giorni con i fratelli."
      nl: "Zeven dagen bij de broeders."
      cs: "Sedm dní s bratřími."
      sv: "Sju dagar hos bröderna."
      nb: "Sju dager med brødrene."
      tl: "Pitong araw na kasama ang mga kapatid."
      da: "Syv dage hos brødrene."
      sr: "Седам дана с браћом."
      hu: "Hét nap a testvéreknél."
      fi: "Seitsemän päivää veljien luona."
      vi: "Bảy ngày với anh em."
      ro: "Șapte zile cu frații."
      bg: "Седем дни с братята."
    story:
      en: "The next day they came to Puteoli, today Pozzuoli, on the Bay of Naples. There they found brothers and were invited to stay with them seven days, and so they came on towards Rome."
      ru: "На следующий день они прибыли в Путеол, ныне Поццуоли, на Неаполитанском заливе. Там они нашли братьев, и те упросили их пробыть у них семь дней, а затем они направились к Риму."
      uk: "Наступного дня вони прибули до Путеол, нині Поццуолі, на Неаполітанській затоці. Там вони знайшли братів, і ті впросили їх пробути в них сім днів, а потім вони рушили до Рима."
      es: "Al día siguiente llegaron a Puteoli, hoy Pozzuoli, en el golfo de Nápoles. Allí encontraron hermanos y fueron invitados a quedarse con ellos siete días, y así se dirigieron a Roma."
      pt: "No dia seguinte chegaram a Putéoli, hoje Pozzuoli, no golfo de Nápoles. Ali encontraram irmãos e foram convidados a ficar com eles sete dias, e assim seguiram para Roma."
      de: "Am nächsten Tag kamen sie nach Puteoli, dem heutigen Pozzuoli, am Golf von Neapel. Dort fanden sie Brüder und wurden gebeten, sieben Tage bei ihnen zu bleiben, und so kamen sie in Richtung Rom."
      fr: "Le lendemain, ils arrivèrent à Pouzzoles, l’actuelle Pozzuoli, sur le golfe de Naples. Ils y trouvèrent des frères et furent invités à rester sept jours avec eux, et c’est ainsi qu’ils s’acheminèrent vers Rome."
      pl: "Następnego dnia przybyli do Puteoli, dziś Pozzuoli, nad Zatoką Neapolitańską. Znaleźli tam braci i zostali zaproszeni, by pozostać u nich siedem dni, i tak ruszyli w stronę Rzymu."
      it: "Il giorno seguente giunsero a Pozzuoli, sul golfo di Napoli. Lì trovarono dei fratelli e furono invitati a rimanere con loro sette giorni, e così si avviarono verso Roma."
      nl: "De volgende dag kwamen zij te Puteoli, het huidige Pozzuoli, aan de Golf van Napels. Daar vonden zij broeders en werden uitgenodigd zeven dagen bij hen te blijven, en zo kwamen zij op weg naar Rome."
      cs: "Druhý den přišli do Puteolí, dnešního Pozzuoli, na Neapolském zálivu. Nalezli tam bratry, kteří je pozvali, aby u nich zůstali sedm dní, a tak se vydali k Římu."
      sv: "Nästa dag kom de till Puteoli, i dag Pozzuoli, vid Neapelbukten. Där fann de bröder och blev ombedda att stanna hos dem i sju dagar, och så kom de på väg mot Rom."
      nb: "Neste dag kom de til Puteoli, i dag Pozzuoli, ved Napolibukta. Der fant de brødre og ble bedt om å bli hos dem i sju dager, og så kom de på vei mot Roma."
      tl: "Nang kinabukasan ay dumating sila sa Puteoli, na ngayo'y Pozzuoli, sa Look ng Naples. Doon ay nakasumpong sila ng mga kapatid at pinakiusapang tumira sa kanila nang pitong araw, at sa gayon ay nagtungo sila sa Roma."
      da: "Næste dag kom de til Puteoli, i dag Pozzuoli, ved Napolibugten. Der fandt de brødre og blev bedt om at blive syv dage hos dem, og så kom de videre mod Rom."
      sr: "Сутрадан су дошли у Путеоле, данас Поцуоли, на Напуљском заливу. Тамо су нашли браћу и били позвани да остану код њих седам дана, и тако су кренули према Риму."
      hu: "Másnap Puteoliba, a mai Pozzuoliba értek, a Nápolyi-öböl partján. Ott testvérekre találtak, akik kérték őket, hogy maradjanak náluk hét napig, és így indultak Róma felé."
      fi: "Seuraavana päivänä he tulivat Puteoliin, nykyiseen Pozzuoliin, Napolinlahden rannalle. Siellä he tapasivat veljiä, jotka pyysivät heitä viipymään luonaan seitsemän päivää, ja niin he jatkoivat kohti Roomaa."
      vi: "Ngày hôm sau họ đến Bu-xô-lơ, nay là Pozzuoli, trên vịnh Naples. Tại đó họ gặp anh em và được mời ở lại với họ bảy ngày, rồi cứ thế họ tiến về Rô-ma."
      ro: "A doua zi au ajuns la Puteoli, astăzi Pozzuoli, în Golful Neapole. Acolo au găsit frați și au fost rugați să rămână la ei șapte zile, și așa au pornit spre Roma."
      bg: "На следващия ден стигнаха до Потиоли, днес Поцуоли, на Неаполитанския залив. Там намериха братя и бяха поканени да останат при тях седем дни, и така продължиха към Рим."
  - place: a121d5e
    ref: Acts.28.15
    note:
      en: "Believers come out to meet Paul."
      ru: "Братья выходят навстречу Павлу."
      uk: "Віруючі виходять назустріч Павлові."
      es: "Los creyentes salen al encuentro de Pablo."
      pt: "Os crentes saem ao encontro de Paulo."
      de: "Gläubige kommen Paulus entgegen."
      fr: "Des croyants viennent à la rencontre de Paul."
      pl: "Wierzący wychodzą naprzeciw Pawłowi."
      it: "I credenti escono incontro a Paolo."
      nl: "Gelovigen komen Paulus tegemoet."
      cs: "Věřící vycházejí Pavlovi vstříc."
      sv: "De troende kommer ut för att möta Paulus."
      nb: "De troende kommer ut for å møte Paulus."
      tl: "Lumalabas ang mga mananampalataya upang salubungin si Pablo."
      da: "Troende kommer Paulus i møde."
      sr: "Верници излазе у сусрет Павлу."
      hu: "A hívők Pál elé jönnek."
      fi: "Uskovat tulevat Paavalia vastaan."
      vi: "Các tín hữu ra đón Phao-lô."
      ro: "Credincioșii ies în întâmpinarea lui Pavel."
      bg: "Вярващите излизат да посрещнат Павел."
    story:
      en: "The brothers at Rome heard of them and came out to meet them as far as the Forum of Appius, a market town on the Via Appia 43 Roman miles from Rome, and the Three Taverns; when Paul saw them he thanked God and took courage."
      ru: "Братья в Риме, услышав о них, вышли им навстречу до Аппиевой площади, торгового городка на Аппиевой дороге в 43 римских милях от Рима, и до Трёх Гостиниц; увидев их, Павел возблагодарил Бога и ободрился."
      uk: "Брати в Римі, почувши про них, вийшли їм назустріч аж до Аппієвої площі, торговельного містечка на Аппієвій дорозі за 43 римські милі від Рима, і до Трьох Гостинниць; побачивши їх, Павло подякував Богові й набрався відваги."
      es: "Los hermanos de Roma oyeron hablar de ellos y salieron a recibirlos hasta el Foro de Apio, una población de mercado en la Vía Apia a 43 millas romanas de Roma, y las Tres Tabernas; al verlos, Pablo dio gracias a Dios y cobró ánimo."
      pt: "Os irmãos de Roma ouviram falar deles e vieram ao seu encontro até o Foro de Ápio, uma vila de mercado na Via Ápia a 43 milhas romanas de Roma, e as Três Vendas; ao vê-los, Paulo deu graças a Deus e sentiu-se encorajado."
      de: "Die Brüder in Rom hörten von ihnen und kamen ihnen entgegen bis Forum Appii, einem Marktflecken an der Via Appia 43 römische Meilen von Rom, und bis Tres Tabernae; als Paulus sie sah, dankte er Gott und fasste Mut."
      fr: "Les frères de Rome entendirent parler d’eux et vinrent à leur rencontre jusqu’au Forum d’Appius, bourg de marché sur la via Appia à 43 milles romains de Rome, et aux Trois Tavernes ; en les voyant, Paul rendit grâces à Dieu et prit courage."
      pl: "Bracia w Rzymie usłyszeli o nich i wyszli im naprzeciw aż do Forum Appiusza, osady targowej przy Via Appia, 43 mile rzymskie od Rzymu, i do Trzech Gospód; Paweł, ujrzawszy ich, podziękował Bogu i nabrał otuchy."
      it: "I fratelli di Roma, avute notizie di loro, vennero loro incontro fino al Foro di Appio, borgo di mercato sulla via Appia a 43 miglia romane da Roma, e alle Tre Taverne; vedendoli, Paolo rese grazie a Dio e prese animo."
      nl: "De broeders te Rome hoorden van hen en kwamen hun tegemoet tot Appiusforum, een marktplaats aan de Via Appia op 43 Romeinse mijl van Rome, en Tres Tabernae; toen Paulus hen zag, dankte hij God en vatte moed."
      cs: "Bratři v Římě se o nich dozvěděli a vyšli jim naproti až k Appiovu tržišti, trhové osadě na Via Appia 43 římských mil od Říma, a k Třem hostincům; když je Pavel uviděl, poděkoval Bohu a nabyl odvahy."
      sv: "Bröderna i Rom fick höra om dem och kom ut för att möta dem ända till Forum Appii, en köpstad vid Via Appia 43 romerska mil från Rom, och Tres Taberne; när Paulus såg dem tackade han Gud och fick nytt mod."
      nb: "Brødrene i Roma hørte om dem og kom ut for å møte dem helt til Forum Appii, en markedsby ved Via Appia 43 romerske mil fra Roma, og Tres Tabernæ; da Paulus så dem, takket han Gud og fattet mot."
      tl: "Nabalitaan sila ng mga kapatid sa Roma at lumabas upang salubungin sila hanggang sa Pamilihan ng Appio, isang bayang pamilihan sa Via Appia na 43 milyang Romano mula sa Roma, at sa Tatlong Bahay-Tuluyan; nang makita sila ni Pablo, nagpasalamat siya sa Diyos at lumakas ang loob."
      da: "Brødrene i Rom hørte om dem og kom dem i møde helt til Forum Appii, en markedsby ved Via Appia 43 romerske mil fra Rom, og Tres Tabernæ; da Paulus så dem, takkede han Gud og fattede mod."
      sr: "Браћа у Риму чула су за њих и изашла им у сусрет све до Апијевог трга, пијачног места на Апијевом путу 43 римске миље од Рима, и до Три гостионице; кад их је Павле видео, захвалио је Богу и охрабрио се."
      hu: "A római testvérek hallottak róluk, és eléjük jöttek egészen Appius Fórumáig, egy mezővárosig a Via Appián, Rómától 43 római mérföldre, és a Három Fogadóig; amikor Pál meglátta őket, hálát adott Istennek, és bátorságot merített."
      fi: "Rooman veljet kuulivat heistä ja tulivat heitä vastaan Appiuksen torille asti, Via Appian varrella olevaan kauppalaan 43 roomalaisen mailin päässä Roomasta, ja Tres Tabernaeen; heidät nähdessään Paavali kiitti Jumalaa ja sai rohkeutta."
      vi: "Anh em ở Rô-ma nghe tin về họ, bèn ra đón họ đến tận Chợ Áp-bi-út, một thị trấn chợ trên Via Appia cách Rô-ma 43 dặm La Mã, và Ba Quán; khi thấy họ, Phao-lô cảm tạ Đức Chúa Trời và vững chí."
      ro: "Frații din Roma au auzit de ei și le-au ieșit în întâmpinare până la Târgul lui Apiu, o așezare de târg pe Via Appia, la 43 de mile romane de Roma, și până la Trei Taverne; când i-a văzut, Pavel i-a mulțumit lui Dumnezeu și a prins curaj."
      bg: "Братята в Рим чуха за тях и излязоха да ги посрещнат чак до Апиев пазар — пазарен град на Виа Апия на 43 римски мили от Рим — и до Трите гостилници; като ги видя, Павел благодари на Бога и се ободри."
  - place: afc8e7a
    ref: Acts.28.16
    note:
      en: "Rome."
      ru: "Рим."
      uk: "Рим."
      es: "Roma."
      pt: "Roma."
      de: "Rom."
      fr: "Rome."
      pl: "Rzym."
      it: "Roma."
      nl: "Rome."
      cs: "Řím."
      sv: "Rom."
      nb: "Roma."
      tl: "Roma."
      da: "Rom."
      sr: "Рим."
      hu: "Róma."
      fi: "Rooma."
      vi: "Rô-ma."
      ro: "Roma."
      bg: "Рим."
    story:
      en: "When they came to Rome, Paul was allowed to live by himself, with a soldier to guard him; the Received Text adds that the centurion first handed the prisoners over to the captain of the guard."
      ru: "Когда они пришли в Рим, Павлу позволили жить отдельно с воином, который стерёг его; Общепринятый текст, которому следует Синодальный перевод, добавляет, что сотник сначала передал узников начальнику стражи."
      uk: "Коли вони прибули до Рима, Павлові дозволили жити окремо з вояком, що його стеріг; Загальноприйнятий текст, якого дотримується переклад Куліша, додає, що сотник спершу передав в’язнів начальникові варти."
      es: "Cuando llegaron a Roma, a Pablo se le permitió vivir aparte, con un soldado que lo custodiaba; el Textus Receptus, al que sigue la Reina-Valera, añade que el centurión entregó primero los presos al jefe de la guardia."
      pt: "Quando chegaram a Roma, Paulo recebeu permissão para morar por conta própria, com um soldado que o guardava; o Texto Recebido (Textus Receptus) acrescenta que o centurião entregou primeiro os prisioneiros ao capitão da guarda."
      de: "Als sie nach Rom kamen, wurde Paulus erlaubt, für sich allein zu wohnen, mit einem Soldaten, der ihn bewachte; der Textus receptus, dem die Lutherbibel folgt, fügt hinzu, dass der Hauptmann zuvor die Gefangenen dem Befehlshaber der Wache übergab."
      fr: "Quand ils arrivèrent à Rome, Paul fut autorisé à demeurer en son particulier, avec un soldat qui le gardait ; le Texte reçu ajoute que le centenier remit d’abord les prisonniers au chef de la garde."
      pl: "Gdy przybyli do Rzymu, Pawłowi pozwolono mieszkać osobno z żołnierzem, który go pilnował; Textus Receptus, za którym idzie Biblia gdańska, dodaje, że setnik najpierw przekazał więźniów dowódcy straży."
      it: "Quando giunsero a Roma, a Paolo fu concesso di abitare per conto suo, con un soldato che lo custodiva; il Textus Receptus aggiunge che il centurione consegnò prima i prigionieri al capo della guardia."
      nl: "Toen zij te Rome kwamen, werd Paulus toegestaan op zichzelf te wonen, met een soldaat die hem bewaakte; de Textus Receptus, die de Statenvertaling volgt, voegt eraan toe dat de hoofdman eerst de gevangenen overdroeg aan de overste van de wacht."
      cs: "Když přišli do Říma, bylo Pavlovi dovoleno bydlet o samotě s vojákem, který ho střežil; Textus receptus, který sleduje Bible kralická, dodává, že setník nejprve předal vězně veliteli stráže."
      sv: "När de kom till Rom fick Paulus bo för sig själv, med en soldat som bevakade honom; Textus receptus tillägger att hövitsmannen först överlämnade fångarna åt befälhavaren för vakten."
      nb: "Da de kom til Roma, fikk Paulus bo for seg selv, med en soldat som voktet ham; Textus receptus, som Bibelen 1930 følger, legger til at høvedsmannen først overgav fangene til høvdingen for livvakten."
      tl: "Nang dumating sila sa Roma, pinahintulutan si Pablo na mamahay nang mag-isa, kasama ng isang kawal na nagbabantay sa kaniya; idinadagdag ng Textus Receptus na ibinigay muna ng senturion ang mga bilanggo sa kapitan ng bantay."
      da: "Da de kom til Rom, fik Paulus lov til at bo for sig selv med en soldat, der bevogtede ham; Textus Receptus, som den danske oversættelse af Det Nye Testamente fra 1907 følger, tilføjer, at høvedsmanden først overgav fangerne til høvdingen for livvagten."
      sr: "Кад су стигли у Рим, Павлу је допуштено да живи засебно, с војником који га је чувао; Примљени текст, који следи и превод Даничић–Караџић, додаје да је стотник најпре предао сужње заповеднику страже."
      hu: "Amikor Rómába értek, Pálnak megengedték, hogy külön lakjon az őt őrző katonával; a Textus Receptus, amelyet a Károli-fordítás is követ, hozzáteszi, hogy a százados előbb átadta a foglyokat a testőrség parancsnokának."
      fi: "Kun he tulivat Roomaan, Paavalin sallittiin asua erikseen häntä vartioivan sotilaan kanssa; Textus Receptus lisää, että sadanpäämies luovutti ensin vangit henkivartioston päällikölle."
      vi: "Khi họ đến Rô-ma, Phao-lô được phép ở riêng, có một người lính canh giữ; Textus Receptus thêm rằng trước đó thầy đội đã giao các tù nhân cho viên chỉ huy đội cận vệ."
      ro: "Când au ajuns la Roma, lui Pavel i s-a îngăduit să locuiască deosebit, cu un ostaș care să-l păzească; Textus Receptus, pe care îl urmează Biblia românească din 1914, adaugă că sutașul i-a predat mai întâi pe prizonieri comandantului gărzii."
      bg: "Когато стигнаха в Рим, на Павел беше позволено да живее отделно, с един войник, който да го пази; Общоприетият текст, който следва и Цариградската Библия, добавя, че стотникът първо предал затворниците на началника на стражата."
sources:
  - "J. Smith, The Voyage and Shipwreck of St. Paul (1848; 4th ed. 1880)"
