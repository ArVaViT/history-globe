      uk: "Оскільки вітер був проти них, вони попливли під захистом Криту, біля Салмони."
      es: "Con el viento en contra, navegaron al abrigo de Creta, frente a Salmona."
      pt: "Com o vento contra eles, navegaram sob o abrigo de Creta, diante de Salmona."
      de: "Da der Wind ihnen entgegenstand, segelten sie in den Schutz Kretas, bei Salmone."
      fr: "Le vent leur étant contraire, ils passèrent à l’abri de la Crète, du côté de Salmone."
      pl: "Przy przeciwnym wietrze popłynęli pod osłoną Krety, obok Salmone."
      it: "Con il vento contrario, navigarono al riparo di Creta, di fronte a Salmone."
      nl: "Omdat de wind tegen was, voeren zij onder de wal van Kreta, tegenover Salmone."
      cs: "Protože vítr byl proti nim, pluli v závětří Kréty u Salmóné."
      sv: "Med vinden emot sig seglade de i lä av Kreta, utanför Salmone."
