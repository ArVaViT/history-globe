    note:
      en: "Slowly off Cnidus."
      ru: "Медленное плавание мимо Книда."
      uk: "Повільно біля Кніда."
      es: "Avanzan despacio frente a Gnido."
      pt: "Lentamente diante de Cnido."
      de: "Langsam vor Knidos."
      fr: "Navigation lente au large de Cnide."
      pl: "Powoli koło Knidos."
      it: "Lentamente davanti a Cnido."
      nl: "Langzaam voorbij Knidus."
      cs: "Pomalu u Knidu."
      sv: "Långsamt fram utanför Knidos."
      nb: "Langsomt ut for Knidos."
      tl: "Marahang paglalakbay sa tapat ng Gnido."
      da: "Langsomt ud for Knidos."
      sr: "Споро код Книда."
      hu: "Lassan haladva Knidosz előtt."
      fi: "Hitaasti Knidoksen edustalla."
      vi: "Đi chậm ngang Cơ-nít."
      ro: "Cu greu în dreptul Cnidului."
      bg: "Бавно плаване край Книд."
    story:
      en: "For many days they sailed slowly and only with difficulty came off Cnidus, at the tip of the long peninsula of Caria; the wind did not allow them to go on."
      ru: "Много дней они плыли медленно и с трудом поравнялись с Книдом, на оконечности длинного полуострова Карии; ветер не позволил им идти дальше."
      uk: "Багато днів вони пливли повільно й ледве порівнялися з Кнідом, на краю довгого півострова Карії; вітер не дав їм плисти далі."
      es: "Durante muchos días navegaron despacio y a duras penas llegaron frente a Gnido, en la punta de la larga península de Caria; el viento no les permitía seguir."
      pt: "Durante muitos dias navegaram lentamente e só com dificuldade chegaram diante de Cnido, na ponta da longa península da Cária; o vento não lhes permitia avançar."
      de: "Viele Tage lang segelten sie langsam und kamen nur mit Mühe auf die Höhe von Knidos an der Spitze der langen Halbinsel Kariens; der Wind ließ sie nicht weiterfahren."
      fr: "Pendant plusieurs jours, ils naviguèrent lentement et n’arrivèrent qu’avec peine à la hauteur de Cnide, à la pointe de la longue péninsule de Carie ; le vent ne leur permit pas d’aller plus loin."
      pl: "Przez wiele dni płynęli powoli i z trudem dotarli na wysokość Knidos, na krańcu długiego półwyspu Karii; wiatr nie pozwalał im płynąć dalej."
      it: "Per molti giorni navigarono lentamente e solo a fatica giunsero di fronte a Cnido, sulla punta della lunga penisola della Caria; il vento non permise loro di proseguire."
      nl: "Vele dagen lang voeren zij langzaam en kwamen slechts met moeite ter hoogte van Knidus, aan de punt van het lange schiereiland van Carië; de wind liet niet toe dat zij verder voeren."
      cs: "Mnoho dní pluli pomalu a jen s obtížemi se dostali ke Knidu na konci dlouhého poloostrova Kárie; vítr jim nedovolil plout dál."
      sv: "Under många dagar seglade de långsamt och kom bara med svårighet i höjd med Knidos, vid spetsen av Kariens långa halvö; vinden tillät dem inte att fortsätta."
      nb: "I mange dager seilte de langsomt og kom bare med nød og neppe ut for Knidos, på spissen av den lange halvøya i Karia; vinden lot dem ikke komme videre."
      tl: "Sa loob ng maraming araw ay marahan silang naglayag at may kahirapang nakarating sa tapat ng Gnido, sa dulo ng mahabang tangway ng Caria; hindi sila tinulutan ng hangin na makasulong pa."
      da: "I mange dage sejlede de langsomt og nåede kun med nød og næppe ud for Knidos ved spidsen af Kariens lange halvø; vinden tillod dem ikke at komme videre."
      sr: "Много дана пловили су споро и тек с муком стигли према Книду, на врху дугог полуострва Карије; ветар им није дао да иду даље."
      hu: "Sok napon át lassan hajóztak, és csak nehezen jutottak Knidosz elé, Kária hosszú félszigetének csúcsára; a szél nem engedte, hogy továbbmenjenek."
      fi: "Monta päivää he purjehtivat hitaasti ja pääsivät vain vaivoin Knidoksen kohdalle Kaarian pitkän niemimaan kärkeen; tuuli ei sallinut heidän jatkaa."
      vi: "Trong nhiều ngày tàu chạy chậm và khó nhọc lắm mới đến ngang Cơ-nít, ở mũi bán đảo dài của Caria; gió không cho họ đi tiếp."
      ro: "Multe zile au navigat încet și abia au ajuns în dreptul Cnidului, la vârful lungii peninsule a Cariei; vântul nu i-a lăsat să meargă mai departe."
      bg: "Много дни плаваха бавно и едва стигнаха срещу Книд, на върха на дългия полуостров на Кария; вятърът не им позволяваше да продължат."
