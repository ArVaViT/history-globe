      hu: "Mivel a szél ellenük fújt, Kréta szélvédett oldalán hajóztak, Szalmóné előtt."
      fi: "Vastatuulen vuoksi he purjehtivat Kreetan suojaan Salmonen kohdalla."
      vi: "Vì ngược gió, họ đi men theo phía khuất gió của Cơ-rết, ngang Sa-môn."
      ro: "Cu vântul împotrivă, au navigat la adăpostul Cretei, în dreptul Salmonei."
