    note:
      en: "Three days at Syracuse."
      ru: "Три дня в Сиракузах."
      uk: "Три дні в Сиракузах."
      es: "Tres días en Siracusa."
      pt: "Três dias em Siracusa."
      de: "Drei Tage in Syrakus."
      fr: "Trois jours à Syracuse."
      pl: "Trzy dni w Syrakuzach."
      it: "Tre giorni a Siracusa."
      nl: "Drie dagen te Syracuse."
      cs: "Tři dny v Syrakusách."
      sv: "Tre dagar i Syrakusa."
      nb: "Tre dager i Syrakus."
      tl: "Tatlong araw sa Siracusa."
      da: "Tre dage i Syrakus."
      sr: "Три дана у Сиракузи."
      hu: "Három nap Szirakúzában."
      fi: "Kolme päivää Syrakusassa."
      vi: "Ba ngày tại Sy-ra-cu-sơ."
      ro: "Trei zile la Siracuza."
      bg: "Три дни в Сиракуза."
    story:
      en: "They put in at Syracuse, the old Corinthian colony on the east coast of Sicily and then a Roman colony, and stayed there three days."
      ru: "Они пристали к Сиракузам, древней коринфской колонии на восточном побережье Сицилии, к тому времени римской колонии, и пробыли там три дня."
      uk: "Вони пристали до Сиракуз, давньої коринфської колонії на східному узбережжі Сицилії, на той час римської колонії, і пробули там три дні."
      es: "Tocaron puerto en Siracusa, la antigua colonia corintia de la costa oriental de Sicilia y entonces colonia romana, y se quedaron allí tres días."
      pt: "Aportaram em Siracusa, a antiga colônia coríntia na costa oriental da Sicília e então colônia romana, e ficaram ali três dias."
      de: "Sie legten in Syrakus an, der alten korinthischen Kolonie an der Ostküste Siziliens und damals römischen Kolonie, und blieben dort drei Tage."
      fr: "Ils abordèrent à Syracuse, la vieille colonie corinthienne de la côte est de la Sicile, alors colonie romaine, et y restèrent trois jours."
      pl: "Zawinęli do Syrakuz, starej kolonii korynckiej na wschodnim wybrzeżu Sycylii, a wówczas kolonii rzymskiej, i pozostali tam trzy dni."
      it: "Approdarono a Siracusa, l’antica colonia corinzia sulla costa orientale della Sicilia e allora colonia romana, e vi rimasero tre giorni."
      nl: "Zij legden aan te Syracuse, de oude Korinthische kolonie aan de oostkust van Sicilië en toen een Romeinse kolonie, en bleven daar drie dagen."
      cs: "Přistáli v Syrakusách, staré korintské osadě na východním pobřeží Sicílie a tehdy římské kolonii, a zůstali tam tři dny."
      sv: "De lade till i Syrakusa, den gamla korintiska kolonin på Siciliens östkust och då en romersk koloni, och stannade där tre dagar."
      nb: "De la til i Syrakus, den gamle korintiske kolonien på østkysten av Sicilia og da en romersk koloni, og ble der i tre dager."
      tl: "Dumaong sila sa Siracusa, ang matandang kolonya ng Corinto sa silangang baybayin ng Sicilia at noon ay isang koloniyang Romano, at tumira roon nang tatlong araw."
      da: "De anløb Syrakus, den gamle korinthiske koloni på Siciliens østkyst og da en romersk koloni, og blev der tre dage."
      sr: "Пристали су у Сиракузи, старој коринтској колонији на источној обали Сицилије, тада римској колонији, и остали тамо три дана."
      hu: "Kikötöttek Szirakúzában, a Szicília keleti partján fekvő régi korinthusi gyarmatvárosban, amely ekkor római kolónia volt, és három napig ott maradtak."
      fi: "He laskivat maihin Syrakusassa, Sisilian itärannikon vanhassa korinttilaisessa siirtokunnassa, joka oli silloin roomalainen siirtokunta, ja viipyivät siellä kolme päivää."
      vi: "Họ ghé Sy-ra-cu-sơ, thuộc địa cổ của Cô-rinh-tô trên bờ biển phía đông Sicily và lúc ấy là một thuộc địa La Mã, và ở lại đó ba ngày."
      ro: "Au tras la Siracuza, vechea colonie corintiană de pe coasta de est a Siciliei, pe atunci colonie romană, și au rămas acolo trei zile."
      bg: "Пристанаха в Сиракуза — старата коринтска колония на източния бряг на Сицилия, по това време римска колония, и останаха там три дни."
  - place: a63bb26
