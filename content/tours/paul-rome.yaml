    note:
      en: 'Fair Havens; Paul warns that "this voyage will be with hurt and much damage, not only of the lading and ship, but also of our lives."'
      ru: "Хорошие Пристани; Павел предупреждает, что «плавание будет с затруднениями и с большим вредом не только для груза и корабля, но и для нашей жизни»."
      uk: "Добрі Пристані; Павло застерігає: «з утратою і з великою шкодою, не тільки для тягару і для статку, та й для душ наших буде плаваннє»."
      es: "Buenos Puertos; Pablo advierte que «con trabajo y mucho daño, no sólo de la cargazón y de la nave, mas aun de nuestras personas, habrá de ser la navegación»."
      pt: "Bons Portos; Paulo adverte que “a viagem trará prejuízo e grande perda, não só da carga e do navio, mas também de nossas vidas.”"
      de: "Schönhafen; Paulus warnt: „ich sehe, daß die Schiffahrt will mit Leid und großem Schaden ergehen, nicht allein der Last und des Schiffes sondern auch unsers Lebens“."
      fr: "Beaux-Ports ; Paul avertit : « la navigation ne se fera pas sans péril et sans beaucoup de dommage, non seulement pour la cargaison et pour le navire, mais encore pour nos personnes »."
      pl: "Piękne Przystanie; Paweł ostrzega, że „z ukrzywdzeniem i z wielką szkodą nie tylko towarów i okrętów, ale też i dusz naszych będzie to żeglowanie.”"
      it: "Buoni Porti; Paolo avverte: «io veggo che la navigazione si farà con pericolo e grave danno, non solo del carico e della nave, ma anche delle nostre persone»."
      nl: "Schone Havens; Paulus waarschuwt dat “de vaart zal geschieden met hinder en grote schade, niet alleen van de lading en van het schip, maar ook van ons leven.”"
      cs: "Dobré přístavy; Pavel varuje, že „s velikým ublížením a s mnohou škodou netoliko nákladu a lodí, ale i životů našich toto plavení bude“."
      sv: "Goda hamnarna; Paulus varnar: ”jag ser att denna sjöresa kommer att medföra vedervärdigheter och stor olycka, icke allenast för last och skepp, utan ock för våra liv.”"
      nb: "Godhavn; Paulus advarer om at «sjøferden vil være et vågestykke og medføre stor skade, ikke bare for ladning og skib, men også for vårt liv»."
      tl: "Mabubuting Daongan; nagbabala si Pablo na “ang paglalayag na ito ay makapipinsala at magiging malaking kapahamakan, hindi lamang sa lulan at sa daong, kundi naman sa ating mga buhay.”"
      da: "Gode Havne; Paulus advarer: »I Mænd! jeg ser, at Sejladsen vil medføre Ulykke og megen Skade, ikke alene paa Ladning og Skib, men ogsaa paa vort Liv.«"
      sr: "Добра пристаништа; Павле упозорава: „Људи! Видим да ће пловљење бити с муком и великом штетом не само товара и лађе него и душа наших.“"
      hu: "Szép Kikötők; Pál óva int: „nemcsak a teréhnek és a hajónak, hanem a mi életünknek is bántódásával és nagy kárával fog történni e hajózás”."
      fi: "Kauniit satamat; Paavali varoittaa: ”purjehtiminen käy vaivalloiseksi ja vaaralliseksi, ei ainoastaan lastille ja laivalle, vaan myös meidän hengellemme”."
      vi: "Hải cảng Tốt; Phao-lô cảnh báo: “Tôi thấy sự vượt biển nầy chắc sẽ phải nguy hiểm và hư hại, chẳng những cho hàng hóa và chiếc tàu mà thôi, lại đến thân chúng ta nữa.”"
      ro: "Bunele Porturi; Pavel îi avertizează că „cu necaz și cu multă pagubă, nu numai a povărei și a corăbiei, ci și a sufletelor noastre, va să fie mergerea corăbiei”."
      bg: "Добри пристанища; Павел предупреждава, че „плуването ще бъде със злострадание и с голема щета, не току за товара и за кораба но и за душите ни.“"
    story:
      en: "Coasting along Crete with difficulty, they came to a place called Fair Havens, near the town of Lasea. Much time had been lost, and sailing was now dangerous, for the fast was already over. Paul warned them that the voyage would bring damage and great loss, not only of the cargo and the ship but also of their lives. But the centurion trusted the helmsman and the owner of the ship more than Paul, and because the harbour was unfit to winter in, most of them decided to put out and try to reach Phoenix, a harbour of Crete, and winter there."
      ru: "С трудом пройдя вдоль Крита, они пришли к месту, называемому Хорошие Пристани, близ города Ласея. Много времени было потеряно, и плавание стало уже опасным, потому что пост уже прошёл. Павел предупредил их, что плавание принесёт ущерб и большие потери не только для груза и корабля, но и для их жизни. Но сотник больше доверял кормчему и хозяину корабля, чем Павлу, и, так как пристань не годилась для зимовки, большинство решило выйти в море и попытаться дойти до Финика, пристани на Крите, и там перезимовать."
      uk: "Насилу пропливши вздовж Криту, вони прибули до місця, що зветься Добрі Пристані, поблизу міста Ласея. Багато часу було втрачено, і плавання вже стало небезпечним, бо піст уже минув. Павло застеріг їх, що плавання принесе шкоду й великі втрати не тільки для вантажу й корабля, а й для їхнього життя. Але сотник більше довіряв керманичеві й власникові корабля, ніж Павлові, і, оскільки пристань не годилася для зимівлі, більшість вирішила вийти в море й спробувати дістатися до Фініка, пристані на Криті, і там перезимувати."
      es: "Costeando Creta con dificultad, llegaron a un lugar llamado Buenos Puertos, cerca de la ciudad de Lasea. Se había perdido mucho tiempo, y la navegación era ya peligrosa, porque el ayuno ya había pasado. Pablo les advirtió que el viaje traería daño y gran pérdida, no solo de la carga y de la nave, sino también de sus vidas. Pero el centurión se fiaba más del piloto y del patrón de la nave que de Pablo, y como el puerto no era apto para invernar, la mayoría decidió hacerse a la mar e intentar llegar a Fenice, un puerto de Creta, y pasar allí el invierno."
      pt: "Costeando Creta com dificuldade, chegaram a um lugar chamado Bons Portos, perto da cidade de Laseia. Muito tempo se tinha perdido, e a navegação já era perigosa, porque o jejum já havia passado. Paulo advertiu-os de que a viagem traria prejuízo e grande perda, não só da carga e do navio, mas também das suas vidas. Mas o centurião confiou mais no piloto e no dono do navio do que em Paulo, e, como o porto não era adequado para passar o inverno, a maioria decidiu fazer-se ao mar e tentar chegar a Fenice, um porto de Creta, e invernar ali."
      de: "Mühsam fuhren sie an Kreta entlang und kamen an einen Ort namens Schönhafen, nahe der Stadt Lasäa. Viel Zeit war verloren gegangen, und die Seefahrt war nun gefährlich, denn das Fasten war schon vorüber. Paulus warnte sie, die Fahrt werde Schaden und großen Verlust bringen, nicht nur für die Ladung und das Schiff, sondern auch für ihr Leben. Doch der Hauptmann vertraute dem Steuermann und dem Schiffseigner mehr als Paulus, und weil der Hafen zum Überwintern ungeeignet war, beschlossen die meisten, auszulaufen und zu versuchen, Phönix zu erreichen, einen Hafen Kretas, und dort zu überwintern."
      fr: "Longeant la Crète avec peine, ils arrivèrent à un lieu nommé Beaux-Ports, près de la ville de Lasée. Beaucoup de temps avait été perdu, et la navigation devenait dangereuse, car le jeûne était déjà passé. Paul les avertit que le voyage entraînerait des dommages et de grandes pertes, non seulement pour la cargaison et le navire, mais aussi pour leurs vies. Mais le centenier se fia au pilote et au patron du navire plutôt qu’à Paul, et comme le port n’était pas bon pour hiverner, la plupart furent d’avis de partir et de tenter d’atteindre Phénix, un port de Crète, pour y passer l’hiver."
      pl: "Płynąc z trudem wzdłuż Krety, przybyli do miejsca zwanego Piękne Przystanie, w pobliżu miasta Lasea. Stracono wiele czasu i żegluga była już niebezpieczna, bo post już minął. Paweł ostrzegał ich, że rejs przyniesie szkodę i wielką stratę nie tylko ładunku i okrętu, ale i ich życia. Lecz setnik bardziej ufał sternikowi i właścicielowi okrętu niż Pawłowi, a ponieważ port nie nadawał się do zimowania, większość postanowiła wypłynąć i spróbować dotrzeć do Feniksu, portu na Krecie, i tam przezimować."
      it: "Costeggiando Creta con difficoltà, giunsero a un luogo detto Buoni Porti, vicino alla città di Lasea. Si era perso molto tempo, e la navigazione era ormai pericolosa, perché il Digiuno era già passato. Paolo li avvertì che il viaggio avrebbe portato danno e grave perdita, non solo del carico e della nave, ma anche delle loro vite. Ma il centurione si fidò più del pilota e del padrone della nave che di Paolo, e poiché il porto non era adatto a svernare, i più decisero di salpare e tentare di raggiungere Fenice, un porto di Creta, per passarvi l’inverno."
      nl: "Met moeite langs Kreta varend, kwamen zij bij een plaats genaamd Schone Havens, dicht bij de stad Lasea. Er was veel tijd verloren gegaan, en de vaart was nu gevaarlijk, want de vasten was al voorbij. Paulus waarschuwde hen dat de reis schade en groot verlies zou brengen, niet alleen van de lading en het schip, maar ook van hun leven. Maar de hoofdman vertrouwde de stuurman en de eigenaar van het schip meer dan Paulus, en omdat de haven ongeschikt was om te overwinteren, besloten de meesten uit te varen en te proberen Fenix te bereiken, een haven van Kreta, en daar te overwinteren."
      cs: "S obtížemi pluli podél Kréty a přišli na místo zvané Dobré přístavy, nedaleko města Lasaia. Mnoho času se ztratilo a plavba už byla nebezpečná, neboť půst už minul. Pavel je varoval, že plavba přinese škodu a velkou ztrátu nejen nákladu a lodi, ale i jejich životů. Setník však více věřil kormidelníkovi a majiteli lodi než Pavlovi, a protože přístav nebyl vhodný k přezimování, většina se rozhodla vyplout a pokusit se dostat do Foiniku, krétského přístavu, a tam přezimovat."
      sv: "Med svårighet tog de sig längs Kreta och kom till en plats som kallades Goda hamnarna, nära staden Lasea. Mycket tid hade gått förlorad, och sjöfarten var nu farlig, ty fastan var redan förbi. Paulus varnade dem för att resan skulle medföra skada och stor förlust, inte bara av lasten och skeppet utan också av deras liv. Men hövitsmannen litade mer på styrmannen och skeppets ägare än på Paulus, och eftersom hamnen var olämplig att övervintra i, beslöt de flesta att lägga ut och försöka nå Fenix, en hamn på Kreta, och övervintra där."
      nb: "Med nød og neppe kom de seg langs Kreta til et sted som ble kalt Godhavn, nær byen Lasea. Mye tid var gått tapt, og sjøferden var nå farlig, for fasten var allerede over. Paulus advarte dem om at reisen ville føre til skade og stort tap, ikke bare av lasten og skipet, men også av deres liv. Men høvedsmannen satte mer lit til styrmannen og skipets eier enn til Paulus, og fordi havnen var uegnet til å overvintre i, bestemte de fleste seg for å stikke til sjøs og prøve å nå Føniks, en havn på Kreta, og overvintre der."
      tl: "Sa pamamaybay sa Creta na may kahirapan, dumating sila sa isang dakong tinatawag na Mabubuting Daongan, malapit sa bayan ng Lasea. Mahabang panahon na ang nagugol, at mapanganib na ang paglalayag, sapagka't nakalampas na ang Pag-aayuno. Nagbabala si Pablo sa kanila na ang paglalayag ay magdadala ng pinsala at malaking kapahamakan, hindi lamang sa lulan at sa daong kundi pati sa kanilang mga buhay. Ngunit higit na nagtiwala ang senturion sa piloto at sa may-ari ng daong kaysa kay Pablo, at sapagka't hindi bagay hintuan sa tagginaw ang daongan, ipinasiya ng karamihan na tumulak at sikaping marating ang Fenix, isang daungan ng Creta, at doon magtaglamig."
      da: "Med besvær sejlede de langs Kreta og kom til et sted kaldet Gode Havne nær byen Lasæa. Megen tid var gået tabt, og sejladsen var nu farlig, for fasten var allerede forbi. Paulus advarede dem om, at sejladsen ville bringe skade og stort tab, ikke alene for ladningen og skibet, men også for deres liv. Men høvedsmanden stolede mere på styrmanden og skibets ejer end på Paulus, og fordi havnen var uegnet til overvintring, besluttede de fleste at sejle ud og forsøge at nå Føniks, en havn på Kreta, og overvintre der."
      sr: "Једва се возећи дуж Крита, дошли су на једно место звано Добра пристаништа, близу града Ласеје. Много времена било је изгубљено, а пловидба је већ била опасна, јер је пост већ био прошао. Павле их је упозорио да ће пловидба донети штету и велики губитак не само товара и лађе него и њихових живота. Али стотник је више веровао крманошу и власнику лађе него Павлу, и пошто пристаниште није било згодно за зимовање, већина је одлучила да исплови и покуша да стигне до Финика, критског пристаништа, и да тамо презими."
      hu: "Nagy nehezen elhajózva Kréta mellett egy Szép Kikötőknek nevezett helyre értek, Laszea városa közelében. Sok idő elveszett, és a hajózás már veszélyes volt, mert a böjt is elmúlt már. Pál figyelmeztette őket, hogy az út kárral és nagy veszteséggel jár, nemcsak a rakományra és a hajóra, hanem az életükre nézve is. A százados azonban jobban hitt a kormányosnak és a hajó tulajdonosának, mint Pálnak, és mivel a kikötő telelésre alkalmatlan volt, a többség úgy döntött, hogy kifutnak, és megpróbálják elérni Főnixet, Kréta egyik kikötőjét, és ott telelnek."
      fi: "Vaivoin Kreetan rannikkoa seuraten he tulivat paikkaan nimeltä Kauniit satamat lähelle Lasaian kaupunkia. Paljon aikaa oli kulunut hukkaan, ja purjehtiminen oli nyt vaarallista, sillä paasto oli jo ohi. Paavali varoitti heitä, että matka toisi vahinkoa ja suuren menetyksen, ei vain lastille ja laivalle vaan myös heidän hengelleen. Mutta sadanpäämies luotti enemmän perämieheen ja laivanisäntään kuin Paavaliin, ja koska satama ei sopinut talvehtimiseen, useimmat päättivät lähteä merelle ja yrittää päästä Foiniksiin, Kreetan satamaan, talvehtimaan siellä."
      vi: "Khó nhọc đi dọc theo Cơ-rết, họ đến một nơi gọi là Hải cảng Tốt, gần thành La-sê. Đã mất nhiều thời gian, và đi biển lúc ấy đã nguy hiểm, vì kỳ Kiêng ăn đã qua rồi. Phao-lô cảnh báo họ rằng chuyến vượt biển này sẽ đem đến hư hại và mất mát lớn, chẳng những cho hàng hóa và chiếc tàu mà còn cho tính mạng của họ. Nhưng thầy đội tin người lái tàu và chủ tàu hơn Phao-lô, và vì cảng ấy không tiện để qua mùa đông, phần đông quyết định ra khơi và cố đến Phê-nit, một hải cảng của Cơ-rết, để qua mùa đông ở đó."
      ro: "Mergând cu greu de-a lungul Cretei, au ajuns la un loc numit Bunele Porturi, aproape de cetatea Lasea. Se pierduse multă vreme, iar navigația era acum primejdioasă, căci postul trecuse deja. Pavel i-a avertizat că drumul va aduce pagubă și mare pierdere, nu numai a încărcăturii și a corăbiei, ci și a vieților lor. Dar sutașul a dat mai multă crezare cârmaciului și stăpânului corăbiei decât lui Pavel, iar pentru că portul nu era bun de iernat, cei mai mulți au hotărât să plece și să încerce să ajungă la Fenix, un port al Cretei, ca să ierneze acolo."
      bg: "Като се движеха с мъка покрай Крит, стигнаха до едно място, наречено Добри пристанища, близо до град Ласея. Много време беше изгубено и плаването вече беше опасно, защото постът беше минал. Павел ги предупреди, че плаването ще донесе щета и голяма загуба не само за товара и кораба, но и за живота им. Но стотникът се довери повече на кормчията и на собственика на кораба, отколкото на Павел, и понеже пристанището не беше удобно за презимуване, повечето решиха да излязат в морето и да се опитат да стигнат до Финик, пристанище на Крит, и да презимуват там."
  - place: aca2b0a
    ref: Acts.27.14-Acts.27.17
    by: sea
    within_next: true
    note:
      en: "The tempestuous wind Euroclydon drives the ship past Cauda."
      ru: "Бурный ветер эвроклидон несёт корабль мимо Клавды."
      uk: "Бурхливий вітер Евроклідон несе корабель повз Клавду."
      es: "El viento tempestuoso Euroclidón arrastra la nave más allá de Clauda."
      pt: "O vento tempestuoso Euroclidão arrasta o navio além de Cauda."
      de: "Der stürmische Wind Euroklydon treibt das Schiff an Kauda vorbei."
      fr: "Le vent impétueux Euraquilon emporte le navire au-delà de Clauda."
      pl: "Gwałtowny wiatr Euroklidon pędzi okręt obok Kauda."
      it: "Il vento tempestoso Euraquilone spinge la nave oltre Cauda."
      nl: "De stormwind Euroklydon drijft het schip voorbij Klauda."
      cs: "Bouřlivý vítr Euroklydon žene loď kolem Kaudy."
      sv: "Den våldsamma stormvinden, den så kallade nordostorkanen, driver skeppet förbi Kauda."
      nb: "Den stormfulle vinden Eurakylon driver skipet forbi Kauda."
      tl: "Itinatangay ng mabagsik na hangin na Euraclidon ang daong lampas sa Clauda."
      da: "Den hæftige storm Eurakvilo driver skibet forbi Kauda."
      sr: "Бурни ветар Евроклидон носи лађу мимо Клауде."
      hu: "Az Euroklüdón nevű viharos szél elhajtja a hajót Kauda mellett."
      fi: "Myrskyisä Euroklydon-tuuli ajaa laivan Kaudan ohi."
      vi: "Trận gió dữ tợn Ơ-ra-qui-lôn đẩy chiếc tàu qua Cơ-lô-đa."
      ro: "Vântul năprasnic Euroclidon mână corabia pe lângă Clauda."
      bg: "Бурният вятър Евроклидон понася кораба покрай Клавда."
    story:
      en: "When a gentle south wind sprang up, they weighed anchor and sailed close along Crete. Soon a violent wind called Euroclydon rushed down from the island; the ship was caught and could not face the wind, and they let her drive. Running under the lee of a small island called Cauda, they barely managed to secure the ship's boat; they undergirded the ship, and fearing they would run onto the sandbanks, they lowered the gear and so were driven along."
      ru: "Когда подул лёгкий южный ветер, они подняли якорь и поплыли близ Крита. Вскоре с острова обрушился бурный ветер, называемый эвроклидон; корабль подхватило, он не мог идти против ветра, и они отдались на волю ветра. Пробегая под прикрытием небольшого острова, называемого Клавдой, они едва смогли удержать лодку; они обвязали корабль и, боясь сесть на мели, спустили снасти и так носились."
      uk: "Коли повіяв легкий південний вітер, вони підняли якір і попливли близько вздовж Криту. Незабаром з острова налетів бурхливий вітер, що зветься Евроклідон; корабель підхопило, він не міг іти проти вітру, і вони віддалися на волю вітру. Пробігаючи під захистом невеликого острова, що зветься Клавда, вони ледве змогли втримати човен; вони обв’язали корабель і, боячись наскочити на мілини, спустили снасті й так носилися."
      es: "Cuando se levantó un suave viento del sur, levaron anclas y navegaron pegados a la costa de Creta. Pronto se abatió desde la isla un viento violento llamado Euroclidón; la nave quedó atrapada y no podía hacer frente al viento, y la dejaron ir a la deriva. Corriendo al abrigo de una pequeña isla llamada Clauda, a duras penas lograron asegurar el esquife; ciñeron la nave y, temiendo encallar en los bancos de arena, arriaron el aparejo y así siguieron a la deriva."
      pt: "Quando começou a soprar um vento sul suave, levantaram âncora e navegaram rente à costa de Creta. Logo um vento violento chamado Euroclidão desceu da ilha; o navio foi apanhado e não podia enfrentar o vento, e deixaram-no ir à deriva. Correndo sob o abrigo de uma pequena ilha chamada Cauda, conseguiram a custo pôr o bote em segurança; reforçaram o casco do navio com cabos e, temendo encalhar nos bancos de areia, baixaram o equipamento e assim foram levados."
      de: "Als ein sanfter Südwind aufkam, lichteten sie den Anker und segelten dicht an Kreta entlang. Bald brach ein heftiger Wind namens Euroklydon von der Insel herab; das Schiff wurde erfasst und konnte dem Wind nicht standhalten, und sie ließen es treiben. Im Schutz einer kleinen Insel namens Kauda brachten sie mit knapper Not das Beiboot in ihre Gewalt; sie gürteten das Schiff, und aus Furcht, auf die Sandbänke zu geraten, ließen sie das Takelwerk herab und trieben so dahin."
      fr: "Un léger vent du sud s’étant levé, ils levèrent l’ancre et longèrent de près la Crète. Bientôt un vent violent appelé Euraquilon se déchaîna depuis l’île ; le navire fut entraîné sans pouvoir faire face au vent, et ils le laissèrent aller à la dérive. Passant à l’abri d’une petite île nommée Clauda, ils eurent grand-peine à se rendre maîtres de la chaloupe ; ils ceinturèrent le navire et, craignant d’échouer sur les bancs de sable, abaissèrent les agrès et se laissèrent ainsi emporter."
      pl: "Gdy powiał łagodny wiatr z południa, podnieśli kotwicę i płynęli tuż przy Krecie. Wkrótce z wyspy spadł gwałtowny wiatr zwany Euroklidon; okręt został porwany i nie mógł stawić czoła wiatrowi, więc dali mu się nieść. Przepływając pod osłoną małej wyspy zwanej Kauda, z trudem zdołali zabezpieczyć łódź; opasali okręt, a bojąc się, że wpadną na mielizny, spuścili osprzęt i tak dali się nieść."
      it: "Levatosi un leggero vento del sud, levarono le àncore e costeggiarono Creta da vicino. Ben presto dall’isola si scatenò un vento violento chiamato Euraquilone; la nave fu travolta e non potendo tenere testa al vento, la lasciarono andare alla deriva. Passando al riparo di un’isoletta chiamata Cauda, riuscirono a stento ad assicurare la scialuppa; cinsero la nave di sotto e, temendo di finire sui banchi di sabbia, calarono l’attrezzatura e si lasciarono così trasportare."
      nl: "Toen er een zachte zuidenwind opstak, lichtten zij het anker en voeren dicht langs Kreta. Weldra stortte een hevige wind, Euroklydon genaamd, van het eiland neer; het schip werd gegrepen en kon niet tegen de wind in, en zij lieten het drijven. Onder de wal van een eilandje genaamd Klauda langs lopend, konden zij met moeite de sloep binnenhalen; zij gordden het schip onder, en uit vrees op de zandbanken te lopen, streken zij het tuig en dreven zo voort."
      cs: "Když zavanul mírný jižní vítr, zvedli kotvy a pluli těsně podél Kréty. Brzy se z ostrova snesl prudký vítr zvaný Euroklydon; loď byla stržena a nemohla vzdorovat větru, a tak ji nechali hnát. Když se dostali do závětří malého ostrova zvaného Kauda, sotva se jim podařilo zajistit člun; podepjali loď, a protože se báli, že najedou na mělčiny, spustili výstroj a nechali se hnát."
      sv: "När en svag sydlig vind blåste upp lättade de ankar och seglade tätt längs Kreta. Snart kom en våldsam vind, den så kallade nordostorkanen, farande ned från ön; skeppet rycktes med och kunde inte hålla upp mot vinden, och de lät det driva. När de kom i lä av en liten ö som hette Kauda, lyckades de med knapp nöd säkra skeppsbåten; de slog tåg om skeppet, och av fruktan för att gå på sandbankarna firade de ned redskapen och drev så vidare."
      nb: "Da en svak sønnavind blåste opp, lettet de anker og seilte tett langs Kreta. Snart kom en voldsom vind som kalles Eurakylon, styrtende ned fra øya; skipet ble revet med og kunne ikke holde opp mot vinden, og de lot det drive. Da de kom i le av en liten øy som het Kauda, klarte de med nød og neppe å sikre skipsbåten; de slo tau om skipet, og i frykt for å drive inn på sandbankene firte de ned riggen og drev slik videre."
      tl: "Nang humihip nang marahan ang hanging timugan, itinaas nila ang sinepete at namaybay nang malapit sa Creta. Hindi nalaon ay humampas mula sa pulo ang isang maunos na hanging tinatawag na Euraclidon; inabot ang daong at hindi makasalunga sa hangin, at hinayaan nilang maanod ito. Sa pagtakbo nang nanganganlong sa isang maliit na pulong tinatawag na Clauda, may kahirapan nilang naitaas ang bangka; tinalian nila ang ibaba ng daong, at sa takot na mapadpad sa mga buhanginan, ibinaba nila ang mga kagamitan at sa gayon ay napaanod sila."
      da: "Da en svag søndenvind blæste op, lettede de anker og sejlede tæt langs Kreta. Snart for en voldsom vind, kaldet Eurakvilo, ned fra øen; skibet blev revet med og kunne ikke holde op mod vinden, og de lod det drive. Da de løb ind i læ af en lille ø ved navn Kauda, lykkedes det dem med nød og næppe at bjærge skibsbåden; de surrede skibet, og af frygt for at løbe på sandbankerne firede de grejet ned og lod sig således drive."
      sr: "Кад је дунуо благ јужни ветар, дигли су сидро и пловили близу обале Крита. Убрзо се с острва сручио буран ветар звани Евроклидон; лађу је захватио и она није могла да се одупре ветру, па су је препустили да је носи. Пролазећи у заветрини малог острва званог Клауда, једва су успели да осигурају чамац; опасали су лађу одоздо и, бојећи се да не насеку на пруд, спустили опрему и тако су ношени."
      hu: "Amikor enyhe déli szél kerekedett, felszedték a horgonyt, és szorosan Kréta mellett hajóztak. Hamarosan Euroklüdón nevű heves szél csapott le a sziget felől; a hajót elkapta, nem tudott a széllel szembeszállni, és hagyták, hogy sodródjék. Egy Kauda nevű kis sziget szélvédett oldalán futva nagy nehezen biztosították a csónakot; körülkötözték a hajót, és mivel attól féltek, hogy a homokzátonyokra futnak, leeresztették a felszerelést, és így sodródtak."
      fi: "Kun alkoi puhaltaa leuto etelätuuli, he nostivat ankkurin ja purjehtivat aivan Kreetan rantaa pitkin. Pian saarelta syöksyi raju tuuli, jota kutsuttiin Euroklydoniksi; laiva joutui sen valtaan eikä voinut nousta tuuleen, ja he antoivat sen ajelehtia. Päästyään pienen Kauda-nimisen saaren suojaan he saivat vain töin tuskin veneen korjuuseen; he sitoivat laivan köysillä ja, peläten ajautuvansa hiekkasärkille, laskivat varusteet alas ja ajelehtivat niin."
      vi: "Khi có gió nam nhẹ thổi lên, họ kéo neo và đi sát dọc theo Cơ-rết. Chẳng bao lâu một trận gió dữ tợn gọi là Ơ-ra-qui-lôn từ trên đảo thổi ập xuống; tàu bị cuốn đi, không thể chống lại gió, và họ để mặc cho tàu trôi. Chạy dưới phía khuất gió của một hòn đảo nhỏ gọi là Cơ-lô-đa, họ khó nhọc lắm mới giữ được chiếc thuyền con; họ lấy dây ràng thân tàu lại, và sợ mắc cạn trên các bãi cát, họ hạ đồ buồm xuống và cứ thế bị đưa trôi đi."
      ro: "Când a început să sufle lin un vânt de miazăzi, au ridicat ancora și au navigat aproape de Creta. Curând, un vânt năprasnic numit Euroclidon s-a năpustit dinspre insulă; corabia a fost prinsă și nu putea ține piept vântului, iar ei au lăsat-o în voia lui. Trecând la adăpostul unei insulițe numite Clauda, abia au reușit să asigure barca; au încins corabia și, temându-se să nu dea peste bancurile de nisip, au coborât velatura și au fost purtați astfel."
      bg: "Когато подухна слаб южен вятър, те вдигнаха котва и плаваха близо до Крит. Скоро от острова се спусна бурен вятър, наречен Евроклидон; корабът беше подхванат и не можеше да устои срещу вятъра, и те го оставиха да бъде носен. Като минаха под прикритието на едно островче, наречено Клавда, едва успяха да приберат лодката; препасаха кораба отдолу и като се бояха да не попаднат на плитчините, спуснаха съоръженията и така бяха носени."
  - place: a57835d
    ref: Acts.27.39-Acts.28.11
    by: sea
    sailed: { days: 14, about: true, ref: Acts.27.27 }
    note:
      en: "Shipwreck; three months on the island."
      ru: "Кораблекрушение; три месяца на острове."
      uk: "Корабельна аварія; три місяці на острові."
      es: "Naufragio; tres meses en la isla."
      pt: "Naufrágio; três meses na ilha."
      de: "Schiffbruch; drei Monate auf der Insel."
      fr: "Naufrage ; trois mois dans l’île."
      pl: "Rozbicie okrętu; trzy miesiące na wyspie."
      it: "Il naufragio; tre mesi sull’isola."
      nl: "Schipbreuk; drie maanden op het eiland."
      cs: "Ztroskotání; tři měsíce na ostrově."
      sv: "Skeppsbrott; tre månader på ön."
      nb: "Skipbrudd; tre måneder på øya."
      tl: "Pagkawasak ng daong; tatlong buwan sa pulo."
      da: "Skibbrud; tre måneder på øen."
      sr: "Бродолом; три месеца на острву."
      hu: "Hajótörés; három hónap a szigeten."
      fi: "Haaksirikko; kolme kuukautta saarella."
      vi: "Đắm tàu; ba tháng trên đảo."
      ro: "Naufragiul; trei luni pe insulă."
      bg: "Корабокрушение; три месеца на острова."
    story:
      en: "For many days neither sun nor stars appeared, and all hope of being saved was given up; Paul told them that an angel of God had stood by him and promised that no life would be lost, only the ship. On the fourteenth night, as they were driven across the sea of Adria, the sailors sensed land; at daybreak they ran the ship aground where two seas met, and all 276 on board came safely to land, some swimming, some on planks. The island was called Melita. The islanders received them kindly; a viper fastened on Paul's hand and he shook it into the fire unharmed. Publius, the chief man of the island, lodged them three days; Paul healed his father of fever and dysentery, and the other sick of the island came and were healed. After three months they set sail in a ship of Alexandria that had wintered at the island, whose sign was Castor and Pollux."
      ru: "Много дней не было видно ни солнца, ни звёзд, и всякая надежда на спасение исчезла; Павел сказал им, что Ангел Божий явился ему и обещал, что ни одна душа не погибнет, а только корабль. В четырнадцатую ночь, когда их носило по морю Адриатическому, корабельщики почуяли землю; на рассвете они посадили корабль на мель там, где сходились два моря, и все 276 человек, бывших на борту, благополучно достигли земли, кто вплавь, кто на досках. Остров назывался Мелит. Островитяне приняли их радушно; ехидна повисла на руке Павла, и он стряхнул её в огонь, не потерпев вреда. Публий, начальник острова, три дня принимал их у себя; Павел исцелил его отца от горячки и кровавого поноса, и остальные больные острова приходили и исцелялись. Через три месяца они отплыли на александрийском корабле, зимовавшем у острова, с эмблемой Диоскуров."
      uk: "Багато днів не було видно ні сонця, ні зірок, і всяка надія на порятунок зникла; Павло сказав їм, що ангел Божий став біля нього й пообіцяв, що жодна душа не загине, лише корабель. Чотирнадцятої ночі, коли їх носило по Адріятицькому морю, корабельники відчули землю; на світанку вони посадили корабель на мілину там, де сходилися два моря, і всі 276 людей, що були на борту, щасливо дісталися землі, хто вплав, хто на дошках. Острів звався Мелит. Остров’яни прийняли їх привітно; гадюка вчепилася Павлові в руку, і він струсив її у вогонь, не зазнавши шкоди. Публій, перший муж острова, три дні гостив їх; Павло зцілив його батька від гарячки й кривавого проносу, і решта хворих острова приходили й зцілювалися. Через три місяці вони відпливли александрійським кораблем, що зимував біля острова, зі знаком Діоскурів."
      es: "Durante muchos días no aparecieron ni sol ni estrellas, y se perdió toda esperanza de salvarse; Pablo les dijo que un ángel de Dios había estado junto a él y le había prometido que no se perdería ninguna vida, solo la nave. La decimocuarta noche, mientras eran arrastrados por el mar Adriático, los marineros presintieron tierra; al amanecer hicieron encallar la nave en un lugar donde se juntaban dos mares, y los 276 que iban a bordo llegaron a salvo a tierra, unos nadando, otros sobre tablas. La isla se llamaba Melita. Los isleños los recibieron con humanidad; una víbora se prendió de la mano de Pablo, y él la sacudió en el fuego sin sufrir daño. Publio, el principal de la isla, los hospedó tres días; Pablo sanó a su padre de fiebre y disentería, y los demás enfermos de la isla vinieron y fueron sanados. Tres meses después zarparon en una nave de Alejandría que había invernado en la isla y que tenía por enseña a Cástor y Pólux."
      pt: "Durante muitos dias não apareceram nem sol nem estrelas, e toda a esperança de salvação foi abandonada; Paulo disse-lhes que um anjo de Deus tinha estado ao seu lado e prometido que nenhuma vida se perderia, apenas o navio. Na décima quarta noite, enquanto eram levados pelo mar Adriático, os marinheiros pressentiram terra; ao amanhecer encalharam o navio num lugar onde dois mares se encontravam, e todos os 276 que estavam a bordo chegaram a salvo à terra, uns nadando, outros em tábuas. A ilha chamava-se Malta. Os ilhéus receberam-nos com bondade; uma víbora prendeu-se à mão de Paulo, e ele a sacudiu no fogo sem sofrer nenhum mal. Públio, o homem principal da ilha, hospedou-os três dias; Paulo curou o pai dele de febre e disenteria, e os outros doentes da ilha vieram e foram curados. Três meses depois embarcaram num navio de Alexandria que tinha passado o inverno na ilha e cuja insígnia eram os Irmãos Gêmeos."
      de: "Viele Tage lang erschienen weder Sonne noch Sterne, und alle Hoffnung auf Rettung schwand; Paulus sagte ihnen, ein Engel Gottes habe bei ihm gestanden und verheißen, dass kein Leben verloren gehen werde, nur das Schiff. In der vierzehnten Nacht, als sie im Adria-Meer umhergetrieben wurden, spürten die Seeleute Land; bei Tagesanbruch ließen sie das Schiff an einer Stelle auflaufen, wo zwei Meere zusammentrafen, und alle 276 an Bord kamen wohlbehalten an Land, einige schwimmend, einige auf Planken. Die Insel hieß Melite. Die Inselbewohner nahmen sie freundlich auf; eine Otter hängte sich an die Hand des Paulus, und er schüttelte sie unversehrt ins Feuer. Publius, der Oberste der Insel, beherbergte sie drei Tage; Paulus heilte seinen Vater von Fieber und Ruhr, und die anderen Kranken der Insel kamen und wurden geheilt. Nach drei Monaten fuhren sie mit einem Schiff aus Alexandria ab, das auf der Insel überwintert hatte und dessen Zeichen Kastor und Pollux waren."
      fr: "Pendant plusieurs jours, ni le soleil ni les étoiles ne parurent, et l’on perdit tout espoir d’être sauvé ; Paul leur dit qu’un ange de Dieu s’était tenu près de lui et lui avait promis qu’aucune vie ne serait perdue, seulement le navire. La quatorzième nuit, tandis qu’ils étaient ballottés sur l’Adriatique, les matelots pressentirent la terre ; au point du jour, ils firent échouer le navire là où deux mers se rencontraient, et les 276 personnes à bord gagnèrent toutes la terre saines et sauves, les unes à la nage, les autres sur des planches. L’île s’appelait Mélita. Les insulaires les accueillirent avec bienveillance ; une vipère s’attacha à la main de Paul, et il la secoua dans le feu sans en ressentir aucun mal. Publius, le principal personnage de l’île, les logea trois jours ; Paul guérit son père de la fièvre et de la dysenterie, et les autres malades de l’île vinrent et furent guéris. Après trois mois, ils s’embarquèrent sur un navire d’Alexandrie qui avait hiverné dans l’île et portait pour enseigne les Dioscures."
      pl: "Przez wiele dni nie ukazywało się ani słońce, ani gwiazdy, i porzucono wszelką nadzieję ratunku; Paweł powiedział im, że stanął przy nim anioł Boży i obiecał, że nikt nie straci życia, przepadnie tylko okręt. Czternastej nocy, gdy pędzeni byli po morzu Adryjatyckim, żeglarze wyczuli ląd; o świcie wprowadzili okręt na mieliznę w miejscu, gdzie spotykały się dwa morza, i wszyscy, 276 osób na pokładzie, bezpiecznie dotarli do lądu, jedni wpław, inni na deskach. Wyspa nazywała się Melita. Wyspiarze przyjęli ich życzliwie; żmija uczepiła się ręki Pawła, a on strząsnął ją do ognia bez szkody dla siebie. Publiusz, pierwszy człowiek na wyspie, gościł ich przez trzy dni; Paweł uzdrowił jego ojca z gorączki i czerwonki, a pozostali chorzy z wyspy przychodzili i byli uzdrawiani. Po trzech miesiącach odpłynęli okrętem aleksandryjskim, który przezimował przy wyspie, a jego godłem byli Kastor i Polluks."
      it: "Per molti giorni non apparvero né sole né stelle, e ogni speranza di salvezza fu abbandonata; Paolo disse loro che un angelo di Dio gli era stato accanto e gli aveva promesso che nessuna vita sarebbe andata perduta, ma solo la nave. La quattordicesima notte, mentre erano portati qua e là per l’Adriatico, i marinai avvertirono la vicinanza della terra; all’alba fecero arenare la nave dove due mari si incontravano, e tutte le 276 persone a bordo giunsero salve a terra, chi a nuoto, chi su tavole. L’isola si chiamava Melita. Gli isolani li accolsero con umanità; una vipera si attaccò alla mano di Paolo ed egli la scosse nel fuoco senza riceverne male. Publio, l’uomo principale dell’isola, li ospitò tre giorni; Paolo guarì suo padre dalla febbre e dalla dissenteria, e gli altri malati dell’isola vennero e furono guariti. Dopo tre mesi salparono su una nave alessandrina che aveva svernato nell’isola e che aveva per insegna Castore e Polluce."
      nl: "Vele dagen lang verschenen zon noch sterren, en alle hoop op redding werd opgegeven; Paulus zei hun dat een engel van God bij hem had gestaan en beloofd had dat er geen leven verloren zou gaan, alleen het schip. In de veertiende nacht, terwijl zij in de Adriatische zee heen en weer werden gedreven, bespeurden de zeelieden land; bij het aanbreken van de dag lieten zij het schip vastlopen op een plaats waar twee zeeën samenkwamen, en alle 276 opvarenden kwamen behouden aan land, sommigen zwemmend, anderen op planken. Het eiland heette Melite. De eilandbewoners ontvingen hen vriendelijk; een adder hechtte zich aan de hand van Paulus, en hij schudde die ongedeerd af in het vuur. Publius, de voornaamste van het eiland, herbergde hen drie dagen; Paulus genas zijn vader van koorts en buikloop, en de andere zieken van het eiland kwamen en werden genezen. Na drie maanden voeren zij af in een schip van Alexandrië dat bij het eiland overwinterd had, met als teken Kastor en Pollux."
      cs: "Mnoho dní se neukázalo ani slunce, ani hvězdy a vzdali se veškeré naděje na záchranu; Pavel jim řekl, že při něm stál anděl Boží a slíbil, že nikdo nepřijde o život, jen loď. Čtrnácté noci, když byli hnáni po moři Adriatickém, tušili námořníci blízkost země; za svítání najeli s lodí na mělčinu v místě, kde se stýkala dvě moře, a všech 276 lidí na palubě se šťastně dostalo na zem, někteří plaváním, jiní na prknech. Ostrov se jmenoval Melita. Ostrované je přijali laskavě; zmije se zakousla Pavlovi do ruky a on ji setřásl do ohně, aniž mu ublížila. Publius, přední muž ostrova, je tři dny hostil; Pavel uzdravil jeho otce z horečky a úplavice a ostatní nemocní z ostrova přicházeli a byli uzdravováni. Po třech měsících vypluli na alexandrijské lodi, která přezimovala u ostrova a měla za znamení Kastora a Polluxe."
      sv: "Under många dagar syntes varken sol eller stjärnor, och allt hopp om räddning var ute; Paulus sade till dem att en Guds ängel hade stått vid hans sida och lovat att ingen skulle mista livet, bara skeppet gå förlorat. Den fjortonde natten, medan de drev över Adriatiska havet, anade sjömännen land; i gryningen satte de skeppet på grund där två hav möttes, och alla 276 ombord kom välbehållna i land, somliga simmande, andra på plankor. Ön hette Melita. Öborna tog vänligt emot dem; en huggorm högg sig fast vid Paulus’ hand, och han skakade av den i elden utan att ta skada. Publius, den förnämste mannen på ön, gav dem härbärge i tre dagar; Paulus botade hans fader från feber och magsjukdom, och de andra sjuka på ön kom och blev botade. Efter tre månader seglade de vidare med ett skepp från Alexandria som hade övervintrat vid ön och som hade Tvillinggudarna Kastor och Pollux som tecken."
      nb: "I mange dager viste verken sol eller stjerner seg, og alt håp om redning ble oppgitt; Paulus sa til dem at en Guds engel hadde stått hos ham og lovet at ikke noe liv skulle gå tapt, bare skipet. Den fjortende natten, mens de drev over Adriaterhavet, merket sjøfolkene at det var land i nærheten; ved daggry satte de skipet på grunn der to hav møttes, og alle 276 om bord kom seg velberget i land, noen svømmende, andre på planker. Øya het Melita. Øyboerne tok vennlig imot dem; en orm bet seg fast i Paulus' hånd, og han ristet den av seg inn i ilden uten å ta skade. Publius, den første mannen på øya, lot dem bo hos seg i tre dager; Paulus helbredet faren hans for feber og blodgang, og de andre syke på øya kom og ble helbredet. Etter tre måneder seilte de videre med et skip fra Aleksandria som hadde overvintret ved øya, og som hadde tvillingene Kastor og Pollux til merke."
      tl: "Sa loob ng maraming araw ay hindi sumikat ang araw ni ang mga bituin, at nawala ang buong pag-asang makaliligtas; sinabi sa kanila ni Pablo na tumayo sa tabi niya ang isang anghel ng Diyos at nangakong walang buhay na mawawala, ang daong lamang. Nang ikalabing-apat na gabi, samantalang sila'y ipinapadpad sa Dagat ng Adriatico, sinapantaha ng mga mandaragat na malapit na ang lupa; sa pagbubukang-liwayway ay isinadsad nila ang daong sa dakong pinagsasalubungan ng dalawang dagat, at ang lahat ng 276 na sakay ay nakaligtas hanggang sa lupa, ang iba'y lumalangoy, ang iba'y nasa mga tabla. Ang pulo ay tinatawag na Melita. Tinanggap sila nang may kagandahang-loob ng mga taga-pulo; isang ulupong ang kumapit sa kamay ni Pablo at ipinagpag niya ito sa apoy nang hindi siya nasaktan. Si Publio, ang pangulo sa pulo, ay nagkupkop sa kanila nang tatlong araw; pinagaling ni Pablo ang kaniyang ama sa lagnat at iti, at ang iba pang maysakit sa pulo ay nagsiparoon at pinagaling. Pagkaraan ng tatlong buwan ay naglayag sila sa isang daong Alejandria na nagtaglamig sa pulo, na ang sagisag ay Ang Magkapatid na Kambal."
      da: "I mange dage viste hverken sol eller stjerner sig, og alt håb om redning blev opgivet; Paulus sagde til dem, at en Guds engel havde stået hos ham og lovet, at intet liv skulle gå tabt, kun skibet. Den fjortende nat, mens de drev om i det adriatiske hav, fornemmede sømændene land; ved daggry satte de skibet på grund, hvor to have mødtes, og alle 276 om bord kom velbeholdne i land, nogle svømmende, andre på planker. Øen hed Melite. Øboerne tog venligt imod dem; en hugorm bed sig fast i Paulus' hånd, og han rystede den af i ilden uden at tage skade. Publius, øens fornemste mand, gav dem husly i tre dage; Paulus helbredte hans far for feber og blodgang, og de andre syge på øen kom og blev helbredt. Efter tre måneder sejlede de videre i et skib fra Alexandria, som havde overvintret ved øen, og hvis mærke var Kastor og Pollux."
      sr: "Много дана нису се показивали ни сунце ни звезде, и свака нада у спасење била је напуштена; Павле им је рекао да је уз њега стао анђео Божји и обећао да ниједан живот неће пропасти, него само лађа. Четрнаесте ноћи, док су ношени по адријанској пучини, лађари су осетили копно; у свануће насукали су лађу где су се два мора сусретала, и свих 276 на лађи живи су изашли на копно, неки пливајући, неки на даскама. Острво се звало Мелита. Острвљани су их љубазно примили; змија се прилепила Павлу за руку, а он ју је отресао у огањ неповређен. Поплије, поглавар острва, угостио их је три дана; Павле је исцелио његовог оца од грознице и срдобоље, а остали болесници с острва долазили су и исцељивали се. После три месеца отпловили су александријском лађом која је презимила на острву и чији су знак били Диоскури."
      hu: "Sok napon át sem nap, sem csillagok nem látszottak, és minden reményt feladtak a megmenekülésre; Pál elmondta nekik, hogy Isten angyala állt mellé, és megígérte, hogy egyetlen élet sem vész el, csak a hajó. A tizennegyedik éjszakán, amikor az Ádrián hányódtak, a hajósok szárazföldet sejtettek; hajnalban zátonyra futtatták a hajót ott, ahol két tenger találkozott, és a fedélzeten lévő mind a 276 ember épségben partot ért, ki úszva, ki deszkákon. A szigetet Melitának hívták. A szigetlakók emberségesen fogadták őket; egy vipera Pál kezére tapadt, ő pedig sértetlenül a tűzbe rázta. Publiusz, a sziget főembere, három napig vendégül látta őket; Pál meggyógyította apját lázból és vérhasból, és a sziget többi betege is eljött, és meggyógyult. Három hónap múlva egy alexandriai hajón indultak el, amely a szigeten telelt, és amelynek címere Kásztor és Pollux volt."
      fi: "Moneen päivään ei näkynyt aurinkoa eikä tähtiä, ja kaikki pelastumisen toivo menetettiin; Paavali kertoi heille, että Jumalan enkeli oli seisonut hänen vierellään ja luvannut, ettei yksikään henki menisi hukkaan, vain laiva. Neljäntenätoista yönä, kun heitä ajettiin Adrianmeren poikki, merimiehet aavistivat maan olevan lähellä; päivän koittaessa he ajoivat laivan karille paikassa, jossa kaksi merta kohtasi, ja kaikki 276 laivassa ollutta pääsivät turvallisesti maihin, osa uiden, osa lautojen varassa. Saaren nimi oli Melite. Saarelaiset ottivat heidät ystävällisesti vastaan; kyykäärme tarttui Paavalin käteen, ja hän pudisti sen tuleen vahingoittumattomana. Saaren ensimmäinen mies Publius majoitti heitä kolme päivää; Paavali paransi hänen isänsä kuumeesta ja punataudista, ja saaren muut sairaat tulivat ja heidät parannettiin. Kolmen kuukauden kuluttua he lähtivät purjehtimaan aleksandrialaisella laivalla, joka oli talvehtinut saarella ja jonka tunnuksena olivat Kastor ja Pollux."
      vi: "Trong nhiều ngày, chẳng thấy mặt trời cũng chẳng thấy ngôi sao, và mọi hy vọng được cứu đều mất; Phao-lô nói với họ rằng một thiên sứ của Đức Chúa Trời đã đứng bên ông và hứa rằng không một sinh mạng nào bị mất, chỉ mất chiếc tàu. Đến đêm thứ mười bốn, khi họ bị trôi dạt trên biển A-đờ-ria-tích, các thủy thủ ngờ là gần đất liền; lúc rạng đông họ cho tàu mắc cạn ở chỗ hai ngọn nước biển gặp nhau, và hết thảy 276 người trên tàu đều lên bờ vô sự, người thì bơi, kẻ thì bám trên ván. Đảo ấy tên là Man-tơ. Dân đảo tiếp đãi họ cách nhân từ; một con rắn lục bám vào tay Phao-lô, và ông rảy nó vào lửa mà không bị hại gì. Búp-li-u, người đứng đầu đảo, cho họ trọ ba ngày; Phao-lô chữa lành cha ông khỏi bệnh nóng lạnh và bệnh lỵ, và những người bệnh khác trên đảo cũng đến và được chữa lành. Sau ba tháng họ xuống một chiếc tàu A-léc-xan-tri đã qua mùa đông tại đảo, có hiệu là Đi-ốt-cua."
      ro: "Multe zile nu s-au arătat nici soarele, nici stelele, și orice nădejde de scăpare era pierdută; Pavel le-a spus că un înger al lui Dumnezeu stătuse lângă el și îi făgăduise că nu se va pierde nicio viață, ci doar corabia. În a paisprezecea noapte, pe când erau purtați prin marea Adriei, corăbierii au simțit că se apropie de uscat; în zori au eșuat corabia într-un loc unde se întâlneau două mări, iar toți cei 276 de oameni de pe corabie au ajuns teferi la uscat, unii înot, alții pe scânduri. Insula se numea Melit. Localnicii i-au primit cu omenie; o viperă s-a prins de mâna lui Pavel, iar el a scuturat-o în foc fără să pățească nimic. Publiu, mai-marele insulei, i-a găzduit trei zile; Pavel l-a vindecat pe tatăl lui de friguri și de dizenterie, iar ceilalți bolnavi ai insulei au venit și au fost vindecați. După trei luni au plecat pe mare cu o corabie din Alexandria care iernase la insulă și al cărei semn erau Dioscurii."
      bg: "Много дни не се показваха нито слънце, нито звезди и всяка надежда за спасение беше изгубена; Павел им каза, че ангел Божий застанал до него и обещал, че няма да загине нито един живот, а само корабът. В четиринадесетата нощ, когато бяха носени по Адриатическо море, моряците усетиха, че наближава суша; на разсъмване насочиха кораба към брега там, където се срещаха две морета, и всички 276 души на борда излязоха невредими на сушата, едни с плуване, други на дъски. Островът се наричаше Мелит. Островитяните ги приеха човеколюбиво; една ехидна се впи в ръката на Павел, а той я тръсна в огъня невредим. Поплий, първенецът на острова, ги гости три дни; Павел изцели баща му от треска и дизентерия, а другите болни на острова идваха и биваха изцелявани. След три месеца отплаваха с александрийски кораб, който беше презимувал на острова и чийто знак бяха Диоскурите."
