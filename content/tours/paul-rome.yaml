    sailed: { days: 1, ref: Acts.27.3 }
    note:
      en: "Julius lets Paul visit friends."
      ru: "Юлий позволяет Павлу сходить к друзьям."
      uk: "Юлій дозволяє Павлові відвідати друзів."
      es: "Julio permite a Pablo visitar a sus amigos."
      pt: "Júlio permite que Paulo visite amigos."
      de: "Julius erlaubt Paulus, Freunde zu besuchen."
      fr: "Julius permet à Paul d’aller chez des amis."
      pl: "Juliusz pozwala Pawłowi odwiedzić przyjaciół."
      it: "Giulio permette a Paolo di visitare gli amici."
      nl: "Julius staat Paulus toe vrienden te bezoeken."
      cs: "Julius dovoluje Pavlovi navštívit přátele."
      sv: "Julius låter Paulus besöka vänner."
      nb: "Julius lar Paulus besøke venner."
      tl: "Pinahintulutan ni Julio si Pablo na dalawin ang mga kaibigan."
      da: "Julius lader Paulus besøge venner."
      sr: "Јулије допушта Павлу да посети пријатеље."
      hu: "Július megengedi Pálnak, hogy meglátogassa barátait."
      fi: "Julius sallii Paavalin käydä ystäviensä luona."
      vi: "Giu-lơ cho Phao-lô đến thăm các bạn hữu."
      ro: "Iuliu îi îngăduie lui Pavel să-și viziteze prietenii."
      bg: "Юлий позволява на Павел да посети приятелите си."
    story:
      en: "The next day they put in at Sidon, the old Phoenician city on its headland. Julius treated Paul kindly and allowed him to go to his friends and be cared for."
      ru: "На следующий день они пристали к Сидону, древнему финикийскому городу на мысу. Юлий обходился с Павлом человеколюбиво и позволил ему сходить к друзьям и воспользоваться их заботой."
      uk: "Наступного дня вони пристали до Сідона, давнього фінікійського міста на мисі. Юлій ласкаво поводився з Павлом і дозволив йому піти до друзів і скористатися їхнім піклуванням."
      es: "Al día siguiente tocaron puerto en Sidón, la antigua ciudad fenicia sobre su promontorio. Julio trató a Pablo con humanidad y le permitió ir a ver a sus amigos para ser atendido."
      pt: "No dia seguinte aportaram em Sidom, a antiga cidade fenícia no seu promontório. Júlio tratou Paulo com bondade e permitiu-lhe ir aos seus amigos e receber cuidados."
      de: "Am nächsten Tag legten sie in Sidon an, der alten phönizischen Stadt auf ihrem Vorgebirge. Julius behandelte Paulus freundlich und erlaubte ihm, zu seinen Freunden zu gehen und sich versorgen zu lassen."
      fr: "Le lendemain, ils abordèrent à Sidon, la vieille ville phénicienne sur son promontoire. Julius traita Paul avec bienveillance et lui permit d’aller chez ses amis et de recevoir leurs soins."
      pl: "Nazajutrz zawinęli do Sydonu, starego fenickiego miasta na cyplu. Juliusz obszedł się z Pawłem życzliwie i pozwolił mu pójść do przyjaciół i skorzystać z ich opieki."
      it: "Il giorno seguente approdarono a Sidone, l’antica città fenicia sul suo promontorio. Giulio trattò Paolo con umanità e gli permise di andare dai suoi amici e di riceverne le cure."
      nl: "De volgende dag legden zij aan te Sidon, de oude Fenicische stad op haar landtong. Julius behandelde Paulus vriendelijk en stond hem toe naar zijn vrienden te gaan en door hen verzorgd te worden."
      cs: "Druhý den přistáli v Sidónu, starém fénickém městě na mysu. Julius jednal s Pavlem laskavě a dovolil mu zajít k přátelům, aby se o něj postarali."
      sv: "Nästa dag lade de till i Sidon, den gamla feniciska staden på sin udde. Julius behandlade Paulus vänligt och lät honom gå till sina vänner och få omvårdnad."
      nb: "Neste dag la de til i Sidon, den gamle fønikiske byen på sitt nes. Julius behandlet Paulus vennlig og lot ham gå til vennene sine og få pleie."
      tl: "Nang sumunod na araw ay dumaong sila sa Sidon, ang matandang lungsod ng Fenicia sa kaniyang lungos. Pinakitunguhan ni Julio si Pablo nang may kagandahang-loob at pinahintulutan siyang pumaroon sa kaniyang mga kaibigan at alagaan nila."
      da: "Næste dag anløb de Sidon, den gamle fønikiske by på sit forbjerg. Julius behandlede Paulus venligt og tillod ham at gå til sine venner og få pleje."
      sr: "Сутрадан су пристали у Сидону, старом феничанском граду на свом рту. Јулије је с Павлом лепо поступао и допустио му да оде к својим пријатељима и да га они послуже."
      hu: "Másnap kikötöttek Szidónban, a fokán álló régi föníciai városban. Július emberségesen bánt Pállal, és megengedte, hogy elmenjen barátaihoz, és gondoskodjanak róla."
      fi: "Seuraavana päivänä he laskivat Sidoniin, vanhaan foinikialaiseen kaupunkiin niemellään. Julius kohteli Paavalia ystävällisesti ja salli hänen mennä ystäviensä luo saamaan hoitoa."
      vi: "Ngày hôm sau họ ghé Si-đôn, thành cổ của người Phê-ni-xi trên mũi đất của nó. Giu-lơ đãi Phao-lô cách nhân từ, cho phép ông đi thăm bạn hữu và được họ chăm sóc."
      ro: "A doua zi au tras la Sidon, vechea cetate feniciană de pe promontoriul ei. Iuliu s-a purtat omenos cu Pavel și i-a îngăduit să meargă la prietenii lui și să fie îngrijit de ei."
      bg: "На следващия ден пристанаха в Сидон, стария финикийски град на своя нос. Юлий се отнасяше човеколюбиво с Павел и му позволи да отиде при приятелите си и да получи грижите им."
  - place: aa4b3e2
