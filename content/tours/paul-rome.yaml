  - "F. Prat, 'St. Paul', The Catholic Encyclopedia, vol. 11 (1911), on the chronology of Paul's life"
  - "L. Casson, 'Speed under Sail of Ancient Ships', Transactions and Proceedings of the American Philological Association 82 (1951), 136-148"
  - "Strabo, Geography 14.3.3 (the six largest cities of the Lycian League, three votes each); 14.3.7 (Myra twenty stadia above the sea)"
  - "Strabo, Geography 14.2.15 (the two harbours, the island and causeway; Eudoxus)"
  - "Pleiades, s.v. Kaloi Limenes (place 589834) and Lasaia (place 589897)"
  - "Cassius Dio, Roman History 54.7.1 (Augustus makes Syracuse a Roman colony)"
  - "Strabo, Geography 6.1.6 (the founders, Aeschylus on the name, Dionysius, the Campanian garrison, Augustus' settlers)"
  - "Strabo, Geography 5.4.6"
