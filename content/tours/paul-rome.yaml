intro:
  en:
    - "Acts 27:1–28:16 tells how Paul, held two years at Caesarea and having appealed to Caesar, was sent to Rome as a prisoner in the charge of a centurion named Julius. The narrative speaks in the first person plural throughout. A coaster of Adramyttium took them along the coast to Sidon and under the lee of Cyprus to Myra in Lycia, where they changed to a ship of Alexandria bound for Italy. Against the wind they crept as far as Cnidus, then along the south of Crete to Fair Havens; late in the season, setting out against Paul's warning, they were caught by a north-easterly gale, driven for fourteen nights and wrecked on the island of Melita. After three months they sailed on in another Alexandrian ship by Syracuse and Rhegium to Puteoli, and went by road to Rome."
    - "James Smith reckoned in 1848 that a ship driven west from Crete by a north-easterly gale would reach Malta in about two weeks, as the fourteen nights of Acts require, and Melita is usually identified with Malta; since the tenth century some have placed the wreck on Mljet, another Melite, in the Adriatic, and other islands have been proposed. The fast, the Day of Atonement in the autumn, was already past when they lay at Fair Havens; Festus' arrival in Judea, which sent Paul on his way, is put in AD 59 or 60 (the Catholic Encyclopedia of 1911 gave 59), and the map shows the arrival in Rome at AD 60."
    - "The text counts much of the time: a day to Sidon, fourteen nights adrift, three months on the island, three days at Syracuse, a day's wait at Rhegium and the next day to Puteoli, seven days there. Those days are given with the stops; the other travel times are estimates, and the slow, contrary sailing of this voyage took far longer than the estimates."
  ru:
    - "Деян 27:1–28:16 рассказывает, как Павла, два года содержавшегося в Кесарии и потребовавшего суда кесаря, отправили в Рим как узника под надзором сотника по имени Юлий. Повествование всё время ведётся от первого лица множественного числа. Адрамитский каботажный корабль вёз их вдоль побережья до Сидона и под прикрытием Кипра до Мир Ликийских, где они пересели на александрийский корабль, шедший в Италию. Против ветра они с трудом добрались до Книда, а затем вдоль южного берега Крита до Хороших Пристаней; поздно в сезоне, отправившись вопреки предупреждению Павла, они попали в северо-восточную бурю, четырнадцать ночей носились по морю и потерпели крушение у острова Мелит. Через три месяца они поплыли дальше на другом александрийском корабле через Сиракузы и Ригию в Путеол и сушей пошли в Рим."
    - "Джеймс Смит рассчитал в 1848 году, что корабль, гонимый от Крита на запад северо-восточной бурей, достиг бы Мальты примерно за две недели, как того требуют четырнадцать ночей Деяний, и Мелит обычно отождествляют с Мальтой; с X века некоторые помещают крушение на Млет, другую Мелиту, в Адриатике, предлагались и другие острова. Пост, осенний День очищения, уже прошёл, когда они стояли в Хороших Пристанях; прибытие Феста в Иудею, после которого Павел и был отправлен в путь, относят к 59 или 60 г. н. э. (Католическая энциклопедия 1911 года давала 59), и на карте прибытие в Рим показано под 60 г. н. э."
    - "Текст отмеряет значительную часть времени: день до Сидона, четырнадцать ночей в дрейфе, три месяца на острове, три дня в Сиракузах, день ожидания в Ригии и на следующий день в Путеол, семь дней там. Эти дни указаны у остановок; остальное время в пути — оценки, а медленное плавание против ветра в этом путешествии заняло гораздо больше времени, чем по оценкам."
  uk:
    - "Дії 27:1–28:16 розповідають, як Павла, якого два роки тримали в Кесарії і який звернувся до суду кесаря, відправили до Рима як в’язня під наглядом сотника на ім’я Юлій. Оповідь увесь час ведеться від першої особи множини. Адрамітський каботажний корабель віз їх уздовж узбережжя до Сідона й під захистом Кіпру до Мир Лікійських, де вони пересіли на александрійський корабель, що йшов до Італії. Проти вітру вони ледве дісталися до Кніда, а потім уздовж півдня Криту до Добрих Пристаней; пізно в сезоні, вирушивши всупереч застереженню Павла, вони потрапили в північно-східну бурю, чотирнадцять ночей їх носило морем, і вони зазнали корабельної аварії біля острова Мелит. Через три місяці вони попливли далі іншим александрійським кораблем через Сиракузи й Регій до Путеол і суходолом пішли до Рима."
    - "Джеймс Сміт 1848 року підрахував, що корабель, який північно-східна буря гнала від Криту на захід, досяг би Мальти приблизно за два тижні, як того вимагають чотирнадцять ночей Дій, і Мелит зазвичай ототожнюють з Мальтою; від X століття дехто розміщує аварію на Млеті, іншій Мелиті, в Адріатиці, пропонували й інші острови. Піст, осінній День Очищення, уже минув, коли вони стояли в Добрих Пристанях; прибуття Феста до Юдеї, після якого Павла й вирядили в дорогу, відносять до 59 або 60 р. н. е. (Католицька енциклопедія 1911 року подавала 59), і на мапі прибуття до Рима показано під 60 р. н. е."
    - "Текст відмірює чималу частину часу: день до Сідона, чотирнадцять ночей у дрейфі, три місяці на острові, три дні в Сиракузах, день очікування в Регії й наступного дня до Путеол, сім днів там. Ці дні подано біля зупинок; решта часу в дорозі — оцінки, а повільне плавання проти вітру в цій подорожі тривало значно довше, ніж за оцінками."
  es:
    - "Hechos 27:1–28:16 cuenta cómo Pablo, retenido dos años en Cesarea y tras haber apelado a César, fue enviado preso a Roma bajo la custodia de un centurión llamado Julio. El relato habla en primera persona del plural de principio a fin. Una nave de cabotaje de Adramitio los llevó a lo largo de la costa hasta Sidón y, al abrigo de Chipre, hasta Mira de Licia, donde pasaron a una nave de Alejandría que iba a Italia. Contra el viento avanzaron a duras penas hasta Gnido y luego a lo largo del sur de Creta hasta Buenos Puertos; ya avanzada la estación, al hacerse a la mar contra la advertencia de Pablo, los sorprendió un temporal del nordeste, fueron arrastrados durante catorce noches y naufragaron en la isla de Melita. Tres meses después siguieron en otra nave alejandrina por Siracusa y Regio hasta Puteoli, y fueron por tierra a Roma."
    - "James Smith calculó en 1848 que una nave arrastrada hacia el oeste desde Creta por un temporal del nordeste llegaría a Malta en unas dos semanas, como exigen las catorce noches de los Hechos, y Melita suele identificarse con Malta; desde el siglo X algunos han situado el naufragio en Mljet, otra Melite, en el Adriático, y se han propuesto otras islas. El ayuno, el Día de la Expiación en otoño, ya había pasado cuando estaban en Buenos Puertos; la llegada de Festo a Judea, que puso a Pablo en camino, se sitúa en el 59 o el 60 d.C. (la Enciclopedia Católica de 1911 daba el 59), y el mapa muestra la llegada a Roma en el 60 d.C."
    - "El texto cuenta buena parte del tiempo: un día hasta Sidón, catorce noches a la deriva, tres meses en la isla, tres días en Siracusa, un día de espera en Regio y al día siguiente hasta Puteoli, siete días allí. Esos días se indican en las paradas; los demás tiempos de viaje son estimaciones, y la navegación lenta y con vientos contrarios de este viaje duró mucho más que las estimaciones."
  pt:
    - "Atos 27:1–28:16 conta como Paulo, detido dois anos em Cesareia e tendo apelado para César, foi enviado como prisioneiro a Roma sob a guarda de um centurião chamado Júlio. A narrativa fala na primeira pessoa do plural do princípio ao fim. Um navio de cabotagem de Adramítio levou-os ao longo da costa até Sidom e, sob o abrigo de Chipre, até Mira, na Lícia, onde passaram para um navio de Alexandria que ia para a Itália. Contra o vento, avançaram a custo até Cnido e depois ao longo do sul de Creta até Bons Portos; já no fim da estação, partindo contra o aviso de Paulo, foram apanhados por uma tempestade de nordeste, arrastados durante catorze noites e naufragaram na ilha de Malta. Três meses depois seguiram noutro navio alexandrino, por Siracusa e Régio, até Putéoli, e foram por terra a Roma."
    - "James Smith calculou em 1848 que um navio arrastado para o oeste a partir de Creta por uma tempestade de nordeste chegaria a Malta em cerca de duas semanas, como exigem as catorze noites de Atos, e a ilha, Melite em grego, é geralmente identificada com Malta; desde o século X alguns situam o naufrágio em Mljet, outra Melite, no Adriático, e outras ilhas foram propostas. O jejum, o Dia da Expiação no outono, já tinha passado quando estavam em Bons Portos; a chegada de Festo à Judeia, que pôs Paulo a caminho, é situada em 59 ou 60 d.C. (a Enciclopédia Católica de 1911 indicava 59), e o mapa mostra a chegada a Roma em 60 d.C."
    - "O texto conta boa parte do tempo: um dia até Sidom, catorze noites à deriva, três meses na ilha, três dias em Siracusa, um dia de espera em Régio e no dia seguinte até Putéoli, sete dias ali. Esses dias são indicados nas paradas; os demais tempos de viagem são estimativas, e a navegação lenta e com ventos contrários desta viagem levou muito mais tempo do que as estimativas."
  de:
    - "Apg 27:1–28:16 erzählt, wie Paulus, der zwei Jahre in Caesarea festgehalten worden war und sich auf den Kaiser berufen hatte, als Gefangener unter der Aufsicht eines Hauptmanns namens Julius nach Rom geschickt wurde. Die Erzählung spricht durchweg in der ersten Person Plural. Ein Küstenschiff aus Adramyttion brachte sie die Küste entlang nach Sidon und im Schutz Zyperns nach Myra in Lykien, wo sie auf ein Schiff aus Alexandria mit Ziel Italien umstiegen. Gegen den Wind krochen sie bis auf die Höhe von Knidos, dann an der Südseite Kretas entlang nach Schönhafen; spät in der Jahreszeit fuhren sie gegen die Warnung des Paulus aus, wurden von einem Nordoststurm erfasst, vierzehn Nächte lang getrieben und erlitten auf der Insel Melite Schiffbruch. Nach drei Monaten segelten sie auf einem anderen alexandrinischen Schiff über Syrakus und Rhegion nach Puteoli weiter und zogen auf der Straße nach Rom."
    - "James Smith berechnete 1848, dass ein von einem Nordoststurm von Kreta nach Westen getriebenes Schiff Malta in etwa zwei Wochen erreichen würde, wie es die vierzehn Nächte der Apostelgeschichte verlangen, und Melite wird gewöhnlich mit Malta gleichgesetzt; seit dem 10. Jahrhundert haben manche den Schiffbruch auf Mljet, ein anderes Melite, in der Adria verlegt, und auch andere Inseln wurden vorgeschlagen. Das Fasten, der Versöhnungstag im Herbst, war schon vorüber, als sie in Schönhafen lagen; die Ankunft des Festus in Judäa, die Paulus auf den Weg brachte, wird auf 59 oder 60 n. Chr. angesetzt (die Catholic Encyclopedia von 1911 gab 59 an), und die Karte zeigt die Ankunft in Rom im Jahr 60 n. Chr."
    - "Der Text zählt einen großen Teil der Zeit: einen Tag bis Sidon, vierzehn Nächte auf dem Meer treibend, drei Monate auf der Insel, drei Tage in Syrakus, einen Tag Warten in Rhegion und am nächsten Tag nach Puteoli, sieben Tage dort. Diese Tage werden bei den Stationen angegeben; die übrigen Reisezeiten sind Schätzungen, und das langsame Segeln gegen den Wind auf dieser Fahrt dauerte weit länger als die Schätzungen."
  fr:
    - "Ac 27:1–28:16 raconte comment Paul, détenu deux ans à Césarée et ayant fait appel à César, fut envoyé à Rome comme prisonnier, sous la garde d’un centenier nommé Julius. Le récit parle d’un bout à l’autre à la première personne du pluriel. Un caboteur d’Adramytte les mena le long de la côte jusqu’à Sidon et, à l’abri de Chypre, jusqu’à Myra en Lycie, où ils passèrent sur un navire d’Alexandrie à destination de l’Italie. Contre le vent, ils avancèrent péniblement jusqu’à la hauteur de Cnide, puis le long du sud de la Crète jusqu’à Beaux-Ports ; tard dans la saison, partis malgré l’avertissement de Paul, ils furent pris par une tempête de nord-est, ballottés quatorze nuits et jetés à la côte sur l’île de Mélita. Après trois mois, ils repartirent sur un autre navire d’Alexandrie par Syracuse et Rhegium jusqu’à Pouzzoles, et gagnèrent Rome par la route."
    - "James Smith calcula en 1848 qu’un navire poussé vers l’ouest depuis la Crète par une tempête de nord-est atteindrait Malte en deux semaines environ, comme l’exigent les quatorze nuits des Actes, et Mélita est d’ordinaire identifiée à Malte ; depuis le Xe siècle, certains ont placé le naufrage à Mljet, autre Mélite, dans l’Adriatique, et d’autres îles ont été proposées. Le jeûne, le jour des Expiations en automne, était déjà passé quand ils se trouvaient à Beaux-Ports ; l’arrivée de Festus en Judée, qui mit Paul en route, est placée en 59 ou 60 apr. J.-C. (la Catholic Encyclopedia de 1911 donnait 59), et la carte place l’arrivée à Rome en 60 apr. J.-C."
    - "Le texte compte une grande partie du temps : un jour jusqu’à Sidon, quatorze nuits à la dérive, trois mois dans l’île, trois jours à Syracuse, un jour d’attente à Rhegium et le lendemain jusqu’à Pouzzoles, sept jours sur place. Ces jours sont indiqués aux étapes ; les autres durées de trajet sont des estimations, et la navigation lente et contrariée de ce voyage prit bien plus de temps que les estimations."
  pl:
    - "Dzieje Apostolskie (Dz 27:1–28:16) opowiadają, jak Paweł, przetrzymywany przez dwa lata w Cezarei, odwoławszy się do cesarza, został wysłany do Rzymu jako więzień pod strażą setnika imieniem Juliusz. Narracja przez cały czas prowadzona jest w pierwszej osobie liczby mnogiej. Statek przybrzeżny z Adramyttium zabrał ich wzdłuż wybrzeża do Sydonu i pod osłoną Cypru do Miry w Licji, gdzie przesiedli się na okręt aleksandryjski płynący do Italii. Pod wiatr posuwali się z trudem aż do Knidos, a potem wzdłuż południowego wybrzeża Krety do Pięknych Przystani; późno w sezonie, wypłynąwszy wbrew ostrzeżeniu Pawła, zostali porwani przez północno-wschodni sztorm, przez czternaście nocy pędzeni po morzu i rozbili się na wyspie Melita. Po trzech miesiącach popłynęli dalej innym okrętem aleksandryjskim przez Syrakuzy i Regium do Puteoli, a do Rzymu poszli drogą lądową."
    - "James Smith obliczył w 1848 roku, że okręt pędzony na zachód od Krety przez północno-wschodni sztorm dotarłby do Malty w ciągu mniej więcej dwóch tygodni, jak wymaga tego czternaście nocy z Dziejów, i Melitę utożsamia się zwykle z Maltą; od X wieku niektórzy umieszczają rozbicie na Mljecie, innej Melite, na Adriatyku, proponowano też inne wyspy. Post, czyli jesienny Dzień Pojednania, już minął, gdy stali w Pięknych Przystaniach; przybycie Festusa do Judei, które wyprawiło Pawła w drogę, datuje się na 59 lub 60 n.e. (Catholic Encyclopedia z 1911 roku podawała 59), a mapa pokazuje przybycie do Rzymu w roku 60 n.e."
    - "Tekst liczy znaczną część czasu: dzień do Sydonu, czternaście nocy dryfu, trzy miesiące na wyspie, trzy dni w Syrakuzach, dzień oczekiwania w Regium i następnego dnia do Puteoli, siedem dni tam. Te dni są podane przy przystankach; pozostałe czasy przejazdu są szacunkami, a powolna żegluga pod wiatr w tym rejsie trwała znacznie dłużej, niż wynika z szacunków."
  it:
    - "At 27:1–28:16 racconta come Paolo, trattenuto due anni a Cesarea e appellatosi a Cesare, fu mandato a Roma come prigioniero, affidato a un centurione di nome Giulio. Il racconto parla dall’inizio alla fine alla prima persona plurale. Una nave di cabotaggio adramittina li portò lungo la costa fino a Sidone e, al riparo di Cipro, fino a Mira di Licia, dove passarono su una nave alessandrina diretta in Italia. Contro vento avanzarono a fatica fino di fronte a Cnido, poi lungo il sud di Creta fino a Buoni Porti; a stagione avanzata, partiti nonostante l’avvertimento di Paolo, furono colti da una burrasca di nord-est, trascinati per quattordici notti e fecero naufragio sull’isola di Melita. Dopo tre mesi ripresero il mare su un’altra nave alessandrina per Siracusa e Reggio fino a Pozzuoli, e andarono a Roma per via di terra."
    - "James Smith calcolò nel 1848 che una nave spinta verso ovest da Creta da una burrasca di nord-est avrebbe raggiunto Malta in circa due settimane, come richiedono le quattordici notti degli Atti, e Melita è di solito identificata con Malta; dal X secolo alcuni hanno collocato il naufragio a Mljet, un’altra Melite, nell’Adriatico, e sono state proposte altre isole. Il Digiuno, il giorno dell’Espiazione in autunno, era già passato quando si trovavano a Buoni Porti; l’arrivo di Festo in Giudea, che mise Paolo in viaggio, è posto nel 59 o nel 60 d.C. (la Catholic Encyclopedia del 1911 indicava il 59), e la mappa colloca l’arrivo a Roma nel 60 d.C."
    - "Il testo conta gran parte del tempo: un giorno fino a Sidone, quattordici notti alla deriva, tre mesi sull’isola, tre giorni a Siracusa, un giorno di attesa a Reggio e il giorno dopo fino a Pozzuoli, sette giorni lì. Questi giorni sono indicati per le tappe; gli altri tempi di viaggio sono stime, e la navigazione lenta e contrastata di questo viaggio richiese molto più tempo delle stime."
  nl:
    - "Hand 27:1–28:16 vertelt hoe Paulus, die twee jaar te Caesarea vastgehouden was en zich op de keizer had beroepen, als gevangene naar Rome werd gezonden onder toezicht van een hoofdman genaamd Julius. Het verhaal spreekt van begin tot eind in de eerste persoon meervoud. Een kustvaarder uit Adramyttium bracht hen langs de kust naar Sidon en onder de wal van Cyprus naar Myra in Lycië, waar zij overstapten op een schip van Alexandrië dat naar Italië voer. Tegen de wind in kropen zij tot ter hoogte van Knidus, en daarna langs de zuidkant van Kreta naar Schone Havens; laat in het seizoen voeren zij tegen de waarschuwing van Paulus uit, werden overvallen door een noordoostelijke storm, veertien nachten voortgedreven en leden schipbreuk op het eiland Melite. Na drie maanden voeren zij verder met een ander Alexandrijns schip via Syracuse en Regium naar Puteoli, en gingen over de weg naar Rome."
    - "James Smith berekende in 1848 dat een schip dat door een noordoostelijke storm van Kreta naar het westen werd gedreven, Malta in ongeveer twee weken zou bereiken, zoals de veertien nachten van Handelingen vereisen, en Melite wordt gewoonlijk met Malta geïdentificeerd; sinds de tiende eeuw plaatsen sommigen de schipbreuk op Mljet, een ander Melite, in de Adriatische Zee, en er zijn ook andere eilanden voorgesteld. De vasten, de Grote Verzoendag in de herfst, was al voorbij toen zij bij Schone Havens lagen; de aankomst van Festus in Judea, die Paulus op weg zond, wordt gesteld op 59 of 60 n.Chr. (de Catholic Encyclopedia van 1911 gaf 59), en de kaart toont de aankomst in Rome in 60 n.Chr."
    - "De tekst telt een groot deel van de tijd: een dag naar Sidon, veertien nachten op drift, drie maanden op het eiland, drie dagen te Syracuse, een dag wachten te Regium en de volgende dag naar Puteoli, zeven dagen daar. Die dagen staan bij de haltes; de andere reistijden zijn schattingen, en het trage zeilen tegen de wind op deze reis duurde veel langer dan de schattingen."
  cs:
    - "Skutky apoštolů (Sk 27:1–28:16) vyprávějí, jak byl Pavel, dva roky držený v Cesareji, poté co se odvolal k císaři, poslán jako vězeň do Říma pod dozorem setníka jménem Julius. Text vypráví po celou dobu v první osobě množného čísla. Pobřežní loď z Adramyttia je vezla podél pobřeží do Sidónu a v závětří Kypru do Myry v Lykii, kde přestoupili na alexandrijskou loď plující do Itálie. Proti větru se pomalu sunuli až ke Knidu a pak podél jižního pobřeží Kréty do Dobrých přístavů; pozdě v sezóně vypluli navzdory Pavlovu varování, zastihla je severovýchodní vichřice, čtrnáct nocí je hnala po moři a ztroskotali na ostrově Melita. Po třech měsících pluli dál jinou alexandrijskou lodí přes Syrakusy a Regium do Puteolí a do Říma šli po silnici."
    - "James Smith v roce 1848 spočítal, že loď hnaná severovýchodní vichřicí od Kréty na západ by doplula k Maltě asi za dva týdny, jak to vyžaduje čtrnáct nocí ze Skutků, a Melita se obvykle ztotožňuje s Maltou; od 10. století kladou někteří ztroskotání na Mljet, jinou Melite, v Jaderském moři, a byly navrženy i další ostrovy. Půst, tedy podzimní Den smíření, už minul, když stáli v Dobrých přístavech; příchod Festa do Judska, který Pavla vypravil na cestu, se klade do roku 59 nebo 60 n. l. (Catholic Encyclopedia z roku 1911 uváděla rok 59) a mapa ukazuje příchod do Říma v roce 60 n. l."
    - "Text počítá velkou část času: den do Sidónu, čtrnáct nocí na moři bez vlády nad lodí, tři měsíce na ostrově, tři dny v Syrakusách, den čekání v Regiu a druhý den do Puteolí, sedm dní tam. Tyto dny jsou uvedeny u zastávek; ostatní doby cesty jsou odhady a pomalá plavba proti větru trvala na této cestě mnohem déle, než udávají odhady."
  sv:
    - "Apg 27:1–28:16 berättar hur Paulus, som hade hållits fången två år i Caesarea och hade vädjat till kejsaren, sändes till Rom som fånge under uppsikt av en hövitsman vid namn Julius. Berättelsen talar i första person plural hela vägen. Ett kustfartyg från Adramyttium förde dem längs kusten till Sidon och i lä av Cypern till Myra i Lycien, där de bytte till ett skepp från Alexandria på väg till Italien. I motvind kröp de fram till Knidos och sedan längs Kretas södra kust till Goda hamnarna; sent på säsongen gav de sig av mot Paulus’ varning, fångades av en nordostlig storm, drev i fjorton nätter och led skeppsbrott på ön Melita. Efter tre månader seglade de vidare med ett annat alexandrinskt skepp via Syrakusa och Rhegion till Puteoli och fortsatte landvägen till Rom."
    - "James Smith beräknade 1848 att ett skepp som drevs västerut från Kreta av en nordostlig storm skulle nå Malta på omkring två veckor, så som Apostlagärningarnas fjorton nätter kräver, och Melita identifieras vanligen med Malta; sedan 900-talet har somliga förlagt skeppsbrottet till Mljet, ett annat Melite, i Adriatiska havet, och andra öar har också föreslagits. Fastan, försoningsdagen på hösten, var redan förbi när de låg i Goda hamnarna; Festus ankomst till Judeen, som sände Paulus i väg, dateras till 59 eller 60 e.Kr. (Catholic Encyclopedia från 1911 angav 59), och kartan visar ankomsten till Rom år 60 e.Kr."
    - "Texten räknar mycket av tiden: en dag till Sidon, fjorton nätter på drift, tre månader på ön, tre dagar i Syrakusa, en dags väntan i Rhegion och nästa dag till Puteoli, sju dagar där. De dagarna anges vid stationerna; övriga restider är uppskattningar, och den långsamma seglingen i motvind på denna resa tog betydligt längre tid än uppskattningarna."
  nb:
    - "Apg 27:1–28:16 forteller hvordan Paulus, som hadde vært holdt i to år i Cæsarea og hadde anket til keiseren, ble sendt til Roma som fange under oppsyn av en høvedsmann ved navn Julius. Fortellingen taler i første person flertall hele veien. Et kystfartøy fra Adramyttium førte dem langs kysten til Sidon og i le av Kypros til Myra i Lykia, der de byttet til et skip fra Aleksandria som skulle til Italia. I motvind krøp de fram til Knidos og så langs sørsiden av Kreta til Godhavn; sent i sesongen dro de ut mot Paulus' advarsel, ble fanget av en nordøstlig storm, drev i fjorten netter og led skipbrudd på øya Melita. Etter tre måneder seilte de videre med et annet aleksandrinsk skip om Syrakus og Regium til Puteoli og dro landeveien til Roma."
    - "James Smith regnet i 1848 ut at et skip som ble drevet vestover fra Kreta av en nordøstlig storm, ville nå Malta på omkring to uker, slik Apostlenes gjerningers fjorten netter krever, og Melita blir vanligvis identifisert med Malta; siden 900-tallet har noen plassert skipbruddet på Mljet, et annet Melite, i Adriaterhavet, og andre øyer er også foreslått. Fasten, forsoningsdagen om høsten, var allerede over da de lå i Godhavn; Festus' ankomst til Judea, som sendte Paulus av sted, settes til 59 eller 60 e.Kr. (Catholic Encyclopedia fra 1911 oppga 59), og kartet viser ankomsten til Roma i 60 e.Kr."
    - "Teksten teller mye av tiden: en dag til Sidon, fjorten netter i drift, tre måneder på øya, tre dager i Syrakus, en dags venting i Regium og neste dag til Puteoli, sju dager der. Disse dagene er oppgitt ved stoppestedene; de andre reisetidene er anslag, og den langsomme seilingen i motvind på denne reisen tok langt lengre tid enn anslagene."
  tl:
    - "Isinasalaysay ng Gawa 27:1–28:16 kung paanong si Pablo, na dalawang taong hawak sa Cesarea at nakapag-apela na kay Cesar, ay ipinadala sa Roma bilang bilanggo sa pangangalaga ng isang senturion na nagngangalang Julio. Nagsasalita ang salaysay sa unang panauhang maramihan sa kabuuan nito. Isang daong pambaybayin ng Adrameto ang nagdala sa kanila sa kahabaan ng baybayin hanggang Sidon at nanganganlong sa Chipre hanggang Mira sa Licia, kung saan lumipat sila sa isang daong Alejandria na patungong Italia. Laban sa hangin ay marahan silang nakarating hanggang sa tapat ng Gnido, saka sa kahabaan ng timog ng Creta hanggang Mabubuting Daongan; huli na sa panahon, nang tumulak sila laban sa babala ni Pablo, inabot sila ng isang unos mula sa hilagang-silangan, ipinadpad nang labing-apat na gabi at nawasak sa pulo ng Melita. Pagkaraan ng tatlong buwan ay naglayag sila sa isa pang daong Alejandria sa pamamagitan ng Siracusa at Regio hanggang Puteoli, at naglakbay sa lupa hanggang Roma."
    - "Tinantiya ni James Smith noong 1848 na ang isang daong na ipinadpad pakanluran mula sa Creta ng unos mula sa hilagang-silangan ay aabot sa Malta sa halos dalawang linggo, gaya ng hinihingi ng labing-apat na gabi sa Mga Gawa, at ang Melita ay karaniwang kinikilalang Malta; mula noong ika-10 siglo, inilagay ng ilan ang pagkawasak sa Mljet, ibang Melite, sa Adriatiko, at iminungkahi ang iba pang mga pulo. Nakalampas na ang Pag-aayuno, ang Araw ng Pagtubos sa taglagas, nang sila'y nasa Mabubuting Daongan; ang pagdating ni Festo sa Judea, na nagpalakad kay Pablo, ay inilalagay sa 59 o 60 AD (ang Catholic Encyclopedia ng 1911 ay nagbigay ng 59), at ipinapakita ng mapa ang pagdating sa Roma sa 60 AD."
    - "Binibilang ng teksto ang malaking bahagi ng panahon: isang araw hanggang Sidon, labing-apat na gabing pagkaanod, tatlong buwan sa pulo, tatlong araw sa Siracusa, isang araw na paghihintay sa Regio at nang kinabukasan hanggang Puteoli, pitong araw doon. Ang mga araw na iyon ay nakalagay sa mga hintuan; ang iba pang oras ng paglalakbay ay mga tantiya, at ang marahan at pasalungat na paglalayag na ito ay tumagal nang higit pa kaysa sa mga tantiya."
  da:
    - "ApG 27:1–28:16 fortæller, hvordan Paulus, der havde været holdt fanget to år i Cæsarea og havde appelleret til kejseren, blev sendt til Rom som fange i varetægt hos en høvedsmand ved navn Julius. Beretningen taler i første person flertal hele vejen. Et kystfartøj fra Adramyttium bragte dem langs kysten til Sidon og ind under Cypern til Myra i Lykien, hvor de skiftede til et skib fra Alexandria på vej til Italien. Mod vinden sneg de sig frem til Knidos og derefter langs Kretas sydside til Gode Havne; sent på sæsonen sejlede de videre mod Paulus' advarsel, blev fanget af en nordøstlig storm, drev i fjorten nætter og led skibbrud på øen Melite. Efter tre måneder sejlede de videre i et andet skib fra Alexandria via Syrakus og Regium til Puteoli og drog ad landevejen til Rom."
    - "James Smith beregnede i 1848, at et skib, der drives mod vest fra Kreta af en nordøstlig storm, ville nå Malta på omkring to uger, sådan som de fjorten nætter i Apostlenes Gerninger kræver, og Melite identificeres normalt med Malta; siden det 10. århundrede har nogle henlagt forliset til Mljet, en anden Melite, i Adriaterhavet, og andre øer er blevet foreslået. Fasten, forsoningsdagen om efteråret, var allerede forbi, da de lå ved Gode Havne; Festus' ankomst til Judæa, som sendte Paulus af sted, henlægges til 59 eller 60 e.Kr. (Catholic Encyclopedia fra 1911 angav 59), og kortet viser ankomsten til Rom i 60 e.Kr."
    - "Teksten tæller meget af tiden: en dag til Sidon, fjorten nætter på drift, tre måneder på øen, tre dage i Syrakus, en dags venten i Regium og næste dag til Puteoli, syv dage der. Disse dage er angivet ved de enkelte stop; de øvrige rejsetider er skøn, og den langsomme sejlads mod vinden på denne rejse tog langt længere tid end skønnene."
  sr:
    - "Дела апостолска, од 27:1 до 28:16, приповедају како је Павле, који је две године држан у Цезареји и који се позвао на ћесара, послан у Рим као сужањ под надзором стотника по имену Јулије. Приповест читавим путем говори у првом лицу множине. Једна адрамитска обалска лађа одвезла их је дуж обале до Сидона и у заветрини Кипра до Мире у Ликији, где су прешли на александријску лађу која је пловила у Италију. Против ветра једва су се довукли до Книда, а затим дуж јужне обале Крита до Добрих пристаништа; касно у сезони, кренувши упркос Павловом упозорењу, захватила их је североисточна бура, носила их четрнаест ноћи и они су доживели бродолом на острву Мелити. После три месеца пловили су даље другом александријском лађом преко Сиракузе и Ригије до Путеола, и копном отишли у Рим."
    - "Џејмс Смит израчунао је 1848. да би лађа коју североисточна бура тера на запад од Крита стигла до Малте за око две недеље, како захтева четрнаест ноћи из Дела, и Мелита се обично поистовећује с Малтом; од 10. века неки смештају бродолом на Мљет, другу Мелиту, у Јадрану, а предлагана су и друга острва. Пост, јесењи Дан помирења, већ је био прошао кад су стајали у Добрим пристаништима; Фистов долазак у Јудеју, који је Павла послао на пут, смешта се у 59. или 60. н. е. (Католичка енциклопедија из 1911. давала је 59), а карта приказује долазак у Рим у 60. н. е."
    - "Текст броји велики део времена: дан до Сидона, четрнаест ноћи ношења морем, три месеца на острву, три дана у Сиракузи, дан чекања у Ригији и сутрадан до Путеола, седам дана тамо. Ти дани наведени су уз станице; остала трајања пута процене су, а спора пловидба уз противне ветрове на овом путовању трајала је много дуже од процена."
  hu:
    - "Az ApCsel 27:1–28:16 elbeszéli, hogyan küldték Pált, akit két évig tartottak fogva Cézáreában, és aki a császárhoz fellebbezett, foglyként Rómába egy Július nevű százados őrizetében. Az elbeszélés végig többes szám első személyben szól. Egy adramüttioni parti hajó vitte őket a part mentén Szidónba, és Ciprus szélvédett oldalán a lükiai Mürába, ahol egy Itáliába tartó alexandriai hajóra szálltak át. Széllel szemben vergődtek el Knidoszig, majd Kréta déli partja mentén a Szép Kikötőkig; késő évszakban, Pál figyelmeztetése ellenére elindulva elkapta őket egy északkeleti vihar, tizennégy éjszakán át sodródtak, és Melita szigetén hajótörést szenvedtek. Három hónap múlva egy másik alexandriai hajón Szirakúzán és Régiumon át Puteoliba hajóztak, és szárazföldön mentek Rómába."
    - "James Smith 1848-ban kiszámította, hogy egy Krétától északkeleti viharral nyugatra hajtott hajó mintegy két hét alatt érné el Máltát, ahogy az ApCsel tizennégy éjszakája megkívánja, és Melitát általában Máltával azonosítják; a 10. század óta egyesek a hajótörést Mljetre, egy másik Melitére helyezik az Adriai-tengeren, és más szigeteket is javasoltak. A böjt, az őszi engesztelés napja már elmúlt, amikor a Szép Kikötőkben vesztegeltek; Fesztusz júdeai érkezését, amely útnak indította Pált, Kr. u. 59-re vagy 60-ra teszik (az 1911-es Catholic Encyclopedia 59-et adott meg), a térkép pedig a Rómába érkezést Kr. u. 60-nál mutatja."
    - "A szöveg az idő nagy részét számolja: egy nap Szidónig, tizennégy éjszaka sodródás, három hónap a szigeten, három nap Szirakúzában, egynapi várakozás Régiumban és másnap Puteoliig, hét nap ott. Ezeket a napokat az állomásoknál adjuk meg; a többi utazási idő becslés, és ennek az útnak lassú, ellenszeles hajózása sokkal tovább tartott a becsléseknél."
  fi:
    - "Apt 27:1–28:16 kertoo, kuinka Paavali, jota oli pidetty kaksi vuotta Kesareassa ja joka oli vedonnut keisariin, lähetettiin Roomaan vankina Julius-nimisen sadanpäämiehen valvonnassa. Kertomus puhuu koko ajan monikon ensimmäisessä persoonassa. Adramyttiläinen rannikkoalus vei heidät rannikkoa pitkin Sidoniin ja Kyproksen suojassa Lykian Myraan, jossa he siirtyivät Italiaan menevään aleksandrialaiseen laivaan. Vastatuulessa he etenivät hitaasti Knidokseen asti ja sitten Kreetan etelärantaa pitkin Kauniisiin satamiin; myöhään purjehduskaudella he lähtivät Paavalin varoituksesta huolimatta liikkeelle, joutuivat koillismyrskyyn, ajelehtivat neljätoista yötä ja haaksirikkoutuivat Meliten saarella. Kolmen kuukauden kuluttua he purjehtivat toisella aleksandrialaisella laivalla Syrakusan ja Regionin kautta Puteoliin ja kulkivat maitse Roomaan."
    - "James Smith laski vuonna 1848, että koillismyrskyn Kreetalta länteen ajama laiva saapuisi Maltalle noin kahdessa viikossa, kuten Apostolien tekojen neljätoista yötä edellyttävät, ja Melite samastetaan yleensä Maltaan; 900-luvulta lähtien jotkut ovat sijoittaneet haaksirikon Mljetille, toiselle Melitelle, Adrianmerellä, ja muitakin saaria on ehdotettu. Paasto, syksyinen sovituspäivä, oli jo ohi, kun he olivat Kauniissa satamissa; Festuksen saapuminen Juudeaan, jonka myötä Paavali lähetettiin matkaan, ajoitetaan vuoteen 59 tai 60 jaa. (vuoden 1911 Catholic Encyclopedia esitti vuoden 59), ja kartta näyttää saapumisen Roomaan vuonna 60 jaa."
    - "Teksti laskee suuren osan ajasta: päivä Sidoniin, neljätoista yötä ajelehtien, kolme kuukautta saarella, kolme päivää Syrakusassa, päivän odotus Regionissa ja seuraavana päivänä Puteoliin, seitsemän päivää siellä. Nämä päivät on annettu pysähdyspaikkojen yhteydessä; muut matka-ajat ovat arvioita, ja tämän matkan hidas purjehdus vastatuuleen kesti paljon kauemmin kuin arviot."
  vi:
    - "Công 27:1–28:16 thuật lại việc Phao-lô, bị giam hai năm tại Sê-sa-rê và đã kháng án lên Sê-sa, bị giải đến Rô-ma làm tù nhân dưới quyền một thầy đội tên là Giu-lơ. Bản văn kể ở ngôi thứ nhất số nhiều suốt từ đầu đến cuối. Một chiếc tàu chạy ven biển của A-tra-mít đưa họ dọc bờ biển đến Si-đôn rồi men theo phía khuất gió của Chíp-rơ đến My-ra xứ Ly-si, nơi họ đổi sang một chiếc tàu A-léc-xan-tri đi Y-ta-li. Ngược gió, họ chậm chạp đi đến ngang Cơ-nít, rồi dọc phía nam Cơ-rết đến Hải cảng Tốt; khi mùa đã muộn, ra khơi trái với lời cảnh báo của Phao-lô, họ gặp một trận bão đông bắc, bị trôi dạt mười bốn đêm và bị đắm tàu tại đảo Man-tơ. Sau ba tháng họ đi tiếp trên một chiếc tàu A-léc-xan-tri khác qua Sy-ra-cu-sơ và Rê-ghi-um đến Bu-xô-lơ, rồi theo đường bộ đến Rô-ma."
    - "Năm 1848, James Smith tính rằng một chiếc tàu bị bão đông bắc đẩy về phía tây từ Cơ-rết sẽ đến Man-tơ trong khoảng hai tuần, đúng như mười bốn đêm mà sách Công vụ đòi hỏi, và Melita thường được đồng nhất với Man-tơ; từ thế kỷ 10, một số người đặt vụ đắm tàu ở Mljet, một Melite khác, trong biển Adriatic, và các đảo khác cũng được đề nghị. Kỳ Kiêng ăn, tức Ngày Lễ Chuộc Tội vào mùa thu, đã qua rồi khi họ đậu tại Hải cảng Tốt; việc Phê-tu đến Giu-đê, là việc khiến Phao-lô được giải đi, được đặt vào năm 59 hoặc 60 (Catholic Encyclopedia năm 1911 đưa ra năm 59), và bản đồ thể hiện việc đến Rô-ma vào năm 60."
    - "Bản văn đếm phần lớn thời gian: một ngày đến Si-đôn, mười bốn đêm trôi dạt, ba tháng trên đảo, ba ngày tại Sy-ra-cu-sơ, một ngày chờ tại Rê-ghi-um và ngày hôm sau đến Bu-xô-lơ, bảy ngày ở đó. Những ngày ấy được ghi kèm các điểm dừng; các thời gian đi đường khác là ước tính, và cuộc hành trình chậm chạp, ngược gió này mất nhiều thời gian hơn các ước tính rất nhiều."
  ro:
    - "Fapte 27:1–28:16 povestește cum Pavel, ținut doi ani la Cezareea și făcând apel la Cezar, a fost trimis la Roma ca prizonier, în paza unui sutaș numit Iuliu. Narațiunea vorbește tot timpul la persoana întâi plural. O corabie de coastă din Adramitiu i-a dus de-a lungul țărmului la Sidon și la adăpostul Ciprului la Mira Liciei, unde au trecut pe o corabie din Alexandria care mergea spre Italia. Împotriva vântului au înaintat anevoie până la Cnid, apoi de-a lungul sudului Cretei până la Bunele Porturi; târziu în anotimp, pornind în ciuda avertismentului lui Pavel, au fost prinși de o furtună de nord-est, purtați paisprezece nopți și au naufragiat pe insula Melit. După trei luni au navigat mai departe cu o altă corabie alexandrină prin Siracuza și Regium la Puteoli și au mers pe uscat la Roma."
    - "James Smith a socotit în 1848 că o corabie mânată spre vest de la Creta de o furtună de nord-est ar ajunge la Malta în vreo două săptămâni, cum cer cele paisprezece nopți din Fapte, iar Melit este identificat de obicei cu Malta; din secolul al X-lea, unii au așezat naufragiul pe Mljet, o altă Melite, în Marea Adriatică, și au fost propuse și alte insule. Postul, Ziua Ispășirii de toamnă, trecuse deja când stăteau la Bunele Porturi; sosirea lui Festus în Iudeea, care l-a trimis pe Pavel la drum, este pusă în 59 sau 60 d.Hr. (Catholic Encyclopedia din 1911 dădea 59), iar harta arată sosirea la Roma în anul 60 d.Hr."
    - "Textul numără mare parte din timp: o zi până la Sidon, paisprezece nopți în derivă, trei luni pe insulă, trei zile la Siracuza, o zi de așteptare la Regium și a doua zi până la Puteoli, șapte zile acolo. Aceste zile sunt date la opriri; celelalte durate de drum sunt estimări, iar navigația înceată, cu vânt potrivnic, a acestei călătorii a durat mult mai mult decât estimările."
  bg:
    - "Деяния, от 27:1 до 28:16, разказват как Павел, задържан две години в Кесария и обжалвал пред Кесаря, беше изпратен в Рим като затворник под надзора на стотник на име Юлий. Разказът е изцяло в първо лице множествено число. Един адрамитски кораб за крайбрежно плаване ги отведе покрай брега до Сидон и под прикритието на Кипър до Мира в Ликия, където се прехвърлиха на александрийски кораб, плаващ за Италия. Срещу вятъра те едва стигнаха до Книд, а после по южния бряг на Крит до Добри пристанища; късно през сезона, тръгнали въпреки предупреждението на Павел, бяха застигнати от североизточна буря, носени четиринадесет нощи и претърпяха корабокрушение на остров Мелит. След три месеца продължиха с друг александрийски кораб през Сиракуза и Ригия до Потиоли и отидоха по суша до Рим."
    - "Джеймс Смит изчислява през 1848 г., че кораб, носен на запад от Крит от североизточна буря, би стигнал до Малта за около две седмици, както изискват четиринадесетте нощи в Деяния, и Мелит обикновено се отъждествява с Малта; от X в. насам някои поставят корабокрушението на Млет, друг Мелит, в Адриатическо море, а предлагани са и други острови. Постът, Денят на умилостивението през есента, вече беше минал, когато бяха в Добри пристанища; пристигането на Фест в Юдея, което изпрати Павел на път, се поставя в 59 или 60 г. н.е. (Католическата енциклопедия от 1911 г. дава 59 г.), а картата показва пристигането в Рим в 60 г. н.е."
    - "Текстът брои голяма част от времето: един ден до Сидон, четиринадесет нощи носене по морето, три месеца на острова, три дни в Сиракуза, един ден чакане в Ригия и на следващия ден до Потиоли, седем дни там. Тези дни са дадени при спирките; другите времена за път са оценки, а бавното плаване при противни ветрове по време на това пътуване продължи много по-дълго от оценките."
stops:
  - place: a58735e
    # Caesarea is named in 25:13-24, where Paul is held; 27:1-2 sails from there
    # without naming it (listed in build-content as a stop named by its context).
    ref: Acts.27.1-Acts.27.2
    note:
      en: "Held at Caesarea, Paul sails for Italy as a prisoner."
      ru: "Из Кесарии, где его держали под стражей, Павел отплывает в Италию."
      uk: "Утримуваний у Кесарії, Павло відпливає до Італії як в’язень."
      es: "Retenido en Cesarea, Pablo zarpa para Italia como preso."
      pt: "Detido em Cesareia, Paulo navega para a Itália como prisioneiro."
      de: "In Caesarea in Haft, segelt Paulus als Gefangener nach Italien."
      fr: "Détenu à Césarée, Paul s’embarque pour l’Italie comme prisonnier."
      pl: "Przetrzymywany w Cezarei, Paweł odpływa do Italii jako więzień."
      it: "Trattenuto a Cesarea, Paolo salpa per l’Italia come prigioniero."
      nl: "Vastgehouden te Caesarea vaart Paulus als gevangene naar Italië."
      cs: "Držen v Cesareji, vyplouvá Pavel jako vězeň do Itálie."
      sv: "Fången i Caesarea seglar Paulus som fånge mot Italien."
      nb: "Holdt i Cæsarea seiler Paulus som fange til Italia."
      tl: "Hawak sa Cesarea, naglayag si Pablo patungong Italia bilang bilanggo."
      da: "Fastholdt i Cæsarea sejler Paulus som fange til Italien."
      sr: "Задржан у Цезареји, Павле као сужањ плови у Италију."
      hu: "Cézáreában fogva tartva Pál foglyként hajózik Itáliába."
      fi: "Kesareassa pidätettynä Paavali purjehtii Italiaan vankina."
      vi: "Bị giam tại Sê-sa-rê, Phao-lô xuống tàu đi Y-ta-li với tư cách tù nhân."
      ro: "Ținut la Cezareea, Pavel pornește pe mare spre Italia ca prizonier."
      bg: "Задържан в Кесария, Павел отплава за Италия като затворник."
    story:
      en: "When it was decided that they should sail for Italy, Paul and some other prisoners were handed over to a centurion of the Augustan cohort named Julius. They went on board a ship of Adramyttium, which was to sail along the coasts of Asia, and put to sea from Caesarea; Aristarchus, a Macedonian of Thessalonica, was with them."
      ru: "Когда было решено, что им плыть в Италию, Павла и некоторых других узников передали сотнику Августова полка по имени Юлий. Они взошли на адрамитский корабль, который должен был плыть вдоль берегов Асии, и вышли в море из Кесарии; с ними был Аристарх, македонянин из Фессалоники."
      uk: "Коли вирішили, що вони мають плисти до Італії, Павла й деяких інших в’язнів передали сотникові Августової когорти на ім’я Юлій. Вони сіли на адрамітський корабель, що мав плисти вздовж берегів Азії, і вийшли в море з Кесарії; з ними був Аристарх, македонянин із Солуня."
      es: "Cuando se decidió que navegaran a Italia, Pablo y algunos otros presos fueron entregados a un centurión de la compañía Augusta llamado Julio. Subieron a bordo de una nave de Adramitio que iba a navegar por las costas de Asia y se hicieron a la mar desde Cesarea; Aristarco, macedonio de Tesalónica, estaba con ellos."
      pt: "Quando se decidiu que navegariam para a Itália, Paulo e alguns outros prisioneiros foram entregues a um centurião da coorte Augusta chamado Júlio. Embarcaram num navio de Adramítio, que ia navegar ao longo das costas da Ásia, e fizeram-se ao mar a partir de Cesareia; Aristarco, um macedônio de Tessalônica, estava com eles."
      de: "Als beschlossen war, dass sie nach Italien segeln sollten, wurden Paulus und einige andere Gefangene einem Hauptmann der Augusteischen Kohorte namens Julius übergeben. Sie bestiegen ein Schiff aus Adramyttion, das die Küsten Asiens entlangfahren sollte, und stachen von Caesarea aus in See; Aristarch, ein Mazedonier aus Thessalonich, war bei ihnen."
      fr: "Lorsqu’il fut décidé qu’ils s’embarqueraient pour l’Italie, Paul et quelques autres prisonniers furent remis à un centenier de la cohorte Auguste nommé Julius. Ils montèrent sur un navire d’Adramytte qui devait longer les côtes d’Asie et partirent de Césarée ; Aristarque, Macédonien de Thessalonique, était avec eux."
      pl: "Gdy postanowiono, że mają płynąć do Italii, Pawła i kilku innych więźniów przekazano setnikowi kohorty Augusta imieniem Juliusz. Weszli na pokład okrętu z Adramyttium, który miał płynąć wzdłuż wybrzeży Azji, i wypłynęli z Cezarei; był z nimi Arystarch, Macedończyk z Tesaloniki."
      it: "Quando fu deciso che navigassero verso l’Italia, Paolo e alcuni altri prigionieri furono consegnati a un centurione della coorte Augusta di nome Giulio. Salirono su una nave adramittina che doveva costeggiare l’Asia e presero il mare da Cesarea; con loro c’era Aristarco, Macedone di Tessalonica."
      nl: "Toen besloten was dat zij naar Italië zouden varen, werden Paulus en enkele andere gevangenen overgedragen aan een hoofdman van de Augustaanse cohort genaamd Julius. Zij gingen aan boord van een schip uit Adramyttium, dat langs de kusten van Asia zou varen, en staken van Caesarea uit in zee; Aristarchus, een Macedoniër uit Tessalonica, was bij hen."
      cs: "Když bylo rozhodnuto, že mají plout do Itálie, byli Pavel a několik dalších vězňů předáni setníkovi Augustovy kohorty jménem Julius. Nastoupili na loď z Adramyttia, která měla plout podél pobřeží Asie, a vypluli z Cesareje; byl s nimi Aristarchos, Makedonec z Tesaloniky."
      sv: "När det hade beslutats att de skulle segla till Italien, överlämnades Paulus och några andra fångar åt en hövitsman vid den kejserliga kohorten som hette Julius. De gick ombord på ett skepp från Adramyttium, som skulle segla längs Asiens kuster, och lade ut från Caesarea; Aristarchos, en makedonier från Tessalonike, var med dem."
      nb: "Da det var bestemt at de skulle seile til Italia, ble Paulus og noen andre fanger overgitt til en høvedsmann ved den keiserlige hærdelingen som het Julius. De gikk om bord i et skip fra Adramyttium, som skulle seile langs kystene av Asia, og stakk til sjøs fra Cæsarea; Aristarkos, en makedoner fra Tessalonika, var med dem."
      tl: "Nang ipasiya na lalayag sila patungo sa Italia, ibinigay si Pablo at ang iba pang mga bilanggo sa isang senturion ng pulutong ni Augusto na nagngangalang Julio. Lumulan sila sa isang daong ng Adrameto na palayag sa mga baybayin ng Asia, at tumulak mula sa Cesarea; kasama nila si Aristarco, isang taga-Macedonia mula sa Tesalonica."
      da: "Da det var besluttet, at de skulle sejle til Italien, blev Paulus og nogle andre fanger overgivet til en høvedsmand af den kejserlige afdeling, som hed Julius. De gik om bord på et skib fra Adramyttium, som skulle sejle langs Asiens kyster, og stak i søen fra Cæsarea; Aristarkus, en makedonier fra Thessalonika, var med dem."
      sr: "Кад је одлучено да отплове у Италију, Павле и неки други сужњи предати су стотнику Августове кохорте по имену Јулије. Укрцали су се на адрамитску лађу, која је требало да плови дуж обала Азије, и испловили из Цезареје; с њима је био Аристарх, Македонац из Солуна."
      hu: "Amikor elhatározták, hogy Itáliába hajóznak, Pált és néhány más foglyot átadták a császári csapattest egy Július nevű századosának. Beszálltak egy adramüttioni hajóba, amely Ázsia partjai mentén készült hajózni, és kifutottak Cézáreából; velük volt Arisztarkhosz, egy thesszalonikai macedón."
      fi: "Kun oli päätetty, että heidän oli purjehdittava Italiaan, Paavali ja muutamat muut vangit annettiin keisarilliseen sotaväenosastoon kuuluvan Julius-nimisen sadanpäämiehen haltuun. He astuivat adramyttiläiseen laivaan, jonka oli määrä purjehtia Aasian rannikkoja pitkin, ja lähtivät merelle Kesareasta; mukana oli Aristarkos, makedonialainen Tessalonikasta."
      vi: "Khi đã định rằng họ phải đi thuyền sang Y-ta-li, Phao-lô và mấy tù nhân khác được giao cho một thầy đội thuộc đội quân Âu-gu-ta tên là Giu-lơ. Họ xuống một chiếc tàu của A-tra-mít sắp đi dọc các bờ biển A-si, và ra khơi từ Sê-sa-rê; A-ri-tạc, người Ma-xê-đoan quê ở Tê-sa-lô-ni-ca, cùng đi với họ."
      ro: "Când s-a hotărât să plece pe mare spre Italia, Pavel și alți câțiva prizonieri au fost dați în seama unui sutaș din cohorta Augusta, numit Iuliu. S-au urcat pe o corabie din Adramitiu, care urma să navigheze de-a lungul coastelor Asiei, și au ieșit în larg de la Cezareea; cu ei era Aristarh, un macedonean din Tesalonic."
      bg: "Когато беше решено да отплават за Италия, Павел и някои други затворници бяха предадени на стотник от Августовия полк на име Юлий. Те се качиха на един адрамитски кораб, който щеше да плава покрай бреговете на Азия, и излязоха в морето от Кесария; с тях беше Аристарх, македонец от Солун."
  - place: a98e4d7
    ref: Acts.27.3
