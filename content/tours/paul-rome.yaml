  - place: aae626a
    ref: Acts.27.8-Acts.27.12
    by: sea
    note:
      en: 'Fair Havens; Paul warns that "this voyage will be with hurt and much damage, not only of the lading and ship, but also of our lives."'
      ru: "Хорошие Пристани; Павел предупреждает, что «плавание будет с затруднениями и с большим вредом не только для груза и корабля, но и для нашей жизни»."
      uk: "Добрі Пристані; Павло застерігає: «з утратою і з великою шкодою, не тільки для тягару і для статку, та й для душ наших буде плаваннє»."
      es: "Buenos Puertos; Pablo advierte que «con trabajo y mucho daño, no sólo de la cargazón y de la nave, mas aun de nuestras personas, habrá de ser la navegación»."
      pt: "Bons Portos; Paulo adverte que “a viagem trará prejuízo e grande perda, não só da carga e do navio, mas também de nossas vidas.”"
      de: "Schönhafen; Paulus warnt: „ich sehe, daß die Schiffahrt will mit Leid und großem Schaden ergehen, nicht allein der Last und des Schiffes sondern auch unsers Lebens“."
      fr: "Beaux-Ports ; Paul avertit : « la navigation ne se fera pas sans péril et sans beaucoup de dommage, non seulement pour la cargaison et pour le navire, mais encore pour nos personnes »."
      pl: "Piękne Przystanie; Paweł ostrzega, że „z ukrzywdzeniem i z wielką szkodą nie tylko towarów i okrętów, ale też i dusz naszych będzie to żeglowanie.”"
      it: "Buoni Porti; Paolo avverte: «io veggo che la navigazione si farà con pericolo e grave danno, non solo del carico e della nave, ma anche delle nostre persone»."
      nl: "Schone Havens; Paulus waarschuwt dat “de vaart zal geschieden met hinder en grote schade, niet alleen van de lading en van het schip, maar ook van ons leven.”"
      cs: "Dobré přístavy; Pavel varuje, že „s velikým ublížením a s mnohou škodou netoliko nákladu a lodí, ale i životů našich toto plavení bude“."
      sv: "Goda hamnarna; Paulus varnar: ”jag ser att denna sjöresa kommer att medföra vedervärdigheter och stor olycka, icke allenast för last och skepp, utan ock för våra liv.”"
      nb: "Godhavn; Paulus advarer om at «sjøferden vil være et vågestykke og medføre stor skade, ikke bare for ladning og skib, men også for vårt liv»."
      tl: "Mabubuting Daongan; nagbabala si Pablo na “ang paglalayag na ito ay makapipinsala at magiging malaking kapahamakan, hindi lamang sa lulan at sa daong, kundi naman sa ating mga buhay.”"
