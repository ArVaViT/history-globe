    note:
      en: "Transfer to a ship of Alexandria."
      ru: "Пересадка на александрийский корабль."
      uk: "Пересадка на александрійський корабель."
      es: "Trasbordo a una nave de Alejandría."
      pt: "Transferência para um navio de Alexandria."
      de: "Umstieg auf ein Schiff aus Alexandria."
      fr: "Transfert sur un navire d’Alexandrie."
      pl: "Przesiadka na okręt aleksandryjski."
      it: "Trasbordo su una nave di Alessandria."
      nl: "Overstap op een schip van Alexandrië."
      cs: "Přesedání na alexandrijskou loď."
      sv: "Överflyttning till ett skepp från Alexandria."
      nb: "Overføring til et skip fra Aleksandria."
      tl: "Lumipat sa isang sasakyang taga-Alejandria."
      da: "Overflytning til et skib fra Alexandria."
      sr: "Прелазак на лађу александријску."
      hu: "Átszállás egy alexandriai hajóra."
      fi: "Siirto aleksandrialaiseen laivaan."
      vi: "Đổi sang một chiếc tàu của A-léc-xan-tri."
      ro: "Mutarea pe o corabie din Alexandria."
      bg: "Прехвърляне на един александрийски кораб."
    story:
      en: "Putting out from Sidon, they sailed under the lee of Cyprus because the winds were against them, crossed the sea off Cilicia and Pamphylia and came to Myra in Lycia, which stood a little inland with its harbour at Andriake. There the centurion found a ship of Alexandria sailing for Italy and put them on board."
      ru: "Отплыв из Сидона, они прошли под прикрытием Кипра, потому что ветры были противные, пересекли море у Киликии и Памфилии и прибыли в Миры Ликийские, стоявшие немного в глубине суши, с гаванью в Андриаке. Там сотник нашёл александрийский корабль, плывший в Италию, и посадил их на него."
      uk: "Відпливши з Сідона, вони пройшли під захистом Кіпру, бо вітри були противні, перетнули море біля Кілікії та Памфілії й прибули до Мир Лікійських, що стояли трохи вглибині суходолу, з гаванню в Андріаці. Там сотник знайшов александрійський корабель, що плив до Італії, і посадив їх на нього."
      es: "Zarpando de Sidón, navegaron al abrigo de Chipre porque los vientos eran contrarios, cruzaron el mar frente a Cilicia y Panfilia y llegaron a Mira de Licia, que se alzaba un poco tierra adentro, con su puerto en Andriake. Allí el centurión encontró una nave de Alejandría que navegaba a Italia y los embarcó en ella."
      pt: "Partindo de Sidom, navegaram sob o abrigo de Chipre, porque os ventos eram contrários, atravessaram o mar ao longo da Cilícia e da Panfília e chegaram a Mira, na Lícia, que ficava um pouco para o interior, com o seu porto em Andriake. Ali o centurião encontrou um navio de Alexandria que navegava para a Itália e os fez embarcar nele."
      de: "Von Sidon aus segelten sie im Schutz Zyperns, weil die Winde ihnen entgegenstanden, durchquerten das Meer vor Kilikien und Pamphylien und kamen nach Myra in Lykien, das etwas landeinwärts lag, mit seinem Hafen in Andriake. Dort fand der Hauptmann ein Schiff aus Alexandria, das nach Italien fuhr, und brachte sie an Bord."
      fr: "Partis de Sidon, ils longèrent Chypre à l’abri parce que les vents étaient contraires, traversèrent la mer au large de la Cilicie et de la Pamphylie et arrivèrent à Myra en Lycie, qui se trouvait un peu à l’intérieur des terres, avec son port à Andriake. Là, le centenier trouva un navire d’Alexandrie qui partait pour l’Italie et les y fit monter."
      pl: "Odpłynąwszy z Sydonu, płynęli pod osłoną Cypru, bo wiatry były przeciwne, przepłynęli morze u wybrzeży Cylicji i Pamfilii i przybyli do Miry w Licji, która leżała nieco w głębi lądu, a jej portem była Andriake. Tam setnik znalazł okręt aleksandryjski płynący do Italii i umieścił ich na nim."
      it: "Partiti da Sidone, navigarono al riparo di Cipro perché i venti erano contrari, attraversarono il mare al largo della Cilicia e della Panfilia e giunsero a Mira di Licia, che sorgeva un poco nell’entroterra con il suo porto ad Andriake. Lì il centurione trovò una nave alessandrina diretta in Italia e li fece salire a bordo."
      nl: "Van Sidon afgevaren, zeilden zij onder de wal van Cyprus, omdat de winden tegen waren, staken de zee over langs Cilicië en Pamfylië en kwamen te Myra in Lycië, dat iets landinwaarts lag, met zijn haven te Andriake. Daar vond de hoofdman een schip van Alexandrië dat naar Italië voer, en hij bracht hen aan boord."
      cs: "Vypluli ze Sidónu a pluli v závětří Kypru, protože vanuly protivné větry, přepluli moře podél Kilikie a Pamfylie a přišli do Myry v Lykii, která ležela kousek ve vnitrozemí a jejím přístavem byla Andriake. Tam setník nalezl alexandrijskou loď plující do Itálie a nalodil je na ni."
      sv: "De lade ut från Sidon och seglade i lä av Cypern, eftersom vindarna var emot dem, korsade havet utanför Cilicien och Pamfylien och kom till Myra i Lycien, som låg en bit inåt landet med sin hamn i Andriake. Där fann hövitsmannen ett skepp från Alexandria som skulle till Italien och tog dem ombord på det."
      nb: "Fra Sidon seilte de i le av Kypros fordi vindene var imot dem, krysset havet utenfor Kilikia og Pamfylia og kom til Myra i Lykia, som lå et stykke inn i landet, med havnen i Andriake. Der fant høvedsmannen et skip fra Aleksandria som skulle til Italia, og satte dem om bord."
      tl: "Pagtulak mula sa Sidon, naglayag sila na nanganganlong sa Chipre sapagka't pasalunga ang hangin, tinawid ang dagat na nasa tapat ng Cilicia at Pamfilia at dumating sa Mira sa Licia, na nakatayo nang kaunti sa loob ng lupain at ang daungan ay nasa Andriake. Doon ay nakasumpong ang senturion ng isang daong Alejandria na lumalayag patungong Italia at isinakay sila roon."
      da: "Fra Sidon sejlede de ind under Cypern, fordi vinden var imod, krydsede havet ud for Kilikien og Pamfylien og kom til Myra i Lykien, der lå et stykke inde i landet med sin havn ved Andriake. Der fandt høvedsmanden et skib fra Alexandria, der skulle til Italien, og satte dem om bord."
      sr: "Отпловивши из Сидона, пловили су у заветрини Кипра, јер су ветрови били противни, прешли пучину код Киликије и Памфилије и дошли у Миру у Ликији, која је стајала мало у унутрашњости, с пристаништем у Андријаки. Тамо је стотник нашао александријску лађу која плови у Италију и укрцао их на њу."
      hu: "Szidónból kifutva Ciprus szélvédett oldalán hajóztak, mert a szél ellenük fújt, átkeltek a Kilikia és Pamfília előtti tengeren, és a lükiai Mürába érkeztek, amely kissé beljebb állt, kikötője pedig Andriakében volt. Ott a százados egy Itáliába tartó alexandriai hajót talált, és őket arra szállította."
      fi: "Sidonista lähdettyään he purjehtivat Kyproksen suojaan, koska tuulet olivat vastaiset, ylittivät meren Kilikian ja Pamfylian edustalla ja tulivat Lykian Myraan, joka sijaitsi hieman sisämaassa ja jonka satama oli Andriakessa. Siellä sadanpäämies löysi Italiaan purjehtivan aleksandrialaisen laivan ja siirsi heidät siihen."
      vi: "Rời Si-đôn, họ đi thuyền men theo phía khuất gió của Chíp-rơ vì gió ngược, vượt qua vùng biển ngoài khơi Si-li-si và Bam-phi-ly và đến My-ra xứ Ly-si, thành nằm hơi sâu trong đất liền với hải cảng ở Andriake. Tại đó thầy đội tìm được một chiếc tàu A-léc-xan-tri đi Y-ta-li và cho họ xuống tàu ấy."
      ro: "Plecând din Sidon, au navigat la adăpostul Ciprului, pentru că vânturile erau potrivnice, au traversat marea din dreptul Ciliciei și Pamfiliei și au ajuns la Mira Liciei, care se afla puțin în interior, cu portul la Andriake. Acolo sutașul a găsit o corabie din Alexandria care mergea în Italia și i-a urcat pe ea."
      bg: "Като отплаваха от Сидон, плаваха под прикритието на Кипър, защото ветровете бяха противни, преплаваха морето край Киликия и Памфилия и стигнаха до Мира в Ликия, която стоеше малко навътре в сушата с пристанището си Андриаке. Там стотникът намери александрийски кораб, който плаваше за Италия, и ги качи на него."
