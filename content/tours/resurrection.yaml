# The resurrection and the appearances, from the empty tomb to the Ascension: John 19-21,
# Luke 24, Matthew 28 and Acts 1, in the order usually followed; the Gospels do not fix
# the order of the two appearances in Galilee (John 21, Matt 28:16-20), and Luke 24:44-49
# is left out as its time is read either way. The year (AD 30) is the same conventional
# point as the life of Jesus tour; AD 33 is also held.
id: resurrection
title:
  en: "The resurrection and the appearances"
  ru: "Воскресение и явления"
year: "AD 30"
approximate: true
stops:
  - place: a631d35 # Golgotha
    ref: John.19.41-John.20.18
    note:
      en: "In the garden by the place of the crucifixion the tomb is empty, and Mary Magdalene sees the risen Lord."
      ru: "В саду у места распятия гроб пуст, и Мария Магдалина видит воскресшего Господа."
  - place: ae7274b # Emmaus
    ref: Luke.24.13-Luke.24.32
    note:
      en: "On the road to Emmaus two disciples know Him in the breaking of bread."
      ru: "На пути в Эммаус двое учеников узнают Его при преломлении хлеба."
  - place: a15257a # Jerusalem
    ref: Luke.24.33-Luke.24.43
    note:
      en: 'In Jerusalem Jesus stands among the disciples: "Peace be unto you."'
      ru: "В Иерусалиме Иисус становится посреди учеников: «мир вам»."
  - place: a562fcc # Sea of Galilee
    ref: John.21.1-John.21.17
    note:
      en: 'By the Sea of Galilee He asks Peter three times: "lovest thou me?"'
      ru: "При море Галилейском Он трижды спрашивает Петра: «любишь ли ты Меня?»"
  - place: a9cf1e8 # Galilee
    ref: Matt.28.16-Matt.28.20
    note:
      en: 'On a mountain in Galilee He sends the eleven: "teach all nations."'
      ru: "На горе в Галилее Он посылает одиннадцать: «научите все народы»."
  - place: ac2c4c5 # Mount of Olives
    ref: Acts.1.6-Acts.1.12
    note:
      en: 'From the Mount of Olives He is taken up: "ye shall be witnesses unto me."'
      ru: "С горы Елеонской Он возносится: «будете Мне свидетелями»."
