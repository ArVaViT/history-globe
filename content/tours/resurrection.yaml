# The resurrection and the appearances, from the empty tomb to the Ascension: John 19-21,
# Luke 24, Matthew 28 and Acts 1, in the order usually followed; the Gospels do not fix
# the order of the two appearances in Galilee (John 21, Matt 28:16-20), and Luke 24:44-49
# is left out as its time is read either way. The year (AD 30) is the same conventional
# point as the life of Jesus tour; AD 33 is also held.
id: resurrection
title:
  en: "The resurrection and the appearances"
  ru: "Воскресение и явления"
  uk: "Воскресіння і явлення"
  es: "La resurrección y las apariciones"
  pt: "A ressurreição e as aparições"
  de: "Die Auferstehung und die Erscheinungen"
  fr: "La résurrection et les apparitions"
  pl: "Zmartwychwstanie i ukazania się"
  it: "La risurrezione e le apparizioni"
  nl: "De opstanding en de verschijningen"
  cs: "Vzkříšení a zjevení"
  sv: "Uppståndelsen och uppenbarelserna"
  nb: "Oppstandelsen og åpenbaringene"
  tl: "Ang muling pagkabuhay at ang mga pagpapakita"
  da: "Opstandelsen og åbenbaringerne"
year: "AD 30"
people: ["Jesus@Isa.7.14-Rev"]
approximate: true
stops:
  - place: a631d35 # Golgotha
    ref: John.19.41-John.20.18
    note:
      en: "In the garden by the place of the crucifixion the tomb is empty, and Mary Magdalene sees the risen Lord."
      ru: "В саду у места распятия гроб пуст, и Мария Магдалина видит воскресшего Господа."
      uk: "У саду біля місця розп’яття гріб порожній, і Марія Магдалина бачить воскреслого Господа."
      es: "En el huerto junto al lugar de la crucifixión el sepulcro está vacío, y María Magdalena ve al Señor resucitado."
      pt: "No jardim junto ao lugar da crucificação, o túmulo está vazio, e Maria Madalena vê o Senhor ressuscitado."
      de: "Im Garten bei der Kreuzigungsstätte ist das Grab leer, und Maria Magdalena sieht den auferstandenen Herrn."
      fr: "Dans le jardin près du lieu de la crucifixion, le tombeau est vide, et Marie-Madeleine voit le Seigneur ressuscité."
      pl: "W ogrodzie obok miejsca ukrzyżowania grób jest pusty, a Maria Magdalena widzi zmartwychwstałego Pana."
      it: "Nel giardino presso il luogo della crocifissione la tomba è vuota, e Maria Maddalena vede il Signore risorto."
      nl: "In de hof bij de plaats van de kruisiging is het graf leeg, en Maria Magdalena ziet de verrezen Heer."
      cs: "V zahradě u místa ukřižování je hrob prázdný a Marie Magdalská vidí vzkříšeného Pána."
      sv: "I trädgården vid platsen för korsfästelsen är graven tom, och Maria från Magdala ser den uppståndne Herren."
      nb: "I hagen ved korsfestelsesstedet er graven tom, og Maria Magdalena ser den oppstandne Herre."
      tl: "Sa halamanan sa tabi ng dako ng pagpapako sa krus, walang laman ang libingan, at nakita ni Maria Magdalena ang nabuhay na Panginoon."
      da: "I haven ved korsfæstelsesstedet er graven tom, og Maria Magdalene ser den opstandne Herre."
  - place: ae7274b # Emmaus
    ref: Luke.24.13-Luke.24.32
    note:
      en: "On the way to Emmaus two disciples walk with Him without knowing Him; at the table they know Him in the breaking of bread."
      ru: "По пути в Эммаус двое учеников идут с Ним, не узнавая Его; за трапезой они узнают Его при преломлении хлеба."
      uk: "По дорозі до Еммауса двоє учнів ідуть з Ним, не впізнаючи Його; за столом вони пізнають Його при переломленні хліба."
      es: "En el camino de Emaús dos discípulos caminan con él sin reconocerlo; a la mesa lo reconocen al partir el pan."
      pt: "A caminho de Emaús, dois discípulos andam com Ele sem o reconhecer; à mesa o reconhecem no partir do pão."
      de: "Auf dem Weg nach Emmaus gehen zwei Jünger mit ihm, ohne ihn zu erkennen; bei Tisch erkennen sie ihn am Brechen des Brotes."
      fr: "Sur le chemin d’Emmaüs, deux disciples marchent avec lui sans le reconnaître ; à table, ils le reconnaissent à la fraction du pain."
      pl: "W drodze do Emaus dwaj uczniowie idą z Nim, nie poznając Go; przy stole poznają Go przy łamaniu chleba."
      it: "Sulla via di Emmaus due discepoli camminano con lui senza riconoscerlo; a tavola lo riconoscono nello spezzare il pane."
      nl: "Op de weg naar Emmaüs lopen twee discipelen met Hem op zonder Hem te herkennen; aan tafel herkennen zij Hem bij het breken van het brood."
      cs: "Na cestě do Emauz s ním jdou dva učedníci, aniž ho poznávají; u stolu ho poznávají při lámání chleba."
      sv: "På vägen till Emmaus går två lärjungar tillsammans med honom utan att känna igen honom; vid bordet känner de igen honom när han bryter brödet."
      nb: "På veien til Emmaus går to disipler sammen med ham uten å kjenne ham; ved bordet kjenner de ham igjen når han bryter brødet."
      tl: "Sa daan patungong Emaus, dalawang alagad ang lumalakad na kasama Niya nang hindi Siya nakikilala; sa hapag ay nakilala nila Siya sa pagpuputolputol ng tinapay."
      da: "På vejen til Emmaus går to disciple sammen med ham uden at kende ham; ved bordet kender de ham ved brødets brydelse."
  - place: a15257a # Jerusalem
    ref: Luke.24.33-Luke.24.43
    note:
      en: 'In Jerusalem Jesus stands among the disciples: "Peace be unto you."'
      ru: "В Иерусалиме Иисус становится посреди учеников: «мир вам»."
      uk: "В Єрусалимі Ісус стає посеред учнів: «Упокій вам»."
      es: "En Jerusalén Jesús se pone en medio de los discípulos: «Paz á vosotros»."
      pt: "Em Jerusalém, Jesus se põe no meio dos discípulos: “Paz seja com vocês.”"
      de: "In Jerusalem tritt Jesus mitten unter die Jünger: „Friede sei mit euch!“"
      fr: "À Jérusalem, Jésus se tient au milieu des disciples : « La paix soit avec vous ! »"
      pl: "W Jerozolimie Jezus staje pośród uczniów: „Pokój wam!”"
      it: "A Gerusalemme Gesù compare in mezzo ai discepoli: «Pace a voi!»"
      nl: "In Jeruzalem staat Jezus in het midden van de discipelen: “Vrede zij ulieden!”"
      cs: "V Jeruzalémě se Ježíš staví doprostřed učedníků: „Pokoj vám.“"
      sv: "I Jerusalem står Jesus mitt ibland lärjungarna: ”Frid vare med eder.”"
      nb: "I Jerusalem står Jesus midt blant disiplene: «Fred være med eder!»"
      tl: "Sa Jerusalem, tumayo si Jesus sa gitna ng mga alagad: “Kapayapaan ang sumainyo.”"
      da: "I Jerusalem stiller Jesus sig midt iblandt disciplene: »Fred være med eder!«"
  - place: a562fcc # Sea of Galilee
    ref: John.21.1-John.21.17
    note:
      en: 'By the Sea of Galilee He asks Peter three times: "lovest thou me?"'
      ru: "При море Галилейском Он трижды спрашивает Петра: «любишь ли ты Меня?»"
      uk: "Біля Галілейського моря Він тричі питає Петра: «чи любиш мене?»"
      es: "Junto al Mar de Galilea pregunta tres veces a Pedro: «¿me amas?»"
      pt: "Junto ao Mar da Galileia, pergunta três vezes a Pedro: “você me ama?”"
      de: "Am See Genezareth fragt er Petrus dreimal: „Hast du mich lieb?“"
      fr: "Au bord de la Mer de Galilée, il demande trois fois à Pierre : « m’aimes-tu ? »"
      pl: "Nad Jeziorem Galilejskim pyta Piotra trzy razy: „miłujesz mię?”"
      it: "Presso il Lago di Tiberiade chiede a Pietro per tre volte: «m’ami tu?»"
      nl: "Aan het Meer van Galilea vraagt Hij Petrus driemaal: “Hebt gij Mij lief?”"
      cs: "U Galilejského jezera se třikrát ptá Petra: „miluješ-li mne?“"
      sv: "Vid Galileiska sjön frågar han Petrus tre gånger: ”älskar du mig?”"
      nb: "Ved Galileasjøen spør han Peter tre ganger: «elsker du mig?»"
      tl: "Sa tabi ng Dagat ng Galilea, tatlong beses Niyang tinanong si Pedro: “Iniibig mo baga ako?”"
      da: "Ved Genesaret Sø spørger han Peter tre gange: »elsker du mig?«"
  - place: a9cf1e8 # Galilee
    ref: Matt.28.16-Matt.28.20
    note:
      en: 'On a mountain in Galilee He sends the eleven: "teach all nations."'
      ru: "На горе в Галилее Он посылает одиннадцать: «научите все народы»."
      uk: "На горі в Галілеї Він посилає одинадцятьох: «навчайте всї народи»."
      es: "En un monte de Galilea envía a los once: «doctrinad á todos los Gentiles»."
      pt: "Num monte da Galileia, envia os onze: “façam discípulos de todas as nações.”"
      de: "Auf einem Berg in Galiläa sendet er die Elf aus: „lehret alle Völker“."
      fr: "Sur une montagne de Galilée, il envoie les onze : « faites de toutes les nations des disciples »."
      pl: "Na górze w Galilei posyła jedenastu: „nauczajcie wszystkie narody”."
      it: "Su un monte in Galilea manda gli undici: «ammaestrate tutti i popoli»."
      nl: "Op een berg in Galilea zendt Hij de elf: “onderwijst al de volken”."
      cs: "Na hoře v Galileji posílá jedenáct: „učte všecky národy“."
      sv: "På ett berg i Galileen sänder han de elva: ”gören alla folk till lärjungar.”"
      nb: "På et fjell i Galilea sender han de elleve: «gjør alle folkeslag til disipler»."
      tl: "Sa isang bundok sa Galilea, isinugo Niya ang labing-isa: “gawin ninyong mga alagad ang lahat ng mga bansa.”"
      da: "På et bjerg i Galilæa sender han de elleve ud: »gører alle Folkeslagene til mine Disciple«."
  - place: ac2c4c5 # Mount of Olives
    ref: Acts.1.6-Acts.1.12
    note:
      en: 'From the Mount of Olives He is taken up: "ye shall be witnesses unto me."'
      ru: "С горы Елеонской Он возносится: «будете Мне свидетелями»."
      uk: "З Оливкової гори Його піднесено: «будете менї сьвідками»."
      es: "Desde el Monte de los Olivos es elevado: «me sereís testigos»."
      pt: "Do Monte das Oliveiras é elevado ao céu: “serão minhas testemunhas.”"
      de: "Vom Ölberg wird er aufgenommen: „werdet meine Zeugen sein“."
      fr: "Du Mont des Oliviers, il est enlevé : « vous serez mes témoins »."
      pl: "Z Góry Oliwnej zostaje wzięty do nieba: „będziecie mi świadkami”."
      it: "Dal Monte degli Ulivi è elevato in alto: «mi sarete testimoni»."
      nl: "Vanaf de Olijfberg wordt Hij opgenomen: “gij zult Mijn getuigen zijn”."
      cs: "Z Olivové hory je vzat vzhůru: „budete mi svědkové“."
      sv: "Från Olivberget tas han upp: ”skolen I undfå kraft och bliva mina vittnen”."
      nb: "Fra Oljeberget blir han tatt opp: «I skal være mine vidner»."
      tl: "Mula sa Bundok ng mga Olibo ay inakyat Siya sa langit: “kayo'y magiging mga saksi ko.”"
      da: "Fra Oliebjerget tages han op: »I skulle være mine Vidner«."
