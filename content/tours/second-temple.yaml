# The first return and the second Temple, Ezra 1-6, in the order of the text; the return
# under Ezra and Nehemiah's walls are in the tour of the return. The tour's year (538 BC) is
# Cyrus's first year over Babylon (see the dated events). Stops the book dates carry their
# own year: the second year after the return (536 BC, 3:8; 537 BC is also held), the second
# year of Darius (520 BC, 4:24; the search of 6:1-12 is not dated) and the Temple finished
# in his sixth (516 BC, 6:15; 515 BC is also held). Chapter 4:6-23 tells of later kings and
# is left out.
id: second-temple
title:
  en: "The first return and the second Temple"
  ru: "Первое возвращение и второй Храм"
  uk: "Перше повернення і другий храм"
  es: "El primer retorno y el segundo Templo"
  pt: "O primeiro retorno e o segundo Templo"
  de: "Die erste Rückkehr und der zweite Tempel"
  fr: "Le premier retour et le second temple"
  pl: "Pierwszy powrót i druga świątynia"
  it: "Il primo ritorno e il secondo Tempio"
  nl: "De eerste terugkeer en de tweede tempel"
  cs: "První návrat a druhý chrám"
  sv: "Den första återkomsten och det andra templet"
  nb: "Den første hjemkomsten og det andre tempel"
year: "538 BC"
# Where the work and the letters were, not a journey: no time on foot.
walked: false
approximate: true
stops:
  - place: a217d18 # Babylon
    ref: Ezra.1.1-Ezra.2.1
    note:
      en: 'Cyrus king of Persia proclaims: "he hath charged me to build him an house at Jerusalem"; he gives back the vessels of the Temple, and the exiles go up from Babylon.'
      ru: "Кир, царь Персидский, объявляет: «Он повелел мне построить Ему дом в Иерусалиме»; он возвращает сосуды дома Господня, и переселенцы выходят из Вавилона."
      uk: "Кір, цар Перський, оголошує: «звелїв менї збудувати йому дім в Ерусалимі»; він повертає посуд храму, і вигнанці виходять із Вавилона."
      es: "Ciro, rey de Persia, proclama: «me ha mandado que le edifique casa en Jerusalem»; devuelve los vasos del Templo, y los desterrados suben de Babilonia."
      pt: "Ciro, rei da Pérsia, proclama: “ele me ordenou que lhe edificasse uma casa em Jerusalém”; devolve os utensílios do Templo, e os exilados sobem da Babilônia."
      de: "Kyrus, der König von Persien, lässt ausrufen, der Herr „hat mir befohlen, ihm ein Haus zu bauen zu Jerusalem in Juda“; er gibt die Geräte des Tempels zurück, und die Verbannten ziehen aus Babylon hinauf."
      fr: "Cyrus, roi de Perse, proclame : « il m’a commandé de lui bâtir une maison à Jérusalem » ; il rend les objets du temple, et les exilés montent de Babylone."
      pl: "Cyrus, król Persji, ogłasza: „ten mi rozkazał, abym mu zbudował dom w Jeruzalemie”; zwraca naczynia świątyni, a wygnańcy wyruszają z Babilonu."
      it: "Ciro, re di Persia, proclama: «m’ha comandato di edificargli una casa a Gerusalemme»; restituisce gli utensili del Tempio, e gli esuli salgono da Babilonia."
      nl: "Cyrus, de koning van Perzië, laat uitroepen: “Hij heeft mij bevolen Hem een huis te bouwen te Jeruzalem”; hij geeft de voorwerpen van de tempel terug, en de ballingen trekken op uit Babylon."
      cs: "Kýros, král perský, vyhlašuje: „on mi poručil, abych mu vystavěl dům v Jeruzalémě“; vydává nádoby chrámu a vyhnanci odcházejí z Babylóna."
      sv: "Kyros, kung av Persien, kungör: ”han har anbefallt mig att bygga honom ett hus i Jerusalem i Juda”; han ger tillbaka templets kärl, och de landsflyktiga drar upp från Babylon."
      nb: "Kyros, kongen i Persia, kunngjør at Herren «har pålagt mig å bygge ham et hus i Jerusalem»; han gir tilbake templets kar, og de landflyktige drar opp fra Babylon."
  - place: ae023a9 # Joppa
    ref: Ezra.3.7
    note:
      en: "Cedar is brought from Lebanon by sea to Joppa for the house of God, by leave of Cyrus."
      ru: "Кедровый лес с Ливана доставляют по морю в Яфу (Иоппию) для дома Божия, с дозволения Кира."
      uk: "За дозволом Кіра кедр везуть з Лівану морем до Яффи для дому Божого."
      es: "Se trae cedro del Líbano por mar a Jope para la casa de Dios, con permiso de Ciro."
      pt: "Cedro é trazido do Líbano por mar até Jope para a casa de Deus, com a permissão de Ciro."
      de: "Mit Erlaubnis des Kyrus wird Zedernholz für das Haus Gottes vom Libanon über das Meer nach Joppe gebracht."
      fr: "Du cèdre est amené du Liban par mer jusqu’à Joppé pour la maison de Dieu, avec l’autorisation de Cyrus."
      pl: "Za zezwoleniem Cyrusa cedr z Libanu zostaje przewieziony morzem do Jafy na dom Boży."
      it: "Con il permesso di Ciro, il cedro è portato dal Libano per mare a Giaffa per la casa di Dio."
      nl: "Ceder wordt met toestemming van Cyrus over zee van de Libanon naar Joppe gebracht voor het huis van God."
      cs: "Z Libanonu je po moři do Joppe dovezeno cedrové dříví pro dům Boží se svolením Kýrovým."
      sv: "Ceder förs från Libanon sjövägen till Joppe för Guds hus, med Kyros’ tillstånd."
      nb: "Sedertre blir ført fra Libanon sjøveien til Jaffa for Guds hus, med Kyros' tillatelse."
  - place: a15257a # Jerusalem
    ref: Ezra.3.8-Ezra.3.13
    year: "536 BC"
    note:
      en: 'The foundation of the Temple is laid with trumpets and song, "for his mercy endureth for ever toward Israel"; old men who had seen the first house weep aloud.'
      ru: "Основание храма полагают с трубами и пением: «ибо вовек милость Его к Израилю»; старики, видевшие прежний храм, громко плачут."
      uk: "Основу храму закладають під сурми й спів, «бо добрий, бо віковічня ласка його до Ізраїля»; старі, що бачили перший дім, голосно плачуть."
      es: "Se echa el cimiento del Templo con trompetas y cantos, «porque para siempre es su misericordia sobre Israel»; los ancianos que habían visto la primera casa lloran en alta voz."
      pt: "O alicerce do Templo é lançado com trombetas e canto, “porque a sua misericórdia dura para sempre sobre Israel”; velhos que tinham visto a primeira casa choram em alta voz."
      de: "Der Grund des Tempels wird unter Posaunen und Gesang gelegt, „daß er gütig ist und seine Barmherzigkeit ewiglich währet über Israel“; alte Männer, die das erste Haus gesehen hatten, weinen laut."
      fr: "Les fondements du temple sont posés au son des trompettes et des chants, « car sa miséricorde pour Israël dure à toujours » ; les vieillards qui avaient vu la première maison pleurent à haute voix."
      pl: "Fundament świątyni zostaje założony przy dźwiękach trąb i śpiewie, „że dobry, że na wieki miłosierdzie jego nad Izraelem”; starcy, którzy widzieli pierwszy dom, płaczą głośno."
      it: "Le fondamenta del Tempio sono gettate con trombe e canti, «perché la sua benignità verso Israele dura in perpetuo»; i vecchi che avevano visto la prima casa piangono ad alta voce."
      nl: "De grondslag van de tempel wordt gelegd onder bazuingeschal en gezang, terwijl men looft en dankt, “dat Zijn weldadigheid tot in eeuwigheid is over Israël”; oude mannen die het eerste huis hadden gezien, wenen luid."
      cs: "Základ chrámu se zakládá za zvuku trub a zpěvu, „na věky trvá milosrdenství jeho nad Izraelem“; staří muži, kteří viděli první dům, hlasitě pláčou."
      sv: "Templets grund läggs under trumpetstötar och sång, ”hans nåd varar evinnerligen över Israel”; gamla män som hade sett det första huset gråter högt."
      nb: "Templets grunnvoll blir lagt med basuner og sang, «hans miskunnhet mot Israel varer evindelig»; gamle menn som hadde sett det første hus, gråter høyt."
  - place: a212ef7 # Ecbatana
    ref: Ezra.4.24-Ezra.6.12
    year: "520 BC"
    note:
      en: "In the second year of Darius the builders begin again, with the prophets Haggai and Zechariah helping them; asked by the governor, Darius has the archives searched, a scroll with Cyrus's decree is found at Ecbatana in Media, and he orders the work to go on."
      ru: "Во второй год Дария строители снова начинают работу, и пророки Аггей и Захария подкрепляют их; по донесению заречного областеначальника Дарий велит искать в книгохранилище; в Екбатане, в области Мидии, находят свиток с повелением Кира о доме Божием, и Дарий велит продолжать работу."
      uk: "На другий рік Дарія будівничі починають знову, а їм допомагають пророки Аггей і Захарія; на запит намісника Дарій наказує пошукати в архівах, сувій із указом Кіра знаходять в Екбатані в Мідії, і він наказує продовжувати роботу."
      es: "En el segundo año de Darío los constructores reanudan la obra, con la ayuda de los profetas Hageo y Zacarías; a petición del gobernador, Darío manda buscar en los archivos, se halla en Ecbatana, en Media, un rollo con el decreto de Ciro, y ordena que la obra continúe."
      pt: "No segundo ano de Dario, os construtores recomeçam, ajudados pelos profetas Ageu e Zacarias; interrogado pelo governador, Dario manda pesquisar os arquivos, um rolo com o decreto de Ciro é encontrado em Ecbatana, na Média, e ele ordena que a obra continue."
      de: "Im zweiten Jahr des Darius beginnen die Bauleute von neuem, unterstützt von den Propheten Haggai und Sacharja; vom Statthalter befragt, lässt Darius die Archive durchsuchen, in Ekbatana in Medien wird eine Schriftrolle mit dem Erlass des Kyrus gefunden, und er befiehlt, das Werk fortzusetzen."
      fr: "La deuxième année de Darius, les bâtisseurs reprennent l’ouvrage, aidés par les prophètes Aggée et Zacharie ; interrogé par le gouverneur, Darius fait chercher dans les archives, un rouleau portant le décret de Cyrus est trouvé à Ecbatane en Médie, et il ordonne que l’ouvrage continue."
      pl: "W drugim roku Dariusza budowniczowie zaczynają od nowa, a pomagają im prorocy Aggeusz i Zachariasz; zapytany przez namiestnika, Dariusz każe przeszukać archiwa, w Ekbatanie w Medii zostaje znaleziony zwój z dekretem Cyrusa i król nakazuje kontynuować prace."
      it: "Nel secondo anno di Dario i costruttori riprendono i lavori, aiutati dai profeti Aggeo e Zaccaria; interrogato dal governatore, Dario fa cercare negli archivi, a Ecbatana, in Media, si trova un rotolo con il decreto di Ciro, ed egli ordina di proseguire l’opera."
      nl: "In het tweede jaar van Darius beginnen de bouwers opnieuw, geholpen door de profeten Haggai en Zacharia; op vraag van de stadhouder laat Darius de archieven doorzoeken, te Ekbatana in Medië wordt een rol met het besluit van Cyrus gevonden, en hij beveelt dat het werk wordt voortgezet."
      cs: "Ve druhém roce Dareiově začínají stavitelé znovu a pomáhají jim proroci Ageus a Zacharjáš; na dotaz správce nechává Dareios prohledat archivy, svitek s Kýrovým výnosem je nalezen v Ekbatanách v Médii a Dareios nařizuje, aby se v díle pokračovalo."
      sv: "I Dareios’ andra år tar byggarna upp arbetet igen, med profeterna Haggai och Sakarja som hjälp; på ståthållarens fråga låter Dareios söka i arkiven, en bokrulle med Kyros’ påbud återfinns i Ekbatana i Medien, och han befaller att arbetet ska fortsätta."
      nb: "I Dareios' andre år begynner byggherrene på ny, med profetene Haggai og Sakarja til hjelp; på landshøvdingens forespørsel lar Dareios arkivene gjennomsøke, en bokrull med Kyros' påbud blir funnet i Ekbatana i Media, og han befaler at arbeidet skal fortsette."
  - place: a15257a # Jerusalem
    ref: Ezra.6.15-Ezra.6.22
    year: "516 BC"
    note:
      en: "The house is finished in the sixth year of Darius and dedicated with joy, and those come again out of the captivity keep the Passover."
      ru: "Дом окончен в шестой год Дария и освящён с радостью, и возвратившиеся из плена совершают пасху."
      uk: "Дім завершено на шостий рік Дарія й освячено з радістю, а ті, що повернулися з полону, відзначають Пасху."
      es: "La casa se termina en el sexto año de Darío y se dedica con alegría, y los que han vuelto del cautiverio celebran la Pascua."
      pt: "A casa é concluída no sexto ano de Dario e dedicada com alegria, e os que voltaram do cativeiro celebram a Páscoa."
      de: "Das Haus wird im sechsten Jahr des Darius vollendet und mit Freuden geweiht, und die aus der Gefangenschaft Zurückgekehrten feiern das Passa."
      fr: "La maison est achevée la sixième année de Darius et dédiée dans la joie, et ceux qui sont revenus de la captivité célèbrent la Pâque."
      pl: "Dom zostaje ukończony w szóstym roku Dariusza i poświęcony z radością, a ci, którzy wrócili z niewoli, obchodzą Paschę."
      it: "La casa è terminata nel sesto anno di Dario e dedicata con gioia, e quelli che sono tornati dalla cattività celebrano la Pasqua."
      nl: "Het huis wordt voltooid in het zesde jaar van Darius en met vreugde ingewijd, en wie uit de ballingschap zijn teruggekeerd, vieren het Pascha."
      cs: "Dům je dokončen v šestém roce Dareiově a s radostí posvěcen; ti, kteří se vrátili ze zajetí, slaví pesach."
      sv: "Huset blir färdigt i Dareios’ sjätte år och invigs med glädje, och de som har kommit tillbaka ur fångenskapen firar påsk."
      nb: "Huset blir ferdig i Dareios' sjette år og innviet med glede, og de som var vendt tilbake fra fangenskapet, holder påske."
