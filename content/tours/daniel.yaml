stops:
  - place: a15257a # Jerusalem
    ref: Dan.1.1-Dan.1.2
    note:
      en: "In the third year of Jehoiakim Nebuchadnezzar besieges Jerusalem and carries off some of the vessels of the house of God."
      ru: "В третий год Иоакима Навуходоносор осаждает Иерусалим и уносит часть сосудов дома Божия."
      uk: "На третій рік Йоакима Навуходоносор облягає Єрусалим і забирає частину посуду з дому Божого."
      es: "En el tercer año de Joacim, Nabucodonosor sitia Jerusalén y se lleva parte de los vasos de la casa de Dios."
      pt: "No terceiro ano de Jeoaquim, Nabucodonosor cerca Jerusalém e leva alguns dos utensílios da casa de Deus."
      de: "Im dritten Jahr Jojakims belagert Nebukadnezar Jerusalem und führt einen Teil der Geräte des Hauses Gottes fort."
      fr: "La troisième année de Jojakim, Nebucadnetsar assiège Jérusalem et emporte une partie des objets de la maison de Dieu."
      pl: "W trzecim roku Jojakima Nabuchodonozor oblega Jerozolimę i uwozi część naczyń z domu Bożego."
      it: "Nel terzo anno di Ioiakim Nabucodonosor assedia Gerusalemme e porta via una parte degli utensili della casa di Dio."
      nl: "In het derde jaar van Jojakim belegert Nebukadnessar Jeruzalem en voert een deel van de voorwerpen van het huis van God weg."
      cs: "Ve třetím roce Jójakima obléhá Nebukadnesar Jeruzalém a odnáší část nádob domu Božího."
      sv: "I Jojakims tredje år belägrar Nebukadnessar Jerusalem och för bort en del av kärlen i Guds hus."
      nb: "I Jojakims tredje år kringsetter Nebukadnesar Jerusalem og fører bort noe av karene fra Guds hus."
      tl: "Sa ikatlong taon ni Joacim, kinubkob ni Nabucodonosor ang Jerusalem at dinala ang ilan sa mga kagamitan ng bahay ng Diyos."
      da: "I Jojakims tredje år belejrer Nebukadnezar Jerusalem og fører nogle af Guds hus' kar bort."
      sr: "Треће године Јоакимове Навуходоносор опседа Јерусалим и односи део посуђа дома Божјег."
      hu: "Jójákim harmadik évében Nabukodonozor ostrom alá veszi Jeruzsálemet, és elviszi az Isten házának néhány edényét."
      fi: "Jojakimin kolmantena vuonna Nebukadnessar piirittää Jerusalemia ja vie mukanaan osan Jumalan huoneen astioista."
      vi: "Vào năm thứ ba đời Giê-hô-gia-kim, Nê-bu-cát-nết-sa vây Giê-ru-sa-lem và đem đi một số khí dụng của nhà Đức Chúa Trời."
      ro: "În al treilea an al lui Ioiachim, Nebucadnețar asediază Ierusalimul și ia o parte din vasele casei lui Dumnezeu."
      bg: "В третата година на Йоаким Навуходоносор обсажда Йерусалим и отнася част от съдовете на Божия дом."
  - place: a217d18 # Babylon
    ref: Dan.1.3-Dan.6.28
    year: "539 BC"
    note:
      en: 'In Babylon: the king''s dream, the fiery furnace, the writing on the wall ("MENE, MENE, TEKEL, UPHARSIN"), the lions'' den.'
      ru: "В Вавилоне: сон царя, печь огненная, надпись на стене («мене, мене, текел, упарсин»), ров львиный."
      uk: "У Вавилоні: сон царя, вогненна піч, напис на стіні («Мене, мене, текел, упарсин»), рів зі львами."
      es: "En Babilonia: el sueño del rey, el horno de fuego, la escritura en la pared («MENE, MENE, TEKEL, UPHARSIN»), el foso de los leones."
      pt: "Na Babilônia: o sonho do rei, a fornalha ardente, a escrita na parede (“MENE, MENE, TEQUEL, UFARSIM”), a cova dos leões."
      de: "In Babylon: der Traum des Königs, der Feuerofen, die Schrift an der Wand („Mene, mene, Tekel, U-pharsin“), die Löwengrube."
      fr: "À Babylone : le songe du roi, la fournaise ardente, l’écriture sur le mur (« Compté, compté, pesé, et divisé »), la fosse aux lions."
      pl: "W Babilonie: sen króla, piec ognisty, pismo na ścianie („Mene, Mene, Thekel, upharsin”), jaskinia lwów."
      it: "A Babilonia: il sogno del re, la fornace ardente, lo scritto sulla parete («MENE, MENE, TEKEL, UFARSIN»), la fossa dei leoni."
      nl: "In Babylon: de droom van de koning, de vurige oven, het schrift op de wand (“MENE, MENE, TEKEL, UPHARSIN”), de leeuwenkuil."
      cs: "V Babylóně: králův sen, ohnivá pec, písmo na stěně („Mene, mene, tekel, ufarsin“), lví jáma."
      sv: "I Babylon: kungens dröm, den glödande ugnen, skriften på väggen (”Mene mene tekel u-farsin”), lejongropen."
      nb: "I Babylon: kongens drøm, den brennende ovnen, skriften på veggen («Mene, mene, tekel, ufarsin»), løvehulen."
      tl: "Sa Babilonia: ang panaginip ng hari, ang maapoy na hurno, ang sulat sa dingding (“MENE, MENE, TEKEL, UPHARSIN”), ang yungib ng mga leon."
      da: "I Babylon: kongens drøm, den glødende ovn, skriften på væggen (»Mene, Mene, Tekel, Ufarsin«), løvekulen."
      sr: "У Вавилону: царев сан, пећ огњена, писмо на зиду („МЕНЕ, МЕНЕ, ТЕКЕЛ, УФАРСИН“), јама лавља."
      hu: "Babilonban: a király álma, a tüzes kemence, a falra írt írás („Mene, Mene, Tekel, Ufarszin”), az oroszlánok verme."
      fi: "Babylonissa: kuninkaan uni, tulinen pätsi, kirjoitus seinällä (”MENE, MENE, TEKEL, UFARSIN”), leijonien luola."
      vi: "Tại Ba-by-lôn: giấc chiêm bao của vua, lò lửa hực, chữ viết trên tường (“Mê-nê, Mê-nê, Tê-ken, U-phác-sin”), hang sư tử."
      ro: "În Babilon: visul regelui, cuptorul aprins, scrisul de pe perete („Manì, Techel, Fares”), groapa cu lei."
      bg: "Във Вавилон: сънят на царя, огнената пещ, надписът на стената („МЕНЕ, МЕНЕ, ТЕКЕЛ у ФАРСИН“), ровът на лъвовете."
  - place: a033b84 # Susa
    ref: Dan.8.1-Dan.8.27
    by: untold
    year: "550 BC"
    note:
      en: "In the third year of Belshazzar Daniel sees in a vision that he is at Susa, by the river Ulai."
      ru: "В третий год Валтасара Даниил видит себя в видении в Сузах, у реки Улая."
      uk: "На третій рік Валтасара Даниїл бачить у видінні, що він у Сузах, біля ріки Улай."
      es: "En el tercer año de Belsasar, Daniel ve en una visión que está en Susa, junto al río Ulai."
      pt: "No terceiro ano de Belsazar, Daniel vê em visão que está em Susã, junto ao rio Ulai."
      de: "Im dritten Jahr Belsazars sieht Daniel in einem Gesicht, dass er in Susa am Fluss Ulai ist."
      fr: "La troisième année de Belschatsar, Daniel voit en vision qu’il est à Suse, près du fleuve Ulaï."
      pl: "W trzecim roku Belszassara Daniel widzi w widzeniu, że jest w Suzie, nad rzeką Ulaj."
      it: "Nel terzo anno di Baldassarre Daniele vede in visione di trovarsi a Susa, presso il fiume Ulai."
      nl: "In het derde jaar van Belsazar ziet Daniël in een visioen dat hij te Susa is, aan de rivier de Ulai."
      cs: "Ve třetím roce Belšasara vidí Daniel ve vidění, že je v Susách u řeky Ulaj."
      sv: "I Belshassars tredje år ser Daniel i en syn att han befinner sig i Susa, vid floden Ulai."
      nb: "I Belsasars tredje år ser Daniel i et syn at han er i Susa, ved elven Ulai."
      tl: "Sa ikatlong taon ni Belsasar, nakita ni Daniel sa isang pangitain na siya ay nasa Susan, sa tabi ng ilog Ulai."
      da: "I Belsazars tredje år ser Daniel i et syn, at han er i Susa, ved floden Ulaj."
      sr: "Треће године Валтасарове Данило у виђењу види да је у Суси, на реци Улају."
      hu: "Belsazár harmadik évében Dániel látomásban azt látja, hogy Susán várában van, az Ulai folyó mellett."
      fi: "Belsassarin kolmantena vuonna Daniel näkee näyssä olevansa Susassa, Ulai-virran varrella."
      vi: "Vào năm thứ ba đời Bên-xát-sa, Đa-ni-ên thấy trong dị tượng mình ở tại Su-xơ, bên sông U-lai."
      ro: "În al treilea an al lui Belșațar, Daniel se vede în vedenie la Susa, lângă râul Ulai."
      bg: "В третата година на Валтасар Даниил вижда във видение, че се намира в Суза, край река Улай."
  - place: a38ebfd # Tigris
    ref: Dan.10.1-Dan.10.21
    by: untold
    year: "536 BC"
    note:
      en: "In the third year of Cyrus, on the bank of the great river Tigris, a man clothed in linen appears to him."
      ru: "В третий год Кира на берегу большой реки Тигра ему является муж, облечённый в льняную одежду."
      uk: "На третій рік Кіра, на березі великої ріки Тигру, йому являється чоловік у льняному вбранні."
      es: "En el tercer año de Ciro, a orillas del gran río Tigris, se le aparece un hombre vestido de lino."
      pt: "No terceiro ano de Ciro, à margem do grande rio Tigre, um homem vestido de linho aparece a ele."
      de: "Im dritten Jahr des Kyrus erscheint ihm am Ufer des großen Stromes Tigris ein Mann in Leinwand."
      fr: "La troisième année de Cyrus, au bord du grand fleuve du Tigre, un homme vêtu de lin lui apparaît."
      pl: "W trzecim roku Cyrusa, na brzegu wielkiej rzeki Tygrys, ukazuje mu się mąż odziany w len."
      it: "Nel terzo anno di Ciro, in riva al grande fiume Tigri, gli appare un uomo vestito di lino."
      nl: "In het derde jaar van Cyrus verschijnt een man, gekleed in linnen, aan hem op de oever van de grote rivier de Tigris."
      cs: "Ve třetím roce Kýrově se mu na břehu veliké řeky Tigris zjevuje muž oděný v plátno."
      sv: "I Kyros’ tredje år visar sig en man klädd i linne för honom vid stranden av den stora floden Tigris."
      nb: "I Kyros' tredje år viser en mann klædd i lin seg for ham ved bredden av den store elven Tigris."
      tl: "Sa ikatlong taon ni Ciro, sa pampang ng dakilang ilog Tigris, nagpakita sa kaniya ang isang lalaking nakabihis ng lino."
      da: "I Kyros' tredje år viser en mand klædt i linned sig for ham ved bredden af den store flod Tigris."
      sr: "Треће године Кирове, на обали велике реке Тигра, јавља му се човек обучен у лан."
      hu: "Círusz harmadik évében a nagy folyó, a Tigris partján egy lenruhába öltözött férfi jelenik meg előtte."
      fi: "Kyyroksen kolmantena vuonna, suuren Tigris-virran rannalla, pellavavaatteisiin pukeutunut mies ilmestyy hänelle."
      vi: "Vào năm thứ ba đời Si-ru, trên bờ sông lớn Hi-đê-ke, một người mặc vải gai hiện ra cùng người."
      ro: "În al treilea an al lui Cir, pe malul râului celui mare, Tigrul, i se arată un om îmbrăcat în in."
      bg: "В третата година на Кир, на брега на голямата река Тигър, му се явява мъж, облечен в ленени дрехи."
