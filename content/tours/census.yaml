# Joab's census, 2 Samuel 24 (1 Chronicles 21 tells it again), in the order of the text:
# Joab and the captains go round the land from Aroer to Beersheba and come back to
# Jerusalem after nine months and twenty days. The chapter is not dated; the tour's year
# (975 BC) is a point late in David's reign (c. 1010-970 BC), for the map only. The land of
# Tahtim-hodshi (24:6) and the cities of the Hivites and Canaanites (24:7) have no place on
# the map; David's command (24:1-4) names no place, so the tour opens at Aroer. The Aroer
# "in the midst of the river" is taken as Aroer on the Arnon, the city so described in
# Deut 2:36 and Josh 13:9, 16; Dan-jaan (24:6) is usually read as Dan.
id: census
title:
  en: "Joab's census of Israel"
  ru: "Перепись Иоава"
  uk: "Перепис Ізраїлю Йоавом"
  es: "El censo de Israel por Joab"
  pt: "O recenseamento de Israel por Joabe"
  de: "Joabs Volkszählung in Israel"
  fr: "Le dénombrement de Joab en Israël"
  pl: "Spis Izraela przeprowadzony przez Joaba"
  it: "Il censimento di Ioab in Israele"
  nl: "De volkstelling van Joab in Israël"
  cs: "Joábovo sčítání Izraele"
  sv: "Joavs folkräkning i Israel"
  nb: "Joabs folketelling i Israel"
  tl: "Ang sensus ni Joab sa Israel"
year: "975 BC"
people: ["Joab@1Sa.26.6-Psa"]
approximate: true
stops:
  - place: ae46f2e # Aroer
    ref: 2Sam.24.1-2Sam.24.5
    note:
      en: 'David tells Joab, "Go now through all the tribes of Israel, from Dan even to Beer-sheba, and number ye the people"; the captains cross the Jordan and pitch at Aroer.'
      ru: "Давид велит Иоаву: «пройди по всем коленам Израилевым и Иудиным от Дана до Вирсавии, и исчислите народ»; военачальники переходят Иордан и останавливаются в Ароере."
      uk: "Давид каже Йоавові: «Пройди по всїм поколїнням Ізрайлевим од Дана та й до Берсаби й перелїчіть народ»; воєначальники переходять Йордан і стають табором в Ароері."
      es: "David dice a Joab: «Rodea todas las tribus de Israel, desde Dan hasta Beer-seba, y contad el pueblo»; los capitanes pasan el Jordán y asientan el campamento en Aroer."
      pt: "Davi diz a Joabe: “Agora percorra todas as tribos de Israel, desde Dã até Berseba, e conte o povo”; os comandantes atravessam o Jordão e acampam em Aroer."
      de: "David sagt zu Joab: „Gehe umher in allen Stämmen Israels von Dan an bis gen Beer-Seba und zähle das Volk“; die Hauptleute gehen über den Jordan und lagern sich bei Aroër."
      fr: "David dit à Joab : « Parcours toutes les tribus d’Israël, depuis Dan jusqu’à Beer-Schéba ; qu’on fasse le dénombrement du peuple » ; les chefs passent le Jourdain et campent à Aroër."
      pl: "Dawid mówi Joabowi: „Przebież zaraz wszystkie pokolenia Izraelskie od Dan aż do Beerseba, a policzcie lud”; dowódcy przeprawiają się przez Jordan i rozbijają obóz w Aroer."
      it: "Davide dice a Ioab: «Va’ attorno per tutte le tribù d’Israele, da Dan fino a Beer-Sheba, e fate il censimento del popolo»; i capi attraversano il Giordano e si accampano ad Aroer."
      nl: "David zegt tot Joab: “Trek nu om, door alle stammen van Israël, van Dan tot Ber-seba toe, en tel het volk”; de legeroversten steken de Jordaan over en slaan hun kamp op bij Aroër."
      cs: "David říká Joábovi: „Projdi i hned všecka pokolení Izraelská od Dan až k Bersabé, a sečtěte lid“; velitelé přecházejí Jordán a rozbíjejí tábor u Aroeru."
      sv: "David säger till Joav: ”Far igenom alla Israels stammar, från Dan ända till Beer-Seba, och anställen en folkräkning”; hövitsmännen går över Jordan och slår läger vid Aroer."
      nb: "David sier til Joab: «Dra omkring i alle Israels stammer fra Dan like til Be'erseba og mønstre folket»; hærførerne går over Jordan og slår leir ved Aroer."
      tl: "Sinabi ni David kay Joab, “Magparoo't parito ka nga sa lahat ng mga lipi ng Israel, mula sa Dan hanggang sa Beer-seba, at bilangin ninyo ang bayan”; tumawid ng Jordan ang mga kapitan at nagkampo sa Aroer."
  - place: a095b6e # Jazer
    ref: 2Sam.24.5
    note:
      en: "From Aroer the way leads toward Jazer, in the land of Gad."
      ru: "От Ароера путь идёт к Иазеру, в земле Гадовой."
      uk: "Від Ароера дорога веде до Язера, в землі Гада."
      es: "Desde Aroer el camino lleva hacia Jazer, en la tierra de Gad."
      pt: "De Aroer o caminho leva a Jazer, na terra de Gade."
      de: "Von Aroër führt der Weg nach Jaser im Land Gad."
      fr: "D’Aroër, le chemin mène vers Jaezer, dans le pays de Gad."
      pl: "Z Aroer droga prowadzi ku Jazer, w ziemi Gad."
      it: "Da Aroer la via conduce verso Iazer, nel paese di Gad."
      nl: "Vanaf Aroër leidt de weg naar Jaëzer, in het land van Gad."
      cs: "Od Aroeru vede cesta k Jazeru v zemi Gádově."
      sv: "Från Aroer leder vägen mot Jaser, i Gads land."
      nb: "Fra Aroer fører veien mot Jaser, i Gads land."
      tl: "Mula sa Aroer, ang daan ay patungo sa Jazer, sa lupain ng Gad."
