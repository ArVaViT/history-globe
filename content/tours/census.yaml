      en: "They come to Gilead and to the land of Tahtim-hodshi."
      ru: "Приходят в Галаад и в землю Тахтим-Ходши."
      uk: "Вони приходять до Гілеаду й до землі Тахтім-Ходші."
      es: "Llegan a Galaad y a la tierra de Tahtim-hodsi."
      pt: "Chegam a Gileade e à terra de Tatim-Hodsi."
      de: "Sie kommen nach Gilead und in das Land Tahtim-Hodschi."
      fr: "Ils arrivent en Galaad et dans le pays de Thachthim-Hodschi."
      pl: "Docierają do Gileadu i do ziemi Tachtim-Chodszi."
      it: "Giungono in Galaad e nel paese di Tahtim-Hodshi."
      nl: "Zij komen in Gilead en in het land Tachtim-Chodsi."
      cs: "Přicházejí do Gileadu a do země Tachtim-chodši."
      sv: "De kommer till Gilead och till landet Tahtim-Hodshi."
      nb: "De kommer til Gilead og til landet Tahtim-Hodsji."
      tl: "Dumating sila sa Gilead at sa lupain ng Tatimhodsi."
  - place: a513646 # Dan
    ref: 2Sam.24.6
    note:
      en: "They come to Dan-jaan, usually taken as Dan, the northern end of the land."
      ru: "Приходят в Дан-Яан, обычно понимаемый как Дан, северный край земли."
      uk: "Вони приходять до Дан-Яана, який зазвичай ототожнюють з Даном, північним краєм землі."
      es: "Llegan a Dan-jaán, que por lo común se identifica con Dan, el extremo norte del país."
      pt: "Chegam a Dã-Jaã, geralmente identificada com Dã, a extremidade norte da terra."
      de: "Sie kommen nach Dan-Jaan, gewöhnlich als Dan verstanden, das nördliche Ende des Landes."
      fr: "Ils arrivent à Dan-Jaan, ordinairement identifiée à Dan, l’extrémité nord du pays."
      pl: "Docierają do Dan-Jaan, zwykle utożsamianego z Dan, północnym krańcem kraju."
      it: "Giungono a Dan-Iaan, di solito identificata con Dan, all’estremità settentrionale del paese."
      nl: "Zij komen te Dan-Jaän, gewoonlijk opgevat als Dan, het noordelijke eind van het land."
      cs: "Přicházejí do Dan-jaanu, což se obvykle považuje za Dan, severní konec země."
      sv: "De kommer till Dan-Jaan, vanligen uppfattat som Dan, landets norra ände."
      nb: "De kommer til Dan-Jaan, vanligvis forstått som Dan, landets nordlige ende."
      tl: "Dumating sila sa Dan-jaan, na karaniwang itinuturing na Dan, ang hilagang dulo ng lupain."
  - place: a98e4d7 # Sidon
    ref: 2Sam.24.6
    note:
      en: "They go about to Sidon."
      ru: "Обходят Сидон."
      uk: "Вони обходять землю аж до Сідона."
      es: "Rodean hasta Sidón."
      pt: "Dão a volta até Sidom."
      de: "Sie ziehen im Bogen bis nach Sidon."
      fr: "Ils font le tour jusqu’à Sidon."
      pl: "Obchodzą kraj aż do Sydonu."
      it: "Girano intorno fino a Sidone."
      nl: "Zij trekken rond tot Sidon."
      cs: "Obcházejí až k Sidónu."
      sv: "De går runt till Sidon."
      nb: "De drar omkring til Sidon."
      tl: "Umikot sila hanggang sa Sidon."
  - place: a160272 # Tyre
    ref: 2Sam.24.7
    note:
      en: "They come to the stronghold of Tyre and to all the cities of the Hivites and the Canaanites."
      ru: "Приходят к укреплению Тира и во все города Хивеян и Хананеян."
      uk: "Вони приходять до твердині Тіру й до всіх міст хіввеїв і ханаанеїв."
      es: "Llegan a la fortaleza de Tiro y a todas las ciudades de los heveos y de los cananeos."
      pt: "Chegam à fortaleza de Tiro e a todas as cidades dos heveus e dos cananeus."
      de: "Sie kommen zur Festung Tyrus und zu allen Städten der Hiwiter und der Kanaaniter."
      fr: "Ils arrivent à la forteresse de Tyr et dans toutes les villes des Héviens et des Cananéens."
      pl: "Docierają do warowni Tyru i do wszystkich miast Chiwwitów i Kananejczyków."
      it: "Giungono alla fortezza di Tiro e a tutte le città degli Evei e dei Cananei."
      nl: "Zij komen bij de vesting van Tyrus en bij alle steden van de Hevieten en de Kanaänieten."
      cs: "Přicházejí k pevnosti Týru a ke všem městům Chivejců a Kenaanců."
      sv: "De kommer till fästet Tyros och till alla hivéernas och kananeernas städer."
      nb: "De kommer til festningen Tyros og til alle hevittenes og kanaaneernes byer."
      tl: "Dumating sila sa katibayan ng Tiro at sa lahat ng mga bayan ng mga Heveo at ng mga Cananeo."
  - place: ad2f6c2 # Beersheba
    ref: 2Sam.24.7
    note:
      en: "They go out to the south of Judah, to Beersheba."
      ru: "Выходят на юг Иудеи, в Вирсавию."
      uk: "Вони виходять на південь Юди, до Беер-Шеви."
      es: "Salen hacia el sur de Judá, a Beerseba."
      pt: "Saem para o sul de Judá, até Berseba."
      de: "Sie ziehen hinaus in den Süden Judas, nach Beerscheba."
      fr: "Ils sortent vers le midi de Juda, à Beer-Schéba."
      pl: "Wychodzą na południe Judy, do Beer-Szeby."
      it: "Escono verso il mezzogiorno di Giuda, a Bersabea."
      nl: "Zij trekken uit naar het zuiden van Juda, naar Berseba."
      cs: "Vycházejí na jih Judy, do Beer-šeby."
      sv: "De drar ut mot söder i Juda, till Beer Sheva."
      nb: "De drar ut mot Judas sørlige del, til Beer-Sjeba."
      tl: "Lumabas sila sa timog ng Juda, sa Beer-seba."
  - place: a15257a # Jerusalem
    ref: 2Sam.24.8-2Sam.24.25
    note:
      en: "After nine months and twenty days they come to Jerusalem: 800,000 men in Israel, 500,000 in Judah. David's heart smites him; he chooses the plague rather than the hand of man, 70,000 die from Dan to Beersheba, and the Lord stays the angel's hand by the threshing floor of Araunah the Jebusite, which David buys and builds an altar on."
      ru: "Через девять месяцев и двадцать дней они приходят в Иерусалим: восемьсот тысяч мужей в Израиле, пятьсот тысяч в Иудее. Сердце Давида вздрагивает; он выбирает язву, а не руки человеческие, умирает семьдесят тысяч от Дана до Вирсавии, и Господь останавливает Ангела у гумна Орны Иевусеянина, которое Давид покупает и ставит на нём жертвенник."
      uk: "Через дев’ять місяців і двадцять днів вони приходять до Єрусалима: 800 000 чоловіків в Ізраїлі, 500 000 в Юді. Серце Давида докоряє йому; він обирає мор, а не руку людську, від Дана до Беер-Шеви вмирає 70 000, і Господь зупиняє руку ангела біля тока Орни Євусея, який Давид купує й будує на ньому жертовник."
      es: "Al cabo de nueve meses y veinte días llegan a Jerusalén: 800 000 hombres en Israel, 500 000 en Judá. A David le remuerde el corazón; elige la peste antes que la mano de los hombres, mueren 70 000 desde Dan hasta Beerseba, y el Señor detiene la mano del ángel junto a la era de Arauna el jebuseo, que David compra y sobre la cual edifica un altar."
      pt: "Depois de nove meses e vinte dias chegam a Jerusalém: 800.000 homens em Israel, 500.000 em Judá. O coração de Davi o fere; ele escolhe a praga em vez da mão do homem, morrem 70.000 de Dã a Berseba, e o Senhor detém a mão do anjo junto à eira de Araúna, o jebuseu, que Davi compra e sobre a qual constrói um altar."
      de: "Nach neun Monaten und zwanzig Tagen kommen sie nach Jerusalem: 800 000 Mann in Israel, 500 000 in Juda. Davids Herz schlägt ihm; er wählt lieber die Pest als die Hand der Menschen, 70 000 sterben von Dan bis Beerscheba, und der Herr hält die Hand des Engels bei der Tenne Araunas, des Jebusiters, zurück, die David kauft und auf der er einen Altar baut."
      fr: "Après neuf mois et vingt jours, ils arrivent à Jérusalem : 800 000 hommes en Israël, 500 000 en Juda. Le cœur de David le frappe ; il choisit la peste plutôt que la main des hommes, 70 000 hommes meurent depuis Dan jusqu’à Beer-Schéba, et l’Éternel arrête la main de l’ange près de l’aire d’Aravna le Jébusien, que David achète pour y bâtir un autel."
      pl: "Po dziewięciu miesiącach i dwudziestu dniach docierają do Jerozolimy: 800 000 mężów w Izraelu, 500 000 w Judzie. Serce Dawida smaga go wyrzutami; wybiera zarazę zamiast ręki ludzkiej, umiera 70 000 ludzi od Dan do Beer-Szeby, a Pan powstrzymuje rękę anioła przy klepisku Arauny Jebusyty, które Dawid kupuje i buduje tam ołtarz."
      it: "Dopo nove mesi e venti giorni giungono a Gerusalemme: 800.000 uomini in Israele, 500.000 in Giuda. Il cuore di Davide lo rimorde; egli sceglie la peste piuttosto che la mano degli uomini, ne muoiono 70.000 da Dan a Bersabea, e il Signore ferma la mano dell’angelo presso l’aia di Araunà il Gebuseo, che Davide compra, e vi costruisce un altare."
      nl: "Na negen maanden en twintig dagen komen zij te Jeruzalem: 800.000 man in Israël, 500.000 in Juda. Davids hart slaat hem; hij kiest de pest liever dan de hand van mensen, 70.000 sterven van Dan tot Berseba, en de HEER houdt de hand van de engel tegen bij de dorsvloer van Arauna, de Jebusiet, die David koopt en waarop hij een altaar bouwt."
      cs: "Po devíti měsících a dvaceti dnech přicházejí do Jeruzaléma: 800 000 mužů v Izraeli, 500 000 v Judovi. Davida zasáhne výčitka srdce; volí raději mor než ruku člověka, od Danu po Beer-šebu umírá 70 000 a Hospodin zadrží ruku anděla u humna Aravny Jebusejského, které David kupuje a staví na něm oltář."
      sv: "Efter nio månader och tjugo dagar kommer de till Jerusalem: 800 000 man i Israel, 500 000 i Juda. Davids hjärta slår honom; han väljer pesten framför människohand, 70 000 dör från Dan till Beer Sheva, och Herren hejdar ängelns hand vid jebusiten Aravnas tröskplats, som David köper och bygger ett altare på."
      nb: "Etter ni måneder og tyve dager kommer de til Jerusalem: 800 000 mann i Israel, 500 000 i Juda. Davids hjerte slår ham; han velger pesten fremfor menneskers hånd, 70 000 dør fra Dan til Beer-Sjeba, og Herren holder engelens hånd tilbake ved jebusitten Aravnas treskeplass, som David kjøper og bygger et alter på."
      tl: "Pagkaraan ng siyam na buwan at dalawampung araw ay dumating sila sa Jerusalem: 800,000 lalaki sa Israel, 500,000 sa Juda. Nasaktan ang puso ni David; pinili niya ang salot kaysa sa kamay ng tao, 70,000 ang namatay mula sa Dan hanggang sa Beer-seba, at pinigil ng Panginoon ang kamay ng anghel sa giikan ni Arauna na Jebuseo, na binili ni David at pinagtayuan niya ng dambana."
