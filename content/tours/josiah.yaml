# Josiah's reform, 2 Kings 22-23, in the order of the text. The book of the law is found and
# the Passover kept in his eighteenth year (22:3, 23:23), 622 BC in the usual reckoning
# (621 BC is also held); that is the tour's year. His death at Megiddo in 609 BC is dated by
# the Babylonian Chronicle's account of that year's campaign (see the dated events).
id: josiah
title:
  en: "Josiah's reform"
  ru: "Реформа Иосии"
  uk: "Реформа Йосії"
  es: "La reforma de Josías"
  pt: "A reforma de Josias"
  de: "Josias Reform"
  fr: "La réforme de Josias"
year: "622 BC"
people: ["Josiah@1Ki.13.2-Mat"]
approximate: true
stops:
  - place: a15257a # Jerusalem
    ref: 2Kgs.22.3-2Kgs.22.20
    note:
      en: "In Josiah's eighteenth year Hilkiah finds the book of the law in the house of the Lord; the king rends his clothes and sends to inquire of the Lord through Huldah the prophetess, who dwelt in Jerusalem."
      ru: "В восемнадцатый год Иосии Хелкия находит книгу закона в доме Господнем; царь раздирает одежды свои и посылает вопросить Господа через Олдаму пророчицу, жившую в Иерусалиме."
      uk: "На вісімнадцятий рік Йосії Хелкія знаходить книгу закону в домі Господньому; цар роздирає свої шати й посилає спитати Господа через пророчицю Хулду, що жила в Єрусалимі."
      es: "En el año dieciocho de Josías, Hilcías halla el libro de la ley en la casa del Señor; el rey rasga sus vestidos y envía a consultar al Señor por medio de la profetisa Hulda, que vivía en Jerusalén."
      pt: "No décimo oitavo ano de Josias, Hilquias encontra o livro da lei na casa do Senhor; o rei rasga as suas vestes e manda consultar o Senhor por meio de Hulda, a profetisa, que morava em Jerusalém."
      de: "Im achtzehnten Jahr Josias findet Hilkija im Haus des Herrn das Gesetzbuch; der König zerreißt seine Kleider und lässt den Herrn durch die Prophetin Hulda befragen, die in Jerusalem wohnte."
      fr: "La dix-huitième année de Josias, Hilkija trouve le livre de la loi dans la maison de l’Éternel ; le roi déchire ses vêtements et envoie consulter l’Éternel auprès de la prophétesse Hulda, qui habitait à Jérusalem."
  - place: a553110 # Kidron
    ref: 2Kgs.23.4-2Kgs.23.7
    note:
      en: "The vessels made for Baal and for the grove are burnt without Jerusalem in the fields of Kidron, and the grove itself is brought out of the house of the Lord and burnt at the brook Kidron."
      ru: "Вещи, сделанные для Ваала и для Астарты, сжигают за Иерусалимом в долине Кедрон, а саму Астарту выносят из дома Господня и сжигают у потока Кедрона."
      uk: "Посуд, зроблений для Ваала й для гаю, спалюють поза Єрусалимом на полях Кедрону, а сам гай виносять із дому Господнього й спалюють при потоці Кедрон."
      es: "Los utensilios hechos para Baal y para la Asera se queman fuera de Jerusalén, en los campos del Cedrón, y la Asera misma es sacada de la casa del Señor y quemada junto al torrente Cedrón."
      pt: "Os utensílios feitos para Baal e para o poste de Aserá são queimados fora de Jerusalém, nos campos de Cedrom, e o próprio poste de Aserá é tirado da casa do Senhor e queimado junto ao ribeiro de Cedrom."
      de: "Die für Baal und für die Aschera gemachten Geräte werden außerhalb von Jerusalem auf den Feldern am Kidron verbrannt, und die Aschera selbst wird aus dem Haus des Herrn herausgebracht und am Bach Kidron verbrannt."
      fr: "Les ustensiles faits pour Baal et pour Astarté sont brûlés hors de Jérusalem, dans les champs du Cédron, et l’idole d’Astarté elle-même est sortie de la maison de l’Éternel et brûlée près du torrent du Cédron."
  - place: ad81b79 # Topheth
    ref: 2Kgs.23.10
    note:
      en: "He defiles Topheth in the Valley of Hinnom, so that no one may again make a son or a daughter pass through the fire to Molech."
      ru: "Он оскверняет Тофет в долине Еннома, «чтобы никто не проводил сына своего и дочери своей чрез огонь Молоху»."
      uk: "Він оскверняє Тофет у долині Гінном, щоб ніхто більше не проводив сина чи доньку через огонь для Молоха."
      es: "Profana Tofet, en el Valle de Hinnom, para que nadie vuelva a hacer pasar por el fuego a su hijo o a su hija en honor de Moloc."
      pt: "Profana Tofete, no Vale de Hinom, para que ninguém mais faça passar pelo fogo um filho ou uma filha a Moloque."
      de: "Er macht Tofet im Hinnomtal unrein, damit niemand mehr seinen Sohn oder seine Tochter dem Moloch durchs Feuer gehen lässt."
      fr: "Il souille Topheth dans la vallée de Hinnom, afin que personne ne fasse plus passer son fils ou sa fille par le feu en l’honneur de Moloc."
  - place: a64f355 # Bethel
    ref: 2Kgs.23.15-2Kgs.23.18
    note:
      en: "At Bethel he breaks down Jeroboam's altar and burns bones on it, as the man of God from Judah had foretold, and lets no man move that prophet's bones."
      ru: "В Вефиле он разрушает жертвенник Иеровоама и сжигает на нём кости, как предрёк человек Божий из Иудеи, а его костей трогать не велит."
      uk: "У Бет-Елі він руйнує жертовник Єровоама й спалює на ньому кістки, як провістив чоловік Божий з Юди, і нікому не дозволяє чіпати кістки того пророка."
      es: "En Betel derriba el altar de Jeroboam y quema huesos sobre él, como había anunciado el varón de Dios de Judá, y no deja que nadie mueva los huesos de aquel profeta."
      pt: "Em Betel derruba o altar de Jeroboão e queima ossos sobre ele, como o homem de Deus de Judá havia predito, e não deixa ninguém mexer nos ossos daquele profeta."
      de: "In Bethel reißt er den Altar Jerobeams nieder und verbrennt Gebeine darauf, wie der Mann Gottes aus Juda es vorausgesagt hatte, und lässt niemanden die Gebeine jenes Propheten anrühren."
      fr: "À Béthel, il démolit l’autel de Jéroboam et y brûle des ossements, comme l’avait annoncé l’homme de Dieu venu de Juda, et ne laisse personne toucher aux os de ce prophète."
  - place: a041bb3 # Samaria
    ref: 2Kgs.23.19-2Kgs.23.20
    note:
      en: "He takes away the houses of the high places in the cities of Samaria, as he had done in Bethel."
      ru: "Он разрушает капища высот в городах Самарийских, как сделал в Вефиле."
      uk: "Він знищує доми висот у містах Самарії, як зробив у Бет-Елі."
      es: "Quita las casas de los lugares altos en las ciudades de Samaria, como había hecho en Betel."
      pt: "Remove as casas dos altos nas cidades de Samaria, como havia feito em Betel."
      de: "Er beseitigt die Höhenheiligtümer in den Städten Samarias, wie er es in Bethel getan hatte."
      fr: "Il supprime les maisons des hauts lieux dans les villes de Samarie, comme il l’avait fait à Béthel."
  - place: a15257a # Jerusalem
    ref: 2Kgs.23.21-2Kgs.23.23
    note:
      en: "In Jerusalem the Passover is kept as it is written in the book of the covenant: none like it since the days of the judges."
      ru: "В Иерусалиме совершают пасху, как написано в книге завета: такой не было от дней судей."
      uk: "В Єрусалимі відзначають Пасху, як написано в книзі союзу: такої не було від днів суддів."
      es: "En Jerusalén se celebra la Pascua como está escrito en el libro del pacto: no hubo otra igual desde los días de los jueces."
      pt: "Em Jerusalém celebra-se a Páscoa como está escrito no livro da aliança: nenhuma igual desde os dias dos juízes."
      de: "In Jerusalem wird das Passa gefeiert, wie es im Buch des Bundes geschrieben steht: keines gleich ihm seit den Tagen der Richter."
      fr: "À Jérusalem, la Pâque est célébrée comme il est écrit dans le livre de l’alliance : il n’y en avait pas eu de semblable depuis le temps des juges."
  - place: a8554e3 # Megiddo
    ref: 2Kgs.23.29-2Kgs.23.30
    year: "609 BC"
    note:
      en: "Pharaoh Necho goes up against the king of Assyria to the Euphrates; Josiah goes against him, and Necho slays him at Megiddo when he has seen him."
      ru: "Фараон Нехао идёт против царя Ассирийского к Евфрату; Иосия выходит навстречу ему, и тот, увидев его, умерщвляет его в Мегиддоне."
      uk: "Фараон Нехао йде проти царя Ассирії до Євфрату; Йосія виступає проти нього, і Нехао вбиває його в Мегіддо, щойно побачивши його."
      es: "El faraón Necao sube contra el rey de Asiria, hacia el Éufrates; Josías sale a su encuentro, y Necao lo mata en Meguido apenas lo ve."
      pt: "O Faraó Neco sobe contra o rei da Assíria até o Eufrates; Josias vai contra ele, e Neco o mata em Megido quando o vê."
      de: "Pharao Necho zieht gegen den König von Assyrien zum Euphrat hinauf; Josia zieht ihm entgegen, und Necho erschlägt ihn in Megiddo, sobald er ihn gesehen hat."
      fr: "Pharaon Néco monte contre le roi d’Assyrie vers l’Euphrate ; Josias marche à sa rencontre, et Néco le tue à Meguiddo dès qu’il le voit."
