# Josiah's reform, 2 Kings 22-23, in the order of the text. The book of the law is found and
# the Passover kept in his eighteenth year (22:3, 23:23), 622 BC in the usual reckoning
# (621 BC is also held); that is the tour's year. His death at Megiddo in 609 BC is dated by
# the Babylonian Chronicle's account of that year's campaign (see the dated events).
id: josiah
title:
  en: "Josiah's reform"
  ru: "Реформа Иосии"
  uk: "Реформа Йосії"
  es: "La reforma de Josías"
  pt: "A reforma de Josias"
  de: "Josias Reform"
  fr: "La réforme de Josias"
  pl: "Reforma Jozjasza"
  it: "La riforma di Giosia"
  nl: "De hervorming van Josia"
  cs: "Jošijášova reforma"
  sv: "Josias reform"
  nb: "Josjias reform"
  tl: "Ang repormang ginawa ni Josias"
  da: "Josias' reform"
  sr: "Јосијина реформа"
  hu: "Jósiás reformja"
  fi: "Josian uudistus"
  vi: "Cuộc cải cách của Giô-si-a"
  ro: "Reforma lui Iosia"
  bg: "Реформата на Йосия"
year: "622 BC"
people: ["Josiah@1Ki.13.2-Mat"]
approximate: true
stops:
  - place: a15257a # Jerusalem
    ref: 2Kgs.22.3-2Kgs.22.20
    note:
      en: "In Josiah's eighteenth year Hilkiah finds the book of the law in the house of the Lord; the king rends his clothes and sends to inquire of the Lord through Huldah the prophetess, who dwelt in Jerusalem."
      ru: "В восемнадцатый год Иосии Хелкия находит книгу закона в доме Господнем; царь раздирает одежды свои и посылает вопросить Господа через Олдаму пророчицу, жившую в Иерусалиме."
      uk: "На вісімнадцятий рік Йосії Хелкія знаходить книгу закону в домі Господньому; цар роздирає свої шати й посилає спитати Господа через пророчицю Хулду, що жила в Єрусалимі."
      es: "En el año dieciocho de Josías, Hilcías halla el libro de la ley en la casa del Señor; el rey rasga sus vestidos y envía a consultar al Señor por medio de la profetisa Hulda, que vivía en Jerusalén."
      pt: "No décimo oitavo ano de Josias, Hilquias encontra o livro da lei na casa do Senhor; o rei rasga as suas vestes e manda consultar o Senhor por meio de Hulda, a profetisa, que morava em Jerusalém."
      de: "Im achtzehnten Jahr Josias findet Hilkija im Haus des Herrn das Gesetzbuch; der König zerreißt seine Kleider und lässt den Herrn durch die Prophetin Hulda befragen, die in Jerusalem wohnte."
      fr: "La dix-huitième année de Josias, Hilkija trouve le livre de la loi dans la maison de l’Éternel ; le roi déchire ses vêtements et envoie consulter l’Éternel auprès de la prophétesse Hulda, qui habitait à Jérusalem."
      pl: "W osiemnastym roku Jozjasza Chilkiasz znajduje księgę Prawa w domu Pańskim; król rozdziera swe szaty i posyła, aby zapytać Pana przez prorokinię Chuldę, która mieszkała w Jerozolimie."
      it: "Nel diciottesimo anno di Giosia Chelkia trova il libro della legge nella casa del Signore; il re si straccia le vesti e manda a consultare il Signore per mezzo della profetessa Culda, che abitava a Gerusalemme."
      nl: "In het achttiende jaar van Josia vindt Chilkia het wetboek in het huis van de HEER; de koning scheurt zijn kleren en laat de HEER raadplegen door de profetes Chulda, die in Jeruzalem woonde."
      cs: "V osmnáctém roce Jošijášově nalézá Chilkijáš v domě Hospodinově knihu zákona; král roztrhne roucho a posílá se dotázat Hospodina k prorokyni Chuldě, která bydlela v Jeruzalémě."
      sv: "I Josias artonde år finner Hilkia lagboken i Herrens hus; kungen river sönder sina kläder och sänder att fråga Herren genom profetissan Hulda, som bodde i Jerusalem."
      nb: "I Josjias attende år finner Hilkia lovboken i Herrens hus; kongen sønderriver sine klær og sender bud for å spørre Herren ved profetinnen Hulda, som bodde i Jerusalem."
      tl: "Sa ikalabingwalong taon ni Josias ay nasumpungan ni Hilcias ang aklat ng kautusan sa bahay ng Panginoon; hinapak ng hari ang kaniyang mga suot at nagsugo upang sumangguni sa Panginoon sa pamamagitan ni Hulda na propetisa, na tumatahan sa Jerusalem."
      da: "I Josias' attende år finder Hilkija lovbogen i Herrens hus; kongen sønderriver sine klæder og sender bud for at spørge Herren ved profetinden Hulda, som boede i Jerusalem."
      sr: "Осамнаесте године Јосијине Хелкија налази књигу закона у дому Господњем; цар раздире хаљине и шаље да се упита Господа преко пророчице Олде, која је становала у Јерусалиму."
      hu: "Jósiás tizennyolcadik évében Hilkija megtalálja a törvény könyvét az Úr házában; a király megszaggatja ruháit, és elküld, hogy Hulda prófétanő által megkérdezzék az Urat; Hulda Jeruzsálemben lakott."
      fi: "Josian kahdeksantenatoista vuonna Hilkia löytää lain kirjan Herran huoneesta; kuningas repäisee vaatteensa ja lähettää kysymään Herralta profeetta Huldan kautta, joka asui Jerusalemissa."
      vi: "Vào năm thứ mười tám đời Giô-si-a, Hinh-kia tìm được sách luật pháp trong nhà Đức Giê-hô-va; vua xé áo mình và sai người cầu vấn Đức Giê-hô-va qua nữ tiên tri Hun-đa, người ở tại Giê-ru-sa-lem."
      ro: "În al optsprezecelea an al lui Iosia, Hilchia găsește cartea legii în casa Domnului; regele își sfâșie hainele și trimite să-L întrebe pe Domnul prin proorocița Hulda, care locuia în Ierusalim."
      bg: "В осемнадесетата година на Йосия Хелкия намира книгата на закона в Господния дом; царят раздира дрехите си и изпраща да попитат Господа чрез пророчицата Олдама, която живееше в Йерусалим."
  - place: a553110 # Kidron
    ref: 2Kgs.23.4-2Kgs.23.7
    note:
      en: "The vessels made for Baal and for the grove are burnt without Jerusalem in the fields of Kidron, and the grove itself is brought out of the house of the Lord and burnt at the brook Kidron."
      ru: "Вещи, сделанные для Ваала и для Астарты, сжигают за Иерусалимом в долине Кедрон, а саму Астарту выносят из дома Господня и сжигают у потока Кедрона."
      uk: "Посуд, зроблений для Ваала й для гаю, спалюють поза Єрусалимом на полях Кедрону, а сам гай виносять із дому Господнього й спалюють при потоці Кедрон."
      es: "Los utensilios hechos para Baal y para la Asera se queman fuera de Jerusalén, en los campos del Cedrón, y la Asera misma es sacada de la casa del Señor y quemada junto al torrente Cedrón."
      pt: "Os utensílios feitos para Baal e para o poste de Aserá são queimados fora de Jerusalém, nos campos de Cedrom, e o próprio poste de Aserá é tirado da casa do Senhor e queimado junto ao ribeiro de Cedrom."
      de: "Die für Baal und für die Aschera gemachten Geräte werden außerhalb von Jerusalem auf den Feldern am Kidron verbrannt, und die Aschera selbst wird aus dem Haus des Herrn herausgebracht und am Bach Kidron verbrannt."
      fr: "Les ustensiles faits pour Baal et pour Astarté sont brûlés hors de Jérusalem, dans les champs du Cédron, et l’idole d’Astarté elle-même est sortie de la maison de l’Éternel et brûlée près du torrent du Cédron."
      pl: "Naczynia uczynione dla Baala i dla gaju zostają spalone poza Jerozolimą na polach Cedronu, a sam gaj zostaje wyniesiony z domu Pańskiego i spalony nad potokiem Cedron."
      it: "Gli arredi fatti per Baal e per l’Asera sono bruciati fuori di Gerusalemme, nei campi del Cedron, e l’Asera stessa è portata fuori dalla casa del Signore e bruciata presso il torrente Cedron."
      nl: "De voorwerpen die voor Baäl en voor het bos zijn gemaakt, worden buiten Jeruzalem verbrand in de velden van Kidron, en het bos zelf wordt uit het huis van de HEER gebracht en bij de beek Kidron verbrand."
      cs: "Nádoby učiněné pro Baala a pro háj jsou spáleny vně Jeruzaléma na polích Kidronu a sám háj je vynesen z domu Hospodinova a spálen u potoka Kidron."
      sv: "Redskapen som gjorts åt Baal och åt Aseran bränns utanför Jerusalem på Kidrons fält, och själva Aseran förs ut ur Herrens hus och bränns vid bäcken Kidron."
      nb: "Redskapene som var gjort til Baal og Astarte-billedet, blir brent utenfor Jerusalem på Kedron-markene, og selve Astarte-billedet blir ført ut av Herrens hus og brent ved bekken Kedron."
      tl: "Ang mga kasangkapang ginawa para kay Baal at para sa Asera ay sinunog sa labas ng Jerusalem sa mga parang ng Cedron, at ang Asera mismo ay inilabas sa bahay ng Panginoon at sinunog sa batis ng Cedron."
      da: "De kar, der var lavet til Ba'al og til lunden, brændes uden for Jerusalem på Kedrons marker, og selve lunden bringes ud af Herrens hus og brændes ved Kedron-bækken."
      sr: "Посуђе направљено за Вала и за луг спаљује се изван Јерусалима, на пољима кедронским, а сам луг износи се из дома Господњег и спаљује код потока Кедрона."
      hu: "A Baálnak és az Asera-fának készített edényeket Jeruzsálemen kívül, a Kidron mezején égetik el, magát az Asera-fát pedig kihozzák az Úr házából, és a Kidron patakánál elégetik."
      fi: "Baalia ja asera-patsasta varten tehdyt astiat poltetaan Jerusalemin ulkopuolella Kidronin pelloilla, ja itse asera-patsas tuodaan ulos Herran huoneesta ja poltetaan Kidronin purolla."
      vi: "Các khí dụng làm cho Ba-anh và cho tượng A-sê-ra bị thiêu ngoài Giê-ru-sa-lem, trong đồng ruộng Xết-rôn, và chính tượng A-sê-ra bị đem ra khỏi nhà Đức Giê-hô-va và bị đốt tại khe Xết-rôn."
      ro: "Vasele făcute pentru Baal și pentru Astarteea sunt arse afară din Ierusalim, în câmpiile Chedronului, iar Astarteea însăși este scoasă din casa Domnului și arsă la pârâul Chedron."
      bg: "Съдовете, направени за Ваал и за ашерата, са изгорени вън от Йерусалим в Кедронските полета, а самата ашера е изнесена от Господния дом и изгорена при потока Кедрон."
  - place: ad81b79 # Topheth
    ref: 2Kgs.23.10
    note:
      en: "He defiles Topheth in the Valley of Hinnom, so that no one may again make a son or a daughter pass through the fire to Molech."
      ru: "Он оскверняет Тофет в долине Еннома, «чтобы никто не проводил сына своего и дочери своей чрез огонь Молоху»."
      uk: "Він оскверняє Тофет у долині Гінном, щоб ніхто більше не проводив сина чи доньку через огонь для Молоха."
      es: "Profana Tofet, en el Valle de Hinnom, para que nadie vuelva a hacer pasar por el fuego a su hijo o a su hija en honor de Moloc."
      pt: "Profana Tofete, no Vale de Hinom, para que ninguém mais faça passar pelo fogo um filho ou uma filha a Moloque."
      de: "Er macht Tofet im Hinnomtal unrein, damit niemand mehr seinen Sohn oder seine Tochter dem Moloch durchs Feuer gehen lässt."
      fr: "Il souille Topheth dans la vallée de Hinnom, afin que personne ne fasse plus passer son fils ou sa fille par le feu en l’honneur de Moloc."
      pl: "Plugawi Tofet w Dolinie Hinnom, aby nikt już nie przeprowadzał swego syna ani córki przez ogień dla Molocha."
      it: "Contamina Tofet nella Valle di Innom, perché nessuno faccia più passare per il fuoco un figlio o una figlia in onore di Moloc."
      nl: "Hij ontwijdt Tofet in het Dal van Hinnom, zodat niemand daar nog een zoon of dochter door het vuur kan laten gaan voor Molech."
      cs: "Poskvrňuje Tofet v Hinómově údolí, aby už nikdo nemohl nechat syna nebo dceru procházet ohněm pro Moleka."
      sv: "Han orenar Tofet i Hinnoms dal, så att ingen mer ska låta sin son eller dotter gå genom eld åt Molok."
      nb: "Han vanhelliger Tofet i Hinnom-dalen, så ingen mere skal la sin sønn eller datter gå gjennom ilden for Molok."
      tl: "Nilapastangan niya ang Topheth sa libis ng Hinnom, upang hindi na maipasa ninuman sa apoy kay Moloch ang anak na lalaki o babae."
      da: "Han vanhelliger Tofet i Hinnoms Dal, så ingen mere lader sin søn eller datter gå gennem ilden til Molok."
      sr: "Оскрнављује Тофет у долини Еномовој, да нико више не проводи сина или кћер кроз огањ Молоху."
      hu: "Beszennyezi a Tófetet a Hinnom-völgyben, hogy senki se vezesse át többé fiát vagy leányát a tűzön Moloknak."
      fi: "Hän saastuttaa Tofetin Hinnomin laaksossa, ettei kukaan enää voisi panna poikaansa tai tytärtään kulkemaan tulen läpi Molokille."
      vi: "Người làm ô uế Tô-phết trong Trũng Hi-nôm, hầu cho từ rày về sau, không ai được đưa con trai hay con gái mình qua lửa cho Mo-lóc."
      ro: "Pângărește Tofetul din Valea Hinom, ca nimeni să nu-și mai treacă fiul sau fiica prin foc în cinstea lui Moloh."
      bg: "Той осквернява Тофет в долината Еном, за да не може никой вече да прекарва сина си или дъщеря си през огъня на Молох."
  - place: a64f355 # Bethel
    ref: 2Kgs.23.15-2Kgs.23.18
    note:
      en: "At Bethel he breaks down Jeroboam's altar and burns bones on it, as the man of God from Judah had foretold, and lets no man move that prophet's bones."
      ru: "В Вефиле он разрушает жертвенник Иеровоама и сжигает на нём кости, как предрёк человек Божий из Иудеи, а его костей трогать не велит."
      uk: "У Бет-Елі він руйнує жертовник Єровоама й спалює на ньому кістки, як провістив чоловік Божий з Юди, і нікому не дозволяє чіпати кістки того пророка."
      es: "En Betel derriba el altar de Jeroboam y quema huesos sobre él, como había anunciado el varón de Dios de Judá, y no deja que nadie mueva los huesos de aquel profeta."
      pt: "Em Betel derruba o altar de Jeroboão e queima ossos sobre ele, como o homem de Deus de Judá havia predito, e não deixa ninguém mexer nos ossos daquele profeta."
      de: "In Bethel reißt er den Altar Jerobeams nieder und verbrennt Gebeine darauf, wie der Mann Gottes aus Juda es vorausgesagt hatte, und lässt niemanden die Gebeine jenes Propheten anrühren."
      fr: "À Béthel, il démolit l’autel de Jéroboam et y brûle des ossements, comme l’avait annoncé l’homme de Dieu venu de Juda, et ne laisse personne toucher aux os de ce prophète."
      pl: "W Betel burzy ołtarz Jeroboama i pali na nim kości, jak zapowiedział mąż Boży z Judy, i nie pozwala nikomu poruszyć kości tego proroka."
      it: "A Betel abbatte l’altare di Geroboamo e vi brucia delle ossa, come aveva predetto l’uomo di Dio venuto da Giuda, e non lascia che nessuno tocchi le ossa di quel profeta."
      nl: "Te Bethel breekt hij het altaar van Jerobeam af en verbrandt er beenderen op, zoals de man Gods uit Juda had voorzegd, en laat niemand de beenderen van die profeet verplaatsen."
      cs: "V Bét-elu boří Jarobeámův oltář a pálí na něm kosti, jak předpověděl muž Boží z Judska, a nedovolí nikomu pohnout kostmi onoho proroka."
      sv: "I Betel river han ner Jerobeams altare och bränner ben på det, såsom gudsmannen från Juda hade förutsagt, och låter ingen röra den profetens ben."
      nb: "I Betel river han ned Jeroboams alter og brenner ben på det, som Guds mann fra Juda hadde forutsagt, og lar ingen flytte denne profetens ben."
      tl: "Sa Beth-el ay ibinagsak niya ang dambana ni Jeroboam at nagsunog ng mga buto roon, gaya ng ipinahayag ng lalaki ng Dios mula sa Juda, at hindi niya pinahintulutang galawin ninuman ang mga buto ng propetang iyon."
      da: "I Betel bryder han Jeroboams alter ned og brænder ben på det, som gudsmanden fra Juda havde forudsagt, og lader ingen røre ved den profets ben."
      sr: "У Ветиљу руши жртвеник Јеровоамов и пали кости на њему, као што је пророковао човек Божји из Јуде, и не да никоме да помери кости тог пророка."
      hu: "Bételben lerombolja Jeroboám oltárát, és csontokat éget rajta, ahogyan a Júdából jött Isten embere megjövendölte, és nem engedi, hogy bárki is megmozdítsa annak a prófétának a csontjait."
      fi: "Betelissä hän murtaa Jerobeamin alttarin ja polttaa luita sen päällä, kuten Juudasta tullut Jumalan mies oli ennustanut, eikä salli kenenkään liikuttaa sen profeetan luita."
      vi: "Tại Bê-tên, người phá bàn thờ của Giê-rô-bô-am và thiêu hài cốt trên đó, y như người của Đức Chúa Trời từ Giu-đa đã báo trước, và không cho ai dời hài cốt của đấng tiên tri ấy."
      ro: "La Betel dărâmă altarul lui Ieroboam și arde oase pe el, cum vestise omul lui Dumnezeu din Iuda, și nu lasă pe nimeni să miște oasele acelui profet."
      bg: "Във Ветил той събаря олтара на Йеровоам и изгаря кости върху него, както бе предсказал Божият човек от Юда, и не позволява никой да мести костите на онзи пророк."
  - place: a041bb3 # Samaria
    ref: 2Kgs.23.19-2Kgs.23.20
    note:
      en: "He takes away the houses of the high places in the cities of Samaria, as he had done in Bethel."
      ru: "Он разрушает капища высот в городах Самарийских, как сделал в Вефиле."
      uk: "Він знищує доми висот у містах Самарії, як зробив у Бет-Елі."
      es: "Quita las casas de los lugares altos en las ciudades de Samaria, como había hecho en Betel."
      pt: "Remove as casas dos altos nas cidades de Samaria, como havia feito em Betel."
      de: "Er beseitigt die Höhenheiligtümer in den Städten Samarias, wie er es in Bethel getan hatte."
      fr: "Il supprime les maisons des hauts lieux dans les villes de Samarie, comme il l’avait fait à Béthel."
      pl: "Usuwa domy wyżyn w miastach Samarii, tak jak uczynił w Betel."
      it: "Rimuove le case degli alti luoghi nelle città di Samaria, come aveva fatto a Betel."
      nl: "Hij verwijdert de huizen van de offerhoogten in de steden van Samaria, zoals hij te Bethel had gedaan."
      cs: "Odstraňuje domy výšin v samařských městech, jak učinil v Bét-elu."
      sv: "Han tar bort offerhöjdshusen i Samariens städer, såsom han hade gjort i Betel."
      nb: "Han tar bort husene på offerhaugene i Samarias byer, som han hadde gjort i Betel."
      tl: "Giniba niya ang mga bahay ng matataas na dako sa mga bayan ng Samaria, gaya ng ginawa niya sa Beth-el."
      da: "Han fjerner husene på offerhøjene i Samarias byer, som han havde gjort i Betel."
      sr: "Уклања куће на висинама по градовима самаријским, као што је учинио у Ветиљу."
      hu: "Eltávolítja a magaslatok házait Szamária városaiban, ahogyan Bételben is tette."
      fi: "Hän poistaa uhrikukkulain pyhäköt Samarian kaupungeista, kuten oli tehnyt Betelissä."
      vi: "Người dẹp các nhà của những nơi cao trong các thành Sa-ma-ri, như đã làm tại Bê-tên."
      ro: "Îndepărtează casele înălțimilor din cetățile Samariei, cum făcuse la Betel."
      bg: "Той премахва капищата на високите места в самарийските градове, както беше сторил във Ветил."
  - place: a15257a # Jerusalem
    ref: 2Kgs.23.21-2Kgs.23.23
    note:
      en: "In Jerusalem the Passover is kept as it is written in the book of the covenant: none like it since the days of the judges."
      ru: "В Иерусалиме совершают пасху, как написано в книге завета: такой не было от дней судей."
      uk: "В Єрусалимі відзначають Пасху, як написано в книзі союзу: такої не було від днів суддів."
      es: "En Jerusalén se celebra la Pascua como está escrito en el libro del pacto: no hubo otra igual desde los días de los jueces."
      pt: "Em Jerusalém celebra-se a Páscoa como está escrito no livro da aliança: nenhuma igual desde os dias dos juízes."
      de: "In Jerusalem wird das Passa gefeiert, wie es im Buch des Bundes geschrieben steht: keines gleich ihm seit den Tagen der Richter."
      fr: "À Jérusalem, la Pâque est célébrée comme il est écrit dans le livre de l’alliance : il n’y en avait pas eu de semblable depuis le temps des juges."
      pl: "W Jerozolimie obchodzi się Paschę, jak jest napisane w księdze przymierza: takiej nie było od dni sędziów."
      it: "A Gerusalemme si celebra la Pasqua come sta scritto nel libro dell’alleanza: nessuna simile dai giorni dei giudici."
      nl: "In Jeruzalem wordt het Pascha gehouden zoals het geschreven staat in het boek van het verbond: geen gelijk sinds de dagen van de richters."
      cs: "V Jeruzalémě se slaví pesach tak, jak je psáno v knize smlouvy: takový nebyl od dnů soudců."
      sv: "I Jerusalem firas påsken såsom det står skrivet i förbundsboken: ingen lik den sedan domarnas dagar."
      nb: "I Jerusalem blir påsken holdt slik det står skrevet i paktens bok: ingen slik siden dommernes dager."
      tl: "Sa Jerusalem ay ipinagdiriwang ang Paskua ayon sa nasusulat sa aklat ng tipan: wala pang katulad nito mula pa sa mga araw ng mga hukom."
      da: "I Jerusalem holdes påsken, som det er skrevet i pagtens bog: ingen som den siden dommernes dage."
      sr: "У Јерусалиму се држи Пасха како је написано у књизи завета: није било такве од дана судија."
      hu: "Jeruzsálemben a páskát úgy tartják meg, ahogyan a szövetség könyvében meg van írva: a bírák napjai óta nem volt hozzá fogható."
      fi: "Jerusalemissa vietetään pääsiäistä, niin kuin liiton kirjaan on kirjoitettu: sen veroista ei ole vietetty tuomarien päivistä asti."
      vi: "Tại Giê-ru-sa-lem, lễ Vượt Qua được giữ như đã chép trong sách giao ước: chưa hề có lễ nào như vậy từ đời các quan xét."
      ro: "În Ierusalim se ține Paștele așa cum este scris în cartea legământului: nu mai fusese unul ca el din zilele judecătorilor."
      bg: "В Йерусалим Пасхата се празнува, както е писано в книгата на завета: такава не е имало от дните на съдиите."
  - place: a8554e3 # Megiddo
    ref: 2Kgs.23.29-2Kgs.23.30
    year: "609 BC"
    note:
      en: "Pharaoh Necho goes up against the king of Assyria to the Euphrates; Josiah goes against him, and Necho slays him at Megiddo when he has seen him."
      ru: "Фараон Нехао идёт против царя Ассирийского к Евфрату; Иосия выходит навстречу ему, и тот, увидев его, умерщвляет его в Мегиддоне."
      uk: "Фараон Нехао йде проти царя Ассирії до Євфрату; Йосія виступає проти нього, і Нехао вбиває його в Мегіддо, щойно побачивши його."
      es: "El faraón Necao sube contra el rey de Asiria, hacia el Éufrates; Josías sale a su encuentro, y Necao lo mata en Meguido apenas lo ve."
      pt: "O Faraó Neco sobe contra o rei da Assíria até o Eufrates; Josias vai contra ele, e Neco o mata em Megido quando o vê."
      de: "Pharao Necho zieht gegen den König von Assyrien zum Euphrat hinauf; Josia zieht ihm entgegen, und Necho erschlägt ihn in Megiddo, sobald er ihn gesehen hat."
      fr: "Pharaon Néco monte contre le roi d’Assyrie vers l’Euphrate ; Josias marche à sa rencontre, et Néco le tue à Meguiddo dès qu’il le voit."
      pl: "Faraon Necho wyrusza przeciw królowi Asyrii nad Eufrat; Jozjasz wyrusza przeciw niemu, a Necho zabija go w Megiddo, gdy tylko go ujrzał."
      it: "Il faraone Necao sale contro il re d’Assiria verso l’Eufrate; Giosia gli muove contro, e Necao lo uccide a Meghiddo non appena lo vede."
      nl: "Farao Necho trekt op tegen de koning van Assyrië naar de Eufraat; Josia trekt tegen hem op, en Necho doodt hem te Megiddo zodra hij hem ziet."
      cs: "Faraon Neko táhne proti králi asyrskému k Eufratu; Jošijáš vytáhne proti němu a Neko ho zabije v Megidu, sotva ho uzře."
      sv: "Farao Neko drar upp mot Assyriens kung till Eufrat; Josia drar emot honom, och Neko dräper honom i Megiddo så snart han ser honom."
      nb: "Farao Neko drar opp mot kongen i Assyria til Eufrat; Josjia drar ham i møte, og Neko dreper ham i Megiddo så snart han ser ham."
      tl: "Umahon si Faraon Nechao laban sa hari ng Asiria hanggang sa Eufrates; sinalubong siya ni Josias, at pinatay siya ni Nechao sa Megiddo nang makita siya nito."
      da: "Farao Neko drager op imod Assyriens konge til Eufrat; Josias går imod ham, og Neko dræber ham ved Megiddo, så snart han har set ham."
      sr: "Фараон Нехао иде против цара асирског к Еуфрату; Јосија иде против њега, и Нехао га убија у Мегиду чим га је угледао."
      hu: "Nékó fáraó az asszír király ellen vonul az Eufráteszhez; Jósiás szembe megy vele, és Nékó megöli Megiddónál, mihelyt meglátja."
      fi: "Farao Neko nousee Assyrian kuningasta vastaan Eufratille; Josia lähtee häntä vastaan, ja Neko surmaa hänet Megiddossa heti nähtyään hänet."
      vi: "Pha-ra-ôn Nê-cô đi lên sông Ơ-phơ-rát đánh vua A-si-ri; Giô-si-a đi ngăn người, và Nê-cô giết người tại Mê-ghi-đô vừa khi gặp người."
      ro: "Faraonul Neco se suie împotriva regelui Asiriei, spre Eufrat; Iosia iese împotriva lui, iar Neco îl ucide la Meghido, de îndată ce îl vede."
      bg: "Фараон Нехао възлиза против асирийския цар към Ефрат; Йосия излиза срещу него и Нехао го убива в Мегидо, щом го вижда."
