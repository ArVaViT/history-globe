      url: "https://www.newadvent.org/fathers/0102.htm"
    note:
      en: "Polycarp, bishop of Smyrna, is brought into the stadium. Told to revile Christ, he answers: «Eighty and six years have I served Him, and He never did me any injury.» The fire does not consume him, and an executioner kills him with a dagger."
      ru: "Поликарпа, епископа Смирны, приводят на стадион. Когда от него требуют похулить Христа, он отвечает: «Уже восемьдесят шесть лет я служу Ему, и Он ничем не обидел меня». Огонь его не берёт, и палач убивает его кинжалом."
      uk: "Полікарпа, єпископа Смирни, приводять на стадіон. Коли йому велять зневажити Христа, він відповідає: «Вісімдесят шість років я служу Йому, і Він ніколи не зробив мені жодної кривди». Вогонь не спалює його, і кат убиває його кинджалом."
      es: "Policarpo, obispo de Esmirna, es llevado al estadio. Cuando le mandan injuriar a Cristo, responde: «Ochenta y seis años le he servido, y nunca me ha hecho ningún mal». El fuego no lo consume, y un verdugo lo mata con una daga."
      pt: "Policarpo, bispo de Esmirna, é levado ao estádio. Mandado injuriar Cristo, responde: “Há oitenta e seis anos eu o sirvo, e ele nunca me fez nenhum mal.” O fogo não o consome, e um carrasco o mata com um punhal."
      de: "Polykarp, der Bischof von Smyrna, wird ins Stadion geführt. Aufgefordert, Christus zu schmähen, antwortet er: „Sechsundachtzig Jahre diene ich ihm, und er hat mir nie ein Unrecht getan.“ Das Feuer verzehrt ihn nicht, und ein Henker tötet ihn mit einem Dolch."
      fr: "Polycarpe, évêque de Smyrne, est amené dans le stade. Sommé d’injurier le Christ, il répond : « Voilà quatre-vingt-six ans que je le sers, et il ne m’a fait aucun mal. » Le feu ne le consume pas, et un bourreau le tue d’un coup de poignard."
      pl: "Polikarp, biskup Smyrny, zostaje wprowadzony na stadion. Gdy każą mu złorzeczyć Chrystusowi, odpowiada: „Osiemdziesiąt sześć lat Mu służę, a On nigdy nie wyrządził mi żadnej krzywdy.” Ogień go nie trawi, a kat zabija go sztyletem."
      it: "Policarpo, vescovo di Smirne, è condotto nello stadio. Invitato a maledire Cristo, risponde: «Da ottantasei anni lo servo, ed egli non mi ha mai fatto alcun torto.» Il fuoco non lo consuma, e un carnefice lo uccide con un pugnale."
      nl: "Polycarpus, bisschop van Smyrna, wordt het stadion binnengebracht. Als hem wordt bevolen Christus te smaden, antwoordt hij: “Zesentachtig jaar dien ik Hem al, en Hij heeft mij nooit enig kwaad gedaan.” Het vuur verteert hem niet, en een beul doodt hem met een dolk."
      cs: "Polykarp, biskup ve Smyrně, je přiveden na stadion. Když je vyzván, aby tupil Krista, odpovídá: „Osmdesát šest let mu sloužím a nikdy mi neudělal nic zlého.“ Oheň ho nestravuje a kat ho zabíjí dýkou."
      sv: "Polykarpos, biskop av Smyrna, förs in på stadion. Uppmanad att smäda Kristus svarar han: ”I sex och åttio år har jag tjänat honom, och han har aldrig gjort mig något ont.” Elden förtär honom inte, och en bödel dräper honom med en dolk."
      nb: "Polykarp, biskop i Smyrna, føres inn på stadion. Da han blir befalt å spotte Kristus, svarer han: «Åttiseks år har jeg tjent ham, og han har aldri gjort meg noen skade.» Ilden fortærer ham ikke, og en bøddel dreper ham med en dolk."
      tl: "Dinadala si Policarpo, obispo ng Smirna, sa istadyum. Inuutusang lapastanganin si Cristo, sumasagot siya: “Walumpu't anim na taon ko na Siyang pinaglilingkuran, at kailanman ay wala Siyang ginawang masama sa akin.” Hindi siya tinutupok ng apoy, at pinapatay siya ng isang berdugo sa pamamagitan ng isang punyal."
      da: "Polykarp, biskop af Smyrna, føres ind på stadion. Da han bliver befalet at forhåne Kristus, svarer han: »Seksogfirs år har jeg tjent ham, og aldrig har han gjort mig noget ondt.« Ilden fortærer ham ikke, og en bøddel dræber ham med en dolk."
      sr: "Поликарпа, епископа смирнског, уводе на стадион. Када му кажу да похули на Христа, одговара: „Осамдесет и шест година служим Му и никад ми није учинио никакво зло.“ Ватра га не прождире, а џелат га убија бодежом."
      hu: "Polükarposzt, Szmürna püspökét bevezetik a stadionba. Amikor azt parancsolják neki, hogy gyalázza Krisztust, így felel: „Nyolcvanhat éve szolgálom Őt, és soha semmi sérelmet nem okozott nekem.” A tűz nem emészti meg, és egy hóhér tőrrel megöli."
      fi: "Smyrnan piispa Polykarpos tuodaan stadioniin. Kun häntä käsketään herjaamaan Kristusta, hän vastaa: ”Kahdeksankymmentäkuusi vuotta olen palvellut Häntä, eikä Hän ole koskaan tehnyt minulle mitään pahaa.” Tuli ei kuluta häntä, ja pyöveli surmaa hänet tikarilla."
      vi: "Polycarpus, giám mục Si-miệc-nơ, bị giải vào sân vận động. Khi bị bảo phải nguyền rủa Đấng Christ, ông đáp: “Tám mươi sáu năm tôi đã phục vụ Ngài, và Ngài chưa hề làm hại tôi điều gì.” Lửa không thiêu được ông, và một đao phủ dùng dao găm giết ông."
      ro: "Policarp, episcopul Smirnei, este adus în stadion. Când i se cere să-L hulească pe Hristos, răspunde: „Optzeci și șase de ani I-am slujit și nu mi-a făcut niciodată vreun rău.” Focul nu-l mistuie, iar un călău îl ucide cu pumnalul."
      bg: "Поликарп, епископ на Смирна, е въведен на стадиона. Когато му казват да похули Христос, отговаря: „Осемдесет и шест години му служа и той никога не ми стори зло.“ Огънят не го поглъща и палач го убива с кинжал."
