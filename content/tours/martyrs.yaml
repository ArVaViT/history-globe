    note:
      en: "Justin the philosopher, who had written in defence of the Christians to the emperors, often bested the Cynic Crescens in public debate. Through Crescens's plot he is put to death in Rome."
      ru: "Философ Иустин, писавший императорам в защиту христиан, не раз побеждал в публичных спорах киника Крискента. По козням Крискента его казнят в Риме."
      uk: "Філософ Юстин, який писав на захист християн до імператорів, часто перемагав кініка Крискента в публічних суперечках. Через змову Крискента його страчують у Римі."
      es: "Justino el filósofo, que había escrito a los emperadores en defensa de los cristianos, había vencido a menudo en debate público al cínico Crescente. Por las intrigas de Crescente es ejecutado en Roma."
      pt: "Justino, o filósofo, que escrevera em defesa dos cristãos aos imperadores, venceu muitas vezes o cínico Crescente em debates públicos. Por uma trama de Crescente, é morto em Roma."
      de: "Der Philosoph Justin, der zur Verteidigung der Christen an die Kaiser geschrieben hatte, besiegte den Kyniker Crescens oft in öffentlichen Streitgesprächen. Durch die Ränke des Crescens wird er in Rom hingerichtet."
      fr: "Justin le philosophe, qui avait écrit aux empereurs pour défendre les chrétiens, avait souvent eu le dessus sur le cynique Crescens dans des débats publics. À la suite d’une machination de Crescens, il est mis à mort à Rome."
      pl: "Justyn filozof, który pisał do cesarzy w obronie chrześcijan, wielokrotnie zwyciężał cynika Kreskensa w publicznych sporach. Wskutek spisku Kreskensa ponosi śmierć w Rzymie."
      it: "Giustino il filosofo, che aveva scritto in difesa dei cristiani agli imperatori, aveva spesso avuto la meglio sul cinico Crescente nei dibattiti pubblici. Per una macchinazione di Crescente è messo a morte a Roma."
      nl: "De filosoof Justinus, die ter verdediging van de christenen aan de keizers had geschreven, versloeg de cynicus Crescens vaak in openbare debatten. Door een intrige van Crescens wordt hij in Rome ter dood gebracht."
      cs: "Filosof Justin, který psal císařům na obranu křesťanů, často porážel kynika Crescenta ve veřejných disputacích. Crescentovými úklady je v Římě usmrcen."
      sv: "Filosofen Justinus, som hade skrivit till kejsarna till de kristnas försvar, besegrade ofta kynikern Crescens i offentliga dispyter. Genom Crescens’ ränker avrättas han i Rom."
      nb: "Filosofen Justin, som hadde skrevet forsvarsskrifter for de kristne til keiserne, beseiret ofte kynikeren Krescens i offentlig debatt. Gjennom Krescens' renkespill blir han henrettet i Roma."
      tl: "Si Justino na pilosopo, na sumulat ng pagtatanggol sa mga Cristiano para sa mga emperador, ay madalas manaig sa pampublikong pagtatalo laban sa Cinikong si Crescente. Dahil sa pakana ni Crescente ay pinapatay siya sa Roma."
      da: "Filosoffen Justin, som havde skrevet til kejserne til forsvar for de kristne, fik ofte overtaget over kynikeren Crescens i offentlig debat. Gennem Crescens' rænker bliver han henrettet i Rom."
      sr: "Филозоф Јустин, који је царевима написао одбрану хришћана, често је у јавној расправи надвладао циника Крескента. Крескентовом сплетком бива погубљен у Риму."
      hu: "Jusztinosz filozófus, aki a keresztények védelmében védőiratot intézett a császárokhoz, nyilvános vitában gyakran legyőzte a kynikus Crescenst. Crescens ármánya révén Rómában kivégzik."
      fi: "Filosofi Justinus, joka oli kirjoittanut keisareille kristittyjen puolustukseksi, voitti kyynikko Crescensin usein julkisessa väittelyssä. Crescensin juonittelun vuoksi hänet surmataan Roomassa."
      vi: "Justin, nhà triết học đã viết gửi các hoàng đế để biện hộ cho các Cơ Đốc nhân, đã nhiều lần thắng nhà triết học phái Khuyển nho Crescens trong các cuộc tranh luận công khai. Vì mưu của Crescens, ông bị xử tử ở Rô-ma."
      ro: "Iustin Filosoful, care scrisese în apărarea creștinilor către împărați, îl învinsese adesea în dezbateri publice pe cinicul Crescens. Prin uneltirea lui Crescens este omorât la Roma."
      bg: "Философът Юстин, който е писал до императорите в защита на християните, често е побеждавал в публични спорове циника Кресцент. По заговор на Кресцент той е умъртвен в Рим."
