        vi: "Lactantius, Về cái chết của những kẻ bách hại 12"
        ro: "Lactanțiu, Despre moartea persecutorilor 12"
        bg: "Лактанций, За смъртта на гонителите 12"
      url: "https://www.newadvent.org/fathers/0705.htm"
    note:
      en: "On the feast of Terminus the Great Persecution begins. The prefect and his officers break into the church at Nicomedia and burn the Scriptures, while Diocletian and Galerius watch from the palace; then the Praetorian Guard levels the building in a few hours."
      ru: "В праздник бога Термина начинается Великое гонение. Префект с чиновниками врываются в церковь Никомидии и сжигают Писания, а Диоклетиан и Галерий смотрят на это из дворца; затем преторианцы за несколько часов сносят здание."
      uk: "На свято бога Терміна починається Велике гоніння. Префект і його урядовці вдираються до церкви в Нікомедії й палять Писання, а Діоклетіан і Галерій дивляться з палацу; потім преторіанська гвардія за кілька годин зрівнює будівлю із землею."
      es: "En la fiesta de Término comienza la Gran Persecución. El prefecto y sus oficiales irrumpen en la iglesia de Nicomedia y queman las Escrituras, mientras Diocleciano y Galerio miran desde el palacio; luego la Guardia Pretoriana arrasa el edificio en pocas horas."
      pt: "Na festa de Término, as Terminálias, começa a Grande Perseguição. O prefeito e seus oficiais arrombam a igreja de Nicomédia e queimam as Escrituras, enquanto Diocleciano e Galério observam do palácio; depois a Guarda Pretoriana arrasa o edifício em poucas horas."
      de: "Am Fest der Terminalien beginnt die Große Verfolgung. Der Präfekt und seine Beamten brechen in die Kirche von Nikomedia ein und verbrennen die Heiligen Schriften, während Diokletian und Galerius vom Palast aus zusehen; dann ebnet die Prätorianergarde das Gebäude in wenigen Stunden ein."
      fr: "À la fête des Terminalia, la Grande Persécution commence. Le préfet et ses officiers forcent l’entrée de l’église de Nicomédie et brûlent les Écritures, tandis que Dioclétien et Galère regardent depuis le palais ; puis la garde prétorienne rase l’édifice en quelques heures."
      pl: "W święto Terminaliów zaczyna się Wielkie Prześladowanie. Prefekt i jego urzędnicy włamują się do kościoła w Nikomedii i palą Pisma, podczas gdy Dioklecjan i Galeriusz patrzą z pałacu; potem gwardia pretoriańska równa budynek z ziemią w ciągu kilku godzin."
      it: "Nella festa dei Terminali comincia la Grande Persecuzione. Il prefetto e i suoi ufficiali irrompono nella chiesa di Nicomedia e bruciano le Scritture, mentre Diocleziano e Galerio guardano dal palazzo; poi la guardia pretoriana rade al suolo l’edificio in poche ore."
      nl: "Op het feest van Terminus begint de Grote Vervolging. De prefect en zijn ambtenaren breken de kerk in Nicomedia binnen en verbranden de Schriften, terwijl Diocletianus en Galerius vanuit het paleis toekijken; daarna maakt de pretoriaanse garde het gebouw in enkele uren met de grond gelijk."
      cs: "O svátku Termina začíná Velké pronásledování. Prefekt a jeho důstojníci vnikají do kostela v Nikomédii a pálí Písma, zatímco Dioklecián a Galerius přihlížejí z paláce; poté pretoriánská garda během několika hodin budovu srovná se zemí."
      sv: "På Terminusfesten börjar den stora förföljelsen. Prefekten och hans tjänstemän bryter sig in i kyrkan i Nikomedia och bränner Skrifterna, medan Diokletianus och Galerius ser på från palatset; sedan jämnar pretorianergardet byggnaden med marken på några timmar."
      nb: "På Terminus-festen begynner den store forfølgelsen. Prefekten og hans folk bryter seg inn i kirken i Nikomedia og brenner Skriftene, mens Diokletian og Galerius ser på fra palasset; så jevner pretorianergarden bygningen med jorden i løpet av noen timer."
      tl: "Sa kapistahan ng Terminus ay nagsisimula ang Dakilang Pag-uusig. Pumapasok nang sapilitan ang prepekto at ang kaniyang mga opisyal sa simbahan sa Nicomedia at sinusunog ang mga Kasulatan, habang nanonood sina Diocleciano at Galerio mula sa palasyo; pagkatapos ay iginigiba ng Gwardiyang Pretoriano ang gusali sa loob ng ilang oras."
      da: "På Terminus' festdag begynder den store forfølgelse. Præfekten og hans embedsmænd bryder ind i kirken i Nikomedeia og brænder Skrifterne, mens Diokletian og Galerius ser til fra paladset; derefter jævner prætorianergarden bygningen med jorden på få timer."
      sr: "На празник бога Термина почиње Велики прогон. Префект и његови службеници проваљују у цркву у Никомедији и спаљују Писмо, док Диоклецијан и Галерије посматрају из палате; затим преторијанска гарда за неколико сати сравњује зграду са земљом."
      hu: "Terminus ünnepén megkezdődik a nagy üldözés. A prefektus és tisztjei betörnek a nikomédeiai templomba, és elégetik a Szentírás könyveit, miközben Diocletianus és Galerius a palotából nézik; majd a praetorianus gárda néhány óra alatt a földdel teszi egyenlővé az épületet."
      fi: "Terminuksen juhlana Suuri vaino alkaa. Prefekti ja hänen virkamiehensä murtautuvat Nikomedian kirkkoon ja polttavat Raamatut, kun Diocletianus ja Galerius katselevat palatsista; sitten pretoriaanikaarti tasoittaa rakennuksen maan tasalle muutamassa tunnissa."
      vi: "Vào ngày lễ thần Terminus, cuộc Đại Bách hại bắt đầu. Quan tổng trấn và các thuộc hạ đột nhập nhà thờ ở Nicomedia và đốt Kinh Thánh, trong khi Diocletianus và Galerius theo dõi từ cung điện; rồi Cấm vệ quân san phẳng tòa nhà trong vài giờ."
      ro: "În ziua sărbătorii zeului Terminus începe Marea Persecuție. Prefectul și slujbașii săi sparg ușile bisericii din Nicomedia și ard Scripturile, în timp ce Dioclețian și Galeriu privesc de la palat; apoi garda pretoriană dărâmă clădirea până la pământ în câteva ore."
      bg: "На празника на бог Термин започва Великото гонение. Префектът и служителите му нахлуват в църквата в Никомедия и изгарят Писанията, докато Диоклетиан и Галерий наблюдават от двореца; после преторианската гвардия срива сградата за няколко часа."
