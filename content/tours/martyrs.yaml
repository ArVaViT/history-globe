    note:
      en: "The churches of Lyons and Vienne, the chief cities of Gaul on the Rhône, write to Asia and Phrygia of their martyrs. Among them is the slave woman Blandina, whose mistress feared she was too weak to confess; her torturers wore themselves out and owned themselves beaten."
      ru: "Церкви Лиона и Вьенны, главных городов Галлии на Роне, пишут в Асию и Фригию о своих мучениках. Среди них рабыня Бландина: её госпожа боялась, что та по немощи не устоит, а мучители Бландины изнемогли и признали себя побеждёнными."
      uk: "Церкви Ліона й В’єнни, головних міст Галлії на Роні, пишуть до Азії та Фригії про своїх мучеників. Серед них рабиня Бландіна, про яку її господиня боялася, що вона надто слабка, щоб сповідувати віру; її мучителі виснажилися й визнали себе переможеними."
      es: "Las iglesias de Lyon y Vienne, las principales ciudades de la Galia, junto al Ródano, escriben a Asia y a Frigia sobre sus mártires. Entre ellos está la esclava Blandina, cuya señora temía que fuese demasiado débil para confesar; sus torturadores se agotaron y se declararon vencidos."
      pt: "As igrejas de Lyon e de Vienne, as principais cidades da Gália às margens do Ródano, escrevem à Ásia e à Frígia sobre os seus mártires. Entre eles está a escrava Blandina, cuja senhora temia que fosse fraca demais para confessar; os seus torturadores se esgotaram e se deram por vencidos."
      de: "Die Kirchen von Lyon und Vienne, den führenden Städten Galliens an der Rhone, schreiben nach Asien und Phrygien über ihre Märtyrer. Unter ihnen ist die Sklavin Blandina, von der ihre Herrin fürchtete, sie sei zu schwach für das Bekenntnis; ihre Folterer ermatteten und gaben sich geschlagen."
      fr: "Les Églises de Lyon et de Vienne, principales villes de la Gaule sur le Rhône, écrivent à l’Asie et à la Phrygie au sujet de leurs martyrs. Parmi eux se trouve l’esclave Blandine, dont la maîtresse craignait qu’elle ne fût trop faible pour confesser sa foi ; ses bourreaux s’épuisent et s’avouent vaincus."
      pl: "Kościoły Lugdunum i Vienne, głównych miast Galii nad Rodanem, piszą do Azji i Frygii o swoich męczennikach. Wśród nich jest niewolnica Blandyna, której pani obawiała się, że będzie zbyt słaba, by wyznać wiarę; jej oprawcy opadli z sił i przyznali się do porażki."
      it: "Le chiese di Lione e di Vienne, le principali città della Gallia sul Rodano, scrivono all’Asia e alla Frigia dei loro martiri. Tra loro c’è la schiava Blandina, la cui padrona temeva che fosse troppo debole per confessare; i suoi torturatori si stancarono e si riconobbero vinti."
      nl: "De kerken van Lyon en Vienne, de voornaamste steden van Gallië aan de Rhône, schrijven aan Asia en Frygië over hun martelaren. Onder hen is de slavin Blandina, van wie haar meesteres vreesde dat zij te zwak was om te belijden; haar folteraars raakten uitgeput en erkenden dat zij verslagen waren."
      cs: "Církve v Lyonu a Vienne, hlavních městech Galie na Rhôně, píší do Asie a Frygie o svých mučednících. Mezi nimi je otrokyně Blandina, o níž se její paní bála, že je příliš slabá, aby vyznala víru; její trýznitelé se vysílili a uznali, že jsou poraženi."
      sv: "Församlingarna i Lyon och Vienne, Galliens förnämsta städer vid Rhône, skriver till Asien och Frygien om sina martyrer. Bland dem finns slavkvinnan Blandina, vars härskarinna fruktade att hon var för svag för att bekänna; hennes plågare tröttades ut och erkände sig besegrade."
      nb: "Menighetene i Lyon og Vienne, de ledende byene i Gallia ved Rhône, skriver til Asia og Frygia om sine martyrer. Blant dem er slavekvinnen Blandina, som herskerinnen hennes fryktet var for svak til å bekjenne; bødlene hennes slet seg ut og innrømmet at de var slått."
      tl: "Sumusulat ang mga iglesia ng Lyon at Vienne, ang mga pangunahing lungsod ng Galia sa Rhône, sa Asia at Frigia tungkol sa kanilang mga martir. Kabilang sa kanila ang aliping babaeng si Blandina, na kinatakutan ng kaniyang among babae na masyadong mahina upang magpahayag ng pananampalataya; napagod ang kaniyang mga nagpapahirap at inamin na sila'y natalo."
      da: "Menighederne i Lyon og Vienne, de fornemste byer i Gallien ved Rhône, skriver til Asia og Frygien om deres martyrer. Blandt dem er slavinden Blandina, hvis herskerinde frygtede, at hun var for svag til at bekende; hendes bødler udmattede sig selv og indrømmede sig overvundet."
      sr: "Цркве у Лиону и Вијену, главним градовима Галије на Рони, пишу Азији и Фригији о својим мученицима. Међу њима је робиња Бландина, за коју је њена господарица страховала да је сувише слаба да исповеди веру; мучитељи су се изморили и признали да су побеђени."
      hu: "Lyon és Vienne, a Rhône menti Gallia fő városainak egyházai levelet írnak Ázsia és Frígia egyházainak vértanúikról. Köztük van Blandina rabszolganő, akiről úrnője attól félt, hogy túl gyenge a hitvalláshoz; kínzói kifáradtak, és beismerték vereségüket."
      fi: "Rhônen varrella sijaitsevien Gallian pääkaupunkien, Lyonin ja Viennen, seurakunnat kirjoittavat Aasian ja Fryygian seurakunnille marttyyreistaan. Heidän joukossaan on orjatar Blandina, jonka emäntä pelkäsi hänen olevan liian heikko tunnustamaan; hänen kiduttajansa uupuivat ja myönsivät hävinneensä."
      vi: "Các Hội thánh ở Lyon và Vienne, những thành chính của xứ Gaul bên sông Rhône, viết cho các Hội thánh ở A-si và Phi-ri-gi về các thánh tử đạo của mình. Trong số đó có nữ nô lệ Blandina, người mà bà chủ từng lo rằng cô quá yếu đuối để xưng nhận đức tin; những kẻ tra tấn cô kiệt sức và phải nhận mình thua."
      ro: "Bisericile din Lyon și Vienne, principalele cetăți ale Galiei de pe Ron, le scriu celor din Asia și Frigia despre martirii lor. Printre ei se află roaba Blandina, a cărei stăpână se temea că este prea slabă ca să mărturisească; chinuitorii ei s-au istovit și s-au recunoscut înfrânți."
      bg: "Църквите в Лион и Виен, главните градове на Галия по Рона, пишат до Азия и Фригия за своите мъченици. Сред тях е робинята Бландина, чиято господарка се е бояла, че е твърде слаба, за да изповяда вярата си; мъчителите ѝ се изтощават и признават поражението си."
  - place: aee7248 # Alexandria
    year: "AD 202"
    source:
      cite:
        en: "Eusebius, Church History 6.1, 6.2.2"
        ru: "Евсевий, Церковная история 6.1, 6.2.2"
        uk: "Євсевій, Церковна історія 6.1, 6.2.2"
