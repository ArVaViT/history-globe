        fr: "Lactance, De la mort des persécuteurs 12"
        pl: "Laktancjusz, O śmierci prześladowców 12"
        it: "Lattanzio, La morte dei persecutori 12"
        nl: "Lactantius, Over de dood van de vervolgers 12"
        cs: "Lactantius, O smrti pronásledovatelů 12"
        sv: "Lactantius, Om förföljarnas död 12"
        nb: "Lactantius, Om forfølgernes død 12"
