        hu: "Pontius, Cyprianus élete és szenvedése 15, 18-19"
        fi: "Pontius, Cyprianuksen elämä ja kärsimys 15, 18-19"
        vi: "Pontius, Cuộc đời và cuộc khổ nạn của Cyprian 15, 18-19"
        ro: "Pontiu, Viața și pătimirea lui Ciprian 15, 18-19"
        bg: "Понтий, Житие и страдание на Киприан 15, 18-19"
      url: "https://www.newadvent.org/fathers/0505.htm"
    note:
      en: "Word runs through all Carthage that Cyprian is brought to trial. He binds his own eyes before the sword. He is the first bishop of Carthage, his companion Pontius writes, to die a martyr."
      ru: "По всему Карфагену разносится весть, что Киприана ведут на суд. Перед мечом он сам завязывает себе глаза. Он первым из епископов Карфагена принял мученичество, пишет его спутник Понтий."
      uk: "Усім Карфагеном біжить звістка, що Кипріяна ведуть на суд. Він сам зав’язує собі очі перед мечем. Як пише його супутник Понцій, він перший з єпископів Карфагена, хто помер мучеником."
      es: "Corre por toda Cartago la noticia de que Cipriano es llevado a juicio. Él mismo se venda los ojos ante la espada. Es el primer obispo de Cartago, escribe su compañero Poncio, que muere mártir."
      pt: "Corre por toda Cartago a notícia de que Cipriano é levado a julgamento. Ele mesmo venda os olhos diante da espada. É o primeiro bispo de Cartago, escreve o seu companheiro Pôncio, a morrer como mártir."
      de: "Durch ganz Karthago läuft die Kunde, dass Cyprian vor Gericht geführt wird. Vor dem Schwert verbindet er sich selbst die Augen. Er ist der erste Bischof von Karthago, schreibt sein Gefährte Pontius, der als Märtyrer stirbt."
      fr: "Le bruit se répand dans toute Carthage que Cyprien est amené en jugement. Il se bande lui-même les yeux devant l’épée. Il est le premier évêque de Carthage, écrit son compagnon Ponce, à mourir martyr."
      pl: "Po całej Kartaginie rozchodzi się wieść, że Cyprian zostaje postawiony przed sądem. Sam zawiązuje sobie oczy przed mieczem. Jest pierwszym biskupem Kartaginy, który poniósł śmierć męczeńską, pisze jego towarzysz Poncjusz."
      it: "Corre voce in tutta Cartagine che Cipriano è condotto in giudizio. Si benda da solo gli occhi davanti alla spada. È il primo vescovo di Cartagine, scrive il suo compagno Ponzio, a morire martire."
      nl: "Door heel Carthago gaat het bericht dat Cyprianus voor het gerecht wordt gebracht. Voor het zwaard blinddoekt hij zichzelf. Hij is, schrijft zijn metgezel Pontius, de eerste bisschop van Carthago die als martelaar sterft."
      cs: "Celým Kartágem se šíří zpráva, že Cyprián je veden k soudu. Sám si před mečem zavazuje oči. Podle jeho druha Pontia je prvním kartáginským biskupem, který zemřel jako mučedník."
      sv: "Ryktet går genom hela Kartago att Cyprianus förs till rannsakan. Han binder själv för sina ögon inför svärdet. Han är den förste biskopen av Kartago, skriver hans följeslagare Pontius, som dött martyrdöden."
      nb: "Ryktet går gjennom hele Kartago om at Cyprian blir stilt for retten. Han binder selv for øynene før sverdet. Han er den første biskopen i Kartago som dør som martyr, skriver hans følgesvenn Pontius."
      tl: "Kumakalat sa buong Cartago ang balita na dinadala sa paglilitis si Cipriano. Siya mismo ang tumatakip sa kaniyang mga mata bago ang tabak. Siya ang unang obispo ng Cartago, isinulat ng kaniyang kasamang si Poncio, na namatay bilang martir."
      da: "Rygtet løber gennem hele Karthago om, at Cyprian føres for retten. Han binder selv bind for øjnene, før sværdet falder. Han er den første biskop af Karthago, der dør som martyr, skriver hans følgesvend Pontius."
      sr: "Кроз целу Картагину шири се вест да Кипријана изводе на суд. Пред мачем сам себи завезује очи. Он је, пише његов пратилац Понтије, први картагински епископ који умире као мученик."
      hu: "Végigfut egész Karthágón a hír, hogy Cyprianust bíróság elé állítják. A kardcsapás előtt maga köti be a szemét. Társa, Pontius szerint ő az első karthágói püspök, aki vértanúhalált hal."
      fi: "Koko Karthagossa kiirii sana, että Cyprianus viedään oikeuteen. Hän sitoo itse silmänsä miekan edessä. Hän on Karthagon ensimmäinen marttyyrikuoleman kuollut piispa, kirjoittaa hänen seuralaisensa Pontius."
      vi: "Tin lan khắp Carthage rằng Cyprian bị đưa ra xét xử. Ông tự bịt mắt mình trước lưỡi gươm. Pontius, người bạn đồng hành của ông, viết rằng ông là giám mục đầu tiên của Carthage chịu tử đạo."
      ro: "Vestea aleargă prin toată Cartagina că Ciprian este adus la judecată. Își leagă singur ochii înaintea sabiei. Este primul episcop al Cartaginei care moare ca martir, scrie tovarășul său Pontiu."
      bg: "Из целия Картаген се разнася вест, че Киприан е изведен на съд. Сам си връзва очите пред меча. Той е първият епископ на Картаген, който умира като мъченик, пише неговият спътник Понтий."
  - place: "511337" # Nicomedia
    year: "AD 303"
    source:
      cite:
        en: "Lactantius, On the Deaths of the Persecutors 12"
        ru: "Лактанций, О смертях гонителей 12"
        uk: "Лактанцій, Про смерті переслідувачів 12"
