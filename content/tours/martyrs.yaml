      url: "https://www.newadvent.org/fathers/250106.htm"
    note:
      en: "When Severus persecutes the churches, Christians from all Egypt and the Thebaid are brought to Alexandria to die. Among them is Leonides, father of Origen, beheaded while his son is still young."
      ru: "Когда Север начинает гонение на церкви, христиан со всего Египта и Фиваиды свозят на казнь в Александрию. Среди них Леонид, отец Оригена, обезглавленный, когда сын был ещё юн."
      uk: "Коли Север переслідує церкви, християн з усього Єгипту й Фіваїди приводять до Александрії на смерть. Серед них Леонід, батько Орігена, якому відтинають голову, коли його син ще юний."
      es: "Cuando Severo persigue a las iglesias, cristianos de todo Egipto y de la Tebaida son llevados a Alejandría para morir. Entre ellos está Leónidas, padre de Orígenes, decapitado cuando su hijo es todavía joven."
      pt: "Quando Severo persegue as igrejas, cristãos de todo o Egito e da Tebaida são levados a Alexandria para morrer. Entre eles está Leônidas, pai de Orígenes, decapitado quando o filho ainda é jovem."
      de: "Als Severus die Kirchen verfolgt, werden Christen aus ganz Ägypten und der Thebais nach Alexandria gebracht, um zu sterben. Unter ihnen ist Leonides, der Vater des Origenes, der enthauptet wird, als sein Sohn noch jung ist."
      fr: "Quand Sévère persécute les Églises, des chrétiens de toute l’Égypte et de la Thébaïde sont amenés à Alexandrie pour y mourir. Parmi eux se trouve Léonide, père d’Origène, décapité alors que son fils est encore jeune."
      pl: "Gdy Sewer prześladuje Kościoły, chrześcijan z całego Egiptu i Tebaidy sprowadza się do Aleksandrii na śmierć. Wśród nich jest Leonides, ojciec Orygenesa, ścięty, gdy jego syn jest jeszcze młody."
      it: "Quando Severo perseguita le chiese, cristiani di tutto l’Egitto e della Tebaide sono condotti ad Alessandria per morire. Tra loro c’è Leonide, padre di Origene, decapitato quando il figlio è ancora giovane."
      nl: "Wanneer Severus de kerken vervolgt, worden christenen uit heel Egypte en de Thebaïs naar Alexandrië gebracht om te sterven. Onder hen is Leonides, de vader van Origenes, die wordt onthoofd terwijl zijn zoon nog jong is."
      cs: "Když Severus pronásleduje církve, jsou křesťané z celého Egypta a Thébaidy přiváděni na smrt do Alexandrie. Mezi nimi je Leonidés, Órigenův otec, jenž je sťat, dokud je jeho syn ještě mladý."
      sv: "När Severus förföljer församlingarna förs kristna från hela Egypten och Thebais till Alexandria för att dö. Bland dem är Leonides, Origenes’ far, som halshuggs medan sonen ännu är ung."
      nb: "Da Severus forfølger kirkene, føres kristne fra hele Egypt og Thebais til Aleksandria for å dø. Blant dem er Leonides, Origenes' far, som blir halshugget mens sønnen ennå er ung."
      tl: "Nang usigin ni Severo ang mga iglesia, dinadala sa Alejandria ang mga Cristiano mula sa buong Egipto at Tebaida upang mamatay. Kabilang sa kanila si Leonides, ama ni Origen, na pinupugutan ng ulo habang bata pa ang kaniyang anak."
      da: "Da Severus forfølger menighederne, bliver kristne fra hele Egypten og Thebais bragt til Alexandria for at dø. Blandt dem er Leonides, Origenes' far, som bliver halshugget, mens hans søn endnu er ung."
      sr: "Када Север прогони цркве, хришћане из целог Египта и Тебаиде доводе у Александрију на смрт. Међу њима је Леонид, Оригенов отац, обезглављен док је његов син још млад."
      hu: "Amikor Severus üldözi az egyházakat, egész Egyiptomból és a Thébaiszból keresztényeket visznek Alexandriába, hogy meghaljanak. Köztük van Leonidész, Órigenész apja, akit lefejeznek, amikor fia még ifjú."
      fi: "Kun Severus vainoaa seurakuntia, kristittyjä koko Egyptistä ja Thebaisista tuodaan Aleksandriaan kuolemaan. Heidän joukossaan on Origeneen isä Leonides, joka mestataan poikansa ollessa vielä nuori."
      vi: "Khi Severus bách hại các Hội thánh, các tín hữu từ khắp Ê-díp-tô và Thebais bị giải đến A-léc-xan-tri để chịu chết. Trong số đó có Leonides, cha của Origen, bị chém đầu khi con trai ông còn trẻ."
      ro: "Când Sever persecută bisericile, creștini din tot Egiptul și din Tebaida sunt aduși la Alexandria ca să moară. Printre ei este Leonid, tatăl lui Origen, decapitat pe când fiul său era încă tânăr."
      bg: "Когато Север преследва църквите, християни от целия Египет и Тиваида са докарани в Александрия да умрат. Сред тях е Леонид, бащата на Ориген, обезглавен, докато синът му е още млад."
  - place: aa56bd1 # Carthage
    year: "AD 258"
    source:
      cite:
        en: "Pontius, Life and Passion of Cyprian 15, 18-19"
        ru: "Понтий, Житие и страдание Киприана 15, 18-19"
        uk: "Понцій, Життя і страждання Кипріяна 15, 18-19"
        es: "Poncio, Vida y pasión de Cipriano 15, 18-19"
        pt: "Pôncio, Vida e Paixão de Cipriano 15, 18-19"
        de: "Pontius, Leben und Leiden Cyprians 15, 18-19"
        fr: "Ponce, Vie et passion de Cyprien 15, 18-19"
        pl: "Poncjusz, Żywot i męczeństwo Cypriana 15, 18-19"
        it: "Ponzio, Vita e passione di Cipriano 15, 18-19"
        nl: "Pontius, Leven en lijden van Cyprianus 15, 18-19"
        cs: "Pontius, Život a umučení Cypriánovo 15, 18-19"
        sv: "Pontius, Cyprianus’ liv och lidande 15, 18-19"
