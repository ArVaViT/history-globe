# The life of David, 1 Samuel 16 - 1 Kings 2, in the order of the text. The tour's
# year (1010 BC) is the conventional start of his reign (c. 1010-970 BC), a point for the
# map rather than a date.
id: david
title:
  en: "The life of David"
  ru: "Жизнь Давида"
  uk: "Життя Давида"
  es: "La vida de David"
  pt: "A vida de Davi"
  de: "Das Leben Davids"
  fr: "La vie de David"
  pl: "Życie Dawida"
  it: "La vita di Davide"
  nl: "Het leven van David"
  cs: "Život Davidův"
  sv: "Davids liv"
  nb: "Davids liv"
  tl: "Ang buhay ni David"
  da: "Davids liv"
  sr: "Живот Давидов"
year: "1010 BC"
people: ["David@Rut.4.17-Rev"]
approximate: true
stops:
  - place: a112427 # Bethlehem
    ref: 1Sam.16.1-1Sam.16.13
    note:
      en: "In Bethlehem Samuel anoints the youngest son of Jesse, and the Spirit of the Lord comes upon David."
      ru: "В Вифлееме Самуил помазывает младшего сына Иессея, и Дух Господень почиет на Давиде."
      uk: "У Вифлеємі Самуїл помазує наймолодшого сина Єссея, і Дух Господній сходить на Давида."
      es: "En Belén Samuel unge al hijo menor de Isaí, y el Espíritu del Señor viene sobre David."
      pt: "Em Belém, Samuel unge o filho mais novo de Jessé, e o Espírito do Senhor vem sobre Davi."
      de: "In Bethlehem salbt Samuel den jüngsten Sohn Isais, und der Geist des Herrn kommt über David."
      fr: "À Bethléhem, Samuel oint le plus jeune fils d’Isaï, et l’Esprit de l’Éternel vient sur David."
      pl: "W Betlejem Samuel namaszcza najmłodszego syna Jessego i Duch Pański zstępuje na Dawida."
      it: "A Betlemme Samuele unge il figlio più giovane di Iesse, e lo Spirito del Signore scende su Davide."
      nl: "Te Bethlehem zalft Samuël de jongste zoon van Isaï, en de Geest van de HEER komt over David."
      cs: "V Betlémě Samuel pomazává nejmladšího Jišajova syna a Duch Hospodinův přichází na Davida."
      sv: "I Betlehem smörjer Samuel Isais yngste son, och Herrens Ande kommer över David."
      nb: "I Betlehem salver Samuel Isais yngste sønn, og Herrens Ånd kommer over David."
      tl: "Sa Bethlehem, pinahiran ni Samuel ang bunsong anak ni Isai, at ang Espiritu ng Panginoon ay dumating kay David."
      da: "I Betlehem salver Samuel Isajs yngste søn, og Herrens Ånd kommer over David."
      sr: "У Витлејему Самуило помазује најмлађег Јесејевог сина, и Дух Господњи силази на Давида."
  - place: ab183f8 # Valley of Elah
    ref: 1Sam.17.2-1Sam.17.51
    note:
      en: "In the Valley of Elah David kills Goliath with a sling and a stone."
      ru: "В долине дуба Давид поражает Голиафа пращею и камнем."
      uk: "У долині Ела Давид убиває Голіята пращею й каменем."
      es: "En el Valle de Ela David mata a Goliat con una honda y una piedra."
      pt: "No Vale de Elá, Davi mata Golias com uma funda e uma pedra."
      de: "Im Tal Ela tötet David Goliat mit Schleuder und Stein."
      fr: "Dans la vallée d’Éla, David tue Goliath avec une fronde et une pierre."
      pl: "W Dolinie Ela Dawid zabija Goliata procą i kamieniem."
      it: "Nella Valle del Terebinto Davide uccide Golia con una fionda e una pietra."
      nl: "In het Dal van Ela doodt David Goliat met een slinger en een steen."
      cs: "V Élském údolí zabíjí David Goliáše prakem a kamenem."
      sv: "I Terebintdalen dödar David Goljat med en slunga och en sten."
      nb: "I Ela-dalen dreper David Goliat med en slynge og en sten."
      tl: "Sa Libis ng Ela, pinatay ni David si Goliath sa pamamagitan ng tirador at isang bato."
      da: "I Terebintedalen dræber David Goliat med en slynge og en sten."
      sr: "У Долини храстова Давид праћком и каменом убија Голијата."
  - place: ae1c9ea # Naioth
    ref: 1Sam.19.18-1Sam.19.24
    note:
      en: "Fleeing Saul, David comes to Samuel and stays with him at Naioth in Ramah."
      ru: "Спасаясь от Саула, Давид приходит к Самуилу и остаётся с ним в Навафе в Раме."
      uk: "Тікаючи від Саула, Давид приходить до Самуїла й лишається в нього в Наіоті в Рамі."
      es: "Huyendo de Saúl, David va a Samuel y se queda con él en Naiot, en Ramá."
      pt: "Fugindo de Saul, Davi vai a Samuel e fica com ele em Naiote, em Ramá."
      de: "Auf der Flucht vor Saul kommt David zu Samuel und bleibt bei ihm in Najot in Rama."
      fr: "Fuyant Saül, David vient chez Samuel et reste auprès de lui à Najoth, à Rama."
      pl: "Uciekając przed Saulem, Dawid przychodzi do Samuela i zatrzymuje się u niego w Najot w Ramie."
      it: "Fuggendo da Saul, Davide giunge da Samuele e rimane con lui a Naiot, presso Rama."
      nl: "Op de vlucht voor Saul komt David bij Samuël en verblijft bij hem te Najot in Rama."
      cs: "David prchá před Saulem k Samuelovi a zůstává u něho v Najotu v Rámě."
      sv: "På flykt undan Saul kommer David till Samuel och stannar hos honom i Najot i Rama."
      nb: "På flukt fra Saul kommer David til Samuel og blir hos ham i Najot i Rama."
      tl: "Sa pagtakas kay Saul, pumunta si David kay Samuel at nanatili sa kaniya sa Najoth sa Rama."
      da: "David flygter for Saul og kommer til Samuel og bliver hos ham i Najot i Rama."
      sr: "Бежећи од Саула, Давид долази к Самуилу и остаје код њега у Најоту у Рами."
  - place: afdda14 # Nob
    ref: 1Sam.21.1-1Sam.21.9
    note:
      en: "At Nob the priest Ahimelech gives him the holy bread and the sword of Goliath."
      ru: "В Номве священник Ахимелех даёт ему священный хлеб и меч Голиафа."
      uk: "У Нобі священик Ахімелех дає йому святий хліб і меч Голіята."
      es: "En Nob el sacerdote Ahimelec le da el pan sagrado y la espada de Goliat."
      pt: "Em Nobe, o sacerdote Aimeleque lhe dá o pão sagrado e a espada de Golias."
      de: "In Nob gibt ihm der Priester Ahimelech das heilige Brot und das Schwert Goliats."
      fr: "À Nob, le sacrificateur Achimélec lui donne le pain consacré et l’épée de Goliath."
      pl: "W Nob kapłan Achimelek daje mu chleby święte i miecz Goliata."
      it: "A Nob il sacerdote Achimelech gli dà il pane sacro e la spada di Golia."
      nl: "Te Nob geeft de priester Achimelech hem het heilige brood en het zwaard van Goliat."
      cs: "V Nobu mu kněz Achimelek dává svatý chléb a Goliášův meč."
      sv: "I Nob ger prästen Achimelek honom det heliga brödet och Goljats svärd."
      nb: "I Nob gir presten Ahimelek ham det hellige brødet og Goliats sverd."
      tl: "Sa Nob, ibinigay sa kaniya ng paring si Ahimelech ang banal na tinapay at ang tabak ni Goliath."
      da: "I Nob giver præsten Akimelek ham det hellige brød og Goliats sværd."
      sr: "У Нову свештеник Ахимелех му даје свети хлеб и Голијатов мач."
  - place: a18873f # Gath
    ref: 1Sam.21.10-1Sam.21.15
    note:
      en: "Before Achish king of Gath he pretends to be mad."
      ru: "Перед Анхусом, царём Гефским, он притворяется безумным."
      uk: "Перед Анхусом, царем Гату, він прикидається божевільним."
      es: "Ante Aquis, rey de Gat, finge estar loco."
      pt: "Diante de Aquis, rei de Gate, finge-se de louco."
      de: "Vor Achis, dem König von Gat, stellt er sich wahnsinnig."
      fr: "Devant Akisch, roi de Gath, il feint la folie."
      pl: "Przed Achiszem, królem Gat, udaje szaleńca."
      it: "Davanti ad Achis, re di Gat, finge di essere pazzo."
      nl: "Voor Achis, de koning van Gat, doet hij alsof hij gek is."
      cs: "Před Achišem, králem Gatu, předstírá šílenství."
      sv: "Inför Akish, kung av Gat, låtsas han vara galen."
      nb: "For Akisj, kongen i Gat, later han som om han er gal."
      tl: "Sa harap ni Achis na hari ng Gath, nagkunwari siyang baliw."
      da: "Foran Akisj, Gats konge, stiller han sig gal."
      sr: "Пред Ахисом, царем гатским, прави се луд."
  - place: af82614 # Adullam
    ref: 1Sam.22.1-1Sam.22.2
    note:
      en: "In the cave of Adullam his family and some four hundred men gather around him."
      ru: "В пещеру Одолламскую к нему приходят родные и около четырёхсот человек."
      uk: "У печері Одолам навколо нього збирається його родина й близько чотирьохсот чоловіків."
      es: "En la cueva de Adulam se reúnen en torno a él su familia y unos cuatrocientos hombres."
      pt: "Na caverna de Adulão, a sua família e cerca de quatrocentos homens se reúnem em torno dele."
      de: "In der Höhle Adullam sammeln sich seine Familie und etwa vierhundert Mann um ihn."
      fr: "Dans la caverne d’Adullam, sa famille et quelque quatre cents hommes se rassemblent autour de lui."
      pl: "W jaskini Adullam gromadzą się wokół niego jego rodzina i około czterystu mężów."
      it: "Nella caverna di Adullam si radunano intorno a lui la sua famiglia e circa quattrocento uomini."
      nl: "In de spelonk van Adullam verzamelen zijn familie en zo'n vierhonderd man zich om hem."
      cs: "V jeskyni Adulam se kolem něho shromažďuje jeho rodina a asi čtyři sta mužů."
      sv: "I Adullams grotta samlas hans familj och omkring fyra hundra man kring honom."
      nb: "I Adullam-hulen samler hans slekt og omkring fire hundre menn seg om ham."
      tl: "Sa yungib ng Adullam, nagtipon sa palibot niya ang kaniyang pamilya at mga apat na raang lalaki."
      da: "I Adullams hule samler hans familie og omkring fire hundrede mand sig om ham."
      sr: "У пећини Одоламској око њега се скупља његова породица и око четири стотине људи."
  - place: a51df0e # Engedi
    ref: 1Sam.24.1-1Sam.24.22
    note:
      en: "In the wilderness of Engedi he spares Saul in the cave, cutting off only the edge of his robe."
      ru: "В пустыне Ен-Гадди он щадит Саула в пещере и отрезает лишь край его одежды."
      uk: "У пустелі Ен-Геді він щадить Саула в печері, відрізавши лише край його плаща."
      es: "En el desierto de Engadi perdona a Saúl en la cueva, cortándole solo el borde del manto."
      pt: "No deserto de En-Gedi, poupa Saul na caverna, cortando apenas a orla do seu manto."
      de: "In der Wüste En-Gedi verschont er Saul in der Höhle und schneidet nur den Zipfel seines Mantels ab."
      fr: "Dans le désert d’En-Guédi, il épargne Saül dans la caverne, ne coupant que le pan de son manteau."
      pl: "Na pustyni En-Gedi oszczędza Saula w jaskini, odcinając tylko skraj jego płaszcza."
      it: "Nel deserto di En-Ghedi risparmia Saul nella caverna, tagliandogli soltanto un lembo del mantello."
      nl: "In de woestijn van En-Gedi spaart hij Saul in de spelonk en snijdt alleen de rand van zijn mantel af."
      cs: "Na poušti Én-gedi ušetří v jeskyni Saula, jemuž odřízne jen cíp pláště."
      sv: "I En-Gedis öken skonar han Saul i grottan och skär bara av kanten på hans mantel."
      nb: "I En-Gedis ørken skåner han Saul i hulen og skjærer bare av kanten av hans kappe."
      tl: "Sa ilang ng En-gedi, pinatawad niya si Saul sa yungib, at laylayan lamang ng balabal nito ang kaniyang pinutol."
      da: "I En-Gedis ørken skåner han Saul i hulen og afskærer kun kanten af hans kappe."
      sr: "У пустињи Енгадској поштеди Саула у пећини, одсекавши само крај његове хаљине."
  - place: a0ed7ff # Ziklag
    ref: 1Sam.27.5-1Sam.27.7
    note:
      en: "Achish gives him Ziklag, where he lives among the Philistines."
      ru: "Анхус даёт ему Секелаг, и он живёт среди Филистимлян."
      uk: "Анхус дає йому Ціклаг, де він живе серед філістимлян."
      es: "Aquis le da Siclag, donde vive entre los filisteos."
      pt: "Aquis lhe dá Ziclague, onde vive entre os filisteus."
      de: "Achis gibt ihm Ziklag, wo er unter den Philistern wohnt."
      fr: "Akisch lui donne Tsiklag, où il vit parmi les Philistins."
      pl: "Achisz daje mu Siklag, gdzie mieszka wśród Filistynów."
      it: "Achis gli dà Siclag, dove egli vive fra i Filistei."
      nl: "Achis geeft hem Ziklag, waar hij onder de Filistijnen woont."
      cs: "Achiš mu dává Siklag, kde žije mezi Pelištejci."
      sv: "Akish ger honom Siklag, där han bor bland filistéerna."
      nb: "Akisj gir ham Siklag, hvor han bor blant filisterne."
      tl: "Ibinigay sa kaniya ni Achis ang Siclag, kung saan siya tumira sa gitna ng mga Filisteo."
      da: "Akisj giver ham Siklag, hvor han bor blandt filistrene."
      sr: "Ахис му даје Сиклаг, где живи међу Филистејима."
  - place: acf57c5 # Mount Gilboa
    ref: 1Sam.31.1-1Sam.31.6
    note:
      en: "On Mount Gilboa Saul and his three sons fall in battle with the Philistines."
      ru: "На горе Гелвуе в битве с Филистимлянами гибнут Саул и три его сына."
      uk: "На горі Гільбоа Саул і троє його синів падають у бою з філістимлянами."
      es: "En el Monte Gilboa caen Saúl y sus tres hijos en la batalla contra los filisteos."
      pt: "No Monte Gilboa, Saul e seus três filhos caem em batalha contra os filisteus."
      de: "Auf dem Gebirge Gilboa fallen Saul und seine drei Söhne in der Schlacht gegen die Philister."
      fr: "Sur le Mont Guilboa, Saül et ses trois fils tombent dans la bataille contre les Philistins."
      pl: "Na górze Gilboa Saul i jego trzej synowie giną w bitwie z Filistynami."
      it: "Sul monte Gelboe Saul e i suoi tre figli cadono in battaglia contro i Filistei."
      nl: "Op de berg Gilboa vallen Saul en zijn drie zonen in de strijd met de Filistijnen."
      cs: "Na hoře Gilboa padá v boji s Pelištejci Saul a jeho tři synové."
      sv: "På berget Gilboa faller Saul och hans tre söner i strid mot filistéerna."
      nb: "På Gilboa-fjellet faller Saul og hans tre sønner i kamp med filisterne."
      tl: "Sa Bundok Gilboa, nabuwal si Saul at ang kaniyang tatlong anak sa labanan laban sa mga Filisteo."
      da: "På Gilboa-bjerget falder Saul og hans tre sønner i kamp med filistrene."
      sr: "На гори Гелвуји Саул и његова три сина гину у боју с Филистејима."
  - place: a85151a # Hebron
    ref: 2Sam.2.1-2Sam.2.4
    note:
      en: "In Hebron the men of Judah anoint David king over the house of Judah."
      ru: "В Хевроне мужи Иудины помазывают Давида на царство над домом Иудиным."
      uk: "У Хевроні мужі Юди помазують Давида на царя над домом Юди."
      es: "En Hebrón los hombres de Judá ungen a David rey sobre la casa de Judá."
      pt: "Em Hebrom, os homens de Judá ungem Davi rei sobre a casa de Judá."
      de: "In Hebron salben die Männer von Juda David zum König über das Haus Juda."
      fr: "À Hébron, les hommes de Juda oignent David roi sur la maison de Juda."
      pl: "W Hebronie mężowie z Judy namaszczają Dawida na króla nad domem Judy."
      it: "A Ebron gli uomini di Giuda ungono Davide re sulla casa di Giuda."
      nl: "Te Hebron zalven de mannen van Juda David tot koning over het huis van Juda."
      cs: "V Hebronu pomazávají judští muži Davida za krále nad domem Judovým."
      sv: "I Hebron smörjer Judas män David till kung över Judas hus."
      nb: "I Hebron salver mennene fra Juda David til konge over Judas hus."
      tl: "Sa Hebron, pinahiran ng mga lalaki ng Juda si David bilang hari sa sangbahayan ni Juda."
      da: "I Hebron salver Judas mænd David til konge over Judas hus."
      sr: "У Хеврону људи из Јуде помазују Давида за цара над домом Јудиним."
  - place: a15257a # Jerusalem
    ref: 2Sam.5.6-2Sam.5.9
    note:
      en: "He takes the stronghold of Zion and names it the City of David."
      ru: "Он берёт крепость Сион и называет её городом Давидовым."
      uk: "Він здобуває твердиню Сіон і називає її Містом Давида."
      es: "Toma la fortaleza de Sion y la llama la Ciudad de David."
      pt: "Toma a fortaleza de Sião e a chama Cidade de Davi."
      de: "Er erobert die Burg Zion und nennt sie Stadt Davids."
      fr: "Il prend la forteresse de Sion et l’appelle Cité de David."
      pl: "Zdobywa twierdzę Syjon i nazywa ją Miastem Dawida."
      it: "Conquista la fortezza di Sion e la chiama Città di Davide."
      nl: "Hij neemt de burcht Sion in en noemt die de Stad van David."
      cs: "Dobývá pevnost Sijón a nazývá ji Město Davidovo."
      sv: "Han intar fästningen Sion och kallar den Davids stad."
      nb: "Han inntar Sions borg og kaller den Davidsbyen."
      tl: "Sinakop niya ang katibayan ng Sion at pinangalanan itong Bayan ni David."
      da: "Han indtager Zions borg og kalder den Davidsbyen."
      sr: "Осваја тврђаву Сион и назива је Давидов град."
  - place: ae5bfe9 # Mahanaim
    ref: 2Sam.17.24-2Sam.17.29
    note:
      en: "Fleeing Absalom, he crosses the Jordan to Mahanaim."
      ru: "Спасаясь от Авессалома, он уходит за Иордан, в Маханаим."
      uk: "Тікаючи від Авесалома, він переходить Йордан до Маханаїма."
      es: "Huyendo de Absalón, cruza el Jordán hacia Mahanaim."
      pt: "Fugindo de Absalão, atravessa o Jordão até Maanaim."
      de: "Auf der Flucht vor Absalom überschreitet er den Jordan nach Mahanajim."
      fr: "Fuyant Absalom, il passe le Jourdain jusqu’à Mahanaïm."
      pl: "Uciekając przed Absalomem, przeprawia się przez Jordan do Mahanaim."
      it: "Fuggendo da Assalonne, attraversa il Giordano e si reca a Maanaim."
      nl: "Op de vlucht voor Absalom steekt hij de Jordaan over naar Machanaïm."
      cs: "Prchá před Abšalomem a přechází Jordán do Machanajimu."
      sv: "På flykt undan Absalom går han över Jordan till Mahanajim."
      nb: "På flukt fra Absalom går han over Jordan til Mahanajim."
      tl: "Sa pagtakas kay Absalom, tumawid siya ng Jordan patungo sa Mahanaim."
      da: "På flugt fra Absalon går han over Jordan til Mahanajim."
      sr: "Бежећи од Авесалома, прелази Јордан у Маханајим."
  - place: a15257a # Jerusalem
    ref: 1Kgs.2.10-1Kgs.2.11
    year: "970 BC"
    note:
      en: "David dies and is buried in the City of David, after forty years as king: seven in Hebron, thirty-three in Jerusalem."
      ru: "Давид умирает и погребён в городе Давидовом; он царствовал сорок лет: семь — в Хевроне и тридцать три — в Иерусалиме."
      uk: "Давид помирає і його ховають у Місті Давида після сорока років царювання: семи в Хевроні й тридцяти трьох у Єрусалимі."
      es: "David muere y es sepultado en la Ciudad de David, tras cuarenta años como rey: siete en Hebrón y treinta y tres en Jerusalén."
      pt: "Davi morre e é sepultado na Cidade de Davi, depois de quarenta anos de reinado: sete em Hebrom, trinta e três em Jerusalém."
      de: "David stirbt und wird in der Stadt Davids begraben, nach vierzig Jahren als König: sieben in Hebron, dreiunddreißig in Jerusalem."
      fr: "David meurt et est enseveli dans la Cité de David, après quarante ans de règne : sept à Hébron, trente-trois à Jérusalem."
      pl: "Dawid umiera i zostaje pochowany w Mieście Dawida po czterdziestu latach panowania: siedem w Hebronie i trzydzieści trzy w Jerozolimie."
      it: "Davide muore ed è sepolto nella Città di Davide, dopo quarant’anni di regno: sette a Ebron, trentatré a Gerusalemme."
      nl: "David sterft en wordt begraven in de Stad van David, na veertig jaar als koning: zeven in Hebron, drieëndertig in Jeruzalem."
      cs: "David umírá a je pohřben ve Městě Davidově po čtyřiceti letech kralování: sedmi v Hebronu a třiatřiceti v Jeruzalémě."
      sv: "David dör och begravs i Davids stad, efter fyrtio år som kung: sju i Hebron, trettiotre i Jerusalem."
      nb: "David dør og blir gravlagt i Davidsbyen etter førti år som konge: sju i Hebron, tre og tretti i Jerusalem."
      tl: "Namatay si David at inilibing sa Bayan ni David, matapos ang apatnapung taon bilang hari: pito sa Hebron, tatlumpu't tatlo sa Jerusalem."
      da: "David dør og bliver begravet i Davidsbyen efter fyrre år som konge: syv i Hebron, treogtredive i Jerusalem."
      sr: "Давид умире и сахрањен је у Давидовом граду, пошто је био цар четрдесет година: седам у Хеврону, тридесет и три у Јерусалиму."
