# Jesus in Galilee and around it, Mark 1-9, in Mark's order only, so that no stop settles
# how the Gospels are harmonised. The tour's year (AD 29) is a conventional point for the
# map within the ministry (c. AD 28-30), not a date.
id: galilee
title:
  en: "Jesus in Galilee, after Mark"
  ru: "Иисус в Галилее, по Марку"
  uk: "Ісус у Галілеї за Марком"
  es: "Jesús en Galilea, según Marcos"
  pt: "Jesus na Galileia, segundo Marcos"
  de: "Jesus in Galiläa nach Markus"
  fr: "Jésus en Galilée, selon Marc"
year: "AD 29"
people: ["Jesus@Isa.7.14-Rev"]
approximate: true
stops:
  - place: a562fcc # Sea of Galilee
    ref: Mark.1.16-Mark.1.20
    note:
      en: 'By the Sea of Galilee He calls Simon and Andrew, James and John: "I will make you to become fishers of men."'
      ru: "У моря Галилейского Он призывает Симона и Андрея, Иакова и Иоанна: «Я сделаю, что вы будете ловцами человеков»."
      uk: "Біля Галілейського моря Він кличе Симона й Андрія, Якова та Івана: «зроблю, що станетесь ловцями людей»."
      es: "Junto al Mar de Galilea llama a Simón y Andrés, Jacobo y Juan: «haré que seáis pescadores de hombres»."
      pt: "Junto ao Mar da Galileia, Ele chama Simão e André, Tiago e João: “eu farei de vocês pescadores de homens.”"
      de: "Am See Genezareth ruft er Simon und Andreas, Jakobus und Johannes: „ich will euch zu Menschenfischern machen“."
      fr: "Au bord de la Mer de Galilée, il appelle Simon et André, Jacques et Jean : « Je vous ferai pêcheurs d’hommes. »"
  - place: af2161c # Capernaum
    ref: Mark.1.21-Mark.1.34
    note:
      en: "In Capernaum He teaches in the synagogue as one that had authority, casts out an unclean spirit and heals Simon's wife's mother."
      ru: "В Капернауме Он учит в синагоге, как власть имеющий, изгоняет нечистого духа и исцеляет тёщу Симона."
      uk: "У Капернаумі Він навчає в синагозі як той, хто має владу, виганяє нечистого духа й оздоровлює тещу Симона."
      es: "En Cafarnaúm enseña en la sinagoga como quien tiene autoridad, expulsa a un espíritu inmundo y sana a la suegra de Simón."
      pt: "Em Cafarnaum, ensina na sinagoga como quem tinha autoridade, expulsa um espírito imundo e cura a sogra de Simão."
      de: "In Kapernaum lehrt er in der Synagoge wie einer, der Vollmacht hat, treibt einen unreinen Geist aus und heilt die Schwiegermutter Simons."
      fr: "À Capernaüm, il enseigne dans la synagogue comme ayant autorité, chasse un esprit impur et guérit la belle-mère de Simon."
  - place: af5884f # Nazareth
    ref: Mark.6.1-Mark.6.6
    note:
      en: 'In His own country, Nazareth, they are offended at Him: "A prophet is not without honour, but in his own country."'
      ru: "В Своём отечестве, Назарете, соблазняются о Нём: «не бывает пророк без чести, разве только в отечестве своем»."
      uk: "У своїй країні, в Назареті, вони спокушаються через Нього: «Не єсть пророк без чести, хиба що в країнї своїй»."
      es: "En su propia tierra, Nazaret, se escandalizan de él: «No hay profeta deshonrado sino en su tierra»."
      pt: "Na sua própria terra, Nazaré, ficam ofendidos com Ele: “Um profeta não fica sem honra, a não ser na sua própria terra.”"
      de: "In seiner Vaterstadt Nazareth nehmen sie Anstoß an ihm: „Ein Prophet gilt nirgend weniger denn im Vaterland und daheim bei den Seinen.“"
      fr: "Dans sa patrie, à Nazareth, ils sont scandalisés à son sujet : « Un prophète n’est méprisé que dans sa patrie. »"
  - place: a9fc13a # Bethsaida
    ref: Mark.6.45-Mark.6.52
    note:
      en: 'He sends the disciples ahead by boat toward Bethsaida and comes to them walking on the sea: "Be of good cheer: it is I; be not afraid."'
      ru: "Он отправляет учеников в лодке к Вифсаиде и приходит к ним, идя по морю: «ободритесь; это Я, не бойтесь»."
      uk: "Він відсилає учнів наперед човном до Віфсаїди й приходить до них, ідучи по морю: «Бодріть ся; се я; не лякайтесь»."
      es: "Envía por delante a los discípulos en barca hacia Betsaida y va hacia ellos andando sobre el mar: «Alentaos; yo soy, no temáis»."
      pt: "Envia os discípulos adiante de barco para Betsaida e vai ao encontro deles andando sobre o mar: “Coragem! Sou eu! Não tenham medo.”"
      de: "Er schickt die Jünger im Boot voraus nach Betsaida und kommt auf dem Meer wandelnd zu ihnen: „Seid getrost, ich bin's, fürchtet euch nicht!“"
      fr: "Il envoie les disciples devant lui en barque vers Bethsaïda et les rejoint en marchant sur la mer : « Rassurez-vous, c’est moi, n’ayez pas peur ! »"
  - place: a7de69e # Gennesaret
    ref: Mark.6.53-Mark.6.56
    note:
      en: "At Gennesaret the sick are laid in the streets, and as many as touch the border of His garment are made whole."
      ru: "В Геннисарете больных кладут на открытых местах, и прикоснувшиеся к краю Его одежды исцеляются."
      uk: "У Генісареті недужих кладуть на вулицях, і всі, хто торкається краю Його одежі, зцілюються."
      es: "En Genesaret ponen a los enfermos en las calles, y todos los que tocan el borde de su vestido quedan sanos."
      pt: "Em Genesaré os doentes são postos nas ruas, e todos os que tocam a orla do seu manto ficam curados."
      de: "In Genezareth legt man die Kranken auf die Straßen, und alle, die den Saum seines Gewandes berühren, werden gesund."
      fr: "À Génésareth, on met les malades sur les places, et tous ceux qui touchent le bord de son vêtement sont guéris."
  - place: a160272 # Tyre
    ref: Mark.7.24-Mark.7.30
    note:
      en: 'In the borders of Tyre and Sidon a Syrophenician woman answers Him: "yet the dogs under the table eat of the children''s crumbs," and the devil is gone out of her daughter.'
      ru: "В пределах Тирских и Сидонских сирофиникиянка отвечает Ему: «но и псы под столом едят крохи у детей», и бес выходит из её дочери."
      uk: "У межах Тіру й Сідону сирофінікійка відповідає Йому: «тільки ж і собаки під столом їдять кришки від дїтей», і біс виходить з її доньки."
      es: "En los confines de Tiro y de Sidón una mujer sirofenicia le responde: «aun los perrillos debajo de la mesa, comen de las migajas de los hijos», y el demonio sale de su hija."
      pt: "Nas regiões de Tiro e Sidom, uma mulher siro-fenícia lhe responde: “Contudo, até mesmo os cães debaixo da mesa comem as migalhas das crianças”, e o demônio sai da sua filha."
      de: "In der Gegend von Tyrus und Sidon antwortet ihm eine Syrophönizierin: „aber doch essen die Hündlein unter dem Tisch von den Brosamen der Kinder“, und der Teufel ist von ihrer Tochter ausgefahren."
      fr: "Dans le territoire de Tyr et de Sidon, une Syro-phénicienne lui répond : « mais les petits chiens, sous la table, mangent les miettes des enfants », et le démon est sorti de sa fille."
  - place: ae733a2 # Decapolis
    ref: Mark.7.31-Mark.7.37
    note:
      en: 'Through the Decapolis He comes back to the sea and opens the ears of a deaf man: "Ephphatha, that is, Be opened."'
      ru: "Через Десятиградие Он возвращается к морю и отверзает слух глухому: «еффафа», то есть: отверзись."
      uk: "Через Десятимістя Він повертається до моря й відкриває вуха глухому: «Єфата, се єсть: Одчинись»."
      es: "Por la Decápolis vuelve al mar y abre los oídos de un sordo: «Ephphatha: que es decir: Sé abierto»."
      pt: "Pela Decápolis volta ao mar e abre os ouvidos de um surdo: “Efatá!” isto é, “Abra-se!”"
      de: "Durch die Dekapolis kommt er zum Meer zurück und öffnet die Ohren eines Tauben: „Hephatha! das ist: Tu dich auf!“"
      fr: "Par la Décapole, il revient vers la mer et ouvre les oreilles d’un sourd : « Éphphatha, c’est-à-dire, ouvre-toi. »"
  - place: af2161c # Capernaum
    ref: Mark.9.33-Mark.9.37
    note:
      en: 'Back in Capernaum He tells the twelve: "If any man desire to be first, the same shall be last of all, and servant of all," and sets a child in the midst of them.'
      ru: "Вернувшись в Капернаум, Он говорит двенадцати: «кто хочет быть первым, будь из всех последним и всем слугою», и ставит посреди них дитя."
      uk: "Повернувшись до Капернаума, Він каже дванадцятьом: «Коли хто хоче першим бути, нехай буде з усїх останнїм і всїм слугою», і ставить посеред них дитя."
      es: "De vuelta en Cafarnaúm dice a los doce: «Si alguno quiere ser el primero, será el postrero de todos, y el servidor de todos», y pone en medio de ellos a un niño."
      pt: "De volta a Cafarnaum, diz aos doze: “Se alguém quiser ser o primeiro, será o último de todos, e o servo de todos”, e coloca uma criança no meio deles."
      de: "Wieder in Kapernaum sagt er den Zwölfen: „So jemand will der Erste sein, der soll der Letzte sein vor allen und aller Knecht“, und stellt ein Kind mitten unter sie."
      fr: "De retour à Capernaüm, il dit aux douze : « Si quelqu’un veut être le premier, il sera le dernier de tous et le serviteur de tous », et place un enfant au milieu d’eux."
