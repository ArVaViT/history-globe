intro:
  en:
    - "The story of Elijah the Tishbite, of the settlers of Gilead, is told in 1 Kings 17–19 and 21 and 2 Kings 1–2, in the reign of Ahab, king of Israel, and of his son Ahaziah. Elijah announces a drought, hides by the brook Cherith and lives with a widow at Zarephath; on Mount Carmel he calls down fire before the prophets of Baal, and the rain returns; fleeing from Jezebel he goes south past Beersheba to Horeb, the mountain of God; he calls Elisha from the plough, condemns Ahab over Naboth's vineyard at Jezreel, and at last goes with Elisha from Gilgal by Bethel and Jericho to the Jordan, where he is taken up into heaven."
    - "The text dates Elijah by the kings, not by years. On E. R. Thiele's chronology, which the map follows for the kings of Israel and Judah, Ahab reigned about 874–853 BC; an inscription of the Assyrian king Shalmaneser III, the Kurkh Monolith, names Ahab of Israel among the kings who fought him at Qarqar in 853 BC. The map sets the tour in 860 BC, within Ahab's reign, and shows the last four stops at 850 BC, after Ahab's death and the two years of Ahaziah."
    - "Two places on the way are uncertain. The brook Cherith is known only from this story, and both the side of the Jordan and the valley are disputed. Horeb is the mountain of God of Moses, sought since the fourth century at Jebel Musa in the south of the Sinai peninsula, though other sites are proposed. The text gives one leg its days: from Beersheba a day's journey into the wilderness, then forty days and forty nights to Horeb. The other travel times are estimates, and before the Roman roads every way is measured in a straight line, so they are floors."
  ru:
    - "История Илии Фесвитянина, из жителей Галаадских, рассказана в 3 Цар 17–19 и 21 и 4 Цар 1–2, в царствование Ахава, царя Израильского, и его сына Охозии. Илия возвещает засуху, скрывается у потока Хорафа и живёт у вдовы в Сарепте; на горе Кармил он низводит огонь перед пророками Вааловыми, и дождь возвращается; спасаясь от Иезавели, он уходит на юг мимо Вирсавии к Хориву, горе Божией; он призывает Елисея от плуга, обличает Ахава за виноградник Навуфея в Изрееле и наконец идёт с Елисеем из Галгала через Вефиль и Иерихон к Иордану, где возносится на небо."
    - "Текст датирует Илию по царям, а не по годам. По хронологии Э. Р. Тиле, которой карта следует для царей Израиля и Иудеи, Ахав царствовал около 874–853 гг. до н. э.; надпись ассирийского царя Салманасара III, Курхский монолит, называет Ахава Израильского среди царей, сражавшихся с ним при Каркаре в 853 г. до н. э. Карта относит тур к 860 г. до н. э., ко времени царствования Ахава, а последние четыре остановки показывает под 850 г. до н. э., после смерти Ахава и двух лет Охозии."
    - "Два места на пути неясны. Поток Хораф известен только из этого рассказа, и спорны как сторона Иордана, так и долина. Хорив — гора Божия Моисея, которую с IV века ищут на Джебель-Муса на юге Синайского полуострова, хотя предлагаются и другие места. Для одного отрезка текст указывает дни: из Вирсавии день пути в пустыню, а затем сорок дней и сорок ночей до Хорива. Остальное время в пути — оценки, а до римских дорог каждый путь измеряется по прямой, так что это нижние пределы."
  uk:
    - "Історію Іллі Тішбіянина, з поселенців Гілеаду, розказано в 1 Цар 17–19 і 21 та 2 Цар 1–2, за царювання Ахава, царя Ізраїлю, і його сина Охозії. Ілля провіщає посуху, ховається біля потоку Хораф і живе у вдови в Сарепті; на горі Кармель він зводить вогонь перед пророками Ваала, і дощ повертається; тікаючи від Єзавелі, він іде на південь повз Беер-Шеву до Хорива, гори Божої; він кличе Єлисея від плуга, засуджує Ахава за виноградник Навуфея в Їзреелі й нарешті йде з Єлисеєм з Гілгала через Бет-Ел і Єрихон до Йордану, де його забрано на небо."
    - "Текст датує Іллю за царями, а не за роками. За хронологією Е. Р. Тіле, якої мапа дотримується для царів Ізраїлю та Юдеї, Ахав царював близько 874–853 рр. до н. е.; напис ассирійського царя Салманасара III, Курхський моноліт, називає Ахава Ізраїльського серед царів, що воювали з ним під Каркаром 853 р. до н. е. Мапа відносить тур до 860 р. до н. е., у межах царювання Ахава, а останні чотири зупинки показує під 850 р. до н. е., після смерті Ахава і двох років Охозії."
    - "Два місця на шляху непевні. Потік Хораф відомий лише з цієї розповіді, і спірні як бік Йордану, так і долина. Хорив — це гора Божа Мойсея, яку від IV століття шукають на Джебель-Муса на півдні Синайського півострова, хоча пропонують і інші місця. Для одного відтинку текст подає дні: з Беер-Шеви день дороги в пустелю, а потім сорок днів і сорок ночей до Хорива. Решта часу в дорозі — оцінки, а до римських доріг кожен шлях виміряно по прямій, тож це нижні межі."
  es:
    - "La historia de Elías tisbita, de los moradores de Galaad, se narra en 1 R 17–19 y 21 y en 2 R 1–2, en el reinado de Acab, rey de Israel, y de su hijo Ocozías. Elías anuncia una sequía, se esconde junto al arroyo de Querit y vive con una viuda en Sarepta; en el monte Carmelo hace descender fuego ante los profetas de Baal, y vuelve la lluvia; huyendo de Jezabel va hacia el sur, más allá de Beerseba, hasta Horeb, el monte de Dios; llama a Eliseo de detrás del arado, condena a Acab por la viña de Nabot en Jezreel y, por último, va con Eliseo desde Gilgal, por Betel y Jericó, hasta el Jordán, donde es llevado al cielo."
    - "El texto fecha a Elías por los reyes, no por años. Según la cronología de E. R. Thiele, que el mapa sigue para los reyes de Israel y de Judá, Acab reinó hacia 874–853 a.C.; una inscripción del rey asirio Salmanasar III, el Monolito de Kurkh, nombra a Acab de Israel entre los reyes que lucharon contra él en Qarqar en el 853 a.C. El mapa sitúa el recorrido en el 860 a.C., dentro del reinado de Acab, y muestra las cuatro últimas paradas en el 850 a.C., después de la muerte de Acab y de los dos años de Ocozías."
    - "Dos lugares del camino son inciertos. El arroyo de Querit solo se conoce por esta historia, y se discuten tanto la orilla del Jordán como el valle. Horeb es el monte de Dios de Moisés, buscado desde el siglo IV en el Yebel Musa, en el sur de la península del Sinaí, aunque se proponen otros lugares. El texto da los días de un solo tramo: desde Beerseba, un día de camino por el desierto, y luego cuarenta días y cuarenta noches hasta Horeb. Los demás tiempos de viaje son estimaciones, y antes de las calzadas romanas todo camino se mide en línea recta, así que son mínimos."
  pt:
    - "A história de Elias, o tesbita, dos moradores de Gileade, é narrada em 1Rs 17–19 e 21 e em 2Rs 1–2, no reinado de Acabe, rei de Israel, e de seu filho Acazias. Elias anuncia uma seca, esconde-se junto ao ribeiro de Querite e vive com uma viúva em Sarepta; no monte Carmelo faz descer fogo diante dos profetas de Baal, e a chuva volta; fugindo de Jezabel, vai para o sul, além de Berseba, até Horebe, o monte de Deus; chama Eliseu de junto do arado, condena Acabe por causa da vinha de Nabote em Jezreel e, por fim, vai com Eliseu de Gilgal, passando por Betel e Jericó, até o Jordão, onde é levado ao céu."
    - "O texto data Elias pelos reis, não por anos. Segundo a cronologia de E. R. Thiele, que o mapa segue para os reis de Israel e de Judá, Acabe reinou por volta de 874–853 a.C.; uma inscrição do rei assírio Salmaneser III, o Monólito de Kurkh, nomeia Acabe de Israel entre os reis que lutaram contra ele em Qarqar, em 853 a.C. O mapa situa o percurso em 860 a.C., dentro do reinado de Acabe, e mostra as quatro últimas paradas em 850 a.C., depois da morte de Acabe e dos dois anos de Acazias."
    - "Dois lugares do caminho são incertos. O ribeiro de Querite só é conhecido por esta história, e tanto a margem do Jordão como o vale são discutidos. Horebe é o monte de Deus de Moisés, procurado desde o século IV no Jebel Musa, no sul da península do Sinai, embora se proponham outros locais. O texto dá os dias de um só trecho: de Berseba, um dia de caminho pelo deserto, e depois quarenta dias e quarenta noites até Horebe. Os demais tempos de viagem são estimativas, e antes das estradas romanas todo caminho é medido em linha reta, de modo que são valores mínimos."
  de:
    - "Die Geschichte Elias, des Thisbiters, aus den Siedlern Gileads, wird in 1 Kön 17–19 und 21 sowie 2 Kön 1–2 erzählt, in der Regierungszeit Ahabs, des Königs von Israel, und seines Sohnes Ahasja. Elia kündigt eine Dürre an, verbirgt sich am Bach Krit und lebt bei einer Witwe in Sarepta; auf dem Karmel ruft er vor den Propheten Baals Feuer herab, und der Regen kehrt zurück; auf der Flucht vor Isebel zieht er nach Süden an Beerscheba vorbei zum Horeb, dem Berg Gottes; er ruft Elisa vom Pflug weg, verurteilt Ahab wegen des Weinbergs Nabots in Jesreel und geht schließlich mit Elisa von Gilgal über Bethel und Jericho an den Jordan, wo er in den Himmel aufgenommen wird."
    - "Der Text datiert Elia nach den Königen, nicht nach Jahren. Nach der Chronologie von E. R. Thiele, der die Karte für die Könige von Israel und Juda folgt, regierte Ahab etwa 874–853 v. Chr.; eine Inschrift des assyrischen Königs Salmanassar III., der Kurkh-Monolith, nennt Ahab von Israel unter den Königen, die 853 v. Chr. bei Karkar gegen ihn kämpften. Die Karte setzt die Tour in das Jahr 860 v. Chr., in die Regierungszeit Ahabs, und zeigt die letzten vier Stationen im Jahr 850 v. Chr., nach dem Tod Ahabs und den zwei Jahren Ahasjas."
    - "Zwei Orte auf dem Weg sind unsicher. Der Bach Krit ist nur aus dieser Geschichte bekannt, und sowohl die Seite des Jordan als auch das Tal sind umstritten. Der Horeb ist der Berg Gottes des Mose, den man seit dem 4. Jahrhundert am Dschebel Musa im Süden der Sinaihalbinsel sucht, doch werden auch andere Orte vorgeschlagen. Der Text gibt für eine Strecke die Tage an: von Beerscheba eine Tagereise in die Wüste, dann vierzig Tage und vierzig Nächte bis zum Horeb. Die übrigen Reisezeiten sind Schätzungen, und vor den Römerstraßen wird jeder Weg in gerader Linie gemessen, sodass sie Untergrenzen sind."
  fr:
    - "L’histoire d’Élie le Thischbite, l’un des habitants de Galaad, est racontée en 1 R 17–19 et 21 et en 2 R 1–2, sous le règne d’Achab, roi d’Israël, et de son fils Achazia. Élie annonce une sécheresse, se cache près du torrent de Kerith et vit chez une veuve à Sarepta ; sur le mont Carmel, il fait descendre le feu devant les prophètes de Baal, et la pluie revient ; fuyant Jézabel, il va vers le sud, au-delà de Beer-Schéba, jusqu’à Horeb, la montagne de Dieu ; il appelle Élisée de derrière la charrue, condamne Achab au sujet de la vigne de Naboth à Jizreel, et enfin va avec Élisée de Guilgal par Béthel et Jéricho jusqu’au Jourdain, où il est enlevé au ciel."
    - "Le texte date Élie par les rois, non par des années. Selon la chronologie d’E. R. Thiele, que la carte suit pour les rois d’Israël et de Juda, Achab régna vers 874–853 av. J.-C. ; une inscription du roi assyrien Salmanasar III, le monolithe de Kurkh, nomme Achab d’Israël parmi les rois qui le combattirent à Qarqar en 853 av. J.-C. La carte place le parcours en 860 av. J.-C., pendant le règne d’Achab, et montre les quatre dernières étapes en 850 av. J.-C., après la mort d’Achab et les deux années d’Achazia."
    - "Deux lieux du chemin sont incertains. Le torrent de Kerith n’est connu que par ce récit, et la rive du Jourdain comme la vallée sont discutées. Horeb est la montagne de Dieu de Moïse, cherchée depuis le IVe siècle au Jebel Musa, dans le sud de la péninsule du Sinaï, bien que d’autres sites soient proposés. Le texte donne les jours d’un trajet : depuis Beer-Schéba, une journée de marche dans le désert, puis quarante jours et quarante nuits jusqu’à Horeb. Les autres durées de trajet sont des estimations, et avant les routes romaines chaque chemin est mesuré en ligne droite ; ce sont donc des minimums."
  pl:
    - "Historia Eliasza Tiszbity, jednego z osadników Gileadu, opowiedziana jest w 1 Krl 17–19 i 21 oraz 2 Krl 1–2, za panowania Achaba, króla Izraela, i jego syna Ochozjasza. Eliasz zapowiada suszę, ukrywa się nad potokiem Kerit i mieszka u wdowy w Sarepcie; na Karmelu sprowadza ogień wobec proroków Baala i powraca deszcz; uciekając przed Izebel, idzie na południe za Beer-Szebę, do Horebu, góry Bożej; powołuje Elizeusza od pługa, potępia Achaba za winnicę Nabota w Jizreel, a w końcu idzie z Elizeuszem z Gilgal przez Betel i Jerycho nad Jordan, gdzie zostaje wzięty do nieba."
    - "Tekst datuje Eliasza według królów, a nie lat. Według chronologii E. R. Thiele, którą mapa przyjmuje dla królów Izraela i Judy, Achab panował około 874–853 p.n.e.; napis asyryjskiego króla Salmanasara III, Monolit z Kurkh, wymienia Achaba Izraelitę wśród królów, którzy walczyli z nim pod Karkar w 853 p.n.e. Mapa umieszcza trasę w roku 860 p.n.e., w czasie panowania Achaba, a cztery ostatnie przystanki pokazuje w roku 850 p.n.e., po śmierci Achaba i dwóch latach Ochozjasza."
    - "Dwa miejsca na trasie są niepewne. Potok Kerit znany jest tylko z tej historii, a sporne są zarówno strona Jordanu, jak i dolina. Horeb to góra Boża Mojżesza, szukana od IV wieku na Dżebel Musa na południu Półwyspu Synaj, choć proponuje się też inne miejsca. Tekst podaje liczbę dni jednego odcinka: z Beer-Szeby dzień drogi na pustynię, a potem czterdzieści dni i czterdzieści nocy do Horebu. Pozostałe czasy przejazdu są szacunkami, a przed drogami rzymskimi każda droga mierzona jest w linii prostej, więc są to wartości minimalne."
  it:
    - "La storia di Elia il Tisbita, uno degli abitanti di Galaad, è narrata in 1Re 17–19 e 21 e in 2Re 1–2, durante il regno di Acab, re d’Israele, e di suo figlio Acazia. Elia annuncia una siccità, si nasconde presso il torrente Cherit e vive presso una vedova a Sarepta; sul Monte Carmelo fa scendere il fuoco davanti ai profeti di Baal, e la pioggia ritorna; fuggendo da Gezabele va a sud, oltre Bersabea, fino all’Oreb, il monte di Dio; chiama Eliseo dall’aratro, condanna Acab per la vigna di Nabot a Izreel, e infine va con Eliseo da Gàlgala per Betel e Gerico fino al Giordano, dove è rapito in cielo."
    - "Il testo data Elia secondo i re, non secondo gli anni. Secondo la cronologia di E. R. Thiele, che la mappa segue per i re d’Israele e di Giuda, Acab regnò circa dall’874 all’853 a.C.; un’iscrizione del re assiro Salmanàssar III, il monolite di Kurkh, nomina Acab d’Israele tra i re che lo combatterono a Qarqar nell’853 a.C. La mappa colloca l’itinerario nell’860 a.C., durante il regno di Acab, e mostra le ultime quattro tappe nell’850 a.C., dopo la morte di Acab e i due anni di Acazia."
    - "Due luoghi del percorso sono incerti. Il torrente Cherit è noto solo da questo racconto, e sono discussi sia la sponda del Giordano sia la valle. L’Oreb è il monte di Dio di Mosè, cercato dal IV secolo al Jebel Musa, nel sud della penisola del Sinai, benché si propongano altri siti. Il testo indica i giorni di un tratto: da Bersabea una giornata di cammino nel deserto, poi quaranta giorni e quaranta notti fino all’Oreb. Gli altri tempi di viaggio sono stime, e prima delle strade romane ogni cammino è misurato in linea retta, perciò sono valori minimi."
  nl:
    - "Het verhaal van Elia de Thisbiet, uit de inwoners van Gilead, wordt verteld in 1 Kon 17–19 en 21 en 2 Kon 1–2, in de regeringstijd van Achab, koning van Israël, en van zijn zoon Achazia. Elia kondigt een droogte aan, verbergt zich bij de beek Kerit en woont bij een weduwe te Sarefat; op de Karmel roept hij vuur af ten aanschouwen van de profeten van Baäl, en de regen keert terug; op de vlucht voor Izebel trekt hij naar het zuiden langs Berseba naar de Horeb, de berg van God; hij roept Elisa weg van de ploeg, veroordeelt Achab om de wijngaard van Nabot te Jizreël, en gaat ten slotte met Elisa van Gilgal via Bethel en Jericho naar de Jordaan, waar hij in de hemel wordt opgenomen."
    - "De tekst dateert Elia naar de koningen, niet naar jaartallen. Volgens de chronologie van E. R. Thiele, die de kaart voor de koningen van Israël en Juda volgt, regeerde Achab ongeveer 874–853 v.Chr.; een inscriptie van de Assyrische koning Salmaneser III, de Kurkh-monoliet, noemt Achab van Israël onder de koningen die in 853 v.Chr. bij Qarqar tegen hem streden. De kaart plaatst de route in 860 v.Chr., binnen de regering van Achab, en toont de laatste vier haltes in 850 v.Chr., na de dood van Achab en de twee jaren van Achazia."
    - "Twee plaatsen op de weg zijn onzeker. De beek Kerit is alleen uit dit verhaal bekend, en zowel de kant van de Jordaan als het dal zijn omstreden. De Horeb is de berg van God van Mozes, die men sinds de vierde eeuw zoekt bij de Jebel Musa in het zuiden van het Sinaïschiereiland, al worden ook andere plaatsen voorgesteld. De tekst geeft voor één traject de dagen: vanuit Berseba een dagreis de woestijn in, daarna veertig dagen en veertig nachten tot de Horeb. De andere reistijden zijn schattingen, en vóór de Romeinse wegen wordt elke weg in een rechte lijn gemeten, zodat het ondergrenzen zijn."
  cs:
    - "Příběh Elijáše Tišbejského, jednoho z usedlíků Gileadu, vyprávějí 1Kr 17–19 a 21 a 2Kr 1–2, za vlády izraelského krále Achaba a jeho syna Achazjáše. Elijáš ohlašuje sucho, skrývá se u potoka Kerít a žije u vdovy v Sareptě; na hoře Karmel svolává oheň před Baalovými proroky a vrací se déšť; na útěku před Jezábel jde na jih za Beer-šebu na Choreb, horu Boží; povolává Elíšu od pluhu, odsuzuje Achaba kvůli Nábotově vinici v Jizreelu a nakonec jde s Elíšou z Gilgalu přes Bét-el a Jericho k Jordánu, kde je vzat do nebe."
    - "Text datuje Elijáše podle králů, ne podle let. Podle chronologie E. R. Thieleho, kterou mapa u izraelských a judských králů sleduje, vládl Achab asi 874–853 př. n. l.; nápis asyrského krále Salmanassara III., Kurkhský monolit, jmenuje Achaba Izraelského mezi králi, kteří proti němu bojovali u Karkaru v roce 853 př. n. l. Mapa klade trasu do roku 860 př. n. l., do doby Achabovy vlády, a poslední čtyři zastávky ukazuje v roce 850 př. n. l., po Achabově smrti a dvou letech Achazjášovy vlády."
    - "Dvě místa na cestě jsou nejistá. Potok Kerít je znám jen z tohoto příběhu a sporná je jak strana Jordánu, tak údolí. Choreb je Mojžíšova hora Boží, hledaná od 4. století na Džebel Músá na jihu Sinajského poloostrova, ačkoli se navrhují i jiná místa. U jednoho úseku text uvádí dny: z Beer-šeby den cesty do pouště a pak čtyřicet dní a čtyřicet nocí na Choreb. Ostatní doby cesty jsou odhady, a protože před římskými silnicemi se každá cesta měří vzdušnou čarou, jde o spodní meze."
  sv:
    - "Berättelsen om tisbiten Elia, en av nybyggarna i Gilead, finns i 1 Kung 17–19 och 21 och 2 Kung 1–2, under Israels kung Achavs och hans son Achasjas regering. Elia förkunnar en torka, gömmer sig vid bäcken Kerit och bor hos en änka i Sarefat; på Karmel kallar han ned eld inför Baals profeter, och regnet kommer tillbaka; på flykt undan Isebel går han söderut förbi Beer Sheva till Horeb, Guds berg; han kallar Elisha från plogen, dömer Achav för Navots vingård i Jisreel och går till sist med Elisha från Gilgal via Betel och Jeriko till Jordan, där han tas upp till himlen."
    - "Texten daterar Elia efter kungarna, inte efter år. Enligt E. R. Thieles kronologi, som kartan följer för Israels och Juda kungar, regerade Achav omkring 874–853 f.Kr.; en inskrift av den assyriske kungen Salmanassar III, Kurkhmonoliten, nämner Achav av Israel bland de kungar som stred mot honom vid Qarqar 853 f.Kr. Kartan förlägger rundturen till 860 f.Kr., under Achavs regering, och visar de fyra sista stationerna år 850 f.Kr., efter Achavs död och Achasjas två år."
    - "Två platser på vägen är osäkra. Bäcken Kerit är känd bara från denna berättelse, och både vilken sida av Jordan och vilken dal det gäller är omstritt. Horeb är Guds berg i berättelsen om Mose, som man sedan 300-talet har sökt vid Jebel Musa på södra Sinaihalvön, även om andra platser föreslås. Texten anger dagarna för en etapp: från Beer Sheva en dagsresa ut i öknen, sedan fyrtio dagar och fyrtio nätter till Horeb. Övriga restider är uppskattningar, och före de romerska vägarna mäts varje väg fågelvägen, så de är minimivärden."
  nb:
    - "Beretningen om tisbitten Elia, en av innflytterne i Gilead, står i 1 Kong 17–19 og 21 og 2 Kong 1–2, under Israels konge Ahab og hans sønn Ahasja. Elia kunngjør tørke, skjuler seg ved bekken Kerit og bor hos en enke i Sarepta; på Karmel kaller han ned ild for øynene på Baals profeter, og regnet vender tilbake; på flukt fra Jesabel drar han sørover forbi Beer-Sjeba til Horeb, Guds berg; han kaller Elisja fra plogen, dømmer Ahab for Nabots vingård i Jisreel, og drar til sist med Elisja fra Gilgal om Betel og Jeriko til Jordan, der han blir tatt opp til himmelen."
    - "Teksten daterer Elia etter kongene, ikke etter år. Etter E. R. Thieles kronologi, som kartet følger for kongene i Israel og Juda, regjerte Ahab omkring 874–853 f.Kr.; en innskrift fra den assyriske kongen Salmanassar III, Kurkh-monolitten, nevner Ahab av Israel blant kongene som kjempet mot ham ved Qarqar i 853 f.Kr. Kartet setter rundturen til 860 f.Kr., innenfor Ahabs regjeringstid, og viser de fire siste stoppestedene i 850 f.Kr., etter Ahabs død og Ahasjas to år."
    - "To steder på veien er usikre. Bekken Kerit er bare kjent fra denne beretningen, og både hvilken side av Jordan og hvilken dal det gjelder, er omstridt. Horeb er Guds berg fra beretningen om Moses, som man siden 300-tallet har søkt ved Jebel Musa sør på Sinaihalvøya, selv om andre steder er foreslått. Teksten oppgir dagene for én etappe: fra Beer-Sjeba en dagsreise ut i ørkenen, så førti dager og førti netter til Horeb. De andre reisetidene er anslag, og før de romerske veiene er hver vei målt i luftlinje, så de er minsteverdier."
  tl:
    - "Ang kasaysayan ni Elias na Thisbita, na mula sa mga nakikipamayan sa Gilead, ay isinasalaysay sa 1 Hari 17–19 at 21 at 2 Hari 1–2, sa paghahari ni Achab, hari ng Israel, at ng kaniyang anak na si Ochozias. Inihula ni Elias ang tagtuyot, nagtago sa tabi ng batis ng Cherith at tumira sa isang babaing balo sa Sarepta; sa Bundok Carmelo ay pinababa niya ang apoy sa harap ng mga propeta ni Baal, at bumalik ang ulan; sa pagtakas kay Jezabel ay nagtungo siya sa timog lampas sa Beer-seba hanggang Horeb, ang bundok ng Diyos; tinawag niya si Eliseo mula sa pag-aararo, hinatulan si Achab dahil sa ubasan ni Naboth sa Jezreel, at sa wakas ay yumaong kasama ni Eliseo mula sa Gilgal sa pamamagitan ng Beth-el at Jerico hanggang sa Jordan, kung saan siya isinampa sa langit."
    - "Pinepetsahan ng teksto si Elias ayon sa mga hari, hindi ayon sa mga taon. Ayon sa kronolohiya ni E. R. Thiele, na sinusunod ng mapa para sa mga hari ng Israel at Juda, naghari si Achab noong mga 874–853 BK; isang inskripsiyon ng haring Asirio na si Salmanasar III, ang Monolito ng Kurkh, ang bumabanggit kay Achab ng Israel sa mga haring nakipaglaban sa kaniya sa Qarqar noong 853 BK. Inilalagay ng mapa ang paglalakbay sa 860 BK, sa loob ng paghahari ni Achab, at ipinapakita ang huling apat na hintuan sa 850 BK, pagkamatay ni Achab at pagkaraan ng dalawang taon ni Ochozias."
    - "Dalawang dako sa daan ang hindi tiyak. Ang batis ng Cherith ay nakikilala lamang mula sa kasaysayang ito, at pinagtatalunan kapuwa ang pangpang ng Jordan at ang libis. Ang Horeb ay ang bundok ng Diyos ni Moises, na hinahanap mula pa noong ikaapat na siglo sa Jebel Musa sa timog ng tangway ng Sinai, bagaman may iminumungkahing ibang mga dako. Ibinibigay ng teksto ang mga araw ng isang bahagi ng paglalakbay: mula sa Beer-seba ay isang araw na paglalakbay sa ilang, saka apatnapung araw at apatnapung gabi hanggang Horeb. Ang iba pang oras ng paglalakbay ay mga tantiya, at bago ang mga daang Romano ay sinusukat nang tuwid ang bawat daan, kaya ang mga ito ay pinakamababang tantiya."
  da:
    - "Fortællingen om tisbiten Elias, en af nybyggerne i Gilead, findes i 1 Kong 17–19 og 21 og 2 Kong 1–2 og udspiller sig under Israels konge Akab og hans søn Akazja. Elias forkynder en tørke, skjuler sig ved Kerit-bækken og bor hos en enke i Sarepta; på Karmel kalder han ild ned for Ba'als profeters øjne, og regnen vender tilbage; på flugt fra Jezabel drager han sydpå forbi Beersheba til Horeb, Guds bjerg; han kalder Elisa fra ploven, dømmer Akab for Nabots vingård i Jizre'el og drager til sidst med Elisa fra Gilgal over Betel og Jeriko til Jordan, hvor han bliver taget op til himlen."
    - "Teksten daterer Elias efter kongerne, ikke efter årstal. Efter E. R. Thieles kronologi, som kortet følger for Israels og Judas konger, regerede Akab omkring 874–853 f.Kr.; en indskrift fra den assyriske konge Salmanassar III, Kurkh-monolitten, nævner Akab af Israel blandt de konger, der kæmpede mod ham ved Qarqar i 853 f.Kr. Kortet henlægger turen til 860 f.Kr., inden for Akabs regeringstid, og viser de sidste fire stop i 850 f.Kr., efter Akabs død og Akazjas to år."
    - "To steder på vejen er usikre. Kerit-bækken kendes kun fra denne fortælling, og både hvilken side af Jordan og hvilken dal der er tale om, er omstridt. Horeb er Guds bjerg fra fortællingen om Moses, som man siden det 4. århundrede har søgt ved Jebel Musa i den sydlige del af Sinaihalvøen, selv om andre steder foreslås. Teksten angiver dagene for én strækning: fra Beersheba en dagsrejse ud i ørkenen og derefter fyrretyve dage og fyrretyve nætter til Horeb. De øvrige rejsetider er skøn, og før romervejene måles hver vej i lige linje, så de er minimumstider."
  sr:
    - "Прича о Илији Тесвићанину, од насељеника галадских, приповеда се у 1. Цар 17–19 и 21 и 2. Цар 1–2, за владе Ахава, цара Израиљевог, и његовог сина Охозије. Илија најављује сушу, крије се код потока Хората и живи код једне удовице у Сарепти; на Кармилу своди огањ пред пророцима Валовим, и киша се враћа; бежећи од Језавеље, иде на југ мимо Вирсавеје до Хорива, горе Божје; позива Јелисија од рала, осуђује Ахава због Навутејевог винограда у Језраелу и најзад иде с Јелисијем из Галгала преко Ветиља и Јерихона до Јордана, где бива узет на небо."
    - "Текст датира Илију по царевима, а не по годинама. По хронологији Е. Р. Тилеа, коју карта следи за цареве Израиља и Јуде, Ахав је владао око 874–853. п. н. е.; натпис асирског цара Салманасара III, монолит из Курха, именује Ахава Израиљца међу царевима који су се борили против њега код Каркара 853. п. н. е. Карта смешта пут у 860. п. н. е., за Ахавове владе, а последње четири станице приказује у 850. п. н. е., после Ахавове смрти и две године Охозијине владе."
    - "Два места на путу су несигурна. Поток Хорат познат је само из ове приче, и спорни су и страна Јордана и долина. Хорив је гора Божја Мојсијева, која се од 4. века тражи код Џебел Мусе на југу Синајског полуострва, мада се предлажу и друга места. Текст за један део пута даје дане: из Вирсавеје дан хода у пустињу, затим четрдесет дана и четрдесет ноћи до Хорива. Остала трајања пута процене су, а пре римских путева сваки пут мери се правом линијом, па су то најмање вредности."
  hu:
    - "A Gileád lakói közül való tisbei Illés története az 1Kir 17–19-ben és 21-ben, valamint a 2Kir 1–2-ben olvasható, Aháb izráeli király és fia, Ahazja uralkodása idején. Illés aszályt jövendöl, elrejtőzik a Kerit patakjánál, és egy özvegynél lakik Sareptában; a Kármel-hegyen tüzet hív le Baál prófétái előtt, és visszatér az eső; Jézabel elől menekülve dél felé megy, Beérsebán túl, a Hórebhez, az Isten hegyéhez; elhívja Elizeust az eke mellől, Jezréelben ítéletet mond Ahábra Nábót szőlője miatt, végül Elizeussal Gilgálból Bételen és Jerikón át a Jordánhoz megy, ahol felvétetik a mennybe."
    - "A szöveg Illést a királyokhoz köti, nem évekhez. E. R. Thiele kronológiája szerint, amelyet a térkép Izráel és Júda királyainál követ, Aháb Kr. e. 874–853 körül uralkodott; III. Salmanasszár asszír király egyik felirata, a kurkhi monolit, az izráeli Ahábot is megnevezi azok között a királyok között, akik Kr. e. 853-ban Qarqarnál harcoltak ellene. A térkép a túrát Kr. e. 860-ra, Aháb uralkodásának idejére teszi, az utolsó négy állomást pedig Kr. e. 850-nél mutatja, Aháb halála és Ahazja két éve után."
    - "Az út két helye bizonytalan. A Kerit patakját csak ebből a történetből ismerjük, és vitatott, hogy a Jordán melyik oldalán és melyik völgyben volt. A Hóreb Mózes Isten-hegye, amelyet a 4. század óta a Sínai-félsziget déli részén, a Dzsebel Músza hegyen keresnek, bár más helyeket is javasolnak. A szöveg egy szakasznak megadja a napjait: Beérsebából egynapi járásnyira a pusztába, majd negyven nap és negyven éjjel a Hórebig. A többi utazási idő becslés, és a római utak előtt minden utat légvonalban mérünk, így ezek alsó határok."
  fi:
    - "Kertomus gileadilaisiin siirtolaisiin kuuluneesta tisbeläisestä Eliasta on luvuissa 1 Kun 17–19 ja 21 sekä 2 Kun 1–2, ja se sijoittuu Israelin kuninkaan Ahabin ja hänen poikansa Ahasjan hallituskauteen. Elia ilmoittaa kuivuudesta, kätkeytyy Keritin purolle ja asuu lesken luona Sareptassa; Karmelvuorella hän kutsuu tulen alas Baalin profeettojen nähden, ja sade palaa; Isebelia paetessaan hän kulkee etelään Beerseban ohi Horebille, Jumalan vuorelle; hän kutsuu Elisan auran takaa, tuomitsee Ahabin Nabotin viinitarhan vuoksi Jisreelissä ja kulkee lopulta Elisan kanssa Gilgalista Betelin ja Jerikon kautta Jordanille, jossa hänet otetaan ylös taivaaseen."
    - "Teksti ajoittaa Elian kuninkaiden mukaan, ei vuosilukujen. E. R. Thielen kronologian mukaan, jota kartta noudattaa Israelin ja Juudan kuninkaiden osalta, Ahab hallitsi noin 874–853 eaa.; Assyrian kuninkaan Salmanassar III:n kirjoitus, Kurkhin monoliitti, mainitsee Israelin Ahabin niiden kuninkaiden joukossa, jotka taistelivat häntä vastaan Qarqarissa vuonna 853 eaa. Kartta sijoittaa kierroksen vuoteen 860 eaa., Ahabin hallituskauteen, ja näyttää neljä viimeistä pysähdyspaikkaa vuonna 850 eaa., Ahabin kuoleman ja Ahasjan kahden vuoden jälkeen."
    - "Kaksi paikkaa matkan varrella on epävarmoja. Keritin puro tunnetaan vain tästä kertomuksesta, ja sekä Jordanin puoli että laakso ovat kiistanalaisia. Horeb on Mooseksen kertomusten Jumalan vuori, jota on 300-luvulta lähtien etsitty Jebel Musalta Siinain niemimaan eteläosasta, vaikka muitakin paikkoja on ehdotettu. Teksti ilmoittaa yhden osuuden päivät: Beersebasta päivänmatka erämaahan ja sitten neljäkymmentä päivää ja neljäkymmentä yötä Horebille. Muut matka-ajat ovat arvioita, ja ennen roomalaisia teitä jokainen matka mitataan suoraa viivaa pitkin, joten ne ovat vähimmäisaikoja."
  vi:
    - "Câu chuyện về Ê-li người Thi-sê-be, thuộc những người sang ngụ Ga-la-át, được kể trong 1 Các Vua 17–19 và 21 cùng 2 Các Vua 1–2, dưới đời A-háp, vua Y-sơ-ra-ên, và con trai người là A-cha-xia. Ê-li báo trước nạn hạn hán, ẩn mình bên khe Kê-rít và ở với một bà góa tại Sa-rép-ta; trên núi Cạt-mên, ông khiến lửa giáng xuống trước mặt các tiên tri của Ba-anh, và mưa trở lại; chạy trốn Giê-sa-bên, ông đi về phía nam qua Bê-e-Sê-ba đến Hô-rếp, núi của Đức Chúa Trời; ông gọi Ê-li-sê từ chỗ cày ruộng, kết án A-háp về vườn nho của Na-bốt tại Gít-rê-ên, và sau cùng cùng Ê-li-sê đi từ Ghinh-ganh qua Bê-tên và Giê-ri-cô đến sông Giô-đanh, nơi ông được cất lên trời."
    - "Bản văn định thời điểm của Ê-li theo các vua, không theo năm. Theo niên đại học của E. R. Thiele, mà bản đồ theo đối với các vua Y-sơ-ra-ên và Giu-đa, A-háp trị vì khoảng năm 874–853 TCN; một bia khắc của vua A-si-ri Sanh-ma-na-sa III, Bia đá Kurkh, nêu tên A-háp người Y-sơ-ra-ên trong số các vua đã giao chiến với ông tại Qarqar năm 853 TCN. Bản đồ đặt chuyến đi vào năm 860 TCN, trong thời A-háp trị vì, và thể hiện bốn điểm dừng cuối cùng vào năm 850 TCN, sau khi A-háp chết và hai năm của A-cha-xia."
    - "Hai địa điểm trên đường đi chưa chắc chắn. Khe Kê-rít chỉ được biết qua câu chuyện này, và cả bờ sông Giô-đanh lẫn thung lũng đều còn tranh cãi. Hô-rếp là núi của Đức Chúa Trời thời Môi-se, được tìm kiếm từ thế kỷ thứ tư tại Jebel Musa ở phía nam bán đảo Si-na-i, dù có những địa điểm khác được đề nghị. Bản văn cho biết số ngày của một chặng: từ Bê-e-Sê-ba một ngày đường vào đồng vắng, rồi bốn mươi ngày và bốn mươi đêm đến Hô-rếp. Các thời gian đi đường khác là ước tính, và trước khi có các con đường La Mã, mọi lối đi đều được đo theo đường thẳng, nên đó là mức tối thiểu."
  ro:
    - "Povestea lui Ilie Tesviteanul, dintre locuitorii Galaadului, este spusă în 3 Regi 17–19 și 21 și în 4 Regi 1–2, în domnia lui Ahab, regele lui Israel, și a fiului său Ahazia. Ilie vestește o secetă, se ascunde lângă pârâul Cherit și locuiește la o văduvă în Sarepta; pe Muntele Carmel face să coboare foc înaintea profeților lui Baal, iar ploaia se întoarce; fugind de Izabela, merge spre sud, dincolo de Beer-Șeba, până la Horeb, muntele lui Dumnezeu; îl cheamă pe Elisei de la plug, îl osândește pe Ahab pentru via lui Nabot la Izreel și, în cele din urmă, merge cu Elisei din Ghilgal prin Betel și Ierihon până la Iordan, unde este luat la cer."
    - "Textul îl datează pe Ilie după regi, nu după ani. După cronologia lui E. R. Thiele, pe care harta o urmează pentru regii lui Israel și Iuda, Ahab a domnit cam între 874 și 853 î.Hr.; o inscripție a regelui asirian Salmanasar al III-lea, Monolitul de la Kurkh, îl numește pe Ahab al lui Israel printre regii care au luptat împotriva lui la Qarqar în 853 î.Hr. Harta așază călătoria în 860 î.Hr., în domnia lui Ahab, și arată ultimele patru opriri în 850 î.Hr., după moartea lui Ahab și cei doi ani ai lui Ahazia."
    - "Două locuri de pe drum sunt nesigure. Pârâul Cherit este cunoscut doar din această povestire, iar atât malul Iordanului, cât și valea sunt disputate. Horeb este muntele lui Dumnezeu al lui Moise, căutat din secolul al IV-lea la Jebel Musa, în sudul peninsulei Sinai, deși sunt propuse și alte locuri. Textul dă zilele unei singure etape: de la Beer-Șeba cale de o zi în pustiu, apoi patruzeci de zile și patruzeci de nopți până la Horeb. Celelalte durate de drum sunt estimări, iar înainte de drumurile romane fiecare drum este măsurat în linie dreaptă, așa că ele sunt limite minime."
  bg:
    - "Историята на Илия Тесвиеца, от жителите на Галаад, е разказана в 3 Царе 17–19 и 21 и 4 Царе 1–2, по времето на Ахав, цар на Израил, и на сина му Охозия. Илия предсказва суша, крие се при потока Хорат и живее при една вдовица в Сарепта; на планината Кармил той свежда огън пред пророците на Ваал и дъждът се връща; бягайки от Йезавел, той отива на юг покрай Вирсавия до Хорив, Божията планина; призовава Елисей от ралото, осъжда Ахав заради лозето на Навутей в Изреел и накрая отива с Елисей от Галгал през Ветил и Йерихон до Йордан, където е възнесен на небето."
    - "Текстът датира Илия по царете, а не по години. Според хронологията на Е. Р. Тиле, която картата следва за царете на Израил и Юда, Ахав царува около 874–853 г. пр.н.е.; надпис на асирийския цар Салманасар III, монолитът от Курх, назовава Ахав Израилтянина сред царете, които воюват срещу него при Каркар през 853 г. пр.н.е. Картата поставя маршрута в 860 г. пр.н.е., в царуването на Ахав, а последните четири спирки показва в 850 г. пр.н.е., след смъртта на Ахав и двете години на Охозия."
    - "Две места по пътя са несигурни. Потокът Хорат е известен само от тази история и както страната на Йордан, така и долината са спорни. Хорив е Божията планина на Мойсей, търсена от IV в. насам при Джебел Муса в южната част на Синайския полуостров, макар че се предлагат и други места. Текстът дава дните на един участък: от Вирсавия един ден път в пустинята, после четиридесет дни и четиридесет нощи до Хорив. Другите времена за път са оценки и преди римските пътища всеки път се мери по права линия, така че те са долна граница."
stops:
  - place: aa7bee8 # Brook Cherith
    ref: 1Kgs.17.1-1Kgs.17.7
    note:
      en: "Elijah foretells the drought and hides by the brook Cherith, where ravens bring him bread and meat."
      ru: "Илия возвещает засуху и скрывается у потока Хорафа, где вороны приносят ему хлеб и мясо."
      uk: "Ілля провіщає посуху й ховається біля потоку Хораф, де круки носять йому хліб і м’ясо."
      es: "Elías anuncia la sequía y se oculta junto al Arroyo de Querit, donde los cuervos le llevan pan y carne."
      pt: "Elias prediz a seca e se esconde junto ao ribeiro de Querite, onde corvos lhe trazem pão e carne."
      de: "Elia kündigt die Dürre an und verbirgt sich am Bach Krit, wo Raben ihm Brot und Fleisch bringen."
      fr: "Élie annonce la sécheresse et se cache près du torrent de Kerith, où des corbeaux lui apportent du pain et de la viande."
      pl: "Eliasz zapowiada suszę i ukrywa się nad potokiem Kerit, dokąd kruki przynoszą mu chleb i mięso."
      it: "Elia predice la siccità e si nasconde presso il torrente Cherit, dove i corvi gli portano pane e carne."
      nl: "Elia kondigt de droogte aan en verbergt zich bij de beek Kerit, waar raven hem brood en vlees brengen."
      cs: "Elijáš předpovídá sucho a skrývá se u potoka Kerít, kde mu havrani nosí chléb a maso."
      sv: "Elia förutsäger torkan och gömmer sig vid bäcken Kerit, där korpar bär bröd och kött till honom."
      nb: "Elia forutsier tørken og skjuler seg ved bekken Kerit, hvor ravner bringer ham brød og kjøtt."
      tl: "Inihula ni Elias ang tagtuyot at nagtago sa batis ng Cherith, kung saan dinalhan siya ng mga uwak ng tinapay at karne."
      da: "Elias forudsiger tørken og skjuler sig ved Kerit-bækken, hvor ravne bringer ham brød og kød."
      sr: "Илија прориче сушу и скрива се код потока Хората, где му гавранови носе хлеб и месо."
      hu: "Illés megjövendöli az aszályt, és a Kerit patakánál rejtőzik el, ahol hollók hordanak neki kenyeret és húst."
      fi: "Elia ennustaa kuivuuden ja kätkeytyy Keritin purolle, jossa korpit tuovat hänelle leipää ja lihaa."
      vi: "Ê-li báo trước nạn hạn hán và ẩn mình bên khe Kê-rít, nơi chim quạ đem bánh và thịt cho người."
      ro: "Ilie vestește seceta și se ascunde lângă pârâul Cherit, unde corbii îi aduc pâine și carne."
      bg: "Илия предсказва сушата и се скрива при потока Хорат, където гарваните му носят хляб и месо."
    story:
      en: "Elijah the Tishbite told Ahab that, as the Lord God of Israel lived, there would be neither dew nor rain these years except at his word. The word of the Lord sent him eastward to hide by the brook Cherith, facing the Jordan, where he drank from the brook and ravens brought him bread and meat morning and evening, until the brook dried up for lack of rain. Where the brook was is not known: many look east of the river, in Gilead, and an old tradition puts it in Wadi Qelt near Jericho."
      ru: "Илия Фесвитянин сказал Ахаву, что, как жив Господь Бог Израилев, в эти годы не будет ни росы, ни дождя, разве только по его слову. Слово Господне послало его на восток скрыться у потока Хорафа, что против Иордана, где он пил из потока, а вороны приносили ему хлеб и мясо утром и вечером, пока поток не иссяк, потому что не было дождя. Где был этот поток, неизвестно: многие ищут его к востоку от реки, в Галааде, а древнее предание помещает его в Вади-Кельт близ Иерихона."
      uk: "Ілля Тішбіянин сказав Ахавові, що, як живий Господь, Бог Ізраїлів, цими роками не буде ні роси, ні дощу, хіба що на його слово. Слово Господнє послало його на схід сховатися біля потоку Хораф, що навпроти Йордану, де він пив з потоку, а круки приносили йому хліб і м’ясо вранці й увечері, аж поки потік не висох, бо не було дощу. Де був цей потік, невідомо: багато хто шукає його на схід від ріки, в Гілеаді, а давнє передання розміщує його у Ваді-Кельт поблизу Єрихону."
      es: "Elías tisbita dijo a Acab que, vive el Señor Dios de Israel, no habría rocío ni lluvia en aquellos años sino por su palabra. La palabra del Señor lo envió hacia el oriente a esconderse junto al arroyo de Querit, frente al Jordán, donde bebía del arroyo y los cuervos le traían pan y carne por la mañana y por la tarde, hasta que el arroyo se secó por falta de lluvia. No se sabe dónde estaba el arroyo: muchos lo buscan al este del río, en Galaad, y una antigua tradición lo sitúa en el Wadi Qelt, cerca de Jericó."
      pt: "Elias, o tesbita, disse a Acabe que, tão certo como vive o Senhor, o Deus de Israel, não haveria orvalho nem chuva naqueles anos senão segundo a sua palavra. A palavra do Senhor enviou-o para o leste, a esconder-se junto ao ribeiro de Querite, diante do Jordão, onde bebia do ribeiro e os corvos lhe traziam pão e carne de manhã e à tarde, até que o ribeiro secou por falta de chuva. Não se sabe onde ficava o ribeiro: muitos o procuram a leste do rio, em Gileade, e uma antiga tradição o situa no Wadi Qelt, perto de Jericó."
      de: "Elia, der Thisbiter, sagte Ahab, so wahr der Herr, der Gott Israels, lebe, solle es in diesen Jahren weder Tau noch Regen geben, es sei denn auf sein Wort. Das Wort des Herrn schickte ihn nach Osten, damit er sich am Bach Krit gegenüber dem Jordan verberge, wo er aus dem Bach trank und Raben ihm morgens und abends Brot und Fleisch brachten, bis der Bach mangels Regen austrocknete. Wo der Bach lag, ist nicht bekannt: Viele suchen ihn östlich des Flusses, in Gilead, und eine alte Überlieferung verlegt ihn in das Wadi Qelt bei Jericho."
      fr: "Élie le Thischbite dit à Achab que, aussi vrai que l’Éternel, le Dieu d’Israël, était vivant, il n’y aurait ces années-ci ni rosée ni pluie, sinon à sa parole. La parole de l’Éternel l’envoya vers l’orient se cacher près du torrent de Kerith, en face du Jourdain, où il buvait l’eau du torrent et où des corbeaux lui apportaient du pain et de la viande le matin et le soir, jusqu’à ce que le torrent tarisse faute de pluie. On ne sait où se trouvait le torrent : beaucoup le cherchent à l’est du fleuve, en Galaad, et une ancienne tradition le place au wadi Qelt, près de Jéricho."
      pl: "Eliasz Tiszbita oznajmił Achabowi, że na życie Pana, Boga Izraela, w tych latach nie będzie ani rosy, ani deszczu, chyba że na jego słowo. Słowo Pana posłało go na wschód, by ukrył się nad potokiem Kerit, naprzeciw Jordanu, gdzie pił z potoku, a kruki przynosiły mu chleb i mięso rano i wieczorem, aż potok wysechł z braku deszczu. Nie wiadomo, gdzie płynął ten potok: wielu szuka go na wschód od rzeki, w Gileadzie, a dawna tradycja umieszcza go w Wadi Kelt koło Jerycha."
      it: "Elia il Tisbita disse ad Acab che, com’è vero che vive il Signore, Dio d’Israele, in quegli anni non ci sarebbero stati né rugiada né pioggia, se non alla sua parola. La parola del Signore lo mandò verso oriente a nascondersi presso il torrente Cherit, di fronte al Giordano, dove beveva al torrente e i corvi gli portavano pane e carne la mattina e la sera, finché il torrente si seccò per mancanza di pioggia. Non si sa dove fosse il torrente: molti lo cercano a est del fiume, in Galaad, e un’antica tradizione lo pone nel wadi Qelt presso Gerico."
      nl: "Elia de Thisbiet zei tot Achab dat er, zo waar de HEER, de God van Israël, leefde, in deze jaren dauw noch regen zou zijn, tenzij op zijn woord. Het woord van de HEER zond hem naar het oosten om zich te verbergen bij de beek Kerit, tegenover de Jordaan, waar hij uit de beek dronk en raven hem 's morgens en 's avonds brood en vlees brachten, totdat de beek door gebrek aan regen opdroogde. Waar de beek was, is niet bekend: velen zoeken haar ten oosten van de rivier, in Gilead, en een oude overlevering plaatst haar in de Wadi Qelt bij Jericho."
      cs: "Elijáš Tišbejský řekl Achabovi, že jakože živ je Hospodin, Bůh Izraele, nebude v těchto letech rosa ani déšť, leda na jeho slovo. Slovo Hospodinovo ho poslalo na východ, aby se skryl u potoka Kerít naproti Jordánu, kde pil z potoka a havrani mu nosili chléb a maso ráno i večer, dokud potok pro nedostatek deště nevyschl. Kde potok byl, není známo: mnozí ho hledají východně od řeky, v Gileadu, a stará tradice ho klade do Vádí Kelt u Jericha."
      sv: "Tisbiten Elia sade till Achav att så sant Herren, Israels Gud, lever skulle varken dagg eller regn falla under dessa år, om inte han sade det. Herrens ord sände honom österut för att gömma sig vid bäcken Kerit, gent emot Jordan, där han drack ur bäcken och korpar förde bröd och kött till honom morgon och kväll, tills bäcken torkade ut i brist på regn. Var bäcken låg är okänt: många söker den öster om floden, i Gilead, och en gammal tradition förlägger den till Wadi Qelt nära Jeriko."
      nb: "Tisbitten Elia sa til Ahab at så sant Herren, Israels Gud, lever, skulle det i disse årene verken komme dugg eller regn uten etter hans ord. Herrens ord sendte ham østover for å skjule seg ved bekken Kerit, midt imot Jordan, der han drakk av bekken og ravner kom med brød og kjøtt til ham morgen og kveld, til bekken tørket ut fordi det ikke kom regn. Hvor bekken lå, er ikke kjent: mange leter øst for elven, i Gilead, og en gammel tradisjon legger den til Wadi Qelt nær Jeriko."
      tl: "Sinabi ni Elias na Thisbita kay Achab na, buhay ang Panginoon, ang Diyos ng Israel, hindi magkakaroon ng hamog o ulan man sa mga taong ito kundi ayon sa kaniyang salita. Sinugo siya ng salita ng Panginoon sa dakong silanganan upang magkubli sa tabi ng batis Cherith, na nasa tapat ng Jordan, kung saan uminom siya sa batis at dinalhan siya ng mga uwak ng tinapay at laman sa umaga at sa hapon, hanggang sa matuyo ang batis dahil walang ulan. Hindi nalalaman kung saan ang batis: marami ang naghahanap dito sa silangan ng ilog, sa Gilead, at inilalagay ito ng isang matandang tradisyon sa Wadi Qelt malapit sa Jerico."
      da: "Tisbiten Elias sagde til Akab, at så sandt Herren, Israels Gud, levede, skulle der hverken komme dug eller regn i disse år, uden efter hans ord. Herrens ord sendte ham mod øst for at skjule sig ved Kerit-bækken over for Jordan, hvor han drak af bækken, og ravne bragte ham brød og kød morgen og aften, indtil bækken tørrede ud, fordi der ingen regn kom. Hvor bækken lå, vides ikke: mange søger den øst for floden i Gilead, og en gammel tradition henlægger den til Wadi Qelt ved Jeriko."
      sr: "Илија Тесвићанин рекао је Ахаву да, тако да је жив Господ Бог Израиљев, ових година неће бити ни росе ни дажда осим на његову реч. Реч Господња послала га је на исток да се сакрије код потока Хората према Јордану, где је пио из потока, а гаврани су му доносили хлеб и месо јутром и вечером, док поток није пресушио јер није било кише. Где је био поток, не зна се: многи га траже источно од реке, у Галаду, а једно старо предање смешта га у Вади Келт код Јерихона."
      hu: "A tisbei Illés megmondta Ahábnak, hogy amint él az Úr, Izráel Istene, ezekben az években sem harmat, sem eső nem lesz, csak az ő szavára. Az Úr szava kelet felé küldte, hogy rejtőzzön el a Kerit patakjánál, a Jordánnal szemben, ahol a patakból ivott, és hollók hoztak neki kenyeret és húst reggel és este, míg a patak ki nem száradt, mert nem volt eső. Hogy hol volt a patak, nem tudjuk: sokan a folyótól keletre, Gileádban keresik, egy régi hagyomány pedig a Jerikó melletti Vádi Keltbe teszi."
      fi: "Tisbeläinen Elia sanoi Ahabille, että niin totta kuin Herra, Israelin Jumala, eli, näinä vuosina ei tulisi kastetta eikä sadetta muutoin kuin hänen sanansa kautta. Herran sana lähetti hänet itään kätkeytymään Keritin purolle vastapäätä Jordania, missä hän joi purosta ja korpit toivat hänelle leipää ja lihaa aamuin illoin, kunnes puro kuivui, koska sadetta ei tullut. Missä puro oli, ei tiedetä: monet etsivät sitä joen itäpuolelta, Gileadista, ja vanha perimätieto sijoittaa sen Wadi Qeltiin Jerikon lähelle."
      vi: "Ê-li người Thi-sê-be nói với A-háp rằng, chỉ Giê-hô-va Đức Chúa Trời hằng sống của Y-sơ-ra-ên, mấy năm nay sẽ không có sương cũng không có mưa, nếu ông chẳng nói. Lời của Đức Giê-hô-va sai ông đi về phía đông, ẩn mình bên khe Kê-rít, đối ngang sông Giô-đanh, nơi ông uống nước khe và chim quạ đem bánh và thịt cho ông buổi mai và buổi chiều, cho đến khi khe khô cạn vì không có mưa. Khe ấy ở đâu thì không rõ: nhiều người tìm ở phía đông sông, trong xứ Ga-la-át, và một truyền thống xưa đặt nó tại Wadi Qelt gần Giê-ri-cô."
      ro: "Ilie Tesviteanul i-a spus lui Ahab că, precum este viu Domnul Dumnezeul lui Israel, în anii aceștia nu va fi nici rouă, nici ploaie decât la cuvântul lui. Cuvântul Domnului l-a trimis spre răsărit să se ascundă lângă pârâul Cherit, în fața Iordanului, unde bea din pârâu, iar corbii îi aduceau pâine și carne dimineața și seara, până când pârâul a secat din lipsă de ploaie. Unde era pârâul nu se știe: mulți îl caută la răsărit de râu, în Galaad, iar o veche tradiție îl așază în Wadi Qelt, lângă Ierihon."
      bg: "Илия Тесвиецът каза на Ахав, че, жив е Господ Бог Израилев, през тези години няма да има нито роса, нито дъжд освен по неговата дума. Словото Господне го изпрати на изток да се скрие при потока Хорат срещу Йордан, където пиеше от потока, а гарваните му носеха хляб и месо сутрин и вечер, докато потокът пресъхна поради липса на дъжд. Къде е бил потокът, не е известно: мнозина го търсят на изток от реката, в Галаад, а едно старо предание го поставя в Уади Келт край Йерихон."
  - place: a6fa2d3 # Zarephath
    ref: 1Kgs.17.8-1Kgs.17.24
    note:
      en: "In Zarephath of Sidon the widow's barrel of meal does not waste nor her cruse of oil fail, and her son is brought back to life."
      ru: "В Сарепте Сидонской мука в кадке у вдовы не истощается и масло в кувшине не убывает; её сын оживает."
      uk: "У Сарепті Сідонській не витрачається борошно в діжці вдови й не вичерпується олія в її глечику, а її сина повернуто до життя."
      es: "En Sarepta de Sidón la tinaja de harina de la viuda no se agota ni falta la vasija de aceite, y su hijo vuelve a la vida."
      pt: "Em Sarepta de Sidom, a vasilha de farinha da viúva não se esgota nem o seu jarro de azeite falta, e o filho dela é trazido de volta à vida."
      de: "In Sarepta bei Sidon geht der Mehltopf der Witwe nicht aus, und ihr Ölkrug versiegt nicht, und ihr Sohn wird wieder lebendig."
      fr: "À Sarepta de Sidon, la farine de la veuve ne s’épuise pas et l’huile de sa cruche ne manque pas, et son fils est rendu à la vie."
      pl: "W Sarepcie sydońskiej dzban mąki wdowy nie wyczerpuje się, a w jej baryłce nie ubywa oliwy, i jej syn zostaje przywrócony do życia."
      it: "A Sarepta di Sidone il vaso della farina della vedova non si esaurisce né manca l’orcio dell’olio, e suo figlio è riportato in vita."
      nl: "Te Sarefat bij Sidon raakt de meelbus van de weduwe niet leeg en de oliekruik niet op, en haar zoon wordt weer tot leven gebracht."
      cs: "V Sarepťe Sidonské se vdově nespotřebuje mouka v kbelíku ani neubývá oleje v nádobce a její syn je přiveden zpět k životu."
      sv: "I Sarefat i Sidon tar inte änkans mjöl i krukan slut och inte heller oljan i hennes kruka, och hennes son väcks till liv igen."
      nb: "I Sarepta i Sidon tar ikke enkens mel i krukken slutt og oljen i kolben forsvinner ikke, og hennes sønn blir kalt tilbake til livet."
      tl: "Sa Sarepta ng Sidon, hindi nasaid ang bariles ng harina ng babaing balo ni nagkulang ang kaniyang sisidlan ng langis, at ibinalik sa buhay ang kaniyang anak."
      da: "I Sarepta ved Sidon slipper enkens mel i krukken ikke op, og hendes oliekrukke svigter ikke, og hendes søn kaldes tilbage til livet."
      sr: "У Сарепти сидонској удовичино брашно у судини не нестаје нити јој уље у крчагу понестаје, и њен син бива враћен у живот."
      hu: "A szidóni Sareptában az özvegy lisztesbödöne nem fogy ki, olajoskorsója nem apad el, fiát pedig visszahozza az életbe."
      fi: "Sidonin Sareptassa lesken jauhoastia ei tyhjene eikä öljykannu lopu, ja hänen poikansa herätetään henkiin."
      vi: "Tại Sa-rép-ta thuộc Si-đôn, bột trong vò của bà góa không hết, dầu trong bình không thiếu, và con trai bà được sống lại."
      ro: "În Sarepta Sidonului, făina din vasul văduvei nu scade și untdelemnul din ulciorul ei nu se împuținează, iar fiul ei este adus înapoi la viață."
      bg: "В Сарепта Сидонска брашното в делвата на вдовицата не намалява, нито маслото в стомната ѝ свършва, а синът ѝ е върнат към живот."
    story:
      en: "The Lord sent Elijah to Zarephath, a Phoenician town on the coast between Sidon and Tyre, at today's Sarafand in Lebanon, where a widow was to feed him. At the gate he found her gathering sticks; she had only a handful of meal and a little oil, but at his word she made him a small cake first, and the barrel of meal did not run out nor the jar of oil fail until the Lord sent rain. When her son fell ill and stopped breathing, Elijah carried him up to his room, stretched himself on the child three times and cried to the Lord, and the child revived; the woman said that now she knew he was a man of God."
      ru: "Господь послал Илию в Сарепту, финикийский город на побережье между Сидоном и Тиром, на месте нынешнего Сарафанда в Ливане, где его должна была кормить вдова. У ворот он нашёл её собирающей дрова; у неё была лишь горсть муки и немного масла, но по его слову она сначала испекла небольшой опреснок для него, и мука в кадке не истощалась, и масло в кувшине не убывало, пока Господь не послал дождь. Когда её сын заболел и перестал дышать, Илия отнёс его в свою горницу, трижды простёрся над ребёнком и воззвал к Господу, и ребёнок ожил; женщина сказала, что теперь она знает, что он человек Божий."
      uk: "Господь послав Іллю до Сарепти, фінікійського міста на узбережжі між Сідоном і Тіром, на місці нинішнього Сарафанда в Лівані, де його мала годувати вдова. Біля брами він знайшов її, коли вона збирала тріски; у неї була тільки жменя борошна й трохи олії, але на його слово вона спершу спекла коржика для нього, і борошно в діжці не вичерпувалося, і олії в глечику не меншало, аж поки Господь не послав дощ. Коли її син занедужав і перестав дихати, Ілля відніс його до своєї горниці, тричі простягся над дитиною й заволав до Господа, і дитина ожила; жінка сказала, що тепер вона знає, що він Божий чоловік."
      es: "El Señor envió a Elías a Sarepta, una ciudad fenicia de la costa entre Sidón y Tiro, en la actual Sarafand, en el Líbano, donde una viuda debía sustentarlo. A la puerta la encontró recogiendo leña; solo tenía un puñado de harina y un poco de aceite, pero, por su palabra, le hizo primero a él una pequeña torta, y la tinaja de harina no se agotó ni faltó la vasija de aceite hasta que el Señor envió la lluvia. Cuando su hijo enfermó y dejó de respirar, Elías lo subió a su cuarto, se tendió sobre el niño tres veces y clamó al Señor, y el niño revivió; la mujer dijo que ahora sabía que él era un varón de Dios."
      pt: "O Senhor enviou Elias a Sarepta, uma cidade fenícia da costa entre Sidom e Tiro, na atual Sarafand, no Líbano, onde uma viúva haveria de sustentá-lo. À porta encontrou-a apanhando lenha; ela tinha apenas um punhado de farinha e um pouco de azeite, mas, segundo a palavra dele, fez-lhe primeiro um pequeno pão, e a vasilha de farinha não se esgotou nem o jarro de azeite faltou até que o Senhor enviou chuva. Quando o filho dela adoeceu e deixou de respirar, Elias levou-o para o seu quarto, estendeu-se sobre o menino três vezes e clamou ao Senhor, e o menino reviveu; a mulher disse que agora sabia que ele era um homem de Deus."
      de: "Der Herr sandte Elia nach Sarepta, einer phönizischen Stadt an der Küste zwischen Sidon und Tyrus, beim heutigen Sarafand im Libanon, wo eine Witwe ihn versorgen sollte. Am Tor fand er sie beim Holzsammeln; sie hatte nur eine Handvoll Mehl und ein wenig Öl, doch auf sein Wort backte sie ihm zuerst einen kleinen Kuchen, und das Mehl im Topf ging nicht aus und das Öl im Krug versiegte nicht, bis der Herr Regen sandte. Als ihr Sohn erkrankte und nicht mehr atmete, trug Elia ihn hinauf in seine Kammer, streckte sich dreimal über das Kind, schrie zum Herrn, und das Kind wurde wieder lebendig; die Frau sagte, nun wisse sie, dass er ein Mann Gottes sei."
      fr: "L’Éternel envoya Élie à Sarepta, ville phénicienne de la côte entre Sidon et Tyr, à l’actuelle Sarafand, au Liban, où une veuve devait le nourrir. À l’entrée de la ville, il la trouva qui ramassait du bois ; elle n’avait qu’une poignée de farine et un peu d’huile, mais à sa parole elle lui fit d’abord un petit gâteau, et la farine du pot ne s’épuisa pas ni l’huile de la cruche ne manqua jusqu’à ce que l’Éternel envoie la pluie. Quand son fils tomba malade et cessa de respirer, Élie le monta dans sa chambre, s’étendit trois fois sur l’enfant et cria à l’Éternel, et l’enfant revint à la vie ; la femme dit qu’elle savait maintenant qu’il était un homme de Dieu."
      pl: "Pan posłał Eliasza do Sarepty, fenickiego miasta na wybrzeżu między Sydonem a Tyrem, w miejscu dzisiejszego Sarafand w Libanie, gdzie miała go żywić wdowa. Przy bramie zastał ją zbierającą drwa; miała tylko garść mąki i trochę oliwy, ale na jego słowo najpierw upiekła mu mały placek, i mąki w dzbanie nie zabrakło ani oliwy w baryłce nie ubyło, aż Pan zesłał deszcz. Gdy jej syn zachorował i przestał oddychać, Eliasz zaniósł go do swojej izby na górze, trzykrotnie rozciągnął się nad dzieckiem i wołał do Pana, a dziecko ożyło; kobieta powiedziała, że teraz wie, że jest on mężem Bożym."
      it: "Il Signore mandò Elia a Sarepta, città fenicia sulla costa tra Sidone e Tiro, nell’odierna Sarafand in Libano, dove una vedova doveva dargli da mangiare. Alla porta della città la trovò che raccoglieva legna; aveva solo una manciata di farina e un po’ d’olio, ma alla sua parola gli fece prima una piccola focaccia, e il vaso della farina non si esaurì né l’orcio dell’olio venne meno finché il Signore mandò la pioggia. Quando suo figlio si ammalò e smise di respirare, Elia lo portò su nella sua camera, si distese tre volte sul fanciullo e gridò al Signore, e il fanciullo tornò in vita; la donna disse che ora sapeva che egli era un uomo di Dio."
      nl: "De HEER zond Elia naar Sarefat, een Fenicische stad aan de kust tussen Sidon en Tyrus, bij het huidige Sarafand in Libanon, waar een weduwe hem zou onderhouden. Bij de poort vond hij haar terwijl zij hout sprokkelde; zij had slechts een handvol meel en een beetje olie, maar op zijn woord bakte zij eerst voor hem een kleine koek, en de meelbus raakte niet leeg en de oliekruik niet op, totdat de HEER regen zond. Toen haar zoon ziek werd en niet meer ademde, droeg Elia hem naar zijn bovenkamer, strekte zich driemaal over het kind uit en riep tot de HEER, en het kind kwam weer tot leven; de vrouw zei dat zij nu wist dat hij een man van God was."
      cs: "Hospodin poslal Elijáše do Sarepty, fénického města na pobřeží mezi Sidónem a Týrem, v místě dnešního Sarafandu v Libanonu, kde ho měla živit vdova. U brány ji zastihl, jak sbírá dříví; měla jen hrst mouky a trochu oleje, ale na jeho slovo mu nejprve upekla malou placku, a mouka v kbelíku nedošla ani olej v nádobce neubyl, dokud Hospodin neseslal déšť. Když její syn onemocněl a přestal dýchat, Elijáš ho odnesl nahoru do své komůrky, třikrát se nad dítětem rozprostřel a volal k Hospodinu, a dítě ožilo; žena řekla, že nyní ví, že je muž Boží."
      sv: "Herren sände Elia till Sarefat, en fenicisk stad vid kusten mellan Sidon och Tyros, vid nuvarande Sarafand i Libanon, där en änka skulle ge honom mat. Vid porten fann han henne när hon samlade ved; hon hade bara en handfull mjöl och lite olja, men på hans ord bakade hon först en liten kaka åt honom, och mjölet i krukan tog inte slut och oljan i kruset tröt inte förrän Herren sände regn. När hennes son blev sjuk och slutade andas, bar Elia upp honom till sitt rum, sträckte sig tre gånger över barnet och ropade till Herren, och barnet fick liv igen; kvinnan sade att nu visste hon att han var en gudsman."
      nb: "Herren sendte Elia til Sarepta, en fønikisk by ved kysten mellom Sidon og Tyros, ved dagens Sarafand i Libanon, der en enke skulle gi ham mat. Ved porten fant han henne mens hun sanket ved; hun hadde bare en håndfull mel og litt olje, men på hans ord bakte hun først en liten kake til ham, og melet i krukken tok ikke slutt, og oljen i krukken minket ikke før Herren sendte regn. Da sønnen hennes ble syk og sluttet å puste, bar Elia ham opp på rommet sitt, strakte seg tre ganger over barnet og ropte til Herren, og barnet fikk liv igjen; kvinnen sa at nå visste hun at han var en Guds mann."
      tl: "Sinugo ng Panginoon si Elias sa Sarepta, isang bayan ng Fenicia sa baybayin sa pagitan ng Sidon at Tiro, sa Sarafand ngayon sa Libano, kung saan isang babaing balo ang magpapakain sa kaniya. Sa pintuan ng bayan ay nasumpungan niya itong namumulot ng mga patpat; isang dakot na harina at kaunting langis lamang ang mayroon siya, ngunit ayon sa kaniyang salita ay iginawa muna niya siya ng isang munting tinapay, at ang gusi ng harina ay hindi nakulangan ni nabawasan ang banga ng langis hanggang sa magpaulan ang Panginoon. Nang magkasakit ang kaniyang anak at mawalan ng hininga, dinala siya ni Elias sa kaniyang silid sa itaas, umunat sa bata nang makaitlo at dumaing sa Panginoon, at nabuhay ang bata; sinabi ng babae na ngayon ay talastas niya na siya'y lalake ng Diyos."
      da: "Herren sendte Elias til Sarepta, en fønikisk by ved kysten mellem Sidon og Tyrus, ved det nuværende Sarafand i Libanon, hvor en enke skulle forsørge ham. Ved porten fandt han hende i færd med at samle brænde; hun havde kun en håndfuld mel og lidt olie, men efter hans ord bagte hun først en lille kage til ham, og melet i krukken slap ikke op, og oliekrukken svigtede ikke, indtil Herren gav regn. Da hendes søn blev syg og holdt op med at ånde, bar Elias ham op i sit værelse, strakte sig tre gange ud over barnet og råbte til Herren, og barnet kom til live igen; kvinden sagde, at nu vidste hun, at han var en Guds mand."
      sr: "Господ је послао Илију у Сарепту, феничански град на обали између Сидона и Тира, код данашњег Сарафанда у Либану, где је једна удовица требало да га храни. На вратима града нашао ју је како скупља дрва; имала је само грст брашна и мало уља, али на његову реч најпре му је направила мали колач, и брашна у здели није нестало нити је уља у крчагу понестало док Господ није пустио дажд. Кад јој се син разболео и престао да дише, Илија га је однео горе у своју собу, три пута се опружио над дететом и завапио Господу, и дете је оживело; жена је рекла да сада зна да је он човек Божји."
      hu: "Az Úr Sareptába küldte Illést, egy föníciai városba a tengerparton, Szidón és Tírusz között, a mai libanoni Sarafand helyén, ahol egy özvegynek kellett táplálnia őt. A kapunál talált rá, amint fát szedegetett; csak egy marék lisztje és egy kevés olaja volt, de Illés szavára először neki sütött egy kis pogácsát, és a véka liszt nem fogyott el, a korsó olaj sem apadt el, amíg az Úr esőt nem adott. Amikor a fia megbetegedett, és elállt a lélegzete, Illés felvitte a szobájába, háromszor ráborult a gyermekre, és az Úrhoz kiáltott, és a gyermek feléledt; az asszony azt mondta, hogy most már tudja, hogy Illés Isten embere."
      fi: "Herra lähetti Elian Sareptaan, foinikialaiseen kaupunkiin rannikolla Sidonin ja Tyroksen välillä, nykyisen Sarafandin kohdalle Libanonissa, jossa leski oli elättävä hänet. Portilla hän tapasi lesken keräämässä puita; tällä oli vain kourallinen jauhoja ja vähän öljyä, mutta Elian sanasta hän leipoi ensin hänelle pienen kakun, eikä jauhoastia tyhjentynyt eikä öljykannu loppunut, ennen kuin Herra antoi sateen. Kun lesken poika sairastui eikä enää hengittänyt, Elia kantoi hänet yläkammioonsa, ojentautui kolme kertaa lapsen päälle ja huusi Herraa, ja lapsi virkosi; nainen sanoi tietävänsä nyt, että hän oli Jumalan mies."
      vi: "Đức Giê-hô-va sai Ê-li đến Sa-rép-ta, một thành của người Phê-ni-xi trên bờ biển giữa Si-đôn và Ty-rơ, nay là Sarafand ở Li-ban, nơi một bà góa sẽ nuôi ông. Tại cửa thành ông gặp bà đang lượm củi; bà chỉ còn một nắm bột và một chút dầu, nhưng theo lời ông, bà làm cho ông một cái bánh nhỏ trước, và bột trong vò không hết, dầu trong bình không thiếu, cho đến khi Đức Giê-hô-va giáng mưa. Khi con trai bà bị đau và tắt hơi thở, Ê-li bồng nó lên phòng mình, nằm ấp trên đứa trẻ ba lần và kêu cầu Đức Giê-hô-va, và đứa trẻ sống lại; người đàn bà nói rằng bây giờ bà biết ông là người của Đức Chúa Trời."
      ro: "Domnul l-a trimis pe Ilie la Sarepta, o cetate feniciană de pe coastă, între Sidon și Tir, la actualul Sarafand din Liban, unde o văduvă urma să-l hrănească. La poartă a găsit-o adunând lemne; nu avea decât o mână de făină și puțin untdelemn, dar la cuvântul lui i-a făcut întâi lui o turtă mică, iar vasul cu făină nu s-a golit și ulciorul cu untdelemn nu s-a împuținat până când Domnul a trimis ploaie. Când fiul ei s-a îmbolnăvit și nu mai respira, Ilie l-a dus sus în odaia lui, s-a întins de trei ori peste copil și a strigat către Domnul, iar copilul a înviat; femeia a spus că acum știe că el este om al lui Dumnezeu."
      bg: "Господ изпрати Илия в Сарепта, финикийски град на брега между Сидон и Тир, при днешния Сарафанд в Ливан, където една вдовица трябваше да го храни. При портата той я намери да събира съчки; тя имаше само шепа брашно и малко масло, но по неговата дума първо му направи малка пита, и брашното в делвата не се свърши, нито маслото в стомната оскъдня, докато Господ не изпрати дъжд. Когато синът ѝ се разболя и престана да диша, Илия го занесе горе в стаята си, простря се три пъти над детето и извика към Господа, и детето оживя; жената каза, че сега знае, че той е Божий човек."
  - place: a3e21c6 # Mount Carmel
    ref: 1Kgs.18.19-1Kgs.18.40
    note:
      en: "On Mount Carmel the fire of the Lord falls on the sacrifice before the prophets of Baal."
      ru: "На горе Кармил огонь Господень ниспадает на жертву перед пророками Вааловыми."
      uk: "На горі Кармель вогонь Господній падає на жертву перед пророками Ваала."
      es: "En el Monte Carmelo el fuego del Señor cae sobre el sacrificio ante los profetas de Baal."
      pt: "No Monte Carmelo, o fogo do Senhor cai sobre o sacrifício diante dos profetas de Baal."
      de: "Auf dem Karmel fällt das Feuer des Herrn vor den Propheten Baals auf das Opfer."
      fr: "Sur le Mont Carmel, le feu de l’Éternel tombe sur le sacrifice devant les prophètes de Baal."
      pl: "Na Karmelu ogień Pański spada na ofiarę wobec proroków Baala."
      it: "Sul Monte Carmelo il fuoco del Signore scende sul sacrificio davanti ai profeti di Baal."
      nl: "Op de Karmel valt het vuur van de HEER op het offer, voor de ogen van de profeten van Baäl."
      cs: "Na hoře Karmel padá oheň Hospodinův na oběť před proroky Baalovými."
      sv: "På Karmel faller Herrens eld över offret inför Baals profeter."
      nb: "På Karmel faller Herrens ild over offeret for Baals profeter."
      tl: "Sa Bundok Carmelo, bumaba ang apoy ng Panginoon sa handog sa harap ng mga propeta ni Baal."
      da: "På Karmel falder Herrens ild på ofret for Ba'als profeters øjne."
      sr: "На Кармилу огањ Господњи пада на жртву пред пророцима Валовим."
      hu: "A Kármel-hegyen az Úr tüze leszáll az áldozatra Baál prófétái szeme láttára."
      fi: "Karmelvuorella Herran tuli lankeaa uhrin päälle Baalin profeettojen nähden."
      vi: "Trên Núi Cạt-mên, lửa của Đức Giê-hô-va giáng xuống trên của lễ trước mặt các tiên tri của Ba-anh."
      ro: "Pe Muntele Carmel, focul Domnului cade peste jertfă înaintea profeților lui Baal."
      bg: "На планината Кармил огънят Господен пада върху жертвата пред пророците на Ваал."
    story:
      en: "In the third year Elijah showed himself to Ahab and had all Israel gathered to Mount Carmel, the ridge that runs down to the sea above Haifa, with the four hundred and fifty prophets of Baal. He asked the people how long they would waver between two opinions. The prophets of Baal called on their god from morning until evening over their bull, and no one answered. Elijah repaired the altar of the Lord with twelve stones, had water poured three times over the sacrifice until it filled the trench, and prayed; the fire of the Lord fell and consumed the sacrifice, the wood, the stones and the water, and the people fell on their faces, saying, The Lord, he is God. The prophets of Baal were taken down to the brook Kishon and killed."
      ru: "На третий год Илия явился Ахаву и велел собрать весь Израиль на гору Кармил, хребет, спускающийся к морю над Хайфой, вместе с четырьмястами пятьюдесятью пророками Вааловыми. Он спросил народ, долго ли они будут колебаться между двумя мнениями. Пророки Ваала призывали своего бога над своим тельцом с утра до вечера, и никто не ответил. Илия восстановил жертвенник Господень из двенадцати камней, велел трижды полить жертву водой, так что она наполнила ров, и помолился; огонь Господень ниспал и пожрал жертву, дрова, камни и воду, и народ пал на лицо своё, говоря, что Господь есть Бог. Пророков Ваала отвели к потоку Киссону и убили."
      uk: "Третього року Ілля з’явився Ахавові й звелів зібрати весь Ізраїль на гору Кармель, хребет, що спускається до моря над Хайфою, разом із чотирмастами п’ятдесятьма пророками Ваала. Він спитав народ, доки вони вагатимуться між двома думками. Пророки Ваала кликали свого бога над своїм бичком від ранку до вечора, і ніхто не відповів. Ілля відновив жертовник Господній з дванадцяти каменів, звелів тричі полити жертву водою, аж вона наповнила рів, і помолився; вогонь Господній упав і пожер жертву, дрова, каміння й воду, і народ упав на обличчя, кажучи, що Господь є Бог. Пророків Ваала відвели до потоку Кішон і вбили."
      es: "Al tercer año Elías se presentó ante Acab e hizo reunir a todo Israel en el monte Carmelo, la cordillera que desciende hasta el mar sobre Haifa, con los cuatrocientos cincuenta profetas de Baal. Preguntó al pueblo hasta cuándo vacilarían entre dos opiniones. Los profetas de Baal invocaron a su dios desde la mañana hasta la tarde sobre su buey, y nadie respondió. Elías reparó el altar del Señor con doce piedras, hizo derramar agua tres veces sobre el sacrificio hasta llenar la zanja y oró; cayó el fuego del Señor y consumió el sacrificio, la leña, las piedras y el agua, y el pueblo cayó sobre su rostro diciendo: El Señor es Dios. Los profetas de Baal fueron llevados al arroyo de Cisón y muertos allí."
      pt: "No terceiro ano, Elias apresentou-se a Acabe e mandou reunir todo o Israel no monte Carmelo, a serra que desce até o mar acima de Haifa, com os quatrocentos e cinquenta profetas de Baal. Perguntou ao povo até quando vacilariam entre duas opiniões. Os profetas de Baal invocaram o seu deus desde a manhã até a tarde sobre o seu novilho, e ninguém respondeu. Elias reparou o altar do Senhor com doze pedras, mandou derramar água três vezes sobre o sacrifício até encher a vala e orou; o fogo do Senhor caiu e consumiu o sacrifício, a lenha, as pedras e a água, e o povo prostrou-se com o rosto em terra, dizendo: O Senhor é Deus. Os profetas de Baal foram levados ao riacho de Quisom e mortos ali."
      de: "Im dritten Jahr zeigte sich Elia Ahab und ließ ganz Israel auf dem Karmel versammeln, dem Höhenzug, der oberhalb von Haifa zum Meer abfällt, mit den vierhundertfünfzig Propheten Baals. Er fragte das Volk, wie lange es zwischen zwei Meinungen schwanken wolle. Die Propheten Baals riefen von Morgen bis Abend über ihrem Stier ihren Gott an, und niemand antwortete. Elia baute den Altar des Herrn mit zwölf Steinen wieder auf, ließ dreimal Wasser über das Opfer gießen, bis es den Graben füllte, und betete; das Feuer des Herrn fiel herab und verzehrte das Opfer, das Holz, die Steine und das Wasser, und das Volk fiel auf sein Angesicht und sagte, der Herr sei Gott. Die Propheten Baals wurden hinab an den Bach Kischon geführt und getötet."
      fr: "La troisième année, Élie se présenta devant Achab et fit rassembler tout Israël au mont Carmel, la crête qui descend vers la mer au-dessus de Haïfa, avec les quatre cent cinquante prophètes de Baal. Il demanda au peuple jusqu’à quand il clocherait des deux côtés. Les prophètes de Baal invoquèrent leur dieu du matin jusqu’au soir sur leur taureau, et personne ne répondit. Élie rétablit l’autel de l’Éternel avec douze pierres, fit verser trois fois de l’eau sur le sacrifice jusqu’à en remplir le fossé, et pria ; le feu de l’Éternel tomba et consuma le sacrifice, le bois, les pierres et l’eau, et le peuple tomba sur sa face en disant : C’est l’Éternel qui est Dieu. Les prophètes de Baal furent menés au torrent de Kison et mis à mort."
      pl: "W trzecim roku Eliasz pokazał się Achabowi i polecił zgromadzić cały Izrael na górze Karmel, grzbiecie opadającym ku morzu nad Hajfą, razem z czterystu pięćdziesięcioma prorokami Baala. Zapytał lud, jak długo będą chwiać się na dwie strony. Prorocy Baala wzywali swego boga od rana do wieczora nad swoim cielcem, lecz nikt nie odpowiedział. Eliasz odbudował ołtarz Pana z dwunastu kamieni, kazał trzy razy polać ofiarę wodą, aż wypełniła rów, i modlił się; spadł ogień Pana i strawił ofiarę, drwa, kamienie i wodę, a lud padł na twarz, mówiąc, że Pan jest Bogiem. Proroków Baala sprowadzono nad potok Kiszon i zabito."
      it: "Nel terzo anno Elia si presentò ad Acab e fece radunare tutto Israele sul Monte Carmelo, la dorsale che scende verso il mare sopra Haifa, con i quattrocentocinquanta profeti di Baal. Chiese al popolo fino a quando avrebbe zoppicato dai due lati. I profeti di Baal invocarono il loro dio dalla mattina alla sera sul loro giovenco, e nessuno rispose. Elia riparò l’altare del Signore con dodici pietre, fece versare tre volte acqua sul sacrificio finché riempì il fosso, e pregò; il fuoco del Signore cadde e consumò il sacrificio, la legna, le pietre e l’acqua, e il popolo cadde con la faccia a terra dicendo: Il Signore è Dio. I profeti di Baal furono condotti al torrente Kison e uccisi."
      nl: "In het derde jaar vertoonde Elia zich aan Achab en liet heel Israël bijeenkomen op de Karmel, de bergrug die boven Haifa naar de zee afloopt, samen met de vierhonderdvijftig profeten van Baäl. Hij vroeg het volk hoelang zij op twee gedachten zouden hinken. De profeten van Baäl riepen van de morgen tot de avond hun god aan boven hun stier, en niemand antwoordde. Elia herstelde het altaar van de HEER met twaalf stenen, liet driemaal water over het offer gieten tot het de greppel vulde, en bad; het vuur van de HEER viel neer en verteerde het offer, het hout, de stenen en het water, en het volk viel op zijn aangezicht en zei dat de HEER God is. De profeten van Baäl werden naar de beek Kison gebracht en gedood."
      cs: "Ve třetím roce se Elijáš ukázal Achabovi a dal shromáždit celý Izrael na horu Karmel, hřbet, který sbíhá k moři nad Haifou, spolu se čtyřmi sty padesáti Baalovými proroky. Zeptal se lidu, jak dlouho budou kulhat na obě strany. Baalovi proroci vzývali svého boha od rána do večera nad svým býčkem, ale nikdo neodpověděl. Elijáš opravil Hospodinův oltář z dvanácti kamenů, dal třikrát polít oběť vodou, až naplnila příkop, a modlil se; padl oheň Hospodinův a strávil oběť, dříví, kameny i vodu a lid padl na tvář a volal, že Hospodin je Bůh. Baalovy proroky odvedli dolů k potoku Kíšonu a pobili."
      sv: "Under det tredje året visade sig Elia för Achav och lät samla hela Israel till Karmel, bergsryggen som sträcker sig ned mot havet ovanför Haifa, tillsammans med Baals fyra hundra femtio profeter. Han frågade folket hur länge de skulle halta på båda sidor. Baals profeter åkallade sin gud från morgon till kväll över sin tjur, och ingen svarade. Elia byggde upp Herrens altare igen med tolv stenar, lät hälla vatten över offret tre gånger tills det fyllde diket och bad; Herrens eld föll och förtärde offret, veden, stenarna och vattnet, och folket föll ned på sina ansikten och sade att Herren är Gud. Baals profeter fördes ned till bäcken Kishon och dödades."
      nb: "I det tredje året viste Elia seg for Ahab og fikk hele Israel samlet til Karmel, fjellryggen som går ned mot havet ovenfor Haifa, sammen med Baals fire hundre og femti profeter. Han spurte folket hvor lenge de ville halte til begge sider. Baals profeter påkalte guden sin fra morgen til kveld over oksen sin, og ingen svarte. Elia satte Herrens alter i stand igjen med tolv steiner, lot vann helles over offeret tre ganger til det fylte grøften, og ba; Herrens ild falt og fortærte offeret, veden, steinene og vannet, og folket falt ned på sitt ansikt og sa at Herren er Gud. Baals profeter ble ført ned til bekken Kisjon og drept."
      tl: "Nang ikatlong taon ay napakita si Elias kay Achab at ipinapisan ang buong Israel sa Bundok Carmelo, ang tagaytay na bumababa sa dagat sa itaas ng Haifa, kasama ang apat na raan at limampung propeta ni Baal. Tinanong niya ang bayan kung hanggang kailan sila mag-aalinlangan sa dalawang isipan. Tumawag ang mga propeta ni Baal sa kanilang diyos mula umaga hanggang hapon sa ibabaw ng kanilang toro, at walang sumagot. Inayos ni Elias ang dambana ng Panginoon sa pamamagitan ng labindalawang bato, ipinabuhos ang tubig nang makaitlo sa handog hanggang mapuno ang hukay, at nanalangin; bumaba ang apoy ng Panginoon at tinupok ang handog, ang kahoy, ang mga bato at ang tubig, at nagpatirapa ang bayan, na nagsasabing ang Panginoon ay siyang Diyos. Dinala ang mga propeta ni Baal sa batis ng Cison at pinatay roon."
      da: "I det tredje år viste Elias sig for Akab og lod hele Israel samle på Karmel, højdedraget, der løber ned mod havet over Haifa, sammen med de fire hundrede og halvtreds Ba'als profeter. Han spurgte folket, hvor længe de ville halte til begge sider. Ba'als profeter påkaldte deres gud fra morgen til aften over deres tyr, og ingen svarede. Elias genopbyggede Herrens alter med tolv sten, lod vand hælde tre gange over ofret, til det fyldte graven, og bad; Herrens ild faldt ned og fortærede ofret, brændet, stenene og vandet, og folket faldt på deres ansigt og sagde, at Herren er Gud. Ba'als profeter blev ført ned til Kisons bæk og dræbt."
      sr: "Треће године Илија се показао Ахаву и сабрао сав Израиљ на гору Кармил, гребен који се спушта к мору изнад Хаифе, с четири стотине и педесет пророка Валових. Упитао је народ докле ће храмати на обе стране. Пророци Валови призивали су свог бога од јутра до вечера над својим теоцем, и нико се није одазвао. Илија је оправио олтар Господњи од дванаест камена, дао да се три пута излије вода на жртву док није напунила јарак, и помолио се; огањ Господњи пао је и спалио жртву, дрва, камење и воду, а народ је попадао ничице говорећи да је Господ Бог. Пророке Валове одвели су на поток Кисон и поклали их."
      hu: "A harmadik évben Illés megjelent Aháb előtt, és egész Izráelt összegyűjttette a Kármel-hegyre, a Haifa fölött a tengerig futó hegyhátra, Baál négyszázötven prófétájával együtt. Megkérdezte a népet, meddig sántikálnak két vélemény között. Baál prófétái reggeltől estig hívták istenüket bikájuk fölött, de senki sem felelt. Illés tizenkét kőből helyreállította az Úr oltárát, háromszor vizet öntetett az áldozatra, míg az árok meg nem telt, és imádkozott; az Úr tüze leszállt, és megemésztette az áldozatot, a fát, a köveket és a vizet, a nép pedig arcra borult, mondván, hogy az Úr az Isten. Baál prófétáit levitték a Kison patakjához, és megölték."
      fi: "Kolmantena vuonna Elia näyttäytyi Ahabille ja kokosi koko Israelin Karmelvuorelle, harjanteelle, joka laskee merelle Haifan yläpuolella, sekä neljäsataaviisikymmentä Baalin profeettaa. Hän kysyi kansalta, kuinka kauan he ontuisivat molemmille puolille. Baalin profeetat huusivat jumalaansa aamusta iltaan härkänsä ääressä, eikä kukaan vastannut. Elia korjasi Herran alttarin kahdellatoista kivellä, antoi kaataa vettä kolme kertaa uhrin päälle, kunnes se täytti ojan, ja rukoili; Herran tuli lankesi ja kulutti uhrin, puut, kivet ja veden, ja kansa lankesi kasvoilleen sanoen, että Herra on Jumala. Baalin profeetat vietiin Kiisonin purolle ja tapettiin."
      vi: "Năm thứ ba, Ê-li ra mắt A-háp và khiến cả Y-sơ-ra-ên nhóm lại trên núi Cạt-mên, dãy núi chạy xuống biển phía trên Haifa, cùng với bốn trăm năm mươi tiên tri của Ba-anh. Ông hỏi dân chúng họ còn đi giẹo hai bên cho đến chừng nào. Các tiên tri của Ba-anh kêu cầu thần mình từ sáng đến chiều trên con bò của họ, mà chẳng ai đáp lời. Ê-li sửa lại bàn thờ của Đức Giê-hô-va bằng mười hai hòn đá, cho đổ nước ba lần trên của lễ cho đến khi đầy mương, rồi cầu nguyện; lửa của Đức Giê-hô-va giáng xuống thiêu đốt của lễ, củi, đá và nước, và dân chúng sấp mặt xuống đất, xưng rằng Giê-hô-va là Đức Chúa Trời. Các tiên tri của Ba-anh bị đem xuống khe Ki-sôn và bị giết tại đó."
      ro: "În al treilea an, Ilie s-a arătat lui Ahab și a făcut să fie adunat tot Israelul pe Muntele Carmel, culmea care coboară spre mare deasupra Haifei, împreună cu cei patru sute cincizeci de profeți ai lui Baal. A întrebat poporul până când vor șovăi între două păreri. Profeții lui Baal și-au chemat zeul de dimineața până seara deasupra taurului lor, și nimeni n-a răspuns. Ilie a reparat altarul Domnului cu douăsprezece pietre, a pus să se toarne apă de trei ori peste jertfă până când s-a umplut șanțul și s-a rugat; focul Domnului a căzut și a mistuit jertfa, lemnele, pietrele și apa, iar poporul a căzut cu fața la pământ, zicând că Domnul este Dumnezeu. Profeții lui Baal au fost duși la pârâul Chison și uciși."
      bg: "В третата година Илия се яви пред Ахав и събра целия Израил на планината Кармил — хребета, който се спуска към морето над Хайфа, — заедно с четиристотин и петдесетте пророци на Ваал. Той попита народа докога ще се колебаят между две мнения. Пророците на Ваал призоваваха бога си от сутринта до вечерта над своя юнец и никой не отговори. Илия поправи олтара на Господа с дванадесет камъка, накара три пъти да излеят вода върху жертвата, докато тя напълни рова, и се помоли; огънят Господен падна и изгори жертвата, дървата, камъните и водата, а народът падна на лицата си, като казваше, че Господ е Бог. Пророците на Ваал бяха свалени при потока Кисон и избити."
  - place: ae0bf4a # Jezreel
    ref: 1Kgs.18.41-1Kgs.18.46
    note:
      en: "The rain comes, and Elijah runs before Ahab to the entrance of Jezreel."
      ru: "Приходит дождь, и Илия бежит перед Ахавом до самого Изрееля."
      uk: "Приходить дощ, і Ілля біжить перед Ахавом до входу в Їзреель."
      es: "Llega la lluvia, y Elías corre delante de Acab hasta la entrada de Jezreel."
      pt: "Vem a chuva, e Elias corre diante de Acabe até a entrada de Jezreel."
      de: "Der Regen kommt, und Elia läuft vor Ahab her bis zum Eingang von Jesreel."
      fr: "La pluie vient, et Élie court devant Achab jusqu’à l’entrée de Jizreel."
      pl: "Przychodzi deszcz, a Eliasz biegnie przed Achabem aż do wejścia do Jizreel."
      it: "Viene la pioggia, ed Elia corre davanti ad Acab fino all’ingresso di Izreel."
      nl: "De regen komt, en Elia rent voor Achab uit tot aan de ingang van Jizreël."
      cs: "Přichází déšť a Elijáš běží před Achabem až ke vjezdu do Jizreelu."
      sv: "Regnet kommer, och Elia springer framför Achav till ingången till Jisreel."
      nb: "Regnet kommer, og Elia løper foran Ahab til inngangen til Jisreel."
      tl: "Dumating ang ulan, at tumakbo si Elias sa unahan ni Achab hanggang sa pasukan ng Jezreel."
      da: "Regnen kommer, og Elias løber foran Akab til indgangen til Jizre'el."
      sr: "Долази киша, и Илија трчи пред Ахавом до улаза у Језраел."
      hu: "Megjön az eső, és Illés Aháb előtt fut Jezréel bejáratáig."
      fi: "Sade tulee, ja Elia juoksee Ahabin edellä Jisreelin sisäänkäynnille asti."
      vi: "Mưa đến, và Ê-li chạy trước A-háp cho đến cửa vào Gít-rê-ên."
      ro: "Vine ploaia, iar Ilie aleargă înaintea lui Ahab până la intrarea în Izreel."
      bg: "Идва дъжд и Илия тича пред Ахав до входа на Изреел."
    story:
      en: "Elijah went up to the top of Carmel and bowed to the ground; seven times his servant looked towards the sea, until a cloud as small as a man's hand rose from it. The sky grew black with clouds and wind and a great rain fell. Ahab rode to Jezreel, his residence at the foot of Mount Gilboa, and the hand of the Lord was on Elijah: he tucked up his robe and ran ahead of Ahab's chariot all the way to the entrance of Jezreel."
      ru: "Илия поднялся на вершину Кармила и склонился до земли; семь раз его слуга смотрел в сторону моря, пока от него не поднялось облако величиной с ладонь человеческую. Небо почернело от туч и ветра, и пошёл большой дождь. Ахав поехал в Изреель, свою резиденцию у подножия горы Гелвуй, а на Илии была рука Господня: он подпоясал одежду и бежал перед колесницей Ахава до самого входа в Изреель."
      uk: "Ілля піднявся на вершину Кармелю й схилився до землі; сім разів його слуга дивився в бік моря, аж поки з нього не піднялася хмаринка завбільшки з людську долоню. Небо почорніло від хмар і вітру, і пішов великий дощ. Ахав поїхав до Їзреелю, своєї резиденції біля підніжжя гори Гілбоа, а на Іллі була рука Господня: він підперезав свій одяг і біг перед колісницею Ахава аж до входу в Їзреель."
      es: "Elías subió a la cumbre del Carmelo y se postró en tierra; siete veces miró su criado hacia el mar, hasta que de él subió una nube tan pequeña como la mano de un hombre. El cielo se oscureció con nubes y viento, y cayó una gran lluvia. Acab fue en su carro a Jezreel, su residencia al pie del monte Gilboa, y la mano del Señor estuvo sobre Elías: se ciñó el manto y corrió delante del carro de Acab hasta la entrada de Jezreel."
      pt: "Elias subiu ao topo do Carmelo e curvou-se até o chão; sete vezes o seu servo olhou em direção ao mar, até que dele subiu uma nuvem do tamanho da mão de um homem. O céu escureceu com nuvens e vento, e caiu uma grande chuva. Acabe foi de carro para Jezreel, a sua residência ao pé do monte Gilboa, e a mão do Senhor estava sobre Elias: ele prendeu a capa no cinto e correu à frente do carro de Acabe até a entrada de Jezreel."
      de: "Elia stieg auf den Gipfel des Karmel und beugte sich zur Erde; siebenmal schaute sein Diener zum Meer hin, bis eine Wolke, so klein wie eines Mannes Hand, daraus aufstieg. Der Himmel wurde schwarz von Wolken und Wind, und ein großer Regen fiel. Ahab fuhr nach Jesreel, seiner Residenz am Fuß des Gilboa, und die Hand des Herrn kam über Elia: Er gürtete sein Gewand und lief vor dem Wagen Ahabs her bis zum Eingang von Jesreel."
      fr: "Élie monta au sommet du Carmel et se pencha contre terre ; sept fois son serviteur regarda du côté de la mer, jusqu’à ce qu’un nuage, petit comme la main d’un homme, s’en élève. Le ciel s’obscurcit de nuages et de vent, et une forte pluie tomba. Achab partit en char pour Jizreel, sa résidence au pied du mont Guilboa, et la main de l’Éternel fut sur Élie : il se ceignit les reins et courut devant le char d’Achab jusqu’à l’entrée de Jizreel."
      pl: "Eliasz wszedł na szczyt Karmelu i pochylił się ku ziemi; siedem razy jego sługa spoglądał w stronę morza, aż wyłoniła się z niego chmura mała jak dłoń człowieka. Niebo pociemniało od chmur i wiatru i spadł wielki deszcz. Achab pojechał do Jizreel, swojej rezydencji u stóp góry Gilboa, a ręka Pana spoczęła na Eliaszu: podkasał szatę i biegł przed rydwanem Achaba aż do wejścia do Jizreel."
      it: "Elia salì in vetta al Carmelo e si gettò a terra; sette volte il suo servo guardò verso il mare, finché una nuvoletta piccola come la mano di un uomo salì dal mare. Il cielo si oscurò di nubi e di vento e cadde una grande pioggia. Acab andò sul carro a Izreel, sua residenza ai piedi del monte Gelboe, e la mano del Signore fu su Elia: si cinse i fianchi e corse davanti al carro di Acab fino all’ingresso di Izreel."
      nl: "Elia ging op naar de top van de Karmel en boog zich ter aarde; zevenmaal keek zijn knecht naar de zee, totdat er een wolk, zo klein als de hand van een man, uit opsteeg. De hemel werd zwart van wolken en wind, en er viel een grote regen. Achab reed naar Jizreël, zijn residentie aan de voet van de Gilboa, en de hand van de HEER kwam over Elia: hij schortte zijn kleed op en rende voor de wagen van Achab uit tot aan de ingang van Jizreël."
      cs: "Elijáš vystoupil na vrchol Karmelu a sklonil se k zemi; sedmkrát se jeho služebník díval k moři, až z něj vystoupil mráček malý jako lidská dlaň. Nebe se zatáhlo mraky, zvedl se vítr a spadl velký déšť. Achab odjel do Jizreelu, svého sídla na úpatí hory Gilboa, a na Elijáše dolehla ruka Hospodinova: podkasal si šat a běžel před Achabovým vozem až ke vjezdu do Jizreelu."
      sv: "Elia gick upp på Karmels topp och böjde sig ned mot jorden; sju gånger såg hans tjänare ut mot havet, tills ett moln, inte större än en mans hand, steg upp ur det. Himlen blev svart av moln och vind, och ett stort regn föll. Achav åkte till Jisreel, sin residensstad vid foten av Gilboa, och Herrens hand var över Elia: han fäste upp sin mantel och sprang framför Achavs vagn hela vägen till ingången till Jisreel."
      nb: "Elia gikk opp på toppen av Karmel og bøyde seg mot jorden; sju ganger så tjeneren hans ut mot havet, til en sky, ikke større enn en manns hånd, steg opp fra det. Himmelen ble svart av skyer og vind, og et kraftig regn falt. Ahab kjørte til Jisreel, residensbyen hans ved foten av Gilboa, og Herrens hånd var over Elia: han bandt opp kappen og løp foran Ahabs vogn helt til inngangen til Jisreel."
      tl: "Umahon si Elias sa taluktok ng Carmelo at yumukod sa lupa; makapito tumanaw ang kaniyang lingkod sa dagat, hanggang sa may bumangong isang ulap mula roon na kasingliit ng kamay ng isang lalake. Nagdilim ang langit sa alapaap at hangin at nagkaroon ng malakas na ulan. Sumakay si Achab patungong Jezreel, ang kaniyang tahanan sa paanan ng Bundok Gilboa, at ang kamay ng Panginoon ay nasa kay Elias: binigkisan niya ang kaniyang mga balakang at tumakbong nagpauna sa karo ni Achab hanggang sa pasukan ng Jezreel."
      da: "Elias gik op på toppen af Karmel og bøjede sig mod jorden; syv gange så hans tjener ud mod havet, indtil en sky, lille som en mands hånd, steg op af det. Himlen blev sort af skyer og storm, og der faldt en stærk regn. Akab kørte til Jizre'el, sin residens ved foden af Gilboabjerget, og Herrens hånd var over Elias: han bandt sin kjortel op og løb foran Akabs vogn hele vejen til indgangen til Jizre'el."
      sr: "Илија се попео на врх Кармила и сагнуо до земље; седам пута његов момак погледао је према мору, док се из њега није подигао облак мали као длан човечији. Небо се замрачило од облака и ветра, и пао је велики дажд. Ахав се колима отпутио у Језраел, своје седиште у подножју горе Гелвује, а рука Господња дошла је над Илију: опасао је хаљину и трчао пред Ахавовим колима све до улаза у Језраел."
      hu: "Illés felment a Kármel tetejére, és a földre hajolt; szolgája hétszer nézett a tenger felé, míg egy emberi tenyérnyi kis felhő fel nem szállt belőle. Az ég elsötétült a felhőktől és a széltől, és nagy eső esett. Aháb Jezréelbe hajtott, a Gilbóa-hegy lábánál fekvő székhelyére, Illésen pedig az Úr keze volt: felövezte köntösét, és Aháb szekere előtt futott egészen Jezréel bejáratáig."
      fi: "Elia nousi Karmelin huipulle ja kumartui maahan; seitsemän kertaa hänen palvelijansa katsoi merelle päin, kunnes merestä nousi pieni pilvi, miehen kämmenen kokoinen. Taivas kävi mustaksi pilvistä ja tuulesta, ja tuli ankara sade. Ahab ajoi Jisreeliin, asuinkaupunkiinsa Gilboavuoren juurella, ja Herran käsi oli Elian päällä: hän kääri viittansa vyölleen ja juoksi Ahabin vaunujen edellä Jisreelin sisäänkäynnille asti."
      vi: "Ê-li leo lên chót núi Cạt-mên và cúi xuống đất; bảy lần kẻ tôi tớ ông nhìn về phía biển, cho đến khi một cụm mây nhỏ như bàn tay người từ biển bay lên. Trời bị mây và gió làm đen kịt, và có cơn mưa rất lớn. A-háp đánh xe đến Gít-rê-ên, nơi ở của vua dưới chân núi Ghinh-bô-a, và tay Đức Giê-hô-va giáng trên Ê-li: ông thắt lưng và chạy trước xe A-háp suốt đường cho đến cửa vào Gít-rê-ên."
      ro: "Ilie a urcat pe vârful Carmelului și s-a plecat până la pământ; de șapte ori slujitorul lui s-a uitat spre mare, până când s-a ridicat din ea un nor mic cât palma unui om. Cerul s-a întunecat de nori și de vânt și a căzut o ploaie mare. Ahab a mers cu carul la Izreel, reședința lui de la poalele Muntelui Ghilboa, iar mâna Domnului a fost peste Ilie: și-a încins mantaua și a alergat înaintea carului lui Ahab tot drumul, până la intrarea în Izreel."
      bg: "Илия се изкачи на върха на Кармил и се наведе до земята; седем пъти слугата му погледна към морето, докато от него не се издигна облак, малък колкото човешка длан. Небето почерня от облаци и вятър и заваля голям дъжд. Ахав се отправи с колесницата си към Изреел, своята резиденция в подножието на планината Гелвуе, а ръката Господня беше върху Илия: той препаса дрехата си и тича пред колесницата на Ахав чак до входа на Изреел."
  - place: ad2f6c2 # Beersheba
    ref: 1Kgs.19.1-1Kgs.19.4
    note:
      en: "Fleeing Jezebel, he comes to Beersheba and goes on into the wilderness."
      ru: "Спасаясь от Иезавели, он приходит в Вирсавию и уходит в пустыню."
      uk: "Тікаючи від Єзавелі, він приходить до Беер-Шеви й іде далі в пустелю."
      es: "Huyendo de Jezabel, llega a Beerseba y sigue adentrándose en el desierto."
      pt: "Fugindo de Jezabel, chega a Berseba e segue deserto adentro."
      de: "Auf der Flucht vor Isebel kommt er nach Beerscheba und zieht weiter in die Wüste."
      fr: "Fuyant Jézabel, il arrive à Beer-Schéba et poursuit son chemin dans le désert."
      pl: "Uciekając przed Izebel, dociera do Beer-Szeby i idzie dalej na pustynię."
      it: "Fuggendo da Gezabele, giunge a Bersabea e prosegue nel deserto."
      nl: "Op de vlucht voor Izebel komt hij te Berseba en trekt verder de woestijn in."
      cs: "Prchá před Jezábel, dochází do Beer-šeby a pokračuje dál na poušť."
      sv: "På flykt undan Isebel kommer han till Beer Sheva och går vidare ut i öknen."
      nb: "På flukt fra Jesabel kommer han til Beer-Sjeba og drar videre ut i ørkenen."
      tl: "Sa pagtakas kay Jezabel, dumating siya sa Beer-seba at nagpatuloy sa ilang."
      da: "Han flygter for Jezabel, kommer til Beersheba og går videre ud i ørkenen."
      sr: "Бежећи од Језавеље, долази у Вирсавеју и иде даље у пустињу."
      hu: "Jézabel elől menekülve Beérsebába jut, és tovább megy a pusztába."
      fi: "Isebelia paetessaan hän tulee Beersebaan ja jatkaa edelleen erämaahan."
      vi: "Chạy trốn Giê-sa-bên, người đến Bê-e-Sê-ba rồi đi tiếp vào đồng vắng."
      ro: "Fugind de Izabela, ajunge la Beer-Șeba și merge mai departe în pustiu."
      bg: "Бягайки от Йезавел, той идва във Вирсавия и продължава в пустинята."
    story:
      en: "When Jezebel swore to take his life, Elijah fled for his life to Beersheba in Judah, on the edge of the Negev, and left his servant there. He went on a day's journey into the wilderness, sat down under a juniper tree and asked to die. An angel touched him twice and told him to eat, for the journey was too great for him, and he found a cake baked on the coals and a jar of water by his head."
      ru: "Когда Иезавель поклялась лишить его жизни, Илия бежал, спасая жизнь, в Вирсавию в Иудее, на краю Негева, и оставил там своего слугу. Он ушёл на день пути в пустыню, сел под можжевеловым кустом и просил себе смерти. Ангел дважды коснулся его и велел есть, потому что дальний путь был ему не по силам, и он нашёл у своего изголовья лепёшку, испечённую на углях, и кувшин воды."
      uk: "Коли Єзавель присяглася позбавити його життя, Ілля втік, рятуючи своє життя, до Беер-Шеви в Юдеї, на краю Негеву, і залишив там свого слугу. Він пішов на день дороги в пустелю, сів під ялівцевим кущем і просив собі смерті. Ангел двічі торкнувся його й звелів їсти, бо дорога була задовга для нього, і він знайшов біля своєї голови коржа, спеченого на вугіллі, і глечик води."
      es: "Cuando Jezabel juró quitarle la vida, Elías huyó para salvarse a Beerseba de Judá, en el borde del Néguev, y dejó allí a su criado. Siguió un día de camino por el desierto, se sentó bajo un enebro y pidió morir. Un ángel lo tocó dos veces y le dijo que comiera, porque el camino era demasiado largo para él, y encontró junto a su cabecera una torta cocida sobre las brasas y una vasija de agua."
      pt: "Quando Jezabel jurou tirar-lhe a vida, Elias fugiu para salvar a sua vida até Berseba, em Judá, na orla do Neguev, e deixou ali o seu servo. Seguiu um dia de caminho pelo deserto, sentou-se debaixo de um zimbro e pediu para morrer. Um anjo tocou-o duas vezes e disse-lhe que comesse, pois o caminho era longo demais para ele, e ele encontrou à sua cabeceira um pão assado sobre as brasas e um jarro de água."
      de: "Als Isebel schwor, ihm das Leben zu nehmen, floh Elia um sein Leben nach Beerscheba in Juda, am Rand des Negev, und ließ seinen Diener dort. Er ging eine Tagereise weit in die Wüste, setzte sich unter einen Wacholder und bat zu sterben. Ein Engel rührte ihn zweimal an und sagte ihm, er solle essen, denn der Weg sei zu weit für ihn, und er fand zu seinen Häupten ein auf Kohlen gebackenes Brot und einen Krug Wasser."
      fr: "Quand Jézabel jura de lui ôter la vie, Élie s’enfuit pour sauver sa vie à Beer-Schéba, en Juda, au bord du Négev, et y laissa son serviteur. Il alla dans le désert à une journée de marche, s’assit sous un genêt et demanda la mort. Un ange le toucha deux fois et lui dit de manger, car le chemin était trop long pour lui, et il trouva à son chevet un gâteau cuit sur les braises et une cruche d’eau."
      pl: "Gdy Izebel przysięgła, że odbierze mu życie, Eliasz uciekł, ratując życie, do Beer-Szeby w Judzie, na skraju Negewu, i zostawił tam swego sługę. Poszedł dzień drogi dalej na pustynię, usiadł pod jałowcem i prosił o śmierć. Anioł dotknął go dwa razy i kazał mu jeść, bo droga była dla niego zbyt daleka, a on znalazł przy swojej głowie placek upieczony na węglach i dzban wody."
      it: "Quando Gezabele giurò di togliergli la vita, Elia fuggì per salvarsi a Bersabea, in Giuda, ai margini del Negheb, e vi lasciò il suo servo. Proseguì nel deserto per una giornata di cammino, si sedette sotto una ginestra e chiese di morire. Un angelo lo toccò due volte e gli disse di mangiare, perché il cammino era troppo lungo per lui, ed egli trovò presso il capo una focaccia cotta sulle braci e una brocca d’acqua."
      nl: "Toen Izebel zwoer hem het leven te benemen, vluchtte Elia voor zijn leven naar Berseba in Juda, aan de rand van de Negev, en liet zijn knecht daar achter. Hij ging een dagreis de woestijn in, ging onder een jeneverbes zitten en vroeg te mogen sterven. Een engel raakte hem tweemaal aan en zei hem te eten, want de weg was te ver voor hem, en hij vond bij zijn hoofd een op kolen gebakken koek en een kruik water."
      cs: "Když Jezábel přísahala, že ho připraví o život, Elijáš utekl, aby si zachránil život, do Beer-šeby v Judsku, na okraji Negevu, a nechal tam svého služebníka. Šel ještě den cesty do pouště, usedl pod jalovec a prosil o smrt. Anděl se ho dvakrát dotkl a řekl mu, ať jí, neboť cesta je pro něho příliš dlouhá, a on nalezl u své hlavy podpopelný chléb a džbán vody."
      sv: "När Isebel svor att ta hans liv flydde Elia för att rädda sitt liv till Beer Sheva i Juda, i utkanten av Negev, och lämnade sin tjänare där. Han gick vidare en dagsresa ut i öknen, satte sig under en ginstbuske och bad att få dö. En ängel rörde vid honom två gånger och sade åt honom att äta, ty vägen var för lång för honom, och han fann en kaka bakad på glöden och ett krus vatten vid sin huvudgärd."
      nb: "Da Jesabel sverget å ta livet hans, flyktet Elia for å berge livet til Beer-Sjeba i Juda, i utkanten av Negev, og lot tjeneren sin bli igjen der. Han gikk videre en dagsreise ut i ørkenen, satte seg under en gyvelbusk og ba om å få dø. En engel rørte ved ham to ganger og ba ham spise, for veien var for lang for ham, og han fant en kake stekt på glørne og en krukke med vann ved hodet sitt."
      tl: "Nang manumpa si Jezabel na kukunin ang kaniyang buhay, tumakas si Elias dahil sa kaniyang buhay patungong Beer-seba sa Juda, sa gilid ng Negeb, at iniwan doon ang kaniyang lingkod. Nagpatuloy siya ng isang araw na paglalakbay sa ilang, umupo sa ilalim ng isang punong enebro at humiling na mamatay. Kinalabit siya ng isang anghel nang makalawa at sinabihang kumain, sapagka't ang paglalakbay ay totoong malayo para sa kaniya, at nakita niya sa kaniyang ulunan ang isang tinapay na niluto sa baga at isang banga ng tubig."
      da: "Da Jezabel svor at tage hans liv, flygtede Elias for at redde sit liv til Beersheba i Juda, i udkanten af Negev, og lod sin tjener blive der. Han gik en dagsrejse videre ud i ørkenen, satte sig under et enebærtræ og bad om at dø. En engel rørte to gange ved ham og sagde, at han skulle spise, for rejsen var for lang for ham, og han fandt en kage bagt på gløder og en krukke vand ved sit hoved."
      sr: "Кад се Језавеља заклела да ће му узети живот, Илија је побегао да спасе живот у Вирсавеју Јудину, на рубу Негева, и тамо оставио свог момка. Отишао је даље у пустињу дан хода, сео под смреку и зажелео да умре. Анђео га је двапут дотакао и рекао му да једе, јер му је пут сувише дуг, и он је нашао крај свог узглавља погачу печену на угљевљу и крчаг воде."
      hu: "Amikor Jézabel megesküdött, hogy elveszi az életét, Illés életét mentve Beérsebába menekült, Júdába, a Negev szélére, és ott hagyta szolgáját. Egynapi járásnyira bement a pusztába, leült egy borókafa alá, és a halálát kérte. Egy angyal kétszer megérintette, és azt mondta neki, hogy egyék, mert az út túl hosszú neki, és a feje mellett parázson sült pogácsát és egy korsó vizet talált."
      fi: "Kun Isebel vannoi ottavansa hänen henkensä, Elia pakeni henkensä edestä Beersebaan Juudaan, Negevin laidalle, ja jätti palvelijansa sinne. Hän meni päivänmatkan erämaahan, istuutui kinsteripensaan juureen ja pyysi saada kuolla. Enkeli kosketti häntä kahdesti ja käski hänen syödä, sillä matka oli hänelle liian pitkä, ja hän löysi päänsä vierestä hiilillä paistetun leivän ja vesiastian."
      vi: "Khi Giê-sa-bên thề lấy mạng sống ông, Ê-li chạy trốn để cứu mạng mình đến Bê-e-Sê-ba thuộc Giu-đa, ở rìa Nê-ghép, và để kẻ tôi tớ mình lại đó. Ông đi tiếp một ngày đường vào đồng vắng, ngồi dưới một cây giếng giêng và xin chết. Một thiên sứ đụng đến ông hai lần và bảo ông ăn, vì đường xa quá cho ông, và ông thấy nơi đầu mình một cái bánh nướng trên than và một bình nước."
      ro: "Când Izabela a jurat să-i ia viața, Ilie a fugit ca să-și scape viața la Beer-Șeba, în Iuda, la marginea Neghevului, și și-a lăsat acolo slujitorul. A mers cale de o zi în pustiu, s-a așezat sub un ienupăr și a cerut să moară. Un înger l-a atins de două ori și i-a spus să mănânce, căci drumul era prea lung pentru el, iar el a găsit lângă capul său o turtă coaptă pe cărbuni și un ulcior cu apă."
      bg: "Когато Йезавел се закле да отнеме живота му, Илия избяга, за да спаси живота си, във Вирсавия в Юда, на края на Негев, и остави там слугата си. Той продължи един ден път в пустинята, седна под една хвойна и поиска да умре. Ангел го докосна два пъти и му каза да яде, защото пътят беше твърде дълъг за него, и той намери до главата си пита, изпечена на въглени, и стомна с вода."
  - place: a9bb03e # Mount Horeb
    ref: 1Kgs.19.8-1Kgs.19.15
    took: { days: 41, ref: 1Kgs.19.4-1Kgs.19.8 }
    note:
      en: "At Horeb, the mount of God, the Lord is not in the wind, the earthquake or the fire; after the fire comes a still small voice."
      ru: "У Хорива, горы Божией, Господь не в ветре, не в землетрясении и не в огне; после огня — веяние тихого ветра."
      uk: "На Хориві, горі Божій, Господа немає ні у вітрі, ні в землетрусі, ні в огні; після вогню приходить тихий, лагідний голос."
      es: "En Horeb, el monte de Dios, el Señor no está en el viento, ni en el terremoto, ni en el fuego; después del fuego viene un silbo apacible y delicado."
      pt: "Em Horebe, o monte de Deus, o Senhor não está no vento, no terremoto nem no fogo; depois do fogo vem uma voz mansa e delicada."
      de: "Am Horeb, dem Berg Gottes, ist der Herr nicht im Wind, nicht im Erdbeben und nicht im Feuer; nach dem Feuer kommt ein stilles, sanftes Sausen."
      fr: "À Horeb, la montagne de Dieu, l’Éternel n’est ni dans le vent, ni dans le tremblement de terre, ni dans le feu ; après le feu vient un murmure doux et léger."
      pl: "Na Horebie, górze Bożej, Pana nie ma w wichrze, w trzęsieniu ziemi ani w ogniu; po ogniu przychodzi głos cichy i łagodny."
      it: "All’Oreb, il monte di Dio, il Signore non è nel vento, nel terremoto né nel fuoco; dopo il fuoco viene un suono dolce e sommesso."
      nl: "Op de Horeb, de berg van God, is de HEER niet in de wind, de aardbeving of het vuur; na het vuur komt een stil, zacht suizen."
      cs: "Na Chorebu, hoře Boží, Hospodin není ve vichru, zemětřesení ani v ohni; po ohni přichází tichý a jemný hlas."
      sv: "Vid Horeb, Guds berg, är Herren inte i vinden, jordbävningen eller elden; efter elden kommer ljudet av en sakta susning."
      nb: "Ved Horeb, Guds fjell, er Herren ikke i vinden, jordskjelvet eller ilden; etter ilden kommer en stille, mild susing."
      tl: "Sa Horeb, ang bundok ng Diyos, wala ang Panginoon sa hangin, sa lindol o sa apoy; pagkatapos ng apoy ay dumating ang isang marahang bulong na tinig."
      da: "På Horeb, Guds bjerg, er Herren ikke i stormen, jordskælvet eller ilden; efter ilden kommer en sagte, stille susen."
      sr: "На Хориву, гори Божјој, Господа нема у ветру, у трусу ни у огњу; после огња долази глас тих и танак."
      hu: "A Hóreben, az Isten hegyén az Úr nincs a szélben, a földindulásban és a tűzben; a tűz után csendes, halk szózat hallatszik."
      fi: "Horebilla, Jumalan vuorella, Herra ei ole tuulessa, maanjäristyksessä eikä tulessa; tulen jälkeen tulee hiljainen tuulen hyminä."
      vi: "Tại Hô-rếp, núi của Đức Chúa Trời, Đức Giê-hô-va không ở trong gió, trong cơn động đất hay trong đám lửa; sau đám lửa có một tiếng êm dịu nhỏ nhẹ."
      ro: "La Horeb, muntele lui Dumnezeu, Domnul nu este în vânt, nici în cutremur, nici în foc; după foc vine un susur blând și subțire."
      bg: "При Хорив, Божията планина, Господ не е във вятъра, в труса или в огъня; след огъня идва тих и тънък глас."
    story:
      en: "Strengthened by that food, Elijah walked forty days and forty nights to Horeb, the mountain of God, and spent the night in a cave. The Lord passed by: a great wind broke the rocks, then came an earthquake, then a fire, but the Lord was not in them; after the fire came a still small voice. Elijah wrapped his face in his cloak and stood at the mouth of the cave, and the Lord sent him back to anoint Hazael king over Syria, Jehu king over Israel and Elisha to be prophet in his place; seven thousand in Israel had not bowed to Baal."
      ru: "Подкрепившись той пищей, Илия шёл сорок дней и сорок ночей до Хорива, горы Божией, и ночевал в пещере. Господь прошёл мимо: сильный ветер сокрушал скалы, затем было землетрясение, затем огонь, но не в них был Господь; после огня было веяние тихого ветра. Илия закрыл лицо милотью и встал у входа в пещеру, и Господь послал его обратно помазать Азаила в царя над Сирией, Ииуя в царя над Израилем и Елисея в пророка вместо себя; семь тысяч в Израиле не преклонили колен перед Ваалом."
      uk: "Підкріпившись тією їжею, Ілля йшов сорок днів і сорок ночей до Хорива, гори Божої, і переночував у печері. Господь проходив: великий вітер кришив скелі, потім був землетрус, потім вогонь, але Господа не було в них; після вогню прийшов тихий, лагідний голос. Ілля закутав обличчя своїм плащем і став біля входу в печеру, і Господь послав його назад помазати Хазаїла на царя над Сирією, Єгу на царя над Ізраїлем і Єлисея на пророка замість себе; сім тисяч в Ізраїлі не схилили колін перед Ваалом."
      es: "Fortalecido con aquella comida, Elías caminó cuarenta días y cuarenta noches hasta Horeb, el monte de Dios, y pasó la noche en una cueva. El Señor pasó: un gran viento rompía las peñas, luego vino un terremoto, luego un fuego, pero el Señor no estaba en ellos; tras el fuego vino un silbo apacible y delicado. Elías se cubrió el rostro con su manto y se puso a la entrada de la cueva, y el Señor lo envió de vuelta a ungir a Hazael como rey de Siria, a Jehú como rey de Israel y a Eliseo como profeta en su lugar; siete mil en Israel no se habían arrodillado ante Baal."
      pt: "Fortalecido por aquela comida, Elias caminhou quarenta dias e quarenta noites até Horebe, o monte de Deus, e passou a noite numa caverna. O Senhor passou: um grande vento quebrava as rochas, depois veio um terremoto, depois um fogo, mas o Senhor não estava neles; depois do fogo veio uma voz mansa e delicada. Elias envolveu o rosto no seu manto e ficou à entrada da caverna, e o Senhor o enviou de volta para ungir Hazael rei da Síria, Jeú rei de Israel e Eliseu profeta em seu lugar; sete mil em Israel não se tinham dobrado a Baal."
      de: "Durch diese Speise gestärkt, ging Elia vierzig Tage und vierzig Nächte bis zum Horeb, dem Berg Gottes, und übernachtete in einer Höhle. Der Herr ging vorüber: Ein großer Wind zerbrach die Felsen, dann kam ein Erdbeben, dann ein Feuer, doch der Herr war nicht darin; nach dem Feuer kam ein stilles, sanftes Sausen. Elia verhüllte sein Gesicht mit seinem Mantel und trat an den Eingang der Höhle, und der Herr sandte ihn zurück, um Hasaël zum König über Syrien, Jehu zum König über Israel und Elisa zum Propheten an seiner Statt zu salben; siebentausend in Israel hatten sich nicht vor Baal gebeugt."
      fr: "Fortifié par cette nourriture, Élie marcha quarante jours et quarante nuits jusqu’à Horeb, la montagne de Dieu, et passa la nuit dans une caverne. L’Éternel passa : un grand vent brisa les rochers, puis vint un tremblement de terre, puis un feu, mais l’Éternel n’y était pas ; après le feu vint un murmure doux et léger. Élie s’enveloppa le visage de son manteau et se tint à l’entrée de la caverne, et l’Éternel le renvoya oindre Hazaël pour roi de Syrie, Jéhu pour roi d’Israël et Élisée pour prophète à sa place ; sept mille hommes en Israël n’avaient pas fléchi le genou devant Baal."
      pl: "Wzmocniony tym pokarmem, Eliasz szedł czterdzieści dni i czterdzieści nocy do Horebu, góry Bożej, i spędził noc w jaskini. Pan przeszedł obok: wielki wicher kruszył skały, potem przyszło trzęsienie ziemi, potem ogień, lecz Pana w nich nie było; po ogniu przyszedł głos cichy i łagodny. Eliasz zakrył twarz płaszczem i stanął u wejścia do jaskini, a Pan posłał go z powrotem, by namaścił Chazaela na króla Syrii, Jehu na króla Izraela i Elizeusza na proroka w swoje miejsce; siedem tysięcy w Izraelu nie zgięło kolan przed Baalem."
      it: "Rinvigorito da quel cibo, Elia camminò quaranta giorni e quaranta notti fino all’Oreb, il monte di Dio, e passò la notte in una caverna. Il Signore passò: un grande vento spezzò le rocce, poi venne un terremoto, poi un fuoco, ma il Signore non era in essi; dopo il fuoco venne un suono dolce e sommesso. Elia si coprì il volto con il mantello e si fermò all’ingresso della caverna, e il Signore lo rimandò a ungere Cazaèl re di Siria, Ieu re d’Israele ed Eliseo profeta al suo posto; settemila in Israele non si erano piegati davanti a Baal."
      nl: "Gesterkt door dat voedsel liep Elia veertig dagen en veertig nachten naar de Horeb, de berg van God, en bracht de nacht door in een spelonk. De HEER ging voorbij: een grote wind brak de rotsen, daarna kwam een aardbeving, daarna een vuur, maar de HEER was er niet in; na het vuur kwam een stil, zacht suizen. Elia bedekte zijn gezicht met zijn mantel en ging bij de ingang van de spelonk staan, en de HEER zond hem terug om Hazaël tot koning over Syrië te zalven, Jehu tot koning over Israël en Elisa tot profeet in zijn plaats; zevenduizend in Israël hadden zich niet voor Baäl gebogen."
      cs: "Posílen tím pokrmem šel Elijáš čtyřicet dní a čtyřicet nocí na Choreb, horu Boží, a přenocoval v jeskyni. Hospodin šel kolem: veliký vichr lámal skály, pak přišlo zemětřesení, pak oheň, ale Hospodin v nich nebyl; po ohni přišel tichý a jemný hlas. Elijáš si zahalil tvář pláštěm a postavil se u vchodu do jeskyně, a Hospodin ho poslal zpět, aby pomazal Chazaela za krále nad Sýrií, Jehúa za krále nad Izraelem a Elíšu za proroka místo sebe; sedm tisíc v Izraeli nesklonilo koleno před Baalem."
      sv: "Styrkt av den maten gick Elia i fyrtio dagar och fyrtio nätter till Horeb, Guds berg, och övernattade i en grotta. Herren gick förbi: en stor vind bröt sönder klipporna, sedan kom en jordbävning, sedan en eld, men Herren var inte i dem; efter elden kom ljudet av en sakta susning. Elia svepte in sitt ansikte i manteln och ställde sig vid ingången till grottan, och Herren sände honom tillbaka för att smörja Hasael till kung över Aram, Jehu till kung över Israel och Elisha till profet i hans ställe; sju tusen i Israel hade inte böjt knä för Baal."
      nb: "Styrket av den maten gikk Elia i førti dager og førti netter til Horeb, Guds berg, og overnattet i en hule. Herren gikk forbi: en sterk vind knuste klippene, så kom et jordskjelv, så en ild, men Herren var ikke i dem; etter ilden kom lyden av en stille susen. Elia svøpte ansiktet i kappen og stilte seg ved inngangen til hulen, og Herren sendte ham tilbake for å salve Hasael til konge over Syria, Jehu til konge over Israel og Elisja til profet i hans sted; sju tusen i Israel hadde ikke bøyd kne for Baal."
      tl: "Sa lakas ng pagkaing yaon ay naglakad si Elias nang apatnapung araw at apatnapung gabi hanggang Horeb, ang bundok ng Diyos, at nagpalipas ng gabi sa isang yungib. Nagdaan ang Panginoon: pinagputol-putol ng isang malakas na hangin ang mga bato, pagkatapos ay dumating ang isang lindol, pagkatapos ay isang apoy, ngunit ang Panginoon ay wala sa mga iyon; pagkatapos ng apoy ay dumating ang isang marahang bulong na tinig. Tinakpan ni Elias ang kaniyang mukha ng kaniyang balabal at tumayo sa pasukan ng yungib, at pinabalik siya ng Panginoon upang pahiran ng langis si Hazael na maging hari sa Siria, si Jehu na maging hari sa Israel at si Eliseo na maging propeta na kahalili niya; pitong libo sa Israel ang hindi lumuhod kay Baal."
      da: "Styrket af den mad gik Elias fyrretyve dage og fyrretyve nætter til Horeb, Guds bjerg, og overnattede i en hule. Herren gik forbi: en stærk storm sønderbrød klipperne, så kom et jordskælv, så en ild, men Herren var ikke i dem; efter ilden kom en sagte, stille susen. Elias svøbte sit ansigt i sin kappe og stillede sig ved indgangen til hulen, og Herren sendte ham tilbage for at salve Hazael til konge over Syrien, Jehu til konge over Israel og Elisa til profet i hans sted; syv tusind i Israel havde ikke bøjet sig for Ba'al."
      sr: "Окрепљен оним јелом, Илија је ишао четрдесет дана и четрдесет ноћи до Хорива, горе Божје, и заноћио у једној пећини. Господ је прошао: велики ветар ломио је стене, затим је дошао труз, затим огањ, али Господ није био у њима; после огња дошао је глас тих и танак. Илија је заклонио лице плаштом и стао на улаз пећине, а Господ га је послао натраг да помаже Азаила за цара над Сиријом, Јуја за цара над Израиљем и Јелисија за пророка место себе; седам хиљада у Израиљу није савило колена пред Валом."
      hu: "Annak az ételnek az erejével Illés negyven nap és negyven éjjel ment a Hórebig, az Isten hegyéig, és egy barlangban töltötte az éjszakát. Az Úr elvonult előtte: nagy szél sziklákat tört, aztán földindulás jött, aztán tűz, de az Úr nem volt bennük; a tűz után csendes, halk hang következett. Illés palástjába burkolta arcát, és a barlang bejáratához állt, az Úr pedig visszaküldte, hogy kenje fel Házaelt Szíria királyává, Jéhut Izráel királyává, Elizeust pedig prófétává a maga helyére; Izráelben hétezren voltak, akik nem hajoltak meg Baál előtt."
      fi: "Sen ruuan voimalla Elia kulki neljäkymmentä päivää ja neljäkymmentä yötä Horebille, Jumalan vuorelle, ja vietti yön luolassa. Herra kulki ohi: suuri tuuli murskasi kallioita, sitten tuli maanjäristys, sitten tuli, mutta Herra ei ollut niissä; tulen jälkeen tuli hiljainen tuulen hyminä. Elia kätki kasvonsa vaippaansa ja asettui luolan suulle, ja Herra lähetti hänet takaisin voitelemaan Hasaelin Syyrian kuninkaaksi, Jehun Israelin kuninkaaksi ja Elisan profeetaksi hänen sijaansa; Israelissa oli seitsemäntuhatta, jotka eivät olleet notkistaneet polveaan Baalille."
      vi: "Nhờ sức của lương thực ấy, Ê-li đi bốn mươi ngày và bốn mươi đêm đến Hô-rếp, núi của Đức Chúa Trời, và ngủ đêm trong một hang đá. Đức Giê-hô-va đi ngang qua: một ngọn gió lớn làm tan nát các hòn đá, rồi đến cơn động đất, rồi đến đám lửa, nhưng không có Đức Giê-hô-va trong các điều ấy; sau đám lửa có một tiếng êm dịu nhỏ nhẹ. Ê-li lấy áo tơi bao mặt mình và đứng nơi miệng hang, và Đức Giê-hô-va sai ông trở về xức dầu cho Ha-xa-ên làm vua Sy-ri, Giê-hu làm vua Y-sơ-ra-ên và Ê-li-sê làm tiên tri thế cho ông; trong Y-sơ-ra-ên có bảy ngàn người chưa quỳ gối trước Ba-anh."
      ro: "Întărit de hrana aceea, Ilie a mers patruzeci de zile și patruzeci de nopți până la Horeb, muntele lui Dumnezeu, și a petrecut noaptea într-o peșteră. Domnul a trecut: un vânt mare a sfărâmat stâncile, apoi a venit un cutremur, apoi un foc, dar Domnul nu era în ele; după foc a venit un susur blând și subțire. Ilie și-a acoperit fața cu mantaua și a stat la intrarea peșterii, iar Domnul l-a trimis înapoi să-l ungă pe Hazael rege peste Siria, pe Iehu rege peste Israel și pe Elisei profet în locul său; șapte mii în Israel nu se plecaseră înaintea lui Baal."
      bg: "Укрепен от тази храна, Илия вървя четиридесет дни и четиридесет нощи до Хорив, Божията планина, и пренощува в една пещера. Господ мина: голям вятър разбиваше скалите, после дойде трус, после огън, но Господ не беше в тях; след огъня дойде тих и тънък глас. Илия покри лицето си с наметалото си и застана при входа на пещерата, а Господ го изпрати обратно да помаже Азаил за цар над Сирия, Ииуй за цар над Израил и Елисей за пророк вместо себе си; седем хиляди в Израил не бяха се поклонили на Ваал."
  - place: a5a1bdd # Abel-meholah
    ref: 1Kgs.19.16-1Kgs.19.21
    note:
      en: "Elisha son of Shaphat, of Abel-meholah, is called from the plough to follow Elijah."
      ru: "Елисей, сын Сафатов, из Авел-Мехолы, оставляет плуг и идёт за Илией."
      uk: "Єлисея, сина Шафата, з Авел-Мехоли, закликають від плуга йти за Іллею."
      es: "Eliseo, hijo de Safat, de Abel-mehola, es llamado del arado para seguir a Elías."
      pt: "Eliseu, filho de Safate, de Abel-Meolá, é chamado do arado para seguir Elias."
      de: "Elisa, der Sohn Schafats, aus Abel-Mehola, wird vom Pflügen weg gerufen, um Elia zu folgen."
      fr: "Élisée, fils de Schaphat, d’Abel-Mehola, est appelé de derrière la charrue pour suivre Élie."
      pl: "Elizeusz, syn Szafata, z Abel-Mechola, zostaje powołany od pługa, by pójść za Eliaszem."
      it: "Eliseo, figlio di Safat, di Abel-Mecolà, è chiamato dall’aratro a seguire Elia."
      nl: "Elisa, de zoon van Safat, uit Abel-Mehola, wordt van de ploeg geroepen om Elia te volgen."
      cs: "Elíša, syn Šafatův z Ábel-mecholy, je od pluhu povolán, aby následoval Elijáše."
      sv: "Elisha, Shafats son, från Avel-Mehola, kallas från plogen att följa Elia."
      nb: "Elisja, Sjafats sønn, fra Abel-Mehola, blir kalt fra plogen til å følge Elia."
      tl: "Si Eliseo na anak ni Saphat, na taga-Abelmehola, ay tinawag mula sa pag-aararo upang sumunod kay Elias."
      da: "Elisa, Sjafats søn, fra Abel-Mehola, kaldes fra ploven til at følge Elias."
      sr: "Јелисије син Сафатов, из Авел-Меоле, бива позван од рала да иде за Илијом."
      hu: "Elizeust, Sáfát fiát, az ábel-meholai férfit az eke mellől hívják el, hogy kövesse Illést."
      fi: "Elisa, Safatin poika, Abel-Meholasta, kutsutaan auran takaa seuraamaan Eliaa."
      vi: "Ê-li-sê con trai Sa-phát, người A-bên-Mê-hô-la, được gọi từ chỗ cày ruộng để theo Ê-li."
      ro: "Elisei, fiul lui Șafat, din Abel-Mehola, este chemat de la plug ca să-l urmeze pe Ilie."
      bg: "Елисей, синът на Сафат, от Авел-Мехола, е призован от ралото да последва Илия."
    story:
      en: "Elijah found Elisha son of Shaphat, of Abel-meholah in the Jordan valley, ploughing with twelve yoke of oxen, and threw his cloak over him. Elisha asked leave to kiss his father and mother; then he killed a yoke of oxen, boiled their meat with the gear of the plough, gave it to the people, and followed Elijah as his servant."
      ru: "Илия нашёл Елисея, сына Сафатова, из Авел-Мехолы в долине Иордана, пахавшего на двенадцати парах волов, и бросил на него свою милоть. Елисей попросил позволения поцеловать отца и мать; затем он заколол пару волов, сварил их мясо на дереве плуга, раздал народу и пошёл за Илией, служа ему."
      uk: "Ілля знайшов Єлисея, сина Шафата, з Авел-Мехоли в долині Йордану, коли той орав дванадцятьма парами волів, і накинув на нього свій плащ. Єлисей попросив дозволу поцілувати батька й матір; потім він заколов пару волів, зварив їхнє м’ясо на дереві плуга, роздав людям і пішов за Іллею, служачи йому."
      es: "Elías encontró a Eliseo hijo de Safat, de Abel-mehola, en el valle del Jordán, arando con doce yuntas de bueyes, y echó sobre él su manto. Eliseo le pidió permiso para besar a su padre y a su madre; luego mató una yunta de bueyes, coció su carne con los aperos del arado, la dio al pueblo y siguió a Elías como su servidor."
      pt: "Elias encontrou Eliseu, filho de Safate, de Abel-Meolá, no vale do Jordão, arando com doze juntas de bois, e lançou sobre ele o seu manto. Eliseu pediu licença para beijar o pai e a mãe; depois matou uma junta de bois, cozinhou a carne deles com o equipamento do arado, deu-a ao povo e seguiu Elias como seu servo."
      de: "Elia fand Elisa, den Sohn Schafats, aus Abel-Mehola im Jordantal, wie er mit zwölf Joch Rindern pflügte, und warf seinen Mantel über ihn. Elisa bat, seinen Vater und seine Mutter küssen zu dürfen; dann schlachtete er ein Joch Rinder, kochte ihr Fleisch mit dem Holz des Pfluggeschirrs, gab es dem Volk und folgte Elia als sein Diener."
      fr: "Élie trouva Élisée, fils de Schaphat, d’Abel-Mehola dans la vallée du Jourdain, qui labourait avec douze paires de bœufs, et jeta sur lui son manteau. Élisée demanda la permission d’embrasser son père et sa mère ; puis il tua une paire de bœufs, fit cuire leur chair avec le bois de la charrue, la donna au peuple et suivit Élie pour le servir."
      pl: "Eliasz znalazł Elizeusza, syna Szafata, z Abel-Mechola w dolinie Jordanu, gdy orał dwunastoma parami wołów, i zarzucił na niego swój płaszcz. Elizeusz poprosił, by mógł ucałować ojca i matkę; potem zabił parę wołów, ugotował ich mięso na drewnie z pługa, dał je ludziom i poszedł za Eliaszem jako jego sługa."
      it: "Elia trovò Eliseo, figlio di Safat, di Abel-Mecolà nella valle del Giordano, che arava con dodici paia di buoi, e gli gettò addosso il suo mantello. Eliseo chiese di poter baciare suo padre e sua madre; poi uccise un paio di buoi, ne cosse la carne con la legna dell’aratro, la diede alla gente e seguì Elia mettendosi al suo servizio."
      nl: "Elia vond Elisa, de zoon van Safat, uit Abel-Mehola in het Jordaandal, terwijl hij ploegde met twaalf span runderen, en wierp zijn mantel over hem. Elisa vroeg verlof om zijn vader en moeder te kussen; daarna slachtte hij een span runderen, kookte hun vlees met het hout van het ploegtuig, gaf het aan het volk, en volgde Elia als zijn dienaar."
      cs: "Elijáš nalezl Elíšu, syna Šafatova, z Ábel-mecholy v Jordánském údolí, jak orá s dvanácti spřeženími volů, a hodil na něj svůj plášť. Elíša požádal, aby mohl políbit otce a matku; potom zabil spřežení volů, uvařil jejich maso na dřevě z pluhu, dal je lidem a šel za Elijášem jako jeho služebník."
      sv: "Elia fann Elisha, Shafats son, från Avel-Mehola i Jordandalen, när han plöjde med tolv par oxar, och kastade sin mantel över honom. Elisha bad att få kyssa sin fader och sin moder; sedan slaktade han ett par oxar, kokade köttet med plogens redskap, gav det åt folket och följde Elia som hans tjänare."
      nb: "Elia fant Elisja, Sjafats sønn, fra Abel-Mehola i Jordandalen, mens han pløyde med tolv par okser, og kastet kappen sin over ham. Elisja ba om å få kysse sin far og sin mor; så slaktet han et par okser, kokte kjøttet med plogens redskap, ga det til folket og fulgte Elia som hans tjener."
      tl: "Nasumpungan ni Elias si Eliseo na anak ni Saphat, na taga-Abelmehola sa libis ng Jordan, na nag-aararo na may labindalawang parehang baka, at inihagis sa kaniya ang kaniyang balabal. Humingi si Eliseo ng pahintulot na hagkan ang kaniyang ama at ina; pagkatapos ay pinatay niya ang isang pareha ng baka, inilaga ang laman ng mga yaon sa pamamagitan ng mga kasangkapan ng araro, ibinigay sa bayan, at sumunod kay Elias bilang kaniyang lingkod."
      da: "Elias fandt Elisa, Sjafats søn, fra Abel-Mehola i Jordandalen, mens han pløjede med tolv par okser, og kastede sin kappe over ham. Elisa bad om lov til at kysse sin far og mor; så slagtede han et par okser, kogte kødet med plovens træværk som brænde, gav det til folket og fulgte Elias som hans tjener."
      sr: "Илија је нашао Јелисија, сина Сафатовог, из Авел-Меоле у долини Јордана, где оре с дванаест јармова волова, и бацио на њега свој плашт. Јелисије је замолио да пољуби оца и мајку; затим је заклао јарам волова, скувао њихово месо на дрвима од плуга, дао га народу и пошао за Илијом да му служи."
      hu: "Illés megtalálta Elizeust, Sáfát fiát, a Jordán völgyében fekvő Ábel-Meholából, amint tizenkét pár ökörrel szántott, és ráterítette palástját. Elizeus engedélyt kért, hogy megcsókolhassa apját és anyját; aztán levágott egy pár ökröt, húsukat az eke szerszámaival megfőzte, a népnek adta, és szolgaként követte Illést."
      fi: "Elia tapasi Elisan, Safatin pojan, Abel-Meholasta Jordanin laaksosta, kyntämässä kahdellatoista härkäparilla ja heitti vaippansa hänen päälleen. Elisa pyysi lupaa suudella isäänsä ja äitiään; sitten hän teurasti härkäparin, keitti lihat auran puilla, antoi ne väelle ja seurasi Eliaa hänen palvelijanaan."
      vi: "Ê-li gặp Ê-li-sê con trai Sa-phát, người A-bên-Mê-hô-la trong thung lũng Giô-đanh, đang cày với mười hai đôi bò, và ném áo choàng mình trên người. Ê-li-sê xin phép đi hôn cha mẹ mình; rồi người giết một đôi bò, lấy đồ cày mà nấu thịt chúng, cho dân chúng ăn, và đi theo Ê-li làm kẻ hầu việc ông."
      ro: "Ilie l-a găsit pe Elisei, fiul lui Șafat, din Abel-Mehola, în valea Iordanului, arând cu douăsprezece perechi de boi, și și-a aruncat mantaua peste el. Elisei a cerut îngăduința să-și sărute tatăl și mama; apoi a înjunghiat o pereche de boi, le-a fiert carnea cu uneltele plugului, a dat-o oamenilor și l-a urmat pe Ilie ca slujitor al lui."
      bg: "Илия намери Елисей, сина на Сафат, от Авел-Мехола в долината на Йордан, да оре с дванадесет чифта волове и хвърли наметалото си върху него. Елисей поиска позволение да целуне баща си и майка си; после закла един чифт волове, сготви месото им на дървата на ралото, даде го на народа и тръгна след Илия като негов слуга."
  - place: ae0bf4a # Jezreel
    ref: 1Kgs.21.1-1Kgs.21.24
    note:
      en: "Naboth's vineyard in Jezreel: Elijah pronounces judgement on Ahab and Jezebel."
      ru: "Виноградник Навуфея в Изрееле: Илия возвещает суд Ахаву и Иезавели."
      uk: "Виноградник Навуфея в Їзреелі: Ілля виголошує вирок Ахавові й Єзавелі."
      es: "La viña de Nabot en Jezreel: Elías pronuncia sentencia contra Acab y Jezabel."
      pt: "A vinha de Nabote em Jezreel: Elias pronuncia juízo sobre Acabe e Jezabel."
      de: "Nabots Weinberg in Jesreel: Elia spricht das Gericht über Ahab und Isebel aus."
      fr: "La vigne de Naboth à Jizreel : Élie prononce le jugement sur Achab et Jézabel."
      pl: "Winnica Nabota w Jizreel: Eliasz ogłasza wyrok na Achaba i Izebel."
      it: "La vigna di Nabot a Izreel: Elia pronuncia il giudizio su Acab e Gezabele."
      nl: "De wijngaard van Nabot in Jizreël: Elia spreekt het oordeel uit over Achab en Izebel."
      cs: "Nábotův vinohrad v Jizreelu: Elijáš vyslovuje soud nad Achabem a Jezábel."
      sv: "Navots vingård i Jisreel: Elia uttalar dom över Achav och Isebel."
      nb: "Nabots vingård i Jisreel: Elia kunngjør dom over Ahab og Jesabel."
      tl: "Ubasan ni Naboth sa Jezreel: ipinahayag ni Elias ang hatol kina Achab at Jezabel."
      da: "Nabots vingård i Jizre'el: Elias udtaler dom over Akab og Jezabel."
      sr: "Навутејев виноград у Језраелу: Илија изриче суд над Ахавом и Језавељом."
      hu: "Nábót szőlője Jezréelben: Illés ítéletet mond Ahábra és Jézabelre."
      fi: "Nabotin viinitarha Jisreelissä: Elia julistaa tuomion Ahabille ja Isebelille."
      vi: "Vườn nho của Na-bốt tại Gít-rê-ên: Ê-li tuyên án trên A-háp và Giê-sa-bên."
      ro: "Via lui Nabot din Izreel: Ilie rostește judecata asupra lui Ahab și a Izabelei."
      bg: "Лозето на Навутей в Изреел: Илия произнася присъда над Ахав и Йезавел."
    story:
      en: "Naboth of Jezreel would not sell Ahab his vineyard next to the king's palace, the inheritance of his fathers. Jezebel wrote letters in Ahab's name, and the elders of the city had Naboth falsely accused of cursing God and the king and stoned. When Ahab went down to take the vineyard, Elijah met him there with the word of the Lord: where dogs had licked Naboth's blood they would lick his, his house would be cut off, and dogs would eat Jezebel by the wall of Jezreel. Ahab tore his clothes and put on sackcloth, and the Lord said the evil would come in his son's days instead."
      ru: "Навуфей Изреелитянин не захотел продать Ахаву свой виноградник подле царского дворца, наследие своих отцов. Иезавель написала письма от имени Ахава, и старейшины города ложно обвинили Навуфея в хуле на Бога и царя и побили его камнями. Когда Ахав пошёл взять виноградник, Илия встретил его там со словом Господним: там, где псы лизали кровь Навуфея, они будут лизать и его кровь, дом его будет истреблён, а Иезавель съедят псы у стены Изрееля. Ахав разодрал свои одежды и возложил на себя вретище, и Господь сказал, что бедствие придёт вместо этого во дни его сына."
      uk: "Навуфей із Їзреелю не захотів продати Ахавові свій виноградник поруч із царським палацом, спадщину своїх батьків. Єзавель написала листи від імені Ахава, і старійшини міста ложно звинуватили Навуфея в тому, що він зневажив Бога й царя, і побили його камінням. Коли Ахав пішов узяти виноградник, Ілля зустрів його там зі словом Господнім: де пси лизали кров Навуфея, там вони лизатимуть і його кров, його дім буде знищено, а Єзавель пожеруть пси біля муру Їзреелю. Ахав роздер свій одяг і вдягнув веретище, і Господь сказав, що лихо прийде натомість за днів його сина."
      es: "Nabot de Jezreel no quiso vender a Acab su viña, contigua al palacio del rey, la heredad de sus padres. Jezabel escribió cartas en nombre de Acab, y los ancianos de la ciudad hicieron que acusaran falsamente a Nabot de haber maldecido a Dios y al rey, y lo apedrearon. Cuando Acab bajó a tomar posesión de la viña, Elías le salió al encuentro allí con la palabra del Señor: donde los perros habían lamido la sangre de Nabot lamerían la suya, su casa sería exterminada y los perros comerían a Jezabel junto al muro de Jezreel. Acab rasgó sus vestidos y se vistió de saco, y el Señor dijo que el mal vendría, en cambio, en los días de su hijo."
      pt: "Nabote, de Jezreel, não quis vender a Acabe a sua vinha, ao lado do palácio do rei, a herança de seus pais. Jezabel escreveu cartas em nome de Acabe, e os anciãos da cidade fizeram com que Nabote fosse falsamente acusado de amaldiçoar a Deus e ao rei, e o apedrejaram. Quando Acabe desceu para tomar posse da vinha, Elias foi ao seu encontro ali com a palavra do Senhor: onde os cães tinham lambido o sangue de Nabote lamberiam o dele, a sua casa seria exterminada e os cães comeriam Jezabel junto à muralha de Jezreel. Acabe rasgou as suas roupas e vestiu pano de saco, e o Senhor disse que o mal viria, em vez disso, nos dias de seu filho."
      de: "Nabot aus Jesreel wollte Ahab seinen Weinberg neben dem Palast des Königs, das Erbe seiner Väter, nicht verkaufen. Isebel schrieb Briefe in Ahabs Namen, und die Ältesten der Stadt ließen Nabot fälschlich beschuldigen, Gott und den König gelästert zu haben, und steinigen. Als Ahab hinabging, um den Weinberg in Besitz zu nehmen, trat ihm Elia dort mit dem Wort des Herrn entgegen: Wo Hunde das Blut Nabots geleckt hatten, würden sie auch seines lecken, sein Haus würde ausgerottet werden, und Hunde würden Isebel an der Mauer von Jesreel fressen. Ahab zerriss seine Kleider und legte einen Sack an, und der Herr sagte, das Unheil werde stattdessen in den Tagen seines Sohnes kommen."
      fr: "Naboth de Jizreel ne voulut pas vendre à Achab sa vigne, voisine du palais du roi, l’héritage de ses pères. Jézabel écrivit des lettres au nom d’Achab, et les anciens de la ville firent accuser faussement Naboth d’avoir maudit Dieu et le roi, et le firent lapider. Quand Achab descendit prendre possession de la vigne, Élie l’y rencontra avec la parole de l’Éternel : là où les chiens avaient léché le sang de Naboth, ils lécheraient le sien, sa maison serait retranchée, et les chiens mangeraient Jézabel près du rempart de Jizreel. Achab déchira ses vêtements et se couvrit d’un sac, et l’Éternel dit que le malheur viendrait plutôt aux jours de son fils."
      pl: "Nabot z Jizreel nie chciał sprzedać Achabowi swojej winnicy obok królewskiego pałacu, dziedzictwa swoich ojców. Izebel napisała listy w imieniu Achaba, a starsi miasta sprawili, że Nabota fałszywie oskarżono o złorzeczenie Bogu i królowi i ukamienowano. Gdy Achab zszedł, by zająć winnicę, spotkał go tam Eliasz ze słowem Pana: gdzie psy lizały krew Nabota, tam będą lizać jego krew, jego dom zostanie wytracony, a psy pożrą Izebel pod murem Jizreel. Achab rozdarł szaty i przywdział wór, a Pan powiedział, że nieszczęście przyjdzie zamiast tego za dni jego syna."
      it: "Nabot di Izreel non volle vendere ad Acab la sua vigna accanto al palazzo del re, l’eredità dei suoi padri. Gezabele scrisse lettere a nome di Acab, e gli anziani della città fecero accusare falsamente Nabot di aver maledetto Dio e il re, e lo fecero lapidare. Quando Acab scese a prendere possesso della vigna, Elia lo incontrò lì con la parola del Signore: dove i cani avevano leccato il sangue di Nabot avrebbero leccato il suo, la sua casa sarebbe stata sterminata, e i cani avrebbero divorato Gezabele sotto le mura di Izreel. Acab si stracciò le vesti e si coprì di sacco, e il Signore disse che la sciagura sarebbe venuta invece ai giorni di suo figlio."
      nl: "Nabot uit Jizreël wilde Achab zijn wijngaard naast het paleis van de koning, het erfdeel van zijn vaderen, niet verkopen. Izebel schreef brieven in de naam van Achab, en de oudsten van de stad lieten Nabot valselijk beschuldigen van het vervloeken van God en de koning en lieten hem stenigen. Toen Achab afging om de wijngaard in bezit te nemen, trad Elia hem daar tegemoet met het woord van de HEER: waar de honden het bloed van Nabot hadden gelikt, zouden zij ook het zijne likken, zijn huis zou worden uitgeroeid, en honden zouden Izebel opeten bij de muur van Jizreël. Achab scheurde zijn kleren en trok een rouwgewaad aan, en de HEER zei dat het onheil in plaats daarvan in de dagen van zijn zoon zou komen."
      cs: "Nábot z Jizreelu nechtěl prodat Achabovi svou vinici vedle královského paláce, dědictví svých otců. Jezábel napsala dopisy jménem Achabovým a starší města dali Nábota křivě obvinit, že zlořečil Bohu i králi, a ukamenovat. Když Achab sestoupil, aby se vinice zmocnil, setkal se tam s ním Elijáš se slovem Hospodinovým: kde psi lízali Nábotovu krev, budou lízat i jeho, jeho dům bude vyhlazen a psi sežerou Jezábel u hradby Jizreelu. Achab roztrhl svá roucha a oblékl si žíněný šat a Hospodin řekl, že zlo místo toho přijde za dnů jeho syna."
      sv: "Navot från Jisreel ville inte sälja sin vingård intill kungens palats till Achav, eftersom den var hans fäders arv. Isebel skrev brev i Achavs namn, och stadens äldste lät falskeligen anklaga Navot för att ha smädat Gud och kungen och stena honom. När Achav gick ned för att ta vingården i besittning mötte Elia honom där med Herrens ord: där hundarna hade slickat Navots blod skulle de slicka hans, hans hus skulle utrotas, och hundarna skulle äta upp Isebel vid Jisreels mur. Achav rev sönder sina kläder och klädde sig i säcktyg, och Herren sade att olyckan i stället skulle komma i hans sons dagar."
      nb: "Nabot fra Jisreel ville ikke selge Ahab vingården sin ved siden av kongens palass, arven etter fedrene hans. Jesabel skrev brev i Ahabs navn, og de eldste i byen lot Nabot bli falskt anklaget for å ha spottet Gud og kongen og steinet. Da Ahab dro ned for å ta vingården, møtte Elia ham der med Herrens ord: der hundene hadde slikket Nabots blod, skulle de slikke hans, huset hans skulle utryddes, og hundene skulle ete Jesabel ved Jisreels mur. Ahab rev klærne sine i stykker og tok på seg sekkestrie, og Herren sa at ulykken i stedet skulle komme i sønnens dager."
      tl: "Ayaw ipagbili ni Naboth na Jezreelita kay Achab ang kaniyang ubasan na katabi ng palasyo ng hari, ang mana ng kaniyang mga magulang. Sumulat si Jezabel ng mga liham sa pangalan ni Achab, at ipinaratangan ng mga matanda ng bayan si Naboth nang walang katotohanan ng pamumusong sa Diyos at sa hari, at binato siya. Nang lumusong si Achab upang angkinin ang ubasan, sinalubong siya roon ni Elias na dala ang salita ng Panginoon: sa dakong pinaghimuran ng mga aso ng dugo ni Naboth ay hihimuran din nila ang kaniya, ihihiwalay ang kaniyang sangbahayan, at lalapain ng mga aso si Jezabel sa tabi ng kuta ng Jezreel. Hinapak ni Achab ang kaniyang mga damit at nagsuot ng kayong magaspang, at sinabi ng Panginoon na sa halip ay darating ang kasamaan sa mga kaarawan ng kaniyang anak."
      da: "Nabot fra Jizre'el ville ikke sælge Akab sin vingård ved siden af kongens palads, sine fædres arv. Jezabel skrev breve i Akabs navn, og byens ældste lod Nabot falsk anklage for at have forbandet Gud og kongen og stene. Da Akab gik ned for at tage vingården, mødte Elias ham der med Herrens ord: hvor hundene havde slikket Nabots blod, skulle de slikke hans, hans hus skulle udryddes, og hundene skulle æde Jezabel ved Jizre'els mur. Akab sønderrev sine klæder og tog sæk på, og Herren sagde, at ulykken i stedet skulle komme i hans søns dage."
      sr: "Навутеј Језраељанин није хтео да прода Ахаву свој виноград поред царског двора, наследство својих отаца. Језавеља је написала писма у Ахавово име, и старешине града дале су да се Навутеј лажно оптужи да је хулио на Бога и на цара и да се засу камењем. Кад је Ахав сишао да узме виноград, Илија га је ту дочекао с речју Господњом: где су пси лизали Навутејеву крв, лизаће и његову, дом ће му бити истребљен, а пси ће изјести Језавељу код зида језраелског. Ахав је раздро хаљине и обукао кострет, и Господ је рекао да ће зло доћи радије за дана његовог сина."
      hu: "A jezréeli Nábót nem akarta eladni Ahábnak a király palotája melletti szőlőjét, atyái örökségét. Jézabel Aháb nevében leveleket írt, a város vénei pedig hamisan megvádoltatták Nábótot, hogy átkozta Istent és a királyt, és megkövezték. Amikor Aháb lement, hogy birtokba vegye a szőlőt, Illés ott találkozott vele az Úr szavával: ahol a kutyák Nábót vérét nyalták, ott az övét is nyalni fogják, házát kiirtják, Jézabelt pedig a kutyák eszik meg Jezréel falánál. Aháb megszaggatta ruháját és zsákot öltött, és az Úr azt mondta, hogy a baj inkább a fia napjaiban jön el."
      fi: "Nabot Jisreelistä ei suostunut myymään Ahabille viinitarhaansa, joka oli kuninkaan palatsin vieressä ja hänen isiensä perintöä. Isebel kirjoitti kirjeitä Ahabin nimissä, ja kaupungin vanhimmat syytättivät Nabotia väärin perustein Jumalan ja kuninkaan kiroamisesta ja kivittivät hänet. Kun Ahab meni ottamaan viinitarhan haltuunsa, Elia kohtasi hänet siellä Herran sanan kanssa: missä koirat olivat nuoleskelleet Nabotin veren, ne nuoleskelisivat hänen verensä, hänen sukunsa hävitettäisiin, ja koirat söisivät Isebelin Jisreelin muurin luona. Ahab repäisi vaatteensa ja pukeutui säkkiin, ja Herra sanoi, että onnettomuus tulisi sen sijaan hänen poikansa päivinä."
      vi: "Na-bốt người Gít-rê-ên không chịu bán cho A-háp vườn nho của mình ở cạnh đền vua, là cơ nghiệp của tổ phụ mình. Giê-sa-bên viết thư nhân danh A-háp, và các trưởng lão trong thành sai người cáo gian Na-bốt đã rủa sả Đức Chúa Trời và vua, rồi ném đá người. Khi A-háp đi xuống chiếm lấy vườn nho, Ê-li gặp vua tại đó với lời của Đức Giê-hô-va: nơi chó đã liếm huyết Na-bốt, chó cũng sẽ liếm huyết của vua, nhà vua sẽ bị diệt, và chó sẽ ăn thịt Giê-sa-bên bên thành lũy Gít-rê-ên. A-háp xé quần áo và mặc bao, và Đức Giê-hô-va phán rằng tai họa sẽ đến trong đời con trai vua thay vào đó."
      ro: "Nabot din Izreel nu voia să-i vândă lui Ahab via sa de lângă palatul regelui, moștenirea părinților săi. Izabela a scris scrisori în numele lui Ahab, iar bătrânii cetății l-au făcut pe Nabot să fie acuzat pe nedrept că l-a blestemat pe Dumnezeu și pe rege, și a fost ucis cu pietre. Când Ahab a coborât să ia via în stăpânire, Ilie l-a întâmpinat acolo cu cuvântul Domnului: unde câinii linseseră sângele lui Nabot, aveau să lingă și sângele lui, casa lui avea să fie stârpită, iar câinii aveau s-o mănânce pe Izabela lângă zidul Izreelului. Ahab și-a sfâșiat hainele și s-a îmbrăcat cu sac, iar Domnul a spus că nenorocirea va veni în schimb în zilele fiului său."
      bg: "Навутей от Изреел не искаше да продаде на Ахав лозето си до царския дворец, наследството на бащите си. Йезавел написа писма от името на Ахав и старейшините на града накараха да обвинят Навутей лъжливо, че е похулил Бога и царя, и той беше убит с камъни. Когато Ахав слезе да завземе лозето, Илия го посрещна там със словото Господне: където кучетата бяха лизали кръвта на Навутей, щяха да лижат и неговата, домът му щеше да бъде изтребен, а кучетата щяха да изядат Йезавел при стената на Изреел. Ахав раздра дрехите си и облече вретище, и Господ каза, че злото ще дойде вместо това в дните на сина му."
  - place: a6399b3 # Gilgal
    ref: 2Kgs.2.1
    year: "850 BC"
    note:
      en: "When the Lord is about to take him up, Elijah sets out from Gilgal with Elisha."
      ru: "Когда Господь готовится вознести Илию, тот выходит с Елисеем из Галгала."
      uk: "Коли Господь має забрати його, Ілля виходить з Гілгала разом з Єлисеєм."
      es: "Cuando el Señor está a punto de llevárselo, Elías sale de Gilgal con Eliseo."
      pt: "Quando o Senhor está para levá-lo, Elias parte de Gilgal com Eliseu."
      de: "Als der Herr Elia aufnehmen will, bricht dieser mit Elisa von Gilgal auf."
      fr: "Au moment où l’Éternel va l’enlever, Élie part de Guilgal avec Élisée."
      pl: "Gdy Pan ma go wziąć do góry, Eliasz wyrusza z Gilgal razem z Elizeuszem."
      it: "Quando il Signore sta per rapirlo in cielo, Elia parte da Gàlgala con Eliseo."
      nl: "Als de HEER Elia wil opnemen, vertrekt hij met Elisa uit Gilgal."
      cs: "Když chce Hospodin Elijáše vzít vzhůru, vychází Elijáš z Gilgalu s Elíšou."
      sv: "När Herren ska ta honom upp bryter Elia upp från Gilgal tillsammans med Elisha."
      nb: "Da Herren er i ferd med å ta ham opp, drar Elia ut fra Gilgal sammen med Elisja."
      tl: "Nang malapit nang isampa ng Panginoon si Elias, umalis siya mula sa Gilgal kasama ni Eliseo."
      da: "Da Herren er ved at tage ham op, drager Elias fra Gilgal sammen med Elisa."
      sr: "Кад Господ хоће да га узме горе, Илија креће из Галгала са Јелисијем."
      hu: "Amikor az Úr fel akarja venni Illést, ő Elizeussal együtt elindul Gilgálból."
      fi: "Kun Herra on ottamaisillaan hänet ylös, Elia lähtee Gilgalista Elisan kanssa."
      vi: "Khi Đức Giê-hô-va sắp cất Ê-li lên, Ê-li cùng Ê-li-sê khởi hành từ Ghinh-ganh."
      ro: "Când Domnul este gata să-l ia la cer, Ilie pornește din Ghilgal împreună cu Elisei."
      bg: "Когато Господ е на път да го възнесе, Илия тръгва от Галгал с Елисей."
    story:
      en: "When the Lord was about to take Elijah up to heaven in a whirlwind, Elijah went with Elisha from Gilgal. Which Gilgal is debated. The text says that from it they went down to Bethel, and some take this to point to a Gilgal in the hill country, such as Jiljiliya north of Bethel, which the map follows; others place it near Jericho, the Gilgal of Joshua."
      ru: "Когда Господь готовился вознести Илию в вихре на небо, Илия вышел с Елисеем из Галгала. О каком Галгале идёт речь, спорят. Текст говорит, что оттуда они спустились в Вефиль, и некоторые видят в этом указание на Галгал в горной стране, например у Джильджилии к северу от Вефиля, чему и следует карта; другие помещают его близ Иерихона, на месте Галгала Иисуса Навина."
      uk: "Коли Господь мав забрати Іллю у вихорі на небо, Ілля вийшов з Єлисеєм з Гілгала. Про який Гілгал ідеться, сперечаються. Текст каже, що звідти вони спустилися до Бет-Елу, і дехто бачить у цьому вказівку на Гілгал у гірському краї, наприклад біля Джильджилії на північ від Бет-Елу, за чим і йде мапа; інші розміщують його поблизу Єрихону, на місці Гілгала Ісуса Навина."
      es: "Cuando el Señor iba a alzar a Elías al cielo en un torbellino, Elías salió con Eliseo de Gilgal. Se discute de qué Gilgal se trata. El texto dice que desde allí bajaron a Betel, y algunos entienden que esto apunta a una Gilgal de la región montañosa, como Jiljiliya, al norte de Betel, que es la que sigue el mapa; otros la sitúan cerca de Jericó, la Gilgal de Josué."
      pt: "Quando o Senhor estava para levar Elias ao céu num redemoinho, Elias partiu de Gilgal com Eliseu. Discute-se de que Gilgal se trata. O texto diz que dali desceram a Betel, e alguns entendem que isso aponta para uma Gilgal na região montanhosa, como Jiljiliya, ao norte de Betel, que é a que o mapa segue; outros a situam perto de Jericó, a Gilgal de Josué."
      de: "Als der Herr Elia im Wirbelsturm in den Himmel aufnehmen wollte, ging Elia mit Elisa von Gilgal fort. Welches Gilgal gemeint ist, ist umstritten. Der Text sagt, dass sie von dort nach Bethel hinabgingen, und manche sehen darin einen Hinweis auf ein Gilgal im Bergland, etwa Dschildschilija nördlich von Bethel, dem die Karte folgt; andere verlegen es in die Nähe von Jericho, das Gilgal Josuas."
      fr: "Quand l’Éternel allait enlever Élie au ciel dans un tourbillon, Élie partit de Guilgal avec Élisée. De quel Guilgal il s’agit est discuté. Le texte dit que de là ils descendirent à Béthel, et certains y voient l’indice d’un Guilgal de la montagne, comme Jiljiliya au nord de Béthel, que suit la carte ; d’autres le placent près de Jéricho, le Guilgal de Josué."
      pl: "Gdy Pan miał wziąć Eliasza do nieba w wichrze, Eliasz wyruszył z Elizeuszem z Gilgal. O które Gilgal chodzi, jest sporne. Tekst mówi, że stamtąd zeszli do Betel, i niektórzy widzą w tym wskazówkę na Gilgal w górach, takie jak Dżildżilija na północ od Betel, za czym idzie mapa; inni umieszczają je koło Jerycha, jako Gilgal Jozuego."
      it: "Quando il Signore stava per rapire Elia in cielo in un turbine, Elia partì da Gàlgala con Eliseo. Di quale Gàlgala si tratti è discusso. Il testo dice che di là scesero a Betel, e alcuni vi vedono l’indizio di una Gàlgala della regione montuosa, come Jiljiliya a nord di Betel, che la mappa segue; altri la pongono presso Gerico, la Gàlgala di Giosuè."
      nl: "Toen de HEER Elia in een stormwind naar de hemel zou opnemen, ging Elia met Elisa uit Gilgal. Welk Gilgal bedoeld is, is omstreden. De tekst zegt dat zij er vandaan naar Bethel afgingen, en sommigen zien daarin een aanwijzing voor een Gilgal in het bergland, zoals Jiljiliya ten noorden van Bethel, dat de kaart volgt; anderen plaatsen het bij Jericho, het Gilgal van Jozua."
      cs: "Když chtěl Hospodin vzít Elijáše ve vichru do nebe, vyšel Elijáš s Elíšou z Gilgalu. O který Gilgal jde, je sporné. Text říká, že odtud sestoupili do Bét-elu, a někteří v tom vidí odkaz na Gilgal v horách, jako je Džildžilíja severně od Bét-elu, čehož se drží mapa; jiní ho kladou nedaleko Jericha, jako Jozuův Gilgal."
      sv: "När Herren skulle ta upp Elia till himlen i en stormvind, gick Elia med Elisha från Gilgal. Vilket Gilgal det gäller är omstritt. Texten säger att de därifrån gick ned till Betel, och somliga ser detta som ett tecken på ett Gilgal i bergslandet, till exempel Jiljiliya norr om Betel, som kartan följer; andra förlägger det nära Jeriko, Josuas Gilgal."
      nb: "Da Herren skulle ta Elia opp til himmelen i en stormvind, gikk Elia sammen med Elisja fra Gilgal. Hvilket Gilgal det er, er omstridt. Teksten sier at de derfra gikk ned til Betel, og noen tar dette som et tegn på et Gilgal i fjellandet, for eksempel Jiljiliya nord for Betel, som kartet følger; andre plasserer det nær Jeriko, Josvas Gilgal."
      tl: "Nang isasampa na ng Panginoon si Elias sa langit sa pamamagitan ng isang ipoipo, yumaon si Elias kasama ni Eliseo mula sa Gilgal. Pinagtatalunan kung aling Gilgal. Sinasabi ng teksto na mula roon ay bumaba sila sa Beth-el, at itinuturing ito ng ilan na tumuturo sa isang Gilgal sa lupaing maburol, gaya ng Jiljiliya sa hilaga ng Beth-el, na sinusunod ng mapa; inilalagay naman ito ng iba malapit sa Jerico, ang Gilgal ni Josue."
      da: "Da Herren ville tage Elias op til himlen i en hvirvelvind, drog Elias med Elisa fra Gilgal. Hvilket Gilgal der er tale om, er omstridt. Teksten siger, at de derfra gik ned til Betel, og nogle ser heri en henvisning til et Gilgal i bjerglandet, som Jiljiliya nord for Betel, som kortet følger; andre placerer det nær Jeriko, Josvas Gilgal."
      sr: "Кад је Господ хтео да узме Илију у вихору на небо, Илија је пошао с Јелисијем из Галгала. Који је то Галгал, спорно је. Текст каже да су оданде сишли у Ветиљ, и неки то схватају као упућивање на Галгал у брдском крају, као што је Џилџилија северно од Ветиља, што карта следи; други га смештају код Јерихона, Галгал Исуса Навина."
      hu: "Amikor az Úr forgószélben fel akarta vinni Illést az égbe, Illés Elizeussal együtt elindult Gilgálból. Hogy melyik Gilgálról van szó, vitatott. A szöveg szerint onnan lementek Bételbe, és egyesek ezt úgy értik, hogy egy hegyvidéki Gilgálra utal, például a Bételtől északra fekvő Dzsildzsilijára, amelyet a térkép követ; mások Jerikó közelébe, Józsué Gilgáljához teszik."
      fi: "Kun Herra oli ottamaisillaan Elian tuulispäässä taivaaseen, Elia lähti Elisan kanssa Gilgalista. Mikä Gilgal on kyseessä, on kiistanalaista. Tekstin mukaan he menivät sieltä alas Beteliin, ja jotkut näkevät tässä viittauksen vuoristossa sijaitsevaan Gilgaliin, kuten Jiljiliyaan Betelin pohjoispuolella, jota kartta noudattaa; toiset sijoittavat sen Jerikon lähelle ja pitävät sitä Joosuan Gilgalina."
      vi: "Khi Đức Giê-hô-va sắp cất Ê-li lên trời trong một cơn gió lốc, Ê-li cùng Ê-li-sê đi ra từ Ghinh-ganh. Ghinh-ganh nào thì còn tranh cãi. Bản văn nói rằng từ đó họ đi xuống Bê-tên, và một số người hiểu điều này là chỉ về một Ghinh-ganh trong miền núi, như Jiljiliya ở phía bắc Bê-tên, mà bản đồ theo; những người khác đặt nó gần Giê-ri-cô, là Ghinh-ganh của Giô-suê."
      ro: "Când Domnul era gata să-l ia pe Ilie la cer într-un vârtej de vânt, Ilie a pornit cu Elisei din Ghilgal. Despre care Ghilgal este vorba se discută. Textul spune că de acolo au coborât la Betel, iar unii înțeleg că aceasta arată spre un Ghilgal din ținutul muntos, precum Jiljiliya, la nord de Betel, pe care îl urmează harta; alții îl așază lângă Ierihon, Ghilgalul lui Iosua."
      bg: "Когато Господ щеше да възнесе Илия на небето с вихрушка, Илия тръгна с Елисей от Галгал. Кой Галгал е това, се спори. Текстът казва, че оттам те слязоха във Ветил, и някои приемат, че това сочи Галгал в планинската област, например Джилджилия на север от Ветил, което картата следва; други го поставят край Йерихон — Галгал на Исус Навин."
  - place: a64f355 # Bethel
    ref: 2Kgs.2.2-2Kgs.2.3
    year: "850 BC"
    note:
      en: "Elisha will not leave him: they go down to Bethel."
      ru: "Елисей не оставляет его: они идут в Вефиль."
      uk: "Єлисей не хоче його залишити: вони сходять до Бет-Елу."
      es: "Eliseo no quiere dejarlo: bajan a Betel."
      pt: "Eliseu não o deixa: descem a Betel."
      de: "Elisa will ihn nicht verlassen: Sie gehen hinab nach Bethel."
      fr: "Élisée ne veut pas le quitter : ils descendent à Béthel."
      pl: "Elizeusz nie chce go opuścić: schodzą do Betel."
      it: "Eliseo non vuole lasciarlo: scendono a Betel."
      nl: "Elisa wil hem niet verlaten: zij gaan af naar Bethel."
      cs: "Elíša ho neopouští: sestupují do Bét-elu."
      sv: "Elisha vill inte lämna honom: de går ner till Betel."
      nb: "Elisja vil ikke forlate ham: de går ned til Betel."
      tl: "Ayaw iwan ni Eliseo si Elias: bumaba sila sa Beth-el."
      da: "Elisa vil ikke forlade ham: de går ned til Betel."
      sr: "Јелисије неће да га остави: силазе у Ветиљ."
      hu: "Elizeus nem hagyja el: lemennek Bételbe."
      fi: "Elisa ei jätä häntä: he menevät alas Beteliin."
      vi: "Ê-li-sê không chịu rời người: hai người đi xuống Bê-tên."
      ro: "Elisei nu vrea să-l părăsească: coboară la Betel."
      bg: "Елисей не го оставя: те слизат във Ветил."
    story:
      en: "Elijah asked Elisha to stay, for the Lord had sent him to Bethel, but Elisha swore that he would not leave him, and they went down to Bethel, on the watershed road north of Jerusalem. The sons of the prophets there asked Elisha whether he knew that the Lord would take his master away that day; he said that he knew, and told them to keep silent."
      ru: "Илия просил Елисея остаться, потому что Господь послал его в Вефиль, но Елисей поклялся, что не оставит его, и они спустились в Вефиль, на дороге по водоразделу к северу от Иерусалима. Тамошние сыны пророков спросили Елисея, знает ли он, что Господь в этот день возьмёт его господина; он ответил, что знает, и велел им молчать."
      uk: "Ілля просив Єлисея залишитися, бо Господь послав його до Бет-Елу, але Єлисей поклявся, що не покине його, і вони спустилися до Бет-Елу, на дорозі вододілом на північ від Єрусалима. Тамтешні сини пророків спитали Єлисея, чи знає він, що Господь цього дня забере його пана; він відповів, що знає, і звелів їм мовчати."
      es: "Elías pidió a Eliseo que se quedara, porque el Señor lo había enviado a Betel, pero Eliseo juró que no lo dejaría, y bajaron a Betel, en el camino de la divisoria de aguas al norte de Jerusalén. Los hijos de los profetas de allí preguntaron a Eliseo si sabía que el Señor se llevaría aquel día a su señor; él respondió que lo sabía y les dijo que callaran."
      pt: "Elias pediu a Eliseu que ficasse, pois o Senhor o tinha enviado a Betel, mas Eliseu jurou que não o deixaria, e desceram a Betel, na estrada do divisor de águas ao norte de Jerusalém. Os filhos dos profetas dali perguntaram a Eliseu se sabia que o Senhor levaria naquele dia o seu mestre; ele disse que sabia e mandou que se calassem."
      de: "Elia bat Elisa zu bleiben, denn der Herr habe ihn nach Bethel gesandt, doch Elisa schwor, ihn nicht zu verlassen, und sie gingen hinab nach Bethel, an der Wasserscheidenstraße nördlich von Jerusalem. Die Prophetenjünger dort fragten Elisa, ob er wisse, dass der Herr seinen Herrn an diesem Tag wegnehmen werde; er sagte, er wisse es, und hieß sie schweigen."
      fr: "Élie demanda à Élisée de rester, car l’Éternel l’envoyait à Béthel, mais Élisée jura qu’il ne le quitterait pas, et ils descendirent à Béthel, sur la route de la ligne de partage des eaux au nord de Jérusalem. Les fils des prophètes qui s’y trouvaient demandèrent à Élisée s’il savait que l’Éternel enlèverait son maître ce jour-là ; il répondit qu’il le savait et leur dit de se taire."
      pl: "Eliasz prosił Elizeusza, by został, bo Pan posłał go do Betel, lecz Elizeusz przysiągł, że go nie opuści, i zeszli do Betel, przy drodze grzbietowej na północ od Jerozolimy. Synowie proroków, którzy tam byli, zapytali Elizeusza, czy wie, że Pan zabierze dziś jego pana; odpowiedział, że wie, i kazał im milczeć."
      it: "Elia chiese a Eliseo di fermarsi, perché il Signore lo mandava a Betel, ma Eliseo giurò che non lo avrebbe lasciato, e scesero a Betel, sulla strada dello spartiacque a nord di Gerusalemme. I figli dei profeti che vi erano chiesero a Eliseo se sapesse che quel giorno il Signore gli avrebbe tolto il suo signore; egli rispose che lo sapeva e disse loro di tacere."
      nl: "Elia vroeg Elisa te blijven, want de HEER had hem naar Bethel gezonden, maar Elisa zwoer dat hij hem niet zou verlaten, en zij gingen af naar Bethel, aan de weg over de waterscheiding ten noorden van Jeruzalem. De profetenzonen daar vroegen Elisa of hij wist dat de HEER zijn meester die dag zou wegnemen; hij zei dat hij het wist, en zei hun te zwijgen."
      cs: "Elijáš prosil Elíšu, aby zůstal, neboť Hospodin ho poslal do Bét-elu, ale Elíša přísahal, že ho neopustí, a sestoupili do Bét-elu, ležícího u cesty po rozvodí severně od Jeruzaléma. Synové proroků, kteří tam byli, se Elíši ptali, zda ví, že Hospodin dnes vezme jeho pána; odpověděl, že ví, a řekl jim, ať mlčí."
      sv: "Elia bad Elisha stanna kvar, ty Herren hade sänt honom till Betel, men Elisha svor att han inte skulle lämna honom, och de gick ned till Betel, vid vattendelarvägen norr om Jerusalem. Profetlärjungarna där frågade Elisha om han visste att Herren skulle ta hans herre ifrån honom den dagen; han svarade att han visste det och bad dem tiga."
      nb: "Elia ba Elisja bli igjen, for Herren hadde sendt ham til Betel, men Elisja sverget at han ikke ville forlate ham, og de gikk ned til Betel, ved vannskilleveien nord for Jerusalem. Profetsønnene der spurte Elisja om han visste at Herren skulle ta hans herre bort den dagen; han svarte at han visste det, og ba dem tie."
      tl: "Namanhik si Elias kay Eliseo na maghintay, sapagka't sinugo siya ng Panginoon sa Beth-el, ngunit sumumpa si Eliseo na hindi niya siya iiwan, at bumaba sila sa Beth-el, sa daan sa tagaytay ng hatian ng tubig sa hilaga ng Jerusalem. Tinanong si Eliseo ng mga anak ng mga propeta roon kung talastas niya na kukunin ng Panginoon ang kaniyang panginoon sa araw na iyon; sinabi niyang talastas niya, at pinatahimik sila."
      da: "Elias bad Elisa blive, for Herren havde sendt ham til Betel, men Elisa svor, at han ikke ville forlade ham, og de gik ned til Betel ved vandskelsvejen nord for Jerusalem. Profeternes sønner dér spurgte Elisa, om han vidste, at Herren den dag ville tage hans herre bort; han sagde, at han vidste det, og bad dem tie."
      sr: "Илија је замолио Јелисија да остане, јер га Господ шаље у Ветиљ, али Јелисије се заклео да га неће оставити, и сишли су у Ветиљ, на путу по развођу северно од Јерусалима. Синови пророчки који су тамо били питали су Јелисија зна ли да ће Господ тог дана узети његовог господара; рекао је да зна и казао им да ћуте."
      hu: "Illés kérte Elizeust, hogy maradjon, mert az Úr Bételbe küldte, de Elizeus megesküdött, hogy nem hagyja el, és lementek Bételbe, a Jeruzsálemtől északra futó vízválasztó út mentén. Az ottani próféták fiai megkérdezték Elizeust, tudja-e, hogy az Úr aznap elveszi tőle urát; ő azt mondta, hogy tudja, és hallgatásra intette őket."
      fi: "Elia pyysi Elisaa jäämään, sillä Herra oli lähettänyt hänet Beteliin, mutta Elisa vannoi, ettei jättäisi häntä, ja he menivät alas Beteliin, vedenjakajaa seuraavan tien varrelle Jerusalemin pohjoispuolelle. Siellä olevat profeetanoppilaat kysyivät Elisalta, tiesikö hän, että Herra ottaisi hänen herransa pois sinä päivänä; hän sanoi tietävänsä ja käski heidän olla vaiti."
      vi: "Ê-li xin Ê-li-sê ở lại, vì Đức Giê-hô-va sai ông đến Bê-tên, nhưng Ê-li-sê thề rằng sẽ chẳng lìa ông, và hai người đi xuống Bê-tên, trên con đường dọc đường phân thủy phía bắc Giê-ru-sa-lem. Các môn đồ của những tiên tri ở đó hỏi Ê-li-sê có biết rằng ngày nay Đức Giê-hô-va sẽ cất thầy mình đi chăng; người đáp rằng người biết, và bảo họ hãy làm thinh."
      ro: "Ilie l-a rugat pe Elisei să rămână, pentru că Domnul îl trimitea la Betel, dar Elisei a jurat că nu-l va părăsi, și au coborât la Betel, pe drumul de pe cumpăna apelor, la nord de Ierusalim. Fiii profeților de acolo l-au întrebat pe Elisei dacă știe că Domnul îi va lua în ziua aceea stăpânul; el a spus că știe și le-a cerut să tacă."
      bg: "Илия помоли Елисей да остане, защото Господ го пращал във Ветил, но Елисей се закле, че няма да го остави, и те слязоха във Ветил, на пътя по вододела на север от Йерусалим. Пророческите синове там попитаха Елисей знае ли, че Господ ще вземе господаря му този ден; той каза, че знае, и им каза да мълчат."
  - place: a231f80 # Jericho
    ref: 2Kgs.2.4-2Kgs.2.5
    year: "850 BC"
    note:
      en: "Then to Jericho, where the sons of the prophets come to Elisha."
      ru: "Затем в Иерихон, где к Елисею подходят сыны пророков."
      uk: "Потім до Єрихону, де до Єлисея приходять сини пророків."
      es: "Luego a Jericó, donde los hijos de los profetas se acercan a Eliseo."
      pt: "Depois a Jericó, onde os filhos dos profetas vão até Eliseu."
      de: "Dann nach Jericho, wo die Prophetenjünger zu Elisa kommen."
      fr: "Puis à Jéricho, où les fils des prophètes viennent trouver Élisée."
      pl: "Potem do Jerycha, gdzie synowie proroków przychodzą do Elizeusza."
      it: "Poi a Gerico, dove i figli dei profeti vengono da Eliseo."
      nl: "Dan naar Jericho, waar de profetenzonen naar Elisa toe komen."
      cs: "Potom do Jericha, kde přicházejí k Elíšovi synové proroků."
      sv: "Sedan till Jeriko, där profetlärjungarna kommer till Elisha."
      nb: "Så til Jeriko, hvor profetsønnene kommer til Elisja."
      tl: "Pagkatapos ay sa Jerico, kung saan lumalapit kay Eliseo ang mga anak ng mga propeta."
      da: "Så til Jeriko, hvor profeternes sønner kommer hen til Elisa."
      sr: "Затим у Јерихон, где синови пророчки долазе к Јелисију."
      hu: "Azután Jerikóba, ahol a próféták fiai Elizeushoz jönnek."
      fi: "Sitten Jerikoon, jossa profeetanoppilaat tulevat Elisan luo."
      vi: "Rồi đến Giê-ri-cô, nơi các môn đồ của những tiên tri đến cùng Ê-li-sê."
      ro: "Apoi la Ierihon, unde fiii profeților vin la Elisei."
      bg: "После в Йерихон, където пророческите синове идват при Елисей."
    story:
      en: "Again Elijah asked him to stay, for the Lord had sent him to Jericho, the oasis town of the Jordan valley, and again Elisha would not leave him. At Jericho the sons of the prophets told Elisha the same, and he gave the same answer."
      ru: "Снова Илия просил его остаться, потому что Господь послал его в Иерихон, город-оазис в долине Иордана, и снова Елисей не оставил его. В Иерихоне сыны пророков сказали Елисею то же самое, и он дал тот же ответ."
      uk: "Знову Ілля просив його залишитися, бо Господь послав його до Єрихону, міста-оазису в долині Йордану, і знову Єлисей не покинув його. В Єрихоні сини пророків сказали Єлисеєві те саме, і він дав ту саму відповідь."
      es: "De nuevo Elías le pidió que se quedara, porque el Señor lo había enviado a Jericó, la ciudad oasis del valle del Jordán, y de nuevo Eliseo no quiso dejarlo. En Jericó los hijos de los profetas dijeron a Eliseo lo mismo, y él dio la misma respuesta."
      pt: "De novo Elias lhe pediu que ficasse, pois o Senhor o tinha enviado a Jericó, a cidade-oásis do vale do Jordão, e de novo Eliseu não o deixou. Em Jericó os filhos dos profetas disseram o mesmo a Eliseu, e ele deu a mesma resposta."
      de: "Wieder bat Elia ihn zu bleiben, denn der Herr habe ihn nach Jericho gesandt, der Oasenstadt im Jordantal, und wieder wollte Elisa ihn nicht verlassen. In Jericho sagten die Prophetenjünger Elisa dasselbe, und er gab dieselbe Antwort."
      fr: "De nouveau Élie lui demanda de rester, car l’Éternel l’envoyait à Jéricho, la ville-oasis de la vallée du Jourdain, et de nouveau Élisée refusa de le quitter. À Jéricho, les fils des prophètes dirent la même chose à Élisée, et il fit la même réponse."
      pl: "Znowu Eliasz prosił go, by został, bo Pan posłał go do Jerycha, miasta-oazy w dolinie Jordanu, i znowu Elizeusz nie chciał go opuścić. W Jerychu synowie proroków powiedzieli Elizeuszowi to samo, a on dał tę samą odpowiedź."
      it: "Di nuovo Elia gli chiese di fermarsi, perché il Signore lo mandava a Gerico, la città oasi della valle del Giordano, e di nuovo Eliseo non volle lasciarlo. A Gerico i figli dei profeti dissero a Eliseo la stessa cosa, ed egli diede la stessa risposta."
      nl: "Opnieuw vroeg Elia hem te blijven, want de HEER had hem naar Jericho gezonden, de oasestad in het Jordaandal, en opnieuw wilde Elisa hem niet verlaten. Te Jericho zeiden de profetenzonen hetzelfde tegen Elisa, en hij gaf hetzelfde antwoord."
      cs: "Znovu ho Elijáš prosil, aby zůstal, neboť Hospodin ho poslal do Jericha, oázového města v Jordánském údolí, a znovu ho Elíša nechtěl opustit. V Jerichu řekli synové proroků Elíšovi totéž a on dal stejnou odpověď."
      sv: "Åter bad Elia honom stanna, ty Herren hade sänt honom till Jeriko, oasstaden i Jordandalen, och åter ville Elisha inte lämna honom. I Jeriko sade profetlärjungarna samma sak till Elisha, och han gav samma svar."
      nb: "Igjen ba Elia ham bli igjen, for Herren hadde sendt ham til Jeriko, oasebyen i Jordandalen, og igjen ville Elisja ikke forlate ham. I Jeriko sa profetsønnene det samme til Elisja, og han ga det samme svaret."
      tl: "Muling namanhik si Elias na maghintay siya, sapagka't sinugo siya ng Panginoon sa Jerico, ang bayang-oasis ng libis ng Jordan, at muling ayaw siyang iwan ni Eliseo. Sa Jerico ay gayon din ang sinabi kay Eliseo ng mga anak ng mga propeta, at gayon din ang kaniyang sagot."
      da: "Igen bad Elias ham blive, for Herren havde sendt ham til Jeriko, oasebyen i Jordandalen, og igen ville Elisa ikke forlade ham. I Jeriko sagde profeternes sønner det samme til Elisa, og han gav det samme svar."
      sr: "Опет га је Илија замолио да остане, јер га Господ шаље у Јерихон, оазу у долини Јордана, и опет га Јелисије није хтео оставити. У Јерихону синови пророчки рекли су Јелисију исто, и он им је дао исти одговор."
      hu: "Illés ismét kérte, hogy maradjon, mert az Úr Jerikóba küldte, a Jordán-völgy oázisvárosába, és Elizeus ismét nem hagyta el. Jerikóban a próféták fiai ugyanazt mondták Elizeusnak, és ő ugyanazt felelte."
      fi: "Jälleen Elia pyysi häntä jäämään, sillä Herra oli lähettänyt hänet Jerikoon, Jordanin laakson keidaskaupunkiin, ja jälleen Elisa kieltäytyi jättämästä häntä. Jerikossa profeetanoppilaat sanoivat Elisalle saman, ja hän antoi saman vastauksen."
      vi: "Ê-li lại xin người ở lại, vì Đức Giê-hô-va sai ông đến Giê-ri-cô, thành ốc đảo của thung lũng Giô-đanh, và Ê-li-sê lại không chịu lìa ông. Tại Giê-ri-cô, các môn đồ của những tiên tri cũng nói với Ê-li-sê như vậy, và người cũng đáp như trước."
      ro: "Din nou Ilie l-a rugat să rămână, pentru că Domnul îl trimitea la Ierihon, cetatea-oază din valea Iordanului, și din nou Elisei nu l-a părăsit. La Ierihon, fiii profeților i-au spus lui Elisei același lucru, iar el le-a dat același răspuns."
      bg: "Илия отново го помоли да остане, защото Господ го пращал в Йерихон, оазисния град в долината на Йордан, и отново Елисей не го остави. В Йерихон пророческите синове казаха на Елисей същото и той им даде същия отговор."
  - place: ae686c9 # Jordan
    ref: 2Kgs.2.6-2Kgs.2.14
    year: "850 BC"
    note:
      en: "Elijah parts the Jordan with his cloak; a chariot of fire separates the two; Elijah goes up in a whirlwind into heaven, and Elisha takes up his cloak."
      ru: "Илия разделяет милотью воды Иордана; колесница огненная разлучает их: Илия возносится в вихре на небо, а Елисей поднимает его милоть."
      uk: "Ілля розділяє Йордан своїм плащем; вогняна колісниця розлучає їх обох; Ілля підноситься у вихорі на небо, а Єлисей підіймає його плащ."
      es: "Elías divide el Jordán con su manto; un carro de fuego separa a los dos; Elías sube al cielo en un torbellino, y Eliseo recoge su manto."
      pt: "Elias divide o Jordão com o seu manto; um carro de fogo separa os dois; Elias sobe num redemoinho ao céu, e Eliseu toma o manto dele."
      de: "Elia teilt den Jordan mit seinem Mantel; ein feuriger Wagen trennt die beiden; Elia fährt in einem Wirbelsturm in den Himmel auf, und Elisa hebt seinen Mantel auf."
      fr: "Élie divise le Jourdain avec son manteau ; un char de feu les sépare ; Élie monte au ciel dans un tourbillon, et Élisée ramasse son manteau."
      pl: "Eliasz rozdziela Jordan swoim płaszczem; rydwan ognisty rozdziela obu; Eliasz wstępuje w wichrze do nieba, a Elizeusz podnosi jego płaszcz."
      it: "Elia divide il Giordano con il suo mantello; un carro di fuoco separa i due; Elia sale al cielo in un turbine, ed Eliseo raccoglie il suo mantello."
      nl: "Elia splijt de Jordaan met zijn mantel; een wagen van vuur scheidt de twee; Elia stijgt in een wervelwind op naar de hemel, en Elisa raapt zijn mantel op."
      cs: "Elijáš rozdělí Jordán svým pláštěm; ohnivý vůz je od sebe odloučí; Elijáš vystupuje ve vichru do nebe a Elíša zvedá jeho plášť."
      sv: "Elia delar Jordan med sin mantel; en eldvagn skiljer de två åt; Elia far upp i en stormvind till himlen, och Elisha tar upp hans mantel."
      nb: "Elia deler Jordan med kappen sin; en ildvogn skiller de to; Elia farer opp til himmelen i en stormvind, og Elisja tar opp kappen hans."
      tl: "Hinahati ni Elias ang Jordan sa pamamagitan ng kaniyang balabal; isang karong apoy ang naghihiwalay sa dalawa; sumasampa si Elias sa langit sa isang ipoipo, at kinukuha ni Eliseo ang kaniyang balabal."
      da: "Elias deler Jordan med sin kappe; en ildvogn skiller de to ad; Elias farer op i en hvirvelvind til himlen, og Elisa tager hans kappe op."
      sr: "Илија плаштем раздваја Јордан; кола огњена раздвајају њих двојицу; Илија одлази у вихору на небо, а Јелисије узима његов плашт."
      hu: "Illés köntösével kettéválasztja a Jordánt; tüzes szekér választja el egymástól a két férfit; Illés forgószélben felmegy az égbe, Elizeus pedig felveszi a köntösét."
      fi: "Elia jakaa Jordanin vedet vaipallaan; tulinen vaunu erottaa heidät toisistaan; Elia nousee tuulispäässä taivaaseen, ja Elisa ottaa hänen vaippansa."
      vi: "Ê-li lấy áo tơi đánh sông Giô-đanh cho rẽ ra; một cái xe lửa phân rẽ hai người; Ê-li lên trời trong một cơn gió lốc, và Ê-li-sê lượm lấy áo tơi của người."
      ro: "Ilie desparte apele Iordanului cu mantaua sa; un car de foc îi desparte pe cei doi; Ilie se înalță la cer într-un vârtej de vânt, iar Elisei îi ridică mantaua."
      bg: "Илия разделя Йордан с наметалото си; огнена колесница разделя двамата; Илия се възнася с вихрушка на небето, а Елисей вдига наметалото му."
    story:
      en: "A third time Elijah asked him to stay, for the Lord had sent him to the Jordan, and they went on together while fifty of the sons of the prophets watched from a distance. Elijah rolled up his cloak and struck the water; it divided, and the two crossed on dry ground. Elisha asked for a double portion of his spirit, and Elijah said it would be his if he saw him taken. As they walked and talked, a chariot of fire and horses of fire parted them, and Elijah went up by a whirlwind into heaven. Elisha cried, My father, my father, the chariot of Israel and its horsemen, tore his clothes, took up Elijah's cloak, struck the Jordan with it, and the water parted for him too."
      ru: "В третий раз Илия просил его остаться, потому что Господь послал его к Иордану, и они пошли дальше вместе, а пятьдесят сынов пророков смотрели издали. Илия свернул свою милоть и ударил по воде; она расступилась, и оба перешли по суше. Елисей попросил двойной доли его духа, и Илия сказал, что так будет, если тот увидит, как он будет взят. Когда они шли и разговаривали, колесница огненная и кони огненные разлучили их, и Илия вознёсся в вихре на небо. Елисей воскликнул: отец мой, отец мой, колесница Израиля и конница его, — разодрал свои одежды, поднял милоть Илии, ударил ею по Иордану, и вода расступилась и перед ним."
      uk: "Утретє Ілля просив його залишитися, бо Господь послав його до Йордану, і вони пішли далі разом, а п’ятдесят синів пророків дивилися здалеку. Ілля згорнув свій плащ і вдарив по воді; вона розступилася, і обидва перейшли по сухому. Єлисей попросив подвійної частки його духа, і Ілля сказав, що так буде, якщо той побачить, як його заберуть. Коли вони йшли й розмовляли, вогняна колісниця й вогняні коні розлучили їх, і Ілля піднісся у вихорі на небо. Єлисей закричав: батьку мій, батьку мій, колеснице Ізраїлева й комонник його, — роздер свій одяг, підняв плащ Іллі, вдарив ним по Йордану, і вода розступилася й перед ним."
      es: "Por tercera vez Elías le pidió que se quedara, porque el Señor lo había enviado al Jordán, y siguieron juntos mientras cincuenta de los hijos de los profetas miraban desde lejos. Elías dobló su manto y golpeó las aguas; se dividieron, y los dos pasaron en seco. Eliseo pidió una doble porción de su espíritu, y Elías dijo que la tendría si lo veía cuando fuera llevado. Mientras caminaban y hablaban, un carro de fuego con caballos de fuego los separó, y Elías subió al cielo en un torbellino. Eliseo clamó: Padre mío, padre mío, carro de Israel y su gente de a caballo; rasgó sus vestidos, recogió el manto de Elías, golpeó con él el Jordán, y las aguas se apartaron también para él."
      pt: "Pela terceira vez Elias lhe pediu que ficasse, pois o Senhor o tinha enviado ao Jordão, e seguiram juntos enquanto cinquenta dos filhos dos profetas observavam de longe. Elias enrolou o seu manto e feriu as águas; elas se dividiram, e os dois atravessaram em terra seca. Eliseu pediu uma porção dobrada do seu espírito, e Elias disse que ela seria dele se o visse ser levado. Enquanto andavam e conversavam, um carro de fogo e cavalos de fogo os separaram, e Elias subiu ao céu num redemoinho. Eliseu clamou: Meu pai, meu pai, carros de Israel e seus cavaleiros; rasgou as suas roupas, apanhou o manto de Elias, feriu com ele o Jordão, e as águas dividiram-se também para ele."
      de: "Ein drittes Mal bat Elia ihn zu bleiben, denn der Herr habe ihn an den Jordan gesandt, und sie gingen zusammen weiter, während fünfzig der Prophetenjünger von ferne zusahen. Elia rollte seinen Mantel zusammen und schlug auf das Wasser; es teilte sich, und die beiden gingen auf trockenem Boden hinüber. Elisa bat um einen doppelten Anteil an seinem Geist, und Elia sagte, er werde ihn haben, wenn er sehe, wie er hinweggenommen werde. Während sie gingen und redeten, trennten ein feuriger Wagen und feurige Pferde die beiden, und Elia fuhr im Wirbelsturm in den Himmel auf. Elisa rief: Mein Vater, mein Vater, Wagen Israels und seine Reiter! Er zerriss seine Kleider, hob den Mantel Elias auf, schlug damit auf den Jordan, und das Wasser teilte sich auch für ihn."
      fr: "Une troisième fois Élie lui demanda de rester, car l’Éternel l’envoyait au Jourdain, et ils poursuivirent ensemble tandis que cinquante des fils des prophètes regardaient de loin. Élie roula son manteau et frappa les eaux ; elles se partagèrent, et tous deux passèrent à sec. Élisée demanda une double portion de son esprit, et Élie dit qu’il l’aurait s’il le voyait enlevé. Comme ils marchaient en parlant, un char de feu et des chevaux de feu les séparèrent, et Élie monta au ciel dans un tourbillon. Élisée cria : Mon père, mon père, char d’Israël et sa cavalerie, déchira ses vêtements, releva le manteau d’Élie, en frappa le Jourdain, et les eaux se partagèrent pour lui aussi."
      pl: "Po raz trzeci Eliasz prosił go, by został, bo Pan posłał go nad Jordan, i szli dalej razem, a pięćdziesięciu synów proroków patrzyło z daleka. Eliasz zwinął płaszcz i uderzył nim w wodę; rozstąpiła się, a obaj przeszli po suchym. Elizeusz poprosił o podwójną część jego ducha, a Eliasz powiedział, że otrzyma ją, jeśli zobaczy, jak zostaje zabrany. Gdy szli i rozmawiali, rydwan ognisty i ogniste konie rozdzieliły ich, a Eliasz wstąpił w wichrze do nieba. Elizeusz wołał: Ojcze mój, ojcze mój, rydwanie Izraela i jego jeźdźcy, rozdarł szaty, podniósł płaszcz Eliasza, uderzył nim w Jordan, a woda rozstąpiła się także przed nim."
      it: "Una terza volta Elia gli chiese di fermarsi, perché il Signore lo mandava al Giordano, e proseguirono insieme mentre cinquanta dei figli dei profeti guardavano da lontano. Elia arrotolò il mantello e percosse le acque; esse si divisero, e i due passarono all’asciutto. Eliseo chiese una parte doppia del suo spirito, ed Elia disse che l’avrebbe avuta se lo avesse visto rapito. Mentre camminavano discorrendo, un carro di fuoco e cavalli di fuoco li separarono, ed Elia salì al cielo in un turbine. Eliseo gridò: Padre mio, padre mio, carro d’Israele e sua cavalleria, si stracciò le vesti, raccolse il mantello di Elia, percosse con esso il Giordano, e le acque si divisero anche per lui."
      nl: "Een derde maal vroeg Elia hem te blijven, want de HEER had hem naar de Jordaan gezonden, en zij gingen samen verder terwijl vijftig van de profetenzonen van verre toekeken. Elia rolde zijn mantel op en sloeg op het water; het werd verdeeld, en de twee gingen over op droge grond. Elisa vroeg om een dubbel deel van zijn geest, en Elia zei dat hij het zou krijgen als hij hem zag wegnemen. Terwijl zij voortgingen en spraken, scheidden een wagen van vuur en paarden van vuur de twee, en Elia voer in een stormwind op naar de hemel. Elisa riep: Mijn vader, mijn vader, wagen van Israël en zijn ruiters! Hij scheurde zijn kleren, nam de mantel van Elia op, sloeg daarmee op de Jordaan, en ook voor hem werd het water verdeeld."
      cs: "Potřetí ho Elijáš prosil, aby zůstal, neboť Hospodin ho poslal k Jordánu, a šli dál spolu, zatímco padesát synů proroků přihlíželo z dálky. Elijáš svinul svůj plášť a udeřil jím do vody; ta se rozestoupila a oba přešli po suchu. Elíša prosil o dvojný podíl jeho ducha a Elijáš řekl, že ho dostane, uvidí-li, jak je brán. Když šli a rozmlouvali, rozdělil je ohnivý vůz s ohnivými koňmi a Elijáš vystoupil ve vichru do nebe. Elíša volal: Otče můj, otče můj, voze Izraele a jeho jezdci, roztrhl svá roucha, zvedl Elijášův plášť, udeřil jím do Jordánu a voda se rozestoupila i před ním."
      sv: "En tredje gång bad Elia honom stanna, ty Herren hade sänt honom till Jordan, och de gick vidare tillsammans medan femtio av profetlärjungarna såg på från avstånd. Elia rullade ihop sin mantel och slog på vattnet; det delade sig, och de två gick över på torr mark. Elisha bad om en dubbel del av hans ande, och Elia sade att han skulle få den om han såg honom tas bort. Medan de gick och talade skilde en vagn av eld och hästar av eld dem åt, och Elia for i en stormvind upp till himlen. Elisha ropade: min fader, min fader, Israels vagnar och ryttare, rev sönder sina kläder, tog upp Elias mantel, slog på Jordan med den, och vattnet delade sig också för honom."
      nb: "En tredje gang ba Elia ham bli igjen, for Herren hadde sendt ham til Jordan, og de gikk videre sammen mens femti av profetsønnene så på fra avstand. Elia rullet sammen kappen sin og slo på vannet; det delte seg, og de to gikk over på tørr grunn. Elisja ba om en dobbelt del av hans ånd, og Elia sa at han skulle få det hvis han så ham bli tatt bort. Mens de gikk og talte sammen, skilte en ildvogn og ildhester dem fra hverandre, og Elia fór opp til himmelen i en stormvind. Elisja ropte: min far, min far, Israels vogner og ryttere, rev klærne sine i stykker, tok opp Elias kappe, slo på Jordan med den, og vannet delte seg for ham også."
      tl: "Sa ikatlong pagkakataon ay namanhik si Elias na maghintay siya, sapagka't sinugo siya ng Panginoon sa Jordan, at nagpatuloy silang magkasama samantalang limampu sa mga anak ng mga propeta ang nakatanaw mula sa malayo. Tiniklop ni Elias ang kaniyang balabal at hinampas ang tubig; nahawi ito, at ang dalawa ay tumawid sa tuyong lupa. Humingi si Eliseo ng ibayong bahagi ng kaniyang diwa, at sinabi ni Elias na mapapasakaniya ito kung makikita niya siya pagka siya'y kinuha. Samantalang sila'y naglalakad at nag-uusap, isang karong apoy at mga kabayong apoy ang naghiwalay sa kanila, at sumampa si Elias sa langit sa pamamagitan ng isang ipoipo. Sumigaw si Eliseo, na tinatawag siyang kaniyang ama, ang mga karo ng Israel at ang mga mangangabayo niyaon, hinapak ang kaniyang mga damit, dinampot ang balabal ni Elias, hinampas nito ang Jordan, at nahawi rin ang tubig para sa kaniya."
      da: "For tredje gang bad Elias ham blive, for Herren havde sendt ham til Jordan, og de gik videre sammen, mens halvtreds af profeternes sønner så til på afstand. Elias rullede sin kappe sammen og slog på vandet; det delte sig, og de to gik over på det tørre. Elisa bad om en dobbelt del af hans ånd, og Elias sagde, at han skulle få den, hvis han så ham blive taget. Mens de gik og talte, skilte en ildvogn og ildheste dem ad, og Elias for op til himlen i en hvirvelvind. Elisa råbte og kaldte ham sin far, Israels vogne og ryttere, sønderrev sine klæder, tog Elias' kappe op og slog på Jordan med den, og vandet delte sig også for ham."
      sr: "Трећи пут Илија га је замолио да остане, јер га Господ шаље на Јордан, и пошли су даље заједно, док је педесет синова пророчких гледало издалека. Илија је савио свој плашт и ударио по води; она се раступила, и обојица су прешли по сувом. Јелисије је замолио да два дела његовог духа буду у њему, а Илија је рекао да ће бити тако ако га види кад буде узет. Док су ишли и разговарали, огњена кола и огњени коњи раставили су их, и Илија је отишао у вихору на небо. Јелисије је викао: Оче мој, оче мој, кола Израиљева и коњици његови, раздро је хаљине, узео Илијин плашт, ударио њиме по Јордану, и вода се раступила и пред њим."
      hu: "Illés harmadszor is kérte, hogy maradjon, mert az Úr a Jordánhoz küldte, és együtt mentek tovább, miközben a próféták fiai közül ötvenen messziről nézték őket. Illés összegöngyölte palástját, és megütötte vele a vizet; a víz kettévált, és ők ketten szárazon keltek át. Elizeus Illés lelkének kétszeres részét kérte, Illés pedig azt mondta, hogy az övé lesz, ha látja, amikor elviszik. Amint mentek és beszélgettek, tüzes szekér és tüzes lovak választották el őket, és Illés forgószélben felment az égbe. Elizeus így kiáltott: Atyám, atyám, Izráel szekere és lovasai! Megszaggatta ruháját, felvette Illés palástját, megütötte vele a Jordánt, és a víz előtte is kettévált."
      fi: "Kolmannen kerran Elia pyysi häntä jäämään, sillä Herra oli lähettänyt hänet Jordanille, ja he jatkoivat yhdessä viidenkymmenen profeetanoppilaan katsellessa kaukaa. Elia kääri vaippansa kokoon ja löi vettä; se jakautui, ja he kulkivat yli kuivaa myöten. Elisa pyysi kaksinkertaista osaa hänen hengestään, ja Elia sanoi, että hän saisi sen, jos näkisi hänet otettavan. Kun he kulkivat ja puhelivat, tuliset vaunut ja tuliset hevoset erottivat heidät, ja Elia nousi tuulispäässä taivaaseen. Elisa huusi häntä isäkseen, Israelin sotavaunuiksi ja ratsumiehiksi, repäisi vaatteensa, otti Elian vaipan ja löi sillä Jordania, ja vesi jakautui hänellekin."
      vi: "Lần thứ ba Ê-li xin người ở lại, vì Đức Giê-hô-va sai ông đến sông Giô-đanh, và hai người cùng đi trong khi năm mươi người trong các môn đồ của những tiên tri đứng xa mà nhìn. Ê-li cuốn áo tơi lại và đập trên nước; nước rẽ ra, và hai người đi qua trên đất khô. Ê-li-sê xin được bội phần thần của ông, và Ê-li nói điều ấy sẽ thuộc về người nếu người thấy ông lúc được cất lên. Đang khi hai người vừa đi vừa nói, một cái xe lửa và ngựa lửa phân rẽ hai người, và Ê-li lên trời trong một cơn gió lốc. Ê-li-sê kêu lên, gọi ông là cha mình, là xe và lính kỵ của Y-sơ-ra-ên, rồi xé áo mình, lượm lấy áo tơi của Ê-li, lấy nó đập sông Giô-đanh, và nước cũng rẽ ra cho người."
      ro: "A treia oară Ilie l-a rugat să rămână, pentru că Domnul îl trimitea la Iordan, și au mers mai departe împreună, în timp ce cincizeci dintre fiii profeților priveau de departe. Ilie și-a făcut sul mantaua și a lovit apa; ea s-a despărțit, iar cei doi au trecut pe uscat. Elisei a cerut o parte îndoită din duhul lui, iar Ilie a spus că o va avea dacă îl va vedea când va fi luat. Pe când mergeau și vorbeau, un car de foc și cai de foc i-au despărțit, iar Ilie s-a înălțat la cer într-un vârtej de vânt. Elisei a strigat: Părinte, părinte, carul lui Israel și călărimea lui! Și-a sfâșiat hainele, a ridicat mantaua lui Ilie, a lovit Iordanul cu ea, iar apa s-a despărțit și înaintea lui."
      bg: "За трети път Илия го помоли да остане, защото Господ го пращал на Йордан, и те продължиха заедно, докато петдесет от пророческите синове гледаха отдалеч. Илия сви наметалото си и удари водата; тя се раздели и двамата преминаха по сухо. Елисей поиска двоен дял от духа му и Илия каза, че ще го получи, ако го види, когато бъде взет. Докато вървяха и говореха, огнена колесница и огнени коне ги разделиха и Илия възлезе с вихрушка на небето. Елисей викаше: Отче мой, отче мой, колесница Израилева и конница негова, раздра дрехите си, вдигна наметалото на Илия, удари с него Йордан и водата се раздели и пред него."
