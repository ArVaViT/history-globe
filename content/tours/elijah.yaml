# Elijah, 1 Kings 17 - 2 Kings 2, in the order of the text. The tour's year (860 BC)
# falls in the reign of Ahab (c. 874-853 BC), a point for the map rather than a date.
id: elijah
title:
  en: "Elijah the prophet"
  ru: "Пророк Илия"
  uk: "Пророк Ілля"
  es: "El profeta Elías"
  pt: "Elias, o profeta"
  de: "Der Prophet Elia"
  fr: "Élie le prophète"
  pl: "Prorok Eliasz"
  it: "Il profeta Elia"
  nl: "De profeet Elia"
  cs: "Prorok Elijáš"
  sv: "Profeten Elia"
  nb: "Profeten Elia"
  tl: "Ang propetang si Elias"
  da: "Profeten Elija"
  sr: "Пророк Илија"
  hu: "Illés próféta"
  fi: "Profeetta Elia"
  vi: "Tiên tri Ê-li"
  ro: "Profetul Ilie"
  bg: "Пророк Илия"
year: "860 BC"
people: ["Elijah@1Ki.17.1-Jas"]
approximate: true
stops:
  - place: aa7bee8 # Brook Cherith
    ref: 1Kgs.17.1-1Kgs.17.7
    note:
      en: "Elijah foretells the drought and hides by the brook Cherith, where ravens bring him bread and meat."
      ru: "Илия возвещает засуху и скрывается у потока Хорафа, где вороны приносят ему хлеб и мясо."
      uk: "Ілля провіщає посуху й ховається біля потоку Хораф, де круки носять йому хліб і м’ясо."
      es: "Elías anuncia la sequía y se oculta junto al Arroyo de Querit, donde los cuervos le llevan pan y carne."
      pt: "Elias prediz a seca e se esconde junto ao ribeiro de Querite, onde corvos lhe trazem pão e carne."
      de: "Elia kündigt die Dürre an und verbirgt sich am Bach Krit, wo Raben ihm Brot und Fleisch bringen."
      fr: "Élie annonce la sécheresse et se cache près du torrent de Kerith, où des corbeaux lui apportent du pain et de la viande."
      pl: "Eliasz zapowiada suszę i ukrywa się nad potokiem Kerit, dokąd kruki przynoszą mu chleb i mięso."
      it: "Elia predice la siccità e si nasconde presso il torrente Cherit, dove i corvi gli portano pane e carne."
      nl: "Elia kondigt de droogte aan en verbergt zich bij de beek Kerit, waar raven hem brood en vlees brengen."
      cs: "Elijáš předpovídá sucho a skrývá se u potoka Kerít, kde mu havrani nosí chléb a maso."
      sv: "Elia förutsäger torkan och gömmer sig vid bäcken Kerit, där korpar bär bröd och kött till honom."
      nb: "Elia forutsier tørken og skjuler seg ved bekken Kerit, hvor ravner bringer ham brød og kjøtt."
      tl: "Inihula ni Elias ang tagtuyot at nagtago sa batis ng Cherith, kung saan dinalhan siya ng mga uwak ng tinapay at karne."
      da: "Elija forudsiger tørken og skjuler sig ved Kerit-bækken, hvor ravne bringer ham brød og kød."
      sr: "Илија прориче сушу и скрива се код потока Хората, где му гавранови носе хлеб и месо."
      hu: "Illés megjövendöli az aszályt, és a Kerit patakánál rejtőzik el, ahol hollók hordanak neki kenyeret és húst."
      fi: "Elia ennustaa kuivuuden ja kätkeytyy Keritin purolle, jossa korpit tuovat hänelle leipää ja lihaa."
      vi: "Ê-li báo trước nạn hạn hán và ẩn mình bên khe Kê-rít, nơi chim quạ đem bánh và thịt cho người."
      ro: "Ilie vestește seceta și se ascunde lângă pârâul Cherit, unde corbii îi aduc pâine și carne."
      bg: "Илия предсказва сушата и се скрива при потока Хорат, където гарваните му носят хляб и месо."
  - place: a6fa2d3 # Zarephath
    ref: 1Kgs.17.8-1Kgs.17.24
    note:
      en: "In Zarephath of Sidon the widow's barrel of meal does not waste nor her cruse of oil fail, and her son is brought back to life."
      ru: "В Сарепте Сидонской мука в кадке у вдовы не истощается и масло в кувшине не убывает; её сын оживает."
      uk: "У Сарепті Сідонській не витрачається борошно в діжці вдови й не вичерпується олія в її глечику, а її сина повернуто до життя."
      es: "En Sarepta de Sidón la tinaja de harina de la viuda no se agota ni falta la vasija de aceite, y su hijo vuelve a la vida."
      pt: "Em Sarepta de Sidom, a vasilha de farinha da viúva não se esgota nem o seu jarro de azeite falta, e o filho dela é trazido de volta à vida."
      de: "In Sarepta bei Sidon geht der Mehltopf der Witwe nicht aus, und ihr Ölkrug versiegt nicht, und ihr Sohn wird wieder lebendig."
      fr: "À Sarepta de Sidon, la farine de la veuve ne s’épuise pas et l’huile de sa cruche ne manque pas, et son fils est rendu à la vie."
      pl: "W Sarepcie sydońskiej dzban mąki wdowy nie wyczerpuje się, a w jej baryłce nie ubywa oliwy, i jej syn zostaje przywrócony do życia."
      it: "A Sarepta di Sidone il vaso della farina della vedova non si esaurisce né manca l’orcio dell’olio, e suo figlio è riportato in vita."
      nl: "Te Sarefat bij Sidon raakt de meelbus van de weduwe niet leeg en de oliekruik niet op, en haar zoon wordt weer tot leven gebracht."
      cs: "V Sarepťe Sidonské se vdově nespotřebuje mouka v kbelíku ani neubývá oleje v nádobce a její syn je přiveden zpět k životu."
      sv: "I Sarefat i Sidon tar inte änkans mjöl i krukan slut och inte heller oljan i hennes kruka, och hennes son väcks till liv igen."
      nb: "I Sarepta i Sidon tar ikke enkens mel i krukken slutt og oljen i kolben forsvinner ikke, og hennes sønn blir kalt tilbake til livet."
      tl: "Sa Sarepta ng Sidon, hindi nasaid ang bariles ng harina ng babaing balo ni nagkulang ang kaniyang sisidlan ng langis, at ibinalik sa buhay ang kaniyang anak."
      da: "I Sarepta ved Sidon slipper enkens mel i krukken ikke op, og hendes oliekrukke svigter ikke, og hendes søn kaldes tilbage til livet."
      sr: "У Сарепти сидонској удовичино брашно у судини не нестаје нити јој уље у крчагу понестаје, и њен син бива враћен у живот."
      hu: "A szidóni Sareptában az özvegy lisztesbödöne nem fogy ki, olajoskorsója nem apad el, fiát pedig visszahozza az életbe."
      fi: "Sidonin Sareptassa lesken jauhoastia ei tyhjene eikä öljykannu lopu, ja hänen poikansa herätetään henkiin."
      vi: "Tại Sa-rép-ta thuộc Si-đôn, bột trong vò của bà góa không hết, dầu trong bình không thiếu, và con trai bà được sống lại."
      ro: "În Sarepta Sidonului, făina din vasul văduvei nu scade și untdelemnul din ulciorul ei nu se împuținează, iar fiul ei este adus înapoi la viață."
      bg: "В Сарепта Сидонска брашното в делвата на вдовицата не намалява, нито маслото в стомната ѝ свършва, а синът ѝ е върнат към живот."
  - place: a3e21c6 # Mount Carmel
    ref: 1Kgs.18.19-1Kgs.18.40
    note:
      en: "On Mount Carmel the fire of the Lord falls on the sacrifice before the prophets of Baal."
      ru: "На горе Кармил огонь Господень ниспадает на жертву перед пророками Вааловыми."
      uk: "На горі Кармель вогонь Господній падає на жертву перед пророками Ваала."
      es: "En el Monte Carmelo el fuego del Señor cae sobre el sacrificio ante los profetas de Baal."
      pt: "No Monte Carmelo, o fogo do Senhor cai sobre o sacrifício diante dos profetas de Baal."
      de: "Auf dem Karmel fällt das Feuer des Herrn vor den Propheten Baals auf das Opfer."
      fr: "Sur le Mont Carmel, le feu de l’Éternel tombe sur le sacrifice devant les prophètes de Baal."
      pl: "Na Karmelu ogień Pański spada na ofiarę wobec proroków Baala."
      it: "Sul Monte Carmelo il fuoco del Signore scende sul sacrificio davanti ai profeti di Baal."
      nl: "Op de Karmel valt het vuur van de HEER op het offer, voor de ogen van de profeten van Baäl."
      cs: "Na hoře Karmel padá oheň Hospodinův na oběť před proroky Baalovými."
      sv: "På Karmel faller Herrens eld över offret inför Baals profeter."
      nb: "På Karmel faller Herrens ild over offeret for Baals profeter."
      tl: "Sa Bundok Carmelo, bumaba ang apoy ng Panginoon sa handog sa harap ng mga propeta ni Baal."
      da: "På Karmel falder Herrens ild på ofret for Ba'als profeters øjne."
      sr: "На Кармилу огањ Господњи пада на жртву пред пророцима Валовим."
      hu: "A Kármel-hegyen az Úr tüze leszáll az áldozatra Baál prófétái szeme láttára."
      fi: "Karmelvuorella Herran tuli lankeaa uhrin päälle Baalin profeettojen nähden."
      vi: "Trên Núi Cạt-mên, lửa của Đức Giê-hô-va giáng xuống trên của lễ trước mặt các tiên tri của Ba-anh."
      ro: "Pe Muntele Carmel, focul Domnului cade peste jertfă înaintea profeților lui Baal."
      bg: "На планината Кармил огънят Господен пада върху жертвата пред пророците на Ваал."
  - place: ae0bf4a # Jezreel
    ref: 1Kgs.18.41-1Kgs.18.46
    note:
      en: "The rain comes, and Elijah runs before Ahab to the entrance of Jezreel."
      ru: "Приходит дождь, и Илия бежит перед Ахавом до самого Изрееля."
      uk: "Приходить дощ, і Ілля біжить перед Ахавом до входу в Їзреель."
      es: "Llega la lluvia, y Elías corre delante de Acab hasta la entrada de Jezreel."
      pt: "Vem a chuva, e Elias corre diante de Acabe até a entrada de Jezreel."
      de: "Der Regen kommt, und Elia läuft vor Ahab her bis zum Eingang von Jesreel."
      fr: "La pluie vient, et Élie court devant Achab jusqu’à l’entrée de Jizreel."
      pl: "Przychodzi deszcz, a Eliasz biegnie przed Achabem aż do wejścia do Jizreel."
      it: "Viene la pioggia, ed Elia corre davanti ad Acab fino all’ingresso di Izreel."
      nl: "De regen komt, en Elia rent voor Achab uit tot aan de ingang van Jizreël."
      cs: "Přichází déšť a Elijáš běží před Achabem až ke vjezdu do Jizreelu."
      sv: "Regnet kommer, och Elia springer framför Achav till ingången till Jisreel."
      nb: "Regnet kommer, og Elia løper foran Akab til inngangen til Jisreel."
      tl: "Dumating ang ulan, at tumakbo si Elias sa unahan ni Achab hanggang sa pasukan ng Jezreel."
      da: "Regnen kommer, og Elija løber foran Akab til indgangen til Jizre'el."
      sr: "Долази киша, и Илија трчи пред Ахавом до улаза у Језраел."
      hu: "Megjön az eső, és Illés Aháb előtt fut Jezréel bejáratáig."
      fi: "Sade tulee, ja Elia juoksee Ahabin edellä Jisreelin sisäänkäynnille asti."
      vi: "Mưa đến, và Ê-li chạy trước A-háp cho đến cửa vào Gít-rê-ên."
      ro: "Vine ploaia, iar Ilie aleargă înaintea lui Ahab până la intrarea în Izreel."
      bg: "Идва дъжд и Илия тича пред Ахав до входа на Изреел."
  - place: ad2f6c2 # Beersheba
    ref: 1Kgs.19.1-1Kgs.19.4
    note:
      en: "Fleeing Jezebel, he comes to Beersheba and goes on into the wilderness."
      ru: "Спасаясь от Иезавели, он приходит в Вирсавию и уходит в пустыню."
      uk: "Тікаючи від Єзавелі, він приходить до Беер-Шеви й іде далі в пустелю."
      es: "Huyendo de Jezabel, llega a Beerseba y sigue adentrándose en el desierto."
      pt: "Fugindo de Jezabel, chega a Berseba e segue deserto adentro."
      de: "Auf der Flucht vor Isebel kommt er nach Beerscheba und zieht weiter in die Wüste."
      fr: "Fuyant Jézabel, il arrive à Beer-Schéba et poursuit son chemin dans le désert."
      pl: "Uciekając przed Izebel, dociera do Beer-Szeby i idzie dalej na pustynię."
      it: "Fuggendo da Gezabele, giunge a Bersabea e prosegue nel deserto."
      nl: "Op de vlucht voor Izebel komt hij te Berseba en trekt verder de woestijn in."
      cs: "Prchá před Jezábel, dochází do Beer-šeby a pokračuje dál na poušť."
      sv: "På flykt undan Isebel kommer han till Beer Sheva och går vidare ut i öknen."
      nb: "På flukt fra Jesabel kommer han til Beer-Sjeba og drar videre ut i ørkenen."
      tl: "Sa pagtakas kay Jezabel, dumating siya sa Beer-seba at nagpatuloy sa ilang."
      da: "Han flygter for Jezabel, kommer til Beersheba og går videre ud i ørkenen."
      sr: "Бежећи од Језавеље, долази у Вирсавеју и иде даље у пустињу."
      hu: "Jézabel elől menekülve Beérsebába jut, és tovább megy a pusztába."
      fi: "Isebelia paetessaan hän tulee Beersebaan ja jatkaa edelleen erämaahan."
      vi: "Chạy trốn Giê-sa-bên, người đến Bê-e-Sê-ba rồi đi tiếp vào đồng vắng."
      ro: "Fugind de Izabela, ajunge la Beer-Șeba și merge mai departe în pustiu."
      bg: "Бягайки от Йезавел, той идва във Вирсавия и продължава в пустинята."
  - place: a9bb03e # Mount Horeb
    ref: 1Kgs.19.8-1Kgs.19.15
    note:
      en: "At Horeb, the mount of God, the Lord is not in the wind, the earthquake or the fire; after the fire comes a still small voice."
      ru: "У Хорива, горы Божией, Господь не в ветре, не в землетрясении и не в огне, а в веянии тихого ветра."
      uk: "На Хориві, горі Божій, Господа немає ні у вітрі, ні в землетрусі, ні в огні; після вогню приходить тихий, лагідний голос."
      es: "En Horeb, el monte de Dios, el Señor no está en el viento, ni en el terremoto, ni en el fuego; después del fuego viene un silbo apacible y delicado."
      pt: "Em Horebe, o monte de Deus, o Senhor não está no vento, no terremoto nem no fogo; depois do fogo vem uma voz mansa e delicada."
      de: "Am Horeb, dem Berg Gottes, ist der Herr nicht im Wind, nicht im Erdbeben und nicht im Feuer; nach dem Feuer kommt ein stilles, sanftes Sausen."
      fr: "À Horeb, la montagne de Dieu, l’Éternel n’est ni dans le vent, ni dans le tremblement de terre, ni dans le feu ; après le feu vient un murmure doux et léger."
      pl: "Na Horebie, górze Bożej, Pana nie ma w wichrze, w trzęsieniu ziemi ani w ogniu; po ogniu przychodzi głos cichy i łagodny."
      it: "All’Oreb, il monte di Dio, il Signore non è nel vento, nel terremoto né nel fuoco; dopo il fuoco viene un suono dolce e sommesso."
      nl: "Op de Horeb, de berg van God, is de HEER niet in de wind, de aardbeving of het vuur; na het vuur komt een stil, zacht suizen."
      cs: "Na Chorébu, hoře Boží, Hospodin není ve vichru, zemětřesení ani v ohni; po ohni přichází tichý a jemný hlas."
      sv: "Vid Horeb, Guds berg, är Herren inte i vinden, jordbävningen eller elden; efter elden kommer ljudet av en sakta susning."
      nb: "Ved Horeb, Guds fjell, er Herren ikke i vinden, jordskjelvet eller ilden; etter ilden kommer en stille, mild susing."
      tl: "Sa Horeb, ang bundok ng Diyos, wala ang Panginoon sa hangin, sa lindol o sa apoy; pagkatapos ng apoy ay dumating ang isang marahang bulong na tinig."
      da: "På Horeb, Guds bjerg, er Herren ikke i stormen, jordskælvet eller ilden; efter ilden kommer en sagte, stille susen."
      sr: "На Хориву, гори Божјој, Господа нема у ветру, у трусу ни у огњу; после огња долази глас тих и танак."
      hu: "A Hóreben, az Isten hegyén az Úr nincs a szélben, a földindulásban és a tűzben; a tűz után csendes, halk szózat hallatszik."
      fi: "Horebilla, Jumalan vuorella, Herra ei ole tuulessa, maanjäristyksessä eikä tulessa; tulen jälkeen tulee hiljainen tuulen hyminä."
      vi: "Tại Hô-rếp, núi của Đức Chúa Trời, Đức Giê-hô-va không ở trong gió, trong cơn động đất hay trong đám lửa; sau đám lửa có một tiếng êm dịu nhỏ nhẹ."
      ro: "La Horeb, muntele lui Dumnezeu, Domnul nu este în vânt, nici în cutremur, nici în foc; după foc vine un susur blând și subțire."
      bg: "При Хорив, Божията планина, Господ не е във вятъра, в труса или в огъня; след огъня идва тих и тънък глас."
  - place: a5a1bdd # Abel-meholah
    ref: 1Kgs.19.16-1Kgs.19.21
    note:
      en: "Elisha son of Shaphat, of Abel-meholah, is called from the plough to follow Elijah."
      ru: "Елисей, сын Сафатов, из Авел-Мехолы, оставляет плуг и идёт за Илией."
      uk: "Єлисея, сина Шафата, з Авел-Мехоли, закликають від плуга йти за Іллею."
      es: "Eliseo, hijo de Safat, de Abel-mehola, es llamado del arado para seguir a Elías."
      pt: "Eliseu, filho de Safate, de Abel-Meolá, é chamado do arado para seguir Elias."
      de: "Elisa, der Sohn Schafats, aus Abel-Mehola, wird vom Pflügen weg gerufen, um Elia zu folgen."
      fr: "Élisée, fils de Schaphat, d’Abel-Mehola, est appelé de derrière la charrue pour suivre Élie."
      pl: "Elizeusz, syn Szafata, z Abel-Mechola, zostaje powołany od pługa, by pójść za Eliaszem."
      it: "Eliseo, figlio di Safat, di Abel-Mecolà, è chiamato dall’aratro a seguire Elia."
      nl: "Elisa, de zoon van Safat, uit Abel-Mehola, wordt van de ploeg geroepen om Elia te volgen."
      cs: "Elíša, syn Šafatův z Ábel-mecholy, je od pluhu povolán, aby následoval Elijáše."
      sv: "Elisha, Shafats son, från Avel-Mehola, kallas från plogen att följa Elia."
      nb: "Elisja, Sjafats sønn, fra Abel-Mehola, blir kalt fra plogen til å følge Elia."
      tl: "Si Eliseo na anak ni Saphat, na taga-Abelmehola, ay tinawag mula sa pag-aararo upang sumunod kay Elias."
      da: "Elisa, Sjafats søn, fra Abel-Mehola, kaldes fra ploven til at følge Elija."
      sr: "Јелисије син Сафатов, из Авел-Меоле, бива позван од рала да иде за Илијом."
      hu: "Elizeust, Sáfát fiát, az ábel-meholai férfit az eke mellől hívják el, hogy kövesse Illést."
      fi: "Elisa, Safatin poika, Abel-Meholasta, kutsutaan auran takaa seuraamaan Eliaa."
      vi: "Ê-li-sê con trai Sa-phát, người A-bên-Mê-hô-la, được gọi từ chỗ cày ruộng để theo Ê-li."
      ro: "Elisei, fiul lui Șafat, din Abel-Mehola, este chemat de la plug ca să-l urmeze pe Ilie."
      bg: "Елисей, синът на Сафат, от Авел-Мехола, е призован от ралото да последва Илия."
  - place: ae0bf4a # Jezreel
    ref: 1Kgs.21.1-1Kgs.21.24
    note:
      en: "Naboth's vineyard in Jezreel: Elijah pronounces judgement on Ahab and Jezebel."
      ru: "Виноградник Навуфея в Изрееле: Илия возвещает суд Ахаву и Иезавели."
      uk: "Виноградник Навуфея в Їзреелі: Ілля виголошує вирок Ахавові й Єзавелі."
      es: "La viña de Nabot en Jezreel: Elías pronuncia sentencia contra Acab y Jezabel."
      pt: "A vinha de Nabote em Jezreel: Elias pronuncia juízo sobre Acabe e Jezabel."
      de: "Nabots Weinberg in Jesreel: Elia spricht das Gericht über Ahab und Isebel aus."
      fr: "La vigne de Naboth à Jizreel : Élie prononce le jugement sur Achab et Jézabel."
      pl: "Winnica Nabota w Jizreel: Eliasz ogłasza wyrok na Achaba i Izebel."
      it: "La vigna di Nabot a Izreel: Elia pronuncia il giudizio su Acab e Gezabele."
      nl: "De wijngaard van Nabot in Jizreël: Elia spreekt het oordeel uit over Achab en Izebel."
      cs: "Nábotův vinohrad v Jizreelu: Elijáš vyslovuje soud nad Achabem a Jezábel."
      sv: "Navots vingård i Jisreel: Elia uttalar dom över Achav och Isebel."
      nb: "Nabots vingård i Jisreel: Elia kunngjør dom over Akab og Jesabel."
      tl: "Ubasan ni Naboth sa Jezreel: ipinahayag ni Elias ang hatol kina Achab at Jezabel."
      da: "Nabots vingård i Jizre'el: Elija udtaler dom over Akab og Jezabel."
      sr: "Навутејев виноград у Језраелу: Илија изриче суд над Ахавом и Језавељом."
      hu: "Nábót szőlője Jezréelben: Illés ítéletet mond Ahábra és Jézabelre."
      fi: "Nabotin viinitarha Jisreelissä: Elia julistaa tuomion Ahabille ja Isebelille."
      vi: "Vườn nho của Na-bốt tại Gít-rê-ên: Ê-li tuyên án trên A-háp và Giê-sa-bên."
      ro: "Via lui Nabot din Izreel: Ilie rostește judecata asupra lui Ahab și a Izabelei."
      bg: "Лозето на Навутей в Изреел: Илия произнася присъда над Ахав и Йезавел."
  - place: a6399b3 # Gilgal
    ref: 2Kgs.2.1
    note:
      en: "When the Lord is about to take him up, Elijah sets out from Gilgal with Elisha."
      ru: "Когда Господь готовится вознести Илию, тот выходит с Елисеем из Галгала."
      uk: "Коли Господь має забрати його, Ілля виходить з Гілгала разом з Єлисеєм."
      es: "Cuando el Señor está a punto de llevárselo, Elías sale de Gilgal con Eliseo."
      pt: "Quando o Senhor está para levá-lo, Elias parte de Gilgal com Eliseu."
      de: "Als der Herr Elia aufnehmen will, bricht dieser mit Elisa von Gilgal auf."
      fr: "Au moment où l’Éternel va l’enlever, Élie part de Guilgal avec Élisée."
      pl: "Gdy Pan ma go wziąć do góry, Eliasz wyrusza z Gilgal razem z Elizeuszem."
      it: "Quando il Signore sta per rapirlo in cielo, Elia parte da Gàlgala con Eliseo."
      nl: "Als de HEER Elia wil opnemen, vertrekt hij met Elisa uit Gilgal."
      cs: "Když chce Hospodin Elijáše vzít vzhůru, vychází Elijáš z Gilgalu s Elíšou."
      sv: "När Herren ska ta honom upp bryter Elia upp från Gilgal tillsammans med Elisha."
      nb: "Da Herren er i ferd med å ta ham opp, drar Elia ut fra Gilgal sammen med Elisja."
      tl: "Nang malapit nang isampa ng Panginoon si Elias, umalis siya mula sa Gilgal kasama ni Eliseo."
      da: "Da Herren er ved at tage ham op, drager Elija fra Gilgal sammen med Elisa."
      sr: "Кад Господ хоће да га узме горе, Илија креће из Галгала са Јелисијем."
      hu: "Amikor az Úr fel akarja venni Illést, ő Elizeussal együtt elindul Gilgálból."
      fi: "Kun Herra on ottamaisillaan hänet ylös, Elia lähtee Gilgalista Elisan kanssa."
      vi: "Khi Đức Giê-hô-va sắp cất Ê-li lên, Ê-li cùng Ê-li-sê khởi hành từ Ghinh-ganh."
      ro: "Când Domnul este gata să-l ia la cer, Ilie pornește din Ghilgal împreună cu Elisei."
      bg: "Когато Господ е на път да го възнесе, Илия тръгва от Галгал с Елисей."
  - place: a64f355 # Bethel
    ref: 2Kgs.2.2-2Kgs.2.3
    note:
      en: "Elisha will not leave him: they go down to Bethel."
      ru: "Елисей не оставляет его: они идут в Вефиль."
      uk: "Єлисей не хоче його залишити: вони сходять до Бет-Елу."
      es: "Eliseo no quiere dejarlo: bajan a Betel."
      pt: "Eliseu não o deixa: descem a Betel."
      de: "Elisa will ihn nicht verlassen: Sie gehen hinab nach Bethel."
      fr: "Élisée ne veut pas le quitter : ils descendent à Béthel."
      pl: "Elizeusz nie chce go opuścić: schodzą do Betel."
      it: "Eliseo non vuole lasciarlo: scendono a Betel."
      nl: "Elisa wil hem niet verlaten: zij gaan af naar Bethel."
      cs: "Elíša ho neopouští: sestupují do Bét-elu."
      sv: "Elisha vill inte lämna honom: de går ner till Betel."
      nb: "Elisja vil ikke forlate ham: de går ned til Betel."
      tl: "Ayaw iwan ni Eliseo si Elias: bumaba sila sa Beth-el."
      da: "Elisa vil ikke forlade ham: de går ned til Betel."
      sr: "Јелисије неће да га остави: силазе у Ветиљ."
      hu: "Elizeus nem hagyja el: lemennek Bételbe."
      fi: "Elisa ei jätä häntä: he menevät alas Beteliin."
      vi: "Ê-li-sê không chịu rời người: hai người đi xuống Bê-tên."
      ro: "Elisei nu vrea să-l părăsească: coboară la Betel."
      bg: "Елисей не го оставя: те слизат във Ветил."
  - place: a231f80 # Jericho
    ref: 2Kgs.2.4-2Kgs.2.5
    note:
      en: "Then to Jericho, where the sons of the prophets come to Elisha."
      ru: "Затем в Иерихон, где к Елисею подходят сыны пророков."
      uk: "Потім до Єрихону, де до Єлисея приходять сини пророків."
      es: "Luego a Jericó, donde los hijos de los profetas se acercan a Eliseo."
      pt: "Depois a Jericó, onde os filhos dos profetas vão até Eliseu."
      de: "Dann nach Jericho, wo die Prophetenjünger zu Elisa kommen."
      fr: "Puis à Jéricho, où les fils des prophètes viennent trouver Élisée."
      pl: "Potem do Jerycha, gdzie synowie proroków przychodzą do Elizeusza."
      it: "Poi a Gerico, dove i figli dei profeti vengono da Eliseo."
      nl: "Dan naar Jericho, waar de profetenzonen naar Elisa toe komen."
      cs: "Potom do Jericha, kde přicházejí k Elíšovi synové proroků."
      sv: "Sedan till Jeriko, där profetlärjungarna kommer till Elisha."
      nb: "Så til Jeriko, hvor profetsønnene kommer til Elisja."
      tl: "Pagkatapos ay sa Jerico, kung saan lumalapit kay Eliseo ang mga anak ng mga propeta."
      da: "Så til Jeriko, hvor profeternes sønner kommer hen til Elisa."
      sr: "Затим у Јерихон, где синови пророчки долазе к Јелисију."
      hu: "Azután Jerikóba, ahol a próféták fiai Elizeushoz jönnek."
      fi: "Sitten Jerikoon, jossa profeetanoppilaat tulevat Elisan luo."
      vi: "Rồi đến Giê-ri-cô, nơi các môn đồ của những tiên tri đến cùng Ê-li-sê."
      ro: "Apoi la Ierihon, unde fiii profeților vin la Elisei."
      bg: "После в Йерихон, където пророческите синове идват при Елисей."
  - place: ae686c9 # Jordan
    ref: 2Kgs.2.6-2Kgs.2.14
    note:
      en: "Elijah parts the Jordan with his cloak; a chariot of fire separates the two; Elijah goes up in a whirlwind into heaven, and Elisha takes up his cloak."
      ru: "Илия разделяет милотью воды Иордана; колесница огненная разлучает их: Илия возносится в вихре на небо, а Елисей поднимает его милоть."
      uk: "Ілля розділяє Йордан своїм плащем; вогняна колісниця розлучає їх обох; Ілля підноситься у вихорі на небо, а Єлисей підіймає його плащ."
      es: "Elías divide el Jordán con su manto; un carro de fuego separa a los dos; Elías sube al cielo en un torbellino, y Eliseo recoge su manto."
      pt: "Elias divide o Jordão com o seu manto; um carro de fogo separa os dois; Elias sobe num redemoinho ao céu, e Eliseu toma o manto dele."
      de: "Elia teilt den Jordan mit seinem Mantel; ein feuriger Wagen trennt die beiden; Elia fährt in einem Wirbelsturm in den Himmel auf, und Elisa hebt seinen Mantel auf."
      fr: "Élie divise le Jourdain avec son manteau ; un char de feu les sépare ; Élie monte au ciel dans un tourbillon, et Élisée ramasse son manteau."
      pl: "Eliasz rozdziela Jordan swoim płaszczem; rydwan ognisty rozdziela obu; Eliasz wstępuje w wichrze do nieba, a Elizeusz podnosi jego płaszcz."
      it: "Elia divide il Giordano con il suo mantello; un carro di fuoco separa i due; Elia sale al cielo in un turbine, ed Eliseo raccoglie il suo mantello."
      nl: "Elia splijt de Jordaan met zijn mantel; een wagen van vuur scheidt de twee; Elia stijgt in een wervelwind op naar de hemel, en Elisa raapt zijn mantel op."
      cs: "Elijáš rozdělí Jordán svým pláštěm; ohnivý vůz je od sebe odloučí; Elijáš vystupuje ve vichru do nebe a Elíša zvedá jeho plášť."
      sv: "Elia delar Jordan med sin mantel; en eldvagn skiljer de två åt; Elia far upp i en stormvind till himlen, och Elisha tar upp hans mantel."
      nb: "Elia deler Jordan med kappen sin; en ildvogn skiller de to; Elia farer opp til himmelen i en stormvind, og Elisja tar opp kappen hans."
      tl: "Hinahati ni Elias ang Jordan sa pamamagitan ng kaniyang balabal; isang karong apoy ang naghihiwalay sa dalawa; sumasampa si Elias sa langit sa isang ipoipo, at kinukuha ni Eliseo ang kaniyang balabal."
      da: "Elija deler Jordan med sin kappe; en ildvogn skiller de to ad; Elija farer op i en hvirvelvind til himlen, og Elisa tager hans kappe op."
      sr: "Илија плаштем раздваја Јордан; кола огњена раздвајају њих двојицу; Илија одлази у вихору на небо, а Јелисије узима његов плашт."
      hu: "Illés köntösével kettéválasztja a Jordánt; tüzes szekér választja el egymástól a két férfit; Illés forgószélben felmegy az égbe, Elizeus pedig felveszi a köntösét."
      fi: "Elia jakaa Jordanin vedet vaipallaan; tulinen vaunu erottaa heidät toisistaan; Elia nousee tuulispäässä taivaaseen, ja Elisa ottaa hänen vaippansa."
      vi: "Ê-li lấy áo tơi đánh sông Giô-đanh cho rẽ ra; một cái xe lửa phân rẽ hai người; Ê-li lên trời trong một cơn gió lốc, và Ê-li-sê lượm lấy áo tơi của người."
      ro: "Ilie desparte apele Iordanului cu mantaua sa; un car de foc îi desparte pe cei doi; Ilie se înalță la cer într-un vârtej de vânt, iar Elisei îi ridică mantaua."
      bg: "Илия разделя Йордан с наметалото си; огнена колесница разделя двамата; Илия се възнася с вихрушка на небето, а Елисей вдига наметалото му."
