# Elijah, 1 Kings 17 - 2 Kings 2, in the order of the text. The tour's year (860 BC)
# falls in the reign of Ahab (c. 874-853 BC), a point for the map rather than a date. The
# last four stops (2 Kgs 2) come after Ahab's death and Ahaziah's two years (2 Kgs 1:17) and
# show 850 BC.
id: elijah
title:
  en: "Elijah the prophet"
  ru: "Пророк Илия"
  uk: "Пророк Ілля"
  es: "El profeta Elías"
  pt: "Elias, o profeta"
  de: "Der Prophet Elia"
  fr: "Élie le prophète"
  pl: "Prorok Eliasz"
  it: "Il profeta Elia"
  nl: "De profeet Elia"
  cs: "Prorok Elijáš"
