# Two judges east and west of the Jordan: Ehud (Judges 3:12-30) and Jephthah (Judges
# 11:1-12:6), in the order of the text. The chronology of the judges is uncertain and Ehud
# comes long before Jephthah; the tour's year (1150 BC) is the point of the Judges tour,
# for the map only. At 12:1 the Synodal text reads a town (Севина) where the KJV reads
# "northward" (Zaphon), so that stop stands at the crossing of the Jordan, which both name.
id: ehud-jephthah
title:
  en: "Ehud and Jephthah"
  ru: "Аод и Иеффай"
  uk: "Егуд і Єфтай"
  es: "Aod y Jefté"
  pt: "Eúde e Jefté"
  de: "Ehud und Jeftah"
  fr: "Éhud et Jephté"
  pl: "Ehud i Jefte"
  it: "Eud e Iefte"
  nl: "Ehud en Jefta"
  cs: "Ehúd a Jiftách"
  sv: "Ehud och Jefta"
  nb: "Ehud og Jefta"
  tl: "Si Aod at si Jephte"
  da: "Ehud og Jefta"
  sr: "Аод и Јефтај"
  hu: "Ehúd és Jefte"
  fi: "Ehud ja Jefta"
  vi: "Ê-hút và Giép-thê"
  ro: "Ehud și Ieftae"
  bg: "Ехуд и Йефтай"
year: "1150 BC"
people: ["Ehud@Jdg.3.15-1Ch", "Jephthah@Jdg.11.1-Heb"]
approximate: true
stops:
  - place: a529e92 # City of Palms
    ref: Judg.3.12-Judg.3.14
    note:
      en: "Eglon king of Moab, with Ammon and Amalek, smites Israel and takes the city of palm trees; Israel serves him eighteen years."
      ru: "Еглон, царь Моавитский, с Аммонитянами и Амаликитянами поражает Израиль и овладевает Городом Пальм; Израиль служит ему восемнадцать лет."
      uk: "Еглон, цар Моаву, разом з Аммоном і Амалеком б’є Ізраїль і бере місто пальм; Ізраїль служить йому вісімнадцять років."
      es: "Eglón, rey de Moab, con Amón y Amalec, hiere a Israel y toma la ciudad de las palmeras; Israel le sirve dieciocho años."
      pt: "Eglom, rei de Moabe, com Amom e Amaleque, fere Israel e toma a cidade das palmeiras; Israel o serve dezoito anos."
      de: "Eglon, der König von Moab, schlägt mit Ammon und Amalek Israel und nimmt die Palmenstadt ein; Israel dient ihm achtzehn Jahre."
      fr: "Églon, roi de Moab, avec Ammon et Amalek, bat Israël et prend la ville des palmiers ; Israël le sert dix-huit ans."
      pl: "Eglon, król Moabu, wraz z Ammonem i Amalekiem bije Izraela i zajmuje Miasto Palm; Izrael służy mu osiemnaście lat."
      it: "Eglon, re di Moab, con Ammon e Amalek, colpisce Israele e prende la città delle palme; Israele lo serve diciotto anni."
      nl: "Eglon, de koning van Moab, slaat met Ammon en Amalek Israël en neemt de palmstad in; Israël dient hem achttien jaar."
      cs: "Eglon, král Moábu, s Amónem a Amalekem poráží Izrael a dobývá město palmové; Izrael mu slouží osmnáct let."
      sv: "Eglon, kung av Moab, slår tillsammans med Ammon och Amalek Israel och intar palmstaden; Israel tjänar honom i arton år."
      nb: "Eglon, Moabs konge, slår, sammen med Ammon og Amalek, Israel og inntar palmebyen; Israel tjener ham i atten år."
      tl: "Sinaktan ni Eglon na hari ng Moab, kasama ang Ammon at Amalec, ang Israel at sinakop ang lungsod ng mga puno ng palma; naglingkod ang Israel sa kaniya nang labingwalong taon."
      da: "Eglon, Moabs konge, slår, sammen med Ammon og Amalek, Israel og indtager Palmebyen; Israel tjener ham i atten år."
      sr: "Еглон, цар моавски, с Амонцима и Амаличанима туче Израиља и осваја Град палми; Израиљ му служи осамнаест година."
      hu: "Eglon, Moáb királya Ammonnal és Amálekkel megveri Izráelt, és elfoglalja a pálmák városát; Izráel tizennyolc évig szolgálja."
      fi: "Moabin kuningas Eglon lyö Israelin yhdessä Ammonin ja Amalekin kanssa ja valtaa palmukaupungin; Israel palvelee häntä kahdeksantoista vuotta."
      vi: "Éc-lôn, vua Mô-áp, cùng với Am-môn và A-ma-léc, đánh Y-sơ-ra-ên và chiếm thành Cây chà là; Y-sơ-ra-ên phải phục dịch người mười tám năm."
      ro: "Eglon, regele Moabului, împreună cu Amon și Amalec, lovește Israelul și ia Cetatea Palmierilor; Israel îi slujește optsprezece ani."
      bg: "Еглон, царят на Моав, заедно с Амон и Амалик поразява Израил и превзема града на палмите; Израил му слугува осемнадесет години."
  - place: ab94aea # Gilgal
    ref: Judg.3.15-Judg.3.25
    note:
      en: "Ehud the left-handed brings Israel's present, turns back from the quarries by Gilgal with a secret errand for the king, and thrusts his dagger into Eglon's belly."
      ru: "Левша Аод приносит дары Израиля, возвращается от истуканов, которые в Галгале, с тайным словом к царю и вонзает меч в чрево Еглона."
      uk: "Лівша Егуд приносить Ізраїлеву данину, повертається від каменоломень біля Гілгала з таємним дорученням до царя й устромляє свій кинджал у черево Еглона."
      es: "Aod, el zurdo, lleva el presente de Israel, regresa desde las canteras junto a Gilgal con un recado secreto para el rey, y hunde su daga en el vientre de Eglón."
      pt: "Eúde, o canhoto, leva o presente de Israel, volta das pedreiras junto a Gilgal com uma missão secreta para o rei e enterra o seu punhal no ventre de Eglom."
      de: "Der linkshändige Ehud bringt Israels Geschenk, kehrt bei den Steinbrüchen von Gilgal um, angeblich mit einem geheimen Auftrag für den König, und stößt Eglon den Dolch in den Bauch."
      fr: "Éhud le gaucher apporte le présent d’Israël, revient des carrières près de Guilgal avec un message secret pour le roi, et lui plonge son poignard dans le ventre."
      pl: "Ehud mańkut zanosi dar od Izraela, zawraca od kamieniołomów koło Gilgal z tajnym poselstwem do króla i wbija sztylet w brzuch Eglona."
      it: "Eud il mancino porta il tributo d’Israele, torna indietro dalle cave presso Gàlgala con un messaggio segreto per il re e immerge il suo pugnale nel ventre di Eglon."
      nl: "De linkshandige Ehud brengt het geschenk van Israël, keert bij de steengroeven bij Gilgal terug met een geheime boodschap voor de koning, en steekt zijn dolk in Eglons buik."
      cs: "Levoruký Ehúd přináší Izraelův dar, vrací se od lomů u Gilgalu s tajnou věcí pro krále a vráží dýku do Eglonova břicha."
      sv: "Den vänsterhänte Ehud bär fram Israels gåva, vänder om från stenbrotten vid Gilgal med ett hemligt ärende till kungen och stöter sin dolk i Eglons buk."
      nb: "Venstrehåndsmannen Ehud bringer Israels gave, vender om ved steinbruddene ved Gilgal med et hemmelig ærend til kongen og støter sin dolk i Eglons buk."
      tl: "Dinala ni Aod na kaliwete ang handog ng Israel, bumalik mula sa mga tibagan malapit sa Gilgal na may lihim na sadya sa hari, at isinaksak ang kaniyang punyal sa tiyan ni Eglon."
      da: "Venstrehåndede Ehud bringer Israels gave, vender om ved stenbruddene ved Gilgal med et hemmeligt ærinde til kongen og støder sin dolk i Eglons bug."
      sr: "Аод левак односи Израиљев дар, враћа се натраг од каменолома код Галгала с тајном поруком за цара и забада бодеж Еглону у трбух."
      hu: "A balkezes Ehúd elviszi Izráel ajándékát, a Gilgál melletti kőfejtőknél visszafordul, mondván, hogy titkos küldetése van a királyhoz, és tőrét Eglon hasába döfi."
      fi: "Vasenkätinen Ehud tuo Israelin lahjan, kääntyy takaisin Gilgalin louhoksilta salaisen asian kanssa kuninkaan luo ja työntää tikarinsa Eglonin vatsaan."
      vi: "Ê-hút, người thuận tay tả, đem lễ cống của Y-sơ-ra-ên đến, rồi từ các hầm đá gần Ghinh-ganh quay lại với một lời tâu kín cho vua, và đâm gươm găm vào bụng Éc-lôn."
      ro: "Ehud, cel stângaci, aduce darul lui Israel, se întoarce de la carierele de lângă Ghilgal cu o solie tainică pentru rege și îi înfige pumnalul în pântecele lui Eglon."
      bg: "Левакът Ехуд донася данъка на Израил, връща се от каменоломните при Галгал с тайно поръчение за царя и забива камата си в корема на Еглон."
  - place: a1aff30 # Seirah
    ref: Judg.3.26-Judg.3.30
    note:
      en: "He escapes to Seirah, blows a trumpet in mount Ephraim, and Israel takes the fords of the Jordan toward Moab; the land has rest eighty years."
      ru: "Он спасается в Сеираф, трубит на горе Ефремовой, и Израиль перехватывает переправу через Иордан к Моаву; земля покоится восемьдесят лет."
      uk: "Він утікає до Сеїри, сурмить у сурму на горі Єфремовій, і Ізраїль захоплює броди Йордану в бік Моаву; земля має спокій вісімдесят років."
      es: "Escapa a Seirat, toca la trompeta en el monte de Efraín, e Israel toma los vados del Jordán hacia Moab; la tierra tiene reposo ochenta años."
      pt: "Escapa para Seira, toca a trombeta no monte Efraim, e Israel toma os vaus do Jordão rumo a Moabe; a terra tem descanso por oitenta anos."
      de: "Er entkommt nach Seïra, stößt im Gebirge Ephraim in die Posaune, und Israel besetzt die Furten des Jordan gegen Moab; das Land hat achtzig Jahre Ruhe."
      fr: "Il s’enfuit à Séira, sonne de la trompette dans la montagne d’Éphraïm, et Israël s’empare des gués du Jourdain du côté de Moab ; le pays est en repos pendant quatre-vingts ans."
      pl: "Ucieka do Seira, trąbi w trąbę w górach Efraima, a Izrael zajmuje brody Jordanu ku Moabowi; kraj ma pokój przez osiemdziesiąt lat."
      it: "Fugge a Seirat, suona la tromba sul monte Efraim, e Israele occupa i guadi del Giordano verso Moab; il paese ha pace per ottant’anni."
      nl: "Hij ontkomt naar Seïra, blaast de bazuin in het Bergland van Efraïm, en Israël bezet de voorden van de Jordaan richting Moab; het land heeft tachtig jaar rust."
      cs: "Uniká do Seiry, troubí na polnici na pohoří Efrajim a Izrael obsazuje jordánské brody směrem k Moábu; země má pokoj osmdesát let."
      sv: "Han undkommer till Seira, blåser i basun i Efraims bergsbygd, och Israel besätter Jordans vadställen mot Moab; landet får ro i åttio år."
      nb: "Han slipper unna til Seira, støter i basun i Efraims fjell, og Israel besetter vadestedene ved Jordan mot Moab; landet har ro i åtti år."
      tl: "Tumakas siya sa Seirath, humihip ng trumpeta sa bundok ng Ephraim, at sinakop ng Israel ang mga tawiran ng Jordan patungo sa Moab; nagkaroon ng kapahingahan ang lupain sa loob ng walumpung taon."
      da: "Han undslipper til Se'ira, støder i horn i Efraims bjergland, og Israel besætter Jordans vadesteder mod Moab; landet har ro i firs år."
      sr: "Бежи у Сераф, затруби у трубу у гори Јефремовој, и Израиљ запоседа бродове јорданске према Моаву; земља има мир осамдесет година."
      hu: "Széirába menekül, harsonát fúj Efraim hegyvidékén, Izráel pedig elfoglalja a Jordán gázlóit Moáb felé; az ország nyolcvan évig nyugalomban él."
      fi: "Hän pakenee Seiraan, puhaltaa torveen Efraimin vuoristossa, ja Israel valtaa Jordanin kahlauspaikat Moabin suunnalla; maa saa levon kahdeksaksikymmeneksi vuodeksi."
      vi: "Người trốn đến Sê-i-rát, thổi kèn trong núi Ép-ra-im, và Y-sơ-ra-ên chiếm các chỗ cạn sông Giô-đanh về phía Mô-áp; xứ được hưởng bình an tám mươi năm."
      ro: "Scapă la Seira, sună din trâmbiță în muntele lui Efraim, iar Israel ocupă vadurile Iordanului spre Moab; țara are odihnă optzeci de ani."
      bg: "Той избягва в Сеира, затръбява в Ефремовата планина и Израил завзема бродовете на Йордан към Моав; земята си почива осемдесет години."
  - place: aaff3e1 # Tob
    ref: Judg.11.1-Judg.11.3
    note:
      en: "Jephthah the Gileadite, driven out by his brothers, flees to the land of Tob, where vain men gather to him."
      ru: "Иеффай Галаадитянин, изгнанный братьями, убегает в землю Тов, и к нему собираются праздные люди."
      uk: "Єфтай Гілеадянин, вигнаний братами, тікає до землі Тов, де до нього збираються пусті люди."
      es: "Jefté el galaadita, expulsado por sus hermanos, huye a la tierra de Tob, donde se juntan con él hombres ociosos."
      pt: "Jefté, o gileadita, expulso pelos irmãos, foge para a terra de Tobe, onde homens vadios se juntam a ele."
      de: "Jeftah, der Gileaditer, von seinen Brüdern vertrieben, flieht ins Land Tob, wo sich lose Männer um ihn sammeln."
      fr: "Jephté le Galaadite, chassé par ses frères, s’enfuit au pays de Tob, où des vauriens se rassemblent auprès de lui."
      pl: "Jefte Gileadczyk, wygnany przez swoich braci, ucieka do ziemi Tob, gdzie gromadzą się wokół niego próżni ludzie."
      it: "Iefte il Galaadita, scacciato dai suoi fratelli, fugge nel paese di Tob, dove si raccolgono intorno a lui uomini da nulla."
      nl: "Jefta, de Gileadiet, door zijn broers verdreven, vlucht naar het land Tob, waar nietsnutten zich bij hem voegen."
      cs: "Gileadský Jiftách, vyhnaný svými bratry, prchá do země Tób, kde se k němu shromažďují lehkomyslní muži."
      sv: "Jefta från Gilead, bortdriven av sina bröder, flyr till landet Tov, där löst folk samlas kring honom."
      nb: "Gileaditten Jefta, jaget bort av sine brødre, flykter til Tobs land, hvor løse menn samler seg om ham."
      tl: "Si Jephte na taga-Gilead, pinalayas ng kaniyang mga kapatid, ay tumakas sa lupain ng Tob, kung saan nagtipon sa kaniya ang mga taong walang kabuluhan."
      da: "Gileaditten Jefta, fordrevet af sine brødre, flygter til Tobs land, hvor ørkesløse mænd slutter sig til ham."
      sr: "Јефтај Галађанин, прогнан од браће, бежи у земљу Тов, где се око њега скупљају испразни људи."
      hu: "A gileádi Jefte, akit testvérei elűztek, Tób földjére menekül, ahol hitvány emberek gyűlnek köré."
      fi: "Gileadilainen Jefta, veljiensä karkottama, pakenee Tobin maahan, jonne kokoontuu hänen luokseen kelvottomia miehiä."
      vi: "Giép-thê người Ga-la-át, bị các anh em đuổi, trốn đến xứ Tóp, nơi những kẻ hư không hiệp lại quanh người."
      ro: "Ieftae din Galaad, alungat de frații săi, fuge în țara Tob, unde se strâng în jurul lui oameni de nimic."
      bg: "Галаадецът Йефтай, изгонен от братята си, бяга в земята Тов, където около него се събират празни хора."
  - place: a0f8af9 # Mizpah
    ref: Judg.11.4-Judg.11.11
    note:
      en: "When Ammon makes war, the elders of Gilead fetch him; the people make him head and captain, and he utters all his words before the Lord in Mizpeh."
      ru: "Когда Аммонитяне начинают войну, старейшины Галаада призывают его; народ ставит его начальником и вождём, и в Массифе он произносит все слова свои пред лицом Господа."
      uk: "Коли Аммон починає війну, старійшини Гілеаду приводять його; народ ставить його головою й проводирем, і він викладає всі свої слова перед Господом у Міцпі."
      es: "Cuando Amón hace la guerra, los ancianos de Galaad van a buscarlo; el pueblo lo hace cabeza y capitán, y él expone todas sus palabras ante el Señor en Mizpa."
      pt: "Quando Amom faz guerra, os anciãos de Gileade vão buscá-lo; o povo o faz chefe e comandante, e ele profere todas as suas palavras perante o Senhor em Mispá."
      de: "Als Ammon Krieg führt, holen ihn die Ältesten von Gilead; das Volk macht ihn zum Haupt und Obersten, und er trägt alle seine Worte vor dem Herrn in Mizpe vor."
      fr: "Quand Ammon fait la guerre, les anciens de Galaad vont le chercher ; le peuple l’établit chef et commandant, et il prononce toutes ses paroles devant l’Éternel à Mitspé."
      pl: "Gdy Ammon wypowiada wojnę, starsi Gileadu sprowadzają go; lud ustanawia go wodzem i dowódcą, a on wypowiada wszystkie swoje słowa przed Panem w Mispie."
      it: "Quando Ammon muove guerra, gli anziani di Galaad vanno a cercarlo; il popolo lo fa suo capo e comandante, ed egli espone tutte le sue parole davanti al Signore a Mizpa."
      nl: "Als Ammon oorlog voert, halen de oudsten van Gilead hem terug; het volk maakt hem tot hoofd en overste, en hij spreekt al zijn woorden uit voor het aangezicht van de HEER te Mizpa."
      cs: "Když Amón začíná válku, pro něho jdou gileadští starší; lid ho ustanovuje za vůdce a knížete a on mluví všechna svá slova před Hospodinem v Micpe."
      sv: "När Ammon för krig hämtar Gileads äldste honom; folket gör honom till huvudman och anförare, och han framför alla sina ord inför Herren i Mispe."
      nb: "Da Ammon fører krig, henter Gileads eldste ham; folket gjør ham til overhode og anfører, og han legger frem alle sine ord for Herren i Mispe."
      tl: "Nang makipagdigma ang Ammon, sinundo siya ng mga matanda ng Gilead; ginawa siyang pinuno at kapitan ng bayan, at sinabi niya ang lahat ng kaniyang mga salita sa harap ng Panginoon sa Mizpe."
      da: "Da Ammon fører krig, henter Gileads ældste ham; folket gør ham til høvding og anfører, og han fremsiger alle sine ord for Herrens ansigt i Mispa."
      sr: "Кад Амон зарати, старешине галадске одлазе по њега; народ га поставља за старешину и војводу, и он износи све речи своје пред Господом у Масфи."
      hu: "Amikor Ammon háborút indít, Gileád vénei elhívják; a nép fejévé és vezérévé teszi, ő pedig Micpében az Úr színe előtt elmond minden szavát."
      fi: "Kun Ammon käy sotaan, Gileadin vanhimmat hakevat hänet; kansa tekee hänet päämiehekseen ja päälliköksensä, ja hän lausuu kaikki sanansa Herran edessä Mispassa."
      vi: "Khi Am-môn gây chiến, các trưởng lão Ga-la-át đi tìm người; dân sự lập người làm đầu và tướng, và tại Mích-ba người lặp lại trước mặt Đức Giê-hô-va hết thảy những lời mình."
      ro: "Când Amon pornește război, bătrânii Galaadului vin după el; poporul îl face căpetenie și conducător, iar el își rostește toate cuvintele înaintea Domnului la Mițpe."
      bg: "Когато Амон започва война, галаадските старейшини го довеждат; народът го поставя за глава и началник и той изрича всичките си думи пред Господа в Мицпа."
  - place: af74969 # Aroer
    ref: Judg.11.29-Judg.11.33
    note:
      en: "He vows that whatever comes out of his doors to meet him shall be the Lord's, and smites Ammon from Aroer to Minnith, twenty cities."
      ru: "Он даёт обет: что выйдет из ворот дома его навстречу ему, будет Господу, и поражает Аммонитян от Ароера до Минифа, двадцать городов."
      uk: "Він обіцяє, що все, що вийде з дверей його дому назустріч йому, буде Господнє, і б’є Аммон від Ароера до Мініту, двадцять міст."
      es: "Hace voto de que lo que salga de las puertas de su casa a recibirlo será del Señor, e hiere a Amón desde Aroer hasta Minit, veinte ciudades."
      pt: "Faz voto de que aquilo que sair das portas de sua casa ao seu encontro será do Senhor, e fere Amom desde Aroer até Minite, vinte cidades."
      de: "Er gelobt, was ihm aus seiner Tür entgegenkomme, solle dem Herrn gehören, und schlägt Ammon von Aroër bis Minnit, zwanzig Städte."
      fr: "Il fait le vœu que celui qui sortira des portes de sa maison à sa rencontre sera consacré à l’Éternel, et il bat Ammon depuis Aroër jusque vers Minnith, vingt villes."
      pl: "Ślubuje, że cokolwiek wyjdzie z jego drzwi na jego spotkanie, będzie Pańskie, i bije Ammona od Aroeru aż do Minnit, dwadzieścia miast."
      it: "Fa voto che ciò che uscirà dalla porta di casa sua per venirgli incontro sarà del Signore, e batte Ammon da Aroer fino a Minnit, venti città."
      nl: "Hij belooft dat wat hem uit zijn deuren tegemoet komt, de HEER zal toebehoren, en slaat Ammon van Aroër tot Minnit, twintig steden."
      cs: "Slibuje, že cokoli vyjde ze dveří jeho domu naproti němu, bude Hospodinovo, a bije Amón od Aroeru až po Minit, dvacet měst."
      sv: "Han lovar att det som kommer ut genom hans dörrar för att möta honom ska tillhöra Herren, och slår Ammon från Aroer till Minnit, tjugo städer."
      nb: "Han lover at det som kommer ut av hans dører for å møte ham, skal tilhøre Herren, og slår Ammon fra Aroer til Minnit, tyve byer."
      tl: "Nanata siya na ang anumang lumabas sa kaniyang mga pintuan upang salubungin siya ay magiging sa Panginoon, at sinaktan niya ang Ammon mula sa Aroer hanggang sa Minnith, dalawampung lungsod."
      da: "Han aflægger det løfte, at det, der kommer ud af hans dør for at møde ham, skal tilhøre Herren, og slår Ammon fra Aroer til Minnit, tyve byer."
      sr: "Заветује се да ће оно што му први изиђе из врата у сусрет бити Господње, и туче Амон од Ароира до Минита, двадесет градова."
      hu: "Fogadalmat tesz, hogy ami házának ajtajából eléje jön, az az Úré lesz, és Aróertől Minnitig megveri Ammont, húsz várost."
      fi: "Hän vannoo, että mikä tahansa tulee ulos hänen ovistaan häntä vastaan, on oleva Herran, ja lyö Ammonin Aroerista Minnitiin saakka, kaksikymmentä kaupunkia."
      vi: "Người khấn nguyện rằng hễ ai từ cửa nhà người đi ra đón mình thì sẽ thuộc về Đức Giê-hô-va, rồi đánh bại Am-môn từ A-rô-e cho đến Min-nít, hai mươi thành."
      ro: "Juruiește că orice va ieși pe ușile casei lui în întâmpinarea lui va fi al Domnului și lovește pe Amon de la Aroer până la Minit, douăzeci de cetăți."
      bg: "Той се обрича, че каквото излезе от вратите му да го посрещне, ще бъде Господне, и поразява Амон от Ароер до Минит — двадесет града."
  - place: a0f8af9 # Mizpah
    ref: Judg.11.34-Judg.11.40
    note:
      en: 'At Mizpeh his only daughter comes out to meet him with timbrels and dances: "Alas, my daughter! thou hast brought me very low."'
      ru: "В Массифе навстречу ему выходит с тимпанами и ликами его единственная дочь: «ах, дочь моя! ты сразила меня»."
      uk: "У Міцпі назустріч йому з бубнами й танцями виходить його єдина донька: «Ой доненько ж моя! як ти пригнула мене к земли!»"
      es: "En Mizpa su hija única sale a recibirlo con adufes y danzas: «¡Ay, hija mía! de verdad me has abatido»."
      pt: "Em Mispá, sua filha única sai ao seu encontro com tamborins e danças: “Ah, minha filha! Você me prostrou profundamente.”"
      de: "In Mizpe kommt ihm seine einzige Tochter mit Pauken und Reigen entgegen: „Ach, meine Tochter, wie beugst du mich und betrübst mich!“"
      fr: "À Mitspé, sa fille unique sort à sa rencontre avec des tambourins et des danses : « Ah ! ma fille ! Tu me jettes dans l’abattement. »"
      pl: "W Mispie wychodzi mu na spotkanie jego jedyna córka z bębnami i tańcami: „Ach, córko moja, bardzoś mię poniżyła!”"
      it: "A Mizpa la sua unica figlia gli esce incontro con timpani e danze: «Ah, figlia mia! tu mi accasci, tu mi accasci»."
      nl: "Te Mizpa komt zijn enige dochter hem tegemoet met tamboerijnen en reidansen: “Ach, mijn dochter! gij hebt mij ganselijk nedergebogen.”"
      cs: "V Micpe mu vychází vstříc jeho jediná dcera s bubny a v tanci: „Ach, dcero má, velices mne ponížila.“"
      sv: "I Mispe kommer hans enda dotter ut för att möta honom med pukor och dans: ”Ve mig, min dotter, du kommer mig att sjunka till jorden.”"
      nb: "I Mispe kommer hans eneste datter ut for å møte ham med tamburiner og dans: «Akk, min datter, hvilken sorg du volder mig, hvilken ulykke du fører over mig!»"
      tl: "Sa Mizpe, lumabas ang kaniyang bugtong na anak na babae upang salubungin siya na may mga pandereta at sayawan: “Sa aba ko, aking anak! pinapakumbaba mo akong lubos.”"
      da: "I Mispa kommer hans eneste datter ham i møde med tamburiner og dans: »Ak, min Datter! du har nedbøjet mig saare«."
      sr: "У Масфи му у сусрет излази једина кћи с бубњевима и играма: „Ах кћери моја! Веле ли ме обори!“"
      hu: "Micpében egyetlen lánya jön eléje dobokkal és táncokkal: „Óh leányom, de megszomorítottál és megháborítottál engem!”"
      fi: "Mispassa hänen ainoa tyttärensä tulee ulos häntä vastaan vaskirumpua lyöden ja karkeloiden: ”Voi, tyttäreni, nyt sinä masennat minut maahan…”"
      vi: "Tại Mích-ba, con gái một của người ra đón người, cầm trống nhỏ và nhảy múa: “con, than ôi! con gây cho cha tức tối quá thay!”"
      ro: "La Mițpe, singura lui fiică îi iese înainte cu timpane și jocuri: „vai de mine, fiica mea, m’ai împiedecat”."
      bg: "В Мицпа единствената му дъщеря излиза да го посрещне с тъпанчета и хора: „Горко ми, дъщи моя! ти съвсем си ме закопала“."
  - place: ae686c9 # Jordan
    ref: Judg.12.1-Judg.12.6
    note:
      en: 'At the passages of Jordan the men of Gilead know the men of Ephraim by one word: "Say now Shibboleth."'
      ru: "У переправы через Иордан Галаадитяне узнают Ефремлян по одному слову: «скажи: шибболет»."
      uk: "На переправах через Йордан мужі Гілеаду пізнають мужів Єфрема за одним словом: «А скажи ж: Шибболет»."
      es: "En los vados del Jordán los hombres de Galaad reconocen a los de Efraín por una sola palabra: «Ahora pues, di, Shiboleth»."
      pt: "Nos vaus do Jordão, os homens de Gileade reconhecem os homens de Efraim por uma só palavra: “Agora diga ‘Chibolete’.”"
      de: "An den Furten des Jordan erkennen die Männer von Gilead die Männer von Ephraim an einem einzigen Wort: „hießen sie ihn sprechen: Schiboleth“."
      fr: "Aux gués du Jourdain, les hommes de Galaad reconnaissent les hommes d’Éphraïm à un seul mot : « Hé bien, dis Schibboleth. »"
      pl: "Na brodach Jordanu mężowie z Gileadu rozpoznają mężów z Efraima po jednym słowie: „Wymówże teraz Szybolet”."
      it: "Ai guadi del Giordano gli uomini di Galaad riconoscono gli uomini di Efraim da una parola: «Ebbene, di’ Scibboleth»."
      nl: "Bij de overgangen van de Jordaan herkennen de mannen van Gilead de mannen van Efraïm aan één woord: “Zeg nu Schibboleth.”"
      cs: "U jordánských brodů poznávají gileadští muži Efrajimce podle jediného slova: „Rci hned Šibolet.“"
      sv: "Vid Jordans vadställen känner Gileads män igen Efraims män på ett enda ord: ”Säg ’schibbolet’.”"
      nb: "Ved Jordans overganger kjenner Gileads menn Efraims menn på ett ord: «Si sjibbolet!»"
      tl: "Sa mga tawiran ng Jordan, nakilala ng mga lalaki ng Gilead ang mga lalaki ng Ephraim sa isang salita: “Sabihin mong Shiboleth.”"
      da: "Ved Jordans overgange kender Gileads mænd Efraims mænd på ét ord: »Kære, sig: Sjibboleth«."
      sr: "На бродовима јорданским људи галадски познају људе јефремске по једној речи: „Реци: Шиболет.“"
      hu: "A Jordán gázlóinál Gileád férfiai egyetlen szóról ismerik fel Efraim férfiait: „Mondd: Sibboleth!”"
      fi: "Jordanin kahlauspaikoilla Gileadin miehet tunnistavat Efraimin miehet yhdestä sanasta: ”Sano ’shibbolet’”."
      vi: "Tại các chỗ cạn của sông Giô-đanh, người Ga-la-át nhận ra người Ép-ra-im bởi một tiếng: “Thế thì, hãy nói: Si-bô-lết.”"
      ro: "La vadurile Iordanului, bărbații din Galaad îi recunosc pe efraimiți după un singur cuvânt: „ziceți dar: Shivolet”."
      bg: "При бродовете на Йордан галаадците разпознават ефремците по една дума: „Речи Шиболет“."
