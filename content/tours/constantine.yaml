      url: "https://www.newadvent.org/fathers/25023.htm"
    note:
      en: "His mother Helena dedicates two churches: one at the cave of the Saviour's birth in Bethlehem, the other on the mount of his ascension."
      ru: "Его мать Елена освящает две церкви: одну у пещеры Рождества Спасителя в Вифлееме, другую на горе Вознесения."
      uk: "Його мати Єлена освячує дві церкви: одну при печері Різдва Спасителя у Вифлеємі, другу на горі Його вознесіння."
      es: "Su madre Elena dedica dos iglesias: una en la cueva del nacimiento del Salvador, en Belén, y la otra en el monte de su ascensión."
      pt: "Sua mãe, Helena, consagra duas igrejas: uma na gruta do nascimento do Salvador, em Belém, a outra no monte da sua ascensão."
      de: "Seine Mutter Helena weiht zwei Kirchen: die eine an der Höhle der Geburt des Erlösers in Bethlehem, die andere auf dem Berg seiner Himmelfahrt."
      fr: "Sa mère Hélène consacre deux églises : l’une à la grotte de la naissance du Sauveur, à Bethléem, l’autre sur le mont de son ascension."
      pl: "Jego matka Helena poświęca dwa kościoły: jeden przy jaskini narodzin Zbawiciela w Betlejem, drugi na górze Jego wniebowstąpienia."
      it: "Sua madre Elena dedica due chiese: una presso la grotta della nascita del Salvatore a Betlemme, l’altra sul monte della sua ascensione."
      nl: "Zijn moeder Helena wijdt twee kerken in: de ene bij de grot waar de Heiland werd geboren in Bethlehem, de andere op de berg van zijn hemelvaart."
      cs: "Jeho matka Helena zasvěcuje dva kostely: jeden u jeskyně narození Spasitele v Betlémě, druhý na hoře jeho nanebevstoupení."
      sv: "Hans mor Helena invigar två kyrkor: den ena vid grottan där Frälsaren föddes i Betlehem, den andra på berget där han steg upp till himlen."
      nb: "Moren hans, Helena, innvier to kirker: den ene ved hulen der Frelseren ble født, i Betlehem, den andre på fjellet der han for opp til himmelen."
      tl: "Itinatalaga ng kaniyang inang si Helena ang dalawang simbahan: ang isa sa yungib ng kapanganakan ng Tagapagligtas sa Bethlehem, ang isa sa bundok ng kaniyang pag-akyat sa langit."
      da: "Hans mor Helena indvier to kirker: den ene ved hulen, hvor Frelseren blev født, i Betlehem, den anden på bjerget, hvorfra han for til himmels."
      sr: "Његова мајка Јелена посвећује две цркве: једну над пећином Спаситељевог рођења у Витлејему, другу на гори његовог вазнесења."
      hu: "Anyja, Heléna két templomot szentel fel: egyet Betlehemben, az Üdvözítő születésének barlangjánál, a másikat a mennybemenetelének hegyén."
      fi: "Hänen äitinsä Helena vihkii kaksi kirkkoa: toisen Vapahtajan syntymäluolan kohdalle Betlehemiin, toisen hänen taivaaseenastumisensa vuorelle."
      vi: "Mẹ ông là Helena cung hiến hai nhà thờ: một ở hang nơi Đấng Cứu Thế giáng sinh tại Bết-lê-hem, một ở trên núi nơi Ngài thăng thiên."
      ro: "Mama sa, Elena, închină două biserici: una la peștera Nașterii Mântuitorului din Betleem, cealaltă pe muntele Înălțării Lui."
      bg: "Майка му Елена посвещава две църкви: едната при пещерата на раждането на Спасителя във Витлеем, другата на хълма на неговото възнесение."
  - place: Q16869 # Constantinople
    year: "AD 330"
