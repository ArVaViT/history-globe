    note:
      en: "The bishops sit waiting in silence in the great hall of the palace. Constantine enters, preceded not by soldiers or guards but only by friends in the faith, and takes his seat in the council."
      ru: "Епископы сидят в молчании и ждут в главном зале дворца. Входит Константин, перед ним идут не воины и стража, а лишь друзья по вере, и он занимает своё место в соборе."
      uk: "Єпископи в тиші сидять і чекають у великій залі палацу. Входить Костянтин, перед яким ідуть не воїни й не охоронці, а лише друзі по вірі, і займає своє місце на соборі."
      es: "Los obispos esperan sentados en silencio en la gran sala del palacio. Constantino entra, precedido no por soldados ni guardias, sino solo por amigos en la fe, y toma asiento en el concilio."
      pt: "Os bispos esperam sentados em silêncio no grande salão do palácio. Constantino entra, precedido não por soldados nem por guardas, mas apenas por amigos na fé, e toma assento no concílio."
      de: "Die Bischöfe sitzen schweigend im großen Saal des Palastes und warten. Konstantin tritt ein; vor ihm gehen nicht Soldaten oder Leibwächter, sondern nur Freunde im Glauben, und er nimmt seinen Platz im Konzil ein."
      fr: "Les évêques attendent assis en silence dans la grande salle du palais. Constantin entre, précédé non de soldats ni de gardes, mais seulement d’amis dans la foi, et prend place au concile."
      pl: "Biskupi siedzą w milczeniu i czekają w wielkiej sali pałacu. Wchodzi Konstantyn, poprzedzany nie przez żołnierzy czy straż, lecz tylko przez przyjaciół w wierze, i zajmuje miejsce na soborze."
      it: "I vescovi siedono in silenzio, in attesa, nella grande sala del palazzo. Costantino entra, preceduto non da soldati o guardie ma soltanto da amici nella fede, e prende posto nel concilio."
      nl: "De bisschoppen zitten zwijgend te wachten in de grote zaal van het paleis. Constantijn komt binnen, niet voorafgegaan door soldaten of lijfwachten maar alleen door vrienden in het geloof, en neemt plaats in het concilie."
      cs: "Biskupové mlčky čekají ve velkém sále paláce. Vstupuje Konstantin, před nímž nejdou vojáci ani stráže, jen přátelé ve víře, a usedá na místo v koncilu."
      sv: "Biskoparna sitter tysta och väntar i palatsets stora sal. Konstantin träder in, föregången inte av soldater eller vakter utan bara av vänner i tron, och tar plats i konciliet."
      nb: "Biskopene sitter og venter i stillhet i palassets store sal. Konstantin trer inn, ikke med soldater eller livvakter foran seg, men bare venner i troen, og tar plass i kirkemøtet."
      tl: "Naghihintay nang tahimik ang mga obispo sa dakilang bulwagan ng palasyo. Pumapasok si Constantino, na hindi mga kawal o bantay ang nauuna sa kaniya kundi mga kaibigan lamang sa pananampalataya, at umuupo sa konseho."
      da: "Biskopperne sidder og venter i stilhed i paladsets store sal. Konstantin træder ind, foran sig ikke soldater eller livvagter, men kun venner i troen, og tager plads i koncilet."
      sr: "Епископи седе и ћутке чекају у великој дворани палате. Константин улази, а испред њега не иду војници ни стражари, већ само пријатељи по вери, и заузима своје место на сабору."
      hu: "A püspökök némán várakoznak a palota nagy termében. Constantinus belép, nem katonák vagy testőrök járnak előtte, hanem csupán hitbeli barátai, és elfoglalja helyét a zsinaton."
      fi: "Piispat istuvat hiljaa odottamassa palatsin suuressa salissa. Konstantinus astuu sisään, ei sotilaiden eikä henkivartijoiden edeltämänä vaan ainoastaan uskossa olevien ystävien, ja ottaa paikkansa kirkolliskokouksessa."
      vi: "Các giám mục ngồi lặng lẽ chờ trong đại sảnh của cung điện. Constantinus bước vào, không có lính hay vệ binh đi trước, chỉ có những người bạn cùng đức tin, và an tọa trong công đồng."
      ro: "Episcopii stau și așteaptă în tăcere în sala cea mare a palatului. Constantin intră, precedat nu de soldați sau de gardieni, ci doar de prieteni întru credință, și își ia locul în sinod."
      bg: "Епископите седят и чакат мълчаливо в голямата зала на двореца. Константин влиза, предшестван не от войници или стражи, а само от приятели във вярата, и заема мястото си на събора."
