      url: "https://www.newadvent.org/fathers/25024.htm"
    note:
      en: "Fallen ill, he goes to the city named after his mother. In its church of the martyrs he prays, and for the first time receives the laying on of hands."
      ru: "Заболев, он едет в город, названный в честь его матери. В тамошней церкви мучеников он молится и впервые принимает возложение рук."
      uk: "Занедужавши, він їде до міста, названого на честь його матері. У тамтешній церкві мучеників він молиться і вперше приймає покладання рук."
      es: "Enfermo, va a la ciudad que lleva el nombre de su madre. En la iglesia de los mártires de la ciudad ora y, por primera vez, recibe la imposición de manos."
      pt: "Doente, vai à cidade que tem o nome de sua mãe. Na igreja dos mártires dessa cidade, ora e recebe pela primeira vez a imposição das mãos."
      de: "Erkrankt, begibt er sich in die nach seiner Mutter benannte Stadt. In der dortigen Märtyrerkirche betet er und empfängt zum ersten Mal die Handauflegung."
      fr: "Tombé malade, il se rend dans la ville qui porte le nom de sa mère. Dans l’église des martyrs de cette ville, il prie et reçoit pour la première fois l’imposition des mains."
      pl: "Zachorowawszy, udaje się do miasta nazwanego imieniem jego matki. W tamtejszym kościele męczenników modli się i po raz pierwszy przyjmuje włożenie rąk."
      it: "Caduto malato, va alla città che porta il nome di sua madre. Nella chiesa dei martiri della città prega, e per la prima volta riceve l’imposizione delle mani."
      nl: "Ziek geworden begeeft hij zich naar de stad die naar zijn moeder is genoemd. In haar martelarenkerk bidt hij, en ontvangt hij voor het eerst de handoplegging."
      cs: "Když onemocní, odjíždí do města pojmenovaného po své matce. V tamním kostele mučedníků se modlí a poprvé přijímá vkládání rukou."
      sv: "Sedan han har insjuknat reser han till staden som är uppkallad efter hans mor. I dess martyrkyrka ber han, och för första gången tar han emot handpåläggning."
      nb: "Etter å ha blitt syk drar han til byen som er oppkalt etter moren hans. I byens martyrkirke ber han, og for første gang mottar han håndspåleggelse."
      tl: "Nang magkasakit, pumupunta siya sa lungsod na ipinangalan sa kaniyang ina. Sa simbahan nito ng mga martir ay nananalangin siya, at sa unang pagkakataon ay tumatanggap ng pagpapatong ng mga kamay."
      da: "Da han er blevet syg, rejser han til den by, der er opkaldt efter hans mor. I dens martyrkirke beder han, og for første gang modtager han håndspålæggelse."
      sr: "Оболео, одлази у град назван по својој мајци. У тамошњој цркви мученика моли се и први пут прима полагање руку."
      hu: "Megbetegedve az anyjáról elnevezett városba megy. Az ottani vértanútemplomban imádkozik, és először részesül kézrátételben."
      fi: "Sairastuttuaan hän matkaa äitinsä mukaan nimettyyn kaupunkiin. Sen marttyyrien kirkossa hän rukoilee ja saa ensimmäistä kertaa kätten päällepanemisen."
      vi: "Lâm bệnh, ông đến thành phố mang tên mẹ mình. Trong nhà thờ các thánh tử đạo ở đó ông cầu nguyện, và lần đầu tiên được đặt tay."
      ro: "Îmbolnăvindu-se, merge în cetatea care poartă numele mamei sale. În biserica martirilor de acolo se roagă și primește pentru prima dată punerea mâinilor."
      bg: "Разболял се, той отива в града, наречен на майка му. В църквата на мъчениците там се моли и за първи път получава полагане на ръце."
  - place: "511337" # Nicomedia
    year: "AD 337"
    source:
      cite:
        en: "Eusebius, Life of Constantine 4.61-64"
        ru: "Евсевий, Жизнь Константина 4.61-64"
        uk: "Євсевій, Життя Костянтина 4.61-64"
        es: "Eusebio de Cesarea, Vida de Constantino 4.61-64"
        pt: "Eusébio, Vida de Constantino 4.61-64"
        de: "Eusebius, Leben Konstantins 4.61-64"
        fr: "Eusèbe, Vie de Constantin 4.61-64"
        pl: "Euzebiusz, Żywot Konstantyna 4.61-64"
        it: "Eusebio, Vita di Costantino 4.61-64"
        nl: "Eusebius, Leven van Constantijn 4.61-64"
        cs: "Eusebios, Život Konstantina 4.61-64"
        sv: "Eusebios, Konstantins liv 4.61-64"
        nb: "Eusebios, Konstantins liv 4.61-64"
        tl: "Eusebio, Buhay ni Constantino 4.61-64"
        da: "Eusebios, Konstantins liv 4.61-64"
        sr: "Јевсевије, Живот Константина 4.61-64"
        hu: "Eusebios, Constantinus élete 4.61-64"
        fi: "Eusebios, Konstantinuksen elämä 4.61-64"
        vi: "Eusebius, Cuộc đời Constantinus 4.61-64"
        ro: "Eusebiu, Viața lui Constantin 4.61-64"
        bg: "Евсевий, Животът на Константин 4.61-64"
      url: "https://www.newadvent.org/fathers/25024.htm"
    note:
      en: "In the suburbs of Nicomedia he tells the bishops he had hoped to be baptized in the Jordan. They baptize him where he is, and he dies about noon on the last day of the fifty days, Pentecost itself."
      ru: "В предместье Никомидии он говорит епископам, что надеялся креститься в водах Иордана. Они крестят его там же, и около полудня, в последний день пятидесятидневного праздника, в самую Пятидесятницу, он умирает."
      uk: "У передмісті Нікомедії він каже єпископам, що сподівався охреститися в Йордані. Вони хрестять його там же, і він помирає близько полудня в останній із п’ятдесяти днів, у саму П’ятидесятницю."
      es: "En las afueras de Nicomedia dice a los obispos que había esperado ser bautizado en el Jordán. Ellos lo bautizan allí, y muere hacia el mediodía del último de los cincuenta días, el mismo día de Pentecostés."
      pt: "Nos subúrbios de Nicomédia, diz aos bispos que esperava ser batizado no Jordão. Eles o batizam ali mesmo, e ele morre por volta do meio-dia, no último dos cinquenta dias, o próprio Pentecostes."
      de: "In einem Vorort von Nikomedia sagt er den Bischöfen, er habe gehofft, im Jordan getauft zu werden. Sie taufen ihn an Ort und Stelle, und er stirbt gegen Mittag am letzten der fünfzig Tage, am Pfingstfest selbst."
      fr: "Dans les faubourgs de Nicomédie, il dit aux évêques qu’il avait espéré être baptisé dans le Jourdain. Ils le baptisent là, et il meurt vers midi, le dernier des cinquante jours, le jour même de la Pentecôte."
      pl: "Na przedmieściach Nikomedii mówi biskupom, że miał nadzieję przyjąć chrzest w Jordanie. Chrzczą go na miejscu, a on umiera około południa ostatniego dnia owych pięćdziesięciu dni, w samo święto Pięćdziesiątnicy."
      it: "Nei sobborghi di Nicomedia dice ai vescovi che aveva sperato di essere battezzato nel Giordano. Lo battezzano sul posto, ed egli muore verso mezzogiorno nell’ultimo dei cinquanta giorni, la Pentecoste stessa."
      nl: "In een voorstad van Nicomedia zegt hij tegen de bisschoppen dat hij had gehoopt in de Jordaan gedoopt te worden. Zij dopen hem daar, en hij sterft omstreeks het middaguur op de laatste dag van de vijftig dagen, op Pinksteren zelf."
      cs: "Na předměstí Nikomédie říká biskupům, že doufal, že bude pokřtěn v Jordánu. Biskupové ho tam pokřtí a on umírá kolem poledne posledního z padesáti dnů, o samotných Letnicích."
      sv: "I Nikomedias utkanter säger han till biskoparna att han hade hoppats bli döpt i Jordan. De döper honom där, och han dör omkring middagstid på den sista av de femtio dagarna, själva pingstdagen."
      nb: "I forstedene til Nikomedia forteller han biskopene at han hadde håpet å bli døpt i Jordan. De døper ham der, og han dør omkring middagstid på den siste dagen av de femti dagene, selve pinsedagen."
      tl: "Sa mga karatig ng Nicomedia ay sinasabi niya sa mga obispo na inasam niyang mabautismuhan sa Jordan. Binabautismuhan nila siya roon, at namamatay siya bandang tanghali sa huling araw ng limampung araw, ang mismong Pentecostes."
      da: "I Nikomedeias forstæder fortæller han biskopperne, at han havde håbet at blive døbt i Jordan. De døber ham dér, og han dør omkring middag på den sidste dag af de halvtreds dage, selve pinsedagen."
      sr: "У предграђу Никомедије каже епископима да се надао да ће бити крштен у Јордану. Они га ту крсте, а он умире око подне последњег од педесет дана, на сам празник Педесетнице."
      hu: "Nikomédeia külvárosában azt mondja a püspököknek, hogy azt remélte, hogy a Jordánban keresztelkedik meg. Ott keresztelik meg, és az ötven nap utolsó napján, magán pünkösd napján, dél körül meghal."
      fi: "Nikomedian esikaupunkialueella hän kertoo piispoille toivoneensa tulevansa kastetuksi Jordanissa. He kastavat hänet siellä, ja hän kuolee noin puolenpäivän aikaan viidenkymmenen päivän viimeisenä päivänä, itse helluntaina."
      vi: "Ở vùng ngoại ô Nicomedia, ông nói với các giám mục rằng mình từng hy vọng được làm báp-têm ở sông Giô-đanh. Họ làm báp-têm cho ông tại đó, và ông qua đời vào khoảng buổi trưa của ngày cuối cùng trong năm mươi ngày, chính là lễ Ngũ Tuần."
      ro: "În împrejurimile Nicomediei le spune episcopilor că sperase să fie botezat în Iordan. Ei îl botează acolo, iar el moare spre amiază, în ultima zi a celor cincizeci de zile, chiar în ziua Cincizecimii."
      bg: "В предградията на Никомедия казва на епископите, че се е надявал да бъде кръстен в Йордан. Те го кръщават там и той умира около пладне в последния ден на петдесетте дни, самата Петдесетница."
