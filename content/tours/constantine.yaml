    note:
      en: "To honour the city that bears his name, he fills it and its outskirts with churches and great memorials of the martyrs, and so consecrates it to the martyrs' God."
      ru: "Чтобы почтить город, носящий его имя, он наполняет его и окрестности храмами и большими памятниками мученикам и так посвящает город Богу мучеников."
      uk: "Щоб віддати честь місту, яке носить його ім’я, він наповнює його та околиці церквами й величними пам’ятниками мучеників і так присвячує його Богові мучеників."
      es: "Para honrar a la ciudad que lleva su nombre, la llena, a ella y a sus alrededores, de iglesias y de grandes memoriales de los mártires, y así la consagra al Dios de los mártires."
      pt: "Para honrar a cidade que leva o seu nome, ele a enche, com seus arredores, de igrejas e grandes memoriais dos mártires, consagrando-a assim ao Deus dos mártires."
      de: "Um die Stadt zu ehren, die seinen Namen trägt, füllt er sie und ihre Umgebung mit Kirchen und großen Gedenkstätten der Märtyrer und weiht sie so dem Gott der Märtyrer."
      fr: "Pour honorer la ville qui porte son nom, il la remplit, elle et ses environs, d’églises et de grands monuments des martyrs, et la consacre ainsi au Dieu des martyrs."
      pl: "Aby uczcić miasto noszące jego imię, napełnia je i jego okolice kościołami i wielkimi pomnikami męczenników, i tak poświęca je Bogu męczenników."
      it: "Per onorare la città che porta il suo nome, la riempie, insieme ai dintorni, di chiese e di grandi memoriali dei martiri, e così la consacra al Dio dei martiri."
      nl: "Om de stad te eren die zijn naam draagt, vult hij haar en haar omgeving met kerken en grote gedenktekens voor de martelaren, en wijdt haar zo toe aan de God van de martelaren."
      cs: "Aby uctil město, které nese jeho jméno, naplňuje je i jeho okolí kostely a velkými památníky mučedníků, a tak je zasvěcuje Bohu mučedníků."
      sv: "För att hedra staden som bär hans namn fyller han den och dess omgivningar med kyrkor och stora minnesmärken över martyrerna, och helgar den så åt martyrernas Gud."
      nb: "For å hedre byen som bærer navnet hans, fyller han den og omegnen med kirker og store minnesmerker over martyrene, og vier den slik til martyrenes Gud."
      tl: "Upang parangalan ang lungsod na nagtataglay ng kaniyang pangalan, pinupuno niya ito at ang mga karatig nito ng mga simbahan at ng mga dakilang alaala ng mga martir, at sa gayon ay itinatalaga ito sa Diyos ng mga martir."
      da: "For at ære den by, der bærer hans navn, fylder han den og dens omegn med kirker og store mindesmærker for martyrerne og indvier den således til martyrernes Gud."
      sr: "Да почасти град који носи његово име, испуњава њега и његову околину црквама и великим споменицима мученика, и тако га посвећује Богу мученика."
      hu: "A nevét viselő város tiszteletére templomokkal és a vértanúk nagy emlékműveivel tölti meg a várost és külvárosait, és így a vértanúk Istenének szenteli."
      fi: "Kunnioittaakseen nimeään kantavaa kaupunkia hän täyttää sen ja sen ympäristön kirkoilla ja marttyyrien suurilla muistomerkeillä ja pyhittää sen näin marttyyrien Jumalalle."
      vi: "Để tôn vinh thành phố mang tên mình, ông lấp đầy thành và vùng ngoại ô bằng các nhà thờ và những đài tưởng niệm lớn dành cho các thánh tử đạo, và như vậy hiến dâng thành cho Đức Chúa Trời của các thánh tử đạo."
      ro: "Pentru a cinsti cetatea care îi poartă numele, o umple, ca și împrejurimile ei, cu biserici și cu mari monumente ale martirilor, și astfel o închină Dumnezeului martirilor."
      bg: "За да почете града, който носи неговото име, той изпълва самия град и околностите му с църкви и големи паметници на мъчениците и така го посвещава на Бога на мъчениците."
  - place: "511240" # Helenopolis
    year: "AD 337"
    source:
      cite:
        en: "Eusebius, Life of Constantine 4.61"
        ru: "Евсевий, Жизнь Константина 4.61"
