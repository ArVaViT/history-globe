    note:
      en: "Constantine marches on Rome against Maxentius. Fleeing across the Tiber by the bridge of boats he had built, Maxentius goes down «like stone» with his guards; Eusebius likens it to Pharaoh's host in the Red Sea."
      ru: "Константин идёт на Рим против Максенция. Убегая через Тибр по мосту из лодок, который сам же навёл, Максенций со своей стражей идёт ко дну, «как камень»; Евсевий сравнивает это с войском фараона в Красном море."
      uk: "Костянтин іде походом на Рим проти Максенція. Тікаючи через Тибр по мосту з човнів, який сам збудував, Максенцій іде на дно «як камінь» разом зі своєю охороною; Євсевій порівнює це з військом фараона в Червоному морі."
      es: "Constantino marcha sobre Roma contra Majencio. Al huir a través del Tíber por el puente de barcas que él mismo había construido, Majencio se hunde «como una piedra» con sus guardias; Eusebio lo compara con el ejército del faraón en el Mar Rojo."
      pt: "Constantino marcha sobre Roma contra Maxêncio. Ao atravessar o Tibre em fuga pela ponte de barcos que ele próprio mandara construir, Maxêncio afunda “como pedra” com seus guardas; Eusébio compara a cena ao exército do faraó no Mar Vermelho."
      de: "Konstantin zieht gegen Maxentius auf Rom zu. Als Maxentius über die Schiffsbrücke flieht, die er selbst über den Tiber hatte schlagen lassen, versinkt er samt seinen Leibwächtern „wie ein Stein“; Eusebius vergleicht das mit dem Heer des Pharao im Roten Meer."
      fr: "Constantin marche sur Rome contre Maxence. Fuyant à travers le Tibre par le pont de bateaux qu’il avait fait construire, Maxence coule « comme une pierre » avec ses gardes ; Eusèbe compare la scène à l’armée de Pharaon dans la mer Rouge."
      pl: "Konstantyn maszeruje na Rzym przeciw Maksencjuszowi. Uciekając przez Tyber po moście z łodzi, który sam kazał zbudować, Maksencjusz idzie na dno „jak kamień” wraz ze swoją strażą; Euzebiusz porównuje to do wojska faraona w Morzu Czerwonym."
      it: "Costantino marcia su Roma contro Massenzio. Fuggendo attraverso il Tevere sul ponte di barche che egli stesso aveva fatto costruire, Massenzio va a fondo «come una pietra» con le sue guardie; Eusebio lo paragona all’esercito del faraone nel Mar Rosso."
      nl: "Constantijn trekt tegen Maxentius op naar Rome. Op de vlucht over de Tiber via de schipbrug die hij had laten bouwen, zinkt Maxentius met zijn lijfwachten “als een steen”; Eusebius vergelijkt het met het leger van de farao in de Rode Zee."
      cs: "Konstantin táhne na Řím proti Maxentiovi. Maxentius prchá přes Tiberu po mostě z lodí, který dal postavit, a se svými strážci jde ke dnu „jako kámen“; Eusebios to přirovnává k faraonovu vojsku v Rudém moři."
      sv: "Konstantin tågar mot Rom för att strida mot Maxentius. Maxentius flyr över Tibern på den båtbro han själv låtit bygga och sjunker ”som en sten” med sina livvakter; Eusebios jämför det med Faraos här i Röda havet."
      nb: "Konstantin marsjerer mot Roma og Maxentius. På flukt over Tiberen på den båtbroen han selv hadde bygd, synker Maxentius «som en stein» sammen med vaktene sine; Eusebios likner det med Faraos hær i Rødehavet."
      tl: "Nagmamartsa si Constantino sa Roma laban kay Majencio. Sa pagtakas patawid ng Tiber sa tulay na yari sa mga bangka na ipinatayo niya, lumulubog si Majencio na “parang bato” kasama ang kaniyang mga bantay; inihahambing ito ni Eusebio sa hukbo ni Faraon sa Dagat na Pula."
      da: "Konstantin drager mod Rom imod Maxentius. Maxentius flygter over Tiberen ad den bådbro, han selv havde ladet bygge, og går til bunds »som en sten« med sine livvagter; Eusebios sammenligner det med Faraos hær i Det Røde Hav."
      sr: "Константин креће на Рим против Максенција. Бежећи преко Тибра по мосту од лађа који је сам начинио, Максенције са својом стражом тоне „као камен“; Јевсевије то упоређује с фараоновом војском у Црвеном мору."
      hu: "Constantinus Rómára vonul Maxentius ellen. A Tiberisen általa épített hajóhídon menekülve Maxentius testőreivel együtt „mint a kő” merül el; Eusebios a Vörös-tengerbe veszett fáraói sereghez hasonlítja."
      fi: "Konstantinus marssii Roomaan Maxentiusta vastaan. Paetessaan Tiberin yli rakentamansa venesillan kautta Maxentius vajoaa henkivartijoineen pohjaan ”kuin kivi”; Eusebios vertaa sitä faraon sotajoukkoon Punaisellamerellä."
      vi: "Constantinus tiến quân đến Rô-ma chống Maxentius. Chạy qua sông Tiber bằng chiếc cầu thuyền do chính mình dựng, Maxentius chìm “như đá” cùng các vệ binh; Eusebius ví cảnh ấy với đạo quân của Pha-ra-ôn ở Biển Đỏ."
      ro: "Constantin înaintează spre Roma împotriva lui Maxențiu. Fugind peste Tibru pe podul de vase pe care îl construise, Maxențiu se scufundă „ca o piatră” împreună cu gărzile sale; Eusebiu compară scena cu oastea lui Faraon din Marea Roșie."
      bg: "Константин настъпва към Рим срещу Максенций. Бягайки през Тибър по моста от лодки, който сам е построил, Максенций потъва „като камък“ заедно с телохранителите си; Евсевий сравнява това с войнството на фараона в Червено море."
  - place: "511268" # Nicaea
