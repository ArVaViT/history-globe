    note:
      en: "The tomb of Christ lay buried under earth and a shrine to Venus. Constantine has it all cleared away, and, «contrary to all expectation», the cave of the resurrection comes to light."
      ru: "Гроб Христов был засыпан землёй, а сверху стояло святилище Венеры. Константин велит всё это убрать, и «сверх всякого чаяния» открывается пещера Воскресения."
      uk: "Гріб Христовий був похований під землею і святилищем Венери. Костянтин велить усе це розчистити, і «всупереч будь-яким сподіванням» відкривається печера Воскресіння."
      es: "El sepulcro de Cristo yacía sepultado bajo tierra y bajo un santuario de Venus. Constantino manda despejarlo todo y, «contra toda expectativa», sale a la luz la cueva de la resurrección."
      pt: "O túmulo de Cristo jazia enterrado sob a terra e sob um santuário de Vênus. Constantino manda remover tudo e, “contra toda expectativa”, a gruta da ressurreição vem à luz."
      de: "Das Grab Christi lag verschüttet unter Erde und einem Heiligtum der Venus. Konstantin lässt alles wegräumen, und „wider alles Erwarten“ kommt die Höhle der Auferstehung ans Licht."
      fr: "Le tombeau du Christ gisait enfoui sous la terre et sous un sanctuaire de Vénus. Constantin fait tout dégager et, « contre toute attente », la grotte de la résurrection reparaît au jour."
      pl: "Grób Chrystusa był zasypany ziemią i przykryty świątynią Wenus. Konstantyn każe wszystko usunąć i „wbrew wszelkim oczekiwaniom” odsłania się jaskinia zmartwychwstania."
      it: "La tomba di Cristo giaceva sepolta sotto la terra e sotto un santuario di Venere. Costantino fa rimuovere tutto, e, «contro ogni aspettativa», la grotta della risurrezione viene alla luce."
      nl: "Het graf van Christus lag begraven onder aarde en een heiligdom van Venus. Constantijn laat alles opruimen, en “tegen alle verwachting in” komt de grot van de opstanding aan het licht."
      cs: "Kristův hrob ležel zasypán zemí a pod svatyní Venušinou. Konstantin to všechno nechává odklidit a „proti všemu očekávání“ vychází na světlo jeskyně vzkříšení."
      sv: "Kristi grav låg begravd under jord och en Venushelgedom. Konstantin låter röja undan allt, och ”mot all förmodan” träder uppståndelsegrottan i dagen."
      nb: "Kristi grav lå begravd under jord og et Venus-tempel. Konstantin lar alt bli ryddet bort, og «stikk i strid med all forventning» kommer oppstandelsens hule for dagen."
      tl: "Ang libingan ni Cristo ay nakabaon sa ilalim ng lupa at ng isang dambana ni Venus. Ipinalilinis ni Constantino ang lahat ng iyon, at, “salungat sa lahat ng inaasahan”, lumilitaw ang yungib ng muling pagkabuhay."
      da: "Kristi grav lå begravet under jord og en helligdom for Venus. Konstantin lader det hele rydde bort, og »mod al forventning« kommer opstandelsens hule for dagen."
      sr: "Христов гроб лежао је затрпан под земљом и Венериним светилиштем. Константин наређује да се све то уклони и, „противно сваком очекивању“, пећина васкрсења излази на видело."
      hu: "Krisztus sírja föld és egy Venus-szentély alatt feküdt eltemetve. Constantinus mindent eltakaríttat, és „minden várakozás ellenére” napvilágra kerül a feltámadás barlangja."
      fi: "Kristuksen hauta oli kätkettynä maan ja Venuksen pyhäkön alle. Konstantinus antaa raivata kaiken pois, ja ”kaiken odotuksen vastaisesti” ylösnousemuksen luola tulee esiin."
      vi: "Mộ của Đấng Christ đã bị vùi dưới đất và dưới một đền thờ Venus. Constantinus cho dọn sạch tất cả, và, “trái hẳn mọi mong đợi”, hang mộ của sự phục sinh lộ ra."
      ro: "Mormântul lui Hristos zăcea îngropat sub pământ și sub un sanctuar al Venerei. Constantin poruncește să fie înlăturat totul și, „împotriva oricărei așteptări”, peștera Învierii iese la lumină."
      bg: "Гробът на Христос лежеше затрупан под пръст и под капище на Венера. Константин заповядва всичко да бъде разчистено и, „против всяко очакване“, пещерата на възкресението се открива."
