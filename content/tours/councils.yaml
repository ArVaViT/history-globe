        fr: "Socrate le Scolastique, Histoire ecclésiastique 5.8"
        pl: "Sokrates Scholastyk, Historia Kościoła 5.8"
        it: "Socrate Scolastico, Storia ecclesiastica 5.8"
        nl: "Socrates Scholasticus, Kerkgeschiedenis 5.8"
        cs: "Sókratés Scholastikos, Církevní dějiny 5.8"
        sv: "Sokrates Scholastikos, Kyrkohistoria 5.8"
        nb: "Sokrates Scholastikos, Kirkehistorie 5.8"
