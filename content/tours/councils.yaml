        nb: "Eusebios, Konstantins liv 3.6-14"
        tl: "Eusebio, Buhay ni Constantino 3.6-14"
        da: "Eusebios, Konstantins liv 3.6-14"
        sr: "Јевсевије, Живот Константина 3.6-14"
        hu: "Eusebios, Constantinus élete 3.6-14"
        fi: "Eusebios, Konstantinuksen elämä 3.6-14"
        vi: "Eusebius, Cuộc đời Constantinus 3.6-14"
        ro: "Eusebiu, Viața lui Constantin 3.6-14"
        bg: "Евсевий, Животът на Константин 3.6-14"
      url: "https://www.newadvent.org/fathers/25023.htm"
    note:
      en: "More than two hundred and fifty bishops, Eusebius among them, meet with the emperor. Against Arius they confess the Son of one substance with the Father, and they agree on one day for Easter."
      ru: "Более двухсот пятидесяти епископов, среди них сам Евсевий, собираются при императоре. Против Ария они исповедуют Сына единосущным Отцу и договариваются праздновать Пасху в один день."
      uk: "Понад двісті п’ятдесят єпископів, серед них Євсевій, збираються разом з імператором. Проти Арія вони сповідують Сина єдиносущним Отцеві й домовляються святкувати Великдень в один день."
      es: "Más de doscientos cincuenta obispos, entre ellos Eusebio, se reúnen con el emperador. Contra Arrio confiesan al Hijo de una misma sustancia con el Padre, y acuerdan un solo día para la Pascua."
      pt: "Mais de duzentos e cinquenta bispos, Eusébio entre eles, reúnem-se com o imperador. Contra Ário, confessam que o Filho é da mesma substância que o Pai e entram em acordo sobre um só dia para a Páscoa."
      de: "Mehr als zweihundertfünfzig Bischöfe, unter ihnen Eusebius, versammeln sich mit dem Kaiser. Gegen Arius bekennen sie den Sohn als eines Wesens mit dem Vater, und sie einigen sich auf einen gemeinsamen Tag für Ostern."
      fr: "Plus de deux cent cinquante évêques, dont Eusèbe, se réunissent avec l’empereur. Contre Arius, ils confessent le Fils consubstantiel au Père, et s’accordent sur un seul jour pour Pâques."
      pl: "Ponad dwustu pięćdziesięciu biskupów, wśród nich Euzebiusz, zbiera się z cesarzem. Przeciw Ariuszowi wyznają, że Syn jest jednej istoty z Ojcem, i ustalają jeden dzień Wielkanocy."
      it: "Più di duecentocinquanta vescovi, tra cui Eusebio, si riuniscono con l’imperatore. Contro Ario confessano il Figlio della stessa sostanza del Padre, e concordano su un unico giorno per la Pasqua."
      nl: "Meer dan tweehonderdvijftig bisschoppen, onder wie Eusebius, komen samen met de keizer. Tegen Arius belijden zij de Zoon als één van wezen met de Vader, en zij komen overeen om Pasen op één dag te vieren."
      cs: "Více než dvě stě padesát biskupů, mezi nimi Eusebios, se schází s císařem. Proti Ariovi vyznávají Syna jedné podstaty s Otcem a shodují se na jednom dni pro Velikonoce."
      sv: "Mer än tvåhundrafemtio biskopar, bland dem Eusebios, samlas hos kejsaren. Mot Arius bekänner de att Sonen är av samma väsen som Fadern, och de enas om en gemensam dag för påsken."
      nb: "Mer enn to hundre og femti biskoper, blant dem Eusebios, samles med keiseren. Mot Arius bekjenner de Sønnen å være av ett vesen med Faderen, og de blir enige om én dag for påsken."
      tl: "Mahigit dalawandaan at limampung obispo, kabilang si Eusebio, ang nagtitipon kasama ang emperador. Laban kay Arrio, ipinahahayag nila na ang Anak ay kaisa ng Ama sa sangkap, at nagkakasundo sila sa iisang araw para sa Pasko ng Pagkabuhay."
      da: "Mere end to hundrede og halvtreds biskopper, Eusebios iblandt dem, mødes med kejseren. Imod Arius bekender de, at Sønnen er af ét væsen med Faderen, og de bliver enige om én dag for påsken."
      sr: "Више од двеста педесет епископа, међу њима и Јевсевије, састаје се с царем. Против Арија исповедају Сина једносушним Оцу и договарају се о једном дану за Ускрс."
      hu: "Több mint kétszázötven püspök, köztük Eusebios, gyűlik össze a császárral. Areiosz ellen az Atyával egylényegűnek vallják a Fiút, és megegyeznek abban, hogy a húsvétot egy napon ünnepeljék."
      fi: "Yli kaksisataaviisikymmentä piispaa, heidän joukossaan Eusebios, kokoontuu keisarin kanssa. Areiosta vastaan he tunnustavat Pojan olevan samaa olemusta Isän kanssa, ja he sopivat, että pääsiäistä vietetään samana päivänä."
      vi: "Hơn hai trăm năm mươi giám mục, trong đó có Eusebius, họp cùng hoàng đế. Chống lại Arius, họ xưng nhận Con đồng bản thể với Cha, và thống nhất cử hành lễ Phục Sinh vào cùng một ngày."
      ro: "Mai bine de două sute cincizeci de episcopi, între care și Eusebiu, se întrunesc cu împăratul. Împotriva lui Arie, ei mărturisesc că Fiul este de o ființă cu Tatăl și se învoiesc să serbeze Paștile în aceeași zi."
      bg: "Над двеста и петдесет епископи, между които и Евсевий, се събират с императора. Срещу Арий те изповядват Сина като единосъщен с Отца и се споразумяват Великден да се празнува в един и същи ден."
  - place: Q16869 # Constantinople
    year: "AD 381"
    source:
      cite:
        en: "Socrates Scholasticus, Church History 5.8"
        ru: "Сократ Схоластик, Церковная история 5.8"
        uk: "Сократ Схоластик, Церковна історія 5.8"
