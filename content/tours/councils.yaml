        bg: "Сократ Схоластик, Църковна история 5.8"
      url: "https://www.newadvent.org/fathers/26015.htm"
    note:
      en: "Theodosius gathers a hundred and fifty bishops. They confirm the Creed of Nicaea, ordain Nectarius bishop, and rank Constantinople next in honour after Rome, «because that city was New Rome»."
      ru: "Феодосий собирает сто пятьдесят епископов. Они подтверждают Никейский символ, рукополагают Нектария и ставят епископа Константинополя по чести следующим после римского, «так как Константинополь есть новый Рим»."
      uk: "Феодосій збирає сто п’ятдесят єпископів. Вони підтверджують Нікейський символ віри, висвячують Нектарія на єпископа і ставлять Константинополь за честю одразу після Рима, «бо те місто було Новим Римом»."
      es: "Teodosio reúne a ciento cincuenta obispos. Confirman el Credo de Nicea, ordenan obispo a Nectario y sitúan a Constantinopla en honor inmediatamente después de Roma, «porque aquella ciudad era la Nueva Roma»."
      pt: "Teodósio reúne cento e cinquenta bispos. Eles confirmam o Credo de Niceia, ordenam Nectário bispo e dão a Constantinopla o primeiro lugar de honra depois de Roma, “porque aquela cidade era a Nova Roma”."
      de: "Theodosius versammelt hundertfünfzig Bischöfe. Sie bestätigen das Glaubensbekenntnis von Nizäa, weihen Nektarios zum Bischof und stellen Konstantinopel im Rang der Ehre unmittelbar hinter Rom, „weil jene Stadt das Neue Rom war“."
      fr: "Théodose rassemble cent cinquante évêques. Ils confirment le symbole de Nicée, ordonnent Nectaire évêque et placent Constantinople au premier rang d’honneur après Rome, « parce que cette ville était la Nouvelle Rome »."
      pl: "Teodozjusz zwołuje stu pięćdziesięciu biskupów. Potwierdzają oni nicejskie wyznanie wiary, wyświęcają Nektariusza na biskupa i stawiają Konstantynopol pod względem godności zaraz po Rzymie, „ponieważ to miasto było Nowym Rzymem”."
      it: "Teodosio raduna centocinquanta vescovi. Essi confermano il Credo di Nicea, ordinano Nettario vescovo e assegnano a Costantinopoli il primato d’onore subito dopo Roma, «perché quella città era la Nuova Roma»."
      nl: "Theodosius roept honderdvijftig bisschoppen bijeen. Zij bevestigen de geloofsbelijdenis van Nicea, wijden Nectarius tot bisschop en plaatsen Constantinopel in eer direct na Rome, “omdat die stad het Nieuwe Rome was”."
      cs: "Theodosius shromažďuje sto padesát biskupů. Potvrzují nicejské vyznání, světí Nektaria na biskupa a řadí Konstantinopol co do cti hned za Řím, „protože to město bylo Novým Římem“."
      sv: "Theodosius samlar hundrafemtio biskopar. De bekräftar trosbekännelsen från Nicaea, viger Nektarios till biskop och sätter Konstantinopel näst efter Rom i rang, ”eftersom den staden var Nya Rom”."
      nb: "Theodosius samler et hundre og femti biskoper. De stadfester trosbekjennelsen fra Nikea, ordinerer Nektarios til biskop og gir Konstantinopel æresrang nærmest etter Roma, «fordi den byen var Det nye Roma»."
      tl: "Ipinatitipon ni Teodosio ang isandaan at limampung obispo. Pinagtitibay nila ang Kredo ng Nicea, inoordenahan si Nectario bilang obispo, at inilalagay ang Constantinopla kasunod ng Roma sa karangalan, “sapagkat ang lungsod na iyon ay Bagong Roma”."
      da: "Theodosius samler et hundrede og halvtreds biskopper. De bekræfter den nikænske trosbekendelse, vier Nektarios til biskop og giver Konstantinopel æresrangen næst efter Rom, »fordi denne by var det nye Rom«."
      sr: "Теодосије окупља сто педесет епископа. Они потврђују Никејски символ вере, рукополажу Нектарија за епископа и Цариграду дају прво место по части после Рима, „јер је тај град био Нови Рим“."
      hu: "Theodosius százötven püspököt gyűjt össze. Megerősítik a nikaiai hitvallást, Nektariosz püspökké szentelik, és Konstantinápolyt tiszteletben Róma után a második helyre sorolják, „mert az a város Új Róma”."
      fi: "Theodosius kutsuu koolle sataviisikymmentä piispaa. He vahvistavat Nikaian uskontunnustuksen, vihkivät Nektarioksen piispaksi ja asettavat Konstantinopolin kunniassa heti Rooman jälkeen, ”koska se kaupunki oli Uusi Rooma”."
      vi: "Theodosius triệu tập một trăm năm mươi giám mục. Họ xác nhận Kinh Tin Kính Nicaea, phong Nectarius làm giám mục, và xếp Constantinopolis ở hàng danh dự kế sau Rô-ma, “vì thành ấy là Rô-ma Mới”."
      ro: "Teodosie adună o sută cincizeci de episcopi. Ei confirmă Simbolul de la Niceea, îl hirotonesc episcop pe Nectarie și așază Constantinopolul pe locul al doilea în cinste, după Roma, „pentru că acea cetate era Roma cea Nouă”."
      bg: "Теодосий събира сто и петдесет епископи. Те потвърждават Никейския символ на вярата, ръкополагат Нектарий за епископ и поставят Константинопол по чест веднага след Рим, „защото този град бил Новият Рим“."
  - place: aa56bd1 # Carthage
    year: "AD 419"
    source:
      cite:
        en: "Code of Canons of the African Church, canon 24"
        ru: "Кодекс канонов Африканской церкви, правило 24"
        uk: "Звід канонів Африканської церкви, канон 24"
        es: "Código de cánones de la Iglesia africana, canon 24"
        pt: "Código dos Cânones da Igreja Africana, cânon 24"
        de: "Codex der Kanones der afrikanischen Kirche, Kanon 24"
        fr: "Code des canons de l’Église d’Afrique, canon 24"
        pl: "Kodeks kanonów Kościoła afrykańskiego, kanon 24"
        it: "Codice dei canoni della Chiesa africana, canone 24"
        nl: "Codex van de canones van de Afrikaanse Kerk, canon 24"
        cs: "Kodex kánonů africké církve, kánon 24"
        sv: "Den afrikanska kyrkans kanonsamling, kanon 24"
        nb: "Den afrikanske kirkes kanonsamling, kanon 24"
        tl: "Kodigo ng mga Kanon ng Iglesia ng Africa, kanon 24"
        da: "Den afrikanske kirkes kanonsamling, kanon 24"
        sr: "Зборник канона Афричке цркве, канон 24"
        hu: "Az afrikai egyház kánongyűjteménye, 24. kánon"
        fi: "Afrikan kirkon kaanonien kokoelma, kaanon 24"
        vi: "Bộ giáo luật của Hội thánh Africa, điều 24"
        ro: "Codul canoanelor Bisericii africane, canonul 24"
        bg: "Кодекс на каноните на Африканската църква, канон 24"
      url: "https://www.newadvent.org/fathers/3816.htm"
    note:
      en: "The bishops of Africa, Augustine among them, gather their canons into one code. Canon 24 lists the books to be read in church as Scripture, as the councils of Hippo (393) and Carthage (397) had done."
      ru: "Епископы Африки, среди них Августин, сводят свои правила в один кодекс. Правило 24 перечисляет книги, которые читаются в церкви как Писание, вслед за соборами в Гиппоне (393) и Карфагене (397)."
      uk: "Єпископи Африки, серед них Августин, зводять свої канони в один звід. Канон 24 називає книги, які читають у церкві як Писання, як це зробили собори в Гіппоні (393) і Карфагені (397)."
      es: "Los obispos de África, entre ellos Agustín, reúnen sus cánones en un solo código. El canon 24 enumera los libros que han de leerse en la iglesia como Escritura, como ya habían hecho los concilios de Hipona (393) y de Cartago (397)."
      pt: "Os bispos da África, Agostinho entre eles, reúnem seus cânones num só código. O cânon 24 relaciona os livros que devem ser lidos na igreja como Escritura, como já haviam feito os concílios de Hipona (393) e de Cartago (397)."
      de: "Die Bischöfe Afrikas, unter ihnen Augustinus, fassen ihre Kanones in einem Codex zusammen. Kanon 24 führt die Bücher auf, die in der Kirche als Schrift gelesen werden sollen, wie schon die Konzilien von Hippo (393) und Karthago (397) es getan hatten."
      fr: "Les évêques d’Afrique, dont Augustin, réunissent leurs canons en un seul code. Le canon 24 dresse la liste des livres à lire à l’église comme Écriture, ainsi que l’avaient fait les conciles d’Hippone (393) et de Carthage (397)."
      pl: "Biskupi Afryki, wśród nich Augustyn, zbierają swoje kanony w jeden kodeks. Kanon 24 wylicza księgi, które mają być czytane w kościele jako Pismo, tak jak uczyniły to synody w Hipponie (393) i Kartaginie (397)."
      it: "I vescovi d’Africa, tra cui Agostino, raccolgono i loro canoni in un unico codice. Il canone 24 elenca i libri da leggere in chiesa come Scrittura, come avevano fatto i concili di Ippona (393) e di Cartagine (397)."
      nl: "De bisschoppen van Afrika, onder wie Augustinus, brengen hun canones samen in één codex. Canon 24 noemt de boeken die in de kerk als Schrift gelezen mogen worden, zoals de concilies van Hippo (393) en Carthago (397) al hadden gedaan."
      cs: "Afričtí biskupové, mezi nimi Augustin, shromažďují své kánony do jednoho kodexu. Kánon 24 uvádí knihy, které se mají v kostele číst jako Písmo, jak to učinily koncily v Hippu (393) a v Kartágu (397)."
      sv: "Afrikas biskopar, bland dem Augustinus, samlar sina kanoner i en enda kodex. Kanon 24 förtecknar de böcker som ska läsas i kyrkan som Skrift, så som koncilierna i Hippo (393) och Kartago (397) hade gjort."
      nb: "Biskopene i Afrika, blant dem Augustin, samler kanonene sine i én lovsamling. Kanon 24 oppregner bøkene som skal leses i kirken som Skrift, slik kirkemøtene i Hippo (393) og Kartago (397) hadde gjort."
      tl: "Pinagsasama-sama ng mga obispo ng Africa, kabilang si Agustin, ang kanilang mga kanon sa iisang kodigo. Itinatala ng kanon 24 ang mga aklat na babasahin sa simbahan bilang Kasulatan, gaya ng ginawa ng mga konseho ng Hippo (393) at Cartago (397)."
      da: "Afrikas biskopper, Augustin iblandt dem, samler deres kanoner i én lovsamling. Kanon 24 opregner de bøger, der skal læses i kirken som Hellig Skrift, sådan som koncilerne i Hippo (393) og Karthago (397) havde gjort."
      sr: "Афрички епископи, међу њима Августин, сабирају своје каноне у један зборник. Канон 24 набраја књиге које се у цркви читају као Писмо, као што су то већ учинили сабори у Хипону (393) и Картагини (397)."
      hu: "Afrika püspökei, köztük Augustinus, egyetlen gyűjteménybe foglalják kánonjaikat. A 24. kánon felsorolja azokat a könyveket, amelyeket Szentírásként kell olvasni az egyházban, ahogyan azt a hippói (393) és a karthágói (397) zsinat is tette."
      fi: "Afrikan piispat, heidän joukossaan Augustinus, kokoavat kaanoninsa yhdeksi kokoelmaksi. Kaanon 24 luettelee kirjat, joita kirkossa luetaan Raamattuna, kuten Hippon (393) ja Karthagon (397) kirkolliskokoukset olivat tehneet."
      vi: "Các giám mục Africa, trong đó có Augustine, gom các điều luật của mình vào một bộ. Điều 24 liệt kê những sách được đọc trong nhà thờ như Kinh Thánh, như các công đồng Hippo (393) và Carthage (397) đã làm."
      ro: "Episcopii Africii, între care și Augustin, își adună canoanele într-un singur cod. Canonul 24 enumeră cărțile care se citesc în biserică drept Scriptură, așa cum făcuseră și sinoadele de la Hippo (393) și de la Cartagina (397)."
      bg: "Епископите на Африка, между които и Августин, събират каноните си в един сборник. Канон 24 изброява книгите, които трябва да се четат в църквата като Писание, както вече са направили съборите в Хипон (393) и Картаген (397)."
