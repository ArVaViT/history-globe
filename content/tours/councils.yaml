# The councils, from the apostles in Jerusalem (Acts 15) to Chalcedon: the first tour that
# mixes a verse with sources outside the Bible (ADR 0018). Each source stop links the free
# translation of the Nicene and Post-Nicene Fathers (public domain) at New Advent; its page
# holds the whole book, and the cite gives the chapter. Not one way travelled: no time on
# foot.
id: councils
title:
  en: "The councils: from Jerusalem to Chalcedon"
  ru: "Соборы: от Иерусалима до Халкидона"
  uk: "Собори: від Єрусалима до Халкедона"
  es: "Los concilios: de Jerusalén a Calcedonia"
  pt: "Os concílios: de Jerusalém a Calcedônia"
  de: "Die Konzilien: von Jerusalem bis Chalkedon"
  fr: "Les conciles : de Jérusalem à Chalcédoine"
  pl: "Sobory: od Jerozolimy do Chalcedonu"
  it: "I concili: da Gerusalemme a Calcedonia"
  nl: "De concilies: van Jeruzalem tot Chalcedon"
  cs: "Koncily: od Jeruzaléma po Chalkedon"
  sv: "Koncilierna: från Jerusalem till Chalkedon"
  nb: "Kirkemøtene: fra Jerusalem til Kalkedon"
  tl: "Ang mga konseho: mula sa Jerusalem hanggang Calcedonia"
  da: "Koncilerne: fra Jerusalem til Chalkedon"
  sr: "Сабори: од Јерусалима до Халкидона"
  hu: "A zsinatok: Jeruzsálemtől Khalkédónig"
  fi: "Kirkolliskokoukset: Jerusalemista Khalkedoniin"
  vi: "Các công đồng: từ Giê-ru-sa-lem đến Chalcedon"
  ro: "Sinoadele: de la Ierusalim la Calcedon"
  bg: "Съборите: от Йерусалим до Халкидон"
year: "AD 49"
approximate: true
walked: false
stops:
  - place: a15257a # Jerusalem
    ref: Acts.15.4
    note:
      en: "The apostles and elders meet over whether the Gentiles who believe must be circumcised. Peter speaks, and James gives the judgement the letter carries to Antioch: no burden but a few necessary things."
      ru: "Апостолы и пресвитеры собираются решить, должны ли уверовавшие язычники обрезываться. Говорит Пётр, а Иаков выносит решение, которое письмо несёт в Антиохию: не возлагать бремени, кроме немногого необходимого."
      uk: "Апостоли й старші збираються, щоб вирішити, чи мусять язичники, які увірували, обрізатися. Промовляє Петро, а Яків виносить ухвалу, яку лист доносить до Антіохії: не накладати жодного тягаря, окрім кількох необхідних речей."
      es: "Los apóstoles y los ancianos se reúnen para decidir si los gentiles que creen deben ser circuncidados. Pedro habla, y Jacobo da la sentencia que la carta lleva a Antioquía: ninguna carga, salvo unas pocas cosas necesarias."
      pt: "Os apóstolos e os anciãos se reúnem para decidir se os gentios que creem devem ser circuncidados. Pedro fala, e Tiago dá o parecer que a carta leva a Antioquia: nenhum fardo além de umas poucas coisas necessárias."
      de: "Die Apostel und Ältesten kommen zusammen, um zu beraten, ob die gläubig gewordenen Heiden beschnitten werden müssen. Petrus spricht, und Jakobus fällt das Urteil, das der Brief nach Antiochia trägt: keine Last außer einigen notwendigen Dingen."
      fr: "Les apôtres et les anciens se réunissent pour décider si les païens qui croient doivent être circoncis. Pierre prend la parole, et Jacques prononce la décision que la lettre porte à Antioche : aucune autre charge que quelques choses nécessaires."
      pl: "Apostołowie i starsi zbierają się, by rozstrzygnąć, czy poganie, którzy uwierzyli, muszą być obrzezani. Przemawia Piotr, a Jakub wydaje rozstrzygnięcie, które list zanosi do Antiochii: żadnego ciężaru prócz kilku rzeczy koniecznych."
      it: "Gli apostoli e gli anziani si riuniscono per decidere se i Gentili che credono debbano essere circoncisi. Pietro parla, e Giacomo pronuncia il giudizio che la lettera porta ad Antiochia: nessun peso, se non alcune cose necessarie."
      nl: "De apostelen en oudsten komen bijeen over de vraag of de heidenen die geloven besneden moeten worden. Petrus spreekt, en Jakobus geeft het oordeel dat de brief naar Antiochië overbrengt: geen andere last dan enkele noodzakelijke dingen."
      cs: "Apoštolové a starší se scházejí kvůli otázce, zda musí být obřezáni pohané, kteří uvěřili. Mluví Petr a Jakub vynáší rozhodnutí, s nímž putuje do Antiochie list: žádné břemeno kromě několika nezbytných věcí."
      sv: "Apostlarna och de äldste samlas för att avgöra om de hedningar som kommit till tro måste omskäras. Petrus talar, och Jakob avkunnar det beslut som brevet för till Antiochia: ingen börda utöver några nödvändiga ting."
      nb: "Apostlene og de eldste samles for å avgjøre om hedningene som tror, må omskjæres. Peter taler, og Jakob avsier den dommen som brevet bringer til Antiokia: ingen byrde utover noen få nødvendige ting."
      tl: "Nagpupulong ang mga apostol at matatanda kung dapat bang tuliin ang mga Gentil na sumasampalataya. Nagsasalita si Pedro, at ibinibigay ni Santiago ang hatol na dala ng liham sa Antioquia: walang pasanin kundi ilang bagay na kinakailangan."
      da: "Apostlene og de ældste samles om spørgsmålet, om de hedninger, der er kommet til tro, skal omskæres. Peter taler, og Jakob afsiger den dom, som brevet bringer til Antiokia: ingen byrde ud over nogle få nødvendige ting."
      sr: "Апостоли и старешине састају се око питања да ли незнабошци који су поверовали морају да се обрежу. Петар говори, а Јаков изриче суд који писмо носи у Антиохију: никакво бреме осим неколико неопходних ствари."
      hu: "Az apostolok és a vének azon tanácskoznak, hogy körül kell-e metélni a hívő pogányokat. Péter szól, Jakab pedig kimondja az ítéletet, amelyet a levél Antiókhiába visz: nincs más teher, csak néhány szükséges dolog."
      fi: "Apostolit ja vanhimmat kokoontuvat pohtimaan, täytyykö uskoon tulevat pakanat ympärileikata. Pietari puhuu, ja Jaakob antaa tuomion, jonka kirje vie Antiokiaan: ei muuta kuormaa kuin muutamat välttämättömät asiat."
      vi: "Các sứ đồ và trưởng lão họp bàn về việc những người ngoại đã tin có phải chịu cắt bì hay không. Phi-e-rơ lên tiếng, và Gia-cơ đưa ra phán quyết mà bức thư mang đến An-ti-ốt: không đặt gánh nặng nào ngoài một vài điều cần thiết."
      ro: "Apostolii și bătrânii se adună să hotărască dacă păgânii care cred trebuie tăiați împrejur. Petru vorbește, iar Iacov rostește hotărârea pe care o poartă scrisoarea spre Antiohia: nicio altă povară, afară de câteva lucruri necesare."
      bg: "Апостолите и презвитерите се събират да решат дали езичниците, които вярват, трябва да бъдат обрязвани. Петър говори, а Яков произнася решението, което писмото отнася в Антиохия: никакво друго бреме освен няколко необходими неща."
  - place: "383706" # Mediolanum: Milan
    year: "AD 313"
    source:
      cite:
        en: "Lactantius, On the Deaths of the Persecutors 48"
        ru: "Лактанций, О смертях гонителей 48"
        uk: "Лактанцій, Про смерті переслідувачів 48"
        es: "Lactancio, Sobre la muerte de los perseguidores 48"
        pt: "Lactâncio, Sobre a Morte dos Perseguidores 48"
        de: "Laktanz, Von den Todesarten der Verfolger 48"
        fr: "Lactance, De la mort des persécuteurs 48"
        pl: "Laktancjusz, O śmierci prześladowców 48"
        it: "Lattanzio, La morte dei persecutori 48"
        nl: "Lactantius, Over de dood van de vervolgers 48"
        cs: "Lactantius, O smrti pronásledovatelů 48"
        sv: "Lactantius, Om förföljarnas död 48"
        nb: "Lactantius, Om forfølgernes død 48"
        tl: "Lactancio, Tungkol sa Kamatayan ng mga Mang-uusig 48"
        da: "Lactantius, Om forfølgernes død 48"
        sr: "Лактанције, О смрти прогонитеља 48"
        hu: "Lactantius, Az üldözők haláláról 48"
        fi: "Lactantius, Vainoajien kuolemista 48"
        vi: "Lactantius, Về cái chết của những kẻ bách hại 48"
        ro: "Lactanțiu, Despre moartea persecutorilor 48"
        bg: "Лактанций, За смъртта на гонителите 48"
      url: "https://www.newadvent.org/fathers/0705.htm"
    note:
      en: "Constantine and Licinius meet at Milan and agree that Christians, and all others, may worship freely, and that the churches' property be given back. Licinius publishes it at Nicomedia in June."
      ru: "Константин и Лициний встречаются в Милане и договариваются, что христиане, как и все прочие, свободно исповедуют свою веру, а церквам возвращается их имущество. В июне Лициний обнародует это в Никомидии."
      uk: "Костянтин і Ліциній зустрічаються в Мілані й домовляються, що християни, як і всі інші, можуть вільно сповідувати свою віру і що церквам повернуть їхнє майно. Ліциній оголошує це в Нікомедії у червні."
      es: "Constantino y Licinio se reúnen en Milán y acuerdan que los cristianos, y todos los demás, puedan adorar libremente, y que se devuelvan los bienes de las iglesias. Licinio lo publica en Nicomedia en junio."
      pt: "Constantino e Licínio se encontram em Milão e acordam que os cristãos, e todos os demais, possam praticar livremente o seu culto, e que os bens das igrejas sejam devolvidos. Licínio o publica em Nicomédia, em junho."
      de: "Konstantin und Licinius treffen sich in Mailand und vereinbaren, dass Christen und alle anderen frei Gottesdienst feiern dürfen und dass das Eigentum der Kirchen zurückgegeben wird. Licinius veröffentlicht es im Juni in Nikomedia."
      fr: "Constantin et Licinius se rencontrent à Milan et conviennent que les chrétiens, et tous les autres, peuvent pratiquer librement leur culte, et que les biens des Églises leur soient rendus. Licinius publie l’accord à Nicomédie en juin."
      pl: "Konstantyn i Licyniusz spotykają się w Mediolanie i uzgadniają, że chrześcijanie, i wszyscy inni, mogą swobodnie oddawać cześć Bogu, a mienie Kościołów ma zostać zwrócone. Licyniusz ogłasza to w Nikomedii w czerwcu."
      it: "Costantino e Licinio si incontrano a Milano e concordano che i cristiani, e tutti gli altri, possano praticare liberamente il proprio culto e che i beni delle chiese siano restituiti. Licinio lo pubblica a Nicomedia in giugno."
      nl: "Constantijn en Licinius komen samen in Milaan en spreken af dat de christenen, en alle anderen, hun godsdienst vrij mogen uitoefenen en dat de kerken hun bezittingen terugkrijgen. Licinius maakt het in juni in Nicomedia bekend."
      cs: "Konstantin a Licinius se setkávají v Miláně a shodují se, že křesťané i všichni ostatní smějí svobodně vyznávat své náboženství a že církvím má být vrácen jejich majetek. Licinius to v červnu vyhlašuje v Nikomédii."
      sv: "Konstantin och Licinius möts i Milano och kommer överens om att kristna, liksom alla andra, fritt får utöva sin gudsdyrkan, och att kyrkornas egendom ska lämnas tillbaka. Licinius kungör det i Nikomedia i juni."
      nb: "Konstantin og Licinius møtes i Milano og blir enige om at kristne, og alle andre, fritt kan holde sin gudsdyrkelse, og at kirkenes eiendom skal gis tilbake. Licinius kunngjør det i Nikomedia i juni."
      tl: "Nagkikita sa Milan sina Constantino at Licinio at nagkakasundong ang mga Cristiano, at ang lahat ng iba pa, ay malayang makasamba, at ibabalik ang ari-arian ng mga simbahan. Inilalathala ito ni Licinio sa Nicomedia noong Hunyo."
      da: "Konstantin og Licinius mødes i Milano og bliver enige om, at kristne og alle andre frit må udøve deres gudsdyrkelse, og at kirkernes ejendom skal gives tilbage. Licinius offentliggør det i Nikomedeia i juni."
      sr: "Константин и Лициније састају се у Милану и договарају да хришћани, као и сви остали, могу слободно да врше своје богослужење и да се црквама врати имовина. Лициније то објављује у Никомедији у јуну."
      hu: "Constantinus és Licinius Milánóban találkoznak, és megegyeznek abban, hogy a keresztények és mindenki más szabadon gyakorolhatják vallásukat, és hogy az egyházak javait vissza kell adni. Licinius júniusban teszi közzé Nikomédeiában."
      fi: "Konstantinus ja Licinius tapaavat Milanossa ja sopivat, että kristityt ja kaikki muutkin saavat harjoittaa jumalanpalvelusta vapaasti ja että kirkkojen omaisuus annetaan takaisin. Licinius julkaisee sopimuksen Nikomediassa kesäkuussa."
      vi: "Constantinus và Licinius gặp nhau ở Milan và thỏa thuận rằng các Cơ Đốc nhân, cũng như mọi người khác, được tự do thờ phượng, và tài sản của các nhà thờ được trả lại. Licinius công bố điều đó tại Nicomedia vào tháng 6."
      ro: "Constantin și Liciniu se întâlnesc la Milan și se învoiesc ca creștinii, ca și toți ceilalți, să se poată închina în libertate, iar bunurile bisericilor să fie înapoiate. Liciniu publică hotărârea la Nicomedia în iunie."
      bg: "Константин и Лициний се срещат в Милано и се споразумяват, че християните и всички останали могат свободно да изповядват вярата си и че имуществото на църквите трябва да им бъде върнато. Лициний го обнародва в Никомедия през юни."
  - place: "148217" # Arelate: Arles
    year: "AD 314"
    source:
      cite:
        en: "Eusebius, Church History 10.5.21-24"
        ru: "Евсевий, Церковная история 10.5.21-24"
        uk: "Євсевій, Церковна історія 10.5.21-24"
