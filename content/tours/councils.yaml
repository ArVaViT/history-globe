      en: "Nestorius of Constantinople will not call Mary the Mother of God. Cyril of Alexandria opens the council before John of Antioch arrives, and Nestorius is deposed."
      ru: "Несторий Константинопольский не соглашается называть Марию Богородицей. Кирилл Александрийский открывает собор, не дождавшись Иоанна Антиохийского, и Нестория низлагают."
      uk: "Несторій Константинопольський не хоче називати Марію Богородицею. Кирило Александрійський відкриває собор до прибуття Іоанна Антіохійського, і Несторія скидають."
      es: "Nestorio de Constantinopla no quiere llamar a María Madre de Dios. Cirilo de Alejandría abre el concilio antes de que llegue Juan de Antioquía, y Nestorio es depuesto."
      pt: "Nestório de Constantinopla se recusa a chamar Maria de Mãe de Deus. Cirilo de Alexandria abre o concílio antes que João de Antioquia chegue, e Nestório é deposto."
      de: "Nestorius von Konstantinopel will Maria nicht Gottesmutter nennen. Kyrill von Alexandria eröffnet das Konzil, ehe Johannes von Antiochia eintrifft, und Nestorius wird abgesetzt."
      fr: "Nestorius de Constantinople refuse d’appeler Marie la Mère de Dieu. Cyrille d’Alexandrie ouvre le concile avant l’arrivée de Jean d’Antioche, et Nestorius est déposé."
      pl: "Nestoriusz z Konstantynopola nie chce nazywać Maryi Matką Bożą. Cyryl Aleksandryjski otwiera sobór, zanim przybędzie Jan z Antiochii, i Nestoriusz zostaje złożony z urzędu."
      it: "Nestorio di Costantinopoli non vuole chiamare Maria Madre di Dio. Cirillo di Alessandria apre il concilio prima che arrivi Giovanni di Antiochia, e Nestorio viene deposto."
      nl: "Nestorius van Constantinopel wil Maria niet Moeder van God noemen. Cyrillus van Alexandrië opent het concilie voordat Johannes van Antiochië is aangekomen, en Nestorius wordt afgezet."
      cs: "Nestorios z Konstantinopole odmítá nazývat Marii Bohorodicí. Cyril Alexandrijský zahajuje koncil dříve, než přijede Jan Antiochijský, a Nestorios je sesazen."
      sv: "Nestorios av Konstantinopel vill inte kalla Maria Guds moder. Kyrillos av Alexandria öppnar konciliet innan Johannes av Antiochia har anlänt, och Nestorios avsätts."
      nb: "Nestorios av Konstantinopel vil ikke kalle Maria Guds mor. Kyrillos av Aleksandria åpner kirkemøtet før Johannes av Antiokia er kommet, og Nestorios blir avsatt."
      tl: "Ayaw tawagin ni Nestorio ng Constantinopla si Maria na Ina ng Diyos. Binubuksan ni Cirilo ng Alejandria ang konseho bago dumating si Juan ng Antioquia, at napatatalsik si Nestorio."
      da: "Nestorios af Konstantinopel vil ikke kalde Maria Guds Moder. Kyrillos af Alexandria åbner koncilet, før Johannes af Antiokia når frem, og Nestorios bliver afsat."
      sr: "Несторије Цариградски неће да назове Марију Богородицом. Кирило Александријски отвара сабор пре доласка Јована Антиохијског, а Несторије бива свргнут."
      hu: "A konstantinápolyi Nesztoriosz nem akarja Máriát Isten Anyjának nevezni. Alexandriai Cirill megnyitja a zsinatot, mielőtt Antiókhiai János megérkezne, és Nesztorioszt megfosztják hivatalától."
      fi: "Konstantinopolin Nestorius ei suostu kutsumaan Mariaa Jumalan äidiksi. Aleksandrian Kyrillos avaa kirkolliskokouksen ennen kuin Antiokian Johannes ehtii paikalle, ja Nestorius erotetaan virastaan."
      vi: "Nestorius thành Constantinopolis không chịu gọi Ma-ri là Mẹ Đức Chúa Trời. Cyril thành A-léc-xan-tri khai mạc công đồng trước khi Johannes thành An-ti-ốt đến, và Nestorius bị phế truất."
      ro: "Nestorie al Constantinopolului nu vrea să o numească pe Maria Născătoare de Dumnezeu. Chiril al Alexandriei deschide sinodul înainte de sosirea lui Ioan al Antiohiei, iar Nestorie este depus."
      bg: "Несторий Константинополски отказва да нарича Мария Богородица. Кирил Александрийски открива събора, преди да пристигне Йоан Антиохийски, и Несторий е низложен."
  - place: "520988" # Chalcedon
    year: "AD 451"
    source:
      cite:
        en: "Council of Chalcedon, Definition of Faith"
        ru: "Халкидонский собор, вероопределение"
        uk: "Халкедонський собор, віровизначення"
        es: "Concilio de Calcedonia, Definición de fe"
        pt: "Concílio de Calcedônia, Definição de Fé"
        de: "Konzil von Chalkedon, Glaubensdefinition"
        fr: "Concile de Chalcédoine, Définition de foi"
        pl: "Sobór chalcedoński, Definicja wiary"
        it: "Concilio di Calcedonia, Definizione di fede"
        nl: "Concilie van Chalcedon, Geloofsdefinitie"
        cs: "Chalkedonský koncil, Definice víry"
        sv: "Konciliet i Chalkedon, trosdefinitionen"
        nb: "Kirkemøtet i Kalkedon, trosdefinisjonen"
        tl: "Konseho ng Calcedonia, Pagpapakahulugan ng Pananampalataya"
        da: "Koncilet i Chalkedon, Trosdefinitionen"
        sr: "Халкидонски сабор, Одредба вере"
        hu: "Khalkédóni zsinat, Hitdefiníció"
        fi: "Khalkedonin kirkolliskokous, Uskonmääritelmä"
        vi: "Công đồng Chalcedon, Định tín"
        ro: "Sinodul de la Calcedon, Definiția de credință"
        bg: "Халкидонски събор, Вероопределение"
      url: "https://www.newadvent.org/fathers/3811.htm"
    note:
      en: "Across the strait from Constantinople, the bishops confess one Christ in two natures, without confusion, without change, without division, without separation."
      ru: "Напротив Константинополя, через пролив, епископы исповедуют единого Христа в двух природах, неслитно, неизменно, нераздельно, неразлучно."
      uk: "Навпроти Константинополя, через протоку, єпископи сповідують єдиного Христа у двох природах, незлитно, незмінно, нероздільно, нерозлучно."
      es: "Frente a Constantinopla, al otro lado del estrecho, los obispos confiesan a un solo Cristo en dos naturalezas, sin confusión, sin cambio, sin división, sin separación."
      pt: "Do outro lado do estreito, defronte de Constantinopla, os bispos confessam um só Cristo em duas naturezas, sem confusão, sem mudança, sem divisão, sem separação."
      de: "Konstantinopel gegenüber, jenseits der Meerenge, bekennen die Bischöfe den einen Christus in zwei Naturen, unvermischt, unverändert, ungeteilt, ungetrennt."
      fr: "En face de Constantinople, de l’autre côté du détroit, les évêques confessent un seul Christ en deux natures, sans confusion, sans changement, sans division, sans séparation."
      pl: "Po drugiej stronie cieśniny, naprzeciw Konstantynopola, biskupi wyznają jednego Chrystusa w dwóch naturach, bez zmieszania, bez zmiany, bez podziału, bez rozdzielenia."
      it: "Di fronte a Costantinopoli, al di là dello stretto, i vescovi confessano un solo Cristo in due nature, senza confusione, senza mutamento, senza divisione, senza separazione."
      nl: "Aan de overkant van de zeestraat, tegenover Constantinopel, belijden de bisschoppen één Christus in twee naturen, onvermengd, onveranderd, ongedeeld en ongescheiden."
      cs: "Naproti Konstantinopoli přes průliv vyznávají biskupové jednoho Krista ve dvou přirozenostech, bez smísení, beze změny, bez rozdělení, bez oddělení."
      sv: "Tvärs över sundet från Konstantinopel bekänner biskoparna en enda Kristus i två naturer, utan sammanblandning, utan förändring, utan delning, utan åtskillnad."
      nb: "Rett over sundet fra Konstantinopel bekjenner biskopene én Kristus i to naturer, uten sammenblanding, uten forandring, uten deling, uten adskillelse."
      tl: "Sa kabila ng kipot mula sa Constantinopla, ipinahahayag ng mga obispo ang isang Cristo sa dalawang kalikasan, nang walang paghahalo, nang walang pagbabago, nang walang paghahati, nang walang paghihiwalay."
      da: "Over for Konstantinopel, på den anden side af strædet, bekender biskopperne én Kristus i to naturer, uden sammenblanding, uden forandring, uden deling, uden adskillelse."
      sr: "Преко мореуза од Цариграда, епископи исповедају једног Христа у две природе, неслитно, непроменљиво, нераздељиво и неразлучно."
      hu: "A szoros túlpartján, Konstantinápollyal szemben a püspökök egy Krisztust vallanak két természetben, keveredés nélkül, változás nélkül, megosztás nélkül, elválasztás nélkül."
      fi: "Konstantinopolista salmen toisella puolella piispat tunnustavat yhden Kristuksen kahdessa luonnossa, sekoittumatta, muuttumatta, jakautumatta, erottumatta."
      vi: "Bên kia eo biển đối diện Constantinopolis, các giám mục xưng nhận một Đấng Christ trong hai bản tính, không lẫn lộn, không biến đổi, không phân chia, không tách rời."
      ro: "De cealaltă parte a strâmtorii, față în față cu Constantinopolul, episcopii mărturisesc un singur Hristos în două firi, în chip neamestecat, neschimbat, neîmpărțit și nedespărțit."
      bg: "Отвъд пролива, срещу Константинопол, епископите изповядват един Христос в две природи неслитно, неизменно, неразделно и неразлъчно."
