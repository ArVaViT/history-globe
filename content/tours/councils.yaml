    note:
      en: "The church of Africa is split over bishops who gave up the Scriptures in the persecution. Constantine calls bishops from many provinces to Arles to settle it, after a hearing at Rome had not."
      ru: "Африканская церковь расколота из-за епископов, выдавших Писания во время гонения. Константин созывает в Арль епископов из многих провинций, чтобы решить спор, который не разрешило разбирательство в Риме."
      uk: "Африканська церква розколота через єпископів, які під час гоніння видали Писання. Костянтин скликає єпископів із багатьох провінцій до Арля, щоб владнати справу, після того як розгляд у Римі її не владнав."
      es: "La Iglesia de África está dividida a causa de los obispos que entregaron las Escrituras durante la persecución. Constantino convoca a Arlés a obispos de muchas provincias para resolverlo, después de que una audiencia en Roma no lo lograra."
      pt: "A igreja da África está dividida por causa dos bispos que entregaram as Escrituras na perseguição. Constantino convoca bispos de muitas províncias a Arles para resolver a questão, depois que uma audiência em Roma não a resolvera."
      de: "Die Kirche Afrikas ist gespalten wegen der Bischöfe, die in der Verfolgung die Heiligen Schriften ausgeliefert hatten. Konstantin ruft Bischöfe aus vielen Provinzen nach Arles, um den Streit beizulegen, nachdem eine Verhandlung in Rom dies nicht vermocht hatte."
      fr: "L’Église d’Afrique est divisée à propos des évêques qui avaient livré les Écritures pendant la persécution. Constantin convoque à Arles des évêques de nombreuses provinces pour trancher l’affaire, une audience tenue à Rome n’y étant pas parvenue."
      pl: "Kościół w Afryce jest podzielony z powodu biskupów, którzy w czasie prześladowania wydali Pisma. Konstantyn wzywa biskupów z wielu prowincji do Arelate, by to rozstrzygnąć, gdy rozpatrzenie sprawy w Rzymie nie przyniosło skutku."
      it: "La chiesa d’Africa è divisa a causa dei vescovi che nella persecuzione avevano consegnato le Scritture. Costantino convoca ad Arles vescovi di molte province per risolvere la questione, dopo che un’udienza a Roma non c’era riuscita."
      nl: "De kerk van Afrika is verdeeld over bisschoppen die in de vervolging de Schriften hadden uitgeleverd. Constantijn roept bisschoppen uit vele provincies naar Arles om de zaak te beslechten, nadat een zitting in Rome daar niet in was geslaagd."
      cs: "Africká církev je rozdělena kvůli biskupům, kteří za pronásledování vydali Písma. Konstantin svolává biskupy z mnoha provincií do Arles, aby spor urovnali, když slyšení v Římě řešení nepřineslo."
      sv: "Afrikas kyrka är splittrad över biskopar som lämnade ut Skrifterna under förföljelsen. Konstantin kallar biskopar från många provinser till Arles för att avgöra saken, sedan en förhandling i Rom inte hade lyckats."
      nb: "Kirken i Afrika er splittet over biskoper som utleverte Skriftene under forfølgelsen. Konstantin kaller biskoper fra mange provinser til Arles for å avgjøre saken, etter at en høring i Roma ikke hadde gjort det."
      tl: "Nahahati ang iglesia ng Africa dahil sa mga obispong nagsuko ng mga Kasulatan sa pag-uusig. Ipinatatawag ni Constantino ang mga obispo mula sa maraming lalawigan sa Arles upang ayusin ito, matapos hindi ito maayos ng isang pagdinig sa Roma."
      da: "Den afrikanske kirke er splittet over biskopper, som under forfølgelsen udleverede Skrifterne. Konstantin kalder biskopper fra mange provinser til Arles for at afgøre sagen, efter at en høring i Rom ikke havde gjort det."
      sr: "Црква у Африци подељена је због епископа који су у прогону предали Писмо. Константин сазива епископе из многих провинција у Арл да то реше, пошто то није решила расправа у Риму."
      hu: "Afrika egyháza meghasonlik azok miatt a püspökök miatt, akik az üldözésben kiszolgáltatták a Szentírást. Constantinus sok tartomány püspökeit hívja Arles-ba, hogy rendezzék az ügyet, miután egy római tárgyalás nem hozott megoldást."
      fi: "Afrikan kirkko on jakautunut niiden piispojen vuoksi, jotka luovuttivat Raamatun vainon aikana. Konstantinus kutsuu piispoja monista provinsseista Arlesiin ratkaisemaan asian, kun käsittely Roomassa ei ollut sitä ratkaissut."
      vi: "Hội thánh Africa bị chia rẽ vì những giám mục đã nộp Kinh Thánh trong cuộc bách hại. Constantinus triệu tập các giám mục từ nhiều tỉnh đến Arles để giải quyết, sau khi một phiên xét xử ở Rô-ma đã không giải quyết được."
      ro: "Biserica Africii este dezbinată din pricina episcopilor care au predat Scripturile în timpul persecuției. Constantin cheamă episcopi din multe provincii la Arles ca să pună capăt disputei, pe care o judecată la Roma nu o rezolvase."
      bg: "Църквата в Африка е разделена заради епископи, които са предали Писанията по време на гонението. Константин свиква епископи от много провинции в Арл, за да уредят въпроса, след като разглеждането на делото в Рим не е успяло да го уреди."
