# The book of Ruth, in the order of the text. The tour's year (1100 BC) is a point for
# the map "in the days when the judges ruled" (Ruth 1:1), whose chronology is disputed.
id: ruth
title:
  en: "Ruth"
  ru: "Руфь"
  uk: "Рут"
  es: "Rut"
  pt: "Rute"
  de: "Rut"
  fr: "Ruth"
  pl: "Rut"
  it: "Rut"
  nl: "Ruth"
  cs: "Rut"
  sv: "Rut"
  nb: "Rut"
  tl: "Ruth"
year: "1100 BC"
people: ["Ruth@Rut.1.4-Mat"]
approximate: true
stops:
  - place: a112427 # Bethlehem
    ref: Ruth.1.1
    note:
      en: "In a famine a man of Bethlehem-judah goes with his wife and two sons to sojourn in the country of Moab."
      ru: "Во время голода человек из Вифлеема Иудейского уходит с женой и двумя сыновьями жить на полях Моавитских."
      uk: "Під час голоду чоловік із Вифлеєму Юдиного йде з дружиною й двома синами пожити в краї Моавському."
      es: "En una hambruna un hombre de Belén de Judá va con su mujer y sus dos hijos a residir en el país de Moab."
      pt: "Numa fome, um homem de Belém de Judá vai com a mulher e os dois filhos viver como estrangeiro na terra de Moabe."
      de: "In einer Hungersnot zieht ein Mann aus Bethlehem in Juda mit seiner Frau und seinen zwei Söhnen, um sich im Land Moab aufzuhalten."
      fr: "Pendant une famine, un homme de Bethléhem de Juda part avec sa femme et ses deux fils faire un séjour dans le pays de Moab."
      pl: "Podczas głodu pewien mąż z Betlejem Judzkiego udaje się z żoną i dwoma synami, aby przebywać w kraju Moabu."
      it: "Durante una carestia un uomo di Betlemme di Giuda va con la moglie e i due figli a soggiornare nel paese di Moab."
      nl: "Tijdens een hongersnood trekt een man uit Bethlehem in Juda met zijn vrouw en twee zonen naar het land Moab om er te verblijven."
      cs: "Za hladu odchází muž z Betléma Judova s manželkou a dvěma syny pobývat do země Moáb."
      sv: "Under en hungersnöd drar en man från Betlehem i Juda med sin hustru och två söner för att leva som främling i Moabs land."
      nb: "I en hungersnød drar en mann fra Betlehem i Juda med sin hustru og to sønner for å bo en tid i Moabs land."
      tl: "Sa isang taggutom, ang isang lalaki ng Bethlehem-juda ay pumaroon, kasama ang kaniyang asawa at dalawang anak na lalaki, upang makipamayan sa lupain ng Moab."
  - place: aa0b1d6 # Moab
    ref: Ruth.1.2-Ruth.1.18
    note:
      en: 'Widowed in Moab, Ruth will not leave Naomi: "whither thou goest, I will go."'
      ru: "Овдовев в Моаве, Руфь не оставляет Ноемини: «куда ты пойдешь, туда и я пойду»."
      uk: "Овдовівши в Моаві, Рут не хоче залишити Ноемі: «куди підеш ти, туди й я піду»."
      es: "Viuda en Moab, Rut no quiere dejar a Noemí: «donde quiera que tú fueres, iré yo»."
      pt: "Viúva em Moabe, Rute não quer deixar Noemi: “aonde quer que você for, eu irei.”"
      de: "Verwitwet in Moab, will Rut Naemi nicht verlassen: „Wo du hin gehst, da will ich auch hin gehen.“"
      fr: "Veuve à Moab, Ruth ne veut pas quitter Naomi : « Où tu iras j’irai. »"
      pl: "Owdowiała w Moabie Rut nie chce opuścić Noemi: „gdziekolwiek pójdziesz, z tobą pójdę.”"
      it: "Rimasta vedova in Moab, Rut non vuole lasciare Noemi: «dove andrai tu, andrò anch’io»."
      nl: "Als weduwe in Moab wil Ruth Naomi niet verlaten: “waar gij zult heengaan, zal ik ook heengaan.”"
      cs: "Rut, ovdovělá v Moábu, neopouští Noemi: „kamž se koli obrátíš, půjdu“."
      sv: "Rut, änka i Moab, vill inte lämna Noomi: ”dit du går vill ock jag gå.”"
      nb: "Rut, enke i Moab, vil ikke forlate Noomi: «dit du går, vil jeg gå»."
      tl: "Balo na sa Moab, hindi iniwan ni Ruth si Noemi: “kung saan ka pumaroon, ay paroroon ako.”"
  - place: a112427 # Bethlehem
    ref: Ruth.1.19-Ruth.4.17
    note:
      en: "In Bethlehem she gleans in the field of Boaz and becomes his wife; her son Obed is the grandfather of David."
      ru: "В Вифлееме она подбирает колосья на поле Вооза и становится его женой; её сын Овид — дед Давида."
      uk: "У Вифлеємі вона збирає колоски на полі Вооза й стає його дружиною; її син Овед — дід Давида."
      es: "En Belén espiga en el campo de Booz y llega a ser su esposa; su hijo Obed es el abuelo de David."
      pt: "Em Belém ela respiga no campo de Boaz e torna-se sua esposa; seu filho Obede é o avô de Davi."
      de: "In Bethlehem liest sie auf dem Feld des Boas Ähren auf und wird seine Frau; ihr Sohn Obed ist der Großvater Davids."
      fr: "À Bethléhem, elle glane dans le champ de Boaz et devient sa femme ; son fils Obed est le grand-père de David."
      pl: "W Betlejem zbiera kłosy na polu Booza i zostaje jego żoną; jej syn Obed jest dziadem Dawida."
      it: "A Betlemme spigola nel campo di Booz e ne diventa la moglie; suo figlio Obed è il nonno di Davide."
      nl: "In Bethlehem raapt zij aren op het veld van Boaz en wordt zijn vrouw; haar zoon Obed is de grootvader van David."
      cs: "V Betlémě sbírá klasy na poli Bóazově a stává se jeho ženou; její syn Obéd je dědem Davidovým."
      sv: "I Betlehem plockar hon ax på Boas’ åker och blir hans hustru; hennes son Oved är farfar till David."
      nb: "I Betlehem sanker hun aks på Boas' mark og blir hans hustru; hennes sønn Obed er Davids bestefar."
      tl: "Sa Bethlehem, nagtipon siya ng mga uhay sa bukid ni Booz at naging asawa nito; ang kanilang anak na si Obed ay lolo ni David."
