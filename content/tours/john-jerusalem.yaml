# Jesus in Jerusalem as the Gospel of John tells it, in the order of the text: John names
# places in the city that the other Gospels do not. The year (AD 30) is the same
# conventional point as the life of Jesus tour; John names three Passovers (2:13, 6:4,
# 11:55).
id: john-jerusalem
title:
  en: "Jesus in Jerusalem, after John"
  ru: "Иисус в Иерусалиме, по Иоанну"
  uk: "Ісус у Єрусалимі за Іваном"
  es: "Jesús en Jerusalén, según Juan"
  pt: "Jesus em Jerusalém, segundo João"
  de: "Jesus in Jerusalem nach Johannes"
  fr: "Jésus à Jérusalem, selon Jean"
  pl: "Jezus w Jerozolimie według Jana"
  it: "Gesù a Gerusalemme, secondo Giovanni"
  nl: "Jezus in Jeruzalem, volgens Johannes"
  cs: "Ježíš v Jeruzalémě podle Jana"
  sv: "Jesus i Jerusalem, enligt Johannes"
year: "AD 30"
people: ["Jesus@Isa.7.14-Rev"]
approximate: true
stops:
  - place: a15257a # Jerusalem
    ref: John.2.13-John.2.22
    note:
      en: 'At the Passover He drives the traders from the Temple: "make not my Father''s house an house of merchandise."'
      ru: "На Пасху Он изгоняет торгующих из храма: «дома Отца Моего не делайте домом торговли»."
      uk: "На Пасху Він виганяє торговців із храму: «не робіть дому Отця мого домом торговим»."
      es: "En la Pascua expulsa del Templo a los mercaderes: «no hagáis la casa de mi Padre casa de mercado»."
      pt: "Na Páscoa, Ele expulsa os mercadores do Templo: “Não façam da casa de meu Pai um mercado!”"
      de: "Zum Passafest treibt er die Händler aus dem Tempel: „macht nicht meines Vaters Haus zum Kaufhause!“"
      fr: "À la Pâque, il chasse les marchands du temple : « ne faites pas de la maison de mon Père une maison de trafic »."
      pl: "W święto Paschy wypędza ze świątyni handlujących: „nie czyńcie domu Ojca mego domem kupieckim.”"
      it: "A Pasqua scaccia i venditori dal Tempio: «non fate della casa del Padre mio una casa di mercato»."
      nl: "Met het Pascha drijft Hij de handelaars uit de tempel: “maakt niet het huis Mijns Vaders tot een huis van koophandel.”"
      cs: "O velikonocích vyhání z chrámu obchodníky: „nečiňte domu Otce mého domem kupeckým“."
      sv: "Vid påsken driver han ut köpmännen ur templet: ”Gören icke min Faders hus till ett marknadshus.”"
  - place: a0aa8cf # Bethesda
    ref: John.5.2-John.5.9
    note:
      en: 'At the pool of Bethesda by the sheep market He heals a man who had an infirmity thirty-eight years: "Rise, take up thy bed, and walk."'
      ru: "У купальни Вифезда при Овечьих воротах Он исцеляет человека, болевшего тридцать восемь лет: «встань, возьми постель твою и ходи»."
      uk: "Біля купелі Віфезда, поблизу овечого ринку, Він зцілює чоловіка, що тридцять вісім років був недужий: «Устань, візьми постїль твою, та й ходи!»"
      es: "En el estanque de Betesda, junto a la puerta del ganado, sana a un hombre que llevaba treinta y ocho años enfermo: «Levántate, toma tu lecho, y anda»."
      pt: "No tanque de Betesda, junto ao mercado de ovelhas, Ele cura um homem enfermo havia trinta e oito anos: “Levante-se, pegue a sua maca e ande.”"
      de: "Am Teich Betesda beim Schaftor heilt er einen Mann, der achtunddreißig Jahre lang krank war: „Stehe auf, nimm dein Bett und gehe hin!“"
      fr: "À la piscine de Béthesda, près de la porte des Brebis, il guérit un homme malade depuis trente-huit ans : « Lève-toi, prends ton lit, et marche. »"
      pl: "Przy sadzawce Betesda koło targu owiec uzdrawia człowieka, który chorował trzydzieści osiem lat: „Wstań, weźmij łoże twoje, a chodź.”"
      it: "Alla vasca di Betesda, presso la porta delle Pecore, guarisce un uomo infermo da trentotto anni: «Lèvati, prendi il tuo lettuccio, e cammina»."
      nl: "Bij de vijver van Bethesda, bij de Schaapspoort, geneest Hij een man die achtendertig jaar ziek was: “Sta op, neem uw beddeken op, en wandel.”"
      cs: "U rybníka Bethesda u Brány bravné uzdravuje člověka, který byl osm a třicet let nemocen: „Vstaň, vezmi lože své a choď.“"
      sv: "Vid dammen Betesda vid Fårporten botar han en man som varit sjuk i trettioåtta år: ”Stå upp, tag din säng och gå.”"
  - place: a294859 # Siloam
    ref: John.9.1-John.9.25
    note:
      en: 'A man born blind washes in the pool of Siloam and comes back seeing: "whereas I was blind, now I see."'
      ru: "Слепорождённый умывается в купальне Силоам и приходит зрячим: «я был слеп, а теперь вижу»."
      uk: "Чоловік, сліпий від народження, умивається в купелі Сілоам і повертається зрячим: «слїпим бувши, тепер бачу»."
      es: "Un hombre ciego de nacimiento se lava en el estanque de Siloé y vuelve viendo: «habiendo yo sido ciego, ahora veo»."
      pt: "Um homem cego de nascença se lava no tanque de Siloé e volta enxergando: “eu era cego e agora vejo.”"
      de: "Ein Blindgeborener wäscht sich im Teich Siloah und kommt sehend zurück: „daß ich blind war und bin nun sehend“."
      fr: "Un aveugle de naissance se lave à la piscine de Siloé et revient voyant : « j’étais aveugle et maintenant je vois »."
      pl: "Człowiek niewidomy od urodzenia obmywa się w sadzawce Siloe i wraca widzący: „będąc ślepym, teraz widzę.”"
      it: "Un uomo nato cieco si lava nella vasca di Siloe e torna vedendo: «ero cieco e ora ci vedo»."
      nl: "Een blindgeborene wast zich in de vijver van Siloam en komt ziende terug: “een ding weet ik, dat ik blind was, en nu zie.”"
      cs: "Slepý od narození se umývá v rybníku Siloe a vrací se vida: „byv slepý, již nyní vidím“."
      sv: "En man född blind tvättar sig i dammen Siloa och kommer tillbaka seende: ”ett vet jag: att jag, som var blind, nu kan se.”"
  - place: a47c817 # Solomon's Portico
    ref: John.10.22-John.10.30
    note:
      en: 'At the feast of dedication, in Solomon’s Portico: "I and my Father are one."'
      ru: "В праздник обновления, в притворе Соломоновом: «Я и Отец — одно»."
      uk: "На свято оновлення, у Соломоновому портику: «Я і Отець одно»."
      es: "En la fiesta de la dedicación, en el Pórtico de Salomón: «Yo y el Padre una cosa somos»."
      pt: "Na festa da Dedicação, no Pórtico de Salomão: “Eu e o Pai somos um.”"
      de: "Beim Fest der Tempelweihe, in der Halle Salomos: „Ich und der Vater sind eins.“"
      fr: "À la fête de la Dédicace, dans le Portique de Salomon : « Moi et le Père nous sommes un. »"
      pl: "W święto Poświęcenia, w Krużganku Salomona: „Ja i Ojciec jedno jesteśmy.”"
      it: "Alla festa della Dedicazione, nel portico di Salomone: «Io ed il Padre siamo uno»."
      nl: "Op het feest van de inwijding, in de Zuilengang van Salomo: “Ik en de Vader zijn een.”"
      cs: "Na slavnost posvěcení chrámu, v Šalomounově podloubí: „Já a Otec jedno jsme.“"
      sv: "Vid tempelinvigningens högtid, i Salomos pelarhall: ”Jag och Fadern äro ett.”"
  - place: a4f35bc # Bethany
    ref: John.11.1-John.11.44
    note:
      en: 'At Bethany, near Jerusalem, He raises Lazarus: "I am the resurrection, and the life."'
      ru: "В Вифании, близ Иерусалима, Он воскрешает Лазаря: «Я есмь воскресение и жизнь»."
      uk: "У Віфанії, поблизу Єрусалима, Він воскрешає Лазаря: «Я воскресеннє і життє»."
      es: "En Betania, cerca de Jerusalén, resucita a Lázaro: «Yo soy la resurrección y la vida»."
      pt: "Em Betânia, perto de Jerusalém, Ele ressuscita Lázaro: “Eu sou a ressurreição e a vida.”"
      de: "In Bethanien bei Jerusalem erweckt er Lazarus: „Ich bin die Auferstehung und das Leben.“"
      fr: "À Béthanie, près de Jérusalem, il ressuscite Lazare : « Je suis la résurrection et la vie. »"
      pl: "W Betanii, niedaleko Jerozolimy, wskrzesza Łazarza: „Jam jest zmartwychwstanie i żywot.”"
      it: "A Betania, presso Gerusalemme, risuscita Lazzaro: «Io son la resurrezione e la vita»."
      nl: "Te Bethanië, bij Jeruzalem, wekt Hij Lazarus op: “Ik ben de Opstanding en het Leven.”"
      cs: "V Betanii u Jeruzaléma křísí Lazara: „Já jsem vzkříšení i život.“"
      sv: "I Betania, nära Jerusalem, uppväcker han Lasaros: ”Jag är uppståndelsen och livet.”"
  - place: a553110 # Kidron
    ref: John.18.1-John.18.12
    note:
      en: "Across the brook Kidron, in the garden, He is arrested."
      ru: "За потоком Кедрон, в саду, Его берут под стражу."
      uk: "За потоком Кедрон, у саду, Його заарештовують."
      es: "Al otro lado del torrente Cedrón, en el huerto, es arrestado."
      pt: "Do outro lado do ribeiro de Cedrom, no jardim, Ele é preso."
      de: "Jenseits des Baches Kidron wird er im Garten gefangen genommen."
      fr: "Au-delà du torrent du Cédron, dans le jardin, il est arrêté."
      pl: "Za potokiem Cedron, w ogrodzie, zostaje pojmany."
      it: "Al di là del torrente Cedron, nel giardino, viene arrestato."
      nl: "Over de beek Kidron, in de hof, wordt Hij gevangengenomen."
      cs: "Za potokem Kidron, v zahradě, je zatčen."
      sv: "På andra sidan bäcken Kidron, i trädgården, grips han."
  - place: aec23b1 # Gabbatha
    ref: John.19.13-John.19.16
    note:
      en: "Pilate sits in the judgment seat at the place called the Pavement, in Hebrew Gabbatha."
      ru: "Пилат садится на судилище, на месте, называемом Лифостротон, а по-еврейски Гаввафа."
      uk: "Пилат сидить на судилищі в місці, що зветься Литостротос, івритом Габбата."
      es: "Pilato se sienta en el tribunal, en el lugar llamado el Enlosado, en hebreo Gábata."
      pt: "Pilatos se assenta no tribunal, no lugar chamado Pavimento, em hebraico Gabatá."
      de: "Pilatus sitzt auf dem Richtstuhl an dem Ort, der Pflaster heißt, auf Hebräisch Gabbata."
      fr: "Pilate siège sur le tribunal, au lieu appelé le Pavé, en hébreu Gabbatha."
      pl: "Piłat zasiada na trybunale w miejscu zwanym Wybrukowanym, po hebrajsku Gabbata."
      it: "Pilato siede in tribunale nel luogo detto Lastrico, in ebraico Gabbata."
      nl: "Pilatus zit op de rechterstoel op de plaats die het Plaveisel heet, in het Hebreeuws Gabbata."
      cs: "Pilát sedí na soudné stolici na místě zvaném Dlažba, hebrejsky Gabata."
      sv: "Pilatus sitter på domarsätet på platsen som kallas Stenläggningen, på hebreiska Gabbata."
  - place: a631d35 # Golgotha
    ref: John.19.17-John.19.30
    note:
      en: 'At Golgotha He is crucified: "It is finished."'
      ru: "На Голгофе Его распинают: «совершилось!»"
      uk: "На Голгофі Його розпинають: «Звершилось»."
      es: "En el Gólgota es crucificado: «Consumado es»."
      pt: "No Gólgota Ele é crucificado: “Está consumado!”"
      de: "Auf Golgatha wird er gekreuzigt: „Es ist vollbracht!“"
      fr: "Au Golgotha, il est crucifié : « Tout est accompli. »"
      pl: "Na Golgocie zostaje ukrzyżowany: „Wykonało się.”"
      it: "Al Golgota è crocifisso: «È compiuto!»"
      nl: "Op Golgota wordt Hij gekruisigd: “Het is volbracht!”"
      cs: "Na Golgotě je ukřižován: „Dokonánoť jest.“"
      sv: "På Golgota korsfästs han: ”Det är fullbordat.”"
