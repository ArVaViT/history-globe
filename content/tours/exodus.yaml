# The Exodus, from Rameses to Jericho (Exodus 12 - Joshua 6), in the order of the text.
# The tour's year (1446 BC) follows 1 Kgs 6:1, 480 years before the Temple was begun; a
# later date, c. 1260 BC under Ramesses II, is also widely held, so it is a point for the
# map, not a date. Most stations are located only tentatively (the Red Sea and Mount
# Sinai have several proposed sites): the map shows OpenBible's most likely one, and the
# place card lists the others.
id: exodus
title:
  en: "The Exodus"
  ru: "Исход из Египта"
  uk: "Вихід"
  es: "El Éxodo"
  pt: "O Êxodo"
  de: "Der Auszug"
  fr: "L’Exode"
  pl: "Wyjście z Egiptu"
  it: "L’Esodo"
  nl: "De uittocht"
  cs: "Exodus"
  sv: "Uttåget"
  nb: "Utgangen fra Egypt"
  tl: "Ang Exodo"
  da: "Udtoget"
  sr: "Излазак"
  hu: "A kivonulás"
  fi: "Exodus"
  vi: "Cuộc Xuất hành"
  ro: "Exodul"
  bg: "Изходът"
year: "1446 BC"
people: ["Moses@Exo.2.10-Rev"]
approximate: true
stops:
  - place: a079b21 # Rameses
    ref: Exod.12.37
    note:
      en: "The Israelites set out from Rameses, about six hundred thousand men on foot."
      ru: "Сыны Израилевы отправляются из Раамсеса — до шестисот тысяч пеших мужчин."
      uk: "Ізраїльтяни вирушають з Раамсеса, близько шестисот тисяч піших чоловіків."
      es: "Los israelitas parten de Ramesés, unos seiscientos mil hombres de a pie."
      pt: "Os israelitas partem de Ramessés, cerca de seiscentos mil homens a pé."
      de: "Die Israeliten brechen von Ramses auf, etwa sechshunderttausend Mann zu Fuß."
      fr: "Les Israélites partent de Ramsès, environ six cent mille hommes à pied."
      pl: "Izraelici wyruszają z Ramses, około sześciuset tysięcy mężów pieszych."
      it: "Gli Israeliti partono da Ramses, circa seicentomila uomini a piedi."
      nl: "De Israëlieten breken op uit Raämses, zo'n zeshonderdduizend man te voet."
      cs: "Izraelci vycházejí z Ramesse, asi šest set tisíc mužů pěšky."
      sv: "Israeliterna bryter upp från Rameses, omkring sex hundra tusen man till fots."
      nb: "Israelittene bryter opp fra Ramses, omkring seks hundre tusen mann til fots."
      tl: "Naglalakbay ang mga Israelita mula sa Rameses, humigit-kumulang anim na raang libong lalaking naglalakad."
      da: "Israelitterne bryder op fra Ramses, omkring seks hundrede tusind mand til fods."
      sr: "Израиљци полазе из Рамесе, око шест стотина хиљада пешака."
      hu: "Izráel fiai Ramszeszből indulnak el, mintegy hatszázezer gyalogos férfi."
      fi: "Israelilaiset lähtevät liikkeelle Ramseksesta, noin kuusisataatuhatta jalkamiestä."
      vi: "Dân Y-sơ-ra-ên rời Ram-se-sơ, độ sáu trăm ngàn người đi bộ."
      ro: "Israeliții pornesc din Ramses, cam șase sute de mii de bărbați pedeștri."
      bg: "Израилтяните тръгват от Раамсес — около шестстотин хиляди пеши мъже."
  - place: aa28709 # Succoth (in Egypt)
    ref: Num.33.5
    note:
      en: "Their first camp is at Succoth."
      ru: "Первый стан — в Сокхофе."
      uk: "Їхній перший стан — у Сокхоті."
      es: "Su primer campamento está en Sucot."
      pt: "O primeiro acampamento é em Sucote."
      de: "Ihr erstes Lager ist in Sukkot."
      fr: "Leur premier campement est à Succoth."
      pl: "Ich pierwszy obóz znajduje się w Sukkot."
      it: "Il loro primo accampamento è a Succot."
      nl: "Hun eerste kamp is bij Sukkot."
      cs: "Jejich první tábor je v Sukotu."
      sv: "Deras första läger är i Suckot."
      nb: "Deres første leir er ved Sukkot."
      tl: "Ang kanilang unang kampamento ay sa Succoth."
      da: "Deres første lejr er i Sukkot."
      sr: "Први њихов логор је у Сокоту."
      hu: "Első táboruk Szukkótnál van."
      fi: "Heidän ensimmäinen leirinsä on Sukkotissa."
      vi: "Chỗ hạ trại đầu tiên của họ là Su-cốt."
      ro: "Prima lor tabără este la Sucot."
      bg: "Първият им стан е в Сокхот."
  - place: a27d0e0 # Etham
    ref: Exod.13.20-Exod.13.22
    note:
      en: "They camp at Etham, on the edge of the wilderness; the Lord goes before them in a pillar of cloud and of fire."
      ru: "Стан в Ефаме, в конце пустыни; Господь идёт перед ними в столпе облачном и огненном."
      uk: "Вони стають табором в Етамі, на краю пустелі; Господь іде перед ними в стовпі хмари й вогню."
      es: "Acampan en Etam, al borde del desierto; el Señor va delante de ellos en una columna de nube y de fuego."
      pt: "Acampam em Etã, na orla do deserto; o Senhor vai adiante deles numa coluna de nuvem e de fogo."
      de: "Sie lagern in Etam am Rand der Wüste; der Herr zieht vor ihnen her in einer Wolkensäule und einer Feuersäule."
      fr: "Ils campent à Étham, à l’extrémité du désert ; l’Éternel marche devant eux dans une colonne de nuée et de feu."
      pl: "Rozbijają obóz w Etam, na skraju pustyni; Pan idzie przed nimi w słupie obłoku i ognia."
      it: "Si accampano a Etam, ai margini del deserto; il Signore li precede in una colonna di nuvola e di fuoco."
      nl: "Zij slaan hun kamp op bij Etam, aan de rand van de woestijn; de HEER gaat voor hen uit in een wolkkolom en een vuurkolom."
      cs: "Utábořují se v Etamu na okraji pouště; Hospodin jde před nimi v oblakovém a ohnivém sloupu."
      sv: "De slår läger i Etam, vid öknens kant; Herren går framför dem i en molnstod och en eldstod."
      nb: "De slår leir ved Etam, ved kanten av ørkenen; Herren går foran dem i en skystøtte og en ildsøyle."
      tl: "Humahantong sila sa Etham, sa gilid ng ilang; ang Panginoon ay nangunguna sa kanila sa isang haliging ulap at apoy."
      da: "De slår lejr i Etam, ved ørkenens rand; Herren går foran dem i en sky- og ildsøjle."
      sr: "Улогоре се у Етаму, на крају пустиње; Господ иде пред њима у стубу облачном и огњеном."
      hu: "Étámnál táboroznak, a puszta szélén; az Úr felhőoszlopban és tűzoszlopban megy előttük."
      fi: "He leiriytyvät Etamiin, erämaan laitaan; Herra kulkee heidän edellään pilvenpatsaassa ja tulenpatsaassa."
      vi: "Họ hạ trại tại Ê-tam, nơi rìa đồng vắng; Đức Giê-hô-va đi trước họ trong một trụ mây và trụ lửa."
      ro: "Își așază tabăra la Etam, la marginea pustiului; Domnul merge înaintea lor într-un stâlp de nor și de foc."
      bg: "Те се разполагат на стан в Етам, на края на пустинята; Господ върви пред тях в облачен и огнен стълб."
  - place: ababfd2 # Pi-hahiroth
    ref: Exod.14.2
    note:
      en: "They turn back and camp before Pi-hahiroth, between Migdol and the sea."
      ru: "Они поворачивают и становятся станом пред Пи-Гахирофом, между Мигдолом и морем."
      uk: "Вони повертаються й стають табором перед Пі-Гахіротом, між Мігдолом і морем."
      es: "Dan la vuelta y acampan frente a Pi-hahirot, entre Migdol y el mar."
      pt: "Voltam atrás e acampam diante de Pi-Hairote, entre Migdol e o mar."
      de: "Sie wenden um und lagern vor Pi-Hahirot, zwischen Migdol und dem Meer."
      fr: "Ils font demi-tour et campent devant Pi-Hahiroth, entre Migdol et la mer."
      pl: "Zawracają i rozbijają obóz przed Pi-Hachirot, między Migdol a morzem."
      it: "Tornano indietro e si accampano di fronte a Pi-Achirot, tra Migdol e il mare."
      nl: "Zij keren terug en slaan hun kamp op voor Pi-Hachirot, tussen Migdol en de zee."
      cs: "Obracejí se a utábořují se před Pi-hachirótem, mezi Migdolem a mořem."
      sv: "De vänder om och slår läger framför Pi-Hachirot, mellan Migdol och havet."
      nb: "De snur og slår leir foran Pi-Hakirot, mellom Migdol og havet."
      tl: "Bumabalik sila at humahantong sa tapat ng Pi-hahiroth, sa pagitan ng Migdol at ng dagat."
      da: "De vender om og slår lejr foran Pi-ha-Hirot, mellem Migdol og havet."
      sr: "Окрећу се натраг и улогоре се пред Пи-Аиротом, између Мигдола и мора."
      hu: "Visszafordulnak, és Pí-Hahirót előtt táboroznak, Migdol és a tenger között."
      fi: "He kääntyvät takaisin ja leiriytyvät Pi-Hahirotin eteen, Migdolin ja meren väliin."
      vi: "Họ quay lại và hạ trại trước Phi-ha-hi-rốt, giữa Mít-đôn và biển."
      ro: "Se întorc și tăbărăsc înaintea Pi-Hahirotului, între Migdol și mare."
      bg: "Те се връщат и се разполагат пред Пи-Хахирот, между Мигдол и морето."
  - place: a3d18b2 # Red Sea
    ref: Exod.14.21-Exod.15.4
    note:
      en: "The waters part and Israel crosses on dry ground; Pharaoh's army is drowned in the Red Sea."
      ru: "Воды расступаются, и Израиль идёт по суше; войско фараона тонет в Чермном море."
      uk: "Води розступаються, і Ізраїль переходить по сухому; військо фараона тоне в Червоному морі."
      es: "Las aguas se dividen e Israel pasa en seco; el ejército del Faraón se ahoga en el Mar Rojo."
      pt: "As águas se dividem e Israel atravessa em terra seca; o exército do Faraó se afoga no Mar Vermelho."
      de: "Das Wasser teilt sich, und Israel zieht auf trockenem Boden hindurch; das Heer des Pharao ertrinkt im Roten Meer."
      fr: "Les eaux se séparent et Israël traverse à sec ; l’armée du pharaon est engloutie dans la Mer Rouge."
      pl: "Wody się rozstępują i Izrael przechodzi po suchej ziemi; wojsko Faraona tonie w Morzu Czerwonym."
      it: "Le acque si dividono e Israele passa all’asciutto; l’esercito del faraone è sommerso nel Mar Rosso."
      nl: "De wateren splijten en Israël trekt over op het droge; het leger van Farao verdrinkt in de Rode Zee."
      cs: "Vody se rozestupují a Izrael přechází po suchu; faraonovo vojsko se utopí v Rudém moři."
      sv: "Vattnet delar sig och Israel går över på torr mark; faraos här drunknar i Röda havet."
      nb: "Vannet deler seg, og Israel går over på tørr grunn; Faraos hær drukner i Rødehavet."
      tl: "Nahahati ang tubig at tumatawid ang Israel sa tuyong lupa; nalulunod sa Dagat na Pula ang hukbo ni Faraon."
      da: "Vandene deler sig, og Israel går over på tør grund; Faraos hær drukner i Det Røde Hav."
      sr: "Воде се раздвајају и Израиљ прелази по сувом; војска фараонова утапа се у Црвеном мору."
      hu: "A vizek kettéválnak, és Izráel szárazon kel át; a fáraó serege belefullad a Vörös-tengerbe."
      fi: "Vedet jakautuvat, ja Israel ylittää meren kuivaa maata myöten; faraon sotajoukko hukkuu Punaiseenmereen."
      vi: "Nước rẽ ra và Y-sơ-ra-ên đi qua trên đất khô; quân của Pha-ra-ôn bị chìm trong Biển Đỏ."
      ro: "Apele se despart, iar Israel trece pe uscat; oastea lui Faraon se îneacă în Marea Roșie."
      bg: "Водите се разделят и Израил преминава по сухо; войската на фараона се удавя в Червено море."
  - place: ad3970d # Marah
    ref: Exod.15.23-Exod.15.25
    note:
      en: "At Marah the water is bitter, and a tree thrown into it makes it sweet."
      ru: "В Мерре вода горька; брошенное в неё дерево делает её сладкой."
      uk: "У Меррі вода гірка, а дерево, кинуте в неї, робить її солодкою."
      es: "En Mara el agua es amarga, y un árbol echado en ella la vuelve dulce."
      pt: "Em Mara a água é amarga, e uma árvore lançada nela a torna doce."
      de: "In Mara ist das Wasser bitter, und ein Holz, das man hineinwirft, macht es süß."
      fr: "À Mara, l’eau est amère, et un bois jeté dedans la rend douce."
      pl: "W Marze woda jest gorzka, a drzewo wrzucone do niej czyni ją słodką."
      it: "A Mara l’acqua è amara, e un legno gettato in essa la rende dolce."
      nl: "Te Mara is het water bitter, en een stuk hout dat erin wordt geworpen maakt het zoet."
      cs: "V Máře je voda hořká a dřevo do ní vhozené ji činí sladkou."
      sv: "I Mara är vattnet bittert, och ett träd som kastas däri gör det sött."
      nb: "I Mara er vannet bittert, og et tre som blir kastet i det, gjør det søtt."
      tl: "Sa Mara, mapait ang tubig, at pinatatamis ito ng isang punong kahoy na inihagis doon."
      da: "I Mara er vandet bittert, og et træ, der kastes i det, gør det sødt."
      sr: "У Мери је вода горка, а дрво бачено у њу чини је слатком."
      hu: "Márában a víz keserű, és egy beledobott fa megédesíti."
      fi: "Marassa vesi on karvasta, ja siihen heitetty puu tekee sen makeaksi."
      vi: "Tại Ma-ra, nước đắng, và một khúc gỗ ném vào làm cho nước ngọt."
      ro: "La Mara apa este amară, iar un lemn aruncat în ea o face dulce."
      bg: "В Мера водата е горчива, а хвърленото в нея дърво я прави сладка."
  - place: a2410c1 # Elim
    ref: Exod.15.27
    note:
      en: "At Elim there are twelve springs of water and seventy palm trees."
      ru: "В Елиме — двенадцать источников воды и семьдесят финиковых дерев."
      uk: "В Елімі дванадцять джерел води й сімдесят пальм."
      es: "En Elim hay doce fuentes de agua y setenta palmeras."
      pt: "Em Elim há doze fontes de água e setenta palmeiras."
      de: "In Elim gibt es zwölf Wasserquellen und siebzig Palmbäume."
      fr: "À Élim, il y a douze sources d’eau et soixante-dix palmiers."
      pl: "W Elim jest dwanaście źródeł wody i siedemdziesiąt palm."
      it: "A Elim ci sono dodici sorgenti d’acqua e settanta palme."
      nl: "Te Elim zijn twaalf waterbronnen en zeventig palmbomen."
      cs: "V Élimu je dvanáct pramenů vody a sedmdesát palem."
      sv: "I Elim finns tolv vattenkällor och sjuttio palmer."
      nb: "I Elim er det tolv vannkilder og sytti palmer."
      tl: "Sa Elim ay may labingdalawang bukal ng tubig at pitumpung puno ng palma."
      da: "I Elim er der tolv vandkilder og halvfjerds palmer."
      sr: "У Елиму је дванаест извора водених и седамдесет палми."
      hu: "Élimben tizenkét vízforrás és hetven pálmafa van."
      fi: "Elimissä on kaksitoista vesilähdettä ja seitsemänkymmentä palmua."
      vi: "Tại Ê-lim có mười hai suối nước và bảy mươi cây chà là."
      ro: "La Elim sunt douăsprezece izvoare de apă și șaptezeci de finici."
      bg: "В Елим има дванадесет водни извора и седемдесет палми."
  - place: a05ebb7 # Rephidim
    ref: Exod.17.1-Exod.17.13
    note:
      en: "Water from the rock, and the battle with Amalek while Moses holds up his hands."
      ru: "Вода из скалы и битва с Амаликом, пока Моисей держит руки поднятыми."
      uk: "Вода зі скелі та бій з Амалеком, поки Мойсей тримає підняті руки."
      es: "Agua de la roca, y la batalla contra Amalec mientras Moisés mantiene en alto las manos."
      pt: "Água da rocha, e a batalha contra Amaleque enquanto Moisés mantém as mãos erguidas."
      de: "Wasser aus dem Felsen und der Kampf mit Amalek, während Mose seine Hände emporhält."
      fr: "L’eau jaillie du rocher, et le combat contre Amalek pendant que Moïse tient les mains levées."
      pl: "Woda ze skały i bitwa z Amalekiem, gdy Mojżesz trzyma wzniesione ręce."
      it: "L’acqua dalla roccia, e la battaglia contro Amalek mentre Mosè tiene alzate le mani."
      nl: "Water uit de rots, en de strijd met Amalek terwijl Mozes zijn handen omhoog houdt."
      cs: "Voda ze skály a bitva s Amalekem, zatímco Mojžíš drží zvednuté ruce."
      sv: "Vatten ur klippan, och striden mot Amalek medan Mose håller upp sina händer."
      nb: "Vann av klippen, og slaget med Amalek mens Moses holder sine hender oppe."
      tl: "Tubig mula sa bato, at ang labanan kay Amalec habang itinataas ni Moises ang kaniyang mga kamay."
      da: "Vand af klippen, og kampen mod Amalek, mens Moses holder sine hænder løftet."
      sr: "Вода из стене и бој с Амаликом, док Мојсије држи подигнуте руке."
      hu: "Víz a sziklából, és a csata Amálek ellen, amíg Mózes felemelve tartja a kezét."
      fi: "Vettä kalliosta, ja taistelu Amalekia vastaan, kun Mooses pitää käsiään ylhäällä."
      vi: "Nước từ hòn đá chảy ra, và trận đánh với A-ma-léc trong khi Môi-se giơ tay lên."
      ro: "Apă din stâncă și lupta cu Amalec, în timp ce Moise își ține mâinile ridicate."
      bg: "Вода от скалата и битката с Амалик, докато Мойсей държи ръцете си издигнати."
  - place: abfba2a # Mount Sinai
    ref: Exod.19.16-Exod.20.17
    note:
      en: "The Lord comes down on Mount Sinai and calls Moses to the top: the giving of the Law."
      ru: "Господь сходит на гору Синай и призывает Моисея на вершину: дарование Закона."
      uk: "Господь сходить на гору Синай і кличе Мойсея на вершину: дарування Закону."
      es: "El Señor desciende sobre el Monte Sinaí y llama a Moisés a la cumbre: la entrega de la Ley."
      pt: "O Senhor desce sobre o Monte Sinai e chama Moisés ao cume: a entrega da Lei."
      de: "Der Herr steigt auf den Berg Sinai herab und ruft Mose auf den Gipfel: die Gabe des Gesetzes."
      fr: "L’Éternel descend sur le Mont Sinaï et appelle Moïse au sommet : le don de la Loi."
      pl: "Pan zstępuje na górę Synaj i wzywa Mojżesza na jej szczyt: nadanie Prawa."
      it: "Il Signore scende sul Monte Sinai e chiama Mosè sulla cima: il dono della Legge."
      nl: "De HEER daalt neer op de berg Sinaï en roept Mozes naar de top: het geven van de wet."
      cs: "Hospodin sestupuje na horu Sinaj a volá Mojžíše na vrchol: dání Zákona."
      sv: "Herren stiger ner på Sinaiberget och kallar Mose till toppen: lagens givande."
      nb: "Herren stiger ned på Sinai og kaller Moses opp til toppen: lovgivningen."
      tl: "Bumababa ang Panginoon sa Bundok Sinai at tinatawag si Moises sa taluktok: ang pagbibigay ng Kautusan."
      da: "Herren stiger ned på Sinaj-bjerget og kalder Moses op på toppen: givelsen af loven."
      sr: "Господ силази на гору Синај и зове Мојсија на врх: давање Закона."
      hu: "Az Úr leszáll a Sínai-hegyre, és Mózest a csúcsra hívja: a törvényadás."
      fi: "Herra astuu alas Siinainvuorelle ja kutsuu Mooseksen huipulle: lain antaminen."
      vi: "Đức Giê-hô-va ngự xuống trên Núi Si-na-i và gọi Môi-se lên chót núi: việc ban Luật pháp."
      ro: "Domnul Se coboară pe Muntele Sinai și îl cheamă pe Moise pe vârf: darea Legii."
      bg: "Господ слиза на планината Синай и призовава Мойсей на върха: даването на Закона."
  - place: ae7836a # Kibroth-hattaavah
    ref: Num.11.31-Num.11.34
    year: "1445 BC"
    note:
      en: "The quails, and the graves of the people who craved meat: Kibroth-hattaavah."
      ru: "Перепела и гробы прихотливых: Киброт-Гаттаава."
      uk: "Перепілки та могили людей, що жадали м’яса: Кіброт-Гаттаава."
      es: "Las codornices, y las tumbas del pueblo que codició carne: Kibrot-hataava."
      pt: "As codornizes, e as sepulturas do povo que cobiçou carne: Quibrote-Hataavá."
      de: "Die Wachteln und die Gräber des Volkes, das nach Fleisch gelüstete: Kibrot-Taawa."
      fr: "Les cailles, et les tombeaux de ceux qui avaient convoité de la viande : Kibroth-Hattaava."
      pl: "Przepiórki i groby ludzi, którzy łakomili się mięsa: Kibrot-Hattaawa."
      it: "Le quaglie, e le tombe del popolo che aveva bramato la carne: Kibrot-Taava."
      nl: "De kwakkels, en de graven van het volk dat naar vlees verlangde: Kibrot-Hattaäva."
      cs: "Křepelky a hroby lidu, který dychtil po mase: Kibrót-hataava."
      sv: "Vaktlarna, och gravarna för folket som åtrådde kött: Kivrot-Hattaava."
      nb: "Vaktlene, og gravene til folket som hadde begjær etter kjøtt: Kibrot-Hattaava."
      tl: "Ang mga pugo, at ang mga libingan ng bayang naghangad ng karne: Kibroth-hattaavah."
      da: "Vagtlerne og gravene for det folk, der krævede kød: Kibrot-ha-Ta'ava."
      sr: "Препелице и гробови народа који су жудели за месом: Киврот-Атава."
      hu: "A fürjek, és a húst kívánó nép sírjai: Kibrót-Hattaava."
      fi: "Viiriäiset ja lihaa himoinneen kansan haudat: Kibrot-Hattaava."
      vi: "Chim cút, và những mồ mả của những người thèm thịt: Kíp-rốt Ha-ta-ava."
      ro: "Prepelițele și mormintele poporului care poftise carne: Chibrot-Hataava."
      bg: "Пъдпъдъците и гробовете на народа, който пожела месо: Киброт-Хатаава."
  - place: ac2cef0 # Kadesh-barnea
    ref: Num.13.26-Num.14.34
    year: "1445 BC"
    note:
      en: "The spies return to Kadesh; the people refuse to go up, and are sentenced to forty years in the wilderness."
      ru: "Соглядатаи возвращаются в Кадес; народ отказывается идти, и ему назначено сорок лет в пустыне."
      uk: "Розвідники повертаються до Кадешу; народ відмовляється йти вгору, і його засуджують на сорок років у пустелі."
      es: "Los espías regresan a Cades; el pueblo se niega a subir y es sentenciado a cuarenta años en el desierto."
      pt: "Os espias voltam a Cades; o povo se recusa a subir e é condenado a quarenta anos no deserto."
      de: "Die Kundschafter kehren nach Kadesch zurück; das Volk weigert sich hinaufzuziehen und wird zu vierzig Jahren in der Wüste verurteilt."
      fr: "Les espions reviennent à Qadesh ; le peuple refuse de monter et est condamné à quarante ans dans le désert."
      pl: "Zwiadowcy wracają do Kadesz; lud odmawia wyruszenia i zostaje skazany na czterdzieści lat na pustyni."
      it: "Gli esploratori tornano a Kades; il popolo rifiuta di salire ed è condannato a quarant’anni nel deserto."
      nl: "De verspieders keren terug te Kades; het volk weigert op te trekken en wordt veroordeeld tot veertig jaar in de woestijn."
      cs: "Zvědové se vracejí do Kádeše; lid odmítá vytáhnout a je odsouzen ke čtyřiceti letům na poušti."
      sv: "Spejarna återvänder till Kadesh; folket vägrar att dra upp och döms till fyrtio år i öknen."
      nb: "Spionene vender tilbake til Kadesj; folket nekter å dra opp og blir dømt til førti år i ørkenen."
      tl: "Bumabalik ang mga tiktik sa Cades; ayaw sumampa ng bayan, at hinahatulan ng apatnapung taon sa ilang."
      da: "Spejderne vender tilbage til Kadesj; folket nægter at drage op og dømmes til fyrre år i ørkenen."
      sr: "Уходе се враћају у Кадис; народ неће да иде горе и бива осуђен на четрдесет година у пустињи."
      hu: "A kémek visszatérnek Kádesbe; a nép nem akar felvonulni, és negyven évi pusztai bolyongásra ítélik."
      fi: "Vakoojat palaavat Kadekseen; kansa kieltäytyy nousemasta, ja sille langetetaan neljäkymmentä vuotta erämaassa."
      vi: "Các người do thám trở về Ca-đe; dân sự không chịu đi lên, và bị kết án bốn mươi năm trong đồng vắng."
      ro: "Iscoadele se întorc la Cades; poporul refuză să urce și este osândit la patruzeci de ani în pustiu."
      bg: "Съгледвачите се връщат в Кадеш; народът отказва да възлезе и е осъден на четиридесет години в пустинята."
  - place: ad8027f # Mount Hor
    ref: Num.20.22-Num.20.29
    year: "1407 BC"
    note:
      en: "Aaron dies on the top of Mount Hor; his garments are put upon Eleazar his son."
      ru: "Аарон умирает на вершине горы Ор; его одежды переходят к Елеазару, сыну его."
      uk: "Аарон помирає на вершині гори Гор; його одежу надягають на його сина Елеазара."
      es: "Aarón muere en la cumbre del Monte Hor; sus vestiduras se ponen a Eleazar, su hijo."
      pt: "Arão morre no cume do Monte Hor; as suas vestes são postas sobre Eleazar, seu filho."
      de: "Aaron stirbt auf dem Gipfel des Berges Hor; seine Kleider werden seinem Sohn Eleasar angelegt."
      fr: "Aaron meurt au sommet du Mont Hor ; ses vêtements sont mis sur Éléazar, son fils."
      pl: "Aaron umiera na szczycie góry Hor; jego szaty zostają włożone na Eleazara, jego syna."
      it: "Aronne muore sulla cima del Monte Or; le sue vesti sono messe addosso a Eleazaro, suo figlio."
      nl: "Aäron sterft op de top van de berg Hor; zijn gewaden worden zijn zoon Eleazar aangedaan."
      cs: "Áron umírá na vrcholu hory Hor; jeho roucho se oblékne Eleazarovi, jeho synu."
      sv: "Aron dör på toppen av berget Hor; hans kläder läggs på hans son Eleasar."
      nb: "Aron dør på toppen av Hor-fjellet; hans klær blir lagt på Eleasar, hans sønn."
      tl: "Namamatay si Aaron sa taluktok ng Bundok Hor; isinusuot kay Eleazar na kaniyang anak ang kaniyang mga damit."
      da: "Aron dør på toppen af Hor-bjerget; hans klæder lægges på hans søn Eleazar."
      sr: "Арон умире на врху горе Ор; његова одећа облачи се на Елеазара, сина његовог."
      hu: "Áron meghal a Hór-hegy tetején; ruháit fiára, Eleázárra adják."
      fi: "Aaron kuolee Horinvuoren huipulla; hänen vaatteensa puetaan hänen pojalleen Eleasarille."
      vi: "A-rôn qua đời trên chót Núi Hô-rơ; các áo thánh của người được mặc cho Ê-lê-a-sa, con trai người."
      ro: "Aaron moare pe vârful Muntelui Hor; veșmintele lui sunt puse pe Eleazar, fiul său."
      bg: "Аарон умира на върха на планината Хор; дрехите му са облечени на сина му Елеазар."
  - place: abf2fc1 # Heshbon
    ref: Num.21.21-Num.21.26
    year: "1407 BC"
    note:
      en: "Sihon king of the Amorites is defeated, and Israel takes Heshbon."
      ru: "Сигон, царь Аморрейский, разбит, и Израиль берёт Есевон."
      uk: "Сігона, царя амореїв, розбито, і Ізраїль бере Гесбон."
      es: "Sehón, rey de los amorreos, es derrotado, e Israel toma Hesbón."
      pt: "Seom, rei dos amorreus, é derrotado, e Israel toma Hesbom."
      de: "Sihon, der König der Amoriter, wird besiegt, und Israel nimmt Heschbon ein."
      fr: "Sihon, roi des Amoréens, est vaincu, et Israël prend Hesbon."
      pl: "Sychon, król Amorytów, zostaje pokonany, a Izrael zajmuje Cheszbon."
      it: "Sicon, re degli Amorei, è sconfitto, e Israele prende Chesbon."
      nl: "Sihon, de koning van de Amorieten, wordt verslagen, en Israël neemt Chesbon in."
      cs: "Sichon, král Amorejských, je poražen a Izrael dobývá Chešbón."
      sv: "Sichon, amoréernas kung, besegras, och Israel intar Heshbon."
      nb: "Sihon, amorittenes konge, blir slått, og Israel inntar Hesjbon."
      tl: "Natatalo si Sehon na hari ng mga Amorrheo, at sinasakop ng Israel ang Hesbon."
      da: "Sihon, amoritternes konge, bliver slået, og Israel indtager Hesjbon."
      sr: "Сион, цар аморејски, бива побеђен, и Израиљ осваја Есевон."
      hu: "Szihon, az emóriak királya vereséget szenved, és Izráel elfoglalja Hesbont."
      fi: "Amorilaisten kuningas Sihon voitetaan, ja Israel valtaa Hesbonin."
      vi: "Si-hôn, vua dân A-mô-rít, bị đánh bại, và Y-sơ-ra-ên chiếm Hết-bôn."
      ro: "Sihon, regele amoriților, este înfrânt, iar Israel ia Hesbonul."
      bg: "Сихон, царят на аморейците, е разбит и Израил превзема Есевон."
  - place: aefaa2d # Mount Nebo
    ref: Deut.34.1-Deut.34.5
    year: "1406 BC"
    note:
      en: "From Mount Nebo the Lord shows Moses the whole land; Moses dies there, in the land of Moab."
      ru: "С горы Нево Господь показывает Моисею всю землю; там Моисей умирает, в земле Моавитской."
      uk: "З гори Нево Господь показує Мойсею всю землю; Мойсей помирає там, у землі Моав."
      es: "Desde el Monte Nebo el Señor muestra a Moisés toda la tierra; Moisés muere allí, en la tierra de Moab."
      pt: "Do Monte Nebo o Senhor mostra a Moisés toda a terra; Moisés morre ali, na terra de Moabe."
      de: "Vom Berg Nebo zeigt der Herr Mose das ganze Land; Mose stirbt dort, im Land Moab."
      fr: "Du Mont Nebo, l’Éternel fait voir à Moïse tout le pays ; Moïse y meurt, dans le pays de Moab."
      pl: "Z góry Nebo Pan ukazuje Mojżeszowi cały kraj; Mojżesz umiera tam, w ziemi Moabu."
      it: "Dal Monte Nebo il Signore mostra a Mosè tutto il paese; Mosè muore là, nel paese di Moab."
      nl: "Vanaf de berg Nebo toont de HEER Mozes het hele land; Mozes sterft daar, in het land Moab."
      cs: "Z hory Nebo ukazuje Hospodin Mojžíšovi celou zemi; Mojžíš tam umírá v moábské zemi."
      sv: "Från berget Nebo visar Herren Mose hela landet; Mose dör där, i Moabs land."
      nb: "Fra Nebo viser Herren Moses hele landet; Moses dør der, i Moabs land."
      tl: "Mula sa Bundok Nebo, ipinakikita ng Panginoon kay Moises ang buong lupain; doon namamatay si Moises, sa lupain ng Moab."
      da: "Fra Nebo-bjerget lader Herren Moses se hele landet; Moses dør der, i Moabs land."
      sr: "С горе Нево Господ показује Мојсију сву земљу; Мојсије ту умире, у земљи моавској."
      hu: "A Nébó-hegyről az Úr megmutatja Mózesnek az egész földet; Mózes ott hal meg, Moáb földjén."
      fi: "Nebovuorelta Herra näyttää Moosekselle koko maan; Mooses kuolee siellä, Moabin maassa."
      vi: "Từ Núi Nê-bô, Đức Giê-hô-va cho Môi-se thấy cả xứ; Môi-se qua đời tại đó, trong xứ Mô-áp."
      ro: "De pe Muntele Nebo, Domnul îi arată lui Moise toată țara; Moise moare acolo, în țara Moabului."
      bg: "От планината Нево Господ показва на Мойсей цялата земя; Мойсей умира там, в земята Моав."
  - place: af64fb3 # Shittim
    ref: Josh.3.1
    year: "1406 BC"
    note:
      en: "Joshua and the people leave Shittim and come to the Jordan."
      ru: "Иисус Навин и народ выходят из Ситтима и подходят к Иордану."
      uk: "Ісус Навин і народ залишають Ситтім і приходять до Йордану."
      es: "Josué y el pueblo salen de Sitim y llegan al Jordán."
      pt: "Josué e o povo deixam Sitim e chegam ao Jordão."
      de: "Josua und das Volk brechen von Schittim auf und kommen an den Jordan."
      fr: "Josué et le peuple quittent Sittim et arrivent au Jourdain."
      pl: "Jozue i lud opuszczają Szittim i dochodzą do Jordanu."
      it: "Giosuè e il popolo lasciano Sittim e giungono al Giordano."
      nl: "Jozua en het volk vertrekken uit Sittim en komen aan de Jordaan."
      cs: "Jozue a lid odcházejí ze Šitimu a přicházejí k Jordánu."
      sv: "Josua och folket bryter upp från Shittim och kommer till Jordan."
      nb: "Josva og folket bryter opp fra Sjittim og kommer til Jordan."
      tl: "Umaalis si Josue at ang bayan sa Sittim at dumarating sa Jordan."
      da: "Josva og folket forlader Sjittim og kommer til Jordan."
      sr: "Исус и народ одлазе из Ситима и долазе на Јордан."
      hu: "Józsué és a nép elhagyják Sittimet, és a Jordánhoz érnek."
      fi: "Joosua ja kansa lähtevät Sittimistä ja tulevat Jordanille."
      vi: "Giô-suê và dân sự rời Si-tim và đến sông Giô-đanh."
      ro: "Iosua și poporul pleacă din Sitim și ajung la Iordan."
      bg: "Иисус Навин и народът напускат Ситим и идват при Йордан."
  - place: ab94aea # Gilgal
    ref: Josh.4.19
    year: "1406 BC"
    note:
      en: "Across the Jordan, the first camp in the land is at Gilgal, east of Jericho."
      ru: "Перейдя Иордан, народ ставит первый стан в земле — в Галгале, к востоку от Иерихона."
      uk: "За Йорданом перший стан у цій землі — у Гілгалі, на схід від Єрихону."
      es: "Al otro lado del Jordán, el primer campamento en la tierra está en Gilgal, al este de Jericó."
      pt: "Do outro lado do Jordão, o primeiro acampamento na terra é em Gilgal, a leste de Jericó."
      de: "Jenseits des Jordan liegt das erste Lager im Land bei Gilgal, östlich von Jericho."
      fr: "De l’autre côté du Jourdain, le premier campement dans le pays est à Guilgal, à l’orient de Jéricho."
      pl: "Za Jordanem pierwszy obóz w kraju znajduje się w Gilgal, na wschód od Jerycha."
      it: "Al di là del Giordano, il primo accampamento nel paese è a Gàlgala, a oriente di Gerico."
      nl: "Aan de overkant van de Jordaan ligt het eerste kamp in het land te Gilgal, ten oosten van Jericho."
      cs: "Za Jordánem je první tábor v zemi v Gilgalu, východně od Jericha."
      sv: "På andra sidan Jordan ligger det första lägret i landet, i Gilgal, öster om Jeriko."
      nb: "Over Jordan er den første leiren i landet ved Gilgal, øst for Jeriko."
      tl: "Sa kabila ng Jordan, ang unang kampamento sa lupain ay sa Gilgal, sa silangan ng Jerico."
      da: "På den anden side af Jordan ligger den første lejr i landet i Gilgal, øst for Jeriko."
      sr: "Преко Јордана први логор у земљи је у Галгалу, источно од Јерихона."
      hu: "A Jordánon túl az első tábor az országban Gilgálnál van, Jerikótól keletre."
      fi: "Jordanin toisella puolella ensimmäinen leiri maassa on Gilgalissa, Jerikosta itään."
      vi: "Bên kia sông Giô-đanh, chỗ hạ trại đầu tiên trong xứ là Ghinh-ganh, phía đông Giê-ri-cô."
      ro: "Dincolo de Iordan, prima tabără în țară este la Ghilgal, la răsărit de Ierihon."
      bg: "Отвъд Йордан първият стан в земята е в Галгал, на изток от Йерихон."
  - place: a231f80 # Jericho
    ref: Josh.6.1-Josh.6.20
    year: "1406 BC"
    note:
      en: "Seven days around Jericho, and its wall falls down."
      ru: "Семь дней вокруг Иерихона — и стена его обрушивается."
      uk: "Сім днів навколо Єрихону, і його мур падає."
      es: "Siete días alrededor de Jericó, y su muro se derrumba."
      pt: "Sete dias ao redor de Jericó, e o seu muro cai."
      de: "Sieben Tage um Jericho, und seine Mauer fällt um."
      fr: "Sept jours autour de Jéricho, et sa muraille s’écroule."
      pl: "Siedem dni wokół Jerycha i jego mur się wali."
      it: "Sette giorni attorno a Gerico, e le sue mura crollano."
      nl: "Zeven dagen rond Jericho, en de muur valt neer."
      cs: "Sedm dní kolem Jericha a jeho hradba padá."
      sv: "Sju dagar runt Jeriko, och dess mur faller ner."
      nb: "Sju dager omkring Jeriko, og dens mur faller."
      tl: "Pitong araw sa palibot ng Jerico, at bumabagsak ang pader nito."
      da: "Syv dage rundt om Jeriko, og dens mur falder."
      sr: "Седам дана око Јерихона, и зид његов пада."
      hu: "Hét napig járják körül Jerikót, és a fala leomlik."
      fi: "Seitsemän päivää Jerikon ympäri, ja sen muuri sortuu."
      vi: "Bảy ngày vòng quanh Giê-ri-cô, và vách thành đổ xuống."
      ro: "Șapte zile în jurul Ierihonului, iar zidul lui se prăbușește."
      bg: "Седем дни около Йерихон — и стената му пада."
