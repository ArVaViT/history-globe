# Absalom's revolt, 2 Samuel 15-19, in the order of the text. 15:7 dates it "after forty
# years" (so the KJV and the Synodal text), which other ancient witnesses read as four; the
# tour's year (980 BC) is a conventional point late in David's reign (c. 1010-970 BC), for
# the map only. The David tour holds Mahanaim's welcome (17:24-29); this one stops there
# for the news of Absalom's death.
id: absalom
title:
  en: "Absalom's revolt"
  ru: "Восстание Авессалома"
  uk: "Повстання Авесалома"
  es: "La rebelión de Absalón"
  pt: "A revolta de Absalão"
  de: "Absaloms Aufstand"
  fr: "La révolte d’Absalom"
  pl: "Bunt Absaloma"
  it: "La rivolta di Assalonne"
  nl: "De opstand van Absalom"
  cs: "Abšalomovo povstání"
  sv: "Absaloms uppror"
  nb: "Absaloms opprør"
  tl: "Ang paghihimagsik ni Absalom"
  da: "Absalons oprør"
  sr: "Авесаломова буна"
  hu: "Absolon lázadása"
  fi: "Absalomin kapina"
  vi: "Cuộc nổi loạn của Áp-sa-lôm"
  ro: "Răscoala lui Absalom"
  bg: "Бунтът на Авесалом"
year: "980 BC"
people: ["Absalom@2Sa.3.3-Psa"]
approximate: true
stops:
  - place: a85151a # Hebron
    ref: 2Sam.15.7-2Sam.15.12
    note:
      en: 'Absalom goes to Hebron as if to pay a vow, and sends spies through the tribes: at the sound of the trumpet they are to say, "Absalom reigneth in Hebron."'
      ru: "Авессалом уходит в Хеврон будто бы исполнить обет и рассылает по коленам лазутчиков: по звуку трубы говорить «Авессалом воцарился в Хевроне»."
      uk: "Авесалом іде до Хеврона нібито виконати обітницю й розсилає по колінах шпигунів: за сурмою вони мають говорити: «Абессалом зробився царем у Гебронї!»"
      es: "Absalón va a Hebrón como para cumplir un voto y envía espías por las tribus: al sonido de la trompeta deben decir: «Absalom reina en Hebrón»."
      pt: "Absalão vai a Hebrom como para cumprir um voto e envia espiões por entre as tribos: ao som da trombeta, devem dizer: “Absalão é rei em Hebrom!”"
      de: "Absalom geht nach Hebron, angeblich um ein Gelübde zu erfüllen, und sendet Kundschafter durch die Stämme: Beim Schall der Posaune sollen sie sagen: „Absalom ist König geworden zu Hebron.“"
      fr: "Absalom se rend à Hébron sous prétexte d’accomplir un vœu et envoie des espions dans les tribus : au son de la trompette, ils devront dire : « Absalom règne à Hébron. »"
      pl: "Absalom udaje się do Hebronu, jakoby dla spełnienia ślubu, i rozsyła po plemionach szpiegów: na dźwięk trąby mają mówić: „Króluje Absalom w Hebronie.”"
      it: "Assalonne va a Ebron con il pretesto di sciogliere un voto e manda emissari per le tribù: al suono della tromba dovranno dire: «Absalom è proclamato re a Hebron»."
      nl: "Absalom gaat naar Hebron alsof hij een gelofte wil inlossen, en stuurt verspieders door de stammen: bij het geluid van de bazuin moeten zij zeggen: “Absalom is koning te Hebron.”"
      cs: "Abšalom jde do Hebronu, jako by chtěl splnit slib, a rozesílá špehy do kmenů: při zvuku trouby mají říci: „Kralujeť Absolon v Hebronu.“"
      sv: "Absalom beger sig till Hebron som för att infria ett löfte och sänder spejare genom stammarna: när basunen ljuder ska de säga: ”Nu har Absalom blivit konung i Hebron.”"
      nb: "Absalom drar til Hebron, tilsynelatende for å innfri et løfte, og sender speidere omkring i stammene: når basunen lyder, skal de si: «Absalom er blitt konge i Hebron.»"
      tl: "Pumupunta si Absalom sa Hebron na waring tutupad ng panata, at nagsusugo ng mga tiktik sa mga lipi: pagkarinig ng tunog ng pakakak ay sasabihin nila, “Si Absalom ay hari sa Hebron.”"
      da: "Absalon tager til Hebron, som for at indfri et løfte, og sender spejdere ud til stammerne: Ved trompetens lyd skal de sige: »Absalom er bleven Konge i Hebron.«"
      sr: "Авесалом одлази у Хеврон као да хоће да изврши завет и разашиље уходе по племенима: на глас труба треба да кажу: „Зацари се Авесалом у Хеврону.“"
      hu: "Absolon Hebronba megy, mintha fogadalmát akarná teljesíteni, és hírnököket küld a törzsekhez: a trombitaszó hallatára ezt kell mondaniuk: „Absolon uralkodik Hebronban.”"
      fi: "Absalom lähtee Hebroniin muka täyttämään lupauksen ja lähettää vakoojia sukukuntien keskuuteen: pasunan äänen kuullessaan heidän on sanottava: ”Absalom on tullut kuninkaaksi Hebronissa”."
      vi: "Áp-sa-lôm đến Hếp-rôn như để trả một lời khấn nguyện, và sai thám tử đi khắp các chi phái: khi nghe tiếng kèn, họ phải nói: “Áp-sa-lôm làm vua tại Hếp-rôn!”"
      ro: "Absalom merge la Hebron, chipurile ca să-și împlinească o juruință, și trimite iscoade prin seminții: la sunetul trâmbiței ei trebuie să spună: „făcutu-s’a împărat Avesalom în Hevron”."
      bg: "Авесалом отива в Хеврон уж за да изпълни обрек и разпраща съгледатели по племената: щом чуят гласа на тръбата, да кажат: „Авесалом се възцари в Хеврон.“"
  - place: a553110 # Kidron
    ref: 2Sam.15.13-2Sam.15.23
    note:
      en: "David flees Jerusalem, and the king and all the people pass over the brook Kidron toward the wilderness, all the country weeping."
      ru: "Давид уходит из Иерусалима, и царь и весь народ переходят поток Кедрон по дороге к пустыне, и плачет вся земля."
      uk: "Давид тікає з Єрусалима, і цар та весь народ переходять потік Кедрон дорогою до пустелі, а вся земля плаче."
      es: "David huye de Jerusalén, y el rey y todo el pueblo cruzan el torrente Cedrón camino del desierto, mientras todo el país llora."
      pt: "Davi foge de Jerusalém, e o rei e todo o povo atravessam o ribeiro de Cedrom em direção ao deserto, enquanto todo o país chora."
      de: "David flieht aus Jerusalem, und der König und das ganze Volk ziehen über den Bach Kidron zur Wüste hin, und das ganze Land weint."
      fr: "David fuit Jérusalem, et le roi et tout le peuple passent le torrent du Cédron en direction du désert, tout le pays pleurant."
      pl: "Dawid ucieka z Jerozolimy, a król i cały lud przechodzą potok Cedron w stronę pustyni, i cały kraj płacze."
      it: "Davide fugge da Gerusalemme; il re e tutto il popolo attraversano il torrente Cedron verso il deserto, mentre tutto il paese piange."
      nl: "David vlucht uit Jeruzalem, en de koning en heel het volk trekken over de beek Kidron richting de woestijn, terwijl het hele land weent."
      cs: "David prchá z Jeruzaléma a král se vším lidem přechází potok Kidron k poušti, zatímco celá země pláče."
      sv: "David flyr från Jerusalem, och kungen och allt folket går över bäcken Kidron mot öknen, medan hela landet gråter."
      nb: "David flykter fra Jerusalem, og kongen og alt folket går over bekken Kedron mot ørkenen, mens hele landet gråter."
      tl: "Tumatakas si David mula sa Jerusalem, at ang hari at ang buong bayan ay tumatawid sa batis ng Cedron patungo sa ilang, na ang buong lupain ay tumatangis."
      da: "David flygter fra Jerusalem, og kongen og hele folket går over Kedron-bækken mod ørkenen, mens hele landet græder."
      sr: "Давид бежи из Јерусалима, и цар и сав народ прелазе поток Кедрон према пустињи, а сва земља плаче."
      hu: "Dávid elmenekül Jeruzsálemből, a király és az egész nép átkelnek a Kidron patakon a puszta felé, az egész vidék pedig sír."
      fi: "Daavid pakenee Jerusalemista, ja kuningas ja koko kansa ylittävät Kidronin puron erämaata kohti, koko maa itkien."
      vi: "Đa-vít chạy khỏi Giê-ru-sa-lem; vua và cả dân đi qua khe Xết-rôn hướng về đồng vắng, cả xứ đều khóc lóc."
      ro: "David fuge din Ierusalim; regele și tot poporul trec pârâul Chedron spre pustiu, iar toată țara plânge."
      bg: "Давид бяга от Йерусалим; царят и целият народ минават потока Кедрон към пустинята, а цялата земя плаче."
  - place: ac2c4c5 # Mount of Olives
    ref: 2Sam.15.30-2Sam.15.37
    note:
      en: "He goes up the Mount of Olives weeping, barefoot and with his head covered, and sends Hushai back to Jerusalem."
      ru: "Он восходит на гору Елеонскую, плача, босой, с покрытой головой, и отправляет Хусия назад в Иерусалим."
      uk: "Він сходить на Оливкову гору, плачучи, босий і з покритою головою, і відсилає Хусія назад до Єрусалима."
      es: "Sube llorando el Monte de los Olivos, descalzo y con la cabeza cubierta, y envía de vuelta a Jerusalén a Husai."
      pt: "Sobe o Monte das Oliveiras chorando, descalço e com a cabeça coberta, e manda Husai de volta a Jerusalém."
      de: "Weinend, barfuß und mit verhülltem Haupt steigt er den Ölberg hinauf und sendet Huschai nach Jerusalem zurück."
      fr: "Il gravit le Mont des Oliviers en pleurant, nu-pieds et la tête couverte, et renvoie Huschaï à Jérusalem."
      pl: "Wstępuje na Górę Oliwną, płacząc, boso i z zakrytą głową, i odsyła Chuszaja z powrotem do Jerozolimy."
      it: "Sale piangendo il Monte degli Ulivi, a piedi scalzi e con il capo coperto, e rimanda Cusai a Gerusalemme."
      nl: "Hij gaat huilend de Olijfberg op, blootsvoets en met bedekt hoofd, en stuurt Chusai terug naar Jeruzalem."
      cs: "Vystupuje na Olivovou horu, pláče, jde bos a s přikrytou hlavou, a posílá Chušaje zpět do Jeruzaléma."
      sv: "Han går gråtande upp för Olivberget, barfota och med höljt huvud, och sänder Hushaj tillbaka till Jerusalem."
      nb: "Han går opp på Oljeberget under gråt, barfotet og med tildekket hode, og sender Husjai tilbake til Jerusalem."
      tl: "Umaahon siya sa Bundok ng mga Olibo na umiiyak, walang suot ang paa at may takip ang ulo, at ibinabalik si Husai sa Jerusalem."
      da: "Han går grædende op ad Oliebjerget, barfodet og med tildækket hoved, og sender Husjaj tilbage til Jerusalem."
      sr: "Пење се на Маслинску гору плачући, босих ногу и покривене главе, и шаље Хусаја назад у Јерусалим."
      hu: "Sírva megy fel az Olajfák hegyére, mezítláb és betakart fővel, és visszaküldi Húsait Jeruzsálembe."
      fi: "Hän nousee Öljymäelle itkien, avojaloin ja pää peitettynä, ja lähettää Husain takaisin Jerusalemiin."
      vi: "Người lên Núi Ô-li-ve vừa đi vừa khóc, chân không giày và đầu trùm kín, và sai Hu-sai trở về Giê-ru-sa-lem."
      ro: "Urcă pe Muntele Măslinilor plângând, desculț și cu capul acoperit, și îl trimite pe Hușai înapoi la Ierusalim."
      bg: "Той се изкачва на Елеонския хълм, плачейки, бос и с покрита глава, и изпраща Хусий обратно в Йерусалим."
  - place: a9ed5a4 # Bahurim
    ref: 2Sam.16.5-2Sam.16.14
    note:
      en: 'At Bahurim Shimei of the house of Saul curses him and throws stones; David will not have him killed: "let him curse."'
      ru: "В Бахуриме Семей из дома Саулова злословит его и бросает камнями; Давид не даёт убить его: «пусть он злословит»."
      uk: "У Бахурімі Шимей з дому Саула проклинає його й кидає в нього каміння; Давид не дозволяє його вбити: «Нехай він проклинає»."
      es: "En Bahurim, Simei, de la casa de Saúl, lo maldice y le arroja piedras; David no consiente que lo maten: «Dejadle que maldiga»."
      pt: "Em Baurim, Simei, da família de Saul, o amaldiçoa e atira pedras; Davi não permite que o matem: “deixem-no amaldiçoar”."
      de: "In Bahurim verflucht ihn Schimi aus dem Haus Sauls und wirft mit Steinen; David lässt ihn nicht töten: „Laßt ihn fluchen.“"
      fr: "À Bachurim, Schimeï, de la maison de Saül, le maudit et lui jette des pierres ; David refuse qu’on le tue : « Laissez-le, et qu’il maudisse. »"
      pl: "W Bachurim Szimei z rodu Saula złorzeczy mu i rzuca kamieniami; Dawid nie pozwala go zabić: „niech złorzeczy.”"
      it: "A Bacurim Simei, della famiglia di Saul, lo maledice e gli getta sassi; Davide non vuole che sia ucciso: «Lasciate ch’ei maledica»."
      nl: "Te Bachurim vervloekt Simeï, uit het huis van Saul, hem en gooit met stenen; David wil hem niet laten doden: “laat hem vloeken.”"
      cs: "V Bachurímu mu Šimei z domu Saulova zlořečí a hází po něm kamení; David nedovolí, aby byl zabit: „Nechte ho, ať zlořečí.“"
      sv: "I Bahurim förbannar Shimi av Sauls hus honom och kastar stenar; David vill inte låta döda honom: ”Låten honom vara, må han förbanna.”"
      nb: "I Bahurim banner Sjimi av Sauls hus ham og kaster sten; David vil ikke la ham drepe: «La ham bare banne!»"
      tl: "Sa Bahurim, isinusumpa siya ni Simi na sambahayan ni Saul at binabato siya; hindi pumapayag si David na patayin ito: “bayaan ninyo siya at manumpa siya.”"
      da: "I Bahurim forbander Sjimi af Sauls hus ham og kaster med sten; David vil ikke lade ham dræbe: »lader ham bande«."
      sr: "У Вауриму га Симеј из Сауловог дома куне и баца камење; Давид не да да га убију: „Нека псује.“"
      hu: "Bahurimnál a Saul nemzetségéből való Sémei szidalmazza és kövekkel hajigálja; Dávid nem engedi megölni: „hadd szidalmazzon”."
      fi: "Bahurimissa Saulin suvun mies Simei kiroaa hänet ja heittelee kivillä; Daavid ei salli häntä surmattavan: ”Antakaa hänen olla, kiroilkoon vain”."
      vi: "Tại Ba-hu-rim, Si-mê-i thuộc dòng nhà Sau-lơ rủa sả người và ném đá; Đa-vít không cho giết hắn: “Hãy để Si-mê-i rủa sả.”"
      ro: "La Bahurim, Șimei, din casa lui Saul, îl blestemă și aruncă cu pietre; David nu îngăduie să fie ucis: „Lăsați-l pre el să blesteme”."
      bg: "В Бахурим Шимей от Сауловия дом го проклина и хвърля камъни; Давид не позволява да го убият: „нека кълне“."
  - place: a15257a # Jerusalem
    ref: 2Sam.16.15-2Sam.16.23
    note:
      en: "Absalom enters Jerusalem and, on Ahithophel's counsel, goes in to his father's concubines before all Israel."
      ru: "Авессалом вступает в Иерусалим и по совету Ахитофела входит к наложницам отца пред глазами всего Израиля."
      uk: "Авесалом входить до Єрусалима і за порадою Ахітофела входить до наложниць свого батька на очах усього Ізраїлю."
      es: "Absalón entra en Jerusalén y, por consejo de Ahitofel, se une a las concubinas de su padre a la vista de todo Israel."
      pt: "Absalão entra em Jerusalém e, por conselho de Aitofel, une-se às concubinas do pai à vista de todo o Israel."
      de: "Absalom zieht in Jerusalem ein und geht auf den Rat Ahitofels vor ganz Israel zu den Nebenfrauen seines Vaters."
      fr: "Absalom entre dans Jérusalem et, sur le conseil d’Achitophel, s’unit aux concubines de son père aux yeux de tout Israël."
      pl: "Absalom wkracza do Jerozolimy i za radą Achitofela wchodzi do nałożnic swego ojca na oczach całego Izraela."
      it: "Assalonne entra in Gerusalemme e, per consiglio di Achitofel, si unisce alle concubine del padre davanti a tutto Israele."
      nl: "Absalom trekt Jeruzalem binnen en gaat, op raad van Achitofel, voor het oog van heel Israël bij de bijvrouwen van zijn vader in."
      cs: "Abšalom vstupuje do Jeruzaléma a podle rady Achitofelovy vchází před očima celého Izraele ke konkubínám svého otce."
      sv: "Absalom tågar in i Jerusalem och går, på Achitofels inrådan, in till sin fars bihustrur inför hela Israel."
      nb: "Absalom drar inn i Jerusalem og går, etter Ahitofels råd, inn til sin fars medhustruer for øynene av hele Israel."
      tl: "Pumapasok si Absalom sa Jerusalem at, ayon sa payo ni Achitophel, sumisiping sa mga babaing kinakasama ng kaniyang ama sa harap ng buong Israel."
      da: "Absalon drager ind i Jerusalem og går, på Akitofels råd, ind til sin fars medhustruer for øjnene af hele Israel."
      sr: "Авесалом улази у Јерусалим и по Ахитофеловом савету улази пред свим Израиљем к наложницама свог оца."
      hu: "Absolon bevonul Jeruzsálembe, és Ahitófel tanácsára egész Izráel szeme láttára bemegy apja ágyasaihoz."
      fi: "Absalom tulee Jerusalemiin ja menee Ahitofelin neuvosta isänsä sivuvaimojen luo koko Israelin nähden."
      vi: "Áp-sa-lôm vào Giê-ru-sa-lem và, theo mưu của A-hi-tô-phe, đến cùng các cung phi của cha mình trước mặt cả Y-sơ-ra-ên."
      ro: "Absalom intră în Ierusalim și, la sfatul lui Ahitofel, intră la țiitoarele tatălui său în fața întregului Israel."
      bg: "Авесалом влиза в Йерусалим и по съвета на Ахитофел влиза при наложниците на баща си пред очите на целия Израил."
  - place: aa24ad4 # Wood of Ephraim
    ref: 2Sam.18.6-2Sam.18.17
    note:
      en: "In the wood of Ephraim Absalom's army is beaten; his head caught in an oak, he hangs there, and Joab thrusts three darts into his heart while he is yet alive; Joab's young men slay him."
      ru: "В лесу Ефремовом войско Авессалома разбито; запутавшись волосами в ветвях дуба, он висит, ещё живой, когда Иоав вонзает три стрелы в его сердце, и оруженосцы Иоава добивают его."
      uk: "У лісі Єфремовому військо Авесалома розбито; його голова застрягає в дубі, і він повисає, а Йоав устромляє три стріли в його серце, поки той ще живий; зброєносці Йоава добивають його."
      es: "En el bosque de Efraín el ejército de Absalón es derrotado; su cabeza queda prendida en una encina y allí cuelga, y Joab le clava tres dardos en el corazón cuando aún está vivo; los jóvenes de Joab lo matan."
      pt: "No bosque de Efraim o exército de Absalão é derrotado; com a cabeça presa num carvalho, ele fica pendurado ali, e Joabe crava-lhe três dardos no coração quando ainda está vivo; os jovens de Joabe o matam."
      de: "Im Wald Ephraim wird Absaloms Heer geschlagen; sein Haupt verfängt sich in einer Eiche, er bleibt hängen, und Joab stößt ihm drei Spieße ins Herz, während er noch lebt; Joabs Waffenträger erschlagen ihn."
      fr: "Dans la forêt d’Éphraïm, l’armée d’Absalom est battue ; sa tête prise dans un chêne, il reste suspendu, et Joab lui enfonce trois javelots dans le cœur alors qu’il est encore vivant ; les jeunes gens de Joab l’achèvent."
      pl: "W lesie Efraim wojsko Absaloma zostaje rozbite; jego głowa uwięzła w dębie i tak zawisa, a Joab wbija mu trzy oszczepy w serce, gdy jeszcze żyje; słudzy Joaba zabijają go."
      it: "Nella foresta di Efraim l’esercito di Assalonne è sconfitto; la sua testa resta impigliata in una quercia ed egli rimane appeso, e Ioab gli configge tre dardi nel cuore mentre è ancora vivo; i giovani di Ioab lo finiscono."
      nl: "In het woud van Efraïm wordt het leger van Absalom verslagen; met zijn hoofd in een eik blijft hij hangen, en Joab steekt drie pijlen in zijn hart terwijl hij nog leeft; Joabs jonge mannen slaan hem dood."
      cs: "V Efrajimském lese je Abšalomovo vojsko poraženo; on se zachytí hlavou v dubu a visí tam, Joáb mu vrazí tři oštěpy do srdce, dokud je ještě živ, a Joábovi služebníci ho dorazí."
      sv: "I Efraims skog blir Absaloms här slagen; han fastnar med huvudet i en ek och hänger där, och Joav stöter tre spjut i hans hjärta medan han ännu lever; Joavs unga män dräper honom."
      nb: "I Efraims skog blir Absaloms hær slått; hodet hans henger fast i en eik, og han blir hengende der, og Joab støter tre spyd i hans hjerte mens han ennå lever; Joabs unge menn slår ham i hjel."
      tl: "Sa gubat ng Ephraim ay natatalo ang hukbo ni Absalom; nasasabit ang kaniyang ulo sa isang ensina at siya'y nakabitin doon, at tatlong pana ang pinalalagpas ni Joab sa kaniyang puso samantalang siya'y buhay pa; pinapatay siya ng mga bataan ni Joab."
      da: "I Efraims skov bliver Absalons hær slået; hans hoved filtres fast i en eg, så han hænger der, og Joab støder tre spyd ind i hans hjerte, mens han endnu er i live; Joabs væbnere dræber ham."
      sr: "У јефремској шуми Авесаломова војска је потучена; он се главом заплео у храст и тамо виси, а Јоав му још живом забада три стреле у срце; Јоавови момци га убијају."
      hu: "Efraim erdejében Absolon seregét megverik; a feje egy tölgyfába akad, ott függ, és Joáb három dárdát szúr a szívébe, amíg még él; Joáb fegyverhordozó ifjai végeznek vele."
      fi: "Efraimin metsässä Absalomin sotajoukko lyödään; hänen päänsä tarttuu tammeen, ja hän jää riippumaan, ja Joab iskee kolme keihästä hänen sydämeensä hänen vielä elävänä ollessaan; Joabin nuoret miehet surmaavat hänet."
      vi: "Trong rừng Ép-ra-im, quân của Áp-sa-lôm bị đánh bại; đầu vướng vào một cây sồi, người bị treo lơ lửng ở đó, và Giô-áp đâm ba mũi lao vào lòng người khi người còn sống; các tôi tớ của Giô-áp giết người."
      ro: "În pădurea lui Efraim, oastea lui Absalom este înfrântă; prins cu capul într-un stejar, el rămâne atârnat acolo, iar Ioab îi înfige trei săgeți în inimă cât este încă viu; tinerii lui Ioab îl omoară."
      bg: "В Ефремовия лес войската на Авесалом е разбита; главата му се заплита в един дъб и той остава да виси, а Йоав забива три стрели в сърцето му, докато е още жив; момците на Йоав го убиват."
  - place: ae5bfe9 # Mahanaim
    ref: 2Sam.18.19-2Sam.18.33
    note:
      en: 'At Mahanaim, sitting between the two gates, David hears the news and weeps: "O my son Absalom, my son, my son Absalom!"'
      ru: "В Маханаиме, сидя между двумя воротами, Давид получает весть и плачет: «сын мой Авессалом! сын мой, сын мой Авессалом!»"
      uk: "У Маханаїмі, сидячи між двома брамами, Давид чує вістку й плаче: «Сину мій Абессаломе! Сину мій, сину мій Абессаломе!»"
      es: "En Mahanaim, sentado entre las dos puertas, David recibe la noticia y llora: «¡Hijo mío Absalom, hijo mío, hijo mío Absalom!»"
      pt: "Em Maanaim, sentado entre as duas portas, Davi recebe a notícia e chora: “Meu filho Absalão! Meu filho, meu filho Absalão!”"
      de: "In Mahanajim hört David, zwischen den beiden Toren sitzend, die Nachricht und weint: „Mein Sohn Absalom! mein Sohn, mein Sohn Absalom!“"
      fr: "À Mahanaïm, assis entre les deux portes, David apprend la nouvelle et pleure : « Mon fils Absalom ! Mon fils, mon fils Absalom ! »"
      pl: "W Mahanaim, siedząc między dwiema bramami, Dawid słyszy wieść i płacze: „Synu mój Absalomie, synu mój! Synu mój Absalomie!”"
      it: "A Maanaim, seduto fra le due porte, Davide riceve la notizia e piange: «Absalom figliuolo mio! Figliuolo mio, Absalom figliuol mio!»"
      nl: "Te Machanaïm hoort David, zittend tussen de twee poorten, het bericht en weent: “Mijn zoon Absalom, mijn zoon, mijn zoon Absalom!”"
      cs: "V Machanajimu David sedí mezi dvojími branami, slyší zprávu a pláče: „Synu můj Absolone, synu můj, synu můj Absolone!“"
      sv: "I Mahanajim, där David sitter mellan de båda portarna, får han beskedet och gråter: ”Min son Absalom, min son, min son Absalom!”"
      nb: "I Mahanajim, hvor han sitter mellom de to portene, får David budskapet og gråter: «Min sønn Absalom! Min sønn, min sønn Absalom!»"
      tl: "Sa Mahanaim, na nakaupo sa pagitan ng dalawang pintuang-bayan, napakikinggan ni David ang balita at tumatangis: “Oh anak kong Absalom, anak ko, anak kong Absalom!”"
      da: "I Mahanajim, siddende mellem de to porte, hører David nyheden og græder: »Min Søn Absalom! min Søn, min Søn Absalom!«"
      sr: "У Маханајиму, седећи међу двоја врата, Давид чује вест и плаче: „Сине мој Авесаломе, сине мој, сине мој Авесаломе!“"
      hu: "Mahanajimban, a két kapu között ülve Dávid meghallja a hírt, és sír: „Szerelmes fiam, Absolon! édes fiam, édes fiam, Absolon!”"
      fi: "Mahanaimissa Daavid istuu molempien porttien välissä, kuulee sanoman ja itkee: ”Poikani Absalom, minun poikani, oma poikani Absalom!”"
      vi: "Tại Ma-ha-na-im, ngồi giữa hai cái cửa thành, Đa-vít nghe tin và khóc: “Ôi, Áp-sa-lôm, con trai ta! Áp-sa-lôm, con trai ta! con trai ta!”"
      ro: "La Mahanaim, șezând între cele două porți, David află vestea și plânge: „fiul meu Avesalom fiul mieu! Fiul meu Avesalom!”"
      bg: "В Маханаим, седнал между двете порти, Давид чува вестта и плаче: „Сине мой Авесаломе, сине мой, сине мой Авесаломе!“"
  - place: ab94aea # Gilgal
    ref: 2Sam.19.15-2Sam.19.40
    note:
      en: "The men of Judah come to Gilgal to bring the king back over the Jordan."
      ru: "Иудеи приходят в Галгал встретить царя и перевезти его через Иордан."
      uk: "Мужі Юди приходять до Гілгала, щоб привести царя назад через Йордан."
      es: "Los hombres de Judá llegan a Gilgal para hacer volver al rey al otro lado del Jordán."
      pt: "Os homens de Judá vão a Gilgal para trazer o rei de volta através do Jordão."
      de: "Die Männer von Juda kommen nach Gilgal, um den König über den Jordan zurückzuführen."
      fr: "Les hommes de Juda viennent à Guilgal pour ramener le roi au-delà du Jourdain."
      pl: "Mężowie z Judy przychodzą do Gilgal, by sprowadzić króla z powrotem przez Jordan."
      it: "Gli uomini di Giuda vengono a Gàlgala per ricondurre il re al di là del Giordano."
      nl: "De mannen van Juda komen naar Gilgal om de koning over de Jordaan terug te brengen."
      cs: "Judští přicházejí do Gilgalu, aby krále přivedli zpět přes Jordán."
      sv: "Judas män kommer till Gilgal för att föra kungen tillbaka över Jordan."
      nb: "Mennene fra Juda kommer til Gilgal for å føre kongen tilbake over Jordan."
      tl: "Pumupunta sa Gilgal ang mga lalaki ng Juda upang ihatid pabalik ang hari sa kabila ng Jordan."
      da: "Judas mænd kommer til Gilgal for at føre kongen tilbage over Jordan."
      sr: "Људи из Јуде долазе у Галгал да цара преведу преко Јордана."
      hu: "Júda férfiai Gilgálba jönnek, hogy a királyt visszakísérjék a Jordánon át."
      fi: "Juudan miehet tulevat Gilgaliin saattamaan kuninkaan takaisin Jordanin yli."
      vi: "Người Giu-đa đến Ghinh-ganh để đưa vua trở về qua sông Giô-đanh."
      ro: "Bărbații lui Iuda vin la Ghilgal ca să-l treacă pe rege înapoi peste Iordan."
      bg: "Юдовите мъже идват в Галгал, за да върнат царя отвъд Йордан."
