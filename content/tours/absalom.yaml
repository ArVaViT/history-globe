# Absalom's revolt, 2 Samuel 15-19, in the order of the text. 15:7 dates it "after forty
# years" (so the KJV and the Synodal text), which other ancient witnesses read as four; the
# tour's year (980 BC) is a conventional point late in David's reign (c. 1010-970 BC), for
# the map only. The David tour holds Mahanaim's welcome (17:24-29); this one stops there
# for the news of Absalom's death.
id: absalom
title:
  en: "Absalom's revolt"
  ru: "Восстание Авессалома"
year: "980 BC"
approximate: true
stops:
  - place: a85151a # Hebron
    ref: 2Sam.15.7-2Sam.15.12
    note:
      en: 'Absalom goes to Hebron as if to pay a vow, and sends spies through the tribes: at the sound of the trumpet they are to say, "Absalom reigneth in Hebron."'
      ru: "Авессалом уходит в Хеврон будто бы исполнить обет, и рассылает по коленам лазутчиков: по звуку трубы говорить «Авессалом воцарился в Хевроне»."
  - place: a553110 # Kidron
    ref: 2Sam.15.13-2Sam.15.23
    note:
      en: "David flees Jerusalem, and the king and all the people pass over the brook Kidron toward the wilderness, all the country weeping."
      ru: "Давид уходит из Иерусалима, и царь и весь народ переходят поток Кедрон по дороге к пустыне, и плачет вся земля."
  - place: ac2c4c5 # Mount of Olives
    ref: 2Sam.15.30-2Sam.15.37
    note:
      en: "He goes up the Mount of Olives weeping, barefoot and with his head covered, and sends Hushai back to Jerusalem."
      ru: "Он восходит на гору Елеонскую, плача, босой, с покрытой головой, и отправляет Хусия назад в Иерусалим."
  - place: a9ed5a4 # Bahurim
    ref: 2Sam.16.5-2Sam.16.14
    note:
      en: 'At Bahurim Shimei of the house of Saul curses him and throws stones; David will not have him killed: "let him curse."'
      ru: "В Бахуриме Семей из дома Саулова злословит его и бросает камнями; Давид не даёт убить его: «пусть он злословит»."
  - place: a15257a # Jerusalem
    ref: 2Sam.16.15-2Sam.16.23
    note:
      en: "Absalom enters Jerusalem and, on Ahithophel's counsel, goes in to his father's concubines before all Israel."
      ru: "Авессалом входит в Иерусалим и по совету Ахитофела входит к наложницам отца пред глазами всего Израиля."
  - place: aa24ad4 # Wood of Ephraim
    ref: 2Sam.18.6-2Sam.18.17
    note:
      en: "In the wood of Ephraim Absalom's army is beaten; his head caught in an oak, he hangs there, and Joab thrusts three darts into his heart while he is yet alive; Joab's young men slay him."
      ru: "В лесу Ефремовом войско Авессалома разбито; запутавшись волосами в ветвях дуба, он висит, ещё живой, когда Иоав вонзает три стрелы в его сердце, и оруженосцы Иоава добивают его."
  - place: ae5bfe9 # Mahanaim
    ref: 2Sam.18.19-2Sam.18.33
    note:
      en: 'At Mahanaim, sitting between the two gates, David hears the news and weeps: "O my son Absalom, my son, my son Absalom!"'
      ru: "В Маханаиме, сидя между двумя воротами, Давид получает весть и плачет: «сын мой Авессалом! сын мой, сын мой Авессалом!»"
  - place: ab94aea # Gilgal
    ref: 2Sam.19.15-2Sam.19.40
    note:
      en: "The men of Judah come to Gilgal to bring the king back over the Jordan."
      ru: "Иудеи приходят в Галгал встретить царя и перевезти его через Иордан."
