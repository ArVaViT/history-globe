# The earthly life of Jesus in the order of the Gospels, from Bethlehem to the Ascension.
# One stop per place and event; the order of the Galilean ministry follows the Synoptics,
# with John for Bethany beyond the Jordan, Cana, Sychar and the supper at Bethany. The
# tour's year (AD 30) is a conventional point for the map: the birth was c. 6-4 BC, the
# ministry c. AD 28-30.
