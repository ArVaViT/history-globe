    year: "AD 57"
    sailed: { days: 5, about: true, ref: Acts.20.6 }
    note:
      en: "Seven days in Troas; Eutychus."
      ru: "Семь дней в Троаде; Евтих."
      uk: "Сім днів у Троаді; Євтих."
      es: "Siete días en Troas; Eutico."
      pt: "Sete dias em Trôade; Êutico."
      de: "Sieben Tage in Troas; Eutychus."
      fr: "Sept jours à Troas ; Eutychus."
      pl: "Siedem dni w Troadzie; Eutych."
      it: "Sette giorni a Troade; Eutico."
      nl: "Zeven dagen in Troas; Eutychus."
      cs: "Sedm dní v Troadě; Eutychos."
      sv: "Sju dagar i Troas; Eutykos."
      nb: "Sju dager i Troas; Evtykos."
      tl: "Pitong araw sa Troas; si Eutico."
      da: "Syv dage i Troas; Eutykus."
      sr: "Седам дана у Троади; Евтих."
      hu: "Hét nap Troászban; Eutükhosz."
      fi: "Seitsemän päivää Troaksessa; Eutykos."
      vi: "Bảy ngày tại Trô-ách; Ơ-tích."
      ro: "Șapte zile în Troa; Eutih."
      bg: "Седем дни в Троада; Евтих."
    story:
      en: "In five days they reached Troas and stayed there seven days. On the first day of the week the disciples gathered to break bread, and Paul, who was to leave the next morning, spoke until midnight in an upper room lit by many lamps. A young man named Eutychus, sitting in the window, sank into a deep sleep and fell from the third storey, and was taken up dead. Paul went down, threw himself on him and embraced him, saying that his life was in him. Paul went back up, broke bread, ate and talked until daybreak, and left; the young man was brought home alive, and they were greatly comforted."
      ru: "За пять дней они прибыли в Троаду и пробыли там семь дней. В первый день недели ученики собрались для преломления хлеба, и Павел, который должен был уйти на следующее утро, беседовал до полуночи в горнице, освещённой многими светильниками. Юноша по имени Евтих, сидевший на окне, погрузился в глубокий сон и упал с третьего этажа, и его подняли мёртвым. Павел сошёл, пал на него и, обняв, сказал, что душа его в нём. Павел поднялся обратно, преломил хлеб, поел и беседовал до рассвета, а потом ушёл; юношу привели домой живым, и все очень утешились."
      uk: "За п’ять днів вони дісталися Троади й пробули там сім днів. Першого дня тижня учні зібралися на ламання хліба, і Павло, який мав вирушати наступного ранку, говорив до півночі в горниці, освітленій багатьма світильниками. Юнак на ім’я Євтих, що сидів на вікні, поринув у глибокий сон і впав з третього поверху, і його підняли мертвим. Павло зійшов, припав до нього й, обнявши, сказав, що душа його в ньому. Павло піднявся назад, переломив хліб, поїв і розмовляв аж до світанку, а тоді пішов; юнака привели додому живим, і всі дуже втішилися."
      es: "En cinco días llegaron a Troas y se quedaron allí siete días. El primer día de la semana los discípulos se reunieron para partir el pan, y Pablo, que iba a partir a la mañana siguiente, habló hasta medianoche en un aposento alto iluminado por muchas lámparas. Un joven llamado Eutico, sentado en la ventana, cayó en un sueño profundo y se precipitó desde el tercer piso, y lo levantaron muerto. Pablo bajó, se echó sobre él y lo abrazó, diciendo que su vida estaba en él. Pablo volvió a subir, partió el pan, comió y conversó hasta el alba, y se marchó; llevaron al joven vivo a su casa, y fueron muy consolados."
      pt: "Em cinco dias chegaram a Trôade e ficaram ali sete dias. No primeiro dia da semana os discípulos reuniram-se para partir o pão, e Paulo, que ia partir na manhã seguinte, falou até a meia-noite numa sala do andar superior iluminada por muitas lâmpadas. Um jovem chamado Êutico, sentado na janela, foi tomado de um sono profundo e caiu do terceiro andar, e foi recolhido morto. Paulo desceu, lançou-se sobre ele e o abraçou, dizendo que a vida dele estava nele. Paulo subiu de novo, partiu o pão, comeu e conversou até o amanhecer, e partiu; o jovem foi levado para casa vivo, e eles ficaram grandemente consolados."
      de: "In fünf Tagen erreichten sie Troas und blieben dort sieben Tage. Am ersten Tag der Woche versammelten sich die Jünger, um das Brot zu brechen, und Paulus, der am nächsten Morgen abreisen wollte, redete bis Mitternacht in einem von vielen Lampen erleuchteten Obergemach. Ein junger Mann namens Eutychus, der im Fenster saß, sank in tiefen Schlaf, fiel aus dem dritten Stockwerk und wurde tot aufgehoben. Paulus ging hinab, warf sich über ihn, umarmte ihn und sagte, sein Leben sei in ihm. Paulus ging wieder hinauf, brach das Brot, aß und redete bis zum Tagesanbruch und reiste ab; den jungen Mann brachte man lebend nach Hause, und sie wurden sehr getröstet."
      fr: "En cinq jours, ils atteignirent Troas et y restèrent sept jours. Le premier jour de la semaine, les disciples se réunirent pour rompre le pain, et Paul, qui devait partir le lendemain matin, parla jusqu’à minuit dans une chambre haute éclairée de nombreuses lampes. Un jeune homme nommé Eutychus, assis sur la fenêtre, tomba dans un profond sommeil et tomba du troisième étage, et on le releva mort. Paul descendit, se jeta sur lui et le prit dans ses bras, disant que sa vie était en lui. Paul remonta, rompit le pain, mangea et parla jusqu’au jour, puis partit ; on ramena le jeune homme vivant, et ils en furent grandement consolés."
      pl: "W pięć dni dotarli do Troady i pozostali tam siedem dni. Pierwszego dnia tygodnia uczniowie zebrali się na łamanie chleba, a Paweł, który miał odejść nazajutrz rano, przemawiał aż do północy w sali na piętrze oświetlonej wieloma lampami. Młodzieniec imieniem Eutych, siedzący w oknie, zapadł w głęboki sen i spadł z trzeciego piętra, i podniesiono go martwego. Paweł zszedł, przypadł do niego i objął go, mówiąc, że życie jest w nim. Paweł wrócił na górę, łamał chleb, jadł i rozmawiał aż do świtu, po czym odszedł; młodzieńca przyprowadzono do domu żywego i bardzo ich to pocieszyło."
      it: "In cinque giorni raggiunsero Troade e vi rimasero sette giorni. Il primo giorno della settimana i discepoli si riunirono per rompere il pane, e Paolo, che doveva partire il mattino seguente, parlò fino a mezzanotte in una sala al piano superiore illuminata da molte lampade. Un giovane di nome Eutico, seduto sulla finestra, cadde in un sonno profondo e precipitò dal terzo piano, e fu raccolto morto. Paolo scese, si gettò su di lui e lo abbracciò, dicendo che la sua vita era in lui. Paolo risalì, ruppe il pane, mangiò e parlò fino all’alba, e partì; il giovane fu ricondotto vivo, e ne furono grandemente consolati."
      nl: "In vijf dagen bereikten zij Troas en bleven daar zeven dagen. Op de eerste dag van de week kwamen de discipelen bijeen om het brood te breken, en Paulus, die de volgende morgen zou vertrekken, sprak tot middernacht in een bovenzaal die door vele lampen verlicht werd. Een jongeman genaamd Eutychus, die in het venster zat, viel in een diepe slaap, stortte van de derde verdieping naar beneden en werd dood opgenomen. Paulus ging naar beneden, wierp zich op hem, omarmde hem en zei dat zijn leven in hem was. Paulus ging weer naar boven, brak het brood, at en sprak tot het aanbreken van de dag, en vertrok; de jongeman werd levend naar huis gebracht, en zij werden zeer getroost."
      cs: "Za pět dní dopluli do Troady a zůstali tam sedm dní. Prvního dne v týdnu se učedníci shromáždili k lámání chleba a Pavel, který měl příštího rána odejít, mluvil až do půlnoci v horní místnosti osvětlené mnoha lampami. Mladík jménem Eutychos, který seděl v okně, upadl do hlubokého spánku, spadl z třetího patra a zvedli ho mrtvého. Pavel sešel dolů, vrhl se na něj, objal ho a řekl, že je v něm život. Pavel se vrátil nahoru, lámal chléb, jedl a rozmlouval až do svítání a odešel; mladíka přivedli domů živého a velmi je to potěšilo."
      sv: "På fem dagar nådde de Troas och stannade där sju dagar. På veckans första dag samlades lärjungarna för att bryta brödet, och Paulus, som skulle resa morgonen därpå, talade ända till midnatt i en sal på övervåningen, upplyst av många lampor. En ung man som hette Eutykos satt i fönstret, sjönk i djup sömn och föll ned från tredje våningen, och han togs upp död. Paulus gick ned, kastade sig över honom och omfamnade honom och sade att livet fanns i honom. Paulus gick upp igen, bröt brödet, åt och talade till gryningen och reste sedan; den unge mannen fördes hem levande, och de blev mycket tröstade."
      nb: "På fem dager nådde de Troas og ble der i sju dager. På den første dagen i uken samlet disiplene seg for å bryte brødet, og Paulus, som skulle reise neste morgen, talte til midnatt i en sal ovenpå som var opplyst av mange lamper. En ung mann som het Evtykos, satt i vinduet, sank i dyp søvn og falt ned fra tredje etasje, og han ble tatt opp død. Paulus gikk ned, kastet seg over ham og omfavnet ham og sa at livet var i ham. Paulus gikk opp igjen, brøt brødet, spiste og talte til det lysnet, og dro; den unge mannen ble ført hjem levende, og de ble storlig trøstet."
      tl: "Sa loob ng limang araw ay nakarating sila sa Troas at tumira roon nang pitong araw. Nang unang araw ng sanglinggo ay nagkatipon ang mga alagad upang pagputul-putulin ang tinapay, at si Pablo, na aalis kinaumagahan, ay nagsalita hanggang hatinggabi sa isang silid sa itaas na may maraming ilaw. Isang binatang nagngangalang Eutico, na nakaupo sa durungawan, ay nahimbing sa pagtulog at nahulog mula sa ikatlong palapag, at binuhat na patay. Nanaog si Pablo, dumapa sa ibabaw niya at niyakap siya, na sinasabing nasa kaniya ang kaniyang buhay. Umakyat muli si Pablo, pinagputul-putol ang tinapay, kumain at nakipag-usap hanggang sa pagbubukang-liwayway, at umalis; iniuwi nang buhay ang binata, at sila'y lubhang naaliw."
      da: "På fem dage nåede de Troas og blev der syv dage. På ugens første dag samledes disciplene for at bryde brødet, og Paulus, som skulle rejse næste morgen, talte til midnat i en sal ovenpå, oplyst af mange lamper. En ung mand ved navn Eutykus, som sad i vinduet, faldt i en dyb søvn og styrtede ned fra tredje stokværk og blev taget død op. Paulus gik ned, kastede sig over ham og omfavnede ham og sagde, at livet var i ham. Paulus gik op igen, brød brødet, spiste og talte til daggry og drog så bort; den unge mand blev bragt levende hjem, og de blev meget trøstet."
      sr: "За пет дана стигли су у Троаду и остали тамо седам дана. У први дан недеље ученици су се сабрали да ломе хлеб, а Павле, који је сутрадан ујутру требало да пође, говорио је до поноћи у горњој соби осветљеној многим светиљкама. Један младић по имену Евтих, који је седео на прозору, утонуо је у дубок сан и пао с трећег спрата, и подигли су га мртвог. Павле је сишао, пао на њега и загрлио га, рекавши да је душа његова у њему. Павле се вратио горе, преломио хлеб, јео и разговарао до зоре, и отишао; младића су довели живог, и веома су се утешили."
      hu: "Öt nap alatt értek Troászba, és ott hét napig maradtak. A hét első napján a tanítványok összegyűltek kenyeret törni, és Pál, aki másnap reggel indulni készült, éjfélig beszélt egy sok lámpással megvilágított felső teremben. Egy Eutükhosz nevű ifjú, aki az ablakban ült, mély álomba merült, leesett a harmadik emeletről, és halottként emelték fel. Pál lement, ráborult, átölelte, és azt mondta, hogy élet van benne. Pál visszament, kenyeret tört, evett, és hajnalig beszélgetett, majd elindult; az ifjút élve vitték haza, és nagyon megvigasztalódtak."
      fi: "Viidessä päivässä he saapuivat Troakseen ja viipyivät siellä seitsemän päivää. Viikon ensimmäisenä päivänä opetuslapset kokoontuivat murtamaan leipää, ja Paavali, jonka oli määrä lähteä seuraavana aamuna, puhui puoliyöhön asti yläsalissa, jota valaisivat monet lamput. Ikkunalla istunut nuorukainen nimeltä Eutykos vaipui sikeään uneen ja putosi kolmannesta kerroksesta, ja hänet nostettiin ylös kuolleena. Paavali meni alas, heittäytyi hänen päälleen ja kiersi kätensä hänen ympärilleen sanoen, että hänessä oli henki. Paavali meni takaisin ylös, mursi leipää, söi ja puhui päivän koittoon asti ja lähti; nuorukainen tuotiin kotiin elävänä, ja he saivat suuren lohdutuksen."
      vi: "Trong năm ngày họ đến Trô-ách và ở lại đó bảy ngày. Ngày thứ nhất trong tuần, các môn đồ nhóm lại để bẻ bánh, và Phao-lô, vì sáng hôm sau phải đi, giảng cho đến nửa đêm trong một phòng cao thắp nhiều đèn. Một thanh niên tên là Ơ-tích, ngồi trên cửa sổ, ngủ mê và từ tầng lầu thứ ba té xuống, lúc đỡ dậy đã chết. Phao-lô bước xuống, nằm lên trên người, ôm lấy người và nói rằng linh hồn còn ở trong người. Phao-lô lại trở lên, bẻ bánh, ăn và giảng luận cho đến sáng rồi đi; người thanh niên được đưa về nhà còn sống, và mọi người được yên ủi lắm."
      ro: "În cinci zile au ajuns la Troa și au stat acolo șapte zile. În prima zi a săptămânii ucenicii s-au adunat să frângă pâinea, iar Pavel, care trebuia să plece a doua zi dimineață, a vorbit până la miezul nopții într-o încăpere de sus luminată de multe lămpi. Un tânăr numit Eutih, care ședea la fereastră, a fost cuprins de un somn adânc, a căzut de la etajul al treilea și a fost ridicat mort. Pavel a coborât, s-a aruncat peste el și l-a îmbrățișat, spunând că viața lui este în el. Pavel a urcat din nou, a frânt pâinea, a mâncat și a vorbit până în zori, apoi a plecat; tânărul a fost adus acasă viu, și s-au mângâiat foarte mult."
      bg: "За пет дни стигнаха до Троада и останаха там седем дни. В първия ден на седмицата учениците се събраха да преломят хляб и Павел, който трябваше да тръгне на следващата сутрин, говори до полунощ в една горна стая, осветена от много светилници. Един младеж на име Евтих, който седеше на прозореца, потъна в дълбок сън и падна от третия етаж, и го вдигнаха мъртъв. Павел слезе, наведе се над него и го прегърна, като каза, че душата му е в него. Павел се качи пак горе, преломи хляб, яде и разговаря до зори, и тръгна; младежа доведоха жив и те много се утешиха."
  - place: a0a2ca7
    ref: Acts.20.13
    year: "AD 57"
    note:
      en: "Paul goes on foot to Assos."
      ru: "Павел идёт в Асс пешком."
      uk: "Павло йде пішки до Ассоса."
      es: "Pablo va a pie hasta Asón."
      pt: "Paulo vai a pé até Assôs."
      de: "Paulus geht zu Fuß nach Assos."
      fr: "Paul se rend à pied à Assos."
      pl: "Paweł idzie pieszo do Assos."
      it: "Paolo va a piedi fino ad Asso."
      nl: "Paulus gaat te voet naar Assos."
      cs: "Pavel jde pěšky do Assu."
      sv: "Paulus går till fots till Assos."
      nb: "Paulus går til fots til Assos."
      tl: "Naglakad si Pablo patungong Ason."
      da: "Paulus går til fods til Assos."
      sr: "Павле иде пешке у Асос."
      hu: "Pál gyalog megy Asszoszba."
      fi: "Paavali menee jalkaisin Assokseen."
      vi: "Phao-lô đi bộ đến A-sốt."
      ro: "Pavel merge pe jos la Asos."
      bg: "Павел отива пеша до Асос."
    story:
      en: "The others went ahead to the ship and sailed round to Assos, a city built in terraces on a volcanic hill above a small harbour on the southern coast of the Troad, facing Lesbos; there they were to take Paul on board, for he had arranged to go overland on foot while they sailed round the cape."
      ru: "Остальные пошли вперёд на корабль и обогнули мыс до Асса, города, построенного террасами на вулканическом холме над небольшой гаванью на южном побережье Троады, напротив Лесбоса; там они должны были взять Павла на борт, потому что он решил идти пешком сушей, пока они огибали мыс."
      uk: "Інші пішли вперед до корабля й обігнули мис до Ассоса, міста, збудованого терасами на вулканічному пагорбі над невеликою гаванню на південному узбережжі Троади, навпроти Лесбосу; там вони мали взяти Павла на борт, бо він вирішив іти пішки суходолом, поки вони огинали мис."
      es: "Los demás se adelantaron a la nave y navegaron rodeando hasta Asón, una ciudad construida en terrazas sobre una colina volcánica que domina un pequeño puerto de la costa sur de la Tróade, frente a Lesbos; allí debían recoger a Pablo, porque él había dispuesto ir por tierra a pie mientras ellos doblaban el cabo."
      pt: "Os outros foram na frente para o navio e navegaram, contornando a costa, até Assôs, uma cidade construída em terraços numa colina vulcânica acima de um pequeno porto na costa sul da Tróade, defronte de Lesbos; ali deviam receber Paulo a bordo, pois ele tinha combinado ir a pé por terra enquanto eles contornavam o cabo."
      de: "Die anderen gingen voraus zum Schiff und segelten nach Assos, einer in Terrassen auf einem vulkanischen Hügel über einem kleinen Hafen erbauten Stadt an der Südküste der Troas, gegenüber von Lesbos; dort sollten sie Paulus an Bord nehmen, denn er hatte vereinbart, zu Fuß über Land zu gehen, während sie um das Kap segelten."
      fr: "Les autres prirent les devants sur le navire et firent voile, en contournant le cap, vers Assos, ville bâtie en terrasses sur une colline volcanique au-dessus d’un petit port de la côte sud de la Troade, face à Lesbos ; ils devaient y prendre Paul à bord, car il avait décidé de faire la route à pied par terre pendant qu’eux contournaient le cap."
      pl: "Pozostali poszli przodem na okręt i opłynęli przylądek do Assos, miasta zbudowanego tarasami na wulkanicznym wzgórzu nad małym portem na południowym wybrzeżu Troady, naprzeciw Lesbos; tam mieli wziąć Pawła na pokład, bo postanowił iść lądem pieszo, podczas gdy oni opływali przylądek."
      it: "Gli altri andarono avanti alla nave e navigarono, doppiando il capo, fino ad Asso, città costruita a terrazze su un colle vulcanico sopra un piccolo porto della costa meridionale della Troade, di fronte a Lesbo; lì dovevano prendere Paolo a bordo, perché egli aveva stabilito di andare a piedi per terra mentre essi doppiavano il capo."
      nl: "De anderen gingen vooruit naar het schip en voeren om naar Assos, een stad die in terrassen gebouwd was op een vulkanische heuvel boven een kleine haven aan de zuidkust van de Troas, tegenover Lesbos; daar zouden zij Paulus aan boord nemen, want hij had afgesproken te voet over land te gaan terwijl zij om de kaap voeren."
      cs: "Ostatní šli napřed k lodi a obepluli mys do Assu, města vystavěného v terasách na sopečném pahorku nad malým přístavem na jižním pobřeží Troady, naproti Lesbu; tam měli vzít Pavla na palubu, neboť si umínil jít pěšky po souši, zatímco oni obeplouvali mys."
      sv: "De andra gick i förväg till skeppet och seglade runt till Assos, en stad byggd i terrasser på en vulkanisk kulle ovanför en liten hamn på Troadens sydkust, mitt emot Lesbos; där skulle de ta Paulus ombord, eftersom han hade bestämt att gå till fots landvägen medan de seglade runt udden."
      nb: "De andre gikk i forveien til skipet og seilte rundt til Assos, en by bygd i terrasser på en vulkansk høyde over en liten havn på sørkysten av Troas-landskapet, med utsikt mot Lesbos; der skulle de ta Paulus om bord, for han hadde avtalt å gå til fots over land mens de seilte rundt odden."
      tl: "Nauna ang iba sa daong at naglayag paikot patungong Ason, isang lungsod na itinayo nang paantas sa isang burol na bulkaniko sa itaas ng isang maliit na daungan sa timugang baybayin ng Troad, nakaharap sa Lesbos; doon nila isasakay si Pablo, sapagka't ipinasiya niyang maglakad sa lupa samantalang naglalayag sila paikot sa lungos."
      da: "De andre gik i forvejen til skibet og sejlede rundt til Assos, en by bygget i terrasser på en vulkansk høj over en lille havn på sydkysten af landskabet Troas, over for Lesbos; der skulle de tage Paulus om bord, for han havde bestemt at gå over land til fods, mens de sejlede rundt om forbjerget."
      sr: "Остали су отишли напред до лађе и обалом отпловили у Асос, град саграђен на терасама на вулканском брду изнад мале луке на јужној обали Троаде, према Лезбосу; тамо је требало да узму Павла на лађу, јер је он одредио да иде копном пешке док они обилазе рт."
      hu: "A többiek előrementek a hajóhoz, és körülhajóztak Asszoszba, a Troász-vidék déli partján, egy kis kikötő fölötti vulkanikus dombon teraszosan épült városba, Leszbosszal szemben; ott kellett Pált a fedélzetre venniük, mert úgy rendelkezett, hogy gyalog megy a szárazföldön, amíg ők a fokot megkerülik."
      fi: "Muut menivät edeltä laivaan ja purjehtivat Assokseen, kaupunkiin, joka oli rakennettu pengermille tuliperäiselle kukkulalle pienen sataman yläpuolelle Troaksen seudun etelärannikolla Lesbosta vastapäätä; siellä heidän oli määrä ottaa Paavali laivaan, sillä hän oli päättänyt kulkea maitse jalkaisin heidän purjehtiessaan niemen ympäri."
      vi: "Những người khác đi trước xuống tàu và chạy vòng đến A-sốt, một thành xây thành từng bậc trên một ngọn đồi núi lửa phía trên một bến cảng nhỏ ở bờ biển phía nam miền Troad, đối diện Lesbos; tại đó họ sẽ đón Phao-lô lên tàu, vì ông đã định đi bộ đường bộ trong khi họ đi thuyền vòng qua mũi đất."
      ro: "Ceilalți au mers înainte la corabie și au navigat ocolind până la Asos, un oraș construit în terase pe un deal vulcanic deasupra unui mic port pe coasta de sud a Troadei, în fața insulei Lesbos; acolo urmau să-l ia pe Pavel pe corabie, pentru că el rânduise să meargă pe jos pe uscat, în timp ce ei ocoleau capul."
      bg: "Другите отидоха напред до кораба и отплаваха около брега до Асос — град, построен на тераси върху вулканичен хълм над малко пристанище на южния бряг на Троада, срещу Лесбос; там трябваше да вземат Павел на борда, защото той беше уредил да иде пеша по суша, докато те заобикалят нос."
  - place: a33910d
    ref: Acts.20.14
    by: sea
    via:
