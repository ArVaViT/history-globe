      ru: "Проведя некоторое время в Антиохии, Павел снова вышел и проходил по порядку Галатийскую страну и Фригию, утверждая всех учеников."
      uk: "Провівши деякий час в Антіохії, Павло знову вирушив і проходив від місця до місця Галатійським краєм і Фригією, зміцнюючи всіх учнів."
      es: "Después de pasar algún tiempo en Antioquía, Pablo partió de nuevo y recorrió de un lugar a otro la región de Galacia y Frigia, confirmando a todos los discípulos."
      pt: "Depois de passar algum tempo em Antioquia, Paulo partiu de novo e percorreu, de lugar em lugar, a região da Galácia e da Frígia, fortalecendo todos os discípulos."
      de: "Nachdem er einige Zeit in Antiochia verbracht hatte, brach Paulus wieder auf und durchzog nacheinander das galatische Land und Phrygien und stärkte alle Jünger."
      fr: "Après avoir passé quelque temps à Antioche, Paul repartit et parcourut de lieu en lieu le pays de Galatie et la Phrygie, fortifiant tous les disciples."
      pl: "Spędziwszy pewien czas w Antiochii, Paweł wyruszył znowu i przechodził kolejno przez krainę galacką i Frygię, umacniając wszystkich uczniów."
      it: "Dopo essersi fermato per qualche tempo ad Antiochia, Paolo ripartì e percorse di luogo in luogo il paese della Galazia e la Frigia, confermando tutti i discepoli."
      nl: "Nadat hij enige tijd te Antiochië had doorgebracht, vertrok Paulus opnieuw en trok achtereenvolgens door het Galatische land en Frygië, terwijl hij alle discipelen versterkte."
      cs: "Když Pavel nějaký čas pobyl v Antiochii, vydal se znovu na cestu a procházel postupně galatským krajem a Frygií a utvrzoval všechny učedníky."
      sv: "Efter att ha stannat en tid i Antiochia bröt Paulus upp igen och drog från ort till ort genom det galatiska landet och Frygien och styrkte alla lärjungarna."
      nb: "Etter å ha vært en tid i Antiokia brøt Paulus opp igjen og dro fra sted til sted gjennom det galatiske landet og Frygia og styrket alle disiplene."
      tl: "Pagkagugol ng ilang panahon sa Antioquia, muling umalis si Pablo at nagpalipat-lipat sa lupain ng Galacia at Frigia, na pinatitibay ang lahat ng mga alagad."
      da: "Efter at have opholdt sig nogen tid i Antiokia drog Paulus atter af sted og rejste fra sted til sted gennem det galatiske land og Frygien og styrkede alle disciplene."
      sr: "Провевши неко време у Антиохији, Павле је поново кренуо и прелазио редом од места до места галатијску земљу и Фригију, утврђујући све ученике."
      hu: "Miután egy ideig Antiókhiában töltött, Pál ismét elindult, és helyről helyre járt Galácia vidékén és Frígián át, erősítve minden tanítványt."
      fi: "Vietettyään jonkin aikaa Antiokiassa Paavali lähti jälleen matkaan ja kulki paikasta toiseen Galatian maakunnan ja Frygian kautta vahvistaen kaikkia opetuslapsia."
      vi: "Sau khi ở An-ti-ốt ít lâu, Phao-lô lại lên đường, đi lần lần từ nơi này đến nơi khác trong xứ Ga-la-ti và xứ Phi-ri-gi, làm cho hết thảy môn đồ đều vững lòng."
      ro: "După ce a petrecut câtva timp la Antiohia, Pavel a pornit din nou și a trecut din loc în loc prin ținutul Galatiei și prin Frigia, întărindu-i pe toți ucenicii."
      bg: "След като прекара известно време в Антиохия, Павел тръгна отново и обикаляше от място на място Галатийската област и Фригия, като утвърждаваше всички ученици."
  - place: a5feb15
    ref: Acts.19.1-Acts.20.1
    by: untold
    note:
      en: "About three years in Ephesus; the riot of Demetrius."
      ru: "Около трёх лет в Ефесе; мятеж Димитрия."
      uk: "Близько трьох років в Ефесі; заколот Димитрія."
      es: "Unos tres años en Éfeso; el tumulto de Demetrio."
      pt: "Cerca de três anos em Éfeso; o tumulto de Demétrio."
      de: "Etwa drei Jahre in Ephesus; der Aufruhr des Demetrius."
      fr: "Environ trois ans à Éphèse ; l’émeute de Démétrius."
      pl: "Około trzech lat w Efezie; rozruchy wywołane przez Demetriusza."
      it: "Circa tre anni a Efeso; il tumulto di Demetrio."
      nl: "Ongeveer drie jaar in Efeze; het oproer van Demetrius."
      cs: "Asi tři roky v Efezu; vzpoura Démétriova."
      sv: "Omkring tre år i Efesos; Demetrios’ upplopp."
      nb: "Omkring tre år i Efesos; Demetrios' opptøyer."
      tl: "Mga tatlong taon sa Efeso; ang kaguluhan ni Demetrio."
      da: "Omkring tre år i Efesos; Demetrius' opstand."
      sr: "Око три године у Ефесу; буна Димитријева."
      hu: "Mintegy három év Efezusban; Démétriusz lázadása."
      fi: "Noin kolme vuotta Efesoksessa; Demetrioksen mellakka."
      vi: "Khoảng ba năm tại Ê-phê-sô; cuộc nổi loạn của Đê-mê-triu."
      ro: "Aproape trei ani în Efes; răscoala lui Dimitrie."
      bg: "Около три години в Ефес; бунтът на Димитър."
    story:
      en: "Paul came through the upper country to Ephesus, the residence of the proconsul of Asia. There he found some twelve disciples who knew only John's baptism; baptised in the name of the Lord Jesus, they received the Holy Spirit. For three months he spoke boldly in the synagogue; when some hardened and spoke evil of the Way, he withdrew with the disciples and reasoned daily in the school of Tyrannus, and this went on for two years, so that all who lived in Asia heard the word. God worked extraordinary miracles through Paul, and many who had practised magic burned their books, worth fifty thousand pieces of silver. Then Demetrius, a silversmith who made silver shrines of Diana, roused the craftsmen: Paul's teaching threatened their trade and the goddess's temple. The whole city filled with confusion and rushed into the theatre, shouting for some two hours, Great is Diana of the Ephesians, until the town clerk quieted the crowd and dismissed the assembly."
      ru: "Пройдя верхние области, Павел пришёл в Ефес, резиденцию проконсула Асии. Там он нашёл около двенадцати учеников, знавших только крещение Иоанново; крестившись во имя Господа Иисуса, они приняли Духа Святого. Три месяца он смело говорил в синагоге; когда некоторые ожесточились и стали злословить этот путь, он отделился вместе с учениками и ежедневно рассуждал в училище Тиранна, и это продолжалось два года, так что все жители Асии услышали слово. Бог творил руками Павла необычайные чудеса, и многие из занимавшихся чародейством сожгли свои книги стоимостью в пятьдесят тысяч серебряных монет. Тогда Димитрий, серебряник, делавший серебряные храмы Артемиды, возбудил ремесленников: учение Павла угрожало их ремеслу и храму богини. Весь город наполнился смятением и устремился в театр, около двух часов крича, что велика Артемида Ефесская, пока городской блюститель порядка не утишил толпу и не распустил собрание."
      uk: "Пройшовши верхні краї, Павло прийшов до Ефеса, осідку проконсула Азії. Там він знайшов близько дванадцяти учнів, які знали тільки Іванове хрещення; охрестившись в ім’я Господа Ісуса, вони прийняли Святого Духа. Три місяці він сміливо говорив у синагозі; коли деякі закам’яніли й стали лихословити цю дорогу, він відійшов разом з учнями й щодня міркував у школі Тирана, і так тривало два роки, тож усі мешканці Азії почули слово. Бог чинив руками Павла надзвичайні чуда, і багато хто з тих, що займалися чарами, спалили свої книги вартістю п’ятдесят тисяч срібняків. Тоді Димитрій, срібний майстер, що робив срібні храмики Артеміди, підбурив ремісників: наука Павла загрожувала їхньому ремеслу й храмові богині. Усе місто сповнилося замішанням і кинулося до театру, близько двох годин вигукуючи, що велика Артеміда Ефеська, аж поки міський писар не втихомирив натовп і не розпустив збори."
      es: "Pablo atravesó las regiones altas y llegó a Éfeso, residencia del procónsul de Asia. Allí encontró a unos doce discípulos que solo conocían el bautismo de Juan; bautizados en el nombre del Señor Jesús, recibieron el Espíritu Santo. Durante tres meses habló con valentía en la sinagoga; cuando algunos se endurecieron y hablaron mal del Camino, se apartó con los discípulos y discutía cada día en la escuela de Tirano, y esto duró dos años, de modo que todos los que habitaban en Asia oyeron la palabra. Dios hacía milagros extraordinarios por medio de Pablo, y muchos que habían practicado la magia quemaron sus libros, que valían cincuenta mil piezas de plata. Entonces Demetrio, un platero que hacía templecillos de plata de Diana, soliviantó a los artesanos: la enseñanza de Pablo amenazaba su oficio y el templo de la diosa. Toda la ciudad se llenó de confusión y se precipitó al teatro, gritando durante unas dos horas: Grande es Diana de los Efesios, hasta que el escribano de la ciudad calmó a la multitud y disolvió la asamblea."
      pt: "Paulo passou pelas regiões do interior e chegou a Éfeso, residência do procônsul da Ásia. Ali encontrou cerca de doze discípulos que conheciam apenas o batismo de João; batizados em nome do Senhor Jesus, receberam o Espírito Santo. Durante três meses falou ousadamente na sinagoga; quando alguns se endureceram e falaram mal do Caminho, retirou-se com os discípulos e discutia diariamente na escola de Tirano, e isso continuou por dois anos, de modo que todos os que habitavam na Ásia ouviram a palavra. Deus fazia milagres extraordinários por meio de Paulo, e muitos que tinham praticado magia queimaram os seus livros, que valiam cinquenta mil moedas de prata. Então Demétrio, um ourives que fazia santuários de prata de Ártemis, sublevou os artífices: o ensino de Paulo ameaçava o seu ofício e o templo da deusa. A cidade toda encheu-se de confusão e correu para o teatro, gritando durante cerca de duas horas: Grande é a Ártemis dos efésios, até que o escrivão da cidade acalmou a multidão e dissolveu a assembleia."
      de: "Paulus kam durch das Hochland nach Ephesus, dem Sitz des Prokonsuls von Asien. Dort fand er etwa zwölf Jünger, die nur die Taufe des Johannes kannten; auf den Namen des Herrn Jesus getauft, empfingen sie den Heiligen Geist. Drei Monate lang redete er freimütig in der Synagoge; als einige sich verhärteten und schlecht von dem Weg redeten, trennte er sich mit den Jüngern von ihnen und redete täglich in der Schule des Tyrannus, und das ging zwei Jahre so, sodass alle, die in Asien wohnten, das Wort hörten. Gott wirkte durch Paulus außergewöhnliche Wunder, und viele, die Zauberei getrieben hatten, verbrannten ihre Bücher im Wert von fünfzigtausend Silberstücken. Dann wiegelte Demetrius, ein Silberschmied, der silberne Tempel der Diana herstellte, die Handwerker auf: Die Lehre des Paulus bedrohe ihr Gewerbe und den Tempel der Göttin. Die ganze Stadt geriet in Verwirrung und stürmte ins Theater und schrie etwa zwei Stunden lang, groß sei die Diana der Epheser, bis der Stadtschreiber die Menge beruhigte und die Versammlung auflöste."
      fr: "Paul arriva par les hautes provinces à Éphèse, résidence du proconsul d’Asie. Il y trouva une douzaine de disciples qui ne connaissaient que le baptême de Jean ; baptisés au nom du Seigneur Jésus, ils reçurent le Saint-Esprit. Pendant trois mois, il parla avec assurance dans la synagogue ; quand certains s’endurcirent et décrièrent la Voie, il se retira avec les disciples et discuta chaque jour dans l’école de Tyrannus, et cela dura deux ans, de sorte que tous ceux qui habitaient l’Asie entendirent la parole. Dieu faisait des miracles extraordinaires par Paul, et beaucoup de ceux qui avaient exercé la magie brûlèrent leurs livres, d’une valeur de cinquante mille pièces d’argent. Puis Démétrius, un orfèvre qui fabriquait en argent des temples de Diane, souleva les artisans : l’enseignement de Paul menaçait leur métier et le temple de la déesse. Toute la ville fut dans la confusion et se précipita au théâtre, criant pendant près de deux heures : Grande est la Diane des Éphésiens, jusqu’à ce que le secrétaire apaise la foule et congédie l’assemblée."
      pl: "Paweł przeszedł przez wyżynne krainy i przybył do Efezu, siedziby prokonsula Azji. Znalazł tam około dwunastu uczniów, którzy znali tylko chrzest Janowy; ochrzczeni w imię Pana Jezusa, otrzymali Ducha Świętego. Przez trzy miesiące odważnie przemawiał w synagodze; gdy niektórzy się zatwardzili i źle mówili o Drodze, odłączył się wraz z uczniami i codziennie rozprawiał w szkole Tyrannusa, a trwało to dwa lata, tak że wszyscy mieszkańcy Azji usłyszeli słowo. Bóg czynił przez Pawła niezwykłe cuda, a wielu z tych, którzy uprawiali magię, spaliło swoje księgi warte pięćdziesiąt tysięcy srebrników. Wtedy Demetriusz, złotnik, który wyrabiał srebrne świątynki Diany, podburzył rzemieślników: nauka Pawła zagrażała ich zarobkom i świątyni bogini. Całe miasto ogarnęło zamieszanie i wszyscy wpadli do teatru, wykrzykując przez około dwie godziny, że wielka jest Diana Efeska, aż pisarz miejski uciszył tłum i rozwiązał zgromadzenie."
      it: "Paolo, attraversata la parte alta del paese, giunse a Efeso, residenza del proconsole d’Asia. Vi trovò circa dodici discepoli che conoscevano solo il battesimo di Giovanni; battezzati nel nome del Signore Gesù, ricevettero lo Spirito Santo. Per tre mesi parlò con franchezza nella sinagoga; quando alcuni si indurirono e dissero male della Via, si ritirò con i discepoli e discuteva ogni giorno nella scuola di Tiranno, e questo durò due anni, così che tutti quelli che abitavano in Asia udirono la parola. Dio operava miracoli straordinari per mezzo di Paolo, e molti di quelli che avevano praticato la magia bruciarono i loro libri, del valore di cinquantamila monete d’argento. Poi Demetrio, un orefice che faceva tempietti di Diana in argento, sollevò gli artigiani: l’insegnamento di Paolo minacciava il loro mestiere e il tempio della dea. Tutta la città si riempì di confusione e si precipitò nel teatro, gridando per circa due ore: Grande è la Diana degli Efesini, finché il segretario calmò la folla e sciolse l’assemblea."
      nl: "Paulus kwam door het hoogland te Efeze, de residentie van de proconsul van Asia. Daar vond hij een twaalftal discipelen die alleen de doop van Johannes kenden; gedoopt in de naam van de Heer Jezus, ontvingen zij de Heilige Geest. Drie maanden lang sprak hij vrijmoedig in de synagoge; toen sommigen zich verhardden en kwaadspraken van de Weg, trok hij zich met de discipelen terug en sprak dagelijks in de school van Tyrannus, en dat ging twee jaar zo door, zodat allen die in Asia woonden het woord hoorden. God deed door Paulus buitengewone wonderen, en velen die toverij hadden bedreven, verbrandden hun boeken, ter waarde van vijftigduizend zilverstukken. Toen hitste Demetrius, een zilversmid die zilveren tempeltjes van Diana maakte, de ambachtslieden op: de leer van Paulus bedreigde hun bedrijf en de tempel van de godin. De hele stad raakte in verwarring en stormde het theater in, waar men zo'n twee uur lang riep dat Diana van de Efeziërs groot is, totdat de stadsschrijver de menigte tot bedaren bracht en de vergadering ontbond."
      cs: "Pavel prošel horní krajinou a přišel do Efezu, sídla prokonzula Asie. Nalezl tam asi dvanáct učedníků, kteří znali jen Janův křest; když byli pokřtěni ve jméno Pána Ježíše, přijali Ducha svatého. Tři měsíce směle mluvil v synagoze; když se někteří zatvrdili a zle mluvili o Cestě, oddělil se s učedníky a denně rozmlouval ve škole Tyrannově, a to trvalo dva roky, takže slovo uslyšeli všichni, kdo bydleli v Asii. Bůh skrze Pavla činil neobyčejné divy a mnozí, kdo provozovali magii, spálili své knihy v ceně padesáti tisíc stříbrných. Tehdy Démétrios, stříbrník, který zhotovoval stříbrné chrámky Diány, pobouřil řemeslníky: Pavlovo učení ohrožovalo jejich živnost i chrám bohyně. Celé město se naplnilo zmatkem a hnalo se do divadla a asi dvě hodiny křičelo, že veliká je Diána Efezská, dokud městský písař neutišil dav a nerozpustil shromáždění."
      sv: "Paulus kom genom de övre delarna av landet till Efesos, residensstad för prokonsuln i Asien. Där fann han omkring tolv lärjungar som bara kände till Johannes’ dop; när de döptes i Herren Jesu namn tog de emot den helige Ande. I tre månader talade han frimodigt i synagogan; när somliga förhärdade sig och talade illa om den vägen, drog han sig undan med lärjungarna och samtalade dagligen i Tyrannos’ lärosal, och detta pågick i två år, så att alla som bodde i Asien hörde ordet. Gud gjorde ovanliga kraftgärningar genom Paulus, och många som hade utövat magi brände sina böcker, värda femtio tusen silverpenningar. Då väckte Demetrios, en silversmed som gjorde Dianatempel av silver, upp hantverkarna: Paulus’ lära hotade deras näring och gudinnans tempel. Hela staden fylldes av förvirring och störtade in i teatern och ropade i omkring två timmar att efesiernas Diana är stor, tills stadens kansler lugnade folkmassan och upplöste folkförsamlingen."
      nb: "Paulus kom gjennom de øvre landskapene til Efesos, residensbyen for prokonsulen i Asia. Der fant han omkring tolv disipler som bare kjente Johannes' dåp; da de ble døpt i Herren Jesu navn, fikk de Den hellige ånd. I tre måneder talte han frimodig i synagogen; da noen forherdet seg og talte ille om Veien, trakk han seg tilbake med disiplene og holdt daglige samtaler i Tyrannos' skole, og dette varte i to år, så alle som bodde i Asia, hørte ordet. Gud gjorde usedvanlige under ved Paulus, og mange som hadde drevet med magi, brente bøkene sine, verdt femti tusen sølvpenninger. Da satte Demetrios, en sølvsmed som laget Diana-templer av sølv, håndverkerne opp: Paulus' lære truet deres næring og gudinnens tempel. Hele byen ble fylt av forvirring og stormet inn i teatret og ropte i omkring to timer at efesernes Diana er stor, inntil byskriveren fikk ro på mengden og oppløste folkeforsamlingen."
      tl: "Tinahak ni Pablo ang mga lupaing matataas at dumating sa Efeso, ang tahanan ng prokonsul ng Asia. Doon ay nakasumpong siya ng mga labindalawang alagad na ang nalalaman lamang ay ang bautismo ni Juan; nang mabautismuhan sila sa pangalan ng Panginoong Jesus, tinanggap nila ang Espiritu Santo. Sa loob ng tatlong buwan ay nagsalita siya nang buong katapangan sa sinagoga; nang magmatigas ang ilan at magsalita ng masama laban sa Daan, humiwalay siya kasama ng mga alagad at nangatuwiran araw-araw sa paaralan ni Tiranno, at tumagal ito nang dalawang taon, ano pa't narinig ng lahat ng nananahan sa Asia ang salita. Gumawa ang Diyos ng mga di-pangkaraniwang himala sa pamamagitan ni Pablo, at marami sa mga gumagamit ng magica ang nagsunog ng kanilang mga aklat, na nagkakahalaga ng limampung libong putol na pilak. Pagkatapos ay inudyukan ni Demetrio, isang pandaypilak na gumagawa ng maliliit na dambanang pilak ni Diana, ang mga manggagawa: nanganganib dahil sa aral ni Pablo ang kanilang hanapbuhay at ang templo ng diyosa. Napuno ng kaguluhan ang buong bayan at dumagsa sa dulaan, na nagsisigaw nang mga dalawang oras na dakila ang Diana ng mga taga-Efeso, hanggang sa patahimikin ng kalihim-bayan ang karamihan at buwagin ang kapulungan."
      da: "Paulus kom gennem højlandet til Efesos, residens for prokonsulen i Asien. Der fandt han omkring tolv disciple, som kun kendte Johannes' dåb; døbt i den Herre Jesu navn modtog de Helligånden. I tre måneder talte han frimodigt i synagogen; da nogle forhærdede sig og talte ilde om Vejen, trak han sig tilbage med disciplene og holdt daglig samtaler i Tyrannus' skole, og det varede i to år, så alle, der boede i Asien, hørte ordet. Gud gjorde usædvanlige undere ved Paulus, og mange, der havde drevet trolddom, brændte deres bøger, der var halvtredstusind sølvpenge værd. Så ophidsede Demetrius, en sølvsmed, der lavede Artemistempler af sølv, håndværkerne: Paulus' lære truede deres erhverv og gudindens tempel. Hele byen kom i forvirring og stormede ind i teatret, hvor de i omkring to timer råbte, at efesiernes Artemis var stor, indtil byskriveren fik mængden beroliget og opløste forsamlingen."
      sr: "Павле је прошао горње земље и дошао у Ефес, седиште намесника Азије. Тамо је нашао дванаестак ученика који су знали само Јованово крштење; крштени у име Господа Исуса, примили су Духа Светога. Три месеца је слободно говорио у синагоги; кад су неки отврднули и хулили на Пут, одступио је с ученицима и расправљао сваки дан у школи Тирановој, и то је трајало две године, тако да су сви који су живели у Азији чули реч. Бог је чинио необична чудеса преко Павла, и многи који су се бавили врачањем спалили су своје књиге, вредне педесет хиљада сребрњака. Тада је Димитрије, сребрар који је правио сребрне храмиће Дијани, подигао занатлије: Павлова наука угрожавала је њихов занат и храм богиње. Цео град испунио се метежом и јурнуо у позориште, вичући око два сата да је велика Дијана Ефеска, док градски писар није утишао светину и распустио збор."
      hu: "Pál a felső vidékeken át Efezusba érkezett, Ázsia prokonzuljának székhelyére. Ott mintegy tizenkét tanítványra talált, akik csak János keresztségét ismerték; amikor megkeresztelkedtek az Úr Jézus nevében, megkapták a Szentlelket. Három hónapig bátran beszélt a zsinagógában; amikor némelyek megkeményedtek, és rosszat mondtak az Útról, a tanítványokkal együtt elvonult, és mindennap Türánnusz iskolájában vitatkozott, és ez két évig tartott, úgyhogy mindazok, akik Ázsiában laktak, hallották az igét. Isten rendkívüli csodákat tett Pál által, és sokan, akik varázslással foglalkoztak, elégették könyveiket, amelyek ötvenezer ezüstpénzt értek. Ekkor Démétriusz, egy ötvös, aki Diána ezüst templomocskáit készítette, fellázította a mesterembereket: Pál tanítása veszélyeztette mesterségüket és az istennő templomát. Az egész város megtelt zűrzavarral, és a színházba tódult, mintegy két órán át kiáltozva, hogy nagy az efezusiak Diánája, míg a városi jegyző le nem csendesítette a sokaságot, és fel nem oszlatta a gyűlést."
      fi: "Paavali tuli ylämaakuntien kautta Efesokseen, Aasian käskynhaltijan asuinkaupunkiin. Siellä hän tapasi noin kaksitoista opetuslasta, jotka tunsivat vain Johanneksen kasteen; kun heidät kastettiin Herran Jeesuksen nimeen, he saivat Pyhän Hengen. Kolmen kuukauden ajan hän puhui rohkeasti synagogassa; kun jotkut paaduttivat itsensä ja puhuivat pahaa Tiestä, hän vetäytyi opetuslasten kanssa pois ja keskusteli joka päivä Tyrannoksen koulussa, ja tätä kesti kaksi vuotta, niin että kaikki Aasian asukkaat kuulivat sanan. Jumala teki Paavalin kautta tavattomia ihmeitä, ja monet, jotka olivat harjoittaneet taikuutta, polttivat kirjansa, joiden arvo oli viisikymmentä tuhatta hopearahaa. Sitten hopeaseppä Demetrios, joka valmisti hopeisia Artemiin temppeleitä, yllytti käsityöläiset: Paavalin opetus uhkasi heidän elinkeinoaan ja jumalattaren temppeliä. Koko kaupunki joutui sekasortoon ja ryntäsi teatteriin huutaen noin kaksi tuntia, että efesolaisten Artemis on suuri, kunnes kaupungin kansleri rauhoitti väkijoukon ja hajotti kokouksen."
      vi: "Phao-lô đi qua những miền trên mà đến Ê-phê-sô, nơi ở của quan trấn thủ xứ A-si. Tại đó ông gặp chừng mười hai môn đồ chỉ biết phép báp-tem của Giăng; khi chịu phép báp-tem nhân danh Đức Chúa Giê-su, họ nhận lãnh Đức Thánh Linh. Trong ba tháng ông giảng dạn dĩ trong nhà hội; khi có mấy người cứng lòng và gièm chê Đạo, ông rút đi cùng các môn đồ và biện luận hằng ngày trong trường học Ti-ra-nu, và việc đó kéo dài hai năm, đến nỗi mọi người ở trong cõi A-si đều nghe đạo. Đức Chúa Trời dùng tay Phao-lô làm những phép lạ khác thường, và nhiều người trước theo nghề phù phép đem sách vở mình đốt đi, trị giá năm muôn đồng bạc. Rồi Đê-mê-triu, một thợ bạc làm khám bằng bạc cho nữ thần Đi-anh, xúi giục các thợ: lời dạy của Phao-lô đe dọa nghề của họ và đền thờ của nữ thần. Cả thành đầy sự rối loạn và đổ xô vào rạp hát, la hét chừng hai giờ rằng lớn thay là nữ thần Đi-anh của người Ê-phê-sô, cho đến khi người thơ ký thành phố dẹp yên đoàn dân và giải tán cuộc nhóm họp."
      ro: "Pavel a venit prin părțile de sus la Efes, reședința proconsulului Asiei. Acolo a găsit vreo doisprezece ucenici care cunoșteau doar botezul lui Ioan; botezați în numele Domnului Isus, au primit Duhul Sfânt. Trei luni a vorbit cu îndrăzneală în sinagogă; când unii s-au împietrit și vorbeau de rău Calea, s-a retras cu ucenicii și discuta zilnic în școala lui Tiran, iar aceasta a ținut doi ani, așa încât toți cei ce locuiau în Asia au auzit cuvântul. Dumnezeu făcea minuni neobișnuite prin Pavel, iar mulți dintre cei ce practicaseră vrăjitoria și-au ars cărțile, în valoare de cincizeci de mii de arginți. Atunci Dimitrie, un argintar care făcea temple mici de argint ale Artemidei, i-a răsculat pe meșteșugari: învățătura lui Pavel le amenința meseria și templul zeiței. Toată cetatea s-a umplut de tulburare și a năvălit în teatru, strigând vreme de vreo două ceasuri că mare este Artemida efesenilor, până când logofătul cetății a potolit mulțimea și a dat drumul adunării."
      bg: "Павел мина през горните области и дойде в Ефес, седалището на проконсула на Азия. Там намери около дванадесет ученици, които знаеха само Йоановото кръщение; кръстени в името на Господа Исуса, те приеха Светия Дух. Три месеца той говореше смело в синагогата; когато някои се ожесточиха и злословеха Пътя, той се оттегли с учениците и разискваше всеки ден в училището на Тиран, и това продължи две години, така че всички, които живееха в Азия, чуха словото. Бог вършеше необикновени чудеса чрез Павел и мнозина, които бяха практикували магия, изгориха книгите си на стойност петдесет хиляди сребърника. Тогава Димитър, среброделец, който правеше сребърни храмчета на Артемида, вдигна занаятчиите: учението на Павел заплашваше занаята им и храма на богинята. Целият град се изпълни със смут и се втурна в театъра, като около два часа викаше, че велика е Артемида Ефеска, докато градският писар не успокои тълпата и не разпусна събранието."
  - place: a49e1d0
    ref: Acts.20.1-Acts.20.6
    by: untold
    year: "AD 57"
    note:
      en: "Through Macedonia to Greece for three months, and back; after the days of unleavened bread they sail from Philippi."
      ru: "Через Македонию в Грецию на три месяца и обратно; после дней опресночных отплывают из Филипп."
      uk: "Через Македонію до Еллади на три місяці й назад; після днів опрісноків вони відпливають з Філіпп."
      es: "Por Macedonia hasta Grecia, tres meses, y de regreso; pasados los días de los panes sin levadura, zarpan de Filipos."
      pt: "Pela Macedônia até a Grécia por três meses, e de volta; depois dos dias dos pães ázimos, navegam de Filipos."
      de: "Durch Mazedonien nach Griechenland für drei Monate und zurück; nach den Tagen der ungesäuerten Brote segeln sie von Philippi ab."
      fr: "Par la Macédoine jusqu’en Grèce pour trois mois, et retour ; après les jours des pains sans levain, ils s’embarquent à Philippes."
      pl: "Przez Macedonię do Grecji na trzy miesiące i z powrotem; po dniach przaśników odpływają z Filippi."
      it: "Attraverso la Macedonia fino in Grecia per tre mesi, e ritorno; dopo i giorni degli azzimi salpano da Filippi."
      nl: "Door Macedonië naar Griekenland voor drie maanden, en terug; na de dagen van de ongezuurde broden zeilen zij vanuit Filippi."
      cs: "Přes Makedonii do Řecka na tři měsíce a zpět; po dnech nekvašených chlebů vyplouvají z Filip."
      sv: "Genom Makedonien till Grekland i tre månader, och tillbaka; efter det osyrade brödets dagar seglar de från Filippi."
      nb: "Gjennom Makedonia til Hellas i tre måneder, og tilbake; etter de usyrede brøds dager seiler de fra Filippi."
      tl: "Dumaan sa Macedonia patungong Grecia, tatlong buwan doon, at pabalik; pagkatapos ng mga araw ng tinapay na walang lebadura, naglayag sila mula sa Filipos."
      da: "Gennem Makedonien til Grækenland i tre måneder og tilbage; efter de usyrede brøds dage sejler de fra Filippi."
      sr: "Кроз Македонију у Грчку на три месеца, и натраг; после дана бесквасних хлебова отпловљавају из Филипа."
      hu: "Macedónián át Görögországba három hónapra, majd vissza; a kovásztalan kenyerek napjai után Filippiből hajóznak el."
      fi: "Makedonian kautta Kreikkaan kolmeksi kuukaudeksi ja takaisin; happamattoman leivän päivien jälkeen he purjehtivat Filippistä."
      vi: "Qua Ma-xê-đoan đến Hy Lạp ba tháng, rồi trở lại; sau những ngày lễ Bánh không men, họ xuống tàu từ Phi-líp."
      ro: "Prin Macedonia până în Grecia, pentru trei luni, și înapoi; după zilele Azimelor pornesc pe mare din Filipi."
      bg: "През Македония в Гърция за три месеца и обратно; след дните на безквасните хлябове те отплават от Филипи."
    story:
      en: "When the uproar was over, Paul took leave of the disciples and went to Macedonia, encouraging the believers there, and came to Greece, where he stayed three months. As he was about to sail for Syria, the Jews plotted against him, and he decided to return through Macedonia. His companions — Sopater of Berea, Aristarchus and Secundus of Thessalonica, Gaius of Derbe, Timothy, and Tychicus and Trophimus of Asia — went ahead and waited at Troas. After the days of unleavened bread Paul and those with him sailed from Philippi."
      ru: "Когда мятеж прекратился, Павел простился с учениками и пошёл в Македонию, ободряя тамошних верующих, и пришёл в Грецию, где пробыл три месяца. Когда он собирался отплыть в Сирию, иудеи составили против него заговор, и он решил вернуться через Македонию. Его спутники — Сосипатр из Верии, Аристарх и Секунд из Фессалоники, Гаий из Дервии, Тимофей, а также Тихик и Трофим из Асии — пошли вперёд и ждали в Троаде. После дней опресночных Павел и бывшие с ним отплыли из Филипп."
      uk: "Коли заколот ущух, Павло попрощався з учнями й пішов до Македонії, підбадьорюючи тамтешніх віруючих, і прийшов до Еллади, де пробув три місяці. Коли він збирався відплисти до Сирії, юдеї змовилися проти нього, і він вирішив повернутися через Македонію. Його супутники — Сосипатр з Верії, Аристарх і Секунд із Солуня, Гай з Дервії, Тимофій, а також Тихик і Трофим з Азії — пішли вперед і чекали в Троаді. Після днів опрісноків Павло і ті, хто був з ним, відпливли з Філіпп."
      es: "Cuando cesó el alboroto, Pablo se despidió de los discípulos y partió para Macedonia, exhortando a los creyentes de allí, y llegó a Grecia, donde se quedó tres meses. Cuando iba a embarcarse para Siria, los judíos conspiraron contra él, y decidió volver por Macedonia. Sus compañeros —Sópater de Berea, Aristarco y Segundo de Tesalónica, Gayo de Derbe, Timoteo, y Tíquico y Trófimo de Asia— se adelantaron y esperaron en Troas. Pasados los días de los panes sin levadura, Pablo y los que iban con él zarparon de Filipos."
      pt: "Quando o alvoroço cessou, Paulo despediu-se dos discípulos e partiu para a Macedônia, encorajando os crentes dali, e chegou à Grécia, onde ficou três meses. Quando estava para embarcar para a Síria, os judeus tramaram contra ele, e ele decidiu voltar pela Macedônia. Os seus companheiros — Sópatro de Bereia, Aristarco e Segundo de Tessalônica, Gaio de Derbe, Timóteo, e Tíquico e Trófimo da Ásia — foram na frente e esperaram em Trôade. Depois dos dias dos pães ázimos, Paulo e os que estavam com ele navegaram de Filipos."
      de: "Als der Aufruhr vorüber war, nahm Paulus Abschied von den Jüngern und zog nach Mazedonien, ermutigte die Gläubigen dort und kam nach Griechenland, wo er drei Monate blieb. Als er gerade nach Syrien segeln wollte, stellten ihm die Juden nach, und er beschloss, durch Mazedonien zurückzukehren. Seine Gefährten – Sopater aus Beröa, Aristarch und Secundus aus Thessalonich, Gaius aus Derbe, Timotheus sowie Tychikus und Trophimus aus Asien – zogen voraus und warteten in Troas. Nach den Tagen der ungesäuerten Brote segelten Paulus und seine Begleiter von Philippi ab."
      fr: "Quand le tumulte eut cessé, Paul prit congé des disciples et partit pour la Macédoine, exhortant les croyants de cette contrée, puis se rendit en Grèce, où il resta trois mois. Au moment où il allait s’embarquer pour la Syrie, les Juifs complotèrent contre lui, et il décida de revenir par la Macédoine. Ses compagnons — Sopater de Bérée, Aristarque et Second de Thessalonique, Gaïus de Derbe, Timothée, ainsi que Tychique et Trophime d’Asie — prirent les devants et attendirent à Troas. Après les jours des pains sans levain, Paul et ceux qui étaient avec lui s’embarquèrent à Philippes."
      pl: "Gdy wrzawa ucichła, Paweł pożegnał się z uczniami i udał się do Macedonii, umacniając tamtejszych wierzących, i przybył do Grecji, gdzie pozostał trzy miesiące. Gdy miał odpłynąć do Syrii, Żydzi uknuli przeciw niemu spisek, więc postanowił wrócić przez Macedonię. Jego towarzysze — Sopater z Berei, Arystarch i Sekundus z Tesaloniki, Gajusz z Derbe, Tymoteusz oraz Tychik i Trofim z Azji — poszli przodem i czekali w Troadzie. Po dniach Przaśników Paweł i ci, którzy z nim byli, odpłynęli z Filippi."
      it: "Cessato il tumulto, Paolo prese congedo dai discepoli e partì per la Macedonia, esortando i credenti di quei luoghi, e giunse in Grecia, dove rimase tre mesi. Mentre stava per salpare per la Siria, i Giudei tramarono contro di lui, ed egli decise di tornare attraverso la Macedonia. I suoi compagni — Sopatro di Berea, Aristarco e Secondo di Tessalonica, Gaio di Derbe, Timoteo, e Tichico e Trofimo d’Asia — andarono avanti e attesero a Troade. Dopo i giorni degli azzimi Paolo e quelli che erano con lui salparono da Filippi."
      nl: "Toen het oproer voorbij was, nam Paulus afscheid van de discipelen en ging naar Macedonië, waar hij de gelovigen bemoedigde, en kwam in Griekenland, waar hij drie maanden bleef. Toen hij op het punt stond naar Syrië te varen, smeedden de Joden een aanslag tegen hem, en hij besloot door Macedonië terug te keren. Zijn metgezellen – Sopater van Berea, Aristarchus en Secundus van Tessalonica, Gajus van Derbe, Timoteüs, en Tychikus en Trofimus uit Asia – gingen vooruit en wachtten te Troas. Na de dagen van de ongezuurde broden voeren Paulus en zij die bij hem waren vanuit Filippi af."
      cs: "Když bouře utichla, Pavel se rozloučil s učedníky a odešel do Makedonie, povzbuzoval tamější věřící a přišel do Řecka, kde zůstal tři měsíce. Když se chystal odplout do Sýrie, Židé proti němu osnovali spiknutí, a tak se rozhodl vrátit přes Makedonii. Jeho průvodci — Sopatros z Beroie, Aristarchos a Sekundos z Tesaloniky, Gaius z Derbe, Timoteus a Tychikos a Trofimos z Asie — šli napřed a čekali v Troadě. Po dnech nekvašených chlebů Pavel a ti, kdo byli s ním, vypluli z Filip."
      sv: "När oron hade lagt sig tog Paulus avsked av lärjungarna och drog till Makedonien, där han uppmuntrade de troende, och kom till Grekland, där han stannade tre månader. När han skulle segla till Syrien smidde judarna ett anslag mot honom, och han beslöt att vända tillbaka genom Makedonien. Hans följeslagare – Sopatros från Beroia, Aristarchos och Secundus från Tessalonike, Gaius från Derbe, Timoteus samt Tykikos och Trofimos från Asien – gick i förväg och väntade i Troas. Efter det osyrade brödets dagar seglade Paulus och de som var med honom från Filippi."
      nb: "Da uroen var over, tok Paulus farvel med disiplene og dro til Makedonia, der han oppmuntret de troende, og kom til Hellas, der han ble i tre måneder. Da han skulle seile til Syria, la jødene planer mot ham, og han bestemte seg for å vende tilbake gjennom Makedonia. Følgesvennene hans – Sopater fra Berøa, Aristarkos og Sekundus fra Tessalonika, Gaius fra Derbe, Timoteus, og Tykikos og Trofimos fra Asia – dro i forveien og ventet i Troas. Etter de usyrede brøds dager seilte Paulus og de som var med ham, fra Filippi."
      tl: "Nang tumigil ang kaguluhan, nagpaalam si Pablo sa mga alagad at nagtungo sa Macedonia, na inaaralan ang mga mananampalataya roon, at dumating sa Grecia, kung saan siya tumira nang tatlong buwan. Nang siya'y lalayag na sa Siria, binakayan siya ng mga Judio, at pinasiyahan niyang bumalik sa pamamagitan ng Macedonia. Ang kaniyang mga kasama, sina Sopatro na taga-Berea, Aristarco at Segundo na taga-Tesalonica, Gayo na taga-Derbe, Timoteo, at Tiquico at Trofimo na taga-Asia, ay nauna at naghintay sa Troas. Pagkaraan ng mga araw ng tinapay na walang lebadura, naglayag si Pablo at ang kaniyang mga kasama mula sa Filipos."
      da: "Da oprøret var forbi, tog Paulus afsked med disciplene og drog til Makedonien, hvor han opmuntrede de troende, og kom til Grækenland, hvor han blev tre måneder. Netop som han skulle sejle til Syrien, smedede jøderne anslag imod ham, og han besluttede at vende tilbage gennem Makedonien. Hans rejsefæller – Sopater fra Berøa, Aristarkus og Sekundus fra Thessalonika, Gajus fra Derbe, Timotheus samt Tykikus og Trofimus fra Asien – drog i forvejen og ventede i Troas. Efter de usyrede brøds dage sejlede Paulus og de, der var med ham, fra Filippi."
      sr: "Кад се буна стишала, Павле се опростио с ученицима и отишао у Македонију, храбрећи тамошње вернике, и дошао у Грчку, где је остао три месеца. Кад је требало да отплови у Сирију, Јевреји су сковали заверу против њега, и он је одлучио да се врати преко Македоније. Његови сапутници — Сосипатар из Верије, Аристарх и Секунд из Солуна, Гај из Дерве, Тимотије, и Тихик и Трофим из Азије — отишли су напред и чекали у Троади. После дана бесквасних хлебова Павле и они који су били с њим отпловили су из Филипа."
      hu: "Amikor a zavargás elült, Pál elbúcsúzott a tanítványoktól, és Macedóniába ment, bátorítva az ottani hívőket, majd Görögországba érkezett, ahol három hónapig maradt. Amikor Szíriába készült hajózni, a zsidók összeesküdtek ellene, és elhatározta, hogy Macedónián át tér vissza. Társai – a bereai Szószipater, a thesszalonikai Arisztarkhosz és Szekundusz, a derbei Gájusz, Timóteus, valamint az ázsiai Tükhikosz és Trofimusz – előrementek, és Troászban vártak. A kovásztalan kenyerek napjai után Pál és akik vele voltak, elhajóztak Filippiből."
      fi: "Kun meteli oli asettunut, Paavali sanoi opetuslapsille hyvästit ja lähti Makedoniaan rohkaisten siellä uskovia ja tuli Kreikkaan, jossa hän viipyi kolme kuukautta. Kun hän oli lähdössä purjehtimaan Syyriaan, juutalaiset tekivät häntä vastaan salahankkeen, ja hän päätti palata Makedonian kautta. Hänen seuralaisensa – beroialainen Sopatros, tessalonikalaiset Aristarkos ja Sekundus, derbeläinen Gaius, Timoteus sekä aasialaiset Tykikos ja Trofimos – menivät edeltä ja odottivat Troaksessa. Happamattoman leivän päivien jälkeen Paavali ja hänen seurassaan olevat purjehtivat Filippistä."
      vi: "Khi sự rối loạn đã yên, Phao-lô từ giã các môn đồ mà đi đến xứ Ma-xê-đoan, khuyên bảo các tín đồ ở đó, rồi đến Hy Lạp, ở lại đó ba tháng. Lúc sắp xuống thuyền sang xứ Sy-ri, người Giu-đa lập kế hại ông, nên ông quyết định trở về qua xứ Ma-xê-đoan. Các bạn đồng hành của ông, là Sô-ba-tê người Bê-rê, A-ri-tạc và Xê-cun-đu người Tê-sa-lô-ni-ca, Gai-út người Đẹt-bơ, Ti-mô-thê, cùng Ti-chi-cơ và Trô-phim người cõi A-si, đi trước và đợi tại Trô-ách. Sau những ngày ăn bánh không men, Phao-lô và những người đi với ông xuống thuyền tại Phi-líp."
      ro: "După ce a încetat tulburarea, Pavel și-a luat rămas bun de la ucenici și a plecat în Macedonia, îmbărbătându-i pe credincioșii de acolo, și a venit în Grecia, unde a stat trei luni. Când era gata să plece pe mare spre Siria, iudeii au uneltit împotriva lui, iar el a hotărât să se întoarcă prin Macedonia. Însoțitorii lui – Sopatru din Berea, Aristarh și Secund din Tesalonic, Gaiu din Derba, Timotei, și Tihic și Trofim din Asia – au mers înainte și i-au așteptat la Troa. După zilele Azimelor, Pavel și cei cu el au plecat pe mare din Filipi."
      bg: "Когато размирицата утихна, Павел се сбогува с учениците и отиде в Македония, като насърчаваше вярващите там, и дойде в Гърция, където остана три месеца. Когато се готвеше да отплава за Сирия, юдеите устроиха заговор срещу него и той реши да се върне през Македония. Спътниците му — Сосипатър от Верия, Аристарх и Секунд от Солун, Гай от Дервия, Тимотей и Тихик и Трофим от Азия — отидоха напред и чакаха в Троада. След дните на безквасните хлябове Павел и онези, които бяха с него, отплаваха от Филипи."
  - place: a91c509
    ref: Acts.20.6-Acts.20.12
    by: sea
    via:
