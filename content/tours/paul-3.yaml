intro:
  en:
    - "Acts 18:23–21:17 tells of Paul's third journey. He set out from Antioch again, went through Galatia and Phrygia strengthening the disciples, and came to Ephesus, where he taught for some three years until the riot of the silversmiths. From there he went through Macedonia to Greece, stayed three months, and, when the Jews plotted against him as he was about to sail for Syria, went back through Macedonia. After the days of unleavened bread he sailed from Philippi, gathered his companions at Troas, and went down the coast of Asia, past Ephesus to Miletus, where he took leave of the Ephesian elders, then by Rhodes and Patara to Tyre, Ptolemais and Caesarea, and up to Jerusalem, wishing to be there for Pentecost."
    - "Acts gives no year, but its own durations bind the journey: three months in the synagogue and two years in the school of Tyrannus at Ephesus, which Paul later recalls as three years, then three months in Greece. The journey comes after Paul's stay at Corinth under Gallio, proconsul in 51–52, and before his two years in custody at Caesarea under Felix and Festus; the Catholic Encyclopedia of 1911 dated it 53–57, and the map shows it at AD 54, and the return voyage at AD 57."
    - "On the voyage home the text counts the days: five from Philippi to Troas, seven days there, and then a day's sail at each step from Mitylene to Miletus and from Cos to Rhodes. Those days are given with the stops as the text gives them; the other travel times are estimates. The way from Antioch to Ephesus through Galatia and Phrygia, and from Ephesus through Macedonia and Greece, is not traced."
  ru:
    - "О третьем путешествии Павла рассказывает Деян 18:23–21:17. Он снова вышел из Антиохии, прошёл Галатию и Фригию, утверждая учеников, и пришёл в Ефес, где учил около трёх лет, до мятежа серебряников. Оттуда он прошёл через Македонию в Грецию, пробыл там три месяца и, когда иудеи составили против него заговор, а он собирался отплыть в Сирию, вернулся через Македонию. После дней опресночных он отплыл из Филипп, собрал своих спутников в Троаде и спустился вдоль побережья Асии, мимо Ефеса, в Милит, где простился с ефесскими пресвитерами, затем через Родос и Патару в Тир, Птолемаиду и Кесарию и поднялся в Иерусалим, желая быть там к Пятидесятнице."
    - "Деяния не называют года, но их собственные сроки ограничивают путешествие: три месяца в синагоге и два года в училище Тиранна в Ефесе, которые Павел позже вспоминает как три года, затем три месяца в Греции. Путешествие приходится на время после пребывания Павла в Коринфе при Галлионе, проконсуле в 51–52 гг., и до его двух лет под стражей в Кесарии при Феликсе и Фесте; Католическая энциклопедия 1911 года датировала его 53–57 гг., и на карте оно показано под 54 г. н. э., а обратное плавание — под 57 г. н. э."
    - "На обратном пути текст считает дни: пять из Филипп в Троаду, семь дней там, а затем по дню плавания на каждом переходе от Митилины до Милита и от Коса до Родоса. Эти дни указаны у остановок так, как их даёт текст; остальное время в пути — оценки. Путь из Антиохии в Ефес через Галатию и Фригию и из Ефеса через Македонию и Грецию на карте не прочерчен."
  uk:
    - "Про третю подорож Павла розповідає Дії 18:23–21:17. Він знову вирушив з Антіохії, пройшов Галатію та Фригію, зміцнюючи учнів, і прийшов до Ефеса, де навчав близько трьох років, аж до заколоту срібних майстрів. Звідти він пройшов через Македонію до Еллади, пробув там три місяці і, коли юдеї змовилися проти нього, а він збирався відплисти до Сирії, повернувся через Македонію. Після днів опрісноків він відплив з Філіпп, зібрав своїх супутників у Троаді й спустився вздовж узбережжя Азії, повз Ефес, до Мілета, де попрощався зі старійшинами Ефеса, далі через Родос і Патару до Тіру, Птолемаїди й Кесарії, і піднявся до Єрусалима, бажаючи бути там на П’ятдесятницю."
    - "Дії не називають року, але їхні власні терміни обмежують подорож: три місяці в синагозі й два роки в школі Тирана в Ефесі, які Павло пізніше згадує як три роки, потім три місяці в Елладі. Подорож припадає на час після перебування Павла в Коринті за Галліона, проконсула в 51–52 рр., і до двох років його ув’язнення в Кесарії за Фелікса й Феста; Католицька енциклопедія 1911 року датувала її 53–57 рр., і на мапі її показано під 54 р. н. е., а зворотне плавання — під 57 р. н. е."
    - "Дорогою додому текст лічить дні: п’ять з Філіпп до Троади, сім днів там, а далі по дню плавання на кожному переході від Мітилени до Мілета і від Коса до Родоса. Ці дні подано біля зупинок так, як їх подає текст; решта часу в дорозі — оцінки. Шлях з Антіохії до Ефеса через Галатію та Фригію і з Ефеса через Македонію та Елладу на мапі не прокреслено."
  es:
    - "Hechos 18:23–21:17 narra el tercer viaje de Pablo. Partió de nuevo de Antioquía, recorrió Galacia y Frigia confirmando a los discípulos y llegó a Éfeso, donde enseñó unos tres años, hasta el tumulto de los plateros. De allí pasó por Macedonia a Grecia, se quedó tres meses y, como los judíos conspiraron contra él cuando iba a embarcarse para Siria, volvió por Macedonia. Pasados los días de los panes sin levadura, zarpó de Filipos, reunió a sus compañeros en Troas y bajó por la costa de Asia, pasando de largo Éfeso, hasta Mileto, donde se despidió de los ancianos de Éfeso; luego, por Rodas y Pátara, llegó a Tiro, Tolemaida y Cesarea, y subió a Jerusalén, deseando estar allí para Pentecostés."
    - "Los Hechos no dan ningún año, pero sus propias duraciones acotan el viaje: tres meses en la sinagoga y dos años en la escuela de Tirano en Éfeso, que Pablo recuerda después como tres años, y luego tres meses en Grecia. El viaje es posterior a la estancia de Pablo en Corinto bajo Galión, procónsul en 51–52, y anterior a sus dos años de custodia en Cesarea bajo Félix y Festo; la Enciclopedia Católica de 1911 lo fechaba en 53–57, y el mapa lo muestra en el 54 d.C., y el viaje de regreso en el 57 d.C."
    - "En el viaje de regreso el texto cuenta los días: cinco de Filipos a Troas, siete días allí, y luego un día de navegación en cada etapa de Mitilene a Mileto y de Cos a Rodas. Esos días se indican en las paradas tal como los da el texto; los demás tiempos de viaje son estimaciones. El camino de Antioquía a Éfeso por Galacia y Frigia, y de Éfeso por Macedonia y Grecia, no se traza."
  pt:
    - "Atos 18:23–21:17 narra a terceira viagem de Paulo. Ele partiu de novo de Antioquia, percorreu a Galácia e a Frígia fortalecendo os discípulos e chegou a Éfeso, onde ensinou cerca de três anos, até o tumulto dos ourives. Dali passou pela Macedônia até a Grécia, ficou três meses e, como os judeus tramaram contra ele quando estava para embarcar para a Síria, voltou pela Macedônia. Depois dos dias dos pães ázimos, navegou de Filipos, reuniu os seus companheiros em Trôade e desceu pela costa da Ásia, passando ao largo de Éfeso, até Mileto, onde se despediu dos presbíteros de Éfeso; depois, por Rodes e Pátara, chegou a Tiro, Ptolemaida e Cesareia, e subiu a Jerusalém, desejando estar ali para o Pentecostes."
    - "Atos não indica nenhum ano, mas as suas próprias durações delimitam a viagem: três meses na sinagoga e dois anos na escola de Tirano em Éfeso, que Paulo recorda mais tarde como três anos, e depois três meses na Grécia. A viagem é posterior à estadia de Paulo em Corinto sob Gálio, procônsul em 51–52, e anterior aos seus dois anos de custódia em Cesareia sob Félix e Festo; a Enciclopédia Católica de 1911 datava-a de 53–57, e o mapa a mostra em 54 d.C., e a viagem de volta em 57 d.C."
    - "Na viagem de volta o texto conta os dias: cinco de Filipos a Trôade, sete dias ali, e depois um dia de navegação em cada etapa, de Mitilene a Mileto e de Cós a Rodes. Esses dias são indicados nas paradas tal como o texto os dá; os demais tempos de viagem são estimativas. O caminho de Antioquia a Éfeso pela Galácia e pela Frígia, e de Éfeso pela Macedônia e pela Grécia, não é traçado."
  de:
    - "Apg 18:23–21:17 erzählt von der dritten Reise des Paulus. Er brach wieder von Antiochia auf, zog durch Galatien und Phrygien und stärkte die Jünger und kam nach Ephesus, wo er etwa drei Jahre lehrte, bis zum Aufruhr der Silberschmiede. Von dort zog er durch Mazedonien nach Griechenland, blieb drei Monate und kehrte, als ihm die Juden nachstellten, da er gerade nach Syrien segeln wollte, durch Mazedonien zurück. Nach den Tagen der ungesäuerten Brote segelte er von Philippi ab, sammelte seine Gefährten in Troas und fuhr die Küste Asiens hinab, an Ephesus vorbei nach Milet, wo er von den Ältesten von Ephesus Abschied nahm, dann über Rhodos und Patara nach Tyrus, Ptolemais und Caesarea und hinauf nach Jerusalem, wo er zu Pfingsten sein wollte."
    - "Die Apostelgeschichte nennt kein Jahr, doch ihre eigenen Zeitangaben grenzen die Reise ein: drei Monate in der Synagoge und zwei Jahre in der Schule des Tyrannus in Ephesus, an die Paulus sich später als drei Jahre erinnert, dann drei Monate in Griechenland. Die Reise liegt nach dem Aufenthalt des Paulus in Korinth unter Gallio, Prokonsul 51–52, und vor seinen zwei Jahren in Haft in Caesarea unter Felix und Festus; die Catholic Encyclopedia von 1911 datierte sie auf 53–57, und die Karte zeigt sie im Jahr 54 n. Chr. und die Rückfahrt im Jahr 57 n. Chr."
    - "Auf der Heimfahrt zählt der Text die Tage: fünf von Philippi nach Troas, sieben Tage dort und dann bei jedem Abschnitt von Mitylene bis Milet und von Kos bis Rhodos eine Tagesfahrt. Diese Tage werden bei den Stationen so angegeben, wie der Text sie nennt; die übrigen Reisezeiten sind Schätzungen. Der Weg von Antiochia nach Ephesus durch Galatien und Phrygien und von Ephesus durch Mazedonien und Griechenland wird nicht nachgezeichnet."
  fr:
    - "Ac 18:23–21:17 raconte le troisième voyage de Paul. Il repartit d’Antioche, parcourut la Galatie et la Phrygie en fortifiant les disciples et arriva à Éphèse, où il enseigna quelque trois ans, jusqu’à l’émeute des orfèvres. De là, il passa par la Macédoine jusqu’en Grèce, y resta trois mois et, les Juifs ayant comploté contre lui au moment où il allait s’embarquer pour la Syrie, revint par la Macédoine. Après les jours des pains sans levain, il s’embarqua à Philippes, rassembla ses compagnons à Troas et descendit la côte d’Asie, au-delà d’Éphèse jusqu’à Milet, où il fit ses adieux aux anciens d’Éphèse, puis par Rhodes et Patara jusqu’à Tyr, Ptolémaïs et Césarée, et monta à Jérusalem, désirant y être pour la Pentecôte."
    - "Les Actes ne donnent aucune année, mais leurs propres durées encadrent le voyage : trois mois dans la synagogue et deux ans dans l’école de Tyrannus à Éphèse, que Paul évoque plus tard comme trois ans, puis trois mois en Grèce. Le voyage vient après le séjour de Paul à Corinthe sous Gallion, proconsul en 51–52, et avant ses deux ans de détention à Césarée sous Félix et Festus ; la Catholic Encyclopedia de 1911 le datait de 53–57, et la carte le place en 54 apr. J.-C., et le voyage de retour en 57 apr. J.-C."
    - "Sur le voyage de retour, le texte compte les jours : cinq de Philippes à Troas, sept jours sur place, puis une journée de navigation à chaque étape de Mytilène à Milet et de Cos à Rhodes. Ces jours sont indiqués aux étapes tels que le texte les donne ; les autres durées de trajet sont des estimations. Le chemin d’Antioche à Éphèse par la Galatie et la Phrygie, et d’Éphèse par la Macédoine et la Grèce, n’est pas tracé."
  pl:
    - "Dzieje Apostolskie (Dz 18:23–21:17) opowiadają o trzeciej podróży Pawła. Wyruszył znowu z Antiochii, przeszedł przez Galację i Frygię, umacniając uczniów, i przybył do Efezu, gdzie nauczał przez około trzy lata, aż do rozruchów złotników. Stamtąd udał się przez Macedonię do Grecji, pozostał tam trzy miesiące, a gdy Żydzi uknuli przeciw niemu spisek, kiedy miał odpłynąć do Syrii, wrócił przez Macedonię. Po dniach Przaśników odpłynął z Filippi, zebrał swoich towarzyszy w Troadzie i popłynął wzdłuż wybrzeża Azji, obok Efezu do Miletu, gdzie pożegnał się ze starszymi z Efezu, a następnie przez Rodos i Patara do Tyru, Ptolemaidy i Cezarei, i w górę do Jerozolimy, pragnąc być tam na Pięćdziesiątnicę."
    - "Dzieje nie podają roku, lecz ich własne okresy wyznaczają ramy podróży: trzy miesiące w synagodze i dwa lata w szkole Tyrannusa w Efezie, które Paweł wspomina później jako trzy lata, a potem trzy miesiące w Grecji. Podróż przypada po pobycie Pawła w Koryncie za Galliona, prokonsula w latach 51–52, a przed jego dwuletnim uwięzieniem w Cezarei za Feliksa i Festusa; Catholic Encyclopedia z 1911 roku datowała ją na lata 53–57, a mapa pokazuje ją w roku 54 n.e., a rejs powrotny w roku 57 n.e."
    - "Podczas rejsu powrotnego tekst liczy dni: pięć z Filippi do Troady, siedem dni tam, a potem po dniu żeglugi na każdym etapie od Mityleny do Miletu i od Kos do Rodos. Te dni są podane przy przystankach tak, jak podaje je tekst; pozostałe czasy przejazdu są szacunkami. Droga z Antiochii do Efezu przez Galację i Frygię oraz z Efezu przez Macedonię i Grecję nie jest wyrysowana."
  it:
    - "At 18:23–21:17 racconta il terzo viaggio di Paolo. Partì di nuovo da Antiochia, percorse la Galazia e la Frigia confermando i discepoli e giunse a Efeso, dove insegnò per circa tre anni fino al tumulto degli argentieri. Di là passò per la Macedonia fino in Grecia, vi rimase tre mesi e, poiché i Giudei tramarono contro di lui mentre stava per salpare per la Siria, tornò attraverso la Macedonia. Dopo i giorni degli azzimi salpò da Filippi, riunì i suoi compagni a Troade e discese la costa dell’Asia, oltre Efeso fino a Mileto, dove prese congedo dagli anziani di Efeso, poi per Rodi e Patara fino a Tiro, Tolemaide e Cesarea, e salì a Gerusalemme, desiderando esservi per la Pentecoste."
    - "Gli Atti non indicano alcun anno, ma le loro stesse durate delimitano il viaggio: tre mesi nella sinagoga e due anni nella scuola di Tiranno a Efeso, che Paolo più tardi ricorda come tre anni, poi tre mesi in Grecia. Il viaggio viene dopo il soggiorno di Paolo a Corinto sotto Gallione, proconsole nel 51–52, e prima dei suoi due anni di custodia a Cesarea sotto Felice e Festo; la Catholic Encyclopedia del 1911 lo datava al 53–57, e la mappa lo colloca nel 54 d.C., e il viaggio di ritorno nel 57 d.C."
    - "Nel viaggio di ritorno il testo conta i giorni: cinque da Filippi a Troade, sette giorni lì, e poi un giorno di navigazione a ogni tappa da Mitilene a Mileto e da Coo a Rodi. Questi giorni sono indicati per le tappe come li dà il testo; gli altri tempi di viaggio sono stime. Il cammino da Antiochia a Efeso attraverso la Galazia e la Frigia, e da Efeso attraverso la Macedonia e la Grecia, non è tracciato."
  nl:
    - "Hand 18:23–21:17 vertelt over de derde reis van Paulus. Hij vertrok opnieuw uit Antiochië, trok door Galatië en Frygië en versterkte de discipelen, en kwam te Efeze, waar hij zo'n drie jaar leerde, tot het oproer van de zilversmeden. Vandaar trok hij door Macedonië naar Griekenland, bleef drie maanden en keerde, toen de Joden een aanslag tegen hem smeedden terwijl hij op het punt stond naar Syrië te varen, door Macedonië terug. Na de dagen van de ongezuurde broden voer hij vanuit Filippi, verzamelde zijn metgezellen te Troas en voer langs de kust van Asia naar het zuiden, langs Efeze naar Milete, waar hij afscheid nam van de oudsten van Efeze, daarna via Rhodos en Patara naar Tyrus, Ptolemaïs en Caesarea, en op naar Jeruzalem, waar hij met Pinksteren wilde zijn."
    - "Handelingen noemt geen jaartal, maar de eigen tijdsaanduidingen ervan bakenen de reis af: drie maanden in de synagoge en twee jaar in de school van Tyrannus te Efeze, waaraan Paulus later terugdenkt als drie jaar, en daarna drie maanden in Griekenland. De reis valt na het verblijf van Paulus te Korinthe onder Gallio, proconsul in 51–52, en vóór zijn twee jaar gevangenschap te Caesarea onder Felix en Festus; de Catholic Encyclopedia van 1911 dateerde haar op 53–57, en de kaart toont haar in 54 n.Chr., en de terugreis in 57 n.Chr."
    - "Op de thuisreis telt de tekst de dagen: vijf van Filippi naar Troas, zeven dagen daar, en daarna bij elke etappe van Mitylene tot Milete en van Kos tot Rhodos een dag varen. Die dagen staan bij de haltes zoals de tekst ze geeft; de andere reistijden zijn schattingen. De weg van Antiochië naar Efeze door Galatië en Frygië, en van Efeze door Macedonië en Griekenland, wordt niet getekend."
  cs:
    - "Skutky apoštolů (Sk 18:23–21:17) vyprávějí o Pavlově třetí cestě. Vydal se znovu z Antiochie, prošel Galacií a Frygií, utvrzoval učedníky a přišel do Efezu, kde učil asi tři roky, až do vzpoury stříbrníků. Odtud šel přes Makedonii do Řecka, zůstal tam tři měsíce, a když proti němu Židé osnovali spiknutí právě ve chvíli, kdy chtěl odplout do Sýrie, vrátil se přes Makedonii. Po dnech nekvašených chlebů vyplul z Filip, shromáždil své průvodce v Troadě a plul podél pobřeží Asie, kolem Efezu do Milétu, kde se rozloučil s efezskými staršími, pak přes Rhodos a Patary do Týru, Ptolemaidy a Cesareje a nahoru do Jeruzaléma, protože tam chtěl být o letnicích."
    - "Skutky neuvádějí rok, ale jejich vlastní údaje o délce pobytů cestu ohraničují: tři měsíce v synagoze a dva roky ve škole Tyrannově v Efezu, které Pavel později připomíná jako tři roky, pak tři měsíce v Řecku. Cesta následuje po Pavlově pobytu v Korintu za Gallióna, prokonzula v letech 51–52, a předchází jeho dvěma letům ve vazbě v Cesareji za Felixe a Festa; Catholic Encyclopedia z roku 1911 ji datovala do let 53–57 a mapa ji ukazuje v roce 54 n. l. a zpáteční plavbu v roce 57 n. l."
    - "Na zpáteční plavbě text počítá dny: pět z Filip do Troady, sedm dní tam a pak po dni plavby na každém úseku od Mitylén po Milét a od Kósu po Rhodos. Tyto dny jsou uvedeny u zastávek tak, jak je udává text; ostatní doby cesty jsou odhady. Cesta z Antiochie do Efezu přes Galacii a Frygii a z Efezu přes Makedonii a Řecko není zakreslena."
  sv:
    - "Apg 18:23–21:17 berättar om Paulus’ tredje resa. Han bröt upp från Antiochia igen, drog genom Galatien och Frygien och styrkte lärjungarna och kom till Efesos, där han undervisade i omkring tre år, fram till silversmedernas upplopp. Därifrån drog han genom Makedonien till Grekland, stannade tre månader och vände, när judarna smidde ett anslag mot honom då han skulle segla till Syrien, tillbaka genom Makedonien. Efter det osyrade brödets dagar seglade han från Filippi, samlade sina följeslagare i Troas och for nedför Asiens kust, förbi Efesos till Miletos, där han tog avsked av de äldste från Efesos, sedan via Rhodos och Patara till Tyros, Ptolemais och Caesarea, och upp till Jerusalem, eftersom han ville vara där till pingsten."
    - "Apostlagärningarna anger inget år, men bokens egna tidsangivelser binder resan: tre månader i synagogan och två år i Tyrannos’ lärosal i Efesos, som Paulus senare minns som tre år, och sedan tre månader i Grekland. Resan kommer efter Paulus’ vistelse i Korinth under Gallio, prokonsul 51–52, och före hans två år i förvar i Caesarea under Felix och Festus; Catholic Encyclopedia från 1911 daterade den till 53–57, och kartan visar den år 54 e.Kr. och återresan år 57 e.Kr."
    - "På hemresan räknar texten dagarna: fem från Filippi till Troas, sju dagar där och sedan en dags segling för varje etapp från Mytilene till Miletos och från Kos till Rhodos. De dagarna anges vid stationerna så som texten anger dem; övriga restider är uppskattningar. Vägen från Antiochia till Efesos genom Galatien och Frygien, och från Efesos genom Makedonien och Grekland, är inte utritad."
  nb:
    - "Apg 18:23–21:17 forteller om Paulus' tredje reise. Han brøt opp fra Antiokia igjen, dro gjennom Galatia og Frygia og styrket disiplene, og kom til Efesos, der han underviste i omkring tre år, fram til sølvsmedenes opptøyer. Derfra dro han gjennom Makedonia til Hellas, ble der i tre måneder og vendte, da jødene la planer mot ham idet han skulle seile til Syria, tilbake gjennom Makedonia. Etter de usyrede brøds dager seilte han fra Filippi, samlet følgesvennene sine i Troas og dro nedover langs kysten av Asia, forbi Efesos til Milet, der han tok avskjed med de eldste fra Efesos, så om Rhodos og Patara til Tyros, Ptolemais og Cæsarea, og opp til Jerusalem, fordi han ønsket å være der til pinse."
    - "Apostlenes gjerninger oppgir ikke noe år, men bokens egne tidsangivelser binder reisen: tre måneder i synagogen og to år i Tyrannos' skole i Efesos, som Paulus senere minnes som tre år, og så tre måneder i Hellas. Reisen kommer etter Paulus' opphold i Korint under Gallio, prokonsul i 51–52, og før hans to år i varetekt i Cæsarea under Feliks og Festus; Catholic Encyclopedia fra 1911 daterte den til 53–57, og kartet viser den i 54 e.Kr. og hjemreisen i 57 e.Kr."
    - "På hjemreisen teller teksten dagene: fem fra Filippi til Troas, sju dager der, og så en dags seiling for hver etappe fra Mitylene til Milet og fra Kos til Rhodos. Disse dagene er oppgitt ved stoppestedene slik teksten gir dem; de andre reisetidene er anslag. Veien fra Antiokia til Efesos gjennom Galatia og Frygia, og fra Efesos gjennom Makedonia og Hellas, er ikke tegnet inn."
  tl:
    - "Isinasalaysay ng Gawa 18:23–21:17 ang ikatlong paglalakbay ni Pablo. Muli siyang umalis mula sa Antioquia, tinahak ang Galacia at Frigia na pinatitibay ang mga alagad, at dumating sa Efeso, kung saan siya nagturo nang mga tatlong taon hanggang sa kaguluhan ng mga panday-pilak. Mula roon ay tinahak niya ang Macedonia patungong Grecia, tumira roon nang tatlong buwan, at, nang bakayan siya ng mga Judio nang siya'y lalayag na sa Siria, bumalik siya sa pamamagitan ng Macedonia. Pagkaraan ng mga araw ng tinapay na walang lebadura ay naglayag siya mula sa Filipos, tinipon ang kaniyang mga kasama sa Troas, at bumaybay sa baybayin ng Asia, lampas sa Efeso hanggang Mileto, kung saan siya nagpaalam sa mga matanda ng Efeso, saka sa pamamagitan ng Rodas at Patara hanggang Tiro, Tolemaida at Cesarea, at umahon sa Jerusalem, na nagnanais na naroon sa araw ng Pentecostes."
    - "Walang binabanggit na taon ang Mga Gawa, ngunit ang sarili nitong mga tagal ang naglilimita sa paglalakbay: tatlong buwan sa sinagoga at dalawang taon sa paaralan ni Tiranno sa Efeso, na nang maglaon ay ginunita ni Pablo bilang tatlong taon, saka tatlong buwan sa Grecia. Naganap ang paglalakbay pagkatapos ng pananatili ni Pablo sa Corinto noong panahon ni Galion, prokonsul noong 51–52, at bago ang kaniyang dalawang taong pagkabilanggo sa Cesarea sa ilalim nina Felix at Festo; pinetsahan ito ng Catholic Encyclopedia ng 1911 sa 53–57, at ipinapakita ng mapa ang paglalakbay sa 54 AD, at ang paglalayag pabalik sa 57 AD."
    - "Sa paglalayag pauwi ay binibilang ng teksto ang mga araw: lima mula Filipos hanggang Troas, pitong araw doon, at pagkatapos ay isang araw na paglalayag sa bawat hakbang mula Mitilene hanggang Mileto at mula Coos hanggang Rodas. Ang mga araw na iyon ay nakalagay sa mga hintuan gaya ng pagbibigay ng teksto; ang iba pang oras ng paglalakbay ay mga tantiya. Ang daan mula Antioquia hanggang Efeso sa pamamagitan ng Galacia at Frigia, at mula Efeso sa pamamagitan ng Macedonia at Grecia, ay hindi iginuguhit."
  da:
    - "ApG 18:23–21:17 fortæller om Paulus' tredje rejse. Han drog atter ud fra Antiokia, drog gennem Galatien og Frygien og styrkede disciplene og kom til Efesos, hvor han underviste i omkring tre år indtil sølvsmedenes opstand. Derfra drog han gennem Makedonien til Grækenland, blev der tre måneder og vendte, da jøderne smedede anslag imod ham netop som han skulle sejle til Syrien, tilbage gennem Makedonien. Efter de usyrede brøds dage sejlede han fra Filippi, samlede sine rejsefæller i Troas og drog ned langs Asiens kyst, forbi Efesos til Milet, hvor han tog afsked med de ældste fra Efesos, og derefter via Rhodos og Patara til Tyrus, Ptolemais og Cæsarea og op til Jerusalem, fordi han ønskede at være der til pinse."
    - "Apostlenes Gerninger angiver intet årstal, men bogens egne tidsangivelser afgrænser rejsen: tre måneder i synagogen og to år i Tyrannus' skole i Efesos, som Paulus senere husker som tre år, og derefter tre måneder i Grækenland. Rejsen ligger efter Paulus' ophold i Korinth under Gallio, prokonsul i 51–52, og før hans to år i fangenskab i Cæsarea under Felix og Festus; Catholic Encyclopedia fra 1911 daterede den til 53–57, og kortet viser den i 54 e.Kr. og hjemrejsen i 57 e.Kr."
    - "På hjemrejsen tæller teksten dagene: fem fra Filippi til Troas, syv dage der og derefter en dags sejlads for hver etape fra Mitylene til Milet og fra Kos til Rhodos. Disse dage er angivet ved de enkelte stop, sådan som teksten angiver dem; de øvrige rejsetider er skøn. Vejen fra Antiokia til Efesos gennem Galatien og Frygien og fra Efesos gennem Makedonien og Grækenland er ikke tegnet ind."
  sr:
    - "Дела апостолска, од 18:23 до 21:17, приповедају о Павловом трећем путовању. Поново је кренуо из Антиохије, прошао кроз Галатију и Фригију утврђујући ученике и дошао у Ефес, где је учио око три године, до буне сребрара. Одатле је преко Македоније отишао у Грчку, остао три месеца и, кад су Јевреји сковали заверу против њега док је требало да отплови у Сирију, вратио се преко Македоније. После дана бесквасних хлебова отпловио је из Филипа, окупио своје сапутнике у Троади и спустио се дуж обале Азије, мимо Ефеса, до Милета, где се опростио са старешинама ефеским, затим преко Родоса и Патаре до Тира, Птолемаиде и Цезареје, и горе у Јерусалим, желећи да тамо буде за Педесетницу."
    - "Дела не наводе годину, али њихова сопствена трајања омеђују путовање: три месеца у синагоги и две године у школи Тирановој у Ефесу, чега се Павле касније сећа као три године, затим три месеца у Грчкој. Путовање долази после Павловог боравка у Коринту под Галионом, намесником 51–52, а пре његове две године под стражом у Цезареји под Филиксом и Фистом; Католичка енциклопедија из 1911. датирала га је у 53–57, а карта га приказује у 54. н. е., а пловидбу натраг у 57. н. е."
    - "На пловидби натраг текст броји дане: пет од Филипа до Троаде, седам дана тамо, а затим по један дан пловидбе на сваком кораку од Митилине до Милета и од Коса до Родоса. Ти дани наведени су уз станице онако како их даје текст; остала трајања пута процене су. Пут од Антиохије до Ефеса кроз Галатију и Фригију и од Ефеса кроз Македонију и Грчку није уцртан."
  hu:
    - "Az ApCsel 18:23–21:17 Pál harmadik útjáról szól. Ismét Antiókhiából indult, átment Galácián és Frígián, erősítve a tanítványokat, és Efezusba érkezett, ahol mintegy három évig tanított, egészen az ezüstművesek zendüléséig. Onnan Macedónián át Görögországba ment, három hónapig maradt, és mivel a zsidók összeesküdtek ellene, amikor Szíriába készült hajózni, Macedónián át ment vissza. A kovásztalan kenyerek napjai után elhajózott Filippiből, Troászban összegyűjtötte társait, és lehajózott Ázsia partja mentén, Efezus mellett elhaladva Milétoszig, ahol elbúcsúzott az efezusi vénektől, majd Rodoszon és Patarán át Tíruszba, Ptolemaisba és Cézáreába, és fel Jeruzsálembe, mert pünkösdre ott akart lenni."
    - "Az ApCsel nem ad meg évet, de saját időtartamai behatárolják az utat: három hónap a zsinagógában és két év Türánnusz iskolájában Efezusban, amit Pál később három évként idéz fel, majd három hónap Görögországban. Az út Pál korinthusi tartózkodása után következik Gallió idején, aki 51–52-ben volt prokonzul, és Félix és Fesztusz alatti kétéves cézáreai fogsága előtt; az 1911-es Catholic Encyclopedia 53–57-re keltezte, a térkép pedig Kr. u. 54-nél mutatja, a visszautat pedig Kr. u. 57-nél."
    - "A hazafelé tartó hajóúton a szöveg számolja a napokat: öt nap Filippitől Troászig, hét nap ott, majd minden szakaszon egynapi hajózás Mitilénétől Milétoszig és Kósztól Rodoszig. Ezeket a napokat úgy adjuk meg az állomásoknál, ahogy a szöveg adja; a többi utazási idő becslés. Az Antiókhiától Galácián és Frígián át Efezusig, valamint az Efezustól Macedónián és Görögországon át vezető út nincs berajzolva."
  fi:
    - "Apt 18:23–21:17 kertoo Paavalin kolmannesta matkasta. Hän lähti jälleen Antiokiasta, kulki Galatian ja Frygian kautta vahvistaen opetuslapsia ja tuli Efesokseen, jossa hän opetti noin kolme vuotta hopeaseppien mellakkaan asti. Sieltä hän meni Makedonian kautta Kreikkaan, viipyi siellä kolme kuukautta ja palasi Makedonian kautta, kun juutalaiset tekivät häntä vastaan salahankkeen juuri hänen aikoessaan purjehtia Syyriaan. Happamattoman leivän päivien jälkeen hän purjehti Filippistä, kokosi seuralaisensa Troaksessa ja kulki Aasian rannikkoa pitkin etelään Efesoksen ohi Miletokseen, jossa hän sanoi jäähyväiset Efesoksen vanhimmille, sitten Rodoksen ja Pataran kautta Tyrokseen, Ptolemaikseen ja Kesareaan ja ylös Jerusalemiin, koska halusi olla siellä helluntaina."
    - "Apostolien teot ei mainitse vuotta, mutta sen omat aikamäärät rajaavat matkan: kolme kuukautta synagogassa ja kaksi vuotta Tyrannoksen koulussa Efesoksessa, minkä Paavali myöhemmin muistaa kolmena vuotena, ja sitten kolme kuukautta Kreikassa. Matka sijoittuu kahden jakson väliin: Paavalin Korintin-oleskelun, jolloin Gallio oli käskynhaltijana 51–52, ja hänen kahden vankeusvuotensa Kesareassa Feliksin ja Festuksen aikana. Vuoden 1911 Catholic Encyclopedia ajoitti sen vuosiin 53–57, ja kartta näyttää sen vuonna 54 jaa. ja paluumatkan vuonna 57 jaa."
    - "Paluumatkalla teksti laskee päivät: viisi Filippistä Troakseen, seitsemän päivää siellä ja sitten päivän purjehdus kullakin välillä Mytilenestä Miletokseen ja Kosista Rodokselle. Nämä päivät on annettu pysähdyspaikkojen yhteydessä niin kuin teksti ne antaa; muut matka-ajat ovat arvioita. Reittiä Antiokiasta Efesokseen Galatian ja Frygian kautta sekä Efesoksesta Makedonian ja Kreikan kautta ei ole piirretty karttaan."
  vi:
    - "Công 18:23–21:17 thuật lại cuộc hành trình thứ ba của Phao-lô. Ông lại lên đường từ An-ti-ốt, trải qua xứ Ga-la-ti và xứ Phi-ri-gi làm cho các môn đồ vững lòng, rồi đến Ê-phê-sô, nơi ông dạy dỗ khoảng ba năm cho đến cuộc nổi loạn của các thợ bạc. Từ đó ông trải qua xứ Ma-xê-đoan đến Hy Lạp, ở lại ba tháng, và, khi người Giu-đa lập kế hại ông lúc ông sắp đi thuyền sang xứ Sy-ri, ông trở lại qua xứ Ma-xê-đoan. Sau những ngày ăn bánh không men, ông xuống thuyền tại Phi-líp, gặp lại các bạn đồng hành tại Trô-ách, rồi đi dọc bờ biển A-si, qua trước Ê-phê-sô đến Mi-lê, nơi ông từ biệt các trưởng lão Ê-phê-sô, rồi qua Rô-đơ và Ba-ta-ra đến Ty-rơ, Bê-tô-lê-mai và Sê-sa-rê, và lên Giê-ru-sa-lem, mong có mặt ở đó vào lễ Ngũ tuần."
    - "Sách Công vụ không nêu năm, nhưng chính những khoảng thời gian sách ghi lại giới hạn cuộc hành trình: ba tháng trong nhà hội và hai năm trong trường học Ti-ra-nu tại Ê-phê-sô, mà về sau Phao-lô nhắc lại là ba năm, rồi ba tháng ở Hy Lạp. Cuộc hành trình diễn ra sau thời gian Phao-lô ở Cô-rinh-tô dưới thời Ga-li-ôn, quan trấn thủ năm 51–52, và trước hai năm ông bị giam giữ tại Sê-sa-rê dưới thời Phê-lít và Phê-tu; Catholic Encyclopedia năm 1911 định niên đại là 53–57, và bản đồ thể hiện cuộc hành trình vào năm 54, còn chuyến trở về vào năm 57."
    - "Trên chuyến trở về, bản văn đếm từng ngày: năm ngày từ Phi-líp đến Trô-ách, bảy ngày ở đó, rồi mỗi chặng một ngày đi thuyền từ Mi-ti-len đến Mi-lê và từ Cốt đến Rô-đơ. Những ngày ấy được ghi kèm các điểm dừng đúng như bản văn cho biết; các thời gian đi đường khác là ước tính. Đường từ An-ti-ốt đến Ê-phê-sô qua xứ Ga-la-ti và xứ Phi-ri-gi, và từ Ê-phê-sô qua xứ Ma-xê-đoan và Hy Lạp, không được vẽ trên bản đồ."
  ro:
    - "Fapte 18:23–21:17 povestește a treia călătorie a lui Pavel. A pornit din nou din Antiohia, a străbătut Galatia și Frigia întărindu-i pe ucenici și a venit la Efes, unde a învățat vreo trei ani, până la răscoala argintarilor. De acolo a mers prin Macedonia în Grecia, a stat trei luni și, când iudeii au uneltit împotriva lui pe când era gata să plece pe mare spre Siria, s-a întors prin Macedonia. După zilele Azimelor a pornit pe mare din Filipi, și-a adunat însoțitorii la Troa și a coborât de-a lungul coastei Asiei, pe lângă Efes, până la Milet, unde și-a luat rămas bun de la prezbiterii din Efes, apoi prin Rodos și Patara la Tir, Ptolemaida și Cezareea și a urcat la Ierusalim, vrând să fie acolo de Cincizecime."
    - "Faptele nu dau niciun an, dar duratele pe care le dau încadrează călătoria: trei luni în sinagogă și doi ani în școala lui Tiran la Efes, pe care Pavel îi amintește mai târziu ca trei ani, apoi trei luni în Grecia. Călătoria vine după șederea lui Pavel la Corint sub Galion, proconsul în 51–52, și înainte de cei doi ani de detenție la Cezareea sub Felix și Festus; Catholic Encyclopedia din 1911 o data în 53–57, iar harta o arată în anul 54 d.Hr., și călătoria de întoarcere în anul 57 d.Hr."
    - "Pe drumul de întoarcere, textul numără zilele: cinci de la Filipi la Troa, șapte zile acolo, apoi o zi de navigație la fiecare etapă, de la Mitilene la Milet și de la Cos la Rodos. Aceste zile sunt date la opriri așa cum le dă textul; celelalte durate de drum sunt estimări. Drumul de la Antiohia la Efes prin Galatia și Frigia și cel de la Efes prin Macedonia și Grecia nu sunt trasate."
  bg:
    - "Деяния, от 18:23 до 21:17, разказват за третото пътуване на Павел. Той тръгна отново от Антиохия, мина през Галатия и Фригия, като утвърждаваше учениците, и дойде в Ефес, където поучаваше около три години до бунта на среброделците. Оттам мина през Македония в Гърция, остана три месеца и, когато юдеите устроиха заговор срещу него, докато се готвеше да отплава за Сирия, се върна през Македония. След дните на безквасните хлябове отплава от Филипи, събра спътниците си в Троада и слезе покрай брега на Азия, като отмина Ефес, до Милит, където се сбогува с ефеските презвитери, после през Родос и Патара до Тир, Птолемаида и Кесария и нагоре до Йерусалим, като искаше да бъде там за Петдесетница."
    - "Деяния не посочват година, но собствените им срокове обвързват пътуването: три месеца в синагогата и две години в училището на Тиран в Ефес, които Павел по-късно припомня като три години, после три месеца в Гърция. Пътуването е след престоя на Павел в Коринт при Галион, проконсул през 51–52 г., и преди двете му години под стража в Кесария при Феликс и Фест; Католическата енциклопедия от 1911 г. го датира в 53–57 г., а картата го показва в 54 г. н.е., а обратното плаване — в 57 г. н.е."
    - "При плаването обратно текстът брои дните: пет от Филипи до Троада, седем дни там и после по един ден плаване на всяка отсечка от Митилини до Милит и от Кос до Родос. Тези дни са дадени при спирките така, както ги дава текстът; другите времена за път са оценки. Пътят от Антиохия до Ефес през Галатия и Фригия и от Ефес през Македония и Гърция не е начертан."
