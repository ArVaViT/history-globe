    story:
      en: "Tearing themselves away from them, they put out to sea and ran a straight course to Cos, the island of the Dodecanese opposite Halicarnassus, home of the physician Hippocrates."
      ru: "Расставшись с ними, они вышли в море и прямым путём пришли в Кос, остров Додеканеса напротив Галикарнаса, родину врача Гиппократа."
      uk: "Відірвавшись від них, вони вийшли в море й прямим курсом прибули до Коса, острова Додеканесу навпроти Галікарнаса, батьківщини лікаря Гіппократа."
      es: "Separándose de ellos a duras penas, se hicieron a la mar y navegaron en línea recta a Cos, la isla del Dodecaneso frente a Halicarnaso, patria del médico Hipócrates."
      pt: "Arrancando-se deles, fizeram-se ao mar e seguiram em rota direta para Cós, a ilha do Dodecaneso defronte de Halicarnasso, terra natal do médico Hipócrates."
      de: "Sie rissen sich von ihnen los, stachen in See und fuhren auf geradem Kurs nach Kos, der Insel des Dodekanes gegenüber Halikarnassos, der Heimat des Arztes Hippokrates."
      fr: "S’étant arrachés à eux, ils prirent la mer et allèrent directement à Cos, l’île du Dodécanèse en face d’Halicarnasse, patrie du médecin Hippocrate."
      pl: "Oderwawszy się od nich, wypłynęli na morze i popłynęli prosto do Kos, wyspy Dodekanezu naprzeciw Halikarnasu, ojczyzny lekarza Hipokratesa."
      it: "Staccatisi da loro, presero il largo e con rotta diretta giunsero a Coo, l’isola del Dodecaneso di fronte ad Alicarnasso, patria del medico Ippocrate."
      nl: "Zich van hen losgerukt hebbend, staken zij in zee en voeren in een rechte koers naar Kos, het eiland van de Dodekanesos tegenover Halikarnassos, de geboorteplaats van de arts Hippocrates."
      cs: "Když se od nich odtrhli, vypluli na moře a pluli přímo do Kósu, ostrova Dodekanésu naproti Halikarnassu, domova lékaře Hippokrata."
      sv: "De slet sig från dem, lade ut och höll rak kurs till Kos, ön i Dodekanesos mitt emot Halikarnassos, läkaren Hippokrates hemort."
      nb: "Etter å ha revet seg løs fra dem stakk de til sjøs og holdt rett kurs til Kos, øya i Dodekanesos midt imot Halikarnassos, hjemstedet til legen Hippokrates."
      tl: "Nang mapahiwalay na sila sa kanila, tumulak sila sa dagat at tuwirang pinunta ang Coos, ang pulo ng Dodecanese sa tapat ng Halicarnassus, ang bayan ng manggagamot na si Hippocrates."
      da: "Efter at have revet sig løs fra dem stak de i søen og styrede lige mod Kos, øen i Dodekanesos over for Halikarnassos, hjemsted for lægen Hippokrates."
      sr: "Отргнувши се од њих, изашли су на море и пловили право до Коса, острва Додеканеза према Халикарнасу, завичаја лекара Хипократа."
      hu: "Miután elszakadtak tőlük, kifutottak a tengerre, és egyenesen Kószba hajóztak, a Dodekanészosz Halikarnasszosszal szemközti szigetére, Hippokratész orvos szülőhelyére."
      fi: "Erottuaan heistä he lähtivät merelle ja kulkivat suoraan Kosin saarelle, joka on Dodekanesian saari Halikarnassosta vastapäätä ja lääkäri Hippokrateen kotiseutu."
      vi: "Khi đã dứt mình khỏi họ, họ ra khơi và đi thẳng đến Cốt, hòn đảo thuộc quần đảo Dodecanese đối diện Halicarnassus, quê hương của thầy thuốc Hippocrates."
      ro: "Smulgându-se de lângă ei, au ieșit în larg și au mers drept la Cos, insula din Dodecanez din fața Halicarnasului, patria medicului Hipocrate."
      bg: "Като се откъснаха от тях, излязоха в морето и минаха направо до Кос — острова от Додеканезите срещу Халикарнас, родината на лекаря Хипократ."
