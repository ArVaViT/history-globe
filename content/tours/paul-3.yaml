    story:
      en: "The next day they came to Rhodes, the island off the south-west corner of Asia Minor, whose city at its northern tip had several harbours."
      ru: "На следующий день они пришли на Родос, остров у юго-западной оконечности Малой Азии, город которого на северном мысу имел несколько гаваней."
      uk: "Наступного дня вони прибули на Родос, острів біля південно-західного краю Малої Азії, чиє місто на північному мисі мало кілька гаваней."
      es: "Al día siguiente llegaron a Rodas, la isla situada frente al extremo suroccidental de Asia Menor, cuya ciudad, en la punta norte, tenía varios puertos."
      pt: "No dia seguinte chegaram a Rodes, a ilha diante do extremo sudoeste da Ásia Menor, cuja cidade, na ponta norte, tinha vários portos."
      de: "Am nächsten Tag kamen sie nach Rhodos, der Insel vor der Südwestecke Kleinasiens, deren Stadt an der Nordspitze mehrere Häfen besaß."
      fr: "Le lendemain, ils arrivèrent à Rhodes, l’île au large de l’angle sud-ouest de l’Asie Mineure, dont la ville, à sa pointe nord, avait plusieurs ports."
      pl: "Następnego dnia przybyli na Rodos, wyspę u południowo-zachodniego krańca Azji Mniejszej, której miasto na jej północnym cyplu miało kilka portów."
      it: "Il giorno seguente giunsero a Rodi, l’isola al largo dell’angolo sud-occidentale dell’Asia Minore, la cui città, sulla punta settentrionale, aveva diversi porti."
      nl: "De volgende dag kwamen zij te Rhodos, het eiland voor de zuidwestelijke hoek van Klein-Azië, waarvan de stad aan de noordpunt verscheidene havens had."
      cs: "Další den připluli na Rhodos, ostrov u jihozápadního cípu Malé Asie, jehož město na severním výběžku mělo několik přístavů."
      sv: "Dagen därpå kom de till Rhodos, ön utanför Mindre Asiens sydvästra hörn, vars stad på den norra udden hade flera hamnar."
      nb: "Dagen etter kom de til Rhodos, øya utenfor det sørvestlige hjørnet av Lilleasia, der byen på nordspissen hadde flere havner."
      tl: "Nang kinabukasan ay dumating sila sa Rodas, ang pulo sa tapat ng timog-kanlurang sulok ng Asia Minor, na ang lungsod sa hilagang dulo nito ay may ilang daungan."
      da: "Næste dag kom de til Rhodos, øen ud for Lilleasiens sydvestlige hjørne, hvis by på nordspidsen havde flere havne."
      sr: "Сутрадан су дошли на Родос, острво код југозападног угла Мале Азије, чији је град на његовом северном врху имао неколико лука."
      hu: "Másnap Rodoszra érkeztek, a Kis-Ázsia délnyugati csücske előtti szigetre, amelynek északi csúcsán álló városának több kikötője volt."
      fi: "Seuraavana päivänä he tulivat Rodokselle, saarelle Vähän-Aasian lounaiskulman edustalla; sen pohjoiskärjessä olevalla kaupungilla oli useita satamia."
      vi: "Ngày hôm sau họ đến Rô-đơ, hòn đảo ngoài khơi góc tây nam Tiểu Á, mà thành phố ở mũi phía bắc có nhiều hải cảng."
      ro: "A doua zi au ajuns la Rodos, insula din dreptul colțului de sud-vest al Asiei Mici, a cărei cetate, la vârful ei nordic, avea mai multe porturi."
      bg: "На следващия ден дойдоха в Родос — острова край югозападния ъгъл на Мала Азия, чийто град на северния му край имаше няколко пристанища."
