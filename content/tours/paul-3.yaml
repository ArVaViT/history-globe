    year: "AD 57"
    note:
      en: "They come to Mitylene."
      ru: "Прибывают в Митилину."
      uk: "Вони приходять до Мітилени."
      es: "Llegan a Mitilene."
      pt: "Chegam a Mitilene."
      de: "Sie kommen nach Mitylene."
      fr: "Ils arrivent à Mytilène."
      pl: "Przybywają do Mityleny."
      it: "Giungono a Mitilene."
      nl: "Zij komen te Mitylene."
      cs: "Přicházejí do Mitylén."
      sv: "De kommer till Mytilene."
      nb: "De kommer til Mitylene."
      tl: "Dumating sila sa Mitilene."
      da: "De kommer til Mitylene."
      sr: "Долазе у Митилину."
      hu: "Mitilénébe érkeznek."
      fi: "He tulevat Mytileneen."
      vi: "Họ đến Mi-ti-len."
      ro: "Ajung la Mitilene."
      bg: "Те идват в Митилини."
    story:
      en: "When he met them at Assos, they took him on board and came to Mitylene, the chief city of Lesbos, on the island's south-east coast, facing the mainland."
      ru: "Встретившись с ними в Ассе, Павел взошёл на корабль, и они прибыли в Митилину, главный город Лесбоса, на юго-восточном побережье острова, напротив материка."
      uk: "Коли він зустрівся з ними в Ассосі, вони взяли його на борт і прибули до Мітилени, головного міста Лесбосу, на південно-східному узбережжі острова, навпроти материка."
      es: "Cuando se reunió con ellos en Asón, lo tomaron a bordo y llegaron a Mitilene, la principal ciudad de Lesbos, en la costa sureste de la isla, frente al continente."
      pt: "Quando ele os encontrou em Assôs, receberam-no a bordo e chegaram a Mitilene, a principal cidade de Lesbos, na costa sudeste da ilha, defronte do continente."
      de: "Als er in Assos zu ihnen stieß, nahmen sie ihn an Bord und kamen nach Mitylene, der Hauptstadt von Lesbos, an der Südostküste der Insel, dem Festland gegenüber."
      fr: "Quand il les rejoignit à Assos, ils le prirent à bord et arrivèrent à Mytilène, la principale ville de Lesbos, sur la côte sud-est de l’île, face au continent."
      pl: "Gdy spotkał się z nimi w Assos, wzięli go na pokład i przybyli do Mityleny, głównego miasta Lesbos, na południowo-wschodnim wybrzeżu wyspy, naprzeciw lądu stałego."
      it: "Quando li raggiunse ad Asso, lo presero a bordo e giunsero a Mitilene, la città principale di Lesbo, sulla costa sud-orientale dell’isola, di fronte alla terraferma."
      nl: "Toen hij zich te Assos bij hen voegde, namen zij hem aan boord en kwamen te Mitylene, de hoofdstad van Lesbos, aan de zuidoostkust van het eiland, tegenover het vasteland."
      cs: "Když se s nimi setkal v Assu, vzali ho na palubu a přišli do Mitylén, hlavního města Lesbu, na jihovýchodním pobřeží ostrova, naproti pevnině."
      sv: "När han mötte dem i Assos tog de honom ombord och kom till Mytilene, huvudstaden på Lesbos, på öns sydöstra kust mitt emot fastlandet."
      nb: "Da han møtte dem i Assos, tok de ham om bord og kom til Mitylene, hovedbyen på Lesbos, på øyas sørøstkyst med utsikt mot fastlandet."
      tl: "Nang salubungin niya sila sa Ason, isinakay nila siya at dumating sa Mitilene, ang pangunahing lungsod ng Lesbos, sa timog-silangang baybayin ng pulo, nakaharap sa kalupaan."
      da: "Da han stødte til dem i Assos, tog de ham om bord og kom til Mitylene, Lesbos' hovedby, på øens sydøstkyst ud mod fastlandet."
      sr: "Кад се састао с њима у Асосу, узели су га на лађу и дошли у Митилину, главни град Лезбоса, на југоисточној обали острва, према копну."
      hu: "Amikor Asszoszban találkozott velük, felvették a hajóra, és Mitilénébe érkeztek, Leszbosz fővárosába, a sziget délkeleti partjára, a szárazfölddel szemben."
      fi: "Kun Paavali tapasi heidät Assoksessa, he ottivat hänet laivaan ja tulivat Mytileneen, Lesboksen pääkaupunkiin saaren kaakkoisrannikolla mannerta vastapäätä."
      vi: "Khi ông gặp họ tại A-sốt, họ đón ông lên tàu và đến Mi-ti-len, thành chính của đảo Lesbos, trên bờ biển phía đông nam của đảo, đối diện đất liền."
      ro: "Când i-a întâlnit la Asos, l-au luat pe corabie și au ajuns la Mitilene, cetatea principală a insulei Lesbos, pe coasta de sud-est a insulei, în fața continentului."
      bg: "Когато се срещна с тях в Асос, те го взеха на борда и дойдоха в Митилини, главния град на Лесбос, на югоизточния бряг на острова, срещу континента."
  - place: a4c2c75
    ref: Acts.20.15
    by: sea
    via:
