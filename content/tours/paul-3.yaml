      nb: "Sju dager med disiplene i Tyros."
      tl: "Pitong araw na kasama ang mga alagad sa Tiro."
      da: "Syv dage hos disciplene i Tyrus."
      sr: "Седам дана с ученицима у Тиру."
      hu: "Hét nap a tanítványokkal Tíruszban."
      fi: "Seitsemän päivää opetuslasten luona Tyroksessa."
      vi: "Bảy ngày với các môn đồ tại Ty-rơ."
      ro: "Șapte zile cu ucenicii din Tir."
      bg: "Седем дни с учениците в Тир."
    story:
      en: "They sighted Cyprus and, leaving it on the left, sailed on to Syria and landed at Tyre, where the ship was to unload its cargo. Finding the disciples there, they stayed seven days; through the Spirit the disciples told Paul not to go up to Jerusalem. When the days were over, they all, with their wives and children, saw them out of the city, knelt down on the beach and prayed, and Paul's company went on board."
      ru: "Увидев Кипр и оставив его слева, они поплыли дальше в Сирию и пристали в Тире, где корабль должен был выгрузить груз. Найдя там учеников, они пробыли семь дней; по внушению Духа ученики говорили Павлу не ходить в Иерусалим. Когда эти дни прошли, все они с жёнами и детьми проводили их за город, преклонили колени на берегу и помолились, и спутники Павла взошли на корабль."
      uk: "Побачивши Кіпр і залишивши його ліворуч, вони пливли далі до Сирії й пристали в Тірі, де корабель мав вивантажити вантаж. Знайшовши там учнів, вони пробули сім днів; через Духа учні казали Павлові не йти до Єрусалима. Коли ці дні минули, усі вони з жінками й дітьми провели їх за місто, стали на коліна на березі й помолилися, і супутники Павла сіли на корабель."
      es: "Avistaron Chipre y, dejándola a la izquierda, siguieron navegando hacia Siria y desembarcaron en Tiro, donde la nave debía descargar su mercancía. Encontraron allí a los discípulos y se quedaron siete días; por el Espíritu, los discípulos le decían a Pablo que no subiera a Jerusalén. Cumplidos aquellos días, todos, con sus mujeres e hijos, los acompañaron hasta fuera de la ciudad, se arrodillaron en la playa y oraron, y los compañeros de Pablo subieron a bordo."
      pt: "Avistaram Chipre e, deixando-a à esquerda, seguiram navegando para a Síria e desembarcaram em Tiro, onde o navio ia descarregar a sua carga. Encontrando ali os discípulos, ficaram sete dias; pelo Espírito, os discípulos diziam a Paulo que não subisse a Jerusalém. Terminados aqueles dias, todos eles, com as esposas e os filhos, acompanharam-nos até fora da cidade, ajoelharam-se na praia e oraram, e os companheiros de Paulo embarcaram."
      de: "Sie sichteten Zypern, ließen es zur Linken liegen, segelten weiter nach Syrien und landeten in Tyrus, wo das Schiff seine Ladung löschen sollte. Sie fanden die Jünger dort und blieben sieben Tage; durch den Geist sagten die Jünger Paulus, er solle nicht nach Jerusalem hinaufziehen. Als die Tage vorüber waren, geleiteten sie alle mit Frauen und Kindern sie aus der Stadt hinaus, knieten am Strand nieder und beteten, und die Gruppe des Paulus ging an Bord."
      fr: "Ils aperçurent Chypre et, la laissant à gauche, poursuivirent vers la Syrie et abordèrent à Tyr, où le navire devait décharger sa cargaison. Y trouvant les disciples, ils restèrent sept jours ; poussés par l’Esprit, les disciples disaient à Paul de ne pas monter à Jérusalem. Au terme de ces jours, tous, avec leurs femmes et leurs enfants, les accompagnèrent hors de la ville, se mirent à genoux sur le rivage et prièrent, et les compagnons de Paul montèrent à bord."
      pl: "Ujrzeli Cypr i zostawiwszy go po lewej stronie, płynęli dalej do Syrii i przybili do Tyru, gdzie okręt miał wyładować towar. Znalazłszy tam uczniów, pozostali siedem dni; uczniowie za sprawą Ducha mówili Pawłowi, by nie szedł do Jerozolimy. Gdy minęły te dni, wszyscy wraz z żonami i dziećmi odprowadzili ich za miasto, uklękli na brzegu i modlili się, a towarzysze Pawła weszli na pokład."
      it: "Avvistarono Cipro e, lasciandola a sinistra, navigarono verso la Siria e approdarono a Tiro, dove la nave doveva scaricare il suo carico. Trovati lì i discepoli, rimasero sette giorni; mossi dallo Spirito, i discepoli dicevano a Paolo di non salire a Gerusalemme. Trascorsi quei giorni, tutti, con le mogli e i figli, li accompagnarono fuori della città, si inginocchiarono sulla spiaggia e pregarono, e i compagni di Paolo salirono a bordo."
      nl: "Zij kregen Cyprus in zicht en, het links latend liggen, voeren zij door naar Syrië en gingen aan land te Tyrus, waar het schip zijn lading zou lossen. Daar vonden zij de discipelen en bleven zeven dagen; door de Geest zeiden de discipelen tegen Paulus dat hij niet naar Jeruzalem moest opgaan. Toen de dagen voorbij waren, brachten zij hen allen, met vrouwen en kinderen, de stad uit, knielden op het strand en baden, en het gezelschap van Paulus ging aan boord."
      cs: "Spatřili Kypr, nechali ho po levé ruce, pluli dál do Sýrie a přistáli v Týru, kde měla loď vyložit náklad. Nalezli tam učedníky a zůstali sedm dní; učedníci z vnuknutí Ducha říkali Pavlovi, aby nechodil do Jeruzaléma. Když ty dny uplynuly, všichni i s ženami a dětmi je vyprovodili za město, poklekli na břehu a modlili se, a Pavlova družina nastoupila na loď."
      sv: "De fick Cypern i sikte och seglade, med ön på vänster hand, vidare till Syrien och landade i Tyros, där skeppet skulle lossa sin last. De fann lärjungarna där och stannade sju dagar; genom Anden sade lärjungarna till Paulus att han inte skulle gå upp till Jerusalem. När dagarna var slut följde de alla, med hustrur och barn, dem ut ur staden, föll på knä på stranden och bad, och Paulus och hans följe gick ombord."
      nb: "De fikk Kypros i sikte og seilte, med øya på venstre hånd, videre til Syria og gikk i land i Tyros, der skipet skulle losse lasten sin. De fant disiplene der og ble i sju dager; ved Ånden sa disiplene til Paulus at han ikke skulle dra opp til Jerusalem. Da dagene var omme, fulgte de alle, med koner og barn, dem ut av byen, knelte på stranden og ba, og Paulus og følget hans gikk om bord."
      tl: "Natanaw nila ang Chipre at, na iniiwan ito sa kaliwa, naglayag hanggang sa Siria at dumaong sa Tiro, kung saan ilulunsad ng daong ang kaniyang lulan. Nang masumpungan nila ang mga alagad doon, tumira sila nang pitong araw; sa pamamagitan ng Espiritu ay sinabi ng mga alagad kay Pablo na huwag umahon sa Jerusalem. Nang matapos ang mga araw, silang lahat, kasama ang kanilang mga asawa at mga anak, ay naghatid sa kanila hanggang sa labas ng bayan, lumuhod sa dalampasigan at nanalangin, at sumakay ang mga kasama ni Pablo sa daong."
      da: "De fik Cypern i sigte, lod den ligge til venstre og sejlede videre til Syrien og landede i Tyrus, hvor skibet skulle losse sin ladning. De opsøgte disciplene der og blev syv dage; ved Ånden sagde disciplene til Paulus, at han ikke skulle drage op til Jerusalem. Da dagene var gået, fulgte de alle, med hustruer og børn, dem uden for byen, knælede på stranden og bad, og Paulus' følge gik om bord."
      sr: "Угледали су Кипар и, оставивши га налево, пловили према Сирији и пристали у Тиру, где је лађа требало да се истовари. Нашавши тамо ученике, остали су седам дана; ученици су Духом говорили Павлу да не иде горе у Јерусалим. Кад су се дани навршили, сви су их, са женама и децом, испратили до изван града, клекли на обали и помолили се, а Павлово друштво укрцало се на лађу."
      hu: "Megpillantották Ciprust, és balra hagyva Szíria felé hajóztak, és Tíruszban kötöttek ki, ahol a hajónak ki kellett raknia a rakományát. Megtalálva ott a tanítványokat, hét napig maradtak; a tanítványok a Lélek által azt mondták Pálnak, hogy ne menjen fel Jeruzsálembe. Amikor a napok leteltek, mindnyájan feleségükkel és gyermekeikkel együtt kikísérték őket a városból, letérdeltek a parton, és imádkoztak, Pál társasága pedig hajóra szállt."
      fi: "He saivat Kyproksen näkyviinsä ja jättäen sen vasemmalle purjehtivat edelleen Syyriaan ja nousivat maihin Tyroksessa, jossa laivan oli määrä purkaa lastinsa. He tapasivat siellä opetuslapset ja viipyivät seitsemän päivää; Hengen vaikutuksesta opetuslapset sanoivat Paavalille, ettei hänen pitänyt mennä Jerusalemiin. Kun päivät olivat kuluneet, kaikki vaimoineen ja lapsineen saattoivat heidät kaupungin ulkopuolelle, polvistuivat rannalla ja rukoilivat, ja Paavalin seurue astui laivaan."
      vi: "Họ thấy đảo Chíp-rơ và, để đảo ấy bên trái, cứ đi đến xứ Sy-ri và cập bến tại Ty-rơ, nơi tàu phải dỡ hàng. Tìm được các môn đồ ở đó, họ ở lại bảy ngày; nhờ Thánh Linh, các môn đồ bảo Phao-lô đừng lên Giê-ru-sa-lem. Khi hết những ngày ấy, hết thảy môn đồ cùng vợ con tiễn họ ra ngoài thành, quỳ xuống trên bờ biển mà cầu nguyện, và đoàn của Phao-lô xuống tàu."
      ro: "Au zărit Ciprul și, lăsându-l în stânga, au navigat spre Siria și au debarcat la Tir, unde corabia trebuia să-și descarce marfa. Găsindu-i acolo pe ucenici, au rămas șapte zile; prin Duhul, ucenicii i-au spus lui Pavel să nu urce la Ierusalim. Când s-au împlinit zilele, toți, cu femeile și copiii lor, i-au petrecut afară din cetate, au îngenuncheat pe țărm și s-au rugat, iar Pavel și însoțitorii lui s-au urcat pe corabie."
      bg: "Видяха Кипър и като го оставиха отляво, плаваха към Сирия и слязоха в Тир, където корабът трябваше да разтовари товара си. Като намериха учениците там, останаха седем дни; чрез Духа учениците казваха на Павел да не възлиза в Йерусалим. Когато дните се изпълниха, всички, с жените и децата си, ги изпратиха извън града, коленичиха на брега и се помолиха, и дружината на Павел се качи на кораба."
  - place: abc2af0
    ref: Acts.21.7
    by: sea
    via:
      - [35.13, 33.2]
      - [35.04, 33.0]
    year: "AD 57"
    note:
      en: "One day with the brothers at Ptolemais."
      ru: "Один день у братьев в Птолемаиде."
      uk: "Один день з братами в Птолемаїді."
      es: "Un día con los hermanos en Tolemaida."
      pt: "Um dia com os irmãos em Ptolemaida."
      de: "Ein Tag bei den Brüdern in Ptolemais."
      fr: "Un jour avec les frères à Ptolémaïs."
      pl: "Jeden dzień z braćmi w Ptolemaidzie."
      it: "Un giorno con i fratelli a Tolemaide."
      nl: "Een dag bij de broeders te Ptolemaïs."
      cs: "Jeden den s bratřími v Ptolemaidě."
      sv: "En dag med bröderna i Ptolemais."
      nb: "En dag med brødrene i Ptolemais."
      tl: "Isang araw na kasama ang mga kapatid sa Tolemaida."
      da: "En dag hos brødrene i Ptolemais."
      sr: "Један дан с браћом у Птолемаиди."
      hu: "Egy nap a testvéreknél Ptolemaisban."
      fi: "Yksi päivä veljien luona Ptolemaissa."
      vi: "Một ngày với anh em tại Bê-tô-lê-mai."
      ro: "O zi cu frații din Ptolemaida."
      bg: "Един ден с братята в Птолемаида."
    story:
      en: "Finishing the voyage from Tyre, they came to Ptolemais, the Acco of the Old Testament, at the northern end of the bay closed by Mount Carmel; they greeted the brothers and stayed with them one day."
      ru: "Завершив плавание из Тира, они прибыли в Птолемаиду, ветхозаветный Акко, на северном краю залива, замкнутого горой Кармил; они приветствовали братьев и пробыли у них один день."
      uk: "Закінчивши плавання з Тіру, вони прибули до Птолемаїди, старозавітного Акко, на північному краю затоки, замкненої горою Кармел; вони привітали братів і пробули в них один день."
      es: "Terminando la navegación desde Tiro, llegaron a Tolemaida, la Aco del Antiguo Testamento, en el extremo norte de la bahía cerrada por el monte Carmelo; saludaron a los hermanos y se quedaron con ellos un día."
      pt: "Terminando a viagem desde Tiro, chegaram a Ptolemaida, a Aco do Antigo Testamento, no extremo norte da baía fechada pelo monte Carmelo; saudaram os irmãos e ficaram com eles um dia."
      de: "Sie vollendeten die Fahrt von Tyrus und kamen nach Ptolemais, dem Akko des Alten Testaments, am nördlichen Ende der vom Karmel abgeschlossenen Bucht; sie grüßten die Brüder und blieben einen Tag bei ihnen."
      fr: "Achevant la navigation depuis Tyr, ils arrivèrent à Ptolémaïs, l’Acco de l’Ancien Testament, à l’extrémité nord de la baie fermée par le mont Carmel ; ils saluèrent les frères et passèrent un jour avec eux."
      pl: "Kończąc rejs z Tyru, przybyli do Ptolemaidy, starotestamentowego Akko, na północnym krańcu zatoki zamkniętej górą Karmel; pozdrowili braci i pozostali u nich jeden dzień."
      it: "Terminata la navigazione da Tiro, giunsero a Tolemaide, l’Acco dell’Antico Testamento, all’estremità settentrionale della baia chiusa dal monte Carmelo; salutarono i fratelli e rimasero con loro un giorno."
      nl: "De vaart van Tyrus voltooiend, kwamen zij te Ptolemaïs, het Akko van het Oude Testament, aan het noordelijke einde van de baai die door de Karmel wordt afgesloten; zij groetten de broeders en bleven een dag bij hen."
      cs: "Dokončili plavbu z Týru a přišli do Ptolemaidy, starozákonního Akka, na severním konci zálivu uzavřeného horou Karmel; pozdravili bratry a zůstali u nich jeden den."
      sv: "När de avslutade sjöresan från Tyros kom de till Ptolemais, Gamla testamentets Acko, vid den norra änden av den bukt som Karmel stänger; de hälsade på bröderna och stannade hos dem en dag."
      nb: "Da de hadde fullført sjøreisen fra Tyros, kom de til Ptolemais, Det gamle testamentes Akko, ved nordenden av bukten som Karmel stenger; de hilste på brødrene og ble hos dem én dag."
      tl: "Nang matapos ang paglalayag mula sa Tiro, dumating sila sa Tolemaida, ang Acho ng Matandang Tipan, sa hilagang dulo ng look na sinasarhan ng bundok Carmelo; binati nila ang mga kapatid at tumira sa kanila nang isang araw."
      da: "Da de havde fuldført sejladsen fra Tyrus, kom de til Ptolemais, Det Gamle Testamentes Akko, ved den nordlige ende af bugten, som lukkes af Karmelbjerget; de hilste på brødrene og blev én dag hos dem."
      sr: "Завршивши пловидбу од Тира, дошли су у Птолемаиду, старозаветни Ако, на северном крају залива који затвара гора Кармил; поздравили су браћу и остали код њих један дан."
      hu: "A tíruszi hajóutat befejezve Ptolemaisba érkeztek, az Ószövetség Akkójába, a Kármel-hegy által lezárt öböl északi végén; köszöntötték a testvéreket, és egy napig náluk maradtak."
      fi: "Päätettyään purjehduksen Tyroksesta he tulivat Ptolemaikseen, Vanhan testamentin Akkoon, Karmel-vuoren sulkeman lahden pohjoispäähän; he tervehtivät veljiä ja viipyivät heidän luonaan yhden päivän."
      vi: "Đi hết đường biển từ Ty-rơ, họ đến Bê-tô-lê-mai, tức A-cô trong Cựu Ước, ở đầu phía bắc của vịnh được núi Cạt-mên khép lại; họ chào thăm anh em và ở lại với họ một ngày."
      ro: "Încheind drumul pe mare de la Tir, au ajuns la Ptolemaida, Aco din Vechiul Testament, la capătul de nord al golfului închis de muntele Carmel; i-au salutat pe frați și au rămas o zi la ei."
      bg: "Като завършиха плаването от Тир, дойдоха в Птолемаида — Акон от Стария завет, в северния край на залива, затворен от планината Кармил; поздравиха братята и останаха при тях един ден."
  - place: a58735e
    ref: Acts.21.8-Acts.21.14
    year: "AD 57"
    note:
      en: "In the house of Philip; the prophecy of Agabus."
      ru: "В доме Филиппа; пророчество Агава."
      uk: "У домі Пилипа; пророцтво Агава."
      es: "En casa de Felipe; la profecía de Agabo."
      pt: "Na casa de Filipe; a profecia de Ágabo."
      de: "Im Haus des Philippus; die Weissagung des Agabus."
      fr: "Dans la maison de Philippe ; la prophétie d’Agabus."
      pl: "W domu Filipa; proroctwo Agabosa."
      it: "In casa di Filippo; la profezia di Agabo."
      nl: "In het huis van Filippus; de profetie van Agabus."
      cs: "V domě Filipově; proroctví Agabovo."
      sv: "I Filippos’ hus; Agabos’ profetia."
      nb: "I Filips hus; Agabus' profeti."
      tl: "Sa bahay ni Felipe; ang hula ni Agabo."
      da: "I Filips hus; Agabus' profeti."
      sr: "У кући Филиповој; пророштво Агавово."
      hu: "Fülöp házában; Agabusz próféciája."
      fi: "Filippoksen talossa; Agaboksen ennustus."
      vi: "Trong nhà Phi-líp; lời tiên tri của A-ga-bút."
      ro: "În casa lui Filip; prorocia lui Agab."
      bg: "В дома на Филип; пророчеството на Агав."
    story:
      en: "The next day they left and came to Caesarea, and stayed many days in the house of Philip the evangelist, one of the Seven, who had four unmarried daughters who prophesied. The prophet Agabus came down from Judea, took Paul's belt, bound his own feet and hands with it, and said that so the Jews at Jerusalem would bind the owner of this belt and hand him over to the Gentiles. Paul's companions and the local believers begged him not to go up to Jerusalem, but he answered that he was ready not only to be bound but also to die at Jerusalem for the name of the Lord Jesus; when he would not be persuaded, they said, The will of the Lord be done."
      ru: "На следующий день они вышли и пришли в Кесарию и много дней жили в доме Филиппа благовестника, одного из семи, у которого были четыре незамужние дочери, пророчествовавшие. Из Иудеи пришёл пророк Агав, взял пояс Павла, связал им себе ноги и руки и сказал, что так иудеи в Иерусалиме свяжут хозяина этого пояса и предадут его в руки язычников. Спутники Павла и местные верующие умоляли его не ходить в Иерусалим, но он ответил, что готов не только быть связанным, но и умереть в Иерусалиме за имя Господа Иисуса; когда он не поддался уговорам, они сказали: да будет воля Господня."
      uk: "Наступного дня вони вийшли й прийшли до Кесарії і багато днів пробули в домі Пилипа-благовісника, одного із Сімох, у якого були чотири незаміжні дочки, що пророкували. З Юдеї прийшов пророк Агав, узяв пояс Павла, зв’язав ним собі ноги й руки і сказав, що так юдеї в Єрусалимі зв’яжуть власника цього пояса й видадуть його язичникам. Супутники Павла й місцеві віруючі благали його не йти до Єрусалима, але він відповів, що готовий не тільки бути зв’язаним, а й померти в Єрусалимі за ім’я Господа Ісуса; коли він не дав себе вмовити, вони сказали: нехай буде воля Господня."
      es: "Al día siguiente partieron y llegaron a Cesarea, y se quedaron muchos días en casa de Felipe el evangelista, uno de los siete, que tenía cuatro hijas solteras que profetizaban. El profeta Agabo bajó de Judea, tomó el cinto de Pablo, se ató con él los pies y las manos, y dijo que así atarían los judíos en Jerusalén al dueño de aquel cinto y lo entregarían a los gentiles. Los compañeros de Pablo y los creyentes del lugar le rogaron que no subiera a Jerusalén, pero él respondió que estaba dispuesto no solo a ser atado, sino también a morir en Jerusalén por el nombre del Señor Jesús; como no se dejaba persuadir, dijeron: Hágase la voluntad del Señor."
      pt: "No dia seguinte partiram e chegaram a Cesareia, e ficaram muitos dias na casa de Filipe, o evangelista, um dos sete, que tinha quatro filhas solteiras que profetizavam. O profeta Ágabo desceu da Judeia, tomou o cinto de Paulo, amarrou com ele os próprios pés e mãos e disse que assim os judeus em Jerusalém amarrariam o dono daquele cinto e o entregariam aos gentios. Os companheiros de Paulo e os crentes do lugar imploraram-lhe que não subisse a Jerusalém, mas ele respondeu que estava pronto não só para ser amarrado, mas também para morrer em Jerusalém pelo nome do Senhor Jesus; como ele não se deixava persuadir, disseram: Seja feita a vontade do Senhor."
      de: "Am nächsten Tag brachen sie auf, kamen nach Caesarea und blieben viele Tage im Haus des Evangelisten Philippus, eines der Sieben, der vier unverheiratete Töchter hatte, die weissagten. Der Prophet Agabus kam aus Judäa herab, nahm den Gürtel des Paulus, band sich damit Füße und Hände und sagte, so würden die Juden in Jerusalem den Mann binden, dem dieser Gürtel gehört, und ihn den Heiden ausliefern. Die Gefährten des Paulus und die Gläubigen des Ortes baten ihn, nicht nach Jerusalem hinaufzuziehen, doch er antwortete, er sei bereit, sich nicht nur binden zu lassen, sondern auch in Jerusalem für den Namen des Herrn Jesus zu sterben; als er sich nicht überreden ließ, sagten sie, der Wille des Herrn geschehe."
      fr: "Le lendemain, ils partirent et arrivèrent à Césarée, et restèrent plusieurs jours dans la maison de Philippe l’évangéliste, l’un des sept, qui avait quatre filles non mariées qui prophétisaient. Le prophète Agabus descendit de Judée, prit la ceinture de Paul, s’en lia les pieds et les mains, et dit que les Juifs de Jérusalem lieraient de même le propriétaire de cette ceinture et le livreraient aux païens. Les compagnons de Paul et les croyants de l’endroit le supplièrent de ne pas monter à Jérusalem, mais il répondit qu’il était prêt non seulement à être lié, mais encore à mourir à Jérusalem pour le nom du Seigneur Jésus ; comme il ne se laissait pas persuader, ils dirent : Que la volonté du Seigneur se fasse."
      pl: "Nazajutrz wyruszyli i przybyli do Cezarei, i pozostali wiele dni w domu Filipa ewangelisty, jednego z Siedmiu, który miał cztery niezamężne córki prorokujące. Prorok Agabos przyszedł z Judei, wziął pas Pawła, związał nim sobie nogi i ręce i powiedział, że tak Żydzi w Jerozolimie zwiążą właściciela tego pasa i wydadzą go w ręce pogan. Towarzysze Pawła i miejscowi wierzący błagali go, by nie szedł do Jerozolimy, lecz on odpowiedział, że jest gotów nie tylko dać się związać, ale i umrzeć w Jerozolimie za imię Pana Jezusa; gdy nie dał się przekonać, powiedzieli, że niech się dzieje wola Pana."
      it: "Il giorno seguente partirono e giunsero a Cesarea, e rimasero molti giorni in casa di Filippo l’evangelista, uno dei sette, che aveva quattro figlie nubili che profetizzavano. Il profeta Agabo scese dalla Giudea, prese la cintura di Paolo, si legò con essa i piedi e le mani, e disse che così i Giudei di Gerusalemme avrebbero legato il proprietario di quella cintura e lo avrebbero consegnato ai Gentili. I compagni di Paolo e i credenti del luogo lo supplicarono di non salire a Gerusalemme, ma egli rispose che era pronto non solo a essere legato, ma anche a morire a Gerusalemme per il nome del Signore Gesù; poiché non si lasciava persuadere, dissero: Sia fatta la volontà del Signore."
      nl: "De volgende dag vertrokken zij en kwamen te Caesarea, en bleven vele dagen in het huis van Filippus de evangelist, een van de zeven, die vier ongehuwde dochters had die profeteerden. De profeet Agabus kwam af van Judea, nam de gordel van Paulus, bond er zijn eigen voeten en handen mee en zei dat de Joden te Jeruzalem de eigenaar van deze gordel zo zouden binden en hem in de handen van de heidenen zouden overleveren. De metgezellen van Paulus en de gelovigen ter plaatse smeekten hem niet naar Jeruzalem op te gaan, maar hij antwoordde dat hij bereid was niet alleen gebonden te worden, maar ook te Jeruzalem te sterven voor de naam van de Heer Jezus; toen hij zich niet liet overreden, zeiden zij dat de wil van de Heer moest geschieden."
      cs: "Druhý den vyšli a přišli do Cesareje a zůstali mnoho dní v domě evangelisty Filipa, jednoho ze Sedmi, který měl čtyři neprovdané dcery, jež prorokovaly. Z Judska přišel prorok Agabos, vzal Pavlův pás, svázal si jím nohy a ruce a řekl, že tak Židé v Jeruzalémě svážou muže, jemuž ten pás patří, a vydají ho do rukou pohanů. Pavlovi průvodci i místní věřící ho prosili, aby nechodil do Jeruzaléma, ale on odpověděl, že je hotov dát se nejen svázat, ale i zemřít v Jeruzalémě pro jméno Pána Ježíše; když se nedal přemluvit, řekli, ať se stane, co chce Pán."
      sv: "Nästa dag bröt de upp och kom till Caesarea och stannade många dagar i evangelisten Filippos’ hus, en av de sju, som hade fyra ogifta döttrar som profeterade. Profeten Agabos kom ned från Judeen, tog Paulus’ bälte, band sina egna fötter och händer med det och sade att så skulle judarna i Jerusalem binda den man som ägde detta bälte och överlämna honom åt hedningarna. Paulus’ följeslagare och de troende på platsen bad honom att inte gå upp till Jerusalem, men han svarade att han var redo inte bara att bindas utan också att dö i Jerusalem för Herren Jesu namn; när han inte lät sig övertalas sade de att Herrens vilja skulle ske."
      nb: "Neste dag dro de videre og kom til Cæsarea og ble mange dager i huset til evangelisten Filip, en av de sju, som hadde fire ugifte døtre som profeterte. Profeten Agabus kom ned fra Judea, tok Paulus' belte, bandt sine egne føtter og hender med det og sa at slik skulle jødene i Jerusalem binde den mannen som eide dette beltet, og overgi ham til hedningene. Paulus' følgesvenner og de troende på stedet ba ham om ikke å dra opp til Jerusalem, men han svarte at han var rede ikke bare til å bli bundet, men også til å dø i Jerusalem for Herren Jesu navn; da han ikke lot seg overtale, sa de at Herrens vilje måtte skje."
      tl: "Nang kinabukasan ay umalis sila at dumating sa Cesarea, at tumira nang maraming araw sa bahay ni Felipe na evangelista, isa sa pito, na may apat na anak na dalagang nagsisipanghula. Lumusong mula sa Judea ang propetang si Agabo, kinuha ang pamigkis ni Pablo, ginapos dito ang kaniyang sariling mga paa at kamay, at sinabing ganito gagapusin ng mga Judio sa Jerusalem ang may-ari ng pamigkis na ito at ibibigay siya sa mga Gentil. Namanhik ang mga kasama ni Pablo at ang mga mananampalataya roon na huwag siyang umahon sa Jerusalem, ngunit sumagot siya na nahahanda siya hindi lamang gapusin kundi mamatay rin sa Jerusalem dahil sa pangalan ng Panginoong Jesus; nang hindi siya pahikayat, sinabi nilang mangyari nawa ang kalooban ng Panginoon."
      da: "Næste dag drog de videre og kom til Cæsarea og blev mange dage i huset hos evangelisten Filip, en af de syv, som havde fire ugifte døtre, der profeterede. Profeten Agabus kom ned fra Judæa, tog Paulus' bælte, bandt sine egne fødder og hænder med det og sagde, at således ville jøderne i Jerusalem binde den mand, som ejede dette bælte, og overgive ham til hedningerne. Paulus' rejsefæller og de troende på stedet bad ham om ikke at drage op til Jerusalem, men han svarede, at han var rede til ikke alene at blive bundet, men også at dø i Jerusalem for den Herre Jesu navns skyld; da han ikke ville lade sig overtale, sagde de, at Herrens vilje måtte ske."
      sr: "Сутрадан су кренули и дошли у Цезареју, и остали много дана у кући Филипа јеванђелисте, једног од седморице, који је имао четири неудате кћери које су прорицале. Пророк Агав сишао је из Јудеје, узео Павлов појас, свезао њиме своје ноге и руке и рекао да ће тако Јевреји у Јерусалиму свезати човека чији је овај појас и предати га незнабошцима. Павлови сапутници и тамошњи верници молили су га да не иде горе у Јерусалим, али он је одговорио да је спреман не само да буде свезан него и да умре у Јерусалиму за име Господа Исуса; кад нису могли да га одврате, рекли су да нека буде воља Господња."
      hu: "Másnap elindultak, Cézáreába érkeztek, és sok napig maradtak Fülöp evangélista házában, aki a hét közül való volt, és akinek négy hajadon leánya volt, akik prófétáltak. Agabusz próféta lejött Júdeából, fogta Pál övét, megkötözte vele a saját lábát és kezét, és azt mondta, hogy így kötözik meg a jeruzsálemi zsidók ennek az övnek a gazdáját, és adják át a pogányoknak. Pál társai és a helybeli hívők kérték, hogy ne menjen fel Jeruzsálembe, de ő azt felelte, hogy kész nemcsak megkötöztetni, hanem meg is halni Jeruzsálemben az Úr Jézus nevéért; amikor nem lehetett rábeszélni, azt mondták, hogy legyen meg az Úr akarata."
      fi: "Seuraavana päivänä he lähtivät ja tulivat Kesareaan ja viipyivät monta päivää evankelista Filippoksen talossa; hän oli yksi niistä seitsemästä, ja hänellä oli neljä naimatonta tytärtä, jotka profetoivat. Profeetta Agabos tuli Juudeasta, otti Paavalin vyön, sitoi sillä omat jalkansa ja kätensä ja sanoi, että näin juutalaiset Jerusalemissa sitoisivat tämän vyön omistajan ja antaisivat hänet pakanoiden käsiin. Paavalin seuralaiset ja paikalliset uskovat pyysivät häntä, ettei hän menisi Jerusalemiin, mutta hän vastasi olevansa valmis paitsi sidottavaksi myös kuolemaan Jerusalemissa Herran Jeesuksen nimen tähden; kun hän ei taipunut, he sanoivat, että tapahtukoon Herran tahto."
      vi: "Ngày hôm sau họ ra đi và đến Sê-sa-rê, ở lại nhiều ngày trong nhà Phi-líp, người giảng Tin Lành, một trong bảy người, có bốn con gái đồng trinh hay nói tiên tri. Tiên tri A-ga-bút từ xứ Giu-đê xuống, lấy dây lưng của Phao-lô trói chân tay mình và nói rằng tại Giê-ru-sa-lem người Giu-đa sẽ trói người có dây lưng này như vậy mà nộp vào tay người ngoại. Các bạn đồng hành của Phao-lô và các tín đồ tại đó nài xin ông đừng lên Giê-ru-sa-lem, nhưng ông đáp rằng ông sẵn lòng chẳng những để bị trói mà còn chịu chết tại Giê-ru-sa-lem vì danh Đức Chúa Giê-su; khi ông chẳng khứng nghe, họ nói: xin cho ý muốn của Chúa được nên."
      ro: "A doua zi au plecat, au ajuns la Cezareea și au rămas multe zile în casa lui Filip evanghelistul, unul dintre cei Șapte, care avea patru fiice nemăritate care proroceau. Prorocul Agab a coborât din Iudeea, a luat brâul lui Pavel, și-a legat cu el picioarele și mâinile și a spus că așa îl vor lega iudeii din Ierusalim pe stăpânul acestui brâu și îl vor da în mâinile neamurilor. Însoțitorii lui Pavel și credincioșii de acolo l-au rugat să nu urce la Ierusalim, dar el a răspuns că este gata nu numai să fie legat, ci și să moară la Ierusalim pentru numele Domnului Isus; când n-au putut să-l înduplece, au zis să fie voia Domnului."
      bg: "На следващия ден тръгнаха и дойдоха в Кесария и останаха много дни в дома на благовестника Филип, един от седмината, който имаше четири неомъжени дъщери, които пророкуваха. Пророкът Агав слезе от Юдея, взе пояса на Павел, върза с него собствените си нозе и ръце и каза, че така юдеите в Йерусалим ще вържат човека, на когото е този пояс, и ще го предадат на езичниците. Спътниците на Павел и местните вярващи го молеха да не възлиза в Йерусалим, но той отговори, че е готов не само да бъде вързан, но и да умре в Йерусалим за името на Господа Исуса; когато не можаха да го убедят, те казаха, че волята на Господа да бъде."
  - place: a15257a
    ref: Acts.21.15-Acts.21.17
    year: "AD 57"
    note:
      en: "The brothers in Jerusalem receive them gladly."
      ru: "Братья в Иерусалиме радушно принимают их."
      uk: "Брати в Єрусалимі радо приймають їх."
      es: "Los hermanos de Jerusalén los reciben con alegría."
      pt: "Os irmãos em Jerusalém os recebem com alegria."
      de: "Die Brüder in Jerusalem nehmen sie gern auf."
      fr: "À Jérusalem, les frères les accueillent avec joie."
      pl: "Bracia w Jerozolimie przyjmują ich z radością."
      it: "I fratelli di Gerusalemme li accolgono con gioia."
      nl: "De broeders in Jeruzalem ontvangen hen met vreugde."
      cs: "Bratří v Jeruzalémě je přijímají s radostí."
      sv: "Bröderna i Jerusalem tar emot dem med glädje."
      nb: "Brødrene i Jerusalem tar glad imot dem."
      tl: "Masayang tinanggap sila ng mga kapatid sa Jerusalem."
      da: "Brødrene i Jerusalem tager glade imod dem."
      sr: "Браћа у Јерусалиму радосно их примају."
      hu: "A jeruzsálemi testvérek örömmel fogadják őket."
      fi: "Jerusalemin veljet ottavat heidät ilolla vastaan."
      vi: "Anh em tại Giê-ru-sa-lem vui mừng tiếp rước họ."
      ro: "Frații din Ierusalim îi primesc cu bucurie."
      bg: "Братята в Йерусалим ги приемат радушно."
    story:
      en: "After those days they got ready and went up to Jerusalem, some of the disciples from Caesarea going with them and bringing them to the house of Mnason of Cyprus, an early disciple, with whom they were to lodge. At Jerusalem the brothers received them gladly."
      ru: "После этих дней они собрались и пошли в Иерусалим; с ними пошли и некоторые ученики из Кесарии, проводив их к Мнасону Кипрянину, давнему ученику, у которого им предстояло жить. В Иерусалиме братья радушно приняли их."
      uk: "Після тих днів вони зібралися й пішли до Єрусалима; з ними пішли й деякі учні з Кесарії, провівши їх до Мнасона Кіпрянина, давнього учня, у якого вони мали зупинитися. В Єрусалимі брати радо їх прийняли."
      es: "Después de aquellos días se prepararon y subieron a Jerusalén; algunos de los discípulos de Cesarea fueron con ellos y los llevaron a casa de Mnasón de Chipre, un discípulo antiguo, en cuya casa iban a hospedarse. En Jerusalén los hermanos los recibieron con alegría."
      pt: "Depois daqueles dias, prepararam-se e subiram a Jerusalém; alguns dos discípulos de Cesareia foram com eles e os levaram à casa de Mnasom, de Chipre, um dos primeiros discípulos, com quem iam hospedar-se. Em Jerusalém os irmãos os receberam com alegria."
      de: "Nach diesen Tagen machten sie sich bereit und zogen hinauf nach Jerusalem; einige der Jünger aus Caesarea gingen mit ihnen und brachten sie in das Haus des Mnason aus Zypern, eines frühen Jüngers, bei dem sie wohnen sollten. In Jerusalem nahmen die Brüder sie gern auf."
      fr: "Après ces jours-là, ils firent leurs préparatifs et montèrent à Jérusalem ; quelques disciples de Césarée vinrent avec eux et les conduisirent chez Mnason de Chypre, un ancien disciple, chez qui ils devaient loger. À Jérusalem, les frères les reçurent avec joie."
      pl: "Po tych dniach przygotowali się i poszli w górę do Jerozolimy; szli z nimi niektórzy uczniowie z Cezarei i zaprowadzili ich do domu Mnazona z Cypru, dawnego ucznia, u którego mieli się zatrzymać. W Jerozolimie bracia przyjęli ich z radością."
      it: "Dopo quei giorni si prepararono e salirono a Gerusalemme; alcuni discepoli di Cesarea andarono con loro e li condussero in casa di Mnasone di Cipro, un discepolo della prima ora, presso il quale dovevano alloggiare. A Gerusalemme i fratelli li accolsero con gioia."
      nl: "Na die dagen maakten zij zich gereed en gingen op naar Jeruzalem; enkele discipelen uit Caesarea gingen met hen mee en brachten hen naar het huis van Mnason van Cyprus, een discipel van het eerste uur, bij wie zij zouden logeren. Te Jeruzalem ontvingen de broeders hen met vreugde."
      cs: "Po těch dnech se připravili a vystoupili do Jeruzaléma; šli s nimi někteří učedníci z Cesareje a dovedli je do domu Mnasóna z Kypru, učedníka z prvních dob, u něhož měli bydlet. V Jeruzalémě je bratři přijali s radostí."
      sv: "Efter de dagarna gjorde de sig i ordning och gick upp till Jerusalem; några av lärjungarna från Caesarea följde med och förde dem till Mnason från Cypern, en lärjunge sedan gammalt, som de skulle bo hos. I Jerusalem tog bröderna emot dem med glädje."
      nb: "Etter de dagene gjorde de seg i stand og dro opp til Jerusalem, og noen av disiplene fra Cæsarea fulgte med og førte dem til Mnason fra Kypros, en disippel fra den første tiden, som de skulle bo hos. I Jerusalem tok brødrene glad imot dem."
      tl: "Pagkaraan ng mga araw na iyon ay naghanda sila at umahon sa Jerusalem, na sinamahan ng ilang alagad mula sa Cesarea na nagdala sa kanila sa bahay ni Mnason na taga-Chipre, isang kaunaunahang alagad, na sa kaniya sila makikipanuluyan. Sa Jerusalem ay masayang tinanggap sila ng mga kapatid."
      da: "Efter disse dage gjorde de sig rede og drog op til Jerusalem, og nogle af disciplene fra Cæsarea fulgte med og bragte dem til Mnason fra Cypern, en af de første disciple, hos hvem de skulle bo. I Jerusalem tog brødrene glade imod dem."
      sr: "После тих дана спремили су се и отишли горе у Јерусалим, а неки од ученика из Цезареје пошли су с њима и довели их у кућу Мнасона с Кипра, старог ученика, код кога је требало да одседну. У Јерусалиму браћа су их радосно примила."
      hu: "Ezek után a napok után felkészültek, és felmentek Jeruzsálembe; a cézáreai tanítványok közül néhányan velük mentek, és elvezették őket a ciprusi Mnászonnak, egy régi tanítványnak a házához, akinél szállást kellett kapniuk. Jeruzsálemben a testvérek örömmel fogadták őket."
      fi: "Niiden päivien jälkeen he valmistautuivat ja menivät ylös Jerusalemiin, ja osa Kesarean opetuslapsista tuli heidän mukanaan ja vei heidät kyprolaisen Mnasonin, varhaisen opetuslapsen, luo, jonka luona heidän oli määrä majoittua. Jerusalemissa veljet ottivat heidät ilolla vastaan."
      vi: "Sau những ngày ấy, họ sắm sửa rồi lên Giê-ru-sa-lem; mấy môn đồ từ Sê-sa-rê cùng đi với họ và dẫn họ đến nhà Ma-na-sôn người Chíp-rơ, một môn đồ lâu năm, là người sẽ cho họ trọ. Tại Giê-ru-sa-lem, anh em vui mừng tiếp rước họ."
      ro: "După zilele acelea s-au pregătit și au urcat la Ierusalim; unii dintre ucenicii din Cezareea au mers cu ei și i-au dus la casa lui Mnason din Cipru, un ucenic vechi, la care urmau să găzduiască. La Ierusalim frații i-au primit cu bucurie."
      bg: "След тези дни те се приготвиха и възлязоха в Йерусалим, като някои от учениците от Кесария дойдоха с тях и ги заведоха в дома на Мнасон от Кипър, стар ученик, у когото щяха да отседнат. В Йерусалим братята ги приеха с радост."
