    story:
      en: "From Rhodes they went on to Patara. There they found a ship crossing over to Phoenicia, went on board and set sail."
      ru: "С Родоса они пошли дальше, в Патару. Там они нашли корабль, переправлявшийся в Финикию, взошли на него и отплыли."
      uk: "З Родосу вони вирушили далі до Патари. Там вони знайшли корабель, що переправлявся до Фінікії, сіли на нього й відпливли."
      es: "De Rodas siguieron hasta Pátara. Allí encontraron una nave que pasaba a Fenicia, subieron a bordo y zarparon."
      pt: "De Rodes seguiram para Pátara. Ali encontraram um navio que fazia a travessia para a Fenícia, embarcaram e zarparam."
      de: "Von Rhodos fuhren sie weiter nach Patara. Dort fanden sie ein Schiff, das nach Phönizien hinüberfuhr, gingen an Bord und segelten ab."
      fr: "De Rhodes, ils allèrent à Patara. Là, ils trouvèrent un navire qui faisait la traversée vers la Phénicie, montèrent à bord et partirent."
      pl: "Z Rodos popłynęli dalej do Patara. Znalazłszy tam okręt płynący do Fenicji, weszli na pokład i odpłynęli."
      it: "Da Rodi proseguirono per Patara. Lì trovarono una nave che faceva la traversata per la Fenicia, salirono a bordo e salparono."
      nl: "Van Rhodos voeren zij verder naar Patara. Daar vonden zij een schip dat naar Fenicië overvoer, gingen aan boord en voeren af."
      cs: "Z Rhodu pluli dál do Patar. Tam nalezli loď plující do Fénicie, nastoupili a vypluli."
      sv: "Från Rhodos fortsatte de till Patara. Där fann de ett skepp som skulle över till Fenicien, gick ombord och lade ut."
      nb: "Fra Rhodos dro de videre til Patara. Der fant de et skip som skulle over til Fønikia, gikk om bord og seilte av sted."
      tl: "Mula sa Rodas ay nagpatuloy sila sa Patara. Doon ay nakasumpong sila ng isang daong na tumatawid patungong Fenicia, sumakay at naglayag."
      da: "Fra Rhodos drog de videre til Patara. Der fandt de et skib, der skulle over til Fønikien, gik om bord og sejlede af sted."
      sr: "С Родоса су продужили до Патаре. Тамо су нашли лађу која прелази у Феникију, укрцали се и отпловили."
      hu: "Rodoszról továbbmentek Patarába. Ott egy Föníciába átkelő hajót találtak, beszálltak, és elhajóztak."
      fi: "Rodokselta he jatkoivat Pataraan. Siellä he löysivät Foinikiaan menevän laivan, astuivat siihen ja lähtivät purjehtimaan."
      vi: "Từ Rô-đơ họ đi tiếp đến Ba-ta-ra. Tại đó họ tìm được một chiếc tàu sang xứ Phê-ni-xi, bèn xuống tàu mà đi."
      ro: "De la Rodos au mers mai departe la Patara. Acolo au găsit o corabie care trecea în Fenicia, s-au urcat pe ea și au pornit pe mare."
      bg: "От Родос продължиха до Патара. Там намериха кораб, който минаваше за Финикия, качиха се и отплаваха."
