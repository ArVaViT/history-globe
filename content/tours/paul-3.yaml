# Paul's third missionary journey, Acts 18:23–21:17. Named towns only, in the order of the
# text; regions crossed in passing (Galatia and Phrygia, Macedonia, Greece) are left out, and
# the leg to Philippi, months through them, is marked untold: no walking time is guessed.
# Trogyllium (Acts 20:15) is omitted: it is absent from part of the manuscript tradition.
# Year approximate. Source for the stop list: research note 16, section 4.3.
id: paul-3
title:
  en: "Paul's third journey"
  ru: "Третье путешествие Павла"
  uk: "Третя подорож Павла"
  es: "El tercer viaje de Pablo"
  pt: "A terceira viagem de Paulo"
  de: "Die dritte Reise des Paulus"
  fr: "Le troisième voyage de Paul"
year: "AD 54"
people: ["Paul@Act.7.58-2Pe"]
approximate: true
