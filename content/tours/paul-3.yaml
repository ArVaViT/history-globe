    year: "AD 57"
    sailed: { days: 1, ref: Acts.20.15 }
    note:
      en: "Opposite Chios."
      ru: "Против Хиоса."
      uk: "Навпроти Хіоса."
      es: "Frente a Quíos."
      pt: "Defronte de Quios."
      de: "Gegenüber von Chios."
      fr: "En face de Chios."
      pl: "Naprzeciw Chios."
      it: "Di fronte a Chio."
      nl: "Tegenover Chios."
      cs: "Naproti Chiu."
      sv: "Mitt emot Chios."
      nb: "Ut for Khios."
      tl: "Sa tapat ng Chio."
      da: "Ud for Chios."
      sr: "Према Хиосу."
      hu: "Khiosszal szemben."
      fi: "Khioksen kohdalla."
      vi: "Đối ngang Chi-ô."
      ro: "În dreptul insulei Chios."
      bg: "Срещу Хиос."
    story:
      en: "Sailing from there, the next day they arrived off Chios, the large island of the eastern Aegean parted from the mainland by a narrow strait; Acts does not say that they landed."
      ru: "Отплыв оттуда, на следующий день они оказались против Хиоса, большого острова восточной части Эгейского моря, отделённого от материка узким проливом; Деяния не говорят, что они высаживались."
      uk: "Відпливши звідти, наступного дня вони опинилися навпроти Хіоса, великого острова в східній частині Егейського моря, відокремленого від материка вузькою протокою; Дії не кажуть, що вони висаджувалися."
      es: "Navegando desde allí, al día siguiente llegaron frente a Quíos, la gran isla del Egeo oriental separada del continente por un estrecho angosto; los Hechos no dicen que desembarcaran."
      pt: "Navegando dali, no dia seguinte chegaram defronte de Quios, a grande ilha do Egeu oriental separada do continente por um estreito apertado; Atos não diz que desembarcaram."
      de: "Von dort segelten sie weiter und kamen am nächsten Tag auf die Höhe von Chios, der großen Insel der östlichen Ägäis, die durch eine schmale Meerenge vom Festland getrennt ist; die Apostelgeschichte sagt nicht, dass sie an Land gingen."
      fr: "Partis de là, ils arrivèrent le lendemain vis-à-vis de Chios, la grande île de l’Égée orientale séparée du continent par un étroit détroit ; les Actes ne disent pas qu’ils y débarquèrent."
      pl: "Odpłynąwszy stamtąd, nazajutrz znaleźli się naprzeciw Chios, dużej wyspy we wschodniej części Morza Egejskiego, oddzielonej od lądu stałego wąską cieśniną; Dzieje nie mówią, że przybili do brzegu."
      it: "Salpati di là, il giorno seguente giunsero di fronte a Chio, la grande isola dell’Egeo orientale separata dalla terraferma da uno stretto braccio di mare; gli Atti non dicono che vi sbarcarono."
      nl: "Vandaar varend kwamen zij de volgende dag ter hoogte van Chios, het grote eiland in het oosten van de Egeïsche Zee dat door een smalle zeestraat van het vasteland gescheiden is; Handelingen zegt niet dat zij aan land gingen."
      cs: "Odtud odpluli a druhý den se dostali naproti Chiu, velkému ostrovu ve východním Egejském moři, oddělenému od pevniny úzkým průlivem; Skutky neříkají, že by přistáli."
      sv: "De seglade därifrån och kom nästa dag mitt emot Chios, den stora ön i östra Egeiska havet, skild från fastlandet av ett smalt sund; Apostlagärningarna säger inte att de gick i land."
      nb: "Derfra seilte de og kom neste dag ut for Khios, den store øya i det østlige Egeerhavet som er skilt fra fastlandet av et smalt sund; Apostlenes gjerninger sier ikke at de gikk i land."
      tl: "Paglayag mula roon, nang sumunod na araw ay sumapit sila sa tapat ng Chio, ang malaking pulo sa silangang Aegeo na hinihiwalay sa kalupaan ng isang makitid na kipot; hindi sinasabi ng Mga Gawa na sila'y lumunsad."
      da: "Derfra sejlede de og nåede næste dag ud for Chios, den store ø i det østlige Ægæiske Hav, adskilt fra fastlandet af et smalt sund; Apostlenes Gerninger siger ikke, at de gik i land."
      sr: "Отпловивши оданде, сутрадан су стигли према Хиосу, великом острву источног Егејског мора, које од копна дели уски мореуз; Дела не кажу да су се искрцали."
      hu: "Onnan továbbhajózva másnap Khiosz elé értek, a keleti Égei-tenger nagy szigete elé, amelyet keskeny szoros választ el a szárazföldtől; az ApCsel nem mondja, hogy kikötöttek volna."
      fi: "Sieltä purjehdittuaan he saapuivat seuraavana päivänä Khioksen kohdalle; se on Egeanmeren itäosan suuri saari, jonka kapea salmi erottaa mantereesta. Apostolien teot ei kerro, että he olisivat nousseet maihin."
      vi: "Đi thuyền từ đó, ngày hôm sau họ đến ngang đảo Chi-ô, hòn đảo lớn ở miền đông biển Aegea, cách đất liền bởi một eo biển hẹp; sách Công vụ không nói họ có lên bờ."
      ro: "Navigând de acolo, a doua zi au ajuns în dreptul insulei Chios, insula mare din estul Mării Egee despărțită de continent printr-o strâmtoare îngustă; Faptele nu spun că ar fi debarcat."
      bg: "Като отплаваха оттам, на следващия ден пристигнаха срещу Хиос — големия остров в източната част на Егейско море, отделен от континента с тесен проток; Деяния не казват, че са слезли на брега."
