    story:
      en: "The next day they arrived at Samos, the island across a narrow strait from Mount Mycale on the coast of Asia Minor."
      ru: "На следующий день они пристали к Самосу, острову, отделённому узким проливом от горы Микале на побережье Малой Азии."
      uk: "Наступного дня вони прибули до Самоса, острова за вузькою протокою від гори Мікале на узбережжі Малої Азії."
      es: "Al día siguiente llegaron a Samos, la isla situada al otro lado de un estrecho angosto frente al monte Mícala, en la costa de Asia Menor."
      pt: "No dia seguinte chegaram a Samos, a ilha situada do outro lado de um estreito apertado, diante do monte Mícale, na costa da Ásia Menor."
      de: "Am nächsten Tag erreichten sie Samos, die Insel jenseits einer schmalen Meerenge gegenüber dem Berg Mykale an der Küste Kleinasiens."
      fr: "Le jour suivant, ils arrivèrent à Samos, l’île située de l’autre côté d’un étroit détroit, face au mont Mycale, sur la côte d’Asie Mineure."
      pl: "Następnego dnia przybyli do Samos, wyspy oddzielonej wąską cieśniną od góry Mykale na wybrzeżu Azji Mniejszej."
      it: "Il giorno dopo giunsero a Samo, l’isola separata da uno stretto braccio di mare dal monte Micale, sulla costa dell’Asia Minore."
      nl: "De volgende dag kwamen zij bij Samos, het eiland aan de overkant van een smalle zeestraat tegenover de berg Mykale aan de kust van Klein-Azië."
      cs: "Další den připluli k Samu, ostrovu, který od hory Mykalé na pobřeží Malé Asie odděluje úzký průliv."
      sv: "Nästa dag kom de till Samos, ön på andra sidan ett smalt sund från berget Mykale vid Mindre Asiens kust."
      nb: "Neste dag kom de til Samos, øya på den andre siden av et smalt sund fra fjellet Mykale på kysten av Lilleasia."
      tl: "Nang kinabukasan ay dumaong sila sa Samos, ang pulong nasa kabila ng isang makitid na kipot mula sa bundok Mycale sa baybayin ng Asia Minor."
      da: "Næste dag nåede de Samos, øen, der ligger over for bjerget Mykale på Lilleasiens kyst på den anden side af et smalt sund."
      sr: "Сутрадан су стигли до Самоса, острва које уски мореуз дели од планине Микале на обали Мале Азије."
      hu: "Másnap Számoszhoz érkeztek, ahhoz a szigethez, amely egy keskeny szoroson túl fekszik a kis-ázsiai parton álló Mükalé-hegygyel szemben."
      fi: "Seuraavana päivänä he saapuivat Samokseen, saareen, jonka kapea salmi erottaa Vähän-Aasian rannikon Mykale-vuoresta."
      vi: "Ngày hôm sau họ ghé Sa-mốt, hòn đảo nằm bên kia một eo biển hẹp đối diện núi Mycale trên bờ biển Tiểu Á."
      ro: "A doua zi au ajuns la Samos, insula despărțită printr-o strâmtoare îngustă de muntele Micale, de pe coasta Asiei Mici."
      bg: "На следващия ден пристигнаха в Самос — острова, отделен с тесен проток от планината Микале на брега на Мала Азия."
  - place: a55027d
    ref: Acts.20.17-Acts.20.38
    by: sea
    year: "AD 57"
    sailed: { days: 1, ref: Acts.20.15 }
    note:
      en: "Farewell to the elders of Ephesus."
      ru: "Прощание с пресвитерами Ефесской церкви."
      uk: "Прощання зі старійшинами Ефеса."
      es: "Despedida de los ancianos de Éfeso."
      pt: "Despedida dos presbíteros de Éfeso."
      de: "Abschied von den Ältesten von Ephesus."
      fr: "Adieux aux anciens d’Éphèse."
      pl: "Pożegnanie ze starszymi z Efezu."
      it: "L’addio agli anziani di Efeso."
      nl: "Afscheid van de oudsten van Efeze."
      cs: "Rozloučení se staršími z Efezu."
      sv: "Avsked från de äldste i Efesos."
      nb: "Avskjed med de eldste fra Efesos."
      tl: "Pamamaalam sa mga matanda ng Efeso."
      da: "Afsked med de ældste fra Efesos."
      sr: "Опроштај од старешина ефеских."
      hu: "Búcsú az efezusi vénektől."
      fi: "Hyvästit Efesoksen vanhimmille."
      vi: "Lời từ biệt với các trưởng lão Ê-phê-sô."
      ro: "Despărțirea de prezbiterii din Efes."
      bg: "Сбогуване с ефеските презвитери."
    story:
      en: "The next day they came to Miletus, near the mouth of the Maeander, for Paul had decided to sail past Ephesus so as not to spend time in Asia: he was hurrying to be in Jerusalem, if possible, for the day of Pentecost. From Miletus he sent to Ephesus for the elders of the church. He reminded them how he had served the Lord among them with humility and tears, keeping back nothing that was useful, and said that he was going to Jerusalem bound in the spirit, not knowing what would befall him there, except that in every town the Holy Spirit warned him that chains and afflictions awaited him; they would see his face no more. He charged them to keep watch over the flock and recalled the words of the Lord Jesus, that it is more blessed to give than to receive. Then he knelt and prayed with them all; they wept, embraced him and went with him to the ship."
      ru: "На следующий день они пришли в Милит, близ устья Меандра, потому что Павел решил проплыть мимо Ефеса, чтобы не задерживаться в Асии: он спешил, если можно, быть в Иерусалиме к дню Пятидесятницы. Из Милита он послал в Ефес за пресвитерами церкви. Он напомнил им, как служил среди них Господу со смирением и слезами, не упуская ничего полезного, и сказал, что идёт в Иерусалим, связанный духом, не зная, что там с ним случится, кроме того, что Дух Святой во всех городах предупреждает его, что его ждут узы и скорби; они больше не увидят его лица. Он завещал им бодрствовать над стадом и напомнил слова Господа Иисуса о том, что блаженнее давать, нежели принимать. Затем он преклонил колени и помолился со всеми ними; они плакали, обнимали его и проводили до корабля."
      uk: "Наступного дня вони прийшли до Мілета, поблизу гирла Меандру, бо Павло вирішив пропливти повз Ефес, щоб не гаяти часу в Азії: він поспішав, якщо можна, бути в Єрусалимі на день П’ятдесятниці. З Мілета він послав до Ефеса по старійшин церкви. Він нагадав їм, як служив серед них Господеві з покорою і сльозами, не втаївши нічого корисного, і сказав, що йде до Єрусалима, зв’язаний духом, не знаючи, що там з ним станеться, хіба те, що в кожному місті Святий Дух остерігає його, що на нього чекають кайдани й утиски; вони більше не побачать його обличчя. Він доручив їм пильнувати стадо й нагадав слова Господа Ісуса, що блаженніше давати, ніж брати. Тоді він став на коліна й помолився з усіма ними; вони плакали, обіймали його й провели до корабля."
      es: "Al día siguiente llegaron a Mileto, cerca de la desembocadura del Meandro, porque Pablo había decidido pasar de largo Éfeso para no detenerse en Asia: se apresuraba para estar en Jerusalén, si era posible, el día de Pentecostés. Desde Mileto mandó llamar de Éfeso a los ancianos de la iglesia. Les recordó cómo había servido al Señor entre ellos con humildad y lágrimas, sin callar nada que fuera útil, y les dijo que iba a Jerusalén ligado en espíritu, sin saber lo que allí le sucedería, salvo que en cada ciudad el Espíritu Santo le advertía que le esperaban prisiones y tribulaciones; no volverían a ver su rostro. Les encargó velar por el rebaño y recordó las palabras del Señor Jesús, que es más bienaventurado dar que recibir. Luego se puso de rodillas y oró con todos ellos; lloraron, lo abrazaron y lo acompañaron a la nave."
      pt: "No dia seguinte chegaram a Mileto, perto da foz do Meandro, pois Paulo tinha decidido passar ao largo de Éfeso para não se demorar na Ásia: apressava-se para estar em Jerusalém, se possível, no dia de Pentecostes. De Mileto mandou chamar de Éfeso os presbíteros da igreja. Lembrou-lhes como tinha servido ao Senhor entre eles com humildade e lágrimas, sem deixar de anunciar nada que fosse útil, e disse que ia a Jerusalém constrangido pelo Espírito, sem saber o que lhe aconteceria ali, senão que em cada cidade o Espírito Santo o avisava de que prisões e aflições o esperavam; não veriam mais o seu rosto. Encarregou-os de vigiar o rebanho e lembrou as palavras do Senhor Jesus, de que é mais bem-aventurado dar do que receber. Depois ajoelhou-se e orou com todos eles; choraram, abraçaram-no e o acompanharam até o navio."
      de: "Am nächsten Tag kamen sie nach Milet, nahe der Mündung des Mäander, denn Paulus hatte beschlossen, an Ephesus vorbeizusegeln, um in Asien keine Zeit zu verlieren: Er eilte, um möglichst am Pfingsttag in Jerusalem zu sein. Von Milet aus sandte er nach Ephesus und ließ die Ältesten der Gemeinde rufen. Er erinnerte sie daran, wie er unter ihnen dem Herrn in Demut und mit Tränen gedient und nichts Nützliches zurückgehalten hatte, und sagte, er gehe im Geist gebunden nach Jerusalem, ohne zu wissen, was ihm dort begegnen werde, außer dass der Heilige Geist ihm in jeder Stadt bezeuge, dass Fesseln und Bedrängnisse auf ihn warteten; sie würden sein Angesicht nicht mehr sehen. Er trug ihnen auf, über die Herde zu wachen, und erinnerte an die Worte des Herrn Jesus, dass Geben seliger ist als Nehmen. Dann kniete er nieder und betete mit ihnen allen; sie weinten, umarmten ihn und begleiteten ihn zum Schiff."
      fr: "Le jour d’après, ils vinrent à Milet, près de l’embouchure du Méandre, car Paul avait résolu de passer devant Éphèse sans s’arrêter, pour ne pas perdre de temps en Asie : il se hâtait d’être à Jérusalem, si possible, le jour de la Pentecôte. De Milet, il envoya chercher à Éphèse les anciens de l’Église. Il leur rappela comment il avait servi le Seigneur parmi eux avec humilité et larmes, sans rien cacher de ce qui était utile, et dit qu’il allait à Jérusalem, lié par l’Esprit, sans savoir ce qui lui arriverait, sinon que dans chaque ville le Saint-Esprit l’avertissait que des liens et des tribulations l’attendaient ; ils ne verraient plus son visage. Il les chargea de veiller sur le troupeau et rappela les paroles du Seigneur Jésus, qu’il y a plus de bonheur à donner qu’à recevoir. Puis il se mit à genoux et pria avec eux tous ; ils pleurèrent, l’embrassèrent et l’accompagnèrent jusqu’au navire."
      pl: "Następnego dnia przybyli do Miletu, w pobliżu ujścia Meandra, gdyż Paweł postanowił minąć Efez, by nie tracić czasu w Azji: spieszył się, by być w Jerozolimie, jeśli to możliwe, na dzień Pięćdziesiątnicy. Z Miletu posłał do Efezu po starszych Kościoła. Przypomniał im, jak służył Panu wśród nich w pokorze i ze łzami, nie zatajając niczego, co pożyteczne, i powiedział, że idzie do Jerozolimy związany w duchu, nie wiedząc, co go tam spotka, poza tym, że w każdym mieście Duch Święty ostrzega go, że czekają go więzy i udręki; już nie zobaczą jego twarzy. Polecił im czuwać nad trzodą i przypomniał słowa Pana Jezusa, że szczęśliwiej jest dawać, niż brać. Potem ukląkł i modlił się z nimi wszystkimi; płakali, ściskali go i odprowadzili go na okręt."
      it: "Il giorno seguente giunsero a Mileto, presso la foce del Meandro, perché Paolo aveva deciso di oltrepassare Efeso per non perdere tempo in Asia: si affrettava per essere a Gerusalemme, se possibile, per il giorno della Pentecoste. Da Mileto mandò a chiamare a Efeso gli anziani della chiesa. Ricordò loro come aveva servito il Signore fra loro con umiltà e lacrime, senza tacere nulla di ciò che era utile, e disse che andava a Gerusalemme legato nello spirito, senza sapere ciò che gli sarebbe accaduto, se non che in ogni città lo Spirito Santo lo avvertiva che lo attendevano catene e tribolazioni; non avrebbero più visto il suo volto. Li esortò a vegliare sul gregge e ricordò le parole del Signore Gesù, che c’è più felicità nel dare che nel ricevere. Poi si inginocchiò e pregò con tutti loro; piansero, lo abbracciarono e lo accompagnarono alla nave."
      nl: "De volgende dag kwamen zij te Milete, bij de monding van de Meander, want Paulus had besloten Efeze voorbij te varen om geen tijd in Asia te verliezen: hij haastte zich om, zo mogelijk, op de Pinksterdag te Jeruzalem te zijn. Van Milete zond hij naar Efeze om de oudsten van de gemeente te ontbieden. Hij herinnerde hen eraan hoe hij onder hen de Heer had gediend met nederigheid en tranen, zonder iets achter te houden wat nuttig was, en zei dat hij, gebonden door de geest, naar Jeruzalem ging, zonder te weten wat hem daar zou overkomen, behalve dat de Heilige Geest hem in elke stad waarschuwde dat boeien en verdrukkingen hem wachtten; zij zouden zijn gezicht niet meer zien. Hij droeg hun op over de kudde te waken en herinnerde aan de woorden van de Heer Jezus, dat geven zaliger is dan ontvangen. Daarna knielde hij neer en bad met hen allen; zij weenden, omarmden hem en gingen met hem mee naar het schip."
      cs: "Další den přišli do Milétu nedaleko ústí Maiandru, protože se Pavel rozhodl plout kolem Efezu, aby neztrácel čas v Asii: spěchal, aby byl pokud možno o letnicích v Jeruzalémě. Z Milétu poslal do Efezu pro starší církve. Připomněl jim, jak mezi nimi sloužil Pánu s pokorou a se slzami a nezamlčel nic, co bylo užitečné, a řekl, že jde do Jeruzaléma svázán v duchu a neví, co ho tam potká, jen to, že ho Duch svatý v každém městě varuje, že ho čekají okovy a soužení; už jeho tvář neuvidí. Uložil jim bdít nad stádem a připomněl slova Pána Ježíše, že blaženější je dávat než brát. Potom poklekl a modlil se s nimi se všemi; plakali, objímali ho a doprovodili ho k lodi."
      sv: "Dagen därpå kom de till Miletos, nära Maiandros mynning, eftersom Paulus hade beslutat att segla förbi Efesos för att inte förlora tid i Asien: han skyndade sig för att om möjligt vara i Jerusalem på pingstdagen. Från Miletos sände han bud till Efesos efter församlingens äldste. Han påminde dem om hur han hade tjänat Herren bland dem med ödmjukhet och tårar och inte undanhållit något som var till nytta, och sade att han nu gick till Jerusalem, bunden i anden, utan att veta vad som skulle hända honom där, utom att den helige Ande i stad efter stad varnade honom för att bojor och lidanden väntade honom; de skulle inte mer se hans ansikte. Han förmanade dem att vaka över hjorden och påminde om Herren Jesu ord, att det är saligare att ge än att ta emot. Sedan föll han på knä och bad med dem alla; de grät, omfamnade honom och följde honom till skeppet."
      nb: "Dagen etter kom de til Milet, nær munningen av Maiandros, for Paulus hadde bestemt seg for å seile forbi Efesos så han ikke skulle bruke tid i Asia: han hastet for å være i Jerusalem på pinsedagen, om det var mulig. Fra Milet sendte han bud til Efesos etter menighetens eldste. Han minnet dem om hvordan han hadde tjent Herren blant dem med ydmykhet og tårer og ikke holdt tilbake noe som var til nytte, og sa at han nå dro til Jerusalem, bundet i ånden, uten å vite hva som skulle hende ham der, bortsett fra at Den hellige ånd i by etter by advarte ham om at lenker og trengsler ventet ham; de skulle ikke se hans ansikt mer. Han formante dem til å våke over hjorden og minnet om Herren Jesu ord om at det er saligere å gi enn å få. Så falt han på kne og ba med dem alle; de gråt, omfavnet ham og fulgte ham til skipet."
      tl: "Nang kinabukasan ay dumating sila sa Mileto, malapit sa bunganga ng Maeander, sapagka't ipinasiya ni Pablo na lampasan ang Efeso upang huwag maggugol ng panahon sa Asia: nagmamadali siya upang kung maaari ay nasa Jerusalem sa araw ng Pentecostes. Mula sa Mileto ay nagpasugo siya sa Efeso para sa mga matanda ng iglesia. Ipinaalaala niya sa kanila kung paano siya naglingkod sa Panginoon sa gitna nila nang may kababaang-loob at mga luha, na walang ipinagkait na anomang mapapakinabangan, at sinabi niyang siya'y pasasa Jerusalem na natatali sa espiritu, na hindi nalalaman ang mangyayari sa kaniya roon, maliban na sa bawat bayan ay binabalaan siya ng Espiritu Santo na naghihintay sa kaniya ang mga tanikala at mga kapighatian; hindi na nila makikita ang kaniyang mukha. Inatasan niya silang ingatan ang kawan at ipinaalaala ang mga salita ng Panginoong Jesus, na lalong mapalad ang magbigay kay sa tumanggap. Pagkatapos ay lumuhod siya at nanalanging kasama nilang lahat; nagsiiyak sila, niyakap siya at inihatid siya sa daong."
      da: "Dagen efter kom de til Milet nær Maiandros' munding, for Paulus havde besluttet at sejle forbi Efesos for ikke at bruge tid i Asien: han skyndte sig for om muligt at være i Jerusalem på pinsedagen. Fra Milet sendte han bud til Efesos efter menighedens ældste. Han mindede dem om, hvordan han havde tjent Herren iblandt dem i ydmyghed og under tårer og ikke holdt noget tilbage, som kunne være til gavn, og sagde, at han nu drog til Jerusalem, bundet af Ånden, uden at vide, hvad der skulle møde ham der, kun at Helligånden i hver by advarede ham om, at lænker og trængsler ventede ham; de skulle ikke mere se hans ansigt. Han pålagde dem at våge over hjorden og mindede om den Herre Jesu ord, at det er saligere at give end at tage. Så knælede han og bad med dem alle; de græd, omfavnede ham og fulgte ham til skibet."
      sr: "Сутрадан су дошли у Милет, близу ушћа Меандра, јер је Павле одлучио да проплови мимо Ефеса да се не би задржавао у Азији: журио је да, ако буде могуће, буде у Јерусалиму на дан Педесетнице. Из Милета је послао у Ефес по старешине цркве. Подсетио их је како је међу њима служио Господу са свом понизношћу и сузама, не прећутавши ништа што је корисно, и рекао да иде у Јерусалим свезан духом, не знајући шта ће га тамо снаћи, осим што му Дух Свети по свим градовима сведочи да га чекају окови и невоље; више неће видети његово лице. Наложио им је да пазе на стадо и подсетио их на речи Господа Исуса да је блаженије давати него примати. Затим је клекнуо и помолио се са свима њима; плакали су, грлили га и испратили до лађе."
      hu: "Másnap Milétoszba értek, a Maiandrosz torkolata közelében, mert Pál elhatározta, hogy Efezus mellett elhajózik, hogy ne töltsön időt Ázsiában: sietett, hogy ha lehet, pünkösd napjára Jeruzsálemben legyen. Milétoszból Efezusba küldött a gyülekezet véneiért. Emlékeztette őket, hogyan szolgálta köztük az Urat alázattal és könnyekkel, semmit sem tartva vissza, ami hasznos volt, és azt mondta, hogy a lélekben megkötözve megy Jeruzsálembe, nem tudva, mi éri ott, csak azt, hogy a Szentlélek minden városban figyelmezteti, hogy bilincsek és nyomorúságok várnak rá; többé nem látják az arcát. Meghagyta nekik, hogy vigyázzanak a nyájra, és felidézte az Úr Jézus szavait, hogy nagyobb boldogság adni, mint kapni. Aztán letérdelt, és imádkozott mindnyájukkal; sírtak, átölelték, és elkísérték a hajóhoz."
      fi: "Seuraavana päivänä he tulivat Miletokseen lähelle Maiandros-joen suuta, sillä Paavali oli päättänyt purjehtia Efesoksen ohi, ettei häneltä kuluisi aikaa Aasiassa: hän kiiruhti ollakseen, jos mahdollista, helluntaipäivänä Jerusalemissa. Miletoksesta hän lähetti Efesokseen sanan seurakunnan vanhimmille. Hän muistutti heitä siitä, kuinka hän oli palvellut Herraa heidän keskuudessaan nöyryydellä ja kyynelin salaamatta mitään, mikä oli hyödyllistä, ja sanoi lähtevänsä Jerusalemiin hengessä sidottuna tietämättä, mitä siellä kohtaisi, paitsi että Pyhä Henki jokaisessa kaupungissa varoitti häntä siitä, että kahleet ja ahdistukset odottivat häntä; he eivät enää näkisi hänen kasvojaan. Hän käski heitä valvomaan laumaa ja muistutti Herran Jeesuksen sanoista, että autuaampi on antaa kuin ottaa. Sitten hän polvistui ja rukoili heidän kaikkien kanssa; he itkivät, syleilivät häntä ja saattoivat hänet laivaan."
      vi: "Ngày hôm sau họ đến Mi-lê, gần cửa sông Maeander, vì Phao-lô đã quyết định đi thuyền qua trước Ê-phê-sô để khỏi mất thì giờ trong cõi A-si: ông vội vàng để kịp đến Giê-ru-sa-lem, nếu có thể, vào ngày lễ Ngũ tuần. Từ Mi-lê ông sai người đến Ê-phê-sô mời các trưởng lão Hội thánh. Ông nhắc họ rằng ông đã hầu việc Chúa giữa họ cách khiêm nhường và nhiều nước mắt, không giấu điều gì có ích, và nói rằng ông đang bị ràng buộc trong tâm linh mà đi đến Giê-ru-sa-lem, chẳng biết điều chi sẽ xảy đến cho mình ở đó, chỉ biết rằng trong mỗi thành Đức Thánh Linh bảo trước cho ông rằng xiềng xích và hoạn nạn đang đợi ông; họ sẽ chẳng thấy mặt ông nữa. Ông dặn họ coi sóc bầy chiên và nhắc lại lời của Đức Chúa Giê-su rằng ban cho thì có phước hơn là nhận lãnh. Rồi ông quỳ xuống cầu nguyện với hết thảy họ; họ khóc, ôm lấy ông và đưa ông xuống tàu."
      ro: "A doua zi au venit la Milet, lângă gura Meandrului, pentru că Pavel hotărâse să treacă pe lângă Efes, ca să nu zăbovească în Asia: se grăbea să fie la Ierusalim, dacă era cu putință, de ziua Cincizecimii. De la Milet a trimis la Efes după prezbiterii bisericii. Le-a amintit cum slujise Domnului printre ei cu smerenie și cu lacrimi, fără să ascundă nimic din ce era de folos, și le-a spus că merge la Ierusalim legat în duh, fără să știe ce i se va întâmpla acolo, afară de faptul că în fiecare cetate Duhul Sfânt îl înștiința că îl așteaptă lanțuri și necazuri; nu-i vor mai vedea fața. I-a îndemnat să vegheze asupra turmei și le-a amintit cuvintele Domnului Isus, că este mai fericit a da decât a lua. Apoi a îngenuncheat și s-a rugat cu toți; ei au plâns, l-au îmbrățișat și l-au însoțit la corabie."
      bg: "На следващия ден дойдоха в Милит, близо до устието на Меандър, защото Павел беше решил да отмине Ефес, за да не губи време в Азия: той бързаше да бъде, ако е възможно, в Йерусалим за деня на Петдесетница. От Милит той изпрати в Ефес да повикат презвитерите на църквата. Припомни им как беше служил на Господа сред тях със смирение и сълзи, без да скрие нищо полезно, и каза, че отива в Йерусалим, вързан в духа си, без да знае какво ще го сполети там, освен че във всеки град Светият Дух го предупреждаваше, че го чакат окови и скърби; те нямаше да видят вече лицето му. Поръча им да бдят над стадото и припомни думите на Господа Исуса, че по-блажено е да дава човек, отколкото да взема. После коленичи и се помоли с всички тях; те плакаха, прегръщаха го и го изпратиха до кораба."
