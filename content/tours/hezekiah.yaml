# Hezekiah and Isaiah, 2 Kings 18-19, in the order of the text. The tour's year (701 BC)
# is Sennacherib's campaign, fixed by his annals; the fall of Samaria, which the text
# dates by Hezekiah's sixth year, shows 722 BC. The start of Hezekiah's reign is disputed
# (c. 729 or 715 BC), so his reform carries no year of its own. Sennacherib's death
# (2 Kgs 19:37) came twenty years later, in 681 BC (Babylonian Chronicle); the last stop
# stays at 701, when he went home.
id: hezekiah
title:
  en: "Hezekiah and Isaiah"
  ru: "Езекия и Исаия"
  uk: "Єзекія та Ісая"
  es: "Ezequías e Isaías"
  pt: "Ezequias e Isaías"
  de: "Hiskia und Jesaja"
  fr: "Ézéchias et Ésaïe"
  pl: "Ezechiasz i Izajasz"
  it: "Ezechia e Isaia"
  nl: "Chizkia en Jesaja"
  cs: "Chizkijáš a Izajáš"
  sv: "Hiskia och Jesaja"
  nb: "Hiskia og Jesaja"
  tl: "Si Ezechias at si Isaias"
  da: "Hizkija og Esajas"
  sr: "Језекија и Исаија"
  hu: "Ezékiás és Ézsaiás"
  fi: "Hiskia ja Jesaja"
  vi: "Ê-xê-chia và Ê-sai"
  ro: "Ezechia și Isaia"
  bg: "Езекия и Исаия"
year: "701 BC"
# Where the story happens, told of several people: no time on foot.
walked: false
people: ["Hezekiah@2Ki.16.20-Mat"]
approximate: true
stops:
  - place: a15257a # Jerusalem
    ref: 2Kgs.18.1-2Kgs.18.8
    note:
      en: "Hezekiah removes the high places and breaks the bronze serpent Nehushtan; he trusts in the Lord."
      ru: "Езекия отменяет высоты и истребляет медного змея Нехуштан; он уповает на Господа."
      uk: "Єзекія усуває жертовні висоти й розбиває мідного змія Нехуштана; він уповає на Господа."
      es: "Ezequías quita los lugares altos y hace pedazos la serpiente de bronce Nehustán; confía en el Señor."
      pt: "Ezequias remove os altos e despedaça a serpente de bronze Neustã; confia no Senhor."
      de: "Hiskia beseitigt die Höhen und zerbricht die eherne Schlange Nehuschtan; er vertraut auf den Herrn."
      fr: "Ézéchias supprime les hauts lieux et brise le serpent d’airain Nehuschtan ; il met sa confiance en l’Éternel."
      pl: "Ezechiasz usuwa wyżyny i kruszy miedzianego węża Nehusztana; ufa Panu."
      it: "Ezechia elimina gli alti luoghi e fa a pezzi il serpente di rame Nechustan; confida nel Signore."
      nl: "Chizkia ruimt de offerhoogten op en breekt de koperen slang Nechustan; hij vertrouwt op de HEER."
      cs: "Chizkijáš odstraňuje výsosti a láme měděného hada Nechuštana; doufá v Hospodina."
      sv: "Hiskia avskaffar offerhöjderna och krossar kopparormen Nehustan; han förtröstar på Herren."
      nb: "Hiskia fjerner offerhaugene og knuser kobberslangen Nehustan; han setter sin lit til Herren."
      tl: "Inaalis ni Ezechias ang mga mataas na dako at pinagputolputol ang ahas na tanso na tinatawag na Nehustan; nagtitiwala siya sa Panginoon."
      da: "Hizkija fjerner offerhøjene og knuser kobberslangen Nehustan; han stoler på Herren."
      sr: "Језекија уклања висине и ломи бронзану змију Неустан; уздаје се у Господа."
      hu: "Ezékiás eltávolítja a magaslatokat, és összetöri a rézkígyót, a Nehustánt; az Úrban bízik."
      fi: "Hiskia poistaa uhrikukkulat ja murskaa vaskikärmeen Nehustanin; hän luottaa Herraan."
      vi: "Ê-xê-chia phá hủy các nơi cao và đập bể con rắn đồng Nê-hu-tan; người tin cậy Đức Giê-hô-va."
      ro: "Ezechia îndepărtează înălțimile și sfărâmă șarpele de aramă Nehuștan; el se încrede în Domnul."
      bg: "Езекия премахва високите места и строшава медната змия Нехущан; той се уповава на Господа."
  - place: a041bb3 # Samaria
    ref: 2Kgs.18.9-2Kgs.18.12
    year: "722 BC"
    note:
      en: "In Hezekiah's sixth year Samaria is taken by the king of Assyria and Israel is carried away."
      ru: "В шестой год Езекии Самария взята царём Ассирийским, и Израиль переселён."
      uk: "На шостий рік Єзекії цар Ассирії здобуває Самарію, і Ізраїль виводять у полон."
      es: "En el sexto año de Ezequías el rey de Asiria toma Samaria, e Israel es llevado cautivo."
      pt: "No sexto ano de Ezequias, Samaria é tomada pelo rei da Assíria e Israel é levado cativo."
      de: "In Hiskias sechstem Jahr wird Samaria vom König von Assyrien eingenommen, und Israel wird weggeführt."
      fr: "La sixième année d’Ézéchias, Samarie est prise par le roi d’Assyrie et Israël est emmené en captivité."
      pl: "W szóstym roku Ezechiasza Samaria zostaje zdobyta przez króla Asyrii, a Izrael uprowadzony."
      it: "Nel sesto anno di Ezechia Samaria è presa dal re d’Assiria e Israele è deportato."
      nl: "In het zesde jaar van Chizkia wordt Samaria ingenomen door de koning van Assyrië en wordt Israël weggevoerd."
      cs: "V šestém roce Chizkijášově dobývá Samaří král asyrský a Izrael je odveden."
      sv: "I Hiskias sjätte år intas Samaria av Assyriens kung, och Israel förs bort."
      nb: "I Hiskias sjette år blir Samaria inntatt av kongen i Assyria, og Israel blir bortført."
      tl: "Sa ikaanim na taon ni Ezechias, nasasakop ng hari sa Asiria ang Samaria at dinadalang bihag ang Israel."
      da: "I Hizkijas sjette år indtages Samaria af Assyriens konge, og Israel føres bort."
      sr: "Шесте године Језекијине цар асирски осваја Самарију и Израиљ бива одведен."
      hu: "Ezékiás hatodik évében Asszíria királya elfoglalja Szamáriát, és Izráelt elhurcolják."
      fi: "Hiskian kuudentena vuonna Assyrian kuningas valtaa Samarian, ja Israel viedään pois."
      vi: "Vào năm thứ sáu đời Ê-xê-chia, Sa-ma-ri bị vua A-si-ri chiếm lấy và Y-sơ-ra-ên bị đày đi."
      ro: "În al șaselea an al lui Ezechia, Samaria este cucerită de regele Asiriei, iar Israel este dus în robie."
      bg: "В шестата година на Езекия Самария е превзета от асирийския цар и Израил е отведен в плен."
  - place: a3cc590 # Lachish
    ref: 2Kgs.18.13-2Kgs.18.16
    note:
      en: 'Sennacherib takes the fortified cities of Judah; Hezekiah sends to him at Lachish, "I have offended", and pays the tribute laid on him.'
      ru: "Сеннахирим берёт укреплённые города Иуды; Езекия посылает к нему в Лахис: «виновен я», и платит наложенную дань."
      uk: "Сінаххеріб здобуває укріплені міста Юди; Єзекія посилає до нього в Лахіш: «Я провинився» — і сплачує накладену на нього данину."
      es: "Senaquerib toma las ciudades fortificadas de Judá; Ezequías le envía a Laquis este mensaje: «Yo he pecado», y paga el tributo que se le impone."
      pt: "Senaqueribe toma as cidades fortificadas de Judá; Ezequias lhe envia mensageiros em Laquis: “Eu te ofendi”, e paga o tributo que lhe foi imposto."
      de: "Sanherib nimmt die festen Städte Judas ein; Hiskia sendet zu ihm nach Lachisch: „Ich habe mich versündigt“, und zahlt den Tribut, der ihm auferlegt wird."
      fr: "Sanchérib prend les villes fortes de Juda ; Ézéchias lui envoie dire à Lakis : « J’ai commis une faute », et paie le tribut qui lui est imposé."
      pl: "Sennacheryb zajmuje warowne miasta Judy; Ezechiasz posyła do niego do Lakisz: „Zgrzeszyłem”, i płaci nałożoną na niego daninę."
      it: "Sennacherib prende le città fortificate di Giuda; Ezechia manda a dirgli a Lachis: «Ho mancato», e paga il tributo che gli viene imposto."
      nl: "Sanherib neemt de versterkte steden van Juda in; Chizkia stuurt hem te Lachis de boodschap: “Ik heb gezondigd”, en betaalt de schatting die hem wordt opgelegd."
      cs: "Senacherib dobývá hrazená města Judská; Chizkijáš k němu posílá do Lachiše: „Zhřešilť jsem“, a platí uložený plat."
      sv: "Sanherib intar Judas befästa städer; Hiskia sänder bud till honom i Lakish: ”Jag har försyndat mig”, och betalar den tribut som läggs på honom."
      nb: "Sankerib inntar Judas befestede byer; Hiskia sender bud til ham i Lakisj: «Jeg har syndet», og betaler den skatt som blir lagt på ham."
      tl: "Sinasakop ni Sennacherib ang mga bayang may kuta ng Juda; nagsusugo si Ezechias sa kaniya sa Lachis: “Ako'y nagkasala”, at binabayaran ang buwis na ipinataw sa kaniya."
      da: "Sankerib indtager Judas befæstede byer; Hizkija sender bud til ham i Lakisj: »Jeg har syndet«, og betaler den tribut, der pålægges ham."
      sr: "Сенахирим осваја утврђене градове Јудине; Језекија шаље к њему у Лахис поруку: „Згрешио сам“, и плаћа наметнути данак."
      hu: "Szanhérib elfoglalja Júda erődített városait; Ezékiás követet küld hozzá Lákisba ezzel az üzenettel: „Vétkeztem”, és megfizeti a rárótt adót."
      fi: "Sanherib valtaa Juudan varustetut kaupungit; Hiskia lähettää hänelle Lakisiin sanan: ”Minä olen rikkonut”, ja maksaa hänelle määrätyn veron."
      vi: "San-chê-ríp chiếm các thành có đồn lũy của Giu-đa; Ê-xê-chia sai sứ đến người tại La-ki, nói: “Tôi phạm lỗi”, và nộp số cống mà người đã bắt phải trả."
      ro: "Senaherib ia cetățile întărite ale lui Iuda; Ezechia trimite la el la Lachiș: „greșit-am”, și plătește tributul pus asupra lui."
      bg: "Сенахирим превзема укрепените градове на Юда; Езекия изпраща да му кажат в Лахис: „Съгреших“, и плаща наложения му данък."
  - place: a15257a # Jerusalem
    ref: 2Kgs.18.17-2Kgs.19.7
    note:
      en: 'At the upper pool the Rabshakeh mocks Hezekiah and the Lord before the people on the wall; Isaiah answers: "Be not afraid of the words which thou hast heard."'
      ru: "У верхнего пруда Рабсак поносит Бога и Езекию перед народом на стене; Исаия отвечает: «не бойся слов, которые ты слышал»."
      uk: "Біля верхнього ставу Рабсак глузує з Єзекії та з Господа перед народом на мурі; Ісая відповідає: «Не лякайся тих речей, що чув єси»."
      es: "En el estanque de arriba el Rabsaces se burla de Ezequías y del Señor ante el pueblo que está sobre el muro; Isaías responde: «No temas por las palabras que has oído»."
      pt: "No tanque superior, o Rabsaqué zomba de Ezequias e do Senhor diante do povo que está na muralha; Isaías responde: “Não tenha medo das palavras que você ouviu.”"
      de: "Am oberen Teich verhöhnt der Rabsake Hiskia und den Herrn vor dem Volk auf der Mauer; Jesaja antwortet: „Fürchte dich nicht vor den Worten, die du gehört hast“."
      fr: "Près de l’étang supérieur, Rabschaké outrage Ézéchias et l’Éternel devant le peuple sur la muraille ; Ésaïe répond : « Ne t’effraie point des paroles que tu as entendues. »"
      pl: "U górnej sadzawki Rabszake szydzi z Ezechiasza i z Pana wobec ludu na murze; Izajasz odpowiada: „Nie bój się tych słów, któreś słyszał”."
      it: "Presso lo stagno superiore Rabsache schernisce Ezechia e il Signore davanti al popolo sulle mura; Isaia risponde: «Non ti spaventare per le parole che hai udite»."
      nl: "Bij de bovenste vijver bespot de Rabsake Chizkia en de HEER voor het volk op de muur; Jesaja antwoordt: “Vrees niet voor de woorden, die gij gehoord hebt.”"
      cs: "U horního rybníka se Rab-šake posmívá Chizkijášovi i Hospodinu před lidem na hradbě; Izajáš odpovídá: „Nestrachuj se slov těch, kteráž jsi slyšel.“"
      sv: "Vid övre dammen hånar Rab-Shake Hiskia och Herren inför folket på muren; Jesaja svarar: ”Frukta icke för de ord som du har hört.”"
      nb: "Ved den øvre dam håner Rabsjake Hiskia og Herren for folket på muren; Jesaja svarer: «Frykt ikke for de ord du hørte»."
      tl: "Sa Mataas na Tangke, tinutuya ng Rabsaces si Ezechias at ang Panginoon sa harap ng bayan sa pader; sumasagot si Isaias: “Huwag kang matakot sa mga salita na iyong narinig.”"
      da: "Ved den øvre dam håner Rabsjake Hizkija og Herren for folket på muren; Esajas svarer: »Frygt ikke for de Ord, som du hørte«."
      sr: "Код горње баре Равсак се руга Језекији и Господу пред народом на зиду; Исаија одговара: „Не плаши се од речи које си чуо.“"
      hu: "A Felső-tónál Rabsaké gyalázza Ezékiást és az Urat a falon álló nép előtt; Ézsaiás így felel: „Ne félj a beszédektől, a melyeket hallottál.”"
      fi: "Ylälammikolla Rabsake pilkkaa Hiskiaa ja Herraa muurilla olevan kansan kuullen; Jesaja vastaa: ”Älä pelkää niitä sanoja, jotka olet kuullut…”"
      vi: "Tại ao trên, Ráp-sa-kê nhạo báng Ê-xê-chia và Đức Giê-hô-va trước mặt dân sự trên vách thành; Ê-sai đáp: “Chớ sợ hãi những lời các ngươi đã nghe.”"
      ro: "La iazul de sus, Rabșache îi batjocorește pe Ezechia și pe Domnul înaintea poporului de pe zid; Isaia răspunde: „să nu te sperii de cuvintele, care le-ai auzit”."
      bg: "При горния водоем Рабсак се подиграва на Езекия и на Господа пред народа на стената; Исаия отговаря: „Не бой се от думите които си чул“."
  - place: a97b595 # Libnah
    ref: 2Kgs.19.8
    note:
      en: "The Rabshakeh finds the king of Assyria warring against Libnah."
      ru: "Рабсак находит царя Ассирийского воюющим против Ливны."
      uk: "Рабсак застає царя Ассирії в поході проти Лівни."
      es: "El Rabsaces halla al rey de Asiria guerreando contra Libna."
      pt: "O Rabsaqué encontra o rei da Assíria em guerra contra Libna."
      de: "Der Rabsake trifft den König von Assyrien im Krieg gegen Libna an."
      fr: "Rabschaké trouve le roi d’Assyrie en guerre contre Libna."
      pl: "Rabszake zastaje króla Asyrii walczącego przeciw Libnie."
      it: "Rabsache trova il re d’Assiria in guerra contro Libna."
      nl: "De Rabsake treft de koning van Assyrië aan terwijl hij oorlog voert tegen Libna."
      cs: "Rab-šake nalézá krále asyrského, jak válčí proti Libně."
      sv: "Rab-Shake finner Assyriens kung i krig mot Livna."
      nb: "Rabsjake finner kongen i Assyria i krig mot Libna."
      tl: "Natatagpuan ng Rabsaces ang hari sa Asiria na nakikipagdigma laban sa Libna."
      da: "Rabsjake finder Assyriens konge i krig mod Libna."
      sr: "Равсак налази цара асирског где ратује против Ливне."
      hu: "Rabsaké úgy találja, hogy Asszíria királya Libna ellen hadakozik."
      fi: "Rabsake tapaa Assyrian kuninkaan sotimassa Libnaa vastaan."
      vi: "Ráp-sa-kê gặp vua A-si-ri đang đánh Líp-na."
      ro: "Rabșache îl găsește pe regele Asiriei luptând împotriva Libnei."
      bg: "Рабсак намира асирийския цар да воюва против Ливна."
  - place: a15257a # Jerusalem
    ref: 2Kgs.19.14-2Kgs.19.34
    note:
      en: 'Hezekiah spreads the letter before the Lord and prays; Isaiah sends him the answer: "I will defend this city."'
      ru: "Езекия развертывает письмо пред Господом и молится; Исаия посылает ему ответ: «Я буду охранять город сей»."
      uk: "Єзекія розкладає листа перед Господом і молиться; Ісая посилає йому відповідь: «Город сей я берегти му»."
      es: "Ezequías extiende la carta ante el Señor y ora; Isaías le envía la respuesta: «yo ampararé á esta ciudad»."
      pt: "Ezequias estende a carta diante do Senhor e ora; Isaías lhe envia a resposta: “eu defenderei esta cidade”."
      de: "Hiskia breitet den Brief vor dem Herrn aus und betet; Jesaja sendet ihm die Antwort: „Ich will diese Stadt beschirmen“."
      fr: "Ézéchias étale la lettre devant l’Éternel et prie ; Ésaïe lui envoie la réponse : « Je protégerai cette ville. »"
      pl: "Ezechiasz rozkłada list przed Panem i modli się; Izajasz przesyła mu odpowiedź: „będę bronił miasta tego”."
      it: "Ezechia spiega la lettera davanti al Signore e prega; Isaia gli manda la risposta: «Io proteggerò questa città affin di salvarla»."
      nl: "Chizkia spreidt de brief voor de HEER uit en bidt; Jesaja stuurt hem het antwoord: “Want Ik zal deze stad beschermen.”"
      cs: "Chizkijáš rozprostírá list před Hospodinem a modlí se; Izajáš mu posílá odpověď: „chrániti budu města tohoto“."
      sv: "Hiskia breder ut brevet inför Herren och ber; Jesaja sänder honom svaret: ”jag skall beskärma och frälsa denna stad”."
      nb: "Hiskia legger brevet frem for Herren og ber; Jesaja sender ham svaret: «Jeg vil verne denne by»."
      tl: "Inilalatag ni Ezechias ang sulat sa harap ng Panginoon at nananalangin; ipinadadala sa kaniya ni Isaias ang sagot: “aking ipagsasanggalang ang bayang ito upang iligtas.”"
      da: "Hizkija breder brevet ud for Herren og beder; Esajas sender ham svaret: »Thi jeg vil beskærme denne Stad«."
      sr: "Језекија развија писмо пред Господом и моли се; Исаија му шаље одговор: „Јер ћу бранити тај град.“"
      hu: "Ezékiás kiteríti a levelet az Úr előtt, és imádkozik; Ézsaiás elküldi neki a választ: „megoltalmazom e várost”."
      fi: "Hiskia levittää kirjeen Herran eteen ja rukoilee; Jesaja lähettää hänelle vastauksen: ”minä varjelen tämän kaupungin”."
      vi: "Ê-xê-chia trải bức thư ra trước mặt Đức Giê-hô-va và cầu nguyện; Ê-sai gởi cho vua lời đáp: “ta sẽ binh vực thành này”."
      ro: "Ezechia întinde scrisoarea înaintea Domnului și se roagă; Isaia îi trimite răspunsul: „voiu apărà cetatea aceasta”."
      bg: "Езекия разгръща писмото пред Господа и се моли; Исаия му изпраща отговора: „ще защитя този град“."
  - place: a70fd5d # Nineveh
    ref: 2Kgs.19.35-2Kgs.19.37
    note:
      en: "After the angel of the Lord strikes the Assyrian camp, Sennacherib goes home and dwells at Nineveh; later his sons slay him as he worships in the house of Nisroch his god."
      ru: "Когда Ангел Господень поражает стан Ассирийский, Сеннахирим возвращается и живёт в Ниневии; позже сыновья убивают его, когда он поклоняется в доме Нисроха, бога своего."
      uk: "Після того як ангел Господній вражає ассирійський табір, Сінаххеріб повертається додому й оселяється в Ніневії; пізніше сини вбивають його, коли він поклоняється в домі свого бога Нісроха."
      es: "Después de que el ángel del Señor hiere el campamento asirio, Senaquerib vuelve a su tierra y habita en Nínive; más tarde sus hijos lo matan mientras adora en la casa de Nisroc, su dios."
      pt: "Depois que o anjo do Senhor fere o acampamento assírio, Senaqueribe volta para casa e habita em Nínive; mais tarde, seus filhos o matam enquanto ele adora na casa de Nisroque, seu deus."
      de: "Nachdem der Engel des Herrn das assyrische Lager geschlagen hat, zieht Sanherib heim und bleibt in Ninive; später erschlagen ihn seine Söhne, als er im Haus Nisrochs, seines Gottes, anbetet."
      fr: "Après que l’ange de l’Éternel a frappé le camp assyrien, Sanchérib s’en retourne et reste à Ninive ; plus tard ses fils le tuent pendant qu’il adore dans la maison de Nisroc, son dieu."
      pl: "Gdy anioł Pański uderza na obóz asyryjski, Sennacheryb wraca do domu i mieszka w Niniwie; później jego synowie zabijają go, gdy oddaje cześć w domu Nisroka, swego boga."
      it: "Dopo che l’angelo del Signore ha colpito l’accampamento assiro, Sennacherib torna a casa e abita a Ninive; più tardi i suoi figli lo uccidono mentre adora nella casa di Nisroc, suo dio."
      nl: "Nadat de engel van de HEER het Assyrische kamp heeft geslagen, gaat Sanherib naar huis en blijft te Nineve; later doden zijn zonen hem terwijl hij zich neerbuigt in het huis van Nisroch, zijn god."
      cs: "Poté, co anděl Hospodinův udeří na asyrský tábor, se Senacherib vrací domů a bydlí v Ninive; později ho synové zabijí, když se klaní v domě svého boha Nisroka."
      sv: "Sedan Herrens ängel har slagit Assyriens läger drar Sanherib hem och stannar i Nineve; senare dräper hans söner honom när han tillber i sin gud Nisroks tempel."
      nb: "Etter at Herrens engel har slått den assyriske leiren, drar Sankerib hjem og bor i Ninive; senere dreper hans sønner ham mens han tilber i sin guds Nisroks hus."
      tl: "Pagkatapos na saktan ng anghel ng Panginoon ang kampo ng mga Asirio, umuuwi si Sennacherib at tumatahan sa Ninive; pagkaraan, pinapatay siya ng kaniyang mga anak habang sumasamba sa bahay ni Nisroch na kaniyang dios."
      da: "Efter at Herrens engel har slået den assyriske lejr, vender Sankerib hjem og bor i Nineve; senere dræber hans sønner ham, mens han tilbeder i sin gud Nisroks hus."
      sr: "Пошто анђео Господњи удари у логор асирски, Сенахирим се враћа кући и пребива у Ниневији; касније га синови његови убијају док се клања у дому Нисрока, бога свог."
      hu: "Miután az Úr angyala megveri az asszír tábort, Szanhérib hazatér, és Ninivében lakik; később fiai megölik, amikor Nisrok, az ő istene templomában imádkozik."
      fi: "Kun Herran enkeli on lyönyt Assyrian leirin, Sanherib palaa kotiin ja asuu Niinivessä; myöhemmin hänen poikansa surmaavat hänet, kun hän rukoilee jumalansa Nisrokin huoneessa."
      vi: "Sau khi thiên sứ của Đức Giê-hô-va đánh trại quân A-si-ri, San-chê-ríp trở về và ở tại Ni-ni-ve; về sau các con trai người giết người khi người đang thờ lạy trong chùa Nít-róc, thần của mình."
      ro: "După ce îngerul Domnului lovește tabăra asiriană, Senaherib se întoarce acasă și locuiește la Ninive; mai târziu, fiii lui îl ucid pe când se închină în casa lui Nisroc, dumnezeul său."
      bg: "След като ангелът Господен поразява асирийския стан, Сенахирим се връща у дома и живее в Ниневия; по-късно синовете му го убиват, докато се покланя в дома на своя бог Нисрох."
