    note:
      en: "At Troas news comes that the church of Antioch is at peace. From here he writes to Philadelphia, to Smyrna and to Polycarp, and asks them to send a messenger to Antioch to rejoice with it."
      ru: "В Троаде приходит весть, что в Антиохийской церкви настал мир. Отсюда он пишет в Филадельфию, в Смирну и Поликарпу и просит послать в Антиохию вестника, чтобы порадоваться вместе с ней."
      uk: "У Троаді приходить звістка, що в антіохійській церкві настав мир. Звідси він пише до Філадельфії, до Смирни й до Полікарпа та просить їх послати посланця до Антіохії, щоб порадіти разом із нею."
      es: "En Troas le llega la noticia de que la Iglesia de Antioquía está en paz. Desde allí escribe a Filadelfia, a Esmirna y a Policarpo, y les pide que envíen un mensajero a Antioquía para alegrarse con ella."
      pt: "Em Trôade chega a notícia de que a igreja de Antioquia está em paz. De lá ele escreve a Filadélfia, a Esmirna e a Policarpo, e lhes pede que enviem um mensageiro a Antioquia para se alegrar com ela."
      de: "In Troas trifft die Nachricht ein, dass die Gemeinde von Antiochia Frieden hat. Von hier schreibt er nach Philadelphia, nach Smyrna und an Polykarp und bittet sie, einen Boten nach Antiochia zu senden, um sich mit ihr zu freuen."
      fr: "À Troas, la nouvelle arrive que l’Église d’Antioche est en paix. D’ici, il écrit à Philadelphie, à Smyrne et à Polycarpe, et leur demande d’envoyer un messager à Antioche pour se réjouir avec elle."
      pl: "W Troadzie dociera do niego wieść, że Kościół w Antiochii żyje w pokoju. Stąd pisze do Filadelfii, do Smyrny i do Polikarpa i prosi, by wysłali posłańca do Antiochii, aby się z nią cieszył."
      it: "A Troade giunge la notizia che la chiesa di Antiochia è in pace. Di qui scrive a Filadelfia, a Smirne e a Policarpo, e chiede loro di mandare un messaggero ad Antiochia per rallegrarsi con essa."
      nl: "In Troas komt het bericht dat de kerk van Antiochië vrede heeft. Vanhier schrijft hij aan Filadelfia, aan Smyrna en aan Polycarpus, en vraagt hun een bode naar Antiochië te sturen om zich met haar te verheugen."
      cs: "V Troadě přichází zpráva, že v antiochijské církvi nastal pokoj. Odtud píše do Filadelfie, do Smyrny a Polykarpovi a žádá je, aby poslali do Antiochie posla, který se bude radovat s tamní církví."
      sv: "I Troas når honom nyheten att Antiochias kyrka har fått frid. Därifrån skriver han till Filadelfia, till Smyrna och till Polykarpos, och ber dem sända ett sändebud till Antiochia för att glädjas tillsammans med den."
      nb: "I Troas kommer det beskjed om at menigheten i Antiokia har fred. Herfra skriver han til Filadelfia, til Smyrna og til Polykarp, og ber dem sende en budbringer til Antiokia for å glede seg sammen med den."
      tl: "Sa Troas ay dumarating ang balita na payapa na ang iglesia ng Antioquia. Mula rito ay sumusulat siya sa Filadelfia, sa Smirna at kay Policarpo, at hinihiling na magpadala sila ng isang sugo sa Antioquia upang makigalak dito."
      da: "I Troas kommer der bud om, at menigheden i Antiokia har fred. Herfra skriver han til Filadelfia, til Smyrna og til Polykarp og beder dem sende et sendebud til Antiokia for at glæde sig sammen med den."
      sr: "У Троади стиже вест да је црква у Антиохији у миру. Одавде пише црквама у Филаделфији и Смирни и Поликарпу, и тражи од њих да пошаљу гласника у Антиохију да се с њом радује."
      hu: "Troászban hír érkezik, hogy az antiókhiai egyház békében van. Innen ír a filadelfiaiaknak, a szmürnaiaknak és Polükarposznak, és megkéri őket, hogy küldjenek követet Antiókhiába, aki együtt örül az ottani egyházzal."
      fi: "Troaksessa tulee tieto, että Antiokian seurakunnalla on rauha. Täältä hän kirjoittaa Filadelfiaan, Smyrnaan ja Polykarpokselle ja pyytää heitä lähettämään sanansaattajan Antiokiaan iloitsemaan sen kanssa."
      vi: "Tại Trô-ách có tin Hội thánh An-ti-ốt đã được bình an. Từ đây ông viết cho Phi-la-đen-phi, cho Si-miệc-nơ và cho Polycarpus, và xin họ cử một sứ giả đến An-ti-ốt để cùng vui mừng với Hội thánh ấy."
      ro: "La Troa ajunge vestea că biserica Antiohiei este în pace. De aici scrie Filadelfiei, Smirnei și lui Policarp și îi roagă să trimită un sol la Antiohia ca să se bucure împreună cu ea."
      bg: "В Троада пристига вест, че църквата в Антиохия е в мир. Оттук той пише до Филаделфия, до Смирна и до Поликарп и ги моли да изпратят вестител в Антиохия да се радва заедно с нея."
  - place: a6a7150 # Neapolis
    source:
