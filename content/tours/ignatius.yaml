    note:
      en: "On the road through Asia he stops at Philadelphia. He later reminds the church how, when he was among them, he cried out with a loud voice: give heed to the bishop, the presbytery and the deacons."
      ru: "По дороге через Асию он останавливается в Филадельфии. Позже он напомнит этой церкви, как, будучи у них, взывал громким голосом: держитесь епископа, пресвитерства и диаконов."
      uk: "Дорогою через Азію він зупиняється у Філадельфії. Пізніше він нагадує тамтешній церкві, як, перебуваючи серед них, взивав гучним голосом: зважайте на єпископа, пресвітерство і дияконів."
      es: "En el camino por Asia se detiene en Filadelfia. Más tarde recuerda a la Iglesia cómo, estando entre ellos, clamó a gran voz: prestad atención al obispo, al presbiterio y a los diáconos."
      pt: "No caminho pela Ásia, ele para em Filadélfia. Mais tarde lembra à igreja como, quando esteve entre eles, clamou em alta voz: deem atenção ao bispo, ao presbitério e aos diáconos."
      de: "Auf dem Weg durch Asien hält er in Philadelphia an. Später erinnert er die Gemeinde daran, wie er, als er bei ihnen war, mit lauter Stimme rief: Haltet euch an den Bischof, das Presbyterium und die Diakone."
      fr: "Traversant l’Asie, il fait halte à Philadelphie. Il rappelle plus tard à cette Église comment, lorsqu’il était parmi eux, il a crié d’une voix forte : soyez attentifs à l’évêque, au presbytérium et aux diacres."
      pl: "W drodze przez Azję zatrzymuje się w Filadelfii. Później przypomina tamtejszemu Kościołowi, jak będąc wśród nich, wołał donośnym głosem: słuchajcie biskupa, prezbiterium i diakonów."
      it: "Lungo la strada attraverso l’Asia si ferma a Filadelfia. Più tardi ricorda a quella chiesa come, quando era tra loro, gridò a gran voce: date ascolto al vescovo, al presbiterio e ai diaconi."
      nl: "Op de weg door Asia houdt hij halt in Filadelfia. Later herinnert hij de kerk eraan hoe hij, toen hij bij hen was, met luide stem riep: geeft acht op de bisschop, het presbyterium en de diakens."
      cs: "Na cestě přes Asii se zastavuje ve Filadelfii. Později církvi připomíná, jak mezi nimi volal mocným hlasem: dbejte na biskupa, presbyterium a jáhny."
      sv: "På vägen genom Asien gör han uppehåll i Filadelfia. Senare påminner han församlingen om hur han, när han var hos dem, ropade med hög röst: håll er till biskopen, presbyteriet och diakonerna."
      nb: "På veien gjennom Asia gjør han opphold i Filadelfia. Senere minner han menigheten om hvordan han ropte med høy røst da han var blant dem: Gi akt på biskopen, presbyteriet og diakonene."
      tl: "Sa daan na tumatawid sa Asia ay humihinto siya sa Filadelfia. Kalaunan ay ipinaaalala niya sa iglesia kung paanong, nang nasa gitna nila siya, sumigaw siya ng malakas na tinig: makinig kayo sa obispo, sa presbiterio at sa mga diakono."
      da: "På vejen gennem Asia gør han holdt i Filadelfia. Senere minder han menigheden om, hvordan han, da han var iblandt dem, råbte med høj røst: giv agt på biskoppen, presbyteriet og diakonerne."
      sr: "На путу кроз Азију свраћа у Филаделфију. Касније подсећа тамошњу цркву како је, док је био међу њима, повикао великим гласом: пазите на епископа, презвитеријум и ђаконе."
      hu: "Ázsián át vezető útján Filadelfiában megáll. Később emlékezteti az egyházat, hogyan kiáltott fel közöttük hangos szóval: figyeljetek a püspökre, a presbitériumra és a diakónusokra."
      fi: "Matkalla Aasian halki hän pysähtyy Filadelfiaan. Myöhemmin hän muistuttaa seurakuntaa, kuinka hän heidän luonaan ollessaan huusi kovalla äänellä: kuunnelkaa piispaa, presbyteeristöä ja diakoneja."
      vi: "Trên đường qua xứ A-si, ông dừng lại ở Phi-la-đen-phi. Sau này ông nhắc Hội thánh rằng khi ở giữa họ, ông đã lớn tiếng kêu lên: hãy nghe theo giám mục, hội đồng trưởng lão và các chấp sự."
      ro: "Pe drumul prin Asia se oprește la Filadelfia. Mai târziu le amintește credincioșilor cum, pe când era printre ei, a strigat cu glas tare: luați aminte la episcop, la presbiteriu și la diaconi."
      bg: "На път през Азия той спира във Филаделфия. По-късно напомня на църквата как, когато е бил сред тях, е извикал с висок глас: слушайте епископа, презвитерството и дяконите."
  - place: a2e65fb # Smyrna
    source:
      cite:
        en: "Eusebius, Church History 3.36.5-6"
        ru: "Евсевий, Церковная история 3.36.5-6"
        uk: "Євсевій, Церковна історія 3.36.5-6"
