# Ignatius of Antioch on his way to the beasts at Rome, as his own letters and Polycarp's
# trace it: Philadelphia, Smyrna, Troas, Neapolis, Philippi. The year is approximate:
# Eusebius puts him under Trajan, and AD 107 is the date Jerome's version of his Chronicle
# gives; scholars range from about 105 to 115, some later. Each stop links the free translation of the
# Ante-Nicene and Nicene Fathers (public domain) at New Advent; its page holds the whole
# letter or book, and the cite gives the chapter. Not one way travelled on foot: part of it
# by sea.
