    note:
      en: "He is ordered to sail suddenly from Troas to Neapolis, the port where Paul had landed. With no time to write to every church, he asks Polycarp to write for him to the churches nearer Smyrna."
      ru: "Ему велено внезапно отплыть из Троады в Неаполь, порт, куда некогда приплыл и Павел. Не успевая написать всем церквам, он просит Поликарпа написать за него ближним к Смирне церквам."
      uk: "Йому раптово наказують відплисти з Троади до Неаполя, порту, де колись висадився Павло. Не маючи часу писати до кожної церкви, він просить Полікарпа написати замість нього церквам, ближчим до Смирни."
      es: "Se le ordena zarpar de improviso de Troas a Neápolis, el puerto donde había desembarcado Pablo. Sin tiempo para escribir a todas las iglesias, pide a Policarpo que escriba por él a las iglesias más cercanas a Esmirna."
      pt: "Recebe ordem de embarcar de repente em Trôade rumo a Neápolis, o porto onde Paulo havia desembarcado. Sem tempo de escrever a todas as igrejas, pede a Policarpo que escreva em seu nome às igrejas mais próximas de Esmirna."
      de: "Unvermittelt erhält er den Befehl, von Troas nach Neapolis abzusegeln, in den Hafen, in dem Paulus an Land gegangen war. Da ihm die Zeit fehlt, an alle Gemeinden zu schreiben, bittet er Polykarp, an seiner Stelle den näher bei Smyrna gelegenen Gemeinden zu schreiben."
      fr: "Il reçoit soudain l’ordre de s’embarquer à Troas pour Néapolis, le port où Paul avait débarqué. N’ayant pas le temps d’écrire à toutes les Églises, il demande à Polycarpe d’écrire à sa place aux Églises les plus proches de Smyrne."
      pl: "Otrzymuje nagły rozkaz wypłynięcia z Troady do Neapolis, portu, w którym niegdyś wylądował Paweł. Nie mając czasu pisać do wszystkich Kościołów, prosi Polikarpa, by napisał za niego do Kościołów leżących bliżej Smyrny."
      it: "Riceve l’ordine di salpare all’improvviso da Troade per Neapoli, il porto dove era sbarcato Paolo. Non avendo tempo di scrivere a tutte le chiese, chiede a Policarpo di scrivere per lui alle chiese più vicine a Smirne."
      nl: "Hij krijgt plotseling het bevel van Troas naar Neapolis te varen, de haven waar Paulus aan land was gegaan. Omdat hij geen tijd heeft om aan alle kerken te schrijven, vraagt hij Polycarpus namens hem te schrijven aan de kerken die dichter bij Smyrna liggen."
      cs: "Dostává rozkaz náhle odplout z Troady do Neapolis, přístavu, kde kdysi přistál Pavel. Protože nemá čas psát všem církvím, žádá Polykarpa, aby místo něho napsal církvím blíže Smyrně."
      sv: "Han får plötsligt order att segla från Troas till Neapolis, hamnen där Paulus hade gått i land. Utan tid att skriva till alla församlingar ber han Polykarpos att skriva å hans vägnar till de församlingar som ligger närmare Smyrna."
      nb: "Han får ordre om plutselig å seile fra Troas til Neapolis, havnen der Paulus hadde gått i land. Uten tid til å skrive til hver menighet ber han Polykarp skrive på hans vegne til menighetene nærmere Smyrna."
      tl: "Inuutusan siyang biglang maglayag mula Troas patungong Neapolis, ang daungan kung saan dumaong si Pablo. Dahil walang panahong sumulat sa bawat iglesia, hinihiling niya kay Policarpo na sumulat para sa kaniya sa mga iglesia na mas malapit sa Smirna."
      da: "Han får pludselig ordre til at sejle fra Troas til Neapolis, den havn, hvor Paulus var gået i land. Uden tid til at skrive til hver enkelt menighed beder han Polykarp skrive på hans vegne til menighederne nærmere Smyrna."
      sr: "Добија наређење да изненада отплови из Троаде у Неапољ, луку у којој је Павле био пристао. Пошто нема времена да пише свакој цркви, моли Поликарпа да уместо њега пише црквама ближим Смирни."
      hu: "Váratlanul parancsot kap, hogy Troászból hajózzon át Neapoliszba, abba a kikötőbe, ahol egykor Pál partra szállt. Mivel nincs ideje minden egyháznak írni, megkéri Polükarposzt, hogy helyette írjon a Szmürnához közelebbi egyházaknak."
      fi: "Häntä käsketään yhtäkkiä purjehtimaan Troaksesta Neapoliin, satamaan, jossa Paavali oli noussut maihin. Kun aikaa ei ole kirjoittaa jokaiselle seurakunnalle, hän pyytää Polykarposta kirjoittamaan puolestaan Smyrnaa lähempänä oleville seurakunnille."
      vi: "Ông được lệnh đột ngột xuống tàu từ Trô-ách đến Nê-a-bô-li, hải cảng nơi Phao-lô đã cập bến. Không còn thì giờ viết cho từng Hội thánh, ông xin Polycarpus thay ông viết cho các Hội thánh gần Si-miệc-nơ hơn."
      ro: "Primește porunca să plece pe neașteptate cu corabia de la Troa la Neapolis, portul unde debarcase Pavel. Neavând timp să scrie fiecărei biserici, îl roagă pe Policarp să scrie el, în locul lui, bisericilor mai apropiate de Smirna."
      bg: "Нареждат му внезапно да отплава от Троада за Неапол, пристанището, където някога е слязъл Павел. Понеже няма време да пише до всяка църква, той моли Поликарп да пише вместо него до църквите по-близо до Смирна."
