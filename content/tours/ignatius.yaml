    note:
      en: "Ignatius, «the bishop of Syria», is sent in bonds from the east to the west. All the way to Rome he is bound to ten soldiers, whom he calls leopards."
      ru: "Игнатия, «епископа Сирии», в узах отправляют с востока на запад. Всю дорогу до Рима он скован с десятью воинами, которых называет леопардами."
      uk: "Ігнатія, «єпископа Сирії», відсилають у кайданах зі сходу на захід. Усю дорогу до Рима він прикутий до десяти воїнів, яких називає леопардами."
      es: "Ignacio, «el obispo de Siria», es enviado encadenado de oriente a occidente. Durante todo el camino hasta Roma está atado a diez soldados, a quienes llama leopardos."
      pt: "Inácio, “o bispo da Síria”, é enviado acorrentado do Oriente para o Ocidente. Durante todo o caminho até Roma está preso a dez soldados, a quem chama de leopardos."
      de: "Ignatius, „der Bischof von Syrien“, wird in Fesseln vom Osten in den Westen gebracht. Auf dem ganzen Weg nach Rom ist er an zehn Soldaten gefesselt, die er Leoparden nennt."
      fr: "Ignace, « l’évêque de Syrie », est envoyé enchaîné de l’Orient vers l’Occident. Pendant tout le trajet jusqu’à Rome, il est enchaîné à dix soldats, qu’il appelle des léopards."
      pl: "Ignacy, „biskup Syrii”, zostaje wysłany w kajdanach ze wschodu na zachód. Przez całą drogę do Rzymu jest przykuty do dziesięciu żołnierzy, których nazywa lampartami."
      it: "Ignazio, «il vescovo di Siria», è mandato in catene dall’oriente all’occidente. Per tutta la strada fino a Roma è legato a dieci soldati, che egli chiama leopardi."
      nl: "Ignatius, “de bisschop van Syrië”, wordt in boeien van het oosten naar het westen gestuurd. De hele weg naar Rome is hij geketend aan tien soldaten, die hij luipaarden noemt."
      cs: "Ignác, „biskup Sýrie“, je posílán v poutech z východu na západ. Po celou cestu do Říma je připoután k deseti vojákům, které nazývá leopardy."
      sv: "Ignatios, ”biskopen av Syrien”, sänds i bojor från öster till väster. Hela vägen till Rom är han bunden vid tio soldater, som han kallar leoparder."
      nb: "Ignatios, «biskopen i Syria», sendes i lenker fra øst til vest. Hele veien til Roma er han bundet til ti soldater, som han kaller leoparder."
      tl: "Si Ignacio, “ang obispo ng Siria”, ay ipinadadala nang nakagapos mula sa silangan patungong kanluran. Sa buong daan patungong Roma ay nakagapos siya sa sampung kawal, na tinatawag niyang mga leopardo."
      da: "Ignatius, »biskoppen i Syrien«, sendes lænket fra øst mod vest. Hele vejen til Rom er han bundet til ti soldater, som han kalder leoparder."
      sr: "Игњатије, „епископ Сирије“, бива послат у оковима с истока на запад. Целим путем до Рима везан је за десет војника, које назива леопардима."
      hu: "Ignatioszt, „Szíria püspökét” láncra verve küldik keletről nyugatra. Egészen Rómáig tíz katonához van kötözve, akiket leopárdoknak nevez."
      fi: "Ignatios, ”Syyrian piispa”, lähetetään kahlittuna idästä länteen. Koko matkan Roomaan asti hän on sidottu kymmeneen sotilaaseen, joita hän kutsuu leopardeiksi."
      vi: "Ignatius, “giám mục của Sy-ri”, bị giải đi trong xiềng xích từ đông sang tây. Suốt đường đến Rô-ma, ông bị xích vào mười người lính, mà ông gọi là những con báo."
      ro: "Ignatie, „episcopul Siriei”, este trimis în lanțuri dinspre răsărit spre apus. Pe tot drumul până la Roma este legat de zece soldați, pe care îi numește leoparzi."
      bg: "Игнатий, „епископът на Сирия“, е изпратен окован от изток на запад. По целия път до Рим е вързан за десет войници, които нарича леопарди."
  - place: a1c7cc1 # Philadelphia
