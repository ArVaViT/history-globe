    note:
      en: "In Rome, as the report reached Eusebius, Ignatius becomes food for the wild beasts for his witness to Christ."
      ru: "В Риме, по преданию, которое дошло до Евсевия, Игнатий за свидетельство о Христе отдан на съедение зверям."
      uk: "У Римі, як дійшов переказ до Євсевія, Ігнатій стає їжею для диких звірів за своє свідчення про Христа."
      es: "En Roma, según la noticia que llegó a Eusebio, Ignacio se convierte en alimento de las fieras por su testimonio de Cristo."
      pt: "Em Roma, segundo o relato que chegou a Eusébio, Inácio se torna alimento para as feras por causa do seu testemunho de Cristo."
      de: "In Rom wird Ignatius nach der Überlieferung, die Eusebius erreichte, um seines Zeugnisses für Christus willen zur Speise der wilden Tiere."
      fr: "À Rome, selon le récit parvenu à Eusèbe, Ignace devient la pâture des bêtes sauvages pour son témoignage rendu au Christ."
      pl: "W Rzymie, według wieści, które dotarły do Euzebiusza, Ignacy staje się pokarmem dzikich zwierząt za swoje świadectwo o Chrystusie."
      it: "A Roma, secondo la notizia giunta a Eusebio, Ignazio diventa cibo per le belve per la sua testimonianza a Cristo."
      nl: "In Rome wordt Ignatius, volgens het bericht dat Eusebius bereikte, voedsel voor de wilde dieren omdat hij van Christus getuigt."
      cs: "V Římě se Ignác, jak se zpráva dostala k Eusebiovi, stává pro své svědectví o Kristu pokrmem divoké zvěře."
      sv: "I Rom blir Ignatios, enligt den berättelse som nådde Eusebios, föda åt vilddjuren för sitt vittnesbörd om Kristus."
      nb: "I Roma blir Ignatios, etter det Eusebios har hørt, føde for de ville dyrene på grunn av sitt vitnesbyrd om Kristus."
      tl: "Sa Roma, ayon sa balitang nakarating kay Eusebio, si Ignacio ay nagiging pagkain ng mababangis na hayop dahil sa kaniyang pagpapatotoo kay Cristo."
      da: "Ifølge den beretning, der nåede Eusebios, bliver Ignatius i Rom føde for de vilde dyr på grund af sit vidnesbyrd om Kristus."
      sr: "У Риму, како је вест допрла до Јевсевија, Игњатије постаје храна дивљим зверима због сведочења о Христу."
      hu: "Rómában, ahogy a hír Eusebioshoz eljutott, Ignatiosz a Krisztusról tett tanúságáért a vadállatok eledelévé lesz."
      fi: "Eusebioksen saaman tiedon mukaan Ignatios joutuu Roomassa petojen ruoaksi, koska hän todistaa Kristuksesta."
      vi: "Tại Rô-ma, theo lời tường thuật đến tai Eusebius, Ignatius trở thành mồi cho thú dữ vì lời làm chứng của ông về Đấng Christ."
      ro: "La Roma, după relatarea care a ajuns până la Eusebiu, Ignatie este dat hrană fiarelor sălbatice pentru mărturia sa despre Hristos."
      bg: "В Рим, според вестта, стигнала до Евсевий, Игнатий става храна на дивите зверове заради свидетелството си за Христос."
