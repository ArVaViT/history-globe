    note:
      en: "At Smyrna, where Polycarp is bishop, he writes to the churches of Ephesus, Magnesia and Tralles, and to Rome, begging the Christians there not to win his release and so rob him of martyrdom."
      ru: "В Смирне, где епископ — Поликарп, он пишет церквам Ефеса, Магнесии и Тралл, а также в Рим, умоляя тамошних христиан не добиваться его освобождения и не лишать его мученичества."
      uk: "У Смирні, де єпископом Полікарп, він пише церквам Ефеса, Магнесії й Тралл, а також до Рима, благаючи тамтешніх християн не виклопотувати йому звільнення й так не позбавляти його мучеництва."
      es: "En Esmirna, donde Policarpo es obispo, escribe a las iglesias de Éfeso, Magnesia y Trales, y a Roma, rogando a los cristianos de allí que no consigan su liberación y lo priven así del martirio."
      pt: "Em Esmirna, onde Policarpo é bispo, ele escreve às igrejas de Éfeso, de Magnésia e de Trales, e a Roma, suplicando aos cristãos dali que não consigam a sua libertação e assim o privem do martírio."
      de: "In Smyrna, wo Polykarp Bischof ist, schreibt er an die Gemeinden von Ephesus, Magnesia und Tralles sowie an Rom und bittet die Christen dort, seine Freilassung nicht zu erwirken und ihn so nicht des Martyriums zu berauben."
      fr: "À Smyrne, où Polycarpe est évêque, il écrit aux Églises d’Éphèse, de Magnésie et de Tralles, ainsi qu’à Rome, suppliant les chrétiens de cette ville de ne pas obtenir sa libération, ce qui le priverait du martyre."
      pl: "W Smyrnie, gdzie biskupem jest Polikarp, pisze do Kościołów w Efezie, Magnezji i Tralles oraz do Rzymu, błagając tamtejszych chrześcijan, by nie zabiegali o jego uwolnienie i tym samym nie odebrali mu męczeństwa."
      it: "A Smirne, dove Policarpo è vescovo, scrive alle chiese di Efeso, di Magnesia e di Tralle, e a Roma, pregando i cristiani di là di non ottenere la sua liberazione e di non privarlo così del martirio."
      nl: "In Smyrna, waar Polycarpus bisschop is, schrijft hij aan de kerken van Efeze, Magnesia en Tralles, en aan Rome, waar hij de christenen smeekt niet voor zijn vrijlating te zorgen, want dan zouden zij hem het martelaarschap ontnemen."
      cs: "Ve Smyrně, kde je biskupem Polykarp, píše církvím v Efezu, Magnésii a Trallech a také do Říma; tamější křesťany prosí, aby mu nevymáhali propuštění a nepřipravili ho tak o mučednictví."
      sv: "I Smyrna, där Polykarpos är biskop, skriver han till församlingarna i Efesos, Magnesia och Tralles, och till Rom, där han bönfaller de kristna att inte utverka hans frigivning och därmed beröva honom martyrdomen."
      nb: "I Smyrna, hvor Polykarp er biskop, skriver han til menighetene i Efesos, Magnesia og Tralles, og til Roma, og ber de kristne der om ikke å utvirke hans løslatelse og dermed frarøve ham martyrdøden."
      tl: "Sa Smirna, kung saan obispo si Policarpo, sumusulat siya sa mga iglesia ng Efeso, Magnesia at Tralles, at sa Roma, na nagsusumamo sa mga Cristiano roon na huwag nilang pagsikapang mapalaya siya at sa gayon ay maagaw sa kaniya ang pagkamartir."
      da: "I Smyrna, hvor Polykarp er biskop, skriver han til menighederne i Efesos, Magnesia og Tralles og til Rom, hvor han indtrængende beder de kristne om ikke at udvirke hans frigivelse og således berøve ham martyriet."
      sr: "У Смирни, где је Поликарп епископ, пише црквама у Ефесу, Магнезији и Тралу, као и Риму, молећи тамошње хришћане да му не издејствују ослобођење и тако га не лише мучеништва."
      hu: "Szmürnában, ahol Polükarposz a püspök, levelet ír az efezusi, magnésiai és tralleiszi egyházaknak, valamint a rómaiaknak, és könyörög az ottani keresztényeknek, hogy ne eszközöljék ki szabadon bocsátását, és így ne fosszák meg őt a vértanúságtól."
      fi: "Smyrnassa, jossa Polykarpos on piispa, hän kirjoittaa Efesoksen, Magnesian ja Tralleisin seurakunnille sekä Roomaan ja pyytää siellä olevia kristittyjä olemaan hankkimatta hänelle vapautusta ja riistämättä siten häneltä marttyyrikuolemaa."
      vi: "Tại Si-miệc-nơ, nơi Polycarpus làm giám mục, ông viết cho các Hội thánh ở Ê-phê-sô, Magnesia và Tralles, và cho Rô-ma, nài xin các tín hữu ở đó đừng vận động cho ông được thả mà cướp mất của ông sự tử đạo."
      ro: "La Smirna, unde Policarp este episcop, scrie bisericilor din Efes, Magnesia și Tralles, precum și Romei, rugându-i pe creștinii de acolo să nu încerce să-l elibereze, răpindu-i astfel martiriul."
      bg: "В Смирна, където Поликарп е епископ, той пише до църквите в Ефес, Магнезия и Тралес и до Рим, като умолява християните там да не му издействат освобождение и така да го лишат от мъченичеството."
