    note:
      en: "Polycarp later points the Philippians to the patience they saw with their own eyes in Ignatius, Zosimus and Rufus, and at their request sends them the letters of Ignatius."
      ru: "Поликарп позже напоминает филиппийцам о терпении, которое они видели своими глазами у Игнатия, Зосима и Руфа, и по их просьбе посылает им письма Игнатия."
      uk: "Пізніше Полікарп вказує филип’янам на терпеливість, яку вони бачили на власні очі в Ігнатієві, Зосимові й Руфові, і на їхнє прохання посилає їм листи Ігнатія."
      es: "Policarpo remite luego a los filipenses a la paciencia que vieron con sus propios ojos en Ignacio, Zósimo y Rufo, y, a petición suya, les envía las cartas de Ignacio."
      pt: "Policarpo mais tarde lembra aos filipenses a paciência que viram com os próprios olhos em Inácio, Zósimo e Rufo e, a pedido deles, envia-lhes as cartas de Inácio."
      de: "Polykarp weist die Philipper später auf die Geduld hin, die sie mit eigenen Augen an Ignatius, Zosimus und Rufus gesehen haben, und sendet ihnen auf ihre Bitte die Briefe des Ignatius."
      fr: "Polycarpe renvoie plus tard les Philippiens à la patience qu’ils ont vue de leurs propres yeux chez Ignace, Zosime et Rufus, et, à leur demande, leur envoie les lettres d’Ignace."
      pl: "Polikarp wskazuje później Filipianom cierpliwość, którą widzieli na własne oczy u Ignacego, Zozyma i Rufusa, i na ich prośbę przesyła im listy Ignacego."
      it: "Policarpo più tardi rimanda i Filippesi alla pazienza che essi videro con i propri occhi in Ignazio, Zosimo e Rufo, e, a loro richiesta, invia loro le lettere di Ignazio."
      nl: "Polycarpus wijst de Filippenzen later op het geduld dat zij met eigen ogen hebben gezien bij Ignatius, Zosimus en Rufus, en stuurt hun op hun verzoek de brieven van Ignatius."
      cs: "Polykarp později odkazuje Filipany na trpělivost, kterou na vlastní oči viděli u Ignáce, Zosima a Rufa, a na jejich žádost jim posílá Ignácovy listy."
      sv: "Polykarpos påminner senare filipperna om det tålamod de med egna ögon såg hos Ignatios, Zosimos och Rufus, och sänder dem på deras begäran Ignatios’ brev."
      nb: "Polykarp viser senere filipperne til den tålmodigheten de så med egne øyne hos Ignatios, Zosimos og Rufus, og sender dem på deres anmodning Ignatios' brev."
      tl: "Kalaunan ay itinuturo ni Policarpo sa mga taga-Filipos ang pagtitiis na nakita ng kanilang sariling mga mata kina Ignacio, Zosimo at Rufo, at sa kanilang kahilingan ay ipinadadala niya sa kanila ang mga liham ni Ignacio."
      da: "Polykarp henviser senere filipperne til den udholdenhed, de så med egne øjne hos Ignatius, Zosimos og Rufus, og sender dem på deres anmodning Ignatius' breve."
      sr: "Поликарп касније упућује Филипљане на трпљење које су својим очима видели код Игњатија, Зосима и Руфа, и на њихову молбу шаље им Игњатијева писма."
      hu: "Polükarposz később a filippiek elé állítja azt az állhatatosságot, amelyet saját szemükkel láttak Ignatioszban, Zószimoszban és Rufusban, és kérésükre elküldi nekik Ignatiosz leveleit."
      fi: "Polykarpos osoittaa myöhemmin filippiläisille sen kärsivällisyyden, jonka he näkivät omin silmin Ignatioksessa, Zosimoksessa ja Rufuksessa, ja lähettää heille heidän pyynnöstään Ignatioksen kirjeet."
      vi: "Sau này Polycarpus chỉ cho người Phi-líp thấy sự nhẫn nại mà chính mắt họ đã thấy nơi Ignatius, Zosimus và Rufus, và theo lời họ xin, gửi cho họ các thư của Ignatius."
      ro: "Mai târziu, Policarp le pune înainte filipenilor răbdarea pe care au văzut-o cu ochii lor la Ignatie, la Zosim și la Ruf și, la cererea lor, le trimite scrisorile lui Ignatie."
      bg: "По-късно Поликарп насочва филипяните към търпението, което са видели със собствените си очи у Игнатий, Зосим и Руф, и по тяхна молба им изпраща писмата на Игнатий."
