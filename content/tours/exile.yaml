# The fall of Jerusalem and the exile, 2 Kings 25 and Jeremiah 39-43, in the order of
# the text. Year: 587 or 586 BC (disputed), marked approximate. The map shows 587 BC,
# the year before the ruins begin in place-life.yaml, so Jerusalem still stands at the
# siege.
id: exile
title:
  en: "The fall of Jerusalem and the exile"
  ru: "Падение Иерусалима и плен"
  uk: "Падіння Єрусалима і вигнання"
  es: "La caída de Jerusalén y el destierro"
  pt: "A queda de Jerusalém e o exílio"
  de: "Der Fall Jerusalems und das Exil"
  fr: "La chute de Jérusalem et l’exil"
  pl: "Upadek Jerozolimy i wygnanie"
  it: "La caduta di Gerusalemme e l’esilio"
  nl: "De val van Jeruzalem en de ballingschap"
  cs: "Pád Jeruzaléma a vyhnanství"
  sv: "Jerusalems fall och landsflykten"
  nb: "Jerusalems fall og landflyktigheten"
  tl: "Ang pagbagsak ng Jerusalem at ang pagkatapon"
  da: "Jerusalems fald og landflygtigheden"
  sr: "Пад Јерусалима и прогонство"
  hu: "Jeruzsálem eleste és a számkivetés"
  fi: "Jerusalemin kukistuminen ja pakkosiirtolaisuus"
  vi: "Sự sụp đổ của Giê-ru-sa-lem và cuộc lưu đày"
  ro: "Căderea Ierusalimului și exilul"
  bg: "Падането на Йерусалим и изгнанието"
year: "587 BC"
approximate: true
stops:
  - place: a15257a # Jerusalem
    ref: 2Kgs.25.1-2Kgs.25.3
    note:
      en: "Nebuchadnezzar besieges Jerusalem until the famine prevails in the city."
      ru: "Навуходоносор осаждает Иерусалим, пока в городе не усиливается голод."
      uk: "Навуходоносор облягає Єрусалим, поки в місті не посилюється голод."
      es: "Nabucodonosor sitia Jerusalén hasta que el hambre se impone en la ciudad."
      pt: "Nabucodonosor cerca Jerusalém até que a fome se agrave na cidade."
      de: "Nebukadnezar belagert Jerusalem, bis der Hunger in der Stadt überhandnimmt."
      fr: "Nebucadnetsar assiège Jérusalem jusqu’à ce que la famine l’emporte dans la ville."
      pl: "Nabuchodonozor oblega Jerozolimę, aż głód zwycięża w mieście."
      it: "Nabucodonosor assedia Gerusalemme finché la fame prevale nella città."
      nl: "Nebukadnessar belegert Jeruzalem totdat de honger de overhand krijgt in de stad."
      cs: "Nebukadnesar obléhá Jeruzalém, dokud ve městě nezvítězí hlad."
      sv: "Nebukadnessar belägrar Jerusalem tills hungern tar överhand i staden."
      nb: "Nebukadnesar kringsetter Jerusalem til hungersnøden tar overhånd i byen."
      tl: "Kinukubkob ni Nabucodonosor ang Jerusalem hanggang sa lumala ang taggutom sa bayan."
      da: "Nebukadnezar belejrer Jerusalem, til hungersnøden tager overhånd i byen."
      sr: "Навуходоносор опседа Јерусалим док глад не надјача у граду."
      hu: "Nabukodonozor ostrom alá veszi Jeruzsálemet, míg az éhínség úrrá nem lesz a városban."
      fi: "Nebukadnessar piirittää Jerusalemia, kunnes nälkä käy kaupungissa ylivoimaiseksi."
      vi: "Nê-bu-cát-nết-sa vây Giê-ru-sa-lem cho đến khi nạn đói trở nên nặng nề trong thành."
      ro: "Nebucadnețar asediază Ierusalimul până când foametea pune stăpânire pe cetate."
      bg: "Навуходоносор обсажда Йерусалим, докато гладът в града надделява."
  - place: a231f80 # Jericho
    ref: 2Kgs.25.4-2Kgs.25.5
    note:
      en: "King Zedekiah flees and is caught on the plains of Jericho."
      ru: "Царь Седекия бежит и схвачен на равнинах Иерихонских."
      uk: "Цар Седекія тікає й потрапляє в полон на рівнинах Єрихону."
      es: "El rey Sedequías huye y es capturado en los llanos de Jericó."
      pt: "O rei Zedequias foge e é capturado nas planícies de Jericó."
      de: "König Zedekia flieht und wird in den Ebenen von Jericho ergriffen."
      fr: "Le roi Sédécias s’enfuit et est pris dans les plaines de Jéricho."
      pl: "Król Sedekiasz ucieka i zostaje schwytany na równinach Jerycha."
      it: "Il re Sedecia fugge e viene preso nelle pianure di Gerico."
      nl: "Koning Zedekia slaat op de vlucht en wordt gegrepen op de vlakten van Jericho."
      cs: "Král Sidkijáš utíká a je dopaden na pláních u Jericha."
      sv: "Kung Sidkia flyr och grips på Jerikos slätter."
      nb: "Kong Sidkia flykter og blir grepet på Jerikos sletter."
      tl: "Tumatakas si Haring Sedecias at inaabutan sa mga kapatagan ng Jerico."
      da: "Kong Zedekias flygter og indhentes på Jerikos sletter."
      sr: "Цар Седекија бежи и бива ухваћен у пољима јерихонским."
      hu: "Sedékiás király elmenekül, és Jerikó síkján elfogják."
      fi: "Kuningas Sidkia pakenee ja jää kiinni Jerikon tasangoilla."
      vi: "Vua Sê-đê-kia chạy trốn và bị bắt kịp trong đồng bằng Giê-ri-cô."
      ro: "Regele Zedechia fuge și este prins în câmpiile Ierihonului."
      bg: "Цар Седекия бяга и е заловен в Йерихонските полета."
  - place: ab2bde8 # Riblah
    ref: 2Kgs.25.6-2Kgs.25.7
    note:
      en: "Judgement at Riblah: Zedekiah's sons are killed and he is blinded."
      ru: "Суд в Ривле: сыновья Седекии убиты, сам он ослеплён."
      uk: "Суд у Рівлі: синів Седекії вбивають, а його осліплюють."
      es: "Juicio en Ribla: los hijos de Sedequías son muertos y a él lo ciegan."
      pt: "Julgamento em Ribla: os filhos de Zedequias são mortos e ele é cegado."
      de: "Gericht in Ribla: Zedekias Söhne werden getötet, und er wird geblendet."
      fr: "Jugement à Ribla : les fils de Sédécias sont mis à mort et lui-même est aveuglé."
      pl: "Wyrok w Ribli: synowie Sedekiasza zostają zabici, a on sam oślepiony."
      it: "Il giudizio a Ribla: i figli di Sedecia sono uccisi ed egli è accecato."
      nl: "Oordeel te Ribla: de zonen van Zedekia worden gedood en hij wordt verblind."
      cs: "Soud v Rible: Sidkijášovi synové jsou zabiti a on je oslepen."
      sv: "Dom i Rivla: Sidkias söner dödas och han förblindas."
      nb: "Dom i Ribla: Sidkias sønner blir drept, og han blir blindet."
      tl: "Ang paghatol sa Ribla: pinapatay ang mga anak ni Sedecias at binubulag siya."
      da: "Dom i Ribla: Zedekias' sønner dræbes, og han selv blindes."
      sr: "Суд у Ривли: Седекијини синови бивају убијени, а њему ваде очи."
      hu: "Ítélet Riblában: Sedékiás fiait megölik, őt magát pedig megvakítják."
      fi: "Tuomio Riblassa: Sidkian pojat tapetaan, ja hänet sokaistaan."
      vi: "Cuộc xét xử tại Ríp-la: các con trai Sê-đê-kia bị giết và vua bị móc mắt."
      ro: "Judecata de la Ribla: fiii lui Zedechia sunt uciși, iar lui îi sunt scoși ochii."
      bg: "Съд в Ривла: синовете на Седекия са убити, а той е ослепен."
  - place: a15257a # Jerusalem
    ref: 2Kgs.25.8-2Kgs.25.10
    note:
      en: "Nebuzar-adan burns the Temple, the palace and the city, and the army of the Chaldees pulls down the walls."
      ru: "Навузардан сжигает Храм, царский дом и город, а войско Халдейское разрушает стены."
      uk: "Навузардан спалює храм, палац і місто, а військо халдеїв руйнує мури."
      es: "Nabuzaradán incendia el Templo, el palacio y la ciudad, y el ejército de los caldeos derriba los muros."
      pt: "Nebuzaradã queima o Templo, o palácio e a cidade, e o exército dos caldeus derruba as muralhas."
      de: "Nebusaradan verbrennt den Tempel, den Palast und die Stadt, und das Heer der Chaldäer reißt die Mauern nieder."
      fr: "Nebuzaradan incendie le temple, le palais et la ville, et l’armée des Chaldéens démolit les murailles."
      pl: "Nebuzaradan pali świątynię, pałac i miasto, a wojsko Chaldejczyków burzy mury."
      it: "Nebuzaradan incendia il Tempio, il palazzo e la città, e l’esercito dei Caldei abbatte le mura."
      nl: "Nebuzaradan verbrandt de tempel, het paleis en de stad, en het leger van de Chaldeeën breekt de muren af."
      cs: "Nebuzaradan pálí chrám, palác i město a vojsko Chaldejců boří hradby."
      sv: "Nebusaradan bränner templet, palatset och staden, och kaldeernas här river ner murarna."
      nb: "Nebusaradan brenner templet, palasset og byen, og kaldeernes hær river ned murene."
      tl: "Sinusunog ni Nabuzaradan ang Templo, ang palasyo at ang bayan, at ibinabagsak ng hukbo ng mga Caldeo ang mga kuta."
      da: "Nebuzaradan brænder templet, paladset og byen, og kaldæernes hær river murene ned."
      sr: "Невузардан пали храм, двор и град, а војска халдејска руши зидове."
      hu: "Nebuzaradán felégeti a templomot, a palotát és a várost, a káldeusok serege pedig lerombolja a falakat."
      fi: "Nebusaradan polttaa temppelin, palatsin ja kaupungin, ja kaldealaisten sotajoukko repii muurit maahan."
      vi: "Nê-bu-xa-ra-đan đốt đền thờ, cung vua và cả thành, và đạo quân Canh-đê phá đổ các vách thành."
      ro: "Nebuzaradan arde Templul, palatul și cetatea, iar oastea haldeilor dărâmă zidurile."
      bg: "Навузардан изгаря храма, двореца и града, а халдейската войска събаря стените."
  - place: a217d18 # Babylon
    ref: 2Kgs.25.11
    note:
      en: "The rest of the people left in the city are carried into exile to Babylon."
      ru: "Народ, остававшийся в городе, уведён в плен в Вавилон."
      uk: "Решту народу, що залишилася в місті, виводять у вигнання до Вавилона."
      es: "El resto del pueblo que quedaba en la ciudad es llevado al destierro, a Babilonia."
      pt: "O restante do povo deixado na cidade é levado para o exílio na Babilônia."
      de: "Der Rest des Volkes, der in der Stadt übrig geblieben ist, wird nach Babylon ins Exil geführt."
      fr: "Le reste du peuple demeuré dans la ville est emmené en exil à Babylone."
      pl: "Reszta ludu pozostawiona w mieście zostaje uprowadzona na wygnanie do Babilonu."
      it: "Il resto del popolo rimasto nella città è condotto in esilio a Babilonia."
      nl: "De rest van het volk dat in de stad is achtergebleven, wordt in ballingschap naar Babylon weggevoerd."
      cs: "Zbytek lidu, který zůstal ve městě, je odvlečen do vyhnanství do Babylóna."
      sv: "Den återstående delen av folket i staden förs bort i landsflykt till Babylon."
      nb: "Resten av folket som var igjen i byen, blir ført i landflyktighet til Babylon."
      tl: "Ang nalabi sa bayan na naiwan sa lungsod ay dinadalang bihag sa Babilonia."
      da: "Resten af folket, som var blevet tilbage i byen, føres i landflygtighed til Babylon."
      sr: "Остатак народа, остао у граду, одводи се у прогонство у Вавилон."
      hu: "A városban maradt nép többi részét számkivetésbe viszik Babilonba."
      fi: "Kaupunkiin jäänyt muu kansa viedään pakkosiirtolaisuuteen Babyloniin."
      vi: "Phần dân sự còn lại trong thành bị đày qua Ba-by-lôn."
      ro: "Restul poporului rămas în cetate este dus în exil la Babilon."
      bg: "Останалият в града народ е отведен в изгнание във Вавилон."
  - place: a6d57ed # Ramah
    ref: Jer.40.1
    by: untold
    note:
      en: "At Ramah Jeremiah is set free from among the captives."
      ru: "В Раме Иеремия освобождён из числа пленников."
      uk: "У Рамі Єремію звільняють з-поміж полонених."
      es: "En Ramá Jeremías es puesto en libertad de entre los cautivos."
      pt: "Em Ramá, Jeremias é libertado do meio dos cativos."
      de: "In Rama wird Jeremia aus den Gefangenen freigelassen."
      fr: "À Rama, Jérémie est libéré du milieu des captifs."
      pl: "W Ramie Jeremiasz zostaje uwolniony spośród jeńców."
      it: "A Rama Geremia è messo in libertà di mezzo ai prigionieri."
      nl: "Te Rama wordt Jeremia uit de gevangenen vrijgelaten."
      cs: "V Rámě je Jeremjáš propuštěn z řad zajatců."
      sv: "I Rama blir Jeremia frigiven bland de fångna."
      nb: "I Rama blir Jeremia satt fri blant fangene."
      tl: "Sa Rama, pinalalaya si Jeremias mula sa mga bihag."
      da: "I Rama sættes Jeremias fri blandt de bortførte."
      sr: "У Рами Јеремија бива пуштен на слободу из реда заробљеника."
      hu: "Rámában Jeremiást kiszabadítják a foglyok közül."
      fi: "Ramassa Jeremia vapautetaan vankien joukosta."
      vi: "Tại Ra-ma, Giê-rê-mi được thả khỏi giữa các phu tù."
      ro: "La Rama, Ieremia este eliberat din mijlocul captivilor."
      bg: "В Рама Йеремия е освободен измежду пленниците."
  - place: a736f6c # Mizpah
    ref: Jer.40.6
    note:
      en: "He stays with Gedaliah, the governor, at Mizpah."
      ru: "Он остаётся у правителя Годолии в Массифе."
      uk: "Він залишається з Гедалією, намісником, у Міцпі."
      es: "Se queda con Gedalías, el gobernador, en Mizpa."
      pt: "Fica com Gedalias, o governador, em Mispá."
      de: "Er bleibt bei Gedalja, dem Statthalter, in Mizpa."
      fr: "Il demeure auprès de Guedalia, le gouverneur, à Mitspa."
      pl: "Zatrzymuje się u Gedaliasza, namiestnika, w Mispie."
      it: "Rimane con Godolia, il governatore, a Mizpa."
      nl: "Hij blijft bij Gedalja, de stadhouder, te Mizpa."
      cs: "Zůstává u správce Gedaljáše v Micpě."
      sv: "Han stannar hos ståthållaren Gedalja i Mispa."
      nb: "Han blir hos guvernøren Gedalja i Mispa."
      tl: "Tumitira siyang kasama ni Gedalias, ang tagapamahala, sa Mizpa."
      da: "Han bliver hos landshøvdingen Gedalja i Mispa."
      sr: "Остаје код Годолије, намесника, у Масфи."
      hu: "Gedaljánál, a helytartónál marad Micpában."
      fi: "Hän jää maaherra Gedaljan luo Mispaan."
      vi: "Người ở với Ghê-đa-lia, quan tổng đốc, tại Mích-ba."
      ro: "Rămâne cu Ghedalia, guvernatorul, la Mițpa."
      bg: "Той остава при управителя Годолия в Мицпа."
  - place: adb008c # Tahpanhes
    ref: Jer.43.7
    note:
      en: "After Gedaliah's murder the remnant flees to Egypt, to Tahpanhes."
      ru: "После убийства Годолии остаток народа бежит в Египет, в Тафнис."
      uk: "Після вбивства Гедалії залишок тікає до Єгипту, до Тафнісу."
      es: "Tras el asesinato de Gedalías el remanente huye a Egipto, a Tafnes."
      pt: "Depois do assassinato de Gedalias, o remanescente foge para o Egito, para Tafnes."
      de: "Nach der Ermordung Gedaljas flieht der Rest nach Ägypten, nach Tachpanhes."
      fr: "Après l’assassinat de Guedalia, le reste du peuple s’enfuit en Égypte, à Tachpanès."
      pl: "Po zabójstwie Gedaliasza reszta ludu ucieka do Egiptu, do Tachpanches."
      it: "Dopo l’uccisione di Godolia il resto del popolo fugge in Egitto, a Tafni."
      nl: "Na de moord op Gedalja vlucht het overblijfsel naar Egypte, naar Tachpanhes."
      cs: "Po Gedaljášově vraždě prchá zbytek do Egypta, do Tachpanchés."
      sv: "Efter Gedaljas mord flyr kvarlevan till Egypten, till Tachpanches."
      nb: "Etter Gedaljas drap flykter levningen til Egypt, til Tahpanhes."
      tl: "Pagkatapos paslangin si Gedalias, ang nalabi ay tumatakas patungong Egipto, sa Taphnes."
      da: "Efter mordet på Gedalja flygter levningen til Egypten, til Takpanes."
      sr: "После Годолијиног убиства остатак бежи у Египат, у Тафнес."
      hu: "Gedalja meggyilkolása után a maradék Egyiptomba menekül, Tahpanhészbe."
      fi: "Gedaljan murhan jälkeen jäännös pakenee Egyptiin, Tahpanhesiin."
      vi: "Sau khi Ghê-đa-lia bị giết, phần dân sót chạy qua Ê-díp-tô, đến Tác-pha-nết."
      ro: "După uciderea lui Ghedalia, rămășița fuge în Egipt, la Tahpanes."
      bg: "След убийството на Годолия остатъкът бяга в Египет, в Тафнис."
