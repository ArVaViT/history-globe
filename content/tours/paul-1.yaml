      fr: "Jean-Marc retourne à Jérusalem."
      pl: "Jan Marek wraca do Jerozolimy."
      it: "Giovanni Marco torna a Gerusalemme."
      nl: "Johannes Marcus keert terug naar Jeruzalem."
      cs: "Jan Marek se vrací do Jeruzaléma."
      sv: "Johannes Markus vänder tillbaka till Jerusalem."
      nb: "Johannes Markus vender tilbake til Jerusalem."
      tl: "Bumabalik si Juan Marcos sa Jerusalem."
      da: "Johannes Markus vender tilbage til Jerusalem."
      sr: "Јован Марко се враћа у Јерусалим."
      hu: "Márk János visszatér Jeruzsálembe."
      fi: "Johannes Markus palaa Jerusalemiin."
      vi: "Giăng Mác trở về Giê-ru-sa-lem."
      ro: "Ioan Marcu se întoarce la Ierusalim."
      bg: "Йоан Марко се връща в Йерусалим."
    story:
      en: "Paul and his company set sail from Paphos and came to Perga in Pamphylia, a city of the coastal plain of southern Asia Minor that, as Strabo says, was reached by sailing sixty stadia up the river Cestrus. There John left them and went back to Jerusalem. Acts gives no reason; later his leaving them in Pamphylia parted Paul and Barnabas."
      ru: "Павел и бывшие с ним отплыли из Пафа и прибыли в Пергию, в Памфилии, город на прибрежной равнине южной Малой Азии, до которого, как пишет Страбон, плыли шестьдесят стадий вверх по реке Кестр. Там Иоанн оставил их и вернулся в Иерусалим. Деяния не называют причины; позже то, что он оставил их в Памфилии, разлучило Павла и Варнаву."
      uk: "Павло та його супутники відпливли з Пафоса й прибули до Перге в Памфілії, міста на прибережній рівнині півдня Малої Азії, до якого, як каже Страбон, пливли шістдесят стадіїв угору річкою Кестр. Там Іван залишив їх і повернувся до Єрусалима. Дії не називають причини; згодом те, що він залишив їх у Памфілії, розвело Павла й Варнаву."
      es: "Pablo y sus compañeros zarparon de Pafos y llegaron a Perge de Panfilia, ciudad de la llanura costera del sur de Asia Menor a la que, según dice Estrabón, se llegaba navegando sesenta estadios río Cestro arriba. Allí Juan se separó de ellos y volvió a Jerusalén. Los Hechos no dan el motivo; más tarde, el hecho de que los hubiera dejado en Panfilia separó a Pablo y a Bernabé."
      pt: "Paulo e seus companheiros partiram de Pafos e chegaram a Perge, na Panfília, cidade da planície costeira do sul da Ásia Menor à qual, como diz Estrabão, se chegava navegando sessenta estádios rio Cestro acima. Ali João os deixou e voltou para Jerusalém. Atos não dá o motivo; mais tarde, o fato de ele os ter deixado na Panfília separou Paulo e Barnabé."
      de: "Paulus und seine Begleiter fuhren von Paphos ab und kamen nach Perge in Pamphylien, einer Stadt in der Küstenebene im Süden Kleinasiens, die man, wie Strabon sagt, erreichte, indem man sechzig Stadien den Fluss Kestros hinauffuhr. Dort trennte sich Johannes von ihnen und kehrte nach Jerusalem zurück. Die Apostelgeschichte nennt keinen Grund; später entzweite es Paulus und Barnabas, dass er sie in Pamphylien verlassen hatte."
      fr: "Paul et ses compagnons s’embarquèrent à Paphos et arrivèrent à Perge en Pamphylie, ville de la plaine côtière du sud de l’Asie Mineure que l’on atteignait, selon Strabon, en remontant le fleuve Cestros sur soixante stades. Là, Jean les quitta et retourna à Jérusalem. Les Actes n’en donnent pas la raison ; plus tard, ce départ en Pamphylie sépara Paul et Barnabas."
      pl: "Paweł i jego towarzysze odpłynęli z Pafos i przybyli do Perge w Pamfilii, miasta na nadbrzeżnej równinie południowej Azji Mniejszej, do którego, jak mówi Strabon, docierało się, płynąc sześćdziesiąt stadiów w górę rzeki Kestros. Tam Jan ich opuścił i wrócił do Jerozolimy. Dzieje nie podają przyczyny; później to, że opuścił ich w Pamfilii, poróżniło Pawła i Barnabę."
      it: "Paolo e i suoi compagni salparono da Pafo e giunsero a Perge di Panfilia, città della pianura costiera dell’Asia Minore meridionale che, come dice Strabone, si raggiungeva risalendo per sessanta stadi il fiume Cestro. Lì Giovanni li lasciò e tornò a Gerusalemme. Gli Atti non ne danno il motivo; più tardi il fatto che li avesse lasciati in Panfilia separò Paolo e Barnaba."
      nl: "Paulus en zijn metgezellen voeren af van Paffos en kwamen te Perge in Pamfylië, een stad in de kustvlakte van het zuiden van Klein-Azië die, zoals Strabo zegt, bereikt werd door zestig stadiën de rivier de Kestros op te varen. Daar verliet Johannes hen en keerde terug naar Jeruzalem. Handelingen noemt geen reden; later zou het feit dat hij hen in Pamfylië verlaten had, Paulus en Barnabas uiteendrijven."
      cs: "Pavel a jeho druhové odpluli z Pafosu a přišli do Perge v Pamfylii, města na pobřežní rovině jižní Malé Asie, kam se podle Strabóna připlouvalo šedesát stadií proti proudu řeky Kestros. Tam je Jan opustil a vrátil se do Jeruzaléma. Skutky neuvádějí důvod; později to, že je v Pamfylii opustil, rozdělilo Pavla a Barnabáše."
      sv: "Paulus och hans följeslagare avseglade från Pafos och kom till Perge i Pamfylien, en stad på kustslätten i södra Mindre Asien dit man, som Strabon säger, nådde genom att segla sextio stadier uppför floden Kestros. Där lämnade Johannes dem och vände tillbaka till Jerusalem. Apostlagärningarna anger inget skäl; senare blev det att han hade lämnat dem i Pamfylien orsaken till att Paulus och Barnabas skildes åt."
      nb: "Paulus og følget hans seilte fra Pafos og kom til Perge i Pamfylia, en by på kystsletten i det sørlige Lilleasia som man, slik Strabon sier, nådde ved å seile seksti stadier opp elven Kestros. Der forlot Johannes dem og vendte tilbake til Jerusalem. Apostlenes gjerninger oppgir ingen grunn; senere førte det at han hadde forlatt dem i Pamfylia, til at Paulus og Barnabas skiltes."
      tl: "Naglayag mula sa Pafos si Pablo at ang kaniyang mga kasama at dumating sa Perga ng Pamfilia, isang lungsod sa kapatagang baybayin ng timugang Asia Minor na, ayon kay Strabo, ay nararating sa paglalayag nang animnapung estadia paakyat sa ilog Cestrus. Doon ay humiwalay sa kanila si Juan at bumalik sa Jerusalem. Walang ibinibigay na dahilan ang Mga Gawa; nang maglaon, ang paghiwalay niya sa kanila sa Pamfilia ang naging dahilan ng paghihiwalay nina Pablo at Bernabe."
      da: "Paulus og hans følgesvende sejlede fra Pafos og kom til Perge i Pamfylien, en by på kystsletten i det sydlige Lilleasien, som man ifølge Strabon nåede ved at sejle tres stadier op ad floden Kestros. Der forlod Johannes dem og vendte tilbage til Jerusalem. Apostlenes Gerninger angiver ingen grund; senere blev det, at han havde forladt dem i Pamfylien, årsag til, at Paulus og Barnabas skiltes."
      sr: "Павле и његово друштво отпловили су из Пафоса и дошли у Пергу у Памфилији, град на приобалној равници јужне Мале Азије до којег се, како каже Страбон, стизало пловећи шездесет стадија уз реку Кестар. Ту их је Јован оставио и вратио се у Јерусалим. Дела не наводе разлог; касније је то што их је оставио у Памфилији раставило Павла и Варнаву."
      hu: "Pál és kísérői Páfoszból elhajózva a pamfíliai Pergébe érkeztek, Kis-Ázsia déli part menti síkságának városába, amelyet, ahogy Sztrabón mondja, a Kesztrosz folyón hatvan stadionnyit felfelé hajózva lehetett elérni. Ott János elvált tőlük, és visszatért Jeruzsálembe. Az ApCsel nem mond okot; később az, hogy Pamfíliában elhagyta őket, elválasztotta Pált és Barnabást."
      fi: "Paavali seuralaisineen purjehti Pafoksesta ja tuli Pamfylian Pergeen, eteläisen Vähän-Aasian rannikkotasangon kaupunkiin, jonne Strabonin mukaan päästiin purjehtimalla kuusikymmentä stadionia ylös Kestros-jokea. Siellä Johannes erosi heistä ja palasi Jerusalemiin. Apostolien teot ei kerro syytä; myöhemmin se, että hän oli jättänyt heidät Pamfyliassa, erotti Paavalin ja Barnabaan toisistaan."
      vi: "Phao-lô và những người đi cùng xuống thuyền tại Ba-phô và đến Bẹt-giê xứ Bam-phi-ly, một thành thuộc đồng bằng ven biển miền nam Tiểu Á mà, theo Strabo, người ta đến được bằng cách đi thuyền ngược sông Cestrus sáu mươi stadia. Tại đó Giăng lìa họ và trở về Giê-ru-sa-lem. Sách Công vụ không nêu lý do; về sau, việc ông lìa họ tại Bam-phi-ly đã khiến Phao-lô và Ba-na-ba phân rẽ nhau."
      ro: "Pavel și însoțitorii lui au plecat pe mare de la Pafos și au ajuns la Perga Pamfiliei, un oraș de pe câmpia litorală din sudul Asiei Mici la care, după cum spune Strabon, se ajungea navigând șaizeci de stadii în susul râului Cestrus. Acolo Ioan i-a părăsit și s-a întors la Ierusalim. Faptele nu dau niciun motiv; mai târziu, faptul că i-a părăsit în Pamfilia i-a despărțit pe Pavel și pe Barnaba."
      bg: "Павел и дружината му отплаваха от Пафос и стигнаха до Перга в Памфилия — град в крайбрежната равнина на Южна Мала Азия, до който, както казва Страбон, се стигало, като се плава шестдесет стадия нагоре по река Кестър. Там Йоан ги напусна и се върна в Йерусалим. Деяния не посочват причина; по-късно това, че ги беше напуснал в Памфилия, раздели Павел и Варнава."
  - place: a6c704a # Antioch in Pisidia
    ref: Acts.13.14-Acts.13.50
    note:
