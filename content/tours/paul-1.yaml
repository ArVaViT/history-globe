intro:
  en:
    - "Acts 13–14 tells how the church at Antioch in Syria sent out Barnabas and Saul, with John as their helper, on the first of the journeys of Paul that Acts follows. They sailed to Cyprus and crossed it from Salamis to Paphos, sailed on to Perga in Pamphylia, and went inland to Antioch in Pisidia, Iconium, Lystra and Derbe, towns of the Roman province of Galatia. Where there was a synagogue, as at Salamis, Antioch and Iconium, they spoke there first; at Antioch, turned away, they said they were turning to the Gentiles. From Derbe they went back through the same towns, appointing elders in every church, and sailed home from Attalia."
    - "Acts is the only account of the journey; the Second Letter to Timothy recalls the persecutions Paul suffered at Antioch, Iconium and Lystra. Many scholars think that Paul's Letter to the Galatians was written to the churches founded on it; others hold that it went to the Galatians of the north. Acts gives no year. The journey comes after the death of Herod Agrippa I in AD 44 (Acts 12) and before the council at Jerusalem (Acts 15), usually put about AD 49 or 50; the firmest date in Paul's life, Gallio's year as proconsul of Achaia in 51–52, known from an inscription at Delphi, falls a few years later. Reconstructions differ by a year or two (the Catholic Encyclopedia of 1911 gave 45–49), and the map shows the journey at AD 47."
    - "The text measures little of the time: the apostles stayed a long time at Iconium and, on their return, at Antioch. The travel times given with the stops are estimates of the days on the road and at sea, not of the journey with its stays."
  ru:
    - "Главы 13–14 Деяний рассказывают, как церковь в Антиохии Сирийской отправила Варнаву и Савла, с Иоанном в качестве помощника, в первое из путешествий Павла, о которых повествуют Деяния. Они отплыли на Кипр и прошли его от Саламина до Пафа, затем доплыли до Пергии, в Памфилии, и ушли в глубь страны — в Антиохию Писидийскую, Иконию, Листру и Дервию, города римской провинции Галатия. Там, где была синагога, как в Саламине, Антиохии и Иконии, они сначала говорили в ней; в Антиохии, отвергнутые, они сказали, что обращаются к язычникам. Из Дервии они вернулись через те же города, рукополагая пресвитеров в каждой церкви, и отплыли домой из Атталии."
    - "Деяния — единственный рассказ об этом путешествии; Второе послание к Тимофею вспоминает гонения, которые Павел претерпел в Антиохии, Иконии и Листре. Многие учёные считают, что Послание Павла к Галатам было написано церквям, основанным в этом путешествии; другие полагают, что оно было адресовано галатам на севере. Деяния не называют года. Путешествие приходится на время после смерти Ирода Агриппы I в 44 г. н. э. (Деян 12) и до Иерусалимского собора (Деян 15), который обычно относят примерно к 49 или 50 г. н. э.; самая твёрдая дата в жизни Павла — год проконсульства Галлиона в Ахаии, 51–52, известный по надписи из Дельф, — приходится на несколько лет позже. Реконструкции расходятся на год-два (Католическая энциклопедия 1911 года давала 45–49), и на карте путешествие показано под 47 г. н. э."
    - "Текст почти не отмеряет время: апостолы долго пробыли в Иконии, а на обратном пути — в Антиохии. Время в пути, указанное у остановок, — это оценка дней, проведённых на дороге и в море, а не всего путешествия вместе с пребыванием в городах."
  uk:
    - "Розділи 13–14 Дій розповідають, як церква в Антіохії Сирійській вирядила Варнаву й Савла, з Іваном як помічником, у першу з подорожей Павла, про які оповідають Дії. Вони відпливли на Кіпр і перетнули його від Саламіна до Пафоса, потім допливли до Перге в Памфілії й пішли вглиб країни — до Антіохії Пісідійської, Іконії, Лістри та Дервії, міст римської провінції Галатія. Там, де була синагога, як у Саламіні, Антіохії та Іконії, вони спершу говорили в ній; в Антіохії, відкинуті, вони сказали, що звертаються до язичників. З Дервії вони повернулися через ті самі міста, ставлячи старійшин у кожній церкві, і відпливли додому з Атталії."
    - "Дії — єдина розповідь про цю подорож; Друге послання до Тимофія згадує переслідування, яких Павло зазнав в Антіохії, Іконії та Лістрі. Багато вчених вважає, що Послання Павла до галатів написано церквам, заснованим під час цієї подорожі; інші гадають, що його адресовано галатам на півночі. Дії не називають року. Подорож припадає на час після смерті Ірода Агріппи I у 44 р. н. е. (Дії 12) і до Єрусалимського собору (Дії 15), який зазвичай відносять приблизно до 49 або 50 р. н. е.; найтвердіша дата в житті Павла — рік проконсульства Галліона в Ахаї, 51–52, відомий з напису в Дельфах, — припадає на кілька років пізніше. Реконструкції розходяться на рік-два (Католицька енциклопедія 1911 року подавала 45–49), і на мапі подорож показано під 47 р. н. е."
    - "Текст мало відмірює час: апостоли довго пробули в Іконії, а на зворотному шляху — в Антіохії. Час у дорозі, вказаний біля зупинок, — це оцінка днів, проведених у дорозі суходолом і на морі, а не всієї подорожі разом із перебуванням у містах."
  es:
    - "Hechos 13–14 cuenta cómo la iglesia de Antioquía de Siria envió a Bernabé y a Saulo, con Juan como ayudante, en el primero de los viajes de Pablo que sigue el libro de los Hechos. Navegaron a Chipre y la atravesaron de Salamina a Pafos, siguieron por mar hasta Perge de Panfilia y subieron tierra adentro a Antioquía de Pisidia, Iconio, Listra y Derbe, ciudades de la provincia romana de Galacia. Donde había sinagoga, como en Salamina, Antioquía e Iconio, hablaron primero allí; en Antioquía, rechazados, dijeron que se volvían a los gentiles. Desde Derbe volvieron por las mismas ciudades, constituyendo ancianos en cada iglesia, y regresaron por mar desde Atalia."
    - "Los Hechos son el único relato del viaje; la segunda carta a Timoteo recuerda las persecuciones que Pablo sufrió en Antioquía, Iconio y Listra. Muchos estudiosos creen que la carta de Pablo a los gálatas se escribió a las iglesias fundadas en este viaje; otros sostienen que fue dirigida a los gálatas del norte. Los Hechos no dan ningún año. El viaje es posterior a la muerte de Herodes Agripa I en el 44 d.C. (Hch 12) y anterior al concilio de Jerusalén (Hch 15), que suele situarse hacia el 49 o el 50 d.C.; la fecha más firme de la vida de Pablo, el año de Galión como procónsul de Acaya en 51–52, conocida por una inscripción de Delfos, cae unos años después. Las reconstrucciones difieren en uno o dos años (la Enciclopedia Católica de 1911 daba 45–49), y el mapa muestra el viaje en el 47 d.C."
    - "El texto mide poco el tiempo: los apóstoles se quedaron mucho tiempo en Iconio y, a su regreso, en Antioquía. Los tiempos de viaje indicados en las paradas son estimaciones de los días de camino y de navegación, no del viaje con sus estancias."
  pt:
    - "Atos 13–14 conta como a igreja de Antioquia da Síria enviou Barnabé e Saulo, com João como auxiliar, na primeira das viagens de Paulo que o livro de Atos acompanha. Navegaram para Chipre e atravessaram a ilha de Salamina a Pafos, seguiram por mar até Perge, na Panfília, e subiram para o interior, até Antioquia da Pisídia, Icônio, Listra e Derbe, cidades da província romana da Galácia. Onde havia sinagoga, como em Salamina, Antioquia e Icônio, falaram ali primeiro; em Antioquia, rejeitados, disseram que se voltavam para os gentios. De Derbe voltaram pelas mesmas cidades, designando presbíteros em cada igreja, e regressaram por mar a partir de Atália."
    - "Atos é o único relato da viagem; a Segunda Carta a Timóteo recorda as perseguições que Paulo sofreu em Antioquia, Icônio e Listra. Muitos estudiosos pensam que a Carta de Paulo aos Gálatas foi escrita às igrejas fundadas nessa viagem; outros sustentam que foi dirigida aos gálatas do norte. Atos não indica nenhum ano. A viagem é posterior à morte de Herodes Agripa I em 44 d.C. (At 12) e anterior ao concílio de Jerusalém (At 15), geralmente situado por volta de 49 ou 50 d.C.; a data mais segura da vida de Paulo, o ano de Gálio como procônsul da Acaia em 51–52, conhecida por uma inscrição de Delfos, cai alguns anos depois. As reconstruções diferem em um ou dois anos (a Enciclopédia Católica de 1911 indicava 45–49), e o mapa mostra a viagem em 47 d.C."
    - "O texto mede pouco o tempo: os apóstolos ficaram muito tempo em Icônio e, no regresso, em Antioquia. Os tempos de viagem indicados nas paradas são estimativas dos dias de estrada e de mar, não da viagem com as suas estadias."
  de:
    - "Apg 13–14 erzählt, wie die Gemeinde in Antiochia in Syrien Barnabas und Saulus mit Johannes als Gehilfen aussandte, auf die erste der Reisen des Paulus, denen die Apostelgeschichte folgt. Sie fuhren nach Zypern und durchzogen die Insel von Salamis bis Paphos, segelten weiter nach Perge in Pamphylien und zogen landeinwärts nach Antiochia in Pisidien, Ikonion, Lystra und Derbe, Städten der römischen Provinz Galatien. Wo es eine Synagoge gab, wie in Salamis, Antiochia und Ikonion, sprachen sie zuerst dort; in Antiochia sagten sie, als man sie abwies, sie wendeten sich zu den Heiden. Von Derbe aus kehrten sie durch dieselben Städte zurück, setzten in jeder Gemeinde Älteste ein und segelten von Attalia aus heim."
    - "Die Apostelgeschichte ist der einzige Bericht über die Reise; der zweite Brief an Timotheus erinnert an die Verfolgungen, die Paulus in Antiochia, Ikonion und Lystra erlitt. Viele Forscher meinen, dass der Brief des Paulus an die Galater an die auf dieser Reise gegründeten Gemeinden geschrieben wurde; andere halten dafür, dass er an die Galater im Norden ging. Die Apostelgeschichte nennt kein Jahr. Die Reise liegt nach dem Tod Herodes Agrippas I. im Jahr 44 n. Chr. (Apg 12) und vor dem Apostelkonzil in Jerusalem (Apg 15), das gewöhnlich um 49 oder 50 n. Chr. angesetzt wird; das sicherste Datum im Leben des Paulus, das Amtsjahr Gallios als Prokonsul von Achaja 51–52, bekannt aus einer Inschrift in Delphi, liegt einige Jahre später. Die Rekonstruktionen weichen um ein oder zwei Jahre voneinander ab (die Catholic Encyclopedia von 1911 gab 45–49 an), und die Karte zeigt die Reise im Jahr 47 n. Chr."
    - "Der Text gibt die Zeit nur selten an: In Ikonion und auf dem Rückweg in Antiochia blieben die Apostel lange. Die bei den Stationen angegebenen Reisezeiten sind Schätzungen der Tage unterwegs zu Land und zur See, nicht der Reise mit ihren Aufenthalten."
  fr:
    - "Ac 13–14 raconte comment l’Église d’Antioche de Syrie envoya Barnabas et Saul, avec Jean pour aide, pour le premier des voyages de Paul que suivent les Actes. Ils s’embarquèrent pour Chypre et traversèrent l’île de Salamine à Paphos, firent voile vers Perge en Pamphylie, puis montèrent dans l’intérieur des terres jusqu’à Antioche de Pisidie, Icone, Lystre et Derbe, villes de la province romaine de Galatie. Là où il y avait une synagogue, comme à Salamine, à Antioche et à Icone, ils y parlèrent d’abord ; à Antioche, repoussés, ils dirent qu’ils se tournaient vers les païens. De Derbe, ils revinrent par les mêmes villes, établissant des anciens dans chaque Église, et rentrèrent par mer depuis Attalie."
    - "Les Actes sont le seul récit de ce voyage ; la Deuxième lettre à Timothée rappelle les persécutions que Paul subit à Antioche, à Icone et à Lystre. Beaucoup de spécialistes pensent que la Lettre de Paul aux Galates fut adressée aux Églises fondées lors de ce voyage ; d’autres estiment qu’elle alla aux Galates du Nord. Les Actes ne donnent aucune année. Le voyage se place après la mort d’Hérode Agrippa Ier en 44 apr. J.-C. (Ac 12) et avant le concile de Jérusalem (Ac 15), habituellement situé vers 49 ou 50 apr. J.-C. ; la date la plus sûre de la vie de Paul, l’année du proconsulat de Gallion en Achaïe, en 51–52, connue par une inscription de Delphes, tombe quelques années plus tard. Les reconstitutions diffèrent d’un an ou deux (la Catholic Encyclopedia de 1911 donnait 45–49), et la carte place le voyage en 47 apr. J.-C."
    - "Le texte mesure peu le temps : les apôtres restèrent longtemps à Icone et, à leur retour, à Antioche. Les durées de trajet indiquées aux étapes sont des estimations des jours passés sur la route et en mer, non du voyage avec ses séjours."
  pl:
    - "Dzieje Apostolskie (Dz 13–14) opowiadają, jak Kościół w Antiochii Syryjskiej wysłał Barnabę i Saula, z Janem jako ich pomocnikiem, w pierwszą z podróży Pawła, które śledzą Dzieje. Popłynęli na Cypr i przeszli go od Salaminy do Pafos, popłynęli dalej do Perge w Pamfilii i ruszyli w głąb lądu do Antiochii Pizydyjskiej, Ikonium, Listry i Derbe, miast rzymskiej prowincji Galacji. Tam, gdzie była synagoga, jak w Salaminie, Antiochii i Ikonium, przemawiali najpierw w niej; w Antiochii, odrzuceni, oznajmili, że zwracają się do pogan. Z Derbe wrócili przez te same miasta, ustanawiając starszych w każdym Kościele, i z Attalii odpłynęli do domu."
    - "Dzieje Apostolskie są jedyną relacją o tej podróży; Drugi List do Tymoteusza przypomina prześladowania, których Paweł doznał w Antiochii, Ikonium i Listrze. Wielu badaczy uważa, że List Pawła do Galatów został napisany do Kościołów założonych podczas tej podróży; inni sądzą, że trafił do Galatów z północy. Dzieje nie podają roku. Podróż przypada po śmierci Heroda Agryppy I w 44 n.e. (Dz 12) i przed soborem jerozolimskim (Dz 15), datowanym zwykle na ok. 49 lub 50 n.e.; najpewniejsza data w życiu Pawła, rok prokonsulatu Galliona w Achai w latach 51–52, znany z napisu w Delfach, przypada kilka lat później. Rekonstrukcje różnią się o rok lub dwa (Catholic Encyclopedia z 1911 roku podawała lata 45–49), a mapa pokazuje podróż w roku 47 n.e."
    - "Tekst rzadko określa upływ czasu: apostołowie przebywali długo w Ikonium oraz, w drodze powrotnej, w Antiochii. Czasy przejazdu podane przy przystankach są szacunkami dni spędzonych w drodze i na morzu, a nie całej podróży wraz z postojami."
  it:
    - "At 13–14 racconta come la chiesa di Antiochia di Siria inviò Barnaba e Saulo, con Giovanni come aiuto, nel primo dei viaggi di Paolo che gli Atti seguono. Navigarono verso Cipro e la attraversarono da Salamina a Pafo, proseguirono per mare fino a Perge di Panfilia e salirono nell’entroterra ad Antiochia di Pisidia, Icònio, Listra e Derbe, città della provincia romana di Galazia. Dove c’era una sinagoga, come a Salamina, ad Antiochia e a Icònio, vi parlarono per primi; ad Antiochia, respinti, dissero che si volgevano ai Gentili. Da Derbe tornarono indietro attraverso le stesse città, stabilendo anziani in ogni chiesa, e da Attalia salparono per il ritorno."
    - "Gli Atti sono l’unico racconto del viaggio; la Seconda lettera a Timoteo ricorda le persecuzioni che Paolo subì ad Antiochia, a Icònio e a Listra. Molti studiosi ritengono che la Lettera di Paolo ai Galati sia stata scritta alle chiese fondate durante questo viaggio; altri sostengono che fosse destinata ai Galati del nord. Gli Atti non indicano alcun anno. Il viaggio viene dopo la morte di Erode Agrippa I nel 44 d.C. (At 12) e prima del concilio di Gerusalemme (At 15), collocato di solito verso il 49 o il 50 d.C.; la data più sicura della vita di Paolo, l’anno di Gallione come proconsole d’Acaia nel 51–52, nota da un’iscrizione di Delfi, cade alcuni anni dopo. Le ricostruzioni differiscono di un anno o due (la Catholic Encyclopedia del 1911 indicava 45–49), e la mappa colloca il viaggio nel 47 d.C."
    - "Il testo misura poco il tempo: gli apostoli si trattennero a lungo a Icònio e, al ritorno, ad Antiochia. I tempi di viaggio indicati per le tappe sono stime dei giorni di cammino e di navigazione, non del viaggio con le sue soste."
  nl:
    - "Hand 13–14 vertelt hoe de gemeente te Antiochië in Syrië Barnabas en Saulus uitzond, met Johannes als hun helper, op de eerste van de reizen van Paulus die Handelingen volgt. Zij voeren naar Cyprus en trokken over het eiland van Salamis naar Paffos, voeren verder naar Perge in Pamfylië en trokken landinwaarts naar Antiochië in Pisidië, Ikonium, Lystra en Derbe, steden van de Romeinse provincie Galatië. Waar er een synagoge was, zoals te Salamis, Antiochië en Ikonium, spraken zij daar eerst; te Antiochië zeiden zij, toen men hen afwees, dat zij zich tot de heidenen keerden. Vanuit Derbe keerden zij terug door dezelfde steden, stelden in elke gemeente oudsten aan en voeren vanuit Attalia naar huis."
    - "Handelingen is het enige verslag van de reis; de tweede brief aan Timoteüs herinnert aan de vervolgingen die Paulus te Antiochië, Ikonium en Lystra onderging. Veel geleerden denken dat de brief van Paulus aan de Galaten gericht was aan de gemeenten die op deze reis werden gesticht; anderen menen dat hij naar de Galaten in het noorden ging. Handelingen noemt geen jaartal. De reis valt na de dood van Herodes Agrippa I in 44 n.Chr. (Hand 12) en vóór het concilie van Jeruzalem (Hand 15), dat gewoonlijk rond 49 of 50 n.Chr. wordt gesteld; de vastste datum in het leven van Paulus, het ambtsjaar van Gallio als proconsul van Achaja in 51–52, bekend uit een inscriptie te Delphi, valt enkele jaren later. Reconstructies verschillen een jaar of twee (de Catholic Encyclopedia van 1911 gaf 45–49), en de kaart toont de reis in 47 n.Chr."
    - "De tekst meet de tijd maar zelden: de apostelen bleven lang in Ikonium en, op de terugweg, in Antiochië. De reistijden bij de haltes zijn schattingen van de dagen onderweg over land en over zee, niet van de reis met haar verblijven."
  cs:
    - "Skutky apoštolů (Sk 13–14) vyprávějí, jak církev v syrské Antiochii vyslala Barnabáše a Saula, s Janem jako jejich pomocníkem, na první z Pavlových cest, které Skutky sledují. Odpluli na Kypr a prošli jím od města Salamis až po Pafos, pluli dál do Perge v Pamfylii a vydali se do vnitrozemí, do Antiochie Pisidské, Ikonia, Lystry a Derbe, měst římské provincie Galacie. Kde byla synagoga, jako ve městě Salamis, v Antiochii a v Ikoniu, mluvili nejprve v ní; v Antiochii, když je odmítli, prohlásili, že se obracejí k pohanům. Z Derbe se vraceli přes táž města, v každé církvi ustanovovali starší a z Attaleie odpluli domů."
    - "Skutky jsou jedinou zprávou o této cestě; Druhý list Timoteovi připomíná pronásledování, která Pavel vytrpěl v Antiochii, Ikoniu a Lystře. Mnozí badatelé se domnívají, že Pavlův list Galatským byl napsán církvím založeným na této cestě; jiní soudí, že byl určen Galaťanům na severu. Skutky neuvádějí rok. Cesta spadá do doby po smrti Heroda Agrippy I. v roce 44 n. l. (Sk 12) a před jeruzalémským sněmem (Sk 15), obvykle kladeným do roku asi 49 nebo 50 n. l.; nejpevnější datum Pavlova života, Galliónův rok v úřadu prokonzula Achaje v letech 51–52, známý z nápisu v Delfách, připadá o několik let později. Rekonstrukce se liší o rok či dva (Catholic Encyclopedia z roku 1911 uváděla 45–49) a mapa ukazuje cestu v roce 47 n. l."
    - "Text čas měří jen málo: apoštolové pobyli dlouho v Ikoniu a na zpáteční cestě v Antiochii. Doby cesty uvedené u zastávek jsou odhady dnů strávených na cestě a na moři, nikoli celé cesty i s pobyty."
  sv:
    - "Apg 13–14 berättar hur församlingen i Antiochia i Syrien sände ut Barnabas och Saulus, med Johannes som deras medhjälpare, på den första av de resor av Paulus som Apostlagärningarna följer. De seglade till Cypern och korsade ön från Salamis till Pafos, seglade vidare till Perge i Pamfylien och drog inåt landet till Antiochia i Pisidien, Ikonion, Lystra och Derbe, städer i den romerska provinsen Galatien. Där det fanns en synagoga, som i Salamis, Antiochia och Ikonion, talade de först där; i Antiochia, när de blev avvisade, sade de att de nu vände sig till hedningarna. Från Derbe vände de tillbaka genom samma städer, utsåg äldste i varje församling och seglade hem från Attalia."
    - "Apostlagärningarna är den enda skildringen av resan; Andra Timoteusbrevet påminner om de förföljelser Paulus led i Antiochia, Ikonion och Lystra. Många forskare anser att Paulus’ brev till galaterna skrevs till de församlingar som grundades under resan; andra menar att det gick till galaterna i norr. Apostlagärningarna anger inget år. Resan kommer efter att Herodes Agrippa I dog år 44 e.Kr. (Apg 12) och före mötet i Jerusalem (Apg 15), som vanligen dateras till omkring 49 eller 50 e.Kr.; den säkraste dateringen i Paulus’ liv, Gallios år som prokonsul i Achaia 51–52, känt från en inskrift i Delfi, infaller några år senare. Rekonstruktionerna skiljer sig åt med ett eller två år (Catholic Encyclopedia från 1911 angav 45–49), och kartan visar resan år 47 e.Kr."
    - "Texten mäter inte mycket av tiden: apostlarna stannade länge i Ikonion och, på återvägen, i Antiochia. Restiderna som anges vid stationerna är uppskattningar av dagarna på vägen och till sjöss, inte av resan med dess uppehåll."
  nb:
    - "Apg 13–14 forteller hvordan menigheten i Antiokia i Syria sendte ut Barnabas og Saulus, med Johannes som medhjelper, på den første av Paulus' reiser som Apostlenes gjerninger følger. De seilte til Kypros og krysset øya fra Salamis til Pafos, seilte videre til Perge i Pamfylia og dro inn i landet til Antiokia i Pisidia, Ikonium, Lystra og Derbe, byer i den romerske provinsen Galatia. Der det fantes en synagoge, som i Salamis, Antiokia og Ikonium, talte de der først; i Antiokia, da de ble avvist, sa de at de nå vendte seg til hedningene. Fra Derbe vendte de tilbake gjennom de samme byene, innsatte eldste i hver menighet og seilte hjem fra Attalia."
    - "Apostlenes gjerninger er den eneste beretningen om reisen; Andre Timoteusbrev minner om forfølgelsene Paulus led i Antiokia, Ikonium og Lystra. Mange forskere mener at Paulus' brev til galaterne ble skrevet til menighetene som ble grunnlagt på reisen; andre mener at det gikk til galaterne i nord. Apostlenes gjerninger oppgir ikke noe år. Reisen kommer etter at Herodes Agrippa I døde i 44 e.Kr. (Apg 12), og før møtet i Jerusalem (Apg 15), som vanligvis settes til omkring 49 eller 50 e.Kr.; den sikreste dateringen i Paulus' liv, Gallios år som prokonsul i Akaia i 51–52, kjent fra en innskrift i Delfi, faller noen år senere. Rekonstruksjonene skiller seg med ett eller to år (Catholic Encyclopedia fra 1911 oppga 45–49), og kartet viser reisen i 47 e.Kr."
    - "Teksten måler lite av tiden: apostlene ble lenge i Ikonium og, på tilbakeveien, i Antiokia. Reisetidene som er oppgitt ved stoppestedene, er anslag over dagene på veien og til sjøs, ikke over reisen med oppholdene."
  tl:
    - "Isinasalaysay ng Gawa 13–14 kung paanong sinugo ng iglesia sa Antioquia sa Siria sina Bernabe at Saulo, kasama si Juan bilang kanilang katulong, sa una sa mga paglalakbay ni Pablo na sinusundan ng aklat ng Mga Gawa. Naglayag sila patungong Chipre at tinahak ito mula Salamina hanggang Pafos, naglayag pa patungong Perga ng Pamfilia, at pumasok sa kalupaan patungong Antioquia ng Pisidia, Iconio, Listra at Derbe, mga bayan ng lalawigang Romano ng Galacia. Kung saan may sinagoga, gaya sa Salamina, Antioquia at Iconio, doon muna sila nagsalita; sa Antioquia, nang sila'y itakuwil, sinabi nilang babaling sila sa mga Gentil. Mula sa Derbe ay bumalik sila sa mga bayan ding iyon, na naglalagay ng mga matanda sa bawat iglesia, at naglayag pauwi mula sa Atalia."
    - "Ang Mga Gawa ang tanging salaysay ng paglalakbay; ginugunita ng Ikalawang Sulat kay Timoteo ang mga pag-uusig na dinanas ni Pablo sa Antioquia, Iconio at Listra. Maraming iskolar ang naniniwalang ang Sulat ni Pablo sa mga taga-Galacia ay isinulat para sa mga iglesiang itinatag sa paglalakbay na ito; ang iba naman ay naniniwalang ipinadala ito sa mga taga-Galacia sa hilaga. Walang binabanggit na taon ang Mga Gawa. Naganap ang paglalakbay pagkamatay ni Herodes Agripa I noong 44 AD (Gawa 12) at bago ang konseho sa Jerusalem (Gawa 15), na karaniwang inilalagay sa mga 49 o 50 AD; ang pinakatiyak na petsa sa buhay ni Pablo, ang taon ni Galion bilang prokonsul ng Acaya noong 51–52, na nalalaman mula sa isang inskripsiyon sa Delphi, ay pumapatak ilang taon pagkaraan. Nagkakaiba nang isa o dalawang taon ang mga rekonstruksiyon (ang Catholic Encyclopedia ng 1911 ay nagbigay ng 45–49), at ipinapakita ng mapa ang paglalakbay sa 47 AD."
    - "Kaunti lamang ang sinusukat ng teksto tungkol sa panahon: matagal na nanatili ang mga apostol sa Iconio at, sa kanilang pagbalik, sa Antioquia. Ang mga oras ng paglalakbay na nakalagay sa mga hintuan ay tantiya ng mga araw sa daan at sa dagat, hindi ng buong paglalakbay kasama ang mga pananatili."
  da:
    - "ApG 13–14 fortæller, hvordan menigheden i Antiokia i Syrien sendte Barnabas og Saulus ud med Johannes som medhjælper på den første af de rejser med Paulus, som Apostlenes Gerninger følger. De sejlede til Cypern og krydsede øen fra Salamis til Pafos, sejlede videre til Perge i Pamfylien og drog ind i landet til Antiokia i Pisidien, Ikonion, Lystra og Derbe, byer i den romerske provins Galatien. Hvor der var en synagoge, som i Salamis, Antiokia og Ikonion, talte de først dér; i Antiokia, hvor de blev afvist, sagde de, at de nu vendte sig til hedningerne. Fra Derbe drog de tilbage gennem de samme byer, indsatte ældste i hver menighed og sejlede hjem fra Attalia."
    - "Apostlenes Gerninger er den eneste beretning om rejsen; Andet Timotheusbrev minder om de forfølgelser, Paulus led i Antiokia, Ikonion og Lystra. Mange forskere mener, at Paulus' brev til galaterne blev skrevet til de menigheder, der blev grundlagt på rejsen; andre mener, at det gik til galaterne i nord. Apostlenes Gerninger angiver intet årstal. Rejsen ligger efter Herodes Agrippa I's død i 44 e.Kr. (ApG 12) og før apostelmødet i Jerusalem (ApG 15), som normalt dateres til omkring 49 eller 50 e.Kr.; den sikreste dato i Paulus' liv, Gallios år som prokonsul i Akaja i 51–52, kendt fra en inskription i Delfi, falder nogle år senere. Rekonstruktionerne afviger med et år eller to (Catholic Encyclopedia fra 1911 angav 45–49), og kortet viser rejsen i 47 e.Kr."
    - "Teksten siger kun lidt om, hvor lang tid der gik: apostlene blev længe i Ikonion og, på hjemvejen, i Antiokia. De rejsetider, der er angivet ved de enkelte stop, er skøn over dagene på vejen og til søs, ikke over rejsen med dens ophold."
  sr:
    - "Дела апостолска, у главама 13–14, приповедају како је црква у Антиохији у Сирији послала Варнаву и Савла, с Јованом као помоћником, на прво од Павлових путовања која Дела прате. Отпловили су на Кипар и прешли га од Саламине до Пафоса, отпловили даље у Пергу у Памфилији и отишли у унутрашњост, у Антиохију Писидијску, Икониј, Листру и Дерву, градове римске провинције Галатије. Где је било синагоге, као у Саламини, Антиохији и Иконију, тамо су најпре говорили; у Антиохији, одбијени, рекли су да се обраћају незнабошцима. Из Дерве су се вратили кроз исте градове, постављајући старешине у свакој цркви, и из Аталије отпловили кући."
    - "Дела су једини извештај о путовању; Друга посланица Тимотију подсећа на прогоне које је Павле претрпео у Антиохији, Иконију и Листри. Многи научници мисле да је Павлова Посланица Галатима писана црквама основаним на том путовању; други држе да је ишла Галатима на северу. Дела не наводе годину. Путовање долази после смрти Ирода Агрипе I 44. н. е. (Дап 12) и пре сабора у Јерусалиму (Дап 15), који се обично смешта око 49. или 50. н. е.; најпоузданији датум у Павловом животу, Галионова година као намесника Ахаје 51–52, позната из натписа у Делфима, пада неколико година касније. Реконструкције се разликују за годину-две (Католичка енциклопедија из 1911. давала је 45–49), а карта приказује путовање у 47. н. е."
    - "Текст мало мери време: апостоли су дуго остали у Иконију и, на повратку, у Антиохији. Трајања пута наведена уз станице процене су дана на копну и на мору, а не путовања заједно с боравцима."
  hu:
    - "Az ApCsel 13–14 elbeszéli, hogyan küldte ki a szíriai antiókhiai gyülekezet Barnabást és Sault, segítőjükként Jánossal, Pál azon útjai közül az elsőre, amelyeket az Apostolok cselekedetei követ. Ciprusra hajóztak, és Szalamisztól Páfoszig átkeltek a szigeten, majd továbbhajóztak a pamfíliai Pergébe, és a szárazföld belsejébe mentek: a piszídiai Antiókhiába, Ikóniumba, Lisztrába és Derbébe, Galácia római provincia városaiba. Ahol volt zsinagóga, mint Szalamiszban, Antiókhiában és Ikóniumban, ott szóltak először; Antiókhiában, amikor elutasították őket, azt mondták, hogy a pogányokhoz fordulnak. Derbéből ugyanazokon a városokon át mentek vissza, minden gyülekezetben véneket rendelve, és Attáliából hajóztak haza."
    - "Az Apostolok cselekedetei az út egyetlen beszámolója; a Timóteushoz írt második levél felidézi azokat az üldözéseket, amelyeket Pál Antiókhiában, Ikóniumban és Lisztrában szenvedett. Sok kutató úgy véli, hogy Pál Galatákhoz írt levele az ezen az úton alapított gyülekezeteknek szólt; mások szerint az északi galatákhoz ment. Az ApCsel nem ad meg évet. Az út I. Heródes Agrippa Kr. u. 44-es halála (ApCsel 12) után és a jeruzsálemi zsinat (ApCsel 15) előtt történt, amelyet általában Kr. u. 49 vagy 50 körülre tesznek; Pál életének legbiztosabb dátuma, Gallió akhájai prokonzuli éve 51–52-ben, amelyet egy delphoi feliratból ismerünk, néhány évvel későbbre esik. A rekonstrukciók egy-két évvel eltérnek egymástól (az 1911-es Catholic Encyclopedia 45–49-et adott meg), a térkép pedig Kr. u. 47-nél mutatja az utat."
    - "A szöveg kevéssé méri az időt: az apostolok sokáig maradtak Ikóniumban, és visszatérésükkor Antiókhiában. Az állomásoknál megadott utazási idők az úton és a tengeren töltött napok becslései, nem az egész útéi a megállókkal együtt."
  fi:
    - "Apt 13–14 kertoo, kuinka Syyrian Antiokian seurakunta lähetti Barnabaan ja Sauluksen, avustajanaan Johannes, ensimmäiselle niistä Paavalin matkoista, joita Apostolien teot seuraa. He purjehtivat Kyprokselle ja kulkivat saaren halki Salamiista Pafokseen, purjehtivat edelleen Pamfylian Pergeen ja menivät sisämaahan Pisidian Antiokiaan, Ikonioniin, Lystraan ja Derbeen, Rooman Galatian maakunnan kaupunkeihin. Missä oli synagoga, kuten Salamiissa, Antiokiassa ja Ikonionissa, he puhuivat ensin siellä; Antiokiassa, kun heidät torjuttiin, he sanoivat kääntyvänsä pakanoiden puoleen. Derbestä he palasivat samojen kaupunkien kautta, asettivat vanhimmat jokaiseen seurakuntaan ja purjehtivat kotiin Attaliasta."
    - "Apostolien teot on ainoa kertomus matkasta; toinen kirje Timoteukselle muistuttaa vainoista, joita Paavali kärsi Antiokiassa, Ikonionissa ja Lystrassa. Monet tutkijat arvelevat, että Paavalin kirje galatalaisille kirjoitettiin matkalla perustetuille seurakunnille; toisten mukaan se lähetettiin pohjoisille galatalaisille. Apostolien teot ei mainitse vuotta. Matka sijoittuu Herodes Agrippa I:n kuoleman (44 jaa., Apt 12) ja Jerusalemin apostolikokouksen (Apt 15) väliin; kokous ajoitetaan tavallisesti noin vuoteen 49 tai 50 jaa. Paavalin elämän varmin ajankohta, Gallion vuosi Akaian käskynhaltijana 51–52, joka tunnetaan Delfoin kirjoituksesta, on muutamaa vuotta myöhäisempi. Rekonstruktiot eroavat toisistaan vuodella tai kahdella (vuoden 1911 Catholic Encyclopedia esitti vuodet 45–49), ja kartta näyttää matkan vuonna 47 jaa."
    - "Teksti kertoo ajan kulusta vain vähän: apostolit viipyivät kauan Ikonionissa ja paluumatkalla Antiokiassa. Pysähdyspaikkojen yhteydessä annetut matka-ajat ovat arvioita tiellä ja merellä vietetyistä päivistä, eivät koko matkasta oleskeluineen."
  vi:
    - "Công 13–14 thuật lại việc Hội thánh tại An-ti-ốt xứ Sy-ri sai Ba-na-ba và Sau-lơ đi, có Giăng làm người giúp việc, trong chuyến đầu tiên của các cuộc hành trình của Phao-lô mà sách Công vụ theo dõi. Họ đi thuyền đến Chíp-rơ và băng qua đảo từ Sa-la-min đến Ba-phô, đi thuyền tiếp đến Bẹt-giê xứ Bam-phi-ly, rồi đi vào nội địa đến An-ti-ốt xứ Bi-si-đi, Y-cô-ni, Lít-trơ và Đẹt-bơ, những thành thuộc tỉnh Ga-la-ti của La Mã. Nơi nào có nhà hội, như tại Sa-la-min, An-ti-ốt và Y-cô-ni, họ giảng ở đó trước; tại An-ti-ốt, bị khước từ, họ nói rằng mình xây qua người ngoại. Từ Đẹt-bơ, họ trở lại qua chính những thành ấy, lập trưởng lão trong mỗi Hội thánh, rồi từ Át-ta-li đi thuyền về."
    - "Sách Công vụ là bản tường thuật duy nhất về cuộc hành trình này; thư thứ hai gửi Ti-mô-thê nhắc lại những sự bắt bớ Phao-lô đã chịu tại An-ti-ốt, Y-cô-ni và Lít-trơ. Nhiều học giả cho rằng thư của Phao-lô gửi người Ga-la-ti được viết cho các Hội thánh được lập nên trong chuyến đi này; những người khác cho rằng thư ấy gửi cho người Ga-la-ti ở miền bắc. Sách Công vụ không nêu năm. Cuộc hành trình diễn ra sau cái chết của Hê-rốt Ạc-ríp-ba I vào năm 44 (Công 12) và trước hội nghị tại Giê-ru-sa-lem (Công 15), thường được đặt vào khoảng năm 49 hoặc 50; niên đại chắc chắn nhất trong đời Phao-lô, năm Ga-li-ôn làm quan trấn thủ xứ A-chai, 51–52, được biết qua một bia khắc tại Delphi, rơi vào vài năm sau đó. Các cách dựng lại niên đại chênh nhau một hai năm (Catholic Encyclopedia năm 1911 đưa ra 45–49), và bản đồ thể hiện cuộc hành trình vào năm 47."
    - "Bản văn ít đo đếm thời gian: các sứ đồ ở lại lâu ngày tại Y-cô-ni và, khi trở về, tại An-ti-ốt. Thời gian đi đường ghi kèm các điểm dừng là ước tính số ngày đi trên đường bộ và trên biển, không phải của cả chuyến đi kể cả những lần lưu lại."
  ro:
    - "Fapte 13–14 povestește cum biserica din Antiohia Siriei i-a trimis pe Barnaba și pe Saul, cu Ioan ca ajutor, în prima dintre călătoriile lui Pavel pe care le urmăresc Faptele Apostolilor. Au navigat spre Cipru și au străbătut insula de la Salamina la Pafos, au navigat mai departe la Perga Pamfiliei și au mers spre interior, la Antiohia Pisidiei, Iconia, Listra și Derba, cetăți ale provinciei romane Galatia. Acolo unde era sinagogă, ca la Salamina, Antiohia și Iconia, au vorbit întâi în ea; la Antiohia, fiind respinși, au spus că se întorc la neamuri. De la Derba s-au întors prin aceleași cetăți, rânduind prezbiteri în fiecare biserică, și au navigat spre casă de la Atalia."
    - "Faptele Apostolilor sunt singura relatare a călătoriei; a doua epistolă către Timotei amintește prigonirile pe care Pavel le-a suferit la Antiohia, Iconia și Listra. Mulți cercetători socotesc că Epistola lui Pavel către Galateni a fost scrisă bisericilor întemeiate în această călătorie; alții susțin că a fost trimisă galaților din nord. Faptele nu dau niciun an. Călătoria vine după moartea lui Irod Agripa I, în 44 d.Hr. (Fapte 12), și înainte de Conciliul de la Ierusalim (Fapte 15), așezat de obicei în jurul anului 49 sau 50 d.Hr.; cea mai sigură dată din viața lui Pavel, anul în care Galion a fost proconsul al Ahaiei, 51–52, cunoscut dintr-o inscripție de la Delfi, cade câțiva ani mai târziu. Reconstituirile diferă cu un an sau doi (Catholic Encyclopedia din 1911 dădea 45–49), iar harta arată călătoria în anul 47 d.Hr."
    - "Textul măsoară puțin timpul: apostolii au stat multă vreme la Iconia și, la întoarcere, la Antiohia. Duratele de drum date la opriri sunt estimări ale zilelor petrecute pe drum și pe mare, nu ale călătoriei cu popasurile ei."
  bg:
    - "Деяния, глави 13–14, разказват как църквата в Антиохия Сирийска изпрати Варнава и Савел, с Йоан за помощник, на първото от пътуванията на Павел, които Деяния проследяват. Те отплаваха за Кипър и го прекосиха от Саламин до Пафос, отплаваха нататък за Перга в Памфилия и продължиха навътре в сушата към Антиохия Писидийска, Икония, Листра и Дервия — градове на римската провинция Галатия. Където имаше синагога, както в Саламин, Антиохия и Икония, те говореха първо там; в Антиохия, отхвърлени, казаха, че се обръщат към езичниците. От Дервия се върнаха през същите градове, като ръкополагаха презвитери във всяка църква, и отплаваха обратно от Аталия."
    - "Книгата Деяния е единственият разказ за пътуването; Второто послание до Тимотей припомня гоненията, които Павел претърпя в Антиохия, Икония и Листра. Много изследователи смятат, че Посланието на Павел до галатяните е писано до църквите, основани при това пътуване; други твърдят, че е било до галатяните на север. Деяния не посочват година. Пътуването е след смъртта на Ирод Агрипа I през 44 г. н.е. (Деян 12) и преди събора в Йерусалим (Деян 15), обикновено поставян около 49 или 50 г. н.е.; най-сигурната дата в живота на Павел, годината на Галион като проконсул на Ахая през 51–52 г., известна от надпис в Делфи, идва няколко години по-късно. Реконструкциите се разминават с година-две (Католическата енциклопедия от 1911 г. дава 45–49 г.), а картата показва пътуването в 47 г. н.е."
    - "Текстът отмерва малко от времето: апостолите останаха дълго време в Икония и, на връщане, в Антиохия. Времената за път, дадени при спирките, са оценки на дните по суша и по море, а не на пътуването заедно с престоите."
stops:
  - place: ae41ab4 # Antioch in Syria
    ref: Acts.13.1-Acts.13.3
    note:
      en: At the word of the Holy Spirit, the church sets Barnabas and Saul apart for the work.
      ru: По слову Духа Святого церковь отделяет Варнаву и Савла на дело.
      uk: "За словом Святого Духа церква відокремлює Варнаву й Савла для цього діла."
      es: "Por palabra del Espíritu Santo, la iglesia aparta a Bernabé y a Saúl para la obra."
      pt: "Por palavra do Espírito Santo, a igreja separa Barnabé e Saulo para a obra."
      de: "Auf das Wort des Heiligen Geistes sondert die Gemeinde Barnabas und Saulus für das Werk aus."
      fr: "Sur la parole du Saint-Esprit, l’Église met à part Barnabas et Saül pour l’œuvre."
      pl: "Na słowo Ducha Świętego Kościół wyznacza Barnabę i Saula do dzieła."
      it: "Per parola dello Spirito Santo, la chiesa mette da parte Barnaba e Saulo per l’opera."
      nl: "Op het woord van de Heilige Geest zondert de gemeente Barnabas en Saulus af voor het werk."
      cs: "Na slovo Ducha svatého církev odděluje Barnabáše a Saula k dílu."
      sv: "På den helige Andes ord avskiljer församlingen Barnabas och Saul för uppgiften."
      nb: "På Den hellige ånds ord tar menigheten ut Barnabas og Saul til gjerningen."
      tl: "Sa salita ng Espiritu Santo, itinalaga ng iglesia sina Bernabe at Saulo para sa gawain."
      da: "På Helligåndens ord udskiller menigheden Barnabas og Saul til værket."
      sr: "По речи Духа Светога црква одваја Варнаву и Савла за дело."
      hu: "A Szentlélek szavára a gyülekezet külön választja Barnabást és Sault a munkára."
      fi: "Pyhän Hengen sanan mukaan seurakunta erottaa Barnabaan ja Saulin tehtävään."
      vi: "Theo lời Đức Thánh Linh, Hội thánh biệt riêng Ba-na-ba và Sau-lơ ra để làm công việc."
      ro: "La cuvântul Duhului Sfânt, biserica îi pune deoparte pe Barnaba și pe Saul pentru lucrare."
      bg: "По словото на Светия Дух църквата отделя Варнава и Савел за делото."
    story:
      en: "In the church at Antioch there were prophets and teachers: Barnabas, Simeon called Niger, Lucius of Cyrene, Manaen, who had been brought up with Herod the tetrarch, and Saul. As they served the Lord and fasted, the Holy Spirit told them to set Barnabas and Saul apart for the work to which he had called them. After fasting and prayer they laid their hands on the two and sent them away. Antioch, the seat of the Roman governor of Syria, was the church where the disciples had first been called Christians."
      ru: "В церкви в Антиохии были пророки и учители: Варнава, Симеон, называемый Нигер, Луций Киринеянин, Манаил, воспитанный вместе с Иродом четвертовластником, и Савл. Когда они служили Господу и постились, Дух Святой велел им отделить Варнаву и Савла на дело, к которому Он призвал их. Совершив пост и молитву, они возложили на обоих руки и отпустили их. Антиохия, резиденция римского наместника Сирии, была той церковью, где учеников впервые стали называть христианами."
      uk: "У церкві в Антіохії були пророки й учителі: Варнава, Симеон, званий Нигером, Луцій Киринейський, Манаїл, вихований разом з Іродом-четвертовласником, і Савло. Коли вони служили Господові й постили, Святий Дух звелів їм відокремити Варнаву й Савла для діла, до якого Він їх покликав. Попостивши й помолившись, вони поклали на обох руки й відпустили їх. Антіохія, осідок римського намісника Сирії, була тією церквою, де учнів уперше почали називати християнами."
      es: "En la iglesia de Antioquía había profetas y maestros: Bernabé, Simeón llamado Niger, Lucio de Cirene, Manaén, que se había criado con Herodes el tetrarca, y Saulo. Mientras servían al Señor y ayunaban, el Espíritu Santo les dijo que apartaran a Bernabé y a Saulo para la obra a la que los había llamado. Después de ayunar y orar, les impusieron las manos a los dos y los despidieron. Antioquía, sede del gobernador romano de Siria, era la iglesia donde a los discípulos se les había llamado cristianos por primera vez."
      pt: "Na igreja de Antioquia havia profetas e mestres: Barnabé, Simeão, chamado Níger, Lúcio de Cirene, Manaém, que fora criado com Herodes, o tetrarca, e Saulo. Enquanto serviam ao Senhor e jejuavam, o Espírito Santo disse-lhes que separassem Barnabé e Saulo para a obra à qual os tinha chamado. Depois de jejuarem e orarem, impuseram as mãos sobre os dois e os enviaram. Antioquia, sede do governador romano da Síria, era a igreja onde os discípulos tinham sido chamados cristãos pela primeira vez."
      de: "In der Gemeinde in Antiochia gab es Propheten und Lehrer: Barnabas, Simeon, genannt Niger, Lucius von Kyrene, Manaen, der mit Herodes dem Vierfürsten erzogen worden war, und Saulus. Als sie dem Herrn dienten und fasteten, sagte ihnen der Heilige Geist, sie sollten Barnabas und Saulus für das Werk aussondern, zu dem er sie berufen hatte. Nach Fasten und Gebet legten sie den beiden die Hände auf und ließen sie ziehen. Antiochia, der Sitz des römischen Statthalters von Syrien, war die Gemeinde, in der die Jünger zuerst Christen genannt worden waren."
      fr: "Il y avait dans l’Église d’Antioche des prophètes et des docteurs : Barnabas, Siméon appelé Niger, Lucius de Cyrène, Manahen, qui avait été élevé avec Hérode le tétrarque, et Saul. Pendant qu’ils servaient le Seigneur et jeûnaient, le Saint-Esprit leur dit de mettre à part Barnabas et Saul pour l’œuvre à laquelle il les avait appelés. Après avoir jeûné et prié, ils leur imposèrent les mains et les laissèrent partir. Antioche, siège du gouverneur romain de Syrie, était l’Église où les disciples avaient pour la première fois été appelés chrétiens."
      pl: "W Kościele w Antiochii byli prorocy i nauczyciele: Barnaba, Symeon zwany Niger, Lucjusz z Cyreny, Manaen, który wychowywał się razem z Herodem tetrarchą, oraz Saul. Gdy służyli Panu i pościli, Duch Święty polecił im wyznaczyć Barnabę i Saula do dzieła, do którego ich powołał. Po poście i modlitwie włożyli na nich ręce i wyprawili ich. W Antiochii, siedzibie rzymskiego namiestnika Syrii, był Kościół, w którym uczniów po raz pierwszy nazwano chrześcijanami."
      it: "Nella chiesa di Antiochia c’erano profeti e dottori: Barnaba, Simeone chiamato Niger, Lucio di Cirene, Manaen, che era cresciuto con Erode il tetrarca, e Saulo. Mentre celebravano il culto del Signore e digiunavano, lo Spirito Santo disse loro di mettere a parte Barnaba e Saulo per l’opera alla quale li aveva chiamati. Dopo aver digiunato e pregato, imposero loro le mani e li congedarono. Antiochia, sede del governatore romano della Siria, era la chiesa in cui i discepoli erano stati chiamati per la prima volta cristiani."
      nl: "In de gemeente te Antiochië waren profeten en leraars: Barnabas, Simeon, genaamd Niger, Lucius van Cyrene, Manaën, die met Herodes de viervorst was opgevoed, en Saulus. Toen zij de Heer dienden en vastten, zei de Heilige Geest hun Barnabas en Saulus af te zonderen voor het werk waartoe Hij hen geroepen had. Na vasten en gebed legden zij de twee de handen op en lieten hen gaan. Antiochië, de zetel van de Romeinse stadhouder van Syrië, was de gemeente waar de discipelen voor het eerst christenen genoemd waren."
      cs: "V církvi v Antiochii byli proroci a učitelé: Barnabáš, Simeon zvaný Niger, Lucius z Kyrény, Manaen, který byl vychován spolu s tetrarchou Herodem, a Saul. Když sloužili Pánu a postili se, Duch svatý jim řekl, aby oddělili Barnabáše a Saula k dílu, k němuž je povolal. Po postu a modlitbě na ně vložili ruce a propustili je. V Antiochii, sídle římského místodržitele Sýrie, byla církev, v níž byli učedníci poprvé nazváni křesťany."
      sv: "I församlingen i Antiochia fanns profeter och lärare: Barnabas, Simeon som kallades Niger, Lucius från Cyrene, Manaen, som hade vuxit upp tillsammans med landsfursten Herodes, och Saulus. Medan de tjänade Herren och fastade sade den helige Ande till dem att de skulle avskilja Barnabas och Saulus för det verk som han hade kallat dem till. Efter fasta och bön lade de händerna på de två och sände iväg dem. Antiochia, säte för den romerske ståthållaren i Syrien, var den församling där lärjungarna först hade kallats kristna."
      nb: "I menigheten i Antiokia var det profeter og lærere: Barnabas, Simeon som ble kalt Niger, Lukius fra Kyrene, Manaen, som var vokst opp sammen med fjerdingsfyrsten Herodes, og Saulus. Mens de tjente Herren og fastet, sa Den hellige ånd til dem at de skulle ta ut Barnabas og Saulus til den gjerningen han hadde kalt dem til. Etter faste og bønn la de hendene på de to og sendte dem av sted. Antiokia, setet for den romerske stattholderen i Syria, var menigheten der disiplene først hadde blitt kalt kristne."
      tl: "Sa iglesia sa Antioquia ay may mga propeta at mga guro: si Bernabe, si Simeon na tinatawag na Niger, si Lucio na taga-Cirene, si Manaen na kapatid sa gatas ni Herodes na tetrarka, at si Saulo. Habang naglilingkod sila sa Panginoon at nag-aayuno, sinabi sa kanila ng Espiritu Santo na ibukod sina Bernabe at Saulo para sa gawaing itinawag niya sa kanila. Pagkatapos mag-ayuno at manalangin, ipinatong nila ang kanilang mga kamay sa dalawa at pinayaon sila. Ang Antioquia, ang luklukan ng Romanong gobernador ng Siria, ay ang iglesia kung saan unang tinawag na mga Cristiano ang mga alagad."
      da: "I menigheden i Antiokia var der profeter og lærere: Barnabas, Simeon, kaldet Niger, Lukius fra Kyrene, Manaen, som var opvokset sammen med fjerdingsfyrsten Herodes, og Saulus. Mens de tjente Herren og fastede, sagde Helligånden til dem, at de skulle udtage Barnabas og Saulus til den gerning, han havde kaldet dem til. Efter faste og bøn lagde de hænderne på de to og sendte dem af sted. Antiokia, sæde for den romerske statholder i Syrien, havde den menighed, hvor disciplene først var blevet kaldt kristne."
      sr: "У цркви у Антиохији били су пророци и учитељи: Варнава, Симеун звани Нигар, Лукије Киринац, Манаил, који је одгајен с Иродом четворовласником, и Савле. Док су служили Господу и постили, Дух Свети им је рекао да одвоје Варнаву и Савла за дело на које их је позвао. После поста и молитве положили су руке на њих двојицу и отпустили их. У Антиохији, седишту римског намесника Сирије, ученици су први пут били названи хришћанима."
      hu: "Az antiókhiai gyülekezetben próféták és tanítók voltak: Barnabás, a Nigernek nevezett Simeon, a cirénei Lukiusz, Manaén, aki Heródes negyedes fejedelemmel együtt nevelkedett, és Saul. Amikor az Úrnak szolgáltak és böjtöltek, a Szentlélek azt mondta nekik, hogy válasszák külön Barnabást és Sault arra a munkára, amelyre elhívta őket. Böjt és imádság után kezüket rájuk tették, és elbocsátották őket. Antiókhiában, Szíria római helytartójának székhelyén volt az a gyülekezet, ahol a tanítványokat először nevezték keresztyéneknek."
      fi: "Antiokian seurakunnassa oli profeettoja ja opettajia: Barnabas, Simeon, jota kutsuttiin Nigeriksi, kyreneläinen Lukios, Manaen, joka oli kasvanut yhdessä neljännysruhtinas Herodeksen kanssa, sekä Saulus. Heidän palvellessaan Herraa ja paastotessaan Pyhä Henki käski heidän erottaa Barnabaan ja Sauluksen siihen työhön, johon hän oli heidät kutsunut. Paastottuaan ja rukoiltuaan he panivat kätensä näiden kahden päälle ja lähettivät heidät matkaan. Antiokiassa, Syyrian roomalaisen käskynhaltijan istuinpaikassa, oli se seurakunta, jossa opetuslapsia oli ensimmäisen kerran kutsuttu kristityiksi."
      vi: "Trong Hội thánh tại An-ti-ốt có những người tiên tri và giáo sư: Ba-na-ba, Si-mê-ôn gọi là Ni-giê, Lu-si-út người Sy-ren, Ma-na-hem, người đồng dưỡng với vua chư hầu Hê-rốt, và Sau-lơ. Đang khi họ thờ phượng Chúa và kiêng ăn, Đức Thánh Linh bảo họ để riêng Ba-na-ba và Sau-lơ cho công việc Ngài đã gọi hai người làm. Sau khi kiêng ăn và cầu nguyện, họ đặt tay trên hai người rồi để cho đi. An-ti-ốt, nơi đóng trụ sở của quan tổng đốc La Mã xứ Sy-ri, là Hội thánh nơi các môn đồ lần đầu tiên được gọi là Cơ-rê-tiên."
      ro: "În biserica din Antiohia erau proroci și învățători: Barnaba, Simeon numit Niger, Luciu din Cirena, Manaen, care fusese crescut împreună cu tetrarhul Irod, și Saul. Pe când slujeau Domnului și posteau, Duhul Sfânt le-a spus să-i pună deoparte pe Barnaba și pe Saul pentru lucrarea la care îi chemase. După post și rugăciune și-au pus mâinile peste cei doi și i-au trimis. La Antiohia, reședința guvernatorului roman al Siriei, era biserica în care ucenicii fuseseră numiți pentru prima dată creștini."
      bg: "В църквата в Антиохия имаше пророци и учители: Варнава, Симеон, наричан Нигер, Луций Киринеянин, Манаил, възпитан заедно с четвъртовластника Ирод, и Савел. Докато служеха на Господа и постеха, Светият Дух им каза да отделят Варнава и Савел за делото, за което ги беше призовал. След пост и молитва те възложиха ръце на двамата и ги изпратиха. В Антиохия, седалището на римския управител на Сирия, учениците за първи път бяха наречени християни."
  - place: a6d306d # Seleucia Pieria
    ref: Acts.13.4
    note:
      en: The port of Antioch; they sail for Cyprus.
      ru: Порт Антиохии, отплытие на Кипр.
      uk: "Порт Антіохії; вони відпливають на Кіпр."
      es: "El puerto de Antioquía; zarpan hacia Chipre."
      pt: "O porto de Antioquia; navegam para Chipre."
      de: "Der Hafen von Antiochia; sie segeln nach Zypern."
      fr: "Le port d’Antioche ; ils s’embarquent pour Chypre."
      pl: "Port Antiochii; odpływają na Cypr."
      it: "Il porto di Antiochia; salpano per Cipro."
      nl: "De haven van Antiochië; zij varen naar Cyprus."
      cs: "Přístav Antiochie; plují na Kypr."
      sv: "Antiochias hamn; de seglar mot Cypern."
      nb: "Antiokias havneby; de seiler til Kypros."
      tl: "Ang daungan ng Antioquia; naglayag sila patungong Chipre."
      da: "Antiokias havn; de sejler til Cypern."
      sr: "Пристаниште Антиохије; отпловљавају на Кипар."
      hu: "Antiókhia kikötője; hajóra szállnak Ciprus felé."
      fi: "Antiokian satama; he purjehtivat Kyprokselle."
      vi: "Hải cảng của An-ti-ốt; họ xuống tàu đi Chíp-rơ."
      ro: "Portul Antiohiei; pornesc pe mare spre Cipru."
      bg: "Пристанището на Антиохия; те отплават за Кипър."
    story:
      en: "Sent out by the Holy Spirit, Barnabas and Saul went down to Seleucia and sailed from there to Cyprus. Seleucia in Pieria, founded by Seleucus I about 300 BC on the coast near the mouth of the Orontes, was the harbour of Antioch; Strabo puts it 120 stadia, some 22 km, from the city."
      ru: "Посланные Духом Святым, Варнава и Савл пришли в Селевкию и оттуда отплыли на Кипр. Селевкия Пиерийская, основанная Селевком I около 300 г. до н. э. на побережье близ устья Оронта, была гаванью Антиохии; Страбон помещает её в 120 стадиях, примерно в 22 км, от города."
      uk: "Послані Святим Духом, Варнава й Савло прийшли до Селевкії й звідти відпливли на Кіпр. Селевкія Пієрійська, заснована Селевком I близько 300 р. до н. е. на узбережжі біля гирла Оронту, була гаванню Антіохії; Страбон розміщує її за 120 стадіїв, близько 22 км, від міста."
      es: "Enviados por el Espíritu Santo, Bernabé y Saulo bajaron a Seleucia y de allí navegaron a Chipre. Seleucia de Pieria, fundada por Seleuco I hacia el 300 a.C. en la costa, cerca de la desembocadura del Orontes, era el puerto de Antioquía; Estrabón la sitúa a 120 estadios de la ciudad, unos 22 km."
      pt: "Enviados pelo Espírito Santo, Barnabé e Saulo desceram a Selêucia e dali navegaram para Chipre. Selêucia da Piéria, fundada por Seleuco I por volta de 300 a.C. no litoral, perto da foz do Orontes, era o porto de Antioquia; Estrabão situa-a a 120 estádios da cidade, cerca de 22 km."
      de: "Vom Heiligen Geist ausgesandt, zogen Barnabas und Saulus hinab nach Seleukia und segelten von dort nach Zypern. Seleukia Pieria, um 300 v. Chr. von Seleukos I. an der Küste nahe der Mündung des Orontes gegründet, war der Hafen Antiochias; Strabon gibt seine Entfernung von der Stadt mit 120 Stadien an, etwa 22 km."
      fr: "Envoyés par le Saint-Esprit, Barnabas et Saul descendirent à Séleucie et de là s’embarquèrent pour Chypre. Séleucie de Piérie, fondée par Séleucos Ier vers 300 av. J.-C. sur la côte près de l’embouchure de l’Oronte, était le port d’Antioche ; Strabon la place à 120 stades, environ 22 km, de la ville."
      pl: "Wysłani przez Ducha Świętego Barnaba i Saul zeszli do Seleucji i stamtąd popłynęli na Cypr. Seleucja w Pierii, założona przez Seleukosa I około 300 p.n.e. na wybrzeżu w pobliżu ujścia Orontesu, była portem Antiochii; Strabon umieszcza ją 120 stadiów, czyli około 22 km, od miasta."
      it: "Mandati dallo Spirito Santo, Barnaba e Saulo scesero a Seleucia e di là navigarono verso Cipro. Seleucia di Pieria, fondata da Seleuco I verso il 300 a.C. sulla costa presso la foce dell’Oronte, era il porto di Antiochia; Strabone la pone a 120 stadi, circa 22 km, dalla città."
      nl: "Uitgezonden door de Heilige Geest, gingen Barnabas en Saulus af naar Seleucië en voeren van daar naar Cyprus. Seleucië in Pieria, rond 300 v.Chr. door Seleucus I gesticht aan de kust bij de monding van de Orontes, was de haven van Antiochië; Strabo plaatst het op 120 stadiën, zo'n 22 km, van de stad."
      cs: "Barnabáš a Saul, vysláni Duchem svatým, sestoupili do Seleukeie a odtud odpluli na Kypr. Seleukeia v Pierii, kterou založil Seleukos I. kolem roku 300 př. n. l. na pobřeží nedaleko ústí Orontu, byla přístavem Antiochie; Strabón ji klade 120 stadií, asi 22 km, od města."
      sv: "Utsända av den helige Ande gick Barnabas och Saulus ned till Seleukia och seglade därifrån till Cypern. Seleukia i Pierien, grundat av Seleukos I omkring 300 f.Kr. vid kusten nära Orontes mynning, var Antiochias hamn; Strabon anger avståndet till staden till 120 stadier, ungefär 22 km."
      nb: "Utsendt av Den hellige ånd dro Barnabas og Saulus ned til Seleukia og seilte derfra til Kypros. Seleukia i Pieria, grunnlagt av Seleukos I omkring 300 f.Kr. ved kysten nær Orontes' munning, var Antiokias havn; Strabon oppgir avstanden til byen til 120 stadier, omtrent 22 km."
      tl: "Palibhasa'y sinugo ng Espiritu Santo, lumusong sina Bernabe at Saulo sa Seleucia at mula roon ay naglayag patungong Chipre. Ang Seleucia sa Pieria, na itinatag ni Seleuco I noong mga 300 BK sa baybayin malapit sa bunganga ng Orontes, ay ang daungan ng Antioquia; ayon kay Strabo, ito ay 120 estadia, mga 22 km, mula sa lungsod."
      da: "Udsendt af Helligånden drog Barnabas og Saulus ned til Seleukia og sejlede derfra til Cypern. Seleukia i Pierien, grundlagt af Seleukos I omkring 300 f.Kr. ved kysten nær Orontes' munding, var Antiokias havn; Strabon angiver afstanden fra byen til 120 stadier, omkring 22 km."
      sr: "Послани од Духа Светога, Варнава и Савле сишли су у Селеукију и одатле отпловили на Кипар. Селеукија у Пијерији, коју је око 300. п. н. е. основао Селевк I на обали близу ушћа Оронта, била је лука Антиохије; Страбон је смешта 120 стадија, око 22 км, од града."
      hu: "A Szentlélektől kiküldve Barnabás és Saul lement Szeleukiába, és onnan Ciprusra hajózott. A pieriai Szeleukia, amelyet I. Szeleukosz alapított Kr. e. 300 körül a tengerparton, az Orontész torkolata közelében, Antiókhia kikötője volt; Sztrabón 120 stadionnyira, mintegy 22 km-re teszi a várostól."
      fi: "Pyhän Hengen lähettäminä Barnabas ja Saulus menivät Seleukiaan ja purjehtivat sieltä Kyprokselle. Pierian Seleukia, jonka Seleukos I perusti noin 300 eaa. rannikolle lähelle Orontesin suuta, oli Antiokian satama; Strabonin mukaan se oli 120 stadionin, noin 22 km:n, päässä kaupungista."
      vi: "Được Đức Thánh Linh sai đi, Ba-na-ba và Sau-lơ xuống Sê-lơ-xi rồi từ đó đi thuyền đến Chíp-rơ. Sê-lơ-xi xứ Pieria, do Seleucus I lập vào khoảng năm 300 TCN trên bờ biển gần cửa sông Orontes, là hải cảng của An-ti-ốt; Strabo cho biết nơi này cách thành phố 120 stadia, khoảng 22 km."
      ro: "Trimiși de Duhul Sfânt, Barnaba și Saul au coborât la Seleucia și de acolo au navigat spre Cipru. Seleucia Pieriei, întemeiată de Seleucos I în jurul anului 300 î.Hr. pe coastă, lângă gura Orontelui, era portul Antiohiei; Strabon o așază la 120 de stadii, circa 22 km, de oraș."
      bg: "Изпратени от Светия Дух, Варнава и Савел слязоха в Селевкия и оттам отплаваха за Кипър. Селевкия Пиерийска, основана от Селевк I около 300 г. пр.н.е. на брега близо до устието на Оронт, беше пристанището на Антиохия; Страбон я поставя на 120 стадия, около 22 км, от града."
  - place: afa863b # Salamis
    ref: Acts.13.5
    by: sea
    note:
      en: They proclaim the word in the synagogues of the Jews.
      ru: Проповедь в синагогах иудейских.
      uk: "Вони проповідують слово в синагогах юдеїв."
      es: "Proclaman la palabra en las sinagogas de los judíos."
      pt: "Proclamam a palavra nas sinagogas dos judeus."
      de: "Sie verkündigen das Wort in den Synagogen der Juden."
      fr: "Ils annoncent la parole dans les synagogues des Juifs."
      pl: "Głoszą słowo w synagogach żydowskich."
      it: "Annunciano la parola nelle sinagoghe dei Giudei."
      nl: "Zij verkondigen het woord in de synagogen van de Joden."
      cs: "Hlásají slovo v synagogách Židů."
      sv: "De förkunnar ordet i judarnas synagogor."
      nb: "De forkynner ordet i jødenes synagoger."
      tl: "Ipinahahayag nila ang salita sa mga sinagoga ng mga Judio."
      da: "De forkynder ordet i jødernes synagoger."
      sr: "Проповедају реч у синагогама јеврејским."
      hu: "A zsidók zsinagógáiban hirdetik az igét."
      fi: "He julistavat sanaa juutalaisten synagogissa."
      vi: "Họ rao giảng lời Đức Chúa Trời trong các nhà hội của người Giu-đa."
      ro: "Vestesc cuvântul în sinagogile iudeilor."
      bg: "Те проповядват словото в юдейските синагоги."
    story:
      en: "At Salamis, on the east coast of Cyprus and the largest city of the island, they preached the word of God in the synagogues of the Jews, and John was with them as their helper. Acts tells nothing more of their stay: from Salamis they went through the island to the west."
      ru: "В Саламине, на восточном побережье Кипра, крупнейшем городе острова, они проповедовали слово Божие в иудейских синагогах, и Иоанн был с ними как помощник. Больше Деяния ничего не рассказывают об их пребывании там: из Саламина они пошли через остров на запад."
      uk: "У Саламіні, на східному узбережжі Кіпру, найбільшому місті острова, вони проповідували слово Боже в синагогах юдеїв, і Іван був з ними як помічник. Більше Дії нічого не розповідають про їхнє перебування там: із Саламіна вони пішли через острів на захід."
      es: "En Salamina, en la costa oriental de Chipre y la mayor ciudad de la isla, anunciaron la palabra de Dios en las sinagogas de los judíos, y Juan estaba con ellos como ayudante. Los Hechos no cuentan nada más de su estancia: desde Salamina atravesaron la isla hacia el oeste."
      pt: "Em Salamina, na costa leste de Chipre e a maior cidade da ilha, proclamaram a palavra de Deus nas sinagogas dos judeus, e João estava com eles como auxiliar. Atos não conta mais nada da sua estadia: de Salamina atravessaram a ilha rumo ao oeste."
      de: "In Salamis, an der Ostküste Zyperns und der größten Stadt der Insel, verkündigten sie das Wort Gottes in den Synagogen der Juden, und Johannes war als ihr Gehilfe bei ihnen. Mehr berichtet die Apostelgeschichte von ihrem Aufenthalt nicht: Von Salamis zogen sie durch die Insel nach Westen."
      fr: "À Salamine, sur la côte est de Chypre, la plus grande ville de l’île, ils annoncèrent la parole de Dieu dans les synagogues des Juifs, et Jean était avec eux pour les aider. Les Actes ne disent rien de plus de leur séjour : de Salamine, ils traversèrent l’île vers l’ouest."
      pl: "W Salaminie, na wschodnim wybrzeżu Cypru, największym mieście wyspy, głosili słowo Boże w synagogach żydowskich, a Jan był z nimi jako pomocnik. Dzieje nie mówią nic więcej o ich pobycie: z Salaminy przeszli przez wyspę na zachód."
      it: "A Salamina, sulla costa orientale di Cipro e la città più grande dell’isola, annunciarono la parola di Dio nelle sinagoghe dei Giudei, e Giovanni era con loro come aiuto. Gli Atti non dicono altro del loro soggiorno: da Salamina attraversarono l’isola verso occidente."
      nl: "Te Salamis, aan de oostkust van Cyprus en de grootste stad van het eiland, verkondigden zij het woord van God in de synagogen van de Joden, en Johannes was bij hen als hun helper. Meer vertelt Handelingen niet over hun verblijf: vanuit Salamis trokken zij door het eiland naar het westen."
      cs: "Ve městě Salamis na východním pobřeží Kypru, největším sídle ostrova, kázali slovo Boží v židovských synagogách a Jan byl s nimi jako pomocník. Skutky o jejich pobytu nic dalšího neříkají: z města Salamis prošli ostrovem na západ."
      sv: "I Salamis, på Cyperns östkust och öns största stad, förkunnade de Guds ord i judarnas synagogor, och Johannes var med dem som deras medhjälpare. Apostlagärningarna berättar inget mer om deras vistelse: från Salamis drog de genom ön västerut."
      nb: "I Salamis, på østkysten av Kypros og øyas største by, forkynte de Guds ord i jødenes synagoger, og Johannes var med dem som medhjelper. Apostlenes gjerninger forteller ikke mer om oppholdet: fra Salamis dro de gjennom øya mot vest."
      tl: "Sa Salamina, sa silangang baybayin ng Chipre at ang pinakamalaking lungsod ng pulo, ipinangaral nila ang salita ng Diyos sa mga sinagoga ng mga Judio, at kasama nila si Juan bilang katulong. Wala nang iba pang isinasalaysay ang Mga Gawa tungkol sa kanilang pananatili: mula sa Salamina ay tinahak nila ang pulo patungong kanluran."
      da: "I Salamis, på Cyperns østkyst og øens største by, forkyndte de Guds ord i jødernes synagoger, og Johannes var med dem som medhjælper. Apostlenes Gerninger fortæller ikke mere om deres ophold: fra Salamis drog de gennem øen mod vest."
      sr: "У Саламини, највећем граду острва, на источној обали Кипра, проповедали су реч Божју у синагогама јеврејским, а Јован је био с њима као помоћник. Дела не говоре ништа више о њиховом боравку: из Саламине су прошли кроз острво на запад."
      hu: "Szalamiszban, Ciprus keleti partján, a sziget legnagyobb városában Isten igéjét hirdették a zsidók zsinagógáiban, és János is velük volt segítőként. Az Apostolok cselekedetei semmi többet nem mond ottlétükről: Szalamiszból a szigeten át nyugatra mentek."
      fi: "Salamiissa, Kyproksen itärannikolla ja saaren suurimmassa kaupungissa, he julistivat Jumalan sanaa juutalaisten synagogissa, ja Johannes oli heidän mukanaan avustajana. Apostolien teot ei kerro heidän oleskelustaan enempää: Salamiista he kulkivat saaren halki länteen."
      vi: "Tại Sa-la-min, trên bờ biển phía đông Chíp-rơ và là thành lớn nhất của đảo, họ giảng đạo Đức Chúa Trời trong các nhà hội của người Giu-đa, và có Giăng cùng đi để giúp họ. Sách Công vụ không kể gì thêm về thời gian họ ở đó: từ Sa-la-min họ đi xuyên qua đảo về phía tây."
      ro: "La Salamina, pe coasta de est a Ciprului, cel mai mare oraș al insulei, au vestit cuvântul lui Dumnezeu în sinagogile iudeilor, iar Ioan era cu ei ca ajutor. Faptele nu mai spun nimic despre șederea lor: de la Salamina au străbătut insula spre vest."
      bg: "В Саламин, най-големия град на острова, на източния бряг на Кипър, те проповядваха Божието слово в юдейските синагоги, а Йоан беше с тях като помощник. Деяния не разказват нищо повече за престоя им: от Саламин те минаха през острова на запад."
  - place: a314765 # Paphos
    ref: Acts.13.6-Acts.13.12
    note:
      en: The proconsul Sergius Paulus believes.
      ru: Проконсул Сергий Павел приходит к вере.
      uk: "Проконсул Сергій Павло вірує."
      es: "El procónsul Sergio Paulo cree."
      pt: "O procônsul Sérgio Paulo crê."
      de: "Der Prokonsul Sergius Paulus kommt zum Glauben."
      fr: "Le proconsul Sergius Paulus croit."
      pl: "Prokonsul Sergiusz Paweł wierzy."
      it: "Il proconsole Sergio Paolo crede."
      nl: "De proconsul Sergius Paulus komt tot geloof."
      cs: "Prokonzul Sergius Paulus uvěří."
      sv: "Prokonsuln Sergius Paulus kommer till tro."
      nb: "Prokonsulen Sergius Paulus kommer til tro."
      tl: "Sumasampalataya ang prokonsul na si Sergio Paulo."
      da: "Prokonsul Sergius Paulus kommer til tro."
      sr: "Намесник Сергије Павле поверује."
      hu: "Szergiusz Paulusz prokonzul hisz."
      fi: "Käskynhaltija Sergius Paulus tulee uskoon."
      vi: "Quan trấn thủ Sê-giúp Phau-lút tin."
      ro: "Proconsulul Sergiu Paul crede."
      bg: "Проконсулът Сергий Павел повярва."
    story:
      en: "Crossing the whole island, they came to Paphos, the harbour city on the south-west coast where the Roman governor of Cyprus had his seat. The proconsul Sergius Paulus, a man of understanding, called for Barnabas and Saul and wished to hear the word of God. But a Jewish sorcerer and false prophet in his company, Bar-jesus, also called Elymas, opposed them and tried to turn the proconsul away from the faith. Saul, who was also called Paul, filled with the Holy Spirit, looked at him and told him that the hand of the Lord was upon him and that he would be blind for a time; at once mist and darkness fell on him, and he groped for someone to lead him by the hand. When the proconsul saw what had happened, he believed, astonished at the teaching of the Lord. From here on Acts calls the apostle Paul."
      ru: "Пройдя весь остров, они пришли в Паф, портовый город на юго-западном побережье, где находилась резиденция римского наместника Кипра. Проконсул Сергий Павел, человек разумный, призвал Варнаву и Савла и пожелал услышать слово Божие. Но бывший при нём иудейский волхв и лжепророк Вариисус, называемый также Елимой, противился им и старался отвратить проконсула от веры. Савл, он же Павел, исполнившись Духа Святого, взглянул на него и сказал, что на нём рука Господня и что он на время ослепнет; тотчас на него напали мрак и тьма, и он ходил ощупью, ища, кто бы повёл его за руку. Увидев происшедшее, проконсул уверовал, дивясь учению Господню. С этого места Деяния называют апостола Павлом."
      uk: "Пройшовши весь острів, вони прийшли до Пафоса, портового міста на південно-західному узбережжі, де мав осідок римський намісник Кіпру. Проконсул Сергій Павло, людина розумна, покликав Варнаву й Савла й бажав почути слово Боже. Але юдейський чарівник і лжепророк з його оточення, Вар-Ісус, якого називали також Єлимою, противився їм і намагався відвернути проконсула від віри. Савло, він же Павло, сповнившись Святого Духа, подивився на нього й сказав, що на ньому рука Господня і що він на якийсь час осліпне; тієї ж миті на нього впали туман і темрява, і він навпомацки шукав, хто б повів його за руку. Побачивши, що сталося, проконсул увірував, дивуючись науці Господній. Відтепер Дії називають апостола Павлом."
      es: "Tras recorrer toda la isla, llegaron a Pafos, la ciudad portuaria de la costa suroccidental donde tenía su sede el gobernador romano de Chipre. El procónsul Sergio Paulo, hombre prudente, llamó a Bernabé y a Saulo y quiso oír la palabra de Dios. Pero un mago judío y falso profeta de su entorno, Barjesús, llamado también Elimas, se les oponía y procuraba apartar de la fe al procónsul. Saulo, que también se llamaba Pablo, lleno del Espíritu Santo, fijó en él los ojos y le dijo que la mano del Señor estaba contra él y que quedaría ciego por un tiempo; al instante cayeron sobre él niebla y tinieblas, y buscaba a tientas quien lo llevara de la mano. Al ver lo sucedido, el procónsul creyó, maravillado de la doctrina del Señor. A partir de aquí los Hechos llaman Pablo al apóstol."
      pt: "Depois de atravessarem toda a ilha, chegaram a Pafos, a cidade portuária da costa sudoeste onde o governador romano de Chipre tinha a sua sede. O procônsul Sérgio Paulo, homem inteligente, chamou Barnabé e Saulo e quis ouvir a palavra de Deus. Mas um feiticeiro judeu e falso profeta do seu círculo, Barjesus, também chamado Elimas, opunha-se a eles e procurava desviar o procônsul da fé. Saulo, que também se chamava Paulo, cheio do Espírito Santo, fixou os olhos nele e disse-lhe que a mão do Senhor estava sobre ele e que ficaria cego por algum tempo; imediatamente caíram sobre ele névoa e escuridão, e ele andava às apalpadelas procurando quem o conduzisse pela mão. Vendo o que tinha acontecido, o procônsul creu, maravilhado com o ensino do Senhor. A partir daqui Atos chama o apóstolo de Paulo."
      de: "Sie durchzogen die ganze Insel und kamen nach Paphos, der Hafenstadt an der Südwestküste, wo der römische Statthalter von Zypern seinen Sitz hatte. Der Prokonsul Sergius Paulus, ein verständiger Mann, rief Barnabas und Saulus zu sich und wollte das Wort Gottes hören. Doch ein jüdischer Zauberer und falscher Prophet in seiner Umgebung, Bar-Jesus, auch Elymas genannt, widerstand ihnen und versuchte, den Prokonsul vom Glauben abzubringen. Saulus, der auch Paulus hieß, voll des Heiligen Geistes, sah ihn an und sagte ihm, die Hand des Herrn sei über ihm und er werde eine Zeit lang blind sein; sogleich fielen Nebel und Finsternis auf ihn, und er tastete umher und suchte jemanden, der ihn an der Hand führte. Als der Prokonsul sah, was geschehen war, kam er zum Glauben, betroffen von der Lehre des Herrn. Von hier an nennt die Apostelgeschichte den Apostel Paulus."
      fr: "Traversant toute l’île, ils arrivèrent à Paphos, la ville portuaire de la côte sud-ouest où siégeait le gouverneur romain de Chypre. Le proconsul Sergius Paulus, homme intelligent, fit appeler Barnabas et Saul et désira entendre la parole de Dieu. Mais un magicien juif et faux prophète de son entourage, Bar-Jésus, appelé aussi Élymas, s’opposait à eux et cherchait à détourner le proconsul de la foi. Saul, appelé aussi Paul, rempli du Saint-Esprit, fixa les regards sur lui et lui dit que la main du Seigneur était sur lui et qu’il serait aveugle pour un temps ; aussitôt l’obscurité et les ténèbres tombèrent sur lui, et il cherchait à tâtons quelqu’un pour le conduire par la main. Voyant ce qui était arrivé, le proconsul crut, frappé de la doctrine du Seigneur. À partir d’ici, les Actes appellent l’apôtre Paul."
      pl: "Przemierzywszy całą wyspę, przybyli do Pafos, portowego miasta na południowo-zachodnim wybrzeżu, w którym rezydował rzymski namiestnik Cypru. Prokonsul Sergiusz Paweł, człowiek rozumny, wezwał Barnabę i Saula i pragnął usłyszeć słowo Boże. Lecz żydowski czarnoksiężnik i fałszywy prorok z jego otoczenia, Bar-Jezus, zwany też Elimas, sprzeciwiał się im i usiłował odwieść prokonsula od wiary. Saul, zwany też Pawłem, napełniony Duchem Świętym, spojrzał na niego i oznajmił mu, że ręka Pana jest nad nim i że na pewien czas oślepnie; natychmiast padły na niego mgła i ciemność, a on szukał po omacku kogoś, kto by go poprowadził za rękę. Gdy prokonsul zobaczył, co się stało, uwierzył, zdumiony nauką Pana. Odtąd Dzieje nazywają apostoła Pawłem."
      it: "Attraversata tutta l’isola, giunsero a Pafo, la città portuale della costa sud-occidentale dove aveva sede il governatore romano di Cipro. Il proconsole Sergio Paolo, uomo intelligente, chiamò a sé Barnaba e Saulo e desiderava udire la parola di Dio. Ma un mago giudeo e falso profeta del suo seguito, Bar-Gesù, chiamato anche Elima, si opponeva loro e cercava di distogliere il proconsole dalla fede. Saulo, chiamato anche Paolo, pieno dello Spirito Santo, lo guardò fisso e gli disse che la mano del Signore era sopra di lui e che sarebbe stato cieco per un certo tempo; subito caligine e tenebre caddero su di lui, e andava a tentoni cercando qualcuno che lo conducesse per mano. Visto ciò che era accaduto, il proconsole credette, stupito della dottrina del Signore. Da qui in avanti gli Atti chiamano l’apostolo Paolo."
      nl: "Zij trokken over het hele eiland en kwamen te Paffos, de havenstad aan de zuidwestkust waar de Romeinse stadhouder van Cyprus zetelde. De proconsul Sergius Paulus, een verstandig man, riep Barnabas en Saulus bij zich en wilde het woord van God horen. Maar een Joodse tovenaar en valse profeet uit zijn omgeving, Bar-Jezus, ook Elymas genaamd, verzette zich tegen hen en probeerde de proconsul van het geloof af te keren. Saulus, die ook Paulus heette, vervuld met de Heilige Geest, keek hem aan en zei hem dat de hand van de Heer tegen hem was en dat hij een tijd blind zou zijn; terstond vielen nevel en duisternis op hem, en hij tastte rond naar iemand die hem bij de hand kon leiden. Toen de proconsul zag wat er gebeurd was, kwam hij tot geloof, verslagen over de leer van de Heer. Vanaf hier noemt Handelingen de apostel Paulus."
      cs: "Prošli celým ostrovem a přišli do Pafosu, přístavního města na jihozápadním pobřeží, kde sídlil římský místodržitel Kypru. Prokonzul Sergius Paulus, muž rozumný, si zavolal Barnabáše a Saula a chtěl slyšet slovo Boží. Avšak židovský čaroděj a falešný prorok z jeho okolí, Barježíš, zvaný též Elymas, se jim stavěl na odpor a snažil se odvrátit prokonzula od víry. Saul, zvaný též Pavel, naplněný Duchem svatým, na něj pohleděl a řekl mu, že je nad ním ruka Páně a že bude nějakou dobu slepý; v tu chvíli na něj padla mlha a tma a on tápal a hledal někoho, kdo by ho vedl za ruku. Když prokonzul uviděl, co se stalo, uvěřil, ohromen učením Páně. Od této chvíle Skutky nazývají apoštola Pavlem."
      sv: "De korsade hela ön och kom till Pafos, hamnstaden på sydvästkusten där den romerske ståthållaren på Cypern hade sitt säte. Prokonsuln Sergius Paulus, en förståndig man, kallade till sig Barnabas och Saulus och ville höra Guds ord. Men en judisk trollkarl och falsk profet i hans följe, Barjesus, även kallad Elymas, stod emot dem och försökte vända prokonsuln bort från tron. Saulus, som också kallades Paulus, uppfylld av den helige Ande, fäste blicken på honom och sade att Herrens hand var över honom och att han skulle vara blind en tid; genast föll dimma och mörker över honom, och han trevade efter någon som kunde leda honom vid handen. När prokonsuln såg vad som hade hänt, kom han till tro, slagen av häpnad över Herrens lära. Härifrån kallar Apostlagärningarna aposteln Paulus."
      nb: "De krysset hele øya og kom til Pafos, havnebyen på sørvestkysten der den romerske stattholderen på Kypros hadde sitt sete. Prokonsulen Sergius Paulus, en forstandig mann, kalte Barnabas og Saulus til seg og ønsket å høre Guds ord. Men en jødisk trollmann og falsk profet i hans følge, Barjesus, også kalt Elymas, sto dem imot og prøvde å vende prokonsulen bort fra troen. Saulus, som også ble kalt Paulus, fylt av Den hellige ånd, så skarpt på ham og sa at Herrens hånd var over ham, og at han skulle være blind en tid; straks falt det skodde og mørke over ham, og han famlet etter noen som kunne lede ham ved hånden. Da prokonsulen så det som hadde skjedd, kom han til tro, slått av undring over Herrens lære. Herfra kaller Apostlenes gjerninger apostelen Paulus."
      tl: "Nang matahak ang buong pulo, dumating sila sa Pafos, ang lungsod-daungan sa timog-kanlurang baybayin kung saan nakaluklok ang Romanong gobernador ng Chipre. Ipinatawag ng prokonsul na si Sergio Paulo, isang lalaking matalino, sina Bernabe at Saulo, at ninais niyang mapakinggan ang salita ng Diyos. Ngunit isang Judiong manggagaway at bulaang propeta na kasama niya, si Bar-Jesus, na tinatawag ding Elimas, ay humadlang sa kanila at pinagsikapang ihiwalay ang prokonsul sa pananampalataya. Si Saulo, na tinatawag ding Pablo, na puspos ng Espiritu Santo, ay tumitig sa kaniya at sinabi sa kaniya na nasa kaniya ang kamay ng Panginoon at mabubulag siya nang ilang panahon; pagdaka'y nahulog sa kaniya ang ulap at kadiliman, at nangapa siya na humahanap ng aakay sa kaniya sa kamay. Nang makita ng prokonsul ang nangyari, siya'y sumampalataya, na nanggigilalas sa aral ng Panginoon. Mula rito ay tinatawag ng Mga Gawa ang apostol na Pablo."
      da: "De krydsede hele øen og kom til Pafos, havnebyen på sydvestkysten, hvor den romerske statholder på Cypern havde sit sæde. Prokonsulen Sergius Paulus, en forstandig mand, kaldte Barnabas og Saulus til sig og ønskede at høre Guds ord. Men en jødisk troldmand og falsk profet i hans følge, Bar-Jesus, også kaldet Elimas, modsatte sig dem og søgte at vende prokonsulen bort fra troen. Saulus, som også blev kaldt Paulus, fyldt med Helligånden, så fast på ham og sagde, at Herrens hånd var over ham, og at han skulle være blind en tid; straks faldt der mulm og mørke over ham, og han famlede omkring efter nogen, der kunne lede ham ved hånden. Da prokonsulen så, hvad der var sket, troede han, slået af forundring over Herrens lære. Herfra kalder Apostlenes Gerninger apostlen Paulus."
      sr: "Прешавши цело острво, дошли су у Пафос, лучки град на југозападној обали где је седео римски намесник Кипра. Намесник Сергије Павле, човек разуман, дозвао је Варнаву и Савла и желео да чује реч Божју. Али јеврејски врачар и лажни пророк из његове пратње, Варисус, зван и Елима, супротстављао им се и покушавао да одврати намесника од вере. Савле, који се звао и Павле, пун Духа Светога, погледао га је и рекао му да је рука Господња на њему и да ће бити слеп за неко време; одмах је на њега пала магла и тама, и пипајући је тражио некога да га води за руку. Кад је намесник видео шта се догодило, поверовао је, задивљен науком Господњом. Одавде па надаље Дела зову апостола Павлом."
      hu: "Az egész szigeten átkelve Páfoszba érkeztek, a délnyugati parton fekvő kikötővárosba, ahol Ciprus római helytartója székelt. Szergiusz Paulusz prokonzul, ez az okos ember, magához hívatta Barnabást és Sault, és hallani kívánta Isten igéjét. De a kíséretéhez tartozó zsidó varázsló és hamis próféta, Bar-Jézus, akit Elimásnak is hívtak, szembeszállt velük, és igyekezett a prokonzult eltéríteni a hittől. Saul, akit Pálnak is neveztek, Szentlélekkel telve ránézett, és megmondta neki, hogy az Úr keze van rajta, és egy ideig vak lesz; azonnal homály és sötétség szállt rá, és tapogatózva keresett valakit, aki kézen fogva vezesse. Amikor a prokonzul látta, mi történt, hitt, elámulva az Úr tanításán. Innentől az Apostolok cselekedetei az apostolt Pálnak nevezi."
      fi: "Kuljettuaan koko saaren halki he tulivat Pafokseen, lounaisrannikon satamakaupunkiin, jossa Kyproksen roomalaisella käskynhaltijalla oli istuinpaikkansa. Käskynhaltija Sergius Paulus, ymmärtäväinen mies, kutsui luokseen Barnabaan ja Sauluksen ja halusi kuulla Jumalan sanaa. Mutta hänen seurueeseensa kuuluva juutalainen noita ja väärä profeetta Barjesus, jota kutsuttiin myös Elymakseksi, vastusti heitä ja yritti kääntää käskynhaltijan pois uskosta. Saulus, jota kutsuttiin myös Paavaliksi, täynnä Pyhää Henkeä, katsoi häneen ja sanoi hänelle, että Herran käsi oli hänen päällään ja että hän olisi jonkin aikaa sokea; heti hänen päälleen lankesi synkeys ja pimeys, ja hän haparoi etsien jotakuta taluttamaan häntä kädestä. Kun käskynhaltija näki, mitä oli tapahtunut, hän uskoi, hämmästyneenä Herran opista. Tästä eteenpäin Apostolien teot kutsuu apostolia Paavaliksi."
      vi: "Băng qua cả đảo, họ đến Ba-phô, thành cảng trên bờ biển phía tây nam, nơi quan tổng đốc La Mã của Chíp-rơ đóng trụ sở. Quan trấn thủ Sê-giúp Phau-lút, một người khôn ngoan, cho mời Ba-na-ba và Sau-lơ đến và muốn nghe đạo Đức Chúa Trời. Nhưng một thuật sĩ và tiên tri giả người Giu-đa ở với ông, là Ba-Giê-su, cũng gọi là Ê-ly-ma, chống lại hai người và tìm cách làm cho quan trấn thủ lìa bỏ đức tin. Sau-lơ, cũng gọi là Phao-lô, đầy dẫy Đức Thánh Linh, nhìn thẳng vào người và nói rằng tay Chúa đang giáng trên người và người sẽ bị mù một thời gian; lập tức sự mù mịt tối tăm phủ trên người, và người mò mẫm tìm kẻ dắt tay mình. Thấy việc đã xảy ra, quan trấn thủ tin, lấy làm lạ về đạo Chúa. Từ đây trở đi, sách Công vụ gọi vị sứ đồ là Phao-lô."
      ro: "Străbătând toată insula, au ajuns la Pafos, orașul-port de pe coasta de sud-vest unde își avea reședința guvernatorul roman al Ciprului. Proconsulul Sergiu Paul, bărbat înțelept, i-a chemat pe Barnaba și pe Saul și dorea să audă cuvântul lui Dumnezeu. Dar un vrăjitor iudeu și proroc mincinos din preajma lui, Bar-Isus, numit și Elima, li se împotrivea și căuta să-l abată pe proconsul de la credință. Saul, numit și Pavel, plin de Duhul Sfânt, s-a uitat țintă la el și i-a spus că mâna Domnului este asupra lui și că va fi orb pentru o vreme; îndată a căzut peste el ceață și întuneric, și bâjbâia căutând pe cineva să-l ducă de mână. Când a văzut proconsulul ce se întâmplase, a crezut, uimit de învățătura Domnului. De aici înainte Faptele îl numesc pe apostol Pavel."
      bg: "Като прекосиха целия остров, стигнаха до Пафос — пристанищния град на югозападния бряг, където седеше римският управител на Кипър. Проконсулът Сергий Павел, разумен човек, повика Варнава и Савел и пожела да чуе Божието слово. Но един юдейски магьосник и лъжепророк от обкръжението му, Вариисус, наричан също Елима, им се противопоставяше и се опитваше да отклони проконсула от вярата. Савел, наричан също Павел, изпълнен със Светия Дух, се вгледа в него и му каза, че ръката на Господа е върху него и че той ще бъде слеп за известно време; веднага върху него паднаха мъгла и тъмнина и той опипом търсеше някой да го води за ръка. Като видя станалото, проконсулът повярва, смаян от учението на Господа. Оттук нататък Деяния наричат апостола Павел."
  - place: aff04b8 # Perga
    ref: Acts.13.13
    by: sea
    note:
      en: John Mark returns to Jerusalem.
