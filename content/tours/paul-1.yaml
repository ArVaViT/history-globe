# Paul's first missionary journey, Acts 13–14.
# Stops follow the order of the text; the return leg is stated in Acts 14:21–26.
# Year: c. AD 46–48 (approximate; Pauline chronology is debated).
id: paul-1
title:
  en: "Paul's first journey"
  ru: "Первое путешествие Павла"
  uk: "Перша подорож Павла"
  es: "El primer viaje de Pablo"
  pt: "A primeira viagem de Paulo"
  de: "Die erste Reise des Paulus"
  fr: "Le premier voyage de Paul"
  pl: "Pierwsza podróż Pawła"
  it: "Il primo viaggio di Paolo"
  nl: "De eerste reis van Paulus"
  cs: "První Pavlova cesta"
  sv: "Paulus’ första resa"
  nb: "Paulus' første reise"
  tl: "Ang unang paglalakbay ni Pablo"
  da: "Paulus' første rejse"
  sr: "Павлово прво путовање"
  hu: "Pál első útja"
  fi: "Paavalin ensimmäinen matka"
  vi: "Cuộc hành trình thứ nhất của Phao-lô"
  ro: "Prima călătorie a lui Pavel"
  bg: "Първото пътуване на Павел"
