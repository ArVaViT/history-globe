      pl: "Nauczanie w synagodze; zwrot ku poganom."
      it: "Predicazione nella sinagoga; ci si volge ai Gentili."
      nl: "Prediking in de synagoge; de wending naar de heidenen."
      cs: "Kázání v synagoze; obrácení k pohanům."
      sv: "Förkunnelse i synagogan; vändningen till hedningarna."
      nb: "Forkynnelse i synagogen; vendingen til hedningene."
      tl: "Pangangaral sa sinagoga; pagbaling sa mga Gentil."
      da: "Forkyndelse i synagogen; vending mod hedningerne."
