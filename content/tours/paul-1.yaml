      bg: "Проповед в синагогата; обръщане към езичниците."
    story:
      en: "From Perga they went inland to Antioch in Pisidia, a Roman colony settled by Augustus with veterans. On the sabbath they sat in the synagogue, and after the reading of the Law and the Prophets the rulers of the synagogue invited them to speak. Paul stood up and told the history of Israel from Egypt to David, then proclaimed Jesus, of David's line, condemned in Jerusalem and raised by God, through whom forgiveness of sins is preached. The Gentiles asked to hear more, and on the next sabbath almost the whole city came together. Seeing the crowds, the Jews were filled with envy and contradicted Paul; Paul and Barnabas answered that the word had to be spoken to them first, but since they rejected it, they were turning to the Gentiles. The word spread through the region until the Jews stirred up the devout women of high standing and the chief men of the city, and the apostles were driven out of the district."
      ru: "Из Пергии они пошли в глубь страны, в Антиохию Писидийскую, римскую колонию, где Август поселил ветеранов. В субботу они сели в синагоге, и после чтения Закона и Пророков начальники синагоги пригласили их говорить. Павел встал и рассказал историю Израиля от Египта до Давида, а затем возвестил Иисуса из рода Давидова, осуждённого в Иерусалиме и воскрешённого Богом, через Которого проповедуется прощение грехов. Язычники просили рассказать больше, и в следующую субботу собрался почти весь город. Увидев толпы, иудеи исполнились зависти и стали возражать Павлу; Павел и Варнава ответили, что слово надлежало сначала проповедать им, но раз они его отвергают, апостолы обращаются к язычникам. Слово распространялось по всей округе, пока иудеи не подстрекнули набожных и знатных женщин и первых людей города, и апостолов изгнали из тех пределов."
      uk: "З Перге вони пішли вглиб країни, до Антіохії Пісідійської, римської колонії, де Август оселив ветеранів. У суботу вони сіли в синагозі, і після читання Закону й Пророків старшини синагоги запросили їх говорити. Павло встав і розповів історію Ізраїлю від Єгипту до Давида, а потім проголосив Ісуса з роду Давидового, засудженого в Єрусалимі й воскрешеного Богом, через Якого проповідується прощення гріхів. Язичники просили розповісти більше, і наступної суботи зібралося майже все місто. Побачивши натовпи, юдеї сповнилися заздрощів і стали суперечити Павлові; Павло й Варнава відповіли, що слово належало спершу проповідати їм, але оскільки вони його відкидають, апостоли звертаються до язичників. Слово поширювалося по всій околиці, аж поки юдеї не підбурили побожних і знатних жінок та перших людей міста, і апостолів вигнали з тих країв."
      es: "Desde Perge subieron tierra adentro a Antioquía de Pisidia, colonia romana poblada por Augusto con veteranos. El sábado se sentaron en la sinagoga, y después de la lectura de la Ley y los Profetas los principales de la sinagoga los invitaron a hablar. Pablo se levantó y relató la historia de Israel desde Egipto hasta David, y luego anunció a Jesús, del linaje de David, condenado en Jerusalén y resucitado por Dios, por medio del cual se anuncia el perdón de los pecados. Los gentiles pidieron oír más, y el sábado siguiente se reunió casi toda la ciudad. Al ver la multitud, los judíos se llenaron de envidia y contradecían a Pablo; Pablo y Bernabé respondieron que era necesario anunciarles la palabra a ellos primero, pero que, puesto que la rechazaban, se volvían a los gentiles. La palabra se difundió por la región hasta que los judíos incitaron a las mujeres piadosas de posición distinguida y a los principales de la ciudad, y los apóstoles fueron expulsados de la comarca."
      pt: "De Perge subiram para o interior, até Antioquia da Pisídia, colônia romana povoada por Augusto com veteranos. No sábado sentaram-se na sinagoga e, depois da leitura da Lei e dos Profetas, os líderes da sinagoga convidaram-nos a falar. Paulo levantou-se e narrou a história de Israel desde o Egito até Davi, e depois anunciou Jesus, da linhagem de Davi, condenado em Jerusalém e ressuscitado por Deus, por meio de quem é anunciado o perdão dos pecados. Os gentios pediram para ouvir mais, e no sábado seguinte quase toda a cidade se reuniu. Ao verem as multidões, os judeus encheram-se de inveja e contradiziam Paulo; Paulo e Barnabé responderam que a palavra tinha de lhes ser anunciada primeiro, mas, visto que a rejeitavam, eles se voltavam para os gentios. A palavra espalhou-se pela região até que os judeus instigaram as mulheres devotas de alta posição e os principais homens da cidade, e os apóstolos foram expulsos do território."
      de: "Von Perge zogen sie landeinwärts nach Antiochia in Pisidien, einer römischen Kolonie, in der Augustus Veteranen angesiedelt hatte. Am Sabbat setzten sie sich in die Synagoge, und nach der Lesung aus dem Gesetz und den Propheten forderten die Vorsteher der Synagoge sie auf zu reden. Paulus stand auf und erzählte die Geschichte Israels von Ägypten bis David, dann verkündigte er Jesus aus dem Geschlecht Davids, der in Jerusalem verurteilt und von Gott auferweckt worden war und durch den Vergebung der Sünden verkündigt wird. Die Heiden baten, mehr zu hören, und am nächsten Sabbat kam fast die ganze Stadt zusammen. Als die Juden die Menge sahen, wurden sie voll Neid und widersprachen Paulus; Paulus und Barnabas antworteten, das Wort habe zuerst ihnen gesagt werden müssen, da sie es aber zurückwiesen, wendeten sie sich zu den Heiden. Das Wort breitete sich in der Gegend aus, bis die Juden die frommen vornehmen Frauen und die Obersten der Stadt aufwiegelten und die Apostel aus dem Gebiet vertrieben wurden."
      fr: "De Perge, ils montèrent dans l’intérieur des terres jusqu’à Antioche de Pisidie, colonie romaine où Auguste avait établi des vétérans. Le jour du sabbat, ils s’assirent dans la synagogue, et après la lecture de la loi et des prophètes, les chefs de la synagogue les invitèrent à parler. Paul se leva et retraça l’histoire d’Israël de l’Égypte à David, puis annonça Jésus, de la lignée de David, condamné à Jérusalem et ressuscité par Dieu, par qui le pardon des péchés est annoncé. Les païens demandèrent à en entendre davantage, et le sabbat suivant, presque toute la ville se rassembla. Voyant la foule, les Juifs furent remplis de jalousie et contredirent Paul ; Paul et Barnabas répondirent que la parole devait leur être annoncée d’abord, mais que, puisqu’ils la repoussaient, ils se tournaient vers les païens. La parole se répandit dans toute la région, jusqu’à ce que les Juifs excitent les femmes dévotes de distinction et les principaux de la ville, et les apôtres furent chassés du territoire."
      pl: "Z Perge ruszyli w głąb lądu do Antiochii Pizydyjskiej, rzymskiej kolonii, którą August osadził weteranami. W szabat usiedli w synagodze, a po czytaniu Prawa i Proroków przełożeni synagogi zaprosili ich, by przemówili. Paweł wstał i opowiedział dzieje Izraela od Egiptu do Dawida, po czym ogłosił Jezusa z rodu Dawida, skazanego w Jerozolimie i wskrzeszonego przez Boga, przez którego głoszone jest odpuszczenie grzechów. Poganie prosili, by usłyszeć więcej, a w następny szabat zebrało się niemal całe miasto. Na widok tłumów Żydzi napełnili się zazdrością i sprzeciwiali się Pawłowi; Paweł i Barnaba odpowiedzieli, że słowo musiało być najpierw głoszone im, ale skoro je odrzucają, oni zwracają się do pogan. Słowo rozchodziło się po całej krainie, aż Żydzi podburzyli pobożne kobiety z wyższych sfer i najznaczniejszych mężczyzn w mieście, a apostołowie zostali wypędzeni z tych okolic."
      it: "Da Perge salirono nell’entroterra ad Antiochia di Pisidia, colonia romana in cui Augusto aveva insediato dei veterani. Il sabato sedettero nella sinagoga e, dopo la lettura della legge e dei profeti, i capi della sinagoga li invitarono a parlare. Paolo si alzò e ripercorse la storia d’Israele dall’Egitto a Davide, poi annunciò Gesù, della stirpe di Davide, condannato a Gerusalemme e risuscitato da Dio, per mezzo del quale è annunciata la remissione dei peccati. I Gentili chiesero di sentire di più, e il sabato seguente quasi tutta la città si radunò. Vedendo le folle, i Giudei furono pieni d’invidia e contraddicevano Paolo; Paolo e Barnaba risposero che la parola doveva essere annunciata prima a loro, ma poiché la respingevano, si volgevano ai Gentili. La parola si diffuse per tutta la regione, finché i Giudei istigarono le donne pie e ragguardevoli e i principali uomini della città, e gli apostoli furono cacciati dal territorio."
      nl: "Van Perge trokken zij landinwaarts naar Antiochië in Pisidië, een Romeinse kolonie waar Augustus veteranen had gevestigd. Op de sabbat gingen zij in de synagoge zitten, en na de lezing van de Wet en de Profeten nodigden de oversten van de synagoge hen uit te spreken. Paulus stond op en vertelde de geschiedenis van Israël van Egypte tot David, en verkondigde daarna Jezus, uit het geslacht van David, in Jeruzalem veroordeeld en door God opgewekt, door wie vergeving van zonden wordt verkondigd. De heidenen vroegen meer te horen, en op de volgende sabbat kwam bijna de hele stad bijeen. Toen de Joden de scharen zagen, werden zij met nijd vervuld en spraken Paulus tegen; Paulus en Barnabas antwoordden dat het woord eerst tot hen gesproken moest worden, maar dat zij zich, nu zij het verwierpen, tot de heidenen keerden. Het woord verspreidde zich door de streek, totdat de Joden de godsdienstige vrouwen van aanzien en de voornaamsten van de stad ophitsten en de apostelen uit het gebied werden verdreven."
      cs: "Z Perge se vydali do vnitrozemí, do Antiochie Pisidské, římské kolonie, kterou Augustus osídlil veterány. V sobotu se posadili v synagoze a po čtení Zákona a Proroků je představení synagogy vyzvali, aby promluvili. Pavel povstal a vyložil dějiny Izraele od Egypta po Davida, potom zvěstoval Ježíše z Davidova rodu, odsouzeného v Jeruzalémě a vzkříšeného Bohem, skrze něhož se zvěstuje odpuštění hříchů. Pohané prosili, aby slyšeli víc, a příští sobotu se sešlo téměř celé město. Když Židé uviděli zástupy, naplnila je závist a odporovali Pavlovi; Pavel a Barnabáš odpověděli, že slovo muselo být nejprve mluveno k nim, ale protože je odmítají, obracejí se k pohanům. Slovo se šířilo po celém kraji, dokud Židé nepoštvali zbožné vznešené ženy a přední muže města, a apoštolové byli z tamního kraje vyhnáni."
      sv: "Från Perge drog de inåt landet till Antiochia i Pisidien, en romersk koloni där Augustus hade bosatt veteraner. På sabbaten satte de sig i synagogan, och efter läsningen ur lagen och profeterna bad synagogföreståndarna dem att tala. Paulus reste sig och berättade Israels historia från Egypten till David och förkunnade sedan Jesus, av Davids släkt, dömd i Jerusalem och uppväckt av Gud, genom vilken syndernas förlåtelse förkunnas. Hedningarna bad att få höra mer, och följande sabbat kom nästan hela staden tillsammans. När judarna såg folkmassorna, uppfylldes de av avund och motsade Paulus; Paulus och Barnabas svarade att ordet först måste förkunnas för dem, men eftersom de stötte bort det vände de sig nu till hedningarna. Ordet spred sig över trakten tills judarna uppeggade de gudfruktiga, ansedda kvinnorna och stadens förnämsta män, och apostlarna drevs bort från området."
      nb: "Fra Perge dro de inn i landet til Antiokia i Pisidia, en romersk koloni der Augustus hadde bosatt veteraner. På sabbaten satte de seg i synagogen, og etter opplesningen av loven og profetene ba synagogeforstanderne dem tale. Paulus reiste seg og fortalte Israels historie fra Egypt til David og forkynte så Jesus, av Davids ætt, dømt i Jerusalem og oppreist av Gud, ved hvem syndenes forlatelse blir forkynt. Hedningene ba om å få høre mer, og den neste sabbaten samlet nesten hele byen seg. Da jødene så folkemengdene, ble de fylt av misunnelse og motsa Paulus; Paulus og Barnabas svarte at ordet måtte bli talt til dem først, men siden de støtte det fra seg, vendte de seg nå til hedningene. Ordet spredte seg over hele området, inntil jødene egget opp de gudfryktige fornemme kvinnene og byens ledende menn, og apostlene ble drevet bort fra distriktet."
      tl: "Mula sa Perga ay pumasok sila sa kalupaan patungong Antioquia ng Pisidia, isang koloniyang Romano na pinanirahan ni Augusto ng mga beterano. Nang araw ng sabbath ay naupo sila sa sinagoga, at pagkatapos ng pagbasa ng kautusan at ng mga propeta ay inanyayahan sila ng mga pinuno ng sinagoga na magsalita. Tumindig si Pablo at isinalaysay ang kasaysayan ng Israel mula Egipto hanggang kay David, saka ipinahayag si Jesus, mula sa lahi ni David, na hinatulan sa Jerusalem at binuhay na maguli ng Diyos, na sa pamamagitan niya ay ibinabalita ang kapatawaran ng mga kasalanan. Hiniling ng mga Gentil na makarinig pa, at nang sumunod na sabbath ay nagkatipon ang halos buong bayan. Nang makita ang mga karamihan, napuno ng inggit ang mga Judio at tinutulan si Pablo; sumagot sina Pablo at Bernabe na ang salita ay kinakailangang salitain muna sa kanila, ngunit yamang itinakuwil nila ito, babaling sila sa mga Gentil. Lumaganap ang salita sa buong lupain hanggang sa udyukan ng mga Judio ang mga babaing masisipag sa kabanalan na may mataas na kalagayan at ang mga pangunahing lalaki ng bayan, at pinalayas ang mga apostol sa kanilang mga hangganan."
      da: "Fra Perge drog de ind i landet til Antiokia i Pisidien, en romersk koloni, hvor Augustus havde bosat veteraner. På sabbatten satte de sig i synagogen, og efter oplæsningen af Loven og Profeterne opfordrede synagogeforstanderne dem til at tale. Paulus rejste sig og fortalte Israels historie fra Egypten til David og forkyndte derefter Jesus af Davids slægt, dømt i Jerusalem og oprejst af Gud, ved hvem syndernes forladelse forkyndes. Hedningerne bad om at høre mere, og den følgende sabbat samledes næsten hele byen. Da jøderne så skarerne, blev de fyldt af misundelse og modsagde Paulus; Paulus og Barnabas svarede, at ordet måtte tales til dem først, men da de afviste det, vendte de sig nu til hedningerne. Ordet bredte sig over hele egnen, indtil jøderne ophidsede de fornemme gudfrygtige kvinder og byens ledende mænd, og apostlene blev jaget ud af området."
      sr: "Из Перге су отишли у унутрашњост, у Антиохију Писидијску, римску колонију коју је Август населио ветеранима. У суботу су седели у синагоги, и после читања Закона и Пророка старешине синагоге позвале су их да говоре. Павле је устао и испричао историју Израиља од Египта до Давида, а затим објавио Исуса, из Давидовог рода, осуђеног у Јерусалиму, кога је Бог васкрсао и кроз кога се проповеда опроштење греха. Незнабошци су молили да чују више, и следеће суботе скоро цео град се сабрао. Видевши мноштво, Јевреји су се напунили зависти и противречили Павлу; Павле и Варнава одговорили су да је реч најпре њима требало да се говори, али пошто је одбацују, они се обраћају незнабошцима. Реч се ширила по целој околини, док Јевреји нису подговорили побожне угледне жене и градске старешине, и апостоли су били истерани из тог краја."
      hu: "Pergéből beljebb mentek a piszídiai Antiókhiába, abba a római kolóniába, amelyet Augusztus veteránokkal telepített be. Szombaton leültek a zsinagógában, és a törvény és a próféták felolvasása után a zsinagóga elöljárói felkérték őket, hogy szóljanak. Pál felállt, és elbeszélte Izráel történetét Egyiptomtól Dávidig, majd Jézust hirdette, aki Dávid nemzetségéből való, akit Jeruzsálemben elítéltek és Isten feltámasztott, és aki által a bűnök bocsánatát hirdetik. A pogányok kérték, hogy többet hallhassanak, és a következő szombaton majdnem az egész város összegyűlt. A sokaságot látva a zsidók megteltek irigységgel, és ellentmondtak Pálnak; Pál és Barnabás azt felelték, hogy először nekik kellett hirdetni az igét, de mivel elvetik, a pogányokhoz fordulnak. Az ige elterjedt az egész vidéken, míg a zsidók fel nem indították az istenfélő előkelő asszonyokat és a város vezető férfiait, és az apostolokat ki nem űzték a vidékről."
      fi: "Pergestä he menivät sisämaahan Pisidian Antiokiaan, roomalaiseen siirtokuntaan, johon Augustus oli asuttanut veteraaneja. Sapattina he istuutuivat synagogaan, ja kun lakia ja profeettoja oli luettu, synagogan esimiehet pyysivät heitä puhumaan. Paavali nousi ja kertoi Israelin historian Egyptistä Daavidiin ja julisti sitten Jeesusta, Daavidin jälkeläistä, joka tuomittiin Jerusalemissa ja jonka Jumala herätti kuolleista ja jonka kautta julistetaan syntien anteeksiantamusta. Pakanat pyysivät saada kuulla lisää, ja seuraavana sapattina lähes koko kaupunki kokoontui. Kansanjoukot nähdessään juutalaiset täyttyivät kateudella ja väittivät Paavalia vastaan; Paavali ja Barnabas vastasivat, että sana oli puhuttava ensin heille, mutta koska he hylkäsivät sen, he kääntyivät nyt pakanoiden puoleen. Sana levisi koko seudulle, kunnes juutalaiset yllyttivät ylhäiset jumalaapelkääväiset naiset ja kaupungin johtavat miehet, ja apostolit ajettiin pois alueelta."
      vi: "Từ Bẹt-giê, họ đi vào nội địa đến An-ti-ốt xứ Bi-si-đi, một thuộc địa La Mã do Au-gút-tơ lập với các cựu binh. Vào ngày Sa-bát, họ ngồi trong nhà hội, và sau khi đọc sách luật và sách các tiên tri, các chủ nhà hội mời họ nói. Phao-lô đứng dậy kể lại lịch sử Y-sơ-ra-ên từ Ê-díp-tô đến Đa-vít, rồi rao giảng Đức Chúa Giê-su, thuộc dòng dõi Đa-vít, bị kết án tại Giê-ru-sa-lem và được Đức Chúa Trời khiến sống lại, là Đấng nhờ Ngài mà sự tha tội được rao truyền. Người ngoại xin được nghe thêm, và đến ngày Sa-bát sau, gần hết cả thành nhóm lại. Thấy đoàn dân đông, người Giu-đa đầy lòng ghen ghét và cãi lại Phao-lô; Phao-lô và Ba-na-ba đáp rằng đạo phải được truyền cho họ trước hết, nhưng vì họ khước từ, nên hai người xây qua người ngoại. Đạo lan ra khắp miền ấy, cho đến khi người Giu-đa xui giục những phụ nữ sang trọng sốt sắng và những người đứng đầu trong thành, và các sứ đồ bị đuổi ra khỏi địa phận ấy."
      ro: "De la Perga au mers spre interior, la Antiohia Pisidiei, colonie romană populată de Augustus cu veterani. În ziua sabatului au șezut în sinagogă, iar după citirea Legii și a Prorocilor, mai-marii sinagogii i-au poftit să vorbească. Pavel s-a ridicat și a povestit istoria lui Israel de la Egipt până la David, apoi l-a vestit pe Isus, din neamul lui David, osândit la Ierusalim și înviat de Dumnezeu, prin care se vestește iertarea păcatelor. Neamurile au cerut să audă mai mult, iar în sabatul următor aproape toată cetatea s-a adunat. Văzând mulțimile, iudeii s-au umplut de invidie și l-au contrazis pe Pavel; Pavel și Barnaba au răspuns că lor trebuia să li se vestească întâi cuvântul, dar fiindcă îl lepădau, se întorceau la neamuri. Cuvântul s-a răspândit prin tot ținutul, până când iudeii le-au întărâtat pe femeile cucernice de vază și pe fruntașii cetății, iar apostolii au fost izgoniți din ținut."
      bg: "От Перга те продължиха навътре в сушата към Антиохия Писидийска, римска колония, заселена от Август с ветерани. В събота седнаха в синагогата и след прочитането на Закона и Пророците началниците на синагогата ги поканиха да говорят. Павел стана и разказа историята на Израил от Египет до Давид, после възвести Исус от рода на Давид, осъден в Йерусалим и възкресен от Бога, чрез когото се проповядва прошка на греховете. Езичниците помолиха да чуят повече и в следващата събота почти целият град се събра. Като видяха множествата, юдеите се изпълниха със завист и противоречаха на Павел; Павел и Варнава отговориха, че словото трябваше да бъде говорено първо на тях, но понеже го отхвърлят, те се обръщат към езичниците. Словото се разпространяваше из цялата област, докато юдеите не подбудиха набожните знатни жени и първенците на града, и апостолите бяха изгонени от пределите им."
  - place: ae425aa # Iconium
    ref: Acts.14.1-Acts.14.5
    note:
      en: Many believe; a plot to stone them.
      ru: Многие приходят к вере; замысел побить их камнями.
      uk: "Багато хто вірує; задум побити їх камінням."
      es: "Muchos creen; se trama apedrearlos."
      pt: "Muitos creem; uma conspiração para apedrejá-los."
      de: "Viele glauben; ein Anschlag, sie zu steinigen."
      fr: "Beaucoup croient ; complot pour les lapider."
      pl: "Wielu wierzy; spisek, by ich ukamienować."
      it: "Molti credono; si trama per lapidarli."
      nl: "Velen komen tot geloof; een complot om hen te stenigen."
      cs: "Mnozí uvěří; spiknutí, že budou ukamenováni."
      sv: "Många kommer till tro; ett anslag för att stena dem."
      nb: "Mange kommer til tro; en sammensvergelse for å steine dem."
      tl: "Maraming sumasampalataya; may banta ng pagbato sa kanila."
      da: "Mange kommer til tro; et anslag om at stene dem."
      sr: "Многи поверују; заседа да их засу камењем."
      hu: "Sokan hisznek; összeesküvés a megkövezésükre."
      fi: "Monet uskovat; juoni heidän kivittämisekseen."
      vi: "Nhiều người tin; có mưu ném đá họ."
      ro: "Mulți cred; un complot pentru a-i ucide cu pietre."
      bg: "Мнозина повярваха; заговор да ги убият с камъни."
    story:
      en: "Shaking the dust off their feet against them, they came to Iconium, a town on the edge of the Anatolian plateau, today Konya. There they spoke in the synagogue, and a great number of both Jews and Greeks believed. The Jews who did not believe stirred up the Gentiles against the brothers, but the apostles stayed a long time and spoke boldly, and the Lord granted signs and wonders by their hands. The town was divided, some siding with the Jews and some with the apostles; when Gentiles and Jews with their rulers set out to mistreat and stone them, they learned of it and fled."
      ru: "Отрясши на них прах от ног своих, они пришли в Иконию, город на краю Анатолийского плоскогорья, ныне Конья. Там они говорили в синагоге, и уверовало множество и иудеев, и эллинов. Неуверовавшие иудеи возбудили язычников против братьев, но апостолы пробыли там долго и говорили смело, и Господь творил их руками знамения и чудеса. Город разделился: одни были на стороне иудеев, другие на стороне апостолов; когда язычники и иудеи со своими начальниками собрались оскорбить их и побить камнями, апостолы узнали об этом и бежали."
      uk: "Обтрусивши на них порох зі своїх ніг, вони прийшли до Іконії, міста на краю Анатолійського плоскогір'я, нині Конья. Там вони говорили в синагозі, і увірувало дуже багато і юдеїв, і греків. Юдеї, які не повірили, підбурили язичників проти братів, але апостоли пробули там довго й говорили сміливо, і Господь чинив їхніми руками знаки й чуда. Місто розділилося: одні були на боці юдеїв, а інші на боці апостолів; коли язичники та юдеї зі своїми старшинами зібралися знущатися з них і побити їх камінням, апостоли довідалися про це й утекли."
      es: "Sacudiendo contra ellos el polvo de sus pies, llegaron a Iconio, ciudad situada en el borde de la meseta de Anatolia, hoy Konya. Allí hablaron en la sinagoga, y creyó un gran número de judíos y de griegos. Los judíos que no creyeron incitaron a los gentiles contra los hermanos, pero los apóstoles se quedaron mucho tiempo y hablaban con valentía, y el Señor concedía que se hicieran señales y prodigios por sus manos. La ciudad se dividió: unos estaban con los judíos y otros con los apóstoles; cuando gentiles y judíos, con sus jefes, se dispusieron a maltratarlos y apedrearlos, ellos se enteraron y huyeron."
      pt: "Sacudindo contra eles o pó dos pés, chegaram a Icônio, cidade à beira do planalto da Anatólia, hoje Cônia. Ali falaram na sinagoga, e creu um grande número de judeus e de gregos. Os judeus que não creram incitaram os gentios contra os irmãos, mas os apóstolos ficaram muito tempo e falavam ousadamente, e o Senhor concedia que sinais e maravilhas fossem feitos por meio das suas mãos. A cidade dividiu-se: uns tomaram o partido dos judeus e outros, o dos apóstolos; quando gentios e judeus, com os seus líderes, se dispuseram a maltratá-los e apedrejá-los, eles souberam disso e fugiram."
      de: "Sie schüttelten den Staub von ihren Füßen gegen sie ab und kamen nach Ikonion, einer Stadt am Rand der anatolischen Hochebene, dem heutigen Konya. Dort sprachen sie in der Synagoge, und eine große Menge von Juden und Griechen kam zum Glauben. Die Juden, die nicht glaubten, hetzten die Heiden gegen die Brüder auf, doch die Apostel blieben lange und redeten freimütig, und der Herr ließ Zeichen und Wunder durch ihre Hände geschehen. Die Stadt war gespalten, die einen hielten es mit den Juden, die anderen mit den Aposteln; als Heiden und Juden mit ihren Obersten sich anschickten, sie zu misshandeln und zu steinigen, erfuhren sie davon und flohen."
      fr: "Secouant contre eux la poussière de leurs pieds, ils allèrent à Icone, ville au bord du plateau anatolien, aujourd’hui Konya. Là, ils parlèrent dans la synagogue, et une grande multitude de Juifs et de Grecs crut. Les Juifs qui ne crurent pas excitèrent les païens contre les frères, mais les apôtres restèrent longtemps et parlèrent avec assurance, et le Seigneur accordait que des signes et des prodiges se fassent par leurs mains. La ville se divisa, les uns étant pour les Juifs, les autres pour les apôtres ; quand païens et Juifs, avec leurs chefs, se mirent en mouvement pour les outrager et les lapider, ils l’apprirent et s’enfuirent."
      pl: "Otrząsnąwszy przeciw nim proch z nóg, przybyli do Ikonium, miasta na skraju Wyżyny Anatolijskiej, dziś Konya. Tam przemawiali w synagodze i uwierzyła wielka liczba zarówno Żydów, jak i Greków. Żydzi, którzy nie uwierzyli, podburzyli pogan przeciw braciom, lecz apostołowie przebywali tam długo i przemawiali odważnie, a Pan sprawiał przez ich ręce znaki i cuda. Miasto się podzieliło: jedni stanęli po stronie Żydów, drudzy po stronie apostołów; gdy poganie i Żydzi wraz ze swoimi przełożonymi postanowili ich znieważyć i ukamienować, apostołowie dowiedzieli się o tym i uciekli."
      it: "Scossa contro di loro la polvere dei piedi, giunsero a Icònio, città ai margini dell’altopiano anatolico, oggi Konya. Lì parlarono nella sinagoga, e una gran moltitudine di Giudei e di Greci credette. I Giudei che non avevano creduto aizzarono i Gentili contro i fratelli, ma gli apostoli si trattennero a lungo e parlarono con franchezza, e il Signore concedeva che per le loro mani si compissero segni e prodigi. La città si divise, gli uni dalla parte dei Giudei, gli altri dalla parte degli apostoli; quando Gentili e Giudei con i loro capi si mossero per maltrattarli e lapidarli, essi lo seppero e fuggirono."
      nl: "Zij schudden het stof van hun voeten af tegen hen en kwamen te Ikonium, een stad aan de rand van het Anatolische plateau, het huidige Konya. Daar spraken zij in de synagoge, en een grote menigte van zowel Joden als Grieken kwam tot geloof. De Joden die niet geloofden, zetten de heidenen op tegen de broeders, maar de apostelen bleven lange tijd en spraken vrijmoedig, en de Heer liet tekenen en wonderen geschieden door hun handen. De stad was verdeeld: sommigen kozen de kant van de Joden, anderen die van de apostelen; toen heidenen en Joden met hun oversten aanstalten maakten om hen te mishandelen en te stenigen, kwamen zij het te weten en vluchtten."
      cs: "Vytřásli proti nim prach ze svých nohou a přišli do Ikonia, města na okraji Anatolské plošiny, dnes Konya. Tam mluvili v synagoze a uvěřilo velké množství Židů i Řeků. Židé, kteří neuvěřili, poštvali pohany proti bratřím, ale apoštolové tam zůstali dlouho a mluvili směle a Pán skrze jejich ruce působil znamení a divy. Město se rozdělilo, jedni stáli při Židech a druzí při apoštolech; když se pohané i Židé se svými představenými chystali s nimi zle naložit a ukamenovat je, apoštolové se to dozvěděli a utekli."
      sv: "De skakade av dammet från fötterna mot dem och kom till Ikonion, en stad i utkanten av den anatoliska högplatån, i dag Konya. Där talade de i synagogan, och ett stort antal både judar och greker kom till tro. De judar som inte trodde uppviglade hedningarna mot bröderna, men apostlarna stannade länge och talade frimodigt, och Herren lät tecken och under ske genom deras händer. Staden delades, så att somliga höll med judarna och andra med apostlarna; när hedningar och judar med sina ledare gav sig i kast med att misshandla och stena dem, fick de veta det och flydde."
      nb: "De ristet støvet av føttene mot dem og kom til Ikonium, en by i utkanten av det anatoliske platået, i dag Konya. Der talte de i synagogen, og en stor mengde både jøder og grekere kom til tro. De jødene som ikke trodde, egget opp hedningene mot brødrene, men apostlene ble der lenge og talte frimodig, og Herren lot tegn og under skje ved deres hender. Byen ble delt; noen holdt med jødene, andre med apostlene. Da hedninger og jøder med sine ledere gjorde seg rede til å mishandle og steine dem, fikk de vite det og flyktet."
      tl: "Ipinagpag nila ang alabok ng kanilang mga paa laban sa kanila at dumating sa Iconio, isang bayan sa gilid ng talampas ng Anatolia, na ngayo'y Konya. Doon ay nagsalita sila sa sinagoga, at lubhang marami sa mga Judio at sa mga Griego ang sumampalataya. Inudyukan ng mga Judiong hindi sumampalataya ang mga Gentil laban sa mga kapatid, ngunit matagal na nanatili ang mga apostol at nagsalita nang buong katapangan, at ipinagkaloob ng Panginoon na gawin ng kanilang mga kamay ang mga tanda at mga kababalaghan. Nahati ang bayan, ang ilan ay nakisama sa mga Judio at ang iba ay sa mga apostol; nang tangkain ng mga Gentil at ng mga Judio kasama ang kanilang mga pinuno na sila'y halayin at batuhin, nalaman nila ito at tumakas."
      da: "Efter at have rystet støvet af deres fødder imod dem kom de til Ikonion, en by i udkanten af det anatolske højland, i dag Konya. Der talte de i synagogen, og en stor mængde både jøder og grækere kom til tro. De jøder, som ikke troede, ophidsede hedningerne mod brødrene, men apostlene blev der længe og talte frimodigt, og Herren lod tegn og undere ske ved deres hænder. Byen blev splittet, idet nogle holdt med jøderne og andre med apostlene; da hedninger og jøder med deres ledere gjorde anstalter til at mishandle og stene dem, fik de det at vide og flygtede."
      sr: "Отресавши на њих прах са својих ногу, дошли су у Икониј, град на рубу анатолске висоравни, данас Коња. Тамо су говорили у синагоги, и поверовало је велико мноштво и Јевреја и Грка. Јевреји који нису поверовали подбунили су незнабошце против браће, али апостоли су остали дуго и говорили слободно, а Господ је давао да се знаци и чудеса чине њиховим рукама. Град се поделио: једни су пристали уз Јевреје, а други уз апостоле; кад су незнабошци и Јевреји са својим поглаварима кренули да их злостављају и каменују, они су то дознали и побегли."
      hu: "Lábuk porát lerázva ellenük Ikóniumba mentek, az anatóliai fennsík szélén fekvő városba, a mai Konyába. Ott a zsinagógában beszéltek, és zsidók és görögök közül is nagyon sokan hittek. A nem hívő zsidók felindították a pogányokat a testvérek ellen, de az apostolok sokáig maradtak, és bátran szóltak, az Úr pedig jeleket és csodákat adott kezük által. A város megoszlott: némelyek a zsidók mellé álltak, mások az apostolok mellé; amikor a pogányok és a zsidók vezetőikkel együtt arra készültek, hogy bántalmazzák és megkövezzék őket, ők megtudták, és elmenekültek."
      fi: "Pudistettuaan tomun jaloistaan heitä vastaan he tulivat Ikonioniin, kaupunkiin Anatolian ylängön laidalla, nykyiseen Konyaan. Siellä he puhuivat synagogassa, ja suuri joukko sekä juutalaisia että kreikkalaisia uskoi. Juutalaiset, jotka eivät uskoneet, yllyttivät pakanat veljiä vastaan, mutta apostolit viipyivät kauan ja puhuivat rohkeasti, ja Herra antoi tapahtua tunnustekoja ja ihmeitä heidän kättensä kautta. Kaupunki jakaantui: toiset olivat juutalaisten puolella, toiset apostolien; kun pakanat ja juutalaiset hallitusmiehineen aikoivat ryhtyä pahoinpitelemään ja kivittämään heitä, he saivat sen tietää ja pakenivat."
      vi: "Phủi bụi chân mình để làm chứng nghịch cùng họ, hai người đến Y-cô-ni, một thành ở rìa cao nguyên Anatolia, nay là Konya. Tại đó họ giảng trong nhà hội, và rất nhiều người Giu-đa lẫn người Gờ-réc tin theo. Những người Giu-đa không tin xui giục người ngoại nghịch cùng anh em, nhưng các sứ đồ ở lại lâu ngày, giảng cách dạn dĩ, và Chúa cho tay họ làm những dấu kỳ phép lạ. Dân trong thành chia phe, kẻ theo bên người Giu-đa, người theo bên các sứ đồ; khi người ngoại và người Giu-đa cùng các quan mình toan hà hiếp và ném đá họ, họ hay biết và trốn đi."
      ro: "Scuturând praful de pe picioare împotriva lor, au venit la Iconia, o cetate de la marginea podișului Anatoliei, astăzi Konya. Acolo au vorbit în sinagogă, și o mare mulțime de iudei și de greci a crezut. Iudeii care nu credeau i-au ridicat pe cei dintre neamuri împotriva fraților, dar apostolii au stat multă vreme și au vorbit cu îndrăzneală, iar Domnul a dat semne și minuni prin mâinile lor. Cetatea s-a împărțit: unii țineau cu iudeii, alții cu apostolii; când neamurile și iudeii, împreună cu căpeteniile lor, au pornit să-i maltrateze și să-i bată cu pietre, ei au aflat și au fugit."
      bg: "Като отърсиха праха от нозете си срещу тях, те дойдоха в Икония — град на края на Анадолското плато, днес Коня. Там говориха в синагогата и повярва голямо множество и юдеи, и гърци. Юдеите, които не повярваха, настроиха езичниците против братята, но апостолите останаха дълго време и говореха смело, а Господ даваше да стават знамения и чудеса чрез ръцете им. Градът се раздели: едни застанаха на страната на юдеите, а други на апостолите; когато езичници и юдеи с началниците си се надигнаха да ги оскърбят и да ги убият с камъни, те научиха за това и избягаха."
  - place: af0719d # Lystra
    ref: Acts.14.8-Acts.14.19
    note:
      en: A lame man is healed; Paul is stoned.
      ru: Исцеление хромого; Павла побивают камнями.
      uk: "Кульгавого зцілено; Павла побито камінням."
      es: "Se sana a un cojo; Pablo es apedreado."
      pt: "Um coxo é curado; Paulo é apedrejado."
      de: "Ein Lahmer wird geheilt; Paulus wird gesteinigt."
      fr: "Un boiteux est guéri ; Paul est lapidé."
      pl: "Chromy zostaje uzdrowiony; Paweł zostaje ukamienowany."
      it: "Uno zoppo è guarito; Paolo è lapidato."
      nl: "Een lamme wordt genezen; Paulus wordt gestenigd."
      cs: "Uzdravení chromého; Pavel je ukamenován."
      sv: "En halt man botas; Paulus stenas."
      nb: "En lam mann blir helbredet; Paulus blir steinet."
      tl: "Gumagaling ang isang pilay; binabato si Pablo."
      da: "En lam mand helbredes; Paulus stenes."
      sr: "Хроми човек бива исцељен; Павле бива засут камењем."
      hu: "Egy sánta meggyógyul; Pált megkövezik."
      fi: "Rampa mies parannetaan; Paavali kivitetään."
      vi: "Một người què được chữa lành; Phao-lô bị ném đá."
      ro: "Un olog este vindecat; Pavel este bătut cu pietre."
      bg: "Един куц е изцелен; Павел е пребит с камъни."
    story:
      en: "They fled to Lystra, a Roman colony of Augustus in Lycaonia, some 30 km south-south-west of Iconium, and preached there. A man lame from birth, who had never walked, heard Paul speak; seeing that he had faith to be healed, Paul told him in a loud voice to stand upright, and he leapt up and walked. The crowd cried out in the language of Lycaonia that the gods had come down in human form. They called Barnabas Jupiter and Paul Mercurius, because he was the chief speaker, and the priest of Jupiter, whose temple stood before the town, brought oxen and garlands to sacrifice. The apostles tore their clothes and ran in among the people, telling them that they were men like them and had come to turn them from these empty things to the living God, who made heaven and earth and the sea. Then Jews came from Antioch and Iconium, won the crowd over, stoned Paul and dragged him out of the town, thinking he was dead. But when the disciples stood round him, he got up and went back into the town."
      ru: "Они бежали в Листру, римскую колонию Августа в Ликаонии, примерно в 30 км к юго-юго-западу от Иконии, и проповедовали там. Человек, хромой от рождения, никогда не ходивший, слушал Павла; увидев, что у него есть вера для исцеления, Павел громким голосом велел ему встать прямо на ноги, и тот вскочил и начал ходить. Толпа закричала по-ликаонски, что боги сошли в человеческом образе. Варнаву называли Зевсом, а Павла Ермием, потому что говорил главным образом он, и жрец Зевса, чей храм стоял перед городом, привёл волов и принёс венки, чтобы совершить жертвоприношение. Апостолы разодрали свои одежды и бросились в народ, говоря, что они такие же люди и пришли обратить их от этих пустых вещей к Богу Живому, сотворившему небо, землю и море. Тогда из Антиохии и Иконии пришли иудеи, склонили толпу на свою сторону, побили Павла камнями и вытащили за город, считая его умершим. Но когда ученики окружили его, он встал и вернулся в город."
      uk: "Вони втекли до Лістри, римської колонії Августа в Лікаонії, приблизно за 30 км на південь-південний захід від Іконії, і проповідували там. Чоловік, кульгавий від народження, який ніколи не ходив, слухав Павла; побачивши, що той має віру, щоб одужати, Павло гучним голосом звелів йому стати прямо на ноги, і той підскочив і почав ходити. Натовп закричав по-лікаонськи, що боги зійшли в людській подобі. Варнаву називали Зевсом, а Павла Гермесом, бо головним промовцем був він, і жрець Зевса, чий храм стояв перед містом, привів волів і приніс вінки, щоб принести жертву. Апостоли роздерли свій одяг і кинулися в натовп, кажучи, що вони такі самі люди й прийшли навернути їх від цих марнот до Бога живого, Який створив небо, землю й море. Тоді з Антіохії та Іконії прийшли юдеї, перетягли натовп на свій бік, побили Павла камінням і витягли його за місто, думаючи, що він помер. Але коли учні обступили його, він устав і повернувся до міста."
      es: "Huyeron a Listra, colonia romana de Augusto en Licaonia, a unos 30 km al sur-suroeste de Iconio, y allí predicaron. Un hombre cojo de nacimiento, que nunca había andado, oyó hablar a Pablo; viendo que tenía fe para ser sanado, Pablo le dijo a gran voz que se levantara derecho, y él dio un salto y anduvo. La multitud gritó en lengua licaónica que los dioses habían bajado en forma humana. A Bernabé lo llamaban Júpiter y a Pablo Mercurio, porque era el que llevaba la palabra, y el sacerdote de Júpiter, cuyo templo estaba delante de la ciudad, trajo toros y guirnaldas para ofrecer un sacrificio. Los apóstoles rasgaron sus ropas y se lanzaron entre la gente, diciéndoles que eran hombres como ellos y que habían venido para apartarlos de esas cosas vanas y volverlos al Dios vivo, que hizo el cielo, la tierra y el mar. Entonces llegaron judíos de Antioquía y de Iconio, se ganaron a la multitud, apedrearon a Pablo y lo arrastraron fuera de la ciudad, creyendo que estaba muerto. Pero cuando los discípulos lo rodearon, se levantó y volvió a entrar en la ciudad."
      pt: "Fugiram para Listra, colônia romana de Augusto na Licaônia, cerca de 30 km a sul-sudoeste de Icônio, e ali pregaram. Um homem coxo de nascença, que nunca tinha andado, ouviu Paulo falar; vendo que ele tinha fé para ser curado, Paulo disse-lhe em alta voz que se levantasse direito, e ele deu um salto e andou. A multidão gritou em língua licaônica que os deuses tinham descido em forma humana. Chamaram Barnabé de Júpiter e Paulo de Mercúrio, porque era ele o orador principal, e o sacerdote de Júpiter, cujo templo ficava em frente à cidade, trouxe bois e guirlandas para oferecer sacrifício. Os apóstolos rasgaram as suas roupas e correram para o meio do povo, dizendo-lhes que eram homens como eles e que tinham vindo para que se afastassem dessas coisas vãs e se voltassem para o Deus vivo, que fez o céu, a terra e o mar. Então chegaram judeus de Antioquia e de Icônio, conquistaram a multidão, apedrejaram Paulo e o arrastaram para fora da cidade, pensando que estivesse morto. Mas, quando os discípulos o rodearam, ele se levantou e voltou para a cidade."
      de: "Sie flohen nach Lystra, einer römischen Kolonie des Augustus in Lykaonien, etwa 30 km süd-südwestlich von Ikonion, und predigten dort. Ein von Geburt an lahmer Mann, der nie gegangen war, hörte Paulus reden; als Paulus sah, dass er den Glauben hatte, geheilt zu werden, rief er ihm mit lauter Stimme zu, er solle sich aufrecht hinstellen, und er sprang auf und ging umher. Die Menge rief auf Lykaonisch, die Götter seien in Menschengestalt herabgekommen. Sie nannten Barnabas Jupiter und Paulus Merkurius, weil er der Wortführer war, und der Priester des Jupiter, dessen Tempel vor der Stadt stand, brachte Ochsen und Kränze, um zu opfern. Die Apostel zerrissen ihre Kleider, sprangen unter das Volk und sagten ihnen, sie seien Menschen wie sie und seien gekommen, um sie von diesen nichtigen Dingen zu dem lebendigen Gott zu bekehren, der Himmel und Erde und das Meer gemacht hat. Dann kamen Juden aus Antiochia und Ikonion, gewannen die Menge für sich, steinigten Paulus und schleiften ihn aus der Stadt, weil sie meinten, er sei tot. Als ihn aber die Jünger umringten, stand er auf und ging zurück in die Stadt."
      fr: "Ils s’enfuirent à Lystre, colonie romaine d’Auguste en Lycaonie, à quelque 30 km au sud-sud-ouest d’Icone, et y prêchèrent. Un homme boiteux de naissance, qui n’avait jamais marché, écoutait parler Paul ; voyant qu’il avait la foi pour être guéri, Paul lui dit d’une voix forte de se lever droit sur ses pieds, et il se leva d’un bond et marcha. La foule s’écria en langue lycaonienne que les dieux étaient descendus sous une forme humaine. Ils appelaient Barnabas Jupiter et Paul Mercure, parce que c’était lui qui portait la parole, et le prêtre de Jupiter, dont le temple se trouvait devant la ville, amena des taureaux et des guirlandes pour offrir un sacrifice. Les apôtres déchirèrent leurs vêtements et se précipitèrent au milieu de la foule, disant qu’ils étaient des hommes comme eux et venaient les détourner de ces choses vaines vers le Dieu vivant, qui a fait le ciel, la terre et la mer. Puis des Juifs vinrent d’Antioche et d’Icone, gagnèrent la foule, lapidèrent Paul et le traînèrent hors de la ville, le croyant mort. Mais, les disciples l’ayant entouré, il se leva et rentra dans la ville."
      pl: "Uciekli do Listry, rzymskiej kolonii Augusta w Likaonii, około 30 km na południowy-południowy zachód od Ikonium, i tam głosili. Człowiek chromy od urodzenia, który nigdy nie chodził, słuchał przemowy Pawła; Paweł, widząc, że ma on wiarę, by zostać uzdrowionym, donośnym głosem kazał mu stanąć prosto, a on zerwał się i zaczął chodzić. Tłum zawołał w języku likaońskim, że bogowie zstąpili w ludzkiej postaci. Barnabę nazwali Jowiszem, a Pawła Merkuriuszem, ponieważ to on przede wszystkim przemawiał, a kapłan Jowisza, którego świątynia stała przed miastem, przyprowadził woły i przyniósł wieńce, by złożyć ofiarę. Apostołowie rozdarli szaty i wbiegli między lud, mówiąc, że są ludźmi takimi jak oni i przyszli, aby odwrócić ich od tych marności ku Bogu żywemu, który stworzył niebo, ziemię i morze. Wtedy przybyli Żydzi z Antiochii i Ikonium, przeciągnęli tłum na swoją stronę, ukamienowali Pawła i wywlekli go za miasto, sądząc, że nie żyje. Lecz gdy uczniowie go otoczyli, wstał i wrócił do miasta."
      it: "Fuggirono a Listra, colonia romana di Augusto in Licaonia, a circa 30 km a sud-sud-ovest di Icònio, e vi predicarono. Un uomo zoppo dalla nascita, che non aveva mai camminato, udì parlare Paolo; vedendo che aveva fede da essere guarito, Paolo gli disse ad alta voce di alzarsi ritto in piedi, ed egli balzò su e camminò. La folla gridò in lingua licaonica che gli dèi erano discesi in forma umana. Chiamavano Barnaba Giove e Paolo Mercurio, perché era lui il principale oratore, e il sacerdote di Giove, il cui tempio sorgeva davanti alla città, portò tori e ghirlande per sacrificare. Gli apostoli si stracciarono le vesti e si slanciarono in mezzo alla folla, dicendo che erano uomini come loro ed erano venuti a distoglierli da queste cose vane per volgerli al Dio vivente, che ha fatto il cielo, la terra e il mare. Poi giunsero Giudei da Antiochia e da Icònio, persuasero la folla, lapidarono Paolo e lo trascinarono fuori della città, credendolo morto. Ma quando i discepoli gli si strinsero intorno, egli si rialzò e rientrò in città."
      nl: "Zij vluchtten naar Lystra, een Romeinse kolonie van Augustus in Lykaonië, zo'n 30 km zuidzuidwestelijk van Ikonium, en verkondigden daar het Evangelie. Een man die van geboorte kreupel was en nooit had gelopen, hoorde Paulus spreken; toen Paulus zag dat hij geloof had om genezen te worden, zei hij hem met luide stem rechtop te gaan staan, en hij sprong op en liep. De menigte riep in het Lycaonisch dat de goden in mensengedaante waren neergedaald. Zij noemden Barnabas Jupiter en Paulus Mercurius, omdat hij het woord voerde, en de priester van Jupiter, wiens tempel vóór de stad stond, bracht ossen en kransen om te offeren. De apostelen scheurden hun kleren en sprongen tussen het volk, en zeiden dat zij mensen waren zoals zij en gekomen waren om hen van deze ijdele dingen te bekeren tot de levende God, die de hemel, de aarde en de zee gemaakt heeft. Toen kwamen er Joden uit Antiochië en Ikonium, die de menigte voor zich wonnen, Paulus stenigden en hem de stad uit sleepten, in de mening dat hij dood was. Maar toen de discipelen om hem heen stonden, stond hij op en ging terug de stad in."
      cs: "Utekli do Lystry, Augustovy římské kolonie v Lykaonii, asi 30 km jiho-jihozápadně od Ikonia, a kázali tam. Muž chromý od narození, který nikdy nechodil, poslouchal Pavlovu řeč; Pavel viděl, že má víru, aby byl uzdraven, a řekl mu hlasitě, ať se postaví zpříma, a on vyskočil a chodil. Zástup volal lykaonským jazykem, že bohové sestoupili v lidské podobě. Barnabáše nazývali Jupiterem a Pavla Merkuriášem, protože on hlavně mluvil, a Jupiterův kněz, jehož chrám stál před městem, přivedl býky a přinesl věnce, aby obětoval. Apoštolové roztrhli svá roucha, vběhli mezi lid a říkali, že jsou lidé jako oni a přišli je od těchto marností obrátit k živému Bohu, který učinil nebe, zemi i moře. Pak přišli Židé z Antiochie a Ikonia, získali zástup na svou stranu, ukamenovali Pavla a vyvlekli ho z města v domnění, že je mrtev. Když ho však obstoupili učedníci, vstal a vrátil se do města."
      sv: "De flydde till Lystra, en av Augustus romerska kolonier, i Lykaonien, omkring 30 km syd-sydväst om Ikonion, och förkunnade där. En man som varit lam från födseln och aldrig hade gått hörde Paulus tala; när Paulus såg att han hade tro till att bli botad, sade han med hög röst åt honom att resa sig och stå upprätt, och han sprang upp och gick. Folkmassan ropade på lykaoniska att gudarna hade stigit ned i människogestalt. De kallade Barnabas Jupiter och Paulus Merkurius, eftersom han var den som förde ordet, och Jupiters präst, vars tempel låg framför staden, kom med tjurar och kransar för att offra. Apostlarna rev sönder sina kläder och sprang in bland folket och sade att de var människor som de själva och hade kommit för att vända dem från dessa tomma ting till den levande Guden, som har gjort himmel och jord och hav. Sedan kom judar från Antiochia och Ikonion, vann folket över på sin sida, stenade Paulus och släpade ut honom ur staden i tron att han var död. Men när lärjungarna stod omkring honom, reste han sig och gick tillbaka in i staden."
      nb: "De flyktet til Lystra, en av Augustus' romerske kolonier, i Lykaonia, omkring 30 km sør-sørvest for Ikonium, og forkynte der. En mann som hadde vært lam fra fødselen og aldri hadde gått, hørte Paulus tale; da Paulus så at han hadde tro til å bli helbredet, sa han med høy røst at han skulle reise seg og stå oppreist, og mannen sprang opp og gikk. Folkemengden ropte på lykaonisk at gudene hadde kommet ned i menneskeskikkelse. De kalte Barnabas Jupiter og Paulus Merkur, fordi han var den som førte ordet, og Jupiters prest, hvis tempel lå foran byen, kom med okser og kranser for å ofre. Apostlene rev klærne sine i stykker og sprang inn blant folket og sa at de var mennesker som dem og var kommet for å vende dem bort fra disse tomme tingene til den levende Gud, som skapte himmelen og jorden og havet. Så kom det jøder fra Antiokia og Ikonium, vant folket over, steinet Paulus og slepte ham ut av byen i den tro at han var død. Men da disiplene sto omkring ham, reiste han seg og gikk tilbake inn i byen."
      tl: "Tumakas sila sa Listra, isang koloniyang Romano ni Augusto sa Licaonia, mga 30 km sa timog-timog-kanluran ng Iconio, at doon ay nangaral. Isang lalaking pilay mula pa sa pagkapanganak, na kailanma'y hindi nakalakad, ang nakarinig na nagsasalita si Pablo; nang makita ni Pablo na may pananampalataya siya upang mapagaling, sinabi niya sa malakas na tinig na tumindig siyang matuwid, at siya'y lumukso at lumakad. Nagsigawan ang karamihan sa wikang Licaonia na ang mga diyos ay bumaba sa anyo ng tao. Tinawag nilang Jupiter si Bernabe at Mercurio si Pablo, sapagka't siya ang pangulong tagapagsalita, at ang saserdote ni Jupiter, na ang templo ay nasa harap ng bayan, ay nagdala ng mga baka at mga putong na bulaklak upang maghain. Hinapak ng mga apostol ang kanilang mga damit at tumakbo sa gitna ng mga tao, na sinasabing sila'y mga taong gaya rin nila at naparito upang ibaling sila mula sa mga bagay na walang kabuluhang ito tungo sa Diyos na buhay, na gumawa ng langit at ng lupa at ng dagat. Pagkatapos ay dumating ang mga Judio mula sa Antioquia at Iconio, nahikayat ang karamihan, binato si Pablo at kinaladkad siya sa labas ng bayan, na inaakalang siya'y patay na. Ngunit nang tumayo sa paligid niya ang mga alagad, siya'y nagtindig at bumalik sa bayan."
      da: "De flygtede til Lystra, en romersk koloni grundlagt af Augustus i Lykaonien, omkring 30 km syd-sydvest for Ikonion, og forkyndte der. En mand, der var lam fra fødslen og aldrig havde gået, hørte Paulus tale; da Paulus så, at han havde tro til at blive helbredt, sagde han med høj røst, at han skulle rejse sig og stå ret op, og han sprang op og gik. Mængden råbte på lykaonisk, at guderne var steget ned i menneskeskikkelse. De kaldte Barnabas Zeus og Paulus Hermes, fordi han var den, der førte ordet, og præsten ved Zeus' tempel, som lå foran byen, kom med tyre og kranse for at ofre. Apostlene sønderrev deres klæder og sprang ind blandt folket og sagde, at de var mennesker ligesom dem og var kommet for at få dem til at vende om fra disse tomme ting til den levende Gud, som har skabt himlen og jorden og havet. Så kom der jøder fra Antiokia og Ikonion, vandt mængden for sig, stenede Paulus og slæbte ham uden for byen i den tro, at han var død. Men da disciplene stod omkring ham, rejste han sig og gik tilbage ind i byen."
      sr: "Побегли су у Листру, Августову римску колонију у Ликаонији, око 30 км југ-југозападно од Иконија, и тамо проповедали. Један човек хром од рођења, који никад није ходао, слушао је Павла где говори; видевши да има веру да оздрави, Павле му је великим гласом рекао да устане право, и он је скочио и ходао. Светина је повикала на ликаонском језику да су богови сишли у људском обличју. Варнаву су назвали Јупитером, а Павла Меркуријем, јер је он највише говорио, а свештеник Јупитера, чији је храм стајао пред градом, довео је волове и донео венце да принесе жртву. Апостоли су раздрли своје хаљине и утрчали међу народ, говорећи им да су људи као и они и да су дошли да их од ових испразних ствари обрате к живом Богу, који је створио небо и земљу и море. Тада су дошли Јевреји из Антиохије и Иконија, придобили светину, засули Павла камењем и извукли га из града, мислећи да је мртав. Али кад су ученици стали око њега, устао је и вратио се у град."
      hu: "Lisztrába menekültek, Augusztus római kolóniájába Likaóniában, Ikóniumtól mintegy 30 km-re dél-délnyugatra, és ott prédikáltak. Egy születésétől fogva sánta ember, aki soha nem járt, hallotta Pált beszélni; Pál, látva, hogy van hite a gyógyuláshoz, hangosan felszólította, hogy álljon fel egyenesen a lábára, ő pedig felugrott és járt. A sokaság likaóniai nyelven kiáltotta, hogy az istenek emberi alakban szálltak le. Barnabást Jupiternek, Pált pedig Merkúriusnak nevezték, mert ő volt a szóvivő, és Jupiter papja, akinek temploma a város előtt állt, ökröket és koszorúkat hozott, hogy áldozzon. Az apostolok megszaggatták ruhájukat, a nép közé futottak, és azt mondták, hogy ők is hozzájuk hasonló emberek, és azért jöttek, hogy e hiábavalóságoktól az élő Istenhez térítsék őket, aki az eget, a földet és a tengert teremtette. Ekkor Antiókhiából és Ikóniumból zsidók jöttek, megnyerték a sokaságot, megkövezték Pált, és kivonszolták a városból, azt gondolva, hogy meghalt. De amikor a tanítványok körülállták, felkelt, és visszament a városba."
      fi: "He pakenivat Lystraan, Augustuksen roomalaiseen siirtokuntaan Lykaoniassa, noin 30 km Ikonionista etelälounaaseen, ja julistivat siellä evankeliumia. Mies, joka oli ollut rampa syntymästään asti eikä ollut koskaan kävellyt, kuuli Paavalin puhuvan; nähdessään, että hänellä oli usko tulla terveeksi, Paavali käski häntä suurella äänellä nousemaan pystyyn, ja hän hypähti ylös ja käveli. Kansanjoukko huusi lykaonian kielellä, että jumalat olivat tulleet alas ihmisen hahmossa. He kutsuivat Barnabasta Zeukseksi ja Paavalia Hermeeksi, koska tämä oli se, joka enimmäkseen puhui, ja Zeuksen pappi, jonka temppeli oli kaupungin edustalla, toi härkiä ja seppeleitä uhratakseen. Apostolit repäisivät vaatteensa ja juoksivat kansan sekaan sanoen, että he olivat ihmisiä niin kuin hekin ja olivat tulleet kääntämään heidät näistä turhuuksista elävän Jumalan puoleen, joka on tehnyt taivaan ja maan ja meren. Sitten Antiokiasta ja Ikonionista tuli juutalaisia, jotka saivat kansan puolelleen, kivittivät Paavalia ja raahasivat hänet kaupungin ulkopuolelle luullen häntä kuolleeksi. Mutta kun opetuslapset seisoivat hänen ympärillään, hän nousi ja palasi kaupunkiin."
      vi: "Họ trốn đến Lít-trơ, một thuộc địa La Mã của Au-gút-tơ ở xứ Ly-cao-ni, cách Y-cô-ni khoảng 30 km về phía nam tây nam, và giảng đạo tại đó. Một người què từ lúc mới sinh, chưa hề đi được, nghe Phao-lô giảng; thấy người có đức tin để được chữa lành, Phao-lô nói lớn tiếng bảo người đứng thẳng lên, và người nhảy lên rồi đi. Đoàn dân kêu lên bằng tiếng Ly-cao-ni rằng các thần đã lấy hình người mà xuống. Họ gọi Ba-na-ba là thần Giu-bi-tê và Phao-lô là thần Mẹt-cu-rơ, vì ông là người đứng đầu giảng nói, và thầy cả của thần Giu-bi-tê, có miếu ở trước thành, đem bò đực và tràng hoa đến để dâng tế lễ. Các sứ đồ xé áo mình, chạy vào giữa dân chúng, nói rằng họ cũng là người như dân chúng và đến để khiến dân chúng từ bỏ những điều hư không này mà trở về cùng Đức Chúa Trời hằng sống, là Đấng đã dựng nên trời, đất và biển. Rồi có người Giu-đa từ An-ti-ốt và Y-cô-ni đến, dỗ dành được đoàn dân, ném đá Phao-lô và kéo ông ra ngoài thành, tưởng ông đã chết. Nhưng khi các môn đồ đứng quanh ông, ông đứng dậy và trở vào thành."
      ro: "Au fugit la Listra, colonie romană a lui Augustus în Licaonia, la circa 30 km sud-sud-vest de Iconia, și au propovăduit acolo. Un om șchiop din naștere, care nu umblase niciodată, l-a auzit pe Pavel vorbind; văzând că avea credință ca să fie vindecat, Pavel i-a spus cu glas tare să se ridice drept pe picioare, iar el a sărit în sus și a umblat. Mulțimea a strigat în limba Licaoniei că zeii s-au coborât în chip de oameni. Pe Barnaba l-au numit Dia, iar pe Pavel Ermi, pentru că el era vorbitorul principal, iar preotul lui Dia, al cărui templu stătea înaintea cetății, a adus boi și cununi ca să jertfească. Apostolii și-au rupt hainele și au alergat în mijlocul poporului, spunându-le că sunt oameni ca și ei și că au venit să-i întoarcă de la aceste lucruri deșarte la Dumnezeul cel viu, care a făcut cerul, pământul și marea. Apoi au venit iudei din Antiohia și Iconia, au câștigat mulțimea de partea lor, l-au bătut cu pietre pe Pavel și l-au târât afară din cetate, crezând că murise. Dar când ucenicii l-au înconjurat, s-a ridicat și s-a întors în cetate."
      bg: "Те избягаха в Листра, римска колония на Август в Ликаония, на около 30 км юг-югозападно от Икония, и проповядваха там. Един човек, куц от рождение, който никога не беше ходил, слушаше Павел да говори; като видя, че има вяра, за да бъде изцелен, Павел му каза с висок глас да се изправи на краката си, и той скочи и проходи. Тълпата извика на ликаонски език, че боговете са слезли при тях в човешки образ. Нарекоха Варнава Юпитер, а Павел — Меркурий, понеже той говореше главно, и жрецът на Юпитер, чийто храм стоеше пред града, доведе волове и донесе венци, за да принесе жертва. Апостолите раздраха дрехите си и се втурнаха сред народа, като казваха, че са хора като тях и са дошли да ги обърнат от тези суетни неща към живия Бог, който е създал небето, земята и морето. Тогава дойдоха юдеи от Антиохия и Икония, спечелиха тълпата, пребиха Павел с камъни и го извлякоха извън града, мислейки, че е мъртъв. Но когато учениците застанаха около него, той стана и се върна в града."
  - place: aa401a9 # Derbe
    ref: Acts.14.20-Acts.14.21
    note:
      en: They make many disciples.
      ru: Приобретают много учеников.
      uk: "Вони здобувають багато учнів."
      es: "Hacen muchos discípulos."
      pt: "Fazem muitos discípulos."
      de: "Sie machen viele zu Jüngern."
      fr: "Ils font beaucoup de disciples."
      pl: "Pozyskują wielu uczniów."
      it: "Fanno molti discepoli."
      nl: "Zij maken veel discipelen."
      cs: "Získávají mnoho učedníků."
      sv: "De gör många till lärjungar."
      nb: "De gjør mange til disipler."
      tl: "Gumagawa sila ng maraming alagad."
      da: "De gør mange til disciple."
      sr: "Чине многе ученике."
      hu: "Sok tanítványt szereznek."
      fi: "He tekevät monia opetuslapsiksi."
      vi: "Họ gây nên nhiều môn đồ."
      ro: "Fac mulți ucenici."
      bg: "Те спечелват много ученици."
    story:
      en: "The next day Paul left with Barnabas for Derbe, in the south-east of Lycaonia, the farthest point of the journey. Its site, at the mound of Kerti Hüyük near Karaman in Turkey or close by, was found only in 1956, through an inscription of the council and people of Derbe. There they preached the gospel and made many disciples. Acts tells of no persecution at Derbe."
      ru: "На следующий день Павел ушёл с Варнавой в Дервию, на юго-востоке Ликаонии, — самую дальнюю точку путешествия. Её место, у холма Керти-Хююк близ Карамана в Турции или где-то рядом, было найдено лишь в 1956 году по надписи совета и народа Дервии. Там они проповедовали Евангелие и приобрели много учеников. О гонениях в Дервии Деяния не сообщают."
      uk: "Наступного дня Павло пішов із Варнавою до Дервії, на південному сході Лікаонії, — найдальшої точки подорожі. Її місце, біля пагорба Керті-Хююк поблизу Карамана в Туреччині або десь поруч, знайшли лише 1956 року завдяки напису ради й народу Дервії. Там вони проповідували Євангеліє й здобули багато учнів. Про переслідування в Дервії Дії не повідомляють."
      es: "Al día siguiente Pablo partió con Bernabé hacia Derbe, en el sureste de Licaonia, el punto más lejano del viaje. Su emplazamiento, en el montículo de Kerti Hüyük, cerca de Karaman (Turquía), o en sus proximidades, no se descubrió hasta 1956, gracias a una inscripción del consejo y del pueblo de Derbe. Allí anunciaron el evangelio e hicieron muchos discípulos. Los Hechos no mencionan ninguna persecución en Derbe."
      pt: "No dia seguinte Paulo partiu com Barnabé para Derbe, no sudeste da Licaônia, o ponto mais distante da viagem. O seu local, no montículo de Kerti Hüyük, perto de Karaman, na Turquia, ou nas proximidades, só foi descoberto em 1956, graças a uma inscrição do conselho e do povo de Derbe. Ali pregaram o Evangelho e fizeram muitos discípulos. Atos não fala de nenhuma perseguição em Derbe."
      de: "Am nächsten Tag zog Paulus mit Barnabas nach Derbe im Südosten Lykaoniens, dem entferntesten Punkt der Reise. Seine Lage, am Hügel Kerti Hüyük bei Karaman in der Türkei oder in dessen Nähe, wurde erst 1956 durch eine Inschrift von Rat und Volk von Derbe bestimmt. Dort verkündigten sie das Evangelium und machten viele zu Jüngern. Von einer Verfolgung in Derbe berichtet die Apostelgeschichte nicht."
      fr: "Le lendemain, Paul partit avec Barnabas pour Derbe, dans le sud-est de la Lycaonie, le point le plus éloigné du voyage. Son site, au tertre de Kerti Hüyük près de Karaman, en Turquie, ou tout près de là, ne fut découvert qu’en 1956, grâce à une inscription du conseil et du peuple de Derbe. Là, ils annoncèrent l’Évangile et firent beaucoup de disciples. Les Actes ne mentionnent aucune persécution à Derbe."
      pl: "Nazajutrz Paweł wyruszył z Barnabą do Derbe, w południowo-wschodniej Likaonii, najdalszego punktu podróży. Położenie miasta, przy kopcu Kerti Hüyük koło Karamanu w Turcji lub w jego pobliżu, ustalono dopiero w 1956 roku dzięki napisowi rady i ludu Derbe. Tam głosili Ewangelię i pozyskali wielu uczniów. Dzieje nie wspominają o żadnym prześladowaniu w Derbe."
      it: "Il giorno seguente Paolo partì con Barnaba per Derbe, nel sud-est della Licaonia, il punto più lontano del viaggio. Il suo sito, presso il tell di Kerti Hüyük vicino a Karaman, in Turchia, o lì accanto, fu scoperto solo nel 1956, grazie a un’iscrizione del consiglio e del popolo di Derbe. Lì annunciarono il vangelo e fecero molti discepoli. Gli Atti non riferiscono alcuna persecuzione a Derbe."
      nl: "De volgende dag vertrok Paulus met Barnabas naar Derbe, in het zuidoosten van Lykaonië, het verste punt van de reis. De ligging ervan, bij de heuvel Kerti Hüyük nabij Karaman in Turkije of daar vlakbij, werd pas in 1956 gevonden, dankzij een inscriptie van de raad en het volk van Derbe. Daar verkondigden zij het Evangelie en maakten veel discipelen. Handelingen vermeldt geen vervolging te Derbe."
      cs: "Nazítří odešel Pavel s Barnabášem do Derbe na jihovýchodě Lykaonie, nejvzdálenějšího bodu cesty. Poloha města, u pahorku Kerti Hüyük nedaleko Karamanu v Turecku nebo v jeho blízkosti, byla zjištěna teprve v roce 1956 díky nápisu rady a lidu Derbe. Tam kázali evangelium a získali mnoho učedníků. Skutky se o žádném pronásledování v Derbe nezmiňují."
      sv: "Dagen därpå drog Paulus med Barnabas till Derbe, i sydöstra Lykaonien, resans yttersta punkt. Stadens läge, vid kullen Kerti Hüyük nära Karaman i Turkiet eller i närheten, upptäcktes först 1956, genom en inskrift från Derbes råd och folk. Där förkunnade de evangelium och gjorde många till lärjungar. Apostlagärningarna berättar inte om någon förföljelse i Derbe."
      nb: "Dagen etter dro Paulus med Barnabas til Derbe, sørøst i Lykaonia, reisens fjerneste punkt. Stedet, ved haugen Kerti Hüyük nær Karaman i Tyrkia eller like i nærheten, ble først funnet i 1956, gjennom en innskrift fra Derbes råd og folk. Der forkynte de evangeliet og gjorde mange til disipler. Apostlenes gjerninger forteller ikke om noen forfølgelse i Derbe."
      tl: "Kinabukasan ay umalis si Pablo kasama ni Bernabe patungong Derbe, sa timog-silangan ng Licaonia, ang pinakamalayong dako ng paglalakbay. Ang kinaroroonan nito, sa bunton ng Kerti Hüyük malapit sa Karaman sa Turkey o malapit doon, ay natagpuan lamang noong 1956, sa pamamagitan ng isang inskripsiyon ng konseho at ng bayan ng Derbe. Doon ay ipinangaral nila ang evangelio at nakahikayat ng maraming alagad. Walang binabanggit na pag-uusig sa Derbe ang Mga Gawa."
      da: "Den næste dag drog Paulus med Barnabas til Derbe i det sydøstlige Lykaonien, rejsens fjerneste punkt. Byens beliggenhed, ved højen Kerti Hüyük nær Karaman i Tyrkiet eller tæt derved, blev først fundet i 1956 gennem en inskription fra Derbes råd og folk. Der forkyndte de evangeliet og vandt mange disciple. Apostlenes Gerninger fortæller ikke om nogen forfølgelse i Derbe."
      sr: "Сутрадан је Павле с Варнавом отишао у Дерву, на југоистоку Ликаоније, најдаљу тачку путовања. Њено место, на хумци Керти Хујук код Карамана у Турској или у близини, пронађено је тек 1956, захваљујући натпису већа и народа Дерве. Тамо су проповедали јеванђеље и стекли многе ученике. Дела не приповедају ни о каквом прогону у Дерви."
      hu: "Másnap Pál Barnabással Derbébe indult, Likaónia délkeleti részére, az út legtávolabbi pontjára. Helyét, a törökországi Karaman közelében fekvő Kerti Hüyük halmánál vagy annak közvetlen közelében, csak 1956-ban találták meg, Derbe tanácsának és népének egy felirata alapján. Ott hirdették az evangéliumot, és sok tanítványt szereztek. Az Apostolok cselekedetei nem szól üldözésről Derbében."
      fi: "Seuraavana päivänä Paavali lähti Barnabaan kanssa Derbeen, Lykaonian kaakkoisosaan, matkan kaukaisimpaan kohteeseen. Sen paikka, joka on Kerti Hüyükin kummulla Karamanin lähellä Turkissa tai aivan sen tuntumassa, löydettiin vasta vuonna 1956 Derben neuvoston ja kansan kirjoituksen ansiosta. Siellä he julistivat evankeliumia ja tekivät monia opetuslapsiksi. Apostolien teot ei kerro vainosta Derbessä."
      vi: "Hôm sau, Phao-lô cùng Ba-na-ba đi đến Đẹt-bơ, ở phía đông nam xứ Ly-cao-ni, điểm xa nhất của cuộc hành trình. Vị trí của thành, tại gò Kerti Hüyük gần Karaman ở Thổ Nhĩ Kỳ hoặc ở gần đó, mãi đến năm 1956 mới được tìm thấy, nhờ một bia khắc của hội đồng và dân Đẹt-bơ. Tại đó họ rao truyền Tin Lành và làm cho nhiều người trở nên môn đồ. Sách Công vụ không kể sự bắt bớ nào tại Đẹt-bơ."
      ro: "A doua zi Pavel a plecat cu Barnaba la Derba, în sud-estul Licaoniei, cel mai îndepărtat punct al călătoriei. Locul ei, la movila Kerti Hüyük, lângă Karaman, în Turcia, sau foarte aproape, a fost găsit abia în 1956, printr-o inscripție a sfatului și poporului Derbei. Acolo au propovăduit Evanghelia și au făcut mulți ucenici. Faptele nu povestesc nicio prigoană la Derba."
      bg: "На следващия ден Павел тръгна с Варнава за Дервия, в югоизточна Ликаония, най-далечната точка на пътуването. Мястото ѝ, на могилата Керти Хююк край Караман в Турция или близо до нея, беше открито едва през 1956 г. благодарение на надпис на съвета и народа на Дервия. Там те проповядваха благовестието и спечелиха много ученици. Деяния не разказват за гонение в Дервия."
  - place: af0719d # Lystra
    ref: Acts.14.21-Acts.14.22
    note:
      en: "Return leg: strengthening the disciples."
      ru: "Обратный путь: утверждают души учеников."
      uk: "Зворотний шлях: зміцнення учнів."
      es: "Tramo de regreso: fortalecen a los discípulos."
      pt: "Trecho de volta: fortalecendo os discípulos."
      de: "Rückweg: Stärkung der Jünger."
      fr: "Trajet de retour : affermir les disciples."
      pl: "Droga powrotna: umacnianie uczniów."
      it: "Tappa del ritorno: rafforzano i discepoli."
      nl: "De terugreis: de discipelen worden gesterkt."
      cs: "Zpáteční cesta: utvrzování učedníků."
      sv: "Återvägen: de styrker lärjungarna."
      nb: "Tilbakeveien: de styrker disiplene."
      tl: "Pabalik na biyahe: pinalalakas ang mga alagad."
      da: "Hjemturen: de styrker disciplene."
      sr: "На повратку: утврђују ученике."
      hu: "Visszaút: a tanítványok megerősítése."
      fi: "Paluumatka: opetuslasten vahvistaminen."
      vi: "Chặng về: làm vững lòng các môn đồ."
      ro: "Drumul de întoarcere: întărirea ucenicilor."
      bg: "Обратният път: утвърждаване на учениците."
    story:
      en: "Then they turned back the way they had come. At Lystra, where Paul had been stoned, they strengthened the disciples and urged them to remain in the faith, telling them that we must go through many hardships to enter the kingdom of God."
      ru: "Затем они повернули назад тем же путём, каким пришли. В Листре, где Павла побили камнями, они утверждали учеников и увещевали их пребывать в вере, поучая, что нам надлежит пройти через многие скорби, чтобы войти в Царствие Божие."
      uk: "Потім вони повернули назад тим самим шляхом, яким прийшли. У Лістрі, де Павла побили камінням, вони зміцнювали учнів і заохочували їх перебувати у вірі, навчаючи, що через багато утисків маємо ввійти в Царство Боже."
      es: "Después volvieron por el camino por el que habían venido. En Listra, donde Pablo había sido apedreado, fortalecieron a los discípulos y los exhortaron a permanecer en la fe, diciéndoles que debemos pasar por muchas tribulaciones para entrar en el reino de Dios."
      pt: "Depois voltaram pelo caminho por onde tinham vindo. Em Listra, onde Paulo fora apedrejado, fortaleceram os discípulos e exortaram-nos a permanecer na fé, dizendo-lhes que é por meio de muitas aflições que devemos entrar no Reino de Deus."
      de: "Dann kehrten sie auf dem Weg zurück, den sie gekommen waren. In Lystra, wo Paulus gesteinigt worden war, stärkten sie die Jünger und ermahnten sie, im Glauben zu bleiben, und sagten ihnen, dass wir durch viele Bedrängnisse in das Reich Gottes eingehen müssen."
      fr: "Puis ils revinrent par le chemin qu’ils avaient pris. À Lystre, où Paul avait été lapidé, ils fortifièrent les disciples et les exhortèrent à persévérer dans la foi, en leur disant qu’il nous faut passer par beaucoup de tribulations pour entrer dans le royaume de Dieu."
      pl: "Potem zawrócili tą samą drogą, którą przyszli. W Listrze, gdzie Paweł został ukamienowany, umacniali uczniów i zachęcali ich do wytrwania w wierze, mówiąc, że przez wiele ucisków musimy wejść do królestwa Bożego."
      it: "Poi tornarono indietro per la via da cui erano venuti. A Listra, dove Paolo era stato lapidato, rafforzarono i discepoli e li esortarono a perseverare nella fede, dicendo loro che dobbiamo passare per molte tribolazioni per entrare nel regno di Dio."
      nl: "Toen keerden zij terug langs de weg die zij gekomen waren. Te Lystra, waar Paulus gestenigd was, versterkten zij de discipelen en spoorden hen aan in het geloof te blijven, en zeiden hun dat wij door vele verdrukkingen het Koninkrijk van God moeten binnengaan."
      cs: "Potom se vraceli cestou, kterou přišli. V Lystře, kde byl Pavel ukamenován, utvrzovali učedníky a povzbuzovali je, aby setrvali ve víře, a říkali jim, že musíme projít mnoha souženími, abychom vešli do Božího království."
      sv: "Sedan vände de tillbaka samma väg som de hade kommit. I Lystra, där Paulus hade stenats, styrkte de lärjungarna och uppmanade dem att förbli i tron, och sade dem att vi måste gå igenom många lidanden för att komma in i Guds rike."
      nb: "Så vendte de tilbake samme vei som de var kommet. I Lystra, der Paulus var blitt steinet, styrket de disiplene og formante dem til å bli i troen, og sa til dem at vi må gå gjennom mange trengsler for å komme inn i Guds rike."
      tl: "Pagkatapos ay bumalik sila sa daang kanilang dinaanan. Sa Listra, kung saan binato si Pablo, pinatibay nila ang mga alagad at hinimok silang manatili sa pananampalataya, na sinasabi sa kanila na sa pamamagitan ng maraming kapighatian ay kinakailangang pumasok tayo sa kaharian ng Diyos."
      da: "Så vendte de tilbage ad den vej, de var kommet. I Lystra, hvor Paulus var blevet stenet, styrkede de disciplene og formanede dem til at blive i troen og sagde til dem, at vi må gennem mange trængsler for at komme ind i Guds rige."
      sr: "Затим су кренули натраг путем којим су дошли. У Листри, где је Павле био засут камењем, утврђивали су ученике и саветовали их да остану у вери, говорећи им да кроз многе невоље треба да уђемо у царство Божје."
      hu: "Ezután visszafordultak azon az úton, amelyen jöttek. Lisztrában, ahol Pált megkövezték, megerősítették a tanítványokat, és intették őket, hogy maradjanak meg a hitben, mondván, hogy sok nyomorúságon át kell bemennünk Isten országába."
      fi: "Sitten he palasivat samaa tietä, jota olivat tulleet. Lystrassa, jossa Paavali oli kivitetty, he vahvistivat opetuslapsia ja kehottivat heitä pysymään uskossa sanoen heille, että meidän on käytävä läpi monet ahdistukset päästäksemme Jumalan valtakuntaan."
      vi: "Rồi họ quay lại theo con đường đã đi. Tại Lít-trơ, nơi Phao-lô đã bị ném đá, họ làm vững lòng các môn đồ và khuyên họ bền đỗ trong đức tin, bảo rằng chúng ta phải trải qua nhiều nỗi khó khăn mới vào được nước Đức Chúa Trời."
      ro: "Apoi s-au întors pe drumul pe care veniseră. La Listra, unde Pavel fusese bătut cu pietre, i-au întărit pe ucenici și i-au îndemnat să rămână în credință, spunându-le că prin multe necazuri trebuie să intrăm în împărăția lui Dumnezeu."
      bg: "После тръгнаха обратно по пътя, по който бяха дошли. В Листра, където Павел беше пребит с камъни, те утвърждаваха учениците и ги увещаваха да пребъдват във вярата, като им казваха, че през много скърби трябва да влезем в царството Божие."
  - place: ae425aa # Iconium
    ref: Acts.14.21
    note:
      en: Return leg.
      ru: Обратный путь.
      uk: "Зворотний шлях."
      es: "Tramo de regreso."
      pt: "Trecho de volta."
      de: "Rückweg."
      fr: "Trajet de retour."
      pl: "Droga powrotna."
      it: "Tappa del ritorno."
      nl: "De terugreis."
      cs: "Zpáteční cesta."
      sv: "Återvägen."
      nb: "Tilbakeveien."
      tl: "Pabalik na biyahe."
      da: "Hjemturen."
      sr: "На повратку."
      hu: "Visszaút."
      fi: "Paluumatka."
      vi: "Chặng về."
      ro: "Drumul de întoarcere."
      bg: "Обратният път."
    story:
      en: "They came back through Iconium, the town they had fled, on the same errand: to strengthen the disciples and encourage them to keep the faith. Acts says no more of this second visit."
      ru: "Они вернулись через Иконию, город, из которого бежали, с тем же делом: утвердить учеников и ободрить их держаться веры. Больше Деяния ничего не говорят об этом втором посещении."
      uk: "Вони повернулися через Іконію, місто, з якого втекли, з тією самою метою: зміцнити учнів і підбадьорити їх триматися віри. Більше Дії нічого не кажуть про цей другий візит."
      es: "Volvieron a pasar por Iconio, la ciudad de la que habían huido, con el mismo propósito: fortalecer a los discípulos y animarlos a mantenerse en la fe. Los Hechos no dicen nada más de esta segunda visita."
      pt: "Voltaram a passar por Icônio, a cidade de onde tinham fugido, com o mesmo propósito: fortalecer os discípulos e encorajá-los a permanecer na fé. Atos não diz mais nada sobre esta segunda visita."
      de: "Sie kamen zurück durch Ikonion, die Stadt, aus der sie geflohen waren, mit demselben Anliegen: die Jünger zu stärken und sie zu ermutigen, am Glauben festzuhalten. Mehr sagt die Apostelgeschichte von diesem zweiten Besuch nicht."
      fr: "Ils repassèrent par Icone, la ville qu’ils avaient fuie, dans le même but : fortifier les disciples et les encourager à garder la foi. Les Actes n’en disent pas davantage sur cette seconde visite."
      pl: "Wrócili przez Ikonium, miasto, z którego uciekli, z tym samym zadaniem: umacniać uczniów i zachęcać ich do trwania w wierze. Dzieje nic więcej nie mówią o tej drugiej wizycie."
      it: "Ripassarono da Icònio, la città da cui erano fuggiti, con lo stesso scopo: rafforzare i discepoli e incoraggiarli a mantenere la fede. Gli Atti non dicono altro di questa seconda visita."
      nl: "Zij kwamen terug door Ikonium, de stad die zij ontvlucht waren, met hetzelfde doel: de discipelen te versterken en hen aan te moedigen aan het geloof vast te houden. Meer zegt Handelingen niet over dit tweede bezoek."
      cs: "Vraceli se přes Ikonium, město, z něhož utekli, se stejným posláním: utvrzovat učedníky a povzbuzovat je, aby zachovali víru. O této druhé návštěvě Skutky nic dalšího neříkají."
      sv: "De kom tillbaka genom Ikonion, staden de hade flytt ifrån, i samma ärende: att styrka lärjungarna och uppmuntra dem att hålla fast vid tron. Apostlagärningarna säger inget mer om detta andra besök."
      nb: "De kom tilbake gjennom Ikonium, byen de hadde flyktet fra, i samme ærend: å styrke disiplene og oppmuntre dem til å holde fast ved troen. Apostlenes gjerninger sier ikke mer om dette andre besøket."
      tl: "Muli silang dumaan sa Iconio, ang bayang kanilang tinakasan, sa gayunding layunin: upang patibayin ang mga alagad at palakasin ang kanilang loob na manatili sa pananampalataya. Wala nang iba pang sinasabi ang Mga Gawa tungkol sa ikalawang pagdalaw na ito."
      da: "De kom tilbage gennem Ikonion, den by, de var flygtet fra, i samme ærinde: at styrke disciplene og opmuntre dem til at holde fast ved troen. Apostlenes Gerninger siger ikke mere om dette andet besøg."
      sr: "Вратили су се кроз Икониј, град из кога су побегли, с истим циљем: да утврђују ученике и храбре их да чувају веру. Дела не говоре ништа више о овој другој посети."
      hu: "Ikóniumon át jöttek vissza, azon a városon át, ahonnan elmenekültek, ugyanazzal a céllal: hogy megerősítsék a tanítványokat, és bátorítsák őket, hogy megtartsák a hitet. Az ApCsel nem mond többet erről a második látogatásról."
      fi: "He palasivat Ikonionin kautta, kaupungin, josta he olivat paenneet, samalla asialla: vahvistamaan opetuslapsia ja rohkaisemaan heitä pysymään uskossa. Apostolien teot ei kerro tästä toisesta käynnistä enempää."
      vi: "Họ trở lại qua Y-cô-ni, thành mà họ đã trốn khỏi, với cùng một mục đích: làm vững lòng các môn đồ và khích lệ họ giữ vững đức tin. Sách Công vụ không nói gì thêm về lần ghé lại thứ hai này."
      ro: "Au trecut din nou prin Iconia, cetatea din care fugiseră, cu același scop: să-i întărească pe ucenici și să-i îmbărbăteze să păstreze credința. Faptele nu spun nimic mai mult despre această a doua vizită."
      bg: "Върнаха се през Икония, града, от който бяха избягали, със същата цел: да утвърждават учениците и да ги насърчават да пазят вярата. Деяния не казват нищо повече за това второ посещение."
  - place: a6c704a # Antioch in Pisidia
    ref: Acts.14.21-Acts.14.23
    note:
      en: Elders appointed in every church.
      ru: Рукополагают пресвитеров к каждой церкви.
      uk: "Старійшин поставлено в кожній церкві."
      es: "Se designan ancianos en cada iglesia."
      pt: "Presbíteros nomeados em cada igreja."
      de: "In jeder Gemeinde werden Älteste eingesetzt."
      fr: "Des anciens sont établis dans chaque Église."
      pl: "Starsi ustanowieni w każdym Kościele."
      it: "Si stabiliscono anziani in ogni chiesa."
      nl: "In elke gemeente worden oudsten aangesteld."
      cs: "V každé církvi jsou ustanoveni starší."
      sv: "Äldste utses i varje församling."
      nb: "Eldste blir innsatt i hver menighet."
      tl: "Nagtatalaga ng mga matanda sa bawat iglesia."
      da: "Der indsættes ældste i hver menighed."
      sr: "Старешине постављене у свакој цркви."
      hu: "Minden gyülekezetben véneket rendelnek."
      fi: "Vanhimmat asetetaan joka seurakuntaan."
      vi: "Lập các trưởng lão trong mỗi Hội thánh."
      ro: "Prezbiteri rânduiți în fiecare biserică."
      bg: "Във всяка църква са ръкоположени презвитери."
    story:
      en: "At Antioch in Pisidia, as in every church, they appointed elders, and with prayer and fasting they commended them to the Lord in whom they had believed. Then they went on through Pisidia and came down into Pamphylia."
      ru: "В Антиохии Писидийской, как и в каждой церкви, они рукоположили пресвитеров и с молитвой и постом предали их Господу, в Которого те уверовали. Затем они прошли через Писидию и спустились в Памфилию."
      uk: "В Антіохії Пісідійській, як і в кожній церкві, вони поставили старійшин і з молитвою та постом передали їх Господові, в Якого ті увірували. Потім вони пройшли через Пісідію й спустилися до Памфілії."
      es: "En Antioquía de Pisidia, como en cada iglesia, constituyeron ancianos y, con oración y ayuno, los encomendaron al Señor en quien habían creído. Luego atravesaron Pisidia y bajaron a Panfilia."
      pt: "Em Antioquia da Pisídia, como em cada igreja, designaram presbíteros e, com oração e jejum, confiaram-nos ao Senhor em quem tinham crido. Depois atravessaram a Pisídia e desceram à Panfília."
      de: "In Antiochia in Pisidien setzten sie, wie in jeder Gemeinde, Älteste ein und befahlen sie mit Gebet und Fasten dem Herrn, an den sie gläubig geworden waren. Dann zogen sie weiter durch Pisidien und kamen hinab nach Pamphylien."
      fr: "À Antioche de Pisidie, comme dans chaque Église, ils établirent des anciens et, avec prière et jeûne, les recommandèrent au Seigneur en qui ils avaient cru. Puis ils traversèrent la Pisidie et descendirent en Pamphylie."
      pl: "W Antiochii Pizydyjskiej, jak w każdym Kościele, ustanowili starszych i z modlitwą i postem polecili ich Panu, w którego uwierzyli. Potem przeszli przez Pizydię i zeszli do Pamfilii."
      it: "Ad Antiochia di Pisidia, come in ogni chiesa, stabilirono degli anziani e, con preghiera e digiuno, li raccomandarono al Signore nel quale avevano creduto. Poi proseguirono attraverso la Pisidia e scesero in Panfilia."
      nl: "Te Antiochië in Pisidië stelden zij, zoals in elke gemeente, oudsten aan, en met gebed en vasten bevalen zij hen aan de Heer, in wie zij geloofd hadden. Daarna trokken zij verder door Pisidië en kwamen af in Pamfylië."
      cs: "V Antiochii Pisidské, stejně jako v každé církvi, ustanovili starší a s modlitbou a postem je svěřili Pánu, v něhož uvěřili. Potom prošli Pisidií a sestoupili do Pamfylie."
      sv: "I Antiochia i Pisidien, liksom i varje församling, utsåg de äldste, och med bön och fasta anbefallde de dem åt Herren som de hade kommit till tro på. Sedan drog de vidare genom Pisidien och kom ned till Pamfylien."
      nb: "I Antiokia i Pisidia, som i hver menighet, innsatte de eldste, og med bønn og faste overgav de dem til Herren som de hadde kommet til tro på. Så dro de videre gjennom Pisidia og kom ned til Pamfylia."
      tl: "Sa Antioquia ng Pisidia, gaya sa bawat iglesia, naglagay sila ng mga matanda, at sa panalangin at pag-aayuno ay ipinagtagubilin nila sila sa Panginoong kanilang sinampalatayanan. Pagkatapos ay nagpatuloy sila sa Pisidia at lumusong sa Pamfilia."
      da: "I Antiokia i Pisidien indsatte de, som i hver menighed, ældste, og under bøn og faste overgav de dem til Herren, som de var kommet til tro på. Derefter drog de videre gennem Pisidien og kom ned til Pamfylien."
      sr: "У Антиохији Писидијској, као у свакој цркви, поставили су старешине и с молитвом и постом предали их Господу у кога су поверовали. Затим су прошли кроз Писидију и сишли у Памфилију."
      hu: "A piszídiai Antiókhiában, mint minden gyülekezetben, véneket rendeltek, és imádsággal és böjttel az Úrra bízták őket, akiben hittek. Aztán továbbmentek Piszídián át, és lejöttek Pamfíliába."
      fi: "Pisidian Antiokiassa he asettivat, kuten jokaisessa seurakunnassa, vanhimmat ja jättivät heidät rukoillen ja paastoten Herran haltuun, johon nämä olivat uskoneet. Sitten he kulkivat Pisidian halki ja tulivat alas Pamfyliaan."
      vi: "Tại An-ti-ốt xứ Bi-si-đi, cũng như trong mỗi Hội thánh, họ lập các trưởng lão, và với sự cầu nguyện và kiêng ăn, họ giao phó những người ấy cho Chúa là Đấng họ đã tin. Rồi họ tiếp tục đi qua xứ Bi-si-đi và xuống xứ Bam-phi-ly."
      ro: "La Antiohia Pisidiei, ca în fiecare biserică, au rânduit prezbiteri și, cu rugăciune și post, i-au încredințat Domnului în care crezuseră. Apoi au mers mai departe prin Pisidia și au coborât în Pamfilia."
      bg: "В Антиохия Писидийска, както във всяка църква, те ръкоположиха презвитери и с молитва и пост ги предадоха на Господа, в когото бяха повярвали. После продължиха през Писидия и слязоха в Памфилия."
  - place: aff04b8 # Perga
    ref: Acts.14.25
    note:
      en: They speak the word in Perga.
      ru: Проповедуют слово в Пергии.
      uk: "Вони проповідують слово в Перге."
      es: "Hablan la palabra en Perge."
      pt: "Falam a palavra em Perge."
      de: "Sie reden das Wort in Perge."
      fr: "Ils annoncent la parole à Perge."
      pl: "Głoszą słowo w Perge."
      it: "Annunciano la parola a Perge."
      nl: "Zij spreken het woord te Perge."
      cs: "Mluví slovo v Perge."
      sv: "De talar ordet i Perge."
      nb: "De taler ordet i Perge."
      tl: "Sinasalita nila ang salita sa Perga."
      da: "De taler ordet i Perge."
      sr: "Говоре реч у Перги."
      hu: "Pergében hirdetik az igét."
      fi: "He puhuvat sanaa Pergessä."
      vi: "Họ giảng lời Chúa tại Bẹt-giê."
      ro: "Vestesc cuvântul în Perga."
      bg: "Те проповядват словото в Перга."
    story:
      en: "On the way out John had left them at Perga; on the way back they preached the word there before going down to the harbour."
      ru: "По пути туда Иоанн оставил их в Пергии; на обратном пути они проповедали там слово, прежде чем спуститься к гавани."
      uk: "Дорогою туди Іван залишив їх у Перге; на зворотному шляху вони проповідували там слово, перш ніж спуститися до гавані."
      es: "A la ida, Juan los había dejado en Perge; a la vuelta predicaron allí la palabra antes de bajar al puerto."
      pt: "Na ida, João os tinha deixado em Perge; na volta, pregaram ali a palavra antes de descerem ao porto."
      de: "Auf dem Hinweg hatte Johannes sie in Perge verlassen; auf dem Rückweg verkündigten sie dort das Wort, bevor sie hinab zum Hafen zogen."
      fr: "À l’aller, Jean les avait quittés à Perge ; au retour, ils y annoncèrent la parole avant de descendre au port."
      pl: "W drodze tam Jan opuścił ich w Perge; w drodze powrotnej głosili tam słowo, zanim zeszli do portu."
      it: "All’andata Giovanni li aveva lasciati a Perge; al ritorno vi annunciarono la parola prima di scendere al porto."
      nl: "Op de heenweg had Johannes hen te Perge verlaten; op de terugweg verkondigden zij daar het woord voordat zij afdaalden naar de haven."
      cs: "Na cestě tam je Jan v Perge opustil; na zpáteční cestě tam kázali slovo, než sestoupili do přístavu."
      sv: "På utvägen hade Johannes lämnat dem i Perge; på återvägen förkunnade de ordet där innan de gick ned till hamnen."
      nb: "På utveien hadde Johannes forlatt dem i Perge; på tilbakeveien forkynte de ordet der før de dro ned til havnen."
      tl: "Sa papunta ay iniwan sila ni Juan sa Perga; sa pabalik ay sinalita nila roon ang salita bago lumusong sa daungan."
      da: "På udrejsen havde Johannes forladt dem i Perge; på hjemrejsen forkyndte de ordet der, før de drog ned til havnen."
      sr: "На одласку их је Јован оставио у Перги; на повратку су тамо проповедали реч пре него што су сишли до луке."
      hu: "Odafelé János Pergében hagyta el őket; visszafelé hirdették ott az igét, mielőtt lementek a kikötőbe."
      fi: "Menomatkalla Johannes oli jättänyt heidät Pergessä; paluumatkalla he julistivat siellä sanaa ennen kuin menivät alas satamaan."
      vi: "Lúc đi, Giăng đã lìa họ tại Bẹt-giê; lúc về, họ giảng đạo tại đó trước khi xuống hải cảng."
      ro: "La plecare, Ioan îi părăsise la Perga; la întoarcere au vestit acolo cuvântul înainte de a coborî la port."
      bg: "На отиване Йоан ги беше напуснал в Перга; на връщане те проповядваха там словото, преди да слязат до пристанището."
  - place: ac744c1 # Attalia
    ref: Acts.14.26
    note:
      en: They sail back to Antioch.
      ru: Отплывают в Антиохию.
      uk: "Вони відпливають назад до Антіохії."
      es: "Navegan de regreso a Antioquía."
      pt: "Navegam de volta a Antioquia."
      de: "Sie segeln zurück nach Antiochia."
      fr: "Ils font voile de retour vers Antioche."
      pl: "Odpływają z powrotem do Antiochii."
      it: "Si imbarcano per tornare ad Antiochia."
      nl: "Zij varen terug naar Antiochië."
      cs: "Plují zpět do Antiochie."
      sv: "De seglar tillbaka till Antiochia."
      nb: "De seiler tilbake til Antiokia."
      tl: "Naglalayag sila pabalik sa Antioquia."
      da: "De sejler tilbage til Antiokia."
      sr: "Отпловљавају натраг у Антиохију."
      hu: "Hajón visszatérnek Antiókhiába."
      fi: "He purjehtivat takaisin Antiokiaan."
      vi: "Họ đi tàu trở về An-ti-ốt."
      ro: "Se întorc pe mare la Antiohia."
      bg: "Те отплават обратно за Антиохия."
    story:
      en: "From Perga they went down to Attalia, today Antalya, the port of the Pamphylian coast founded in the second century BC by Attalus II of Pergamum, and sailed from there for Antioch. It is the only time the Bible names the town."
      ru: "Из Пергии они спустились в Атталию, ныне Анталья, — порт Памфилийского побережья, основанный во II веке до н. э. Атталом II Пергамским, — и оттуда отплыли в Антиохию. Это единственный раз, когда Библия называет этот город."
      uk: "З Перге вони спустилися до Атталії, нині Анталія, — порту Памфілійського узбережжя, заснованого в II ст. до н. е. Атталом II Пергамським, — і звідти відпливли до Антіохії. Це єдиний раз, коли Біблія згадує це місто."
      es: "Desde Perge bajaron a Atalia, hoy Antalya, el puerto de la costa de Panfilia fundado en el siglo II a.C. por Átalo II de Pérgamo, y de allí navegaron hacia Antioquía. Es la única vez que la Biblia nombra esta ciudad."
      pt: "De Perge desceram a Atália, hoje Antália, o porto da costa da Panfília fundado no século II a.C. por Átalo II de Pérgamo, e dali navegaram para Antioquia. É a única vez que a Bíblia menciona a cidade."
      de: "Von Perge zogen sie hinab nach Attalia, dem heutigen Antalya, dem Hafen der pamphylischen Küste, den Attalos II. von Pergamon im 2. Jahrhundert v. Chr. gegründet hatte, und segelten von dort nach Antiochia. Es ist das einzige Mal, dass die Bibel die Stadt nennt."
      fr: "De Perge, ils descendirent à Attalie, aujourd’hui Antalya, le port de la côte pamphylienne fondé au IIe siècle av. J.-C. par Attale II de Pergame, et de là s’embarquèrent pour Antioche. C’est la seule fois que la Bible nomme cette ville."
      pl: "Z Perge zeszli do Attalii, dziś Antalya, portu na wybrzeżu Pamfilii, założonego w II wieku p.n.e. przez Attalosa II z Pergamonu, i stamtąd odpłynęli do Antiochii. To jedyny raz, kiedy Biblia wymienia to miasto."
      it: "Da Perge scesero ad Attalia, oggi Antalya, il porto della costa panfilica fondato nel II secolo a.C. da Attalo II di Pergamo, e di là salparono per Antiochia. È l’unica volta che la Bibbia nomina la città."
      nl: "Van Perge gingen zij af naar Attalia, het huidige Antalya, de haven van de Pamfylische kust, in de tweede eeuw v.Chr. gesticht door Attalus II van Pergamum, en voeren van daar naar Antiochië. Het is de enige keer dat de Bijbel de stad noemt."
      cs: "Z Perge sestoupili do Attaleie, dnešní Antalye, přístavu pamfylského pobřeží, který ve 2. století př. n. l. založil Attalos II. z Pergamu, a odtud odpluli do Antiochie. Je to jediný případ, kdy Bible toto město jmenuje."
      sv: "Från Perge gick de ned till Attalia, i dag Antalya, hamnen på den pamfyliska kusten som grundades på 100-talet f.Kr. av Attalos II av Pergamon, och seglade därifrån mot Antiochia. Det är den enda gången Bibeln nämner staden."
      nb: "Fra Perge dro de ned til Attalia, i dag Antalya, havnen på den pamfyliske kysten som ble grunnlagt i det 2. århundre f.Kr. av Attalos II av Pergamon, og seilte derfra mot Antiokia. Det er den eneste gangen Bibelen nevner byen."
      tl: "Mula sa Perga ay lumusong sila sa Atalia, na ngayo'y Antalya, ang daungan ng baybayin ng Pamfilia na itinatag noong ikalawang siglo BK ni Attalus II ng Pergamo, at mula roon ay naglayag patungong Antioquia. Ito lamang ang pagkakataong binabanggit ng Biblia ang bayang ito."
      da: "Fra Perge drog de ned til Attalia, i dag Antalya, havnen på den pamfyliske kyst, grundlagt i det 2. århundrede f.Kr. af Attalos II af Pergamon, og sejlede derfra mod Antiokia. Det er den eneste gang, Bibelen nævner byen."
      sr: "Из Перге су сишли у Аталију, данашњу Анталију, луку памфилијске обале коју је у 2. веку п. н. е. основао Атал II Пергамски, и одатле отпловили у Антиохију. То је једини пут да Библија именује овај град."
      hu: "Pergéből lementek Attáliába, a mai Antalyába, a pamfíliai part kikötőjébe, amelyet a Kr. e. 2. században a pergamoni II. Attalosz alapított, és onnan Antiókhiába hajóztak. Ez az egyetlen alkalom, amikor a Biblia megnevezi a várost."
      fi: "Pergestä he menivät alas Attaliaan, nykyiseen Antalyaan, Pamfylian rannikon satamaan, jonka Pergamonin Attalos II perusti 100-luvulla eaa., ja purjehtivat sieltä Antiokiaan. Se on ainoa kerta, kun Raamattu mainitsee kaupungin."
      vi: "Từ Bẹt-giê họ xuống Át-ta-li, nay là Antalya, hải cảng của miền duyên hải Bam-phi-ly do Attalus II của Bẹt-găm lập vào thế kỷ thứ hai TCN, và từ đó đi thuyền về An-ti-ốt. Đây là lần duy nhất Kinh Thánh nêu tên thành này."
      ro: "De la Perga au coborât la Atalia, astăzi Antalya, portul coastei Pamfiliei întemeiat în secolul al II-lea î.Hr. de Attalos al II-lea al Pergamului, și de acolo au navigat spre Antiohia. Este singura dată când Biblia numește cetatea."
      bg: "От Перга слязоха в Аталия, днес Анталия — пристанището на Памфилийския бряг, основано през II в. пр.н.е. от Аттал II Пергамски, и оттам отплаваха за Антиохия. Това е единственият път, когато Библията назовава града."
  - place: ae41ab4 # Antioch in Syria
    ref: Acts.14.27-Acts.14.28
    by: sea
    via:
      - [30.8, 36.72]
      - [32.85, 35.93]
      - [35.922, 36.124]
    note:
      en: They report how God has opened a door of faith to the Gentiles.
      ru: Рассказывают, как Бог отверз дверь веры язычникам.
      uk: "Вони розповідають, як Бог відчинив язичникам двері віри."
      es: "Informan de cómo Dios ha abierto la puerta de la fe a los gentiles."
      pt: "Relatam como Deus abriu aos gentios a porta da fé."
      de: "Sie berichten, wie Gott den Heiden die Tür des Glaubens aufgetan hat."
      fr: "Ils rapportent comment Dieu a ouvert aux païens la porte de la foi."
      pl: "Zdają sprawę, jak Bóg otworzył poganom drzwi wiary."
      it: "Riferiscono come Dio abbia aperto ai Gentili la porta della fede."
      nl: "Zij vertellen hoe God de heidenen een deur van het geloof heeft geopend."
      cs: "Podávají zprávu, jak Bůh otevřel pohanům dveře víry."
      sv: "De berättar hur Gud har öppnat en dörr till tro för hedningarna."
      nb: "De forteller hvordan Gud har åpnet troens dør for hedningene."
      tl: "Ibinabalita nila kung paanong binuksan ng Diyos ang pinto ng pananampalataya sa mga Gentil."
      da: "De beretter, hvordan Gud har åbnet hedningerne troens dør."
      sr: "Извештавају како је Бог отворио незнабошцима врата вере."
      hu: "Beszámolnak arról, hogyan nyitotta meg Isten a pogányoknak a hit ajtaját."
      fi: "He kertovat, kuinka Jumala on avannut pakanoille uskon oven."
      vi: "Họ thuật lại việc Đức Chúa Trời đã mở cửa đức tin cho dân ngoại."
      ro: "Istorisesc cum a deschis Dumnezeu neamurilor ușa credinței."
      bg: "Те разказват как Бог е отворил на езичниците врата към вярата."
    story:
      en: "They sailed back to Antioch, where they had been commended to the grace of God for the work they had now completed; Acts names no port, but Seleucia, the harbour of Antioch, is the likely landing place. Gathering the church, they told all that God had done with them and how he had opened a door of faith to the Gentiles, and they stayed there a long time with the disciples."
      ru: "Они отплыли обратно в Антиохию, где были преданы благодати Божией на дело, которое теперь исполнили; Деяния не называют порта, но вероятным местом высадки была Селевкия, гавань Антиохии. Собрав церковь, они рассказали всё, что сотворил с ними Бог и как Он открыл дверь веры язычникам, и долго пробыли там с учениками."
      uk: "Вони відпливли назад до Антіохії, де їх було віддано благодаті Божій на діло, яке вони тепер виконали; Дії не називають порту, але ймовірним місцем висадки була Селевкія, гавань Антіохії. Зібравши церкву, вони розповіли все, що Бог учинив з ними, і як Він відчинив язичникам двері віри, і довго пробули там з учнями."
      es: "Regresaron por mar a Antioquía, donde habían sido encomendados a la gracia de Dios para la obra que ahora habían cumplido; los Hechos no nombran ningún puerto, pero Seleucia, el puerto de Antioquía, es el lugar probable del desembarco. Reunieron a la iglesia y contaron todo lo que Dios había hecho con ellos y cómo había abierto a los gentiles la puerta de la fe, y se quedaron allí mucho tiempo con los discípulos."
      pt: "Voltaram por mar a Antioquia, onde tinham sido confiados à graça de Deus para a obra que agora tinham cumprido; Atos não nomeia nenhum porto, mas Selêucia, o porto de Antioquia, é o provável local de desembarque. Reuniram a igreja e relataram tudo o que Deus tinha feito por meio deles e como tinha aberto aos gentios a porta da fé, e ficaram ali muito tempo com os discípulos."
      de: "Sie segelten zurück nach Antiochia, wo sie der Gnade Gottes für das Werk befohlen worden waren, das sie nun vollendet hatten; die Apostelgeschichte nennt keinen Hafen, doch Seleukia, der Hafen Antiochias, ist der wahrscheinliche Landeplatz. Sie versammelten die Gemeinde, berichteten alles, was Gott mit ihnen getan hatte und wie er den Heiden eine Tür des Glaubens geöffnet hatte, und blieben dort lange Zeit bei den Jüngern."
      fr: "Ils revinrent par mer à Antioche, où ils avaient été recommandés à la grâce de Dieu pour l’œuvre qu’ils venaient d’accomplir ; les Actes ne nomment aucun port, mais Séleucie, le port d’Antioche, est le lieu de débarquement probable. Ayant réuni l’Église, ils racontèrent tout ce que Dieu avait fait avec eux et comment il avait ouvert aux païens la porte de la foi, et ils demeurèrent longtemps avec les disciples."
      pl: "Popłynęli z powrotem do Antiochii, gdzie zostali poleceni łasce Bożej do dzieła, które teraz wykonali; Dzieje nie wymieniają portu, ale prawdopodobnym miejscem lądowania jest Seleucja, port Antiochii. Zgromadziwszy Kościół, opowiedzieli o wszystkim, co Bóg z nimi uczynił, i o tym, jak otworzył poganom drzwi wiary, i przebywali tam długo z uczniami."
      it: "Tornarono per mare ad Antiochia, dove erano stati raccomandati alla grazia di Dio per l’opera che ora avevano compiuto; gli Atti non nominano alcun porto, ma Seleucia, il porto di Antiochia, è il probabile luogo di sbarco. Radunata la chiesa, riferirono tutto ciò che Dio aveva fatto con loro e come aveva aperto ai Gentili la porta della fede, e rimasero lì a lungo con i discepoli."
      nl: "Zij voeren terug naar Antiochië, waar zij aan de genade van God waren opgedragen voor het werk dat zij nu hadden volbracht; Handelingen noemt geen haven, maar Seleucië, de haven van Antiochië, is de waarschijnlijke plaats van aankomst. Zij riepen de gemeente bijeen, vertelden alles wat God met hen gedaan had en hoe Hij voor de heidenen een deur van het geloof geopend had, en bleven daar lange tijd bij de discipelen."
      cs: "Odpluli zpět do Antiochie, kde byli svěřeni milosti Boží k dílu, které nyní dokončili; Skutky neuvádějí přístav, ale pravděpodobným místem přistání je Seleukeia, přístav Antiochie. Shromáždili církev a vyprávěli o všem, co Bůh s nimi učinil, a jak otevřel pohanům dveře víry, a zůstali tam dlouho s učedníky."
      sv: "De seglade tillbaka till Antiochia, där de hade blivit anbefallda åt Guds nåd för det verk som de nu hade fullbordat; Apostlagärningarna nämner ingen hamn, men Seleukia, Antiochias hamn, är den troliga landstigningsplatsen. De samlade församlingen och berättade allt vad Gud hade gjort med dem och hur han hade öppnat en dörr till tro för hedningarna, och de stannade där länge hos lärjungarna."
      nb: "De seilte tilbake til Antiokia, der de var blitt overgitt til Guds nåde for den gjerningen de nå hadde fullført; Apostlenes gjerninger nevner ingen havn, men Seleukia, Antiokias havn, er det sannsynlige ilandstigningsstedet. De samlet menigheten og fortalte alt det Gud hadde gjort med dem, og hvordan han hadde åpnet troens dør for hedningene, og de ble der lenge hos disiplene."
      tl: "Naglayag sila pabalik sa Antioquia, kung saan sila ipinagtagubilin sa biyaya ng Diyos para sa gawaing natapos na nila ngayon; walang binabanggit na daungan ang Mga Gawa, ngunit ang Seleucia, ang daungan ng Antioquia, ang malamang na dinaungan nila. Nang matipon ang iglesia, isinaysay nila ang lahat ng ginawa ng Diyos kasama nila at kung paanong binuksan niya ang pinto ng pananampalataya sa mga Gentil, at nanatili sila roon nang mahabang panahon kasama ng mga alagad."
      da: "De sejlede tilbage til Antiokia, hvor de var blevet overgivet til Guds nåde til den gerning, de nu havde fuldført; Apostlenes Gerninger nævner ingen havn, men Seleukia, Antiokias havn, er det sandsynlige landingssted. De samlede menigheden og fortalte alt, hvad Gud havde gjort med dem, og hvordan han havde åbnet en troens dør for hedningerne, og de blev der længe hos disciplene."
      sr: "Отпловили су натраг у Антиохију, где су били предани благодати Божјој за дело које су сада свршили; Дела не именују луку, али Селеукија, лука Антиохије, вероватно је место где су пристали. Сабравши цркву, казали су све што је Бог учинио с њима и како је незнабошцима отворио врата вере, и остали су тамо дуго с ученицима."
      hu: "Visszahajóztak Antiókhiába, ahol Isten kegyelmére bízták őket arra a munkára, amelyet most elvégeztek; az ApCsel nem nevez meg kikötőt, de valószínűleg Szeleukiában, Antiókhia kikötőjében szálltak partra. Összegyűjtve a gyülekezetet, elbeszélték mindazt, amit Isten velük cselekedett, és hogyan nyitotta meg a pogányoknak a hit ajtaját, és hosszú ideig ott maradtak a tanítványokkal."
      fi: "He purjehtivat takaisin Antiokiaan, jossa heidät oli annettu Jumalan armon haltuun sitä työtä varten, jonka he nyt olivat suorittaneet; Apostolien teot ei mainitse satamaa, mutta Seleukia, Antiokian satama, on todennäköinen maihinnousupaikka. He kutsuivat seurakunnan koolle ja kertoivat kaiken, mitä Jumala oli tehnyt heidän kanssaan, ja kuinka hän oli avannut pakanoille uskon oven, ja he viipyivät siellä kauan opetuslasten luona."
      vi: "Họ đi thuyền trở về An-ti-ốt, nơi họ đã được giao phó cho ân điển Đức Chúa Trời để làm công việc mà nay họ đã hoàn tất; sách Công vụ không nêu tên hải cảng nào, nhưng Sê-lơ-xi, hải cảng của An-ti-ốt, có lẽ là nơi họ cập bến. Nhóm họp Hội thánh lại, họ thuật lại mọi việc Đức Chúa Trời đã làm cùng họ và Ngài đã mở cửa đức tin cho người ngoại thể nào, rồi họ ở lại đó lâu ngày với các môn đồ."
      ro: "Au navigat înapoi la Antiohia, unde fuseseră încredințați harului lui Dumnezeu pentru lucrarea pe care acum o împliniseră; Faptele nu numesc niciun port, dar Seleucia, portul Antiohiei, este locul probabil al debarcării. Adunând biserica, au istorisit tot ce făcuse Dumnezeu cu ei și cum deschisese neamurilor ușa credinței, și au rămas acolo multă vreme cu ucenicii."
      bg: "Те отплаваха обратно за Антиохия, където бяха препоръчани на Божията благодат за делото, което сега бяха изпълнили; Деяния не назовават пристанище, но Селевкия, пристанището на Антиохия, е вероятното място, където слязоха на брега. Като събраха църквата, разказаха всичко, което Бог беше сторил с тях, и как беше отворил на езичниците врата към вярата, и останаха там дълго време с учениците."
