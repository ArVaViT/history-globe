# The tribe of Dan moves north, Judges 18, in the order of the text. The chapter is not
# dated ("in those days there was no king in Israel"); the tour's year (1150 BC) is the
# point of the Judges tour, for the map only. Micah's house on mount Ephraim has no place
# of its own on the map, so its part of the story is told at Dan. The migration is usually
# set early in the period (its priest is a son of Gershom, 18:30; cf. Josh 19:47).
id: danites
title:
  en: "The tribe of Dan moves north"
  ru: "Переселение колена Данова"
  uk: "Коліно Дана рушає на північ"
  es: "La tribu de Dan se traslada al norte"
  pt: "A tribo de Dã segue para o norte"
  de: "Der Stamm Dan zieht nach Norden"
  fr: "La tribu de Dan se déplace vers le nord"
  pl: "Pokolenie Dana wędruje na północ"
  it: "La tribù di Dan si sposta verso nord"
  nl: "De stam Dan trekt naar het noorden"
  cs: "Kmen Dan se stěhuje na sever"
  sv: "Dans stam flyttar norrut"
year: "1150 BC"
approximate: true
stops:
  - place: a08174b # Zorah
    ref: Judg.18.1-Judg.18.2
    note:
      en: "All their inheritance not yet having fallen to them, the Danites send five men from Zorah and Eshtaol to spy out the land."
      ru: "Не получив полного удела, сыны Дановы посылают из Цоры и Естаола пять человек осмотреть землю."
      uk: "Оскільки весь їхній уділ ще не припав їм, данити посилають п’ятьох чоловіків із Цори та Ештаолу вивідати землю."
      es: "Como aún no les había tocado toda su heredad, los danitas envían cinco hombres desde Zora y Estaol a reconocer la tierra."
      pt: "Como toda a sua herança ainda não lhes havia caído por sorte, os danitas enviam cinco homens de Zorá e Estaol para espiar a terra."
      de: "Da ihnen ihr ganzes Erbteil noch nicht zugefallen war, senden die Daniter fünf Männer aus Zora und Eschtaol, um das Land zu erkunden."
      fr: "Leur héritage ne leur étant pas encore échu, les Danites envoient cinq hommes de Tsorea et d’Eschthaol explorer le pays."
      pl: "Ponieważ cały ich dział jeszcze nie przypadł im w udziale, Danici wysyłają z Sory i Esztaol pięciu mężów, aby wybadali kraj."
      it: "Poiché la loro eredità non era ancora toccata loro per intero, i Daniti mandano cinque uomini da Zorea e da Estaol a esplorare il paese."
      nl: "Omdat hun erfdeel nog niet geheel aan hen was toegevallen, zenden de Danieten vijf man uit Zora en Estaol om het land te verkennen."
      cs: "Protože jim ještě nepřipadlo celé dědictví, posílají Danité z Corey a Eštaolu pět mužů, aby vyšpehovali zemi."
      sv: "Eftersom hela deras arvedel ännu inte hade tillfallit dem sänder daniterna fem män från Sora och Eshtaol för att spana ut landet."
  - place: a513646 # Dan
    ref: Judg.18.7-Judg.18.10
    note:
      en: "They come to Laish, later Dan, and find a people quiet and secure, far from the Sidonians and having no business with any man."
      ru: "Они приходят в Лаис, будущий Дан, и видят народ, живущий покойно и беспечно, далеко от Сидонян и ни с кем не имеющий дела."
      uk: "Вони приходять до Лаїша, пізнішого Дана, і знаходять народ спокійний і безпечний, далекий від сидонян і такий, що не має ні з ким діла."
      es: "Llegan a Lais, más tarde Dan, y hallan un pueblo tranquilo y seguro, lejos de los sidonios y sin trato con nadie."
      pt: "Chegam a Laís, depois chamada Dã, e encontram um povo tranquilo e seguro, longe dos sidônios e sem negócios com ninguém."
      de: "Sie kommen nach Lais, dem späteren Dan, und finden ein Volk, das ruhig und sicher lebt, weit entfernt von den Sidoniern und ohne mit irgendeinem Menschen etwas zu schaffen zu haben."
      fr: "Ils arrivent à Laïsch, appelée plus tard Dan, et trouvent un peuple tranquille et en sécurité, éloigné des Sidoniens et sans liaison avec d’autres hommes."
      pl: "Docierają do Lajisz, późniejszego Dan, i znajdują lud żyjący w spokoju i bezpieczeństwie, daleko od Sydończyków i niemający z nikim żadnych spraw."
      it: "Giungono a Lais, poi chiamata Dan, e vi trovano un popolo tranquillo e sicuro, lontano dai Sidoni e senza rapporti con alcuno."
      nl: "Zij komen te Lais, later Dan, en vinden een volk dat rustig en zeker woont, ver van de Sidoniërs en zonder omgang met wie dan ook."
      cs: "Přicházejí do Lajiše, pozdějšího Danu, a nacházejí lid klidný a bezpečný, vzdálený od Sidonských a bez styku s kýmkoli."
      sv: "De kommer till Lajish, som senare blev Dan, och finner ett folk som lever i lugn och trygghet, långt från sidonierna och utan något att göra med någon."
  - place: a67325d # Mahaneh-dan
    ref: Judg.18.11-Judg.18.12
    note:
      en: "Six hundred armed men set out and camp at Kiriath-jearim in Judah; the place behind it is called Mahaneh-dan, the camp of Dan."
      ru: "Шестьсот вооружённых мужей выступают и становятся станом в Кириаф-Иариме, в Иудее; место позади него называют Станом Дановым."
      uk: "Шістсот озброєних чоловіків вирушають і стають табором у Кіріят-Єаримі в Юді; місце позаду нього називають Стан Данів."
      es: "Seiscientos hombres armados parten y acampan en Quiriat-jearim, en Judá; el lugar que queda detrás se llama Mahane-dan, el campamento de Dan."
      pt: "Seiscentos homens armados partem e acampam em Quiriate-Jearim, em Judá; o lugar atrás dela é chamado Maané-Dã, o acampamento de Dã."
      de: "Sechshundert bewaffnete Männer brechen auf und lagern bei Kirjat-Jearim in Juda; der Ort dahinter heißt Mahane-Dan, das Lager Dans."
      fr: "Six cents hommes armés se mettent en route et campent à Kirjath-Jearim en Juda ; le lieu qui est derrière s’appelle Machané-Dan, le camp de Dan."
      pl: "Sześciuset zbrojnych mężów wyrusza i rozbija obóz w Kiriat-Jearim w Judzie; miejsce za nim nazywa się Machane-Dan, czyli obóz Dana."
      it: "Seicento uomini armati si mettono in marcia e si accampano a Kiriat-Iearim, in Giuda; il luogo che sta dietro è chiamato Macane-Dan, l’accampamento di Dan."
      nl: "Zeshonderd gewapende mannen trekken uit en slaan hun kamp op bij Kirjat-Jearim in Juda; de plaats daarachter heet Machane-Dan, het leger van Dan."
      cs: "Šest set ozbrojených mužů vyráží a utáboří se v Kirjat-jearímu v Judsku; místo za ním se nazývá Machane-dan, tábor Danův."
      sv: "Sex hundra beväpnade män bryter upp och slår läger vid Kirjat-Jearim i Juda; platsen bakom den kallas Mahane-Dan, Dans läger."
  - place: a513646 # Dan
    ref: Judg.18.13-Judg.18.31
    note:
      en: "Taking Micah's graven image and his priest on the way, they smite Laish, burn it, build a city there and call it Dan, after their father."
      ru: "Забрав по пути истукан Михи и его священника, они поражают Лаис, сжигают его, строят город снова и нарекают ему имя Дан, по имени отца своего."
      uk: "Узявши дорогою різьблену подобу Міхи та його священика, вони б’ють Лаїш, палять його, будують там місто й називають його Дан за іменем свого батька."
      es: "Llevándose por el camino la imagen de talla de Micaías y a su sacerdote, hieren Lais, la incendian, edifican allí una ciudad y la llaman Dan, por el nombre de su padre."
      pt: "Levando pelo caminho a imagem de escultura de Mica e o seu sacerdote, ferem Laís, queimam-na, constroem ali uma cidade e a chamam Dã, em honra do seu pai."
      de: "Unterwegs nehmen sie Michas Schnitzbild und seinen Priester mit, schlagen Lais, verbrennen es, bauen dort eine Stadt und nennen sie Dan, nach ihrem Vater."
      fr: "Prenant en chemin l’image taillée de Michée et son prêtre, ils frappent Laïsch, l’incendient, y bâtissent une ville et l’appellent Dan, d’après leur père."
      pl: "Zabrawszy po drodze rzeźbiony posąg Miki i jego kapłana, pobijają Lajisz, palą je, budują tam miasto i nazywają je Dan od imienia swego ojca."
      it: "Presa per strada l’immagine scolpita di Michea e il suo sacerdote, colpiscono Lais, la incendiano, vi costruiscono una città e la chiamano Dan, dal nome del loro padre."
      nl: "Onderweg nemen zij Micha's gesneden beeld en zijn priester mee, slaan Lais, verbranden het, bouwen er een stad en noemen die Dan, naar hun vader."
      cs: "Cestou berou Micheášovu tesanou modlu i jeho kněze, bijí Lajiš, vypalují jej, staví tam město a nazývají je Dan po svém otci."
      sv: "På vägen tar de Mikas skurna bild och hans präst, slår Lajish, bränner det, bygger en stad där och kallar den Dan, efter sin fader."
