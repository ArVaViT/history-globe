stops:
  - place: a2fe63c # Ramoth-gilead
    ref: 2Kgs.9.1-2Kgs.9.13
    note:
      en: 'Sent by Elisha, one of the sons of the prophets anoints Jehu king over Israel at Ramoth-gilead, and the captains blow the trumpet: "Jehu is king."'
      ru: "Посланный Елисеем сын пророческий помазывает Ииуя в царя над Израилем в Рамофе Галаадском, и военачальники трубят: «воцарился Ииуй!»"
      uk: "Посланий Єлисеєм, один із синів пророків помазує Єгу на царя над Ізраїлем у Рамоті Гілеадському, і воєначальники сурмлять у сурму: «Егуй став царем!»"
      es: "Enviado por Eliseo, uno de los hijos de los profetas unge a Jehú rey de Israel en Ramot de Galaad, y los capitanes tocan la trompeta: «Jehú es rey»."
      pt: "Enviado por Eliseu, um dos filhos dos profetas unge Jeú rei sobre Israel em Ramote-Gileade, e os comandantes tocam a trombeta: “Jeú é rei!”"
      de: "Von Elisa gesandt, salbt einer der Prophetenjünger Jehu in Ramot in Gilead zum König über Israel, und die Hauptleute stoßen in die Posaune: „Jehu ist König geworden!“"
      fr: "Envoyé par Élisée, l’un des fils des prophètes oint Jéhu roi d’Israël à Ramoth en Galaad, et les chefs sonnent de la trompette : « Jéhu est roi ! »"
      pl: "Posłany przez Elizeusza, jeden z synów proroków namaszcza Jehu na króla nad Izraelem w Ramot w Gileadzie, a dowódcy trąbią w trąbę: „Króluje Jehu!”"
      it: "Mandato da Eliseo, uno dei figli dei profeti unge Ieu re d’Israele a Ramot di Galaad, e i capitani suonano la tromba: «Jehu è re!»"
      nl: "Door Elisa gezonden zalft een van de profetenzonen Jehu te Ramot in Gilead tot koning over Israël, en de oversten blazen de bazuin: “Jehu is koning geworden!”"
      cs: "Jeden ze synů proroků, poslaný Elíšou, pomazává v Rámotu v Gileadu Jehúa za krále nad Izraelem a velitelé zatroubí na trubku: „Kralujeť Jéhu.“"
      sv: "Sänd av Elisha smörjer en av profetlärjungarna Jehu till kung över Israel i Ramot i Gilead, och hövitsmännen stöter i basun: ”Jehu har blivit konung.”"
      nb: "Sendt av Elisja salver en av profetsønnene Jehu til konge over Israel i Ramot-Gilead, og høvedsmennene støter i basunen: «Jehu er konge!»"
      tl: "Sinugo ni Eliseo, pinahiran ng isa sa mga anak ng mga propeta si Jehu bilang hari sa Israel sa Ramoth-galaad, at humihip ng pakakak ang mga kapitan: “Si Jehu ay hari.”"
      da: "Sendt af Elisa salver en af profeternes sønner Jehu til konge over Israel i Ramot i Gilead, og hærførerne blæser i trompeten: »Jehu er Konge.«"
      sr: "Послан од Јелисија, један од синова пророчких помазује Јуја за цара над Израиљем у Рамоту Галадском, и заповедници трубе у трубу: „Јуј поста цар.“"
      hu: "Elizeus megbízásából a próféták fiai közül az egyik Rámót-Gileádban Izráel királyává kenti Jéhut, a vezérek pedig megfújják a harsonát: „Jéhu uralkodik!”"
      fi: "Elisan lähettämänä yksi profeetanoppilaista voitelee Jehun Israelin kuninkaaksi Ramot-Gileadissa, ja päälliköt puhaltavat pasunaan: ”Jeehu on tullut kuninkaaksi”."
      vi: "Do Ê-li-sê sai đi, một trong các môn đồ của những tiên tri xức dầu cho Giê-hu làm vua Y-sơ-ra-ên tại Ra-mốt Ga-la-át, và các quan tướng thổi kèn: “Giê-hu làm vua!”"
      ro: "Trimis de Elisei, unul dintre fiii profeților îl unge pe Iehu rege peste Israel la Ramot din Galaad, iar căpeteniile sună din trâmbiță: „Iu împărat”."
      bg: "Изпратен от Елисей, един от пророческите синове помазва Йеху за цар над Израил в Рамот Галаадски и военачалниците затръбяват: „Въцари се Ииуй.“"
  - place: ae0bf4a # Jezreel
    ref: 2Kgs.9.16-2Kgs.9.26
    note:
      en: 'He drives to Jezreel, "for he driveth furiously", and in the portion of Naboth shoots Joram king of Israel through the heart.'
      ru: "Он едет в Изреель, «потому что он идет стремительно», и на поле Навуфея поражает Иорама, царя Израильского, стрелой в сердце."
      uk: "Він їде до Їзреелю, «бо він жене, мов скажений», і на ділянці Навуфея вражає стрілою в серце Йорама, царя Ізраїлю."
      es: "Se dirige a Jezreel, «porque viene impetuosamente», y en la heredad de Nabot atraviesa el corazón de Joram, rey de Israel, con una flecha."
      pt: "Ele vai de carro a Jezreel, “pois ele guia furiosamente”, e na porção de Nabote atravessa com uma flecha o coração de Jorão, rei de Israel."
      de: "Er fährt nach Jesreel, „denn er treibt, wie wenn er unsinnig wäre“, und erschießt auf dem Feldstück Nabots Joram, den König von Israel, mitten ins Herz."
      fr: "Il se rend en char à Jizreel, « car il conduit d’une manière insensée », et dans le champ de Naboth il perce le cœur de Joram, roi d’Israël, d’une flèche."
      pl: "Jedzie do Jizreel, „bo szalenie jedzie”, i na polu Nabota przeszywa serce Jorama, króla Izraela."
      it: "Corre in carro verso Izreel, «perché va a precipizio», e nel campo di Nabot colpisce al cuore Ioram, re d’Israele, con una freccia."
      nl: "Hij rijdt naar Jizreël, “want hij drijft onzinniglijk”, en schiet op het stuk land van Nabot Joram, de koning van Israël, door het hart."
      cs: "Jede do Jizreelu, „nebo vztekle jede“, a na Nábotově poli prostřelí srdce Jorama, krále izraelského."
      sv: "Han far till Jisreel, ”ty han far fram såsom en vanvetting”, och skjuter Joram, Israels kung, genom hjärtat på Navots åkerstycke."
      nb: "Han kjører til Jisreel, «for han farer frem som en rasende», og skyter Joram, Israels konge, gjennom hjertet på Nabots jordstykke."
      tl: "Sumakay siya patungong Jezreel, “sapagka't siya'y nagpapatakbo na magilas”, at sa bahagi ni Naboth ay pinana niya sa puso si Joram na hari sa Israel."
      da: "Han kører til Jizre'el, »thi han farer af Sted, som han var gal«, og skyder på Nabots mark Joram, Israels konge, gennem hjertet."
      sr: "Вози се у Језраел, „јер иде помамно“, и на њиви Навутејевој стрелом погађа у срце Јорама, цара израиљског."
      hu: "Jezréelbe hajt, „mert mint egy őrült, úgy hajt”, és Nábót mezejének részében szíven lövi Jórámot, Izráel királyát."
      fi: "Hän ajaa Jisreeliin, ”sillä hän ajaa niinkuin hurja”, ja ampuu Nabotin peltotilkulla Israelin kuninkaan Joramin sydämen läpi."
      vi: "Người đánh xe đến Gít-rê-ên, “vì người dẫn cách hung hăng”, và tại phần ruộng của Na-bốt, người bắn Giô-ram, vua Y-sơ-ra-ên, xuyên qua lòng."
      ro: "Pornește cu carul spre Izreel, „căci mână furios”, iar în ogorul lui Nabot îl străpunge cu o săgeată prin inimă pe Ioram, regele lui Israel."
      bg: "Той препуска към Изреел, „защото ходи като неистов“, и в дяла на Навутей пронизва в сърцето Йорам, царя на Израил."
  - place: a8554e3 # Megiddo
    ref: 2Kgs.9.27-2Kgs.9.28
    note:
      en: "Ahaziah king of Judah flees, is smitten at the going up to Gur, which is by Ibleam, and dies at Megiddo; his servants bury him in Jerusalem."
      ru: "Охозия, царь Иудейский, бежит, ранен на возвышенности Гур, что при Ивлеаме, и умирает в Мегиддоне; слуги хоронят его в Иерусалиме."
      uk: "Охозія, цар Юди, тікає, його вражено на підйомі до Гуру, що біля Івлеаму, і він помирає в Мегіддо; його слуги ховають його в Єрусалимі."
      es: "Ocozías, rey de Judá, huye, es herido en la subida de Gur, junto a Ibleam, y muere en Meguido; sus siervos lo sepultan en Jerusalén."
      pt: "Acazias, rei de Judá, foge, é ferido na subida de Gur, que fica junto a Ibleão, e morre em Megido; seus servos o sepultam em Jerusalém."
      de: "Ahasja, der König von Juda, flieht, wird auf der Anhöhe Gur bei Jibleam geschlagen und stirbt in Megiddo; seine Knechte begraben ihn in Jerusalem."
      fr: "Achazia, roi de Juda, s’enfuit, est frappé à la montée de Gur, près de Jibleam, et meurt à Meguiddo ; ses serviteurs l’ensevelissent à Jérusalem."
      pl: "Ochozjasz, król Judy, ucieka, zostaje ugodzony na podjeździe do Gur, które leży koło Jibleam, i umiera w Megiddo; jego słudzy chowają go w Jerozolimie."
      it: "Acazia, re di Giuda, fugge, è colpito alla salita di Gur, presso Ibleam, e muore a Meghiddo; i suoi servi lo seppelliscono a Gerusalemme."
      nl: "Achazia, de koning van Juda, vlucht, wordt geslagen bij de opgang naar Gur, die bij Jibleam ligt, en sterft te Megiddo; zijn knechten begraven hem in Jeruzalem."
      cs: "Achazjáš, král judský, prchá, je raněn na výstupu ke Gúru, který je u Jibleamu, a umírá v Megidu; jeho služebníci ho pohřbívají v Jeruzalémě."
      sv: "Ahasja, Judas kung, flyr, slås vid uppgången till Gur, som ligger vid Jivleam, och dör i Megiddo; hans tjänare begraver honom i Jerusalem."
      nb: "Ahasja, kongen i Juda, flykter, blir slått ned ved oppgangen til Gur, som ligger ved Jibleam, og dør i Megiddo; hans tjenere gravlegger ham i Jerusalem."
      tl: "Tumakas si Ochozias na hari sa Juda, sinaktan sa ahunan sa Gur, na nasa siping ng Ibleam, at namatay sa Megiddo; inilibing siya ng kaniyang mga lingkod sa Jerusalem."
      da: "Akazja, Judas konge, flygter, rammes ved opstigningen til Gur, som ligger ved Jible'am, og dør i Megiddo; hans tjenere begraver ham i Jerusalem."
      sr: "Охозија, цар јудејски, бежи, рањен је на успону Гур, који је код Ивлеама, и умире у Мегиду; слуге га сахрањују у Јерусалиму."
      hu: "Ahazja, Júda királya elmenekül, a Jibleám melletti Gúr felé vezető emelkedőn megsebesítik, és Megiddóban meghal; szolgái eltemetik Jeruzsálemben."
      fi: "Juudan kuningas Ahasja pakenee, hänet lyödään Gurin nousussa, joka on Jibleamin luona, ja hän kuolee Megiddossa; hänen palvelijansa hautaavat hänet Jerusalemiin."
      vi: "A-cha-xia, vua Giu-đa, chạy trốn, bị đánh tại dốc Gu-rơ, gần Gíp-lê-am, và chết tại Mê-ghi-đô; các tôi tớ người chôn người tại Giê-ru-sa-lem."
      ro: "Ahazia, regele lui Iuda, fuge, este lovit la urcușul spre Gur, lângă Ibleam, și moare la Meghido; slujitorii lui îl îngroapă la Ierusalim."
      bg: "Охозия, царят на Юда, бяга, ранен е по нагорнището към Гур, което е до Ивлеам, и умира в Мегидо; слугите му го погребват в Йерусалим."
  - place: ae0bf4a # Jezreel
    ref: 2Kgs.9.30-2Kgs.9.37
    note:
      en: "At Jezreel Jezebel, painted, looks out of a window; she is thrown down, and of her only the skull, the feet and the palms of her hands are found: the dogs have eaten her, as the Lord had said by Elijah."
      ru: "В Изрееле Иезавель, нарумянив лицо, глядит в окно; её выбрасывают, и от неё находят лишь череп, ноги и кисти рук: псы съели её, по слову Господа через Илию."
      uk: "У Їзреелі Єзавель, нафарбована, виглядає з вікна; її скидають, і від неї знаходять лише череп, ноги та долоні рук: пси з’їли її, як Господь сказав через Іллю."
      es: "En Jezreel Jezabel, maquillada, se asoma a una ventana; es arrojada abajo, y de ella solo se encuentran el cráneo, los pies y las palmas de las manos: los perros la han comido, como había dicho el Señor por medio de Elías."
      pt: "Em Jezreel, Jezabel, pintada, olha de uma janela; é lançada para baixo, e dela se encontram apenas o crânio, os pés e as palmas das mãos: os cães a devoraram, como o Senhor dissera por meio de Elias."
      de: "In Jesreel schaut die geschminkte Isebel aus einem Fenster; sie wird hinabgestürzt, und von ihr findet man nur den Schädel, die Füße und die flachen Hände: Die Hunde haben sie gefressen, wie der Herr durch Elia gesagt hatte."
      fr: "À Jizreel, Jézabel, fardée, regarde par la fenêtre ; elle est précipitée, et on ne retrouve d’elle que le crâne, les pieds et les paumes des mains : les chiens l’ont mangée, comme l’Éternel l’avait dit par Élie."
      pl: "W Jizreel Izebel, wymalowana, wygląda przez okno; zostaje strącona i z niej odnaleziono tylko czaszkę, stopy i dłonie rąk: psy ją zjadły, jak Pan powiedział przez Eliasza."
      it: "A Izreel Gezabele, truccata, si affaccia a una finestra; viene gettata giù, e di lei si ritrovano soltanto il teschio, i piedi e le palme delle mani: i cani l’hanno divorata, come il Signore aveva detto per mezzo di Elia."
      nl: "Te Jizreël kijkt Izebel, opgemaakt, uit een venster; zij wordt neergeworpen, en van haar worden alleen de schedel, de voeten en de handpalmen gevonden: de honden hebben haar opgegeten, zoals de HEER door Elia had gezegd."
      cs: "V Jizreelu vyhlíží z okna nalíčená Jezábel; je svržena dolů a z ní se najde jen lebka, nohy a dlaně rukou: psi ji sežrali, jak Hospodin řekl skrze Elijáše."
      sv: "I Jisreel tittar Isebel, målad, ut genom ett fönster; hon störtas ner, och av henne återfinns bara skallen, fötterna och handflatorna: hundarna har ätit upp henne, såsom Herren hade sagt genom Elia."
      nb: "I Jisreel ser Jesabel, sminket, ut av et vindu; hun blir kastet ned, og av henne blir bare hodeskallen, føttene og håndflatene funnet: hundene har spist henne, som Herren hadde sagt ved Elia."
      tl: "Sa Jezreel ay dumungaw sa bintana si Jezabel, na nagpinta ng kaniyang mukha; inihulog siya, at ang bungo, ang mga paa at ang mga palad ng kaniyang mga kamay na lamang ang nasumpungan sa kaniya: kinain siya ng mga aso, gaya ng sinabi ng Panginoon sa pamamagitan ni Elias."
      da: "I Jizre'el ser Jezabel, sminket, ud ad et vindue; hun styrtes ned, og af hende finder man kun hovedskallen, fødderne og håndfladerne: hundene har ædt hende, som Herren havde sagt ved Elija."
      sr: "У Језраелу Језавеља, нашминкана, гледа кроз прозор; бацају је доле и од ње се налазе само лобања, стопала и шаке: пси су је појели, као што је Господ рекао преко Илије."
      hu: "Jezréelben a kifestett Jézabel kinéz az ablakon; lelökik, és belőle csak a koponyáját, a lábait és a tenyerét találják meg: a kutyák megették, ahogyan az Úr megmondta Illés által."
      fi: "Jisreelissä Isebel, maalattuna, katsoo ikkunasta; hänet heitetään alas, ja hänestä löytyy vain pääkallo, jalat ja kämmenet: koirat ovat syöneet hänet, niin kuin Herra oli sanonut Elian kautta."
      vi: "Tại Gít-rê-ên, Giê-sa-bên, trang điểm, nhìn ra cửa sổ; bà bị quăng xuống, và người ta chỉ còn thấy cái sọ, hai chân và lòng bàn tay của bà: chó đã ăn bà, y như Đức Giê-hô-va đã phán qua Ê-li."
      ro: "La Izreel, Izabela, sulemenită, privește pe fereastră; este aruncată jos, iar din ea se mai găsesc doar țeasta, picioarele și palmele: câinii au mâncat-o, cum spusese Domnul prin Ilie."
      bg: "В Изреел Йезавел с начервено лице гледа от прозореца; хвърлят я долу и от нея намират само черепа, стъпалата и дланите: кучетата са я изяли, както Господ бе казал чрез Илия."
  - place: a041bb3 # Samaria
    ref: 2Kgs.10.1-2Kgs.10.28
    note:
      en: "The seventy sons of Ahab are slain in Samaria and their heads sent to Jezreel; in Samaria Jehu slays all that remained unto Ahab and destroys Baal out of Israel."
      ru: "Семьдесят сыновей Ахава убиты в Самарии, их головы отосланы в Изреель; в Самарии Ииуй избивает всех, оставшихся у Ахава, и истребляет Ваала с земли Израильской."
      uk: "Сімдесят синів Ахава вбито в Самарії, а їхні голови надіслано до Їзреелю; в Самарії Єгу вбиває всіх, хто залишився в Ахава, і винищує Ваала з Ізраїлю."
      es: "Los setenta hijos de Acab son muertos en Samaria y sus cabezas enviadas a Jezreel; en Samaria Jehú mata a todos los que quedaban de Acab y destruye a Baal de Israel."
      pt: "Os setenta filhos de Acabe são mortos em Samaria e as suas cabeças enviadas a Jezreel; em Samaria Jeú mata todos os que restavam de Acabe e extermina Baal de Israel."
      de: "Die siebzig Söhne Ahabs werden in Samaria erschlagen und ihre Köpfe nach Jesreel gesandt; in Samaria erschlägt Jehu alle, die von Ahab übrig waren, und vertilgt den Baal aus Israel."
      fr: "Les soixante-dix fils d’Achab sont mis à mort à Samarie et leurs têtes envoyées à Jizreel ; à Samarie, Jéhu tue tous ceux qui restaient d’Achab et détruit Baal en Israël."
      pl: "Siedemdziesięciu synów Achaba zostaje zabitych w Samarii, a ich głowy posłane do Jizreel; w Samarii Jehu zabija wszystkich, którzy pozostali Achabowi, i wytępia Baala z Izraela."
      it: "I settanta figli di Acab sono uccisi a Samaria e le loro teste mandate a Izreel; a Samaria Ieu uccide tutti quelli che erano rimasti di Acab e stermina Baal da Israele."
      nl: "De zeventig zonen van Achab worden in Samaria gedood en hun hoofden naar Jizreël gestuurd; in Samaria doodt Jehu allen die van Achab over waren en verdelgt Baäl uit Israël."
      cs: "V Samaří je zabito sedmdesát synů Achabových a jejich hlavy jsou poslány do Jizreelu; v Samaří Jehú zabíjí všechny, kdo zůstali z Achaba, a vyhlazuje Baala z Izraele."
      sv: "Achavs sjuttio söner dräps i Samaria och deras huvuden sänds till Jisreel; i Samaria dräper Jehu alla som var kvar av Achavs hus och utrotar Baal ur Israel."
      nb: "Akabs sytti sønner blir slått i hjel i Samaria og hodene deres sendt til Jisreel; i Samaria slår Jehu i hjel alle som var igjen av Akabs hus, og utrydder Baal av Israel."
      tl: "Pinatay sa Samaria ang pitumpung anak ni Achab at ipinadala ang kanilang mga ulo sa Jezreel; sa Samaria ay pinatay ni Jehu ang lahat ng naiwan kay Achab at nilipol si Baal sa Israel."
      da: "Akabs halvfjerds sønner dræbes i Samaria, og deres hoveder sendes til Jizre'el; i Samaria dræber Jehu alle, der var tilbage af Akabs hus, og udrydder Ba'al af Israel."
      sr: "Седамдесет синова Ахавових бива побијено у Самарији и њихове главе се шаљу у Језраел; у Самарији Јуј убија све што је остало Ахаву и истребљује Вала из Израиља."
      hu: "Aháb hetven fiát megölik Szamáriában, fejüket Jezréelbe küldik; Szamáriában Jéhu megöl mindenkit, aki Ahábnak megmaradt, és kiirtja Baált Izráelből."
      fi: "Ahabin seitsemänkymmentä poikaa surmataan Samariassa ja heidän päänsä lähetetään Jisreeliin; Samariassa Jehu surmaa kaikki, jotka olivat jääneet jäljelle Ahabin suvusta, ja hävittää Baalin Israelista."
      vi: "Bảy mươi con trai của A-háp bị giết tại Sa-ma-ri và đầu chúng bị gởi đến Gít-rê-ên; tại Sa-ma-ri, Giê-hu giết hết thảy những người còn sót lại của nhà A-háp và diệt Ba-anh khỏi Y-sơ-ra-ên."
      ro: "Cei șaptezeci de fii ai lui Ahab sunt uciși în Samaria, iar capetele lor sunt trimise la Izreel; în Samaria, Iehu îi ucide pe toți cei rămași ai lui Ahab și îl nimicește pe Baal din Israel."
      bg: "Седемдесетте сина на Ахав са избити в Самария и главите им са изпратени в Изреел; в Самария Йеху избива всички останали от Ахав и изтребва Ваал от Израил."
  - place: ae73b90 # Gilead
    ref: 2Kgs.10.32-2Kgs.10.33
    note:
      en: "In those days Hazael of Syria smites Israel east of the Jordan, all the land of Gilead, from Aroer by the river Arnon to Bashan."
      ru: "В те дни Азаил Сирийский поражает Израиль на восток от Иордана, всю землю Галаад, от Ароера при потоке Арноне до Васана."
      uk: "У ті дні Азаїл Сирійський б’є Ізраїль на схід від Йордану, всю землю Гілеад, від Ароера над рікою Арнон до Башану."
      es: "En aquellos días Hazael de Siria hiere a Israel al este del Jordán, en toda la tierra de Galaad, desde Aroer, junto al río Arnón, hasta Basán."
      pt: "Naqueles dias Hazael, da Síria, fere Israel a leste do Jordão, toda a terra de Gileade, desde Aroer, junto ao rio Arnom, até Basã."
      de: "In jenen Tagen schlägt Hasaël von Syrien Israel östlich des Jordan, das ganze Land Gilead, von Aroër am Fluss Arnon bis nach Baschan."
      fr: "En ces jours-là, Hazaël de Syrie bat Israël à l’orient du Jourdain, tout le pays de Galaad, depuis Aroër sur le torrent de l’Arnon jusqu’à Basan."
      pl: "W owych dniach Chazael z Syrii bije Izraela na wschód od Jordanu, całą ziemię Gilead, od Aroer nad rzeką Arnon aż po Baszan."
      it: "In quei giorni Cazaèl di Siria colpisce Israele a oriente del Giordano, tutto il paese di Galaad, da Aroer, presso il fiume Arnon, fino a Basan."
      nl: "In die dagen slaat Hazaël van Syrië Israël ten oosten van de Jordaan, het hele land Gilead, van Aroër aan de rivier de Arnon tot Basan."
      cs: "V těch dnech Chazael Syrský bije Izrael na východ od Jordánu, celou zemi Gilead, od Aroeru při řece Arnon po Bášan."
      sv: "På den tiden slår Hasael av Syrien Israel öster om Jordan, hela Gileads land, från Aroer vid floden Arnon till Bashan."
      nb: "I de dager slår Hasael av Syria Israel øst for Jordan, hele Gileads land, fra Aroer ved elven Arnon til Basan."
      tl: "Nang mga araw na iyon ay sinaktan ni Hazael ng Siria ang Israel sa silangan ng Jordan, ang buong lupain ng Gilead, mula sa Aroer sa siping ng ilog Arnon hanggang sa Basan."
      da: "I de dage slår Hazael af Syrien Israel øst for Jordan, hele Gileads land, fra Aroer ved floden Arnon til Basan."
      sr: "У те дане Азаило сирски туче Израиља источно од Јордана, сву земљу галадску, од Ароира код реке Арнона до Васана."
      hu: "Azokban a napokban Házael, Szíria királya megveri Izráelt a Jordántól keletre, Gileád egész földjén, az Arnon folyó melletti Aróertől Básánig."
      fi: "Niinä päivinä Syyrian Hasael lyö Israelin Jordanin itäpuolella, koko Gileadin maan, Aroerista Arnon-virran varrelta Basaniin."
      vi: "Trong lúc ấy, Ha-xa-ên của Sy-ri hãm đánh Y-sơ-ra-ên ở phía đông sông Giô-đanh, cả xứ Ga-la-át, từ A-rô-e trên khe Ạt-nôn cho đến Ba-san."
      ro: "În zilele acelea, Hazael al Siriei lovește Israelul la răsărit de Iordan, tot ținutul Galaadului, de la Aroer, lângă râul Arnon, până la Basan."
      bg: "В онези дни Азаил Сирийски поразява Израил на изток от Йордан, цялата земя Галаад, от Ароер при река Арнон до Васан."
