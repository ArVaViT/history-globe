# Jehu, 2 Kings 9-10, in the order of the text, after the Elisha tour. The tour's year
# (841 BC) is the usual date of his accession: in 841 BC he paid tribute to Shalmaneser III
# (the Black Obelisk; see the dated events), and 842 BC is also held. The last stop, Hazael's
# conquests "in those days", falls some years later.
id: jehu
title:
  en: "Jehu"
  ru: "Ииуй"
  uk: "Єгу"
  es: "Jehú"
  pt: "Jeú"
  de: "Jehu"
  fr: "Jéhu"
year: "841 BC"
people: ["Jehu@1Ki.19.16-Hos"]
approximate: true
stops:
  - place: a2fe63c # Ramoth-gilead
    ref: 2Kgs.9.1-2Kgs.9.13
    note:
      en: 'Sent by Elisha, one of the sons of the prophets anoints Jehu king over Israel at Ramoth-gilead, and the captains blow the trumpet: "Jehu is king."'
      ru: "Посланный Елисеем сын пророческий помазывает Ииуя в царя над Израилем в Рамофе Галаадском, и военачальники трубят: «воцарился Ииуй!»"
      uk: "Посланий Єлисеєм, один із синів пророків помазує Єгу на царя над Ізраїлем у Рамоті Гілеадському, і воєначальники сурмлять у сурму: «Егуй став царем!»"
      es: "Enviado por Eliseo, uno de los hijos de los profetas unge a Jehú rey de Israel en Ramot de Galaad, y los capitanes tocan la trompeta: «Jehú es rey»."
      pt: "Enviado por Eliseu, um dos filhos dos profetas unge Jeú rei sobre Israel em Ramote-Gileade, e os comandantes tocam a trombeta: “Jeú é rei!”"
      de: "Von Elisa gesandt, salbt einer der Prophetenjünger Jehu in Ramot in Gilead zum König über Israel, und die Hauptleute stoßen in die Posaune: „Jehu ist König geworden!“"
      fr: "Envoyé par Élisée, l’un des fils des prophètes oint Jéhu roi d’Israël à Ramoth en Galaad, et les chefs sonnent de la trompette : « Jéhu est roi ! »"
  - place: ae0bf4a # Jezreel
    ref: 2Kgs.9.16-2Kgs.9.26
    note:
      en: 'He drives to Jezreel, "for he driveth furiously", and in the portion of Naboth shoots Joram king of Israel through the heart.'
      ru: "Он едет в Изреель, «потому что он идет стремительно», и на поле Навуфея поражает Иорама, царя Израильского, стрелой в сердце."
      uk: "Він їде до Їзреелю, «бо він жене, мов скажений», і на ділянці Навуфея вражає стрілою в серце Йорама, царя Ізраїлю."
      es: "Se dirige a Jezreel, «porque viene impetuosamente», y en la heredad de Nabot atraviesa el corazón de Joram, rey de Israel, con una flecha."
      pt: "Ele vai de carro a Jezreel, “pois ele guia furiosamente”, e na porção de Nabote atravessa com uma flecha o coração de Jorão, rei de Israel."
      de: "Er fährt nach Jesreel, „denn er treibt, wie wenn er unsinnig wäre“, und erschießt auf dem Feldstück Nabots Joram, den König von Israel, mitten ins Herz."
      fr: "Il se rend en char à Jizreel, « car il conduit d’une manière insensée », et dans le champ de Naboth il perce le cœur de Joram, roi d’Israël, d’une flèche."
  - place: a8554e3 # Megiddo
    ref: 2Kgs.9.27-2Kgs.9.28
    note:
      en: "Ahaziah king of Judah flees, is smitten at the going up to Gur, which is by Ibleam, and dies at Megiddo; his servants bury him in Jerusalem."
      ru: "Охозия, царь Иудейский, бежит, ранен на возвышенности Гур, что при Ивлеаме, и умирает в Мегиддоне; слуги хоронят его в Иерусалиме."
      uk: "Охозія, цар Юди, тікає, його вражено на підйомі до Гуру, що біля Івлеаму, і він помирає в Мегіддо; його слуги ховають його в Єрусалимі."
      es: "Ocozías, rey de Judá, huye, es herido en la subida de Gur, junto a Ibleam, y muere en Meguido; sus siervos lo sepultan en Jerusalén."
      pt: "Acazias, rei de Judá, foge, é ferido na subida de Gur, que fica junto a Ibleão, e morre em Megido; seus servos o sepultam em Jerusalém."
      de: "Ahasja, der König von Juda, flieht, wird auf der Anhöhe Gur bei Jibleam geschlagen und stirbt in Megiddo; seine Knechte begraben ihn in Jerusalem."
      fr: "Achazia, roi de Juda, s’enfuit, est frappé à la montée de Gur, près de Jibleam, et meurt à Meguiddo ; ses serviteurs l’ensevelissent à Jérusalem."
  - place: ae0bf4a # Jezreel
    ref: 2Kgs.9.30-2Kgs.9.37
    note:
      en: "At Jezreel Jezebel, painted, looks out of a window; she is thrown down, and of her only the skull, the feet and the palms of her hands are found: the dogs have eaten her, as the Lord had said by Elijah."
      ru: "В Изрееле Иезавель, нарумянив лицо, глядит в окно; её выбрасывают, и от неё находят лишь череп, ноги и кисти рук: псы съели её, по слову Господа через Илию."
      uk: "У Їзреелі Єзавель, нафарбована, виглядає з вікна; її скидають, і від неї знаходять лише череп, ноги та долоні рук: пси з’їли її, як Господь сказав через Іллю."
      es: "En Jezreel Jezabel, maquillada, se asoma a una ventana; es arrojada abajo, y de ella solo se encuentran el cráneo, los pies y las palmas de las manos: los perros la han comido, como había dicho el Señor por medio de Elías."
      pt: "Em Jezreel, Jezabel, pintada, olha de uma janela; é lançada para baixo, e dela se encontram apenas o crânio, os pés e as palmas das mãos: os cães a devoraram, como o Senhor dissera por meio de Elias."
      de: "In Jesreel schaut die geschminkte Isebel aus einem Fenster; sie wird hinabgestürzt, und von ihr findet man nur den Schädel, die Füße und die flachen Hände: Die Hunde haben sie gefressen, wie der Herr durch Elia gesagt hatte."
      fr: "À Jizreel, Jézabel, fardée, regarde par la fenêtre ; elle est précipitée, et on ne retrouve d’elle que le crâne, les pieds et les paumes des mains : les chiens l’ont mangée, comme l’Éternel l’avait dit par Élie."
  - place: a041bb3 # Samaria
    ref: 2Kgs.10.1-2Kgs.10.28
    note:
      en: "The seventy sons of Ahab are slain in Samaria and their heads sent to Jezreel; in Samaria Jehu slays all that remained unto Ahab and destroys Baal out of Israel."
      ru: "Семьдесят сыновей Ахава убиты в Самарии, их головы отосланы в Изреель; в Самарии Ииуй избивает всех, оставшихся у Ахава, и истребляет Ваала с земли Израильской."
      uk: "Сімдесят синів Ахава вбито в Самарії, а їхні голови надіслано до Їзреелю; в Самарії Єгу вбиває всіх, хто залишився в Ахава, і винищує Ваала з Ізраїлю."
      es: "Los setenta hijos de Acab son muertos en Samaria y sus cabezas enviadas a Jezreel; en Samaria Jehú mata a todos los que quedaban de Acab y destruye a Baal de Israel."
      pt: "Os setenta filhos de Acabe são mortos em Samaria e as suas cabeças enviadas a Jezreel; em Samaria Jeú mata todos os que restavam de Acabe e extermina Baal de Israel."
      de: "Die siebzig Söhne Ahabs werden in Samaria erschlagen und ihre Köpfe nach Jesreel gesandt; in Samaria erschlägt Jehu alle, die von Ahab übrig waren, und vertilgt den Baal aus Israel."
      fr: "Les soixante-dix fils d’Achab sont mis à mort à Samarie et leurs têtes envoyées à Jizreel ; à Samarie, Jéhu tue tous ceux qui restaient d’Achab et détruit Baal en Israël."
  - place: ae73b90 # Gilead
    ref: 2Kgs.10.32-2Kgs.10.33
    note:
      en: "In those days Hazael of Syria smites Israel east of the Jordan, all the land of Gilead, from Aroer by the river Arnon to Bashan."
      ru: "В те дни Азаил Сирийский поражает Израиль на восток от Иордана, всю землю Галаад, от Ароера при потоке Арноне до Васана."
      uk: "У ті дні Азаїл Сирійський б’є Ізраїль на схід від Йордану, всю землю Гілеад, від Ароера над рікою Арнон до Башану."
      es: "En aquellos días Hazael de Siria hiere a Israel al este del Jordán, en toda la tierra de Galaad, desde Aroer, junto al río Arnón, hasta Basán."
      pt: "Naqueles dias Hazael, da Síria, fere Israel a leste do Jordão, toda a terra de Gileade, desde Aroer, junto ao rio Arnom, até Basã."
      de: "In jenen Tagen schlägt Hasaël von Syrien Israel östlich des Jordan, das ganze Land Gilead, von Aroër am Fluss Arnon bis nach Baschan."
      fr: "En ces jours-là, Hazaël de Syrie bat Israël à l’orient du Jourdain, tout le pays de Galaad, depuis Aroër sur le torrent de l’Arnon jusqu’à Basan."
