    note:
      en: "At Caesarea she sees the house of Cornelius, now a church, and the humble home of Philip with the rooms of his four daughters who prophesied."
      ru: "В Кесарии она видит дом Корнилия, ставший церковью, и скромное жилище Филиппа с комнатами его четырёх дочерей-пророчиц."
      uk: "У Кесарії вона бачить дім Корнилія, що став тепер церквою, і скромну оселю Пилипа з покоями його чотирьох дочок, що пророкували."
      es: "En Cesarea ve la casa de Cornelio, convertida ahora en iglesia, y la humilde casa de Felipe con las habitaciones de sus cuatro hijas que profetizaban."
      pt: "Em Cesareia ela vê a casa de Cornélio, agora uma igreja, e o humilde lar de Filipe com os quartos de suas quatro filhas que profetizavam."
      de: "In Caesarea sieht sie das Haus des Kornelius, jetzt eine Kirche, und die schlichte Wohnung des Philippus mit den Kammern seiner vier weissagenden Töchter."
      fr: "À Césarée, elle voit la maison de Corneille, devenue une église, et l’humble demeure de Philippe avec les chambres de ses quatre filles qui prophétisaient."
      pl: "W Cezarei ogląda dom Korneliusza, zamieniony teraz w kościół, oraz skromny dom Filipa z pokojami jego czterech córek, które prorokowały."
      it: "A Cesarea vede la casa di Cornelio, ora una chiesa, e l’umile dimora di Filippo con le stanze delle sue quattro figlie che profetizzavano."
      nl: "In Caesarea ziet zij het huis van Cornelius, nu een kerk, en het eenvoudige huis van Filippus met de kamers van zijn vier dochters die profeteerden."
      cs: "V Cesareji vidí dům Kornelia, nyní kostel, a skromný příbytek Filipův s pokoji jeho čtyř dcer, které prorokovaly."
      sv: "I Caesarea ser hon Cornelius’ hus, nu en kyrka, och Filippos’ enkla hem med rummen åt hans fyra döttrar som profeterade."
      nb: "I Cæsarea ser hun Kornelius' hus, nå en kirke, og Filips beskjedne bolig med rommene til hans fire døtre som profeterte."
      tl: "Sa Cesarea ay nakikita niya ang bahay ni Cornelio, na ngayon ay isang simbahan, at ang abang tahanan ni Felipe kasama ang mga silid ng kaniyang apat na anak na babae na nanghula."
      da: "I Cæsarea ser hun Kornelius' hus, nu en kirke, og Filips ydmyge hjem med værelserne til hans fire døtre, som profeterede."
      sr: "У Цезареји види Корнилијеву кућу, сада цркву, и скромни Филипов дом са собама четири његове кћери које су пророковале."
      hu: "Cézáreában megnézi Kornélius házát, amely immár templom, és Fülöp szerény otthonát négy prófétáló leányának szobáival."
      fi: "Kesareassa hän näkee Korneliuksen talon, josta on tullut kirkko, sekä Filippoksen vaatimattoman kodin ja hänen neljän profetoineen tyttärensä huoneet."
      vi: "Ở Sê-sa-rê, bà thấy nhà của Cọt-nây, nay là một nhà thờ, và căn nhà khiêm tốn của Phi-líp cùng các phòng của bốn người con gái nói tiên tri của ông."
      ro: "La Cezareea vede casa lui Corneliu, acum biserică, și modesta locuință a lui Filip, cu odăile celor patru fiice ale lui care prooroceau."
      bg: "В Кесария вижда къщата на Корнилий, сега църква, и скромния дом на Филип със стаите на четирите му дъщери, които пророкували."
