        bg: "Йероним, Писмо 108.9"
      url: "https://www.newadvent.org/fathers/3001108.htm"
    note:
      en: "She turns down the proconsul's residence for a humble cell. Before the Cross she falls down in worship, and in the tomb she kisses the stone the angel rolled away."
      ru: "От резиденции проконсула она отказывается ради скромной кельи. Перед Крестом она падает ниц, а в гробнице целует камень, отваленный ангелом."
      uk: "Вона відмовляється від резиденції проконсула заради скромної келії. Перед Хрестом вона падає ниць у поклоні, а в гробі цілує камінь, який відкотив ангел."
      es: "Rechaza la residencia del procónsul por una celda humilde. Ante la Cruz se postra en adoración, y en el sepulcro besa la piedra que el ángel removió."
      pt: "Recusa a residência do procônsul e prefere uma cela humilde. Diante da Cruz prostra-se em adoração e, no sepulcro, beija a pedra que o anjo removeu."
      de: "Die Residenz des Prokonsuls lehnt sie ab und wählt eine schlichte Zelle. Vor dem Kreuz wirft sie sich anbetend nieder, und im Grab küsst sie den Stein, den der Engel weggewälzt hat."
      fr: "Elle refuse la résidence du proconsul pour une humble cellule. Devant la Croix, elle se prosterne en adoration, et dans le tombeau elle baise la pierre que l’ange avait roulée."
      pl: "Odrzuca rezydencję prokonsula na rzecz skromnej celi. Przed Krzyżem pada na twarz w uwielbieniu, a w grobie całuje kamień, który odtoczył anioł."
      it: "Rifiuta la residenza del proconsole per un’umile cella. Davanti alla Croce si prostra in adorazione, e nel sepolcro bacia la pietra che l’angelo rotolò via."
      nl: "Zij wijst de residentie van de proconsul af en kiest een eenvoudige cel. Voor het Kruis valt zij neer in aanbidding, en in het graf kust zij de steen die de engel had weggerold."
      cs: "Odmítá sídlo prokonzula a volí skromnou celu. Před Křížem padá k zemi v pokloně a v hrobě líbá kámen, který odvalil anděl."
      sv: "Hon avböjer prokonsulns residens och väljer en enkel cell. Inför korset faller hon ner i tillbedjan, och i graven kysser hon stenen som ängeln rullade bort."
      nb: "Hun avslår prokonsulens residens til fordel for en enkel celle. Foran korset faller hun ned i tilbedelse, og i graven kysser hun steinen som engelen rullet bort."
      tl: "Tinatanggihan niya ang tirahan ng prokonsul para sa isang abang selda. Sa harap ng Krus ay nagpapatirapa siya sa pagsamba, at sa libingan ay hinahalikan niya ang batong iginulong ng anghel."
      da: "Hun afslår prokonsulens bolig til fordel for en ydmyg celle. Foran korset falder hun ned i tilbedelse, og i graven kysser hun den sten, som engelen væltede bort."
      sr: "Одбија проконзулову резиденцију и бира скромну ћелију. Пред Крстом пада ничице и поклања се, а у гробу целива камен који је анђео одвалио."
      hu: "Nem fogadja el a prokonzul palotáját, hanem szerény cellát választ. A Kereszt előtt leborulva imádkozik, a sírban pedig megcsókolja a követ, amelyet az angyal elhengerített."
      fi: "Hän hylkää prokonsulin asunnon ja valitsee vaatimattoman kammion. Ristin edessä hän lankeaa palvomaan, ja haudassa hän suutelee kiveä, jonka enkeli vieritti pois."
      vi: "Bà từ chối dinh của quan trấn thủ để ở trong một căn phòng nhỏ khiêm tốn. Trước Thập tự giá bà sấp mình thờ lạy, và trong mộ bà hôn tảng đá mà thiên sứ đã lăn đi."
      ro: "Refuză reședința proconsulului și alege o chilie modestă. Înaintea Crucii cade la pământ și se închină, iar în mormânt sărută piatra pe care o prăvălise îngerul."
      bg: "Отказва резиденцията на проконсула и избира скромна килия. Пред Кръста пада и се покланя, а в гроба целува камъка, който ангелът е отвалил."
