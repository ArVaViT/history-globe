    note:
      en: "Stopping on the way at Rachel's tomb, she enters the cave where the Saviour was born, and tells Jerome she can see, with the eyes of faith, the infant Lord in the manger."
      ru: "По дороге задержавшись у гробницы Рахили, она входит в пещеру, где родился Спаситель, и говорит Иерониму, что очами веры видит Младенца-Господа в яслях."
      uk: "Зупинившись дорогою біля гробниці Рахілі, вона входить до печери, де народився Спаситель, і каже Єронімові, що бачить очима віри Господа-немовля в яслах."
      es: "Deteniéndose en el camino ante la tumba de Raquel, entra en la cueva donde nació el Salvador, y dice a Jerónimo que ve, con los ojos de la fe, al Señor niño en el pesebre."
      pt: "Parando no caminho junto ao túmulo de Raquel, entra na gruta onde nasceu o Salvador e diz a Jerônimo que vê, com os olhos da fé, o Senhor menino na manjedoura."
      de: "Auf dem Weg hält sie am Grab der Rahel an, betritt dann die Höhle, in der der Erlöser geboren wurde, und sagt Hieronymus, sie sehe mit den Augen des Glaubens den Herrn als Kind in der Krippe."
      fr: "S’arrêtant en chemin au tombeau de Rachel, elle entre dans la grotte où naquit le Sauveur, et dit à Jérôme qu’elle voit, des yeux de la foi, le Seigneur enfant dans la crèche."
      pl: "Zatrzymawszy się w drodze przy grobie Racheli, wchodzi do jaskini, w której narodził się Zbawiciel, i mówi Hieronimowi, że oczami wiary widzi Pana jako Dzieciątko w żłobie."
      it: "Sostando lungo la strada alla tomba di Rachele, entra nella grotta dove nacque il Salvatore, e dice a Girolamo di vedere, con gli occhi della fede, il Signore bambino nella mangiatoia."
      nl: "Onderweg houdt zij halt bij het graf van Rachel; dan betreedt zij de grot waar de Heiland werd geboren, en zegt tegen Hiëronymus dat zij met de ogen van het geloof de Heer als kind in de kribbe ziet."
      cs: "Cestou se zastavuje u Ráchelina hrobu, vchází do jeskyně, kde se narodil Spasitel, a říká Jeronýmovi, že očima víry vidí v jeslích nemluvně Pána."
      sv: "På vägen stannar hon vid Rakels grav, går in i grottan där Frälsaren föddes och säger till Hieronymus att hon med trons ögon kan se den späde Herren i krubban."
      nb: "Etter å ha stanset underveis ved Rakels grav går hun inn i hulen der Frelseren ble født, og forteller Hieronymus at hun med troens øyne kan se Herren som spedbarn i krybben."
      tl: "Humihinto sa daan sa libingan ni Raquel, pumapasok siya sa yungib kung saan ipinanganak ang Tagapagligtas, at sinasabi kay Jerome na nakikita niya, sa mga mata ng pananampalataya, ang sanggol na Panginoon sa sabsaban."
      da: "Undervejs gør hun holdt ved Rakels grav; hun går ind i hulen, hvor Frelseren blev født, og fortæller Hieronymus, at hun med troens øjne kan se Herren som spædbarn i krybben."
      sr: "Успут застаје код Рахиљиног гроба, улази у пећину у којој се родио Спаситељ и каже Јерониму да очима вере види Младенца Господа у јаслама."
      hu: "Útközben megáll Ráhel sírjánál, belép a barlangba, ahol az Üdvözítő született, és elmondja Jeromosnak, hogy a hit szemével látja a jászolban a csecsemő Urat."
      fi: "Pysähdyttyään matkalla Raakelin haudalle hän astuu luolaan, jossa Vapahtaja syntyi, ja kertoo Hieronymukselle näkevänsä uskon silmin Herran lapsena seimessä."
      vi: "Trên đường, sau khi dừng lại ở mộ Ra-chên, bà vào hang nơi Đấng Cứu Thế giáng sinh, và nói với Jerome rằng bằng mắt đức tin bà thấy Chúa Hài Đồng nằm trong máng cỏ."
      ro: "Oprindu-se pe drum la mormântul Rahelei, intră în peștera în care S-a născut Mântuitorul și îi spune lui Ieronim că Îl vede, cu ochii credinței, pe Pruncul Domn în iesle."
      bg: "Спирайки по пътя при гроба на Рахил, влиза в пещерата, където се е родил Спасителят, и казва на Йероним, че с очите на вярата вижда младенеца Господ в яслите."
