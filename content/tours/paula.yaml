    note:
      en: "Hebron is Kirjath-arba, the city of the four men: Abraham, Isaac and Jacob, and as the Jews hold, Adam; many think the fourth is Caleb."
      ru: "Хеврон — это Кириаф-Арба, город четырёх мужей: Авраама, Исаака и Иакова, а по мнению евреев, ещё Адама; многие же считают четвёртым Халева."
      uk: "Хеврон — це Кіріят-Арба, місто чотирьох мужів: Авраама, Ісаака й Якова та, як вважають юдеї, Адама; багато хто думає, що четвертий — Калеб."
      es: "Hebrón es Quiriat-arba, la ciudad de los cuatro hombres: Abraham, Isaac y Jacob, y, según sostienen los judíos, Adán; muchos piensan que el cuarto es Caleb."
      pt: "Hebrom é Quiriate-Arba, a cidade dos quatro homens: Abraão, Isaque e Jacó e, segundo os judeus, Adão; muitos pensam que o quarto é Calebe."
      de: "Hebron ist Kirjat-Arba, die Stadt der vier Männer: Abraham, Isaak und Jakob und, wie die Juden meinen, Adam; viele halten den vierten für Kaleb."
      fr: "Hébron est Kirjath-Arba, la ville des quatre hommes : Abraham, Isaac et Jacob et, selon les Juifs, Adam ; beaucoup pensent que le quatrième est Caleb."
      pl: "Hebron to Kiriat-Arba, miasto czterech mężów: Abrahama, Izaaka i Jakuba oraz, jak twierdzą Żydzi, Adama; wielu uważa, że czwartym jest Kaleb."
      it: "Ebron è Kiriat-Arba, la città dei quattro uomini: Abramo, Isacco e Giacobbe, e, come ritengono i Giudei, Adamo; molti pensano che il quarto sia Caleb."
      nl: "Hebron is Kirjat-Arba, de stad van de vier mannen: Abraham, Isaak en Jakob, en zoals de Joden menen, Adam; velen denken dat de vierde Kaleb is."
      cs: "Hebron je Kirjat-arba, město čtyř mužů: Abrahama, Izáka a Jákoba a podle Židů Adama; mnozí soudí, že čtvrtým je Kaleb."
      sv: "Hebron är Kirjat-Arba, de fyra männens stad: Abraham, Isak och Jakob, och, som judarna menar, Adam; många tror att den fjärde är Kalev."
      nb: "Hebron er Kirjat-Arba, de fire mennenes by: Abraham, Isak og Jakob, og ifølge jødene også Adam; mange mener den fjerde er Kaleb."
      tl: "Ang Hebron ay Kiriath-arba, ang lungsod ng apat na lalaki: sina Abraham, Isaac at Jacob, at, ayon sa pananaw ng mga Judio, si Adan; marami ang nag-aakalang ang ikaapat ay si Caleb."
      da: "Hebron er Kirjat-Arba, de fire mænds by: Abraham, Isak og Jakob og, som jøderne mener, Adam; mange tror, at den fjerde er Kaleb."
      sr: "Хеврон је Киријат-Арва, град четворице: Авраама, Исака и Јакова и, како држе Јевреји, Адама; многи мисле да је четврти Калев."
      hu: "Hebron Kirjat-Arba, a négy férfi városa: Ábrahámé, Izsáké és Jákóbé, és ahogy a zsidók tartják, Ádámé; sokan azt gondolják, hogy a negyedik Káleb."
      fi: "Hebron on Kirjat-Arba, neljän miehen kaupunki: Abrahamin, Iisakin ja Jaakobin sekä, kuten juutalaiset katsovat, Aadamin; monien mielestä neljäs on Kaleb."
      vi: "Hếp-rôn là Ki-ri-át-A-ra-ba, thành của bốn người: Áp-ra-ham, Y-sác và Gia-cốp, và, theo người Do Thái, cả A-đam; nhiều người cho rằng người thứ tư là Ca-lép."
      ro: "Hebronul este Chiriat-Arba, cetatea celor patru bărbați: Avraam, Isaac și Iacov și, după cum susțin iudeii, Adam; mulți socotesc că al patrulea este Caleb."
      bg: "Хеврон е Кириат-Арба, градът на четиримата мъже: Авраам, Исаак и Яков и, както смятат юдеите, Адам; мнозина мислят, че четвъртият е Халев."
