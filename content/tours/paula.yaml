    note:
      en: "In Cyprus Epiphanius keeps her ten days, and she visits every monastery on the island, leaving what relief her means allow."
      ru: "На Кипре Епифаний задерживает её на десять дней, и она обходит все монастыри острова, оставляя братиям помощь, сколько позволяют средства."
      uk: "На Кіпрі Єпіфаній затримує її в себе на десять днів, і вона відвідує кожен монастир на острові, залишаючи стільки допомоги, скільки дозволяють її статки."
      es: "En Chipre Epifanio la retiene diez días, y ella visita todos los monasterios de la isla, dejando el socorro que sus medios permiten."
      pt: "Em Chipre, Epifânio a retém por dez dias, e ela visita todos os mosteiros da ilha, deixando o auxílio que os seus recursos permitem."
      de: "Auf Zypern hält Epiphanius sie zehn Tage bei sich, und sie besucht jedes Kloster der Insel und hinterlässt überall so viel Unterstützung, wie ihre Mittel erlauben."
      fr: "À Chypre, Épiphane la retient dix jours, et elle visite tous les monastères de l’île, y laissant autant de secours que ses moyens le permettent."
      pl: "Na Cyprze Epifaniusz zatrzymuje ją na dziesięć dni, a ona odwiedza każdy klasztor na wyspie, zostawiając tyle wsparcia, ile pozwalają jej środki."
      it: "A Cipro Epifanio la trattiene dieci giorni, ed ella visita tutti i monasteri dell’isola, lasciando i soccorsi che i suoi mezzi permettono."
      nl: "Op Cyprus houdt Epifanius haar tien dagen bij zich, en zij bezoekt elk klooster op het eiland en laat overal zoveel steun achter als haar middelen toelaten."
      cs: "Na Kypru ji Epifanios zdrží deset dní a ona navštěvuje všechny kláštery na ostrově a zanechává jim podporu, jak jí to dovolují prostředky."
      sv: "På Cypern håller Epifanios kvar henne i tio dagar, och hon besöker varje kloster på ön och lämnar den hjälp hennes tillgångar medger."
      nb: "På Kypros holder Epifanios henne hos seg i ti dager, og hun besøker hvert eneste kloster på øya og etterlater den hjelp hennes midler tillater."
      tl: "Sa Chipre ay pinananatili siya ni Epifanio nang sampung araw, at dinadalaw niya ang bawat monasteryo sa pulo, na iniiwan ang tulong na pinahihintulutan ng kaniyang kakayahan."
      da: "På Cypern holder Epifanios hende hos sig i ti dage, og hun besøger hvert eneste kloster på øen og efterlader den hjælp, hendes midler tillader."
      sr: "На Кипру је Епифаније задржава десет дана, а она обилази сваки манастир на острву и оставља помоћ колико јој средства допуштају."
      hu: "Cipruson Epiphaniosz tíz napig vendégül látja, ő pedig meglátogatja a sziget minden kolostorát, és amennyit módja enged, segítséget hagy ott."
      fi: "Kyproksella Epifanios pidättää hänet luonaan kymmenen päivää, ja hän käy jokaisessa saaren luostarissa ja jättää niihin niin paljon apua kuin hänen varansa sallivat."
      vi: "Ở Chíp-rơ, Epiphanius giữ bà lại mười ngày, và bà thăm mọi tu viện trên đảo, để lại sự trợ giúp tùy theo khả năng của mình."
      ro: "În Cipru, Epifanie o ține zece zile, iar ea vizitează fiecare mănăstire din insulă, lăsând ajutorul pe care i-l îngăduie mijloacele."
      bg: "В Кипър Епифаний я задържа десет дни и тя посещава всеки манастир на острова, оставяйки помощ, колкото позволяват средствата ѝ."
