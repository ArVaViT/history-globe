# Paula's pilgrimage, Rome to Bethlehem by way of the holy places and Egypt, as Jerome,
# who went with her, tells it in his letter on her death (Letter 108, AD 404). She sailed
# in 385 and settled at Bethlehem in 386: the years are approximate.
# Jerome names "only such places as are mentioned in the sacred books"; the stops are a
# few of them, in his order. Each stop links the free translation of the Nicene and
# Post-Nicene Fathers (public domain) at New Advent; its page holds the whole letter, and
# the cite gives the section. Nitria, where the monks met her, is not on the map: that stop
# stands at Alexandria, on the way Jerome describes. At Zarephath the Latin has Elijah's
# "turricula", a little tower (the Russian translation and the Oxford Cult of Saints
# database, E06476, read it so); the free English translation's "Elijah's town" misreads it.
id: paula
