    note:
      en: "Past Berytus and Sidon, on the shore at Zarephath, she enters the little tower of Elijah and worships there."
      ru: "Миновав Берит и Сидон, она входит на берегу в Сарепте в башенку Илии и молится там."
      uk: "Минувши Берит і Сідон, на березі в Сарепті вона входить до вежечки Іллі й молиться там."
      es: "Pasadas Berito y Sidón, en la costa de Sarepta, entra en la pequeña torre de Elías y adora allí."
      pt: "Passados Berito e Sidom, na praia de Sarepta, ela entra na pequena torre de Elias e ali adora a Deus."
      de: "Vorbei an Berytus und Sidon betritt sie am Ufer bei Sarepta das Türmchen des Elia und betet dort an."
      fr: "Après Béryte et Sidon, sur le rivage, à Sarepta, elle entre dans la petite tour d’Élie et s’y recueille en adoration."
      pl: "Minąwszy Berytos i Sydon, na brzegu w Sarepcie wchodzi do małej wieży Eliasza i modli się tam."
      it: "Oltre Berito e Sidone, sulla riva a Sarepta, entra nella piccola torre di Elia e vi si raccoglie in adorazione."
      nl: "Voorbij Berytus en Sidon, aan de kust bij Sarefat, betreedt zij het torentje van Elia en aanbidt daar."
      cs: "Za Bérytem a Sidónem vchází na břehu v Sareptě do Eliášovy věžičky a klaní se tam."
      sv: "Förbi Beryt och Sidon, på stranden vid Sarefat, går hon in i Elias lilla torn och tillber där."
      nb: "Forbi Berytos og Sidon, på kysten ved Sarepta, går hun inn i Elias lille tårn og tilber der."
      tl: "Lampas sa Berytus at Sidon, sa baybayin ng Sarepta, pumapasok siya sa munting tore ni Elias at sumasamba roon."
      da: "Forbi Berytus og Sidon, på kysten ved Sarepta, går hun ind i Elias' lille tårn og tilbeder dér."
      sr: "Прошавши Берит и Сидон, на обали код Сарепте улази у малу Илијину кулу и ту се поклања Богу."
      hu: "Berytuson és Szidónon túl, a sareptai parton belép Illés kis tornyába, és ott leborulva imádkozik."
      fi: "Berytoksen ja Sidonin ohi, Sareptan rannalla, hän astuu Elian pieneen torniin ja palvoo siellä."
      vi: "Qua Berytus và Si-đôn, trên bờ biển ở Sa-rép-ta, bà vào ngôi tháp nhỏ của Ê-li và thờ phượng tại đó."
      ro: "Trecând de Berit și de Sidon, pe țărmul de la Sarepta, intră în turnulețul lui Ilie și se închină acolo."
      bg: "Покрай Берит и Сидон, на брега при Сарепта, тя влиза в малката кула на Илия и се покланя там."
