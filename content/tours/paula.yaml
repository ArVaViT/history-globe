    note:
      en: "Paula, a Roman noblewoman, meets Paulinus of Antioch and Epiphanius of Salamis when the bishops come to Rome. Later she leaves her house and children and sails from Portus for the East."
      ru: "Павла, знатная римлянка, встречает Павлина Антиохийского и Епифания Саламинского, когда епископы приезжают в Рим. Позже она оставляет дом и детей и отплывает из Порта на Восток."
      uk: "Павла, знатна римлянка, зустрічає Павлина Антіохійського та Єпіфанія Саламінського, коли ці єпископи приїжджають до Рима. Згодом вона залишає дім і дітей і випливає з Портуса на Схід."
      es: "Paula, noble romana, conoce a Paulino de Antioquía y a Epifanio de Salamina cuando los obispos vienen a Roma. Más tarde deja su casa y a sus hijos y zarpa de Portus hacia Oriente."
      pt: "Paula, nobre romana, conhece Paulino de Antioquia e Epifânio de Salamina quando os bispos vêm a Roma. Mais tarde deixa a sua casa e os filhos e parte de navio de Portus, o porto de Roma, rumo ao Oriente."
      de: "Paula, eine römische Adlige, begegnet Paulinus von Antiochia und Epiphanius von Salamis, als die Bischöfe nach Rom kommen. Später verlässt sie ihr Haus und ihre Kinder und segelt von Portus in den Osten."
      fr: "Paula, noble Romaine, rencontre Paulin d’Antioche et Épiphane de Salamine lorsque les évêques viennent à Rome. Plus tard, elle quitte sa maison et ses enfants et s’embarque à Portus pour l’Orient."
      pl: "Paula, rzymska arystokratka, spotyka Paulina z Antiochii i Epifaniusza z Salaminy, gdy biskupi przybywają do Rzymu. Później opuszcza swój dom i dzieci i wypływa z Portus na Wschód."
      it: "Paola, nobildonna romana, incontra Paolino di Antiochia ed Epifanio di Salamina quando i vescovi vengono a Roma. Più tardi lascia la sua casa e i suoi figli e salpa da Porto verso l’Oriente."
      nl: "Paula, een Romeinse edelvrouw, ontmoet Paulinus van Antiochië en Epifanius van Salamis wanneer de bisschoppen naar Rome komen. Later verlaat zij haar huis en kinderen en vaart vanuit Portus naar het Oosten."
      cs: "Paula, římská šlechtična, se setkává s Paulinem Antiochijským a Epifaniem ze Salamis, když biskupové přijedou do Říma. Později opouští dům i děti a z přístavu Portus odplouvá na Východ."
      sv: "Paula, en romersk adelskvinna, möter Paulinus av Antiochia och Epifanios av Salamis när biskoparna kommer till Rom. Senare lämnar hon sitt hus och sina barn och seglar från Portus mot Östern."
      nb: "Paula, en romersk adelskvinne, møter Paulinus av Antiokia og Epifanios av Salamis da biskopene kommer til Roma. Senere forlater hun huset og barna sine og seiler fra Portus mot øst."
      tl: "Nakikilala ni Paula, isang marangal na babaing Romano, sina Paulino ng Antioquia at Epifanio ng Salamina nang dumating ang mga obispo sa Roma. Kalaunan ay iniiwan niya ang kaniyang bahay at mga anak at naglalayag mula sa Portus patungong Silangan."
      da: "Paula, en romersk adelskvinde, møder Paulinus af Antiokia og Epifanios af Salamis, da biskopperne kommer til Rom. Senere forlader hun sit hus og sine børn og sejler fra Portus mod Østen."
      sr: "Павла, римска племкиња, упознаје Павлина Антиохијског и Епифанија Саламинског када ти епископи долазе у Рим. Касније напушта кућу и децу и из Портуса отплови на Исток."
      hu: "Paula, a római nemesasszony, találkozik az antiókhiai Paulinusszal és a szalamiszi Epiphaniosszal, amikor a püspökök Rómába jönnek. Később elhagyja házát és gyermekeit, és Portusból hajóval indul Kelet felé."
      fi: "Paula, roomalainen aatelisnainen, tapaa Antiokian Paulinuksen ja Salamiin Epifanioksen, kun piispat saapuvat Roomaan. Myöhemmin hän jättää talonsa ja lapsensa ja purjehtii Portuksesta itään."
      vi: "Paula, một phụ nữ quý tộc Rô-ma, gặp Paulinus thành An-ti-ốt và Epiphanius thành Salamis khi các giám mục đến Rô-ma. Sau đó bà rời nhà và các con, xuống tàu từ Portus đi về phương đông."
      ro: "Paula, o nobilă romană, îi întâlnește pe Paulin al Antiohiei și pe Epifanie al Salaminei când episcopii vin la Roma. Mai târziu își părăsește casa și copiii și pornește cu corabia din Portus spre Răsărit."
      bg: "Павла, римска благородница, се среща с Павлин Антиохийски и Епифаний Саламински, когато епископите идват в Рим. По-късно оставя къщата и децата си и отплава от Портус за Изтока."
