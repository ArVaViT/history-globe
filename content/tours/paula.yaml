    note:
      en: "From the Mount of Olives, the tomb of Lazarus and Bethphage she goes straight down the hill to Jericho, thinking of the wounded man and the Samaritan who brought him to the inn."
      ru: "С Елеонской горы, от гробницы Лазаря и из Виффагии она спускается прямо в Иерихон, думая об израненном человеке и о самарянине, который довёз его до гостиницы."
      uk: "З Оливної гори, від гробниці Лазаря й Віфагії вона спускається просто з гори вниз до Єрихону, думаючи про пораненого й самарянина, який привіз його до гостиниці."
      es: "Desde el Monte de los Olivos, el sepulcro de Lázaro y Betfagé, baja derecho por la colina hasta Jericó, pensando en el hombre herido y en el samaritano que lo llevó a la posada."
      pt: "Do Monte das Oliveiras, do túmulo de Lázaro e de Betfagé ela desce direto pela encosta até Jericó, pensando no homem ferido e no samaritano que o levou à hospedaria."
      de: "Vom Ölberg, vom Grab des Lazarus und von Betfage geht sie geradewegs den Hügel hinab nach Jericho und denkt an den Verwundeten und den Samariter, der ihn zur Herberge brachte."
      fr: "Du Mont des Oliviers, du tombeau de Lazare et de Bethphagé, elle descend tout droit la colline vers Jéricho, pensant à l’homme blessé et au Samaritain qui le conduisit à l’auberge."
      pl: "Z Góry Oliwnej, od grobu Łazarza i z Betfage schodzi prosto w dół do Jerycha, myśląc o rannym człowieku i o Samarytaninie, który zaprowadził go do gospody."
      it: "Dal monte degli Ulivi, dalla tomba di Lazzaro e da Betfage scende direttamente il pendio verso Gerico, pensando all’uomo ferito e al Samaritano che lo portò alla locanda."
      nl: "Vanaf de Olijfberg, het graf van Lazarus en Bethfage gaat zij recht de heuvel af naar Jericho, denkend aan de gewonde man en de Samaritaan die hem naar de herberg bracht."
      cs: "Z Olivové hory, od hrobu Lazarova a z Betfage jde přímo dolů z kopce do Jericha a myslí na raněného muže a Samaritána, který ho přivedl do hostince."
      sv: "Från Olivberget, Lasaros’ grav och Betfage går hon rakt nedför höjden till Jeriko, medan hon tänker på den sårade mannen och samariern som förde honom till värdshuset."
      nb: "Fra Oljeberget, Lasarus' grav og Betfage går hun rett ned åsen til Jeriko, mens hun tenker på den sårede mannen og samaritaneren som førte ham til herberget."
      tl: "Mula sa Bundok ng mga Olibo, sa libingan ni Lazaro at sa Betfage ay dumidiretso siya pababa ng burol patungong Jerico, na iniisip ang sugatang lalaki at ang Samaritano na nagdala sa kaniya sa bahay-tuluyan."
      da: "Fra Oliebjerget, Lazarus' grav og Betfage går hun lige ned ad bakken til Jeriko og tænker på den sårede mand og samaritaneren, som bragte ham til herberget."
      sr: "Са Маслинске горе, од Лазаревог гроба и Витфаге, силази право низ брдо у Јерихон, мислећи на рањеног човека и Самарјанина који га је довео у гостионицу."
      hu: "Az Olajfák hegyéről, Lázár sírjától és Betfagétől egyenesen lemegy a hegyről Jerikóba, a megsebesült emberre és a szamaritánusra gondolva, aki a fogadóba vitte."
      fi: "Öljymäeltä, Lasaruksen haudalta ja Betfagesta hän laskeutuu suoraan rinnettä alas Jerikoon ajatellen haavoitettua miestä ja samarialaista, joka vei hänet majataloon."
      vi: "Từ núi Ô-li-ve, mộ La-xa-rơ và Bê-pha-giê, bà đi thẳng xuống đồi đến Giê-ri-cô, nghĩ đến người bị thương và người Sa-ma-ri đã đưa người ấy đến quán trọ."
      ro: "De pe Muntele Măslinilor, de la mormântul lui Lazăr și de la Betfage coboară drept la vale spre Ierihon, gândindu-se la omul rănit și la samariteanul care l-a dus la han."
      bg: "От Елеонския хълм, гроба на Лазар и Витфагия тя слиза направо по хълма към Йерихон, мислейки за ранения човек и за самарянина, който го завел в гостилницата."
