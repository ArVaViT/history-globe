      en: "In the hill country of Ephraim she visits the tombs of Joshua at Timnath-serah and of Eleazar; at Shiloh, Jerome writes, a ruined altar is still shown."
      ru: "В горах Ефремовых она посещает гробницы Иисуса Навина в Фамнаф-Сараи и Елеазара; а в Силоме, пишет Иероним, до сих пор показывают разрушенный жертвенник."
      uk: "На горі Єфремовій вона відвідує гробниці Ісуса Навина у Тімнат-Сераху та Елеазара; у Шіло, пише Єронім, ще й досі показують зруйнований жертовник."
      es: "En la montaña de Efraín visita los sepulcros de Josué en Timnat-sera y de Eleazar; en Silo, escribe Jerónimo, todavía se muestra un altar en ruinas."
      pt: "Na região montanhosa de Efraim ela visita os túmulos de Josué, em Timnate-Sera, e de Eleazar; em Siló, escreve Jerônimo, ainda se mostra um altar em ruínas."
      de: "Im Gebirge Ephraim besucht sie die Gräber Josuas in Timnat-Serach und Eleasars; in Silo, schreibt Hieronymus, zeigt man noch einen zerstörten Altar."
      fr: "Dans la montagne d’Éphraïm, elle visite les tombeaux de Josué à Thimnath-Sérach et d’Éléazar ; à Silo, écrit Jérôme, on montre encore un autel en ruine."
      pl: "W górach Efraima odwiedza groby Jozuego w Timnat-Serach oraz Eleazara; w Szilo, pisze Hieronim, pokazuje się jeszcze zrujnowany ołtarz."
      it: "Nella regione montuosa di Efraim visita le tombe di Giosuè a Timnat-Serach e di Eleazaro; a Silo, scrive Girolamo, si mostra ancora un altare in rovina."
      nl: "In het bergland van Efraïm bezoekt zij de graven van Jozua in Timnat-Serach en van Eleazar; in Silo, schrijft Hiëronymus, wordt nog een verwoest altaar getoond."
      cs: "V pohoří Efrajimském navštěvuje hroby Jozuův v Timnat-serachu a Eleazarův; v Šílu, píše Jeroným, se dosud ukazuje zbořený oltář."
      sv: "I Efraims bergsbygd besöker hon Josuas grav i Timnat-Serach och Eleasars; i Shilo, skriver Hieronymus, visas ännu ett förstört altare."
      nb: "I Efraims fjell besøker hun gravene til Josva i Timnat-Serah og til Eleasar; i Sjilo, skriver Hieronymus, vises det fortsatt et ødelagt alter."
      tl: "Sa maburol na lupain ng Ephraim ay dinadalaw niya ang mga libingan ni Josue sa Timnath-sera at ni Eleazar; sa Shiloh, ayon kay Jerome, may ipinakikita pang wasak na dambana."
      da: "I Efraims bjergland besøger hun Josvas grav i Timnat-Sera og Eleazars grav; i Silo, skriver Hieronymus, vises endnu et ødelagt alter."
      sr: "У гори Јефремовој посећује гробове Исуса Навина у Тамнат-Сараху и Елеазара; у Силому се, пише Јероним, још показује порушени жртвеник."
      hu: "Efraim hegyvidékén meglátogatja Józsué sírját Timnat-Szerahban és Eleázárét; Silóban, írja Jeromos, még mutatnak egy romos oltárt."
      fi: "Efraimin vuoristossa hän käy Joosuan haudalla Timnat-Serahissa ja Eleasarin haudalla; Silossa, kirjoittaa Hieronymus, näytetään yhä tuhoutunutta alttaria."
      vi: "Trong vùng đồi núi Ép-ra-im, bà viếng mộ Giô-suê ở Thim-nát-Sê-rách và mộ Ê-lê-a-sa; tại Si-lô, Jerome viết, người ta vẫn còn chỉ cho xem một bàn thờ đổ nát."
      ro: "În muntele lui Efraim vizitează mormântul lui Iosua de la Timnat-Serah și pe cel al lui Eleazar; la Silo, scrie Ieronim, se arată și acum un altar dărâmat."
      bg: "В хълмистата земя на Ефрем посещава гробовете на Иисус Навин в Тамнат-сарах и на Елеазар; в Силом, пише Йероним, още показват разрушен жертвеник."
  - place: aee7248 # Alexandria
    year: "AD 386"
    source:
      cite:
        en: "Jerome, Letter 108.14"
        ru: "Иероним, Письмо 108.14"
        uk: "Єронім, Лист 108.14"
        es: "Jerónimo, Carta 108.14"
        pt: "Jerônimo, Carta 108.14"
        de: "Hieronymus, Brief 108.14"
        fr: "Jérôme, Lettre 108.14"
        pl: "Hieronim, List 108.14"
        it: "Girolamo, Lettera 108.14"
        nl: "Hiëronymus, Brief 108.14"
        cs: "Jeroným, List 108.14"
        sv: "Hieronymus, Brev 108.14"
        nb: "Hieronymus, Brev 108.14"
        tl: "Jerome, Liham 108.14"
        da: "Hieronymus, Brev 108.14"
        sr: "Јероним, Писмо 108.14"
        hu: "Jeromos, Levelek 108.14"
        fi: "Hieronymus, Kirje 108.14"
        vi: "Jerome, Thư 108.14"
        ro: "Ieronim, Scrisoarea 108.14"
        bg: "Йероним, Писмо 108.14"
      url: "https://www.newadvent.org/fathers/3001108.htm"
    note:
      en: "Jerome's route runs by No, «which has since become Alexandria», to Nitria, where the confessor bishop Isidore and countless monks come out to meet her. She would have stayed among them, but the holy places draw her back."
      ru: "Путь, как его описывает Иероним, идёт через «город Но, ставший Александрией», в Нитрию, где навстречу ей выходят епископ-исповедник Исидор и бесчисленные монахи. Она осталась бы среди них, но её влекут обратно святые места."
      uk: "Шлях, як його описує Єронім, пролягає повз Но, «що відтоді стало Александрією», до Нітрії, де назустріч Павлі виходять єпископ-сповідник Ісидор і незліченні ченці. Вона залишилася б серед них, але святі місця кличуть її назад."
      es: "La ruta de Jerónimo pasa por No, «que luego se convirtió en Alejandría», hasta Nitria, donde el obispo confesor Isidoro y monjes sin número salen a recibirla. Se habría quedado entre ellos, pero los santos lugares la atraen de nuevo."
      pt: "A rota de Jerônimo passa por No, “que depois veio a ser Alexandria”, até a Nítria, onde o bispo confessor Isidoro e incontáveis monges saem ao seu encontro. Ela teria ficado entre eles, mas os lugares santos a chamam de volta."
      de: "Die Route bei Hieronymus führt über No, „das später zu Alexandria geworden ist“, nach Nitria, wo ihr der Bischof und Bekenner Isidor und unzählige Mönche entgegenkommen. Sie wäre gern unter ihnen geblieben, doch die heiligen Stätten ziehen sie zurück."
      fr: "L’itinéraire de Jérôme passe par No, « devenue depuis Alexandrie », jusqu’à Nitrie, où l’évêque confesseur Isidore et d’innombrables moines sortent à sa rencontre. Elle serait restée parmi eux, mais les lieux saints la rappellent."
      pl: "Trasa Hieronima prowadzi przez No, „które potem stało się Aleksandrią”, do Nitrii, gdzie wychodzą jej na spotkanie biskup wyznawca Izydor i niezliczeni mnisi. Chciałaby zostać wśród nich, ale święte miejsca przyciągają ją z powrotem."
      it: "Il percorso di Girolamo passa per No, «che da allora è diventata Alessandria», fino a Nitria, dove il vescovo confessore Isidoro e monaci innumerevoli le vanno incontro. Sarebbe rimasta tra loro, ma i luoghi santi la richiamano."
      nl: "Hiëronymus' route loopt langs No, “dat later Alexandrië is geworden”, naar Nitria, waar de bisschop en belijder Isidorus en ontelbare monniken haar tegemoet komen. Zij zou onder hen zijn gebleven, maar de heilige plaatsen trekken haar terug."
      cs: "Jeronýmova trasa vede kolem No, „které se pak stalo Alexandrií“, do Nitrie, kde jí vycházejí vstříc biskup vyznavač Isidor a nesčetní mniši. Ráda by mezi nimi zůstala, ale svatá místa ji táhnou zpět."
      sv: "Hieronymus’ färdväg går förbi No, ”som sedan har blivit Alexandria”, till Nitria, där biskopen och bekännaren Isidoros och otaliga munkar kommer ut för att möta henne. Hon skulle ha stannat bland dem, men de heliga platserna drar henne tillbaka."
      nb: "Hieronymus' rute går forbi No, «som siden er blitt Aleksandria», til Nitria, hvor bekjenneren og biskopen Isidor og utallige munker kommer ut for å møte henne. Hun ville ha blitt blant dem, men de hellige stedene drar henne tilbake."
      tl: "Ang ruta ni Jerome ay dumaraan sa No, “na naging Alejandria magmula noon”, hanggang Nitria, kung saan lumalabas upang salubungin siya ang obispong si Isidoro, tagapagpahayag ng pananampalataya, at di-mabilang na monghe. Mananatili sana siya sa kanila, ngunit ang mga banal na dako ang humihila sa kaniya pabalik."
      da: "Hieronymus' rute går forbi No, »som siden er blevet til Alexandria«, til Nitria, hvor bekenderen, biskop Isidor, og utallige munke kommer ud for at møde hende. Hun ville være blevet blandt dem, men de hellige steder drager hende tilbage."
      sr: "Јеронимов пут води крај Но, „који је касније постао Александрија“, до Нитрије, где јој у сусрет излазе епископ исповедник Исидор и безбројни монаси. Остала би међу њима, али је света места вуку натраг."
      hu: "Jeromos útvonala No-n át halad, „amely azóta Alexandriává lett”, Nitriába, ahová Izidor hitvalló püspök és számtalan szerzetes jön elé. Szívesen ott maradt volna közöttük, de a szent helyek visszahúzzák."
      fi: "Hieronymuksen reitti kulkee No:n kautta, ”josta on sittemmin tullut Aleksandria”, Nitriaan, jossa tunnustajapiispa Isidoros ja lukemattomat munkit tulevat häntä vastaan. Hän olisi jäänyt heidän luokseen, mutta pyhät paikat vetävät hänet takaisin."
      vi: "Con đường Jerome thuật lại đi qua Nô, “sau này trở thành A-léc-xan-tri”, đến Nitria, nơi giám mục Isidore, một người tuyên xưng đức tin, cùng vô số tu sĩ ra đón bà. Lẽ ra bà đã ở lại với họ, nhưng các nơi thánh kéo bà trở lại."
      ro: "Drumul lui Ieronim trece prin No, „care a devenit de atunci Alexandria”, spre Nitria, unde episcopul mărturisitor Isidor și nenumărați monahi ies în întâmpinarea ei. Ar fi rămas printre ei, dar locurile sfinte o cheamă înapoi."
      bg: "Маршрутът на Йероним минава през Но, „който оттогава е станал Александрия“, до Нитрия, където епископът изповедник Исидор и безбройни монаси излизат да я посрещнат. Тя би останала сред тях, но светите места я теглят обратно."
  - place: a112427 # Bethlehem
    year: "AD 386"
    source:
      cite:
        en: "Jerome, Letter 108.14"
        ru: "Иероним, Письмо 108.14"
        uk: "Єронім, Лист 108.14"
        es: "Jerónimo, Carta 108.14"
        pt: "Jerônimo, Carta 108.14"
        de: "Hieronymus, Brief 108.14"
        fr: "Jérôme, Lettre 108.14"
        pl: "Hieronim, List 108.14"
        it: "Girolamo, Lettera 108.14"
        nl: "Hiëronymus, Brief 108.14"
        cs: "Jeroným, List 108.14"
        sv: "Hieronymus, Brev 108.14"
        nb: "Hieronymus, Brev 108.14"
        tl: "Jerome, Liham 108.14"
        da: "Hieronymus, Brev 108.14"
        sr: "Јероним, Писмо 108.14"
        hu: "Jeromos, Levelek 108.14"
        fi: "Hieronymus, Kirje 108.14"
        vi: "Jerome, Thư 108.14"
        ro: "Ieronim, Scrisoarea 108.14"
        bg: "Йероним, Писмо 108.14"
      url: "https://www.newadvent.org/fathers/3001108.htm"
    note:
      en: "She settles at Bethlehem for good. For three years she lives in a small hostelry while she builds cells, monasteries and hostels for travellers, «where they might find the welcome which Mary and Joseph had missed»."
      ru: "Она навсегда поселяется в Вифлееме. Три года живёт в малой гостинице, пока строит кельи, монастыри и постоялые дворы странникам «на той дороге, на которой Мария и Иосиф не нашли для себя пристанища»."
      uk: "Вона оселяється у Вифлеємі назавжди. Три роки вона живе в маленькому заїзді, поки будує келії, монастирі та притулки для подорожніх, «де вони могли б знайти прийом, якого не знайшли Марія й Йосип»."
      es: "Se establece en Belén para siempre. Durante tres años vive en una pequeña posada mientras construye celdas, monasterios y hospederías para los viajeros, «donde pudieran hallar la acogida que María y José no tuvieron»."
      pt: "Ela se fixa em Belém de vez. Durante três anos vive numa pequena hospedaria enquanto constrói celas, mosteiros e albergues para viajantes, “onde pudessem encontrar a acolhida que Maria e José não tiveram”."
      de: "Sie lässt sich für immer in Bethlehem nieder. Drei Jahre lang wohnt sie in einer kleinen Herberge, während sie Zellen, Klöster und Unterkünfte für Reisende baut, „wo sie die Aufnahme finden sollten, die Maria und Josef versagt geblieben war“."
      fr: "Elle s’installe définitivement à Bethléem. Pendant trois ans, elle vit dans une petite hôtellerie tandis qu’elle construit des cellules, des monastères et des hospices pour les voyageurs, « où ils pourraient trouver l’accueil qui avait manqué à Marie et à Joseph »."
      pl: "Osiada w Betlejem na stałe. Przez trzy lata mieszka w małej gospodzie, budując cele, klasztory i domy dla podróżnych, „gdzie mogliby znaleźć gościnę, której zabrakło Marii i Józefowi”."
      it: "Si stabilisce definitivamente a Betlemme. Per tre anni vive in una piccola locanda mentre costruisce celle, monasteri e ospizi per i viandanti, «dove potessero trovare l’accoglienza che era mancata a Maria e Giuseppe»."
      nl: "Zij vestigt zich voorgoed in Bethlehem. Drie jaar lang woont zij in een kleine herberg terwijl zij cellen, kloosters en gastenverblijven voor reizigers bouwt, “waar zij de gastvrijheid konden vinden die Maria en Jozef hadden gemist”."
      cs: "Usazuje se v Betlémě natrvalo. Tři roky bydlí v malém hostinci, zatímco staví cely, kláštery a útulky pro pocestné, „kde by našli přijetí, jaké Marie a Josef nenalezli“."
      sv: "Hon bosätter sig för alltid i Betlehem. I tre år bor hon i ett litet värdshus medan hon bygger celler, kloster och härbärgen för resande, ”där de skulle finna det mottagande som Maria och Josef hade saknat”."
      nb: "Hun slår seg for godt ned i Betlehem. I tre år bor hun i et lite herberge mens hun bygger celler, klostre og herberger for reisende, «hvor de kunne finne den velkomsten som Maria og Josef gikk glipp av»."
      tl: "Namamalagi siya sa Bethlehem habambuhay. Sa loob ng tatlong taon ay nakatira siya sa isang maliit na bahay-panuluyan habang nagtatayo siya ng mga silid, monasteryo at bahay-tuluyan para sa mga manlalakbay, “kung saan matatagpuan nila ang pagtanggap na hindi natamo nina Maria at Jose”."
      da: "Hun slår sig ned i Betlehem for bestandig. I tre år bor hun i et lille herberg, mens hun bygger celler, klostre og gæstehuse for rejsende, »hvor de kunne finde den modtagelse, som Maria og Josef havde måttet undvære«."
      sr: "Трајно се настањује у Витлејему. Три године живи у малој гостионици док гради ћелије, манастире и преноћишта за путнике, „где би нашли гостопримство које Марија и Јосиф нису нашли“."
      hu: "Végleg Betlehemben telepszik le. Három évig kis fogadóban lakik, miközben cellákat, kolostorokat és szálláshelyeket épít az utazóknak, „ahol megtalálják azt a befogadást, amely Máriának és Józsefnek nem jutott”."
      fi: "Hän asettuu pysyvästi Betlehemiin. Kolme vuotta hän asuu pienessä majapaikassa rakennuttaessaan kammioita, luostareita ja majataloja matkalaisille, ”joissa he löytäisivät sen vastaanoton, josta Maria ja Joosef jäivät paitsi”."
      vi: "Bà định cư hẳn ở Bết-lê-hem. Suốt ba năm bà ở trong một quán trọ nhỏ, trong khi cho xây các phòng tu, tu viện và nhà trọ cho lữ khách, “nơi họ có thể tìm được sự đón tiếp mà Ma-ri và Giô-sép đã không có”."
      ro: "Se stabilește definitiv la Betleem. Timp de trei ani locuiește într-un mic han, în vreme ce construiește chilii, mănăstiri și adăposturi pentru călători, „unde să găsească primirea pe care Maria și Iosif nu o găsiseră”."
      bg: "Установява се във Витлеем завинаги. Три години живее в малка странноприемница, докато строи килии, манастири и приюти за пътници, „където да намерят приема, който Мария и Йосиф не бяха намерили“."
