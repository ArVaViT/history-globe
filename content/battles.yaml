# Left out (no fitting place on the map, or doubtful):
#   - Qarqar, 853 BC, and Issus, 333 BC: no place on the map; both are drawn from
#     events.yaml at their `battlefield` (Tell Qarqur; the Payas, the ancient Pinarus).
#   - Judas at Emmaus, 165 BC (1 Macc 3:40-4:25): fought at Emmaus-Nicopolis ('Amwas), in
#     the plain; the map's Emmaus is Luke's, in the hills near Jerusalem.
#   - Masada, c. AD 73-74: events.yaml says "Masada is not on the map" (it carries a site id).
#   - Beth-zechariah, 162 BC; Elasa, 160 BC; Jotapata and Gamala, AD 67: no place. (Gaugamela,
#     Raphia 217 BC and the other battles outside the Bible are drawn from events.yaml,
#     each at its `battlefield`.)
#   - The Benjamite war at Gibeah (Judg 20): Gibeah (ac24f5f) exists, but the story carries
#     no tour date and Phinehas son of Eleazar (20:28) puts it a generation after Joshua,
#     not at the Judges tour's 1150 BC; left for a dating decision.
#   - Ehud's victory at the fords of the Jordan (Judg 3:26-30) and Jephthah's fight with
#     Ephraim at the fords (Judg 12:1-6): no point place, only the river.
#   - Saul's war on Amalek (1 Sam 15), Israel's war on Midian (Num 31): no place named.
#   - Herod takes Jerusalem (37 BC) and Nebuchadnezzar's siege of Tyre (c. 585 BC):
#     already dated events; left out to keep this list to battles the text tells.
