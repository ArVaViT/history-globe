# Battles and sieges of biblical history (drafted 2026-10-03, then checked against the
# KJV and Synodal text and the tours by a second, independent pass).
#
# Scope: (a) battles the Bible narrates, with the OSIS ref (KJV numbering) of the
# shortest passage that tells the fight; (b) a few battles outside the text that
# decided the fate of Israel and that the map's events or tours touch, with no ref
# and at least one ancient or scholarly source. Nothing after AD 135.
#
# Years follow the tours and events.yaml: the Exodus at 1446 BC (1 Kgs 6:1), the
# conquest from 1406 BC, the judges at the Judges tour's conventional point (1150 BC),
# Saul c. 1050, David c. 1010 (Hebron) and Thiele's chronology for the kings. "c." marks
# every conventional or approximate point; years fixed by Assyrian or Babylonian records
# stand without it. Where a tour sets a story at its own conventional point (Elah in the
# David tour at 1010 BC, all three judges at 1150 BC) the battle keeps that point, and the
# comment says so; a checker may prefer a different one.
#
# Place ids are from apps/web/public/data/places.geojson; the Russian names follow
# content/place-names.yaml (Synodal). Left-out battles are listed at the end.
battles:
  # ---- Patriarchs (conventional point of the Abraham tour: 1900 BC) ----
  - id: siddim
    year: "c. 1900 BC"
    title:
      en: "The battle of the kings in the Vale of Siddim"
      ru: "Битва царей в долине Сиддим"
    place: a4a5cce # Valley of Siddim
    ref: Gen.14.8-Gen.14.12
    sides:
      en: "Chedorlaomer and three kings of the east against the five kings of Sodom, Gomorrah, Admah, Zeboiim and Bela"
      ru: "Кедорлаомер с тремя царями востока против пяти царей Содома, Гоморры, Адмы, Севоима и Белы"
    outcome:
      en: "The kings of Sodom and Gomorrah flee; the goods of the cities and Lot are carried off"
      ru: "Цари Содома и Гоморры бегут; имущество городов захвачено, Лот уведён в плен"
    sources:
      - "Gen 14:1-12"
  - id: dan-abram
    year: "c. 1900 BC"
    title:
      en: "Abram rescues Lot at Dan"
      ru: "Аврам отбивает Лота у Дана"
    place: a513646 # Dan
    ref: Gen.14.14-Gen.14.16
    sides:
      en: "Abram with 318 trained servants against the four kings"
      ru: "Аврам с 318 рабами, рождёнными в его доме, против четырёх царей"
    outcome:
      en: "A night attack at Dan; the enemy is pursued to Hobah and Lot and the goods are brought back"
      ru: "Ночное нападение у Дана; неприятель преследуем до Ховы, Лот и имущество возвращены"
    sources:
      - "Gen 14:13-16"

  # ---- Wilderness and conquest (Exodus 1446 BC; the Exodus tour's station years) ----
  - id: rephidim
    year: "c. 1446 BC"
    title:
      en: "Amalek attacks Israel at Rephidim"
      ru: "Амаликитяне нападают на Израиль в Рефидиме"
    place: a05ebb7 # Rephidim
    ref: Exod.17.8-Exod.17.13
    sides:
      en: "Israel under Joshua, with Moses' hands held up on the hill, against Amalek"
      ru: "Израиль во главе с Иисусом, при Моисее с поднятыми руками на холме, против Амаликитян"
    outcome:
      en: "Joshua defeats Amalek with the edge of the sword"
      ru: "Иисус низлагает Амалика остриём меча"
    sources:
      - "Exod 17:8-16"
  - id: hormah-repulse
    year: "c. 1445 BC"
    title:
      en: "Israel repulsed at Hormah"
      ru: "Израиль отброшен у Хормы"
    place: ada25df # Hormah
    ref: Num.14.40-Num.14.45
    sides:
      en: "Israel, going up against Moses' word, against the Amalekites and Canaanites of the hill country"
      ru: "Израиль, пошедший вопреки слову Моисея, против Амаликитян и Хананеев, живущих на горе"
    outcome:
      en: "The Amalekites and Canaanites come down, smite them and chase them to Hormah"
      ru: "Амаликитяне и Хананеи сходят, разбивают их и гонят до Хормы"
    sources:
      - "Num 14:39-45; Deut 1:41-44"
  - id: hormah
    year: "c. 1407 BC"
    title:
      en: "Israel defeats the king of Arad at Hormah"
      ru: "Израиль побеждает царя Арада у Хормы"
    place: ada25df # Hormah
    ref: Num.21.1-Num.21.3
    sides:
      en: "Israel against the Canaanite king of Arad"
      ru: "Израиль против Ханаанского царя Арада"
    outcome:
      en: "The Canaanites and their cities are utterly destroyed; the place is named Hormah"
      ru: "Хананеи и их города преданы заклятию; место названо Хорма"
    sources:
      - "Num 21:1-3"
  - id: jahaz
    year: "c. 1407 BC"
    title:
      en: "Sihon defeated at Jahaz"
      ru: "Сигон разбит при Иааце"
    place: ad9b1cd # Jahaz
    ref: Num.21.21-Num.21.25
    sides:
      en: "Israel against Sihon king of the Amorites"
      ru: "Израиль против Сигона, царя Аморрейского"
    outcome:
      en: "Sihon is slain and Israel takes his land from the Arnon to the Jabbok"
      ru: "Сигон поражён, Израиль берёт его землю от Арнона до Иавока"
    sources:
      - "Num 21:21-31; Deut 2:26-37"
  - id: edrei
    year: "c. 1407 BC"
    title:
      en: "Og of Bashan defeated at Edrei"
      ru: "Ог, царь Васанский, разбит при Едреи"
    place: aaa6f7a # Edrei
    ref: Num.21.33-Num.21.35
    sides:
      en: "Israel against Og king of Bashan"
      ru: "Израиль против Ога, царя Васанского"
    outcome:
      en: "Og, his sons and all his people are smitten and Israel possesses his land"
      ru: "Ог, его сыновья и весь его народ поражены; Израиль овладевает его землёй"
    sources:
      - "Num 21:33-35; Deut 3:1-11"
  - id: jericho
    year: "c. 1406 BC"
    title:
      en: "The fall of Jericho"
      ru: "Падение Иерихона"
    place: a231f80 # Jericho
    ref: Josh.6.1-Josh.6.25
    sides:
      en: "Israel under Joshua against Jericho"
      ru: "Израиль во главе с Иисусом Навином против Иерихона"
    outcome:
      en: "The wall falls down flat; the city is taken and devoted to destruction, Rahab's house spared"
      ru: "Стена обрушивается; город взят и предан заклятию, дом Раав пощажён"
    sources:
      - "Josh 6:1-27"
  - id: ai-repulse
    year: "c. 1406 BC"
    title:
      en: "Israel repulsed at Ai"
      ru: "Израиль отброшен у Гая"
    place: a7e13e1 # Ai
    ref: Josh.7.2-Josh.7.5
    sides:
      en: "About three thousand of Israel against the men of Ai"
      ru: "Около трёх тысяч Израильтян против жителей Гая"
    outcome:
      en: "Israel flees; about thirty-six men are killed in the pursuit to Shebarim"
      ru: "Израильтяне бегут; около тридцати шести человек убиты при преследовании до Севарим"
    sources:
      - "Josh 7:2-5"
  - id: ai
    year: "c. 1406 BC"
    title:
      en: "Joshua takes Ai"
      ru: "Иисус Навин берёт Гай"
    place: a7e13e1 # Ai
    ref: Josh.8.1-Josh.8.29
    sides:
      en: "Israel under Joshua, with an ambush behind the city, against the men of Ai"
      ru: "Израиль во главе с Иисусом Навином, с засадой позади города, против жителей Гая"
    outcome:
      en: "Ai is burned and its king hanged"
      ru: "Гай сожжён, его царь повешен"
    sources:
      - "Josh 8:1-29"
  - id: gibeon
    year: "c. 1406 BC"
    title:
      en: "The battle of Gibeon and the descent of Beth-horon"
      ru: "Битва при Гаваоне и бегство по скату горы Вефоронской"
    place: aede336 # Gibeon
    ref: Josh.10.6-Josh.10.14
    sides:
      en: "Israel under Joshua, come up by night from Gilgal, against the five Amorite kings besieging Gibeon"
      ru: "Израиль во главе с Иисусом Навином, пришедший ночью из Галгала, против пяти Аморрейских царей, осаждающих Гаваон"
    outcome:
      en: "The kings' armies flee down the descent of Beth-horon under hailstones; the sun stands still over Gibeon"
      ru: "Войска царей бегут по скату горы Вефоронской под градом камней; солнце останавливается над Гаваоном"
    sources:
      - "Josh 10:1-15"
  - id: lachish-joshua
    year: "c. 1406 BC"
    title:
      en: "Joshua takes Lachish"
      ru: "Иисус Навин берёт Лахис"
    place: a3cc590 # Lachish
    ref: Josh.10.31-Josh.10.33
    sides:
      en: "Israel under Joshua against Lachish, and Horam king of Gezer who comes to help it"
      ru: "Израиль во главе с Иисусом Навином против Лахиса и Горама, царя Газерского, пришедшего ему на помощь"
    outcome:
      en: "Lachish is taken on the second day and its people put to the sword"
      ru: "Лахис взят на другой день, его жители поражены мечом"
    sources:
      - "Josh 10:31-33"
  - id: merom
    year: "c. 1406 BC"
    title:
      en: "The battle at the waters of Merom; Hazor burned"
      ru: "Битва при водах Меромских; сожжение Асора"
    place: a6ee047 # Waters of Merom
    ref: Josh.11.1-Josh.11.11
    sides:
      en: "Israel under Joshua against Jabin king of Hazor and the kings of the north"
      ru: "Израиль во главе с Иисусом Навином против Иавина, царя Асорского, и северных царей"
    outcome:
      en: "The kings are routed and chased to Sidon; their horses houghed, their chariots burned; Hazor is taken and burned"
      ru: "Цари разбиты и преследуемы до Сидона; коням перерезаны жилы, колесницы сожжены; Асор взят и сожжён"
    sources:
      - "Josh 11:1-15"

  # ---- Judges (the Judges tour's conventional point, 1150 BC, for all three stories;
  #      the period cannot be dated stop by stop) ----
  - id: kishon
    year: "c. 1150 BC"
    title:
      en: "Deborah and Barak defeat Sisera at the Kishon"
      ru: "Девора и Варак разбивают Сисару у Киссона"
    place: a5a6458 # Kishon
    ref: Judg.4.12-Judg.4.21
    sides:
      en: "Barak's ten thousand from Mount Tabor against Sisera's nine hundred chariots of iron"
      ru: "Десять тысяч Варака с горы Фавор против девятисот железных колесниц Сисары"
    outcome:
      en: "Sisera's host is destroyed to the last man; Sisera flees on foot and dies in Jael's tent"
      ru: "Войско Сисары истреблено до последнего человека; Сисара бежит пешим и гибнет в шатре Иаили"
    sources:
      - "Judg 4:4-24; 5:19-21"
  - id: moreh
    year: "c. 1150 BC"
    title:
      en: "Gideon's three hundred rout Midian by the hill of Moreh"
      ru: "Триста воинов Гедеона обращают в бегство Мадианитян у холма Море"
    place: a772880 # Moreh
    ref: Judg.7.16-Judg.7.22
    sides:
      en: "Gideon's three hundred against the camp of Midian, Amalek and the children of the east"
      ru: "Триста воинов Гедеона против стана Мадианитян, Амаликитян и сынов востока"
    outcome:
      en: "At the trumpets and broken pitchers the host turns its swords on itself and flees toward the Jordan"
      ru: "Под звук труб и треск разбитых кувшинов войско обращает мечи друг на друга и бежит к Иордану"
    sources:
      - "Judg 7:1-25"
  - id: shechem-abimelech
    year: "c. 1150 BC"
    title:
      en: "Abimelech destroys Shechem"
      ru: "Авимелех разрушает Сихем"
    place: adf74d4 # Shechem
    ref: Judg.9.42-Judg.9.45
    sides:
      en: "Abimelech against the men of Shechem who had risen against him"
      ru: "Авимелех против жителей Сихема, восставших против него"
    outcome:
      en: "The city is taken, its people slain, and the site sown with salt"
      ru: "Город взят, жители перебиты, место засеяно солью"
    sources:
      - "Judg 9:22-49"
  - id: thebez
    year: "c. 1150 BC"
    title:
      en: "Abimelech killed at the tower of Thebez"
      ru: "Гибель Авимелеха у башни Тевеца"
    place: a5d1690 # Thebez
    ref: Judg.9.50-Judg.9.55
    sides:
      en: "Abimelech against the people of Thebez shut up in the tower"
      ru: "Авимелех против жителей Тевеца, запершихся в башне"
    outcome:
      en: "A woman drops a millstone on Abimelech's head; his armourbearer runs him through, and the army disperses"
      ru: "Женщина бросает на голову Авимелеха обломок жернова; оруженосец добивает его, войско расходится"
    sources:
      - "Judg 9:50-57"
  - id: aroer-jephthah
    year: "c. 1150 BC"
    title:
      en: "Jephthah defeats the Ammonites from Aroer to Minnith"
      ru: "Иеффай разбивает Аммонитян от Ароера до Минифа"
    place: af74969 # Aroer (Judg 11:33)
    ref: Judg.11.32-Judg.11.33
    sides:
      en: "Jephthah and Gilead against the children of Ammon"
      ru: "Иеффай с Галаадом против Аммонитян"
    outcome:
      en: "Twenty cities are smitten with a very great slaughter; Ammon is subdued"
      ru: "Поражены двадцать городов, поражение весьма великое; Аммонитяне смирились"
    sources:
      - "Judg 11:29-33"

  # ---- Samuel and Saul (Samuel tour 1070 BC; Saul's reign c. 1050-1010 BC) ----
  - id: ebenezer
    year: "c. 1070 BC"
    title:
      en: "The Philistines take the ark at Ebenezer"
      ru: "Филистимляне захватывают ковчег при Авен-Езере"
    place: abfdefc # Ebenezer (1 Sam 4:1)
    ref: 1Sam.4.1-1Sam.4.11
    sides:
      en: "Israel, camped at Ebenezer with the ark, against the Philistines at Aphek"
      ru: "Израиль, ставший станом при Авен-Езере с ковчегом, против Филистимлян при Афеке"
    outcome:
      en: "Israel is beaten twice; thirty thousand fall, the ark is taken, Hophni and Phinehas are slain"
      ru: "Израиль разбит дважды; тридцать тысяч пали, ковчег взят, Офни и Финеес убиты"
    sources:
      - "1 Sam 4:1-11"
  - id: mizpah
    year: "c. 1070 BC"
    title:
      en: "The Philistines routed at Mizpah; the stone Ebenezer"
      ru: "Филистимляне разбиты при Массифе; камень Авен-Езер"
    place: a736f6c # Mizpah
    ref: 1Sam.7.7-1Sam.7.12
    sides:
      en: "Israel gathered at Mizpah under Samuel against the lords of the Philistines"
      ru: "Израиль, собранный в Массифе при Самуиле, против владетелей Филистимских"
    outcome:
      en: "The Lord thunders on the Philistines; Israel pursues them below Beth-car, and Samuel sets up the stone Ebenezer"
      ru: "Господь гремит на Филистимлян; Израиль гонит их до Вефхора, Самуил ставит камень Авен-Езер"
    sources:
      - "1 Sam 7:3-14"
  - id: jabesh-gilead
    year: "c. 1050 BC"
    title:
      en: "Saul relieves Jabesh-gilead"
      ru: "Саул освобождает Иавис Галаадский"
    place: af92088 # Jabesh-gilead
    ref: 1Sam.11.1-1Sam.11.11
    sides:
      en: "Saul with the levy of Israel and Judah against Nahash the Ammonite besieging Jabesh"
      ru: "Саул с ополчением Израиля и Иуды против Нааса Аммонитянина, осаждающего Иавис"
    outcome:
      en: "Three companies strike the camp in the morning watch; the Ammonites are scattered, no two left together"
      ru: "Три отряда врываются в стан в утреннюю стражу; Аммонитяне рассеяны, не остаётся и двух вместе"
    sources:
      - "1 Sam 11:1-15"
  - id: michmash
    year: "c. 1050 BC"
    title:
      en: "Jonathan's exploit at Michmash"
      ru: "Подвиг Ионафана при Михмасе"
    place: adea06c # Michmash
    ref: 1Sam.14.1-1Sam.14.23
    sides:
      en: "Jonathan and his armourbearer, then Saul's six hundred, against the Philistine garrison at Michmash"
      ru: "Ионафан с оруженосцем, затем шестьсот человек Саула, против Филистимского отряда при Михмасе"
    outcome:
      en: "Panic and an earthquake in the Philistine camp; they fall on each other, and the battle passes over to Beth-aven"
      ru: "Смятение и землетрясение в стане Филистимлян; они обращают мечи друг на друга, сражение доходит до Беф-Авена"
    sources:
      - "1 Sam 13:5-7; 14:1-23"
  - id: elah
    # The David tour holds the Valley of Elah at its conventional point (1010 BC); the
    # fight itself falls in Saul's reign, some years before David's accession.
    year: "c. 1010 BC"
    title:
      en: "David and Goliath in the Valley of Elah"
      ru: "Давид и Голиаф в долине дуба"
    place: ab183f8 # Valley of Elah
    ref: 1Sam.17.38-1Sam.17.54
    sides:
      en: "Saul's army with David against the Philistines and their champion Goliath of Gath"
      ru: "Войско Саула с Давидом против Филистимлян и их единоборца Голиафа из Гефа"
    outcome:
      en: "Goliath falls to a sling-stone and is beheaded; the Philistines are chased to Gath and Ekron"
      ru: "Голиаф сражён камнем из пращи и обезглавлен; Филистимлян гонят до Гефа и Аккарона"
    sources:
      - "1 Sam 17:1-54"
  - id: ziklag
    year: "c. 1010 BC"
    title:
      en: "David recovers all from the Amalekites who burned Ziklag"
      ru: "Давид отбивает всё у Амаликитян, сжёгших Секелаг"
    place: a0ed7ff # Ziklag
    ref: 1Sam.30.16-1Sam.30.20
    sides:
      en: "David with four hundred men against the Amalekite raiders"
      ru: "Давид с четырьмястами воинов против Амаликитян"
    outcome:
      en: "The raiders are cut down from twilight to the next evening; four hundred escape on camels; every captive and all the spoil are recovered"
      ru: "Нападавшие истреблены от сумерек до вечера следующего дня; четыреста спаслись на верблюдах; все пленные и вся добыча возвращены"
    sources:
      - "1 Sam 30:1-20"
  - id: gilboa
    year: "c. 1010 BC"
    title:
      en: "Saul falls on Mount Gilboa"
      ru: "Гибель Саула на горе Гелвуй"
    place: acf57c5 # Mount Gilboa
    ref: 1Sam.31.1-1Sam.31.7
    sides:
      en: "Saul's Israel against the Philistines gathered at Aphek and Shunem"
      ru: "Израиль при Сауле против Филистимлян, собравшихся у Афека и Сонама"
    outcome:
      en: "Israel flees; Jonathan, Abinadab and Malchi-shua are slain, Saul falls on his sword, and the Philistines occupy the cities"
      ru: "Израильтяне бегут; Ионафан, Аминадав и Малхисуа убиты, Саул бросается на меч, Филистимляне занимают города"
    sources:
      - "1 Sam 28:4; 29:1; 31:1-13; 1 Chr 10:1-12"

  # ---- David (Hebron c. 1010 BC; Jerusalem after seven and a half years, 2 Sam 5:5) ----
  - id: gibeon-pool
    year: "c. 1010 BC"
    title:
      en: "Abner and Joab at the pool of Gibeon"
      ru: "Авенир и Иоав у Гаваонского пруда"
    place: aede336 # Gibeon
    ref: 2Sam.2.12-2Sam.2.17
    sides:
      en: "Abner with the servants of Ish-bosheth against Joab with the servants of David"
      ru: "Авенир со слугами Иевосфея против Иоава со слугами Давида"
    outcome:
      en: "Twelve against twelve fall together; Abner is beaten in a very sore battle and Asahel dies in the pursuit"
      ru: "Двенадцать против двенадцати падают разом; Авенир разбит в жесточайшем сражении, Асаил гибнет при преследовании"
    sources:
      - "2 Sam 2:12-32"
  - id: jebus
    # 2 Sam 5:5: seven years and six months at Hebron, so c. 1003 BC on the tours'
    # reckoning (David's accession c. 1010 BC).
    year: "c. 1003 BC"
    title:
      en: "David takes the stronghold of Zion"
      ru: "Давид берёт крепость Сион"
    place: a15257a # Jerusalem
    ref: 2Sam.5.6-2Sam.5.9
    sides:
      en: "David and his men against the Jebusites of Jerusalem"
      ru: "Давид с людьми своими против Иевусеев Иерусалима"
    outcome:
      en: "The stronghold is taken and becomes the city of David"
      ru: "Крепость взята и становится городом Давидовым"
    sources:
      - "2 Sam 5:6-10; 1 Chr 11:4-9"
  - id: baal-perazim
    year: "c. 1000 BC"
