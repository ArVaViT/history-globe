# Battles and sieges of biblical history (drafted 2026-10-03, then checked against the
# KJV and Synodal text and the tours by a second, independent pass).
#
# Scope: (a) battles the Bible narrates, with the OSIS ref (KJV numbering) of the
# shortest passage that tells the fight; (b) a few battles outside the text that
# decided the fate of Israel and that the map's events or tours touch, with no ref
# and at least one ancient or scholarly source. Nothing after AD 135.
#
# Years follow the tours and events.yaml: the Exodus at 1446 BC (1 Kgs 6:1), the
# conquest from 1406 BC, the judges at the Judges tour's conventional point (1150 BC),
# Saul c. 1050, David c. 1010 (Hebron) and Thiele's chronology for the kings. "c." marks
# every conventional or approximate point; years fixed by Assyrian or Babylonian records
# stand without it. Where a tour sets a story at its own conventional point (Elah in the
# David tour at 1010 BC, all three judges at 1150 BC) the battle keeps that point, and the
# comment says so; a checker may prefer a different one.
#
# Place ids are from apps/web/public/data/places.geojson; the Russian names follow
# content/place-names.yaml (Synodal). Left-out battles are listed at the end.
