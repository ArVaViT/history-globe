#   kings of Israel and Judah by Thiele; fall of Jerusalem 587 BC as in the exile and Jeremiah tours;
#   NT: birth c. 5 BC, ministry AD 28-30, crucifixion AD 30, Acts by the Paul tours.
# Years are astronomical (1 BC = 0, 587 BC = -586; ADR 0003). One year per chapter range: the start of
# the reign or the dated event the range turns on. Undatable books and ranges are left out (see NOTES.txt).
