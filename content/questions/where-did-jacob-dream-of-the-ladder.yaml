id: where-did-jacob-dream-of-the-ladder
question:
  en: "Where did Jacob dream of the ladder?"
  ru: "Где Иакову приснилась лестница?"
  uk: "Де Яків бачив уві сні драбину?"
  es: "¿Dónde soñó Jacob con la escalera?"
  pt: "Onde Jacó sonhou com a escada?"
  de: "Wo träumte Jakob von der Himmelsleiter?"
  fr: "Où Jacob a-t-il rêvé de l’échelle ?"
  pl: "Gdzie Jakub śnił o drabinie?"
  it: "Dove Giacobbe sognò la scala?"
  nl: "Waar droomde Jakob van de ladder?"
  cs: "Kde se Jákobovi zdál sen o žebříku?"
  sv: "Var drömde Jakob om stegen?"
  nb: "Hvor drømte Jakob om stigen?"
  tl: "Saan nanaginip si Jacob ng hagdan?"
  da: "Hvor drømte Jakob om stigen?"
  sr: "Где је Јаков сањао лествице?"
answer:
  en:
    - "Near the town of Luz, which Jacob renamed Bethel, “house of God”: most scholars place it at Beitin, north of Ramallah, about 16 km north of Jerusalem in a straight line, and the map point stands there. Jacob had set out from Beersheba for Haran; Bethel lies about 84 km north of Beersheba, some three or four days on foot, on the road along the ridge of the hills. Beitin is the usual identification but not a proven one: D. P. Livingston, for one, argued for el-Bireh, a few kilometres to the south-west. The town itself has its own page; this one is about the place of the dream."
    - "Genesis does not say that Jacob slept in the town. “He lighted upon a certain place, and tarried there all night, because the sun was set”, took one of its stones for a pillow, and dreamed: “behold a ladder set up on the earth, and the top of it reached to heaven: and behold the angels of God ascending and descending on it.” Waking, he said, “this is none other but the house of God, and this is the gate of heaven”, set the stone up as a pillar and poured oil on it. “And he called the name of that place Beth-el: but the name of that city was called Luz at the first.” Jesus takes up the image: “ye shall see heaven open, and the angels of God ascending and descending upon the Son of man.”"
    - "In the fourth century Eusebius placed Bethel twelve Roman miles from Jerusalem on the road to Neapolis, and Jerome added that a church had been built there where Jacob slept. Jewish tradition read the story another way: the rabbis, and Rashi after them, held that “the place” was Mount Moriah, the site of the Temple, and that the ladder stood between Beersheba and Bethel with Jerusalem at its middle. The Temple Mount lies about 16 km south of Beitin."
  ru:
    - "Близ города Луз, который Иаков переименовал в Вефиль, «дом Божий»: большинство учёных помещают его в Бейтине к северу от Рамаллы, примерно в 16 км к северу от Иерусалима по прямой, и там стоит точка карты. Иаков вышел из Вирсавии в Харран; Вефиль лежит примерно в 84 км к северу от Вирсавии, в трёх-четырёх днях пешего пути, на дороге вдоль хребта. Бейтин — обычное, но не доказанное отождествление: Д. П. Ливингстон, например, предлагал Эль-Биру в нескольких километрах к юго-западу. О самом городе — отдельная страница; эта — о месте сна."
    - "Книга Бытия не говорит, что Иаков ночевал в городе. Он «пришел на одно место, и остался там ночевать, потому что зашло солнце», взял один из камней того места себе в изголовье и увидел во сне: «вот, лестница стоит на земле, а верх ее касается неба; и вот, Ангелы Божии восходят и нисходят по ней». Проснувшись, он сказал: «это не иное что, как дом Божий, это врата небесные», поставил камень памятником и возлил на него елей. «И нарек Иаков имя месту тому: Вефиль, а прежнее имя того города было: Луз». Иисус подхватывает этот образ: «отныне будете видеть небо отверстым и Ангелов Божиих восходящих и нисходящих к Сыну Человеческому»."
    - "В IV веке Евсевий помещал Вефиль в двенадцати римских милях от Иерусалима по дороге в Неаполь, а Иероним добавил, что там построена церковь на месте, где спал Иаков. Иудейское предание читало рассказ иначе: раввины, а за ними Раши считали, что «место» — это гора Мориа, где стоял Храм, и что лестница стояла между Вирсавией и Вефилем, а Иерусалим приходился на её середину. Храмовая гора лежит примерно в 16 км к югу от Бейтина."
  uk:
    - "Поблизу міста Луз, яке Яків перейменував на Бет-Ел, «дім Божий»: більшість учених розміщує його в Бейтіні, на північ від Рамалли, приблизно за 16 км на північ від Єрусалиму по прямій, і точка мапи стоїть там. Яків вирушив із Беер-Шеви до Харана; Бет-Ел лежить приблизно за 84 км на північ від Беер-Шеви, три-чотири дні пішки, дорогою вздовж хребта пагорбів. Бейтін — звичайне ототожнення, але не доведене: Д. П. Лівінгстон, зокрема, обстоював ель-Бірех, за кілька кілометрів на південний захід. Саме місто має свою сторінку; ця присвячена місцю сну."
    - "Книга Буття не каже, що Яків спав у місті. Він «приблудивсь до одного врочища, та й обночувавсь там, зайшло бо соньце», узяв один із його каменів собі в голови й бачив сон: «се драбину поставлено на землї, верховина ж її сягає до небес, і ангели Божі возходять і низходять по нїй». Прокинувшись, він сказав: «Не що інше воно як дом Божий, а се ворота небесні», поставив камінь стовпом і злив на нього олію. «І прозвав Яков урочище то Бетель; прежне прізвище городу було Луз». Ісус підхоплює цей образ: «Від нинї бачити мете небо відкрите, а ангелів Божих, що сходять угору і вниз на Сина чоловічого»."
    - "У IV ст. Євсевій розмістив Бет-Ел за дванадцять римських миль від Єрусалиму на дорозі до Неаполя, а Єронім додав, що там, де спав Яків, було збудовано церкву. Єврейська традиція читала історію інакше: рабини, а за ними Раші, вважали, що «місце» — це гора Морія, місце Храму, і що драбина стояла між Беер-Шевою та Бет-Елем із Єрусалимом посередині. Храмова гора лежить приблизно за 16 км на південь від Бейтіна."
  es:
    - "Cerca de la ciudad de Luz, a la que Jacob puso el nombre de Betel, «casa de Dios»: la mayoría de los estudiosos la sitúa en Beitín, al norte de Ramala, a unos 16 km al norte de Jerusalén en línea recta, y allí está el punto del mapa. Jacob había partido de Beerseba hacia Harán; Betel queda a unos 84 km al norte de Beerseba, unos tres o cuatro días a pie, por el camino que sigue la cresta de las colinas. Beitín es la identificación habitual, pero no demostrada: D. P. Livingston, por ejemplo, defendió el-Bireh, unos kilómetros al suroeste. La ciudad tiene su propia ficha; esta trata del lugar del sueño."
    - "Génesis no dice que Jacob durmiera en la ciudad. «Y encontró con un lugar, y durmió allí, porque ya el sol se había puesto», tomó una de sus piedras por cabecera y soñó: «he aquí una escala que estaba apoyada en tierra, y su cabeza tocaba en el cielo: y he aquí ángeles de Dios que subían y descendían por ella». Al despertar dijo: «No es otra cosa que casa de Dios, y puerta del cielo», erigió la piedra como columna y derramó aceite sobre ella. «Y llamó el nombre de aquel lugar Beth-el, bien que Luz era el nombre de la ciudad primero». Jesús retoma la imagen: «veréis el cielo abierto, y los ángeles de Dios que suben y descienden sobre el Hijo del hombre»."
    - "En el siglo IV, Eusebio situó Betel a doce millas romanas de Jerusalén en el camino a Neápolis, y Jerónimo añadió que se había edificado allí una iglesia donde durmió Jacob. La tradición judía leyó la historia de otro modo: los rabinos, y Rashi tras ellos, sostuvieron que «el lugar» era el monte Moriah, el emplazamiento del Templo, y que la escalera se alzaba entre Beerseba y Betel con Jerusalén en su centro. El monte del Templo queda a unos 16 km al sur de Beitín."
  pt:
    - "Perto da cidade de Luz, que Jacó rebatizou de Betel, “casa de Deus”: a maioria dos estudiosos a situa em Beitin, ao norte de Ramala, a cerca de 16 km ao norte de Jerusalém em linha reta, e o ponto do mapa está ali. Jacó partira de Berseba para Harã; Betel fica a cerca de 84 km ao norte de Berseba, uns três ou quatro dias a pé, na estrada ao longo da crista dos montes. Beitin é a identificação usual, mas não provada: D. P. Livingston, por exemplo, defendeu el-Bireh, alguns quilômetros a sudoeste. A cidade tem página própria; esta trata do lugar do sonho."
    - "Gênesis não diz que Jacó dormiu na cidade. “Ele chegou a um certo lugar e passou a noite ali, porque o sol já havia se posto”, tomou uma das pedras do lugar por travesseiro e sonhou: “Ele sonhou e viu uma escada apoiada na terra, e seu topo chegava ao céu. Eis que os anjos de Deus subiam e desciam por ela.” Ao despertar, disse: “Esta não é outra senão a casa de Deus, e esta é a porta do céu”, ergueu a pedra como coluna e derramou óleo sobre ela. “Ele chamou o nome daquele lugar de Betel, mas o nome da cidade era Luz no princípio.” Jesus retoma a imagem: “vocês verão o céu aberto, e os anjos de Deus subindo e descendo sobre o Filho do Homem”."
    - "No século IV, Eusébio situou Betel a doze milhas romanas de Jerusalém, na estrada para Neápolis, e Jerônimo acrescentou que ali se construíra uma igreja onde Jacó dormiu. A tradição judaica leu a história de outro modo: os rabinos, e Rashi depois deles, sustentavam que “o lugar” era o monte Moriá, o local do Templo, e que a escada ficava entre Berseba e Betel, com Jerusalém no meio. O monte do Templo fica a cerca de 16 km ao sul de Beitin."
  de:
    - "In der Nähe der Stadt Lus, die Jakob in Bethel, „Haus Gottes“, umbenannte: Die meisten Gelehrten setzen sie bei Beitin nördlich von Ramallah an, etwa 16 km nördlich von Jerusalem in der Luftlinie, und dort steht der Kartenpunkt. Jakob war von Beerscheba nach Haran aufgebrochen; Bethel liegt etwa 84 km nördlich von Beerscheba, drei oder vier Tage zu Fuß, an der Straße auf dem Höhenrücken. Beitin ist die übliche, aber nicht bewiesene Gleichsetzung: D. P. Livingston etwa plädierte für el-Bire, einige Kilometer südwestlich. Die Stadt selbst hat ihre eigene Seite; diese hier handelt vom Ort des Traums."
    - "Die Genesis sagt nicht, dass Jakob in der Stadt schlief. Er „kam an einen Ort, da blieb er über Nacht; denn die Sonne war untergegangen“, nahm einen Stein des Ortes als Kopfkissen und träumte: „Und siehe, eine Leiter stand auf der Erde, die rührte mit der Spitze an den Himmel, und siehe, die Engel Gottes stiegen daran auf und nieder.“ Beim Erwachen sagte er: „Hier ist nichts anderes als Gottes Haus, und hier ist die Pforte des Himmels“, richtete den Stein als Mal auf und goss Öl darauf. Er „hieß die Stätte Beth-El; zuvor aber hieß die Stadt Lus“. Jesus greift das Bild auf: „Von nun an werdet ihr den Himmel offen sehen und die Engel Gottes hinauf und herab fahren auf des Menschen Sohn.“"
    - "Im 4. Jahrhundert setzte Eusebius Bethel zwölf römische Meilen von Jerusalem an der Straße nach Neapolis an, und Hieronymus fügte hinzu, dort sei eine Kirche gebaut worden, wo Jakob schlief. Die jüdische Überlieferung las die Geschichte anders: Die Rabbinen und nach ihnen Raschi hielten „den Ort“ für den Berg Morija, die Stätte des Tempels, und die Leiter für zwischen Beerscheba und Bethel aufgestellt, mit Jerusalem in ihrer Mitte. Der Tempelberg liegt etwa 16 km südlich von Beitin."
  fr:
    - "Près de la ville de Luz, que Jacob rebaptisa Béthel, « maison de Dieu » : la plupart des savants la placent à Beitin, au nord de Ramallah, à environ 16 km au nord de Jérusalem en ligne droite, et le point de la carte s’y trouve. Jacob était parti de Beer-Schéba pour Haran ; Béthel est à environ 84 km au nord de Beer-Schéba, trois ou quatre jours de marche, sur la route de la crête des collines. Beitin est l’identification habituelle, mais non prouvée : D. P. Livingston, par exemple, a plaidé pour el-Bireh, à quelques kilomètres au sud-ouest. La ville a sa propre page ; celle-ci traite du lieu du songe."
    - "La Genèse ne dit pas que Jacob dormit dans la ville. « Il arriva dans un lieu où il passa la nuit ; car le soleil était couché », prit une des pierres du lieu comme chevet, et rêva : « Et voici, une échelle était appuyée sur la terre, et son sommet touchait au ciel. Et voici, les anges de Dieu montaient et descendaient par cette échelle. » À son réveil, il dit : « C’est ici la maison de Dieu, c’est ici la porte des cieux ! », dressa la pierre pour monument et versa de l’huile dessus. « Il donna à ce lieu le nom de Béthel ; mais la ville s’appelait auparavant Luz. » Jésus reprend l’image : « vous verrez désormais le ciel ouvert et les anges de Dieu monter et descendre sur le Fils de l’homme. »"
    - "Au IVe siècle, Eusèbe plaçait Béthel à douze milles romains de Jérusalem sur la route de Néapolis, et Jérôme ajoutait qu’on y avait bâti une église là où Jacob avait dormi. La tradition juive lisait le récit autrement : les rabbins, et Rachi après eux, tenaient que « le lieu » était le mont Morija, site du Temple, et que l’échelle se dressait entre Beer-Schéba et Béthel, avec Jérusalem en son milieu. Le mont du Temple se trouve à environ 16 km au sud de Beitin."
  pl:
    - "Niedaleko miasta Luz, które Jakub nazwał Betel, „dom Boży”: większość uczonych umieszcza je w Bejtin, na północ od Ramallah, około 16 km na północ od Jerozolimy w linii prostej, i tam stoi punkt na mapie. Jakub wyruszył z Beer-Szeby do Charanu; Betel leży około 84 km na północ od Beer-Szeby, jakieś trzy lub cztery dni pieszo, na drodze wzdłuż grzbietu wzgórz. Bejtin jest zwykłym utożsamieniem, ale nie dowiedzionym: D. P. Livingston na przykład dowodził za el-Bireh, kilka kilometrów na południowy zachód. Samo miasto ma własną stronę; ta dotyczy miejsca snu."
    - "Księga Rodzaju nie mówi, że Jakub spał w mieście. „I przyszedł na jedno miejsce, i nocował tam (albowiem już było zaszło słońce)”, wziął jeden z kamieni na wezgłowie i śnił: „a ono drabina stała na ziemi, a wierzch jej dosięgał nieba; a oto, Aniołowie Boży wstępowali i zstępowali po niej.” Obudzony powiedział: „nic tu nie jest innego jedno dom Boży, a tu brama niebieska”, postawił kamień jako słup i nalał na niego oliwy. „I nazwał imię miejsca onego Betel; bo było przedtem imię miasta onego Luz.” Jezus podejmuje ten obraz: „ujrzycie niebo otworzone i Anioły Boże wstępujące i zstępujące na Syna człowieczego.”"
    - "W IV wieku Euzebiusz umieścił Betel dwanaście mil rzymskich od Jerozolimy na drodze do Neapolis, a Hieronim dodał, że zbudowano tam kościół w miejscu, gdzie Jakub spał. Tradycja żydowska odczytywała opowieść inaczej: rabini, a za nimi Raszi, uważali, że „to miejsce” to góra Moria, miejsce Świątyni, i że drabina stała między Beer-Szebą a Betel z Jerozolimą pośrodku. Wzgórze Świątynne leży około 16 km na południe od Bejtin."
  it:
    - "Presso la città di Luz, che Giacobbe ribattezzò Betel, «casa di Dio»: la maggior parte degli studiosi la colloca a Beitin, a nord di Ramallah, a circa 16 km a nord di Gerusalemme in linea retta, ed è lì il punto della mappa. Giacobbe era partito da Bersabea per Carran; Betel dista circa 84 km a nord di Bersabea, tre o quattro giorni a piedi, sulla strada lungo il crinale delle colline. Beitin è l’identificazione abituale ma non provata: D. P. Livingston, ad esempio, ha sostenuto el-Bireh, pochi chilometri a sud-ovest. La città ha una scheda a sé; questa riguarda il luogo del sogno."
    - "La Genesi non dice che Giacobbe dormì nella città. «Capitò in un certo luogo, e vi passò la notte, perché il sole era già tramontato», prese una delle pietre del luogo per capezzale e sognò: «ed ecco una scala appoggiata sulla terra, la cui cima toccava il cielo; ed ecco gli angeli di Dio, che salivano e scendevano per la scala». Svegliatosi, disse: «Questa non è altro che la casa di Dio, e questa è la porta del cielo!», rizzò la pietra come monumento e vi versò sopra dell’olio. «E pose nome a quel luogo Bethel; ma, prima, il nome della città era Luz». Gesù riprende l’immagine: «vedrete il cielo aperto e gli angeli di Dio salire e scendere sopra il Figliuol dell’uomo»."
    - "Nel IV secolo Eusebio collocava Betel a dodici miglia romane da Gerusalemme sulla strada per Neapoli, e Girolamo aggiunse che vi era stata costruita una chiesa dove Giacobbe dormì. La tradizione ebraica leggeva la storia in altro modo: i rabbini, e Rashi dopo di loro, ritenevano che «il luogo» fosse il Monte Moria, sito del Tempio, e che la scala stesse tra Bersabea e Betel con Gerusalemme al suo centro. Il Monte del Tempio si trova a circa 16 km a sud di Beitin."
  nl:
    - "Bij de stad Luz, door Jakob Bethel genoemd, “huis van God”: de meeste geleerden plaatsen het bij Beitin, ten noorden van Ramallah, hemelsbreed ongeveer 16 km ten noorden van Jeruzalem, en daar staat het punt op de kaart. Jakob was uit Berseba naar Haran vertrokken; Bethel ligt ongeveer 84 km ten noorden van Berseba, drie of vier dagen te voet, aan de weg over de bergkam. Beitin is de gebruikelijke identificatie maar niet bewezen: D. P. Livingston pleitte onder anderen voor el-Bireh, enkele kilometers naar het zuidwesten. De stad zelf heeft een eigen pagina; deze gaat over de plaats van de droom."
    - "Genesis zegt niet dat Jakob in de stad sliep. “En hij geraakte op een plaats, waar hij vernachtte; want de zon was ondergegaan”, nam een van de stenen als hoofdkussen en droomde: “en ziet, een ladder was gesteld op de aarde, welker opperste aan den hemel raakte; en ziet, de engelen Gods klommen daarbij op en neder.” Bij het ontwaken zei hij: “Dit is niet dan een huis Gods, en dit is de poort des hemels!”, richtte de steen op als zuil en goot er olie op. “En hij noemde den naam dier plaats Beth-El; daar toch de naam dier stad te voren was Luz.” Jezus neemt het beeld over: “zult gij den hemel zien geopend, en de engelen Gods opklimmende en nederdalende op den Zoon des mensen.”"
    - "In de vierde eeuw plaatste Eusebius Bethel twaalf Romeinse mijlen van Jeruzalem aan de weg naar Neapolis, en Hiëronymus voegde toe dat daar een kerk was gebouwd waar Jakob sliep. De Joodse overlevering las het verhaal anders: de rabbijnen, en Rasji na hen, hielden “de plaats” voor de berg Moria, de tempelplek, met de ladder tussen Berseba en Bethel en Jeruzalem in het midden. De Tempelberg ligt ongeveer 16 km ten zuiden van Beitin."
  cs:
    - "Poblíž města Lúz, které Jákob přejmenoval na Bét-el, „dům Boží“: většina badatelů je klade do Bejtinu, severně od Ramalláhu, asi 16 km severně od Jeruzaléma vzdušnou čarou, a tam stojí bod na mapě. Jákob se vydal z Beer-šeby do Cháranu; Bét-el leží asi 84 km severně od Beer-šeby, zhruba tři až čtyři dny pěšky, po cestě podél hřebene hor. Bejtin je obvyklé ztotožnění, ale nikoli prokázané: D. P. Livingston například hájil al-Bíru, několik kilometrů jihozápadně. Město samo má vlastní stránku; tato je o místě snu."
    - "Genesis neříká, že Jákob spal ve městě. „I trefil na jedno místo, na kterémžto zůstal přes noc, (nebo slunce již bylo zapadlo,)“, vzal kámen z toho místa, položil si jej pod hlavu a snil: „aj, žebřík stál na zemi, jehožto vrch dosahal nebe; a aj, andělé Boží vstupovali a sstupovali po něm.“ Když procitl, řekl: „Není jiného, jediné dům Boží, a tu jest brána nebeská“, postavil kámen jako sloup a polil jej olejem. „Protož nazval jméno místa toho Bethel, ješto prvé to město sloulo Lůza.“ Ježíš ten obraz přejímá: „Od tohoto času uzříte nebe otevřené, a anděly Boží vstupující a sstupující na Syna člověka.“"
    - "Ve 4. století Eusebios umístil Bét-el dvanáct římských mil od Jeruzaléma na cestě do Neapolis a Jeroným dodal, že tam byl postaven kostel, kde Jákob spal. Židovská tradice četla příběh jinak: rabíni a po nich Raši soudili, že „místem“ byla hora Moria, místo chrámu, a že žebřík stál mezi Beer-šebou a Bét-elem s Jeruzalémem uprostřed. Chrámová hora leží asi 16 km jižně od Bejtinu."
  sv:
    - "Nära staden Lus, som Jakob döpte om till Betel, ”Guds hus”: de flesta forskare förlägger det till Beitin, norr om Ramallah, omkring 16 km norr om Jerusalem fågelvägen, och kartpunkten står där. Jakob hade gett sig av från Beer Sheva mot Harran; Betel ligger omkring 84 km norr om Beer Sheva, några tre eller fyra dagar till fots, på vägen längs bergens ås. Beitin är den vanliga identifieringen men inte en bevisad: D. P. Livingston argumenterade till exempel för el-Bireh, några kilometer åt sydväst. Själva staden har en egen sida; den här handlar om drömmens plats."
    - "1 Mosebok säger inte att Jakob sov i staden. Han ”kom då till den heliga platsen och stannade där över natten, ty solen hade gått ned”, tog en av stenarna till huvudgärd och drömde: ”Han såg en stege vara rest på jorden, och dess övre ände räckte upp till himmelen, och Guds änglar stego upp och ned på den.” När han vaknade sade han: ”Detta måste vara en helig plats, här bor förvisso Gud, och här är himmelens port”, reste stenen till en stod och göt olja därovanpå. ”Och han gav den platsen namnet Betel; förut hade staden hetat Lus.” Jesus tar upp bilden: ”I skolen få se himmelen öppen och Guds änglar fara upp och fara ned över Människosonen.”"
    - "På 300-talet förlade Eusebios Betel tolv romerska mil från Jerusalem på vägen till Neapolis, och Hieronymus tillade att en kyrka hade byggts där Jakob sov. Judisk tradition läste berättelsen på annat sätt: rabbinerna, och Rashi efter dem, höll före att ”platsen” var berget Moria, templets plats, och att stegen stod mellan Beer Sheva och Betel med Jerusalem i mitten. Tempelberget ligger omkring 16 km söder om Beitin."
  nb:
    - "Nær byen Lus, som Jakob omdøpte til Betel, «Guds hus»: de fleste forskere plasserer den ved Beitin, nord for Ramallah, omtrent 16 km nord for Jerusalem i luftlinje, og kartpunktet står der. Jakob hadde dratt fra Beer-Sjeba til Harran; Betel ligger omtrent 84 km nord for Beer-Sjeba, noen tre eller fire dager til fots, på veien langs høydedraget. Beitin er den vanlige identifikasjonen, men ikke en bevist en: D. P. Livingston argumenterte blant andre for el-Bireh, noen kilometer mot sørvest. Selve byen har sin egen side; denne handler om stedet for drømmen."
    - "1 Mosebok sier ikke at Jakob sov i byen. «Han kom til et sted hvor han blev natten over, for solen var gått ned», tok en av stenene der som hodepute og drømte: «en stige som var stilt op på jorden, og hvis topp nådde til himmelen, og se, Guds engler steg op og steg ned på den.» Da han våknet, sa han: «Her er visselig Guds hus, her er himmelens port», reiste steinen som en støtte og helte olje over den. «Og han kalte dette sted Betel; før hette byen Luz.» Jesus tar opp bildet: «I skal se himmelen åpnet og Guds engler stige op og stige ned over Menneskesønnen»."
    - "På 300-tallet plasserte Eusebius Betel tolv romerske mil fra Jerusalem på veien til Neapolis, og Hieronymus tilføyde at en kirke var bygget der Jakob sov. Jødisk tradisjon leste fortellingen annerledes: rabbinerne, og Rashi etter dem, mente at «stedet» var Moriafjellet, tempelets sted, og at stigen sto mellom Beer-Sjeba og Betel med Jerusalem i midten. Tempelhøyden ligger omtrent 16 km sør for Beitin."
  tl:
    - "Malapit sa bayan ng Luz, na pinalitan ni Jacob ng pangalang Beth-el, “bahay ng Dios”: inilalagay ito ng karamihan ng iskolar sa Beitin, hilaga ng Ramallah, mga 16 km sa hilaga ng Jerusalem sa tuwid na guhit, at doon nakatayo ang tuldok sa mapa. Umalis si Jacob sa Beer-seba patungong Haran; ang Beth-el ay nasa mga 84 km sa hilaga ng Beer-seba, mga tatlo o apat na araw na lakad, sa daan sa tagaytay ng mga burol. Ang Beitin ang karaniwang pagkakakilanlan ngunit hindi napatunayan: si D. P. Livingston, halimbawa, ay nangatwiran para sa el-Bireh, ilang kilometro sa timog-kanluran. May sariling pahina ang bayan; ang pahinang ito ay tungkol sa lugar ng panaginip."
    - "Hindi sinasabi ng Genesis na natulog si Jacob sa bayan. “Dumating sa isang dako, at nagparaan ng buong gabi roon, sapagka't lumubog na ang araw”, kumuha ng isa sa mga bato nito para sa unan, at nanaginip: “narito, ang isang hagdan, na ang puno ay nasa lupa, at ang dulo ay umaabot sa langit; at narito, ang mga anghel ng Dios na nagmamanhik manaog doon.” Paggising, sinabi niya, “hindi iba kundi bahay ng Dios, at ito ang pintuan ng langit”, itinayo ang bato bilang haligi at binuhusan ng langis. “Ang ipinangalan niya sa dakong yaon ay Betel: datapuwa't ang pangalan ng bayan nang una ay Luz.” Ginagamit ni Jesus ang larawan: “Makikita ninyong bukas ang langit, at ang mga anghel ng Dios na nagmamanhik-manaog sa ulunan ng Anak ng tao.”"
    - "Noong ikaapat na siglo, inilagay ni Eusebio ang Beth-el sa labindalawang milyang Romano mula sa Jerusalem sa daan patungong Neapolis, at idinagdag ni Jeronimo na may simbahang itinayo roon kung saan natulog si Jacob. Ibang paraan ang pagbasa ng tradisyong Judio: iginiit ng mga rabbi, at ni Rashi pagkatapos nila, na “ang dako” ay Bundok Moria, ang pook ng Templo, at na ang hagdan ay nakatayo sa pagitan ng Beer-seba at Beth-el na ang Jerusalem ay nasa gitna. Ang Bundok ng Templo ay nasa mga 16 km sa timog ng Beitin."
  da:
    - "Nær byen Luz, som Jakob omdøbte til Betel, »Guds hus«: de fleste forskere placerer den ved Beitin, nord for Ramallah, omkring 16 km nord for Jerusalem i luftlinje, og kortets punkt står der. Jakob var draget ud fra Beersheba til Karan; Betel ligger omkring 84 km nord for Beersheba, tre eller fire dages gang, på vejen langs bjergryggen. Beitin er den sædvanlige identifikation, men ikke en bevist: D. P. Livingston argumenterede for eksempel for el-Bireh, nogle få kilometer mod sydvest. Selve byen har sin egen side; denne handler om drømmens sted."
    - "Første Mosebog siger ikke, at Jakob sov i byen. Han »kom til et Sted og blev der om Natten, thi Solen var nedgangen«, tog en af stenene til hovedpude og drømte: »se, en Stige var oprejst paa Jorden, og det øverste deraf naaede til Himmelen, og se, Guds Engle stege op og ned ad den.« Da han vågnede, sagde han: »dette er ikke andet end Guds Hus, og dette er Himmelens Port«, rejste stenen som en mindesten og øste olie ovenpå. »Og han kaldte det samme Steds Navn Bethel, men ellers var Lus Stadens Navn fra Begyndelsen.« Jesus tager billedet op: »I skulle fra nu af se Himmelen aabnet og Guds Engle stige op og stige ned over Menneskesønnen.«"
    - "I 300-tallet placerede Eusebius Betel tolv romerske mil fra Jerusalem på vejen til Neapolis, og Hieronymus tilføjede, at en kirke var bygget dér, hvor Jakob sov. Jødisk tradition læste historien anderledes: rabbinerne, og Rashi efter dem, mente, at »stedet« var Morija-bjerget, Templets sted, og at stigen stod mellem Beersheba og Betel med Jerusalem midtvejs. Tempelbjerget ligger omkring 16 km syd for Beitin."
  sr:
    - "Близу града Луза, који је Јаков преименовао у Ветиљ, „кућа Божја“: већина научника смешта га у Бејтин, северно од Рамале, око 16 км северно од Јерусалима правом линијом, и тачка на карти стоји тамо. Јаков је кренуо из Вирсавеје у Харан; Ветиљ лежи око 84 км северно од Вирсавеје, три или четири дана пешке, на путу дуж гребена брда. Бејтин је уобичајено поистовећење, али није доказано: Д. П. Ливингстон је, на пример, заступао ел Бире, неколико километара југозападно. Сам град има своју страницу; ова је о месту сна."
    - "Постање не каже да је Јаков спавао у граду. „И дође на једно место, и онде заноћи, јер сунце беше зашло“, узео је камен на том месту за узглавље и сањао: „а то лестве стајаху на земљи а врхом тицаху у небо, и гле, анђели Божји по њима се пењаху и силажаху“. Пробудивши се, рекао је: „Овде је доиста кућа Божја, и ово су врата небеска“, поставио камен као стуб и прелио га уљем. „И прозва оно место Ветиљ, а пре беше име оном граду Луз.“ Исус преузима слику: „Одселе ћете видети небо отворено и анђеле Божије где се пењу и силазе к Сину човечијем.“"
    - "У 4. веку Јевсевије је смештао Ветиљ дванаест римских миља од Јерусалима на путу за Неапољ, а Јероним је додао да је ту подигнута црква где је Јаков спавао. Јеврејско предање причу је читало другачије: рабини, а за њима Раши, држали су да је „место“ гора Морија, место Храма, и да су лествице стајале између Вирсавеје и Ветиља с Јерусалимом на средини. Храмовна гора лежи око 16 км јужно од Бејтина."
