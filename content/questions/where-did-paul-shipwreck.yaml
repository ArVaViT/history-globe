id: where-did-paul-shipwreck
question:
  en: "Where was Paul shipwrecked?"
  ru: "Где потерпел кораблекрушение Павел?"
  uk: "Де зазнав корабельної аварії Павло?"
  es: "¿Dónde naufragó Pablo?"
  pt: "Onde Paulo naufragou?"
  de: "Wo erlitt Paulus Schiffbruch?"
  fr: "Où Paul a-t-il fait naufrage ?"
  pl: "Gdzie rozbił się okręt Pawła?"
  it: "Dove naufragò Paolo?"
  nl: "Waar leed Paulus schipbreuk?"
  cs: "Kde ztroskotala Pavlova loď?"
  sv: "Var led Paulus skeppsbrott?"
  nb: "Hvor forliste Paulus?"
  tl: "Saan nawasak ang barko ni Pablo?"
answer:
  en:
    - "Paul's ship ran aground on Melita, which is usually identified with Malta, the island in the open sea south of Sicily; the exact bay is not known, and tradition places the wreck at St Paul's Bay on the north coast."
    - 'Acts tells that the ship, sailing from Fair Havens in Crete, was caught by the wind Euroclydon and "driven up and down in Adria" for fourteen nights before it ran aground and broke up; all on board reached land, and "when they were escaped, then they knew that the island was called Melita." The islanders showed them kindness, a viper fastened on Paul''s hand without harming him, and Publius, "the chief man of the island", lodged them. After three months they sailed on in an Alexandrian ship that had wintered there, by Syracuse and Rhegium to Puteoli.'
    - 'That Melita is Malta is the usual view: Adria then meant the open sea between Greece, Italy and Africa, not only today''s Adriatic; a ship driven west from Crete by a north-easterly gale would reach Malta in about two weeks, as James Smith reckoned in 1848; an Alexandrian ship would winter there on its way to Italy; and inscriptions from Malta give the title "first" of the Melitans that Acts uses of Publius. Since the tenth century some have placed the wreck on Mljet, another Melite, in the Adriatic, and other islands have been proposed. The voyage is dated to the autumn of AD 59 and the winter that followed on the usual chronology.'
  ru:
    - "Корабль Павла сел на мель у Мелита, который обычно отождествляют с Мальтой — островом в открытом море к югу от Сицилии; точная бухта неизвестна, предание помещает крушение в бухту Святого Павла на северном берегу."
    - "Деяния рассказывают, что корабль, вышедший из Хороших Пристаней на Крите, подхватил ветер эвроклидон, четырнадцать ночей корабль носило по морю — «в Адриатическом море», как сказано в Деяниях, — пока он не сел на мель и не разбился; все добрались до берега, и «спасшись же, бывшие с Павлом узнали, что остров называется Мелит». Жители приняли их с человеколюбием, ехидна повисла на руке Павла, не причинив вреда, а Публий, «начальник острова», дал им приют. Через три месяца они отплыли на александрийском корабле, зимовавшем там, через Сиракузы и Ригию в Путеол."
    - "Что Мелит — это Мальта, общепринятое мнение: «Адрия» тогда означала открытое море между Грецией, Италией и Африкой, а не только нынешнюю Адриатику; корабль, гонимый северо-восточным штормом от Крита на запад, дошёл бы до Мальты примерно за две недели, как подсчитал Джеймс Смит в 1848 году; александрийский корабль зимовал бы там на пути в Италию; а надписи с Мальты дают титул «первого» среди мелитян, который Деяния прилагают к Публию. С X века некоторые помещают крушение на Млет, другой Мелит, в Адриатике; предлагались и иные острова. По обычной хронологии плавание относят к осени 59 г. н. э. и следующей за ней зиме."
  uk:
    - "Корабель Павла сів на мілину біля Мелити, яку зазвичай ототожнюють із Мальтою, островом у відкритому морі на південь від Сицилії; точна бухта невідома, і традиція ставить аварію в бухті святого Павла на північному узбережжі."
    - "Дії розповідають, що корабель, який плив із Добрих Пристаней на Криті, потрапив під вітер Євроклидон і «носило нас по Адриятицькому морю» чотирнадцять ночей, перш ніж сісти на мілину й розбитися; усі на борту дісталися землі, і «Спасши ся ж довідались, що остров зветь ся Мелит». Остров'яни виявили доброту, гадюка вчепилася в руку Павла, не заподіявши шкоди, а землі «першого на острові, на ймя Публия» були поряд, і він прийняв їх. Через три місяці вони відпливли далі александрійським кораблем, що там зимував, через Сиракузи та Регій до Путеол."
    - "Що Мелита — це Мальта, є звичайним поглядом: Адрія тоді означала відкрите море між Грецією, Італією та Африкою, а не лише нинішнє Адріатичне; корабель, який північно-східний шторм гнав на захід від Крита, дістався б Мальти приблизно за два тижні, як обчислив Джеймс Сміт 1848 р.; александрійський корабель зимував би там дорогою в Італію; а написи з Мальти дають титул «перший» мелітців, який Дії вживають про Публія. Від X ст. дехто ставить аварію на Млеті, іншій Меліті, в Адріатиці, і пропонували й інші острови. Подорож датують осінню 59 р. н. е. та зимою, що настала по ній, за звичною хронологією."
  es:
    - "El barco de Pablo encalló en Melita, que suele identificarse con Malta, la isla en mar abierto al sur de Sicilia; la bahía exacta no se conoce, y la tradición sitúa el naufragio en la bahía de San Pablo, en la costa norte."
    - "Hechos cuenta que la nave, que navegaba desde Buenos Puertos, en Creta, fue sorprendida por el viento Euroclidón y «llevados por el mar Adriático» durante catorce noches antes de encallar y deshacerse; todos los que iban a bordo llegaron a tierra, y «cuando escapamos, entonces supimos que la isla se llamaba Melita». Los isleños mostraron bondad, una víbora se prendió de la mano de Pablo sin dañarlo, y Publio, «el principal de la isla», los hospedó. Pasados tres meses, zarparon en una nave alejandrina que había invernado allí, por Siracusa y Regio hasta Puteoli."
    - "Que Melita es Malta es la opinión habitual: Adria significaba entonces el mar abierto entre Grecia, Italia y África, no solo el actual Adriático; una nave arrastrada hacia el oeste desde Creta por un temporal del nordeste llegaría a Malta en unas dos semanas, como calculó James Smith en 1848; una nave alejandrina invernaría allí en su camino a Italia; y las inscripciones de Malta dan el título de «primero» de los melitenses que Hechos usa de Publio. Desde el siglo X algunos han situado el naufragio en Mljet, otra Melite, en el Adriático, y se han propuesto otras islas. El viaje se fecha en el otoño del 59 d. C. y el invierno siguiente, según la cronología habitual."
  pt:
    - "O navio de Paulo encalhou em Melita, geralmente identificada com Malta, a ilha em mar aberto ao sul da Sicília; a baía exata não se conhece, e a tradição situa o naufrágio na baía de São Paulo, na costa norte."
    - "Atos conta que o navio, partindo de Bons Portos, em Creta, foi apanhado pelo vento Euroclidão e “levado de um lado para outro no mar Adriático” por catorze noites antes de encalhar e se despedaçar; todos a bordo chegaram à terra, e “depois que escapamos, eles descobriram que a ilha se chamava Malta”. Os ilhéus mostraram bondade, uma víbora se prendeu à mão de Paulo sem o ferir, e Públio, “o homem principal da ilha”, os hospedou. Após três meses seguiram em um navio de Alexandria que passara o inverno ali, por Siracusa e Régio até Putéoli."
    - "Que Melita seja Malta é a opinião usual: Adria significava então o mar aberto entre a Grécia, a Itália e a África, não só o Adriático de hoje; um navio levado para oeste desde Creta por uma ventania de nordeste chegaria a Malta em cerca de duas semanas, como calculou James Smith em 1848; um navio de Alexandria invernaria ali a caminho da Itália; e inscrições de Malta trazem o título de “primeiro” dos melitenses que Atos usa de Públio. Desde o século X alguns situaram o naufrágio em Mljet, outra Melite, no Adriático, e outras ilhas foram propostas. A viagem é datada do outono de 59 d.C. e o inverno seguinte, pela cronologia usual."
  de:
    - "Das Schiff des Paulus lief vor Melite auf Grund, das meist mit Malta gleichgesetzt wird, der Insel im offenen Meer südlich von Sizilien; die genaue Bucht ist nicht bekannt, und die Überlieferung verlegt das Wrack in die St.-Pauls-Bucht an der Nordküste."
    - "Die Apostelgeschichte erzählt, das Schiff sei, von Schönhafen auf Kreta aus segelnd, vom Sturm ergriffen worden – „eine Windsbraut, die man nennt Nordost“ –, vierzehn Nächte „im Adria-Meer“ umhergetrieben, bis es auf Grund lief und zerbrach; alle an Bord erreichten das Land, und „da wir gerettet waren, erfuhren wir, daß die Insel Melite hieß“. Die Inselbewohner erwiesen ihnen Freundschaft, eine Viper biss sich an Pauli Hand fest, ohne ihm zu schaden, und Publius, „der Oberste der Insel“, nahm sie auf. Nach drei Monaten fuhren sie in einem alexandrinischen Schiff weiter, das dort überwintert hatte, über Syrakus und Rhegion nach Puteoli."
    - "Dass Melite Malta ist, ist die übliche Ansicht: Adria bedeutete damals das offene Meer zwischen Griechenland, Italien und Afrika, nicht nur die heutige Adria; ein von Kreta nach Westen getriebenes Schiff erreichte bei einem Nordoststurm Malta in etwa zwei Wochen, wie James Smith 1848 berechnete; ein alexandrinisches Schiff würde dort auf dem Weg nach Italien überwintern; und Inschriften aus Malta geben den Titel „der Erste“ der Melitenser, den die Apostelgeschichte von Publius verwendet. Seit dem 10. Jahrhundert haben manche das Wrack auf Mljet gelegt, ein anderes Melite in der Adria, und weitere Inseln wurden vorgeschlagen. Die Fahrt wird nach der üblichen Chronologie auf den Herbst 59 n. Chr. und den folgenden Winter datiert."
  fr:
    - "Le navire de Paul s’échoua à Mélita, d’ordinaire identifiée à Malte, l’île en haute mer au sud de la Sicile ; la baie exacte n’est pas connue, et la tradition place le naufrage dans la baie Saint-Paul, sur la côte nord."
    - "Les Actes racontent que le navire, parti de Beaux-Ports, en Crète, fut saisi par le vent Euraquilon puis, la quatorzième nuit, « tandis que nous étions ballottés sur l’Adriatique », s’échoua et se disloqua ; tous les passagers gagnèrent la terre, et « Après nous être sauvés, nous reconnûmes que l’île s’appelait Malte. » Les insulaires les traitèrent avec bonté, une vipère s’attacha à la main de Paul sans lui faire de mal, et Publius, « principal personnage de l’île », les logea. Après trois mois, ils repartirent sur un navire d’Alexandrie qui avait passé l’hiver là, par Syracuse et Rhegium jusqu’à Pouzzoles."
    - "L’identification de Mélita à Malte est l’opinion courante : l’Adria désignait alors la haute mer entre la Grèce, l’Italie et l’Afrique, et non seulement l’Adriatique actuelle ; un navire chassé vers l’ouest depuis la Crète par une tempête de nord-est atteindrait Malte en deux semaines environ, comme James Smith le calcula en 1848 ; un navire d’Alexandrie y hivernerait en route vers l’Italie ; et des inscriptions de Malte donnent le titre de « premier » des Mélitains que les Actes appliquent à Publius. Depuis le Xe siècle, certains placent le naufrage à Mljet, autre Mélite, dans l’Adriatique, et d’autres îles ont été proposées. Le voyage est daté de l’automne 59 apr. J.-C. et de l’hiver suivant, selon la chronologie habituelle."
  pl:
    - "Okręt Pawła osiadł na mieliźnie na Melicie, którą zwykle utożsamia się z Maltą, wyspą na otwartym morzu na południe od Sycylii; dokładna zatoka nie jest znana, a tradycja umieszcza rozbicie w Zatoce św. Pawła na wybrzeżu północnym."
    - "Dzieje opowiadają, że okręt płynący z Pięknych Przystani na Krecie ogarnął wiatr, „który zowią Euroklidon”, i że „myśmy się błąkali po morzu Adryjatyckiem” przez czternaście nocy, zanim osiadł na mieliźnie i się rozpadł; wszyscy na pokładzie dotarli na ląd, a „gdy zdrowo uszli, dopiero poznali, iż onę wyspę Melitą nazywano.” Wyspiarze okazali im życzliwość, żmija przyczepiła się do ręki Pawła, nie czyniąc mu szkody, a Publiusz, „przedniejszy onej wyspy”, dał im gospodę. Po trzech miesiącach popłynęli dalej okrętem aleksandryjskim, który tam zimował, przez Syrakuzy i Region do Puteoli."
    - "Że Melita to Malta, jest poglądem zwykłym: Adria oznaczała wtedy otwarte morze między Grecją, Italią i Afryką, nie tylko dzisiejszy Adriatyk; okręt pędzony na zachód od Krety północno-wschodnim sztormem dotarłby na Maltę w około dwa tygodnie, jak obliczył James Smith w 1848; okręt aleksandryjski zimowałby tam w drodze do Italii; a napisy z Malty podają tytuł „pierwszy” Melitańczyków, którego Dzieje używają wobec Publiusza. Od X wieku niektórzy umieszczają rozbicie na Mljecie, innej Melite, na Adriatyku, i proponowano inne wyspy. Podróż datuje się na jesień 59 n.e. i następującą po niej zimę według zwykłej chronologii."
  it:
    - "La nave di Paolo si incagliò a Melita, di solito identificata con Malta, l’isola in mare aperto a sud della Sicilia; la baia esatta non è nota, e la tradizione colloca il naufragio nella baia di San Paolo sulla costa nord."
    - "Gli Atti raccontano che la nave, salpata da Buoni Porti a Creta, fu presa dal vento turbinoso detto «Euraquilone», e che furono «portati qua e là per l’Adriatico» per quattordici notti prima che si incagliasse e si sfasciasse; tutti a bordo raggiunsero la terra, e «dopo che fummo scampati, riconoscemmo che l’isola si chiamava Malta». Gli isolani mostrarono bontà, una vipera si attaccò alla mano di Paolo senza fargli male, e Publio, «l’uomo principale dell’isola», li ospitò. Dopo tre mesi ripartirono su una nave alessandrina che aveva svernato lì, per Siracusa e Reggio fino a Pozzuoli."
    - "Che Melita sia Malta è l’opinione abituale: Adria significava allora il mare aperto tra la Grecia, l’Italia e l’Africa, non solo l’odierno Adriatico; una nave spinta a ovest da Creta da una tempesta di nord-est raggiungerebbe Malta in circa due settimane, come calcolò James Smith nel 1848; una nave alessandrina vi svernerebbe nel suo viaggio verso l’Italia; e iscrizioni di Malta danno il titolo di «primo» dei Melitesi che gli Atti usano per Publio. Dal X secolo alcuni hanno collocato il naufragio a Mljet, un’altra Melite, nell’Adriatico, e sono state proposte altre isole. Il viaggio è datato all’autunno del 59 d.C. e l’inverno seguente secondo la cronologia abituale."
  nl:
    - "Het schip van Paulus liep aan de grond op Melite, dat gewoonlijk met Malta wordt vereenzelvigd, het eiland in open zee ten zuiden van Sicilië; de precieze baai is niet bekend, en de overlevering plaatst de schipbreuk in Sint-Paulusbaai aan de noordkust."
    - "Handelingen vertelt dat het schip, dat van Schone Havens op Kreta uitvoer, werd gegrepen door “een stormwind, genaamd Euroklydon” en “in de Adriatische zee herwaarts en derwaarts gedreven werd” gedurende veertien nachten voordat het aan de grond liep en uiteenbrak; allen aan boord bereikten het land, en “als zij ontkomen waren, toen verstonden zij, dat het eiland Melite heette.” De eilandbewoners betoonden vriendelijkheid, een adder beet zich vast in Paulus’ hand zonder hem te schaden, en Publius, “de voornaamste van het eiland”, herbergde hen. Na drie maanden voeren zij verder in een Alexandrijns schip dat daar had overwinterd, via Syracuse en Regium naar Puteoli."
    - "Dat Melite Malta is, is de gebruikelijke opvatting: Adria betekende toen de open zee tussen Griekenland, Italië en Afrika, niet alleen de huidige Adriatische Zee; een schip dat door een noordoostelijke storm van Kreta naar het westen werd gedreven, zou Malta in ongeveer twee weken bereiken, zoals James Smith in 1848 berekende; een Alexandrijns schip zou er op weg naar Italië overwinteren; en inscripties van Malta geven de titel “eerste” van de Melitanen die Handelingen voor Publius gebruikt. Sinds de tiende eeuw plaatsen sommigen de schipbreuk op Mljet, een ander Melite, in de Adriatische Zee, en andere eilanden zijn voorgesteld. De reis wordt gedateerd in het najaar van 59 n.Chr. en de winter erna, volgens de gebruikelijke chronologie."
  cs:
    - "Pavlova loď najela na mělčinu u Melity, která se obvykle ztotožňuje s Maltou, ostrovem na otevřeném moři jižně od Sicílie; přesná zátoka není známa a tradice klade ztroskotání do Zátoky svatého Pavla na severním pobřeží."
    - "Skutky vyprávějí, že loď plující z Dobrých přístavů na Krétě zachvátil vítr Euroklydon a čtrnáct nocí se vezla „po moři Adriatickém“, než najela na mělčinu a rozpadla se; všichni na palubě dosáhli země a „zachováni jsouce, teprv poznali, že ostrov ten sloul Melita.“ Ostrované projevili laskavost, zmije se zavěsila na Pavlovu ruku, aniž mu ublížila, a Publius, „kníže toho ostrova“, je ubytoval. Po třech měsících se plavili dál na alexandrijské lodi, která tam přezimovala, přes Syrakusy a Regium do Puteol."
    - "Že Melita je Malta, je obvyklé mínění: Adria tehdy znamenala otevřené moře mezi Řeckem, Itálií a Afrikou, nejen dnešní Jadran; loď hnaná z Kréty na západ severovýchodní bouří by dosáhla Malty asi za dva týdny, jak vypočítal James Smith roku 1848; alexandrijská loď by tam přezimovala na cestě do Itálie; a nápisy z Malty dávají titul „první“ Melitských, jehož Skutky užívají o Publiovi. Od 10. století někteří kladou ztroskotání na Mljet, jinou Melitu v Jadranu, a navrženy byly i jiné ostrovy. Plavba se podle obvyklé chronologie datuje na podzim roku 59 n. l. a zimu, která následovala."
  sv:
    - "Paulus skepp gick på grund vid Melite, som vanligen identifieras med Malta, ön i öppet hav söder om Sicilien; den exakta viken är inte känd, och traditionen förlägger skeppsbrottet till Sankt Pauls bukt på norra kusten."
    - "Apostlagärningarna berättar att skeppet, som seglade från Goda hamnarna på Kreta, grep nordostorkanen och ”den fjortonde natten drevo omkring på Adriatiska havet” innan det gick på grund och bröts sönder; alla ombord nådde land, och ”först sedan vi hade blivit räddade, fingo vi veta att ön hette Malta”. Öborna visade dem vänlighet, en huggorm fastnade på Paulus hand utan att skada honom, och Publius, ”den förnämste mannen på ön”, gav dem härbärge. Efter tre månader seglade de vidare med ett alexandrinskt skepp som hade övervintrat där, via Syrakusa och Rhegion till Puteoli."
    - "Att Melite är Malta är den vanliga uppfattningen: Adria betydde då det öppna havet mellan Grekland, Italien och Afrika, inte bara dagens Adriatiska havet; ett skepp som drevs västerut från Kreta av en nordostlig storm skulle nå Malta på omkring två veckor, som James Smith räknade ut 1848; ett alexandrinskt skepp skulle övervintra där på väg till Italien; och inskriptioner från Malta ger titeln ”den förste” åt melitenserna, som Apostlagärningarna använder om Publius. Sedan 900-talet har några förlagt skeppsbrottet till Mljet, ett annat Melite, i Adriatiska havet, och andra öar har föreslagits. Resan dateras till hösten 59 e.Kr. och vintern därpå enligt den vanliga kronologin."
  nb:
    - "Paulus' skip gikk på grunn ved Melita, som vanligvis identifiseres med Malta, øya i åpent hav sør for Sicilia; den nøyaktige bukten er ikke kjent, og tradisjonen plasserer forliset i Sankt Pauls bukt på nordkysten."
    - "Apostlenes gjerninger forteller at skipet, som seilte fra Godhavn på Kreta, ble grepet av vinden eurakylon og «drev omkring i Adriaterhavet» i fjorten netter før det gikk på grunn og brakk i stykker; alle om bord kom i land, og «Da vi nu hadde berget oss, fikk vi vite at øen hette Malta.» Øyboerne viste vennlighet, en hoggorm festet seg på Paulus' hånd uten å skade ham, og Publius, «den første mann på øen», lot dem bo hos seg. Etter tre måneder seilte de videre med et skip fra Aleksandria som hadde overvintret der, via Syrakus og Regium til Puteoli."
    - "At Melita er Malta, er det vanlige synet: Adria betydde den gang det åpne havet mellom Hellas, Italia og Afrika, ikke bare dagens Adriaterhav; et skip drevet vestover fra Kreta av en nordøstlig storm ville nå Malta på omtrent to uker, slik James Smith regnet i 1848; et skip fra Aleksandria ville overvintre der på vei til Italia; og innskrifter fra Malta gir tittelen «den første» for melitenerne som Apostlenes gjerninger bruker om Publius. Siden 900-tallet har noen plassert forliset på Mljet, en annen Melite, i Adriaterhavet, og andre øyer er foreslått. Reisen dateres til høsten 59 e.Kr. og vinteren etter, etter den vanlige kronologien."
  tl:
    - "Sumadsad ang barko ni Pablo sa Melita, na karaniwang kinikilala sa Malta, ang pulo sa bukas na dagat sa timog ng Sicilia; hindi alam ang eksaktong look, at inilalagay ng tradisyon ang pagkawasak sa Look ni San Pablo sa hilagang baybayin."
    - "Isinasalaysay ng Mga Gawa na ang barko, na naglalayag mula sa Mabubuting Daongan sa Creta, ay nahuli ng hanging Euraclidon at “ipinapadpad ng hangin sa magkabikabila ng Dagat ng Adriatico” sa loob ng labing-apat na gabi bago sumadsad at nawasak; lahat ng sakay ay nakarating sa lupa, at “nang kami'y mangakatakas na, nang magkagayo'y napagtalastas namin na ang pulo'y tinatawag na Melita.” Pinagpakitaan sila ng kabaitan ng mga taga-pulo, kumagat sa kamay ni Pablo ang isang ulupong nang hindi siya sinasaktan, at si Publio, “ang pangulo sa pulong yaon”, ang tumanggap sa kanila. Pagkaraan ng tatlong buwan, naglayag sila sa barkong Alejandrino na nagpalipas ng taglamig doon, sa Siracusa at Regio hanggang sa Puteoli."
    - "Karaniwang pananaw na ang Melita ay Malta: ang Adria noon ay nangangahulugang bukas na dagat sa pagitan ng Grecia, Italia at Aprika, hindi lamang ang Adriatico ngayon; ang barkong itinaboy pakanluran mula sa Creta ng bagyong hilagang-silangan ay aabot sa Malta sa mga dalawang linggo, gaya ng kinuwenta ni James Smith noong 1848; magpapalipas ng taglamig doon ang isang barkong Alejandrino patungong Italia; at ang mga inskripsiyon mula sa Malta ay nagbibigay ng titulong “una” ng mga taga-Melita na ginagamit ng Mga Gawa kay Publio. Mula noong ikasampung siglo, inilagay ng ilan ang pagkawasak sa Mljet, isa pang Melite, sa Adriatico, at may iba pang pulong iminungkahi. Itinatakda ang paglalayag sa taglagas ng 59 AD at ang taglamig na sumunod ayon sa karaniwang kronolohiya."
