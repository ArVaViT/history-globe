id: where-was-the-ark-of-the-covenant-kept
question:
  en: "Where was the Ark of the Covenant kept?"
  ru: "Где хранился ковчег завета?"
  uk: "Де зберігався Ковчег Заповіту?"
  es: "¿Dónde se guardaba el Arca de la Alianza?"
  pt: "Onde era guardada a Arca da Aliança?"
  de: "Wo wurde die Bundeslade aufbewahrt?"
  fr: "Où était conservée l’arche de l’alliance ?"
  pl: "Gdzie przechowywano Arkę Przymierza?"
  it: "Dove fu custodita l’Arca dell’Alleanza?"
  cs: "Kde byla uložena truhla smlouvy?"
  nl: "Waar werd de ark van het verbond bewaard?"
  sv: "Var förvarades förbundsarken?"
  nb: "Hvor ble paktens ark oppbevart?"
  tl: "Saan iningatan ang Kaban ng Tipan?"
answer:
  en:
    - "The ark was made at Sinai and carried through the wilderness in the tabernacle; after the crossing of the Jordan it stood at Gilgal and then, for the age of the judges, at Shiloh. Captured by the Philistines in the battle by Ebenezer, it was taken to Ashdod, Gath and Ekron, sent back from Ekron on a cart to Beth-shemesh, 12 km away, and from there carried up to Kiriath-jearim, where the map point stands: Deir el-Azar above Abu Ghosh, 13 km west of Jerusalem. There it stayed some twenty years until David brought it to Jerusalem, and Solomon set it in the Holy of Holies of the Temple, about 959 BC. After Solomon's day the Old Testament mentions it only twice more, and what became of it when the Babylonians burned the Temple in 587 or 586 BC is not recorded."
    - "Samuel tells the last stages: “And the men of Kirjath-jearim came, and fetched up the ark of the LORD, and brought it into the house of Abinadab in the hill, and sanctified Eleazar his son to keep the ark of the LORD. And it came to pass, while the ark abode in Kirjath-jearim, that the time was long; for it was twenty years”. Of the Temple Kings says that “the priests brought in the ark of the covenant of the LORD unto his place, into the oracle of the house, to the most holy place, even under the wings of the cherubims”. Josiah told the Levites, “Put the holy ark in the house which Solomon the son of David king of Israel did build”, and Jeremiah foresaw a day when “they shall say no more, The ark of the covenant of the LORD: neither shall it come to mind”."
    - "Where it is now has been asked ever since. It is absent from the lists of Temple vessels carried to Babylon; 2 Maccabees says that Jeremiah hid it in a cave on Mount Nebo; the Mishnah tells of its being hidden under the floor of a Temple chamber, while a rabbinic view in the Talmud has it taken to Babylon; Josephus says that the Holy of Holies of Herod's Temple held nothing at all. The Ethiopian Kebra Nagast has Menelik, son of Solomon and the queen of Sheba, carry it to Aksum, where the church of Our Lady Mary of Zion claims to keep it, unseen by all but its guardian. Revelation sees it in the temple in heaven. At Kiriath-jearim Israel Finkelstein and Thomas Römer, excavating in 2017 and 2019, found a great platform of the eighth century BC on the summit, under the church of Our Lady of the Ark of the Covenant built in 1924."
  ru:
    - "Ковчег сделали у Синая и несли через пустыню в скинии; после перехода через Иордан он стоял в Галгале, а затем, в эпоху судей, в Силоме. Захваченный филистимлянами в битве у Авен-Езера, он побывал в Азоте, Гефе и Екроне, был отправлен из Екрона на колеснице в Вефсамис, за 12 км, а оттуда перенесён в Кириаф-Иарим, где стоит точка на карте: Дейр-эль-Азар над Абу-Гошем, в 13 км к западу от Иерусалима. Там он пробыл около двадцати лет, пока Давид не перенёс его в Иерусалим, а Соломон поставил его во Святом Святых Храма, около 959 г. до н. э. После Соломона Ветхий Завет упоминает его лишь дважды, и что стало с ним, когда вавилоняне сожгли Храм в 587 или 586 г. до н. э., нигде не сказано."
    - "Книга Царств рассказывает о последних переходах: «И пришли жители Кириаф-Иарима, и взяли ковчег Господа, и принесли его в дом Аминадава, на холм, а Елеазара, сына его, посвятили, чтобы он хранил ковчег Господа. С того дня, как остался ковчег в Кириаф-Иариме, прошло много времени, лет двадцать». О Храме сказано: «И внесли священники ковчег завета Господня на место его, в давир храма, во Святое Святых, под крылья херувимов». Иосия велел левитам: «поставьте ковчег святый в храме, который построил Соломон, сын Давидов, царь Израилев», а Иеремия предвидел день, когда «не будут говорить более: “ковчег завета Господня”; он и на ум не придет»."
    - "Где он теперь, спрашивают с тех самых пор. Его нет в списках храмовой утвари, увезённой в Вавилон; Вторая книга Маккавейская говорит, что Иеремия спрятал его в пещере на горе Нево; Мишна рассказывает, что он скрыт под полом одной из храмовых палат, а одно из мнений в Талмуде — что его увезли в Вавилон; Иосиф Флавий пишет, что во Святом Святых Иродова Храма не было ничего. Эфиопская «Кебра Нагаст» ведёт его с Менеликом, сыном Соломона и царицы Савской, в Аксум, где церковь Марии Сионской утверждает, что хранит его, никому, кроме хранителя, не показывая. Откровение видит его в небесном храме. В Кириаф-Иариме Израэль Финкельштейн и Томас Рёмер, копавшие в 2017 и 2019 годах, нашли на вершине большую платформу VIII века до н. э. — под церковью Божией Матери Ковчега Завета, построенной в 1924 году."
  uk:
    - "Ковчег було виготовлено на Синаї й носили пустелею в скинії; після переправи через Йордан він стояв у Гілгалі, а потім, за доби суддів, у Шіло. Захоплений філістимлянами в битві біля Авен-Езера, він був доправлений до Ашдода, Гата й Екрона, надісланий з Екрона на возі до Бет-Шемеша, за 12 км, а звідти піднесений до Кіріят-Єарима, де стоїть точка на мапі: Дейр-ель-Азар над Абу-Гошем, за 13 км на захід від Єрусалима. Там він пробув близько двадцяти років, поки Давид не привіз його до Єрусалима, а Соломон поставив його в Святому святих Храму близько 959 р. до н. е. Після Соломонових днів Старий Заповіт згадує його ще лише двічі, а що з ним сталося, коли вавилоняни спалили Храм 587 або 586 р. до н. е., не записано."
    - "Книга Самуїла розповідає останні етапи: «І прийшли осадники з Киріятяриму та й узяли скриню Господню, і принесли її в Абинадабову господу, на узгіррє, та й посьвятили сина його Елеазара на те, щоб він доглядав скринї Господньої. ... З того часу, як пробував ковчег у Киріят-Яримі уплило часу немало, двайцять год.» Про Храм Книга Царів каже, що «внесли сьвященники скриню завіту Господнього на її місце, у Сьвяте Сьвятих під крила херувимів». Йосія сказав левітам: «Поставте скриню сьвяту в храмі, що його збудував Соломон, син Давидів, царь Ізрайлїв», а Єремія передбачив день, коли «не мовляти муть: „скриня завіту Господнього“; й на думку нїкому не прийде вона»."
    - "Де вона тепер — питають відтоді. Її немає в списках храмового начиння, вивезеного до Вавилона; Друга книга Макавеїв каже, що Єремія сховав її в печері на горі Нево; Мішна розповідає про те, що її сховали під підлогою храмової кімнати, тоді як рабинський погляд у Талмуді твердить, що її вивезли до Вавилона; Йосиф Флавій каже, що Святе святих Іродового Храму не містило нічого. Ефіопська «Кебра Нагаст» розповідає, що Менелік, син Соломона й цариці Шеви, відвіз її до Аксума, де церква Святої Марії Сіонської стверджує, що зберігає її, невидиму ніким, окрім її охоронця. Одкровення бачить її в небесному храмі. У Кіріят-Єаримі Ізраїль Фінкельштейн і Томас Рьомер, розкопуючи 2017 і 2019 рр., знайшли на вершині велику платформу VIII ст. до н. е. під церквою Богоматері Ковчега Заповіту, збудованою 1924 р."
  es:
    - "El arca se hizo en el Sinaí y se llevó por el desierto en el tabernáculo; tras el paso del Jordán estuvo en Gilgal y luego, durante la época de los jueces, en Silo. Capturada por los filisteos en la batalla junto a Ebenezer, fue llevada a Asdod, Gat y Ecrón, enviada de vuelta desde Ecrón en un carro a Bet-semes, a 12 km, y de allí subida a Quiriat-jearim, donde está el punto del mapa: Deir el-Azar, sobre Abu Ghosh, a 13 km al oeste de Jerusalén. Allí estuvo unos veinte años hasta que David la llevó a Jerusalén, y Salomón la puso en el Santo de los Santos del Templo, hacia el 959 a. C. Después de los días de Salomón, el Antiguo Testamento solo la menciona dos veces más, y lo que fue de ella cuando los babilonios incendiaron el Templo en 587 o 586 a. C. no consta."
    - "Samuel cuenta las últimas etapas: «Y vinieron los de Chîriath-jearim, y llevaron el arca de Jehová, y metiéronla en casa de Abinadab, situada en el collado; y santificaron á Eleazar su hijo, para que guardase el arca de Jehová. Y aconteció que desde el día que llegó el arca á Chîriath-jearim pasaron muchos días, veinte años». Del Templo, Reyes dice que «los sacerdotes metieron el arca del pacto de Jehová en su lugar, en el oráculo de la casa, en el lugar santísimo, debajo de las alas de los querubines». Josías dijo a los levitas: «Poned el arca del santuario en la casa que edificó Salomón hijo de David, rey de Israel», y Jeremías previó un día en que «no se dirá más: Arca del pacto de Jehová; ni vendrá al pensamiento»."
    - "Dónde está ahora se pregunta desde entonces. No figura en las listas de utensilios del Templo llevados a Babilonia; 2 Macabeos dice que Jeremías la escondió en una cueva del monte Nebo; la Misná cuenta que se ocultó bajo el suelo de una cámara del Templo, y una opinión rabínica del Talmud sostiene que fue llevada a Babilonia; Josefo dice que el Santo de los Santos del Templo de Herodes no contenía nada. El Kebra Nagast etíope hace que Menelik, hijo de Salomón y de la reina de Seba, la lleve a Axum, donde la iglesia de Nuestra Señora María de Sion afirma custodiarla, sin que la vea nadie salvo su guardián. El Apocalipsis la ve en el templo del cielo. En Quiriat-jearim, Israel Finkelstein y Thomas Römer, excavando en 2017 y 2019, hallaron en la cima una gran plataforma del siglo VIII a. C., bajo la iglesia de Nuestra Señora del Arca de la Alianza, construida en 1924."
  pt:
    - "A arca foi feita no Sinai e levada pelo deserto no tabernáculo; depois da travessia do Jordão ficou em Gilgal e depois, durante a era dos juízes, em Siló. Capturada pelos filisteus na batalha junto a Ebenézer, foi levada a Asdode, Gate e Ecrom, devolvida de Ecrom num carro a Bete-Semes, a 12 km, e de lá levada para Quiriate-Jearim, onde está o ponto do mapa: Deir el-Azar, acima de Abu Ghosh, a 13 km a oeste de Jerusalém. Ali ficou cerca de vinte anos, até que Davi a trouxe a Jerusalém, e Salomão a pôs no Santo dos Santos do Templo, por volta de 959 a.C. Depois dos dias de Salomão, o Antigo Testamento só a menciona mais duas vezes, e o que foi dela quando os babilônios queimaram o Templo, em 587 ou 586 a.C., não está registrado."
    - "Samuel conta as últimas etapas: “Os homens de Quiriate-Jearim vieram, levaram a arca do SENHOR e a colocaram na casa de Abinadabe, na colina; e consagraram a Eleazar, seu filho, para guardar a arca do SENHOR. Desde o dia em que a arca ficou em Quiriate-Jearim, passou-se muito tempo — vinte anos se passaram”. Do Templo, Reis diz que “Os sacerdotes trouxeram a arca da aliança do SENHOR para o seu lugar, no santuário interior da casa, no lugar santíssimo, debaixo das asas dos querubins”. Josias disse aos levitas: “Coloquem a arca santa na casa que Salomão, filho de Davi, rei de Israel, construiu”, e Jeremias previu um dia em que “não dirão mais: ‘A arca da aliança do SENHOR!’ Ela não virá à mente”."
    - "Onde está agora é pergunta que se faz desde então. Ela está ausente das listas de utensílios do Templo levados para a Babilônia; 2 Macabeus diz que Jeremias a escondeu numa caverna no monte Nebo; a Mishná fala de sua ocultação sob o piso de uma câmara do Templo, enquanto uma opinião rabínica no Talmude a faz levada para a Babilônia; Josefo diz que o Santo dos Santos do Templo de Herodes não continha absolutamente nada. O Kebra Nagast etíope faz Menelik, filho de Salomão e da rainha de Sabá, levá-la a Aksum, onde a igreja de Nossa Senhora Maria de Sião afirma guardá-la, invisível a todos exceto ao seu guardião. O Apocalipse a vê no templo no céu. Em Quiriate-Jearim, Israel Finkelstein e Thomas Römer, escavando em 2017 e 2019, encontraram uma grande plataforma do século VIII a.C. no cume, sob a igreja de Nossa Senhora da Arca da Aliança, construída em 1924."
  de:
    - "Die Lade wurde am Sinai gebaut und in der Stiftshütte durch die Wüste getragen; nach der Überquerung des Jordans stand sie in Gilgal und dann, für das Zeitalter der Richter, in Silo. Von den Philistern in der Schlacht bei Eben-Eser erbeutet, wurde sie nach Aschdod, Gat und Ekron gebracht, von Ekron auf einem Wagen nach Bet-Schemesch zurückgeschickt, 12 km entfernt, und von dort nach Kirjat-Jearim hinaufgetragen, wo der Kartenpunkt steht: Deir el-Azar oberhalb von Abu Ghosch, 13 km westlich von Jerusalem. Dort blieb sie etwa zwanzig Jahre, bis David sie nach Jerusalem brachte und Salomo sie um 959 v. Chr. im Allerheiligsten des Tempels aufstellte. Nach Salomos Tagen erwähnt das Alte Testament sie nur noch zweimal, und was aus ihr wurde, als die Babylonier den Tempel 587 oder 586 v. Chr. verbrannten, ist nicht berichtet."
    - "Samuel erzählt die letzten Stationen: „Also kamen die Leute von Kirjath-Jearim und holten die Lade des HERRN hinauf und brachten sie ins Haus Abinadabs auf dem Hügel; und seinen Sohn Eleasar heiligten sie, daß er die Lade des HERRN hütete. Und von dem Tage an, da die Lade des HERRN zu Kirjath-Jearim blieb, verzog sich die Zeit so lange, bis es zwanzig Jahre wurden“. Vom Tempel sagen die Königsbücher: „Also brachten die Priester die Lade des Bundes des HERRN an ihren Ort, in den Chor des Hauses, in das Allerheiligste, unter die Flügel der Cherubim.“ Josia sagte den Leviten: „Tut die heilige Lade ins Haus, das Salomo, der Sohn Davids, der König Israels, gebaut hat“, und Jeremia sah einen Tag voraus, an dem man „nicht mehr sagen“ wird „von der Bundeslade des HERRN, auch ihrer nicht mehr gedenken“."
    - "Wo sie heute ist, fragt man seither. Sie fehlt in den Listen der nach Babylon geführten Tempelgeräte; nach 2. Makkabäer versteckte Jeremia sie in einer Höhle auf dem Berg Nebo; die Mischna lässt sie unter dem Boden einer Tempelkammer verborgen sein, eine rabbinische Ansicht im Talmud lässt sie nach Babylon bringen; Josephus sagt, das Allerheiligste des herodianischen Tempels habe nichts enthalten. Im äthiopischen Kebra Nagast trägt Menelik, Sohn Salomos und der Königin von Scheba, sie nach Aksum, wo die Kirche Unserer Lieben Frau Maria von Zion sie zu bewahren beansprucht, ungesehen außer von ihrem Wächter. Die Offenbarung sieht sie im Tempel im Himmel. In Kirjat-Jearim fanden Israel Finkelstein und Thomas Römer 2017 und 2019 auf dem Gipfel eine große Plattform des 8. Jahrhunderts v. Chr. unter der 1924 erbauten Kirche Unserer Lieben Frau von der Bundeslade."
  fr:
    - "L’arche fut faite au Sinaï et portée à travers le désert dans le tabernacle ; après le passage du Jourdain, elle se trouva à Guilgal, puis, pour l’époque des juges, à Silo. Prise par les Philistins lors de la bataille près d’Ében-Ézer, elle fut emmenée à Asdod, à Gath et à Ékron, renvoyée d’Ékron sur un chariot à Beth-Schémesch, à 12 km de là, puis conduite plus haut à Kirjath-Jearim, où se trouve le point de la carte : Deir el-Azar, au-dessus d’Abu Ghosh, à 13 km à l’ouest de Jérusalem. Elle y resta une vingtaine d’années jusqu’à ce que David l’amène à Jérusalem, et Salomon la plaça dans le Saint des saints du Temple, vers 959 av. J.-C. Après l’époque de Salomon, l’Ancien Testament ne la mentionne plus que deux fois, et ce qu’elle devint quand les Babyloniens incendièrent le Temple en 587 ou 586 av. J.-C. n’est pas consigné."
    - "Samuel raconte les dernières étapes : « Les gens de Kirjath-Jearim vinrent, et firent monter l’arche de l’Éternel ; ils la conduisirent dans la maison d’Abinadab, sur la colline, et ils consacrèrent son fils Éléazar pour garder l’arche de l’Éternel. Il s’était passé bien du temps depuis le jour où l’arche avait été déposée à Kirjath-Jearim. Vingt années s’étaient écoulées. » Du Temple, le livre des Rois dit que « Les sacrificateurs portèrent l’arche de l’alliance de l’Éternel à sa place, dans le sanctuaire de la maison, dans le lieu très saint, sous les ailes des chérubins ». Josias dit aux lévites : « Placez l’arche sainte dans la maison qu’a bâtie Salomon, fils de David, roi d’Israël », et Jérémie prévit un jour où « On ne parlera plus de l’arche de l’alliance de l’Éternel ; elle ne viendra plus à la pensée »."
    - "On se demande où elle est aujourd’hui. Elle est absente des listes des objets du Temple emportés à Babylone ; le deuxième livre des Maccabées dit que Jérémie la cacha dans une grotte du mont Nébo ; la Michna raconte qu’elle fut cachée sous le sol d’une salle du Temple, tandis qu’un avis du Talmud la fait emporter à Babylone ; Flavius Josèphe dit que le Saint des saints du Temple d’Hérode ne contenait rien. Le Kebra Nagast éthiopien fait emporter l’arche à Aksoum par Ménélik, fils de Salomon et de la reine de Schéba, où l’église Notre-Dame-Marie-de-Sion prétend la conserver, invisible à tous sauf à son gardien. L’Apocalypse la voit dans le temple au ciel. À Kirjath-Jearim, Israel Finkelstein et Thomas Römer, fouillant en 2017 et 2019, ont trouvé sur le sommet une grande plate-forme du VIIIe siècle av. J.-C., sous l’église Notre-Dame de l’Arche d’Alliance bâtie en 1924."
  pl:
    - "Arkę wykonano na Synaju i niesiono przez pustynię w przybytku; po przeprawie przez Jordan stała w Gilgal, a potem, w epoce sędziów, w Szilo. Zdobyta przez Filistynów w bitwie pod Eben-Ezer, została zabrana do Aszdodu, Gat i Ekronu, odesłana z Ekronu na wozie do Bet-Szemesz, 12 km dalej, a stamtąd wniesiona do Kiriat-Jearim, gdzie stoi punkt na mapie: Deir el-Azar nad Abu Ghosh, 13 km na zachód od Jerozolimy. Pozostała tam około dwudziestu lat, aż Dawid sprowadził ją do Jerozolimy, a Salomon umieścił ją w Świętym Świętych Świątyni, około 959 p.n.e. Po czasach Salomona Stary Testament wspomina o niej jeszcze tylko dwa razy, a co się z nią stało, gdy Babilończycy spalili Świątynię w 587 lub 586 p.n.e., nie jest zapisane."
    - "Księga Samuela opowiada ostatnie etapy: „Przyszli tedy mężowie z Karyjatyjarym, i odwieźli skrzynię Pańską, a wnieśli ją do domu Abinadabowego w Gabaa; a Eleazara syna jego poświęcili, aby strzegł skrzyni Pańskiej. I stało się, gdy od onego dnia, jako została skrzynia w Karyjatyjarym, wyszedł niemały czas, to jest dwadzieścia lat”. O Świątyni Księga Królewska mówi, że „wnieśli tedy kapłani skrzynię przymierza Pańskiego na miejsce jej do wnętrznego domu, do świątnicy świętych, pod skrzydła Cherubinów”. Jozjasz powiedział Lewitom: „Postawcie skrzynię świętą w domu, który zbudował Salomon, syn Dawidowy, król Izraelski”, a Jeremiasz przewidział dzień, gdy „nie będą więcej mówić: Skrzynia przymierza Pańskiego, ani wstąpi na serce”."
    - "Gdzie jest teraz, pytano od zawsze. Brak jej na listach naczyń świątynnych zabranych do Babilonu; Druga Księga Machabejska mówi, że Jeremiasz ukrył ją w jaskini na górze Nebo; Miszna opowiada o ukryciu jej pod podłogą komnaty Świątyni, podczas gdy pogląd rabiniczny w Talmudzie głosi, że zabrano ją do Babilonu; Józef Flawiusz mówi, że Święte Świętych Świątyni Heroda nie zawierało nic. Etiopski Kebra Nagast każe Menelikowi, synowi Salomona i królowej Szeby, zanieść ją do Aksum, gdzie kościół Najświętszej Maryi z Syjonu twierdzi, że ją przechowuje, niewidzianą przez nikogo prócz jej strażnika. Apokalipsa widzi ją w świątyni w niebie. W Kiriat-Jearim Israel Finkelstein i Thomas Römer, prowadząc wykopaliska w 2017 i 2019, znaleźli na szczycie wielką platformę z VIII wieku p.n.e., pod kościołem Matki Bożej Arki Przymierza zbudowanym w 1924."
  it:
    - "L’arca fu fatta al Sinai e portata attraverso il deserto nel tabernacolo; dopo il passaggio del Giordano stette a Gàlgala e poi, per l’età dei giudici, a Silo. Catturata dai Filistei nella battaglia presso Eben-Ezer, fu portata ad Asdod, Gat ed Ekron, rimandata da Ekron su un carro a Bet-Semes, a 12 km di distanza, e da lì trasportata a Kiriat-Iearim, dove si trova il punto della mappa: Deir el-Azar sopra Abu Ghosh, a 13 km a ovest di Gerusalemme. Lì rimase una ventina d’anni finché Davide la portò a Gerusalemme, e Salomone la pose nel Santo dei Santi del Tempio, verso il 959 a.C. Dopo i giorni di Salomone l’Antico Testamento la menziona solo altre due volte, e che cosa ne sia stato quando i Babilonesi incendiarono il Tempio nel 587 o 586 a.C. non è riferito."
    - "Samuele racconta le ultime tappe: «Que’ di Kiriath-Jearim vennero, menarono su l’arca dell’Eterno, e la trasportarono in casa di Abinadab, sulla collina, e consacrarono il suo figliuolo Eleazar, perché custodisse l’arca dell’Eterno. Ora dal giorno che l’arca era stata collocata a Kiriath-Jearim era passato molto tempo, vent’anni erano trascorsi». Del Tempio i Re dicono che «i sacerdoti portarono l’arca del patto dell’Eterno al luogo destinatole, nel santuario della casa, nel luogo santissimo, sotto le ali dei cherubini». Giosia disse ai Leviti: «Collocate pure l’arca santa nella casa che Salomone, figliuolo di Davide, re d’Israele, ha edificata», e Geremia previde un giorno in cui «non si dirà più: L’arca del patto dell’Eterno! non vi si penserà più»."
    - "Dove sia ora, lo si chiede da sempre. Manca negli elenchi dei vasi del Tempio portati a Babilonia; 2 Maccabei dice che Geremia la nascose in una caverna sul Monte Nebo; la Mishnah racconta che fu nascosta sotto il pavimento di una camera del Tempio, mentre un parere rabbinico nel Talmud la dice portata a Babilonia; Giuseppe Flavio dice che il Santo dei Santi del Tempio di Erode era vuoto. Nel Kebra Nagast etiopico Menelik, figlio di Salomone e della regina di Saba, la porta ad Aksum, dove la chiesa di Nostra Signora Maria di Sion sostiene di custodirla, invisibile a tutti tranne al suo guardiano. L’Apocalisse la vede nel tempio in cielo. A Kiriat-Iearim Israel Finkelstein e Thomas Römer, scavando nel 2017 e nel 2019, trovarono sulla sommità una grande piattaforma dell’VIII secolo a.C., sotto la chiesa di Nostra Signora dell’Arca dell’Alleanza costruita nel 1924."
  cs:
    - "Truhla byla zhotovena na Sinaji a nesena pouští ve stánku; po přechodu Jordánu stála v Gilgalu a pak, po dobu soudců, v Šílu. Zajata Pelištejci v bitvě u Eben-ezeru byla odvezena do Ašdodu, Gatu a Ekronu, z Ekronu poslána zpět na voze do Bét-šemeše, 12 km daleko, a odtud vynesena do Kirjat-jearímu, kde stojí bod na mapě: Deir el-Azar nad Abú Gošem, 13 km západně od Jeruzaléma. Tam zůstala asi dvacet let, než ji David přenesl do Jeruzaléma, a Šalomoun ji zasadil do velesvatyně chrámu, kolem roku 959 př. n. l. Po Šalomounových dnech ji Starý zákon zmiňuje už jen dvakrát a co se s ní stalo, když Babyloňané roku 587 nebo 586 př. n. l. chrám vypálili, není zaznamenáno."
    - "Samuel vypráví poslední etapy: „Tedy přišli muži Kariatjeharim a vzali odtud truhlu Hospodinovu, a vnesli ji do domu Abinadabova na pahrbek, a Eleazara syna jeho posvětili, aby ostříhal truhly Hospodinovy. Stalo se pak, že od toho času, jakž zůstala truhla v Kariatjeharim, když bylo přeběhlo mnoho dní, a byl již rok dvadcátý“. O chrámu Knihy Královské praví, že „vnesli kněží truhlu smlouvy Hospodinovy na místo její, do vnitřního domu, totiž do svatyně svatých pod křídla cherubínů“. Jošijáš řekl Levitům: „Vneste truhlu svatosti do domu, kterýž ustavěl Šalomoun syn Davidův, král Izraelský“, a Jeremjáš předvídal den, kdy „nebudou říkati více: Truhla smlouvy Hospodinovy, aniž jim vstoupí na srdce“."
    - "Kde je nyní, se ptají od nepaměti. V seznamech chrámového náčiní odvlečeného do Babylóna chybí; 2. kniha Makabejská říká, že ji Jeremjáš ukryl v jeskyni na hoře Nebo; Mišna vypráví o jejím ukrytí pod podlahou jedné chrámové komory, zatímco rabínský názor v Talmudu ji nechává odvézt do Babylóna; Josephus říká, že velesvatyně Herodova chrámu neobsahovala vůbec nic. Etiopský Kebra Nagast nechává Menelika, syna Šalomouna a královny ze Šeby, odnést ji do Axumu, kde ji prý chová kostel Panny Marie Sijónské, neviděnou nikým kromě jejího strážce. Zjevení ji vidí v chrámu v nebi. V Kirjat-jearímu Israel Finkelstein a Thomas Römer při vykopávkách v letech 2017 a 2019 nalezli na vrcholu velkou plošinu z 8. století př. n. l., pod kostelem Panny Marie, Archy úmluvy, postaveným roku 1924."
  nl:
    - "De ark werd gemaakt bij de Sinaï en door de woestijn gedragen in de tabernakel; na de oversteek van de Jordaan stond zij te Gilgal en daarna, in de tijd van de richters, te Silo. Door de Filistijnen buitgemaakt in de slag bij Eben-Haëzer werd zij naar Asdod, Gat en Ekron gebracht, vanuit Ekron op een kar teruggestuurd naar Beth-Semes, 12 km verderop, en van daar opgebracht naar Kirjat-Jearim, waar het punt op de kaart staat: Deir el-Azar boven Abu Ghosh, 13 km ten westen van Jeruzalem. Daar bleef zij ongeveer twintig jaar tot David haar naar Jeruzalem bracht, en Salomo haar plaatste in het Heilige der Heiligen van de tempel, omstreeks 959 v.Chr. Na Salomo's tijd noemt het Oude Testament haar nog maar twee keer, en wat er van haar werd toen de Babyloniërs de tempel in 587 of 586 v.Chr. verbrandden, is niet overgeleverd."
    - "Samuël vertelt de laatste fasen: “Toen kwamen de mannen van Kirjath-Jearim, en haalden de ark des HEEREN op, en zij brachten ze in het huis van Abinadab, op den heuvel; en zij heiligden zijn zoon Eleazar, dat hij de ark des HEEREN bewaarde. En het geschiedde, van dien dag af, dat de ark des Heeren te Kirjath-Jearim bleef, en de dagen werden twintig jaren”. Van de tempel zegt Koningen dat “de priesteren de ark des verbonds des HEEREN tot haar plaats, tot de aanspraakplaats van het huis, tot het heilige der heiligen, tot onder de vleugelen der cherubim” brachten. Josia zei tot de Levieten: “Zet de heilige ark in het huis, hetwelk Salomo, de zoon van David, de koning van Israel, gebouwd heeft”, en Jeremia voorzag een dag waarop “zullen zij niet meer zeggen: De ark des verbonds des HEEREN, ook zal zij in het hart niet opkomen”."
    - "Sindsdien vraagt men waar zij nu is. Zij ontbreekt in de lijsten van naar Babylon gevoerde tempelvaten; 2 Makkabeeën zegt dat Jeremia haar verborg in een grot op de Nebo; volgens de Misjna lag zij onder de vloer van een tempelkamer verborgen, terwijl volgens een rabbijnse opvatting in de Talmoed zij naar Babylon ging; Josephus zegt dat het Heilige der Heiligen van Herodes' tempel leeg was. De Ethiopische Kebra Nagast laat Menelik, zoon van Salomo en de koningin van Seba, haar naar Aksum brengen, waar de kerk van Onze-Lieve-Vrouw Maria van Sion beweert haar te bewaren, door niemand gezien dan haar bewaker. De Openbaring ziet haar in de tempel in de hemel. Bij Kirjat-Jearim vonden Israel Finkelstein en Thomas Römer, opgravend in 2017 en 2019, een groot platform uit de achtste eeuw v.Chr. op de top, onder de kerk van Onze-Lieve-Vrouw van de Ark van het Verbond (1924)."
  sv:
    - "Arken tillverkades vid Sinai och bars genom öknen i tabernaklet; efter övergången över Jordan stod den i Gilgal och därefter, under domartiden, i Shilo. Fångad av filistéerna i slaget vid Even-Haeser fördes den till Ashdod, Gat och Ekron, skickades tillbaka från Ekron på en kärra till Bet-Shemesh, 12 km bort, och bars därifrån upp till Kirjat-Jearim, där kartpunkten står: Deir el-Azar ovanför Abu Ghosh, 13 km väster om Jerusalem. Där stannade den ungefär tjugo år tills David förde den till Jerusalem, och Salomo ställde den i templets allraheligaste, omkring 959 f.Kr. Efter Salomos dagar nämner Gamla testamentet den bara två gånger till, och vad som hände med den när babylonierna brände templet 587 eller 586 f.Kr. är inte antecknat."
    - "Samuelsboken berättar de sista etapperna: ”Då kommo Kirjat-Jearims män och hämtade HERRENS ark ditupp och förde den in i Abinadabs hus på höjden. Och hans son Eleasar helgade de till att hava vården om HERRENS ark. Och från den dag då arken fick sin plats i Kirjat-Jearim förflöt en lång tid: tjugu år förgingo.” Om templet säger Kungaböckerna att ”prästerna buro in HERRENS förbundsark till dess plats i husets kor, i det allraheligaste, till platsen under kerubernas vingar”. Josia sade till leviterna: ”Sätten den heliga arken i det hus som Salomo, Davids son, Israels konung, har byggt”, och Jeremia förutsade om en kommande dag: ”då skall man icke mer tala om HERRENS förbundsark eller tänka på den”."
    - "Var den finns nu har man frågat sedan dess. Den saknas i förteckningarna över templets kärl som fördes till Babylon; 2 Mackabeerboken säger att Jeremia gömde den i en grotta på berget Nebo; Mishna berättar att den gömdes under golvet i en tempelkammare, medan en rabbinsk åsikt i Talmud säger att den fördes till Babylon; Josefus säger att det allraheligaste i Herodes’ tempel inte innehöll något alls. Den etiopiska Kebra Nagast låter Menelik, son till Salomo och drottningen av Saba, föra den till Aksum, där kyrkan Vår Fru Maria av Sion hävdar att den förvaras, osedd av alla utom dess väktare. Uppenbarelseboken ser den i templet i himlen. Vid Kirjat-Jearim fann Israel Finkelstein och Thomas Römer, som grävde 2017 och 2019, en stor plattform från 700-talet f.Kr. på toppen, under kyrkan Vår Fru av Förbundsarken, byggd 1924."
  nb:
    - "Arken ble laget ved Sinai og båret gjennom ørkenen i tabernaklet; etter overgangen over Jordan sto den i Gilgal og så, i dommertiden, i Sjilo. Tatt av filistrene i slaget ved Eben-Eser ble den ført til Asjdod, Gat og Ekron, sendt tilbake fra Ekron på en vogn til Bet-Sjemesj, 12 km unna, og derfra båret opp til Kirjat-Jearim, der kartpunktet står: Deir el-Azar over Abu Ghosh, 13 km vest for Jerusalem. Der ble den i omtrent tjue år til David brakte den til Jerusalem, og Salomo satte den i tempelets Det aller helligste, omkring 959 f.Kr. Etter Salomos dager nevner Det gamle testamentet den bare to ganger til, og hva som ble av den da babylonerne brente tempelet i 587 eller 586 f.Kr., er ikke opptegnet."
    - "Samuelsbøkene forteller de siste etappene: «Da kom Kirjat-Jearims menn og hentet Herrens ark op og bar den inn i Abinadabs hus på haugen, og hans sønn Eleasar vidde de til å ta vare på Herrens ark. Fra den dag arken kom til Kirjat-Jearim, gikk det en lang tid - tyve år gikk det». Om tempelet sier Kongebøkene: «Prestene bar Herrens pakts-ark inn på dens plass i husets kor, i det Aller-helligste, under kjerubenes vinger.» Josjia sa til levittene: «Sett den hellige ark i det hus som Israels konge Salomo, Davids sønn, har bygget!», og Jeremia sa om fremtiden: «da skal de ikke mere tale om Herrens pakts-ark eller tenke på den»."
    - "Hvor den er nå, er blitt spurt om siden. Den mangler i listene over tempelkar som ble ført til Babylon; 2 Makkabeerbok sier at Jeremia skjulte den i en hule på Nebo-fjellet; Mishna forteller at den ble skjult under gulvet i et tempelkammer, mens et rabbinsk syn i Talmud har den ført til Babylon; Josefus sier at Det aller helligste i Herodes’ tempel ikke inneholdt noe som helst. Den etiopiske Kebra Nagast lar Menelik, sønn av Salomo og dronningen av Sjeba, bære den til Aksum, der kirken Vår Frue Maria av Sion påstår å ha den, usett av alle unntatt dens vokter. Åpenbaringen ser den i templet i himmelen. Ved Kirjat-Jearim fant Israel Finkelstein og Thomas Römer, som gravde i 2017 og 2019, en stor plattform fra 700-tallet f.Kr. på toppen, under kirken Vår Frue av Paktens ark bygd i 1924."
  tl:
    - "Ginawa ang kaban sa Sinai at dinala sa ilang sa tabernakulo; pagkatawid sa Jordan, nakatayo ito sa Gilgal at pagkatapos, sa panahon ng mga hukom, sa Shiloh. Nabihag ng mga Filisteo sa labanan sa Ebenezer, dinala ito sa Asdod, Gath at Ecron, ibinalik mula sa Ecron sa isang kariton patungong Beth-semes, 12 km ang layo, at mula roon ay iniahon sa Kiriath-jearim, kung saan nakatayo ang punto sa mapa: ang Deir el-Azar sa itaas ng Abu Ghosh, 13 km sa kanluran ng Jerusalem. Nanatili ito roon nang mga dalawampung taon hanggang dinala ito ni David sa Jerusalem, at inilagay ito ni Salomon sa Kabanal-banalang Dako ng Templo, mga 959 BK. Pagkatapos ng panahon ni Salomon, dalawang beses na lamang itong binabanggit ng Matandang Tipan, at hindi itinala kung ano ang nangyari rito nang sunugin ng mga Babilonio ang Templo noong 587 o 586 BK."
    - "Isinasalaysay ni Samuel ang huling yugto: “ang mga lalake sa Chiriath-jearim ay nagsiparoon, at iniahon ang kaban ng Panginoon, at dinala sa bahay ni Abinadab sa burol, at pinapagbanal si Eleazar na kaniyang anak, upang ingatan ang kaban ng Panginoon… mula nang araw na itahan ang kaban sa Chiriath-jearim, na ang panahon ay nagtatagal; sapagka't naging dalawang pung taon”. Tungkol sa Templo, sinasabi ng Mga Hari na “ipinasok ng mga saserdote ang kaban ng tipan ng Panginoon sa karoroonan, sa loob ng sanggunian ng bahay, sa kabanalbanalang dako, sa ilalim ng mga pakpak ng mga querubin”. Sinabi ni Josias sa mga Levita, “Ilagay ninyo ang banal na kaban sa bahay na itinayo ni Salomon na anak ni David na hari sa Israel”, at nakita ni Jeremias ang araw na “hindi na nila sasabihin, Ang kaban ng tipan ng Panginoon; ni mapapasaisip nila yaon”."
    - "Matagal nang tanong kung nasaan ito. Wala ito sa mga kagamitang dinala sa Babilonia; sinasabi ng 2 Macabeo na itinago ito ni Jeremias sa isang yungib sa Bundok Nebo; isinasalaysay ng Mishnah na itinago ito sa ilalim ng sahig ng isang silid ng Templo, may pananaw ng mga rabbi sa Talmud na dinala ito sa Babilonia; ayon kay Josephus, walang laman ang Kabanal-banalang Dako ng Templo ni Herodes. Sa Kebra Nagast ng Etiopia, dinala ito ni Menelik, anak ni Salomon at ng reyna ng Seba, sa Aksum, kung saan inaangkin ng simbahan ng Santa Maria ng Sion na hawak ito, na walang nakakakita maliban sa tagapag-alaga nito. Nasa templo sa langit ito sa Apocalipsis. Sa Kiriath-jearim, nahanap nina Israel Finkelstein at Thomas Römer, na naghukay noong 2017 at 2019, ang malaking plataporma ng ika-8 siglo BK sa tuktok, sa ilalim ng simbahan ng Birhen ng Kaban ng Tipan na itinayo noong 1924."
