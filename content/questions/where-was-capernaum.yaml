id: where-was-capernaum
question:
  en: "Where was Capernaum?"
  ru: "Где находился Капернаум?"
  uk: "Де був Капернаум?"
  es: "¿Dónde estaba Cafarnaúm?"
  pt: "Onde ficava Cafarnaum?"
  de: "Wo lag Kapernaum?"
  fr: "Où se trouvait Capernaüm ?"
  pl: "Gdzie leżało Kafarnaum?"
  it: "Dov’era Cafarnao?"
  nl: "Waar lag Kafarnaüm?"
  cs: "Kde bylo Kafarnaum?"
  sv: "Var låg Kafarnaum?"
  nb: "Hvor lå Kapernaum?"
  tl: "Saan ang Capernaum?"
  da: "Hvor lå Kapernaum?"
  sr: "Где је био Капернаум?"
  hu: "Hol volt Kapernaum?"
  fi: "Missä Kapernaum oli?"
  vi: "Ca-bê-na-um ở đâu?"
  ro: "Unde se afla Capernaum?"
  bg: "Къде се е намирал Капернаум?"
answer:
  en:
    - "Capernaum lay on the northern shore of the Sea of Galilee, in today's Israel, at the site called Tell Hum, west of the point where the Jordan enters the lake; the ruins are an archaeological park with a Franciscan church over the house venerated as Peter's."
    - 'The village was founded in the second century BC, in the Hasmonean period, and lived from fishing, farming and the road that passed nearby. In the Gospels it is the base of Jesus'' ministry in Galilee, "his own city": "And leaving Nazareth, he came and dwelt in Capernaum, which is upon the sea coast, in the borders of Zabulon and Nephthalim." He taught in its synagogue, which Luke says the centurion had built, and healed Peter''s mother-in-law and the paralysed man let down through a roof.'
    - "Excavations from 1968 uncovered houses of black basalt around shared courtyards. Beneath the white limestone synagogue, dated by coins to the late fourth or fifth century, lie basalt foundations that may belong to a first-century synagogue. Nearby, one room of a first-century house became a meeting place and in the fifth century was enclosed in an octagonal church; it was long venerated as the house of Peter. From Nazareth it is about 33 km in a straight line, about 50 km by the roads on the map."
  ru:
    - "Капернаум стоял на северном берегу Галилейского моря, в нынешнем Израиле, на месте, называемом Телль-Хум, к западу от впадения Иордана в озеро; руины — археологический парк с францисканской церковью над домом, почитаемым как дом Петра."
    - "Селение основано во II веке до н. э., при Хасмонеях, и жило рыбной ловлей, земледелием и проходившей рядом дорогой. В Евангелиях это опора служения Иисуса в Галилее, «Свой город»: «и, оставив Назарет, пришел и поселился в Капернауме приморском, в пределах Завулоновых и Неффалимовых». Он учил в здешней синагоге, которую, по словам Луки, построил сотник, исцелил тёщу Петра и расслабленного, спущенного через кровлю."
    - "Раскопки с 1968 года открыли дома из чёрного базальта вокруг общих дворов. Под синагогой из белого известняка, датированной по монетам концом IV — V веком, лежат базальтовые основания, которые могут принадлежать синагоге I века. Рядом одна комната дома I века стала местом собраний, а в V веке её заключили в восьмиугольную церковь; её издавна почитали как дом Петра. От Назарета сюда около 33 км по прямой и около 50 км по дорогам на карте."
  uk:
    - "Капернаум лежав на північному березі Галілейського моря, у нинішньому Ізраїлі, на місці, званому Тель-Хум, на захід від місця, де Йордан впадає в озеро; руїни — це археологічний парк з францисканською церквою над будинком, шанованим як Петровий."
    - "Село було засноване у II ст. до н. е., у хасмонейську добу, і жило з рибальства, землеробства та дороги, що проходила поряд. В Євангеліях це база служіння Ісуса в Галілеї, «свій город»: «покинувши Назарет, пійшов і пробував у Капернаумі, що при морю, у гряницях Завулона та Нефталима». Він навчав у його синагозі, яку, за Лукою, збудував сотник, і зцілив тещу Петра та розслабленого, спущеного крізь дах."
    - "Розкопки від 1968 р. відкрили будинки з чорного базальту навколо спільних дворів. Під білою вапняковою синагогою, датованою за монетами кінцем IV або V ст., лежать базальтові фундаменти, які можуть належати синагозі I ст. Поряд одна кімната будинку I ст. стала місцем зібрань, а в V ст. її було замкнено в восьмикутну церкву; її довго шанували як дім Петра. Від Назарета це приблизно 33 км по прямій, приблизно 50 км дорогами на мапі."
  es:
    - "Cafarnaúm se hallaba en la orilla norte del mar de Galilea, en el actual Israel, en el lugar llamado Tell Hum, al oeste del punto donde el Jordán entra en el lago; las ruinas son un parque arqueológico con una iglesia franciscana sobre la casa venerada como la de Pedro."
    - "La aldea se fundó en el siglo II a. C., en el período asmoneo, y vivía de la pesca, la agricultura y el camino que pasaba cerca. En los Evangelios es la base del ministerio de Jesús en Galilea, «su ciudad»: «Y dejando á Nazaret, vino y habitó en Capernaum, ciudad marítima, en los confines de Zabulón y de Nephtalim». Enseñó en su sinagoga, que según Lucas había edificado el centurión, y sanó a la suegra de Pedro y al paralítico bajado por un techo."
    - "Las excavaciones desde 1968 sacaron a la luz casas de basalto negro en torno a patios comunes. Bajo la sinagoga de caliza blanca, fechada por monedas a finales del siglo IV o en el V, yacen cimientos de basalto que pueden pertenecer a una sinagoga del siglo I. Cerca, una habitación de una casa del siglo I se convirtió en lugar de reunión y en el siglo V fue encerrada en una iglesia octogonal; se veneró durante mucho tiempo como la casa de Pedro. Desde Nazaret hay unos 33 km en línea recta, unos 50 km por los caminos del mapa."
  pt:
    - "Cafarnaum ficava na margem norte do mar da Galileia, no Israel de hoje, no local chamado Tell Hum, a oeste do ponto em que o Jordão entra no lago; as ruínas são um parque arqueológico com uma igreja franciscana sobre a casa venerada como de Pedro."
    - "A aldeia foi fundada no século II a.C., no período hasmoneu, e vivia da pesca, da agricultura e da estrada que passava perto. Nos Evangelhos é a base do ministério de Jesus na Galileia, “sua própria cidade”: “Deixando Nazaré, foi morar em Cafarnaum, que fica à beira-mar, na região de Zebulom e Naftali.” Ele ensinou em sua sinagoga, que segundo Lucas o centurião mandara construir, e curou a sogra de Pedro e o paralítico baixado por um telhado."
    - "As escavações desde 1968 revelaram casas de basalto negro em torno de pátios comuns. Sob a sinagoga de calcário branco, datada por moedas do fim do século IV ou do V, jazem alicerces de basalto que podem pertencer a uma sinagoga do século I. Perto, um cômodo de uma casa do século I virou lugar de reunião e no século V foi encerrado numa igreja octogonal; foi por muito tempo venerado como a casa de Pedro. De Nazaré são cerca de 33 km em linha reta, cerca de 50 km pelas estradas do mapa."
  de:
    - "Kapernaum lag am Nordufer des Sees Genezareth im heutigen Israel, an der Tell Hum genannten Stätte, westlich der Stelle, wo der Jordan in den See mündet; die Ruinen sind ein archäologischer Park mit einer Franziskanerkirche über dem als Haus des Petrus verehrten Haus."
    - "Das Dorf wurde im 2. Jahrhundert v. Chr. in hasmonäischer Zeit gegründet und lebte von Fischerei, Landwirtschaft und der nahe vorbeiführenden Straße. In den Evangelien ist es der Stützpunkt von Jesu Wirken in Galiläa, „seine Stadt“: „Und verließ die Stadt Nazareth, kam und wohnte zu Kapernaum, das da liegt am Meer, im Lande Sebulon und Naphthali.“ Er lehrte in seiner Synagoge, die nach Lukas der Hauptmann hatte bauen lassen, und heilte die Schwiegermutter des Petrus und den durch ein Dach herabgelassenen Gelähmten."
    - "Ausgrabungen ab 1968 legten Häuser aus schwarzem Basalt um gemeinsame Höfe frei. Unter der weißen Kalksteinsynagoge, durch Münzen auf das späte 4. oder 5. Jahrhundert datiert, liegen Basaltfundamente, die zu einer Synagoge des 1. Jahrhunderts gehören könnten. Nahebei wurde ein Raum eines Hauses des 1. Jahrhunderts zum Versammlungsort und im 5. Jahrhundert in eine achteckige Kirche eingeschlossen; er wurde lange als Haus des Petrus verehrt. Von Nazareth sind es in der Luftlinie etwa 33 km, auf den Straßen der Karte etwa 50 km."
  fr:
    - "Capernaüm se trouvait sur la rive nord de la mer de Galilée, dans l’Israël actuel, sur le site appelé Tell Hum, à l’ouest du point où le Jourdain entre dans le lac ; les ruines forment un parc archéologique avec une église franciscaine sur la maison vénérée comme celle de Pierre."
    - "Le village fut fondé au IIe siècle av. J.-C., à l’époque hasmonéenne, et vivait de la pêche, de l’agriculture et de la route qui passait près de là. Dans les Évangiles, c’est la base du ministère de Jésus en Galilée, « sa ville » : « Il quitta Nazareth, et vint demeurer à Capernaüm, située près de la mer, dans le territoire de Zabulon et de Nephthali. » Il enseigna dans sa synagogue, que, dit Luc, le centurion avait fait bâtir, et guérit la belle-mère de Pierre et le paralytique descendu par un toit."
    - "Les fouilles de 1968 mirent au jour des maisons de basalte noir autour de cours communes. Sous la synagogue de calcaire blanc, datée par des monnaies de la fin du IVe ou du Ve siècle, se trouvent des fondations de basalte qui peuvent appartenir à une synagogue du Ier siècle. Tout près, une pièce d’une maison du Ier siècle devint un lieu de réunion et fut enfermée au Ve siècle dans une église octogonale ; elle fut longtemps vénérée comme la maison de Pierre. De Nazareth, il y a environ 33 km en ligne droite, environ 50 km par les routes de la carte."
  pl:
    - "Kafarnaum leżało na północnym brzegu Jeziora Galilejskiego, w dzisiejszym Izraelu, w miejscu zwanym Tell Chum, na zachód od punktu, w którym Jordan wpada do jeziora; ruiny są parkiem archeologicznym z kościołem franciszkańskim nad domem czczonym jako dom Piotra."
    - "Wieś założono w II wieku p.n.e., w okresie hasmonejskim, a żyła z rybołówstwa, rolnictwa i drogi, która przechodziła w pobliżu. W Ewangeliach jest bazą posługi Jezusa w Galilei i jego własnym miastem („przyszedł do miasta swego”): „A opuściwszy Nazaret, przyszedł, i mieszkał w Kapernaum, które jest nad morzem w granicach Zabulonowych i Neftalimowych.” Nauczał w jego synagodze, którą według Łukasza zbudował setnik, i uzdrowił teściową Piotra oraz paralityka spuszczonego przez dach."
    - "Wykopaliska od 1968 odsłoniły domy z czarnego bazaltu wokół wspólnych dziedzińców. Pod białą wapienną synagogą, datowaną monetami na koniec IV lub V wiek, leżą bazaltowe fundamenty, które mogą należeć do synagogi z I wieku. W pobliżu jedno pomieszczenie domu z I wieku stało się miejscem spotkań, a w V wieku zamknięto je w ośmiokątnym kościele; długo czczono je jako dom Piotra. Z Nazaretu jest około 33 km w linii prostej, około 50 km drogami z mapy."
  it:
    - "Cafarnao sorgeva sulla riva settentrionale del lago di Tiberiade, nell’odierno Israele, nel sito detto Tell Hum, a ovest del punto dove il Giordano entra nel lago; le rovine sono un parco archeologico con una chiesa francescana sulla casa venerata come quella di Pietro."
    - "Il villaggio fu fondato nel II secolo a.C., in età asmonea, e viveva di pesca, agricoltura e della strada che passava lì presso. Nei Vangeli è la base del ministero di Gesù in Galilea, la «sua città»: «E, lasciata Nazaret, venne ad abitare in Capernaum, città sul mare, ai confini di Zabulon e di Neftali». Insegnò nella sua sinagoga, che secondo Luca fu costruita dal centurione («è lui che ci ha edificata la sinagoga»), e guarì la suocera di Pietro e il paralitico calato attraverso un tetto."
    - "Gli scavi dal 1968 portarono alla luce case di basalto nero attorno a cortili comuni. Sotto la sinagoga di calcare bianco, datata dalle monete alla fine del IV o al V secolo, giacciono fondamenta di basalto che possono appartenere a una sinagoga del I secolo. Lì vicino, una stanza di una casa del I secolo divenne un luogo di riunione e nel V secolo fu racchiusa in una chiesa ottagonale; fu a lungo venerata come casa di Pietro. Da Nazaret dista circa 33 km in linea retta, circa 50 km lungo le strade della mappa."
  nl:
    - "Kafarnaüm lag aan de noordoever van het Meer van Galilea, in het huidige Israël, op de plaats Tell Hum, ten westen van de plek waar de Jordaan het meer instroomt; de ruïnes vormen een archeologisch park met een franciscaanse kerk boven het huis dat als dat van Petrus wordt vereerd."
    - "Het dorp werd gesticht in de tweede eeuw v.Chr., in de Hasmoneïsche tijd, en leefde van visserij, landbouw en de weg die er vlakbij liep. In de Evangeliën is het de uitvalsbasis van Jezus’ optreden in Galilea, “Zijn stad”: “En Nazareth verlaten hebbende, is komen wonen te Kapernaum, gelegen aan de zee, in de landpale van Zebulon en Nafthali.” Hij onderwees in zijn synagoge, die volgens Lukas de hoofdman had laten bouwen, en genas de schoonmoeder van Petrus en de verlamde die door een dak werd neergelaten."
    - "Opgravingen vanaf 1968 legden huizen van zwart basalt rond gemeenschappelijke binnenplaatsen bloot. Onder de witte kalksteen-synagoge, door munten gedateerd in de late vierde of vijfde eeuw, liggen basalten fundamenten die van een synagoge uit de eerste eeuw kunnen zijn. Vlakbij werd één kamer van een huis uit de eerste eeuw een samenkomstplaats en in de vijfde eeuw ingesloten in een achthoekige kerk; zij werd lang vereerd als het huis van Petrus. Vanaf Nazareth is het hemelsbreed ongeveer 33 km, ongeveer 50 km langs de wegen op de kaart."
  cs:
    - "Kafarnaum leželo na severním břehu Galilejského jezera, v dnešním Izraeli, na místě zvaném Tell Hum, západně od místa, kde se Jordán vlévá do jezera; zříceniny jsou archeologickým parkem s františkánským kostelem nad domem uctívaným jako Petrův."
    - "Vesnice byla založena ve 2. století př. n. l., v hasmonejském období, a živila se rybolovem, zemědělstvím a silnicí, která poblíž procházela. V evangeliích je základnou Ježíšova působení v Galileji; Matouš o něm říká, že Ježíš „přišel do města svého“: „A opustiv Nazarét, přišed, bydlil v Kafarnaum za mořem, v krajinách Zabulon a Neftalím.“ Učil v jeho synagoze, kterou podle Lukáše dal postavit setník, a uzdravil Petrovu tchyni a ochrnutého spuštěného střechou."
    - "Vykopávky od roku 1968 odkryly domy z černého čediče kolem společných nádvoří. Pod synagogou z bílého vápence, datovanou podle mincí do konce 4. nebo 5. století, leží čedičové základy, které mohou patřit synagoze z 1. století. Nedaleko se jedna místnost domu z 1. století stala shromaždištěm a v 5. století byla uzavřena do osmiúhelníkového kostela; dlouho byla uctívána jako Petrův dům. Z Nazareta je to vzdušnou čarou asi 33 km, po silnicích na mapě asi 50 km."
  sv:
    - "Kafarnaum låg vid Galileiska sjöns norra strand, i dagens Israel, på platsen som kallas Tell Hum, väster om där Jordan rinner in i sjön; ruinerna är en arkeologisk park med en franciskanerkyrka över huset som vördas som Petrus’."
    - "Byn grundades på 100-talet f.Kr., under hasmoneisk tid, och levde på fiske, jordbruk och vägen som gick förbi i närheten. I evangelierna är den basen för Jesu verksamhet i Galileen, ”sin egen stad”: ”Och han lämnade Nasaret och begav sig till Kapernaum, som ligger vid sjön, på Sabulons och Neftalims område, och bosatte sig där”. Han undervisade i dess synagoga, som enligt Lukas hövitsmannen hade låtit bygga, och botade Petrus svärmoder och den lame mannen som släpptes ned genom ett tak."
    - "Utgrävningar från 1968 avtäckte hus av svart basalt kring gemensamma gårdar. Under den vita kalkstenssynagogan, daterad med mynt till slutet av 300-talet eller 400-talet, ligger basaltgrunder som kan tillhöra en synagoga från första århundradet. I närheten blev ett rum i ett hus från första århundradet en mötesplats och inneslöts på 400-talet i en åttkantig kyrka; det vördades länge som Petrus hus. Från Nasaret är det omkring 33 km fågelvägen, omkring 50 km via vägarna på kartan."
  nb:
    - "Kapernaum lå på nordkysten av Galileasjøen, i dagens Israel, på stedet kalt Tell Hum, vest for punktet der Jordan renner ut i innsjøen; ruinene er en arkeologisk park med en fransiskansk kirke over huset som æres som Peters."
    - "Landsbyen ble grunnlagt på 100-tallet f.Kr., i den hasmoneiske tiden, og levde av fiske, jordbruk og veien som gikk i nærheten. I evangeliene er den utgangspunktet for Jesu virke i Galilea, «sin egen by»: «Og han forlot Nasaret og kom og tok bolig i Kapernaum ved sjøen, i Sebulons og Naftalis landemerker.» Han underviste i synagogen, som Lukas sier høvedsmannen hadde bygget, og helbredet Peters svigermor og den lamme som ble firt ned gjennom et tak."
    - "Utgravinger fra 1968 avdekket hus av svart basalt rundt felles gårdsrom. Under den hvite synagogen av kalkstein, datert ved mynter til slutten av 300-tallet eller 400-tallet, ligger basaltfundamenter som kan tilhøre en synagoge fra det første århundre. I nærheten ble ett rom i et hus fra det første århundre et møtested og ble på 400-tallet omsluttet av en åttekantet kirke; det ble lenge æret som Peters hus. Fra Nasaret er det omtrent 33 km i luftlinje, omtrent 50 km langs veiene på kartet."
  tl:
    - "Ang Capernaum ay nasa hilagang baybayin ng Dagat ng Galilea, sa Israel ngayon, sa pook na tinatawag na Tell Hum, kanluran ng kinapapasukan ng Jordan sa lawa; ang mga guho ay liwasang arkeolohiko na may simbahang Pransiskano sa ibabaw ng bahay na pinararangalan bilang kay Pedro."
    - "Itinatag ang nayon noong ikalawang siglo BK, sa panahong Hasmoneo, at nabuhay sa pangingisda, pagsasaka at sa daang dumaan sa malapit. Sa mga Ebanghelyo, ito ang himpilan ng ministeryo ni Jesus sa Galilea, ang “kaniyang sariling bayan”: “pagkaiwan sa Nazaret, ay naparoon siya at tumahan sa Capernaum, na nasa tabi ng dagat, sa mga hangganan ng Zabulon at Neftali.” Nagturo siya sa sinagoga nito, na ayon kay Lucas ay ipinatayo ng senturion, at pinagaling ang biyenan ni Pedro at ang paralitikong ibinaba sa bubong."
    - "Natuklasan ng mga paghuhukay mula 1968 ang mga bahay ng itim na basalto sa palibot ng magkabahaging bakuran. Sa ilalim ng sinagogang puting batong-apog, na may petsang huling ikaapat o ikalimang siglo ayon sa mga barya, may mga pundasyong basalto na maaaring sa sinagoga ng unang siglo. Sa malapit, ang isang silid ng bahay ng unang siglo ay naging lugar ng pagpupulong at noong ikalimang siglo ay ipinaloob sa simbahang oktagonal; matagal itong pinarangalan bilang bahay ni Pedro. Mula sa Nazaret ay mga 33 km sa tuwid na guhit, mga 50 km sa mga daan sa mapa."
  da:
    - "Kapernaum lå på nordkysten af Genesaret Sø, i nutidens Israel, på stedet kaldet Tell Hum, vest for det sted, hvor Jordan løber ind i søen; ruinerne er en arkæologisk park med en franciskansk kirke over huset, der æres som Peters."
    - "Landsbyen blev grundlagt i 100-tallet f.Kr., i den hasmonæiske periode, og levede af fiskeri, landbrug og vejen, der gik forbi i nærheden. I evangelierne er det basen for Jesu virke i Galilæa, »sin egen By«: »Og han forlod Nazareth og kom og tog Bolig i Kapernaum, som ligger ved Søen, i Sebulons og Nafthalis Egne.« Han underviste i dens synagoge, som ifølge Lukas høvedsmanden havde bygget, og helbredte Peters svigermoder og den lamme, der blev firet ned gennem et tag."
    - "Udgravninger fra 1968 afdækkede huse af sort basalt omkring fælles gårdsrum. Under den hvide kalkstenssynagoge, dateret ved mønter til slutningen af 300-tallet eller 400-tallet, ligger basaltfundamenter, der kan tilhøre en synagoge fra det første århundrede. I nærheden blev et rum i et hus fra det første århundrede et mødested og blev i 400-tallet omsluttet af en ottekantet kirke; det blev længe æret som Peters hus. Fra Nazaret er der omkring 33 km i luftlinje, omkring 50 km ad vejene på kortet."
  sr:
    - "Капернаум је лежао на северној обали Галилејског мора, у данашњем Израелу, на месту званом Тел Хум, западно од места где Јордан утиче у језеро; рушевине су археолошки парк с фрањевачком црквом над кућом коју поштују као Петрову."
    - "Село је основано у 2. веку п. н. е., у хасмонејско доба, а живело је од риболова, ратарства и пута који је пролазио близу. У Јеванђељима то је упориште Исусове службе у Галилеји, где је дошао „у свој град“: „И оставивши Назарет дође и намести се у Капернауму приморском на међи Завулоновој и Нефталимовој.“ Поучавао је у његовој синагоги, за коју Лука каже да ју је саградио стотник, и исцелио Петрову свекрву и узетог спуштеног кроз кров."
    - "Ископавања од 1968. открила су куће од црног базалта око заједничких дворишта. Испод беле кречњачке синагоге, датиране новцем у касно 4. или 5. век, леже базалтни темељи који могу припадати синагоги из 1. века. У близини је једна просторија куће из 1. века постала место окупљања и у 5. веку била обухваћена осмоугаоном црквом; дуго се поштовала као Петрова кућа. Од Назарета је удаљен око 33 км правом линијом, око 50 км путевима на карти."
  hu:
    - "Kapernaum a Galileai-tenger északi partján feküdt, a mai Izraelben, a Tell Hum nevű helyen, a Jordán tóba torkollásától nyugatra; a romok régészeti parkot alkotnak, a Péter házaként tisztelt ház fölött ferences templommal."
    - "A falut a Kr. e. 2. században, a hasmóneus korban alapították, és halászatból, földművelésből és a közelben elhaladó útból élt. Az evangéliumokban Jézus galileai működésének bázisa, saját városa (Mt 9,1: „méne a maga városába”): „És odahagyva Názáretet, elméne és lakozék a tengerparti Kapernaumban, a Zebulon és Naftali határain.” Tanított a zsinagógájában, amelyet Lukács szerint a százados építtetett, és meggyógyította Péter napát és a tetőn át leeresztett bénát."
    - "Az 1968-as ásatások fekete bazalt házakat tártak fel közös udvarok körül. A fehér mészkő zsinagóga alatt, amelyet érmék alapján a 4. század végére vagy az 5. századra keltezik, bazaltalapok fekszenek, amelyek egy 1. századi zsinagógához tartozhatnak. A közelben egy 1. századi ház egyik szobája gyülekezeti hely lett, és az 5. században nyolcszögletű templomba zárták; sokáig Péter házaként tisztelték. Názárettől egyenes vonalban mintegy 33 km-re van, a térképen látható utakon mintegy 50 km-re."
  fi:
    - "Kapernaum sijaitsi Galileanjärven pohjarannalla nykyisessä Israelissa, Tell Humiksi kutsutussa paikassa, Jordanin laskukohdasta länteen; rauniot ovat arkeologinen puisto, jossa on fransiskaanikirkko Pietarin taloksi kunnioitetun talon päällä."
    - "Kylä perustettiin 100-luvulla eaa., hasmonealaisaikana, ja se eli kalastuksesta, maanviljelystä ja läheltä kulkevasta tiestä. Evankeliumeissa se on Jeesuksen toiminnan tukikohta Galileassa; hän tuli ”omaan kaupunkiinsa”: ”Ja hän jätti Nasaretin ja meni asumaan Kapernaumiin, joka on meren rannalla, Sebulonin ja Naftalin alueella.” Hän opetti sen synagoogassa, jonka Luukkaan mukaan sadanpäämies oli rakennuttanut, ja paransi Pietarin anopin sekä katon läpi lasketun halvatun."
    - "Kaivaukset vuodesta 1968 paljastivat mustasta basaltista tehtyjä taloja yhteisten pihojen ympärillä. Valkoisen kalkkikivisen synagogan alla, jonka kolikot ajoittavat 300-luvun loppuun tai 400-luvulle, on basalttiperustuksia, jotka voivat kuulua ensimmäisen vuosisadan synagogaan. Lähellä yhden ensimmäisen vuosisadan talon huoneesta tuli kokouspaikka, ja 400-luvulla se suljettiin kahdeksankulmaiseen kirkkoon; sitä on pitkään kunnioitettu Pietarin talona. Nasaretista on noin 33 km linnuntietä, noin 50 km kartan teitä pitkin."
  vi:
    - "Ca-bê-na-um nằm trên bờ bắc Biển Ga-li-lê, ở Israel ngày nay, tại địa điểm gọi là Tell Hum, phía tây nơi sông Giô-đanh đổ vào hồ; tàn tích là một công viên khảo cổ với một nhà thờ Phanxicô trên ngôi nhà được tôn kính là của Phi-e-rơ."
    - "Làng được lập vào thế kỷ 2 TCN, thời Hasmonean, và sống nhờ đánh cá, nông nghiệp và con đường đi gần đó. Trong các sách Phúc Âm, đó là căn cứ của chức vụ Giê-su ở Ga-li-lê, “thành mình”: “Ngài bỏ thành Na-xa-rét mà đến ở thành Ca-bê-na-um, gần mé biển, giáp địa phận xứ Sa-bu-lôn cùng xứ Nép-ta-li.” Ngài dạy trong nhà hội của nó, mà Lu-ca nói viên đội trưởng đã xây, và chữa mẹ vợ Phi-e-rơ cùng người bại liệt được thả xuống qua mái nhà."
    - "Các cuộc khai quật từ 1968 phát hiện những ngôi nhà bằng đá bazan đen quanh các sân chung. Dưới nhà hội đá vôi trắng, được xác định bằng tiền xu vào cuối thế kỷ 4 hoặc thế kỷ 5, có nền bazan có thể thuộc về một nhà hội thế kỷ 1. Gần đó, một phòng của một ngôi nhà thế kỷ 1 trở thành nơi nhóm họp và vào thế kỷ 5 được bao trong một nhà thờ hình bát giác; nơi đó từ lâu được tôn kính là nhà của Phi-e-rơ. Từ Na-xa-rét khoảng 33 km theo đường thẳng, khoảng 50 km theo các con đường trên bản đồ."
  ro:
    - "Capernaum se afla pe malul de nord al Mării Galileii, în Israelul de azi, la locul numit Tell Hum, la vest de punctul în care Iordanul intră în lac; ruinele sunt un parc arheologic, cu o biserică franciscană deasupra casei venerate drept a lui Petru."
    - "Satul a fost întemeiat în secolul al II-lea î.Hr., în perioada hasmoneană, și trăia din pescuit, agricultură și din drumul care trecea prin apropiere. În Evanghelii este baza slujirii lui Isus în Galileea, orașul lui: „Și lăsând Nazaretul, au venit și au locuit în Capernaum, lângă mare, în hotarele Zavulonului și ale Neftalimului.” A învățat în sinagoga lui, pe care, spune Luca, o zidise sutașul, și i-a vindecat pe soacra lui Petru și pe slăbănogul coborât printr-un acoperiș."
    - "Săpăturile din 1968 au scos la lumină case de bazalt negru în jurul unor curți comune. Sub sinagoga de calcar alb, datată cu monede la sfârșitul secolului al IV-lea sau în al V-lea, se află fundații de bazalt care pot aparține unei sinagogi din secolul I. Alături, o încăpere a unei case din secolul I a devenit loc de întâlnire și în secolul al V-lea a fost închisă într-o biserică octogonală; a fost mult timp venerată ca casa lui Petru. De la Nazaret sunt circa 33 km în linie dreaptă, circa 50 km pe drumurile de pe hartă."
  bg:
    - "Капернаум лежал на северния бряг на Галилейското езеро, в днешен Израел, на мястото, наречено Тел Хум, западно от точката, където Йордан се влива в езерото; руините са археологически парк с францисканска църква над къщата, почитана като дома на Петър."
    - "Селото е основано през II в. пр.н.е., в хасмонейския период, и живеело от риболов, земеделие и пътя, който минавал наблизо. В Евангелията то е базата на служението на Исус в Галилея, „своят си град“: „като остави Назарет, дойде и засели се в Капернаум крайморски, в пределите Завулонови и Нефталимови“. Той поучавал в синагогата му, която според Лука построил стотникът, и изцелил тъщата на Петър и разслабения, спуснат през покрива."
    - "Разкопките от 1968 г. разкриха къщи от черен базалт около общи дворове. Под синагогата от бял варовик, датирана по монети в края на IV или V в., лежат базалтови основи, които може да принадлежат на синагога от I в. Наблизо една стая от къща от I в. станала място за събрания и през V в. била обградена от осмоъгълна църква; тя дълго била почитана като дома на Петър. От Назарет има около 33 км по права линия, около 50 км по пътищата на картата."
