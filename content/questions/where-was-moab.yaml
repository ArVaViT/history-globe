id: where-was-moab
question:
  en: "Where was Moab?"
  ru: "Где находился Моав?"
  uk: "Де був Моав?"
  es: "¿Dónde estaba Moab?"
  pt: "Onde ficava Moabe?"
  de: "Wo lag Moab?"
  fr: "Où se trouvait Moab ?"
answer:
  en:
    - "Moab was the high tableland east of the Dead Sea, in today's central Jordan, from the gorge of the Zered (Wadi Hasa) in the south to the plains opposite Jericho in the north, cut in two by the deep canyon of the Arnon (Wadi Mujib). The map point stands on Kir-hareseth, today's Kerak, its chief city south of the Arnon, about 80 km south-east of Jerusalem in a straight line across the Dead Sea. Numbers calls the Arnon “the border of Moab, between Moab and the Amorites”: the land north of it, with Dibon, Medeba and Heshbon, changed hands between Moab and Israel more than once."
    - "Most of the Bible's stories of Moab happen on its edges. Israel's last camp before the crossing was “in the plains of Moab on this side Jordan by Jericho”, and Moses died “in the land of Moab” on Mount Nebo, about 65 km north of the map point; “no man knoweth of his sepulchre unto this day”. In the days of the judges a man of Bethlehem went “to sojourn in the country of Moab” with his wife Naomi, and Ruth the Moabitess came back with her; the Moab plateau can be seen across the Dead Sea from the hills of Judah."
    - "In the ninth century BC “Mesha king of Moab was a sheepmaster”, who paid Israel tribute in lambs and wool and then rebelled; his own stele, found at Dibon in 1868 and now in the Louvre, tells how he took back the north of the land. Moab faded as a kingdom after the Babylonian conquests of the sixth century BC; the plateau passed to the Nabataeans and in AD 106 to the Roman province of Arabia, and today it is the governorates of Madaba and Karak."
  ru:
    - "Моав — высокое плоскогорье к востоку от Мёртвого моря, в нынешней центральной Иордании, от ущелья Зареда (Вади-Хаса) на юге до равнин против Иерихона на севере, рассечённое надвое глубоким каньоном Арнона (Вади-Муджиб). Точка карты стоит на Кирхарешете, нынешнем Кераке, главном его городе к югу от Арнона, примерно в 80 км к юго-востоку от Иерусалима по прямой, через Мёртвое море. Книга Чисел называет Арнон границей: «Арнон граница Моава, между Моавом и Аморреем»; земля к северу от него, с Дивоном, Медевой и Есевоном, не раз переходила от Моава к Израилю и обратно."
    - "Бо́льшая часть библейских рассказов о Моаве происходит на его окраинах. Последний стан Израиля перед переходом был «на равнинах Моава, при Иордане, против Иерихона», а Моисей умер «в земле Моавитской» на горе Нево, примерно в 65 км к северу от точки карты, «и никто не знает места погребения его даже до сего дня». Во дни судей человек из Вифлеема пошёл «жить на полях Моавитских» с женой Ноеминью, и Руфь Моавитянка вернулась вместе с ней; плато Моава видно через Мёртвое море с Иудейских гор."
    - "В IX веке до н. э. «Меса, царь Моавитский, был богат скотом» и платил Израилю дань овцами и неостриженными баранами, а потом отложился; его собственная стела, найденная в Дивоне в 1868 году и ныне хранящаяся в Лувре, рассказывает, как он вернул север страны. После вавилонских завоеваний VI века до н. э. Моав исчезает как царство; плато перешло к Набатеям, а в 106 г. н. э. — к римской провинции Аравия, и сегодня это провинции Мадаба и Эль-Карак."
  uk:
    - "Моав був високим плоскогір'ям на схід від Мертвого моря, у нинішній центральній Йорданії, від ущелини Заред (Ваді-Гаса) на півдні до рівнин навпроти Єрихону на півночі, розсіченим навпіл глибоким каньйоном Арнону (Ваді-Муджиб). Точка на мапі стоїть на Кір-Харешеті, нинішньому Кераку, його головному місті на південь від Арнону, приблизно за 80 км на південний схід від Єрусалима по прямій через Мертве море. Книга Чисел каже: «Арнон границя Моабова, між Моабіями і Аморіями»: земля на північ від нього, з Дівоном, Мадабою й Гесбоном, не раз переходила від Моаву до Ізраїлю й назад."
    - "Більшість біблійних оповідей про Моав відбуваються на його окраїнах. Останній табір Ізраїлю перед переправою був «на рівнинї Моабський, по другім боцї Йордана навпроти Єрихону», а Мойсей помер «в Моаб землї» на горі Нево, приблизно за 65 км на північ від точки на мапі; «по сей день нїхто не знає гробища його». За днів суддів чоловік із Вифлеєма пішов «жити в край Моабіїв» із дружиною Ноемі, а Рут Моавитянка повернулася з нею; плато Моаву видно через Мертве море з пагорбів Юдеї."
    - "У IX ст. до н. е. «Меса ж, царь Моабіїв, мав великі стада» — він платив Ізраїлю данину ягнятами й вовною, а потім збунтувався; його власна стела, знайдена в Дівоні 1868 р. і нині в Луврі, розповідає, як він повернув північ краю. Моав згасав як царство після вавилонських завоювань VI ст. до н. е.; плато перейшло до набатеїв, а 106 р. н. е. — до римської провінції Аравія, і нині це мухафази Мадаба й Карак."
  es:
    - "Moab era la alta meseta al este del mar Muerto, en el actual centro de Jordania, desde la garganta del Zered (Wadi Hasa), al sur, hasta las llanuras frente a Jericó, al norte, cortada en dos por el profundo cañón del Arnón (Wadi Mujib). El punto del mapa está en Kir-hareset, la actual Kerak, su ciudad principal al sur del Arnón, a unos 80 km al sureste de Jerusalén en línea recta a través del mar Muerto. Números llama al Arnón «término de Moab, entre Moab y el Amorrheo»: la tierra al norte, con Dibón, Medeba y Hesbón, cambió de manos entre Moab e Israel más de una vez."
    - "La mayoría de los relatos bíblicos sobre Moab suceden en sus bordes. El último campamento de Israel antes de la travesía estuvo «en los campos de Moab, de esta parte del Jordán de Jericó», y Moisés murió «en la tierra de Moab», en el monte Nebo, a unos 65 km al norte del punto del mapa; «ninguno sabe su sepulcro hasta hoy». En los días de los jueces, un hombre de Belén fue «á peregrinar en los campos de Moab» con su mujer Noemí, y Rut la moabita volvió con ella; la meseta de Moab se ve al otro lado del mar Muerto desde las colinas de Judá."
    - "En el siglo IX a. C. «Mesa rey de Moab era propietario de ganados», que pagaba a Israel tributo en corderos y lana y luego se rebeló; su propia estela, hallada en Dibón en 1868 y hoy en el Louvre, cuenta cómo recuperó el norte del país. Moab se fue apagando como reino tras las conquistas babilónicas del siglo VI a. C.; la meseta pasó a los nabateos y, en 106 d. C., a la provincia romana de Arabia, y hoy son las gobernaciones de Madaba y Karak."
  pt:
    - "Moabe era o alto planalto a leste do mar Morto, no atual centro da Jordânia, da garganta do Zerede (Wadi Hasa), no sul, até as planícies defronte de Jericó, no norte, cortado em dois pelo profundo desfiladeiro do Arnom (Wadi Mujib). O ponto do mapa fica em Quir-Haresete, a atual Kerak, sua cidade principal ao sul do Arnom, a cerca de 80 km a sudeste de Jerusalém em linha reta através do mar Morto. Números chama o Arnom de “a fronteira de Moabe, entre Moabe e os amorreus”: a terra ao norte dele, com Dibom, Medeba e Hesbom, mudou de mãos entre Moabe e Israel mais de uma vez."
    - "A maior parte das histórias bíblicas sobre Moabe se passa em suas bordas. O último acampamento de Israel antes da travessia foi “nas campinas de Moabe, do outro lado do Jordão, na altura de Jericó”, e Moisés morreu “na terra de Moabe”, no monte Nebo, a cerca de 65 km ao norte do ponto do mapa; “ninguém sabe onde fica o seu túmulo até o dia de hoje”. Nos dias dos juízes, um homem de Belém “foi viver nas terras de Moabe” com a sua mulher Noemi, e Rute, a moabita, voltou com ela; o planalto de Moabe pode ser visto, do outro lado do mar Morto, das colinas de Judá."
    - "No século IX a.C., “Messa, rei de Moabe, era criador de ovelhas”, que pagava a Israel tributo em cordeiros e lã e depois se revoltou; sua própria estela, encontrada em Dibom em 1868 e hoje no Louvre, conta como ele retomou o norte da terra. Moabe declinou como reino depois das conquistas babilônicas do século VI a.C.; o planalto passou aos nabateus e, em 106 d.C., à província romana da Arábia, e hoje corresponde às governadorias de Madaba e Karak."
  de:
    - "Moab war die hohe Tafelebene östlich des Toten Meeres, im heutigen Mittel-Jordanien, von der Schlucht des Sered (Wadi Hasa) im Süden bis zu den Ebenen gegenüber von Jericho im Norden, vom tiefen Canyon des Arnon (Wadi Mudschib) in zwei Hälften geschnitten. Der Kartenpunkt steht auf Kir-Heres, dem heutigen Kerak, seiner Hauptstadt südlich des Arnon, in der Luftlinie über das Tote Meer hinweg etwa 80 km südöstlich von Jerusalem. Das Vierte Buch Mose nennt den Arnon „die Grenze Moabs zwischen Moab und den Amoritern“: Das Land nördlich davon, mit Dibon, Medeba und Heschbon, wechselte mehr als einmal zwischen Moab und Israel."
    - "Die meisten biblischen Geschichten über Moab spielen an seinen Rändern. Vor der Überquerung bezogen die Kinder Israel ihr letztes Lager: Sie „lagerten sich in das Gefilde Moab jenseit des Jordans, gegenüber Jericho“, und Mose starb „im Lande der Moabiter“ auf dem Berg Nebo, etwa 65 km nördlich des Kartenpunkts; „niemand hat sein Grab erfahren bis auf diesen heutigen Tag“. In den Tagen der Richter „zog wallen in der Moabiter Land“ ein Mann von Bethlehem mit seiner Frau Naemi, und Rut, die Moabiterin, kam mit ihr zurück; die Hochebene Moabs ist über das Tote Meer hinweg von den Bergen Judas aus zu sehen."
    - "Im 9. Jahrhundert v. Chr. war „Mesa aber, der Moabiter König“, einer, der „viele Schafe“ hatte; er zinste Israel Lämmer und Wolle und fiel dann ab; seine eigene Stele, 1868 in Dibon gefunden und heute im Louvre, erzählt, wie er den Norden des Landes zurückholte. Moab verblasste als Königreich nach den babylonischen Eroberungen des 6. Jahrhunderts v. Chr.; die Hochebene fiel an die Nabatäer und 106 n. Chr. an die römische Provinz Arabia, und heute sind es die Gouvernements Madaba und Karak."
  fr:
    - "Moab était le haut plateau situé à l’est de la mer Morte, dans le centre de l’actuelle Jordanie, depuis la gorge du Zéred (Wadi Hasa) au sud jusqu’aux plaines en face de Jéricho au nord, coupé en deux par le profond canyon de l’Arnon (Wadi Mujib). Le point de la carte se trouve à Kir-Haréseth, l’actuelle Kérak, sa principale ville au sud de l’Arnon, à environ 80 km au sud-est de Jérusalem à vol d’oiseau, de l’autre côté de la mer Morte. Les Nombres appellent l’Arnon « la frontière de Moab, entre Moab et les Amoréens » : le pays situé au nord, avec Dibon, Médeba et Hesbon, passa plus d’une fois de Moab à Israël et inversement."
    - "La plupart des récits bibliques sur Moab se passent à ses marges. Le dernier campement d’Israël avant la traversée fut « dans les plaines de Moab, au-delà du Jourdain, vis-à-vis de Jéricho », et Moïse mourut « dans le pays de Moab » sur le mont Nébo, à environ 65 km au nord du point de la carte ; « Personne n’a connu son sépulcre jusqu’à ce jour ». Au temps des juges, un homme de Bethléem partit avec sa femme Naomi « pour faire un séjour dans le pays de Moab », et Ruth la Moabite revint avec elle ; le plateau de Moab se voit, de l’autre côté de la mer Morte, depuis les collines de Juda."
    - "Au IXe siècle av. J.-C., « Méscha, roi de Moab, possédait des troupeaux », payait à Israël un tribut d’agneaux et de laine, puis se révolta ; sa propre stèle, trouvée à Dibon en 1868 et aujourd’hui au Louvre, raconte comment il reprit le nord du pays. Moab s’effaça comme royaume après les conquêtes babyloniennes du VIe siècle av. J.-C. ; le plateau passa aux Nabatéens, puis en 106 apr. J.-C. à la province romaine d’Arabie, et il forme aujourd’hui les gouvernorats de Madaba et de Karak."
