id: where-was-moab
question:
  en: "Where was Moab?"
  ru: "Где находился Моав?"
  uk: "Де був Моав?"
  es: "¿Dónde estaba Moab?"
  pt: "Onde ficava Moabe?"
  de: "Wo lag Moab?"
  fr: "Où se trouvait Moab ?"
  pl: "Gdzie leżał Moab?"
  it: "Dov’era Moab?"
  cs: "Kde ležel Moáb?"
  nl: "Waar lag Moab?"
  sv: "Var låg Moab?"
  nb: "Hvor lå Moab?"
  tl: "Nasaan ang Moab?"
  da: "Hvor lå Moab?"
  sr: "Где је био Моав?"
answer:
  en:
    - "Moab was the high tableland east of the Dead Sea, in today's central Jordan, from the gorge of the Zered (Wadi Hasa) in the south to the plains opposite Jericho in the north, cut in two by the deep canyon of the Arnon (Wadi Mujib). The map point stands on Kir-hareseth, today's Kerak, its chief city south of the Arnon, about 80 km south-east of Jerusalem in a straight line across the Dead Sea. Numbers calls the Arnon “the border of Moab, between Moab and the Amorites”: the land north of it, with Dibon, Medeba and Heshbon, changed hands between Moab and Israel more than once."
    - "Most of the Bible's stories of Moab happen on its edges. Israel's last camp before the crossing was “in the plains of Moab on this side Jordan by Jericho”, and Moses died “in the land of Moab” on Mount Nebo, about 65 km north of the map point; “no man knoweth of his sepulchre unto this day”. In the days of the judges a man of Bethlehem went “to sojourn in the country of Moab” with his wife Naomi, and Ruth the Moabitess came back with her; the Moab plateau can be seen across the Dead Sea from the hills of Judah."
    - "In the ninth century BC “Mesha king of Moab was a sheepmaster”, who paid Israel tribute in lambs and wool and then rebelled; his own stele, found at Dibon in 1868 and now in the Louvre, tells how he took back the north of the land. Moab faded as a kingdom after the Babylonian conquests of the sixth century BC; the plateau passed to the Nabataeans and in AD 106 to the Roman province of Arabia, and today it is the governorates of Madaba and Karak."
  ru:
    - "Моав — высокое плоскогорье к востоку от Мёртвого моря, в нынешней центральной Иордании, от ущелья Зареда (Вади-Хаса) на юге до равнин против Иерихона на севере, рассечённое надвое глубоким каньоном Арнона (Вади-Муджиб). Точка карты стоит на Кирхарешете, нынешнем Кераке, главном его городе к югу от Арнона, примерно в 80 км к юго-востоку от Иерусалима по прямой, через Мёртвое море. Книга Чисел называет Арнон границей: «Арнон граница Моава, между Моавом и Аморреем»; земля к северу от него, с Дивоном, Медевой и Есевоном, не раз переходила от Моава к Израилю и обратно."
    - "Бо́льшая часть библейских рассказов о Моаве происходит на его окраинах. Последний стан Израиля перед переходом был «на равнинах Моава, при Иордане, против Иерихона», а Моисей умер «в земле Моавитской» на горе Нево, примерно в 65 км к северу от точки карты, «и никто не знает места погребения его даже до сего дня». Во дни судей человек из Вифлеема пошёл «жить на полях Моавитских» с женой Ноеминью, и Руфь Моавитянка вернулась вместе с ней; плато Моава видно через Мёртвое море с Иудейских гор."
    - "В IX веке до н. э. «Меса, царь Моавитский, был богат скотом» и платил Израилю дань овцами и неостриженными баранами, а потом отложился; его собственная стела, найденная в Дивоне в 1868 году и ныне хранящаяся в Лувре, рассказывает, как он вернул север страны. После вавилонских завоеваний VI века до н. э. Моав исчезает как царство; плато перешло к Набатеям, а в 106 г. н. э. — к римской провинции Аравия, и сегодня это провинции Мадаба и Эль-Карак."
  uk:
    - "Моав був високим плоскогір'ям на схід від Мертвого моря, у нинішній центральній Йорданії, від ущелини Заред (Ваді-Гаса) на півдні до рівнин навпроти Єрихону на півночі, розсіченим навпіл глибоким каньйоном Арнону (Ваді-Муджиб). Точка на мапі стоїть на Кір-Харешеті, нинішньому Кераку, його головному місті на південь від Арнону, приблизно за 80 км на південний схід від Єрусалима по прямій через Мертве море. Книга Чисел каже: «Арнон границя Моабова, між Моабіями і Аморіями»: земля на північ від нього, з Дівоном, Мадабою й Гесбоном, не раз переходила від Моаву до Ізраїлю й назад."
    - "Більшість біблійних оповідей про Моав відбуваються на його окраїнах. Останній табір Ізраїлю перед переправою був «на рівнинї Моабський, по другім боцї Йордана навпроти Єрихону», а Мойсей помер «в Моаб землї» на горі Нево, приблизно за 65 км на північ від точки на мапі; «по сей день нїхто не знає гробища його». За днів суддів чоловік із Вифлеєма пішов «жити в край Моабіїв» із дружиною Ноемі, а Рут Моавитянка повернулася з нею; плато Моаву видно через Мертве море з пагорбів Юдеї."
    - "У IX ст. до н. е. «Меса ж, царь Моабіїв, мав великі стада» — він платив Ізраїлю данину ягнятами й вовною, а потім збунтувався; його власна стела, знайдена в Дівоні 1868 р. і нині в Луврі, розповідає, як він повернув північ краю. Моав згасав як царство після вавилонських завоювань VI ст. до н. е.; плато перейшло до набатеїв, а 106 р. н. е. — до римської провінції Аравія, і нині це мухафази Мадаба й Карак."
  es:
    - "Moab era la alta meseta al este del mar Muerto, en el actual centro de Jordania, desde la garganta del Zered (Wadi Hasa), al sur, hasta las llanuras frente a Jericó, al norte, cortada en dos por el profundo cañón del Arnón (Wadi Mujib). El punto del mapa está en Kir-hareset, la actual Kerak, su ciudad principal al sur del Arnón, a unos 80 km al sureste de Jerusalén en línea recta a través del mar Muerto. Números llama al Arnón «término de Moab, entre Moab y el Amorrheo»: la tierra al norte, con Dibón, Medeba y Hesbón, cambió de manos entre Moab e Israel más de una vez."
    - "La mayoría de los relatos bíblicos sobre Moab suceden en sus bordes. El último campamento de Israel antes de la travesía estuvo «en los campos de Moab, de esta parte del Jordán de Jericó», y Moisés murió «en la tierra de Moab», en el monte Nebo, a unos 65 km al norte del punto del mapa; «ninguno sabe su sepulcro hasta hoy». En los días de los jueces, un hombre de Belén fue «á peregrinar en los campos de Moab» con su mujer Noemí, y Rut la moabita volvió con ella; la meseta de Moab se ve al otro lado del mar Muerto desde las colinas de Judá."
    - "En el siglo IX a. C. «Mesa rey de Moab era propietario de ganados», que pagaba a Israel tributo en corderos y lana y luego se rebeló; su propia estela, hallada en Dibón en 1868 y hoy en el Louvre, cuenta cómo recuperó el norte del país. Moab se fue apagando como reino tras las conquistas babilónicas del siglo VI a. C.; la meseta pasó a los nabateos y, en 106 d. C., a la provincia romana de Arabia, y hoy son las gobernaciones de Madaba y Karak."
  pt:
    - "Moabe era o alto planalto a leste do mar Morto, no atual centro da Jordânia, da garganta do Zerede (Wadi Hasa), no sul, até as planícies defronte de Jericó, no norte, cortado em dois pelo profundo desfiladeiro do Arnom (Wadi Mujib). O ponto do mapa fica em Quir-Haresete, a atual Kerak, sua cidade principal ao sul do Arnom, a cerca de 80 km a sudeste de Jerusalém em linha reta através do mar Morto. Números chama o Arnom de “a fronteira de Moabe, entre Moabe e os amorreus”: a terra ao norte dele, com Dibom, Medeba e Hesbom, mudou de mãos entre Moabe e Israel mais de uma vez."
    - "A maior parte das histórias bíblicas sobre Moabe se passa em suas bordas. O último acampamento de Israel antes da travessia foi “nas campinas de Moabe, do outro lado do Jordão, na altura de Jericó”, e Moisés morreu “na terra de Moabe”, no monte Nebo, a cerca de 65 km ao norte do ponto do mapa; “ninguém sabe onde fica o seu túmulo até o dia de hoje”. Nos dias dos juízes, um homem de Belém “foi viver nas terras de Moabe” com a sua mulher Noemi, e Rute, a moabita, voltou com ela; o planalto de Moabe pode ser visto, do outro lado do mar Morto, das colinas de Judá."
    - "No século IX a.C., “Messa, rei de Moabe, era criador de ovelhas”, que pagava a Israel tributo em cordeiros e lã e depois se revoltou; sua própria estela, encontrada em Dibom em 1868 e hoje no Louvre, conta como ele retomou o norte da terra. Moabe declinou como reino depois das conquistas babilônicas do século VI a.C.; o planalto passou aos nabateus e, em 106 d.C., à província romana da Arábia, e hoje corresponde às governadorias de Madaba e Karak."
  de:
    - "Moab war die hohe Tafelebene östlich des Toten Meeres, im heutigen Mittel-Jordanien, von der Schlucht des Sered (Wadi Hasa) im Süden bis zu den Ebenen gegenüber von Jericho im Norden, vom tiefen Canyon des Arnon (Wadi Mudschib) in zwei Hälften geschnitten. Der Kartenpunkt steht auf Kir-Heres, dem heutigen Kerak, seiner Hauptstadt südlich des Arnon, in der Luftlinie über das Tote Meer hinweg etwa 80 km südöstlich von Jerusalem. Das Vierte Buch Mose nennt den Arnon „die Grenze Moabs zwischen Moab und den Amoritern“: Das Land nördlich davon, mit Dibon, Medeba und Heschbon, wechselte mehr als einmal zwischen Moab und Israel."
    - "Die meisten biblischen Geschichten über Moab spielen an seinen Rändern. Vor der Überquerung bezogen die Kinder Israel ihr letztes Lager: Sie „lagerten sich in das Gefilde Moab jenseit des Jordans, gegenüber Jericho“, und Mose starb „im Lande der Moabiter“ auf dem Berg Nebo, etwa 65 km nördlich des Kartenpunkts; „niemand hat sein Grab erfahren bis auf diesen heutigen Tag“. In den Tagen der Richter „zog wallen in der Moabiter Land“ ein Mann von Bethlehem mit seiner Frau Naemi, und Rut, die Moabiterin, kam mit ihr zurück; die Hochebene Moabs ist über das Tote Meer hinweg von den Bergen Judas aus zu sehen."
    - "Im 9. Jahrhundert v. Chr. war „Mesa aber, der Moabiter König“, einer, der „viele Schafe“ hatte; er zinste Israel Lämmer und Wolle und fiel dann ab; seine eigene Stele, 1868 in Dibon gefunden und heute im Louvre, erzählt, wie er den Norden des Landes zurückholte. Moab verblasste als Königreich nach den babylonischen Eroberungen des 6. Jahrhunderts v. Chr.; die Hochebene fiel an die Nabatäer und 106 n. Chr. an die römische Provinz Arabia, und heute sind es die Gouvernements Madaba und Karak."
  fr:
    - "Moab était le haut plateau situé à l’est de la mer Morte, dans le centre de l’actuelle Jordanie, depuis la gorge du Zéred (Wadi Hasa) au sud jusqu’aux plaines en face de Jéricho au nord, coupé en deux par le profond canyon de l’Arnon (Wadi Mujib). Le point de la carte se trouve à Kir-Haréseth, l’actuelle Kérak, sa principale ville au sud de l’Arnon, à environ 80 km au sud-est de Jérusalem à vol d’oiseau, de l’autre côté de la mer Morte. Les Nombres appellent l’Arnon « la frontière de Moab, entre Moab et les Amoréens » : le pays situé au nord, avec Dibon, Médeba et Hesbon, passa plus d’une fois de Moab à Israël et inversement."
    - "La plupart des récits bibliques sur Moab se passent à ses marges. Le dernier campement d’Israël avant la traversée fut « dans les plaines de Moab, au-delà du Jourdain, vis-à-vis de Jéricho », et Moïse mourut « dans le pays de Moab » sur le mont Nébo, à environ 65 km au nord du point de la carte ; « Personne n’a connu son sépulcre jusqu’à ce jour ». Au temps des juges, un homme de Bethléem partit avec sa femme Naomi « pour faire un séjour dans le pays de Moab », et Ruth la Moabite revint avec elle ; le plateau de Moab se voit, de l’autre côté de la mer Morte, depuis les collines de Juda."
    - "Au IXe siècle av. J.-C., « Méscha, roi de Moab, possédait des troupeaux », payait à Israël un tribut d’agneaux et de laine, puis se révolta ; sa propre stèle, trouvée à Dibon en 1868 et aujourd’hui au Louvre, raconte comment il reprit le nord du pays. Moab s’effaça comme royaume après les conquêtes babyloniennes du VIe siècle av. J.-C. ; le plateau passa aux Nabatéens, puis en 106 apr. J.-C. à la province romaine d’Arabie, et il forme aujourd’hui les gouvernorats de Madaba et de Karak."
  pl:
    - "Moab był wysokim płaskowyżem na wschód od Morza Martwego, w dzisiejszej środkowej Jordanii, od wąwozu Zared (Wadi Hasa) na południu po równiny naprzeciw Jerycha na północy, przeciętym na dwie części głębokim kanionem Arnonu (Wadi Mujib). Punkt na mapie stoi w Kir-Chareszet, dzisiejszym Kerak, jego głównym mieście na południe od Arnonu, około 80 km na południowy wschód od Jerozolimy w linii prostej, przez Morze Martwe. Księga Liczb mówi o Arnonie: „Arnon jest granica Moabska między Moabczykiem i Amorejczykiem”: ziemia na północ od niego, z Dibonem, Medebą i Cheszbonem, przechodziła między Moabem a Izraelem więcej niż raz."
    - "Większość biblijnych opowieści o Moabie rozgrywa się na jego krańcach. Ostatni obóz Izraela przed przeprawą był „na polach Moabskich, z tej strony Jordanu przeciw Jerychowi”, a Mojżesz umarł „w ziemi Moabskiej” na górze Nebo, około 65 km na północ od punktu na mapie; „nie dowiedział się nikt o grobie jego aż do dnia tego”. W czasach sędziów pewien mąż z Betlejem poszedł „na mieszkanie do ziemi Moabskiej” z żoną Noemi, a Rut Moabitka wróciła z nią; płaskowyż Moabu widać przez Morze Martwe ze wzgórz Judy."
    - "W IX wieku p.n.e. „Meza, król Moabski, miał dosyć bydła”, płacił Izraelowi daninę w jagniętach i wełnie, a potem się zbuntował; jego własna stela, znaleziona w Dibon w 1868 roku i dziś w Luwrze, opowiada, jak odzyskał północ kraju. Moab zanikł jako królestwo po babilońskich podbojach VI wieku p.n.e.; płaskowyż przeszedł do Nabatejczyków, a w 106 n.e. do rzymskiej prowincji Arabia, i dziś są to gubernatoriaty Madaba i Karak."
  it:
    - "Moab era l’alto tavolato a est del Mar Morto, nell’odierna Giordania centrale, dalla gola dello Zered (Wadi Hasa) a sud fino alle pianure di fronte a Gerico a nord, diviso in due dal profondo canyon dell’Arnon (Wadi Mujib). Il punto della mappa si trova a Kir-Cheres, l’odierna Kerak, la sua città principale a sud dell’Arnon, a circa 80 km a sud-est di Gerusalemme in linea d’aria attraverso il Mar Morto. Numeri chiama l’Arnon «il confine di Moab, fra Moab e gli Amorei»: la terra a nord di esso, con Dibon, Màdaba e Chesbon, passò più di una volta di mano tra Moab e Israele."
    - "La maggior parte delle storie bibliche su Moab accade ai suoi margini. L’ultimo accampamento di Israele prima del passaggio fu «nelle pianure di Moab, oltre il Giordano di Gerico», e Mosè morì «nel paese di Moab» sul Monte Nebo, a circa 65 km a nord del punto della mappa; «nessuno fino a questo giorno ha mai saputo dove fosse la sua tomba». Ai tempi dei giudici un uomo di Betlemme «andò a stare nelle campagne di Moab» con la moglie Noemi, e Rut la Moabita tornò con lei; l’altopiano di Moab si vede attraverso il Mar Morto dalle colline di Giuda."
    - "Nel IX secolo a.C. «Mesha, re di Moab, allevava molto bestiame», che pagava a Israele un tributo di agnelli e lana e poi si ribellò; la sua stele, trovata a Dibon nel 1868 e oggi al Louvre, racconta come riprese il nord del paese. Moab declinò come regno dopo le conquiste babilonesi del VI secolo a.C.; l’altopiano passò ai Nabatei e nel 106 d.C. alla provincia romana d’Arabia, e oggi corrisponde ai governatorati di Madaba e Karak."
  cs:
    - "Moáb byla vysoká náhorní rovina východně od Mrtvého moře, v dnešním středním Jordánsku, od soutěsky Zeredu (Wádí Hasa) na jihu k rovinám naproti Jerichu na severu, rozdělená hlubokým kaňonem Arnonu (Wádí Mudžíb). Bod na mapě stojí na Kír-charesetu, dnešním Keraku, jeho hlavním městě jižně od Arnonu, vzdušnou čarou přes Mrtvé moře asi 80 km jihovýchodně od Jeruzaléma. Numeri nazývají Arnon „pomezí Moábské mezi Moábskými a Amorejskými“: země severně od něj, s Dibonem, Medebou a Chešbónem, několikrát přecházela mezi Moábem a Izraelem."
    - "Většina biblických příběhů o Moábu se odehrává na jeho okrajích. Poslední tábor Izraele před přechodem byl „na polích Moábských, nedocházeje k Jordánu, naproti Jerichu“ a Mojžíš zemřel „v zemi Moábské“ na hoře Nebo, asi 65 km severně od bodu na mapě; „žádný nezvěděl o jeho hrobu až do tohoto dne“. Za dnů soudců odešel muž z Betléma a „bydlil pohostinu v krajině Moábské“ se svou ženou Noemi a Rut Moábka se s ní vrátila; moábskou náhorní rovinu je z judských hor vidět přes Mrtvé moře."
    - "V 9. století př. n. l. „Mésa pak král Moábský měl hojnost dobytka“, platil Izraeli daň v beranech a vlně a pak se vzbouřil; jeho vlastní stéla, nalezená v Dibonu roku 1868 a nyní v Louvru, vypráví, jak získal zpět sever země. Moáb jako království zanikl po babylonských výbojích v 6. století př. n. l.; náhorní rovina připadla Nabatejcům a roku 106 n. l. římské provincii Arábii a dnes jsou to guvernoráty Mádaba a Karak."
  nl:
    - "Moab was het hoge tafelland ten oosten van de Dode Zee, in het huidige midden van Jordanië, van de kloof van de Zered (Wadi Hasa) in het zuiden tot de vlakten tegenover Jericho in het noorden, in tweeën gesneden door de diepe canyon van de Arnon (Wadi Mujib). Het punt op de kaart staat op Kir-Hareset, het huidige Kerak, de hoofdstad ten zuiden van de Arnon, hemelsbreed ongeveer 80 km ten zuidoosten van Jeruzalem, over de Dode Zee heen. Numeri noemt de Arnon “de landpale van Moab, tussen Moab en tussen de Amorieten”: het land ten noorden ervan, met Dibon, Medeba en Chesbon, wisselde meer dan eens van Moab naar Israël en terug."
    - "De meeste verhalen van de Bijbel over Moab spelen aan de randen. Israëls laatste kamp vóór de oversteek was “in de vlakke velden van Moab, aan deze zijde van de Jordaan van Jericho”, en Mozes stierf “in het land van Moab” op de berg Nebo, ongeveer 65 km ten noorden van het punt op de kaart; “niemand heeft zijn graf geweten, tot op dezen dag”. In de dagen van de richters ging een man uit Bethlehem “om als vreemdeling te verkeren in de velden Moabs” met zijn vrouw Naomi, en Ruth de Moabitische kwam met haar terug; het plateau van Moab is vanaf de heuvels van Juda over de Dode Zee heen te zien."
    - "In de negende eeuw v.Chr. “Mesa nu, de koning der Moabieten, was een veehandelaar”, die Israël schatting betaalde in lammeren en wol en daarna in opstand kwam; zijn eigen stèle, in 1868 bij Dibon gevonden en nu in het Louvre, vertelt hoe hij het noorden van het land terugnam. Moab verdween als koninkrijk na de Babylonische veroveringen van de zesde eeuw v.Chr.; het plateau ging over naar de Nabateeërs en in 106 n.Chr. naar de Romeinse provincie Arabië, en vandaag zijn het de gouvernementen Madaba en Karak."
  sv:
    - "Moab var den höga platån öster om Döda havet, i dagens centrala Jordanien, från Seredklyftan (Wadi Hasa) i söder till slätterna mitt emot Jeriko i norr, delad i två av Arnons djupa kanjon (Wadi Mujib). Kartpunkten står på Kir-Hareset, dagens Kerak, dess huvudstad söder om Arnon, omkring 80 km sydost om Jerusalem i fågelvägen tvärs över Döda havet. Fjärde Moseboken säger att ”Arnon är Moabs gräns och flyter fram mellan Moabs land och amoréernas”: landet norr om den, med Dibon, Medeba och Heshbon, bytte ägare mellan Moab och Israel mer än en gång."
    - "De flesta av Bibelns berättelser om Moab utspelar sig i dess utkanter. Israels sista läger före övergången låg ”på Moabs hedar, på andra sidan Jordan mitt emot Jeriko”, och Mose dog ”där i Moabs land” på berget Nebo, omkring 65 km norr om kartpunkten; ”ännu intill denna dag har ingen fått veta var hans grav är”. På domarnas tid drog en man från Betlehem med sin hustru Noomi ”för att bosätta sig i Moabs land under någon tid”, och moabitiskan Rut kom tillbaka med henne; Moabs platå kan ses över Döda havet från Judas berg."
    - "På 800-talet f.Kr. var det Mesha, ”konungen i Moab, som ägde mycken boskap”, som betalade Israel skatt i lamm och ull och sedan gjorde uppror; hans egen stele, funnen i Dibon 1868 och nu i Louvren, berättar hur han tog tillbaka landets norra del. Moab bleknade som kungarike efter de babyloniska erövringarna på 500-talet f.Kr.; platån övergick till nabateerna och år 106 e.Kr. till den romerska provinsen Arabien, och i dag utgörs den av guvernementen Madaba och Karak."
  nb:
    - "Moab var høyplatået øst for Dødehavet, i dagens sentrale Jordan, fra Sered-kløften (Wadi Hasa) i sør til slettene overfor Jeriko i nord, delt i to av Arnons dype canyon (Wadi Mujib). Kartpunktet står på Kir-Hareset, dagens Kerak, hovedbyen sør for Arnon, omtrent 80 km sørøst for Jerusalem i luftlinje tvers over Dødehavet. Fjerde Mosebok kaller Arnon grensen «mellem Moab og amorittene»: landet nord for den, med Dibon, Medeba og Hesjbon, skiftet hender mellom Moab og Israel mer enn én gang."
    - "De fleste av Bibelens fortellinger om Moab finner sted i utkanten av landet. Israels siste leir før overgangen lå «på Moabs ødemarker på hin side Jordan midt imot Jeriko», og Moses døde «der i Moabs land» på Nebo, omtrent 65 km nord for kartpunktet; «ingen kjenner til denne dag hans grav». I dommertiden dro en mann fra Betlehem «for å opholde sig nogen tid i Moabs land» med sin hustru Noomi, og moabittkvinnen Rut vendte tilbake med henne; Moab-platået kan ses over Dødehavet fra Judas åser."
    - "På 800-tallet f.Kr. var «Mesa, kongen i Moab», en som «hadde meget fe»; han betalte Israel skatt i lam og ull og gjorde så opprør; hans egen stele, funnet i Dibon i 1868 og nå i Louvre, forteller hvordan han tok tilbake landets nordlige del. Moab bleknet som rike etter de babylonske erobringene på 500-tallet f.Kr.; platået gikk over til nabateerne og i 106 e.Kr. til den romerske provinsen Arabia, og i dag utgjør det guvernementene Madaba og Karak."
  tl:
    - "Ang Moab ay ang mataas na talampas sa silangan ng Dagat na Patay, sa gitnang Jordan ngayon, mula sa bangin ng Zered (Wadi Hasa) sa timog hanggang sa mga kapatagan sa tapat ng Jerico sa hilaga, na hinahati sa dalawa ng malalim na bangin ng Arnon (Wadi Mujib). Nasa Cir-hareseth ang punto sa mapa, ang Kerak ngayon, ang pangunahing lungsod nito sa timog ng Arnon, mga 80 km sa timog-silangan ng Jerusalem sa tuwid na guhit sa kabila ng Dagat na Patay. Tinatawag ng Mga Bilang ang Arnon na “hangganan ng Moab, na nasa pagitan ng Moab at ng mga Amorrheo”: ang lupain sa hilaga nito, kasama ang Dibon, Medeba at Hesbon, ay ilang beses na nagpalipat-lipat sa pagitan ng Moab at Israel."
    - "Karamihan sa mga salaysay ng Biblia tungkol sa Moab ay nangyayari sa mga gilid nito. Ang huling kampo ng Israel bago ang pagtawid ay “sa mga kapatagan ng Moab sa dako roon ng Jordan na nasa tapat ng Jerico”, at namatay si Moises “roon sa lupain ng Moab” sa Bundok Nebo, mga 65 km sa hilaga ng punto sa mapa; “sinomang tao ay hindi nakaaalam ng libingan niya hanggang sa araw na ito”. Nang mga araw ng mga hukom, isang lalaki ng Bethlehem ang “yumaong nakipamayan sa lupain ng Moab” kasama ang kaniyang asawang si Noemi, at bumalik kasama niya si Ruth na Moabita; ang talampas ng Moab ay makikita sa kabila ng Dagat na Patay mula sa mga burol ng Juda."
    - "Noong ika-9 na siglo BK, “Si Mesa nga na hari sa Moab ay may mga tupa”, na nagbayad ng buwis sa Israel ng mga kordero at lana at pagkatapos ay naghimagsik; ang kaniyang sariling stele, na natagpuan sa Dibon noong 1868 at nasa Louvre ngayon, ay nagsasalaysay kung paano niya binawi ang hilaga ng lupain. Naglaho ang Moab bilang kaharian pagkatapos ng mga pananakop ng Babilonia noong ika-6 na siglo BK; ang talampas ay napunta sa mga Nabateo at noong 106 AD sa lalawigang Romano ng Arabia, at ngayon ay mga gobernoratong Madaba at Karak."
  da:
    - "Moab var højsletten øst for Det Døde Hav, i dagens centrale Jordan, fra Zered-kløften (Wadi Hasa) i syd til sletterne over for Jeriko i nord, delt i to af Arnons dybe kløft (Wadi Mujib). Kortets punkt står på Kir-Hareset, nutidens Kerak, dens hovedby syd for Arnon, ca. 80 km sydøst for Jerusalem i fugleflugt tværs over Det Døde Hav. Fjerde Mosebog kalder Arnon »Moabs Landemærke imellem Moab og imellem Amoriterne«: Landet nord for den, med Dibon, Medeba og Hesjbon, skiftede hænder mellem Moab og Israel mere end én gang."
    - "Det meste af Bibelens beretninger om Moab foregår i dets udkant. Israels sidste lejr før overgangen lå »paa Moabiternes slette Marker, paa hin Side Jordanen mod Jeriko«, og Moses døde »i Moabs Land« på Nebo, ca. 65 km nord for kortets punkt; »ingen ved hans Grav indtil denne Dag«. I dommernes dage drog en mand fra Betlehem med sin hustru Noomi »hen at opholde sig i Moabiternes Land«, og moabitten Ruth kom tilbage med hende; Moabs højslette kan ses over Det Døde Hav fra Judas bjerge."
    - "I 800-tallet f.Kr. »Mesa, Moabiternes Konge, havde meget Kvæg«, og han betalte Israel skat i lam og uld og gjorde derefter oprør; hans egen stele, fundet i Dibon i 1868 og nu i Louvre, fortæller, hvordan han tog landets nordlige del tilbage. Moab svandt som kongerige efter de babyloniske erobringer i 500-tallet f.Kr.; højsletten overgik til nabatæerne og i 106 e.Kr. til den romerske provins Arabien, og i dag er den guvernementerne Madaba og Karak."
  sr:
    - "Моав је била висока висораван источно од Мртвог мора, у данашњем централном Јордану, од клисуре Заред (Вади Хаса) на југу до равница наспрам Јерихона на северу, расечена на двоје дубоким кањоном Арнона (Вади Муџиб). Тачка на карти стоји на Кир-Хареси, данашњем Кераку, његовом главном граду јужно од Арнона, око 80 км југоисточно од Јерусалима ваздушном линијом преко Мртвог мора. Књига Бројева назива Арнон „међа моавска између Моаваца и Аморејаца“: земља северно од њега, са Девоном, Медевом и Есевоном, више пута је прелазила из руку Моава у руке Израела и обратно."
    - "Већина библијских прича о Моаву збива се на његовим ободима. Последњи логор Израела пред прелаз био је „у пољу моавском с оне стране Јордана према Јерихону“, а Мојсије је умро „у земљи моавској“ на гори Нево, око 65 км северно од тачке на карти; „нико не дозна за гроб његов до данашњег дана“. У време судија један човек из Витлејема отишао је „да живи као дошљак у земљи моавској“ са женом својом Нојемин, а Рута Моавка вратила се са њом; висораван Моава види се преко Мртвог мора са јудејских брда."
    - "У деветом веку п. н. е. „Миса цар моавски имаше много стоке“, па је Израелу плаћао данак у јагњадима и вуни, а затим се побунио; његова сопствена стела, пронађена у Девону 1868. и сада у Лувру, прича како је повратио север земље. Моав је као краљевство ишчезао после вавилонских освајања у шестом веку п. н. е.; висораван је припала Набатејцима, а 106. н. е. римској провинцији Арабији, и данас су то гувернорати Мадаба и Керак."
