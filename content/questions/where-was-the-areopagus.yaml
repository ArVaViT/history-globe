id: where-was-the-areopagus
question:
  en: "Where was the Areopagus?"
  ru: "Где находился ареопаг?"
  uk: "Де був Ареопаг?"
  es: "¿Dónde estaba el Areópago?"
  pt: "Onde ficava o Areópago?"
  de: "Wo lag der Areopag?"
  fr: "Où se trouvait l’Aréopage ?"
  pl: "Gdzie leżał Areopag?"
  it: "Dov’era l’Areòpago?"
  cs: "Kde byl Areopag?"
  nl: "Waar lag de Areopagus?"
  sv: "Var låg Areopagen?"
  nb: "Hvor lå Areopagos?"
answer:
  en:
    - "The Areopagus, “hill of Ares”, is the bare rocky outcrop in Athens just north-west of the Acropolis, between it and the ancient Agora; the map point stands on it. The name belonged both to the hill and to the council that once met there, the oldest court of Athens, and that double meaning is behind the question of where exactly Paul spoke."
    - "Luke says that the philosophers of the Agora “took him, and brought him unto Areopagus”, and that “Paul stood in the midst of Mars' hill” and began: “Ye men of Athens, I perceive that in all things ye are too superstitious.” He had seen “an altar with this inscription, TO THE UNKNOWN GOD”; Pausanias, a century later, saw altars of unknown gods at Phalerum near Athens, and Philostratus says such altars stood in Athens itself. One of the hearers who believed was “Dionysius the Areopagite”, a member of the council."
    - "In Roman times the council of the Areopagus still oversaw religion and the schools, and some scholars read the scene as a hearing before it; by then it may have met in the Royal Stoa in the Agora rather than on the rock, so Paul's audience may have stood below the hill. Others take Luke's words at face value and put the speech on the rock itself, where a bronze plaque with its text is now fixed. Either way the place is within a few hundred metres, in the heart of classical Athens, in about AD 50."
  ru:
    - "Ареопаг, «холм Ареса», — голый скалистый выступ в Афинах чуть северо-западнее Акрополя, между ним и древней Агорой; точка на карте стоит на нём. Имя принадлежало и холму, и совету, который некогда собирался на нём, — древнейшему суду Афин, и в этой двойственности причина вопроса, где именно говорил Павел."
    - "Лука говорит, что философы с площади, «взяв его, привели в ареопаг», и что, «став Павел среди ареопага, сказал: Афиняне! по всему вижу я, что вы как бы особенно набожны». Он нашёл «жертвенник, на котором написано: “неведомому Богу”»; Павсаний столетие спустя видел жертвенники неведомым богам в Фалере близ Афин, а Филострат пишет, что такие жертвенники стояли и в самих Афинах. Среди уверовавших слушателей был «Дионисий Ареопагит», член совета."
    - "В римское время совет ареопага по-прежнему ведал религией и школами, и некоторые учёные читают сцену как разбирательство перед ним; к тому времени он мог заседать в Царской стое на Агоре, а не на скале, так что слушатели Павла, возможно, стояли под холмом. Другие понимают слова Луки буквально и помещают речь на саму скалу, где теперь укреплена бронзовая доска с её текстом. В любом случае место — в пределах нескольких сотен метров, в самом сердце классических Афин, около 50 г. н. э."
  uk:
    - "Ареопаг, «пагорб Ареса», — голий скелястий виступ в Афінах одразу на північний захід від Акрополя, між ним і давньою Агорою; точка на мапі стоїть на ньому. Назва належала і пагорбу, і раді, що колись там збиралася, найстарішому суду Афін, і ця подвійність стоїть за питанням, де саме говорив Павло."
    - "Лука каже, що філософи Агори «схопивши його, повели в Ареопаг», і що «Ставши ж Павел посерединї Ареопага», він почав: «Мужі Атиняне, по всьому виджу, що ви вельми побожні.» Він бачив «жертівню, на котрій написано: Невідомому Богу»; Павсаній через століття бачив жертовники невідомим богам у Фалері біля Афін, а Філострат каже, що такі жертовники стояли в самих Афінах. Один із слухачів, які увірували, був «Дионисий Ареопагит», член ради."
    - "За римських часів рада Ареопагу ще наглядала за релігією та школами, і дехто з учених читає сцену як слухання перед нею; тоді вона, можливо, збиралася в Царській стої на Агорі, а не на скелі, тож слухачі Павла могли стояти під пагорбом. Інші беруть слова Луки буквально й поміщають промову на самій скелі, де нині закріплено бронзову таблицю з її текстом. Так чи так, місце розташоване в межах кількох сотень метрів, у серці класичних Афін, близько 50 р. н. е."
  es:
    - "El Areópago, «colina de Ares», es el afloramiento rocoso desnudo de Atenas, justo al noroeste de la Acrópolis, entre ella y el Ágora antigua; el punto del mapa está sobre él. El nombre pertenecía tanto a la colina como al consejo que se reunía allí, el tribunal más antiguo de Atenas, y ese doble sentido está detrás de la cuestión de dónde habló exactamente Pablo."
    - "Lucas dice que los filósofos del Ágora «tomándole, le trajeron al Areópago», y que «estando pues Pablo en medio del Areópago» empezó: «Varones Atenienses, en todo os veo como más supersticiosos». Había visto «un altar en el cual estaba esta inscripción: AL DIOS NO CONOCIDO»; Pausanias, un siglo después, vio altares de dioses desconocidos en Falero, cerca de Atenas, y Filóstrato dice que tales altares había en la propia Atenas. Uno de los oyentes que creyeron fue «Dionisio el del Areópago», miembro del consejo."
    - "En época romana el consejo del Areópago aún supervisaba la religión y las escuelas, y algunos estudiosos leen la escena como una audiencia ante él; para entonces pudo reunirse en el Pórtico Real del Ágora y no en la roca, de modo que el auditorio de Pablo pudo estar al pie de la colina. Otros toman las palabras de Lucas al pie de la letra y sitúan el discurso en la propia roca, donde hoy hay fijada una placa de bronce con su texto. En cualquier caso, el lugar está a pocos cientos de metros, en el corazón de la Atenas clásica, hacia el 50 d. C."
  pt:
    - "O Areópago, “colina de Ares”, é o afloramento rochoso nu em Atenas, logo a noroeste da Acrópole, entre ela e a antiga Ágora; o ponto do mapa fica sobre ele. O nome pertencia tanto à colina quanto ao conselho que ali se reunia outrora, o mais antigo tribunal de Atenas, e esse duplo sentido está por trás da pergunta sobre onde exatamente Paulo falou."
    - "Lucas diz que os filósofos da Ágora “o levaram ao Areópago”, e que “Paulo levantou-se no meio do Areópago e disse: Homens de Atenas, percebo que em todas as coisas vocês são muito religiosos.” Ele vira “um altar com esta inscrição: ‘A UM DEUS DESCONHECIDO’”; Pausânias, um século depois, viu altares de deuses desconhecidos em Falero, perto de Atenas, e Filóstrato diz que tais altares havia na própria Atenas. Um dos ouvintes que creram foi “Dionísio, o areopagita”, membro do conselho."
    - "Na época romana, o conselho do Areópago ainda supervisionava a religião e as escolas, e alguns estudiosos leem a cena como uma audiência diante dele; a essa altura, ele talvez se reunisse no Pórtico Real, na Ágora, e não na rocha, de modo que o auditório de Paulo pode ter ficado abaixo da colina. Outros tomam as palavras de Lucas ao pé da letra e põem o discurso na própria rocha, onde hoje está fixada uma placa de bronze com o seu texto. De qualquer modo, o lugar fica a poucas centenas de metros, no coração da Atenas clássica, por volta de 50 d.C."
  de:
    - "Der Areopag, „Hügel des Ares“, ist der kahle Felsvorsprung in Athen nordwestlich der Akropolis, zwischen ihr und der antiken Agora; der Kartenpunkt steht darauf. Der Name galt sowohl dem Hügel als auch dem Rat, der einst dort tagte, dem ältesten Gericht Athens, und diese Doppelbedeutung steht hinter der Frage, wo genau Paulus sprach."
    - "Lukas sagt, die Philosophen der Agora „nahmen ihn aber und führten ihn auf den Gerichtsplatz“ und „Paulus aber stand mitten auf dem Gerichtsplatz“ und begann: „Ihr Männer von Athen, ich sehe, daß ihr in allen Stücken gar sehr die Götter fürchtet.“ Er hatte „einen Altar“ gesehen, „darauf war geschrieben: Dem unbekannten Gott“; Pausanias sah ein Jahrhundert später Altäre unbekannter Götter in Phaleron bei Athen, und Philostratos sagt, solche Altäre hätten in Athen selbst gestanden. Einer der Hörer, die gläubig wurden, war „Dionysius, einer aus dem Rat“, ein Mitglied des Rates."
    - "In römischer Zeit überwachte der Rat des Areopags noch Religion und Schulen, und manche Forscher lesen die Szene als Verhör vor ihm; damals tagte er vielleicht in der Königshalle der Agora statt auf dem Felsen, sodass Paulus’ Zuhörer unterhalb des Hügels gestanden haben könnten. Andere nehmen die Worte des Lukas beim Wort und verlegen die Rede auf den Felsen selbst, wo heute eine Bronzetafel mit ihrem Text angebracht ist. So oder so liegt der Ort um 50 n. Chr. innerhalb weniger hundert Meter im Herzen des klassischen Athen."
  fr:
    - "L’Aréopage, « colline d’Arès », est l’affleurement rocheux nu d’Athènes situé juste au nord-ouest de l’Acropole, entre elle et l’ancienne Agora ; le point de la carte s’y trouve. Le nom appartenait à la fois à la colline et au conseil qui s’y réunissait autrefois, le plus ancien tribunal d’Athènes, et c’est ce double sens qui est à l’origine de la question de savoir où exactement Paul parla."
    - "Luc dit que les philosophes de l’Agora « le prirent, et le menèrent à l’Aréopage », et que « Paul, debout au milieu de l’Aréopage, dit : Hommes Athéniens, je vous trouve à tous égards extrêmement religieux. » Il avait vu « un autel avec cette inscription : À un dieu inconnu ! » ; Pausanias, un siècle plus tard, vit des autels de dieux inconnus à Phalère, près d’Athènes, et Philostrate dit que de tels autels se dressaient dans Athènes même. L’un des auditeurs qui crurent fut « Denys l’aréopagite », membre du conseil."
    - "À l’époque romaine, le conseil de l’Aréopage surveillait encore la religion et les écoles, et certains spécialistes lisent la scène comme une audition devant lui ; à ce moment-là, il se réunissait peut-être au portique royal de l’Agora plutôt que sur le rocher, de sorte que l’auditoire de Paul pouvait se tenir en contrebas de la colline. D’autres prennent les mots de Luc à la lettre et placent le discours sur le rocher même, où une plaque de bronze portant son texte est aujourd’hui fixée. Dans les deux cas, le lieu est à quelques centaines de mètres, au cœur de l’Athènes classique, vers 50 apr. J.-C."
  pl:
    - "Areopag, „wzgórze Aresa”, to gołe skaliste wzniesienie w Atenach tuż na północny zachód od Akropolu, między nim a starożytną Agorą; stoi na nim punkt na mapie. Nazwa należała zarówno do wzgórza, jak i do rady, która niegdyś tam zasiadała, najstarszego sądu Aten, a ta podwójność kryje się za pytaniem, gdzie dokładnie przemawiał Paweł."
    - "Łukasz mówi, że filozofowie z Agory „porwawszy go, wiedli do Areopagu”, i że „Paweł stanąwszy w pośrodku Areopagu, rzekł: Mężowie Ateńscy! z każdej miary was widzę nader nabożnych”. Zobaczył „ołtarz, na którym napisano: Nieznajomemu Bogu”; Pauzaniasz, wiek później, widział ołtarze nieznanych bogów w Faleronie koło Aten, a Filostrat mówi, że takie ołtarze stały w samych Atenach. Jednym ze słuchaczy, którzy uwierzyli, był „Dyjonizyjusz Areopagitczyk”, członek rady."
    - "W czasach rzymskich rada Areopagu wciąż nadzorowała religię i szkoły, a niektórzy uczeni odczytują scenę jako przesłuchanie przed nią; do tego czasu mogła zasiadać w Stoa Królewskiej na Agorze, a nie na skale, więc słuchacze Pawła mogli stać pod wzgórzem. Inni biorą słowa Łukasza dosłownie i umieszczają mowę na samej skale, gdzie dziś przymocowana jest brązowa tablica z jej tekstem. Tak czy inaczej, miejsce leży w obrębie kilkuset metrów, w sercu klasycznych Aten, około 50 n.e."
  it:
    - "L’Areòpago, «colle di Ares», è l’affioramento roccioso nudo di Atene appena a nord-ovest dell’Acropoli, tra questa e l’antica Agorà; il punto della mappa si trova su di esso. Il nome apparteneva sia al colle sia al consiglio che vi si riuniva un tempo, il più antico tribunale di Atene, e quel doppio significato è all’origine della questione di dove esattamente parlò Paolo."
    - "Luca dice che i filosofi dell’Agorà, «presolo con sé, lo condussero su nell’Areopàgo», e che «Paolo, stando in piè in mezzo all’Areopàgo» cominciò: «Ateniesi, io veggo che siete in ogni cosa quasi troppo religiosi». Aveva visto «un altare sul quale era scritto: Al dio sconosciuto»; Pausania, un secolo dopo, vide altari di dèi ignoti a Falero presso Atene, e Filostrato dice che tali altari sorgevano nella stessa Atene. Uno degli ascoltatori che credettero fu «Dionisio l’Areopagita», membro del consiglio."
    - "In età romana il consiglio dell’Areòpago vigilava ancora sulla religione e sulle scuole, e alcuni studiosi leggono la scena come un’audizione davanti ad esso; a quel tempo può essersi riunito nella Stoà Regia nell’Agorà piuttosto che sulla roccia, così che l’uditorio di Paolo può essersi trovato sotto il colle. Altri prendono le parole di Luca alla lettera e collocano il discorso sulla roccia stessa, dove ora è fissata una targa di bronzo con il suo testo. In ogni caso il luogo è entro poche centinaia di metri, nel cuore dell’Atene classica, verso il 50 d.C."
  cs:
    - "Areopag, „Areův pahorek“, je holá skalnatá vyvýšenina v Aténách těsně severozápadně od Akropole, mezi ní a starověkou Agorou; stojí na ní bod na mapě. Jméno patřilo jak pahorku, tak radě, která se tam kdysi scházela, nejstaršímu soudu Atén, a tento dvojí význam stojí za otázkou, kde přesně Pavel mluvil."
    - "Lukáš říká, že filozofové z Agory „popadše jej, vedli ho do Areopágu“ a že „Pavel, stoje uprostřed Areopágu, řekl: Muži Aténští, vidím vás býti všelijak příliš nábožné lidi“. Spatřil „oltář, na kterémž napsáno jest: Neznámému Bohu“; Pausaniás o století později viděl oltáře neznámých bohů ve Faléru u Atén a Filostratos říká, že takové oltáře stály v samotných Aténách. Jedním z posluchačů, kteří uvěřili, byl „Dionyzius Areopagitský“, člen rady."
    - "V římské době rada Areopagu stále dohlížela na náboženství a školy a někteří badatelé čtou scénu jako slyšení před ní; tehdy se mohla scházet spíše v Královské stoe na Agoře než na skále, takže Pavlovi posluchači mohli stát pod pahorkem. Jiní berou Lukášova slova doslova a kladou řeč na samu skálu, kde je nyní upevněna bronzová deska s jejím textem. Tak či onak je místo do několika set metrů, v srdci klasických Atén, kolem roku 50 n. l."
  nl:
    - "De Areopagus, “heuvel van Ares”, is de kale rotsrichel in Athene net ten noordwesten van de Akropolis, tussen deze en de oude Agora; het punt op de kaart staat erop. De naam hoorde zowel bij de heuvel als bij de raad die er ooit vergaderde, de oudste rechtbank van Athene, en die dubbele betekenis ligt achter de vraag waar Paulus precies sprak."
    - "Lukas zegt dat de filosofen van de Agora hem meenamen: “zij namen hem, en brachten hem op de plaats, genaamd Areopagus”, en dat “Paulus, staande in het midden van de plaats, genaamd Areopagus”, begon: “Gij mannen van Athene! ik bemerke, dat gij alleszins gelijk als godsdienstiger zijt.” Hij had zelf “ook een altaar gevonden, op hetwelk een opschrift stond: DEN ONBEKENDEN GOD”; Pausanias zag een eeuw later altaren van onbekende goden bij Phaleron nabij Athene, en Philostratus zegt dat zulke altaren in Athene zelf stonden. Een van de toehoorders die geloofden was “Dionysius, de Areopagiet”, een lid van de raad."
    - "In de Romeinse tijd hield de raad van de Areopagus nog toezicht op de religie en de scholen, en sommige geleerden lezen het tafereel als een verhoor voor die raad; tegen die tijd kan zij vergaderd hebben in de Koninklijke Stoa in de Agora in plaats van op de rots, zodat het gehoor van Paulus onder de heuvel kan hebben gestaan. Anderen nemen de woorden van Lukas letterlijk en plaatsen de rede op de rots zelf, waar nu een bronzen plaquette met de tekst is bevestigd. In beide gevallen ligt de plaats binnen enkele honderden meters, in het hart van het klassieke Athene, omstreeks 50 n.Chr."
  sv:
    - "Areopagen, ”Ares’ kulle”, är den kala klippkullen i Aten strax nordväst om Akropolis, mellan den och den antika Agoran; kartpunkten står på den. Namnet tillhörde både kullen och rådet som en gång möttes där, Atens äldsta domstol, och den dubbla betydelsen ligger bakom frågan om var exakt Paulus talade."
    - "Lukas säger att filosoferna på Agoran ”grepo honom och förde honom till Areopagen” och att ”Paulus trädde fram mitt på Areopagen” och började: ”Atenare, jag ser av allting att I ären mycket ivriga gudsdyrkare.” Han hade sett ”ett altare med den inskriften: ’Åt en okänd Gud.’” Pausanias såg ett sekel senare altare åt okända gudar vid Faleron nära Aten, och Filostratos säger att sådana altare fanns i själva Aten. En av åhörarna som kom till tro var ”Dionysius, han som tillhörde Areopagens domstol”, en medlem av rådet."
    - "Under romersk tid övervakade Areopagens råd fortfarande religionen och skolorna, och vissa forskare läser scenen som en förhandling inför det; då kan det ha sammanträtt i Kungliga stoan på Agoran snarare än på klippan, så Paulus’ åhörare kan ha stått nedanför kullen. Andra tar Lukas ord bokstavligt och förlägger talet till själva klippan, där en bronsplakett med dess text nu är fäst. Hur som helst ligger platsen inom några hundra meter, i hjärtat av det klassiska Aten, omkring år 50 e.Kr."
  nb:
    - "Areopagos, «Ares’ høyde», er den nakne klippeknausen i Aten like nordvest for Akropolis, mellom den og den antikke Agora; kartpunktet står på den. Navnet hørte både til høyden og til rådet som en gang møttes der, Atens eldste domstol, og den doble betydningen ligger bak spørsmålet om hvor nøyaktig Paulus talte."
    - "Lukas forteller om filosofene på Agora: «Så tok de ham ved hånden og førte ham op på Areopagus», og der «stod da Paulus frem midt på Areopagus og sa: Atenske menn! I alle måter ser jeg at I er ivrige i eders gudsfrykt.» Han hadde sett «et alter som det var satt den innskrift på: For en ukjent Gud»; Pausanias så et århundre senere altere for ukjente guder ved Faleron nær Aten, og Filostratos sier at slike altere sto i selve Aten. En av tilhørerne som kom til troen, var «Dionysius, en av Areopagus-dommerne», et medlem av rådet."
    - "I romersk tid førte Areopagos-rådet fortsatt tilsyn med religion og skoler, og noen forskere leser scenen som en høring for det; da kan det ha møttes i Kongestoaen på Agora i stedet for på klippen, så Paulus’ tilhørere kan ha stått nedenfor høyden. Andre tar Lukas’ ord på ordet og legger talen til selve klippen, der en bronseplakett med teksten nå er festet. Uansett ligger stedet innenfor noen hundre meter, i hjertet av det klassiske Aten, omkring 50 e.Kr."
