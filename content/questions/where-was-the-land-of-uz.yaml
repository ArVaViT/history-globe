id: where-was-the-land-of-uz
question:
  en: "Where was the land of Uz?"
  ru: "Где находилась земля Уц?"
  uk: "Де була земля Уз?"
  es: "¿Dónde estaba la tierra de Uz?"
  pt: "Onde ficava a terra de Uz?"
  de: "Wo lag das Land Uz?"
  fr: "Où se trouvait le pays d’Uts ?"
  pl: "Gdzie leżała ziemia Uz?"
  it: "Dov’era la terra di Uz?"
  cs: "Kde ležela země Úc?"
  nl: "Waar lag het land Uz?"
  sv: "Var låg landet Us?"
  nb: "Hvor lå landet Us?"
answer:
  en:
    - "The land of Uz, Job's home, is not located by the Bible, and two regions compete: Edom and the desert south-east of the Dead Sea, where the map point stands, about 120 km from Jerusalem in a straight line, and the Hauran south of Damascus, on the edge of the Syrian desert, where the tomb of Job was shown in antiquity."
    - "The book opens: “There was a man in the land of Uz, whose name was Job.” The case for Edom is made by Lamentations, which addresses the “daughter of Edom, that dwellest in the land of Uz”, by the Uz who is a grandson of Seir the Horite in Genesis 36, and by Job's friend Eliphaz, who comes from Teman, a district of Edom. The case for the north is made by the Uz who is a son of Aram in Genesis 10 and a nephew of Abraham in the family of Nahor in Genesis 22, both pointing to the Aramaean country; Josephus says that Uz founded Trachonitis and Damascus."
    - "Jeremiah lists “all the kings of the land of Uz” between Egypt and the Philistines, which helps little. The raiders of Job's story, Sabeans and Chaldeans, point to Arabia and Mesopotamia and could reach either region. In the late fourth century the pilgrim Egeria visited the tomb of Job at Carneas in the Hauran, usually placed at Sheikh Saad, where a shrine of Job still stands. The map shows Edom, following Lamentations, and lists the other reading on the place card; the book of Job itself gives no date."
  ru:
    - "Землю Уц, родину Иова, Библия не привязывает к месту, и за неё спорят две области: Едом и пустыня к юго-востоку от Мёртвого моря, где стоит точка на карте, примерно в 120 км от Иерусалима по прямой, и Хауран к югу от Дамаска, на краю Сирийской пустыни, где в древности показывали гробницу Иова."
    - "Книга начинается словами: «Был человек в земле Уц, имя его Иов». За Едом говорит Плач Иеремии: «Радуйся и веселись, дочь Едома, обитательница земли Уц!» — а также Уц — внук Сеира Хорреянина в Бытии 36 и друг Иова Елифаз, пришедший из Фемана, области Едома. За север — Уц, сын Арама в Бытии 10, и Уц, племянник Авраама из рода Нахора в Бытии 22; оба указывают на арамейские земли, и Иосиф Флавий пишет, что Уц основал Трахонитиду и Дамаск."
    - "Иеремия называет «всех царей земли Уца» между Египтом и филистимлянами, и это мало помогает. Грабители из рассказа об Иове, савеяне и халдеи, указывают на Аравию и Месопотамию и могли дойти до любой из двух областей. В конце IV века паломница Эгерия посетила гробницу Иова в Карнеасе в Хауране; его обычно помещают в Шейх-Саад, где святилище Иова стоит до сих пор. Карта показывает Едом, следуя Плачу Иеремии, а другое чтение приводит в карточке; сама книга Иова даты не даёт."
  uk:
    - "Землю Уз, батьківщину Йова, Біблія не локалізує, і змагаються два краї: Едом і пустеля на південний схід від Мертвого моря, де стоїть точка на мапі, приблизно за 120 км від Єрусалима по прямій, та Хавран на південь від Дамаска, на краю Сирійської пустелі, де в давнину показували гробницю Йова."
    - "Книга починається: «Був (давно) чоловік у землї Уз, на імя Йов.» Доказ на користь Едому наводять Плач Єремії, що звертається до «дочко Едомова ... ти, що живеш там у землї Уз», Уз, який є онуком хорита Сеїра в Книзі Буття 36, та друг Йова Еліфаз, що походить із Темана, округу Едому. Доказ на користь півночі наводять Уз, який є сином Арама в Книзі Буття 10, і небожем Авраама з родини Нахора в Книзі Буття 22 — обидва вказують на арамейський край; Йосиф Флавій каже, що Уз заснував Трахонітську область і Дамаск."
    - "Єремія перелічує «всїх царів ув Уз-землї» між Єгиптом і філістимлянами, що мало допомагає. Напасники з оповіді про Йова, савеї й халдеї, вказують на Аравію й Месопотамію і могли дістатися до будь-якого з країв. Наприкінці IV ст. паломниця Егерія відвідала гробницю Йова в Карнеасі на Хаврані, яку зазвичай розміщують у Шейх-Саді, де досі стоїть святиня Йова. Мапа показує Едом, услід за Плачем Єремії, а інше прочитання перелічує в картці місця; сама Книга Йова не подає дати."
  es:
    - "La tierra de Uz, patria de Job, no la sitúa la Biblia, y dos regiones compiten: Edom y el desierto al sureste del mar Muerto, donde está el punto del mapa, a unos 120 km de Jerusalén en línea recta, y el Haurán, al sur de Damasco, en el borde del desierto sirio, donde en la Antigüedad se mostraba la tumba de Job."
    - "El libro se abre así: «Hubo un varón en tierra de Hus, llamado Job». El argumento a favor de Edom lo aportan Lamentaciones, que se dirige a la «hija de Edom, la que habitas en tierra de Hus», el Uz nieto de Seir el horeo en Génesis 36 y el amigo de Job, Elifaz, que viene de Temán, un distrito de Edom. El argumento a favor del norte lo aportan el Uz hijo de Aram en Génesis 10 y sobrino de Abraham en la familia de Nacor en Génesis 22, ambos apuntando al país arameo; Josefo dice que Uz fundó Traconite y Damasco."
    - "Jeremías enumera a «todos los reyes de tierra de Hus» entre Egipto y los filisteos, lo que ayuda poco. Los salteadores del relato de Job, sabeos y caldeos, apuntan a Arabia y a Mesopotamia y podían llegar a cualquiera de las dos regiones. A finales del siglo IV, la peregrina Egeria visitó la tumba de Job en Carneas, en el Haurán, que suele situarse en Sheikh Saad, donde aún se alza un santuario de Job. El mapa muestra Edom, siguiendo a Lamentaciones, y enumera la otra lectura en la ficha del lugar; el propio libro de Job no da fecha."
  pt:
    - "A terra de Uz, a pátria de Jó, não é localizada pela Bíblia, e duas regiões competem: Edom e o deserto a sudeste do mar Morto, onde está o ponto do mapa, a cerca de 120 km de Jerusalém em linha reta, e o Haurã, ao sul de Damasco, na orla do deserto sírio, onde o túmulo de Jó era mostrado na Antiguidade."
    - "O livro abre assim: “Havia um homem na terra de Uz, cujo nome era Jó.” O argumento a favor de Edom é feito por Lamentações, que se dirige à “filha de Edom, que habita na terra de Uz”, pelo Uz que é neto de Seir, o horeu, em Gênesis 36, e pelo amigo de Jó, Elifaz, que vem de Temã, um distrito de Edom. O argumento a favor do norte é feito pelo Uz que é filho de Arã em Gênesis 10 e sobrinho de Abraão na família de Naor em Gênesis 22, ambos apontando para o país arameu; Josefo diz que Uz fundou Traconites e Damasco."
    - "Jeremias enumera “todos os reis da terra de Uz” entre o Egito e os filisteus, o que ajuda pouco. Os saqueadores da história de Jó, sabeus e caldeus, apontam para a Arábia e a Mesopotâmia e podiam chegar a qualquer das duas regiões. No fim do século IV, a peregrina Egéria visitou o túmulo de Jó em Carneas, no Haurã, geralmente situada em Sheikh Saad, onde ainda se ergue um santuário de Jó. O mapa mostra Edom, seguindo Lamentações, e relaciona a outra leitura na ficha do lugar; o próprio livro de Jó não dá data."
  de:
    - "Das Land Uz, Hiobs Heimat, wird von der Bibel nicht verortet, und zwei Regionen konkurrieren: Edom und die Wüste südöstlich des Toten Meeres, wo der Kartenpunkt steht, in der Luftlinie etwa 120 km von Jerusalem, und das Hauran südlich von Damaskus am Rand der syrischen Wüste, wo in der Antike das Grab Hiobs gezeigt wurde."
    - "Das Buch beginnt: „Es war ein Mann im Lande Uz, der hieß Hiob.“ Für Edom sprechen die Klagelieder, die die „Tochter Edom, die du wohnst im Lande Uz“ anreden, der Uz, der in 1. Mose 36 ein Enkel Seirs des Horiters ist, und Hiobs Freund Eliphas, der aus Teman kommt, einem Gebiet Edoms. Für den Norden sprechen der Uz, der in 1. Mose 10 ein Sohn Arams und in 1. Mose 22 ein Neffe Abrahams in der Familie Nahors ist, beide auf das aramäische Land weisend; Josephus sagt, Uz habe Trachonitis und Damaskus gegründet."
    - "Jeremia nennt „allen Königen im Lande Uz“ zwischen Ägypten und den Philistern, was wenig hilft. Die Räuber der Hiobsgeschichte, Sabäer und Chaldäer, weisen nach Arabien und Mesopotamien und könnten beide Regionen erreichen. Im späten 4. Jahrhundert besuchte die Pilgerin Egeria das Grab Hiobs in Karnaim im Hauran, meist bei Scheich Saad angesetzt, wo noch ein Hiobsschrein steht. Die Karte zeigt Edom, den Klageliedern folgend, und führt die andere Lesart auf der Ortskarte auf; das Buch Hiob selbst gibt keine Datierung."
  fr:
    - "Le pays d’Uts, patrie de Job, n’est pas situé par la Bible, et deux régions se disputent : Édom et le désert au sud-est de la mer Morte, où se trouve le point de la carte, à environ 120 km de Jérusalem à vol d’oiseau, et le Havran, au sud de Damas, en bordure du désert de Syrie, où l’on montrait dans l’Antiquité le tombeau de Job."
    - "Le livre s’ouvre ainsi : « Il y avait dans le pays d’Uts un homme qui s’appelait Job. » L’argument en faveur d’Édom est fourni par les Lamentations, qui s’adressent à la « fille d’Édom, habitante du pays d’Uts », par l’Uts petit-fils de Séir le Horite en Genèse 36, et par l’ami de Job, Éliphaz, qui vient de Théman, district d’Édom. L’argument en faveur du nord est fourni par l’Uts fils d’Aram en Genèse 10 et neveu d’Abraham dans la famille de Nachor en Genèse 22, tous deux renvoyant au pays araméen ; Flavius Josèphe dit qu’Uts fonda la Trachonite et Damas."
    - "Jérémie énumère « tous les rois du pays d’Uts » entre l’Égypte et les Philistins, ce qui n’aide guère. Les pillards du récit de Job, Sabéens et Chaldéens, renvoient à l’Arabie et à la Mésopotamie et pouvaient atteindre l’une ou l’autre région. À la fin du IVe siècle, la pèlerine Égérie visita le tombeau de Job à Carneas, dans le Havran, généralement placé à Sheikh Saad, où se dresse encore un sanctuaire de Job. La carte montre Édom, d’après les Lamentations, et énumère l’autre lecture sur la fiche du lieu ; le livre de Job lui-même ne donne aucune date."
  pl:
    - "Ziemi Uz, ojczyzny Hioba, Biblia nie lokalizuje, a konkurują dwa regiony: Edom i pustynia na południowy wschód od Morza Martwego, gdzie stoi punkt na mapie, około 120 km od Jerozolimy w linii prostej, oraz Hauran na południe od Damaszku, na skraju pustyni syryjskiej, gdzie w starożytności pokazywano grób Hioba."
    - "Księga zaczyna się słowami: „Był mąż w ziemi Uz, imieniem Ijob”. Za Edomem przemawiają Lamentacje, zwracające się do „córko Edomska! która mieszkasz w ziemi Hus” (tak Biblia Gdańska oddaje tu Uz), Uz będący wnukiem Seira Choryty w Rdz 36 oraz przyjaciel Hioba Elifaz, pochodzący z Temanu, okręgu Edomu. Za północą przemawia Uz, syn Arama w Rdz 10 i bratanek Abrahama w rodzinie Nachora w Rdz 22, oba wskazujące na kraj aramejski; Józef Flawiusz mówi, że Uz założył Trachonitydę i Damaszek."
    - "Jeremiasz wymienia „wszystkich króli ziemi Uz” między Egiptem a Filistynami, co niewiele pomaga. Łupieżcy z opowieści o Hiobie, Sabejczycy i Chaldejczycy, wskazują na Arabię i Mezopotamię i mogli dotrzeć do któregokolwiek z regionów. Pod koniec IV wieku pątniczka Egeria odwiedziła grób Hioba w Karnajim w Hauranie, zwykle umieszczany w Sheikh Saad, gdzie wciąż stoi sanktuarium Hioba. Mapa pokazuje Edom, idąc za Lamentacjami, a inne odczytanie wymienia na karcie miejsca; sama Księga Hioba nie podaje daty."
  it:
    - "La terra di Uz, patria di Giobbe, non è localizzata dalla Bibbia, e due regioni si contendono il primato: Edom e il deserto a sud-est del Mar Morto, dove si trova il punto della mappa, a circa 120 km da Gerusalemme in linea d’aria, e l’Auran a sud di Damasco, al margine del deserto siriano, dove nell’antichità si mostrava la tomba di Giobbe."
    - "Il libro si apre: «C’era nel paese di Uz un uomo che si chiamava Giobbe». La tesi per Edom è sostenuta dalle Lamentazioni, che si rivolgono alla «figliuola d’Edom, che dimori nel paese di Uts», dall’Uz nipote di Seir il Corita in Gen 36, e dall’amico di Giobbe Elifaz, che viene da Teman, un distretto di Edom. La tesi per il nord è sostenuta dall’Uz figlio di Aram in Gen 10 e nipote di Abramo nella famiglia di Nacor in Gen 22, entrambi rimandanti al paese aramaico; Giuseppe Flavio dice che Uz fondò la Traconitide e Damasco."
    - "Geremia elenca tutti i re del paese di Uz tra l’Egitto e i Filistei, il che aiuta poco. I predoni della storia di Giobbe, Sabei e Caldei, rimandano all’Arabia e alla Mesopotamia e potevano raggiungere l’una o l’altra regione. Alla fine del IV secolo la pellegrina Egeria visitò la tomba di Giobbe a Carneas nell’Auran, di solito collocata a Sheikh Saad, dove sorge ancora un santuario di Giobbe. La mappa mostra Edom, seguendo le Lamentazioni, ed elenca l’altra lettura nella scheda del luogo; il libro di Giobbe stesso non dà alcuna data."
  cs:
    - "Země Úc, Jobův domov, není v Bibli lokalizována a soupeří dva kraje: Edóm a poušť jihovýchodně od Mrtvého moře, kde stojí bod na mapě, vzdušnou čarou asi 120 km od Jeruzaléma, a Havran jižně od Damašku, na okraji syrské pouště, kde se ve starověku ukazoval Jobův hrob."
    - "Kniha začíná: „Byl muž v zemi Uz, jménem Job.“ Pro Edóm mluví Pláč, který oslovuje „dcero Idumejská, kteráž jsi se usadila v zemi Uz“, Úc, který je vnukem Seíra Chorejského v Genesis 36, a Jobův přítel Elifaz, který pochází z Témánu, kraje Edómu. Pro sever mluví Úc, syn Aramův v Genesis 10 a synovec Abrahamův v rodině Nachorově v Genesis 22, oba ukazující na aramejskou zemi; Josephus říká, že Úc založil Trachonitidu a Damašek."
    - "Jeremjáš uvádí „všecky krále země Uz“ mezi Egyptem a Pelištejci, což mnoho nepomáhá. Lupiči z Jobova příběhu, Sabejští a Chaldejští, ukazují na Arábii a Mezopotámii a mohli dojít do kteréhokoli kraje. V pozdním 4. století navštívila poutnice Egerie hrob Jobův v Karneas v Havranu, obvykle kladený do Šejch Sa'du, kde dosud stojí Jobova svatyně. Mapa ukazuje Edóm podle Pláče a další čtení uvádí na kartě místa; kniha Job sama datum neuvádí."
  nl:
    - "Het land Uz, Jobs woonplaats, wordt door de Bijbel niet gelokaliseerd, en twee streken dingen ernaar: Edom en de woestijn ten zuidoosten van de Dode Zee, waar het punt op de kaart staat, hemelsbreed ongeveer 120 km van Jeruzalem, en de Hauran ten zuiden van Damascus, aan de rand van de Syrische woestijn, waar in de oudheid het graf van Job werd getoond."
    - "Het boek opent: “Er was een man in het land Uz, zijn naam was Job.” Het geval voor Edom wordt gemaakt door Klaagliederen, dat zich richt tot de “dochter Edoms, die in het land Uz woont”, door de Uz die in Gen. 36 een kleinzoon is van Seïr de Horiet, en door Jobs vriend Elifaz, die uit Teman komt, een district van Edom. Het geval voor het noorden wordt gemaakt door de Uz die in Gen. 10 een zoon van Aram is en in Gen. 22 een neef van Abraham in de familie van Nahor, beide wijzend naar het Aramese land; Josephus zegt dat Uz Trachonitis en Damascus stichtte."
    - "Jeremia noemt “allen koningen des lands van Uz” tussen Egypte en de Filistijnen, wat weinig helpt. De overvallers in het verhaal van Job, Sabeeërs en Chaldeeën, wijzen naar Arabië en Mesopotamië en konden beide streken bereiken. Aan het eind van de vierde eeuw bezocht de pelgrim Egeria het graf van Job bij Carneas in de Hauran, gewoonlijk geplaatst bij Sheikh Saad, waar nog een heiligdom van Job staat. De kaart toont Edom, volgens Klaagliederen, en noemt de andere lezing op de plaatskaart; het boek Job zelf geeft geen datum."
  sv:
    - "Landet Us, Jobs hemland, lokaliseras inte av Bibeln, och två regioner tävlar: Edom och öknen sydost om Döda havet, där kartpunkten står, omkring 120 km från Jerusalem i fågelvägen, och Hauran söder om Damaskus, i utkanten av den syriska öknen, där Jobs grav visades i antiken."
    - "Boken inleds: ”I Us’ land levde en man som hette Job.” Argumentet för Edom framförs av Klagovisorna, som vänder sig till ”du dotter Edom, du som bor i Us’ land”, av Us, som är sonson till horiten Seir i 1 Mos 36, och av Jobs vän Elifas, som kommer från Teman, ett distrikt i Edom. Argumentet för norr framförs av Us, son till Aram i 1 Mos 10 och brorson till Abraham i Nachors släkt i 1 Mos 22, som båda pekar på det arameiska landet; Josefus säger att Us grundade Trachonitis och Damaskus."
    - "Jeremia förtecknar ”alla konungar i Us’ land” mellan Egypten och filistéerna, vilket hjälper föga. Plundrarna i Jobs berättelse, sabéer och kaldéer, pekar mot Arabien och Mesopotamien och kunde nå vilken som helst av regionerna. I slutet av 300-talet besökte pilgrimen Egeria Jobs grav vid Karneas i Hauran, vanligen förlagd till Sheikh Saad, där en helgedom för Job fortfarande står. Kartan visar Edom, efter Klagovisorna, och förtecknar den andra läsningen på platskortet; själva Jobs bok anger ingen datering."
  nb:
    - "Landet Us, Jobs hjem, lokaliseres ikke av Bibelen, og to regioner konkurrerer: Edom og ørkenen sørøst for Dødehavet, der kartpunktet står, omtrent 120 km fra Jerusalem i luftlinje, og Havran sør for Damaskus, i utkanten av den syriske ørkenen, der Jobs grav ble vist i antikken."
    - "Boken åpner: «I landet Us var det en mann som hette Job.» Argumentet for Edom føres av Klagesangene, som taler til «Edoms datter, du som bor i landet Us», av Us som er et barnebarn av Se’ir horitten i 1 Mos 36, og av Jobs venn Elifas, som kommer fra Teman, et distrikt i Edom. Argumentet for nord føres av Us som er en sønn av Aram i 1 Mos 10 og en nevø av Abraham i Nahors slekt i 1 Mos 22, begge peker mot det arameiske landet; Josefus sier at Us grunnla Trakonitis og Damaskus."
    - "Jeremia oppregner «alle kongene i landet Us» mellom Egypt og filistrene, noe som hjelper lite. Røverne i Jobs fortelling, sabeerne og kaldeerne, peker mot Arabia og Mesopotamia og kunne nå begge regioner. Sent på 300-tallet besøkte pilegrimen Egeria Jobs grav ved Karnaim i Havran, vanligvis plassert ved Sheikh Saad, der en Job-helligdom fortsatt står. Kartet viser Edom, etter Klagesangene, og oppfører den andre lesningen på stedskortet; Jobs bok selv oppgir ingen datering."
