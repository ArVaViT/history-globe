id: where-was-peter-imprisoned-and-freed
question:
  en: "Where was Peter imprisoned and freed by the angel?"
  ru: "Где Пётр был заключён и освобождён ангелом?"
  uk: "Де був ув'язнений Петро і де його звільнив ангел?"
  es: "¿Dónde estuvo preso Pedro y fue liberado por el ángel?"
  pt: "Onde Pedro foi preso e libertado pelo anjo?"
  de: "Wo wurde Petrus gefangen gehalten und vom Engel befreit?"
  fr: "Où Pierre fut-il emprisonné, puis délivré par l’ange ?"
  pl: "Gdzie uwięziono Piotra i gdzie uwolnił go anioł?"
  it: "Dove fu imprigionato Pietro e liberato dall’angelo?"
  cs: "Kde byl Petr uvězněn a andělem osvobozen?"
  nl: "Waar zat Petrus gevangen en werd hij door de engel bevrijd?"
  sv: "Var satt Petrus fängslad och blev befriad av ängeln?"
  nb: "Hvor satt Peter fengslet og ble befridd av engelen?"
  tl: "Saan ibinilanggo si Pedro at pinalaya ng anghel?"
  da: "Hvor blev Peter fængslet og befriet af engelen?"
  sr: "Где је Петар био затворен и ослобођен од анђела?"
answer:
  en:
    - "In Jerusalem, at Passover of AD 44 or the year before, under Herod Agrippa I, who had just had James the brother of John beheaded. Acts does not name the prison. The royal palaces stood on the western hill above the Temple, and the Antonia fortress at the north-west corner of the Temple Mount held the garrison; either could have held Peter, and the iron gate “that leadeth unto the city” suggests a place at the edge of the built town. The house of Mary, the mother of John Mark, where the church was praying, is claimed by the Syrian Orthodox church of St Mark in the Armenian Quarter, a tradition that cannot be traced earlier than the Byzantine period. Agrippa left for Caesarea, 87 km away, and died there in 44."
    - "Luke tells it closely: Herod, having killed James, “proceeded further to take Peter also. (Then were the days of unleavened bread.)” He “delivered him to four quaternions of soldiers to keep him”. “The same night Peter was sleeping between two soldiers, bound with two chains: and the keepers before the door kept the prison. And, behold, the angel of the Lord came upon him, and a light shined in the prison”. “When they were past the first and the second ward, they came unto the iron gate that leadeth unto the city; which opened to them of his own accord”. Peter went “to the house of Mary the mother of John, whose surname was Mark; where many were gathered together praying”, then “departed, and went into another place”. Herod “examined the keepers, and commanded that they should be put to death. And he went down from Judæa to Cæsarea, and there abode.”"
    - "The date is anchored more firmly than most in Acts: Agrippa received Judea from Claudius in 41 and died at Caesarea in 44, struck down at games in the emperor's honour, as Josephus relates in agreement with Acts. Where Peter went is not said; Antioch and Rome have both been guessed. The chains venerated in Rome at San Pietro in Vincoli are said, in a later tradition, to have been sent from Jerusalem by the empress Eudocia in the fifth century. The church of St Peter in Gallicantu on the eastern slope of Mount Zion commemorates not this prison but the house of Caiaphas and Peter's denial."
  ru:
    - "В Иерусалиме, на Пасху 44 г. н. э. или годом раньше, при Ироде Агриппе I, который только что обезглавил Иакова, брата Иоаннова. Деяния не называют темницу. Царские дворцы стояли на западном холме над Храмом, а в крепости Антония на северо-западном углу Храмовой горы стоял гарнизон; Петра могли держать и там и там, а железные ворота, «ведущие в город», указывают на место у края застроенного города. Дом Марии, матери Иоанна Марка, где молилась церковь, приписывает себе сирийская православная церковь святого Марка в Армянском квартале — предание, которое не прослеживается раньше византийского времени. Агриппа уехал в Кесарию, за 87 км, и умер там в 44 году."
    - "Лука рассказывает подробно: Ирод «убил Иакова, брата Иоаннова, мечом» и, видя, что это приятно иудеям, «вслед за тем взял и Петра, - тогда были дни опресноков». Он «приказал четырем четверицам воинов стеречь его», и «в ту ночь Петр спал между двумя воинами, скованный двумя цепями, и стражи у дверей стерегли темницу. И вот, Ангел Господень предстал, и свет осиял темницу». «Пройдя первую и вторую стражу, они пришли к железным воротам, ведущим в город, которые сами собою отворились им». Пётр «пришел к дому Марии, матери Иоанна, называемого Марком, где многие собрались и молились», а потом, «выйдя, пошел в другое место». Ирод же «судил стражей и велел казнить их. Потом он отправился из Иудеи в Кесарию и там оставался»."
    - "Эта дата закреплена надёжнее большинства в Деяниях: Агриппа получил Иудею от Клавдия в 41 году и умер в Кесарии в 44-м, сражённый на играх в честь императора, как рассказывает Иосиф Флавий в согласии с Деяниями. Куда ушёл Пётр, не сказано; гадали и об Антиохии, и о Риме. О цепях, почитаемых в Риме в церкви Сан-Пьетро-ин-Винколи, позднее предание говорит, что их прислала из Иерусалима императрица Евдокия в V веке. Церковь святого Петра в Галликанту на восточном склоне горы Сион напоминает не об этой темнице, а о доме Каиафы и отречении Петра."
  uk:
    - "В Єрусалимі, на Пасху 44 р. н. е. або роком раніше, за Ірода Агриппи I, який щойно стратив мечем Якова, брата Івана. Дії не називають в'язницю. Царські палаци стояли на західному пагорбі над Храмом, а фортеця Антонія на північно-західному розі Храмової гори містила гарнізон; будь-який із них міг утримувати Петра, а залізні ворота, «що вели в город», вказують на місце на краю забудованого міста. Дім Марії, матері Івана Марка, де молилася церква, вважає своїм сирійська православна церква святого Марка у Вірменському кварталі — переказ, який не простежується раніше візантійської доби. Агриппа виїхав до Кесарії, за 87 км, і помер там 44 р."
    - "Лука розповідає докладно: Ірод, убивши Якова, «постановив схопити й Петра. (Були ж днї опрісноків.)» Він «посадив у темницю, передавши чотиром четверицям воїнів стерегти його». Як сказано, «спав тієї ночи Петр між двома воїнами, скований двома залїзами; а сторожі перед дверима стерегли темницї. І ось ангел Господень став перед ним, і сьвітло засияло в будинку». «Минувши ж перву сторожу й другу, прийшли до залїзних воріт, що вели в город, котрі самі собою відчинились їм». Петро пішов «до хати Мариї, матери Йоана, званого Марком, де многі зібрались і молились», а потім «пійшов у друге місце». Ірод «судив сторожів, та й звелїв покарати їх. І перейшовши з Юдеї в Кисарию, жив (там)»."
    - "Дата закріплена міцніше, ніж більшість у Діях: Агриппа отримав Юдею від Клавдія 41 р. і помер у Кесарії 44 р., вражений на іграх на честь імператора, як розповідає Йосиф Флавій у згоді з Діями. Куди пішов Петро — не сказано; здогадувалися про Антіохію і про Рим. Кайдани, що їх шанують у Римі в Сан-П'єтро-ін-Вінколі, за пізнішим переказом, надіслала з Єрусалима імператриця Євдокія в V ст. Церква святого Петра «Галлікантус» на східному схилі гори Сіон вшановує не цю в'язницю, а дім Каяфи й зречення Петра."
  es:
    - "En Jerusalén, en la Pascua del 44 d. C. o del año anterior, bajo Herodes Agripa I, que acababa de hacer decapitar a Jacobo, hermano de Juan. Los Hechos no nombran la cárcel. Los palacios reales estaban en la colina occidental, sobre el Templo, y la fortaleza Antonia, en la esquina noroeste del Monte del Templo, albergaba la guarnición; cualquiera de los dos pudo alojar a Pedro, y la puerta de hierro «que va á la ciudad» sugiere un lugar en el borde de la ciudad edificada. La casa de María, la madre de Juan Marcos, donde la iglesia estaba orando, la reclama la iglesia siria ortodoxa de San Marcos, en el barrio armenio, una tradición que no puede rastrearse antes del período bizantino. Agripa partió a Cesarea, a 87 km, y murió allí en el 44."
    - "Lucas lo cuenta con detalle: Herodes, tras matar a Jacobo, «pasó adelante para prender también á Pedro. Eran entonces los días de los ázimos». Lo puso en la cárcel, «entregándole á cuatro cuaterniones de soldados que le guardasen». «Aquella misma noche estaba Pedro durmiendo entre dos soldados, preso con dos cadenas, y los guardas delante de la puerta, que guardaban la cárcel. Y he aquí, el ángel del Señor sobrevino, y una luz resplandeció en la cárcel». «Y como pasaron la primera y la segunda guardia, vinieron á la puerta de hierro que va á la ciudad, la cual se les abrió de suyo». Pedro fue «á casa de María la madre de Juan, el que tenía por sobrenombre Marcos, donde muchos estaban juntos orando», y luego «partió á otro lugar». Herodes, «hecha inquisición de los guardas, los mandó llevar. Después descendiendo de Judea á Cesarea, se quedó allí»."
    - "La fecha está mejor anclada que la mayoría de las de los Hechos: Agripa recibió Judea de Claudio en 41 y murió en Cesarea en 44, herido en unos juegos en honor del emperador, como relata Josefo en concordancia con los Hechos. Adónde fue Pedro no se dice; se ha conjeturado Antioquía y Roma. Las cadenas veneradas en Roma, en San Pietro in Vincoli, se dice en una tradición posterior que las envió desde Jerusalén la emperatriz Eudocia en el siglo V. La iglesia de San Pedro in Gallicantu, en la ladera oriental del monte Sion, conmemora no esta cárcel, sino la casa de Caifás y la negación de Pedro."
  pt:
    - "Em Jerusalém, na Páscoa do ano 44 d.C. ou do ano anterior, sob Herodes Agripa I, que acabara de mandar decapitar Tiago, irmão de João. Atos não nomeia a prisão. Os palácios reais ficavam na colina ocidental acima do Templo, e a fortaleza Antônia, no canto noroeste do monte do Templo, abrigava a guarnição; qualquer um dos dois poderia ter detido Pedro, e o portão de ferro “que dá para a cidade” sugere um lugar na orla da área construída. A casa de Maria, mãe de João Marcos, onde a igreja orava, é reivindicada pela igreja ortodoxa siríaca de São Marcos, no Bairro Armênio, uma tradição que não pode ser rastreada além do período bizantino. Agripa partiu para Cesareia, a 87 km, e morreu ali em 44."
    - "Lucas conta com precisão: Herodes, tendo matado Tiago, “mandou prender também Pedro. Isso foi durante os dias dos pães asmos.” Ele “o entregou a quatro grupos de quatro soldados cada para guardá-lo”. “Naquela mesma noite… Pedro dormia entre dois soldados, acorrentado com duas cadeias. Guardas em frente à porta vigiavam a prisão.” E “eis que um anjo do Senhor apareceu ao lado dele, e uma luz brilhou na cela”. “Quando passaram pelo primeiro e pelo segundo posto de guarda, chegaram ao portão de ferro que dá para a cidade, o qual se abriu por si mesmo para eles.” Pedro foi “à casa de Maria, mãe de João, chamado Marcos, onde muitos estavam reunidos e oravam”, e então “saiu e foi para outro lugar”. Herodes “interrogou os guardas e ordenou que fossem executados. Ele desceu da Judeia para Cesareia e ali permaneceu.”"
    - "A data está ancorada com mais firmeza do que a maioria das de Atos: Agripa recebeu a Judeia de Cláudio em 41 e morreu em Cesareia em 44, ferido durante jogos em honra do imperador, como Josefo relata em concordância com Atos. Para onde Pedro foi não se diz; conjecturou-se tanto Antioquia quanto Roma. As correntes veneradas em Roma, em San Pietro in Vincoli, teriam sido enviadas de Jerusalém pela imperatriz Eudócia no século V, segundo uma tradição posterior. A igreja de São Pedro em Galicantu, na encosta oriental do monte Sião, comemora não esta prisão, mas a casa de Caifás e a negação de Pedro."
  de:
    - "In Jerusalem, zum Passa des Jahres 44 n. Chr. oder des Jahres davor, unter Herodes Agrippa I., der kurz zuvor Jakobus, den Bruder des Johannes, hatte enthaupten lassen. Die Apostelgeschichte nennt das Gefängnis nicht. Die königlichen Paläste standen auf dem westlichen Hügel über dem Tempel, und die Burg Antonia an der Nordwestecke des Tempelbergs beherbergte die Garnison; beide könnten Petrus gefangen gehalten haben, und die eiserne Tür, „welche zur Stadt führt“, deutet auf einen Ort am Rand der bebauten Stadt. Das Haus der Maria, der Mutter des Johannes Markus, wo die Gemeinde betete, wird von der syrisch-orthodoxen Markuskirche im Armenischen Viertel beansprucht, eine Überlieferung, die nicht über die byzantinische Zeit zurückreicht. Agrippa zog nach Caesarea, 87 km entfernt, und starb dort im Jahr 44."
    - "Lukas erzählt es genau: Als Herodes den Jakobus getötet hatte, „fuhr er fort und fing Petrus auch. Es waren aber eben die Tage der süßen Brote.“ Er „überantwortete ihn vier Rotten, je von vier Kriegsknechten, ihn zu bewahren“. „In derselben Nacht schlief Petrus zwischen zwei Kriegsknechten, gebunden mit zwei Ketten, und die Hüter vor der Tür hüteten das Gefängnis. Und siehe, der Engel des HERRN kam daher, und ein Licht schien in dem Gemach.“ „Sie gingen aber durch die erste und andere Hut und kamen zu der eisernen Tür, welche zur Stadt führt; die tat sich ihnen von selber auf.“ Petrus ging „vor das Haus Marias, der Mutter des Johannes, der mit dem Zunamen Markus hieß, da viele beieinander waren und beteten“, dann „ging hinaus und zog an einen andern Ort“. Herodes „ließ die Hüter verhören und hieß sie wegführen; und zog von Judäa hinab gen Cäsarea und hielt allda sein Wesen“."
    - "Das Datum ist fester verankert als die meisten in der Apostelgeschichte: Agrippa erhielt Judäa 41 von Klaudius und starb 44 in Caesarea, niedergestreckt bei Spielen zu Ehren des Kaisers, wie Josephus in Übereinstimmung mit der Apostelgeschichte berichtet. Wohin Petrus ging, wird nicht gesagt; Antiochia und Rom sind beide erraten worden. Die Ketten, die in Rom in San Pietro in Vincoli verehrt werden, sollen nach einer späteren Überlieferung im 5. Jahrhundert von der Kaiserin Eudokia aus Jerusalem geschickt worden sein. Die Kirche St. Peter in Gallicantu am Osthang des Bergs Zion erinnert nicht an dieses Gefängnis, sondern an das Haus des Kaiphas und die Verleugnung des Petrus."
  fr:
    - "À Jérusalem, à la Pâque de 44 apr. J.-C. ou de l’année précédente, sous Hérode Agrippa Ier, qui venait de faire décapiter Jacques, frère de Jean. Les Actes ne nomment pas la prison. Les palais royaux se dressaient sur la colline occidentale, au-dessus du Temple, et la forteresse Antonia, à l’angle nord-ouest du mont du Temple, abritait la garnison ; l’un ou l’autre pouvait avoir détenu Pierre, et la « porte de fer qui mène à la ville » suggère un lieu situé en bordure de la ville bâtie. La maison de Marie, mère de Jean Marc, où l’Église priait, est revendiquée par l’église syriaque orthodoxe de Saint-Marc, dans le quartier arménien, tradition qu’on ne peut remonter plus haut que l’époque byzantine. Agrippa partit pour Césarée, à 87 km de là, et y mourut en 44."
    - "Luc le raconte de près : Hérode, ayant tué Jacques, « fit encore arrêter Pierre. C’était pendant les jours des pains sans levain. » Il « le mit sous la garde de quatre escouades de quatre soldats chacune ». « Pierre, lié de deux chaînes, dormait entre deux soldats ; et des sentinelles devant la porte gardaient la prison. Et voici, un ange du Seigneur survint, et une lumière brilla dans la prison. » « Lorsqu’ils eurent passé la première garde, puis la seconde, ils arrivèrent à la porte de fer qui mène à la ville, et qui s’ouvrit d’elle-même devant eux. » Pierre se dirigea « vers la maison de Marie, mère de Jean, surnommé Marc, où beaucoup de personnes étaient réunies et priaient », puis « sortit, et s’en alla dans un autre lieu ». Hérode « interrogea les gardes, et donna l’ordre de les mener au supplice. Ensuite il descendit de la Judée à Césarée, pour y séjourner. »"
    - "La date est mieux ancrée que la plupart de celles des Actes : Agrippa reçut la Judée de Claude en 41 et mourut à Césarée en 44, frappé lors de jeux donnés en l’honneur de l’empereur, comme le rapporte Flavius Josèphe en accord avec les Actes. L’endroit où alla Pierre n’est pas dit ; on a deviné Antioche et Rome. Les chaînes vénérées à Rome, à Saint-Pierre-aux-Liens, auraient été, selon une tradition plus tardive, envoyées de Jérusalem par l’impératrice Eudocie au Ve siècle. L’église Saint-Pierre-en-Gallicante, sur le versant oriental du mont Sion, commémore non cette prison, mais la maison de Caïphe et le reniement de Pierre."
  pl:
    - "W Jerozolimie, w Paschę 44 n.e. lub rok wcześniej, za Heroda Agryppy I, który właśnie kazał ściąć Jakuba, brata Jana. Dzieje nie wymieniają więzienia. Pałace królewskie stały na zachodnim wzgórzu nad Świątynią, a twierdza Antonia na północno-zachodnim narożniku Wzgórza Świątynnego mieściła garnizon; oba mogły przetrzymywać Piotra, a żelazna brama, „która wiedzie do miasta”, wskazuje miejsce na skraju zabudowanego miasta. Dom Marii, matki Jana Marka, gdzie kościół się modlił, przypisuje sobie syryjsko-prawosławny kościół św. Marka w Dzielnicy Ormiańskiej, a tej tradycji nie da się wywieść wcześniej niż z okresu bizantyjskiego. Agryppa wyjechał do Cezarei, 87 km stąd, i tam zmarł w 44."
    - "Łukasz opowiada to szczegółowo: Herod, zabiwszy Jakuba, „umyślił pojmać i Piotra: (a były dni przaśników)”. Pojmanego podał do więzienia, „poruczywszy go szesnastu żołnierzom, aby go strzegli”. „Onejże nocy spał Piotr między dwoma żołnierzami, związany dwoma łańcuchami, a stróże przed drzwiami strzegli więzienia. A oto Anioł Pański przystąpił, a światłość się rozświeciła w gmachu”. „A gdy minęli pierwszą i wtórą straż, przyszli do bramy żelaznej, która wiedzie do miasta; a ta się im sama przez się otworzyła”. Piotr poszedł „do domu Maryi, matki Janowej, którego nazywano Markiem, gdzie się ich było wiele zgromadziło i modlili się”, potem „wyszedłszy, szedł na inne miejsce”. Herod „uczyniwszy sąd o stróżach, kazał je na stracenie wywieść; a wyjechawszy z Judzkiej ziemi do Cezaryi, mieszkał tam”."
    - "Data jest ustalona pewniej niż większość w Dziejach: Agryppa otrzymał Judeę od Klaudiusza w 41 i zmarł w Cezarei w 44, rażony na igrzyskach ku czci cesarza, jak opowiada Józef Flawiusz zgodnie z Dziejami. Dokąd poszedł Piotr, nie powiedziano; zgadywano Antiochię i Rzym. Łańcuchy czczone w Rzymie w San Pietro in Vincoli miała według późniejszej tradycji przysłać z Jerozolimy cesarzowa Eudokia w V wieku. Kościół św. Piotra in Gallicantu na wschodnim stoku góry Syjon upamiętnia nie to więzienie, lecz dom Kajfasza i zaparcie się Piotra."
  it:
    - "A Gerusalemme, nella Pasqua del 44 d.C. o dell’anno prima, sotto Erode Agrippa I, che aveva appena fatto decapitare Giacomo, fratello di Giovanni. Gli Atti non nominano la prigione. I palazzi reali sorgevano sulla collina occidentale sopra il Tempio, e la fortezza Antonia all’angolo nord-occidentale del Monte del Tempio ospitava la guarnigione; l’uno o l’altra potrebbero aver tenuto Pietro, e la porta di ferro «che mette in città» suggerisce un luogo al margine dell’abitato. La casa di Maria, madre di Giovanni Marco, dove la chiesa pregava, è rivendicata dalla chiesa siro-ortodossa di San Marco nel Quartiere Armeno, una tradizione che non si può far risalire a prima del periodo bizantino. Agrippa partì per Cesarea, a 87 km di distanza, e vi morì nel 44."
    - "Luca la racconta da vicino: Erode, dopo aver ucciso Giacomo, «fece arrestare anche Pietro. Or erano i giorni degli azzimi». Lo mise in prigione, «dandolo in guardia a quattro mute di soldati di quattro l’una». Quella notte «Pietro stava dormendo in mezzo a due soldati, legato con due catene; e le guardie davanti alla porta custodivano la prigione. Ed ecco, un angelo del Signore sopraggiunse, e una luce risplendé nella cella». «Com’ebbero passata la prima e la seconda guardia, vennero alla porta di ferro che mette in città, la quale si aperse loro da sé». Pietro andò «alla casa di Maria, madre di Giovanni soprannominato Marco, dove molti fratelli stavano raunati e pregavano», poi «se ne andò in un altro luogo». Erode, «esaminate le guardie, comandò che fosser menate al supplizio. Poi, sceso di Giudea a Cesarea, vi si trattenne»."
    - "La data è ancorata più saldamente di molte altre negli Atti: Agrippa ricevette la Giudea da Claudio nel 41 e morì a Cesarea nel 44, colpito durante dei giochi in onore dell’imperatore, come racconta Giuseppe Flavio in accordo con gli Atti. Dove andò Pietro non è detto; sono state ipotizzate sia Antiochia sia Roma. Le catene venerate a Roma a San Pietro in Vincoli si dice, secondo una tradizione posteriore, che furono inviate da Gerusalemme dall’imperatrice Eudocia nel V secolo. La chiesa di San Pietro in Gallicantu sul pendio orientale del Monte Sion commemora non questa prigione ma la casa di Caifa e il rinnegamento di Pietro."
  cs:
    - "V Jeruzalémě, o velikonocích roku 44 n. l. nebo rok předtím, za Heroda Agrippy I., který právě nechal stít Jakuba, bratra Janova. Skutky vězení nejmenují. Královské paláce stály na západním pahorku nad chrámem a pevnost Antonia na severozápadním rohu Chrámové hory držela posádku; v kterémkoli z nich mohl být Petr držen a železná brána, „kteráž vede do města“, naznačuje místo na okraji zastavěného města. Dům Marie, matky Jana Marka, kde se církev modlila, si nárokuje syrský ortodoxní kostel sv. Marka v Arménské čtvrti, tradice, kterou nelze vysledovat před byzantským obdobím. Agrippa odešel do Cesareje, 87 km daleko, a zemřel tam roku 44."
    - "Lukáš to vypráví podrobně: Herodes, který zabil Jakuba, „umínil jíti i Petra. (A byli dnové přesnic.)“ Chytil ho a „do žaláře vsadil, poručiv jej šestnácti žoldnéřům k ostříhání“. „Té noci spal Petr mezi dvěma žoldnéři, svázán jsa dvěma řetězy, a strážní přede dveřmi ostříhali žaláře. A aj, anděl Páně postavil se, a světlo se zastkvělo v žaláři.“ „A prošedše skrze první i druhou stráž, přišli k bráně železné, kteráž vede do města, a ta se jim hned sama otevřela.“ Petr šel „k domu Marie, matky Janovy, kterýž příjmí měl Marek, kdež se jich bylo mnoho sešlo, a modlili se“, pak „vyšed, bral se na jiné místo“. Herodes „ptaje se na něj, a nenalezna, vytazovav se na strážných, kázal je pryč vésti; a odebrav se z Judstva do Cesaree, přebýval tam“."
    - "Datum je zakotveno pevněji než většina ve Skutcích: Agrippa dostal od Klaudia Judsko roku 41 a zemřel v Cesareji roku 44, skolen při hrách na císařovu počest, jak vypráví Josephus ve shodě se Skutky. Kam Petr šel, není řečeno; hádalo se o Antiochii i o Římu. Řetězy uctívané v Římě v San Pietro in Vincoli byly podle pozdější tradice poslány z Jeruzaléma císařovnou Eudokií v 5. století. Kostel sv. Petra in Gallicantu na východním svahu Hory Sijón nepřipomíná toto vězení, ale dům Kaifášův a Petrovo zapření."
  nl:
    - "In Jeruzalem, met Pesach van het jaar 44 n.Chr. of het jaar daarvoor, onder Herodes Agrippa I, die net Jakobus, de broer van Johannes, had laten onthoofden. Handelingen noemt de gevangenis niet. De koninklijke paleizen stonden op de westelijke heuvel boven de tempel, en de Antonia-vesting aan de noordwesthoek van de Tempelberg herbergde het garnizoen; beide kunnen Petrus hebben vastgehouden, en de ijzeren poort “die naar de stad leidt” wijst op een plaats aan de rand van de bebouwde stad. Het huis van Maria, de moeder van Johannes Marcus, waar de gemeente bad, wordt opgeëist door de Syrisch-orthodoxe Sint-Marcuskerk in de Armeense wijk, een overlevering die niet vroeger dan de Byzantijnse tijd te achterhalen is. Agrippa vertrok naar Caesarea, 87 km verderop, en stierf daar in 44."
    - "Lukas vertelt precies. Nadat Herodes Jakobus had gedood, “voer hij voort, om ook Petrus te vangen (en het waren de dagen der ongehevelde broden)”; hij “gaf hem over aan vier wachten, elk van vier krijgsknechten, om hem te bewaren”. Petrus sliep die nacht “tussen twee krijgsknechten, gebonden met twee ketenen; en de wachters voor de deur bewaarden de gevangenis… een engel des Heeren stond daar, en een licht scheen in de woning”; en toen zij “door de eerste en tweede wacht gegaan waren, kwamen zij aan de ijzeren poort, die naar de stad leidt; dewelke van zelve hun geopend werd.” Petrus ging “naar het huis van Maria, de moeder van Johannes, … alwaar velen samenvergaderd en biddende waren”, en “uitgegaan zijnde, reisde naar een andere plaats”. Toen Herodes de wachters had ondervraagd, “gebood hij, dat zij weggeleid zouden worden. En hij vertrok van Judea naar Cesarea, en hield zich aldaar.”"
    - "De datering ligt steviger vast dan de meeste in Handelingen: Agrippa kreeg Judea in 41 van Claudius en stierf in 44 te Caesarea, geveld tijdens spelen ter ere van de keizer, zoals Josephus in overeenstemming met Handelingen vertelt. Waar Petrus heen ging, wordt niet gezegd; Antiochië en Rome zijn beide geopperd. De ketenen die in Rome in San Pietro in Vincoli worden vereerd, zouden volgens een latere overlevering in de vijfde eeuw door keizerin Eudocia uit Jeruzalem zijn gezonden. De kerk van Sint-Petrus in Gallicantu op de oosthelling van de Sion herdenkt niet deze gevangenis maar het huis van Kajafas en Petrus' verloochening."
  sv:
    - "I Jerusalem, vid påsk år 44 e.Kr. eller året före, under Herodes Agrippa I, som just hade låtit avrätta Jakob, Johannes’ bror, med svärd. Apostlagärningarna nämner inte fängelset. De kungliga palatsen stod på västra kullen ovanför templet, och Antoniafästningen i Tempelbergets nordvästra hörn rymde garnisonen; vilket som helst av dem kan ha hyst Petrus, och järnporten ”som ledde ut till staden” antyder en plats i utkanten av den bebyggda staden. Marias hus (hon var mor till Johannes Markus), där församlingen bad, görs anspråk på av den syrisk-ortodoxa Sankt Markuskyrkan i armeniska kvarteret, en tradition som inte kan spåras tidigare än den bysantinska tiden. Agrippa for till Caesarea, 87 km bort, och dog där år 44."
    - "Herodes, som hade dödat Jakob, fortsatte och ”lät fasttaga också Petrus”, under det osyrade brödets högtid. Fyra vaktavdelningar om fyra man bevakade honom. Natten före rättegången ”låg Petrus och sov mellan två krigsmän, fängslad med två kedjor; och utanför dörren voro väktare utsatta till att bevaka fängelset. Då stod plötsligt en Herrens ängel där, och ett sken lyste i rummet”. ”När de så hade gått genom första och andra vakten, kommo de till järnporten som ledde ut till staden. Den öppnade sig för dem av sig själv.” Petrus gick ”till det hus där Maria bodde, hon som var moder till den Johannes som ock kallades Markus; där voro ganska många församlade och bådo”, och begav sig sedan ”till en annan ort”. Herodes anställde ”rannsakning med väktarna och bjöd att de skulle föras bort till bestraffning”, for ned från Judeen till Caesarea och ”vistades sedan där”."
    - "Dateringen är fastare förankrad än de flesta i Apostlagärningarna: Agrippa fick Judeen av Claudius år 41 och dog i Caesarea år 44, slagen vid lekar till kejsarens ära, som Josefus berättar i överensstämmelse med Apostlagärningarna. Vart Petrus gick sägs inte; både Antiochia och Rom har gissats. Kedjorna som vördas i Rom i San Pietro in Vincoli sägs, enligt en senare tradition, ha sänts från Jerusalem av kejsarinnan Eudokia på 400-talet. Kyrkan Sankt Petrus i Gallicantu på Sions bergs östra sluttning minns inte detta fängelse utan Kajafas’ hus och Petrus’ förnekelse."
  nb:
    - "I Jerusalem, ved påsken i 44 e.Kr. eller året før, under Herodes Agrippa I, som nettopp hadde latt Jakob, Johannes’ bror, halshugge. Apostlenes gjerninger nevner ikke fengselet. Kongepalassene sto på den vestre høyden over tempelet, og Antonia-festningen i det nordvestre hjørnet av Tempelplassen hadde garnisonen; begge kunne ha holdt Peter, og jernporten «som førte ut til byen» tyder på et sted i utkanten av den bebygde byen. Huset til Maria, Johannes Markus’ mor, der menigheten ba, hevdes å ligge der den syrisk-ortodokse Sankt Markus-kirken i Armenerkvarteret står, en tradisjon som ikke kan spores lenger tilbake enn den bysantinske tiden. Agrippa dro til Cæsarea, 87 km unna, og døde der i 44."
    - "Lukas forteller det nøyaktig: Herodes grep, etter å ha drept Jakob, «dessuten også Peter - det var de usyrede brøds dager -». Han «overlot til fire vaktskifter av stridsmenn, hvert på fire mann, å passe på ham». «Da nu Herodes skulde til å føre ham frem, sov Peter den natt mellem to stridsmenn, bundet med to lenker, og vaktmenn utenfor døren passet på fengslet. Og se, en Herrens engel stod der, og et lys skinte i fangerummet». «De gikk da gjennem den første vakt og den annen, og kom til den jernport som førte ut til byen; den åpnet sig for dem av sig selv». Peter gikk «til det hus som eides av Maria, mor til Johannes som kaltes med tilnavn Markus; der var mange samlet og holdt bønn», og «drog til et annet sted». Herodes «tok da vaktmennene i forhør og bød at de skulde føres bort; og han drog ned fra Judea til Cesarea og opholdt sig der»."
    - "Dateringen er sikrere forankret enn de fleste i Apostlenes gjerninger: Agrippa fikk Judea av Klaudius i 41 og døde i Cæsarea i 44, rammet under leker til keiserens ære, slik Josefus forteller i samsvar med Apostlenes gjerninger. Hvor Peter dro, sies ikke; både Antiokia og Roma er blitt gjettet. Lenkene som æres i Roma i San Pietro in Vincoli, sies i en senere tradisjon å ha blitt sendt fra Jerusalem av keiserinne Eudokia på 400-tallet. Sankt Peters kirke i Gallicantu på østskråningen av Sionfjellet markerer ikke dette fengselet, men Kaifas’ hus og Peters fornektelse."
  tl:
    - "Sa Jerusalem, sa Paskua ng 44 AD o ng nakaraang taon, sa ilalim ni Herodes Agripa I, na kapapapatay lamang sa pamamagitan ng pagpugot kay Santiago na kapatid ni Juan. Hindi pinangalanan ng Mga Gawa ang bilangguan. Ang mga palasyong maharlika ay nasa kanlurang burol sa itaas ng Templo, at ang kutang Antonia sa hilagang-kanlurang sulok ng Bundok ng Templo ang may hukbong bantay; alinman ay maaaring pinagkulungan kay Pedro, at ang “pintuang-bakal na patungo sa bayan” ay nagpapahiwatig ng lugar sa gilid ng itinayong bayan. Ang bahay ni Maria, ina ni Juan Marcos, kung saan nananalangin ang iglesia, ay inaangkin ng simbahan ng San Marcos ng Syrian Orthodox sa Distritong Armenio, isang tradisyong hindi masusubaybayan nang mas maaga kaysa sa panahong Bizantino. Umalis si Agripa patungong Cesarea, 87 km ang layo, at namatay doon noong 44."
    - "Ayon kay Lucas, pagkapatay ni Herodes kay Santiago, “ipinagpatuloy na hulihin si Pedro. At noo'y mga araw ng mga tinapay na walang lebadura”; siya'y “ibinigay sa apat na tigaapat na kawal upang siya'y bantayan”. Nang gabing iyon, “natutulog si Pedro sa gitna ng dalawang kawal, na nagagapos ng dalawang tanikala… ang mga bantay sa harap ng pintuan ay nangagbabantay ng bilangguan”. Dumating “isang anghel ng Panginoon… lumiwanag ang isang ilaw sa silid na kulungan”. Sila'y nagsirating sa “pintuang-bakal na patungo sa bayan; na kusang nabuksan sa kanila”. Naparoon si Pedro “sa bahay ni Maria na ina ni Juan na may pamagat na Marcos; na kinaroroonan ng maraming nangagkakatipon at nagsisipanalangin”, saka “umalis, at napasa ibang dako”. Si Herodes: “siniyasat niya ang mga bantay, at ipinagutos na sila'y patayin. At siya buhat sa Judea ay lumusong sa Cesarea, at doon tumira”."
    - "Mas matatag ang petsa kaysa sa karamihan sa Mga Gawa: tinanggap ni Agripa ang Judea kay Claudio noong 41 at namatay sa Cesarea noong 44, tinamaan sa mga laro bilang parangal sa emperador, gaya ng isinasalaysay ni Josephus na umaayon sa Mga Gawa. Hindi sinasabi kung saan nagtungo si Pedro; ang Antioquia at Roma ay kapuwa hinulaan. Ang mga tanikalang pinararangalan sa Roma sa San Pietro in Vincoli ay sinasabing, sa huling tradisyon, ipinadala mula sa Jerusalem ng emperatris na si Eudocia noong ika-5 siglo. Ang simbahan ni San Pedro sa Gallicantu sa silangang dalisdis ng Bundok Sion ay hindi gunita sa bilangguang ito kundi sa bahay ni Caifas at sa pagtanggi ni Pedro."
  da:
    - "I Jerusalem, ved påske i 44 e.Kr. eller året før, under Herodes Agrippa 1., som netop havde ladet Jakob, Johannes’ bror, henrette med sværd. Apostlenes Gerninger nævner ikke fængslet. Kongepaladserne lå på den vestlige høj over templet, og Antonia-fæstningen i det nordvestlige hjørne af Tempelbjerget husede garnisonen; begge kunne have rummet Peter, og jernporten, »som førte ud til Staden«, antyder et sted i udkanten af den bebyggede by. Marias hus, mor til Johannes Markus, hvor menigheden bad, gøres krav på af den syrisk-ortodokse Markuskirke i det armenske kvarter, en tradition der ikke kan føres tilbage til før den byzantinske tid. Agrippa rejste til Cæsarea, 87 km væk, og døde dér i 44."
    - "Lukas fortæller det nøje: Herodes gik, efter at have dræbt Jakob, »videre og lod ogsaa Peter gribe. Det var de usyrede Brøds Dage.« Han »overgav ham til at bevogtes af fire Vagtskifter, hvert paa fire Stridsmænd«. Samme nat sov Peter »imellem to Stridsmænd, bunden med to Lænker, og Vagter foran Døren bevogtede Fængselet«. »Og se, en Herrens Engel stod der, og et Lys straalede i Fangerummet.« »De gik igennem den første og den anden Vagt og kom til den Jernport, som førte ud til Staden; denne aabnede sig for dem af sig selv.« Peter gik »til Marias Hus, hun, som var Moder til Johannes, med Tilnavn Markus, hvor mange vare forsamlede og bade«, og »drog til et andet Sted«. Herodes forhørte »Vagten og befalede, at de skulde henrettes. Og han drog ned fra Judæa til Kæsarea og opholdt sig der.«"
    - "Dateringen er forankret fastere end de fleste i Apostlenes Gerninger: Agrippa fik Judæa af Klaudius i 41 og døde i Cæsarea i 44, ramt ved lege til kejserens ære, som Josefus beretter i overensstemmelse med Apostlenes Gerninger. Hvor Peter tog hen, siges ikke; både Antiokia og Rom er blevet gættet. Lænkerne, der æres i Rom i San Pietro in Vincoli, siges i en senere tradition at være sendt fra Jerusalem af kejserinde Eudokia i 400-tallet. Kirken Sankt Peter i Gallicantu på Zions Bjergs østskråning mindes ikke dette fængsel, men Kajfas’ hus og Peters fornægtelse."
  sr:
    - "У Јерусалиму, о пасхи 44. н. е. или годину раније, под Иродом Агрипом I, који је управо дао да се мачем погуби Јаков, брат Јованов. Дела не именују тамницу. Краљевске палате стајале су на западном брду изнад Храма, а тврђава Антонија на северозападном углу Храмовне горе држала је посаду; обе су могле држати Петра, а гвоздена врата „која вођаху у град“ указују на место на ободу изграђеног града. Кућу Марије, мајке Јована Марка, где се црква молила, присваја сиријска православна црква светог Марка у Јерменској четврти, а то предање не може се пратити даље од византијског доба. Агрипа је отишао у Цезареју, 87 км далеко, и тамо умро 44."
    - "Лука то казује подробно: Ирод је, убивши Јакова, „настави да ухвати и Петра (а беху дани пресних хлебова)“, и „предаде га четворици четвртника војничких да га чувају“. „Ону ноћ спаваше Петар међу двојицом војника, окован у двоје вериге, а стражари пред вратима чуваху тамницу. И гле, анђео Господњи приступи, и светлост обасја по соби.“ „А кад прођоше прву стражу и другу и дођоше к вратима гвозденим која вођаху у град, она им се сама отворише.“ Петар је отишао „кући Марије матере Јована који се зваше Марко, где беху многи сабрани и мољаху се Богу“, а затим „изишавши отиде на друго место“. Ирод „испита стражаре, и заповеди да их одведу; и изишавши из Јудеје у Ћесарију онамо живљаше“."
    - "Датум је чвршће утврђен него већина у Делима: Агрипа је од Клаудија примио Јудеју 41. и умро у Цезареји 44, погођен на играма у част цара, како Јосиф Флавије прича у складу са Делима. Куда је Петар отишао, није речено; погађали су Антиохију и Рим. Ланци који се поштују у Риму у Сан Пјетро ин Винколи, по каснијем предању, послала је из Јерусалима царица Евдокија у петом веку. Црква светог Петра ин Галиканту на источној падини горе Сион не обележава овај затвор, него кућу Кајафину и Петрово порицање."
