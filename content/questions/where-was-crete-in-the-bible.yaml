id: where-was-crete-in-the-bible
question:
  en: "Where is Crete in the Bible?"
  ru: "Где Крит в Библии?"
  uk: "Де Крит у Біблії?"
  es: "¿Dónde está Creta en la Biblia?"
  pt: "Onde fica Creta na Bíblia?"
  de: "Wo liegt Kreta in der Bibel?"
  fr: "Où est la Crète dans la Bible ?"
answer:
  en:
    - "Crete is the long island, some 260 km from east to west, that closes the Aegean Sea on the south, about 1,030 km west of Jerusalem in a straight line from its southern harbour of Fair Havens. The New Testament names it outright: Cretans heard the apostles at Pentecost, Paul's ship to Rome sheltered on its south coast, and Paul left Titus there. The Old Testament probably knows it as Caphtor, the land from which the Philistines came, though that identification is disputed."
    - "Amos has the Lord say that he brought up the Philistines from Caphtor as he brought Israel out of Egypt, and Jeremiah calls them “the remnant of the country of Caphtor”. Caphtor is usually matched with the Keftiu of Egyptian texts and taken for Crete, but some scholars prefer Cyprus or the coast of Cilicia. Zephaniah's woe on “the nation of the Cherethites”, a people of the Philistine coast, uses a name that the Greek Bible renders as Cretans, and David's bodyguard of Cherethites and Pelethites is often explained the same way."
    - "In the autumn of AD 59 Paul's ship “sailed under Crete, over against Salmone”, the eastern cape, and “came unto a place which is called The fair havens; nigh whereunto was the city of Lasea”. The crew wanted to winter at Phenice, “an haven of Crete”, about 73 km further west, but the wind Euroclydon caught them and drove them some 945 km to Malta; Paul said afterwards, “ye should have hearkened unto me, and not have loosed from Crete”. The letter to Titus says, “For this cause left I thee in Crete, that thou shouldest... ordain elders in every city”, and quotes a Cretan poet, whom Clement of Alexandria names as Epimenides: “The Cretians are alway liars, evil beasts, slow bellies.” The island is treated more fully in its article."
  ru:
    - "Крит — длинный остров, около 260 км с востока на запад, замыкающий Эгейское море с юга, примерно в 1030 км к западу от Иерусалима по прямой от его южной гавани Хорошие Пристани. Новый Завет называет его прямо: критяне слышали апостолов в Пятидесятницу, корабль Павла по пути в Рим укрывался у его южного берега, и Павел оставил там Тита. Ветхий Завет, вероятно, знает его как Кафтор — землю, откуда пришли филистимляне, хотя это отождествление спорно."
    - "У Амоса Господь говорит, что вывел филистимлян из Кафтора, как Израиля из Египта, а Иеремия называет их «остаток острова Кафтора». Кафтор обычно сопоставляют с Кефтиу египетских текстов и считают Критом, но некоторые учёные предпочитают Кипр или побережье Киликии. Горе, которое Софония возвещает жителям филистимского побережья, в Синодальном переводе прямо обращено «народу Критскому»: еврейское «керетим» греческая Библия передаёт как «критяне», и так же часто объясняют хелефеев из телохранителей Давида."
    - "Осенью 59 г. н. э. Павел и его спутники, по словам Луки, «подплыли к Криту при Салмоне», восточном мысе, и прибыли «к одному месту, называемому Хорошие Пристани, близ которого был город Ласея». Корабельщики хотели зимовать в Финике, «пристани Критской», примерно в 73 км западнее, но ветер эвроклидон подхватил их и унёс примерно на 945 км, к Мелиту; Павел потом сказал: «надлежало послушаться меня и не отходить от Крита». В послании к Титу сказано: «Для того я оставил тебя в Крите, чтобы ты довершил недоконченное и поставил по всем городам пресвитеров», и приведены слова критского поэта, которого Климент Александрийский называет Эпименидом: «Критяне всегда лжецы, злые звери, утробы ленивые». Подробнее об острове — в статье о нём."
  uk:
    - "Крит — довгий острів, завдовжки близько 260 км зі сходу на захід, що замикає Егейське море з півдня, приблизно за 1030 км на захід від Єрусалиму по прямій від його південної гавані Добрі Пристані. Новий Заповіт називає його прямо: критяни слухали апостолів на П'ятдесятницю, корабель Павла до Рима сховався на його південному узбережжі, і Павло залишив там Тита. Старий Заповіт, імовірно, знає його як Кафтор, землю, звідки прийшли филистимляни, хоча це ототожнення спірне."
    - "Амос передає слова Господа, що Він вивів филистимлян з Кафтора, як вивів Ізраїль з Єгипту, а Єремія називає їх «останок острова Кафтора». Кафтор зазвичай зіставляють з Кефтіу єгипетських текстів і вважають Критом, але деякі вчені віддають перевагу Кіпру чи узбережжю Кілікії. Горе Софонії «народові Крити» — народові филистимського узбережжя — вживає назву, яку грецька Біблія віддає як критян, і Давидову охорону з хелетеїв і фелетеїв часто пояснюють так само."
    - "Восени 59 р. н. е., як розповідає Лука, «приплили ми під Крит проти Салмона», біля східного мису, і «прибули на врочище Гарна пристань, від котрого був близько город Ласей». Екіпаж хотів перезимувати у Фініку, «в пристанї Крицькій», приблизно за 73 км далі на захід, але вітер Євроклидон підхопив їх і погнав приблизно за 945 км до Мальти; Павло потім сказав: «треба було, послухавши мене, не відчалювати від Криту». Послання до Тита каже: «На те зоставив я тебе в Критї, щоб … настановив по всїх городах пресвитерів», і цитує критського поета, якого Климент Александрійський називає Епіменідом: «Критяне завсїди брехуни, люті зьвіри, черева лїниві». Докладніше острів розглянуто у його статті."
  es:
    - "Creta es la larga isla, de unos 260 km de este a oeste, que cierra el mar Egeo por el sur, a unos 1030 km al oeste de Jerusalén en línea recta desde su puerto meridional de Buenos Puertos. El Nuevo Testamento la nombra abiertamente: cretenses oyeron a los apóstoles en Pentecostés, la nave de Pablo hacia Roma se refugió en su costa sur, y Pablo dejó allí a Tito. El Antiguo Testamento probablemente la conoce como Caftor, la tierra de la que vinieron los filisteos, aunque esa identificación es discutida."
    - "Amós hace decir al Señor que sacó a los filisteos de Caftor como sacó a Israel de Egipto, y Jeremías los llama «al resto de la isla de Caphtor». Caftor suele equipararse con los Keftiu de los textos egipcios y tomarse por Creta, pero algunos estudiosos prefieren Chipre o la costa de Cilicia. El ay de Sofonías sobre «la gente de Cheretim», un pueblo de la costa filistea, usa un nombre que la Biblia griega traduce como cretenses, y la guardia personal de David, de cereteos y peleteos, suele explicarse del mismo modo."
    - "En el otoño del 59 d. C., en palabras de Hechos, «navegamos bajo de Creta, junto á Salmón», el cabo oriental, y «llegamos á un lugar que llaman Buenos Puertos, cerca del cual estaba la ciudad de Lasea». La tripulación quería invernar en Fenice, «un puerto de Creta», unos 73 km más al oeste, pero el viento Euroclidón los alcanzó y los arrastró unos 945 km hasta Malta; Pablo dijo después: «Fuera de cierto conveniente, oh varones, haberme oído, y no partir de Creta». La carta a Tito dice: «Por esta causa te dejé en Creta, para que corrigieses lo que falta, y pusieses ancianos por las villas», y cita a un poeta cretense, a quien Clemente de Alejandría nombra como Epiménides: «Los Cretenses, siempre mentirosos, malas bestias, vientres perezosos». La isla se trata con más detalle en su artículo."
  pt:
    - "Creta é a longa ilha, de uns 260 km de leste a oeste, que fecha o mar Egeu ao sul, a cerca de 1.030 km a oeste de Jerusalém em linha reta a partir de seu porto meridional de Bons Portos. O Novo Testamento a nomeia abertamente: cretenses ouviram os apóstolos no Pentecostes, o navio de Paulo a Roma se abrigou em sua costa sul, e Paulo deixou Tito ali. O Antigo Testamento provavelmente a conhece como Caftor, a terra de onde vieram os filisteus, embora a identificação seja disputada."
    - "Amós faz o Senhor dizer que fez subir os filisteus de Caftor como fez Israel sair do Egito, e Jeremias os chama “o remanescente da ilha de Caftor”. Caftor costuma ser ligada ao Keftiu dos textos egípcios e tomada por Creta, mas alguns estudiosos preferem Chipre ou a costa da Cilícia. O ai de Sofonias sobre “a nação dos quereteus”, um povo da costa filisteia, usa um nome que a Bíblia grega verte por cretenses, e a guarda de Davi, de quereteus e peleteus, é muitas vezes explicada do mesmo modo."
    - "No outono de 59 d.C., o navio de Paulo costeou Creta: “navegamos sob o abrigo de Creta, diante de Salmona”, o cabo oriental, e “chegamos a um certo lugar chamado Bons Portos, perto da cidade de Laseia”. A tripulação queria invernar em Fenice, “um porto de Creta”, uns 73 km mais a oeste, mas o vento Euroclidão os apanhou e os levou uns 945 km até Malta; Paulo disse depois: “vocês deveriam ter me ouvido, e não ter partido de Creta”. A carta a Tito diz: “Eu o deixei em Creta por este motivo, para que você… constituísse presbíteros em cada cidade”, e cita um poeta cretense, que Clemente de Alexandria nomeia como Epimênides: “Os cretenses são sempre mentirosos, feras malignas e glutões preguiçosos.” A ilha é tratada mais por inteiro em seu artigo."
  de:
    - "Kreta ist die lange Insel, rund 260 km von Ost nach West, die die Ägäis im Süden abschließt, von ihrem Südhafen Schönhafen in der Luftlinie etwa 1030 km westlich von Jerusalem. Das Neue Testament nennt es ausdrücklich: Kreter hörten die Apostel an Pfingsten, das Schiff des Paulus nach Rom suchte an seiner Südküste Schutz, und Paulus ließ Titus dort. Das Alte Testament kennt es wohl als Kaftor, das Land, aus dem die Philister kamen, doch diese Gleichsetzung ist umstritten."
    - "Amos lässt den Herrn sagen, er habe die Philister aus Kaftor heraufgeführt wie Israel aus Ägypten, und Jeremia nennt sie „die das übrige sind aus der Insel Kaphthor“. Kaftor wird meist mit den Keftiu der ägyptischen Texte gleichgesetzt und für Kreta gehalten, doch manche Gelehrte bevorzugen Zypern oder die Küste Kilikiens. Zefanjas Weh über „dem Volk der Krether“, ein Volk der Philisterküste, gebraucht einen Namen, den die griechische Bibel mit Kreter wiedergibt, und Davids Leibwache aus Kerethern und Pelethern wird oft ebenso erklärt."
    - "Im Herbst 59 n. Chr. „schifften wir unter Kreta hin bei Salmone“, dem Ostkap, und „da kamen wir an eine Stätte, die heißt Gutfurt, dabei war nahe die Stadt Lasäa“. Die Besatzung wollte in Phönix überwintern, „welches ist eine Anfurt an Kreta“, etwa 73 km weiter westlich, doch die Windsbraut Nordost erfasste sie und trieb sie rund 945 km nach Malta; Paulus sagte später: „man sollte mir gehorcht haben und nicht von Kreta aufgebrochen sein“. Der Titusbrief sagt: „Derhalben ließ ich dich in Kreta, daß du solltest vollends ausrichten, was ich gelassen habe, und besetzen die Städte hin und her mit Ältesten“, und zitiert einen kretischen Dichter, den Clemens von Alexandria Epimenides nennt: „Die Kreter sind immer Lügner, böse Tiere und faule Bäuche.“ Die Insel wird in ihrem Artikel ausführlicher behandelt."
  fr:
    - "La Crète est la longue île, d’environ 260 km d’est en ouest, qui ferme la mer Égée au sud, à environ 1 030 km à l’ouest de Jérusalem en ligne droite depuis son port méridional de Beaux-Ports. Le Nouveau Testament la nomme expressément : des Crétois entendirent les apôtres à la Pentecôte, le navire de Paul vers Rome s’abrita sur sa côte sud, et Paul y laissa Tite. L’Ancien Testament la connaît probablement sous le nom de Caphtor, le pays d’où venaient les Philistins, bien que cette identification soit discutée."
    - "Amos fait dire à l’Éternel qu’il a fait monter les Philistins de Caphtor comme il a fait sortir Israël d’Égypte, et Jérémie les appelle « les restes de l’île de Caphtor ». Caphtor est d’ordinaire rapproché des Keftiou des textes égyptiens et pris pour la Crète, mais certains savants préfèrent Chypre ou la côte de Cilicie. Le malheur de Sophonie sur « la nation des Kéréthiens », peuple de la côte philistine, emploie un nom que la Bible grecque rend par Crétois, et la garde du corps de David, les Kéréthiens et les Péléthiens, est souvent expliquée de même."
    - "À l’automne de 59 apr. J.-C., d’après les Actes : « Nous passâmes au-dessous de l’île de Crète, du côté de Salmone », le cap oriental, puis « nous arrivâmes à un lieu nommé Beaux Ports, près duquel était la ville de Lasée ». L’équipage voulait hiverner à « Phénix, port de Crète », à environ 73 km plus à l’ouest, mais le vent Euraquilon les saisit et les chassa sur quelque 945 km jusqu’à Malte ; Paul dit ensuite : « il fallait m’écouter et ne pas partir de Crète ». La lettre à Tite dit : « Je t’ai laissé en Crète, afin que tu … établisses des anciens dans chaque ville », et cite un poète crétois, que Clément d’Alexandrie nomme Épiménide : « Crétois toujours menteurs, méchantes bêtes, ventres paresseux. » L’île est traitée plus complètement dans son article."
