id: where-was-crete-in-the-bible
question:
  en: "Where is Crete in the Bible?"
  ru: "Где Крит в Библии?"
  uk: "Де Крит у Біблії?"
  es: "¿Dónde está Creta en la Biblia?"
  pt: "Onde fica Creta na Bíblia?"
  de: "Wo liegt Kreta in der Bibel?"
  fr: "Où est la Crète dans la Bible ?"
  pl: "Gdzie jest Kreta w Biblii?"
  it: "Dov’è Creta nella Bibbia?"
  nl: "Waar ligt Kreta in de Bijbel?"
  cs: "Kde je Kréta v Bibli?"
  sv: "Var ligger Kreta i Bibeln?"
  nb: "Hvor ligger Kreta i Bibelen?"
  tl: "Nasaan ang Creta sa Biblia?"
answer:
  en:
    - "Crete is the long island, some 260 km from east to west, that closes the Aegean Sea on the south, about 1,030 km west of Jerusalem in a straight line from its southern harbour of Fair Havens. The New Testament names it outright: Cretans heard the apostles at Pentecost, Paul's ship to Rome sheltered on its south coast, and Paul left Titus there. The Old Testament probably knows it as Caphtor, the land from which the Philistines came, though that identification is disputed."
    - "Amos has the Lord say that he brought up the Philistines from Caphtor as he brought Israel out of Egypt, and Jeremiah calls them “the remnant of the country of Caphtor”. Caphtor is usually matched with the Keftiu of Egyptian texts and taken for Crete, but some scholars prefer Cyprus or the coast of Cilicia. Zephaniah's woe on “the nation of the Cherethites”, a people of the Philistine coast, uses a name that the Greek Bible renders as Cretans, and David's bodyguard of Cherethites and Pelethites is often explained the same way."
    - "In the autumn of AD 59 Paul's ship “sailed under Crete, over against Salmone”, the eastern cape, and “came unto a place which is called The fair havens; nigh whereunto was the city of Lasea”. The crew wanted to winter at Phenice, “an haven of Crete”, about 73 km further west, but the wind Euroclydon caught them and drove them some 945 km to Malta; Paul said afterwards, “ye should have hearkened unto me, and not have loosed from Crete”. The letter to Titus says, “For this cause left I thee in Crete, that thou shouldest... ordain elders in every city”, and quotes a Cretan poet, whom Clement of Alexandria names as Epimenides: “The Cretians are alway liars, evil beasts, slow bellies.” The island is treated more fully in its article."
  ru:
    - "Крит — длинный остров, около 260 км с востока на запад, замыкающий Эгейское море с юга, примерно в 1030 км к западу от Иерусалима по прямой от его южной гавани Хорошие Пристани. Новый Завет называет его прямо: критяне слышали апостолов в Пятидесятницу, корабль Павла по пути в Рим укрывался у его южного берега, и Павел оставил там Тита. Ветхий Завет, вероятно, знает его как Кафтор — землю, откуда пришли филистимляне, хотя это отождествление спорно."
    - "У Амоса Господь говорит, что вывел филистимлян из Кафтора, как Израиля из Египта, а Иеремия называет их «остаток острова Кафтора». Кафтор обычно сопоставляют с Кефтиу египетских текстов и считают Критом, но некоторые учёные предпочитают Кипр или побережье Киликии. Горе, которое Софония возвещает жителям филистимского побережья, в Синодальном переводе прямо обращено «народу Критскому»: еврейское «керетим» греческая Библия передаёт как «критяне», и так же часто объясняют хелефеев из телохранителей Давида."
    - "Осенью 59 г. н. э. Павел и его спутники, по словам Луки, «подплыли к Криту при Салмоне», восточном мысе, и прибыли «к одному месту, называемому Хорошие Пристани, близ которого был город Ласея». Корабельщики хотели зимовать в Финике, «пристани Критской», примерно в 73 км западнее, но ветер эвроклидон подхватил их и унёс примерно на 945 км, к Мелиту; Павел потом сказал: «надлежало послушаться меня и не отходить от Крита». В послании к Титу сказано: «Для того я оставил тебя в Крите, чтобы ты довершил недоконченное и поставил по всем городам пресвитеров», и приведены слова критского поэта, которого Климент Александрийский называет Эпименидом: «Критяне всегда лжецы, злые звери, утробы ленивые». Подробнее об острове — в статье о нём."
  uk:
    - "Крит — довгий острів, завдовжки близько 260 км зі сходу на захід, що замикає Егейське море з півдня, приблизно за 1030 км на захід від Єрусалиму по прямій від його південної гавані Добрі Пристані. Новий Заповіт називає його прямо: критяни слухали апостолів на П'ятдесятницю, корабель Павла до Рима сховався на його південному узбережжі, і Павло залишив там Тита. Старий Заповіт, імовірно, знає його як Кафтор, землю, звідки прийшли филистимляни, хоча це ототожнення спірне."
    - "Амос передає слова Господа, що Він вивів филистимлян з Кафтора, як вивів Ізраїль з Єгипту, а Єремія називає їх «останок острова Кафтора». Кафтор зазвичай зіставляють з Кефтіу єгипетських текстів і вважають Критом, але деякі вчені віддають перевагу Кіпру чи узбережжю Кілікії. Горе Софонії «народові Крити» — народові филистимського узбережжя — вживає назву, яку грецька Біблія віддає як критян, і Давидову охорону з хелетеїв і фелетеїв часто пояснюють так само."
    - "Восени 59 р. н. е., як розповідає Лука, «приплили ми під Крит проти Салмона», біля східного мису, і «прибули на врочище Гарна пристань, від котрого був близько город Ласей». Екіпаж хотів перезимувати у Фініку, «в пристанї Крицькій», приблизно за 73 км далі на захід, але вітер Євроклидон підхопив їх і погнав приблизно за 945 км до Мальти; Павло потім сказав: «треба було, послухавши мене, не відчалювати від Криту». Послання до Тита каже: «На те зоставив я тебе в Критї, щоб … настановив по всїх городах пресвитерів», і цитує критського поета, якого Климент Александрійський називає Епіменідом: «Критяне завсїди брехуни, люті зьвіри, черева лїниві». Докладніше острів розглянуто у його статті."
  es:
    - "Creta es la larga isla, de unos 260 km de este a oeste, que cierra el mar Egeo por el sur, a unos 1030 km al oeste de Jerusalén en línea recta desde su puerto meridional de Buenos Puertos. El Nuevo Testamento la nombra abiertamente: cretenses oyeron a los apóstoles en Pentecostés, la nave de Pablo hacia Roma se refugió en su costa sur, y Pablo dejó allí a Tito. El Antiguo Testamento probablemente la conoce como Caftor, la tierra de la que vinieron los filisteos, aunque esa identificación es discutida."
    - "Amós hace decir al Señor que sacó a los filisteos de Caftor como sacó a Israel de Egipto, y Jeremías los llama «al resto de la isla de Caphtor». Caftor suele equipararse con los Keftiu de los textos egipcios y tomarse por Creta, pero algunos estudiosos prefieren Chipre o la costa de Cilicia. El ay de Sofonías sobre «la gente de Cheretim», un pueblo de la costa filistea, usa un nombre que la Biblia griega traduce como cretenses, y la guardia personal de David, de cereteos y peleteos, suele explicarse del mismo modo."
    - "En el otoño del 59 d. C., en palabras de Hechos, «navegamos bajo de Creta, junto á Salmón», el cabo oriental, y «llegamos á un lugar que llaman Buenos Puertos, cerca del cual estaba la ciudad de Lasea». La tripulación quería invernar en Fenice, «un puerto de Creta», unos 73 km más al oeste, pero el viento Euroclidón los alcanzó y los arrastró unos 945 km hasta Malta; Pablo dijo después: «Fuera de cierto conveniente, oh varones, haberme oído, y no partir de Creta». La carta a Tito dice: «Por esta causa te dejé en Creta, para que corrigieses lo que falta, y pusieses ancianos por las villas», y cita a un poeta cretense, a quien Clemente de Alejandría nombra como Epiménides: «Los Cretenses, siempre mentirosos, malas bestias, vientres perezosos». La isla se trata con más detalle en su artículo."
  pt:
    - "Creta é a longa ilha, de uns 260 km de leste a oeste, que fecha o mar Egeu ao sul, a cerca de 1.030 km a oeste de Jerusalém em linha reta a partir de seu porto meridional de Bons Portos. O Novo Testamento a nomeia abertamente: cretenses ouviram os apóstolos no Pentecostes, o navio de Paulo a Roma se abrigou em sua costa sul, e Paulo deixou Tito ali. O Antigo Testamento provavelmente a conhece como Caftor, a terra de onde vieram os filisteus, embora a identificação seja disputada."
    - "Amós faz o Senhor dizer que fez subir os filisteus de Caftor como fez Israel sair do Egito, e Jeremias os chama “o remanescente da ilha de Caftor”. Caftor costuma ser ligada ao Keftiu dos textos egípcios e tomada por Creta, mas alguns estudiosos preferem Chipre ou a costa da Cilícia. O ai de Sofonias sobre “a nação dos quereteus”, um povo da costa filisteia, usa um nome que a Bíblia grega verte por cretenses, e a guarda de Davi, de quereteus e peleteus, é muitas vezes explicada do mesmo modo."
    - "No outono de 59 d.C., o navio de Paulo costeou Creta: “navegamos sob o abrigo de Creta, diante de Salmona”, o cabo oriental, e “chegamos a um certo lugar chamado Bons Portos, perto da cidade de Laseia”. A tripulação queria invernar em Fenice, “um porto de Creta”, uns 73 km mais a oeste, mas o vento Euroclidão os apanhou e os levou uns 945 km até Malta; Paulo disse depois: “vocês deveriam ter me ouvido, e não ter partido de Creta”. A carta a Tito diz: “Eu o deixei em Creta por este motivo, para que você… constituísse presbíteros em cada cidade”, e cita um poeta cretense, que Clemente de Alexandria nomeia como Epimênides: “Os cretenses são sempre mentirosos, feras malignas e glutões preguiçosos.” A ilha é tratada mais por inteiro em seu artigo."
  de:
    - "Kreta ist die lange Insel, rund 260 km von Ost nach West, die die Ägäis im Süden abschließt, von ihrem Südhafen Schönhafen in der Luftlinie etwa 1030 km westlich von Jerusalem. Das Neue Testament nennt es ausdrücklich: Kreter hörten die Apostel an Pfingsten, das Schiff des Paulus nach Rom suchte an seiner Südküste Schutz, und Paulus ließ Titus dort. Das Alte Testament kennt es wohl als Kaftor, das Land, aus dem die Philister kamen, doch diese Gleichsetzung ist umstritten."
    - "Amos lässt den Herrn sagen, er habe die Philister aus Kaftor heraufgeführt wie Israel aus Ägypten, und Jeremia nennt sie „die das übrige sind aus der Insel Kaphthor“. Kaftor wird meist mit den Keftiu der ägyptischen Texte gleichgesetzt und für Kreta gehalten, doch manche Gelehrte bevorzugen Zypern oder die Küste Kilikiens. Zefanjas Weh über „dem Volk der Krether“, ein Volk der Philisterküste, gebraucht einen Namen, den die griechische Bibel mit Kreter wiedergibt, und Davids Leibwache aus Kerethern und Pelethern wird oft ebenso erklärt."
    - "Im Herbst 59 n. Chr. „schifften wir unter Kreta hin bei Salmone“, dem Ostkap, und „da kamen wir an eine Stätte, die heißt Gutfurt, dabei war nahe die Stadt Lasäa“. Die Besatzung wollte in Phönix überwintern, „welches ist eine Anfurt an Kreta“, etwa 73 km weiter westlich, doch die Windsbraut Nordost erfasste sie und trieb sie rund 945 km nach Malta; Paulus sagte später: „man sollte mir gehorcht haben und nicht von Kreta aufgebrochen sein“. Der Titusbrief sagt: „Derhalben ließ ich dich in Kreta, daß du solltest vollends ausrichten, was ich gelassen habe, und besetzen die Städte hin und her mit Ältesten“, und zitiert einen kretischen Dichter, den Clemens von Alexandria Epimenides nennt: „Die Kreter sind immer Lügner, böse Tiere und faule Bäuche.“ Die Insel wird in ihrem Artikel ausführlicher behandelt."
  fr:
    - "La Crète est la longue île, d’environ 260 km d’est en ouest, qui ferme la mer Égée au sud, à environ 1 030 km à l’ouest de Jérusalem en ligne droite depuis son port méridional de Beaux-Ports. Le Nouveau Testament la nomme expressément : des Crétois entendirent les apôtres à la Pentecôte, le navire de Paul vers Rome s’abrita sur sa côte sud, et Paul y laissa Tite. L’Ancien Testament la connaît probablement sous le nom de Caphtor, le pays d’où venaient les Philistins, bien que cette identification soit discutée."
    - "Amos fait dire à l’Éternel qu’il a fait monter les Philistins de Caphtor comme il a fait sortir Israël d’Égypte, et Jérémie les appelle « les restes de l’île de Caphtor ». Caphtor est d’ordinaire rapproché des Keftiou des textes égyptiens et pris pour la Crète, mais certains savants préfèrent Chypre ou la côte de Cilicie. Le malheur de Sophonie sur « la nation des Kéréthiens », peuple de la côte philistine, emploie un nom que la Bible grecque rend par Crétois, et la garde du corps de David, les Kéréthiens et les Péléthiens, est souvent expliquée de même."
    - "À l’automne de 59 apr. J.-C., d’après les Actes : « Nous passâmes au-dessous de l’île de Crète, du côté de Salmone », le cap oriental, puis « nous arrivâmes à un lieu nommé Beaux Ports, près duquel était la ville de Lasée ». L’équipage voulait hiverner à « Phénix, port de Crète », à environ 73 km plus à l’ouest, mais le vent Euraquilon les saisit et les chassa sur quelque 945 km jusqu’à Malte ; Paul dit ensuite : « il fallait m’écouter et ne pas partir de Crète ». La lettre à Tite dit : « Je t’ai laissé en Crète, afin que tu … établisses des anciens dans chaque ville », et cite un poète crétois, que Clément d’Alexandrie nomme Épiménide : « Crétois toujours menteurs, méchantes bêtes, ventres paresseux. » L’île est traitée plus complètement dans son article."
  pl:
    - "Kreta to długa wyspa, mająca około 260 km ze wschodu na zachód, która zamyka Morze Egejskie od południa, około 1030 km na zachód od Jerozolimy w linii prostej od jej południowego portu Piękne Przystanie. Nowy Testament wymienia ją wprost: Kreteńczycy słuchali apostołów w Pięćdziesiątnicę, okręt Pawła do Rzymu schronił się na jej południowym wybrzeżu, a Paweł zostawił tam Tytusa. Stary Testament zna ją prawdopodobnie jako Kaftor, ziemię, z której przybyli Filistyni, choć to utożsamienie jest sporne."
    - "U Amosa Pan mówi, że wyprowadził Filistynów z Kaftor, jak wyprowadził Izraela z Egiptu, a Jeremiasz nazywa ich „ostatek wyspy Kaftor”. Kaftor zwykle utożsamia się z Keftiu z tekstów egipskich i uważa za Kretę, ale niektórzy uczeni wolą Cypr albo wybrzeże Cylicji. Biada Sofoniasza „narodowi Ceretejczyków”, ludowi wybrzeża filistyńskiego, używa nazwy, którą Biblia grecka oddaje jako Kreteńczycy, i gwardię przyboczną Dawida z Cheretyków i Peletyków często wyjaśnia się tak samo."
    - "Jesienią 59 n.e. okręt Pawła, jak mówią Dzieje, „popłynęliśmy pod Kretę podle Salmonu”, wschodniego przylądka, i „przyszliśmy na miejsce niektóre, które zowią piękne porty, od którego blisko było miasto Lasea”. Załoga chciała zimować w Feniksie, „u portu Kreteńskiego”, około 73 km dalej na zachód, ale wiatr Euroklidon pochwycił ich i pognał około 945 km do Malty; Paweł powiedział potem: „Mieliście zaprawdę, o mężowie! usłyszawszy mię, nie puszczać się od Krety”. List do Tytusa mówi: „Dlategom cię zostawił w Krecie, abyś to, co tam jeszcze zostaje, w rząd dobry wprawił i postanowił po miastach starszych”, i cytuje kreteńskiego poetę, którego Klemens Aleksandryjski wskazuje jako Epimenidesa: „Kreteńczycy zawsze są kłamcami, złemi bestyjami, brzuchami leniwemi.” Wyspa jest omówiona szerzej w swoim artykule."
  it:
    - "Creta è la lunga isola, circa 260 km da est a ovest, che chiude a sud il Mar Egeo, a circa 1.030 km a ovest di Gerusalemme in linea retta dal suo porto meridionale di Buoni Porti. Il Nuovo Testamento la nomina apertamente: i Cretesi udirono gli apostoli a Pentecoste, la nave di Paolo verso Roma si riparò sulla sua costa meridionale, e Paolo vi lasciò Tito. L’Antico Testamento la conosce probabilmente come Caftor, la terra da cui vennero i Filistei, benché l’identificazione sia discussa."
    - "Amos fa dire al Signore di aver fatto salire «i Filistei da Caftor» come aveva fatto uscire Israele dall’Egitto, e Geremia li chiama «ciò che resta dell’isola di Caftor». Caftor è di solito identificata con i Keftiu dei testi egizi e ritenuta Creta, ma alcuni studiosi preferiscono Cipro o la costa della Cilicia. Il «guai» di Sofonia contro la «nazione dei Keretei», un popolo della costa filistea, usa un nome che la Bibbia greca rende come Cretesi, e la guardia del corpo di Davide di Cheretei e Peletei si spiega spesso allo stesso modo."
    - "Nell’autunno del 59 d.C., racconta Luca, «veleggiammo sotto Creta, di rincontro a Salmone», il capo orientale, e «venimmo a un certo luogo, detto Beiporti, vicino al quale era la città di Lasea». L’equipaggio voleva svernare a «Fenice, porto di Creta», circa 73 km più a ovest, ma l’Euraquilone li prese e li spinse per circa 945 km fino a Malta; Paolo disse poi: «bisognava darmi ascolto, non partire da Creta». La lettera a Tito dice: «Per questa ragione t’ho lasciato in Creta: perché tu dia ordine alle cose che rimangono a fare, e costituisca degli anziani per ogni città», e cita un poeta cretese, che Clemente Alessandrino nomina come Epimenide: «I Cretesi son sempre bugiardi, male bestie, ventri pigri». L’isola è trattata più ampiamente nel suo articolo."
  nl:
    - "Kreta is het lange eiland, zo’n 260 km van oost naar west, dat de Egeïsche Zee in het zuiden afsluit, hemelsbreed ongeveer 1.030 km ten westen van Jeruzalem, gemeten vanaf zijn zuidelijke haven Schone Havens. Het Nieuwe Testament noemt het met zoveel woorden: Kretensen hoorden de apostelen met Pinksteren, het schip van Paulus naar Rome zocht beschutting aan de zuidkust, en Paulus liet Titus daar achter. Het Oude Testament kent het waarschijnlijk als Kaftor, het land waaruit de Filistijnen kwamen, al is die identificatie omstreden."
    - "Amos laat de HEER zeggen dat Hij de Filistijnen uit Kaftor opvoerde zoals Hij Israël uit Egypte voerde, en Jeremia noemt hen “het overblijfsel des eilands van Kafthor”. Kaftor wordt gewoonlijk gelijkgesteld met de Keftiu van Egyptische teksten en voor Kreta gehouden, maar sommige geleerden verkiezen Cyprus of de kust van Cilicië. Zefanja’s wee over “den volken der Cheretim”, een volk van de Filistijnse kust, gebruikt een naam die de Griekse Bijbel met Kretenzen weergeeft, en Davids lijfwacht van Krethi en Plethi wordt vaak op dezelfde manier verklaard."
    - "In het najaar van 59 n.Chr. voer het schip van Paulus “onder Kreta heen, tegenover Salmone”, de oostelijke kaap, en kwam “in een zekere plaats genaamd Schonehavens, waar de stad Lasea nabij was”. De bemanning wilde overwinteren te Fenix, “een haven in Kreta”, ongeveer 73 km verder naar het westen, maar de Euroklydon greep hen en dreef hen zo’n 945 km naar Malta; Paulus zei achteraf: “men behoorde mij wel gehoor gegeven te hebben, en van Kreta niet afgevaren te zijn”. De brief aan Titus zegt: “Om die oorzaak heb ik u te Kreta gelaten, opdat gij, hetgeen nog ontbrak, voorts zoudt te recht brengen, en dat gij van stad tot stad zoudt ouderlingen stellen”, en haalt een Kretenzische dichter aan, die Clemens van Alexandrië Epimenides noemt: “De Kretensen zijn altijd leugenachtig, kwade beesten, luie buiken.” Het eiland wordt uitvoeriger behandeld in zijn artikel."
  cs:
    - "Kréta je dlouhý ostrov, asi 260 km od východu k západu, který uzavírá Egejské moře na jihu, asi 1 030 km západně od Jeruzaléma vzdušnou čarou od svého jižního přístavu Dobré přístavy. Nový zákon ji jmenuje přímo: Kréťané slyšeli apoštoly o letnicích, Pavlova loď do Říma se na jejím jižním pobřeží ukryla a Pavel tam nechal Tita. Starý zákon ji pravděpodobně zná jako Kaftor, zemi, z níž přišli Pelištejci, ač toto ztotožnění je sporné."
    - "Amos nechává Hospodina říci, že vyvedl Pelištejce z Kaftoru, jako vyvedl Izrael z Egypta, a Jeremjáš je nazývá „ostatek krajiny Kaftor“. Kaftor se obvykle pokládá za egyptské Keftiu a za Krétu, ale někteří badatelé dávají přednost Kypru nebo pobřeží Kilikie. Sofonjášovo běda „národu Ceretejských“, lidu pelištejského pobřeží, užívá jména, které řecká Bible překládá jako Kréťané, a Davidova tělesná stráž Keretejců a Peletejců se často vykládá stejně."
    - "Na podzim roku 59 n. l. vypráví Skutky o Pavlově lodi: „podjeli jsme Krétu podle Salmóny“, východního mysu, a „přijeli jsme na jedno místo, kteréž slove Pěkný břeh, od kteréhožto nedaleko bylo město Lasea“. Posádka chtěla přezimovat ve Foinixu, přístavu na Krétě, asi 73 km dále na západ, ale vítr Euroklydon je zachvátil a hnal je asi 945 km na Maltu; Pavel potom řekl: „Měli jste zajisté, ó muži, uposlechnouce mne, nehýbati se od Kréty“. List Titovi říká: „Z té příčiny zanechal jsem tebe v Krétě, abys to, čehož tam ještě potřebí, spravil a ustanovil po městech starší“, a cituje krétského básníka, v němž Klement Alexandrijský poznává Epimenida: „Kretenští jsou vždycky lháři, zlá hovada, břicha lenivá.“ Ostrov je podrobněji probrán ve svém článku."
  sv:
    - "Kreta är den långa ön, omkring 260 km från öst till väst, som stänger Egeiska havet i söder, omkring 1 030 km väster om Jerusalem fågelvägen från dess södra hamn Goda hamnarna. Nya testamentet nämner den rakt ut: kretenser hörde apostlarna på pingstdagen, Paulus skepp till Rom sökte skydd vid dess sydkust, och Paulus lämnade Titus där. Gamla testamentet känner den sannolikt som Kaftor, landet varifrån filistéerna kom, fastän den identifieringen är omstridd."
    - "Amos låter Herren säga att han förde upp filistéerna från Kaftor liksom han förde Israel ut ur Egypten, och Jeremia kallar dem ”kvarlevan från Kaftors ö”. Kaftor sätts vanligen i samband med Keftiu i egyptiska texter och tas för Kreta, men några forskare föredrar Cypern eller Kilikiens kust. Sefanjas ve över ”keretéernas folk”, ett folk vid filistéernas kust, använder ett namn som den grekiska bibeln återger som kretenser, och Davids livvakt av keretéer och peletéer förklaras ofta på samma sätt."
    - "Hösten 59 e.Kr. ”seglade vi in under Kreta vid Salmone”, östra uddan, och ”hunno fram till en ort som kallades Goda hamnarna, icke långt från staden Lasea”. Besättningen ville övervintra i Fenix, ”en hamn på Kreta”, omkring 73 km längre västerut, men nordostorkanen grep dem och drev dem omkring 945 km till Malta; Paulus sade efteråt: ”I haden bort lyda mig och icke avsegla från Kreta”. Brevet till Titus säger: ”När jag lämnade dig kvar på Kreta, var det för att du skulle ordna vad som ännu återstod att ordna, och för att du ... skulle i var särskild stad tillsätta äldste”, och citerar en kretensisk skald, som Clemens av Alexandria nämner som Epimenides: ”Kreterna, lögnare jämt, äro odjur, glupska och lata.” Ön behandlas fylligare i sin artikel."
  nb:
    - "Kreta er den lange øya, omtrent 260 km fra øst til vest, som lukker Egeerhavet i sør, omtrent 1 030 km vest for Jerusalem i luftlinje fra sørhavnen Godhavn. Det nye testamente nevner den uttrykkelig: kretere hørte apostlene ved pinse, Paulus' skip til Roma søkte ly på sørkysten, og Paulus lot Titus bli igjen der. Det gamle testamente kjenner den trolig som Kaftor, landet filisterne kom fra, selv om denne identifikasjonen er omstridt."
    - "Amos lar Herren si at han førte filisterne opp fra Kaftor slik han førte Israel ut av Egypt, og Jeremia kaller dem «dem som er blitt igjen fra øen Kaftor». Kaftor settes vanligvis sammen med Keftiu i egyptiske tekster og regnes for Kreta, men noen forskere foretrekker Kypros eller kysten av Kilikia. Sefanjas ve over «kreterfolket», et folk på filisterkysten, bruker et navn som den greske bibelen gjengir som kretere, og Davids livvakt av keretere og peletere forklares ofte på samme måte."
    - "Høsten 59 e.Kr. «holdt vi ned under Kreta ved Salmone», det østlige neset, og de «nådde frem til et sted som kalles Godhavn, nær ved en by Lasea». Mannskapet ville overvintre i Føniks, «en havn på Kreta», omtrent 73 km lenger vest, men vinden eurakylon grep dem og drev dem omtrent 945 km til Malta; Paulus sa etterpå: «I burde ha lydt mitt råd og ikke faret ut fra Kreta». Brevet til Titus sier: «Derfor lot jeg dig bli efter på Kreta at du skulde … innsette eldste i hver by», og siterer en kretisk dikter, som Klemens av Aleksandria navngir som Epimenides: «Kreterne er alltid løgnere, onde dyr, late buker.» Øya behandles fyldigere i sin egen artikkel."
  tl:
    - "Ang Creta ay mahabang pulo, mga 260 km mula silangan hanggang kanluran, na nagsasara sa Dagat Aegeo sa timog, mga 1,030 km sa kanluran ng Jerusalem sa tuwid na guhit mula sa katimugang daungan nitong Mabubuting Daongan. Tahasang pinangangalanan ito ng Bagong Tipan: narinig ng mga taga-Creta ang mga apostol noong Pentecostes, ang barko ni Pablo patungong Roma ay sumilong sa timog baybayin nito, at iniwan ni Pablo si Tito roon. Marahil kilala ito ng Matandang Tipan bilang Caftor, ang lupaing pinagmulan ng mga Filisteo, bagaman pinagtatalunan ang pagkakakilanlan."
    - "Sinasabi ni Amos na ang Panginoon ay nagpaahon sa mga Filisteo mula sa Caftor gaya ng pagpapalabas niya sa Israel sa Egipto, at tinatawag sila ni Jeremias na “ang nalabi sa pulo ng Caphtor”. Karaniwang itinutugma ang Caftor sa Keftiu ng mga tekstong Egipcio at kinukuha na Creta, ngunit mas gusto ng ilang iskolar ang Chipre o ang baybayin ng Cilicia. Ang sa aba ng “bansa ng mga Chereteo” ni Zefanias, isang bayan ng baybaying Filisteo, ay gumagamit ng pangalang isinasalin ng Biblia sa Griyego na mga taga-Creta, at ang bantay ni David na mga Ceretheo at Peletheo ay madalas ipaliwanag nang gayon din."
    - "Noong taglagas ng 59 AD, ang barko ni Pablo ay “nagsipanganlong sa Creta, sa tapat ng Salmon”, ang silangang tangos, at “nagsidating kami sa isang dako na tinatawag na Mabubuting Daongan; na malapit doon ang bayan ng Lasea”. Nais ng mga tripulante na magpalipas ng taglamig sa Fenix, “daungan ng Creta”, mga 73 km pa sa kanluran, ngunit nahuli sila ng hanging Euraclidon at itinaboy nang mga 945 km hanggang Malta; sinabi ni Pablo pagkatapos, “nangakinig sana kayo sa akin, at hindi umalis sa Creta”. Sinasabi ng liham kay Tito, “iniwan kita sa Creta, upang … maghalal ng mga matanda sa bawa't bayan”, at sinipi ang isang makatang taga-Creta, na pinangalanan ni Clemente ng Alejandria bilang Epimenides: “Ang mga taga Creta kailan pa man ay mga sinungaling, masasamang hayop, matatakaw na mga tamad.” Mas buong tinatalakay ang pulo sa artikulo nito."
