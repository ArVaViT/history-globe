id: how-far-jerusalem-to-galilee
question:
  en: "How far is it from Jerusalem to Galilee?"
  ru: "Как далеко от Иерусалима до Галилеи?"
  uk: "Як далеко від Єрусалиму до Галілеї?"
  es: "¿Qué distancia hay de Jerusalén a Galilea?"
  pt: "Qual é a distância de Jerusalém à Galileia?"
  de: "Wie weit ist es von Jerusalem nach Galiläa?"
  fr: "Quelle distance y a-t-il de Jérusalem à la Galilée ?"
answer:
  en:
    - "Nazareth, in the hills of Lower Galilee, is about 105 km north of Jerusalem in a straight line and 146 km by the road on the map; Capernaum on the Sea of Galilee is about 125 km away in a straight line, and the lake itself about 120 km. On foot the way took several days: at 30 km a day the road to Nazareth is five days, and Josephus says that the journey from Galilee to Jerusalem through Samaria took three days for those who hurried."
    - 'The Gospels have the family of Jesus walk it every year: "Now his parents went to Jerusalem every year at the feast of the passover", and on the way home from the feast when he was twelve they "went a day''s journey" before they missed him. Two roads were used. The direct road ran along the hills through Samaria: "And he must needs go through Samaria", John says of Jesus'' return to Galilee, and Luke tells of a Samaritan village that would not receive him "because his face was as though he would go to Jerusalem". The other road went down the Jordan valley and climbed from Jericho, which is the way the Gospels describe for his last journey; on the map it measures 22 km from Jericho to Bethany and 4 km more to Jerusalem.'
    - "In the time of Jesus the two lands were ruled separately: Judea had been a Roman province under a prefect since AD 6, while Galilee belonged to Herod Antipas, the tetrarch, which is why Pilate sent Jesus to Herod when he heard that he was a Galilean. Within Galilee the distances are small: Nazareth to Capernaum is about 33 km in a straight line and 50 km by the road on the map, and Capernaum to Bethsaida about 6 km, wherever exactly Bethsaida stood."
  ru:
    - "Назарет в горах Нижней Галилеи лежит примерно в 105 км к северу от Иерусалима по прямой и в 146 км по дороге на карте; до Капернаума на Галилейском море около 125 км по прямой, до самого озера — около 120 км. Пешком путь занимал несколько дней: при 30 км в день дорога до Назарета — пять дней, а Иосиф Флавий пишет, что путь из Галилеи в Иерусалим через Самарию у торопившихся занимал три дня."
    - "В Евангелиях семья Иисуса проходит этот путь каждый год: «Каждый год родители Его ходили в Иерусалим на праздник Пасхи», а на обратном пути с праздника, когда Ему было двенадцать лет, они, «пройдя же дневной путь», хватились Его. Дорог было две. Прямая шла по горам через Самарию: «Надлежало же Ему проходить через Самарию», говорит Иоанн о возвращении Иисуса в Галилею, а Лука рассказывает о самарянском селении, где Его не приняли, «потому что Он имел вид путешествующего в Иерусалим». Другая дорога спускалась в долину Иордана и поднималась от Иерихона; так Евангелия описывают Его последний путь; на карте от Иерихона до Вифании 22 км и ещё 4 км до Иерусалима."
    - "Во времена Иисуса этими землями правили порознь: Иудея с 6 г. н. э. была римской провинцией под началом префекта, а Галилея принадлежала четвертовластнику Ироду Антипе; потому Пилат и послал Иисуса к Ироду, услышав, что Он Галилеянин. Внутри Галилеи расстояния малы: от Назарета до Капернаума около 33 км по прямой и 50 км по дороге на карте, от Капернаума до Вифсаиды — около 6 км, где бы именно ни стояла Вифсаида."
  uk:
    - "Назарет, у пагорбах Нижньої Галілеї, лежить приблизно за 105 км на північ від Єрусалиму по прямій і за 146 км дорогою на мапі; Капернаум на Галілейському морі — приблизно за 125 км по прямій, а саме озеро — приблизно за 120 км. Пішки шлях забирав кілька днів: за 30 км на день дорога до Назарета — п'ять днів, а Йосиф Флавій каже, що подорож із Галілеї до Єрусалиму через Самарію забирала три дні для тих, хто поспішав."
    - "Євангелії показують, що родина Ісуса проходила цей шлях щороку: «ходили батько-мати Його щороку в Єрусалим у сьвято пасхи», а на зворотному шляху зі свята, коли Йому було дванадцять років, вони «увійшли на день ходи», перш ніж помітили Його відсутність. Користувалися двома дорогами. Пряма дорога йшла пагорбами через Самарію: «Треба ж було Йому проходити через Самарию», — каже Іван про повернення Ісуса до Галілеї, а Лука розповідає про самарянське село, яке не прийняло Його, «бо лице Його було грядуще в Єрусалим». Інша дорога спускалася долиною Йордану й підіймалася від Єрихону — саме її Євангелії описують для Його останньої подорожі; на мапі це 22 км від Єрихону до Віфанії та ще 4 км до Єрусалиму."
    - "За часів Ісуса обидві землі керувалися окремо: Юдея була римською провінцією під префектом від 6 р. н. е., тоді як Галілея належала тетрархові Іроду Антипі, тому Пилат і відіслав Ісуса до Ірода, дізнавшись, що Він галілеянин. Усередині Галілеї відстані невеликі: від Назарета до Капернаума близько 33 км по прямій і 50 км дорогою на мапі, а від Капернаума до Віфсаїди близько 6 км, де б точно не стояла Віфсаїда."
  es:
    - "Nazaret, en las colinas de la Baja Galilea, está a unos 105 km al norte de Jerusalén en línea recta y a 146 km por el camino del mapa; Cafarnaúm, en el mar de Galilea, está a unos 125 km en línea recta, y el propio lago a unos 120 km. A pie, el camino llevaba varios días: a 30 km diarios, el camino a Nazaret son cinco días, y Josefo dice que el viaje de Galilea a Jerusalén por Samaria duraba tres días para quienes se apresuraban."
    - "Los Evangelios hacen que la familia de Jesús lo recorra cada año: «iban sus padres todos los años á Jerusalem en la fiesta de la Pascua», y al volver de la fiesta, cuando él tenía doce años, «anduvieron camino de un día» antes de echarlo de menos. Se usaban dos caminos. El camino directo corría por las colinas a través de Samaria: «era menester que pasase por Samaria», dice Juan del regreso de Jesús a Galilea, y Lucas cuenta de una aldea samaritana que no quiso recibirlo «porque era su traza de ir á Jerusalem». El otro camino bajaba por el valle del Jordán y subía desde Jericó, que es el que los Evangelios describen para su último viaje; en el mapa mide 22 km de Jericó a Betania y 4 km más hasta Jerusalén."
    - "En tiempos de Jesús, las dos tierras estaban gobernadas por separado: Judea era provincia romana bajo un prefecto desde el año 6 d. C., mientras que Galilea pertenecía a Herodes Antipas, el tetrarca, razón por la cual Pilato envió a Jesús a Herodes cuando supo que era galileo. Dentro de Galilea las distancias son pequeñas: de Nazaret a Cafarnaúm hay unos 33 km en línea recta y 50 km por el camino del mapa, y de Cafarnaúm a Betsaida unos 6 km, donde quiera que se alzara exactamente Betsaida."
  pt:
    - "Nazaré, nos montes da Baixa Galileia, fica a cerca de 105 km ao norte de Jerusalém em linha reta e a 146 km pela estrada do mapa; Cafarnaum, no mar da Galileia, está a cerca de 125 km em linha reta, e o próprio lago a cerca de 120 km. A pé o caminho levava vários dias: a 30 km por dia a estrada até Nazaré são cinco dias, e Josefo diz que a viagem da Galileia a Jerusalém por Samaria levava três dias para quem se apressava."
    - "Os Evangelhos fazem a família de Jesus percorrê-lo todos os anos: “Seus pais iam todos os anos a Jerusalém, na festa da Páscoa”, e na volta da festa, quando ele tinha doze anos, “caminharam um dia inteiro” antes de sentir a falta dele. Usavam-se duas estradas. A direta corria pelos montes através de Samaria: “Ele precisava passar por Samaria”, diz João sobre a volta de Jesus à Galileia, e Lucas conta de uma aldeia samaritana que não o recebeu “porque ele estava a caminho de Jerusalém”. A outra descia pelo vale do Jordão e subia de Jericó, que é o caminho que os Evangelhos descrevem para a sua última viagem; no mapa mede 22 km de Jericó a Betânia e mais 4 km até Jerusalém."
    - "No tempo de Jesus as duas terras eram governadas separadamente: a Judeia era província romana sob um prefeito desde 6 d.C., enquanto a Galileia pertencia a Herodes Antipas, o tetrarca, razão pela qual Pilatos enviou Jesus a Herodes quando soube que era galileu. Dentro da Galileia as distâncias são pequenas: de Nazaré a Cafarnaum são cerca de 33 km em linha reta e 50 km pela estrada do mapa, e de Cafarnaum a Betsaida cerca de 6 km, onde quer que Betsaida ficasse exatamente."
  de:
    - "Nazareth in den Bergen von Untergaliläa liegt etwa 105 km nördlich von Jerusalem in der Luftlinie und 146 km auf der Straße der Karte; Kapernaum am See Genezareth ist in der Luftlinie etwa 125 km entfernt, der See selbst etwa 120 km. Zu Fuß dauerte der Weg mehrere Tage: Bei 30 km am Tag sind es nach Nazareth fünf Tage, und Josephus sagt, die Reise von Galiläa nach Jerusalem durch Samaria habe für Eilige drei Tage gedauert."
    - "Die Evangelien lassen die Familie Jesu den Weg jedes Jahr gehen: „Seine Eltern gingen alle Jahre gen Jerusalem auf das Osterfest“, und auf dem Heimweg vom Fest, als er zwölf war, „kamen eine Tagereise weit“, ehe sie ihn vermissten. Zwei Straßen waren in Gebrauch. Die direkte führte auf den Bergen durch Samaria: „Er mußte aber durch Samaria reisen“, sagt Johannes von Jesu Rückkehr nach Galiläa, und Lukas erzählt von einem samaritischen Dorf, das ihn nicht annahm, „darum daß er sein Angesicht gewendet hatte, zu wandeln gen Jerusalem“. Die andere ging das Jordantal hinab und stieg von Jericho auf, den Weg, den die Evangelien für seine letzte Reise beschreiben; auf der Karte misst er 22 km von Jericho nach Bethanien und weitere 4 km bis Jerusalem."
    - "Zur Zeit Jesu wurden die beiden Länder getrennt regiert: Judäa war seit 6 n. Chr. eine römische Provinz unter einem Präfekten, während Galiläa dem Vierfürsten Herodes Antipas gehörte, weshalb Pilatus Jesus zu Herodes schickte, als er hörte, dass er ein Galiläer war. Innerhalb Galiläas sind die Entfernungen klein: Von Nazareth nach Kapernaum sind es etwa 33 km in der Luftlinie und 50 km auf der Straße der Karte, von Kapernaum nach Betsaida etwa 6 km, wo immer Betsaida genau lag."
  fr:
    - "Nazareth, dans les collines de la Basse Galilée, est à environ 105 km au nord de Jérusalem en ligne droite et à 146 km par la route de la carte ; Capernaüm, sur la mer de Galilée, est à environ 125 km en ligne droite, et le lac lui-même à environ 120 km. À pied, il fallait plusieurs jours : à 30 km par jour, la route de Nazareth représente cinq jours, et Josèphe dit que le voyage de Galilée à Jérusalem par la Samarie prenait trois jours à ceux qui se hâtaient."
    - "Les Évangiles font faire ce chemin chaque année à la famille de Jésus : « Les parents de Jésus allaient chaque année à Jérusalem, à la fête de Pâque », et, au retour de la fête, quand il avait douze ans, ils « firent une journée de chemin » avant de s’apercevoir de son absence. On empruntait deux routes. La route directe suivait les collines à travers la Samarie : « Comme il fallait qu’il passât par la Samarie », dit Jean du retour de Jésus en Galilée, et Luc raconte qu’un bourg samaritain refusa de le recevoir « parce qu’il se dirigeait sur Jérusalem ». L’autre descendait la vallée du Jourdain et montait depuis Jéricho, chemin que décrivent les Évangiles pour son dernier voyage ; sur la carte, il y a 22 km de Jéricho à Béthanie et 4 km de plus jusqu’à Jérusalem."
    - "Du temps de Jésus, les deux pays étaient gouvernés séparément : la Judée était province romaine sous un préfet depuis 6 apr. J.-C., tandis que la Galilée appartenait au tétrarque Hérode Antipas, ce qui explique que Pilate renvoya Jésus à Hérode en apprenant qu’il était Galiléen. En Galilée même, les distances sont faibles : de Nazareth à Capernaüm, il y a environ 33 km en ligne droite et 50 km par la route de la carte, et de Capernaüm à Bethsaïda environ 6 km, où que se trouvât exactement Bethsaïda."
