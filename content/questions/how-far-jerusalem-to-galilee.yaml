id: how-far-jerusalem-to-galilee
question:
  en: "How far is it from Jerusalem to Galilee?"
  ru: "Как далеко от Иерусалима до Галилеи?"
  uk: "Як далеко від Єрусалиму до Галілеї?"
  es: "¿Qué distancia hay de Jerusalén a Galilea?"
  pt: "Qual é a distância de Jerusalém à Galileia?"
  de: "Wie weit ist es von Jerusalem nach Galiläa?"
  fr: "Quelle distance y a-t-il de Jérusalem à la Galilée ?"
  pl: "Jak daleko jest z Jerozolimy do Galilei?"
  it: "Quanto c’è da Gerusalemme alla Galilea?"
  nl: "Hoe ver is het van Jeruzalem naar Galilea?"
  cs: "Jak daleko je to z Jeruzaléma do Galileje?"
  sv: "Hur långt är det från Jerusalem till Galileen?"
  nb: "Hvor langt er det fra Jerusalem til Galilea?"
  tl: "Gaano kalayo mula sa Jerusalem hanggang sa Galilea?"
  da: "Hvor langt er der fra Jerusalem til Galilæa?"
answer:
  en:
    - "Nazareth, in the hills of Lower Galilee, is about 105 km north of Jerusalem in a straight line and 146 km by the road on the map; Capernaum on the Sea of Galilee is about 125 km away in a straight line, and the lake itself about 120 km. On foot the way took several days: at 30 km a day the road to Nazareth is five days, and Josephus says that the journey from Galilee to Jerusalem through Samaria took three days for those who hurried."
    - 'The Gospels have the family of Jesus walk it every year: "Now his parents went to Jerusalem every year at the feast of the passover", and on the way home from the feast when he was twelve they "went a day''s journey" before they missed him. Two roads were used. The direct road ran along the hills through Samaria: "And he must needs go through Samaria", John says of Jesus'' return to Galilee, and Luke tells of a Samaritan village that would not receive him "because his face was as though he would go to Jerusalem". The other road went down the Jordan valley and climbed from Jericho, which is the way the Gospels describe for his last journey; on the map it measures 22 km from Jericho to Bethany and 4 km more to Jerusalem.'
    - "In the time of Jesus the two lands were ruled separately: Judea had been a Roman province under a prefect since AD 6, while Galilee belonged to Herod Antipas, the tetrarch, which is why Pilate sent Jesus to Herod when he heard that he was a Galilean. Within Galilee the distances are small: Nazareth to Capernaum is about 33 km in a straight line and 50 km by the road on the map, and Capernaum to Bethsaida about 6 km, wherever exactly Bethsaida stood."
  ru:
    - "Назарет в горах Нижней Галилеи лежит примерно в 105 км к северу от Иерусалима по прямой и в 146 км по дороге на карте; до Капернаума на Галилейском море около 125 км по прямой, до самого озера — около 120 км. Пешком путь занимал несколько дней: при 30 км в день дорога до Назарета — пять дней, а Иосиф Флавий пишет, что путь из Галилеи в Иерусалим через Самарию у торопившихся занимал три дня."
    - "В Евангелиях семья Иисуса проходит этот путь каждый год: «Каждый год родители Его ходили в Иерусалим на праздник Пасхи», а на обратном пути с праздника, когда Ему было двенадцать лет, они, «пройдя же дневной путь», хватились Его. Дорог было две. Прямая шла по горам через Самарию: «Надлежало же Ему проходить через Самарию», говорит Иоанн о возвращении Иисуса в Галилею, а Лука рассказывает о самарянском селении, где Его не приняли, «потому что Он имел вид путешествующего в Иерусалим». Другая дорога спускалась в долину Иордана и поднималась от Иерихона; так Евангелия описывают Его последний путь; на карте от Иерихона до Вифании 22 км и ещё 4 км до Иерусалима."
    - "Во времена Иисуса этими землями правили порознь: Иудея с 6 г. н. э. была римской провинцией под началом префекта, а Галилея принадлежала четвертовластнику Ироду Антипе; потому Пилат и послал Иисуса к Ироду, услышав, что Он Галилеянин. Внутри Галилеи расстояния малы: от Назарета до Капернаума около 33 км по прямой и 50 км по дороге на карте, от Капернаума до Вифсаиды — около 6 км, где бы именно ни стояла Вифсаида."
  uk:
    - "Назарет, у пагорбах Нижньої Галілеї, лежить приблизно за 105 км на північ від Єрусалиму по прямій і за 146 км дорогою на мапі; Капернаум на Галілейському морі — приблизно за 125 км по прямій, а саме озеро — приблизно за 120 км. Пішки шлях забирав кілька днів: за 30 км на день дорога до Назарета — п'ять днів, а Йосиф Флавій каже, що подорож із Галілеї до Єрусалиму через Самарію забирала три дні для тих, хто поспішав."
    - "Євангелії показують, що родина Ісуса проходила цей шлях щороку: «ходили батько-мати Його щороку в Єрусалим у сьвято пасхи», а на зворотному шляху зі свята, коли Йому було дванадцять років, вони «увійшли на день ходи», перш ніж помітили Його відсутність. Користувалися двома дорогами. Пряма дорога йшла пагорбами через Самарію: «Треба ж було Йому проходити через Самарию», — каже Іван про повернення Ісуса до Галілеї, а Лука розповідає про самарянське село, яке не прийняло Його, «бо лице Його було грядуще в Єрусалим». Інша дорога спускалася долиною Йордану й підіймалася від Єрихону — саме її Євангелії описують для Його останньої подорожі; на мапі це 22 км від Єрихону до Віфанії та ще 4 км до Єрусалиму."
    - "За часів Ісуса обидві землі керувалися окремо: Юдея була римською провінцією під префектом від 6 р. н. е., тоді як Галілея належала тетрархові Іроду Антипі, тому Пилат і відіслав Ісуса до Ірода, дізнавшись, що Він галілеянин. Усередині Галілеї відстані невеликі: від Назарета до Капернаума близько 33 км по прямій і 50 км дорогою на мапі, а від Капернаума до Віфсаїди близько 6 км, де б точно не стояла Віфсаїда."
  es:
    - "Nazaret, en las colinas de la Baja Galilea, está a unos 105 km al norte de Jerusalén en línea recta y a 146 km por el camino del mapa; Cafarnaúm, en el mar de Galilea, está a unos 125 km en línea recta, y el propio lago a unos 120 km. A pie, el camino llevaba varios días: a 30 km diarios, el camino a Nazaret son cinco días, y Josefo dice que el viaje de Galilea a Jerusalén por Samaria duraba tres días para quienes se apresuraban."
    - "Los Evangelios hacen que la familia de Jesús lo recorra cada año: «iban sus padres todos los años á Jerusalem en la fiesta de la Pascua», y al volver de la fiesta, cuando él tenía doce años, «anduvieron camino de un día» antes de echarlo de menos. Se usaban dos caminos. El camino directo corría por las colinas a través de Samaria: «era menester que pasase por Samaria», dice Juan del regreso de Jesús a Galilea, y Lucas cuenta de una aldea samaritana que no quiso recibirlo «porque era su traza de ir á Jerusalem». El otro camino bajaba por el valle del Jordán y subía desde Jericó, que es el que los Evangelios describen para su último viaje; en el mapa mide 22 km de Jericó a Betania y 4 km más hasta Jerusalén."
    - "En tiempos de Jesús, las dos tierras estaban gobernadas por separado: Judea era provincia romana bajo un prefecto desde el año 6 d. C., mientras que Galilea pertenecía a Herodes Antipas, el tetrarca, razón por la cual Pilato envió a Jesús a Herodes cuando supo que era galileo. Dentro de Galilea las distancias son pequeñas: de Nazaret a Cafarnaúm hay unos 33 km en línea recta y 50 km por el camino del mapa, y de Cafarnaúm a Betsaida unos 6 km, donde quiera que se alzara exactamente Betsaida."
  pt:
    - "Nazaré, nos montes da Baixa Galileia, fica a cerca de 105 km ao norte de Jerusalém em linha reta e a 146 km pela estrada do mapa; Cafarnaum, no mar da Galileia, está a cerca de 125 km em linha reta, e o próprio lago a cerca de 120 km. A pé o caminho levava vários dias: a 30 km por dia a estrada até Nazaré são cinco dias, e Josefo diz que a viagem da Galileia a Jerusalém por Samaria levava três dias para quem se apressava."
    - "Os Evangelhos fazem a família de Jesus percorrê-lo todos os anos: “Seus pais iam todos os anos a Jerusalém, na festa da Páscoa”, e na volta da festa, quando ele tinha doze anos, “caminharam um dia inteiro” antes de sentir a falta dele. Usavam-se duas estradas. A direta corria pelos montes através de Samaria: “Ele precisava passar por Samaria”, diz João sobre a volta de Jesus à Galileia, e Lucas conta de uma aldeia samaritana que não o recebeu “porque ele estava a caminho de Jerusalém”. A outra descia pelo vale do Jordão e subia de Jericó, que é o caminho que os Evangelhos descrevem para a sua última viagem; no mapa mede 22 km de Jericó a Betânia e mais 4 km até Jerusalém."
    - "No tempo de Jesus as duas terras eram governadas separadamente: a Judeia era província romana sob um prefeito desde 6 d.C., enquanto a Galileia pertencia a Herodes Antipas, o tetrarca, razão pela qual Pilatos enviou Jesus a Herodes quando soube que era galileu. Dentro da Galileia as distâncias são pequenas: de Nazaré a Cafarnaum são cerca de 33 km em linha reta e 50 km pela estrada do mapa, e de Cafarnaum a Betsaida cerca de 6 km, onde quer que Betsaida ficasse exatamente."
  de:
    - "Nazareth in den Bergen von Untergaliläa liegt etwa 105 km nördlich von Jerusalem in der Luftlinie und 146 km auf der Straße der Karte; Kapernaum am See Genezareth ist in der Luftlinie etwa 125 km entfernt, der See selbst etwa 120 km. Zu Fuß dauerte der Weg mehrere Tage: Bei 30 km am Tag sind es nach Nazareth fünf Tage, und Josephus sagt, die Reise von Galiläa nach Jerusalem durch Samaria habe für Eilige drei Tage gedauert."
    - "Die Evangelien lassen die Familie Jesu den Weg jedes Jahr gehen: „Seine Eltern gingen alle Jahre gen Jerusalem auf das Osterfest“, und auf dem Heimweg vom Fest, als er zwölf war, „kamen eine Tagereise weit“, ehe sie ihn vermissten. Zwei Straßen waren in Gebrauch. Die direkte führte auf den Bergen durch Samaria: „Er mußte aber durch Samaria reisen“, sagt Johannes von Jesu Rückkehr nach Galiläa, und Lukas erzählt von einem samaritischen Dorf, das ihn nicht annahm, „darum daß er sein Angesicht gewendet hatte, zu wandeln gen Jerusalem“. Die andere ging das Jordantal hinab und stieg von Jericho auf, den Weg, den die Evangelien für seine letzte Reise beschreiben; auf der Karte misst er 22 km von Jericho nach Bethanien und weitere 4 km bis Jerusalem."
    - "Zur Zeit Jesu wurden die beiden Länder getrennt regiert: Judäa war seit 6 n. Chr. eine römische Provinz unter einem Präfekten, während Galiläa dem Vierfürsten Herodes Antipas gehörte, weshalb Pilatus Jesus zu Herodes schickte, als er hörte, dass er ein Galiläer war. Innerhalb Galiläas sind die Entfernungen klein: Von Nazareth nach Kapernaum sind es etwa 33 km in der Luftlinie und 50 km auf der Straße der Karte, von Kapernaum nach Betsaida etwa 6 km, wo immer Betsaida genau lag."
  fr:
    - "Nazareth, dans les collines de la Basse Galilée, est à environ 105 km au nord de Jérusalem en ligne droite et à 146 km par la route de la carte ; Capernaüm, sur la mer de Galilée, est à environ 125 km en ligne droite, et le lac lui-même à environ 120 km. À pied, il fallait plusieurs jours : à 30 km par jour, la route de Nazareth représente cinq jours, et Josèphe dit que le voyage de Galilée à Jérusalem par la Samarie prenait trois jours à ceux qui se hâtaient."
    - "Les Évangiles font faire ce chemin chaque année à la famille de Jésus : « Les parents de Jésus allaient chaque année à Jérusalem, à la fête de Pâque », et, au retour de la fête, quand il avait douze ans, ils « firent une journée de chemin » avant de s’apercevoir de son absence. On empruntait deux routes. La route directe suivait les collines à travers la Samarie : « Comme il fallait qu’il passât par la Samarie », dit Jean du retour de Jésus en Galilée, et Luc raconte qu’un bourg samaritain refusa de le recevoir « parce qu’il se dirigeait sur Jérusalem ». L’autre descendait la vallée du Jourdain et montait depuis Jéricho, chemin que décrivent les Évangiles pour son dernier voyage ; sur la carte, il y a 22 km de Jéricho à Béthanie et 4 km de plus jusqu’à Jérusalem."
    - "Du temps de Jésus, les deux pays étaient gouvernés séparément : la Judée était province romaine sous un préfet depuis 6 apr. J.-C., tandis que la Galilée appartenait au tétrarque Hérode Antipas, ce qui explique que Pilate renvoya Jésus à Hérode en apprenant qu’il était Galiléen. En Galilée même, les distances sont faibles : de Nazareth à Capernaüm, il y a environ 33 km en ligne droite et 50 km par la route de la carte, et de Capernaüm à Bethsaïda environ 6 km, où que se trouvât exactement Bethsaïda."
  pl:
    - "Nazaret, we wzgórzach Dolnej Galilei, leży około 105 km na północ od Jerozolimy w linii prostej i 146 km drogą z mapy; Kafarnaum nad Jeziorem Galilejskim jest oddalone o około 125 km w linii prostej, a samo jezioro o około 120 km. Pieszo droga zajmowała kilka dni: przy 30 km dziennie do Nazaretu to pięć dni, a Józef Flawiusz mówi, że podróż z Galilei do Jerozolimy przez Samarię zajmowała trzy dni tym, którzy się śpieszyli."
    - "Ewangelie każą rodzinie Jezusa przemierzać ją co roku: „A rodzice jego chadzali na każdy rok do Jeruzalemu na święto wielkanocne”, a w drodze powrotnej ze święta, gdy miał dwanaście lat, „uszli dzień drogi”, zanim spostrzegli jego brak. Używano dwóch dróg. Bezpośrednia biegła po wzgórzach przez Samarię: „A musiał iść przez Samaryję”, mówi Jan o powrocie Jezusa do Galilei, a Łukasz opowiada o samarytańskiej wiosce, która go nie przyjęła, „przeto że oblicze jego obrócone było do Jeruzalemu”. Druga schodziła doliną Jordanu i wspinała się od Jerycha, i tak właśnie Ewangelie opisują jego ostatnią podróż; na mapie ma to 22 km z Jerycha do Betanii i jeszcze 4 km do Jerozolimy."
    - "W czasach Jezusa oba kraje podlegały osobnym władcom: Judea od 6 n.e. była prowincją rzymską pod rządami prefekta, a Galilea należała do tetrarchy Heroda Antypasa, dlatego Piłat odesłał Jezusa do Heroda, gdy usłyszał, że jest Galilejczykiem. W samej Galilei odległości są niewielkie: z Nazaretu do Kafarnaum jest około 33 km w linii prostej i 50 km drogą z mapy, a z Kafarnaum do Betsaidy około 6 km, gdziekolwiek dokładnie leżała Betsaida."
  it:
    - "Nazaret, sulle colline della Bassa Galilea, si trova a circa 105 km a nord di Gerusalemme in linea retta e a 146 km lungo la strada della mappa; Cafarnao sul lago di Tiberiade dista circa 125 km in linea retta, e il lago stesso circa 120 km. A piedi il viaggio richiedeva diversi giorni: a 30 km al giorno la strada per Nazaret è di cinque giorni, e Giuseppe Flavio dice che il viaggio dalla Galilea a Gerusalemme attraverso la Samaria durava tre giorni per chi si affrettava."
    - "I Vangeli fanno percorrere questa strada alla famiglia di Gesù ogni anno: «i suoi genitori andavano ogni anno a Gerusalemme per la festa di Pasqua», e sulla via del ritorno dalla festa, quando egli aveva dodici anni, «camminarono una giornata» prima di accorgersi della sua assenza. Si usavano due strade. La via diretta correva lungo le colline attraverso la Samaria: «doveva passare per la Samaria», dice Giovanni del ritorno di Gesù in Galilea, e Luca racconta di un villaggio samaritano che non lo ricevette «perché era diretto verso Gerusalemme». L’altra strada scendeva lungo la valle del Giordano e saliva da Gerico, ed è la via che i Vangeli descrivono per il suo ultimo viaggio; sulla mappa misura 22 km da Gerico a Betania e altri 4 km fino a Gerusalemme."
    - "Al tempo di Gesù le due terre erano governate separatamente: la Giudea era una provincia romana sotto un prefetto dal 6 d.C., mentre la Galilea apparteneva a Erode Antipa, il tetrarca, ed è per questo che Pilato mandò Gesù da Erode quando seppe che era Galileo. All’interno della Galilea le distanze sono piccole: da Nazaret a Cafarnao ci sono circa 33 km in linea retta e 50 km lungo la strada della mappa, e da Cafarnao a Betsaida circa 6 km, ovunque sorgesse esattamente Betsaida."
  nl:
    - "Nazareth, in het heuvelland van Neder-Galilea, ligt hemelsbreed ongeveer 105 km ten noorden van Jeruzalem en 146 km langs de weg op de kaart; Kafarnaüm aan het Meer van Galilea ligt hemelsbreed ongeveer 125 km weg, en het meer zelf ongeveer 120 km. Te voet duurde de tocht enkele dagen: bij 30 km per dag is de weg naar Nazareth vijf dagen, en Josephus zegt dat de reis van Galilea naar Jeruzalem door Samaria voor wie zich haastten drie dagen duurde."
    - "De Evangeliën laten het gezin van Jezus die tocht elk jaar lopen: “Zijn ouders reisden alle jaar naar Jeruzalem, op het feest van pascha”, en op de terugweg van het feest toen Hij twaalf was “gingen zij een dagreize” voordat zij Hem misten. Er werden twee wegen gebruikt. De directe weg liep over de bergkam door Samaria: “En Hij moest door Samaria gaan”, zegt Johannes over Jezus’ terugkeer naar Galilea, en Lukas vertelt van een Samaritaans dorp dat Hem niet wilde ontvangen “omdat Zijn aangezicht was als reizende naar Jeruzalem”. De andere weg ging door de Jordaanvallei en klom vanuit Jericho omhoog, de weg die de Evangeliën beschrijven voor zijn laatste reis; op de kaart meet hij 22 km van Jericho naar Bethanië en nog 4 km naar Jeruzalem."
    - "In de tijd van Jezus werden de twee landen afzonderlijk bestuurd: Judea was sinds 6 n.Chr. een Romeinse provincie onder een prefect, terwijl Galilea toebehoorde aan Herodes Antipas, de viervorst, en daarom zond Pilatus Jezus naar Herodes toen hij hoorde dat Hij een Galileeër was. Binnen Galilea zijn de afstanden klein: van Nazareth naar Kafarnaüm is het hemelsbreed ongeveer 33 km en 50 km langs de weg op de kaart, en van Kafarnaüm naar Bethsaïda ongeveer 6 km, waar Bethsaïda precies ook lag."
  cs:
    - "Nazaret, v kopcích Dolní Galileje, leží asi 105 km severně od Jeruzaléma vzdušnou čarou a 146 km po silnici na mapě; Kafarnaum u Galilejského jezera je vzdušnou čarou vzdáleno asi 125 km a samo jezero asi 120 km. Pěšky trvala cesta několik dní: při 30 km denně je to do Nazareta pět dní a Josephus Flavius říká, že cesta z Galileje do Jeruzaléma přes Samaří trvala tři dny těm, kdo spěchali."
    - "Evangelia nechávají Ježíšovu rodinu jít touto cestou každý rok: „chodívali rodičové jeho každého roku do Jeruzaléma na den slavný velikonoční“ a na zpáteční cestě ze svátku, když mu bylo dvanáct, „ušli den cesty“, než ho postrádali. Užívaly se dvě cesty. Přímá vedla po horách přes Samaří: „Musil pak jíti skrze Samaří“, říká Jan o Ježíšově návratu do Galileje, a Lukáš vypráví o samařské vsi, která jej nepřijala, „protože obličej jeho byl obrácen k jití do Jeruzaléma“. Druhá cesta sestupovala údolím Jordánu a stoupala od Jericha, což je cesta, kterou evangelia líčí pro jeho poslední cestu; na mapě měří 22 km z Jericha do Betanie a dalších 4 km do Jeruzaléma."
    - "Za Ježíšovy doby byly obě země spravovány odděleně: Judsko bylo od roku 6 n. l. římskou provincií pod prefektem, zatímco Galilea patřila tetrarchovi Herodu Antipovi, a proto Pilát poslal Ježíše k Herodovi, když se doslechl, že je Galilejec. Uvnitř Galileje jsou vzdálenosti malé: z Nazareta do Kafarnaa je to asi 33 km vzdušnou čarou a 50 km po silnici na mapě a z Kafarnaa do Betsaidy asi 6 km, ať už Betsaida stála přesně kdekoli."
  sv:
    - "Nasaret, i bergen i Nedre Galileen, ligger omkring 105 km norr om Jerusalem fågelvägen och 146 km via vägen på kartan; Kafarnaum vid Galileiska sjön ligger omkring 125 km bort fågelvägen, och själva sjön omkring 120 km. Till fots tog vägen flera dagar: med 30 km om dagen är vägen till Nasaret fem dagar, och Josefus säger att resan från Galileen till Jerusalem genom Samaria tog tre dagar för dem som skyndade."
    - "Evangelierna låter Jesu familj gå den varje år: ”Nu plägade hans föräldrar årligen vid påskhögtiden begiva sig till Jerusalem”, och på hemvägen från högtiden, när han var tolv år, ”vandrade [de] så en dagsled” innan de saknade honom. Två vägar användes. Den direkta vägen gick längs bergen genom Samaria: ”Därvid måste han taga vägen genom Samarien”, säger Johannes om Jesu återvändande till Galileen, och Lukas berättar om en samaritisk by som inte ville ta emot honom, ”eftersom han var stadd på färd till Jerusalem”. Den andra vägen gick ned i Jordandalen och steg från Jeriko, vilket är den väg som evangelierna beskriver för hans sista resa; på kartan mäter den 22 km från Jeriko till Betania och ytterligare 4 km till Jerusalem."
    - "På Jesu tid styrdes de båda länderna var för sig: Judeen hade varit en romersk provins under en prefekt sedan år 6 e.Kr., medan Galileen tillhörde Herodes Antipas, tetrarken, och därför sände Pilatus Jesus till Herodes när han hörde att han var galileer. Inom Galileen är avstånden små: Nasaret till Kafarnaum är omkring 33 km fågelvägen och 50 km via vägen på kartan, och Kafarnaum till Betsaida omkring 6 km, var exakt Betsaida än låg."
  nb:
    - "Nasaret, i åsene i Nedre Galilea, ligger omtrent 105 km nord for Jerusalem i luftlinje og 146 km langs veien på kartet; Kapernaum ved Galileasjøen ligger omtrent 125 km unna i luftlinje, og selve innsjøen omtrent 120 km. Til fots tok veien flere dager: med 30 km om dagen er veien til Nasaret fem dager, og Josefus sier at reisen fra Galilea til Jerusalem gjennom Samaria tok tre dager for dem som hastet."
    - "Evangeliene lar Jesu familie gå den hvert år: «Og hans foreldre drog hvert år til Jerusalem til påskefesten», og på hjemveien fra høytiden da han var tolv, var de kommet «en dags reise frem» før de savnet ham. To veier ble brukt. Den direkte veien gikk langs åsene gjennom Samaria: «Han måtte da reise gjennem Samaria», sier Johannes om Jesu tilbakereise til Galilea, og Lukas forteller om en samaritansk landsby som ikke ville ta imot ham, «fordi hans åsyn var vendt mot Jerusalem». Den andre veien gikk ned Jordandalen og steg opp fra Jeriko, som er veien evangeliene beskriver for hans siste reise; på kartet måler den 22 km fra Jeriko til Betania og 4 km til Jerusalem."
    - "På Jesu tid ble de to landene styrt hver for seg: Judea hadde vært en romersk provins under en prefekt siden 6 e.Kr., mens Galilea tilhørte Herodes Antipas, tetrarken, og derfor sendte Pilatus Jesus til Herodes da han hørte at han var galileer. Innen Galilea er avstandene små: Nasaret til Kapernaum er omtrent 33 km i luftlinje og 50 km langs veien på kartet, og Kapernaum til Betsaida omtrent 6 km, uansett hvor nøyaktig Betsaida lå."
  tl:
    - "Ang Nazaret, sa mga burol ng Mababang Galilea, ay nasa mga 105 km sa hilaga ng Jerusalem sa tuwid na guhit at 146 km sa daan sa mapa; ang Capernaum sa Dagat ng Galilea ay mga 125 km ang layo sa tuwid na guhit, at ang lawa mismo mga 120 km. Sa paa, tumagal ng ilang araw ang daan: sa 30 km kada araw ay limang araw ang daan patungong Nazaret, at sinabi ni Josephus na ang paglalakbay mula sa Galilea hanggang sa Jerusalem sa pamamagitan ng Samaria ay tatlong araw para sa mga nagmamadali."
    - "Ipinalalakad ng mga Ebanghelyo sa pamilya ni Jesus ang daang ito taun-taon: “Nagsisiparoon taon-taon ang kaniyang mga magulang sa Jerusalem sa kapistahan ng paskua”, at sa pag-uwi mula sa kapistahan nang siya'y labindalawa, “nagsiyaon sila nang isang araw na paglalakbay” bago nila siya hinanap. Dalawang daan ang ginamit. Ang tuwirang daan ay dumaan sa mga burol sa Samaria: “Kinakailangang magdaan siya sa Samaria”, sabi ni Juan tungkol sa pagbabalik ni Jesus sa Galilea, at isinasalaysay ni Lucas ang isang nayon ng mga Samaritano na hindi tumanggap sa kaniya “sapagka't ang mukha niya'y anyong patungo sa Jerusalem”. Ang isa pang daan ay bumaba sa libis ng Jordan at umakyat mula sa Jerico, ang daang inilalarawan ng mga Ebanghelyo para sa kaniyang huling paglalakbay; sa mapa ay 22 km ito mula Jerico hanggang Betania at 4 km pa hanggang Jerusalem."
    - "Noong panahon ni Jesus, magkahiwalay ang pamamahala sa dalawang lupain: ang Judea ay lalawigang Romano sa ilalim ng isang prepekto mula pa noong 6 AD, samantalang ang Galilea ay kay Herodes Antipas, ang tetrarka, kaya ipinadala ni Pilato si Jesus kay Herodes nang mabalitaan niyang Galileo siya. Sa loob ng Galilea ay maliit ang mga layo: ang Nazaret hanggang Capernaum ay mga 33 km sa tuwid na guhit at 50 km sa daan sa mapa, at ang Capernaum hanggang Bethsaida ay mga 6 km, saanman eksaktong nakatayo ang Bethsaida."
  da:
    - "Nazaret i Nedre Galilæas bjerge ligger omkring 105 km nord for Jerusalem i luftlinje og 146 km ad vejen på kortet; Kapernaum ved Genesaret Sø ligger omkring 125 km væk i luftlinje, og selve søen omkring 120 km. Til fods tog vejen flere dage: med 30 km om dagen er vejen til Nazaret fem dage, og Josefus siger, at rejsen fra Galilæa til Jerusalem gennem Samaria tog tre dage for dem, der skyndte sig."
    - "Evangelierne lader Jesu familie gå den hvert år: »hans Forældre droge hvert Aar op til Jerusalem paa Paaskehøjtiden«, og på hjemvejen fra højtiden, da han var tolv, »kom de en Dags Rejse frem«, før de savnede ham. To veje blev brugt. Den direkte vej løb langs bjergene gennem Samaria: »Men han maatte rejse igennem Samaria«, siger Johannes om Jesu hjemrejse til Galilæa, og Lukas fortæller om en samaritansk landsby, der ikke ville modtage ham, »fordi han var paa Vejen til Jerusalem«. Den anden vej gik ned gennem Jordandalen og steg op fra Jeriko, hvilket er den vej, evangelierne beskriver for hans sidste rejse; på kortet måler den 22 km fra Jeriko til Betania og 4 km mere til Jerusalem."
    - "På Jesu tid blev de to lande styret hver for sig: Judæa havde siden 6 e.Kr. været romersk provins under en præfekt, mens Galilæa tilhørte Herodes Antipas, tetrarken, hvorfor Pilatus sendte Jesus til Herodes, da han hørte, at han var galilæer. Inden for Galilæa er afstandene små: Nazaret til Kapernaum er omkring 33 km i luftlinje og 50 km ad vejen på kortet, og Kapernaum til Betsajda omkring 6 km, uanset hvor præcis Betsajda lå."
