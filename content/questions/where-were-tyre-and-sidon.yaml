id: where-were-tyre-and-sidon
question:
  en: "Where were Tyre and Sidon?"
  ru: "Где находились Тир и Сидон?"
  uk: "Де були Тір і Сідон?"
  es: "¿Dónde estaban Tiro y Sidón?"
  pt: "Onde ficavam Tiro e Sidom?"
  de: "Wo lagen Tyrus und Sidon?"
  fr: "Où se trouvaient Tyr et Sidon ?"
answer:
  en:
    - "Tyre and Sidon were the two chief cities of Phoenicia, on the coast of today's Lebanon. Sidon, now Saida, lies about 40 km south of Beirut; Tyre, now Sour, about 35 km further south in a straight line. Tyre is about 55 km north-west of Capernaum and 165 km north of Jerusalem; Sidon is about 200 km from Jerusalem. Tyre was built on an island just off the shore, Sidon on a headland sheltered by islets that made two harbours."
    - 'In the Gospels the two names go together: Jesus "departed into the coasts of Tyre and Sidon", where a Syrophoenician woman begged him to heal her daughter, and people from around the two cities came to hear him. He held them up against the towns of Galilee: "if the mighty works, which were done in you, had been done in Tyre and Sidon, they would have repented long ago in sackcloth and ashes." Earlier, Hiram king of Tyre sent cedar and craftsmen for Solomon''s Temple, since "there is not among us any that can skill to hew timber like unto the Sidonians", and Elijah lodged with a widow at Zarephath, a town of Sidon. Paul spent seven days with the disciples at Tyre on his last journey to Jerusalem and was allowed to visit friends at Sidon on his way to Rome.'
    - "Herodotus was told that Tyre was founded about 2750 BC, and both cities appear in the Amarna letters of the fourteenth century BC. Tyrians founded Carthage, by tradition in 814 BC. Tyre paid tribute to Assyria but kept its island; Nebuchadnezzar besieged it for thirteen years, usually dated to the 580s and 570s BC, and in 332 BC Alexander took it after seven months by building a causeway from the mainland, so that Tyre has been joined to the shore ever since. Sidon was destroyed by Esarhaddon in 677 BC, became the leading Phoenician city under the Persians, and opened its gates to Alexander in 333 BC. Under Rome both minted their own coins and were known for glass and purple dye."
  ru:
    - "Тир и Сидон были двумя главными городами Финикии на побережье нынешнего Ливана. Сидон, ныне Сайда, лежит примерно в 40 км к югу от Бейрута; Тир, ныне Сур, — ещё в 35 км южнее по прямой. От Капернаума до Тира около 55 км на северо-запад, от Иерусалима — 165 км на север; от Иерусалима до Сидона — около 200 км. Тир был построен на острове у самого берега, Сидон — на мысу, прикрытом островками, которые образовали две гавани."
    - "В Евангелиях эти имена стоят рядом: Иисус «удалился в страны Тирские и Сидонские», где сирофиникиянка просила Его исцелить дочь, и люди из окрестностей обоих городов приходили слушать Его. Он ставил их в укор городам Галилеи: «если бы в Тире и Сидоне явлены были силы, явленные в вас, то давно бы они во вретище и пепле покаялись». Прежде Хирам, царь Тирский, присылал кедры и мастеров для храма Соломона, ибо «у нас нет людей, которые умели бы рубить дерева так, как Сидоняне», а Илия жил у вдовы в Сарепте Сидонской. Павел провёл семь дней с учениками в Тире в последнем пути в Иерусалим, и ему позволили навестить друзей в Сидоне по дороге в Рим."
    - "Геродоту говорили, что Тир основан около 2750 г. до н. э., и оба города упомянуты в Амарнских письмах XIV века до н. э. Тиряне основали Карфаген — по преданию, в 814 г. до н. э. Тир платил дань Ассирии, но сохранял свой остров; Навуходоносор осаждал его тринадцать лет, обычно это 580-е и 570-е годы до н. э., а в 332 г. до н. э. Александр взял его за семь месяцев, насыпав дамбу от материка, и с тех пор Тир соединён с берегом. Сидон разрушил Асардан в 677 г. до н. э.; при персах он стал первым городом Финикии, а в 333 г. до н. э. открыл ворота Александру. Под властью Рима оба города чеканили свою монету и славились стеклом и пурпуром."
  uk:
    - "Тір і Сідон були двома головними містами Фінікії, на узбережжі нинішнього Лівану. Сідон, нині Сайда, лежить приблизно за 40 км на південь від Бейрута; Тір, нині Сур, — приблизно за 35 км далі на південь по прямій. Тір лежить приблизно за 55 км на північний захід від Капернаума і за 165 км на північ від Єрусалима; Сідон — приблизно за 200 км від Єрусалима. Тір було збудовано на острові неподалік берега, Сідон — на мисі, захищеному острівцями, що утворювали дві гавані."
    - "В Євангеліях ці дві назви ідуть разом: Ісус «перейшов у Тирські та в Сидонські сторони», де сирофінікійка благала Його зцілити її дочку, а люди з околиць обох міст приходили слухати Його. Він порівняв їх із містами Галілеї: «бо коли б чудеса, що стали ся в вас, стались у Тирі та Сидонї, давно були б вони покаялись у веретищі та попелї». Раніше Хірам, цар Тіру, надіслав кедр і майстрів для Соломонового Храму, бо «сам бо знаєш, що у нас нема людей, що вміли б так дерево рубати, як Сидонїї», а Ілля оселився у вдови в Сарепті, місті Сідона. Павло провів сім днів з учнями в Тірі під час своєї останньої подорожі до Єрусалима і йому дозволили відвідати друзів у Сідоні по дорозі до Рима."
    - "Геродоту розповіли, що Тір заснований близько 2750 р. до н. е., і обидва міста з'являються в листах з Амарни XIV ст. до н. е. Тірійці заснували Карфаген, за переказом, 814 р. до н. е. Тір платив данину Ассирії, але зберіг свій острів; Навуходоносор облягав його тринадцять років, що їх зазвичай датують 580-ми і 570-ми рр. до н. е., а 332 р. до н. е. Александр узяв його за сім місяців, збудувавши насип від материка, так що Тір відтоді з'єднаний із берегом. Сідон був зруйнований Асархаддоном 677 р. до н. е., став провідним фінікійським містом за персів і відчинив ворота Александрові 333 р. до н. е. За Риму обидва карбували власні монети й славилися склом і пурпуровою фарбою."
  es:
    - "Tiro y Sidón eran las dos ciudades principales de Fenicia, en la costa del actual Líbano. Sidón, hoy Saida, queda a unos 40 km al sur de Beirut; Tiro, hoy Sur, a unos 35 km más al sur en línea recta. Tiro está a unos 55 km al noroeste de Cafarnaúm y a 165 km al norte de Jerusalén; Sidón, a unos 200 km de Jerusalén. Tiro se construyó en una isla justo frente a la costa, y Sidón en un promontorio resguardado por islotes que formaban dos puertos."
    - "En los Evangelios los dos nombres van juntos: Jesús «se fué á las partes de Tiro y de Sidón», donde una mujer sirofenicia le rogó que sanara a su hija, y gente de los alrededores de las dos ciudades acudió a oírle. Él las puso frente a las ciudades de Galilea: «si en Tiro y en Sidón fueran hechas las maravillas que han sido hechas en vosotras, en otro tiempo se hubieran arrepentido en saco y en ceniza». Antes, Hiram, rey de Tiro, envió cedro y artesanos para el Templo de Salomón, pues «ninguno hay entre nosotros que sepa labrar la madera como los Sidonios», y Elías se alojó con una viuda en Sarepta, una ciudad de Sidón. Pablo pasó siete días con los discípulos en Tiro en su último viaje a Jerusalén y se le permitió visitar a los amigos en Sidón de camino a Roma."
    - "A Heródoto le dijeron que Tiro se fundó hacia el 2750 a. C., y ambas ciudades aparecen en las cartas de Amarna del siglo XIV a. C. Los tirios fundaron Cartago, según la tradición en 814 a. C. Tiro pagaba tributo a Asiria pero conservó su isla; Nabucodonosor la asedió durante trece años, que suelen fecharse en las décadas del 580 y del 570 a. C., y en 332 a. C. Alejandro la tomó tras siete meses construyendo una calzada desde tierra firme, por lo que Tiro está unida a la costa desde entonces. Sidón fue destruida por Esar-hadón en 677 a. C., llegó a ser la principal ciudad fenicia bajo los persas y abrió sus puertas a Alejandro en 333 a. C. Bajo Roma, ambas acuñaron moneda propia y eran conocidas por el vidrio y el tinte de púrpura."
  pt:
    - "Tiro e Sidom eram as duas principais cidades da Fenícia, na costa do atual Líbano. Sidom, hoje Saida, fica a cerca de 40 km ao sul de Beirute; Tiro, hoje Sour, a cerca de 35 km mais ao sul em linha reta. Tiro fica a cerca de 55 km a noroeste de Cafarnaum e 165 km ao norte de Jerusalém; Sidom fica a cerca de 200 km de Jerusalém. Tiro foi construída numa ilha logo junto à costa, Sidom num promontório abrigado por ilhotas que formavam dois portos."
    - "Nos Evangelhos os dois nomes andam juntos: Jesus “retirou-se para a região de Tiro e Sidom”, onde uma mulher siro-fenícia lhe pediu que curasse sua filha, e gente dos arredores das duas cidades vinha ouvi-lo. Ele as contrapôs às cidades da Galileia: “se as obras poderosas que foram feitas em vocês tivessem sido feitas em Tiro e Sidom, há muito tempo elas teriam se arrependido em pano de saco e cinzas.” Antes, Hirão, rei de Tiro, enviou cedro e artesãos para o Templo de Salomão, pois “não há ninguém entre nós que saiba cortar madeira como os sidônios”, e Elias se hospedou com uma viúva em Sarepta, cidade de Sidom. Paulo passou sete dias com os discípulos em Tiro na sua última viagem a Jerusalém e teve permissão de visitar amigos em Sidom a caminho de Roma."
    - "Heródoto ouviu que Tiro foi fundada por volta de 2750 a.C., e as duas cidades aparecem nas cartas de Amarna do século XIV a.C. Os tírios fundaram Cartago, por tradição em 814 a.C. Tiro pagou tributo à Assíria mas conservou a sua ilha; Nabucodonosor a sitiou por treze anos, geralmente datados das décadas de 580 e 570 a.C., e em 332 a.C. Alexandre a tomou depois de sete meses, construindo um aterro desde a terra firme, de modo que Tiro está ligada à costa desde então. Sidom foi destruída por Esar-Hadom em 677 a.C., tornou-se a principal cidade fenícia sob os persas e abriu as portas a Alexandre em 333 a.C. Sob Roma, ambas cunhavam moedas próprias e eram conhecidas pelo vidro e pelo corante púrpura."
  de:
    - "Tyrus und Sidon waren die beiden Hauptstädte Phöniziens an der Küste des heutigen Libanon. Sidon, heute Saida, liegt etwa 40 km südlich von Beirut; Tyrus, heute Sour, in der Luftlinie etwa 35 km weiter südlich. Tyrus liegt etwa 55 km nordwestlich von Kapernaum und 165 km nördlich von Jerusalem; Sidon ist etwa 200 km von Jerusalem entfernt. Tyrus war auf einer Insel dicht vor der Küste gebaut, Sidon auf einer Landzunge, die durch Inselchen geschützt war und zwei Häfen bildete."
    - "In den Evangelien gehören die beiden Namen zusammen: Jesus „entwich in die Gegend von Tyrus und Sidon“, wo eine syrophönizische Frau ihn bat, ihre Tochter zu heilen, und Menschen aus der Umgebung der beiden Städte kamen, um ihn zu hören. Er hielt sie den Städten Galiläas entgegen: „Wären solche Taten zu Tyrus und Sidon geschehen, wie bei euch geschehen sind, sie hätten vorzeiten im Sack und in der Asche Buße getan.“ Früher hatte Hiram, der König von Tyrus, Zedern und Handwerker für Salomos Tempel geschickt, nachdem Salomo ihm gesagt hatte: „Du weißt, daß bei uns niemand ist, der Holz zu hauen wisse wie die Sidonier“, und Elia wohnte bei einer Witwe in Sarepta, einer Stadt bei Sidon. Paulus verbrachte auf seiner letzten Reise nach Jerusalem sieben Tage bei den Jüngern in Tyrus und durfte auf dem Weg nach Rom Freunde in Sidon besuchen."
    - "Herodot wurde gesagt, Tyrus sei um 2750 v. Chr. gegründet worden, und beide Städte erscheinen in den Amarna-Briefen des 14. Jahrhunderts v. Chr. Tyrer gründeten Karthago, der Überlieferung nach 814 v. Chr. Tyrus zahlte Assyrien Tribut, behielt aber seine Insel; Nebukadnezar belagerte es dreizehn Jahre lang, meist in die 580er- und 570er-Jahre v. Chr. datiert, und 332 v. Chr. nahm Alexander es nach sieben Monaten durch den Bau eines Damms vom Festland, sodass Tyrus seither mit der Küste verbunden ist. Sidon wurde 677 v. Chr. von Asarhaddon zerstört, wurde unter den Persern die führende phönizische Stadt und öffnete Alexander 333 v. Chr. die Tore. Unter Rom prägten beide eigene Münzen und waren für Glas und Purpurfarbe bekannt."
  fr:
    - "Tyr et Sidon étaient les deux principales villes de Phénicie, sur la côte de l’actuel Liban. Sidon, aujourd’hui Saïda, est à environ 40 km au sud de Beyrouth ; Tyr, aujourd’hui Sour, à environ 35 km plus au sud à vol d’oiseau. Tyr est à environ 55 km au nord-ouest de Capernaüm et à 165 km au nord de Jérusalem ; Sidon est à environ 200 km de Jérusalem. Tyr était bâtie sur une île juste au large du rivage, Sidon sur un promontoire abrité par des îlots qui formaient deux ports."
    - "Dans les Évangiles, les deux noms vont ensemble : Jésus « se retira dans le territoire de Tyr et de Sidon », où une Syro-Phénicienne le supplia de guérir sa fille, et des gens des environs des deux villes vinrent l’entendre. Il les opposa aux villes de Galilée : « si les miracles qui ont été faits au milieu de vous avaient été faits dans Tyr et dans Sidon, il y a longtemps qu’elles se seraient repenties, en prenant le sac et la cendre. » Plus tôt, Hiram, roi de Tyr, envoya du cèdre et des artisans pour le Temple de Salomon, car « il n’y a personne parmi nous qui s’entende à couper les bois comme les Sidoniens », et Élie logea chez une veuve à Sarepta, ville de Sidon. Paul passa sept jours avec les disciples à Tyr lors de son dernier voyage à Jérusalem et fut autorisé à rendre visite à des amis à Sidon en route vers Rome."
    - "On dit à Hérodote que Tyr avait été fondée vers 2750 av. J.-C., et les deux villes apparaissent dans les lettres d’Amarna du XIVe siècle av. J.-C. Des Tyriens fondèrent Carthage, selon la tradition en 814 av. J.-C. Tyr paya tribut à l’Assyrie mais garda son île ; Nebucadnetsar l’assiégea pendant treize ans, généralement datés des années 580 et 570 av. J.-C., et en 332 av. J.-C. Alexandre la prit au bout de sept mois en construisant une jetée depuis le continent, si bien que Tyr est depuis lors reliée au rivage. Sidon fut détruite par Esar-Haddon en 677 av. J.-C., devint la principale ville phénicienne sous les Perses et ouvrit ses portes à Alexandre en 333 av. J.-C. Sous Rome, les deux frappaient leur propre monnaie et étaient connues pour le verre et la teinture de pourpre."
