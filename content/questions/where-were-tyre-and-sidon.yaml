id: where-were-tyre-and-sidon
question:
  en: "Where were Tyre and Sidon?"
  ru: "Где находились Тир и Сидон?"
  uk: "Де були Тір і Сідон?"
  es: "¿Dónde estaban Tiro y Sidón?"
  pt: "Onde ficavam Tiro e Sidom?"
  de: "Wo lagen Tyrus und Sidon?"
  fr: "Où se trouvaient Tyr et Sidon ?"
  pl: "Gdzie leżały Tyr i Sydon?"
  it: "Dove si trovavano Tiro e Sidone?"
  cs: "Kde ležely Týr a Sidón?"
  nl: "Waar lagen Tyrus en Sidon?"
  sv: "Var låg Tyros och Sidon?"
  nb: "Hvor lå Tyros og Sidon?"
  tl: "Nasaan ang Tiro at Sidon?"
  da: "Hvor lå Tyrus og Sidon?"
  sr: "Где су били Тир и Сидон?"
answer:
  en:
    - "Tyre and Sidon were the two chief cities of Phoenicia, on the coast of today's Lebanon. Sidon, now Saida, lies about 40 km south of Beirut; Tyre, now Sour, about 35 km further south in a straight line. Tyre is about 55 km north-west of Capernaum and 165 km north of Jerusalem; Sidon is about 200 km from Jerusalem. Tyre was built on an island just off the shore, Sidon on a headland sheltered by islets that made two harbours."
    - 'In the Gospels the two names go together: Jesus "departed into the coasts of Tyre and Sidon", where a Syrophoenician woman begged him to heal her daughter, and people from around the two cities came to hear him. He held them up against the towns of Galilee: "if the mighty works, which were done in you, had been done in Tyre and Sidon, they would have repented long ago in sackcloth and ashes." Earlier, Hiram king of Tyre sent cedar and craftsmen for Solomon''s Temple, since "there is not among us any that can skill to hew timber like unto the Sidonians", and Elijah lodged with a widow at Zarephath, a town of Sidon. Paul spent seven days with the disciples at Tyre on his last journey to Jerusalem and was allowed to visit friends at Sidon on his way to Rome.'
    - "Herodotus was told that Tyre was founded about 2750 BC, and both cities appear in the Amarna letters of the fourteenth century BC. Tyrians founded Carthage, by tradition in 814 BC. Tyre paid tribute to Assyria but kept its island; Nebuchadnezzar besieged it for thirteen years, usually dated to the 580s and 570s BC, and in 332 BC Alexander took it after seven months by building a causeway from the mainland, so that Tyre has been joined to the shore ever since. Sidon was destroyed by Esarhaddon in 677 BC, became the leading Phoenician city under the Persians, and opened its gates to Alexander in 333 BC. Under Rome both minted their own coins and were known for glass and purple dye."
  ru:
    - "Тир и Сидон были двумя главными городами Финикии на побережье нынешнего Ливана. Сидон, ныне Сайда, лежит примерно в 40 км к югу от Бейрута; Тир, ныне Сур, — ещё в 35 км южнее по прямой. От Капернаума до Тира около 55 км на северо-запад, от Иерусалима — 165 км на север; от Иерусалима до Сидона — около 200 км. Тир был построен на острове у самого берега, Сидон — на мысу, прикрытом островками, которые образовали две гавани."
    - "В Евангелиях эти имена стоят рядом: Иисус «удалился в страны Тирские и Сидонские», где сирофиникиянка просила Его исцелить дочь, и люди из окрестностей обоих городов приходили слушать Его. Он ставил их в укор городам Галилеи: «если бы в Тире и Сидоне явлены были силы, явленные в вас, то давно бы они во вретище и пепле покаялись». Прежде Хирам, царь Тирский, присылал кедры и мастеров для храма Соломона, ибо «у нас нет людей, которые умели бы рубить дерева так, как Сидоняне», а Илия жил у вдовы в Сарепте Сидонской. Павел провёл семь дней с учениками в Тире в последнем пути в Иерусалим, и ему позволили навестить друзей в Сидоне по дороге в Рим."
    - "Геродоту говорили, что Тир основан около 2750 г. до н. э., и оба города упомянуты в Амарнских письмах XIV века до н. э. Тиряне основали Карфаген — по преданию, в 814 г. до н. э. Тир платил дань Ассирии, но сохранял свой остров; Навуходоносор осаждал его тринадцать лет, обычно это 580-е и 570-е годы до н. э., а в 332 г. до н. э. Александр взял его за семь месяцев, насыпав дамбу от материка, и с тех пор Тир соединён с берегом. Сидон разрушил Асардан в 677 г. до н. э.; при персах он стал первым городом Финикии, а в 333 г. до н. э. открыл ворота Александру. Под властью Рима оба города чеканили свою монету и славились стеклом и пурпуром."
  uk:
    - "Тір і Сідон були двома головними містами Фінікії, на узбережжі нинішнього Лівану. Сідон, нині Сайда, лежить приблизно за 40 км на південь від Бейрута; Тір, нині Сур, — приблизно за 35 км далі на південь по прямій. Тір лежить приблизно за 55 км на північний захід від Капернаума і за 165 км на північ від Єрусалима; Сідон — приблизно за 200 км від Єрусалима. Тір було збудовано на острові неподалік берега, Сідон — на мисі, захищеному острівцями, що утворювали дві гавані."
    - "В Євангеліях ці дві назви ідуть разом: Ісус «перейшов у Тирські та в Сидонські сторони», де сирофінікійка благала Його зцілити її дочку, а люди з околиць обох міст приходили слухати Його. Він порівняв їх із містами Галілеї: «бо коли б чудеса, що стали ся в вас, стались у Тирі та Сидонї, давно були б вони покаялись у веретищі та попелї». Раніше Хірам, цар Тіру, надіслав кедр і майстрів для Соломонового Храму, бо «сам бо знаєш, що у нас нема людей, що вміли б так дерево рубати, як Сидонїї», а Ілля оселився у вдови в Сарепті, місті Сідона. Павло провів сім днів з учнями в Тірі під час своєї останньої подорожі до Єрусалима і йому дозволили відвідати друзів у Сідоні по дорозі до Рима."
    - "Геродоту розповіли, що Тір заснований близько 2750 р. до н. е., і обидва міста з'являються в листах з Амарни XIV ст. до н. е. Тірійці заснували Карфаген, за переказом, 814 р. до н. е. Тір платив данину Ассирії, але зберіг свій острів; Навуходоносор облягав його тринадцять років, що їх зазвичай датують 580-ми і 570-ми рр. до н. е., а 332 р. до н. е. Александр узяв його за сім місяців, збудувавши насип від материка, так що Тір відтоді з'єднаний із берегом. Сідон був зруйнований Асархаддоном 677 р. до н. е., став провідним фінікійським містом за персів і відчинив ворота Александрові 333 р. до н. е. За Риму обидва карбували власні монети й славилися склом і пурпуровою фарбою."
  es:
    - "Tiro y Sidón eran las dos ciudades principales de Fenicia, en la costa del actual Líbano. Sidón, hoy Saida, queda a unos 40 km al sur de Beirut; Tiro, hoy Sur, a unos 35 km más al sur en línea recta. Tiro está a unos 55 km al noroeste de Cafarnaúm y a 165 km al norte de Jerusalén; Sidón, a unos 200 km de Jerusalén. Tiro se construyó en una isla justo frente a la costa, y Sidón en un promontorio resguardado por islotes que formaban dos puertos."
    - "En los Evangelios los dos nombres van juntos: Jesús «se fué á las partes de Tiro y de Sidón», donde una mujer sirofenicia le rogó que sanara a su hija, y gente de los alrededores de las dos ciudades acudió a oírle. Él las puso frente a las ciudades de Galilea: «si en Tiro y en Sidón fueran hechas las maravillas que han sido hechas en vosotras, en otro tiempo se hubieran arrepentido en saco y en ceniza». Antes, Hiram, rey de Tiro, envió cedro y artesanos para el Templo de Salomón, pues «ninguno hay entre nosotros que sepa labrar la madera como los Sidonios», y Elías se alojó con una viuda en Sarepta, una ciudad de Sidón. Pablo pasó siete días con los discípulos en Tiro en su último viaje a Jerusalén y se le permitió visitar a los amigos en Sidón de camino a Roma."
    - "A Heródoto le dijeron que Tiro se fundó hacia el 2750 a. C., y ambas ciudades aparecen en las cartas de Amarna del siglo XIV a. C. Los tirios fundaron Cartago, según la tradición en 814 a. C. Tiro pagaba tributo a Asiria pero conservó su isla; Nabucodonosor la asedió durante trece años, que suelen fecharse en las décadas del 580 y del 570 a. C., y en 332 a. C. Alejandro la tomó tras siete meses construyendo una calzada desde tierra firme, por lo que Tiro está unida a la costa desde entonces. Sidón fue destruida por Esar-hadón en 677 a. C., llegó a ser la principal ciudad fenicia bajo los persas y abrió sus puertas a Alejandro en 333 a. C. Bajo Roma, ambas acuñaron moneda propia y eran conocidas por el vidrio y el tinte de púrpura."
  pt:
    - "Tiro e Sidom eram as duas principais cidades da Fenícia, na costa do atual Líbano. Sidom, hoje Saida, fica a cerca de 40 km ao sul de Beirute; Tiro, hoje Sour, a cerca de 35 km mais ao sul em linha reta. Tiro fica a cerca de 55 km a noroeste de Cafarnaum e 165 km ao norte de Jerusalém; Sidom fica a cerca de 200 km de Jerusalém. Tiro foi construída numa ilha logo junto à costa, Sidom num promontório abrigado por ilhotas que formavam dois portos."
    - "Nos Evangelhos os dois nomes andam juntos: Jesus “retirou-se para a região de Tiro e Sidom”, onde uma mulher siro-fenícia lhe pediu que curasse sua filha, e gente dos arredores das duas cidades vinha ouvi-lo. Ele as contrapôs às cidades da Galileia: “se as obras poderosas que foram feitas em vocês tivessem sido feitas em Tiro e Sidom, há muito tempo elas teriam se arrependido em pano de saco e cinzas.” Antes, Hirão, rei de Tiro, enviou cedro e artesãos para o Templo de Salomão, pois “não há ninguém entre nós que saiba cortar madeira como os sidônios”, e Elias se hospedou com uma viúva em Sarepta, cidade de Sidom. Paulo passou sete dias com os discípulos em Tiro na sua última viagem a Jerusalém e teve permissão de visitar amigos em Sidom a caminho de Roma."
    - "Heródoto ouviu que Tiro foi fundada por volta de 2750 a.C., e as duas cidades aparecem nas cartas de Amarna do século XIV a.C. Os tírios fundaram Cartago, por tradição em 814 a.C. Tiro pagou tributo à Assíria mas conservou a sua ilha; Nabucodonosor a sitiou por treze anos, geralmente datados das décadas de 580 e 570 a.C., e em 332 a.C. Alexandre a tomou depois de sete meses, construindo um aterro desde a terra firme, de modo que Tiro está ligada à costa desde então. Sidom foi destruída por Esar-Hadom em 677 a.C., tornou-se a principal cidade fenícia sob os persas e abriu as portas a Alexandre em 333 a.C. Sob Roma, ambas cunhavam moedas próprias e eram conhecidas pelo vidro e pelo corante púrpura."
  de:
    - "Tyrus und Sidon waren die beiden Hauptstädte Phöniziens an der Küste des heutigen Libanon. Sidon, heute Saida, liegt etwa 40 km südlich von Beirut; Tyrus, heute Sour, in der Luftlinie etwa 35 km weiter südlich. Tyrus liegt etwa 55 km nordwestlich von Kapernaum und 165 km nördlich von Jerusalem; Sidon ist etwa 200 km von Jerusalem entfernt. Tyrus war auf einer Insel dicht vor der Küste gebaut, Sidon auf einer Landzunge, die durch Inselchen geschützt war und zwei Häfen bildete."
    - "In den Evangelien gehören die beiden Namen zusammen: Jesus „entwich in die Gegend von Tyrus und Sidon“, wo eine syrophönizische Frau ihn bat, ihre Tochter zu heilen, und Menschen aus der Umgebung der beiden Städte kamen, um ihn zu hören. Er hielt sie den Städten Galiläas entgegen: „Wären solche Taten zu Tyrus und Sidon geschehen, wie bei euch geschehen sind, sie hätten vorzeiten im Sack und in der Asche Buße getan.“ Früher hatte Hiram, der König von Tyrus, Zedern und Handwerker für Salomos Tempel geschickt, nachdem Salomo ihm gesagt hatte: „Du weißt, daß bei uns niemand ist, der Holz zu hauen wisse wie die Sidonier“, und Elia wohnte bei einer Witwe in Sarepta, einer Stadt bei Sidon. Paulus verbrachte auf seiner letzten Reise nach Jerusalem sieben Tage bei den Jüngern in Tyrus und durfte auf dem Weg nach Rom Freunde in Sidon besuchen."
    - "Herodot wurde gesagt, Tyrus sei um 2750 v. Chr. gegründet worden, und beide Städte erscheinen in den Amarna-Briefen des 14. Jahrhunderts v. Chr. Tyrer gründeten Karthago, der Überlieferung nach 814 v. Chr. Tyrus zahlte Assyrien Tribut, behielt aber seine Insel; Nebukadnezar belagerte es dreizehn Jahre lang, meist in die 580er- und 570er-Jahre v. Chr. datiert, und 332 v. Chr. nahm Alexander es nach sieben Monaten durch den Bau eines Damms vom Festland, sodass Tyrus seither mit der Küste verbunden ist. Sidon wurde 677 v. Chr. von Asarhaddon zerstört, wurde unter den Persern die führende phönizische Stadt und öffnete Alexander 333 v. Chr. die Tore. Unter Rom prägten beide eigene Münzen und waren für Glas und Purpurfarbe bekannt."
  fr:
    - "Tyr et Sidon étaient les deux principales villes de Phénicie, sur la côte de l’actuel Liban. Sidon, aujourd’hui Saïda, est à environ 40 km au sud de Beyrouth ; Tyr, aujourd’hui Sour, à environ 35 km plus au sud à vol d’oiseau. Tyr est à environ 55 km au nord-ouest de Capernaüm et à 165 km au nord de Jérusalem ; Sidon est à environ 200 km de Jérusalem. Tyr était bâtie sur une île juste au large du rivage, Sidon sur un promontoire abrité par des îlots qui formaient deux ports."
    - "Dans les Évangiles, les deux noms vont ensemble : Jésus « se retira dans le territoire de Tyr et de Sidon », où une Syro-Phénicienne le supplia de guérir sa fille, et des gens des environs des deux villes vinrent l’entendre. Il les opposa aux villes de Galilée : « si les miracles qui ont été faits au milieu de vous avaient été faits dans Tyr et dans Sidon, il y a longtemps qu’elles se seraient repenties, en prenant le sac et la cendre. » Plus tôt, Hiram, roi de Tyr, envoya du cèdre et des artisans pour le Temple de Salomon, car « il n’y a personne parmi nous qui s’entende à couper les bois comme les Sidoniens », et Élie logea chez une veuve à Sarepta, ville de Sidon. Paul passa sept jours avec les disciples à Tyr lors de son dernier voyage à Jérusalem et fut autorisé à rendre visite à des amis à Sidon en route vers Rome."
    - "On dit à Hérodote que Tyr avait été fondée vers 2750 av. J.-C., et les deux villes apparaissent dans les lettres d’Amarna du XIVe siècle av. J.-C. Des Tyriens fondèrent Carthage, selon la tradition en 814 av. J.-C. Tyr paya tribut à l’Assyrie mais garda son île ; Nebucadnetsar l’assiégea pendant treize ans, généralement datés des années 580 et 570 av. J.-C., et en 332 av. J.-C. Alexandre la prit au bout de sept mois en construisant une jetée depuis le continent, si bien que Tyr est depuis lors reliée au rivage. Sidon fut détruite par Esar-Haddon en 677 av. J.-C., devint la principale ville phénicienne sous les Perses et ouvrit ses portes à Alexandre en 333 av. J.-C. Sous Rome, les deux frappaient leur propre monnaie et étaient connues pour le verre et la teinture de pourpre."
  pl:
    - "Tyr i Sydon były dwoma głównymi miastami Fenicji, na wybrzeżu dzisiejszego Libanu. Sydon, dziś Sajda, leży około 40 km na południe od Bejrutu; Tyr, dziś Sur, około 35 km dalej na południe w linii prostej. Tyr jest oddalony o około 55 km na północny zachód od Kafarnaum i 165 km na północ od Jerozolimy; Sydon leży około 200 km od Jerozolimy. Tyr zbudowano na wyspie tuż przy brzegu, Sydon na cyplu osłoniętym wysepkami, które tworzyły dwa porty."
    - "W Ewangeliach te dwie nazwy idą razem: Jezus „ustąpił w strony Tyru i Sydonu”, gdzie Syrofenicjanka błagała go o uzdrowienie córki, a ludzie z okolic obu miast przychodzili go słuchać. Przeciwstawił je miastom Galilei: „gdyby się były w Tyrze i w Sydonie te cuda stały, które się w was stały, dawno by były w worze i w popiele pokutowały”. Wcześniej Hiram, król Tyru, przysłał cedr i rzemieślników dla Świątyni Salomona, bo „niemasz między nami męża, któryby umiał tak rąbać drzewo, jako Sydończycy”, a Eliasz mieszkał u wdowy w Sarepcie, mieście Sydonu. Paweł spędził siedem dni z uczniami w Tyrze w ostatniej podróży do Jerozolimy i pozwolono mu odwiedzić przyjaciół w Sydonie w drodze do Rzymu."
    - "Herodot usłyszał, że Tyr założono około 2750 p.n.e., a oba miasta pojawiają się w listach z Amarny z XIV wieku p.n.e. Tyryjczycy założyli Kartaginę, według tradycji w 814 p.n.e. Tyr płacił daninę Asyrii, ale zachował swoją wyspę; Nabuchodonozor oblegał go przez trzynaście lat, zwykle datowanych na lata 80. i 70. VI wieku p.n.e., a w 332 p.n.e. Aleksander zdobył go po siedmiu miesiącach, budując groblę od lądu, tak że Tyr od tamtej pory jest połączony z brzegiem. Sydon zniszczył Asarhaddon w 677 p.n.e., za Persów stał się czołowym miastem fenickim, a w 333 p.n.e. otworzył bramy przed Aleksandrem. Pod rządami Rzymu oba biły własne monety i słynęły ze szkła i purpurowego barwnika."
  it:
    - "Tiro e Sidone erano le due principali città della Fenicia, sulla costa dell’odierno Libano. Sidone, oggi Saida, dista circa 40 km a sud di Beirut; Tiro, oggi Sour, circa 35 km più a sud in linea d’aria. Tiro è a circa 55 km a nord-ovest di Cafarnao e 165 km a nord di Gerusalemme; Sidone dista circa 200 km da Gerusalemme. Tiro fu costruita su un’isola poco al largo della costa, Sidone su un promontorio riparato da isolotti che formavano due porti."
    - "Nei Vangeli i due nomi vanno insieme: Gesù «si ritirò nelle parti di Tiro e di Sidone», dove una donna sirofenicia lo supplicò di guarire la figlia, e gente dei dintorni delle due città venne ad ascoltarlo. Egli le contrappose alle città della Galilea: «se in Tiro e Sidone fossero state fatte le opere potenti compiute fra voi, già da gran tempo si sarebbero pentite, con cilicio e cenere». In precedenza Chiram, re di Tiro, mandò cedro e artigiani per il Tempio di Salomone, poiché «non v’è alcuno fra noi che sappia tagliare il legname, come quei di Sidone», ed Elia fu ospite di una vedova a Sarepta, città di Sidone. Paolo trascorse sette giorni con i discepoli a Tiro nel suo ultimo viaggio a Gerusalemme e gli fu permesso di visitare amici a Sidone mentre andava a Roma."
    - "A Erodoto fu detto che Tiro era stata fondata verso il 2750 a.C., ed entrambe le città compaiono nelle lettere di Amarna del XIV secolo a.C. I Tirii fondarono Cartagine, secondo la tradizione nell’814 a.C. Tiro pagava tributo all’Assiria ma conservò la sua isola; Nabucodonosor la assediò per tredici anni, di solito datati agli anni 580 e 570 a.C., e nel 332 a.C. Alessandro la prese dopo sette mesi costruendo un molo dalla terraferma, così che Tiro è da allora unita alla costa. Sidone fu distrutta da Assaraddon nel 677 a.C., divenne la principale città fenicia sotto i Persiani, e aprì le porte ad Alessandro nel 333 a.C. Sotto Roma entrambe coniarono monete proprie ed erano note per il vetro e la tintura di porpora."
  cs:
    - "Týr a Sidón byla dvě hlavní města Fénicie, na pobřeží dnešního Libanonu. Sidón, nyní Sajdá, leží asi 40 km jižně od Bejrútu; Týr, nyní Súr, asi o 35 km dále na jih vzdušnou čarou. Týr je asi 55 km severozápadně od Kafarnaum a 165 km severně od Jeruzaléma; Sidón je asi 200 km od Jeruzaléma. Týr byl postaven na ostrově těsně u břehu, Sidón na výběžku chráněném ostrůvky, které vytvářely dva přístavy."
    - "V evangeliích jdou obě jména spolu: Ježíš „bral se do krajin Tyrských a Sidonských“, kde ho syrofénická žena prosila o uzdravení dcery, a lidé z okolí obou měst přicházeli, aby ho slyšeli. Postavil je proti městům Galileje: „kdyby v Týru a Sidonu byli činěni divové ti, kteříž jsou činěni v vás, dávno by byli v žíni a v popele pokání činili.“ Dříve poslal Chíram, král Týru, cedr a řemeslníky pro Šalomounův chrám, neboť „mezi námi není žádného, kdož by uměl sekati dříví, jako jsou Sidonští“, a Elijáš bydlel u vdovy v Sarepťě, městě Sidónu. Pavel strávil sedm dní s učedníky v Týru na své poslední cestě do Jeruzaléma a směl navštívit přátele v Sidónu na cestě do Říma."
    - "Hérodotos se dověděl, že Týr byl založen kolem roku 2750 př. n. l., a obě města se objevují v amarnských listech 14. století př. n. l. Týřané založili Kartágo, podle tradice roku 814 př. n. l. Týr platil Asýrii daň, ale podržel svůj ostrov; Nebukadnesar jej oblehl na třináct let, obvykle datováno do 80. a 70. let 6. století př. n. l., a roku 332 př. n. l. jej Alexandr dobyl po sedmi měsících stavbou hráze od pevniny, takže je Týr od té doby spojen s pobřežím. Sidón zničil Asarhadón roku 677 př. n. l., za Peršanů se stal předním fénickým městem a roku 333 př. n. l. otevřel brány Alexandrovi. Za Říma ražila obě vlastní mince a byla proslulá sklem a purpurovým barvivem."
  nl:
    - "Tyrus en Sidon waren de twee voornaamste steden van Fenicië, aan de kust van het huidige Libanon. Sidon, nu Saida, ligt ongeveer 40 km ten zuiden van Beiroet; Tyrus, nu Sour, ongeveer 35 km verder naar het zuiden hemelsbreed. Tyrus ligt ongeveer 55 km ten noordwesten van Kafarnaüm en 165 km ten noorden van Jeruzalem; Sidon ligt ongeveer 200 km van Jeruzalem. Tyrus was gebouwd op een eiland vlak voor de kust, Sidon op een landtong beschut door eilandjes die twee havens vormden."
    - "In de evangeliën gaan de twee namen samen: Jezus “vertrok naar de delen van Tyrus en Sidon”, waar een Syro-Fenicische vrouw Hem smeekte haar dochter te genezen, en mensen uit de omgeving van de twee steden kwamen Hem horen. Hij hield ze de steden van Galilea voor: “zo in Tyrus en Sidon de krachten waren geschied, die in u geschied zijn, zij zouden zich eertijds in zak en as bekeerd hebben.” Eerder stuurde Hiram, koning van Tyrus, cederhout en ambachtslieden voor de tempel van Salomo, omdat “onder ons niemand is, die weet hout te houwen, gelijk de Sidoniers”, en Elia logeerde bij een weduwe te Sarefat, een stad van Sidon. Paulus bracht zeven dagen door bij de leerlingen te Tyrus op zijn laatste reis naar Jeruzalem en mocht op weg naar Rome vrienden bezoeken in Sidon."
    - "Herodotus kreeg te horen dat Tyrus omstreeks 2750 v.Chr. werd gesticht, en beide steden komen voor in de Amarnabrieven van de veertiende eeuw v.Chr. Tyriërs stichtten Carthago, volgens de overlevering in 814 v.Chr. Tyrus betaalde schatting aan Assyrië maar behield zijn eiland; Nebukadnessar belegerde het dertien jaar, gewoonlijk gedateerd in de jaren 580 en 570 v.Chr., en in 332 v.Chr. nam Alexander het na zeven maanden in door een dam vanaf het vasteland aan te leggen, zodat Tyrus sindsdien met de kust is verbonden. Sidon werd in 677 v.Chr. door Esarhaddon verwoest, werd onder de Perzen de leidende Fenicische stad en opende in 333 v.Chr. zijn poorten voor Alexander. Onder Rome sloegen beide eigen munten en stonden bekend om glas en purperverf."
  sv:
    - "Tyros och Sidon var Feniciens två främsta städer, vid kusten av dagens Libanon. Sidon, nu Saida, ligger omkring 40 km söder om Beirut; Tyros, nu Sour, omkring 35 km längre söderut i fågelvägen. Tyros ligger omkring 55 km nordväst om Kafarnaum och 165 km norr om Jerusalem; Sidon omkring 200 km från Jerusalem. Tyros byggdes på en ö strax utanför kusten, Sidon på en udde skyddad av holmar som skapade två hamnar."
    - "I evangelierna hör de två namnen ihop: Jesus ”drog sig undan till trakten av Tyrus och Sidon”, där en syrofenicisk kvinna bad honom bota hennes dotter, och människor från trakterna kring de två städerna kom för att höra honom. Han ställde dem mot städerna i Galileen: ”om de kraftgärningar som äro gjorda i eder hade blivit gjorda i Tyrus och Sidon, så skulle de för länge sedan hava gjort bättring i säck och aska.” Tidigare sände Hiram, kung av Tyros, cederträ och hantverkare till Salomos tempel, eftersom ”bland oss icke finnes någon som är så skicklig att hugga virke som sidonierna”, och Elia bodde hos en änka i Sarefat, en stad som hörde till Sidon. Paulus tillbringade sju dagar med lärjungarna i Tyros på sin sista resa till Jerusalem och fick besöka vänner i Sidon på väg till Rom."
    - "Herodotos fick höra att Tyros grundades omkring 2750 f.Kr., och båda städerna förekommer i Amarnabreven från 1300-talet f.Kr. Tyrierna grundade Kartago, enligt traditionen år 814 f.Kr. Tyros betalade tribut till Assyrien men behöll sin ö; Nebukadnessar belägrade den i tretton år, vanligen daterat till 580- och 570-talen f.Kr., och 332 f.Kr. intog Alexander den efter sju månader genom att bygga en vall från fastlandet, så att Tyros sedan dess har varit förenat med kusten. Sidon förstördes av Esarhaddon 677 f.Kr., blev den ledande feniciska staden under perserna och öppnade sina portar för Alexander 333 f.Kr. Under Rom präglade båda egna mynt och var kända för glas och purpurfärg."
  nb:
    - "Tyros og Sidon var Fønikias to hovedbyer, på kysten av dagens Libanon. Sidon, nå Saida, ligger omtrent 40 km sør for Beirut; Tyros, nå Sour, omtrent 35 km lenger sør i luftlinje. Tyros ligger omtrent 55 km nordvest for Kapernaum og 165 km nord for Jerusalem; Sidon er omtrent 200 km fra Jerusalem. Tyros ble bygd på en øy rett utenfor kysten, Sidon på en odde skjermet av holmer som dannet to havner."
    - "I evangeliene hører de to navnene sammen: Jesus «trakk sig tilbake til landet ved Tyrus og Sidon», der en syrofønikisk kvinne ba ham helbrede datteren, og folk fra områdene rundt de to byene kom for å høre ham. Han holdt dem opp mot byene i Galilea: «Dersom de kraftige gjerninger som er gjort i eder, var gjort i Tyrus og Sidon, da hadde de for lenge siden omvendt sig i sekk og aske.» Tidligere sendte Hiram, konge av Tyros, sedertre og håndverkere til Salomos tempel, for «det ikke finnes nogen blandt oss som skjønner sig så godt på å hugge trær som sidonierne», og Elia bodde hos en enke i Sarepta, en by som hørte til Sidon. Paulus tilbrakte sju dager hos disiplene i Tyros på sin siste reise til Jerusalem og fikk lov til å besøke venner i Sidon på vei til Roma."
    - "Herodot ble fortalt at Tyros ble grunnlagt omkring 2750 f.Kr., og begge byene forekommer i Amarna-brevene fra 1300-tallet f.Kr. Tyrerne grunnla Kartago, etter tradisjonen i 814 f.Kr. Tyros betalte skatt til Assyria, men beholdt sin øy; Nebukadnesar beleiret den i tretten år, vanligvis datert til 580- og 570-årene f.Kr., og i 332 f.Kr. tok Aleksander den etter sju måneder ved å bygge en voll fra fastlandet, så Tyros har vært forbundet med kysten siden. Sidon ble ødelagt av Asarhaddon i 677 f.Kr., ble den ledende fønikiske byen under perserne og åpnet portene for Aleksander i 333 f.Kr. Under Roma preget begge sine egne mynter og var kjent for glass og purpurfarge."
  tl:
    - "Ang Tiro at Sidon ang dalawang pangunahing lungsod ng Fenicia, sa baybayin ng Libano ngayon. Ang Sidon, Saida ngayon, ay mga 40 km sa timog ng Beirut; ang Tiro, Sour ngayon, mga 35 km pa sa timog sa tuwid na guhit. Ang Tiro ay mga 55 km sa hilagang-kanluran ng Capernaum at 165 km sa hilaga ng Jerusalem; ang Sidon ay mga 200 km mula sa Jerusalem. Itinayo ang Tiro sa pulo sa labas ng baybayin, ang Sidon sa tangos na kinukublihan ng maliliit na pulo na lumilikha ng dalawang daungan."
    - "Sa mga Ebanghelyo, magkasama ang dalawang pangalan: si Jesus ay “lumigpit sa mga sakop ng Tiro at Sidon”, kung saan nagmakaawa ang isang babaing Sirofenicia na pagalingin ang kaniyang anak, at dumating ang mga tao mula sa paligid nila upang makinig sa kaniya. Inihambing niya ang mga bayan ng Galilea: “kung sa Tiro at sa Sidon sana ginawa ang mga gawang makapangyarihan na ginawa sa inyo, malaon na dising nangagsisi na may mga damit na magaspang at abo.” Mas maaga, nagpadala si Hiram, hari ng Tiro, ng sedro at mga manggagawa para sa Templo ni Salomon, yamang “wala sinoman sa amin na makapagdadaras ng mga kahoy ng gaya ng mga Sidonio”, at tumuloy si Elias sa isang balo sa Sarepta, bayan ng Sidon. Pitong araw na kasama ni Pablo ang mga alagad sa Tiro sa huli niyang paglalakbay patungong Jerusalem at pinahintulutang dalawin ang mga kaibigan sa Sidon patungong Roma."
    - "Sinabihan si Herodoto na itinatag ang Tiro noong mga 2750 BK, at lumilitaw ang dalawang lungsod sa mga liham ng Amarna noong ika-14 na siglo BK. Itinatag ng mga taga-Tiro ang Cartago, ayon sa tradisyon noong 814 BK. Nagbayad ng buwis sa Asiria ang Tiro ngunit pinanatili ang pulo nito; kinubkob ito ni Nabucodonosor nang labintatlong taon, karaniwang ipinepetsa sa mga dekada 580 at 570 BK, at noong 332 BK sinakop ito ni Alejandro pagkaraan ng pitong buwan sa pagtatayo ng daan mula sa kontinente, kaya mula noon ay nakadugtong na ang Tiro sa baybayin. Winasak ni Esar-hadon ang Sidon noong 677 BK, naging nangungunang lungsod ng Fenicia sa ilalim ng mga Persiano, at binuksan ang mga tarangkahan kay Alejandro noong 333 BK. Sa ilalim ng Roma, parehong naglabas ng sariling barya at kilala sa salamin at kulay-ube."
  da:
    - "Tyrus og Sidon var Fønikiens to hovedbyer, ved kysten af nutidens Libanon. Sidon, nu Saida, ligger ca. 40 km syd for Beirut; Tyrus, nu Sour, ca. 35 km længere mod syd i fugleflugt. Tyrus ligger ca. 55 km nordvest for Kapernaum og 165 km nord for Jerusalem; Sidon ca. 200 km fra Jerusalem. Tyrus var bygget på en ø lige ud for kysten, Sidon på et forbjerg beskyttet af holme, der dannede to havne."
    - "I evangelierne hører de to navne sammen: Jesus »drog til Tyrus’s og Sidons Egne«, hvor en syrofønikisk kvinde bad ham helbrede sin datter, og folk fra egnen omkring de to byer kom for at høre ham. Han holdt dem op imod Galilæas byer: »dersom de kraftige Gerninger, som ere skete i eder, vare skete i Tyrus og Sidon, da havde de for længe siden omvendt sig i Sæk og Aske.« Tidligere sendte Hiram, Tyrus’ konge, cedertræ og håndværkere til Salomos tempel, da »her er ingen hos os, som forstaar at hugge Træer, som Zidonierne«, og Elija boede hos en enke i Sarepta, en by ved Sidon. Paulus tilbragte syv dage hos disciplene i Tyrus på sin sidste rejse til Jerusalem og fik lov til at besøge venner i Sidon på vej til Rom."
    - "Herodot fik at vide, at Tyrus blev grundlagt omkring 2750 f.Kr., og begge byer optræder i Amarna-brevene fra 1300-tallet f.Kr. Tyrerne grundlagde Karthago, ifølge traditionen i 814 f.Kr. Tyrus betalte skat til Assyrien, men beholdt sin ø; Nebukadnezar belejrede den i tretten år, sædvanligvis dateret til 580’erne og 570’erne f.Kr., og i 332 f.Kr. indtog Alexander den efter syv måneder ved at bygge en dæmning fra fastlandet, så Tyrus har været forbundet med kysten lige siden. Sidon blev ødelagt af Esarhaddon i 677 f.Kr., blev den førende fønikiske by under perserne og åbnede sine porte for Alexander i 333 f.Kr. Under Rom prægede begge deres egne mønter og var kendt for glas og purpurfarve."
  sr:
    - "Тир и Сидон били су два главна града Феникије, на обали данашњег Либана. Сидон, сада Саида, лежи око 40 км јужно од Бејрута; Тир, сада Сур, око 35 км даље јужно ваздушном линијом. Тир је око 55 км северозападно од Капернаума и 165 км северно од Јерусалима; Сидон је око 200 км од Јерусалима. Тир је био саграђен на острву одмах уз обалу, Сидон на рту заклоњеном острвцима која су чинила два пристаништа."
    - "У јеванђељима та два имена иду заједно: Исус „отиде у крајеве тирске и сидонске“, где га је једна Сирофиникијка молила да исцели њену кћер, а људи из околине та два града долазили су да га чују. Супротставио их је градовима Галилеје: „Јер да су у Тиру и Сидону била чудеса која су била у вама, давно би се у врећи и пепелу покајали.“ Раније је Хирам, краљ Тира, послао кедар и мајсторе за Соломонов храм, јер „у нас нема људи који умеју сећи дрва као сидонци“, а Илија је становао код удовице у Сарепти, граду Сидона. Павле је на свом последњем путу у Јерусалим провео седам дана са ученицима у Тиру, а на путу у Рим допуштено му је да посети пријатеље у Сидону."
    - "Херодоту су рекли да је Тир основан око 2750. п. н. е., и оба града јављају се у Амарнским писмима из четрнаестог века п. н. е. Тирци су основали Картагину, по предању 814. п. н. е. Тир је плаћао данак Асирији, али је задржао своје острво; Навуходоносор га је опседао тринаест година, обично датираних у 580-е и 570-е п. н. е., а 332. п. н. е. Александар га је заузео после седам месеци градећи насип са копна, па је Тир од тада спојен са обалом. Сидон је разорио Есарадон 677. п. н. е., постао је водећи феничански град под Персијанцима и отворио капије Александру 333. п. н. е. Под Римом су оба ковала сопствени новац и била позната по стаклу и пурпурној боји."
