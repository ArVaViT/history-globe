id: where-was-galatia
question:
  en: "Where was Galatia?"
  ru: "Где находилась Галатия?"
  uk: "Де була Галатія?"
  es: "¿Dónde estaba Galacia?"
  pt: "Onde ficava a Galácia?"
  de: "Wo lag Galatien?"
  fr: "Où se trouvait la Galatie ?"
  pl: "Gdzie leżała Galacja?"
  it: "Dov’era la Galazia?"
  cs: "Kde ležela Galacie?"
  nl: "Waar lag Galatië?"
answer:
  en:
    - "Galatia was the high plateau of central Asia Minor around Ancyra, today's Ankara; the map point stands in the middle of the region, south of the city. The name comes from the Galatians, Celtic tribes who crossed into Asia in 278 BC and settled there, around Ancyra, Pessinus and Tavium. In 25 BC Rome made it a province and added the lands to the south, Pisidia and Lycaonia, so that Pisidian Antioch, Iconium, Lystra and Derbe, the cities of Paul's first journey, were Galatian by law though not by race; from the map point they lie 160 to 195 km to the south and south-west."
    - "This double meaning is the question behind the letter “unto the churches of Galatia”. The older view, still common in Europe, takes the Galatians to be the Celts of the north, whom Paul would have visited on his second and third journeys when Acts says he went through “Phrygia and the region of Galatia” and “all the country of Galatia and Phrygia”; the letter then dates to the mid-50s. The South Galatian view, argued by William Ramsay from the Roman provincial boundaries, makes the recipients the churches of Antioch, Iconium, Lystra and Derbe, and allows the letter to be as early as about 48, before the council of Jerusalem; many English-language commentaries now prefer it. Peter also writes to “the strangers scattered throughout Pontus, Galatia, Cappadocia, Asia, and Bithynia”, listing the provinces."
    - "The Galatians kept their Celtic speech: Jerome, who had lived in Trier, wrote in the 380s that they spoke almost the same tongue as the Treveri of the Rhineland. Ancyra's temple of Augustus and Roma, built under Augustus, carries on its walls the fullest copy of the emperor's own account of his reign, the Monumentum Ancyranum; the temple still stands in Ankara."
  ru:
    - "Галатия — высокое плато в центре Малой Азии вокруг Анкиры, нынешней Анкары; точка карты стоит посреди области, к югу от города. Имя дали галаты, кельтские племена, которые перешли в Азию в 278 г. до н. э. и осели там, вокруг Анкиры, Пессинунта и Тавия. В 25 г. до н. э. Рим сделал её провинцией и прибавил земли к югу, Писидию и Ликаонию, так что Антиохия Писидийская, Икония, Листра и Дервия — города первого путешествия Павла — были галатийскими по закону, хотя и не по крови; от точки карты они лежат в 160–195 км к югу и юго-западу."
    - "В этой двойственности — вопрос, стоящий за посланием «церквам Галатийским». Старое мнение, по-прежнему распространённое в Европе, видит в галатах кельтов севера, которых Павел посетил бы во втором и третьем путешествиях, когда, по Деяниям, он прошёл «через Фригию и Галатийскую страну» и «страну Галатийскую и Фригию»; тогда послание относится к середине 50-х годов. Южногалатийская теория, которую Уильям Рамсей вывел из римских провинциальных границ, делает адресатами церкви Антиохии, Иконии, Листры и Дервии и позволяет датировать послание уже примерно 48 годом, до Иерусалимского собора; многие англоязычные комментарии теперь предпочитают её. Пётр тоже пишет «пришельцам, рассеянным в Понте, Галатии, Каппадокии, Асии и Вифинии», перечисляя провинции."
    - "Галаты сохранили кельтскую речь: Иероним, живший в Трире, писал в 380-х годах, что они говорят почти на том же языке, что и треверы Рейнской области. Храм Августа и Ромы в Анкире, построенный при Августе, несёт на стенах самую полную копию собственного отчёта императора о своём правлении — Monumentum Ancyranum; храм до сих пор стоит в Анкаре."
  uk:
    - "Галатія — високе плато в центрі Малої Азії навколо Анкіри, нинішньої Анкари; точка на мапі стоїть посеред області, на південь від міста. Назва походить від галатів, кельтських племен, які 278 р. до н. е. перейшли в Азію й оселилися тут, навколо Анкіри, Пессинунта й Тавія. 25 р. до н. е. Рим зробив її провінцією й додав землі на півдні — Пісідію та Лікаонію, так що Пісідійська Антіохія, Іконія, Лістра й Дервія, міста першої подорожі Павла, були галатійськими за законом, хоч не за походженням; від точки на мапі вони лежать за 160–195 км на південь і південний захід."
    - "Ця подвійність значення — питання, що стоїть за листом «церквам Галацьким». Давніший погляд, і досі поширений у Європі, вважає галатів кельтами півночі, яких Павло мав відвідати під час другої та третьої подорожей, коли Дії кажуть, що він пройшов «Фригию та Галацьку сторону» і «Галацьку сторону та Фригию»; тоді лист датується серединою 50-х років. Південногалатійський погляд, обґрунтований Вільямом Рамзаєм на підставі римських провінційних кордонів, робить адресатами церкви Антіохії, Іконії, Лістри й Дервії та допускає, що лист написано вже близько 48 р., до Єрусалимського собору; багато англомовних коментарів нині віддають перевагу йому. Петро також пише «вибраним захожанам розсїяння по Понту, Галатиї, Кападокиї, Азиї і Витиниї», перелічуючи провінції."
    - "Галати зберегли кельтську мову: Єронім, який жив у Трірі, писав у 380-х рр., що вони говорили майже тією самою мовою, що й тревіри Рейнської області. На стінах храму Августа й Роми в Анкірі, збудованого за Августа, зберігається найповніший примірник власної розповіді імператора про своє правління — Monumentum Ancyranum; храм і досі стоїть в Анкарі."
  es:
    - "Galacia era la alta meseta del centro de Asia Menor en torno a Ancira, la actual Ankara; el punto del mapa está en medio de la región, al sur de la ciudad. El nombre procede de los gálatas, tribus celtas que pasaron a Asia en 278 a. C. y se establecieron allí, en torno a Ancira, Pesinunte y Tavio. En 25 a. C. Roma la hizo provincia y le añadió las tierras del sur, Pisidia y Licaonia, de modo que Antioquía de Pisidia, Iconio, Listra y Derbe, las ciudades del primer viaje de Pablo, eran gálatas por ley, aunque no por raza; desde el punto del mapa quedan de 160 a 195 km al sur y al suroeste."
    - "Este doble sentido es la cuestión tras la carta «á las iglesias de Galacia». La opinión más antigua, aún común en Europa, entiende que los gálatas son los celtas del norte, a quienes Pablo habría visitado en su segundo y tercer viajes, cuando los Hechos dicen que pasó por «Phrygia y la provincia de Galacia» y por «la provincia de Galacia, y la Phrygia»; la carta se fecharía entonces a mediados de la década del 50. La tesis de la Galacia meridional, defendida por William Ramsay desde los límites provinciales romanos, hace destinatarias a las iglesias de Antioquía, Iconio, Listra y Derbe, y permite una carta tan temprana como hacia el 48, antes del concilio de Jerusalén; muchos comentarios en lengua inglesa la prefieren hoy. También Pedro escribe «á los extranjeros esparcidos en Ponto, en Galacia, en Capadocia, en Asia, y en Bithinia», y enumera así las provincias."
    - "Los gálatas conservaron su lengua celta: Jerónimo, que había vivido en Tréveris, escribió en la década del 380 que hablaban casi la misma lengua que los tréveros de Renania. El templo de Augusto y Roma en Ancira, construido bajo Augusto, lleva en sus muros la copia más completa del propio relato del emperador sobre su reinado, el Monumentum Ancyranum; el templo sigue en pie en Ankara."
  pt:
    - "A Galácia era o alto planalto do centro da Ásia Menor, em torno de Ancira, a atual Ancara; o ponto do mapa fica no meio da região, ao sul da cidade. O nome vem dos gálatas, tribos celtas que passaram à Ásia em 278 a.C. e se estabeleceram ali, em torno de Ancira, Pessinunte e Távio. Em 25 a.C. Roma fez dela uma província e acrescentou as terras ao sul, a Pisídia e a Licaônia, de modo que Antioquia da Pisídia, Icônio, Listra e Derbe, as cidades da primeira viagem de Paulo, eram gálatas por lei, embora não por raça; a partir do ponto do mapa, ficam de 160 a 195 km ao sul e sudoeste."
    - "Esse duplo sentido é a questão por trás da carta “às igrejas da Galácia”. A visão mais antiga, ainda comum na Europa, entende os gálatas como os celtas do norte, que Paulo teria visitado na segunda e na terceira viagens, quando Atos diz que ele passou pela “região da Frígia e da Galácia” e pela “região da Galácia e da Frígia”; a carta seria então de meados dos anos 50. A visão da Galácia do Sul, defendida por William Ramsay a partir dos limites provinciais romanos, faz dos destinatários as igrejas de Antioquia, Icônio, Listra e Derbe, e permite datar a carta já por volta de 48, antes do concílio de Jerusalém; muitos comentários em inglês hoje a preferem. Pedro também escreve “aos eleitos que vivem como estrangeiros na Dispersão no Ponto, Galácia, Capadócia, Ásia e Bitínia”, enumerando as províncias."
    - "Os gálatas conservaram a sua língua celta: Jerônimo, que vivera em Tréveris, escreveu na década de 380 que falavam quase a mesma língua dos tréveros da Renânia. O templo de Augusto e Roma em Ancira, construído sob Augusto, traz em suas paredes a cópia mais completa do relato do próprio imperador sobre o seu reinado, o Monumentum Ancyranum; o templo ainda está de pé em Ancara."
  de:
    - "Galatien war die Hochebene im Inneren Kleinasiens um Ankyra, das heutige Ankara; der Kartenpunkt steht in der Mitte der Region, südlich der Stadt. Der Name geht auf die Galater zurück, keltische Stämme, die 278 v. Chr. nach Asien übersetzten und sich dort um Ankyra, Pessinus und Tavium niederließen. Im Jahr 25 v. Chr. machte Rom es zur Provinz und fügte die Länder im Süden hinzu, Pisidien und Lykaonien, sodass Antiochia in Pisidien, Ikonion, Lystra und Derbe, die Städte der ersten Reise des Paulus, rechtlich galatisch waren, wenn auch nicht ihrer Abstammung nach; vom Kartenpunkt liegen sie 160 bis 195 km südlich und südwestlich."
    - "Diese doppelte Bedeutung ist die Frage hinter dem Brief „den Gemeinden in Galatien“. Die ältere, in Europa noch verbreitete Ansicht versteht darunter die Kelten des Nordens, die Paulus auf seiner zweiten und dritten Reise besucht hätte, als er nach der Apostelgeschichte „durch Phrygien und das Land Galatien“ zog und „nacheinander das galatische Land und Phrygien“ durchwanderte; der Brief entstünde dann Mitte der 50er-Jahre. Die südgalatische Ansicht, von William Ramsay aus den römischen Provinzgrenzen begründet, sieht die Empfänger in den Gemeinden von Antiochia, Ikonion, Lystra und Derbe und erlaubt eine Abfassung schon um 48 n. Chr., vor dem Konzil von Jerusalem; viele englischsprachige Kommentare bevorzugen sie. Auch Petrus schreibt „den erwählten Fremdlingen hin und her in Pontus, Galatien, Kappadozien, Asien und Bithynien“ und zählt dabei die Provinzen auf."
    - "Die Galater behielten ihre keltische Sprache: Hieronymus, der in Trier gelebt hatte, schrieb in den 380er-Jahren, sie sprächen fast dieselbe Sprache wie die Treverer im Rheinland. Der Tempel des Augustus und der Roma in Ankyra, unter Augustus erbaut, trägt an seinen Wänden die vollständigste Abschrift des Rechenschaftsberichts des Kaisers selbst, das Monumentum Ancyranum; der Tempel steht noch heute in Ankara."
  fr:
    - "La Galatie était le haut plateau du centre de l’Asie Mineure autour d’Ancyre, l’actuelle Ankara ; le point de la carte se trouve au milieu de la région, au sud de la ville. Son nom vient des Galates, tribus celtiques qui passèrent en Asie en 278 av. J.-C. et s’y établirent, autour d’Ancyre, de Pessinonte et de Tavium. En 25 av. J.-C., Rome en fit une province et y ajouta les terres du sud, la Pisidie et la Lycaonie, si bien qu’Antioche de Pisidie, Icone, Lystre et Derbé, les villes du premier voyage de Paul, étaient galates en droit sinon par la race ; du point de la carte, elles se trouvent à 160-195 km au sud et au sud-ouest."
    - "Cette double acception pose la question de la lettre « aux Églises de la Galatie ». L’opinion la plus ancienne, encore courante en Europe, voit dans les Galates les Celtes du nord, que Paul aurait visités lors de ses deuxième et troisième voyages, quand les Actes disent qu’il traversa « la Phrygie et le pays de Galatie » et parcourut « la Galatie et la Phrygie » ; la lettre date alors du milieu des années 50. La thèse de la Galatie du Sud, défendue par William Ramsay à partir des limites des provinces romaines, fait des destinataires les Églises d’Antioche, d’Icone, de Lystre et de Derbé, et date la lettre d’environ 48, avant le concile de Jérusalem ; nombre de commentaires anglophones la préfèrent aujourd’hui. Pierre écrit lui aussi « à ceux qui sont étrangers et dispersés dans le Pont, la Galatie, la Cappadoce, l’Asie et la Bithynie », qu’il énumère."
    - "Les Galates gardèrent leur langue celtique : Jérôme, qui avait vécu à Trèves, écrivit dans les années 380 qu’ils parlaient presque la même langue que les Trévires de Rhénanie. Le temple d’Auguste et de Rome à Ancyre, bâti sous Auguste, porte sur ses murs la copie la plus complète du récit que l’empereur lui-même fit de son règne, le Monumentum Ancyranum ; le temple se dresse encore à Ankara."
  pl:
    - "Galacja była wyżyną w środkowej Azji Mniejszej wokół Ancyry, dzisiejszej Ankary; punkt na mapie stoi w środku regionu, na południe od miasta. Nazwa pochodzi od Galatów, celtyckich plemion, które w 278 p.n.e. przeprawiły się do Azji i osiedliły tam, wokół Ancyry, Pesynuntu i Tavium. W 25 p.n.e. Rzym uczynił z niej prowincję i dodał ziemie na południu, Pizydię i Likaonię, tak że Antiochia Pizydyjska, Ikonium, Listra i Derbe, miasta pierwszej podróży Pawła, były galackie z mocy prawa, choć nie z pochodzenia; od punktu na mapie dzieli je od 160 do 195 km na południe i południowy zachód."
    - "Ta podwójność znaczenia jest sednem pytania o list „zborom Galackim”. Starszy pogląd, wciąż powszechny w Europie, uznaje Galatów za Celtów z północy, których Paweł odwiedziłby w drugiej i trzeciej podróży, gdy według Dziejów przeszedł „Frygiję i Galatską krainę” oraz „krainę Galatską i Frygiję”; list datuje się wtedy na połowę lat pięćdziesiątych. Pogląd południowogalacki, uzasadniony przez Williama Ramsaya granicami rzymskich prowincji, czyni adresatami zbory Antiochii, Ikonium, Listry i Derbe i pozwala datować list już na około 48, przed soborem jerozolimskim; wiele komentarzy anglojęzycznych woli dziś to ujęcie. Piotr pisze też „przychodniom rozproszonym w Poncie, w Galacyi, w Kapadocyi, w Azji i w Bitynii”, wymieniając prowincje."
    - "Galaci zachowali celtycki język: Hieronim, który mieszkał w Trewirze, pisał w latach 380., że mówili niemal tym samym językiem co Trewerowie z Nadrenii. Świątynia Augusta i Romy w Ancyrze, zbudowana za Augusta, nosi na ścianach najpełniejszą kopię własnego sprawozdania cesarza z jego panowania, Monumentum Ancyranum; świątynia stoi do dziś w Ankarze."
  it:
    - "La Galazia era l’alto altopiano dell’Asia Minore centrale attorno ad Ancira, l’odierna Ankara; il punto della mappa si trova al centro della regione, a sud della città. Il nome deriva dai Galati, tribù celtiche che passarono in Asia nel 278 a.C. e vi si stabilirono, attorno ad Ancira, Pessinunte e Tavio. Nel 25 a.C. Roma ne fece una provincia e vi aggiunse le terre a sud, la Pisidia e la Licaonia, così che Antiochia di Pisidia, Icònio, Listra e Derbe, le città del primo viaggio di Paolo, erano galate per legge ma non per stirpe; dal punto della mappa distano da 160 a 195 km a sud e a sud-ovest."
    - "Questo doppio significato è il nodo della lettera «alle chiese della Galazia». L’opinione più antica, ancora comune in Europa, vede nei Galati i Celti del nord, visitati da Paolo nel secondo e nel terzo viaggio, quando secondo gli Atti attraversò «la Frigia e il paese della Galazia» e «il paese della Galazia e la Frigia»; la lettera risalirebbe allora alla metà degli anni 50. L’opinione della Galazia meridionale, sostenuta da William Ramsay dai confini provinciali romani, fa dei destinatari le chiese di Antiochia, Icònio, Listra e Derbe, e ammette una datazione della lettera già al 48 circa, prima del concilio di Gerusalemme; molti commentari in lingua inglese oggi la preferiscono. Anche Pietro scrive «agli eletti che vivono come forestieri nella dispersione del Ponto, della Galazia, della Cappadocia, dell’Asia e della Bitinia», elencando le province."
    - "I Galati conservarono la loro lingua celtica: Girolamo, che aveva vissuto a Treviri, scrisse negli anni 380 che parlavano quasi la stessa lingua dei Treveri della Renania. Il tempio di Augusto e di Roma ad Ancira, costruito sotto Augusto, reca sulle sue pareti la copia più completa del resoconto che l’imperatore stesso fece del proprio regno, il Monumentum Ancyranum; il tempio sorge ancora ad Ankara."
  cs:
    - "Galacie byla vysoká náhorní rovina ve střední Malé Asii kolem Ankyry, dnešní Ankary; bod na mapě stojí uprostřed oblasti, jižně od města. Jméno pochází od Galatů, keltských kmenů, které roku 278 př. n. l. přešly do Asie a usadily se tam kolem Ankyry, Pessinúntu a Tavia. Roku 25 př. n. l. z ní Řím učinil provincii a připojil země na jihu, Pisidii a Lykaonii, takže Antiochie Pisidská, Ikonium, Lystra a Derbe, města Pavlovy první cesty, byla galatská podle práva, i když ne podle rodu; od bodu na mapě leží 160 až 195 km na jih a jihozápad."
    - "Tento dvojí význam je otázkou za listem „sborům Galatským“. Starší názor, v Evropě dosud běžný, pokládá Galaty za Kelty na severu, které by Pavel navštívil na druhé a třetí cestě, když podle Skutků prošel „Frygii i Galatskou krajinu“ a „pořád Galatskou krajinu a Frygii“; list by pak spadal do poloviny 50. let. Jihogalatský názor, který na základě římských provinčních hranic hájil William Ramsay, činí adresáty sbory v Antiochii, Ikoniu, Lystře a Derbe a připouští, že list vznikl už kolem roku 48, před jeruzalémským koncilem; mnohé anglicky psané komentáře mu dnes dávají přednost. Petr také píše „příchozím rozptýleným v Pontu, Galacii, Kappadocii, v Azii a v Bitynii“ a vyjmenovává tak provincie."
    - "Galaťané si ponechali keltskou řeč: Jeroným, který žil v Trevíru, napsal v 380. letech, že mluví téměř stejným jazykem jako Treverové v Porýní. Ankyrský chrám Augusta a Romy, vystavěný za Augusta, nese na stěnách nejúplnější opis císařova vlastního vylíčení jeho vlády, Monumentum Ancyranum; chrám stojí v Ankaře dodnes."
  nl:
    - "Galatië was het hoogland van Midden-Klein-Azië rond Ancyra, het huidige Ankara; het punt op de kaart staat in het midden van de streek, ten zuiden van de stad. De naam komt van de Galaten, Keltische stammen die in 278 v.Chr. naar Azië overstaken en zich daar vestigden, rond Ancyra, Pessinus en Tavium. In 25 v.Chr. maakte Rome er een provincie van en voegde de landen in het zuiden toe, Pisidië en Lykaonië, zodat Antiochië in Pisidië, Ikonium, Lystra en Derbe, de steden van Paulus' eerste reis, wettelijk wel maar naar afkomst niet Galatisch waren; vanaf het punt op de kaart liggen zij 160 tot 195 km naar het zuiden en zuidwesten."
    - "Deze dubbele betekenis ligt achter de vraag naar de brief “aan de Gemeenten van Galatië”. De oudere opvatting, in Europa nog gangbaar, houdt de Galaten voor de Kelten van het noorden, die Paulus op zijn tweede en derde reis zou hebben bezocht toen hij volgens Handelingen “Frygië, en het land van Galatië” en “het land van Galatië en Frygië” doorreisde; de brief dateert dan uit het midden van de jaren vijftig. De Zuid-Galatische opvatting, door William Ramsay verdedigd op grond van de Romeinse provinciegrenzen, maakt de gemeenten van Antiochië, Ikonium, Lystra en Derbe tot de ontvangers en laat toe dat de brief al van ongeveer 48 dateert, vóór het concilie van Jeruzalem; veel Engelstalige commentaren geven haar nu de voorkeur. Ook Petrus schrijft aan “de vreemdelingen, verstrooid in Pontus, Galatië, Kappadocië, Azië en Bithynië”, waarbij hij de provincies opsomt."
    - "De Galaten behielden hun Keltische taal: Hieronymus, die in Trier had gewoond, schreef in de jaren 380 dat zij bijna dezelfde taal spraken als de Treveri van het Rijnland. De tempel van Augustus en Roma in Ancyra, onder Augustus gebouwd, draagt op zijn muren het volledigste exemplaar van het eigen verslag van de keizer over zijn regering, het Monumentum Ancyranum; de tempel staat nog steeds in Ankara."
