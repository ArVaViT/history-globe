id: where-was-bethany
question:
  en: "Where was Bethany?"
  ru: "Где находилась Вифания?"
  uk: "Де була Віфанія?"
  es: "¿Dónde estaba Betania?"
  pt: "Onde ficava Betânia?"
  de: "Wo lag Bethanien?"
  fr: "Où se trouvait Béthanie ?"
answer:
  en:
    - "Bethany was a village on the eastern slope of the Mount of Olives, just outside Jerusalem: John puts it fifteen furlongs (stadia) from the city, about 3 km, and by the road on the map it is 4 km. It is the town now called al-Eizariya, east of Jerusalem in the West Bank; the Arabic name comes from Lazarus."
    - 'In the Gospels it is the town of Lazarus and his sisters Mary and Martha: "Now Bethany was nigh unto Jerusalem, about fifteen furlongs off." Jesus raised Lazarus there when he had already lain four days in the grave, supped there six days before the Passover, when Mary anointed his feet, and lodged there during his last week in Jerusalem. The road from Jerusalem to Jericho passed through the village. Luke ends his Gospel there: "And he led them out as far as to Bethany, and he lifted up his hands, and blessed them."'
    - "In the early fourth century Eusebius described Bethany as a village two miles from Jerusalem where the place of Lazarus was still shown, and in the 380s the pilgrim Egeria called it the Lazarium. Franciscan excavations in 1949–1953 uncovered remains of the village and of successive churches beside the cave venerated as the tomb of Lazarus, the first of them a basilica of the late fourth century. This Bethany is not the Bethany beyond the Jordan where John baptised (Bethabara in the KJV); the map's point for that place, on the east bank near the Dead Sea, is marked as disputed."
  ru:
    - "Вифания была селением на восточном склоне горы Елеонской, совсем рядом с Иерусалимом: Иоанн помещает её в пятнадцати стадиях от города, около 3 км, а по дороге на карте до неё 4 км. Это городок, который ныне называется Эль-Эйзария, к востоку от Иерусалима на Западном берегу; арабское имя происходит от Лазаря."
    - "В Евангелиях это селение Лазаря и его сестёр Марии и Марфы: «Вифания же была близ Иерусалима, стадиях в пятнадцати». Здесь Иисус воскресил Лазаря, уже четыре дня лежавшего во гробе, здесь за шесть дней до Пасхи была вечеря, на которой Мария помазала Ему ноги, и здесь Он ночевал в последнюю неделю в Иерусалиме. Через селение шла дорога из Иерусалима в Иерихон. Лука завершает здесь своё Евангелие: «И вывел их вон из города до Вифании и, подняв руки Свои, благословил их»."
    - "В начале IV века Евсевий описывал Вифанию как селение в двух милях от Иерусалима, где ещё показывали место Лазаря, а в 380-х годах паломница Эгерия называла его Лазарием. Францисканские раскопки 1949–1953 годов открыли остатки селения и нескольких сменявших друг друга церквей рядом с пещерой, почитаемой как гроб Лазаря; первая из них — базилика конца IV века. Эта Вифания — не та Вифавара (Вифания) при Иордане, где крестил Иоанн; точка карты для того места, на восточном берегу близ Мёртвого моря, помечена как спорная."
  uk:
    - "Віфанія була селом на східному схилі Оливкової гори, просто поза Єрусалимом: Іван ставить її за п'ятнадцять стадій від міста, близько 3 км, а дорогою на мапі це 4 км. Це місто, що нині зветься аль-Ейзарія, на схід від Єрусалиму на Західному березі; арабська назва походить від Лазаря."
    - "В Євангеліях це місто Лазаря та його сестер Марії й Марфи: Віфанія була поблизу Єрусалиму, приблизно п'ятнадцять стадій. Ісус воскресив там Лазаря, коли той уже чотири дні лежав у гробі, вечеряв там за шість днів до Пасхи, коли Марія намастила Його ноги, і ночував там протягом свого останнього тижня в Єрусалимі. Дорога з Єрусалиму до Єрихону проходила через село. Лука закінчує там своє Євангеліє: «вивів їх геть аж до Витаниї, і, знявши руки свої, благословив їх»."
    - "На початку IV ст. Євсевій описував Віфанію як село за дві милі від Єрусалиму, де ще показували місце Лазаря, а в 380-х рр. прочанка Егерія називала її Лазарієм. Францисканські розкопки 1949–1953 рр. відкрили рештки села й послідовних церков біля печери, шанованої як гробниця Лазаря, першою з яких була базиліка кінця IV ст. Ця Віфанія — не Віфанія за Йорданом, де Іван хрестив (Витавара в Біблії Куліша); точка мапи для того місця, на східному березі біля Мертвого моря, позначена як спірна."
  es:
    - "Betania era una aldea en la ladera oriental del monte de los Olivos, justo fuera de Jerusalén: Juan la sitúa a quince estadios de la ciudad, unos 3 km, y por el camino del mapa son 4 km. Es la población que hoy se llama al-Eizariya, al este de Jerusalén, en Cisjordania; el nombre árabe procede de Lázaro."
    - "En los Evangelios es la ciudad de Lázaro y de sus hermanas María y Marta: «Y Bethania estaba cerca de Jerusalem, como quince estadios». Jesús resucitó allí a Lázaro cuando ya llevaba cuatro días en el sepulcro, cenó allí seis días antes de la Pascua, cuando María ungió sus pies, y se alojó allí durante su última semana en Jerusalén. El camino de Jerusalén a Jericó pasaba por la aldea. Lucas termina allí su Evangelio: «Y sacólos fuera hasta Bethania, y alzando sus manos, los bendijo»."
    - "A comienzos del siglo IV, Eusebio describió Betania como una aldea a dos millas de Jerusalén donde aún se mostraba el lugar de Lázaro, y en los años 380 la peregrina Egeria la llamó el Lazarium. Las excavaciones franciscanas de 1949–1953 sacaron a la luz restos de la aldea y de sucesivas iglesias junto a la cueva venerada como tumba de Lázaro, la primera de ellas una basílica de finales del siglo IV. Esta Betania no es la Betania de más allá del Jordán donde Juan bautizaba (Betábara en la Biblia del Rey Jacobo); el punto del mapa para ese lugar, en la orilla oriental, cerca del mar Muerto, está marcado como discutido."
  pt:
    - "Betânia era uma aldeia na encosta oriental do monte das Oliveiras, logo fora de Jerusalém: João a põe a quinze estádios da cidade, cerca de 3 km, e pela estrada do mapa são 4 km. É a cidade hoje chamada al-Eizariya, a leste de Jerusalém, na Cisjordânia; o nome árabe vem de Lázaro."
    - "Nos Evangelhos é a cidade de Lázaro e de suas irmãs Maria e Marta: “Betânia ficava perto de Jerusalém, a cerca de quinze estádios de distância.” Ali Jesus ressuscitou Lázaro, que já estava havia quatro dias no túmulo, ceou seis dias antes da Páscoa, quando Maria lhe ungiu os pés, e se hospedou durante sua última semana em Jerusalém. A estrada de Jerusalém a Jericó passava pela aldeia. Lucas termina ali o seu Evangelho: “Ele os levou para fora, até Betânia, e, levantando as mãos, os abençoou.”"
    - "No início do século IV, Eusébio descreveu Betânia como uma aldeia a duas milhas de Jerusalém onde ainda se mostrava o lugar de Lázaro, e nos anos 380 a peregrina Egéria a chamou de Lazarium. As escavações franciscanas de 1949–1953 revelaram restos da aldeia e de igrejas sucessivas junto à gruta venerada como túmulo de Lázaro, a primeira delas uma basílica do fim do século IV. Esta Betânia não é a Betânia além do Jordão onde João batizava (Betábara na versão King James); o ponto do mapa para esse lugar, na margem leste perto do mar Morto, está marcado como disputado."
  de:
    - "Bethanien war ein Dorf am Osthang des Ölbergs, unmittelbar vor Jerusalem: Johannes setzt es fünfzehn Stadien von der Stadt an, etwa 3 km, und auf der Straße der Karte sind es 4 km. Es ist der heute al-Eisarija genannte Ort östlich von Jerusalem im Westjordanland; der arabische Name kommt von Lazarus."
    - "In den Evangelien ist es die Stadt des Lazarus und seiner Schwestern Maria und Marta: „Bethanien aber war nahe bei Jerusalem, bei fünfzehn Feld Weges.“ Dort erweckte Jesus Lazarus, als er schon vier Tage im Grab gelegen hatte, aß sechs Tage vor dem Passa, als Maria seine Füße salbte, und übernachtete dort in seiner letzten Woche in Jerusalem. Die Straße von Jerusalem nach Jericho führte durch das Dorf. Lukas beendet sein Evangelium dort: „Er führte sie aber hinaus bis gen Bethanien und hob die Hände auf und segnete sie.“"
    - "Im frühen 4. Jahrhundert beschrieb Eusebius Bethanien als ein Dorf zwei Meilen von Jerusalem, wo man noch den Ort des Lazarus zeigte, und in den 380er Jahren nannte die Pilgerin Egeria es das Lazarium. Franziskanische Ausgrabungen 1949–1953 legten Reste des Dorfes und aufeinanderfolgender Kirchen neben der als Grab des Lazarus verehrten Höhle frei, die erste davon eine Basilika des späten 4. Jahrhunderts. Dieses Bethanien ist nicht das Bethanien jenseits des Jordan, wo Johannes taufte (Bethabara in der King-James-Bibel); der Kartenpunkt für jenen Ort am Ostufer nahe dem Toten Meer ist als umstritten gekennzeichnet."
  fr:
    - "Béthanie était un village sur le versant oriental du mont des Oliviers, juste à l’extérieur de Jérusalem : Jean la met à quinze stades de la ville, environ 3 km, et par la route de la carte elle est à 4 km. C’est la ville appelée aujourd’hui al-Eizariya, à l’est de Jérusalem, en Cisjordanie ; le nom arabe vient de Lazare."
    - "Dans les Évangiles, c’est la ville de Lazare et de ses sœurs Marie et Marthe : « comme Béthanie était près de Jérusalem, à quinze stades environ ». Jésus y ressuscita Lazare, déjà quatre jours dans le tombeau, y soupa six jours avant la Pâque, quand Marie lui oignit les pieds, et y logea pendant sa dernière semaine à Jérusalem. La route de Jérusalem à Jéricho passait par le village. Luc y termine son Évangile : « Il les conduisit jusque vers Béthanie, et, ayant levé les mains, il les bénit. »"
    - "Au début du IVe siècle, Eusèbe décrivait Béthanie comme un village à deux milles de Jérusalem où l’on montrait encore le lieu de Lazare, et dans les années 380 la pèlerine Égérie l’appelait le Lazarium. Des fouilles franciscaines de 1949–1953 mirent au jour des vestiges du village et d’églises successives près de la grotte vénérée comme tombeau de Lazare, la première étant une basilique de la fin du IVe siècle. Cette Béthanie n’est pas la Béthanie au-delà du Jourdain où Jean baptisait (Béthabara dans la King James) ; le point de la carte pour ce lieu, sur la rive orientale près de la mer Morte, est marqué comme discuté."
