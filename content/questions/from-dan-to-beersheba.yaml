id: from-dan-to-beersheba
question:
  en: "How far is it from Dan to Beersheba?"
  ru: "Как далеко от Дана до Вирсавии?"
  uk: "Як далеко від Дана до Беер-Шеви?"
  es: "¿Qué distancia hay de Dan a Beerseba?"
  pt: "Qual é a distância de Dã a Berseba?"
  de: "Wie weit ist es von Dan bis Beerscheba?"
  fr: "Quelle est la distance de Dan à Beer-Schéba ?"
  pl: "Jak daleko jest od Dan do Beer-Szeby?"
  it: "Qual è la distanza da Dan a Bersabea?"
  nl: "Hoe ver is het van Dan naar Berseba?"
  cs: "Jak daleko je to z Danu do Beer-šeby?"
  sv: "Hur långt är det från Dan till Beer Sheva?"
  nb: "Hvor langt er det fra Dan til Beer-Sjeba?"
  tl: "Gaano kalayo mula sa Dan hanggang sa Beer-seba?"
  da: "Hvor langt er der fra Dan til Beersheba?"
  sr: "Колико је далеко од Дана до Вирсавеје?"
answer:
  en:
    - "About 236 km in a straight line, from the sources of the Jordan at the foot of Mount Hermon to the edge of the Negev desert. The phrase “from Dan even to Beer-sheba” is the Bible's way of saying all Israel, from its northern end to its southern, and in this order it is used seven times, from the time of the judges to the reign of Solomon; Chronicles twice has it the other way round."
    - "Judges says that “all the children of Israel went out, and the congregation was gathered together as one man, from Dan even to Beer-sheba”; Samuel was known as a prophet “from Dan even to Beer-sheba”; David told Joab, “Go now through all the tribes of Israel, from Dan even to Beer-sheba, and number ye the people”; and under Solomon “Judah and Israel dwelt safely, every man under his vine and under his fig tree, from Dan even to Beer-sheba”. Chronicles, written from Judah, turns it round: “from Beer-sheba even to Dan”."
    - "Dan, formerly Laish, is Tel Dan in the far north of today's Israel, about 25 km from the Hermon point on the map and 168 km from Jerusalem; the Danites took it in the days of the judges, and Jeroboam set up one of his golden calves there. Its gate of the Middle Bronze Age and the Aramaic stele naming the “house of David”, found in 1993, are its best-known finds. Beersheba, where Abraham dug his well and swore his oath, is Tel Beer Sheva east of the modern city, about 70 km south-west of Jerusalem, a planned town of the kingdom of Judah with a great well outside its gate, inscribed as a World Heritage site in 2005."
  ru:
    - "Около 236 км по прямой — от истоков Иордана у подножия Ермона до края пустыни Негев. Выражение «от Дана до Вирсавии» — библейский способ сказать «весь Израиль», от северного края до южного; в таком порядке оно встречается семь раз, от времени судей до царствования Соломона; в Паралипоменон оно дважды стоит наоборот."
    - "Книга Судей говорит: «вышли все сыны Израилевы, и собралось все общество, как один человек, от Дана до Вирсавии»; Самуила знали как пророка «от Дана до Вирсавии»; Давид велел Иоаву: «пройди по всем коленам Израилевым и Иудиным от Дана до Вирсавии, и исчислите народ»; а при Соломоне «жили Иуда и Израиль спокойно, каждый под виноградником своим и под смоковницею своею, от Дана до Вирсавии». Книга Паралипоменон, написанная в Иудее, переворачивает порядок: «от Вирсавии до Дана»."
    - "Дан, прежде Лаис, — это Тель-Дан на крайнем севере нынешнего Израиля, примерно в 25 км от точки Ермона на карте и в 168 км от Иерусалима; данитяне взяли его во дни судей, а Иеровоам поставил там одного из своих золотых тельцов. Его ворота средней бронзы и арамейская стела с упоминанием «дома Давида», найденная в 1993 году, — самые известные находки. Вирсавия, где Авраам выкопал колодец и принёс клятву, — это Тель-Беэр-Шева к востоку от нынешнего города, примерно в 70 км к юго-западу от Иерусалима, спланированный город Иудейского царства с большим колодцем у ворот; в 2005 году он внесён в список Всемирного наследия."
  uk:
    - "Близько 236 км по прямій — від витоків Йордану біля підніжжя гори Гермон до краю пустелі Негев. Вислів «від Дана до Беер-Шеви» — біблійний спосіб сказати «увесь Ізраїль», від північного краю до південного; у такому порядку він трапляється сім разів, від часів суддів до царювання Соломона; у Хроніках він двічі стоїть навпаки."
    - "У книзі Суддів сказано: «повиходили всї сини Ізрайлеві, і зібралась громада як один чоловік від Дана аж до Берсабиї»; Самуїла знав увесь Ізраїль як пророка «від Дану та й до Берсабиї»; Давид наказав Йоабові: «Пройди по всїм поколїнням Ізрайлевим од Дана та й до Берсаби й перелїчіть народ»; а за Соломона «жили собі Юда й Ізраїль впокійно, кожен під виноградиною своєю й під смоквою своєю, від Дану та й до Берсабиї». Хроніки, написані в Юдеї, обертають порядок: «від Бирсабії до Дана»."
    - "Дан, колись Лаіш, — це Тель-Дан на крайній півночі сучасного Ізраїлю, приблизно за 25 км від точки Гермону на мапі й за 168 км від Єрусалиму; данити взяли його за часів суддів, а Єровоам поставив там одного зі своїх золотих тельців. Його брама доби середньої бронзи та арамейська стела зі згадкою про «дім Давида», знайдена 1993 року, — найвідоміші знахідки. Беер-Шева, де Авраам викопав свою криницю й склав присягу, — це Тель-Беер-Шева на схід від сучасного міста, приблизно за 70 км на південний захід від Єрусалиму, сплановане місто Юдейського царства з великою криницею біля брами; 2005 року його внесено до Списку всесвітньої спадщини."
  es:
    - "Unos 236 km en línea recta, desde las fuentes del Jordán, al pie del monte Hermón, hasta el borde del desierto del Négev. La expresión «desde Dan hasta Beer-seba» es la manera bíblica de decir todo Israel, de su extremo norte a su extremo sur; en este orden aparece siete veces, desde la época de los jueces hasta el reinado de Salomón; en Crónicas aparece dos veces en el orden inverso."
    - "Jueces dice que «salieron todos los hijos de Israel, y reunióse la congregación como un solo hombre, desde Dan hasta Beer-seba»; a Samuel se le conoció como profeta «desde Dan hasta Beer-sebah»; David dijo a Joab: «Rodea todas las tribus de Israel, desde Dan hasta Beer-seba, y contad el pueblo»; y bajo Salomón «Judá é Israel vivían seguros, cada uno debajo de su parra y debajo de su higuera, desde Dan hasta Beer-seba». Crónicas, escrito desde Judá, invierte el orden: «desde Beer-seba hasta Dan»."
    - "Dan, antes Lais, es Tel Dan, en el extremo norte del Israel actual, a unos 25 km del punto del Hermón en el mapa y a 168 km de Jerusalén; los danitas la tomaron en tiempos de los jueces, y Jeroboam levantó allí uno de sus becerros de oro. Su puerta de la Edad del Bronce Medio y la estela aramea que menciona la «casa de David», hallada en 1993, son sus hallazgos más conocidos. Beerseba, donde Abraham cavó su pozo y prestó su juramento, es Tel Beer Sheva, al este de la ciudad moderna, a unos 70 km al suroeste de Jerusalén, una ciudad planificada del reino de Judá con un gran pozo fuera de su puerta, inscrita como Patrimonio Mundial en 2005."
  pt:
    - "Cerca de 236 km em linha reta, das nascentes do Jordão, ao pé do monte Hermom, até a orla do deserto do Neguebe. A expressão “desde Dã até Berseba” é a maneira bíblica de dizer todo o Israel, do extremo norte ao extremo sul; nessa ordem aparece sete vezes, do tempo dos juízes ao reinado de Salomão; em Crônicas aparece duas vezes na ordem inversa."
    - "Juízes diz que “todos os filhos de Israel saíram, e a congregação se reuniu como um só homem, desde Dã até Berseba”; Samuel foi reconhecido como profeta “desde Dã até Berseba”; Davi disse a Joabe: “Agora percorra todas as tribos de Israel, desde Dã até Berseba, e conte o povo”; e sob Salomão “Judá e Israel viviam em segurança, cada homem debaixo da sua videira e debaixo da sua figueira, desde Dã até Berseba”. Crônicas, escrito em Judá, inverte a ordem: “desde Berseba até Dã”."
    - "Dã, antes chamada Laís, é Tel Dã, no extremo norte do Israel de hoje, a cerca de 25 km do ponto do Hermom no mapa e a 168 km de Jerusalém; os danitas a tomaram nos dias dos juízes, e Jeroboão instalou ali um dos seus bezerros de ouro. Seu portão da Idade do Bronze Médio e a estela aramaica que menciona a “casa de Davi”, encontrada em 1993, são seus achados mais conhecidos. Berseba, onde Abraão cavou seu poço e fez seu juramento, é Tel Berseba, a leste da cidade moderna, a cerca de 70 km a sudoeste de Jerusalém, uma cidade planejada do reino de Judá, com um grande poço fora do portão, inscrita como Patrimônio Mundial em 2005."
  de:
    - "Etwa 236 km Luftlinie, von den Jordanquellen am Fuß des Hermon bis zum Rand der Wüste Negev. Die Wendung „von Dan an bis gen Beer-Seba“ ist die biblische Art, ganz Israel zu bezeichnen, von seinem nördlichen bis zu seinem südlichen Ende; in dieser Reihenfolge steht sie siebenmal, von der Richterzeit bis zur Regierung Salomos; die Chronik kennt sie zweimal in umgekehrter Richtung."
    - "Das Buch der Richter sagt: „Da zogen die Kinder Israel aus und versammelten sich zuhauf wie ein Mann, von Dan bis gen Beer-Seba“; Samuel war als Prophet bekannt „von Dan an bis gen Beer-Seba“; David sagte zu Joab: „Gehe umher in allen Stämmen Israels von Dan an bis gen Beer-Seba und zähle das Volk“; und unter Salomo, „daß Juda und Israel sicher wohnten, ein jeglicher unter seinem Weinstock und unter seinem Feigenbaum, von Dan bis gen Beer-Seba“. Die Chronik, in Juda geschrieben, kehrt es um: „von Beer-Seba an bis gen Dan“."
    - "Dan, früher Lais, ist Tel Dan im äußersten Norden des heutigen Israel, etwa 25 km vom Hermon-Punkt auf der Karte und 168 km von Jerusalem entfernt; die Daniter nahmen es in der Richterzeit ein, und Jerobeam stellte dort eines seiner goldenen Kälber auf. Sein Tor aus der Mittelbronzezeit und die 1993 gefundene aramäische Stele mit dem „Haus Davids“ sind seine bekanntesten Funde. Beerscheba, wo Abraham seinen Brunnen grub und seinen Eid schwor, ist Tel Beerscheba östlich der heutigen Stadt, etwa 70 km südwestlich von Jerusalem, eine planmäßig angelegte Stadt des Königreichs Juda mit einem großen Brunnen vor dem Tor, 2005 in die Welterbeliste eingetragen."
  fr:
    - "Environ 236 km en ligne droite, des sources du Jourdain, au pied du mont Hermon, jusqu’à la lisière du désert du Néguev. L’expression « depuis Dan jusqu’à Beer-Schéba » est la manière biblique de dire tout Israël, de son extrémité nord à son extrémité sud ; dans cet ordre, elle apparaît sept fois, de l’époque des juges au règne de Salomon ; les Chroniques l’emploient deux fois en sens inverse."
    - "Les Juges disent que « tous les enfants d’Israël sortirent, depuis Dan jusqu’à Beer-Schéba … et l’assemblée se réunit comme un seul homme » ; Samuel fut reconnu prophète par « tout Israël, depuis Dan jusqu’à Beer-Schéba » ; David dit à Joab : « Parcours toutes les tribus d’Israël, depuis Dan jusqu’à Beer-Schéba ; qu’on fasse le dénombrement du peuple » ; et sous Salomon, « Juda et Israël, depuis Dan jusqu’à Beer-Schéba, habitèrent en sécurité, chacun sous sa vigne et sous son figuier ». Les Chroniques, écrites depuis Juda, inversent : « depuis Beer-Schéba jusqu’à Dan »."
    - "Dan, autrefois Laïs, est Tel Dan, à l’extrême nord de l’Israël actuel, à environ 25 km du point de l’Hermon sur la carte et à 168 km de Jérusalem ; les Danites la prirent à l’époque des juges, et Jéroboam y plaça l’un de ses veaux d’or. Sa porte du Bronze moyen et la stèle araméenne mentionnant la « maison de David », découverte en 1993, sont ses trouvailles les plus connues. Beer-Schéba, où Abraham creusa son puits et prêta serment, est Tel Beer-Schéba, à l’est de la ville moderne, à environ 70 km au sud-ouest de Jérusalem : une ville planifiée du royaume de Juda, avec un grand puits devant sa porte, inscrite au patrimoine mondial en 2005."
  pl:
    - "Około 236 km w linii prostej, od źródeł Jordanu u stóp góry Hermon do skraju pustyni Negew. Zwrot „od Dan aż do Beerseba” to biblijny sposób powiedzenia „cały Izrael”, od jego krańca północnego do południowego; w tej kolejności występuje siedem razy, od czasów sędziów do panowania Salomona; Księgi Kronik dwukrotnie podają go w kolejności odwrotnej."
    - "Księga Sędziów mówi: „Wyszli tedy wszyscy synowie Izraelscy, a zgromadziło się wszystko pospólstwo jednomyślnie od Dan aż do Beerseba”; Samuel był znany jako prorok „od Dan aż do Beerseba”; Dawid rozkazał Joabowi: „Przbież zaraz wszystkie pokolenia Izraelskie od Dan aż do Beerseba, a policzcie lud”; a za Salomona: „I mieszkał Juda i Izrael bezpiecznie, każdy pod winną macicą swoją, i pod figą swoją, od Dan aż do Beerseba”. Księgi Kronik, spisane w Judzie, odwracają ten porządek: „od Beerseba aż do Dan”."
    - "Dan, dawniej Lajisz, to Tel Dan na dalekiej północy dzisiejszego Izraela, około 25 km od punktu Hermonu na mapie i 168 km od Jerozolimy; Danici zdobyli je za dni sędziów, a Jeroboam ustawił tam jednego ze swoich złotych cielców. Jego brama z epoki brązu środkowego i aramejska stela wymieniająca „dom Dawida”, odnaleziona w 1993 roku, to jego najsłynniejsze znaleziska. Beer-Szeba, gdzie Abraham wykopał swoją studnię i złożył przysięgę, to Tel Beer Szewa na wschód od współczesnego miasta, około 70 km na południowy zachód od Jerozolimy, planowo założone miasto królestwa Judy z wielką studnią przed bramą, wpisane na Listę Światowego Dziedzictwa w 2005 roku."
  it:
    - "Circa 236 km in linea retta, dalle sorgenti del Giordano ai piedi del Monte Ermon fino al margine del deserto del Negev. L’espressione «da Dan fino a Beer-Sceba» è il modo biblico di dire tutto Israele, dal suo estremo nord al suo estremo sud, e in quest’ordine ricorre sette volte, dall’epoca dei giudici al regno di Salomone; le Cronache la hanno due volte in senso inverso."
    - "I Giudici dicono che «tutti i figliuoli d’Israele uscirono, da Dan fino a Beer-Sceba … e la raunanza si raccolse come un sol uomo»; Samuele fu riconosciuto profeta: «Tutto Israele, da Dan fino a Beer-Sceba, riconobbe che Samuele era stabilito profeta dell’Eterno»; Davide disse a Ioab: «Va’ attorno per tutte le tribù d’Israele, da Dan fino a Beer-Sheba, e fate il censimento del popolo»; e sotto Salomone «Giuda ed Israele, da Dan fino a Beer-Sceba, vissero al sicuro ognuno all’ombra della sua vite e del suo fico». Le Cronache, scritte da Giuda, invertono l’ordine: «da Beer-Sceba fino a Dan»."
    - "Dan, un tempo Lais, è Tel Dan, nell’estremo nord dell’Israele odierno, a circa 25 km dal punto dell’Ermon sulla mappa e a 168 km da Gerusalemme; i Daniti la presero ai giorni dei giudici, e Geroboamo vi collocò uno dei suoi vitelli d’oro. La sua porta dell’età del Bronzo Medio e la stele aramaica che nomina la «casa di Davide», trovata nel 1993, sono i suoi ritrovamenti più noti. Bersabea, dove Abramo scavò il suo pozzo e prestò il suo giuramento, è Tel Beer Sheva, a est della città moderna, a circa 70 km a sud-ovest di Gerusalemme, una città pianificata del regno di Giuda con un grande pozzo fuori della porta, iscritta nel Patrimonio mondiale nel 2005."
  nl:
    - "Ongeveer 236 km hemelsbreed, van de bronnen van de Jordaan aan de voet van de Hermon tot de rand van de Negev-woestijn. De uitdrukking “van Dan af tot Ber-seba toe” is de bijbelse manier om heel Israël aan te duiden, van zijn noordelijke tot zijn zuidelijke einde; in deze volgorde komt zij zeven keer voor, van de tijd van de richters tot de regering van Salomo; Kronieken heeft haar tweemaal in omgekeerde volgorde."
    - "Richteren zegt: “Toen togen alle kinderen Israëls uit, en de vergadering verzamelde zich, als een enig man, van Dan af tot Ber-seba toe”; Samuël stond bekend als profeet “van Dan tot Ber-seba toe”; David zei tot Joab: “Trek nu om, door alle stammen van Israël, van Dan tot Ber-seba toe, en tel het volk”; en onder Salomo “Juda en Israël woonden zeker, een iegelijk onder zijn wijnstok en onder zijn vijgeboom, van Dan tot Ber-seba”. Kronieken, geschreven vanuit Juda, keert het om: “van Ber-seba tot Dan toe”."
    - "Dan, vroeger Lais, is Tel Dan in het uiterste noorden van het huidige Israël, ongeveer 25 km van het Hermonpunt op de kaart en 168 km van Jeruzalem; de Danieten namen de stad in de dagen van de richters, en Jerobeam plaatste daar een van zijn gouden kalveren. De poort uit de Midden-Bronstijd en de Aramese stèle met de vermelding van het “huis van David”, in 1993 gevonden, zijn de bekendste vondsten. Berseba, waar Abraham zijn put groef en zijn eed zwoer, is Tel Beër Seva ten oosten van de moderne stad, ongeveer 70 km ten zuidwesten van Jeruzalem, een geplande stad van het koninkrijk Juda met een grote put buiten de poort, in 2005 ingeschreven als Werelderfgoed."
  cs:
    - "Asi 236 km vzdušnou čarou, od pramenů Jordánu na úpatí hory Hermon po okraj pouště Negev. Rčení „od Dan až do Bersabé“ je biblický způsob, jak říci celý Izrael, od severního konce k jižnímu; v tomto pořadí se vyskytuje sedmkrát, od doby soudců po vládu Šalomounovu; Letopisy je dvakrát obracejí."
    - "Kniha soudců praví, že „vyšli všickni synové Izraelští, a shromáždilo se všecko množství jednomyslně od Dan až do Bersabé“; Samuel byl znám jako prorok „od Dan až do Bersabé“; David řekl Joábovi: „Projdi i hned všecka pokolení Izraelská od Dan až k Bersabé, a sečtěte lid“; a za Šalomouna „bydlil Juda a Izrael bezpečně, jeden každý pod svým vinným kmenem a pod svým fíkem, od Dan až do Bersabé“. Letopisy, psané v Judsku, to obracejí: „od Bersabé až do Dan“."
    - "Dan, dříve Lajiš, je Tel Dan na dalekém severu dnešního Izraele, asi 25 km od hermonského bodu na mapě a 168 km od Jeruzaléma; Danité jej dobyli za dnů soudců a Jarobeám tu postavil jedno ze svých zlatých telat. Jeho brána ze střední doby bronzové a aramejská stéla zmiňující „dům Davidův“, nalezená roku 1993, jsou jeho nejznámějšími nálezy. Beer-šeba, kde Abraham vykopal studnu a složil přísahu, je Tel Beer Ševa východně od moderního města, asi 70 km jihozápadně od Jeruzaléma, plánovitě založené město judského království s velkou studnou před branou, zapsané na Seznam světového dědictví roku 2005."
  sv:
    - "Omkring 236 km fågelvägen, från Jordans källor vid foten av Hermon till kanten av Negevöknen. Uttrycket ”från Dan ända till Beer-Seba” är Bibelns sätt att säga hela Israel, från dess norra till dess södra ände; i den ordningen förekommer det sju gånger, från domartiden till Salomos regering; Krönikeböckerna har det två gånger i omvänd ordning."
    - "Domarboken säger att ”drogo alla Israels barn ut, och menigheten församlade sig såsom en man, från Dan ända till Beer-Seba”; Samuel erkändes som profet av ”hela Israel, från Dan ända till Beer-Seba”; David sade till Joav: ”Far igenom alla Israels stammar, från Dan ända till Beer-Seba, och anställen en folkräkning”; och under Salomo ”sutto Juda och Israel i trygghet, var och en under sitt vinträd och sitt fikonträd, ifrån Dan ända till Beer-Seba”. Krönikeböckerna, skrivna i Juda, vänder på det: ”från Beer-Seba ända till Dan”."
    - "Dan, förr Lajish, är Tel Dan i det yttersta norra Israel, omkring 25 km från Hermonpunkten på kartan och 168 km från Jerusalem; daniterna intog det under domartiden, och Jerobeam ställde upp en av sina gyllene kalvar där. Dess port från mellanbronsåldern och den arameiska stelen som nämner ”Davids hus”, funnen 1993, är dess mest kända fynd. Beer Sheva, där Abraham grävde sin brunn och svor sin ed, är Tel Beer Sheva öster om dagens stad, omkring 70 km sydväst om Jerusalem, en planerad stad i kungariket Juda med en stor brunn utanför porten, upptagen på Unescos världsarvslista 2005."
  nb:
    - "Omtrent 236 km i luftlinje, fra Jordans kilder ved foten av Hermon til kanten av Negev-ørkenen. Uttrykket «fra Dan like til Be'erseba» er Bibelens måte å si hele Israel på, fra den nordlige enden til den sørlige; i denne rekkefølgen brukes det sju ganger, fra dommertiden til Salomos regjering; Krønikebøkene har det to ganger i omvendt rekkefølge."
    - "Dommerboken forteller: «Da tok alle Israels barn ut, og hele menigheten, like fra Dan og til Be'erseba og fra Gileads land, samlet sig som én mann»; Samuel var kjent som profet «fra Dan til Be'erseba»; David sa til Joab: «Dra omkring i alle Israels stammer fra Dan like til Be'erseba og mønstre folket»; og om Salomos tid heter det: «Juda og Israel bodde trygt, hver mann under sitt vintre og under sitt fikentre, fra Dan like til Be'erseba». Krønikebøkene, skrevet fra Juda, snur det om: «fra Be'erseba like til Dan»."
    - "Dan, tidligere Lajisj, er Tel Dan helt i nord i dagens Israel, omtrent 25 km fra Hermon-punktet på kartet og 168 km fra Jerusalem; danittene inntok det i dommertiden, og Jeroboam satte opp en av sine gullkalver der. Porten fra mellombronsealderen og den arameiske steinstelen som nevner «Davids hus», funnet i 1993, er de mest kjente funnene. Beer-Sjeba, der Abraham gravde sin brønn og avla sin ed, er Tel Beer Sjeva øst for den moderne byen, omtrent 70 km sørvest for Jerusalem, en planlagt by i kongeriket Juda med en stor brønn utenfor porten, innskrevet på Verdensarvlisten i 2005."
  tl:
    - "Mga 236 km sa tuwid na guhit, mula sa mga bukal ng Jordan sa paanan ng Bundok Hermon hanggang sa gilid ng disyerto ng Negev. Ang pariralang “mula sa Dan hanggang sa Beer-seba” ay ang paraan ng Biblia ng pagsasabi ng buong Israel, mula sa hilagang dulo hanggang sa timog na dulo nito; sa ayos na ito ay pitong ulit itong ginamit, mula sa panahon ng mga hukom hanggang sa paghahari ni Salomon, at dalawang ulit itong binaligtad ng Mga Cronica."
    - "Sinasabi ng Mga Hukom na “lumabas ang lahat ng mga anak ni Israel, at ang kapisanan ay nagpisang gaya ng isang tao … mula sa Dan hanggang sa Beer-seba”; si Samuel ay nakilala bilang propeta “mula sa Dan hanggang sa Beer-seba”; sinabi ni David kay Joab, “Magparoo't parito ka nga sa lahat ng mga lipi ng Israel, mula sa Dan hanggang sa Beer-seba, at bilangin ninyo ang bayan”; at sa ilalim ni Salomon, “ang Juda at ang Israel ay nagsitahang tiwasay, na bawa't tao'y sa ilalim ng kaniyang puno ng ubas at sa ilalim ng kaniyang puno ng igos, mula sa Dan hanggang sa Beer-seba”. Ang Mga Cronica, na isinulat mula sa Juda, ay bumabaligtad nito: “mula sa Beer-seba hanggang sa Dan”."
    - "Ang Dan, na dating Lais, ay ang Tel Dan sa dulong hilaga ng Israel ngayon, mga 25 km mula sa tuldok ng Hermon sa mapa at 168 km mula sa Jerusalem; sinakop ito ng mga Danita sa mga araw ng mga hukom, at nagtayo roon si Jeroboam ng isa sa kaniyang mga gintong guya. Ang pintuang-bayan nito mula sa Gitnang Panahon ng Tanso at ang estelang Arameo na bumabanggit sa “sangbahayan ni David”, na natagpuan noong 1993, ang pinakakilala nitong mga natuklasan. Ang Beer-seba, na pinaghukayan ni Abraham ng kaniyang balon at pinanumpaan niya, ay ang Tel Beer Seva sa silangan ng makabagong lungsod, mga 70 km sa timog-kanluran ng Jerusalem, isang planadong bayan ng kaharian ng Juda na may malaking balon sa labas ng pintuang-bayan nito, na itinala bilang Pook na Pamanang Pandaigdig noong 2005."
  da:
    - "Omkring 236 km i luftlinje, fra Jordans kilder ved foden af Hermon til kanten af Negevørkenen. Vendingen »fra Dan indtil Beersaba« er Bibelens måde at sige hele Israel på, fra dets nordlige til dets sydlige ende, og i denne rækkefølge bruges den syv gange, fra dommertiden til Salomos regeringstid; Krønikebøgerne har den to gange i modsat rækkefølge."
    - "Dommerbogen fortæller: »Da droge alle Israels Børn ud, og Menigheden blev samlet som een Mand, fra Dan indtil Beersaba«; Samuel var kendt som profet »fra Dan og indtil Beersaba«; David sagde til Joab: »Kære, gak omkring i alle Israels Stammer, fra Dan og indtil Beersaba, og tæller Folket«; og under Salomo: »Og Juda og Israel boede tryggelig, hver under sit Vintræ og under sit Figentræ, fra Dan og indtil Beersaba«. Krønikebøgerne, skrevet i Juda, vender det om: »fra Beersaba og indtil Dan«."
    - "Dan, tidligere Laisj, er Tel Dan helt mod nord i nutidens Israel, omkring 25 km fra Hermon-punktet på kortet og 168 km fra Jerusalem; daniterne indtog byen i dommertiden, og Jeroboam opstillede her en af sine gyldne kalve. Dens port fra mellembronzealderen og den arameiske stele, som nævner »Davids hus«, fundet i 1993, er dens mest kendte fund. Beersheba, hvor Abraham gravede sin brønd og aflagde sin ed, er Tel Be'er Sjeva øst for den moderne by, omkring 70 km sydvest for Jerusalem, en planlagt by i kongeriget Juda med en stor brønd uden for porten, optaget på Verdensarvslisten i 2005."
  sr:
    - "Око 236 км ваздушном линијом, од извора Јордана у подножју планине Хермон до ивице пустиње Негев. Израз „од Дана до Вирсавеје“ библијски је начин да се каже цео Израиљ, од његовог северног краја до јужног; тим редоследом јавља се седам пута, од времена судија до Соломуновог краљевања, а у Дневницима двапут обрнутим редом."
    - "У Судијама стоји: „Тада изиђоше сви синови Израиљеви, и сабра се сав народ једнодушно, од Дана до Вирсавеје“; за Самуила се знало да је пророк: „од Дана до Вирсавеје“; Давид је рекао Јоаву: „Прођи по свим племенима Израиљевим од Дана до Вирсавеје, и избројте народ“; а за Соломуна: „И живљаху Јуда и Израиљ без страха, сваки под својом лозом и под својом смоквом, од Дана до Вирсавеје“. Дневници, писани у Јуди, окрећу тај редослед: „од Вирсавеје дори до Дана“."
    - "Дан, раније Лаис, јесте Тел Дан на крајњем северу данашњег Израела, око 25 км од тачке Хермона на карти и 168 км од Јерусалима; Данови потомци заузели су га у време судија, а Јеровоам је ту подигао једно од својих златних телади. Његова капија из средњег бронзаног доба и арамејска стела с поменом „дома Давидовог“, пронађена 1993. године, његови су најпознатији налази. Вирсавеја, где је Аврам ископао бунар и положио заклетву, јесте Тел Бер Шева источно од савременог града, око 70 км југозападно од Јерусалима, планска варош Краљевства Јуда с великим бунаром изван капије, уписана на Листу светске баштине 2005. године."
