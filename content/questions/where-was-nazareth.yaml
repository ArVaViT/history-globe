id: where-was-nazareth
question:
  en: "Where was Nazareth?"
  ru: "Где находился Назарет?"
  uk: "Де був Назарет?"
  es: "¿Dónde estaba Nazaret?"
  pt: "Onde ficava Nazaré?"
  de: "Wo lag Nazareth?"
  fr: "Où se trouvait Nazareth ?"
  pl: "Gdzie leżał Nazaret?"
  it: "Dov’era Nazaret?"
  cs: "Kde ležel Nazaret?"
  nl: "Waar lag Nazareth?"
  sv: "Var låg Nasaret?"
  nb: "Hvor lå Nasaret?"
  tl: "Nasaan ang Nazaret?"
  da: "Hvor lå Nazaret?"
  sr: "Где је био Назарет?"
  hu: "Hol volt Názáret?"
  fi: "Missä Nasaret sijaitsi?"
  vi: "Na-xa-rét ở đâu?"
  ro: "Unde se afla Nazaretul?"
  bg: "Къде се е намирал Назарет?"
answer:
  en:
    - "Nazareth lies in the hills of Lower Galilee, in today's Israel, in a basin ringed by ridges about 24 km west-south-west of Tiberias on the Sea of Galilee and about 103 km north of Jerusalem in a straight line; the town has never moved, and the modern city stands over the village of the Gospels."
    - "The village is not named in the Old Testament, in Josephus or in the early rabbis; the earliest mention outside the Gospels is Julius Africanus, in the early third century, who names Nazara among the villages of the relatives of Jesus, and the first non-Christian one is a fragment of a Hebrew synagogue inscription of about AD 300, found at Caesarea in 1962, listing the priestly courses and the Galilean villages where they settled after the Jewish revolts. Luke writes: “And in the sixth month the angel Gabriel was sent from God unto a city of Galilee, named Nazareth”, and Matthew explains that Joseph “came and dwelt in a city called Nazareth”. Nathanael's question, “Can there any good thing come out of Nazareth?”, shows how little the place was known even in Galilee."
    - "Excavations under the Church of the Annunciation and nearby from the 1950s have found a small Jewish village of the Roman period: rock-cut houses, storage pits, cisterns, wine and olive presses and tombs. Luke says the crowd led Jesus “unto the brow of the hill whereon their city was built”: the village stood on the slopes above the basin, and several brows are shown to visitors. Sepphoris, the capital of Galilee under Herod Antipas, lay a short walk to the north-west, and Capernaum, where Jesus later settled, is about 33 km to the north-east."
  ru:
    - "Назарет лежит среди холмов Нижней Галилеи, в нынешнем Израиле, в котловине, окружённой грядами, примерно в 24 км к западо-юго-западу от Тивериады на Галилейском море и в 103 км к северу от Иерусалима по прямой; город никуда не переносился, и нынешний Назарет стоит над селением Евангелий."
    - "Это селение не названо ни в Ветхом Завете, ни у Иосифа Флавия, ни у ранних раввинов; самое раннее упоминание вне Евангелий — у Юлия Африкана в начале III века, который называет Назару среди селений, где жили родичи Иисуса, а первое нехристианское — обломок еврейской синагогальной надписи около 300 года, найденный в Кесарии в 1962 году, со списком священнических черёд и галилейских селений, где они осели после иудейских восстаний. Лука пишет: «В шестой же месяц послан был Ангел Гавриил от Бога в город Галилейский, называемый Назарет», а Матфей поясняет, что Иосиф, «придя, поселился в городе, называемом Назарет». Вопрос Нафанаила «из Назарета может ли быть что доброе?» показывает, как мало это место знали даже в Галилее."
    - "Раскопки под церковью Благовещения и рядом с ней с 1950-х годов открыли небольшое иудейское селение римского времени: вырубленные в скале жилища, ямы-хранилища, цистерны, давильни для вина и масла, гробницы. Лука говорит, что толпа повела Иисуса «на вершину горы, на которой город их был построен»: селение стояло на склонах над котловиной, и паломникам показывают не один такой обрыв. Сепфорис, столица Галилеи при Ироде Антипе, лежал недалеко к северо-западу, а Капернаум, где Иисус поселился позже, — примерно в 33 км к северо-востоку."
  uk:
    - "Назарет лежить у пагорбах Нижньої Галілеї, нині в Ізраїлі, у котловині, оточеній пасмами, приблизно за 24 км на захід-південний захід від Тіверіади на Галілейському морі і приблизно за 103 км на північ від Єрусалима по прямій; місто ніколи не переміщувалося, і сучасне місто стоїть над селом з Євангелій."
    - "Село не названо у Старому Заповіті, в Йосифа Флавія чи в ранніх рабинів; найраніша згадка поза Євангеліями — у Юлія Африкана на початку III ст., який називає Назару серед сіл родичів Ісуса, а перша нехристиянська — уламок єврейського синагогального напису близько 300 р. н. е., знайденого в Кесарії 1962 р., зі списком священицьких черг і галілейських сіл, де вони оселилися після юдейських повстань. Лука пише: «Місяця ж шестого післав Бог ангела Гавриїла в город Галилейський, званий Назарет», а Матвій пояснює, що Йосип «прийшовши, жив у городї, що його звали Назарет». Питання Натанаїла «З Назарету хиба може що добре бути?» показує, як мало це місце було відоме навіть у Галілеї."
    - "Розкопки під храмом Благовіщення й поблизу від 1950-х рр. виявили невелике юдейське село римської доби: вирубані в скелі будинки, комори, цистерни, винні й оливкові преси та гробниці. Лука каже, що натовп вивів Ісуса «аж на верх гори, на котрій город їх збудовано»: село стояло на схилах над котловиною, і відвідувачам показують кілька верхів. Сепфоріс, столиця Галілеї за Ірода Антипи, лежав недалеко на північний захід, а Капернаум, де Ісус пізніше оселився, — приблизно за 33 км на північний схід."
  es:
    - "Nazaret se halla en las colinas de la Baja Galilea, en el actual Israel, en una cuenca rodeada de crestas, a unos 24 km al oestesudoeste de Tiberíades, a orillas del mar de Galilea, y a unos 103 km al norte de Jerusalén en línea recta; la ciudad nunca se ha movido, y la ciudad moderna se alza sobre la aldea de los Evangelios."
    - "La aldea no se nombra en el Antiguo Testamento, ni en Josefo, ni en los primeros rabinos; la mención más antigua fuera de los Evangelios es la de Julio Africano, a principios del siglo III, que nombra Nazara entre las aldeas de los parientes de Jesús, y la primera no cristiana es un fragmento de una inscripción de sinagoga hebrea de hacia el 300 d. C., hallado en Cesarea en 1962, que enumera los turnos sacerdotales y las aldeas galileas donde se establecieron tras las revueltas judías. Lucas escribe: «Y al sexto mes, el ángel Gabriel fué enviado de Dios á una ciudad de Galilea, llamada Nazaret», y Mateo explica que José «vino, y habitó en la ciudad que se llama Nazaret». La pregunta de Natanael, «¿De Nazaret puede haber algo de bueno?», muestra lo poco conocido que era el lugar incluso en Galilea."
    - "Las excavaciones bajo la basílica de la Anunciación y en sus cercanías desde la década de 1950 han hallado una pequeña aldea judía de época romana: casas excavadas en la roca, silos, cisternas, lagares de vino y de aceite, y tumbas. Lucas dice que la multitud llevó a Jesús «hasta la cumbre del monte sobre el cual la ciudad de ellos estaba edificada»: la aldea estaba en las laderas sobre la cuenca, y a los visitantes se les muestran varios riscos. Séforis, la capital de Galilea bajo Herodes Antipas, quedaba a un corto paseo al noroeste, y Cafarnaúm, donde Jesús se estableció después, está a unos 33 km al noreste."
  pt:
    - "Nazaré fica nas colinas da Baixa Galileia, no atual Israel, numa bacia cercada de cristas, a cerca de 24 km a oés-sudoeste de Tiberíades, no mar da Galileia, e a cerca de 103 km ao norte de Jerusalém em linha reta; a cidade nunca mudou de lugar, e a cidade moderna se ergue sobre a aldeia dos Evangelhos."
    - "A aldeia não é nomeada no Antigo Testamento, em Josefo nem nos primeiros rabinos; a primeira menção fora dos Evangelhos é de Júlio Africano, no início do século III, que nomeia Nazara entre as aldeias dos parentes de Jesus, e a primeira não cristã é um fragmento de uma inscrição de sinagoga em hebraico, de cerca de 300 d.C., encontrado em Cesareia em 1962, que lista as classes sacerdotais e as aldeias galileias onde se estabeleceram depois das revoltas judaicas. Lucas escreve: “Ora, no sexto mês, o anjo Gabriel foi enviado por Deus a uma cidade da Galileia chamada Nazaré”, e Mateus explica que José “foi morar em uma cidade chamada Nazaré”. A pergunta de Natanael, “Pode vir alguma coisa boa de Nazaré?”, mostra quão pouco o lugar era conhecido, mesmo na Galileia."
    - "As escavações sob a Igreja da Anunciação e nas proximidades, desde a década de 1950, encontraram uma pequena aldeia judaica do período romano: casas escavadas na rocha, silos, cisternas, lagares de vinho e de azeite e túmulos. Lucas diz que a multidão levou Jesus “até o topo do monte sobre o qual a cidade deles estava construída”: a aldeia ficava nas encostas acima da bacia, e vários penhascos são mostrados aos visitantes. Séforis, a capital da Galileia sob Herodes Antipas, ficava a uma curta caminhada a noroeste, e Cafarnaum, onde Jesus se estabeleceu mais tarde, fica a cerca de 33 km a nordeste."
  de:
    - "Nazareth liegt im Hügelland Untergaliläas, im heutigen Israel, in einem von Höhenzügen umringten Becken, etwa 24 km westsüdwestlich von Tiberias am See Genezareth und in der Luftlinie etwa 103 km nördlich von Jerusalem; die Stadt ist nie umgezogen, und die moderne Stadt steht über dem Dorf der Evangelien."
    - "Das Dorf wird im Alten Testament, bei Josephus und bei den frühen Rabbinen nicht genannt; die früheste Erwähnung außerhalb der Evangelien stammt von Julius Africanus, Anfang des 3. Jahrhunderts, der Nazara unter den Dörfern der Verwandten Jesu nennt, und die erste nichtchristliche ist ein Fragment einer hebräischen Synagogeninschrift von etwa 300 n. Chr., 1962 in Caesarea gefunden, die die Priesterordnungen und die galiläischen Dörfer aufführt, in denen sie sich nach den jüdischen Aufständen niederließen. Lukas schreibt: „Und im sechsten Monat ward der Engel Gabriel gesandt von Gott in eine Stadt in Galiläa, die heißt Nazareth“, und Matthäus erklärt, Josef „kam und wohnte in der Stadt, die da heißt Nazareth“. Nathanaels Frage „Was kann von Nazareth Gutes kommen?“ zeigt, wie wenig der Ort selbst in Galiläa bekannt war."
    - "Grabungen unter der Verkündigungsbasilika und in ihrer Nähe seit den 1950er-Jahren haben ein kleines jüdisches Dorf der römischen Zeit gefunden: Felshäuser, Vorratsgruben, Zisternen, Wein- und Ölpressen und Gräber. Lukas sagt, die Menge führte Jesus „auf einen Hügel des Berges, darauf ihre Stadt gebaut war“: Das Dorf lag an den Hängen über dem Becken, und Besuchern werden mehrere Hügelkanten gezeigt. Sepphoris, die Hauptstadt Galiläas unter Herodes Antipas, lag einen kurzen Fußweg nordwestlich, und Kapernaum, wo Jesus sich später niederließ, ist etwa 33 km nordöstlich."
  fr:
    - "Nazareth se trouve dans les collines de la Basse Galilée, dans l’Israël actuel, dans une cuvette cernée de crêtes, à environ 24 km à l’ouest-sud-ouest de Tibériade, sur la mer de Galilée, et à environ 103 km au nord de Jérusalem à vol d’oiseau ; la ville n’a jamais bougé, et la cité moderne s’élève sur le village des Évangiles."
    - "Le village n’est nommé ni dans l’Ancien Testament, ni chez Flavius Josèphe, ni chez les premiers rabbins ; la plus ancienne mention hors des Évangiles est celle de Jules l’Africain, au début du IIIe siècle, qui cite Nazara parmi les villages des parents de Jésus, et la première mention non chrétienne est un fragment d’inscription de synagogue en hébreu, d’environ 300 apr. J.-C., trouvé à Césarée en 1962, qui énumère les classes sacerdotales et les villages de Galilée où elles s’installèrent après les révoltes juives. Luc écrit : « Au sixième mois, l’ange Gabriel fut envoyé par Dieu dans une ville de Galilée, appelée Nazareth », et Matthieu explique que Joseph « vint demeurer dans une ville appelée Nazareth ». La question de Nathanaël, « Peut-il venir de Nazareth quelque chose de bon ? », montre combien le lieu était peu connu, même en Galilée."
    - "Les fouilles menées depuis les années 1950 sous la basilique de l’Annonciation et à proximité ont mis au jour un petit village juif de l’époque romaine : maisons creusées dans le roc, fosses de stockage, citernes, pressoirs à vin et à huile, et tombes. Luc dit que la foule mena Jésus « jusqu’au sommet de la montagne sur laquelle leur ville était bâtie » : le village s’étendait sur les pentes au-dessus de la cuvette, et l’on montre aux visiteurs plusieurs escarpements. Sepphoris, la capitale de la Galilée sous Hérode Antipas, était à courte distance de marche au nord-ouest, et Capernaüm, où Jésus s’établit plus tard, est à environ 33 km au nord-est."
  pl:
    - "Nazaret leży we wzgórzach Dolnej Galilei, w dzisiejszym Izraelu, w kotlinie otoczonej grzbietami, około 24 km na zachód-południowy zachód od Tyberiady nad Jeziorem Galilejskim i około 103 km na północ od Jerozolimy w linii prostej; miasto nigdy się nie przeniosło, a współczesne miasto stoi nad wsią z Ewangelii."
    - "Wieś nie jest wymieniona w Starym Testamencie, u Józefa Flawiusza ani u dawnych rabinów; najwcześniejsza wzmianka poza Ewangeliami pochodzi od Juliusza Afrykana z początku III wieku, który wymienia Nazarę wśród wsi krewnych Jezusa, a pierwszą niechrześcijańską jest fragment hebrajskiego napisu synagogalnego z około 300 n.e., znalezionego w Cezarei w 1962 roku, wymieniającego zmiany kapłańskie i galilejskie wsie, w których osiedliły się po powstaniach żydowskich. Łukasz pisze: „A w miesiącu szóstym posłany jest Anioł Gabryjel od Boga do miasta Galilejskiego, które zwano Nazaret”, a Mateusz wyjaśnia, że Józef „przyszedłszy mieszkał w mieście, które zowią Nazaret”. Pytanie Natanaela: „Możesz z Nazaretu być co dobrego?”, pokazuje, jak mało to miejsce było znane nawet w Galilei."
    - "Wykopaliska pod Bazyliką Zwiastowania i w jej pobliżu od lat 50. XX wieku odsłoniły małą żydowską wieś z okresu rzymskiego: domy wykute w skale, doły magazynowe, cysterny, tłocznie wina i oliwy oraz groby. Łukasz mówi, że tłum wyprowadził Jezusa „na wierzch góry, na której miasto ich zbudowane było”: wieś stała na stokach nad kotliną, a zwiedzającym pokazuje się kilka krawędzi. Seforis, stolica Galilei za Heroda Antypasa, leżało w krótkiej odległości pieszo na północny zachód, a Kafarnaum, gdzie Jezus później osiadł, jest oddalone o około 33 km na północny wschód."
  it:
    - "Nazaret si trova sulle colline della Bassa Galilea, nell’odierno Israele, in una conca circondata da crinali a circa 24 km a ovest-sud-ovest di Tiberiade sul Lago di Tiberiade e a circa 103 km a nord di Gerusalemme in linea d’aria; la città non si è mai spostata, e la città moderna sorge sopra il villaggio dei Vangeli."
    - "Il villaggio non è nominato nell’Antico Testamento, in Giuseppe Flavio né nei primi rabbini; la più antica menzione fuori dai Vangeli è di Giulio Africano, all’inizio del III secolo, che nomina Nazara tra i villaggi dei parenti di Gesù, e la prima non cristiana è un frammento di un’iscrizione sinagogale ebraica del 300 d.C. circa, trovata a Cesarea nel 1962, che elenca le classi sacerdotali e i villaggi galilei in cui si stabilirono dopo le rivolte giudaiche. Luca scrive: «Al sesto mese l’angelo Gabriele fu mandato da Dio in una città di Galilea detta Nazaret», e Matteo spiega che Giuseppe «venne ad abitare in una città detta Nazaret». La domanda di Natanaele, «Può forse venir qualcosa di buono da Nazaret?», mostra quanto poco il luogo fosse conosciuto anche in Galilea."
    - "Gli scavi sotto la Chiesa dell’Annunciazione e nei dintorni, dagli anni 1950, hanno trovato un piccolo villaggio ebraico di età romana: case scavate nella roccia, fosse di deposito, cisterne, frantoi per vino e olio e tombe. Luca dice che la folla condusse Gesù: «lo menarono fin sul ciglio del monte sul quale era fabbricata la loro città»: il villaggio sorgeva sui pendii sopra la conca, e ai visitatori si mostra più di un ciglio. Sefforis, la capitale della Galilea sotto Erode Antipa, si trovava a breve distanza a nord-ovest, e Cafarnao, dove Gesù si stabilì più tardi, è a circa 33 km a nord-est."
  cs:
    - "Nazaret leží v pahorcích Dolní Galileje, v dnešním Izraeli, v pánvi obklopené hřebeny asi 24 km západojihozápadně od Tiberiady na Galilejském jezeře a vzdušnou čarou asi 103 km severně od Jeruzaléma; město se nikdy nepřesunulo a moderní město stojí nad vesnicí evangelií."
    - "Vesnice není jmenována ve Starém zákoně, u Josepha ani u raných rabínů; nejstarší zmínka mimo evangelia je u Julia Africana na počátku 3. století, který jmenuje Nazaru mezi vesnicemi příbuzných Ježíšových, a první nekřesťanská je úlomek hebrejského synagogálního nápisu z doby kolem roku 300 n. l., nalezený v Cesareji roku 1962, který uvádí kněžské oddíly a galilejské vesnice, kde se po židovských povstáních usadily. Lukáš píše: „V měsíci pak šestém poslán jest anděl Gabriel od Boha do města Galilejského, kterémuž jméno Nazarét“, a Matouš vysvětluje, že Josef „přišed, bydlil v městě, jenž slove Nazarét“. Natanaelova otázka, „A může z Nazaréta co dobrého býti?“, ukazuje, jak málo bylo místo známo i v Galileji."
    - "Vykopávky pod kostelem Zvěstování a v jeho okolí od 50. let nalezly malou židovskou vesnici z římské doby: domy vytesané do skály, zásobní jámy, cisterny, lisy na víno a olej a hroby. Lukáš říká, že zástup vedl Ježíše „až na vrch hory, na nížto město jejich bylo vzděláno“: vesnice stála na svazích nad pánví a návštěvníkům se ukazuje několik vrchů. Sefóris, hlavní město Galileje za Heroda Antipy, ležel kousek cesty na severozápad a Kafarnaum, kde se Ježíš později usadil, je asi 33 km na severovýchod."
  nl:
    - "Nazareth ligt in de heuvels van Neder-Galilea, in het huidige Israël, in een bekken omringd door heuvelruggen, ongeveer 24 km west-zuidwestelijk van Tiberias aan het Meer van Galilea en hemelsbreed ongeveer 103 km ten noorden van Jeruzalem; de stad is nooit verplaatst, en de moderne stad ligt over het dorp van de evangeliën."
    - "Het dorp wordt niet genoemd in het Oude Testament, bij Josephus of bij de vroege rabbijnen; de vroegste vermelding buiten de evangeliën is die van Julius Africanus, in het begin van de derde eeuw, die Nazara noemt onder de dorpen van de verwanten van Jezus, en de eerste niet-christelijke is een fragment van een Hebreeuws synagogeopschrift van omstreeks 300 n.Chr., in 1962 gevonden bij Caesarea, met de priesterafdelingen en de Galilese dorpen waar zij zich na de joodse opstanden vestigden. Lukas schrijft: “in de zesde maand werd de engel Gabriel van God gezonden naar een stad in Galilea, genaamd Nazareth”, en Mattheüs vertelt van Jozef: “En daar gekomen zijnde, nam hij zijn woonplaats in de stad, genaamd Nazareth”. De vraag van Natanaël, “Kan uit Nazareth iets goeds zijn?”, toont hoe weinig de plaats zelfs in Galilea bekend was."
    - "Opgravingen onder de Annunciatiekerk en in de buurt vanaf de jaren vijftig hebben een klein joods dorp uit de Romeinse tijd gevonden: in de rots uitgehouwen huizen, voorraadputten, cisternes, wijn- en olijfpersen en graven. Lukas zegt dat de menigte Jezus leidde “op den top des bergs, op denwelken hun stad gebouwd was”: het dorp lag op de hellingen boven het bekken, en verschillende toppen worden aan bezoekers getoond. Sefforis, de hoofdstad van Galilea onder Herodes Antipas, lag een korte wandeling naar het noordwesten, en Kafarnaüm, waar Jezus zich later vestigde, ligt ongeveer 33 km naar het noordoosten."
  sv:
    - "Nasaret ligger i Nedre Galileens berg, i dagens Israel, i ett bäcken omgivet av åsar omkring 24 km väst-sydväst om Tiberias vid Galileiska sjön och omkring 103 km norr om Jerusalem i fågelvägen; staden har aldrig flyttats, och den moderna staden står över evangeliernas by."
    - "Byn nämns inte i Gamla testamentet, hos Josefus eller hos de tidiga rabbinerna; det äldsta omnämnandet utanför evangelierna är Julius Africanus, i början av 200-talet, som nämner Nazara bland byarna hos Jesu släktingar, och det första icke-kristna är ett fragment av en hebreisk synagogainskription från omkring år 300 e.Kr., funnet i Caesarea 1962, som förtecknar prästavdelningarna och de galileiska byar där de bosatte sig efter de judiska upproren. Lukas skriver: ”I sjätte månaden blev ängeln Gabriel sänd av Gud till en stad i Galileen som hette Nasaret”, och Matteus förklarar att när Josef hade kommit dit, ”bosatte han sig i en stad som hette Nasaret”. Natanaels fråga, ”Kan något gott komma från Nasaret?”, visar hur litet platsen var känd även i Galileen."
    - "Utgrävningar under Bebådelsekyrkan och i närheten sedan 1950-talet har funnit en liten judisk by från romersk tid: uthuggna hus, lagringsgropar, cisterner, vin- och oljepressar och gravar. Lukas säger att folket förde Jesus ”ända fram till branten av det berg som deras stad var byggd på”: byn låg på sluttningarna ovanför bäckenet, och flera branter visas för besökare. Sepforis, Galileens huvudstad under Herodes Antipas, låg en kort promenad åt nordväst, och Kafarnaum, där Jesus senare bosatte sig, ligger omkring 33 km åt nordost."
  nb:
    - "Nasaret ligger i åsene i Nedre Galilea, i dagens Israel, i en dal omkranset av åsrygger omtrent 24 km vest-sørvest for Tiberias ved Galileasjøen og omtrent 103 km nord for Jerusalem i luftlinje; byen har aldri flyttet seg, og den moderne byen står over evangeliets landsby."
    - "Landsbyen er ikke nevnt i Det gamle testamentet, hos Josefus eller hos de tidlige rabbinerne; den tidligste omtalen utenfor evangeliene er Julius Africanus, tidlig på 200-tallet, som nevner Nazara blant landsbyene til Jesu slektninger, og den første ikke-kristne er et fragment av en hebraisk synagogeinnskrift fra omkring 300 e.Kr., funnet i Cæsarea i 1962, som oppregner prestenes tjenesteavdelinger og de galileiske landsbyene der de bosatte seg etter de jødiske opprørene. Lukas skriver: «Men i den sjette måned blev engelen Gabriel sendt fra Gud til en by i Galilea som heter Nasaret», og Matteus forklarer at Josef «kom og tok bolig i en by som heter Nasaret». Natanaels spørsmål, «Kan det komme noget godt fra Nasaret?», viser hvor lite stedet var kjent selv i Galilea."
    - "Utgravninger under Bebudelseskirken og i nærheten siden 1950-årene har funnet en liten jødisk landsby fra romersk tid: hus hugget i fjell, lagergroper, sisterner, vin- og olivenpresser og graver. Lukas sier at folket førte Jesus «ut på brynet av det fjell som deres by var bygget på»: landsbyen lå i skråningene over dalen, og flere bryn vises for besøkende. Sepforis, Galileas hovedstad under Herodes Antipas, lå en kort gange mot nordvest, og Kapernaum, der Jesus senere slo seg ned, ligger omtrent 33 km mot nordøst."
  tl:
    - "Ang Nazaret ay nasa mga burol ng Mababang Galilea, sa kasalukuyang Israel, sa isang palanggana na napapalibutan ng mga tagaytay, mga 24 km sa kanluran-timog-kanluran ng Tiberias sa Dagat ng Galilea at mga 103 km sa hilaga ng Jerusalem sa tuwid na guhit; hindi kailanman lumipat ang bayan, at ang makabagong lungsod ay nakatayo sa ibabaw ng nayon ng mga Ebanghelyo."
    - "Wala ang nayon sa Matandang Tipan, kay Josephus o sa mga rabbi; ang pinakamaagang banggit sa labas ng mga Ebanghelyo ay kay Julio Africano sa simula ng ika-3 siglo, na naglista ng Nazara sa mga nayon ng mga kamag-anak ni Jesus, at ang una na hindi Kristiyano ay isang piraso ng inskripsiyon ng sinagogang Hebreo noong mga 300 AD, na natagpuan sa Cesarea noong 1962 at naglilista ng mga pangkat ng saserdote at ng mga nayon sa Galilea na tinirhan nila pagkatapos ng mga paghihimagsik ng Judio. Ayon kay Lucas: “Nang ikaanim na buwan nga'y sinugo ng Dios ang anghel Gabriel sa isang bayan ng Galilea, ngala'y Nazaret”, at ayon kay Mateo, si Jose ay “dumating at tumahan sa isang bayang tinatawag na Nazaret”. Ipinakikita ng tanong ni Natanael, “Mangyayari bagang lumitaw ang anomang magaling na bagay sa Nazaret?”, kung gaano kaunti ang kilala sa lugar, kahit sa Galilea."
    - "Ang mga paghuhukay sa ilalim ng Simbahan ng Pagpapahayag at sa paligid nito mula noong dekada 1950 ay nakatuklas ng isang maliit na nayong Judio ng panahong Romano: mga bahay na tinabas sa bato, mga hukay na imbakan, mga imbakan ng tubig, pigaan ng alak at langis ng oliba at mga libingan. Sinasabi ni Lucas na dinala ng karamihan si Jesus “hanggang sa ibabaw ng taluktok ng gulod na kinatatayuan ng kanilang bayan”: ang nayon ay nakatayo sa mga dalisdis sa itaas ng palanggana, at ilang taluktok ang ipinakikita sa mga bisita. Ang Sepphoris, ang kabisera ng Galilea sa ilalim ni Herodes Antipas, ay isang maikling lakad sa hilagang-kanluran, at ang Capernaum, kung saan nanirahan si Jesus kalaunan, ay mga 33 km sa hilagang-silangan."
  da:
    - "Nazaret ligger i Nedre Galilæas bjerge, i nutidens Israel, i et bassin omkranset af højdedrag ca. 24 km vest-sydvest for Tiberias ved Genesaret Sø og ca. 103 km nord for Jerusalem i fugleflugt; byen har aldrig flyttet sig, og den moderne by står over evangeliernes landsby."
    - "Landsbyen nævnes ikke i Det Gamle Testamente, hos Josefus eller hos de tidlige rabbinere; den tidligste omtale uden for evangelierne er Julius Africanus i begyndelsen af 200-tallet, der nævner Nazara blandt Jesu slægtninges landsbyer, og den første ikke-kristne er et brudstykke af en hebraisk synagogeindskrift fra ca. 300 e.Kr., fundet i Cæsarea i 1962, med en liste over præsteafdelingerne og de galilæiske landsbyer, hvor de bosatte sig efter de jødiske oprør. Lukas skriver: »Men i den sjette Maaned blev Engelen Gabriel sendt fra Gud til en By i Galilæa, som hedder Nazareth«, og Mattæus forklarer, at Josef »kom og tog Bolig i en By, som kaldes Nazareth«. Natanaels spørgsmål, »Kan noget godt være fra Nazareth?«, viser, hvor lidt stedet var kendt, selv i Galilæa."
    - "Udgravninger under Bebudelseskirken og i nærheden siden 1950’erne har fundet en lille jødisk landsby fra romertiden: klippehuggede huse, lagergruber, cisterner, vin- og olivenpresser og grave. Lukas siger, at skaren førte Jesus »hen til Skrænten af det Bjerg, paa hvilket deres By var bygget«: Landsbyen lå på skråningerne over bassinet, og flere skrænter vises for besøgende. Sepforis, Galilæas hovedstad under Herodes Antipas, lå en kort gåtur mod nordvest, og Kapernaum, hvor Jesus senere bosatte sig, ligger ca. 33 km mod nordøst."
  sr:
    - "Назарет лежи у брдима Доње Галилеје, у данашњем Израелу, у котлини опасаној гребенима око 24 км западно-југозападно од Тиверијаде на Галилејском мору и око 103 км северно од Јерусалима ваздушном линијом; град се никад није померао, а савремени град стоји над селом из јеванђеља."
    - "Село се не помиње у Старом завету, код Јосифа Флавија ни код раних рабина; најранији помен ван јеванђеља је код Јулија Африкана, почетком трећег века, који наводи Назару међу селима Исусове родбине, а први нехришћански је одломак хебрејског натписа из синагоге из око 300. н. е., пронађен у Цезареји 1962, који набраја свештеничке редове и галилејска села где су се настанили после јеврејских устанака. Лука пише: „А у шести месец посла Бог анђела Гаврила у град галилејски по имену Назарет“, а Матеј објашњава да се Јосиф, „дошавши онамо, намести се у граду који се зове Назарет“. Натанаилово питање, „Из Назарета може ли бити шта добро?“, показује колико је то место било мало познато чак и у Галилеји."
    - "Ископавања испод цркве Благовести и у близини од 1950-их открила су мало јеврејско село из римског доба: куће исечене у стени, јаме за залихе, цистерне, пресе за вино и маслине и гробове. Лука каже да је мноштво одвело Исуса „наврх горе где беше њихов град сазидан“: село је стајало на падинама изнад котлине, а посетиоцима се показује неколико гребена. Сефорис, престоница Галилеје под Иродом Антипом, лежао је на кратком ходу северозападно, а Капернаум, где се Исус касније настанио, удаљен је око 33 км североисточно."
  hu:
    - "Názáret Alsó-Galilea dombjai között fekszik, a mai Izraelben, gerincek övezte medencében, a Galileai-tenger menti Tiberiastól mintegy 24 km-re nyugat-délnyugatra és Jeruzsálemtől légvonalban mintegy 103 km-re északra; a város sosem költözött, és a mai város az evangéliumok faluja fölött áll."
    - "A falut nem nevezi meg az Ószövetség, sem Josephus, sem a korai rabbik; a legkorábbi említés az evangéliumokon kívül Július Africanusé a 3. század elején, aki Nazarát Jézus rokonainak falvai közt nevezi meg, az első nem keresztény pedig egy Kr. u. 300 körüli héber zsinagógai felirat töredéke, amelyet 1962-ben találtak Cézáreában, és amely a papi osztályokat és a galileai falvakat sorolja fel, ahol a zsidó felkelések után letelepedtek. Lukács ezt írja: „A hatodik hónapban pedig elküldeték Gábriel angyal Istentől Galileának városába, a melynek neve Názáret”, Máté pedig megmagyarázza, hogy József „oda jutván, lakozék Názáret nevű városban”. Natánael kérdése, „Názáretből támadhat-é valami jó?”, mutatja, mily keveset ismerték a helyet még Galileában is."
    - "Az Angyali üdvözlet temploma alatt és közelében az 1950-es évektől végzett ásatások egy kis római kori zsidó falut tártak fel: sziklába vájt házak, tárológödrök, ciszternák, bor- és olajprések és sírok. Lukács szerint a tömeg Jézust „annak a hegynek szélére, a melyen az ő városuk épült” vitte: a falu a medence fölötti lejtőkön állt, és a látogatóknak több peremet is mutatnak. Szepphórisz, Galilea fővárosa Heródes Antipász alatt, rövid sétára északnyugatra feküdt, Kapernaum, ahová Jézus később letelepedett, pedig mintegy 33 km-re északkeletre van."
  fi:
    - "Nasaret sijaitsee Ala-Galilean kukkuloilla nykyisessä Israelissa, harjanteiden ympäröimässä altaassa noin 24 km Tiberiaasta länsi-lounaaseen Galileanjärven rannalla ja linnuntietä noin 103 km Jerusalemista pohjoiseen; kaupunki ei ole koskaan siirtynyt, ja nykyaikainen kaupunki on evankeliumien kylän päällä."
    - "Kylää ei mainita Vanhassa testamentissa, Josefuksella eikä varhaisilla rabbeilla; varhaisin maininta evankeliumien ulkopuolella on Julius Africanus 200-luvun alussa, joka nimeää Nasaran Jeesuksen sukulaisten kylien joukossa, ja ensimmäinen ei-kristillinen on noin vuoden 300 jaa. heprealaisen synagogakirjoituksen katkelma, joka löytyi Kesareasta vuonna 1962 ja luettelee pappisvuorot ja galilealaiset kylät, joihin ne asettuivat juutalaisten kapinoiden jälkeen. Luukas kirjoittaa: ”Kuudentena kuukautena sen jälkeen Jumala lähetti enkeli Gabrielin Galilean kaupunkiin, jonka nimi on Nasaret”, ja Matteus selittää, että Joosef ”asettui asumaan kaupunkiin, jonka nimi on Nasaret”. Natanaelin kysymys ”Voiko Nasaretista tulla mitään hyvää?” osoittaa, kuinka vähän paikkaa tunnettiin edes Galileassa."
    - "Ilmestyksen kirkon alla ja sen lähellä 1950-luvulta tehdyt kaivaukset ovat paljastaneet pienen roomalaisen ajan juutalaiskylän: kallioon hakattuja taloja, varastokuoppia, vesisäiliöitä, viini- ja öljypuristimia sekä hautoja. Luukkaan mukaan joukko vei Jeesuksen ”sen vuoren jyrkänteelle asti, jolle heidän kaupunkinsa oli rakennettu”: kylä sijaitsi altaan yläpuolisilla rinteillä, ja vierailijoille näytetään useita jyrkänteitä. Sepphoris, Galilean pääkaupunki Herodes Antipaan aikana, oli lyhyen kävelymatkan päässä luoteeseen, ja Kapernaum, johon Jeesus myöhemmin asettui, on noin 33 km koilliseen."
  vi:
    - "Na-xa-rét nằm trong vùng đồi Hạ Ga-li-lê, thuộc Israel ngày nay, trong một lòng chảo có các dãy núi bao quanh, cách Ti-bê-ri-át trên Biển Ga-li-lê khoảng 24 km về phía tây tây nam và cách Giê-ru-sa-lem khoảng 103 km về phía bắc theo đường thẳng; thị trấn chưa bao giờ dời chỗ, và thành phố hiện đại nằm trên ngôi làng của các sách Phúc Âm."
    - "Ngôi làng không được nêu tên trong Cựu Ước, trong Josephus hay trong các ra-bi thời đầu; lần nhắc đến sớm nhất ngoài các sách Phúc Âm là của Julius Africanus, đầu thế kỷ 3, người nêu Nazara trong số các làng của bà con Giê-su, và lần nhắc đến đầu tiên không phải của người Cơ Đốc là một mảnh bản khắc nhà hội Hê-bơ-rơ khoảng năm 300, tìm thấy tại Sê-sa-rê năm 1962, liệt kê các phiên trực của thầy tế lễ và những làng Ga-li-lê nơi họ định cư sau các cuộc nổi dậy của người Do Thái. Lu-ca viết: “Đến tháng thứ sáu, Đức Chúa Trời sai thiên sứ Gáp-ri-ên đến thành Na-xa-rét, xứ Ga-li-lê”, và Ma-thi-ơ giải thích rằng Giô-sép đến “ở trong một thành kia tên là Na-xa-rét”. Câu hỏi của Na-tha-na-ên, “Há có vật gì tốt ra từ Na-xa-rét được sao?”, cho thấy nơi này ít được biết đến thế nào, ngay cả ở Ga-li-lê."
    - "Các cuộc khai quật dưới Nhà thờ Truyền Tin và gần đó từ thập niên 1950 đã tìm thấy một làng Do Thái nhỏ thời La Mã: nhà đục trong đá, hố chứa, bể nước, máy ép rượu và dầu ô-liu, cùng các ngôi mộ. Lu-ca nói đám đông đưa Giê-su “lên đến chót núi, là nơi họ xây thành ở trên”: ngôi làng nằm trên các sườn phía trên lòng chảo, và có vài chót núi được chỉ cho du khách. Sepphoris, kinh đô Ga-li-lê dưới thời Hê-rốt An-ti-ba, cách một quãng đi bộ ngắn về phía tây bắc, và Ca-bê-na-um, nơi Giê-su về sau định cư, cách khoảng 33 km về phía đông bắc."
  ro:
    - "Nazaretul se află în dealurile Galileii de Jos, în Israelul de azi, într-un bazin înconjurat de creste, la circa 24 km vest-sud-vest de Tiberiada, pe Marea Galileii, și la circa 103 km nord de Ierusalim în linie dreaptă; orașul nu s-a mutat niciodată, iar orașul modern se află peste satul Evangheliilor."
    - "Satul nu este numit în Vechiul Testament, la Iosif Flaviu sau la primii rabini; cea mai veche menționare din afara Evangheliilor este la Iulius Africanus, la începutul secolului al III-lea, care numește Nazara printre satele rudelor lui Isus, iar prima necreștină este un fragment de inscripție de sinagogă ebraică din jurul anului 300 d.Hr., găsit la Cezareea în 1962, care enumeră rândurile preoțești și satele galileene în care s-au stabilit după răscoalele iudaice. Luca scrie: „Iar în luna a șasea, trimis au fost îngerul Gavriil dela Dumnezeu în cetatea Galileei, cărei numele erà Nazaret”, iar Matei explică că Iosif, „venind a locuit în cetatea ce se numește Nazaret”. Întrebarea lui Natanael, „din Nazaret poate fi cevà bun?”, arată cât de puțin era cunoscut locul chiar și în Galileea."
    - "Săpăturile de sub Biserica Bunei Vestiri și din apropiere, începute în anii 1950, au găsit un mic sat iudaic din epoca romană: case tăiate în stâncă, gropi de provizii, cisterne, teascuri de vin și de ulei și morminte. Luca spune că mulțimea l-a dus pe Isus „până în sprânceana muntelui pre care erà zidită cetatea lor”: satul se afla pe pantele de deasupra bazinului, iar vizitatorilor li se arată mai multe culmi. Sepforis, capitala Galileii sub Irod Antipa, se afla la o scurtă plimbare spre nord-vest, iar Capernaumul, unde s-a stabilit mai târziu Isus, se află la circa 33 km spre nord-est."
  bg:
    - "Назарет лежи в хълмовете на Долна Галилея, в днешен Израел, в котловина, обградена от хребети, на около 24 км запад-югозападно от Тивериада на Галилейско езеро и на около 103 км северно от Йерусалим по права линия; градът никога не се е премествал и съвременният град стои над селото от Евангелията."
    - "Селото не е назовано в Стария завет, у Йосиф Флавий или у ранните равини; най-ранното споменаване извън Евангелията е у Юлий Африкан в началото на III в., който назовава Назара сред селата на роднините на Исус, а първото нехристиянско е фрагмент от еврейски синагогален надпис от около 300 г. н.е., намерен в Кесария през 1962 г., който изброява свещеническите череди и галилейските села, където те се заселили след юдейските въстания. Лука пише: „А в шестият месец проводен бе ангел Гавриил от Бога в град Галилейски, на който името е Назарет“, а Матей обяснява, че Йосиф „се засели в един град нарицаем Назарет“. Въпросът на Натанаил „От Назарет може ли да произлезе нещо добро?“ показва колко малко е било известно мястото дори в Галилея."
    - "Разкопките под храма „Благовещение“ и около него от 50-те години на XX в. откриха малко юдейско село от римската епоха: изсечени в скалата жилища, ями за съхранение, цистерни, винарски и маслобойни преси и гробници. Лука казва, че множеството заведе Исус „при краят на ръта на който градът им беше съграден“: селото стоеше по склоновете над котловината и на посетителите показват няколко такива ръба. Сепфорис, столицата на Галилея при Ирод Антипа, беше на кратко разстояние пеша на северозапад, а Капернаум, където Исус по-късно се засели, е на около 33 км на североизток."
