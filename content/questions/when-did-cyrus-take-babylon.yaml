# Draft question (the night of the capture and its date; "when-did-the-jews-return-from-babylon" takes the edict and the return).
id: when-did-cyrus-take-babylon
question:
  en: "When did Cyrus take Babylon?"
  ru: "Когда Кир взял Вавилон?"
  uk: "Коли Кір узяв Вавилон?"
  es: "¿Cuándo tomó Ciro Babilonia?"
  pt: "Quando Ciro tomou Babilônia?"
  de: "Wann nahm Kyrus Babylon ein?"
  fr: "Quand Cyrus a-t-il pris Babylone ?"
answer:
  en:
    - "On 12 October 539 BC, by the Babylonian chronicle's own dating: on the sixteenth day of the month Tishri Ugbaru, governor of Gutium, and the army of Cyrus entered Babylon without a battle, and Cyrus himself came into the city seventeen days later, on 29 October. The map stands at Babylon in 539 BC. Babylon lies about 870 km east of Jerusalem in a straight line."
    - "Daniel sets the fall in a single night. Belshazzar “made a great feast to a thousand of his lords”, drank from the vessels of the Temple, and saw the hand write on the wall: “PERES; Thy kingdom is divided, and given to the Medes and Persians.” “In that night was Belshazzar the king of the Chaldeans slain. And Darius the Median took the kingdom.” The cuneiform records bear out the frame: Belshazzar was the son of Nabonidus, the last king, who left him in charge of Babylon for the ten years he spent at Tema in Arabia, which is why Belshazzar could offer Daniel only the third place in the kingdom; Herodotus and Xenophon did not know his name. “Darius the Median”, who is in no other record, is taken by some for Gubaru the governor, by others for Cyrus himself under another name, and by many critics for a confusion with the later Darius I; the question is open."
    - "The Nabonidus Chronicle says that Cyrus beat the Babylonians at Opis on the Tigris, took Sippar without fighting on the fourteenth of Tishri, that Nabonidus fled, and that two days later Ugbaru's troops entered Babylon; Nabonidus was captured on his return, and the Cyrus Cylinder claims that Marduk himself let the king in without battle. Herodotus and Xenophon add that the Persians came in along the bed of the diverted Euphrates during a festival, a story many doubt. Isaiah had named Cyrus as the Lord's “shepherd” and “his anointed” who would be given “the treasures of darkness” and before whom the Lord would “break in pieces the gates of brass”; Jeremiah foretold that “the LORD hath raised up the spirit of the kings of the Medes” against Babylon. Cyrus's first year as king of Babylon began in the spring of 538 BC: that is the “first year of Cyrus” of Ezra's decree freeing the exiles."
  ru:
    - "12 октября 539 г. до н. э. по датировке самой вавилонской хроники: в шестнадцатый день месяца тишри Угбару, правитель Гутиума, и войско Кира вошли в Вавилон без боя, а сам Кир вступил в город семнадцать дней спустя, 29 октября. Карта стоит на Вавилоне в 539 г. до н. э. Вавилон лежит примерно в 870 км к востоку от Иерусалима по прямой."
    - "Даниил вмещает падение в одну ночь. Валтасар «сделал большое пиршество для тысячи вельмож своих», пил из сосудов Храма и увидел, как рука пишет на стене: «Перес — разделено царство твое и дано Мидянам и Персам». «В ту же самую ночь Валтасар, царь Халдейский, был убит, и Дарий Мидянин принял царство». Клинописные записи подтверждают рамку рассказа: Валтасар был сыном Набонида, последнего царя, который оставил его править Вавилоном на те десять лет, что сам провёл в аравийской Феме, — потому Валтасар и мог предложить Даниилу лишь третье место в царстве; Геродот и Ксенофонт его имени не знали. «Дария Мидянина», которого нет ни в одной другой записи, одни отождествляют с наместником Губару, другие — с самим Киром под другим именем, а многие критики считают путаницей с позднейшим Дарием I; вопрос открыт."
    - "Хроника Набонида сообщает, что Кир разбил вавилонское войско при Описе на Тигре, четырнадцатого тишри взял Сиппар без боя, что Набонид бежал и что через два дня войска Угбару вошли в Вавилон; Набонида схватили, когда он вернулся в город, а Цилиндр Кира утверждает, что сам Мардук впустил царя без сражения. Геродот и Ксенофонт добавляют, что персы вошли по руслу отведённого Евфрата во время праздника, — многие в этом сомневаются. Исаия назвал Кира «пастырем» Господа и «помазанником», которому отдадут «хранимые во тьме сокровища» и которому Господь обещал: «медные двери сокрушу и запоры железные сломаю»; Иеремия предрёк, что «Господь возбудил дух царей Мидийских» против Вавилона. Первый год царствования Кира как царя Вавилона начался весной 538 г. до н. э., и это тот самый «первый год Кира» из указа в книге Ездры, отпустившего переселенцев домой."
  uk:
    - "12 жовтня 539 р. до н. е. за власним датуванням вавилонської хроніки: шістнадцятого дня місяця тішрі Угбару, правитель Гутіуму, і військо Кіра вступили у Вавилон без бою, а сам Кір увійшов у місто сімнадцять днів по тому, 29 жовтня. Мапа стоїть у Вавилоні 539 р. до н. е. Вавилон лежить приблизно за 870 км на схід від Єрусалиму по прямій."
    - "Даниїл відносить падіння на одну ніч. Валтасар «справляв раз великий бенкет задля тисячі вельмож своїх», пив із посуду Храму й побачив руку, що писала на стіні: «Перес — роздїлено царство твоє й віддано Мидіям та Персам». «Тієї ж таки ночі Валтасара, царя Халдейського, вбито, а Дарій Мидій обняв царство». Клинописні записи підтверджують цю рамку: Валтасар був сином Набоніда, останнього царя, який залишив його керувати Вавилоном на десять років, що сам провів у Темі в Аравії, тому Валтасар міг запропонувати Даниїлові лише третє місце в царстві; Геродот і Ксенофонт його імені не знали. «Дарія Мидія», якого немає в жодному іншому записі, одні вважають Губару-правителем, інші — самим Кіром під іншим іменем, а багато критиків — плутаниною з пізнішим Дарієм I; питання відкрите."
    - "Хроніка Набоніда каже, що Кір розбив вавилонян при Опісі на Тигрі, взяв Сіппар без бою чотирнадцятого тішрі, що Набонід утік і що за два дні війська Угбару вступили у Вавилон; Набоніда було схоплено після повернення, а Циліндр Кіра стверджує, що сам Мардук впустив царя без бою. Геродот і Ксенофонт додають, що перси ввійшли по руслу відведеного Євфрату під час свята — історію, у якій багато хто сумнівається. Ісая передав Кірові слово Господнє: «Мій пастирю», — і назвав його «помазанником свого»; Господь обіцяє йому: «Пооддаю тобі поховані в темнотї скарби» та «поторощу мідяні двері». Єремія провістив: «Господь підпалив завзяттє царів Мидійських» проти Вавилону. Перший рік Кіра як царя Вавилону почався навесні 538 р. до н. е.: це «першого року Кира» указу Ездри, що звільняв вигнанців."
  es:
    - "El 12 de octubre del 539 a. C., según la propia datación de la crónica babilónica: el día dieciséis del mes de Tisrí, Ugbaru, gobernador de Gutium, y el ejército de Ciro entraron en Babilonia sin batalla, y el propio Ciro entró en la ciudad diecisiete días después, el 29 de octubre. El mapa se sitúa en Babilonia en el 539 a. C. Babilonia está a unos 870 km al este de Jerusalén en línea recta."
    - "Daniel sitúa la caída en una sola noche. Belsasar «hizo un gran banquete á mil de sus príncipes», bebió de los vasos del Templo y vio la mano escribir en la pared: «PERES: Tu reino fué rompido, y es dado á Medos y Persas». «La misma noche fué muerto Belsasar, rey de los Caldeos. Y Darío de Media tomó el reino». Los registros cuneiformes confirman el marco: Belsasar era hijo de Nabonido, el último rey, que lo dejó al mando de Babilonia durante los diez años que pasó en Tema, en Arabia, por lo cual Belsasar solo pudo ofrecer a Daniel el tercer lugar en el reino; Heródoto y Jenofonte no conocieron su nombre. «Darío de Media», que no figura en ningún otro registro, es tenido por algunos por Gubaru, el gobernador, por otros por el propio Ciro bajo otro nombre, y por muchos críticos por una confusión con el posterior Darío I; la cuestión está abierta."
    - "La Crónica de Nabonido dice que Ciro derrotó a los babilonios en Opis, sobre el Tigris, tomó Sippar sin combatir el día catorce de Tisrí, que Nabonido huyó y dos días después las tropas de Ugbaru entraron en Babilonia; Nabonido fue capturado al volver, y el Cilindro de Ciro afirma que Marduk mismo dejó entrar al rey sin batalla. Heródoto y Jenofonte añaden que los persas entraron por el lecho del Éufrates desviado en una fiesta, relato dudado por muchos. Isaías llamó a Ciro «mi pastor» del Señor y «su ungido», a quien se darían «los tesoros escondidos» y ante quien el Señor diría: «quebrantaré puertas de bronce»; Jeremías predijo que «despertado ha Jehová el espíritu de los reyes de Media» contra Babilonia. El primer año de Ciro como rey de Babilonia comenzó en primavera del 538 a. C.: es «el primer año de Ciro» del decreto de Esdras que libera a los desterrados."
  pt:
    - "Em 12 de outubro de 539 a.C., pela própria datação da crônica babilônica: no dia 16 do mês de tisri, Ugbaru, governador de Gútio, e o exército de Ciro entraram em Babilônia sem batalha, e o próprio Ciro entrou na cidade dezessete dias depois, em 29 de outubro. O mapa está em Babilônia em 539 a.C. Babilônia fica a cerca de 870 km a leste de Jerusalém em linha reta."
    - "Daniel põe a queda numa só noite. Belsazar “deu um grande banquete para mil dos seus nobres”, bebeu nos vasos do Templo e viu a mão escrever na parede: “PERES: o seu reino foi dividido, e entregue aos medos e persas”. “Naquela mesma noite, Belsazar, o rei caldeu, foi morto. E Dario, o medo, recebeu o reino.” Os registros cuneiformes confirmam o quadro: Belsazar era filho de Nabonido, o último rei, que o deixou encarregado de Babilônia nos dez anos que passou em Temá, na Arábia, e por isso Belsazar só podia oferecer a Daniel o terceiro lugar no reino; Heródoto e Xenofonte não sabiam seu nome. “Dario, o medo”, que não consta de nenhum outro registro, é tido por alguns como Gubaru, o governador, por outros como o próprio Ciro com outro nome, e por muitos críticos como confusão com Dario I, posterior; a questão está aberta."
    - "A Crônica de Nabonido diz que Ciro venceu os babilônios em Ópis, no Tigre, tomou Sipar sem luta no dia 14 de tisri, que Nabonido fugiu e que dois dias depois as tropas de Ugbaru entraram em Babilônia; Nabonido foi capturado ao voltar, e o Cilindro de Ciro afirma que o próprio Marduque deixou o rei entrar sem batalha. Heródoto e Xenofonte acrescentam que os persas entraram pelo leito do Eufrates desviado durante uma festa, história que muitos põem em dúvida. Isaías chamara Ciro de “pastor” do Senhor e “seu ungido”, a quem seriam dados “os tesouros das trevas” e diante de quem o Senhor “despedaçaria as portas de bronze”; Jeremias predisse que “o SENHOR despertou o espírito dos reis dos medos” contra Babilônia. O primeiro ano de Ciro como rei de Babilônia começou na primavera de 538 a.C.: é o “primeiro ano de Ciro” do decreto de Esdras que libertou os exilados."
  de:
    - "Am 12. Oktober 539 v. Chr. nach der eigenen Datierung der Babylonischen Chronik: Am sechzehnten Tag des Monats Tischri zogen Ugbaru, der Statthalter von Gutium, und das Heer des Kyrus ohne Schlacht in Babylon ein, und Kyrus selbst kam siebzehn Tage später, am 29. Oktober, in die Stadt. Die Karte steht 539 v. Chr. bei Babylon. Babylon liegt etwa 870 km östlich von Jerusalem in der Luftlinie."
    - "Daniel setzt den Fall in eine einzige Nacht. Belsazar machte „ein herrliches Mahl seinen tausend Gewaltigen“, trank aus den Gefäßen des Tempels und sah die Hand an die Wand schreiben: „Peres, das ist: dein Königreich ist zerteilt und den Medern und Persern gegeben.“ „Aber in derselben Nacht ward der Chaldäer König Belsazer getötet. Und Darius aus Medien nahm das Reich ein.“ Die Keilschrift bestätigt den Rahmen: Belsazar war der Sohn Nabonids, des letzten Königs, der ihm Babylon überließ, als er zehn Jahre in Tema in Arabien weilte; darum konnte Belsazar Daniel nur den dritten Platz im Reich bieten. Herodot und Xenophon kannten seinen Namen nicht. „Darius aus Medien“, der in keiner anderen Quelle vorkommt, gilt manchen als der Statthalter Gubaru, anderen als Kyrus selbst unter anderem Namen, vielen als Verwechslung mit dem späteren Darius I.; die Frage ist offen."
    - "Die Nabonid-Chronik berichtet, Kyrus habe die Babylonier bei Opis am Tigris geschlagen und Sippar am vierzehnten Tischri ohne Kampf genommen, Nabonid sei geflohen, und zwei Tage später seien Ugbarus Truppen in Babylon eingezogen; Nabonid wurde bei der Rückkehr gefangen; laut Kyrus-Zylinder ließ Marduk selbst den König kampflos ein. Herodot und Xenophon ergänzen, die Perser seien während eines Festes im Bett des umgeleiteten Euphrat eingedrungen, was viele bezweifeln. Jesaja sagte von Kyrus: „Der ist mein Hirte“, nannte ihn „seinem Gesalbten“, dem Gott „die heimlichen Schätze“ geben und vor dem er „die ehernen Türen zerschlagen“ wolle; Jeremia kündigte gegen Babylon an: „Der HERR hat den Mut der Könige in Medien erweckt“. Kyrus' erstes Jahr als König von Babylon begann im Frühjahr 538 v. Chr.: Esras Erlass zur Befreiung der Verbannten fällt „im ersten Jahr des Kores“."
  fr:
    - "Le 12 octobre 539 av. J.-C., d’après la datation de la chronique babylonienne elle-même : le seizième jour du mois de tishri, Ugbaru, gouverneur du Gutium, et l’armée de Cyrus entrèrent dans Babylone sans combat, et Cyrus lui-même entra dans la ville dix-sept jours plus tard, le 29 octobre. La carte se place à Babylone en 539 av. J.-C. Babylone est à environ 870 km à l’est de Jérusalem en ligne droite."
    - "Daniel place la chute en une seule nuit. Belschatsar « donna un grand festin à ses grands au nombre de mille », but dans les vases du Temple et vit la main écrire sur le mur : « Divisé : Ton royaume sera divisé, et donné aux Mèdes et aux Perses. » « Cette même nuit, Belschatsar, roi des Chaldéens, fut tué. Et Darius, le Mède, s’empara du royaume. » Les textes cunéiformes confirment le cadre : Belschatsar était le fils de Nabonide, dernier roi, qui lui laissa Babylone pendant les dix ans passés à Théma, en Arabie, d’où la troisième place seulement offerte à Daniel ; Hérodote et Xénophon ignoraient son nom. « Darius, le Mède », absent de toute autre source, est pris par les uns pour le gouverneur Gubaru, par d’autres pour Cyrus lui-même sous un autre nom, par beaucoup de critiques pour une confusion avec Darius Ier ; la question reste ouverte."
    - "La Chronique de Nabonide dit que Cyrus battit les Babyloniens à Opis, sur le Tigre, prit Sippar sans combat le quatorze de tishri, que Nabonide s’enfuit, et que deux jours plus tard les troupes d’Ugbaru entrèrent dans Babylone ; Nabonide fut pris à son retour, et le Cylindre de Cyrus prétend que Mardouk lui-même fit entrer le roi sans combat. Hérodote et Xénophon disent que les Perses entrèrent par le lit de l’Euphrate détourné pendant une fête, récit que beaucoup doutent. Ésaïe nomma Cyrus « berger » du Seigneur et « son oint », à qui seraient donnés « des trésors cachés » et devant qui seraient rompues « les portes d’airain » ; Jérémie annonça que « l’Éternel a excité l’esprit des rois de Médie » contre Babylone. La première année de Cyrus comme roi de Babylone commença au printemps 538 av. J.-C. : c’est la « première année de Cyrus » du décret d’Esdras libérant les exilés."
