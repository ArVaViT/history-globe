# Draft question (the night of the capture and its date; "when-did-the-jews-return-from-babylon" takes the edict and the return).
id: when-did-cyrus-take-babylon
question:
  en: "When did Cyrus take Babylon?"
  ru: "Когда Кир взял Вавилон?"
  uk: "Коли Кір узяв Вавилон?"
  es: "¿Cuándo tomó Ciro Babilonia?"
  pt: "Quando Ciro tomou Babilônia?"
  de: "Wann nahm Kyrus Babylon ein?"
  fr: "Quand Cyrus a-t-il pris Babylone ?"
  pl: "Kiedy Cyrus zdobył Babilon?"
  it: "Quando Ciro prese Babilonia?"
  nl: "Wanneer nam Cyrus Babylon in?"
  cs: "Kdy Kýros dobyl Babylón?"
  sv: "När intog Kyros Babylon?"
  nb: "Når inntok Kyros Babylon?"
  tl: "Kailan kinuha ni Ciro ang Babilonia?"
  da: "Hvornår indtog Kyros Babylon?"
  sr: "Када је Кир заузео Вавилон?"
  hu: "Mikor foglalta el Círusz Babilont?"
  fi: "Milloin Kyyros valtasi Babylonin?"
  vi: "Si-ru chiếm Ba-by-lôn khi nào?"
  ro: "Când a luat Cir Babilonul?"
  bg: "Кога Кир е превзел Вавилон?"
answer:
  en:
    - "On 12 October 539 BC, by the Babylonian chronicle's own dating: on the sixteenth day of the month Tishri Ugbaru, governor of Gutium, and the army of Cyrus entered Babylon without a battle, and Cyrus himself came into the city seventeen days later, on 29 October. The map stands at Babylon in 539 BC. Babylon lies about 870 km east of Jerusalem in a straight line."
    - "Daniel sets the fall in a single night. Belshazzar “made a great feast to a thousand of his lords”, drank from the vessels of the Temple, and saw the hand write on the wall: “PERES; Thy kingdom is divided, and given to the Medes and Persians.” “In that night was Belshazzar the king of the Chaldeans slain. And Darius the Median took the kingdom.” The cuneiform records bear out the frame: Belshazzar was the son of Nabonidus, the last king, who left him in charge of Babylon for the ten years he spent at Tema in Arabia, which is why Belshazzar could offer Daniel only the third place in the kingdom; Herodotus and Xenophon did not know his name. “Darius the Median”, who is in no other record, is taken by some for Gubaru the governor, by others for Cyrus himself under another name, and by many critics for a confusion with the later Darius I; the question is open."
    - "The Nabonidus Chronicle says that Cyrus beat the Babylonians at Opis on the Tigris, took Sippar without fighting on the fourteenth of Tishri, that Nabonidus fled, and that two days later Ugbaru's troops entered Babylon; Nabonidus was captured on his return, and the Cyrus Cylinder claims that Marduk himself let the king in without battle. Herodotus and Xenophon add that the Persians came in along the bed of the diverted Euphrates during a festival, a story many doubt. Isaiah had named Cyrus as the Lord's “shepherd” and “his anointed” who would be given “the treasures of darkness” and before whom the Lord would “break in pieces the gates of brass”; Jeremiah foretold that “the LORD hath raised up the spirit of the kings of the Medes” against Babylon. Cyrus's first year as king of Babylon began in the spring of 538 BC: that is the “first year of Cyrus” of Ezra's decree freeing the exiles."
  ru:
    - "12 октября 539 г. до н. э. по датировке самой вавилонской хроники: в шестнадцатый день месяца тишри Угбару, правитель Гутиума, и войско Кира вошли в Вавилон без боя, а сам Кир вступил в город семнадцать дней спустя, 29 октября. Карта стоит на Вавилоне в 539 г. до н. э. Вавилон лежит примерно в 870 км к востоку от Иерусалима по прямой."
    - "Даниил вмещает падение в одну ночь. Валтасар «сделал большое пиршество для тысячи вельмож своих», пил из сосудов Храма и увидел, как рука пишет на стене: «Перес — разделено царство твое и дано Мидянам и Персам». «В ту же самую ночь Валтасар, царь Халдейский, был убит, и Дарий Мидянин принял царство». Клинописные записи подтверждают рамку рассказа: Валтасар был сыном Набонида, последнего царя, который оставил его править Вавилоном на те десять лет, что сам провёл в аравийской Феме, — потому Валтасар и мог предложить Даниилу лишь третье место в царстве; Геродот и Ксенофонт его имени не знали. «Дария Мидянина», которого нет ни в одной другой записи, одни отождествляют с наместником Губару, другие — с самим Киром под другим именем, а многие критики считают путаницей с позднейшим Дарием I; вопрос открыт."
    - "Хроника Набонида сообщает, что Кир разбил вавилонское войско при Описе на Тигре, четырнадцатого тишри взял Сиппар без боя, что Набонид бежал и что через два дня войска Угбару вошли в Вавилон; Набонида схватили, когда он вернулся в город, а Цилиндр Кира утверждает, что сам Мардук впустил царя без сражения. Геродот и Ксенофонт добавляют, что персы вошли по руслу отведённого Евфрата во время праздника, — многие в этом сомневаются. Исаия назвал Кира «пастырем» Господа и «помазанником», которому отдадут «хранимые во тьме сокровища» и которому Господь обещал: «медные двери сокрушу и запоры железные сломаю»; Иеремия предрёк, что «Господь возбудил дух царей Мидийских» против Вавилона. Первый год царствования Кира как царя Вавилона начался весной 538 г. до н. э., и это тот самый «первый год Кира» из указа в книге Ездры, отпустившего переселенцев домой."
  uk:
    - "12 жовтня 539 р. до н. е. за власним датуванням вавилонської хроніки: шістнадцятого дня місяця тішрі Угбару, правитель Гутіуму, і військо Кіра вступили у Вавилон без бою, а сам Кір увійшов у місто сімнадцять днів по тому, 29 жовтня. Мапа стоїть у Вавилоні 539 р. до н. е. Вавилон лежить приблизно за 870 км на схід від Єрусалиму по прямій."
    - "Даниїл відносить падіння на одну ніч. Валтасар «справляв раз великий бенкет задля тисячі вельмож своїх», пив із посуду Храму й побачив руку, що писала на стіні: «Перес — роздїлено царство твоє й віддано Мидіям та Персам». «Тієї ж таки ночі Валтасара, царя Халдейського, вбито, а Дарій Мидій обняв царство». Клинописні записи підтверджують цю рамку: Валтасар був сином Набоніда, останнього царя, який залишив його керувати Вавилоном на десять років, що сам провів у Темі в Аравії, тому Валтасар міг запропонувати Даниїлові лише третє місце в царстві; Геродот і Ксенофонт його імені не знали. «Дарія Мидія», якого немає в жодному іншому записі, одні вважають Губару-правителем, інші — самим Кіром під іншим іменем, а багато критиків — плутаниною з пізнішим Дарієм I; питання відкрите."
    - "Хроніка Набоніда каже, що Кір розбив вавилонян при Опісі на Тигрі, взяв Сіппар без бою чотирнадцятого тішрі, що Набонід утік і що за два дні війська Угбару вступили у Вавилон; Набоніда було схоплено після повернення, а Циліндр Кіра стверджує, що сам Мардук впустив царя без бою. Геродот і Ксенофонт додають, що перси ввійшли по руслу відведеного Євфрату під час свята — історію, у якій багато хто сумнівається. Ісая передав Кірові слово Господнє: «Мій пастирю», — і назвав його «помазанником свого»; Господь обіцяє йому: «Пооддаю тобі поховані в темнотї скарби» та «поторощу мідяні двері». Єремія провістив: «Господь підпалив завзяттє царів Мидійських» проти Вавилону. Перший рік Кіра як царя Вавилону почався навесні 538 р. до н. е.: це «першого року Кира» указу Ездри, що звільняв вигнанців."
  es:
    - "El 12 de octubre del 539 a. C., según la propia datación de la crónica babilónica: el día dieciséis del mes de Tisrí, Ugbaru, gobernador de Gutium, y el ejército de Ciro entraron en Babilonia sin batalla, y el propio Ciro entró en la ciudad diecisiete días después, el 29 de octubre. El mapa se sitúa en Babilonia en el 539 a. C. Babilonia está a unos 870 km al este de Jerusalén en línea recta."
    - "Daniel sitúa la caída en una sola noche. Belsasar «hizo un gran banquete á mil de sus príncipes», bebió de los vasos del Templo y vio la mano escribir en la pared: «PERES: Tu reino fué rompido, y es dado á Medos y Persas». «La misma noche fué muerto Belsasar, rey de los Caldeos. Y Darío de Media tomó el reino». Los registros cuneiformes confirman el marco: Belsasar era hijo de Nabonido, el último rey, que lo dejó al mando de Babilonia durante los diez años que pasó en Tema, en Arabia, por lo cual Belsasar solo pudo ofrecer a Daniel el tercer lugar en el reino; Heródoto y Jenofonte no conocieron su nombre. «Darío de Media», que no figura en ningún otro registro, es tenido por algunos por Gubaru, el gobernador, por otros por el propio Ciro bajo otro nombre, y por muchos críticos por una confusión con el posterior Darío I; la cuestión está abierta."
    - "La Crónica de Nabonido dice que Ciro derrotó a los babilonios en Opis, sobre el Tigris, tomó Sippar sin combatir el día catorce de Tisrí, que Nabonido huyó y dos días después las tropas de Ugbaru entraron en Babilonia; Nabonido fue capturado al volver, y el Cilindro de Ciro afirma que Marduk mismo dejó entrar al rey sin batalla. Heródoto y Jenofonte añaden que los persas entraron por el lecho del Éufrates desviado en una fiesta, relato dudado por muchos. Isaías llamó a Ciro «mi pastor» del Señor y «su ungido», a quien se darían «los tesoros escondidos» y ante quien el Señor diría: «quebrantaré puertas de bronce»; Jeremías predijo que «despertado ha Jehová el espíritu de los reyes de Media» contra Babilonia. El primer año de Ciro como rey de Babilonia comenzó en primavera del 538 a. C.: es «el primer año de Ciro» del decreto de Esdras que libera a los desterrados."
  pt:
    - "Em 12 de outubro de 539 a.C., pela própria datação da crônica babilônica: no dia 16 do mês de tisri, Ugbaru, governador de Gútio, e o exército de Ciro entraram em Babilônia sem batalha, e o próprio Ciro entrou na cidade dezessete dias depois, em 29 de outubro. O mapa está em Babilônia em 539 a.C. Babilônia fica a cerca de 870 km a leste de Jerusalém em linha reta."
    - "Daniel põe a queda numa só noite. Belsazar “deu um grande banquete para mil dos seus nobres”, bebeu nos vasos do Templo e viu a mão escrever na parede: “PERES: o seu reino foi dividido, e entregue aos medos e persas”. “Naquela mesma noite, Belsazar, o rei caldeu, foi morto. E Dario, o medo, recebeu o reino.” Os registros cuneiformes confirmam o quadro: Belsazar era filho de Nabonido, o último rei, que o deixou encarregado de Babilônia nos dez anos que passou em Temá, na Arábia, e por isso Belsazar só podia oferecer a Daniel o terceiro lugar no reino; Heródoto e Xenofonte não sabiam seu nome. “Dario, o medo”, que não consta de nenhum outro registro, é tido por alguns como Gubaru, o governador, por outros como o próprio Ciro com outro nome, e por muitos críticos como confusão com Dario I, posterior; a questão está aberta."
    - "A Crônica de Nabonido diz que Ciro venceu os babilônios em Ópis, no Tigre, tomou Sipar sem luta no dia 14 de tisri, que Nabonido fugiu e que dois dias depois as tropas de Ugbaru entraram em Babilônia; Nabonido foi capturado ao voltar, e o Cilindro de Ciro afirma que o próprio Marduque deixou o rei entrar sem batalha. Heródoto e Xenofonte acrescentam que os persas entraram pelo leito do Eufrates desviado durante uma festa, história que muitos põem em dúvida. Isaías chamara Ciro de “pastor” do Senhor e “seu ungido”, a quem seriam dados “os tesouros das trevas” e diante de quem o Senhor “despedaçaria as portas de bronze”; Jeremias predisse que “o SENHOR despertou o espírito dos reis dos medos” contra Babilônia. O primeiro ano de Ciro como rei de Babilônia começou na primavera de 538 a.C.: é o “primeiro ano de Ciro” do decreto de Esdras que libertou os exilados."
  de:
    - "Am 12. Oktober 539 v. Chr. nach der eigenen Datierung der Babylonischen Chronik: Am sechzehnten Tag des Monats Tischri zogen Ugbaru, der Statthalter von Gutium, und das Heer des Kyrus ohne Schlacht in Babylon ein, und Kyrus selbst kam siebzehn Tage später, am 29. Oktober, in die Stadt. Die Karte steht 539 v. Chr. bei Babylon. Babylon liegt etwa 870 km östlich von Jerusalem in der Luftlinie."
    - "Daniel setzt den Fall in eine einzige Nacht. Belsazar machte „ein herrliches Mahl seinen tausend Gewaltigen“, trank aus den Gefäßen des Tempels und sah die Hand an die Wand schreiben: „Peres, das ist: dein Königreich ist zerteilt und den Medern und Persern gegeben.“ „Aber in derselben Nacht ward der Chaldäer König Belsazer getötet. Und Darius aus Medien nahm das Reich ein.“ Die Keilschrift bestätigt den Rahmen: Belsazar war der Sohn Nabonids, des letzten Königs, der ihm Babylon überließ, als er zehn Jahre in Tema in Arabien weilte; darum konnte Belsazar Daniel nur den dritten Platz im Reich bieten. Herodot und Xenophon kannten seinen Namen nicht. „Darius aus Medien“, der in keiner anderen Quelle vorkommt, gilt manchen als der Statthalter Gubaru, anderen als Kyrus selbst unter anderem Namen, vielen als Verwechslung mit dem späteren Darius I.; die Frage ist offen."
    - "Die Nabonid-Chronik berichtet, Kyrus habe die Babylonier bei Opis am Tigris geschlagen und Sippar am vierzehnten Tischri ohne Kampf genommen, Nabonid sei geflohen, und zwei Tage später seien Ugbarus Truppen in Babylon eingezogen; Nabonid wurde bei der Rückkehr gefangen; laut Kyrus-Zylinder ließ Marduk selbst den König kampflos ein. Herodot und Xenophon ergänzen, die Perser seien während eines Festes im Bett des umgeleiteten Euphrat eingedrungen, was viele bezweifeln. Jesaja sagte von Kyrus: „Der ist mein Hirte“, nannte ihn „seinem Gesalbten“, dem Gott „die heimlichen Schätze“ geben und vor dem er „die ehernen Türen zerschlagen“ wolle; Jeremia kündigte gegen Babylon an: „Der HERR hat den Mut der Könige in Medien erweckt“. Kyrus' erstes Jahr als König von Babylon begann im Frühjahr 538 v. Chr.: Esras Erlass zur Befreiung der Verbannten fällt „im ersten Jahr des Kores“."
  fr:
    - "Le 12 octobre 539 av. J.-C., d’après la datation de la chronique babylonienne elle-même : le seizième jour du mois de tishri, Ugbaru, gouverneur du Gutium, et l’armée de Cyrus entrèrent dans Babylone sans combat, et Cyrus lui-même entra dans la ville dix-sept jours plus tard, le 29 octobre. La carte se place à Babylone en 539 av. J.-C. Babylone est à environ 870 km à l’est de Jérusalem en ligne droite."
    - "Daniel place la chute en une seule nuit. Belschatsar « donna un grand festin à ses grands au nombre de mille », but dans les vases du Temple et vit la main écrire sur le mur : « Divisé : Ton royaume sera divisé, et donné aux Mèdes et aux Perses. » « Cette même nuit, Belschatsar, roi des Chaldéens, fut tué. Et Darius, le Mède, s’empara du royaume. » Les textes cunéiformes confirment le cadre : Belschatsar était le fils de Nabonide, dernier roi, qui lui laissa Babylone pendant les dix ans passés à Théma, en Arabie, d’où la troisième place seulement offerte à Daniel ; Hérodote et Xénophon ignoraient son nom. « Darius, le Mède », absent de toute autre source, est pris par les uns pour le gouverneur Gubaru, par d’autres pour Cyrus lui-même sous un autre nom, par beaucoup de critiques pour une confusion avec Darius Ier ; la question reste ouverte."
    - "La Chronique de Nabonide dit que Cyrus battit les Babyloniens à Opis, sur le Tigre, prit Sippar sans combat le quatorze de tishri, que Nabonide s’enfuit, et que deux jours plus tard les troupes d’Ugbaru entrèrent dans Babylone ; Nabonide fut pris à son retour, et le Cylindre de Cyrus prétend que Mardouk lui-même fit entrer le roi sans combat. Hérodote et Xénophon disent que les Perses entrèrent par le lit de l’Euphrate détourné pendant une fête, récit que beaucoup doutent. Ésaïe nomma Cyrus « berger » du Seigneur et « son oint », à qui seraient donnés « des trésors cachés » et devant qui seraient rompues « les portes d’airain » ; Jérémie annonça que « l’Éternel a excité l’esprit des rois de Médie » contre Babylone. La première année de Cyrus comme roi de Babylone commença au printemps 538 av. J.-C. : c’est la « première année de Cyrus » du décret d’Esdras libérant les exilés."
  pl:
    - "12 października 539 p.n.e. według własnego datowania kroniki babilońskiej: szesnastego dnia miesiąca tiszri Ugbaru, namiestnik Gutium, i wojsko Cyrusa wkroczyli do Babilonu bez bitwy, a sam Cyrus wszedł do miasta siedemnaście dni później, 29 października. Mapa stoi w Babilonie w 539 p.n.e. Babilon leży około 870 km na wschód od Jerozolimy w linii prostej."
    - "Daniel umieszcza upadek w jednej nocy. Belszassar „uczynił ucztę wielką na tysiąc książąt swoich”, pił z naczyń Świątyni i ujrzał rękę piszącą na ścianie: „Peres, rozdzielone jest królestwo twoje, a dane jest Medom i Persom.” „Tejże nocy zabity jest Balsazar, król Chaldejski. A Daryjusz, Medczyk, ujął królestwo.” Zapisy klinowe potwierdzają ramę opowieści: Belszassar był synem Nabonida, ostatniego króla, który zostawił mu Babilon pod opieką na dziesięć lat swego pobytu w Tema w Arabii, dlatego Belszassar mógł zaoferować Danielowi tylko trzecie miejsce w królestwie; Herodot i Ksenofont nie znali jego imienia. „Daryjusz, Medczyk”, którego nie ma w żadnym innym zapisie, jedni biorą za namiestnika Gubaru, inni za samego Cyrusa pod innym imieniem, a wielu krytyków za pomyłkę z późniejszym Dariuszem I; kwestia pozostaje otwarta."
    - "Kronika Nabonida mówi, że Cyrus pobił Babilończyków pod Opis nad Tygrysem, zajął Sippar bez walki czternastego dnia tiszri, że Nabonid uciekł i że dwa dni później wojska Ugbaru weszły do Babilonu; Nabonida schwytano po powrocie, a Cylinder Cyrusa głosi, że sam Marduk wpuścił króla bez bitwy. Herodot i Ksenofont dodają, że Persowie weszli korytem odprowadzonego Eufratu podczas święta, co wielu uważa za wątpliwe. Izajasz mówił o Cyrusie: „On pasterz mój”; Pan mówi „pomazańcowi swemu Cyrusowi”, że da mu „skarby skryte” i że przed nim „wrota miedziane skruszę”; Jeremiasz zapowiedział przeciw Babilonowi: „Wzbudził Pan ducha królów Medskich”. Pierwszy rok Cyrusa jako króla Babilonu zaczął się wiosną 538 p.n.e.: to „pierwszy rok Cyrusa” z edyktu Ezdrasza uwalniającego wygnańców."
  it:
    - "Il 12 ottobre del 539 a.C., secondo la datazione della stessa cronaca babilonese: il sedicesimo giorno del mese di Tishri Ugbaru, governatore di Gutium, e l’esercito di Ciro entrarono a Babilonia senza battaglia, e Ciro stesso entrò in città diciassette giorni dopo, il 29 ottobre. La mappa si trova a Babilonia nel 539 a.C. Babilonia dista circa 870 km a est di Gerusalemme in linea retta."
    - "Daniele colloca la caduta in una sola notte. Baldassarre «fece un gran convito a mille de’ suoi grandi», bevve dai vasi del Tempio e vide la mano scrivere sul muro: «PERES: il tuo regno è diviso, e dato ai Medi e ai Persiani». «In quella stessa notte, Belsatsar, re de’ Caldei, fu ucciso; e Dario il Medo, ricevette il regno». I documenti cuneiformi confermano la cornice: Baldassarre era figlio di Nabonedo, l’ultimo re, che lo lasciò a capo di Babilonia per i dieci anni che trascorse a Tema in Arabia, perciò Baldassarre poté offrire a Daniele solo il terzo posto nel regno; Erodoto e Senofonte non conoscevano il suo nome. «Dario il Medo», che non compare in nessun altro documento, alcuni lo identificano con il governatore Gubaru, altri con lo stesso Ciro sotto altro nome, e molti critici vi vedono una confusione con il successivo Dario I; la questione è aperta."
    - "La Cronaca di Nabonedo dice che Ciro sconfisse i Babilonesi a Opis sul Tigri, prese Sippar senza combattere il quattordici di Tishri, che Nabonedo fuggì e che due giorni dopo le truppe di Ugbaru entrarono a Babilonia; Nabonedo fu catturato al ritorno, e il Cilindro di Ciro afferma che Marduk stesso fece entrare il re senza battaglia. Erodoto e Senofonte aggiungono che i Persiani entrarono lungo l’alveo dell’Eufrate deviato durante una festa, una storia che molti dubitano. Isaia disse di Ciro: «Egli è il mio pastore», lo chiamò «suo unto» e gli promise: «frantumerò le porte di rame … ti darò i tesori occulti nelle tenebre»; Geremia predisse che «l’Eterno ha eccitato lo spirito dei re dei Medi» contro Babilonia. Il primo anno di Ciro come re di Babilonia cominciò nella primavera del 538 a.C.: è il «primo anno di Ciro» del decreto di Esdra che libera gli esuli."
  nl:
    - "Op 12 oktober 539 v.Chr., volgens de eigen datering van de Babylonische kroniek: op de zestiende dag van de maand Tisjri trokken Ugbaru, gouverneur van Gutium, en het leger van Cyrus zonder slag Babylon binnen, en Cyrus zelf kwam zeventien dagen later, op 29 oktober, de stad in. De kaart staat bij Babylon in 539 v.Chr. Babylon ligt hemelsbreed ongeveer 870 km ten oosten van Jeruzalem."
    - "Daniël plaatst de val in één nacht. Belsazar “maakte een groten maaltijd voor zijn duizend geweldigen”, dronk uit de vaten van de tempel en zag de hand op de muur schrijven: “PERES; uw koninkrijk is verdeeld, en het is den Meden en den Perzen gegeven.” “In dienzelfden nacht, werd Belsazar, der Chaldeen koning, gedood. Darius, de Meder nu, ontving het koninkrijk.” De spijkerschriftbronnen bevestigen het kader: Belsazar was de zoon van Nabonidus, de laatste koning, die hem Babylon toevertrouwde tijdens de tien jaar in Tema in Arabië, en daarom kon hij Daniël slechts de derde plaats aanbieden; Herodotus en Xenophon kenden zijn naam niet. “Darius, de Meder”, in geen andere bron bekend, wordt door sommigen voor de gouverneur Gubaru gehouden, door anderen voor Cyrus zelf onder andere naam, en door veel critici voor een verwarring met Darius I; de vraag is open."
    - "De Kroniek van Nabonidus zegt dat Cyrus de Babyloniërs bij Opis aan de Tigris versloeg, op 14 Tisjri zonder strijd Sippar innam, Nabonidus vluchtte en twee dagen later Ugbaru’s troepen Babylon binnentrokken; Nabonidus werd bij zijn terugkeer gevangengenomen, en de Cyruscilinder zegt dat Marduk zelf de koning zonder strijd binnenliet. Herodotus en Xenophon voegen toe dat de Perzen tijdens een feest door het bed van de omgeleide Eufraat binnenkwamen, wat velen betwijfelen. Jesaja noemde Cyrus “Mijn herder” en “Zijn gezalfde”, die “de schatten, die in de duisternissen zijn” zou krijgen en voor wie de HEER zei: “de koperen deuren zal Ik verbreken”; Jeremia zei over Babylon: “de HEERE heeft den geest der koningen van Medië opgewekt”. Cyrus’ eerste jaar als koning van Babylon begon in het voorjaar van 538 v.Chr.: het “eerste jaar … van Kores” in Ezra’s decreet."
  cs:
    - "Dne 12. října 539 př. n. l. podle vlastního datování babylonské kroniky: šestnáctého dne měsíce tišri vstoupil do Babylónu bez boje Ugbaru, správce Gutia, a vojsko Kýrovo, a sám Kýros vešel do města o sedmnáct dní později, 29. října. Mapa stojí u Babylónu v roce 539 př. n. l. Babylón leží asi 870 km východně od Jeruzaléma vzdušnou čarou."
    - "Daniel klade pád do jediné noci. Belšasar „učinil hody veliké tisíci knížatům svým“, pil z nádob chrámu a viděl ruku psát na stěnu: „Peres, rozděleno jest království tvé, a dáno jest Médským a Perským.“ „V touž noc zabit jest Balsazar král Kaldejský. … Darius pak Médský ujal království.“ Klínopisné záznamy rámec potvrzují: Belšasar byl synem Nabonida, posledního krále, který mu svěřil Babylón na deset let, jež strávil v Téma v Arábii, a proto mohl Belšasar nabídnout Danielovi jen třetí místo v království; Hérodotos a Xenofón jeho jméno neznali. „Dareia Médského“, který není v žádném jiném záznamu, pokládají někteří za místodržícího Gubaru, jiní za samotného Kýra pod jiným jménem a mnozí kritici za záměnu s pozdějším Dareiem I.; otázka zůstává otevřená."
    - "Kronika Nabonida praví, že Kýros porazil Babyloňany u Opisu na Tigridu, čtrnáctého tišri dobyl bez boje Sippar, že Nabonid uprchl a že o dva dny později vstoupila do Babylónu Ugbarova vojska; Nabonid byl při návratu zajat a Kýrův válec tvrdí, že sám Marduk vpustil krále bez boje. Hérodotos a Xenofón dodávají, že Peršané vešli korytem odkloněného Eufratu během svátku, což mnozí zpochybňují. Izajáš zaznamenal Hospodinova slova o Kýrovi: „Pastýř můj“, „pomazanému svému Cýrovi“; slíbil mu „poklady skryté“ a „vrata měděná potru“; Jeremjáš předpověděl, že „Hospodin vzbudil ducha králů Médských“ proti Babylónu. Kýrův první rok jako krále Babylónu začal na jaře 538 př. n. l.: to je „léta prvního Cýra“ Ezdrášova výnosu, který propouští vyhnance."
  sv:
    - "Den 12 oktober 539 f.Kr., enligt den babyloniska krönikans egen datering: på sextonde dagen i månaden tishri gick Ugbaru, ståthållare i Gutium, och Kyros här in i Babylon utan strid, och Kyros själv kom in i staden sjutton dagar senare, den 29 oktober. Kartan står vid Babylon år 539 f.Kr. Babylon ligger omkring 870 km öster om Jerusalem fågelvägen."
    - "Daniel förlägger fallet till en enda natt. Belshassar ”gjorde ett stort gästabud för sina tusen stormän”, drack ur templets kärl och såg handen skriva på väggen: ”Peres, det betyder: ditt rike har blivit styckat och givet åt meder och perser.” ”Samma natt blev Belsassar, kaldéernas konung, dödad. Och Darejaves av Medien mottog riket.” Kilskriftskällorna bekräftar ramen: Belshassar var son till Nabonid, den siste kungen, som lämnade honom att styra Babylon under de tio år han tillbringade i Tema i Arabien, vilket förklarar varför Belshassar bara kunde erbjuda Daniel tredje platsen i riket; Herodotos och Xenofon kände inte hans namn. ”Darejaves av Medien”, som inte finns i någon annan källa, anses av somliga vara ståthållaren Gubaru, av andra Kyros själv under ett annat namn och av många kritiker en sammanblandning med den senare Dareios I; frågan är öppen."
    - "Nabonidkrönikan säger att Kyros slog babylonierna vid Opis vid Tigris, intog Sippar utan strid den fjortonde tishri, att Nabonid flydde, och att två dagar senare Ugbarus trupper gick in i Babylon; Nabonid tillfångatogs vid sin återkomst, och Kyroscylindern hävdar att Marduk själv släppte in kungen utan strid. Herodotos och Xenofon tillägger att perserna kom in längs bädden av den avledda Eufrat under en fest, en berättelse som många betvivlar. Jesaja hade nämnt Kyros som Herrens ”herde” och ”smorde”, som skulle få ”dolda skatter” och inför vilken Herren skulle säga: ”kopparportarna skall jag krossa”; Jeremia förutsade att ”HERREN har uppväckt de mediska konungarnas ande” mot Babylon. Kyros första år som kung av Babylon började våren 538 f.Kr.: det är ”den persiske konungen Kores’ första regeringsår” i Esras påbud som befriade de bortförda."
  nb:
    - "Den 12. oktober 539 f.Kr., etter den babylonske krønikens egen datering: på den sekstende dagen i måneden tisjri gikk Ugbaru, guvernør i Gutium, og Kyros' hær inn i Babylon uten kamp, og Kyros selv kom inn i byen sytten dager senere, den 29. oktober. Kartet står ved Babylon i 539 f.Kr. Babylon ligger omtrent 870 km øst for Jerusalem i luftlinje."
    - "Daniel setter fallet til én enkelt natt. Belsasar «gjorde et stort gjestebud for sine tusen stormenn», drakk av tempelets kar og så hånden skrive på veggen: «Peres: Delt er ditt kongedømme og gitt til mederne og perserne.» «Samme natt blev kaldeerkongen Belsasar drept. Og mederen Darius mottok riket». Kileskriftkildene bekrefter rammen: Belsasar var sønn av Nabonid, den siste kongen, som overlot Babylon til ham i de ti årene han oppholdt seg i Tema i Arabia, og derfor kunne Belsasar bare tilby Daniel den tredje plassen i riket; Herodot og Xenofon kjente ikke navnet hans. «Mederen Darius», som ikke finnes i noen annen kilde, regnes av noen for guvernøren Gubaru, av andre for Kyros selv under et annet navn, og av mange kritikere for en forveksling med den senere Dareios I; spørsmålet er åpent."
    - "Nabonid-krøniken sier at Kyros slo babylonerne ved Opis ved Tigris, tok Sippar uten kamp den 14. tisjri, at Nabonid flyktet, og at to dager senere gikk Ugbarus tropper inn i Babylon; Nabonid ble tatt til fange da han kom tilbake, og Kyros-sylinderen hevder at Marduk selv slapp kongen inn uten kamp. Herodot og Xenofon tilføyer at perserne kom inn langs bunnen av den avledede Eufrat under en høytid, en fortelling mange tviler på. Jesaja hadde kalt Kyros Herrens «hyrde» og «salvede», som skulle få «skatter som er skjult i mørket», og for hvem Herren ville sprenge «dører av kobber»; Jeremia forutsa at «Herren har vakt mederkongenes ånd» mot Babylon. Kyros' første år som konge av Babylon begynte våren 538 f.Kr.: det er «Kyros' første år» i Esras påbud som frigjorde de bortførte."
  tl:
    - "Noong 12 Oktubre 539 BK, ayon sa sariling pagtatakda ng Kronikang Babilonio: sa ika-16 na araw ng buwan ng Tishri, pumasok sa Babilonia nang walang labanan si Ugbaru, gobernador ng Gutium, at ang hukbo ni Ciro, at si Ciro mismo ay pumasok sa lungsod pagkaraan ng labimpitong araw, noong 29 Oktubre. Ang mapa ay nasa Babilonia noong 539 BK. Ang Babilonia ay nasa mga 870 km sa silangan ng Jerusalem sa tuwid na guhit."
    - "Ayon kay Daniel, sa isang gabi. Si Belsasar ay “gumawa ng malaking piging sa isang libo na kaniyang mga mahal na tao”, uminom sa mga sisidlan ng Templo, at nakitang sumulat ang kamay sa pader: “PERES; ang iyong kaharian ay hinati at ibinigay sa mga taga Media at taga Persia.” “Nang gabing yaon ay napatay si Belsasar na hari ng mga taga Caldea. At tinanggap ni Dario na taga Media ang kaharian.” Tugma ang cuneiform: anak siya ni Nabonido, ang huling hari, na nag-iwan sa kaniya sa Babilonia sa sampung taon nito sa Tema, Arabia, kaya ikatlong puwesto lamang sa kaharian ang maiaalok niya kay Daniel; hindi alam nina Herodoto at Xenofonte ang pangalan niya. Si “Dario na taga Media”, na wala sa ibang talaan, ay si Gubaru na gobernador ayon sa ilan, si Ciro sa ibang pangalan ayon sa iba, at pagkalito sa sumunod na Dario I ayon sa maraming kritiko; bukas ang tanong."
    - "Sa Kronika ni Nabonido, tinalo ni Ciro ang Babilonia sa Opis sa Tigris at kinuha ang Sippar nang walang laban noong 14 Tishri; tumakas si Nabonido, at pagkaraan ng 2 araw pumasok sa Babilonia ang hukbo ni Ugbaru; nahuli siya pagbalik. Ayon sa Silindro ni Ciro, si Marduk ang nagpapasok sa hari nang walang laban. Sabi nina Herodoto at Xenofonte, pumasok ang mga Persiano sa daluyan ng inilihis na Eufrates sa pista, na pinagdududahan ng marami. Tinawag ni Isaias si Ciro na “pastor” at “pinahiran ng langis” ng Panginoon, na bibigyan ng “mga kayamanang nasa kadiliman” at “pagwawaraywarayin” ang “mga pintuang tanso” sa harap niya; hula ni Jeremias: “pinukaw ng Panginoon ang kalooban ng mga hari ng mga Medo”. Nagsimula ang unang taon ni Ciro bilang hari ng Babilonia sa tagsibol ng 538 BK: ito ang “unang taon nga ni Ciro” ng kautusan ni Ezra para sa mga ipinatapon."
  da:
    - "Den 12. oktober 539 f.Kr. efter den babyloniske krønikes egen datering: på den sekstende dag i måneden Tishri rykkede Ugbaru, guvernør i Gutium, og Kyros' hær ind i Babylon uden kamp, og Kyros selv kom ind i byen sytten dage senere, den 29. oktober. Kortet står ved Babylon i 539 f.Kr. Babylon ligger omkring 870 km øst for Jerusalem i luftlinje."
    - "Daniel placerer faldet i en enkelt nat. Belsazar »gjorde et stort Gæstebud for sine tusinde Fyrster«, drak af Templets kar og så hånden skrive på væggen: »›Feres‹, adsplittet er dit Rige og givet Mederne og Perserne.« »I samme Nat blev Belsazar, Kaldæernes Konge, ihjelslagen. Og Mederen Darius modtog Riget.« Kileskriftkilderne bekræfter rammen: Belsazar var søn af Nabonid, den sidste konge, som overlod ham ansvaret for Babylon i de ti år, han opholdt sig i Tema i Arabien, hvorfor Belsazar kun kunne tilbyde Daniel tredjepladsen i riget; Herodot og Xenofon kendte ikke hans navn. »Mederen Darius«, som ikke findes i nogen anden kilde, regnes af nogle for guvernøren Gubaru, af andre for Kyros selv under et andet navn og af mange kritikere for en forveksling med den senere Darius I; spørgsmålet er åbent."
    - "Nabonid-krøniken fortæller, at Kyros slog babylonierne ved Opis ved Tigris, indtog Sippar uden kamp den fjortende Tishri, at Nabonid flygtede, og at Ugbarus tropper to dage senere rykkede ind i Babylon; Nabonid blev fanget ved sin tilbagekomst, og Kyros-cylinderen hævder, at Marduk selv lod kongen komme ind uden kamp. Herodot og Xenofon tilføjer, at perserne kom ind langs det omledte Eufrats leje under en fest, en historie som mange betvivler. Esajas havde kaldt Kyros Herrens »Hyrde« og »Salvede«, som skulle få »Liggendefæ, som er skjult i Mørke«, og for hvem Herren ville »sønderbryde Kobberdøre«; Jeremias forudsagde, at »Herren har opvakt Mediens Kongers Aand« mod Babylon. Kyros' første år som konge af Babylon begyndte i foråret 538 f.Kr.: det er »Kyrus's første Aar« i Ezras dekret, der frigav de bortførte."
  sr:
    - "Дана 12. октобра 539. п. н. е., по датирању саме Вавилонске хронике: шеснаестог дана месеца Тишрија Угбару, намесник области Гути, и Кирова војска ушли су у Вавилон без битке, а сам Кир ушао је у град седамнаест дана касније, 29. октобра. Карта стоји на Вавилону у 539. п. н. е. Вавилон лежи око 870 км источно од Јерусалима правом линијом."
    - "Књига пророка Данила смешта пад у једну ноћ. „Цар Валтасар учини велику гозбу хиљади кнезова својих“, пио је из судова Храма и видео руку како пише на зиду: „ФЕРЕС, раздељено је царство твоје, и дано Мидијанима и Персијанима.“ „Исту ноћ би убијен Валтасар, цар халдејски. А Дарије Мидијанин преузе царство.“ Клинописни записи потврђују тај оквир: Валтасар је био син Набонида, последњег краља, који га је оставио да управља Вавилоном током десет година које је провео у Теми у Арабији, зато је Валтасар могао да понуди Данилу само треће место у царству; Херодот и Ксенофонт нису знали његово име. „Дарије Мидијанин“, који се не јавља ни у једном другом запису, неки сматрају намесником Губаруом, други самим Киром под другим именом, а многи критичари збрком с каснијим Даријем I; питање је отворено."
    - "Набонидова хроника каже да је Кир победио Вавилонце код Описа на Тигру, заузео Сипар без борбе четрнаестог Тишрија, да је Набонид побегао и да су два дана касније Угбаруове трупе ушле у Вавилон; Набонид је заробљен по повратку, а Киров цилиндар тврди да је сам Мардук увео краља без битке. Херодот и Ксенофонт додају да су Персијанци ушли коритом скренутог Еуфрата за време празника, што многи доводе у сумњу. Код Исаије Господ говори „помазанику свом Киру“ и каже му: „Пастир си мој“, обећава „благо тајно и богатство сакривено“ и најављује: „врата бронзана разбићу“; Јеремија је прорекао: „Господ подиже дух царева мидских“. Кирова прва година као краља Вавилона почела је у пролеће 538. п. н. е.: то је година коју Јездра у указу о ослобађању изгнаника зове „Прве године Кира“."
  hu:
    - "Kr. e. 539. október 12-én, a babiloni krónika saját keltezése szerint: Tisri hónap tizenhatodik napján Ugbaru, Gutium helytartója és Círusz serege csata nélkül bevonult Babilonba, Círusz maga tizenhét nappal később, október 29-én lépett a városba. A térkép Babilonnál áll, Kr. e. 539-ben. Babilon Jeruzsálemtől egyenes vonalban mintegy 870 km-re keletre van."
    - "Dániel egyetlen éjszakára teszi a bukást. Belsazár „nagy lakomát szerze az ő ezer főemberének”, ivott a Templom edényeiből, és látta a kezet írni a falra: „Peresz, azaz elosztatott a te országod és adatott a médeknek és persáknak.” „Ugyanazon az éjszakán megöleték Belsazár, a Káldeusok királya. És a méd Dárius foglalá el az országot.” Az ékírásos feljegyzések igazolják a keretet: Belsazár Nabonidus, az utolsó király fia volt, aki rá bízta Babilont arra a tíz évre, amelyet Arábiában, Témában töltött, ezért kínálhatott Dánielnek csak a harmadik helyet az országban; Hérodotosz és Xenophón nem ismerték a nevét. A méd Dáriust, aki más feljegyzésben nem szerepel, egyesek Gubaru helytartóval azonosítják, mások magával Círusszal más néven, sok bíráló pedig a későbbi I. Dáriusszal való összetévesztésnek tartja; a kérdés nyitott."
    - "A Nabonidus-krónika szerint Círusz a Tigris menti Opisznál legyőzte a babiloniakat, Tisri tizennegyedikén harc nélkül bevette Szippart, Nabonidus elmenekült, és két nappal később Ugbaru csapatai bevonultak Babilonba; Nabonidust visszatértekor elfogták; a Círusz-henger szerint maga Marduk engedte be a királyt csata nélkül. Hérodotosz és Xenophón szerint a perzsák az elterelt Eufrátesz medrében, ünnep idején jutottak be, amit sokan kétségbe vonnak. Ézsaiás szerint az Úr Círusznak ezt mondja: „Pásztorom!”, és „az Úr felkentjéhez” szól (Ézs 44,28; 45,1), akinek ígéri: „Néked adom a sötétségnek kincseit”, és „az érczajtókat összetöröm”; Jeremiás megjövendölte, hogy „felindította az Úr a Médiabeli királyok lelkét” Babilon ellen. Círusz mint babiloni király első éve Kr. e. 538 tavaszán kezdődött: ebben kelt Ezsdrás szerint a száműzötteket szabadon engedő rendelet."
  fi:
    - "12. lokakuuta 539 eaa. Babylonian kronikan oman ajoituksen mukaan: Tishri-kuun kuudentenatoista päivänä Gutiumin käskynhaltija Ugbaru ja Kyyroksen armeija astuivat Babyloniin ilman taistelua, ja Kyyros itse tuli kaupunkiin seitsemäntoista päivää myöhemmin, 29. lokakuuta. Kartta on Babylonissa vuonna 539 eaa. Babylon on noin 870 km Jerusalemista itään linnuntietä."
    - "Daniel sijoittaa kukistumisen yhteen yöhön. Belsassar ”laittoi suuret pidot tuhannelle ylimyksellensä”, joi temppelin astioista ja näki käden kirjoittavan seinälle: ”Peres: sinun valtakuntasi on pirstottu ja annettu meedialaisille ja persialaisille.” ”Samana yönä tapettiin Belsassar, kaldealaisten kuningas, ja Daarejaves, meedialainen, sai haltuunsa valtakunnan.” Nuolenpääkirjoitukset vahvistavat kehyksen: Belsassar oli viimeisen kuninkaan Nabonidoksen poika, jonka vastuulle Babylon jäi isän oleskellessa kymmenen vuotta Temassa Arabiassa, minkä vuoksi hän saattoi tarjota Danielille vain kolmatta sijaa valtakunnassa; Herodotos ja Xenofon eivät tunne hänen nimeään. ”Daarejaves, meedialainen”, joka ei esiinny muualla, on jonkun mukaan käskynhaltija Gubaru, toisten Kyyros itse toisella nimellä, monien kriitikoiden sekaannus myöhempään Dareios I:een; kysymys on avoin."
    - "Nabonidoksen kronikan mukaan Kyyros voitti babylonialaiset Opiksessa Tigrisillä, valtasi Sipparin taistelutta Tishrin neljäntenätoista päivänä, Nabonidos pakeni ja kaksi päivää myöhemmin Ugbarun joukot astuivat Babyloniin; Nabonidos vangittiin palatessaan, ja Kyyroksen sylinterin mukaan Marduk itse päästi kuninkaan sisään ilman taistelua. Herodotos ja Xenofon lisäävät persialaisten tulleen sisään käännetyn Eufratin uomaa pitkin juhlan aikana, mitä monet epäilevät. Jesajan Herra kutsuu Kyyrosta ”Minun paimeneni!” ja ”voidellulleen”, lupaa ”aarteet pimeän peitosta” ja sanoo: ”minä murran vaskiovet”; Jeremia ennusti, että ”Herra on herättänyt Meedian kuningasten hengen” Babylonia vastaan. Kyyroksen ensimmäinen vuosi Babylonin kuninkaana alkoi keväällä 538 eaa.; se on Esran vapautuskäskyn aika: ”Kooreksen, Persian kuninkaan, ensimmäisenä hallitusvuotena”."
  vi:
    - "Ngày 12 tháng 10 năm 539 TCN, theo niên đại của chính biên niên sử Ba-by-lôn: vào ngày mười sáu tháng Tishri, Ugbaru, tổng đốc Gutium, và quân của Si-ru vào Ba-by-lôn không có trận đánh, và chính Si-ru vào thành mười bảy ngày sau, ngày 29 tháng 10. Bản đồ đặt tại Ba-by-lôn năm 539 TCN. Ba-by-lôn nằm cách Giê-ru-sa-lem khoảng 870 km về phía đông theo đường thẳng."
    - "Đa-ni-ên đặt sự sụp đổ vào một đêm duy nhất. Bên-xát-sa “dọn tiệc lớn đãi một ngàn đại thần mình”, uống bằng các khí dụng của Đền Thờ, và thấy bàn tay viết trên tường: “Phê-rết là: Nước vua bị chia ra, được ban cho người Mê-đi và người Phe-rơ-sơ.” “Ngay đêm đó, vua người Canh-đê là Bên-xát-sa bị giết. Rồi Đa-ri-út là người Mê-đi được nước.” Các văn bản chữ hình nêm xác nhận khung cảnh ấy: Bên-xát-sa là con của Nabonidus, vị vua cuối cùng, người giao ông cai quản Ba-by-lôn trong mười năm mình ở Thê-ma tại A-ra-bi, vì thế Bên-xát-sa chỉ có thể trao cho Đa-ni-ên vị trí thứ ba trong nước; Herodotus và Xenophon không biết tên ông. “Đa-ri-út là người Mê-đi”, không có trong văn bản nào khác, bị một số người cho là Gubaru tổng đốc, bị người khác cho là chính Si-ru dưới tên khác, và bị nhiều nhà phê bình cho là nhầm lẫn với Đa-ri-út I về sau; vấn đề còn bỏ ngỏ."
    - "Biên niên sử Nabonidus nói Si-ru đánh bại người Ba-by-lôn tại Opis bên sông Hi-đê-ke, chiếm Sippar không giao chiến vào ngày mười bốn tháng Tishri, Nabonidus bỏ chạy, và hai ngày sau quân Ugbaru vào Ba-by-lôn; Nabonidus bị bắt khi trở về, và Trụ Si-ru tuyên bố chính thần Marduk cho nhà vua vào mà không giao chiến. Herodotus và Xenophon thêm rằng người Phe-rơ-sơ vào theo lòng sông Ơ-phơ-rát đã dẫn dòng trong một lễ hội, điều nhiều người nghi ngờ. Ê-sai gọi Si-ru là “người chăn chiên” của Chúa và “người xức dầu của Ngài”, người sẽ được ban “vật báu chứa trong nơi tối” và Chúa sẽ “phá vỡ các cửa bằng đồng” trước mặt người; Giê-rê-mi báo trước rằng “Đức Giê-hô-va đã giục lòng các vua ở Mê-đi” nghịch cùng Ba-by-lôn. Năm đầu Si-ru làm vua Ba-by-lôn bắt đầu mùa xuân năm 538 TCN: đó là “năm thứ nhất đời Si-ru” trong sắc chỉ của E-xơ-ra cho những người bị đày trở về."
  ro:
    - "La 12 octombrie 539 î.Hr., după datarea cronicii babiloniene însăși: în a șaisprezecea zi a lunii Tișri, Ugbaru, guvernatorul Gutiumului, și armata lui Cir au intrat în Babilon fără luptă, iar Cir însuși a intrat în oraș șaptesprezece zile mai târziu, la 29 octombrie. Harta stă la Babilon, în 539 î.Hr. Babilonul se află la circa 870 km est de Ierusalim în linie dreaptă."
    - "Daniel așază căderea într-o singură noapte. Belșațar „făcut-a cină mare boierilor săi o mie”, a băut din vasele Templului și a văzut mâna scriind pe zid: „Fares: împărțitu-s’a împărățiea ta, și s’a dat Midilor și Persilor.” „Într’această noapte s’a omorît împăratul Valtasar Haldeul. Și Darie Medul a luat împărățiea.” Înscrisurile cuneiforme confirmă cadrul: Belșațar era fiul lui Nabonid, ultimul rege, care l-a lăsat la conducerea Babilonului în cei zece ani petrecuți la Tema, în Arabia, de aceea Belșațar putea să-i ofere lui Daniel doar locul al treilea în regat; Herodot și Xenofon nu i-au cunoscut numele. „Darie Medul”, care nu apare în nicio altă mărturie, este socotit de unii Gubaru guvernatorul, de alții Cir însuși sub alt nume, iar de mulți critici o confuzie cu Darius I de mai târziu; întrebarea rămâne deschisă."
    - "Cronica lui Nabonid spune că Cir i-a învins pe babilonieni la Opis, pe Tigru, a luat Sippar fără luptă la 14 Tișri, că Nabonid a fugit și că două zile mai târziu trupele lui Ugbaru au intrat în Babilon; Nabonid a fost prins la întoarcere, iar Cilindrul lui Cir pretinde că Marduk însuși l-a lăsat să intre fără bătălie. Herodot și Xenofon adaugă că perșii au intrat pe albia Eufratului abătut, în timpul unei sărbători, poveste îndoielnică. Isaia îl numise pe Cir păstorul Domnului și unsul Lui („unsului meu Kir”), căruia Domnul avea să-i dea „vistierii întunecate, ascunse” și înaintea căruia avea să zdrobească „ușile cele de aramă”; Ieremia a prevestit că Domnul va stârni duhul regilor mezilor împotriva Babilonului. Primul an al lui Cir ca rege al Babilonului începe în primăvara lui 538 î.Hr.: acesta este „anul dintâiu al lui Kir” din decretul lui Ezra al eliberării surghiuniților."
  bg:
    - "На 12 октомври 539 г. пр.н.е. по датировката на самата вавилонска хроника: на шестнадесетия ден от месец тишри Угбару, управителят на Гутиум, и войската на Кир влезли във Вавилон без битка, а самият Кир влязъл в града седемнадесет дни по-късно, на 29 октомври. Картата стои на Вавилон през 539 г. пр.н.е. Вавилон е на около 870 км източно от Йерусалим по права линия."
    - "Даниил поставя падането в една-единствена нощ. Валтасар „направи голямо пируване на тисяща от големците си“, пил от съдовете на Храма и видял ръката да пише на стената: „ФЕРЕС: Раздели се царството ти, и се даде на Мидяните и Персяните.“ „Истата нощ биде убит Валтасар царят на Халдейците. И взе царството Дарий Мидянинът“. Клинописните записи потвърждават рамката: Валтасар бил син на Набонид, последния цар, който го оставил да управлява Вавилон през десетте години, прекарани в Тема в Арабия — затова Валтасар можел да предложи на Даниил само третото място в царството; Херодот и Ксенофонт не знаят името му. „Дарий Мидянинът“, който не се среща в никой друг запис, едни отъждествяват с управителя Губару, други — със самия Кир под друго име, а много критици смятат за смесване с по-късния Дарий I; въпросът е открит."
    - "Хрониката на Набонид казва, че Кир разбил вавилонците при Опис на Тигър, превзел Сипар без бой на четиринадесети тишри, че Набонид избягал и че два дни по-късно войските на Угбару влезли във Вавилон; Набонид бил заловен при връщането си, а Цилиндърът на Кир твърди, че сам Мардук пуснал царя без битка. Херодот и Ксенофонт добавят, че персите влезли по коритото на отклонения Ефрат по време на празник — разказ, в който мнозина се съмняват. Исаия нарекъл Кир „пастир мой“ и Господен „помазаник“, комуто ще бъдат дадени „съкровища пазени в тъмнина“ и комуто Господ казва: „Ще съкруша медните двери“; Йеремия предрекъл, че „Господ събуди духа на Мидските царе“ срещу Вавилон. Първата година на Кир като цар на Вавилон започнала през пролетта на 538 г. пр.н.е.: това е „първото лето на Кира“ от указа в Ездра, който освободил изгнаниците."
