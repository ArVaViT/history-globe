id: where-was-thessalonica
question:
  en: "Where was Thessalonica?"
  ru: "Где находилась Фессалоника?"
  uk: "Де була Солунь?"
  es: "¿Dónde estaba Tesalónica?"
  pt: "Onde ficava Tessalônica?"
  de: "Wo lag Thessalonich?"
  fr: "Où se trouvait Thessalonique ?"
answer:
  en:
    - "Thessalonica is the city of Thessaloniki in northern Greece, at the head of the Thermaic Gulf; the map point stands on it. It was the capital of the Roman province of Macedonia and lay on the Via Egnatia, the road from the Adriatic to Byzantium, about 120 km west of Philippi and 64 km from Berea in a straight line; Athens, which Paul reached by way of Berea and the sea, was about 300 km to the south."
    - "Paul came along the Egnatian road: “when they had passed through Amphipolis and Apollonia, they came to Thessalonica, where was a synagogue of the Jews”, and for three sabbaths he argued there from the scriptures. A mob dragged his host Jason “unto the rulers of the city, crying, These that have turned the world upside down are come hither also”, and accused the preachers of “saying that there is another king, one Jesus”. Luke's word for the rulers, politarchs, was once thought his mistake; it has since turned up in more than thirty inscriptions of Macedonia, one of them on the city's Vardar Gate, now in the British Museum, naming the politarchs of Thessalonica. The church Paul left behind received his earliest surviving letter, and its faith “sounded out… not only in Macedonia and Achaia, but also in every place”."
    - "Cassander founded the city about 315 BC, gathering the people of the villages around the gulf, and named it for his wife Thessalonike, Alexander the Great's half-sister. Rome made it the seat of the province in 146 BC and a free city after the battle of Philippi in 42 BC, which is why it was governed by its own magistrates and not by a Roman garrison. Unlike Philippi it never fell empty, so the ancient city lies under the modern one; the Roman forum, with its odeon, was excavated in the 1960s in the city centre."
  ru:
    - "Фессалоника — это город Салоники на севере Греции, в глубине Термического залива; точка карты стоит на нём. Это была столица римской провинции Македония, и она лежала на Эгнатиевой дороге, ведущей от Адриатики к Византию, примерно в 120 км к западу от Филипп и в 64 км от Верии по прямой; Афины, куда Павел попал через Верию и морем, лежали примерно в 300 км к югу."
    - "Павел пришёл по Эгнатиевой дороге: «Прошедши через Амфиполь и Аполлонию, они пришли в Фессалонику, где была Иудейская синагога», и три субботы говорил там из Писаний. Толпа повлекла его хозяина Иасона «к городским начальникам, крича, что эти всесветные возмутители пришли и сюда», и обвинила проповедников в том, что они почитают «другого царем, Иисуса». Слово Луки для начальников — политархи — когда-то считали его ошибкой; с тех пор оно найдено более чем в тридцати надписях Македонии, одна из них — с городских Вардарских ворот, ныне в Британском музее, — называет политархов Фессалоники. Церковь, которую оставил Павел, получила самое раннее из его сохранившихся посланий, и от неё «пронеслось слово Господне не только в Македонии и Ахаии, но и во всяком месте»."
    - "Кассандр основал город около 315 г. до н. э., собрав жителей селений вокруг залива, и назвал его в честь жены Фессалоники, единокровной сестры Александра Великого. Рим сделал его центром провинции в 146 г. до н. э. и свободным городом после битвы при Филиппах в 42 г. до н. э. — потому им правили собственные магистраты, а не римский гарнизон. В отличие от Филипп, он никогда не пустел, так что древний город лежит под современным; римский форум с одеоном раскопали в 1960-х годах в центре города."
  uk:
    - "Солунь (грец. Фессалоніка) — це нинішнє місто Солунь на півночі Греції, на вершині Термейської затоки; точка на мапі стоїть на ньому. Це була столиця римської провінції Македонія і лежала на Егнатієвій дорозі, шляху від Адріатики до Візантія, приблизно за 120 км на захід від Філіпп і за 64 км від Верії по прямій; Афіни, до яких Павло дістався через Верію й морем, лежали приблизно за 300 км на південь."
    - "Павло прийшов Егнатієвою дорогою: «Перейшовши ж Амфиполь та Аполонию, прийшли в Солунь, де була школа Жидівська», і три суботи розмовляв там з Писань. Натовп поволік його господаря Ясона «до городської старшини, гукаючи: Ті, що заколотили вселенну, і сюди поприходили» і звинуватив проповідників у тому, що вони «говорять, що єсть иншій цар, Ісус». Слово Луки для урядовців, політархи, колись вважали його помилкою; відтоді воно з'явилося в понад тридцяти написах Македонії, один із них на Вардарській брамі міста, нині в Британському музеї, називає політархів Солуні. Церква, яку залишив Павло, отримала його найраніший збережений лист, і про її віру сказано: «Од вас бо промчало ся слово Господнє не тілько в Македониї і Ахаї, та й у всяке місце»."
    - "Кассандр заснував місто близько 315 р. до н. е., зібравши жителів сіл навколо затоки, і назвав його на честь своєї дружини Фессалонікеї, зведеної сестри Александра Великого. Рим зробив його столицею провінції 146 р. до н. е., а вільним містом після битви при Філіппах 42 р. до н. е., тому ним керували власні магістрати, а не римський гарнізон. На відміну від Філіпп, воно ніколи не спорожніло, тож давнє місто лежить під сучасним; римський форум з одеоном було розкопано в 1960-х рр. у центрі міста."
  es:
    - "Tesalónica es la ciudad de Salónica, en el norte de Grecia, en la cabecera del golfo Termaico; el punto del mapa está sobre ella. Era la capital de la provincia romana de Macedonia y estaba en la vía Egnatia, el camino del Adriático a Bizancio, a unos 120 km al oeste de Filipos y a 64 km de Berea en línea recta; Atenas, a donde Pablo llegó por Berea y por mar, quedaba a unos 300 km al sur."
    - "Pablo llegó por el camino de la Egnatia: «pasando por Amphípolis y Apolonia, llegaron á Tesalónica, donde estaba la sinagoga de los Judíos», y durante tres sábados disputó allí desde las Escrituras. Una turba arrastró a su anfitrión Jasón «á los gobernadores de la ciudad, dando voces: Estos que alborotan el mundo, también han venido acá», y acusó a los predicadores, «diciendo que hay otro rey, Jesús». La palabra de Lucas para los gobernantes, politarcas, se tuvo una vez por error suyo; desde entonces aparece en más de treinta inscripciones de Macedonia, una, de la puerta del Vardar, hoy en el Museo Británico, nombra a los politarcas de Tesalónica. La iglesia que Pablo dejó recibió su carta más antigua conservada, que dice de ella: «ha sido divulgada la palabra del Señor no sólo en Macedonia y en Acaya, mas aun en todo lugar vuestra fe en Dios se ha extendido»."
    - "Casandro fundó la ciudad hacia 315 a. C., reuniendo a la gente de las aldeas en torno al golfo, y le puso el nombre de su esposa Tesalónica, hermanastra de Alejandro Magno. Roma la hizo sede de la provincia en 146 a. C. y ciudad libre tras la batalla de Filipos en 42 a. C., razón por la que la gobernaban sus propios magistrados y no una guarnición romana. A diferencia de Filipos, nunca quedó vacía, de modo que la ciudad antigua yace bajo la moderna; el foro romano, con su odeón, se excavó en la década de 1960 en el centro de la ciudad."
  pt:
    - "Tessalônica é a cidade de Tessalônica (Thessaloniki), no norte da Grécia, na cabeceira do golfo Termaico; o ponto do mapa fica sobre ela. Era a capital da província romana da Macedônia e ficava na Via Egnatia, a estrada do Adriático a Bizâncio, a cerca de 120 km a oeste de Filipos e 64 km de Bereia em linha reta; Atenas, que Paulo alcançou por Bereia e pelo mar, ficava a cerca de 300 km ao sul."
    - "Paulo veio pela estrada Egnatia: “Depois de passarem por Anfípolis e Apolônia, chegaram a Tessalônica, onde havia uma sinagoga judaica”, e por três sábados argumentou ali a partir das Escrituras. Uma turba arrastou seu anfitrião Jasão “perante as autoridades da cidade, clamando: Estes que têm virado o mundo de cabeça para baixo chegaram também aqui”, e acusou os pregadores, “dizendo que há outro rei, Jesus!” A palavra de Lucas para as autoridades, politarcas, já foi tida por erro seu; desde então apareceu em mais de trinta inscrições da Macedônia, uma delas na Porta de Vardar da cidade, hoje no Museu Britânico, nomeando os politarcas de Tessalônica. A igreja que Paulo deixou recebeu a sua mais antiga carta conservada, e sua fé “se propagou a partir de vocês, não apenas na Macedônia e na Acaia, mas em todo lugar”."
    - "Cassandro fundou a cidade por volta de 315 a.C., reunindo o povo das aldeias em torno do golfo, e deu-lhe o nome de sua esposa Tessalonice, meia-irmã de Alexandre, o Grande. Roma fez dela a sede da província em 146 a.C. e cidade livre depois da batalha de Filipos, em 42 a.C., razão pela qual era governada por seus próprios magistrados e não por uma guarnição romana. Ao contrário de Filipos, nunca ficou vazia, de modo que a cidade antiga jaz sob a moderna; o fórum romano, com seu odeão, foi escavado na década de 1960 no centro da cidade."
  de:
    - "Thessalonich ist die Stadt Thessaloniki in Nordgriechenland am Kopf des Thermaischen Golfs; der Kartenpunkt steht darauf. Es war die Hauptstadt der römischen Provinz Mazedonien und lag an der Via Egnatia, der Straße von der Adria nach Byzanz, in der Luftlinie etwa 120 km westlich von Philippi und 64 km von Beröa; Athen, das Paulus über Beröa und das Meer erreichte, lag etwa 300 km südlich."
    - "Paulus kam auf der Egnatischen Straße: „Nachdem sie aber durch Amphipolis und Apollonia gereist waren, kamen sie gen Thessalonich; da war eine Judenschule“, und drei Sabbate lang redete er dort aus der Schrift. Ein Pöbel schleifte seinen Gastgeber Jason „vor die Obersten der Stadt und schrieen: Diese, die den ganzen Weltkreis erregen, sind auch hergekommen“, und warf den Predigern vor, sie „sagen, ein anderer sei der König, nämlich Jesus“. Lukas’ Wort für die Obersten, Politarchen, galt einst als sein Irrtum; es erscheint seither in über dreißig Inschriften Mazedoniens, eine davon am Vardartor der Stadt, jetzt im Britischen Museum, mit den Politarchen von Thessalonich. Die von Paulus zurückgelassene Gemeinde erhielt seinen ältesten erhaltenen Brief, und von ihr heißt es: „auserschollen das Wort des HERRN; nicht allein in Mazedonien und Achaja, sondern an allen Orten“."
    - "Kassander gründete die Stadt um 315 v. Chr., indem er die Bewohner der Dörfer rund um den Golf versammelte, und benannte sie nach seiner Frau Thessalonike, der Halbschwester Alexanders des Großen. Rom machte sie 146 v. Chr. zum Sitz der Provinz und nach der Schlacht von Philippi 42 v. Chr. zur freien Stadt, weshalb sie von eigenen Magistraten regiert wurde und nicht von einer römischen Garnison. Anders als Philippi fiel sie nie leer, sodass die antike Stadt unter der modernen liegt; das römische Forum mit seinem Odeon wurde in den 1960er-Jahren im Stadtzentrum ausgegraben."
  fr:
    - "Thessalonique est la ville de Thessalonique, dans le nord de la Grèce, au fond du golfe Thermaïque ; le point de la carte s’y trouve. Elle était la capitale de la province romaine de Macédoine et se trouvait sur la voie Égnatienne, la route de l’Adriatique à Byzance, à environ 120 km à l’ouest de Philippes et à 64 km de Bérée à vol d’oiseau ; Athènes, que Paul gagna par Bérée et la mer, était à environ 300 km au sud."
    - "Paul vint par la voie Égnatienne : ils « passèrent par Amphipolis et Apollonie, et ils arrivèrent à Thessalonique, où les Juifs avaient une synagogue », et il y discuta trois sabbats d’après les Écritures. Une foule traîna son hôte Jason « devant les magistrats de la ville, en criant : Ces gens, qui ont bouleversé le monde, sont aussi venus ici », et accusa les prédicateurs de dire « qu’il y a un autre roi, Jésus ». Le mot de Luc pour les magistrats, politarques, passa pour une erreur ; on le trouve depuis dans plus de trente inscriptions de Macédoine, dont une, sur la porte du Vardar (British Museum), nomme les politarques de Thessalonique. L’Église que Paul y laissa reçut sa plus ancienne lettre conservée ; Paul leur écrit : « la parole du Seigneur a retenti de chez vous dans la Macédoine et dans l’Achaïe, mais votre foi en Dieu s’est fait connaître en tout lieu »."
    - "Cassandre fonda la ville vers 315 av. J.-C., en rassemblant les habitants des villages autour du golfe, et la nomma d’après son épouse Thessalonikè, demi-sœur d’Alexandre le Grand. Rome en fit le siège de la province en 146 av. J.-C. et une ville libre après la bataille de Philippes en 42 av. J.-C., ce qui explique qu’elle fût gouvernée par ses propres magistrats et non par une garnison romaine. À la différence de Philippes, elle ne fut jamais abandonnée, de sorte que la ville antique gît sous la moderne ; le forum romain, avec son odéon, fut fouillé dans les années 1960 au centre-ville."
