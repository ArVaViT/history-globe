id: how-big-was-solomons-kingdom
question:
  en: "How big was Solomon's kingdom?"
  ru: "Насколько велико было царство Соломона?"
  uk: "Якого розміру було царство Соломона?"
  es: "¿Qué extensión tenía el reino de Salomón?"
  pt: "Qual era o tamanho do reino de Salomão?"
  de: "Wie groß war das Reich Salomos?"
  fr: "Quelle était la taille du royaume de Salomon ?"
  pl: "Jak duże było królestwo Salomona?"
  it: "Quanto era grande il regno di Salomone?"
  nl: "Hoe groot was het koninkrijk van Salomo?"
  cs: "Jak velké bylo Šalomounovo království?"
  sv: "Hur stort var Salomos rike?"
  nb: "Hvor stort var Salomos rike?"
  tl: "Gaano kalaki ang kaharian ni Salomon?"
  da: "Hvor stort var Salomos rige?"
  sr: "Колико је било велико Соломуново краљевство?"
answer:
  en:
    - "As the Bible describes it, Israel and Judah themselves ran “from Dan even to Beer-sheba”, about 236 km from north to south in a straight line, while Solomon's rule over vassal kings reached “from Tiphsah even to Azzah”, from Thapsacus on the Euphrates to Gaza, about 600 km, and his gathering at the Temple came “from the entering in of Hamath unto the river of Egypt”, about 415 km. How much of this was a real state is one of the most disputed questions of biblical archaeology: views range from a regional power of the tenth century BC to a small highland kingdom around Jerusalem."
    - "Kings says that “Solomon reigned over all kingdoms from the river unto the land of the Philistines, and unto the border of Egypt: they brought presents, and served Solomon all the days of his life”, the bounds once promised to Abraham, “from the river of Egypt unto the great river, the river Euphrates”. Within Israel twelve officers each supplied the court for a month. His ships sailed from Ezion-geber “on the shore of the Red sea, in the land of Edom”, about 430 km from Dan, and Chronicles credits him with building Tadmor, Palmyra, in the Syrian desert, about 420 km from Jerusalem. Kings also tells that the empire was slipping: Hadad the Edomite rose against him, and Rezon and his band “reigned in Damascus”, and he “was an adversary to Israel all the days of Solomon”."
    - "Archaeology has not settled it. Yigael Yadin dated the matching gates of Hazor, Megiddo and Gezer to Solomon, as the cities named in 1 Kings 9:15; Israel Finkelstein's low chronology moves them to the ninth century and the house of Omri, and sees Solomon's Jerusalem as a modest town. Others, citing the stepped stone structure and large buildings on the City of David ridge, the fortress at Khirbet Qeiyafa and the copper mines of the Arabah, argue for a real tenth-century state, while most agree that the vassal empire is told in the language of royal ideal. No inscription of Solomon has been found. The map uses about 950 BC, within his reign of about 970–931 BC."
  ru:
    - "По библейскому описанию, сами Израиль и Иуда простирались «от Дана до Вирсавии», примерно на 236 км с севера на юг по прямой, а власть Соломона над подвластными царями шла «от Типсаха до Газы», от Фапсака на Евфрате до Газы, — около 600 км, и на праздник при храме собрались «от входа в Емаф до реки Египетской» — около 415 км. Насколько всё это было действительным государством — один из самых спорных вопросов библейской археологии: взгляды колеблются от региональной державы X века до н. э. до небольшого горного царства вокруг Иерусалима."
    - "Книга Царств говорит: «Соломон владел всеми царствами от реки Евфрата до земли Филистимской и до пределов Египта. Они приносили дары и служили Соломону во все дни жизни его», то есть в границах, обещанных Аврааму, «от реки Египетской до великой реки, реки Евфрата». Внутри Израиля двенадцать приставников по месяцу в году снабжали двор. Его корабли выходили из Ецион-Гавера «на берегу Чермного моря, в земле Идумейской», примерно в 430 км от Дана, а Паралипоменон приписывает ему постройку Фадмора, Пальмиры, в Сирийской пустыне, примерно в 420 км от Иерусалима. Книга Царств тоже рассказывает, что держава ускользала: против него поднялся Адер Идумеянин, а Разон со своими людьми «владычествовали в Дамаске», «и был он противником Израиля во все дни Соломона»."
    - "Археология спор не решила. Игаэль Ядин отнёс к Соломону одинаковые ворота Гацора, Мегиддо и Газера — городов, названных в 3-й книге Царств 9:15; «низкая хронология» Израэля Финкельштейна переносит их в IX век, к дому Амврия, и видит в Иерусалиме Соломона скромный город. Другие, ссылаясь на ступенчатое каменное сооружение и большие здания на хребте Города Давида, крепость Хирбет-Кейафа и медные рудники Аравы, отстаивают действительное государство X века, хотя большинство согласно, что подвластная держава описана языком царского идеала. Надписей Соломона не найдено. Карта берёт около 950 г. до н. э., в пределах его царствования, около 970–931 гг. до н. э."
  uk:
    - "Як описує його Біблія, сам Ізраїль із Юдою простягався «від Дану та й до Берсабиї», приблизно 236 км з півночі на південь по прямій, тоді як влада Соломона над васальними царями сягала «від Типсаха до Гази», від Тапсака на Євфраті до Гази, приблизно 600 км, а його збір при Храмі відбувся від входу в Хамат до річки Єгипетської, приблизно 415 км. Яка частина цього була справжньою державою — одне з найспірніших питань біблійної археології: погляди коливаються від регіональної держави X ст. до н. е. до невеликого гірського царства навколо Єрусалиму."
    - "У книзі Царів сказано, що «царював Соломон над усїма царствами од Евфрат-ріки до землї Филистійської й до границь Египецьких. Вони приносили гостинцї й служили Соломонові, покіль віку його», — межі, колись обіцяні Авраамові: «од ріки Египецької до ріки великої, ріки Евфрата». Усередині Ізраїлю дванадцять урядників по черзі, кожен місяць, постачали двір. Його кораблі відпливали з Еціон-Гевера «на березї Червоного моря в Едом-землї», приблизно за 430 км від Дана, а Хроніки приписують йому будівництво Тадмора, Пальміри, в Сирійській пустелі, приблизно за 420 км від Єрусалиму. Книга Царів розповідає й про те, що імперія розсипалася: проти нього повстав едомлянин Адер, а Разон з ватагою «зробили його царем у Дамаску», і він «був … противником Ізраїля, покіль було й віку Соломонового»."
    - "Археологія питання не вирішила. Ігаел Ядін датував однакові брами Гацора, Мегіддо й Гезера часами Соломона, як міста, названі в 1 Цар 9:15; низька хронологія Ізраеля Фінкельштайна відносить їх до IX ст. і дому Омрі та бачить в Єрусалимі Соломона скромне містечко. Інші, посилаючись на ступінчасту кам'яну споруду та великі будівлі на гребені Міста Давида, фортецю в Хірбет-Кейяфі та мідні копальні Арави, обстоюють справжню державу X ст. до н. е., тоді як більшість погоджується, що васальна імперія змальована мовою царського ідеалу. Жодного напису Соломона не знайдено. Мапа використовує близько 950 р. до н. е., у межах його царювання близько 970–931 рр. до н. е."
  es:
    - "Tal como lo describe la Biblia, Israel y Judá propiamente dichos iban «desde Dan hasta Beer-seba», unos 236 km de norte a sur en línea recta, mientras que el dominio de Salomón sobre reyes vasallos llegaba «desde Tiphsa hasta Gaza», desde Tapsaco, en el Éufrates, hasta Gaza, unos 600 km, y su asamblea en el Templo vino «desde como entran en Hamath hasta el río de Egipto», unos 415 km. Cuánto de todo esto fue un estado real es una de las cuestiones más disputadas de la arqueología bíblica: las opiniones van desde una potencia regional del siglo X a. C. hasta un pequeño reino de las tierras altas en torno a Jerusalén."
    - "Reyes dice que «Salomón señoreaba sobre todos los reinos, desde el río de la tierra de los Filisteos hasta el término de Egipto: y traían presentes, y sirvieron á Salomón todos los días que vivió», los límites prometidos una vez a Abraham, «desde el río de Egipto hasta el río grande, el río Eufrates». Dentro de Israel, doce gobernadores abastecían cada uno a la corte durante un mes. Sus naves zarpaban de Ezión-geber, «en la ribera del mar Bermejo, en la tierra de Edom», a unos 430 km de Dan, y Crónicas le atribuye la construcción de Tadmor, Palmira, en el desierto de Siria, a unos 420 km de Jerusalén. Reyes cuenta también que el imperio se deshacía: Adad el edomita se alzó contra él, y Rezón, con su banda, hecho rey en Damasco, «fué adversario á Israel todos los días de Salomón»."
    - "La arqueología no ha zanjado la cuestión. Yigael Yadin fechó en tiempos de Salomón las puertas gemelas de Hazor, Meguido y Gezer, como las ciudades nombradas en 1 Reyes 9:15; la cronología baja de Israel Finkelstein las traslada al siglo IX y a la casa de Omri, y ve la Jerusalén de Salomón como una población modesta. Otros, citando la estructura de piedra escalonada y los grandes edificios de la loma de la Ciudad de David, la fortaleza de Khirbet Qeiyafa y las minas de cobre de la Arabá, defienden un estado real del siglo X a. C., mientras que la mayoría coincide en que el imperio vasallo está contado en el lenguaje del ideal real. No se ha hallado ninguna inscripción de Salomón. El mapa usa hacia el 950 a. C., dentro de su reinado de hacia 970–931 a. C."
  pt:
    - "Segundo a descrição bíblica, o próprio Israel com Judá ia “desde Dã até Berseba”, cerca de 236 km de norte a sul em linha reta, enquanto o domínio de Salomão sobre reis vassalos chegava “desde Tifsa até Gaza”, de Tapsaco, no Eufrates, a Gaza, cerca de 600 km, e a sua assembleia no Templo veio “desde a entrada de Hamate até o ribeiro do Egito”, cerca de 415 km. Quanto disso foi um Estado real é uma das questões mais disputadas da arqueologia bíblica: as opiniões vão de uma potência regional do século X a.C. a um pequeno reino de montanha em torno de Jerusalém."
    - "Reis diz que “Salomão governava sobre todos os reinos, desde o Rio até a terra dos filisteus, e até a fronteira do Egito. Eles traziam tributo e serviram a Salomão todos os dias de sua vida”, os limites prometidos outrora a Abraão, “desde o rio do Egito até o grande rio, o rio Eufrates”. Dentro de Israel, doze oficiais abasteciam a corte, cada um por um mês. Seus navios partiam de Eziom-Geber, “na margem do mar Vermelho, na terra de Edom”, a cerca de 430 km de Dã, e Crônicas lhe atribui a construção de Tadmor, Palmira, no deserto da Síria, a cerca de 420 km de Jerusalém. Reis conta também que o império se desfazia: Hadade, o edomita, levantou-se contra ele, e Rezom e seu bando “reinaram em Damasco”, e foi “um adversário de Israel todos os dias de Salomão”."
    - "A arqueologia não resolveu a questão. Yigael Yadin datou de Salomão os portões iguais de Hazor, Megido e Gezer, como as cidades citadas em 1 Reis 9:15; a cronologia baixa de Israel Finkelstein os leva para o século IX e a casa de Onri, e vê a Jerusalém de Salomão como uma cidade modesta. Outros, citando a estrutura de pedra em degraus e os grandes edifícios na crista da Cidade de Davi, a fortaleza de Khirbet Qeiyafa e as minas de cobre do Arabá, defendem um Estado real no século X, embora a maioria concorde que o império vassalo é narrado na linguagem do ideal régio. Nenhuma inscrição de Salomão foi encontrada. O mapa usa cerca de 950 a.C., dentro do seu reinado, de cerca de 970–931 a.C."
  de:
    - "Nach der Darstellung der Bibel reichten Israel und Juda selbst „von Dan bis gen Beer-Seba“, etwa 236 km von Nord nach Süd in der Luftlinie, während Salomos Herrschaft über Vasallenkönige „von Tiphsah bis gen Gaza“ reichte, von Tapsakus am Euphrat bis Gaza, etwa 600 km, und seine Versammlung am Tempel kam „von der Grenze Hamaths an bis an den Bach Ägyptens“, etwa 415 km. Wie viel davon ein wirklicher Staat war, gehört zu den umstrittensten Fragen der biblischen Archäologie: Die Ansichten reichen von einer Regionalmacht des 10. Jahrhunderts v. Chr. bis zu einem kleinen Bergkönigreich um Jerusalem."
    - "Im Buch der Könige heißt es: „Also war Salomo ein Herr über alle Königreiche, von dem Strom an bis zu der Philister Lande und bis an die Grenze Ägyptens, die ihm Geschenke zubrachten und ihm dienten sein Leben lang“ – die Grenzen, die einst Abraham verheißen waren, „von dem Wasser Ägyptens an bis an das große Wasser Euphrat“. Innerhalb Israels versorgten zwölf Amtleute den Hof, jeder einen Monat. Seine Schiffe fuhren von Ezjon-Geber „am Ufer des Schilfmeers im Lande der Edomiter“, etwa 430 km von Dan entfernt, und die Chronik schreibt ihm den Bau von Tadmor, Palmyra, in der syrischen Wüste zu, etwa 420 km von Jerusalem. Die Könige berichten auch, dass das Reich zerbröckelte: Hadad, der Edomiter, erhob sich gegen ihn, und Reson und seine Schar „regierten zu Damaskus“, und er „war Israels Widersacher, solange Salomo lebte“."
    - "Die Archäologie hat es nicht entschieden. Yigael Yadin datierte die gleichartigen Tore von Hazor, Megiddo und Geser auf Salomo, als die in 1. Könige 9,15 genannten Städte; Israel Finkelsteins niedrige Chronologie verschiebt sie ins 9. Jahrhundert und in das Haus Omris und sieht in Salomos Jerusalem eine bescheidene Stadt. Andere verweisen auf die Stufensteinstruktur und die großen Bauten auf dem Rücken der Stadt Davids, die Festung von Chirbet Qeiyafa und die Kupferminen der Araba und sprechen sich für einen wirklichen Staat des 10. Jahrhunderts aus, während die meisten darin übereinstimmen, dass das Vasallenreich in der Sprache des königlichen Ideals erzählt wird. Keine Inschrift Salomos ist gefunden worden. Die Karte verwendet etwa 950 v. Chr., innerhalb seiner Regierungszeit von etwa 970–931 v. Chr."
  fr:
    - "Selon la Bible, Israël et Juda proprement dits s’étendaient « depuis Dan jusqu’à Beer-Schéba », environ 236 km du nord au sud en ligne droite, tandis que la domination de Salomon sur les rois vassaux allait « depuis Thiphsach jusqu’à Gaza », de Thapsaque sur l’Euphrate à Gaza, environ 600 km, et que l’assemblée réunie au Temple venait « depuis les environs de Hamath jusqu’au torrent d’Égypte », environ 415 km. Dans quelle mesure il s’agissait d’un État réel est l’une des questions les plus disputées de l’archéologie biblique : les avis vont d’une puissance régionale du Xe siècle av. J.-C. à un petit royaume de montagne autour de Jérusalem."
    - "Les Rois disent que « Salomon dominait encore sur tous les royaumes depuis le fleuve jusqu’au pays des Philistins et jusqu’à la frontière d’Égypte ; ils apportaient des présents, et ils furent assujettis à Salomon tout le temps de sa vie », limites promises jadis à Abraham, « depuis le fleuve d’Égypte jusqu’au grand fleuve, au fleuve d’Euphrate ». En Israël, douze intendants pourvoyaient chacun un mois la cour. Ses navires partaient d’Étsjon-Guéber, « sur les bords de la mer Rouge, dans le pays d’Édom », à environ 430 km de Dan, et les Chroniques lui attribuent la construction de Thadmor, Palmyre, dans le désert de Syrie, à environ 420 km de Jérusalem. Les Rois racontent aussi que l’empire se lézardait : Hadad l’Édomite se leva contre lui, Rezon et sa bande « régnèrent à Damas », et « il fut un ennemi d’Israël pendant toute la vie de Salomon »."
    - "L’archéologie n’a pas tranché. Yigael Yadin attribuait à Salomon les portes identiques de Hatsor, de Meguiddo et de Guézer, villes citées en 1 Rois 9:15 ; la chronologie basse d’Israel Finkelstein les ramène au IXe siècle et à la maison d’Omri, et voit dans la Jérusalem de Salomon une modeste bourgade. D’autres, invoquant la structure en pierre à gradins et les grands édifices de la crête de la Cité de David, la forteresse de Khirbet Qeiyafa et les mines de cuivre de l’Araba, plaident pour un véritable État du Xe siècle ; la plupart s’accordent à dire que l’empire vassal est raconté dans le langage de l’idéal royal. Aucune inscription de Salomon n’a été trouvée. La carte retient vers 950 av. J.-C., dans son règne d’environ 970–931 av. J.-C."
  pl:
    - "Według biblijnego opisu sam Izrael i Juda sięgały „od Dan aż do Beerseba”, około 236 km z północy na południe w linii prostej, panowanie Salomona nad podległymi królami sięgało „od Tasfa aż do Gazy”, od Tapsakus nad Eufratem do Gazy, około 600 km, a jego zgromadzenie przy Świątyni przybyło „od wejścia do Emat aż do rzeki Egipskiej”, około 415 km. Ile z tego było prawdziwym państwem, to jedno z najbardziej spornych pytań archeologii biblijnej: poglądy sięgają od regionalnej potęgi X wieku p.n.e. po małe górskie królestwo wokół Jerozolimy."
    - "Księgi Królewskie mówią, że „Salomon panował nad wszystkiemi królestwy od rzeki aż do ziemi Filistyńskiej, i aż do granicy Egipskiej. I przynosili dary, a służyli Salomonowi po wszystkie dni żywota jego” — granice niegdyś obiecane Abrahamowi: „od rzeki Egipskiej, aż do rzeki wielkiej, rzeki Eufrates”. W samym Izraelu dwunastu przełożonych zaopatrywało dwór, każdy przez jeden miesiąc. Jego okręty wypływały z Esjon-Geber „nad brzegiem morza czerwonego, w ziemi Edomskiej”, około 430 km od Dan, a Księgi Kronik przypisują mu zbudowanie Tadmoru, Palmiry, na pustyni syryjskiej, około 420 km od Jerozolimy. Księgi Królewskie opowiadają też, że imperium się wymykało: Hadad Edomita powstał przeciw niemu, a Rezon ze swoją drużyną „królowali nad Damaszkiem”, i on „był przeciwnikiem Izraelowi po wszystkie dni Salomonowe”."
    - "Archeologia nie rozstrzygnęła tej sprawy. Yigael Yadin datował pasujące do siebie bramy Chasoru, Megiddo i Gezer na czasy Salomona, jako miasta wymienione w 1 Krl 9,15; niska chronologia Israela Finkelsteina przesuwa je na IX wiek i dom Omriego, a Jerozolimę Salomona widzi jako skromne miasto. Inni, powołując się na kamienną strukturę schodkową i duże budynki na grzbiecie Miasta Dawida, twierdzę w Chirbet Kajafa i kopalnie miedzi w Arabie, przemawiają za prawdziwym państwem z X wieku, choć większość zgadza się, że imperium wasali opowiedziano językiem ideału królewskiego. Nie znaleziono żadnej inskrypcji Salomona. Mapa przyjmuje rok około 950 p.n.e., w obrębie jego panowania w latach około 970–931 p.n.e."
  it:
    - "Secondo la descrizione biblica, Israele e Giuda stessi si estendevano «da Dan fino a Beer-Sceba», circa 236 km da nord a sud in linea retta, mentre il dominio di Salomone sui re vassalli arrivava «da Tifsa fino a Gaza», da Tapsaco sull’Eufrate a Gaza, circa 600 km, e la sua assemblea al Tempio giunse «dai dintorni di Hamath fino al torrente d’Egitto», circa 415 km. Quanto di tutto ciò fosse uno Stato reale è una delle questioni più dibattute dell’archeologia biblica: le opinioni vanno da una potenza regionale del X secolo a.C. a un piccolo regno montano attorno a Gerusalemme."
    - "I Re dicono che «Salomone dominava su tutti i regni di qua dal fiume, fino al paese dei Filistei e sino ai confini dell’Egitto. Essi gli recavano dei doni, e gli furon soggetti tutto il tempo ch’ei visse», i confini un tempo promessi ad Abramo, «dal fiume d’Egitto al gran fiume, il fiume Eufrate». In Israele dodici intendenti provvedevano ciascuno alla corte per un mese. Le sue navi salpavano da Ezion-Gheber, «sul lido del mar Rosso, nel paese di Edom», a circa 430 km da Dan, e le Cronache gli attribuiscono la costruzione di Tadmor, Palmira, nel deserto siriano, a circa 420 km da Gerusalemme. I Re raccontano anche che l’impero si stava sfaldando: Adad l’Edomita si levò contro di lui, e Rezon con la sua banda «regnarono in Damasco», ed egli «fu nemico d’Israele per tutto il tempo di Salomone»."
    - "L’archeologia non ha risolto la questione. Yigael Yadin datò a Salomone le porte corrispondenti di Asor, Meghiddo e Ghezer, come le città nominate in 1 Re 9,15; la cronologia bassa di Israel Finkelstein le sposta al IX secolo e alla casa di Omri, e vede la Gerusalemme di Salomone come una cittadina modesta. Altri, citando la struttura a gradoni in pietra e i grandi edifici sul crinale della Città di Davide, la fortezza di Khirbet Qeiyafa e le miniere di rame dell’Araba, sostengono l’esistenza di uno Stato reale nel X secolo, mentre i più concordano che l’impero vassallo sia narrato nel linguaggio dell’ideale regale. Non è stata trovata alcuna iscrizione di Salomone. La mappa usa il 950 a.C. circa, entro il suo regno di circa il 970–931 a.C."
  nl:
    - "Zoals de Bijbel het beschrijft, strekten Israël en Juda zelf zich uit “van Dan tot Ber-seba”, hemelsbreed ongeveer 236 km van noord naar zuid, terwijl Salomo’s heerschappij over vazalkoningen reikte “van Thifsah tot aan Gaza”, van Thapsacus aan de Eufraat tot Gaza, ongeveer 600 km, en zijn bijeenkomst bij de tempel kwam “van den ingang af van Hamath tot de rivier van Egypte”, ongeveer 415 km. In hoeverre dit een werkelijke staat was, is een van de meest omstreden vragen van de bijbelse archeologie: de opvattingen lopen uiteen van een regionale macht in de 10e eeuw v.Chr. tot een klein bergland-koninkrijkje rond Jeruzalem."
    - "Koningen zegt: “Salomo was heersende over al de koninkrijken, van de rivier tot het land der Filistijnen, en tot aan de landpale van Egypte; die brachten geschenken, en dienden Salomo al de dagen zijns levens”, de grenzen die eens aan Abraham waren beloofd, “van de rivier van Egypte af, tot aan die grote rivier, de rivier Frath”. Binnen Israël voorzagen twaalf bestelmeesters het hof elk één maand. Zijn schepen voeren uit Ezeon-Geber “aan den oever der Schelfzee, in het land van Edom”, ongeveer 430 km van Dan, en Kronieken schrijft hem de bouw toe van Tadmor, Palmyra, in de Syrische woestijn, ongeveer 420 km van Jeruzalem. Koningen vertelt ook dat het rijk afbrokkelde: Hadad de Edomiet kwam tegen hem op, en Rezon en zijn bende “regeerden in Damaskus”, en “hij was Israëls tegenpartijder al de dagen van Salomo”."
    - "De archeologie heeft het niet beslist. Yigael Yadin dateerde de overeenkomstige poorten van Hazor, Megiddo en Gezer in de tijd van Salomo, als de steden die in 1 Koningen 9:15 worden genoemd; de lage chronologie van Israel Finkelstein verplaatst ze naar de 9e eeuw en het huis van Omri, en ziet Salomo’s Jeruzalem als een bescheiden stadje. Anderen wijzen op de getrapte steenstructuur en de grote gebouwen op de rug van de Stad van David, de vesting bij Khirbet Qeiyafa en de kopermijnen van de Araba, en pleiten voor een werkelijke staat in de 10e eeuw, terwijl de meesten het erover eens zijn dat het vazalrijk in de taal van het koninklijk ideaal wordt verteld. Er is geen enkele inscriptie van Salomo gevonden. De kaart gebruikt omstreeks 950 v.Chr., binnen zijn regering van ongeveer 970–931 v.Chr."
  cs:
    - "Podle Bible sahaly samotný Izrael a Juda „od Dan až do Bersabé“, asi 236 km od severu k jihu vzdušnou čarou, zatímco Šalomounova vláda nad vazalskými králi sahala „od Tipsach až do Gázy“, od Thapsaku na Eufratu do Gazy, asi 600 km, a jeho shromáždění u chrámu přišlo „odtud, kudyž se chodí do Emat, až ku potoku Egyptskému“, asi 415 km. Kolik z toho byl skutečný stát, patří k nejspornějším otázkám biblické archeologie: názory sahají od regionální velmoci 10. století př. n. l. po malé horské království kolem Jeruzaléma."
    - "Kniha Královská praví, že „Šalomoun panoval nade všemi královstvími od řeky až k zemi Filistinské, a až k končinám Egyptským. I přinášeli dary a sloužili Šalomounovi po všecky dny života jeho“, v mezích kdysi slíbených Abrahamovi, „od řeky Egyptské až do řeky té veliké, řeky Eufraten“. Uvnitř Izraele zásobovalo dvůr dvanáct vládařů, každý jeden měsíc. Jeho lodě vyplouvaly z Ecjon-geberu „na břehu moře Rudého v zemi Idumejské“, asi 430 km od Danu, a Letopisy mu připisují stavbu Tadmoru, Palmýry, na syrské poušti, asi 420 km od Jeruzaléma. Kniha Královská také vypráví, že říše se rozpadala: proti němu povstal Edómský Hadad a Rezon se svou družinou „kralovali v Damašku“ a „byl protivníkem Izraelovým po všecky dny Šalomounovy“."
    - "Archeologie spor nerozhodla. Yigael Yadin připsal shodné brány v Chacoru, Megidu a Gezeru Šalomounovi, jako města jmenovaná v 1Kr 9,15; nízká chronologie Israela Finkelsteina je posouvá do 9. století a k domu Omríovu a vidí Šalomounův Jeruzalém jako skromné městečko. Jiní, odvolávající se na kamennou terasovou stavbu a velké budovy na hřebeni Města Davidova, pevnost Chirbet Qejafa a měděné doly v Arabě, hájí skutečný stát 10. století, zatímco většina souhlasí, že vazalská říše je vylíčena řečí královského ideálu. Žádný Šalomounův nápis nebyl nalezen. Mapa užívá rok asi 950 př. n. l., v rámci jeho vlády asi 970–931 př. n. l."
  sv:
    - "Enligt Bibelns beskrivning sträckte sig Israel och Juda självt ”ifrån Dan ända till Beer-Seba”, omkring 236 km från norr till söder fågelvägen, medan Salomos herravälde över vasallkungar nådde ”ifrån Tifsa ända till Gasa”, från Thapsakos vid Eufrat till Gaza, omkring 600 km, och hans högtidssamling vid templet kom från ”det ställe där vägen går till Hamat ända till Egyptens bäck”, omkring 415 km. Hur mycket av detta som var en verklig stat är en av bibelarkeologins mest omstridda frågor: åsikterna sträcker sig från en regional makt på 900-talet f.Kr. till ett litet bergslandskungarike kring Jerusalem."
    - "Kungaböckerna säger: ”Så var nu Salomo herre över alla riken ifrån floden till filistéernas land och ända ned till Egyptens gräns; de förde skänker till Salomo och voro honom underdåniga, så länge han levde”, de gränser som en gång lovats Abraham, ”från Egyptens flod ända till den stora floden, till floden Frat”. Inom Israel försörjde tolv fogdar hovet, var och en en månad. Hans skepp seglade från Esjon-Geber ”på stranden av Röda havet, i Edoms land”, omkring 430 km från Dan, och Krönikeböckerna tillskriver honom bygget av Tadmor, Palmyra, i den syriska öknen, omkring 420 km från Jerusalem. Kungaböckerna berättar också att riket höll på att glida undan: edoméen Hadad reste sig mot honom, och Reson och hans skara ”gjorde sig till herrar i Damaskus”, och han var ”under Salomos hela livstid Israels motståndare”."
    - "Arkeologin har inte avgjort saken. Yigael Yadin daterade de likadana portarna i Hasor, Megiddo och Geser till Salomo, som de städer som nämns i 1 Kung 9:15; Israel Finkelsteins låga kronologi flyttar dem till 800-talet och Omris hus och ser Salomos Jerusalem som en blygsam stad. Andra, som hänvisar till den trappstegsformade stenkonstruktionen och de stora byggnaderna på åsen i Davids stad, fästningen vid Khirbet Qeiyafa och koppargruvorna i Arava, hävdar att det fanns en verklig stat på 900-talet, medan de flesta är överens om att vasallväldet berättas i det kungliga idealets språk. Ingen inskription av Salomo har hittats. Kartan använder omkring 950 f.Kr., inom hans regeringstid omkring 970–931 f.Kr."
  nb:
    - "Slik Bibelen beskriver det, strakte selve Israel og Juda seg «fra Dan like til Be'erseba», omtrent 236 km fra nord til sør i luftlinje, mens Salomos herredømme over vasallkonger nådde «fra Tifsah like til Gasa», fra Tapsakus ved Eufrat til Gasa, omtrent 600 km, og hans samling ved tempelet kom «fra Hamat-veien og til Egyptens bekk», omtrent 415 km. Hvor mye av dette som var en virkelig stat, er et av de mest omstridte spørsmålene i bibelsk arkeologi: synspunktene spenner fra en regional stormakt på 900-tallet f.Kr. til et lite høylandskongedømme rundt Jerusalem."
    - "Kongebøkene sier at «Salomo rådet over alle kongerikene fra elven til filistrenes land og like til Egyptens landemerke; de kom med gaver og tjente Salomo så lenge han levde», grensene som en gang var lovet Abraham, «fra Egyptens elv like til den store elv, elven Frat». Innen Israel forsynte tolv fogder hoffet en måned hver. Hans skip seilte fra Esjon-Geber «på bredden av det Røde Hav i Edoms land», omtrent 430 km fra Dan, og Krønikebøkene tillegger ham byggingen av Tadmor, Palmyra, i den syriske ørkenen, omtrent 420 km fra Jerusalem. Kongebøkene forteller også at riket var i ferd med å glippe: edomitten Hadad reiste seg mot ham, og Reson og hans flokk «gjorde sig til herrer i Damaskus», og han «var en motstander av Israel så lenge Salomo levde»."
    - "Arkeologien har ikke avgjort saken. Yigael Yadin daterte de tilsvarende portene i Hasor, Megiddo og Geser til Salomo, som byene nevnt i 1 Kong 9,15; Israel Finkelsteins lave kronologi flytter dem til 800-tallet og Omris hus, og ser Salomos Jerusalem som en beskjeden by. Andre, som viser til trappestrukturen i stein og de store byggverkene på Davidsbyens rygg, festningen Khirbet Qeiyafa og kobbergruvene i Arava, argumenterer for en virkelig stat på 900-tallet, mens de fleste er enige om at vasallriket er fortalt i et kongelig idealspråk. Ingen innskrift fra Salomo er funnet. Kartet bruker omtrent 950 f.Kr., innenfor hans regjeringstid på omtrent 970–931 f.Kr."
  tl:
    - "Ayon sa paglalarawan ng Biblia, ang Israel at Juda mismo ay umabot “mula sa Dan hanggang sa Beer-seba”, mga 236 km mula hilaga hanggang timog sa tuwid na guhit, samantalang ang pamumuno ni Salomon sa mga haring basalyo ay umabot “mula sa Tiphsa hanggang sa Gaza”, mula sa Thapsacus sa Eufrates hanggang sa Gaza, mga 600 km, at ang pagtitipon niya sa Templo ay nagmula “sa pasukan sa Hamath hanggang sa batis ng Egipto”, mga 415 km. Kung gaano kalaki rito ang tunay na estado ay isa sa pinakapinagtatalunang tanong ng arkeolohiyang biblikal: ang mga pananaw ay mula sa isang rehiyonal na kapangyarihan noong ikasampung siglo BK hanggang sa isang maliit na kaharian sa kabundukan sa palibot ng Jerusalem."
    - "Ayon sa Mga Hari, “si Salomon ay nagpupuno sa lahat ng kaharian na mula sa Ilog hanggang sa lupain ng mga Filisteo, at hanggang sa hangganan ng Egipto: sila'y nagsipagdala ng mga kaloob, at nagsipaglingkod kay Salomon lahat ng kaarawan ng kaniyang buhay”, ang mga hangganang minsang ipinangako kay Abraham, “mula sa ilog ng Egipto hanggang sa malaking ilog, na ilog Eufrates”. Sa Israel, labindalawang pinuno ang tig-isang buwang nagtustos sa korte. Naglayag ang mga barko niya mula sa Esion-geber “sa baybayin ng Dagat na Mapula, sa lupain ng Edom”, mga 430 km mula sa Dan; ayon sa Mga Cronica, itinayo niya ang Tadmor, ang Palmyra, sa disyerto ng Siria, mga 420 km mula sa Jerusalem. Humihina rin ang imperyo ayon sa Mga Hari: naghimagsik si Adad na Edomita, at si Rezon at ang pulutong niya ay “naghari sa Damasco”, at siya'y “naging kaaway ng Israel sa lahat ng kaarawan ni Salomon”."
    - "Hindi pa ito nalutas ng arkeolohiya. Itinakda ni Yigael Yadin kay Salomon ang magkakatugmang mga pintuang-bayan ng Hasor, Megiddo at Gezer, bilang mga lungsod na pinangalanan sa 1 Mga Hari 9:15; inililipat sila ng mababang kronolohiya ni Israel Finkelstein sa ikasiyam na siglo at sa sambahayan ni Omri, at nakikita niya ang Jerusalem ni Salomon bilang isang katamtamang bayan. Ang iba, na binabanggit ang hagdang-hagdang istrukturang bato at malalaking gusali sa tagaytay ng Bayan ni David, ang kuta sa Khirbet Qeiyafa at ang mga minahan ng tanso sa Araba, ay nagtatanggol sa isang tunay na estado noong ikasampung siglo, samantalang karamihan ay sumasang-ayon na ang imperyong basalyo ay isinasalaysay sa wika ng huwarang maharlika. Wala pang natagpuang inskripsiyon ni Salomon. Ginagamit ng mapa ang mga 950 BK, sa loob ng kaniyang paghahari noong mga 970–931 BK."
  da:
    - "Som Bibelen beskriver det, strakte selve Israel og Juda sig »fra Dan indtil Beersaba«, omkring 236 km fra nord til syd i luftlinje, mens Salomos herredømme over vasalkonger nåede »fra Thipsa og indtil Gaza«, fra Thapsakos ved Eufrat til Gaza, omkring 600 km, og hans forsamling ved Templet kom »fra Strækningen mellem Hamath og Ægyptens Bæk«, omkring 415 km. Hvor meget af dette der var en virkelig stat, er et af bibelarkæologiens mest omstridte spørgsmål: synspunkterne spænder fra en regional magt i 900-tallet f.Kr. til et lille højlandskongerige omkring Jerusalem."
    - "Kongebøgerne siger, at »Salomo var en Herre over alle Rigerne fra Floden til Filisternes Land og indtil Ægyptens Landemærke; de bragte ham Skænk og tjente Salomo alle hans Livsdage«, de grænser, som engang var lovet Abraham, »fra Ægyptens Flod indtil den store Flod, den Flod Frat«. Inden for Israel forsynede tolv embedsmænd hver en måned hoffet. Hans skibe sejlede fra Esjon-Geber »ved det røde Havs Bred, i Edoms Land«, omkring 430 km fra Dan, og Krønikebøgerne tillægger ham opførelsen af Tadmor, Palmyra, i den syriske ørken, omkring 420 km fra Jerusalem. Kongebøgerne fortæller også, at riget var ved at skride: edomitten Hadad rejste sig mod ham, og Rezon og hans trop »regerede i Damaskus«, og han »var Israels Modstander alle Salomos Dage«."
    - "Arkæologien har ikke afgjort det. Yigael Yadin henførte de ens porte i Hazor, Megiddo og Gezer til Salomo som de byer, der nævnes i 1 Kong 9,15; Israel Finkelsteins lave kronologi flytter dem til 800-tallet og Omris hus og ser Salomos Jerusalem som en beskeden by. Andre, der henviser til den trinformede stenkonstruktion og de store bygninger på Davidsbyens højderyg, fæstningen ved Khirbet Qeiyafa og kobberminerne i Araba, argumenterer for en virkelig stat i 900-tallet, mens de fleste er enige om, at vasalriget er fortalt i det kongelige idealers sprog. Ingen indskrift fra Salomo er fundet. Kortet bruger omkring 950 f.Kr., inden for hans regeringstid på omkring 970–931 f.Kr."
  sr:
    - "Како га приказује Библија, сами Израиљ и Јуда простирали су се „од Дана до Вирсавеје“, око 236 км од севера ка југу ваздушном линијом, док је Соломунова власт над вазалним краљевима досезала „од Тапсе до Газе“, од Тапсака на Еуфрату до Газе, око 600 км, а његов сабор у Храму окупљао се „од уласка у Емат до потока мисирског“, око 415 км. Колико је од тога била стварна држава, једно је од најспорнијих питања библијске археологије: гледишта иду од регионалне силе 10. века п. н. е. до малог брдског краљевства око Јерусалима."
    - "Књиге о царевима кажу: „А Соломун владаше свим царствима од реке до земље филистејске и до међе мисирске, и доношаху даре и служаху Соломуна свега века његовог“, у границама које су некад обећане Аврааму, „од воде мисирске до велике воде, воде Ефрата“. Унутар Израиља дванаест управника сваки је по месец дана снабдевао двор. Његове лађе испловљавале су из Есион-Гавера „на брегу црвеног мора у земљи едомској“, око 430 км од Дана, а Дневници му приписују подизање Тадмора, то јест Палмире, у сиријској пустињи, око 420 км од Јерусалима. Књиге о царевима казују и да се царство распадало: Адад Едомац дигао се против њега, а Резон и његова чета завладали су Дамаском и, како стоји, били „противник Израиљев свега века Соломуновог“."
    - "Археологија то није разрешила. Јигаел Јадин датирао је једнаке капије Асора, Мегида и Гезера у Соломуново доба, као градове наведене у 1. књизи о царевима 9,15; ниска хронологија Израела Финкелштајна помера их у 9. век и у време Амријевог дома, а Соломуновим Јерусалимом сматра скроман градић. Други, позивајући се на степенасту камену структуру и велике зграде на гребену Давидовог града, тврђаву у Хирбет Кејафи и бакарне руднике у Арави, заступају постојање праве државе у 10. веку п. н. е., док се већина слаже да је вазално царство приповедано језиком краљевског идеала. Ниједан Соломунов натпис није пронађен. Карта користи око 950. п. н. е., у оквиру његове владавине од око 970. до 931. п. н. е."
