id: where-was-philippi
question:
  en: "Where was Philippi?"
  ru: "Где находились Филиппы?"
  uk: "Де були Філіппи?"
  es: "¿Dónde estaba Filipos?"
  pt: "Onde ficava Filipos?"
  de: "Wo lag Philippi?"
  fr: "Où se trouvait Philippes ?"
  pl: "Gdzie leżały Filippi?"
  it: "Dov’era Filippi?"
  cs: "Kde ležely Filipy?"
  nl: "Waar lag Filippi?"
  sv: "Var låg Filippi?"
  nb: "Hvor lå Filippi?"
  tl: "Nasaan ang Filipos?"
answer:
  en:
    - "Philippi lay in eastern Macedonia, in today's northern Greece, on the Via Egnatia at the edge of a marshy plain about 14 km inland from its port Neapolis, modern Kavala, in a straight line. The ruins are an archaeological park near the village of Krinides and were inscribed as a World Heritage site in 2016."
    - "Philip II of Macedon, Alexander's father, founded the city in 356 BC on the site of the Thasian colony Krenides, to hold the gold mines of Mount Pangaion, and gave it his name. In 42 BC the plain outside the walls saw the battle in which Antony and Octavian defeated Brutus and Cassius, the murderers of Caesar; the victors settled veterans there, and after Actium Octavian refounded it as a Roman colony, which is why Luke calls it “the chief city of that part of Macedonia, and a colony”, and why its magistrates and crowd speak as Romans."
    - "Paul came in about AD 50, landing at Neapolis and walking up to the city; on the sabbath he went “out of the city by a river side, where prayer was wont to be made” and met Lydia, and after the earthquake in the prison he left for Thessalonica. The church he founded was the first in Europe and the one that supported him; Philippians is addressed to it. Excavations since 1914 have uncovered the forum, the theatre, the Via Egnatia running through the city and the great Byzantine basilicas; a Roman cistern beside the forum is shown as the prison of Paul, without proof."
  ru:
    - "Филиппы лежали в восточной Македонии, на севере нынешней Греции, на Эгнатиевой дороге у края болотистой равнины, примерно в 14 км от своей гавани Неаполя, нынешней Кавалы, по прямой. Руины — археологический парк у деревни Кринидес; в 2016 году они внесены в список Всемирного наследия."
    - "Филипп II Македонский, отец Александра, основал город в 356 г. до н. э. на месте фасосской колонии Крениды, чтобы держать золотые рудники горы Пангей, и дал ему своё имя. В 42 г. до н. э. на равнине у стен произошла битва, в которой Антоний и Октавиан разбили Брута и Кассия, убийц Цезаря; победители поселили здесь ветеранов, а после Акция Октавиан заново основал город как римскую колонию. Потому Лука и называет его «первый город в той части Македонии, колония», а его воеводы и толпа говорят как римляне."
    - "Павел пришёл сюда около 50 г. н. э., высадившись в Неаполе и поднявшись в город; в субботу он вышел «за город к реке, где, по обыкновению, был молитвенный дом», и встретил Лидию, а после землетрясения в темнице ушёл в Фессалонику. Основанная им церковь — первая в Европе и та, что поддерживала его; к ней обращено Послание к Филиппийцам. Раскопки с 1914 года открыли форум, театр, Эгнатиеву дорогу, проходящую через город, и большие византийские базилики; римскую цистерну у форума показывают как темницу Павла — без доказательств."
  uk:
    - "Філіппи лежали у східній Македонії, у нинішній північній Греції, на Егнатієвій дорозі, на краю болотистої рівнини, приблизно за 14 км углиб країни від свого порту Неаполя, нинішньої Кавали, по прямій. Руїни — археологічний парк біля села Крінідес, внесений до Списку всесвітньої спадщини 2016 р."
    - "Пилип II Македонський, батько Александра, заснував місто 356 р. до н. е. на місці тасоської колонії Креніди, щоб утримувати золоті копальні гори Пангей, і дав йому своє ім'я. 42 р. до н. е. рівнина за мурами стала свідком битви, в якій Антоній і Октавіан розбили Брута й Кассія, убивць Цезаря; переможці оселили там ветеранів, а після Акція Октавіан заснував його наново як римську колонію, тому Лука й називає його «первий город тієї части Македониї, — осада», і тому його магістрати й натовп говорять як римляни."
    - "Павло прийшов близько 50 р. н. е., зійшов на берег у Неаполі й пішов угору до міста; у суботу вони «вийшли геть з города над річку, де бувало звичайно моленнє», і Павло зустрів Лідію, а після землетрусу у в'язниці вирушив до Солуні. Церква, яку він заснував, була першою в Європі й тією, що його підтримувала; їй адресоване Послання до філіппійців. Розкопки від 1914 р. відкрили форум, театр, Егнатієву дорогу, що йде через місто, і великі візантійські базиліки; римську цистерну біля форуму показують як в'язницю Павла, без доказів."
  es:
    - "Filipos se hallaba en el este de Macedonia, en el actual norte de Grecia, en la vía Egnatia, en el borde de una llanura pantanosa, a unos 14 km tierra adentro de su puerto, Neápolis, la actual Kavala, en línea recta. Las ruinas son un parque arqueológico cerca de la aldea de Krinides y fueron inscritas como Patrimonio de la Humanidad en 2016."
    - "Filipo II de Macedonia, padre de Alejandro, fundó la ciudad en 356 a. C. en el lugar de la colonia tasia de Crénides, para controlar las minas de oro del monte Pangeo, y le dio su nombre. En 42 a. C. la llanura ante las murallas vio la batalla en que Antonio y Octavio derrotaron a Bruto y Casio, los asesinos de César; los vencedores asentaron allí veteranos, y tras Accio Octavio la refundó como colonia romana, razón por la que Lucas la llama «la primera ciudad de la parte de Macedonia, y una colonia», y por la que sus magistrados y su gente hablan como romanos."
    - "Pablo llegó hacia el 50 d. C., desembarcando en Neápolis y subiendo a pie a la ciudad; un sábado «salimos de la puerta junto al río, donde solía ser la oración» y conoció a Lidia, y tras el terremoto en la cárcel partió hacia Tesalónica. La iglesia que fundó fue la primera de Europa y la que lo sostuvo; a ella se dirige la carta a los Filipenses. Las excavaciones desde 1914 han sacado a la luz el foro, el teatro, la vía Egnatia que atraviesa la ciudad y las grandes basílicas bizantinas; una cisterna romana junto al foro se muestra como la cárcel de Pablo, sin pruebas."
  pt:
    - "Filipos ficava no leste da Macedônia, no atual norte da Grécia, na Via Egnatia, na orla de uma planície pantanosa, a cerca de 14 km para o interior de seu porto Neápolis, a atual Kavala, em linha reta. As ruínas formam um parque arqueológico perto da aldeia de Krinides e foram inscritas como Patrimônio Mundial em 2016."
    - "Filipe II da Macedônia, pai de Alexandre, fundou a cidade em 356 a.C. no sítio da colônia tásia de Crenides, para controlar as minas de ouro do monte Pangeu, e deu-lhe o seu nome. Em 42 a.C., a planície fora das muralhas viu a batalha em que Antônio e Otaviano derrotaram Bruto e Cássio, os assassinos de César; os vencedores estabeleceram ali veteranos, e depois de Áccio Otaviano a refundou como colônia romana, razão pela qual Lucas a chama “a cidade principal daquele distrito da Macedônia, e uma colônia romana”, e por que seus magistrados e sua multidão falam como romanos."
    - "Paulo chegou por volta de 50 d.C., desembarcando em Neápolis e subindo a pé até a cidade; no sábado, conta Lucas, “saímos da cidade para a beira de um rio, onde supúnhamos haver um lugar de oração”, e ali Paulo encontrou Lídia; depois do terremoto na prisão partiu para Tessalônica. A igreja que fundou foi a primeira da Europa e a que o sustentou; Filipenses é dirigida a ela. As escavações desde 1914 trouxeram à luz o fórum, o teatro, a Via Egnatia atravessando a cidade e as grandes basílicas bizantinas; uma cisterna romana junto ao fórum é mostrada como a prisão de Paulo, sem prova."
  de:
    - "Philippi lag im östlichen Mazedonien, im heutigen Nordgriechenland, an der Via Egnatia am Rand einer sumpfigen Ebene, in der Luftlinie etwa 14 km landeinwärts von seinem Hafen Neapolis, dem heutigen Kavala. Die Ruinen sind ein archäologischer Park beim Dorf Krinides und wurden 2016 als Welterbestätte eingetragen."
    - "Philipp II. von Mazedonien, Alexanders Vater, gründete die Stadt 356 v. Chr. an der Stelle der thasischen Kolonie Krenides, um die Goldminen des Pangaiongebirges zu halten, und gab ihr seinen Namen. Im Jahr 42 v. Chr. sah die Ebene vor den Mauern die Schlacht, in der Antonius und Oktavian Brutus und Cassius, die Mörder Caesars, besiegten; die Sieger siedelten dort Veteranen an, und nach Actium gründete Oktavian es als römische Kolonie neu, weshalb Lukas es „die Hauptstadt des Landes Mazedonien und eine Freistadt“ (im Griechischen: eine Kolonie) nennt und weshalb seine Stadtoberen und die Menge wie Römer sprechen."
    - "Paulus kam um 50 n. Chr., landete in Neapolis und ging hinauf zur Stadt; am Sabbat ging er „hinaus vor die Stadt an das Wasser, da man pflegte zu beten“, und traf Lydia, und nach dem Erdbeben im Gefängnis reiste er nach Thessalonich ab. Die von ihm gegründete Gemeinde war die erste in Europa und die, die ihn unterstützte; der Philipperbrief ist an sie gerichtet. Grabungen seit 1914 haben das Forum, das Theater, die durch die Stadt laufende Via Egnatia und die großen byzantinischen Basiliken freigelegt; eine römische Zisterne neben dem Forum wird ohne Beweis als Gefängnis des Paulus gezeigt."
  fr:
    - "Philippes se trouvait dans l’est de la Macédoine, dans le nord de la Grèce actuelle, sur la voie Égnatienne, au bord d’une plaine marécageuse, à environ 14 km à l’intérieur des terres depuis son port, Néapolis, l’actuelle Kavala, à vol d’oiseau. Les ruines forment un parc archéologique près du village de Krinides et ont été inscrites au patrimoine mondial en 2016."
    - "Philippe II de Macédoine, père d’Alexandre, fonda la ville en 356 av. J.-C. sur le site de la colonie thasienne de Crénides, pour tenir les mines d’or du mont Pangée, et lui donna son nom. En 42 av. J.-C., la plaine hors des murs vit la bataille où Antoine et Octavien vainquirent Brutus et Cassius, les meurtriers de César ; les vainqueurs y installèrent des vétérans, et après Actium Octavien la refonda comme colonie romaine, ce qui explique que Luc l’appelle « la première ville d’un district de Macédoine, et une colonie », et que ses magistrats et sa foule parlent en Romains."
    - "Paul y vint vers 50 apr. J.-C., débarquant à Néapolis et montant à pied jusqu’à la ville ; le jour du sabbat, il alla « hors de la porte, vers une rivière, où nous pensions que se trouvait un lieu de prière », et rencontra Lydie, et après le tremblement de terre dans la prison, il partit pour Thessalonique. L’Église qu’il y fonda fut la première d’Europe et celle qui le soutint ; l’épître aux Philippiens lui est adressée. Les fouilles menées depuis 1914 ont mis au jour le forum, le théâtre, la voie Égnatienne qui traverse la ville et les grandes basiliques byzantines ; une citerne romaine à côté du forum est montrée comme la prison de Paul, sans preuve."
  pl:
    - "Filippi leżały we wschodniej Macedonii, w dzisiejszej północnej Grecji, przy Via Egnatia na skraju bagnistej równiny, około 14 km w głąb lądu od portu Neapolis, dzisiejszej Kavali, w linii prostej. Ruiny tworzą park archeologiczny koło wsi Krinides i zostały wpisane na Listę światowego dziedzictwa w 2016 roku."
    - "Filip II Macedoński, ojciec Aleksandra, założył miasto w 356 p.n.e. na miejscu tasyjskiej kolonii Krenides, by zająć kopalnie złota góry Pangajon, i nadał mu swoje imię. W 42 p.n.e. równina pod murami była areną bitwy, w której Antoniusz i Oktawian pokonali Brutusa i Kasjusza, zabójców Cezara; zwycięzcy osiedlili tam weteranów, a po Akcjum Oktawian odnowił je jako rzymską kolonię, dlatego Łukasz pisze, że jest to „pierwsze miasto tej części Macedonii nowo osadzone”, i dlatego jego urzędnicy i tłum mówią jak Rzymianie."
    - "Paweł przybył około 50 n.e., lądując w Neapolis i idąc w górę do miasta; w sabat wyszedł „przed miasto nad rzekę, gdzie zwykły bywać modlitwy”, i spotkał Lidię, a po trzęsieniu ziemi w więzieniu wyjechał do Tesaloniki. Założony przez niego zbór był pierwszym w Europie i tym, który go wspierał; List do Filipian jest do niego adresowany. Wykopaliska od 1914 roku odsłoniły forum, teatr, Via Egnatia biegnącą przez miasto i wielkie bazyliki bizantyjskie; rzymska cysterna obok forum jest pokazywana jako więzienie Pawła, bez dowodu."
  it:
    - "Filippi sorgeva nella Macedonia orientale, nell’odierna Grecia settentrionale, sulla Via Egnazia al margine di una pianura paludosa, a circa 14 km nell’entroterra dal suo porto Neapoli, l’odierna Kavala, in linea d’aria. Le rovine sono un parco archeologico presso il villaggio di Krinides e sono state iscritte nel Patrimonio mondiale dell’umanità nel 2016."
    - "Filippo II di Macedonia, padre di Alessandro, fondò la città nel 356 a.C. sul sito della colonia tasia di Crenide, per controllare le miniere d’oro del Monte Pangeo, e le diede il suo nome. Nel 42 a.C. la pianura fuori dalle mura vide la battaglia in cui Antonio e Ottaviano sconfissero Bruto e Cassio, gli uccisori di Cesare; i vincitori vi stabilirono dei veterani, e dopo Azio Ottaviano la rifondò come colonia romana, ed è per questo che Luca la chiama «città primaria di quella parte della Macedonia, ed è colonia romana», e perché i suoi magistrati e la folla parlano da Romani."
    - "Paolo vi giunse verso il 50 d.C., sbarcando a Neapoli e salendo alla città; di sabato andò «fuori della porta, presso al fiume, dove supponevamo fosse un luogo d’orazione» e incontrò Lidia, e dopo il terremoto nella prigione partì per Tessalonica. La chiesa che fondò fu la prima in Europa e quella che lo sostenne; la lettera ai Filippesi è indirizzata ad essa. Gli scavi dal 1914 hanno portato alla luce il foro, il teatro, la Via Egnazia che attraversa la città e le grandi basiliche bizantine; una cisterna romana accanto al foro è mostrata come la prigione di Paolo, senza prove."
  cs:
    - "Filipy ležely ve východní Makedonii, v dnešním severním Řecku, na Via Egnatia na okraji bažinaté roviny asi 14 km vzdušnou čarou ve vnitrozemí od přístavu Neapolis, dnešní Kavaly. Zříceniny jsou archeologickým parkem u vsi Krinides a roku 2016 byly zapsány na seznam světového dědictví."
    - "Filip II. Makedonský, otec Alexandrův, město roku 356 př. n. l. založil na místě thasské kolonie Krenides, aby držel zlaté doly hory Pangaion, a dal mu své jméno. Roku 42 př. n. l. se na rovině před hradbami odehrála bitva, v níž Antonius a Octavianus porazili Bruta a Cassia, vrahy Caesarovy; vítězové tam usadili veterány a po Aktiu Octavianus město obnovil jako římskou kolonii, a proto Lukáš říká, že je to „první město krajiny Macedonské, obyvateli cizími osazené“, a proto jeho úředníci i dav mluví jako Římané."
    - "Pavel přišel asi roku 50 n. l., vylodil se v Neapoli a vystoupil do města; v den sobotní „vyšli jsme ven za město k řece, kdež býval obyčej modliti se“ a potkal Lydii, a po zemětřesení ve vězení odešel do Tesaloniky. Církev, kterou založil, byla první v Evropě a ta, která ho podporovala; je jí adresován list Filipským. Vykopávky od roku 1914 odkryly fórum, divadlo, Via Egnatia procházející městem a velké byzantské baziliky; římská cisterna vedle fóra se ukazuje jako Pavlovo vězení, bez důkazu."
  nl:
    - "Filippi lag in het oosten van Macedonië, in het huidige noorden van Griekenland, aan de Via Egnatia aan de rand van een moerassige vlakte, hemelsbreed ongeveer 14 km landinwaarts van de haven Neapolis, het moderne Kavala. De ruïnes vormen een archeologisch park nabij het dorp Krinides en werden in 2016 ingeschreven als werelderfgoed."
    - "Filips II van Macedonië, de vader van Alexander, stichtte de stad in 356 v.Chr. op de plaats van de Thasische kolonie Krenides, om de goudmijnen van de berg Pangaion te beheersen, en gaf haar zijn naam. In 42 v.Chr. zag de vlakte buiten de muren de slag waarin Antonius en Octavianus Brutus en Cassius, de moordenaars van Caesar, versloegen; de overwinnaars vestigden er veteranen, en na Actium stichtte Octavianus de stad opnieuw als Romeinse kolonie, en daarom noemt Lukas haar “de eerste stad van dit deel van Macedonië, een kolonie”, en daarom spreken haar magistraten en de menigte als Romeinen."
    - "Paulus kwam omstreeks 50 n.Chr., landde te Neapolis en liep naar de stad; op de sabbat ging hij “buiten de stad aan de rivier, waar het gebed placht te geschieden” en ontmoette Lydia, en na de aardbeving in de gevangenis vertrok hij naar Tessalonica. De gemeente die hij stichtte was de eerste in Europa en degene die hem steunde; de brief aan de Filippenzen is aan haar gericht. Opgravingen sinds 1914 hebben het forum, het theater, de Via Egnatia die door de stad loopt en de grote Byzantijnse basilieken blootgelegd; een Romeinse cisterne naast het forum wordt zonder bewijs getoond als de gevangenis van Paulus."
  sv:
    - "Filippi låg i östra Makedonien, i dagens norra Grekland, vid Via Egnatia i utkanten av en sumpig slätt omkring 14 km inåt landet från sin hamn Neapolis, dagens Kavala, i fågelvägen. Ruinerna är en arkeologisk park nära byn Krinides och blev världsarv 2016."
    - "Filippos II av Makedonien, Alexanders far, grundade staden 356 f.Kr. på platsen för den thasiska kolonin Krenides, för att behärska guldgruvorna på berget Pangaion, och gav den sitt namn. År 42 f.Kr. var slätten utanför murarna skådeplats för slaget där Antonius och Octavianus besegrade Brutus och Cassius, Caesars mördare; segrarna bosatte veteraner där, och efter Actium grundade Octavianus staden på nytt som romersk koloni, vilket är varför Lukas säger att staden, ”en romersk koloni, är den första i denna del av Macedonien”, och varför dess magistrater och folk talar som romare."
    - "Paulus kom omkring år 50 e.Kr., landade i Neapolis och gick upp till staden; på sabbaten gick han ”utom stadsporten, längs med en flod, till en plats som gällde såsom böneställe” och träffade Lydia, och efter jordbävningen i fängelset lämnade han staden för Tessalonike. Församlingen han grundade var den första i Europa och den som stödde honom; Filipperbrevet är riktat till den. Utgrävningar sedan 1914 har avtäckt forum, teatern, Via Egnatia som löper genom staden och de stora bysantinska basilikorna; en romersk cistern bredvid forum visas som Paulus’ fängelse, utan bevis."
  nb:
    - "Filippi lå i Øst-Makedonia, i dagens Nord-Hellas, ved Via Egnatia i kanten av en sumpslette omtrent 14 km inne i landet fra havnen Neapolis, nåværende Kavala, i luftlinje. Ruinene er en arkeologisk park nær landsbyen Krinides og ble oppført som verdensarvsted i 2016."
    - "Filip II av Makedonia, Aleksanders far, grunnla byen i 356 f.Kr. på stedet for den thasiske kolonien Krenides, for å holde gruvene i Pangaion-fjellet, og ga den sitt navn. I 42 f.Kr. så sletten utenfor murene slaget der Antonius og Oktavian beseiret Brutus og Cassius, Cæsars snikmordere; seierherrene bosatte veteraner der, og etter Aktium gjenopprettet Oktavian den som romersk koloni, og derfor kaller Lukas den «den første by i den del av Makedonia og en romersk koloni», og derfor taler dens styresmenn og folk som romere."
    - "Paulus kom omkring 50 e.Kr., gikk i land i Neapolis og vandret opp til byen; på sabbaten gikk han «utenfor porten, til en elv hvor de pleide å samles til bønn», og møtte Lydia, og etter jordskjelvet i fengselet dro han videre til Tessalonika. Menigheten han grunnla, var den første i Europa og den som støttet ham; Filipperbrevet er stilet til den. Utgravninger siden 1914 har avdekket forumet, teatret, Via Egnatia som løper gjennom byen og de store bysantinske basilikaene; en romersk sisterne ved siden av forumet vises som Paulus’ fengsel, uten bevis."
  tl:
    - "Ang Filipos ay nasa silangang Macedonia, sa hilagang Grecia ngayon, sa Via Egnatia sa gilid ng isang latiang kapatagan mga 14 km sa loob ng lupain mula sa daungan nitong Neapolis, ang Kavala ngayon, sa tuwid na guhit. Ang mga guho ay isang parkeng arkeolohiko malapit sa nayon ng Krinides at itinala bilang pook ng Pamanang Pandaigdig noong 2016."
    - "Itinatag ni Felipe II ng Macedonia, ama ni Alejandro, ang lungsod noong 356 BK sa pook ng kolonyang Tasiano ng Krenides, upang hawakan ang mga minahan ng ginto ng Bundok Pangaion, at ibinigay ang kaniyang pangalan dito. Noong 42 BK, nakita ng kapatagan sa labas ng mga pader ang labanang kung saan tinalo nina Antonio at Octavian sina Brutus at Cassius, ang mga pumatay kay Caesar; nanirahan doon ang mga beterano ng mga nagtagumpay, at pagkatapos ng Actium ay muling itinatag ito ni Octavian bilang kolonyang Romano, kaya tinawag ito ni Lucas na “isang bayan ng Macedonia, na siyang una sa purok, lupang nasasakupan ng Roma”, at kaya ang mga mahistrado at karamihan nito ay nagsasalita bilang mga Romano."
    - "Dumating si Pablo noong mga 50 AD, dumaong sa Neapolis at lumakad paakyat sa lungsod; “nang araw ng sabbath ay nagsilabas kami sa labas ng pintuan sa tabi ng ilog, na doo'y sinapantaha naming may mapapanalanginan” at nakilala niya si Lidia, at pagkatapos ng lindol sa bilangguan ay umalis siya patungong Tesalonica. Ang iglesiang itinatag niya ang una sa Europa at ang sumuporta sa kaniya; ang Mga Taga-Filipos ay isinulat para rito. Ang mga paghuhukay mula 1914 ay nakatuklas ng forum, ng teatro, ng Via Egnatia na dumadaan sa lungsod at ng mga dakilang basilikang Bizantino; ang isang sisternang Romano sa tabi ng forum ay ipinakikita bilang bilangguan ni Pablo, nang walang patunay."
