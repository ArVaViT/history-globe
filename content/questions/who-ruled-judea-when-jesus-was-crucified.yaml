id: who-ruled-judea-when-jesus-was-crucified
question:
  en: "Who ruled Judea when Jesus was crucified?"
  ru: "Кто правил Иудеей, когда распяли Иисуса?"
  uk: "Хто правив Юдеєю, коли розіп'яли Ісуса?"
  es: "¿Quién gobernaba Judea cuando Jesús fue crucificado?"
  pt: "Quem governava a Judeia quando Jesus foi crucificado?"
  de: "Wer herrschte über Judäa, als Jesus gekreuzigt wurde?"
  fr: "Qui gouvernait la Judée quand Jésus fut crucifié ?"
  pl: "Kto rządził Judeą, gdy ukrzyżowano Jezusa?"
  it: "Chi governava la Giudea quando Gesù fu crocifisso?"
  cs: "Kdo vládl Judsku, když byl Ježíš ukřižován?"
  nl: "Wie regeerde over Judea toen Jezus werd gekruisigd?"
  sv: "Vem styrde Judeen när Jesus korsfästes?"
  nb: "Hvem styrte Judea da Jesus ble korsfestet?"
  tl: "Sino ang namuno sa Judea nang ipako sa krus si Jesus?"
  da: "Hvem regerede Judæa, da Jesus blev korsfæstet?"
  sr: "Ко је владао Јудејом кад је Исус био распет?"
  hu: "Ki uralkodott Júdea felett, amikor Jézust keresztre feszítették?"
  fi: "Kuka hallitsi Juudeaa, kun Jeesus ristiinnaulittiin?"
  vi: "Ai cai trị Giu-đê khi Giê-su bị đóng đinh?"
  ro: "Cine a condus Iudeea când a fost răstignit Isus?"
  bg: "Кой е управлявал Юдея, когато Исус беше разпнат?"
answer:
  en:
    - "At the crucifixion, about AD 30 on the map's conventional date (AD 33 is also held), Judea was a Roman province governed by the prefect Pontius Pilate, who held office from about 26 to 36, under the emperor Tiberius (AD 14–37). Galilee, where Jesus came from, was not part of the province: it was ruled by Herod Antipas, the tetrarch, son of Herod the Great. The high priest in Jerusalem was Caiaphas."
    - 'Luke sets the scene when John the Baptist begins to preach: "Now in the fifteenth year of the reign of Tiberius Caesar, Pontius Pilate being governor of Judaea, and Herod being tetrarch of Galilee, and his brother Philip tetrarch of Ituraea and of the region of Trachonitis, and Lysanias the tetrarch of Abilene, Annas and Caiaphas being the high priests". The fifteenth year of Tiberius is usually reckoned as AD 28/29. Judea had come under direct Roman rule in AD 6, when Augustus deposed Archelaus; Josephus says Pilate was sent after Gratus had governed eleven years and stayed ten years himself, and a stone found in the theatre at Caesarea, the governor''s seat, names him prefect of Judea. The chief priests delivered Jesus "to Pontius Pilate the governor", and it was he who passed sentence; "We have no king but Caesar", they told him.'
    - 'Herod Antipas ruled Galilee and Perea from his father''s death, about 4 BC, and founded Tiberias about AD 20; when Pilate "knew that he belonged unto Herod''s jurisdiction, he sent him to Herod, who himself also was at Jerusalem at that time". Philip, tetrarch of the north-east, built Caesarea Philippi and died about AD 34. Caiaphas, son-in-law of Annas and "the high priest that same year", was high priest from about AD 18 to 36 or 37: Josephus says Gratus appointed him and Vitellius removed him. In 36 the legate Vitellius sent Pilate to Rome to answer for his rule, and Tiberius died in March 37 before he arrived.'
  ru:
    - "При распятии — около 30 г. н. э. по условной дате карты (держатся и 33 г.) — Иудея была римской провинцией под управлением префекта Понтия Пилата, занимавшего должность примерно с 26 по 36 г., при императоре Тиверии (14–37 гг. н. э.). Галилея, откуда был Иисус, в провинцию не входила: ею правил четвертовластник Ирод Антипа, сын Ирода Великого. Первосвященником в Иерусалиме был Каиафа."
    - "Лука описывает обстановку, когда Иоанн Креститель начинает проповедь: «В пятнадцатый же год правления Тиверия кесаря, когда Понтий Пилат начальствовал в Иудее, Ирод был четвертовластником в Галилее, Филипп, брат его, четвертовластником в Итурее и Трахонитской области, а Лисаний четвертовластником в Авилинее, при первосвященниках Анне и Каиафе». Пятнадцатый год Тиверия обычно считают 28/29 г. н. э. Иудея перешла под прямое римское управление в 6 г. н. э., когда Август низложил Архелая; Иосиф Флавий пишет, что Пилата прислали после одиннадцати лет правления Грата и сам он пробыл десять лет, а камень, найденный в театре Кесарии, резиденции наместника, называет его префектом Иудеи. Первосвященники предали Иисуса «Понтию Пилату, правителю», и приговор вынес он; «нет у нас царя, кроме кесаря», — сказали они ему."
    - "Ирод Антипа правил Галилеей и Переей со смерти отца, около 4 г. до н. э., и около 20 г. н. э. основал Тивериаду; Пилат, «узнав, что Он из области Иродовой, послал Его к Ироду, который в эти дни был также в Иерусалиме». Филипп, четвертовластник северо-востока, построил Кесарию Филиппову и умер около 34 г. н. э. Каиафа, зять Анны, «который был на тот год первосвященником», занимал эту должность примерно с 18 по 36 или 37 г.: по Иосифу Флавию, его поставил Грат, а сместил Вителлий. В 36 г. легат Вителлий отослал Пилата в Рим держать ответ за своё правление, и Тиверий умер в марте 37 г., прежде чем тот прибыл."
  uk:
    - "Під час розп'яття, близько 30 р. н. е. за умовною датою мапи (тримаються також 33 р. н. е.), Юдея була римською провінцією, якою керував префект Понтій Пилат, що обіймав посаду приблизно з 26 до 36 р., за імператора Тиверія (14–37 рр. н. е.). Галілея, звідки походив Ісус, не входила до провінції: нею правив Ірод Антипа, тетрарх, син Ірода Великого. Первосвящеником в Єрусалимі був Каяфа."
    - "Лука окреслює обстановку, коли Іван Хреститель починає проповідувати: «У пятнайцятий же рік правлення Тиверия кесаря, як був ігемоном Понтийський Пилат в Юдеї, а четверовластником у Галилеї Ірод, Филип же, брат його, четверовластником в Ітуреї і Трахонській землї, а Лисаний четверовластником в Авилинї, за архиєреїв Анни та Каяфи». П'ятнадцятий рік Тиверія зазвичай обчислюють як 28/29 р. н. е. Юдея перейшла під пряме римське управління 6 р. н. е., коли Август скинув Архелая; Йосиф Флавій каже, що Пилата було послано після того, як Грат правив одинадцять років, і що сам він пробув десять років, а камінь, знайдений у театрі в Кесарії, осідку намісника, називає його префектом Юдеї. Первосвященики передали Ісуса «Понтийському Пилату, ігемонові», і саме він виголосив вирок; «Не маємо царя, тільки Кесаря», — сказали вони йому."
    - "Ірод Антипа правив Галілеєю та Переєю від смерті батька, близько 4 р. до н. е., і заснував Тіверіаду близько 20 р. н. е.; коли Пилат, як сказано, «довідавшись, що Він присуду Іродового, післав Його до Ірода, що також був у Єрусалимі тими днями». Пилип, тетрарх північного сходу, збудував Кесарію Пилипову і помер близько 34 р. н. е. Каяфа, зять Анни і «архиєреєм того року», був первосвящеником приблизно з 18 до 36 чи 37 р. н. е.: Йосиф Флавій каже, що його призначив Грат, а усунув Вітеллій. 36 р. легат Вітеллій відправив Пилата до Рима відповідати за його правління, і Тиверій помер у березні 37 р., перш ніж той прибув."
  es:
    - "En la crucifixión, hacia el 30 d. C. en la fecha convencional del mapa (también se sostiene el 33 d. C.), Judea era una provincia romana gobernada por el prefecto Poncio Pilato, que ocupó el cargo desde aproximadamente el 26 hasta el 36, bajo el emperador Tiberio (14–37 d. C.). Galilea, de donde procedía Jesús, no formaba parte de la provincia: la gobernaba Herodes Antipas, el tetrarca, hijo de Herodes el Grande. El sumo sacerdote en Jerusalén era Caifás."
    - "Lucas sitúa la escena cuando Juan el Bautista empieza a predicar: «en el año quince del imperio de Tiberio César, siendo gobernador de Judea Poncio Pilato, y Herodes tetrarca de Galilea, y su hermano Felipe tetrarca de Iturea y de la provincia de Traconite, y Lisanias tetrarca de Abilinia, siendo sumos sacerdotes Anás y Caifás». El año quince de Tiberio se calcula por lo común en el 28/29 d. C. Judea había pasado a dominio romano directo en el 6 d. C., cuando Augusto depuso a Arquelao; Josefo dice que Pilato fue enviado después de que Grato gobernara once años y que él permaneció diez años, y una piedra hallada en el teatro de Cesarea, sede del gobernador, lo nombra prefecto de Judea. Los principales sacerdotes entregaron a Jesús «á Poncio Pilato presidente», y fue él quien dictó la sentencia; «No tenemos rey sino á César», le dijeron."
    - "Herodes Antipas gobernó Galilea y Perea desde la muerte de su padre, hacia el 4 a. C., y fundó Tiberíades hacia el 20 d. C.; cuando Pilato «entendió que era de la jurisdicción de Herodes, le remitió á Herodes, el cual también estaba en Jerusalem en aquellos días». Felipe, tetrarca del noreste, construyó Cesarea de Filipo y murió hacia el 34 d. C. Caifás, yerno de Anás y «pontífice de aquel año», fue sumo sacerdote desde aproximadamente el 18 hasta el 36 o 37: Josefo dice que Grato lo nombró y Vitelio lo depuso. En el 36 el legado Vitelio envió a Pilato a Roma para responder de su gobierno, y Tiberio murió en marzo del 37 antes de que llegara."
  pt:
    - "Na crucificação, por volta de 30 d.C. na data convencional do mapa (também se defende 33 d.C.), a Judeia era uma província romana governada pelo prefeito Pôncio Pilatos, que ocupou o cargo de cerca de 26 a 36, sob o imperador Tibério (14–37 d.C.). A Galileia, de onde Jesus vinha, não fazia parte da província: era governada por Herodes Antipas, o tetrarca, filho de Herodes, o Grande. O sumo sacerdote em Jerusalém era Caifás."
    - "Lucas descreve o cenário quando João Batista começa a pregar: “No décimo quinto ano do reinado de Tibério César, sendo Pôncio Pilatos governador da Judeia, Herodes tetrarca da Galileia, seu irmão Filipe tetrarca da região da Itureia e Traconites, e Lisânias tetrarca de Abilene, durante o sumo sacerdócio de Anás e Caifás”. O décimo quinto ano de Tibério costuma ser calculado como 28/29 d.C. A Judeia passara ao domínio romano direto em 6 d.C., quando Augusto depôs Arquelau; Josefo diz que Pilatos foi enviado depois que Grato governou onze anos e que ele próprio ficou dez anos, e uma pedra encontrada no teatro de Cesareia, sede do governador, o nomeia prefeito da Judeia. Os principais sacerdotes entregaram Jesus “a Pôncio Pilatos, o governador”, e foi ele quem proferiu a sentença; “Não temos rei senão César!”, disseram-lhe."
    - "Herodes Antipas governou a Galileia e a Pereia desde a morte do pai, por volta de 4 a.C., e fundou Tiberíades por volta de 20 d.C.; quando Pilatos “descobriu que ele era da jurisdição de Herodes, enviou-o a Herodes, que também estava em Jerusalém naqueles dias”. Filipe, tetrarca do nordeste, construiu Cesareia de Filipe e morreu por volta de 34 d.C. Caifás, genro de Anás e “o sumo sacerdote naquele ano”, foi sumo sacerdote de cerca de 18 a 36 ou 37 d.C.: Josefo diz que Grato o nomeou e Vitélio o removeu. Em 36, o legado Vitélio enviou Pilatos a Roma para responder por seu governo, e Tibério morreu em março de 37, antes de ele chegar."
  de:
    - "Bei der Kreuzigung, nach dem konventionellen Datum der Karte um 30 n. Chr. (auch 33 wird vertreten), war Judäa eine römische Provinz, regiert vom Präfekten Pontius Pilatus, der etwa von 26 bis 36 im Amt war, unter dem Kaiser Tiberius (14–37 n. Chr.). Galiläa, woher Jesus kam, gehörte nicht zur Provinz: Es wurde von Herodes Antipas regiert, dem Tetrarchen, Sohn Herodes’ des Großen. Der Hohepriester in Jerusalem war Kaiphas."
    - "Lukas setzt den Rahmen für Johannes den Täufer: „In dem fünfzehnten Jahr des Kaisertums Kaisers Tiberius, da Pontius Pilatus Landpfleger in Judäa war und Herodes ein Vierfürst in Galiläa und sein Bruder Philippus ein Vierfürst in Ituräa und in der Gegend Trachonitis und Lysanias ein Vierfürst zu Abilene, da Hannas und Kaiphas Hohepriester waren“. Das fünfzehnte Jahr des Tiberius wird meist als 28/29 n. Chr. gerechnet. Judäa war 6 n. Chr. unter direkte römische Herrschaft gekommen, als Augustus Archelaus absetzte; Josephus berichtet, Pilatus sei nach elf Regierungsjahren des Gratus gesandt worden und selbst zehn Jahre geblieben, und ein im Theater von Caesarea, dem Sitz des Statthalters, gefundener Stein nennt ihn Präfekt von Judäa. Die Hohenpriester übergaben Jesus „dem Landpfleger Pontius Pilatus“, und er sprach das Urteil; „Wir haben keinen König denn den Kaiser“, sagten sie ihm."
    - "Herodes Antipas herrschte seit dem Tod seines Vaters um 4 v. Chr. über Galiläa und Peräa und gründete um 20 n. Chr. Tiberias; als Pilatus „vernahm, daß er unter des Herodes Obrigkeit gehörte, übersandte er ihn zu Herodes, welcher in den Tagen auch zu Jerusalem war“. Philippus, Tetrarch des Nordostens, baute Caesarea Philippi und starb um 34 n. Chr. Kaiphas, Schwiegersohn des Hannas und „welcher des Jahres Hoherpriester war“, war etwa von 18 bis 36 oder 37 n. Chr. Hoherpriester: Josephus sagt, Gratus habe ihn eingesetzt und Vitellius abgesetzt. Im Jahr 36 schickte der Legat Vitellius Pilatus nach Rom, um sich für seine Amtsführung zu verantworten, und Tiberius starb im März 37, bevor er ankam."
  fr:
    - "À la crucifixion, vers 30 apr. J.-C. selon la date conventionnelle de la carte (33 apr. J.-C. est aussi retenu), la Judée était une province romaine gouvernée par le préfet Ponce Pilate, en fonction d’environ 26 à 36, sous l’empereur Tibère (14-37 apr. J.-C.). La Galilée, d’où venait Jésus, ne faisait pas partie de la province : elle était gouvernée par Hérode Antipas, le tétrarque, fils d’Hérode le Grand. Le grand prêtre à Jérusalem était Caïphe."
    - "Luc situe le début de la prédication de Jean-Baptiste : « La quinzième année du règne de Tibère César, lorsque Ponce Pilate était gouverneur de la Judée, Hérode tétrarque de la Galilée, son frère Philippe tétrarque de l’Iturée et du territoire de la Trachonite, Lysanias tétrarque de l’Abilène, et du temps des souverains sacrificateurs Anne et Caïphe ». La quinzième année de Tibère est généralement comptée comme 28-29 apr. J.-C. La Judée était passée sous domination romaine directe en 6 apr. J.-C., quand Auguste déposa Archélaüs ; selon Flavius Josèphe, Pilate fut envoyé après onze ans de gouvernement de Gratus et resta dix ans, et une pierre trouvée dans le théâtre de Césarée, siège du gouverneur, le nomme préfet de Judée. Les chefs des prêtres livrèrent Jésus « à Ponce Pilate, le gouverneur », qui le condamna ; « Nous n’avons de roi que César », lui dirent-ils."
    - "Hérode Antipas gouverna la Galilée et la Pérée depuis la mort de son père, vers 4 av. J.-C., et fonda Tibériade vers 20 apr. J.-C. ; quand Pilate, « ayant appris qu’il était de la juridiction d’Hérode, … le renvoya à Hérode, qui se trouvait aussi à Jérusalem en ces jours-là ». Philippe, tétrarque du nord-est, bâtit Césarée de Philippe et mourut vers 34 apr. J.-C. Caïphe, gendre d’Anne et « souverain sacrificateur cette année-là », fut grand prêtre d’environ 18 à 36 ou 37 apr. J.-C. : Flavius Josèphe dit que Gratus le nomma et que Vitellius le destitua. En 36, le légat Vitellius envoya Pilate à Rome pour répondre de son gouvernement, et Tibère mourut en mars 37 avant son arrivée."
  pl:
    - "W czasie ukrzyżowania, około 30 n.e. według umownej daty mapy (podaje się też 33 n.e.), Judea była rzymską prowincją rządzoną przez prefekta Poncjusza Piłata, który sprawował urząd mniej więcej od 26 do 36, za cesarza Tyberiusza (14–37 n.e.). Galilea, skąd pochodził Jezus, nie należała do prowincji: rządził nią Herod Antypas, tetrarcha, syn Heroda Wielkiego. Arcykapłanem w Jerozolimie był Kajfasz."
    - "Łukasz ustala scenę, gdy Jan Chrzciciel zaczyna nauczać: „A roku piętnastego panowania Tyberyjusza Cesarza, gdy Poncki Piłat był starostą Judzkim, a Herod Tetrarchą Galilejskim, a Filip, brat jego, Tetrarchą Iturejskim i krainy Trachonickiej, a Lizanijasz Tetrarchą Abileńskim, za najwyższych kapłanów Annasza i Kaifasza”. Piętnasty rok Tyberiusza liczy się zwykle jako 28/29 n.e. Judea znalazła się pod bezpośrednimi rządami Rzymu w 6 n.e., gdy August złożył Archelaosa; Józef Flawiusz mówi, że Piłata przysłano po tym, jak Gratus rządził jedenaście lat, i że sam pozostał dziesięć lat, a kamień znaleziony w teatrze w Cezarei, siedzibie namiestnika, nazywa go prefektem Judei. Arcykapłani przekazali Jezusa „Ponckiemu Piłatowi, staroście”, i to on wydał wyrok; „Nie mamy króla, tylko cesarza”, powiedzieli mu."
    - "Herod Antypas rządził Galileą i Pereą od śmierci ojca, około 4 p.n.e., i założył Tyberiadę około 20 n.e.; gdy Piłat „się dowiedział, iż był z państwa Herodowego, odesłał go do Heroda, który też w Jeruzalemie był w one dni”. Filip, tetrarcha północnego wschodu, zbudował Cezareę Filipową i zmarł około 34 n.e. Kajfasz, zięć Annasza i ten, „który był najwyższym kapłanem roku onego”, był arcykapłanem od około 18 do 36 lub 37 n.e.: Józef Flawiusz mówi, że mianował go Gratus, a usunął Witeliusz. W 36 legat Witeliusz wysłał Piłata do Rzymu, by odpowiedział za swoje rządy, a Tyberiusz zmarł w marcu 37, zanim ten przybył."
  it:
    - "Alla crocifissione, verso il 30 d.C. secondo la data convenzionale della mappa (è sostenuto anche il 33 d.C.), la Giudea era una provincia romana governata dal prefetto Ponzio Pilato, in carica dal 26 circa al 36, sotto l’imperatore Tiberio (14–37 d.C.). La Galilea, da cui veniva Gesù, non faceva parte della provincia: era governata da Erode Antipa, il tetrarca, figlio di Erode il Grande. Il sommo sacerdote a Gerusalemme era Caifa."
    - "Luca ambienta la scena quando Giovanni Battista comincia a predicare: «Or nell’anno decimoquinto dell’impero di Tiberio Cesare, essendo Ponzio Pilato governatore della Giudea, ed Erode tetrarca della Galilea, e Filippo, suo fratello, tetrarca dell’Iturea e della Traconitide, e Lisania tetrarca dell’Abilene, sotto i sommi sacerdoti Anna e Caiàfa». Il quindicesimo anno di Tiberio si calcola di solito il 28/29 d.C. La Giudea era passata sotto il dominio romano diretto nel 6 d.C., quando Augusto depose Archelao; Giuseppe Flavio dice che Pilato fu mandato dopo che Grato aveva governato undici anni e che rimase dieci anni, e una pietra trovata nel teatro di Cesarea, la sede del governatore, lo nomina prefetto di Giudea. I capi sacerdoti consegnarono Gesù «a Pilato, il governatore», e fu lui a pronunciare la sentenza; «Noi non abbiamo altro re che Cesare», gli dissero."
    - "Erode Antipa governò la Galilea e la Perea dalla morte del padre, verso il 4 a.C., e fondò Tiberiade verso il 20 d.C.; Pilato, «saputo ch’egli era della giurisdizione d’Erode, lo rimandò a Erode ch’era anch’egli a Gerusalemme in que’ giorni». Filippo, tetrarca del nord-est, costruì Cesarea di Filippo e morì verso il 34 d.C. Caifa, genero di Anna e «sommo sacerdote di quell’anno», fu sommo sacerdote dal 18 circa al 36 o 37 d.C.: Giuseppe Flavio dice che Grato lo nominò e Vitellio lo rimosse. Nel 36 il legato Vitellio mandò Pilato a Roma a rispondere del suo governo, e Tiberio morì nel marzo del 37 prima che arrivasse."
  cs:
    - "V době ukřižování, kolem roku 30 n. l. podle smluvního data na mapě (hájí se i rok 33), bylo Judsko římskou provincií spravovanou prefektem Pontským Pilátem, který byl v úřadu zhruba od roku 26 do roku 36, za císaře Tiberia (14–37 n. l.). Galilea, odkud Ježíš pocházel, nebyla součástí provincie: vládl jí tetrarcha Herodes Antipas, syn Heroda Velikého. Velekněz v Jeruzalémě byl Kaifáš."
    - "Lukáš zasazuje scénu, když Jan Křtitel začíná kázat: „Léta pak patnáctého císařství Tiberia císaře, když Pontský Pilát spravoval Judstvo, a Herodes byl čtvrtákem v Galilei, Filip pak bratr jeho byl čtvrtákem Iturejské a Trachonitidské krajiny, a Lyzaniáš čtvrtákem Abilinským, za nejvyššího kněze Annáše a Kaifáše“. Patnáctý rok Tiberiův se obvykle počítá jako 28/29 n. l. Judsko se dostalo pod přímou římskou správu roku 6 n. l., kdy Augustus sesadil Archelaa; Josephus říká, že Pilát byl poslán poté, co Gratus spravoval jedenáct let, a zůstal deset let, a kámen nalezený v divadle v Cesareji, sídle místodržitele, jej jmenuje prefektem Judska. Přední kněží vydali Ježíše „Pontskému Pilátovi hejtmanu“ a to on vynesl rozsudek; „Nemámeť krále, než císaře,“ řekli mu."
    - "Herodes Antipas vládl Galileji a Perei od smrti svého otce, kolem roku 4 př. n. l., a založil Tiberias kolem roku 20 n. l.; když Pilát „zvěděl, že by byl z panství Herodesova, poslal jej k Herodesovi, kterýž také v Jeruzalémě byl v ty dni“. Filip, tetrarcha severovýchodu, vystavěl Cesareu Filipovu a zemřel kolem roku 34 n. l. Kaifáš, zeť Annášův, který „byl nejvyšším knězem toho léta“, byl velekněz zhruba od roku 18 do 36 nebo 37: Josephus říká, že ho jmenoval Gratus a sesadil Vitellius. Roku 36 poslal legát Vitellius Piláta do Říma, aby se zodpovídal ze své vlády, a Tiberius zemřel v březnu 37, než dorazil."
  nl:
    - "Bij de kruisiging, omstreeks 30 n.Chr. volgens de conventionele datum van de kaart (ook 33 n.Chr. wordt aangehouden), was Judea een Romeinse provincie onder bestuur van prefect Pontius Pilatus, die van ongeveer 26 tot 36 ambtte, onder keizer Tiberius (14–37 n.Chr.). Galilea, waar Jezus vandaan kwam, maakte geen deel uit van de provincie: het werd geregeerd door Herodes Antipas, de tetrarch, zoon van Herodes de Grote. De hogepriester in Jeruzalem was Kajafas."
    - "Lukas zet het toneel als Johannes de Doper gaat prediken: “in het vijftiende jaar der regering van den keizer Tiberius, als Pontius Pilatus stadhouder was over Judea, en Herodes een viervorst over Galilea, en Filippus, zijn broeder, een viervorst over Iturea en over het land Trachonitis, en Lysanias een viervorst over Abilene; Onder de hogepriesters Annas en Kajafas”. Het vijftiende jaar van Tiberius geldt gewoonlijk als 28/29 n.Chr. Judea kwam in 6 n.Chr. direct onder Rome, toen Augustus Archelaüs afzette; Josephus zegt dat Pilatus werd gezonden nadat Gratus elf jaar had geregeerd en zelf tien jaar bleef, en een steen uit het theater van Caesarea, zijn zetel, noemt hem prefect van Judea. De overpriesters leverden Jezus uit “aan Pontius Pilatus, den stadhouder”, en hij velde het vonnis; “Wij hebben geen koning, dan den keizer”, zeiden zij tot hem."
    - "Herodes Antipas regeerde over Galilea en Perea vanaf de dood van zijn vader, omstreeks 4 v.Chr., en stichtte Tiberias omstreeks 20 n.Chr.; toen Pilatus, “verstaande, dat Hij uit het gebied van Herodes was, zond hij Hem heen tot Herodes, die ook zelf in die dagen binnen Jeruzalem was”. Filippus, tetrarch van het noordoosten, bouwde Caesarea Filippi en stierf omstreeks 34 n.Chr. Kajafas, schoonzoon van Annas en “welke deszelven jaars hogepriester was”, was hogepriester van ongeveer 18 tot 36 of 37 n.Chr.: Josephus zegt dat Gratus hem benoemde en Vitellius hem afzette. In 36 zond de legaat Vitellius Pilatus naar Rome om zich te verantwoorden, en Tiberius stierf in maart 37 voordat hij arriveerde."
  sv:
    - "Vid korsfästelsen, omkring år 30 e.Kr. enligt kartans konventionella datering (33 e.Kr. förekommer också), var Judeen en romersk provins styrd av prefekten Pontius Pilatus, som innehade ämbetet från omkring 26 till 36, under kejsar Tiberius (14–37 e.Kr.). Galileen, varifrån Jesus kom, ingick inte i provinsen: det styrdes av Herodes Antipas, tetrarken, son till Herodes den store. Översteprästen i Jerusalem var Kajafas."
    - "Lukas ställer scenen när Johannes Döparen börjar predika: ”I femtonde året av kejsar Tiberius’ regering, när Pontius Pilatus var landshövding i Judeen, och Herodes var landsfurste i Galileen, och hans broder Filippus landsfurste i Itureen och Trakonitis-landet, och Lysanias landsfurste i Abilene, på den tid då Hannas var överstepräst jämte Kaifas”. Tiberius’ femtonde år räknas vanligen som 28/29 e.Kr. Judeen hade kommit under direkt romerskt styre år 6 e.Kr., då Augustus avsatte Archelaos; Josefus säger att Pilatus sändes efter att Gratus hade styrt i elva år och att han själv stannade i tio år, och en sten som hittades i teatern i Caesarea, ståthållarens säte, nämner honom som prefekt av Judeen. Översteprästerna överlämnade Jesus ”åt Pilatus, landshövdingen”, och det var han som fällde domen; ”Vi hava ingen annan konung än kejsaren”, sade de till honom."
    - "Herodes Antipas styrde Galileen och Peraea från sin faders död, omkring 4 f.Kr., och grundade Tiberias omkring år 20 e.Kr.; när Pilatus fick veta att Jesus hörde till Herodes’ område, sände han honom till Herodes, som då också var i Jerusalem. Filippos, tetrark i nordost, byggde Caesarea Filippi och dog omkring år 34 e.Kr. Kajafas, svärson till Hannas och ”överstepräst det året”, var överstepräst från omkring år 18 till 36 eller 37: Josefus säger att Gratus utnämnde honom och Vitellius avsatte honom. År 36 sände legaten Vitellius Pilatus till Rom för att svara för sitt styre, och Tiberius dog i mars 37 innan han hann fram."
  nb:
    - "Ved korsfestelsen, omkring 30 e.Kr. etter kartets konvensjonelle dato (33 e.Kr. er også hevdet), var Judea en romersk provins styrt av prefekten Pontius Pilatus, som hadde embetet fra omkring 26 til 36, under keiser Tiberius (14–37 e.Kr.). Galilea, der Jesus kom fra, var ikke en del av provinsen: det ble styrt av Herodes Antipas, tetrarken, sønn av Herodes den store. Yppersteprest i Jerusalem var Kaifas."
    - "Lukas setter scenen da døperen Johannes begynner å forkynne: «I det femtende år av keiser Tiberius’ regjering, mens Pontius Pilatus var landshøvding i Judea, og Herodes fjerdingsfyrste i Galilea, og hans bror Filip fjerdingsfyrste i det itureiske og trakonittiske land, og Lysanias fjerdingsfyrste i Abilene, mens Annas og Kaifas var yppersteprester». Tiberius’ femtende år regnes vanligvis som 28/29 e.Kr. Judea hadde kommet under direkte romersk styre i 6 e.Kr., da Augustus avsatte Arkelaus; Josefus sier at Pilatus ble sendt etter at Gratus hadde styrt i elleve år og at han selv ble i ti år, og en stein funnet i teatret i Cæsarea, landshøvdingens sete, navngir ham som prefekt av Judea. Yppersteprestene overgav Jesus «til landshøvdingen Pilatus», og det var han som avsa dommen; «Vi har ingen annen konge enn keiseren», sa de til ham."
    - "Herodes Antipas styrte Galilea og Perea fra sin fars død, omkring 4 f.Kr., og grunnla Tiberias omkring 20 e.Kr.; da Pilatus «fikk vite at han hørte under Herodes, sendte han ham til Herodes, som også var i Jerusalem i de dager». Filip, tetrark over nordøst, bygde Cæsarea Filippi og døde omkring 34 e.Kr. Kaifas, svigersønn av Annas og «yppersteprest det år», var yppersteprest fra omkring 18 til 36 eller 37 e.Kr.: Josefus sier at Gratus utnevnte ham og Vitellius avsatte ham. I 36 sendte legaten Vitellius Pilatus til Roma for å stå til ansvar for sitt styre, og Tiberius døde i mars 37 før han ankom."
  tl:
    - "Sa pagpapako sa krus, mga 30 AD sa kumbensiyonal na petsa ng mapa (33 AD ay hawak din), ang Judea ay isang lalawigang Romano na pinamunuan ng prepekto na si Poncio Pilato, na humawak ng tungkulin mula mga 26 hanggang 36, sa ilalim ng emperador na si Tiberio (14–37 AD). Hindi bahagi ng lalawigan ang Galilea, kung saan nagmula si Jesus: pinamunuan ito ni Herodes Antipas, ang tetrarka, anak ni Herodes na Dakila. Ang mataas na saserdote sa Jerusalem ay si Caifas."
    - "Itinakda ni Lucas ang pangangaral ni Juan Bautista: “Nang ikalabinglimang taon nga ng paghahari ni Tiberio Cesar, na noo'y gobernador sa Judea si Poncio Pilato, at tetrarka sa Galilea si Herodes, at ang kaniyang kapatid na si Felipe ay tetrarka sa lalawigan ng Iturea at Traconite, at si Lisanias ay tetrarka sa Abilinia, nang kasalukuyang mga pangulong saserdote si Anas at si Caifas”. Karaniwang binibilang ang ika-15 taon ni Tiberio bilang 28/29 AD. Direktang pinamahalaan ng Roma ang Judea mula 6 AD, nang alisin ni Augusto si Arquelao; ayon kay Josephus, ipinadala si Pilato matapos mamuno si Gratus nang 11 taon, at nanatili siya nang sampu, at isang batong natagpuan sa teatro sa Cesarea, luklukan ng gobernador, ang nagpapangalan sa kaniya na prepekto ng Judea. Ibinigay ng mga pangulong saserdote si Jesus “kay Pilato na gobernador”, na humatol; “Wala kaming hari kundi si Cesar”, sabi nila."
    - "Pinamunuan ni Herodes Antipas ang Galilea at Perea mula sa kamatayan ng kaniyang ama, mga 4 BK, at itinatag ang Tiberias mga 20 AD; nang “maunawa na siya'y nasasakop ni Herodes, ay ipinadala niya siya kay Herodes, na nang mga araw na yaon ay nasa Jerusalem din naman”. Si Felipe, tetrarka ng hilagang-silangan, ay nagtayo ng Cesarea ni Filipo at namatay mga 34 AD. Si Caifas, manugang ni Anas at “dakilang saserdote nang taong yaon”, ay mataas na saserdote mula mga 18 hanggang 36 o 37 AD: sinasabi ni Josephus na hinirang siya ni Gratus at inalis ni Vitellius. Noong 36, ipinadala ng lehado na si Vitellius si Pilato sa Roma upang managot, at namatay si Tiberio noong Marso 37 bago siya dumating."
  da:
    - "Ved korsfæstelsen, omkring 30 e.Kr. efter kortets konventionelle dato (33 e.Kr. hævdes også), var Judæa en romersk provins styret af præfekten Pontius Pilatus, som beklædte embedet fra omkring 26 til 36, under kejser Tiberius (14-37 e.Kr.). Galilæa, hvor Jesus kom fra, var ikke en del af provinsen: Det blev regeret af Herodes Antipas, fjerdingsfyrsten, søn af Herodes den Store. Ypperstepræsten i Jerusalem var Kajfas."
    - "Lukas sætter scenen, da Johannes Døberen begynder at prædike: »Men i Kejser Tiberius’s femtende Regeringsaar, da Pontius Pilatus var Landshøvding i Judæa, og Herodes var Fjerdingsfyrste i Galilæa, og hans Broder Filip var Fjerdingsfyrste i Ituræa og Trakonitis’s Land og Lysanias Fjerdingsfyrste i Abilene, medens Annas og Kajfas vare Ypperstepræster«. Tiberius’ femtende år regnes sædvanligvis for 28/29 e.Kr. Judæa var kommet under direkte romersk styre i 6 e.Kr., da Augustus afsatte Arkelaus; Josefus siger, at Pilatus blev sendt, efter at Gratus havde regeret i elleve år, og at han selv blev i ti år, og en sten fundet i teatret i Cæsarea, landshøvdingens sæde, nævner ham som præfekt over Judæa. Ypperstepræsterne overgav Jesus til »Landshøvdingen Pontius Pilatus«, og det var ham, der fældede dommen; »Vi have ingen Konge uden Kejseren«, sagde de til ham."
    - "Herodes Antipas regerede Galilæa og Peræa fra sin fars død, omkring 4 f.Kr., og grundlagde Tiberias omkring 20 e.Kr.; da Pilatus »fik at vide, at han var fra Herodes’s Omraade, sendte han ham til Herodes, som ogsaa selv var i Jerusalem i disse Dage«. Filip, fjerdingsfyrste i nordøst, byggede Cæsarea Filippi og døde omkring 34 e.Kr. Kajfas, svigersøn til Annas og »Ypperstepræst i det Aar«, var ypperstepræst fra omkring 18 til 36 eller 37 e.Kr.: Josefus siger, at Gratus indsatte ham, og Vitellius afsatte ham. I 36 sendte legaten Vitellius Pilatus til Rom for at stå til regnskab for sit styre, og Tiberius døde i marts 37, før han nåede frem."
  sr:
    - "У време распећа, око 30. н. е. по уобичајеном датуму на карти (држи се и 33), Јудеја је била римска провинција којом је управљао префект Понтије Пилат, који је био на дужности отприлике од 26. до 36, под царем Тиверијем (14–37. н. е.). Галилеја, одакле је Исус дошао, није била део провинције: њоме је владао Ирод Антипа, четворовласник, син Ирода Великог. Првосвештеник у Јерусалиму био је Кајафа."
    - "Лука поставља сцену кад Јован Крститељ почиње да проповеда: „У петнаестој години владања ћесара Тиверија, кад беше Понтије Пилат судија у Јудеји, и Ирод четворовласник у Галилеји, а Филип брат његов четворовласник у Итуреји и у трахонитској, и Лисанија четворовласник у Авилини, за поглавара свештеничких Ане и Кајафе“. Петнаеста година Тиверијева обично се рачуна као 28/29. н. е. Јудеја је дошла под непосредну римску власт 6. н. е., кад је Август свргнуо Архелаја; Јосиф Флавије каже да је Пилат послан пошто је Грат управљао једанаест година и да је сам остао десет година, а камен пронађен у позоришту у Цезареји, седишту намесника, именује га префектом Јудеје. Главари свештенички предали су Исуса „Понтију Пилату, судији“, и он је изрекао пресуду; „Ми немамо цара осим ћесара“, рекли су му."
    - "Ирод Антипа је владао Галилејом и Перејом од очеве смрти, око 4. п. н. е., и основао је Тиверијаду око 20. н. е.; Пилат је, „разумевши да је из подручја Иродовог посла Га Ироду, који такође беше у Јерусалиму оних дана“. Филип, четворовласник североистока, подигао је Цезареју Филипову и умро око 34. н. е. Кајафа, зет Ане и „поглавар свештенички оне године“, био је првосвештеник отприлике од 18. до 36. или 37. н. е.: Јосиф Флавије каже да га је Грат поставио, а Вителије уклонио. Године 36. легат Вителије послао је Пилата у Рим да одговара за своју управу, а Тиверије је умро у марту 37, пре него што је стигао."
  hu:
    - "A keresztre feszítéskor, a térkép hagyományos dátuma szerint Kr. u. 30 körül (33-at is vallanak), Júdea római provincia volt, amelyet Pontius Pilátus prefektus kormányzott, aki körülbelül 26-tól 36-ig volt hivatalban, Tiberius császár alatt (Kr. u. 14–37). Galilea, ahonnan Jézus származott, nem tartozott a provinciához: Heródes Antipász tetrarcha, Nagy Heródes fia uralta. A jeruzsálemi főpap Kajafás volt."
    - "Lukács a színteret Keresztelő János fellépésekor rajzolja meg: „Tibérius császár uralkodásának tizenötödik esztendejében pedig, mikor Júdeában Ponczius Pilátus volt a helytartó, és Galileának negyedes fejedelme Heródes, Iturea és Trakhónitis tartományának pedig negyedes fejedelme az ő testvére Filep, Abiléné negyedes fejedelme meg Lisániás, Annás és Kajafás főpapsága alatt”. Tiberius 15. évét általában Kr. u. 28/29-nek számítják. Júdea Kr. u. 6-ban került közvetlen római uralom alá, amikor Augusztus letette Arkhelaoszt; Josephus szerint Pilátust azután küldték, hogy Gratus tizenegy évig kormányzott, és ő maga tíz évig maradt, a helytartó székhelyén, Cézáreában a színházban talált kő pedig Júdea prefektusaként nevezi meg. A főpapok Jézust „Ponczius Pilátusnak a helytartónak” adták át, és ő mondta ki az ítéletet; „Nem királyunk van, hanem császárunk!”, mondták neki."
    - "Heródes Antipász apja halálától, Kr. e. 4 körül uralta Galileát és Pereát, és Kr. u. 20 körül alapította Tiberiast; amikor Pilátus megtudta, hogy „ő a Héródes hatósága alá tartozik, Héródeshez küldé őt, mivelhogy az is Jeruzsálemben vala azokban a napokban”. Fülöp, az északkeleti tetrarcha, megépítette Fülöp Cézáreáját, és Kr. u. 34 körül halt meg. Kajafás, Annás veje és „a ki abban az esztendőben főpap vala”, Kr. u. 18-tól 36-ig vagy 37-ig volt főpap: Josephus szerint Gratus nevezte ki, Vitellius mozdította el. 36-ban Vitellius legátus Rómába küldte Pilátust, hogy számot adjon uralmáról, Tiberius pedig 37 márciusában meghalt, mielőtt megérkezett volna."
  fi:
    - "Ristiinnaulitsemisen aikaan, kartan sovinnaisen ajoituksen mukaan noin 30 jaa. (myös 33 jaa. esitetään), Juudea oli Rooman provinssi, jota hallitsi prefekti Pontius Pilatus, joka oli virassa noin 26–36 keisari Tiberiuksen (14–37 jaa.) alaisuudessa. Galilea, josta Jeesus oli kotoisin, ei kuulunut provinssiin: sitä hallitsi tetrarkki Herodes Antipas, Herodes Suuren poika. Ylipappi Jerusalemissa oli Kaifas."
    - "Luukas ajoittaa Johannes Kastajan saarnan alun: ”Viidentenätoista keisari Tiberiuksen hallitusvuotena, kun Pontius Pilatus oli Juudean maaherrana ja Herodes Galilean neljännysruhtinaana ja hänen veljensä Filippus Iturean ja Trakonitiinmaan neljännysruhtinaana ja Lysanias Abilenen neljännysruhtinaana, siihen aikaan kun Hannas oli ylimmäisenä pappina, ynnä myös Kaifas”. Tiberiuksen viidentoista hallitusvuoden katsotaan yleensä olevan 28/29 jaa. Juudea joutui suoraan Rooman hallintoon vuonna 6 jaa., kun Augustus syrjäytti Arkelaoksen; Josefuksen mukaan Pilatus tuli Gratuksen hallittua yksitoista vuotta ja pysyi virassa kymmenen vuotta, ja Kesarean teatterista, maaherran asuinpaikasta, löydetty kivi nimeää hänet Juudean prefektiksi. Ylipapit antoivat Jeesuksen ”maaherran, Pilatuksen, käsiin”, ja tämä antoi tuomion; ”Ei meillä ole kuningasta, vaan keisari”, he sanoivat."
    - "Herodes Antipas hallitsi Galileaa ja Pereaa isänsä kuolemasta, noin 4 eaa., ja perusti Tiberiaan noin 20 jaa.; kun Pilatus sai tietää, että Jeesus kuului Herodeksen hallintoalueeseen, hän lähetti hänet Herodeksen eteen, ”joka hänkin niinä päivinä oli Jerusalemissa”. Filippos, koillisen tetrarkki, rakensi Filippoksen Kesarean ja kuoli noin 34 jaa. Kaifas, Hannaan vävy ja ”sinä vuonna ylimmäisenä pappina”, oli ylipappi noin 18–36 tai 37 jaa.: Josefus sanoo Gratuksen nimittäneen hänet ja Vitelliuksen erottaneen hänet. Vuonna 36 legaatti Vitellius lähetti Pilatuksen Roomaan vastaamaan hallinnostaan, ja Tiberius kuoli maaliskuussa 37 ennen hänen saapumistaan."
  vi:
    - "Vào lúc đóng đinh, khoảng năm 30 theo niên đại quy ước của bản đồ (năm 33 cũng được giữ), Giu-đê là một tỉnh La Mã do thống đốc Bôn-xơ Phi-lát cai quản, giữ chức từ khoảng năm 26 đến 36, dưới hoàng đế Ti-be-rơ (14–37). Ga-li-lê, quê của Giê-su, không thuộc tỉnh: nó do Hê-rốt An-ti-ba, vua chư hầu (tetrarch), con của Hê-rốt Đại đế, cai trị. Thầy tế lễ thượng phẩm ở Giê-ru-sa-lem là Cai-phe."
    - "Lu-ca đặt bối cảnh khi Giăng Báp-tít bắt đầu rao giảng: “Năm thứ mười lăm đời Sê-sa Ti-be-rơ, khi Bôn-xơ Phi-lát làm quan tổng đốc xứ Giu-đê, Hê-rốt làm vua chư hầu xứ Ga-li-lê, Phi-líp em vua ấy làm vua chư hầu xứ Y-tu-rê và tỉnh Tra-cô-nít, Ly-sa-ni-a làm vua chư hầu xứ A-by-len, An-ne và Cai-phe làm thầy cả thượng phẩm”. Năm thứ mười lăm của Ti-be-rơ thường được tính là năm 28/29. Giu-đê chịu sự cai trị trực tiếp của La Mã từ năm 6, khi Au-gút-tơ phế truất A-chê-la-u; Josephus nói Phi-lát được sai đến sau khi Gratus cai quản mười một năm, còn chính ông ở lại mười năm, và một tấm đá tìm thấy trong nhà hát ở Sê-sa-rê, thủ phủ của tổng đốc, nêu tên ông là thống đốc Giu-đê. Các thầy tế lễ cả nộp Giê-su “cho Phi-lát, là quan tổng đốc”, và chính ông tuyên án; “Chúng tôi không có vua khác, chỉ Sê-sa mà thôi”, họ nói với ông."
    - "Hê-rốt An-ti-ba cai trị Ga-li-lê và Perea từ khi cha chết, khoảng năm 4 TCN, và lập Ti-bê-ri-át khoảng năm 20; khi Phi-lát “biết Ngài thuộc quyền cai trị của vua Hê-rốt, bèn giải đến cho vua Hê-rốt, vua ấy ở tại thành Giê-ru-sa-lem trong mấy ngày đó”. Phi-líp, vua chư hầu miền đông bắc, xây Sê-sa-rê Phi-líp và chết khoảng năm 34. Cai-phe, con rể của An-ne và “làm thầy cả thượng phẩm đang niên”, làm thầy tế lễ thượng phẩm từ khoảng năm 18 đến 36 hoặc 37: Josephus nói Gratus bổ nhiệm ông và Vitellius phế truất ông. Năm 36, quan tổng trấn (legatus) Vitellius gởi Phi-lát về Rô-ma để giải trình về sự cai trị, và Ti-be-rơ qua đời tháng 3 năm 37 trước khi ông đến."
  ro:
    - "La răstignire, în jurul anului 30 d.Hr. după data convențională a hărții (se susține și 33 d.Hr.), Iudeea era o provincie romană guvernată de prefectul Pontiu Pilat, care a deținut funcția din circa 26 până în 36, sub împăratul Tiberiu (14–37 d.Hr.). Galileea, de unde venea Isus, nu făcea parte din provincie: era condusă de Irod Antipa, tetrarhul, fiul lui Irod cel Mare. Marele preot din Ierusalim era Caiafa."
    - "Luca așază scena când Ioan Botezătorul începe să predice: „Iar în anul al cincisprezecelea al împărăției lui Tiberie Chesarului domnind Pilat din Pont în Iudeea și Irod stăpânind a patra parte pre Galileea, iar Filip fratele lui, stăpânind a patra parte pre Ituria și pre laturea Trahoniei, și Lisanie a patra parte stăpânind pre Avilinia; În zilele Arhiereilor Ana și Caiafa”. Anul al cincisprezecelea al lui Tiberiu este de obicei 28/29 d.Hr. Iudeea intrase sub stăpânire romană directă în 6 d.Hr., când Augustus l-a depus pe Arhelau; Iosif Flaviu spune că Pilat a fost trimis după unsprezece ani de guvernare a lui Gratus și a rămas zece ani, iar o piatră găsită în teatrul de la Cezareea, sediul guvernatorului, îl numește prefect al Iudeii. Arhiereii l-au dat pe Isus „domnului Pilat din Pont”, care a dat sentința; „n’avem împărat fără numai pre Chesarul”, i-au spus."
    - "Irod Antipa a condus Galileea și Perea de la moartea tatălui său, în jurul anului 4 î.Hr., și a întemeiat Tiberiada în jurul anului 20 d.Hr.; când Pilat a înțeles „că din ținutul lui Irod este, l-a trimis pre el la Irod, fiind și el în Ierusalim într’acele zile”. Filip, tetrarhul din nord-est, a construit Cezareea lui Filip și a murit în jurul anului 34 d.Hr. Caiafa, ginerele lui Ana și „arhiereu al anului aceluia”, a fost mare preot din circa 18 până în 36 sau 37 d.Hr.: Iosif Flaviu spune că Gratus l-a numit și Vitellius l-a înlăturat. În 36, legatul Vitellius l-a trimis pe Pilat la Roma să răspundă pentru conducerea sa, iar Tiberiu a murit în martie 37, înainte ca el să ajungă."
  bg:
    - "При разпятието, около 30 г. н.е. по условната дата на картата (поддържа се и 33 г. н.е.), Юдея беше римска провинция, управлявана от префекта Понтий Пилат, който заемаше длъжността от около 26 до 36 г., при император Тиберий (14–37 г. н.е.). Галилея, откъдето беше Исус, не влизаше в провинцията: тя се управляваше от четвъртовластника Ирод Антипа, син на Ирод Велики. Първосвещеник в Йерусалим беше Каиафа."
    - "Лука описва обстановката, когато Йоан Кръстител започва да проповядва: „А в петнадесетата година на владението на Тиверия Кесаря, когато Понтийски Пилат бе управител на Юдея, а Ирод четверовластник в Галилея, и Филип брат му четверовластник в Итурея и в Трахонитската страна, и Лисаний четверовластник в Авилиния, във времето на архиереите Анна и Каиафа“. Петнадесетата година на Тиберий обикновено се изчислява като 28/29 г. н.е. Юдея попадна под пряка римска власт през 6 г. н.е., когато Август свали Архелай; според Йосиф Флавий Пилат бил изпратен, след като Грат управлявал единадесет години, и останал десет години, а камък от театъра в Кесария, седалището на управителя, го назовава префект на Юдея. Първосвещениците предадоха Исус „на управителя Понтийскаго Пилата“ и той произнесе присъдата; „Ние немаме друг цар освен Кесаря“, казаха му те."
    - "Ирод Антипа управляваше Галилея и Перея от смъртта на баща си, около 4 г. пр.н.е., и основа Тивериада около 20 г. н.е.; когато Пилат „разбра че е от Иродовата държава, проводи го до Ирода, който беше и той в Ерусалим през тия дни“. Филип, четвъртовластник на североизтока, построи Кесария Филипова и умря около 34 г. н.е. Каиафа, зет на Анна и „първосвещеник през тази година“, беше първосвещеник от около 18 до 36 или 37 г. н.е.: Йосиф Флавий казва, че Грат го назначил, а Вителий го сменил. През 36 г. легатът Вителий изпрати Пилат в Рим да отговаря за управлението си, а Тиберий умря през март 37 г., преди той да пристигне."
