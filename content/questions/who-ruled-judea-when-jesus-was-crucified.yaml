id: who-ruled-judea-when-jesus-was-crucified
question:
  en: "Who ruled Judea when Jesus was crucified?"
  ru: "Кто правил Иудеей, когда распяли Иисуса?"
  uk: "Хто правив Юдеєю, коли розіп'яли Ісуса?"
  es: "¿Quién gobernaba Judea cuando Jesús fue crucificado?"
  pt: "Quem governava a Judeia quando Jesus foi crucificado?"
  de: "Wer herrschte über Judäa, als Jesus gekreuzigt wurde?"
  fr: "Qui gouvernait la Judée quand Jésus fut crucifié ?"
answer:
  en:
    - "At the crucifixion, about AD 30 on the map's conventional date (AD 33 is also held), Judea was a Roman province governed by the prefect Pontius Pilate, who held office from about 26 to 36, under the emperor Tiberius (AD 14–37). Galilee, where Jesus came from, was not part of the province: it was ruled by Herod Antipas, the tetrarch, son of Herod the Great. The high priest in Jerusalem was Caiaphas."
    - 'Luke sets the scene when John the Baptist begins to preach: "Now in the fifteenth year of the reign of Tiberius Caesar, Pontius Pilate being governor of Judaea, and Herod being tetrarch of Galilee, and his brother Philip tetrarch of Ituraea and of the region of Trachonitis, and Lysanias the tetrarch of Abilene, Annas and Caiaphas being the high priests". The fifteenth year of Tiberius is usually reckoned as AD 28/29. Judea had come under direct Roman rule in AD 6, when Augustus deposed Archelaus; Josephus says Pilate was sent after Gratus had governed eleven years and stayed ten years himself, and a stone found in the theatre at Caesarea, the governor''s seat, names him prefect of Judea. The chief priests delivered Jesus "to Pontius Pilate the governor", and it was he who passed sentence; "We have no king but Caesar", they told him.'
    - 'Herod Antipas ruled Galilee and Perea from his father''s death, about 4 BC, and founded Tiberias about AD 20; when Pilate "knew that he belonged unto Herod''s jurisdiction, he sent him to Herod, who himself also was at Jerusalem at that time". Philip, tetrarch of the north-east, built Caesarea Philippi and died about AD 34. Caiaphas, son-in-law of Annas and "the high priest that same year", was high priest from about AD 18 to 36 or 37: Josephus says Gratus appointed him and Vitellius removed him. In 36 the legate Vitellius sent Pilate to Rome to answer for his rule, and Tiberius died in March 37 before he arrived.'
  ru:
    - "При распятии — около 30 г. н. э. по условной дате карты (держатся и 33 г.) — Иудея была римской провинцией под управлением префекта Понтия Пилата, занимавшего должность примерно с 26 по 36 г., при императоре Тиверии (14–37 гг. н. э.). Галилея, откуда был Иисус, в провинцию не входила: ею правил четвертовластник Ирод Антипа, сын Ирода Великого. Первосвященником в Иерусалиме был Каиафа."
    - "Лука описывает обстановку, когда Иоанн Креститель начинает проповедь: «В пятнадцатый же год правления Тиверия кесаря, когда Понтий Пилат начальствовал в Иудее, Ирод был четвертовластником в Галилее, Филипп, брат его, четвертовластником в Итурее и Трахонитской области, а Лисаний четвертовластником в Авилинее, при первосвященниках Анне и Каиафе». Пятнадцатый год Тиверия обычно считают 28/29 г. н. э. Иудея перешла под прямое римское управление в 6 г. н. э., когда Август низложил Архелая; Иосиф Флавий пишет, что Пилата прислали после одиннадцати лет правления Грата и сам он пробыл десять лет, а камень, найденный в театре Кесарии, резиденции наместника, называет его префектом Иудеи. Первосвященники предали Иисуса «Понтию Пилату, правителю», и приговор вынес он; «нет у нас царя, кроме кесаря», — сказали они ему."
    - "Ирод Антипа правил Галилеей и Переей со смерти отца, около 4 г. до н. э., и около 20 г. н. э. основал Тивериаду; Пилат, «узнав, что Он из области Иродовой, послал Его к Ироду, который в эти дни был также в Иерусалиме». Филипп, четвертовластник северо-востока, построил Кесарию Филиппову и умер около 34 г. н. э. Каиафа, зять Анны, «который был на тот год первосвященником», занимал эту должность примерно с 18 по 36 или 37 г.: по Иосифу Флавию, его поставил Грат, а сместил Вителлий. В 36 г. легат Вителлий отослал Пилата в Рим держать ответ за своё правление, и Тиверий умер в марте 37 г., прежде чем тот прибыл."
  uk:
    - "Під час розп'яття, близько 30 р. н. е. за умовною датою мапи (тримаються також 33 р. н. е.), Юдея була римською провінцією, якою керував префект Понтій Пилат, що обіймав посаду приблизно з 26 до 36 р., за імператора Тиверія (14–37 рр. н. е.). Галілея, звідки походив Ісус, не входила до провінції: нею правив Ірод Антипа, тетрарх, син Ірода Великого. Первосвящеником в Єрусалимі був Каяфа."
    - "Лука окреслює обстановку, коли Іван Хреститель починає проповідувати: «У пятнайцятий же рік правлення Тиверия кесаря, як був ігемоном Понтийський Пилат в Юдеї, а четверовластником у Галилеї Ірод, Филип же, брат його, четверовластником в Ітуреї і Трахонській землї, а Лисаний четверовластником в Авилинї, за архиєреїв Анни та Каяфи». П'ятнадцятий рік Тиверія зазвичай обчислюють як 28/29 р. н. е. Юдея перейшла під пряме римське управління 6 р. н. е., коли Август скинув Архелая; Йосиф Флавій каже, що Пилата було послано після того, як Грат правив одинадцять років, і що сам він пробув десять років, а камінь, знайдений у театрі в Кесарії, осідку намісника, називає його префектом Юдеї. Первосвященики передали Ісуса «Понтийському Пилату, ігемонові», і саме він виголосив вирок; «Не маємо царя, тільки Кесаря», — сказали вони йому."
    - "Ірод Антипа правив Галілеєю та Переєю від смерті батька, близько 4 р. до н. е., і заснував Тіверіаду близько 20 р. н. е.; коли Пилат, як сказано, «довідавшись, що Він присуду Іродового, післав Його до Ірода, що також був у Єрусалимі тими днями». Пилип, тетрарх північного сходу, збудував Кесарію Пилипову і помер близько 34 р. н. е. Каяфа, зять Анни і «архиєреєм того року», був первосвящеником приблизно з 18 до 36 чи 37 р. н. е.: Йосиф Флавій каже, що його призначив Грат, а усунув Вітеллій. 36 р. легат Вітеллій відправив Пилата до Рима відповідати за його правління, і Тиверій помер у березні 37 р., перш ніж той прибув."
  es:
    - "En la crucifixión, hacia el 30 d. C. en la fecha convencional del mapa (también se sostiene el 33 d. C.), Judea era una provincia romana gobernada por el prefecto Poncio Pilato, que ocupó el cargo desde aproximadamente el 26 hasta el 36, bajo el emperador Tiberio (14–37 d. C.). Galilea, de donde procedía Jesús, no formaba parte de la provincia: la gobernaba Herodes Antipas, el tetrarca, hijo de Herodes el Grande. El sumo sacerdote en Jerusalén era Caifás."
    - "Lucas sitúa la escena cuando Juan el Bautista empieza a predicar: «en el año quince del imperio de Tiberio César, siendo gobernador de Judea Poncio Pilato, y Herodes tetrarca de Galilea, y su hermano Felipe tetrarca de Iturea y de la provincia de Traconite, y Lisanias tetrarca de Abilinia, siendo sumos sacerdotes Anás y Caifás». El año quince de Tiberio se calcula por lo común en el 28/29 d. C. Judea había pasado a dominio romano directo en el 6 d. C., cuando Augusto depuso a Arquelao; Josefo dice que Pilato fue enviado después de que Grato gobernara once años y que él permaneció diez años, y una piedra hallada en el teatro de Cesarea, sede del gobernador, lo nombra prefecto de Judea. Los principales sacerdotes entregaron a Jesús «á Poncio Pilato presidente», y fue él quien dictó la sentencia; «No tenemos rey sino á César», le dijeron."
    - "Herodes Antipas gobernó Galilea y Perea desde la muerte de su padre, hacia el 4 a. C., y fundó Tiberíades hacia el 20 d. C.; cuando Pilato «entendió que era de la jurisdicción de Herodes, le remitió á Herodes, el cual también estaba en Jerusalem en aquellos días». Felipe, tetrarca del noreste, construyó Cesarea de Filipo y murió hacia el 34 d. C. Caifás, yerno de Anás y «pontífice de aquel año», fue sumo sacerdote desde aproximadamente el 18 hasta el 36 o 37: Josefo dice que Grato lo nombró y Vitelio lo depuso. En el 36 el legado Vitelio envió a Pilato a Roma para responder de su gobierno, y Tiberio murió en marzo del 37 antes de que llegara."
  pt:
    - "Na crucificação, por volta de 30 d.C. na data convencional do mapa (também se defende 33 d.C.), a Judeia era uma província romana governada pelo prefeito Pôncio Pilatos, que ocupou o cargo de cerca de 26 a 36, sob o imperador Tibério (14–37 d.C.). A Galileia, de onde Jesus vinha, não fazia parte da província: era governada por Herodes Antipas, o tetrarca, filho de Herodes, o Grande. O sumo sacerdote em Jerusalém era Caifás."
    - "Lucas descreve o cenário quando João Batista começa a pregar: “No décimo quinto ano do reinado de Tibério César, sendo Pôncio Pilatos governador da Judeia, Herodes tetrarca da Galileia, seu irmão Filipe tetrarca da região da Itureia e Traconites, e Lisânias tetrarca de Abilene, durante o sumo sacerdócio de Anás e Caifás”. O décimo quinto ano de Tibério costuma ser calculado como 28/29 d.C. A Judeia passara ao domínio romano direto em 6 d.C., quando Augusto depôs Arquelau; Josefo diz que Pilatos foi enviado depois que Grato governou onze anos e que ele próprio ficou dez anos, e uma pedra encontrada no teatro de Cesareia, sede do governador, o nomeia prefeito da Judeia. Os principais sacerdotes entregaram Jesus “a Pôncio Pilatos, o governador”, e foi ele quem proferiu a sentença; “Não temos rei senão César!”, disseram-lhe."
    - "Herodes Antipas governou a Galileia e a Pereia desde a morte do pai, por volta de 4 a.C., e fundou Tiberíades por volta de 20 d.C.; quando Pilatos “descobriu que ele era da jurisdição de Herodes, enviou-o a Herodes, que também estava em Jerusalém naqueles dias”. Filipe, tetrarca do nordeste, construiu Cesareia de Filipe e morreu por volta de 34 d.C. Caifás, genro de Anás e “o sumo sacerdote naquele ano”, foi sumo sacerdote de cerca de 18 a 36 ou 37 d.C.: Josefo diz que Grato o nomeou e Vitélio o removeu. Em 36, o legado Vitélio enviou Pilatos a Roma para responder por seu governo, e Tibério morreu em março de 37, antes de ele chegar."
  de:
    - "Bei der Kreuzigung, nach dem konventionellen Datum der Karte um 30 n. Chr. (auch 33 wird vertreten), war Judäa eine römische Provinz, regiert vom Präfekten Pontius Pilatus, der etwa von 26 bis 36 im Amt war, unter dem Kaiser Tiberius (14–37 n. Chr.). Galiläa, woher Jesus kam, gehörte nicht zur Provinz: Es wurde von Herodes Antipas regiert, dem Tetrarchen, Sohn Herodes’ des Großen. Der Hohepriester in Jerusalem war Kaiphas."
    - "Lukas setzt den Rahmen für Johannes den Täufer: „In dem fünfzehnten Jahr des Kaisertums Kaisers Tiberius, da Pontius Pilatus Landpfleger in Judäa war und Herodes ein Vierfürst in Galiläa und sein Bruder Philippus ein Vierfürst in Ituräa und in der Gegend Trachonitis und Lysanias ein Vierfürst zu Abilene, da Hannas und Kaiphas Hohepriester waren“. Das fünfzehnte Jahr des Tiberius wird meist als 28/29 n. Chr. gerechnet. Judäa war 6 n. Chr. unter direkte römische Herrschaft gekommen, als Augustus Archelaus absetzte; Josephus berichtet, Pilatus sei nach elf Regierungsjahren des Gratus gesandt worden und selbst zehn Jahre geblieben, und ein im Theater von Caesarea, dem Sitz des Statthalters, gefundener Stein nennt ihn Präfekt von Judäa. Die Hohenpriester übergaben Jesus „dem Landpfleger Pontius Pilatus“, und er sprach das Urteil; „Wir haben keinen König denn den Kaiser“, sagten sie ihm."
    - "Herodes Antipas herrschte seit dem Tod seines Vaters um 4 v. Chr. über Galiläa und Peräa und gründete um 20 n. Chr. Tiberias; als Pilatus „vernahm, daß er unter des Herodes Obrigkeit gehörte, übersandte er ihn zu Herodes, welcher in den Tagen auch zu Jerusalem war“. Philippus, Tetrarch des Nordostens, baute Caesarea Philippi und starb um 34 n. Chr. Kaiphas, Schwiegersohn des Hannas und „welcher des Jahres Hoherpriester war“, war etwa von 18 bis 36 oder 37 n. Chr. Hoherpriester: Josephus sagt, Gratus habe ihn eingesetzt und Vitellius abgesetzt. Im Jahr 36 schickte der Legat Vitellius Pilatus nach Rom, um sich für seine Amtsführung zu verantworten, und Tiberius starb im März 37, bevor er ankam."
  fr:
    - "À la crucifixion, vers 30 apr. J.-C. selon la date conventionnelle de la carte (33 apr. J.-C. est aussi retenu), la Judée était une province romaine gouvernée par le préfet Ponce Pilate, en fonction d’environ 26 à 36, sous l’empereur Tibère (14-37 apr. J.-C.). La Galilée, d’où venait Jésus, ne faisait pas partie de la province : elle était gouvernée par Hérode Antipas, le tétrarque, fils d’Hérode le Grand. Le grand prêtre à Jérusalem était Caïphe."
    - "Luc situe le début de la prédication de Jean-Baptiste : « La quinzième année du règne de Tibère César, lorsque Ponce Pilate était gouverneur de la Judée, Hérode tétrarque de la Galilée, son frère Philippe tétrarque de l’Iturée et du territoire de la Trachonite, Lysanias tétrarque de l’Abilène, et du temps des souverains sacrificateurs Anne et Caïphe ». La quinzième année de Tibère est généralement comptée comme 28-29 apr. J.-C. La Judée était passée sous domination romaine directe en 6 apr. J.-C., quand Auguste déposa Archélaüs ; selon Flavius Josèphe, Pilate fut envoyé après onze ans de gouvernement de Gratus et resta dix ans, et une pierre trouvée dans le théâtre de Césarée, siège du gouverneur, le nomme préfet de Judée. Les chefs des prêtres livrèrent Jésus « à Ponce Pilate, le gouverneur », qui le condamna ; « Nous n’avons de roi que César », lui dirent-ils."
    - "Hérode Antipas gouverna la Galilée et la Pérée depuis la mort de son père, vers 4 av. J.-C., et fonda Tibériade vers 20 apr. J.-C. ; quand Pilate, « ayant appris qu’il était de la juridiction d’Hérode, … le renvoya à Hérode, qui se trouvait aussi à Jérusalem en ces jours-là ». Philippe, tétrarque du nord-est, bâtit Césarée de Philippe et mourut vers 34 apr. J.-C. Caïphe, gendre d’Anne et « souverain sacrificateur cette année-là », fut grand prêtre d’environ 18 à 36 ou 37 apr. J.-C. : Flavius Josèphe dit que Gratus le nomma et que Vitellius le destitua. En 36, le légat Vitellius envoya Pilate à Rome pour répondre de son gouvernement, et Tibère mourut en mars 37 avant son arrivée."
