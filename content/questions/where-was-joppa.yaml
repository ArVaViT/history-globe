id: where-was-joppa
question:
  en: "Where was Joppa, where Peter raised Tabitha?"
  ru: "Где находилась Иоппия, где Пётр воскресил Тавифу?"
  uk: "Де була Яффа, де Петро воскресив Тавіту?"
  es: "¿Dónde estaba Jope, donde Pedro resucitó a Tabita?"
  pt: "Onde ficava Jope, onde Pedro ressuscitou Tabita?"
  de: "Wo lag Joppe, wo Petrus Tabita auferweckte?"
  fr: "Où se trouvait Joppé, où Pierre ressuscita Tabitha ?"
answer:
  en:
    - "Joppa is Jaffa, the old port on a rocky headland at the southern end of Tel Aviv-Yafo in Israel, about 55 km north-west of Jerusalem in a straight line; the map point stands on the ancient mound above the harbour. Its small natural harbour, sheltered by a line of rocks, was the only real port on that stretch of coast, and for the hill country it served as the port of Jerusalem. Jonah's flight from Joppa is told in a separate question."
    - "Timber for the Temple came this way. Hiram of Tyre promised Solomon: “we will bring it to thee in floats by sea to Joppa; and thou shalt carry it up to Jerusalem”, and the exiles who returned from Babylon brought cedar from Lebanon to Joppa again for the second Temple. The town is far older than Israel: Thutmose III took it in the fifteenth century BC, an Egyptian tale tells how his general smuggled soldiers into it hidden in sacks, and excavators have found the gate of the Egyptian fortress."
    - "In Acts “there was at Joppa a certain disciple named Tabitha, which by interpretation is called Dorcas: this woman was full of good works and almsdeeds”. When she died, the disciples sent for Peter from Lydda, about 18 km inland, and he raised her; “it was known throughout all Joppa; and many believed in the Lord.” Peter stayed on with Simon a tanner, “whose house is by the sea side”, and on its roof saw the vision of the sheet let down from heaven; then the messengers of the centurion Cornelius arrived from Caesarea, 51 km up the coast, and Peter went with them to the first gentile household to receive the Spirit. In old Jaffa a house by the sea is still shown as Simon's."
  ru:
    - "Иоппия — это Яффа, старая гавань на скалистом мысу у южного края Тель-Авива-Яффо в Израиле, примерно в 55 км к северо-западу от Иерусалима по прямой; точка карты стоит на древнем холме над гаванью. Её небольшая естественная гавань, прикрытая грядой скал, была единственным настоящим портом на этом отрезке побережья и служила горной стране гаванью Иерусалима. О бегстве Ионы из Иоппии рассказано в отдельном вопросе."
    - "Этим путём шёл лес для Храма. Хирам Тирский обещал Соломону: «пригоним их в плотах по морю в Яфу, а ты отвезешь их в Иерусалим», а вернувшиеся из Вавилона снова доставляли ливанский кедр в Иоппию для второго Храма. Город гораздо старше Израиля: Тутмос III взял его в XV веке до н. э., египетская повесть рассказывает, как его военачальник ввёл в город воинов, спрятанных в мешках, а раскопки открыли ворота египетской крепости."
    - "В Деяниях: «В Иоппии находилась одна ученица, именем Тавифа, что значит „серна“; она была исполнена добрых дел и творила много милостынь». Когда она умерла, ученики послали за Петром в Лидду, примерно в 18 км вглубь страны, и он воскресил её; «это сделалось известным по всей Иоппии, и многие уверовали в Господа». Пётр остался у Симона кожевника, «которого дом находится при море», и на его кровле увидел видение полотна, спущенного с неба; потом из Кесарии, в 51 км вверх по побережью, пришли посланные сотника Корнилия, и Пётр пошёл с ними в первый языческий дом, принявший Духа. В старой Яффе и сейчас показывают дом у моря как дом Симона."
  uk:
    - "Яффа — це Яффо, старий порт на скелястому мисі на південному краю Тель-Авів-Яффо в Ізраїлі, приблизно за 55 км на північний захід від Єрусалима по прямій; точка на мапі стоїть на давньому пагорбі над гаванню. Її мала природна гавань, захищена рядом скель, була єдиним справжнім портом на цій ділянці узбережжя, а для гірського краю слугувала портом Єрусалима. Втеча Йони з Яффи розказана в окремому питанні."
    - "Деревина для Храму йшла цим шляхом. Хірам Тірський обіцяв Соломонові: «приставимо їх в плотях морем до Яфи, а ти перевезеш їх у Ерусалим», а вигнанці, які повернулися з Вавилона, знову привезли кедр із Лівану до Яффи для другого Храму. Місто набагато давніше за Ізраїль: Тутмос III узяв його в XV ст. до н. е., єгипетська оповідь розповідає, як його полководець таємно провів у нього воїнів, захованих у мішках, а розкопники знайшли браму єгипетської фортеці."
    - "У Діях: «Була ж в Йоппиї одна учениця, на ймя Тавита, що перекладом зветь ся: Сарна. Ся була повна добрих учинків і милостинї, що робила.» Коли вона померла, учні послали по Петра до Лідди, приблизно за 18 км углиб країни, і він воскресив її; «І знане се стало по всїй Йоппиї, і многі увірували в Господа.» Петро залишився в Симона гарбаря, «що хата його над морем», і на його даху побачив видіння полотнища, спущеного з неба; потім з Кесарії, за 51 км вгору узбережжям, прибули посланці сотника Корнилія, і Петро пішов із ними до першої язичницької родини, що прийняла Духа. У старій Яффі досі показують будинок біля моря як Симонів."
  es:
    - "Jope es Jaffa, el viejo puerto sobre un promontorio rocoso en el extremo sur de Tel Aviv-Yafo, en Israel, a unos 55 km al noroeste de Jerusalén en línea recta; el punto del mapa está sobre el montículo antiguo que domina el puerto. Su pequeño puerto natural, resguardado por una hilera de rocas, era el único puerto de verdad en aquel tramo de costa, y para la región montañosa hacía de puerto de Jerusalén. La huida de Jonás desde Jope se cuenta en otra pregunta."
    - "Por aquí llegó la madera para el Templo. Hiram de Tiro prometió a Salomón: «te la traeremos en balsas por la mar hasta Joppe, y tú la harás llevar hasta Jerusalem», y los desterrados que volvieron de Babilonia llevaron de nuevo a Jope cedro del Líbano para el segundo Templo. La ciudad es mucho más antigua que Israel: Tutmosis III la tomó en el siglo XV a. C., un relato egipcio cuenta cómo su general introdujo en ella soldados ocultos en sacos, y los excavadores han hallado la puerta de la fortaleza egipcia."
    - "En los Hechos, «en Joppe había una discípula llamada Tabita, que si lo declaras, quiere decir Dorcas. Esta era llena de buenas obras y de limosnas que hacía». Cuando murió, los discípulos mandaron llamar a Pedro desde Lida, a unos 18 km tierra adentro, y él la resucitó; «Esto fué notorio por toda Joppe; y creyeron muchos en el Señor». Pedro se quedó con Simón, curtidor, «que tiene su casa junto á la mar», y en su azotea vio la visión del lienzo bajado del cielo; luego llegaron los mensajeros del centurión Cornelio desde Cesarea, a 51 km costa arriba, y Pedro fue con ellos a la primera casa gentil que recibió el Espíritu. En la vieja Jaffa aún se muestra como la de Simón una casa junto al mar."
  pt:
    - "Jope é Jafa, o antigo porto num promontório rochoso no extremo sul de Tel Aviv-Yafo, em Israel, a cerca de 55 km a noroeste de Jerusalém em linha reta; o ponto do mapa fica no antigo monte acima do porto. Seu pequeno porto natural, abrigado por uma linha de rochas, era o único porto de verdade naquele trecho da costa, e para a região montanhosa servia de porto de Jerusalém. A fuga de Jonas a partir de Jope é contada em uma pergunta à parte."
    - "A madeira para o Templo passava por aqui. Hirão de Tiro prometeu a Salomão: “Nós a traremos a você em jangadas pelo mar até Jope; então você a transportará para Jerusalém”, e os exilados que voltaram da Babilônia trouxeram novamente cedro do Líbano até Jope para o segundo Templo. A cidade é muito mais antiga do que Israel: Tutmés III a tomou no século XV a.C., um conto egípcio narra como o seu general nela introduziu soldados escondidos em sacos, e os escavadores encontraram a porta da fortaleza egípcia."
    - "Em Atos, “Havia em Jope uma certa discípula chamada Tabita, nome que, traduzido, significa Dorcas. Esta mulher era cheia de boas obras e atos de misericórdia que ela fazia”. Quando ela morreu, os discípulos mandaram chamar Pedro em Lida, a cerca de 18 km para o interior, e ele a ressuscitou; “Isso se tornou conhecido em toda a Jope, e muitos creram no Senhor.” Pedro ficou na casa de Simão, um curtidor, “cuja casa fica à beira-mar”, e em seu terraço teve a visão do lençol que descia do céu; então chegaram de Cesareia, 51 km costa acima, os mensageiros do centurião Cornélio, e Pedro foi com eles à primeira casa gentia a receber o Espírito. Na velha Jafa ainda se mostra uma casa à beira-mar como sendo a de Simão."
  de:
    - "Joppe ist Jaffa, der alte Hafen auf einer felsigen Landzunge am Südende von Tel Aviv-Jaffa in Israel, in der Luftlinie etwa 55 km nordwestlich von Jerusalem; der Kartenpunkt steht auf dem antiken Hügel über dem Hafen. Sein kleiner natürlicher Hafen, durch eine Felsenreihe geschützt, war der einzige wirkliche Hafen an diesem Küstenabschnitt und diente dem Bergland als Hafen Jerusalems. Jonas Flucht von Joppe wird in einer eigenen Frage erzählt."
    - "Das Bauholz für den Tempel kam auf diesem Weg. Hiram von Tyrus versprach Salomo: „wollen's auf Flößen bringen im Meer gen Japho; von da magst du es hinauf gen Jerusalem bringen“, und die aus Babylon Heimgekehrten brachten für den zweiten Tempel erneut Zedernholz vom Libanon nach Joppe. Die Stadt ist viel älter als Israel: Thutmosis III. nahm sie im 15. Jahrhundert v. Chr. ein, eine ägyptische Erzählung berichtet, wie sein General Soldaten in Säcken versteckt in sie einschmuggelte, und Ausgräber haben das Tor der ägyptischen Festung gefunden."
    - "In der Apostelgeschichte heißt es: „Zu Joppe aber war eine Jüngerin mit Namen Tabea (welches verdolmetscht heißt: Rehe), die war voll guter Werke und Almosen“. Als sie starb, ließen die Jünger Petrus aus Lydda holen, etwa 18 km landeinwärts, und er erweckte sie; „es ward kund durch ganz Joppe, und viele wurden gläubig an den HERRN.“ Petrus blieb bei Simon, einem Gerber, „des Haus am Meer liegt“, und sah auf dessen Dach die Vision vom Tuch, das vom Himmel herabgelassen wurde; dann trafen die Boten des Hauptmanns Kornelius aus Caesarea ein, 51 km die Küste hinauf, und Petrus ging mit ihnen zum ersten heidnischen Haus, das den Geist empfing. In Alt-Jaffa wird noch heute ein Haus am Meer als das Simons gezeigt."
  fr:
    - "Joppé est Jaffa, l’ancien port sur un promontoire rocheux à l’extrémité sud de Tel Aviv-Jaffa, en Israël, à environ 55 km au nord-ouest de Jérusalem à vol d’oiseau ; le point de la carte se trouve sur l’antique tertre qui domine le port. Son petit port naturel, abrité par une ligne de rochers, était le seul vrai port de cette portion de côte, et pour la région montagneuse il servait de port à Jérusalem. La fuite de Jonas depuis Joppé est racontée dans une question distincte."
    - "Le bois du Temple passait par là. Hiram de Tyr promit à Salomon : « nous te les expédierons par mer en radeaux jusqu’à Japho, et tu les feras monter à Jérusalem », et les exilés revenus de Babylone firent de nouveau venir du cèdre du Liban à Joppé pour le second Temple. La ville est bien plus ancienne qu’Israël : Thoutmosis III la prit au XVe siècle av. J.-C., un conte égyptien raconte comment son général y fit entrer des soldats cachés dans des sacs, et les fouilleurs ont trouvé la porte de la forteresse égyptienne."
    - "Dans les Actes, « il y avait à Joppé, parmi les disciples, une femme nommée Tabitha, ce qui signifie Dorcas : elle faisait beaucoup de bonnes œuvres et d’aumônes ». Quand elle mourut, les disciples firent venir Pierre de Lydde, à environ 18 km dans l’intérieur des terres, et il la ressuscita ; « Cela fut connu de tout Joppé, et beaucoup crurent au Seigneur. » Pierre resta ensuite chez Simon, un corroyeur, « dont la maison est près de la mer », et vit sur son toit la vision de la nappe descendue du ciel ; puis arrivèrent les envoyés du centenier Corneille, venus de Césarée, à 51 km plus haut sur la côte, et Pierre partit avec eux vers la première maison de non-Juifs à recevoir l’Esprit. Dans le vieux Jaffa, on montre encore une maison au bord de la mer comme étant celle de Simon."
