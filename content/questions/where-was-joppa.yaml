id: where-was-joppa
question:
  en: "Where was Joppa, where Peter raised Tabitha?"
  ru: "Где находилась Иоппия, где Пётр воскресил Тавифу?"
  uk: "Де була Яффа, де Петро воскресив Тавіту?"
  es: "¿Dónde estaba Jope, donde Pedro resucitó a Tabita?"
  pt: "Onde ficava Jope, onde Pedro ressuscitou Tabita?"
  de: "Wo lag Joppe, wo Petrus Tabita auferweckte?"
  fr: "Où se trouvait Joppé, où Pierre ressuscita Tabitha ?"
  pl: "Gdzie leżała Jafa, gdzie Piotr wskrzesił Tabitę?"
  it: "Dov’era Giaffa, dove Pietro risuscitò Tabita?"
  cs: "Kde ležela Joppe, kde Petr vzkřísil Tabitu?"
  nl: "Waar lag Joppe, waar Petrus Tabita opwekte?"
  sv: "Var låg Joppe, där Petrus uppväckte Tabita?"
  nb: "Hvor lå Jaffa, der Peter vakte Tabita til live?"
  tl: "Nasaan ang Joppa, kung saan binuhay ni Pedro si Tabita?"
  da: "Hvor lå Joppe, hvor Peter oprejste Tabita?"
  sr: "Где је била Јопа, где је Петар подигао Тавиту?"
  hu: "Hol volt Joppé, ahol Péter feltámasztotta Tabitát?"
  fi: "Missä oli Joppe, jossa Pietari herätti Tabitan kuolleista?"
  vi: "Giốp-bê, nơi Phi-e-rơ làm Ta-bi-tha sống lại, ở đâu?"
  ro: "Unde se afla Iafo, unde Petru a înviat-o pe Tabita?"
  bg: "Къде се е намирала Яфа, където Петър възкреси Тавита?"
answer:
  en:
    - "Joppa is Jaffa, the old port on a rocky headland at the southern end of Tel Aviv-Yafo in Israel, about 55 km north-west of Jerusalem in a straight line; the map point stands on the ancient mound above the harbour. Its small natural harbour, sheltered by a line of rocks, was the only real port on that stretch of coast, and for the hill country it served as the port of Jerusalem. Jonah's flight from Joppa is told in a separate question."
    - "Timber for the Temple came this way. Hiram of Tyre promised Solomon: “we will bring it to thee in floats by sea to Joppa; and thou shalt carry it up to Jerusalem”, and the exiles who returned from Babylon brought cedar from Lebanon to Joppa again for the second Temple. The town is far older than Israel: Thutmose III took it in the fifteenth century BC, an Egyptian tale tells how his general smuggled soldiers into it hidden in sacks, and excavators have found the gate of the Egyptian fortress."
    - "In Acts “there was at Joppa a certain disciple named Tabitha, which by interpretation is called Dorcas: this woman was full of good works and almsdeeds”. When she died, the disciples sent for Peter from Lydda, about 18 km inland, and he raised her; “it was known throughout all Joppa; and many believed in the Lord.” Peter stayed on with Simon a tanner, “whose house is by the sea side”, and on its roof saw the vision of the sheet let down from heaven; then the messengers of the centurion Cornelius arrived from Caesarea, 51 km up the coast, and Peter went with them to the first gentile household to receive the Spirit. In old Jaffa a house by the sea is still shown as Simon's."
  ru:
    - "Иоппия — это Яффа, старая гавань на скалистом мысу у южного края Тель-Авива-Яффо в Израиле, примерно в 55 км к северо-западу от Иерусалима по прямой; точка карты стоит на древнем холме над гаванью. Её небольшая естественная гавань, прикрытая грядой скал, была единственным настоящим портом на этом отрезке побережья и служила горной стране гаванью Иерусалима. О бегстве Ионы из Иоппии рассказано в отдельном вопросе."
    - "Этим путём шёл лес для Храма. Хирам Тирский обещал Соломону: «пригоним их в плотах по морю в Яфу, а ты отвезешь их в Иерусалим», а вернувшиеся из Вавилона снова доставляли ливанский кедр в Иоппию для второго Храма. Город гораздо старше Израиля: Тутмос III взял его в XV веке до н. э., египетская повесть рассказывает, как его военачальник ввёл в город воинов, спрятанных в мешках, а раскопки открыли ворота египетской крепости."
    - "В Деяниях: «В Иоппии находилась одна ученица, именем Тавифа, что значит „серна“; она была исполнена добрых дел и творила много милостынь». Когда она умерла, ученики послали за Петром в Лидду, примерно в 18 км вглубь страны, и он воскресил её; «это сделалось известным по всей Иоппии, и многие уверовали в Господа». Пётр остался у Симона кожевника, «которого дом находится при море», и на его кровле увидел видение полотна, спущенного с неба; потом из Кесарии, в 51 км вверх по побережью, пришли посланные сотника Корнилия, и Пётр пошёл с ними в первый языческий дом, принявший Духа. В старой Яффе и сейчас показывают дом у моря как дом Симона."
  uk:
    - "Яффа — це Яффо, старий порт на скелястому мисі на південному краю Тель-Авів-Яффо в Ізраїлі, приблизно за 55 км на північний захід від Єрусалима по прямій; точка на мапі стоїть на давньому пагорбі над гаванню. Її мала природна гавань, захищена рядом скель, була єдиним справжнім портом на цій ділянці узбережжя, а для гірського краю слугувала портом Єрусалима. Втеча Йони з Яффи розказана в окремому питанні."
    - "Деревина для Храму йшла цим шляхом. Хірам Тірський обіцяв Соломонові: «приставимо їх в плотях морем до Яфи, а ти перевезеш їх у Ерусалим», а вигнанці, які повернулися з Вавилона, знову привезли кедр із Лівану до Яффи для другого Храму. Місто набагато давніше за Ізраїль: Тутмос III узяв його в XV ст. до н. е., єгипетська оповідь розповідає, як його полководець таємно провів у нього воїнів, захованих у мішках, а розкопники знайшли браму єгипетської фортеці."
    - "У Діях: «Була ж в Йоппиї одна учениця, на ймя Тавита, що перекладом зветь ся: Сарна. Ся була повна добрих учинків і милостинї, що робила.» Коли вона померла, учні послали по Петра до Лідди, приблизно за 18 км углиб країни, і він воскресив її; «І знане се стало по всїй Йоппиї, і многі увірували в Господа.» Петро залишився в Симона гарбаря, «що хата його над морем», і на його даху побачив видіння полотнища, спущеного з неба; потім з Кесарії, за 51 км вгору узбережжям, прибули посланці сотника Корнилія, і Петро пішов із ними до першої язичницької родини, що прийняла Духа. У старій Яффі досі показують будинок біля моря як Симонів."
  es:
    - "Jope es Jaffa, el viejo puerto sobre un promontorio rocoso en el extremo sur de Tel Aviv-Yafo, en Israel, a unos 55 km al noroeste de Jerusalén en línea recta; el punto del mapa está sobre el montículo antiguo que domina el puerto. Su pequeño puerto natural, resguardado por una hilera de rocas, era el único puerto de verdad en aquel tramo de costa, y para la región montañosa hacía de puerto de Jerusalén. La huida de Jonás desde Jope se cuenta en otra pregunta."
    - "Por aquí llegó la madera para el Templo. Hiram de Tiro prometió a Salomón: «te la traeremos en balsas por la mar hasta Joppe, y tú la harás llevar hasta Jerusalem», y los desterrados que volvieron de Babilonia llevaron de nuevo a Jope cedro del Líbano para el segundo Templo. La ciudad es mucho más antigua que Israel: Tutmosis III la tomó en el siglo XV a. C., un relato egipcio cuenta cómo su general introdujo en ella soldados ocultos en sacos, y los excavadores han hallado la puerta de la fortaleza egipcia."
    - "En los Hechos, «en Joppe había una discípula llamada Tabita, que si lo declaras, quiere decir Dorcas. Esta era llena de buenas obras y de limosnas que hacía». Cuando murió, los discípulos mandaron llamar a Pedro desde Lida, a unos 18 km tierra adentro, y él la resucitó; «Esto fué notorio por toda Joppe; y creyeron muchos en el Señor». Pedro se quedó con Simón, curtidor, «que tiene su casa junto á la mar», y en su azotea vio la visión del lienzo bajado del cielo; luego llegaron los mensajeros del centurión Cornelio desde Cesarea, a 51 km costa arriba, y Pedro fue con ellos a la primera casa gentil que recibió el Espíritu. En la vieja Jaffa aún se muestra como la de Simón una casa junto al mar."
  pt:
    - "Jope é Jafa, o antigo porto num promontório rochoso no extremo sul de Tel Aviv-Yafo, em Israel, a cerca de 55 km a noroeste de Jerusalém em linha reta; o ponto do mapa fica no antigo monte acima do porto. Seu pequeno porto natural, abrigado por uma linha de rochas, era o único porto de verdade naquele trecho da costa, e para a região montanhosa servia de porto de Jerusalém. A fuga de Jonas a partir de Jope é contada em uma pergunta à parte."
    - "A madeira para o Templo passava por aqui. Hirão de Tiro prometeu a Salomão: “Nós a traremos a você em jangadas pelo mar até Jope; então você a transportará para Jerusalém”, e os exilados que voltaram da Babilônia trouxeram novamente cedro do Líbano até Jope para o segundo Templo. A cidade é muito mais antiga do que Israel: Tutmés III a tomou no século XV a.C., um conto egípcio narra como o seu general nela introduziu soldados escondidos em sacos, e os escavadores encontraram a porta da fortaleza egípcia."
    - "Em Atos, “Havia em Jope uma certa discípula chamada Tabita, nome que, traduzido, significa Dorcas. Esta mulher era cheia de boas obras e atos de misericórdia que ela fazia”. Quando ela morreu, os discípulos mandaram chamar Pedro em Lida, a cerca de 18 km para o interior, e ele a ressuscitou; “Isso se tornou conhecido em toda a Jope, e muitos creram no Senhor.” Pedro ficou na casa de Simão, um curtidor, “cuja casa fica à beira-mar”, e em seu terraço teve a visão do lençol que descia do céu; então chegaram de Cesareia, 51 km costa acima, os mensageiros do centurião Cornélio, e Pedro foi com eles à primeira casa gentia a receber o Espírito. Na velha Jafa ainda se mostra uma casa à beira-mar como sendo a de Simão."
  de:
    - "Joppe ist Jaffa, der alte Hafen auf einer felsigen Landzunge am Südende von Tel Aviv-Jaffa in Israel, in der Luftlinie etwa 55 km nordwestlich von Jerusalem; der Kartenpunkt steht auf dem antiken Hügel über dem Hafen. Sein kleiner natürlicher Hafen, durch eine Felsenreihe geschützt, war der einzige wirkliche Hafen an diesem Küstenabschnitt und diente dem Bergland als Hafen Jerusalems. Jonas Flucht von Joppe wird in einer eigenen Frage erzählt."
    - "Das Bauholz für den Tempel kam auf diesem Weg. Hiram von Tyrus versprach Salomo: „wollen's auf Flößen bringen im Meer gen Japho; von da magst du es hinauf gen Jerusalem bringen“, und die aus Babylon Heimgekehrten brachten für den zweiten Tempel erneut Zedernholz vom Libanon nach Joppe. Die Stadt ist viel älter als Israel: Thutmosis III. nahm sie im 15. Jahrhundert v. Chr. ein, eine ägyptische Erzählung berichtet, wie sein General Soldaten in Säcken versteckt in sie einschmuggelte, und Ausgräber haben das Tor der ägyptischen Festung gefunden."
    - "In der Apostelgeschichte heißt es: „Zu Joppe aber war eine Jüngerin mit Namen Tabea (welches verdolmetscht heißt: Rehe), die war voll guter Werke und Almosen“. Als sie starb, ließen die Jünger Petrus aus Lydda holen, etwa 18 km landeinwärts, und er erweckte sie; „es ward kund durch ganz Joppe, und viele wurden gläubig an den HERRN.“ Petrus blieb bei Simon, einem Gerber, „des Haus am Meer liegt“, und sah auf dessen Dach die Vision vom Tuch, das vom Himmel herabgelassen wurde; dann trafen die Boten des Hauptmanns Kornelius aus Caesarea ein, 51 km die Küste hinauf, und Petrus ging mit ihnen zum ersten heidnischen Haus, das den Geist empfing. In Alt-Jaffa wird noch heute ein Haus am Meer als das Simons gezeigt."
  fr:
    - "Joppé est Jaffa, l’ancien port sur un promontoire rocheux à l’extrémité sud de Tel Aviv-Jaffa, en Israël, à environ 55 km au nord-ouest de Jérusalem à vol d’oiseau ; le point de la carte se trouve sur l’antique tertre qui domine le port. Son petit port naturel, abrité par une ligne de rochers, était le seul vrai port de cette portion de côte, et pour la région montagneuse il servait de port à Jérusalem. La fuite de Jonas depuis Joppé est racontée dans une question distincte."
    - "Le bois du Temple passait par là. Hiram de Tyr promit à Salomon : « nous te les expédierons par mer en radeaux jusqu’à Japho, et tu les feras monter à Jérusalem », et les exilés revenus de Babylone firent de nouveau venir du cèdre du Liban à Joppé pour le second Temple. La ville est bien plus ancienne qu’Israël : Thoutmosis III la prit au XVe siècle av. J.-C., un conte égyptien raconte comment son général y fit entrer des soldats cachés dans des sacs, et les fouilleurs ont trouvé la porte de la forteresse égyptienne."
    - "Dans les Actes, « il y avait à Joppé, parmi les disciples, une femme nommée Tabitha, ce qui signifie Dorcas : elle faisait beaucoup de bonnes œuvres et d’aumônes ». Quand elle mourut, les disciples firent venir Pierre de Lydde, à environ 18 km dans l’intérieur des terres, et il la ressuscita ; « Cela fut connu de tout Joppé, et beaucoup crurent au Seigneur. » Pierre resta ensuite chez Simon, un corroyeur, « dont la maison est près de la mer », et vit sur son toit la vision de la nappe descendue du ciel ; puis arrivèrent les envoyés du centenier Corneille, venus de Césarée, à 51 km plus haut sur la côte, et Pierre partit avec eux vers la première maison de non-Juifs à recevoir l’Esprit. Dans le vieux Jaffa, on montre encore une maison au bord de la mer comme étant celle de Simon."
  pl:
    - "Jafa to Jaffa, stary port na skalistym cyplu na południowym krańcu Tel Awiwu-Jafy w Izraelu, około 55 km na północny zachód od Jerozolimy w linii prostej; punkt na mapie stoi na starożytnym wzgórzu nad portem. Jej mały naturalny port, osłonięty rzędem skał, był jedynym prawdziwym portem na tym odcinku wybrzeża, a dla krainy górskiej służył jako port Jerozolimy. Ucieczka Jonasza z Jafy opowiedziana jest w osobnym pytaniu."
    - "Tędy szło drewno dla Świątyni. Hiram z Tyru obiecał Salomonowi: „spuścimyć na tratwach po morzu do Joppy, a ty je każesz zwieść do Jeruzalemu”, a wygnańcy, którzy wrócili z Babilonu, znów sprowadzili cedr z Libanu do Jafy dla drugiej Świątyni. Miasto jest dużo starsze niż Izrael: Totmes III zdobył je w XV wieku p.n.e., egipska opowieść mówi, jak jego dowódca przemycił do niego żołnierzy ukrytych w workach, a archeolodzy znaleźli bramę egipskiej twierdzy."
    - "W Dziejach: „A była w Joppie niektóra uczennica, imieniem Tabita, która wyłożywszy, zowie się Dorka; ta była pełna dobrych uczynków i jałmużny, które czyniła”. Gdy umarła, uczniowie posłali po Piotra do Liddy, około 18 km w głąb lądu, a on ją wskrzesił; „I rozsławiło się to po wszystkiej Joppie, i wiele ich uwierzyło w Pana”. Piotr został u Szymona garbarza, „który ma dom nad morzem”, i na jego dachu ujrzał wizję płótna spuszczanego z nieba; potem przybyli posłańcy setnika Korneliusza z Cezarei, odległej o 51 km w górę wybrzeża, a Piotr poszedł z nimi do pierwszego domu pogan, który otrzymał Ducha. W starej Jafie wciąż pokazuje się dom nad morzem jako dom Szymona."
  it:
    - "Giaffa è Jaffa, l’antico porto su un promontorio roccioso all’estremità meridionale di Tel Aviv-Yafo in Israele, a circa 55 km a nord-ovest di Gerusalemme in linea d’aria; il punto della mappa si trova sull’antico tell sopra il porto. Il suo piccolo porto naturale, riparato da una fila di scogli, era l’unico vero porto su quel tratto di costa, e per la regione collinare fungeva da porto di Gerusalemme. La fuga di Giona da Giaffa è narrata in una domanda a parte."
    - "Il legname per il Tempio passava di qui. Chiram di Tiro promise a Salomone: «te lo spediremo per mare su zattere fino a Jafo, e tu lo farai trasportare a Gerusalemme», e gli esuli tornati da Babilonia portarono di nuovo cedro del Libano a Giaffa per il secondo Tempio. La città è ben più antica di Israele: Tutmosi III la prese nel XV secolo a.C., un racconto egiziano narra come il suo generale vi introdusse soldati occultati in sacchi, e gli archeologi hanno trovato la porta della fortezza egiziana."
    - "Negli Atti «in Ioppe v’era una certa discepola, chiamata Tabita, il che, interpretato, vuol dire Gazzella. Costei abbondava in buone opere e faceva molte elemosine». Quando morì, i discepoli mandarono a chiamare Pietro da Lidda, a circa 18 km nell’entroterra, ed egli la risuscitò; «ciò fu saputo per tutta Ioppe, e molti credettero nel Signore». Pietro rimase poi presso Simone, un conciatore, «che ha la casa presso al mare», e sul suo terrazzo ebbe la visione del lenzuolo calato dal cielo; poi arrivarono da Cesarea, a 51 km lungo la costa, i messaggeri del centurione Cornelio, e Pietro andò con loro alla prima casa di gentili che ricevette lo Spirito. Nella vecchia Jaffa una casa sul mare viene ancora mostrata come quella di Simone."
  cs:
    - "Joppe je Jaffa, starý přístav na skalnatém ostrohu na jižním konci Tel Avivu-Jaffy v Izraeli, vzdušnou čarou asi 55 km severozápadně od Jeruzaléma; bod na mapě stojí na starověkém pahorku nad přístavem. Její malý přirozený přístav, chráněný řadou skal, byl jediným skutečným přístavem na tomto úseku pobřeží a pro horskou zemi sloužil jako přístav Jeruzaléma. O Jonášově útěku z Joppe se vypráví v samostatné otázce."
    - "Dříví pro chrám šlo touto cestou. Chíram z Týru slíbil Šalomounovi: „připlavíme je tobě v vořích po moři k Joppe, a ty dáš je voziti do Jeruzaléma“, a vyhnanci, kteří se vrátili z Babylóna, přivezli cedrové dříví z Libanonu do Joppe znovu pro druhý chrám. Město je mnohem starší než Izrael: dobyl je Thutmose III. v 15. století př. n. l., egyptský příběh vypráví, jak jeho velitel propašoval do něj vojáky ukryté ve vacích, a archeologové nalezli bránu egyptské pevnosti."
    - "Ve Skutcích „byla pak jedna učedlnice v Joppen, jménem Tabita, což se vykládá Dorkas. Ta byla plná skutků dobrých a almužen“. Když zemřela, učedníci poslali pro Petra do Lyddy, asi 18 km ve vnitrozemí, a on ji vzkřísil; „rozhlášeno jest to po všem městě Joppen, a uvěřili mnozí v Pána.“ Petr zůstal u Šimona koželuha, „kterýž má dům u moře“, a na jeho střeše spatřil vidění plátna spouštěného z nebe; pak dorazili poslové setníka Kornelia z Cesareje, 51 km po pobřeží, a Petr s nimi šel do prvního pohanského domu, který přijal Ducha. Ve staré Jaffě se dům u moře dosud ukazuje jako Šimonův."
  nl:
    - "Joppe is Jaffa, de oude haven op een rotsachtige landtong aan de zuidkant van Tel Aviv-Jaffa in Israël, hemelsbreed ongeveer 55 km ten noordwesten van Jeruzalem; het punt op de kaart staat op de oude heuvel boven de haven. De kleine natuurlijke haven, beschut door een rij rotsen, was de enige echte haven aan dat deel van de kust, en voor het bergland diende zij als haven van Jeruzalem. De vlucht van Jona uit Joppe wordt in een aparte vraag verteld."
    - "Hout voor de tempel kwam hier langs. Hiram van Tyrus beloofde Salomo: “… en zullen het tot u met vlotten, over de zee, naar Jafo brengen; en gij zult het laten ophalen naar Jeruzalem”, en de ballingen die uit Babylon terugkeerden lieten opnieuw ceder uit de Libanon naar Joppe brengen voor de tweede tempel. De stad is veel ouder dan Israël: Thoetmosis III nam haar in de vijftiende eeuw v.Chr. in, een Egyptisch verhaal vertelt hoe zijn generaal er soldaten in zakken verstopt naar binnen smokkelde, en archeologen hebben de poort van de Egyptische vesting gevonden."
    - "Handelingen vertelt: “te Joppe was een zekere discipelin, met name Tabitha, hetwelk overgezet zijnde, is gezegd Dorkas. Deze was vol van goede werken en aalmoezen, die zij deed”. Toen zij stierf, lieten de discipelen Petrus halen uit Lydda, ongeveer 18 km landinwaarts, en hij wekte haar op; “dit werd bekend door geheel Joppe, en velen geloofden in den Heere.” Petrus bleef bij Simon, een lederbereider, “die zijn huis heeft bij de zee”, en zag op het dak het visioen van het laken dat uit de hemel werd neergelaten; toen kwamen de boden van de hoofdman Cornelius uit Caesarea, 51 km verder langs de kust, en Petrus ging met hen mee naar het eerste heidense huis dat de Geest ontving. In het oude Jaffa wordt nog steeds een huis aan zee als dat van Simon aangewezen."
  sv:
    - "Joppe är Jaffa, den gamla hamnen på en klippig udde i södra delen av Tel Aviv-Yafo i Israel, omkring 55 km nordväst om Jerusalem i fågelvägen; kartpunkten står på den antika kullen ovanför hamnen. Dess lilla naturliga hamn, skyddad av en rad klippor, var den enda egentliga hamnen längs denna kuststräcka, och för bergslandet fungerade den som Jerusalems hamn. Jonas flykt från Joppe berättas i en separat fråga."
    - "Virket till templet kom denna väg. Hiram av Tyros lovade Salomo att ”flotta det till dig på havet till Jafo; men därifrån må du själv låta föra det upp till Jerusalem”, och de landsflyktiga som återvände från Babylon förde på nytt cederträ från Libanon till Jafo för det andra templet. Staden är långt äldre än Israel: Thutmosis III intog den på 1400-talet f.Kr., en egyptisk berättelse berättar hur hans general smugglade in soldater i den, dolda i säckar, och arkeologerna har funnit porten till den egyptiska fästningen."
    - "I Apostlagärningarna bodde i Joppe ”en lärjunginna vid namn Tabita (det betyder detsamma som Dorkas). Hon överflödade i goda gärningar och gav allmosor rikligen”. När hon dog, sände lärjungarna efter Petrus i Lydda, omkring 18 km inåt landet, och han uppväckte henne; ”detta blev bekant i hela Joppe, och många kommo till tro på Herren.” Petrus stannade hos garvaren Simon, ”som har ett hus vid havet”, och såg på dess tak synen av duken som sänktes ned från himlen; sedan anlände hövitsmannen Cornelius’ sändebud från Caesarea, 51 km längre norrut längs kusten, och Petrus följde med dem till det första hushållet av hedningar som tog emot Anden. I gamla Jaffa visas ännu ett hus vid havet som Simons."
  nb:
    - "Jaffa er den gamle havnebyen på en klippeodde i den sørlige enden av Tel Aviv-Yafo i Israel, omtrent 55 km nordvest for Jerusalem i luftlinje; kartpunktet står på den antikke haugen over havnen. Den lille naturlige havnen, skjermet av en rekke skjær, var den eneste egentlige havnen på denne kyststrekningen, og for høylandet tjente den som Jerusalems havn. Jonas’ flukt fra Jaffa fortelles i et eget spørsmål."
    - "Tømmeret til templet kom denne veien. Hiram av Tyros lovte Salomo: «Så skal vi hugge så mange trær på Libanon som du har bruk for, og sende dem i flåter på havet til Joppe; så kan du selv hente dem op til Jerusalem», og de landflyktige som vendte tilbake fra Babylon, brakte igjen sedertre fra Libanon til Jaffa for det andre tempelet. Byen er langt eldre enn Israel: Tutmosis III inntok den på 1400-tallet f.Kr., en egyptisk fortelling beretter hvordan hans general smuglet soldater inn i den skjult i sekker, og utgravere har funnet porten til den egyptiske festningen."
    - "I Apostlenes gjerninger heter det: «I Joppe var det en disippelinne ved navn Tabita, det er utlagt: Dorkas; hun var rik på gode gjerninger og gav mange almisser». Da hun døde, sendte disiplene bud etter Peter fra Lydda, omtrent 18 km inne i landet, og han vakte henne opp; «Dette blev vitterlig over hele Joppe, og mange kom til troen på Herren.» Peter ble boende hos Simon, en garver, «som har et hus ved havet», og på taket så han synet av duken som ble senket ned fra himmelen; så kom sendebudene fra høvedsmannen Kornelius fra Cæsarea, 51 km lenger oppe langs kysten, og Peter gikk med dem til det første hedningehuset som mottok Ånden. I gamle Jaffa vises fortsatt et hus ved havet som Simons."
  tl:
    - "Ang Joppa ay ang Jaffa, ang lumang daungan sa isang mabatong tangway sa katimugang dulo ng Tel Aviv-Yafo sa Israel, mga 55 km sa hilagang-kanluran ng Jerusalem sa tuwid na guhit; nakatayo ang punto sa mapa sa sinaunang burol sa ibabaw ng daungan. Ang maliit nitong likas na daungan, na kinukublihan ng isang hanay ng mga bato, ang tanging tunay na daungan sa bahaging iyon ng baybayin, at para sa maburol na lupain ay nagsilbi itong daungan ng Jerusalem. Isinasalaysay sa hiwalay na tanong ang pagtakas ni Jonas mula sa Joppa."
    - "Dito dumaan ang kahoy para sa Templo. Nangako si Hiram ng Tiro kay Salomon: “aming dadalhin sa iyo sa mga balsa na idadaan sa dagat hanggang sa Joppe; at iyong iaahon sa Jerusalem”, at ang mga destiyerong bumalik mula sa Babilonia ay muling nagdala ng sedro mula sa Libano sa Joppa para sa ikalawang Templo. Mas matanda pa ang bayan kaysa sa Israel: sinakop ito ni Thutmose III noong ika-15 siglo BK, isinasalaysay ng isang kuwentong Egipcio kung paano ipinuslit ng kaniyang heneral ang mga kawal dito na nakatago sa mga sako, at natagpuan ng mga naghukay ang pintuang-lungsod ng kutang Egipcio."
    - "Sa Mga Gawa, “Ngayon ay may isang alagad sa Joppe na nagngangalang Tabita, na ang kahuluga'y Dorcas: ang babaing ito'y puspos ng mabubuting gawa at ng pagkaawang gawa na kaniyang ginagawa”. Nang mamatay siya, ipinatawag ng mga alagad si Pedro mula sa Lidda, mga 18 km sa loob ng lupain, at binuhay niya siya; “ito'y nabansag sa buong Joppe: at marami ang mga nagsisampalataya sa Panginoon.” Nanatili si Pedro kay Simon na mangluluto ng balat, “na ang kaniyang bahay ay nasa tabi ng dagat”, at sa bubong nito ay nakita ang pangitain ng kumot na ibinaba mula sa langit; pagkatapos ay dumating ang mga sugo ng senturyon na si Cornelio mula sa Cesarea, 51 km pataas sa baybayin, at sumama si Pedro sa kanila sa unang sambahayang Gentil na tumanggap ng Espiritu. Sa lumang Jaffa, may bahay sa tabi ng dagat na ipinakikita pa rin bilang kay Simon."
  da:
    - "Joppe er Jaffa, den gamle havn på en klippehalvø i den sydlige ende af Tel Aviv-Yafo i Israel, ca. 55 km nordvest for Jerusalem i fugleflugt; kortets punkt står på den antikke tell over havnen. Dens lille naturlige havn, beskyttet af en række klipper, var den eneste egentlige havn på den kyststrækning, og for højlandet tjente den som Jerusalems havn. Jonas’ flugt fra Joppe er behandlet i et selvstændigt spørgsmål."
    - "Tømmer til templet kom denne vej. Hiram af Tyrus lovede Salomo: »vi ville føre dem til dig i Flaader paa Havet ned til Jafo, og du skal føre dem op til Jerusalem«, og de landflygtige, der vendte hjem fra Babylon, bragte atter cedertræ fra Libanon til Joppe til det andet tempel. Byen er langt ældre end Israel: Thutmosis 3. indtog den i 1400-tallet f.Kr., en egyptisk fortælling beretter, hvordan hans general smuglede soldater ind i den skjult i sække, og udgravere har fundet porten til den egyptiske fæstning."
    - "I Apostlenes Gerninger hedder det: »Men i Joppe var der en Discipelinde ved Navn Tabitha, hvilket udlagt betyder Hind; hun var rig paa gode Gerninger og gav mange Almisser«. Da hun døde, sendte disciplene bud efter Peter fra Lydda, ca. 18 km inde i landet, og han oprejste hende; »det blev vitterligt over hele Joppe, og mange troede paa Herren.« Peter blev boende hos Simon, en garver, »hvis Hus er ved Havet«, og på dets tag så han synet af dugen, der blev sænket ned fra himlen; så ankom høvedsmanden Kornelius’ sendebud fra Cæsarea, 51 km oppe ad kysten, og Peter fulgte med dem til det første hedningehus, der modtog Ånden. I gamle Jaffa vises stadig et hus ved havet som Simons."
  sr:
    - "Јопа је Јафа, стара лука на стеновитом рту на јужном крају Тел Авив-Јафе у Израелу, око 55 км северозападно од Јерусалима ваздушном линијом; тачка на карти стоји на древној хумци изнад пристаништа. Њено мало природно пристаниште, заклоњено низом стена, било је једина права лука на том делу обале, а за брдски крај служило је као лука Јерусалима. Јонино бекство из Јопе описано је у посебном питању."
    - "Грађа за Храм стизала је овим путем. Хирам из Тира обећао је Соломуну: „спустићемо их у слаповима морем у Јопу, а ти их оданде вози у Јерусалим“, а прогнаници који су се вратили из Вавилона поново су довукли кедар из Ливана у Јопу за други Храм. Град је далеко старији од Израела: Тутмес III заузео га је у петнаестом веку п. н. е., један египатски спис прича како је његов војсковођа у њега унео војнике скривене у врећама, а ископавачи су пронашли капију египатске тврђаве."
    - "У Делима „у Јопи беше једна ученица по имену Тавита, које значи срна, и она беше пуна добрих дела и милостиње што чињаше“. Кад је умрла, ученици су по Петра послали у Лиду, око 18 км у унутрашњости, и он ју је подигао; „ово се разгласи по свој Јопи, и многи вероваше Господа.“ Петар је остао још код Симона кожара, „ког је кућа код мора“, а на њеном крову видео је визију платна спуштеног с неба; затим су из Цезареје, 51 км уз обалу, стигли гласници капетана Корнилија, и Петар је с њима отишао у први незнабожачки дом који је примио Духа. У старој Јафи и данас се једна кућа поред мора показује као Симонова."
  hu:
    - "Joppé Jaffa, a régi kikötő egy sziklás földnyelven Tel Aviv-Yafo déli végén, Izraelben, Jeruzsálemtől légvonalban mintegy 55 km-re északnyugatra; a térkép pontja a kikötő fölötti ókori halmon áll. Kicsiny természetes kikötője, melyet sziklasor védett, az egyetlen igazi kikötő volt a part e szakaszán, a hegyvidék számára pedig Jeruzsálem kikötőjeként szolgált. Jónás menekülését Joppéból külön kérdés meséli el."
    - "A templom faanyaga erre jött. Hírám, Tírusz királya ezt ígérte Salamonnak: „elviszszük azokat szálakon a tengeren Joppéhoz, és te onnét vitessed Jeruzsálembe”, és a babiloni számkivetésből hazatért foglyok a második templomhoz is Joppéba hozták a libanoni cédrust. A város jóval Izráelnél régebbi: III. Thotmesz a Kr. e. 15. században elfoglalta, egy egyiptomi mese szerint tábornoka zsákokba rejtett katonákat csempészett be, és az ásatók megtalálták az egyiptomi erőd kapuját."
    - "Az Apostolok cselekedeteiben „Joppéban pedig vala egy nőtanítvány, névszerint Tábitha, mely megmagyarázva Dorkásnak, azaz zergének mondatik: ez gazdag vala jó cselekedetekben és alamizsnákban”. Mikor meghalt, a tanítványok elküldtek Péterért Liddából, mely mintegy 18 km-re van a szárazföld belsejében, és ő feltámasztotta; „tudtára lőn az egész Joppénak; és sokan hivének az Úrban.” Péter ezután Simon tímárnál maradt, „kinek háza a tenger mellett van”, és annak tetején látta a mennyből leeresztett lepedő látomását; azután megérkeztek Kornélius századosnak a parton 51 km-re északra fekvő Cézáreából küldött követei, és Péter velük ment az első pogány házhoz, amely megkapta a Lelket. A régi Jaffában ma is mutatnak egy tenger melletti házat Simon házaként."
  fi:
    - "Joppe on Jaffa, vanha satama kallioisella niemellä Tel Aviv-Yafon eteläpäässä Israelissa, linnuntietä noin 55 km Jerusalemista luoteeseen; kartan piste on sataman yläpuolisella muinaisella kumpareella. Sen pieni luonnonsatama, jota kallioiden rivi suojasi, oli rannikon tuolla osalla ainoa todellinen satama, ja vuoristoseudulle se oli Jerusalemin satama. Joonan pako Joppesta kerrotaan erillisessä kysymyksessä."
    - "Temppelin puutavara kulki tätä kautta. Tyroksen Hiram lupasi Salomolle: ”me kuljetamme ne lautoissa meritse sinulle Jaafoon. Toimita sinä ne sitten ylös Jerusalemiin”, ja Babylonista palanneet pakkosiirtolaiset toivat Libanonin setripuuta jälleen Joppeen toista temppeliä varten. Kaupunki on paljon Israelia vanhempi: Thutmosis III valloitti sen 1400-luvulla eaa., egyptiläinen tarina kertoo, kuinka hänen kenraalinsa salakuljetti sinne sotilaita säkkeihin piilotettuina, ja kaivaukset ovat paljastaneet egyptiläisen linnoituksen portin."
    - "Apostolien teoissa ”Joppessa oli naisopetuslapsi, nimeltä Tabita, mikä kreikaksi käännettynä on: Dorkas; hän teki paljon hyviä töitä ja antoi runsaasti almuja”. Kun hän kuoli, opetuslapset kutsuivat Pietarin Lyddasta, noin 18 km sisämaasta, ja hän herätti hänet; ”se tuli tiedoksi koko Joppessa, ja monet uskoivat Herraan.” Pietari viipyi edelleen nahkuri Simonin luona, ”jonka talo on meren rannalla”, ja sen katolla hän näki näyn taivaasta laskettavasta liinavaatteesta; sitten sadanpäämies Korneliuksen sanansaattajat saapuivat Kesareasta, 51 km rannikkoa pohjoiseen, ja Pietari lähti heidän mukanaan ensimmäiseen pakanataloon, joka sai Hengen. Vanhassa Jaffassa näytetään yhä meren rannalla olevaa taloa Simonin talona."
  vi:
    - "Giốp-bê là Jaffa, hải cảng cổ trên một mũi đất đá ở đầu phía nam Tel Aviv-Yafo thuộc Israel, cách Giê-ru-sa-lem khoảng 55 km về phía tây bắc theo đường thẳng; điểm trên bản đồ nằm trên gò cổ phía trên bến cảng. Bến cảng tự nhiên nhỏ của nó, được che chắn bởi một dãy đá, là hải cảng thực sự duy nhất trên đoạn bờ biển ấy, và đối với vùng đồi núi, nó đóng vai trò hải cảng của Giê-ru-sa-lem. Cuộc trốn của Giô-na khỏi Giốp-bê được kể trong một câu hỏi riêng."
    - "Gỗ cho Đền thờ đến theo đường này. Hi-ram người Ty-rơ hứa với Sa-lô-môn: “kết thành bè đem ra biển đến Gia-phô; đoạn vua sẽ chở lên Giê-ru-sa-lem”, và những người lưu đày từ Ba-by-lôn trở về lại đưa gỗ bá hương từ Li-ban đến Giốp-bê cho Đền thờ thứ hai. Thị trấn này cổ hơn Y-sơ-ra-ên nhiều: Thutmose III chiếm nó vào thế kỷ 15 TCN, một truyện Ai Cập kể rằng viên tướng của ông đã lén đưa binh lính vào thành giấu trong các bao tải, và các nhà khai quật đã tìm thấy cổng của pháo đài Ai Cập."
    - "Trong sách Công vụ, “Tại thành Giốp-bê, trong đám môn đồ, có một người đàn bà tên là Ta-bi-tha, nghĩa là Đô-ca; người làm nhiều việc lành và hay bố thí”. Khi bà qua đời, các môn đồ cho mời Phi-e-rơ từ Lút-đa, cách khoảng 18 km trong đất liền, và ông làm bà sống lại; “Việc đó đồn ra khắp thành Giốp-bê; nên có nhiều người tin theo Chúa.” Phi-e-rơ ở lại với Si-môn, một thợ thuộc da, “nhà ở gần biển”, và trên mái nhà ấy thấy khải tượng về tấm khăn thả xuống từ trời; rồi các sứ giả của đội trưởng Cọt-nây từ Sê-sa-rê, cách 51 km dọc bờ biển lên phía bắc, đến nơi, và Phi-e-rơ đi với họ đến gia đình dân ngoại đầu tiên nhận Thánh Linh. Ở Jaffa cổ, một ngôi nhà bên biển vẫn được chỉ là nhà của Si-môn."
  ro:
    - "Iafo este Jaffa, vechiul port de pe un promontoriu stâncos de la capătul sudic al orașului Tel Aviv-Yafo din Israel, la circa 55 km nord-vest de Ierusalim în linie dreaptă; punctul de pe hartă se află pe movila antică de deasupra portului. Micul său port natural, adăpostit de un șir de stânci, era singurul port adevărat de pe acel tronson de coastă și, pentru ținutul de dealuri, servea drept port al Ierusalimului. Fuga lui Iona din Iafo este povestită într-o întrebare separată."
    - "Lemnul pentru Templu a venit pe aici. Hiram din Tir i-a promis lui Solomon: „le vom aduce pre ele plute pre marea Iopii, și tu le vei duce pre ele în Ierusalim”, iar exilații întorși din Babilon au adus din nou cedri din Liban la Iafo pentru Templul al Doilea. Orașul este mult mai vechi decât Israel: Tutmes al III-lea l-a cucerit în secolul al XV-lea î.Hr., o poveste egipteană spune cum generalul său a strecurat în el soldați ascunși în saci, iar arheologii au găsit poarta fortăreței egiptene."
    - "În Faptele Apostolilor, „în Iopi erà o uceniță anume Tavita, care tâlcuindu-se se zice Căprioară; aceasta erà plină de fapte bune și de milostenii ce făceà”. Când ea a murit, ucenicii l-au chemat pe Petru de la Lida, aflată la circa 18 km spre interior, iar el a înviat-o; „s’a auzit aceasta prin toată Iopi; și mulți au crezut în Domnul.” Petru a rămas la Simon un tăbăcar, „căruia este casa lângă mare”, și pe acoperișul ei a văzut vedenia pânzei coborâte din cer; apoi au sosit solii sutașului Corneliu din Cezareea, aflată la 51 km mai la nord pe coastă, și Petru a mers cu ei la prima casă de neamuri care a primit Duhul. În vechiul Jaffa se mai arată și azi o casă de lângă mare drept a lui Simon."
  bg:
    - "Яфа е старото пристанище на скалист нос в южния край на Тел Авив-Яфо в Израел, на около 55 км северозападно от Йерусалим по права линия; точката на картата стои на древния хълм над пристанището. Малкото ѝ естествено пристанище, защитено от редица скали, беше единственото истинско пристанище на този участък от брега и за планинската страна служеше като пристанище на Йерусалим. Бягството на Йона от Яфа е разказано в отделен въпрос."
    - "Оттук минаваше дървеният материал за Храма. Хирам Тирски обеща на Соломон: „ще ти ги донесем с плотове през морето в Иопия; а ти ще ги възвозиш в Ерусалим“, а завърналите се от Вавилон изгнаници отново докараха кедър от Ливан до Яфа за втория Храм. Градът е много по-стар от Израил: Тутмос III го превзе през XV в. пр.н.е., египетска приказка разказва как неговият пълководец вкарал тайно в него войници, скрити в чували, а археолозите са открили портата на египетската крепост."
    - "В Деянията „в Иопия имаше некоя ученица на име Тавита, (което изтълкувано ще рече, Сърна:) тя бе изпълнена с добри дела и с милостини които правеше“. Когато тя умря, учениците повикаха Петър от Лида, на около 18 км навътре от брега, и той я възкреси; „това стана известно по всичка Иопия; и мнозина поверваха в Господ.“ Петър остана у Симон кожаря, „на когото къщата е край морето“, и на покрива ѝ видя видението с платното, спуснато от небето; тогава от Кесария, на 51 км нагоре по брега, пристигнаха пратениците на стотника Корнилий и Петър отиде с тях в първия езически дом, приел Духа. В стара Яфа и днес показват една къща край морето като дома на Симон."
