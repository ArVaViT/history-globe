id: how-big-was-the-temple-mount
question:
  en: "How big was the Temple Mount?"
  ru: "Насколько велика была Храмовая гора?"
  uk: "Якого розміру була Храмова гора?"
  es: "¿Qué tamaño tenía el monte del Templo?"
  pt: "Qual era o tamanho do monte do Templo?"
  de: "Wie groß war der Tempelberg?"
  fr: "Quelle était la taille du mont du Temple ?"
  pl: "Jak duże było Wzgórze Świątynne?"
  it: "Quanto era grande il Monte del Tempio?"
  nl: "Hoe groot was de Tempelberg?"
  cs: "Jak velká byla Chrámová hora?"
  sv: "Hur stort var Tempelberget?"
answer:
  en:
    - "Herod's Temple Mount, the platform that still stands in the Old City of Jerusalem as the Haram al-Sharif, covers about 14–15 ha, a slightly skewed four-sided enclosure whose retaining walls measure about 488 m on the west, 470 m on the east, 315 m on the north and 280 m on the south. That is about a sixth of the walled Old City. Before Herod the Temple court was much smaller: the Mishnah gives it as 500 by 500 cubits, a square of about 260 m a side, some 7 ha, and Herod roughly doubled it from about 20 BC. The map point stands on the summit of the hill, Mount Moriah."
    - "The size astonished visitors. As Jesus left the Temple “one of his disciples saith unto him, Master, see what manner of stones and what buildings are here!”; others spoke of the Temple, “how it was adorned with goodly stones and gifts”. Jesus “walked in the temple in Solomon's porch”, the colonnade along the eastern side, and after Pentecost the crowds “ran together unto them in the porch that is called Solomon's”. The tempter set him on “a pinnacle of the temple”, often placed at the south-eastern corner, where the platform stood high above the Kidron valley. Along the south side ran Herod's Royal Stoa, and the outer court open to gentiles took up most of the area; the sanctuary itself, rebuilt on the plan of Solomon's house of “threescore cubits” by twenty, stood near the middle."
    - "Josephus, who knew the Temple before AD 70, gives the hill four stadia round, a stadion to each side, which roughly matches the Mishnah's square. Leen Ritmeyer traced that square of 500 royal cubits, 861 ft, within the present platform, from a step of pre-Herodian masonry in the north-west and a bend in the eastern wall, while others place it differently. Ezekiel's vision gives the sanctuary a wall of “five hundred reeds long, and five hundred broad”, an ideal square many times greater. The platform was never excavated; its extent is known from the surviving walls, the Western Wall among them, and the tunnels and finds along them. Where on it the Temple stood is discussed in its own question."
  ru:
    - "Храмовая гора Ирода — платформа, которая и сегодня стоит в Старом городе Иерусалима как Харам аш-Шариф, — занимает около 14–15 га: это слегка перекошенный четырёхугольник, подпорные стены которого имеют около 488 м с запада, 470 м с востока, 315 м с севера и 280 м с юга. Это примерно шестая часть Старого города в его стенах. До Ирода храмовый двор был гораздо меньше: Мишна даёт ему 500 на 500 локтей — квадрат примерно в 260 м со стороной, около 7 га, — и Ирод примерно удвоил его, начиная около 20 г. до н. э. Точка карты стоит на вершине холма, горе Мориа."
    - "Размеры поражали приходивших. Когда Иисус выходил из храма, «говорит Ему один из учеников Его: Учитель! посмотри, какие камни и какие здания!»; другие говорили о храме, «что он украшен дорогими камнями и вкладами». Иисус «ходил... в храме, в притворе Соломоновом» — колоннаде вдоль восточной стороны, а после Пятидесятницы народ «сбежался к ним в притвор, называемый Соломонов». Искуситель поставил Его «на крыле храма», которое часто помещают на юго-восточном углу, где платформа высоко поднималась над долиной Кедрона. Вдоль южной стороны тянулась Царская стоя Ирода, большую часть площади занимал внешний двор, открытый для язычников, а само святилище, перестроенное по плану храма Соломона «длиною... в шестьдесят локтей, шириною в двадцать», стояло ближе к середине."
    - "Иосиф Флавий, знавший Храм до 70 г. н. э., даёт холму четыре стадии в окружности, по стадии на сторону, что примерно совпадает с квадратом Мишны. Лен Ритмейер проследил этот квадрат в 500 царских локтей, около 262 м, внутри нынешней платформы — по ступени из доиродовой кладки на северо-западе и излому восточной стены, хотя другие помещают его иначе. В видении Иезекииля у святилища стена «длиною в пятьсот тростей и в пятьсот тростей шириною» — идеальный квадрат во много раз больше. Платформу никогда не раскапывали; её пределы известны по сохранившимся стенам, среди них Западная, и по туннелям и находкам вдоль них. Где на ней стоял сам Храм, разобрано в отдельном вопросе."
  uk:
    - "Храмова гора Ірода, платформа, що досі стоїть у Старому місті Єрусалиму як Харам еш-Шаріф, займає близько 14–15 га — це дещо скошений чотирикутний двір, підпірні стіни якого мають близько 488 м із заходу, 470 м зі сходу, 315 м з півночі та 280 м з півдня. Це близько шостої частини обнесеного мурами Старого міста. До Ірода двір Храму був значно меншим: Мішна дає його як 500 на 500 ліктів, квадрат близько 260 м завдовжки кожного боку, приблизно 7 га, а Ірод приблизно подвоїв його, починаючи близько 20 р. до н. е. Точка мапи стоїть на вершині пагорба, гори Морія."
    - "Розмір вражав відвідувачів. Коли Ісус виходив із Храму, «каже Йому один з учеників Його: Учителю, дивись, яке каміннє і яка будівля»; інші говорили про Храм, «що каміннєм красним та посьвятами украшена». Ісус «ходив … по церкві у Соломоновім ходнику» — колонаді вздовж східного боку, а після П'ятдесятниці юрби «збіг ся до них … у ходник званий Соломонів». Спокусник поставив Його «на церковнім крилї», яке часто розміщують на південно-східному розі, де платформа здіймалася високо над долиною Кедрону. Уздовж південного боку йшла Іродова Царська стоя, а зовнішній двір, відкритий для язичників, займав більшу частину площі; сама святиня, перебудована за планом Соломонового дому «шістьдесять локот завдовжки, двайцять локот завширшки», стояла близько середини."
    - "Йосиф Флавій, який знав Храм до 70 р. н. е., дає пагорбу чотири стадії по колу, по стадії на кожен бік, що приблизно збігається з квадратом Мішни. Лін Рітмеєр простежив цей квадрат із 500 царських ліктів, 861 фут, у межах сучасної платформи — за уступом дохіродової кладки на північному заході й вигином східної стіни, тоді як інші розміщують його інакше. Видіння Єзекіїля дає святині стіну «завдовжки пятьсот міряльних тичин, і пятьсот міряльних тичин завширшки» — ідеальний квадрат, у багато разів більший. Платформу ніколи не розкопували; її обсяг відомий із збережених стін, серед яких Західна стіна, і з тунелів та знахідок уздовж них. Де саме на ній стояв Храм, обговорюється в окремому питанні."
  es:
    - "El monte del Templo de Herodes, la plataforma que aún se alza en la Ciudad Vieja de Jerusalén como Haram al-Sharif, cubre unas 14–15 ha, un recinto cuadrilátero ligeramente sesgado cuyos muros de contención miden unos 488 m al oeste, 470 m al este, 315 m al norte y 280 m al sur. Es aproximadamente una sexta parte de la Ciudad Vieja amurallada. Antes de Herodes, el atrio del Templo era mucho más pequeño: la Misná lo da como de 500 por 500 codos, un cuadrado de unos 260 m de lado, unas 7 ha, y Herodes lo duplicó aproximadamente hacia el 20 a. C. El punto del mapa está en la cima de la colina, el monte Moria."
    - "Su tamaño asombraba a los visitantes. Cuando Jesús salía del Templo, «le dice uno de sus discípulos: Maestro, mira qué piedras, y qué edificios»; otros hablaban del Templo, «adornado de hermosas piedras y dones». Jesús «andaba en el templo por el portal de Salomón», la columnata del lado oriental, y después de Pentecostés el pueblo «concurrió á ellos al pórtico que se llama de Salomón». El tentador lo puso «sobre las almenas del templo», que a menudo se sitúan en la esquina sureste, donde la plataforma se alzaba muy por encima del valle del Cedrón. A lo largo del lado sur corría el Pórtico Real de Herodes, y el atrio exterior, abierto a los gentiles, ocupaba la mayor parte de la superficie; el santuario mismo, reconstruido según el plano de la casa de Salomón de «sesenta codos de largo y veinte de ancho», se alzaba cerca del centro."
    - "Josefo, que conoció el Templo antes del año 70 d. C., da a la colina cuatro estadios de contorno, un estadio por lado, lo que coincide aproximadamente con el cuadrado de la Misná. Leen Ritmeyer trazó ese cuadrado de 500 codos reales, 861 pies, dentro de la plataforma actual, a partir de un escalón de mampostería preherodiana en el noroeste y de un quiebre del muro oriental, mientras que otros lo sitúan de otro modo. La visión de Ezequiel da al santuario un muro de «quinientas cañas de longitud, y quinientas cañas de anchura», un cuadrado ideal muchas veces mayor. La plataforma nunca fue excavada; su extensión se conoce por los muros que se conservan, entre ellos el Muro Occidental, y por los túneles y hallazgos a lo largo de ellos. Dónde se alzaba el Templo sobre ella se trata en su propia pregunta."
  pt:
    - "O monte do Templo de Herodes, a plataforma que ainda existe na Cidade Velha de Jerusalém como Haram al-Sharif, cobre cerca de 14–15 ha, um recinto quadrilátero um pouco irregular, cujos muros de arrimo medem cerca de 488 m a oeste, 470 m a leste, 315 m ao norte e 280 m ao sul. É cerca de um sexto da Cidade Velha murada. Antes de Herodes o pátio do Templo era bem menor: a Mishná o dá como 500 por 500 côvados, um quadrado de cerca de 260 m de lado, uns 7 ha, e Herodes o dobrou mais ou menos a partir de 20 a.C. O ponto do mapa fica no cume da colina, o monte Moriá."
    - "O tamanho assombrava os visitantes. Quando Jesus saía do Templo, “um dos seus discípulos lhe disse: ‘Mestre, veja que pedras e que edifícios!’”; outros falavam do Templo, “como estava adornado com belas pedras e ofertas dedicadas”. Jesus andava “no templo, no pórtico de Salomão”, a colunata do lado leste, e depois do Pentecostes a multidão “correu para eles, no pórtico chamado de Salomão”. O tentador o colocou “sobre o pináculo do templo”, muitas vezes situado no canto sudeste, onde a plataforma se erguia bem acima do vale do Cedrom. Ao longo do lado sul corria o Pórtico Real de Herodes, e o pátio exterior aberto aos gentios ocupava a maior parte da área; o santuário em si, reconstruído segundo o plano da casa de Salomão de “sessenta côvados” por vinte, ficava perto do centro."
    - "Josefo, que conheceu o Templo antes de 70 d.C., dá à colina quatro estádios de contorno, um estádio por lado, o que se aproxima do quadrado da Mishná. Leen Ritmeyer traçou esse quadrado de 500 côvados reais, 861 pés, dentro da plataforma atual, a partir de um degrau de alvenaria pré-herodiana no noroeste e de uma inflexão no muro oriental, enquanto outros o situam de outro modo. A visão de Ezequiel dá ao santuário um muro “com o comprimento de quinhentos côvados, e a largura de quinhentos côvados”, um quadrado ideal muitas vezes maior. A plataforma nunca foi escavada; sua extensão se conhece pelos muros que restam, entre eles o Muro das Lamentações, e pelos túneis e achados ao longo deles. Onde nela ficava o Templo é tratado em outra pergunta."
  de:
    - "Der Tempelberg des Herodes, die Plattform, die in der Altstadt Jerusalems noch heute als Haram esch-Scharif steht, bedeckt etwa 14–15 ha, ein leicht schiefes Viereck, dessen Stützmauern im Westen etwa 488 m, im Osten 470 m, im Norden 315 m und im Süden 280 m messen. Das ist etwa ein Sechstel der ummauerten Altstadt. Vor Herodes war der Tempelhof viel kleiner: Die Mischna gibt ihn mit 500 mal 500 Ellen an, ein Quadrat von etwa 260 m Seitenlänge, rund 7 ha, und Herodes verdoppelte ihn ab etwa 20 v. Chr. ungefähr. Der Kartenpunkt liegt auf dem Gipfel des Hügels, dem Berg Morija."
    - "Die Größe erstaunte die Besucher. Als Jesus den Tempel verließ, „sprach zu ihm seiner Jünger einer: Meister, siehe, welche Steine und welch ein Bau ist das!“; andere sprachen vom Tempel, „daß er geschmückt wäre mit feinen Steinen und Kleinoden“. Jesus „wandelte im Tempel in der Halle Salomos“, der Säulenhalle an der Ostseite, und nach Pfingsten „lief alles Volk zu ihnen in die Halle, die da heißt Salomos“. Der Versucher stellte ihn „auf die Zinne des Tempels“, die man oft an der Südostecke ansetzt, wo die Plattform hoch über dem Kidrontal stand. An der Südseite entlang verlief die Königshalle des Herodes, und der äußere, den Heiden offene Vorhof nahm den größten Teil der Fläche ein; das Heiligtum selbst, nach dem Plan des Hauses Salomos mit „sechzig Ellen“ Länge und zwanzig Breite wiedererrichtet, stand nahe der Mitte."
    - "Josephus, der den Tempel vor 70 n. Chr. kannte, gibt dem Hügel vier Stadien im Umfang, ein Stadion je Seite, was ungefähr zum Quadrat der Mischna passt. Leen Ritmeyer zeichnete dieses Quadrat aus 500 königlichen Ellen, 861 Fuß, innerhalb der heutigen Plattform nach, anhand einer Stufe vorherodianischen Mauerwerks im Nordwesten und eines Knicks in der Ostmauer, während andere es anders ansetzen. Hesekiels Vision gibt dem Heiligtum eine Mauer, die „ins Gevierte auf jeder Seite herum fünfhundert Ruten“ misst, ein ideales Quadrat, um ein Vielfaches größer. Die Plattform wurde nie ausgegraben; ihre Ausdehnung kennt man aus den erhaltenen Mauern, darunter der Westmauer, und den Tunneln und Funden entlang davon. Wo auf ihr der Tempel stand, wird in einer eigenen Frage behandelt."
  fr:
    - "Le mont du Temple d’Hérode, la plate-forme qui se dresse encore dans la Vieille Ville de Jérusalem sous le nom de Haram al-Sharif, couvre environ 14–15 ha : une enceinte quadrangulaire un peu oblique, dont les murs de soutènement mesurent environ 488 m à l’ouest, 470 m à l’est, 315 m au nord et 280 m au sud, soit environ un sixième de la Vieille Ville fortifiée. Avant Hérode, la cour du Temple était bien plus petite : la Mishna la donne pour 500 sur 500 coudées, un carré d’environ 260 m de côté, quelque 7 ha, et Hérode la doubla à peu près à partir de 20 av. J.-C. Le point de la carte se trouve au sommet de la colline, le mont Morija."
    - "Cette grandeur frappait les visiteurs. Quand Jésus sortit du temple, « un de ses disciples lui dit : Maître, regarde quelles pierres, et quelles constructions ! » ; d’autres parlaient « des belles pierres et des offrandes qui faisaient l’ornement du temple ». « Jésus se promenait dans le temple, sous le portique de Salomon », la colonnade du côté est, et après la Pentecôte tout le peuple « accourut vers eux, au portique dit de Salomon ». Le tentateur le plaça « sur le haut du temple », souvent situé à l’angle sud-est, où la plate-forme dominait la vallée du Cédron. Le long du côté sud courait le portique royal d’Hérode, et la cour extérieure, ouverte aux païens, occupait la plus grande partie de l’espace ; le sanctuaire, rebâti sur le plan de la maison de Salomon, de « soixante coudées de longueur, vingt de largeur », se dressait près du centre."
    - "Josèphe, qui connaissait le Temple avant 70 apr. J.-C., donne à la colline quatre stades de tour, un stade par côté, ce qui correspond à peu près au carré de la Mishna. Leen Ritmeyer a retrouvé ce carré de 500 coudées royales, 861 pieds, dans la plate-forme actuelle, d’après un ressaut de maçonnerie préhérodienne au nord-ouest et un coude du mur oriental ; d’autres le placent autrement. La vision d’Ézéchiel donne au sanctuaire un mur où « la longueur était de cinq cents cannes, et la largeur de cinq cents cannes », carré idéal bien plus grand. La plate-forme n’a jamais été fouillée ; son étendue se connaît par les murs conservés, dont le mur occidental, et par les tunnels et les trouvailles qui les longent. L’emplacement du Temple sur elle est traité dans une question à part."
  pl:
    - "Wzgórze Świątynne Heroda, platforma, która do dziś stoi w Starym Mieście w Jerozolimie jako Haram asz-Szarif, zajmuje około 14–15 ha; jest to nieco skośne czworoboczne ogrodzenie, którego mury oporowe mierzą około 488 m na zachodzie, 470 m na wschodzie, 315 m na północy i 280 m na południu. To mniej więcej jedna szósta otoczonego murami Starego Miasta. Przed Herodem dziedziniec Świątyni był znacznie mniejszy: Miszna podaje go jako 500 na 500 łokci, czyli kwadrat o boku około 260 m, około 7 ha, a Herod mniej więcej podwoił go od około 20 p.n.e. Punkt na mapie stoi na szczycie wzgórza, na górze Moria."
    - "Rozmiar zdumiewał odwiedzających. Gdy Jezus wychodził ze Świątyni, „rzekł mu jeden z uczniów jego: Nauczycielu! patrz, jakie to kamienie, i jakie budowania?”; inni mówili o Świątyni, „iż był pięknym kamieniem i upominkami ozdobiony”. „Przechadzał się Jezus w kościele, w przysionku Salomonowym”, czyli w kolumnadzie po wschodniej stronie, a po Pięćdziesiątnicy „zbieżał się do nich wszystek lud do przysionka, który zwano Salomonowym”. Kusiciel postawił go na szczycie Świątyni, „na ganku kościelnym”, który często umieszcza się w narożniku południowo-wschodnim, gdzie platforma wznosiła się wysoko nad doliną Cedronu. Wzdłuż strony południowej biegł Portyk Królewski Heroda, a dziedziniec zewnętrzny, otwarty dla pogan, zajmował większość powierzchni; samo sanktuarium, wzniesione na planie domu Salomona, „wdłuż na sześćdziesiąt łokci, a wszerz na dwadzieścia”, stało blisko środka."
    - "Józef Flawiusz, który znał Świątynię sprzed roku 70 n.e., podaje obwód wzgórza na cztery stadia, po stadionie na każdy bok, co z grubsza zgadza się z kwadratem z Miszny. Leen Ritmeyer wyśledził ten kwadrat 500 łokci królewskich, 861 stóp, wewnątrz obecnej platformy, na podstawie stopnia przedherodiańskiego muru w północno-zachodniej części i załamania muru wschodniego, podczas gdy inni umieszczają go inaczej. Wizja Ezechiela daje sanktuarium mur: „długość na pięćset, a szerokość także na pięćset lasek”, idealny kwadrat wielokrotnie większy. Platforma nigdy nie była wykopywana; jej rozległość znamy z zachowanych murów, między innymi Muru Zachodniego, oraz z tuneli i znalezisk wzdłuż nich. Gdzie na niej stała Świątynia, omawia osobne pytanie."
  it:
    - "Il Monte del Tempio di Erode, la piattaforma che ancora oggi sorge nella Città Vecchia di Gerusalemme come Haram al-Sharif, copre circa 14–15 ha: un recinto quadrilatero leggermente sghembo i cui muri di contenimento misurano circa 488 m a ovest, 470 m a est, 315 m a nord e 280 m a sud. È circa un sesto della Città Vecchia cinta di mura. Prima di Erode il cortile del Tempio era molto più piccolo: la Mishnah lo dà come 500 per 500 cubiti, un quadrato di circa 260 m di lato, circa 7 ha, ed Erode lo raddoppiò a partire dal 20 a.C. circa. Il punto della mappa si trova sulla sommità del colle, il Monte Moria."
    - "Le dimensioni stupivano i visitatori. Quando Gesù uscì dal Tempio, «uno de’ suoi discepoli gli disse: Maestro, guarda che pietre e che edifizi!»; altri facevano notare «come il tempio fosse adorno di belle pietre e di doni consacrati». Gesù «passeggiava nel tempio, sotto il portico di Salomone», il colonnato lungo il lato orientale, e dopo la Pentecoste la folla «accorse a loro al portico detto di Salomone». Il tentatore lo pose «sul pinnacolo del tempio», spesso collocato all’angolo sud-orientale, dove la piattaforma si ergeva alta sopra la valle del Cedron. Lungo il lato meridionale correva la Stoà Regia di Erode, e il cortile esterno aperto ai gentili occupava la maggior parte dell’area; il santuario vero e proprio, ricostruito sul piano della casa di Salomone, «sessanta cubiti di lunghezza, venti di larghezza», sorgeva verso il centro."
    - "Giuseppe Flavio, che conobbe il Tempio prima del 70 d.C., assegna al colle quattro stadi di perimetro, uno stadio per lato, il che corrisponde grosso modo al quadrato della Mishnah. Leen Ritmeyer ha tracciato quel quadrato di 500 cubiti regi, 861 piedi, entro l’attuale piattaforma, a partire da un gradino di muratura pre-erodiana a nord-ovest e da una piega del muro orientale, mentre altri lo collocano diversamente. La visione di Ezechiele dà al santuario un muro in cui «la lunghezza era di cinquecento e la larghezza di cinquecento» canne, un quadrato ideale molto più grande. La piattaforma non è mai stata scavata; la sua estensione è nota dai muri superstiti, tra cui il Muro Occidentale, e dai tunnel e dai reperti lungo di essi. Dove sorgesse su di essa il Tempio è trattato in una domanda a parte."
  nl:
    - "De Tempelberg van Herodes, het platform dat nog altijd in de Oude Stad van Jeruzalem staat als de Haram al-Sjarif, beslaat ongeveer 14–15 ha, een enigszins scheef vierzijdig terrein waarvan de steunmuren aan de westkant ongeveer 488 m meten, aan de oostkant 470 m, aan de noordkant 315 m en aan de zuidkant 280 m. Dat is ongeveer een zesde van de ommuurde Oude Stad. Vóór Herodes was het tempelplein veel kleiner: de Misjna geeft het op als 500 bij 500 ellen, een vierkant van ongeveer 260 m per zijde, zo’n 7 ha, en Herodes verdubbelde het ruwweg vanaf omstreeks 20 v.Chr. Het punt op de kaart staat op de top van de heuvel, de berg Moria."
    - "De omvang verbaasde bezoekers. Toen Jezus de tempel verliet, “zeide een van Zijn discipelen tot Hem: Meester, zie, hoedanige stenen, en hoedanige gebouwen!”; anderen spraken over “dat hij met schone stenen en begiftigingen versierd was”. Jezus “wandelde in den tempel, in het voorhof van Salomo”, de zuilengang langs de oostkant, en na Pinksteren “liep al het volk gezamenlijk tot hen in het voorhof, hetwelk Salomo’s voorhof genaamd wordt”. De duivel stelde Hem op “de tinne des tempels”, vaak geplaatst op de zuidoosthoek, waar het platform hoog boven het Kidrondal oprees. Langs de zuidkant liep Herodes’ Koninklijke Stoa, en het buitenste voorhof, open voor de heidenen, nam het grootste deel van de oppervlakte in; het heiligdom zelf, herbouwd naar het plan van Salomo’s huis van “zestig ellen” lang bij twintig breed, stond ongeveer in het midden."
    - "Josephus, die de tempel vóór 70 n.Chr. kende, geeft de heuvel een omtrek van vier stadiën, een stadion per zijde, wat ruwweg overeenkomt met het vierkant van de Misjna. Leen Ritmeyer zette dat vierkant van 500 koninklijke ellen, 861 ft, uit binnen het huidige platform, aan de hand van een stuk pre-herodiaans metselwerk in het noordwesten en een knik in de oostmuur, terwijl anderen het anders plaatsen. Ezechiëls visioen geeft het heiligdom een muur van “vijfhonderd rieten” lang en “vijfhonderd” breed, een ideaal vierkant dat vele malen groter is. Het platform is nooit opgegraven; de omvang ervan is bekend uit de bewaard gebleven muren, waaronder de Westelijke Muur, en uit de tunnels en vondsten daarlangs. Waar op het platform de tempel stond, wordt in een eigen vraag besproken."
  cs:
    - "Herodova Chrámová hora, terasa, která dosud stojí ve Starém Městě Jeruzaléma jako Haram aš-Šaríf, zaujímá asi 14–15 ha; je to mírně zkosený čtyřstranný okrsek, jehož opěrné zdi měří asi 488 m na západě, 470 m na východě, 315 m na severu a 280 m na jihu. To je zhruba šestina hradbami obehnaného Starého Města. Před Herodem byl chrámový dvůr mnohem menší: Mišna jej udává na 500 × 500 loktů, čtverec o straně asi 260 m, zhruba 7 ha, a Herodes jej od roku asi 20 př. n. l. přibližně zdvojnásobil. Bod na mapě stojí na vrcholu pahorku, hory Moria."
    - "Rozměry návštěvníky ohromovaly. Když Ježíš odcházel z chrámu, „dí jemu jeden z učedlníků jeho: Mistře, pohleď, kteraké kamení a jaké jest toto stavení!“; jiní mluvili o chrámu, „kterak by kamením pěkným i jinými okrasami ozdoben byl“. Jan vypráví, že „procházel se Ježíš v chrámě po síňci Šalomounově“, sloupořadí podél východní strany, a po letnicích „sběhl se k nim všecken lid do síňce, kteráž sloula Šalomounova“. Pokušitel jej postavil „na vrchu chrámu“, což se často klade na jihovýchodní roh, kde terasa stála vysoko nad údolím Kidron. Podél jižní strany vedla Herodova Královská stoa a vnější nádvoří přístupné pohanům zabíralo většinu plochy; samotná svatyně, přestavěná podle půdorysu Šalomounova domu „zdélí šedesáti loktů, a zšíří dvadcíti“, stála blízko středu."
    - "Josephus Flavius, který chrám před rokem 70 n. l. znal, dává pahorku čtyři stadia dokola, po stadiu na každou stranu, což zhruba odpovídá čtverci z Mišny. Leen Ritmeyer vyznačil tento čtverec o 500 královských loktech, 861 stopách, v dnešní terase podle stupně předherodovského zdiva na severozápadě a ohybu východní zdi, jiní jej však umisťují jinak. Ezechielovo vidění dává svatyni zeď „zdélí pěti set, a zšíří pěti set“ rákosů, ideální čtverec mnohonásobně větší. Terasa nebyla nikdy prozkoumána vykopávkami; její rozsah je znám z dochovaných zdí, mezi nimi Západní zdi, a z tunelů a nálezů podél nich. Kde na ní chrám stál, se probírá v samostatné otázce."
  sv:
    - "Herodes tempelberg, plattformen som ännu står kvar i Jerusalems gamla stad som Haram al-Sharif, täcker omkring 14–15 ha, en något sned fyrsidig inhägnad vars stödmurar mäter omkring 488 m i väster, 470 m i öster, 315 m i norr och 280 m i söder. Det är ungefär en sjättedel av den muromgärdade gamla staden. Före Herodes var tempelgården mycket mindre: Mishna anger den till 500 gånger 500 alnar, en kvadrat på omkring 260 m per sida, ungefär 7 ha, och Herodes fördubblade den ungefär från omkring 20 f.Kr. Kartpunkten står på kullens topp, berget Moria."
    - "Storleken förbluffade besökarna. När Jesus gick ut ur helgedomen ”sade en av hans lärjungar till honom: Mästare, se hurudana stenar och hurudana byggnader!”; andra talade om helgedomen, ”huru den var uppförd av härliga stenar och prydd med helgedomsskänker”. Jesus ”gick fram och åter i Salomos pelargång i helgedomen”, kolonnaden längs östra sidan, och efter pingst strömmade folket ”tillsammans till dem på den plats som kallades Salomos pelargång”. Frestaren ställde honom ”uppe på helgedomens mur”, ofta förlagd till det sydöstra hörnet, där plattformen stod högt över Kidrondalen. Längs södra sidan löpte Herodes kungliga pelarhall, och den yttre gården, öppen för hedningar, tog upp det mesta av ytan; själva helgedomen, återuppbyggd efter planen för Salomos hus på ”sextio alnar” i längd och tjugu i bredd, stod nära mitten."
    - "Josefus, som kände templet före år 70 e.Kr., anger kullens omkrets till fyra stadier, ett stadium per sida, vilket ungefär stämmer med Mishnas kvadrat. Leen Ritmeyer spårade den kvadraten på 500 kungliga alnar, 861 fot, inom den nuvarande plattformen, utifrån ett steg av förherodiansk murverk i nordväst och en knick i östra muren, medan andra placerar den annorlunda. Hesekiels syn ger helgedomen en mur som ”utefter platsens längd höll fem hundra stänger och utefter dess bredd fem hundra stänger”, en idealkvadrat många gånger större. Plattformen har aldrig grävts ut; dess utsträckning är känd från de bevarade murarna, bland dem Västmuren, och från tunnlarna och fynden längs dem. Var på den templet stod behandlas i en egen fråga."
