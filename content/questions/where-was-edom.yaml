id: where-was-edom
question:
  en: "Where was Edom?"
  ru: "Где находился Едом?"
  uk: "Де був Едом?"
  es: "¿Dónde estaba Edom?"
  pt: "Onde ficava Edom?"
  de: "Wo lag Edom?"
  fr: "Où se trouvait Édom ?"
  pl: "Gdzie leżał Edom?"
  it: "Dov’era Edom?"
  nl: "Waar lag Edom?"
  cs: "Kde ležel Edóm?"
  sv: "Var låg Edom?"
  nb: "Hvor lå Edom?"
  tl: "Saan ang Edom?"
answer:
  en:
    - "Edom was the mountain country south of the Dead Sea and east of the Arabah, the dry valley that runs down to the Gulf of Aqaba: the red sandstone highlands of southern Jordan, called Mount Seir in Genesis, with the Nabataean city of Petra at their heart in later times. The map point stands on Bozrah, its chief city, the modern Buseira about 120 km south-east of Jerusalem in a straight line; Sela, “the rock”, which Amaziah of Judah captured, is usually placed at the crag of es-Sela 5 km away, though an older view made it Petra."
    - "The Edomites were Israel's kin and enemy: “Thus dwelt Esau in mount Seir: Esau is Edom”, named for the “red pottage” he took for his birthright. When Moses asked for passage along the king's highway, “Edom said unto him, Thou shalt not pass by me, lest I come out against thee with the sword”. David put garrisons in Edom, and “all they of Edom became David's servants”, but under Jehoram “Edom revolted from under the hand of Judah, and made a king over themselves”. The prophets never forgave Edom's part in the fall of Jerusalem in 586 BC: Obadiah's whole book is against “thou that dwellest in the clefts of the rock”, Amos charges that Edom “did pursue his brother with the sword”, and Malachi, after the exile, has the Lord say “I hated Esau, and laid his mountains and his heritage waste”."
    - "Excavations at Buseira, Tawilan and the copper mines of Faynan show a kingdom of Edom that reached its height in the eighth and seventh centuries BC as a vassal of Assyria. After Babylon broke Judah the Edomites spread west into the Negev and the hills south of Hebron, which the Greeks called Idumea, while Arab tribes, the Nabataeans, took the old highlands and built Petra. John Hyrcanus conquered Idumea late in the second century BC and made its people Jews; Herod the Great came of an Idumean family, so that when Jesus was born the king of the Jews was a man of Edomite descent."
  ru:
    - "Едом — горная страна к югу от Мёртвого моря и к востоку от Аравы, сухой долины, спускающейся к заливу Акаба: нагорье красного песчаника на юге Иордании, которое Бытие называет горой Сеир, с набатейской Петрой в сердце его в позднейшие времена. Точка карты стоит на Восоре, главном его городе, — нынешней Бусейре примерно в 120 км к юго-востоку от Иерусалима по прямой; Селу, «скалу», которую взял Амасия Иудейский, обычно помещают на утёсе эс-Села в 5 км оттуда, хотя по старому мнению это была Петра."
    - "Едомитяне были Израилю родня и враг: «И поселился Исав на горе Сеир, Исав, он же Едом» — прозванный так по красному кушанью, за которое отдал первородство. Когда Моисей просил пропустить его царской дорогой, «Едом сказал ему: не проходи через меня, иначе я с мечом выступлю против тебя». Давид поставил в Едоме охранные войска, и «все Идумеяне были рабами Давиду», но при Иораме «выступил Едом из-под руки Иуды, и поставили они над собою царя». Пророки не простили Едому его участия в гибели Иерусалима в 586 г. до н. э.: вся книга Авдия — против Едома: «ты живешь в расселинах скал, на возвышенном месте», Амос обвиняет Едом в том, что «он преследовал брата своего мечом», а Малахия после плена передаёт слова Господа: «Исава возненавидел и предал горы его опустошению»."
    - "Раскопки в Бусейре, Тавилане и на медных рудниках Файнана показывают царство Едом, достигшее расцвета в VIII–VII веках до н. э. как вассал Ассирии. Когда Вавилон сломил Иудею, едомитяне расселились на запад, в Негев и горы к югу от Хеврона, которые греки назвали Идумеей, а старое нагорье заняли арабские племена — набатеи — и построили Петру. Иоанн Гиркан завоевал Идумею в конце II века до н. э. и обратил её жителей в иудейство; Ирод Великий происходил из идумейского рода, так что при рождении Иисуса царём иудейским был человек едомского происхождения."
  uk:
    - "Едом був гірською країною на південь від Мертвого моря і на схід від Арави, сухої долини, що спускається до затоки Акаба: червоні пісковикові нагір'я півдня Йорданії, зване в Книзі Буття горою Сеїр, з набатейським містом Петра в їхньому серці в пізніші часи. Точка мапи стоїть на Боцрі, його головному місті, нинішній Бусейрі приблизно за 120 км на південний схід від Єрусалиму по прямій; Села, «скеля», яку здобув Амасія Юдейський, зазвичай розміщують на скелі ес-Села за 5 км, хоча давніший погляд вважав її Петрою."
    - "Едомити були родичами й ворогами Ізраїлю: «Осївся ж Езав на Сеїр горах; Езав, він же Едом», названий за «сочивом сим червоним», яке він узяв за первородство. Коли Мойсей просив про прохід царською дорогою, «відказав йому Едом: Не переходити меш в мене; ато з мечем вийду проти тебе». Давид поставив гарнізони в Едомі, і «всї Ідумеї стали підневоленими Давидові», але за Йорама «визволились Едомії зпід верховоду Юдиного та й поставили царя над собою». Пророки ніколи не пробачили Едомові його участь у падінні Єрусалиму 586 р. до н. е.: уся Книга Авдія — проти того, «ти бо живеш у провалах між скелями на високих місцях», Амос звинувачує, що Едом «переслїдував мечем свого брата», а Малахія, по вигнанні, передає слова Господа: «А Езава я зненавидїв, так що гори його поробив безлюддєм, а наслїддє його — пробутком шакалів»."
    - "Розкопки в Бусейрі, Тавілані та на мідних копальнях Фейнану показують царство Едом, що досягло вершини у VIII–VII ст. до н. е. як васал Ассирії. Після того як Вавилон зламав Юду, едомити розселилися на захід у Негев і пагорби на південь від Хеврона, які греки називали Ідумеєю, тоді як арабські племена, набатеї, зайняли давні нагір'я і збудували Петру. Іван Гіркан підкорив Ідумею наприкінці II ст. до н. е. і зробив її народ іудеями; Ірод Великий походив з ідумейського роду, так що коли народився Ісус, цар євреїв був людиною едомитського походження."
  es:
    - "Edom era el país montañoso al sur del mar Muerto y al este de la Arabá, el valle seco que desciende hasta el golfo de Aqaba: las tierras altas de arenisca roja del sur de Jordania, llamadas monte Seir en Génesis, con la ciudad nabatea de Petra en su centro en épocas posteriores. El punto del mapa está en Bosra, su ciudad principal, la actual Buseira, a unos 120 km al sureste de Jerusalén en línea recta; Sela, «la roca», que capturó Amasías de Judá, suele situarse en el peñasco de es-Sela, a 5 km, aunque una opinión más antigua la identificaba con Petra."
    - "Los edomitas eran parientes y enemigos de Israel: «Y Esaú habitó en el monte de Seir: Esaú es Edom», nombre derivado de «eso bermejo» que tomó por su primogenitura. Cuando Moisés pidió paso por el camino real, «Edom le respondió: No pasarás por mi país, de otra manera saldré contra ti armado». David puso guarniciones en Edom, y «todos los Idumeos fueron siervos de David», pero bajo Joram «se rebeló Edom de debajo de la mano de Judá, y pusieron rey sobre sí». Los profetas nunca perdonaron la parte de Edom en la caída de Jerusalén en el 586 a. C.: todo el libro de Abdías va contra «tú que moras en las hendiduras de las peñas», Amós acusa que Edom «persiguió á cuchillo á su hermano», y Malaquías, tras el exilio, hace decir al Señor: «á Esaú aborrecí, y torné sus montes en asolamiento»."
    - "Las excavaciones en Buseira, Tawilan y las minas de cobre de Faynán muestran un reino de Edom que alcanzó su apogeo en los siglos VIII y VII a. C. como vasallo de Asiria. Tras la ruina de Judá por Babilonia, los edomitas se extendieron hacia el oeste, por el Négev y las colinas al sur de Hebrón, que los griegos llamaron Idumea, mientras que tribus árabes, los nabateos, tomaron las antiguas tierras altas y construyeron Petra. Juan Hircano conquistó Idumea a finales del siglo II a. C. e hizo judío a su pueblo; Herodes el Grande procedía de una familia idumea, de modo que cuando nació Jesús el rey de los judíos era un hombre de ascendencia edomita."
  pt:
    - "Edom era a região montanhosa ao sul do mar Morto e a leste do Arabá, o vale seco que desce até o golfo de Aqaba: as terras altas de arenito vermelho do sul da Jordânia, chamadas monte Seir em Gênesis, com a cidade nabateia de Petra em seu coração em época posterior. O ponto do mapa está em Bosra, sua principal cidade, a atual Buseira, a cerca de 120 km a sudeste de Jerusalém em linha reta; Sela, “a rocha”, que Amazias de Judá capturou, costuma ser situada no penhasco de es-Sela, a 5 km, embora uma visão mais antiga a identificasse com Petra."
    - "Os edomitas eram parentes e inimigos de Israel: “Esaú habitou na região montanhosa de Seir. Esaú é Edom”, nome vindo do “ensopado vermelho” que ele tomou por sua primogenitura. Quando Moisés pediu passagem pela estrada do rei, “Edom lhe disse: ‘Você não passará por mim, para que eu não saia com a espada contra você.’” Davi pôs guarnições em Edom, e “todos os edomitas se tornaram servos de Davi”, mas sob Jeorão “Edom se rebelou contra o domínio de Judá e constituiu um rei sobre si mesmos”. Os profetas nunca perdoaram a parte de Edom na queda de Jerusalém em 586 a.C.: todo o livro de Obadias é contra “você que habita nas fendas da rocha”, Amós acusa Edom de que “perseguiu seu irmão com a espada”, e Malaquias, depois do exílio, faz o Senhor dizer “odiei Esaú, e fiz de suas montanhas uma desolação”."
    - "As escavações em Buseira, Tawilan e nas minas de cobre de Faynan mostram um reino de Edom que atingiu o auge nos séculos VIII e VII a.C. como vassalo da Assíria. Depois que a Babilônia quebrou Judá, os edomitas se espalharam para o oeste, no Neguebe e nos montes ao sul de Hebrom, que os gregos chamaram Iduméia, enquanto tribos árabes, os nabateus, tomaram as antigas terras altas e construíram Petra. João Hircano conquistou a Iduméia no fim do século II a.C. e fez de seu povo judeus; Herodes, o Grande, vinha de família idumeia, de modo que, quando Jesus nasceu, o rei dos judeus era um homem de ascendência edomita."
  de:
    - "Edom war das Bergland südlich des Toten Meeres und östlich der Araba, des trockenen Tals, das zum Golf von Akaba hinabführt: das rote Sandsteinhochland des südlichen Jordanien, in der Genesis Gebirge Seir genannt, mit der nabatäischen Stadt Petra in späterer Zeit in seinem Herzen. Der Kartenpunkt liegt auf Bozra, seiner Hauptstadt, dem heutigen Buseira, in der Luftlinie etwa 120 km südöstlich von Jerusalem; Sela, „der Fels“, das Amazja von Juda eroberte, setzt man meist an den Felsen es-Sela, 5 km entfernt, obwohl eine ältere Ansicht es mit Petra gleichsetzte."
    - "Die Edomiter waren Israels Verwandte und Feinde: „Also wohnte Esau auf dem Gebirge Seir. Und Esau ist der Edom“; der Name erinnert an das „rote Gericht“, das er für sein Erstgeburtsrecht nahm. Als Mose um Durchzug auf der Königsstraße bat, sprach Edom: „Du sollst nicht durch mich ziehen, oder ich will dir mit dem Schwert entgegenziehen.“ David legte Besatzungen nach Edom, und „ganz Edom war David unterworfen“, doch unter Joram „fielen die Edomiter ab von Juda und machten einen König über sich“. Die Propheten verziehen Edom seine Rolle beim Fall Jerusalems 586 v. Chr. nie: Das ganze Buch Obadja richtet sich gegen den, der „in der Felsen Klüften wohnst“, Amos wirft Edom vor, „seinen Bruder mit dem Schwert verfolgt“ zu haben, und Maleachi lässt nach dem Exil den Herrn sagen: „und hasse Esau und habe sein Gebirge öde gemacht und sein Erbe den Schakalen zur Wüste“."
    - "Ausgrabungen in Buseira, Tawilan und den Kupferminen von Feinan zeigen ein Königreich Edom, das im 8. und 7. Jahrhundert v. Chr. als Vasall Assyriens seinen Höhepunkt erreichte. Nachdem Babylon Juda gebrochen hatte, breiteten sich die Edomiter nach Westen in den Negev und die Berge südlich von Hebron aus, die die Griechen Idumäa nannten, während arabische Stämme, die Nabatäer, das alte Hochland nahmen und Petra bauten. Johannes Hyrkanos eroberte Idumäa im späten 2. Jahrhundert v. Chr. und machte sein Volk zu Juden; Herodes der Große stammte aus einer idumäischen Familie, sodass der König der Juden bei Jesu Geburt ein Mann edomitischer Abstammung war."
  fr:
    - "Édom était le pays de montagnes au sud de la mer Morte et à l’est de l’Araba, la vallée sèche qui descend vers le golfe d’Aqaba : les hautes terres de grès rouge du sud de la Jordanie, appelées mont Séir dans la Genèse, avec au cœur, plus tard, la ville nabatéenne de Pétra. Le point de la carte est sur Botsra, sa principale ville, l’actuelle Buseira, à environ 120 km au sud-est de Jérusalem en ligne droite ; Séla, « le rocher », que prit Amatsia de Juda, se place d’ordinaire sur l’éperon d’es-Sela, à 5 km, bien qu’une opinion plus ancienne y ait vu Pétra."
    - "Les Édomites étaient parents et ennemis d’Israël : « Ésaü s’établit dans la montagne de Séir. Ésaü, c’est Édom », ainsi nommé d’après « ce roux » mangé pour son droit d’aînesse. Quand Moïse demanda passage par la route royale, Édom répondit : « Tu ne passeras point chez moi, sinon je sortirai à ta rencontre avec l’épée. » David mit des garnisons en Édom, et « tout Édom fut assujetti à David », mais sous Joram « Édom se révolta contre l’autorité de Juda, et se donna un roi ». Les prophètes ne pardonnèrent jamais le rôle d’Édom dans la chute de Jérusalem en 586 av. J.-C. : Abdias entier vise « toi qui habites le creux des rochers », Amos reproche à Édom d’avoir « poursuivi ses frères avec l’épée », et Malachie, après l’exil, fait dire au Seigneur : « j’ai eu de la haine pour Ésaü, j’ai fait de ses montagnes une solitude, j’ai livré son héritage aux chacals du désert »."
    - "Les fouilles de Buseira, de Tawilan et des mines de cuivre de Faynan montrent un royaume d’Édom qui atteignit son apogée aux VIIIe et VIIe siècles av. J.-C. comme vassal de l’Assyrie. Après que Babylone eut brisé Juda, les Édomites s’étendirent vers l’ouest dans le Néguev et les collines au sud d’Hébron, que les Grecs appelèrent Idumée, tandis que des tribus arabes, les Nabatéens, prenaient les anciennes hautes terres et bâtissaient Pétra. Jean Hyrcan conquit l’Idumée à la fin du IIe siècle av. J.-C. et fit de ses habitants des Juifs ; Hérode le Grand sortait d’une famille iduméenne, de sorte qu’à la naissance de Jésus le roi des Juifs était un homme de descendance édomite."
  pl:
    - "Edom był krajem górskim na południe od Morza Martwego i na wschód od Araby, suchej doliny biegnącej w dół do Zatoki Akaba: czerwonymi piaskowcowymi wyżynami południowej Jordanii, zwanymi w Księdze Rodzaju górą Seir, z nabatejskim miastem Petra w ich sercu w późniejszych czasach. Punkt na mapie stoi na Bosrze, jego głównym mieście, dzisiejszym Buseira około 120 km na południowy wschód od Jerozolimy w linii prostej; Sela, „skała”, którą zdobył Amazjasz z Judy, jest zwykle umieszczana na turni es-Sela 5 km dalej, choć starszy pogląd utożsamiał ją z Petrą."
    - "Edomici byli krewnymi i wrogami Izraela: „I mieszkał Ezaw na górze Seir, a ten Ezaw jest Edom”, nazwany od „czerwonej potrawy”, którą wziął za pierworództwo. Gdy Mojżesz prosił o przejście Gościńcem Królewskim, „Na to odpowiedział mu Edom: Nie pójdziesz przez moję ziemię, bym snać z mieczem nie wyszedł przeciw tobie”. Dawid osadził straże w Edomie i „byli wszyscy Edomczycy sługami Dawidowymi”, ale za Jorama „odstąpił Edom, aby nie był pod mocą Judy; i postanowili nad sobą króla”. Prorocy nigdy nie wybaczyli Edomowi roli w upadku Jerozolimy w 586 p.n.e.: cała księga Abdiasza jest przeciw temu, „który mieszkasz w rozpadlinach skalnych”, Amos zarzuca, że Edom „prześladuje mieczem brata swego”, a Malachiasz, po wygnaniu, każe Panu mówić: „Ezawa miałem w nienawiści, i podałem góry jego na spustoszenie, a dziedzictwo jego smokom na pustyni”."
    - "Wykopaliska w Buseira, Tawilan i w kopalniach miedzi w Fajnan pokazują królestwo Edomu, które osiągnęło szczyt w VIII i VII wieku p.n.e. jako wasal Asyrii. Gdy Babilon złamał Judę, Edomici rozeszli się na zachód w Negew i wzgórza na południe od Hebronu, które Grecy nazwali Idumeą, podczas gdy plemiona arabskie, Nabatejczycy, zajęły dawne wyżyny i zbudowały Petrę. Jan Hirkan podbił Idumeę pod koniec II wieku p.n.e. i uczynił jej mieszkańców Żydami; Herod Wielki pochodził z rodziny idumejskiej, tak że gdy urodził się Jezus, król Żydów był człowiekiem edomickiego pochodzenia."
  it:
    - "Edom era il paese montuoso a sud del Mar Morto e a est dell’Araba, la valle arida che scende al golfo di Aqaba: gli altopiani di arenaria rossa della Giordania meridionale, detti Monte Seir nella Genesi, con la città nabatea di Petra nel cuore in epoca posteriore. Il punto della mappa sta su Bosra, la sua città principale, l’odierna Buseira, a circa 120 km a sud-est di Gerusalemme in linea retta; Sela, «la roccia», che Amazia di Giuda conquistò, è di solito collocata sulla rupe di es-Sela a 5 km, benché una vecchia opinione la identificasse con Petra."
    - "Gli Edomiti erano parenti e nemici d’Israele: «Esaù abitò sulla montagna di Seir, Esaù è Edom», così chiamato per la «minestra rossa» che prese in cambio della primogenitura. Quando Mosè chiese il passaggio per la strada del re, Edom rispose: «Tu non passerai sul mio territorio; altrimenti, ti verrò contro con la spada». Davide pose guarnigioni in Edom e «tutti gli Edomiti divennero sudditi di Davide», ma sotto Ioram «Edom si ribellò, sottraendosi al giogo di Giuda e si dette un re». I profeti non perdonarono mai la parte di Edom nella caduta di Gerusalemme nel 586 a.C.: l’intero libro di Abdia è contro «tu che abiti fra le spaccature delle rocce», Amos accusa che Edom «ha inseguito il suo fratello con la spada», e Malachia, dopo l’esilio, fa dire al Signore: «ho odiato Esaù, ho fatto de’ suoi monti una desolazione»."
    - "Gli scavi a Buseira, Tawilan e nelle miniere di rame di Faynan mostrano un regno di Edom che raggiunse l’apogeo nell’VIII e VII secolo a.C. come vassallo dell’Assiria. Dopo che Babilonia spezzò Giuda gli Edomiti si diffusero a ovest nel Negev e nelle colline a sud di Ebron, che i Greci chiamarono Idumea, mentre tribù arabe, i Nabatei, presero gli antichi altopiani e costruirono Petra. Giovanni Ircano conquistò l’Idumea alla fine del II secolo a.C. e fece dei suoi abitanti dei Giudei; Erode il Grande veniva da una famiglia idumea, così che quando nacque Gesù il re dei Giudei era un uomo di discendenza edomita."
  nl:
    - "Edom was het bergland ten zuiden van de Dode Zee en ten oosten van de Araba, de droge vallei die naar de Golf van Aqaba loopt: het rode zandsteenhoogland van Zuid-Jordanië, in Genesis het gebergte Seïr genoemd, met in later tijd de Nabateese stad Petra in het hart. Het punt op de kaart staat op Bozra, de hoofdstad, het huidige Buseira, hemelsbreed ongeveer 120 km zuidoostelijk van Jeruzalem; Sela, “de rots”, dat Amazia van Juda veroverde, wordt gewoonlijk geplaatst op de rotsklip van es-Sela op 5 km, al maakte een oudere opvatting er Petra van."
    - "Edom was verwant en vijand: “Derhalve woonde Ezau op het gebergte Seir. Ezau is Edom”, genoemd naar het rode linzenkooksel (“dat rode, dat rode daar”) dat hij voor zijn eerstgeboorterecht nam. Mozes’ verzoek om doortocht beantwoordde Edom: “Gij zult door mij niet trekken, opdat ik niet misschien met het zwaard uitga u tegemoet!” David bezette het, en “alle Edomieten werden David tot knechten”, maar onder Joram “vielen de Edomieten van onder het gebied van Juda af, en maakten een koning over zich”. Edoms aandeel in Jeruzalems val (586 v.Chr.) vergaven de profeten nooit: Obadja’s boek keert zich tegen hem “die daar woont in de kloven der steenrotsen”, Amos verwijt dat hij “zijn broederen met het zwaard heeft vervolgd”, en Maleachi laat de HEER na de ballingschap zeggen: “En Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld tot een verwoesting, en zijn erve voor de draken der woestijn.”"
    - "Opgravingen te Buseira, Tawilan en de kopermijnen van Faynan tonen een koninkrijk Edom dat zijn hoogtepunt bereikte in de 8e en 7e eeuw v.Chr. als vazal van Assyrië. Nadat Babylon Juda had gebroken, trokken de Edomieten naar het westen de Negev en de heuvels ten zuiden van Hebron in, wat de Grieken Idumea noemden, terwijl Arabische stammen, de Nabateeërs, het oude hoogland innamen en Petra bouwden. Johannes Hyrcanus veroverde Idumea laat in de tweede eeuw v.Chr. en maakte zijn bevolking tot Joden; Herodes de Grote stamde uit een Idumese familie, zodat bij de geboorte van Jezus de koning van de Joden een man van Edomitische afkomst was."
  cs:
    - "Edóm byla horská země jižně od Mrtvého moře a východně od Araby, suchého údolí, které se sklání k Akabskému zálivu: vysočina z červeného pískovce v jižním Jordánsku, v Genesis zvaná hora Seír, s nabatejským městem Petra v pozdějších dobách v jejím srdci. Bod na mapě stojí na Bosře, jeho hlavním městě, dnešní Buseiře asi 120 km jihovýchodně od Jeruzaléma vzdušnou čarou; Sela, „skála“, kterou dobyl Amacjáš Judský, se obvykle klade na skalisko as-Sela 5 km odtud, ač starší názor v ní viděl Petru."
    - "Edómci byli Izraelovi příbuzní i nepřátelé: „Protož bydlil Ezau na hoře Seir; Ezau pak ten jest Edom“, pojmenovaný podle „krmě té červené“, kterou si vzal za prvorozenství. Když Mojžíš žádal o průchod královskou cestou, odpověděl Edom: „Nechoď skrze mou zemi, abych s mečem nevyšel v cestu tobě.“ David postavil v Edómu stráže a „učiněni jsou všickni Idumejští služebníci Davidovi“, ale za Jehorama „odstoupil Edom od království Judského, a ustanovili nad sebou krále“. Proroci nikdy neodpustili Edómu jeho podíl na pádu Jeruzaléma roku 586 př. n. l.: celá kniha Obadjášova je proti tomu, „kterýž bydlíš v rozsedlinách skalních“, Amos obviňuje, že Edom „stihá mečem bratra svého“, a Malachiáš po vyhnanství nechává Hospodina říci: „Ezau pak měl jsem v nenávisti; protož zanechal jsem hor jeho pustých.“"
    - "Vykopávky v Buseiře, Tavílanu a měděných dolech Fajnánu ukazují království Edómu, které dosáhlo vrcholu v 8. a 7. století př. n. l. jako vazal Asýrie. Poté, co Babylón zlomil Judsko, se Edómci rozšířili na západ do Negevu a hor jižně od Hebronu, které Řekové nazývali Idumea, zatímco arabské kmeny, Nabatejci, obsadily starou vysočinu a vybudovaly Petru. Jan Hyrkanos dobyl Idumeu koncem 2. století př. n. l. a učinil z jejích obyvatel Židy; Herodes Veliký pocházel z idumejského rodu, takže když se narodil Ježíš, byl králem Židů muž edómského původu."
  sv:
    - "Edom var bergslandet söder om Döda havet och öster om Arava, den torra dalen som löper ned mot Aqabaviken: de röda sandstenshögländerna i södra Jordanien, kallade Seirs berg i 1 Mosebok, med nabateernas stad Petra i deras hjärta i senare tid. Kartpunkten står på Bosra, dess huvudstad, dagens Buseira omkring 120 km sydost om Jerusalem fågelvägen; Sela, ”klippan”, som Amasja av Juda intog, placeras vanligen vid klippan es-Sela 5 km bort, fastän en äldre uppfattning gjorde det till Petra."
    - "Edoméerna var Israels släktingar och fiender: ”Och Esau bosatte sig i Seirs bergsbygd. Esau, det är densamme som Edom”, uppkallad efter ”det röda” som han tog för sin förstfödslorätt. När Mose bad om genomfart längs kungsvägen ”svarade Edom honom: Du får icke tåga genom mitt land. Om du det gör, skall jag draga ut emot dig med svärd”. David insatte fogdar i Edom, och ”alla edoméer blevo David underdåniga”, men under Joram ”avföll Edom från Juda välde och satte en egen konung över sig”. Profeterna förlät aldrig Edoms del i Jerusalems fall 586 f.Kr.: hela Obadjas bok riktas mot honom som ”sitter ibland bergsklyftorna”, Amos anklagar att Edom ”har förföljt sin broder med svärd”, och Malaki låter Herren, efter exilen, säga: ”Esau hatade jag; därför gjorde jag hans berg till en ödemark och hans arvedel till ett hemvist för öknens schakaler”."
    - "Utgrävningar vid Buseira, Tawilan och koppargruvorna i Faynan visar ett Edomrike som nådde sin höjd på 700- och 600-talen f.Kr. som vasall under Assyrien. Efter att Babylon krossat Juda spred sig edoméerna västerut in i Negev och bergen söder om Hebron, som grekerna kallade Idumeen, medan arabiska stammar, nabateerna, tog de gamla högländerna och byggde Petra. Johannes Hyrkanos erövrade Idumeen sent på 100-talet f.Kr. och gjorde dess folk till judar; Herodes den store kom från en idumeisk släkt, så att när Jesus föddes var judarnas kung en man av edomitisk härkomst."
  nb:
    - "Edom var fjellandet sør for Dødehavet og øst for Arava, den tørre dalen som løper ned til Akababukta: det røde sandsteinshøylandet i Sør-Jordan, kalt Seirfjellet i 1 Mosebok, med nabateernes by Petra i hjertet av det i senere tid. Kartpunktet står på Bosra, dens hovedby, dagens Buseira omtrent 120 km sørøst for Jerusalem i luftlinje; Sela, «klippen», som Amasja av Juda inntok, plasseres vanligvis ved klippen es-Sela 5 km unna, selv om et eldre syn gjorde den til Petra."
    - "Edomittene var Israels slektninger og fiender: «Så bosatte Esau sig i Se'ir-fjellene - Esau, det er den samme som Edom», oppkalt etter «det røde» (linsegrøten) han tok for sin førstefødselsrett. Da Moses ba om å få dra langs «kongeveien», «Edom svarte: Du må ikke dra gjennem mitt land, ellers drar jeg ut mot dig med sverd.» David la garnisoner i Edom, og «alle edomittene blev Davids tjenere», men under Joram «falt Edom fra Juda og tok sig en konge». Profetene tilga aldri Edoms rolle i Jerusalems fall i 586 f.Kr.: hele Obadjas bok er rettet mot «du som bor i fjellkløfter», Amos anklager at Edom «forfulgte sin bror med sverd», og Malaki, etter eksilet, lar Herren si at han «hatet Esau» og gjorde «hans fjell til en ørken og hans arv til en bolig for ørkenens sjakaler»."
    - "Utgravinger ved Buseira, Tawilan og kobbergruvene i Faynan viser et Edom som nådde sin høyde på 700- og 600-tallet f.Kr. som vasall under Assyria. Etter at Babylon brøt ned Juda, spredte edomittene seg vestover til Negev og åsene sør for Hebron, som grekerne kalte Idumea, mens arabiske stammer, nabateerne, overtok det gamle høylandet og bygget Petra. Johannes Hyrkan erobret Idumea seint på 100-tallet f.Kr. og gjorde folket dets til jøder; Herodes den store kom fra en idumeisk slekt, slik at da Jesus ble født, var jødenes konge en mann av edomittisk ætt."
  tl:
    - "Ang Edom ay ang bulubunduking lupain sa timog ng Dagat na Patay at silangan ng Araba, ang tuyong libis na bumababa sa Golpo ng Aqaba: ang mapulang kabundukang batong-buhangin ng timog Jordan, na tinatawag na Bundok Seir sa Genesis, na ang lungsod ng mga Nabateo na Petra ay nasa puso nito sa huling panahon. Ang tuldok sa mapa ay nasa Bozra, ang pangunahing lungsod nito, ang makabagong Buseira mga 120 km sa timog-silangan ng Jerusalem sa tuwid na guhit; ang Sela, “ang bato”, na nakuha ni Amasias ng Juda, ay karaniwang inilalagay sa tuktok ng es-Sela 5 km ang layo, bagaman ginawa itong Petra ng mas lumang pananaw."
    - "Ang mga Edomita ay kamag-anak at kaaway ng Israel: “tumahan si Esau sa bundok ng Seir: si Esau ay siyang Edom”, ipinangalan sa “mapulang lutuin” na kinuha niya kapalit ng karapatan ng panganay. Nang humingi si Moises ng daan sa daan ng hari, “sinabi ni Edom sa kaniya, Huwag kang magdadaan sa aking lupain, baka kita'y salubungin ng tabak”. Naglagay si David ng pulutong sa Edom, at “ang lahat na Idumeo ay nangaging alipin ni David”, ngunit sa ilalim ni Joram “nanghimagsik ang Edom…” Di pinatawad ng mga propeta ang bahagi ng Edom sa pagbagsak ng Jerusalem noong 586 BK: buong aklat ni Obadias ang laban sa “ikaw na tumatahan sa mga bitak ng bato”, ibinibintang ni Amos na “hinabol niya ng tabak ang kaniyang kapatid”, at kay Malakias, pagkatapos ng pagkatapon, sabi ng Panginoon, “si Esau ay aking kinapootan, at ginawa ko ang kaniyang mga bundok na isang kasiraan…”"
    - "Ipinakikita ng mga paghuhukay sa Buseira, Tawilan at mga minahan ng tanso ng Faynan ang kaharian ng Edom na umabot sa tugatog noong ikawalo at ikapitong siglo BK bilang basalyo ng Asiria. Pagkatapos wasakin ng Babilonia ang Juda, kumalat pakanluran ang mga Edomita sa Negev at sa mga burol sa timog ng Hebron, na tinawag ng mga Griyego na Idumea, samantalang kinuha ng mga tribong Arabe, ang mga Nabateo, ang lumang kabundukan at itinayo ang Petra. Sinakop ni Juan Hircano ang Idumea sa huling ikalawang siglo BK at ginawang Judio ang mga tao nito; si Herodes na Dakila ay nagmula sa pamilyang Idumeo, kaya nang ipanganak si Jesus, ang hari ng mga Judio ay lalaking lahing Edomita."
