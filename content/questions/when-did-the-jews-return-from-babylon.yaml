id: when-did-the-jews-return-from-babylon
question:
  en: "When did the Jews return from Babylon?"
  ru: "Когда иудеи вернулись из Вавилона?"
  uk: "Коли євреї повернулися з Вавилону?"
  es: "¿Cuándo regresaron los judíos de Babilonia?"
  pt: "Quando os judeus voltaram da Babilônia?"
  de: "Wann kehrten die Juden aus Babylon zurück?"
  fr: "Quand les Juifs sont-ils revenus de Babylone ?"
answer:
  en:
    - "The first return began in 538 BC, when Cyrus of Persia, in his first year as ruler of Babylon, let the exiles go back to Jerusalem; later companies followed under Ezra about 458 BC and Nehemiah in 445 BC."
    - 'Cyrus took Babylon in 539 BC, as the Nabonidus Chronicle records, and the Book of Ezra opens with his decree: "Who is there among you of all his people? his God be with him, and let him go up to Jerusalem, which is in Judah, and build the house of the LORD God of Israel." The Cyrus Cylinder shows the same policy toward other peoples whose gods and populations he restored to their places. The first company, led by Sheshbazzar and Zerubbabel, numbered some 42,000 according to Ezra''s list; they rebuilt the altar, laid the foundation of the Temple in their second year, and after a long interruption finished the Second Temple in the sixth year of Darius, 516 BC (515 is also held).'
    - "Not all returned; a large community stayed in Babylonia for centuries. Ezra came with a further company in the seventh year of Artaxerxes I, about 458 BC, a journey of four months, and Nehemiah followed in the king's twentieth year, about 445 BC, and rebuilt the walls of Jerusalem in fifty-two days. Jeremiah's seventy years of captivity are reckoned in different ways, from the first deportation of 605 BC to the first return, or from the fall of the Temple in 587 or 586 to its completion in 516."
  ru:
    - "Первое возвращение началось в 538 г. до н. э., когда Кир Персидский в первый год своего правления над Вавилоном разрешил переселенцам вернуться в Иерусалим; позже за ними последовали группы под началом Ездры около 458 г. и Неемии в 445 г. до н. э."
    - "Кир взял Вавилон в 539 г. до н. э., как сообщает Хроника Набонида, и книга Ездры начинается с его указа: «Кто есть из вас, из всего народа Его, — да будет Бог его с ним, — и пусть он идет в Иерусалим, что в Иудее, и строит дом Господа Бога Израилева». Цилиндр Кира показывает ту же политику по отношению к другим народам, чьих богов и жителей он вернул на их места. Первая группа во главе с Шешбацаром и Зоровавелем насчитывала около 42 000 человек по списку Ездры; они восстановили жертвенник, во второй год заложили основание Храма и после долгого перерыва завершили Второй Храм в шестой год Дария, в 516 г. до н. э. (называют и 515-й)."
    - "Вернулись не все: большая община осталась в Вавилонии на столетия. Ездра привёл новую группу в седьмой год Артаксеркса I, около 458 г. до н. э., — путь занял четыре месяца; Неемия пришёл в двадцатый год того же царя, около 445 г., и за пятьдесят два дня восстановил стены Иерусалима. Семьдесят лет плена у Иеремии считают по-разному: от первого переселения в 605 г. до н. э. до первого возвращения или от гибели Храма в 587 или 586 г. до его завершения в 516-м."
  uk:
    - "Перше повернення почалося 538 р. до н. е., коли Кір Перський, у свій перший рік як володар Вавилону, дозволив вигнанцям повернутися до Єрусалиму; пізніші загони слідували за Ездрою близько 458 р. до н. е. і Неемією 445 р. до н. е."
    - "Кір узяв Вавилон 539 р. до н. е., як записує Хроніка Набоніда, а Книга Ездри відкривається його указом: «Хто є зпоміж вас з усього народу його, — нехай буде Бог його з ним — і нехай ійде в Ерусалим, що в Юдеї, і будує дім Господа, Бога Ізрайлевого». Циліндр Кіра показує ту саму політику щодо інших народів, чиїх богів і населення він повертав на їхні місця. Перший загін, на чолі з Шешбацаром і Зоровавелем, нараховував, за списком Ездри, близько 42 000 осіб; вони відбудували жертовник, заклали фундамент Храму на другому році й після довгої перерви завершили Другий Храм на шостому році Дарія, 516 р. до н. е. (називають і 515)."
    - "Повернулися не всі; велика громада залишалася у Вавилонії століттями. Ездра прийшов з іншим загоном на сьомому році Артаксеркса I, близько 458 р. до н. е., подорож тривала чотири місяці, а Неемія пішов за ним у двадцятому році царя, близько 445 р. до н. е., і відбудував мури Єрусалиму за п'ятдесят два дні. Сімдесят років неволі за Єремією рахують по-різному: від першої депортації 605 р. до н. е. до першого повернення або від падіння Храму 587 чи 586 р. до його завершення 516 р."
  es:
    - "El primer regreso comenzó en el 538 a. C., cuando Ciro de Persia, en su primer año como soberano de Babilonia, permitió a los desterrados volver a Jerusalén; compañías posteriores siguieron bajo Esdras hacia el 458 a. C. y bajo Nehemías en el 445 a. C."
    - "Ciro tomó Babilonia en el 539 a. C., como registra la Crónica de Nabonido, y el libro de Esdras se abre con su decreto: «¿Quién hay entre vosotros de todo su pueblo? Sea Dios con él, y suba á Jerusalem que está en Judá, y edifique la casa á Jehová Dios de Israel». El Cilindro de Ciro muestra la misma política hacia otros pueblos, cuyos dioses y poblaciones devolvió a sus lugares. La primera compañía, dirigida por Sesbasar y Zorobabel, sumaba unos 42 000 según la lista de Esdras; reconstruyeron el altar, pusieron los cimientos del Templo en su segundo año y, tras una larga interrupción, terminaron el Segundo Templo en el año sexto de Darío, el 516 a. C. (también se sostiene el 515)."
    - "No todos regresaron; una gran comunidad permaneció en Babilonia durante siglos. Esdras vino con otra compañía en el año séptimo de Artajerjes I, hacia el 458 a. C., un viaje de cuatro meses, y Nehemías lo siguió en el año veinte del rey, hacia el 445 a. C., y reconstruyó las murallas de Jerusalén en cincuenta y dos días. Los setenta años de cautiverio de Jeremías se calculan de diferentes maneras, desde la primera deportación del 605 a. C. hasta el primer regreso, o desde la caída del Templo en el 587 o 586 hasta su terminación en el 516."
  pt:
    - "O primeiro regresso começou em 538 a.C., quando Ciro da Pérsia, em seu primeiro ano como governante de Babilônia, deixou os exilados voltar a Jerusalém; outros grupos vieram depois, com Esdras por volta de 458 a.C. e com Neemias em 445 a.C."
    - "Ciro tomou Babilônia em 539 a.C., como registra a Crônica de Nabonido, e o livro de Esdras abre com o seu decreto: “Quem quer que haja entre vocês de todo o seu povo, que o seu Deus esteja com ele, e que suba a Jerusalém, que fica em Judá, e edifique a casa do SENHOR, o Deus de Israel”. O Cilindro de Ciro mostra a mesma política com outros povos, cujos deuses e populações ele restituiu a seus lugares. O primeiro grupo, chefiado por Sesbazar e Zorobabel, somava cerca de 42.000 segundo a lista de Esdras; reconstruíram o altar, lançaram o alicerce do Templo no segundo ano e, após longa interrupção, concluíram o Segundo Templo no sexto ano de Dario, 516 a.C. (também se defende 515)."
    - "Nem todos voltaram; uma grande comunidade ficou na Babilônia por séculos. Esdras veio com outro grupo no sétimo ano de Artaxerxes I, por volta de 458 a.C., numa viagem de quatro meses, e Neemias o seguiu no vigésimo ano do rei, por volta de 445 a.C., e reconstruiu as muralhas de Jerusalém em cinquenta e dois dias. Os setenta anos de cativeiro de Jeremias são contados de maneiras diferentes, da primeira deportação, em 605 a.C., ao primeiro regresso, ou da queda do Templo, em 587 ou 586, à sua conclusão, em 516."
  de:
    - "Die erste Rückkehr begann 538 v. Chr., als Kyrus von Persien in seinem ersten Jahr als Herrscher von Babylon die Verbannten nach Jerusalem zurückkehren ließ; weitere Züge folgten unter Esra um 458 v. Chr. und unter Nehemia 445 v. Chr."
    - "Kyrus nahm Babylon 539 v. Chr. ein, wie die Nabonid-Chronik berichtet, und das Buch Esra beginnt mit seinem Erlass: Wer unter ihnen zu seinem Volk gehöre, dessen Gott sei mit ihm, „und er ziehe hinauf gen Jerusalem in Juda und baue das Haus des HERRN, des Gottes Israels“. Der Kyrus-Zylinder zeigt dieselbe Politik gegenüber anderen Völkern, deren Götter und Bevölkerungen er an ihre Orte zurückbrachte. Der erste Zug unter Scheschbazzar und Serubbabel zählte nach Esras Liste etwa 42 000; sie bauten den Altar wieder auf, legten in ihrem zweiten Jahr den Grund des Tempels und vollendeten nach langer Unterbrechung den Zweiten Tempel im sechsten Jahr des Darius, 516 v. Chr. (auch 515 wird vertreten)."
    - "Nicht alle kehrten zurück; eine große Gemeinde blieb jahrhundertelang in Babylonien. Esra kam mit einem weiteren Zug im siebten Jahr des Artaxerxes I., um 458 v. Chr., auf einer Reise von vier Monaten, und Nehemia folgte im zwanzigsten Jahr des Königs, um 445 v. Chr., und baute die Mauern Jerusalems in zweiundfünfzig Tagen wieder auf. Jeremias siebzig Jahre Gefangenschaft werden unterschiedlich gezählt: von der ersten Wegführung 605 v. Chr. bis zur ersten Rückkehr oder vom Fall des Tempels 587 oder 586 bis zu seiner Vollendung 516."
  fr:
    - "Le premier retour commença en 538 av. J.-C., quand Cyrus de Perse, dans sa première année de maître de Babylone, laissa les exilés retourner à Jérusalem ; d’autres convois suivirent sous Esdras vers 458 av. J.-C. et sous Néhémie en 445 av. J.-C."
    - "Cyrus prit Babylone en 539 av. J.-C., comme le rapporte la Chronique de Nabonide, et le livre d’Esdras s’ouvre sur son décret : « Qui d’entre vous est de son peuple ? Que son Dieu soit avec lui, et qu’il monte à Jérusalem en Juda et bâtisse la maison de l’Éternel, le Dieu d’Israël ! » Le Cylindre de Cyrus montre la même politique envers d’autres peuples, dont il rétablit les dieux et les populations dans leurs lieux. Le premier convoi, mené par Scheschbatsar et Zorobabel, comptait quelque 42 000 personnes d’après la liste d’Esdras ; ils rebâtirent l’autel, posèrent les fondations du Temple la deuxième année, et après une longue interruption achevèrent le second Temple la sixième année de Darius, 516 av. J.-C. (515 est aussi retenu)."
    - "Tous ne revinrent pas ; une grande communauté resta en Babylonie pendant des siècles. Esdras vint avec un autre convoi la septième année d’Artaxerxès Ier, vers 458 av. J.-C., voyage de quatre mois, et Néhémie suivit la vingtième année du roi, vers 445 av. J.-C., et rebâtit les murailles de Jérusalem en cinquante-deux jours. Les soixante-dix ans de captivité de Jérémie se comptent de diverses façons : de la première déportation de 605 av. J.-C. au premier retour, ou de la chute du Temple en 587 ou 586 à son achèvement en 516."
