id: where-did-gideon-defeat-the-midianites
question:
  en: "Where did Gideon defeat the Midianites?"
  ru: "Где Гедеон разбил мадианитян?"
answer:
  en:
    - "At the eastern end of the Jezreel valley, in the north of today's Israel. Gideon's men camped at the spring of Harod, Ain Jalud at the foot of Mount Gilboa, 3 km east of Jezreel and 15 km west of Beth-shan; the Midianites lay across the valley to the north by the hill of Moreh, Givat HaMoreh, about 8 km away. The map puts Gideon's home, Ophrah, 9 km to the west at Afula, though the site is disputed. The night attack of the three hundred sent the enemy fleeing down the valley toward the Jordan, to Beth-shittah 5 km away and Abel-meholah 27 km away on the river, and Gideon pursued them across the Jordan far into the desert, to Karkor."
    - "Judges sets the scene: “all the Midianites and the Amalekites and the children of the east were gathered together, and went over, and pitched in the valley of Jezreel”; “Then Jerubbaal, who is Gideon, and all the people that were with him, rose up early, and pitched beside the well of Harod: so that the host of the Midianites were on the north side of them, by the hill of Moreh, in the valley.” The raiders “lay along in the valley like grasshoppers for multitude; and their camels were without number”. When the trumpets sounded, “the LORD set every man's sword against his fellow, even throughout all the host: and the host fled to Beth-shittah in Zererath, and to the border of Abel-meholah”; “And Gideon came to Jordan, and passed over, he, and the three hundred men that were with him, faint, yet pursuing them.”"
    - "The Midianites were camel nomads from the deserts east and south of the land, and this is often called the first picture in the Bible of raiders mounted on camels; they came at harvest to strip the fields, which is why Gideon was threshing wheat in a winepress to hide it. The Jezreel valley, the broad plain between Galilee and the hills of Samaria, is the natural way in from the Jordan fords at Beth-shan. The date is uncertain, like all the judges; the map's conventional year is about 1150 BC. The spring of Harod kept its fame: Saul's army probably camped here before Gilboa, and here at Ain Jalut in 1260 the Mamluks of Egypt defeated the Mongols."
  ru:
    - "На восточном краю Изреельской долины, на севере нынешнего Израиля. Люди Гедеона стали у источника Харода — Айн-Джалуд у подножия горы Гелвуй, в 3 км к востоку от Изрееля и в 15 км к западу от Бефсана; мадианитяне стояли за долиной к северу, у холма Море, Гиват-ха-Море, примерно в 8 км. Родину Гедеона, Офру, карта ставит в 9 км к западу, в Афуле, хотя место спорно. Ночное нападение трёхсот обратило врага в бегство вниз по долине к Иордану — к Бефшитте в 5 км и к Авелмехоле в 27 км, на реке, — а Гедеон преследовал их за Иорданом далеко в пустыне, до Каркора."
    - "Книга Судей задаёт место действия: «все Мадианитяне и Амаликитяне и жители востока собрались вместе, перешли реку и стали станом на долине Изреельской»; «Иероваал, он же и Гедеон, встал поутру и весь народ, бывший с ним, и расположились станом у источника Харода; Мадиамский же стан был от него к северу у холма Море в долине». Налётчики «расположились на долине в таком множестве, как саранча; верблюдам их не было числа». Когда затрубили трубы, «обратил Господь меч одного на другого во всем стане, и бежало ополчение до Бефшитты к Царере, до предела Авелмехолы»; «И пришел Гедеон к Иордану, и перешел сам и триста человек, бывшие с ним. Они были утомлены и голодны, преследуя врагов»."
    - "Мадианитяне были кочевниками на верблюдах из пустынь к востоку и югу от страны, и этот рассказ часто называют первым в Библии изображением налётчиков на верблюдах; они приходили в жатву обирать поля — потому Гедеон и молотил пшеницу в точиле, чтобы скрыть её. Изреельская долина, широкая равнина между Галилеей и горами Самарии, — естественный вход в страну от бродов Иордана у Бефсана. Дата, как у всех судей, неясна; условный год карты — около 1150 г. до н. э. Источник Харода остался в памяти: здесь, вероятно, стояло войско Саула перед Гелвуем, и здесь же, при Айн-Джалуте, в 1260 году мамлюки Египта разбили монголов."
