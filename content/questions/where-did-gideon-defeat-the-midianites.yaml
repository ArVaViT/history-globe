id: where-did-gideon-defeat-the-midianites
question:
  en: "Where did Gideon defeat the Midianites?"
  ru: "Где Гедеон разбил мадианитян?"
  uk: "Де Гедеон розбив мідіянітян?"
  es: "¿Dónde derrotó Gedeón a los madianitas?"
  pt: "Onde Gideão derrotou os midianitas?"
  de: "Wo besiegte Gideon die Midianiter?"
  fr: "Où Gédéon a-t-il battu les Madianites ?"
  pl: "Gdzie Gedeon pokonał Madianitów?"
  it: "Dove Gedeone sconfisse i Madianiti?"
  nl: "Waar versloeg Gideon de Midianieten?"
  cs: "Kde Gedeon porazil Midjánce?"
  sv: "Var besegrade Gideon midjaniterna?"
  nb: "Hvor beseiret Gideon midianittene?"
  tl: "Saan tinalo ni Gedeon ang mga Madianita?"
answer:
  en:
    - "At the eastern end of the Jezreel valley, in the north of today's Israel. Gideon's men camped at the spring of Harod, Ain Jalud at the foot of Mount Gilboa, 3 km east of Jezreel and 15 km west of Beth-shan; the Midianites lay across the valley to the north by the hill of Moreh, Givat HaMoreh, about 8 km away. The map puts Gideon's home, Ophrah, 9 km to the west at Afula, though the site is disputed. The night attack of the three hundred sent the enemy fleeing down the valley toward the Jordan, to Beth-shittah 5 km away and Abel-meholah 27 km away on the river, and Gideon pursued them across the Jordan far into the desert, to Karkor."
    - "Judges sets the scene: “all the Midianites and the Amalekites and the children of the east were gathered together, and went over, and pitched in the valley of Jezreel”; “Then Jerubbaal, who is Gideon, and all the people that were with him, rose up early, and pitched beside the well of Harod: so that the host of the Midianites were on the north side of them, by the hill of Moreh, in the valley.” The raiders “lay along in the valley like grasshoppers for multitude; and their camels were without number”. When the trumpets sounded, “the LORD set every man's sword against his fellow, even throughout all the host: and the host fled to Beth-shittah in Zererath, and to the border of Abel-meholah”; “And Gideon came to Jordan, and passed over, he, and the three hundred men that were with him, faint, yet pursuing them.”"
    - "The Midianites were camel nomads from the deserts east and south of the land, and this is often called the first picture in the Bible of raiders mounted on camels; they came at harvest to strip the fields, which is why Gideon was threshing wheat in a winepress to hide it. The Jezreel valley, the broad plain between Galilee and the hills of Samaria, is the natural way in from the Jordan fords at Beth-shan. The date is uncertain, like all the judges; the map's conventional year is about 1150 BC. The spring of Harod kept its fame: Saul's army probably camped here before Gilboa, and here at Ain Jalut in 1260 the Mamluks of Egypt defeated the Mongols."
  ru:
    - "На восточном краю Изреельской долины, на севере нынешнего Израиля. Люди Гедеона стали у источника Харода — Айн-Джалуд у подножия горы Гелвуй, в 3 км к востоку от Изрееля и в 15 км к западу от Бефсана; мадианитяне стояли за долиной к северу, у холма Море, Гиват-ха-Море, примерно в 8 км. Родину Гедеона, Офру, карта ставит в 9 км к западу, в Афуле, хотя место спорно. Ночное нападение трёхсот обратило врага в бегство вниз по долине к Иордану — к Бефшитте в 5 км и к Авелмехоле в 27 км, на реке, — а Гедеон преследовал их за Иорданом далеко в пустыне, до Каркора."
    - "Книга Судей задаёт место действия: «все Мадианитяне и Амаликитяне и жители востока собрались вместе, перешли реку и стали станом на долине Изреельской»; «Иероваал, он же и Гедеон, встал поутру и весь народ, бывший с ним, и расположились станом у источника Харода; Мадиамский же стан был от него к северу у холма Море в долине». Налётчики «расположились на долине в таком множестве, как саранча; верблюдам их не было числа». Когда затрубили трубы, «обратил Господь меч одного на другого во всем стане, и бежало ополчение до Бефшитты к Царере, до предела Авелмехолы»; «И пришел Гедеон к Иордану, и перешел сам и триста человек, бывшие с ним. Они были утомлены и голодны, преследуя врагов»."
    - "Мадианитяне были кочевниками на верблюдах из пустынь к востоку и югу от страны, и этот рассказ часто называют первым в Библии изображением налётчиков на верблюдах; они приходили в жатву обирать поля — потому Гедеон и молотил пшеницу в точиле, чтобы скрыть её. Изреельская долина, широкая равнина между Галилеей и горами Самарии, — естественный вход в страну от бродов Иордана у Бефсана. Дата, как у всех судей, неясна; условный год карты — около 1150 г. до н. э. Источник Харода остался в памяти: здесь, вероятно, стояло войско Саула перед Гелвуем, и здесь же, при Айн-Джалуте, в 1260 году мамлюки Египта разбили монголов."
  uk:
    - "На східному кінці Ізреельської долини, на півночі нинішнього Ізраїлю. Люди Гедеона отаборилися біля джерела Харод, Айн-Джалуд, під горою Гільбоа, за 3 км на схід від Їзреелю й за 15 км на захід від Бет-Шеану; мідіянітяни лежали через долину на півночі біля пагорба Море, Гіват-га-Море, приблизно за 8 км. Мапа розміщує дім Гедеона, Офру, за 9 км на захід в Афулі, хоча місце спірне. Нічний напад трьохсот змусив ворога тікати вниз долиною до Йордану, до Бет-Шітти за 5 км і до Авел-Мехоли за 27 км на річці, а Гедеон переслідував їх через Йордан далеко в пустелю, до Каркору."
    - "Книга Суддів змальовує обстановку: «усї Мадиянїї, Амаликії і восточане зібрались до купи, переправились через Йордань й отаборились на Езреель-долинї»; «У ранцї встав Еробаах, се є Гедеон, з усїма людьми, що були при йому, та й отаборились вони коло криницї Гарод. Табір же Мадиянський стояв на північ від його, коло горба Море на поділлї». Грабіжники були «як сарани Мадиянїя, Амалика і тих що з востоку таборян, а верблюдів їх безлїч». Коли залунали сурми, «обернув Господь мечі їх у таборі проти своїх людей, і все, що було в таборі, побігло до Бетситта на Цереру, до берега Абелмеголи»; «Як же прибув Гедеон до Йорданї й перейшов на той бік сам і триста, що йшли з ним, потомлені погонею»."
    - "Мідіянітяни були кочівниками-верблюдарями з пустель на схід і південь від країни, і це часто називають першим у Біблії зображенням грабіжників верхи на верблюдах; вони приходили під час жнив обчищати поля, тому Гедеон і молотив пшеницю в точилі, щоб сховати її. Ізреельська долина, широка рівнина між Галілеєю та пагорбами Самарії, є природним шляхом від йорданських бродів біля Бет-Шеану. Дата непевна, як і в усіх суддів; умовний рік мапи — близько 1150 р. до н. е. Джерело Харод зберегло свою славу: військо Саула, ймовірно, отаборилося тут перед Гільбоа, а тут, в Айн-Джалуті, 1260 р. єгипетські мамлюки розбили монголів."
  es:
    - "En el extremo oriental del valle de Jezreel, en el norte del Israel actual. Los hombres de Gedeón acamparon junto a la fuente de Harod, Ain Jalud, al pie del monte Gilboa, a 3 km al este de Jezreel y 15 km al oeste de Bet-seán; los madianitas estaban al otro lado del valle, al norte, junto al collado de Moré, Givat HaMoreh, a unos 8 km. El mapa sitúa la casa de Gedeón, Ofra, 9 km al oeste, en Afula, aunque el lugar es discutido. El ataque nocturno de los trescientos hizo huir al enemigo valle abajo hacia el Jordán, hasta Bet-sita, a 5 km, y Abel-mehola, a 27 km, junto al río, y Gedeón los persiguió al otro lado del Jordán, muy adentro del desierto, hasta Carcor."
    - "Jueces describe la escena: «todos los Madianitas, y Amalecitas, y orientales, se juntaron á una, y pasando asentaron campo en el valle de Jezreel»; «Levantándose pues de mañana Jerobaal, el cual es Gedeón, y todo el pueblo que estaba con él, asentaron el campo junto á la fuente de Harod: y tenía el campo de los Madianitas al norte, de la otra parte del collado de More, en el valle». Los saqueadores «estaban tendidos en el valle como langostas en muchedumbre, y sus camellos eran innumerables». Cuando sonaron las trompetas, «Jehová puso la espada de cada uno contra su compañero en todo el campo. Y el ejército huyó hasta Beth-sitta, hacia Cerera, y hasta el término de Abel-mehola en Tabbat»; «Y vino Gedeón al Jordán para pasar, él y los trescientos hombres que traía consigo, cansados del alcance»."
    - "Los madianitas eran nómadas de camellos de los desiertos al este y al sur de la tierra, y esta suele llamarse la primera imagen de la Biblia de saqueadores montados en camellos; venían en la cosecha para despojar los campos, razón por la cual Gedeón trillaba trigo en un lagar para esconderlo. El valle de Jezreel, la amplia llanura entre Galilea y los montes de Samaria, es la vía natural de entrada desde los vados del Jordán en Bet-seán. La fecha es incierta, como la de todos los jueces; el año convencional del mapa es hacia el 1150 a. C. La fuente de Harod conservó su fama: el ejército de Saúl probablemente acampó aquí antes de Gilboa, y aquí, en Ain Jalut, en 1260, los mamelucos de Egipto derrotaron a los mongoles."
  pt:
    - "Na extremidade oriental do vale de Jezreel, no norte do Israel de hoje. Os homens de Gideão acamparam na fonte de Harode, Ain Jalud, ao pé do monte Gilboa, 3 km a leste de Jezreel e 15 km a oeste de Bete-Seã; os midianitas estavam do outro lado do vale, ao norte, junto à colina de Moré, Givat HaMoreh, a cerca de 8 km. O mapa põe a terra de Gideão, Ofra, 9 km a oeste, em Afula, embora o local seja disputado. O ataque noturno dos trezentos fez o inimigo fugir vale abaixo rumo ao Jordão, até Bete-Sita, a 5 km, e Abel-Meolá, a 27 km, no rio, e Gideão os perseguiu além do Jordão, deserto adentro, até Carcor."
    - "Juízes monta o cenário: “todos os midianitas, os amalequitas e os povos do oriente se reuniram; atravessaram e acamparam no vale de Jezreel”; “Então Jerubaal, que é Gideão, e todo o povo que estava com ele, levantaram-se de madrugada e acamparam junto à fonte de Harode. O acampamento de Midiã estava ao norte deles, perto da colina de Moré, no vale.” Os saqueadores “estavam espalhados pelo vale, numerosos como gafanhotos; e os seus camelos eram inumeráveis”. Quando soaram as trombetas, “o SENHOR virou a espada de cada homem contra o seu companheiro e contra todo o exército; e o exército fugiu até Bete-Sita, em direção a Zererá, até a fronteira de Abel-Meolá”; “Gideão chegou ao Jordão e o atravessou, ele e os trezentos homens que estavam com ele, exaustos, mas ainda perseguindo o inimigo.”"
    - "Os midianitas eram nômades de camelos dos desertos a leste e ao sul da terra, e costuma-se ver aqui o primeiro quadro, na Bíblia, de saqueadores montados em camelos; vinham na colheita para despojar os campos, e por isso Gideão malhava o trigo no lagar, para escondê-lo. O vale de Jezreel, a ampla planície entre a Galileia e os montes de Samaria, é a entrada natural vinda dos vaus do Jordão em Bete-Seã. A data é incerta, como a de todos os juízes; o ano convencional no mapa é cerca de 1150 a.C. A fonte de Harode manteve a fama: o exército de Saul provavelmente acampou aqui antes de Gilboa, e aqui, em Ain Jalut, em 1260, os mamelucos do Egito derrotaram os mongóis."
  de:
    - "Am östlichen Ende der Jesreel-Ebene im Norden des heutigen Israel. Gideons Männer lagerten an der Quelle Harod, Ain Dschalud am Fuß des Gilboa, 3 km östlich von Jesreel und 15 km westlich von Bet-Schean; die Midianiter lagen jenseits des Tals im Norden beim Hügel More, Giwat ha-More, etwa 8 km entfernt. Die Karte setzt Gideons Heimat Ofra 9 km westlich bei Afula an, doch die Stätte ist umstritten. Der nächtliche Angriff der dreihundert trieb den Feind das Tal hinab Richtung Jordan, nach Bet-Schitta 5 km entfernt und Abel-Mehola 27 km entfernt am Fluss, und Gideon verfolgte ihn über den Jordan weit in die Wüste bis Karkor."
    - "Das Buch der Richter stellt die Szene: „alle Midianiter und Amalekiter und die aus dem Morgenland sich zuhauf versammelt hatten und zogen herüber und lagerten sich im Grunde Jesreel“; „Da machte sich Jerubbaal, das ist Gideon, früh auf und alles Volk, das mit ihm war, und lagerten sich an den Brunnen Harod, daß er das Heer der Midianiter hatte gegen Mitternacht von dem Hügel More im Grund.“ Die Räuber „hatten sich niedergelegt im Grunde wie eine große Menge Heuschrecken; und ihre Kamele waren nicht zu zählen“. Als die Posaunen erschallten, „schaffte der HERR, daß sie im ganzen Heer eines jeglichen Schwert wider den andern war. Und das Heer floh bis Beth-Sitta gen Zereda, bis an die Grenze von Abel-Mehola“; „Da nun Gideon an den Jordan kam, ging er hinüber mit den dreihundert Mann, die bei ihm waren; die waren müde und jagten nach.“"
    - "Die Midianiter waren Kamelnomaden aus den Wüsten östlich und südlich des Landes, und dies gilt oft als das erste Bild in der Bibel von Räubern auf Kamelen; sie kamen zur Erntezeit, um die Felder zu plündern, weshalb Gideon Weizen in der Kelter drosch, um ihn zu verbergen. Die Jesreel-Ebene, die weite Fläche zwischen Galiläa und dem Bergland Samarias, ist der natürliche Zugang von den Jordanfurten bei Bet-Schean. Das Datum ist unsicher wie bei allen Richtern; das herkömmliche Jahr der Karte ist etwa 1150 v. Chr. Die Quelle Harod behielt ihren Ruf: Sauls Heer lagerte hier wahrscheinlich vor dem Gilboa, und hier bei Ain Dschalut besiegten 1260 die Mamluken Ägyptens die Mongolen."
  fr:
    - "À l’extrémité orientale de la plaine de Jizreel, dans le nord de l’Israël actuel. Les hommes de Gédéon campèrent à la source de Harod, Aïn Jalud, au pied du mont Guilboa, à 3 km à l’est de Jizreel et à 15 km à l’ouest de Beth-Schean ; les Madianites étaient de l’autre côté de la vallée, au nord, près de la colline de Moré, Givat HaMoré, à environ 8 km. La carte place Ophra, patrie de Gédéon, à 9 km à l’ouest, à Afoula, bien que le site soit discuté. L’attaque de nuit des trois cents mit l’ennemi en fuite le long de la vallée vers le Jourdain, jusqu’à Beth-Schitta à 5 km et Abel-Mehola à 27 km, sur le fleuve, et Gédéon les poursuivit au-delà du Jourdain, loin dans le désert, jusqu’à Karkor."
    - "Les Juges plantent le décor : « Tout Madian, Amalek et les fils de l’Orient, se rassemblèrent ; ils passèrent le Jourdain, et campèrent dans la vallée de Jizréel » ; « Jerubbaal, qui est Gédéon, et tout le peuple qui était avec lui, se levèrent de bon matin, et campèrent près de la source de Harod. Le camp de Madian était au nord de Gédéon, vers la colline de Moré, dans la vallée. » Les pillards « étaient répandus dans la vallée comme une multitude de sauterelles, et leurs chameaux étaient innombrables ». Aux trompettes, « l’Éternel leur fit tourner l’épée les uns contre les autres. Le camp s’enfuit jusqu’à Beth-Schitta vers Tseréra, jusqu’au bord d’Abel-Mehola » ; « Gédéon arriva au Jourdain, et il le passa, lui et les trois cents hommes qui étaient avec lui, fatigués, mais poursuivant toujours »."
    - "Les Madianites étaient des nomades à chameaux venus des déserts à l’est et au sud du pays, et l’on y voit souvent la première image biblique de pillards montés sur des chameaux ; ils venaient à la moisson dépouiller les champs, ce qui explique que Gédéon battît le blé dans un pressoir pour le cacher. La vallée de Jizreel, large plaine entre la Galilée et les collines de Samarie, est la voie d’accès naturelle depuis les gués du Jourdain à Beth-Schean. La date est incertaine, comme pour tous les juges ; l’année conventionnelle de la carte est vers 1150 av. J.-C. La source de Harod garda sa renommée : l’armée de Saül campa probablement ici avant Guilboa, et c’est ici, à Aïn Jalut, qu’en 1260 les Mamelouks d’Égypte battirent les Mongols."
  pl:
    - "Na wschodnim krańcu Doliny Jizreel, na północy dzisiejszego Izraela. Ludzie Gedeona obozowali przy źródle Charod, Ajn Dżalud u stóp Góry Gilboa, 3 km na wschód od Jizreel i 15 km na zachód od Bet-Szean; Madianici leżeli po drugiej stronie doliny na północy, przy wzgórzu More, Givat HaMore, w odległości około 8 km. Mapa umieszcza dom Gedeona, Ofrę, 9 km na zachód w Afuli, choć miejsce jest sporne. Nocny atak trzystu zmusił wroga do ucieczki w dół doliny ku Jordanowi, do Bet-Szitta, 5 km dalej, i Abel-Mechola, 27 km dalej nad rzeką, a Gedeon ścigał ich za Jordanem daleko na pustynię, do Karkor."
    - "Księga Sędziów kreśli scenę: „Tedy wszyscy Madyjanitowie, i Amalekitowie, i ludzie od wschodu słońca zebrali się wespół, a przeprawiwszy się przez Jordan, położyli się obozem w dolinie Jezreel”; „Wstał tedy bardzo rano Jerobaal, który jest Giedeon, i wszystek lud, który był z nim, i położyli się obozem u źródła Harod, a obóz Madyjański był im na północy od pagórka More w dolinie.” Najeźdźcy „leżeli w dolinie, jako szarańcza przemnóstwo, i wielbłądów ich nie było liczby”. Gdy zabrzmiały trąby, „obrócił Pan miecz jednego przeciw drugiemu we wszystkim obozie; a tak uciekło wojsko aż do Betseta w Sererat, aż do granicy Abelmehola w Tabbat”; „A gdy przyszedł Giedeon do Jordanu, przeprawił się przezeń sam, i trzy sta mężów, którzy z nim byli spracowani w pogoni.”"
    - "Madianici byli koczownikami na wielbłądach z pustyń na wschód i południe od kraju i często nazywa się to pierwszym w Biblii obrazem najeźdźców na wielbłądach; przychodzili w czasie żniw, aby ogołocić pola, dlatego Gedeon młócił pszenicę w tłoczni, by ją ukryć. Dolina Jizreel, szeroka równina między Galileą a wzgórzami Samarii, jest naturalną drogą wejścia od brodów Jordanu pod Bet-Szean. Data jest niepewna, jak wszystkich sędziów; umowny rok mapy to około 1150 p.n.e. Źródło Charod zachowało sławę: armia Saula prawdopodobnie obozowała tu przed Gilboa, a tu pod Ajn Dżalut w 1260 mamelucy z Egiptu pokonali Mongołów."
  it:
    - "All’estremità orientale della valle di Izreel, nel nord dell’Israele odierno. Gli uomini di Gedeone si accamparono alla sorgente di Carod, Ain Jalud ai piedi del Monte Gelboe, a 3 km a est di Izreel e a 15 km a ovest di Beth-Shean; i Madianiti stavano dall’altra parte della valle, a nord, presso il colle di Morè, Givat HaMoreh, a circa 8 km. La mappa pone la patria di Gedeone, Ofra, a 9 km a ovest, ad Afula, benché il sito sia discusso. L’attacco notturno dei trecento mise in fuga il nemico lungo la valle verso il Giordano, fino a Bet-Sitta, a 5 km, e ad Abel-Mecolà, a 27 km sul fiume, e Gedeone li inseguì oltre il Giordano, nel profondo del deserto, fino a Karkor."
    - "I Giudici descrivono la scena: «tutti i Madianiti, gli Amalekiti e i figliuoli dell’oriente si radunarono, passarono il Giordano, e si accamparono nella valle di Izreel»; «Ierubbaal dunque, vale a dire Gedeone, con tutta la gente ch’era con lui, levatosi la mattina di buon’ora, si accampò presso la sorgente di Harod. Il campo di Madian era al nord di quello di Gedeone, verso la collina di Moreh, nella valle». I predoni «erano sparsi nella valle come una moltitudine di locuste, e i loro cammelli erano innumerevoli». Quando suonarono le trombe, «l’Eterno fece volger la spada di ciascuno contro il compagno, per tutto il campo. E il campo fuggì fino a Beth-Scittah, verso Tserera, sino all’orlo d’Abel-Meholah presso Tabbath»; «Gedeone arrivò al Giordano, e lo passò con i trecento uomini ch’erano con lui; i quali, benché stanchi, continuavano a inseguire il nemico»."
    - "I Madianiti erano nomadi dei cammelli dei deserti a est e a sud del paese, e questa è spesso detta la prima immagine nella Bibbia di predoni a dorso di cammello; venivano al tempo del raccolto per spogliare i campi, ed è per questo che Gedeone batteva il grano in uno strettoio per nasconderlo. La valle di Izreel, l’ampia pianura tra la Galilea e i monti della Samaria, è la via d’accesso naturale dai guadi del Giordano a Beth-Shean. La data è incerta, come per tutti i giudici; l’anno convenzionale della mappa è circa il 1150 a.C. La sorgente di Carod mantenne la sua fama: l’esercito di Saul probabilmente si accampò qui prima del Gelboe, e qui ad Ain Jalut nel 1260 i Mamelucchi d’Egitto sconfissero i Mongoli."
  nl:
    - "Aan het oostelijke einde van de vallei van Jizreël, in het noorden van het huidige Israël. Gideons mannen legerden zich bij de bron van Charod, Ain Jalud aan de voet van de Gilboa, 3 km ten oosten van Jizreël en 15 km ten westen van Beth-Sean; de Midianieten lagen aan de overkant van de vallei in het noorden bij de heuvel More, Givat HaMoreh, ongeveer 8 km verderop. De kaart plaatst Gideons woonplaats, Ofra, 9 km naar het westen bij Afula, al is de plaats omstreden. De nachtelijke aanval van de driehonderd joeg de vijand op de vlucht langs de vallei naar de Jordaan, naar Beth-Sitta op 5 km en Abel-Mehola op 27 km aan de rivier, en Gideon achtervolgde hen over de Jordaan ver de woestijn in, tot Karkor."
    - "Richteren schetst het toneel: “Alle Midianieten nu, en Amalekieten, en de kinderen van het oosten, waren samenvergaderd, en zij trokken over, en legerden zich in het dal van Jizreel”; “Toen stond Jerubbaal (dewelke is Gideon) vroeg op, en al het volk, dat met hem was; en zij legerden zich aan de fontein van Harod; dat hij het heirleger der Midianieten had tegen het noorden, achter den heuvel More, in het dal.” De plunderaars “lagen in het dal, gelijk sprinkhanen in menigte, en hun kemelen waren ontelbaar”. Toen de bazuinen klonken, “zette de HEERE het zwaard des een tegen den anderen, en dat in het ganse leger; en het leger vluchtte tot Beth-Sitta toe naar Tseredath, tot aan de grens van Abel-Mehola”; “Als nu Gideon gekomen was aan de Jordaan, ging hij over, met de driehonderd mannen, die bij hem waren, zijnde moede, nochtans vervolgende.”"
    - "De Midianieten waren kameelnomaden uit de woestijnen ten oosten en zuiden van het land, en dit wordt vaak het eerste beeld in de Bijbel genoemd van plunderaars te kameel; zij kwamen met de oogst om de velden kaal te plukken, en daarom dorste Gideon tarwe in een wijnpers om die te verbergen. De vallei van Jizreël, de brede vlakte tussen Galilea en het bergland van Samaria, is de natuurlijke toegang vanaf de Jordaanfurten bij Beth-Sean. De datum is onzeker, zoals die van alle richters; het conventionele jaar van de kaart is omstreeks 1150 v.Chr. De bron van Charod behield haar faam: het leger van Saul legerde zich hier waarschijnlijk vóór de Gilboa, en hier bij Ain Jalut versloegen in 1260 de Mamelukken van Egypte de Mongolen."
  cs:
    - "Na východním konci Jizreelského údolí, na severu dnešního Izraele. Gedeonovi muži se utábořili u pramene Charod, Ajn Džalúd, na úpatí hory Gilboa, 3 km východně od Jizreele a 15 km západně od Bét-šanu; Midjánci leželi přes údolí na severu u pahorku Móre, Giv'at ha-Móre, asi 8 km vzdáleni. Mapa klade Gedeonův domov, Ofru, 9 km na západ do Afuly, ač místo je sporné. Noční útok tří set mužů obrátil nepřítele na útěk údolím k Jordánu, do Bét-šity vzdálené 5 km a Ábel-mecholy vzdálené 27 km na řece, a Gedeon je pronásledoval přes Jordán hluboko do pouště, až ke Karkoru."
    - "Kniha soudců vykresluje scénu: „všickni Madianští a Amalechitští a národové východní shromáždili se spolu, a přešedše Jordán, položili se v údolí Jezreel“; „Tedy vstav ráno Jerobál, (jenž jest Gedeon), i všecken lid, kterýž byl s ním, položili se při studnici Charod, vojska pak Madianských byla jim na půlnoci před vrchem More v údolí.“ Nájezdníci „leželi v údolí, jako kobylky u velikém množství, ani velbloudů jejich počtu nebylo“. Když zatroubily trouby, „obrátil Hospodin meč jednoho proti druhému, a to po všem ležení. Utíkalo tedy vojsko až k Betseta do Zererat, a až ku pomezí Abelmehula u Tebat“; „když pak přišel Gedeon k Jordánu, přešel jej, a tři sta mužů, kteříž byli s ním, ustalí, honíce nepřátely“."
    - "Midjánci byli velbloudí nomádi z pouští na východě a jihu země a toto je často označováno za první obraz v Bibli nájezdníků na velbloudech; přicházeli v době žní obírat pole, a proto Gedeon mlátil pšenici v lisu, aby ji ukryl. Jizreelské údolí, široká rovina mezi Galileou a samařskými horami, je přirozenou cestou dovnitř od jordánských brodů u Bét-šanu. Datum je nejisté, jako u všech soudců; smluvní rok na mapě je asi 1150 př. n. l. Pramen Charod si uchoval slávu: Saulovo vojsko se tu před Gilboou pravděpodobně utábořilo a tady u Ajn Džalútu roku 1260 egyptští mamlúkové porazili Mongoly."
  sv:
    - "I östra änden av Jisreeldalen, i norra delen av dagens Israel. Gideons män lägrade sig vid Harodskällan, Ain Jalud vid foten av Gilboa, 3 km öster om Jisreel och 15 km väster om Bet-Shean; midjaniterna låg tvärs över dalen i norr vid kullen More, Givat HaMoreh, omkring 8 km bort. Kartan placerar Gideons hem, Ofra, 9 km västerut vid Afula, fast platsen är omstridd. Nattanfallet av de tre hundra fick fienden att fly nedför dalen mot Jordan, till Bet-Hashitta 5 km bort och Avel-Mehola 27 km bort vid floden, och Gideon förföljde dem över Jordan långt in i öknen, till Karkor."
    - "Domarboken ger bakgrunden: ”midjaniterna, amalekiterna och österlänningarna hade alla tillhopa församlat sig och gått över floden och lägrat sig i Jisreels dal”; ”drog Jerubbaal, det är Gideon, åstad med allt folket som följde honom, och de lägrade sig vid Harodskällan; han hade då midjaniternas läger norr om sig, från Morehöjden ned i dalen.” Plundrarna ”lågo där i dalen, talrika såsom gräshoppor; och deras kameler voro oräkneliga”. När man stötte i basunerna ”vände HERREN den enes svärd mot den andre i hela lägret; och de som voro i lägret flydde ända till Bet-Hasitta, åt Serera till, ända till stranden vid Abel-Mehola”; ”När sedan Gideon kom till Jordan, gick han över jämte de tre hundra män som han hade med sig; och de voro trötta av förföljandet.”"
    - "Midjaniterna var kamelnomader från öknarna öster och söder om landet, och detta kallas ofta Bibelns första bild av plundrare på kamelrygg; de kom vid skörden för att tömma fälten, och därför tröskade Gideon vete i en vinpress för att gömma det. Jisreeldalen, den breda slätten mellan Galileen och Samarias berg, är den naturliga vägen in från Jordans vadställen vid Bet-Shean. Dateringen är osäker, liksom för alla domarna; kartans konventionella år är omkring 1150 f.Kr. Harodskällan behöll sin berömmelse: Sauls här lägrade sig sannolikt här före Gilboa, och här vid Ain Jalut besegrade Egyptens mamluker mongolerna år 1260."
  nb:
    - "I den østlige enden av Jisreel-dalen, i nord i dagens Israel. Gideons menn slo leir ved Harod-kilden, Ain Jalud ved foten av Gilboa, 3 km øst for Jisreel og 15 km vest for Bet-Sjean; midianittene lå på tvers av dalen mot nord ved høyden More, Givat HaMoreh, omtrent 8 km unna. Kartet plasserer Gideons hjem, Ofra, 9 km mot vest ved Afula, selv om stedet er omstridt. Nattangrepet fra de tre hundre fikk fienden til å flykte nedover dalen mot Jordan, til Bet-Sjitta 5 km unna og Abel-Mehola 27 km unna ved elven, og Gideon forfulgte dem over Jordan langt inn i ørkenen, til Karkor."
    - "Dommerboken setter scenen: «alle midianittene og amalekittene og Østens barn slo sig sammen og drog over Jordan, og de leiret sig i Jisre'el-dalen»; «Og Jerubba'al, det er Gideon, og alt folket som var med ham, tok tidlig ut og leiret sig ved Harodkilden; men midianittenes leir lå nordenfor, fra More-høiden og ned i dalen.» Raiderne «lå der i dalen så tett som gresshopper, og det var ikke tall på deres kameler». Da basunene lød, heter det at «Herren vendte den enes sverd imot den andre i hele leiren; og de som var i leiren, flyktet til Bet-Hasitta bortimot Serera, til elvebredden ved Abel-Mehola»; «Gideon kom til Jordan og gikk over, han og de tre hundre mann som var med ham, trette som de var blitt ved å forfølge fienden.»"
    - "Midianittene var kamelnomader fra ørkenene øst og sør for landet, og dette kalles ofte Bibelens første bilde av raidere på kamelrygg; de kom ved innhøstingen for å tømme markene, og derfor tresket Gideon hvete i en vinpresse for å skjule den. Jisreel-dalen, den brede sletten mellom Galilea og Samarias høyland, er den naturlige veien inn fra Jordan-vadene ved Bet-Sjean. Dateringen er usikker, som for alle dommerne; kartets konvensjonelle år er omkring 1150 f.Kr. Harod-kilden beholdt sitt rykte: Sauls hær slo trolig leir her før Gilboa, og her ved Ain Jalut slo mamelukkene fra Egypt mongolene i 1260."
  tl:
    - "Sa silangang dulo ng libis ng Jezreel, sa hilaga ng Israel ngayon. Nagkampo ang mga tauhan ni Gedeon sa bukal ng Harod, Ain Jalud sa paanan ng Bundok Gilboa, 3 km sa silangan ng Jezreel at 15 km sa kanluran ng Beth-san; ang mga Madianita ay nasa kabila ng libis sa hilaga sa burol ng Moreh, Givat HaMoreh, mga 8 km ang layo. Inilalagay ng mapa ang tahanan ni Gedeon, ang Ophra, 9 km sa kanluran sa Afula, bagaman pinagtatalunan ang pook. Ang pag-atake sa gabi ng tatlong daan ay nagpatakas sa kaaway pababa sa libis patungong Jordan, sa Beth-sitta 5 km ang layo at Abelmehola 27 km ang layo sa ilog, at hinabol sila ni Gedeon sa kabila ng Jordan hanggang sa disyerto, sa Carcor."
    - "Inihahanda ng Mga Hukom ang tagpo: “lahat ng mga Madianita, at mga Amalecita at mga anak sa silanganan ay nagpulong; at sila'y nagtuloy at humantong sa libis ng Jezreel”; “si Jerobaal na siyang Gedeon, at ang buong bayan na kasama niya ay bumangong maaga, at humantong sa bukal ng Harod: at ang kampamento ng Madian ay nasa dakong hilagaan nila, sa dako roon ng Moreh, sa libis”. Ang mga mananalakay ay “nalalatag sa libis na parang balang dahil sa karamihan; at ang kanilang mga kamelyo ay walang bilang”. Nang tumunog ang mga pakakak, “inilagay ng Panginoon ang tabak ng bawa't isa laban sa kaniyang kasama, at laban sa buong hukbo: at tumakas ang hukbo hanggang sa Beth-sitta sa dakong Cerera, hanggang sa hangganan ni Abelmehola”; “si Gedeon ay dumating sa Jordan, at siya'y tumawid, siya, at ang tatlong daang lalake na mga kasama niya, mga pagod na, ay humahabol pa.”"
    - "Ang mga Madianita ay mga nomadang kamelyo mula sa mga disyerto sa silangan at timog ng lupain, at madalas na tinatawag itong unang larawan sa Biblia ng mga mananalakay na nakasakay sa kamelyo; dumating sila sa anihan upang hubaran ang mga bukid, kaya gumigiik si Gedeon ng trigo sa pisaan ng ubas upang itago ito. Ang libis ng Jezreel, ang malawak na kapatagan sa pagitan ng Galilea at ng mga burol ng Samaria, ang likas na daan mula sa mga tawiran ng Jordan sa Beth-san. Hindi tiyak ang petsa, gaya ng lahat ng hukom; ang kombensiyonal na taon ng mapa ay mga 1150 BK. Nanatili ang katanyagan ng bukal ng Harod: marahil nagkampo rito ang hukbo ni Saul bago ang Gilboa, at dito sa Ain Jalut noong 1260 tinalo ng mga Mamluk ng Egipto ang mga Mongol."
