id: where-was-thyatira
question:
  en: "Where was Thyatira, Lydia's home town?"
  ru: "Где находилась Фиатира, родной город Лидии?"
  uk: "Де була Тіатира, рідне місто Лідії?"
  es: "¿Dónde estaba Tiatira, la ciudad natal de Lidia?"
  pt: "Onde ficava Tiatira, a cidade natal de Lídia?"
  de: "Wo lag Thyatira, die Heimatstadt der Lydia?"
  fr: "Où se trouvait Thyatire, la ville natale de Lydie ?"
  pl: "Gdzie leżała Tiatyra, rodzinne miasto Lidii?"
  it: "Dov’era Tiatira, la città natale di Lidia?"
  cs: "Kde ležela Tyatira, rodné město Lydie?"
  nl: "Waar lag Thyatira, de woonplaats van Lydia?"
  sv: "Var låg Tyatira, Lydias hemstad?"
answer:
  en:
    - "Thyatira lay in the valley of the Lycus, a tributary of the Hermus, in the region of Lydia in western Asia Minor; the modern town of Akhisar in Turkey stands on the site, and the map point stands there. It was about 61 km from Pergamum and 51 km from Sardis in a straight line, on the road between them; Ephesus was 117 km to the south-west."
    - "Lydia met Paul far from home, at Philippi in Macedonia, some 380 km across the Aegean: “And a certain woman named Lydia, a seller of purple, of the city of Thyatira, which worshipped God, heard us: whose heart the Lord opened.” Her trade fits the city: inscriptions from Thyatira name more guilds than any other city of the province, among them the dyers, and one of the cloths dyed there was a red made from madder root rather than the sea-snail purple of Tyre. Thyatira was also one of the seven churches of Revelation, warned about “that woman Jezebel”; its church, Christ says, had works, love, service and faith."
    - "Strabo calls Thyatira a settlement of Macedonians, planted by the Seleucid kings early in the third century BC to guard the road; it had no acropolis and changed hands between the Seleucids and Pergamum before Rome took it with the rest of Attalus' kingdom in 133 BC. Little of the ancient city is visible under modern Akhisar beyond a stretch of colonnaded street and a basilica cleared in the town centre, so Lydia's city is known mostly from its inscriptions and coins."
  ru:
    - "Фиатира лежала в долине Лика, притока Герма, в области Лидия на западе Малой Азии; на этом месте стоит нынешний турецкий город Акхисар, где и поставлена точка карты. До Пергама отсюда около 61 км, до Сардиса 51 км по прямой — город стоял на дороге между ними; Ефес лежал в 117 км к юго-западу."
    - "Лидия встретила Павла далеко от дома — в македонских Филиппах, примерно в 380 км через Эгейское море: «И одна женщина из города Фиатир, именем Лидия, торговавшая багряницею, чтущая Бога, слушала; и Господь отверз сердце ее внимать тому, что говорил Павел». Её ремесло под стать городу: надписи из Фиатиры называют больше ремесленных товариществ, чем в любом другом городе провинции, среди них — красильщиков, и одной из здешних красок был красный цвет из корня марены, а не пурпур из морской улитки, как в Тире. Фиатира — и одна из семи церквей Откровения: её обличают за то, что она попускает «жене Иезавели» учить; у этой церкви, говорит Христос, есть дела, любовь, служение и вера."
    - "Страбон называет Фиатиру поселением македонян; её основали Селевкиды в начале III века до н. э., чтобы охранять дорогу; акрополя у города не было, и он переходил от Селевкидов к Пергаму, пока в 133 г. до н. э. Рим не получил его вместе с царством Аттала. Под нынешним Акхисаром от древнего города видно немного — отрезок улицы с колоннадой и базилика, расчищенные в центре, — так что город Лидии известен в основном по надписям и монетам."
  uk:
    - "Тіатира лежала в долині Ліка, притоки Герма, в області Лідія на заході Малої Азії; сучасне місто Ахісар у Туреччині стоїть на її місці, і точка на мапі стоїть там. Вона була приблизно за 61 км від Пергама і за 51 км від Сард по прямій, на дорозі між ними; Ефес лежав за 117 км на південний захід."
    - "Лідія зустріла Павла далеко від дому, у Філіппах у Македонії, приблизно за 380 км через Егейське море: «І слухала нас одна жінка, на ймя Лидия, купчиха кармазином, із города Тиятирського, що шанувала Бога; їй же Господь відчинив серце». Її ремесло пасує до міста: написи з Тіатири називають більше цехів, ніж будь-яке інше місто провінції, серед них фарбарів, а одна з тканин, що фарбувалися там, була червоною, виготовленою з коріння марени, а не з пурпуру морського молюска, як у Тірі. Тіатира була також однією із семи церков Одкровення, попереджена про жінку Єзавель; її церква, каже Христос, мала діла, любов, служіння і віру."
    - "Страбон називає Тіатиру поселенням македонців, заснованим царями Селевкідами на початку III ст. до н. е. для охорони дороги; в неї не було акрополя, і вона переходила між Селевкідами та Пергамом, поки Рим не взяв її разом з рештою царства Аттала 133 р. до н. е. Під сучасним Ахісаром мало що видно від давнього міста, окрім відрізка вулиці з колонадою і базиліки, розчищеної в центрі міста, тож місто Лідії відоме здебільшого з написів і монет."
  es:
    - "Tiatira se hallaba en el valle del Lico, afluente del Hermo, en la región de Lidia, en el oeste de Asia Menor; la población moderna de Akhisar, en Turquía, se alza sobre el yacimiento, y el punto del mapa está allí. Quedaba a unos 61 km de Pérgamo y a 51 km de Sardis en línea recta, en el camino entre ellas; Éfeso estaba a 117 km al suroeste."
    - "Lidia conoció a Pablo lejos de casa, en Filipos, en Macedonia, a unos 380 km a través del Egeo: «una mujer llamada Lidia, que vendía púrpura en la ciudad de Tiatira, temerosa de Dios, estaba oyendo; el corazón de la cual abrió el Señor para que estuviese atenta á lo que Pablo decía». Su oficio encaja con la ciudad: las inscripciones de Tiatira nombran más gremios que ninguna otra ciudad de la provincia, entre ellos el de los tintoreros, y una de las telas teñidas allí era un rojo hecho de raíz de rubia y no la púrpura de caracol marino de Tiro. Tiatira fue también una de las siete iglesias del Apocalipsis, advertida sobre «aquella mujer Jezabel»; su iglesia, dice Cristo, tenía obras, amor, servicio y fe."
    - "Estrabón llama a Tiatira una colonia de macedonios, fundada por los reyes seléucidas a principios del siglo III a. C. para guardar el camino; no tenía acrópolis y pasó de manos entre los seléucidas y Pérgamo antes de que Roma la tomara con el resto del reino de Átalo en 133 a. C. Poco de la ciudad antigua es visible bajo la actual Akhisar, aparte de un tramo de calle con columnata y una basílica despejada en el centro de la ciudad, de modo que la ciudad de Lidia se conoce sobre todo por sus inscripciones y monedas."
  pt:
    - "Tiatira ficava no vale do Lico, afluente do Hermo, na região da Lídia, no oeste da Ásia Menor; a atual cidade de Akhisar, na Turquia, está sobre o sítio, e o ponto do mapa fica ali. Ficava a cerca de 61 km de Pérgamo e 51 km de Sardes em linha reta, na estrada entre elas; Éfeso ficava a 117 km a sudoeste."
    - "Lídia encontrou Paulo longe de casa, em Filipos, na Macedônia, a uns 380 km através do Egeu: “Certa mulher chamada Lídia, vendedora de púrpura, da cidade de Tiatira, que adorava a Deus, nos ouvia. O Senhor abriu o seu coração.” Seu ofício combina com a cidade: inscrições de Tiatira nomeiam mais corporações do que qualquer outra cidade da província, entre elas as dos tintureiros, e um dos tecidos ali tingidos era um vermelho feito da raiz de ruiva, e não a púrpura do caracol-do-mar de Tiro. Tiatira foi também uma das sete igrejas do Apocalipse, advertida a respeito de “Jezabel, que se diz profetisa”; sua igreja, diz Cristo, tinha obras, amor, serviço e fé."
    - "Estrabão chama Tiatira de uma colônia de macedônios, plantada pelos reis selêucidas no início do século III a.C. para guardar a estrada; não tinha acrópole e passou das mãos dos selêucidas para as de Pérgamo antes de Roma tomá-la, com o resto do reino de Átalo, em 133 a.C. Pouco da cidade antiga é visível sob a moderna Akhisar, além de um trecho de rua com colunatas e uma basílica desobstruída no centro da cidade, de modo que a cidade de Lídia é conhecida sobretudo por suas inscrições e moedas."
  de:
    - "Thyatira lag im Tal des Lykos, eines Nebenflusses des Hermos, in der Landschaft Lydien im Westen Kleinasiens; die moderne Stadt Akhisar in der Türkei steht an der Stelle, und dort steht der Kartenpunkt. Es lag in der Luftlinie etwa 61 km von Pergamon und 51 km von Sardes, an der Straße zwischen beiden; Ephesus war 117 km südwestlich."
    - "Lydia traf Paulus fern der Heimat, in Philippi in Mazedonien, etwa 380 km jenseits der Ägäis: „Und ein gottesfürchtiges Weib mit Namen Lydia, eine Purpurkrämerin aus der Stadt der Thyathirer, hörte zu; dieser tat der HERR das Herz auf.“ Ihr Gewerbe passt zur Stadt: Inschriften aus Thyatira nennen mehr Zünfte als jede andere Stadt der Provinz, darunter die Färber, und eines der dort gefärbten Tücher war ein Rot aus Krappwurzel statt des Meeresschnecken-Purpurs von Tyrus. Thyatira war auch eine der sieben Gemeinden der Offenbarung, getadelt, weil es „das Weib Isebel“ lehren lasse; seine Gemeinde, sagt Christus, habe Werke, Liebe, Dienst und Glauben."
    - "Strabon nennt Thyatira eine Siedlung von Mazedoniern, von den Seleukidenkönigen Anfang des 3. Jahrhunderts v. Chr. zum Schutz der Straße angelegt; es hatte keine Akropolis und wechselte zwischen Seleukiden und Pergamon, bevor Rom es 133 v. Chr. mit dem übrigen Königreich des Attalos nahm. Von der antiken Stadt ist unter dem modernen Akhisar wenig sichtbar außer einem Stück Säulenstraße und einer im Stadtzentrum freigelegten Basilika, sodass die Stadt der Lydia vor allem aus Inschriften und Münzen bekannt ist."
  fr:
    - "Thyatire se trouvait dans la vallée du Lycos, affluent de l’Hermos, dans la région de Lydie, dans l’ouest de l’Asie Mineure ; la ville moderne d’Akhisar, en Turquie, s’élève sur le site, et le point de la carte s’y trouve. Elle était à environ 61 km de Pergame et à 51 km de Sardes à vol d’oiseau, sur la route qui les relie ; Éphèse était à 117 km au sud-ouest."
    - "Lydie rencontra Paul loin de chez elle, à Philippes en Macédoine, à quelque 380 km de l’autre côté de la mer Égée : « L’une d’elles, nommée Lydie, marchande de pourpre, de la ville de Thyatire, était une femme craignant Dieu, et elle écoutait. Le Seigneur lui ouvrit le cœur. » Son métier convient à la ville : des inscriptions de Thyatire nomment plus de corporations que toute autre ville de la province, parmi lesquelles les teinturiers, et l’une des étoffes qu’on y teignait était un rouge tiré de la racine de garance plutôt que la pourpre du murex de Tyr. Thyatire fut aussi l’une des sept Églises de l’Apocalypse, avertie au sujet de « la femme Jézabel » ; son Église, dit le Christ, avait des œuvres, de l’amour, du service et de la foi."
    - "Strabon appelle Thyatire une colonie de Macédoniens, établie par les rois séleucides au début du IIIe siècle av. J.-C. pour garder la route ; elle n’avait pas d’acropole et passa tour à tour des Séleucides à Pergame avant que Rome ne la prenne avec le reste du royaume d’Attale en 133 av. J.-C. Peu de la ville antique est visible sous Akhisar moderne, hormis un tronçon de rue à colonnades et une basilique dégagés au centre de la ville, de sorte que la ville de Lydie est connue surtout par ses inscriptions et ses monnaies."
  pl:
    - "Tiatyra leżała w dolinie Likosu, dopływu Hermosu, w krainie Lidii w zachodniej Azji Mniejszej; na tym miejscu stoi współczesne miasto Akhisar w Turcji i tam stoi punkt na mapie. Było oddalone o około 61 km od Pergamonu i 51 km od Sardes w linii prostej, przy drodze między nimi; Efez leżał 117 km na południowy zachód."
    - "Lidia spotkała Pawła daleko od domu, w Filippi w Macedonii, około 380 km za Morzem Egejskim: „A niektóra niewiasta, imieniem Lidyja, która szarłat sprzedawała w mieście Tyjatyrskiem, Boga się bojąca, słuchała; której Pan otworzył serce”. Jej rzemiosło pasuje do miasta: napisy z Tiatyry wymieniają więcej cechów niż jakiekolwiek inne miasto prowincji, wśród nich farbiarzy, a jednym z barwionych tam materiałów była czerwień z korzenia marzany, a nie purpura z morskich ślimaków z Tyru. Tiatyra była też jednym z siedmiu zborów Apokalipsy, któremu zarzucono, że „niewieście Jezabeli, która się mieni być prorokinią, dopuszczasz uczyć i zwodzić sługi moje”; ten zbór, mówi Chrystus, miał uczynki, miłość, posługi i wiarę."
    - "Strabon nazywa Tiatyrę osadą Macedończyków, założoną przez królów Seleucydów na początku III wieku p.n.e. dla strzeżenia drogi; nie miała akropolu i przechodziła z rąk do rąk między Seleucydami a Pergamonem, zanim Rzym wziął ją wraz z resztą królestwa Attalosa w 133 p.n.e. Niewiele starożytnego miasta widać pod dzisiejszym Akhisarem poza odcinkiem ulicy z kolumnadami i bazyliką odkopaną w centrum miasta, więc miasto Lidii znamy głównie z napisów i monet."
  it:
    - "Tiatira sorgeva nella valle del Lico, un affluente dell’Ermo, nella regione della Lidia nell’Asia Minore occidentale; la città moderna di Akhisar in Turchia sorge sul sito, e il punto della mappa si trova lì. Distava circa 61 km da Pergamo e 51 km da Sardi in linea d’aria, sulla strada tra le due; Efeso era a 117 km a sud-ovest."
    - "Lidia incontrò Paolo lontano da casa, a Filippi in Macedonia, a circa 380 km attraverso l’Egeo: «una certa donna, di nome Lidia, negoziante di porpora, della città di Tiatiri, che temeva Dio, ci stava ad ascoltare; e il Signore le aprì il cuore». Il suo mestiere si adatta alla città: iscrizioni di Tiatira nominano più corporazioni di qualsiasi altra città della provincia, tra cui i tintori, e uno dei tessuti tinti lì era un rosso ricavato dalla radice di robbia anziché la porpora di chiocciola marina di Tiro. Tiatira era anche una delle sette chiese dell’Apocalisse, ammonita riguardo a «quella donna Jezabel»; la sua chiesa, dice Cristo, aveva opere, amore, servizio e fede."
    - "Strabone chiama Tiatira un insediamento di Macedoni, fondato dai re seleucidi all’inizio del III secolo a.C. per sorvegliare la strada; non aveva acropoli e passò più volte di mano tra i Seleucidi e Pergamo prima che Roma la prendesse con il resto del regno di Attalo nel 133 a.C. Poco dell’antica città è visibile sotto l’odierna Akhisar, oltre a un tratto di strada colonnata e a una basilica portata alla luce nel centro, così che la città di Lidia è nota soprattutto dalle sue iscrizioni e dalle monete."
  cs:
    - "Tyatira ležela v údolí Lykosu, přítoku Herma, v kraji Lýdie v západní Malé Asii; na místě stojí dnešní město Akhisar v Turecku a bod na mapě stojí tam. Byla vzdušnou čarou asi 61 km od Pergamonu a 51 km od Sard na cestě mezi nimi; Efez byl 117 km jihozápadně."
    - "Lydie potkala Pavla daleko od domova, ve Filipech v Makedonii, asi 380 km přes Egejské moře: „Jedna pak žena, jménem Lydia, kteráž šarlaty prodávala v městě Tyatirských, bohabojící, poslouchala nás. Jejížto srdce otevřel Pán.“ Její řemeslo městu odpovídá: nápisy z Tyatiry jmenují více cechů než kterékoli jiné město provincie, mezi nimi barvíře, a jednou z tkanin barvených v městě byla červeň z kořene mořeny, nikoli purpur z mořského plže z Týru. Tyatira byla též jednou ze sedmi církví Zjevení, varovaná, že „dopouštíš ženě Jezábel, kteráž se býti praví prorokyní“; její církev, praví Kristus, měla skutky, lásku, službu a víru."
    - "Strabón nazývá Tyatiru osadou Makedonců, založenou seleukovskými králi počátkem 3. století př. n. l. na ochranu cesty; neměla akropoli a přecházela mezi Seleukovci a Pergamonem, než ji Řím s ostatkem Attalova království roku 133 př. n. l. získal. Z antického města je pod moderním Akhisarem viditelný jen úsek ulice se sloupořadím a bazilika odkrytá ve středu města, takže město Lydie je známo hlavně z nápisů a mincí."
  nl:
    - "Thyatira lag in het dal van de Lycus, een zijrivier van de Hermus, in de streek Lydië in het westen van Klein-Azië; de moderne stad Akhisar in Turkije staat op de plaats, en het punt op de kaart staat daar. Het lag hemelsbreed ongeveer 61 km van Pergamum en 51 km van Sardes, aan de weg ertussen; Efeze lag 117 km naar het zuidwesten."
    - "Lydia ontmoette Paulus ver van huis, te Filippi in Macedonië, zo'n 380 km over de Egeïsche Zee: “En een zekere vrouw, met name Lydia, een purperverkoopster, van de stad Thyatira, die God diende, hoorde ons; welker hart de Heere heeft geopend.” Haar beroep past bij de stad: inscripties uit Thyatira noemen meer gilden dan in enige andere stad van de provincie, onder meer de verwers, en een van de stoffen die er werden geverfd was een rood gemaakt van meekrapwortel in plaats van het zeeslakkenpurper van Tyrus. Thyatira was ook een van de zeven gemeenten van de Openbaring, gewaarschuwd voor “de vrouw Jezabel”; zijn gemeente, zegt Christus, had werken, liefde, dienst en geloof."
    - "Strabo noemt Thyatira een nederzetting van Macedoniërs, door de Seleucidische koningen vroeg in de derde eeuw v.Chr. gesticht om de weg te bewaken; het had geen akropolis en wisselde van eigenaar tussen de Seleuciden en Pergamum voordat Rome het met de rest van het koninkrijk van Attalus in 133 v.Chr. overnam. Weinig van de oude stad is zichtbaar onder het moderne Akhisar, behalve een stuk zuilenstraat en een basiliek die in het stadscentrum is blootgelegd, zodat de stad van Lydia vooral bekend is uit haar inscripties en munten."
  sv:
    - "Tyatira låg i Lykosdalen, en biflod till Hermos, i landskapet Lydien i västra Mindre Asien; den moderna staden Akhisar i Turkiet står på platsen, och kartpunkten står där. Den låg omkring 61 km från Pergamon och 51 km från Sardes i fågelvägen, på vägen mellan dem; Efesos låg 117 km åt sydväst."
    - "Lydia träffade Paulus långt hemifrån, i Filippi i Makedonien, omkring 380 km tvärs över Egeiska havet: ”Och en kvinna som ’fruktade Gud’, en purpurkrämerska från staden Tyatira, vid namn Lydia, lyssnade till samtalet; och Herren öppnade hennes hjärta”. Hennes yrke passar staden: inskriptioner från Tyatira nämner fler skrån än någon annan stad i provinsen, bland dem färgarna, och ett av tygerna som färgades där var ett rött från krappröt snarare än snäckpurpuren från Tyros. Tyatira var också en av Uppenbarelsebokens sju församlingar, varnad för ”kvinnan Jesabel”; dess församling, säger Kristus, hade gärningar, kärlek, tjänst och tro."
    - "Strabon kallar Tyatira en bosättning av makedonier, anlagd av de seleukidiska kungarna i början av 200-talet f.Kr. för att vakta vägen; den hade ingen akropolis och bytte händer mellan seleukiderna och Pergamon innan Rom tog den tillsammans med resten av Attalos’ rike år 133 f.Kr. Lite av den antika staden syns under dagens Akhisar, förutom en sträcka av kolonnadgata och en basilika som röjts i stadens centrum, så Lydias stad är mest känd från sina inskriptioner och mynt."
