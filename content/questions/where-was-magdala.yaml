id: where-was-magdala
question:
  en: "Where was Magdala, the town of Mary Magdalene?"
  ru: "Где находилась Магдала, родной город Марии Магдалины?"
  uk: "Де була Магдала, місто Марії Магдалини?"
  es: "¿Dónde estaba Magdala, la ciudad de María Magdalena?"
  pt: "Onde ficava Magdala, a cidade de Maria Madalena?"
  de: "Wo lag Magdala, die Stadt der Maria Magdalena?"
  fr: "Où se trouvait Magdala, la ville de Marie-Madeleine ?"
answer:
  en:
    - "Magdala lay on the western shore of the Sea of Galilee below the cliffs of Mount Arbel, where the Arab village of al-Majdal stood until 1948 and the excavated town can be visited today beside Migdal in Israel; the map point stands on it. It is about 7 km north of Tiberias and 8 km south-west of Capernaum in a straight line, at the southern edge of the plain of Gennesaret. Its name is the Aramaic for “tower”. Most scholars identify it with Taricheae, the fish-salting town of Josephus, though Pliny puts Taricheae at the south end of the lake, so the identification is not certain."
    - "The Gospels never describe an event in Magdala itself; the town is known through the woman named after it. Luke lists among those who followed Jesus “Mary called Magdalene, out of whom went seven devils”, with other women who ministered to him of their substance; she stood by the cross, and Mark says the risen Jesus “appeared first to Mary Magdalene”. After feeding the four thousand Jesus came, in the King James text, “into the coasts of Magdala”; many manuscripts read Magadan, and Mark has “the parts of Dalmanutha”, which has not been found. The later Western picture of Mary as a repentant harlot comes from a sermon of Gregory the Great in 591, which joined her with the sinful woman of Luke 7; the Gospels do not say so."
    - "Excavations since 2007, by the Franciscans and from 2009 by the Israel Antiquities Authority, have uncovered a prosperous lakeside town with a harbour, streets and small plastered pools that may have served the fish trade. Its synagogue of the first century AD, with painted walls and a mosaic floor, is one of the few in Galilee from Jesus' time; in it stood a carved stone, the Magdala stone, bearing one of the earliest known reliefs of the seven-branched menorah. Josephus tells how Titus took Taricheae in AD 67, and the synagogue quarter was abandoned at the time of the revolt."
  ru:
    - "Магдала лежала на западном берегу моря Галилейского, под скалами горы Арбел, где до 1948 г. стояло арабское селение аль-Мадждаль; сегодня раскопанный город можно увидеть рядом с израильским Мигдалем, и точка карты стоит на нём. Отсюда примерно 7 км до Тивериады к югу и 8 км до Капернаума к северо-востоку по прямой; город стоял у южного края Геннисаретской равнины. Его имя по-арамейски значит «башня». Большинство учёных отождествляет его с Тарихеей, городом солёной рыбы у Иосифа Флавия, но Плиний помещает Тарихею у южного конца озера, так что отождествление не бесспорно."
    - "Ни одного события в самой Магдале Евангелия не описывают; город известен благодаря женщине, названной по нему. Среди женщин, следовавших за Иисусом и служивших Ему имением своим, Лука называет первой ту, что дала имя городу: «Мария, называемая Магдалиною, из которой вышли семь бесов»; она стояла у креста, и, по Марку, воскресший Иисус «явился сперва Марии Магдалине». После насыщения четырёх тысяч Иисус, по Синодальному тексту, «прибыл в пределы Магдалинские»; во многих рукописях стоит Магадан, а у Марка — «пределы Далмануфские», которых не нашли. Западный образ Марии как раскаявшейся блудницы восходит к проповеди Григория Великого 591 г., соединившей её с грешницей из 7-й главы Луки; Евангелия этого не говорят."
    - "Раскопки францисканцев с 2007 г. и Управления древностей Израиля с 2009 г. открыли зажиточный приозёрный город с гаванью, улицами и небольшими оштукатуренными бассейнами, которые, возможно, служили рыбному промыслу. Его синагога I века н. э. с расписными стенами и мозаичным полом — одна из немногих в Галилее времён Иисуса; в ней стоял резной камень, так называемый камень из Магдалы, с одним из самых ранних известных рельефов семисвечника. Иосиф Флавий рассказывает, как Тит взял Тарихею в 67 г. н. э., а квартал синагоги был оставлен во время восстания."
  uk:
    - "Магдала лежала на західному березі Галілейського моря під скелями гори Арбель, де арабське село аль-Маджаль стояло до 1948 р., а розкопане місто можна відвідати нині поруч із Мігдалем в Ізраїлі; точка на мапі стоїть на ньому. Вона лежить приблизно за 7 км на північ від Тіверіади і за 8 км на південний захід від Капернаума по прямій, на південному краю Генісаретської рівнини. Її назва — арамейське слово «вежа». Більшість учених ототожнюють її з Тарихеєю, містом засолювання риби в Йосифа Флавія, хоча Пліній поміщає Тарихею на південному кінці озера, тож це ототожнення не є певним."
    - "Євангелія ніколи не описують подію в самій Магдалі; місто відоме через жінку, названу за ним. Лука перелічує серед тих, хто йшов за Ісусом, «Мария, на прізвище Магдалина, що з неї сїм бісів вийшло», з іншими жінками, які служили Йому своїм майном; вона стояла біля хреста, а Марк каже, що воскреслий Ісус «явивсь найперше Мариї Магдалинї». Після нагодування чотирьох тисяч Ісус, за текстом Біблії короля Якова, прибув «у границї Магдалські»; у багатьох рукописах читається Магадан, а Марк має «сторони Далманутанські», які досі не знайдено. Пізніший західний образ Марії як розкаяної блудниці походить із проповіді Григорія Великого 591 р., яка поєднала її з грішницею з Луки 7; Євангелія цього не кажуть."
    - "Розкопки від 2007 р., які вели францисканці, а від 2009 р. — Управління старожитностей Ізраїлю, виявили заможне місто на березі озера з гаванню, вулицями й малими обмазаними басейнами, які могли слугувати рибній торгівлі. Його синагога I ст. н. е. з розписаними стінами та мозаїчною підлогою — одна з небагатьох у Галілеї часів Ісуса; у ній стояв різьблений камінь, камінь Магдали, з одним із найдавніших відомих рельєфів семисвічника. Йосиф Флавій розповідає, як Тит узяв Тарихею 67 р. н. е., і квартал синагоги було покинуто під час повстання."
  es:
    - "Magdala se alzaba en la orilla occidental del mar de Galilea, bajo los acantilados del monte Arbel, donde estuvo hasta 1948 la aldea árabe de al-Majdal y donde hoy se puede visitar la ciudad excavada, junto a Migdal, en Israel; el punto del mapa está sobre ella. Queda a unos 7 km al norte de Tiberíades y a 8 km al suroeste de Cafarnaúm en línea recta, en el borde meridional de la llanura de Genesaret. Su nombre es el arameo para «torre». La mayoría de los estudiosos la identifican con Tariquea, la ciudad de salazón de pescado de Josefo, aunque Plinio sitúa Tariquea en el extremo sur del lago, por lo que la identificación no es segura."
    - "Los Evangelios nunca describen un suceso en la propia Magdala; la ciudad se conoce por la mujer que lleva su nombre. Lucas enumera entre quienes seguían a Jesús a «María, que se llamaba Magdalena, de la cual habían salido siete demonios», con otras mujeres que le servían de sus haciendas; ella estuvo junto a la cruz, y Marcos dice que Jesús resucitado «apareció primeramente á María Magdalena». Tras dar de comer a los cuatro mil, Jesús llegó, en el texto de la King James, «á los términos de Magdalá»; muchos manuscritos leen Magadán, y Marcos tiene «las partes de Dalmanutha», que no se ha hallado. La imagen occidental posterior de María como prostituta arrepentida procede de una homilía de Gregorio Magno en 591, que la unió con la pecadora de Lucas 7; los Evangelios no lo dicen."
    - "Las excavaciones desde 2007, de los franciscanos y, desde 2009, de la Autoridad de Antigüedades de Israel, han sacado a la luz una próspera ciudad ribereña con puerto, calles y pequeñas piscinas enlucidas que pudieron servir al comercio del pescado. Su sinagoga del siglo I d. C., con paredes pintadas y suelo de mosaico, es una de las pocas de Galilea de tiempos de Jesús; en ella había una piedra tallada, la piedra de Magdala, que lleva uno de los relieves más antiguos conocidos de la menorá de siete brazos. Josefo cuenta cómo Tito tomó Tariquea en el 67 d. C., y el barrio de la sinagoga fue abandonado en tiempos de la revuelta."
  pt:
    - "Magdala ficava na margem ocidental do mar da Galileia, abaixo dos penhascos do monte Arbel, onde a aldeia árabe de al-Majdal existiu até 1948 e a cidade escavada pode ser visitada hoje junto a Migdal, em Israel; o ponto do mapa fica sobre ela. Fica a cerca de 7 km ao norte de Tiberíades e 8 km a sudoeste de Cafarnaum em linha reta, na borda meridional da planície de Genesaré. Seu nome é o aramaico para “torre”. A maioria dos estudiosos a identifica com Tariqueia, a cidade de salga de peixe de Josefo, embora Plínio situe Tariqueia na extremidade sul do lago, de modo que a identificação não é certa."
    - "Os Evangelhos nunca descrevem um acontecimento na própria Magdala; a cidade é conhecida pela mulher que tem o seu nome. Lucas relaciona entre os que seguiam Jesus “Maria, chamada Madalena, da qual haviam saído sete demônios”, com outras mulheres que o serviam com os seus bens; ela esteve junto à cruz, e Marcos diz que o Jesus ressuscitado “apareceu primeiro a Maria Madalena”. Depois de alimentar os quatro mil, Jesus foi, no texto da King James, “para a região de Magdala”; muitos manuscritos leem Magadã, e Marcos tem “a região de Dalmanuta”, que não foi encontrada. A imagem ocidental posterior de Maria como uma prostituta arrependida vem de um sermão de Gregório Magno em 591, que a identificou com a mulher pecadora de Lucas 7; os Evangelhos não dizem isso."
    - "As escavações desde 2007, dos franciscanos e, a partir de 2009, da Autoridade de Antiguidades de Israel, trouxeram à luz uma próspera cidade à beira do lago, com porto, ruas e pequenos tanques revestidos de reboco que podem ter servido ao comércio de peixe. Sua sinagoga do século I d.C., com paredes pintadas e piso de mosaico, é uma das poucas da Galileia do tempo de Jesus; nela havia uma pedra entalhada, a pedra de Magdala, com um dos mais antigos relevos conhecidos da menorá de sete braços. Josefo conta como Tito tomou Tariqueia em 67 d.C., e o bairro da sinagoga foi abandonado na época da revolta."
  de:
    - "Magdala lag am Westufer des Sees Genezareth unterhalb der Felswände des Bergs Arbel, wo das arabische Dorf al-Madschdal bis 1948 stand und die ausgegrabene Stadt heute neben Migdal in Israel besucht werden kann; der Kartenpunkt steht darauf. Es liegt in der Luftlinie etwa 7 km nördlich von Tiberias und 8 km südwestlich von Kapernaum, am Südrand der Ebene Genezareth. Sein Name ist das aramäische Wort für „Turm“. Die meisten Gelehrten setzen es mit Tarichea gleich, der Fischpökelstadt des Josephus, doch Plinius verlegt Tarichea ans Südende des Sees, sodass die Gleichsetzung nicht sicher ist."
    - "Die Evangelien beschreiben nie ein Ereignis in Magdala selbst; die Stadt ist durch die nach ihr benannte Frau bekannt. Lukas nennt unter denen, die Jesus folgten, „Maria, die da Magdalena heißt, von welcher waren sieben Teufel ausgefahren“, mit anderen Frauen, die ihm von ihrer Habe Handreichung taten; sie stand beim Kreuz, und Markus sagt, nach seiner Auferstehung „erschien er am ersten der Maria Magdalena“. Nach der Speisung der Viertausend kam Jesus, im Text der Lutherbibel, „in das Gebiet Magdalas“; viele Handschriften lesen Magadan, und Markus hat „in die Gegend von Dalmanutha“, das nicht gefunden wurde. Das spätere westliche Bild der Maria als reuiger Dirne stammt aus einer Predigt Gregors des Großen im Jahr 591, die sie mit der Sünderin aus Lukas 7 verband; die Evangelien sagen das nicht."
    - "Grabungen seit 2007, durch die Franziskaner und ab 2009 durch die Israelische Altertumsbehörde, haben eine wohlhabende Stadt am See mit Hafen, Straßen und kleinen verputzten Becken freigelegt, die dem Fischhandel gedient haben könnten. Ihre Synagoge aus dem 1. Jahrhundert n. Chr., mit bemalten Wänden und Mosaikboden, ist eine der wenigen in Galiläa aus der Zeit Jesu; in ihr stand ein behauener Stein, der Magdala-Stein, mit einem der frühesten bekannten Reliefs der siebenarmigen Menora. Josephus erzählt, wie Titus Tarichea im Jahr 67 n. Chr. einnahm, und das Synagogenviertel wurde zur Zeit des Aufstands aufgegeben."
  fr:
    - "Magdala se trouvait sur la rive occidentale de la mer de Galilée, au pied des falaises du mont Arbel, là où s’éleva jusqu’en 1948 le village arabe d’al-Majdal et où l’on peut visiter aujourd’hui la ville fouillée, à côté de Migdal, en Israël ; le point de la carte s’y trouve. Elle est à environ 7 km au nord de Tibériade et à 8 km au sud-ouest de Capernaüm à vol d’oiseau, à la lisière sud de la plaine de Génésareth. Son nom est l’araméen pour « tour ». La plupart des spécialistes l’identifient à Tarichées, la ville de salaison de poisson de Flavius Josèphe, bien que Pline place Tarichées à l’extrémité sud du lac, de sorte que l’identification n’est pas certaine."
    - "Les Évangiles ne décrivent jamais d’événement à Magdala même ; la ville est connue par la femme qui en porte le nom. Luc compte parmi ceux qui suivaient Jésus « Marie, dite de Magdala, de laquelle étaient sortis sept démons », avec d’autres femmes « qui l’assistaient de leurs biens » ; elle se tint près de la croix, et Marc dit que Jésus ressuscité « apparut d’abord à Marie de Magdala ». Après avoir nourri les quatre mille, Jésus vint, selon le texte de la King James Version, dans le territoire de Magdala ; de nombreux manuscrits lisent Magadan, et Marc a « la contrée de Dalmanutha », qui n’a pas été retrouvée. L’image occidentale ultérieure de Marie en prostituée repentie vient d’un sermon de Grégoire le Grand en 591, qui l’identifia à la pécheresse de Luc 7 ; les Évangiles ne le disent pas."
    - "Les fouilles menées depuis 2007, par les franciscains, puis à partir de 2009 par l’Autorité des antiquités d’Israël, ont mis au jour une ville prospère au bord du lac, avec un port, des rues et de petits bassins enduits qui ont pu servir au commerce du poisson. Sa synagogue du Ier siècle apr. J.-C., aux murs peints et au sol de mosaïque, est l’une des rares de Galilée à remonter au temps de Jésus ; on y trouva une pierre sculptée, la pierre de Magdala, qui porte l’un des plus anciens reliefs connus de la ménorah à sept branches. Flavius Josèphe raconte comment Titus prit Tarichées en 67 apr. J.-C., et le quartier de la synagogue fut abandonné à l’époque de la révolte."
