id: where-did-jacob-wrestle-with-god
question:
  en: "Where did Jacob wrestle with God?"
  ru: "Где Иаков боролся с Богом?"
  uk: "Де Яків боровся з Богом?"
  es: "¿Dónde luchó Jacob con Dios?"
  pt: "Onde Jacó lutou com Deus?"
  de: "Wo rang Jakob mit Gott?"
  fr: "Où Jacob a-t-il lutté avec Dieu ?"
  pl: "Gdzie Jakub zmagał się z Bogiem?"
  it: "Dove Giacobbe lottò con Dio?"
  nl: "Waar worstelde Jakob met God?"
  cs: "Kde Jákob zápasil s Bohem?"
  sv: "Var brottades Jakob med Gud?"
  nb: "Hvor kjempet Jakob med Gud?"
  tl: "Saan nakipagbuno si Jacob sa Dios?"
  da: "Hvor kæmpede Jakob med Gud?"
  sr: "Где се Јаков рвао с Богом?"
  hu: "Hol küzdött Jákób Istennel?"
  fi: "Missä Jaakob painiskeli Jumalan kanssa?"
  vi: "Gia-cốp đã vật lộn với Đức Chúa Trời ở đâu?"
  ro: "Unde s-a luptat Iacov cu Dumnezeu?"
  bg: "Къде Яков се е борил с Бога?"
answer:
  en:
    - "At the ford of the Jabbok, the river now called the Zarqa in Jordan, at a place Jacob named Peniel or Penuel, “the face of God”. The site is usually sought at Tulul edh-Dhahab, two hills on a bend of the Zarqa gorge about a dozen kilometres east of the Jordan; the map point stands on the eastern hill, about 63 km north-east of Jerusalem in a straight line. Many scholars agree, but which of the two hills was Penuel, and which Mahanaim, is not certain, and some look for Penuel elsewhere along the river."
    - "Jacob was coming home from Haran, about 600 km to the north-east, to meet Esau. “And he rose up that night… and passed over the ford Jabbok”; then “Jacob was left alone; and there wrestled a man with him until the breaking of the day.” The stranger lamed him and renamed him: “Thy name shall be called no more Jacob, but Israel: for as a prince hast thou power with God and with men, and hast prevailed.” Jacob said, “I have seen God face to face, and my life is preserved”, and “as he passed over Penuel the sun rose upon him, and he halted upon his thigh.” Hosea recalls that “he had power over the angel, and prevailed”."
    - "From Penuel Jacob went on to Succoth, about 7 km to the west in the Jordan valley, and then across the river to Shechem, about 39 km away. In the days of the judges Penuel was a town with a tower, which Gideon pulled down, and Jeroboam I later rebuilt it. Eusebius knew only that the place lay by the Jabbok."
  ru:
    - "У брода через Иавок — реку, которую теперь в Иордании называют Зарка, — в месте, которое Иаков назвал Пенуэл, или Пениэл, «лицо Божие». Его обычно ищут в Тулуль-эз-Захаб — двух холмах на излучине ущелья Зарки примерно в дюжине километров к востоку от Иордана; точка карты стоит на восточном холме, примерно в 63 км к северо-востоку от Иерусалима по прямой. Многие учёные согласны с этим, но какой из двух холмов был Пенуэлом, а какой Маханаимом, не бесспорно, и некоторые ищут Пенуэл в другом месте на реке."
    - "Иаков возвращался из Харрана, лежащего примерно в 600 км к северо-востоку, навстречу Исаву. «И встал в ту ночь… перешел через Иавок вброд»; «И остался Иаков один. И боролся Некто с ним до появления зари». Незнакомец повредил ему бедро и дал новое имя: «отныне имя тебе будет не Иаков, а Израиль, ибо ты боролся с Богом, и человеков одолевать будешь». Иаков сказал: «я видел Бога лицем к лицу, и сохранилась душа моя»; «И взошло солнце, когда он проходил Пенуэл; и хромал он на бедро свое». Осия вспоминает: «Он боролся с Ангелом — и превозмог»."
    - "От Пенуэла Иаков пошёл в Сокхоф, примерно в 7 км к западу в долине Иордана, а потом за реку, в Сихем, примерно в 39 км. Во времена судей Пенуэл был городом с башней, которую разрушил Гедеон, а позже Иеровоам I отстроил его. Евсевий знал лишь, что место лежит у Иавока."
  uk:
    - "На броді Яббок, річки, що нині зветься Зарка в Йорданії, у місці, яке Яків назвав Пеніел або Пенуел, «лице Боже». Місце зазвичай шукають у Тулюль-ед-Дагаб, двох пагорбах на вигині ущелини Зарки приблизно за дюжину кілометрів на схід від Йордану; точка мапи стоїть на східному пагорбі, приблизно за 63 км на північний схід від Єрусалиму по прямій. Багато вчених погоджується, але який із двох пагорбів був Пенуелом, а який Маханаїмом, непевно, і дехто шукає Пенуел деінде вздовж річки."
    - "Яків повертався з Харана, приблизно за 600 км на північний схід, щоб зустріти Ісава. «Уставши ж тієї ночі … перейшов бридьма брід Ябок»; потім «Остався ж Яков один, і боровсь із ним хтось, аж покіль обутьріло». Незнайомець зробив його кульгавим і дав йому нове ім'я: «Від тепер буде тобі імя не Яков, а Ізраїль; ти бо з Богом боровсь і над людьми брати меш гору». Яків сказав: «бачив бо я Бога лицем до лиця, тай вирятувалась душа моя», і «Засяло ж йому соньце, як прийшов за Пенуель; він же кульгав на стегно». Осія згадує: «Боровся з ангелом, — і переміг»."
    - "З Пенуела Яків пішов у Сокхот, приблизно за 7 км на захід у Йорданській долині, а потім через річку до Сихему, приблизно за 39 км. За днів суддів Пенуел був містом з баштою, яку Гедеон зруйнував, а Єровоам I згодом його відбудував. Євсевій знав лише, що це місце лежить біля Яббока."
  es:
    - "En el vado del Jaboc, el río que hoy se llama Zarqa, en Jordania, en un lugar al que Jacob puso el nombre de Peniel o Penuel, «el rostro de Dios». El lugar suele buscarse en Tulul edh-Dhahab, dos colinas en un recodo del cañón del Zarqa a una docena de kilómetros al este del Jordán; el punto del mapa está en la colina oriental, a unos 63 km al noreste de Jerusalén en línea recta. Muchos estudiosos coinciden, pero no es seguro cuál de las dos colinas era Penuel y cuál Mahanaim, y algunos buscan Penuel en otro punto del río."
    - "Jacob volvía a casa desde Harán, a unos 600 km al noreste, para encontrarse con Esaú. «Y levantóse aquella noche... y pasó el vado de Jaboc»; luego «quedóse Jacob solo, y luchó con él un varón hasta que rayaba el alba». El desconocido le dislocó el muslo y le cambió el nombre: «No se dirá más tu nombre Jacob, sino Israel: porque has peleado con Dios y con los hombres, y has vencido». Jacob dijo: «vi á Dios cara á cara, y fué librada mi alma», y «salióle el sol pasado que hubo á Peniel; y cojeaba de su anca». Oseas recuerda que «con su fortaleza venció al ángel»."
    - "Desde Penuel, Jacob siguió hasta Sucot, a unos 7 km al oeste, en el valle del Jordán, y luego cruzó el río hasta Siquem, a unos 39 km. En tiempos de los jueces, Penuel era una ciudad con una torre, que Gedeón derribó, y Jeroboam I la reedificó más tarde. Eusebio solo sabía que el lugar estaba junto al Jaboc."
  pt:
    - "No vau do Jaboque, o rio hoje chamado Zarqa, na Jordânia, num lugar que Jacó chamou Peniel ou Penuel, “a face de Deus”. O local costuma ser buscado em Tulul edh-Dhahab, duas colinas numa curva da garganta do Zarqa cerca de uma dúzia de quilômetros a leste do Jordão; o ponto do mapa está na colina oriental, a cerca de 63 km a nordeste de Jerusalém em linha reta. Muitos estudiosos concordam, mas qual das duas colinas era Peniel e qual Maanaim não é certo, e alguns procuram Peniel em outro ponto do rio."
    - "Jacó voltava de Harã, a cerca de 600 km ao nordeste, para encontrar Esaú. “Ele se levantou naquela noite… e atravessou o vau do Jaboque”; então “Jacó ficou sozinho, e lutou com um homem ali até o raiar do dia”. O desconhecido lhe deslocou a coxa e o renomeou: “Seu nome não será mais Jacó, mas Israel; pois você lutou com Deus e com os homens, e prevaleceu.” Jacó disse: “Vi a Deus face a face, e a minha vida foi preservada”, e “o sol nasceu sobre ele quando passava por Peniel, e ele mancava por causa da sua coxa”. Oseias lembra que “ele lutou com o anjo e prevaleceu”."
    - "De Peniel Jacó seguiu para Sucote, a cerca de 7 km a oeste, no vale do Jordão, e depois atravessou o rio até Siquém, a cerca de 39 km. Nos dias dos juízes Peniel era uma cidade com uma torre, que Gideão derrubou, e Jeroboão I a reconstruiu depois. Eusébio só sabia que o lugar ficava junto ao Jaboque."
  de:
    - "An der Furt des Jabbok, des Flusses, der heute in Jordanien Zarqa heißt, an einem Ort, den Jakob Penuel nannte, „Angesicht Gottes“. Die Stätte sucht man meist bei Tulul edh-Dhahab, zwei Hügeln an einer Biegung der Zarqa-Schlucht gut ein Dutzend Kilometer östlich des Jordan; der Kartenpunkt liegt auf dem östlichen Hügel, in der Luftlinie etwa 63 km nordöstlich von Jerusalem. Viele Gelehrte stimmen zu, doch welcher der beiden Hügel Penuel und welcher Mahanajim war, ist nicht sicher, und manche suchen Penuel anderswo am Fluss."
    - "Jakob kam von Haran, etwa 600 km im Nordosten, nach Hause, um Esau zu begegnen. Jakob „stand auf in der Nacht ... und zog an die Furt des Jabbok“; dann blieb er allein: „Da rang ein Mann mit ihm, bis die Morgenröte anbrach.“ Der Fremde verrenkte ihm die Hüfte und gab ihm einen neuen Namen: „Du sollst nicht mehr Jakob heißen, sondern Israel; denn du hast mit Gott und mit Menschen gekämpft und bist obgelegen.“ Jakob nannte die Stätte Penuel, „denn ich habe Gott von Angesicht gesehen, und meine Seele ist genesen“; „Und als er an Pniel vorüberkam, ging ihm die Sonne auf; und er hinkte an seiner Hüfte.“ Hosea erinnert: „Er kämpfte mit dem Engel und siegte“."
    - "Von Penuel zog Jakob weiter nach Sukkot, etwa 7 km westlich im Jordantal, und dann über den Fluss nach Sichem, etwa 39 km entfernt. In der Richterzeit war Penuel eine Stadt mit einem Turm, den Gideon niederriss, und Jerobeam I. baute es später wieder auf. Eusebius wusste nur, dass der Ort am Jabbok lag."
  fr:
    - "Au gué du Jabbok, le cours d’eau appelé aujourd’hui Zarqa, en Jordanie, en un lieu que Jacob nomma Peniel ou Penuel, « face de Dieu ». Le site se cherche d’ordinaire à Tulul edh-Dhahab, deux collines au coude de la gorge du Zarqa, à une douzaine de kilomètres à l’est du Jourdain ; le point de la carte est sur la colline orientale, à environ 63 km au nord-est de Jérusalem en ligne droite. Beaucoup de savants s’accordent, mais laquelle des deux collines était Penuel, et laquelle Mahanaïm, n’est pas certain, et certains cherchent Penuel ailleurs le long du fleuve."
    - "Jacob revenait de Haran, à environ 600 km au nord-est, pour rencontrer Ésaü. « Il se leva la même nuit … et passa le gué de Jabbok » ; puis « Jacob demeura seul. Alors un homme lutta avec lui jusqu’au lever de l’aurore. » L’inconnu le frappa à la hanche et le rebaptisa : « Ton nom ne sera plus Jacob, mais tu seras appelé Israël ; car tu as lutté avec Dieu et avec des hommes, et tu as été vainqueur. » Jacob dit : « j’ai vu Dieu face à face, et mon âme a été sauvée », et « le soleil se levait, lorsqu’il passa Peniel. Jacob boitait de la hanche. » Osée rappelle : « Il lutta avec l’ange, et il fut vainqueur. »"
    - "De Penuel, Jacob alla à Succoth, à environ 7 km à l’ouest dans la vallée du Jourdain, puis, de l’autre côté du fleuve, à Sichem, à environ 39 km. Au temps des juges, Penuel était une ville à tour, que Gédéon renversa, et Jéroboam Ier la rebâtit plus tard. Eusèbe savait seulement que le lieu se trouvait près du Jabbok."
  pl:
    - "Na brodzie Jabok, rzeki zwanej dziś Zarka w Jordanii, w miejscu, które Jakub nazwał Penuel, „oblicze Boga”. Miejsca szuka się zwykle w Tulul ed-Dahab, na dwóch wzgórzach na zakręcie wąwozu Zarki około dwunastu kilometrów na wschód od Jordanu; punkt na mapie stoi na wzgórzu wschodnim, około 63 km na północny wschód od Jerozolimy w linii prostej. Wielu uczonych się z tym zgadza, ale nie jest pewne, które z dwóch wzgórz było Penuel, a które Machanaim, a niektórzy szukają Penuel gdzie indziej wzdłuż rzeki."
    - "Jakub wracał z Charanu, około 600 km na północny wschód, na spotkanie z Ezawem. „Wstawszy tedy onej nocy … i przeszedł przez bród Jabok”; potem „A tylko sam Jakób został. A oto, biedził się z nim mąż aż do wejścia zorzy.” Nieznajomy okulawił go i dał mu nowe imię: „Nie będzie nazywane więcej imię twoje Jakób, ale Izrael; boś sobie mężnie poczynał z Bogiem, i z ludźmi, i przemogłeś.” Jakub powiedział: „Iżem widział Boga twarzą w twarz, a zachowana jest dusza moja”, a „weszło mu słońce, kiedy minął miejsce Fanuel, a on uchramował na biodrę swoję”. Ozeasz przypomina, że „sobie poczynał z Aniołem, a przemógł”."
    - "Z Penuel Jakub poszedł do Sukkot, około 7 km na zachód w dolinie Jordanu, a potem przez rzekę do Sychem, około 39 km dalej. W dniach sędziów Penuel było miastem z wieżą, którą rozwalił Gedeon, a Jeroboam I później je odbudował. Euzebiusz wiedział tylko, że miejsce leży nad Jabokiem."
  it:
    - "Al guado dello Iabbok, il fiume oggi detto Zarqa in Giordania, in un luogo che Giacobbe chiamò Peniel o Penuel, «il volto di Dio». Il sito si cerca di solito a Tulul edh-Dhahab, due colli su una curva della gola dello Zarqa a una dozzina di chilometri a est del Giordano; il punto della mappa sorge sul colle orientale, a circa 63 km a nord-est di Gerusalemme in linea retta. Molti studiosi concordano, ma quale dei due colli fosse Penuel e quale Maanaim non è certo, e alcuni cercano Penuel altrove lungo il fiume."
    - "Giacobbe tornava da Carran, a circa 600 km a nord-est, per incontrare Esaù. «E si levò, quella notte … e passò il guado di Iabbok»; poi «Giacobbe rimase solo, e un uomo lottò con lui fino all’apparir dell’alba». Lo sconosciuto lo azzoppò e lo ribattezzò: «Il tuo nome non sarà più Giacobbe, ma Israele, poiché tu hai lottato con Dio e con gli uomini, ed hai vinto». Giacobbe disse: «ho veduto Iddio a faccia a faccia, e la mia vita è stata risparmiata», e «Il sole si levava com’egli ebbe passato Peniel; e Giacobbe zoppicava dell’anca». Osea ricorda che «lottò con l’angelo, e restò vincitore»."
    - "Da Penuel Giacobbe proseguì per Succot, a circa 7 km a ovest nella valle del Giordano, e poi attraverso il fiume fino a Sichem, a circa 39 km. Ai giorni dei giudici Penuel era una città con una torre, che Gedeone abbatté, e Geroboamo I la ricostruì poi. Eusebio sapeva soltanto che il luogo si trovava presso lo Iabbok."
  nl:
    - "Bij de voorde van de Jabbok, de rivier die nu in Jordanië Zarqa heet, op een plaats die Jakob Peniël of Penuël noemde, “het aangezicht van God”. De plek wordt gewoonlijk gezocht bij Tulul edh-Dhahab, twee heuvels aan een bocht van de Zarqa-kloof, ongeveer twaalf kilometer ten oosten van de Jordaan; het punt op de kaart staat op de oostelijke heuvel, hemelsbreed ongeveer 63 km ten noordoosten van Jeruzalem. Veel geleerden stemmen daarmee in, maar welke van de twee heuvels Peniël was en welke Machanaïm, is niet zeker, en sommigen zoeken Peniël elders langs de rivier."
    - "Jakob kwam thuis uit Haran, ongeveer 600 km naar het noordoosten, om Ezau te ontmoeten. “En hij stond op in dienzelfden nacht … en hij toog over het veer van de Jabbok”; toen “Doch Jakob bleef alleen over; en een man worstelde met hem, totdat de dageraad opging.” De vreemdeling verlamde hem en gaf hem een nieuwe naam: “Uw naam zal voortaan niet Jakob heten, maar Israel; want gij hebt u vorstelijk gedragen met God en met de mensen, en hebt overmocht.” Jakob zei: “ik heb God gezien van aangezicht tot aangezicht, en mijn ziel is gered geweest”, en “de zon rees hem op, als hij door Pniel gegaan was; en hij was hinkende aan zijn heup.” Hosea herinnert eraan: “hij gedroeg zich vorstelijk tegen den Engel, en overmocht Hem”."
    - "Van Peniël trok Jakob verder naar Sukkot, ongeveer 7 km naar het westen in de Jordaanvallei, en daarna over de rivier naar Sichem, ongeveer 39 km verderop. In de dagen van de richters was Peniël een stad met een toren, die Gideon afbrak en die Jerobeam I later herbouwde. Eusebius wist alleen dat de plaats bij de Jabbok lag."
  cs:
    - "Na brodu Jabboku, řeky nyní zvané Zarqá v Jordánsku, na místě, které Jákob nazval Peniel či Penuel, „tvář Boží“. Místo se obvykle hledá na Tulúl adh-Dhahab, dvou pahorcích na ohybu rokle Zarqá asi tucet kilometrů východně od Jordánu; bod na mapě stojí na východním pahorku, asi 63 km severovýchodně od Jeruzaléma vzdušnou čarou. Mnozí badatelé souhlasí, ale který ze dvou pahorků byl Penuel a který Machanajim, není jisté, a někteří hledají Penuel jinde podél řeky."
    - "Jákob se vracel z Cháranu, asi 600 km na severovýchod, aby se setkal s Ezauem. „A vstav ještě v noci … přešel přes brod Jabok“; pak „zůstal Jákob sám; a tu zápasil s ním muž až do svitání.“ Cizinec ho ochromil a přejmenoval: „Nebude více nazýváno jméno tvé toliko Jákob, ale také Izrael; nebo jsi statečně zacházel s Bohem i lidmi, a přemohls.“ Jákob řekl, že „viděl Boha tváří v tvář, a zachována jest duše má“, a „vzešlo mu slunce, když pominul místa toho Fanuel, a kulhal na nohu svou“. Ozeáš připomíná, že „potýkal se s andělem, a přemohl“."
    - "Z Penuelu šel Jákob dál do Sukotu, asi 7 km na západ v Jordánském údolí, a pak přes řeku do Šekemu, vzdáleného asi 39 km. Za dnů soudců byl Penuel městem s věží, kterou Gedeon zbořil, a Jarobeám I. jej později znovu vystavěl. Eusebios věděl jen, že místo leží u Jabboku."
  sv:
    - "Vid Jabboks vadställe, floden som nu kallas Zarqa i Jordanien, på en plats som Jakob kallade Peniel eller Penuel, ”Guds ansikte”. Platsen söks vanligen vid Tulul edh-Dhahab, två kullar vid en krök av Zarqas ravin omkring ett dussin kilometer öster om Jordan; kartpunkten står på den östra kullen, omkring 63 km nordost om Jerusalem fågelvägen. Många forskare instämmer, men vilken av de två kullarna som var Penuel och vilken som var Mahanajim är inte säkert, och vissa söker Penuel någon annanstans längs floden."
    - "Jakob var på väg hem från Harran, omkring 600 km åt nordost, för att möta Esau. ”Men under natten stod han upp ... och gick över Jabboks vad”; sedan blev Jakob ”ensam kvar. Då brottades en man med honom, till dess morgonrodnaden gick upp.” Främlingen gjorde honom halt och gav honom ett nytt namn: ”Du skall icke mer heta Jakob, utan Israel, ty du har kämpat med Gud och med människor och vunnit seger.” Jakob sade: ”jag har sett Gud ansikte mot ansikte, och dock har mitt liv blivit räddat”, och ”när han hade kommit förbi Penuel, såg han solen gå upp; men han haltade på höften.” Hosea erinrar om att ”han kämpade med ängeln och vann seger”."
    - "Från Penuel drog Jakob vidare till Suckot, omkring 7 km åt väster i Jordandalen, och sedan över floden till Shekem, omkring 39 km bort. På domartiden var Penuel en stad med ett torn, som Gideon rev ned, och Jerobeam I byggde senare upp det. Eusebios visste bara att platsen låg vid Jabbok."
  nb:
    - "Ved vadestedet over Jabbok, elven som nå kalles Zarqa i Jordan, på et sted Jakob kalte Peniel eller Penuel, «Guds åsyn». Stedet søkes vanligvis ved Tulul edh-Dhahab, to hauger i en sving av Zarqa-kløften omtrent et dusin kilometer øst for Jordan; kartpunktet står på den østlige haugen, omtrent 63 km nordøst for Jerusalem i luftlinje. Mange forskere er enige, men hvilken av de to haugene som var Penuel, og hvilken som var Mahanajim, er ikke sikkert, og noen søker Penuel andre steder langs elven."
    - "Jakob var på vei hjem fra Harran, omtrent 600 km mot nordøst, for å møte Esau. «samme natt stod han op … og gikk over Jabboks vadested»; så «var Jakob alene tilbake. Da kom det en mann og kjempet med ham inntil morgenen grydde.» Fremmeden gjorde ham halt og ga ham nytt navn: «Du skal ikke lenger hete Jakob, men Israel; for du har kjempet med Gud og med mennesker og vunnet.» Jakob sa: «jeg har sett Gud åsyn til åsyn og enda berget livet», og «da han var kommet forbi Pnuel så han solen rinne; og han haltet på sin hofte.» Hosea minner om at «Han kjempet med engelen og vant»."
    - "Fra Penuel dro Jakob videre til Sukkot, omtrent 7 km mot vest i Jordandalen, og så over elven til Sikem, omtrent 39 km unna. I dommertiden var Penuel en by med et tårn, som Gideon rev ned, og Jeroboam I bygget den senere opp igjen. Eusebius visste bare at stedet lå ved Jabbok."
  tl:
    - "Sa tawiran ng Jaboc, ang ilog na tinatawag ngayong Zarqa sa Jordan, sa lugar na pinangalanan ni Jacob na Peniel o Penuel, “mukha ng Dios”. Karaniwang hinahanap ang pook sa Tulul edh-Dhahab, dalawang burol sa liko ng bangin ng Zarqa mga isang dosenang kilometro sa silangan ng Jordan; ang tuldok sa mapa ay nasa silangang burol, mga 63 km sa hilagang-silangan ng Jerusalem sa tuwid na guhit. Sumasang-ayon ang maraming iskolar, ngunit hindi tiyak kung alin sa dalawang burol ang Penuel at alin ang Mahanaim, at hinahanap ng ilan ang Penuel sa ibang bahagi ng ilog."
    - "Pauwi si Jacob mula sa Haran, mga 600 km sa hilagang-silangan, upang makipagkita kay Esau. “Siya'y bumangon ng gabing yaon … at tumawid sa tawiran ng Jaboc”; pagkatapos “naiwang magisa si Jacob: at nakipagbuno ang isang lalake sa kaniya, hanggang sa magbukang liwayway.” Pinilay siya ng estranghero at pinalitan ang kaniyang pangalan: “Hindi na tatawaging Jacob ang iyong pangalan, kundi Israel; sapagka't ikaw ay nakipagpunyagi sa Dios at sa mga tao, at ikaw ay nanaig.” Sinabi ni Jacob, “nakita ko ang Dios ng mukhaan, at naligtas ang aking buhay”, at “sinikatan siya ng araw ng siya'y nagdadaan sa Penuel; at siya'y napipilay sa hita niya.” Naaalala ni Oseas na “siya'y nagtaglay ng kapangyarihan sa anghel, at nanaig”."
    - "Mula sa Penuel, nagpatuloy si Jacob sa Succoth, mga 7 km sa kanluran sa libis ng Jordan, at pagkatapos ay tumawid sa ilog patungong Sichem, mga 39 km ang layo. Noong mga araw ng mga hukom, ang Penuel ay bayang may tore, na ibinagsak ni Gedeon, at muling itinayo ni Jeroboam I kalaunan. Ang alam lamang ni Eusebio ay nasa tabi ng Jaboc ang lugar."
  da:
    - "Ved Jabboks vadested, floden, der nu kaldes Zarqa i Jordan, på et sted, Jakob kaldte Peniel eller Penuel, »Guds ansigt«. Stedet søges sædvanligvis ved Tulul edh-Dhahab, to høje på en bugt af Zarqa-kløften omkring et dusin kilometer øst for Jordan; kortets punkt står på den østlige høj, omkring 63 km nordøst for Jerusalem i luftlinje. Mange forskere er enige, men hvilken af de to høje der var Penuel, og hvilken Mahanajim, er ikke sikkert, og nogle søger Penuel andetsteds langs floden."
    - "Jakob var på vej hjem fra Karan, omkring 600 km mod nordøst, for at møde Esau. »Og han stod op i samme Nat … og gik over Vadestedet Jabok«; så »Jakob blev tilbage for sig selv alene; og der brødes en Mand med ham, indtil det dagedes.« Den fremmede gjorde ham halt og gav ham nyt navn: »Dit Navn skal ikke fremdeles kaldes Jakob, men Israel; thi du har kæmpet med Gud og med Mennesker og faaet Overhaand.« Jakob sagde: »jeg har set Gud Ansigt til Ansigt, og min Sjæl er frelst«, og »der han kom forbi Pnuel, gik Solen op for ham, og han haltede paa sin Hofte.« Hoseas minder om, at »han kæmpede med en Engel og sejrede«."
    - "Fra Penuel drog Jakob videre til Sukkot, omkring 7 km mod vest i Jordandalen, og derefter over floden til Sikem, omkring 39 km væk. I dommertiden var Penuel en by med et tårn, som Gideon rev ned, og Jeroboam I genopbyggede den senere. Eusebios vidste kun, at stedet lå ved Jabbok."
  sr:
    - "На броду Јавока, реке која се данас зове Зарка у Јордану, на месту које је Јаков назвао Пениел, односно Фануило, „лице Божје“. Место се обично тражи у Тулул ед Дахабу, два брежуљка на завоју клисуре Зарке неких дванаест километара источно од Јордана; тачка на карти стоји на источном брду, око 63 км североисточно од Јерусалима правом линијом. Многи научници се слажу, али није извесно који је од два брежуљка био Фануило, а који Маханајим, а неки траже Фануило на другом месту дуж реке."
    - "Јаков се враћао из Харана, око 600 км североисточно, да сретне Исава. „И по ноћи уста … и преброди брод Јавок“; затим: „А кад оста Јаков сам, тада се један човек рваше с њим до зоре.“ Странац га је осакатио и преименовао: „Одселе се нећеш звати Јаков, него Израиљ; јер си се јуначки борио и с Богом и с људима, и одолео си.“ Јаков је рекао: „Бога видех лицем к лицу, и душа се моја избави“, а „И сунце му се роди кад прође Фануил, и храмаше на стегно своје.“ Осија подсећа: „Бори се с анђелом, и надјача“."
    - "Од Фануила Јаков је отишао даље у Сокот, око 7 км западно у долини Јордана, а затим преко реке у Сихем, удаљен око 39 км. У време судија Фануило је био град с кулом коју је Гедеон срушио, а Јеровоам I га је касније обновио. Јевсевије је знао само да место лежи код Јавока."
  hu:
    - "A Jabbók gázlójánál, a folyónál, amelyet ma Jordániában Zarkának hívnak, azon a helyen, amelyet Jákób Peniélnek vagy Penuélnek, „Isten arcának” nevezett. A helyet általában a Tulúl edh-Dhahabnál keresik, a Zarka-szakadék kanyarulatán álló két dombnál, a Jordántól mintegy tucatnyi kilométerre keletre; a térképi pont a keleti dombon áll, Jeruzsálemtől egyenes vonalban mintegy 63 km-re északkeletre. Sok kutató egyetért, de hogy a két domb közül melyik volt Penuél és melyik Mahanajim, nem biztos, és egyesek Penuélt másutt keresik a folyó mentén."
    - "Jákób Háránból tért haza, mintegy 600 km-re északkeletről, hogy találkozzék Ézsauval. „Felkele pedig ő azon éjszaka […] és általméne a Jabbók révén”; azután „Jákób pedig egyedűl marada és tusakodik vala ő vele egy férfiú, egész a hajnal feljöveteléig.” Az idegen megsántította és új nevet adott neki: „Nem Jákóbnak mondatik ezután a te neved, hanem Izráelnek; mert küzdöttél Istennel és emberekkel, és győztél.” Jákób ezt mondta: „látám az Istent színről színre, és megszabadult az én lelkem”, és „a nap felkél vala rajta, amint elméne Peniél mellett, ő pedig sántít vala csípőjére.” Hóseás emlékeztet: „Küzdött az angyallal és legyőzte”."
    - "Penuéltől Jákób Szukkótba ment tovább, a Jordán völgyében mintegy 7 km-re nyugatra, majd át a folyón Sikembe, mintegy 39 km-re. A bírák korában Penuél tornyos város volt, amelyet Gedeon lerombolt, és I. Jeroboám később újjáépített. Eusebius csak annyit tudott, hogy a hely a Jabbók mellett fekszik."
  fi:
    - "Jabbokin kahlauspaikalla, joella, jota nykyään kutsutaan Jordaniassa Zarqaksi, paikassa, jonka Jaakob nimesi Penieliksi tai Penueliksi, ”Jumalan kasvoiksi”. Paikkaa etsitään yleensä Tulul edh-Dhahabista, kahdelta kukkulalta Zarqan rotkon mutkassa noin tusinan kilometrin päässä Jordanista itään; kartan piste on itäisellä kukkulalla, noin 63 km Jerusalemista koilliseen linnuntietä. Monet tutkijat ovat samaa mieltä, mutta kumpi kukkuloista oli Penuel ja kumpi Mahanaim, ei ole varmaa, ja jotkut etsivät Penuelia muualta joen varrelta."
    - "Jaakob oli palaamassa kotiin Harranista, noin 600 km koilliseen, tapaamaan Esauta. ”Mutta yöllä hän nousi … ja meni kahlauspaikasta Jabbokin yli”; sitten ”Jaakob jäi yksinänsä toiselle puolelle. Silloin painiskeli hänen kanssaan muuan mies päivän koittoon saakka.” Vieras nyrjäytti hänen lonkkansa ja antoi hänelle uuden nimen: ”Sinun nimesi älköön enää olko Jaakob, vaan Israel, sillä sinä olet taistellut Jumalan ja ihmisten kanssa ja olet voittanut.” Jaakob sanoi: ”minä olen nähnyt Jumalan kasvoista kasvoihin, ja kuitenkin on minun henkeni pelastunut”, ja ”kun hän oli kulkenut Penuelin ohitse, nousi aurinko; mutta hän ontui lonkkaansa”. Hoosea muistaa: ”Hän taisteli enkelin kanssa ja voitti”."
    - "Penuelista Jaakob jatkoi Sukkotiin, noin 7 km länteen Jordanin laaksossa, ja sitten joen yli Sikemiin, noin 39 km:n päähän. Tuomarien aikana Penuel oli kaupunki, jossa oli torni, jonka Gideon kaatoi, ja Jerobeam I rakensi sen myöhemmin uudelleen. Eusebios tiesi vain, että paikka oli Jabbokin varrella."
  vi:
    - "Tại bến lội sông Gia-bốc, con sông nay gọi là Zarqa ở nước Jordan, ở một chỗ Gia-cốp đặt tên là Phê-ni-ên hay Phê-nu-ên, “mặt của Đức Chúa Trời”. Địa điểm thường được tìm tại Tulul edh-Dhahab, hai ngọn đồi ở khúc quanh của hẻm Zarqa cách sông Giô-đanh khoảng chục kilômét về phía đông; điểm bản đồ đứng trên ngọn đồi phía đông, cách Giê-ru-sa-lem khoảng 63 km về phía đông bắc theo đường thẳng. Nhiều học giả đồng ý, nhưng ngọn nào trong hai ngọn đồi là Phê-nu-ên và ngọn nào là Ma-ha-na-im thì không chắc, và một số tìm Phê-nu-ên ở chỗ khác dọc sông."
    - "Gia-cốp đang từ Cha-ran, cách khoảng 600 km về phía đông bắc, trở về để gặp Ê-sau. “Ban đêm, người thức dậy … đi qua rạch Gia-bốc”; rồi “một mình Gia-cốp ở lại; thì có một người vật lộn với mình đến rạng đông.” Người lạ làm ông què và đổi tên ông: “Tên ngươi sẽ chẳng làm Gia-cốp nữa, nhưng tên là Y-sơ-ra-ên, vì ngươi đã có vật lộn cùng Đức Chúa Trời và người ta; ngươi đều được thắng.” Gia-cốp nói: “Tôi đã thấy Đức Chúa Trời đối mặt cùng tôi và linh hồn tôi được giải cứu”, và “Khi qua nơi Phê-ni-ên, thấy mặt trời mọc rồi; và người đi giẹo cẳng.” Ô-sê nhắc rằng “Người có quyền hơn thiên sứ, và được thắng”."
    - "Từ Phê-nu-ên, Gia-cốp đi tiếp đến Su-cốt, cách khoảng 7 km về phía tây trong đồng bằng Giô-đanh, rồi băng sông đến Si-chem, cách khoảng 39 km. Vào thời các quan xét, Phê-nu-ên là một thị trấn có tháp, bị Ghê-đê-ôn kéo đổ, và Giê-rô-bô-am I về sau xây lại. Eusebius chỉ biết rằng nơi ấy nằm bên sông Gia-bốc."
  ro:
    - "La vadul Iabocului, râul numit azi Zarqa în Iordania, într-un loc pe care Iacov l-a numit Peniel sau Penuel, „fața lui Dumnezeu”. Locul se caută de obicei la Tulul edh-Dhahab, două dealuri pe o cotitură a defileului Zarqa, la vreo doisprezece kilometri est de Iordan; punctul de pe hartă stă pe dealul de est, la circa 63 km nord-est de Ierusalim în linie dreaptă. Mulți cercetători sunt de acord, dar care dintre cele două dealuri a fost Penuel și care Mahanaim nu este sigur, iar unii caută Penuelul în alt loc de-a lungul râului."
    - "Iacov se întorcea acasă din Haran, de la circa 600 km spre nord-est, ca să-l întâlnească pe Esau. „Și sculându-se în noaptea aceea … a trecut vadul lui Iavoh”; apoi „a rămas Iacov singur și s’a luptat un om cu el până dimineața.” Necunoscutul l-a lăsat șchiop și i-a schimbat numele: „nu se va mai chemà numele tău Iacov, ci Israil va fì numele tău, pentrucă ai fost tare cu Dumnezeu; și cu oamenii puternic vei fi.” Iacov a spus: „am văzut pre Dumnezeu față către față și s’a mântuit sufletul meu”, iar „răsăreà soarele, când a trecut vederea lui Dumnezeu; iar el șchiopătà cu piciorul său.” Osea amintește că „s’a luptat cu îngerul, și a biruit”."
    - "De la Penuel, Iacov a mers mai departe la Sucot, la circa 7 km spre vest, în valea Iordanului, și apoi peste râu la Sihem, la circa 39 km. În zilele judecătorilor, Penuel era un oraș cu un turn, pe care Ghedeon l-a dărâmat, iar Ieroboam I l-a reclădit mai târziu. Eusebiu știa doar că locul se afla lângă Iaboc."
  bg:
    - "При брода на Явок, реката, която днес се нарича Зарка, в Йордания, на мястото, което Яков нарекъл Фануил или Пенуил — „лице Божие“. Мястото обикновено се търси при Тулул ед-Дахаб, два хълма на завой на клисурата на Зарка, на около дузина километра източно от Йордан; точката на картата стои на източния хълм, на около 63 км североизточно от Йерусалим по права линия. Много учени са съгласни, но кой от двата хълма е Пенуил и кой Маханаим, не е сигурно, а някои търсят Пенуил другаде покрай реката."
    - "Яков се връщал у дома от Харан, на около 600 км на североизток, за да се срещне с Исав. „И стана през нощта… и премина брода на Явок“; после „Яков остана сам; и бореше се с него един человек до зазоряване.“ Непознатият го осакатил и му дал ново име: „Няма да се казва вече името ти Яков, но Израил; защото си бил в борба с Бога и с человеци, и си надвил.“ Яков казал: „видях Бога лице с лице, и упазен биде животът ми“, и „изгря слънцето на него като заминваше Фануил; и хромеше с бедрото си.“ Осия припомня, че той „бори се с ангел, и превъзмогна“."
    - "От Пенуил Яков продължил към Сокхот, на около 7 км на запад в Йорданската долина, а после отвъд реката към Сихем, на около 39 км. В дните на съдиите Пенуил бил град с кула, която Гедеон съборил, а по-късно Йеровоам I го съградил отново. Евсевий знаел само, че мястото лежи при Явок."
