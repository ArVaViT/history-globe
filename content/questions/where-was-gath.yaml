id: where-was-gath
question:
  en: "Where was Gath, the city of Goliath?"
  ru: "Где находился Геф, город Голиафа?"
  uk: "Де був Гат, місто Голіята?"
  es: "¿Dónde estaba Gat, la ciudad de Goliat?"
  pt: "Onde ficava Gate, a cidade de Golias?"
  de: "Wo lag Gat, die Stadt des Goliat?"
  fr: "Où se trouvait Gath, la ville de Goliath ?"
answer:
  en:
    - "Gath is Tell es-Safi, a high mound in Israel where the valley of Elah opens onto the coastal plain, about 38 km west of Jerusalem in a straight line; the map point stands on it. It lay about 9 km south of Ekron and some 15 km down the valley from the place where David met Goliath. The identification was proposed in the nineteenth century; Tel Erani near Kiryat Gat, a town named after Gath, was also tried, but Tell es-Safi is now widely accepted because it fits the biblical geography and because it was the largest Philistine city of the tenth and ninth centuries BC."
    - "Gath was one of the five Philistine cities, and the Bible ties it above all to David. Goliath was “of Gath, whose height was six cubits and a span”, and after his fall the Philistines fled “even unto Gath, and unto Ekron”. Fleeing from Saul, David “went to Achish the king of Gath” and feigned madness at his gate; later he served Achish with six hundred men and received Ziklag from him. When Saul and Jonathan fell, David lamented: “Tell it not in Gath, publish it not in the streets of Askelon; lest the daughters of the Philistines rejoice.” Ittai the Gittite and his men from Gath stood by David when Absalom rebelled."
    - "Excavations led by Aren Maeir of Bar-Ilan University since 1996 have found a siege trench dug round the city in the late ninth century BC and a thick layer of destruction, which matches the report that “Hazael king of Syria went up, and fought against Gath, and took it”. Gath never regained its size. Amos holds it up as a warning, “go down to Gath of the Philistines”, and the later prophets list the Philistine cities without it. A potsherd of about the tenth century from the site bears two names, alwt and wlt, that recall the name Goliath without referring to him. The cities of the Philistines as a group are the subject of a separate question."
  ru:
    - "Геф — это Телль-эс-Сафи, высокий холм в Израиле там, где Долина дуба выходит на прибрежную равнину, примерно в 38 км к западу от Иерусалима по прямой; точка карты стоит на нём. Он лежал примерно в 9 км к югу от Екрона и километрах в 15 ниже по долине от места, где Давид вышел против Голиафа. Отождествление предложили ещё в XIX веке; пробовали и Тель-Эрани у Кирьят-Гата, города, названного в честь Гефа, но Телль-эс-Сафи теперь принят большинством: он подходит к библейской географии и был крупнейшим филистимским городом X–IX веков до н. э."
    - "Геф был одним из пяти филистимских городов, и Библия связывает его прежде всего с Давидом. Голиаф был «из Гефа; ростом он — шести локтей и пяди», а после его гибели филистимляне бежали «до Гефа и до Аккарона». Спасаясь от Саула, Давид «пришел к Анхусу, царю Гефскому» и притворился безумным у его ворот; позднее он служил Анхусу с шестьюстами мужей и получил от него Секелаг. Когда пали Саул и Ионафан, Давид плакал: «Не рассказывайте в Гефе, не возвещайте на улицах Аскалона, чтобы не радовались дочери Филистимлян». Еффей Гефянин и его люди из Гефа остались с Давидом, когда восстал Авессалом."
    - "Раскопки, которые с 1996 года ведёт Арен Маир из Бар-Иланского университета, обнаружили осадный ров, выкопанный вокруг города в конце IX века до н. э., и толстый слой разрушения; это совпадает с рассказом о том, что «выступил в поход Азаил, царь Сирийский, и пошел войною на Геф, и взял его». Прежних размеров Геф больше не достиг. Амос приводит его в пример как предостережение — «спуститесь в Геф Филистимский», а поздние пророки перечисляют филистимские города уже без него. На черепке около X века отсюда написаны два имени, alwt и wlt, напоминающие имя Голиаф, но к нему не относящиеся. О филистимских городах в целом рассказано в отдельном вопросе."
  uk:
    - "Гат — це Телль-ес-Сафі, високий пагорб в Ізраїлі, де долина Іла виходить на прибережну рівнину, приблизно за 38 км на захід від Єрусалима по прямій; точка на мапі стоїть на ньому. Він лежав приблизно за 9 км на південь від Екрона і приблизно за 15 км униз долиною від місця, де Давид зустрів Голіята. Це ототожнення запропоновано в XIX ст.; пробували й Тель-Ерані поблизу Кір'ят-Ґата, міста, названого на честь Гата, але нині Телль-ес-Сафі широко визнають, бо він відповідає біблійній географії й був найбільшим філістимським містом X–IX ст. до н. е."
    - "Гат був одним із п'яти філістимських міст, і Біблія пов'язує його передусім з Давидом. Голіят був «із Гета, ростом шістьох локот з пяддю», а після його падіння филистії втікали «до Гета й до Аккарону». Давид, що «втїк того ж дня від Саула до царя Анхуза в Гет», удавав божевільного біля його брами; пізніше він служив Анхусові з шістьма сотнями людей і отримав від нього Ціклаг. Коли впали Саул та Йонатан, Давид оплакував: «Не росказуйте у Гетї, не звіщайте по улицях Аскалону, щоб жіноцтво Филистійське не радувалось». Еффей Гатянин і його люди з Гата стояли при Давиді, коли збунтувався Авесалом."
    - "Розкопки під керівництвом Арена Маїра з Університету Бар-Ілан, що тривають із 1996 року, виявили облогову траншею, прокопану навколо міста наприкінці IX ст. до н. е., і товстий шар руйнування, що відповідає повідомленню: «Азаїл, царь Сирийський, й пійшов войною на Гет і звоював його». Гат так і не відновив своїх розмірів. Амос ставить його за застереження — «спустїтесь у Гет Филистійський», а пізніші пророки перелічують філістимські міста без нього. Черепок приблизно X ст. з цього місця має два імені, alwt і wlt, що нагадують ім'я Голіят, хоч і не стосуються його. Філістимські міста як група — предмет окремого питання."
  es:
    - "Gat es Tell es-Safi, un alto montículo de Israel donde el valle de Ela se abre a la llanura costera, a unos 38 km al oeste de Jerusalén en línea recta; el punto del mapa está sobre él. Quedaba a unos 9 km al sur de Ecrón y a unos 15 km valle abajo del lugar donde David se enfrentó a Goliat. La identificación se propuso en el siglo XIX; también se probó Tel Erani, cerca de Kiryat Gat, ciudad que lleva el nombre de Gat, pero hoy se acepta ampliamente Tell es-Safi porque encaja con la geografía bíblica y porque fue la mayor ciudad filistea de los siglos X y IX a. C."
    - "Gat fue una de las cinco ciudades filisteas, y la Biblia la vincula sobre todo con David. Goliat era «de Gath, y tenía de altura seis codos y un palmo», y tras su caída los filisteos huyeron «hasta Gath y Ecrón». Al huir de Saúl, David «vínose á Achîs rey de Gath» y fingió locura a su puerta; más tarde sirvió a Aquis con seiscientos hombres y recibió de él Siclag. Cuando cayeron Saúl y Jonatán, David se lamentó: «No lo denunciéis en Gath, no deis las nuevas en las plazas de Ascalón; porque no se alegren las hijas de los Filisteos». Itai el geteo y sus hombres de Gat se mantuvieron junto a David cuando Absalón se rebeló."
    - "Las excavaciones dirigidas por Aren Maeir, de la Universidad Bar-Ilan, desde 1996 han hallado una trinchera de asedio abierta en torno a la ciudad a finales del siglo IX a. C. y una gruesa capa de destrucción, que concuerda con la noticia de que «subió Hazael rey de Siria, y peleó contra Gath, y tomóla». Gat nunca recobró su tamaño. Amós la presenta como advertencia: «descended luego á Gath de los Palestinos», y los profetas posteriores enumeran las ciudades filisteas sin ella. Un tiesto de hacia el siglo X hallado en el yacimiento lleva dos nombres, alwt y wlt, que recuerdan el nombre de Goliat sin referirse a él. Las ciudades de los filisteos como conjunto son objeto de otra pregunta."
  pt:
    - "Gate é Tell es-Safi, um monte alto em Israel onde o vale de Elá se abre para a planície costeira, a cerca de 38 km a oeste de Jerusalém em linha reta; o ponto do mapa fica sobre ele. Ficava a cerca de 9 km ao sul de Ecrom e a uns 15 km vale abaixo do lugar onde Davi encontrou Golias. A identificação foi proposta no século XIX; Tel Erani, perto de Kiryat Gat, cidade que tem o nome de Gate, também foi tentada, mas hoje Tell es-Safi é amplamente aceita porque se ajusta à geografia bíblica e porque foi a maior cidade filisteia dos séculos X e IX a.C."
    - "Gate era uma das cinco cidades filisteias, e a Bíblia a liga sobretudo a Davi. Golias era “de Gate, cuja altura era de seis côvados e um palmo”, e depois de sua queda os filisteus fugiram “até Gate e Ecrom”. Fugindo de Saul, Davi “foi para Aquis, rei de Gate” e fingiu loucura à sua porta; mais tarde serviu a Aquis com seiscentos homens e recebeu dele Ziclague. Quando Saul e Jônatas caíram, Davi lamentou: “Não contem isso em Gate. Não publiquem nas ruas de Asquelom, para que não se alegrem as filhas dos filisteus.” Itai, o geteu, e seus homens de Gate permaneceram ao lado de Davi quando Absalão se revoltou."
    - "As escavações dirigidas por Aren Maeir, da Universidade Bar-Ilan, desde 1996 encontraram uma vala de cerco aberta em torno da cidade no final do século IX a.C. e uma espessa camada de destruição, o que concorda com o relato de que “Hazael, rei da Síria, subiu e lutou contra Gate, e a tomou”. Gate nunca recuperou o seu tamanho. Amós a apresenta como advertência, “desçam a Gate dos filisteus”, e os profetas posteriores enumeram as cidades filisteias sem ela. Um caco de cerâmica de cerca do século X, encontrado no sítio, traz dois nomes, alwt e wlt, que lembram o nome Golias sem se referirem a ele. As cidades dos filisteus como conjunto são tema de uma pergunta à parte."
  de:
    - "Gat ist Tell es-Safi, ein hoher Hügel in Israel, wo sich das Elatal zur Küstenebene öffnet, in der Luftlinie etwa 38 km westlich von Jerusalem; der Kartenpunkt steht darauf. Es lag etwa 9 km südlich von Ekron und rund 15 km talabwärts von der Stelle, an der David auf Goliat traf. Die Gleichsetzung wurde im 19. Jahrhundert vorgeschlagen; auch Tel Erani bei Kiryat Gat, einer nach Gat benannten Stadt, wurde erwogen, doch Tell es-Safi wird heute weithin anerkannt, weil es zur biblischen Geografie passt und weil es im 10. und 9. Jahrhundert v. Chr. die größte Philisterstadt war."
    - "Gat war eine der fünf Philisterstädte, und die Bibel verbindet es vor allem mit David. Goliat war „von Gath, sechs Ellen und eine Handbreit hoch“, und nach seinem Fall fielen die Philister erschlagen „bis gen Gath und gen Ekron“. David floh vor Saul und „kam zu Achis, dem König zu Gath“, und stellte sich an dessen Tor wahnsinnig; später diente er Achis mit sechshundert Mann und erhielt von ihm Ziklag. Als Saul und Jonatan gefallen waren, klagte David: „Sagt's nicht an zu Gath, verkündet's nicht auf den Gassen zu Askalon, daß sich nicht freuen die Töchter der Philister.“ Ittai, der Gatiter, und seine Männer aus Gat standen David bei, als Absalom sich erhob."
    - "Grabungen unter Leitung von Aren Maeir von der Bar-Ilan-Universität haben seit 1996 einen um die Stadt gezogenen Belagerungsgraben aus dem Ende des 9. Jahrhunderts v. Chr. und eine dicke Zerstörungsschicht gefunden, was zum Bericht passt: „zog Hasael, der König von Syrien, herauf und stritt wider Gath und gewann es“. Gat erlangte seine frühere Größe nie wieder. Amos hält es als Warnung vor, „zieht hinab gen Gath der Philister“, und die späteren Propheten führen die Philisterstädte ohne es auf. Eine Tonscherbe vom Ort aus der Zeit um das 10. Jahrhundert trägt zwei Namen, alwt und wlt, die an den Namen Goliat erinnern, ohne sich auf ihn zu beziehen. Die Städte der Philister als Gruppe sind Thema einer eigenen Frage."
  fr:
    - "Gath est Tell es-Safi, un haut tertre d’Israël où la vallée d’Éla débouche sur la plaine côtière, à environ 38 km à l’ouest de Jérusalem à vol d’oiseau ; le point de la carte s’y trouve. Elle était à environ 9 km au sud d’Ékron et à quelque 15 km en aval de la vallée par rapport au lieu où David rencontra Goliath. L’identification fut proposée au XIXe siècle ; Tel Erani, près de Kiryat-Gat, ville qui porte le nom de Gath, fut aussi envisagé, mais Tell es-Safi est aujourd’hui largement admis parce qu’il s’accorde avec la géographie biblique et parce qu’il fut la plus grande ville philistine des Xe et IXe siècles av. J.-C."
    - "Gath était l’une des cinq villes philistines, et la Bible la relie avant tout à David. Goliath « était de Gath, et il avait une taille de six coudées et un empan », et après sa chute les Philistins tombèrent sur le chemin « jusqu’à Gath et jusqu’à Ékron ». Fuyant Saül, David « arriva chez Akisch, roi de Gath » et fit l’insensé à sa porte ; plus tard il servit Akisch avec six cents hommes et reçut de lui Tsiklag. Quand Saül et Jonathan tombèrent, David se lamenta : « Ne l’annoncez point dans Gath, n’en publiez point la nouvelle dans les rues d’Askalon, de peur que les filles des Philistins ne se réjouissent. » Ittaï de Gath et ses hommes se tinrent aux côtés de David quand Absalom se révolta."
    - "Les fouilles dirigées depuis 1996 par Aren Maeir, de l’université Bar-Ilan, ont mis au jour une tranchée de siège creusée autour de la ville à la fin du IXe siècle av. J.-C. et une épaisse couche de destruction, ce qui correspond au récit selon lequel « Hazaël, roi de Syrie, monta et se battit contre Gath, dont il s’empara ». Gath ne retrouva jamais sa taille. Amos la propose en avertissement : « descendez à Gath chez les Philistins », et les prophètes plus tardifs énumèrent les villes philistines sans elle. Un tesson d’environ le Xe siècle, trouvé sur le site, porte deux noms, alwt et wlt, qui rappellent le nom de Goliath sans le désigner. Les villes des Philistins, prises ensemble, font l’objet d’une question distincte."
