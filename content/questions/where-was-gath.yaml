id: where-was-gath
question:
  en: "Where was Gath, the city of Goliath?"
  ru: "Где находился Геф, город Голиафа?"
  uk: "Де був Гат, місто Голіята?"
  es: "¿Dónde estaba Gat, la ciudad de Goliat?"
  pt: "Onde ficava Gate, a cidade de Golias?"
  de: "Wo lag Gat, die Stadt des Goliat?"
  fr: "Où se trouvait Gath, la ville de Goliath ?"
  pl: "Gdzie leżał Gat, miasto Goliata?"
  it: "Dov’era Gat, la città di Golia?"
  cs: "Kde ležel Gat, město Goliášovo?"
  nl: "Waar lag Gat, de stad van Goliat?"
  sv: "Var låg Gat, Goljats stad?"
  nb: "Hvor lå Gat, Goliats by?"
  tl: "Nasaan ang Gath, ang lungsod ni Goliath?"
  da: "Hvor lå Gat, Goliats by?"
  sr: "Где је био Гат, град Голијатов?"
answer:
  en:
    - "Gath is Tell es-Safi, a high mound in Israel where the valley of Elah opens onto the coastal plain, about 38 km west of Jerusalem in a straight line; the map point stands on it. It lay about 9 km south of Ekron and some 15 km down the valley from the place where David met Goliath. The identification was proposed in the nineteenth century; Tel Erani near Kiryat Gat, a town named after Gath, was also tried, but Tell es-Safi is now widely accepted because it fits the biblical geography and because it was the largest Philistine city of the tenth and ninth centuries BC."
    - "Gath was one of the five Philistine cities, and the Bible ties it above all to David. Goliath was “of Gath, whose height was six cubits and a span”, and after his fall the Philistines fled “even unto Gath, and unto Ekron”. Fleeing from Saul, David “went to Achish the king of Gath” and feigned madness at his gate; later he served Achish with six hundred men and received Ziklag from him. When Saul and Jonathan fell, David lamented: “Tell it not in Gath, publish it not in the streets of Askelon; lest the daughters of the Philistines rejoice.” Ittai the Gittite and his men from Gath stood by David when Absalom rebelled."
    - "Excavations led by Aren Maeir of Bar-Ilan University since 1996 have found a siege trench dug round the city in the late ninth century BC and a thick layer of destruction, which matches the report that “Hazael king of Syria went up, and fought against Gath, and took it”. Gath never regained its size. Amos holds it up as a warning, “go down to Gath of the Philistines”, and the later prophets list the Philistine cities without it. A potsherd of about the tenth century from the site bears two names, alwt and wlt, that recall the name Goliath without referring to him. The cities of the Philistines as a group are the subject of a separate question."
  ru:
    - "Геф — это Телль-эс-Сафи, высокий холм в Израиле там, где Долина дуба выходит на прибрежную равнину, примерно в 38 км к западу от Иерусалима по прямой; точка карты стоит на нём. Он лежал примерно в 9 км к югу от Екрона и километрах в 15 ниже по долине от места, где Давид вышел против Голиафа. Отождествление предложили ещё в XIX веке; пробовали и Тель-Эрани у Кирьят-Гата, города, названного в честь Гефа, но Телль-эс-Сафи теперь принят большинством: он подходит к библейской географии и был крупнейшим филистимским городом X–IX веков до н. э."
    - "Геф был одним из пяти филистимских городов, и Библия связывает его прежде всего с Давидом. Голиаф был «из Гефа; ростом он — шести локтей и пяди», а после его гибели филистимляне бежали «до Гефа и до Аккарона». Спасаясь от Саула, Давид «пришел к Анхусу, царю Гефскому» и притворился безумным у его ворот; позднее он служил Анхусу с шестьюстами мужей и получил от него Секелаг. Когда пали Саул и Ионафан, Давид плакал: «Не рассказывайте в Гефе, не возвещайте на улицах Аскалона, чтобы не радовались дочери Филистимлян». Еффей Гефянин и его люди из Гефа остались с Давидом, когда восстал Авессалом."
    - "Раскопки, которые с 1996 года ведёт Арен Маир из Бар-Иланского университета, обнаружили осадный ров, выкопанный вокруг города в конце IX века до н. э., и толстый слой разрушения; это совпадает с рассказом о том, что «выступил в поход Азаил, царь Сирийский, и пошел войною на Геф, и взял его». Прежних размеров Геф больше не достиг. Амос приводит его в пример как предостережение — «спуститесь в Геф Филистимский», а поздние пророки перечисляют филистимские города уже без него. На черепке около X века отсюда написаны два имени, alwt и wlt, напоминающие имя Голиаф, но к нему не относящиеся. О филистимских городах в целом рассказано в отдельном вопросе."
  uk:
    - "Гат — це Телль-ес-Сафі, високий пагорб в Ізраїлі, де долина Іла виходить на прибережну рівнину, приблизно за 38 км на захід від Єрусалима по прямій; точка на мапі стоїть на ньому. Він лежав приблизно за 9 км на південь від Екрона і приблизно за 15 км униз долиною від місця, де Давид зустрів Голіята. Це ототожнення запропоновано в XIX ст.; пробували й Тель-Ерані поблизу Кір'ят-Ґата, міста, названого на честь Гата, але нині Телль-ес-Сафі широко визнають, бо він відповідає біблійній географії й був найбільшим філістимським містом X–IX ст. до н. е."
    - "Гат був одним із п'яти філістимських міст, і Біблія пов'язує його передусім з Давидом. Голіят був «із Гета, ростом шістьох локот з пяддю», а після його падіння филистії втікали «до Гета й до Аккарону». Давид, що «втїк того ж дня від Саула до царя Анхуза в Гет», удавав божевільного біля його брами; пізніше він служив Анхусові з шістьма сотнями людей і отримав від нього Ціклаг. Коли впали Саул та Йонатан, Давид оплакував: «Не росказуйте у Гетї, не звіщайте по улицях Аскалону, щоб жіноцтво Филистійське не радувалось». Еффей Гатянин і його люди з Гата стояли при Давиді, коли збунтувався Авесалом."
    - "Розкопки під керівництвом Арена Маїра з Університету Бар-Ілан, що тривають із 1996 року, виявили облогову траншею, прокопану навколо міста наприкінці IX ст. до н. е., і товстий шар руйнування, що відповідає повідомленню: «Азаїл, царь Сирийський, й пійшов войною на Гет і звоював його». Гат так і не відновив своїх розмірів. Амос ставить його за застереження — «спустїтесь у Гет Филистійський», а пізніші пророки перелічують філістимські міста без нього. Черепок приблизно X ст. з цього місця має два імені, alwt і wlt, що нагадують ім'я Голіят, хоч і не стосуються його. Філістимські міста як група — предмет окремого питання."
  es:
    - "Gat es Tell es-Safi, un alto montículo de Israel donde el valle de Ela se abre a la llanura costera, a unos 38 km al oeste de Jerusalén en línea recta; el punto del mapa está sobre él. Quedaba a unos 9 km al sur de Ecrón y a unos 15 km valle abajo del lugar donde David se enfrentó a Goliat. La identificación se propuso en el siglo XIX; también se probó Tel Erani, cerca de Kiryat Gat, ciudad que lleva el nombre de Gat, pero hoy se acepta ampliamente Tell es-Safi porque encaja con la geografía bíblica y porque fue la mayor ciudad filistea de los siglos X y IX a. C."
    - "Gat fue una de las cinco ciudades filisteas, y la Biblia la vincula sobre todo con David. Goliat era «de Gath, y tenía de altura seis codos y un palmo», y tras su caída los filisteos huyeron «hasta Gath y Ecrón». Al huir de Saúl, David «vínose á Achîs rey de Gath» y fingió locura a su puerta; más tarde sirvió a Aquis con seiscientos hombres y recibió de él Siclag. Cuando cayeron Saúl y Jonatán, David se lamentó: «No lo denunciéis en Gath, no deis las nuevas en las plazas de Ascalón; porque no se alegren las hijas de los Filisteos». Itai el geteo y sus hombres de Gat se mantuvieron junto a David cuando Absalón se rebeló."
    - "Las excavaciones dirigidas por Aren Maeir, de la Universidad Bar-Ilan, desde 1996 han hallado una trinchera de asedio abierta en torno a la ciudad a finales del siglo IX a. C. y una gruesa capa de destrucción, que concuerda con la noticia de que «subió Hazael rey de Siria, y peleó contra Gath, y tomóla». Gat nunca recobró su tamaño. Amós la presenta como advertencia: «descended luego á Gath de los Palestinos», y los profetas posteriores enumeran las ciudades filisteas sin ella. Un tiesto de hacia el siglo X hallado en el yacimiento lleva dos nombres, alwt y wlt, que recuerdan el nombre de Goliat sin referirse a él. Las ciudades de los filisteos como conjunto son objeto de otra pregunta."
  pt:
    - "Gate é Tell es-Safi, um monte alto em Israel onde o vale de Elá se abre para a planície costeira, a cerca de 38 km a oeste de Jerusalém em linha reta; o ponto do mapa fica sobre ele. Ficava a cerca de 9 km ao sul de Ecrom e a uns 15 km vale abaixo do lugar onde Davi encontrou Golias. A identificação foi proposta no século XIX; Tel Erani, perto de Kiryat Gat, cidade que tem o nome de Gate, também foi tentada, mas hoje Tell es-Safi é amplamente aceita porque se ajusta à geografia bíblica e porque foi a maior cidade filisteia dos séculos X e IX a.C."
    - "Gate era uma das cinco cidades filisteias, e a Bíblia a liga sobretudo a Davi. Golias era “de Gate, cuja altura era de seis côvados e um palmo”, e depois de sua queda os filisteus fugiram “até Gate e Ecrom”. Fugindo de Saul, Davi “foi para Aquis, rei de Gate” e fingiu loucura à sua porta; mais tarde serviu a Aquis com seiscentos homens e recebeu dele Ziclague. Quando Saul e Jônatas caíram, Davi lamentou: “Não contem isso em Gate. Não publiquem nas ruas de Asquelom, para que não se alegrem as filhas dos filisteus.” Itai, o geteu, e seus homens de Gate permaneceram ao lado de Davi quando Absalão se revoltou."
    - "As escavações dirigidas por Aren Maeir, da Universidade Bar-Ilan, desde 1996 encontraram uma vala de cerco aberta em torno da cidade no final do século IX a.C. e uma espessa camada de destruição, o que concorda com o relato de que “Hazael, rei da Síria, subiu e lutou contra Gate, e a tomou”. Gate nunca recuperou o seu tamanho. Amós a apresenta como advertência, “desçam a Gate dos filisteus”, e os profetas posteriores enumeram as cidades filisteias sem ela. Um caco de cerâmica de cerca do século X, encontrado no sítio, traz dois nomes, alwt e wlt, que lembram o nome Golias sem se referirem a ele. As cidades dos filisteus como conjunto são tema de uma pergunta à parte."
  de:
    - "Gat ist Tell es-Safi, ein hoher Hügel in Israel, wo sich das Elatal zur Küstenebene öffnet, in der Luftlinie etwa 38 km westlich von Jerusalem; der Kartenpunkt steht darauf. Es lag etwa 9 km südlich von Ekron und rund 15 km talabwärts von der Stelle, an der David auf Goliat traf. Die Gleichsetzung wurde im 19. Jahrhundert vorgeschlagen; auch Tel Erani bei Kiryat Gat, einer nach Gat benannten Stadt, wurde erwogen, doch Tell es-Safi wird heute weithin anerkannt, weil es zur biblischen Geografie passt und weil es im 10. und 9. Jahrhundert v. Chr. die größte Philisterstadt war."
    - "Gat war eine der fünf Philisterstädte, und die Bibel verbindet es vor allem mit David. Goliat war „von Gath, sechs Ellen und eine Handbreit hoch“, und nach seinem Fall fielen die Philister erschlagen „bis gen Gath und gen Ekron“. David floh vor Saul und „kam zu Achis, dem König zu Gath“, und stellte sich an dessen Tor wahnsinnig; später diente er Achis mit sechshundert Mann und erhielt von ihm Ziklag. Als Saul und Jonatan gefallen waren, klagte David: „Sagt's nicht an zu Gath, verkündet's nicht auf den Gassen zu Askalon, daß sich nicht freuen die Töchter der Philister.“ Ittai, der Gatiter, und seine Männer aus Gat standen David bei, als Absalom sich erhob."
    - "Grabungen unter Leitung von Aren Maeir von der Bar-Ilan-Universität haben seit 1996 einen um die Stadt gezogenen Belagerungsgraben aus dem Ende des 9. Jahrhunderts v. Chr. und eine dicke Zerstörungsschicht gefunden, was zum Bericht passt: „zog Hasael, der König von Syrien, herauf und stritt wider Gath und gewann es“. Gat erlangte seine frühere Größe nie wieder. Amos hält es als Warnung vor, „zieht hinab gen Gath der Philister“, und die späteren Propheten führen die Philisterstädte ohne es auf. Eine Tonscherbe vom Ort aus der Zeit um das 10. Jahrhundert trägt zwei Namen, alwt und wlt, die an den Namen Goliat erinnern, ohne sich auf ihn zu beziehen. Die Städte der Philister als Gruppe sind Thema einer eigenen Frage."
  fr:
    - "Gath est Tell es-Safi, un haut tertre d’Israël où la vallée d’Éla débouche sur la plaine côtière, à environ 38 km à l’ouest de Jérusalem à vol d’oiseau ; le point de la carte s’y trouve. Elle était à environ 9 km au sud d’Ékron et à quelque 15 km en aval de la vallée par rapport au lieu où David rencontra Goliath. L’identification fut proposée au XIXe siècle ; Tel Erani, près de Kiryat-Gat, ville qui porte le nom de Gath, fut aussi envisagé, mais Tell es-Safi est aujourd’hui largement admis parce qu’il s’accorde avec la géographie biblique et parce qu’il fut la plus grande ville philistine des Xe et IXe siècles av. J.-C."
    - "Gath était l’une des cinq villes philistines, et la Bible la relie avant tout à David. Goliath « était de Gath, et il avait une taille de six coudées et un empan », et après sa chute les Philistins tombèrent sur le chemin « jusqu’à Gath et jusqu’à Ékron ». Fuyant Saül, David « arriva chez Akisch, roi de Gath » et fit l’insensé à sa porte ; plus tard il servit Akisch avec six cents hommes et reçut de lui Tsiklag. Quand Saül et Jonathan tombèrent, David se lamenta : « Ne l’annoncez point dans Gath, n’en publiez point la nouvelle dans les rues d’Askalon, de peur que les filles des Philistins ne se réjouissent. » Ittaï de Gath et ses hommes se tinrent aux côtés de David quand Absalom se révolta."
    - "Les fouilles dirigées depuis 1996 par Aren Maeir, de l’université Bar-Ilan, ont mis au jour une tranchée de siège creusée autour de la ville à la fin du IXe siècle av. J.-C. et une épaisse couche de destruction, ce qui correspond au récit selon lequel « Hazaël, roi de Syrie, monta et se battit contre Gath, dont il s’empara ». Gath ne retrouva jamais sa taille. Amos la propose en avertissement : « descendez à Gath chez les Philistins », et les prophètes plus tardifs énumèrent les villes philistines sans elle. Un tesson d’environ le Xe siècle, trouvé sur le site, porte deux noms, alwt et wlt, qui rappellent le nom de Goliath sans le désigner. Les villes des Philistins, prises ensemble, font l’objet d’une question distincte."
  pl:
    - "Gat to Tell es-Safi, wysokie wzgórze w Izraelu, gdzie dolina Ela otwiera się na nadmorską równinę, około 38 km na zachód od Jerozolimy w linii prostej; stoi na nim punkt na mapie. Leżało około 9 km na południe od Ekronu i około 15 km w dół doliny od miejsca, gdzie Dawid spotkał Goliata. Identyfikację zaproponowano w XIX wieku; próbowano też Tel Erani koło Kiryat Gat, miasta nazwanego od Gat, ale Tell es-Safi jest dziś powszechnie przyjmowane, bo pasuje do geografii biblijnej i było największym miastem filistyńskim X i IX wieku p.n.e."
    - "Gat było jednym z pięciu miast filistyńskich, a Biblia wiąże je przede wszystkim z Dawidem. Goliat był „z Get, wzwyż na sześciu łokci i na piędzi”, a po jego upadku Filistyni uciekali „aż do Get i aż do Akkaronu”. Uciekając przed Saulem, Dawid „przyszedł do Achisa, króla Getskiego” i udawał szaleńca u jego bramy; później służył Achiszowi z sześciuset ludźmi i otrzymał od niego Siklag. Gdy polegli Saul i Jonatan, Dawid lamentował: „Nie powiadajcież w Get, a nie rozgłaszajcie po ulicach w Aszkalonie, aby się snać nie weseliły córki Filistyńskie”. Ittaj Gatejczyk i jego ludzie z Gat stanęli przy Dawidzie, gdy zbuntował się Absalom."
    - "Wykopaliska prowadzone od 1996 roku przez Arena Maeira z Uniwersytetu Bar-Ilan odsłoniły rów oblężniczy wykopany wokół miasta pod koniec IX wieku p.n.e. i grubą warstwę zniszczenia, co zgadza się z doniesieniem, że „wyciągnął Hazael, król Syryjski, a walczył przeciwko Giet, i wziął je”. Gat nie odzyskało już dawnej wielkości. Amos stawia je jako przestrogę: „zstąpcie do Giet Filistyńskiego”, a późniejsi prorocy wymieniają miasta filistyńskie bez niego. Skorupa z tego miejsca z około X wieku nosi dwa imiona, alwt i wlt, które przypominają imię Goliat, nie odnosząc się do niego. Miastom filistyńskim jako całości poświęcone jest osobne pytanie."
  it:
    - "Gat è Tell es-Safi, un alto tell in Israele dove la valle di Ela si apre sulla pianura costiera, a circa 38 km a ovest di Gerusalemme in linea d’aria; il punto della mappa si trova su di esso. Sorgeva a circa 9 km a sud di Ekron e a circa 15 km a valle del luogo in cui Davide incontrò Golia. L’identificazione fu proposta nell’Ottocento; fu presa in considerazione anche Tel Erani presso Kiryat Gat, una città che prende il nome da Gat, ma Tell es-Safi è oggi largamente accettata perché si accorda con la geografia biblica e perché fu la più grande città filistea del X e del IX secolo a.C."
    - "Gat era una delle cinque città filistee, e la Bibbia la lega soprattutto a Davide. Golia era «di Gath, alto sei cubiti e un palmo», e dopo la sua caduta i Filistei fuggirono «fino a Gath e fino ad Ekron». Fuggendo da Saul, Davide «andò da Akis, re di Gath» e finse la pazzia alla sua porta; più tardi servì Akis con seicento uomini e ricevette da lui Siclag. Quando Saul e Gionata caddero, Davide levò il suo lamento: «Non ne recate la nuova a Gath, non lo pubblicate per le strade d’Askalon; le figliuole de’ Filistei ne gioirebbero». Ittai il Gatteo e i suoi uomini di Gat rimasero accanto a Davide quando Assalonne si ribellò."
    - "Gli scavi condotti da Aren Maeir dell’Università Bar-Ilan dal 1996 hanno portato alla luce una trincea d’assedio scavata attorno alla città nel tardo IX secolo a.C. e un denso strato di distruzione, che concorda con il racconto che «Hazael, re di Siria, salì a combattere contro Gath, e la prese». Gat non riacquistò mai le sue dimensioni. Amos la porta come monito, «scendete a Gath dei Filistei», e i profeti successivi elencano le città filistee senza di essa. Un coccio del X secolo circa proveniente dal sito reca due nomi, alwt e wlt, che richiamano il nome Golia senza riferirsi a lui. Le città dei Filistei come gruppo sono oggetto di una domanda a parte."
  cs:
    - "Gat je Tell es-Safí, vysoký pahorek v Izraeli, kde se Élské údolí otevírá do pobřežní roviny, vzdušnou čarou asi 38 km západně od Jeruzaléma; stojí na něm bod na mapě. Ležel asi 9 km jižně od Ekronu a zhruba 15 km po proudu údolí od místa, kde se David setkal s Goliášem. Ztotožnění bylo navrženo v 19. století; zkoušel se i Tel Erani u Kirjat Gatu, města pojmenovaného po Gatu, ale Tell es-Safí je dnes široce přijímán, protože odpovídá biblické geografii a protože byl největším pelištejským městem 10. a 9. století př. n. l."
    - "Gat byl jedním z pěti pelištejských měst a Bible jej spojuje především s Davidem. Goliáš byl „z Gát, zvýší šesti loket a dlani“ a po jeho pádu Pelištejci prchali „až do Gát a až do Akaron“. Prchaje před Saulem, David „přišel k Achisovi králi Gát“ a předstíral šílenství u jeho brány; později sloužil Achišovi se šesti sty muži a dostal od něho Siklag. Když padli Saul a Jonatan, David naříkal: „Neoznamujtež v Gát, ani toho ohlašujte na ulicích Aškalon, aby se neveselily dcery Filistinských.“ Itaj Gatský a jeho muži z Gatu stáli při Davidovi, když se Abšalom vzbouřil."
    - "Vykopávky, které od roku 1996 vede Aren Maeir z univerzity Bar-Ilan, odkryly obléhací příkop vykopaný kolem města na konci 9. století př. n. l. a silnou vrstvu zkázy, což odpovídá zprávě, že „vytáhl Hazael král Syrský, a bojoval proti Gát a dobyl ho“. Gat už nikdy nedosáhl své velikosti. Amos jej uvádí jako výstrahu, „sstupte do Gát Filistinských“, a pozdější proroci vypočítávají pelištejská města bez něho. Střep zhruba z 10. století z naleziště nese dvě jména, alwt a wlt, která připomínají jméno Goliáš, aniž se k němu vztahují. Pelištejská města jako celek jsou předmětem samostatné otázky."
  nl:
    - "Gat is Tell es-Safi, een hoge heuvel in Israël waar de vallei van Ela uitkomt op de kustvlakte, hemelsbreed ongeveer 38 km ten westen van Jeruzalem; het punt op de kaart staat erop. Het lag ongeveer 9 km ten zuiden van Ekron en zo'n 15 km stroomafwaarts in de vallei van de plaats waar David Goliat ontmoette. De identificatie werd in de negentiende eeuw voorgesteld; ook Tel Erani bij Kiryat Gat, een stad die naar Gat is genoemd, werd beproefd, maar Tell es-Safi wordt nu algemeen aanvaard omdat het past bij de bijbelse geografie en omdat het de grootste Filistijnse stad van de tiende en de negende eeuw v.Chr. was."
    - "Gat was een van de vijf Filistijnse steden, en de Bijbel verbindt het vooral met David. Goliat was “van Gath; zijn hoogte was zes ellen en een span”, en na zijn val vluchtten de Filistijnen “tot aan Gath, en tot aan Ekron”. Op de vlucht voor Saul kwam David “tot Achis, den koning van Gath” en veinsde hij krankzinnigheid bij diens poort; later diende hij Achis met zeshonderd man en kreeg van hem Ziklag. Toen Saul en Jonatan waren gevallen, klaagde David: “Verkondigt het niet te Gath, boodschapt het niet op de straten van Askelon; opdat de dochters der Filistijnen zich niet verblijden.” Ittai uit Gat en zijn mannen stonden David bij toen Absalom in opstand kwam."
    - "Opgravingen onder leiding van Aren Maeir van de Bar-Ilan-universiteit hebben sinds 1996 een belegeringsgracht gevonden die aan het eind van de negende eeuw v.Chr. rond de stad was gegraven, en een dikke verwoestingslaag, wat overeenkomt met het bericht: “trok Hazael, de koning van Syrië op, en krijgde tegen Gath, en nam haar in”. Gat kwam nooit meer op zijn vroegere omvang. Amos houdt het als waarschuwing voor, “trekt af naar Gath der Filistijnen”, en de latere profeten noemen de Filistijnse steden zonder Gat. Een potscherf van ongeveer de tiende eeuw uit de vindplaats draagt twee namen, alwt en wlt, die doen denken aan de naam Goliat zonder naar hem te verwijzen. De steden van de Filistijnen als groep zijn het onderwerp van een aparte vraag."
  sv:
    - "Gat är Tell es-Safi, en hög kulle i Israel där Elas dal öppnar sig mot kustslätten, omkring 38 km väster om Jerusalem i fågelvägen; kartpunkten står på den. Den låg omkring 9 km söder om Ekron och ungefär 15 km nedåt dalen från platsen där David mötte Goljat. Identifieringen föreslogs på 1800-talet; Tel Erani nära Kiryat Gat, en stad uppkallad efter Gat, prövades också, men Tell es-Safi är nu allmänt godtagen eftersom den stämmer med den bibliska geografin och eftersom den var den största filisteiska staden under 900- och 800-talen f.Kr."
    - "Gat var en av de fem filisteiska städerna, och Bibeln knyter den framför allt till David. Goljat var ”från Gat; han var sex alnar och ett kvarter lång”, och efter hans fall flydde filistéerna ”ända till Gat och ända till Ekron”. På flykt undan Saul ”kom [David] till Akis, konungen i Gat” och ställde sig vansinnig vid hans port; senare tjänade han Akis med sex hundra man och fick Siklag av honom. När Saul och Jonatan föll klagade David: ”Förkunnen det icke i Gat, bebåden det ej på Askelons gator, för att filistéernas döttrar icke må glädja sig.” Gatiten Ittaj och hans män från Gat stod vid Davids sida när Absalom gjorde uppror."
    - "Utgrävningar under ledning av Aren Maeir vid Bar-Ilan-universitetet sedan 1996 har funnit ett belägringsdike grävt runt staden i slutet av 800-talet f.Kr. och ett tjockt förstörelselager, vilket stämmer med berättelsen att ”Hasael, konungen i Aram, drog upp och belägrade Gat och intog det”. Gat återfick aldrig sin forna storlek. Amos håller upp den som en varning, ”faren så ned till filistéernas Gat”, och de senare profeterna förtecknar de filisteiska städerna utan den. En lerskärva från omkring 900-talet f.Kr. från platsen bär två namn, alwt och wlt, som påminner om namnet Goljat utan att syfta på honom. De filisteiska städerna som grupp är ämnet för en egen fråga."
  nb:
    - "Gat er Tell es-Safi, en høy haug i Israel der Ela-dalen åpner seg mot kystsletten, omtrent 38 km vest for Jerusalem i luftlinje; kartpunktet står på den. Byen lå omtrent 9 km sør for Ekron og omtrent 15 km nede i dalen fra stedet der David møtte Goliat. Identifiseringen ble foreslått på 1800-tallet; Tel Erani nær Kiryat Gat, en by oppkalt etter Gat, ble også prøvd, men Tell es-Safi er nå vidt akseptert fordi det passer med den bibelske geografien og fordi det var den største filisterbyen på 900- og 800-tallet f.Kr."
    - "Gat var en av de fem filisterbyene, og Bibelen knytter den fremfor alt til David. Goliat var «fra Gat; han var seks alen og et spann høi», og etter hans fall ble filistrene forfulgt «helt frem til Gat og til Ekron». David flyktet fra Saul, og «han kom til Akis, kongen i Gat»; der lot han som han var vanvittig ved byporten, og senere tjente han Akisj med seks hundre mann og fikk Siklag av ham. Da Saul og Jonatan falt, sørget David: «Forkynn det ikke i Gat, meld det ikke på gatene i Askalon, at ikke filistrenes døtre skal glede sig». Ittai, gittitten, og hans menn fra Gat stod ved Davids side da Absalom gjorde opprør."
    - "Utgravninger ledet av Aren Maeir ved Bar-Ilan-universitetet siden 1996 har funnet en beleiringsgrøft gravd rundt byen på slutten av 800-tallet f.Kr. og et tykt ødeleggelseslag, noe som stemmer med beretningen om at «drog Syrias konge Hasael op og stred mot Gat og inntok det». Gat fikk aldri tilbake sin tidligere størrelse. Amos holder den frem som en advarsel, «stig ned til Gat i Filisterland», og de senere profetene oppregner filisterbyene uten den. Et potteskår fra omkring 900-tallet fra stedet bærer to navn, alwt og wlt, som minner om navnet Goliat uten å referere til ham. Filisterbyene som gruppe er temaet for et eget spørsmål."
  tl:
    - "Ang Gath ay ang Tell es-Safi, isang mataas na burol sa Israel kung saan bumubukas ang lambak ng Ela sa kapatagang baybayin, mga 38 km sa kanluran ng Jerusalem sa tuwid na guhit; nakatayo roon ang punto sa mapa. Mga 9 km ito sa timog ng Ecron at mga 15 km pababa ng lambak mula sa pook kung saan nagkita sina David at Goliath. Iminungkahi ang pagkakakilanlang ito noong ika-19 na siglo; sinubukan din ang Tel Erani malapit sa Kiryat Gat, isang bayang ipinangalan sa Gath, ngunit tinatanggap na ngayon nang malawakan ang Tell es-Safi dahil umaakma ito sa heograpiya ng Biblia at dahil ito ang pinakamalaking lungsod ng mga Filisteo noong ika-10 at ika-9 na siglo BK."
    - "Ang Gath ay isa sa limang lungsod ng mga Filisteo, at iniuugnay ito ng Biblia higit sa lahat kay David. Si Goliath ay “taga Gath, na ang taas ay anim na siko at isang dangkal”, at pagkabuwal niya ay tumakas ang mga Filisteo “hanggang sa Gath, at sa Ecron”. Sa pagtakas kay Saul, si David ay “naparoon kay Achis na hari sa Gath” at nagkunwaring baliw sa pintuan nito; nang maglaon ay naglingkod siya kay Achis kasama ng animnaraang lalake at tumanggap mula rito ng Siclag. Nang mabuwal sina Saul at Jonathan, tumangis si David: “Huwag ninyong saysayin sa Gath, Huwag ninyong ihayag sa mga lansangan ng Ascalon; Baka ang mga anak na babae ng mga Filisteo ay mangagalak.” Si Ittai na Getheo at ang kaniyang mga tauhan mula sa Gath ay nanatili sa panig ni David nang maghimagsik si Absalom."
    - "Ang mga paghuhukay na pinangunahan ni Aren Maeir ng Pamantasang Bar-Ilan mula 1996 ay nakatuklas ng isang trinsera ng pagkubkob na hinukay sa palibot ng lungsod noong huling bahagi ng ika-9 na siglo BK at isang makapal na patong ng pagkawasak, na umaayon sa ulat na “si Hazael na hari sa Siria ay umahon, at lumaban sa Gath, at sinakop yaon”. Hindi na nabawi ng Gath ang dating laki. Ginagamit ito ni Amos bilang babala, “magsibaba kayo sa Gath ng mga Filisteo”, at inililista ng mga huling propeta ang mga lungsod ng mga Filisteo nang wala ito. May isang piraso ng basag na palayok mula sa pook, noong mga ika-10 siglo, na may dalawang pangalan, alwt at wlt, na nagpapaalala sa pangalang Goliath nang hindi tumutukoy sa kaniya. Ang mga lungsod ng mga Filisteo bilang isang pangkat ay paksa ng hiwalay na tanong."
  da:
    - "Gat er Tell es-Safi, en høj tell i Israel, hvor Ela-dalen åbner sig mod kystsletten, ca. 38 km vest for Jerusalem i fugleflugt; kortets punkt står på den. Byen lå ca. 9 km syd for Ekron og omkring 15 km nede ad dalen fra stedet, hvor David mødte Goliat. Identifikationen blev foreslået i 1800-tallet; Tel Erani nær Kiryat Gat, en by opkaldt efter Gat, blev også prøvet, men Tell es-Safi er nu bredt accepteret, fordi den passer til den bibelske geografi, og fordi den var den største filisterby i 900- og 800-tallet f.Kr."
    - "Gat var en af de fem filisterbyer, og Bibelen knytter den frem for alt til David. Goliat var »Goliath af Gath, han var seks Alen og en Haandbred høj«, og efter hans fald flygtede filisterne »indtil Gath og indtil Ekron«. På flugt fra Saul kom David »til Akis, Kongen i Gath« og lod som om, han var vanvittig, ved dens port; senere tjente han Akisj med seks hundrede mand og modtog Siklag af ham. Da Saul og Jonatan faldt, klagede David: »Giver det ikke til Kende i Gath, bebuder det ikke paa Gaderne i Askalon, at Filisternes Døtre ikke skulle glæde sig.« Ittaj fra Gat og hans mænd stod ved Davids side, da Absalon gjorde oprør."
    - "Udgravninger ledet af Aren Maeir fra Bar-Ilan-universitetet siden 1996 har fundet en belejringsgrav, gravet rundt om byen i slutningen af 800-tallet f.Kr., og et tykt ødelæggelseslag, hvilket svarer til beretningen: »Da drog Hasael, Kongen af Syrien, op og stred imod Gath og indtog den.« Gat genvandt aldrig sin størrelse. Amos holder den frem som en advarsel, »drager ned til Filisternes Gath!«, og de senere profeter opregner filisterbyerne uden den. Et potteskår fra ca. 900-tallet fra stedet bærer to navne, alwt og wlt, der minder om navnet Goliat uden at henvise til ham. Filisternes byer som gruppe er emnet for et selvstændigt spørgsmål."
  sr:
    - "Гат је Тел ес-Сафи, висока хумка у Израелу где се долина Ила отвара ка приобалној равници, око 38 км западно од Јерусалима ваздушном линијом; тачка на карти стоји на њој. Лежао је око 9 км јужно од Акарона и неких 15 км низ долину од места где се Давид срео са Голијатом. Поистовећење је предложено у деветнаестом веку; покушавало се и са Тел Еранијем код Кирјат Гата, града названог по Гату, али се Тел ес-Сафи данас широко прихвата зато што одговара библијској географији и зато што је био највећи филистејски град десетог и деветог века п. н. е."
    - "Гат је био један од пет филистејских градова, а Библија га највише везује за Давида. Голијат је био „из Гата, висок шест лаката и пед“, а после његовог пада Филистеји су бежали „до Гата и до Акарона“. Бежећи од Саула, Давид „дође к Ахису, цару гатском“ и пред његовим вратима се претварао да је луд; касније је са шест стотина људи служио Ахиса и од њега примио Сиклаг. Кад су пали Саул и Јонатан, Давид је запевао: „Не казујте у Гату, и не разглашујте по улицама аскалонским, да се не веселе кћери филистејске.“ Итај Гетејин и његови људи из Гата стајали су уз Давида кад се Авесалом побунио."
    - "Ископавања која од 1996. води Арен Мајер са Универзитета Бар-Илан открила су опсадни ров ископан око града крајем деветог века п. н. е. и дебео слој разарања, што одговара извештају да „изађе Азаило, цар сирски, и удари на Гат и узе га“. Гат никад није повратио своју величину. Амос га истиче као опомену, „сиђите у Гат филистејски“, а потоњи пророци набрајају филистејске градове без њега. На једном црепу са тог налазишта из око десетог века налазе се два имена, алвт и влт, која подсећају на име Голијат, а не односе се на њега. Филистејски градови као целина тема су посебног питања."
