id: when-did-babylon-destroy-jerusalem
question:
  en: "When did Babylon destroy Jerusalem?"
  ru: "Когда Вавилон разрушил Иерусалим?"
  uk: "Коли Вавилон зруйнував Єрусалим?"
  es: "¿Cuándo destruyó Babilonia Jerusalén?"
  pt: "Quando Babilônia destruiu Jerusalém?"
  de: "Wann zerstörte Babylon Jerusalem?"
  fr: "Quand Babylone a-t-elle détruit Jérusalem ?"
  pl: "Kiedy Babilon zniszczył Jerozolimę?"
  it: "Quando Babilonia distrusse Gerusalemme?"
  nl: "Wanneer verwoestte Babylon Jeruzalem?"
  cs: "Kdy Babylón zničil Jeruzalém?"
  sv: "När förstörde Babylon Jerusalem?"
  nb: "Når ødela Babylon Jerusalem?"
  tl: "Kailan winasak ng Babilonia ang Jerusalem?"
  da: "Hvornår ødelagde Babylon Jerusalem?"
  sr: "Када је Вавилон разорио Јерусалим?"
  hu: "Mikor pusztította el Babilon Jeruzsálemet?"
  fi: "Milloin Babylon tuhosi Jerusalemin?"
  vi: "Ba-by-lôn phá hủy Giê-ru-sa-lem khi nào?"
  ro: "Când a distrus Babilonul Ierusalimul?"
  bg: "Кога Вавилон е разрушил Йерусалим?"
answer:
  en:
    - "Nebuchadnezzar's army burned Jerusalem and the Temple in 587 or 586 BC, in the nineteenth year of his reign; the year is disputed, and the map's tour of the exile shows 587 BC."
    - 'The siege began in the ninth year of Zedekiah, the last king of Judah, in the tenth month, and lasted about eighteen months; when famine broke the city the wall was breached, Zedekiah fled and was caught in the plains of Jericho, and he was blinded at Riblah after his sons were killed before him. A month later Nebuzaradan, captain of the guard, came to Jerusalem: "And he burnt the house of the LORD, and the king''s house, and all the houses of Jerusalem", and the Chaldean army broke down the walls. The people were carried to Babylon, and only the poorest were left to work the land.'
    - "This was the second fall of the city. In 597 BC Jehoiachin had surrendered and been taken to Babylon with the craftsmen and the treasures of the Temple, as 2 Kings and the Babylonian Chronicle both record; Nebuchadnezzar set Zedekiah on the throne, and his revolt brought the end. The year of the final fall turns on how the regnal years of Nebuchadnezzar and Zedekiah are counted; the Babylonian Chronicle breaks off before it. The exile lasted until Cyrus let the people return in 538 BC."
  ru:
    - "Войско Навуходоносора сожгло Иерусалим и Храм в 587 или 586 г. до н. э., в девятнадцатый год его царствования; год спорен, тур пленения на карте показывает 587 г."
    - "Осада началась в девятый год Седекии, последнего царя Иудеи, в десятый месяц, и длилась около полутора лет; когда голод сломил город, стена была проломлена, Седекия бежал и был схвачен на равнинах Иерихонских, а в Ривле его ослепили, убив перед ним сыновей. Месяц спустя в Иерусалим пришёл Навузардан, начальник телохранителей: «и сжег дом Господень и дом царя, и все домы в Иерусалиме», а войско Халдейское разрушило стены. Народ увели в Вавилон, оставив лишь бедных обрабатывать землю."
    - "Это было второе падение города. В 597 г. до н. э. Иехония сдался и был уведён в Вавилон вместе с ремесленниками и сокровищами Храма, о чём сообщают и 4-я книга Царств, и Вавилонская хроника; Навуходоносор посадил на престол Седекию, и его мятеж привёл к концу. Год окончательного падения зависит от того, как считать годы царствования Навуходоносора и Седекии; Вавилонская хроника обрывается раньше. Плен длился до 538 г. до н. э., когда Кир разрешил народу вернуться."
  uk:
    - "Військо Навуходоносора спалило Єрусалим і Храм 587 або 586 р. до н. е., у дев'ятнадцятому році його царювання; рік спірний, і тур вигнання на мапі показує 587 р. до н. е."
    - "Облога почалася в дев'ятому році Седекії, останнього царя Юдеї, в десятому місяці й тривала близько вісімнадцяти місяців; коли голод зламав місто, мур було пробито, Седекія втік і був схоплений на рівнинах Єрихону, а в Рівлі його осліплено після того, як перед ним було вбито його синів. Через місяць Навузардан, начальник охорони, прибув до Єрусалиму: «спалив храм Господень і царську палату й усї будинки в Ерусалимі», а халдейське військо зруйнувало мури. Народ було відведено у Вавилон, і лише найбідніших залишили обробляти землю."
    - "Це було друге падіння міста. 597 р. до н. е. Єхонія здався й був відведений у Вавилон разом з ремісниками та скарбами Храму, як записано і в 2 Цар, і у Вавилонській хроніці; Навуходоносор посадив на престол Седекію, і його повстання призвело до кінця. Рік остаточного падіння залежить від того, як рахувати роки правління Навуходоносора й Седекії; Вавилонська хроніка уривається раніше. Вигнання тривало, доки Кір 538 р. до н. е. не дозволив народові повернутися."
  es:
    - "El ejército de Nabucodonosor incendió Jerusalén y el Templo en el 587 o 586 a. C., en el año diecinueve de su reinado; el año es discutido, y el recorrido del exilio en el mapa muestra el 587 a. C."
    - "El asedio comenzó en el año noveno de Sedequías, el último rey de Judá, en el mes décimo, y duró unos dieciocho meses; cuando el hambre quebró la ciudad se abrió brecha en el muro, Sedequías huyó y fue capturado en las llanuras de Jericó, y fue cegado en Ribla después de que mataran a sus hijos en su presencia. Un mes después Nabuzaradán, capitán de la guardia, llegó a Jerusalén: «Y quemó la casa de Jehová, y la casa del rey, y todas las casas de Jerusalem», y el ejército caldeo derribó los muros. El pueblo fue llevado a Babilonia, y solo se dejó a los más pobres para trabajar la tierra."
    - "Esta fue la segunda caída de la ciudad. En el 597 a. C. Joaquín se había rendido y había sido llevado a Babilonia con los artesanos y los tesoros del Templo, como registran tanto 2 Reyes como la Crónica babilónica; Nabucodonosor puso a Sedequías en el trono, y su rebelión trajo el fin. El año de la caída final depende de cómo se cuenten los años de reinado de Nabucodonosor y de Sedequías; la Crónica babilónica se interrumpe antes de ello. El exilio duró hasta que Ciro permitió el regreso del pueblo en el 538 a. C."
  pt:
    - "O exército de Nabucodonosor incendiou Jerusalém e o Templo em 587 ou 586 a.C., no décimo nono ano de seu reinado; o ano é disputado, e o roteiro do exílio no mapa mostra 587 a.C."
    - "O cerco começou no nono ano de Zedequias, o último rei de Judá, no décimo mês, e durou cerca de dezoito meses; quando a fome quebrou a cidade, o muro foi rompido, Zedequias fugiu e foi apanhado nas planícies de Jericó, e foi cegado em Ribla depois que seus filhos foram mortos diante dele. Um mês depois Nebuzaradã, capitão da guarda, chegou a Jerusalém: “Ele incendiou a casa do SENHOR, a casa do rei e todas as casas de Jerusalém”, e o exército dos caldeus derrubou os muros. O povo foi levado para a Babilônia, e só os mais pobres foram deixados para lavrar a terra."
    - "Foi a segunda queda da cidade. Em 597 a.C. Joaquim se rendera e fora levado à Babilônia com os artesãos e os tesouros do Templo, como registram 2 Reis e a Crônica Babilônica; Nabucodonosor pôs Zedequias no trono, e sua revolta trouxe o fim. O ano da queda final depende de como se contam os anos de reinado de Nabucodonosor e de Zedequias; a Crônica Babilônica se interrompe antes dela. O exílio durou até que Ciro permitisse ao povo voltar, em 538 a.C."
  de:
    - "Nebukadnezars Heer verbrannte Jerusalem und den Tempel 587 oder 586 v. Chr., im neunzehnten Jahr seiner Regierung; das Jahr ist umstritten, und die Exil-Tour der Karte zeigt 587 v. Chr."
    - "Die Belagerung begann im neunten Jahr Zedekias, des letzten Königs von Juda, im zehnten Monat und dauerte etwa achtzehn Monate; als der Hunger die Stadt brach, wurde die Mauer durchbrochen, Zedekia floh und wurde im Jordantal bei Jericho ergriffen, und in Ribla wurde er geblendet, nachdem seine Söhne vor seinen Augen getötet worden waren. Einen Monat später kam Nebusaradan, der Hauptmann der Leibwache, nach Jerusalem: „und verbrannte das Haus des HERRN und das Haus des Königs und alle Häuser zu Jerusalem“, und das Heer der Chaldäer riss die Mauern nieder. Das Volk wurde nach Babylon geführt, und nur die Ärmsten blieben, um das Land zu bebauen."
    - "Das war der zweite Fall der Stadt. Im Jahr 597 v. Chr. hatte sich Jojachin ergeben und war mit den Handwerkern und den Schätzen des Tempels nach Babylon weggeführt worden, wie 2. Könige und die Babylonische Chronik beide berichten; Nebukadnezar setzte Zedekia auf den Thron, und dessen Aufstand brachte das Ende. Das Jahr des endgültigen Falls hängt davon ab, wie die Regierungsjahre Nebukadnezars und Zedekias gezählt werden; die Babylonische Chronik bricht vor ihm ab. Das Exil dauerte, bis Kyrus das Volk 538 v. Chr. heimkehren ließ."
  fr:
    - "L’armée de Nebucadnetsar brûla Jérusalem et le Temple en 587 ou 586 av. J.-C., la dix-neuvième année de son règne ; l’année est discutée, et le parcours de l’exil sur la carte retient 587 av. J.-C."
    - "Le siège commença la neuvième année de Sédécias, dernier roi de Juda, au dixième mois, et dura environ dix-huit mois ; quand la famine eut brisé la ville, la muraille fut ouverte, Sédécias s’enfuit et fut atteint dans les plaines de Jéricho, et il eut les yeux crevés à Ribla après que ses fils eurent été égorgés devant lui. Un mois plus tard, Nebuzaradan, chef des gardes, vint à Jérusalem : « Il brûla la maison de l’Éternel, la maison du roi, et toutes les maisons de Jérusalem », et l’armée des Chaldéens démolit les murailles. Le peuple fut emmené à Babylone, et seuls les plus pauvres furent laissés pour travailler la terre."
    - "Ce fut la seconde chute de la ville. En 597 av. J.-C., Jojakin s’était rendu et avait été emmené à Babylone avec les artisans et les trésors du Temple, comme le rapportent 2 Rois et la Chronique babylonienne ; Nebucadnetsar plaça Sédécias sur le trône, et sa révolte amena la fin. L’année de la chute finale dépend de la manière de compter les années de règne de Nebucadnetsar et de Sédécias ; la Chronique babylonienne s’interrompt avant. L’exil dura jusqu’à ce que Cyrus laisse revenir le peuple en 538 av. J.-C."
  pl:
    - "Wojsko Nabuchodonozora spaliło Jerozolimę i Świątynię w 587 lub 586 p.n.e., w dziewiętnastym roku jego panowania; rok jest sporny, a trasa wygnania na mapie pokazuje 587 p.n.e."
    - "Oblężenie zaczęło się w dziewiątym roku Sedekiasza, ostatniego króla Judy, w dziesiątym miesiącu, i trwało około osiemnastu miesięcy; gdy głód złamał miasto, przełamano mur, Sedekiasz uciekł i został schwytany na równinach Jerycha, a oślepiono go w Ribla po tym, jak na jego oczach zabito jego synów. Miesiąc później do Jerozolimy przybył Nabuzardan, dowódca straży: „I spalił dom Pański, i dom królewski, i wszystkie domy Jeruzalemskie”, a wojsko chaldejskie rozwaliło mury. Lud zaprowadzono do Babilonu, a pozostawiono tylko najuboższych do pracy na roli."
    - "To był drugi upadek miasta. W 597 p.n.e. Jojakin poddał się i został zabrany do Babilonu wraz z rzemieślnikami i skarbami Świątyni, jak notują zgodnie 2 Księga Królewska i Kronika Babilońska; Nabuchodonozor osadził na tronie Sedekiasza, a jego bunt sprowadził koniec. Rok ostatecznego upadku zależy od tego, jak liczy się lata panowania Nabuchodonozora i Sedekiasza; Kronika Babilońska urywa się przed nim. Wygnanie trwało, aż Cyrus pozwolił ludowi wrócić w 538 p.n.e."
  it:
    - "L’esercito di Nabucodonosor bruciò Gerusalemme e il Tempio nel 587 o 586 a.C., nel diciannovesimo anno del suo regno; l’anno è discusso, e il percorso dell’esilio sulla mappa mostra il 587 a.C."
    - "L’assedio cominciò nel nono anno di Sedecia, ultimo re di Giuda, nel decimo mese, e durò circa diciotto mesi; quando la carestia fiaccò la città fu aperta una breccia nelle mura, Sedecia fuggì e fu preso nelle pianure di Gerico, e fu accecato a Ribla dopo che i suoi figli furono uccisi davanti a lui. Un mese dopo Nebuzaradan, capitano della guardia, giunse a Gerusalemme: «ed arse la casa dell’Eterno e la casa del re, e diede alle fiamme tutte le case di Gerusalemme», e l’esercito caldeo abbatté le mura. Il popolo fu portato a Babilonia, e rimasero soltanto i più poveri a lavorare la terra."
    - "Questa fu la seconda caduta della città. Nel 597 a.C. Ioiachin si era arreso ed era stato portato a Babilonia con gli artigiani e i tesori del Tempio, come registrano sia 2 Re sia la Cronaca babilonese; Nabucodonosor pose Sedecia sul trono, e la sua rivolta portò alla fine. L’anno della caduta finale dipende da come si contano gli anni di regno di Nabucodonosor e di Sedecia; la Cronaca babilonese si interrompe prima. L’esilio durò finché Ciro permise al popolo di tornare nel 538 a.C."
  nl:
    - "Het leger van Nebukadnessar verbrandde Jeruzalem en de tempel in 587 of 586 v.Chr., in het negentiende jaar van zijn regering; het jaar is omstreden, en de tocht door de ballingschap op de kaart toont 587 v.Chr."
    - "Het beleg begon in het negende jaar van Zedekia, de laatste koning van Juda, in de tiende maand, en duurde ongeveer achttien maanden; toen de honger de stad brak, werd de muur doorbroken, Zedekia vluchtte en werd gegrepen in de vlakten van Jericho, en hij werd bij Ribla verblind nadat zijn zonen voor zijn ogen waren gedood. Een maand later kwam Nebuzaradan, de commandant van de lijfwacht, naar Jeruzalem: “En hij verbrandde het huis des HEEREN, en het huis des konings, mitsgaders alle huizen van Jeruzalem”, en het Chaldeeuwse leger brak de muren af. Het volk werd naar Babylon weggevoerd, en alleen de armsten werden achtergelaten om het land te bewerken."
    - "Dit was de tweede val van de stad. In 597 v.Chr. had Jojachin zich overgegeven en was met de ambachtslieden en de schatten van de tempel naar Babylon gebracht, zoals 2 Koningen en de Babylonische kroniek beide vermelden; Nebukadnessar zette Zedekia op de troon, en diens opstand bracht het einde. Het jaar van de definitieve val hangt af van hoe de regeringsjaren van Nebukadnessar en Zedekia worden geteld; de Babylonische kroniek breekt eerder af. De ballingschap duurde tot Cyrus het volk in 538 v.Chr. liet terugkeren."
  cs:
    - "Nebukadnesarovo vojsko vypálilo Jeruzalém a chrám roku 587 nebo 586 př. n. l., v devatenáctém roce jeho vlády; rok je sporný a mapa putování vyhnanství ukazuje rok 587 př. n. l."
    - "Obléhání začalo v devátém roce Sidkijáše, posledního judského krále, v desátém měsíci a trvalo asi osmnáct měsíců; když hlad zlomil město, byla prolomena hradba, Sidkijáš utekl a byl dopaden na pláních u Jericha a v Ribla byl oslepen poté, co mu před očima zabili syny. O měsíc později přišel do Jeruzaléma Nebuzaradan, velitel stráže: „A zapálil dům Hospodinův i dům královský, i všecky domy v Jeruzalémě“, a chaldejské vojsko zbořilo hradby. Lid byl odveden do Babylónu, jen nejchudší byli ponecháni obdělávat zemi."
    - "Byl to druhý pád města. Roku 597 př. n. l. se Jójakín vzdal a byl odveden do Babylónu s řemeslníky a poklady chrámu, jak zaznamenávají Druhá kniha Královská i babylonská kronika; Nebukadnesar dosadil na trůn Sidkijáše a jeho vzpoura přivodila konec. Rok konečného pádu závisí na tom, jak se počítají vládní roky Nebukadnesara a Sidkijáše; babylonská kronika se před ním přerušuje. Vyhnanství trvalo, dokud Kýros nedovolil lidu návrat roku 538 př. n. l."
  sv:
    - "Nebukadnessars här brände Jerusalem och templet 587 eller 586 f.Kr., i hans nittonde regeringsår; året är omstritt, och kartans tur över exilen visar 587 f.Kr."
    - "Belägringen började i nionde året av Sidkia, Judas sista kung, i tionde månaden, och varade omkring arton månader; när hungersnöden bröt staden bröts muren upp, Sidkia flydde och fångades på Jerikos hedmarker, och han blev blindad i Rivla efter att hans söner dödats inför honom. En månad senare kom Nebusaradan, översten för drabanterna, till Jerusalem: ”brände upp HERRENS hus och konungshuset: ja, alla hus i Jerusalem”, och ”murarna runt omkring Jerusalem brötos ned av hela den här av kaldéer”. Folket fördes till Babylon, och bara de fattigaste lämnades kvar för att bruka jorden."
    - "Detta var stadens andra fall. År 597 f.Kr. hade Jojakin gett sig och förts till Babylon med hantverkarna och templets skatter, vilket både 2 Kung och den babyloniska krönikan uppger; Nebukadnessar satte Sidkia på tronen, och hans uppror förde med sig slutet. Året för det slutliga fallet beror på hur Nebukadnessars och Sidkias regeringsår räknas; den babyloniska krönikan bryter av före det. Exilen varade till dess Kyros lät folket återvända 538 f.Kr."
  nb:
    - "Nebukadnesars hær brente Jerusalem og tempelet i 587 eller 586 f.Kr., i det nittende året av hans regjering; året er omstridt, og kartets tur om eksilet viser 587 f.Kr."
    - "Beleiringen begynte i det niende året til Sidkia, Judas siste konge, i den tiende måneden, og varte i omtrent atten måneder; da hungersnøden brøt byen ned, ble muren gjennombrutt, Sidkia flyktet og ble fanget på Jerikos sletter, og han ble blindet i Ribla etter at sønnene hans var drept foran ham. En måned senere kom Nebusaradan, sjefen for livvakten, til Jerusalem: «Han brente op Herrens hus og kongens hus, og alle Jerusalems hus», og den kaldeiske hæren rev ned murene. Folket ble ført til Babylon, og bare de fattigste ble igjen for å dyrke landet."
    - "Dette var byens andre fall. I 597 f.Kr. hadde Jojakin overgitt seg og blitt tatt til Babylon sammen med håndverkerne og tempelets skatter, slik både 2 Kongebok og Den babylonske krønike melder; Nebukadnesar satte Sidkia på tronen, og hans opprør førte til slutten. Året for det endelige fallet avhenger av hvordan regjeringsårene til Nebukadnesar og Sidkia telles; Den babylonske krønike bryter av før det. Eksilet varte til Kyros lot folket vende hjem i 538 f.Kr."
  tl:
    - "Sinunog ng hukbo ni Nabucodonosor ang Jerusalem at ang Templo noong 587 o 586 BK, sa ikalabinsiyam na taon ng kaniyang paghahari; pinagtatalunan ang taon, at ipinakikita ng paglilibot ng mapa sa pagkatapon ang 587 BK."
    - "Nagsimula ang pagkubkob sa ikasiyam na taon ni Sedecias, ang huling hari ng Juda, sa ikasampung buwan, at tumagal nang mga labingwalong buwan; nang bumagsak ang lungsod sa gutom ay nabutas ang pader, tumakas si Sedecias at nahuli sa mga kapatagan ng Jerico, at binulag siya sa Ribla pagkatapos patayin sa harap niya ang kaniyang mga anak. Makalipas ang isang buwan, dumating sa Jerusalem si Nabuzaradan, kapitan ng bantay: “Kaniyang sinunog ang bahay ng Panginoon, at ang bahay ng hari; at ang lahat na bahay sa Jerusalem”, at giniba ng hukbong Caldeo ang mga pader. Dinala ang bayan sa Babilonia, at ang pinakamahihirap lamang ang naiwan upang bungkalin ang lupa."
    - "Ito ang ikalawang pagbagsak ng lungsod. Noong 597 BK ay sumuko si Joachin at dinala sa Babilonia kasama ng mga manggagawa at mga kayamanan ng Templo, gaya ng itinala ng 2 Mga Hari at ng Kronikang Babilonio; inilagay ni Nabucodonosor si Sedecias sa trono, at ang paghihimagsik nito ang nagdala ng wakas. Nakasalalay ang taon ng huling pagbagsak sa kung paano binibilang ang mga taon ng paghahari nina Nabucodonosor at Sedecias; naputol ang Kronikang Babilonio bago nito. Tumagal ang pagkatapon hanggang sa pinabalik ni Ciro ang bayan noong 538 BK."
  da:
    - "Nebukadnezars hær brændte Jerusalem og Templet i 587 eller 586 f.Kr., i hans regerings nittende år; året er omstridt, og kortets tur om eksilet viser 587 f.Kr."
    - "Belejringen begyndte i det niende år af Zedekias, Judas sidste konge, i den tiende måned og varede omkring atten måneder; da hungersnøden brød byen, blev muren brudt igennem, Zedekias flygtede og blev fanget på Jerikos sletter, og han blev gjort blind i Ribla, efter at hans sønner var dræbt for hans øjne. En måned senere kom Nebuzaradan, livvagtens chef, til Jerusalem: »Og han opbrændte Herrens Hus og Kongens Hus; og alle Husene i Jerusalem«, og den kaldæiske hær nedbrød murene. Folket blev ført til Babylon, og kun de fattigste blev efterladt til at dyrke jorden."
    - "Dette var byens andet fald. I 597 f.Kr. havde Jojakin overgivet sig og var blevet ført til Babylon sammen med håndværkerne og Templets skatte, som både Anden Kongebog og den babyloniske krønike beretter; Nebukadnezar satte Zedekias på tronen, og hans oprør bragte enden. Året for det endelige fald afhænger af, hvordan Nebukadnezars og Zedekias' regeringsår tælles; den babyloniske krønike bryder af før det. Eksilet varede, indtil Kyros lod folket vende hjem i 538 f.Kr."
  sr:
    - "Навуходоносорова војска спалила је Јерусалим и Храм 587. или 586. п. н. е., у деветнаестој години његове владавине; година је спорна, а рута изгнанства на карти приказује 587. п. н. е."
    - "Опсада је почела у деветој години Седекије, последњег краља Јуде, у десетом месецу, и трајала око осамнаест месеци; кад је глад сломила град, зид је пробијен, Седекија је побегао и ухваћен је у јерихонским равницама, а у Ривли је ослепљен пошто су пред њим убијени његови синови. Месец дана касније Невузардан, заповедник страже, дошао је у Јерусалим: „И попали дом Господњи и дом царски и све домове у Јерусалиму“, а халдејска војска срушила је зидове. Народ је одведен у Вавилон, а остављени су само најсиромашнији да обрађују земљу."
    - "То је био други пад града. Године 597. п. н. е. Јоахин се предао и одведен је у Вавилон са занатлијама и благом Храма, што бележе и 2. књига о царевима и Вавилонска хроника; Навуходоносор је на престо поставио Седекију, а његова буна донела је крај. Година коначног пада зависи од начина рачунања владарских година Навуходоносора и Седекије; Вавилонска хроника прекида се пре њега. Прогонство је трајало док Кир није дозволио народу повратак 538. п. н. е."
  hu:
    - "Nabukodonozor hadserege Kr. e. 587-ben vagy 586-ban, uralkodásának tizenkilencedik évében égette fel Jeruzsálemet és a Templomot; az év vitatott, és a térkép fogság-túrája Kr. e. 587-et mutatja."
    - "Az ostrom Sedékiásnak, Júda utolsó királyának kilencedik évében, a tizedik hónapban kezdődött, és mintegy tizennyolc hónapig tartott; amikor az éhség megtörte a várost, a falat áttörték, Sedékiás elmenekült, és Jerikó síkságán elfogták, Riblában pedig megvakították, miután fiait a szeme láttára megölték. Egy hónappal később Nebuzaradán, a testőrség parancsnoka Jeruzsálembe jött: „felgyújtotta az Úr házát és a király házát, és Jeruzsálem összes házait”, a káldeus sereg pedig lerombolta a falakat. A népet Babilonba hurcolták, csak a legszegényebbeket hagyták ott a föld megművelésére."
    - "Ez volt a város második bukása. Kr. e. 597-ben Jójákin megadta magát, és a mesteremberekkel és a Templom kincseivel Babilonba vitték, ahogy a 2Kir és a babiloni krónika is feljegyzi; Nabukodonozor Sedékiást ültette a trónra, és lázadása hozta el a véget. A végső bukás éve azon múlik, hogyan számítják Nabukodonozor és Sedékiás uralkodási éveit; a babiloni krónika korábban megszakad. A fogság Círusz hazaengedéséig, Kr. e. 538-ig tartott."
  fi:
    - "Nebukadnessarin armeija poltti Jerusalemin ja temppelin vuonna 587 tai 586 eaa., hänen yhdeksännentoista hallitusvuotensa aikana; vuodesta kiistellään, ja kartan pakkosiirtolaisuuden kierros näyttää vuoden 587 eaa."
    - "Piiritys alkoi Juudan viimeisen kuninkaan Sidkian yhdeksäntenä hallitusvuotena kymmenennessä kuussa ja kesti noin kahdeksantoista kuukautta; kun nälänhätä mursi kaupungin, muuri murrettiin, Sidkia pakeni ja otettiin kiinni Jerikon aroilla, ja hänet sokaistiin Riblassa sen jälkeen, kun hänen poikansa olivat saaneet surmansa hänen silmiensä edessä. Kuukautta myöhemmin henkivartijain päällikkö Nebusaradan tuli Jerusalemiin: ”Hän poltti Herran temppelin ja kuninkaan linnan ja kaikki Jerusalemin talot”, ja kaldealaisten sotajoukko repi muurit maahan. Kansa vietiin Babyloniin, ja vain köyhimmät jätettiin viljelemään maata."
    - "Tämä oli kaupungin toinen kukistuminen. Vuonna 597 eaa. Jojakin oli antautunut ja viety Babyloniin käsityöläisten ja temppelin aarteiden kanssa, kuten sekä 2. Kuninkaiden kirja että Babylonian kronikka kertovat; Nebukadnessar asetti Sidkian valtaistuimelle, ja tämän kapina toi lopun. Lopullisen kukistumisen vuosi riippuu siitä, miten Nebukadnessarin ja Sidkian hallitusvuodet lasketaan; Babylonian kronikka katkeaa ennen sitä. Pakkosiirtolaisuus kesti siihen asti, kun Kyyros salli kansan palata vuonna 538 eaa."
  vi:
    - "Đạo quân của Nê-bu-cát-nết-sa đốt Giê-ru-sa-lem và Đền Thờ vào năm 587 hoặc 586 TCN, năm thứ mười chín đời ông; năm này còn tranh luận, và hành trình lưu đày trên bản đồ cho thấy năm 587 TCN."
    - "Cuộc vây bắt đầu vào năm thứ chín đời Sê-đê-kia, vua cuối cùng của Giu-đa, tháng mười, và kéo dài khoảng mười tám tháng; khi nạn đói làm thành kiệt quệ, tường thành bị chọc thủng, Sê-đê-kia chạy trốn và bị bắt trong đồng bằng Giê-ri-cô, rồi bị khoét mắt tại Ríp-la sau khi các con trai ông bị giết trước mặt ông. Một tháng sau, Nê-bu-xa-ra-đan, quan chỉ huy đội thị vệ, đến Giê-ru-sa-lem: “Người thiêu đốt đền thờ Đức Giê-hô-va, cung của vua, và mọi nhà trong thành Giê-ru-sa-lem”, còn quân Canh-đê đánh đổ các tường thành. Dân bị đem về Ba-by-lôn, chỉ còn lại những người nghèo nhất để cày cấy đất."
    - "Đây là lần sụp đổ thứ hai của thành. Năm 597 TCN, Giê-hô-gia-kin đã đầu hàng và bị đem về Ba-by-lôn cùng các thợ thủ công và bảo vật của Đền Thờ, như cả 2 Vua lẫn Biên niên sử Ba-by-lôn đều ghi; Nê-bu-cát-nết-sa đặt Sê-đê-kia lên ngôi, và cuộc nổi dậy của ông dẫn đến kết cục. Năm của lần sụp đổ cuối cùng tùy thuộc vào cách tính các năm trị vì của Nê-bu-cát-nết-sa và Sê-đê-kia; Biên niên sử Ba-by-lôn đứt đoạn trước đó. Cuộc lưu đày kéo dài cho đến khi Si-ru cho dân trở về năm 538 TCN."
  ro:
    - "Armata lui Nebucadnețar a ars Ierusalimul și Templul în 587 sau 586 î.Hr., în anul al nouăsprezecelea al domniei lui; anul este disputat, iar turul exilului de pe hartă arată 587 î.Hr."
    - "Asediul a început în anul al nouălea al lui Zedechia, ultimul rege al Iudei, în luna a zecea, și a durat circa optsprezece luni; când foametea a frânt cetatea, zidul a fost spart, Zedechia a fugit și a fost prins în câmpia Ierihonului, iar la Ribla a fost orbit după ce fiii lui au fost uciși înaintea lui. O lună mai târziu, Nebuzaradan, căpetenia gărzii, a venit la Ierusalim: „a ars casa Domnului și casa împăratului și toate casele Ierusalimului”, iar armata haldeilor a dărâmat zidurile. Poporul a fost dus în Babilon, iar numai cei mai săraci au fost lăsați să lucreze pământul."
    - "Aceasta a fost a doua cădere a cetății. În 597 î.Hr., Ioiachin se predase și fusese dus în Babilon cu meșteșugarii și cu comorile Templului, după cum consemnează atât 2 Regi, cât și Cronica babiloniană; Nebucadnețar l-a pus pe tron pe Zedechia, iar răscoala lui a adus sfârșitul. Anul căderii definitive depinde de felul în care se numără anii de domnie ai lui Nebucadnețar și ai lui Zedechia; Cronica babiloniană se întrerupe înainte de aceasta. Exilul a durat până când Cir i-a lăsat pe oameni să se întoarcă în 538 î.Hr."
  bg:
    - "Войската на Навуходоносор изгорила Йерусалим и Храма през 587 или 586 г. пр.н.е., в деветнадесетата година от царуването му; годината е спорна, а обиколката за плена на картата показва 587 г. пр.н.е."
    - "Обсадата започнала в деветата година на Седекия, последния цар на Юда, в десетия месец, и траела около осемнадесет месеца; когато гладът сломил града, стената била пробита, Седекия избягал и бил заловен в полетата на Йерихон, а в Ривла бил ослепен, след като синовете му били убити пред очите му. Месец по-късно в Йерусалим дошъл Навузардан, началникът на телохранителите: „изгори дома Господен, и царския дом, и всичките домове на Ерусалим“, а халдейската войска съборила стените. Народът бил отведен във Вавилон и само най-бедните били оставени да обработват земята."
    - "Това било второто падане на града. През 597 г. пр.н.е. Йехония се предал и бил отведен във Вавилон заедно със занаятчиите и съкровищата на Храма, както съобщават и 4 Царе, и Вавилонската хроника; Навуходоносор поставил на престола Седекия и неговият бунт довел до края. Годината на окончателното падане зависи от това как се броят годините на царуване на Навуходоносор и Седекия; Вавилонската хроника прекъсва преди нея. Пленът траел до 538 г. пр.н.е., когато Кир позволил на народа да се върне."
