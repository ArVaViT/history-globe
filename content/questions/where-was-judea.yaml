id: where-was-judea
question:
  en: "Where was Judea?"
  ru: "Где находилась Иудея?"
  uk: "Де була Юдея?"
  es: "¿Dónde estaba Judea?"
  pt: "Onde ficava a Judeia?"
  de: "Wo lag Judäa?"
  fr: "Où se trouvait la Judée ?"
  pl: "Gdzie leżała Judea?"
  it: "Dov’era la Giudea?"
  cs: "Kde leželo Judsko?"
  nl: "Waar lag Judea?"
  sv: "Var låg Judeen?"
  nb: "Hvor lå Judea?"
  tl: "Nasaan ang Judea?"
  da: "Hvor lå Judæa?"
answer:
  en:
    - "Judea was the land of Judah around Jerusalem: the southern hill country from about Bethel to Hebron and Beersheba, with the wilderness falling east to the Dead Sea and the low hills of the Shephelah sloping west, most of it in today's West Bank and southern Israel. The map point stands on Jerusalem, its capital. It was small: Bethel to Beersheba is about 85 km in a straight line, and Bethlehem lies only 8 km south of Jerusalem, Hebron about 31 km."
    - "Its size changed with its rulers. Under the Persians it was the little province of Yehud, “the province of Judea” of Ezra, hardly larger than the hills round Jerusalem; the Hasmoneans grew it into a kingdom from Galilee to Idumea. In the Gospels Judea is one region beside Galilee and Samaria: Jesus is born in “Bethlehem of Judaea”, John preaches “in the wilderness of Judaea”, and the news of John's birth spreads “throughout all the hill country of Judæa”. When Luke writes “Pontius Pilate being governor of Judæa”, the Roman province also took in Samaria and Idumea and was governed from Caesarea on the coast."
    - "After the revolt of Bar Kokhba in AD 132–135 Hadrian renamed the province Syria Palaestina, and Judea dropped out of official use. The Judean hills and desert are today mostly in the West Bank, with Bethlehem and Hebron; Israel calls the area Judea and Samaria."
  ru:
    - "Иудея — земля Иуды вокруг Иерусалима: южное нагорье примерно от Вефиля до Хеврона и Вирсавии, с пустыней, спускающейся на восток к Мёртвому морю, и низкими холмами Шефелы, сходящими на запад; бо́льшая её часть лежит на нынешнем Западном берегу и на юге Израиля. Точка карты стоит на Иерусалиме, её столице. Страна была невелика: от Вефиля до Вирсавии около 85 км по прямой, а Вифлеем лежит всего в 8 км к югу от Иерусалима, Хеврон — примерно в 31 км."
    - "Её размеры менялись вместе с правителями. При Персах это была маленькая провинция Йехуд, Иудейская область книги Ездры, едва ли больше гор вокруг Иерусалима; Хасмонеи расширили её до царства от Галилеи до Идумеи. В Евангелиях Иудея — одна из областей рядом с Галилеей и Самарией: Иисус рождается «в Вифлееме Иудейском», Иоанн проповедует «в пустыне Иудейской», а о рождении Иоанна рассказывают «по всей нагорной стране Иудейской». Когда Лука пишет, что «Понтий Пилат начальствовал в Иудее», римская провинция включала также Самарию и Идумею и управлялась из Кесарии на побережье."
    - "После восстания Бар-Кохбы в 132–135 гг. н. э. Адриан переименовал провинцию в Сирию Палестинскую, и имя Иудеи вышло из официального употребления. Иудейские горы и пустыня сегодня по большей части лежат на Западном берегу, с Вифлеемом и Хевроном; Израиль называет эту область Иудеей и Самарией."
  uk:
    - "Юдея була землею Юди навколо Єрусалима: південний гірський край приблизно від Бет-Ела до Хеврона й Беер-Шеви, з пустелею, що спадає на схід до Мертвого моря, і низькими пагорбами Шефели, що схиляються на захід; більша її частина лежить на нинішньому Західному березі Йордану й на півдні Ізраїлю. Точка на мапі стоїть на Єрусалимі, її столиці. Вона була невеликою: від Бет-Ела до Беер-Шеви близько 85 км по прямій, а Вифлеєм лежить лише за 8 км на південь від Єрусалима, Хеврон — приблизно за 31 км."
    - "Її розміри змінювалися разом з правителями. За персів це була мала провінція Єгуд, «Юдейська країна» Ездри, ледь більша за пагорби навколо Єрусалима; Хасмонеї виростили з неї царство від Галілеї до Ідумеї. В Євангеліях Юдея — один із країв поряд з Галілеєю та Самарією: Ісус народжується «у Витлеємі Юдейському», Іван проповідує «в пустинї Юдейській», а вістка про народження Івана розходиться «по всьому підгіррю Юдейському». Коли Лука пише, що «був ігемоном Понтийський Пилат в Юдеї», римська провінція охоплювала також Самарію та Ідумею, і правили нею з Кесарії на узбережжі."
    - "Після повстання Бар-Кохби 132–135 рр. н. е. Адріан перейменував провінцію на Сирію Палестину, і Юдея вийшла з офіційного вжитку. Юдейські пагорби й пустеля нині здебільшого лежать на Західному березі Йордану, з Вифлеємом і Хевроном; Ізраїль називає цю область Юдеєю і Самарією."
  es:
    - "Judea era la tierra de Judá en torno a Jerusalén: la región montañosa del sur, aproximadamente desde Betel hasta Hebrón y Beerseba, con el desierto descendiendo al este hacia el mar Muerto y las colinas bajas de la Sefelá inclinándose al oeste, en su mayor parte en la actual Cisjordania y el sur de Israel. El punto del mapa está en Jerusalén, su capital. Era pequeña: de Betel a Beerseba hay unos 85 km en línea recta, y Belén queda a solo 8 km al sur de Jerusalén, y Hebrón a unos 31 km."
    - "Su tamaño cambió con sus gobernantes. Bajo los persas fue la pequeña provincia de Yehud, la «provincia de Judea» de Esdras, apenas mayor que las colinas en torno a Jerusalén; los asmoneos la convirtieron en un reino que iba de Galilea a Idumea. En los Evangelios, Judea es una región junto a Galilea y Samaria: Jesús nace en «Bethlehem de Judea», Juan predica «en el desierto de Judea», y la noticia del nacimiento de Juan se divulga «en todas las montañas de Judea». Cuando Lucas escribe «siendo gobernador de Judea Poncio Pilato», la provincia romana abarcaba también Samaria e Idumea y se gobernaba desde Cesarea, en la costa."
    - "Tras la revuelta de Bar Kojba, en 132–135 d. C., Adriano rebautizó la provincia como Siria Palestina, y Judea dejó de usarse oficialmente. Las colinas y el desierto de Judea están hoy en su mayor parte en Cisjordania, con Belén y Hebrón; Israel llama a la zona Judea y Samaria."
  pt:
    - "A Judeia era a terra de Judá em torno de Jerusalém: a região montanhosa do sul, aproximadamente de Betel a Hebrom e Berseba, com o deserto descendo a leste até o mar Morto e as colinas baixas da Sefelá inclinando-se a oeste, quase toda na atual Cisjordânia e no sul de Israel. O ponto do mapa fica em Jerusalém, sua capital. Era pequena: de Betel a Berseba são cerca de 85 km em linha reta, e Belém fica a apenas 8 km ao sul de Jerusalém, Hebrom a cerca de 31 km."
    - "Seu tamanho mudava com seus governantes. Sob os persas, era a pequena província de Yehud, a “província de Judá” de Esdras, pouco maior do que as colinas em torno de Jerusalém; os asmoneus a ampliaram até formar um reino da Galileia à Iduméia. Nos Evangelhos, a Judeia é uma região ao lado da Galileia e da Samaria: Jesus nasce em “Belém da Judeia”, João prega “no deserto da Judeia”, e a notícia do nascimento de João se espalha “por toda a região montanhosa da Judeia”. Quando Lucas escreve “sendo Pôncio Pilatos governador da Judeia”, a província romana abrangia também a Samaria e a Iduméia e era governada a partir de Cesareia, no litoral."
    - "Depois da revolta de Bar Kokhba, em 132–135 d.C., Adriano rebatizou a província como Síria Palestina, e a Judeia saiu do uso oficial. As colinas e o deserto da Judeia estão hoje em sua maior parte na Cisjordânia, com Belém e Hebrom; Israel chama a área de Judeia e Samaria."
  de:
    - "Judäa war das Land Juda um Jerusalem: das südliche Bergland etwa von Bethel bis Hebron und Beerscheba, mit der Wüste, die nach Osten zum Toten Meer abfällt, und den niedrigen Hügeln der Schefela, die nach Westen abdachen, das meiste davon im heutigen Westjordanland und im Süden Israels. Der Kartenpunkt steht auf Jerusalem, seiner Hauptstadt. Es war klein: Von Bethel bis Beerscheba sind es in der Luftlinie etwa 85 km, und Bethlehem liegt nur 8 km südlich von Jerusalem, Hebron etwa 31 km."
    - "Seine Größe wechselte mit seinen Herrschern. Unter den Persern war es die kleine Provinz Jehud, das „jüdische Land“ des Esra, kaum größer als die Berge um Jerusalem; die Hasmonäer machten daraus ein Königreich von Galiläa bis Idumäa. In den Evangelien ist Judäa eine Region neben Galiläa und Samaria: Jesus wird geboren „zu Bethlehem im jüdischen Lande“, Johannes predigt „in der Wüste des jüdischen Landes“, und die Kunde von Johannes’ Geburt verbreitet sich „auf dem ganzen jüdischen Gebirge“. Wenn Lukas schreibt, „Pontius Pilatus Landpfleger in Judäa war“, umfasste die römische Provinz auch Samaria und Idumäa und wurde von Caesarea an der Küste aus verwaltet."
    - "Nach dem Aufstand des Bar Kochba 132–135 n. Chr. benannte Hadrian die Provinz in Syria Palaestina um, und Judäa kam aus dem amtlichen Gebrauch. Die judäischen Berge und die Wüste liegen heute größtenteils im Westjordanland, mit Bethlehem und Hebron; Israel nennt das Gebiet Judäa und Samaria."
  fr:
    - "La Judée était le pays de Juda autour de Jérusalem : la région montagneuse du sud, à peu près de Béthel à Hébron et à Beer-Schéba, avec le désert qui descend à l’est vers la mer Morte et les basses collines de la Shéphéla qui s’abaissent à l’ouest, le tout situé pour l’essentiel dans l’actuelle Cisjordanie et le sud d’Israël. Le point de la carte se trouve à Jérusalem, sa capitale. Elle était petite : de Béthel à Beer-Schéba, il y a environ 85 km à vol d’oiseau, et Bethléem n’est qu’à 8 km au sud de Jérusalem, Hébron à environ 31 km."
    - "Son étendue changea avec ses souverains. Sous les Perses, c’était la petite province de Yehud, « la province de Juda » d’Esdras, à peine plus grande que les collines autour de Jérusalem ; les Hasmonéens en firent un royaume allant de la Galilée à l’Idumée. Dans les Évangiles, la Judée est une région à côté de la Galilée et de la Samarie : Jésus naît à « Bethléhem en Judée », Jean-Baptiste prêche « dans le désert de Judée », et la nouvelle de la naissance de Jean se répand « dans toutes les montagnes de la Judée ». Quand Luc écrit que « Ponce Pilate était gouverneur de la Judée », la province romaine comprenait aussi la Samarie et l’Idumée et était gouvernée depuis Césarée, sur la côte."
    - "Après la révolte de Bar Kokhba, en 132-135 apr. J.-C., Hadrien rebaptisa la province Syrie Palestine, et la Judée sortit de l’usage officiel. Les collines et le désert de Judée se trouvent aujourd’hui pour l’essentiel en Cisjordanie, avec Bethléem et Hébron ; Israël désigne la région sous le nom de Judée-Samarie."
  pl:
    - "Judea była ziemią Judy wokół Jerozolimy: południową krainą wzgórz mniej więcej od Betel po Hebron i Beer-Szebę, z pustynią opadającą na wschód ku Morzu Martwemu i niskimi wzgórzami Szefeli opadającymi na zachód, w większości na dzisiejszym Zachodnim Brzegu i w południowym Izraelu. Punkt na mapie stoi w Jerozolimie, jej stolicy. Była niewielka: od Betel do Beer-Szeby jest około 85 km w linii prostej, a Betlejem leży zaledwie 8 km na południe od Jerozolimy, Hebron około 31 km."
    - "Jej rozmiary zmieniały się wraz z władcami. Za Persów była małą prowincją Jehud, prowincją judzką z Księgi Ezdrasza, ledwie większą niż wzgórza wokół Jerozolimy; Hasmonejczycy rozbudowali ją w królestwo od Galilei po Idumeę. W Ewangeliach Judea jest jednym z regionów obok Galilei i Samarii: Jezus rodzi się „w Betlehemie Judzkiem”, Jan naucza „na puszczy w ziemi Judzkiej”, a wieść o narodzinach Jana rozchodzi się „po wszystkiej górnej krainie Judzkiej”. Gdy Łukasz pisze, że „Poncki Piłat był starostą Judzkim”, rzymska prowincja obejmowała także Samarię i Idumeę i rządzono nią z Cezarei na wybrzeżu."
    - "Po powstaniu Bar Kochby w latach 132–135 n.e. Hadrian przemianował prowincję na Syria Palaestina i Judea wyszła z użycia urzędowego. Wzgórza i pustynia judzka leżą dziś głównie na Zachodnim Brzegu, wraz z Betlejem i Hebronem; Izrael nazywa ten obszar Judeą i Samarią."
  it:
    - "La Giudea era la terra di Giuda attorno a Gerusalemme: la regione collinare meridionale da Betel circa fino a Ebron e a Bersabea, con il deserto che scende a est verso il Mar Morto e le basse colline della Sefela che digradano a ovest, in gran parte nell’odierna Cisgiordania e nel sud di Israele. Il punto della mappa si trova su Gerusalemme, la sua capitale. Era piccola: da Betel a Bersabea ci sono circa 85 km in linea d’aria, e Betlemme dista solo 8 km a sud di Gerusalemme, Ebron circa 31 km."
    - "La sua estensione cambiò con i suoi governanti. Sotto i Persiani era la piccola provincia di Yehud, la «provincia di Giuda» di Esdra, poco più grande delle colline attorno a Gerusalemme; gli Asmonei la ampliarono in un regno dalla Galilea all’Idumea. Nei Vangeli la Giudea è una regione accanto alla Galilea e alla Samaria: Gesù nasce in «Betleem di Giudea», Giovanni predica «nel deserto della Giudea», e la notizia della nascita di Giovanni si diffonde «per tutta la regione montuosa della Giudea». Quando Luca scrive «Ponzio Pilato governatore della Giudea», la provincia romana comprendeva anche la Samaria e l’Idumea ed era governata da Cesarea, sulla costa."
    - "Dopo la rivolta di Bar Kokhba del 132–135 d.C. Adriano ribattezzò la provincia Syria Palaestina, e la Giudea uscì dall’uso ufficiale. Le colline e il deserto di Giudea sono oggi per lo più in Cisgiordania, con Betlemme ed Ebron; Israele chiama l’area Giudea e Samaria."
  cs:
    - "Judsko byla země Judy kolem Jeruzaléma: jižní horská země zhruba od Bét-elu po Hebron a Beer-šebu, s pouští klesající na východ k Mrtvému moři a nízkými pahorky Šefely svažujícími se na západ, většinou na dnešním Západním břehu a jižním Izraeli. Bod na mapě stojí v Jeruzalémě, jeho hlavním městě. Bylo malé: z Bét-elu do Beer-šeby je to vzdušnou čarou asi 85 km a Betlém leží jen 8 km jižně od Jeruzaléma, Hebron asi 31 km."
    - "Jeho rozloha se měnila s vládci. Za Peršanů to byla malá provincie Jehúd, Ezdrášova „Judská krajina“, sotva větší než pahorky kolem Jeruzaléma; Hasmoneovci z něj vytvořili království od Galileje po Idumeu. V evangeliích je Judsko jedním krajem vedle Galileje a Samaří: Ježíš se rodí „v Betlémě Judově“, Jan káže „na poušti Judské“ a zpráva o Janově narození se šíří „po všech horách Judských“. Když Lukáš píše, že „Pontský Pilát spravoval Judstvo“, římská provincie zahrnovala také Samaří a Idumeu a spravovala se z Cesareje na pobřeží."
    - "Po povstání Bar Kochby v letech 132–135 n. l. Hadrianus přejmenoval provincii na Syria Palaestina a Judsko vymizelo z úředního užívání. Judské hory a poušť leží dnes většinou na Západním břehu, s Betlémem a Hebronem; Izrael oblast nazývá Judsko a Samaří."
  nl:
    - "Judea was het land van Juda rond Jeruzalem: het zuidelijke bergland van ongeveer Bethel tot Hebron en Berseba, met de woestijn die naar het oosten afdaalt naar de Dode Zee en de lage heuvels van de Sefela die naar het westen aflopen, het grootste deel in de huidige Westelijke Jordaanoever en het zuiden van Israël. Het punt op de kaart staat op Jeruzalem, de hoofdstad. Het was klein: van Bethel tot Berseba is het hemelsbreed ongeveer 85 km, en Bethlehem ligt slechts 8 km ten zuiden van Jeruzalem, Hebron ongeveer 31 km."
    - "De omvang veranderde met de heersers. Onder de Perzen was het de kleine provincie Yehud, “het landschap Juda” van Ezra, nauwelijks groter dan de heuvels rond Jeruzalem; de Hasmoneeën maakten er een koninkrijk van, van Galilea tot Idumea. In de evangeliën is Judea één streek naast Galilea en Samaria: Jezus wordt geboren in “Bethlehem, gelegen in Judea”, Johannes predikt “in de woestijn van Judea”, en het nieuws over de geboorte van Johannes verspreidt zich “in het gehele gebergte van Judea”. Wanneer Lukas schrijft dat “Pontius Pilatus stadhouder was over Judea”, omvatte de Romeinse provincie ook Samaria en Idumea en werd zij bestuurd vanuit Caesarea aan de kust."
    - "Na de opstand van Bar Kochba in 132–135 n.Chr. noemde Hadrianus de provincie om tot Syria Palaestina, en Judea verdween uit het officiële gebruik. De heuvels en de woestijn van Judea liggen nu grotendeels in de Westelijke Jordaanoever, met Bethlehem en Hebron; Israël noemt het gebied Judea en Samaria."
  sv:
    - "Judeen var Judas land kring Jerusalem: det södra bergslandet från ungefär Betel till Hebron och Beer Sheva, med öknen som faller österut mot Döda havet och Shefelas låga kullar som sluttar västerut, till största delen på dagens Västbanken och i södra Israel. Kartpunkten står på Jerusalem, dess huvudstad. Det var litet: från Betel till Beer Sheva är det omkring 85 km i fågelvägen, och Betlehem ligger bara 8 km söder om Jerusalem, Hebron omkring 31 km."
    - "Dess storlek växlade med härskarna. Under perserna var det den lilla provinsen Jehud, Esras ”judiska hövdingdöme”, knappt större än bergen kring Jerusalem; hasmoneerna gjorde det till ett kungarike från Galileen till Idumeen. I evangelierna är Judeen en region vid sidan av Galileen och Samarien: Jesus föds ”i Betlehem i Judeen”, Johannes predikar ”i Judeens öken”, och ryktet om Johannes’ födelse går ut ”över Judeens hela bergsbygd”. När Lukas skriver att ”Pontius Pilatus var landshövding i Judeen” omfattade den romerska provinsen också Samarien och Idumeen och styrdes från Caesarea vid kusten."
    - "Efter Bar Kochbas uppror år 132–135 e.Kr. döpte Hadrianus om provinsen till Syria Palaestina, och Judeen föll ur officiellt bruk. Judeens berg och öken ligger i dag mest på Västbanken, med Betlehem och Hebron; Israel kallar området Judeen och Samarien."
  nb:
    - "Judea var Judas land rundt Jerusalem: det sørlige fjellandet fra omtrent Betel til Hebron og Beer-Sjeba, med ørkenen som faller østover mot Dødehavet og de lave åsene i Sjefela som skråner vestover, for det meste i dagens Vestbredden og det sørlige Israel. Kartpunktet står på Jerusalem, hovedstaden. Landet var lite: fra Betel til Beer-Sjeba er det omtrent 85 km i luftlinje, og Betlehem ligger bare 8 km sør for Jerusalem, Hebron omtrent 31 km."
    - "Størrelsen skiftet med herskerne. Under perserne var det den lille provinsen Yehud, Esras «landskapet Juda», knapt større enn åsene rundt Jerusalem; hasmoneerne gjorde det til et rike fra Galilea til Idumea. I evangeliene er Judea én region ved siden av Galilea og Samaria: Jesus er født i «Betlehem i Judea», Johannes forkynner «i Judeas ørken», og nyheten om Johannes’ fødsel spres «i alle Judeas fjellbygder». Når Lukas skriver at «Pontius Pilatus var landshøvding i Judea», omfattet den romerske provinsen også Samaria og Idumea og ble styrt fra Cæsarea ved kysten."
    - "Etter Bar Kokhba-opprøret i 132–135 e.Kr. ga Hadrian provinsen navnet Syria Palaestina, og Judea gikk ut av offisiell bruk. Judeas åser og ørken ligger i dag for det meste på Vestbredden, med Betlehem og Hebron; Israel kaller området Judea og Samaria."
  tl:
    - "Ang Judea ay ang lupain ng Juda sa paligid ng Jerusalem: ang katimugang maburol na lupain mula humigit-kumulang Beth-el hanggang Hebron at Beer-seba, kasama ang ilang na bumababa sa silangan patungo sa Dagat na Patay at ang mabababang burol ng Sephela na dumudulas sa kanluran, na karamihan ay nasa kasalukuyang West Bank at timog Israel. Nasa Jerusalem, ang kabisera nito, ang punto sa mapa. Maliit ito: ang Beth-el hanggang Beer-seba ay mga 85 km sa tuwid na guhit, at ang Bethlehem ay 8 km lamang sa timog ng Jerusalem, ang Hebron ay mga 31 km."
    - "Nagbago ang laki nito ayon sa mga namuno. Sa ilalim ng mga Persiano, ito ang maliit na lalawigan ng Yehud, ang “lalawigan ng Juda” ni Ezra, halos hindi mas malaki kaysa sa mga burol sa paligid ng Jerusalem; pinalaki ito ng mga Hasmoneo bilang isang kaharian mula Galilea hanggang Idumea. Sa mga Ebanghelyo, ang Judea ay isang rehiyon sa tabi ng Galilea at Samaria: ipinanganak si Jesus sa “Bet-lehem ng Judea”, nangangaral si Juan “sa ilang ng Judea”, at lumaganap ang balita tungkol sa kapanganakan ni Juan: “nabansag ang lahat ng mga bagay na ito sa lahat ng lupaing maburol ng Judea”. Nang isulat ni Lucas na “gobernador sa Judea si Poncio Pilato”, kasama rin sa lalawigang Romano ang Samaria at Idumea at pinamunuan ito mula sa Cesarea sa baybayin."
    - "Pagkatapos ng paghihimagsik ni Bar Kokhba noong 132–135 AD, pinangalanan ni Hadriano ang lalawigan na Syria Palaestina, at tumigil ang opisyal na paggamit ng Judea. Ang mga burol at disyerto ng Judea ay karamihang nasa West Bank ngayon, kasama ang Bethlehem at Hebron; tinatawag ng Israel ang lugar na Judea at Samaria."
  da:
    - "Judæa var Judas land omkring Jerusalem: det sydlige bjergland fra omkring Betel til Hebron og Beersheba, med ørkenen faldende mod øst til Det Døde Hav og Sjefelas lave højdedrag skrånende mod vest, det meste af det i nutidens Vestbred og det sydlige Israel. Kortets punkt står på Jerusalem, dets hovedstad. Det var lille: Fra Betel til Beersheba er der ca. 85 km i fugleflugt, og Betlehem ligger kun 8 km syd for Jerusalem, Hebron ca. 31 km."
    - "Dets størrelse skiftede med dets herskere. Under perserne var det den lille provins Yehud, Ezras »Landskab Juda«, knap større end højderne omkring Jerusalem; hasmonæerne udvidede det til et kongerige fra Galilæa til Idumæa. I evangelierne er Judæa én region ved siden af Galilæa og Samaria: Jesus er født »i Bethlehem i Judæa«, Johannes prædiker »i Judæas Ørken«, og nyheden om Johannes’ fødsel rygtes »over hele Judæas Bjergegn«. Når Lukas skriver »Pontius Pilatus var Landshøvding i Judæa«, omfattede den romerske provins også Samaria og Idumæa og blev styret fra Cæsarea ved kysten."
    - "Efter Bar Kokhba-oprøret i 132-135 e.Kr. omdøbte Hadrian provinsen til Syria Palæstina, og Judæa gik ud af den officielle brug. Judæas bjerge og ørken ligger i dag for størstedelens vedkommende på Vestbredden, med Betlehem og Hebron; Israel kalder området Judæa og Samaria."
