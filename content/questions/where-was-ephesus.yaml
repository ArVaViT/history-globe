id: where-was-ephesus
question:
  en: "Where was Ephesus?"
  ru: "Где находился Ефес?"
  uk: "Де був Ефес?"
  es: "¿Dónde estaba Éfeso?"
  pt: "Onde ficava Éfeso?"
  de: "Wo lag Ephesus?"
  fr: "Où se trouvait Éphèse ?"
  pl: "Gdzie leżał Efez?"
  it: "Dov’era Efeso?"
  cs: "Kde ležel Efez?"
  nl: "Waar lag Efeze?"
  sv: "Var låg Efesos?"
answer:
  en:
    - "Ephesus lay on the west coast of Asia Minor near the mouth of the river Cayster, beside the town of Selçuk in Turkey, south of Izmir (ancient Smyrna, 55 km away in a straight line). It is about 995 km from Jerusalem in a straight line and 1,035 km from Antioch by the roads on the map; the island of Patmos lies about 100 km to the south-west. The harbour silted up over the centuries, and the ruins now lie some way from the sea."
    - 'On his second journey Paul stopped briefly and left Aquila and Priscilla there. Returning, "Paul having passed through the upper coasts came to Ephesus", argued three months in the synagogue and then two years in the school of Tyrannus, "so that all they which dwelt in Asia heard the word of the Lord Jesus". The silversmith Demetrius raised a riot in the theatre over the shrines of Artemis. From Ephesus Paul wrote to the Corinthians, Timothy stayed in the city, and Revelation opens its letters "unto the angel of the church of Ephesus".'
    - "Greek tradition held that Ionians under Androclus founded the city beside an older shrine. Its fame was the temple of Artemis, burned by Herostratus in 356 BC and rebuilt as one of the Seven Wonders. About 290 BC Lysimachus moved the people to a new site between the hills, and from 133 BC the city belonged to the Roman province of Asia, whose proconsul resided there. Early tradition holds that the apostle John lived and was buried at Ephesus, and in 431 a council met there and condemned Nestorius."
  ru:
    - "Ефес лежал на западном побережье Малой Азии у устья реки Каистр, рядом с городком Сельчук в Турции, к югу от Измира (древней Смирны, в 55 км по прямой). От Иерусалима до него около 995 км по прямой, от Антиохии — 1035 км по дорогам на карте; остров Патмос лежит примерно в 100 км к юго-западу. Гавань за века заилилась, и руины теперь стоят в стороне от моря."
    - "Во втором путешествии Павел остановился здесь ненадолго и оставил Акилу и Прискиллу. Вернувшись, «Павел, пройдя верхние страны, прибыл в Ефес», три месяца проповедовал в синагоге, а потом два года в училище Тиранна, «так что все жители Асии слышали проповедь о Господе Иисусе». Серебряник Димитрий поднял в театре бунт из-за храмов Артемиды. Из Ефеса Павел писал коринфянам, в городе остался Тимофей, а Откровение начинает свои послания словами «Ангелу Ефесской церкви напиши»."
    - "Греческое предание говорило, что город основали ионийцы во главе с Андроклом рядом с более древним святилищем. Славу ему принёс храм Артемиды, сожжённый Геростратом в 356 г. до н. э. и отстроенный как одно из семи чудес света. Около 290 г. до н. э. Лисимах переселил жителей на новое место между холмами, а с 133 г. до н. э. город входил в римскую провинцию Асия, проконсул которой жил здесь. Раннее предание говорит, что апостол Иоанн жил и был погребён в Ефесе, а в 431 году здесь собрался собор, осудивший Нестория."
  uk:
    - "Ефес лежав на західному узбережжі Малої Азії, біля гирла річки Кайстр, поряд з містом Сельчук у Туреччині, на південь від Ізміра (давньої Смирни, за 55 км по прямій). До Єрусалима звідти близько 995 км по прямій, а до Антіохії — 1035 км дорогами на мапі; острів Патмос лежить приблизно за 100 км на південний захід. Протягом століть гавань замулилася, і руїни нині лежать на певній відстані від моря."
    - "Під час другої подорожі Павло ненадовго зупинився тут і залишив Акилу та Прискиллу. Повернувшись, «пройшовши Павел верхні сторони, прибув у Єфес», три місяці сперечався в синагозі, а потім два роки в школі Тирана, «так що всї, що проживали в Азиї, слухали слово Господа Ісуса». Срібник Димитрій здійняв заколот у театрі через храмики Артеміди. З Ефеса Павло писав до коринтян, у місті залишився Тимофій, а Одкровення розпочинає свої листи словами «Ангелові Єфеської церкви напиши»."
    - "Грецька традиція стверджувала, що іонійці під проводом Андрокла заснували місто біля давнішої святині. Його славою був храм Артеміди, спалений Геростратом 356 р. до н. е. й відбудований як одне з Семи див світу. Близько 290 року до н. е. Лісімах переселив жителів на нове місце між пагорбами, а від 133 року до н. е. місто належало римській провінції Азія, проконсул якої мешкав тут. Рання традиція твердить, що апостол Іван жив в Ефесі й був похований тут, а 431 року тут зібрався собор, який засудив Несторія."
  es:
    - "Éfeso se hallaba en la costa occidental de Asia Menor, cerca de la desembocadura del río Caístro, junto a la población de Selçuk, en Turquía, al sur de Izmir (la antigua Esmirna, a 55 km en línea recta). Dista unos 995 km de Jerusalén en línea recta y 1035 km de Antioquía por las calzadas del mapa; la isla de Patmos queda a unos 100 km al suroeste. El puerto se fue cegando con los siglos, y las ruinas están ahora a cierta distancia del mar."
    - "En su segundo viaje, Pablo hizo allí una breve parada y dejó a Aquila y Priscila. A su regreso, «Pablo, andadas las regiones superiores, vino á Efeso», disputó tres meses en la sinagoga y luego dos años en la escuela de Tirano, «de manera que todos los que habitaban en Asia… oyeron la palabra del Señor Jesús». El platero Demetrio provocó un alboroto en el teatro por los templecillos de Artemisa. Desde Éfeso escribió Pablo a los corintios, Timoteo se quedó en la ciudad, y el Apocalipsis abre sus cartas «al ángel de la iglesia en EFESO»."
    - "La tradición griega sostenía que unos jonios al mando de Androclo fundaron la ciudad junto a un santuario más antiguo. Su fama fue el templo de Artemisa, incendiado por Heróstrato en 356 a. C. y reconstruido como una de las Siete Maravillas. Hacia 290 a. C. Lisímaco trasladó a la población a un nuevo emplazamiento entre las colinas, y desde 133 a. C. la ciudad perteneció a la provincia romana de Asia, cuyo procónsul residía allí. La tradición antigua sostiene que el apóstol Juan vivió y fue sepultado en Éfeso, y en 431 se reunió allí un concilio que condenó a Nestorio."
  pt:
    - "Éfeso ficava na costa oeste da Ásia Menor, perto da foz do rio Caístro, junto à cidade de Selçuk, na Turquia, ao sul de Esmirna (a atual Izmir, a 55 km em linha reta). Fica a cerca de 995 km de Jerusalém em linha reta e a 1.035 km de Antioquia pelas estradas do mapa; a ilha de Patmos está a cerca de 100 km a sudoeste. O porto foi sendo assoreado ao longo dos séculos, e as ruínas ficam hoje a certa distância do mar."
    - "Em sua segunda viagem, Paulo parou ali brevemente e deixou Áquila e Priscila. Ao voltar, “Paulo, depois de passar pelas regiões do interior, chegou a Éfeso”, discutiu três meses na sinagoga e depois dois anos na escola de Tirano, “de modo que todos os que habitavam na Ásia ouviram a palavra do Senhor Jesus”. O ourives Demétrio provocou um tumulto no teatro por causa dos santuários de Ártemis. De Éfeso Paulo escreveu aos coríntios, Timóteo permaneceu na cidade, e o Apocalipse abre suas cartas “Ao anjo da igreja em Éfeso”."
    - "A tradição grega dizia que jônios sob Androclo fundaram a cidade junto a um santuário mais antigo. Sua fama era o templo de Ártemis, incendiado por Eróstrato em 356 a.C. e reconstruído como uma das Sete Maravilhas. Por volta de 290 a.C., Lisímaco transferiu a população para um novo sítio entre as colinas, e desde 133 a.C. a cidade pertenceu à província romana da Ásia, cujo procônsul residia ali. Uma tradição antiga sustenta que o apóstolo João viveu e foi sepultado em Éfeso, e em 431 reuniu-se ali um concílio que condenou Nestório."
  de:
    - "Ephesus lag an der Westküste Kleinasiens nahe der Mündung des Flusses Kaystros, neben der Stadt Selçuk in der Türkei, südlich von Izmir (dem antiken Smyrna, in der Luftlinie 55 km entfernt). Es ist in der Luftlinie etwa 995 km von Jerusalem entfernt und auf den Straßen der Karte 1035 km von Antiochia; die Insel Patmos liegt etwa 100 km südwestlich. Der Hafen versandete im Lauf der Jahrhunderte, und die Ruinen liegen heute ein Stück vom Meer entfernt."
    - "Auf seiner zweiten Reise hielt Paulus sich kurz auf und ließ Aquila und Priscilla dort zurück. Auf der Rückkehr, da er „durchwandelte die oberen Länder und kam gen Ephesus“, redete er drei Monate lang in der Synagoge und dann zwei Jahre lang in der Schule des Tyrannus, „also daß alle, die in Asien wohnten, das Wort des HERRN Jesus hörten“. Der Silberschmied Demetrius erregte im Theater wegen der Tempel der Artemis einen Aufruhr. Von Ephesus aus schrieb Paulus an die Korinther, Timotheus blieb in der Stadt, und die Offenbarung eröffnet ihre Sendschreiben mit „Dem Engel der Gemeinde zu Ephesus“."
    - "Nach griechischer Überlieferung gründeten Ionier unter Androklos die Stadt neben einem älteren Heiligtum. Berühmt war sie durch den Tempel der Artemis, den Herostratos 356 v. Chr. in Brand setzte und der als eines der Sieben Weltwunder wiederaufgebaut wurde. Um 290 v. Chr. siedelte Lysimachos die Bevölkerung an einen neuen Platz zwischen den Hügeln um, und ab 133 v. Chr. gehörte die Stadt zur römischen Provinz Asia, deren Prokonsul dort residierte. Nach früher Überlieferung lebte der Apostel Johannes in Ephesus und wurde dort begraben, und 431 tagte dort ein Konzil, das Nestorius verurteilte."
  fr:
    - "Éphèse s’élevait sur la côte occidentale de l’Asie Mineure, près de l’embouchure du Caÿstre, à côté de la ville de Selçuk, en Turquie, au sud d’Izmir (l’ancienne Smyrne, à 55 km à vol d’oiseau). Elle se trouve à environ 995 km de Jérusalem à vol d’oiseau et à 1 035 km d’Antioche par les routes de la carte ; l’île de Patmos est à environ 100 km au sud-ouest. Le port s’est ensablé au fil des siècles, et les ruines se trouvent aujourd’hui à quelque distance de la mer."
    - "Lors de son deuxième voyage, Paul s’y arrêta brièvement et y laissa Aquilas et Priscille. À son retour, « Paul, après avoir parcouru les hautes provinces de l’Asie, arriva à Éphèse », discuta trois mois dans la synagogue, puis deux ans dans l’école de Tyrannus, « de sorte que tous ceux qui habitaient l’Asie, Juifs et Grecs, entendirent la parole du Seigneur ». L’orfèvre Démétrius provoqua une émeute dans le théâtre à cause des sanctuaires d’Artémis. C’est d’Éphèse que Paul écrivit aux Corinthiens, Timothée resta dans la ville, et l’Apocalypse y adresse la première de ses lettres : « à l’ange de l’Église d’Éphèse »."
    - "La tradition grecque voulait que des Ioniens conduits par Androclos aient fondé la ville près d’un sanctuaire plus ancien. Sa gloire était le temple d’Artémis, incendié par Érostrate en 356 av. J.-C. et reconstruit comme l’une des Sept Merveilles. Vers 290 av. J.-C., Lysimaque déplaça la population vers un nouveau site entre les collines, et à partir de 133 av. J.-C. la ville appartint à la province romaine d’Asie, dont le proconsul y résidait. Selon une tradition ancienne, l’apôtre Jean vécut et fut enterré à Éphèse, et un concile s’y réunit en 431 et condamna Nestorius."
  pl:
    - "Efez leżał na zachodnim wybrzeżu Azji Mniejszej, niedaleko ujścia rzeki Kaystros, obok miasta Selçuk w Turcji, na południe od Izmiru (starożytnej Smyrny, oddalonej o 55 km w linii prostej). Od Jerozolimy dzieli go około 995 km w linii prostej, a od Antiochii 1035 km drogami z mapy; wyspa Patmos leży około 100 km na południowy zachód. Port zamulił się z biegiem wieków, a ruiny leżą dziś w pewnej odległości od morza."
    - "W czasie drugiej podróży Paweł zatrzymał się tam na krótko i zostawił Akwilę i Pryscyllę. Wracając, „Paweł obszedłszy górne krainy, przyszedł do Efezu”, przez trzy miesiące spierał się w synagodze, a potem przez dwa lata w szkole Tyranna, „tak iż wszyscy, którzy mieszkali w Azyi, słuchali słowa Pana Jezusowego”. Złotnik Demetriusz wywołał w teatrze zamieszki z powodu świątynek Artemidy. Z Efezu Paweł pisał do Koryntian, Tymoteusz pozostał w mieście, a Apokalipsa zaczyna swoje listy słowami „Aniołowi zboru Efeskiego”."
    - "Tradycja grecka głosiła, że Jonowie pod wodzą Androklosa założyli miasto obok starszej świątyni. Sławę przyniosła mu świątynia Artemidy, spalona przez Herostratesa w 356 p.n.e. i odbudowana jako jeden z siedmiu cudów świata. Około 290 p.n.e. Lizymach przeniósł mieszkańców na nowe miejsce między wzgórzami, a od 133 p.n.e. miasto należało do rzymskiej prowincji Azja, w której rezydował prokonsul. Wczesna tradycja głosi, że apostoł Jan mieszkał w Efezie i tam został pochowany, a w 431 roku zebrał się tu sobór, który potępił Nestoriusza."
  it:
    - "Efeso sorgeva sulla costa occidentale dell’Asia Minore, presso la foce del fiume Caistro, accanto alla città di Selçuk in Turchia, a sud di Izmir (l’antica Smirne, a 55 km in linea d’aria). Dista circa 995 km da Gerusalemme in linea d’aria e 1.035 km da Antiochia lungo le strade della mappa; l’isola di Patmos si trova a circa 100 km a sud-ovest. Il porto si insabbiò nel corso dei secoli, e le rovine si trovano ora a una certa distanza dal mare."
    - "Nel suo secondo viaggio Paolo vi si fermò brevemente e vi lasciò Aquila e Priscilla. Al ritorno, «Paolo, avendo traversato la parte alta del paese, venne ad Efeso», discusse per tre mesi nella sinagoga e poi per due anni nella scuola di Tiranno, «talché tutti coloro che abitavano nell’Asia… udirono la parola del Signore». L’argentiere Demetrio sollevò un tumulto nel teatro a causa dei tempietti di Artemide. Da Efeso Paolo scrisse ai Corinzi, Timoteo rimase in città, e l’Apocalisse apre le sue lettere «all’angelo della chiesa d’Efeso»."
    - "La tradizione greca riteneva che gli Ioni guidati da Androclo avessero fondato la città accanto a un santuario più antico. La sua fama era il tempio di Artemide, incendiato da Erostrato nel 356 a.C. e ricostruito come una delle Sette Meraviglie. Verso il 290 a.C. Lisimaco trasferì la popolazione in un nuovo sito tra le colline, e dal 133 a.C. la città appartenne alla provincia romana d’Asia, di cui vi risiedeva il proconsole. Un’antica tradizione sostiene che l’apostolo Giovanni visse e fu sepolto a Efeso, e nel 431 vi si riunì un concilio che condannò Nestorio."
  cs:
    - "Efez ležel na západním pobřeží Malé Asie poblíž ústí řeky Kaystros, vedle města Selçuk v Turecku, jižně od Izmiru (starověké Smyrny, vzdušnou čarou 55 km). Je to vzdušnou čarou asi 995 km od Jeruzaléma a 1 035 km od Antiochie po silnicích na mapě; ostrov Patmos leží asi 100 km na jihozápad. Přístav se v průběhu staletí zanesl a ruiny leží nyní kus od moře."
    - "Na druhé cestě se tu Pavel krátce zastavil a nechal tu Akvilu a Priscillu. Při návratu „Pavel prošed vrchní krajiny, přišel do Efezu“, tři měsíce se přel v synagoze a pak dva roky ve škole Tyrannově, „takže všickni, kteříž přebývali v Azii, poslouchali slova Pána Ježíše“. Stříbrník Démétrios vyvolal v divadle vzpouru kvůli svatyňkám Artemidiným. Z Efezu psal Pavel Korintským, Timoteus v městě zůstal a Zjevení začíná své listy slovy „Andělu Efezské církve“."
    - "Řecké podání tvrdilo, že Ióňané pod vedením Androkla založili město vedle starší svatyně. Jeho slávou byl chrám Artemidin, spálený Hérostratem roku 356 př. n. l. a znovu vystavěný jako jeden ze sedmi divů světa. Kolem roku 290 př. n. l. Lýsimachos přestěhoval obyvatele na nové místo mezi pahorky a od roku 133 př. n. l. město patřilo k římské provincii Asii, jejíž prokonzul tam sídlil. Rané podání praví, že apoštol Jan v Efezu žil a byl pohřben, a roku 431 se tam sešel koncil a odsoudil Nestoria."
  nl:
    - "Efeze lag aan de westkust van Klein-Azië bij de monding van de rivier de Kaystros, naast de stad Selçuk in Turkije, ten zuiden van Izmir (het antieke Smyrna, hemelsbreed 55 km verderop). Het ligt hemelsbreed ongeveer 995 km van Jeruzalem en 1035 km van Antiochië via de wegen op de kaart; het eiland Patmos ligt ongeveer 100 km naar het zuidwesten. De haven slibde in de loop der eeuwen dicht, en de ruïnes liggen nu een eind van de zee."
    - "Op zijn tweede reis bleef Paulus er kort en liet hij Aquila en Priscilla er achter. Bij zijn terugkeer gebeurde het dat “Paulus, de bovenste delen des lands doorreisd hebbende, te Efeze kwam”; hij redeneerde drie maanden in de synagoge en daarna twee jaar in de school van Tyrannus, “alzo dat allen, die in Azië woonden, het Woord van den Heere Jezus hoorden”. De zilversmid Demetrius veroorzaakte in het theater een oproer om de heiligdommen van Artemis. Vanuit Efeze schreef Paulus aan de Korinthiërs, Timoteüs bleef in de stad, en de Openbaring opent haar brieven “aan den engel der Gemeente van Efeze”."
    - "Volgens de Griekse overlevering stichtten Ioniërs onder Androklos de stad naast een ouder heiligdom. Haar roem was de tempel van Artemis, in 356 v.Chr. door Herostratus in brand gestoken en herbouwd als een van de Zeven Wereldwonderen. Rond 290 v.Chr. verplaatste Lysimachus de bevolking naar een nieuwe plek tussen de heuvels, en vanaf 133 v.Chr. behoorde de stad tot de Romeinse provincie Asia, waarvan de proconsul er resideerde. Volgens de vroege overlevering woonde de apostel Johannes in Efeze en werd hij er begraven, en in 431 kwam er een concilie bijeen dat Nestorius veroordeelde."
  sv:
    - "Efesos låg vid Mindre Asiens västkust nära mynningen av floden Kaystros, vid staden Selçuk i Turkiet, söder om Izmir (forntidens Smyrna, 55 km bort i fågelvägen). Det ligger omkring 995 km från Jerusalem i fågelvägen och 1 035 km från Antiochia längs vägarna på kartan; ön Patmos ligger omkring 100 km åt sydväst. Hamnen slammades igen under århundradenas lopp, och ruinerna ligger nu en bit från havet."
    - "På sin andra resa stannade Paulus där en kort tid och lämnade kvar Aquila och Priscilla. När han återvände kom han, ”sedan han hade farit genom de övre delarna av landet, ned till Efesus”, samtalade tre månader i synagogan och därefter två år i Tyrannos lärosal, så att ”alla provinsen Asiens inbyggare, både judar och greker, fingo på detta sätt höra Herrens ord”. Silversmeden Demetrios väckte uppror i teatern på grund av Artemis helgedomar. Från Efesos skrev Paulus till korinthierna, Timoteus stannade kvar i staden, och Uppenbarelseboken inleder sina brev med orden ”Skriv till Efesus’ församlings ängel”."
    - "Enligt grekisk tradition grundade joner under Androklos staden vid en äldre helgedom. Dess ryktbarhet vilade på Artemistemplet, som brändes av Herostratos 356 f.Kr. och byggdes upp igen som ett av världens sju underverk. Omkring 290 f.Kr. flyttade Lysimachos folket till en ny plats mellan kullarna, och från 133 f.Kr. tillhörde staden den romerska provinsen Asien, vars prokonsul residerade där. Enligt tidig tradition bodde aposteln Johannes i Efesos och blev begravd där, och år 431 sammanträdde ett kyrkomöte där och dömde Nestorios."
