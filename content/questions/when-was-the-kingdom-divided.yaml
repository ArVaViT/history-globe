# Draft question (the date of the division; a sibling question, "who-ruled-israel-after-solomon", takes the kings).
id: when-was-the-kingdom-divided
question:
  en: "When was the kingdom of Israel divided?"
  ru: "Когда разделилось царство Израильское?"
  uk: "Коли було поділено царство Ізраїлю?"
  es: "¿Cuándo se dividió el reino de Israel?"
  pt: "Quando foi dividido o reino de Israel?"
  de: "Wann wurde das Königreich Israel geteilt?"
  fr: "Quand le royaume d’Israël a-t-il été divisé ?"
  pl: "Kiedy podzieliło się królestwo Izraela?"
  it: "Quando fu diviso il regno d’Israele?"
  nl: "Wanneer werd het koninkrijk Israël verdeeld?"
  cs: "Kdy se rozdělilo království Izrael?"
  sv: "När delades Israels rike?"
  nb: "Når ble kongeriket Israel delt?"
  tl: "Kailan nahati ang kaharian ng Israel?"
  da: "Hvornår blev Israels rige delt?"
  sr: "Када је подељено краљевство Израиља?"
  hu: "Mikor szakadt ketté Izráel királysága?"
  fi: "Milloin Israelin kuningaskunta jakautui?"
  vi: "Vương quốc Y-sơ-ra-ên bị chia đôi khi nào?"
  ro: "Când a fost împărțit regatul lui Israel?"
  bg: "Кога се е разделило Израилевото царство?"
answer:
  en:
    - "The kingdom divided about 931 BC, at the death of Solomon, when the northern tribes gathered at Shechem refused his son Rehoboam and made Jeroboam their king; 930 BC is also widely held, and some scholars put it at 922. The map uses c. 931 BC, the date of Thiele's chronology. Shechem, where it happened, lies about 49 km north of Jerusalem in a straight line."
    - "Rehoboam went to Shechem, “for all Israel were come to Shechem to make him king”, and the people asked him to lighten the yoke of forced labour his father had laid on them. He took the advice of the young men: “my father also chastised you with whips, but I will chastise you with scorpions.” The answer was the old cry of rebellion: “What portion have we in David? neither have we inheritance in the son of Jesse: to your tents, O Israel.” Jeroboam, who had fled to Egypt from Solomon, was made king over all Israel, and “there was none that followed the house of David, but the tribe of Judah only”; the Russian Synodal text adds Benjamin here. “So Israel rebelled against the house of David unto this day.” Jeroboam fortified Shechem and, so that the people need not go up to Jerusalem, set golden calves at Bethel and at Dan, about 16 and 168 km from Jerusalem in a straight line."
    - "The Bible gives no absolute year, so the date is reckoned backward from Assyrian records: Ahab fought at Qarqar in 853 BC and Jehu paid tribute to Shalmaneser III in 841, as the Kurkh Monolith and the Black Obelisk record. Adding up the reigns of Kings from there, with Israel and Judah starting their years in different months and sons sometimes reigning beside their fathers, Thiele arrived at 931/930 BC for the death of Solomon; Albright, who thought the figures needed more correction, gave 922. A second check comes from Egypt: “in the fifth year of king Rehoboam, that Shishak king of Egypt came up against Jerusalem”, and Shoshenq I recorded that campaign on the Bubastite Portal at Karnak, about 925 BC. The two kingdoms never reunited, and Israel fell to Assyria in 722 BC, Judah to Babylon in 586."
  ru:
    - "Царство разделилось около 931 г. до н. э., по смерти Соломона, когда северные колена, собравшиеся в Сихеме, отвергли его сына Ровоама и поставили царём Иеровоама; многие называют 930 г., некоторые учёные — 922-й. Карта показывает условный 931 г. до н. э., дату хронологии Тиле. Сихем, где это произошло, лежит примерно в 49 км к северу от Иерусалима по прямой."
    - "Ровоам пошёл в Сихем, «ибо в Сихем пришли все Израильтяне, чтобы воцарить его», и народ просил облегчить иго принудительных работ, наложенное его отцом. Он послушал молодых людей: «отец мой наказывал вас бичами, а я буду наказывать вас скорпионами». В ответ прозвучал старый клич мятежа: «какая нам часть в Давиде? нет нам доли в сыне Иессеевом; по шатрам своим, Израиль!» Иеровоама, бежавшего от Соломона в Египет, воцарили над всем Израилем, и «за домом Давидовым не осталось никого, кроме колена Иудина и Вениаминова» — так в Синодальном переводе; в еврейском тексте названо одно колено Иудино. «И отложился Израиль от дома Давидова до сего дня». Иеровоам обстроил Сихем и, чтобы народ не ходил в Иерусалим, поставил золотых тельцов в Вефиле и в Дане — в 16 и 168 км от Иерусалима по прямой."
    - "Библия не даёт абсолютного года, и дату отсчитывают назад от ассирийских записей: Ахав сражался при Каркаре в 853 г. до н. э., а Ииуй платил дань Салманасару III в 841-м, как сообщают Куркхский монолит и Чёрный обелиск. Складывая от этой точки годы царствований из книг Царств — с учётом того, что Израиль и Иудея начинали год в разные месяцы, а сыновья порой правили вместе с отцами, — Тиле вышел на 931/930 г. до н. э. для смерти Соломона; Олбрайт, считавший, что числа нуждаются в большей правке, дал 922-й. Вторая проверка — из Египта: «На пятом году царствования Ровоамова, Сусаким, царь Египетский, вышел против Иерусалима», и Шешонк I запечатлел этот поход на Бубастисском портале в Карнаке, около 925 г. до н. э. Два царства больше не соединились: Израиль пал под Ассирией в 722 г. до н. э., Иудея под Вавилоном — в 586-м."
  uk:
    - "Царство розділилося близько 931 р. до н. е., після смерті Соломона, коли північні коліна, зібрані в Сихемі, відмовили його синові Ровоаму й проголосили царем Єровоама; 930 р. до н. е. також широко підтримують, а деякі вчені ставлять 922 р. Мапа використовує близько 931 р. до н. е. — дату хронології Тіле. Сихем, де це сталося, лежить приблизно за 49 км на північ від Єрусалиму по прямій."
    - "Ровоам пішов у Сихем, «бо в Сихемі скупивсь увесь Ізраїль, щоб окликнути його царем», і народ просив його полегшити ярмо примусової праці, яке наклав на них його батько. Він прийняв раду молодих: «коли батько мій карав вас палками, то я карати му скорпіонами». Відповіддю був давній клич повстання: «Що за часть нам у Давидї? яке наслїддє в синові Ессейовому? Гей, Ізраїлю, додому!» Єровоама, що втік до Єгипту від Соломона, було зроблено царем над усім Ізраїлем, і «до Давидового дому не пристав нїхто крім одного поколїння Юдиного»; російський Синодальний текст додає тут Веніяміна. «Так відпав Ізраїль од дому Давидового по сей день». Єровоам укріпив Сихем і, щоб народові не треба було ходити до Єрусалиму, поставив золотих тельців у Бет-Елі й у Дані, приблизно за 16 і 168 км від Єрусалиму по прямій."
    - "Біблія не дає абсолютного року, тож дату відлічують назад від ассирійських записів: Ахав бився при Каркарі 853 р. до н. е., а Єгу платив данину Салманассарові III 841 р., як записано на Куркському моноліті та Чорному обеліску. Підсумувавши царювання з Книг Царів, із урахуванням того, що Ізраїль і Юда починали роки в різні місяці, а сини іноді царювали поряд із батьками, Тіле дійшов 931/930 р. до н. е. для смерті Соломона; Олбрайт, який вважав, що цифри потребують більшого виправлення, дав 922 р. Друга перевірка надходить з Єгипту: «В пятому роцї царювання Робоамового наступив на Ерусалим Египецький царь Сусаким», а Шешонк I записав цей похід на Бубастійському порталі в Карнаку, близько 925 р. до н. е. Два царства так і не возз'єдналися, і Ізраїль упав перед Ассирією 722 р. до н. е., а Юда перед Вавилоном 586 р."
  es:
    - "El reino se dividió hacia el 931 a. C., a la muerte de Salomón, cuando las tribus del norte reunidas en Siquem rechazaron a su hijo Roboam e hicieron rey a Jeroboam; el 930 a. C. también se sostiene ampliamente, y algunos estudiosos lo sitúan en el 922. El mapa usa hacia el 931 a. C., la fecha de la cronología de Thiele. Siquem, donde ocurrió, queda a unos 49 km al norte de Jerusalén en línea recta."
    - "Roboam fue a Siquem, «porque todo Israel había venido á Sichêm para hacerlo rey», y el pueblo le pidió aligerar el yugo de trabajos forzados que su padre les había impuesto. Siguió el consejo de los jóvenes: «mi padre os hirió con azotes, mas yo os heriré con escorpiones». La respuesta fue el viejo grito de rebelión: «¿Qué parte tenemos nosotros con David? No tenemos heredad en el hijo de Isaí. ¡Israel, á tus estancias!». Jeroboam, que había huido a Egipto de Salomón, fue hecho rey sobre todo Israel, «sin quedar tribu alguna que siguiese la casa de David, sino sólo la tribu de Judá»; el texto sinodal ruso añade aquí a Benjamín. «Así se apartó Israel de la casa de David hasta hoy». Jeroboam fortificó Siquem y, para que el pueblo no tuviera que subir a Jerusalén, puso becerros de oro en Betel y en Dan, a unos 16 y 168 km de Jerusalén en línea recta."
    - "La Biblia no da ningún año absoluto, de modo que la fecha se calcula hacia atrás a partir de registros asirios: Acab combatió en Qarqar en el 853 a. C. y Jehú pagó tributo a Salmanasar III en el 841, como registran el Monolito de Kurkh y el Obelisco Negro. Sumando desde allí los reinados de Reyes, con Israel y Judá comenzando sus años en meses distintos y con hijos que a veces reinaban junto a sus padres, Thiele llegó al 931/930 a. C. para la muerte de Salomón; Albright, que pensaba que las cifras necesitaban más corrección, dio el 922. Una segunda comprobación viene de Egipto: «Al quinto año del rey Roboam subió Sisac rey de Egipto contra Jerusalem», y Sheshonq I registró esa campaña en el Pórtico Bubastita de Karnak, hacia el 925 a. C. Los dos reinos nunca se reunificaron, e Israel cayó ante Asiria en el 722 a. C. y Judá ante Babilonia en el 586."
  pt:
    - "O reino se dividiu por volta de 931 a.C., à morte de Salomão, quando as tribos do norte, reunidas em Siquém, rejeitaram seu filho Roboão e fizeram rei Jeroboão; também se defende amplamente 930 a.C., e alguns estudiosos o põem em 922. O mapa usa c. 931 a.C., a data da cronologia de Thiele. Siquém, onde isso aconteceu, fica a cerca de 49 km ao norte de Jerusalém em linha reta."
    - "Roboão foi a Siquém, “pois todo o Israel tinha ido a Siquém para fazê-lo rei”, e o povo lhe pediu que aliviasse o jugo do trabalho forçado que seu pai lhe impusera. Ele seguiu o conselho dos jovens: “Meu pai os castigou com chicotes, mas eu os castigarei com escorpiões.” A resposta foi o velho grito de rebelião: “Que porção temos nós em Davi? Não temos herança no filho de Jessé. Às suas tendas, ó Israel!” Jeroboão, que fugira de Salomão para o Egito, foi feito rei sobre todo o Israel, e “não houve ninguém que seguisse a casa de Davi, exceto somente a tribo de Judá”; o texto sinodal russo acrescenta aqui Benjamim. “Assim, Israel se rebelou contra a casa de Davi até o dia de hoje.” Jeroboão fortificou Siquém e, para que o povo não precisasse subir a Jerusalém, pôs bezerros de ouro em Betel e em Dã, a cerca de 16 e 168 km de Jerusalém em linha reta."
    - "A Bíblia não dá ano absoluto, de modo que a data é calculada de trás para a frente a partir de registros assírios: Acabe lutou em Carcar em 853 a.C. e Jeú pagou tributo a Salmaneser III em 841, como registram o Monólito de Kurkh e o Obelisco Negro. Somando daí os reinados de Reis, com Israel e Judá começando os anos em meses diferentes e filhos reinando às vezes ao lado dos pais, Thiele chegou a 931/930 a.C. para a morte de Salomão; Albright, que julgava que os números precisavam de mais correção, deu 922. Uma segunda verificação vem do Egito: “No quinto ano do rei Roboão, Sisaque, rei do Egito, subiu contra Jerusalém”, e Shoshenq I registrou essa campanha no Portal Bubastita, em Carnaque, por volta de 925 a.C. Os dois reinos nunca se reuniram, e Israel caiu diante da Assíria em 722 a.C., Judá diante de Babilônia em 586."
  de:
    - "Das Reich teilte sich um 931 v. Chr., beim Tod Salomos, als die in Sichem versammelten Nordstämme seinen Sohn Rehabeam ablehnten und Jerobeam zu ihrem König machten; auch 930 v. Chr. wird weithin vertreten, und manche Gelehrte setzen es auf 922. Die Karte verwendet um 931 v. Chr., das Datum der Chronologie Thieles. Sichem, wo es geschah, liegt etwa 49 km nördlich von Jerusalem in der Luftlinie."
    - "Rehabeam zog nach Sichem, „denn das ganze Israel war gen Sichem gekommen, ihn zum König zu machen“, und das Volk bat um Erleichterung des Frondienstjochs seines Vaters. Er folgte dem Rat der Jungen: „Mein Vater hat euch mit Peitschen gezüchtigt; ich aber will euch mit Skorpionen züchtigen.“ Die Antwort war der alte Aufruhrruf: „Was haben wir für Teil an David oder Erbe am Sohn Isais? Israel, hebe dich zu deinen Hütten!“ Jerobeam, der vor Salomo nach Ägypten geflohen war, wurde König über ganz Israel, „und folgte niemand dem Hause David als der Stamm Juda allein“; der russische Synodaltext fügt hier Benjamin hinzu. „Also fiel Israel ab vom Hause David bis auf diesen Tag.“ Jerobeam befestigte Sichem und stellte, damit das Volk nicht nach Jerusalem hinaufziehen müsse, goldene Kälber in Bethel und Dan auf, etwa 16 und 168 km Luftlinie von Jerusalem."
    - "Die Bibel gibt kein absolutes Jahr, daher wird das Datum von assyrischen Quellen aus rückwärts gerechnet: Ahab kämpfte 853 v. Chr. bei Karkar und Jehu zahlte 841 Salmanassar III. Tribut, wie der Kurch-Monolith und der Schwarze Obelisk berichten. Indem er von dort die Regierungen der Könige zusammenzählte, wobei Israel und Juda ihre Jahre in verschiedenen Monaten begannen und Söhne zuweilen neben ihren Vätern regierten, gelangte Thiele zu 931/930 v. Chr. für Salomos Tod; Albright, der die Zahlen für korrekturbedürftiger hielt, nannte 922. Eine zweite Probe kommt aus Ägypten: „Aber im fünften Jahr des Königs Rehabeam zog Sisak, der König in Ägypten, herauf wider Jerusalem“, und Scheschonq I. hielt diesen Feldzug um 925 v. Chr. auf dem Bubastidentor in Karnak fest. Die beiden Reiche wurden nie wieder vereint; Israel fiel 722 v. Chr. an Assyrien, Juda 586 an Babylon."
  fr:
    - "Le royaume se divisa vers 931 av. J.-C., à la mort de Salomon, quand les tribus du nord, réunies à Sichem, refusèrent son fils Roboam et firent Jéroboam leur roi ; 930 av. J.-C. est aussi largement admis, et certains savants le placent en 922. La carte retient vers 931 av. J.-C., date de la chronologie de Thiele. Sichem, où cela se produisit, est à environ 49 km au nord de Jérusalem en ligne droite."
    - "Roboam se rendit à Sichem, « car tout Israël était venu à Sichem pour le faire roi », et le peuple lui demanda d’alléger le joug de corvée de son père. Il suivit le conseil des jeunes gens : « mon père vous a châtiés avec des fouets, et moi je vous châtierai avec des scorpions ». La réponse fut le vieux cri de révolte : « Quelle part avons-nous avec David ? Nous n’avons point d’héritage avec le fils d’Isaï ! À tes tentes, Israël ! » Jéroboam, enfui en Égypte loin de Salomon, fut fait roi sur tout Israël, et « la tribu de Juda fut la seule qui suivit la maison de David » ; le texte synodal russe ajoute ici Benjamin. « C’est ainsi qu’Israël s’est détaché de la maison de David jusqu’à ce jour. » Jéroboam fortifia Sichem et, pour que le peuple n’eût pas à monter à Jérusalem, plaça des veaux d’or à Béthel et à Dan, à environ 16 et 168 km de Jérusalem en ligne droite."
    - "La Bible ne donne aucune année absolue ; on compte à rebours depuis les annales assyriennes : Achab combattit à Qarqar en 853 av. J.-C. et Jéhu paya tribut à Salmanasar III en 841, comme l’enregistrent le Monolithe de Kurkh et l’Obélisque noir. En additionnant à partir de là les règnes des Rois, Israël et Juda commençant leurs années à des mois différents et les fils régnant parfois aux côtés de leurs pères, Thiele arriva à 931/930 av. J.-C. pour la mort de Salomon ; Albright, qui jugeait les chiffres à corriger davantage, donna 922. Autre recoupement, égyptien : « La cinquième année du règne de Roboam, Schischak, roi d’Égypte, monta contre Jérusalem », et Sheshonq Ier enregistra cette campagne sur le portail bubastite de Karnak, vers 925 av. J.-C. Les deux royaumes ne se réunirent jamais : Israël tomba devant l’Assyrie en 722 av. J.-C., Juda devant Babylone en 586."
  pl:
    - "Królestwo podzieliło się około 931 p.n.e., po śmierci Salomona, gdy plemiona północne zebrane w Sychem odrzuciły jego syna Roboama i uczyniły królem Jeroboama; powszechnie przyjmuje się też 930 p.n.e., a niektórzy uczeni podają 922. Mapa używa około 931 p.n.e., daty z chronologii Thielego. Sychem, gdzie to się stało, leży około 49 km na północ od Jerozolimy w linii prostej."
    - "Roboam pojechał do Sychem, „bo w Sychem zebrał się był wszystek Izrael, aby go postanowili królem”, a lud prosił go o złagodzenie jarzma przymusowej pracy, które nałożył na nich jego ojciec. Posłuchał rady młodych: „ojciec mój karał was biczykami, ale ja was będę karał korbaczami”. Odpowiedzią był dawny okrzyk buntu: „Cóż my mamy za dział w Dawidzie? a co za dziedzictwo w synu Isajowym? Idź do namiotów swych, o Izraelu”. Jeroboam, który uciekł przed Salomonem do Egiptu, został królem całego Izraela, a „Nie zostało przy domu Dawidowym jedno samo pokolenie Judowe”; tekst synodalny dodaje tu Beniamina. „A tak odstąpili Izraelczycy od domu Dawidowego, aż do dnia tego”. Jeroboam umocnił Sychem i, aby lud nie musiał chodzić do Jerozolimy, postawił złote cielce w Betel i w Dan, około 16 i 168 km od Jerozolimy w linii prostej."
    - "Biblia nie podaje roku bezwzględnego, więc datę liczy się wstecz od zapisów asyryjskich: Achab walczył pod Karkar w 853 p.n.e., a Jehu zapłacił daninę Salmanasarowi III w 841, jak notują Monolit z Kurkh i Czarny Obelisk. Dodając od tego punktu panowania z Ksiąg Królewskich, przy czym Izrael i Juda zaczynały lata w różnych miesiącach, a synowie czasem panowali obok ojców, Thiele doszedł do 931/930 p.n.e. dla śmierci Salomona; Albright, który sądził, że liczby wymagają większej korekty, podał 922. Drugie sprawdzenie pochodzi z Egiptu: „roku piątego królowania Roboama, że wyciągnął Sesak, król Egipski, przeciw Jeruzalemowi”, a Szoszenk I zapisał tę wyprawę na Portalu Bubastyckim w Karnaku, około 925 p.n.e. Oba królestwa nigdy się nie zjednoczyły, a Izrael padł przed Asyrią w 722 p.n.e., Juda przed Babilonem w 586."
  it:
    - "Il regno si divise intorno al 931 a.C., alla morte di Salomone, quando le tribù del nord, riunite a Sichem, rifiutarono suo figlio Roboamo e fecero re Geroboamo; è molto diffuso anche il 930 a.C., e alcuni studiosi lo pongono al 922. La mappa usa il 931 a.C. circa, la data della cronologia di Thiele. Sichem, dove avvenne, dista circa 49 km a nord di Gerusalemme in linea retta."
    - "Roboamo andò a Sichem, «perché tutto Israele era venuto a Sichem per farlo re», e il popolo gli chiese di alleggerire il giogo dei lavori forzati di suo padre. Seguì il consiglio dei giovani: «mio padre vi ha castigati con la frusta, e io vi castigherò coi flagelli a punte». La risposta fu il vecchio grido di rivolta: «Che abbiam noi da fare con Davide? Noi non abbiam nulla di comune col figliuolo d’Isai! Alle tue tende, o Israele!» Geroboamo, fuggito in Egitto da Salomone, fu fatto re su tutto Israele, e «Nessuno seguitò la casa di Davide, tranne la sola tribù di Giuda»; il testo sinodale russo qui aggiunge Beniamino. «Così Israele si ribellò alla casa di Davide, ed è rimasto ribelle fino al dì d’oggi». Geroboamo fortificò Sichem e, perché il popolo non salisse a Gerusalemme, pose vitelli d’oro a Betel e a Dan, a circa 16 e 168 km da Gerusalemme in linea retta."
    - "La Bibbia non dà alcun anno assoluto, così la data si calcola a ritroso dai documenti assiri: Acab combatté a Qarqar nell’853 a.C. e Ieu pagò tributo a Salmanàssar III nell’841, come registrano il Monolito di Kurkh e l’Obelisco Nero. Sommando da lì i regni dei Re, con Israele e Giuda che iniziavano gli anni in mesi diversi e figli che a volte regnavano accanto ai padri, Thiele giunse al 931/930 a.C. per la morte di Salomone; Albright, che riteneva le cifre bisognose di più correzione, diede il 922. Un secondo controllo viene dall’Egitto: «L’anno quinto del regno di Roboamo, Scishak, re d’Egitto, salì contro Gerusalemme», e Sheshonq I registrò quella campagna sul Portale Bubastita a Karnak, circa il 925 a.C. I due regni non si riunirono mai, e Israele cadde in mano all’Assiria nel 722 a.C., Giuda a Babilonia nel 586."
  nl:
    - "Het koninkrijk werd omstreeks 931 v.Chr. verdeeld, bij de dood van Salomo, toen de noordelijke stammen die zich in Sichem hadden verzameld zijn zoon Rehabeam weigerden en Jerobeam tot hun koning maakten; ook 930 v.Chr. wordt veel aangehouden, en sommige geleerden plaatsen het op 922. De kaart gebruikt ca. 931 v.Chr., de datum van de chronologie van Thiele. Sichem, waar het gebeurde, ligt hemelsbreed ongeveer 49 km ten noorden van Jeruzalem."
    - "Rehabeam ging naar Sichem, “want het ganse Israel was te Sichem gekomen, om hem koning te maken”, en het volk vroeg verlichting van de dwangarbeid van zijn vader. Hij volgde de raad van de jongelingen: “mijn vader heeft u met geselen gekastijd, maar ik zal u met schorpioenen kastijden”. Het antwoord was de oude opstandskreet: “Wat deel hebben wij aan David? Ja, geen erve hebben wij aan den zoon van Isai; naar uw tenten, o Israel!” Jerobeam, voor Salomo naar Egypte gevlucht, werd koning over heel Israël, en “niemand volgde het huis Davids, dan de stam van Juda alleen”; de Russische Synodale tekst voegt hier Benjamin toe. “Alzo vielen de Israëlieten van het huis Davids af, tot op dezen dag.” Jerobeam versterkte Sichem en plaatste, opdat het volk niet naar Jeruzalem hoefde op te gaan, gouden kalveren te Bethel en Dan, hemelsbreed ongeveer 16 en 168 km van Jeruzalem."
    - "De Bijbel geeft geen absoluut jaar, dus de datum wordt teruggerekend vanuit Assyrische bronnen: Achab streed in 853 v.Chr. bij Qarqar en Jehu betaalde in 841 schatting aan Salmaneser III, zoals de Monoliet van Kurkh en de Zwarte Obelisk vermelden. Door vanaf daar de regeringen uit Koningen op te tellen, met Israël en Juda die hun jaren in verschillende maanden begonnen en zonen die soms naast hun vaders regeerden, kwam Thiele op 931/930 v.Chr. voor Salomo’s dood; Albright, die meer correctie van de cijfers nodig vond, gaf 922. Een tweede controle komt uit Egypte: “in het vijfde jaar van den koning Rehabeam, dat Sisak, de koning van Egypte, optoog tegen Jeruzalem”, en Sjosjenq I legde die veldtocht vast op de Bubastitische Poort in Karnak, omstreeks 925 v.Chr. De twee koninkrijken werden nooit herenigd; Israël viel in 722 aan Assyrië, Juda in 586 aan Babylon."
  cs:
    - "Království se rozdělilo asi 931 př. n. l., po Šalomounově smrti, kdy severní kmeny shromážděné v Šekemu odmítly jeho syna Rechabeáma a učinily svým králem Jarobeáma; široce se hájí i 930 př. n. l. a někteří badatelé uvádějí 922. Mapa užívá asi 931 př. n. l., datum Thieleho chronologie. Šekem, kde se to stalo, leží asi 49 km severně od Jeruzaléma vzdušnou čarou."
    - "Rechabeám šel do Šekemu, „nebo tam sešel se byl všecken Izrael, aby ho ustanovili za krále“, a lid ho prosil, aby ulehčil jho nucených prací, které na něj uvalil jeho otec. Přijal radu mladíků: „otec můj trestal vás bičíky, ale já trestati vás budu biči uzlovatými.“ Odpovědí byl starý výkřik vzpoury: „Jakýž máme díl v Davidovi? Ani dědictví nemáme v synu Izai. K stanům svým, ó Izraeli!“ Jarobeám, který před Šalomounem utekl do Egypta, byl učiněn králem nade vším Izraelem a „nezůstávalo při domu Davidovu než samo pokolení Judovo“; ruský synodální text zde přidává Benjamína. „A tak odstoupili synové Izraelští od domu Davidova až do dnešního dne.“ Jarobeám opevnil Šekem a aby lid nemusel chodit do Jeruzaléma, postavil zlatá telata v Bét-elu a v Danu, vzdálených vzdušnou čarou asi 16 a 168 km od Jeruzaléma."
    - "Bible nedává absolutní rok, a proto se datum počítá zpětně z asyrských záznamů: Achab bojoval u Qarqaru roku 853 př. n. l. a Jehú platil tribut Salmanasarovi III. roku 841, jak zaznamenávají Kurchův monolit a Černý obelisk. Sečtením vlád z Knih Královských odtud, s ohledem na to, že Izrael a Juda počítaly roky od různých měsíců a že synové někdy vládli vedle otců, dospěl Thiele k 931/930 př. n. l. pro Šalomounovu smrt; Albright, který soudil, že čísla potřebují větší opravu, uvedl 922. Druhá kontrola pochází z Egypta: „léta pátého království Roboámova, že vytáhl Sesák král Egyptský proti Jeruzalému“, a Šošenk I. toto tažení zaznamenal na Bubastitské bráně v Karnaku, asi 925 př. n. l. Obě království se nikdy nespojila a Izrael padl Asýrii roku 722 př. n. l., Judsko Babylónu roku 586."
  sv:
    - "Riket delades omkring 931 f.Kr., vid Salomos död, när de norra stammarna som samlats i Shekem vägrade hans son Rehabeam och gjorde Jerobeam till sin kung; 930 f.Kr. är också vitt förfäktat, och vissa forskare sätter det till 922. Kartan använder omkring 931 f.Kr., datum enligt Thieles kronologi. Shekem, där det hände, ligger omkring 49 km norr om Jerusalem fågelvägen."
    - "Rehabeam drog till Shekem, ”ty hela Israel hade kommit till Sikem för att göra honom till konung”, och folket bad honom lätta det ok av tvångsarbete som hans fader lagt på dem. Han följde de unga männens råd: ”har min fader tuktat eder med ris, så skall jag tukta eder med skorpiongissel.” Svaret var det gamla upprorsropet: ”Vad del hava vi i David? Ingen arvslott hava vi i Isais son. Drag hem till dina hyddor, Israel.” Jerobeam, som hade flytt till Egypten undan Salomo, gjordes till kung över hela Israel, och ”ingen höll sig till Davids hus, utom Juda stam allena”; Synodalbibelns text lägger här till Benjamin. ”Så avföll Israel från Davids hus och har varit skilt därifrån ända till denna dag.” Jerobeam befäste Shekem och ställde, för att folket inte skulle behöva gå upp till Jerusalem, upp gyllene kalvar i Betel och i Dan, ca 16 och 168 km från Jerusalem fågelvägen."
    - "Bibeln anger inget absolut år, så dateringen räknas bakåt från assyriska källor: Achav stred vid Qarqar 853 f.Kr. och Jehu betalade tribut till Salmanassar III 841, som Kurkhmonoliten och Svarta obelisken uppger. Genom att lägga ihop kungarnas regeringstider i Kungaböckerna därifrån, med Israel och Juda som började sina år i olika månader och söner som ibland regerade vid sidan av sina fäder, kom Thiele fram till 931/930 f.Kr. för Salomos död; Albright, som ansåg att siffrorna behövde mer korrigering, angav 922. En andra kontroll kommer från Egypten: ”i konung Rehabeams femte regeringsår drog Sosak, konungen i Egypten, upp mot Jerusalem”, och Shoshenq I förtecknade det fälttåget på Bubastisportalen i Karnak, omkring 925 f.Kr. De båda kungarikena återförenades aldrig, och Israel föll för Assyrien 722 f.Kr., Juda för Babylon 586."
  nb:
    - "Kongeriket ble delt omkring 931 f.Kr., ved Salomos død, da nordstammene samlet i Sikem avviste hans sønn Rehabeam og gjorde Jeroboam til sin konge; 930 f.Kr. er også utbredt, og noen forskere setter det til 922. Kartet bruker ca. 931 f.Kr., datoen i Thieles kronologi. Sikem, der det skjedde, ligger omtrent 49 km nord for Jerusalem i luftlinje."
    - "Rehabeam dro til Sikem, «for hele Israel var kommet til Sikem for å gjøre ham til konge», og folket ba ham lette åket av pliktarbeid som faren hadde lagt på dem. Han fulgte rådet fra de unge mennene: «har min far tuktet eder med sveper, så vil jeg tukte eder med skorpioner». Svaret var det gamle opprørsropet: «Hvad del har vi i David? Vi har ingen lodd i Isais sønn. Til dine telt, Israel!» Jeroboam, som hadde flyktet til Egypt for Salomo, ble gjort til konge over hele Israel, og «det var ikke nogen som holdt sig til Davids hus, uten Juda stamme alene»; den russiske synodalteksten tilføyer Benjamin her. «Således falt Israel fra Davids hus, og så har det vært til denne dag.» Jeroboam befestet Sikem og satte, for at folket ikke skulle behøve å dra opp til Jerusalem, gullkalver i Betel og i Dan, omtrent 16 og 168 km fra Jerusalem i luftlinje."
    - "Bibelen gir intet absolutt år, så datoen regnes bakover fra assyriske kilder: Ahab kjempet ved Qarqar i 853 f.Kr., og Jehu betalte tributt til Salmanassar III i 841, slik Kurkh-monolitten og Den svarte obelisk melder. Ved å legge sammen kongenes regjeringstider i Kongebøkene herfra, med Israel og Juda som begynte årene i ulike måneder og sønner som noen ganger regjerte ved siden av fedrene, kom Thiele til 931/930 f.Kr. for Salomos død; Albright, som mente tallene trengte mer korrigering, ga 922. En andre kontroll kommer fra Egypt: «i kong Rehabeams femte år at Egyptens konge Sisak drog op mot Jerusalem», og Sjosjenk I opptegnet det felttoget på Bubastis-portalen i Karnak, omkring 925 f.Kr. De to rikene ble aldri gjenforent, og Israel falt til Assyria i 722 f.Kr., Juda til Babylon i 586."
  tl:
    - "Nahati ang kaharian noong mga 931 BK, sa pagkamatay ni Salomon, nang tanggihan ng mga hilagang lipi na nagtipon sa Sichem ang anak niyang si Roboam at gawing hari si Jeroboam; malawak ding pinaniniwalaan ang 930 BK, at itinatakda ito ng ilang iskolar sa 922. Ginagamit ng mapa ang mga 931 BK, ang petsa ng kronolohiya ni Thiele. Ang Sichem, kung saan ito nangyari, ay nasa mga 49 km sa hilaga ng Jerusalem sa tuwid na guhit."
    - "Pumunta si Roboam sa Sichem, “sapagka't ang buong Israel ay naparoon sa Sichem upang gawin siyang hari”; hiniling nila na pagaanin ang sapilitang paggawa ng ama. Sinunod niya ang mga binata: “pinarusahan kayo ng aking ama ng mga panghagupit, nguni't parurusahan ko kayo ng mga tila alakdan.” Sigaw ng paghihimagsik ang tugon: “Anong bahagi mayroon kami kay David? at wala man kaming mana sa anak ni Isai: sa iyong mga tolda, Oh Israel.” Ginawang hari sa buong Israel si Jeroboam, na tumakas sa Egipto mula kay Salomon, at “walang sumunod sa sangbahayan ni David, kundi ang lipi ni Juda lamang”; dagdag ng tekstong Sinodal na Ruso ang Benjamin. “Gayon nanghimagsik ang Israel laban sa sangbahayan ni David, hanggang sa araw na ito”. Pinatibay ni Jeroboam ang Sichem at, upang di umahon sa Jerusalem, naglagay ng gintong guya sa Beth-el at Dan, mga 16 at 168 km mula sa Jerusalem (tuwid na guhit)."
    - "Walang ganap na taon ang Biblia; binibilang pabalik ang petsa mula sa mga talaang Asirio: lumaban si Achab sa Qarqar noong 853 BK at nagbayad ng tributo si Jehu kay Salmanasar III noong 841, ayon sa Monolito ng Kurkh at Itim na Obelisko. Sa pagsasama-sama ng mga paghahari sa Mga Hari mula roon, na magkaibang buwan ang simula ng taon ng Israel at Juda at kung minsan ay kasamang naghahari ang anak at ama, narating ni Thiele ang 931/930 BK para sa kamatayan ni Salomon; si Albright, na sa palagay niya'y kailangan pang itama ang mga bilang, ay nagbigay ng 922. Isa pang pagsusuri mula sa Egipto: “nang ikalimang taon ng haring Roboam, na si Sisac na hari sa Egipto ay umahon laban sa Jerusalem”, at itinala ito ni Shoshenq I sa Pintuang Bubastita sa Karnak, mga 925 BK. Hindi na muling nagkaisa ang dalawang kaharian; bumagsak ang Israel sa Asiria noong 722 BK, ang Juda sa Babilonia noong 586."
  da:
    - "Kongeriget blev delt omkring 931 f.Kr. ved Salomos død, da de nordlige stammer, samlet i Sikem, afviste hans søn Rehabeam og gjorde Jeroboam til deres konge; 930 f.Kr. er også udbredt, og nogle forskere sætter det til 922. Kortet bruger ca. 931 f.Kr., datoen i Thieles kronologi. Sikem, hvor det skete, ligger omkring 49 km nord for Jerusalem i luftlinje."
    - "Rehabeam drog til Sikem, »thi al Israel var kommen til Sikem for at gøre ham til Konge«, og folket bad ham lette det åg af tvangsarbejde, hans far havde lagt på dem. Han fulgte de unges råd: »min Fader tugtede eder med Svøber, men jeg, jeg vil tugte eder med Skorpioner«. Svaret var det gamle oprørsråb: »Hvad Del have vi da i David? vi have ingen Lod i Isajs Søn; Israel! drag til dine Telte«. Jeroboam, som var flygtet til Egypten fra Salomo, blev gjort til konge over hele Israel, og »der var ingen, som fulgte efter Davids Hus, undtagen Judas Stamme alene«; den russiske synodale tekst tilføjer her Benjamin. »Saa faldt Israel af fra Davids Hus indtil denne Dag.« Jeroboam befæstede Sikem og opstillede, for at folket ikke skulle behøve at drage op til Jerusalem, gyldne kalve i Betel og i Dan, omkring 16 og 168 km fra Jerusalem i luftlinje."
    - "Bibelen giver intet absolut årstal, så datoen beregnes baglæns ud fra assyriske kilder: Akab kæmpede ved Qarqar i 853 f.Kr., og Jehu betalte tribut til Salmanassar III i 841, som Kurkh-monolitten og den Sorte Obelisk beretter. Ved at lægge Kongebøgernes regeringsår sammen derfra, med Israel og Juda, der begyndte deres år i forskellige måneder, og sønner, der undertiden regerede ved siden af deres fædre, nåede Thiele frem til 931/930 f.Kr. for Salomos død; Albright, som mente, at tallene krævede flere rettelser, gav 922. En anden kontrol kommer fra Egypten: »det skete i Kong Roboams femte Aar, at Sisak, Kongen af Ægypten, drog op imod Jerusalem«, og Sjosjenk I optegnede dette felttog på Bubastis-porten i Karnak, omkring 925 f.Kr. De to kongeriger blev aldrig genforenet, og Israel faldt til Assyrien i 722 f.Kr., Juda til Babylon i 586."
  sr:
    - "Краљевство се поделило око 931. п. н. е., по Соломуновој смрти, кад су северна племена окупљена у Сихему одбила његовог сина Ровоама и поставила Јеровоама за свог краља; широко се држи и 930. п. н. е., а неки научници је стављају у 922. Карта користи око 931. п. н. е., датум Тилеове хронологије. Сихем, где се то збило, лежи око 49 км северно од Јерусалима правом линијом."
    - "Ровоам је отишао у Сихем, „јер се онде скупи сав Израиљ да га зацаре“, а народ је тражио да олакша јарам принудног рада који им је наметнуо његов отац. Послушао је савет младића: „отац вас је мој шибао бичевима, а ја ћу вас шибати бодљивим бичевима“. Одговор је био стари поклич побуне: „Какав део ми имамо с Давидом? Немамо наследство са сином Јесејевим. У шаторе своје, Израиљу!“ Јеровоам, који је од Соломуна побегао у Египат, постављен је за краља над целим Израиљем, и: „Не приста за домом Давидовим ни једно племе осим самог племена Јудиног“; руски синодални текст овде додаје Венијамина. „Тако отпаде Израиљ од дома Давидовог до данашњег дана.“ Јеровоам је утврдио Сихем и, да народ не би ишао у Јерусалим, поставио златна телад у Ветиљу и у Дану, око 16 и 168 км од Јерусалима правом линијом."
    - "Библија не даје апсолутну годину, па се датум рачуна уназад из асирских записа: Ахав се борио код Каркара 853. п. н. е., а Јуј је платио данак Салманасару III 841, како бележе Курхов монолит и Црни обелиск. Сабирајући владавине из Књига о царевима одатле, при чему Израиљ и Јуда почињу своје године у различитим месецима, а синови понекад владају поред очева, Тиле је дошао до 931/930. п. н. е. за Соломунову смрт; Олбрајт, који је мислио да су бројке захтевале више исправки, дао је 922. Друга провера долази из Египта: „А пете године царовања Ровоамовог дође Сисак, цар мисирски, на Јерусалим“, а Шошенк I забележио је тај поход на Бубастидској капији у Карнаку, око 925. п. н. е. Два краљевства никад се нису поново ујединила, а Израел је пао у руке Асирије 722. п. н. е., Јуда у руке Вавилона 586."
  hu:
    - "A királyság Kr. e. 931 körül, Salamon halálakor szakadt ketté, amikor a Sikemben egybegyűlt északi törzsek elutasították fiát, Roboámot, és Jeroboámot tették királyukká; a Kr. e. 930-at is széles körben vallják, egyes kutatók Kr. e. 922-re teszik. A térkép a Kr. e. 931 körülit használja, a Thiele-féle kronológia dátumát. Sikem, ahol ez történt, Jeruzsálemtől egyenes vonalban mintegy 49 km-re északra fekszik."
    - "Roboám Sikembe ment, „mert Síkembe gyűlt fel az egész Izráel, hogy királylyá tegyék őt”, és a nép azt kérte, hogy könnyítse atyja kényszermunka-igáját. Az ifjak tanácsát fogadta: „ha az én atyám ostorral fékezett titeket, én skorpiókkal ostorozlak benneteket.” A válasz a lázadás régi kiáltása volt: „Micsoda részünk van nékünk Dávidban? Nincsen nékünk örökségünk az Isai fiában: menj el a te hajlékidba, óh Izráel!” Jeroboámot, aki Salamon elől Egyiptomba menekült, az egész Izráel királyává tették, és „senki pedig nem követé Dávidnak házát, hanem csak egyedül a Júda nemzetsége”; az orosz szinodális szöveg itt Benjámint is hozzáteszi. „Így szakada el az Izráel népe Dávidnak házától mind e mai napig.” Jeroboám megerősítette Sikemet, és hogy a nép ne menjen fel Jeruzsálembe, aranyborjakat állított Bételben és Dánban, Jeruzsálemtől egyenes vonalban mintegy 16 és 168 km-re."
    - "A Biblia nem ad abszolút évet, ezért a dátumot asszír feljegyzések alapján számítják visszafelé: Aháb Kr. e. 853-ban harcolt Qarqarnál, Jéhu pedig Kr. e. 841-ben adót fizetett III. Salmanasszárnak, ahogy a Kurkh-monolit és a Fekete obeliszk feljegyzi. A Királyok uralkodási éveit innen összeadva, figyelembe véve, hogy Izráel és Júda különböző hónapokban kezdte éveit, és a fiak néha atyjuk mellett uralkodtak, Thiele Salamon halálára Kr. e. 931/930-ra jutott; Albright, aki szerint a számok több javítást kívántak, Kr. e. 922-t adott. Egyiptom második ellenőrzést ad: „Roboám király ötödik esztendejében, feljött Sisák, az Égyiptombeli király Jeruzsálem ellen”, I. Sosenk pedig a karnaki Bubasztisz-kapun örökítette meg e hadjáratot, Kr. e. 925 körül. A két királyság soha nem egyesült újra; Izráel Kr. e. 722-ben Asszíriának, Júda Kr. e. 586-ban Babilonnak esett áldozatul."
  fi:
    - "Kuningaskunta jakautui noin 931 eaa., Salomon kuollessa, kun Sikemiin kokoontuneet pohjoiset heimot hylkäsivät hänen poikansa Rehabeamin ja tekivät Jerobeamin kuninkaakseen; myös 930 eaa. on laajalti kannatettu, ja jotkut tutkijat sijoittavat sen vuoteen 922. Kartta käyttää noin vuotta 931 eaa., Thielen kronologian vuotta. Sikem, jossa se tapahtui, on noin 49 km Jerusalemista pohjoiseen linnuntietä."
    - "Rehabeam meni Sikemiin, ”sillä koko Israel oli tullut Sikemiin tekemään häntä kuninkaaksi”, ja kansa pyysi häntä keventämään pakkotyön ikeen, jonka hänen isänsä oli sille pannut. Hän noudatti nuorten neuvoa: ”jos minun isäni on kurittanut teitä raipoilla, niin minä kuritan teitä piikkiruoskilla”. Vastaus oli vanha kapinahuuto: ”Mitä osaa meillä on Daavidiin? Ei meillä ole perintöosaa Iisain poikaan. Majoillesi, Israel!” Jerobeam, joka oli paennut Salomoa Egyptiin, tehtiin koko Israelin kuninkaaksi, ja ”Daavidin sukua ei seurannut kukaan muu kuin Juudan sukukunta yksin”; venäläinen synodaalinen teksti lisää tähän Benjaminin. ”Näin Israel luopui Daavidin suvusta, aina tähän päivään asti.” Jerobeam linnoitti Sikemin ja pystytti, jottei kansan tarvitsisi mennä ylös Jerusalemiin, kultaiset vasikat Beteliin ja Daniin, noin 16 ja 168 km:n päähän Jerusalemista linnuntietä."
    - "Raamattu ei anna ehdotonta vuotta, joten ajoitus lasketaan taaksepäin assyrialaisista lähteistä: Ahab taisteli Qarqarissa vuonna 853 eaa. ja Jehu maksoi veroa Salmanassar III:lle vuonna 841, kuten Kurkhin monoliitti ja Musta obeliski kertovat. Laskemalla Kuninkaiden kirjojen hallituskaudet yhteen siitä alkaen, Israelin ja Juudan aloittaessa vuotensa eri kuukausina ja poikien hallitessa joskus isiensä rinnalla, Thiele päätyi Salomon kuolemalle vuoteen 931/930 eaa.; Albright, joka katsoi lukujen tarvitsevan enemmän korjausta, antoi 922. Toinen tarkistus tulee Egyptistä: ”kuningas Rehabeamin viidentenä hallitusvuotena hyökkäsi Suusak, Egyptin kuningas, Jerusalemin kimppuun”, ja Sheshonq I kirjasi tuon sotaretken Bubastis-portille Karnakissa, noin 925 eaa. Kuningaskunnat eivät koskaan yhdistyneet, ja Israel kaatui Assyrialle vuonna 722 eaa., Juuda Babylonille vuonna 586."
  vi:
    - "Vương quốc chia đôi khoảng năm 931 TCN, khi Sa-lô-môn qua đời, lúc các chi phái phía bắc họp tại Si-chem từ chối con ông là Rô-bô-am và lập Giê-rô-bô-am làm vua; năm 930 TCN cũng được nhiều người chủ trương, và một số học giả đặt vào 922. Bản đồ dùng khoảng năm 931 TCN, niên đại của Thiele. Si-chem, nơi việc ấy xảy ra, nằm cách Giê-ru-sa-lem khoảng 49 km về phía bắc theo đường thẳng."
    - "Rô-bô-am đến Si-chem “vì cả Y-sơ-ra-ên đã hiệp lại tại Si-chem đặng tôn người làm vua”, và dân xin ông giảm ách lao dịch cưỡng bức cha ông đã đặt lên họ. Ông nghe mưu các kẻ trai trẻ: “Cha ta có sửa phạt các ngươi bằng roi da, ta sẽ sửa phạt các ngươi bằng roi bọ cạp.” Câu đáp là tiếng kêu nổi dậy xưa: “Chúng ta có phần gì cùng Đa-vít? Chúng ta chẳng có cơ nghiệp chi với con trai Y-sai. Hỡi Y-sơ-ra-ên! hãy trở về trại mình đi.” Giê-rô-bô-am, người đã trốn sang Ê-díp-tô khỏi Sa-lô-môn, được lập làm vua trên cả Y-sơ-ra-ên, và “Chỉ có chi phái Giu-đa cứ theo nhà Đa-vít mà thôi”; bản Synodal của Nga thêm Bên-gia-min ở đây. “Y-sơ-ra-ên phản nghịch nhà Đa-vít cho đến ngày nay.” Giê-rô-bô-am củng cố Si-chem và, để dân khỏi phải lên Giê-ru-sa-lem, đặt các bò con vàng tại Bê-tên và Đan, cách Giê-ru-sa-lem khoảng 16 và 168 km theo đường thẳng."
    - "Kinh Thánh không cho năm tuyệt đối, nên niên đại được tính ngược từ hồ sơ Assyria: A-háp giao chiến tại Qarqar năm 853 TCN và Giê-hu nộp cống cho Sanh-ma-na-sa III năm 841, như Bia Kurkh và Obelisk Đen ghi. Cộng các triều trong sách Các Vua từ đó, với Y-sơ-ra-ên và Giu-đa bắt đầu năm ở những tháng khác nhau và các con đôi khi trị vì cùng cha, Thiele đi đến 931/930 TCN cho cái chết của Sa-lô-môn; Albright, người nghĩ các con số cần chỉnh nhiều hơn, cho 922. Một đối chiếu thứ hai đến từ Ê-díp-tô: “Năm thứ năm đời Rô-bô-am trị vì, Si-sắc, vua Ê-díp-tô, đi lên đánh Giê-ru-sa-lem”, và Shoshenq I ghi cuộc chinh phạt ấy trên Cổng Bubastite tại Karnak, khoảng năm 925 TCN. Hai vương quốc không bao giờ hợp lại, Y-sơ-ra-ên sụp đổ trước Assyria năm 722 TCN, Giu-đa trước Ba-by-lôn năm 586."
  ro:
    - "Regatul s-a împărțit circa 931 î.Hr., la moartea lui Solomon, când semințiile de nord, adunate la Sihem, l-au refuzat pe fiul lui, Roboam, și l-au făcut rege pe Ieroboam; se susține pe larg și 930 î.Hr., iar unii cercetători îl pun în 922. Harta folosește circa 931 î.Hr., data cronologiei lui Thiele. Sihemul, unde s-a petrecut, se află la circa 49 km nord de Ierusalim în linie dreaptă."
    - "Roboam a mers la Sihem, căci „în Sichima s’a adunat tot Israilul, ca să-l facă pre el împărat”, iar poporul i-a cerut să ușureze jugul corvezilor puse de tatăl său. El a urmat sfatul tinerilor: „tatăl meu v’a bătut pre voi cu bice, iar eu voiu bate pre voi cu scorpii.” Răspunsul a fost vechea strigare de răscoală: „ce parte avem noi cu David? Nu avem moștenire cu fiul lui Iesse. Aleargă Israile la lăcașurile tale”. Ieroboam, care fugise în Egipt de Solomon, a fost făcut rege peste tot Israelul; nimeni nu a urmat casa lui David afară de seminția lui Iuda (textul sinodal rus adaugă aici Beniamin). „S’a lepădat Israil de casa lui David până în ziua aceasta.” Ieroboam a întărit Sihemul și, ca poporul să nu se mai suie la Ierusalim, a pus viței de aur la Betel și la Dan, la circa 16 și 168 km de Ierusalim în linie dreaptă."
    - "Biblia nu dă niciun an absolut, așa că data se socotește înapoi din înscrisurile asiriene: Ahab a luptat la Qarqar în 853 î.Hr., iar Iehu a plătit tribut lui Salmanasar al III-lea în 841, după cum consemnează Monolitul de la Kurkh și Obeliscul Negru. Adunând domniile din Cartea Regilor de acolo, cu Israel și Iuda începându-și anii în luni diferite și cu fii domnind uneori alături de tați, Thiele a ajuns la 931/930 î.Hr. pentru moartea lui Solomon; Albright, care socotea că cifrele cer mai multă corectură, a dat 922. O a doua verificare vine din Egipt: în anul al cincilea al lui Roboam, Șișac, regele Egiptului, a urcat împotriva Ierusalimului, iar Șoșenc I a consemnat campania pe Poarta bubastită de la Karnak, circa 925 î.Hr. Cele două regate nu s-au mai unit niciodată; Israel a căzut în fața Asiriei în 722 î.Hr., Iuda în fața Babilonului în 586."
  bg:
    - "Царството се разделило около 931 г. пр.н.е., при смъртта на Соломон, когато северните племена, събрани в Сихем, отхвърлили сина му Ровоам и направили Йеровоам свой цар; широко приета е и 930 г. пр.н.е., а някои учени я поставят през 922 г. Картата използва около 931 г. пр.н.е., датата от хронологията на Тийле. Сихем, където станало това, е на около 49 км северно от Йерусалим по права линия."
    - "Ровоам отишъл в Сихем, „защото в Сихем идеше всичкий Израил за да го направи цар“, и народът го помолил да облекчи ярема на принудителния труд, наложен от баща му. Той послушал съвета на младите: „отец ми ви наказа с бичове, но аз ще ви накажа с скорпии.“ Отговорът бил старият бунтовнически вик: „Какъв дял имаме ние в Давида? никакво наследие нямаме в Иесеевия син! В шатрите си, Израилю!“ Йеровоам, който бил избягал в Египет от Соломон, бил направен цар над целия Израил и „освен Юдиното племе друг не последва Давидовия дом“; руският Синодален текст добавя тук Вениамин. „Така отстъпи Израил от Давидовия дом дори до този ден.“ Йеровоам укрепил Сихем и, за да не ходи народът в Йерусалим, поставил златни телци във Ветил и в Дан, на около 16 и 168 км от Йерусалим по права линия."
    - "Библията не дава абсолютна година, затова датата се изчислява назад от асирийските записи: Ахав се сражавал при Каркар през 853 г. пр.н.е., а Йеху платил данък на Салманасар III през 841 г., както съобщават Курхският монолит и Черният обелиск. Като събрал оттам царуванията в Царе — при това Израил и Юда започвали годините си в различни месеци, а синовете понякога царували заедно с бащите си, — Тийле стигнал до 931/930 г. пр.н.е. за смъртта на Соломон; Олбрайт, който смятал, че числата изискват повече поправки, дава 922 г. Втора проверка идва от Египет: „в петото лето на Ровоамовото царуване възлезе Сисак Египетский цар против Ерусалим“, а Шешонк I записал този поход на Бубастидския портал в Карнак, около 925 г. пр.н.е. Двете царства никога не се обединили отново; Израил паднал пред Асирия през 722 г. пр.н.е., а Юда — пред Вавилон през 586 г."
