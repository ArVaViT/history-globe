id: where-was-gibeon
question:
  en: "Where was Gibeon?"
  ru: "Где находился Гаваон?"
  uk: "Де був Гаваон?"
  es: "¿Dónde estaba Gabaón?"
  pt: "Onde ficava Gibeão?"
  de: "Wo lag Gibeon?"
  fr: "Où se trouvait Gabaon ?"
  pl: "Gdzie leżał Gibeon?"
  it: "Dov’era Gabaon?"
  cs: "Kde ležel Gibeon?"
  nl: "Waar lag Gibeon?"
answer:
  en:
    - "Gibeon is el-Jib, a village on a hill about 9 km north-west of Jerusalem in a straight line, in the land of Benjamin, today in the West Bank; the map point stands on it. Unlike many biblical towns, its site is not in doubt: the name survived in the village, and James B. Pritchard, who excavated there from 1956 to 1962, found jar handles inscribed with the name Gibeon. It lay on the road climbing from the coastal plain through Beth-horon, about 8 km to the west, to the hills around Jerusalem."
    - "When “the inhabitants of Gibeon heard what Joshua had done unto Jericho and to Ai”, they came to him in worn clothes as if from a far country, and “Joshua made peace with them”; when the trick was found out they were made hewers of wood and drawers of water. Five Amorite kings then besieged the town, and Joshua's victory there gave rise to the words “Sun, stand thou still upon Gibeon”, which have a page of their own. In David's time the men of Joab and Abner “met together by the pool of Gibeon” and sat down on either side of it, and the fight began there."
    - "Gibeon had “the great high place”: “a thousand burnt offerings did Solomon offer upon that altar. In Gibeon the LORD appeared to Solomon in a dream by night”, and there he asked for wisdom. Pritchard cleared a great round shaft cut into the rock, with a stair winding down to the water table, which many link with the pool of 2 Samuel, though its date is debated, and found many jar handles from a wine industry of the late Iron Age. In the fourth century Eusebius still knew a village of the same name, which he put four miles west of Bethel."
  ru:
    - "Гаваон — это Эль-Джиб, селение на холме примерно в 9 км к северо-западу от Иерусалима по прямой, в земле Вениамина, ныне на Западном берегу; точка карты стоит на нём. В отличие от многих библейских городов, его место не вызывает сомнений: имя сохранилось в названии селения, а Джеймс Б. Притчард, копавший здесь с 1956 по 1962 год, нашёл ручки кувшинов с надписью «Гаваон». Город стоял на дороге, поднимавшейся с приморской равнины через Беф-Орон, примерно в 8 км к западу, в горы вокруг Иерусалима."
    - "Когда «жители Гаваона, услышав, что Иисус сделал с Иерихоном и Гаем», пришли к нему в ветхой одежде, будто из дальней земли, «заключил Иисус с ними мир»; когда обман открылся, их сделали дровосеками и водоносами. Тогда пять аморрейских царей осадили город, и победа Иисуса у Гаваона дала слова «стой, солнце, над Гаваоном», о которых есть отдельная страница. Во дни Давида люди Иоава и Авенира «встретились у Гаваонского пруда, и засели те на одной стороне пруда, а эти на другой», и там началась битва."
    - "В Гаваоне был «главный жертвенник»: «Тысячу всесожжений вознес Соломон на том жертвеннике. В Гаваоне явился Господь Соломону во сне ночью», и там он просил мудрости. Притчард расчистил большой круглый колодец, высеченный в скале, с лестницей, спускающейся к грунтовым водам, — многие связывают его с прудом из Второй книги Царств, хотя датировка спорна, — и нашёл множество ручек кувшинов от винного промысла конца железного века. В IV веке Евсевий ещё знал селение с тем же названием и помещал его в четырёх милях к западу от Вефиля."
  uk:
    - "Гаваон — це ель-Джиб, село на пагорбі приблизно за 9 км на північний захід від Єрусалима по прямій, у землі Веніямина, нині на Західному березі Йордану; точка на мапі стоїть на ньому. На відміну від багатьох біблійних міст, його місце не викликає сумнівів: назва збереглася в селі, а Джеймс Б. Прітчард, який розкопував тут у 1956–1962 рр., знайшов ручки глеків із написом «Гаваон». Він лежав на дорозі, що піднімається від прибережної рівнини через Бет-Хорон, приблизно за 8 км на захід, до пагорбів навколо Єрусалима."
    - "Коли «осадники Габаонські, як почули, що вчинив Йозуа з Ерихоном та з Гаєм», вони прийшли до нього в зношеному вбранні, ніби з далекого краю, і «запевнив їм Йозуа беспеку і вчинив умову з ними»; коли обман викрили, їх зробили дроворубами та водоносами. П'ять аморейських царів тоді взяли місто в облогу, а перемога Ісуса Навина там породила слова «Сонце, стій над Габаоном», яким присвячено окрему сторінку. За Давида люди Йоава й Авеніра «зустрілись вони коло ставу Габаонського» і «засїли одні по сїм боцї, а другі по тім боцї ставу», і саме там почався бій."
    - "У Гаваоні була «найповажнїща жертівна висота»: «Тисячу всепалень принїс Соломон на тому самому жертівнику ... У Габаонї ж обявивсь Господь Соломонові вночі вві снї», і саме там він попросив мудрості. Прітчард розчистив велику круглу шахту, вирізану в скелі, зі сходами, що спіраллю спускаються до рівня ґрунтових вод, яку багато хто пов'язує зі ставом із Другої книги Самуїла, хоч її датування обговорюють, і знайшов багато ручок глеків від виноробства пізнього залізного віку. У IV ст. Євсевій ще знав село з такою самою назвою, яке він розміщував за чотири милі на захід від Бет-Ела."
  es:
    - "Gabaón es el-Jib, una aldea sobre una colina a unos 9 km al noroeste de Jerusalén en línea recta, en la tierra de Benjamín, hoy en Cisjordania; el punto del mapa está sobre ella. A diferencia de muchas ciudades bíblicas, su emplazamiento no es dudoso: el nombre sobrevivió en la aldea, y James B. Pritchard, que excavó allí de 1956 a 1962, halló asas de jarra con el nombre Gabaón inscrito. Se hallaba en el camino que sube desde la llanura costera por Bet-horón, a unos 8 km al oeste, hasta las colinas de Jerusalén."
    - "Cuando «los moradores de Gabaón… oyeron lo que Josué había hecho á Jericó y á Hai», acudieron a él con ropas gastadas, como de un país lejano, y «Josué hizo paz con ellos»; al descubrirse el engaño, los hicieron leñadores y aguadores. Cinco reyes amorreos asediaron entonces la ciudad, y la victoria de Josué allí dio origen a las palabras «Sol, detente en Gabaón», que tienen una página propia. En tiempos de David, los hombres de Joab y de Abner se encontraron «junto al estanque de Gabaón» y se sentaron a uno y otro lado, y allí empezó el combate."
    - "Gabaón tenía «el alto principal»: «mil holocaustos sacrificaba Salomón sobre aquel altar. Y aparecióse Jehová á Salomón en Gabaón una noche en sueños», y allí pidió sabiduría. Pritchard despejó un gran pozo circular excavado en la roca, con una escalera que desciende en espiral hasta el nivel freático, que muchos relacionan con el estanque de 2 Samuel, aunque su fecha se discute, y halló muchas asas de jarra de una industria vinícola de finales de la Edad del Hierro. En el siglo IV, Eusebio aún conocía una aldea del mismo nombre, que situaba a cuatro millas al oeste de Betel."
  pt:
    - "Gibeão é el-Jib, uma aldeia numa colina a cerca de 9 km a noroeste de Jerusalém em linha reta, na terra de Benjamim, hoje na Cisjordânia; o ponto do mapa fica sobre ela. Ao contrário de muitas cidades bíblicas, o seu sítio não está em dúvida: o nome sobreviveu na aldeia, e James B. Pritchard, que escavou ali de 1956 a 1962, encontrou alças de jarros com o nome Gibeão inscrito. Ficava na estrada que sobe da planície costeira, por Bete-Horom, a cerca de 8 km a oeste, até as colinas em torno de Jerusalém."
    - "Quando “os habitantes de Gibeom ouviram o que Josué tinha feito a Jericó e a Ai”, foram a ele com roupas gastas, como se viessem de uma terra distante, e “Josué fez paz com eles”; descoberto o ardil, foram feitos lenhadores e tiradores de água. Cinco reis amorreus cercaram então a cidade, e a vitória de Josué ali deu origem às palavras “Sol, pare sobre Gibeom!”, que têm uma página própria. No tempo de Davi, os homens de Joabe e de Abner “se encontraram com eles junto ao açude de Gibeom” e se sentaram de um lado e do outro, e ali começou o combate."
    - "Gibeão tinha “o principal lugar alto”: “Salomão ofereceu mil holocaustos naquele altar. Em Gibeão, o SENHOR apareceu a Salomão em um sonho durante a noite”, e ali ele pediu sabedoria. Pritchard desobstruiu um grande poço redondo escavado na rocha, com uma escada que desce em espiral até o lençol de água, que muitos ligam ao açude de 2 Samuel, embora a sua data seja debatida, e encontrou muitas alças de jarros de uma indústria de vinho do final da Idade do Ferro. No século IV, Eusébio ainda conhecia uma aldeia com o mesmo nome, que situava a quatro milhas a oeste de Betel."
  de:
    - "Gibeon ist el-Dschib, ein Dorf auf einem Hügel, in der Luftlinie etwa 9 km nordwestlich von Jerusalem im Land Benjamin, heute im Westjordanland; der Kartenpunkt steht darauf. Anders als bei vielen biblischen Städten ist die Lage nicht zweifelhaft: Der Name hat sich im Dorf erhalten, und James B. Pritchard, der dort von 1956 bis 1962 grub, fand Krughenkel mit der Aufschrift Gibeon. Es lag an der Straße, die von der Küstenebene über Bet-Horon, etwa 8 km westlich, in die Berge um Jerusalem hinaufführt."
    - "Als „die Bürger zu Gibeon, da sie hörten, was Josua mit Jericho und Ai gemacht hatte“, kamen sie in abgetragenen Kleidern zu ihm, als kämen sie aus einem fernen Land, und „Josua machte Frieden mit ihnen“; als die List aufkam, wurden sie zu Holzhauern und Wasserträgern gemacht. Fünf Amoriterkönige belagerten dann die Stadt, und Josuas Sieg dort gab Anlass zu den Worten „Sonne, stehe still zu Gibeon“, die eine eigene Seite haben. Zu Davids Zeit, so der Bericht, „stießen aufeinander am Teich zu Gibeon“ die Männer Joabs und Abners; sie ließen sich auf beiden Seiten nieder, und dort begann der Kampf."
    - "Gibeon hatte „die vornehmste Höhe“: „Salomo opferte tausend Brandopfer auf demselben Altar. Und der HERR erschien Salomo zu Gibeon im Traum des Nachts“, und dort bat er um Weisheit. Pritchard legte einen großen runden, in den Fels gehauenen Schacht frei, in dem eine Treppe zum Grundwasser hinabführt, den viele mit dem Teich aus dem Zweiten Buch Samuel verbinden, auch wenn seine Datierung umstritten ist, und fand zahlreiche Krughenkel aus einer Weinproduktion der späten Eisenzeit. Im 4. Jahrhundert kannte Eusebius noch ein Dorf desselben Namens, das er vier Meilen westlich von Bethel ansetzte."
  fr:
    - "Gabaon est el-Jib, village bâti sur une colline à environ 9 km au nord-ouest de Jérusalem à vol d’oiseau, dans le pays de Benjamin, aujourd’hui en Cisjordanie ; le point de la carte s’y trouve. À la différence de bien des villes bibliques, son site ne fait aucun doute : le nom a survécu dans le village, et James B. Pritchard, qui y fouilla de 1956 à 1962, a trouvé des anses de jarres portant le nom de Gabaon. Elle se trouvait sur la route qui monte de la plaine côtière, par Beth-Horon, à environ 8 km à l’ouest, vers les collines de Jérusalem."
    - "Quand « les habitants de Gabaon apprirent de quelle manière Josué avait traité Jéricho et Aï », ils vinrent le trouver en vêtements usés, comme d’un pays éloigné, et « Josué fit la paix avec eux » ; la ruse découverte, ils furent employés « à couper le bois et à puiser l’eau ». Cinq rois des Amoréens assiégèrent alors la ville, et la victoire de Josué en ce lieu donna naissance aux paroles « Soleil, arrête-toi sur Gabaon », qui ont leur propre page. Du temps de David, les gens de Joab et d’Abner « se rencontrèrent près de l’étang de Gabaon » et s’arrêtèrent de part et d’autre, et le combat commença là."
    - "Gabaon possédait « le principal des hauts lieux » : « Salomon offrit mille holocaustes sur l’autel. À Gabaon, l’Éternel apparut en songe à Salomon pendant la nuit », et c’est là qu’il demanda la sagesse. Pritchard a dégagé un grand puits circulaire taillé dans le roc, avec un escalier qui descend en spirale jusqu’à la nappe d’eau, que beaucoup rattachent à l’étang du second livre de Samuel, bien que sa date soit débattue, et il a trouvé de nombreuses anses de jarres, témoins d’une production de vin à la fin de l’âge du Fer. Au IVe siècle, Eusèbe connaissait encore un village du même nom, qu’il situait à quatre milles à l’ouest de Béthel."
  pl:
    - "Gibeon to el-Jib, wieś na wzgórzu około 9 km na północny zachód od Jerozolimy w linii prostej, w ziemi Beniamina, dziś na Zachodnim Brzegu; stoi na nim punkt na mapie. W odróżnieniu od wielu biblijnych miast jego położenie nie budzi wątpliwości: nazwa przetrwała we wsi, a James B. Pritchard, który prowadził tam wykopaliska w latach 1956–1962, znalazł uchwyty dzbanów z wyrytą nazwą Gibeon. Leżało przy drodze wspinającej się z nadmorskiej równiny przez Bet-Choron, około 8 km na zachód, ku wzgórzom wokół Jerozolimy."
    - "Gdy mieszkańcy Gibeonu, „usłyszawszy, co uczynił Jozue Jerychowi i Hajowi”, przyszli do niego w znoszonych szatach, jakby z dalekiej ziemi: „z nimi uczynił Jozue pokój”; gdy podstęp wykryto, uczyniono ich rąbaczami drewna i czerpaczami wody. Pięciu królów amorejskich oblegało wtedy miasto, a zwycięstwo Jozuego pod nim zrodziło słowa „Słońce w Gabaon zastanów się”, którym poświęcona jest osobna strona. Za czasów Dawida ludzie Joaba i Abnera „spotkali się z sobą prawie u stawu Gabaońskiego” i usiedli po obu jego stronach, i tam zaczęła się walka."
    - "W Gibeonie była „góra największa”: „tysiąc ofiar całopalonych ofiarował Salomon na onym ołtarzu. I ukazał się Pan w Gabaon Salomonowi przez sen w nocy”, i tam prosił o mądrość. Pritchard odsłonił wielki okrągły szyb wykuty w skale, ze schodami wijącymi się w dół do poziomu wód gruntowych, który wielu łączy ze stawem z Drugiej Księgi Samuela, choć jego datowanie jest sporne, i znalazł wiele uchwytów dzbanów z przemysłu winiarskiego późnej epoki żelaza. W IV wieku Euzebiusz znał jeszcze wieś o tej samej nazwie, którą umieszczał cztery mile na zachód od Betel."
  it:
    - "Gabaon è el-Jib, un villaggio su una collina a circa 9 km a nord-ovest di Gerusalemme in linea d’aria, nel territorio di Beniamino, oggi in Cisgiordania; il punto della mappa si trova su di esso. A differenza di molte città bibliche, la sua ubicazione non è in dubbio: il nome sopravvisse nel villaggio, e James B. Pritchard, che vi scavò dal 1956 al 1962, trovò manici di giara iscritti con il nome Gabaon. Sorgeva sulla strada che sale dalla pianura costiera attraverso Bet-Oron, a circa 8 km a ovest, fino alle colline attorno a Gerusalemme."
    - "Quando gli abitanti di Gabaon «ebbero udito ciò che Giosuè avea fatto a Gerico e ad Ai», andarono da lui con vesti logore come se venissero da un paese lontano, e «Giosuè fece pace con loro»; quando l’inganno fu scoperto furono ridotti a spaccalegna e acquaioli. Cinque re amorei assediarono allora la città, e la vittoria di Giosuè in quel luogo diede origine alle parole «Sole, fermati su Gabaon», che hanno una pagina a sé. Ai tempi di Davide gli uomini di Ioab e di Abner «s’incontrarono presso lo stagno di Gabaon» e si fermarono ai due lati di esso, e lì cominciò il combattimento."
    - "Gabaon aveva «il principale fra gli alti luoghi»: «su quell’altare Salomone offerse mille olocausti. A Gabaon, l’Eterno apparve di notte, in sogno, a Salomone», e lì egli chiese la sapienza. Pritchard riportò alla luce un grande pozzo circolare scavato nella roccia, con una scala che scende a spirale fino alla falda acquifera, che molti collegano con lo stagno di 2 Samuele, benché la sua datazione sia discussa, e trovò molti manici di giara di un’industria vinicola della tarda età del Ferro. Nel IV secolo Eusebio conosceva ancora un villaggio con lo stesso nome, che collocava a quattro miglia a ovest di Betel."
  cs:
    - "Gibeon je el-Džíb, vesnice na pahorku vzdušnou čarou asi 9 km severozápadně od Jeruzaléma, v zemi Benjamínově, dnes na Západním břehu; stojí na něm bod na mapě. Na rozdíl od mnoha biblických měst není jeho poloha pochybná: jméno se zachovalo ve vsi a James B. Pritchard, který tu v letech 1956 až 1962 vykopával, nalezl ucha džbánů s nápisem Gibeon. Ležel na cestě, která stoupala od pobřežní roviny přes Bét-choron, asi 8 km na západ, do hor kolem Jeruzaléma."
    - "Když „obyvatelé Gabaon uslyšavše, co učinil Jozue Jerichu a Hai“, přišli k němu v obnošených šatech, jako by byli z daleké země, a „učinil s nimi Jozue pokoj“; když byla lest odhalena, stali se drvaři a nosiči vody. Pět amorejských králů pak město oblehlo a Jozuovo vítězství tam dalo vzniknout slovům „Slunce v Gabaon zastav se“, která mají vlastní stránku. Za Davida se u rybníka setkali Joábovi a Abnerovi muži („potkali se s nimi právě u rybníka Gabaon“), posadili se na jeho protilehlých stranách a tam začal boj."
    - "Gibeon měl největší výsost: „Tisíc obětí zápalných obětoval Šalomoun na tom oltáři. Ukázal se pak Hospodin v Gabaon Šalomounovi ve snách noci té“, a tam požádal o moudrost. Pritchard odkryl velkou kruhovou šachtu vytesanou do skály s točitým schodištěm k podzemní vodě, kterou mnozí spojují s rybníkem z 2. knihy Samuelovy, ačkoli její datace je sporná, a našel mnoho uch džbánů z vinařské výroby pozdní doby železné. Ve 4. století znal Eusebios ještě vesnici téhož jména, kterou umístil čtyři míle západně od Bét-elu."
  nl:
    - "Gibeon is el-Jib, een dorp op een heuvel hemelsbreed ongeveer 9 km ten noordwesten van Jeruzalem, in het land van Benjamin, nu in de Westelijke Jordaanoever; het punt op de kaart staat erop. Anders dan bij veel bijbelse steden staat de ligging niet ter discussie: de naam bleef in het dorp bewaard, en James B. Pritchard, die er van 1956 tot 1962 opgroef, vond kruikhandvatten met de naam Gibeon erop. Het lag aan de weg die vanuit de kustvlakte via Beth-Horon, ongeveer 8 km naar het westen, omhoog liep naar de heuvels rond Jeruzalem."
    - "Toen “de inwoners te Gibeon hoorden, wat Jozua met Jericho en met Ai gedaan had”, kwamen zij in versleten kleren naar hem toe alsof zij uit een ver land kwamen, en “Jozua maakte vrede met hen”; toen de list ontdekt werd, werden zij houthakkers en waterputters. Vijf Amorietische koningen belegerden daarna de stad, en Jozua's overwinning daar gaf aanleiding tot de woorden “Zon, sta stil te Gibeon”, die een eigen pagina hebben. In de tijd van David trokken de mannen van Joab en Abner uit, en “zij ontmoetten elkander bij den vijver van Gibeon”; zij gingen aan weerszijden ervan zitten, en daar begon het gevecht."
    - "Gibeon had de grote offerhoogte: de koning ging er offeren, “omdat die hoogte groot was; duizend brandofferen offerde Salomo op dat altaar. Te Gibeon verscheen de HEERE aan Salomo in een droom des nachts”, en daar vroeg hij om wijsheid. Pritchard legde een grote ronde schacht bloot, in de rots uitgehouwen, met een trap die in een bocht afdaalt naar de grondwaterspiegel, die velen verbinden met de vijver uit 2 Samuël, hoewel de datering ervan wordt betwist, en hij vond veel kruikhandvatten van een wijnindustrie uit de late ijzertijd. In de vierde eeuw kende Eusebius nog een dorp met dezelfde naam, dat hij vier mijl ten westen van Bethel plaatste."
