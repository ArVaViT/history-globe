id: where-did-the-temple-stand
question:
  en: "Where did the Temple stand, and what is the Dome of the Rock?"
  ru: "Где стоял Храм и что такое Купол Скалы?"
  uk: "Де стояв Храм і що таке Купол Скелі?"
  es: "¿Dónde se alzaba el Templo y qué es la Cúpula de la Roca?"
  pt: "Onde ficava o Templo, e o que é o Domo da Rocha?"
  de: "Wo stand der Tempel, und was ist der Felsendom?"
  fr: "Où se dressait le Temple, et qu’est-ce que le Dôme du Rocher ?"
answer:
  en:
    - "On the Temple Mount, the Haram al-Sharif, in the Old City of Jerusalem: the hill north of the City of David that Chronicles calls Mount Moriah, where David bought the threshing floor of Araunah the Jebusite. Solomon's Temple stood there from about 966 BC until the Babylonians burned it in 587 or 586; the Second Temple from 516 BC; Herod the Great rebuilt it from about 20 BC on a platform of some 14 ha whose retaining walls still stand, the Western Wall among them, until the Romans destroyed it in AD 70. The Dome of the Rock, built about 691/692 under the caliph Abd al-Malik, is a shrine, not a mosque, built over the bare rock at the summit; most scholars hold that the Temple's innermost sanctuary stood on or beside that rock."
    - "Chronicles says that “Solomon began to build the house of the LORD at Jerusalem in mount Moriah, where the Lord appeared unto David his father, in the place that David had prepared in the threshingfloor of Ornan the Jebusite”, and so ties the Temple to the land of Moriah where Abraham was sent to offer Isaac. Kings dates the start to “the fourth year of Solomon's reign over Israel, in the month Zif, which is the second month”. In the Gospels the Jews say of Herod's work, “Forty and six years was this temple in building”, and Jesus answers his disciples' admiration: “There shall not be left here one stone upon another, that shall not be thrown down.”"
    - "No excavation is possible on the platform, so the Temple's exact place is argued from the rock, the Mishnah's measurements and the cisterns. Leen Ritmeyer and most others put the Holy of Holies over the rock under the Dome, with the altar to its east; Asher Kaufman argued for a spot about 100 m to the north, under the small Dome of the Spirits; a few look south, near the fountain of al-Kas. Of Solomon's building nothing has been identified; of Herod's, the walls, the gates, a fallen trumpeting-place inscription and the Greek warning stone that barred gentiles from the inner courts. The Byzantines left the Mount in ruins; the Muslim builders chose the rock, and Abd al-Malik's mosaic inscription inside the Dome gives the year 72 of the Hijra, 691/692."
  ru:
    - "На Храмовой горе, Харам аш-Шариф, в Старом городе Иерусалима — на холме к северу от Города Давидова, который Паралипоменон называет горой Мориа, где Давид купил гумно Орны Иевусеянина. Храм Соломона стоял там примерно с 966 г. до н. э., пока вавилоняне не сожгли его в 587 или 586 году; Второй Храм — с 516 г. до н. э.; Ирод Великий перестроил его примерно с 20 г. до н. э. на платформе около 14 га, чьи подпорные стены стоят до сих пор, среди них и Западная стена, — пока римляне не разрушили его в 70 г. н. э. Купол Скалы, построенный около 691/692 года при халифе Абд аль-Малике, — святилище, а не мечеть, построенное над голой скалой на вершине; большинство учёных считает, что внутреннее святилище Храма стояло на этой скале или рядом с ней."
    - "Паралипоменон говорит: «И начал Соломон строить дом Господень в Иерусалиме на горе Мориа, которая указана была Давиду, отцу его, на месте, которое приготовил Давид, на гумне Орны Иевусеянина», — и так связывает Храм с землёй Мориа, куда Авраам был послан принести Исаака. Книга Царств датирует начало работ: «в четвертый год царствования Соломонова над Израилем, в месяц Зиф, который есть второй месяц». В Евангелиях иудеи говорят о постройке Ирода: «сей храм строился сорок шесть лет», а Иисус отвечает на восхищение учеников: «не останется здесь камня на камне; все будет разрушено»."
    - "Раскопки на платформе невозможны, и точное место Храма выводят из скалы, мер Мишны и цистерн. Леен Ритмейер и большинство других помещают Святое Святых над скалой под Куполом, а жертвенник — к востоку от неё; Ашер Кауфман доказывал, что место лежит примерно в 100 м к северу, под маленьким Куполом Духов; немногие смотрят на юг, к фонтану аль-Кас. От постройки Соломона ничего не опознано; от Иродовой — стены, ворота, упавший камень с надписью о месте трубления и греческая плита, запрещавшая язычникам вход во внутренние дворы. Византийцы оставили гору в развалинах; мусульманские строители выбрали скалу, и мозаичная надпись Абд аль-Малика внутри Купола называет 72 год хиджры — 691/692."
  uk:
    - "На Храмовій горі, Харам еш-Шаріф, у Старому місті Єрусалиму: пагорбі на північ від Міста Давида, який Хроніки називають горою Морія, де Давид купив тік Арауни Євусея. Храм Соломона стояв там близько 966 р. до н. е., доки вавилоняни не спалили його 587 або 586 р.; Другий Храм — від 516 р. до н. е.; Ірод Великий перебудував його від близько 20 р. до н. е. на платформі приблизно в 14 га, підпірні стіни якої досі стоять, серед них Західна стіна, доки римляни не зруйнували його 70 р. н. е. Купол Скелі, збудований близько 691/692 р. за халіфа Абд аль-Маліка, — це святиня, а не мечеть, зведена над голою скелею на вершині; більшість учених вважає, що найглибша святиня Храму стояла на цій скелі або поряд із нею."
    - "Хроніки кажуть: «І почав Соломон будувати дом Господнїй в Ерусалимі на горі Моріа, що була вказана Давидові, його батькові, на місцї, що зготував Давид на току Орни Евузія», і так пов'язують Храм із землею Морія, куди Авраама було послано принести Ісаака. Книга Царів датує початок «у четвертому роцї, місяця Зифа, — се є місяць другий — царювання Соломонового над Ізраїлем». В Євангеліях євреї кажуть про працю Ірода: «Сорок і шість років будовано церкву сю», а Ісус відповідає на захват учнів: «Не зостанеть ся тут камінь на каменї, щоб не зруйновано»."
    - "На платформі жодні розкопки неможливі, тож точне місце Храму виводять зі скелі, мір Мішни й цистерн. Лін Рітмеєр і більшість інших ставлять Святе святих над скелею під Куполом, з жертовником на схід від неї; Ашер Кауфман обстоював місце приблизно за 100 м на північ, під малим Куполом Духів; деякі дивляться на південь, біля фонтану аль-Кас. Із Соломонової споруди нічого не ідентифіковано; з Іродової — стіни, брами, напис про місце сурмління, що впав, і грецький камінь-застереження, що забороняв язичникам вхід до внутрішніх дворів. Візантійці залишили гору в руїнах; мусульманські будівничі обрали скелю, а мозаїчний напис Абд аль-Маліка всередині Купола дає 72 рік гіджри, 691/692 р."
  es:
    - "En el monte del Templo, el Haram al-Sharif, en la Ciudad Vieja de Jerusalén: la colina al norte de la Ciudad de David que Crónicas llama monte Moria, donde David compró la era de Arauna el jebuseo. El Templo de Salomón se alzó allí desde alrededor del 966 a. C. hasta que los babilonios lo incendiaron en el 587 o 586; el Segundo Templo desde el 516 a. C.; Herodes el Grande lo reconstruyó desde alrededor del 20 a. C. sobre una plataforma de unas 14 ha cuyos muros de contención siguen en pie, entre ellos el Muro Occidental, hasta que los romanos lo destruyeron en el 70 d. C. La Cúpula de la Roca, construida hacia el 691/692 bajo el califa Abd al-Malik, es un santuario, no una mezquita, edificado sobre la roca desnuda de la cima; la mayoría de los estudiosos sostiene que el santuario más interior del Templo se alzaba sobre esa roca o junto a ella."
    - "Crónicas dice que «Y comenzó Salomón á edificar la casa en Jerusalem, en el monte Moria que había sido mostrado á David su padre, en el lugar que David había preparado en la era de Ornán Jebuseo», y así vincula el Templo con la tierra de Moriah a la que Abraham fue enviado para ofrecer a Isaac. Reyes fecha el comienzo «en el cuarto año del principio del reino de Salomón sobre Israel, en el mes de Ziph, que es el mes segundo». En los Evangelios los judíos dicen de la obra de Herodes: «En cuarenta y seis años fué este templo edificado», y Jesús responde a la admiración de sus discípulos: «no será dejada aquí piedra sobre piedra, que no sea destruída»."
    - "No es posible excavar en la plataforma, de modo que el lugar exacto del Templo se discute a partir de la roca, las medidas de la Misná y las cisternas. Leen Ritmeyer y la mayoría ponen el Lugar Santísimo sobre la roca bajo la Cúpula, con el altar al este; Asher Kaufman defendió un punto unos 100 m al norte, bajo la pequeña Cúpula de los Espíritus; unos pocos miran al sur, cerca de la fuente de al-Kas. De la obra de Salomón no se ha identificado nada; de la de Herodes, los muros, las puertas, una inscripción caída del lugar de la trompeta y la piedra de advertencia griega que vedaba a los gentiles los atrios interiores. Los bizantinos dejaron el monte en ruinas; los constructores musulmanes escogieron la roca, y la inscripción en mosaico de Abd al-Malik dentro de la Cúpula da el año 72 de la Hégira, 691/692."
  pt:
    - "No monte do Templo, o Haram al-Sharif, na Cidade Velha de Jerusalém: a colina ao norte da Cidade de Davi que Crônicas chama monte Moriá, onde Davi comprou a eira de Araúna, o jebuseu. O Templo de Salomão ficou ali de cerca de 966 a.C. até que os babilônios o queimaram em 587 ou 586; o Segundo Templo desde 516 a.C.; Herodes, o Grande, o reconstruiu a partir de cerca de 20 a.C. sobre uma plataforma de uns 14 ha cujos muros de arrimo ainda estão de pé, entre eles o Muro das Lamentações, até que os romanos o destruíram em 70 d.C. O Domo da Rocha, construído por volta de 691/692 sob o califa Abd al-Malik, é um santuário, não uma mesquita, erguido sobre a rocha nua do cume; a maioria dos estudiosos sustenta que o santuário mais interno do Templo ficava sobre essa rocha ou ao lado dela."
    - "Crônicas diz que “Salomão começou a construir a casa do SENHOR em Jerusalém, no monte Moriá, onde o SENHOR havia aparecido a Davi, seu pai, no lugar que Davi tinha preparado na eira de Ornã, o jebuseu”, ligando assim o Templo à terra de Moriá aonde Abraão foi enviado para oferecer Isaque. Reis data o início “no quarto ano do reinado de Salomão sobre Israel, no mês de Zive, que é o segundo mês”. Nos Evangelhos os judeus dizem da obra de Herodes: “Levou quarenta e seis anos para construir este templo!”, e Jesus responde à admiração dos discípulos: “não ficará aqui pedra sobre pedra que não seja derrubada.”"
    - "Não é possível escavar na plataforma, de modo que o lugar exato do Templo é discutido a partir da rocha, das medidas da Mishná e das cisternas. Leen Ritmeyer e a maioria põem o Santo dos Santos sobre a rocha sob o Domo, com o altar a leste; Asher Kaufman defendeu um ponto uns 100 m ao norte, sob a pequena Cúpula dos Espíritos; alguns olham para o sul, perto da fonte de al-Kas. Da obra de Salomão nada foi identificado; da de Herodes, os muros, as portas, uma inscrição caída do lugar do toque da trombeta e a pedra grega de advertência que barrava os gentios dos pátios internos. Os bizantinos deixaram o monte em ruínas; os construtores muçulmanos escolheram a rocha, e a inscrição em mosaico de Abd al-Malik dentro do Domo dá o ano 72 da Hégira, 691/692."
  de:
    - "Auf dem Tempelberg, dem Haram esch-Scharif, in der Altstadt Jerusalems: dem Hügel nördlich der Stadt Davids, den die Chronik Berg Morija nennt, wo David die Tenne des Jebusiters Arauna kaufte. Der Tempel Salomos stand dort etwa ab 966 v. Chr., bis die Babylonier ihn 587 oder 586 verbrannten; der Zweite Tempel ab 516 v. Chr.; Herodes der Große baute ihn ab etwa 20 v. Chr. auf einer Plattform von rund 14 ha neu, deren Stützmauern noch stehen, darunter die Westmauer, bis die Römer ihn 70 n. Chr. zerstörten. Der Felsendom, um 691/692 unter dem Kalifen Abd al-Malik erbaut, ist ein Schrein, keine Moschee, über dem nackten Felsen auf dem Gipfel errichtet; die meisten Gelehrten halten dafür, dass das innerste Heiligtum des Tempels auf oder neben diesem Felsen stand."
    - "Die Chronik sagt, „Salomo fing an zu bauen das Haus des HERRN zu Jerusalem auf dem Berge Morija, der David, seinem Vater, gezeigt war, welchen David zubereitet hatte zum Raum auf der Tenne Ornans, des Jebusiters“, und verknüpft so den Tempel mit dem Land Morija, wohin Abraham gesandt wurde, Isaak zu opfern. Die Könige setzen den Beginn „im vierten Jahr des Königreichs Salomo über Israel, im Monat Siv, das ist der zweite Monat“ an. In den Evangelien sagen die Juden über das Werk des Herodes: „Dieser Tempel ist in 46 Jahren erbaut“, und Jesus antwortet auf die Bewunderung seiner Jünger: „Es wird hier nicht ein Stein auf dem anderen bleiben, der nicht zerbrochen werde.“"
    - "Auf der Plattform ist keine Ausgrabung möglich, daher wird die genaue Lage des Tempels aus dem Felsen, den Maßen der Mischna und den Zisternen erschlossen. Leen Ritmeyer und die meisten anderen setzen das Allerheiligste über den Felsen unter dem Dom, mit dem Altar östlich davon; Asher Kaufman plädierte für eine Stelle etwa 100 m weiter nördlich, unter der kleinen Kuppel der Geister; wenige blicken nach Süden, nahe dem Brunnen al-Kas. Von Salomos Bau ist nichts identifiziert; von Herodes' Bau die Mauern, die Tore, eine herabgestürzte Inschrift vom Trompetenplatz und der griechische Warnstein, der Heiden von den inneren Vorhöfen ausschloss. Die Byzantiner ließen den Berg in Trümmern; die muslimischen Bauherren wählten den Felsen, und Abd al-Maliks Mosaikinschrift im Inneren des Doms nennt das Jahr 72 der Hidschra, 691/692."
  fr:
    - "Sur le mont du Temple, le Haram al-Sharif, dans la Vieille Ville de Jérusalem : la colline au nord de la Cité de David que les Chroniques appellent mont Morija, où David acheta l’aire d’Aravna le Jébusien. Le Temple de Salomon s’y dressa vers 966 av. J.-C. jusqu’à ce que les Babyloniens le brûlent en 587 ou 586 ; le second Temple à partir de 516 av. J.-C. ; Hérode le Grand le rebâtit à partir de 20 av. J.-C. environ sur une plate-forme d’environ 14 ha dont les murs de soutènement subsistent, dont le mur occidental, jusqu’à sa destruction par les Romains en 70 apr. J.-C. Le Dôme du Rocher, bâti vers 691/692 sous le calife Abd al-Malik, est un sanctuaire, non une mosquée, élevé sur le rocher nu du sommet ; la plupart des savants tiennent que le sanctuaire intérieur du Temple se dressait sur ce rocher ou à côté."
    - "Les Chroniques disent que « Salomon commença à bâtir la maison de l’Éternel à Jérusalem, sur la montagne de Morija, qui avait été indiquée à David, son père, dans le lieu préparé par David sur l’aire d’Ornan, le Jébusien », et rattachent ainsi le Temple au pays de Morija où Abraham fut envoyé offrir Isaac. Les Rois datent le début de « la quatrième année de son règne sur Israël, au mois de Ziv, qui est le second mois ». Dans les Évangiles, les Juifs disent de l’œuvre d’Hérode : « Il a fallu quarante-six ans pour bâtir ce temple », et Jésus répond à l’admiration de ses disciples : « il ne restera pas ici pierre sur pierre qui ne soit renversée. »"
    - "Aucune fouille n’est possible sur la plate-forme ; l’emplacement exact du Temple se discute donc d’après le rocher, les mesures de la Mishna et les citernes. Leen Ritmeyer et la plupart des autres placent le Saint des saints sur le rocher sous le Dôme, avec l’autel à l’est ; Asher Kaufman plaidait pour un point à environ 100 m au nord, sous le petit Dôme des Esprits ; quelques-uns regardent vers le sud, près de la fontaine d’al-Kas. De l’édifice de Salomon, rien n’a été identifié ; de celui d’Hérode, les murs, les portes, une inscription tombée de la « place de la trompette » et la stèle grecque d’avertissement qui interdisait aux païens les cours intérieures. Les Byzantins laissèrent le mont en ruines ; les bâtisseurs musulmans choisirent le rocher, et l’inscription en mosaïque d’Abd al-Malik à l’intérieur du Dôme donne l’an 72 de l’hégire, 691/692."
