id: where-did-the-temple-stand
question:
  en: "Where did the Temple stand, and what is the Dome of the Rock?"
  ru: "Где стоял Храм и что такое Купол Скалы?"
  uk: "Де стояв Храм і що таке Купол Скелі?"
  es: "¿Dónde se alzaba el Templo y qué es la Cúpula de la Roca?"
  pt: "Onde ficava o Templo, e o que é o Domo da Rocha?"
  de: "Wo stand der Tempel, und was ist der Felsendom?"
  fr: "Où se dressait le Temple, et qu’est-ce que le Dôme du Rocher ?"
  pl: "Gdzie stała Świątynia i czym jest Kopuła na Skale?"
  it: "Dove sorgeva il Tempio, e che cos’è la Cupola della Roccia?"
  nl: "Waar stond de tempel, en wat is de Rotskoepel?"
  cs: "Kde stál chrám a co je Skalní dóm?"
  sv: "Var stod templet, och vad är Klippdomen?"
  nb: "Hvor sto tempelet, og hva er Klippedomen?"
  tl: "Saan nakatayo ang Templo, at ano ang Simboryo ng Bato?"
  da: "Hvor stod Templet, og hvad er Klippedomen?"
  sr: "Где је стајао Храм и шта је Купола на стени?"
  hu: "Hol állt a Templom, és mi a Sziklamecset?"
  fi: "Missä temppeli seisoi ja mikä on Kalliomoskeija?"
  vi: "Đền Thờ đứng ở đâu, và Dome of the Rock là gì?"
  ro: "Unde a stat Templul și ce este Domul Stâncii?"
  bg: "Къде е стоял Храмът и какво е Скалният купол?"
answer:
  en:
    - "On the Temple Mount, the Haram al-Sharif, in the Old City of Jerusalem: the hill north of the City of David that Chronicles calls Mount Moriah, where David bought the threshing floor of Araunah the Jebusite. Solomon's Temple stood there from about 966 BC until the Babylonians burned it in 587 or 586; the Second Temple from 516 BC; Herod the Great rebuilt it from about 20 BC on a platform of some 14 ha whose retaining walls still stand, the Western Wall among them, until the Romans destroyed it in AD 70. The Dome of the Rock, built about 691/692 under the caliph Abd al-Malik, is a shrine, not a mosque, built over the bare rock at the summit; most scholars hold that the Temple's innermost sanctuary stood on or beside that rock."
    - "Chronicles says that “Solomon began to build the house of the LORD at Jerusalem in mount Moriah, where the Lord appeared unto David his father, in the place that David had prepared in the threshingfloor of Ornan the Jebusite”, and so ties the Temple to the land of Moriah where Abraham was sent to offer Isaac. Kings dates the start to “the fourth year of Solomon's reign over Israel, in the month Zif, which is the second month”. In the Gospels the Jews say of Herod's work, “Forty and six years was this temple in building”, and Jesus answers his disciples' admiration: “There shall not be left here one stone upon another, that shall not be thrown down.”"
    - "No excavation is possible on the platform, so the Temple's exact place is argued from the rock, the Mishnah's measurements and the cisterns. Leen Ritmeyer and most others put the Holy of Holies over the rock under the Dome, with the altar to its east; Asher Kaufman argued for a spot about 100 m to the north, under the small Dome of the Spirits; a few look south, near the fountain of al-Kas. Of Solomon's building nothing has been identified; of Herod's, the walls, the gates, a fallen trumpeting-place inscription and the Greek warning stone that barred gentiles from the inner courts. The Byzantines left the Mount in ruins; the Muslim builders chose the rock, and Abd al-Malik's mosaic inscription inside the Dome gives the year 72 of the Hijra, 691/692."
  ru:
    - "На Храмовой горе, Харам аш-Шариф, в Старом городе Иерусалима — на холме к северу от Города Давидова, который Паралипоменон называет горой Мориа, где Давид купил гумно Орны Иевусеянина. Храм Соломона стоял там примерно с 966 г. до н. э., пока вавилоняне не сожгли его в 587 или 586 году; Второй Храм — с 516 г. до н. э.; Ирод Великий перестроил его примерно с 20 г. до н. э. на платформе около 14 га, чьи подпорные стены стоят до сих пор, среди них и Западная стена, — пока римляне не разрушили его в 70 г. н. э. Купол Скалы, построенный около 691/692 года при халифе Абд аль-Малике, — святилище, а не мечеть, построенное над голой скалой на вершине; большинство учёных считает, что внутреннее святилище Храма стояло на этой скале или рядом с ней."
    - "Паралипоменон говорит: «И начал Соломон строить дом Господень в Иерусалиме на горе Мориа, которая указана была Давиду, отцу его, на месте, которое приготовил Давид, на гумне Орны Иевусеянина», — и так связывает Храм с землёй Мориа, куда Авраам был послан принести Исаака. Книга Царств датирует начало работ: «в четвертый год царствования Соломонова над Израилем, в месяц Зиф, который есть второй месяц». В Евангелиях иудеи говорят о постройке Ирода: «сей храм строился сорок шесть лет», а Иисус отвечает на восхищение учеников: «не останется здесь камня на камне; все будет разрушено»."
    - "Раскопки на платформе невозможны, и точное место Храма выводят из скалы, мер Мишны и цистерн. Леен Ритмейер и большинство других помещают Святое Святых над скалой под Куполом, а жертвенник — к востоку от неё; Ашер Кауфман доказывал, что место лежит примерно в 100 м к северу, под маленьким Куполом Духов; немногие смотрят на юг, к фонтану аль-Кас. От постройки Соломона ничего не опознано; от Иродовой — стены, ворота, упавший камень с надписью о месте трубления и греческая плита, запрещавшая язычникам вход во внутренние дворы. Византийцы оставили гору в развалинах; мусульманские строители выбрали скалу, и мозаичная надпись Абд аль-Малика внутри Купола называет 72 год хиджры — 691/692."
  uk:
    - "На Храмовій горі, Харам еш-Шаріф, у Старому місті Єрусалиму: пагорбі на північ від Міста Давида, який Хроніки називають горою Морія, де Давид купив тік Арауни Євусея. Храм Соломона стояв там близько 966 р. до н. е., доки вавилоняни не спалили його 587 або 586 р.; Другий Храм — від 516 р. до н. е.; Ірод Великий перебудував його від близько 20 р. до н. е. на платформі приблизно в 14 га, підпірні стіни якої досі стоять, серед них Західна стіна, доки римляни не зруйнували його 70 р. н. е. Купол Скелі, збудований близько 691/692 р. за халіфа Абд аль-Маліка, — це святиня, а не мечеть, зведена над голою скелею на вершині; більшість учених вважає, що найглибша святиня Храму стояла на цій скелі або поряд із нею."
    - "Хроніки кажуть: «І почав Соломон будувати дом Господнїй в Ерусалимі на горі Моріа, що була вказана Давидові, його батькові, на місцї, що зготував Давид на току Орни Евузія», і так пов'язують Храм із землею Морія, куди Авраама було послано принести Ісаака. Книга Царів датує початок «у четвертому роцї, місяця Зифа, — се є місяць другий — царювання Соломонового над Ізраїлем». В Євангеліях євреї кажуть про працю Ірода: «Сорок і шість років будовано церкву сю», а Ісус відповідає на захват учнів: «Не зостанеть ся тут камінь на каменї, щоб не зруйновано»."
    - "На платформі жодні розкопки неможливі, тож точне місце Храму виводять зі скелі, мір Мішни й цистерн. Лін Рітмеєр і більшість інших ставлять Святе святих над скелею під Куполом, з жертовником на схід від неї; Ашер Кауфман обстоював місце приблизно за 100 м на північ, під малим Куполом Духів; деякі дивляться на південь, біля фонтану аль-Кас. Із Соломонової споруди нічого не ідентифіковано; з Іродової — стіни, брами, напис про місце сурмління, що впав, і грецький камінь-застереження, що забороняв язичникам вхід до внутрішніх дворів. Візантійці залишили гору в руїнах; мусульманські будівничі обрали скелю, а мозаїчний напис Абд аль-Маліка всередині Купола дає 72 рік гіджри, 691/692 р."
  es:
    - "En el monte del Templo, el Haram al-Sharif, en la Ciudad Vieja de Jerusalén: la colina al norte de la Ciudad de David que Crónicas llama monte Moria, donde David compró la era de Arauna el jebuseo. El Templo de Salomón se alzó allí desde alrededor del 966 a. C. hasta que los babilonios lo incendiaron en el 587 o 586; el Segundo Templo desde el 516 a. C.; Herodes el Grande lo reconstruyó desde alrededor del 20 a. C. sobre una plataforma de unas 14 ha cuyos muros de contención siguen en pie, entre ellos el Muro Occidental, hasta que los romanos lo destruyeron en el 70 d. C. La Cúpula de la Roca, construida hacia el 691/692 bajo el califa Abd al-Malik, es un santuario, no una mezquita, edificado sobre la roca desnuda de la cima; la mayoría de los estudiosos sostiene que el santuario más interior del Templo se alzaba sobre esa roca o junto a ella."
    - "Crónicas dice que «Y comenzó Salomón á edificar la casa en Jerusalem, en el monte Moria que había sido mostrado á David su padre, en el lugar que David había preparado en la era de Ornán Jebuseo», y así vincula el Templo con la tierra de Moriah a la que Abraham fue enviado para ofrecer a Isaac. Reyes fecha el comienzo «en el cuarto año del principio del reino de Salomón sobre Israel, en el mes de Ziph, que es el mes segundo». En los Evangelios los judíos dicen de la obra de Herodes: «En cuarenta y seis años fué este templo edificado», y Jesús responde a la admiración de sus discípulos: «no será dejada aquí piedra sobre piedra, que no sea destruída»."
    - "No es posible excavar en la plataforma, de modo que el lugar exacto del Templo se discute a partir de la roca, las medidas de la Misná y las cisternas. Leen Ritmeyer y la mayoría ponen el Lugar Santísimo sobre la roca bajo la Cúpula, con el altar al este; Asher Kaufman defendió un punto unos 100 m al norte, bajo la pequeña Cúpula de los Espíritus; unos pocos miran al sur, cerca de la fuente de al-Kas. De la obra de Salomón no se ha identificado nada; de la de Herodes, los muros, las puertas, una inscripción caída del lugar de la trompeta y la piedra de advertencia griega que vedaba a los gentiles los atrios interiores. Los bizantinos dejaron el monte en ruinas; los constructores musulmanes escogieron la roca, y la inscripción en mosaico de Abd al-Malik dentro de la Cúpula da el año 72 de la Hégira, 691/692."
  pt:
    - "No monte do Templo, o Haram al-Sharif, na Cidade Velha de Jerusalém: a colina ao norte da Cidade de Davi que Crônicas chama monte Moriá, onde Davi comprou a eira de Araúna, o jebuseu. O Templo de Salomão ficou ali de cerca de 966 a.C. até que os babilônios o queimaram em 587 ou 586; o Segundo Templo desde 516 a.C.; Herodes, o Grande, o reconstruiu a partir de cerca de 20 a.C. sobre uma plataforma de uns 14 ha cujos muros de arrimo ainda estão de pé, entre eles o Muro das Lamentações, até que os romanos o destruíram em 70 d.C. O Domo da Rocha, construído por volta de 691/692 sob o califa Abd al-Malik, é um santuário, não uma mesquita, erguido sobre a rocha nua do cume; a maioria dos estudiosos sustenta que o santuário mais interno do Templo ficava sobre essa rocha ou ao lado dela."
    - "Crônicas diz que “Salomão começou a construir a casa do SENHOR em Jerusalém, no monte Moriá, onde o SENHOR havia aparecido a Davi, seu pai, no lugar que Davi tinha preparado na eira de Ornã, o jebuseu”, ligando assim o Templo à terra de Moriá aonde Abraão foi enviado para oferecer Isaque. Reis data o início “no quarto ano do reinado de Salomão sobre Israel, no mês de Zive, que é o segundo mês”. Nos Evangelhos os judeus dizem da obra de Herodes: “Levou quarenta e seis anos para construir este templo!”, e Jesus responde à admiração dos discípulos: “não ficará aqui pedra sobre pedra que não seja derrubada.”"
    - "Não é possível escavar na plataforma, de modo que o lugar exato do Templo é discutido a partir da rocha, das medidas da Mishná e das cisternas. Leen Ritmeyer e a maioria põem o Santo dos Santos sobre a rocha sob o Domo, com o altar a leste; Asher Kaufman defendeu um ponto uns 100 m ao norte, sob a pequena Cúpula dos Espíritos; alguns olham para o sul, perto da fonte de al-Kas. Da obra de Salomão nada foi identificado; da de Herodes, os muros, as portas, uma inscrição caída do lugar do toque da trombeta e a pedra grega de advertência que barrava os gentios dos pátios internos. Os bizantinos deixaram o monte em ruínas; os construtores muçulmanos escolheram a rocha, e a inscrição em mosaico de Abd al-Malik dentro do Domo dá o ano 72 da Hégira, 691/692."
  de:
    - "Auf dem Tempelberg, dem Haram esch-Scharif, in der Altstadt Jerusalems: dem Hügel nördlich der Stadt Davids, den die Chronik Berg Morija nennt, wo David die Tenne des Jebusiters Arauna kaufte. Der Tempel Salomos stand dort etwa ab 966 v. Chr., bis die Babylonier ihn 587 oder 586 verbrannten; der Zweite Tempel ab 516 v. Chr.; Herodes der Große baute ihn ab etwa 20 v. Chr. auf einer Plattform von rund 14 ha neu, deren Stützmauern noch stehen, darunter die Westmauer, bis die Römer ihn 70 n. Chr. zerstörten. Der Felsendom, um 691/692 unter dem Kalifen Abd al-Malik erbaut, ist ein Schrein, keine Moschee, über dem nackten Felsen auf dem Gipfel errichtet; die meisten Gelehrten halten dafür, dass das innerste Heiligtum des Tempels auf oder neben diesem Felsen stand."
    - "Die Chronik sagt, „Salomo fing an zu bauen das Haus des HERRN zu Jerusalem auf dem Berge Morija, der David, seinem Vater, gezeigt war, welchen David zubereitet hatte zum Raum auf der Tenne Ornans, des Jebusiters“, und verknüpft so den Tempel mit dem Land Morija, wohin Abraham gesandt wurde, Isaak zu opfern. Die Könige setzen den Beginn „im vierten Jahr des Königreichs Salomo über Israel, im Monat Siv, das ist der zweite Monat“ an. In den Evangelien sagen die Juden über das Werk des Herodes: „Dieser Tempel ist in 46 Jahren erbaut“, und Jesus antwortet auf die Bewunderung seiner Jünger: „Es wird hier nicht ein Stein auf dem anderen bleiben, der nicht zerbrochen werde.“"
    - "Auf der Plattform ist keine Ausgrabung möglich, daher wird die genaue Lage des Tempels aus dem Felsen, den Maßen der Mischna und den Zisternen erschlossen. Leen Ritmeyer und die meisten anderen setzen das Allerheiligste über den Felsen unter dem Dom, mit dem Altar östlich davon; Asher Kaufman plädierte für eine Stelle etwa 100 m weiter nördlich, unter der kleinen Kuppel der Geister; wenige blicken nach Süden, nahe dem Brunnen al-Kas. Von Salomos Bau ist nichts identifiziert; von Herodes' Bau die Mauern, die Tore, eine herabgestürzte Inschrift vom Trompetenplatz und der griechische Warnstein, der Heiden von den inneren Vorhöfen ausschloss. Die Byzantiner ließen den Berg in Trümmern; die muslimischen Bauherren wählten den Felsen, und Abd al-Maliks Mosaikinschrift im Inneren des Doms nennt das Jahr 72 der Hidschra, 691/692."
  fr:
    - "Sur le mont du Temple, le Haram al-Sharif, dans la Vieille Ville de Jérusalem : la colline au nord de la Cité de David que les Chroniques appellent mont Morija, où David acheta l’aire d’Aravna le Jébusien. Le Temple de Salomon s’y dressa vers 966 av. J.-C. jusqu’à ce que les Babyloniens le brûlent en 587 ou 586 ; le second Temple à partir de 516 av. J.-C. ; Hérode le Grand le rebâtit à partir de 20 av. J.-C. environ sur une plate-forme d’environ 14 ha dont les murs de soutènement subsistent, dont le mur occidental, jusqu’à sa destruction par les Romains en 70 apr. J.-C. Le Dôme du Rocher, bâti vers 691/692 sous le calife Abd al-Malik, est un sanctuaire, non une mosquée, élevé sur le rocher nu du sommet ; la plupart des savants tiennent que le sanctuaire intérieur du Temple se dressait sur ce rocher ou à côté."
    - "Les Chroniques disent que « Salomon commença à bâtir la maison de l’Éternel à Jérusalem, sur la montagne de Morija, qui avait été indiquée à David, son père, dans le lieu préparé par David sur l’aire d’Ornan, le Jébusien », et rattachent ainsi le Temple au pays de Morija où Abraham fut envoyé offrir Isaac. Les Rois datent le début de « la quatrième année de son règne sur Israël, au mois de Ziv, qui est le second mois ». Dans les Évangiles, les Juifs disent de l’œuvre d’Hérode : « Il a fallu quarante-six ans pour bâtir ce temple », et Jésus répond à l’admiration de ses disciples : « il ne restera pas ici pierre sur pierre qui ne soit renversée. »"
    - "Aucune fouille n’est possible sur la plate-forme ; l’emplacement exact du Temple se discute donc d’après le rocher, les mesures de la Mishna et les citernes. Leen Ritmeyer et la plupart des autres placent le Saint des saints sur le rocher sous le Dôme, avec l’autel à l’est ; Asher Kaufman plaidait pour un point à environ 100 m au nord, sous le petit Dôme des Esprits ; quelques-uns regardent vers le sud, près de la fontaine d’al-Kas. De l’édifice de Salomon, rien n’a été identifié ; de celui d’Hérode, les murs, les portes, une inscription tombée de la « place de la trompette » et la stèle grecque d’avertissement qui interdisait aux païens les cours intérieures. Les Byzantins laissèrent le mont en ruines ; les bâtisseurs musulmans choisirent le rocher, et l’inscription en mosaïque d’Abd al-Malik à l’intérieur du Dôme donne l’an 72 de l’hégire, 691/692."
  pl:
    - "Na Wzgórzu Świątynnym, Haram asz-Szarif, w Starym Mieście w Jerozolimie: na wzgórzu na północ od Miasta Dawida, które Księgi Kronik nazywają górą Moria, gdzie Dawid kupił klepisko Arauny Jebusyty. Świątynia Salomona stała tam od około 966 p.n.e., aż Babilończycy spalili ją w 587 lub 586; Druga Świątynia od 516 p.n.e.; Herod Wielki odbudował ją od około 20 p.n.e. na platformie o powierzchni około 14 ha, której mury oporowe wciąż stoją, w tym Mur Zachodni, aż Rzymianie zniszczyli ją w 70 n.e. Kopuła na Skale, zbudowana około 691/692 za kalifa Abd al-Malika, jest sanktuarium, nie meczetem, wzniesionym nad gołą skałą na szczycie; większość uczonych uważa, że najgłębsze sanktuarium Świątyni stało na tej skale lub obok niej."
    - "Księgi Kronik mówią: „Począł tedy Salomon budować dom Pański w Jeruzalemie na górze Moryja, która była ukazana Dawidowi, ojcu jego, na miejscu, które zgotował Dawid na bojewisku Ornana Jebuzejczyka”, i tak wiążą Świątynię z ziemią Moryja, dokąd Abraham został posłany, by ofiarować Izaaka. Księgi Królewskie datują początek na „miesiąca Kwietnia (ten jest miesiąc wtóry,) roku czwartego królowania Salomonowego nad Izraelem”. W Ewangeliach Żydzi mówią o Świątyni odbudowywanej przez Heroda: „Czterdzieści i sześć lat budowano ten kościół”, a Jezus odpowiada na podziw uczniów: „nie zostanie tu kamień na kamieniu, który by nie był rozwalony”."
    - "Na platformie nie można prowadzić wykopalisk, więc dokładne miejsce Świątyni wywodzi się ze skały, miar z Miszny i cystern. Leen Ritmeyer i większość innych umieszczają Miejsce Najświętsze nad skałą pod Kopułą, z ołtarzem na wschód od niej; Asher Kaufman dowodził za miejscem około 100 m na północ, pod małą Kopułą Duchów; nieliczni patrzą na południe, w pobliże fontanny al-Kas. Z budowli Salomona nic nie zidentyfikowano; z budowli Heroda zachowały się mury, bramy, zrzucony napis z miejsca trąbienia i grecki kamień ostrzegawczy, który zabraniał poganom wstępu na wewnętrzne dziedzińce. Bizantyjczycy zostawili Wzgórze w ruinie; muzułmańscy budowniczowie wybrali skałę, a mozaikowy napis Abd al-Malika wewnątrz Kopuły podaje rok 72 hidżry, 691/692."
  it:
    - "Sul Monte del Tempio, l’Haram al-Sharif, nella Città Vecchia di Gerusalemme: il colle a nord della Città di Davide che le Cronache chiamano Monte Moria, dove Davide comprò l’aia di Arauna il Gebuseo. Il Tempio di Salomone vi sorse dal 966 a.C. circa finché i Babilonesi lo bruciarono nel 587 o 586; il Secondo Tempio dal 516 a.C.; Erode il Grande lo ricostruì dal 20 a.C. circa su una piattaforma di circa 14 ha i cui muri di contenimento sono ancora in piedi, il Muro Occidentale tra questi, finché i Romani lo distrussero nel 70 d.C. La Cupola della Roccia, costruita intorno al 691/692 sotto il califfo Abd al-Malik, è un santuario, non una moschea, costruito sulla nuda roccia alla sommità; la maggior parte degli studiosi ritiene che il santuario più interno del Tempio sorgesse su quella roccia o accanto a essa."
    - "Le Cronache dicono che «Salomone cominciò a costruire la casa dell’Eterno a Gerusalemme, sul monte Moriah, dove l’Eterno era apparso a Davide suo padre, nel luogo che Davide aveva preparato, nell’aia di Ornan, il Gebuseo», e così legano il Tempio al paese di Moriah dove Abramo fu mandato a offrire Isacco. I Re datano l’inizio al «quarto anno del suo regno sopra Israele, nel mese di Ziv, che è il secondo mese». Nei Vangeli i Giudei dicono dell’opera di Erode: «Quarantasei anni è durata la fabbrica di questo tempio», e Gesù risponde all’ammirazione dei discepoli: «Non sarà lasciata qui pietra sopra pietra che non sia diroccata»."
    - "Sulla piattaforma non è possibile alcuno scavo, così il luogo esatto del Tempio si argomenta dalla roccia, dalle misure della Mishnah e dalle cisterne. Leen Ritmeyer e la maggior parte degli altri pongono il Santo dei Santi sopra la roccia sotto la Cupola, con l’altare a est; Asher Kaufman sostenne un punto a circa 100 m a nord, sotto la piccola Cupola degli Spiriti; pochi guardano a sud, vicino alla fontana di al-Kas. Della costruzione di Salomone nulla è stato identificato; di quella di Erode, i muri, le porte, un’iscrizione caduta del luogo della tromba e la pietra con l’avvertimento in greco che vietava ai gentili i cortili interni. I Bizantini lasciarono il Monte in rovina; i costruttori musulmani scelsero la roccia, e l’iscrizione a mosaico di Abd al-Malik all’interno della Cupola dà l’anno 72 dell’Egira, 691/692."
  nl:
    - "Op de Tempelberg, de Haram al-Sjarif, in de Oude Stad van Jeruzalem: de heuvel ten noorden van de Stad van David die Kronieken de berg Moria noemt, waar David de dorsvloer van Arauna de Jebusiet kocht. De tempel van Salomo stond daar van omstreeks 966 v.Chr. tot de Babyloniërs hem in 587 of 586 verbrandden; de Tweede Tempel vanaf 516 v.Chr.; Herodes de Grote herbouwde hem vanaf omstreeks 20 v.Chr. op een platform van zo’n 14 ha waarvan de steunmuren, waaronder de Westelijke Muur, nog staan, tot de Romeinen hem in 70 n.Chr. verwoestten. De Rotskoepel, omstreeks 691/692 gebouwd onder kalief Abd al-Malik, is een heiligdom, geen moskee, gebouwd boven de kale rots op de top; de meeste geleerden menen dat het binnenste heiligdom van de tempel op of naast die rots stond."
    - "Kronieken zegt: “Salomo begon het huis des HEEREN te bouwen te Jeruzalem, op den berg Moria, die zijn vader David gewezen was, in de plaats, die David toebereid had, op den dorsvloer van Ornan, den Jebusiet”, en verbindt de tempel zo met het land Moria waar Abraham werd gezonden om Isaak te offeren. Koningen dateert het begin op “het vierde jaar van het koninkrijk van Salomo over Israel, in de maand Ziv (deze is de tweede maand)”. In de Evangeliën zeggen de Joden over het werk van Herodes: “Zes en veertig jaren is over dezen tempel gebouwd”, en Jezus antwoordt op de bewondering van zijn discipelen: “Hier zal niet een steen op den anderen steen gelaten worden, die niet afgebroken zal worden.”"
    - "Op het platform is geen opgraving mogelijk, dus de exacte plaats van de tempel wordt beredeneerd uit de rots, de maten van de Misjna en de regenbakken. Leen Ritmeyer en de meesten plaatsen het Allerheiligste boven de rots onder de Koepel, met het altaar ten oosten ervan; Asher Kaufman pleitte voor een plek ongeveer 100 m naar het noorden, onder de kleine Koepel van de Geesten; enkelen kijken naar het zuiden, nabij de fontein al-Kas. Van Salomo’s gebouw is niets geïdentificeerd; van dat van Herodes de muren, de poorten, een gevallen inscriptie van de trompetplaats en de Griekse waarschuwingssteen die heidenen de binnenhoven ontzegde. De Byzantijnen lieten de berg in puin; de islamitische bouwers kozen de rots, en Abd al-Maliks mozaïekinscriptie in de Koepel geeft het jaar 72 van de Hidjra, 691/692."
  cs:
    - "Na Chrámové hoře, Haram aš-Šaríf, ve Starém Městě Jeruzaléma: na pahorku severně od Města Davidova, který Letopisy nazývají horou Moria, kde David koupil humno Aravny Jebusejského. Šalomounův chrám tam stál od asi 966 př. n. l., dokud jej Babyloňané nespálili roku 587 nebo 586; druhý chrám od roku 516 př. n. l.; Herodes Veliký jej od asi 20 př. n. l. přestavěl na terase o výměře asi 14 ha, jejíž opěrné zdi dosud stojí, mezi nimi Západní zeď, dokud jej Římané roku 70 n. l. nezničili. Skalní dóm, postavený kolem 691/692 za chalífy Abd al-Malika, je svatyně, nikoli mešita, vystavěná nad holou skálou na vrcholu; většina badatelů míní, že nejvnitřnější svatyně chrámu stála na té skále nebo vedle ní."
    - "Letopisy říkají, že „začal stavěti Šalomoun domu Hospodinova v Jeruzalémě na hoře Moria, kteráž byla ukázána Davidovi otci jeho, na místě, kteréž byl připravil David, na humně Ornana Jebuzejského“, a tak spojují chrám se zemí Moria, kam byl Abraham poslán obětovat Izáka. Kniha Královská datuje začátek: „Šalomoun měsíce Ziv, (jenž jest měsíc druhý), čtvrtého léta kralování svého nad Izraelem, počal stavěti domu Hospodinova“. V evangeliích Židé o Herodově díle říkají: „Čtyřidceti a šest let dělán jest chrám tento“ a Ježíš odpovídá na obdiv učedníků: „Nebude zůstaven tuto kámen na kameni, kterýž by nebyl zbořen.“"
    - "Na terase nelze provádět vykopávky, a proto se přesné místo chrámu odvozuje ze skály, Mišniných rozměrů a cisteren. Leen Ritmeyer a většina ostatních kladou Nejsvětější svatyni nad skálu pod Dómem, s oltářem na východ od ní; Asher Kaufman hájil místo asi 100 m na sever, pod malým Dómem Duchů; několik badatelů hledá na jih, poblíž fontány al-Kás. Ze Šalomounovy stavby nebylo nic identifikováno; z Herodovy stavby byly identifikovány zdi, brány, spadlý nápis z místa trubačů a řecký varovný kámen, který zakazoval pohanům vstup do vnitřních nádvoří. Byzantinci nechali horu v troskách; muslimští stavitelé zvolili skálu a mozaikový nápis Abd al-Malika uvnitř Dómu udává rok 72 hidžry, 691/692."
  sv:
    - "På Tempelberget, Haram al-Sharif, i Jerusalems gamla stad: kullen norr om Davids stad som Krönikeböckerna kallar berget Moria, där David köpte jebuséen Araunas tröskplats. Salomos tempel stod där från omkring 966 f.Kr. tills babylonierna brände det 587 eller 586; det andra templet från 516 f.Kr.; Herodes den store byggde upp det från omkring 20 f.Kr. på en plattform på omkring 14 ha vars stödmurar fortfarande står, bland dem Västmuren, tills romarna förstörde det år 70 e.Kr. Klippdomen, byggd omkring 691/692 under kalifen Abd al-Malik, är en helgedom, inte en moské, byggd över den nakna klippan på toppen; de flesta forskare menar att templets innersta helgedom stod på eller bredvid den klippan."
    - "Krönikeböckerna säger att ”Salomo begynte att bygga HERRENS hus i Jerusalem, på berget Moria, där hans fader David hade fått sin uppenbarelse, och där han nu själv hade berett rum, på det ställe som David hade utsett, nämligen på jebuséen Ornans tröskplats”, och binder så templet till Moria land där Abraham sändes för att offra Isak. Kungaböckerna daterar början till ”det fjärde året av Salomos regering över Israel, i månaden Siv, det är den andra månaden”. I evangelierna säger judarna om Herodes verk: ”I fyrtiosex år har man byggt på detta tempel”, och Jesus svarar på lärjungarnas beundran: ”Här skall icke lämnas sten på sten; allt skall bliva nedbrutet.”"
    - "Ingen utgrävning är möjlig på plattformen, så templets exakta plats diskuteras utifrån klippan, Mishnas mått och cisternerna. Leen Ritmeyer och de flesta andra placerar det allra heligaste över klippan under Domen, med altaret öster därom; Asher Kaufman argumenterade för en plats omkring 100 m åt norr, under den lilla Andarnas kupol; några ser söderut, nära källan al-Kas. Av Salomos bygge har ingenting identifierats; av Herodes bygge murarna, portarna, en fallen inskription från trumpetplatsen och den grekiska varningsstenen som stängde ute hedningar från de inre förgårdarna. Bysantinerna lät berget ligga i ruiner; de muslimska byggarna valde klippan, och Abd al-Maliks mosaikinskription inne i Domen anger år 72 efter hijra, 691/692."
  nb:
    - "På Tempelhøyden, Haram al-Sharif, i gamlebyen i Jerusalem: høyden nord for Davidsbyen som Krønikebøkene kaller Moriafjellet, der David kjøpte treskeplassen til jebusitten Aravna. Salomos tempel sto der fra omkring 966 f.Kr. til babylonerne brente det i 587 eller 586; det andre tempelet fra 516 f.Kr.; Herodes den store gjenreiste det fra omkring 20 f.Kr. på en plattform på rundt 14 ha hvis støttemurer fortsatt står, blant dem Klagemuren, til romerne ødela det i 70 e.Kr. Klippedomen, bygget omkring 691/692 under kalifen Abd al-Malik, er en helligdom, ikke en moské, bygget over den bare klippen på toppen; de fleste forskere mener at tempelets innerste helligdom sto på eller ved denne klippen."
    - "Krønikebøkene sier: «Så begynte Salomo å bygge Herrens hus i Jerusalem, på Moriafjellet, der hvor Herren hadde åpenbaret sig for hans far David, på den plass hvor David hadde samlet forråd, på jebusitten Ornans treskeplass», og knytter dermed tempelet til Moria land, der Abraham ble sendt for å ofre Isak. Kongebøkene daterer begynnelsen til «i måneden siv - det er den annen måned - i det fjerde år efterat Salomo var blitt konge over Israel». I evangeliene sier jødene om Herodes' arbeid: «I seks og firti år har det vært bygget på dette tempel», og Jesus svarer sine disipler som beundret det: «Her skal ikke levnes sten på sten som ikke skal brytes ned.»"
    - "Ingen utgraving er mulig på plattformen, så tempelets nøyaktige sted drøftes ut fra klippen, Mishnas mål og sisternene. Leen Ritmeyer og de fleste andre setter Det aller helligste over klippen under kuppelen, med alteret øst for det; Asher Kaufman argumenterte for et sted omkring 100 m lenger nord, under den lille Åndenes kuppel; noen få ser mot sør, nær fontenen al-Kas. Av Salomos byggverk er ingenting identifisert; av Herodes' bygg er murene, portene, en nedfalt innskrift fra trompetstedet og den greske advarselsstenen som stengte hedninger ute fra de indre gårdene kjent. Bysantinerne lot høyden ligge i ruiner; de muslimske byggherrene valgte klippen, og Abd al-Maliks mosaikkinnskrift inne i kuppelen oppgir år 72 etter hijra, 691/692."
  tl:
    - "Sa Bundok ng Templo, ang Haram al-Sharif, sa Lumang Lungsod ng Jerusalem: ang burol sa hilaga ng Bayan ni David na tinatawag ng Mga Cronica na Bundok Moria, kung saan binili ni David ang giikan ni Arauna na Jebuseo. Nakatayo roon ang Templo ni Salomon mula mga 966 BK hanggang sunugin ito ng mga Babilonio noong 587 o 586; ang Ikalawang Templo mula 516 BK; muling itinayo ito ni Herodes na Dakila mula mga 20 BK sa plataporma na mga 14 ha na ang mga pader na pansuporta ay nakatayo pa, kabilang ang Pader na Kanluran, hanggang winasak ito ng mga Romano noong 70 AD. Ang Simboryo ng Bato, na itinayo mga 691/692 sa ilalim ng kalipang si Abd al-Malik, ay isang dambana, hindi moske, na itinayo sa ibabaw ng hubad na bato sa tuktok; naniniwala ang karamihan ng iskolar na nakatayo ang pinakaloob na santuwaryo ng Templo sa o sa tabi ng batong iyon."
    - "Sinasabi ng Mga Cronica na “pinasimulan ni Salomon na itayo ang bahay ng Panginoon, sa Jerusalem sa bundok ng Moria, na pinagkakitaan ng Panginoon kay David na kaniyang ama, sa dakong kaniyang pinaghandaan na pinagtakdaan ni David sa giikan ni Ornan na Jebuseo”, kaya iniuugnay ang Templo sa lupain ng Moria kung saan ipinadala si Abraham upang ihandog si Isaac. Itinatakda ng Mga Hari ang simula sa “ikaapat na taon ng paghahari ni Salomon sa Israel, nang buwan ng Ziph, na ikalawang buwan”. Sa mga Ebanghelyo, sinasabi ng mga Judio tungkol sa gawa ni Herodes, “Apat na pu't anim na taon ang pagtatayo ng templong ito”, at sinasagot ni Jesus ang paghanga ng kaniyang mga alagad: “Dito'y walang maiiwang isang bato sa ibabaw ng ibang bato, na hindi ibabagsak.”"
    - "Hindi mahuhukay ang plataporma, kaya hinuhugot ang lugar ng Templo mula sa bato, sa mga sukat ng Mishnah at sa mga sisterna. Inilalagay nina Leen Ritmeyer at karamihan ang Dakong Kabanal-banalan sa ibabaw ng bato sa ilalim ng Simboryo, na ang dambana ay sa silangan nito; nangatwiran si Asher Kaufman para sa isang lugar na mga 100 m sa hilaga, sa ilalim ng maliit na Simboryo ng mga Espiritu; tumitingin ang ilan sa timog, malapit sa bukal ng al-Kas. Walang natukoy sa itinayo ni Salomon; sa kay Herodes, ang mga pader, mga pintuan, inskripsiyon ng bumagsak na lugar ng pagpapatunog ng trumpeta at ang batong Griyego ng babala na nagbawal sa mga hentil sa panloob na bulwagan. Iniwan ng mga Bizantino ang Bundok na guho; pinili ng mga tagapagtayong Muslim ang bato, at ibinibigay ng inskripsiyong mosaiko ni Abd al-Malik sa loob ng Simboryo ang taong 72 ng Hijra, 691/692."
  da:
    - "På Tempelbjerget, Haram al-Sharif, i Jerusalems Gamleby: højen nord for Davidsbyen, som Krønikebøgerne kalder Morija-bjerget, hvor David købte jebusitten Aravnas tærskeplads. Salomos tempel stod der fra omkring 966 f.Kr., indtil babylonierne brændte det i 587 eller 586; det andet tempel fra 516 f.Kr.; Herodes den Store genopbyggede det fra omkring 20 f.Kr. på en platform på omkring 14 ha, hvis støttemure stadig står, Vestmuren iblandt dem, indtil romerne ødelagde det i 70 e.Kr. Klippedomen, bygget omkring 691/692 under kalif Abd al-Malik, er en helligdom, ikke en moské, bygget over den nøgne klippe på toppen; de fleste forskere mener, at Templets inderste helligdom stod på eller ved denne klippe."
    - "Krønikebøgerne siger, at »Salomo begyndte at bygge Herrens Hus i Jerusalem paa Moria Bjerg, hvor han havde aabenbaret sig for David, hans Fader, paa det Sted, som David havde beredt paa Ornans, Jebusitens, Tærskeplads«, og knytter dermed Templet til Morija-landet, hvor Abraham blev sendt for at ofre Isak. Kongebøgerne dater begyndelsen til »det fjerde Aar i Maaneden Siv, det er den anden Maaned, efter at Salomo var bleven Konge over Israel«. I evangelierne siger jøderne om Herodes' værk: »I seks og fyrretyve Aar er der bygget paa dette Tempel«, og Jesus svarer sine disciples beundring: »her skal ikke lades Sten paa Sten, som jo skal nedbrydes.«"
    - "Ingen udgravning er mulig på platformen, så Templets nøjagtige sted diskuteres ud fra klippen, Mishnahs mål og cisternerne. Leen Ritmeyer og de fleste andre placerer Det Allerhelligste over klippen under Domen, med alteret øst for den; Asher Kaufman argumenterede for et sted omkring 100 m mod nord, under den lille Åndernes Kuppel; nogle få ser mod syd, nær al-Kas-fontænen. Af Salomos bygning er intet identificeret; af Herodes' bygning kendes murene, portene, en faldet indskrift fra trompetstedet og den græske advarselssten, der udelukkede hedninger fra de indre forgårde. Byzantinerne lod bjerget ligge i ruiner; de muslimske bygherrer valgte klippen, og Abd al-Maliks mosaikindskrift inde i Domen angiver år 72 efter hidjra, 691/692."
  sr:
    - "На Храмовној гори, Харам еш Шарифу, у Старом граду Јерусалима: брду северно од Давидовог града које Летописи зову гором Морија, где је Давид купио гумно Орне Јевусејина. Соломунов Храм стајао је ту од око 966. п. н. е. док га Вавилонци нису спалили 587. или 586; Други храм од 516. п. н. е.; Ирод Велики га је обновио од око 20. п. н. е. на платформи од неких 14 ха чији потпорни зидови још стоје, међу њима Западни зид, док га Римљани нису разорили 70. н. е. Купола на стени, подигнута око 691/692. под калифом Абд ел Маликом, јесте светиња, а не џамија, изграђена над голом стеном на врху; већина научника држи да је унутрашња светиња Храма стајала на тој стени или поред ње."
    - "Летописи кажу: „И поче Соломун зидати дом Господњи у Јерусалиму на брду Морији, које би показано Давиду оцу његовом на месту које беше приправио Давид, на гумну Орнана Јевусејина“, и тако везују Храм за земљу Морију у коју је Аврам послан да принесе Исака. Књига о царевима датира почетак: „четврте године царовања Соломуновог над Израиљем, месеца Зифа, а то је други месец“. У Јеванђељима Јевреји о Иродовом делу кажу: „Четрдесет и шест година грађена је ова црква“, а Исус одговара на дивљење ученика: „неће остати овде ни камен на камену који се неће разметнути“."
    - "Ископавање на платформи није могуће, па се тачно место Храма расправља на основу стене, мера Мишне и цистерни. Лејн Ритмајер и већина осталих стављају Светињу над светињама над стену под Куполом, са олтаром источно од ње; Ашер Кауфман је заступао место око 100 м северније, под малом Куполом духова; неколицина гледа ка југу, близу чесме ел Кас. Од Соломунове градње ништа није идентификовано; од Иродове, зидови, капије, пали натпис са места трубљења и грчки натпис упозорења који је незнабошцима забрањивао унутрашња дворишта. Византинци су оставили Гору у рушевинама; муслимански градитељи изабрали су стену, а мозаички натпис Абд ел Малика унутар Куполе даје 72. годину хиџре, 691/692."
  hu:
    - "A Templomhegyen, a Haram es-Sarifon, Jeruzsálem Óvárosában: a Dávid városától északra fekvő dombon, amelyet a Krónikák Móriá hegyének nevez, ahol Dávid megvette Arauna, a jebuzeus szérűjét. Salamon temploma itt állt Kr. e. 966 körül kezdve, míg a babiloniak Kr. e. 587-ben vagy 586-ban fel nem égették; a második Templom Kr. e. 516-tól; Nagy Heródes Kr. e. 20 körül kezdve építette újjá egy mintegy 14 ha-os teraszon, amelynek támfalai, köztük a Nyugati Fal, ma is állnak, míg a rómaiak Kr. u. 70-ben el nem pusztították. A Sziklamecset, amelyet Kr. u. 691/692 körül építettek Abd al-Malik kalifa alatt, szentély, nem mecset, a csúcson lévő csupasz szikla fölé építve; a legtöbb kutató szerint a Templom legbelső szentélye azon a sziklán vagy mellette állt."
    - "A Krónikák szerint „Elkezdé építtetni Salamon az Úr házát Jeruzsálemben a Mórija hegyén, mely Dávidnak, az ő atyjának megmutattatott, azon a helyen, melyet készített vala Dávid a Jebuzeus Ornán szérűjén”, és így köti a Templomot Móriá földjéhez, ahová Ábrahámot Izsák feláldozására küldték. A Királyok könyve a kezdetet „Salamon Izráel felett való uralkodásának negyedik esztendejében, a Zif hónapban, mely a második hónap” időpontra teszi. Az evangéliumokban a zsidók Heródes munkájáról azt mondják: „Negyvenhat esztendeig épült ez a templom”, Jézus pedig tanítványai csodálkozására azt feleli: „Nem marad itt kő kövön, mely le nem romboltatik.”"
    - "A teraszon nem lehet ásni, ezért a Templom pontos helyét a sziklából, a Misna méreteiből és a ciszternákból vitatják. Leen Ritmeyer és a legtöbben a Szentek Szentjét a Sziklamecset alatti szikla fölé teszik, az oltárral keletre tőle; Asher Kaufman mintegy 100 m-rel északabbra érvelt, a kis Lelkek kupolája alatt; néhányan délre néznek, az el-Kasz kút közelébe. Salamon épületéből semmit sem azonosítottak; Heródesből a falakat, a kapukat, egy lehullott Trombitálás helye-feliratot és a görög figyelmeztető követ, amely a pogányokat kizárta a belső udvarokból. A bizánciak romban hagyták a hegyet; a muszlim építők a sziklát választották, Abd al-Malik mozaikfelirata a kupolában pedig a hidzsra 72. évét adja, Kr. u. 691/692-t."
  fi:
    - "Temppelivuorella, Haram al-Sharifilla, Jerusalemin Vanhassakaupungissa: kukkulalla Daavidin kaupungin pohjoispuolella, jota Aikakirjat kutsuvat Morianvuoreksi ja jossa Daavid osti jebusilaisen Araunan puimatantereen. Salomon temppeli seisoi siellä noin 966 eaa. alkaen, kunnes babylonialaiset polttivat sen vuonna 587 tai 586; Toinen temppeli 516 eaa. alkaen; Herodes Suuri rakensi sen uudelleen noin 20 eaa. alkaen noin 14 ha:n tasanteelle, jonka tukimuurit, Länsimuuri niiden joukossa, seisovat yhä, kunnes roomalaiset tuhosivat sen vuonna 70 jaa. Kalliomoskeija, rakennettu noin 691/692 kalifi Abd al-Malikin aikana, on pyhättö eikä moskeija, rakennettu huipulla olevan paljaan kallion päälle; useimmat tutkijat katsovat temppelin sisimmän pyhäkön seisoneen tuolla kalliolla tai sen vieressä."
    - "Aikakirjat sanovat, että ”Salomo alkoi rakentaa Herran temppeliä Jerusalemiin, Moorian vuorelle, jossa Herra oli ilmestynyt hänen isällensä Daavidille, siihen paikkaan, jonka Daavid oli valmistanut, jebusilaisen Ornanin puimatantereelle”, ja sitovat näin temppelin Morian maahan, johon Abraham lähetettiin uhraamaan Iisakia. Kuninkaiden kirjat ajoittavat alun ”neljäntenä vuotena siitä, kun Salomo oli tullut Israelin kuninkaaksi, alkoi hän siiv-kuussa, joka on toinen kuukausi”. Evankeliumeissa juutalaiset sanovat Herodeksen työstä: ”Neljäkymmentä kuusi vuotta on tätä temppeliä rakennettu”, ja Jeesus vastaa opetuslastensa ihailuun: ”tähän ei ole jäävä kiveä kiven päälle, maahan jaottamatta.”"
    - "Tasanteella ei ole mahdollista kaivaa, joten temppelin tarkka paikka päätellään kalliosta, Mishnan mitoista ja vesisäiliöistä. Leen Ritmeyer ja useimmat muut sijoittavat kaikkein pyhimmän Kupolin alla olevan kallion päälle ja alttarin sen itäpuolelle; Asher Kaufman puolusti paikkaa noin 100 m pohjoisempana, pienen Henkien kupolin alla; muutamat katsovat etelään, al-Kasin suihkulähteen lähelle. Salomon rakennuksesta ei ole tunnistettu mitään; Herodeksen rakennuksesta muurit, portit, kaatunut torvensoittopaikan kirjoitus ja kreikkalainen varoituskivi, joka esti pakanoita pääsemästä sisäpihoille. Bysanttilaiset jättivät vuoren raunioiksi; muslimirakentajat valitsivat kallion, ja Abd al-Malikin mosaiikkikirjoitus Kupolin sisällä antaa vuoden 72 hidžran, 691/692."
  vi:
    - "Trên núi Đền Thờ, Haram al-Sharif, trong Khu Phố Cổ ở Giê-ru-sa-lem: ngọn đồi phía bắc Thành Đa-vít mà sách Sử ký gọi là núi Mô-ri-a, nơi Đa-vít mua sân đạp lúa của A-rau-na người Giê-bu-sít. Đền Thờ Sa-lô-môn đứng đó từ khoảng 966 TCN cho đến khi người Ba-by-lôn đốt năm 587 hoặc 586; Đền Thờ thứ hai từ 516 TCN; Hê-rốt Đại đế xây lại từ khoảng 20 TCN trên một nền đài khoảng 14 ha mà các bức tường chắn còn đứng, trong đó có Bức tường phía Tây, cho đến khi người La Mã phá hủy năm 70. Dome of the Rock, xây khoảng 691/692 dưới thời caliph Abd al-Malik, là một đền thờ thánh chứ không phải nhà thờ Hồi giáo, xây trên tảng đá trần ở đỉnh; đa số học giả cho rằng đền thánh trong cùng của Đền Thờ đứng trên hoặc cạnh tảng đá ấy."
    - "Sách Sử ký nói rằng “Sa-lô-môn khởi cất đền Đức Giê-hô-va tại Giê-ru-sa-lem, trên núi Mô-ri-a, là nơi Đức Giê-hô-va đã hiện ra cùng Đa-vít, cha người, tại trên chỗ mà Đa-vít đã dọn, tức là trong sân đạp lúa của Ọt-na, người Giê-bu-sít”, và vì thế gắn Đền Thờ với xứ Mô-ri-a nơi Áp-ra-ham được sai dâng Y-sác. Sách Các Vua ghi niên đại khởi công vào “năm thứ tư của Sa-lô-môn trị vì trên Y-sơ-ra-ên, nhằm tháng Xíp, nghĩa là tháng thứ hai”. Trong các sách Phúc Âm, người Do Thái nói về công trình của Hê-rốt: “Người ta xây đền thờ nầy mất bốn mươi sáu năm”, và Giê-su đáp lời trầm trồ của các môn đồ: “đây sẽ không còn một hòn đá nào chồng trên một hòn khác mà không bị đổ xuống.”"
    - "Không thể khai quật trên nền đài, nên vị trí chính xác của Đền Thờ được lập luận từ tảng đá, các số đo của Mishnah và các bể chứa nước. Leen Ritmeyer và đa số khác đặt Nơi Chí Thánh trên tảng đá dưới mái vòm, với bàn thờ ở phía đông; Asher Kaufman lập luận cho một chỗ cách khoảng 100 m về phía bắc, dưới Dome of the Spirits nhỏ; vài người nhìn về phía nam, gần đài phun nước al-Kas. Về công trình của Sa-lô-môn chưa xác định được gì; về của Hê-rốt, có các tường, các cổng, một bia ký “nơi thổi kèn” đã đổ và bia cảnh báo bằng tiếng Hy Lạp cấm dân ngoại vào các sân trong. Người Byzantine để núi này đổ nát; các nhà xây Hồi giáo chọn tảng đá, và bia ký khảm của Abd al-Malik bên trong mái vòm cho năm 72 Hijra, 691/692."
  ro:
    - "Pe Muntele Templului, Haram al-Sharif, în Orașul Vechi al Ierusalimului: dealul de la nord de Cetatea lui David pe care Cronicile îl numesc Muntele Moria, unde David a cumpărat aria lui Aravna Iebusitul. Templul lui Solomon a stat acolo din circa 966 î.Hr. până când babilonienii l-au ars în 587 sau 586; al Doilea Templu din 516 î.Hr.; Irod cel Mare l-a reclădit din circa 20 î.Hr. pe o platformă de circa 14 ha ai cărei ziduri de sprijin încă stau, între ele Zidul de Vest, până când romanii l-au distrus în 70 d.Hr. Domul Stâncii, zidit circa 691/692 sub califul Abd al-Malik, este un sanctuar, nu o moschee, ridicat peste stânca goală de pe culme; cei mai mulți cercetători socotesc că sanctuarul cel mai dinăuntru al Templului stătea pe stânca aceea sau lângă ea."
    - "Cronicile spun că Solomon a început să zidească casa Domnului la Ierusalim, pe muntele Moria, unde Domnul i se arătase lui David, tatăl său, în locul pregătit de David la aria lui Ornan Iebusitul, și leagă astfel Templul de țara Moria unde Avraam fusese trimis să-l jertfească pe Isaac. Cartea Regilor datează începutul în anul al patrulea al domniei lui Solomon peste Israel, în luna Ziv, adică a doua lună. În Evanghelii, iudeii spun despre lucrarea lui Irod: „în patruzeci și șase de ani, s’a zidit biserica aceasta”, iar Isus răspunde admirației ucenicilor: „nu va rămâne aici piatră pre piatră, care să nu se risipească.”"
    - "Pe platformă nu este posibilă nicio săpătură, așa că locul exact al Templului se argumentează din stâncă, din măsurătorile Mișnei și din cisterne. Leen Ritmeyer și cei mai mulți alții pun Sfânta Sfintelor deasupra stâncii de sub Dom, cu altarul la est de ea; Așer Kaufman a susținut un loc la circa 100 m spre nord, sub micul Dom al Duhurilor; câțiva se uită spre sud, lângă fântâna al-Kas. Din zidirea lui Solomon nu s-a identificat nimic; din cea a lui Irod, zidurile, porțile, o inscripție căzută a locului trâmbițării și piatra greacă de avertizare care interzicea neamurilor accesul în curțile dinăuntru. Bizantinii au lăsat Muntele în ruină; constructorii musulmani au ales stânca, iar inscripția în mozaic a lui Abd al-Malik din interiorul Domului dă anul 72 al Hegirei, 691/692."
  bg:
    - "На Храмовия хълм, Харам аш-Шариф, в Стария град на Йерусалим: хълмът северно от Давидовия град, който Летописите наричат хълма Мория, където Давид купил гумното на Орна Иевусеца. Соломоновият храм стоял там от около 966 г. пр.н.е., докато вавилонците го изгорили през 587 или 586 г.; Вторият храм — от 516 г. пр.н.е.; Ирод Велики го преустроил от около 20 г. пр.н.е. върху платформа от около 14 ха, чиито подпорни стени още стоят, сред тях Западната стена, докато римляните го разрушили през 70 г. н.е. Скалният купол, построен около 691/692 г. при халиф Абд ал-Малик, е светилище, а не джамия, издигнато над голата скала на върха; повечето учени смятат, че най-вътрешното светилище на Храма е стояло върху тази скала или до нея."
    - "Летописите казват: „И начна Соломон да гради дома Господен в Ерусалим на хълма Мория, дето се яви Господ на Давида отца му, на мястото което приготви Давид в гумното на Орна Иевусеца“, и така свързват Храма със земята Мория, където Авраам бил пратен да принесе Исаак. Царе датира началото „в четвъртото лето на Соломоновото царуване над Израиля, в месец Зив, който е вторий месец“. В Евангелията юдеите казват за Иродовото дело: „За четиридесет и шест години е съграден този храм“, а Исус отговаря на възхищението на учениците си: „Нема да остане тука камик на камик който да се не съсипе.“"
    - "На платформата не са възможни разкопки, затова точното място на Храма се извежда от скалата, мерките на Мишна и цистерните. Лен Ритмайер и повечето други поставят Светая светих над скалата под Купола, с олтара източно от нея; Ашер Кауфман защитава място на около 100 м на север, под малкия Купол на духовете; малцина гледат на юг, близо до чешмата ал-Кас. От Соломоновата постройка нищо не е идентифицирано; от Иродовата — стените, портите, паднал надпис от мястото за тръбене и гръцкият предупредителен камък, който забранявал на езичниците да влизат във вътрешните дворове. Византийците оставили хълма в руини; мюсюлманските строители избрали скалата, а мозаечният надпис на Абд ал-Малик в Купола дава 72-ра година от хиджра, 691/692 г."
