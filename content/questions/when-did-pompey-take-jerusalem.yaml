# Draft question. The Bible does not tell the event; the scripture list gives the verses that show Roman rule as its result.
id: when-did-pompey-take-jerusalem
question:
  en: "When did Pompey take Jerusalem?"
  ru: "Когда Помпей взял Иерусалим?"
  uk: "Коли Помпей узяв Єрусалим?"
  es: "¿Cuándo tomó Pompeyo Jerusalén?"
  pt: "Quando Pompeu tomou Jerusalém?"
  de: "Wann nahm Pompeius Jerusalem ein?"
  fr: "Quand Pompée a-t-il pris Jérusalem ?"
  pl: "Kiedy Pompejusz zdobył Jerozolimę?"
  it: "Quando Pompeo prese Gerusalemme?"
  nl: "Wanneer nam Pompeius Jeruzalem in?"
  cs: "Kdy Pompeius dobyl Jeruzalém?"
  sv: "När intog Pompejus Jerusalem?"
  nb: "Når inntok Pompeius Jerusalem?"
  tl: "Kailan kinuha ni Pompeyo ang Jerusalem?"
  da: "Hvornår indtog Pompeius Jerusalem?"
answer:
  en:
    - "In 63 BC, in the third month of the siege, in the year Cicero was consul at Rome, as Josephus dates it; the Temple mount was stormed on a fast day, and Judea came under Rome, where it stayed. The map stands at Jerusalem in 63 BC."
    - "Pompey had just annexed Syria when the sons of Salome Alexandra, the high priest Hyrcanus II and his brother Aristobulus II, who had seized the throne, both came to him at Damascus in the spring of 63; a third embassy from the people asked him to abolish the kingship altogether. When Pompey marched on Jerusalem, Aristobulus's partisans held the Temple while Hyrcanus's party opened the city. The Romans raised their ramp on the north side, working on the sabbaths, when the defenders would fight only if attacked; the siege engines brought from Tyre broke the wall, and Josephus counts twelve thousand Jews killed, the priests cut down at the altar as they went on sacrificing. Pompey went into the Holy of Holies, which Tacitus says he found empty, but left the treasure and the next day ordered the Temple cleansed. Cassius Dio adds that the city fell on the day of Kronos, a Saturday."
    - "Hyrcanus was left high priest without the royal title; Aristobulus was carried to Rome and walked in Pompey's triumph in 61 BC. Judea paid tribute and lost the coast, Samaria and the Greek cities beyond the Jordan, which counted their years from this “Pompeian era”; captives brought to Italy and later freed made up much of the Jewish community of Rome. The Psalms of Solomon lament a foreign conqueror who broke the walls of Jerusalem and whose body later lay unburied on the shore of Egypt, as Pompey's did in 48 BC. The Bible does not tell the event, but it is the background of the Gospels: Daniel's fourth kingdom, “strong as iron”, was read by the Jews of Jesus's day as Rome; the council feared that “the Romans shall come and take away both our place and nation”; and the question of tribute to Caesar was answered, “Render therefore unto Caesar the things which are Caesar's”."
  ru:
    - "В 63 г. до н. э., на третьем месяце осады, в год консульства Цицерона в Риме, как датирует Иосиф Флавий; Храмовую гору взяли штурмом в день поста, и Иудея попала под власть Рима — и осталась под ней. Карта стоит на Иерусалиме в 63 г. до н. э."
    - "Помпей только что сделал Сирию римской провинцией, когда сыновья Саломеи Александры — первосвященник Гиркан II и его брат Аристобул II, захвативший престол, — оба явились к нему в Дамаск весной 63 г.; третье посольство, от народа, просило вовсе упразднить царскую власть. Когда Помпей двинулся на Иерусалим, сторонники Аристобула удерживали Храм, а партия Гиркана открыла город. Римляне возводили насыпь с северной стороны, работая по субботам, когда защитники сражались лишь при нападении; осадные машины, привезённые из Тира, проломили стену, и Иосиф Флавий насчитывает двенадцать тысяч убитых иудеев — священников рубили у жертвенника, когда те продолжали приносить жертвы. Помпей вошёл во Святое святых, которое, по Тациту, нашёл пустым, но не тронул сокровищ и на другой день велел очистить Храм. Дион Кассий добавляет, что город пал в день Кроноса, то есть в субботу."
    - "Гиркана оставили первосвященником без царского титула; Аристобула увезли в Рим, и он шёл в триумфе Помпея в 61 г. до н. э. Иудея платила дань и лишилась побережья, Самарии и греческих городов за Иорданом, которые с тех пор считали годы от «помпеевой эры»; пленники, привезённые в Италию и позже отпущенные на волю, составили большую часть иудейской общины Рима. Псалмы Соломона оплакивают чужеземного завоевателя, проломившего стены Иерусалима, чьё тело потом лежало непогребённым на египетском берегу, — как и случилось с Помпеем в 48 г. до н. э. Библия об этом событии не рассказывает, но оно стало фоном Евангелий: четвёртое царство Даниила, крепкое «как железо», иудеи времён Иисуса понимали как Рим; синедрион боялся, что «придут Римляне и овладеют и местом нашим и народом»; а на вопрос о подати кесарю был дан ответ: «отдавайте кесарево кесарю, а Божие Богу»."
  uk:
    - "63 р. до н. е., на третьому місяці облоги, в рік, коли Цицерон був консулом у Римі, як датує Йосиф Флавій; гору Храму взято штурмом у день посту, і Юдея потрапила під Рим, де й залишилася. Мапа стоїть в Єрусалимі 63 р. до н. е."
    - "Помпей щойно приєднав Сирію, коли сини Саломеї Александри, первосвященник Гіркан II та його брат Аристовул II, який захопив престол, обидва прийшли до нього в Дамаск навесні 63 р.; третє посольство від народу просило його скасувати царську владу взагалі. Коли Помпей рушив на Єрусалим, прихильники Аристовула тримали Храм, а партія Гіркана відчинила місто. Римляни звели свій насип з північного боку, працюючи в суботи, коли оборонці билися б лише у відповідь на напад; облогові машини, привезені з Тіру, пробили мур, і Йосиф Флавій нараховує дванадцять тисяч убитих євреїв, священиків, зарубаних при жертовнику, коли вони й далі приносили жертви. Помпей увійшов у Святе святих, яке, за Тацитом, знайшов порожнім, але залишив скарб і наступного дня звелів очистити Храм. Кассій Діон додає, що місто впало в день Кроноса, у суботу."
    - "Гіркан залишився первосвящеником без царського титулу; Аристовула відвезли до Рима, і він ішов у тріумфі Помпея 61 р. до н. е. Юдея платила данину й втратила узбережжя, Самарію та грецькі міста за Йорданом, які рахували свої роки від цієї «Помпеївої ери»; полонені, привезені в Італію й згодом звільнені, склали значну частину єврейської громади Рима. Псалми Соломона оплакують чужого завойовника, який зруйнував мури Єрусалиму й чиє тіло згодом лежало непохованим на березі Єгипту, як і Помпеєве 48 р. до н. е. Біблія цієї події не розповідає, але вона є тлом Євангелій: Данилове четверте царство, «міцне, як залїзо», євреї за днів Ісуса читали як Рим; рада боялася, що «прийдуть Римляне, та й заберуть у нас і місце і нарід»; а на питання про данину кесареві відповідь була: «Віддайте ж кесареве кесареві»."
  es:
    - "En el 63 a. C., en el tercer mes del asedio, en el año en que Cicerón era cónsul en Roma, según lo fecha Josefo; el monte del Templo fue tomado al asalto en un día de ayuno, y Judea pasó a Roma, bajo cuyo dominio permaneció. El mapa se sitúa en Jerusalén en el 63 a. C."
    - "Pompeyo acababa de anexionar Siria cuando los hijos de Salomé Alejandra, el sumo sacerdote Hircano II y su hermano Aristóbulo II, usurpador del trono, acudieron a él en Damasco en la primavera del 63; una tercera embajada del pueblo le pidió abolir por completo la monarquía. Cuando Pompeyo marchó a Jerusalén, los de Aristóbulo ocuparon el Templo y el partido de Hircano abrió la ciudad. Los romanos levantaron su rampa por el norte, trabajando en sábado, cuando los defensores solo combatían si eran atacados; las máquinas de asedio traídas de Tiro abrieron brecha en el muro, y Josefo cuenta doce mil judíos muertos, los sacerdotes degollados ante el altar mientras ofrecían sacrificios. Pompeyo entró en el Lugar Santísimo, que según Tácito halló vacío, pero dejó el tesoro y al día siguiente ordenó purificar el Templo. Dion Casio añade que cayó el día de Cronos, un sábado."
    - "Hircano quedó de sumo sacerdote sin título real; Aristóbulo fue llevado a Roma y desfiló en el triunfo de Pompeyo en el 61 a. C. Judea pagó tributo y perdió la costa, Samaria y las ciudades griegas al otro lado del Jordán, que contaron sus años desde esta «era pompeyana»; los cautivos llevados a Italia y luego liberados formaron gran parte de la judería romana. Los Salmos de Salomón lamentan a un conquistador extranjero que derribó los muros de Jerusalén y cuyo cuerpo yació sin sepultura en la costa de Egipto, como el de Pompeyo en el 48 a. C. La Biblia no lo cuenta, pero es trasfondo de los Evangelios: el cuarto reino de Daniel, «fuerte como hierro», los judíos de tiempos de Jesús lo leyeron como Roma; el concilio temía que «vendrán los Romanos, y quitarán nuestro lugar y la nación»; y a la cuestión del tributo se respondió: «Pagad pues á César lo que es de César»."
  pt:
    - "Em 63 a.C., no terceiro mês do cerco, no ano em que Cícero foi cônsul em Roma, como Josefo o data; o monte do Templo foi tomado de assalto num dia de jejum, e a Judeia passou a Roma, onde ficou. O mapa está em Jerusalém em 63 a.C."
    - "Pompeu acabara de anexar a Síria quando os filhos de Salomé Alexandra, o sumo sacerdote Hircano II e seu irmão Aristóbulo II, que tomara o trono, foram ambos a ele em Damasco, na primavera de 63; uma terceira delegação, do povo, pediu que abolisse a realeza. Quando Pompeu marchou sobre Jerusalém, os partidários de Aristóbulo ocuparam o Templo, enquanto o partido de Hircano abriu a cidade. Os romanos ergueram a rampa ao norte, trabalhando nos sábados, quando os defensores só lutavam se atacados; as máquinas de cerco trazidas de Tiro romperam o muro, e Josefo conta doze mil judeus mortos, os sacerdotes trucidados no altar enquanto continuavam a sacrificar. Pompeu entrou no Santo dos Santos, que segundo Tácito achou vazio, mas deixou o tesouro e no dia seguinte mandou purificar o Templo. Díon Cássio acrescenta que a cidade caiu no dia de Cronos, um sábado."
    - "Hircano ficou como sumo sacerdote sem o título real; Aristóbulo foi levado a Roma e desfilou no triunfo de Pompeu em 61 a.C. A Judeia pagou tributo e perdeu a costa, Samaria e as cidades gregas além do Jordão, que contaram seus anos dessa “era pompeiana”; cativos levados à Itália e depois libertados formaram boa parte da comunidade judaica de Roma. Os Salmos de Salomão lamentam um conquistador estrangeiro que rompeu os muros de Jerusalém e cujo corpo jazeu depois insepulto na praia do Egito, como o de Pompeu em 48 a.C. A Bíblia não conta o fato, mas ele é o pano de fundo dos Evangelhos: o quarto reino de Daniel, “forte como o ferro”, era lido pelos judeus do tempo de Jesus como Roma; o conselho temia que “os romanos virão e tirarão tanto o nosso lugar quanto a nossa nação”; e a questão do tributo a César foi respondida: “Deem, portanto, a César o que é de César”."
  de:
    - "Im Jahr 63 v. Chr., im dritten Monat der Belagerung, in dem Jahr, in dem Cicero in Rom Konsul war, wie Josephus datiert; der Tempelberg wurde an einem Fasttag gestürmt, und Judäa kam unter Rom, wo es blieb. Die Karte steht 63 v. Chr. bei Jerusalem."
    - "Pompeius hatte eben Syrien annektiert, als im Frühjahr 63 die Söhne der Salome Alexandra, Hyrkanos II., der Hohepriester, und sein Bruder Aristobul II., der den Thron an sich gerissen hatte, zu ihm nach Damaskus kamen; eine dritte Gesandtschaft des Volkes bat um die völlige Abschaffung des Königtums. Als Pompeius gegen Jerusalem zog, hielten Aristobuls Anhänger den Tempel, während Hyrkanos' Partei die Stadt öffnete. Die Römer schütteten ihre Rampe im Norden auf und arbeiteten sabbats, wenn die Verteidiger nur kämpften, falls man sie angriff; Maschinen aus Tyrus brachen die Mauer, und Josephus zählt zwölftausend getötete Juden, darunter Priester, die am Altar weiter opferten. Pompeius betrat das Allerheiligste, das er nach Tacitus leer fand, ließ aber den Schatz unberührt und am nächsten Tag den Tempel reinigen. Cassius Dio: Die Stadt fiel am Tag des Kronos, einem Samstag."
    - "Hyrkanos blieb Hohepriester ohne Königstitel; Aristobul zog, nach Rom gebracht, 61 v. Chr. in Pompeius' Triumph mit. Judäa zahlte Tribut und verlor die Küste, Samaria und die griechischen Städte jenseits des Jordan, die ihre Jahre nach dieser „pompejanischen Ära“ zählten; nach Italien gebrachte und später freigelassene Gefangene bildeten einen großen Teil der jüdischen Gemeinde Roms. Die Psalmen Salomos beklagen einen fremden Eroberer, der die Mauern Jerusalems brach und dessen Leib später unbestattet am Strand Ägyptens lag, wie Pompeius 48 v. Chr. Die Bibel erzählt es nicht, doch es ist der Hintergrund der Evangelien: Daniels viertes Reich – „das vierte wird hart sein wie Eisen“ – las man zur Zeit Jesu als Rom; der Rat fürchtete, „so kommen dann die Römer und nehmen uns Land und Leute“; und auf die Zinsfrage hieß es: „So gebet dem Kaiser, was des Kaisers ist“."
  fr:
    - "En 63 av. J.-C., au troisième mois du siège, l’année où Cicéron était consul à Rome, selon la date de Josèphe ; le mont du Temple fut pris d’assaut un jour de jeûne, et la Judée passa sous Rome, où elle resta. La carte se place à Jérusalem en 63 av. J.-C."
    - "Pompée venait d’annexer la Syrie quand les fils de Salomé Alexandra, le grand prêtre Hyrcan II et son frère Aristobule II, qui s’était emparé du trône, vinrent le trouver à Damas au printemps de 63 ; une troisième ambassade du peuple lui demanda d’abolir la royauté. Quand Pompée marcha sur Jérusalem, les partisans d’Aristobule tinrent le Temple tandis que le parti d’Hyrcan ouvrait la ville. Les Romains dressèrent leur rampe du côté nord, travaillant les jours de sabbat, où les défenseurs ne combattaient que si on les attaquait ; les machines de siège venues de Tyr firent brèche, et Josèphe compte douze mille Juifs tués, les prêtres abattus à l’autel continuant de sacrifier. Pompée entra dans le Saint des saints, que Tacite dit vide, mais laissa le trésor et fit purifier le Temple le lendemain. Dion Cassius ajoute que la ville tomba le jour de Cronos, un samedi."
    - "Hyrcan resta grand prêtre sans la couronne ; Aristobule, emmené à Rome, défila au triomphe de Pompée en 61 av. J.-C. La Judée paya tribut, perdit la côte, la Samarie et les villes grecques au-delà du Jourdain, qui datèrent leurs années de cette « ère pompéienne » ; des captifs amenés en Italie puis libérés formèrent une grande part de la communauté juive de Rome. Les Psaumes de Salomon déplorent un conquérant étranger qui brisa les murailles de Jérusalem et dont le corps resta sans sépulture sur la côte d’Égypte, comme celui de Pompée en 48 av. J.-C. La Bible ne le raconte pas, mais il est l’arrière-plan des Évangiles : le quatrième royaume de Daniel, « fort comme du fer », était Rome pour les Juifs du temps de Jésus ; le conseil craignait : « les Romains viendront détruire et notre ville et notre nation » ; sur le tribut : « Rendez donc à César ce qui est à César »."
  pl:
    - "W 63 p.n.e., w trzecim miesiącu oblężenia, w roku, w którym Cyceron był konsulem w Rzymie, jak datuje to Józef Flawiusz; wzgórze Świątyni zdobyto szturmem w dzień postu, a Judea znalazła się pod władzą Rzymu, pod którą pozostała. Mapa stoi w Jerozolimie w 63 p.n.e."
    - "Pompejusz właśnie zaanektował Syrię, gdy synowie Salome Aleksandry, arcykapłan Hirkan II i jego brat Arystobul II, który zagarnął tron, przybyli obaj do niego do Damaszku wiosną 63; trzecie poselstwo od ludu prosiło go o zniesienie władzy królewskiej w ogóle. Gdy Pompejusz ruszył na Jerozolimę, zwolennicy Arystobula trzymali Świątynię, podczas gdy stronnictwo Hirkana otworzyło miasto. Rzymianie wznieśli wał od strony północnej, pracując w szabaty, gdy obrońcy walczyli tylko wtedy, gdy ich zaatakowano; machiny oblężnicze sprowadzone z Tyru przebiły mur, a Józef Flawiusz liczy dwanaście tysięcy zabitych Żydów, kapłanów powalonych przy ołtarzu, gdy nadal składali ofiary. Pompejusz wszedł do Miejsca Najświętszego, które według Tacyta zastał puste, ale zostawił skarb i następnego dnia kazał oczyścić Świątynię. Kasjusz Dion dodaje, że miasto padło w dzień Kronosa, w sobotę."
    - "Hirkan pozostał arcykapłanem bez tytułu królewskiego; Arystobula zabrano do Rzymu i szedł w triumfie Pompejusza w 61 p.n.e. Judea płaciła daninę i straciła wybrzeże, Samarię i greckie miasta za Jordanem, które liczyły lata od tej „ery pompejańskiej”; jeńcy sprowadzeni do Italii i później uwolnieni stworzyli znaczną część gminy żydowskiej w Rzymie. Psalmy Salomona opłakują obcego zdobywcę, który zburzył mury Jerozolimy i którego ciało później leżało niepochowane na brzegu Egiptu, tak jak ciało Pompejusza w 48 p.n.e. Biblia nie opowiada tego wydarzenia, ale jest ono tłem Ewangelii: czwarte królestwo Daniela, „mocne jako żelazo”, Żydzi czasów Jezusa odczytywali jako Rzym; rada obawiała się, że „przyjdą Rzymianie, a wezmą nam to miejsce nasze i lud”; a na pytanie o daninę dla cesarza odpowiedziano: „Oddawajcież tedy, co jest cesarskiego, cesarzowi”."
  it:
    - "Nel 63 a.C., nel terzo mese dell’assedio, nell’anno in cui Cicerone era console a Roma, come lo data Giuseppe Flavio; il monte del Tempio fu preso d’assalto in un giorno di digiuno, e la Giudea passò sotto Roma, dove restò. La mappa si trova a Gerusalemme nel 63 a.C."
    - "Pompeo aveva appena annesso la Siria quando i figli di Salome Alessandra, il sommo sacerdote Ircano II e suo fratello Aristobulo II, che aveva preso il trono, vennero entrambi da lui a Damasco nella primavera del 63; una terza ambasceria popolare chiese di abolire del tutto la monarchia. Quando Pompeo marciò su Gerusalemme, i seguaci di Aristobulo tennero il Tempio, quelli di Ircano aprirono la città. I Romani innalzarono la rampa a nord, lavorando di sabato, quando i difensori combattevano solo se attaccati; le macchine portate da Tiro aprirono una breccia, e Giuseppe Flavio conta 12.000 Giudei uccisi, i sacerdoti abbattuti all’altare mentre continuavano a sacrificare. Pompeo entrò nel Santo dei Santi, che secondo Tacito trovò vuoto, ma lasciò il tesoro e l’indomani fece purificare il Tempio. Per Cassio Dione la città cadde nel giorno di Crono, un sabato."
    - "Ircano fu lasciato sommo sacerdote senza il titolo regale; Aristobulo fu portato a Roma e sfilò nel trionfo di Pompeo nel 61 a.C. La Giudea pagò tributo e perse la costa, Samaria e le città greche oltre il Giordano, che contarono i loro anni da questa «era pompeiana»; i prigionieri portati in Italia e poi liberati formarono gran parte della comunità ebraica di Roma. I Salmi di Salomone lamentano un conquistatore straniero che abbatté le mura di Gerusalemme e il cui corpo giacque poi insepolto sulla riva dell’Egitto, come quello di Pompeo nel 48 a.C. La Bibbia non lo racconta, ma è lo sfondo dei Vangeli: il quarto regno di Daniele, «forte come il ferro», fu letto dai Giudei ai tempi di Gesù come Roma; il Sinedrio temeva che «i Romani verranno e ci distruggeranno e città e nazione»; e sul tributo a Cesare fu risposto: «Rendete dunque a Cesare quel ch’è di Cesare»."
  nl:
    - "In 63 v.Chr., in de derde maand van het beleg, in het jaar dat Cicero consul te Rome was, zoals Josephus het dateert; de tempelberg werd bestormd op een vastendag, en Judea kwam onder Rome, waar het bleef. De kaart staat bij Jeruzalem in 63 v.Chr."
    - "Pompeius had Syrië net ingelijfd toen Salome Alexandra’s zonen, hogepriester Hyrcanus II en zijn broer Aristobulus II, die de troon had gegrepen, in de lente van 63 beiden bij hem in Damascus kwamen; een derde gezantschap, van het volk, vroeg afschaffing van het koningschap. Toen hij tegen Jeruzalem optrok, hielden Aristobulus’ aanhangers de tempel bezet en opende Hyrcanus’ partij de stad. De Romeinen wierpen hun helling op aan de noordkant en werkten op sabbat, wanneer de verdedigers alleen terugvochten; de werktuigen uit Tyrus braken de muur, en Josephus telt twaalfduizend gedode Joden, onder wie priesters die bij het offeren aan het altaar werden neergehouwen. Pompeius ging het Allerheiligste in, dat volgens Tacitus leeg was, liet de schat ongemoeid en de tempel de volgende dag reinigen. Volgens Cassius Dio viel de stad op de dag van Kronos, een zaterdag."
    - "Hyrcanus bleef hogepriester zonder koningstitel; Aristobulus liep in 61 v.Chr. in Rome mee in Pompeius’ triomftocht. Judea betaalde schatting en verloor de kust, Samaria en de Griekse steden over de Jordaan, die hun jaren telden vanaf deze “Pompeiaanse jaartelling”; naar Italië gebrachte, later vrijgelaten gevangenen vormden een groot deel van Rome’s Joodse gemeenschap. De Psalmen van Salomo bewenen een vreemde veroveraar die Jeruzalems muren brak en wiens lijk later onbegraven aan de kust van Egypte lag, zoals dat van Pompeius in 48 v.Chr. De Bijbel vertelt het niet, maar het is de achtergrond van de Evangeliën: Daniëls vierde koninkrijk, “hard … gelijk ijzer”, lazen Joden in Jezus’ tijd als Rome; de raad vreesde dat “de Romeinen zullen komen, en wegnemen beide onze plaats en volk”; en de schattingsvraag kreeg tot antwoord: “Geeft dan den keizer, dat des keizers is”."
  cs:
    - "Roku 63 př. n. l., ve třetím měsíci obléhání, v roce, kdy byl Cicero konzulem v Římě, jak jej datuje Josephus Flavius; Chrámová hora byla dobyta v postní den a Judsko přešlo pod Řím, kde zůstalo. Mapa stojí u Jeruzaléma v roce 63 př. n. l."
    - "Pompeius právě připojil Sýrii, když k němu na jaře roku 63 do Damašku přišli synové Salome Alexandry, velekněz Hyrkanos II. a jeho bratr Aristobúlos II., který se zmocnil trůnu; třetí poselstvo lidu žádalo, aby královskou hodnost zrušil úplně. Když Pompeius táhl na Jeruzalém, Aristobúlovi stoupenci drželi chrám, zatímco Hyrkanova strana město otevřela. Římané zvedli násep na severní straně a pracovali o sobotách, kdy se obránci bránili, jen když byli napadeni; obléhací stroje přivezené z Týru prolomily hradbu a Josephus Flavius počítá dvanáct tisíc zabitých Židů, kněží pokosených u oltáře, jak dále obětovali. Pompeius vstoupil do Nejsvětější svatyně, kterou podle Tacita našel prázdnou, ale poklad nechal a příštího dne nařídil chrám očistit. Cassius Dio dodává, že město padlo v den Kronův, v sobotu."
    - "Hyrkanos zůstal veleknězem bez královského titulu; Aristobúlos byl odvezen do Říma a kráčel v Pompeiově triumfu roku 61 př. n. l. Judsko platilo tribut a ztratilo pobřeží, Samaří a řecká města za Jordánem, která počítala roky od této „pompeiovské éry“; zajatci přivedení do Itálie a později propuštění tvořili velkou část židovské obce v Římě. Šalomounovy žalmy naříkají nad cizím dobyvatelem, který prolomil hradby Jeruzaléma a jehož tělo později leželo nepohřbeno na břehu Egypta, jako Pompeiovo roku 48 př. n. l. Bible událost nevypráví, ale je pozadím evangelií: Danielovo čtvrté království, „tvrdé jako železo“, vykládali Židé Ježíšovy doby jako Řím; rada se bála, že „přijdou Římané, a odejmou místo naše i lid“; a na otázku o dani císaři bylo odpovězeno: „Dejtež, co jest císařova, císaři.“"
  sv:
    - "År 63 f.Kr., i belägringens tredje månad, det år då Cicero var konsul i Rom, enligt Josefus datering; tempelberget stormades på en fastedag, och Judeen kom under Rom, där det förblev. Kartan står vid Jerusalem år 63 f.Kr."
    - "Pompejus hade just annekterat Syrien när Salome Alexandras söner, översteprästen Hyrkanos II och hans bror Aristobulos II, som hade tagit tronen, båda kom till honom i Damaskus våren 63; en tredje delegation från folket bad honom avskaffa kungadömet helt. När Pompejus tågade mot Jerusalem höll Aristobulos anhängare templet medan Hyrkanos parti öppnade staden. Romarna reste sin ramp på norra sidan och arbetade på sabbaterna, då försvararna bara stred om de angreps; de belägringsmaskiner som hämtats från Tyros bröt muren, och Josefus räknar tolv tusen dödade judar, prästerna nedhuggna vid altaret medan de fortsatte att offra. Pompejus gick in i det allra heligaste, som Tacitus säger att han fann tomt, men lät skatten vara och beordrade nästa dag att templet skulle renas. Cassius Dio tillägger att staden föll på Kronos dag, en lördag."
    - "Hyrkanos lämnades som överstepräst utan kunglig titel; Aristobulos fördes till Rom och gick i Pompejus triumftåg 61 f.Kr. Judeen betalade tribut och förlorade kusten, Samaria och de grekiska städerna bortom Jordan, som räknade sina år från denna ”pompeianska era”; fångar som fördes till Italien och senare frigavs utgjorde en stor del av Roms judiska samfund. Salomos psalmer begråter en utländsk erövrare som bröt Jerusalems murar och vars kropp senare låg obegravd på Egyptens strand, som Pompejus gjorde 48 f.Kr. Bibeln berättar inte händelsen, men den är evangeliernas bakgrund: Daniels fjärde rike, ”starkt såsom järn”, lästes av Jesu tids judar som Rom; rådet fruktade att ”romarna komma då att taga ifrån oss både land och folk”; och frågan om skatt till kejsaren besvarades: ”Så given då kejsaren vad kejsaren tillhör”."
  nb:
    - "I 63 f.Kr., i den tredje måneden av beleiringen, i året da Cicero var konsul i Roma, slik Josefus daterer det; tempelhøyden ble stormet på en fastedag, og Judea kom under Roma, hvor det ble. Kartet står ved Jerusalem i 63 f.Kr."
    - "Pompeius hadde nettopp annektert Syria da sønnene til Salome Alexandra, øverstepresten Hyrkan II og broren Aristobulos II, som hadde grepet tronen, begge kom til ham i Damaskus våren 63; en tredje delegasjon fra folket ba ham avskaffe kongedømmet helt. Da Pompeius marsjerte mot Jerusalem, holdt Aristobulos' tilhengere tempelet, mens Hyrkans parti åpnet byen. Romerne reiste sin rampe på nordsiden og arbeidet på sabbatene, da forsvarerne bare kjempet hvis de ble angrepet; beleiringsmaskinene brakt fra Tyros brøt muren, og Josefus teller tolv tusen drepte jøder, prestene hogd ned ved alteret mens de fortsatte å ofre. Pompeius gikk inn i Det aller helligste, som ifølge Tacitus var tomt, men lot skatten ligge og påbød dagen etter at tempelet skulle renses. Cassius Dio tilføyer at byen falt på Kronos' dag, en lørdag."
    - "Hyrkan ble igjen som øversteprest uten kongetittel; Aristobulos ble ført til Roma og gikk i Pompeius' triumftog i 61 f.Kr. Judea betalte tributt og mistet kysten, Samaria og de greske byene hinsides Jordan, som regnet sine år fra denne «pompeianske æra»; fanger brakt til Italia og senere frigitt utgjorde en stor del av det jødiske samfunnet i Roma. Salomos salmer klager over en fremmed erobrer som brøt ned murene i Jerusalem og hvis kropp senere lå ubegravet på stranden i Egypt, slik Pompeius' gjorde i 48 f.Kr. Bibelen forteller ikke hendelsen, men den er bakgrunnen for evangeliene: Daniels fjerde rike, «sterkt som jernet», ble lest av jødene på Jesu tid som Roma; rådet fryktet at «romerne vil komme og ta både vårt sted og vårt folk»; og spørsmålet om skatt til keiseren ble besvart: «Gi da keiseren hvad keiserens er»."
  tl:
    - "Noong 63 BK, sa ikatlong buwan ng pagkubkob, sa taong konsul sa Roma si Ciceron, ayon sa pagtatakda ni Josephus; sinalakay ang bundok ng Templo sa isang araw ng pag-aayuno, at napasailalim ang Judea sa Roma, kung saan ito nanatili. Ang mapa ay nasa Jerusalem noong 63 BK."
    - "Kasasama ni Pompeyo sa Siria nang sumadya sa kaniya sa Damasco, tagsibol ng 63, ang magkapatid na anak ni Salome Alejandra, ang mataas na saserdoteng si Hircano II at si Aristobulo II, na umagaw ng trono; humiling ang ikatlong delegasyon ng bayan na buwagin ang pagkahari. Pagmartsa ni Pompeyo sa Jerusalem, hawak ng kampon ni Aristobulo ang Templo at binuksan ng pangkat ni Hircano ang lungsod. Nagrampa ang Romano sa hilaga tuwing sabbath, kung kailan lalaban lamang ang tagapagtanggol kapag sinalakay; sinira ng mga makinang pangkubkob mula sa Tiro ang pader; 12,000 Judio ang napatay ayon kay Josephus, pati saserdoteng pinaslang sa dambana habang naghahandog. Pumasok siya sa Dakong Kabanal-banalan, walang laman ayon kay Tacito, ngunit iniwan ang kayamanan at ipinalinis kinabukasan ang Templo. Sabi ni Cassius Dio, bumagsak ito sa araw ni Kronos, isang Sabado."
    - "Si Hircano ay naiwang mataas na saserdote na walang titulong hari; si Aristobulo ay lumakad sa tagumpay ni Pompeyo sa Roma (61 BK). Nagtributo ang Judea at nawalan ng baybayin, Samaria at lungsod na Griyego sa kabila ng Jordan, na nagbilang ng taon mula sa “panahong Pompeyano”; ang karamihan ng pamayanang Judio ng Roma ay mga bihag na dinala sa Italia at pinalaya kalaunan. Nananaghoy ang Mga Awit ni Salomon sa dayuhang bumasag sa pader ng Jerusalem at nahandusay nang di nalibing sa baybayin ng Egipto, gaya ni Pompeyo (48 BK). Wala sa Biblia, ngunit likuran ito ng mga Ebanghelyo: ang ika-4 na kaharian ni Daniel, “matibay na parang bakal”, ay Roma sa mga Judio noon; takot ng sanedrin na “magsisiparito ang mga Romano at pagkukunin ang ating kinaroroonan at gayon din naman ang ating bansa”; sa tanong sa buwis kay Cesar: “ibigay ninyo kay Cesar ang sa kay Cesar”."
  da:
    - "I 63 f.Kr., i belejringens tredje måned, i det år Cicero var konsul i Rom, som Josefus dater det; Tempelbjerget blev stormet på en fastedag, og Judæa kom under Rom, hvor det forblev. Kortet står ved Jerusalem i 63 f.Kr."
    - "Pompeius havde netop annekteret Syrien, da Salome Alexandras sønner, ypperstepræsten Hyrkan II og hans bror Aristobul II, som havde grebet tronen, begge kom til ham i Damaskus i foråret 63; en tredje delegation fra folket bad ham afskaffe kongedømmet helt. Da Pompeius marcherede mod Jerusalem, holdt Aristobuls tilhængere Templet, mens Hyrkans parti åbnede byen. Romerne rejste deres rampe på nordsiden og arbejdede på sabbatterne, når forsvarerne kun ville kæmpe, hvis de blev angrebet; belejringsmaskinerne fra Tyrus brød muren, og Josefus tæller tolv tusinde dræbte jøder, præsterne nedhugget ved alteret, mens de fortsatte med at ofre. Pompeius gik ind i Det Allerhelligste, som ifølge Tacitus var tomt, men lod skatten urørt og befalede næste dag Templet renset. Cassius Dio tilføjer, at byen faldt på Kronos' dag, en lørdag."
    - "Hyrkan blev efterladt som ypperstepræst uden kongetitel; Aristobul blev ført til Rom og gik i Pompeius' triumf i 61 f.Kr. Judæa betalte tribut og mistede kysten, Samaria og de græske byer hinsides Jordan, som regnede deres år fra denne »pompejanske æra«; fanger, ført til Italien og senere frigivet, udgjorde en stor del af det jødiske samfund i Rom. Salomos Salmer jamrer over en fremmed erobrer, som brød Jerusalems mure, og hvis lig senere lå ubegravet på Egyptens kyst, ligesom Pompeius' gjorde i 48 f.Kr. Bibelen fortæller ikke begivenheden, men den er baggrunden for evangelierne: Daniels fjerde rige, »stærkt som Jernet«, blev af Jesu tids jøder læst som Rom; rådet frygtede, at »Romerne ville komme og tage baade vort Land og Folk«; og spørgsmålet om skat til kejseren blev besvaret: »Saa giver Kejseren, hvad Kejserens er«."
