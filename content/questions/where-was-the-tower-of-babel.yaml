id: where-was-the-tower-of-babel
question:
  en: "Where was the Tower of Babel?"
  ru: "Где была Вавилонская башня?"
  uk: "Де була Вавилонська вежа?"
  es: "¿Dónde estaba la torre de Babel?"
  pt: "Onde ficava a Torre de Babel?"
  de: "Wo stand der Turm zu Babel?"
  fr: "Où se trouvait la tour de Babel ?"
  pl: "Gdzie stała Wieża Babel?"
  it: "Dov’era la Torre di Babele?"
  cs: "Kde stála Babylonská věž?"
  nl: "Waar stond de toren van Babel?"
  sv: "Var låg Babels torn?"
  nb: "Hvor lå Babels tårn?"
  tl: "Nasaan ang Tore ng Babel?"
  da: "Hvor lå Babels tårn?"
  sr: "Где је била Вавилонска кула?"
  hu: "Hol volt a bábeli torony?"
  fi: "Missä Baabelin torni sijaitsi?"
  vi: "Tháp Ba-bên ở đâu?"
  ro: "Unde se afla Turnul Babel?"
  bg: "Къде се е намирала Вавилонската кула?"
answer:
  en:
    - "Genesis places the tower in the land of Shinar, that is Babylonia, and names the city Babel, which is the Hebrew name of Babylon; the map point stands at Babylon on the Euphrates, south of Baghdad in Iraq and about 870 km from Jerusalem in a straight line."
    - "The story says that the builders, “as they journeyed from the east”, “found a plain in the land of Shinar; and they dwelt there”, and that they used baked brick and bitumen, the materials of Mesopotamian building: “let us build us a city and a tower, whose top may reach unto heaven.” Genesis 10 names Babel first among the cities of Nimrod in Shinar. Babylon's great temple-tower, the ziggurat Etemenanki, “house of the foundation of heaven and earth”, stood beside the temple of Marduk; Herodotus describes it as a tower of eight stages, and Nebuchadnezzar II rebuilt it in the sixth century BC. Most scholars think the story has this ziggurat, or an earlier one on the same site, in view."
    - "Only the outline of the foundations of Etemenanki survives, a square of about 90 m a side, because Alexander the Great had the ruined stages cleared for a rebuilding that never came. Since the Middle Ages travellers have also been shown the ziggurat of Borsippa, Birs Nimrud, south-west of Babylon, whose vitrified summit looks like a tower struck by fire; in the twelfth century Benjamin of Tudela described a Tower of Babel near Hillah split by fire from heaven, most likely this one. Genesis gives no date, and the map does not fix one."
  ru:
    - "Бытие помещает башню в земле Сеннаар, то есть в Вавилонии, и называет город Вавилоном: Бавел — еврейское имя Вавилона; точка на карте стоит у Вавилона на Евфрате, к югу от Багдада в Ираке, примерно в 870 км от Иерусалима по прямой."
    - "Рассказ говорит о строителях: «Двинувшись с востока, они нашли в земле Сеннаар равнину и поселились там», — и что строили из обожжённого кирпича и земляной смолы — материалов месопотамских построек: «построим себе город и башню, высотою до небес». Бытие 10 называет Вавилон первым среди городов Нимрода в Сеннааре. Великая храмовая башня Вавилона, зиккурат Этеменанки, «дом основания неба и земли», стояла рядом с храмом Мардука; Геродот описывает её как башню в восемь ярусов, а Навуходоносор II отстроил её в VI веке до н. э. Большинство учёных считают, что рассказ имеет в виду этот зиккурат или более ранний на том же месте."
    - "От Этеменанки уцелел лишь контур основания — квадрат со стороной около 90 м: Александр Македонский велел разобрать обветшавшие ярусы для перестройки, которая так и не состоялась. Со Средних веков путешественникам показывали и зиккурат Борсиппы, Бирс-Нимруд, к юго-западу от Вавилона, чья оплавленная вершина похожа на башню, поражённую огнём; Вениамин Тудельский в XII веке описал близ Хиллы Вавилонскую башню, расколотую огнём с неба, — скорее всего, эту. Бытие не называет даты, и карта её не задаёт."
  uk:
    - "Книга Буття поміщає вежу в землі Сеннаар, тобто у Вавилонії, і називає місто Бабель, що є єврейською назвою Вавилона; точка на мапі стоїть на Вавилоні на Євфраті, на південь від Багдада в Іраку, приблизно за 870 км від Єрусалима по прямій."
    - "Оповідь каже, що будівничі, «як мандрували вони від схід сонця», «знайшли поділлє в Синеяр землї, та й осїлись там», і що вони користувалися випаленою цеглою та бітумом, матеріалами месопотамського будівництва: «Нумо споруджувати місто із баштою, щоб її верх був до небес». Книга Буття 10 називає Бабель першим серед міст Німрода в Сеннаарі. Великий храм-вежа Вавилона, зіґурат Етеменанкі, «дім основи неба і землі», стояв поруч із храмом Мардука; Геродот описує його як вежу з восьми ярусів, а Навуходоносор II відбудував його у VI ст. до н. е. Більшість учених вважають, що оповідь має на увазі цей зіґурат або давніший на тому ж місці."
    - "Збереглися лише обриси фундаментів Етеменанкі, квадрат зі стороною близько 90 м, бо Александр Великий велів розчистити зруйновані яруси для відбудови, якої так і не сталося. Від Середньовіччя мандрівникам показували також зіґурат Борсіппи, Бірс-Німруд, на південний захід від Вавилона, чия зіскловрена вершина виглядає як вежа, вражена вогнем; у XII ст. Веніамін Тудельський описав Вавилонську вежу біля Хілли, розколоту вогнем з неба, найімовірніше, саме цю. Книга Буття не подає дати, і мапа її не фіксує."
  es:
    - "El Génesis sitúa la torre en la tierra de Sinar, es decir, Babilonia, y nombra la ciudad Babel, que es el nombre hebreo de Babilonia; el punto del mapa está en Babilonia, junto al Éufrates, al sur de Bagdad, en Irak, y a unos 870 km de Jerusalén en línea recta."
    - "El relato dice que los constructores, «como se partieron de oriente», «hallaron una vega en la tierra de Shinar, y asentaron allí», y que usaron ladrillo cocido y betún, los materiales de la construcción mesopotámica: «edifiquémonos una ciudad y una torre, cuya cúspide llegue al cielo». Génesis 10 nombra a Babel en primer lugar entre las ciudades de Nimrod en Sinar. La gran torre-templo de Babilonia, el zigurat Etemenanki, «casa del fundamento del cielo y de la tierra», se alzaba junto al templo de Marduk; Heródoto lo describe como una torre de ocho cuerpos, y Nabucodonosor II lo reconstruyó en el siglo VI a. C. La mayoría de los estudiosos piensan que el relato tiene a la vista este zigurat, u otro anterior en el mismo lugar."
    - "Solo sobrevive el trazado de los cimientos de Etemenanki, un cuadrado de unos 90 m de lado, porque Alejandro Magno hizo despejar los cuerpos en ruinas para una reconstrucción que nunca llegó. Desde la Edad Media también se ha mostrado a los viajeros el zigurat de Borsipa, Birs Nimrud, al suroeste de Babilonia, cuya cima vitrificada parece una torre herida por el fuego; en el siglo XII Benjamín de Tudela describió una torre de Babel cerca de Hilla, hendida por fuego del cielo, muy probablemente esta. El Génesis no da fecha, y el mapa no fija ninguna."
  pt:
    - "O Gênesis situa a torre na terra de Sinar, isto é, a Babilônia, e nomeia a cidade Babel, que é o nome hebraico de Babilônia; o ponto do mapa fica em Babilônia, no Eufrates, ao sul de Bagdá, no Iraque, a cerca de 870 km de Jerusalém em linha reta."
    - "A história diz que os construtores, “Ao viajarem para o oriente, encontraram uma planície na terra de Sinar, e ali habitaram”, e que usaram tijolo cozido e betume, os materiais da construção mesopotâmica: “vamos construir para nós uma cidade e uma torre cujo topo chegue até o céu”. Gênesis 10 nomeia Babel em primeiro lugar entre as cidades de Ninrode em Sinar. A grande torre-templo de Babilônia, o zigurate Etemenanki, “casa do fundamento do céu e da terra”, ficava junto ao templo de Marduque; Heródoto a descreve como uma torre de oito andares, e Nabucodonosor II a reconstruiu no século VI a.C. A maioria dos estudiosos pensa que a história tem em vista esse zigurate, ou um anterior no mesmo local."
    - "Sobrevive apenas o contorno dos alicerces do Etemenanki, um quadrado de cerca de 90 m de lado, porque Alexandre, o Grande, mandou limpar os andares em ruínas para uma reconstrução que nunca veio. Desde a Idade Média, mostra-se também aos viajantes o zigurate de Borsipa, Birs Nimrud, a sudoeste de Babilônia, cujo cume vitrificado parece uma torre atingida pelo fogo; no século XII, Benjamim de Tudela descreveu uma Torre de Babel perto de Hila, fendida por fogo do céu, muito provavelmente esta. O Gênesis não dá data, e o mapa não fixa nenhuma."
  de:
    - "Die Genesis setzt den Turm in das Land Schinar, das heißt Babylonien, und nennt die Stadt Babel, den hebräischen Namen Babylons; der Kartenpunkt steht bei Babylon am Euphrat, südlich von Bagdad im Irak und in der Luftlinie etwa 870 km von Jerusalem."
    - "Die Erzählung sagt, die Bauleute, „da sie nun zogen gen Morgen“, „fanden sie ein ebenes Land im Lande Sinear, und wohnten daselbst“, und dass sie gebrannte Ziegel und Erdharz verwendeten, die Baustoffe Mesopotamiens: „laßt uns eine Stadt und einen Turm bauen, des Spitze bis an den Himmel reiche“. 1. Mose 10 nennt Babel als erste unter den Städten Nimrods in Schinar. Babylons großer Tempelturm, die Zikkurat Etemenanki, „Haus der Grundfeste von Himmel und Erde“, stand neben dem Tempel des Marduk; Herodot beschreibt ihn als Turm von acht Stufen, und Nebukadnezar II. baute ihn im 6. Jahrhundert v. Chr. wieder auf. Die meisten Gelehrten meinen, die Erzählung habe diese Zikkurat oder eine frühere am selben Ort im Blick."
    - "Nur der Umriss der Fundamente von Etemenanki ist erhalten, ein Quadrat von etwa 90 m Seitenlänge, weil Alexander der Große die zerfallenen Stufen für einen nie erfolgten Wiederaufbau räumen ließ. Seit dem Mittelalter zeigte man Reisenden auch die Zikkurat von Borsippa, Birs Nimrud, südwestlich von Babylon, deren verglaster Gipfel wie ein vom Feuer getroffener Turm aussieht; im 12. Jahrhundert beschrieb Benjamin von Tudela einen Turm zu Babel bei Hilla, der vom Feuer des Himmels gespalten war, höchstwahrscheinlich diesen. Die Genesis gibt kein Datum, und die Karte legt keines fest."
  fr:
    - "La Genèse place la tour au pays de Schinear, c’est-à-dire la Babylonie, et nomme la ville Babel, qui est le nom hébreu de Babylone ; le point de la carte se trouve à Babylone, sur l’Euphrate, au sud de Bagdad, en Irak, à environ 870 km de Jérusalem à vol d’oiseau."
    - "Le récit dit que, « comme ils étaient partis de l’orient, ils trouvèrent une plaine au pays de Schinear, et ils y habitèrent », les bâtisseurs employèrent la brique cuite et le bitume, matériaux de la construction mésopotamienne : « Allons ! Bâtissons-nous une ville et une tour dont le sommet touche au ciel. » La Genèse 10 nomme Babel en premier parmi les villes de Nimrod au pays de Schinear. La grande tour-temple de Babylone, la ziggurat Etemenanki, « maison du fondement du ciel et de la terre », se dressait à côté du temple de Marduk ; Hérodote la décrit comme une tour à huit étages, et Nebucadnetsar II la rebâtit au VIe siècle av. J.-C. La plupart des spécialistes pensent que le récit a en vue cette ziggurat, ou une plus ancienne sur le même site."
    - "Seul subsiste le tracé des fondations d’Etemenanki, un carré d’environ 90 m de côté, parce qu’Alexandre le Grand fit déblayer les étages en ruine en vue d’une reconstruction qui ne vint jamais. Depuis le Moyen Âge, on a aussi montré aux voyageurs la ziggurat de Borsippa, Birs Nimrud, au sud-ouest de Babylone, dont le sommet vitrifié ressemble à une tour frappée par le feu ; au XIIe siècle, Benjamin de Tudèle décrivit près de Hillah une tour de Babel fendue par le feu du ciel, très probablement celle-ci. La Genèse ne donne aucune date, et la carte n’en fixe pas."
  pl:
    - "Księga Rodzaju umieszcza wieżę w ziemi Szinear, czyli w Babilonii, i nazywa miasto Babel, czyli hebrajską nazwą Babilonu; punkt na mapie stoi w Babilonie nad Eufratem, na południe od Bagdadu w Iraku i około 870 km od Jerozolimy w linii prostej."
    - "Opowieść mówi, że budowniczowie, „gdy wyszli od wschodu słońca, znaleźli równinę w ziemi Senaar, i mieszkali tam”, i że użyli wypalanej cegły i bitumu, materiałów mezopotamskiego budownictwa: „zbudujmy sobie miasto i wieżą, której by wierzch dosięgał do nieba”. Rdz 10 wymienia Babel jako pierwsze wśród miast Nimroda w Szinear. Wielka wieża świątynna Babilonu, zikkurat Etemenanki, „dom fundamentu nieba i ziemi”, stała obok świątyni Marduka; Herodot opisuje ją jako wieżę o ośmiu stopniach, a Nabuchodonozor II odbudował ją w VI wieku p.n.e. Większość uczonych sądzi, że opowieść ma na myśli ten zikkurat albo wcześniejszy na tym samym miejscu."
    - "Przetrwał tylko zarys fundamentów Etemenanki, kwadrat o boku około 90 m, ponieważ Aleksander Wielki kazał uprzątnąć zrujnowane stopnie pod odbudowę, która nigdy nie nastąpiła. Od średniowiecza podróżnikom pokazywano też zikkurat w Borsippie, Birs Nimrud, na południowy zachód od Babilonu, którego zeszklony szczyt wygląda jak wieża rażona ogniem; w XII wieku Beniamin z Tudeli opisał Wieżę Babel koło Hilli, rozłupaną ogniem z nieba, najpewniej tę. Księga Rodzaju nie podaje daty, a mapa jej nie ustala."
  it:
    - "La Genesi colloca la torre nella terra di Sennaar, cioè la Babilonia, e nomina la città Babele, che è il nome ebraico di Babilonia; il punto della mappa si trova a Babilonia sull’Eufrate, a sud di Baghdad in Iraq e a circa 870 km da Gerusalemme in linea d’aria."
    - "Il racconto dice che i costruttori, «essendo partiti verso l’Oriente», «trovarono una pianura nel paese di Scinear, e quivi si stanziarono», e che usarono mattoni cotti e bitume, i materiali dell’edilizia mesopotamica: «Orsù, edifichiamoci una città ed una torre di cui la cima giunga fino al cielo». Gen 10 nomina Babele per prima tra le città di Nimrod in Sennaar. La grande torre-tempio di Babilonia, la ziggurat Etemenanki, «casa del fondamento del cielo e della terra», sorgeva accanto al tempio di Marduk; Erodoto la descrive come una torre a otto piani, e Nabucodonosor II la ricostruì nel VI secolo a.C. La maggior parte degli studiosi ritiene che il racconto abbia in vista questa ziggurat, o una precedente sullo stesso sito."
    - "Di Etemenanki sopravvive solo il contorno delle fondamenta, un quadrato di circa 90 m di lato, perché Alessandro Magno fece sgombrare i piani in rovina per una ricostruzione che non venne mai. Fin dal Medioevo ai viaggiatori viene mostrata anche la ziggurat di Borsippa, Birs Nimrud, a sud-ovest di Babilonia, la cui sommità vetrificata sembra una torre colpita dal fuoco; nel XII secolo Beniamino di Tudela descrisse una Torre di Babele presso Hillah spaccata dal fuoco del cielo, con ogni probabilità questa. La Genesi non dà alcuna data, e la mappa non ne fissa una."
  cs:
    - "Genesis klade věž do země Šineár, tedy Babylonie, a nazývá město Babel, což je hebrejské jméno Babylónu; bod na mapě stojí v Babylónu na Eufratu, jižně od Bagdádu v Iráku a vzdušnou čarou asi 870 km od Jeruzaléma."
    - "Příběh praví, že stavitelé, „když se brali od východu“, „nalezli pole v zemi Sinear, a bydlili tam“, a že užili pálených cihel a asfaltu, materiálů mezopotámské stavby: „vystavějme sobě město a věži, jejíž by vrch dosahal k nebi.“ Genesis 10 jmenuje Babel jako první mezi městy Nimrodovými v Šineáru. Velká chrámová věž Babylónu, zikkurat Etemenanki, „dům základu nebe a země“, stála vedle Mardukova chrámu; Hérodotos ji popisuje jako věž o osmi stupních a Nebukadnesar II. ji v 6. století př. n. l. přestavěl. Většina badatelů soudí, že příběh má na mysli tento zikkurat, nebo starší na témž místě."
    - "Z Etemenanki se zachoval jen obrys základů, čtverec asi 90 m na stranu, protože Alexandr Veliký nechal zřícené stupně vyklidit pro přestavbu, která nikdy nepřišla. Od středověku se cestovatelům ukazuje také zikkurat v Borsippě, Birs Nimrud, jihozápadně od Babylónu, jehož zvitrifikovaný vrchol vypadá jako věž zasažená ohněm; ve 12. století popsal Beniamin z Tudely Babylonskou věž poblíž Hilly, rozštěpenou ohněm z nebe, nejspíše tuto. Genesis datum neuvádí a mapa žádné neurčuje."
  nl:
    - "Genesis plaatst de toren in het land Sinear, dat is Babylonië, en noemt de stad Babel, de Hebreeuwse naam van Babylon; het punt op de kaart staat bij Babylon aan de Eufraat, ten zuiden van Bagdad in Irak en hemelsbreed ongeveer 870 km van Jeruzalem."
    - "Het verhaal zegt dat “als zij tegen het oosten togen, dat zij een laagte vonden in het land Sinear; en zij woonden aldaar”, en dat zij gebakken baksteen en bitumen gebruikten, de materialen van de Mesopotamische bouwkunst: “Kom aan, laat ons voor ons een stad bouwen, en een toren, welks opperste in den hemel zij.” Gen. 10 noemt Babel als eerste onder de steden van Nimrod in Sinear. De grote tempeltoren van Babylon, de ziggoerat Etemenanki, “huis van de grondslag van hemel en aarde”, stond naast de tempel van Marduk; Herodotus beschrijft hem als een toren van acht verdiepingen, en Nebukadnessar II herbouwde hem in de zesde eeuw v.Chr. De meeste geleerden denken dat het verhaal deze ziggoerat, of een eerdere op dezelfde plaats, op het oog heeft."
    - "Alleen de omtrek van de fundamenten van Etemenanki is bewaard gebleven, een vierkant van ongeveer 90 m per zijde, omdat Alexander de Grote de verwoeste verdiepingen liet ruimen voor een herbouw die nooit kwam. Sinds de middeleeuwen krijgen reizigers ook de ziggoerat van Borsippa te zien, Birs Nimrud, ten zuidwesten van Babylon, wier verglaasde top eruitziet als een toren die door vuur is getroffen; in de twaalfde eeuw beschreef Benjamin van Tudela een Toren van Babel bij Hillah, door vuur uit de hemel gespleten, waarschijnlijk deze. Genesis geeft geen datering, en de kaart legt er geen vast."
  sv:
    - "Första Moseboken förlägger tornet i Sinears land, det vill säga Babylonien, och nämner staden Babel, som är det hebreiska namnet på Babylon; kartpunkten står vid Babylon vid Eufrat, söder om Bagdad i Irak och omkring 870 km från Jerusalem i fågelvägen."
    - "Berättelsen säger att byggarna, ”när de bröto upp och drogo österut, funno de en lågslätt i Sinears land och bosatte sig där”, och att de använde bränt tegel och jordbeck, den mesopotamiska byggnadens material: ”Kom, låt oss bygga en stad åt oss och ett torn vars spets räcker upp i himmelen.” 1 Mos 10 nämner Babel först bland Nimrods städer i Shinar. Babylons stora tempeltorn, zigguraten Etemenanki, ”himlens och jordens grundvalars hus”, stod bredvid Marduks tempel; Herodotos beskriver det som ett torn i åtta avsatser, och Nebukadnessar II byggde upp det på 500-talet f.Kr. De flesta forskare menar att berättelsen har denna ziggurat, eller en tidigare på samma plats, i sikte."
    - "Endast konturen av Etemenankis grunder finns kvar, en kvadrat på omkring 90 m per sida, eftersom Alexander den store lät röja de förfallna avsatserna för en återuppbyggnad som aldrig kom. Sedan medeltiden har resenärer också fått se Borsippas ziggurat, Birs Nimrud, sydväst om Babylon, vars förglasade topp ser ut som ett torn träffat av eld; på 1100-talet beskrev Benjamin av Tudela ett Babels torn nära Hillah klyvt av eld från himlen, sannolikt detta. Första Moseboken anger ingen datering, och kartan fastställer ingen."
  nb:
    - "Første Mosebok plasserer tårnet i landet Sinear, det vil si Babylonia, og kaller byen Babel, som er det hebraiske navnet på Babylon; kartpunktet står i Babylon ved Eufrat, sør for Bagdad i Irak og omtrent 870 km fra Jerusalem i luftlinje."
    - "Fortellingen sier: «Og da de drog frem mot øst, fant de en slette i landet Sinear, og de bosatte sig der.» De brukte brente teglstein og jordbek, mesopotamisk byggemateriale: «Kom, la oss bygge oss en by med et tårn som når op til himmelen». Første Mosebok 10 nevner Babel først blant Nimrods byer i Sinear. Babylons store tempeltårn, ziggurat Etemenanki, «huset for himmelens og jordens fundament», sto ved siden av Marduks tempel; Herodot beskriver det som et tårn med åtte trinn, og Nebukadnesar II gjenreiste det på 500-tallet f.Kr. De fleste forskere mener at fortellingen har denne zigguraten, eller en eldre på samme sted, i tankene."
    - "Bare omrisset av Etemenankis grunnmurer overlever, et kvadrat på omtrent 90 m på hver side, fordi Aleksander den store lot de ødelagte trinnene rydde bort for en gjenoppbygging som aldri kom. Siden middelalderen har reisende også blitt vist zigguraten i Borsippa, Birs Nimrud, sørvest for Babylon, hvis forglassede topp ser ut som et tårn rammet av ild; på 1100-tallet beskrev Benjamin av Tudela et Babels tårn nær Hillah, kløvd av ild fra himmelen, mest sannsynlig dette. Første Mosebok oppgir ingen datering, og kartet fastsetter ingen."
  tl:
    - "Inilalagay ng Genesis ang tore sa lupain ng Shinar, ang Babilonia, at pinangangalanan ang lungsod na Babel, na pangalang Hebreo ng Babilonia; nasa Babilonia sa Eufrates ang punto sa mapa, sa timog ng Baghdad sa Iraq at mga 870 km mula sa Jerusalem sa tuwid na guhit."
    - "Sinasabi ng salaysay na ang mga tagapagtayo, “sa kanilang paglalakbay sa silanganan, ay nakasumpong sila ng isang kapatagan sa lupain ng Sinar; at sila'y nanahan doon”, at gumamit ng lutong ladrilyo at betun, ang mga materyales ng pagtatayo sa Mesopotamia: “Halikayo! Magtayo tayo ng isang bayan natin at ng isang moog, na ang taluktok niyaon ay aabot hanggang sa langit.” Pinangalanan ng Genesis 10 ang Babel na una sa mga lungsod ni Nimrod sa Shinar. Ang dakilang tore-templo ng Babilonia, ang ziggurat na Etemenanki, “bahay ng pundasyon ng langit at lupa”, ay nakatayo sa tabi ng templo ni Marduk; inilalarawan ito ni Herodoto bilang tore ng walong yugto, at itinayo itong muli ni Nabucodonosor II noong ika-6 na siglo BK. Iniisip ng karamihan ng mga iskolar na ang ziggurat na ito, o isang mas naunang nasa gayunding lugar, ang nasa isip ng salaysay."
    - "Ang balangkas na lamang ng mga pundasyon ng Etemenanki ang nananatili, isang parisukat na mga 90 m ang bawat gilid, dahil ipinalinis ni Alejandro Magno ang mga wasak na yugto para sa isang muling pagtatayo na hindi kailanman nangyari. Mula pa noong Gitnang Panahon, ipinakita rin sa mga manlalakbay ang ziggurat ng Borsippa, ang Birs Nimrud, sa timog-kanluran ng Babilonia, na ang tuktok na naging salamin sa init ay mukhang tore na tinamaan ng apoy; noong ika-12 siglo, inilarawan ni Benjamin ng Tudela ang isang Tore ng Babel malapit sa Hillah na nahati ng apoy mula sa langit, malamang ay ito. Walang ibinibigay na petsa ang Genesis, at hindi ito itinatakda ng mapa."
  da:
    - "Første Mosebog placerer tårnet i Sinears land, det vil sige Babylonien, og kalder byen Babel, som er det hebraiske navn for Babylon; kortets punkt står ved Babylon ved Eufrat, syd for Bagdad i Irak og ca. 870 km fra Jerusalem i fugleflugt."
    - "Beretningen siger, at bygmestrene, »der de rejste fra Østen«, fandt »en Dal i Landet Sinear og boede der«, og at de brugte brændt tegl og jordbeg, de mesopotamiske byggematerialer: »lader os bygge os en Stad og et Taarn, hvis Spidse kan naa op til Himmelen.« Første Mosebog 10 nævner Babel først blandt Nimrods byer i Sinear. Babylons store tempeltårn, ziggurat’en Etemenanki, »fundamentets hus for himmel og jord«, stod ved siden af Marduks tempel; Herodot beskriver det som et tårn med otte etager, og Nebukadnezar 2. genopbyggede det i 500-tallet f.Kr. De fleste forskere mener, at beretningen har denne ziggurat, eller en ældre på samme sted, for øje."
    - "Kun omridset af Etemenankis fundamenter er bevaret, et kvadrat på ca. 90 m i siden, fordi Alexander den Store lod de ødelagte etager rydde til en genopbygning, der aldrig kom. Siden middelalderen er rejsende også blevet vist Borsippas ziggurat, Birs Nimrud, sydvest for Babylon, hvis forglassede top ligner et tårn ramt af ild; i 1100-tallet beskrev Benjamin af Tudela et Babelstårn nær Hillah splittet af ild fra himlen, sandsynligvis dette. Første Mosebog angiver ingen datering, og kortet fastlægger ingen."
  sr:
    - "Постање смешта кулу у земљу Сенар, то јест Вавилонију, и назива град Бабел, што је хебрејско име Вавилона; тачка на карти стоји у Вавилону на Еуфрату, јужно од Багдада у Ираку и око 870 км од Јерусалима ваздушном линијом."
    - "Прича каже да су градитељи, „кад отидоше од истока“, „нађоше равницу у земљи сенарској, и населише се онде“, и да су употребили печену циглу и битумен, грађу месопотамског градитељства: „Хајде да сазидамо град и кулу, којој ће врх бити до неба.“ Постање 10 именује Вавилон прво међу градовима Невродовим у Сенару. Велика храмска кула Вавилона, зигурат Етеменанки, „кућа темеља неба и земље“, стајала је поред Мардукова храма; Херодот је описује као кулу од осам степена, а Навуходоносор II обновио ју је у шестом веку п. н. е. Већина научника мисли да прича има у виду тај зигурат или неки старији на истом месту."
    - "Сачуван је само обрис темеља Етеменанкија, квадрат од око 90 м по страни, јер је Александар Велики дао да се срушени степени очисте за обнову која никад није дошла. Од средњег века путницима се показује и зигурат Борсипе, Бирс Нимруд, југозападно од Вавилона, чији стакласти врх изгледа као кула ударена ватром; у дванаестом веку Венијамин из Туделе описао је Вавилонску кулу близу Хиле расцепљену ватром с неба, највероватније ову. Постање не даје датум, а ни карта га не одређује."
  hu:
    - "A Mózes első könyve a tornyot Sineár földjére, vagyis Babilóniába helyezi, a várost pedig Bábelnek nevezi, ami Babilon héber neve; a térkép pontja Babilonnál áll az Eufráteszen, Bagdadtól délre Irakban és Jeruzsálemtől légvonalban mintegy 870 km-re."
    - "A történet szerint az építők, „mikor kelet felől elindultak vala”, „Sineár földén egy síkságot találának és ott letelepedének”, és égetett téglát és szurkot használtak, a mezopotámiai építkezés anyagait: „építsünk magunknak várost és tornyot, melynek teteje az eget érje.” A Mózes első könyve 10. fejezete Bábelt nevezi meg elsőként Nimród sineári városai között. Babilon nagy templomtornya, az Etemenanki zikkurat, „az ég és a föld alapjának háza”, Marduk temploma mellett állt; Hérodotosz nyolc emeletes toronyként írja le, II. Nabukodonozor pedig a Kr. e. 6. században újjáépítette. A legtöbb tudós úgy véli, hogy a történet ezt a zikkuratot, vagy egy korábbit ugyanazon a helyen tartja szem előtt."
    - "Az Etemenanki alapjainak csak a körvonala maradt meg, egy mintegy 90 m oldalú négyzet, mert Alexandrosz eltakaríttatta a romos emeleteket egy sosem megvalósult újjáépítéshez. A középkor óta az utazóknak a borszippai zikkuratot is mutatták, a Birs Nimrudot Babilontól délnyugatra, amelynek üvegesedett csúcsa tűz sújtotta toronynak látszik; a 12. században a tudelai Benjámin leírt egy Hillah melletti Bábel tornyát, amelyet az ég tüze hasított ketté, valószínűleg ezt. A Mózes első könyve nem ad keltezést, és a térkép sem rögzít egyet."
  fi:
    - "Genesis sijoittaa tornin Sinearin maahan, siis Babyloniaan, ja nimeää kaupungin Babeliksi, joka on Babylonin heprealainen nimi; kartan piste on Babylonissa Eufratin varrella, Bagdadista etelään Irakissa ja noin 870 km Jerusalemista linnuntietä."
    - "Kertomus sanoo, että rakentajat, ”kun he lähtivät liikkeelle itään päin, löysivät he lakeuden Sinearin maassa ja asettuivat sinne”, ja että he käyttivät poltettua tiiltä ja maapihkaa, Mesopotamian rakentamisen aineita: ”Tulkaa, rakentakaamme itsellemme kaupunki ja torni, jonka huippu ulottuu taivaaseen”. Genesiksen luku 10 nimeää Babelin ensimmäiseksi Nimrodin kaupungeista Sinearissa. Babylonin suuri temppelitorni, Etemenanki-ziggurat, ”taivaan ja maan perustuksen talo”, sijaitsi Mardukin temppelin vieressä; Herodotos kuvaa sen kahdeksanportaiseksi torniksi, ja Nebukadnessar II rakensi sen uudelleen 500-luvulla eaa. Useimpien tutkijoiden mielestä kertomus tarkoittaa tätä ziggurattia tai aiempaa samalla paikalla olevaa."
    - "Etemenankin perustusten ääriviivat ovat säilyneet, noin 90 m sivultaan oleva neliö, koska Aleksandros Suuri antoi raivata rauniokerrokset uudelleenrakennusta varten, jota ei koskaan tullut. Keskiajalta lähtien matkailijoille on myös näytetty Borsippan ziggurat, Birs Nimrud, Babylonista lounaaseen, jonka lasittunut huippu näyttää tulen iskemältä tornilta; 1100-luvulla Benjamin Tudelalainen kuvasi Hillan lähellä Baabelin tornin, jonka taivaan tuli oli halkaissut, todennäköisimmin tämän. Genesis ei anna ajankohtaa, eikä kartta määritä sellaista."
  vi:
    - "Sách Sáng thế đặt tháp trong xứ Si-nê-a, tức xứ Ba-by-lôn (Babylonia), và gọi tên thành là Ba-bên, tên Hê-bơ-rơ của Ba-by-lôn; điểm trên bản đồ nằm tại Ba-by-lôn trên Sông Ơ-phơ-rát, phía nam Baghdad ở Iraq và cách Giê-ru-sa-lem khoảng 870 km theo đường thẳng."
    - "Câu chuyện nói rằng những người xây dựng, khi “ở Đông phương dời đi”, “gặp một đồng bằng trong xứ Si-nê-a, rồi ở tại đó”, và họ dùng gạch nung và nhựa đường, vật liệu của kiến trúc Mê-sô-bô-ta-mi: “Nào! chúng ta hãy xây một cái thành và dựng lên một cái tháp, chót cao đến tận trời.” Sáng thế ký 10 nêu Ba-bên đầu tiên trong các thành của Nim-rốt ở Si-nê-a. Tháp-đền lớn của Ba-by-lôn, ziggurat Etemenanki, “nhà nền móng của trời và đất”, đứng cạnh đền của Marduk; Herodotus mô tả nó là một tháp tám tầng, và Nê-bu-cát-nết-sa II xây lại nó vào thế kỷ 6 TCN. Hầu hết học giả nghĩ câu chuyện nhắm đến ziggurat này, hoặc một ziggurat sớm hơn trên cùng địa điểm."
    - "Chỉ còn đường viền của nền móng Etemenanki, một hình vuông mỗi cạnh khoảng 90 m, vì A-léc-xan-đơ Đại đế đã cho dọn các tầng đổ nát để xây lại nhưng việc ấy không bao giờ đến. Từ thời Trung Cổ, du khách cũng được chỉ ziggurat của Borsippa, Birs Nimrud, phía tây nam Ba-by-lôn, có đỉnh bị thủy tinh hóa trông như một cái tháp bị lửa đánh; vào thế kỷ 12, Benjamin of Tudela mô tả một Tháp Ba-bên gần Hillah bị lửa từ trời chẻ ra, nhiều khả năng là tháp này. Sách Sáng thế không cho niên đại, và bản đồ không ấn định niên đại nào."
  ro:
    - "Geneza așază turnul în țara Șinear, adică Babilonia, și numește cetatea Babel, care este numele ebraic al Babilonului; punctul de pe hartă se află la Babilon, pe Eufrat, la sud de Bagdad, în Irak, la circa 870 km de Ierusalim în linie dreaptă."
    - "Povestea spune că zidarii, „după ce au purces ei dela răsărit, au aflat câmp în pământul Senaar și au descălicat acolo”, și că au folosit cărămidă arsă și bitum, materialele construcțiilor mesopotamiene: „veniți să ne zidim noă cetate și turn, al căruia vârf să fie până la cer.” Geneza 10 numește Babel primul dintre orașele lui Nimrod din Șinear. Marele turn-templu al Babilonului, ziguratul Etemenanki, „casa temeliei cerului și a pământului”, se afla lângă templul lui Marduk; Herodot îl descrie ca pe un turn cu opt trepte, iar Nebucadnețar al II-lea l-a reconstruit în secolul al VI-lea î.Hr. Cei mai mulți cercetători socot că povestea are în vedere acest zigurat sau unul mai vechi, de pe același loc."
    - "Se păstrează doar conturul temeliilor Etemenankiului, un pătrat cu latura de circa 90 m, pentru că Alexandru cel Mare a pus să fie curățate treptele ruinate în vederea unei reconstrucții care nu a mai venit. Din Evul Mediu, călătorilor li s-a arătat și ziguratul din Borsippa, Birs Nimrud, la sud-vest de Babilon, a cărui culme vitrificată arată ca un turn lovit de foc; în secolul al XII-lea, Beniamin din Tudela a descris un Turn Babel lângă Hillah, despicat de foc din cer, cel mai probabil acesta. Geneza nu dă nicio dată, iar harta nu fixează niciuna."
  bg:
    - "Битие поставя кулата в земята Сенаар, тоест Вавилония, а града назовава Бавел — така на иврит се нарича Вавилон; точката на картата стои при Вавилон на Ефрат, южно от Багдад в Ирак, на около 870 км от Йерусалим по права линия."
    - "Разказът казва, че строителите, „когато тръгнаха от изток, намериха поле в земята Сенаар; и населиха се там“, и че използваха печена тухла и битум — материалите на месопотамското строителство: „Елате, да си съградим град и стълп на който върхът да стига до небето“. Бит. 10 назовава Вавилон пръв сред градовете на Нимрод в Сенаар. Голямата храмова кула на Вавилон, зикуратът Етеменанки, „дом на основата на небето и земята“, стоеше до храма на Мардук; Херодот я описва като кула от осем етажа, а Навуходоносор II я възстанови през VI в. пр.н.е. Повечето учени смятат, че разказът има предвид този зикурат или по-ранен на същото място."
    - "От Етеменанки е оцеляло само очертанието на основите — квадрат със страна около 90 м, защото Александър Велики наредил да се разчистят разрушените етажи за възстановяване, което така и не се осъществило. От Средновековието на пътешествениците показват и зикурата на Борсипа, Бирс Нимруд, югозападно от Вавилон, чийто остъклен връх изглежда като кула, поразена от огън; през XII в. Вениамин от Тудела описва Вавилонска кула близо до Хила, разцепена от огън от небето — най-вероятно тази. Битие не дава дата и картата не определя такава."
