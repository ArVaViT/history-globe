id: where-was-the-tower-of-babel
question:
  en: "Where was the Tower of Babel?"
  ru: "Где была Вавилонская башня?"
  uk: "Де була Вавилонська вежа?"
  es: "¿Dónde estaba la torre de Babel?"
  pt: "Onde ficava a Torre de Babel?"
  de: "Wo stand der Turm zu Babel?"
  fr: "Où se trouvait la tour de Babel ?"
answer:
  en:
    - "Genesis places the tower in the land of Shinar, that is Babylonia, and names the city Babel, which is the Hebrew name of Babylon; the map point stands at Babylon on the Euphrates, south of Baghdad in Iraq and about 870 km from Jerusalem in a straight line."
    - "The story says that the builders, “as they journeyed from the east”, “found a plain in the land of Shinar; and they dwelt there”, and that they used baked brick and bitumen, the materials of Mesopotamian building: “let us build us a city and a tower, whose top may reach unto heaven.” Genesis 10 names Babel first among the cities of Nimrod in Shinar. Babylon's great temple-tower, the ziggurat Etemenanki, “house of the foundation of heaven and earth”, stood beside the temple of Marduk; Herodotus describes it as a tower of eight stages, and Nebuchadnezzar II rebuilt it in the sixth century BC. Most scholars think the story has this ziggurat, or an earlier one on the same site, in view."
    - "Only the outline of the foundations of Etemenanki survives, a square of about 90 m a side, because Alexander the Great had the ruined stages cleared for a rebuilding that never came. Since the Middle Ages travellers have also been shown the ziggurat of Borsippa, Birs Nimrud, south-west of Babylon, whose vitrified summit looks like a tower struck by fire; in the twelfth century Benjamin of Tudela described a Tower of Babel near Hillah split by fire from heaven, most likely this one. Genesis gives no date, and the map does not fix one."
  ru:
    - "Бытие помещает башню в земле Сеннаар, то есть в Вавилонии, и называет город Вавилоном: Бавел — еврейское имя Вавилона; точка на карте стоит у Вавилона на Евфрате, к югу от Багдада в Ираке, примерно в 870 км от Иерусалима по прямой."
    - "Рассказ говорит о строителях: «Двинувшись с востока, они нашли в земле Сеннаар равнину и поселились там», — и что строили из обожжённого кирпича и земляной смолы — материалов месопотамских построек: «построим себе город и башню, высотою до небес». Бытие 10 называет Вавилон первым среди городов Нимрода в Сеннааре. Великая храмовая башня Вавилона, зиккурат Этеменанки, «дом основания неба и земли», стояла рядом с храмом Мардука; Геродот описывает её как башню в восемь ярусов, а Навуходоносор II отстроил её в VI веке до н. э. Большинство учёных считают, что рассказ имеет в виду этот зиккурат или более ранний на том же месте."
    - "От Этеменанки уцелел лишь контур основания — квадрат со стороной около 90 м: Александр Македонский велел разобрать обветшавшие ярусы для перестройки, которая так и не состоялась. Со Средних веков путешественникам показывали и зиккурат Борсиппы, Бирс-Нимруд, к юго-западу от Вавилона, чья оплавленная вершина похожа на башню, поражённую огнём; Вениамин Тудельский в XII веке описал близ Хиллы Вавилонскую башню, расколотую огнём с неба, — скорее всего, эту. Бытие не называет даты, и карта её не задаёт."
  uk:
    - "Книга Буття поміщає вежу в землі Сеннаар, тобто у Вавилонії, і називає місто Бабель, що є єврейською назвою Вавилона; точка на мапі стоїть на Вавилоні на Євфраті, на південь від Багдада в Іраку, приблизно за 870 км від Єрусалима по прямій."
    - "Оповідь каже, що будівничі, «як мандрували вони від схід сонця», «знайшли поділлє в Синеяр землї, та й осїлись там», і що вони користувалися випаленою цеглою та бітумом, матеріалами месопотамського будівництва: «Нумо споруджувати місто із баштою, щоб її верх був до небес». Книга Буття 10 називає Бабель першим серед міст Німрода в Сеннаарі. Великий храм-вежа Вавилона, зіґурат Етеменанкі, «дім основи неба і землі», стояв поруч із храмом Мардука; Геродот описує його як вежу з восьми ярусів, а Навуходоносор II відбудував його у VI ст. до н. е. Більшість учених вважають, що оповідь має на увазі цей зіґурат або давніший на тому ж місці."
    - "Збереглися лише обриси фундаментів Етеменанкі, квадрат зі стороною близько 90 м, бо Александр Великий велів розчистити зруйновані яруси для відбудови, якої так і не сталося. Від Середньовіччя мандрівникам показували також зіґурат Борсіппи, Бірс-Німруд, на південний захід від Вавилона, чия зіскловрена вершина виглядає як вежа, вражена вогнем; у XII ст. Веніамін Тудельський описав Вавилонську вежу біля Хілли, розколоту вогнем з неба, найімовірніше, саме цю. Книга Буття не подає дати, і мапа її не фіксує."
  es:
    - "El Génesis sitúa la torre en la tierra de Sinar, es decir, Babilonia, y nombra la ciudad Babel, que es el nombre hebreo de Babilonia; el punto del mapa está en Babilonia, junto al Éufrates, al sur de Bagdad, en Irak, y a unos 870 km de Jerusalén en línea recta."
    - "El relato dice que los constructores, «como se partieron de oriente», «hallaron una vega en la tierra de Shinar, y asentaron allí», y que usaron ladrillo cocido y betún, los materiales de la construcción mesopotámica: «edifiquémonos una ciudad y una torre, cuya cúspide llegue al cielo». Génesis 10 nombra a Babel en primer lugar entre las ciudades de Nimrod en Sinar. La gran torre-templo de Babilonia, el zigurat Etemenanki, «casa del fundamento del cielo y de la tierra», se alzaba junto al templo de Marduk; Heródoto lo describe como una torre de ocho cuerpos, y Nabucodonosor II lo reconstruyó en el siglo VI a. C. La mayoría de los estudiosos piensan que el relato tiene a la vista este zigurat, u otro anterior en el mismo lugar."
    - "Solo sobrevive el trazado de los cimientos de Etemenanki, un cuadrado de unos 90 m de lado, porque Alejandro Magno hizo despejar los cuerpos en ruinas para una reconstrucción que nunca llegó. Desde la Edad Media también se ha mostrado a los viajeros el zigurat de Borsipa, Birs Nimrud, al suroeste de Babilonia, cuya cima vitrificada parece una torre herida por el fuego; en el siglo XII Benjamín de Tudela describió una torre de Babel cerca de Hilla, hendida por fuego del cielo, muy probablemente esta. El Génesis no da fecha, y el mapa no fija ninguna."
  pt:
    - "O Gênesis situa a torre na terra de Sinar, isto é, a Babilônia, e nomeia a cidade Babel, que é o nome hebraico de Babilônia; o ponto do mapa fica em Babilônia, no Eufrates, ao sul de Bagdá, no Iraque, a cerca de 870 km de Jerusalém em linha reta."
    - "A história diz que os construtores, “Ao viajarem para o oriente, encontraram uma planície na terra de Sinar, e ali habitaram”, e que usaram tijolo cozido e betume, os materiais da construção mesopotâmica: “vamos construir para nós uma cidade e uma torre cujo topo chegue até o céu”. Gênesis 10 nomeia Babel em primeiro lugar entre as cidades de Ninrode em Sinar. A grande torre-templo de Babilônia, o zigurate Etemenanki, “casa do fundamento do céu e da terra”, ficava junto ao templo de Marduque; Heródoto a descreve como uma torre de oito andares, e Nabucodonosor II a reconstruiu no século VI a.C. A maioria dos estudiosos pensa que a história tem em vista esse zigurate, ou um anterior no mesmo local."
    - "Sobrevive apenas o contorno dos alicerces do Etemenanki, um quadrado de cerca de 90 m de lado, porque Alexandre, o Grande, mandou limpar os andares em ruínas para uma reconstrução que nunca veio. Desde a Idade Média, mostra-se também aos viajantes o zigurate de Borsipa, Birs Nimrud, a sudoeste de Babilônia, cujo cume vitrificado parece uma torre atingida pelo fogo; no século XII, Benjamim de Tudela descreveu uma Torre de Babel perto de Hila, fendida por fogo do céu, muito provavelmente esta. O Gênesis não dá data, e o mapa não fixa nenhuma."
  de:
    - "Die Genesis setzt den Turm in das Land Schinar, das heißt Babylonien, und nennt die Stadt Babel, den hebräischen Namen Babylons; der Kartenpunkt steht bei Babylon am Euphrat, südlich von Bagdad im Irak und in der Luftlinie etwa 870 km von Jerusalem."
    - "Die Erzählung sagt, die Bauleute, „da sie nun zogen gen Morgen“, „fanden sie ein ebenes Land im Lande Sinear, und wohnten daselbst“, und dass sie gebrannte Ziegel und Erdharz verwendeten, die Baustoffe Mesopotamiens: „laßt uns eine Stadt und einen Turm bauen, des Spitze bis an den Himmel reiche“. 1. Mose 10 nennt Babel als erste unter den Städten Nimrods in Schinar. Babylons großer Tempelturm, die Zikkurat Etemenanki, „Haus der Grundfeste von Himmel und Erde“, stand neben dem Tempel des Marduk; Herodot beschreibt ihn als Turm von acht Stufen, und Nebukadnezar II. baute ihn im 6. Jahrhundert v. Chr. wieder auf. Die meisten Gelehrten meinen, die Erzählung habe diese Zikkurat oder eine frühere am selben Ort im Blick."
    - "Nur der Umriss der Fundamente von Etemenanki ist erhalten, ein Quadrat von etwa 90 m Seitenlänge, weil Alexander der Große die zerfallenen Stufen für einen nie erfolgten Wiederaufbau räumen ließ. Seit dem Mittelalter zeigte man Reisenden auch die Zikkurat von Borsippa, Birs Nimrud, südwestlich von Babylon, deren verglaster Gipfel wie ein vom Feuer getroffener Turm aussieht; im 12. Jahrhundert beschrieb Benjamin von Tudela einen Turm zu Babel bei Hilla, der vom Feuer des Himmels gespalten war, höchstwahrscheinlich diesen. Die Genesis gibt kein Datum, und die Karte legt keines fest."
  fr:
    - "La Genèse place la tour au pays de Schinear, c’est-à-dire la Babylonie, et nomme la ville Babel, qui est le nom hébreu de Babylone ; le point de la carte se trouve à Babylone, sur l’Euphrate, au sud de Bagdad, en Irak, à environ 870 km de Jérusalem à vol d’oiseau."
    - "Le récit dit que, « comme ils étaient partis de l’orient, ils trouvèrent une plaine au pays de Schinear, et ils y habitèrent », les bâtisseurs employèrent la brique cuite et le bitume, matériaux de la construction mésopotamienne : « Allons ! Bâtissons-nous une ville et une tour dont le sommet touche au ciel. » La Genèse 10 nomme Babel en premier parmi les villes de Nimrod au pays de Schinear. La grande tour-temple de Babylone, la ziggurat Etemenanki, « maison du fondement du ciel et de la terre », se dressait à côté du temple de Marduk ; Hérodote la décrit comme une tour à huit étages, et Nebucadnetsar II la rebâtit au VIe siècle av. J.-C. La plupart des spécialistes pensent que le récit a en vue cette ziggurat, ou une plus ancienne sur le même site."
    - "Seul subsiste le tracé des fondations d’Etemenanki, un carré d’environ 90 m de côté, parce qu’Alexandre le Grand fit déblayer les étages en ruine en vue d’une reconstruction qui ne vint jamais. Depuis le Moyen Âge, on a aussi montré aux voyageurs la ziggurat de Borsippa, Birs Nimrud, au sud-ouest de Babylone, dont le sommet vitrifié ressemble à une tour frappée par le feu ; au XIIe siècle, Benjamin de Tudèle décrivit près de Hillah une tour de Babel fendue par le feu du ciel, très probablement celle-ci. La Genèse ne donne aucune date, et la carte n’en fixe pas."
