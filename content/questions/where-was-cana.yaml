id: where-was-cana
question:
  en: "Where was Cana?"
  ru: "Где находилась Кана Галилейская?"
  uk: "Де була Кана?"
  es: "¿Dónde estaba Caná?"
  pt: "Onde ficava Caná?"
  de: "Wo lag Kana?"
  fr: "Où se trouvait Cana ?"
  pl: "Gdzie leżała Kana?"
  it: "Dov’era Cana?"
  nl: "Waar lag Kana?"
  cs: "Kde byla Kána?"
  sv: "Var låg Kana?"
  nb: "Hvor lå Kana?"
  tl: "Saan ang Cana?"
  da: "Hvor lå Kana?"
  sr: "Где је била Кана?"
answer:
  en:
    - "The site of Cana is disputed. Two places in Lower Galilee are the main candidates: Kafr Kanna, on the road from Nazareth towards the Sea of Galilee, where visitors are shown the place of the wedding today, and Khirbet Qana (Horbat Qana), a ruined village on the northern edge of the Beit Netofa valley about 13 km north of Nazareth, where the map point stands."
    - "John calls the place “Cana of Galilee”: “And the third day there was a marriage in Cana of Galilee; and the mother of Jesus was there.” It was the home of Nathanael, and Jesus was there again when he healed the son of the official from Capernaum, about 26 km away in a straight line. Josephus says that he himself lived for a while at a village of Galilee called Cana. Eusebius, in the fourth century, put the miracle at the Cana of the tribe of Asher, which he placed near Sidon; that is usually taken for today's Qana in Lebanon, about 43 km north of the map point, and few scholars follow him."
    - "Khirbet Qana has the stronger case from the sources: a Jewish village of the Hellenistic and Roman periods with a cave complex venerated by pilgrims, excavated from 1998; in the twelfth century Cana was generally placed there, and Josephus scholars find that his Cana fits it. Kafr Kanna has the living tradition and a Franciscan church dedicated in 1881, but how far back its claim goes is disputed: Pringle notes pilgrims mentioning a church there from the eighth century, while McCollough finds no real pilgrim link before modern times. Yardenna Alexandre, who excavated a Roman-period Jewish village at Karm er-Ras beside Kafr Kanna, argues that this was the ancient Cana. The map shows Khirbet Qana and lists the other sites on the place card."
  ru:
    - "Местоположение Каны спорно. Два места в Нижней Галилее — главные кандидаты: Кафр-Канна, на дороге из Назарета к Галилейскому морю, где сегодня показывают место брачного пира, и Хирбет-Кана (Хорват-Кана), развалины селения на северном краю долины Бейт-Нетофа примерно в 13 км к северу от Назарета, где стоит точка на карте."
    - "Иоанн зовёт это место Каной Галилейской: «На третий день был брак в Кане Галилейской, и Матерь Иисуса была там». Отсюда был родом Нафанаил, и здесь же Иисус исцелил сына царедворца из Капернаума, до которого по прямой около 26 км. Иосиф Флавий пишет, что сам одно время жил в галилейском селении под названием Кана. Евсевий в IV веке связал чудо с Каной в уделе Асира, которую помещал близ Сидона; её обычно понимают как нынешнюю Кану в Ливане, примерно в 43 км к северу от точки на карте, и за ним идут немногие."
    - "У Хирбет-Каны источники сильнее: это иудейское селение эллинистического и римского времени с пещерным комплексом, который почитали паломники; раскопки идут с 1998 года. В XII веке Кану обычно помещали именно здесь, и знатоки Иосифа Флавия находят, что его Кана подходит к этому месту. У Кафр-Канны — живая традиция и францисканская церковь, освящённая в 1881 году, но насколько древни её права, спорят: Прингл отмечает упоминания паломников о церкви здесь с VIII века, а Маккалоу не находит настоящей паломнической связи до Нового времени. Ярденна Александр, раскопавшая иудейское селение римского времени в Карм-эр-Рас рядом с Кафр-Канной, считает его древней Каной. Карта показывает Хирбет-Кану, остальные места перечислены в карточке."
  uk:
    - "Місце Кани спірне. Два місця в Нижній Галілеї є головними кандидатами: Кафр-Канна на дорозі від Назарета до Галілейського моря, де відвідувачам нині показують місце весілля, та Хірбет-Кана (Горват-Кана), зруйноване село на північному краю долини Бейт-Нетофа приблизно за 13 км на північ від Назарета, де стоїть точка мапи."
    - "Іван називає це місце «Кана Галилейська»: «А третього дня було весїллє в Канї Галилейській; і була мати Ісусова там». Це була батьківщина Натанаїла, і Ісус був там знову, коли зцілив сина царського урядовця з Капернауму, приблизно за 26 км по прямій. Йосиф Флавій каже, що сам якийсь час жив у галілейському селі, званому Кана. Євсевій у IV ст. ставив чудо в Кані коліна Асира, яку розміщував поблизу Сідону; її зазвичай ототожнюють із нинішньою Каною в Лівані, приблизно за 43 км на північ від точки мапи, і мало вчених йдуть за ним."
    - "Хірбет-Кана має сильнішу позицію з джерел: єврейське село елліністичної та римської доби з комплексом печер, шанованих прочанами, розкопуване з 1998 р.; у XII ст. Кану загалом ставили там, і дослідники Йосифа Флавія знаходять, що його Кана до неї пасує. Кафр-Канна має живу традицію і францисканську церкву, освячену 1881 р., але як далеко сягає її претензія, спірно: Прінгл зазначає прочан, що згадують церкву там від VIII ст., тоді як Маккалоу не знаходить справжнього прочанського зв'язку до нового часу. Ярдена Александр, яка розкопувала єврейське село римської доби в Карм-ер-Расі поряд із Кафр-Канною, доводить, що це й була давня Кана. Мапа показує Хірбет-Кану й перелічує інші місця на картці місця."
  es:
    - "El emplazamiento de Caná es discutido. Dos lugares de la Baja Galilea son los candidatos principales: Kafr Kanna, en el camino de Nazaret hacia el mar de Galilea, donde hoy se muestra a los visitantes el lugar de las bodas, y Khirbet Qana (Horbat Qana), una aldea en ruinas en el borde norte del valle de Beit Netofa, a unos 13 km al norte de Nazaret, donde está el punto del mapa."
    - "Juan llama al lugar «Caná de Galilea»: «Y al tercer día hiciéronse unas bodas en Caná de Galilea; y estaba allí la madre de Jesús». Era la patria de Natanael, y Jesús estuvo allí de nuevo cuando sanó al hijo del funcionario de Cafarnaúm, a unos 26 km en línea recta. Josefo dice que él mismo vivió un tiempo en una aldea de Galilea llamada Caná. Eusebio, en el siglo IV, situó el milagro en la Caná de la tribu de Aser, que ponía cerca de Sidón; suele tomarse por la actual Qana, en el Líbano, a unos 43 km al norte del punto del mapa, y pocos estudiosos lo siguen."
    - "Khirbet Qana tiene el caso más sólido según las fuentes: una aldea judía de los períodos helenístico y romano con un complejo de cuevas venerado por los peregrinos, excavada desde 1998; en el siglo XII Caná se situaba generalmente allí, y los estudiosos de Josefo hallan que su Caná encaja con ella. Kafr Kanna tiene la tradición viva y una iglesia franciscana dedicada en 1881, pero hasta dónde se remonta su pretensión es discutido: Pringle señala peregrinos que mencionan una iglesia allí desde el siglo VIII, mientras que McCollough no halla ningún vínculo real de peregrinos antes de los tiempos modernos. Yardenna Alexandre, que excavó una aldea judía de época romana en Karm er-Ras, junto a Kafr Kanna, sostiene que esa fue la antigua Caná. El mapa muestra Khirbet Qana y enumera los otros lugares en la ficha del lugar."
  pt:
    - "O local de Caná é disputado. Dois lugares da Baixa Galileia são os principais candidatos: Kafr Kanna, na estrada de Nazaré rumo ao mar da Galileia, onde hoje se mostra aos visitantes o lugar do casamento, e Khirbet Qana (Horbat Qana), uma aldeia em ruínas na borda norte do vale de Beit Netofa, a cerca de 13 km ao norte de Nazaré, onde está o ponto do mapa."
    - "João chama o lugar “Caná da Galileia”: “No terceiro dia, houve um casamento em Caná da Galileia. A mãe de Jesus estava lá.” Era a terra de Natanael, e Jesus voltou ali quando curou o filho do oficial de Cafarnaum, a cerca de 26 km em linha reta. Josefo diz que ele mesmo morou algum tempo numa aldeia da Galileia chamada Caná. Eusébio, no século IV, pôs o milagre na Caná da tribo de Aser, que situou perto de Sidom; costuma-se tomá-la pela atual Qana, no Líbano, a cerca de 43 km ao norte do ponto do mapa, e poucos estudiosos o seguem."
    - "Khirbet Qana tem o caso mais forte quanto às fontes: uma aldeia judaica dos períodos helenístico e romano com um complexo de grutas venerado por peregrinos, escavada desde 1998; no século XII Caná era geralmente situada ali, e os estudiosos de Josefo acham que sua Caná combina com ela. Kafr Kanna tem a tradição viva e uma igreja franciscana dedicada em 1881, mas até onde recua sua reivindicação é disputado: Pringle nota peregrinos que mencionam ali uma igreja desde o século VIII, enquanto McCollough não acha ligação real de peregrinos antes dos tempos modernos. Yardenna Alexandre, que escavou uma aldeia judaica de época romana em Karm er-Ras, junto a Kafr Kanna, sustenta que esta era a antiga Caná. O mapa mostra Khirbet Qana e lista os outros locais na ficha do lugar."
  de:
    - "Die Lage von Kana ist umstritten. Zwei Orte in Untergaliläa sind die Hauptkandidaten: Kafr Kanna, an der Straße von Nazareth zum See Genezareth, wo man Besuchern heute den Ort der Hochzeit zeigt, und Chirbet Qana (Horbat Qana), ein Ruinendorf am Nordrand des Bet-Netofa-Tals etwa 13 km nördlich von Nazareth, wo der Kartenpunkt steht."
    - "Johannes nennt den Ort „Kana in Galiläa“: „Und am dritten Tag ward eine Hochzeit zu Kana in Galiläa; und die Mutter Jesu war da.“ Es war die Heimat des Nathanael, und Jesus war dort wieder, als er den Sohn des Beamten aus Kapernaum heilte, in der Luftlinie etwa 26 km entfernt. Josephus sagt, er selbst habe eine Zeit in einem Dorf Galiläas namens Kana gewohnt. Eusebius setzte im 4. Jahrhundert das Wunder in das Kana des Stammes Asser, das er bei Sidon ansetzte; das hält man meist für das heutige Qana im Libanon, etwa 43 km nördlich des Kartenpunkts, und wenige Gelehrte folgen ihm."
    - "Chirbet Qana hat die stärkeren Quellen für sich: ein jüdisches Dorf der hellenistischen und römischen Zeit mit einem von Pilgern verehrten Höhlenkomplex, seit 1998 ausgegraben; im 12. Jahrhundert setzte man Kana allgemein dorthin, und Josephus-Forscher finden, dass sein Kana dazu passt. Kafr Kanna hat die lebendige Überlieferung und eine 1881 geweihte Franziskanerkirche, doch wie weit sein Anspruch zurückreicht, ist umstritten: Pringle verzeichnet Pilger, die dort seit dem 8. Jahrhundert eine Kirche erwähnen, McCollough findet vor der Neuzeit keine echte Pilgerverbindung. Yardenna Alexandre, die bei Karm er-Ras neben Kafr Kanna ein jüdisches Dorf der Römerzeit ausgrub, hält dieses für das antike Kana. Die Karte zeigt Chirbet Qana und führt die anderen Stätten auf der Ortskarte auf."
  fr:
    - "Le site de Cana est discuté. Deux lieux de Basse Galilée sont les principaux candidats : Kafr Kanna, sur la route de Nazareth vers la mer de Galilée, où l’on montre aujourd’hui aux visiteurs le lieu des noces, et Khirbet Qana (Horbat Qana), village ruiné au bord nord de la vallée de Beit Netofa, à environ 13 km au nord de Nazareth, où se trouve le point de la carte."
    - "Jean appelle le lieu « Cana en Galilée » : « Trois jours après, il y eut des noces à Cana en Galilée. La mère de Jésus était là. » C’était la patrie de Nathanaël, et Jésus y revint pour guérir le fils de l’officier de Capernaüm, à environ 26 km en ligne droite. Josèphe dit avoir lui-même habité quelque temps un village de Galilée appelé Cana. Eusèbe, au IVe siècle, plaçait le miracle à la Cana de la tribu d’Aser, qu’il situait près de Sidon ; on y voit d’ordinaire l’actuelle Qana au Liban, à environ 43 km au nord du point de la carte, et peu de savants le suivent."
    - "Khirbet Qana a la meilleure cause d’après les sources : village juif des époques hellénistique et romaine avec un ensemble de grottes vénéré par les pèlerins, fouillé depuis 1998 ; au XIIe siècle, on y plaçait généralement Cana, et les spécialistes de Josèphe trouvent que sa Cana lui correspond. Kafr Kanna a la tradition vivante et une église franciscaine consacrée en 1881, mais l’ancienneté de sa revendication est discutée : Pringle note des pèlerins mentionnant une église là dès le VIIIe siècle, tandis que McCollough ne trouve aucun vrai lien pèlerin avant les temps modernes. Yardenna Alexandre, qui a fouillé un village juif d’époque romaine à Karm er-Ras près de Kafr Kanna, soutient que c’était la Cana antique. La carte montre Khirbet Qana et énumère les autres sites sur la fiche du lieu."
  pl:
    - "Położenie Kany jest sporne. Głównymi kandydatami są dwa miejsca w Dolnej Galilei: Kafr Kanna, przy drodze z Nazaretu ku Jezioru Galilejskiemu, gdzie dziś pokazuje się odwiedzającym miejsce wesela, i Chirbet Kana (Horbat Kana), zrujnowana wieś na północnym skraju doliny Bet Netofa około 13 km na północ od Nazaretu, gdzie stoi punkt na mapie."
    - "Jan umieszcza to miejsce „w Kanie Galilejskiej”: „A dnia trzeciego było wesele w Kanie Galilejskiej, i była tam matka Jezusowa.” Było to miejsce pochodzenia Natanaela, a Jezus był tam znowu, gdy uzdrowił syna urzędnika królewskiego z Kafarnaum, oddalonego o około 26 km w linii prostej. Józef Flawiusz mówi, że sam mieszkał przez pewien czas we wsi w Galilei zwanej Kana. Euzebiusz w IV wieku umieścił cud w Kanie plemienia Aszera, którą umieścił blisko Sydonu; to zwykle uważa się za dzisiejszą Kanę w Libanie, około 43 km na północ od punktu na mapie, i niewielu uczonych idzie za nim."
    - "Chirbet Kana ma mocniejsze racje ze źródeł: wieś żydowska z okresu hellenistycznego i rzymskiego z kompleksem jaskiń czczonym przez pielgrzymów, wykopywana od 1998; w XII wieku Kanę powszechnie umieszczano tam, a badacze Flawiusza uważają, że pasuje do niej jego Kana. Kafr Kanna ma żywą tradycję i kościół franciszkański poświęcony w 1881, ale jak daleko wstecz sięga jej roszczenie, jest sporne: Pringle zauważa pielgrzymów wspominających tam kościół od VIII wieku, podczas gdy McCollough nie znajduje prawdziwego związku pielgrzymów przed czasami nowożytnymi. Yardenna Alexandre, która wykopywała rzymską wieś żydowską w Karm er-Ras obok Kafr Kanna, dowodzi, że to była starożytna Kana. Mapa pokazuje Chirbet Kana i wymienia pozostałe miejsca na karcie miejsca."
  it:
    - "Il sito di Cana è discusso. Due luoghi della Bassa Galilea sono i candidati principali: Kafr Kanna, sulla strada da Nazaret verso il lago di Tiberiade, dove ai visitatori si mostra oggi il luogo delle nozze, e Khirbet Qana (Horbat Qana), un villaggio in rovina sul margine settentrionale della valle di Bet Netofa, a circa 13 km a nord di Nazaret, dove sta il punto della mappa."
    - "Giovanni chiama il luogo «Cana di Galilea»: «Tre giorni dopo, si fecero delle nozze in Cana di Galilea, e c’era la madre di Gesù». Era la patria di Natanaele, e Gesù vi tornò quando guarì il figlio del funzionario di Cafarnao, a circa 26 km in linea retta. Giuseppe Flavio dice di aver vissuto egli stesso per un certo tempo in un villaggio della Galilea chiamato Cana. Eusebio, nel IV secolo, pose il miracolo nella Cana della tribù di Aser, che collocava presso Sidone; essa è di solito ritenuta l’odierna Qana in Libano, a circa 43 km a nord del punto della mappa, e pochi studiosi lo seguono."
    - "Khirbet Qana ha dalle fonti il caso più forte: un villaggio ebraico delle età ellenistica e romana con un complesso di grotte venerato dai pellegrini, scavato dal 1998; nel XII secolo Cana era generalmente collocata lì, e gli studiosi di Giuseppe Flavio trovano che la sua Cana vi si adatta. Kafr Kanna ha la tradizione viva e una chiesa francescana dedicata nel 1881, ma fin dove risalga la sua pretesa è discusso: Pringle nota pellegrini che menzionano una chiesa lì dall’VIII secolo, mentre McCollough non trova un vero legame di pellegrini prima dell’età moderna. Yardenna Alexandre, che scavò un villaggio ebraico di epoca romana a Karm er-Ras accanto a Kafr Kanna, sostiene che fosse l’antica Cana. La mappa mostra Khirbet Qana ed elenca gli altri siti sulla scheda del luogo."
  nl:
    - "De ligging van Kana is omstreden. Twee plaatsen in Neder-Galilea zijn de belangrijkste kandidaten: Kafr Kanna, aan de weg van Nazareth naar het Meer van Galilea, waar bezoekers nu de plaats van de bruiloft getoond krijgen, en Khirbet Qana (Horbat Qana), een ruïnedorp aan de noordrand van het Beit Netofa-dal, ongeveer 13 km ten noorden van Nazareth, waar het punt op de kaart staat."
    - "Johannes noemt de plaats “Kana in Galilea”: “En op den derden dag was er een bruiloft te Kana in Galilea; en de moeder van Jezus was aldaar.” Het was de woonplaats van Natanaël, en Jezus was er opnieuw toen Hij de zoon van de hoveling uit Kafarnaüm genas, hemelsbreed ongeveer 26 km verderop. Josephus zegt dat hijzelf een tijd in een dorp in Galilea genaamd Kana woonde. Eusebius plaatste in de vierde eeuw het wonder in het Kana van de stam Aser, dat hij bij Sidon situeerde; dat wordt gewoonlijk opgevat als het huidige Qana in Libanon, ongeveer 43 km ten noorden van het punt op de kaart, en weinig geleerden volgen hem."
    - "Khirbet Qana heeft de sterkere zaak vanuit de bronnen: een Joods dorp uit de hellenistische en Romeinse tijd met een door pelgrims vereerd grottencomplex, sinds 1998 opgegraven; in de twaalfde eeuw werd Kana algemeen daar geplaatst, en Josephus-onderzoekers vinden dat zijn Kana erbij past. Kafr Kanna heeft de levende overlevering en een in 1881 gewijde franciscaanse kerk, maar hoe ver zijn aanspraak teruggaat, is omstreden: Pringle wijst op pelgrims die vanaf de achtste eeuw een kerk er vermelden, terwijl McCollough vóór de moderne tijd geen echte pelgrimsband vindt. Yardenna Alexandre, die bij Karm er-Ras naast Kafr Kanna een Joods dorp uit de Romeinse tijd opgroef, betoogt dat dit het oude Kana was. De kaart toont Khirbet Qana en noemt de andere plaatsen op de plaatskaart."
  cs:
    - "Poloha Kány je sporná. Dvě místa v Dolní Galileji jsou hlavními kandidáty: Kafr Kanna, při cestě z Nazareta k Galilejskému jezeru, kde se dnes návštěvníkům ukazuje místo svatby, a Chirbet Kana (Chorbat Kana), zpustlá vesnice na severním okraji údolí Bejt Netofa asi 13 km severně od Nazareta, kde stojí bod na mapě."
    - "Jan o svatbě říká: „Třetího dne stala se svadba v Káni Galilejské, a byla matka Ježíšova tam.“ Bylo to domovem Natanaela a Ježíš tam byl znovu, když uzdravil syna královského úředníka z Kafarnaa, asi 26 km vzdušnou čarou. Josephus Flavius říká, že sám nějaký čas žil ve vesnici v Galileji zvané Kána. Eusebios ve 4. století klade zázrak do Kány v kmeni Ašer, kterou umístil poblíž Sidónu; to se obvykle pokládá za dnešní Kánu v Libanonu, asi 43 km severně od bodu na mapě, a málo badatelů ho následuje."
    - "Chirbet Kana má silnější případ z pramenů: židovská vesnice helénistického a římského období s jeskynním komplexem uctívaným poutníky, zkoumaná od roku 1998; ve 12. století byla Kána obecně kladena tam a znalci Josepha zjišťují, že jeho Kána tomu odpovídá. Kafr Kanna má živou tradici a františkánský kostel zasvěcený roku 1881, ale jak daleko sahá její nárok, je sporné: Pringle poznamenává poutníky zmiňující tam kostel od 8. století, zatímco McCollough nenachází skutečnou poutnickou vazbu před novověkem. Yardenna Alexandre, která vykopávala židovskou vesnici římského období v Karm ar-Ras vedle Kafr Kanna, tvrdí, že to byla starověká Kána. Mapa ukazuje Chirbet Kana a ostatní místa uvádí na kartě místa."
  sv:
    - "Kanas läge är omstritt. Två platser i Nedre Galileen är huvudkandidaterna: Kafr Kanna, på vägen från Nasaret mot Galileiska sjön, där besökare i dag visas bröllopets plats, och Khirbet Qana (Horbat Qana), en ruinby vid norra kanten av Beit Netofa-dalen omkring 13 km norr om Nasaret, där kartpunkten står."
    - "Johannes kallar platsen ”Kana i Galileen”: ”På tredje dagen var ett bröllop i Kana i Galileen, och Jesu moder var där.” Det var Natanaels hemort, och Jesus var där igen när han botade sonen till tjänstemannen från Kafarnaum, omkring 26 km bort fågelvägen. Josefus säger att han själv en tid bodde i en by i Galileen som hette Kana. Eusebios placerade på 300-talet undret i Ashers stams Kana, som han förlade nära Sidon; det anses vanligen vara dagens Qana i Libanon, omkring 43 km norr om kartpunkten, och få forskare följer honom."
    - "Khirbet Qana har det starkare fallet utifrån källorna: en judisk by från hellenistisk och romersk tid med ett grottkomplex som vördades av pilgrimer, utgrävd från 1998; på 1100-talet placerades Kana i allmänhet där, och Josefusforskare finner att hans Kana passar den. Kafr Kanna har den levande traditionen och en franciskanerkyrka invigd 1881, men hur långt tillbaka dess anspråk går är omstritt: Pringle noterar pilgrimer som nämner en kyrka där från 700-talet, medan McCollough inte finner någon verklig pilgrimskoppling före modern tid. Yardenna Alexandre, som grävde ut en judisk by från romersk tid vid Karm er-Ras bredvid Kafr Kanna, hävdar att detta var det forntida Kana. Kartan visar Khirbet Qana och förtecknar de övriga platserna på platskortet."
  nb:
    - "Kanas beliggenhet er omstridt. To steder i Nedre Galilea er hovedkandidatene: Kafr Kanna, på veien fra Nasaret mot Galileasjøen, der besøkende i dag vises stedet for bryllupet, og Khirbet Qana (Horbat Qana), en ruinlandsby i den nordlige kanten av Beit Netofa-dalen omtrent 13 km nord for Nasaret, der kartpunktet står."
    - "Johannes kaller stedet «Kana i Galilea»: «Og på den tredje dag var det et bryllup i Kana i Galilea, og Jesu mor var der.» Det var Natanaels hjemby, og Jesus var der igjen da han helbredet sønnen til embetsmannen fra Kapernaum, omtrent 26 km unna i luftlinje. Josefus sier at han selv en tid bodde i en landsby i Galilea kalt Kana. Eusebius plasserte på 300-tallet miraklet i Asjers stammes Kana, som han la nær Sidon; det regnes vanligvis for dagens Qana i Libanon, omtrent 43 km nord for kartpunktet, og få forskere følger ham."
    - "Khirbet Qana har det sterkeste grunnlaget i kildene: en jødisk landsby fra den hellenistiske og romerske perioden med et hulekompleks som pilegrimer ærer, utgravd fra 1998; på 1100-tallet ble Kana alminnelig plassert der, og Josefus-forskere finner at hans Kana passer med den. Kafr Kanna har den levende tradisjonen og en fransiskansk kirke viet i 1881, men hvor langt tilbake kravet går, er omstridt: Pringle bemerker at pilegrimer nevner en kirke der fra 700-tallet, mens McCollough ikke finner noen reell pilegrimsforbindelse før i moderne tid. Yardenna Alexandre, som gravde ut en jødisk landsby fra romertiden ved Karm er-Ras ved siden av Kafr Kanna, argumenterer for at dette var det antikke Kana. Kartet viser Khirbet Qana og lister de andre stedene på stedskortet."
  tl:
    - "Pinagtatalunan ang pook ng Cana. Dalawang lugar sa Mababang Galilea ang pangunahing kandidato: ang Kafr Kanna, sa daan mula Nazaret patungo sa Dagat ng Galilea, kung saan ipinakikita ngayon sa mga bisita ang lugar ng kasalan, at ang Khirbet Qana (Horbat Qana), isang sirang nayon sa hilagang gilid ng libis ng Beit Netofa mga 13 km sa hilaga ng Nazaret, kung saan nakatayo ang tuldok ng mapa."
    - "Tinatawag ni Juan ang lugar na “Cana ng Galilea”: “At nang ikatlong araw ay nagkaroon ng isang kasalan sa Cana ng Galilea; at naroon ang ina ni Jesus.” Ito ang tahanan ni Natanael, at naroon muli si Jesus nang pagalingin niya ang anak ng opisyal mula sa Capernaum, mga 26 km ang layo sa tuwid na guhit. Sinasabi ni Josephus na siya mismo ay tumira nang ilang panahon sa isang nayon ng Galilea na tinatawag na Cana. Inilagay ni Eusebio, noong ikaapat na siglo, ang himala sa Cana ng lipi ni Aser, na inilagay niya malapit sa Sidon; karaniwang itinuturing itong Qana sa Libano ngayon, mga 43 km sa hilaga ng tuldok sa mapa, at kakaunting iskolar ang sumusunod sa kaniya."
    - "Mas matibay ang kaso ng Khirbet Qana mula sa mga pinagkunan: nayong Judio ng mga panahong Helenistiko at Romano na may kompleks ng yungib na pinararangalan ng mga peregrino, hinukay mula 1998; noong ikalabindalawang siglo, karaniwang inilagay doon ang Cana, at nakikita ng mga iskolar ni Josephus na tugma rito ang Cana niya. May buháy na tradisyon ang Kafr Kanna at simbahang Pransiskano ng 1881, ngunit pinagtatalunan kung hanggang kailan ang pag-angkin nito: binabanggit ni Pringle ang mga peregrinong bumabanggit ng simbahan doon mula ikawalong siglo, samantalang walang nakikitang tunay na ugnayan ng peregrino si McCollough bago ang makabagong panahon. Iginiit ni Yardenna Alexandre, na humukay ng nayong Judio ng panahong Romano sa Karm er-Ras sa tabi ng Kafr Kanna, na ito ang sinaunang Cana. Ipinakikita ng mapa ang Khirbet Qana at inililista ang iba sa kard."
  da:
    - "Kanas sted er omstridt. To steder i Nedre Galilæa er de vigtigste kandidater: Kafr Kanna, på vejen fra Nazaret mod Genesaret Sø, hvor besøgende i dag vises stedet for brylluppet, og Khirbet Qana (Horbat Qana), en ruinlandsby på den nordlige kant af Beit Netofa-dalen omkring 13 km nord for Nazaret, hvor kortets punkt står."
    - "Johannes kalder stedet »Kana i Galilæa«: »Og paa den tredje Dag var der et Bryllup i Kana i Galilæa; og Jesu Moder var der.« Det var Natanaels hjemby, og Jesus var der igen, da han helbredte sønnen af embedsmanden fra Kapernaum, omkring 26 km væk i luftlinje. Josefus siger, at han selv boede en tid i en landsby i Galilæa kaldet Kana. Eusebius placerede i 300-tallet miraklet i Kana i Asers stamme, som han placerede nær Sidon; det tages sædvanligvis for nutidens Qana i Libanon, omkring 43 km nord for kortets punkt, og få forskere følger ham."
    - "Khirbet Qana har den stærkeste sag ud fra kilderne: en jødisk landsby fra den hellenistiske og romerske periode med et hulekompleks, der æres af pilgrimme, udgravet fra 1998; i 1100-tallet blev Kana almindeligvis placeret dér, og Josefus-forskere finder, at hans Kana passer til det. Kafr Kanna har den levende tradition og en franciskansk kirke indviet i 1881, men hvor langt tilbage dens krav går, er omstridt: Pringle bemærker pilgrimme, der nævner en kirke dér fra 700-tallet, mens McCollough ikke finder nogen reel pilgrimsforbindelse før moderne tid. Yardenna Alexandre, der udgravede en jødisk landsby fra romertiden ved Karm er-Ras ved siden af Kafr Kanna, hævder, at dette var det antikke Kana. Kortet viser Khirbet Qana og opregner de andre steder på stedets kort."
  sr:
    - "Место Кане је спорно. Два места у Доњој Галилеји главни су кандидати: Кафр Кана, на путу од Назарета ка Галилејском мору, где се посетиоцима данас показује место свадбе, и Хирбет Кана (Хорват Кана), порушено село на северном рубу долине Бет Нетофа око 13 км северно од Назарета, где стоји тачка на карти."
    - "Јован то место назива по Галилеји: „И трећи дан би свадба у Кани галилејској, и онде беше мати Исусова.“ Био је то завичај Натанаила, а Исус је ту био поново кад је исцелио сина краљевског чиновника из Капернаума, удаљеног око 26 км правом линијом. Јосиф Флавије каже да је и сам неко време живео у једном галилејском селу званом Кана. Јевсевије је у 4. веку ставио чудо у Кану племена Асирова, коју је сместио близу Сидона; то се обично узима за данашњу Кану у Либану, око 43 км северно од тачке на карти, и мало научника га следи."
    - "Хирбет Кана има јачи случај из извора: јеврејско село хеленистичког и римског доба с пећинским комплексом који ходочасници поштују, ископавано од 1998; у 12. веку Кана се углавном ту смештала, а проучаваоци Јосифа Флавија налазе да се његова Кана с њом слаже. Кафр Кана има живо предање и фрањевачку цркву посвећену 1881, али докле сеже њена тврдња, спорно је: Прингл бележи ходочаснике који помињу цркву тамо од 8. века, док Макколаф не налази праву везу ходочасника пре модерног доба. Јардена Александр, која је ископавала римско јеврејско село на Карм ер Расу поред Кафр Кане, тврди да је то била древна Кана. Карта приказује Хирбет Кану, а остала налазишта наводи на картици места."
