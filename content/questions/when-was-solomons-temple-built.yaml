id: when-was-solomons-temple-built
question:
  en: "When was Solomon's Temple built?"
  ru: "Когда был построен храм Соломона?"
  uk: "Коли було збудовано Храм Соломона?"
  es: "¿Cuándo se construyó el Templo de Salomón?"
  pt: "Quando foi construído o Templo de Salomão?"
  de: "Wann wurde der Tempel Salomos gebaut?"
  fr: "Quand le Temple de Salomon a-t-il été bâti ?"
  pl: "Kiedy zbudowano Świątynię Salomona?"
  it: "Quando fu costruito il Tempio di Salomone?"
  nl: "Wanneer werd de tempel van Salomo gebouwd?"
  cs: "Kdy byl postaven Šalomounův chrám?"
answer:
  en:
    - "Solomon began the Temple in the fourth year of his reign, about 966 BC on the chronology of Thiele that the map follows (Solomon's reign c. 970–931 BC), and finished it seven years later, about 959 BC. It stood on the hill north of the City of David, the Temple Mount, until the Babylonians burned it in 587 or 586 BC (the year is disputed), some 370 to 380 years later."
    - 'The book of Kings dates it twice over: "in the four hundred and eightieth year after the children of Israel were come out of the land of Egypt, in the fourth year of Solomon''s reign over Israel, in the month Zif, which is the second month, that he began to build the house of the LORD", and "in the eleventh year, in the month Bul, which is the eighth month, was the house finished throughout all the parts thereof ... So was he seven years in building it." Hiram king of Tyre supplied the cedar and the craftsmen, and the Temple was dedicated at the feast in the seventh month, when the ark was brought up from the City of David and the cloud filled the house.'
    - "The 480 years, taken literally, put the Exodus in 1446 BC, the conventional point of the map's Exodus tour; many scholars take the figure as a round number of twelve generations and date the Exodus later, so the Temple's date rests on the chronology of the kings, not on it, and some chronologies put Solomon's accession a few years after Thiele's. Nothing of Solomon's building has been identified: its site lies under the platform on which Herod the Great rebuilt the Second Temple from about 20 BC. That Second Temple, finished about 516 BC, was itself destroyed by the Romans in AD 70."
  ru:
    - "Соломон начал строить Храм в четвёртый год своего царствования, около 966 г. до н. э. по хронологии Тиле, которой следует карта (царствование Соломона — ок. 970–931 гг. до н. э.), и закончил семь лет спустя, около 959 г. до н. э. Храм стоял на холме к северу от города Давидова, на Храмовой горе, пока вавилоняне не сожгли его в 587 или 586 г. до н. э. (год спорный), — примерно через 370–380 лет."
    - "Книга Царств датирует его дважды: «В четыреста восьмидесятом году по исшествии сынов Израилевых из земли Египетской, в четвертый год царствования Соломонова над Израилем, в месяц Зиф, который есть второй месяц, начал он строить храм Господу», и «на одиннадцатом году, в месяце Буле, — это месяц восьмой, — он окончил храм со всеми принадлежностями его и по всем предначертаниям его; строил его семь лет». Хирам, царь Тирский, дал кедры и мастеров, а освящён Храм был на праздник в седьмой месяц, когда ковчег перенесли из города Давидова и облако наполнило дом."
    - "Четыреста восемьдесят лет при буквальном счёте относят Исход к 1446 г. до н. э. — условной точке тура об Исходе на карте; многие учёные считают это число круглым, двенадцать поколений, и датируют Исход позднее, так что дата Храма опирается на хронологию царей, а не на него, и некоторые хронологии ставят воцарение Соломона на несколько лет позже, чем Тиле. От постройки Соломона ничего не найдено: её место скрыто под платформой, на которой Ирод Великий примерно с 20 г. до н. э. перестраивал Второй храм. Этот Второй храм, оконченный около 516 г. до н. э., разрушили римляне в 70 г. н. э."
  uk:
    - "Соломон почав Храм на четвертому році свого царювання, близько 966 р. до н. е. за хронологією Тіле, якої дотримується мапа (царювання Соломона близько 970–931 рр. до н. е.), і завершив його сім років по тому, близько 959 р. до н. е. Він стояв на пагорбі на північ від Міста Давида, Храмовій горі, доки вавилоняни не спалили його 587 або 586 р. до н. е. (рік спірний), приблизно через 370–380 років."
    - "Книга Царів датує його двічі: «У чотириста вісїмдесятому роцї по виходї Ізрайлитян із Египту, у четвертому роцї, місяця Зифа, — се є місяць другий — царювання Соломонового над Ізраїлем, почав він будувати храм Господеві» і «А в одинайцятому роцї, в місяцї Бул — се є місяць восьмий — скінчив він храм по всїх його частинах і з усїм знаряддєм; а будував його сїм год». Хірам, цар Тіру, постачав кедр і майстрів, і Храм було освячено на святі сьомого місяця, коли ковчег перенесли з Міста Давида і хмара наповнила дім."
    - "480 років, узяті буквально, відносять Вихід до 1446 р. до н. е., умовної точки туру Виходу на мапі; багато вчених вважають цю цифру круглим числом дванадцяти поколінь і датують Вихід пізніше, тож дата Храму спирається на хронологію царів, а не на неї, і деякі хронології ставлять вступ Соломона на престол на кілька років після Тіле. Нічого із Соломонової споруди не ідентифіковано: її місце лежить під платформою, на якій Ірод Великий перебудував Другий Храм близько 20 р. до н. е. Сам цей Другий Храм, завершений близько 516 р. до н. е., було зруйновано римлянами 70 р. н. е."
  es:
    - "Salomón comenzó el Templo en el cuarto año de su reinado, hacia el 966 a. C. según la cronología de Thiele que sigue el mapa (reinado de Salomón hacia 970–931 a. C.), y lo terminó siete años después, hacia el 959 a. C. Se alzó en la colina al norte de la Ciudad de David, el monte del Templo, hasta que los babilonios lo incendiaron en el 587 o 586 a. C. (el año es discutido), unos 370 a 380 años después."
    - "El libro de Reyes lo fecha dos veces: «en el año cuatrocientos ochenta después que los hijos de Israel salieron de Egipto, en el cuarto año del principio del reino de Salomón sobre Israel, en el mes de Ziph, que es el mes segundo, que él comenzó á edificar la casa de Jehová», y «en el undécimo año, en el mes de Bul, que es el mes octavo, fué acabada la casa con todas sus pertenencias, y con todo lo necesario. Edificóla pues, en siete años». Hiram, rey de Tiro, proveyó el cedro y los artesanos, y el Templo fue dedicado en la fiesta del mes séptimo, cuando el arca fue subida de la Ciudad de David y la nube llenó la casa."
    - "Los 480 años, tomados al pie de la letra, sitúan el Éxodo en el 1446 a. C., el punto convencional del recorrido del Éxodo en el mapa; muchos estudiosos toman la cifra como un número redondo de doce generaciones y fechan el Éxodo más tarde, de modo que la fecha del Templo descansa en la cronología de los reyes y no en ella, y algunas cronologías sitúan el ascenso de Salomón unos años después que la de Thiele. No se ha identificado nada de la obra de Salomón: su emplazamiento queda bajo la plataforma sobre la que Herodes el Grande reconstruyó el Segundo Templo hacia el 20 a. C. Ese Segundo Templo, terminado hacia el 516 a. C., fue a su vez destruido por los romanos en el 70 d. C."
  pt:
    - "Salomão começou o Templo no quarto ano de seu reinado, por volta de 966 a.C. pela cronologia de Thiele que o mapa segue (reinado de Salomão c. 970–931 a.C.), e o concluiu sete anos depois, por volta de 959 a.C. Ele ficava na colina ao norte da Cidade de Davi, o monte do Templo, até que os babilônios o queimaram em 587 ou 586 a.C. (o ano é disputado), uns 370 a 380 anos depois."
    - "O livro de Reis o data duas vezes: “No quadringentésimo octogésimo ano depois que os filhos de Israel saíram da terra do Egito, no quarto ano do reinado de Salomão sobre Israel, no mês de Zive, que é o segundo mês, ele começou a edificar a casa do SENHOR”, e “no décimo primeiro ano, no mês de Bul, que é o oitavo mês, a casa foi terminada em todas as suas partes… Assim, ele levou sete anos para edificá-la”. Hirão, rei de Tiro, forneceu o cedro e os artífices, e o Templo foi dedicado na festa do sétimo mês, quando a arca foi trazida da Cidade de Davi e a nuvem encheu a casa."
    - "Os 480 anos, tomados ao pé da letra, põem o Êxodo em 1446 a.C., o ponto convencional do roteiro do Êxodo no mapa; muitos estudiosos tomam o número como cifra redonda de doze gerações e datam o Êxodo mais tarde, de modo que a data do Templo repousa na cronologia dos reis, não nele, e algumas cronologias põem a subida de Salomão ao trono uns anos depois da de Thiele. Nada da construção de Salomão foi identificado: seu local está sob a plataforma em que Herodes, o Grande, reconstruiu o Segundo Templo a partir de cerca de 20 a.C. Esse Segundo Templo, concluído por volta de 516 a.C., foi por sua vez destruído pelos romanos em 70 d.C."
  de:
    - "Salomo begann den Tempel im vierten Jahr seiner Regierung, um 966 v. Chr. nach der Chronologie Thieles, der die Karte folgt (Salomos Regierung um 970–931 v. Chr.), und vollendete ihn sieben Jahre später, um 959 v. Chr. Er stand auf dem Hügel nördlich der Stadt Davids, dem Tempelberg, bis ihn die Babylonier 587 oder 586 v. Chr. verbrannten (das Jahr ist umstritten), etwa 370 bis 380 Jahre später."
    - "Das Buch der Könige datiert ihn zweifach: „Im vierhundertachtzigsten Jahr nach dem Ausgang der Kinder Israel aus Ägyptenland, im vierten Jahr des Königreichs Salomo über Israel, im Monat Siv, das ist der zweite Monat, ward das Haus des HERRN gebaut“, und: „im elften Jahr, im Monat Bul (das ist der achte Monat), ward das Haus bereitet, wie es sein sollte, daß sie sieben Jahre daran bauten“. Hiram, der König von Tyrus, lieferte Zedernholz und Handwerker, und der Tempel wurde am Fest im siebten Monat geweiht, als die Lade aus der Stadt Davids heraufgebracht wurde und die Wolke das Haus erfüllte."
    - "Die 480 Jahre, wörtlich genommen, legen den Auszug auf 1446 v. Chr., den herkömmlichen Punkt der Auszugs-Tour der Karte; viele Gelehrte nehmen die Zahl als runde Zahl für zwölf Generationen und datieren den Auszug später, sodass das Datum des Tempels auf der Chronologie der Könige beruht, nicht auf dieser Zahl, und manche Chronologien setzen Salomos Thronbesteigung einige Jahre nach Thiele. Von Salomos Bau ist nichts identifiziert: Seine Stätte liegt unter der Plattform, auf der Herodes der Große den Zweiten Tempel ab etwa 20 v. Chr. neu errichtete. Dieser Zweite Tempel, um 516 v. Chr. vollendet, wurde seinerseits 70 n. Chr. von den Römern zerstört."
  fr:
    - "Salomon commença le Temple la quatrième année de son règne, vers 966 av. J.-C. selon la chronologie de Thiele que suit la carte (règne de Salomon vers 970–931 av. J.-C.), et l’acheva sept ans plus tard, vers 959 av. J.-C. Il se dressa sur la colline au nord de la Cité de David, le mont du Temple, jusqu’à ce que les Babyloniens le brûlent en 587 ou 586 av. J.-C. (l’année est discutée), quelque 370 à 380 ans plus tard."
    - "Le livre des Rois le date deux fois : « Ce fut la quatre cent quatre-vingtième année après la sortie des enfants d’Israël du pays d’Égypte que Salomon bâtit la maison à l’Éternel, la quatrième année de son règne sur Israël, au mois de Ziv, qui est le second mois », et « la onzième année, au mois de Bul, qui est le huitième mois, la maison fut achevée dans toutes ses parties … Salomon la construisit dans l’espace de sept ans ». Hiram, roi de Tyr, fournit le cèdre et les artisans, et le Temple fut dédié à la fête du septième mois, quand l’arche fut montée de la Cité de David et que la nuée remplit la maison."
    - "Les 480 ans, pris à la lettre, placent l’Exode en 1446 av. J.-C., repère conventionnel du parcours de l’Exode sur la carte ; beaucoup de savants y voient un chiffre rond de douze générations et datent l’Exode plus tard, de sorte que la date du Temple repose sur la chronologie des rois, non sur lui, et certaines chronologies placent l’avènement de Salomon quelques années après celui de Thiele. Rien de la construction de Salomon n’a été identifié : son emplacement se trouve sous la plate-forme sur laquelle Hérode le Grand rebâtit le second Temple à partir de 20 av. J.-C. environ. Ce second Temple, achevé vers 516 av. J.-C., fut lui-même détruit par les Romains en 70 apr. J.-C."
  pl:
    - "Salomon rozpoczął budowę Świątyni w czwartym roku swego panowania, około 966 p.n.e. według chronologii Thielego, za którą idzie mapa (panowanie Salomona ok. 970–931 p.n.e.), i ukończył ją siedem lat później, około 959 p.n.e. Stała na wzgórzu na północ od Miasta Dawida, Wzgórzu Świątynnym, aż Babilończycy spalili ją w 587 lub 586 p.n.e. (rok jest sporny), jakieś 370 do 380 lat później."
    - "Księgi Królewskie datują ją dwukrotnie: „czterechsetnego i ośmdziesiątego roku po wyjściu synów Izraelskich z ziemi Egipskiej, miesiąca Kwietnia (ten jest miesiąc wtóry,) roku czwartego królowania Salomonowego nad Izraelem, że począł budować dom Panu” oraz „A roku jedenastego, miesiąca Października, (ten jest miesiąc ósmy,) dokonany jest dom ze wszystkiem naczyniem jego i ze wszystkiem, co do niego należało. A budował go przez siedm lat”. Hiram, król Tyru, dostarczył cedru i rzemieślników, a Świątynię poświęcono na święcie w siódmym miesiącu, gdy arkę przeniesiono z Miasta Dawida i obłok napełnił dom."
    - "480 lat, rozumiane dosłownie, umieszcza Wyjście w 1446 p.n.e., punkcie umownym trasy Wyjścia na mapie; wielu uczonych uważa tę liczbę za okrągłą, dwanaście pokoleń, i datuje Wyjście później, więc data Świątyni opiera się na chronologii królów, a nie na niej, a niektóre chronologie umieszczają wstąpienie Salomona na tron o kilka lat później niż u Thielego. Z budowli Salomona nic nie zidentyfikowano: jej miejsce leży pod platformą, na której Herod Wielki odbudował Drugą Świątynię od około 20 p.n.e. Ta Druga Świątynia, ukończona około 516 p.n.e., sama została zniszczona przez Rzymian w 70 n.e."
  it:
    - "Salomone iniziò il Tempio nel quarto anno del suo regno, circa il 966 a.C. secondo la cronologia di Thiele che la mappa segue (regno di Salomone circa 970–931 a.C.), e lo terminò sette anni dopo, circa il 959 a.C. Sorgeva sul colle a nord della Città di Davide, il Monte del Tempio, finché i Babilonesi lo bruciarono nel 587 o 586 a.C. (l’anno è discusso), circa 370–380 anni dopo."
    - "Il libro dei Re lo data due volte: «il quattrocentottantesimo anno dopo l’uscita dei figliuoli d’Israele dal paese d’Egitto, nel quarto anno del suo regno sopra Israele, nel mese di Ziv, che è il secondo mese, Salomone cominciò a costruire la casa consacrata all’Eterno», e «l’undecimo anno, nel mese di Bul, che è l’ottavo mese, la casa fu terminata in tutte le sue parti … Salomone mise sette anni a fabbricarla». Chiram, re di Tiro, fornì il cedro e gli artigiani, e il Tempio fu dedicato alla festa del settimo mese, quando l’arca fu portata su dalla Città di Davide e la nuvola riempì la casa."
    - "I 480 anni, presi alla lettera, pongono l’Esodo nel 1446 a.C., il punto convenzionale del percorso dell’Esodo sulla mappa; molti studiosi considerano la cifra un numero tondo di dodici generazioni e datano l’Esodo più tardi, così la data del Tempio poggia sulla cronologia dei re, non su di essa, e alcune cronologie pongono l’ascesa di Salomone alcuni anni dopo Thiele. Nulla della costruzione di Salomone è stato identificato: il suo sito giace sotto la piattaforma su cui Erode il Grande ricostruì il Secondo Tempio dal 20 a.C. circa. Quel Secondo Tempio, finito intorno al 516 a.C., fu a sua volta distrutto dai Romani nel 70 d.C."
  nl:
    - "Salomo begon de tempel in het vierde jaar van zijn regering, omstreeks 966 v.Chr. volgens de chronologie van Thiele die de kaart volgt (Salomo’s regering ca. 970–931 v.Chr.), en voltooide hem zeven jaar later, omstreeks 959 v.Chr. Hij stond op de heuvel ten noorden van de Stad van David, de Tempelberg, tot de Babyloniërs hem in 587 of 586 v.Chr. (het jaar is omstreden) in brand staken, zo’n 370 tot 380 jaar later."
    - "Het boek Koningen dateert hem tweemaal: “in het vierhonderd en tachtigste jaar, na den uitgang der kinderen Israëls uit Egypte, in het vierde jaar van het koninkrijk van Salomo over Israël, in de maand Ziv (deze is de tweede maand), dat hij het huis des HEEREN bouwde”, en “in het elfde jaar, in de maand Bul, welke is de achtste maand, was dit huis volmaakt, naar al zijn stukken en naar al zijn behoren; alzo heeft hij zeven jaren daaraan gebouwd.” Hiram, koning van Tyrus, leverde het cederhout en de ambachtslieden, en de tempel werd ingewijd op het feest in de zevende maand, toen de ark uit de Stad van David werd opgebracht en de wolk het huis vervulde."
    - "De 480 jaar, letterlijk genomen, plaatsen de uittocht in 1446 v.Chr., het conventionele punt van de uittochtroute op de kaart; veel geleerden zien het getal als een rond getal van twaalf generaties en dateren de uittocht later, zodat de datering van de tempel steunt op de chronologie van de koningen, niet daarop, en sommige chronologieën plaatsen Salomo’s troonsbestijging enkele jaren na die van Thiele. Niets van Salomo’s bouwwerk is geïdentificeerd: de plaats ervan ligt onder het platform waarop Herodes de Grote omstreeks 20 v.Chr. de Tweede Tempel herbouwde. Die Tweede Tempel, omstreeks 516 v.Chr. voltooid, werd zelf in 70 n.Chr. door de Romeinen verwoest."
  cs:
    - "Šalomoun začal chrám stavět ve čtvrtém roce své vlády, asi 966 př. n. l. podle Thieleho chronologie, kterou mapa sleduje (Šalomounova vláda asi 970–931 př. n. l.), a dokončil jej o sedm let později, asi 959 př. n. l. Stál na pahorku severně od Města Davidova, na Chrámové hoře, dokud jej Babyloňané nespálili roku 587 nebo 586 př. n. l. (rok je sporný), zhruba 370 až 380 let poté."
    - "Kniha Královská jej datuje dvakrát: „léta čtyřstého osmdesátého po vyjití synů Izraelských z země Egyptské, že Šalomoun měsíce Ziv, (jenž jest měsíc druhý), čtvrtého léta kralování svého nad Izraelem, počal stavěti domu Hospodinova“ a „léta jedenáctého, měsíce Bul, (jenž jest měsíc osmý), dokonán jest dům se všemi přípravami svými, a se vším tím, což k němu přináleželo … kterýž stavěl sedm let“. Chíram, král Týru, dodal cedry a řemeslníky a chrám byl vysvěcen o slavnosti sedmého měsíce, kdy byla truhla přenesena z Města Davidova a oblak naplnil dům."
    - "Čtyři sta osmdesát let doslova klade exodus do roku 1446 př. n. l., smluvního bodu exodu na mapě; mnozí badatelé berou toto číslo za kulaté číslo dvanácti generací a exodus kladou později, takže datum chrámu spočívá na chronologii králů, nikoli na něm, a některé chronologie kladou Šalomounův nástup o několik let později než Thiele. Nic ze Šalomounovy stavby nebylo identifikováno: její místo leží pod terasou, na níž Herodes Veliký od asi 20 př. n. l. přestavěl druhý chrám. Tento druhý chrám, dokončený asi 516 př. n. l., byl sám zničen Římany roku 70 n. l."
