id: where-were-the-philistine-cities
question:
  en: "Where were the five Philistine cities?"
  ru: "Где находились пять филистимских городов?"
  uk: "Де були п'ять філістимських міст?"
  es: "¿Dónde estaban las cinco ciudades filisteas?"
  pt: "Onde ficavam as cinco cidades filisteias?"
  de: "Wo lagen die fünf Philisterstädte?"
  fr: "Où se trouvaient les cinq villes philistines ?"
  pl: "Gdzie leżało pięć miast filistyńskich?"
  it: "Dove si trovavano le cinque città filistee?"
  cs: "Kde bylo pět pelištejských měst?"
  nl: "Waar lagen de vijf Filistijnse steden?"
  sv: "Var låg de fem filisteiska städerna?"
  nb: "Hvor lå de fem filisterbyene?"
  tl: "Nasaan ang limang lungsod ng mga Filisteo?"
  da: "Hvor lå de fem filisterbyer?"
  sr: "Где је било пет филистејских градова?"
  hu: "Hol voltak az öt filiszteus város?"
  fi: "Missä viisi filistealaiskaupunkia sijaitsi?"
  vi: "Năm thành của người Phi-li-tin ở đâu?"
  ro: "Unde se aflau cele cinci cetăți filistene?"
  bg: "Къде са се намирали петте филистимски града?"
answer:
  en:
    - "The five Philistine cities were Gaza, Ashkelon, Ashdod, Ekron and Gath, all on the southern coastal plain of today's Gaza Strip and Israel, within a strip about 50 km long between Gaza in the south-west and Ekron in the north-east."
    - 'Joshua names "five lords of the Philistines; the Gazathites, and the Ashdothites, the Eshkalonites, the Gittites, and the Ekronites", and the same five send a golden offering with the returned ark in 1 Samuel. The Philistines settled these cities in the twelfth century BC. Gaza lies under the modern city of Gaza, the last town on the road from Egypt before the desert. Ashkelon is Tel Ashkelon on the shore, now a national park inside the modern city. Ashdod is Tel Ashdod a few kilometres inland, south of the modern city of that name.'
    - "The two inland cities were found more recently. Ekron is Tel Miqne, about 35 km west of Jerusalem, where an inscription found in 1996 names Achish son of Padi, ruler of Ekron, and settles the identification. Gath, the home of Goliath, is identified with Tell es-Safi, about 9 km south of Ekron, where the Elah valley opens onto the plain; after other sites were tried this is now widely accepted. Gath was destroyed in the late ninth century BC, when Hazael of Syria took it, and the later prophets name only four cities. Ashkelon and Ekron were burned by Nebuchadnezzar about 604 BC."
  ru:
    - "Пять филистимских городов — Газа, Аскалон, Азот, Екрон и Геф; все они на южной приморской равнине, в нынешнем секторе Газа и Израиле, на полосе длиной около 50 км от Газы на юго-западе до Екрона на северо-востоке."
    - "Книга Иисуса Навина называет «пять владельцев Филистимских: Газский, Азотский, Аскалонский, Гефский, Екронский», и те же пять городов посылают золотое приношение вместе с возвращённым ковчегом в 1-й книге Царств. Филистимляне заселили эти города в XII веке до н. э. Газа лежит под нынешним городом Газа, последним на дороге из Египта перед пустыней. Аскалон — Тель-Ашкелон на берегу, теперь национальный парк внутри современного города. Азот — Тель-Ашдод в нескольких километрах от моря, южнее нынешнего Ашдода."
    - "Два города в глубине равнины найдены позже. Екрон — это Тель-Микне, примерно в 35 км к западу от Иерусалима; найденная там в 1996 году надпись называет Ахиша, сына Пади, правителя Екрона, и закрепляет отождествление. Геф, родина Голиафа, отождествляется с Телль-эс-Сафи примерно в 9 км к югу от Екрона, где долина Дуба (Эла) выходит на равнину; после проб других мест это отождествление теперь принято большинством. Геф был разрушен в конце IX века до н. э., когда его взял Азаил Сирийский, и поздние пророки называют лишь четыре города. Аскалон и Екрон сжёг Навуходоносор около 604 г. до н. э."
  uk:
    - "П'ятьма філістимськими містами були Газа, Ашкелон, Ашдод, Екрон і Гат, усі на південній прибережній рівнині нинішньої смуги Гази та Ізраїлю, у смузі завдовжки приблизно 50 км між Газою на південному заході та Екроном на північному сході."
    - "Книга Ісуса Навина називає «пять князїв Филистимських у нїй: Газський, Азотський, Аскалонський, Гетський, Екронський», і ті самі п'ять надсилають золоту жертву з повернутим ковчегом у Першій книзі Самуїла. Філістимляни оселилися в цих містах у XII ст. до н. е. Газа лежить під сучасним містом Газа, останнім містом на дорозі з Єгипту перед пустелею. Ашкелон — це Тель-Ашкелон на березі, нині національний парк у межах сучасного міста. Ашдод — це Тель-Ашдод за кілька кілометрів углиб суходолу, на південь від сучасного міста з такою назвою."
    - "Два внутрішні міста було знайдено пізніше. Екрон — це Тель-Мікне, приблизно за 35 км на захід від Єрусалима, де напис, знайдений 1996 р., називає Анхуса, сина Паді, правителя Екрона, і закріплює ототожнення. Гат, батьківщину Голіята, ототожнюють з Телль-ес-Сафі, приблизно за 9 км на південь від Екрона, де долина Іла виходить на рівнину; після того як пробували інші місця, це нині широко визнають. Гат було зруйновано наприкінці IX ст. до н. е., коли Азаїл Сирійський взяв його, і пізніші пророки називають лише чотири міста. Ашкелон і Екрон спалив Навуходоносор близько 604 р. до н. е."
  es:
    - "Las cinco ciudades filisteas eran Gaza, Ascalón, Asdod, Ecrón y Gat, todas en la llanura costera meridional de la actual franja de Gaza e Israel, dentro de una franja de unos 50 km de largo entre Gaza, al suroeste, y Ecrón, al noreste."
    - "Josué nombra «cinco provincias de los Philisteos; los Gazeos, Asdodios, Ascalonitas, Getheos, y Accaronitas», y las mismas cinco envían una ofrenda de oro con el arca devuelta en 1 Samuel. Los filisteos se asentaron en estas ciudades en el siglo XII a. C. Gaza yace bajo la ciudad moderna de Gaza, la última ciudad en el camino de Egipto antes del desierto. Ascalón es Tel Ascalón, en la costa, hoy un parque nacional dentro de la ciudad moderna. Asdod es Tel Asdod, unos kilómetros tierra adentro, al sur de la ciudad moderna del mismo nombre."
    - "Las dos ciudades del interior se hallaron más recientemente. Ecrón es Tel Miqne, a unos 35 km al oeste de Jerusalén, donde una inscripción hallada en 1996 nombra a Aquis hijo de Padi, gobernante de Ecrón, y zanja la identificación. Gat, la patria de Goliat, se identifica con Tell es-Safi, a unos 9 km al sur de Ecrón, donde el valle de Ela se abre a la llanura; tras probarse otros lugares, esto se acepta hoy ampliamente. Gat fue destruida a finales del siglo IX a. C., cuando la tomó Hazael de Siria, y los profetas posteriores nombran solo cuatro ciudades. Ascalón y Ecrón fueron incendiadas por Nabucodonosor hacia el 604 a. C."
  pt:
    - "As cinco cidades filisteias eram Gaza, Ascalom, Asdode, Ecrom e Gate, todas na planície costeira meridional da atual Faixa de Gaza e de Israel, numa faixa de cerca de 50 km de comprimento entre Gaza, no sudoeste, e Ecrom, no nordeste."
    - "Josué nomeia “os cinco senhores dos filisteus; os gazeus, os asdoditas, os asquelonitas, os geteus e os ecronitas”, e os mesmos cinco enviam uma oferta de ouro com a arca devolvida em 1 Samuel. Os filisteus se estabeleceram nessas cidades no século XII a.C. Gaza jaz sob a cidade moderna de Gaza, a última cidade na estrada do Egito antes do deserto. Ascalom é Tel Ashkelon, na costa, hoje um parque nacional dentro da cidade moderna. Asdode é Tel Ashdod, a alguns quilômetros para o interior, ao sul da cidade moderna de mesmo nome."
    - "As duas cidades do interior foram encontradas mais recentemente. Ecrom é Tel Miqne, a cerca de 35 km a oeste de Jerusalém, onde uma inscrição encontrada em 1996 nomeia Aquis, filho de Padi, governante de Ecrom, e resolve a identificação. Gate, a terra de Golias, é identificada com Tell es-Safi, a cerca de 9 km ao sul de Ecrom, onde o vale de Elá se abre para a planície; depois de outros sítios terem sido tentados, isso é hoje amplamente aceito. Gate foi destruída no fim do século IX a.C., quando Hazael da Síria a tomou, e os profetas posteriores nomeiam apenas quatro cidades. Ascalom e Ecrom foram queimadas por Nabucodonosor por volta de 604 a.C."
  de:
    - "Die fünf Philisterstädte waren Gaza, Aschkelon, Aschdod, Ekron und Gat, alle auf der südlichen Küstenebene des heutigen Gazastreifens und Israels, innerhalb eines etwa 50 km langen Streifens zwischen Gaza im Südwesten und Ekron im Nordosten."
    - "Josua nennt „fünf Herren der Philister, nämlich der Gaziter, der Asdoditer, der Askaloniter, der Gathiter der Ekroniter“, und dieselben fünf senden im Ersten Buch Samuel ein goldenes Geschenk mit der zurückgebrachten Lade. Die Philister besiedelten diese Städte im 12. Jahrhundert v. Chr. Gaza liegt unter der modernen Stadt Gaza, der letzten Stadt an der Straße von Ägypten vor der Wüste. Aschkelon ist Tel Aschkelon am Strand, heute ein Nationalpark innerhalb der modernen Stadt. Aschdod ist Tel Aschdod einige Kilometer landeinwärts, südlich der gleichnamigen modernen Stadt."
    - "Die beiden Städte im Landesinneren wurden erst später gefunden. Ekron ist Tel Miqne, etwa 35 km westlich von Jerusalem, wo eine 1996 gefundene Inschrift Achis, den Sohn des Padi, Herrscher von Ekron, nennt und die Gleichsetzung sichert. Gat, die Heimat des Goliat, wird mit Tell es-Safi gleichgesetzt, etwa 9 km südlich von Ekron, wo sich das Elatal zur Ebene öffnet; nachdem andere Orte erprobt wurden, ist dies heute weithin akzeptiert. Gat wurde im späten 9. Jahrhundert v. Chr. zerstört, als Hasael von Syrien es nahm, und die späteren Propheten nennen nur vier Städte. Aschkelon und Ekron verbrannte Nebukadnezar um 604 v. Chr."
  fr:
    - "Les cinq villes philistines étaient Gaza, Askalon, Asdod, Ékron et Gath, toutes situées dans la plaine côtière méridionale de l’actuelle bande de Gaza et d’Israël, dans une bande d’environ 50 km de long entre Gaza au sud-ouest et Ékron au nord-est."
    - "Josué nomme « les cinq princes des Philistins, celui de Gaza, celui d’Asdod, celui d’Askalon, celui de Gath et celui d’Ékron », et les mêmes cinq envoient une offrande d’or avec l’arche renvoyée dans le premier livre de Samuel. Les Philistins s’établirent dans ces villes au XIIe siècle av. J.-C. Gaza se trouve sous la ville moderne de Gaza, dernière ville sur la route d’Égypte avant le désert. Askalon est Tel Ashkelon, sur le rivage, aujourd’hui un parc national à l’intérieur de la ville moderne. Asdod est Tel Ashdod, à quelques kilomètres à l’intérieur des terres, au sud de la ville moderne de ce nom."
    - "Les deux villes de l’intérieur ont été retrouvées plus récemment. Ékron est Tel Miqne, à environ 35 km à l’ouest de Jérusalem, où une inscription trouvée en 1996 nomme Akisch, fils de Padi, souverain d’Ékron, et règle l’identification. Gath, patrie de Goliath, est identifiée à Tell es-Safi, à environ 9 km au sud d’Ékron, là où la vallée d’Éla débouche sur la plaine ; après que d’autres sites eurent été essayés, cette identification est aujourd’hui largement admise. Gath fut détruite à la fin du IXe siècle av. J.-C., quand Hazaël de Syrie la prit, et les prophètes plus tardifs ne nomment que quatre villes. Askalon et Ékron furent incendiées par Nebucadnetsar vers 604 av. J.-C."
  pl:
    - "Pięć miast filistyńskich to Gaza, Aszkelon, Aszdod, Ekron i Gat, wszystkie na południowej równinie nadmorskiej dzisiejszej Strefy Gazy i Izraela, w pasie długim na około 50 km między Gazą na południowym zachodzie a Ekronem na północnym wschodzie."
    - "Jozue wymienia „pięcioro księstw Filistyńskich; Asackie, i Asdodziejskie, Askalońskie, Getejskie, i Akaronicki”, a te same pięć wysyła złotą ofiarę z odesłaną arką w 1 Księdze Samuela. Filistyni osiedlili się w tych miastach w XII wieku p.n.e. Gaza leży pod współczesnym miastem Gaza, ostatnim miastem na drodze z Egiptu przed pustynią. Aszkelon to Tel Ashkelon na wybrzeżu, dziś park narodowy wewnątrz współczesnego miasta. Aszdod to Tel Ashdod kilka kilometrów w głąb lądu, na południe od współczesnego miasta tej nazwy."
    - "Dwa miasta śródlądowe odnaleziono później. Ekron to Tel Miqne, około 35 km na zachód od Jerozolimy, gdzie napis znaleziony w 1996 wymienia Achisza syna Padiego, władcę Ekronu, i rozstrzyga utożsamienie. Gat, ojczyznę Goliata, utożsamia się z Tell es-Safi, około 9 km na południe od Ekronu, gdzie dolina Ela otwiera się na równinę; po wypróbowaniu innych miejsc jest to dziś powszechnie przyjęte. Gat zniszczono pod koniec IX wieku p.n.e., gdy zajął je Chazael z Syrii, a późniejsi prorocy wymieniają tylko cztery miasta. Aszkelon i Ekron spalił Nabuchodonozor około 604 p.n.e."
  it:
    - "Le cinque città filistee erano Gaza, Ascalona, Asdod, Ekron e Gat, tutte sulla pianura costiera meridionale dell’odierna Striscia di Gaza e di Israele, entro una fascia lunga circa 50 km tra Gaza a sud-ovest ed Ekron a nord-est."
    - "Giosuè nomina «i cinque principi dei Filistei: a quello di Gaza, a quello di Asdod, a quello di Askalon, a quello di Gath, a quello di Ekron», e gli stessi cinque mandano un’offerta d’oro con l’arca restituita in 1 Samuele. I Filistei si stabilirono in queste città nel XII secolo a.C. Gaza giace sotto la città moderna di Gaza, l’ultima città sulla strada dall’Egitto prima del deserto. Ascalona è Tel Ashkelon sulla costa, oggi un parco nazionale all’interno della città moderna. Asdod è Tel Ashdod, a qualche chilometro nell’entroterra, a sud della città moderna omonima."
    - "Le due città dell’interno furono trovate più di recente. Ekron è Tel Miqne, a circa 35 km a ovest di Gerusalemme, dove un’iscrizione trovata nel 1996 nomina Achis figlio di Padi, governatore di Ekron, e risolve l’identificazione. Gat, la patria di Golia, si identifica con Tell es-Safi, a circa 9 km a sud di Ekron, dove la valle di Ela si apre sulla pianura; dopo che furono provati altri siti, questa è ora largamente accettata. Gat fu distrutta alla fine del IX secolo a.C., quando Cazaèl di Siria la prese, e i profeti successivi nominano solo quattro città. Ascalona ed Ekron furono bruciate da Nabucodonosor verso il 604 a.C."
  cs:
    - "Pět pelištejských měst byla Gaza, Aškelon, Ašdod, Ekron a Gat, všechna na jižní pobřežní rovině dnešního Pásma Gazy a Izraele, v pásu dlouhém asi 50 km mezi Gazou na jihozápadě a Ekronem na severovýchodě."
    - "Jozue jmenuje „patero knížetství Filistinských: Gazejské, Azotské, Aškalonitské, Getejské a Akaronitské“ a týchž pět posílá zlatý dar s vrácenou truhlou v 1. knize Samuelově. Pelištejci tato města osídlili ve 12. století př. n. l. Gaza leží pod moderní Gazou, posledním městem na cestě z Egypta před pouští. Aškelon je Tel Aškelon na břehu, nyní národní park uvnitř moderního města. Ašdod je Tel Ašdod několik kilometrů ve vnitrozemí, jižně od moderního města téhož jména."
    - "Dvě vnitrozemská města byla nalezena později. Ekron je Tel Miqne, asi 35 km západně od Jeruzaléma, kde nápis nalezený roku 1996 jmenuje Achiše, syna Padiova, vládce Ekronu, a ztotožnění rozhodl. Gat, domov Goliášův, se ztotožňuje s Tell es-Safí, asi 9 km jižně od Ekronu, kde se Élské údolí otevírá do roviny; poté, co byla zkoušena jiná místa, je to nyní široce přijímáno. Gat byl zničen koncem 9. století př. n. l., kdy ho dobyl Chazael Syrský, a pozdější proroci jmenují jen čtyři města. Aškelon a Ekron vypálil Nebukadnesar kolem roku 604 př. n. l."
  nl:
    - "De vijf Filistijnse steden waren Gaza, Askelon, Asdod, Ekron en Gat, alle op de zuidelijke kustvlakte van de huidige Gazastrook en Israël, binnen een strook van ongeveer 50 km lang tussen Gaza in het zuidwesten en Ekron in het noordoosten."
    - "Jozua noemt “vijf vorsten der Filistijnen, de Gazatiet en Asdodiet, de Askeloniet, de Gathiet en Ekroniet”, en dezelfde vijf sturen in 1 Samuël een gouden offer mee met de teruggekeerde ark. De Filistijnen vestigden zich in deze steden in de twaalfde eeuw v.Chr. Gaza ligt onder de moderne stad Gaza, de laatste stad aan de weg uit Egypte vóór de woestijn. Askelon is Tel Ashkelon aan de kust, nu een nationaal park binnen de moderne stad. Asdod is Tel Ashdod enkele kilometers landinwaarts, ten zuiden van de moderne stad met die naam."
    - "De twee steden in het binnenland werden recenter gevonden. Ekron is Tel Miqne, ongeveer 35 km ten westen van Jeruzalem, waar een in 1996 gevonden inscriptie Achis, zoon van Padi, heerser van Ekron, noemt en de identificatie vaststelt. Gat, de woonplaats van Goliat, wordt geïdentificeerd met Tell es-Safi, ongeveer 9 km ten zuiden van Ekron, waar de vallei van Ela op de vlakte uitkomt; nadat andere plaatsen waren geprobeerd, wordt dit nu algemeen aanvaard. Gat werd aan het eind van de negende eeuw v.Chr. verwoest, toen Hazaël van Syrië het innam, en de latere profeten noemen slechts vier steden. Askelon en Ekron werden omstreeks 604 v.Chr. door Nebukadnessar verbrand."
  sv:
    - "De fem filisteiska städerna var Gaza, Ashkelon, Ashdod, Ekron och Gat, alla på södra kustslätten i dagens Gazaremsan och Israel, inom en remsa omkring 50 km lång mellan Gaza i sydväst och Ekron i nordost."
    - "Josua nämner ”filistéernas fem hövdingar innehava – den i Gasa, den i Asdod, den i Askelon, den i Gat och den i Ekron”, och samma fem sände en gyllene gåva med den återlämnade arken i 1 Samuelsboken. Filistéerna bosatte sig i dessa städer på 1100-talet f.Kr. Gaza ligger under den moderna staden Gaza, den sista staden på vägen från Egypten före öknen. Ashkelon är Tel Ashkelon vid stranden, nu en nationalpark inne i den moderna staden. Ashdod är Tel Ashdod några kilometer inåt landet, söder om den moderna staden med samma namn."
    - "De två inlandsstäderna hittades senare. Ekron är Tel Miqne, omkring 35 km väster om Jerusalem, där en inskription som hittades 1996 nämner Akish, Padis son, härskare över Ekron, och avgör identifieringen. Gat, Goljats hem, identifieras med Tell es-Safi, omkring 9 km söder om Ekron, där Elas dal öppnar sig mot slätten; sedan andra platser prövats är detta nu vitt godtaget. Gat förstördes i slutet av 800-talet f.Kr., då Hasael av Syrien intog det, och de senare profeterna nämner bara fyra städer. Ashkelon och Ekron brändes av Nebukadnessar omkring 604 f.Kr."
  nb:
    - "De fem filisterbyene var Gasa, Asjkelon, Asjdod, Ekron og Gat, alle på den sørlige kystsletten i dagens Gasastripen og Israel, innenfor en stripe på omtrent 50 km mellom Gasa i sørvest og Ekron i nordøst."
    - "Josva nevner «de fem filisterfyrster i Gasa og Asdod og Askalon og Gat og Ekron», og de samme fem sender en gullgave med den tilbakeførte arken i 1 Samuelsbok. Filistrene slo seg ned i disse byene på 1100-tallet f.Kr. Gasa ligger under den moderne byen Gasa, den siste byen ved veien fra Egypt før ørkenen. Asjkelon er Tel Ashkelon ved kysten, nå en nasjonalpark inne i den moderne byen. Asjdod er Tel Ashdod noen kilometer inne i landet, sør for den moderne byen med samme navn."
    - "De to byene inne i landet ble funnet senere. Ekron er Tel Miqne, omtrent 35 km vest for Jerusalem, der en innskrift funnet i 1996 nevner Akisj, Padis sønn, hersker over Ekron, og avgjør identifiseringen. Gat, Goliats hjemby, identifiseres med Tell es-Safi, omtrent 9 km sør for Ekron, der Ela-dalen åpner seg mot sletten; etter at andre steder var prøvd, er dette nå vidt akseptert. Gat ble ødelagt sent på 800-tallet f.Kr., da Hasael av Syria inntok den, og de senere profetene nevner bare fire byer. Asjkelon og Ekron ble brent av Nebukadnesar omkring 604 f.Kr."
  tl:
    - "Ang limang lungsod ng mga Filisteo ay ang Gaza, Ascalon, Asdod, Ecron at Gath, na pawang nasa katimugang kapatagang baybayin ng Gaza Strip at Israel ngayon, sa isang guhit na mga 50 km ang haba sa pagitan ng Gaza sa timog-kanluran at Ecron sa hilagang-silangan."
    - "Pinangalanan ni Josue ang “limang pangulo ng mga Filisteo, ang mga Gazeo, ang mga Asdodeo, ang mga Ascaloneo, ang mga Getheo, ang mga Accaronneo”, at ang parehong lima ay nagpapadala ng gintong handog kasama ng ibinalik na kaban sa 1 Samuel. Itinatag ng mga Filisteo ang mga lungsod na ito noong ika-12 siglo BK. Ang Gaza ay nasa ilalim ng makabagong Gaza, ang huling bayan sa daan mula sa Egipto bago ang disyerto. Ang Ascalon ay Tel Ashkelon sa baybayin, pambansang liwasan na ngayon sa loob ng makabagong lungsod. Ang Asdod ay Tel Ashdod ilang kilometro sa loob ng lupain, sa timog ng makabagong lungsod na may gayong pangalan."
    - "Mas bago ang pagkakatuklas sa dalawang lungsod sa loob ng lupain. Ang Ecron ay Tel Miqne, mga 35 km sa kanluran ng Jerusalem, kung saan ang isang inskripsiyong natagpuan noong 1996 ay nagpapangalan kay Achis na anak ni Padi, pinuno ng Ecron, at nagtatakda ng pagkakakilanlan. Ang Gath, tahanan ni Goliath, ay kinikilala sa Tell es-Safi, mga 9 km sa timog ng Ecron, kung saan bumubukas ang lambak ng Ela sa kapatagan; pagkatapos subukan ang ibang pook, malawak na itong tinatanggap. Nawasak ang Gath sa huling bahagi ng ika-9 na siglo BK, nang kunin ito ni Hazael ng Siria, at apat na lungsod lamang ang pinangalanan ng mga huling propeta. Sinunog ni Nabucodonosor ang Ascalon at Ecron noong mga 604 BK."
  da:
    - "De fem filisterbyer var Gaza, Askalon, Asdod, Ekron og Gat, alle på den sydlige kystslette i nutidens Gazastrimlen og Israel, inden for en strimmel på ca. 50 km mellem Gaza i sydvest og Ekron i nordøst."
    - "Josva nævner »de fem Filisters Fyrster: Den Gaziter og den Asdoditer, den Askloniter, den Gathiter og den Ekroniter«, og de samme fem sender en gylden gave med den hjemsendte ark i Første Samuelsbog. Filisterne bosatte sig i disse byer i 1100-tallet f.Kr. Gaza ligger under den moderne by Gaza, den sidste by på vejen fra Egypten før ørkenen. Askalon er Tel Ashkelon ved kysten, nu en nationalpark inde i den moderne by. Asdod er Tel Ashdod nogle få kilometer inde i landet, syd for den moderne by af samme navn."
    - "De to indlandsbyer blev fundet senere. Ekron er Tel Miqne, ca. 35 km vest for Jerusalem, hvor en indskrift fundet i 1996 nævner Akisj, søn af Padi, hersker over Ekron, og afgør identifikationen. Gat, Goliats hjemby, identificeres med Tell es-Safi, ca. 9 km syd for Ekron, hvor Terebintedalen åbner sig mod sletten; efter at andre steder var prøvet, er dette nu bredt accepteret. Gat blev ødelagt i slutningen af 800-tallet f.Kr., da Hazael af Syrien indtog den, og de senere profeter nævner kun fire byer. Askalon og Ekron blev brændt af Nebukadnezar omkring 604 f.Kr."
  sr:
    - "Пет филистејских градова били су Газа, Ашкелон, Азот, Акарон и Гат, сви на јужној приобалној равници данашњег појаса Газе и Израела, у појасу дугом око 50 км између Газе на југозападу и Акарона на североистоку."
    - "Исус Навин именује „пет кнежевина филистејских, газејска, азотска, аскалонска, гетејска и акаронска“, а истих пет шаље златни принос с враћеним ковчегом у Првој књизи Самуиловој. Филистеји су ове градове населили у дванаестом веку п. н. е. Газа лежи испод савремене Газе, последњег града на путу из Египта пре пустиње. Ашкелон је Тел Ашкелон на обали, сада национални парк унутар савременог града. Азот је Тел Азот неколико километара у унутрашњости, јужно од савременог града тог имена."
    - "Два унутрашња града пронађена су скорије. Акарон је Тел Микне, око 35 км западно од Јерусалима, где натпис пронађен 1996. именује Ахиса сина Падијевог, владара Акарона, и разрешава поистовећење. Гат, дом Голијатов, поистовећује се са Тел ес-Сафијем, око 9 км јужно од Акарона, где се долина Ила отвара на равницу; пошто су пробана друга места, то се данас широко прихвата. Гат је разорен крајем деветог века п. н. е., кад га је заузео Азаило Сиријски, а каснији пророци именују само четири града. Ашкелон и Акарон спалио је Навуходоносор око 604. п. н. е."
  hu:
    - "Az öt filiszteus város Gáza, Askelón, Asdód, Ekron és Gát volt, mind a mai Gázai övezet és Izrael déli tengerparti síkságán, egy mintegy 50 km hosszú sávon belül, délnyugaton Gáza és északkeleten Ekron között."
    - "Józsué megnevezi „a Filiszteusok öt fejedelemsége: a Gázáé, Asdódé, Askelóné, Gáthé, Ekroné”, és ugyanez az öt küld aranyajándékot a visszaküldött ládával a Sámuel első könyvében. A filiszteusok a Kr. e. 12. században telepedtek meg ezekben a városokban. Gáza a mai Gáza város alatt fekszik, az utolsó város az Egyiptomból vezető úton a sivatag előtt. Askelón a parti Tel Ashkelon, ma nemzeti park a modern városon belül. Asdód a Tel Ashdod néhány kilométerre a szárazföld belsejében, az azonos nevű mai várostól délre."
    - "A két szárazföldi várost újabban találták meg. Ekron a Tel Miqne, Jeruzsálemtől mintegy 35 km-re nyugatra, ahol egy 1996-ban talált felirat Ekron uralkodóját, Ákist, Padi fiát nevezi meg, és eldönti az azonosítást. Gát, Góliát hazája, a Tell es-Safival azonosítható, Ekrontól mintegy 9 km-re délre, ahol az Éla-völgy a síkságra nyílik; más helyek kipróbálása után ezt ma széles körben elfogadják. Gátot a Kr. e. 9. század végén pusztították el, amikor a szíriai Házael elfoglalta, és a későbbi próféták már csak négy várost neveznek meg. Askelónt és Ekront Nabukodonozor égette fel Kr. e. 604 körül."
  fi:
    - "Viisi filistealaiskaupunkia olivat Gaza, Askelon, Asdod, Ekron ja Gat, kaikki nykyisen Gazan kaistan ja Israelin eteläisellä rannikkotasangolla, noin 50 km pitkällä kaistaleella lounaassa olevan Gazan ja koillisessa olevan Ekronin välillä."
    - "Joosua nimeää ”ne viisi filistealaista ruhtinasta, nimittäin Gassan, Asdodin, Askelonin, Gatin ja Ekronin ruhtinaat”, ja samat viisi lähettävät kultaisen lahjan palautetun arkin mukana 1. Samuelin kirjassa. Filistealaiset asuttivat nämä kaupungit 1100-luvulla eaa. Gaza on nykyisen Gazan kaupungin alla, Egyptistä tulevan tien viimeinen kaupunki ennen autiomaata. Askelon on Tel Ashkelon rannalla, nykyisin kansallispuisto nykykaupungin sisällä. Asdod on Tel Asdod muutaman kilometrin sisämaassa saman nimisen nykykaupungin eteläpuolella."
    - "Kaksi sisämaan kaupunkia löydettiin vasta myöhemmin. Ekron on Tel Miqne, noin 35 km Jerusalemista länteen, jossa vuonna 1996 löydetty kirjoitus nimeää Akiksen, Padin pojan, Ekronin hallitsijan, ja ratkaisee tunnistuksen. Gat, Goljatin koti, tunnistetaan Tell es-Safiksi, noin 9 km Ekronista etelään, jossa Elan laakso avautuu tasangolle; muita paikkoja kokeiltuaan tämä on nyt laajalti hyväksytty. Gat tuhoutui 800-luvun lopulla eaa., kun Syyrian Hasael valtasi sen, ja myöhemmät profeetat nimeävät vain neljä kaupunkia. Nebukadnessar poltti Askelonin ja Ekronin noin 604 eaa."
  vi:
    - "Năm thành của người Phi-li-tin là Ga-xa, Ách-ca-lôn, Ách-đốt, Éc-rôn và Gát, tất cả nằm trên đồng bằng ven biển phía nam của Dải Gaza và Israel ngày nay, trong một dải dài khoảng 50 km giữa Ga-xa ở tây nam và Éc-rôn ở đông bắc."
    - "Sách Giô-suê nêu tên “năm vua Phi-li-tin, là vua Ga-xa vua Ách-đốt, vua Ách-ca-lôn, vua Gát, vua Éc-rôn”, và cũng chính năm thành ấy gửi lễ vật bằng vàng cùng hòm giao ước được trả về trong 1 Sa-mu-ên. Người Phi-li-tin định cư các thành này vào thế kỷ 12 TCN. Ga-xa nằm dưới thành phố Gaza hiện đại, thị trấn cuối cùng trên con đường từ Ê-díp-tô trước khi vào sa mạc. Ách-ca-lôn là Tel Ashkelon trên bờ biển, nay là một công viên quốc gia trong thành phố hiện đại. Ách-đốt là Tel Ashdod cách vài kilômét trong đất liền, phía nam thành phố cùng tên hiện đại."
    - "Hai thành trong đất liền được tìm thấy gần đây hơn. Éc-rôn là Tel Miqne, cách Giê-ru-sa-lem khoảng 35 km về phía tây, nơi một bản khắc tìm thấy năm 1996 nêu tên A-kích con Padi, người cai trị Éc-rôn, và chốt sự đồng nhất. Gát, quê của Gô-li-át, được đồng nhất với Tell es-Safi, cách Éc-rôn khoảng 9 km về phía nam, nơi thung lũng Ê-la mở ra đồng bằng; sau khi các địa điểm khác được thử, điều này nay được chấp nhận rộng rãi. Gát bị phá hủy vào cuối thế kỷ 9 TCN, khi Ha-xa-ên của Sy-ri chiếm nó, và các tiên tri về sau chỉ nêu bốn thành. Ách-ca-lôn và Éc-rôn bị Nê-bu-cát-nết-sa đốt khoảng năm 604 TCN."
  ro:
    - "Cele cinci cetăți filistene erau Gaza, Ascalon, Așdod, Ecron și Gat, toate pe câmpia de coastă din sud, în Fâșia Gaza și Israelul de azi, într-o fâșie lungă de circa 50 km între Gaza, în sud-vest, și Ecron, în nord-est."
    - "Iosua numește „cele cinci Domnii a Filisteilor: a Gazeului, a Azotului, a Ascalonitului, a Ghetteului și a Caronitului”, iar aceiași cinci trimit o ofrandă de aur cu chivotul întors în 1 Samuel. Filistenii s-au așezat în aceste cetăți în secolul al XII-lea î.Hr. Gaza se află sub orașul modern Gaza, ultimul oraș de pe drumul dinspre Egipt înainte de deșert. Ascalon este Tel Ashkelon, pe țărm, azi parc național în interiorul orașului modern. Așdod este Tel Ashdod, la câțiva kilometri în interior, la sud de orașul modern cu același nume."
    - "Cele două cetăți din interior au fost găsite mai recent. Ecron este Tel Miqne, la circa 35 km vest de Ierusalim, unde o inscripție găsită în 1996 îl numește pe Achiș fiul lui Padi, conducătorul Ecronului, și stabilește identificarea. Gat, patria lui Goliat, este identificat cu Tell es-Safi, la circa 9 km sud de Ecron, unde valea Elah se deschide spre câmpie; după ce au fost încercate alte locuri, aceasta este acum larg acceptată. Gat a fost distrus la sfârșitul secolului al IX-lea î.Hr., când l-a luat Hazael al Siriei, iar proorocii de mai târziu numesc doar patru cetăți. Ascalon și Ecron au fost arse de Nebucadnețar în jurul anului 604 î.Hr."
  bg:
    - "Петте филистимски града бяха Газа, Аскалон, Азот, Екрон и Гет — всички в южната крайбрежна равнина на днешната ивица Газа и Израел, в пояс, дълъг около 50 км, между Газа на югозапад и Екрон на североизток."
    - "Книга Иисус Навин назовава „петте войводства на Филистимците, на Газяните, на Азотяните, на Аскалонците, на Гетците, и на Акаронците“, а същите пет изпращат златен дар с върнатия ковчег в 1 Царе. Филистимците заселиха тези градове през XII в. пр.н.е. Газа лежи под съвременния град Газа — последния град на пътя от Египет преди пустинята. Аскалон е Тел Ашкелон на брега, днес национален парк в съвременния град. Азот е Тел Ашдод на няколко километра навътре от брега, южно от съвременния едноименен град."
    - "Двата вътрешни града са открити по-късно. Екрон е Тел Микне, на около 35 км западно от Йерусалим, където надпис, намерен през 1996 г., назовава Анхус, син на Пади, владетел на Екрон, и решава отъждествяването. Гет, родината на Голиат, се отъждествява с Тел ес-Сафи, на около 9 км южно от Екрон, там, където долината Ила се открива към равнината; след като са опитвани и други места, това днес е широко прието. Гет е разрушен в края на IX в. пр.н.е., когато Азаил Сирийски го превзе, и по-късните пророци назовават само четири града. Аскалон и Екрон са изгорени от Навуходоносор около 604 г. пр.н.е."
