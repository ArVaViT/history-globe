id: where-were-the-philistine-cities
question:
  en: "Where were the five Philistine cities?"
  ru: "Где находились пять филистимских городов?"
  uk: "Де були п'ять філістимських міст?"
  es: "¿Dónde estaban las cinco ciudades filisteas?"
  pt: "Onde ficavam as cinco cidades filisteias?"
  de: "Wo lagen die fünf Philisterstädte?"
  fr: "Où se trouvaient les cinq villes philistines ?"
answer:
  en:
    - "The five Philistine cities were Gaza, Ashkelon, Ashdod, Ekron and Gath, all on the southern coastal plain of today's Gaza Strip and Israel, within a strip about 50 km long between Gaza in the south-west and Ekron in the north-east."
    - 'Joshua names "five lords of the Philistines; the Gazathites, and the Ashdothites, the Eshkalonites, the Gittites, and the Ekronites", and the same five send a golden offering with the returned ark in 1 Samuel. The Philistines settled these cities in the twelfth century BC. Gaza lies under the modern city of Gaza, the last town on the road from Egypt before the desert. Ashkelon is Tel Ashkelon on the shore, now a national park inside the modern city. Ashdod is Tel Ashdod a few kilometres inland, south of the modern city of that name.'
    - "The two inland cities were found more recently. Ekron is Tel Miqne, about 35 km west of Jerusalem, where an inscription found in 1996 names Achish son of Padi, ruler of Ekron, and settles the identification. Gath, the home of Goliath, is identified with Tell es-Safi, about 9 km south of Ekron, where the Elah valley opens onto the plain; after other sites were tried this is now widely accepted. Gath was destroyed in the late ninth century BC, when Hazael of Syria took it, and the later prophets name only four cities. Ashkelon and Ekron were burned by Nebuchadnezzar about 604 BC."
  ru:
    - "Пять филистимских городов — Газа, Аскалон, Азот, Екрон и Геф; все они на южной приморской равнине, в нынешнем секторе Газа и Израиле, на полосе длиной около 50 км от Газы на юго-западе до Екрона на северо-востоке."
    - "Книга Иисуса Навина называет «пять владельцев Филистимских: Газский, Азотский, Аскалонский, Гефский, Екронский», и те же пять городов посылают золотое приношение вместе с возвращённым ковчегом в 1-й книге Царств. Филистимляне заселили эти города в XII веке до н. э. Газа лежит под нынешним городом Газа, последним на дороге из Египта перед пустыней. Аскалон — Тель-Ашкелон на берегу, теперь национальный парк внутри современного города. Азот — Тель-Ашдод в нескольких километрах от моря, южнее нынешнего Ашдода."
    - "Два города в глубине равнины найдены позже. Екрон — это Тель-Микне, примерно в 35 км к западу от Иерусалима; найденная там в 1996 году надпись называет Ахиша, сына Пади, правителя Екрона, и закрепляет отождествление. Геф, родина Голиафа, отождествляется с Телль-эс-Сафи примерно в 9 км к югу от Екрона, где долина Дуба (Эла) выходит на равнину; после проб других мест это отождествление теперь принято большинством. Геф был разрушен в конце IX века до н. э., когда его взял Азаил Сирийский, и поздние пророки называют лишь четыре города. Аскалон и Екрон сжёг Навуходоносор около 604 г. до н. э."
  uk:
    - "П'ятьма філістимськими містами були Газа, Ашкелон, Ашдод, Екрон і Гат, усі на південній прибережній рівнині нинішньої смуги Гази та Ізраїлю, у смузі завдовжки приблизно 50 км між Газою на південному заході та Екроном на північному сході."
    - "Книга Ісуса Навина називає «пять князїв Филистимських у нїй: Газський, Азотський, Аскалонський, Гетський, Екронський», і ті самі п'ять надсилають золоту жертву з повернутим ковчегом у Першій книзі Самуїла. Філістимляни оселилися в цих містах у XII ст. до н. е. Газа лежить під сучасним містом Газа, останнім містом на дорозі з Єгипту перед пустелею. Ашкелон — це Тель-Ашкелон на березі, нині національний парк у межах сучасного міста. Ашдод — це Тель-Ашдод за кілька кілометрів углиб суходолу, на південь від сучасного міста з такою назвою."
    - "Два внутрішні міста було знайдено пізніше. Екрон — це Тель-Мікне, приблизно за 35 км на захід від Єрусалима, де напис, знайдений 1996 р., називає Анхуса, сина Паді, правителя Екрона, і закріплює ототожнення. Гат, батьківщину Голіята, ототожнюють з Телль-ес-Сафі, приблизно за 9 км на південь від Екрона, де долина Іла виходить на рівнину; після того як пробували інші місця, це нині широко визнають. Гат було зруйновано наприкінці IX ст. до н. е., коли Азаїл Сирійський взяв його, і пізніші пророки називають лише чотири міста. Ашкелон і Екрон спалив Навуходоносор близько 604 р. до н. е."
  es:
    - "Las cinco ciudades filisteas eran Gaza, Ascalón, Asdod, Ecrón y Gat, todas en la llanura costera meridional de la actual franja de Gaza e Israel, dentro de una franja de unos 50 km de largo entre Gaza, al suroeste, y Ecrón, al noreste."
    - "Josué nombra «cinco provincias de los Philisteos; los Gazeos, Asdodios, Ascalonitas, Getheos, y Accaronitas», y las mismas cinco envían una ofrenda de oro con el arca devuelta en 1 Samuel. Los filisteos se asentaron en estas ciudades en el siglo XII a. C. Gaza yace bajo la ciudad moderna de Gaza, la última ciudad en el camino de Egipto antes del desierto. Ascalón es Tel Ascalón, en la costa, hoy un parque nacional dentro de la ciudad moderna. Asdod es Tel Asdod, unos kilómetros tierra adentro, al sur de la ciudad moderna del mismo nombre."
    - "Las dos ciudades del interior se hallaron más recientemente. Ecrón es Tel Miqne, a unos 35 km al oeste de Jerusalén, donde una inscripción hallada en 1996 nombra a Aquis hijo de Padi, gobernante de Ecrón, y zanja la identificación. Gat, la patria de Goliat, se identifica con Tell es-Safi, a unos 9 km al sur de Ecrón, donde el valle de Ela se abre a la llanura; tras probarse otros lugares, esto se acepta hoy ampliamente. Gat fue destruida a finales del siglo IX a. C., cuando la tomó Hazael de Siria, y los profetas posteriores nombran solo cuatro ciudades. Ascalón y Ecrón fueron incendiadas por Nabucodonosor hacia el 604 a. C."
  pt:
    - "As cinco cidades filisteias eram Gaza, Ascalom, Asdode, Ecrom e Gate, todas na planície costeira meridional da atual Faixa de Gaza e de Israel, numa faixa de cerca de 50 km de comprimento entre Gaza, no sudoeste, e Ecrom, no nordeste."
    - "Josué nomeia “os cinco senhores dos filisteus; os gazeus, os asdoditas, os asquelonitas, os geteus e os ecronitas”, e os mesmos cinco enviam uma oferta de ouro com a arca devolvida em 1 Samuel. Os filisteus se estabeleceram nessas cidades no século XII a.C. Gaza jaz sob a cidade moderna de Gaza, a última cidade na estrada do Egito antes do deserto. Ascalom é Tel Ashkelon, na costa, hoje um parque nacional dentro da cidade moderna. Asdode é Tel Ashdod, a alguns quilômetros para o interior, ao sul da cidade moderna de mesmo nome."
    - "As duas cidades do interior foram encontradas mais recentemente. Ecrom é Tel Miqne, a cerca de 35 km a oeste de Jerusalém, onde uma inscrição encontrada em 1996 nomeia Aquis, filho de Padi, governante de Ecrom, e resolve a identificação. Gate, a terra de Golias, é identificada com Tell es-Safi, a cerca de 9 km ao sul de Ecrom, onde o vale de Elá se abre para a planície; depois de outros sítios terem sido tentados, isso é hoje amplamente aceito. Gate foi destruída no fim do século IX a.C., quando Hazael da Síria a tomou, e os profetas posteriores nomeiam apenas quatro cidades. Ascalom e Ecrom foram queimadas por Nabucodonosor por volta de 604 a.C."
  de:
    - "Die fünf Philisterstädte waren Gaza, Aschkelon, Aschdod, Ekron und Gat, alle auf der südlichen Küstenebene des heutigen Gazastreifens und Israels, innerhalb eines etwa 50 km langen Streifens zwischen Gaza im Südwesten und Ekron im Nordosten."
    - "Josua nennt „fünf Herren der Philister, nämlich der Gaziter, der Asdoditer, der Askaloniter, der Gathiter der Ekroniter“, und dieselben fünf senden im Ersten Buch Samuel ein goldenes Geschenk mit der zurückgebrachten Lade. Die Philister besiedelten diese Städte im 12. Jahrhundert v. Chr. Gaza liegt unter der modernen Stadt Gaza, der letzten Stadt an der Straße von Ägypten vor der Wüste. Aschkelon ist Tel Aschkelon am Strand, heute ein Nationalpark innerhalb der modernen Stadt. Aschdod ist Tel Aschdod einige Kilometer landeinwärts, südlich der gleichnamigen modernen Stadt."
    - "Die beiden Städte im Landesinneren wurden erst später gefunden. Ekron ist Tel Miqne, etwa 35 km westlich von Jerusalem, wo eine 1996 gefundene Inschrift Achis, den Sohn des Padi, Herrscher von Ekron, nennt und die Gleichsetzung sichert. Gat, die Heimat des Goliat, wird mit Tell es-Safi gleichgesetzt, etwa 9 km südlich von Ekron, wo sich das Elatal zur Ebene öffnet; nachdem andere Orte erprobt wurden, ist dies heute weithin akzeptiert. Gat wurde im späten 9. Jahrhundert v. Chr. zerstört, als Hasael von Syrien es nahm, und die späteren Propheten nennen nur vier Städte. Aschkelon und Ekron verbrannte Nebukadnezar um 604 v. Chr."
  fr:
    - "Les cinq villes philistines étaient Gaza, Askalon, Asdod, Ékron et Gath, toutes situées dans la plaine côtière méridionale de l’actuelle bande de Gaza et d’Israël, dans une bande d’environ 50 km de long entre Gaza au sud-ouest et Ékron au nord-est."
    - "Josué nomme « les cinq princes des Philistins, celui de Gaza, celui d’Asdod, celui d’Askalon, celui de Gath et celui d’Ékron », et les mêmes cinq envoient une offrande d’or avec l’arche renvoyée dans le premier livre de Samuel. Les Philistins s’établirent dans ces villes au XIIe siècle av. J.-C. Gaza se trouve sous la ville moderne de Gaza, dernière ville sur la route d’Égypte avant le désert. Askalon est Tel Ashkelon, sur le rivage, aujourd’hui un parc national à l’intérieur de la ville moderne. Asdod est Tel Ashdod, à quelques kilomètres à l’intérieur des terres, au sud de la ville moderne de ce nom."
    - "Les deux villes de l’intérieur ont été retrouvées plus récemment. Ékron est Tel Miqne, à environ 35 km à l’ouest de Jérusalem, où une inscription trouvée en 1996 nomme Akisch, fils de Padi, souverain d’Ékron, et règle l’identification. Gath, patrie de Goliath, est identifiée à Tell es-Safi, à environ 9 km au sud d’Ékron, là où la vallée d’Éla débouche sur la plaine ; après que d’autres sites eurent été essayés, cette identification est aujourd’hui largement admise. Gath fut détruite à la fin du IXe siècle av. J.-C., quand Hazaël de Syrie la prit, et les prophètes plus tardifs ne nomment que quatre villes. Askalon et Ékron furent incendiées par Nebucadnetsar vers 604 av. J.-C."
