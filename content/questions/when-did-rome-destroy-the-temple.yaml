id: when-did-rome-destroy-the-temple
question:
  en: "When did Rome destroy the Temple in Jerusalem?"
  ru: "Когда Рим разрушил Иерусалимский храм?"
  uk: "Коли Рим зруйнував Храм в Єрусалимі?"
  es: "¿Cuándo destruyó Roma el Templo de Jerusalén?"
  pt: "Quando Roma destruiu o Templo de Jerusalém?"
  de: "Wann zerstörte Rom den Tempel in Jerusalem?"
  fr: "Quand Rome a-t-elle détruit le Temple de Jérusalem ?"
  pl: "Kiedy Rzym zburzył Świątynię w Jerozolimie?"
  it: "Quando Roma distrusse il Tempio di Gerusalemme?"
  nl: "Wanneer verwoestte Rome de tempel in Jeruzalem?"
  cs: "Kdy Řím zničil chrám v Jeruzalémě?"
  sv: "När förstörde Rom templet i Jerusalem?"
  nb: "Når ødela Roma tempelet i Jerusalem?"
  tl: "Kailan winasak ng Roma ang Templo sa Jerusalem?"
  da: "Hvornår ødelagde Rom Templet i Jerusalem?"
  sr: "Када је Рим разорио Храм у Јерусалиму?"
  hu: "Mikor pusztította el Róma a jeruzsálemi Templomot?"
  fi: "Milloin Rooma tuhosi temppelin Jerusalemissa?"
  vi: "Rô-ma phá hủy Đền Thờ ở Giê-ru-sa-lem khi nào?"
  ro: "Când a distrus Roma Templul din Ierusalim?"
  bg: "Кога Рим е разрушил Храма в Йерусалим?"
answer:
  en:
    - "The Roman army under Titus burned the Temple and destroyed Jerusalem in AD 70, four years after the Jewish revolt against Rome broke out in AD 66."
    - "The revolt began in AD 66. Vespasian subdued Galilee and Judea, and when he was proclaimed emperor his son Titus took over the siege of Jerusalem with four legions in the spring of 70, as the city was full of Passover pilgrims. Josephus, who watched from the Roman camp, tells that the Temple was burned in late summer, that the city was taken soon after, and that Caesar ordered the whole city and the Temple razed, leaving only the towers of Herod's palace and part of the western wall as a camp for the garrison. The spoils, among them the lampstand, were carried in the triumph at Rome, shown on the Arch of Titus."
    - 'The Gospels record Jesus'' words about the Temple: "There shall not be left here one stone upon another, that shall not be thrown down", and of Jerusalem: "thine enemies shall cast a trench about thee, and compass thee round". The Temple was never rebuilt. After Bar Kokhba''s revolt Hadrian''s Aelia Capitolina stood on the site of the city, and Jews were barred from it (AD 135); the emperor Julian''s attempt to rebuild the Temple in 363 failed.'
  ru:
    - "Римское войско под началом Тита сожгло Храм и разрушило Иерусалим в 70 г. н. э., через четыре года после начала иудейского восстания против Рима в 66 г."
    - "Восстание началось в 66 г. Веспасиан покорил Галилею и Иудею, а когда его провозгласили императором, осаду Иерусалима весной 70 г. возглавил его сын Тит с четырьмя легионами; город был полон паломников, пришедших на Пасху. Иосиф Флавий, наблюдавший из римского лагеря, рассказывает, что Храм сгорел в конце лета, город был взят вскоре после этого, а Цезарь приказал срыть весь город и Храм, оставив лишь башни дворца Ирода и часть западной стены для лагеря гарнизона. Добычу, в том числе светильник, пронесли в триумфе в Риме; она изображена на арке Тита."
    - "Евангелия приводят слова Иисуса о Храме: «не останется здесь камня на камне; все будет разрушено» — и об Иерусалиме: «враги твои обложат тебя окопами и окружат тебя». Храм так и не был восстановлен. После восстания Бар-Кохбы на месте города стояла Элия Капитолина Адриана, и евреям был запрещён вход в неё (135 г.); попытка императора Юлиана восстановить Храм в 363 г. не удалась."
  uk:
    - "Римське військо під проводом Тита спалило Храм і зруйнувало Єрусалим 70 р. н. е., через чотири роки після того, як 66 р. н. е. спалахнуло єврейське повстання проти Рима."
    - "Повстання почалося 66 р. н. е. Веспасіан підкорив Галілею та Юдею, а коли його проголосили імператором, його син Тит узяв на себе облогу Єрусалиму з чотирма легіонами навесні 70 р., коли місто було повне пасхальних прочан. Йосиф Флавій, який спостерігав із римського табору, розповідає, що Храм було спалено наприкінці літа, що місто було взято незабаром по тому і що кесар наказав зрівняти з землею ціле місто та Храм, залишивши лише башти Іродового палацу й частину західного муру як табір для гарнізону. Здобич, серед неї світильник, несли в тріумфі в Римі, зображеному на Тріумфальній арці Тита."
    - "Євангелії записують слова Ісуса про Храм: «Не зостанеть ся тут камінь на каменї, щоб не зруйновано» — і про Єрусалим: «обкинуть вороги твої валами тебе, та й обляжуть тебе». Храм так і не було відбудовано. Після повстання Бар-Кохби на місці міста постала Адріанова Елія Капітоліна, і євреям було заборонено в неї входити (135 р. н. е.); спроба імператора Юліана відбудувати Храм 363 р. не вдалася."
  es:
    - "El ejército romano bajo Tito incendió el Templo y destruyó Jerusalén en el 70 d. C., cuatro años después de que estallara la revuelta judía contra Roma en el 66 d. C."
    - "La revuelta comenzó en el 66 d. C. Vespasiano sometió Galilea y Judea, y cuando fue proclamado emperador su hijo Tito se hizo cargo del asedio de Jerusalén con cuatro legiones en la primavera del 70, cuando la ciudad estaba llena de peregrinos de la Pascua. Josefo, que observaba desde el campamento romano, cuenta que el Templo fue incendiado a finales del verano, que la ciudad fue tomada poco después y que el César ordenó arrasar toda la ciudad y el Templo, dejando solo las torres del palacio de Herodes y parte del muro occidental como campamento para la guarnición. Los despojos, entre ellos el candelabro, fueron llevados en el triunfo de Roma, representado en el Arco de Tito."
    - "Los Evangelios registran las palabras de Jesús sobre el Templo: «no será dejada aquí piedra sobre piedra, que no sea destruída», y sobre Jerusalén: «tus enemigos te cercarán con baluarte, y te pondrán cerco». El Templo nunca fue reconstruido. Tras la revuelta de Bar Kojba, la Aelia Capitolina de Adriano se alzó en el solar de la ciudad y se vedó el acceso a los judíos (135 d. C.); el intento del emperador Juliano de reconstruir el Templo en el 363 fracasó."
  pt:
    - "O exército romano sob Tito queimou o Templo e destruiu Jerusalém em 70 d.C., quatro anos depois de estourar a revolta judaica contra Roma, em 66 d.C."
    - "A revolta começou em 66 d.C. Vespasiano submeteu a Galileia e a Judeia, e, quando foi proclamado imperador, seu filho Tito assumiu o cerco de Jerusalém com quatro legiões, na primavera de 70, quando a cidade estava cheia de peregrinos da Páscoa. Josefo, que observava do acampamento romano, conta que o Templo foi queimado no fim do verão, que a cidade foi tomada logo depois e que César mandou arrasar toda a cidade e o Templo, deixando só as torres do palácio de Herodes e parte do muro ocidental como acampamento para a guarnição. Os despojos, entre eles o candelabro, foram levados no triunfo em Roma, representado no Arco de Tito."
    - "Os Evangelhos registram as palavras de Jesus sobre o Templo: “não ficará aqui pedra sobre pedra que não seja derrubada”, e sobre Jerusalém: “os seus inimigos levantarão uma barricada contra você, a cercarão”. O Templo nunca foi reconstruído. Depois da revolta de Bar Kokhba, a Aelia Capitolina de Adriano ergueu-se no lugar da cidade, e os judeus foram proibidos de entrar (135 d.C.); a tentativa do imperador Juliano de reconstruir o Templo, em 363, fracassou."
  de:
    - "Das römische Heer unter Titus verbrannte den Tempel und zerstörte Jerusalem im Jahr 70 n. Chr., vier Jahre nachdem der jüdische Aufstand gegen Rom 66 n. Chr. ausgebrochen war."
    - "Der Aufstand begann im Jahr 66 n. Chr. Vespasian unterwarf Galiläa und Judäa, und als er zum Kaiser ausgerufen wurde, übernahm sein Sohn Titus im Frühjahr 70 mit vier Legionen die Belagerung Jerusalems, als die Stadt voller Passapilger war. Josephus, der vom römischen Lager aus zusah, erzählt, der Tempel sei im Spätsommer verbrannt, die Stadt bald darauf genommen worden, und Caesar habe befohlen, die ganze Stadt und den Tempel zu schleifen und nur die Türme des herodianischen Palastes und ein Stück der Westmauer als Lager für die Besatzung stehen zu lassen. Die Beute, darunter der Leuchter, wurde im Triumph in Rom mitgeführt, abgebildet auf dem Titusbogen."
    - "Die Evangelien überliefern Jesu Worte über den Tempel: „Es wird hier nicht ein Stein auf dem anderen bleiben, der nicht zerbrochen werde“, und über Jerusalem: „daß deine Feinde werden um dich und deine Kinder mit dir eine Wagenburg schlagen, dich belagern und an allen Orten ängsten“. Der Tempel wurde nie wieder aufgebaut. Nach dem Bar-Kochba-Aufstand stand Hadrians Aelia Capitolina an der Stelle der Stadt, und Juden war der Zutritt verwehrt (135 n. Chr.); der Versuch Kaiser Julians, den Tempel 363 wieder aufzubauen, scheiterte."
  fr:
    - "L’armée romaine de Titus brûla le Temple et détruisit Jérusalem en 70 apr. J.-C., quatre ans après le début de la révolte juive contre Rome en 66 apr. J.-C."
    - "La révolte éclata en 66 apr. J.-C. Vespasien soumit la Galilée et la Judée, et quand il fut proclamé empereur, son fils Titus reprit le siège de Jérusalem avec quatre légions au printemps de 70, alors que la ville était pleine de pèlerins de la Pâque. Josèphe, qui observait depuis le camp romain, raconte que le Temple fut brûlé à la fin de l’été, que la ville fut prise peu après, et que César ordonna de raser toute la ville et le Temple, ne laissant que les tours du palais d’Hérode et une partie du mur occidental pour servir de camp à la garnison. Les dépouilles, dont le chandelier, furent portées au triomphe à Rome, figuré sur l’arc de Titus."
    - "Les Évangiles rapportent les paroles de Jésus sur le Temple : « il ne restera pas ici pierre sur pierre qui ne soit renversée », et sur Jérusalem : « tes ennemis t’environneront de tranchées, t’enfermeront, et te serreront de toutes parts ». Le Temple ne fut jamais rebâti. Après la révolte de Bar Kokhba, l’Aelia Capitolina d’Hadrien s’éleva sur le site de la ville, et les Juifs en furent exclus (135 apr. J.-C.) ; la tentative de l’empereur Julien de rebâtir le Temple en 363 échoua."
  pl:
    - "Armia rzymska pod dowództwem Tytusa spaliła Świątynię i zniszczyła Jerozolimę w 70 n.e., cztery lata po wybuchu żydowskiego powstania przeciw Rzymowi w 66 n.e."
    - "Powstanie wybuchło w 66 n.e. Wespazjan podporządkował Galileę i Judeę, a gdy ogłoszono go cesarzem, jego syn Tytus przejął oblężenie Jerozolimy z czterema legionami wiosną 70, gdy miasto było pełne pielgrzymów paschalnych. Józef Flawiusz, który obserwował z rzymskiego obozu, opowiada, że Świątynię spalono późnym latem, że miasto zdobyto wkrótce potem i że Cezar kazał zrównać z ziemią całe miasto i Świątynię, pozostawiając tylko wieże pałacu Heroda i część muru zachodniego jako obóz dla załogi. Łupy, wśród nich świecznik, niesiono w triumfie w Rzymie, ukazanym na Łuku Tytusa."
    - "Ewangelie zapisują słowa Jezusa o Świątyni: „nie zostanie tu kamień na kamieniu, który by nie był rozwalony”, i o Jerozolimie: „gdy cię otoczą nieprzyjaciele twoi wałem, i oblęgą cię, i ścisną cię zewsząd”. Świątyni nigdy nie odbudowano. Po powstaniu Bar Kochby na miejscu miasta stanęła Aelia Capitolina Hadriana, a Żydom zakazano wstępu (135 n.e.); próba odbudowy Świątyni przez cesarza Juliana w 363 nie powiodła się."
  it:
    - "L’esercito romano sotto Tito bruciò il Tempio e distrusse Gerusalemme nel 70 d.C., quattro anni dopo lo scoppio della rivolta giudaica contro Roma nel 66 d.C."
    - "La rivolta cominciò nel 66 d.C. Vespasiano sottomise la Galilea e la Giudea, e quando fu proclamato imperatore suo figlio Tito assunse l’assedio di Gerusalemme con quattro legioni nella primavera del 70, quando la città era piena di pellegrini per la Pasqua. Giuseppe Flavio, che osservava dall’accampamento romano, racconta che il Tempio fu bruciato a fine estate, che la città fu presa subito dopo e che Cesare ordinò di radere al suolo l’intera città e il Tempio, lasciando solo le torri del palazzo di Erode e parte del muro occidentale come accampamento per la guarnigione. Le spoglie, tra cui il candelabro, furono portate nel trionfo a Roma, raffigurato sull’Arco di Tito."
    - "I Vangeli riportano le parole di Gesù sul Tempio: «Non sarà lasciata qui pietra sopra pietra che non sia diroccata», e su Gerusalemme: «i tuoi nemici ti faranno attorno delle trincee, e ti circonderanno». Il Tempio non fu mai ricostruito. Dopo la rivolta di Bar Kokhba, l’Aelia Capitolina di Adriano sorse sul sito della città, e agli Ebrei ne fu vietato l’accesso (135 d.C.); il tentativo dell’imperatore Giuliano di ricostruire il Tempio nel 363 fallì."
  nl:
    - "Het Romeinse leger onder Titus verbrandde de tempel en verwoestte Jeruzalem in 70 n.Chr., vier jaar nadat de Joodse opstand tegen Rome in 66 n.Chr. was uitgebroken."
    - "De opstand begon in 66 n.Chr. Vespasianus onderwierp Galilea en Judea, en toen hij tot keizer was uitgeroepen, nam zijn zoon Titus in het voorjaar van 70 met vier legioenen het beleg van Jeruzalem over, toen de stad vol Pesach-pelgrims was. Josephus, die vanuit het Romeinse kamp toekeek, vertelt dat de tempel in de late zomer werd verbrand, dat de stad kort daarna werd ingenomen en dat de keizer gelastte de hele stad en de tempel met de grond gelijk te maken, met alleen de torens van het paleis van Herodes en een deel van de westelijke muur als kamp voor het garnizoen. De buit, waaronder de kandelaar, werd meegevoerd in de triomftocht te Rome, afgebeeld op de Boog van Titus."
    - "De Evangeliën vermelden Jezus’ woorden over de tempel: “Hier zal niet een steen op den anderen steen gelaten worden, die niet afgebroken zal worden”, en over Jeruzalem: “uw vijanden een begraving rondom u zullen opwerpen, en zullen u omsingelen”. De tempel is nooit herbouwd. Na de opstand van Bar Kochba stond Hadrianus’ Aelia Capitolina op de plaats van de stad, en Joden werd de toegang ontzegd (135 n.Chr.); de poging van keizer Julianus om de tempel in 363 te herbouwen mislukte."
  cs:
    - "Římské vojsko pod Titem spálilo chrám a zničilo Jeruzalém roku 70 n. l., čtyři roky poté, co roku 66 n. l. vypuklo židovské povstání proti Římu."
    - "Povstání začalo roku 66 n. l. Vespasianus podrobil Galileu a Judsko, a když byl prohlášen císařem, převzal obléhání Jeruzaléma jeho syn Titus se čtyřmi legiemi na jaře roku 70, kdy bylo město plné poutníků na Pesach. Josephus Flavius, který přihlížel z římského tábora, vypráví, že chrám byl spálen koncem léta, že město bylo brzy poté dobyto a že Caesar nařídil srovnat se zemí celé město i chrám a ponechat jen věže Herodova paláce a část západní hradby jako tábor pro posádku. Kořist, mezi ní svícen, byla nesena v triumfu v Římě, zobrazeném na Titově oblouku."
    - "Evangelia zaznamenávají Ježíšova slova o chrámu: „Nebude zůstaven tuto kámen na kameni, kterýž by nebyl zbořen“ a o Jeruzalému: „obklíčí tě nepřátelé tvoji valem, a oblehnou tebe“. Chrám nebyl nikdy obnoven. Po Bar Kochbově povstání stála na místě města Hadriánova Aelia Capitolina a Židé měli vstup zakázán (135 n. l.); pokus císaře Juliána obnovit chrám roku 363 ztroskotal."
  sv:
    - "Den romerska armén under Titus brände templet och förstörde Jerusalem år 70 e.Kr., fyra år efter att det judiska upproret mot Rom brutit ut år 66 e.Kr."
    - "Upproret började år 66 e.Kr. Vespasianus underkuvade Galileen och Judeen, och när han utropats till kejsare övertog hans son Titus belägringen av Jerusalem med fyra legioner våren 70, medan staden var full av påskpilgrimer. Josefus, som såg på från det romerska lägret, berättar att templet brändes på sensommaren, att staden intogs strax därefter och att Caesar befallde att hela staden och templet skulle jämnas med marken, med undantag för tornen i Herodes palats och en del av västra muren som läger för garnisonen. Bytet, däribland ljusstaken, fördes i triumftåget i Rom, avbildat på Titusbågen."
    - "Evangelierna återger Jesu ord om templet: ”Här skall icke lämnas sten på sten; allt skall bliva nedbrutet”, och om Jerusalem: ”dina fiender skola omgiva dig med belägringsvall och innesluta dig och tränga dig på alla sidor”. Templet återuppbyggdes aldrig. Efter Bar Kochbas uppror stod Hadrianus Aelia Capitolina på stadens plats, och judar var utestängda från den (135 e.Kr.); kejsar Julianus försök att bygga upp templet 363 misslyckades."
  nb:
    - "Den romerske hæren under Titus brente tempelet og ødela Jerusalem i 70 e.Kr., fire år etter at det jødiske opprøret mot Roma brøt ut i 66 e.Kr."
    - "Opprøret begynte i 66 e.Kr. Vespasian underla seg Galilea og Judea, og da han ble utropt til keiser, overtok sønnen Titus beleiringen av Jerusalem med fire legioner våren 70, mens byen var full av påskepilegrimer. Josefus, som så på fra den romerske leiren, forteller at tempelet ble brent seint på sommeren, at byen ble inntatt kort etter, og at Cæsar befalte at hele byen og tempelet skulle jevnes med jorden, slik at bare tårnene i Herodes' palass og en del av den vestlige muren ble stående som leir for garnisonen. Byttet, blant annet lysestaken, ble båret i triumftoget i Roma, vist på Titusbuen."
    - "Evangeliene gjengir Jesu ord om tempelet: «Her skal ikke levnes sten på sten som ikke skal brytes ned», og om Jerusalem: «dine fiender skal kaste en voll op om dig og kringsette dig og trenge dig fra alle sider». Tempelet ble aldri gjenoppbygd. Etter Bar Kokhba-opprøret sto Hadrians Aelia Capitolina på byens sted, og jøder ble nektet adgang (135 e.Kr.); keiser Julians forsøk på å gjenoppbygge tempelet i 363 mislyktes."
  tl:
    - "Sinunog ng hukbong Romano sa ilalim ni Tito ang Templo at winasak ang Jerusalem noong 70 AD, apat na taon pagkatapos sumiklab ang paghihimagsik ng mga Judio laban sa Roma noong 66 AD."
    - "Nagsimula ang paghihimagsik noong 66 AD. Sinupil ni Vespasiano ang Galilea at Judea, at nang ipahayag siyang emperador ay pinalitan siya ng anak niyang si Tito sa pagkubkob sa Jerusalem na may apat na lehiyon noong tagsibol ng 70, habang puno ang lungsod ng mga peregrino ng Paskua. Isinasalaysay ni Josephus, na nanood mula sa kampong Romano, na sinunog ang Templo sa huling bahagi ng tag-init, na kinuha ang lungsod pagkatapos nito, at na ipinag-utos ni Cesar na gibain ang buong lungsod at ang Templo, na iniwan lamang ang mga tore ng palasyo ni Herodes at bahagi ng kanlurang pader bilang kampo ng bantay. Dinala ang mga samsam, kabilang ang kandelero, sa tagumpay sa Roma, na ipinakikita sa Arko ni Tito."
    - "Itinala ng mga Ebanghelyo ang mga salita ni Jesus tungkol sa Templo: “Dito'y walang maiiwang isang bato sa ibabaw ng ibang bato, na hindi ibabagsak”, at tungkol sa Jerusalem: “babakuran ka ng kuta ng mga kaaway mo, at kukubkubin ka, at gigipitin ka sa magkabikabila”. Hindi na muling itinayo ang Templo. Pagkatapos ng paghihimagsik ni Bar Kokhba, tumayo ang Aelia Capitolina ni Adriano sa pook ng lungsod, at ipinagbawal doon ang mga Judio (135 AD); nabigo ang pagtatangka ni Emperador Juliano na itayong muli ang Templo noong 363."
  da:
    - "Den romerske hær under Titus brændte Templet og ødelagde Jerusalem i 70 e.Kr., fire år efter det jødiske oprør mod Rom brød ud i 66 e.Kr."
    - "Oprøret begyndte i 66 e.Kr. Vespasian underlagde sig Galilæa og Judæa, og da han blev udråbt til kejser, overtog hans søn Titus belejringen af Jerusalem med fire legioner i foråret 70, mens byen var fuld af påskepilgrimme. Josefus, som så til fra den romerske lejr, fortæller, at Templet blev brændt sidst på sommeren, at byen blev indtaget kort efter, og at Cæsar befalede hele byen og Templet jævnet med jorden, så kun tårnene i Herodes' palads og en del af den vestlige mur blev tilbage som lejr for garnisonen. Byttet, blandt andet lysestagen, blev ført med i triumfen i Rom, vist på Titusbuen."
    - "Evangelierne gengiver Jesu ord om Templet: »her skal ikke lades Sten paa Sten, som jo skal nedbrydes«, og om Jerusalem: »dine Fjender skulle kaste en Vold op omkring dig og omringe dig«. Templet blev aldrig genopbygget. Efter Bar Kokhbas oprør lå Hadrians Aelia Capitolina på byens sted, og jøder blev udelukket fra den (135 e.Kr.); kejser Julians forsøg på at genopbygge Templet i 363 mislykkedes."
  sr:
    - "Римска војска под Титом спалила је Храм и разорила Јерусалим 70. н. е., четири године пошто је јеврејски устанак против Рима букнуо 66. н. е."
    - "Устанак је почео 66. н. е. Веспазијан је покорио Галилеју и Јудеју, а кад је проглашен за цара, његов син Тит преузео је опсаду Јерусалима са четири легије у пролеће 70, док је град био пун пасхалних ходочасника. Јосиф Флавије, који је посматрао из римског логора, прича да је Храм спаљен у касно лето, да је град узет убрзо потом и да је Цезар наредио да се цео град и Храм сравне са земљом, остављајући само куле Иродове палате и део западног зида као логор за посаду. Плен, међу њим и свећњак, носио се у тријумфу у Риму, а приказан је на Титовом славолуку."
    - "Јеванђеља бележе Исусове речи о Храму: „неће остати овде ни камен на камену који се неће разметнути“, и о Јерусалиму: „окружиће те непријатељи твоји опкопима, и опколиће те“. Храм никад није обновљен. После Бар Кохбиног устанка Хадријанова Елија Капитолина стајала је на месту града, а Јеврејима је био забрањен приступ (135. н. е.); покушај цара Јулијана да обнови Храм 363. није успео."
  hu:
    - "A Titus vezette római hadsereg Kr. u. 70-ben égette fel a Templomot és pusztította el Jeruzsálemet, négy évvel azután, hogy Kr. u. 66-ban kitört a Róma elleni zsidó felkelés."
    - "A felkelés Kr. u. 66-ban kezdődött. Vespasianus leigázta Galileát és Júdeát, és amikor császárrá kiáltották ki, fia, Titus vette át Jeruzsálem ostromát négy légióval Kr. u. 70 tavaszán, amikor a város tele volt páska-zarándokokkal. Josephus, aki a római táborból nézte, elmondja, hogy a Templom nyár végén égett le, a várost nem sokkal később elfoglalták, és a császár elrendelte az egész város és a Templom lerombolását, csak Heródes palotájának tornyait és a nyugati fal egy részét hagyva meg a helyőrség táboraként. A zsákmányt, köztük a lámpatartót, a római diadalmenetben vitték, ahogy a Titus-diadalív ábrázolja."
    - "Az evangéliumok feljegyzik Jézus szavait a Templomról: „Nem marad itt kő kövön, mely le nem romboltatik”, és Jeruzsálemről: „a te ellenségeid te körülted palánkot építenek, és körülvesznek téged”. A Templomot soha nem építették újjá. A Bar Kochba-felkelés után Hadrianus Aelia Capitolinája állt a város helyén, és a zsidóknak tilos volt oda belépniük (Kr. u. 135); Julianus császár kísérlete a Templom újjáépítésére Kr. u. 363-ban meghiúsult."
  fi:
    - "Tituksen johtama Rooman armeija poltti temppelin ja tuhosi Jerusalemin vuonna 70 jaa., neljä vuotta sen jälkeen, kun juutalaisten kapina Roomaa vastaan oli puhjennut vuonna 66 jaa."
    - "Kapina alkoi vuonna 66 jaa. Vespasianus alisti Galilean ja Juudean, ja kun hänet julistettiin keisariksi, hänen poikansa Titus otti Jerusalemin piirityksen haltuunsa neljän legioonan kanssa keväällä 70, kun kaupunki oli täynnä pääsiäispyhiinvaeltajia. Josephus, joka katseli roomalaisten leiristä, kertoo, että temppeli poltettiin loppukesästä, että kaupunki vallattiin pian sen jälkeen ja että Caesar käski hävittää koko kaupungin ja temppelin maan tasalle, jättäen vain Herodeksen palatsin tornit ja osan läntisestä muurista varuskunnan leiriksi. Saalis, muun muassa lampunjalka, kuljetettiin voitonkulkueessa Roomassa, kuten Tituksen riemukaaressa nähdään."
    - "Evankeliumit kertovat Jeesuksen sanat temppelistä: ”tähän ei ole jäävä kiveä kiven päälle, maahan jaottamatta”, ja Jerusalemista: ”sinun vihollisesi sinut vallilla saartavat ja piirittävät sinut”. Temppeliä ei koskaan rakennettu uudelleen. Bar Kokhban kapinan jälkeen Hadrianuksen Aelia Capitolina seisoi kaupungin paikalla, ja juutalaisilta evättiin pääsy sinne (135 jaa.); keisari Julianuksen yritys rakentaa temppeli uudelleen vuonna 363 epäonnistui."
  vi:
    - "Quân La Mã dưới quyền Tít đốt Đền Thờ và phá hủy Giê-ru-sa-lem năm 70, bốn năm sau khi cuộc nổi dậy của người Do Thái chống Rô-ma bùng nổ năm 66."
    - "Cuộc nổi dậy bắt đầu năm 66. Vespasian dẹp Ga-li-lê và Giu-đê, và khi được tôn làm hoàng đế, con trai ông là Tít tiếp quản cuộc vây Giê-ru-sa-lem với bốn quân đoàn vào mùa xuân năm 70, khi thành đầy khách hành hương dịp lễ Vượt qua. Giô-sê-phu, người quan sát từ trại La Mã, kể rằng Đền Thờ bị đốt vào cuối mùa hè, thành bị chiếm ngay sau đó, và Sê-sa ra lệnh san bằng toàn thành cùng Đền Thờ, chỉ để lại các tháp của cung điện Hê-rốt và một phần tường phía tây làm doanh trại cho quân đồn trú. Chiến lợi phẩm, trong đó có chân đèn, được đem diễu trong cuộc khải hoàn tại Rô-ma, được khắc trên Khải hoàn môn Tít."
    - "Các sách Phúc Âm ghi lời Giê-su về Đền Thờ: “đây sẽ không còn một hòn đá nào chồng trên một hòn khác mà không bị đổ xuống”, và về Giê-ru-sa-lem: “quân nghịch đào hố xung quanh mầy, vây mầy chặt bốn bề”. Đền Thờ không bao giờ được xây lại. Sau cuộc nổi dậy của Bar Kokhba, Aelia Capitolina của Hadrian đứng trên địa điểm của thành, và người Do Thái bị cấm vào (năm 135); nỗ lực xây lại Đền Thờ của hoàng đế Julian năm 363 thất bại."
  ro:
    - "Armata romană condusă de Tit a ars Templul și a distrus Ierusalimul în 70 d.Hr., la patru ani după izbucnirea răscoalei evreilor împotriva Romei, în 66 d.Hr."
    - "Răscoala a început în 66 d.Hr. Vespasian a supus Galileea și Iudeea, iar când a fost proclamat împărat, fiul său Tit a preluat asediul Ierusalimului cu patru legiuni, în primăvara lui 70, când cetatea era plină de pelerini veniți de Paști. Iosif Flaviu, care privea din tabăra romană, povestește că Templul a fost ars la sfârșitul verii, că orașul a fost luat la scurt timp după aceea și că Cezarul a poruncit să fie ras întregul oraș, împreună cu Templul, lăsându-se doar turnurile palatului lui Irod și o parte a zidului de vest ca tabără pentru garnizoană. Prada, între care sfeșnicul, a fost purtată în triumful de la Roma, înfățișat pe Arcul lui Tit."
    - "Evangheliile consemnează cuvintele lui Isus despre Templu: „nu va rămâne aici piatră pre piatră, care să nu se risipească”, și despre Ierusalim: „vor pune vrăjmașii tăi șanț împrejurul tău și te vor încunjurà”. Templul nu a mai fost reclădit. După răscoala lui Bar Kohba, Aelia Capitolina a lui Hadrian s-a ridicat pe locul cetății, iar evreilor li s-a interzis accesul (135 d.Hr.); încercarea împăratului Iulian de a reclădi Templul, în 363, a eșuat."
  bg:
    - "Римската войска начело с Тит изгорила Храма и разрушила Йерусалим през 70 г. н.е., четири години след избухването на юдейското въстание срещу Рим през 66 г. н.е."
    - "Въстанието започнало през 66 г. н.е. Веспасиан покорил Галилея и Юдея, а когато бил провъзгласен за император, синът му Тит поел обсадата на Йерусалим с четири легиона през пролетта на 70 г., когато градът бил пълен с поклонници за Пасха. Йосиф Флавий, който наблюдавал от римския лагер, разказва, че Храмът бил изгорен в края на лятото, че градът бил превзет скоро след това и че Кесарят заповядал целият град и Храмът да бъдат сринати, като останали само кулите на Иродовия дворец и част от западната стена като лагер за гарнизона. Плячката, сред нея светилникът, била пренесена в триумфа в Рим, изобразен на Арката на Тит."
    - "Евангелията записват думите на Исус за Храма: „Нема да остане тука камик на камик който да се не съсипе“, и за Йерусалим: „твоите неприятели ще направят окоп около тебе, и ще те обсадят“. Храмът никога не бил възстановен. След въстанието на Бар Кохба на мястото на града стояла Елия Капитолина на Адриан, а на юдеите било забранено да влизат в нея (135 г. н.е.); опитът на император Юлиан да възстанови Храма през 363 г. се провалил."
