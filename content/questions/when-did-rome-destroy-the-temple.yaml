id: when-did-rome-destroy-the-temple
question:
  en: "When did Rome destroy the Temple in Jerusalem?"
  ru: "Когда Рим разрушил Иерусалимский храм?"
  uk: "Коли Рим зруйнував Храм в Єрусалимі?"
  es: "¿Cuándo destruyó Roma el Templo de Jerusalén?"
  pt: "Quando Roma destruiu o Templo de Jerusalém?"
  de: "Wann zerstörte Rom den Tempel in Jerusalem?"
  fr: "Quand Rome a-t-elle détruit le Temple de Jérusalem ?"
answer:
  en:
    - "The Roman army under Titus burned the Temple and destroyed Jerusalem in AD 70, four years after the Jewish revolt against Rome broke out in AD 66."
    - "The revolt began in AD 66. Vespasian subdued Galilee and Judea, and when he was proclaimed emperor his son Titus took over the siege of Jerusalem with four legions in the spring of 70, as the city was full of Passover pilgrims. Josephus, who watched from the Roman camp, tells that the Temple was burned in late summer, that the city was taken soon after, and that Caesar ordered the whole city and the Temple razed, leaving only the towers of Herod's palace and part of the western wall as a camp for the garrison. The spoils, among them the lampstand, were carried in the triumph at Rome, shown on the Arch of Titus."
    - 'The Gospels record Jesus'' words about the Temple: "There shall not be left here one stone upon another, that shall not be thrown down", and of Jerusalem: "thine enemies shall cast a trench about thee, and compass thee round". The Temple was never rebuilt. After Bar Kokhba''s revolt Hadrian''s Aelia Capitolina stood on the site of the city, and Jews were barred from it (AD 135); the emperor Julian''s attempt to rebuild the Temple in 363 failed.'
  ru:
    - "Римское войско под началом Тита сожгло Храм и разрушило Иерусалим в 70 г. н. э., через четыре года после начала иудейского восстания против Рима в 66 г."
    - "Восстание началось в 66 г. Веспасиан покорил Галилею и Иудею, а когда его провозгласили императором, осаду Иерусалима весной 70 г. возглавил его сын Тит с четырьмя легионами; город был полон паломников, пришедших на Пасху. Иосиф Флавий, наблюдавший из римского лагеря, рассказывает, что Храм сгорел в конце лета, город был взят вскоре после этого, а Цезарь приказал срыть весь город и Храм, оставив лишь башни дворца Ирода и часть западной стены для лагеря гарнизона. Добычу, в том числе светильник, пронесли в триумфе в Риме; она изображена на арке Тита."
    - "Евангелия приводят слова Иисуса о Храме: «не останется здесь камня на камне; все будет разрушено» — и об Иерусалиме: «враги твои обложат тебя окопами и окружат тебя». Храм так и не был восстановлен. После восстания Бар-Кохбы на месте города стояла Элия Капитолина Адриана, и евреям был запрещён вход в неё (135 г.); попытка императора Юлиана восстановить Храм в 363 г. не удалась."
  uk:
    - "Римське військо під проводом Тита спалило Храм і зруйнувало Єрусалим 70 р. н. е., через чотири роки після того, як 66 р. н. е. спалахнуло єврейське повстання проти Рима."
    - "Повстання почалося 66 р. н. е. Веспасіан підкорив Галілею та Юдею, а коли його проголосили імператором, його син Тит узяв на себе облогу Єрусалиму з чотирма легіонами навесні 70 р., коли місто було повне пасхальних прочан. Йосиф Флавій, який спостерігав із римського табору, розповідає, що Храм було спалено наприкінці літа, що місто було взято незабаром по тому і що кесар наказав зрівняти з землею ціле місто та Храм, залишивши лише башти Іродового палацу й частину західного муру як табір для гарнізону. Здобич, серед неї світильник, несли в тріумфі в Римі, зображеному на Тріумфальній арці Тита."
    - "Євангелії записують слова Ісуса про Храм: «Не зостанеть ся тут камінь на каменї, щоб не зруйновано» — і про Єрусалим: «обкинуть вороги твої валами тебе, та й обляжуть тебе». Храм так і не було відбудовано. Після повстання Бар-Кохби на місці міста постала Адріанова Елія Капітоліна, і євреям було заборонено в неї входити (135 р. н. е.); спроба імператора Юліана відбудувати Храм 363 р. не вдалася."
  es:
    - "El ejército romano bajo Tito incendió el Templo y destruyó Jerusalén en el 70 d. C., cuatro años después de que estallara la revuelta judía contra Roma en el 66 d. C."
    - "La revuelta comenzó en el 66 d. C. Vespasiano sometió Galilea y Judea, y cuando fue proclamado emperador su hijo Tito se hizo cargo del asedio de Jerusalén con cuatro legiones en la primavera del 70, cuando la ciudad estaba llena de peregrinos de la Pascua. Josefo, que observaba desde el campamento romano, cuenta que el Templo fue incendiado a finales del verano, que la ciudad fue tomada poco después y que el César ordenó arrasar toda la ciudad y el Templo, dejando solo las torres del palacio de Herodes y parte del muro occidental como campamento para la guarnición. Los despojos, entre ellos el candelabro, fueron llevados en el triunfo de Roma, representado en el Arco de Tito."
    - "Los Evangelios registran las palabras de Jesús sobre el Templo: «no será dejada aquí piedra sobre piedra, que no sea destruída», y sobre Jerusalén: «tus enemigos te cercarán con baluarte, y te pondrán cerco». El Templo nunca fue reconstruido. Tras la revuelta de Bar Kojba, la Aelia Capitolina de Adriano se alzó en el solar de la ciudad y se vedó el acceso a los judíos (135 d. C.); el intento del emperador Juliano de reconstruir el Templo en el 363 fracasó."
  pt:
    - "O exército romano sob Tito queimou o Templo e destruiu Jerusalém em 70 d.C., quatro anos depois de estourar a revolta judaica contra Roma, em 66 d.C."
    - "A revolta começou em 66 d.C. Vespasiano submeteu a Galileia e a Judeia, e, quando foi proclamado imperador, seu filho Tito assumiu o cerco de Jerusalém com quatro legiões, na primavera de 70, quando a cidade estava cheia de peregrinos da Páscoa. Josefo, que observava do acampamento romano, conta que o Templo foi queimado no fim do verão, que a cidade foi tomada logo depois e que César mandou arrasar toda a cidade e o Templo, deixando só as torres do palácio de Herodes e parte do muro ocidental como acampamento para a guarnição. Os despojos, entre eles o candelabro, foram levados no triunfo em Roma, representado no Arco de Tito."
    - "Os Evangelhos registram as palavras de Jesus sobre o Templo: “não ficará aqui pedra sobre pedra que não seja derrubada”, e sobre Jerusalém: “os seus inimigos levantarão uma barricada contra você, a cercarão”. O Templo nunca foi reconstruído. Depois da revolta de Bar Kokhba, a Aelia Capitolina de Adriano ergueu-se no lugar da cidade, e os judeus foram proibidos de entrar (135 d.C.); a tentativa do imperador Juliano de reconstruir o Templo, em 363, fracassou."
  de:
    - "Das römische Heer unter Titus verbrannte den Tempel und zerstörte Jerusalem im Jahr 70 n. Chr., vier Jahre nachdem der jüdische Aufstand gegen Rom 66 n. Chr. ausgebrochen war."
    - "Der Aufstand begann im Jahr 66 n. Chr. Vespasian unterwarf Galiläa und Judäa, und als er zum Kaiser ausgerufen wurde, übernahm sein Sohn Titus im Frühjahr 70 mit vier Legionen die Belagerung Jerusalems, als die Stadt voller Passapilger war. Josephus, der vom römischen Lager aus zusah, erzählt, der Tempel sei im Spätsommer verbrannt, die Stadt bald darauf genommen worden, und Caesar habe befohlen, die ganze Stadt und den Tempel zu schleifen und nur die Türme des herodianischen Palastes und ein Stück der Westmauer als Lager für die Besatzung stehen zu lassen. Die Beute, darunter der Leuchter, wurde im Triumph in Rom mitgeführt, abgebildet auf dem Titusbogen."
    - "Die Evangelien überliefern Jesu Worte über den Tempel: „Es wird hier nicht ein Stein auf dem anderen bleiben, der nicht zerbrochen werde“, und über Jerusalem: „daß deine Feinde werden um dich und deine Kinder mit dir eine Wagenburg schlagen, dich belagern und an allen Orten ängsten“. Der Tempel wurde nie wieder aufgebaut. Nach dem Bar-Kochba-Aufstand stand Hadrians Aelia Capitolina an der Stelle der Stadt, und Juden war der Zutritt verwehrt (135 n. Chr.); der Versuch Kaiser Julians, den Tempel 363 wieder aufzubauen, scheiterte."
  fr:
    - "L’armée romaine de Titus brûla le Temple et détruisit Jérusalem en 70 apr. J.-C., quatre ans après le début de la révolte juive contre Rome en 66 apr. J.-C."
    - "La révolte éclata en 66 apr. J.-C. Vespasien soumit la Galilée et la Judée, et quand il fut proclamé empereur, son fils Titus reprit le siège de Jérusalem avec quatre légions au printemps de 70, alors que la ville était pleine de pèlerins de la Pâque. Josèphe, qui observait depuis le camp romain, raconte que le Temple fut brûlé à la fin de l’été, que la ville fut prise peu après, et que César ordonna de raser toute la ville et le Temple, ne laissant que les tours du palais d’Hérode et une partie du mur occidental pour servir de camp à la garnison. Les dépouilles, dont le chandelier, furent portées au triomphe à Rome, figuré sur l’arc de Titus."
    - "Les Évangiles rapportent les paroles de Jésus sur le Temple : « il ne restera pas ici pierre sur pierre qui ne soit renversée », et sur Jérusalem : « tes ennemis t’environneront de tranchées, t’enfermeront, et te serreront de toutes parts ». Le Temple ne fut jamais rebâti. Après la révolte de Bar Kokhba, l’Aelia Capitolina d’Hadrien s’éleva sur le site de la ville, et les Juifs en furent exclus (135 apr. J.-C.) ; la tentative de l’empereur Julien de rebâtir le Temple en 363 échoua."
