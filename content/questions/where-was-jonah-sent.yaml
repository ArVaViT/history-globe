id: where-was-jonah-sent
question:
  en: "Where was Jonah sent, and where did he flee?"
  ru: "Куда был послан Иона и куда он бежал?"
  uk: "Куди був посланий Йона і куди він утікав?"
  es: "¿Adónde fue enviado Jonás y adónde huyó?"
  pt: "Para onde Jonas foi enviado, e para onde fugiu?"
  de: "Wohin wurde Jona gesandt, und wohin floh er?"
  fr: "Où Jonas fut-il envoyé, et où s’enfuit-il ?"
  pl: "Dokąd wysłano Jonasza i dokąd uciekł?"
  it: "Dove fu mandato Giona, e dove fuggì?"
  cs: "Kam byl Jonáš poslán a kam utekl?"
  nl: "Waarheen werd Jona gezonden, en waarheen vluchtte hij?"
  sv: "Vart sändes Jona, och vart flydde han?"
  nb: "Hvor ble Jona sendt, og hvor flyktet han?"
  tl: "Saan isinugo si Jonas, at saan siya tumakas?"
  da: "Hvortil blev Jonas sendt, og hvorhen flygtede han?"
  sr: "Куда је Јона био послан и куда је побегао?"
answer:
  en:
    - "Jonah was sent to Nineveh, the great city of Assyria on the Tigris opposite today's Mosul in Iraq, about 820 km north-east of his home town Gath-hepher in Galilee in a straight line. Instead he went down to the port of Joppa, today's Jaffa, and took ship for Tarshish in the opposite direction. Where Tarshish was is disputed: the usual view is Tartessos in south-western Spain, where the map puts its point near Huelva, about 3,825 km west of Joppa; Sardinia, Carthage and Tarsus in Cilicia have also been proposed. The map marks it as disputed, and the Jonah tour leaves it out, since he never arrived."
    - '2 Kings names "Jonah, the son of Amittai, the prophet, which was of Gath-hepher", in the reign of Jeroboam II of Israel (c. 793–753 BC); the map''s tour is set at 780 BC. The book of Jonah opens with the command "Arise, go to Nineveh, that great city, and cry against it", and the flight: "But Jonah rose up to flee unto Tarshish from the presence of the LORD, and went down to Joppa; and he found a ship going to Tarshish". After the storm and the fish he went to Nineveh, "an exceeding great city of three days'' journey", and its people repented; Jesus held up the Ninevites as an example: "The men of Nineveh shall rise in judgment with this generation, and shall condemn it".'
    - "Gath-hepher is placed at Tel Gat Hefer, about 5 km from Nazareth. Joppa was the chief port of the central coast, the harbour to which cedar from Lebanon was floated for Solomon's Temple; Jerome, describing Paula's pilgrimage of the 380s, names it as the port of Jonah's flight. Nineveh became the capital of Assyria under Sennacherib about 700 BC, with a wall about 12 km long, and fell to the Babylonians and Medes in 612 BC; later tradition placed the tomb of Jonah on the mound of Nebi Yunus there. Tarshish in the prophets is a far land of silver, iron, tin and lead reached by sea; those who place it in Spain point to the metal-rich coast that Greek writers knew as Tartessos, but the name also stands for distant seafaring in general, as in the ships of Tarshish."
  ru:
    - "Иона был послан в Ниневию, великий город Ассирии на Тигре напротив нынешнего Мосула в Ираке, примерно в 820 км к северо-востоку от его родного Гафхефера в Галилее по прямой. Вместо этого он пришёл в гавань Иоппию, нынешнюю Яффу, и сел на корабль в Фарсис, в противоположную сторону. Где был Фарсис, спорно: обычно его отождествляют с Тартессом на юго-западе Испании, где карта ставит точку близ Уэльвы, примерно в 3825 км к западу от Иоппии; предлагались также Сардиния, Карфаген и Тарс в Киликии. Карта помечает его как спорный, а тур об Ионе его не включает, поскольку пророк туда не доплыл."
    - "4-я книга Царств называет «Иону, сына Амафиина, пророка из Гафхефера» в царствование Иеровоама II Израильского (ок. 793–753 гг. до н. э.); тур на карте поставлен на 780 г. до н. э. Книга Ионы начинается повелением «встань, иди в Ниневию, город великий, и проповедуй в нем» и бегством: «И встал Иона, чтобы бежать в Фарсис от лица Господня, и пришел в Иоппию, и нашел корабль, отправлявшийся в Фарсис». После бури и кита он пошёл в Ниневию — «город великий у Бога, на три дня ходьбы», и её жители покаялись; Иисус ставил ниневитян в пример: «Ниневитяне восстанут на суд с родом сим и осудят его»."
    - "Гафхефер помещают на Тель-Гат-Хефер, примерно в 5 км от Назарета. Иоппия была главной гаванью средней части побережья, куда сплавляли кедры с Ливана для храма Соломона; Иероним, описывая паломничество Павлы в 380-х годах, называет её пристанью, откуда бежал Иона. Ниневия стала столицей Ассирии при Сеннахириме около 700 г. до н. э., со стеной длиной около 12 км, и пала под натиском вавилонян и мидян в 612 г. до н. э.; позднее предание поместило гробницу Ионы на тамошнем холме Неби-Юнус. Фарсис у пророков — далёкая страна серебра, железа, олова и свинца, куда ходят морем; те, кто помещает его в Испании, указывают на богатое металлами побережье, которое греки знали как Тартесс, но имя означает и дальнее мореплавание вообще, как в выражении «корабли Фарсисские»."
  uk:
    - "Йону було послано до Ніневії, великого міста Ассирії на Тигрі, навпроти нинішнього Мосула в Іраку, приблизно за 820 км на північний схід від його рідного міста Гат-Хефер у Галілеї по прямій. Натомість він спустився до порту Яффа, нинішнього Яффо, і сів на корабель до Тарсису в протилежному напрямку. Де був Тарсис — спірно: за найпоширенішою думкою, це Тартесс на південному заході Іспанії, де мапа ставить його точку біля Уельви, приблизно за 3825 км на захід від Яффи; пропонували також Сардинію, Карфаген і Тарс у Кілікії. Мапа позначає його як спірний, а тур Йони його пропускає, бо Йона туди ніколи не дістався."
    - "Друга книга Царів називає «пророка Йону Аматієнка з Гатхеферу» за правління Єровоама II Ізраїльського (бл. 793–753 рр. до н. е.); тур на мапі розміщено в 780 р. до н. е. Книга Йони починається наказом: «Устань, подайсь у Ниневію, в город великий, і проповідуй проти його», і втечею: «Йона ж устав, щоб утїкати від Господа в Тарсис, і, дойшовши до Яфи, знайшов корабель, що йшов у Тарсис». Після бурі й риби він пішов до Ніневії, «великий город, на три днї ходи», і її жителі покаялися; Ісус поставив ніневіян за приклад: «Ниневяне встануть на суд із кодлом сим, та й осудять його»."
    - "Гат-Хефер розміщують у Тель-Ґат-Хефері, приблизно за 5 км від Назарета. Яффа була головним портом центрального узбережжя, гаванню, до якої сплавляли кедр із Лівану для Соломонового храму; Єронім, описуючи паломництво Паули в 380-х рр., називає її портом втечі Йони. Ніневія стала столицею Ассирії за Сінаххеріба близько 700 р. до н. е., з муром завдовжки близько 12 км, і впала перед вавилонянами й мідянами 612 р. до н. е.; пізніший переказ розмістив гробницю Йони на пагорбі Неби-Юнус там. Тарсис у пророків — далека країна срібла, заліза, олова й свинцю, куди пливли морем; ті, хто розміщує його в Іспанії, вказують на багате на метали узбережжя, відоме грецьким авторам як Тартесс, але ця назва також означає далекі морські плавання загалом, як у «кораблях Тарсису»."
  es:
    - "Jonás fue enviado a Nínive, la gran ciudad de Asiria a orillas del Tigris, frente a la actual Mosul, en Irak, a unos 820 km al noreste de su ciudad natal, Gat-hefer, en Galilea, en línea recta. En lugar de ir, bajó al puerto de Jope, la actual Jaffa, y se embarcó rumbo a Tarsis, en la dirección opuesta. Dónde estaba Tarsis se discute: la opinión habitual es Tartessos, en el suroeste de España, donde el mapa pone su punto, cerca de Huelva, a unos 3825 km al oeste de Jope; también se han propuesto Cerdeña, Cartago y Tarso de Cilicia. El mapa la marca como discutida, y el recorrido de Jonás la omite, puesto que él nunca llegó."
    - "2 Reyes nombra a «Jonás hijo de Amittai, profeta que fué de Gath-hepher», en el reinado de Jeroboam II de Israel (hacia 793–753 a. C.); el recorrido del mapa se sitúa en 780 a. C. El libro de Jonás se abre con la orden «Levántate, y ve á Nínive, ciudad grande, y pregona contra ella», y con la huida: «Y Jonás se levantó para huir de la presencia de Jehová á Tarsis, y descendió á Joppe; y halló un navío que partía para Tarsis». Tras la tormenta y el pez, fue a Nínive, «ciudad sobremanera grande, de tres días de camino», y su gente se arrepintió; Jesús puso a los ninivitas como ejemplo: «Los hombres de Nínive se levantarán en el juicio con esta generación, y la condenarán»."
    - "Gat-hefer se sitúa en Tel Gat Hefer, a unos 5 km de Nazaret. Jope era el principal puerto de la costa central, el puerto adonde se hacía flotar el cedro del Líbano para el Templo de Salomón; Jerónimo, al describir la peregrinación de Paula en la década del 380, lo nombra como el puerto de la huida de Jonás. Nínive pasó a ser la capital de Asiria bajo Senaquerib hacia el 700 a. C., con una muralla de unos 12 km de longitud, y cayó ante los babilonios y los medos en 612 a. C.; la tradición posterior situó la tumba de Jonás en el montículo de Nebi Yunus, allí. Tarsis en los profetas es una tierra lejana de plata, hierro, estaño y plomo a la que se llega por mar; quienes la sitúan en España señalan la costa rica en metales que los autores griegos conocían como Tartessos, pero el nombre también designa la navegación lejana en general, como en las naves de Tarsis."
  pt:
    - "Jonas foi enviado a Nínive, a grande cidade da Assíria no Tigre, em frente à atual Mosul, no Iraque, a cerca de 820 km a nordeste de sua cidade natal, Gate-Héfer, na Galileia, em linha reta. Em vez disso, desceu ao porto de Jope, a atual Jafa, e embarcou para Társis, na direção oposta. Onde ficava Társis é disputado: a visão usual é Tartessos, no sudoeste da Espanha, onde o mapa põe o seu ponto perto de Huelva, a cerca de 3.825 km a oeste de Jope; também foram propostas a Sardenha, Cartago e Tarso, na Cilícia. O mapa a assinala como disputada, e o percurso de Jonas a omite, já que ele nunca chegou lá."
    - "2 Reis nomeia “Jonas, filho de Amitai, o profeta, que era de Gate-Hefer”, no reinado de Jeroboão II de Israel (c. 793–753 a.C.); o percurso do mapa se situa em 780 a.C. O livro de Jonas abre com a ordem “Levante-se, vá à grande cidade de Nínive e pregue contra ela” e a fuga: “Mas Jonas se levantou para fugir da presença do SENHOR para Társis. Ele desceu a Jope e encontrou um navio que ia para Társis”. Depois da tempestade e do peixe, foi a Nínive, “uma cidade extremamente grande, de três dias de caminhada”, e o seu povo se arrependeu; Jesus apresentou os ninivitas como exemplo: “Os homens de Nínive se levantarão no juízo com esta geração e a condenarão”."
    - "Gate-Héfer é situada em Tel Gat Hefer, a cerca de 5 km de Nazaré. Jope era o principal porto do litoral central, o porto para onde se fazia flutuar o cedro do Líbano destinado ao Templo de Salomão; Jerônimo, ao descrever a peregrinação de Paula na década de 380, a nomeia como o porto da fuga de Jonas. Nínive tornou-se a capital da Assíria sob Senaqueribe, por volta de 700 a.C., com uma muralha de cerca de 12 km, e caiu diante dos babilônios e medos em 612 a.C.; a tradição posterior situou ali, no monte de Nebi Yunus, o túmulo de Jonas. Társis, nos profetas, é uma terra distante de prata, ferro, estanho e chumbo, alcançada por mar; os que a situam na Espanha apontam a costa rica em metais que os escritores gregos conheciam como Tartessos, mas o nome também designa em geral a navegação distante, como nas naus de Társis."
  de:
    - "Jona wurde nach Ninive gesandt, der großen Stadt Assyriens am Tigris, gegenüber dem heutigen Mosul im Irak, in der Luftlinie etwa 820 km nordöstlich seiner Heimatstadt Gat-Hefer in Galiläa. Stattdessen ging er hinab zum Hafen von Joppe, dem heutigen Jaffa, und nahm ein Schiff nach Tarsis in der Gegenrichtung. Wo Tarsis lag, ist umstritten: Die übliche Ansicht nennt Tartessos im Südwesten Spaniens, wo die Karte seinen Punkt bei Huelva setzt, etwa 3825 km westlich von Joppe; auch Sardinien, Karthago und Tarsus in Kilikien wurden vorgeschlagen. Die Karte kennzeichnet es als umstritten, und die Jona-Tour lässt es aus, da er nie ankam."
    - "Das Zweite Buch der Könige nennt „Jona, den Sohn Amitthais, den Propheten, der von Gath-Hepher war“, in der Regierungszeit Jerobeams II. von Israel (etwa 793–753 v. Chr.); die Tour der Karte ist auf 780 v. Chr. gesetzt. Das Buch Jona beginnt mit dem Befehl „Mache dich auf und gehe in die große Stadt Ninive und predige wider sie!“ und der Flucht: „Aber Jona machte sich auf und floh vor dem HERRN und wollte gen Tharsis und kam hinab gen Japho. Und da er ein Schiff fand, das gen Tharsis wollte fahren“. Nach dem Sturm und dem Fisch ging er nach Ninive, „eine große Stadt vor Gott, drei Tagereisen groß“, und ihre Bewohner taten Buße; Jesus hielt die Niniviten als Beispiel vor: „Die Leute von Ninive werden auftreten am Jüngsten Gericht mit diesem Geschlecht und werden es verdammen“."
    - "Gat-Hefer wird bei Tel Gat Hefer angesetzt, etwa 5 km von Nazareth. Joppe war der Haupthafen der mittleren Küste, der Hafen, in den die Zedern des Libanon für Salomos Tempel geflößt wurden; Hieronymus nennt es in seiner Schilderung der Pilgerfahrt der Paula in den 380er-Jahren als den Hafen von Jonas Flucht. Ninive wurde unter Sanherib um 700 v. Chr. Hauptstadt Assyriens, mit einer etwa 12 km langen Mauer, und fiel 612 v. Chr. an die Babylonier und Meder; die spätere Überlieferung verlegte das Grab Jonas auf den Hügel Nebi Yunus dort. Tarsis ist bei den Propheten ein fernes Land des Silbers, Eisens, Zinns und Bleis, das man über das Meer erreicht; wer es in Spanien sucht, verweist auf die metallreiche Küste, die griechische Autoren als Tartessos kannten, doch der Name steht auch für ferne Seefahrt überhaupt, wie in den Tarsisschiffen."
  fr:
    - "Jonas fut envoyé à Ninive, la grande ville d’Assyrie sur le Tigre, en face de l’actuelle Mossoul, en Irak, à environ 820 km au nord-est de sa ville natale, Gath-Hépher, en Galilée, à vol d’oiseau. Il descendit au contraire au port de Joppé, l’actuelle Jaffa, et prit un navire pour Tarsis, dans la direction opposée. L’emplacement de Tarsis est discuté : l’opinion courante y voit Tartessos, dans le sud-ouest de l’Espagne, où la carte place son point près de Huelva, à environ 3 825 km à l’ouest de Joppé ; la Sardaigne, Carthage et Tarse en Cilicie ont aussi été proposées. La carte la marque comme discutée, et le parcours de Jonas l’omet, puisqu’il n’y arriva jamais."
    - "Le deuxième livre des Rois nomme « Jonas, le prophète, fils d’Amitthaï, de Gath-Hépher », sous le règne de Jéroboam II d’Israël (vers 793-753 av. J.-C.) ; le parcours de la carte est placé en 780 av. J.-C. Le livre de Jonas s’ouvre sur l’ordre « Lève-toi, va à Ninive, la grande ville, et crie contre elle ! » et sur la fuite : « Et Jonas se leva pour s’enfuir à Tarsis, loin de la face de l’Éternel. Il descendit à Japho, et il trouva un navire qui allait à Tarsis ». Après la tempête et le poisson, il alla à Ninive, « une très grande ville, de trois jours de marche », et ses habitants se repentirent ; Jésus a proposé les Ninivites en exemple : « Les hommes de Ninive se lèveront, au jour du jugement, avec cette génération et la condamneront »."
    - "Gath-Hépher est placée à Tel Gat Hefer, à environ 5 km de Nazareth. Joppé était le principal port de la côte centrale, où l’on faisait flotter le cèdre du Liban pour le Temple de Salomon ; Jérôme, décrivant le pèlerinage de Paule dans les années 380, en fait le port de la fuite de Jonas. Ninive devint la capitale de l’Assyrie sous Sanchérib, vers 700 av. J.-C., avec un rempart d’environ 12 km, et tomba devant les Babyloniens et les Mèdes en 612 av. J.-C. ; une tradition plus tardive plaça le tombeau de Jonas sur sa butte de Nebi Younès. Dans les prophètes, Tarsis est un pays lointain d’argent, de fer, d’étain et de plomb, atteint par la mer ; ceux qui la placent en Espagne invoquent la côte riche en métaux que les auteurs grecs connaissaient sous le nom de Tartessos, mais le nom désigne aussi, en général, la navigation lointaine, comme dans les navires de Tarsis."
  pl:
    - "Jonasza wysłano do Niniwy, wielkiego miasta Asyrii nad Tygrysem, naprzeciw dzisiejszego Mosulu w Iraku, około 820 km na północny wschód od jego rodzinnego Gat-Chefer w Galilei w linii prostej. On zaś zszedł do portu w Jafie, dzisiejszej Jaffie, i wsiadł na okręt do Tarszisz, w przeciwnym kierunku. Gdzie leżał Tarszisz, jest sporne: zwykle wskazuje się Tartessos w południowo-zachodniej Hiszpanii, gdzie mapa umieszcza jego punkt koło Huelvy, około 3825 km na zachód od Jafy; proponowano też Sardynię, Kartaginę i Tars w Cylicji. Mapa oznacza go jako sporny, a wędrówka śladami Jonasza go pomija, bo Jonasz tam nie dotarł."
    - "Druga Księga Królewska wymienia „Jonasza, syna Amaty, proroka; który był z Gatefer” za panowania Jeroboama II izraelskiego (ok. 793–753 p.n.e.); wędrówka na mapie dzieje się w 780 p.n.e. Księga Jonasza zaczyna się od polecenia „Wstań, idź do Niniwy miasta tego wielkiego, a wołaj przeciwko niemu” i od ucieczki: „Ale Jonasz wstał, aby uciekł do Tarsu od oblicza Pańskiego; a przyszedłszy do Joppen, znalazł okręt, który miał iść do Tarsu”. Po burzy i rybie poszedł do Niniwy: „Niniwe było miasto bardzo wielkie na trzy dni drogi”, a jej mieszkańcy się nawrócili; Jezus postawił Niniwitów za przykład: „Mężowie Niniwiccy staną na sądzie z tym rodzajem, i potępią go”."
    - "Gat-Chefer umieszcza się w Tel Gat Hefer, około 5 km od Nazaretu. Jafa była głównym portem środkowego wybrzeża, przystanią, do której spławiano cedr z Libanu dla Świątyni Salomona; Hieronim, opisując pielgrzymkę Pauli w latach 380., nazywa ją portem ucieczki Jonasza. Niniwa stała się stolicą Asyrii za Sennacheryba około 700 p.n.e., z murem długim na około 12 km, i padła przed Babilończykami i Medami w 612 p.n.e.; późniejsza tradycja umieściła tam grób Jonasza na wzgórzu Nebi Yunus. Tarszisz u proroków to daleka kraina srebra, żelaza, cyny i ołowiu, osiągana morzem; ci, którzy umieszczają go w Hiszpanii, wskazują na bogate w metale wybrzeże, które pisarze greccy znali jako Tartessos, ale nazwa oznacza też w ogóle daleką żeglugę, jak w okrętach Tarszisz."
  it:
    - "Giona fu mandato a Ninive, la grande città dell’Assiria sul Tigri di fronte all’odierna Mosul in Iraq, a circa 820 km a nord-est della sua città natale, Gat-Efer in Galilea, in linea d’aria. Invece scese al porto di Giaffa, l’odierna Jaffa, e s’imbarcò per Tarsis nella direzione opposta. Dove fosse Tarsis è discusso: l’opinione consueta è Tartesso nella Spagna sud-occidentale, dove la mappa pone il suo punto presso Huelva, a circa 3.825 km a ovest di Giaffa; sono state proposte anche la Sardegna, Cartagine e Tarso di Cilicia. La mappa la segna come discussa, e il percorso di Giona la omette, poiché egli non vi giunse mai."
    - "Il secondo libro dei Re nomina «il profeta Giona, figliuolo di Amittai, che era di Gath-Hefer», al tempo di Geroboamo II d’Israele (793–753 a.C. circa); il percorso della mappa è ambientato nel 780 a.C. Il libro di Giona si apre con il comando «Lèvati, va’ a Ninive, la gran città, e predica contro di lei», e con la fuga: «Giona si levò per fuggirsene a Tarsis, lungi dal cospetto dell’Eterno; e scese a Giaffa, dove trovò una nave che andava a Tarsis». Dopo la tempesta e il pesce andò a Ninive, «una grande città dinanzi a Dio, di tre giornate di cammino», e il suo popolo si pentì; Gesù additò i Niniviti come esempio: «I Niniviti risorgeranno nel giudizio con questa generazione e la condanneranno»."
    - "Gat-Efer si colloca a Tel Gat Hefer, a circa 5 km da Nazaret. Giaffa era il porto principale della costa centrale, il porto al quale il cedro del Libano veniva fatto arrivare su zattere per il Tempio di Salomone; Girolamo, descrivendo il pellegrinaggio di Paola negli anni 380, la nomina come il porto della fuga di Giona. Ninive divenne la capitale dell’Assiria sotto Sennacherib verso il 700 a.C., con una cinta muraria lunga circa 12 km, e cadde in mano ai Babilonesi e ai Medi nel 612 a.C.; la tradizione successiva collocò la tomba di Giona sul tell di Nebi Yunus. Nei profeti Tarsis è una terra lontana di argento, ferro, stagno e piombo raggiungibile per mare; chi la colloca in Spagna richiama la costa ricca di metalli che gli scrittori greci conoscevano come Tartesso, ma il nome indica anche in generale la navigazione verso terre lontane, come nelle navi di Tarsis."
  cs:
    - "Jonáš byl poslán do Ninive, velkého města Asýrie na Tigridu naproti dnešnímu Mosulu v Iráku, vzdušnou čarou asi 820 km severovýchodně od jeho rodného města Gat-chefer v Galileji. On však sestoupil do přístavu Joppe, dnešní Jaffy, a nalodil se do Taršíše na opačnou stranu. Kde Taršíš ležel, je sporné: obvyklý názor je Tartéssos v jihozápadním Španělsku, kam mapa klade jeho bod poblíž Huelvy, asi 3 825 km západně od Joppe; navrhována byla i Sardinie, Kartágo a Tarsos v Kilikii. Mapa jej označuje jako sporný a Jonášova trasa ho vynechává, protože tam nikdy nedorazil."
    - "Druhá kniha Královská jmenuje „Jonáše syna Amaty proroka, kterýž byl z Gethefer“ za vlády izraelského Jarobeáma II. (asi 793–753 př. n. l.); trasa na mapě je zasazena do roku 780 př. n. l. Kniha Jonáš začíná příkazem „Vstaň, jdi do Ninive města toho velikého, a volej proti němu“ a útěkem: „Ale Jonáš vstal, aby utekl do Tarsu od tváři Hospodinovy. A přišed do Joppe, našel lodí, ana jde do Tarsu“. Po bouři a rybě šel do Ninive, které bylo „město velmi veliké, cesty tří dnů“, a jeho obyvatelé činili pokání; Ježíš postavil Ninivské za příklad: „Muži Ninivitští stanou na soudu s pokolením tímto, a odsoudí je“."
    - "Gat-chefer se klade do Tel Gat Hefer, asi 5 km od Nazareta. Joppe byla hlavním přístavem středního pobřeží, přístavem, do něhož se plavilo cedrové dříví z Libanonu pro Šalomounův chrám; Jeroným ji v líčení pouti Paulině z 380. let jmenuje jako přístav Jonášova útěku. Ninive se stalo hlavním městem Asýrie za Senacheriba kolem roku 700 př. n. l. s hradbou dlouhou asi 12 km a roku 612 př. n. l. padlo Babyloňanům a Médům; pozdější tradice umístila Jonášův hrob na tamní pahorek Nebi Júnus. Taršíš je u proroků vzdálená země stříbra, železa, cínu a olova dosažitelná po moři; ti, kdo jej kladou do Španělska, poukazují na pobřeží bohaté na kovy, které řečtí spisovatelé znali jako Tartéssos, ale jméno stojí i za vzdálené mořeplavectví vůbec, jako v lodích taršíšských."
  nl:
    - "Jona werd gezonden naar Nineve, de grote stad van Assyrië aan de Tigris, tegenover het huidige Mosoel in Irak, hemelsbreed ongeveer 820 km ten noordoosten van zijn geboortestad Gat-Chefer in Galilea. In plaats daarvan ging hij af naar de havenstad Joppe, het huidige Jaffa, en nam een schip naar Tarsis, in de tegenovergestelde richting. Waar Tarsis lag is omstreden: de gebruikelijke opvatting is Tartessos in het zuidwesten van Spanje, waar de kaart het punt bij Huelva zet, ongeveer 3825 km ten westen van Joppe; ook Sardinië, Carthago en Tarsus in Cilicië zijn voorgesteld. De kaart markeert het als omstreden, en de Jona-tour laat het weg, omdat hij er nooit aankwam."
    - "Tweede Koningen noemt “Jona, den zoon van Amitthai, den profeet, die van Gath-hefer was”, onder de regering van Jerobeam II van Israël (ca. 793–753 v.Chr.); de tour op de kaart speelt in 780 v.Chr. Het boek Jona opent met het bevel “Maak u op, ga naar de grote stad Nineve, en predik tegen haar” en met de vlucht: “Maar Jona maakte zich op om te vluchten naar Tarsis, van het aangezicht des HEEREN; en hij kwam af te Jafo, en vond een schip, gaande naar Tarsis”. Na de storm en de vis ging hij naar Nineve, “een grote stad Gods, van drie dagreizen”, en haar bewoners bekeerden zich; Jezus hield de Ninevieten als voorbeeld voor: “De mannen van Nineve zullen opstaan in het oordeel met dit geslacht, en zullen hetzelve veroordelen”."
    - "Gat-Chefer wordt gesitueerd bij Tel Gat Chefer, ongeveer 5 km van Nazareth. Joppe was de belangrijkste haven van de middenkust, de haven waarheen cederhout uit Libanon werd gevlot voor de tempel van Salomo; Hieronymus noemt haar, in zijn beschrijving van de bedevaart van Paula in de jaren 380, als de haven van Jona's vlucht. Nineve werd onder Sanherib rond 700 v.Chr. de hoofdstad van Assyrië, met een muur van ongeveer 12 km lang, en viel in 612 v.Chr. aan de Babyloniërs en Meden; later plaatste de overlevering het graf van Jona op de heuvel Nebi Yunus daar. Tarsis is bij de profeten een ver land van zilver, ijzer, tin en lood dat over zee wordt bereikt; wie het in Spanje plaatsen wijzen op de metaalrijke kust die Griekse schrijvers als Tartessos kenden, maar de naam staat ook voor verre zeevaart in het algemeen, zoals in de schepen van Tarsis."
  sv:
    - "Jona sändes till Nineve, Assyriens stora stad vid Tigris mitt emot dagens Mosul i Irak, omkring 820 km nordost om hans hemstad Gat-Hefer i Galileen i fågelvägen. I stället gick han ned till hamnen i Joppe, i dag Jaffa, och tog skepp till Tarshish åt motsatt håll. Var Tarshish låg är omstritt: den vanliga uppfattningen är Tartessos i sydvästra Spanien, där kartan sätter sin punkt nära Huelva, omkring 3 825 km väster om Joppe; Sardinien, Kartago och Tarsos i Kilikien har också föreslagits. Kartan markerar det som omstritt, och Jonaturen utelämnar det, eftersom han aldrig kom fram."
    - "Andra Kungaboken nämner ”profeten Jona, Amittais son, från Gat-Hahefer” under Jerobeam II:s regering över Israel (ca 793–753 f.Kr.); kartans tur är förlagd till år 780 f.Kr. Jonaboken inleds med befallningen ”Stå upp och begiv dig till Nineve, den stora staden, och predika för den” och med flykten: ”Men Jona stod upp och ville fly till Tarsis, undan HERRENS ansikte. Och han for ned till Jafo och fann där ett skepp som skulle gå till Tarsis.” Efter stormen och fisken gick han till Nineve, ”en stor stad inför Gud, tre dagsresor lång”, och dess folk gjorde bättring; Jesus höll upp ninevinerna som ett exempel: ”Ninevitiska män skola vid domen träda fram tillsammans med detta släkte och bliva det till dom.”"
    - "Gat-Hefer förläggs till Tel Gat Hefer, omkring 5 km från Nasaret. Joppe var den centrala kustens huvudhamn, hamnen dit cederträ från Libanon flottades för Salomos tempel; Hieronymus, som beskriver Paulas pilgrimsfärd på 380-talet, nämner den som hamnen för Jonas flykt. Nineve blev Assyriens huvudstad under Sanherib omkring 700 f.Kr., med en mur på omkring 12 km, och föll för babylonierna och mederna 612 f.Kr.; senare tradition förlade Jonas grav till kullen Nebi Yunus där. Tarshish hos profeterna är ett fjärran land med silver, järn, tenn och bly som nås sjövägen; de som förlägger det till Spanien pekar på den metallrika kust som grekiska författare kände som Tartessos, men namnet står också för avlägsen sjöfart i allmänhet, som i Tarshish-skeppen."
  nb:
    - "Jona ble sendt til Ninive, den store byen i Assyria ved Tigris, rett overfor dagens Mosul i Irak, omtrent 820 km nordøst for hjembyen Gat-Hefer i Galilea i luftlinje. I stedet dro han ned til havnen i Jaffa og tok skip til Tarsis i motsatt retning. Hvor Tarsis lå, er omstridt: det vanlige synet er Tartessos i Sørvest-Spania, der kartet setter punktet nær Huelva, omtrent 3825 km vest for Jaffa; Sardinia, Kartago og Tarsos i Kilikia er også foreslått. Kartet markerer det som omstridt, og Jona-turen utelater det, siden han aldri kom dit."
    - "Andre Kongebok nevner «profeten Jonas, Amittais sønn, fra Gat-Hefer» under Jeroboam II av Israel (ca. 793–753 f.Kr.); kartets tur er satt til 780 f.Kr. Jonas bok åpner med befalingen «Stå op, gå til Ninive, den store stad, og tal for den!» og flukten: «Men Jonas stod op og vilde fly til Tarsis, bort fra Herrens åsyn; og han drog ned til Joppe og fant der et skib som skulde gå til Tarsis». Etter stormen og fisken gikk han til Ninive, «en stor stad for Gud, tre dagsreiser lang», og folket omvendte seg; Jesus holdt ninivittene frem som eksempel: «Ninives menn skal stå op på dommens dag sammen med denne slekt og fordømme den»."
    - "Gat-Hefer plasseres ved Tel Gat Hefer, omtrent 5 km fra Nasaret. Jaffa var hovedhavnen på den midtre kysten, havnen som sedertre fra Libanon ble fløtet til for Salomos tempel; Hieronymus nevner den, i sin beskrivelse av Paulas pilegrimsreise på 380-tallet, som havnen for Jonas’ flukt. Ninive ble Assyrias hovedstad under Sankerib omkring 700 f.Kr., med en mur på omtrent 12 km, og falt til babylonerne og mederne i 612 f.Kr.; senere tradisjon plasserte Jonas’ grav på haugen Nebi Yunus der. Tarsis er i profetene et fjernt land med sølv, jern, tinn og bly, nådd sjøveien; de som plasserer det i Spania peker på den metallrike kysten som greske forfattere kjente som Tartessos, men navnet står også for fjern sjøfart generelt, som i Tarsis-skipene."
  tl:
    - "Isinugo si Jonas sa Ninive, ang dakilang lungsod ng Asiria sa Tigris, sa tapat ng kasalukuyang Mosul sa Iraq, mga 820 km sa hilagang-silangan ng kaniyang sariling bayan na Gath-hepher sa Galilea sa tuwid na guhit. Sa halip ay lumusong siya sa daungan ng Joppa, ang Jaffa ngayon, at sumakay ng barko patungong Tharsis sa kabilang direksiyon. Pinagtatalunan kung nasaan ang Tharsis: ang karaniwang pananaw ay ang Tartessos sa timog-kanlurang Espanya, kung saan inilalagay ito ng mapa malapit sa Huelva, mga 3,825 km sa kanluran ng Joppa; iminungkahi rin ang Sardinia, Cartago at Tarso sa Cilicia. Minarkahan ito ng mapa bilang pinagtatalunan, at hindi ito isinama ng paglilibot ni Jonas, yamang hindi siya nakarating."
    - "Binabanggit ng 2 Mga Hari si “Jonas na anak ni Amittai, na propeta na taga Gath-hepher”, sa paghahari ni Jeroboam II ng Israel (c. 793–753 BK); ang paglilibot ng mapa ay itinakda sa 780 BK. Nagsisimula ang aklat ni Jonas sa utos na “Bumangon ka, pumaroon ka sa Ninive, sa malaking bayang yaon, at humiyaw ka laban doon”, at sa pagtakas: “si Jonas ay bumangon upang tumakas na patungo sa Tarsis mula sa harapan ng Panginoon; at siya'y lumusong sa Joppe, at nakasumpong ng sasakyan na patungo sa Tarsis”. Pagkatapos ng bagyo at ng isda ay pumunta siya sa Ninive, na “totoong malaking bayan, na tatlong araw na lakarin”, at nagsisi ang mga tao nito; ipinakita ni Jesus ang mga taga-Ninive bilang halimbawa: “Magsisitayo sa paghuhukom ang mga tao sa Nineve na kasama ng lahing ito, at ito'y hahatulan”."
    - "Ang Gath-hepher ay inilalagay sa Tel Gat Hefer, mga 5 km mula sa Nazaret. Ang Joppa ang pangunahing daungan ng gitnang baybayin, kung saan inilutang ang sedro mula sa Libano para sa Templo ni Salomon; tinukoy ito ni Jeronimo, sa peregrinasyon ni Paula noong dekada 380, bilang daungan ng pagtakas ni Jonas. Naging kabisera ng Asiria ang Ninive sa ilalim ni Sennacherib noong mga 700 BK, na may pader na mga 12 km, at bumagsak sa mga Babilonio at Medo noong 612 BK; inilagay ng huling tradisyon ang libingan ni Jonas doon, sa burol ng Nebi Yunus. Sa mga propeta, ang Tharsis ay malayong lupain ng pilak, bakal, lata at tingga na naaabot sa dagat; ang naglalagay nito sa Espanya ay tumuturo sa baybaying mayaman sa metal na tinawag ng mga Griyego na Tartessos, ngunit nangangahulugan din ang pangalan ng malayong paglalayag sa pangkalahatan, gaya sa mga barko ng Tharsis."
  da:
    - "Jonas blev sendt til Nineve, Assyriens store by ved Tigris over for nutidens Mosul i Irak, ca. 820 km nordøst for hans hjemby Gat-Hefer i Galilæa i fugleflugt. I stedet gik han ned til havnen i Joppe, nutidens Jaffa, og tog skib til Tarsis i den modsatte retning. Hvor Tarsis lå, er omstridt: Det gængse synspunkt er Tartessos i det sydvestlige Spanien, hvor kortet sætter sit punkt nær Huelva, ca. 3.825 km vest for Joppe; Sardinien, Karthago og Tarsus i Kilikien er også blevet foreslået. Kortet markerer det som omstridt, og Jonas-turen udelader det, da han aldrig nåede frem."
    - "Anden Kongebog nævner »Jona, Amithajs Søn, den Profet, som var fra Gath-Hefer« i Israels kong Jeroboam 2.’s tid (ca. 793-753 f.Kr.); kortets tur er sat til 780 f.Kr. Jonas’ Bog åbner med befalingen »Gør dig rede, gak til Ninive, den store Stad, og raab over den« og flugten: »Men Jonas gjorde sig rede for at fly til Tharsis fra Herrens Ansigt; og han drog ned til Jafo og fandt et Skib, som vilde fare til Tharsis«. Efter stormen og fisken gik han til Nineve, »en stor Stad for Gud, en tre Dages Gang«, og dens folk omvendte sig; Jesus holdt ninivitterne frem som et eksempel: »Mænd fra Ninive skulle opstaa ved Dommen sammen med denne Slægt og fordømme den«."
    - "Gat-Hefer placeres ved Tel Gat Hefer, ca. 5 km fra Nazaret. Joppe var den vigtigste havn ved den centrale kyst, havnen som cedertræ fra Libanon blev ført ned som flåder til for Salomos tempel; Hieronymus nævner den i sin beskrivelse af Paulas pilgrimsrejse i 380’erne som havnen for Jonas’ flugt. Nineve blev Assyriens hovedstad under Sankerib omkring 700 f.Kr., med en mur på ca. 12 km, og faldt til babylonierne og mederne i 612 f.Kr.; senere tradition placerede Jonas’ grav på højen Nebi Yunus dér. Tarsis i profeterne er et fjernt land med sølv, jern, tin og bly, nået ad søvejen; de, der placerer det i Spanien, peger på den metalrige kyst, som græske forfattere kendte som Tartessos, men navnet står også for fjern søfart i almindelighed, som i Tarsis-skibene."
  sr:
    - "Јона је био послан у Ниневију, велики град Асирије на Тигру, преко пута данашњег Мосула у Ираку, око 820 км североисточно од његовог родног места Гетефера у Галилеји ваздушном линијом. Уместо тога сишао је у лучки град Јопу, данашњу Јафу, и укрцао се на лађу за Тарсис у супротном правцу. Где је био Тарсис, спорно је: уобичајено гледиште је Тартес у југозападној Шпанији, где карта ставља његову тачку близу Уелве, око 3.825 км западно од Јопе; предлагани су и Сардинија, Картагина и Тарс у Киликији. Карта га означава као спорног, а обилазак посвећен Јони га изоставља, јер он тамо никад није стигао."
    - "Друга књига о царевима у владавини Јеровоама II од Израела (око 793–753. п. н. е.) бележи реч Господњу изречену „преко слуге свог Јоне сина Аматијевог, пророка из Гетефера“; обилазак на карти смештен је у 780. п. н. е. Књига о Јони почиње заповешћу „Устани, иди у Ниневију град велики, и проповедај против њега“ и бекством: „А Јона уста да бежи у Тарсис од Господа, и сишав у Јопу нађе лађу која иђаше у Тарсис“. После олује и рибе отишао је у Ниневију, „град врло велик, три дана хода“, и њени становници су се покајали; Исус је Ниневљане истакао као пример: „Ниневљани изићи ће на суд с родом овим, и осудиће га“."
    - "Гетефер се смешта у Тел Гат Хефер, око 5 км од Назарета. Јопа је била главна лука централне обале, пристаниште у које је кедар из Ливана био сплављан за Соломонов храм; Јероним, описујући Паулино ходочашће из 380-их, наводи је као луку Јониног бекства. Нинива је постала престоница Асирије под Сенахиримом око 700. п. н. е., са зидом дугим око 12 км, а пала је у руке Вавилонаца и Међана 612. п. н. е.; предање је касније ставило Јонин гроб на хумку Неби Јунус тамо. Тарсис је код пророка далека земља сребра, гвожђа, калаја и олова до које се стиже морем; они који га смештају у Шпанију указују на обалу богату металима коју су грчки писци знали као Тартес, али име стоји и за далека поморска путовања уопште, као у лађама Тарсиса."
