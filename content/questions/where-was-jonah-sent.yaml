id: where-was-jonah-sent
question:
  en: "Where was Jonah sent, and where did he flee?"
  ru: "Куда был послан Иона и куда он бежал?"
  uk: "Куди був посланий Йона і куди він утікав?"
  es: "¿Adónde fue enviado Jonás y adónde huyó?"
  pt: "Para onde Jonas foi enviado, e para onde fugiu?"
  de: "Wohin wurde Jona gesandt, und wohin floh er?"
  fr: "Où Jonas fut-il envoyé, et où s’enfuit-il ?"
answer:
  en:
    - "Jonah was sent to Nineveh, the great city of Assyria on the Tigris opposite today's Mosul in Iraq, about 820 km north-east of his home town Gath-hepher in Galilee in a straight line. Instead he went down to the port of Joppa, today's Jaffa, and took ship for Tarshish in the opposite direction. Where Tarshish was is disputed: the usual view is Tartessos in south-western Spain, where the map puts its point near Huelva, about 3,825 km west of Joppa; Sardinia, Carthage and Tarsus in Cilicia have also been proposed. The map marks it as disputed, and the Jonah tour leaves it out, since he never arrived."
    - '2 Kings names "Jonah, the son of Amittai, the prophet, which was of Gath-hepher", in the reign of Jeroboam II of Israel (c. 793–753 BC); the map''s tour is set at 780 BC. The book of Jonah opens with the command "Arise, go to Nineveh, that great city, and cry against it", and the flight: "But Jonah rose up to flee unto Tarshish from the presence of the LORD, and went down to Joppa; and he found a ship going to Tarshish". After the storm and the fish he went to Nineveh, "an exceeding great city of three days'' journey", and its people repented; Jesus held up the Ninevites as an example: "The men of Nineveh shall rise in judgment with this generation, and shall condemn it".'
    - "Gath-hepher is placed at Tel Gat Hefer, about 5 km from Nazareth. Joppa was the chief port of the central coast, the harbour to which cedar from Lebanon was floated for Solomon's Temple; Jerome, describing Paula's pilgrimage of the 380s, names it as the port of Jonah's flight. Nineveh became the capital of Assyria under Sennacherib about 700 BC, with a wall about 12 km long, and fell to the Babylonians and Medes in 612 BC; later tradition placed the tomb of Jonah on the mound of Nebi Yunus there. Tarshish in the prophets is a far land of silver, iron, tin and lead reached by sea; those who place it in Spain point to the metal-rich coast that Greek writers knew as Tartessos, but the name also stands for distant seafaring in general, as in the ships of Tarshish."
  ru:
    - "Иона был послан в Ниневию, великий город Ассирии на Тигре напротив нынешнего Мосула в Ираке, примерно в 820 км к северо-востоку от его родного Гафхефера в Галилее по прямой. Вместо этого он пришёл в гавань Иоппию, нынешнюю Яффу, и сел на корабль в Фарсис, в противоположную сторону. Где был Фарсис, спорно: обычно его отождествляют с Тартессом на юго-западе Испании, где карта ставит точку близ Уэльвы, примерно в 3825 км к западу от Иоппии; предлагались также Сардиния, Карфаген и Тарс в Киликии. Карта помечает его как спорный, а тур об Ионе его не включает, поскольку пророк туда не доплыл."
    - "4-я книга Царств называет «Иону, сына Амафиина, пророка из Гафхефера» в царствование Иеровоама II Израильского (ок. 793–753 гг. до н. э.); тур на карте поставлен на 780 г. до н. э. Книга Ионы начинается повелением «встань, иди в Ниневию, город великий, и проповедуй в нем» и бегством: «И встал Иона, чтобы бежать в Фарсис от лица Господня, и пришел в Иоппию, и нашел корабль, отправлявшийся в Фарсис». После бури и кита он пошёл в Ниневию — «город великий у Бога, на три дня ходьбы», и её жители покаялись; Иисус ставил ниневитян в пример: «Ниневитяне восстанут на суд с родом сим и осудят его»."
    - "Гафхефер помещают на Тель-Гат-Хефер, примерно в 5 км от Назарета. Иоппия была главной гаванью средней части побережья, куда сплавляли кедры с Ливана для храма Соломона; Иероним, описывая паломничество Павлы в 380-х годах, называет её пристанью, откуда бежал Иона. Ниневия стала столицей Ассирии при Сеннахириме около 700 г. до н. э., со стеной длиной около 12 км, и пала под натиском вавилонян и мидян в 612 г. до н. э.; позднее предание поместило гробницу Ионы на тамошнем холме Неби-Юнус. Фарсис у пророков — далёкая страна серебра, железа, олова и свинца, куда ходят морем; те, кто помещает его в Испании, указывают на богатое металлами побережье, которое греки знали как Тартесс, но имя означает и дальнее мореплавание вообще, как в выражении «корабли Фарсисские»."
  uk:
    - "Йону було послано до Ніневії, великого міста Ассирії на Тигрі, навпроти нинішнього Мосула в Іраку, приблизно за 820 км на північний схід від його рідного міста Гат-Хефер у Галілеї по прямій. Натомість він спустився до порту Яффа, нинішнього Яффо, і сів на корабель до Тарсису в протилежному напрямку. Де був Тарсис — спірно: за найпоширенішою думкою, це Тартесс на південному заході Іспанії, де мапа ставить його точку біля Уельви, приблизно за 3825 км на захід від Яффи; пропонували також Сардинію, Карфаген і Тарс у Кілікії. Мапа позначає його як спірний, а тур Йони його пропускає, бо Йона туди ніколи не дістався."
    - "Друга книга Царів називає «пророка Йону Аматієнка з Гатхеферу» за правління Єровоама II Ізраїльського (бл. 793–753 рр. до н. е.); тур на мапі розміщено в 780 р. до н. е. Книга Йони починається наказом: «Устань, подайсь у Ниневію, в город великий, і проповідуй проти його», і втечею: «Йона ж устав, щоб утїкати від Господа в Тарсис, і, дойшовши до Яфи, знайшов корабель, що йшов у Тарсис». Після бурі й риби він пішов до Ніневії, «великий город, на три днї ходи», і її жителі покаялися; Ісус поставив ніневіян за приклад: «Ниневяне встануть на суд із кодлом сим, та й осудять його»."
    - "Гат-Хефер розміщують у Тель-Ґат-Хефері, приблизно за 5 км від Назарета. Яффа була головним портом центрального узбережжя, гаванню, до якої сплавляли кедр із Лівану для Соломонового храму; Єронім, описуючи паломництво Паули в 380-х рр., називає її портом втечі Йони. Ніневія стала столицею Ассирії за Сінаххеріба близько 700 р. до н. е., з муром завдовжки близько 12 км, і впала перед вавилонянами й мідянами 612 р. до н. е.; пізніший переказ розмістив гробницю Йони на пагорбі Неби-Юнус там. Тарсис у пророків — далека країна срібла, заліза, олова й свинцю, куди пливли морем; ті, хто розміщує його в Іспанії, вказують на багате на метали узбережжя, відоме грецьким авторам як Тартесс, але ця назва також означає далекі морські плавання загалом, як у «кораблях Тарсису»."
  es:
    - "Jonás fue enviado a Nínive, la gran ciudad de Asiria a orillas del Tigris, frente a la actual Mosul, en Irak, a unos 820 km al noreste de su ciudad natal, Gat-hefer, en Galilea, en línea recta. En lugar de ir, bajó al puerto de Jope, la actual Jaffa, y se embarcó rumbo a Tarsis, en la dirección opuesta. Dónde estaba Tarsis se discute: la opinión habitual es Tartessos, en el suroeste de España, donde el mapa pone su punto, cerca de Huelva, a unos 3825 km al oeste de Jope; también se han propuesto Cerdeña, Cartago y Tarso de Cilicia. El mapa la marca como discutida, y el recorrido de Jonás la omite, puesto que él nunca llegó."
    - "2 Reyes nombra a «Jonás hijo de Amittai, profeta que fué de Gath-hepher», en el reinado de Jeroboam II de Israel (hacia 793–753 a. C.); el recorrido del mapa se sitúa en 780 a. C. El libro de Jonás se abre con la orden «Levántate, y ve á Nínive, ciudad grande, y pregona contra ella», y con la huida: «Y Jonás se levantó para huir de la presencia de Jehová á Tarsis, y descendió á Joppe; y halló un navío que partía para Tarsis». Tras la tormenta y el pez, fue a Nínive, «ciudad sobremanera grande, de tres días de camino», y su gente se arrepintió; Jesús puso a los ninivitas como ejemplo: «Los hombres de Nínive se levantarán en el juicio con esta generación, y la condenarán»."
    - "Gat-hefer se sitúa en Tel Gat Hefer, a unos 5 km de Nazaret. Jope era el principal puerto de la costa central, el puerto adonde se hacía flotar el cedro del Líbano para el Templo de Salomón; Jerónimo, al describir la peregrinación de Paula en la década del 380, lo nombra como el puerto de la huida de Jonás. Nínive pasó a ser la capital de Asiria bajo Senaquerib hacia el 700 a. C., con una muralla de unos 12 km de longitud, y cayó ante los babilonios y los medos en 612 a. C.; la tradición posterior situó la tumba de Jonás en el montículo de Nebi Yunus, allí. Tarsis en los profetas es una tierra lejana de plata, hierro, estaño y plomo a la que se llega por mar; quienes la sitúan en España señalan la costa rica en metales que los autores griegos conocían como Tartessos, pero el nombre también designa la navegación lejana en general, como en las naves de Tarsis."
  pt:
    - "Jonas foi enviado a Nínive, a grande cidade da Assíria no Tigre, em frente à atual Mosul, no Iraque, a cerca de 820 km a nordeste de sua cidade natal, Gate-Héfer, na Galileia, em linha reta. Em vez disso, desceu ao porto de Jope, a atual Jafa, e embarcou para Társis, na direção oposta. Onde ficava Társis é disputado: a visão usual é Tartessos, no sudoeste da Espanha, onde o mapa põe o seu ponto perto de Huelva, a cerca de 3.825 km a oeste de Jope; também foram propostas a Sardenha, Cartago e Tarso, na Cilícia. O mapa a assinala como disputada, e o percurso de Jonas a omite, já que ele nunca chegou lá."
    - "2 Reis nomeia “Jonas, filho de Amitai, o profeta, que era de Gate-Hefer”, no reinado de Jeroboão II de Israel (c. 793–753 a.C.); o percurso do mapa se situa em 780 a.C. O livro de Jonas abre com a ordem “Levante-se, vá à grande cidade de Nínive e pregue contra ela” e a fuga: “Mas Jonas se levantou para fugir da presença do SENHOR para Társis. Ele desceu a Jope e encontrou um navio que ia para Társis”. Depois da tempestade e do peixe, foi a Nínive, “uma cidade extremamente grande, de três dias de caminhada”, e o seu povo se arrependeu; Jesus apresentou os ninivitas como exemplo: “Os homens de Nínive se levantarão no juízo com esta geração e a condenarão”."
    - "Gate-Héfer é situada em Tel Gat Hefer, a cerca de 5 km de Nazaré. Jope era o principal porto do litoral central, o porto para onde se fazia flutuar o cedro do Líbano destinado ao Templo de Salomão; Jerônimo, ao descrever a peregrinação de Paula na década de 380, a nomeia como o porto da fuga de Jonas. Nínive tornou-se a capital da Assíria sob Senaqueribe, por volta de 700 a.C., com uma muralha de cerca de 12 km, e caiu diante dos babilônios e medos em 612 a.C.; a tradição posterior situou ali, no monte de Nebi Yunus, o túmulo de Jonas. Társis, nos profetas, é uma terra distante de prata, ferro, estanho e chumbo, alcançada por mar; os que a situam na Espanha apontam a costa rica em metais que os escritores gregos conheciam como Tartessos, mas o nome também designa em geral a navegação distante, como nas naus de Társis."
  de:
    - "Jona wurde nach Ninive gesandt, der großen Stadt Assyriens am Tigris, gegenüber dem heutigen Mosul im Irak, in der Luftlinie etwa 820 km nordöstlich seiner Heimatstadt Gat-Hefer in Galiläa. Stattdessen ging er hinab zum Hafen von Joppe, dem heutigen Jaffa, und nahm ein Schiff nach Tarsis in der Gegenrichtung. Wo Tarsis lag, ist umstritten: Die übliche Ansicht nennt Tartessos im Südwesten Spaniens, wo die Karte seinen Punkt bei Huelva setzt, etwa 3825 km westlich von Joppe; auch Sardinien, Karthago und Tarsus in Kilikien wurden vorgeschlagen. Die Karte kennzeichnet es als umstritten, und die Jona-Tour lässt es aus, da er nie ankam."
    - "Das Zweite Buch der Könige nennt „Jona, den Sohn Amitthais, den Propheten, der von Gath-Hepher war“, in der Regierungszeit Jerobeams II. von Israel (etwa 793–753 v. Chr.); die Tour der Karte ist auf 780 v. Chr. gesetzt. Das Buch Jona beginnt mit dem Befehl „Mache dich auf und gehe in die große Stadt Ninive und predige wider sie!“ und der Flucht: „Aber Jona machte sich auf und floh vor dem HERRN und wollte gen Tharsis und kam hinab gen Japho. Und da er ein Schiff fand, das gen Tharsis wollte fahren“. Nach dem Sturm und dem Fisch ging er nach Ninive, „eine große Stadt vor Gott, drei Tagereisen groß“, und ihre Bewohner taten Buße; Jesus hielt die Niniviten als Beispiel vor: „Die Leute von Ninive werden auftreten am Jüngsten Gericht mit diesem Geschlecht und werden es verdammen“."
    - "Gat-Hefer wird bei Tel Gat Hefer angesetzt, etwa 5 km von Nazareth. Joppe war der Haupthafen der mittleren Küste, der Hafen, in den die Zedern des Libanon für Salomos Tempel geflößt wurden; Hieronymus nennt es in seiner Schilderung der Pilgerfahrt der Paula in den 380er-Jahren als den Hafen von Jonas Flucht. Ninive wurde unter Sanherib um 700 v. Chr. Hauptstadt Assyriens, mit einer etwa 12 km langen Mauer, und fiel 612 v. Chr. an die Babylonier und Meder; die spätere Überlieferung verlegte das Grab Jonas auf den Hügel Nebi Yunus dort. Tarsis ist bei den Propheten ein fernes Land des Silbers, Eisens, Zinns und Bleis, das man über das Meer erreicht; wer es in Spanien sucht, verweist auf die metallreiche Küste, die griechische Autoren als Tartessos kannten, doch der Name steht auch für ferne Seefahrt überhaupt, wie in den Tarsisschiffen."
  fr:
    - "Jonas fut envoyé à Ninive, la grande ville d’Assyrie sur le Tigre, en face de l’actuelle Mossoul, en Irak, à environ 820 km au nord-est de sa ville natale, Gath-Hépher, en Galilée, à vol d’oiseau. Il descendit au contraire au port de Joppé, l’actuelle Jaffa, et prit un navire pour Tarsis, dans la direction opposée. L’emplacement de Tarsis est discuté : l’opinion courante y voit Tartessos, dans le sud-ouest de l’Espagne, où la carte place son point près de Huelva, à environ 3 825 km à l’ouest de Joppé ; la Sardaigne, Carthage et Tarse en Cilicie ont aussi été proposées. La carte la marque comme discutée, et le parcours de Jonas l’omet, puisqu’il n’y arriva jamais."
    - "Le deuxième livre des Rois nomme « Jonas, le prophète, fils d’Amitthaï, de Gath-Hépher », sous le règne de Jéroboam II d’Israël (vers 793-753 av. J.-C.) ; le parcours de la carte est placé en 780 av. J.-C. Le livre de Jonas s’ouvre sur l’ordre « Lève-toi, va à Ninive, la grande ville, et crie contre elle ! » et sur la fuite : « Et Jonas se leva pour s’enfuir à Tarsis, loin de la face de l’Éternel. Il descendit à Japho, et il trouva un navire qui allait à Tarsis ». Après la tempête et le poisson, il alla à Ninive, « une très grande ville, de trois jours de marche », et ses habitants se repentirent ; Jésus a proposé les Ninivites en exemple : « Les hommes de Ninive se lèveront, au jour du jugement, avec cette génération et la condamneront »."
    - "Gath-Hépher est placée à Tel Gat Hefer, à environ 5 km de Nazareth. Joppé était le principal port de la côte centrale, où l’on faisait flotter le cèdre du Liban pour le Temple de Salomon ; Jérôme, décrivant le pèlerinage de Paule dans les années 380, en fait le port de la fuite de Jonas. Ninive devint la capitale de l’Assyrie sous Sanchérib, vers 700 av. J.-C., avec un rempart d’environ 12 km, et tomba devant les Babyloniens et les Mèdes en 612 av. J.-C. ; une tradition plus tardive plaça le tombeau de Jonas sur sa butte de Nebi Younès. Dans les prophètes, Tarsis est un pays lointain d’argent, de fer, d’étain et de plomb, atteint par la mer ; ceux qui la placent en Espagne invoquent la côte riche en métaux que les auteurs grecs connaissaient sous le nom de Tartessos, mais le nom désigne aussi, en général, la navigation lointaine, comme dans les navires de Tarsis."
