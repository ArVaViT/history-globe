id: where-was-paul-converted
question:
  en: "Where was Paul converted on the road to Damascus?"
  ru: "Где обратился Павел на пути в Дамаск?"
  uk: "Де відбулося навернення Павла на шляху до Дамаска?"
  es: "¿Dónde se convirtió Pablo, en el camino de Damasco?"
  pt: "Onde Paulo se converteu, no caminho de Damasco?"
  de: "Wo bekehrte sich Paulus auf dem Weg nach Damaskus?"
  fr: "Où Paul fut-il converti, sur le chemin de Damas ?"
  pl: "Gdzie nawrócił się Paweł w drodze do Damaszku?"
  it: "Dove fu convertito Paolo sulla via di Damasco?"
  cs: "Kde došlo k Pavlovu obrácení na cestě do Damašku?"
  nl: "Waar werd Paulus bekeerd, op de weg naar Damascus?"
  sv: "Var blev Paulus omvänd på vägen till Damaskus?"
  nb: "Hvor ble Paulus omvendt på veien til Damaskus?"
  tl: "Saan nagbalik-loob si Pablo sa daan patungong Damasco?"
  da: "Hvor blev Paulus omvendt på vejen til Damaskus?"
answer:
  en:
    - "Acts says only that it happened as Saul “came near Damascus”, at midday; no spot is named. Damascus lies about 217 km north-north-east of Jerusalem in a straight line and about 251 km by the Roman road on the map, eight days' walk, so the vision came at the end of the journey. Since at least the Crusader period Christians have pointed to Kaukab, a hill about 18 km south-west of the city on the old road from Galilee, where a Greek Orthodox monastery stands today. In Damascus itself the street called Straight, the Roman decumanus, still runs east to west across the Old City, with a chapel of Ananias at its eastern end and the chapel of St Paul at Bab Kisan, where the basket is remembered. The map's year is about AD 34; scholars put the event between 31 and 36."
    - "Luke tells it three times. “And as he journeyed, he came near Damascus: and suddenly there shined round about him a light from heaven”; Paul himself says it was “about noon”, a light “above the brightness of the sun”. Blinded, “they led him by the hand, and brought him into Damascus”, and the Lord sent Ananias “into the street which is called Straight, and enquire in the house of Judas for one called Saul, of Tarsus”. Within days Saul “preached Christ in the synagogues, that he is the Son of God”. In Galatians he adds that he “went into Arabia, and returned again unto Damascus”, and in 2 Corinthians that “the governor under Aretas the king kept the city of the Damascenes with a garrison, desirous to apprehend me: And through a window in a basket was I let down by the wall, and escaped his hands.”"
    - "Arabia is the Nabataean kingdom south and east of Damascus, whose king Aretas IV reigned from 9 BC to AD 40; his officer at Damascus is the firmest clue to the dates, since the escape must fall before 40 and, by Galatians, three years after the conversion. Whether Aretas actually ruled Damascus in those years or only kept an agent among its Nabataeans is debated, as no Roman coins of Damascus are known from 34 to 62. The road Saul took is not stated; the map draws the Roman road north through Samaria and Galilee and past the foot of Hermon, the natural way for a traveller from Jerusalem. Nothing of the house of Judas is known, and the chapel of Ananias lies below today's street, at what is taken to be the Roman ground level."
  ru:
    - "Деяния говорят лишь, что это случилось, когда Савл «приближался к Дамаску», в полдень; место не названо. Дамаск лежит примерно в 217 км к северо-северо-востоку от Иерусалима по прямой и в 251 км по римской дороге на карте — восемь дней пути, так что видение пришло в конце дороги. По меньшей мере со времён крестоносцев христиане указывают на Каукаб, холм примерно в 18 км к юго-западу от города на старой дороге из Галилеи, где сегодня стоит греческий православный монастырь. В самом Дамаске улица Прямая, римский декуманус, по-прежнему пересекает Старый город с востока на запад; у её восточного конца — часовня Анании, а у ворот Баб-Кисан — часовня апостола Павла, где вспоминают корзину. Год на карте — около 34 г. н. э.; учёные относят событие к 31–36 годам."
    - "Лука рассказывает это трижды. «Когда же он шел и приближался к Дамаску, внезапно осиял его свет с неба»; сам Павел говорит, что было «около полудня», и свет был «превосходящий солнечное сияние». Ослепшего, «повели его за руки, и привели в Дамаск», а Господь послал Ананию: «пойди на улицу, так называемую Прямую, и спроси в Иудином доме Тарсянина, по имени Савла». Через несколько дней Савл «стал проповедывать в синагогах об Иисусе, что Он есть Сын Божий». В Послании к Галатам он добавляет, что «пошел в Аравию и опять возвратился в Дамаск», а во Втором послании к Коринфянам — что «областной правитель царя Ареты стерег город Дамаск, чтобы схватить меня; и я в корзине был спущен из окна по стене и избежал его рук»."
    - "Аравия — это Набатейское царство к югу и востоку от Дамаска, чей царь Арета IV правил с 9 г. до н. э. по 40 г. н. э.; его наместник в Дамаске — самая твёрдая опора для дат, ведь бегство должно было случиться до 40 года, а по Галатам — через три года после обращения. Правил ли Арета Дамаском в те годы на деле или лишь держал своего человека среди тамошних набатеев, спорно: римских монет Дамаска с 34 по 62 год не известно. Какой дорогой шёл Савл, не сказано; карта ведёт римскую дорогу на север через Самарию и Галилею и мимо подножия Ермона — естественный путь для идущего из Иерусалима. О доме Иуды ничего не известно, а часовня Анании лежит ниже нынешней улицы, на уровне, который считают римским."
  uk:
    - "Дії кажуть лише, що це сталося, коли Саул, ідучи, був «близько Дамаску», опівдні; жодного місця не названо. Дамаск лежить приблизно за 217 км на північ-північний схід від Єрусалима по прямій і приблизно за 251 км римською дорогою на мапі, вісім днів ходу, тож видіння сталося наприкінці подорожі. Щонайменше від часів хрестоносців християни вказують на Каукаб, пагорб приблизно за 18 км на південний захід від міста на старій дорозі з Галілеї, де нині стоїть грецький православний монастир. У самому Дамаску вулиця, названа Прямою, римський decumanus, і досі йде зі сходу на захід через Старе місто, з каплицею Ананії на її східному кінці та каплицею святого Павла біля Баб-Кісан, де пам'ятають про кошик. Рік на мапі — близько 34 р. н. е.; учені відносять подію до проміжку між 31 і 36 р."
    - "Лука розповідає про це тричі. «Ідучи ж був близько Дамаску, аж ось осияло його сьвітло з неба»; сам Павло каже, що було «о полуднї», «сьвітло над сяєво сонця». Осліплого «вели його за руку, та й привели в Дамаск», і Господь послав Ананію: «йди на улицю, що зветь ся Простою, та й пошукай у Юдиній хатї Тарсянина, на ймя Савла». За кілька днів Саул «проповідував по школах Христа, що се Син Божий». У Посланні до галатів він додає, що «пійшов у Аравию, та й знов вернувсь у Дамаск», а в Другому посланні до коринтян: «царський намістник Арета, стеріг город Дамащан, хотївши піймати мене; і віконцем у коші спущено мене по стїнї, і втік я з рук його»."
    - "Аравія — це Набатейське царство на південь і схід від Дамаска, цар якого Арета IV правив із 9 р. до н. е. до 40 р. н. е.; його урядовець у Дамаску — найпевніша підказка щодо дат, бо втеча має припасти до 40 р. і, за Посланням до галатів, на три роки після навернення. Чи справді Арета правив Дамаском у ті роки, чи лише тримав агента серед його набатеїв, — обговорюють, бо римських монет Дамаска за 34–62 рр. невідомо. Дорогу, якою йшов Саул, не вказано; мапа веде римську дорогу на північ через Самарію й Галілею повз підніжжя Хермона — природний шлях для мандрівника з Єрусалима. Про дім Юди нічого не відомо, а каплиця Ананії лежить нижче сучасної вулиці, на тому, що вважають римським рівнем землі."
  es:
    - "Los Hechos dicen solo que sucedió cuando Saulo iba «llegando cerca de Damasco», a mediodía; no se nombra ningún lugar. Damasco queda a unos 217 km al nornoreste de Jerusalén en línea recta y a unos 251 km por la calzada romana del mapa, ocho días a pie, de modo que la visión llegó al final del viaje. Desde al menos la época de los cruzados, los cristianos señalan Kaukab, una colina a unos 18 km al suroeste de la ciudad, en el antiguo camino de Galilea, donde hoy se alza un monasterio griego ortodoxo. En la propia Damasco, la calle llamada Derecha, el decumano romano, sigue cruzando de este a oeste la Ciudad Vieja, con una capilla de Ananías en su extremo oriental y la capilla de san Pablo en Bab Kisan, donde se recuerda el serón. El año del mapa es hacia el 34 d. C.; los estudiosos sitúan el hecho entre el 31 y el 36."
    - "Lucas lo cuenta tres veces. «Y yendo por el camino, aconteció que llegando cerca de Damasco, súbitamente le cercó un resplandor de luz del cielo»; el propio Pablo dice que fue «como á medio día», una luz «que sobrepujaba el resplandor del sol». Ciego, «llevándole por la mano, metiéronle en Damasco», y el Señor envió a Ananías «á la calle que se llama la Derecha, y busca en casa de Judas á uno llamado Saulo, de Tarso». A los pocos días Saulo «predicaba á Cristo, diciendo que éste era el Hijo de Dios» en las sinagogas. En Gálatas añade que «me fuí á la Arabia, y volví de nuevo á Damasco», y en 2 Corintios que «el gobernador de la provincia del rey Aretas guardaba la ciudad de los Damascenos para prenderme; Y fuí descolgado del muro en un serón por una ventana, y escapé de sus manos»."
    - "Arabia es el reino nabateo al sur y al este de Damasco, cuyo rey Aretas IV reinó del 9 a. C. al 40 d. C.; su oficial en Damasco es el indicio más firme para las fechas, pues la huida debe caer antes del 40 y, según Gálatas, tres años después de la conversión. Si Aretas gobernó realmente Damasco en aquellos años o solo tuvo un agente entre sus nabateos, se discute, pues no se conocen monedas romanas de Damasco del 34 al 62. El camino que tomó Saulo no se indica; el mapa traza la calzada romana hacia el norte por Samaria y Galilea y junto al pie del Hermón, el camino natural para un viajero que salía de Jerusalén. No se sabe nada de la casa de Judas, y la capilla de Ananías queda por debajo de la calle actual, en lo que se tiene por el nivel del suelo romano."
  pt:
    - "Atos diz apenas que aconteceu quando Saulo “se aproximava de Damasco”, ao meio-dia; nenhum lugar é nomeado. Damasco fica a cerca de 217 km a nor-nordeste de Jerusalém em linha reta e a cerca de 251 km pela estrada romana do mapa, oito dias de caminhada, de modo que a visão veio no fim da viagem. Desde pelo menos o período das Cruzadas, os cristãos apontam Kaukab, uma colina a cerca de 18 km a sudoeste da cidade, na antiga estrada da Galileia, onde hoje se ergue um mosteiro ortodoxo grego. Na própria Damasco, a rua chamada Direita, o decumano romano, ainda corre de leste a oeste através da Cidade Velha, com uma capela de Ananias em sua extremidade oriental e a capela de São Paulo em Bab Kisan, onde se recorda o cesto. O ano do mapa é cerca de 34 d.C.; os estudiosos situam o acontecimento entre 31 e 36."
    - "Lucas o conta três vezes. “Em sua viagem, quando se aproximava de Damasco, de repente uma luz do céu brilhou ao seu redor”; o próprio Paulo diz que foi “por volta do meio-dia”, uma luz “mais brilhante que o sol”. Cego, “o conduziram pela mão até Damasco”, e o Senhor enviou Ananias: “Levante-se e vá à rua chamada Direita, e pergunte na casa de Judá por um homem chamado Saulo, de Tarso.” Em poucos dias, Saulo, nas sinagogas, “proclamava o Cristo, que ele é o Filho de Deus”. Em Gálatas acrescenta que “parti para a Arábia. Depois, retornei a Damasco”, e em 2 Coríntios que “Em Damasco, o governador sob o rei Aretas guardava a cidade de Damasco, desejando me prender. Fui descido em um cesto por uma janela da muralha e escapei das suas mãos.”"
    - "A Arábia é o reino nabateu ao sul e a leste de Damasco, cujo rei Aretas IV reinou de 9 a.C. a 40 d.C.; seu oficial em Damasco é o indício mais firme para as datas, já que a fuga deve ocorrer antes de 40 e, segundo Gálatas, três anos depois da conversão. Se Aretas realmente governava Damasco naqueles anos ou apenas mantinha um agente entre os nabateus da cidade é debatido, pois não se conhecem moedas romanas de Damasco de 34 a 62. A estrada que Saulo tomou não é indicada; o mapa traça a estrada romana para o norte, por Samaria e pela Galileia e pelo sopé do Hermom, o caminho natural para quem vinha de Jerusalém. Nada se sabe da casa de Judas, e a capela de Ananias fica abaixo da rua atual, no que se toma por nível do solo romano."
  de:
    - "Die Apostelgeschichte sagt nur, es geschah, als Saulus „nahe an Damaskus kam“, um die Mittagszeit; ein Ort wird nicht genannt. Damaskus liegt in der Luftlinie etwa 217 km nordnordöstlich von Jerusalem und etwa 251 km auf der Römerstraße der Karte, acht Tagesmärsche, die Vision kam also am Ende der Reise. Seit mindestens der Kreuzfahrerzeit zeigen Christen auf Kaukab, einen Hügel etwa 18 km südwestlich der Stadt an der alten Straße aus Galiläa, wo heute ein griechisch-orthodoxes Kloster steht. In Damaskus selbst verläuft die Gerade Straße, der römische Decumanus, noch immer von Ost nach West durch die Altstadt, mit einer Hananiaskapelle an ihrem östlichen Ende und der Paulskapelle am Bab Kisan, wo man sich an den Korb erinnert. Das Jahr der Karte ist etwa 34 n. Chr.; Forscher setzen das Ereignis zwischen 31 und 36 an."
    - "Lukas erzählt es dreimal. „Und da er auf dem Wege war und nahe an Damaskus kam, umleuchtete ihn plötzlich ein Licht vom Himmel“; Paulus selbst sagt, es sei „um den Mittag“ gewesen, ein Licht, „heller denn der Sonne Glanz“. Von dem Erblindeten heißt es: „Sie nahmen ihn bei der Hand und führten ihn gen Damaskus“; und der Herr sandte Hananias „in die Gasse, die da heißt ‚die gerade‘, und frage im Hause des Judas nach einem namens Saul von Tarsus“. Binnen Tagen „predigte er Christus in den Schulen, daß derselbe Gottes Sohn sei“. Im Galaterbrief fügt er hinzu, er „zog hin nach Arabien und kam wiederum gen Damaskus“, und im Zweiten Korintherbrief: „Zu Damaskus verwahrte der Landpfleger des Königs Aretas die Stadt der Damasker und wollte mich greifen, und ich ward in einem Korbe zum Fenster hinaus durch die Mauer niedergelassen und entrann aus seinen Händen.“"
    - "Arabien ist das nabatäische Königreich südlich und östlich von Damaskus, dessen König Aretas IV. von 9 v. Chr. bis 40 n. Chr. regierte; sein Beamter in Damaskus ist der festeste Hinweis auf die Daten, da die Flucht vor 40 fallen muss und nach dem Galaterbrief drei Jahre nach der Bekehrung. Ob Aretas in jenen Jahren tatsächlich über Damaskus herrschte oder nur einen Vertreter unter dessen Nabatäern hielt, ist umstritten, da von 34 bis 62 keine römischen Münzen von Damaskus bekannt sind. Den Weg, den Saulus nahm, nennt der Text nicht; die Karte zeichnet die Römerstraße nach Norden durch Samaria und Galiläa und am Fuß des Hermon vorbei, den natürlichen Weg eines Reisenden aus Jerusalem. Vom Haus des Judas ist nichts bekannt, und die Hananiaskapelle liegt unter der heutigen Straße, auf dem, was für das römische Bodenniveau gehalten wird."
  fr:
    - "Les Actes disent seulement que cela arriva alors que Saul « approchait de Damas », à midi ; aucun lieu n’est nommé. Damas se trouve à environ 217 km au nord-nord-est de Jérusalem à vol d’oiseau et à environ 251 km par la voie romaine de la carte, huit jours de marche : la vision survint donc au terme du voyage. Depuis l’époque des croisés au moins, les chrétiens désignent Kaukab, une colline à environ 18 km au sud-ouest de la ville, sur l’ancienne route de Galilée, où se dresse aujourd’hui un monastère orthodoxe grec. À Damas même, la rue appelée la Droite, l’ancien decumanus romain, traverse encore la vieille ville d’est en ouest, avec une chapelle d’Ananias à son extrémité orientale et la chapelle de Saint-Paul à Bab Kisan, où l’on garde le souvenir de la corbeille. L’année de la carte est vers 34 apr. J.-C. ; les spécialistes situent l’événement entre 31 et 36."
    - "Luc le raconte trois fois. « Comme il était en chemin, et qu’il approchait de Damas, tout à coup une lumière venant du ciel resplendit autour de lui » ; Paul lui-même dit que c’était « vers midi », une lumière « dont l’éclat surpassait celui du soleil ». Devenu aveugle, « on le prit par la main, et on le conduisit à Damas », et le Seigneur envoya Ananias : « va dans la rue qu’on appelle la droite, et cherche, dans la maison de Judas, un nommé Saul de Tarse ». Bientôt, Saul « prêcha dans les synagogues que Jésus est le Fils de Dieu ». Aux Galates, il ajoute : « je partis pour l’Arabie. Puis je revins encore à Damas », et dans 2 Corinthiens : « À Damas, le gouverneur du roi Arétas faisait garder la ville des Damascéniens, pour se saisir de moi ; mais on me descendit par une fenêtre, dans une corbeille, le long de la muraille, et j’échappai de leurs mains. »"
    - "L’Arabie est le royaume nabatéen au sud et à l’est de Damas, dont le roi Arétas IV régna de 9 av. J.-C. à 40 apr. J.-C. ; son officier à Damas est l’indice le plus solide pour les dates, puisque l’évasion doit se placer avant 40 et, d’après l’épître aux Galates, trois ans après la conversion. Qu’Arétas ait réellement gouverné Damas ces années-là ou seulement entretenu un agent parmi ses Nabatéens est débattu, car on ne connaît aucune monnaie romaine de Damas entre 34 et 62. La route suivie par Saul n’est pas indiquée ; la carte trace la voie romaine qui monte vers le nord par la Samarie et la Galilée et passe au pied de l’Hermon, chemin naturel pour un voyageur venant de Jérusalem. On ne sait rien de la maison de Judas, et la chapelle d’Ananias se trouve en dessous de la rue actuelle, à ce que l’on tient pour le niveau du sol romain."
  pl:
    - "Dzieje mówią tylko, że stało się to w południe, gdy Saul, jak czytamy, „się przybliżał do Damaszku”; żadne miejsce nie jest wskazane. Damaszek leży około 217 km na północ-północny wschód od Jerozolimy w linii prostej i około 251 km rzymską drogą z mapy, osiem dni marszu, więc wizja nadeszła pod koniec podróży. Co najmniej od czasów krzyżowców chrześcijanie wskazują Kaukab, wzgórze około 18 km na południowy zachód od miasta przy dawnej drodze z Galilei, gdzie dziś stoi grecko-prawosławny klasztor. W samym Damaszku ulica zwana Prostą, rzymski decumanus, wciąż biegnie ze wschodu na zachód przez Stare Miasto, z kaplicą Ananiasza na wschodnim końcu i kaplicą św. Pawła przy Bab Kisan, gdzie pamięta się kosz. Rok na mapie to około 34 n.e.; uczeni datują wydarzenie między 31 a 36."
    - "Łukasz opowiada to trzy razy. „A gdy jechał, stało się, gdy się przybliżał do Damaszku, że z prędka oświeciła go światłość z nieba”; sam Paweł mówi, że było to „o południu”, a światłość „jaśniejszą nad jasność słoneczną”. Oślepionego „ująwszy go za rękę; prowadzili go do Damaszku”, a Pan posłał Ananiasza „na ulicę, którą zowią prostą, a szukaj w domu Judowym Saula imieniem Tarseńczyka”. W ciągu kilku dni Saul „kazał w bóżnicach Chrystusa, że on jest Synem Bożym”. W Liście do Galatów dodaje: „alem szedł do Arabii i wróciłem się zasię do Damaszku”, a w 2 Liście do Koryntian: „W Damaszku hetman ludu króla Arety osadził był strażą miasto Damaszek, chcąc mię pojmać; alem oknem po powrozie w koszyku przez mur był spuszczony i uszedłem rąk jego”."
    - "Arabia to królestwo Nabatejczyków na południe i wschód od Damaszku, którego król Aretas IV panował od 9 p.n.e. do 40 n.e.; jego urzędnik w Damaszku jest najpewniejszą wskazówką co do dat, ponieważ ucieczka musi przypadać przed 40 i, według Listu do Galatów, trzy lata po nawróceniu. Czy Aretas rzeczywiście władał Damaszkiem w tych latach, czy tylko trzymał agenta wśród jego Nabatejczyków, jest przedmiotem sporu, bo nie znamy rzymskich monet Damaszku z lat 34–62. Drogi, którą szedł Saul, tekst nie podaje; mapa rysuje rzymską drogę na północ przez Samarię i Galileę i obok podnóża Hermonu, naturalną trasę podróżnika z Jerozolimy. Nic nie wiadomo o domu Judy, a kaplica Ananiasza leży poniżej dzisiejszej ulicy, na poziomie uznawanym za rzymski."
  it:
    - "Gli Atti dicono soltanto che accadde quando Saul, «avvicinandosi a Damasco», era in cammino, a mezzogiorno; nessun luogo è nominato. Damasco dista circa 217 km a nord-nord-est di Gerusalemme in linea d’aria e circa 251 km lungo la strada romana della mappa, otto giorni di cammino, così che la visione venne alla fine del viaggio. Almeno dal periodo crociato i cristiani indicano Kaukab, una collina a circa 18 km a sud-ovest della città sulla vecchia strada dalla Galilea, dove oggi sorge un monastero greco-ortodosso. A Damasco stessa la via detta Diritta, il decumano romano, attraversa ancora da est a ovest la Città Vecchia, con una cappella di Anania alla sua estremità orientale e la cappella di San Paolo a Bab Kisan, dove si ricorda la cesta. L’anno della mappa è il 34 d.C. circa; gli studiosi collocano l’evento tra il 31 e il 36."
    - "Luca la racconta tre volte. «E mentre era in cammino, avvenne che, avvicinandosi a Damasco, di subito una luce dal cielo gli sfolgorò d’intorno»; Paolo stesso dice che era «sul mezzogiorno», una luce «più risplendente del sole». Accecato, «menandolo per la mano, lo condussero a Damasco», e il Signore mandò Anania «nella strada detta Diritta, e cerca, in casa di Giuda, un uomo chiamato Saulo, da Tarso». Nel giro di pochi giorni Saul «si mise a predicar nelle sinagoghe che Gesù è il Figliuol di Dio». Nella lettera ai Galati aggiunge che «subito me ne andai in Arabia; quindi tornai di nuovo a Damasco», e nella seconda ai Corinzi che «il governatore del re Areta avea posto delle guardie alla città dei Damasceni per pigliarmi; e da una finestra fui calato, in una cesta, lungo il muro, e scampai dalle sue mani»."
    - "L’Arabia è il regno nabateo a sud e a est di Damasco, il cui re Areta IV regnò dal 9 a.C. al 40 d.C.; il suo ufficiale a Damasco è l’indizio più solido per le date, poiché la fuga deve cadere prima del 40 e, secondo Galati, tre anni dopo la conversione. Se Areta governasse davvero Damasco in quegli anni o vi mantenesse soltanto un agente tra i suoi Nabatei è discusso, poiché non si conoscono monete romane di Damasco dal 34 al 62. La strada percorsa da Saul non è indicata; la mappa traccia la strada romana a nord attraverso la Samaria e la Galilea e oltre le pendici dell’Ermon, la via naturale per un viaggiatore da Gerusalemme. Nulla si sa della casa di Giuda, e la cappella di Anania si trova sotto la strada odierna, a quello che si ritiene il livello del suolo romano."
  cs:
    - "Skutky říkají jen, že se to stalo, když Saul „přibližoval se k Damašku“, okolo poledne; žádné místo není jmenováno. Damašek leží vzdušnou čarou asi 217 km severoseverovýchodně od Jeruzaléma a asi 251 km po římské silnici na mapě, osm dní chůze, takže vidění přišlo na konci cesty. Nejméně od doby křižáků křesťané ukazují na Kaukab, pahorek asi 18 km jihozápadně od města na staré cestě z Galileje, kde dnes stojí řecký pravoslavný klášter. V samotném Damašku stále vede ulice zvaná Přímá, římský dekumanus, ze západu na východ přes Staré město, s Ananiášovou kaplí na východním konci a kaplí sv. Pavla u Báb Kísán, kde se připomíná koš. Rok na mapě je asi 34 n. l.; badatelé kladou událost mezi roky 31 a 36."
    - "Lukáš to vypráví třikrát. „A když byl na cestě, stalo se, že již přibližoval se k Damašku. Tedy pojednou rychle obklíčilo jej světlo s nebe“; Pavel sám říká, že to bylo „okolo poledne“, světlo „jasnější nad blesk slunečný“. Oslepeného „pojavše ho za ruce, uvedli jej do Damašku“ a Pán poslal Ananiáše: „Vstaň a jdi do ulice, kteráž slove Přímá, a hledej v domě Judově Saule, jménem Tarsenského.“ Za několik dní Saul „hned v školách kázal Krista, pravě, že on jest Syn Boží“. V listu Galatským dodává, že „šel jsem do Arabie, přišel jsem pak zase do Damašku“, a ve 2. listu Korintským: „Hejtman v Damašku lidu Aréty krále, ostříhal města Damašku, chtěje mne do vězení vzíti. Ale já oknem po provaze spuštěn jsem v koši přes zed, i ušel jsem rukou jeho.“"
    - "Arábie je nabatejské království jižně a východně od Damašku, jehož král Aretas IV. vládl od roku 9 př. n. l. do roku 40 n. l.; jeho úředník v Damašku je nejpevnějším vodítkem k datům, neboť útěk musí spadat před rok 40 a podle listu Galatským tři roky po obrácení. Zda Aretas v těch letech Damašek skutečně ovládal, nebo jen držel zástupce mezi tamními Nabatejci, je sporné, protože z let 34 až 62 nejsou známy žádné římské mince Damašku. Cesta, kterou Saul šel, není uvedena; mapa kreslí římskou silnici na sever přes Samaří a Galileu a kolem úpatí Hermonu, přirozenou cestou pro cestujícího z Jeruzaléma. O Judově domě není nic známo a Ananiášova kaple leží pod dnešní ulicí, na úrovni, která se pokládá za římskou."
  nl:
    - "Handelingen zegt alleen dat het gebeurde toen Saulus “nabij Damaskus kwam”, op het middaguur; er wordt geen plek genoemd. Damascus ligt hemelsbreed ongeveer 217 km ten noordnoordoosten van Jeruzalem en ongeveer 251 km via de Romeinse weg op de kaart, acht dagen lopen, zodat het visioen aan het einde van de reis kwam. Sinds ten minste de kruisvaardersperiode wijzen christenen naar Kaukab, een heuvel ongeveer 18 km ten zuidwesten van de stad aan de oude weg uit Galilea, waar tegenwoordig een Grieks-orthodox klooster staat. In Damascus zelf loopt de straat die de Rechte heet, de Romeinse decumanus, nog steeds van oost naar west door de Oude Stad, met een kapel van Ananias aan het oostelijke einde en de kapel van de heilige Paulus bij Bab Kisan, waar de mand wordt herdacht. Het jaar op de kaart is ongeveer 34 n.Chr.; geleerden plaatsen de gebeurtenis tussen 31 en 36."
    - "Lukas vertelt het driemaal. “En als hij reisde, is het geschied, dat hij nabij Damaskus kwam, en hem omscheen snellijk een licht van den hemel”; Paulus zelf zegt dat het “omtrent den middag” was, een licht “boven den glans der zon”. Verblind: “En zij, hem bij de hand leidende, brachten hem te Damaskus”, en de Heer zond Ananias “in de straat, genaamd de Rechte, en vraag in het huis van Judas naar een, met name Saulus, van Tarsen”. Binnen enkele dagen gold van Saulus: “En hij predikte terstond Christus in de synagogen, dat Hij de Zoon van God is”. In Galaten voegt hij toe: “ik ging henen naar Arabië, en keerde wederom naar Damaskus”, en in 2 Korintiërs: “De stadhouder van den koning Aretas in Damaskus, bezette de stad der Damaskenen, willende mij vangen; En ik werd door een venster in een mand over den muur nedergelaten, en ontvlood zijn handen.”"
    - "Arabië is het Nabateese koninkrijk ten zuiden en oosten van Damascus, waarvan koning Aretas IV regeerde van 9 v.Chr. tot 40 n.Chr.; zijn ambtenaar in Damascus is de vaste aanwijzing voor de data, aangezien de ontsnapping vóór 40 moet vallen en, volgens Galaten, drie jaar na de bekering. Of Aretas in die jaren werkelijk over Damascus heerste of alleen een vertegenwoordiger onder de Nabateeërs aldaar had, wordt betwist, omdat er geen Romeinse munten van Damascus bekend zijn uit 34 tot 62. De weg die Saulus nam wordt niet vermeld; de kaart tekent de Romeinse weg naar het noorden door Samaria en Galilea en langs de voet van de Hermon, de natuurlijke route voor een reiziger uit Jeruzalem. Van het huis van Judas is niets bekend, en de kapel van Ananias ligt onder de huidige straat, op wat voor het Romeinse grondniveau wordt gehouden."
  sv:
    - "Apostlagärningarna säger bara att det hände när Saul ”nalkades Damaskus”, vid middagstid; ingen plats nämns. Damaskus ligger omkring 217 km nord-nordost om Jerusalem i fågelvägen och omkring 251 km längs den romerska vägen på kartan, åtta dagars vandring, så synen kom i slutet av resan. Åtminstone sedan korstågstiden har kristna pekat på Kaukab, en kulle omkring 18 km sydväst om staden vid den gamla vägen från Galileen, där ett grekisk-ortodoxt kloster står i dag. I själva Damaskus löper gatan som kallas Raka gatan, den romerska decumanus, fortfarande från öster till väster genom gamla staden, med ett kapell för Ananias i dess östra ände och Sankt Pauluskapellet vid Bab Kisan, där korgen minns. Kartans år är omkring 34 e.Kr.; forskare förlägger händelsen mellan 31 och 36."
    - "Lukas berättar det tre gånger. ”Men när han på sin färd nalkades Damaskus, hände sig att ett sken från himmelen plötsligt kringstrålade honom”; Paulus själv säger att det var ”vid middagstiden”, ett sken ”klarare än solens glans”. Förblindad blev han ledd: ”De togo honom därför vid handen och ledde honom in i Damaskus”, och Herren sade till Ananias: ”Stå upp och gå till den gata som kallas Raka gatan och fråga i Judas’ hus efter en man vid namn Saulus, från Tarsus.” Inom några dagar ”begynte han i synagogorna predika om Jesus, att han var Guds Son”. I Galaterbrevet tillägger han att han ”for bort till Arabien och vände så åter tillbaka till Damaskus”, och i 2 Korinthierbrevet att ”i Damaskus lät konung Aretas’ ståthållare sätta ut vakt vid damaskenernas stad för att gripa mig; och jag måste i en korg släppas ned genom en öppning på muren och kom så undan hans händer.”"
    - "Arabien är det nabateiska riket söder och öster om Damaskus, vars kung Aretas IV regerade från 9 f.Kr. till 40 e.Kr.; hans ståthållare i Damaskus är den säkraste ledtråden till dateringen, eftersom flykten måste ligga före år 40 och, enligt Galaterbrevet, tre år efter omvändelsen. Huruvida Aretas faktiskt härskade över Damaskus under dessa år eller bara hade ett ombud bland dess nabateer är omdiskuterat, eftersom inga romerska mynt från Damaskus är kända från 34 till 62. Vägen Saul tog anges inte; kartan ritar den romerska vägen norrut genom Samarien och Galileen och förbi foten av Hermon, den naturliga vägen för en resenär från Jerusalem. Inget är känt om Judas’ hus, och Ananiaskapellet ligger under dagens gata, på den nivå som anses vara den romerska marknivån."
  nb:
    - "Apostlenes gjerninger sier bare at det skjedde da Saul «kom nær til Damaskus», ved middagstid; ingen plass er nevnt. Damaskus ligger omtrent 217 km nord-nordøst for Jerusalem i luftlinje og omtrent 251 km langs den romerske veien på kartet, åtte dagers gange, så synet kom ved reisens slutt. Minst siden korsfarertiden har kristne pekt på Kaukab, en høyde omtrent 18 km sørvest for byen ved den gamle veien fra Galilea, der et gresk-ortodokst kloster står i dag. I selve Damaskus løper gaten som kalles Den rette, den romerske decumanus, fortsatt øst–vest gjennom gamlebyen, med et Ananias-kapell i den østre enden og Sankt Paulus-kapellet ved Bab Kisan, der kurven minnes. Kartets år er omkring 34 e.Kr.; forskere plasserer hendelsen mellom 31 og 36."
    - "Lukas forteller det tre ganger. «På reisen skjedde det at han kom nær til Damaskus, og med ett strålte et lys fra himmelen om ham»; Paulus selv sier at det var «ved middags-tider», et lys «klarere enn solen». Blindet ble han: «de ledet ham da ved hånden og førte ham inn i Damaskus», og Herren sendte Ananias «bort i den gate som kalles den rette, og spør i Judas’ hus efter en som heter Saulus, fra Tarsus». Innen få dager «forkynte han Jesus i synagogene, at han er Guds Sønn». I Galaterbrevet tilføyer han at han «drog straks bort til Arabia og vendte tilbake til Damaskus», og i 2 Korinterbrev at «I Damaskus holdt kong Aretas’ landshøvding vakt om damaskenernes by for å gripe mig, og gjennem en glugge på muren blev jeg firt ned i en kurv og slapp bort av hans hender.»"
    - "Arabia er det nabateiske riket sør og øst for Damaskus, hvis konge Aretas IV regjerte fra 9 f.Kr. til 40 e.Kr.; hans embetsmann i Damaskus er det sikreste sporet til dateringen, siden flukten må ha skjedd før 40 og, ifølge Galaterbrevet, tre år etter omvendelsen. Om Aretas faktisk styrte Damaskus i disse årene eller bare holdt en agent blant byens nabateere, er omdiskutert, siden ingen romerske mynter fra Damaskus er kjent fra 34 til 62. Veien Saul tok, oppgis ikke; kartet tegner den romerske veien nordover gjennom Samaria og Galilea og forbi foten av Hermon, den naturlige veien for en reisende fra Jerusalem. Ingenting er kjent om Judas’ hus, og Ananias-kapellet ligger under dagens gate, ved det som antas å være det romerske bakkenivået."
  tl:
    - "Sinasabi lamang ng Mga Gawa na nangyari ito nang si Saul ay “malapit sa Damasco”, sa katanghaliang tapat; walang pinangalanang pook. Ang Damasco ay mga 217 km sa hilaga-hilagang-silangan ng Jerusalem sa tuwid na guhit at mga 251 km sa daang Romano ng mapa, walong araw na lakad, kaya dumating ang pangitain sa dulo ng paglalakbay. Mula pa noong panahon ng mga Krusado, itinuturo ng mga Kristiyano ang Kaukab, burol na mga 18 km sa timog-kanluran ng lungsod sa lumang daan mula sa Galilea, na may monasteryong Griyegong Ortodokso ngayon. Sa Damasco, ang lansangang Matuwid, ang decumanus ng Roma, ay tumatakbo pa rin mula silangan hanggang kanluran sa Lumang Lungsod, na may kapilya ni Ananias sa silangang dulo nito at kapilya ni San Pablo sa Bab Kisan, kung saan inaalala ang basket. Ang taon sa mapa ay mga 34 AD; inilalagay ito ng mga iskolar sa pagitan ng 31 at 36."
    - "Tatlong beses itong isinasalaysay ni Lucas. “Siya'y malapit sa Damasco: at pagdaka'y nagliwanag sa palibot niya ang isang ilaw mula sa langit”; ayon mismo kay Pablo, ito ay “nang magtatanghaling tapat”, isang ilaw na “lalong maningning kay sa araw”. Nabulag, “kanilang inakay siya sa kamay at ipinasok siya sa Damasco”, at isinugo ng Panginoon si Ananias “sa lansangang tinatawag na Matuwid, at ipagtanong mo sa bahay ni Judas ang isa na nagngangalang Saulo, lalaking taga Tarso”. Sa loob ng ilang araw ay kaniyang “itinanyag sa mga sinagoga si Jesus, na siya ang Anak ng Dios”. Idinagdag niya sa Galacia na “sa Arabia ako naparoon; at muling nagbalik ako sa Damasco”, at sa 2 Corinto: “binantayan ng gobernador na sakop ng haring Aretas ang bayan ng mga taga Damasco, upang ako'y hulihin… sa isang dungawan, ay napahugos ako sa kuta, sa isang balaong, at ako'y nakatanan sa kanilang mga kamay.”"
    - "Ang Arabia ay ang kahariang Nabateo sa timog at silangan ng Damasco, na ang haring si Aretas IV ay naghari mula 9 BK hanggang 40 AD; ang kaniyang opisyal sa Damasco ang pinakamatibay na bakas sa mga petsa, sapagkat ang pagtakas ay dapat mangyari bago ang 40 at, ayon sa Galacia, tatlong taon pagkatapos ng pagbabalik-loob. Pinagtatalunan kung talagang pinamunuan ni Aretas ang Damasco noon o may ahente lamang siya sa mga Nabateo roon, dahil walang kilalang baryang Romano ng Damasco mula 34 hanggang 62. Hindi sinasabi ang daang tinahak ni Saul; iginuguhit ng mapa ang daang Romano patungong hilaga sa Samaria at Galilea at lampas sa paanan ng Hermon, ang likas na daan para sa manlalakbay mula sa Jerusalem. Walang nalalaman tungkol sa bahay ni Judas, at ang kapilya ni Ananias ay nasa ibaba ng kalye ngayon, sa itinuturing na antas ng lupa ng mga Romano."
  da:
    - "Apostlenes Gerninger siger kun, at det skete, da Saul »nærmede sig til Damaskus«, ved middagstid; intet sted nævnes. Damaskus ligger ca. 217 km nord-nordøst for Jerusalem i fugleflugt og ca. 251 km ad den romerske vej på kortet, otte dagsmarcher, så synet kom ved rejsens ende. Mindst siden korsfarertiden har kristne peget på Kaukab, en høj ca. 18 km sydvest for byen ved den gamle vej fra Galilæa, hvor et græsk-ortodokst kloster ligger i dag. I selve Damaskus løber gaden, der kaldes Den Lige, den romerske decumanus, stadig fra øst til vest gennem den gamle bydel, med et Ananias-kapel i den østlige ende og Sankt Pauls kapel ved Bab Kisan, hvor kurven mindes. Kortets år er ca. 34 e.Kr.; forskere sætter begivenheden mellem 31 og 36."
    - "Lukas fortæller det tre gange. »Men da han var undervejs og nærmede sig til Damaskus, omstraalede et Lys fra Himmelen ham pludseligt«; Paulus selv siger, at det var »ved Middag«, et lys, »som overgik Solens Glans«. Blindet, »de ledte ham ved Haanden og førte ham ind i Damaskus«, og Herren sendte Ananias: »gaa hen i den Gade, som kaldes den lige, og spørg i Judas’s Hus efter en ved Navn Saulus fra Tarsus«. Inden for få dage »prædikede han i Synagogerne om Jesus, at han er Guds Søn«. I Galaterbrevet tilføjer han, at han »drog bort til Arabien og vendte atter tilbage til Damaskus«, og i 2 Korinterbrev: »I Damaskus holdt Kong Aretas’s Statholder Damaskenernes Stad bevogtet for at gribe mig; men jeg blev igennem en Luge firet ned over Muren i en Kurv og undflyede af hans Hænder.«"
    - "Arabien er det nabatæiske kongerige syd og øst for Damaskus, hvis konge Aretas 4. regerede fra 9 f.Kr. til 40 e.Kr.; hans embedsmand i Damaskus er det stærkeste spor til datoerne, da flugten må falde før 40 og ifølge Galaterbrevet tre år efter omvendelsen. Om Aretas faktisk herskede over Damaskus i de år eller blot holdt en agent blandt dens nabatæere, er omdiskuteret, da ingen romerske mønter fra Damaskus kendes fra 34 til 62. Vejen, Saul tog, angives ikke; kortet tegner den romerske vej nordpå gennem Samaria og Galilæa og forbi Hermons fod, den naturlige vej for en rejsende fra Jerusalem. Intet vides om Judas’ hus, og Ananias-kapellet ligger under nutidens gade, ved det, der anses for det romerske jordniveau."
