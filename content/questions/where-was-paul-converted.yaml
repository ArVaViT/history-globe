id: where-was-paul-converted
question:
  en: "Where was Paul converted on the road to Damascus?"
  ru: "Где обратился Павел на пути в Дамаск?"
  uk: "Де відбулося навернення Павла на шляху до Дамаска?"
  es: "¿Dónde se convirtió Pablo, en el camino de Damasco?"
  pt: "Onde Paulo se converteu, no caminho de Damasco?"
  de: "Wo bekehrte sich Paulus auf dem Weg nach Damaskus?"
  fr: "Où Paul fut-il converti, sur le chemin de Damas ?"
answer:
  en:
    - "Acts says only that it happened as Saul “came near Damascus”, at midday; no spot is named. Damascus lies about 217 km north-north-east of Jerusalem in a straight line and about 251 km by the Roman road on the map, eight days' walk, so the vision came at the end of the journey. Since at least the Crusader period Christians have pointed to Kaukab, a hill about 18 km south-west of the city on the old road from Galilee, where a Greek Orthodox monastery stands today. In Damascus itself the street called Straight, the Roman decumanus, still runs east to west across the Old City, with a chapel of Ananias at its eastern end and the chapel of St Paul at Bab Kisan, where the basket is remembered. The map's year is about AD 34; scholars put the event between 31 and 36."
    - "Luke tells it three times. “And as he journeyed, he came near Damascus: and suddenly there shined round about him a light from heaven”; Paul himself says it was “about noon”, a light “above the brightness of the sun”. Blinded, “they led him by the hand, and brought him into Damascus”, and the Lord sent Ananias “into the street which is called Straight, and enquire in the house of Judas for one called Saul, of Tarsus”. Within days Saul “preached Christ in the synagogues, that he is the Son of God”. In Galatians he adds that he “went into Arabia, and returned again unto Damascus”, and in 2 Corinthians that “the governor under Aretas the king kept the city of the Damascenes with a garrison, desirous to apprehend me: And through a window in a basket was I let down by the wall, and escaped his hands.”"
    - "Arabia is the Nabataean kingdom south and east of Damascus, whose king Aretas IV reigned from 9 BC to AD 40; his officer at Damascus is the firmest clue to the dates, since the escape must fall before 40 and, by Galatians, three years after the conversion. Whether Aretas actually ruled Damascus in those years or only kept an agent among its Nabataeans is debated, as no Roman coins of Damascus are known from 34 to 62. The road Saul took is not stated; the map draws the Roman road north through Samaria and Galilee and past the foot of Hermon, the natural way for a traveller from Jerusalem. Nothing of the house of Judas is known, and the chapel of Ananias lies below today's street, at what is taken to be the Roman ground level."
  ru:
    - "Деяния говорят лишь, что это случилось, когда Савл «приближался к Дамаску», в полдень; место не названо. Дамаск лежит примерно в 217 км к северо-северо-востоку от Иерусалима по прямой и в 251 км по римской дороге на карте — восемь дней пути, так что видение пришло в конце дороги. По меньшей мере со времён крестоносцев христиане указывают на Каукаб, холм примерно в 18 км к юго-западу от города на старой дороге из Галилеи, где сегодня стоит греческий православный монастырь. В самом Дамаске улица Прямая, римский декуманус, по-прежнему пересекает Старый город с востока на запад; у её восточного конца — часовня Анании, а у ворот Баб-Кисан — часовня апостола Павла, где вспоминают корзину. Год на карте — около 34 г. н. э.; учёные относят событие к 31–36 годам."
    - "Лука рассказывает это трижды. «Когда же он шел и приближался к Дамаску, внезапно осиял его свет с неба»; сам Павел говорит, что было «около полудня», и свет был «превосходящий солнечное сияние». Ослепшего, «повели его за руки, и привели в Дамаск», а Господь послал Ананию: «пойди на улицу, так называемую Прямую, и спроси в Иудином доме Тарсянина, по имени Савла». Через несколько дней Савл «стал проповедывать в синагогах об Иисусе, что Он есть Сын Божий». В Послании к Галатам он добавляет, что «пошел в Аравию и опять возвратился в Дамаск», а во Втором послании к Коринфянам — что «областной правитель царя Ареты стерег город Дамаск, чтобы схватить меня; и я в корзине был спущен из окна по стене и избежал его рук»."
    - "Аравия — это Набатейское царство к югу и востоку от Дамаска, чей царь Арета IV правил с 9 г. до н. э. по 40 г. н. э.; его наместник в Дамаске — самая твёрдая опора для дат, ведь бегство должно было случиться до 40 года, а по Галатам — через три года после обращения. Правил ли Арета Дамаском в те годы на деле или лишь держал своего человека среди тамошних набатеев, спорно: римских монет Дамаска с 34 по 62 год не известно. Какой дорогой шёл Савл, не сказано; карта ведёт римскую дорогу на север через Самарию и Галилею и мимо подножия Ермона — естественный путь для идущего из Иерусалима. О доме Иуды ничего не известно, а часовня Анании лежит ниже нынешней улицы, на уровне, который считают римским."
  uk:
    - "Дії кажуть лише, що це сталося, коли Саул, ідучи, був «близько Дамаску», опівдні; жодного місця не названо. Дамаск лежить приблизно за 217 км на північ-північний схід від Єрусалима по прямій і приблизно за 251 км римською дорогою на мапі, вісім днів ходу, тож видіння сталося наприкінці подорожі. Щонайменше від часів хрестоносців християни вказують на Каукаб, пагорб приблизно за 18 км на південний захід від міста на старій дорозі з Галілеї, де нині стоїть грецький православний монастир. У самому Дамаску вулиця, названа Прямою, римський decumanus, і досі йде зі сходу на захід через Старе місто, з каплицею Ананії на її східному кінці та каплицею святого Павла біля Баб-Кісан, де пам'ятають про кошик. Рік на мапі — близько 34 р. н. е.; учені відносять подію до проміжку між 31 і 36 р."
    - "Лука розповідає про це тричі. «Ідучи ж був близько Дамаску, аж ось осияло його сьвітло з неба»; сам Павло каже, що було «о полуднї», «сьвітло над сяєво сонця». Осліплого «вели його за руку, та й привели в Дамаск», і Господь послав Ананію: «йди на улицю, що зветь ся Простою, та й пошукай у Юдиній хатї Тарсянина, на ймя Савла». За кілька днів Саул «проповідував по школах Христа, що се Син Божий». У Посланні до галатів він додає, що «пійшов у Аравию, та й знов вернувсь у Дамаск», а в Другому посланні до коринтян: «царський намістник Арета, стеріг город Дамащан, хотївши піймати мене; і віконцем у коші спущено мене по стїнї, і втік я з рук його»."
    - "Аравія — це Набатейське царство на південь і схід від Дамаска, цар якого Арета IV правив із 9 р. до н. е. до 40 р. н. е.; його урядовець у Дамаску — найпевніша підказка щодо дат, бо втеча має припасти до 40 р. і, за Посланням до галатів, на три роки після навернення. Чи справді Арета правив Дамаском у ті роки, чи лише тримав агента серед його набатеїв, — обговорюють, бо римських монет Дамаска за 34–62 рр. невідомо. Дорогу, якою йшов Саул, не вказано; мапа веде римську дорогу на північ через Самарію й Галілею повз підніжжя Хермона — природний шлях для мандрівника з Єрусалима. Про дім Юди нічого не відомо, а каплиця Ананії лежить нижче сучасної вулиці, на тому, що вважають римським рівнем землі."
  es:
    - "Los Hechos dicen solo que sucedió cuando Saulo iba «llegando cerca de Damasco», a mediodía; no se nombra ningún lugar. Damasco queda a unos 217 km al nornoreste de Jerusalén en línea recta y a unos 251 km por la calzada romana del mapa, ocho días a pie, de modo que la visión llegó al final del viaje. Desde al menos la época de los cruzados, los cristianos señalan Kaukab, una colina a unos 18 km al suroeste de la ciudad, en el antiguo camino de Galilea, donde hoy se alza un monasterio griego ortodoxo. En la propia Damasco, la calle llamada Derecha, el decumano romano, sigue cruzando de este a oeste la Ciudad Vieja, con una capilla de Ananías en su extremo oriental y la capilla de san Pablo en Bab Kisan, donde se recuerda el serón. El año del mapa es hacia el 34 d. C.; los estudiosos sitúan el hecho entre el 31 y el 36."
    - "Lucas lo cuenta tres veces. «Y yendo por el camino, aconteció que llegando cerca de Damasco, súbitamente le cercó un resplandor de luz del cielo»; el propio Pablo dice que fue «como á medio día», una luz «que sobrepujaba el resplandor del sol». Ciego, «llevándole por la mano, metiéronle en Damasco», y el Señor envió a Ananías «á la calle que se llama la Derecha, y busca en casa de Judas á uno llamado Saulo, de Tarso». A los pocos días Saulo «predicaba á Cristo, diciendo que éste era el Hijo de Dios» en las sinagogas. En Gálatas añade que «me fuí á la Arabia, y volví de nuevo á Damasco», y en 2 Corintios que «el gobernador de la provincia del rey Aretas guardaba la ciudad de los Damascenos para prenderme; Y fuí descolgado del muro en un serón por una ventana, y escapé de sus manos»."
    - "Arabia es el reino nabateo al sur y al este de Damasco, cuyo rey Aretas IV reinó del 9 a. C. al 40 d. C.; su oficial en Damasco es el indicio más firme para las fechas, pues la huida debe caer antes del 40 y, según Gálatas, tres años después de la conversión. Si Aretas gobernó realmente Damasco en aquellos años o solo tuvo un agente entre sus nabateos, se discute, pues no se conocen monedas romanas de Damasco del 34 al 62. El camino que tomó Saulo no se indica; el mapa traza la calzada romana hacia el norte por Samaria y Galilea y junto al pie del Hermón, el camino natural para un viajero que salía de Jerusalén. No se sabe nada de la casa de Judas, y la capilla de Ananías queda por debajo de la calle actual, en lo que se tiene por el nivel del suelo romano."
  pt:
    - "Atos diz apenas que aconteceu quando Saulo “se aproximava de Damasco”, ao meio-dia; nenhum lugar é nomeado. Damasco fica a cerca de 217 km a nor-nordeste de Jerusalém em linha reta e a cerca de 251 km pela estrada romana do mapa, oito dias de caminhada, de modo que a visão veio no fim da viagem. Desde pelo menos o período das Cruzadas, os cristãos apontam Kaukab, uma colina a cerca de 18 km a sudoeste da cidade, na antiga estrada da Galileia, onde hoje se ergue um mosteiro ortodoxo grego. Na própria Damasco, a rua chamada Direita, o decumano romano, ainda corre de leste a oeste através da Cidade Velha, com uma capela de Ananias em sua extremidade oriental e a capela de São Paulo em Bab Kisan, onde se recorda o cesto. O ano do mapa é cerca de 34 d.C.; os estudiosos situam o acontecimento entre 31 e 36."
    - "Lucas o conta três vezes. “Em sua viagem, quando se aproximava de Damasco, de repente uma luz do céu brilhou ao seu redor”; o próprio Paulo diz que foi “por volta do meio-dia”, uma luz “mais brilhante que o sol”. Cego, “o conduziram pela mão até Damasco”, e o Senhor enviou Ananias: “Levante-se e vá à rua chamada Direita, e pergunte na casa de Judá por um homem chamado Saulo, de Tarso.” Em poucos dias, Saulo, nas sinagogas, “proclamava o Cristo, que ele é o Filho de Deus”. Em Gálatas acrescenta que “parti para a Arábia. Depois, retornei a Damasco”, e em 2 Coríntios que “Em Damasco, o governador sob o rei Aretas guardava a cidade de Damasco, desejando me prender. Fui descido em um cesto por uma janela da muralha e escapei das suas mãos.”"
    - "A Arábia é o reino nabateu ao sul e a leste de Damasco, cujo rei Aretas IV reinou de 9 a.C. a 40 d.C.; seu oficial em Damasco é o indício mais firme para as datas, já que a fuga deve ocorrer antes de 40 e, segundo Gálatas, três anos depois da conversão. Se Aretas realmente governava Damasco naqueles anos ou apenas mantinha um agente entre os nabateus da cidade é debatido, pois não se conhecem moedas romanas de Damasco de 34 a 62. A estrada que Saulo tomou não é indicada; o mapa traça a estrada romana para o norte, por Samaria e pela Galileia e pelo sopé do Hermom, o caminho natural para quem vinha de Jerusalém. Nada se sabe da casa de Judas, e a capela de Ananias fica abaixo da rua atual, no que se toma por nível do solo romano."
  de:
    - "Die Apostelgeschichte sagt nur, es geschah, als Saulus „nahe an Damaskus kam“, um die Mittagszeit; ein Ort wird nicht genannt. Damaskus liegt in der Luftlinie etwa 217 km nordnordöstlich von Jerusalem und etwa 251 km auf der Römerstraße der Karte, acht Tagesmärsche, die Vision kam also am Ende der Reise. Seit mindestens der Kreuzfahrerzeit zeigen Christen auf Kaukab, einen Hügel etwa 18 km südwestlich der Stadt an der alten Straße aus Galiläa, wo heute ein griechisch-orthodoxes Kloster steht. In Damaskus selbst verläuft die Gerade Straße, der römische Decumanus, noch immer von Ost nach West durch die Altstadt, mit einer Hananiaskapelle an ihrem östlichen Ende und der Paulskapelle am Bab Kisan, wo man sich an den Korb erinnert. Das Jahr der Karte ist etwa 34 n. Chr.; Forscher setzen das Ereignis zwischen 31 und 36 an."
    - "Lukas erzählt es dreimal. „Und da er auf dem Wege war und nahe an Damaskus kam, umleuchtete ihn plötzlich ein Licht vom Himmel“; Paulus selbst sagt, es sei „um den Mittag“ gewesen, ein Licht, „heller denn der Sonne Glanz“. Von dem Erblindeten heißt es: „Sie nahmen ihn bei der Hand und führten ihn gen Damaskus“; und der Herr sandte Hananias „in die Gasse, die da heißt ‚die gerade‘, und frage im Hause des Judas nach einem namens Saul von Tarsus“. Binnen Tagen „predigte er Christus in den Schulen, daß derselbe Gottes Sohn sei“. Im Galaterbrief fügt er hinzu, er „zog hin nach Arabien und kam wiederum gen Damaskus“, und im Zweiten Korintherbrief: „Zu Damaskus verwahrte der Landpfleger des Königs Aretas die Stadt der Damasker und wollte mich greifen, und ich ward in einem Korbe zum Fenster hinaus durch die Mauer niedergelassen und entrann aus seinen Händen.“"
    - "Arabien ist das nabatäische Königreich südlich und östlich von Damaskus, dessen König Aretas IV. von 9 v. Chr. bis 40 n. Chr. regierte; sein Beamter in Damaskus ist der festeste Hinweis auf die Daten, da die Flucht vor 40 fallen muss und nach dem Galaterbrief drei Jahre nach der Bekehrung. Ob Aretas in jenen Jahren tatsächlich über Damaskus herrschte oder nur einen Vertreter unter dessen Nabatäern hielt, ist umstritten, da von 34 bis 62 keine römischen Münzen von Damaskus bekannt sind. Den Weg, den Saulus nahm, nennt der Text nicht; die Karte zeichnet die Römerstraße nach Norden durch Samaria und Galiläa und am Fuß des Hermon vorbei, den natürlichen Weg eines Reisenden aus Jerusalem. Vom Haus des Judas ist nichts bekannt, und die Hananiaskapelle liegt unter der heutigen Straße, auf dem, was für das römische Bodenniveau gehalten wird."
  fr:
    - "Les Actes disent seulement que cela arriva alors que Saul « approchait de Damas », à midi ; aucun lieu n’est nommé. Damas se trouve à environ 217 km au nord-nord-est de Jérusalem à vol d’oiseau et à environ 251 km par la voie romaine de la carte, huit jours de marche : la vision survint donc au terme du voyage. Depuis l’époque des croisés au moins, les chrétiens désignent Kaukab, une colline à environ 18 km au sud-ouest de la ville, sur l’ancienne route de Galilée, où se dresse aujourd’hui un monastère orthodoxe grec. À Damas même, la rue appelée la Droite, l’ancien decumanus romain, traverse encore la vieille ville d’est en ouest, avec une chapelle d’Ananias à son extrémité orientale et la chapelle de Saint-Paul à Bab Kisan, où l’on garde le souvenir de la corbeille. L’année de la carte est vers 34 apr. J.-C. ; les spécialistes situent l’événement entre 31 et 36."
    - "Luc le raconte trois fois. « Comme il était en chemin, et qu’il approchait de Damas, tout à coup une lumière venant du ciel resplendit autour de lui » ; Paul lui-même dit que c’était « vers midi », une lumière « dont l’éclat surpassait celui du soleil ». Devenu aveugle, « on le prit par la main, et on le conduisit à Damas », et le Seigneur envoya Ananias : « va dans la rue qu’on appelle la droite, et cherche, dans la maison de Judas, un nommé Saul de Tarse ». Bientôt, Saul « prêcha dans les synagogues que Jésus est le Fils de Dieu ». Aux Galates, il ajoute : « je partis pour l’Arabie. Puis je revins encore à Damas », et dans 2 Corinthiens : « À Damas, le gouverneur du roi Arétas faisait garder la ville des Damascéniens, pour se saisir de moi ; mais on me descendit par une fenêtre, dans une corbeille, le long de la muraille, et j’échappai de leurs mains. »"
    - "L’Arabie est le royaume nabatéen au sud et à l’est de Damas, dont le roi Arétas IV régna de 9 av. J.-C. à 40 apr. J.-C. ; son officier à Damas est l’indice le plus solide pour les dates, puisque l’évasion doit se placer avant 40 et, d’après l’épître aux Galates, trois ans après la conversion. Qu’Arétas ait réellement gouverné Damas ces années-là ou seulement entretenu un agent parmi ses Nabatéens est débattu, car on ne connaît aucune monnaie romaine de Damas entre 34 et 62. La route suivie par Saul n’est pas indiquée ; la carte trace la voie romaine qui monte vers le nord par la Samarie et la Galilée et passe au pied de l’Hermon, chemin naturel pour un voyageur venant de Jérusalem. On ne sait rien de la maison de Judas, et la chapelle d’Ananias se trouve en dessous de la rue actuelle, à ce que l’on tient pour le niveau du sol romain."
