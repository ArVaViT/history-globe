id: where-was-beersheba
question:
  en: "Where was Beersheba, the well of Abraham?"
  ru: "Где находилась Вирсавия, колодец Авраама?"
  uk: "Де була Беер-Шева, колодязь Авраама?"
  es: "¿Dónde estaba Beerseba, el pozo de Abraham?"
  pt: "Onde ficava Berseba, o poço de Abraão?"
  de: "Wo lag Beerscheba, der Brunnen Abrahams?"
  fr: "Où se trouvait Beer-Schéba, le puits d’Abraham ?"
  pl: "Gdzie leżała Beer-Szeba, studnia Abrahama?"
  it: "Dov’era Bersabea, il pozzo di Abramo?"
  nl: "Waar lag Berseba, de put van Abraham?"
  cs: "Kde byla Beer-šeba, Abrahamova studna?"
  sv: "Var låg Beer Sheva, Abrahams brunn?"
  nb: "Hvor lå Beer-Sjeba, Abrahams brønn?"
  tl: "Saan ang Beer-seba, ang balon ni Abraham?"
  da: "Hvor lå Beersheba, Abrahams brønd?"
  sr: "Где је била Вирсавеја, Аврамов бунар?"
  hu: "Hol volt Beérseba, Ábrahám kútja?"
  fi: "Missä Beerseba, Abrahamin kaivo, oli?"
  vi: "Bê-e-Sê-ba, giếng của Áp-ra-ham, ở đâu?"
  ro: "Unde se afla Beer-Șeba, fântâna lui Avraam?"
  bg: "Къде се е намирала Вирсавия, кладенецът на Авраам?"
answer:
  en:
    - "Beersheba lay in the northern Negev, on the edge of the desert, where wells along a broad wadi allowed settled life; the town of the kings of Judah is Tel Beer Sheva, a mound about 4 km east of the modern city of Beersheba in Israel, and the map point stands on it. It is about 70 km south-south-west of Jerusalem and 40 km south-west of Hebron in a straight line. The name is explained in Genesis as “well of the oath”; the Hebrew can also mean “well of seven”."
    - "The patriarchs' stories turn on its wells. Abraham gave Abimelech seven ewe lambs as witness that he had dug a well, “Wherefore he called that place Beer-sheba; because there they sware both of them”, and he “planted a grove in Beer-sheba, and called there on the name of the LORD, the everlasting God”. Isaac's servants found water there, “therefore the name of the city is Beer-sheba unto this day”. “Jacob went out from Beer-sheba, and went toward Haran”, and in old age he offered sacrifices there on his way down to Egypt. Later Elijah, fleeing from Jezebel, “came to Beer-sheba, which belongeth to Judah, and left his servant there” before going on into the desert."
    - "Yohanan Aharoni's excavations from 1969 showed that the mound was first settled only early in the Iron Age, long after the usual dates for the patriarchs; from about the tenth century BC (the date is disputed) it was a small planned town of Judah with a wall, a gate and a large well outside it, burned at the end of the eighth century. So the wells of Genesis are sought in the valley rather than on the mound, and in the old quarter of the modern city a well is shown as Abraham's. The phrase “from Dan to Beersheba”, the whole land from north to south, is the subject of a separate question."
  ru:
    - "Вирсавия лежала на севере Негева, у края пустыни, где колодцы вдоль широкого русла позволяли жить оседло; город иудейских царей — это Тель-Беэр-Шева, холм примерно в 4 км к востоку от нынешнего города Беэр-Шева в Израиле, и точка карты стоит на нём. Вирсавия лежит примерно в 70 км к юго-юго-западу от Иерусалима и в 40 км к юго-западу от Хеврона по прямой. Книга Бытия объясняет имя как «колодец клятвы»; по-еврейски оно может значить и «колодец семи»."
    - "Истории патриархов вращаются вокруг её колодцев. Авраам дал Авимелеху семь агниц в свидетельство, что он выкопал колодезь: «Потому и назвал он сие место: Вирсавия, ибо тут оба они клялись», и «насадил Авраам при Вирсавии рощу и призвал там имя Господа, Бога вечного». Рабы Исаака нашли там воду: «Посему имя городу тому Беэршива (Вирсавия) до сего дня». «Иаков же вышел из Вирсавии и пошел в Харран», а в старости, идя в Египет, принёс здесь жертвы. Позже Илия, спасаясь от Иезавели, «пришел в Вирсавию, которая в Иудее, и оставил отрока своего там», прежде чем уйти в пустыню."
    - "Раскопки Иоханана Ахарони с 1969 года показали, что холм впервые заселили лишь в начале железного века, намного позже обычных дат патриархов; примерно с X века до н. э. (дата спорна) здесь стоял небольшой спланированный город Иудеи со стеной, воротами и большим колодцем за ними, сгоревший в конце VIII века. Поэтому колодцы книги Бытия ищут в долине, а не на холме, а в старом квартале нынешнего города показывают колодец Авраама. Выражению «от Дана до Вирсавии» — вся земля с севера на юг — посвящён отдельный вопрос."
  uk:
    - "Беер-Шева лежала в північному Негеві, на краю пустелі, де колодязі вздовж широкого ваді давали змогу вести осілий спосіб життя; місто царів Юдеї — це Тель-Беер-Шева, пагорб приблизно за 4 км на схід від сучасного міста Беер-Шева в Ізраїлі, і точка мапи стоїть на ньому. Він лежить приблизно за 70 км на південь-південний захід від Єрусалиму і за 40 км на південний захід від Хеврона по прямій. Назву пояснює Книга Буття як «колодязь клятьби»; єврейське слово може також означати «колодязь сімох»."
    - "Історії патріархів обертаються довкола його колодязів. Авраам дав Авімелехові сім овечих ягниць як свідчення, що він викопав колодязь: «Того й проложено прізвище місцеві тому: Бейер-Себа, колодязь клятьби; бо там клялись обидва», і «посадив Авраам тамариску, і призвав там імя Господа Бога вічного». Раби Ісаака знайшли там воду, «Тим назва й міста того Бейер-Себа, колодязь клятьби, по сей день». «Зійшов геть Яков від Бейер-Себи … та й помандрував у Гаран», а в старості він приніс там жертви на шляху вниз до Єгипту. Пізніше Ілля, тікаючи від Єзавелі, «прийшов у Берсабію, що в Юдеї, і лишив там слугу свого», перш ніж піти далі в пустелю."
    - "Розкопки Йоханана Агароні від 1969 р. показали, що пагорб було вперше заселено лише на початку залізної доби, задовго після звичайних дат патріархів; приблизно від X ст. до н. е. (дата спірна) це було невелике сплановане місто Юдеї з муром, брамою та великим колодязем поза нею, спалене наприкінці VIII ст. Тож колодязі Книги Буття шукають скоріше в долині, ніж на пагорбі, а в старому кварталі сучасного міста показують колодязь як Авраамів. Вислів «від Дана до Беер-Шеви», вся земля з півночі на південь, є темою окремого питання."
  es:
    - "Beerseba se hallaba en el norte del Négev, en el borde del desierto, donde pozos a lo largo de un amplio uadi permitían la vida sedentaria; la ciudad de los reyes de Judá es Tel Beer Sheva, un tell a unos 4 km al este de la moderna ciudad de Beerseba, en Israel, y allí está el punto del mapa. Queda a unos 70 km al sur-suroeste de Jerusalén y a 40 km al suroeste de Hebrón en línea recta. Génesis explica el nombre como «pozo del juramento»; el hebreo puede significar también «pozo de siete»."
    - "Las historias de los patriarcas giran en torno a sus pozos. Abraham dio a Abimelec siete corderas como testimonio de que había cavado un pozo, «Por esto llamó á aquel lugar Beer-seba; porque allí juraron ambos», y «plantó Abraham un bosque en Beer-seba, é invocó allí el nombre de Jehová Dios eterno». Los criados de Isaac hallaron allí agua, «el nombre de aquella ciudad es Beer-seba hasta este día». «Salió Jacob de Beer-seba, y fué á Harán», y en su vejez ofreció allí sacrificios de camino a Egipto. Más tarde Elías, huyendo de Jezabel, «vino á Beer-seba, que es en Judá, y dejó allí su criado» antes de internarse en el desierto."
    - "Las excavaciones de Yohanan Aharoni desde 1969 mostraron que el tell se pobló por primera vez solo a comienzos de la Edad del Hierro, mucho después de las fechas habituales de los patriarcas; desde alrededor del siglo X a. C. (la fecha es discutida) fue una pequeña ciudad planificada de Judá con muralla, puerta y un gran pozo fuera de ella, incendiada a finales del siglo VIII. Así, los pozos de Génesis se buscan en el valle más que en el tell, y en el casco viejo de la ciudad moderna se muestra un pozo como el de Abraham. La expresión «de Dan a Beerseba», toda la tierra de norte a sur, es objeto de una pregunta aparte."
  pt:
    - "Berseba ficava no norte do Neguebe, na orla do deserto, onde poços ao longo de um amplo uádi permitiam a vida sedentária; a cidade dos reis de Judá é Tel Berseba, um montículo a cerca de 4 km a leste da cidade moderna de Berseba, em Israel, e o ponto do mapa está nele. Fica a cerca de 70 km a su-sudoeste de Jerusalém e 40 km a sudoeste de Hebrom em linha reta. O nome é explicado em Gênesis como “poço do juramento”; o hebraico pode significar também “poço de sete”."
    - "As histórias dos patriarcas giram em torno de seus poços. Abraão deu a Abimeleque sete cordeiras como testemunho de que cavara um poço, “Por isso ele chamou aquele lugar de Berseba, porque ambos fizeram um juramento ali”, e “plantou uma tamargueira em Berseba, e ali ele invocou o nome do SENHOR, o Deus Eterno”. Os servos de Isaque acharam água ali, “por isso o nome da cidade é ‘Berseba’ até o dia de hoje”. “Jacó partiu de Berseba e foi em direção a Harã”, e na velhice ofereceu ali sacrifícios a caminho do Egito. Mais tarde Elias, fugindo de Jezabel, “chegou a Berseba, que pertence a Judá, e deixou ali o seu servo” antes de seguir para o deserto."
    - "As escavações de Yohanan Aharoni a partir de 1969 mostraram que o montículo só foi habitado no início da Idade do Ferro, bem depois das datas usuais dos patriarcas; a partir do século X a.C. (a data é disputada) foi uma pequena cidade planejada de Judá, com muralha, porta e um grande poço fora dela, queimada no fim do século VIII. Assim os poços de Gênesis são buscados no vale, não no montículo, e no bairro antigo da cidade moderna mostra-se um poço como de Abraão. A expressão “de Dã a Berseba”, toda a terra de norte a sul, é tema de pergunta à parte."
  de:
    - "Beerscheba lag im nördlichen Negev am Rand der Wüste, wo Brunnen entlang eines breiten Wadis ein sesshaftes Leben erlaubten; die Stadt der Könige von Juda ist Tel Beerscheba, ein Hügel etwa 4 km östlich der heutigen Stadt Beerscheba in Israel, und dort steht der Kartenpunkt. Er liegt in der Luftlinie etwa 70 km südsüdwestlich von Jerusalem und 40 km südwestlich von Hebron. Der Name wird in der Genesis als „Brunnen des Schwurs“ erklärt; das Hebräische kann auch „Brunnen der Sieben“ bedeuten."
    - "Die Geschichten der Erzväter drehen sich um seine Brunnen. Abraham gab Abimelech sieben Lämmer als Zeugnis, dass er den Brunnen gegraben hatte: „Daher heißt die Stätte Beer-Seba, weil sie beide miteinander da geschworen haben“; und „Abraham aber pflanzte Bäume zu Beer-Seba und predigte daselbst von dem Namen des HERRN, des ewigen Gottes“. Isaaks Knechte fanden dort Wasser, „daher heißt die Stadt Beer-Seba bis auf den heutigen Tag“. „Aber Jakob zog aus von Beer-Seba und reiste gen Haran“, und im Alter opferte er dort auf seinem Weg hinab nach Ägypten. Später floh Elia vor Isebel, „kam gen Beer-Seba in Juda und ließ seinen Diener daselbst“, ehe er in die Wüste weiterzog."
    - "Jochanan Aharonis Ausgrabungen ab 1969 zeigten, dass der Hügel erst früh in der Eisenzeit besiedelt wurde, lange nach den üblichen Daten der Erzväter; ab etwa dem 10. Jahrhundert v. Chr. (das Datum ist umstritten) war er eine kleine planmäßig angelegte Stadt Judas mit Mauer, Tor und einem großen Brunnen davor, am Ende des 8. Jahrhunderts verbrannt. Die Brunnen der Genesis sucht man daher im Tal statt auf dem Hügel, und im alten Viertel der heutigen Stadt wird ein Brunnen als der Abrahams gezeigt. Die Wendung „von Dan bis Beerscheba“, das ganze Land von Nord nach Süd, ist Gegenstand einer eigenen Frage."
  fr:
    - "Beer-Schéba se trouvait dans le nord du Néguev, au bord du désert, où des puits le long d’un large oued permettaient une vie sédentaire ; la ville des rois de Juda est Tel Beer-Schéba, un tertre à environ 4 km à l’est de la ville moderne de Beer-Schéba, en Israël, et le point de la carte s’y trouve. Elle est à environ 70 km au sud-sud-ouest de Jérusalem et à 40 km au sud-ouest d’Hébron en ligne droite. La Genèse explique le nom comme « puits du serment » ; l’hébreu peut aussi signifier « puits de sept »."
    - "Les récits des patriarches tournent autour de ses puits. Abraham donna sept jeunes brebis à Abimélec en témoignage qu’il avait creusé un puits : « C’est pourquoi on appelle ce lieu Beer-Schéba ; car c’est là qu’ils jurèrent l’un et l’autre », et il « planta des tamaris à Beer-Schéba ; et là il invoqua le nom de l’Éternel, Dieu de l’éternité ». Les serviteurs d’Isaac y trouvèrent de l’eau, « c’est pourquoi on a donné à la ville le nom de Beer-Schéba, jusqu’à ce jour ». « Jacob partit de Beer-Schéba, et s’en alla à Charan », et vieillard il y offrit des sacrifices en descendant en Égypte. Plus tard Élie, fuyant Jézabel, « arriva à Beer-Schéba, qui appartient à Juda, et il y laissa son serviteur » avant de s’enfoncer dans le désert."
    - "Les fouilles de Yohanan Aharoni, à partir de 1969, montrèrent que le tertre ne fut peuplé qu’au début de l’âge du Fer, bien après les dates habituelles des patriarches ; à partir du Xe siècle av. J.-C. environ (la date est discutée), ce fut une petite ville planifiée de Juda avec un rempart, une porte et un grand puits à l’extérieur, brûlée à la fin du VIIIe siècle. Aussi cherche-t-on les puits de la Genèse dans la vallée plutôt que sur le tertre, et dans le vieux quartier de la ville moderne on montre un puits comme celui d’Abraham. L’expression « depuis Dan jusqu’à Beer-Schéba », tout le pays du nord au sud, fait l’objet d’une question à part."
  pl:
    - "Beer-Szeba leżała w północnym Negewie, na skraju pustyni, gdzie studnie wzdłuż szerokiego wadi pozwalały na osiadłe życie; miasto królów Judy to Tel Beer Szewa, kopiec około 4 km na wschód od współczesnego miasta Beer Szewa w Izraelu, i tam stoi punkt na mapie. Leży około 70 km na południe-południowy zachód od Jerozolimy i 40 km na południowy zachód od Hebronu w linii prostej. Imię objaśnia Księga Rodzaju jako „studnię przysięgi”; hebrajskie może też znaczyć „studnia siedmiu”."
    - "Opowieści patriarchów obracają się wokół jej studni. Abraham dał Abimelekowi siedem owiec jako świadectwo, że wykopał studnię: „Dlatego nazwano miejsce ono Beerseba; albowiem tam obaj przysięgli”, i „nasadził Abraham drzewa w Beerseba, i wzywał tam imienia Pana Boga wiecznego”. Słudzy Izaaka znaleźli tam wodę, „dlategoż imię miasta onego jest nazwane Beerseba aż do dnia dzisiejszego”. „A Jakób wyszedłszy z Beerseba, szedł do Haranu”, a na starość składał tam ofiary w drodze do Egiptu. Później Eliasz, uciekając przed Izebelą, „przyszedł do Beerseby, która była w Judztwie, i zostawił tam sługę swego”, zanim poszedł dalej na pustynię."
    - "Wykopaliska Yohanana Aharoniego od 1969 wykazały, że kopiec zasiedlono dopiero na początku epoki żelaza, długo po zwykłych datach patriarchów; od około X wieku p.n.e. (data jest sporna) było to małe, planowo założone miasto Judy z murem, bramą i dużą studnią poza nią, spalone pod koniec VIII wieku. Studni z Księgi Rodzaju szuka się więc raczej w dolinie niż na kopcu, a w starej dzielnicy współczesnego miasta pokazuje się studnię jako Abrahama. Zwrot „od Dan aż do Beerseba”, cała ziemia od północy do południa, jest tematem osobnego pytania."
  it:
    - "Bersabea sorgeva nel Negev settentrionale, al margine del deserto, dove i pozzi lungo un ampio uadi permettevano la vita sedentaria; la città dei re di Giuda è Tel Beer Sheva, un tumulo a circa 4 km a est della moderna città di Beersheba in Israele, e il punto della mappa vi sta sopra. Dista circa 70 km a sud-sud-ovest di Gerusalemme e 40 km a sud-ovest di Ebron in linea retta. Il nome è spiegato nella Genesi come «pozzo del giuramento»; l’ebraico può significare anche «pozzo di sette»."
    - "Le storie dei patriarchi ruotano attorno ai suoi pozzi. Abramo diede ad Abimelech sette agnelle come testimonianza di aver scavato un pozzo: «Perciò egli chiamò quel luogo Beer-Sceba, perché ambedue vi avean fatto giuramento», e Abramo «piantò un tamarindo a Beer-Sceba, e invocò quivi il nome dell’Eterno, l’Iddio della eternità». I servi d’Isacco vi trovarono acqua: «Per questo la città porta il nome di Beer-Sceba, fino al di d’oggi». «Giacobbe partì da Beer-Sceba e se n’andò verso Charan», e in vecchiaia vi offrì sacrifici scendendo in Egitto. Più tardi Elia, fuggendo da Gezabele, «giunse a Beer-Sceba, che appartiene a Giuda, e vi lasciò il suo servo» prima di inoltrarsi nel deserto."
    - "Gli scavi di Yohanan Aharoni dal 1969 mostrarono che il tumulo fu abitato per la prima volta solo all’inizio dell’età del Ferro, molto dopo le date abituali dei patriarchi; dal X secolo a.C. circa (la data è discussa) fu una piccola città pianificata di Giuda con un muro, una porta e un grande pozzo fuori, bruciata alla fine dell’VIII secolo. Così i pozzi della Genesi si cercano nella valle più che sul tumulo, e nel quartiere vecchio della città moderna si mostra un pozzo come quello di Abramo. L’espressione «da Dan fino a Beer-Sceba», l’intero paese da nord a sud, è oggetto di una domanda a parte."
  nl:
    - "Berseba lag in de noordelijke Negev, aan de rand van de woestijn, waar putten langs een brede wadi een vaste woonplaats mogelijk maakten; de stad van de koningen van Juda is Tel Beër Seva, een heuvel ongeveer 4 km ten oosten van de moderne stad Berseba in Israël, en daar staat het punt op de kaart. Hij ligt hemelsbreed ongeveer 70 km zuid-zuidwestelijk van Jeruzalem en 40 km ten zuidwesten van Hebron. De naam wordt in Genesis uitgelegd als “put van de eed”; het Hebreeuws kan ook “put van zeven” betekenen."
    - "De verhalen van de aartsvaders draaien om zijn putten. Abraham gaf Abimelech zeven ooilammeren als getuigenis dat hij een put had gegraven, “Daarom noemde men die plaats Ber-seba, omdat die beiden daar gezworen hadden”, en hij “plantte een bos in Ber-seba, en riep aldaar den Naam des HEEREN, des eeuwigen Gods, aan”. Izaks knechten vonden daar water, “daarom is de naam dier stad Ber-seba, tot op dezen dag”. “Jakob dan toog uit van Ber-seba, en ging naar Haran”, en op hoge leeftijd bracht hij daar offers op weg naar Egypte. Later vluchtte Elia voor Izebel en “kwam te Ber-seba, dat in Juda is, en liet zijn jongen aldaar”, voordat hij de woestijn introk."
    - "De opgravingen van Yohanan Aharoni vanaf 1969 toonden dat de heuvel pas vroeg in de IJzertijd werd bewoond, lang na de gebruikelijke data voor de aartsvaders; vanaf omstreeks de 10e eeuw v.Chr. (de datum is omstreden) was het een kleine geplande stad van Juda met een muur, een poort en een grote put erbuiten, aan het eind van de achtste eeuw verbrand. De putten van Genesis worden dus in het dal gezocht in plaats van op de heuvel, en in de oude wijk van de moderne stad wordt een put als die van Abraham getoond. De uitdrukking “van Dan tot Ber-seba toe”, het hele land van noord naar zuid, is het onderwerp van een aparte vraag."
  cs:
    - "Beer-šeba ležela v severním Negevu, na okraji pouště, kde studny podél širokého vádí umožňovaly usedlý život; město judských králů je Tel Beer Ševa, pahorek asi 4 km východně od moderního města Beer-šeba v Izraeli, a bod na mapě stojí na něm. Je asi 70 km jihojihozápadně od Jeruzaléma a 40 km jihozápadně od Hebronu vzdušnou čarou. Jméno vysvětluje Genesis jako „studnu přísahy“; hebrejsky může znamenat i „studnu sedmi“."
    - "Příběhy patriarchů se točí kolem jejích studní. Abraham dal Abimelekovi sedm jehnic jako svědectví, že vykopal studnu, „Pročež nazváno jest to místo Bersabé, že tu oba dva přisáhli“, a „nasázel stromoví v Bersabé, a vzýval tam jméno Hospodina, Boha silného, věčného“. Izákovi služebníci tam nalezli vodu, „Protož jméno města toho jest Bersabé až do dnešního dne“. „Vyšed pak Jákob z Bersabé, šel do Cháran“ a ve stáří tam obětoval na cestě dolů do Egypta. Později Elijáš, prchaje před Jezábel, „přišel do Bersabé, jenž jest v Judstvu, kdež nechal mládence svého“, než šel dál na poušť."
    - "Vykopávky Jochanana Aharoniho od roku 1969 ukázaly, že pahorek byl poprvé osídlen až na počátku doby železné, dlouho po obvyklých datech patriarchů; od asi 10. století př. n. l. (datum je sporné) byl malým plánovitým městem Judska s hradbou, branou a velkou studnou před ní, vypáleným na konci 8. století. Studny z Genesis se proto hledají spíše v údolí než na pahorku a ve staré čtvrti moderního města se ukazuje studna jako Abrahamova. Rčení „od Dan až do Bersabé“, celá země od severu k jihu, je předmětem samostatné otázky."
  sv:
    - "Beer Sheva låg i norra Negev, vid öknens kant, där brunnar längs ett brett vadi möjliggjorde bofast liv; Judas kungars stad är Tel Beer Sheva, en kulle omkring 4 km öster om dagens stad Beer Sheva i Israel, och kartpunkten står på den. Den ligger omkring 70 km syd-sydväst om Jerusalem och 40 km sydväst om Hebron fågelvägen. Namnet förklaras i 1 Mosebok som ”edens brunn”; hebreiskan kan också betyda ”sjuornas brunn”."
    - "Patriarkernas berättelser kretsar kring dess brunnar. Abraham gav Avimelek sju lamm som vittne om att han hade grävt en brunn, ”Därav kallades det stället Beer-Seba, eftersom de båda där gingo eden”, och han ”planterade en tamarisk vid Beer-Seba och åkallade där HERRENS, den evige Gudens, namn”. Isaks tjänare fann vatten där, och ”därav heter staden Beer-Seba ännu i dag”. ”Jakob begav sig från Beer-Seba på väg till Haran”, och på sin ålderdom offrade han där på vägen ned till Egypten. Senare kom Elia, på flykt undan Isebel, ”till Beer-Seba, som hör till Juda; där lämnade han kvar sin tjänare” innan han gick vidare ut i öknen."
    - "Yohanan Aharonis utgrävningar från 1969 visade att kullen bosattes först tidigt under järnåldern, långt efter de vanliga dateringarna av patriarkerna; från omkring 900-talet f.Kr. (dateringen är omstridd) var den en liten planerad stad i Juda med mur, port och en stor brunn utanför, bränd i slutet av 700-talet. Därför söks 1 Moseboks brunnar i dalen snarare än på kullen, och i den gamla stadsdelen i den moderna staden visas en brunn som Abrahams. Uttrycket ”från Dan ända till Beer-Seba”, hela landet från norr till söder, är föremål för en separat fråga."
  nb:
    - "Beer-Sjeba lå i det nordlige Negev, i ørkenkanten, der brønner langs en bred wadi gjorde fast bosetting mulig; Judas kongers by er Tel Beer Sjeva, en haug omtrent 4 km øst for den moderne byen Beer Sjeva i Israel, og kartpunktet står på den. Den ligger omtrent 70 km sør-sørvest for Jerusalem og 40 km sørvest for Hebron i luftlinje. Navnet forklares i 1 Mosebok som «edsbrønnen»; det hebraiske kan også bety «sjubrønnen»."
    - "Patriarkenes fortellinger dreier seg om dens brønner. Abraham ga Abimelek sju søyelam som vitne om at han hadde gravd en brønn: «Derfor kalte de dette sted Be'erseba; for der gjorde de begge sin ed.», og han «plantet en tamarisk i Be'erseba, og der påkalte han Herrens, den evige Guds navn». Isaks tjenere fant vann der, «derfor heter byen Be'erseba den dag i dag». «Jakob tok ut fra Be'erseba og gav sig på veien til Karan», og som gammel ofret han der på vei ned til Egypt. Senere kom Elia, på flukt fra Jesabel, «til Be'erseba, som hører til Juda; der lot han sin dreng bli tilbake» før han gikk videre ut i ørkenen."
    - "Yohanan Aharonis utgravinger fra 1969 viste at haugen først ble bosatt tidlig i jernalderen, lenge etter de vanlige datoene for patriarkene; fra omkring 900-tallet f.Kr. (dateringen er omstridt) var den en liten planlagt by i Juda med mur, port og en stor brønn utenfor, brent ved slutten av 700-tallet f.Kr. Så brønnene i 1 Mosebok søkes i dalen heller enn på haugen, og i den gamle bydelen i den moderne byen vises en brønn som Abrahams. Uttrykket «fra Dan til Beer-Sjeba», hele landet fra nord til sør, er tema for et eget spørsmål."
  tl:
    - "Ang Beer-seba ay nasa hilagang Negev, sa gilid ng disyerto, kung saan nagpahintulot ng buhay-pamayanan ang mga balon sa tabi ng malawak na wadi; ang bayan ng mga hari ng Juda ay ang Tel Beer Seva, isang burol na mga 4 km sa silangan ng makabagong lungsod ng Beer-seba sa Israel, at doon nakatayo ang tuldok sa mapa. Ito ay mga 70 km sa timog-timog-kanluran ng Jerusalem at 40 km sa timog-kanluran ng Hebron sa tuwid na guhit. Ipinaliliwanag ng Genesis ang pangalan bilang “balon ng sumpa”; maaari ring mangahulugan ang Hebreo ng “balon ng pito”."
    - "Umiikot sa mga balon nito ang mga kuwento ng mga patriyarka. Nagbigay si Abraham kay Abimelech ng pitong kordero bilang saksi na humukay siya ng balon: “Kaya't tinawag niya ang dakong yaong Beerseba; sapagka't doon sila kapuwa nanumpa”, at “nagtanim si Abraham ng isang punong kahoy na tamaring sa Beerseba, at sinambitla doon ang pangalan ng Panginoong Dios na walang hanggan”. Nakasumpong ng tubig doon ang mga alipin ni Isaac, “kaya't ang pangalan ng bayang yaon ay Beerseba hanggang ngayon”. “Umalis si Jacob sa Beerseba at napasa dakong Haran”, at sa katandaan ay naghandog doon sa daan pababa sa Egipto. Kalaunan, si Elias, na tumatakas kay Jezabel, ay “naparoon sa Beerseba, na nauukol sa Juda, at iniwan ang kaniyang lingkod doon” bago pumasok sa disyerto."
    - "Ipinakita ng mga paghuhukay ni Yohanan Aharoni mula 1969 na unang tinirhan ang burol sa simula lamang ng Panahon ng Bakal, malayo pagkatapos ng karaniwang petsa ng mga patriyarka; mula mga ikasampung siglo BK (pinagtatalunan ang petsa), ito ay maliit na planadong bayan ng Juda na may pader, pintuan at malaking balon sa labas nito, na nasunog sa katapusan ng ikawalong siglo. Kaya hinahanap ang mga balon ng Genesis sa libis sa halip na sa burol, at sa lumang bahagi ng makabagong lungsod ay ipinakikita ang isang balon bilang kay Abraham. Ang pariralang “mula sa Dan hanggang sa Beer-seba”, ang buong lupain mula hilaga hanggang timog, ay paksa ng hiwalay na tanong."
  da:
    - "Beersheba lå i det nordlige Negev, ved ørkenens kant, hvor brønde langs en bred wadi gjorde fast bosættelse mulig; Judas kongers by er Tel Be'er Sjeva, en høj omkring 4 km øst for den moderne by Beersheba i Israel, og kortets punkt står på den. Den ligger omkring 70 km sydsydvest for Jerusalem og 40 km sydvest for Hebron i luftlinje. Navnet forklares i Første Mosebog som »edens brønd«; det hebraiske kan også betyde »syvs brønd«."
    - "Patriarkernes fortællinger drejer sig om dens brønde. Abraham gav Abimelek syv lam som vidne på, at han havde gravet en brønd: »Derfor kaldte han dette Sted Beersaba; thi der svore de begge«, og han »plantede en Lund i Beersaba og paakaldte der Herrens, den evige Guds, Navn«. Isaks tjenere fandt vand dér: »deraf er Stadens Navn Beersaba indtil denne Dag«. »Jakob drog ud fra Beersaba og gik til Karan«, og i sin alderdom ofrede han dér på vej ned til Egypten. Senere kom Elias, flygtende fra Jezabel, »til Beersaba, som tilhører Juda; og han lod sin Dreng blive der«, før han gik videre ud i ørkenen."
    - "Yohanan Aharonis udgravninger fra 1969 viste, at højen først blev bebygget tidligt i jernalderen, længe efter de sædvanlige datoer for patriarkerne; fra omkring 900-tallet f.Kr. (dateringen er omstridt) var den en lille planlagt by i Juda med mur, port og en stor brønd uden for, brændt ved slutningen af 700-tallet. Derfor søges Første Mosebogs brønde i dalen frem for på højen, og i den gamle bydel i den moderne by vises en brønd som Abrahams. Udtrykket »fra Dan til Beersheba«, hele landet fra nord til syd, er emnet for et eget spørgsmål."
  sr:
    - "Вирсавеја је лежала у северном Негеву, на ивици пустиње, где су бунари дуж широког вадија омогућавали настањен живот; град јудејских краљева је Тел Бер Шева, хумка око 4 км источно од савременог града Беер Шеве у Израелу, и тачка на карти стоји на њој. Око 70 км је југ-југозападно од Јерусалима и 40 км југозападно од Хеврона правом линијом. Име се у Постању објашњава као „бунар заклетве“; хебрејски може значити и „бунар седам“."
    - "Приче о праоцима врте се око њених бунара. Аврам је Авимелеху дао седам јагњади као сведочанство да је ископао бунар: „Отуда се прозва оно место Вирсавеја, јер се онде заклеше обојица“, и „Аврам посади луг на Вирсавеји, и онде призва име Господа Бога Вечног“. Исакове слуге нашле су тамо воду: „отуда се зове град онај Вирсавеја до данашњег дана“. „А Јаков отиде од Вирсавеје идући у Харан“, а у старости је тамо приносио жртве на путу у Египат. Касније Илија, бежећи од Језавеље, „дође у Вирсавеју Јудину, и онде остави момка свог“ пре него што је отишао даље у пустињу."
    - "Ископавања Јоханана Ахаронија од 1969. показала су да је хумка први пут насељена тек почетком гвозденог доба, дуго после уобичајених датума за праоце; од око 10. века п. н. е. (датум је спорен) била је мали планирани јудејски град са зидом, капијом и великим бунаром изван ње, спаљен крајем 8. века. Зато се бунари из Постања траже у долини, а не на хумци, а у старом делу савременог града показује се бунар као Аврамов. Израз „од Дана до Вирсавеје“, цела земља од севера до југа, тема је посебног питања."
  hu:
    - "Beérseba az északi Negevben feküdt, a sivatag szélén, ahol egy széles vádi menti kutak lehetővé tették a letelepedett életet; Júda királyainak városa a Tel Beérseba, a mai izraeli Beérseba várostól mintegy 4 km-re keletre lévő halom, és a térképi pont is ott áll. Jeruzsálemtől egyenes vonalban mintegy 70 km-re dél-délnyugatra van, Hebrontól 40 km-re délnyugatra. A nevet a Mózes első könyve „az eskü kútjaként” magyarázza; a héber jelentheti „a hét kútját” is."
    - "Az ősatyák történetei a kutaknál fordulnak: Ábrahám hét nőstényjuhot adott Abiméleknek tanúul, hogy kutat ásott, „Azért nevezék azt a helyet Beérsebának, mivelhogy ott esküdtek vala meg mind a ketten”, és „tamariskusfákat ültete Beérsebában, és segítségűl hívá ott az örökkévaló Úr Istennek nevét”. Izsák szolgái vizet találtak ott, „Azokáért annak a városnak neve Beérseba mind e mai napig”. „Jákób pedig kiindula Beérsebából, és Hárán felé tartott”, és öregségében áldozatokat mutatott be ott az Egyiptomba menet. Később Illés, Jézabel elől menekülve, „méne Beersebába, a mely Júdában volt; és ott hagyá az ő szolgáját”, mielőtt tovább ment a sivatagba."
    - "Yohanan Aharoni 1969-től folytatott ásatásai kimutatták, hogy a halom csak a vaskor elején települt be először, jóval az ősatyák szokásos dátumai után; mintegy a Kr. e. 10. századtól (a dátum vitatott) Júda kis, tervezett városa volt fallal, kapuval és a kapun kívüli nagy kúttal, a Kr. e. 8. század végén felégették. A Mózes első könyve kútjait ezért a völgyben keresik, nem a halmon, és a modern város régi negyedében egy kutat Ábrahám kútjaként mutatnak. A „Dántól Beérsebáig” kifejezés, az egész föld északtól délig, külön kérdés tárgya."
  fi:
    - "Beerseba sijaitsi Negevin pohjoisosassa autiomaan reunalla, missä leveän wadin varrella olevat kaivot mahdollistivat asutun elämän; Juudan kuninkaiden kaupunki on Tel Beer Seva, kumpu noin 4 km nykyisen Beerseban kaupungin itäpuolella Israelissa, ja karttapiste on sen päällä. Se on noin 70 km Jerusalemista etelä-lounaaseen ja 40 km Hebronista lounaaseen linnuntietä. Nimi selitetään 1. Mooseksen kirjassa ”valan kaivoksi”; heprea voi tarkoittaa myös ”seitsemän kaivoa”."
    - "Patriarkkojen tarinat pyörivät sen kaivojen ympärillä. Abraham antoi Abimelekille seitsemän uuhikaritsaa todisteeksi siitä, että oli kaivanut kaivon: ”Siitä kutsuttiin paikkaa Beersebaksi, koska he molemmat vannoivat siinä toisilleen valan”, ja hän ”istutti tamariskipuun Beersebaan ja huusi siinä avuksi Herran, iankaikkisen Jumalan, nimeä”. Iisakin palvelijat löysivät sieltä vettä, ”sentähden on kaupungin nimi vielä tänäkin päivänä Beerseba”. ”Jaakob lähti Beersebasta mennäksensä Harraniin”, ja vanhana hän uhrasi siellä matkalla alas Egyptiin. Myöhemmin Isebeliä pakeneva Elia ”tuli Beersebaan, joka on Juudan aluetta”, ja jätti palvelijansa sinne ennen autiomaahan jatkamista."
    - "Yohanan Aharonin kaivaukset vuodesta 1969 osoittivat, että kumpu asutettiin ensi kerran vasta rautakauden alussa, kauan patriarkkojen tavanomaisten ajoitusten jälkeen; noin 900-luvulta eaa. (ajoituksesta kiistellään) se oli Juudan pieni suunniteltu kaupunki, jossa oli muuri, portti ja suuri kaivo sen ulkopuolella, ja se paloi 700-luvun lopussa. Siksi 1. Mooseksen kirjan kaivoja etsitään laaksosta eikä kummulta, ja nykyisen kaupungin vanhassa kaupunginosassa näytetään yhtä kaivoa Abrahamin omana. Sanonta ”Daanista Beersebaan”, koko maa pohjoisesta etelään, on oman kysymyksensä aihe."
  vi:
    - "Bê-e-Sê-ba nằm ở bắc Nê-ghép, bên rìa sa mạc, nơi các giếng dọc một wadi rộng cho phép đời sống định cư; thị trấn của các vua Giu-đa là Tel Beer Sheva, một gò cách thành phố Beersheba hiện đại ở Israel khoảng 4 km về phía đông, và điểm bản đồ đứng trên đó. Nó cách Giê-ru-sa-lem khoảng 70 km về phía nam-tây nam và cách Hếp-rôn 40 km về phía tây nam theo đường thẳng. Tên được giải thích trong Sáng thế ký là “giếng của lời thề”; tiếng Hê-bơ-rơ cũng có thể nghĩa là “giếng bảy”."
    - "Các câu chuyện tổ phụ xoay quanh các giếng của nó. Áp-ra-ham cho A-bi-mê-léc bảy chiên cái con làm chứng rằng ông đã đào giếng, “Bởi cớ ấy, nên họ đặt tên chỗ nầy là Bê-e-Sê-ba; vì tại đó hai người đều đã thề nguyện cùng nhau”, và ông “trồng một cây me tại Bê-e-Sê-ba, và ở đó người cầu khẩn danh Đức Giê-hô-va, là Đức Chúa Trời hằng-hữu”. Các đầy tớ của Y-sác tìm thấy nước ở đó, “nên tên thành ấy là Bê-e-Sê-ba cho đến ngày nay”. “Gia-cốp từ Bê-e-Sê-ba đi đến Cha-ran”, và lúc tuổi già ông dâng tế lễ ở đó trên đường xuống Ê-díp-tô. Về sau Ê-li, chạy trốn Giê-sa-bên, “Đến tại Bê-e-Sê-ba, thuộc về Giu-đa, người để tôi tớ mình lại đó” trước khi đi tiếp vào sa mạc."
    - "Các cuộc khai quật của Yohanan Aharoni từ 1969 cho thấy gò chỉ được định cư lần đầu vào đầu thời đồ sắt, lâu sau các niên đại thông thường của các tổ phụ; từ khoảng thế kỷ 10 TCN (niên đại còn tranh luận) nó là một thị trấn có quy hoạch nhỏ của Giu-đa với tường, cổng và một giếng lớn bên ngoài, bị đốt vào cuối thế kỷ 8. Vì vậy các giếng của Sáng thế ký được tìm trong thung lũng hơn là trên gò, và trong khu cũ của thành phố hiện đại có một giếng được chỉ là của Áp-ra-ham. Cụm “từ Đan đến Bê-e-Sê-ba”, toàn xứ từ bắc xuống nam, là chủ đề của một câu hỏi riêng."
  ro:
    - "Beer-Șeba se afla în nordul Neghevului, la marginea deșertului, unde fântânile de-a lungul unui wadi larg îngăduiau viața sedentară; orașul regilor Iudei este Tel Beer Sheva, o movilă la circa 4 km est de orașul modern Beer-Șeba din Israel, iar punctul de pe hartă stă pe ea. Se află la circa 70 km sud-sud-vest de Ierusalim și 40 km sud-vest de Hebron în linie dreaptă. Numele este explicat în Facere ca „fântâna jurământului”; ebraica poate însemna și „fântâna celor șapte”."
    - "Povestirile patriarhilor se învârt în jurul fântânilor ei. Avraam i-a dat lui Abimelec șapte mielușele ca mărturie că săpase o fântână: „Pentru aceea a chemat numele locului aceluia, fântâna jurământului, că acolo au jurat amândoi”, și „a sădit Avraam țarină la fântâna jurământului, și a chemat acolo numele Domnului, Dumnezeu veșnic”. Slugile lui Isaac au găsit acolo apă, „pentru aceea au chemat numele cetății aceleia fântâna jurământului, până în ziua de astăzi”. „Și a ieșit Iacov dela fântâna jurământului și a mers în Haran”, iar la bătrânețe a adus acolo jertfe în drum spre Egipt. Mai târziu Ilie, fugind de Izabela, „a venit în Virsavee în pământul Iudei, și ș’a lăsat sluga sa acolo”, înainte de a intra în deșert."
    - "Săpăturile lui Yohanan Aharoni din 1969 au arătat că movila a fost locuită întâia oară abia la începutul Epocii Fierului, mult după datele obișnuite ale patriarhilor; din circa secolul al X-lea î.Hr. (data este disputată) a fost un mic oraș planificat al Iudei, cu zid, poartă și o fântână mare în afara ei, ars la sfârșitul secolului al VIII-lea. Așa că fântânile din Facere se caută în vale, nu pe movilă, iar în cartierul vechi al orașului modern se arată o fântână ca a lui Avraam. Expresia „dela Dan până la Virsavee”, întreaga țară de la nord la sud, face obiectul unei întrebări aparte."
  bg:
    - "Вирсавия лежала в Северен Негев, на края на пустинята, където кладенци по широко уади позволявали уседнал живот; градът на юдейските царе е Тел Беер Шева, могила на около 4 км източно от съвременния град Беер Шева в Израел, и точката на картата стои на нея. Тя е на около 70 км юг-югозападно от Йерусалим и на 40 км югозападно от Хеврон по права линия. Битие обяснява името като „кладенец клетвен“; еврейското може да означава и „кладенец на седемте“."
    - "Разказите за патриарсите се въртят около кладенците ѝ. Авраам дал на Авимелех седем женски агнета като свидетелство, че е изкопал кладенец: „За това наименува онова място Вирсавее (кладенец клетвен); защото там се заклеха двамата“, и „насади Авраам дъбрава във Вирсавее; и призва там името на Йеова Бога Вечнаго“. Слугите на Исаак намерили вода там, „затова е името на града Вирсавее до днес“. „Излезе Яков от Вирсавее, и отиде в Харан“, а на старини принесъл там жертви на път за Египет. По-късно Илия, бягайки от Йезавел, „дойде в Вирсавее Юдин, и остави там слугата си“, преди да продължи в пустинята."
    - "Разкопките на Йоханан Ахарони от 1969 г. показаха, че могилата е заселена едва в началото на желязната епоха, дълго след обичайните дати за патриарсите; от около X в. пр.н.е. (датата е спорна) тя била малък планиран град на Юда със стена, порта и голям кладенец извън нея, изгорен в края на VIII в. Затова кладенците от Битие се търсят в долината, а не на могилата, а в стария квартал на съвременния град се показва кладенец като Авраамов. Изразът „от Дан до Вирсавее“ — цялата земя от север до юг — е тема на отделен въпрос."
