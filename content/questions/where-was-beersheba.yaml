id: where-was-beersheba
question:
  en: "Where was Beersheba, the well of Abraham?"
  ru: "Где находилась Вирсавия, колодец Авраама?"
  uk: "Де була Беер-Шева, колодязь Авраама?"
  es: "¿Dónde estaba Beerseba, el pozo de Abraham?"
  pt: "Onde ficava Berseba, o poço de Abraão?"
  de: "Wo lag Beerscheba, der Brunnen Abrahams?"
  fr: "Où se trouvait Beer-Schéba, le puits d’Abraham ?"
answer:
  en:
    - "Beersheba lay in the northern Negev, on the edge of the desert, where wells along a broad wadi allowed settled life; the town of the kings of Judah is Tel Beer Sheva, a mound about 4 km east of the modern city of Beersheba in Israel, and the map point stands on it. It is about 70 km south-south-west of Jerusalem and 40 km south-west of Hebron in a straight line. The name is explained in Genesis as “well of the oath”; the Hebrew can also mean “well of seven”."
    - "The patriarchs' stories turn on its wells. Abraham gave Abimelech seven ewe lambs as witness that he had dug a well, “Wherefore he called that place Beer-sheba; because there they sware both of them”, and he “planted a grove in Beer-sheba, and called there on the name of the LORD, the everlasting God”. Isaac's servants found water there, “therefore the name of the city is Beer-sheba unto this day”. “Jacob went out from Beer-sheba, and went toward Haran”, and in old age he offered sacrifices there on his way down to Egypt. Later Elijah, fleeing from Jezebel, “came to Beer-sheba, which belongeth to Judah, and left his servant there” before going on into the desert."
    - "Yohanan Aharoni's excavations from 1969 showed that the mound was first settled only early in the Iron Age, long after the usual dates for the patriarchs; from about the tenth century BC (the date is disputed) it was a small planned town of Judah with a wall, a gate and a large well outside it, burned at the end of the eighth century. So the wells of Genesis are sought in the valley rather than on the mound, and in the old quarter of the modern city a well is shown as Abraham's. The phrase “from Dan to Beersheba”, the whole land from north to south, is the subject of a separate question."
  ru:
    - "Вирсавия лежала на севере Негева, у края пустыни, где колодцы вдоль широкого русла позволяли жить оседло; город иудейских царей — это Тель-Беэр-Шева, холм примерно в 4 км к востоку от нынешнего города Беэр-Шева в Израиле, и точка карты стоит на нём. Вирсавия лежит примерно в 70 км к юго-юго-западу от Иерусалима и в 40 км к юго-западу от Хеврона по прямой. Книга Бытия объясняет имя как «колодец клятвы»; по-еврейски оно может значить и «колодец семи»."
    - "Истории патриархов вращаются вокруг её колодцев. Авраам дал Авимелеху семь агниц в свидетельство, что он выкопал колодезь: «Потому и назвал он сие место: Вирсавия, ибо тут оба они клялись», и «насадил Авраам при Вирсавии рощу и призвал там имя Господа, Бога вечного». Рабы Исаака нашли там воду: «Посему имя городу тому Беэршива (Вирсавия) до сего дня». «Иаков же вышел из Вирсавии и пошел в Харран», а в старости, идя в Египет, принёс здесь жертвы. Позже Илия, спасаясь от Иезавели, «пришел в Вирсавию, которая в Иудее, и оставил отрока своего там», прежде чем уйти в пустыню."
    - "Раскопки Иоханана Ахарони с 1969 года показали, что холм впервые заселили лишь в начале железного века, намного позже обычных дат патриархов; примерно с X века до н. э. (дата спорна) здесь стоял небольшой спланированный город Иудеи со стеной, воротами и большим колодцем за ними, сгоревший в конце VIII века. Поэтому колодцы книги Бытия ищут в долине, а не на холме, а в старом квартале нынешнего города показывают колодец Авраама. Выражению «от Дана до Вирсавии» — вся земля с севера на юг — посвящён отдельный вопрос."
  uk:
    - "Беер-Шева лежала в північному Негеві, на краю пустелі, де колодязі вздовж широкого ваді давали змогу вести осілий спосіб життя; місто царів Юдеї — це Тель-Беер-Шева, пагорб приблизно за 4 км на схід від сучасного міста Беер-Шева в Ізраїлі, і точка мапи стоїть на ньому. Він лежить приблизно за 70 км на південь-південний захід від Єрусалиму і за 40 км на південний захід від Хеврона по прямій. Назву пояснює Книга Буття як «колодязь клятьби»; єврейське слово може також означати «колодязь сімох»."
    - "Історії патріархів обертаються довкола його колодязів. Авраам дав Авімелехові сім овечих ягниць як свідчення, що він викопав колодязь: «Того й проложено прізвище місцеві тому: Бейер-Себа, колодязь клятьби; бо там клялись обидва», і «посадив Авраам тамариску, і призвав там імя Господа Бога вічного». Раби Ісаака знайшли там воду, «Тим назва й міста того Бейер-Себа, колодязь клятьби, по сей день». «Зійшов геть Яков від Бейер-Себи … та й помандрував у Гаран», а в старості він приніс там жертви на шляху вниз до Єгипту. Пізніше Ілля, тікаючи від Єзавелі, «прийшов у Берсабію, що в Юдеї, і лишив там слугу свого», перш ніж піти далі в пустелю."
    - "Розкопки Йоханана Ахароні від 1969 р. показали, що пагорб було вперше заселено лише на початку залізної доби, задовго після звичайних дат патріархів; приблизно від X ст. до н. е. (дата спірна) це було невелике сплановане місто Юдеї з муром, брамою та великим колодязем поза нею, спалене наприкінці VIII ст. Тож колодязі Книги Буття шукають скоріше в долині, ніж на пагорбі, а в старому кварталі сучасного міста показують колодязь як Авраамів. Вислів «від Дана до Беер-Шеви», вся земля з півночі на південь, є темою окремого питання."
  es:
    - "Beerseba se hallaba en el norte del Négev, en el borde del desierto, donde pozos a lo largo de un amplio uadi permitían la vida sedentaria; la ciudad de los reyes de Judá es Tel Beer Sheva, un tell a unos 4 km al este de la moderna ciudad de Beerseba, en Israel, y allí está el punto del mapa. Queda a unos 70 km al sur-suroeste de Jerusalén y a 40 km al suroeste de Hebrón en línea recta. Génesis explica el nombre como «pozo del juramento»; el hebreo puede significar también «pozo de siete»."
    - "Las historias de los patriarcas giran en torno a sus pozos. Abraham dio a Abimelec siete corderas como testimonio de que había cavado un pozo, «Por esto llamó á aquel lugar Beer-seba; porque allí juraron ambos», y «plantó Abraham un bosque en Beer-seba, é invocó allí el nombre de Jehová Dios eterno». Los criados de Isaac hallaron allí agua, «el nombre de aquella ciudad es Beer-seba hasta este día». «Salió Jacob de Beer-seba, y fué á Harán», y en su vejez ofreció allí sacrificios de camino a Egipto. Más tarde Elías, huyendo de Jezabel, «vino á Beer-seba, que es en Judá, y dejó allí su criado» antes de internarse en el desierto."
    - "Las excavaciones de Yohanan Aharoni desde 1969 mostraron que el tell se pobló por primera vez solo a comienzos de la Edad del Hierro, mucho después de las fechas habituales de los patriarcas; desde alrededor del siglo X a. C. (la fecha es discutida) fue una pequeña ciudad planificada de Judá con muralla, puerta y un gran pozo fuera de ella, incendiada a finales del siglo VIII. Así, los pozos de Génesis se buscan en el valle más que en el tell, y en el casco viejo de la ciudad moderna se muestra un pozo como el de Abraham. La expresión «de Dan a Beerseba», toda la tierra de norte a sur, es objeto de una pregunta aparte."
  pt:
    - "Berseba ficava no norte do Neguebe, na orla do deserto, onde poços ao longo de um amplo uádi permitiam a vida sedentária; a cidade dos reis de Judá é Tel Berseba, um montículo a cerca de 4 km a leste da cidade moderna de Berseba, em Israel, e o ponto do mapa está nele. Fica a cerca de 70 km a su-sudoeste de Jerusalém e 40 km a sudoeste de Hebrom em linha reta. O nome é explicado em Gênesis como “poço do juramento”; o hebraico pode significar também “poço de sete”."
    - "As histórias dos patriarcas giram em torno de seus poços. Abraão deu a Abimeleque sete cordeiras como testemunho de que cavara um poço, “Por isso ele chamou aquele lugar de Berseba, porque ambos fizeram um juramento ali”, e “plantou uma tamargueira em Berseba, e ali ele invocou o nome do SENHOR, o Deus Eterno”. Os servos de Isaque acharam água ali, “por isso o nome da cidade é ‘Berseba’ até o dia de hoje”. “Jacó partiu de Berseba e foi em direção a Harã”, e na velhice ofereceu ali sacrifícios a caminho do Egito. Mais tarde Elias, fugindo de Jezabel, “chegou a Berseba, que pertence a Judá, e deixou ali o seu servo” antes de seguir para o deserto."
    - "As escavações de Yohanan Aharoni a partir de 1969 mostraram que o montículo só foi habitado no início da Idade do Ferro, bem depois das datas usuais dos patriarcas; a partir do século X a.C. (a data é disputada) foi uma pequena cidade planejada de Judá, com muralha, porta e um grande poço fora dela, queimada no fim do século VIII. Assim os poços de Gênesis são buscados no vale, não no montículo, e no bairro antigo da cidade moderna mostra-se um poço como de Abraão. A expressão “de Dã a Berseba”, toda a terra de norte a sul, é tema de pergunta à parte."
  de:
    - "Beerscheba lag im nördlichen Negev am Rand der Wüste, wo Brunnen entlang eines breiten Wadis ein sesshaftes Leben erlaubten; die Stadt der Könige von Juda ist Tel Beerscheba, ein Hügel etwa 4 km östlich der heutigen Stadt Beerscheba in Israel, und dort steht der Kartenpunkt. Er liegt in der Luftlinie etwa 70 km südsüdwestlich von Jerusalem und 40 km südwestlich von Hebron. Der Name wird in der Genesis als „Brunnen des Schwurs“ erklärt; das Hebräische kann auch „Brunnen der Sieben“ bedeuten."
    - "Die Geschichten der Erzväter drehen sich um seine Brunnen. Abraham gab Abimelech sieben Lämmer als Zeugnis, dass er den Brunnen gegraben hatte: „Daher heißt die Stätte Beer-Seba, weil sie beide miteinander da geschworen haben“; und „Abraham aber pflanzte Bäume zu Beer-Seba und predigte daselbst von dem Namen des HERRN, des ewigen Gottes“. Isaaks Knechte fanden dort Wasser, „daher heißt die Stadt Beer-Seba bis auf den heutigen Tag“. „Aber Jakob zog aus von Beer-Seba und reiste gen Haran“, und im Alter opferte er dort auf seinem Weg hinab nach Ägypten. Später floh Elia vor Isebel, „kam gen Beer-Seba in Juda und ließ seinen Diener daselbst“, ehe er in die Wüste weiterzog."
    - "Jochanan Aharonis Ausgrabungen ab 1969 zeigten, dass der Hügel erst früh in der Eisenzeit besiedelt wurde, lange nach den üblichen Daten der Erzväter; ab etwa dem 10. Jahrhundert v. Chr. (das Datum ist umstritten) war er eine kleine planmäßig angelegte Stadt Judas mit Mauer, Tor und einem großen Brunnen davor, am Ende des 8. Jahrhunderts verbrannt. Die Brunnen der Genesis sucht man daher im Tal statt auf dem Hügel, und im alten Viertel der heutigen Stadt wird ein Brunnen als der Abrahams gezeigt. Die Wendung „von Dan bis Beerscheba“, das ganze Land von Nord nach Süd, ist Gegenstand einer eigenen Frage."
  fr:
    - "Beer-Schéba se trouvait dans le nord du Néguev, au bord du désert, où des puits le long d’un large oued permettaient une vie sédentaire ; la ville des rois de Juda est Tel Beer-Schéba, un tertre à environ 4 km à l’est de la ville moderne de Beer-Schéba, en Israël, et le point de la carte s’y trouve. Elle est à environ 70 km au sud-sud-ouest de Jérusalem et à 40 km au sud-ouest d’Hébron en ligne droite. La Genèse explique le nom comme « puits du serment » ; l’hébreu peut aussi signifier « puits de sept »."
    - "Les récits des patriarches tournent autour de ses puits. Abraham donna sept jeunes brebis à Abimélec en témoignage qu’il avait creusé un puits : « C’est pourquoi on appelle ce lieu Beer-Schéba ; car c’est là qu’ils jurèrent l’un et l’autre », et il « planta des tamaris à Beer-Schéba ; et là il invoqua le nom de l’Éternel, Dieu de l’éternité ». Les serviteurs d’Isaac y trouvèrent de l’eau, « c’est pourquoi on a donné à la ville le nom de Beer-Schéba, jusqu’à ce jour ». « Jacob partit de Beer-Schéba, et s’en alla à Charan », et vieillard il y offrit des sacrifices en descendant en Égypte. Plus tard Élie, fuyant Jézabel, « arriva à Beer-Schéba, qui appartient à Juda, et il y laissa son serviteur » avant de s’enfoncer dans le désert."
    - "Les fouilles de Yohanan Aharoni, à partir de 1969, montrèrent que le tertre ne fut peuplé qu’au début de l’âge du Fer, bien après les dates habituelles des patriarches ; à partir du Xe siècle av. J.-C. environ (la date est discutée), ce fut une petite ville planifiée de Juda avec un rempart, une porte et un grand puits à l’extérieur, brûlée à la fin du VIIIe siècle. Aussi cherche-t-on les puits de la Genèse dans la vallée plutôt que sur le tertre, et dans le vieux quartier de la ville moderne on montre un puits comme celui d’Abraham. L’expression « depuis Dan jusqu’à Beer-Schéba », tout le pays du nord au sud, fait l’objet d’une question à part."
