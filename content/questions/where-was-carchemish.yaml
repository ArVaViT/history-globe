id: where-was-carchemish
question:
  en: "Where was Carchemish, where Nebuchadnezzar defeated Egypt?"
  ru: "Где находился Кархемис, где Навуходоносор разбил Египет?"
  uk: "Де був Каркемиш, де Навуходоносор переміг Єгипет?"
  es: "¿Dónde estaba Carquemis, donde Nabucodonosor derrotó a Egipto?"
  pt: "Onde ficava Carquemis, onde Nabucodonosor derrotou o Egito?"
  de: "Wo lag Karkemisch, wo Nebukadnezar Ägypten besiegte?"
  fr: "Où se trouvait Carkemisch, où Nebucadnetsar vainquit l’Égypte ?"
  pl: "Gdzie leżał Karkemisz, gdzie Nabuchodonozor pokonał Egipt?"
  it: "Dov’era Carchemis, dove Nabucodonosor sconfisse l’Egitto?"
  nl: "Waar lag Karkemis, waar Nebukadnessar Egypte versloeg?"
  cs: "Kde byl Karkemíš, kde Nebukadnesar porazil Egypt?"
answer:
  en:
    - "Carchemish stood on the west bank of the Euphrates at the river's main crossing in northern Syria; its ruins lie on today's border between Turkey and Syria, beside Karkamış on the Turkish side and Jarabulus on the Syrian, and the map point stands on them. It is about 617 km north-north-east of Jerusalem in a straight line, and about 91 km west of Haran, across the river."
    - "Its name in the Bible comes from the battle that ended the Assyrian age. In 609 BC Pharaoh Necho marched north to help the last king of Assyria hold the Euphrates; “Necho king of Egypt came up to fight against Carchemish by Euphrates: and Josiah went out against him”, and Josiah fell at Megiddo, about 538 km to the south. In 605 BC the crown prince Nebuchadnezzar crossed the river and destroyed the Egyptian army at Carchemish; the Babylonian Chronicle says that he overtook the survivors in the district of Hamath and not one man escaped home. Jeremiah dates it exactly: “the army of Pharaoh-necho king of Egypt, which was by the river Euphrates in Carchemish, which Nebuchadrezzar king of Babylon smote in the fourth year of Jehoiakim”. The victory opened Syria and Judah to Babylon."
    - "Carchemish had been great long before. In the fourteenth century BC the Hittites made it the seat of their viceroys in Syria, and after their empire fell it was the leading Neo-Hittite kingdom, known for its carved reliefs and Luwian hieroglyphic inscriptions, until Sargon II of Assyria took it in 717 BC; Isaiah has the Assyrian boast, “Is not Calno as Carchemish?” The British Museum excavated it in 1911–1914 and 1920 under D. G. Hogarth and Leonard Woolley, with T. E. Lawrence on the staff, and a Turkish and Italian team has worked on the Turkish side since 2011."
  ru:
    - "Кархемис стоял на западном берегу Евфрата, у главной переправы через реку в северной Сирии; его развалины лежат на нынешней границе Турции и Сирии, рядом с Каркамышем на турецкой стороне и Джараблусом на сирийской, и точка карты стоит на них. Отсюда около 617 км до Иерусалима на юго-юго-запад по прямой и около 91 км до Харрана на восток, за рекой."
    - "В Библию его имя попало из-за битвы, закончившей ассирийскую эпоху. В 609 г. до н. э. фараон Нехао пошёл на север, чтобы помочь последнему царю Ассирии удержать Евфрат: «пошел Нехао, царь Египетский, на войну к Кархемису на Евфрате; и Иосия вышел навстречу ему», и Иосия пал при Мегиддоне, примерно в 538 км к югу. В 605 г. до н. э. наследник престола Навуходоносор переправился через реку и разгромил египетское войско при Кархемисе; Вавилонская хроника говорит, что он настиг уцелевших в области Емафа и ни один не вернулся домой. Иеремия точно датирует битву: «о войске фараона Нехао, царя Египетского, которое было при реке Евфрате в Кархемисе, и которое поразил Навуходоносор, царь Вавилонский, в четвертый год Иоакима». Победа открыла Вавилону Сирию и Иудею."
    - "Кархемис был велик задолго до того. В XIV веке до н. э. хетты сделали его резиденцией своих наместников в Сирии, а после падения их державы он был главным новохеттским царством, известным резными рельефами и лувийскими иероглифическими надписями, пока в 717 г. до н. э. его не взял ассирийский царь Саргон II; у Исаии ассириец хвалится: «Халне не то же ли, что Кархемис?» Британский музей раскапывал его в 1911–1914 и 1920 годах под руководством Д. Хогарта и Леонарда Вулли, и среди сотрудников был Т. Э. Лоуренс, а с 2011 года на турецкой стороне работает турецко-итальянская экспедиция."
  uk:
    - "Каркемиш стояв на західному березі Євфрату на головному броді річки в північній Сирії; його руїни лежать на нинішньому кордоні між Туреччиною та Сирією, біля Каркамиша на турецькому боці й Джераблуса на сирійському, і точка мапи стоїть на них. Він лежить приблизно за 617 км на північ-північний схід від Єрусалиму по прямій і приблизно за 91 км на захід від Харана, через річку."
    - "Його назва в Біблії походить від битви, що завершила ассирійську добу. 609 р. до н. е. фараон Нехао рушив на північ, щоб допомогти останньому ассирійському цареві втримати Євфрат; «пійшов Нехао, царь Египецький, на войну до Кархемису на Евфратї; і вийшов Йосія на зустріч йому», і Йосія впав у Мегіддо, приблизно за 538 км на південь. 605 р. до н. е. кронпринц Навуходоносор переправився через річку і знищив єгипетське військо при Каркемиші; Вавилонська хроніка каже, що він наздогнав уцілілих в окрузі Хамат, і жодна людина не втекла додому. Єремія датує це точно: «військо Фараона Нехао, царя Египецького, що стояло на Евфрат-ріцї в Кархамисї, яке побив Навуходонозор, царь Вавилонський, у четвертому роцї Йоакимовому». Перемога відкрила Сирію й Юдею для Вавилону."
    - "Каркемиш був великим задовго до цього. У XIV ст. до н. е. хетти зробили його резиденцією своїх намісників у Сирії, а після падіння їхньої імперії він був провідним нео-хеттським царством, відомим різьбленими рельєфами та лувійськими ієрогліфічними написами, доки Саргон II Ассирійський не взяв його 717 р. до н. е.; в Ісаї ассирієць хвалиться: «Хиба Хальне не те, що й Кархемис?» Британський музей розкопував його 1911–1914 і 1920 рр. під керівництвом Д. Дж. Хогарта та Леонарда Вулі, при чому Т. Е. Лоуренс був у складі експедиції, а турецько-італійська команда працює на турецькому боці з 2011 р."
  es:
    - "Carquemis se alzaba en la orilla occidental del Éufrates, en el principal vado del río en el norte de Siria; sus ruinas yacen en la actual frontera entre Turquía y Siria, junto a Karkamış en el lado turco y Jarabulus en el sirio, y allí está el punto del mapa. Queda a unos 617 km al nor-noreste de Jerusalén en línea recta, y a unos 91 km al oeste de Harán, al otro lado del río."
    - "Su nombre en la Biblia procede de la batalla que cerró la era asiria. En el 609 a. C. el faraón Necao marchó al norte para ayudar al último rey de Asiria a mantener el Éufrates; «Nechâo rey de Egipto subió á hacer guerra en Carchêmis junto á Eufrates; y salió Josías contra él», y Josías cayó en Meguido, a unos 538 km al sur. En el 605 a. C. el príncipe heredero Nabucodonosor cruzó el río y destruyó al ejército egipcio en Carquemis; la Crónica babilónica dice que alcanzó a los supervivientes en la región de Hamat y que ni un hombre escapó a su tierra. Jeremías lo fecha con exactitud: «contra el ejército de Faraón Nechâo rey de Egipto, que estaba cerca del río Eufrates en Carchêmis, al cual hirió Nabucodonosor rey de Babilonia el año cuarto de Joacim». La victoria abrió Siria y Judá a Babilonia."
    - "Carquemis había sido grande mucho antes. En el siglo XIV a. C. los hititas la hicieron sede de sus virreyes en Siria, y tras la caída de su imperio fue el principal reino neohitita, conocido por sus relieves tallados y sus inscripciones jeroglíficas lúvicas, hasta que Sargón II de Asiria la tomó en el 717 a. C.; Isaías recoge la jactancia asiria: «¿No es Calno como Carchêmis?». El Museo Británico la excavó en 1911–1914 y 1920 bajo D. G. Hogarth y Leonard Woolley, con T. E. Lawrence en el equipo, y un equipo turco e italiano trabaja en el lado turco desde 2011."
  pt:
    - "Carquemis ficava na margem oeste do Eufrates, na principal travessia do rio no norte da Síria; suas ruínas estão na atual fronteira entre a Turquia e a Síria, junto a Karkamış do lado turco e a Jarabulus do lado sírio, e o ponto do mapa está sobre elas. Fica a cerca de 617 km a nor-nordeste de Jerusalém em linha reta, e a cerca de 91 km a oeste de Harã, do outro lado do rio."
    - "Seu nome na Bíblia vem da batalha que pôs fim à era assíria. Em 609 a.C. o faraó Neco marchou para o norte para ajudar o último rei da Assíria a manter o Eufrates; “Neco, rei do Egito, subiu para lutar contra Carquemis, junto ao Eufrates, e Josias saiu contra ele”, e Josias caiu em Megido, a cerca de 538 km ao sul. Em 605 a.C. o príncipe herdeiro Nabucodonosor atravessou o rio e destruiu o exército egípcio em Carquemis; a Crônica Babilônica diz que alcançou os sobreviventes no distrito de Hamate e nenhum homem escapou para casa. Jeremias a data com exatidão: “o exército do faraó Neco, rei do Egito, que estava junto ao rio Eufrates, em Carquemis, o qual Nabucodonosor, rei da Babilônia, derrotou no quarto ano de Jeoaquim”. A vitória abriu a Síria e Judá à Babilônia."
    - "Carquemis fora grande muito antes. No século XIV a.C. os hititas fizeram dela a sede de seus vice-reis na Síria, e depois da queda do império foi o principal reino neo-hitita, conhecido por seus relevos esculpidos e inscrições em hieróglifos luvitas, até que Sargão II da Assíria a tomou em 717 a.C.; Isaías tem a jactância assíria: “Não é Calno como Carquemis?” O Museu Britânico a escavou em 1911–1914 e 1920 sob D. G. Hogarth e Leonard Woolley, com T. E. Lawrence na equipe, e uma equipe turco-italiana trabalha no lado turco desde 2011."
  de:
    - "Karkemisch lag am Westufer des Euphrat an der Hauptfurt des Flusses in Nordsyrien; seine Ruinen liegen an der heutigen Grenze zwischen der Türkei und Syrien, neben Karkamış auf türkischer und Dscharablus auf syrischer Seite, und der Kartenpunkt steht auf ihnen. Es liegt in der Luftlinie etwa 617 km nordnordöstlich von Jerusalem und etwa 91 km westlich von Haran, jenseits des Flusses."
    - "Sein Name in der Bibel stammt von der Schlacht, die das assyrische Zeitalter beendete. 609 v. Chr. zog Pharao Necho nach Norden, um dem letzten König Assyriens beim Halten des Euphrat zu helfen: „zog Necho, der König in Ägypten, herauf, zu streiten wider Karchemis am Euphrat. Und Josia zog aus, ihm entgegen“, und Josia fiel bei Megiddo, etwa 538 km südlich. 605 v. Chr. überschritt der Kronprinz Nebukadnezar den Fluss und vernichtete das ägyptische Heer bei Karkemisch; die Babylonische Chronik sagt, er habe die Überlebenden im Gebiet von Hamat eingeholt, und kein Mann sei heimgekommen. Jeremia datiert es genau: „Wider das Heer Pharao Nechos, des Königs in Ägypten, welches lag am Wasser Euphrat zu Karchemis, das der König zu Babel, Nebukadnezar, schlug im vierten Jahr Jojakims“. Der Sieg öffnete Syrien und Juda für Babylon."
    - "Karkemisch war schon lange zuvor groß. Im 14. Jahrhundert v. Chr. machten die Hethiter es zum Sitz ihrer Vizekönige in Syrien, und nach dem Untergang ihres Reiches war es das führende neuhethitische Königreich, bekannt für seine Reliefs und luwischen Hieroglypheninschriften, bis Sargon II. von Assyrien es 717 v. Chr. nahm; Jesaja lässt den Assyrer prahlen: „Ist Kalno nicht wie Karchemis?“ Das Britische Museum grub es 1911–1914 und 1920 unter D. G. Hogarth und Leonard Woolley aus, mit T. E. Lawrence im Stab, und ein türkisch-italienisches Team arbeitet seit 2011 auf der türkischen Seite."
  fr:
    - "Carkemisch se dressait sur la rive ouest de l’Euphrate, au principal passage du fleuve dans le nord de la Syrie ; ses ruines se trouvent sur l’actuelle frontière entre la Turquie et la Syrie, à côté de Karkamış du côté turc et de Jarabulus du côté syrien, et le point de la carte est sur elles. Elle est à environ 617 km au nord-nord-est de Jérusalem en ligne droite, et à environ 91 km à l’ouest de Haran, de l’autre côté du fleuve."
    - "Son nom dans la Bible vient de la bataille qui mit fin à l’âge assyrien. En 609 av. J.-C., le pharaon Néco marcha vers le nord pour aider le dernier roi d’Assyrie à tenir l’Euphrate ; « Néco, roi d’Égypte, monta pour combattre à Carkemisch sur l’Euphrate. Josias marcha à sa rencontre », et Josias tomba à Meguiddo, à environ 538 km au sud. En 605 av. J.-C., le prince héritier Nebucadnetsar franchit le fleuve et détruisit l’armée égyptienne à Carkemisch ; la Chronique babylonienne dit qu’il rattrapa les survivants dans la région de Hamath et que pas un homme ne rentra chez lui. Jérémie la date exactement : « l’armée de Pharaon Neco, roi d’Égypte, qui était près du fleuve de l’Euphrate, à Carkemisch, et qui fut battue par Nebucadnetsar, roi de Babylone, la quatrième année de Jojakim ». La victoire ouvrit la Syrie et Juda à Babylone."
    - "Carkemisch avait été grande bien avant. Au XIVe siècle av. J.-C., les Hittites en firent le siège de leurs vice-rois en Syrie, et après la chute de leur empire ce fut le principal royaume néo-hittite, connu pour ses reliefs sculptés et ses inscriptions hiéroglyphiques louvites, jusqu’à ce que Sargon II d’Assyrie la prenne en 717 av. J.-C. ; Ésaïe met dans la bouche de l’Assyrien cette vantardise : « N’en a-t-il pas été de Calno comme de Carkemisch ? » Le British Museum la fouilla en 1911–1914 et 1920 sous D. G. Hogarth et Leonard Woolley, avec T. E. Lawrence dans l’équipe, et une équipe turco-italienne travaille du côté turc depuis 2011."
  pl:
    - "Karkemisz stał na zachodnim brzegu Eufratu przy głównej przeprawie rzeki w północnej Syrii; jego ruiny leżą na dzisiejszej granicy Turcji i Syrii, obok Karkamış po stronie tureckiej i Dżarabulus po syryjskiej, i na nich stoi punkt na mapie. Jest około 617 km na północ-północny wschód od Jerozolimy w linii prostej i około 91 km na zachód od Charanu, po drugiej stronie rzeki."
    - "Jego nazwa w Biblii pochodzi od bitwy, która zakończyła epokę asyryjską. W 609 p.n.e. faraon Necho ruszył na północ, by pomóc ostatniemu królowi Asyrii utrzymać Eufrat; „wyciągnął Necho, król Egipski, aby walczył przeciw Karchemis nad rzeką Eufrates; a Jozyjasz też wyjechał przeciwko niemu”, i Jozjasz poległ pod Megiddo, około 538 km na południe. W 605 p.n.e. następca tronu Nabuchodonozor przeprawił się przez rzekę i zniszczył armię egipską pod Karkemisz; Kronika Babilońska mówi, że dogonił ocalałych w okręgu Chamat i ani jeden człowiek nie wrócił do domu. Jeremiasz datuje to dokładnie: „wojsku Faraona Necha, króla Egipskiego, (które było nad rzeką Eufrates u Karchemis, które poraził Nabuchodonozor, król Babiloński) roku czwartego Joakima”. Zwycięstwo otworzyło Syrię i Judę Babilonowi."
    - "Karkemisz był wielki na długo wcześniej. W XIV wieku p.n.e. Hetyci uczynili go siedzibą swoich wicekrólów w Syrii, a po upadku ich imperium był czołowym królestwem neohetyckim, znanym z rzeźbionych reliefów i luwijskich napisów hieroglificznych, aż Sargon II z Asyrii zdobył go w 717 p.n.e.; u Izajasza Asyryjczyk chełpi się: „Izali Chalmo nie jest jako Karchemis?” Muzeum Brytyjskie wykopywało go w latach 1911–1914 i 1920 pod kierunkiem D. G. Hogartha i Leonarda Woolleya, z T. E. Lawrence'em w zespole, a zespół turecko-włoski pracuje po stronie tureckiej od 2011."
  it:
    - "Carchemis sorgeva sulla riva occidentale dell’Eufrate al principale guado del fiume nella Siria settentrionale; le sue rovine giacciono sull’odierno confine tra Turchia e Siria, accanto a Karkamış sul lato turco e a Jarabulus su quello siriano, e il punto della mappa sta su di esse. Dista circa 617 km a nord-nord-est di Gerusalemme in linea retta e circa 91 km a ovest di Carran, oltre il fiume."
    - "Il suo nome nella Bibbia viene dalla battaglia che chiuse l’età assira. Nel 609 a.C. il faraone Neco marciò a nord per aiutare l’ultimo re d’Assiria a tenere l’Eufrate; «Neco, re d’Egitto, salì per combattere a Carkemish, sull’Eufrate; e Giosia gli mosse contro», e Giosia cadde a Meghiddo, a circa 538 km a sud. Nel 605 a.C. il principe ereditario Nabucodonosor attraversò il fiume e distrusse l’esercito egizio a Carchemis; la Cronaca babilonese dice che raggiunse i superstiti nel distretto di Camat e nemmeno un uomo tornò a casa. Geremia lo data con esattezza: «l’esercito di Faraone Neco, re d’Egitto, che era presso al fiume Eufrate a Carkemish, e che Nebucadnetsar, re di Babilonia, sconfisse il quarto anno di Joiakim». La vittoria aprì la Siria e Giuda a Babilonia."
    - "Carchemis era stata grande ben prima. Nel XIV secolo a.C. gli Ittiti ne fecero la sede dei loro viceré in Siria, e dopo la caduta del loro impero fu il principale regno neo-ittita, noto per i rilievi scolpiti e le iscrizioni in geroglifico luvio, finché Sargon II d’Assiria la prese nel 717 a.C.; Isaia riporta la vanteria assira: «Non è egli avvenuto di Calno come di Carkemish?» Il British Museum la scavò nel 1911–1914 e nel 1920 sotto D. G. Hogarth e Leonard Woolley, con T. E. Lawrence nello staff, e una squadra turca e italiana lavora sul lato turco dal 2011."
  nl:
    - "Karkemis lag aan de westoever van de Eufraat bij de belangrijkste oversteek van de rivier in Noord-Syrië; zijn ruïnes liggen op de huidige grens tussen Turkije en Syrië, naast Karkamış aan Turkse en Jarabulus aan Syrische zijde, en het punt op de kaart staat erop. Het ligt hemelsbreed ongeveer 617 km noord-noordoostelijk van Jeruzalem en ongeveer 91 km ten westen van Haran, aan de overkant van de rivier."
    - "Zijn naam in de Bijbel komt van de slag die het Assyrische tijdperk beëindigde. In 609 v.Chr. trok farao Necho naar het noorden om de laatste koning van Assyrië te helpen de Eufraat te houden; “toog Necho, de koning van Egypte, op, om te krijgen tegen Karchemis, aan den Frath; en Josia toog uit hem tegemoet”, en Josia sneuvelde bij Megiddo, ongeveer 538 km naar het zuiden. In 605 v.Chr. stak kroonprins Nebukadnessar de rivier over en vernietigde het Egyptische leger bij Karkemis; de Babylonische kroniek zegt dat hij de overlevenden inhaalde in het gebied van Hamat en dat geen man thuiskwam. Jeremia dateert het precies: “het heir van Farao Necho, koning van Egypte, dat aan de rivier Frath, bij Karchemis was, dat Nebukadrezar, de koning van Babel, sloeg, in het vierde jaar van Jojakim”. De overwinning opende Syrië en Juda voor Babylon."
    - "Karkemis was al lang daarvoor groot. In de veertiende eeuw v.Chr. maakten de Hettieten het de zetel van hun onderkoningen in Syrië, en na de val van hun rijk was het het voornaamste Neo-Hettitische koninkrijk, bekend om zijn gebeeldhouwde reliëfs en Luwische hiërogliefeninscripties, tot Sargon II van Assyrië het in 717 v.Chr. innam; Jesaja geeft de Assyrische grootspraak: “Is niet Kalno gelijk Karchemis?” Het British Museum groef het op in 1911–1914 en 1920 onder D. G. Hogarth en Leonard Woolley, met T. E. Lawrence in de staf, en een Turks-Italiaans team werkt sinds 2011 aan Turkse zijde."
  cs:
    - "Karkemíš stál na západním břehu Eufratu u hlavního brodu řeky v severní Sýrii; jeho zříceniny leží na dnešní hranici mezi Tureckem a Sýrií, vedle Karkamışe na turecké straně a Džarábulusu na syrské, a bod na mapě stojí na nich. Je asi 617 km severoseverovýchodně od Jeruzaléma vzdušnou čarou a asi 91 km západně od Cháranu, přes řeku."
    - "Jeho jméno v Bibli pochází z bitvy, která ukončila asyrskou dobu. Roku 609 př. n. l. táhl faraon Nekó na sever, aby pomohl poslednímu asyrskému králi udržet Eufrat; „přitáhl Nécho král Egyptský, aby bojoval proti Charkemis podlé Eufraten, Joziáš pak vytáhl proti němu“, a Jošijáš padl u Megida, asi 538 km na jih. Roku 605 př. n. l. korunní princ Nebukadnesar přešel řeku a zničil egyptské vojsko u Karkemíše; babylonská kronika říká, že dostihl přeživší v oblasti Chamatu a ani jeden muž se nedostal domů. Jeremjáš to datuje přesně: o „vojsku Faraona Néchy krále Egyptského, (jenž bylo při řece Eufrates u Charkemis, kteréž zbil Nabuchodonozor král Babylonský), léta čtvrtého Joakima syna Joziášova“. Vítězství otevřelo Babylónu Sýrii a Judsko."
    - "Karkemíš byl veliký už dávno. Ve 14. století př. n. l. z něj Chetité učinili sídlo svých místokrálů v Sýrii a po pádu jejich říše byl vedoucím novochetitským královstvím, známým pro rytinové reliéfy a luvijské hieroglyfické nápisy, dokud jej roku 717 př. n. l. nedobyl asyrský Sargon II.; Izajáš má asyrskou chloubu: „Zdaliž jako Charkemis není Chalno?“ Britské muzeum jej vykopávalo v letech 1911–1914 a 1920 pod vedením D. G. Hogartha a Leonarda Woolleyho, za účasti T. E. Lawrence, a turecký a italský tým pracuje na turecké straně od roku 2011."
