id: where-did-pilate-live
question:
  en: "Where did Pontius Pilate live?"
  ru: "Где жил Понтий Пилат?"
  uk: "Де жив Понтій Пилат?"
  es: "¿Dónde vivía Poncio Pilato?"
  pt: "Onde morava Pôncio Pilatos?"
  de: "Wo wohnte Pontius Pilatus?"
  fr: "Où vivait Ponce Pilate ?"
answer:
  en:
    - "Pilate's seat was Caesarea on the coast, the harbour city Herod the Great had built and named for Augustus, about 87 km north-west of Jerusalem in a straight line; the map point stands on its ruins south of Haifa. From AD 6 the Roman governors of Judea lived there, in Herod's palace on the promontory, and came up to Jerusalem for the feasts, when the crowds were largest."
    - "Luke lists “Pontius Pilate being governor of Judaea” beside the tetrarchs, and Acts shows his successors at home in Caesarea: Paul was held “in Herod's judgment hall” there, and Festus “ascended from Caesarea to Jerusalem” three days after taking office. In Jerusalem the governor used the praetorium, and the Gospels place the trial of Jesus there; most scholars take it to be Herod's palace on the western hill, where Philo says Pilate hung gilded shields and where the procurator Florus later set up his tribunal, though the tradition of the Via Dolorosa puts it in the Antonia fortress by the Temple. Josephus tells how Pilate, newly arrived, sent troops into Jerusalem by night with standards bearing the emperor's image, and how the people lay for five days in front of his house at Caesarea until he gave way."
    - "In 1961 Italian excavators found in the theatre of Caesarea a reused limestone block inscribed with Pilate's name and title, prefect of Judea, from a building he had dedicated to Tiberius; it is the only stone inscription of his day known to name him, and it fixes both his rank and his city. Herod's palace, with a pool cut into the rock of the promontory, was excavated from the 1970s to the 1990s, and the governors' residence is placed there."
  ru:
    - "Резиденцией Пилата была Кесария на побережье — портовый город, который Ирод Великий построил и назвал в честь Августа, примерно в 87 км к северо-западу от Иерусалима по прямой; точка карты стоит на его развалинах к югу от Хайфы. С 6 года римские наместники Иудеи жили здесь, во дворце Ирода на мысу, и поднимались в Иерусалим на праздники, когда толпы были всего больше."
    - "Лука перечисляет: «Понтий Пилат начальствовал в Иудее» — рядом с четвертовластниками, а Деяния показывают его преемников дома, в Кесарии: Павла держали там «в Иродовой претории», а Фест через три дня после вступления в должность «отправился из Кесарии в Иерусалим». В Иерусалиме наместник занимал преторию, и Евангелия помещают туда суд над Иисусом; большинство учёных видят в ней дворец Ирода на западном холме, где, по словам Филона, Пилат повесил золочёные щиты и где позже наместник Флор ставил своё судейское кресло, хотя предание Крестного пути помещает её в крепость Антония у Храма. Иосиф Флавий рассказывает, как Пилат, едва прибыв, ночью ввёл в Иерусалим войска со знамёнами, несущими изображение императора, и как народ пять дней лежал перед его домом в Кесарии, пока он не уступил."
    - "В 1961 году итальянские археологи нашли в театре Кесарии вторично использованный известняковый блок с именем и титулом Пилата — префект Иудеи — от здания, которое он посвятил Тиберию; это единственная известная каменная надпись его времени с его именем, и она закрепляет и его чин, и его город. Дворец Ирода с бассейном, вырубленным в скале мыса, раскопан в 1970-х–1990-х годах, и резиденцию наместников помещают там."
  uk:
    - "Резиденцією Пилата була Кесарія на узбережжі, портове місто, збудоване Іродом Великим і назване на честь Августа, приблизно за 87 км на північний захід від Єрусалиму по прямій; точка мапи стоїть на її руїнах на південь від Хайфи. З 6 р. н. е. римські правителі Юдеї жили там, в Іродовому палаці на мисі, і приїжджали до Єрусалиму на свята, коли було найбільше народу."
    - "Лука згадує «як був ігемоном Понтийський Пилат в Юдеї» поряд із тетрархами, а Дії показують його наступників у себе вдома в Кесарії: Павла там тримали «в преториї Іродовій», а Фест «по трох днях пійшов у Єрусалим з Кесариї». В Єрусалимі правитель користувався преторієм, і Євангелії ставлять там суд над Ісусом; більшість учених вважає його Іродовим палацом на західному пагорбі, де, за Філоном, Пилат повісив позолочені щити і де прокуратор Флор згодом поставив свій трибунал, хоча традиція Віа Долороза ставить його у фортеці Антонія біля Храму. Йосиф Флавій розповідає, як Пилат, щойно прибувши, уночі ввів війська в Єрусалим із штандартами із зображенням імператора, і як народ п'ять днів лежав перед його домом у Кесарії, доки він не поступився."
    - "1961 р. італійські археологи знайшли в театрі Кесарії повторно використаний вапняковий блок із написом з ім'ям та титулом Пилата, префекта Юдеї, з будівлі, яку він присвятив Тиберію; це єдиний кам'яний напис його часу, що називає його, і він фіксує і його ранг, і його місто. Іродів палац із басейном, вирубаним у скелі мису, було розкопано від 1970-х до 1990-х рр., і резиденцію правителів ставлять там."
  es:
    - "La sede de Pilato era Cesarea, en la costa, la ciudad portuaria que Herodes el Grande había construido y nombrado en honor de Augusto, a unos 87 km al noroeste de Jerusalén en línea recta; el punto del mapa está sobre sus ruinas, al sur de Haifa. Desde el 6 d. C., los gobernadores romanos de Judea vivían allí, en el palacio de Herodes sobre el promontorio, y subían a Jerusalén para las fiestas, cuando las multitudes eran mayores."
    - "Lucas enumera a «Poncio Pilato siendo gobernador de Judea» junto a los tetrarcas, y Hechos muestra a sus sucesores como en su casa en Cesarea: Pablo fue custodiado «en el pretorio de Herodes» allí, y Festo «subió de Cesarea á Jerusalem» tres días después de asumir el cargo. En Jerusalén el gobernador usaba el pretorio, y los Evangelios sitúan allí el juicio de Jesús; la mayoría de los estudiosos lo toma por el palacio de Herodes en la colina occidental, donde según Filón Pilato colgó escudos dorados y donde el procurador Floro estableció más tarde su tribunal, aunque la tradición de la Vía Dolorosa lo sitúa en la fortaleza Antonia, junto al Templo. Josefo cuenta cómo Pilato, recién llegado, envió tropas a Jerusalén de noche con estandartes que llevaban la imagen del emperador, y cómo el pueblo permaneció cinco días tendido delante de su casa en Cesarea hasta que cedió."
    - "En 1961 excavadores italianos hallaron en el teatro de Cesarea un bloque de caliza reutilizado con el nombre y el título de Pilato, prefecto de Judea, procedente de un edificio que había dedicado a Tiberio; es la única inscripción en piedra de su época que se conoce que lo nombre, y fija tanto su rango como su ciudad. El palacio de Herodes, con una piscina tallada en la roca del promontorio, fue excavado de los años 1970 a los 1990, y allí se sitúa la residencia de los gobernadores."
  pt:
    - "A sede de Pilatos era Cesareia, na costa, a cidade portuária que Herodes, o Grande, construiu e nomeou em honra de Augusto, a cerca de 87 km a noroeste de Jerusalém em linha reta; o ponto do mapa está em suas ruínas, ao sul de Haifa. A partir de 6 d.C. os governadores romanos da Judeia moravam ali, no palácio de Herodes no promontório, e subiam a Jerusalém nas festas, quando as multidões eram maiores."
    - "Lucas cita “sendo Pôncio Pilatos governador da Judeia” ao lado dos tetrarcas, e Atos mostra seus sucessores em casa em Cesareia: Paulo foi guardado “no palácio de Herodes” ali, e Festo, três dias depois de assumir, “subiu de Cesareia para Jerusalém”. Em Jerusalém o governador usava o pretório, e os Evangelhos situam ali o julgamento de Jesus; a maioria dos estudiosos o toma pelo palácio de Herodes na colina ocidental, onde Fílon diz que Pilatos pendurou escudos dourados e onde o procurador Floro armou depois seu tribunal, embora a tradição da Via Dolorosa o ponha na fortaleza Antônia, junto ao Templo. Josefo conta como Pilatos, recém-chegado, mandou tropas a Jerusalém de noite com estandartes que traziam a imagem do imperador, e como o povo ficou deitado cinco dias diante de sua casa em Cesareia até que ele cedeu."
    - "Em 1961 escavadores italianos acharam no teatro de Cesareia um bloco de calcário reaproveitado com o nome e o título de Pilatos, prefeito da Judeia, de um edifício que dedicara a Tibério; é a única inscrição em pedra do seu tempo que se conhece com seu nome, e fixa seu posto e sua cidade. O palácio de Herodes, com uma piscina talhada na rocha do promontório, foi escavado dos anos 1970 aos 1990, e a residência dos governadores é situada ali."
  de:
    - "Pilatus' Sitz war Caesarea an der Küste, die Hafenstadt, die Herodes der Große erbaut und nach Augustus benannt hatte, in der Luftlinie etwa 87 km nordwestlich von Jerusalem; der Kartenpunkt liegt auf ihren Ruinen südlich von Haifa. Ab 6 n. Chr. wohnten dort die römischen Statthalter Judäas, im Palast des Herodes auf der Landzunge, und kamen zu den Festen, wenn die Menge am größten war, nach Jerusalem hinauf."
    - "Lukas nennt „Pontius Pilatus Landpfleger in Judäa“ neben den Vierfürsten, und die Apostelgeschichte zeigt seine Nachfolger in Caesarea zu Hause: Paulus wurde dort „in dem Richthause des Herodes“ verwahrt, und Festus zog nach seinem Amtsantritt „über drei Tage hinauf von Cäsarea gen Jerusalem“. In Jerusalem benutzte der Statthalter das Prätorium, und die Evangelien legen den Prozess Jesu dorthin; die meisten Gelehrten halten es für den Palast des Herodes auf dem Westhügel, wo nach Philo Pilatus vergoldete Schilde aufhängte und wo der Prokurator Florus später sein Tribunal errichtete, obwohl die Überlieferung der Via Dolorosa es in die Burg Antonia am Tempel verlegt. Josephus erzählt, wie Pilatus, gerade angekommen, nachts Truppen mit Feldzeichen, die das Bild des Kaisers trugen, nach Jerusalem schickte und das Volk fünf Tage vor seinem Haus in Caesarea lag, bis er nachgab."
    - "1961 fanden italienische Ausgräber im Theater von Caesarea einen wiederverwendeten Kalksteinblock mit Pilatus' Namen und Titel, Präfekt von Judäa, von einem Bau, den er dem Tiberius geweiht hatte; es ist die einzige Steininschrift seiner Zeit, die ihn nennt, und sie bestimmt Rang und Stadt. Der Palast des Herodes mit einem in den Fels der Landzunge geschlagenen Becken wurde von den 1970er bis zu den 1990er Jahren ausgegraben, und die Residenz der Statthalter wird dort verortet."
  fr:
    - "Le siège de Pilate était Césarée, sur la côte, la ville portuaire qu’Hérode le Grand avait bâtie et nommée en l’honneur d’Auguste, à environ 87 km au nord-ouest de Jérusalem en ligne droite ; le point de la carte est sur ses ruines, au sud de Haïfa. À partir de 6 apr. J.-C., les gouverneurs romains de Judée y résidèrent, dans le palais d’Hérode sur le promontoire, et montaient à Jérusalem pour les fêtes, quand la foule était la plus nombreuse."
    - "Luc cite parmi les tétrarques « Ponce Pilate … gouverneur de la Judée », et les Actes montrent ses successeurs chez eux à Césarée : Paul y fut gardé « dans le prétoire d’Hérode », et Festus « monta trois jours après de Césarée à Jérusalem ». À Jérusalem, le gouverneur utilisait le prétoire, et les Évangiles y placent le procès de Jésus ; la plupart des savants y voient le palais d’Hérode sur la colline occidentale, où Philon dit que Pilate suspendit des boucliers dorés et où le procurateur Florus dressa plus tard son tribunal, bien que la tradition de la Via Dolorosa le place dans la forteresse Antonia, près du Temple. Josèphe raconte comment Pilate, à peine arrivé, envoya de nuit des troupes à Jérusalem avec des enseignes portant l’image de l’empereur, et comment le peuple resta cinq jours couché devant sa maison de Césarée jusqu’à ce qu’il cède."
    - "En 1961, des fouilleurs italiens trouvèrent dans le théâtre de Césarée un bloc de calcaire réemployé portant le nom et le titre de Pilate, préfet de Judée, tiré d’un édifice qu’il avait dédié à Tibère ; c’est la seule inscription sur pierre de son temps connue qui le nomme, et elle fixe à la fois son rang et sa ville. Le palais d’Hérode, avec un bassin taillé dans le roc du promontoire, fut fouillé des années 1970 aux années 1990, et la résidence des gouverneurs y est placée."
