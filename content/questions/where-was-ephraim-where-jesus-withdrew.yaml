id: where-was-ephraim-where-jesus-withdrew
question:
  en: "Where was Ephraim, the town to which Jesus withdrew before his last Passover?"
  ru: "Где находился Ефраим, куда Иисус удалился перед последней Пасхой?"
  uk: "Де був Ефраїм, місто, до якого Ісус віддалився перед своєю останньою Пасхою?"
  es: "¿Dónde estaba Efraín, la ciudad adonde Jesús se retiró antes de su última Pascua?"
  pt: "Onde ficava Efraim, a cidade para onde Jesus se retirou antes da sua última Páscoa?"
  de: "Wo lag Ephraim, die Stadt, in die sich Jesus vor seinem letzten Passa zurückzog?"
  fr: "Où se trouvait Éphraïm, la ville où Jésus se retira avant sa dernière Pâque ?"
answer:
  en:
    - "John's Ephraim is usually identified with et-Taiyibeh (Taybeh), a hilltop village in the West Bank about 21 km north-north-east of Jerusalem and 7 km north-east of Bethel in a straight line, on the edge of the wilderness that falls away to Jericho, some 17 km to the south-east; the map point stands there. The identification is likely but not proved: it rests on the name, on Eusebius' village Aphra five miles east of Bethel, and on taking John's Ephraim, as Eusebius already did, for the same town as Ephron and Ophrah of Benjamin. Other sites have been proposed, and the Gospel gives no distance."
    - "John tells why Jesus went there. After the raising of Lazarus at Bethany the council resolved to kill him: “Jesus therefore walked no more openly among the Jews; but went thence unto a country near to the wilderness, into a city called Ephraim, and there continued with his disciples.” Taybeh is about 21 km from Bethany, a day's walk, near enough to return and far enough from Jerusalem to be out of the way. The next verse begins the end: “the Jews’ passover was nigh at hand”, and six days before it Jesus came back to Bethany."
    - "The Old Testament knows the place under several spellings: Absalom held his sheep-shearing “in Baal-hazor, which is beside Ephraim”, and Abijah of Judah took from Jeroboam “Beth-el with the towns thereof… and Ephrain”. Josephus says that in AD 69 Vespasian “took Bethel and Ephraim, two small cities” before riding up to Jerusalem. Taybeh is today a Palestinian Christian village, with the ruins of the Byzantine church of St George at its edge."
  ru:
    - "Ефраим из Евангелия от Иоанна обычно отождествляют с Эт-Тайибе (Тайбе) — селением на холме на Западном берегу примерно в 21 км к северо-северо-востоку от Иерусалима и в 7 км к северо-востоку от Вефиля по прямой, на краю пустыни, спускающейся к Иерихону, который лежит примерно в 17 км к юго-востоку; там стоит точка карты. Отождествление вероятно, но не доказано: оно опирается на имя, на селение Афра у Евсевия в пяти милях к востоку от Вефиля и на то, что Ефраим Иоанна, как уже Евсевий, считают тем же городом, что Ефрон и Офра Вениаминова. Предлагались и другие места, а расстояния Евангелие не указывает."
    - "Иоанн объясняет, почему Иисус ушёл туда. После воскрешения Лазаря в Вифании синедрион решил убить Его: «Посему Иисус уже не ходил явно между Иудеями, а пошел оттуда в страну близ пустыни, в город, называемый Ефраим, и там оставался с учениками Своими». Тайбе лежит примерно в 21 км от Вифании — день пути: достаточно близко, чтобы вернуться, и достаточно далеко от Иерусалима, чтобы быть в стороне. Следующий стих начинает развязку: «Приближалась Пасха Иудейская», и за шесть дней до неё Иисус вернулся в Вифанию."
    - "Ветхий Завет знает это место под разными именами: Авессалом устроил стрижку овец «в Ваал-Гацоре, что у Ефрема», а иудейский царь Авия взял у Иеровоама «Вефиль и зависящие от него города… и Ефрон». Иосиф Флавий пишет, что в 69 г. н. э. Веспасиан взял Вефиль и Ефраим, два небольших города, прежде чем подойти к Иерусалиму. Сегодня Тайбе — палестинское христианское селение, на краю которого лежат развалины византийской церкви святого Георгия."
  uk:
    - "Ефраїм, про який говорить Іван, зазвичай ототожнюють з ет-Тайїбою (Тайбе) — селом на пагорбі на Західному березі Йордану, приблизно за 21 км на північний північний схід від Єрусалима і за 7 км на північний схід від Бет-Ела по прямій, на краю пустелі, що спадає до Єрихону, який лежить приблизно за 17 км на південний схід; точка на мапі стоїть саме там. Це ототожнення ймовірне, але не доведене: воно спирається на назву, на Євсевієве село Афра за п'ять миль на схід від Бет-Ела та на те, що Ефраїм у Івана, як уже робив Євсевій, вважають тим самим містом, що Ефрон і Офра Веніяминова. Пропонували й інші місця, а Євангеліє не подає відстані."
    - "Іван розповідає, чому Ісус пішов туди. Після воскресіння Лазаря у Віфанії рада вирішила його вбити: «Ісус же більш не ходив явно по Юдеї, а пійшов звідтіля в землю близько пустинї, у город званий Єфрем, і там пробував із учениками своїми». Тайбе лежить приблизно за 21 км від Віфанії — день ходу, досить близько, щоб повернутися, і досить далеко від Єрусалима, щоб лишатися осторонь. Наступний вірш починає кінець: «Була ж близько пасха Жидівська», а за шість днів до неї Ісус повернувся до Віфанії."
    - "Старий Заповіт знає це місце під кількома написаннями: Авесалом справляв овечі пострижини «в Баал-Газорі, в Ефраїмі», а Авія Юдин забрав у Єровоама «Бетель із залежнїми від його містами, й Ешану та залежні від неї міста, й Ефрон». Йосиф Флавій пише, що 69 р. н. е. Веспасіан «узяв Бет-Ел та Ефраїм, два невеликі міста», перш ніж рушити на Єрусалим. Тайбе нині — палестинське християнське село з руїнами візантійської церкви святого Георгія на краю."
  es:
    - "La Efraín de Juan se identifica por lo común con et-Taiyibeh (Taybeh), una aldea en lo alto de una colina de Cisjordania, a unos 21 km al nornoreste de Jerusalén y a 7 km al noreste de Betel en línea recta, en el borde del desierto que desciende hacia Jericó, a unos 17 km al sureste; el punto del mapa está allí. La identificación es probable pero no está demostrada: se apoya en el nombre, en la aldea Afra de Eusebio, a cinco millas al este de Betel, y en tomar la Efraín de Juan, como ya hacía Eusebio, por la misma ciudad que Efrón y Ofra de Benjamín. Se han propuesto otros lugares, y el Evangelio no da ninguna distancia."
    - "Juan cuenta por qué fue Jesús allí. Tras la resurrección de Lázaro en Betania, el concilio resolvió matarlo: «Jesús ya no andaba manifiestamente entre los Judíos; mas fuése de allí á la tierra que está junto al desierto, á una ciudad que se llama Ephraim: y estábase allí con sus discípulos». Taybeh dista unos 21 km de Betania, una jornada a pie, lo bastante cerca para volver y lo bastante lejos de Jerusalén para quedar apartada. El versículo siguiente abre el desenlace: «la Pascua de los Judíos estaba cerca», y seis días antes de ella Jesús volvió a Betania."
    - "El Antiguo Testamento conoce el lugar con varias grafías: Absalón celebró la esquila de sus ovejas «en Bala-hasor, que está junto á Ephraim», y Abías de Judá tomó a Jeroboam «Beth-el con sus aldeas… y á Ephraim con sus aldeas». Josefo dice que en el 69 d. C. Vespasiano «tomó Betel y Efraín, dos pequeñas ciudades» antes de subir a Jerusalén. Taybeh es hoy una aldea cristiana palestina, con las ruinas de la iglesia bizantina de San Jorge en su linde."
  pt:
    - "A Efraim de João é geralmente identificada com et-Taiyibeh (Taybeh), uma aldeia no alto de uma colina na Cisjordânia, a cerca de 21 km ao nor-nordeste de Jerusalém e 7 km a nordeste de Betel em linha reta, na orla do deserto que desce até Jericó, a uns 17 km a sudeste; o ponto do mapa fica ali. A identificação é provável, mas não provada: apoia-se no nome, na aldeia Afra de Eusébio, a cinco milhas a leste de Betel, e em tomar a Efraim de João, como já fazia Eusébio, pela mesma cidade que Efrom e Ofra de Benjamim. Outros sítios foram propostos, e o Evangelho não dá distância alguma."
    - "João conta por que Jesus foi para lá. Depois da ressurreição de Lázaro em Betânia, o conselho resolveu matá-lo: “Jesus, portanto, já não andava abertamente entre os judeus, mas retirou-se dali para a região próxima ao deserto, para uma cidade chamada Efraim. E ali ficou com os seus discípulos.” Taybeh fica a cerca de 21 km de Betânia, um dia de caminhada, perto o bastante para voltar e longe o bastante de Jerusalém para ficar fora de mão. O versículo seguinte começa o fim: “a Páscoa dos judeus estava próxima”, e seis dias antes dela Jesus voltou a Betânia."
    - "O Antigo Testamento conhece o lugar sob várias grafias: Absalão fez a sua tosquia “em Baal-Hazor, que fica perto de Efraim”, e Abias, de Judá, tomou de Jeroboão “Betel com as suas aldeias… e Efrom com as suas aldeias”. Josefo diz que, no ano 69 d.C., Vespasiano “tomou Betel e Efraim, duas pequenas cidades”, antes de subir a Jerusalém. Taybeh é hoje uma aldeia cristã palestina, com as ruínas da igreja bizantina de São Jorge em sua orla."
  de:
    - "Das Ephraim des Johannes wird meist mit et-Taiyibeh (Taybeh) gleichgesetzt, einem Dorf auf einer Anhöhe im Westjordanland, in der Luftlinie rund 21 km nordnordöstlich von Jerusalem und 7 km nordöstlich von Bethel, am Rand der Wüste, die gegen Jericho, etwa 17 km im Südosten, abfällt; dort steht der Kartenpunkt. Die Gleichsetzung ist wahrscheinlich, aber nicht bewiesen: Sie stützt sich auf den Namen, auf das Dorf Aphra bei Eusebius, fünf Meilen östlich von Bethel, und darauf, das Ephraim des Johannes wie schon Eusebius für dieselbe Stadt wie Efron und das benjaminitische Ofra zu halten. Andere Orte wurden vorgeschlagen, und das Evangelium nennt keine Entfernung."
    - "Johannes sagt, warum Jesus dorthin ging. Nach der Auferweckung des Lazarus in Bethanien beschloss der Rat, ihn zu töten: „Jesus aber wandelte nicht mehr frei unter den Juden, sondern ging von dannen in eine Gegend nahe bei der Wüste, in eine Stadt, genannt Ephrem, und hatte sein Wesen daselbst mit seinen Jüngern.“ Taybeh ist etwa 21 km von Bethanien entfernt, eine Tagesreise zu Fuß: nah genug für die Rückkehr und weit genug von Jerusalem, um abseits zu liegen. Der nächste Vers leitet das Ende ein: „Es war aber nahe das Ostern der Juden“, und sechs Tage davor kam Jesus nach Bethanien zurück."
    - "Das Alte Testament kennt den Ort unter mehreren Schreibweisen: Absalom ließ seine Schafe scheren „zu Baal-Hazor, das bei Ephraim liegt“, und Abija von Juda gewann von Jerobeam „Beth-El mit seinen Ortschaften … und Ephron mit seinen Ortschaften“ ab. Josephus berichtet, Vespasian habe im Jahr 69 n. Chr. „Bethel und Ephraim, zwei kleine Städte“ eingenommen, bevor er nach Jerusalem hinaufzog. Taybeh ist heute ein palästinensisch-christliches Dorf, an dessen Rand die Ruinen der byzantinischen Georgskirche stehen."
  fr:
    - "L’Éphraïm de Jean est le plus souvent identifiée à et-Taiyibeh (Taybeh), village perché de Cisjordanie, à environ 21 km au nord-nord-est de Jérusalem et à 7 km au nord-est de Béthel à vol d’oiseau, en bordure du désert qui descend vers Jéricho, à quelque 17 km au sud-est ; le point de la carte s’y trouve. L’identification est probable, mais non prouvée : elle repose sur le nom, sur le village d’Aphra d’Eusèbe, à cinq milles à l’est de Béthel, et sur le fait de tenir l’Éphraïm de Jean, comme Eusèbe le faisait déjà, pour la même ville qu’Éphron et qu’Ophra de Benjamin. D’autres sites ont été proposés, et l’Évangile ne donne aucune distance."
    - "Jean explique pourquoi Jésus s’y rendit. Après la résurrection de Lazare à Béthanie, le sanhédrin résolut de le faire mourir : « Jésus ne se montra plus ouvertement parmi les Juifs ; mais il se retira dans la contrée voisine du désert, dans une ville appelée Éphraïm ; et là il demeurait avec ses disciples. » Taybeh est à environ 21 km de Béthanie, une journée de marche, assez près pour revenir et assez loin de Jérusalem pour être à l’écart. Le verset suivant commence la fin : « La Pâque des Juifs était proche », et six jours avant elle Jésus revint à Béthanie."
    - "L’Ancien Testament connaît le lieu sous plusieurs graphies : Absalom fit tondre ses brebis « à Baal-Hatsor, près d’Éphraïm », et Abija, roi de Juda, prit à Jéroboam « Béthel et les villes de son ressort… et Éphron et les villes de son ressort ». Flavius Josèphe rapporte qu’en 69 apr. J.-C. Vespasien « prit Béthel et Éphraïm, deux petites villes » avant de monter vers Jérusalem. Taybeh est aujourd’hui un village chrétien palestinien, avec, à sa lisière, les ruines de l’église byzantine de Saint-Georges."
