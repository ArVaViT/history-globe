# Draft question (who they were; "where-were-the-philistine-cities" takes the five sites, and the article "Philistia" the land).
id: who-were-the-philistines
question:
  en: "Who were the Philistines?"
  ru: "Кто такие филистимляне?"
  uk: "Хто були філістимляни?"
  es: "¿Quiénes eran los filisteos?"
  pt: "Quem eram os filisteus?"
  de: "Wer waren die Philister?"
  fr: "Qui étaient les Philistins ?"
  pl: "Kim byli Filistyni?"
  it: "Chi erano i Filistei?"
  cs: "Kdo byli Pelištejci?"
  nl: "Wie waren de Filistijnen?"
  sv: "Vilka var filistéerna?"
  nb: "Hvem var filistrene?"
  tl: "Sino ang mga Filisteo?"
  da: "Hvem var filisterne?"
  sr: "Ко су били Филистеји?"
  hu: "Kik voltak a filiszteusok?"
  fi: "Keitä filistealaiset olivat?"
  vi: "Người Phi-li-tin là ai?"
  ro: "Cine erau filistenii?"
  bg: "Кои са били филистимците?"
answer:
  en:
    - "The Philistines were a people of Aegean origin who settled the southern coastal plain of Canaan about 1175 BC, among the “Sea Peoples” whom Rameses III fought, and ruled five cities there, Gaza, Ashkelon, Ashdod, Ekron and Gath, each under its own lord. For two centuries they were Israel's chief enemy, in the days of Samson, Samuel, Saul and David; then they lived on as small vassal kingdoms of Assyria until Nebuchadnezzar destroyed their cities about 604 BC, after which they vanish as a people. Their name survives in “Palestine”, the Greek name of the whole land."
    - "The Bible brings them from across the sea: the Lord brought up “the Philistines from Caphtor, and the Syrians from Kir” as he brought Israel from Egypt, and Jeremiah calls them “the remnant of the country of Caphtor”, most likely Crete, about 980 km west of Gaza in a straight line; Zephaniah and Ezekiel call them Cherethites, “Cretans”. Egyptian reliefs at Medinet Habu show the Peleset among the sea-borne peoples defeated by Rameses III, and their earliest pottery is a local Mycenaean ware; ancient DNA from infants buried at Ashkelon carries a European-related strain that faded within two centuries. By the seventh century BC their kings wrote in a Canaanite dialect, as the dedication of Achish of Ekron shows. They worshipped Dagon at Ashdod and Gaza, Ashtaroth and Baal-zebub of Ekron, and were “uncircumcised”, a word Israel used of them above all its neighbours."
    - "Genesis already knows Abimelech “king of the Philistines” at Gerar in the days of Abraham and Isaac, centuries before the settlement of the Sea Peoples; most scholars take the name there as a later usage, others suppose earlier Aegean settlers. Israel's wars with them fill Judges and Samuel: “the Philistines had dominion over Israel” for forty years in Samson's time; they took the ark at Ebenezer about 1050 BC and set it before Dagon; “there was no smith found throughout all the land of Israel”; Goliath came out of Gath; Saul died on Gilboa. David, once a vassal of Achish of Gath, “smote the Philistines, and subdued them”. From 734 BC the cities paid tribute to Assyria, and in 604 Nebuchadnezzar burned Ashkelon and deported its people. Herodotus in the fifth century used “Palaistine” for the land, and after the revolt of 132–135 Rome made it the name of the province."
  ru:
    - "Филистимляне — народ эгейского происхождения, поселившийся на южной приморской равнине Ханаана около 1175 г. до н. э. в числе «народов моря», с которыми воевал Рамсес III, и правивший там пятью городами — Газой, Аскалоном, Азотом, Екроном и Гефом, каждым под своим владельцем. Два столетия они были главным врагом Израиля — во дни Самсона, Самуила, Саула и Давида; потом жили малыми вассальными царствами Ассирии, пока Навуходоносор около 604 г. до н. э. не разрушил их города, после чего они исчезают как народ. Их имя живёт в слове «Палестина» — греческом названии всей страны."
    - "Библия выводит их из-за моря: Господь вывел «Филистимлян — из Кафтора, и Арамлян — из Кира», как вывел Израиля из Египта, а Иеремия зовёт их «остаток острова Кафтора» — скорее всего, Крита, примерно в 980 км к западу от Газы по прямой; Софония и Иезекииль называют их Критянами. Египетские рельефы в Мединет-Абу показывают пелесет среди пришедших морем народов, разбитых Рамсесом III, а их древнейшая керамика — местная микенская; древняя ДНК младенцев, погребённых в Аскалоне, несёт европейскую примесь, растаявшую не более чем за два столетия. К VII веку до н. э. их цари писали на ханаанском наречии, как показывает посвящение Ахиша Екронского. Они чтили Дагона в Азоте и Газе, Астарту и Веельзевула Екронского и были «необрезанными» — так Израиль называл их чаще, чем любых других соседей."
    - "В Книге Бытия уже появляется Авимелех, «царь Филистимский», в Гераре во дни Авраама и Исаака — за столетия до поселения народов моря; большинство учёных считают это имя позднейшим словоупотреблением, другие предполагают более ранних эгейских поселенцев. Войны Израиля с ними наполняют книги Судей и Царств: «Филистимляне господствовали над Израилем» сорок лет во времена Самсона; около 1050 г. до н. э. они взяли ковчег при Авен-Езере и поставили его перед Дагоном; «Кузнецов не было во всей земле Израильской»; из Гефа вышел Голиаф; Саул погиб на Гелвуе. Давид, бывший вассал Анхуса Гефского, «поразил Филистимлян и смирил их». С 734 г. до н. э. города платили дань Ассирии, а в 604-м Навуходоносор сжёг Аскалон и увёл его жителей. Геродот в V веке называл страну «Палестиной», а после восстания 132–135 гг. Рим сделал это имя названием провинции."
  uk:
    - "Філістимляни були народом егейського походження, який оселився на південній прибережній рівнині Ханаану близько 1175 р. до н. е., серед «народів моря», з якими воював Рамсес III, і правив там п'ятьма містами — Газою, Ашкелоном, Ашдодом, Екроном і Гатом, кожним під власним володарем. Два століття вони були головним ворогом Ізраїлю, за днів Самсона, Самуїла, Саула й Давида; потім жили далі як малі васальні царства Ассирії, доки Навуходоносор не зруйнував їхні міста близько 604 р. до н. е., після чого вони зникають як народ. Їхня назва зберігається в «Палестині», грецькій назві всієї землі."
    - "Біблія приводить їх з-за моря: Господь вивів «Филистіїв із Кафтору, а Араміїв — із Киру», як вивів Ізраїля з Єгипту, а Єремія називає їх «останок острова Кафтора», найімовірніше Криту, приблизно за 980 км на захід від Гази по прямій; Софонія й Єзекиїл називають їх керетянами, «критянами». Єгипетські рельєфи в Мединет-Абу показують пелесет серед морських народів, розбитих Рамсесом III, а їхня найдавніша кераміка — місцевий мікенський посуд; давня ДНК немовлят, похованих в Ашкелоні, містить споріднену з європейською складову, яка зникла протягом двох століть. До VII ст. до н. е. їхні царі писали ханаанейським діалектом, як показує присвята Анхуса з Екрона. Вони поклонялися Дагону в Ашдоді й Газі, Аштарот і Веельзевулу в Екроні й були «необрізаними» — слово, яким Ізраїль називав їх більше за всіх сусідів."
    - "Книга Буття вже знає Авімелеха, «царя Филистимського», в Герарі за днів Авраама та Ісаака, за століття до оселення народів моря; більшість учених розуміють це як пізніше вживання назви, інші припускають давніших егейських поселенців. Війни Ізраїлю з ними заповнюють Суддів і Самуїла: за часів Самсона «панували Филистії над Ізраїлем» сорок літ; вони взяли ковчег під Авен-Езером близько 1050 р. до н. е. і поставили його перед Дагоном; «Нїодного ж коваля не знайти було у всїй землї Ізраїльській»; Голіят вийшов із Гата; Саул загинув на Гільбоа. Давид, колись васал Анхуса з Гата, «побив Давид Филистіїв і підневолив їх». Від 734 р. до н. е. міста платили данину Ассирії, а 604 р. Навуходоносор спалив Ашкелон і виселив його жителів. Геродот у V ст. вживав «Палайстіне» для краю, а після повстання 132–135 рр. Рим зробив це назвою провінції."
  es:
    - "Los filisteos eran un pueblo de origen egeo que se asentó en la llanura costera meridional de Canaán hacia 1175 a. C., entre los «Pueblos del Mar» a quienes combatió Ramsés III, y gobernó allí cinco ciudades, Gaza, Ascalón, Asdod, Ecrón y Gat, cada una bajo su propio señor. Durante dos siglos fueron el principal enemigo de Israel, en los días de Sansón, Samuel, Saúl y David; luego pervivieron como pequeños reinos vasallos de Asiria hasta que Nabucodonosor destruyó sus ciudades hacia el 604 a. C., tras lo cual desaparecen como pueblo. Su nombre sobrevive en «Palestina», el nombre griego de toda la tierra."
    - "La Biblia los hace venir de ultramar: el Señor hizo subir «á los Palestinos de Caphtor, y de Chîr á los Arameos» como a Israel de Egipto, y Jeremías los llama «el resto de la isla de Caphtor», muy probablemente Creta, a unos 980 km al oeste de Gaza en línea recta; Sofonías y Ezequiel los llaman cereteos, «cretenses». Los relieves egipcios de Medinet Habu muestran a los Peleset entre los pueblos llegados por mar derrotados por Ramsés III, y su cerámica más antigua es vajilla micénica local; el ADN antiguo de bebés enterrados en Ascalón porta un componente afín a Europa que se desvaneció en dos siglos. En el siglo VII a. C. sus reyes escribían en dialecto cananeo, como muestra la dedicatoria de Aquis de Ecrón. Adoraban a Dagón en Asdod y Gaza, a Astarot y a Beelzebú de Ecrón, y eran «incircuncisos», una palabra que Israel les aplicó más que a ningún otro vecino."
    - "El Génesis ya conoce a Abimelec, «rey de los Filisteos», en Gerar en tiempos de Abraham e Isaac, siglos antes del asentamiento de los Pueblos del Mar; la mayoría de los estudiosos toman el nombre allí como uso posterior, otros suponen colonos egeos más antiguos. Sus guerras con Israel llenan Jueces y Samuel: «los Filisteos dominaban sobre Israel» durante cuarenta años en tiempos de Sansón; tomaron el arca en Ebenezer hacia 1050 a. C. y la pusieron ante Dagón; «en toda la tierra de Israel no se hallaba herrero»; Goliat salió de Gat; Saúl murió en Gilboa. David, antes vasallo de Aquis de Gat, «hirió á los Filisteos, y los humilló». Desde 734 a. C. las ciudades pagaron tributo a Asiria, y en 604 Nabucodonosor incendió Ascalón y deportó a su gente. Heródoto, en el siglo V, usó «Palaistine» para la tierra, y tras la revuelta de 132–135 Roma lo hizo nombre de la provincia."
  pt:
    - "Os filisteus eram um povo de origem egeia que se estabeleceu na planície costeira meridional de Canaã por volta de 1175 a.C., entre os “Povos do Mar” que Ramsés III combateu, e ali governaram cinco cidades, Gaza, Ascalom, Asdode, Ecrom e Gate, cada uma sob seu próprio senhor. Por dois séculos foram o principal inimigo de Israel, nos dias de Sansão, Samuel, Saul e Davi; depois sobreviveram como pequenos reinos vassalos da Assíria até que Nabucodonosor destruiu suas cidades por volta de 604 a.C., e então desapareceram como povo. Seu nome sobrevive em “Palestina”, o nome grego de toda a terra."
    - "A Bíblia os traz de além-mar: o SENHOR fez subir “os filisteus de Caftor, e os sírios de Quir” como fez Israel subir do Egito, e Jeremias os chama “o remanescente da ilha de Caftor”, muito provavelmente Creta, a cerca de 980 km a oeste de Gaza em linha reta; Sofonias e Ezequiel os chamam quereteus, “cretenses”. Os relevos egípcios de Medinet Habu mostram os Peleset entre os povos marítimos derrotados por Ramsés III, e sua cerâmica mais antiga é uma cerâmica micênica de fabricação local; o DNA antigo de bebês sepultados em Ascalom traz uma linhagem de parentesco europeu que desapareceu em dois séculos. No século VII a.C., seus reis escreviam num dialeto cananeu, como mostra a dedicatória de Aquis de Ecrom. Adoravam Dagom em Asdode e Gaza, Astarote e Baal-Zebube de Ecrom, e eram “incircuncisos”, palavra que Israel usava deles acima de todos os vizinhos."
    - "O Gênesis já conhece Abimeleque “rei dos filisteus” em Gerar nos dias de Abraão e Isaque, séculos antes do assentamento dos Povos do Mar; a maioria dos estudiosos toma o nome ali como um uso posterior, outros supõem colonos egeus mais antigos. As guerras de Israel com eles enchem Juízes e Samuel: “os filisteus dominavam sobre Israel” por quarenta anos no tempo de Sansão; tomaram a arca em Ebenézer por volta de 1050 a.C. e a puseram diante de Dagom; “não se encontrava nenhum ferreiro em toda a terra de Israel”; Golias saiu de Gate; Saul morreu em Gilboa. Davi, outrora vassalo de Aquis de Gate, “derrotou os filisteus e os subjugou”. Desde 734 a.C. as cidades pagaram tributo à Assíria, e em 604 Nabucodonosor queimou Ascalom e deportou seu povo. Heródoto, no século V, usou “Palaistine” para a terra, e depois da revolta de 132–135 Roma fez dele o nome da província."
  de:
    - "Die Philister waren ein Volk ägäischer Herkunft, das sich um 1175 v. Chr. auf der südlichen Küstenebene Kanaans niederließ, unter den „Seevölkern“, gegen die Ramses III. kämpfte, und dort fünf Städte beherrschte, Gaza, Aschkelon, Aschdod, Ekron und Gat, jede unter einem eigenen Herrn. Zwei Jahrhunderte lang waren sie Israels Hauptfeind, in den Tagen Simsons, Samuels, Sauls und Davids; dann lebten sie als kleine Vasallenkönigreiche Assyriens fort, bis Nebukadnezar ihre Städte um 604 v. Chr. zerstörte, wonach sie als Volk verschwinden. Ihr Name lebt in „Palästina“ fort, dem griechischen Namen des ganzen Landes."
    - "Die Bibel lässt sie über das Meer kommen: der HERR führte „die Philister aus Kaphthor und die Syrer aus Kir“, wie er Israel aus Ägypten führte, und Jeremia nennt sie, „die das übrige sind aus der Insel Kaphthor“, wohl Kreta, etwa 980 km westlich von Gaza; Zefanja und Hesekiel nennen sie Krether (Kreter). Reliefs in Medinet Habu zeigen die Peleset unter den vom Meer gekommenen Völkern, die Ramses III. besiegte; ihre früheste Keramik ist eine örtliche mykenische Ware; alte DNA bestatteter Säuglinge aus Aschkelon trägt eine europäisch verwandte Komponente, die binnen zwei Jahrhunderten verschwand. Im 7. Jahrhundert v. Chr. schrieben ihre Könige kanaanäisch, wie die Weihinschrift des Achis von Ekron zeigt. Sie verehrten Dagon in Aschdod und Gaza, Astarot und Baal-Sebub in Ekron und waren „Unbeschnittene“, ein Wort, das Israel vor allem für sie gebrauchte."
    - "Die Genesis kennt bereits Abimelech, „der Philister König“, in Gerar zur Zeit Abrahams und Isaaks, Jahrhunderte vor den Seevölkern; die meisten sehen darin späteren Sprachgebrauch, andere frühere ägäische Siedler. Israels Kriege mit ihnen füllen Richter und Samuel: „Die Philister aber herrschten zu der Zeit über Israel“, vierzig Jahre in Simsons Zeit; sie nahmen um 1050 v. Chr. bei Eben-Eser die Lade und stellten sie neben Dagon; „Es ward aber kein Schmied im ganzen Lande Israel gefunden“; Goliat kam aus Gat; Saul starb am Gilboa. Von David, einst Vasall des Achis von Gat: „daß David die Philister schlug und schwächte sie“. Ab 734 v. Chr. zahlten die Städte Assyrien Tribut; 604 verbrannte Nebukadnezar Aschkelon und verschleppte seine Bewohner. Herodot nutzte im 5. Jahrhundert „Palaistine“ für das Land, und nach dem Aufstand von 132–135 gab Rom der Provinz den Namen."
  fr:
    - "Les Philistins étaient un peuple d’origine égéenne qui s’établit dans la plaine côtière méridionale de Canaan vers 1175 av. J.-C., parmi les « Peuples de la mer » que combattit Ramsès III, et qui y gouverna cinq villes, Gaza, Askalon, Asdod, Ékron et Gath, chacune sous son propre seigneur. Pendant deux siècles, ils furent le principal ennemi d’Israël, au temps de Samson, de Samuel, de Saül et de David ; puis ils survécurent comme petits royaumes vassaux de l’Assyrie jusqu’à ce que Nebucadnetsar détruise leurs villes vers 604 av. J.-C., après quoi ils disparaissent en tant que peuple. Leur nom survit dans « Palestine », le nom grec de tout le pays."
    - "La Bible les fait venir d’au-delà de la mer : l’Éternel a fait sortir « les Philistins de Caphtor et les Syriens de Kir » comme Israël d’Égypte, et Jérémie les appelle « les restes de l’île de Caphtor », très probablement la Crète, à environ 980 km à l’ouest de Gaza à vol d’oiseau ; Sophonie et Ézéchiel les appellent Kéréthiens, « Crétois ». Des reliefs de Médinet Habou montrent les Peleset parmi les peuples venus par mer et vaincus par Ramsès III, et leur plus ancienne poterie est mycénienne locale ; l’ADN ancien de nourrissons enterrés à Askalon porte une lignée apparentée aux Européens, effacée en deux siècles. Au VIIe siècle av. J.-C., leurs rois écrivaient en dialecte cananéen, tel Akisch d’Ékron dans sa dédicace. Ils adoraient Dagon à Asdod et Gaza, Aschtaroth et Baal-Zebub d’Ékron, et étaient « incirconcis », mot qu’Israël leur appliquait plus qu’à tout voisin."
    - "La Genèse connaît déjà Abimélec, « roi des Philistins », à Guérar au temps d’Abraham et d’Isaac, des siècles avant les Peuples de la mer ; la plupart y voient un emploi tardif du nom, d’autres des colons égéens plus anciens. Leurs guerres avec Israël emplissent Juges et Samuel : « les Philistins dominaient sur Israël » quarante ans au temps de Samson ; ils prirent l’arche à Ében-Ézer vers 1050 av. J.-C. et la placèrent devant Dagon ; « On ne trouvait point de forgeron dans tout le pays d’Israël » ; Goliath sortit de Gath ; Saül mourut sur le Guilboa. David, vassal d’Akisch de Gath, « battit les Philistins et les humilia ». Dès 734 av. J.-C. les villes payèrent tribut à l’Assyrie ; en 604, Nebucadnetsar incendia Askalon et déporta son peuple. Hérodote, au Ve siècle, dit « Palaistinè » pour le pays, et après la révolte de 132-135 Rome en fit le nom de la province."
  pl:
    - "Filistyni byli ludem pochodzenia egejskiego, który osiedlił się na południowej równinie nadmorskiej Kanaanu około 1175 p.n.e., wśród „Ludów Morza”, z którymi walczył Ramzes III, i rządził tam pięcioma miastami, Gazą, Aszkelonem, Aszdodem, Ekronem i Gat, każde pod własnym panem. Przez dwa stulecia byli głównym wrogiem Izraela, w czasach Samsona, Samuela, Saula i Dawida; potem trwali jako małe królestwa wasalne Asyrii, aż Nabuchodonozor zniszczył ich miasta około 604 p.n.e., po czym znikają jako lud. Ich nazwa przetrwała w „Palestynie”, greckiej nazwie całego kraju."
    - "Biblia sprowadza ich zza morza: Pan wyprowadził „Filistyńczyków z Kaftor, i Syryjczyków z Kir”, tak jak wyprowadził Izraela z Egiptu, a Jeremiasz nazywa ich „ostatek wyspy Kaftor”, najpewniej Krety, około 980 km na zachód od Gazy w linii prostej; Sofoniasz i Ezechiel nazywają ich Cheretejczykami, „Kreteńczykami”. Egipskie reliefy w Medinet Habu pokazują Peleset wśród ludów morskich pokonanych przez Ramzesa III, a ich najwcześniejsza ceramika to lokalna ceramika mykeńska; starożytne DNA niemowląt pochowanych w Aszkelonie niesie europejski komponent, który zanikł w ciągu dwóch stuleci. W VII wieku p.n.e. ich królowie pisali dialektem kananejskim, jak pokazuje dedykacja Achisza z Ekronu. Czcili Dagona w Aszdodzie i Gazie, Asztarot i Baal-Zebub z Ekronu, i byli określani słowem „nieobrzezany”, którego Izrael używał o nich bardziej niż o innych sąsiadach."
    - "Księga Rodzaju zna już Abimeleka, „króla Filistyńskiego” w Gerar za czasów Abrahama i Izaaka, wieki przed osiedleniem się Ludów Morza; większość uczonych uważa tę nazwę tam za późniejsze użycie, inni zakładają wcześniejszych osadników egejskich. Wojny Izraela z nimi wypełniają Księgę Sędziów i Samuela: za czasów Samsona „Filistyni panowali nad Izraelem” przez czterdzieści lat; zdobyli arkę pod Eben-Ezer około 1050 p.n.e. i postawili ją przed Dagonem; „kowal nie znajdował się we wszystkiej ziemi Izraelskiej”; Goliat wyszedł z Gat; Saul zginął na Gilboa. Dawid, niegdyś wasal Achisza z Gat, jak czytamy: „poraził Dawid Filistyny, i poniżył je”. Od 734 p.n.e. miasta płaciły daninę Asyrii, a w 604 Nabuchodonozor spalił Aszkelon i deportował jego mieszkańców. Herodot w V wieku używał „Palaistine” dla kraju, a po powstaniu 132–135 Rzym uczynił to nazwą prowincji."
  it:
    - "I Filistei erano un popolo di origine egea che si stabilì nella pianura costiera meridionale di Canaan verso il 1175 a.C., tra i «Popoli del Mare» che Ramses III combatté, e vi governò cinque città, Gaza, Ascalona, Asdod, Ekron e Gat, ciascuna sotto il proprio signore. Per due secoli furono il principale nemico di Israele, ai tempi di Sansone, Samuele, Saul e Davide; poi sopravvissero come piccoli regni vassalli dell’Assiria finché Nabucodonosor distrusse le loro città verso il 604 a.C., dopo di che scompaiono come popolo. Il loro nome sopravvive in «Palestina», il nome greco dell’intero paese."
    - "La Bibbia li fa venire da oltre il mare: il Signore fece salire «i Filistei da Caftor, e i Siri da Kir» come fece salire Israele dall’Egitto, e Geremia li chiama «ciò che resta dell’isola di Caftor», con ogni probabilità Creta, a circa 980 km a ovest di Gaza in linea d’aria; Sofonia ed Ezechiele li chiamano Cheretei, «Cretesi». I rilievi egiziani di Medinet Habu mostrano i Peleset tra i popoli venuti dal mare sconfitti da Ramses III, e la loro ceramica più antica è un prodotto locale miceneo; il DNA antico di neonati sepolti ad Ascalona porta una componente di origine europea che svanì entro due secoli. Nel VII secolo a.C. i loro re scrivevano in un dialetto cananeo, come mostra la dedica di Achis di Ekron. Adoravano Dagon ad Asdod e a Gaza, Astarot e Baal-Zebub di Ekron, ed erano «incirconcisi», una parola che Israele usava per loro più che per tutti i suoi vicini."
    - "La Genesi conosce già Abimelec «re dei Filistei» a Gerar ai tempi di Abramo e Isacco, secoli prima dell’insediamento dei Popoli del Mare; la maggior parte degli studiosi intende il nome come un uso posteriore, altri suppongono precedenti coloni egei. Le guerre di Israele con loro riempiono Giudici e Samuele: per quarant’anni, ai tempi di Sansone, «i Filistei dominavano Israele»; presero l’arca a Eben-Ezer verso il 1050 a.C. e la posero davanti a Dagon; «in tutto il paese d’Israele non si trovava un fabbro»; Golia uscì da Gat; Saul morì sul Gelboe. Davide, un tempo vassallo di Achis di Gat, «sconfisse i Filistei e li umiliò». Dal 734 a.C. le città pagarono tributo all’Assiria, e nel 604 Nabucodonosor bruciò Ascalona e deportò la sua popolazione. Erodoto nel V secolo usò «Palaistine» per il paese, e dopo la rivolta del 132–135 Roma ne fece il nome della provincia."
  cs:
    - "Pelištejci byli lid egejského původu, který se kolem roku 1175 př. n. l. usadil na jižní pobřežní rovině Kanaánu, mezi „mořskými národy“, s nimiž bojoval Ramesse III., a vládl tam pěti městům, Gaze, Aškelonu, Ašdodu, Ekronu a Gatu, každému pod jeho vlastním pánem. Dvě století byli hlavním nepřítelem Izraele, ve dnech Samsona, Samuela, Saula a Davida; pak žili dál jako malá vazalská království Asýrie, dokud Nebukadnesar kolem roku 604 př. n. l. nezničil jejich města, načež jako lid mizí. Jejich jméno přežívá v „Palestině“, řeckém jménu celé země."
    - "Bible je přivádí přes moře: Hospodin vyvedl „Filistinské z Kaftor, a Syrské z Kir“, tak jako Izraele z Egypta, a Jeremjáš je nazývá „ostatek krajiny Kaftor“, nejspíše Kréty, vzdušnou čarou asi 980 km západně od Gazy; Sofonjáš a Ezechiel je nazývají Keretejci, „Kréťané“. Egyptské reliéfy v Medínet Habu ukazují Peleset mezi mořskými národy poraženými Ramessem III. a jejich nejstarší keramika je místní mykénská; starověká DNA z nemluvňat pohřbených v Aškelonu nese evropsky příbuzný znak, který během dvou století zmizel. V 7. století př. n. l. psali jejich králové kananejským nářečím, jak ukazuje věnování Achiše z Ekronu. Uctívali Dágóna v Ašdodu a Gaze, Aštarót a Beelzebuba z Ekronu a byli „neobřezaní“, slovo, jímž Izrael označoval je především ze všech sousedů."
    - "Genesis zná už Abimeleka „krále Filistinského“ v Geraře ve dnech Abrahama a Izáka, staletí před osídlením mořských národů; většina badatelů bere jméno tam jako pozdější užití, jiní předpokládají dřívější egejské osadníky. Izraelské války s nimi vyplňují Soudce a Samuela: „toho času panovali Filistinští nad Izraelem“ po čtyřicet let za Samsona; zajali truhlu u Eben-ezeru kolem roku 1050 př. n. l. a postavili ji před Dágóna; „Kováře pak žádného nenalézalo se ve vší zemi Izraelské“; Goliáš vyšel z Gatu; Saul zemřel na Gilboa. David, kdysi vazal Achiše z Gatu, „porazil… Filistinské, a zemdlil je“. Od roku 734 př. n. l. platila města daň Asýrii a roku 604 Nebukadnesar vypálil Aškelon a odvedl jeho lid. Hérodotos v 5. století užil „Palaistiné“ pro zemi a po povstání v letech 132–135 z toho Řím učinil jméno provincie."
  nl:
    - "De Filistijnen waren een volk van Egeïsche oorsprong dat zich omstreeks 1175 v.Chr. op de zuidelijke kustvlakte van Kanaän vestigde, onder de “Zeevolken” tegen wie Ramses III streed, en vijf steden daar bestuurde, Gaza, Askelon, Asdod, Ekron en Gat, elk onder zijn eigen heer. Twee eeuwen lang waren zij Israëls voornaamste vijand, in de dagen van Simson, Samuël, Saul en David; daarna leefden zij voort als kleine vazalkoninkrijken van Assyrië tot Nebukadnessar hun steden omstreeks 604 v.Chr. verwoestte, waarna zij als volk verdwijnen. Hun naam leeft voort in “Palestina”, de Griekse naam van het hele land."
    - "De Bijbel laat hen over zee komen: de HEER voerde “de Filistijnen uit Kafthor, en de Syriers uit Kir” op zoals Hij Israël uit Egypte voerde, en Jeremia noemt hen “het overblijfsel des eilands van Kafthor”, waarschijnlijk Kreta, hemelsbreed zo'n 980 km ten westen van Gaza; Zefanja en Ezechiël noemen hen Cherethieten, “Kretenzen”. Egyptische reliëfs bij Medinet Habu tonen de Peleset onder de volken van de zee die Ramses III versloeg, en hun vroegste aardewerk is een plaatselijk Myceens ceramiek; oud DNA van baby's begraven bij Askelon draagt een met Europa verwante component die binnen twee eeuwen verdween. In de zevende eeuw v.Chr. schreven hun koningen in een Kanaänitisch dialect, zoals de wijding van Achis van Ekron laat zien. Zij vereerden Dagon in Asdod en Gaza, Astarot en Baäl-Zebub van Ekron, en waren “onbesneden”, een woord dat Israël vooral voor hen gebruikte."
    - "Genesis kent al Abimelech “de koning der Filistijnen” te Gerar in de dagen van Abraham en Isaak, eeuwen vóór de Zeevolken; meestal ziet men dat als later gebruik, soms als teken van eerdere Egeïsche kolonisten. Hun oorlogen met Israël vullen Richteren en Samuël: “de Filistijnen heersten te dier tijd over Israel”, veertig jaar onder Simson; omstreeks 1050 v.Chr. namen zij de ark bij Eben-Haëzer en zetten haar voor Dagon; “er werd geen smid gevonden in het ganse land van Israel”; Goliat kwam uit Gat; Saul stierf op Gilboa. David, eens vazal van Achis van Gat: “het geschiedde daarna, dat David de Filistijnen sloeg, en bracht hen ten onder”. Vanaf 734 v.Chr. betaalden de steden schatting aan Assyrië; in 604 verbrandde Nebukadnessar Askelon en voerde de bevolking weg. Herodotus noemde het land in de vijfde eeuw “Palaistine”, en na de opstand van 132–135 gaf Rome die naam aan de provincie."
  sv:
    - "Filistéerna var ett folk av egeiskt ursprung som bosatte sig på Kanaans södra kustslätt omkring 1175 f.Kr., bland ”havsfolken” som Ramses III bekämpade, och styrde där fem städer, Gaza, Ashkelon, Ashdod, Ekron och Gat, var och en under sin egen herre. I två sekler var de Israels främsta fiende, på Simsons, Samuels, Sauls och Davids tid; därefter levde de vidare som små vasallkungadömen under Assyrien tills Nebukadnessar förstörde deras städer omkring 604 f.Kr., varefter de försvinner som folk. Deras namn lever kvar i ”Palestina”, det grekiska namnet på hela landet."
    - "Bibeln för dem från andra sidan havet: Herren förde upp ”filistéerna ifrån Kaftor och araméerna ifrån Kir” liksom han förde Israel ur Egypten, och Jeremia kallar dem ”kvarlevan från Kaftors ö”, troligen Kreta, omkring 980 km väster om Gaza i fågelvägen; Sefanja och Hesekiel kallar dem keretéer, ”kretensare”. Egyptiska reliefer vid Medinet Habu visar Peleset bland de sjöburna folk som Ramses III besegrade, och deras äldsta keramik är en lokal mykensk ware; forntida DNA från spädbarn begravda i Ashkelon bär en europeiskt besläktad genetisk komponent som bleknade inom två sekler. På 600-talet f.Kr. skrev deras kungar en kananeisk dialekt, som Akish av Ekrons dedikation visar. De dyrkade Dagon i Ashdod och Gaza, Ashtarot och Beelsebul i Ekron, och var ”oomskurna”, ett ord Israel använde om dem framför alla grannar."
    - "Första Moseboken känner redan Avimelek, ”filistéernas konung”, i Gerar på Abrahams och Isaks tid, århundraden före havsfolkens bosättning; de flesta forskare tar namnet där som senare bruk, andra antar tidigare egeiska nybyggare. Israels krig med dem fyller Domarboken och Samuelsböckerna: i Simsons tid ”gav HERREN dem i filistéernas hand, i fyrtio år”; de tog arken vid Even-Haeser omkring 1050 f.Kr. och ställde den bredvid Dagon; ”ingen smed fanns då i hela Israels land”; Goljat kom från Gat; Saul dog på Gilboa. David, en gång vasall åt Akish av Gat, slog ”filistéerna och kuvade dem”. Från 734 f.Kr. betalade städerna tribut till Assyrien, och 604 brände Nebukadnessar Ashkelon och deporterade dess folk. Herodotos använde på 400-talet ”Palaistine” för landet, och efter upproret 132–135 gjorde Rom det till provinsens namn."
  nb:
    - "Filistrene var et folk av egeisk opprinnelse som slo seg ned på Kanaans sørlige kyststrekning omkring 1175 f.Kr., blant «havfolkene» som Ramses III kjempet mot, og de styrte fem byer der, Gasa, Asjkelon, Asjdod, Ekron og Gat, hver under sin egen herre. I to århundrer var de Israels viktigste fiende, på Samsons, Samuels, Sauls og Davids tid; deretter levde de videre som små vasallkongedømmer under Assyria til Nebukadnesar ødela byene deres omkring 604 f.Kr., og etter det forsvinner de som folk. Navnet overlever i «Palestina», det greske navnet på hele landet."
    - "Bibelen lar dem komme fra den andre siden av havet: Herren førte opp «filistrene fra Kaftor og syrerne fra Kir», slik han førte Israel fra Egypt, og Jeremia kaller dem de som «er blitt igjen fra øen Kaftor», sannsynligvis Kreta, omtrent 980 km vest for Gasa i luftlinje; Sefanja og Esekiel kaller dem kreterne, «kreterfolket». Egyptiske relieffer ved Medinet Habu viser Peleset blant de sjøbårne folkene som Ramses III beseiret, og deres tidligste keramikk er en lokal mykensk keramikk; gammelt DNA fra spedbarn gravlagt i Asjkelon bærer en europeisk beslektet arvelinje som bleknet i løpet av to århundrer. På 600-tallet f.Kr. skrev deres konger en kanaaneisk dialekt, slik innvielsesinnskriften til Akisj av Ekron viser. De dyrket Dagon i Asjdod og Gasa, Asjtarot og Baal-Sebub i Ekron, og var «uomskårne», et ord Israel brukte om dem fremfor alle sine naboer."
    - "Første Mosebok kjenner allerede Abimelek, «filistrenes konge», i Gerar på Abrahams og Isaks tid, århundrer før havfolkenes bosetting; de fleste forskere tar navnet der som senere bruk, andre antar tidligere egeiske nybyggere. Israels kriger mot dem fyller Dommerboken og Samuelsbøkene: «på den tid hersket filistrene over Israel» i førti år på Samsons tid; de tok arken ved Eben-Eser omkring 1050 f.Kr. og stilte den ved siden av Dagon; «Dengang fantes det ikke en smed i hele Israels land»; Goliat kom fra Gat; Saul døde på Gilboa. David, en gang vasall av Akisj av Gat, ydmyket dem: «Derefter slo David filistrene og ydmyket dem». Fra 734 f.Kr. betalte byene skatt til Assyria, og i 604 brente Nebukadnesar Asjkelon og deporterte folket. Herodot brukte på 400-tallet f.Kr. «Palaistine» om landet, og etter opprøret i 132–135 gjorde Roma det til provinsens navn."
  tl:
    - "Ang mga Filisteo ay bayang may pinagmulang Aegeo na nanirahan sa katimugang kapatagang baybayin ng Canaan noong mga 1175 BK, kabilang sa “Mga Bayan ng Dagat” na nilabanan ni Rameses III, at namuno roon sa limang lungsod, Gaza, Ascalon, Asdod, Ecron at Gath, bawat isa ay may sariling panginoon. Sa loob ng dalawang siglo sila ang pangunahing kaaway ng Israel, nang panahon nina Samson, Samuel, Saul at David; pagkatapos ay nabuhay silang maliliit na kahariang basalyo ng Asiria hanggang wasakin ni Nabucodonosor ang kanilang mga lungsod noong mga 604 BK, at pagkatapos ay naglaho silang bayan. Nananatili ang pangalan nila sa “Palestina”, ang Griyegong pangalan ng buong lupain."
    - "Dinadala sila ng Biblia mula sa kabila ng dagat: pinaahon ng Panginoon, gaya ng Israel mula sa Egipto, “ang mga Filisteo, ay mula sa Caphtor, at ang mga taga Siria ay sa Chir”, at tinatawag sila ni Jeremias na “ang nalabi sa pulo ng Caphtor”, malamang ang Creta, mga 980 km sa kanluran ng Gaza sa tuwid na guhit; Chereteo, “mga Cretense”, ang tawag nina Zefanias at Ezekiel. Ipinapakita ng relyebe sa Medinet Habu ang Peleset sa mga bayang naglayag na tinalo ni Rameses III, at lokal na Micenico ang pinakamaaga nilang palayok; ang DNA ng mga sanggol sa Ascalon ay may linyang Europeo na naglaho sa dalawang siglo. Noong ika-7 siglo BK, diyalektong Cananeo na ang sulat ng kanilang mga hari, gaya ng handog ni Achis ng Ecron. Sumamba sila kay Dagon sa Asdod at Gaza, kay Astarot at Baal-zebub ng Ecron, at “hindi tuli” ang tawag ng Israel sa kanila higit sa mga kapitbahay."
    - "Sa Genesis, si Abimelech ay “hari ng mga Filisteo” sa Gerar sa panahon nina Abraham at Isaac, mga siglo bago ang mga Bayan ng Dagat; itinuturing ito ng karamihan na kalaunang gamit ng pangalan, ng iba na mas naunang mga Aegeo. Puno ng mga digmaan nila ang Mga Hukom at Samuel: “nagpupuno ang mga Filisteo sa Israel” nang 40 taon kay Samson; kinuha nila ang kaban sa Ebenezer (mga 1050 BK) at itinapat kay Dagon; “Wala ngang panday na masumpungan sa buong lupain ng Israel”; lumabas si Goliath mula sa Gath; namatay si Saul sa Gilboa. Si David, dating basalyo ni Achis: “sinaktan ni David ang mga Filisteo at mga pinasuko”. Mula 734 BK nagbuwis sila sa Asiria, at noong 604 sinunog ni Nabucodonosor ang Ascalon at ipinatapon ang mga tao. Noong ika-5 siglo BK, ginamit ni Herodoto ang “Palaistine” para sa lupain, at matapos ang paghihimagsik ng 132–135 ito ang ipinangalan ng Roma sa lalawigan."
  da:
    - "Filisterne var et folk af ægæisk oprindelse, der omkring 1175 f.Kr. bosatte sig på Kana’ans sydlige kystslette, blandt »havfolkene«, som Ramses 3. kæmpede mod, og herskede dér over fem byer, Gaza, Askalon, Asdod, Ekron og Gat, hver under sin egen fyrste. I to århundreder var de Israels hovedfjende, i Simsons, Samuels, Sauls og Davids dage; derefter levede de videre som små vasalkongeriger under Assyrien, indtil Nebukadnezar ødelagde deres byer omkring 604 f.Kr., hvorefter de forsvinder som folk. Deres navn lever i »Palæstina«, det græske navn for hele landet."
    - "Bibelen lader dem komme fra den anden side af havet: Herren førte »Filisterne fra Kafthor og Syrerne fra Kir« op, som han førte Israel op fra Egypten, og Jeremias kalder dem »de overblevne fra Øen Kafthor«, sandsynligvis Kreta, ca. 980 km vest for Gaza i fugleflugt; Sefanja og Ezekiel kalder dem keretitter, »Kreterne«. Egyptiske relieffer ved Medinet Habu viser Peleset blandt de folk fra havet, som Ramses 3. besejrede, og deres tidligste keramik er en lokal mykensk vare; gammelt DNA fra spædbørn begravet i Askalon bærer en europæisk beslægtet linje, der bleknede inden for to århundreder. I 600-tallet f.Kr. skrev deres konger på en kana’anæisk dialekt, som Akisj af Ekrons dedikation viser. De tilbad Dagon i Asdod og Gaza, Asjtarot og Ba’al-Zebub i Ekron, og var »uomskaarne«, et ord Israel brugte om dem frem for alle sine naboer."
    - "Første Mosebog kender allerede Abimelek, »Filisternes Konge i Gerar« i Abrahams og Isaks dage, århundreder før havfolkenes bosættelse; de fleste forskere tager navnet dér som senere sprogbrug, andre antager tidligere ægæiske bosættere. Israels krige med dem fylder Dommerbogen og Samuelsbøgerne: »Filisterne herskede paa den Tid over Israel« i Simsons tid; de tog arken ved Eben-Ezer omkring 1050 f.Kr. og stillede den foran Dagon; »der blev ingen Smed funden i al Israels Land«; Goliat kom ud af Gat; Saul døde på Gilboa. David, engang vasal af Akisj af Gat, »slog Filisterne og ydmygede dem«. Fra 734 f.Kr. betalte byerne skat til Assyrien, og i 604 brændte Nebukadnezar Askalon og bortførte dets folk. Herodot brugte i 400-tallet f.Kr. »Palaistine« om landet, og efter oprøret i 132-135 gjorde Rom det til provinsens navn."
  sr:
    - "Филистеји су били народ егејског порекла који се око 1175. п. н. е. настанио на јужној приобалној равници Ханана, међу „морским народима“ са којима се борио Рамзес III, и држао ту пет градова: Газу, Ашкелон, Азот, Акарон и Гат, од којих је сваки имао свог господара. Два века били су главни непријатељ Израела, у данима Самсона, Самуила, Саула и Давида; затим су живели као мала вазална краљевства Асирије док Навуходоносор није разорио њихове градове око 604. п. н. е., после чега ишчезавају као народ. Њихово име преживљава у „Палестини“, грчком називу целе земље."
    - "Библија их доводи преко мора: Господ је извео, како Амос каже, „а Филистеје из Кафтора и Сирце из Кира“ као што је извео Израел из Египта, а Јеремија их назива „остатак острва Кафтора“, највероватније Крита, око 980 км западно од Газе ваздушном линијом; Софонија и Језекиљ их зову Херетеји, „Крићани“. Египатски рељефи у Мединет Хабуу приказују Пелесет међу поморским народима које је победио Рамзес III, а њихова најранија керамика је месна микенска грнчарија; древна ДНК одојчади сахрањене у Ашкелону носи европској сродан сој који је ишчезао у року од два века. До седмог века п. н. е. њихови краљеви писали су хананским дијалектом, како показује посвета Ахиса из Акарона. Клањали су се Дагону у Азоту и Гази, Астарот и Велзевулу у Акарону, и били су „необрезани“, реч коју је Израел употребљавао за њих пре свих својих суседа."
    - "Постање већ познаје Авимелеха, цара филистејског, у Герару у данима Аврама и Исака, вековима пре досељавања Морских народа; већина научника узима име тамо као каснију употребу, други претпостављају раније егејске досељенике. Израелови ратови с њима испуњавају Судије и Самуилове књиге: „Филистеји владаху синовима Израиљевим“ четрдесет година у Самсоново доба; заробили су ковчег код Евен-Езера око 1050. п. н. е. и поставили га пред Дагона; „у целој земљи израиљској не беше ковача“; Голијат је изашао из Гата; Саул је погинуо на Гелвуји. О Давиду, некадашњем вазалу Ахиса из Гата, пише: „разби Давид Филистеје, и покори их“. Од 734. п. н. е. градови су плаћали данак Асирији, а 604. Навуходоносор је спалио Ашкелон и депортовао његов народ. Херодот је у петом веку користио „Палаистине“ за земљу, а после устанка 132–135 Рим га је учинио именом провинције."
  hu:
    - "A filiszteusok égei eredetű nép voltak, amely Kr. e. 1175 körül telepedett meg Kánaán déli tengerparti síkságán, a III. Ramszesz által megvívott „tengeri népek” között, és öt várost uralt ott, Gázát, Askelónt, Asdódot, Ekront és Gátot, mindegyiket saját fejedelme alatt. Két évszázadon át Izráel fő ellensége voltak, Sámson, Sámuel, Saul és Dávid napjaiban; azután az asszírok kis hűbéres királyságaiként éltek tovább, míg Nabukodonozor Kr. e. 604 körül lerombolta városaikat, ami után népként eltűnnek. Nevük megmarad a „Palesztina” névben, amely az egész föld görög neve."
    - "A Biblia a tengeren túlról hozza őket: az Úr hozta fel „a Filiszteusokat Kaftorból, és a Siriabelieket Kirből”, ahogy Izráelt Egyiptomból, Jeremiás „a Káftor szigetének maradékát” mondja, valószínűleg Krétát, Gázától légvonalban mintegy 980 km-re nyugatra; Sofóniás és Ezékiel keretieknek nevezi őket, azaz „krétaiaknak”. A medinet habui domborművek a Peleszetet a III. Ramszesz által legyőzött tengeri népek között mutatják, legkorábbi kerámiájuk helyi mükénéi áru; az askelóni csecsemők ókori DNS-ében európai jegy van, amely két évszázadon belül elhalványult. A Kr. e. 7. századra királyaik kánaáni nyelvjárásban írtak, mint az ekroni Ákis felirata mutatja. Dágont imádták Asdódban és Gázában, Astarótot és az ekroni Baál-Zebúbot; szomszédai közül Izráel őket illette leginkább a „körülmetéletlen” jelzővel."
    - "A Mózes első könyve már Ábrahám és Izsák napjaiban ismeri Abiméleket, Gerárban „a Filiszteusok királya”-ként, a tengeri népek letelepedése előtt évszázadokkal; a legtöbb tudós későbbi névhasználatnak véli, mások korábbi égei telepeseket sejtenek. Velük vívott háborúk töltik ki a Bírák és Sámuel könyveit: Sámson idején negyven évig „a Filiszteusok uralkodtak Izráel felett”; Kr. e. 1050 körül Ebenézernél elfoglalták a ládát, Dágon elé tették; „kovácsot egész Izráel földén nem lehetett találni”; Góliát Gátból jött ki; Saul a Gilbóán esett el; Dávidról, Ákis egykori hűbéreséről: „megveré Dávid a Filiszteusokat, és megalázá őket”. Kr. e. 734-től adót fizettek Asszíriának, Kr. e. 604-ben Nabukodonozor felégette Askelónt, népét elhurcolta. Hérodotosz a Kr. e. 5. században a földet „Palaistinének” nevezte, a Kr. u. 132–135-ös felkelés után pedig Róma a provincia nevévé tette."
  fi:
    - "Filistealaiset olivat egeanmerellistä alkuperää oleva kansa, joka asettui Kanaanin eteläiselle rannikkotasangolle noin 1175 eaa. ”merikansojen” joukossa, joita vastaan Ramses III taisteli, ja hallitsi siellä viittä kaupunkia, Gazaa, Askelonia, Asdodia, Ekronia ja Gatia, kukin oman ruhtinaansa alaisena. Kahden vuosisadan ajan he olivat Israelin päävihollinen Simsonin, Samuelin, Saulin ja Daavidin päivinä; sitten he elivät pieninä Assyrian vasallikuningaskuntina, kunnes Nebukadnessar tuhosi heidän kaupunkinsa noin 604 eaa., minkä jälkeen he katoavat kansana. Heidän nimensä säilyy sanassa ”Palestiina”, koko maan kreikkalaisessa nimessä."
    - "Raamattu tuo heidät meren takaa: Herra johdatti ”filistealaisia Kaftorista ja aramilaisia Kiiristä” kuten Israelin Egyptistä, ja Jeremia kutsuu heitä ”tähteenä Kaftorin saarelta tulleista”, todennäköisimmin Kreetalta, noin 980 km Gazasta länteen; Sefanja ja Hesekiel sanovat heitä kreeteiksi, ”kreetalaisiksi”. Medinet Habun reliefit esittävät peleset-kansan Ramses III:n voittamien merikansojen joukossa, ja heidän varhaisin keramiikkansa on paikallista mykeneläistä; Askelonin vauvahautojen muinais-DNA sisältää eurooppalaisperäisen ainesosan, joka hälveni kahdessa vuosisadassa. 600-luvulla eaa. heidän kuninkaansa kirjoittivat kanaanin murretta, kuten Ekronin Akiksen omistuskirjoitus osoittaa. He palvoivat Dagonia Asdodissa ja Gazassa, Astarotia ja Ekronin Baal-Sebubia, ja heitä sanottiin ”ympärileikkaamattomiksi”, mitä sanaa Israel käytti heistä muita naapureita enemmän."
    - "Genesis tuntee jo Abimelekin, ”filistealaisten kuninkaan”, Gerarissa Abrahamin ja Iisakin aikaan, vuosisatoja ennen merikansojen asettumista; useimpien mielestä nimi on myöhempää käyttöä, toiset aiempia egeanmerellisiä asukkaita. Sodat heitä vastaan täyttävät Tuomarien ja Samuelin kirjat: Simsonin aikana ”filistealaiset näet hallitsivat siihen aikaan Israelia” neljäkymmentä vuotta; he ryöstivät arkin Eben-Eserissä noin 1050 eaa. ja panivat sen Dagonin viereen; ”ei yhtään seppää ollut löydettävissä koko Israelin maasta”; Goljat oli Gatista; Saul kuoli Gilboalla. Daavid, Gatin Akiksen entinen vasalli, ”voitti filistealaiset ja nöyryytti heidät”. Vuodesta 734 eaa. ne maksoivat veroa Assyrialle, ja vuonna 604 Nebukadnessar poltti Askelonin ja karkotti asukkaat. Herodotos kutsui maata 400-luvulla eaa. Palaistinēksi, ja kapinan 132–135 jälkeen Rooma antoi sen provinssille."
  vi:
    - "Người Phi-li-tin là một dân gốc Aegean định cư trên đồng bằng ven biển phía nam Ca-na-an khoảng 1175 TCN, trong số các “Dân Biển” mà Ram-se-sơ III giao chiến, và cai trị năm thành ở đó, Ga-xa, Ách-ca-lôn, Ách-đốt, Éc-rôn và Gát, mỗi thành dưới một lãnh chúa riêng. Trong hai thế kỷ họ là kẻ thù chính của Y-sơ-ra-ên, thời Sam-sôn, Sa-mu-ên, Sau-lơ và Đa-vít; rồi họ tồn tại như những vương quốc chư hầu nhỏ của A-si-ri cho đến khi Nê-bu-cát-nết-sa phá hủy các thành của họ khoảng 604 TCN, sau đó họ biến mất như một dân tộc. Tên của họ còn lại trong “Palestine”, tên Hy Lạp của cả xứ."
    - "Kinh Thánh đưa họ từ bên kia biển đến: Chúa đem “người Phi-li-tin khỏi Cáp-tô, và người Sy-ri khỏi Ki-rơ” như đem Y-sơ-ra-ên ra khỏi Ê-díp-tô, và Giê-rê-mi gọi họ là “những kẻ còn sót lại ở cù lao Cáp-tô”, nhiều khả năng là đảo Cơ-rết (Crete), cách Ga-xa khoảng 980 km về phía tây theo đường thẳng; Sô-phô-ni và Ê-xê-chi-ên gọi họ là người Cơ-rết, “người Crete”. Phù điêu Ai Cập ở Medinet Habu cho thấy Peleset trong số các dân đi biển bị Ram-se-sơ III đánh bại, và đồ gốm sớm nhất của họ là đồ Mycenae địa phương; DNA cổ từ các trẻ sơ sinh được chôn ở Ách-ca-lôn mang một dòng liên hệ châu Âu phai mờ trong hai thế kỷ. Đến thế kỷ 7 TCN, vua của họ viết bằng một phương ngữ Ca-na-an, như bản dâng hiến của A-kích ở Éc-rôn cho thấy. Họ thờ Đa-gôn ở Ách-đốt và Ga-xa, Ách-ta-rót và Ba-anh-Xê-bun của Éc-rôn, và bị gọi là “chưa chịu cắt bì”, chữ Y-sơ-ra-ên dùng cho họ hơn mọi láng giềng."
    - "Sách Sáng thế đã biết A-bi-mê-léc, “vua Phi-li-tin, tại Ghê-ra” thời Áp-ra-ham và Y-sác, nhiều thế kỷ trước khi Dân Biển định cư; hầu hết học giả coi tên ở đó là cách dùng về sau, người khác cho rằng có những người Aegean định cư sớm hơn. Các cuộc chiến của Y-sơ-ra-ên với họ chiếm đầy sách Các Quan Xét và Sa-mu-ên: “dân Phi-li-tin quản hạt Y-sơ-ra-ên” bốn mươi năm thời Sam-sôn; họ bắt hòm giao ước tại Ê-bên-Ê-xe khoảng 1050 TCN và đặt trước Đa-gôn; “trong cả xứ Y-sơ-ra-ên không có thợ rèn”; Gô-li-át ra từ Gát; Sau-lơ chết trên Ghinh-bô-a. Đa-vít, từng là chư hầu của A-kích ở Gát, “đánh bại dân Phi-li-tin, bắt phục chúng nó”. Từ năm 734 TCN các thành nộp cống cho A-si-ri, và năm 604 Nê-bu-cát-nết-sa đốt Ách-ca-lôn và đày dân. Herodotus vào thế kỷ 5 TCN dùng “Palaistine” cho xứ, và sau cuộc nổi dậy 132–135, Rô-ma biến nó thành tên của tỉnh."
  ro:
    - "Filistenii erau un popor de origine egeeană care s-a așezat pe câmpia de coastă din sud a Canaanului în jurul anului 1175 î.Hr., printre „Popoarele Mării” cu care s-a luptat Ramses al III-lea, și au stăpânit acolo cinci cetăți, Gaza, Ascalon, Așdod, Ecron și Gat, fiecare sub propriul domn. Timp de două secole au fost principalul dușman al lui Israel, în zilele lui Samson, Samuel, Saul și David; apoi au trăit mai departe ca mici regate vasale ale Asiriei, până când Nebucadnețar le-a distrus cetățile în jurul anului 604 î.Hr., după care dispar ca popor. Numele lor supraviețuiește în „Palestina”, numele grecesc al întregii țări."
    - "Biblia îi aduce de peste mare: Domnul i-a scos pe filisteni din Caftor și pe sirieni din Chir așa cum l-a scos pe Israel din Egipt, iar Ieremia îi numește rămășița țării Caftor, cel mai probabil Creta, la circa 980 km vest de Gaza în linie dreaptă; Țefania și Ezechiel îi numesc cheretiți, „cretani”. Reliefurile de la Medinet Habu îi arată pe Peleset printre popoarele de pe mare înfrânte de Ramses al III-lea, iar cea mai veche ceramică a lor este locală, de tip micenian; ADN-ul antic de la sugari îngropați la Ascalon poartă o linie înrudită cu cea europeană, dispărută în două secole. Încă din secolul al VII-lea î.Hr. regii lor scriau în dialect canaanit, după dedicația lui Achiș din Ecron. Se închinau lui Dagon la Așdod și Gaza, Astarotei și lui Baal-Zebub din Ecron, și erau „netăieți împrejur”, cuvânt folosit de Israel despre ei mai mult decât despre vecini."
    - "Geneza îl știe deja pe „Avimeleh împăratul Filistenilor” la Gherar, în zilele lui Avraam și Isaac, cu secole înainte de așezarea Popoarelor Mării; cei mai mulți iau numele drept o folosire mai târzie, alții presupun coloniști egeeni mai timpurii. Războaiele lui Israel cu ei umplu Judecătorii și Samuel: au stăpânit Israelul patruzeci de ani în vremea lui Samson; au luat chivotul la Eben-Ezer în jurul anului 1050 î.Hr. și l-au pus înaintea lui Dagon; „meșter de fier nu se aflà în tot pământul lui Israil”; Goliat a ieșit din Gat; Saul a murit pe Ghilboa. David, cândva vasal al lui Achiș din Gat, i-a bătut pe filisteni și i-a supus. Din 734 î.Hr. cetățile au plătit tribut Asiriei, iar în 604 Nebucadnețar a ars Ascalonul și i-a deportat locuitorii. Herodot (secolul al V-lea) a folosit „Palaistine” pentru țară, iar după răscoala din 132–135 Roma l-a făcut numele provinciei."
  bg:
    - "Филистимците бяха народ с егейски произход, който се засели в южната крайбрежна равнина на Ханаан около 1175 г. пр.н.е., сред „морските народи“, с които воюва Рамзес III, и управляваше там пет града — Газа, Аскалон, Азот, Екрон и Гет, всеки под собствен владетел. Два века те бяха главният враг на Израил, по времето на Самсон, Самуил, Саул и Давид; после продължиха да съществуват като малки васални царства на Асирия, докато Навуходоносор не разруши градовете им около 604 г. пр.н.е., след което изчезват като народ. Името им живее в „Палестина“ — гръцкото име на цялата земя."
    - "Библията ги довежда отвъд морето: Господ изведе „Филистимците от Кафтор, И Сирианите от Кир“, както изведе Израил от Египет, а Йеремия ги нарича „Остатъка на острова Кафтор“ — най-вероятно Крит, на около 980 км западно от Газа по права линия; Софония и Йезекиил ги наричат херетейци, „критяни“. Релефите в Мединет Хабу показват пелесет сред морските народи, победени от Рамзес III, а най-ранната им керамика е местна микенска; древна ДНК от погребани в Аскалон бебета носи свързана с Европа линия, изчезнала за два века. Към VII в. пр.н.е. царете им пишат на ханаански диалект, както показва посвещението на Анхус от Екрон. Те почитаха Дагон в Азот и Газа, Астарот и Веелзевул от Екрон и бяха „необрязани“ — дума, с която Израил наричаше тях повече от всички съседи."
    - "Битие вече познава Авимелех, „Филистимския цар“ в Герар, по времето на Авраам и Исаак, векове преди заселването на морските народи; повечето учени виждат там по-късна употреба на името, други предполагат по-ранни егейски заселници. Войните с тях изпълват Съдии и Самуил: „Филистимците владееха над Израиля“ четиридесет години по времето на Самсон; те пленяват ковчега при Авен-Езер около 1050 г. пр.н.е. и го поставят пред Дагон; „не се намираше ковач във всичката земя Израилева“; Голиат излиза от Гет; Саул умира на Гелвуя. Давид, някога васал на Анхус от Гет, „порази… Филистимците, и победи ги“. От 734 г. пр.н.е. градовете плащат данък на Асирия, а през 604 г. Навуходоносор изгаря Аскалон и изселва жителите му. Херодот през V в. нарича земята „Палайстине“, а след въстанието от 132–135 г. Рим дава това име на провинцията."
