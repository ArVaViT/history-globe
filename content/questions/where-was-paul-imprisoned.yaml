id: where-was-paul-imprisoned
question:
  en: "Where was Paul imprisoned?"
  ru: "Где Павел был в заключении?"
  uk: "Де був ув'язнений Павло?"
  es: "¿Dónde estuvo preso Pablo?"
  pt: "Onde Paulo esteve preso?"
  de: "Wo war Paulus gefangen?"
  fr: "Où Paul fut-il emprisonné ?"
  pl: "Gdzie uwięziono Pawła?"
  it: "Dove fu imprigionato Paolo?"
  cs: "Kde byl Pavel vězněn?"
  nl: "Waar zat Paulus gevangen?"
  sv: "Var satt Paulus fängslad?"
  nb: "Hvor satt Paulus fengslet?"
  tl: "Saan ibinilanggo si Pablo?"
  da: "Hvor var Paulus fængslet?"
answer:
  en:
    - "Acts names four places: a night in the town prison of Philippi in Macedonia, about AD 49/50; the Roman barracks of the Antonia fortress in Jerusalem after his arrest in 57; two years in Herod's praetorium at Caesarea, 57–59; and two years under guard in a rented house in Rome, about 60–62. The map point stands on Caesarea, where he was held longest, 87 km from Jerusalem in a straight line. Paul himself says he had been “in prisons more frequent” before most of these, so there were others that Acts does not tell, and Second Timothy speaks of a last imprisonment in Rome."
    - "At Philippi the magistrates had Paul and Silas beaten and “cast them into prison”; the jailor “thrust them into the inner prison, and made their feet fast in the stocks”, until at midnight “there was a great earthquake, so that the foundations of the prison were shaken”. In Jerusalem the tribune had him “carried into the castle”, the Antonia at the north-west corner of the Temple Mount, and took him back there when the council nearly tore him apart. Then, under escort of two hundred soldiers, seventy horsemen and two hundred spearmen, he was sent by night to Caesarea, where Felix “commanded him to be kept in Herod's judgment hall”, and “after two years” left him bound for his successor Festus. In Rome “Paul was suffered to dwell by himself with a soldier that kept him”, and “dwelt two whole years in his own hired house”."
    - "Philippi is about 1,415 km from Jerusalem, Caesarea about 2,235 km from Rome. Herod's palace at Caesarea, on the promontory beside the theatre, has been excavated and is usually taken for the praetorium where Paul was held. The letters written “in my bonds”, Philippians, Colossians, Philemon and Ephesians, are traditionally placed in Rome, but many scholars put them in Caesarea or in an imprisonment at Ephesus that Acts does not mention, where Paul says he “fought with beasts”; this is discussed in the question on where Paul wrote his letters. Clement of Rome, about AD 96, says Paul was in chains seven times. The Mamertine prison in the Forum is shown as the place of his last confinement only by a later tradition."
  ru:
    - "Деяния называют четыре места: ночь в городской темнице Филипп в Македонии, около 49/50 г. н. э.; римскую казарму в крепости Антония в Иерусалиме после ареста в 57 г.; два года в Иродовой претории в Кесарии, 57–59 гг.; и два года под стражей в наёмном доме в Риме, около 60–62 гг. Точка карты стоит на Кесарии, где его держали дольше всего, в 87 км от Иерусалима по прямой. Сам Павел пишет, что ещё до большинства этих заключений был «более в темницах», так что были и другие, о которых Деяния не рассказывают, а Второе послание к Тимофею говорит о последнем заключении в Риме."
    - "В Филиппах начальники велели бить Павла и Силу и «ввергли в темницу»; страж «ввергнул их во внутреннюю темницу и ноги их забил в колоду», пока около полуночи не «сделалось великое землетрясение, так что поколебалось основание темницы». В Иерусалиме тысяченачальник «повелел вести его в крепость» — Антонию на северо-западном углу Храмовой горы — и снова взял его туда, когда синедрион едва не растерзал его. Потом под охраной двухсот пеших воинов, семидесяти конных и двухсот стрелков его ночью отправили в Кесарию, где Феликс «повелел ему быть под стражею в Иродовой претории» и «по прошествии двух лет» оставил его в узах преемнику Фесту. В Риме «Павлу позволено жить особо с воином, стерегущим его», и «жил Павел целых два года на своем иждивении»."
    - "Филиппы лежат примерно в 1415 км от Иерусалима, Кесария — в 2235 км от Рима. Дворец Ирода в Кесарии, на мысу рядом с театром, раскопан, и его обычно считают той преторией, где держали Павла. Послания, написанные «в узах», — к Филиппийцам, Колоссянам, Филимону и Ефесянам — по преданию относят к Риму, но многие учёные помещают их в Кесарию или в заключение в Ефесе, о котором Деяния молчат, а Павел пишет, что «боролся со зверями в Ефесе»; об этом — в вопросе о том, где Павел писал свои послания. Климент Римский около 96 г. говорит, что Павел семь раз был в оковах. Мамертинскую тюрьму на Форуме считает местом его последнего заключения лишь позднее предание."
  uk:
    - "Дії називають чотири місця: ніч у міській в'язниці Філіпп у Македонії, близько 49/50 р. н. е.; римські казарми фортеці Антонії в Єрусалимі після арешту 57 р.; два роки в преторії Ірода в Кесарії, 57–59 рр.; і два роки під вартою в найнятому будинку в Римі, близько 60–62 рр. Точка на мапі стоїть на Кесарії, де його тримали найдовше, за 87 км від Єрусалима по прямій. Сам Павло каже, що до більшості цих подій був «у темницях пребагато», тож були й інші, про які Дії не розповідають, а Друге послання до Тимофія говорить про останнє ув'язнення в Римі."
    - "У Філіппах владці звеліли побити Павла і Силу й «повкидали в темницю»; темничник «повкидав їх у саму середню темницю і позабивав ноги їх у колоду», аж поки опівночі «став ся великий трус, так що аж підвалини в вязницї захитались». В Єрусалимі тисячник звелів «вести його в замок» — Антонію на північно-західному розі Храмової гори, — і повів його туди знову, коли рада ледь не розірвала його. Потім під охороною двохсот воїнів, сімдесяти вершників і двохсот списників його вночі відправили до Кесарії, де Феликс «звелїв стерегти його в преториї Іродовій» і, «Як же скінчилось два роки», залишив його закованим для свого наступника Феста. У Римі «Павлу ж дозволено жити окроме з воїном, що стеріг його», і «Пробував же Павел цїлих два роки в найнятій хатї своїй»."
    - "Філіппи лежать приблизно за 1415 км від Єрусалима, Кесарія — приблизно за 2235 км від Рима. Палац Ірода в Кесарії, на мисі біля театру, розкопано, і його зазвичай вважають преторією, де тримали Павла. Листи, написані «у вязницї моїй» — до філіппійців, колосян, Филимона й ефесян, — традиційно відносять до Рима, але багато вчених відносять їх до Кесарії або до ув'язнення в Ефесі, про яке Дії не згадують, де Павло каже, що «боров ся з зьвірями»; це обговорено в питанні про те, де Павло писав свої листи. Климент Римський близько 96 р. н. е. каже, що Павло був у кайданах сім разів. Мамертинську в'язницю на Форумі показують як місце його останнього ув'язнення лише за пізнішим переказом."
  es:
    - "Los Hechos nombran cuatro lugares: una noche en la cárcel de la ciudad de Filipos, en Macedonia, hacia el 49/50 d. C.; el cuartel romano de la fortaleza Antonia, en Jerusalén, tras su arresto en el 57; dos años en el pretorio de Herodes en Cesarea, 57–59; y dos años bajo custodia en una casa alquilada en Roma, hacia 60–62. El punto del mapa está en Cesarea, donde estuvo más tiempo, a 87 km de Jerusalén en línea recta. El propio Pablo dice que, antes de la mayoría de estos, había estado «en cárceles más», de modo que hubo otras que los Hechos no cuentan, y la segunda carta a Timoteo habla de un último encarcelamiento en Roma."
    - "En Filipos los magistrados mandaron azotar a Pablo y a Silas y «los echaron en la cárcel»; el carcelero «los metió en la cárcel de más adentro; y les apretó los pies en el cepo», hasta que a medianoche «fué hecho de repente un gran terremoto, de tal manera que los cimientos de la cárcel se movían». En Jerusalén el tribuno lo hizo «llevar á la fortaleza», la Antonia, en la esquina noroeste del Monte del Templo, y lo devolvió allí cuando el concilio casi lo despedazó. Después, con una escolta de doscientos soldados, setenta jinetes y doscientos lanceros, fue enviado de noche a Cesarea, donde Félix «mandó que le guardasen en el pretorio de Herodes», y «al cabo de dos años» lo dejó preso para su sucesor Festo. En Roma, «á Pablo fué permitido estar por sí, con un soldado que le guardase», y «quedó dos años enteros en su casa de alquiler»."
    - "Filipos está a unos 1415 km de Jerusalén, y Cesarea a unos 2235 km de Roma. El palacio de Herodes en Cesarea, en el promontorio junto al teatro, ha sido excavado y por lo común se toma por el pretorio donde estuvo preso Pablo. Las cartas escritas en prisión, Filipenses, Colosenses, Filemón y Efesios, se sitúan tradicionalmente en Roma, pero muchos estudiosos las ponen en Cesarea o en un encarcelamiento en Éfeso que los Hechos no mencionan, donde Pablo dice: «batallé en Efeso contra las bestias»; esto se trata en la pregunta sobre dónde escribió Pablo sus cartas. Clemente de Roma, hacia el 96 d. C., dice que Pablo estuvo en cadenas siete veces. La cárcel Mamertina, en el Foro, se muestra como lugar de su último encierro solo por una tradición posterior."
  pt:
    - "Atos nomeia quatro lugares: uma noite na prisão da cidade de Filipos, na Macedônia, por volta de 49/50 d.C.; o quartel romano da fortaleza Antônia em Jerusalém, depois da sua prisão em 57; dois anos no pretório de Herodes em Cesareia, 57–59; e dois anos sob guarda numa casa alugada em Roma, por volta de 60–62. O ponto do mapa fica em Cesareia, onde ele ficou mais tempo, a 87 km de Jerusalém em linha reta. O próprio Paulo diz que esteve “em prisões, muito mais” antes da maioria delas, de modo que houve outras que Atos não conta, e 2 Timóteo fala de uma última prisão em Roma."
    - "Em Filipos, os magistrados mandaram açoitar Paulo e Silas e “lançaram-nos na prisão”; o carcereiro “os lançou no cárcere interior e prendeu os pés deles no tronco”, até que à meia-noite “houve um grande terremoto, de modo que os alicerces da prisão foram abalados”. Em Jerusalém, o tribuno mandou que fosse “levado para a fortaleza”, a Antônia, no canto noroeste do monte do Templo, e o levou de volta para lá quando o conselho quase o despedaçou. Depois, sob escolta de duzentos soldados, setenta cavaleiros e duzentos lanceiros, foi enviado de noite a Cesareia, onde Félix “ordenou que ele fosse guardado no palácio de Herodes” e, “passados dois anos”, deixou-o preso para o seu sucessor Festo. Em Roma, “Paulo recebeu permissão para morar por conta própria, com o soldado que o guardava”, e “permaneceu dois anos inteiros em sua própria casa alugada”."
    - "Filipos fica a cerca de 1.415 km de Jerusalém, e Cesareia a cerca de 2.235 km de Roma. O palácio de Herodes em Cesareia, no promontório junto ao teatro, foi escavado e costuma ser tomado pelo pretório onde Paulo ficou. As cartas escritas na prisão, Filipenses, Colossenses, Filemom e Efésios, são tradicionalmente situadas em Roma, mas muitos estudiosos as põem em Cesareia ou numa prisão em Éfeso que Atos não menciona, onde Paulo diz que “lutei com feras”; isso é discutido na pergunta sobre onde Paulo escreveu suas cartas. Clemente de Roma, por volta de 96 d.C., diz que Paulo esteve acorrentado sete vezes. A prisão Mamertina, no Fórum, é mostrada como o lugar da sua última detenção apenas por uma tradição posterior."
  de:
    - "Die Apostelgeschichte nennt vier Orte: eine Nacht im Stadtgefängnis von Philippi in Mazedonien, um 49/50 n. Chr.; die Kaserne der Burg Antonia in Jerusalem nach seiner Verhaftung im Jahr 57; zwei Jahre im Prätorium des Herodes in Caesarea, 57–59; und zwei Jahre unter Bewachung in einem gemieteten Haus in Rom, um 60–62. Der Kartenpunkt steht auf Caesarea, wo er am längsten festgehalten wurde, in der Luftlinie 87 km von Jerusalem. Paulus sagt selbst, er sei vor den meisten schon „öfter gefangen“ gewesen, es gab also weitere, die die Apostelgeschichte nicht erzählt, und der Zweite Timotheusbrief spricht von einer letzten Haft in Rom."
    - "In Philippi ließen die Stadtoberen Paulus und Silas auspeitschen und „warfen sie sie ins Gefängnis“; der Kerkermeister „warf sie in das innerste Gefängnis und legte ihre Füße in den Stock“, bis um Mitternacht „ward ein großes Erdbeben, also daß sich bewegten die Grundfesten des Gefängnisses“. In Jerusalem ließ der Oberst ihn „in das Lager führen“, die Antonia an der Nordwestecke des Tempelbergs, und dorthin zurück, als der Rat ihn beinahe zerriss. Dann wurde er unter Geleit von zweihundert Soldaten, siebzig Reitern und zweihundert Schützen nachts nach Caesarea geschickt, wo es von Felix heißt, er „hieß ihn verwahren in dem Richthause des Herodes“; als „zwei Jahre um waren“, ließ er ihn gebunden seinem Nachfolger Festus. In Rom: „Paulus ward erlaubt zu bleiben, wo er wollte, mit einem Kriegsknechte, der ihn hütete“, und er „blieb zwei Jahre in seinem eigenen Gedinge“."
    - "Philippi ist etwa 1415 km von Jerusalem entfernt, Caesarea etwa 2235 km von Rom. Der Palast des Herodes in Caesarea auf der Landzunge neben dem Theater ist ausgegraben und gilt meist als das Prätorium, in dem Paulus festgehalten wurde. Die Briefe, die „in diesem meinem Gefängnis“ geschrieben wurden, Philipper, Kolosser, Philemon und Epheser, werden traditionell nach Rom gesetzt, doch viele Forscher verlegen sie nach Caesarea oder in eine Haft in Ephesus, die die Apostelgeschichte nicht erwähnt und in der Paulus „mit wilden Tieren gefochten“ zu haben sagt; das wird in der Frage behandelt, wo Paulus seine Briefe schrieb. Clemens von Rom sagt um 96 n. Chr., Paulus sei siebenmal in Ketten gewesen. Der Mamertinische Kerker im Forum wird erst durch eine spätere Überlieferung als Ort seiner letzten Haft gezeigt."
  fr:
    - "Les Actes nomment quatre lieux : une nuit dans la prison de la ville de Philippes, en Macédoine, vers 49-50 apr. J.-C. ; la caserne romaine de la forteresse Antonia, à Jérusalem, après son arrestation en 57 ; deux ans dans le prétoire d’Hérode à Césarée, 57-59 ; et deux ans sous garde dans une maison louée à Rome, vers 60-62. Le point de la carte se trouve à Césarée, où il fut retenu le plus longtemps, à 87 km de Jérusalem à vol d’oiseau. Paul dit lui-même avoir été éprouvé, avant la plupart de ces épisodes, « par les emprisonnements, bien plus », de sorte qu’il y en eut d’autres que les Actes ne racontent pas, et la seconde épître à Timothée parle d’une dernière captivité à Rome."
    - "À Philippes, les magistrats firent battre Paul et Silas, qu’ils « jetèrent en prison » ; le geôlier « les jeta dans la prison intérieure, et leur mit les ceps aux pieds », puis à minuit, « il se fit un grand tremblement de terre, en sorte que les fondements de la prison furent ébranlés ». À Jérusalem, le tribun « ordonna de le mener dans la forteresse », l’Antonia, au nord-ouest du mont du Temple, et l’y ramena quand le sanhédrin faillit le déchirer. Escorté de « deux cents soldats, soixante-dix cavaliers et deux cents archers », il fut envoyé de nuit à Césarée, où Félix « ordonna qu’on le gardât dans le prétoire d’Hérode » ; « Deux ans s’écoulèrent ainsi », et Félix, remplacé par Festus, laissa Paul en prison. À Rome, « on permit à Paul de demeurer en son particulier, avec un soldat qui le gardait » : il « demeura deux ans entiers dans une maison qu’il avait louée »."
    - "Philippes est à environ 1 415 km de Jérusalem, Césarée à environ 2 235 km de Rome. Le palais d’Hérode à Césarée, sur le promontoire à côté du théâtre, a été fouillé et est généralement tenu pour le prétoire où Paul fut détenu. Les lettres écrites « dans les liens », Philippiens, Colossiens, Philémon et Éphésiens, sont traditionnellement placées à Rome, mais beaucoup de spécialistes les situent à Césarée ou pendant une captivité à Éphèse que les Actes ne mentionnent pas, où Paul dit avoir « combattu contre les bêtes à Éphèse » ; la question sur le lieu où Paul écrivit ses lettres en traite. Clément de Rome, vers 96 apr. J.-C., dit que Paul fut sept fois dans les chaînes. La prison Mamertine, au Forum, n’est montrée comme lieu de sa dernière détention que par une tradition plus tardive."
  pl:
    - "Dzieje wymieniają cztery miejsca: noc w miejskim więzieniu w Filippi w Macedonii, około 49/50 n.e.; rzymskie koszary twierdzy Antonia w Jerozolimie po jego aresztowaniu w 57; dwa lata w pretorium Heroda w Cezarei, 57–59; i dwa lata pod strażą w wynajętym domu w Rzymie, około 60–62. Punkt na mapie stoi w Cezarei, gdzie przetrzymywano go najdłużej, 87 km od Jerozolimy w linii prostej. Sam Paweł mówi, że był „w więzieniach obficiej” przed większością z nich, więc były inne, o których Dzieje nie mówią, a Drugi List do Tymoteusza wspomina ostatnie uwięzienie w Rzymie."
    - "W Filippi urzędnicy kazali Pawła i Sylasa wychłostać i „wrzucili je do więzienia”; strażnik „wsadził je do najgłębszego więzienia, a nogi ich zamknął w kłodę”, aż o północy „powstało z prędka wielkie trzęsienie ziemi, że się poruszyły grunty więzienia”. W Jerozolimie trybun kazał go „wieść do obozu”, czyli do Antonii na północno-zachodnim narożniku Wzgórza Świątynnego, i tam go odprowadził, gdy rada omal go nie rozszarpała. Potem pod eskortą dwustu żołnierzy, siedemdziesięciu jezdnych i dwustu drabantów wysłano go nocą do Cezarei, gdzie Feliks „rozkazał go strzec na ratuszu Herodowym” i „po wyjściu dwóch lat” zostawił go w kajdanach swemu następcy Festusowi. W Rzymie „Pawłowi dopuszczono, mieszkać osobno z żołnierzem, który go strzegł”, a „mieszkał Paweł przez całe dwa lata w najemnej gospodzie swojej”."
    - "Filippi leży około 1415 km od Jerozolimy, Cezarea około 2235 km od Rzymu. Pałac Heroda w Cezarei, na cyplu obok teatru, został odkopany i zwykle uważa się go za pretorium, w którym przetrzymywano Pawła. Listy pisane w kajdanach, List do Filipian, Kolosan, Filemona i Efezjan, tradycyjnie umieszcza się w Rzymie, lecz wielu uczonych umieszcza je w Cezarei albo w uwięzieniu w Efezie, o którym Dzieje nie wspominają i gdzie Paweł mówi, że się „obyczajem ludzkim z bestyjami w Efezie potykał”; omawia to pytanie „Skąd Paweł pisał swoje listy?”. Klemens Rzymski, około 96 n.e., mówi, że Paweł siedem razy był w kajdanach. Więzienie Mamertyńskie na Forum jest pokazywane jako miejsce jego ostatniego uwięzienia tylko przez późniejszą tradycję."
  it:
    - "Gli Atti nominano quattro luoghi: una notte nella prigione cittadina di Filippi in Macedonia, nel 49/50 d.C. circa; la caserma romana della fortezza Antonia a Gerusalemme dopo il suo arresto nel 57; due anni nel pretorio di Erode a Cesarea, 57–59; e due anni sotto custodia in una casa in affitto a Roma, 60–62 circa. Il punto della mappa si trova su Cesarea, dove fu trattenuto più a lungo, a 87 km da Gerusalemme in linea d’aria. Paolo stesso dice di aver sofferto «più di loro per le carcerazioni» prima della maggior parte di queste, così che ve ne furono altre che gli Atti non raccontano, e la seconda lettera a Timoteo parla di un’ultima prigionia a Roma."
    - "A Filippi i magistrati fecero battere Paolo e Sila e «li cacciarono in prigione»; il carceriere «li cacciò nella prigione più interna, e serrò loro i piedi nei ceppi», finché a mezzanotte «si fece un gran terremoto, talché la prigione fu scossa dalle fondamenta». A Gerusalemme il tribuno comandò che fosse «menato nella fortezza», l’Antonia all’angolo nord-occidentale del Monte del Tempio, e ve lo riportò quando il sinedrio stava per farlo a pezzi. Poi, con una scorta di duecento soldati, settanta cavalieri e duecento lancieri, fu mandato di notte a Cesarea, dove Felice «comandò che fosse custodito nel palazzo d’Erode», e «in capo a due anni» lo lasciò prigioniero al suo successore Festo. A Roma «a Paolo fu concesso d’abitar da sé col soldato che lo custodiva», e «dimorò due anni interi in una casa da lui presa a fitto»."
    - "Filippi dista circa 1.415 km da Gerusalemme, Cesarea circa 2.235 km da Roma. Il palazzo di Erode a Cesarea, sul promontorio accanto al teatro, è stato scavato ed è di solito ritenuto il pretorio dove Paolo fu trattenuto. Le lettere scritte «nelle mie catene», Filippesi, Colossesi, Filemone ed Efesini, sono tradizionalmente collocate a Roma, ma molti studiosi le pongono a Cesarea o in una prigionia a Efeso che gli Atti non menzionano, dove Paolo dice di aver «lottato con le fiere ad Efeso»; la questione è discussa nella domanda su dove Paolo scrisse le sue lettere. Clemente Romano, verso il 96 d.C., dice che Paolo fu in catene sette volte. La prigione Mamertina nel Foro è mostrata come luogo della sua ultima detenzione soltanto da una tradizione posteriore."
  cs:
    - "Skutky jmenují čtyři místa: noc v městském vězení ve Filipech v Makedonii, asi 49/50 n. l.; římská kasárna pevnosti Antonia v Jeruzalémě po jeho zatčení roku 57; dva roky v Herodově praetoriu v Cesareji, 57–59; a dva roky pod dohledem v pronajatém domě v Římě, asi 60–62. Bod na mapě stojí na Cesareji, kde byl držen nejdéle, vzdušnou čarou 87 km od Jeruzaléma. Sám Pavel říká, že před většinou z nich byl „v žalářích hojněji“, takže byla i jiná, o nichž Skutky nevypravují, a 2. list Timoteovi mluví o poslední vazbě v Římě."
    - "Ve Filipech nechali soudcové Pavla a Sílu zbít a „vsadili je do žaláře“; žalářník „vsadil je do nejhlubšího žaláře, a nohy jejich sevřel kladou“, až o půlnoci „země třesení stalo se veliké, až se pohnuli gruntové žaláře“. V Jeruzalémě ho velitel nechal „vésti do vojska“, do Antonie na severozápadním rohu Chrámové hory, a vzal ho tam zpět, když ho rada div nerozsápala. Poté byl pod doprovodem dvou set vojáků, sedmdesáti jezdců a dvou set kopiníků poslán v noci do Cesareje, kde Felix „rozkázal ho ostříhati v domě Herodesově“ a „po dvou pak letech“ ho nechal v poutech svému nástupci Festovi. V Římě „Pavlovi dopuštěno, aby sám bydlil s žoldnéřem, kterýž ho ostříhal“, a „trval za celé dvě létě v hospodě své“."
    - "Filipy jsou asi 1 415 km od Jeruzaléma, Cesarea asi 2 235 km od Říma. Herodův palác v Cesareji, na výběžku vedle divadla, byl vykopán a obvykle se pokládá za praetorium, kde byl Pavel držen. Listy psané v poutech, Filipským, Koloským, Filemonovi a Efezským, se tradičně kladou do Říma, ale mnozí badatelé je kladou do Cesareje nebo do vazby v Efezu, o níž Skutky nemluví, kde podle Pavla „bojoval s šelmami v Efezu“; to se probírá v otázce, kde Pavel psal své listy. Klement Římský asi roku 96 n. l. říká, že Pavel byl v poutech sedmkrát. Mamertinské vězení na Foru se jako místo jeho poslední vazby ukazuje až podle pozdější tradice."
  nl:
    - "Handelingen noemt vier plaatsen: een nacht in de stadsgevangenis van Filippi in Macedonië, omstreeks 49/50 n.Chr.; de Romeinse kazerne van de Antonia-vesting in Jeruzalem na zijn arrestatie in 57; twee jaar in het praetorium van Herodes te Caesarea, 57–59; en twee jaar onder bewaking in een gehuurd huis in Rome, omstreeks 60–62. Het punt op de kaart staat op Caesarea, waar hij het langst werd vastgehouden, hemelsbreed 87 km van Jeruzalem. Paulus zelf zegt dat hij vóór de meeste hiervan “in gevangenissen overvloediger” was geweest, dus er waren andere die Handelingen niet vertelt, en 2 Timoteüs spreekt van een laatste gevangenschap in Rome."
    - "In Filippi “wierpen zij hen in de gevangenis”, na de slagen voor Paulus en Silas; de cipier “wierp hen in den binnensten kerker, en verzekerde hun voeten in de stok”, tot middernacht “er geschiedde snellijk een grote aardbeving, alzo dat de fundamenten des kerkers bewogen werden”. In Jeruzalem liet de tribuun hem “in de legerplaats” brengen, de Antonia op de noordwesthoek van de Tempelberg, en bracht hem er terug toen de raad hem bijna verscheurde. Daarna ging hij, begeleid door tweehonderd soldaten, zeventig ruiters en tweehonderd lansiers, 's nachts naar Caesarea, waar Felix hem liet bewaren “in het rechthuis van Herodes”, en “als twee jaren vervuld waren”, hem gebonden achterliet voor zijn opvolger Festus. In Rome “aan Paulus werd toegelaten op zichzelven te wonen met den krijgsknecht, die hem bewaarde”, en bleef “twee gehele jaren in zijn eigen gehuurde woning”."
    - "Filippi ligt ongeveer 1415 km van Jeruzalem, Caesarea ongeveer 2235 km van Rome. Het paleis van Herodes in Caesarea, op de landtong naast het theater, is opgegraven en wordt gewoonlijk aangezien voor het praetorium waar Paulus werd vastgehouden. De brieven die zijn geschreven in “mijn banden”, Filippenzen, Kolossenzen, Filemon en Efeziërs, worden traditioneel in Rome geplaatst, maar veel geleerden plaatsen ze in Caesarea of in een gevangenschap te Efeze die Handelingen niet noemt, waar Paulus zegt dat hij “tegen de beesten gevochten heb te Efeze”; dit wordt besproken in de vraag over waar Paulus zijn brieven schreef. Clemens van Rome zegt omstreeks 96 n.Chr. dat Paulus zeven keer in ketenen was. De Mamertijnse gevangenis op het Forum wordt pas door een latere overlevering aangewezen als de plaats van zijn laatste gevangenschap."
  sv:
    - "Apostlagärningarna nämner fyra platser: en natt i stadsfängelset i Filippi i Makedonien, omkring år 49/50 e.Kr.; den romerska kasernen i Antoniafästningen i Jerusalem efter hans gripande år 57; två år i Herodes’ pretorium i Caesarea, 57–59; och två år under bevakning i ett hyrt hus i Rom, omkring 60–62. Kartpunkten står på Caesarea, där han hölls längst, 87 km från Jerusalem i fågelvägen. Paulus själv säger att han hade ”oftare varit i fängelse” före de flesta av dessa, så det fanns andra som Apostlagärningarna inte berättar, och Andra Timoteusbrevet talar om en sista fängelsevistelse i Rom."
    - "I Filippi lät magistraterna slå Paulus och Silas och ”kastade dem i fängelse”; fångvaktaren ”satte in dem i det innersta fängelserummet och fastgjorde deras fötter i stocken”, tills det vid midnatt ”kom plötsligt en stark jordstöt, så att fängelsets grundvalar skakades”. I Jerusalem lät översten föra honom ”till kasernen”, Antonia vid Tempelbergets nordvästra hörn, och tog honom dit igen när rådet nästan slet honom i stycken. Sedan sändes han under eskort av två hundra krigsmän, sjuttio ryttare och två hundra spjutbärare i natten till Caesarea, där Felix lät ”förvara honom i Herodes’ borg”, och ”när två år voro förlidna” lämnade honom fängslad åt sin efterträdare Festus. I Rom ”tillstaddes det Paulus att bo för sig själv, med den krigsman som skulle bevaka honom”, och ”i två hela år bodde han sedan kvar i en bostad som han själv hade hyrt”."
    - "Filippi ligger omkring 1 415 km från Jerusalem, Caesarea omkring 2 235 km från Rom. Herodes’ palats i Caesarea, på udden bredvid teatern, har grävts ut och anses vanligen vara det pretorium där Paulus hölls. Breven skrivna i bojor, Filipperbrevet, Kolosserbrevet, Filemonbrevet och Efesierbrevet, förläggs traditionellt till Rom, men många forskare förlägger dem till Caesarea eller till en fängelsevistelse i Efesos som Apostlagärningarna inte nämner, där Paulus säger att han ”kämpade mot vilddjuren”; detta diskuteras i frågan om var Paulus skrev sina brev. Clemens av Rom säger omkring år 96 e.Kr. att Paulus satt i bojor sju gånger. Mamertinska fängelset vid Forum visas som platsen för hans sista fängelsevistelse först av en senare tradition."
  nb:
    - "Apostlenes gjerninger nevner fire steder: en natt i byfengselet i Filippi i Makedonia, omkring 49/50 e.Kr.; de romerske brakkene i Antonia-festningen i Jerusalem etter arrestasjonen i 57; to år i Herodes’ pretorium i Cæsarea, 57–59; og to år under bevoktning i et leid hus i Roma, omkring 60–62. Kartpunktet står på Cæsarea, der han ble holdt lengst, 87 km fra Jerusalem i luftlinje. Paulus selv sier at han før de fleste av disse hadde vært «flere ganger i fengsel», så det var andre som Apostlenes gjerninger ikke forteller om, og Andre Timoteusbrev taler om et siste fengsel i Roma."
    - "I Filippi lot magistratene Paulus og Silas piske, og «kastet de dem i fengsel»; da fangevokteren hadde fått budet, «kastet han dem i det innerste fangerum og satte deres føtter fast i stokken», til det ved midnattstid kom «et sterkt jordskjelv, så fengslets grunnvoller rystet». I Jerusalem bød høvedsmannen at han skulle «føres inn i festningen», Antonia i det nordvestre hjørnet av Tempelplassen, og førte ham dit tilbake da rådet nesten rev ham i stykker. Så ble han, under eskorte av to hundre stridsmenn, sytti hestfolk og to hundre skyttere, sendt om natten til Cæsarea, hvor Feliks «bød at han skulde holdes i varetekt i Herodes’ borg», og da «to år var omme», lot han ham bundet etter seg til sin etterfølger Festus. I Roma heter det: «Paulus fikk lov til å bo for sig selv sammen med den stridsmann som holdt vakt over ham», og han «blev da to fulle år i sitt leide herberge»."
    - "Filippi ligger omtrent 1415 km fra Jerusalem, Cæsarea omtrent 2235 km fra Roma. Herodes’ palass i Cæsarea, på odden ved siden av teatret, er gravd ut og regnes vanligvis for pretoriet der Paulus ble holdt. Brevene skrevet «i lenker», Filipperbrevet, Kolosserbrevet, Filemonbrevet og Efeserbrevet, plasseres tradisjonelt i Roma, men mange forskere legger dem til Cæsarea eller til et fengsel i Efesos som Apostlenes gjerninger ikke nevner, der Paulus sier at han «stred med ville dyr»; dette drøftes i spørsmålet om hvor Paulus skrev sine brev. Klemens av Roma, omkring 96 e.Kr., sier at Paulus var i lenker syv ganger. Mamertinerfengselet på Forum vises som stedet for hans siste fangenskap bare av en senere tradisjon."
  tl:
    - "Apat na lugar ang pinangalanan ng Mga Gawa: isang gabi sa bilangguan ng bayan ng Filipos sa Macedonia, mga 49/50 AD; ang kuwartel ng mga Romano sa kutang Antonia sa Jerusalem pagkatapos ng kaniyang pagkaaresto noong 57; dalawang taon sa pretorio ni Herodes sa Cesarea, 57–59; at dalawang taon sa ilalim ng bantay sa isang inuupahang bahay sa Roma, mga 60–62. Nasa Cesarea ang punto sa mapa, kung saan siya pinakamatagal na ikinulong, 87 km mula sa Jerusalem sa tuwid na guhit. Sinasabi mismo ni Pablo, bago ang karamihan sa mga ito: “sa mga bilangguan ay lubhang madalas”, kaya may iba pa na hindi isinalaysay ng Mga Gawa, at binabanggit ng 2 Timoteo ang huling pagkabilanggo sa Roma."
    - "Sa Filipos, ipinahampas ng mga mahistrado sina Pablo at Silas at “ipinasok sila sa bilangguan”; “ipinasok sila sa kalooblooban ng bilangguan, at piniit ang kanilang mga paa sa mga pangawan”, hanggang hatinggabi, “nagkaroon ng isang malakas na lindol… nangagsiuga ang mga patibayan ng bahay-bilangguan”. Sa Jerusalem, “ipinadala siya sa kuta” ng tribuno, ang Antonia sa hilagang-kanlurang sulok ng Bundok ng Templo, at ibinalik doon nang halos mapunit siya ng sanedrin. Sa bantay ng 200 kawal, 70 mangangabayo at 200 may sibat, ipinadala siya sa Cesarea nang gabi, kung saan “ipinagutos na siya'y ingatan sa palasio ni Herodes”, at “nang maganap ang dalawang taon” iniwan siyang nakagapos ni Felix kay Festo. Sa Roma, si Pablo ay “pinahintulutang mamahay na magisa na kasama ng kawal na sa kaniya'y nagbabantay” nang “dalawang taong ganap sa kaniyang tahanang inuupahan”."
    - "Ang Filipos ay mga 1,415 km mula sa Jerusalem, ang Cesarea mga 2,235 km mula sa Roma. Ang palasyo ni Herodes sa Cesarea, sa tangos sa tabi ng teatro, ay nahukay at karaniwang itinuturing na pretorio kung saan siya ikinulong. Ang mga liham na isinulat “sa aking mga tanikala”, ang Mga Taga-Filipos, Mga Taga-Colosas, Filemon at Mga Taga-Efeso, ay tradisyonal na inilalagay sa Roma, ngunit inilalagay ng maraming iskolar ang mga ito sa Cesarea o sa isang pagkabilanggo sa Efeso na hindi binabanggit ng Mga Gawa, kung saan sinasabi ni Pablo na siya ay “nakipagbaka sa Efeso laban sa mga ganid”; tinatalakay ito sa tanong na kung saan isinulat ni Pablo ang kaniyang mga liham. Sinasabi ni Clemente ng Roma, mga 96 AD, na pitong ulit na nakagapos si Pablo. Ang bilangguang Mamertine sa Forum ay ipinakikitang lugar ng huling pagkakakulong niya ng huling tradisyon lamang."
  da:
    - "Apostlenes Gerninger nævner fire steder: en nat i Filippis byfængsel i Makedonien, ca. 49/50 e.Kr.; de romerske kaserner i Antonia-fæstningen i Jerusalem efter hans arrestation i 57; to år i Herodes’ praetorium i Cæsarea, 57-59; og to år under bevogtning i et lejet hus i Rom, ca. 60-62. Kortets punkt står på Cæsarea, hvor han blev holdt længst, 87 km fra Jerusalem i fugleflugt. Paulus selv siger, at han før de fleste af disse havde været »hyppigt i Fængsel«, så der var andre, som Apostlenes Gerninger ikke fortæller om, og Andet Timotheusbrev taler om et sidste fængsel i Rom."
    - "I Filippi lod øvrigheden Paulus og Silas piske, og så »kastede de dem i Fængsel«; fangevogteren »kastede dem i det inderste Fængsel og sluttede deres Fødder i Blokken«, indtil ved midnat »der kom et stort Jordskælv, saa at Fængselets Grundvolde rystede«. I Jerusalem lod tribunen ham »føre ... ind i Borgen«, Antonia i det nordvestlige hjørne af Tempelbjerget, og tog ham tilbage dertil, da rådet nær havde revet ham i stykker. Derefter blev han under eskorte af to hundrede soldater, halvfjerds ryttere og to hundrede spydkastere sendt om natten til Cæsarea, hvor Felix bød, at han skulle »holdes bevogtet i Herodes’s Borg«, og efter to år efterlod han ham i lænker til sin efterfølger Festus. I Rom blev det »tilstedt Paulus at bo for sig selv sammen med den Stridsmand, der bevogtede ham«, og han »blev hele to Aar i sit lejede Herberge«."
    - "Filippi ligger ca. 1.415 km fra Jerusalem, Cæsarea ca. 2.235 km fra Rom. Herodes’ palads i Cæsarea, på forbjerget ved teatret, er udgravet og regnes sædvanligvis for det praetorium, hvor Paulus blev holdt. Brevene skrevet »under mine Lænker«, Filipperbrevet, Kolossenserbrevet, Filemonbrevet og Efeserbrevet, placeres traditionelt i Rom, men mange forskere sætter dem i Cæsarea eller i et fængsel i Efesos, som Apostlenes Gerninger ikke nævner, hvor Paulus siger, at han »har kæmpet med vilde Dyr i Efesus«; dette drøftes i spørgsmålet om, hvor Paulus skrev sine breve. Klemens af Rom siger omkring 96 e.Kr., at Paulus var i lænker syv gange. Mamertinerfængslet på Forum vises kun ifølge en senere tradition som stedet for hans sidste fængsling."
