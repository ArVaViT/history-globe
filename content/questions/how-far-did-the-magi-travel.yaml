id: how-far-did-the-magi-travel
question:
  en: "How far did the Magi travel to Bethlehem?"
  ru: "Какой путь проделали волхвы до Вифлеема?"
  uk: "Як далеко мандрували волхви до Вифлеєму?"
  es: "¿Qué distancia recorrieron los magos hasta Belén?"
  pt: "Que distância percorreram os magos até Belém?"
  de: "Wie weit reisten die Weisen nach Bethlehem?"
  fr: "Quelle distance les mages ont-ils parcourue jusqu’à Bethléem ?"
  pl: "Jak daleką drogę przebyli magowie do Betlejem?"
  it: "Quanta strada fecero i Magi fino a Betlemme?"
  nl: "Hoe ver reisden de wijzen naar Bethlehem?"
  cs: "Jak daleko cestovali mágové do Betléma?"
  sv: "Hur långt reste de vise männen till Betlehem?"
  nb: "Hvor langt reiste magierne til Betlehem?"
  tl: "Gaano kalayo ang nilakbay ng mga Pantas patungong Bethlehem?"
  da: "Hvor langt rejste magierne til Betlehem?"
  sr: "Колико су далеко маги путовали до Витлејема?"
answer:
  en:
    - "Matthew says only that they came “from the east”, so the distance depends on where one starts them. From Babylon, the home of astrology and of a great Jewish community, Bethlehem is about 870 km in a straight line; from Persia, whose priests were called magi, about 1,280 km from Ecbatana and 1,230 km from Susa; from north-western Arabia, Dedan, about 620 km, and from Sheba in the far south of Arabia, where the gold and frankincense came from, about 2,030 km. Caravans could not go straight: from Mesopotamia they followed the Euphrates and turned south through Syria, so the road was longer by a good margin. At a caravan's 30 km a day, Babylon was a month or more away, Persia two; the last leg, Jerusalem to Bethlehem, is 8 km."
    - "Matthew's story: “Now when Jesus was born in Bethlehem of Judaea in the days of Herod the king, behold, there came wise men from the east to Jerusalem, Saying, Where is he that is born King of the Jews? for we have seen his star in the east, and are come to worship him.” From Jerusalem “the star, which they saw in the east, went before them, till it came and stood over where the young child was”; “when they were come into the house, they saw the young child with Mary his mother, and fell down, and worshipped him: and when they had opened their treasures, they presented unto him gifts; gold, and frankincense, and myrrh.” Herod then killed the boys of Bethlehem “from two years old and under, according to the time which he had diligently enquired of the wise men”, which has been read to mean that the star had been seen long before they arrived."
    - "The oldest Christian writers already disagreed. Justin Martyr, in the second century, said the Magi came from Arabia; Tertullian, citing the Psalm's “kings of Sheba and Seba shall offer gifts”, wrote that the East held magi as kings, and with Isaiah's camels bringing “gold and incense” from Sheba this is why they became kings and, from the three gifts, three. Clement of Alexandria and most of the Greek fathers made them Persians, and the mosaic of the Magi in Persian dress over the door of the Church of the Nativity is said to have moved the Persian army to spare the church in 614. Their names, as Gathaspa, Melichior and Bithisarea, first appear in a Latin chronicle of about the eighth century, and their relics have been venerated at Cologne since 1164. The map's year for the birth is about 5 BC; the Magi's visit is not dated more closely."
  ru:
    - "Матфей говорит лишь, что они пришли «с востока», так что расстояние зависит от того, откуда их вести. От Вавилона, родины астрологии и большой иудейской общины, до Вифлеема около 870 км по прямой; от Персии, чьи жрецы звались магами, — около 1280 км от Экбатаны и 1230 км от Суз; от Дедана в северо-западной Аравии — около 620 км, а от Савы на крайнем юге Аравии, откуда шли золото и ладан, — около 2030 км. Караваны не ходили по прямой: из Месопотамии они шли вдоль Евфрата и поворачивали на юг через Сирию, так что дорога была заметно длиннее. При караванных 30 км в день Вавилон отстоял на месяц с лишним, Персия — на два; последний отрезок, от Иерусалима до Вифлеема, — 8 км."
    - "Рассказ Матфея: «Когда же Иисус родился в Вифлееме Иудейском во дни царя Ирода, пришли в Иерусалим волхвы с востока и говорят: где родившийся Царь Иудейский? ибо мы видели звезду Его на востоке и пришли поклониться Ему». От Иерусалима «звезда, которую видели они на востоке, шла перед ними, как наконец пришла и остановилась над местом, где был Младенец»; «войдя в дом, увидели Младенца с Мариею, Матерью Его, и, пав, поклонились Ему; и, открыв сокровища свои, принесли Ему дары: золото, ладан и смирну». Затем Ирод избил младенцев Вифлеема «от двух лет и ниже, по времени, которое выведал от волхвов», — что читают так, будто звезду видели задолго до их прихода."
    - "Древнейшие христианские писатели уже расходились. Иустин Философ во II веке говорил, что волхвы пришли из Аравии; Тертуллиан, приводя слова псалма «цари Аравии и Савы принесут дары», писал, что Восток почитал магов царями, — отсюда, вместе с Исаией о верблюдах, что из Савы «принесут золото и ладан», они и стали царями, а по трём дарам — тремя. Климент Александрийский и большинство греческих отцов считали их персами, а мозаика с волхвами в персидской одежде над входом в храм Рождества, как рассказывают, побудила персидское войско пощадить храм в 614 году. Их имена — в виде Гатаспа, Мелихиор и Битисарея — впервые появляются в латинской хронике примерно VIII века, а их мощи почитают в Кёльне с 1164 года. Год рождения на карте — около 5 г. до н. э.; приход волхвов точнее не датируется."
  uk:
    - "Матвій каже лише, що вони прийшли «зі сходу», тож відстань залежить від того, звідки їх виводити. З Вавилона, батьківщини астрології та великої єврейської громади, до Вифлеєму близько 870 км по прямій; з Персії, чиї священики звалися магами, — близько 1280 км від Екбатани і 1230 км від Сузів; з північно-західної Аравії, Дедану, — близько 620 км, а від Шеви на далекому півдні Аравії, звідки йшли золото й ладан, — близько 2030 км. Каравани не могли йти навпрямець: з Месопотамії вони йшли вздовж Євфрату й повертали на південь через Сирію, тож дорога була значно довшою. За 30 км на день каравана Вавилон лежав за місяць дороги й більше, Персія — за два; останній відтинок, від Єрусалиму до Вифлеєму, становить 8 км."
    - "Розповідь Матвія: «Як же народивсь Ісус у Витлеємі Юдейському за царя Ірода, прийшли мудрцї зі сходу в Єрусалим, говорячи: Де нарождений цар Жидівський? бачили бо ми зорю його на сходї, й прийшли поклонитись йому». З Єрусалиму «зоря, що бачили на сходї, йде поперед них, поки прийшла та й стала зверху, де було хлопятко»; «і, ввійшовши в господу, знайшли хлопятко з Мариєю, матїрю його, й, припавши, поклонились йому; й, відкривши скарби свої, піднесли йому дари: золото, ладан і миро». Тоді Ірод повбивав усіх дітей Вифлеєму «од двох років і меньше, по тому часу, що про него він пильно довідував ся в мудрцїв», що прочитували так, ніби зорю бачили задовго до їхнього приходу."
    - "Найдавніші християнські письменники вже не погоджувалися. Юстин Мученик у II ст. казав, що волхви прийшли з Аравії; Тертуліан, посилаючись на слова Псалма «заплатять данину царі Шеви і Севи», писав, що Схід мав магів за царів, і саме через це, разом з Ісаїними верблюдами, що привозять із Шеви «золото й ладан», вони стали царями, а з трьох дарів — трьома. Климент Александрійський і більшість грецьких отців робили їх персами, і мозаїка з волхвами в перському вбранні над дверима церкви Різдва, як кажуть, схилила перське військо пощадити церкву 614 року. Їхні імена, Гатаспа, Мелхіор і Бітісарея, вперше з'являються в латинській хроніці приблизно VIII ст., а мощі їхні шанують у Кельні з 1164 року. Рік народження на мапі — близько 5 р. до н. е.; візит волхвів точніше не датовано."
  es:
    - "Mateo dice solo que vinieron «del oriente», de modo que la distancia depende de dónde se los haga partir. Desde Babilonia, patria de la astrología y de una gran comunidad judía, Belén está a unos 870 km en línea recta; desde Persia, cuyos sacerdotes se llamaban magos, a unos 1280 km desde Ecbatana y 1230 km desde Susa; desde el noroeste de Arabia, Dedán, a unos 620 km, y desde Seba, en el extremo sur de Arabia, de donde venían el oro y el incienso, a unos 2030 km. Las caravanas no podían ir en línea recta: desde Mesopotamia seguían el Éufrates y giraban al sur por Siria, de modo que el camino era bastante más largo. A los 30 km diarios de una caravana, Babilonia estaba a un mes o más, Persia a dos; el último tramo, de Jerusalén a Belén, mide 8 km."
    - "El relato de Mateo: «Y como fué nacido Jesús en Bethlehem de Judea en días del rey Herodes, he aquí unos magos vinieron del oriente á Jerusalem, diciendo: ¿Dónde está el Rey de los Judíos, que ha nacido? porque su estrella hemos visto en el oriente, y venimos á adorarle». Desde Jerusalén, «la estrella que habían visto en el oriente, iba delante de ellos, hasta que llegando, se puso sobre donde estaba el niño»; «entrando en la casa, vieron al niño con su madre María, y postrándose, le adoraron; y abriendo sus tesoros, le ofrecieron dones, oro é incienso y mirra». Herodes mató luego a los niños de Belén «de edad de dos años abajo, conforme al tiempo que había entendido de los magos», lo que se ha leído en el sentido de que la estrella había sido vista mucho antes de su llegada."
    - "Los primeros escritores cristianos ya discrepaban. Justino Mártir, en el siglo II, dijo que los magos venían de Arabia; Tertuliano, citando el salmo, «los reyes de Sheba y de Seba ofrecerán dones», escribió que el Oriente tenía magos por reyes, y con los camellos de Isaías que traen «oro é incienso» desde Seba, así llegaron a ser reyes y, por los tres dones, tres. Clemente de Alejandría y la mayoría de los padres griegos los hicieron persas, y se dice que el mosaico de los magos con vestido persa sobre la puerta de la iglesia de la Natividad movió a los persas a respetar la iglesia en 614. Sus nombres, como Gathaspa, Melichior y Bithisarea, aparecen por primera vez en una crónica latina de hacia el siglo VIII, y sus reliquias se veneran en Colonia desde 1164. El año del nacimiento en el mapa es hacia el 5 a. C.; la visita de los magos no se fecha con mayor precisión."
  pt:
    - "Mateus diz apenas que vieram “do oriente”, de modo que a distância depende do ponto de partida. De Babilônia, pátria da astrologia e de uma grande comunidade judaica, Belém fica a cerca de 870 km em linha reta; da Pérsia, cujos sacerdotes se chamavam magos, a cerca de 1.280 km de Ecbatana e 1.230 km de Susã; do noroeste da Arábia, Dedã, a cerca de 620 km, e de Sabá, no extremo sul da Arábia, de onde vinham o ouro e o incenso, a cerca de 2.030 km. As caravanas não iam em linha reta: da Mesopotâmia seguiam o Eufrates e dobravam ao sul pela Síria, de modo que o caminho era bem mais longo. A 30 km por dia de caravana, Babilônia ficava a um mês ou mais, a Pérsia a dois; o último trecho, de Jerusalém a Belém, tem 8 km."
    - "A narrativa de Mateus: “Tendo Jesus nascido em Belém da Judeia, nos dias do rei Herodes, eis que magos do oriente chegaram a Jerusalém, dizendo: ‘Onde está aquele que nasceu Rei dos judeus? Pois vimos a sua estrela no oriente e viemos adorá-lo.’” De Jerusalém, “a estrela que tinham visto no oriente ia adiante deles, até que chegou e parou sobre o lugar onde o menino estava”; “entrando na casa, viram o menino com Maria, sua mãe, e, prostrando-se, o adoraram. Abrindo os seus tesouros, ofereceram-lhe presentes: ouro, incenso e mirra”. Herodes mandou então matar os meninos de Belém “de dois anos para baixo, de acordo com o tempo exato sobre o qual havia se informado com os magos”, o que se interpretou como indício de que a estrela fora vista muito antes da chegada deles."
    - "Os mais antigos escritores cristãos já divergiam. Justino Mártir, no século II, dizia que os magos vieram da Arábia; Tertuliano, citando o Salmo, “os reis de Sabá e de Sebá oferecerão presentes”, escreveu que o Oriente tinha os magos por reis, e, com os camelos de Isaías trazendo “ouro e incenso” de Sabá, por isso se tornaram reis e, pelos três presentes, três. Clemente de Alexandria e a maioria dos padres gregos os fizeram persas, e diz-se que o mosaico dos magos em trajes persas sobre a porta da Igreja da Natividade levou o exército persa a poupar a igreja em 614. Seus nomes, Gathaspa, Melichior e Bithisarea, aparecem pela primeira vez numa crônica latina de cerca do século VIII, e suas relíquias são veneradas em Colônia desde 1164. O ano do nascimento no mapa é cerca de 5 a.C.; a visita dos magos não é datada com mais precisão."
  de:
    - "Matthäus sagt nur, sie seien „vom Morgenland“ gekommen, die Entfernung hängt also davon ab, wo man sie aufbrechen lässt. Von Babylon, der Heimat der Astrologie und einer großen jüdischen Gemeinde, sind es nach Bethlehem etwa 870 km Luftlinie; aus Persien, dessen Priester Magier hießen, etwa 1280 km von Ekbatana und 1230 km von Susa; aus Nordwestarabien, Dedan, etwa 620 km, und aus Scheba im äußersten Süden Arabiens, woher das Gold und der Weihrauch kamen, etwa 2030 km. Karawanen konnten nicht geradeaus ziehen: Von Mesopotamien folgten sie dem Euphrat und wandten sich durch Syrien nach Süden, der Weg war also deutlich länger. Bei 30 km am Tag einer Karawane war Babylon einen Monat oder mehr entfernt, Persien zwei; die letzte Etappe, von Jerusalem nach Bethlehem, beträgt 8 km."
    - "Die Geschichte bei Matthäus: „Da Jesus geboren war zu Bethlehem im jüdischen Lande, zur Zeit des Königs Herodes, siehe, da kamen die Weisen vom Morgenland nach Jerusalem und sprachen: Wo ist der neugeborene König der Juden? Wir haben seinen Stern gesehen im Morgenland und sind gekommen, ihn anzubeten.“ Von Jerusalem an: „der Stern, den sie im Morgenland gesehen hatten, ging vor ihnen hin, bis daß er kam und stand oben über, da das Kindlein war“; sie „gingen in das Haus und fanden das Kindlein mit Maria, seiner Mutter, und fielen nieder und beteten es an und taten ihre Schätze auf und schenkten ihm Gold, Weihrauch und Myrrhe.“ Herodes ließ dann die Kinder von Bethlehem töten, „die da zweijährig und darunter waren, nach der Zeit, die er mit Fleiß von den Weisen erlernt hatte“, was man so gedeutet hat, dass der Stern lange vor ihrer Ankunft gesehen worden war."
    - "Schon die frühen Kirchenväter waren uneins. Justin der Märtyrer sagte im 2. Jahrhundert, sie seien aus Arabien gekommen; Tertullian schrieb mit dem Psalm – „die Könige aus Reicharabien und Seba werden Gaben zuführen“ –, der Osten halte Magier für Könige, und mit Jesajas Kamelen, die aus Saba „Gold und Weihrauch bringen“, erkläre das, warum sie Könige und, nach den drei Gaben, drei wurden. Clemens von Alexandria und die meisten griechischen Väter machten sie zu Persern, und das Mosaik der Weisen in persischer Tracht über dem Tor der Geburtskirche soll 614 die Perser zur Schonung der Kirche bewogen haben. Ihre Namen Gathaspa, Melichior und Bithisarea stehen erstmals in einer lateinischen Chronik um das 8. Jahrhundert, ihre Reliquien werden seit 1164 in Köln verehrt. Das Geburtsjahr steht auf der Karte bei etwa 5 v. Chr.; der Besuch der Weisen ist nicht genauer datiert."
  fr:
    - "Matthieu dit seulement qu’ils venaient « d’Orient » ; la distance dépend donc de leur point de départ. De Babylone, patrie de l’astrologie et d’une grande communauté juive, Bethléem est à environ 870 km en ligne droite ; de Perse, dont les prêtres s’appelaient mages, à environ 1 280 km d’Ecbatane et 1 230 km de Suse ; du nord-ouest de l’Arabie, Dedan, à environ 620 km, et de Séba, à l’extrême sud de l’Arabie, d’où venaient l’or et l’encens, à environ 2 030 km. Les caravanes ne pouvaient aller droit : depuis la Mésopotamie, elles suivaient l’Euphrate puis obliquaient vers le sud par la Syrie, et la route était donc nettement plus longue. À 30 km par jour, Babylone était à un mois ou plus, la Perse à deux ; le dernier tronçon, de Jérusalem à Bethléem, est de 8 km."
    - "Récit de Matthieu : « Jésus étant né à Bethléhem en Judée, au temps du roi Hérode, voici des mages d’Orient arrivèrent à Jérusalem, et dirent : Où est le roi des Juifs qui vient de naître ? Car nous avons vu son étoile en Orient, et nous sommes venus pour l’adorer. » De Jérusalem, « l’étoile qu’ils avaient vue en Orient marchait devant eux jusqu’à ce qu’étant arrivée au-dessus du lieu où était le petit enfant, elle s’arrêta » ; « Ils entrèrent dans la maison, virent le petit enfant avec Marie, sa mère, se prosternèrent et l’adorèrent ; ils ouvrirent ensuite leurs trésors, et lui offrirent en présent de l’or, de l’encens et de la myrrhe. » Hérode fit alors tuer les enfants de Bethléem « de deux ans et au-dessous … selon la date dont il s’était soigneusement enquis auprès des mages », ce qu’on a compris ainsi : l’étoile était apparue bien avant leur arrivée."
    - "Les premiers auteurs chrétiens divergeaient. Justin Martyr, au IIe siècle, disait que les mages venaient d’Arabie ; Tertullien, citant le Psaume : « Les rois de Séba et de Saba offriront des présents », écrivit que l’Orient tenait les mages pour des rois ; avec les chameaux d’Ésaïe apportant « de l’or et de l’encens » de Séba, ils devinrent rois et, d’après les trois présents, trois. Clément d’Alexandrie et la plupart des Pères grecs en firent des Perses, et la mosaïque des mages en costume perse au-dessus de la porte de l’église de la Nativité aurait fait épargner celle-ci par l’armée perse en 614. Leurs noms, Gathaspa, Melichior et Bithisarea, apparaissent d’abord dans une chronique latine vers le VIIIe siècle ; leurs reliques sont vénérées à Cologne depuis 1164. La carte date la naissance de 5 av. J.-C. environ ; la visite n’est pas datée plus précisément."
  pl:
    - "Mateusz mówi tylko, że przybyli „ze wschodu słońca”, więc odległość zależy od tego, skąd się ich wyprawi. Z Babilonu, ojczyzny astrologii i wielkiej społeczności żydowskiej, do Betlejem jest około 870 km w linii prostej; z Persji, której kapłanów nazywano magami, około 1280 km z Ekbatany i 1230 km z Suzy; z północno-zachodniej Arabii, z Dedanu, około 620 km, a z Szeby na dalekim południu Arabii, skąd pochodziły złoto i kadzidło, około 2030 km. Karawany nie mogły iść prosto: z Mezopotamii szły wzdłuż Eufratu i skręcały na południe przez Syrię, więc droga była dłuższa o dobry kawał. Przy 30 km dziennie, jakie robiła karawana, do Babilonu było miesiąc drogi lub więcej, do Persji dwa; ostatni odcinek, z Jerozolimy do Betlejem, liczy 8 km."
    - "Opowieść Mateusza: „A gdy się Jezus narodził w Betlehemie Judzkiem za dnia Heroda króla, oto mędrcy ze wschodu słońca przybyli do Jeruzalemu, mówiąc: Gdzież jest ten, który się narodził, król żydowski? Bośmy widzieli gwiazdę jego na wschód słońca, i przyjechaliśmy, abyśmy mu się pokłonili.” Z Jerozolimy „ona gwiazda, którą widzieli na wschód słońca, prowadziła je, aż przyszedłszy, stanęła nad miejscem, gdzie było dzieciątko”; „wszedłszy w dom, znaleźli dzieciątko z Maryją, matką jego, a upadłszy, pokłonili mu się, i otworzywszy skarby swoje, ofiarowali mu dary: złoto i kadzidło i myrrę”. Herod zabił potem chłopców z Betlejem „od dwóch lat i niżej, według czasu, o którym się był pilnie wywiedział od mędrców”, co odczytywano jako znak, że gwiazdę widziano na długo przed ich przybyciem."
    - "Najdawniejsi pisarze chrześcijańscy już się różnili. Justyn Męczennik w II wieku mówił, że magowie przybyli z Arabii; Tertulian, powołując się na psalm: „królowie Sebejscy i Sabejscy upominki oddadzą”, pisał, że Wschód miał magów za królów, a skoro wielbłądy u Izajasza przynoszą z Szeby „złoto i kadzidło”, stąd stali się królami, a od trzech darów — trzema. Klemens Aleksandryjski i większość ojców greckich uczyniła ich Persami, a mozaika z magami w perskich szatach nad drzwiami bazyliki Narodzenia ma według przekazu skłonić perskie wojsko do oszczędzenia kościoła w 614. Ich imiona, Gathaspa, Melichior i Bithisarea, pojawiają się po raz pierwszy w łacińskiej kronice z około VIII wieku, a ich relikwie czczone są w Kolonii od 1164. Rok narodzin na mapie to około 5 p.n.e.; wizyty magów nie datuje się dokładniej."
  it:
    - "Matteo dice soltanto che vennero «d’Oriente», quindi la distanza dipende da dove li si fa partire. Da Babilonia, patria dell’astrologia e di una grande comunità ebraica, Betlemme dista circa 870 km in linea retta; dalla Persia, i cui sacerdoti erano detti magi, circa 1.280 km da Ecbatana e 1.230 km da Susa; dall’Arabia nord-occidentale, Dedan, circa 620 km, e da Saba, nell’estremo sud dell’Arabia, da dove venivano l’oro e l’incenso, circa 2.030 km. Le carovane non potevano andare dritte: dalla Mesopotamia seguivano l’Eufrate e poi volgevano a sud attraverso la Siria, così la strada era più lunga di un buon tratto. A 30 km al giorno di una carovana, Babilonia distava un mese o più, la Persia due; l’ultima tappa, da Gerusalemme a Betlemme, è di 8 km."
    - "Il racconto di Matteo: «Or essendo Gesù nato in Betleem di Giudea, ai dì del re Erode, ecco dei magi d’Oriente arrivarono in Gerusalemme, dicendo: Dov’è il re de’ Giudei che è nato? Poiché noi abbiam veduto la sua stella in Oriente e siam venuti per adorarlo». Da Gerusalemme «la stella che aveano veduta in Oriente, andava dinanzi a loro, finché, giunta al luogo dov’era il fanciullino, vi si fermò sopra»; «entrati nella casa, videro il fanciullino con Maria sua madre; e prostratisi, lo adorarono; ed aperti i loro tesori, gli offrirono dei doni: oro, incenso e mirra». Erode uccise poi i maschi di Betlemme «dall’età di due anni in giù, secondo il tempo del quale s’era esattamente informato dai magi», il che è stato letto nel senso che la stella era stata vista molto prima del loro arrivo."
    - "Già i più antichi scrittori cristiani erano in disaccordo. Giustino Martire, nel II secolo, disse che i Magi venivano dall’Arabia; Tertulliano, citando il Salmo, «i re di Sceba e di Seba gli offriranno doni», scrisse che l’Oriente aveva magi come re, e con i cammelli di Isaia che portano «oro ed incenso» da Saba ciò spiega perché divennero re e, dai tre doni, tre. Clemente Alessandrino e la maggior parte dei Padri greci li fecero Persiani, e si dice che il mosaico dei Magi in abito persiano sopra la porta della chiesa della Natività abbia indotto l’esercito persiano a risparmiarla nel 614. I loro nomi, Gathaspa, Melichior e Bithisarea, compaiono per la prima volta in una cronaca latina dell’VIII secolo circa, e le loro reliquie sono venerate a Colonia dal 1164. L’anno della nascita sulla mappa è circa il 5 a.C.; la visita dei Magi non è datata con maggiore precisione."
  nl:
    - "Mattheüs zegt alleen dat zij kwamen “van het Oosten”, dus de afstand hangt ervan af waar men hen laat beginnen. Vanuit Babylon, de bakermat van de astrologie en van een grote Joodse gemeenschap, is Bethlehem hemelsbreed ongeveer 870 km; vanuit Perzië, wier priesters magiërs heetten, ongeveer 1.280 km vanaf Ekbatana en 1.230 km vanaf Susa; vanuit Noordwest-Arabië, Dedan, ongeveer 620 km, en vanuit Scheba in het uiterste zuiden van Arabië, vanwaar het goud en de wierook kwamen, ongeveer 2.030 km. Karavanen konden niet rechtdoor: vanuit Mesopotamië volgden zij de Eufraat en sloegen door Syrië af naar het zuiden, zodat de weg een flink stuk langer was. Met 30 km per dag voor een karavaan was Babylon een maand of meer weg, Perzië twee; het laatste stuk, van Jeruzalem naar Bethlehem, is 8 km."
    - "Mattheüs: “Toen nu Jezus geboren was te Bethlehem, gelegen in Judea, in de dagen van den koning Herodes, ziet, enige wijzen van het Oosten zijn te Jeruzalem aangekomen. Zeggende: Waar is de geboren Koning der Joden? want wij hebben gezien Zijn ster in het Oosten, en zijn gekomen om Hem te aanbidden.” Vanuit Jeruzalem: “de ster, die zij in het oosten gezien hadden, ging hun voor, totdat zij kwam en stond boven de plaats, waar het Kindeken was”; “in het huis gekomen zijnde, vonden zij het Kindeken met Maria, Zijn moeder, en nedervallende hebben zij Hetzelve aangebeden; en hun schatten opengedaan hebbende, brachten zij Hem geschenken: goud en wierook, en mirre.” Herodes doodde de jongens van Bethlehem “van twee jaren oud en daaronder, naar den tijd, dien hij van de wijzen naarstiglijk onderzocht had”, wat men leest als: de ster scheen al lang vóór hun komst."
    - "De oudste christelijke schrijvers verschilden al. Justinus Martyr zei in de tweede eeuw dat de wijzen uit Arabië kwamen; Tertullianus, die de Psalm aanhaalt: “de koningen van Scheba en Seba zullen vereringen toevoeren”, schreef dat het Oosten magiërs als koningen kende, en met Jesaja’s kemelen die “goud en wierook” uit Scheba brengen werden zij koningen en, naar de drie geschenken, drie in getal. Clemens van Alexandrië en de meeste Griekse vaders maakten er Perzen van; het mozaïek van de wijzen in Perzische kleding boven de deur van de Geboortekerk zou in 614 het Perzische leger hebben bewogen de kerk te sparen. Hun namen, Gathaspa, Melichior en Bithisarea, staan voor het eerst in een Latijnse kroniek van ca. de achtste eeuw, en hun relikwieën worden sinds 1164 in Keulen vereerd. Het geboortejaar op de kaart is ca. 5 v.Chr.; het bezoek is niet nauwkeuriger gedateerd."
  cs:
    - "Matouš říká jen, že přišli „od východu slunce“, takže vzdálenost závisí na tom, odkud je člověk vyšle. Z Babylónu, domova astrologie a velké židovské obce, je do Betléma asi 870 km vzdušnou čarou; z Persie, jejíž kněží se nazývali mágové, asi 1 280 km z Ekbatan a 1 230 km ze Sus; ze severozápadní Arábie, z Dedanu, asi 620 km a ze Šeby na dalekém jihu Arábie, odkud pocházelo zlato a kadidlo, asi 2 030 km. Karavany nemohly jít přímo: z Mezopotámie sledovaly Eufrat a stáčely se na jih přes Sýrii, takže cesta byla podstatně delší. Při 30 km denně byl Babylón měsíc či více cesty, Persie dva; poslední úsek, z Jeruzaléma do Betléma, měří 8 km."
    - "Matoušův příběh: „Když se pak narodil Ježíš v Betlémě Judově, za dnů Herodesa krále, aj, mudrci od východu slunce přijeli do Jeruzaléma, Řkouce: Kde jest ten, kterýž se narodil Král Židovský? Nebo viděli jsme hvězdu jeho na východu slunce, a přijeli jsme klaněti se jemu.“ Z Jeruzaléma „hvězda, kterouž byli viděli na východu slunce, předcházela je, až i přišedši, stála nad domem, kdež bylo dítě“; „i všedše do domu, nalezli dítě s Marijí matkou jeho, a padše, klaněli se jemu; a otevřevše poklady své, obětovali jemu dary, zlato a kadidlo a mirru.“ Herodes pak dal zmordovat chlapce v Betlémě „od dvouletých a níže, podle času, na kterýž se byl pilně vyptal od mudrců“, což se vykládá tak, že hvězdu viděli dlouho předtím, než dorazili."
    - "Nejstarší křesťanští spisovatelé se již rozcházeli. Justin Mučedník ve 2. století tvrdil, že mágové přišli z Arábie; Tertullianus, který cituje žalm „králové Šebejští a Sabejští dary obětovati budou“, napsal, že Východ měl mágy za krále, a s Izajášovými velbloudy, jež ze Šeby nesou „zlato a kadidlo“, se proto stali králi a podle tří darů tři. Klement Alexandrijský a většina řeckých otců z nich učinili Peršany a mozaika s mágy v perském oděvu nad vchodem baziliky Narození prý roku 614 přiměla perské vojsko, aby kostel ušetřilo. Jejich jména Gathaspa, Melichior a Bithisarea se poprvé objevují v latinské kronice z doby kolem 8. století a jejich ostatky se uctívají v Kolíně nad Rýnem od roku 1164. Rok narození je na mapě asi 5 př. n. l.; návštěva mágů není datována přesněji."
  sv:
    - "Matteus säger bara att de kom ”från österns länder”, så avståndet beror på varifrån man låter dem utgå. Från Babylon, hemvist för astrologin och för ett stort judiskt samfund, är det omkring 870 km fågelvägen till Betlehem; från Persien, vars präster kallades magier, omkring 1 280 km från Ekbatana och 1 230 km från Susa; från nordvästra Arabien, Dedan, omkring 620 km, och från Saba i Arabiens yttersta söder, varifrån guldet och rökelsen kom, omkring 2 030 km. Karavaner kunde inte gå rakt: från Mesopotamien följde de Eufrat och svängde söderut genom Syrien, så vägen var betydligt längre. Med en karavans 30 km om dagen låg Babylon en månad eller mer bort, Persien två; den sista etappen, Jerusalem till Betlehem, är 8 km."
    - "Matteus berättelse: ”När nu Jesus var född i Betlehem i Judeen, på konung Herodes’ tid, då kommo vise män från österns länder till Jerusalem och sade: ’Var är den nyfödde judakonungen? Vi hava nämligen sett hans stjärna i östern och hava kommit för att giva honom vår hyllning.’” Från Jerusalem gick stjärnan som de hade sett i östern ”framför dem, till dess att den kom över det ställe där barnet var”; ”de gingo in i huset och fingo se barnet med Maria, dess moder. Då föllo de ned och gåvo det sin hyllning; och de togo fram sina skatter och framburo åt det skänker: guld, rökelse och myrra.” Herodes lät sedan döda gossebarnen i Betlehem, ”som voro två år gamla och därunder, detta enligt den uppgift om tiden, som han hade fått genom att utfråga de vise männen”, vilket har tolkats så att stjärnan hade setts långt innan de kom."
    - "De äldsta kristna skribenterna var redan oeniga. Justinus Martyren sade på 100-talet att de vise männen kom från Arabien; Tertullianus, som hänvisar till psalmens ”konungarna av Saba och Seba bäre fram gåvor”, skrev att Österlandet hade magier som kungar, och med Jesajas kameler som för ”guld och rökelse” från Saba är det därför de blev kungar och, av de tre gåvorna, tre. Clemens av Alexandria och de flesta grekiska kyrkofäderna gjorde dem till perser, och mosaiken av de vise männen i persisk dräkt över dörren till Födelsekyrkan sägs ha fått den persiska armén att skona kyrkan år 614. Deras namn, Gathaspa, Melichior och Bithisarea, förekommer först i en latinsk krönika från omkring 700-talet, och deras reliker har vördats i Köln sedan 1164. Kartans år för födelsen är omkring 5 f.Kr.; de vise männens besök är inte daterat närmare."
  nb:
    - "Matteus sier bare at de kom «fra Østerland», så avstanden avhenger av hvor man lar dem starte. Fra Babylon, astrologiens hjem og en stor jødisk menighets, er det til Betlehem omtrent 870 km i luftlinje; fra Persia, hvis prester ble kalt magiere, omtrent 1 280 km fra Ekbatana og 1 230 km fra Susa; fra det nordvestlige Arabia, Dedan, omtrent 620 km, og fra Sjeba i det ytterste sør i Arabia, hvorfra gullet og røkelsen kom, omtrent 2 030 km. Karavaner kunne ikke gå rett fram: fra Mesopotamia fulgte de Eufrat og svingte sørover gjennom Syria, så veien var godt og vel lengre. Med en karavanes 30 km om dagen lå Babylon en måned eller mer unna, Persia to; den siste etappen, Jerusalem til Betlehem, er 8 km."
    - "Matteus' fortelling: «Da Jesus var født i Betlehem i Judea, i kong Herodes' dager, se, da kom nogen vismenn fra Østerland til Jerusalem og sa: Hvor er den jødenes konge som nu er født? Vi har sett hans stjerne i Østen og er kommet for å tilbede ham.» Fra Jerusalem gikk «stjernen som de hadde sett i Østen … foran dem, inntil den kom og blev stående over det sted hvor barnet var»; «de gikk inn i huset og så barnet med Maria, dets mor, og de falt ned og tilbad det, og oplot sine gjemmer og bar frem gaver til det: gull og røkelse og myrra.» Herodes lot så drepe guttebarna i Betlehem «fra to år og derunder, efter den tid han nøie hadde utspurt av vismennene», noe som er blitt lest slik at stjernen var sett lenge før de kom."
    - "De eldste kristne forfatterne var allerede uenige. Justin Martyr sa på 100-tallet at magierne kom fra Arabia; Tertullian, som viste til salmens «kongene fra Sjeba og Seba frembære skatt», skrev at Østen hadde magiere som konger, og med Jesajas kameler som bringer «gull og virak» fra Sjeba er dette grunnen til at de ble konger og, ut fra de tre gavene, tre. Klemens av Aleksandria og de fleste greske kirkefedre gjorde dem til persere, og mosaikken av magierne i persisk drakt over døren til Fødselskirken sies å ha fått den persiske hæren til å skåne kirken i 614. Navnene deres, som Gathaspa, Melichior og Bithisarea, dukker først opp i en latinsk krønike fra omtrent 700-tallet, og relikviene deres har vært æret i Köln siden 1164. Kartets år for fødselen er omtrent 5 f.Kr.; magiernes besøk er ikke tidfestet nærmere."
  tl:
    - "Sinasabi lamang ni Mateo na sila'y dumating “mula sa silanganan”, kaya nakasalalay ang layo sa kung saan sila sisimulan. Mula sa Babilonia, ang tahanan ng astrolohiya at ng isang malaking pamayanang Judio, ang Bethlehem ay mga 870 km sa tuwid na guhit; mula sa Persia, na ang mga saserdote ay tinawag na mga mago, mga 1,280 km mula sa Achmetta at 1,230 km mula sa Susan; mula sa hilagang-kanlurang Arabia, ang Dedan, mga 620 km, at mula sa Seba sa dulong timog ng Arabia, kung saan nagmula ang ginto at kamangyan, mga 2,030 km. Hindi makaluluwas nang tuwid ang mga karabana: mula sa Mesopotamia ay sinundan nila ang Eufrates at lumiko sa timog sa Siria, kaya mas mahaba ang daan nang malaki. Sa 30 km kada araw ng karabana, ang Babilonia ay isang buwan o higit pa ang layo, ang Persia ay dalawa; ang huling bahagi, mula Jerusalem hanggang Bethlehem, ay 8 km."
    - "Mateo: “Nang ipanganak nga si Jesus sa Bet-lehem ng Judea sa mga kaarawan ng haring si Herodes, narito, ang mga Pantas na lalake ay nagsidating sa Jerusalem mula sa silanganan… Saan naroon ang ipinanganak na hari ng mga Judio? aming nakita ang kaniyang bituin sa silanganan, at naparito kami upang siya'y sambahin.” Mula sa Jerusalem, “ang bituing kanilang nakita… ay nanguna sa kanila hanggang sa sumapit at tumigil sa tapat ng kinaroroonan ng sanggol”; “nagsipasok sila sa bahay, at nangakita nila ang sanggol na kasama ng kaniyang inang si Maria; … ang mga alay, na ginto at kamangyan at mira.” Ipinapatay ni Herodes ang mga batang lalake sa Bethlehem “mula sa gulang na dalawang taon hanggang sa pababa, alinsunod sa panahon ng kaniyang maingat na pagkasiyasat sa mga Pantas na lalake”, na ipinakahulugang matagal nang nakita ang bituin bago sila dumating."
    - "Hati na ang mga unang manunulat na Kristiyano. Ayon kay Justino Martir (ika-2 siglo), mula sa Arabia ang mga Pantas; si Tertuliano, na sumipi sa Awit na “ang mga hari sa Sheba at Seba ay mangaghahandog…”, ay sumulat na mga hari ang mga mago ng Silangan, at kasama ng mga kamelyo ni Isaias na may dalang “ginto at kamangyan” mula sa Seba, kaya sila naging mga hari at, dahil sa tatlong handog, tatlo. Persiano sila para kay Clemente ng Alejandria at sa karamihan ng amang Griyego; ang mosaiko ng mga Pantas na nakadamit-Persiano sa itaas ng pintuan ng Simbahan ng Kapanganakan ay sinasabing nagpaligtas dito mula sa hukbong Persiano noong 614. Ang mga pangalang Gathaspa, Melichior at Bithisarea ay unang lumitaw sa kronikang Latin noong mga ika-8 siglo, at pinaparangalan ang relikya nila sa Colonia mula 1164. Mga 5 BK ang kapanganakan sa mapa; walang mas tiyak na petsa ang pagdalaw."
  da:
    - "Mattæus siger blot, at de kom »fra Østerland«, så afstanden afhænger af, hvor man lader dem starte. Fra Babylon, astrologiens hjemsted og hjemsted for et stort jødisk samfund, er der til Betlehem omkring 870 km i luftlinje; fra Persien, hvis præster kaldtes magiere, omkring 1.280 km fra Ekbatana og 1.230 km fra Susa; fra det nordvestlige Arabien, Dedan, omkring 620 km, og fra Sjeba i det yderste sydlige Arabien, hvorfra guldet og røgelsen kom, omkring 2.030 km. Karavaner kunne ikke gå lige over: fra Mesopotamien fulgte de Eufrat og drejede sydpå gennem Syrien, så vejen var betydeligt længere. Med en karavanes 30 km om dagen lå Babylon en måned eller mere væk, Persien to; den sidste etape, fra Jerusalem til Betlehem, er 8 km."
    - "Mattæus' beretning: »Men da Jesus var født i Bethlehem i Judæa, i Kong Herodes's Dage, se, da kom der vise fra Østerland til Jerusalem og sagde: ›Hvor er den Jødernes Konge, som er født? thi vi have set hans Stjerne i Østen og ere komne for at tilbede ham.‹« Fra Jerusalem: »Stjernen, som de havde set i Østen, gik foran dem, indtil den kom og stod oven over, hvor Barnet var«; »de gik ind i Huset og saa Barnet med dets Moder Maria og faldt ned og tilbade det og oplode deres Gemmer og ofrede det Gaver, Guld og Røgelse og Myrra.« Herodes lod derefter drengebørnene i Betlehem dræbe »fra to Aar og derunder, efter den Tid, som han havde faaet Besked om af de vise«, hvilket er blevet læst som, at stjernen var set længe før deres ankomst."
    - "De ældste kristne forfattere var allerede uenige. Justin Martyr sagde i 100-tallet, at magierne kom fra Arabien; Tertullian, der henviste til salmens »Konger fra Skeba og Seba skulle fremføre Gave«, skrev, at Østen regnede magiere for konger, og da Esajas' kameler bragte »Guld og Røgelse« fra Skeba, er det derfor, de blev konger og, ud fra de tre gaver, tre. Klemens af Alexandria og de fleste af de græske kirkefædre gjorde dem til persere, og mosaikken af magierne i persisk dragt over døren til Fødselskirken siges at have bevæget den persiske hær til at skåne kirken i 614. Deres navne, Gathaspa, Melichior og Bithisarea, optræder første gang i en latinsk krønike fra omkring 700-tallet, og deres relikvier har været æret i Køln siden 1164. Kortets år for fødslen er omkring 5 f.Kr.; magiernes besøg er ikke dateret nærmere."
  sr:
    - "Матеј каже само да су дошли „с истока“, па удаљеност зависи од тога одакле се они крећу. Из Вавилона, дома астрологије и велике јеврејске заједнице, до Витлејема има око 870 км ваздушном линијом; из Персије, чији су свештеници звани маги, око 1.280 км од Екбатане и 1.230 км од Сусе; из северозападне Арабије, Дедана, око 620 км, а из Саве на далеком југу Арабије, одакле су стизали злато и тамјан, око 2.030 км. Каравани нису могли ићи право: из Месопотамије пратили су Еуфрат и скретали на југ кроз Сирију, па је пут био знатно дужи. Уз 30 км дневно колико пређе караван, Вавилон је био удаљен месец дана или више, Персија два; последња деоница, од Јерусалима до Витлејема, износи 8 км."
    - "Матејево причање: „А кад се роди Исус у Витлејему јудејском, за времена цара Ирода, а то дођу мудраци с истока у Јерусалим, и кажу: Где је цар јудејски што се родио? Јер смо видели Његову звезду на истоку и дошли смо да Му се поклонимо.“ Из Јерусалима је „звезда коју су видели на истоку, иђаше пред њима док не дође и стаде одозго где беше дете“; „И ушавши у кућу, видеше дете с Маријом матером Његовом, и падоше и поклонише Му се; па отворише даре своје и дариваше Га: златом, и тамјаном, и смирном.“ Ирод је затим побио дечаке у Витлејему „од две године и ниже, по времену које је добро дознао од мудраца“, што се тумачи тако да је звезда била виђена много пре њиховог доласка."
    - "Најстарији хришћански писци већ су се разилазили. Јустин Мученик је у 2. веку рекао да су маги дошли из Арабије; Тертулијан, позивајући се на псалмово „цареви шавски и савски даће данак“, писао је да је Исток имао маге као краљеве, а пошто Исаијине камиле доносе из Саве „злато и кад донеће“, зато су постали краљеви и, по три дара, њих тројица. Климент Александријски и већина грчких отаца сматрали су их Персијанцима, а за мозаик с магима у персијској ношњи изнад врата Цркве Рођења каже се да је 614. навео персијску војску да поштеди цркву. Њихова имена, Гатаспа, Мелихиор и Битисареа, први пут се јављају у једној латинској хроници из око 8. века, а њихове мошти поштују се у Келну од 1164. Година рођења на карти је око 5. п. н. е.; посета мага није тачније датирана."
