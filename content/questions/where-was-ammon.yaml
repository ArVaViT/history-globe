id: where-was-ammon
question:
  en: "Where was Ammon?"
  ru: "Где находился Аммон?"
  uk: "Де був Аммон?"
  es: "¿Dónde estaba Amón?"
  pt: "Onde ficava Amom?"
  de: "Wo lag Ammon?"
  fr: "Où se trouvait Ammon ?"
  pl: "Gdzie leżał Ammon?"
  it: "Dove si trovava Ammon?"
  nl: "Waar lag Ammon?"
  cs: "Kde ležel Amón?"
  sv: "Var låg Ammon?"
  nb: "Hvor lå Ammon?"
  tl: "Saan ang Ammon?"
  da: "Hvor lå Ammon?"
  sr: "Где је био Амон?"
  hu: "Hol volt Ammon?"
  fi: "Missä Ammon oli?"
  vi: "Am-môn ở đâu?"
  ro: "Unde se afla Amon?"
  bg: "Къде се е намирал Амон?"
answer:
  en:
    - "Ammon was a small kingdom on the edge of the desert east of the Jordan, around its capital Rabbah, which is Amman, the capital of Jordan today; the map point stands on Rabbah, about 69 km east of Jerusalem in a straight line. Its land lay on the upper Jabbok, the Zarqa, which rises at Amman and curves north and then west to the Jordan, with Gilead between Ammon and the river, Moab to the south and the steppe to the east."
    - "Israel on the way to Canaan was told to leave it alone: “I will not give thee of the land of the children of Ammon any possession; because I have given it unto the children of Lot for a possession”. The border with Gilead was argued over for centuries; in Jephthah's day the king of Ammon claimed the land “from Arnon even unto Jabbok, and unto Jordan”. Deuteronomy notes that the iron bedstead of Og, king of Bashan, nine cubits long, was still to be seen “in Rabbath of the children of Ammon”."
    - "David's general Joab besieged Rabbah, where Uriah the Hittite was killed, “and took the royal city”, then “the city of waters”, and David came to take the city himself. Ammon later paid tribute to Assyria and still had a king, Baalis, after the fall of Jerusalem in 587 BC. In the third century BC Ptolemy II refounded Rabbah as Philadelphia, later one of the cities of the Decapolis, and its Roman theatre still stands below the Citadel hill of Amman."
  ru:
    - "Аммон — небольшое царство на краю пустыни к востоку от Иордана вокруг столицы Раввы, нынешнего Аммана, столицы Иордании; точка карты стоит на Равве, примерно в 69 км к востоку от Иерусалима по прямой. Его земля лежала на верхнем Иавоке, нынешней Зарке, который начинается в Аммане и поворачивает на север, а затем на запад к Иордану; между Аммоном и рекой лежал Галаад, на юге — Моав, на востоке — степь."
    - "Израилю на пути в Ханаан было велено не трогать его: «Я не дам тебе ничего от земли сынов Аммоновых во владение, потому что Я отдал ее во владение сынам Лотовым». О границе с Галаадом спорили веками: во дни Иеффая царь Аммонитский требовал землю «от Арнона до Иавока и Иордана». Второзаконие замечает, что железный одр Ога, царя Васанского, длиной девять локтей, и тогда ещё стоял «в Равве, у сынов Аммоновых»."
    - "Иоав, военачальник Давида, осаждал Равву, под которой погиб Урия Хеттеянин, и «взял почти царственный город», а затем «овладел водою города», и Давид пришёл взять город сам. Позже Аммон платил дань Ассирии и ещё имел царя, Ваалиса, после падения Иерусалима в 587 г. до н. э. В III веке до н. э. Птолемей II заново основал Равву как Филадельфию, позже один из городов Десятиградия, и её римский театр до сих пор стоит под холмом Цитадели Аммана."
  uk:
    - "Аммон був невеликим царством на краю пустелі на схід від Йордану, довкола столиці Равви, тобто Амману, столиці нинішньої Йорданії; точка мапи стоїть на Равві, приблизно за 69 км на схід від Єрусалиму по прямій. Його земля лежала на верхньому Яббоку, Зарці, що бере початок в Аммані і вигинається на північ, а потім на захід до Йордану, з Гілеадом між Аммоном і річкою, Моавом на півдні й степом на сході."
    - "Ізраїлю на шляху до Ханаану було наказано залишити його в спокої: «не дам тобі держави з землї синів Амонових; бо синам Лотовим я оддав її в державу». Кордон з Гілеадом століттями оспорювали; за днів Єфтая цар Аммону претендував на землю «від Арнону до Ябоку й до Йорданї». Повторення Закону зазначає, що залізне ложе Ога, царя Башану, дев'ять ліктів завдовжки, ще можна було бачити «в Рабатї, у синів Амона»."
    - "Давидів воєвода Йоав облягав Равву, де було вбито Урію Хіттеянина, «і добував се царське місто», потім «Водяний Город», і Давид прийшов сам узяти місто. Аммон згодом платив данину Ассирії й ще мав царя, Вааліса, по падінні Єрусалиму 587 р. до н. е. У III ст. до н. е. Птолемей II заснував Равву наново як Філадельфію, згодом одне з міст Десятимістя, і її римський театр досі стоїть під пагорбом Цитаделі в Аммані."
  es:
    - "Amón era un pequeño reino en el borde del desierto, al este del Jordán, en torno a su capital Rabá, que es Amán, la capital de la actual Jordania; el punto del mapa está sobre Rabá, a unos 69 km al este de Jerusalén en línea recta. Su tierra se extendía sobre el alto Jaboc, el Zarqa, que nace en Amán y gira hacia el norte y luego hacia el oeste hasta el Jordán, con Galaad entre Amón y el río, Moab al sur y la estepa al este."
    - "A Israel, de camino a Canaán, se le dijo que lo dejara en paz: «no te tengo de dar posesión de la tierra de los hijos de Ammón; que á los hijos de Lot la he dado por heredad». La frontera con Galaad se disputó durante siglos; en tiempos de Jefté el rey de Amón reclamó la tierra «desde Arnón hasta Jaboc y el Jordán». Deuteronomio señala que la cama de hierro de Og, rey de Basán, de nueve codos de largo, aún podía verse «en Rabbath de los hijos de Ammón»."
    - "Joab, general de David, asedió Rabá, donde fue muerto Urías el hitita, y «tomó la ciudad real», luego «la ciudad de las aguas», y David vino a tomar él mismo la ciudad. Amón pagó luego tributo a Asiria y aún tenía rey, Baalis, tras la caída de Jerusalén en el 587 a. C. En el siglo III a. C. Ptolomeo II refundó Rabá como Filadelfia, más tarde una de las ciudades de la Decápolis, y su teatro romano sigue en pie bajo la colina de la Ciudadela de Amán."
  pt:
    - "Amom era um pequeno reino na orla do deserto a leste do Jordão, em torno de sua capital Rabá, que é Amã, a capital da Jordânia de hoje; o ponto do mapa está em Rabá, a cerca de 69 km a leste de Jerusalém em linha reta. Sua terra ficava no alto Jaboque, o Zarqa, que nasce em Amã e dobra ao norte e depois a oeste até o Jordão, com Gileade entre Amom e o rio, Moabe ao sul e a estepe a leste."
    - "Israel, a caminho de Canaã, foi mandado deixá-lo em paz: “eu não lhe darei nada da terra dos filhos de Amom por possessão, porque eu a dei aos filhos de Ló por possessão”. A fronteira com Gileade foi disputada por séculos; nos dias de Jefté o rei de Amom reclamava a terra “desde o Arnom até o Jaboque, e até o Jordão”. Deuteronômio observa que o leito de ferro de Ogue, rei de Basã, com nove côvados de comprimento, ainda se podia ver “em Rabá dos filhos de Amom”."
    - "O general de Davi, Joabe, sitiou Rabá, onde foi morto Urias, o hitita, “e tomou a cidade real”, depois “a cidade das águas”, e Davi veio tomar a cidade ele mesmo. Amom pagou depois tributo à Assíria e ainda tinha rei, Baalis, depois da queda de Jerusalém em 587 a.C. No século III a.C. Ptolomeu II refundou Rabá como Filadélfia, mais tarde uma das cidades da Decápolis, e seu teatro romano ainda está abaixo da colina da Cidadela de Amã."
  de:
    - "Ammon war ein kleines Königreich am Rand der Wüste östlich des Jordan, um seine Hauptstadt Rabba, das ist Amman, die heutige Hauptstadt Jordaniens; der Kartenpunkt liegt auf Rabba, in der Luftlinie etwa 69 km östlich von Jerusalem. Sein Land lag am oberen Jabbok, der Zarqa, die in Amman entspringt und sich nach Norden und dann nach Westen zum Jordan wendet, mit Gilead zwischen Ammon und dem Fluss, Moab im Süden und der Steppe im Osten."
    - "Israel wurde auf dem Weg nach Kanaan gesagt, es solle Ammon in Ruhe lassen: „denn ich will dir des Landes der Kinder Ammon nichts zu besitzen geben; denn ich habe es den Kindern Lot zu besitzen gegeben“. Die Grenze zu Gilead wurde jahrhundertelang bestritten; zu Jeftahs Zeit beanspruchte der König von Ammon das Land „vom Arnon an bis an den Jabbok und wieder bis zum Jordan“. Das 5. Buch Mose bemerkt, das eiserne Bett des Og, des Königs von Baschan, neun Ellen lang, sei noch zu sehen „zu Rabba der Kinder Ammon“."
    - "Davids Feldherr Joab belagerte Rabba, wo Uria der Hethiter fiel, und gewann „die königliche Stadt“, dann „die Wasserstadt“, und David kam, die Stadt selbst zu nehmen. Ammon zahlte später Tribut an Assyrien und hatte nach dem Fall Jerusalems 587 v. Chr. noch einen König, Baalis. Im 3. Jahrhundert v. Chr. gründete Ptolemaios II. Rabba als Philadelphia neu, später eine der Städte der Dekapolis, und sein römisches Theater steht noch unterhalb des Zitadellenhügels von Amman."
  fr:
    - "Ammon était un petit royaume au bord du désert, à l’est du Jourdain, autour de sa capitale Rabba, qui est Amman, la capitale de la Jordanie aujourd’hui ; le point de la carte est sur Rabba, à environ 69 km à l’est de Jérusalem en ligne droite. Son territoire s’étendait sur le haut Jabbok, le Zarqa, qui naît à Amman et décrit une courbe vers le nord puis l’ouest jusqu’au Jourdain, avec Galaad entre Ammon et le fleuve, Moab au sud et la steppe à l’est."
    - "Israël en route vers Canaan reçut l’ordre de le laisser en paix : « je ne te donnerai rien à posséder dans le pays des enfants d’Ammon : c’est aux enfants de Lot que je l’ai donné en propriété ». La frontière avec Galaad fut disputée pendant des siècles ; au temps de Jephté, le roi d’Ammon réclamait le pays « depuis l’Arnon jusqu’au Jabbok et au Jourdain ». Le Deutéronome note que le lit de fer d’Og, roi de Basan, long de neuf coudées, se voyait encore « à Rabbath, ville des enfants d’Ammon »."
    - "Joab, général de David, assiégea Rabba, où Urie le Héthien fut tué, « s’empara de la ville royale », puis de « la ville des eaux », et David vint prendre lui-même la ville. Ammon paya plus tard tribut à l’Assyrie et avait encore un roi, Baalis, après la chute de Jérusalem en 587 av. J.-C. Au IIIe siècle av. J.-C., Ptolémée II refonda Rabba sous le nom de Philadelphie, plus tard l’une des villes de la Décapole, et son théâtre romain se dresse toujours au pied de la colline de la Citadelle d’Amman."
  pl:
    - "Ammon był małym królestwem na skraju pustyni na wschód od Jordanu, wokół stolicy Rabba, czyli Ammanu, dzisiejszej stolicy Jordanii; punkt na mapie stoi na Rabbie, około 69 km na wschód od Jerozolimy w linii prostej. Jego ziemia leżała nad górnym Jabokiem, Zarką, która wypływa w Ammanie i skręca na północ, a potem na zachód do Jordanu, z Gileadem między Ammonem a rzeką, Moabem na południu i stepem na wschodzie."
    - "Izraelowi w drodze do Kanaanu kazano zostawić go w spokoju: „boć nie dam ziemi synów Ammonowych w osiadłość, ponieważ synom Lotowym dałem ją w dziedzictwo”. Granica z Gileadem była przedmiotem sporu przez wieki; za dni Jeftego król Ammonu rościł sobie ziemię „od Arnon aż do Jabok i aż do Jordanu”. Księga Powtórzonego Prawa zauważa, że żelazne łoże Oga, króla Baszanu, długie na dziewięć łokci, wciąż można było zobaczyć „w Rabbat, synów Ammonowych”."
    - "Wódz Dawida, Joab, oblegał Rabbę, gdzie zabito Uriasza Chetytę, „i wziął miasto królewskie”, potem „miasto wód”, a Dawid przyszedł sam zdobyć miasto. Ammon płacił później daninę Asyrii i miał jeszcze króla, Baalisa, po upadku Jerozolimy w 587 p.n.e. W III wieku p.n.e. Ptolemeusz II założył Rabbę na nowo jako Filadelfię, później jedno z miast Dekapolu, a jej rzymski teatr wciąż stoi poniżej wzgórza Cytadeli w Ammanie."
  it:
    - "Ammon era un piccolo regno al margine del deserto a est del Giordano, attorno alla sua capitale Rabba, che è Amman, oggi capitale della Giordania; il punto della mappa sta su Rabba, a circa 69 km a est di Gerusalemme in linea retta. La sua terra giaceva sull’alto Iabbok, lo Zarqa, che nasce ad Amman e curva a nord e poi a ovest verso il Giordano, con Galaad tra Ammon e il fiume, Moab a sud e la steppa a est."
    - "A Israele in cammino verso Canaan fu detto di lasciarlo stare: «io non ti darò nulla da possedere nel paese de’ figliuoli di Ammon, giacché l’ho dato ai figliuoli di Lot, come loro proprietà». Il confine con Galaad fu contestato per secoli; ai giorni di Iefte il re di Ammon rivendicò la terra «dall’Arnon fino allo Jabbok e al Giordano». Il Deuteronomio nota che il letto di ferro di Og, re di Basan, lungo nove cubiti, si poteva ancora vedere «a Rabbah degli Ammoniti»."
    - "Il generale di Davide Ioab assediò Rabba, dove fu ucciso Uria l’Ittita, e «s’impadronì della città reale», poi della «città delle acque», e Davide venne a prendere egli stesso la città. Ammon pagò poi tributo all’Assiria e aveva ancora un re, Baalis, dopo la caduta di Gerusalemme nel 587 a.C. Nel III secolo a.C. Tolomeo II rifondò Rabba come Filadelfia, poi una delle città della Decapoli, e il suo teatro romano sorge ancora sotto il colle della Cittadella di Amman."
  nl:
    - "Ammon was een klein koninkrijk aan de rand van de woestijn ten oosten van de Jordaan, rond zijn hoofdstad Rabba, het huidige Amman, de hoofdstad van Jordanië; het punt op de kaart staat op Rabba, hemelsbreed ongeveer 69 km ten oosten van Jeruzalem. Zijn land lag aan de bovenloop van de Jabbok, de Zarqa, die in Amman ontspringt en naar het noorden en dan naar het westen buigt naar de Jordaan, met Gilead tussen Ammon en de rivier, Moab in het zuiden en de steppe in het oosten."
    - "Israël werd op weg naar Kanaän gezegd het met rust te laten: “Ik zal u van het land der kinderen Ammons geen erfenis geven, dewijl Ik het aan Lots kinderen ter erfenis gegeven heb”. Over de grens met Gilead werd eeuwenlang getwist; in de dagen van Jefta eiste de koning van Ammon het land op “van de Arnon af tot aan de Jabbok, en tot aan de Jordaan”. Deuteronomium merkt op dat het ijzeren bed van Og, koning van Basan, negen ellen lang, nog te zien was “te Rabba der kinderen Ammons”."
    - "Davids veldheer Joab belegerde Rabba, waar Uria de Hethiet werd gedood, en “nam de koninklijke stad in”, daarna “de waterstad”, en David kwam de stad zelf innemen. Ammon betaalde later schatting aan Assyrië en had na de val van Jeruzalem in 587 v.Chr. nog een koning, Baälis. In de 3e eeuw v.Chr. herstichtte Ptolemaeus II Rabba als Filadelfia, later een van de steden van de Dekapolis, en zijn Romeinse theater staat nog onder de Citadelheuvel van Amman."
  cs:
    - "Amón bylo malé království na okraji pouště východně od Jordánu, kolem svého hlavního města Raby, jímž je Ammán, dnešní hlavní město Jordánska; bod na mapě stojí na Rabě, asi 69 km východně od Jeruzaléma vzdušnou čarou. Jeho země ležela na horním Jabboku, Zarqá, která pramení v Ammánu a stáčí se na sever a pak na západ k Jordánu, s Gileadem mezi Amónem a řekou, Moábem na jihu a stepí na východě."
    - "Izrael na cestě do Kanaánu měl příkaz nechat jej na pokoji: „nedám tobě v zemi synů Ammon dědictví, poněvadž synům Lotovým dal jsem ji k vládařství“. Hranice s Gileadem se po staletí rozporovala; za dnů Jiftáchových král Amónu nárokoval zemi „od Arnon až k Jaboku a až k Jordánu“. Deuteronomium poznamenává, že železné lože Oga, krále Bášanu, devět loktů dlouhé, bylo dosud vidět „v Rabbat synů Ammon“."
    - "Davidův vojevůdce Joáb oblehl Rabu, kde byl zabit Urijáš Hetejský, „a vzal město královské“, potom „město vod“, a David přišel město dobýt sám. Amón později platil tribut Asýrii a ještě po pádu Jeruzaléma roku 587 př. n. l. měl krále, Baalise. Ve 3. století př. n. l. Ptolemaios II. založil Rabu znovu jako Filadelfii, později jedno z měst Dekapole, a její římské divadlo dosud stojí pod pahorkem Citadely v Ammánu."
  sv:
    - "Ammon var ett litet kungarike i öknens utkant öster om Jordan, kring huvudstaden Rabba, som är Amman, Jordaniens huvudstad i dag; kartpunkten står på Rabba, omkring 69 km öster om Jerusalem fågelvägen. Dess land låg vid övre Jabbok, Zarqa, som har sitt ursprung i Amman och böjer norrut och sedan västerut till Jordan, med Gilead mellan Ammon och floden, Moab i söder och stäppen i öster."
    - "Israel på väg till Kanaan fick order att lämna det i fred: ”av Ammons barns land skall jag icke giva dig något till besittning, eftersom jag redan har givit det åt Lots barn till besittning”. Gränsen mot Gilead var omstridd i århundraden; på Jeftas tid krävde Ammons kung landet ”från Arnon ända till Jabbok och till Jordan”. 5 Mosebok påpekar att Ogs, kungen i Bashans, järnsäng, nio alnar lång, ännu fanns ”i Rabba i Ammons barns land”."
    - "Davids härförare Joav belägrade Rabba, där hettiten Uria dödades, ”och intog konungastaden”, sedan ”Vattenstaden”, och David kom för att själv inta staden. Ammon betalade senare tribut till Assyrien och hade fortfarande en kung, Baalis, efter Jerusalems fall 587 f.Kr. På 200-talet f.Kr. grundade Ptolemaios II Rabba på nytt som Filadelfia, senare en av Dekapolis städer, och dess romerska teater står ännu nedanför Citadellkullen i Amman."
  nb:
    - "Ammon var et lite kongerike i kanten av ørkenen øst for Jordan, rundt hovedstaden Rabba, som er Amman, Jordans hovedstad i dag; kartpunktet står på Rabba, omtrent 69 km øst for Jerusalem i luftlinje. Landet lå ved øvre Jabbok, Zarqa, som har sitt utspring i Amman og svinger mot nord og så vest til Jordan, med Gilead mellom Ammon og elven, Moab i sør og steppen i øst."
    - "Israel ble på veien til Kanaan pålagt å la det være: «jeg vil ikke gi dig noget av Ammons barns land til eiendom, for jeg har gitt Lots barn det til eiendom». Grensen mot Gilead ble det strid om i århundrer; på Jeftas tid krevde ammonittenes konge landet «like fra Arnon til Jabbok og til Jordan». 5 Mosebok bemerker at jernsengen til Og, kongen av Basan, ni alen lang, ennå kunne sees «i ammonitterbyen Rabba»."
    - "Davids hærfører Joab beleiret Rabba, der hetitten Uria ble drept, og «inntok kongestaden», så «vannbyen», og David kom for å innta byen selv. Ammon betalte senere tributt til Assyria og hadde fortsatt en konge, Baalis, etter Jerusalems fall i 587 f.Kr. På 200-tallet f.Kr. grunnla Ptolemaios II Rabba på nytt som Filadelfia, senere en av byene i Dekapolis, og dens romerske teater står fortsatt under Citadell-høyden i Amman."
  tl:
    - "Ang Ammon ay maliit na kaharian sa gilid ng disyerto sa silangan ng Jordan, sa palibot ng kabisera nitong Rabba, na siyang Amman, kabisera ng Jordan ngayon; ang tuldok sa mapa ay nasa Rabba, mga 69 km sa silangan ng Jerusalem sa tuwid na guhit. Ang lupain nito ay nasa itaas na Jaboc, ang Zarqa, na nagmumula sa Amman at kumurba pahilaga at pagkatapos ay pakanluran hanggang sa Jordan, na ang Gilead ay nasa pagitan ng Ammon at ng ilog, ang Moab sa timog at ang steppe sa silangan."
    - "Pinagbilinan ang Israel sa daan patungong Canaan na huwag itong galawin: “hindi ko ibibigay sa iyo na pinakaari ang lupain ng mga anak ni Ammon: sapagka't aking ibinigay na pinakaari sa mga anak ni Lot”. Pinagtalunan sa mga siglo ang hangganan sa Gilead; noong mga araw ni Jephte, inangkin ng hari ng Ammon ang lupain “mula sa Arnon hanggang sa Jaboc, at hanggang sa Jordan”. Binabanggit ng Deuteronomio na ang higaang bakal ni Og, hari ng Basan, siyam na siko ang haba, ay makikita pa rin sa “Rabbath ng mga anak ni Ammon”."
    - "Kinubkob ni Joab, heneral ni David, ang Rabba, kung saan napatay si Urias na Heteo, at “sinakop ang bayang hari”, pagkatapos ay “ang bayan ng mga bukal ng tubig”, at pumunta si David upang kunin mismo ang lungsod. Nagbayad kalaunan ang Ammon ng tributo sa Asiria at may hari pa rin, si Baalis, pagkabagsak ng Jerusalem noong 587 BK. Noong ikatlong siglo BK, muling itinatag ni Ptolemeo II ang Rabba bilang Filadelfia, kalaunan isa sa mga lungsod ng Decapolis, at nakatayo pa ang teatrong Romano nito sa ibaba ng burol ng Kutang Amman."
  da:
    - "Ammon var et lille kongerige ved ørkenens kant øst for Jordan, omkring hovedstaden Rabba, som er Amman, Jordans hovedstad i dag; kortets punkt står på Rabba, omkring 69 km øst for Jerusalem i luftlinje. Dets land lå ved øvre Jabbok, Zarqa, der udspringer i Amman og buer mod nord og derefter vest til Jordan, med Gilead mellem Ammon og floden, Moab mod syd og stepperne mod øst."
    - "Israel blev på vejen til Kana'an pålagt at lade det være: »jeg vil intet give dig af Ammons Børns Land til Ejendom; thi jeg har givet Lots Børn det til Ejendom«. Grænsen mod Gilead blev der strides om i århundreder; i Jeftas dage gjorde Ammons konge krav på landet fra Arnon til Jabbok og Jordan. Femte Mosebog bemærker, at jernsengen, som tilhørte Og, Basans konge, ni alen lang, endnu kunne ses »i Ammons Børns Rabba«."
    - "Davids general Joab belejrede Rabba, hvor hetitten Urias blev dræbt, og »indtog Kongestaden«, derefter »Vandstaden«, og David kom for selv at indtage byen. Ammon betalte senere tribut til Assyrien og havde stadig en konge, Ba'alis, efter Jerusalems fald i 587 f.Kr. I 200-tallet f.Kr. genstiftede Ptolemaios II Rabba som Filadelfia, senere en af Dekapolis' byer, og dets romerske teater står stadig under Citadelhøjen i Amman."
  sr:
    - "Амон је било мало краљевство на ивици пустиње источно од Јордана, око своје престонице Раве, то јест Амана, данас главног града Јордана; тачка на карти стоји на Рави, око 69 км источно од Јерусалима правом линијом. Његова земља лежала је на горњем Јавоку, Зарки, која извире у Аману и савија се на север па на запад ка Јордану, са Галадом између Амона и реке, Моавом на југу и степом на истоку."
    - "Израиљу на путу у Ханан било је речено да га остави на миру: „јер ти нећу дати земље амонске у наследство, јер је дадох синовима Лотовим у наследство“. О граници са Галадом се века препирало; у Јефтајево време амонски краљ је тврдио земљу „од Ариона до Јавока и до Јордана“. Поновљени закони бележе да се гвоздени одар Ога, цара Васана, дугачак девет лаката, још могао видети „у Рави синова Амонових“."
    - "Давидов војсковођа Јоав опсео је Раву, где је погинуо Урија Хетеј, и, како стоји, „узе царски град“, затим „град на води“, а Давид је дошао да сам заузме град. Амон је касније плаћао данак Асирији и још је имао краља, Валиса, после пада Јерусалима 587. п. н. е. У 3. веку п. н. е. Птолемеј II је обновио Раву као Филаделфију, касније један од градова Декаполиса, а њено римско позориште и данас стоји испод брда Цитадела у Аману."
  hu:
    - "Ammon kis királyság volt a Jordántól keletre fekvő sivatag szélén, fővárosa, Rabba körül, amely Ammán, ma Jordánia fővárosa; a térképi pont Rabbán áll, Jeruzsálemtől egyenes vonalban mintegy 69 km-re keletre. Földje a felső Jabbókon, a Zarkán feküdt, amely Ammánnál ered, északnak, majd nyugatnak kanyarodik a Jordánhoz, Ammon és a folyó között Gileáddal, délen Moábbal, keleten a sztyeppével."
    - "Izráelnek a Kánaán felé vezető úton azt mondták, hagyja békén: „nem adok néked az Ammon fiainak földjéből örökséget, mert a Lót fiainak adtam azt örökségül”. A Gileáddal közös határon évszázadokig vitatkoztak; Jefte napjaiban Ammon királya a földet „az Arnontól fogva Jabbókig és a Jordánig” követelte. Az 5Móz megjegyzi, hogy Óg, Básán királya kilenc sing hosszú vas-ágya még látható volt „Rabbátban az Ammon fiainál”."
    - "Dávid hadvezére, Joáb ostrom alá vette Rabbát, ahol a hettita Uriást megölték, és „megvevé a királyi várost”, majd „a városnak egyik részét, a hol a víz van”, és Dávid maga jött el a város elfoglalására. Ammon később adót fizetett Asszíriának, és Jeruzsálem Kr. e. 587-es eleste után is volt királya, Baalisz. A Kr. e. 3. században II. Ptolemaiosz Filadelfiaként alapította újra Rabbát, amely később a Dekapolisz egyik városa lett, római színháza pedig ma is áll az ammáni Citadella-domb alatt."
  fi:
    - "Ammon oli pieni kuningaskunta autiomaan reunalla Jordanin itäpuolella pääkaupunkinsa Rabban ympärillä, joka on Amman, nykyinen Jordanian pääkaupunki; karttapiste on Rabbassa, noin 69 km Jerusalemista itään linnuntietä. Sen maa sijaitsi Jabbokin yläjuoksulla, Zarqalla, joka saa alkunsa Ammanissa ja kaartuu pohjoiseen ja sitten länteen Jordanille, Gileadin ollessa Ammonin ja joen välissä, Moabin etelässä ja arojen idässä."
    - "Israelia käskettiin matkalla Kanaaniin jättämään se rauhaan: ”minä en anna ammonilaisten maasta mitään omaksesi, koska minä olen antanut sen Lootin jälkeläisten omaksi”. Rajasta Gileadin kanssa kiisteltiin vuosisatoja; Jeftan päivinä Ammonin kuningas vaati maata ”Arnonista Jabbokiin ja Jordaniin asti”. 5. Mooseksen kirja toteaa, että Ogin, Basanin kuninkaan, yhdeksän kyynärää pitkä rautasänky oli yhä nähtävissä ”ammonilaisten kaupungissa Rabbassa”."
    - "Daavidin kenraali Joab piiritti Rabbaa, jossa heettiläinen Uria tapettiin, ja ”valloitti kuninkaan kaupungin”, sitten ”vesikaupungin”, ja Daavid tuli valtaamaan kaupungin itse. Ammon maksoi myöhemmin veroa Assyrialle ja sillä oli yhä kuningas, Baalis, Jerusalemin kukistumisen jälkeen vuonna 587 eaa. 200-luvulla eaa. Ptolemaios II perusti Rabban uudelleen Filadelfiaksi, joka oli myöhemmin yksi Dekapolis-kaupungeista, ja sen roomalainen teatteri seisoo yhä Ammanin Linnoitusvuoren alapuolella."
  vi:
    - "Am-môn là một vương quốc nhỏ bên rìa sa mạc phía đông sông Giô-đanh, quanh kinh đô Ráp-ba, tức Amman, thủ đô của Jordan ngày nay; điểm bản đồ đứng trên Ráp-ba, cách Giê-ru-sa-lem khoảng 69 km về phía đông theo đường thẳng. Đất của nó nằm trên thượng nguồn Gia-bốc, sông Zarqa, bắt nguồn tại Amman và uốn lên bắc rồi về tây ra Giô-đanh, với Ga-la-át giữa Am-môn và sông, Mô-áp ở phía nam và thảo nguyên ở phía đông."
    - "Y-sơ-ra-ên trên đường đến Ca-na-an được bảo để nó yên: “ta không cho ngươi chi hết của xứ con cháu Am-môn làm sản nghiệp, bởi ta đã ban xứ đó cho con cháu của Lót làm sản nghiệp”. Biên giới với Ga-la-át được tranh cãi hàng thế kỷ; thời Giép-thê, vua Am-môn đòi đất “từ Ạt-nôn cho đến Gia-bốc và Giô-đanh”. Sách Phục truyền ghi rằng cái giường sắt của Óc, vua Ba-san, dài chín thước, vẫn còn thấy “tại Ráp-ba, thành của con cháu Am-môn”."
    - "Tướng của Đa-vít là Giô-áp vây Ráp-ba, nơi U-ri người Hê-tít bị giết, “hãm lấy đế đô”, rồi “hãm lấy thành ở mạn dưới”, và Đa-vít đến tự chiếm thành. Am-môn về sau nộp cống cho Assyria và vẫn còn một vua, Ba-a-lít, sau khi Giê-ru-sa-lem sụp đổ năm 587 TCN. Ở thế kỷ 3 TCN, Ptolemy II lập lại Ráp-ba thành Phi-la-đen-phi, về sau là một trong các thành của Đê-ca-bô-lơ, và nhà hát La Mã của nó vẫn đứng dưới đồi Thành lũy của Amman."
  ro:
    - "Amon era un mic regat la marginea deșertului, la est de Iordan, în jurul capitalei sale Raba, care este Amman, capitala Iordaniei de azi; punctul de pe hartă stă pe Raba, la circa 69 km est de Ierusalim în linie dreaptă. Țara lui se întindea pe Iabocul superior, Zarqa, care izvorăște la Amman și se curbează spre nord și apoi spre vest până la Iordan, cu Galaadul între Amon și râu, Moab la sud și stepa la est."
    - "Israelului, pe drumul spre Canaan, i s-a poruncit să-l lase în pace: „din pământul lui Aman nu voiu da ție moșie, că fiilor lui Lot l-am dat moșie”. Granița cu Galaadul a fost disputată veacuri la rând; în zilele lui Ieftae, regele Amonului revendica țara „dela Arnon până la Iavok și până la Iordan”. Deuteronomul notează că patul de fier al lui Og, regele Basanului, lung de nouă coți, se vedea încă „în cetatea fiilor lui Aman”."
    - "Generalul lui David, Ioab, a asediat Raba, unde a fost ucis Urie Hititul, și „a luat cetatea împărăției”, apoi „cetatea apelor”, iar David a venit să ia el însuși cetatea. Amonul a plătit mai târziu tribut Asiriei și avea încă un rege, Baalis, după căderea Ierusalimului în 587 î.Hr. În secolul al III-lea î.Hr., Ptolemeu al II-lea a refondat Raba ca Filadelfia, mai târziu una dintre cetățile Decapolei, iar teatrul ei roman stă și azi sub dealul Citadelei din Amman."
  bg:
    - "Амон бил малко царство на края на пустинята източно от Йордан, около столицата си Рава, която е Аман, днешната столица на Йордания; точката на картата стои на Рава, на около 69 км източно от Йерусалим по права линия. Земята му лежала по горното течение на Явок, Зарка, която извира при Аман и завива на север и после на запад към Йордан, с Галаад между Амон и реката, Моав на юг и степта на изток."
    - "На път за Ханаан на Израил било казано да го остави на мира: „няма да ти дам от земята на Амоновите синове наследие, понеже я дадох на Лотовите синове за наследие“. За границата с Галаад се спорело векове; в дните на Йефтай амонският цар претендирал за земята „от Арнон до Явок и до Иордан“. Второзаконие отбелязва, че железният одър на Ог, царя на Васан, дълъг девет лакти, още можел да се види „в Рава у Амоновите синове“."
    - "Пълководецът на Давид Йоав обсадил Рава, където бил убит Урия Хетееца, и „облада царския град“, после „града на водите“, а Давид дошъл да превземе града сам. По-късно Амон плащал данък на Асирия и още имал цар, Ваалис, след падането на Йерусалим през 587 г. пр.н.е. През III в. пр.н.е. Птолемей II основал Рава отново като Филаделфия, по-късно един от градовете на Декаполис, и римският ѝ театър още стои под хълма на Цитаделата в Аман."
