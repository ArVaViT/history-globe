id: where-was-chorazin
question:
  en: "Where was Chorazin?"
  ru: "Где находился Хоразин?"
  uk: "Де був Хоразин?"
  es: "¿Dónde estaba Corazín?"
  pt: "Onde ficava Corazim?"
  de: "Wo lag Chorazin?"
  fr: "Où se trouvait Chorazin ?"
answer:
  en:
    - "Chorazin stood on the black basalt hills above the northern shore of the Sea of Galilee, at the ruin of Khirbet Karazeh, where the old name survives, today the Korazim national park in Israel; the map point stands on it. It lies about 3.5 km north of Capernaum, about 6 km west of Bethsaida and about 130 km north of Jerusalem, all in a straight line. With Capernaum and Bethsaida it made the small triangle of towns at the head of the lake where much of Jesus' Galilean ministry took place."
    - "Chorazin is named only in one saying, kept by Matthew and Luke. Matthew writes: “Then began he to upbraid the cities wherein most of his mighty works were done, because they repented not: Woe unto thee, Chorazin! woe unto thee, Bethsaida! for if the mighty works, which were done in you, had been done in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.” So the Gospels imply many miracles there, yet describe none. Medieval writers drew a grim conclusion from the curse: Adso of Montier-en-Der, about 950, taught that the Antichrist would be raised in Bethsaida and Chorazin."
    - "What visitors see today is mostly the town of the third and fourth centuries AD, excavated by Ze'ev Yeivin in 1962–1964 and 1980–1987: basalt houses, a ritual bath, olive presses and a synagogue carved with reliefs, whose dates are still debated. In it was found a basalt chair with an Aramaic dedication, often called the “seat of Moses” after Jesus' words that “the scribes and the Pharisees sit in Moses’ seat”; the original is in the Israel Museum. In the early fourth century Eusebius knew Chorazin as a deserted village two miles from Capernaum."
  ru:
    - "Хоразин стоял на чёрных базальтовых холмах над северным берегом моря Галилейского, на развалинах Хирбет-Керазе, где сохранилось древнее имя; сегодня это национальный парк Коразим в Израиле, и точка карты стоит на нём. Он лежит примерно в 3,5 км к северу от Капернаума, примерно в 6 км к западу от Вифсаиды и примерно в 130 км к северу от Иерусалима — всё по прямой. Вместе с Капернаумом и Вифсаидой он образовывал небольшой треугольник городов у северного конца озера, где прошла значительная часть служения Иисуса в Галилее."
    - "Хоразин назван лишь в одном речении, которое сохранили Матфей и Лука. Матфей пишет: «Тогда начал Он укорять города, в которых наиболее явлено было сил Его, за то, что они не покаялись: горе тебе, Хоразин! горе тебе, Вифсаида! ибо если бы в Тире и Сидоне явлены были силы, явленные в вас, то давно бы они во вретище и пепле покаялись». Значит, чудес там было много, но ни одного Евангелия не описывают. Средневековые авторы сделали из этого проклятия мрачный вывод: Адсон из Монтье-ан-Дер около 950 г. учил, что антихрист будет воспитан в Вифсаиде и Хоразине."
    - "То, что видят сегодня посетители, — в основном город III–IV веков н. э., который раскапывал Зеэв Йеивин в 1962–1964 и 1980–1987 гг.: базальтовые дома, ритуальная купальня, давильни для оливок и синагога с резными рельефами, даты которой по-прежнему спорны. В ней нашли базальтовое кресло с арамейской посвятительной надписью, которое часто называют «Моисеевым седалищем» по словам Иисуса: «на Моисеевом седалище сели книжники и фарисеи»; подлинник хранится в Музее Израиля. В начале IV века Евсевий знал Хоразин как запустевшее селение в двух милях от Капернаума."
  uk:
    - "Хоразин стояв на чорних базальтових пагорбах над північним берегом Галілейського моря, на руїнах Хірбет-Каразе, де зберігається давня назва, нині національний парк Коразім в Ізраїлі; точка мапи стоїть на ньому. Він лежить приблизно за 3,5 км на північ від Капернауму, приблизно за 6 км на захід від Віфсаїди і приблизно за 130 км на північ від Єрусалиму, усе по прямій. Разом із Капернаумом і Віфсаїдою він складав маленький трикутник міст біля витоку озера, де відбулася значна частина галілейського служіння Ісуса."
    - "Хоразин названий лише в одному вислові, збереженому Матвієм і Лукою. Матвій пише: «Тодї почав докоряти городам, де стало ся найбільше чудес Його, що не покаялись: Горе тобі, Хоразине! горе тобі, Витсаїдо! бо коли б чудеса, що стали ся в вас, стались у Тирі та Сидонї, давно були б вони покаялись у веретищі та попелї». Отже, Євангелії натякають на численні чудеса там, але не описують жодного. Середньовічні письменники зробили похмурий висновок із прокляття: Адсон з Монтьє-ан-Дер близько 950 р. навчав, що Антихриста буде вирощено у Віфсаїді й Хоразині."
    - "Те, що відвідувачі бачать нині, — це здебільшого місто III–IV ст. н. е., розкопане Зеєвом Єйвіном 1962–1964 і 1980–1987 рр.: базальтові будинки, ритуальна купіль, оливні преси та синагога, оздоблена рельєфами, дати якої досі обговорюються. У ній знайдено базальтове крісло з арамейським присвяченням, яке часто називають «сидінням Мойсея» за словами Ісуса, що «На Мойсейових сїдалищах посїдали письменники та Фарисеї»; оригінал — в Ізраїльському музеї. На початку IV ст. Євсевій знав Хоразин як покинуте село за дві милі від Капернауму."
  es:
    - "Corazín se alzaba en las colinas de basalto negro sobre la orilla norte del mar de Galilea, en la ruina de Khirbet Karazeh, donde sobrevive el nombre antiguo, hoy parque nacional de Korazim, en Israel; allí está el punto del mapa. Queda a unos 3,5 km al norte de Cafarnaúm, a unos 6 km al oeste de Betsaida y a unos 130 km al norte de Jerusalén, todo en línea recta. Con Cafarnaúm y Betsaida formaba el pequeño triángulo de ciudades en la cabecera del lago donde tuvo lugar buena parte del ministerio galileo de Jesús."
    - "Corazín se nombra solo en un dicho, conservado por Mateo y Lucas. Mateo escribe: «Entonces comenzó á reconvenir á las ciudades en las cuales habían sido hechas muy muchas de sus maravillas, porque no se habían arrepentido, diciendo: ¡Ay de ti, Corazín! ¡Ay de ti, Bethsaida! porque si en Tiro y en Sidón fueran hechas las maravillas que han sido hechas en vosotras, en otro tiempo se hubieran arrepentido en saco y en ceniza». Así, los Evangelios dan a entender que hubo allí muchos milagros, pero no describen ninguno. Los escritores medievales sacaron de la maldición una conclusión sombría: Adsón de Montier-en-Der, hacia el 950, enseñó que el Anticristo se criaría en Betsaida y Corazín."
    - "Lo que los visitantes ven hoy es sobre todo la ciudad de los siglos III y IV d. C., excavada por Ze'ev Yeivin en 1962–1964 y 1980–1987: casas de basalto, un baño ritual, almazaras y una sinagoga tallada con relieves, cuyas fechas aún se debaten. En ella se halló una silla de basalto con una dedicatoria en arameo, a menudo llamada la «silla de Moisés» por las palabras de Jesús de que «Sobre la cátedra de Moisés se sentaron los escribas y los Fariseos»; el original está en el Museo de Israel. A comienzos del siglo IV, Eusebio conocía Corazín como una aldea desierta a dos millas de Cafarnaúm."
  pt:
    - "Corazim ficava nos montes de basalto negro acima da margem norte do mar da Galileia, nas ruínas de Khirbet Karazeh, onde o nome antigo sobrevive, hoje o parque nacional de Korazim, em Israel; o ponto do mapa está nele. Fica a cerca de 3,5 km ao norte de Cafarnaum, a cerca de 6 km a oeste de Betsaida e a cerca de 130 km ao norte de Jerusalém, tudo em linha reta. Com Cafarnaum e Betsaida formava o pequeno triângulo de cidades na cabeceira do lago onde ocorreu grande parte do ministério galileu de Jesus."
    - "Corazim é nomeada só numa palavra de Jesus, guardada por Mateus e Lucas. Mateus escreve: “Então ele começou a denunciar as cidades nas quais a maioria das suas obras poderosas havia sido realizada, porque não se arrependeram. ‘Ai de você, Corazim! Ai de você, Betsaida! Porque, se as obras poderosas que foram feitas em vocês tivessem sido feitas em Tiro e Sidom, há muito tempo elas teriam se arrependido em pano de saco e cinzas.’” Assim os Evangelhos supõem muitos milagres ali, mas não descrevem nenhum. Escritores medievais tiraram da maldição uma conclusão sombria: Adso de Montier-en-Der, por volta de 950, ensinava que o Anticristo seria criado em Betsaida e Corazim."
    - "O que os visitantes veem hoje é sobretudo a cidade dos séculos III e IV d.C., escavada por Ze'ev Yeivin em 1962–1964 e 1980–1987: casas de basalto, um banho ritual, lagares de azeite e uma sinagoga esculpida com relevos, cujas datas ainda são debatidas. Nela se achou uma cadeira de basalto com dedicatória em aramaico, muitas vezes chamada “cadeira de Moisés” pelas palavras de Jesus de que “os escribas e os fariseus estão assentados na cadeira de Moisés”; o original está no Museu de Israel. No início do século IV, Eusébio conhecia Corazim como uma aldeia abandonada a duas milhas de Cafarnaum."
  de:
    - "Chorazin lag auf den schwarzen Basalthügeln über dem Nordufer des Sees Genezareth, an der Ruine Chirbet Karaze, wo der alte Name überlebt, heute der Nationalpark Korazim in Israel; der Kartenpunkt liegt darauf. Es liegt etwa 3,5 km nördlich von Kapernaum, etwa 6 km westlich von Betsaida und etwa 130 km nördlich von Jerusalem, alles in der Luftlinie. Mit Kapernaum und Betsaida bildete es das kleine Dreieck von Städten am Kopf des Sees, wo ein großer Teil von Jesu galiläischem Wirken stattfand."
    - "Chorazin wird nur in einem Wort genannt, das Matthäus und Lukas bewahren. Matthäus schreibt: „Da fing er an, die Städte zu schelten, in welchen am meisten seiner Taten geschehen waren, und hatten sich doch nicht gebessert: Wehe dir Chorazin! Weh dir, Bethsaida! Wären solche Taten zu Tyrus und Sidon geschehen, wie bei euch geschehen sind, sie hätten vorzeiten im Sack und in der Asche Buße getan.“ Die Evangelien deuten dort also viele Wunder an, beschreiben aber keines. Mittelalterliche Schriftsteller zogen aus dem Fluch einen düsteren Schluss: Adso von Montier-en-Der lehrte um 950, der Antichrist werde in Betsaida und Chorazin aufgezogen."
    - "Was Besucher heute sehen, ist meist die Stadt des 3. und 4. Jahrhunderts n. Chr., von Ze'ev Yeivin 1962–1964 und 1980–1987 ausgegraben: Basalthäuser, ein Ritualbad, Ölpressen und eine mit Reliefs geschmückte Synagoge, deren Datierung noch umstritten ist. In ihr wurde ein Basaltstuhl mit aramäischer Widmung gefunden, oft nach Jesu Worten „Auf Mose's Stuhl sitzen die Schriftgelehrten und Pharisäer“ der „Stuhl des Mose“ genannt; das Original ist im Israel-Museum. Im frühen 4. Jahrhundert kannte Eusebius Chorazin als verlassenes Dorf zwei Meilen von Kapernaum."
  fr:
    - "Chorazin se dressait sur les collines de basalte noir au-dessus de la rive nord de la mer de Galilée, à la ruine de Khirbet Karazeh, où survit l’ancien nom, aujourd’hui parc national de Korazim, en Israël ; le point de la carte y est. Elle est à environ 3,5 km au nord de Capernaüm, à environ 6 km à l’ouest de Bethsaïda et à environ 130 km au nord de Jérusalem, le tout en ligne droite. Avec Capernaüm et Bethsaïda, elle formait le petit triangle de villes à la tête du lac où se déroula une grande part du ministère galiléen de Jésus."
    - "Chorazin n’est nommée que dans une seule parole, conservée par Matthieu et Luc. Matthieu écrit : « Alors il se mit à faire des reproches aux villes dans lesquelles avaient eu lieu la plupart de ses miracles, parce qu’elles ne s’étaient pas repenties. Malheur à toi, Chorazin ! Malheur à toi, Bethsaïda ! Car, si les miracles qui ont été faits au milieu de vous avaient été faits dans Tyr et dans Sidon, il y a longtemps qu’elles se seraient repenties, en prenant le sac et la cendre. » Les Évangiles supposent donc de nombreux miracles en ce lieu, sans en décrire aucun. Des auteurs médiévaux tirèrent de la malédiction une conclusion sombre : Adson de Montier-en-Der, vers 950, enseigna que l’Antéchrist serait élevé à Bethsaïda et à Chorazin."
    - "Ce que voient les visiteurs aujourd’hui est surtout la ville des IIIe et IVe siècles apr. J.-C., fouillée par Ze’ev Yeivin en 1962–1964 et 1980–1987 : maisons de basalte, bain rituel, pressoirs à olives et synagogue ornée de reliefs, dont les datations sont encore débattues. On y trouva un siège de basalte portant une dédicace araméenne, souvent appelé « chaire de Moïse » d’après les paroles de Jésus : « Les scribes et les pharisiens sont assis dans la chaire de Moïse » ; l’original est au Musée d’Israël. Au début du IVe siècle, Eusèbe connaissait Chorazin comme un village désert à deux milles de Capernaüm."
