id: where-was-damascus-in-the-bible
question:
  en: "Where was Damascus in the Bible?"
  ru: "Где находился Дамаск в Библии?"
  uk: "Де був Дамаск у Біблії?"
  es: "¿Dónde estaba Damasco en la Biblia?"
  pt: "Onde ficava Damasco na Bíblia?"
  de: "Wo lag Damaskus in der Bibel?"
  fr: "Où se trouvait Damas dans la Bible ?"
  pl: "Gdzie leżał Damaszek w Biblii?"
  it: "Dov’era Damasco nella Bibbia?"
  nl: "Waar lag Damascus in de Bijbel?"
  cs: "Kde byl Damašek v Bibli?"
  sv: "Var låg Damaskus i Bibeln?"
  nb: "Hvor lå Damaskus i Bibelen?"
  tl: "Saan ang Damasco sa Biblia?"
  da: "Hvor lå Damaskus i Bibelen?"
answer:
  en:
    - "The Damascus of the Bible is the same city as today's capital of Syria: it stands on a plateau east of the Anti-Lebanon mountains, where the Barada river spreads out into the Ghouta oasis at the edge of the Syrian desert, about 217 km north-north-east of Jerusalem in a straight line; the map point stands on the Old City. It has been lived in for thousands of years and is one of the oldest continuously inhabited cities in the world. How long the road from Jerusalem was, and where Paul was converted on it, are told in separate questions."
    - "Genesis already knows the city: Abram's heir was to be “this Eliezer of Damascus”. From about the tenth century BC it was the capital of Aram, the kingdom that fought Israel for two centuries: Rezon seized it in Solomon's day and “reigned in Damascus”, Ben-hadad and Hazael warred with Ahab and his sons, and Elisha “came to Damascus” when Ben-hadad was sick. Naaman, the Syrian commander, scorned the Jordan: “Are not Abana and Pharpar, rivers of Damascus, better than all the waters of Israel?” The Abana is the Barada. In 732 BC Tiglath-pileser III, called in by Ahaz of Judah, “went up against Damascus, and took it, and carried the people of it captive to Kir, and slew Rezin”, as Isaiah had foretold: “Damascus is taken away from being a city, and it shall be a ruinous heap.”"
    - "The city recovered, and in the New Testament it had synagogues and a Jewish community large enough for Saul to seek believers there. Near the city he saw the light from heaven; in Damascus Ananias found him in “the street which is called Straight”, which still crosses the Old City from east to west as the line of the Roman main street, and he later escaped over the wall in a basket. The great Roman temple of Jupiter became a church and, in the early eighth century, the Umayyad Mosque, which still stands on the same site."
  ru:
    - "Дамаск Библии — тот же город, что нынешняя столица Сирии: он стоит на плато к востоку от Антиливана, там, где река Барада растекается по оазису Гута на краю Сирийской пустыни, примерно в 217 км к северо-северо-востоку от Иерусалима по прямой; точка карты стоит на Старом городе. Здесь живут тысячи лет, и это один из древнейших непрерывно населённых городов мира. Какой длины была дорога из Иерусалима и где на ней обратился Павел, рассказано в отдельных вопросах."
    - "Город знает уже книга Бытия: наследником Аврама должен был стать «этот Елиезер из Дамаска». Примерно с X века до н. э. Дамаск был столицей Арама — царства, которое два века воевало с Израилем: во дни Соломона Разон со своими людьми пришёл туда, и они «водворились там, и владычествовали в Дамаске», Венадад и Азаил воевали с Ахавом и его сыновьями, а Елисей «пришел… в Дамаск», когда Венадад был болен. Сирийский военачальник Нееман презирал Иордан: «разве Авана и Фарфар, реки Дамасские, не лучше всех вод Израильских?» Авана — это Барада. В 732 г. до н. э. Феглаффелласар (Тиглатпаласар III), призванный Ахазом Иудейским, «пошел… в Дамаск, и взял его, и переселил жителей его в Кир, а Рецина умертвил», как и предсказывал Исаия: «Вот, Дамаск исключается из числа городов и будет грудою развалин»."
    - "Город поднялся снова, и в Новом Завете в нём были синагоги и иудейская община, настолько большая, что Савл искал там верующих. Близ города он увидел свет с неба; в Дамаске Анания пошёл к нему «на улицу, так называемую Прямую», которая и теперь пересекает Старый город с востока на запад по линии главной римской улицы, а позже Савл бежал, спущенный в корзине по стене. Огромный римский храм Юпитера стал церковью, а в начале VIII века — мечетью Омейядов, которая и сейчас стоит на том же месте."
  uk:
    - "Біблійний Дамаск — це те саме місто, що й нинішня столиця Сирії: він стоїть на плато на схід від гір Антиліван, де річка Барада розливається в оазу Гута на краю Сирійської пустелі, приблизно за 217 км на північ-північний схід від Єрусалиму по прямій; точка мапи стоїть на Старому місті. У ньому живуть тисячі років, і це одне з найдавніших безперервно заселених міст світу. Яка довга була дорога з Єрусалиму і де на ній навернувся Павло, розповідається в окремих питаннях."
    - "Книга Буття вже знає місто: спадкоємцем Аврама мав бути «сей Дамашчанець Елиєзер». Приблизно з X ст. до н. е. воно було столицею Арама, царства, що воювало з Ізраїлем два століття: Разон захопив його за днів Соломона, і «зробили його царем у Дамаску», Бен-Гадад і Азаїл воювали з Ахавом та його синами, а «пійшов Елисей у Дамаск», коли Бен-Гадад хворів. Нееман, сирійський воєвода, зневажив Йордан: «Чи то ж ріки Дамаські, Абана та Фарфар не лучші, нїж води в Йорданї?» Авана — це Барада. 732 р. до н. е. Тіглатпаласар III, покликаний Ахазом Юдейським, «двинув … проти Дамаску, впокорив його та й одвів осадників його в Кир, а Резина вбив», як Ісая й провістив: «Дамаск вичеркуєсь зпроміж міст й обернеться в купи руйновища»."
    - "Місто відновилося, і в Новому Заповіті в ньому були синагоги та єврейська громада, досить велика, щоб Савл шукав там віруючих. Біля міста він побачив світло з неба; у Дамаску Ананія знайшов його на вулиці, яка «зветь ся Простою», яка досі перетинає Старе місто зі сходу на захід як лінія римської головної вулиці, і він згодом утік через мур у кошику. Великий римський храм Юпітера став церквою і, на початку VIII ст., мечеттю Омеядів, що досі стоїть на тому самому місці."
  es:
    - "La Damasco de la Biblia es la misma ciudad que la actual capital de Siria: se alza en una meseta al este de las montañas del Antilíbano, donde el río Barada se extiende en el oasis de la Ghouta, en el borde del desierto sirio, a unos 217 km al nor-noreste de Jerusalén en línea recta; el punto del mapa está sobre la Ciudad Vieja. Ha estado habitada durante miles de años y es una de las ciudades habitadas de forma continua más antiguas del mundo. Cuán largo era el camino desde Jerusalén y dónde se convirtió Pablo en él se cuenta en preguntas aparte."
    - "Génesis ya conoce la ciudad: el heredero de Abram iba a ser «ese Damasceno Eliezer». Desde alrededor del siglo X a. C. fue la capital de Aram, el reino que combatió a Israel durante dos siglos: Rezón se apoderó de ella en tiempos de Salomón: «hiciéronle rey en Damasco», Ben-adad y Hazael guerrearon con Acab y sus hijos, y Eliseo «se fué luego á Damasco» cuando Ben-adad estaba enfermo. Naamán, el comandante sirio, despreció el Jordán: «Abana y Pharphar, ríos de Damasco, ¿no son mejores que todas las aguas de Israel?». El Abana es el Barada. En el 732 a. C. Tiglat-pileser III, llamado por Acaz de Judá, «subió el rey de Asiria contra Damasco, y tomóla, y trasportó los moradores á Kir, y mató á Resín», como había predicho Isaías: «Damasco dejó de ser ciudad, y será montón de ruina»."
    - "La ciudad se recuperó, y en el Nuevo Testamento tenía sinagogas y una comunidad judía lo bastante grande para que Saulo fuera a buscar allí a los creyentes. Cerca de la ciudad vio la luz del cielo; en Damasco Ananías lo halló en «la calle que se llama la Derecha», que aún cruza la Ciudad Vieja de este a oeste como línea de la calle principal romana, y más tarde escapó por el muro en una espuerta. El gran templo romano de Júpiter se convirtió en iglesia y, a comienzos del siglo VIII, en la Mezquita Omeya, que sigue en pie en el mismo lugar."
  pt:
    - "A Damasco da Bíblia é a mesma cidade da atual capital da Síria: fica num planalto a leste dos montes do Anti-Líbano, onde o rio Barada se espraia no oásis de Ghouta, na orla do deserto sírio, a cerca de 217 km a nor-nordeste de Jerusalém em linha reta; o ponto do mapa está na Cidade Velha. É habitada há milhares de anos e é uma das cidades continuamente habitadas mais antigas do mundo. Quão longa era a estrada desde Jerusalém e onde Paulo se converteu nela são contados em perguntas à parte."
    - "Gênesis já conhece a cidade: o herdeiro de Abrão seria “Eliézer de Damasco”. Desde cerca do século X a.C. foi a capital de Arã, o reino que combateu Israel por dois séculos: Rezom a tomou nos dias de Salomão, e ele e os seus “reinaram em Damasco”, Ben-Hadade e Hazael guerrearam com Acabe e seus filhos, e Eliseu “foi a Damasco” quando Ben-Hadade adoeceu. Naamã, o comandante sírio, desprezou o Jordão: “Não são Abana e Farfar, os rios de Damasco, melhores do que todas as águas de Israel?” O Abana é o Barada. Em 732 a.C. Tiglate-Pileser III, chamado por Acaz de Judá, “subiu contra Damasco e a tomou, e levou seu povo cativo para Quir, e matou Rezim”, como Isaías predissera: “Damasco deixará de ser uma cidade, e será um monte de ruínas.”"
    - "A cidade se recuperou, e no Novo Testamento tinha sinagogas e uma comunidade judaica grande o bastante para que Saulo ali procurasse crentes. Perto da cidade ele viu a luz do céu; em Damasco Ananias o encontrou na “rua chamada Direita”, que ainda cruza a Cidade Velha de leste a oeste como a linha da rua principal romana, e mais tarde ele escapou pelo muro num cesto. O grande templo romano de Júpiter virou igreja e, no início do século VIII, a Mesquita Omíada, que ainda está no mesmo local."
  de:
    - "Das Damaskus der Bibel ist dieselbe Stadt wie die heutige Hauptstadt Syriens: Sie liegt auf einem Plateau östlich des Antilibanon, wo sich der Fluss Barada zur Oase Ghuta am Rand der syrischen Wüste ausbreitet, in der Luftlinie etwa 217 km nordnordöstlich von Jerusalem; der Kartenpunkt liegt auf der Altstadt. Sie ist seit Jahrtausenden bewohnt und eine der ältesten ununterbrochen besiedelten Städte der Welt. Wie lang der Weg von Jerusalem war und wo Paulus auf ihm bekehrt wurde, wird in eigenen Fragen erzählt."
    - "Die Genesis kennt die Stadt schon: Abrams Erbe sollte „dieser Elieser von Damaskus“ sein. Vom 10. Jahrhundert v. Chr. an war sie die Hauptstadt Arams, des Königreichs, das zwei Jahrhunderte gegen Israel kämpfte: Reson und seine Schar zogen zu Salomos Zeit dorthin und „regierten zu Damaskus“, Ben-Hadad und Hasaël führten Krieg gegen Ahab und seine Söhne, und „Elisa kam gen Damaskus“, als Ben-Hadad krank lag. Naaman, der syrische Feldherr, verschmähte den Jordan: „Sind nicht die Wasser Amana und Pharphar zu Damaskus besser denn alle Wasser in Israel?“ Der Abana ist der Barada. 732 v. Chr. folgte Tiglat-Pileser III. dem Ruf des Ahas von Juda und „zog herauf gen Damaskus und gewann es und führte es weg gen Kir und tötete Rezin“, wie Jesaja vorausgesagt hatte: „Damaskus wird keine Stadt mehr sein, sondern ein zerfallener Steinhaufe.“"
    - "Die Stadt erholte sich, und im Neuen Testament hatte sie Synagogen und eine jüdische Gemeinde, groß genug, dass Saulus dort Gläubige suchte. Nahe der Stadt sah er das Licht vom Himmel; in Damaskus fand ihn Hananias in der „Gasse, die da heißt ‚die gerade‘“, die noch heute als Linie der römischen Hauptstraße die Altstadt von Ost nach West quert, und später entkam er über die Mauer in einem Korb. Der große römische Jupitertempel wurde zur Kirche und im frühen 8. Jahrhundert zur Omajjaden-Moschee, die noch an derselben Stelle steht."
  fr:
    - "La Damas de la Bible est la même ville que l’actuelle capitale de la Syrie : elle se dresse sur un plateau à l’est des monts de l’Anti-Liban, là où le Barada s’étale dans l’oasis de la Ghouta, au bord du désert de Syrie, à environ 217 km au nord-nord-est de Jérusalem en ligne droite ; le point de la carte est sur la Vieille Ville. Elle est habitée depuis des millénaires et compte parmi les plus anciennes villes continûment habitées du monde. La longueur de la route de Jérusalem, et le lieu où Paul fut converti sur elle, sont traités dans des questions à part."
    - "La Genèse connaît déjà la ville : l’héritier d’Abram devait être « Éliézer de Damas ». À partir du Xe siècle av. J.-C. environ, elle fut la capitale d’Aram, le royaume qui combattit Israël pendant deux siècles : Rezon et sa bande s’en emparèrent au temps de Salomon et « ils régnèrent à Damas », Ben-Hadad et Hazaël guerroyèrent contre Achab et ses fils, et Élisée « se rendit à Damas » quand Ben-Hadad était malade. Naaman, le chef syrien, dédaigna le Jourdain : « Les fleuves de Damas, l’Abana et le Parpar, ne valent-ils pas mieux que toutes les eaux d’Israël ? » L’Abana est le Barada. En 732 av. J.-C., Tiglath-Piléser III, appelé par Achaz de Juda, « monta contre Damas, la prit, emmena les habitants en captivité à Kir, et fit mourir Retsin », comme Ésaïe l’avait annoncé : « Damas ne sera plus une ville, elle ne sera qu’un monceau de ruines. »"
    - "La ville se releva, et dans le Nouveau Testament elle avait des synagogues et une communauté juive assez grande pour que Saul y cherche des croyants. Près de la ville il vit la lumière du ciel ; à Damas, Ananias le trouva dans « la rue qu’on appelle la droite », qui traverse encore la Vieille Ville d’est en ouest sur le tracé de la grande rue romaine, et il s’échappa plus tard par-dessus la muraille dans une corbeille. Le grand temple romain de Jupiter devint une église puis, au début du VIIIe siècle, la mosquée des Omeyyades, qui se dresse toujours au même endroit."
  pl:
    - "Damaszek z Biblii to to samo miasto co dzisiejsza stolica Syrii: leży na płaskowyżu na wschód od gór Antylibanu, gdzie rzeka Barada rozlewa się w oazę Ghuta na skraju pustyni syryjskiej, około 217 km na północ-północny wschód od Jerozolimy w linii prostej; punkt na mapie stoi na Starym Mieście. Jest zamieszkany od tysięcy lat i należy do najstarszych nieprzerwanie zamieszkanych miast świata. Jak długa była droga z Jerozolimy i gdzie na niej nawrócił się Paweł, opowiadają osobne pytania."
    - "Księga Rodzaju zna już to miasto: spadkobiercą Abrama miał być „ten Damaszczeński Eliezer”. Od około X wieku p.n.e. było stolicą Aramu, królestwa, które walczyło z Izraelem przez dwa wieki: Rezon ze swoją drużyną zdobył je za dni Salomona i „królowali nad Damaszkiem”, Ben-Hadad i Chazael wojowali z Achabem i jego synami, a gdy Ben-Hadad chorował, „Przyszedł Elizeusz do Damaszku”. Naaman, syryjski wódz, wzgardził Jordanem: „Azaż nie lepsze są rzeki Abana i Farfar w Damaszku nad wszystkie wody Izraelskie?” Abana to Barada. W 732 p.n.e. Tiglat-Pileser III, wezwany przez Achaza z Judy, „przyciągnąwszy król Assyryjski pod Damaszek wziął go, i przeniósł obywatele jego do Chyr, a Rasyna zabił”, jak zapowiedział Izajasz: „Oto Damaszek przestanie być miastem, a stanie się kupą rumu.”"
    - "Miasto się podniosło i w Nowym Testamencie miało synagogi i społeczność żydowską dość dużą, by Szaweł szukał tam wierzących. W pobliżu miasta ujrzał światło z nieba; w Damaszku Ananiasz został posłany na „ulicę, którą zowią prostą”, by go odnaleźć, a ulica ta wciąż przecina Stare Miasto ze wschodu na zachód jako linia rzymskiej głównej ulicy; później uciekł przez mur w koszu. Wielka rzymska świątynia Jowisza stała się kościołem, a na początku VIII wieku Meczetem Umajjadów, który wciąż stoi w tym samym miejscu."
  it:
    - "La Damasco della Bibbia è la stessa città dell’odierna capitale della Siria: sorge su un altopiano a est dei monti dell’Antilibano, dove il fiume Barada si spande nell’oasi della Ghuta al margine del deserto siriano, a circa 217 km a nord-nord-est di Gerusalemme in linea retta; il punto della mappa sta sulla Città Vecchia. È abitata da millenni ed è una delle più antiche città del mondo abitate senza interruzione. Quanto fosse lunga la strada da Gerusalemme, e dove Paolo si convertì su di essa, è detto in domande separate."
    - "La Genesi conosce già la città: l’erede di Abramo doveva essere «Eliezer di Damasco». Dal X secolo a.C. circa fu la capitale di Aram, il regno che combatté Israele per due secoli: Rezon la prese ai giorni di Salomone, e lui e i suoi «regnarono in Damasco», Ben-Adad e Cazaèl guerreggiarono con Acab e i suoi figli, ed Eliseo «si recò a Damasco» quando Ben-Adad era malato. Naaman, il comandante siro, disprezzò il Giordano: «I fiumi di Damasco, l’Abanah e il Farpar, non son essi migliori di tutte le acque d’Israele?» L’Abana è il Barada. Nel 732 a.C. Tiglat-Pilèser III, chiamato da Acaz di Giuda, «salì contro Damasco, la prese, ne menò gli abitanti in cattività a Kir, e fece morire Retsin», come Isaia aveva predetto: «Ecco, Damasco è tolto dal numero delle città, e non sarà più che un ammasso di rovine»."
    - "La città si riprese, e nel Nuovo Testamento aveva sinagoghe e una comunità ebraica abbastanza grande perché Saul vi cercasse dei credenti. Presso la città vide la luce dal cielo; a Damasco Anania lo trovò «nella strada detta Diritta», che attraversa ancora la Città Vecchia da est a ovest sul tracciato della via principale romana, e più tardi egli fuggì oltre il muro in una cesta. Il grande tempio romano di Giove divenne una chiesa e, all’inizio dell’VIII secolo, la Moschea degli Omayyadi, che sorge ancora nello stesso luogo."
  nl:
    - "Het Damascus van de Bijbel is dezelfde stad als de huidige hoofdstad van Syrië: het ligt op een plateau ten oosten van het Anti-Libanongebergte, waar de rivier de Barada zich uitspreidt tot de oase Ghouta aan de rand van de Syrische woestijn, hemelsbreed ongeveer 217 km noord-noordoostelijk van Jeruzalem; het punt op de kaart staat op de Oude Stad. Het wordt al duizenden jaren bewoond en is een van de oudste onafgebroken bewoonde steden ter wereld. Hoe lang de weg van Jeruzalem was en waar Paulus daarop werd bekeerd, staat in afzonderlijke vragen."
    - "Genesis kent de stad al: Abrams erfgenaam zou “deze Damaskener Eliëzer” zijn. Vanaf ca. de 10e eeuw v.Chr. was zij de hoofdstad van Aram, het koninkrijk dat twee eeuwen tegen Israël streed: Rezon greep haar in Salomo’s dagen, en hij en zijn bende “regeerden in Damaskus”, Ben-Hadad en Hazaël voerden oorlog met Achab en zijn zonen, en Elisa “kwam te Damaskus” toen Ben-Hadad ziek was. De Syrische bevelhebber Naäman versmaadde de Jordaan: “Zijn niet Abana en Farpar, de rivieren van Damaskus, beter dan alle wateren van Israel?” De Abana is de Barada. In 732 v.Chr. trok Tiglat-Pileser III, door Achaz van Juda ingeroepen, op: “de koning van Assyrie toog op tegen Damaskus, en nam haar in, en voerde hen gevankelijk naar Kir, en hij doodde Rezin”, zoals Jesaja had voorzegd: “Damaskus zal weggenomen worden, dat zij geen stad meer zij, maar zij zal een vervallen steenhoop zijn.”"
    - "De stad herstelde zich, en in het Nieuwe Testament had zij synagogen en een Joodse gemeenschap die groot genoeg was voor Saulus om er gelovigen te zoeken. Bij de stad zag hij het licht uit de hemel; in Damascus vond Ananias hem in “de straat, genaamd de Rechte”, die nog steeds de Oude Stad van oost naar west doorkruist als de lijn van de Romeinse hoofdstraat, en later ontkwam hij in een mand over de muur. De grote Romeinse tempel van Jupiter werd een kerk en, in het begin van de achtste eeuw, de Omajjadenmoskee, die nog op dezelfde plaats staat."
  cs:
    - "Biblický Damašek je totéž město jako dnešní hlavní město Sýrie: stojí na planině východně od pohoří Antilibanon, kde se řeka Barada rozlévá do oázy Ghúta na okraji syrské pouště, asi 217 km severoseverovýchodně od Jeruzaléma vzdušnou čarou; bod na mapě stojí na Starém Městě. Je obydleno tisíce let a je jedním z nejstarších nepřetržitě obydlených měst světa. Jak dlouhá byla cesta z Jeruzaléma a kde se na ní Pavel obrátil, vyprávějí samostatné otázky."
    - "Genesis už město zná: Abramovým dědicem měl být „Damašský Eliezer“. Asi od 10. století př. n. l. bylo hlavním městem Aramu, království, které dvě století bojovalo s Izraelem: Rezon se ho zmocnil za Šalomounových dnů a „kralovali v Damašku“, Ben-hadad a Chazael válčili s Achabem a jeho syny a o Elíšovi se praví: „Potom přišel Elizeus do Damašku“, když Benadad stonal. Námán, syrský velitel, pohrdl Jordánem: „Zdali nejsou lepší Abana a Farfar, řeky Damašské, nad všecky vody Izraelské?“ Abana je Barada. Roku 732 př. n. l. Tiglatpilesar III., povolaný Achazem Judským, „přitáhl k Damašku a dobyl ho, a přenesl obyvatele jeho do Kir, Rezina pak zabil“, jak předpověděl Izajáš: „Aj, Damašek přestane býti městem, a bude hromadou rumu.“"
    - "Město se vzpamatovalo a v Novém zákoně mělo synagogy a židovskou obec dost velkou, aby tam Saul hledal věřící. Blízko města uviděl světlo z nebe; v Damašku jej Ananiáš našel v ulici, o níž Skutky říkají „ulice, kteráž slove Přímá“, která dosud protíná Staré Město od východu k západu jako linie římské hlavní třídy, a později uprchl přes hradbu v koši. Velký římský chrám Jupitera se stal kostelem a počátkem 8. století umajjovskou mešitou, která dosud stojí na témže místě."
  sv:
    - "Bibelns Damaskus är samma stad som dagens huvudstad i Syrien: den ligger på en platå öster om Antilibanonbergen, där floden Barada breder ut sig i oasen Ghouta vid kanten av den syriska öknen, omkring 217 km nord-nordost om Jerusalem fågelvägen; kartpunkten står på gamla staden. Den har varit bebodd i tusentals år och är en av världens äldsta kontinuerligt bebodda städer. Hur lång vägen från Jerusalem var, och var Paulus omvändes på den, berättas i separata frågor."
    - "1 Mosebok känner redan staden: Abrams arvinge skulle bli ”en man från Damaskus, Elieser”. Från omkring 900-talet f.Kr. var den huvudstad i Aram, kungariket som stred mot Israel i två århundraden: Reson tog den på Salomos tid och ”gjorde sig till herrar i Damaskus”, Ben-Hadad och Hasael låg i krig med Achav och hans söner, och Elisha ”kom till Damaskus” när Ben-Hadad låg sjuk. Naaman, den syriske befälhavaren, föraktade Jordan: ”Äro icke Damaskus’ floder, Abana och Parpar, bättre än alla vatten i Israel?” Avana är Barada. År 732 f.Kr. ”drog upp mot Damaskus och intog det och förde bort folket till Kir och dödade Resin” Tiglat-Pileser III, tillkallad av Achas av Juda, som Jesaja hade förutsagt: ”Se, Damaskus skall upphöra att vara en stad; det skall falla och bliva en stenhop.”"
    - "Staden återhämtade sig, och i Nya testamentet hade den synagogor och ett judiskt samfund stort nog för att Saul skulle söka troende där. Nära staden såg han skenet från himlen; i Damaskus fann Ananias honom i ”den gata som kallas Raka gatan”, som fortfarande korsar gamla staden från öst till väst som linjen för den romerska huvudgatan, och senare undkom han över muren i en korg. Det stora romerska Jupitertemplet blev en kyrka och, i början av 700-talet, Umayyadmoskén, som fortfarande står på samma plats."
  nb:
    - "Bibelens Damaskus er den samme byen som dagens hovedstad i Syria: den ligger på et platå øst for Anti-Libanon-fjellene, der elven Barada brer seg ut i Ghouta-oasen ved kanten av den syriske ørkenen, omtrent 217 km nord-nordøst for Jerusalem i luftlinje; kartpunktet står på gamlebyen. Den har vært bebodd i tusener av år og er en av verdens eldste sammenhengende bebodde byer. Hvor lang veien fra Jerusalem var, og hvor Paulus ble omvendt på den, fortelles i egne spørsmål."
    - "1 Mosebok kjenner allerede byen: Abrams arving skulle være «Elieser fra Damaskus». Fra omkring 900-tallet f.Kr. var den hovedstad i Aram, kongeriket som kjempet mot Israel i to århundrer: Reson grep den på Salomos tid og «gjorde sig til herrer i Damaskus», Ben-Hadad og Hasael førte krig med Ahab og hans sønner, og Elisja «kom til Damaskus» da Ben-Hadad var syk. Naaman, den syriske hærføreren, forkastet Jordan: «Er ikke elvene ved Damaskus, Abana og Parpar, bedre enn alle Israels vann?» Abana er Barada. I 732 f.Kr. Tiglat-Pileser III, tilkalt av Ahas av Juda, «drog op og inntok Damaskus og bortførte innbyggerne til Kir og drepte Resin», slik Jesaja hadde forutsagt: «Damaskus skal ophøre å være en by og bli til en grusdynge.»"
    - "Byen kom seg igjen, og i Det nye testamente hadde den synagoger og et jødisk samfunn stort nok til at Saul søkte troende der. Nær byen så han lyset fra himmelen; i Damaskus fant Ananias ham i «den gate som kalles den rette», som fortsatt krysser gamlebyen fra øst til vest som linjen til den romerske hovedgaten, og senere slapp han unna over muren i en kurv. Det store romerske tempelet for Jupiter ble en kirke og, tidlig på 700-tallet, Umayyad-moskeen, som fortsatt står på samme sted."
  tl:
    - "Ang Damasco ng Biblia ay ang parehong lungsod ng kabisera ng Siria ngayon: nakatayo ito sa talampas sa silangan ng mga bundok ng Anti-Libano, kung saan kumakalat ang ilog Barada sa oasis ng Ghouta sa gilid ng disyerto ng Siria, mga 217 km sa hilaga-hilagang-silangan ng Jerusalem sa tuwid na guhit; ang tuldok sa mapa ay nasa Lumang Lungsod. Tinitirhan ito nang libu-libong taon at isa sa pinakamatatandang lungsod sa daigdig na patuloy na tinitirhan. Kung gaano kahaba ang daan mula sa Jerusalem, at kung saan nagbago ng loob si Pablo roon, ay isinasalaysay sa hiwalay na mga tanong."
    - "Kilala na ng Genesis ang lungsod: ang tagapagmana ni Abram ay “itong taga Damascong si Eliezer”. Mula mga ikasampung siglo BK, ito ang kabisera ng Aram, ang kahariang lumaban sa Israel sa loob ng dalawang siglo: inagaw ito ni Rezon noong panahon ni Salomon at “naghari sa Damasco”, nakipagdigma sina Ben-adad at Hazael kay Achab at sa kaniyang mga anak, at si Eliseo ay “naparoon sa Damasco” nang may sakit si Ben-adad. Hinamak ni Naaman, ang pinunong Siryano, ang Jordan: “Hindi ba ang Abana at ang Pharphar, na mga ilog ng Damasco, ay mainam kay sa lahat ng tubig sa Israel?” Ang Abana ay ang Barada. Noong 732 BK, si Tiglath-pileser III, na tinawag ni Achaz ng Juda, ay “umahon laban sa Damasco, at sinakop, at dinala sa Cir ang bayan na bihag, at pinatay si Resin”, gaya ng hinulaan ni Isaias: “ang Damasco ay naalis sa pagkabayan, at magiging isang buntong ginto.”"
    - "Nakabawi ang lungsod, at sa Bagong Tipan ay may mga sinagoga ito at pamayanang Judio na sapat ang laki upang hanapin doon ni Saul ang mga mananampalataya. Malapit sa lungsod nakita niya ang ilaw mula sa langit; sa Damasco nasumpungan siya ni Ananias sa “lansangang tinatawag na Matuwid”, na tumatawid pa rin sa Lumang Lungsod mula silangan hanggang kanluran bilang linya ng pangunahing kalye ng mga Romano, at kalaunan ay tumakas siya sa pader sa isang balaong. Ang malaking templong Romano ni Jupiter ay naging simbahan at, sa maagang ikawalong siglo, ang Moske ng Umayyad, na nakatayo pa rin sa parehong pook."
  da:
    - "Bibelens Damaskus er den samme by som nutidens hovedstad i Syrien: den ligger på et plateau øst for Antilibanon-bjergene, hvor floden Barada breder sig ud i Ghouta-oasen ved kanten af den syriske ørken, omkring 217 km nordnordøst for Jerusalem i luftlinje; kortets punkt står på Gamlebyen. Den har været beboet i tusinder af år og er en af verdens ældste vedvarende beboede byer. Hvor lang vejen fra Jerusalem var, og hvor Paulus blev omvendt på den, fortælles i særskilte spørgsmål."
    - "Første Mosebog kender allerede byen: Abrams arving skulle være »Elieser af Damaskus«. Fra omkring 900-tallet f.Kr. var den hovedstad i Aram, kongeriget, der kæmpede mod Israel i to århundreder: Rezon greb den i Salomos tid og »regerede i Damaskus«, Ben-Hadad og Hazael førte krig mod Akab og hans sønner, og da Ben-Hadad var syg, »kom Elisa til Damaskus«. Na'aman, den syriske øverstbefalende, foragtede Jordan: »Ere ikke Floderne Abana og Farfar i Damaskus bedre, end alle Vandene i Israel?« Abana er Barada. I 732 f.Kr. kom Tiglat-Pileser III, tilkaldt af Akaz af Juda, og »drog op til Damaskus og indtog den og førte dem bort til Kir, og han dræbte Rezin«, som Esajas havde forudsagt: »Damaskus skal ikke mere være en Stad, men den skal være en sammenstyrtet Stenhob.«"
    - "Byen kom sig, og i Det Nye Testamente havde den synagoger og et jødisk samfund, stort nok til, at Saul søgte troende dér. Nær byen så han lyset fra himlen; i Damaskus fandt Ananias ham i »den Gade, som kaldes den lige«, som stadig krydser Gamlebyen fra øst til vest som linjen af den romerske hovedgade, og han slap senere over muren i en kurv. Det store romerske Jupiter-tempel blev til en kirke og i begyndelsen af 700-tallet til Umayyad-moskeen, som stadig står på samme sted."
