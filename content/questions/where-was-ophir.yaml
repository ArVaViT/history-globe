id: where-was-ophir
question:
  en: "Where was Ophir?"
  ru: "Где находился Офир?"
  uk: "Де був Офір?"
  es: "¿Dónde estaba Ofir?"
  pt: "Onde ficava Ofir?"
  de: "Wo lag Ofir?"
  fr: "Où se trouvait Ophir ?"
  pl: "Gdzie leżał Ofir?"
  it: "Dov’era Ofir?"
  cs: "Kde ležel Ofír?"
  nl: "Waar lag Ofir?"
  sv: "Var låg Ofir?"
  nb: "Hvor lå Ofir?"
answer:
  en:
    - "Ophir, the land of Solomon's gold, has never been found. Three regions are proposed: south-western Arabia, where the map point stands, about 1,471 km from Ezion-geber in a straight line; the African coast of the Red Sea and the Horn of Africa, the Punt of the Egyptians; and India, the answer of the ancient translators. Each rests on a different clue, and none is proved."
    - "Kings says that “king Solomon made a navy of ships in Ezion-geber, which is beside Eloth, on the shore of the Red sea”, manned by Hiram's sailors, and “they came to Ophir, and fetched from thence gold, four hundred and twenty talents”; the same fleet brought “great plenty of almug trees, and precious stones”. The gold of Ophir became proverbial, and an ostracon of the eighth century BC from Tell Qasile near Tel Aviv records “gold of Ophir for Beth-horon, thirty shekels”, so the name was a real mark of origin. Genesis 10 lists Ophir among the sons of Joktan beside Sheba and Havilah, the tribes of southern Arabia, which is the ground for the Arabian answer."
    - "The Septuagint renders Ophir with forms such as Sophira, and Josephus says outright that the land of old called Sopheira, now the land of gold, was in India; the apes and peacocks of Solomon's trade come from that direction, though the text ascribes them to the ships of Tarshish. The African answer rests on Egypt's voyages to Punt for gold and incense, which must have gone the same way down the Red Sea. The nineteenth-century claim that Great Zimbabwe was Ophir has long been abandoned. The map shows Arabia and names the other candidates on the place card."
  ru:
    - "Офир, страну Соломонова золота, так и не нашли. Предлагают три области: юго-западную Аравию, где стоит точка на карте, примерно в 1471 км от Ецион-Гавера по прямой; африканский берег Красного моря и Африканский Рог — египетский Пунт; и Индию — ответ древних переводчиков. Каждый опирается на свою зацепку, и ни один не доказан."
    - "Книга Царств говорит, что Соломон «сделал корабль в Ецион-Гавере, что при Елафе, на берегу Чермного моря», с корабельщиками Хирама, «и отправились они в Офир, и взяли оттуда золота четыреста двадцать талантов»; тот же флот привёз «великое множество красного дерева и драгоценных камней». Золото Офира вошло в пословицу, а черепок VIII века до н. э. из Телль-Касиле близ Тель-Авива записывает «золото Офира для Бет-Хорона, тридцать сиклей» — значит, имя было настоящей отметкой происхождения. Бытие 10 ставит Офира среди сыновей Иоктана рядом с Савой и Хавилой, племенами южной Аравии; на этом стоит аравийский ответ."
    - "Септуагинта передаёт Офир формами вроде Софира, а Иосиф Флавий прямо пишет, что страна, прежде называвшаяся Софирой, а ныне Золотой землёй, лежит в Индии; обезьяны и павлины Соломоновой торговли идут с той стороны, хотя текст приписывает их фарсисским кораблям. Африканский ответ опирается на плавания египтян в Пунт за золотом и благовониями — тем же путём вниз по Красному морю. Утверждение XIX века, будто Офир — это Большой Зимбабве, давно оставлено. Карта показывает Аравию, а других кандидатов называет в карточке."
  uk:
    - "Офір, країну Соломонового золота, ніколи не знайдено. Пропонують три області: південно-західну Аравію, де стоїть точка на мапі, приблизно за 1471 км від Еціон-Гевера по прямій; африканське узбережжя Червоного моря й Африканський Ріг, Пунт єгиптян; та Індію — відповідь давніх перекладачів. Кожна спирається на інший доказ, і жодна не доведена."
    - "Книга Царів каже, що «Побудував царь Соломон і кораблї в Асіонгабері, коло Елота, на березї Червоного моря», з екіпажами Хірама, і «прибули вони в Офир, і взяли звідти золота чотириста й двайцять талантів»; той самий флот привіз «велике множество червоного дерева й благородного каміння». Офірське золото стало прислів'ям, а острак VIII ст. до н. е. з Телль-Касіле поблизу Тель-Авіва записує «золото Офіру для Бет-Хорона, тридцять шекелів», тож назва була справжньою ознакою походження. Книга Буття 10 перелічує Офір серед синів Йоктана поряд із Шевою та Хавілою, племенами південної Аравії, що є підставою для арабської відповіді."
    - "Септуагінта передає Офір формами на кшталт Софіра, а Йосиф Флавій прямо каже, що країна, яку давно називали Софейрою, нині країна золота, була в Індії; мавпи й павичі Соломонової торгівлі надходять з того боку, хоч текст приписує їх кораблям Тарсису. Африканська відповідь спирається на єгипетські плавання до Пунту по золото й пахощі, які мали йти тим самим шляхом уздовж Червоного моря. Твердження XIX ст., що Велике Зімбабве було Офіром, давно відкинуте. Мапа показує Аравію, а інших кандидатів називає в картці місця."
  es:
    - "Ofir, la tierra del oro de Salomón, nunca se ha hallado. Se proponen tres regiones: el suroeste de Arabia, donde está el punto del mapa, a unos 1471 km de Ezión-geber en línea recta; la costa africana del mar Rojo y el Cuerno de África, el Punt de los egipcios; y la India, la respuesta de los traductores antiguos. Cada una se apoya en un indicio distinto, y ninguna está demostrada."
    - "Reyes dice que «Hizo también el rey Salomón navíos en Ezión-geber, que es junto á Elath en la ribera del mar Bermejo», tripulados por marineros de Hiram, y que «fueron á Ophir, y tomaron de allí oro, cuatrocientos y veinte talentos»; la misma flota trajo «muy mucha madera de brasil, y piedras preciosas». El oro de Ofir se hizo proverbial, y un óstracon del siglo VIII a. C. de Tell Qasile, cerca de Tel Aviv, registra «oro de Ofir para Bet-horón, treinta siclos», de modo que el nombre era una verdadera marca de origen. Génesis 10 enumera a Ofir entre los hijos de Joctán, junto a Seba y Havila, las tribus del sur de Arabia, que es el fundamento de la respuesta arábiga."
    - "La Septuaginta vierte Ofir con formas como Sophira, y Josefo dice sin rodeos que la tierra llamada antiguamente Sopheira, ahora la tierra del oro, estaba en la India; los simios y los pavos reales del comercio de Salomón vienen de esa dirección, aunque el texto los atribuye a las naves de Tarsis. La respuesta africana se apoya en los viajes de Egipto a Punt en busca de oro e incienso, que debieron de seguir el mismo camino por el mar Rojo. La afirmación del siglo XIX de que el Gran Zimbabue era Ofir hace tiempo que se abandonó. El mapa muestra Arabia y nombra los demás candidatos en la ficha del lugar."
  pt:
    - "Ofir, a terra do ouro de Salomão, nunca foi encontrada. Três regiões são propostas: o sudoeste da Arábia, onde está o ponto do mapa, a cerca de 1.471 km de Eziom-Geber em linha reta; a costa africana do mar Vermelho e o Chifre da África, o Punte dos egípcios; e a Índia, a resposta dos antigos tradutores. Cada uma se apoia em um indício diferente, e nenhuma está provada."
    - "Reis diz que “o rei Salomão fez uma frota de navios em Eziom-Geber, que fica perto de Elate, na margem do mar Vermelho”, tripulados por marinheiros de Hirão, e “Eles foram a Ofir, e buscaram de lá ouro, quatrocentos e vinte talentos”; a mesma frota trouxe “grandes quantidades de árvores de almogue e pedras preciosas”. O ouro de Ofir tornou-se proverbial, e um óstraco do século VIII a.C. de Tell Qasile, perto de Tel Aviv, registra “ouro de Ofir para Bete-Horom, trinta siclos”, de modo que o nome era uma marca real de origem. Gênesis 10 relaciona Ofir entre os filhos de Joctã, ao lado de Sabá e Havilá, as tribos do sul da Arábia, o que fundamenta a resposta arábica."
    - "A Septuaginta traduz Ofir por formas como Sofira, e Josefo diz claramente que a terra antigamente chamada Sofeira, hoje a terra do ouro, ficava na Índia; os macacos e pavões do comércio de Salomão vêm dessa direção, embora o texto os atribua às naus de Társis. A resposta africana se apoia nas viagens do Egito a Punte em busca de ouro e incenso, que devem ter seguido o mesmo caminho pelo mar Vermelho. A afirmação do século XIX de que o Grande Zimbábue era Ofir foi abandonada há muito tempo. O mapa mostra a Arábia e nomeia os outros candidatos na ficha do lugar."
  de:
    - "Ofir, das Land von Salomos Gold, ist nie gefunden worden. Drei Regionen werden vorgeschlagen: der Südwesten Arabiens, wo der Kartenpunkt steht, in der Luftlinie etwa 1471 km von Ezjon-Geber; die afrikanische Küste des Roten Meeres und das Horn von Afrika, das Punt der Ägypter; und Indien, die Antwort der antiken Übersetzer. Jede beruht auf einem anderen Hinweis, und keine ist bewiesen."
    - "Die Königsbücher sagen: „Und Salomo machte auch Schiffe zu Ezeon-Geber, das bei Eloth liegt am Ufer des Schilfmeers“, bemannt mit Hirams Schiffsleuten, und „sie kamen gen Ophir und holten daselbst vierhundertzwanzig Zentner Gold“; dieselbe Flotte brachte „sehr viel Sandelholz und Edelgestein“. Das Gold von Ofir wurde sprichwörtlich, und ein Ostrakon des 8. Jahrhunderts v. Chr. aus Tell Qasile bei Tel Aviv verzeichnet „Gold aus Ofir für Bet-Horon, 30 Schekel“, der Name war also eine echte Herkunftsbezeichnung. 1. Mose 10 führt Ofir unter den Söhnen Joktans neben Scheba und Hawila auf, den Stämmen Südarabiens, was der Grund für die arabische Antwort ist."
    - "Die Septuaginta gibt Ofir mit Formen wie Sophira wieder, und Josephus sagt geradeheraus, das Land, das einst Sopheira hieß und nun das Goldland ist, liege in Indien; die Affen und Pfauen von Salomos Handel kommen aus dieser Richtung, auch wenn der Text sie den Tarsisschiffen zuschreibt. Die afrikanische Antwort beruht auf Ägyptens Fahrten nach Punt um Gold und Weihrauch, die denselben Weg das Rote Meer hinab genommen haben müssen. Die Behauptung des 19. Jahrhunderts, Groß-Simbabwe sei Ofir gewesen, ist längst aufgegeben. Die Karte zeigt Arabien und nennt die anderen Kandidaten auf der Ortskarte."
  fr:
    - "Ophir, le pays de l’or de Salomon, n’a jamais été retrouvé. Trois régions sont proposées : le sud-ouest de l’Arabie, où se trouve le point de la carte, à environ 1 471 km d’Étsjon-Guéber à vol d’oiseau ; la côte africaine de la mer Rouge et la Corne de l’Afrique, le Pount des Égyptiens ; et l’Inde, réponse des traducteurs anciens. Chacune repose sur un indice différent, et aucune n’est prouvée."
    - "Le livre des Rois dit que « Le roi Salomon construisit des navires à Étsjon-Guéber, près d’Éloth, sur les bords de la mer Rouge », montés par les matelots de Hiram, et que « Ils allèrent à Ophir, et ils y prirent de l’or, quatre cent vingt talents » ; la même flotte rapporta « une grande quantité de bois de sandal et des pierres précieuses ». L’or d’Ophir devint proverbial, et un ostracon du VIIIe siècle av. J.-C. provenant de Tell Qasile, près de Tel Aviv, mentionne « or d’Ophir pour Beth-Horon, trente sicles » : le nom était donc une véritable marque d’origine. Genèse 10 range Ophir parmi les fils de Joktan, à côté de Schéba et de Havila, tribus de l’Arabie du Sud, ce qui fonde la réponse arabe."
    - "La Septante rend Ophir par des formes telles que Sophira, et Flavius Josèphe dit sans détour que le pays appelé autrefois Sopheira, aujourd’hui le pays de l’or, se trouvait en Inde ; les singes et les paons du commerce de Salomon viennent de cette direction, bien que le texte les attribue aux navires de Tarsis. La réponse africaine s’appuie sur les voyages de l’Égypte au Pount pour l’or et l’encens, qui ont dû suivre la même route le long de la mer Rouge. L’affirmation du XIXe siècle selon laquelle le Grand Zimbabwe serait Ophir est abandonnée depuis longtemps. La carte montre l’Arabie et nomme les autres candidats sur la fiche du lieu."
  pl:
    - "Ofiru, kraju złota Salomona, nigdy nie odnaleziono. Proponuje się trzy regiony: południowo-zachodnią Arabię, gdzie stoi punkt na mapie, około 1471 km od Esjon-Geber w linii prostej; afrykańskie wybrzeże Morza Czerwonego i Róg Afryki, egipski Punt; oraz Indie, odpowiedź starożytnych tłumaczy. Każda opiera się na innej wskazówce i żadna nie jest dowiedziona."
    - "Księga Królewska mówi, że „okrętów też nabudował król Salomon w Asyjongaber, które jest podle Elotu, nad brzegiem morza czerwonego”, obsadzonych żeglarzami Hirama, i że „przypłynąwszy do Ofir, wzięli stamtąd złota cztery sta i dwadzieścia talentów”; ta sama flota przywiozła „drzewa almugimowego bardzo wiele i kamienia drogiego”. Złoto z Ofiru stało się przysłowiowe, a ostrakon z VIII wieku p.n.e. z Tell Qasile koło Tel Awiwu zapisuje „złoto z Ofiru dla Bet-Choron, trzydzieści syklów”, więc nazwa była prawdziwym oznaczeniem pochodzenia. Rdz 10 wymienia Ofira wśród synów Joktana obok Szeby i Chawili, plemion południowej Arabii, co jest podstawą odpowiedzi arabskiej."
    - "Septuaginta oddaje Ofir formami takimi jak Sofira, a Józef Flawiusz mówi wprost, że kraina zwana dawniej Sofeira, a teraz krajem złota, leżała w Indiach; małpy i pawie z handlu Salomona pochodzą z tamtego kierunku, choć tekst przypisuje je okrętom Tarszisz. Odpowiedź afrykańska opiera się na wyprawach Egiptu do Puntu po złoto i kadzidło, które musiały iść tą samą drogą w dół Morza Czerwonego. Dziewiętnastowieczne twierdzenie, że Wielkie Zimbabwe było Ofirem, dawno porzucono. Mapa pokazuje Arabię, a inne kandydatury wymienia na karcie miejsca."
  it:
    - "Ofir, la terra dell’oro di Salomone, non è mai stata trovata. Si propongono tre regioni: l’Arabia sud-occidentale, dove si trova il punto della mappa, a circa 1.471 km da Ezion-Gheber in linea d’aria; la costa africana del Mar Rosso e il Corno d’Africa, il Punt degli Egiziani; e l’India, la risposta degli antichi traduttori. Ognuna poggia su un indizio diverso, e nessuna è provata."
    - "I Re dicono che «il re Salomone costruì anche una flotta ad Etsion-Gheber, presso Eloth, sul lido del mar Rosso», equipaggiata dai marinai di Chiram, e che «andarono ad Ofir, vi presero dell’oro, quattrocentoventi talenti»; la stessa flotta portò «del legno di sandalo in grandissima quantità, e delle pietre preziose». L’oro di Ofir divenne proverbiale, e un ostrakon dell’VIII secolo a.C. da Tell Qasile presso Tel Aviv registra «oro di Ofir per Bet-Oron, trenta sicli», così che il nome era un reale marchio d’origine. Gen 10 elenca Ofir tra i figli di Ioktan accanto a Saba e Avila, le tribù dell’Arabia meridionale, il che è il fondamento della risposta araba."
    - "La Settanta rende Ofir con forme come Sophira, e Giuseppe Flavio dice apertamente che la terra anticamente chiamata Sopheira, ora terra dell’oro, era in India; le scimmie e i pavoni del commercio di Salomone provengono da quella direzione, benché il testo li attribuisca alle navi di Tarsis. La risposta africana si fonda sui viaggi dell’Egitto al Punt per l’oro e l’incenso, che dovevano seguire la stessa via lungo il Mar Rosso. La tesi ottocentesca che il Grande Zimbabwe fosse Ofir è stata abbandonata da tempo. La mappa mostra l’Arabia e nomina gli altri candidati nella scheda del luogo."
  cs:
    - "Ofír, země Šalomounova zlata, nebyl nikdy nalezen. Navrhují se tři oblasti: jihozápadní Arábie, kde stojí bod na mapě, vzdušnou čarou asi 1 471 km od Ecjon-gebera; africké pobřeží Rudého moře a Africký roh, Punt Egypťanů; a Indie, odpověď starověkých překladatelů. Každá se opírá o jinou stopu a žádná není dokázána."
    - "Knihy Královské praví: „Nadělal také král Šalomoun lodí velikých v Aziongaber, kteréž jest podlé Elat, na břehu moře Rudého“, s námořníky Chíramovými, a ti „přeplavivše se do Ofir, nabrali tam zlata čtyři sta a dvadceti centnéřů“; táž flotila přivezla „dříví almugim velmi mnoho i kamení drahého“. Zlato z Ofíru se stalo pořekadlem a ostrakon z 8. století př. n. l. z Tell Qasile u Tel Avivu zaznamenává „zlato z Ofíru pro Bét-choron, třicet šekelů“, takže jméno bylo skutečnou značkou původu. Genesis 10 uvádí Ofíra mezi syny Joktanovými vedle Šeby a Chavíly, kmenů jižní Arábie, což je základ arabské odpovědi."
    - "Septuaginta překládá Ofír tvary jako Sophira a Josephus výslovně říká, že země dříve zvaná Sopheira, nyní země zlata, byla v Indii; opice a pávi Šalomounova obchodu přicházejí z tohoto směru, ačkoli je text přisuzuje lodím taršíšským. Africká odpověď se opírá o egyptské plavby do Puntu pro zlato a kadidlo, které musely jít touž cestou dolů Rudým mořem. Tvrzení z 19. století, že Ofírem bylo Velké Zimbabwe, bylo dávno opuštěno. Mapa ukazuje Arábii a ostatní kandidáty uvádí na kartě místa."
  nl:
    - "Ofir, het land van Salomo's goud, is nooit gevonden. Er worden drie gebieden voorgesteld: het zuidwesten van Arabië, waar het punt op de kaart staat, hemelsbreed ongeveer 1471 km van Ezeon-Geber; de Afrikaanse kust van de Rode Zee en de Hoorn van Afrika, het Punt van de Egyptenaren; en Indië, het antwoord van de antieke vertalers. Elk berust op een andere aanwijzing, en geen is bewezen."
    - "Koningen vertelt: “De koning Salomo maakte ook schepen te Ezeon-Geber, dat bij Eloth is, aan den oever der Schelfzee”, bemand door de zeelieden van Hiram, en “zij kwamen te Ofir, en haalden van daar aan goud, vierhonderd en twintig talenten”; dezelfde vloot bracht “zeer veel almuggimhout en kostelijk gesteente”. Het goud van Ofir werd spreekwoordelijk, en een ostrakon uit de achtste eeuw v.Chr. uit Tell Qasile bij Tel Aviv vermeldt “goud van Ofir voor Beth-Horon, dertig sjekel”, dus de naam was een echt herkomstmerk. Gen. 10 noemt Ofir onder de zonen van Joktan naast Seba en Havila, de stammen van Zuid-Arabië, en dat is de grond voor het Arabische antwoord."
    - "De Septuaginta geeft Ofir weer met vormen als Sophira, en Josephus zegt met zoveel woorden dat het land dat vanouds Sopheira heette, nu het land van het goud, in Indië lag; de apen en pauwen van Salomo's handel komen uit die richting, hoewel de tekst ze toeschrijft aan de schepen van Tarsis. Het Afrikaanse antwoord berust op de tochten van Egypte naar Punt voor goud en wierook, die dezelfde weg langs de Rode Zee moeten hebben genomen. De bewering uit de negentiende eeuw dat Groot-Zimbabwe Ofir was, is allang verlaten. De kaart toont Arabië en noemt de andere kandidaten op de plaatskaart."
  sv:
    - "Ofir, landet för Salomos guld, har aldrig hittats. Tre regioner föreslås: sydvästra Arabien, där kartpunkten står, omkring 1 471 km från Esjon-Geber i fågelvägen; Sävhavets afrikanska kust och Afrikas horn, egyptiernas Punt; och Indien, de antika översättarnas svar. Var och en vilar på en egen ledtråd, och ingen är bevisad."
    - "Kungaböckerna säger att ”konung Salomo byggde ock en flotta i Esjon-Geber, som ligger vid Elot, på stranden av Röda havet”, bemannad av Hirams sjömän, och ”de foro till Ofir och hämtade därifrån guld, fyra hundra tjugu talenter”; samma flotta förde hem ”almugträ i stor myckenhet, ävensom ädla stenar”. Ofirs guld blev ordspråksmässigt, och ett ostrakon från 700-talet f.Kr. från Tell Qasile nära Tel Aviv anger ”Ofirguld till Bet-Horon, trettio sekel”, så namnet var ett verkligt ursprungsmärke. 1 Mos 10 räknar upp Ofir bland Joktans söner vid sidan av Saba och Havila, södra Arabiens stammar, vilket är grunden för det arabiska svaret."
    - "Septuaginta återger Ofir med former som Sophira, och Josefus säger rent ut att landet som fordom kallades Sopheira, nu guldlandet, låg i Indien; aporna och påfåglarna i Salomos handel kommer från det hållet, fastän texten tillskriver dem Tarshish-skeppen. Det afrikanska svaret vilar på Egyptens färder till Punt efter guld och rökelse, som måste ha gått samma väg ned längs Sävhavet. Påståendet från 1800-talet att Great Zimbabwe var Ofir har sedan länge övergivits. Kartan visar Arabien och nämner de andra kandidaterna på platskortet."
  nb:
    - "Ofir, landet med Salomos gull, er aldri funnet. Tre områder er foreslått: Sørvest-Arabia, der kartpunktet står, omtrent 1471 km fra Esjon-Geber i luftlinje; den afrikanske kysten av Rødehavet og Afrikas Horn, egypternes Punt; og India, svaret til de antikke oversetterne. Hvert av dem hviler på et ulikt spor, og ingen er bevist."
    - "Kongebøkene sier at «Kong Salomo lot også bygge skiber i Esjon-Geber, som ligger ved Elot på bredden av det Røde Hav», bemannet av Hirams sjøfolk, og «De kom til Ofir og hentet gull derfra, fire hundre og tyve talenter»; den samme flåten brakte «sandeltre i stor mengde og dyre stener». Ofirs gull ble ordspråklig, og et ostrakon fra 700-tallet f.Kr. fra Tell Qasile nær Tel Aviv oppgir «gull fra Ofir til Bet-Horon, tretti sekel», så navnet var et ekte opprinnelsesmerke. Første Mosebok 10 oppregner Ofir blant Joktans sønner ved siden av Sjeba og Havila, stammene i Sør-Arabia, noe som er grunnlaget for det arabiske svaret."
    - "Septuaginta gjengir Ofir med former som Sophira, og Josefus sier rett ut at landet som i gammel tid het Sopheira, nå gulllandet, lå i India; apene og påfuglene i Salomos handel kommer fra den kanten, selv om teksten tilskriver dem Tarsis-skipene. Det afrikanske svaret hviler på Egypts reiser til Punt etter gull og røkelse, som må ha gått samme vei ned Rødehavet. Påstanden fra 1800-tallet om at Great Zimbabwe var Ofir, er for lengst oppgitt. Kartet viser Arabia og nevner de andre kandidatene på stedskortet."
