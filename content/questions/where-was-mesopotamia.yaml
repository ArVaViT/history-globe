id: where-was-mesopotamia
question:
  en: "Where was Mesopotamia?"
  ru: "Где находилась Месопотамия?"
  uk: "Де була Месопотамія?"
  es: "¿Dónde estaba Mesopotamia?"
  pt: "Onde ficava a Mesopotâmia?"
  de: "Wo lag Mesopotamien?"
  fr: "Où se trouvait la Mésopotamie ?"
  pl: "Gdzie leżała Mezopotamia?"
  it: "Dov’era la Mesopotamia?"
  cs: "Kde ležela Mezopotámie?"
  nl: "Waar lag Mesopotamië?"
  sv: "Var låg Mesopotamien?"
  nb: "Hvor lå Mesopotamia?"
  tl: "Nasaan ang Mesopotamia?"
  da: "Hvor lå Mesopotamien?"
answer:
  en:
    - "Mesopotamia, Greek for “between the rivers”, is the land of the Euphrates and the Tigris, most of it in today's Iraq, with the north-east of Syria and the south-east of Turkey. In the Old Testament, though, the word stands for the Hebrew Aram-naharaim, “Aram of the two rivers”: only the upper country around Haran, between the great bend of the Euphrates and the Khabur. The map point stands there, on Haran, about 665 km north-east of Jerusalem in a straight line and about 690 km north-west of Babylon."
    - "This upper Mesopotamia was the home of Abraham's kin. His servant “went to Mesopotamia, unto the city of Nahor” to find a wife for Isaac, and Jacob later served Laban there for Leah and Rachel; the Synodal Bible renders Laban's Padan-aram as Mesopotamia too. Balaam was hired “of Pethor of Mesopotamia”, the Pitru of the Assyrian annals on the river Sajur near Carchemish, which lies about 90 km west of Haran; and in the days of the judges Israel served “Chushan-rishathaim king of Mesopotamia” eight years."
    - "The New Testament uses the word in its wider Greek sense, the whole land between the rivers down to the Persian Gulf. Among the crowd at Pentecost were “the dwellers in Mesopotamia”, the Jews of Babylonia, and Stephen says that God appeared to Abraham “when he was in Mesopotamia, before he dwelt in Charran”: for him Ur, far down the Euphrates, was Mesopotamia as well. Modern historians use the name in this wide sense, for the land of Ur, Babylon and Nineveh; Nineveh lies about 370 km east of Haran."
  ru:
    - "Месопотамия, по-гречески «Междуречье», — земля Евфрата и Тигра, бо́льшая часть которой лежит в нынешнем Ираке, вместе с северо-востоком Сирии и юго-востоком Турции. Но в Ветхом Завете это слово передаёт еврейское Арам-Нахараим, «Арам двух рек»: только верхнюю страну вокруг Харрана, между большой излучиной Евфрата и Хабуром. Там и стоит точка карты — на Харране, примерно в 665 км к северо-востоку от Иерусалима по прямой и в 690 км к северо-западу от Вавилона."
    - "Эта верхняя Месопотамия была родиной родни Авраама. Его раб «пошел в Месопотамию, в город Нахора», чтобы найти жену Исааку, и позже Иаков служил там Лавану за Лию и Рахиль; Синодальный перевод и Паддан-Арам, страну Лавана, называет Месопотамией. Валаама наняли «из Пефора Месопотамского» — это Питру ассирийских анналов на реке Саджур близ Кархемиса, примерно в 90 км к западу от Харрана; а во дни судей Господь предал Израиль «в руки Хусарсафема, царя Месопотамского», и сыны Израилевы служили ему восемь лет."
    - "Новый Завет употребляет слово в широком греческом смысле — вся земля между реками до Персидского залива. Среди толпы в день Пятидесятницы были «жители Месопотамии», Иудеи Вавилонии, а Стефан говорит, что Бог явился Аврааму «в Месопотамии, прежде переселения его в Харран»: для него и Ур, далеко вниз по Евфрату, был Месопотамией. Нынешние историки понимают имя в этом широком смысле — как землю Ура, Вавилона и Ниневии; Ниневия лежит примерно в 370 км к востоку от Харрана."
  uk:
    - "Месопотамія, грецькою «між річками», — це земля Євфрату й Тигру, здебільшого в нинішньому Іраку, з північним сходом Сирії та південним сходом Туреччини. У Старому Заповіті, однак, це слово відповідає єврейському Арам-Нагараїм, «Арам двох річок»: лише верхній край навколо Харана, між великим вигином Євфрату й Хабуром. Точка на мапі стоїть там, на Харані, приблизно за 665 км на північний схід від Єрусалима по прямій і приблизно за 690 км на північний захід від Вавилона."
    - "Ця верхня Месопотамія була батьківщиною родичів Авраама. Його слуга «пійшов у Месопотамію, у Нахорів город», щоб знайти дружину Ісаакові, а Яків пізніше служив там Лаванові за Лію та Рахіль; Синодальна Біблія передає Лаванів Паддан-Арам також як Месопотамію. Валаама було найнято «із Пегора в Мезопотамії» — це Пітру ассирійських літописів на річці Саджур поблизу Каркемиша, що лежить приблизно за 90 км на захід від Харана; а за днів суддів Ізраїль служив «Хузанові Русатаїмові, цареві Мезопотамїї» вісім років."
    - "Новий Заповіт уживає слово в його ширшому грецькому значенні — вся земля між річками аж до Перської затоки. Серед натовпу на П'ятдесятницю були ті, «що домуємо в Мезопотамії», юдеї Вавилонії, а Стефан каже, що Бог з'явився Авраамові, «як був у Мезопотамії, перш нїж оселив ся він у Харані»: для нього Ур, далеко вниз по Євфрату, також був Месопотамією. Сучасні історики вживають цю назву в широкому значенні, для краю Ура, Вавилона й Ніневії; Ніневія лежить приблизно за 370 км на схід від Харана."
  es:
    - "Mesopotamia, en griego «entre los ríos», es la tierra del Éufrates y el Tigris, en su mayor parte en el actual Irak, con el noreste de Siria y el sureste de Turquía. En el Antiguo Testamento, sin embargo, la palabra corresponde al hebreo Aram-naharaim, «Aram de los dos ríos»: solo el país alto en torno a Harán, entre el gran recodo del Éufrates y el Jabur. El punto del mapa está allí, sobre Harán, a unos 665 km al noreste de Jerusalén en línea recta y a unos 690 km al noroeste de Babilonia."
    - "Esta alta Mesopotamia fue la patria de la parentela de Abraham. Su criado «llegó á Mesopotamia, á la ciudad de Nachôr» para buscar esposa a Isaac, y Jacob sirvió luego allí a Labán por Lea y Raquel; la Biblia sinodal traduce también por Mesopotamia el Padan-aram de Labán. Balaam fue contratado «de Pethor de Mesopotamia», la Pitru de los anales asirios, en el río Sajur, cerca de Carquemis, que queda a unos 90 km al oeste de Harán; y en los días de los jueces Israel sirvió ocho años a «Chusan-risathaim, rey de Mesopotamia»."
    - "El Nuevo Testamento usa la palabra en su sentido griego más amplio, toda la tierra entre los ríos hasta el golfo Pérsico. Entre la multitud de Pentecostés estaban «los que habitamos en Mesopotamia», los judíos de Babilonia, y Esteban dice que Dios se apareció a Abraham «estando en Mesopotamia, antes que morase en Chârán»: para él, Ur, muy abajo en el Éufrates, era también Mesopotamia. Los historiadores modernos usan el nombre en este sentido amplio, para la tierra de Ur, Babilonia y Nínive; Nínive queda a unos 370 km al este de Harán."
  pt:
    - "Mesopotâmia, em grego “entre os rios”, é a terra do Eufrates e do Tigre, a maior parte dela no atual Iraque, com o nordeste da Síria e o sudeste da Turquia. No Antigo Testamento, porém, a palavra corresponde ao hebraico Arã-Naaraim, “Arã dos dois rios”: apenas a região superior em torno de Harã, entre a grande curva do Eufrates e o Habur. O ponto do mapa fica ali, em Harã, a cerca de 665 km a nordeste de Jerusalém em linha reta e a cerca de 690 km a noroeste da Babilônia."
    - "Essa alta Mesopotâmia era a terra dos parentes de Abraão. Seu servo “foi para a Mesopotâmia, para a cidade de Naor” a fim de buscar uma esposa para Isaque, e Jacó serviu ali a Labã por Lia e Raquel; a Bíblia Sinodal traduz também o Padã-Arã de Labã como Mesopotâmia. Balaão foi contratado “de Petor da Mesopotâmia”, o Pitru dos anais assírios, no rio Sajur, perto de Carquemis, que fica a cerca de 90 km a oeste de Harã; e nos dias dos juízes Israel serviu por oito anos a “Cusã-Risataim, rei da Mesopotâmia”."
    - "O Novo Testamento usa a palavra em seu sentido grego mais amplo, toda a terra entre os rios até o golfo Pérsico. Entre a multidão de Pentecostes estavam “os habitantes da Mesopotâmia”, os judeus da Babilônia, e Estêvão diz que Deus apareceu a Abraão “quando ele estava na Mesopotâmia, antes de morar em Harã”: para ele, Ur, bem abaixo no Eufrates, também era Mesopotâmia. Os historiadores modernos usam o nome nesse sentido amplo, para a terra de Ur, Babilônia e Nínive; Nínive fica a cerca de 370 km a leste de Harã."
  de:
    - "Mesopotamien, griechisch „zwischen den Strömen“, ist das Land des Euphrat und des Tigris, größtenteils im heutigen Irak, mit dem Nordosten Syriens und dem Südosten der Türkei. Im Alten Testament steht das Wort jedoch für das hebräische Aram-Naharajim, „Aram der beiden Ströme“: nur das obere Land um Haran, zwischen der großen Euphratschleife und dem Chabur. Dort steht der Kartenpunkt, auf Haran, in der Luftlinie etwa 665 km nordöstlich von Jerusalem und etwa 690 km nordwestlich von Babylon."
    - "Dieses obere Mesopotamien war die Heimat von Abrahams Verwandtschaft. Sein Knecht „zog nach Mesopotamien zu der Stadt Nahors“, um eine Frau für Isaak zu finden, und Jakob diente dort später Laban um Lea und Rahel; die Synodalbibel gibt auch Labans Paddan-Aram als Mesopotamien wieder. Bileam wurde gedungen „von Pethor aus Mesopotamien“, dem Pitru der assyrischen Annalen am Fluss Sadschur bei Karkemisch, etwa 90 km westlich von Haran; und in den Tagen der Richter wurde Israel „unter die Hand Kusan-Risathaims, des Königs von Mesopotamien“ verkauft und diente ihm acht Jahre."
    - "Das Neue Testament gebraucht das Wort in seinem weiteren griechischen Sinn, das ganze Land zwischen den Strömen bis zum Persischen Golf. Unter der Menge an Pfingsten waren „die wir wohnen in Mesopotamien“, die Juden Babyloniens, und Stephanus sagt, Gott sei Abraham erschienen, „da er noch in Mesopotamien war, ehe er wohnte in Haran“: Für ihn war auch Ur, weit unten am Euphrat, Mesopotamien. Moderne Historiker gebrauchen den Namen in diesem weiten Sinn, für das Land von Ur, Babylon und Ninive; Ninive liegt etwa 370 km östlich von Haran."
  fr:
    - "La Mésopotamie, en grec « entre les fleuves », est le pays de l’Euphrate et du Tigre, situé pour l’essentiel dans l’Irak actuel, avec le nord-est de la Syrie et le sud-est de la Turquie. Dans l’Ancien Testament, pourtant, le mot rend l’hébreu Aram-Naharaïm, « Aram des deux fleuves » : seulement le haut pays autour de Charan, entre la grande boucle de l’Euphrate et le Khabour. Le point de la carte s’y trouve, sur Charan, à environ 665 km au nord-est de Jérusalem à vol d’oiseau et à environ 690 km au nord-ouest de Babylone."
    - "Cette haute Mésopotamie était le pays de la parenté d’Abraham. Son serviteur « alla en Mésopotamie, à la ville de Nachor » chercher une épouse pour Isaac, et Jacob servit plus tard Laban en ce lieu pour Léa et Rachel ; la Bible synodale russe rend aussi le Paddan-Aram de Laban par Mésopotamie. Balaam fut appelé à prix d’argent « de Pethor en Mésopotamie », le Pitrou des annales assyriennes, sur la rivière Sadjour près de Carkemisch, qui se trouve à environ 90 km à l’ouest de Charan ; et au temps des juges, Israël fut asservi huit ans à « Cuschan-Rischeathaïm, roi de Mésopotamie »."
    - "Le Nouveau Testament emploie le mot dans son sens grec plus large, tout le pays entre les fleuves jusqu’au golfe Persique. Parmi la foule de la Pentecôte se trouvaient « ceux qui habitent la Mésopotamie », les Juifs de Babylonie, et Étienne dit que Dieu apparut à Abraham « lorsqu’il était en Mésopotamie, avant qu’il s’établît à Charran » : pour lui, Ur, loin en aval de l’Euphrate, était elle aussi en Mésopotamie. Les historiens modernes emploient le nom dans ce sens large, pour le pays d’Ur, de Babylone et de Ninive ; Ninive se trouve à environ 370 km à l’est de Charan."
  pl:
    - "Mezopotamia, po grecku „między rzekami”, to kraina Eufratu i Tygrysu, w większości na terenie dzisiejszego Iraku, wraz z północnym wschodem Syrii i południowym wschodem Turcji. W Starym Testamencie to słowo oznacza jednak hebrajskie Aram Naharaim, „Aram dwóch rzek”: tylko górną krainę wokół Charanu, między wielkim zakolem Eufratu a Chaburem. Punkt na mapie stoi tam, w Charanie, około 665 km na północny wschód od Jerozolimy w linii prostej i około 690 km na północny zachód od Babilonu."
    - "Ta górna Mezopotamia była ojczyzną rodziny Abrahama. Jego sługa „puścił się do Aram Naharaim, do miasta Nachorowego”, aby znaleźć żonę dla Izaaka, a Jakub służył tam później Labanowi za Leę i Rachelę; Biblia synodalna oddaje także Paddan-Aram Labana jako Mezopotamię. Balaam został najęty „z Pethor Mesopotamii Syryjskiej”, czyli Pitru z kronik asyryjskich nad rzeką Sadżur koło Karkemisz, które leży około 90 km na zachód od Charanu; a w czasach sędziów Izrael został wydany w rękę „Chusanrasataima, króla Syrskiego w Mezopotamii” i służył mu osiem lat."
    - "Nowy Testament używa tego słowa w jego szerszym sensie greckim, jako całej krainy między rzekami aż do Zatoki Perskiej. Wśród tłumu w Pięćdziesiątnicę byli ci, „którzy mieszkamy w Mezopotamii”, Żydzi z Babilonii, a Szczepan mówi, że Bóg ukazał się Abrahamowi, „gdy był w Mezopotamii, przedtem niż mieszkał w Haranie”: dla niego także Ur, daleko w dole Eufratu, leżało w Mezopotamii. Współcześni historycy używają tej nazwy w szerokim sensie, na określenie krainy Ur, Babilonu i Niniwy; Niniwa leży około 370 km na wschód od Charanu."
  it:
    - "Mesopotamia, in greco «tra i fiumi», è la terra dell’Eufrate e del Tigri, in gran parte nell’odierno Iraq, con il nord-est della Siria e il sud-est della Turchia. Nell’Antico Testamento, tuttavia, la parola rende l’ebraico Aram-Naharàim, «Aram dei due fiumi»: soltanto la regione superiore attorno a Carran, tra la grande ansa dell’Eufrate e il Khabur. Il punto della mappa si trova lì, su Carran, a circa 665 km a nord-est di Gerusalemme in linea d’aria e a circa 690 km a nord-ovest di Babilonia."
    - "Questa alta Mesopotamia era la patria dei parenti di Abramo. Il suo servo «andò in Mesopotamia, alla città di Nahor» per trovare una moglie a Isacco, e Giacobbe vi servì poi Laban per Lia e Rachele; la Bibbia sinodale rende Mesopotamia anche il Paddan-Aram di Laban. Balaam fu assoldato «da Pethor in Mesopotamia», la Pitru degli annali assiri sul fiume Sajur presso Carchemis, che si trova a circa 90 km a ovest di Carran; e ai tempi dei giudici Israele servì per otto anni «Cushan-Rishathaim, re di Mesopotamia»."
    - "Il Nuovo Testamento usa la parola nel suo senso greco più ampio, l’intera terra tra i fiumi fino al Golfo Persico. Tra la folla della Pentecoste c’erano gli «abitanti della Mesopotamia», i Giudei della Babilonia, e Stefano dice che Dio apparve ad Abramo «mentr’egli era in Mesopotamia, prima che abitasse in Carran»: per lui anche Ur, molto più a valle sull’Eufrate, era Mesopotamia. Gli storici moderni usano il nome in questo senso ampio, per la terra di Ur, Babilonia e Ninive; Ninive si trova a circa 370 km a est di Carran."
  cs:
    - "Mezopotámie, řecky „mezi řekami“, je země Eufratu a Tigridu, většinou v dnešním Iráku, se severovýchodem Sýrie a jihovýchodem Turecka. Ve Starém zákoně však slovo stojí za hebrejské Aram-naharajim, „Aram dvou řek“: jen horní kraj kolem Cháranu, mezi velkým ohybem Eufratu a Chabúrem. Bod na mapě stojí tam, na Cháranu, vzdušnou čarou asi 665 km severovýchodně od Jeruzaléma a asi 690 km severozápadně od Babylónu."
    - "Tato horní Mezopotámie byla domovem Abrahamova příbuzenstva. Jeho služebník se pro Izáka vydal hledat ženu: „bral se k Aram Naharaim do města Náchor“, a Jákob tu později sloužil Labanovi za Leu a Ráchel; synodální Bible překládá i Labanův Padan-aram jako Mezopotámie. Bileám byl najat „z Petor Mezopotamie Syrské“, tedy z Pitru asyrských análů na řece Sadžúru poblíž Karkemíše, který leží asi 90 km západně od Cháranu; a za dnů soudců byl Izrael vydán „v ruku Chusana Risataimského, krále Syrského v Mezopotamii“ a sloužil mu osm let."
    - "Nový zákon užívá slova v jeho širším řeckém smyslu, pro celou zemi mezi řekami až k Perskému zálivu. V zástupu o letnicích byli i ti, „kteříž přebýváme v Mezopotamii“, Židé z Babylonie, a Štěpán říká, že Bůh se ukázal Abrahamovi, „když byl v Mezopotamii, prve než bydlil v Cháran“: pro něj byl i Ur, daleko po proudu Eufratu, Mezopotámií. Moderní historikové užívají jméno v tomto širokém smyslu, pro zemi Uru, Babylónu a Ninive; Ninive leží asi 370 km východně od Cháranu."
  nl:
    - "Mesopotamië, Grieks voor “tussen de rivieren”, is het land van de Eufraat en de Tigris, voor het grootste deel in het huidige Irak, met het noordoosten van Syrië en het zuidoosten van Turkije. In het Oude Testament staat het woord echter voor het Hebreeuwse Aram-Naharaïm, “Aram van de twee rivieren”: alleen het bovenland rond Haran, tussen de grote bocht van de Eufraat en de Chabur. Het punt op de kaart staat daar, op Haran, hemelsbreed ongeveer 665 km ten noordoosten van Jeruzalem en ongeveer 690 km ten noordwesten van Babylon."
    - "Dit boven-Mesopotamië was de woonstreek van Abrahams verwanten. Zijn knecht “toog heen naar Mesopotamië, naar de stad van Nahor” om een vrouw voor Isaak te zoeken, en Jakob diende er later Laban voor Lea en Rachel; de Synodale Bijbel geeft Labans Paddan-Aram ook weer als Mesopotamië. Bileam werd gehuurd “van Pethor uit Mesopotamië”, het Pitru uit de Assyrische annalen aan de rivier de Sajoer bij Karkemis, dat ongeveer 90 km ten westen van Haran ligt; en in de dagen van de richters diende Israël “Cuschan Rischataim, koning van Mesopotamië” acht jaar."
    - "Het Nieuwe Testament gebruikt het woord in zijn bredere Griekse betekenis, het hele land tussen de rivieren tot aan de Perzische Golf. In de opsomming van de menigte met Pinksteren staat: “en de inwoners zijn van Mesopotamië”, de joden van Babylonië, en Stefanus zegt dat God aan Abraham verscheen “nog zijnde in Mesopotamië, eer hij woonde in Charran”: voor hem was ook Ur, ver stroomafwaarts aan de Eufraat, Mesopotamië. Moderne historici gebruiken de naam in deze brede zin, voor het land van Ur, Babylon en Nineve; Nineve ligt ongeveer 370 km ten oosten van Haran."
  sv:
    - "Mesopotamien, grekiska för ”mellan floderna”, är landet kring Eufrat och Tigris, till största delen i dagens Irak, med nordöstra Syrien och sydöstra Turkiet. I Gamla testamentet står ordet dock för det hebreiska Aram-Naharajim, ”Aram vid de två floderna”: bara det övre landet kring Harran, mellan Eufrats stora krök och Khabur. Kartpunkten står där, på Harran, omkring 665 km nordost om Jerusalem i fågelvägen och omkring 690 km nordväst om Babylon."
    - "Detta övre Mesopotamien var hemmet för Abrahams släkt. Hans tjänare drog ”till Nahors stad i Aram-Naharaim” för att finna en hustru åt Isak, och Jakob tjänade senare Laban där för Lea och Rakel; den synodala bibeln återger också Labans Paddan-Aram som Mesopotamien. Bileam anlitades ”från Petor i Aram-Naharaim”, Pitru i de assyriska annalerna vid floden Sajur nära Karkemish, som ligger omkring 90 km väster om Harran; och på domarnas tid måste Israel ”tjäna Kusan-Risataim i åtta år”, konungen i Aram-Naharaim."
    - "Nya testamentet använder ordet i dess vidare grekiska betydelse, hela landet mellan floderna ned till Persiska viken. Bland folket vid pingst fanns de som hade sitt hem ”i Mesopotamien”, Babyloniens judar, och Stefanos säger att Gud uppenbarade sig för Abraham ”medan han ännu var i Mesopotamien, och förrän han bosatte sig i Karran”: för honom var Ur, långt nedåt Eufrat, också Mesopotamien. Moderna historiker använder namnet i denna vida betydelse, för landet med Ur, Babylon och Nineve; Nineve ligger omkring 370 km öster om Harran."
  nb:
    - "Mesopotamia, gresk for «mellom elvene», er landet ved Eufrat og Tigris, for det meste i dagens Irak, med nordøstlige Syria og sørøstlige Tyrkia. I Det gamle testamentet står ordet imidlertid for det hebraiske Aram-Naharajim, «Aram ved de to elvene»: bare det øvre landet rundt Harran, mellom Eufrats store sving og Khabur. Kartpunktet står der, på Harran, omtrent 665 km nordøst for Jerusalem i luftlinje og omtrent 690 km nordvest for Babylon."
    - "Dette øvre Mesopotamia var hjemmet til Abrahams slekt. Hans tjener «drog til Mesopotamia, til Nakors by» for å finne en hustru til Isak, og Jakob tjente senere Laban der for Lea og Rakel; den synodale bibelen gjengir også Labans Paddan-Aram som Mesopotamia. Bileam ble leid «fra Petor i Mesopotamia», Pitru i de assyriske annalene ved elven Sajur nær Karkemisj, som ligger omtrent 90 km vest for Harran; og i dommertiden ble Israel solgt «i Kusan-Risata’ims hånd, som var konge i Mesopotamia», og tjente ham i åtte år."
    - "Det nye testamentet bruker ordet i dets videre greske betydning, hele landet mellom elvene ned til Persiagulfen. Blant mengden ved pinsen var «vi som bor i Mesopotamia», jødene i Babylonia, og Stefanus sier at Gud åpenbarte seg for Abraham «mens han var i Mesopotamia, før han hadde bosatt sig i Karan»: for ham var også Ur, langt nede ved Eufrat, Mesopotamia. Moderne historikere bruker navnet i denne videre betydningen, om landet med Ur, Babylon og Ninive; Ninive ligger omtrent 370 km øst for Harran."
  tl:
    - "Ang Mesopotamia, na Griyego para sa “sa pagitan ng mga ilog”, ay ang lupain ng Eufrates at Tigris, na karamihan ay nasa kasalukuyang Iraq, kasama ang hilagang-silangan ng Siria at timog-silangan ng Turkey. Sa Matandang Tipan, gayunman, ang salita ay tumutukoy sa Hebreong Aram-naharaim, “Aram ng dalawang ilog”: ang itaas na bansa lamang sa paligid ng Haran, sa pagitan ng malaking liko ng Eufrates at ng Khabur. Naroon ang punto sa mapa, sa Haran, mga 665 km sa hilagang-silangan ng Jerusalem sa tuwid na guhit at mga 690 km sa hilagang-kanluran ng Babilonia."
    - "Ang itaas na Mesopotamia ang tahanan ng mga kamag-anak ni Abraham. Ang kaniyang lingkod ay “napasa Mesopotamia, sa bayan ni Nachor” upang humanap ng asawa para kay Isaac, at nang maglaon ay naglingkod si Jacob kay Laban doon para kina Lea at Raquel; isinasalin din ng Bibliyang Synodal ang Padan-aram ni Laban bilang Mesopotamia. Inupahan si Balaam “mula sa Pethor ng Mesopotamia”, ang Pitru ng mga talaan ng Asiria sa ilog Sajur malapit sa Carchemis, na mga 90 km sa kanluran ng Haran; at nang mga araw ng mga hukom ay naglingkod ang Israel nang walong taon kay “Chusan-risathaim, na hari sa Mesopotamia”."
    - "Ginagamit ng Bagong Tipan ang salita sa mas malawak nitong kahulugang Griyego, ang buong lupain sa pagitan ng mga ilog hanggang sa Golpo ng Persia. Kabilang sa karamihan sa Pentecostes ang “nangananahan sa Mesapotamia”, ang mga Judio ng Babilonia, at sinabi ni Esteban na napakita ang Dios kay Abraham “nang siya'y nasa Mesapotamia, bago siya tumahan sa Haran”: para sa kaniya, ang Ur, malayo sa ibaba ng Eufrates, ay Mesopotamia rin. Ginagamit ng mga makabagong istoryador ang pangalan sa malawak na kahulugang ito, para sa lupain ng Ur, Babilonia at Ninive; ang Ninive ay mga 370 km sa silangan ng Haran."
  da:
    - "Mesopotamien, græsk for »mellem floderne«, er Eufrats og Tigris’ land, det meste af det i nutidens Irak, med det nordøstlige Syrien og det sydøstlige Tyrkiet. I Det Gamle Testamente står ordet dog for det hebraiske Aram-Naharajim, »Aram ved de to floder«: kun det øvre land omkring Karan, mellem Eufrats store sving og Khabur. Kortets punkt står der, på Karan, ca. 665 km nordøst for Jerusalem i fugleflugt og ca. 690 km nordvest for Babylon."
    - "Dette øvre Mesopotamien var hjemstavn for Abrahams slægt. Hans tjener »drog til Aram Naharaim, til Nakors Stad« for at finde en hustru til Isak, og Jakob tjente senere Laban dér for Lea og Rakel; den synodale bibel gengiver også Labans Paddan-Aram som Mesopotamien. Bileam blev lejet »af Pethor i Mesopotamien«, assyrernes annalers Pitru ved floden Sajur nær Karkemisj, som ligger ca. 90 km vest for Karan; og i dommernes dage »Israels Børn tjente Kusan-Risathaim otte Aar«, kongen i Aram Naharaim."
    - "Det Nye Testamente bruger ordet i dets videre græske betydning, hele landet mellem floderne ned til Den Persiske Bugt. Blandt skaren til pinse var dem, »som høre hjemme i Mesopotamien«, jøderne i Babylonien, og Stefanus siger, at Gud viste sig for Abraham, »da han var i Mesopotamien, førend han tog Bolig i Karan«: for ham var Ur, langt nede ad Eufrat, også Mesopotamien. Moderne historikere bruger navnet i denne brede betydning, for Urs, Babylons og Nineves land; Nineve ligger ca. 370 km øst for Karan."
