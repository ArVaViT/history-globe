id: where-was-mesopotamia
question:
  en: "Where was Mesopotamia?"
  ru: "Где находилась Месопотамия?"
  uk: "Де була Месопотамія?"
  es: "¿Dónde estaba Mesopotamia?"
  pt: "Onde ficava a Mesopotâmia?"
  de: "Wo lag Mesopotamien?"
  fr: "Où se trouvait la Mésopotamie ?"
answer:
  en:
    - "Mesopotamia, Greek for “between the rivers”, is the land of the Euphrates and the Tigris, most of it in today's Iraq, with the north-east of Syria and the south-east of Turkey. In the Old Testament, though, the word stands for the Hebrew Aram-naharaim, “Aram of the two rivers”: only the upper country around Haran, between the great bend of the Euphrates and the Khabur. The map point stands there, on Haran, about 665 km north-east of Jerusalem in a straight line and about 690 km north-west of Babylon."
    - "This upper Mesopotamia was the home of Abraham's kin. His servant “went to Mesopotamia, unto the city of Nahor” to find a wife for Isaac, and Jacob later served Laban there for Leah and Rachel; the Synodal Bible renders Laban's Padan-aram as Mesopotamia too. Balaam was hired “of Pethor of Mesopotamia”, the Pitru of the Assyrian annals on the river Sajur near Carchemish, which lies about 90 km west of Haran; and in the days of the judges Israel served “Chushan-rishathaim king of Mesopotamia” eight years."
    - "The New Testament uses the word in its wider Greek sense, the whole land between the rivers down to the Persian Gulf. Among the crowd at Pentecost were “the dwellers in Mesopotamia”, the Jews of Babylonia, and Stephen says that God appeared to Abraham “when he was in Mesopotamia, before he dwelt in Charran”: for him Ur, far down the Euphrates, was Mesopotamia as well. Modern historians use the name in this wide sense, for the land of Ur, Babylon and Nineveh; Nineveh lies about 370 km east of Haran."
  ru:
    - "Месопотамия, по-гречески «Междуречье», — земля Евфрата и Тигра, бо́льшая часть которой лежит в нынешнем Ираке, вместе с северо-востоком Сирии и юго-востоком Турции. Но в Ветхом Завете это слово передаёт еврейское Арам-Нахараим, «Арам двух рек»: только верхнюю страну вокруг Харрана, между большой излучиной Евфрата и Хабуром. Там и стоит точка карты — на Харране, примерно в 665 км к северо-востоку от Иерусалима по прямой и в 690 км к северо-западу от Вавилона."
    - "Эта верхняя Месопотамия была родиной родни Авраама. Его раб «пошел в Месопотамию, в город Нахора», чтобы найти жену Исааку, и позже Иаков служил там Лавану за Лию и Рахиль; Синодальный перевод и Паддан-Арам, страну Лавана, называет Месопотамией. Валаама наняли «из Пефора Месопотамского» — это Питру ассирийских анналов на реке Саджур близ Кархемиса, примерно в 90 км к западу от Харрана; а во дни судей Господь предал Израиль «в руки Хусарсафема, царя Месопотамского», и сыны Израилевы служили ему восемь лет."
    - "Новый Завет употребляет слово в широком греческом смысле — вся земля между реками до Персидского залива. Среди толпы в день Пятидесятницы были «жители Месопотамии», Иудеи Вавилонии, а Стефан говорит, что Бог явился Аврааму «в Месопотамии, прежде переселения его в Харран»: для него и Ур, далеко вниз по Евфрату, был Месопотамией. Нынешние историки понимают имя в этом широком смысле — как землю Ура, Вавилона и Ниневии; Ниневия лежит примерно в 370 км к востоку от Харрана."
  uk:
    - "Месопотамія, грецькою «між річками», — це земля Євфрату й Тигру, здебільшого в нинішньому Іраку, з північним сходом Сирії та південним сходом Туреччини. У Старому Заповіті, однак, це слово відповідає єврейському Арам-Нагараїм, «Арам двох річок»: лише верхній край навколо Харана, між великим вигином Євфрату й Хабуром. Точка на мапі стоїть там, на Харані, приблизно за 665 км на північний схід від Єрусалима по прямій і приблизно за 690 км на північний захід від Вавилона."
    - "Ця верхня Месопотамія була батьківщиною родичів Авраама. Його слуга «пійшов у Месопотамію, у Нахорів город», щоб знайти дружину Ісаакові, а Яків пізніше служив там Лаванові за Лію та Рахіль; Синодальна Біблія передає Лаванів Паддан-Арам також як Месопотамію. Валаама було найнято «із Пегора в Мезопотамії» — це Пітру ассирійських літописів на річці Саджур поблизу Каркемиша, що лежить приблизно за 90 км на захід від Харана; а за днів суддів Ізраїль служив «Хузанові Русатаїмові, цареві Мезопотамїї» вісім років."
    - "Новий Заповіт уживає слово в його ширшому грецькому значенні — вся земля між річками аж до Перської затоки. Серед натовпу на П'ятдесятницю були ті, «що домуємо в Мезопотамії», юдеї Вавилонії, а Стефан каже, що Бог з'явився Авраамові, «як був у Мезопотамії, перш нїж оселив ся він у Харані»: для нього Ур, далеко вниз по Євфрату, також був Месопотамією. Сучасні історики вживають цю назву в широкому значенні, для краю Ура, Вавилона й Ніневії; Ніневія лежить приблизно за 370 км на схід від Харана."
  es:
    - "Mesopotamia, en griego «entre los ríos», es la tierra del Éufrates y el Tigris, en su mayor parte en el actual Irak, con el noreste de Siria y el sureste de Turquía. En el Antiguo Testamento, sin embargo, la palabra corresponde al hebreo Aram-naharaim, «Aram de los dos ríos»: solo el país alto en torno a Harán, entre el gran recodo del Éufrates y el Jabur. El punto del mapa está allí, sobre Harán, a unos 665 km al noreste de Jerusalén en línea recta y a unos 690 km al noroeste de Babilonia."
    - "Esta alta Mesopotamia fue la patria de la parentela de Abraham. Su criado «llegó á Mesopotamia, á la ciudad de Nachôr» para buscar esposa a Isaac, y Jacob sirvió luego allí a Labán por Lea y Raquel; la Biblia sinodal traduce también por Mesopotamia el Padan-aram de Labán. Balaam fue contratado «de Pethor de Mesopotamia», la Pitru de los anales asirios, en el río Sajur, cerca de Carquemis, que queda a unos 90 km al oeste de Harán; y en los días de los jueces Israel sirvió ocho años a «Chusan-risathaim, rey de Mesopotamia»."
    - "El Nuevo Testamento usa la palabra en su sentido griego más amplio, toda la tierra entre los ríos hasta el golfo Pérsico. Entre la multitud de Pentecostés estaban «los que habitamos en Mesopotamia», los judíos de Babilonia, y Esteban dice que Dios se apareció a Abraham «estando en Mesopotamia, antes que morase en Chârán»: para él, Ur, muy abajo en el Éufrates, era también Mesopotamia. Los historiadores modernos usan el nombre en este sentido amplio, para la tierra de Ur, Babilonia y Nínive; Nínive queda a unos 370 km al este de Harán."
  pt:
    - "Mesopotâmia, em grego “entre os rios”, é a terra do Eufrates e do Tigre, a maior parte dela no atual Iraque, com o nordeste da Síria e o sudeste da Turquia. No Antigo Testamento, porém, a palavra corresponde ao hebraico Arã-Naaraim, “Arã dos dois rios”: apenas a região superior em torno de Harã, entre a grande curva do Eufrates e o Habur. O ponto do mapa fica ali, em Harã, a cerca de 665 km a nordeste de Jerusalém em linha reta e a cerca de 690 km a noroeste da Babilônia."
    - "Essa alta Mesopotâmia era a terra dos parentes de Abraão. Seu servo “foi para a Mesopotâmia, para a cidade de Naor” a fim de buscar uma esposa para Isaque, e Jacó serviu ali a Labã por Lia e Raquel; a Bíblia Sinodal traduz também o Padã-Arã de Labã como Mesopotâmia. Balaão foi contratado “de Petor da Mesopotâmia”, o Pitru dos anais assírios, no rio Sajur, perto de Carquemis, que fica a cerca de 90 km a oeste de Harã; e nos dias dos juízes Israel serviu por oito anos a “Cusã-Risataim, rei da Mesopotâmia”."
    - "O Novo Testamento usa a palavra em seu sentido grego mais amplo, toda a terra entre os rios até o golfo Pérsico. Entre a multidão de Pentecostes estavam “os habitantes da Mesopotâmia”, os judeus da Babilônia, e Estêvão diz que Deus apareceu a Abraão “quando ele estava na Mesopotâmia, antes de morar em Harã”: para ele, Ur, bem abaixo no Eufrates, também era Mesopotâmia. Os historiadores modernos usam o nome nesse sentido amplo, para a terra de Ur, Babilônia e Nínive; Nínive fica a cerca de 370 km a leste de Harã."
  de:
    - "Mesopotamien, griechisch „zwischen den Strömen“, ist das Land des Euphrat und des Tigris, größtenteils im heutigen Irak, mit dem Nordosten Syriens und dem Südosten der Türkei. Im Alten Testament steht das Wort jedoch für das hebräische Aram-Naharajim, „Aram der beiden Ströme“: nur das obere Land um Haran, zwischen der großen Euphratschleife und dem Chabur. Dort steht der Kartenpunkt, auf Haran, in der Luftlinie etwa 665 km nordöstlich von Jerusalem und etwa 690 km nordwestlich von Babylon."
    - "Dieses obere Mesopotamien war die Heimat von Abrahams Verwandtschaft. Sein Knecht „zog nach Mesopotamien zu der Stadt Nahors“, um eine Frau für Isaak zu finden, und Jakob diente dort später Laban um Lea und Rahel; die Synodalbibel gibt auch Labans Paddan-Aram als Mesopotamien wieder. Bileam wurde gedungen „von Pethor aus Mesopotamien“, dem Pitru der assyrischen Annalen am Fluss Sadschur bei Karkemisch, etwa 90 km westlich von Haran; und in den Tagen der Richter wurde Israel „unter die Hand Kusan-Risathaims, des Königs von Mesopotamien“ verkauft und diente ihm acht Jahre."
    - "Das Neue Testament gebraucht das Wort in seinem weiteren griechischen Sinn, das ganze Land zwischen den Strömen bis zum Persischen Golf. Unter der Menge an Pfingsten waren „die wir wohnen in Mesopotamien“, die Juden Babyloniens, und Stephanus sagt, Gott sei Abraham erschienen, „da er noch in Mesopotamien war, ehe er wohnte in Haran“: Für ihn war auch Ur, weit unten am Euphrat, Mesopotamien. Moderne Historiker gebrauchen den Namen in diesem weiten Sinn, für das Land von Ur, Babylon und Ninive; Ninive liegt etwa 370 km östlich von Haran."
  fr:
    - "La Mésopotamie, en grec « entre les fleuves », est le pays de l’Euphrate et du Tigre, situé pour l’essentiel dans l’Irak actuel, avec le nord-est de la Syrie et le sud-est de la Turquie. Dans l’Ancien Testament, pourtant, le mot rend l’hébreu Aram-Naharaïm, « Aram des deux fleuves » : seulement le haut pays autour de Charan, entre la grande boucle de l’Euphrate et le Khabour. Le point de la carte s’y trouve, sur Charan, à environ 665 km au nord-est de Jérusalem à vol d’oiseau et à environ 690 km au nord-ouest de Babylone."
    - "Cette haute Mésopotamie était le pays de la parenté d’Abraham. Son serviteur « alla en Mésopotamie, à la ville de Nachor » chercher une épouse pour Isaac, et Jacob servit plus tard Laban en ce lieu pour Léa et Rachel ; la Bible synodale russe rend aussi le Paddan-Aram de Laban par Mésopotamie. Balaam fut appelé à prix d’argent « de Pethor en Mésopotamie », le Pitrou des annales assyriennes, sur la rivière Sadjour près de Carkemisch, qui se trouve à environ 90 km à l’ouest de Charan ; et au temps des juges, Israël fut asservi huit ans à « Cuschan-Rischeathaïm, roi de Mésopotamie »."
    - "Le Nouveau Testament emploie le mot dans son sens grec plus large, tout le pays entre les fleuves jusqu’au golfe Persique. Parmi la foule de la Pentecôte se trouvaient « ceux qui habitent la Mésopotamie », les Juifs de Babylonie, et Étienne dit que Dieu apparut à Abraham « lorsqu’il était en Mésopotamie, avant qu’il s’établît à Charran » : pour lui, Ur, loin en aval de l’Euphrate, était elle aussi en Mésopotamie. Les historiens modernes emploient le nom dans ce sens large, pour le pays d’Ur, de Babylone et de Ninive ; Ninive se trouve à environ 370 km à l’est de Charan."
