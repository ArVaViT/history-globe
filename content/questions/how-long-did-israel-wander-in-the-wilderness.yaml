id: how-long-did-israel-wander-in-the-wilderness
question:
  en: "How long did Israel wander in the wilderness?"
  ru: "Сколько лет Израиль скитался по пустыне?"
  uk: "Як довго Ізраїль блукав пустелею?"
  es: "¿Cuánto tiempo vagó Israel por el desierto?"
  pt: "Quanto tempo Israel vagou pelo deserto?"
  de: "Wie lange wanderte Israel in der Wüste?"
  fr: "Combien de temps Israël a-t-il erré dans le désert ?"
  pl: "Jak długo Izrael błąkał się po pustyni?"
  it: "Quanto tempo Israele vagò nel deserto?"
  nl: "Hoe lang dwaalde Israël door de woestijn?"
  cs: "Jak dlouho Izrael bloudil pouští?"
  sv: "Hur länge vandrade Israel i öknen?"
  nb: "Hvor lenge vandret Israel i ørkenen?"
  tl: "Gaano katagal gumala ang Israel sa ilang?"
  da: "Hvor længe vandrede Israel i ørkenen?"
  sr: "Колико је дуго Израиљ лутао по пустињи?"
answer:
  en:
    - "Forty years, counted from the Exodus to the crossing of the Jordan, of which about thirty-eight were spent between Kadesh-barnea and the brook Zered after the people refused to enter the land. The forty was a sentence: “your children shall wander in the wilderness forty years... each day for a year”, one year for each day the spies had spent in Canaan, until the generation that left Egypt had died. The map point stands on Kadesh-barnea, at the springs of Ain el-Qudeirat on the edge of the Negev."
    - "The Bible dates the stages closely. Israel left Rameses “on the fifteenth day of the first month”, reached the wilderness of Sinai in the third month, and left it “on the twentieth day of the second month, in the second year”. Then came Kadesh, where “ye abode in Kadesh many days”, and the long years of which almost nothing is told: “the space in which we came from Kadesh-barnea, until we were come over the brook Zered, was thirty and eight years”. Aaron died on Mount Hor “in the fortieth year”, Moses spoke the words of Deuteronomy “in the fortieth year, in the eleventh month”, and the people came up out of the Jordan “on the tenth day of the first month”, five days short of forty full years. Numbers 33 lists the camps along the way, forty-two stages from Rameses to the plains of Moab."
    - "The number is repeated throughout the Bible: they ate manna forty years, their clothes did not wear out for forty years, and Stephen and Paul both speak of forty years in the wilderness. The Synodal text of Joshua 5:6, following the Greek, reads that Israel walked in the wilderness forty-two years; the Hebrew has forty. On the Bible's own chronology the years run from about 1446 to 1406 BC, the map's convention; those who place the Exodus in the thirteenth century put them about 1260–1220, and many scholars take forty as the round span of a generation rather than a count of years."
  ru:
    - "Сорок лет, от исхода из Египта до перехода через Иордан, из них около тридцати восьми — между Кадес-Варни и потоком Заред, после того как народ отказался войти в землю. Сорок лет были приговором: «сыны ваши будут кочевать в пустыне сорок лет... год за день», по году за каждый день, что соглядатаи провели в Ханаане, пока не вымрет поколение, вышедшее из Египта. Точка карты стоит на Кадесе, у источников Айн-эль-Кудейрат на краю Негева."
    - "Библия точно датирует этапы. Израиль вышел из Раамсеса «в пятнадцатый день первого месяца», в третий месяц пришёл в пустыню Синайскую и ушёл оттуда «во второй год, во второй месяц, в двадцатый день месяца». Потом был Кадес, где «пробыли вы... много времени», и долгие годы, о которых почти ничего не сказано: «с тех пор, как мы пошли в Кадес-Варни и как прошли долину Заред, минуло тридцать восемь лет». Аарон умер на горе Ор «в сороковой год», Моисей произнёс слова Второзакония «сорокового года, одиннадцатого месяца», а народ вышел из Иордана «в десятый день первого месяца» — за пять дней до полных сорока лет. В 33-й главе Книги Чисел перечислены станы этого пути — сорок два перехода от Раамсеса до равнин Моавитских."
    - "Это число повторяется по всей Библии: манну ели сорок лет, одежды не обветшали за сорок лет, и Стефан, и Павел говорят о сорока годах в пустыне. Синодальный текст Иисуса Навина 5:6, вслед за греческим, говорит, что сыны Израилевы «сорок два года ходили в пустыне»; в еврейском тексте — сорок. По собственной хронологии Библии эти годы идут примерно с 1446 по 1406 г. до н. э., как условно принято на карте; те, кто относит Исход к XIII веку, ставят их около 1260–1220 гг., а многие учёные видят в сорока круглое число одного поколения, а не счёт лет."
  uk:
    - "Сорок років, відлічених від Виходу до переходу через Йордан, з яких близько тридцяти восьми минуло між Кадесом та потоком Заред, після того як народ відмовився увійти в землю. Ці сорок були вироком: «дїти ваші будуть попасати в пустинї сорок років» — «один рік за один день», по року за кожен день, що розвідники провели в Ханаані, доки не вимре покоління, яке вийшло з Єгипту. Точка мапи стоїть на Кадесі, біля джерел Айн-ель-Кудейрат на краю Негеву."
    - "Біблія докладно датує етапи. Ізраїль вирушив із Раамсеса «на пятнайцятий день первого місяця», у третьому місяці досяг Синайської пустелі й залишив її «на другий рік, другого місяця, на двайцятий день». Потім був Кадес, де «пробували ви в Кадесї довго», і довгі роки, про які майже нічого не розказано: «що йшли ми від Кадес-Барне, покіль перебріли Серед-ріку, минуло трийцять і вісїм років». Аарон помер на горі Гор «у сороковому роцї», Мойсей промовив слова Повторення Закону «в сороковому роцї, в одинайцятому місяцї», а народ вийшов із Йордану «десятого дня первого місяця» — за п'ять днів до повних сорока років. Числа 33 перелічує табори вздовж шляху — сорок два етапи від Раамсеса до моавських рівнин."
    - "Це число повторюється по всій Біблії: вони їли ману сорок років, їхній одяг не зношувався сорок років, і Стефан та Павло обидва говорять про сорок років у пустелі. Синодальний текст Нав 5:6, услід за грецьким, читає, що Ізраїль ходив пустелею сорок два роки; в єврейському — сорок. За власною хронологією Біблії ці роки припадають приблизно на 1446–1406 рр. до н. е., умовні для мапи; ті, хто відносить Вихід до XIII ст., ставлять їх близько 1260–1220 рр., і багато вчених вважають сорок круглим терміном покоління, а не підрахунком років."
  es:
    - "Cuarenta años, contados desde el Éxodo hasta el cruce del Jordán, de los cuales unos treinta y ocho transcurrieron entre Cades-barnea y el arroyo de Zered después de que el pueblo se negara a entrar en la tierra. Los cuarenta fueron una sentencia: «vuestros hijos andarán pastoreando en el desierto cuarenta años... un año por cada día», un año por cada día que los espías habían pasado en Canaán, hasta que murió la generación que salió de Egipto. El punto del mapa está en Cades-barnea, en las fuentes de Ain el-Qudeirat, en el borde del Négev."
    - "La Biblia fecha las etapas con detalle. Israel salió de Ramesés «á los quince días del mes primero», llegó al desierto de Sinaí en el mes tercero y lo dejó «en el año segundo, en el mes segundo, á los veinte del mes». Luego vino Cades, donde «estuvisteis en Cades por muchos días», y los largos años de los que casi nada se cuenta: «los días que anduvimos de Cades-barnea hasta que pasamos el arroyo de Zered, fueron treinta y ocho años». Aarón murió en el monte Hor «á los cuarenta años», Moisés habló las palabras del Deuteronomio «á los cuarenta años, en el mes undécimo», y el pueblo subió del Jordán «el diez del mes primero», cinco días antes de completar los cuarenta años. Números 33 enumera los campamentos del camino, cuarenta y dos etapas desde Ramesés hasta las llanuras de Moab."
    - "La cifra se repite a lo largo de la Biblia: comieron maná cuarenta años, sus vestidos no se envejecieron durante cuarenta años, y Esteban y Pablo hablan ambos de cuarenta años en el desierto. El texto sinodal de Josué 5:6, siguiendo el griego, dice que Israel anduvo por el desierto cuarenta y dos años; el hebreo tiene cuarenta. Según la propia cronología de la Biblia, los años van aproximadamente del 1446 al 1406 a. C., la convención del mapa; quienes sitúan el Éxodo en el siglo XIII los ponen hacia 1260–1220, y muchos estudiosos toman el cuarenta como la duración redonda de una generación y no como un cómputo de años."
  pt:
    - "Quarenta anos, contados do Êxodo até a travessia do Jordão, dos quais cerca de trinta e oito foram passados entre Cades-Barneia e o ribeiro de Zerede, depois que o povo se recusou a entrar na terra. Os quarenta foram uma sentença: “Os seus filhos serão peregrinos no deserto por quarenta anos… para cada dia um ano”, um ano para cada dia que os espias passaram em Canaã, até que morresse a geração que saiu do Egito. O ponto do mapa fica em Cades-Barneia, nas fontes de Ain el-Qudeirat, na orla do Neguebe."
    - "A Bíblia data as etapas com precisão. Israel partiu de Ramessés “no décimo quinto dia do primeiro mês”, chegou ao deserto do Sinai no terceiro mês e o deixou “no segundo ano, no segundo mês, no vigésimo dia do mês”. Veio então Cades, onde “vocês permaneceram em Cades por muitos dias”, e os longos anos de que quase nada se conta: “Os dias em que caminhamos desde Cades-Barneia até atravessarmos o ribeiro de Zerede foram trinta e oito anos”. Arão morreu no monte Hor “no quadragésimo ano”, Moisés falou as palavras de Deuteronômio “no quadragésimo ano, no décimo primeiro mês”, e o povo subiu do Jordão “no décimo dia do primeiro mês”, cinco dias antes de completar quarenta anos. Números 33 lista os acampamentos ao longo do caminho, quarenta e duas etapas de Ramessés às planícies de Moabe."
    - "O número se repete em toda a Bíblia: comeram o maná por quarenta anos, suas roupas não se gastaram por quarenta anos, e Estêvão e Paulo falam ambos de quarenta anos no deserto. O texto sinodal de Josué 5:6, seguindo o grego, diz que Israel andou no deserto quarenta e dois anos; o hebraico tem quarenta. Pela cronologia da própria Bíblia os anos vão de cerca de 1446 a 1406 a.C., a convenção do mapa; os que situam o Êxodo no século XIII os põem por volta de 1260–1220, e muitos estudiosos tomam quarenta como a extensão redonda de uma geração, e não uma contagem de anos."
  de:
    - "Vierzig Jahre, gezählt vom Auszug bis zum Jordanübergang, von denen etwa achtunddreißig zwischen Kadesch-Barnea und dem Bach Sered verbracht wurden, nachdem das Volk sich geweigert hatte, ins Land zu ziehen. Die Vierzig waren ein Urteil: „Eure Kinder sollen Hirten sein in dieser Wüste vierzig Jahre ... je ein Tag soll ein Jahr gelten“, ein Jahr für jeden Tag, den die Kundschafter in Kanaan verbracht hatten, bis die Generation, die Ägypten verlassen hatte, gestorben war. Der Kartenpunkt liegt auf Kadesch-Barnea, an den Quellen von Ain el-Qudeirat am Rand des Negev."
    - "Die Bibel datiert die Stationen genau. Israel zog von Ramses aus „am fünfzehnten Tag des ersten Monats“, erreichte im dritten Monat die Wüste Sinai und brach von dort auf „am zwanzigsten Tage im zweiten Monat des zweiten Jahres“. Dann kam Kadesch: „Also bliebet ihr in Kades eine lange Zeit“, und die langen Jahre, von denen fast nichts erzählt wird: „Die Zeit aber, die wir von Kades-Barnea zogen, bis wir durch den Bach Sered kamen, war achtunddreißig Jahre“. Aaron starb auf dem Berg Hor „im vierzigsten Jahr des Auszugs“, Mose redete die Worte des 5. Buches Mose „im vierzigsten Jahr, am ersten Tage des elften Monats“, und das Volk stieg aus dem Jordan herauf, als „der zehnte Tag des ersten Monats“ war, fünf Tage vor vierzig vollen Jahren. 4. Mose 33 zählt die Lager unterwegs auf, zweiundvierzig Stationen von Ramses bis zu den Ebenen Moabs."
    - "Die Zahl kehrt in der ganzen Bibel wieder: Sie aßen vierzig Jahre Manna, ihre Kleider veralteten vierzig Jahre nicht, und Stephanus und Paulus sprechen beide von vierzig Jahren in der Wüste. Der Synodaltext von Josua 5,6 liest, der griechischen Fassung folgend, Israel sei zweiundvierzig Jahre in der Wüste gewandelt; der hebräische Text hat vierzig. Nach der eigenen Chronologie der Bibel laufen die Jahre von etwa 1446 bis 1406 v. Chr., der Konvention der Karte; wer den Auszug ins 13. Jahrhundert setzt, legt sie auf etwa 1260–1220, und viele Gelehrte sehen in der Vierzig die runde Spanne einer Generation statt einer Jahreszählung."
  fr:
    - "Quarante ans, comptés de l’Exode au passage du Jourdain, dont environ trente-huit passés entre Kadès-Barnéa et le torrent de Zéred après que le peuple eut refusé d’entrer dans le pays. Ces quarante ans furent une sentence : « vos enfants paîtront quarante années dans le désert … une année pour chaque jour », une année pour chaque jour que les espions avaient passé en Canaan, jusqu’à la disparition de la génération sortie d’Égypte. Le point de la carte est sur Kadès-Barnéa, aux sources d’Aïn el-Qoudeirat, en lisière du Néguev."
    - "La Bible date les étapes avec précision. Israël quitta Ramsès « le quinzième jour du premier mois », atteignit le désert de Sinaï au troisième mois, et le quitta « le vingtième jour du second mois de la seconde année ». Vint ensuite Kadès, où « le temps que vous y avez passé fut de longue durée », puis les longues années dont presque rien n’est dit : « le temps que durèrent nos marches de Kadès-Barnéa au passage du torrent de Zéred fut de trente-huit ans ». Aaron mourut sur le mont Hor « la quarantième année », Moïse prononça les paroles du Deutéronome « dans la quarantième année, au onzième mois », et le peuple sortit du Jourdain « le dixième jour du premier mois », cinq jours avant quarante ans pleins. Nombres 33 énumère les campements, quarante-deux étapes de Ramsès aux plaines de Moab."
    - "Le nombre revient dans toute la Bible : ils mangèrent la manne pendant quarante ans, leurs vêtements ne s’usèrent pas pendant quarante ans, et Étienne comme Paul parlent de quarante ans dans le désert. Le texte synodal de Josué 5:6, d’après le grec, dit qu’Israël marcha dans le désert quarante-deux ans ; l’hébreu a quarante. Selon la chronologie propre de la Bible, ces années vont d’environ 1446 à 1406 av. J.-C., convention de la carte ; ceux qui placent l’Exode au XIIIe siècle les situent vers 1260–1220, et nombre de savants tiennent quarante pour la durée ronde d’une génération plutôt que pour un décompte d’années."
  pl:
    - "Czterdzieści lat, licząc od Wyjścia do przejścia przez Jordan, z czego około trzydziestu ośmiu spędzono między Kadesz-Barnea a potokiem Zared po tym, jak lud odmówił wejścia do ziemi. Czterdzieści lat było wyrokiem: „synowie wasi będą się tułali po tej puszczy przez czterdzieści lat”, „dzień każdy za rok licząc”, rok za każdy dzień, który szpiedzy spędzili w Kanaanie, aż wymrze pokolenie, które wyszło z Egiptu. Punkt na mapie stoi na Kadesz-Barnea, przy źródłach Ajn el-Kudejrat na skraju Negewu."
    - "Biblia dokładnie datuje etapy. Izrael wyszedł z Ramses „piętnastego dnia tegoż pierwszego miesiąca”, dotarł na pustynię Synaj w trzecim miesiącu i opuścił ją „roku wtórego, miesiąca wtórego, dnia dwudziestego tegoż miesiąca”. Potem przyszedł Kadesz: „Mieszkaliście tedy w Kades przez wiele dni”, i długie lata, o których prawie nic nie opowiedziano: „A czasu, któregośmy chodzili od Kades Barne, ażeśmy się przeprawili przez potok Zared, było trzydzieści i osiem lat”. Aaron umarł na górze Hor „roku czterdziestego”, Mojżesz wygłosił słowa Księgi Powtórzonego Prawa „czterdziestego roku, jedenastego miesiąca”, a lud wyszedł z Jordanu „dziesiątego dnia miesiąca pierwszego”, pięć dni przed pełnymi czterdziestoma laty. Księga Liczb 33 wylicza obozy po drodze, czterdzieści dwa etapy od Ramses do równin Moabu."
    - "Liczba powtarza się w całej Biblii: mannę jedli czterdzieści lat, ich szaty nie zniszczyły się przez czterdzieści lat, a Szczepan i Paweł mówią o czterdziestu latach na pustyni. Tekst synodalny Joz 5,6, idący za greckim, głosi, że Izrael chodził po pustyni czterdzieści dwa lata; hebrajski ma czterdzieści. Według własnej chronologii Biblii lata te przypadają na okres od około 1446 do 1406 p.n.e., umowny rok mapy; ci, którzy umieszczają Wyjście w XIII wieku, kładą je około 1260–1220, a wielu uczonych uznaje czterdzieści za okrągłe określenie pokolenia, a nie liczbę lat."
  it:
    - "Quarant’anni, contati dall’Esodo all’attraversamento del Giordano, dei quali circa trentotto trascorsi tra Kades-Barnea e il torrente Zered dopo che il popolo rifiutò di entrare nel paese. I quaranta furono una sentenza: «i vostri figliuoli andran pascendo i greggi nel deserto per quarant’anni … un anno per ogni giorno», cioè per i giorni che gli esploratori avevano trascorso in Canaan, finché fosse morta la generazione uscita dall’Egitto. Il punto della mappa si trova a Kades-Barnea, alle sorgenti di Ain el-Qudeirat al margine del Negev."
    - "La Bibbia data le tappe con precisione. Israele lasciò Ramses «il quindicesimo giorno del primo mese», raggiunse il deserto del Sinai nel terzo mese e lo lasciò «il secondo anno il secondo mese, il ventesimo giorno del mese». Seguì Kades, dove «rimaneste in Kades molti giorni», e i lunghi anni di cui quasi nulla è narrato: «il tempo che durarono le nostre marce, da Kades-Barnea al passaggio del torrente di Zered, fu di trentotto anni». Aronne morì sul monte Or «il quarantesimo anno», Mosè pronunciò le parole del Deuteronomio «il quarantesimo anno, l’undecimo mese», e il popolo uscì dal Giordano «il decimo giorno del primo mese», a cinque giorni dai quarant’anni pieni. Numeri 33 elenca gli accampamenti lungo la via, quarantadue tappe da Ramses alle pianure di Moab."
    - "Il numero ricorre in tutta la Bibbia: mangiarono la manna per quarant’anni, le loro vesti non si logorarono per quarant’anni, e Stefano e Paolo parlano entrambi di quarant’anni nel deserto. Il testo sinodale di Giosuè 5,6, che segue il greco, legge che Israele camminò nel deserto quarantadue anni; l’ebraico ha quaranta. Secondo la cronologia della stessa Bibbia gli anni vanno dal 1446 al 1406 a.C. circa, la convenzione della mappa; chi colloca l’Esodo nel XIII secolo li pone intorno al 1260–1220, e molti studiosi considerano il quaranta come l’arco tondo di una generazione più che un conteggio di anni."
  nl:
    - "Veertig jaar, geteld van de uittocht tot de doortocht door de Jordaan, waarvan ongeveer achtendertig tussen Kades-Barnea en de beek Zered werden doorgebracht nadat het volk had geweigerd het land binnen te gaan. De veertig was een vonnis: “uw kinderen zullen gaan weiden in deze woestijn, veertig jaren … elken dag voor elk jaar”, één jaar voor elke dag die de verspieders in Kanaän hadden doorgebracht, totdat het geslacht dat uit Egypte was getrokken was gestorven. Het punt op de kaart staat op Kades-Barnea, bij de bronnen van Ain el-Qudeirat aan de rand van de Negev."
    - "De Bijbel dateert de etappes nauwkeurig. Israël vertrok uit Raämses “op den vijftienden dag der eerste maand”, bereikte de woestijn Sinaï in de derde maand en verliet haar “in het tweede jaar, in de tweede maand, op den twintigsten van de maand”. Daarna kwam Kades, waar “gij in Kades vele dagen” bleef, en de lange jaren waarvan bijna niets wordt verteld: “de dagen nu, die wij gewandeld hebben van Kades-Barnea, totdat wij over de beek Zered getogen zijn, waren acht en dertig jaren”. Aäron stierf op de berg Hor “in het veertigste jaar”, Mozes sprak de woorden van Deuteronomium “in het veertigste jaar, in de elfde maand”, en het volk kwam uit de Jordaan omhoog “den tienden der eerste maand”, vijf dagen vóór volle veertig jaar. Numeri 33 somt de kampen langs de weg op, tweeënveertig etappes van Raämses tot de vlakten van Moab."
    - "Het getal wordt in heel de Bijbel herhaald: zij aten manna veertig jaar, hun kleren raakten veertig jaar lang niet versleten, en Stefanus en Paulus spreken beiden van veertig jaar in de woestijn. De Synodale tekst van Jozua 5:6 leest, in navolging van het Grieks, dat Israël tweeënveertig jaar in de woestijn wandelde; het Hebreeuws heeft veertig. Volgens de eigen chronologie van de Bijbel lopen de jaren van ongeveer 1446 tot 1406 v.Chr., de conventie van de kaart; wie de uittocht in de 13e eeuw v.Chr. plaatst, legt ze rond 1260–1220, en veel geleerden zien veertig als de ronde spanne van een generatie in plaats van een telling van jaren."
  cs:
    - "Čtyřicet let, počítáno od exodu k přechodu Jordánu, z nichž asi osmatřicet strávil lid mezi Kádeš-barneou a potokem Zered poté, co odmítl vstoupit do země. Těch čtyřicet bylo trestem: „synové vaši budou tuláci na poušti této čtyřidceti let … jeden každý den za rok počítaje“, jeden rok za každý den, který zvědové strávili v Kanaánu, dokud nevymřela generace, která vyšla z Egypta. Bod na mapě stojí na Kádeš-barnea, u pramenů Ajn Qudejrát na okraji Negevu."
    - "Bible datuje etapy přesně. Izrael vyšel z Ramesse „v patnáctý den téhož prvního měsíce“, ve třetím měsíci dorazil na poušť Sinaj a opustil ji „léta druhého, dvadcátý den měsíce druhého“. Pak přišel Kádeš, kde „zůstali jste v Kádes za mnohé dny“, a dlouhá léta, o nichž se téměř nic nevypráví: „Času pak, v němž jsme šli z Kádesbarne, až jsme přešli potok Záred, bylo let třidceti osm“. Áron zemřel na hoře Hor „léta čtyřidcátého“, Mojžíš pronesl slova Deuteronomia „čtyřidcátého léta, jedenáctého měsíce“ a lid vystoupil z Jordánu „desátého dne měsíce prvního“, pět dní před čtyřiceti plnými roky. Čísla 33 uvádějí tábory na cestě, dvaačtyřicet etap od Ramesse po pláně Moábu."
    - "Číslo se opakuje v celé Bibli: lid jedl manu čtyřicet let, jeho oděv se neobnosil čtyřicet let a Štěpán i Pavel mluví o čtyřiceti letech na poušti. Synodální text Joz 5,6 podle řečtiny uvádí, že Izrael chodil po poušti čtyřicet dva roky; hebrejský text má čtyřicet. Podle vlastní chronologie Bible běží ta léta zhruba od roku 1446 do 1406 př. n. l., což je konvence mapy; ti, kdo kladou exodus do 13. století, je kladou asi do let 1260–1220, a mnozí badatelé berou čtyřicet jako kulaté vymezení jedné generace, nikoli počet let."
  sv:
    - "Fyrtio år, räknade från uttåget till övergången över Jordan, av vilka omkring trettioåtta tillbringades mellan Kadesh-Barnea och bäcken Sered efter att folket vägrat gå in i landet. De fyrtio åren var en dom: ”edra barn skola draga omkring såsom herdar i öknen i fyrtio år”, ”ett år för var dag”, ett år för varje dag som spejarna hade tillbringat i Kanaan, tills den generation som lämnade Egypten hade dött. Kartpunkten står på Kadesh-Barnea, vid källorna Ain el-Qudeirat i utkanten av Negev."
    - "Bibeln daterar etapperna noga. Israel bröt upp från Rameses ”i första månaden, på femtonde dagen i första månaden”, nådde Sinais öken i tredje månaden och lämnade den ”i andra året, i andra månaden, på tjugonde dagen i månaden”. Därefter kom Kadesh, där ”I stannaden länge i Kades”, och de långa åren om vilka nästan ingenting berättas: ”den tid som åtgick för vår vandring från Kades-Barnea, till dess vi gingo över bäcken Sered, var trettioåtta år”. Aron dog på berget Hor ”i det fyrtionde året”, Mose talade 5 Moseboks ord ”i det fyrtionde året, i elfte månaden”, och folket steg upp ur Jordan ”på tionde dagen i första månaden”, fem dagar kort av fyrtio hela år. 4 Mosebok 33 förtecknar lägerplatserna längs vägen, fyrtiotvå etapper från Rameses till Moabs hedar."
    - "Talet upprepas genom hela Bibeln: de åt manna i fyrtio år, deras kläder blev inte utslitna på fyrtio år, och både Stefanos och Paulus talar om fyrtio år i öknen. Synodalbibelns text i Josua 5:6, som följer den grekiska, lyder att Israel vandrade i öknen i fyrtiotvå år; hebreiskan har fyrtio. Enligt Bibelns egen kronologi löper åren från omkring 1446 till 1406 f.Kr., kartans konvention; de som förlägger uttåget till 1200-talet f.Kr. placerar dem omkring 1260–1220, och många forskare tar fyrtio som det runda måttet på en generation snarare än som en räkning av år."
  nb:
    - "Førti år, regnet fra uttoget til overgangen over Jordan, hvorav omtrent trettiåtte ble tilbrakt mellom Kadesj-Barnea og bekken Sered etter at folket nektet å gå inn i landet. De førti årene var en dom: «eders barn skal flakke om som hyrder i ørkenen i firti år … et år for hver dag», ett år for hver dag speiderne hadde vært i Kanaan, inntil slekten som dro ut av Egypt, var død. Kartpunktet står på Kadesj-Barnea, ved kildene Ain el-Qudeirat i utkanten av Negev."
    - "Bibelen daterer etappene nøye. Israel brøt opp fra Ramses «I den første måned, på den femtende dag i måneden», nådde Sinai ørken i den tredje måneden og forlot den «i det annet år i den annen måned, på den tyvende dag i måneden». Så kom Kadesj, der «I måtte bli i Kades i lang tid», og de lange årene som det nesten ikke fortelles noe om: «Den tid vi var på vandring fra Kades-Barnea, til vi gikk over Sered-bekken, var åtte og tretti år». Aron døde på Hor-fjellet «i det firtiende år», Moses talte ordene i 5 Mosebok «i det firtiende år, i den ellevte måned», og folket steg opp av Jordan «den tiende dag i den første måned», fem dager før førti hele år. 4 Mos 33 lister opp leirene underveis, førtito etapper fra Ramses til Moabs sletter."
    - "Tallet gjentas gjennom hele Bibelen: de åt manna i førti år, klærne deres ble ikke utslitt på førti år, og både Stefanus og Paulus taler om førti år i ørkenen. Synodalbibelens tekst i Josva 5,6, som følger den greske, har at Israel vandret i ørkenen i førtito år; den hebraiske har førti. Etter Bibelens egen kronologi løper årene fra omtrent 1446 til 1406 f.Kr., kartets konvensjon; de som plasserer uttoget på 1200-tallet f.Kr., setter dem til omtrent 1260–1220, og mange forskere tar førti som den runde lengden av en generasjon snarere enn en opptelling av år."
  tl:
    - "Apatnapung taon, mula sa Exodo hanggang sa pagtawid sa Jordan, na mga tatlumpu't walo ay ginugol sa pagitan ng Cades-barnea at ng batis ng Zered nang tumanggi ang bayang pumasok sa lupain. Ang apatnapu ay isang hatol: “ang inyong mga anak ay magiging gala sa ilang na apat na pung taon … sa bawa't araw ay isang taon”, isang taon sa bawat araw na ginugol ng mga tiktik sa Canaan, hanggang sa mamatay ang lahing umalis sa Egipto. Ang tuldok sa mapa ay nasa Cades-barnea, sa mga bukal ng Ain el-Qudeirat sa gilid ng Negev."
    - "Masinsing itinatakda ng Biblia ang mga yugto. Umalis ang Israel sa Rameses “nang ikalabing limang araw ng unang buwan”, narating ang ilang ng Sinai sa ikatlong buwan, at umalis doon “sa ikalawang taon, nang ikalawang buwan, nang ikadalawang pung araw ng buwan”. Sumunod ang Cades, kung saan “natira kayong malaon sa Cades”, at ang mahahabang taong halos walang salaysay: “ang mga araw na ating ipinaglakad mula sa Cades-barnea hanggang sa tayo'y nakarating sa batis ng Zered, ay tatlong pu't walong taon”. Namatay si Aaron sa Bundok Hor “sa ikaapat na pung taon”, sinalita ni Moises ang Deuteronomio “nang ikaapat na pung taon, nang ikalabing isang buwan”, at umahon ang bayan mula sa Jordan “nang ikasangpung araw ng unang buwan”, limang araw na kulang sa 40 taon. Inililista ng Mga Bilang 33 ang 42 kampamento mula sa Rameses hanggang sa mga kapatagan ng Moab."
    - "Inuulit sa buong Biblia ang bilang: kumain sila ng manna sa loob ng apatnapung taon, hindi naluma ang kanilang mga damit sa loob ng apatnapung taon, at parehong binanggit nina Esteban at Pablo ang apatnapung taon sa ilang. Ang tekstong Sinodal ng Josue 5:6, na sumusunod sa Griyego, ay nagsasabing lumakad ang Israel sa ilang nang apatnapu't dalawang taon; ang Hebreo ay apatnapu. Ayon sa sariling kronolohiya ng Biblia, ang mga taon ay mula mga 1446 hanggang 1406 BK, ang kombensiyon ng mapa; ang naglalagay ng Exodo sa ikalabintatlong siglo ay naglalagay sa mga ito sa mga 1260–1220, at itinuturing ng maraming iskolar ang apatnapu bilang bilog na haba ng isang salinlahi, hindi bilang bilang ng mga taon."
  da:
    - "Fyrre år, regnet fra udvandringen til overgangen over Jordan, hvoraf omkring otteogtredive blev tilbragt mellem Kadesj-Barnea og Sered-bækken, efter at folket havde nægtet at drage ind i landet. De fyrre var en dom: »eders Børn skulle være Hyrder i Ørken fyrretyve Aar« og »et Aar for hver Dag«, ét år for hver dag, spejderne havde tilbragt i Kana'an, indtil den slægt, der forlod Egypten, var død. Kortets punkt står på Kadesj-Barnea, ved kilderne i Ajin el-Qudeirat på kanten af Negev."
    - "Bibelen daterer etaperne nøje. Israel forlod Ramses »paa den femtende Dag i den første Maaned«, nåede Sinais ørken i den tredje måned og brød op fra den »i det andet Aar, i den anden Maaned, paa den tyvende Dag i Maaneden«. Så kom Kadesj, hvor »bleve I i Kades mange Dage«, og de lange år, hvorom næsten intet fortælles: »de Dage, vi have vandret fra Kades-Barnea, indtil vi kom over Bækken Sered, vare otte og tredive Aar«. Aron døde på bjerget Hor »i det fyrretyvende Aar«, Moses talte Femte Mosebogs ord »i det fyrretyvende Aar, i den ellevte Maaned, paa den første Dag i Maaneden«, og folket steg op af Jordan »paa den tiende Dag i den første Maaned«, fem dage før fyrre fulde år. Fjerde Mosebog 33 opregner lejrene undervejs, toogfyrre etaper fra Ramses til Moabs sletter."
    - "Tallet gentages overalt i Bibelen: de åd manna i fyrre år, deres klæder blev ikke slidt op i fyrre år, og Stefanus og Paulus taler begge om fyrre år i ørkenen. Den synodale tekst af Jos 5,6 følger den græske og lyder, at Israel vandrede i ørkenen toogfyrre år; den hebraiske har fyrre. Efter Bibelens egen kronologi løber årene fra omkring 1446 til 1406 f.Kr., kortets konvention; de, der placerer udvandringen i 1200-tallet, sætter dem til omkring 1260–1220, og mange forskere tager fyrre som den runde spændvidde af en generation snarere end en optælling af år."
  sr:
    - "Четрдесет година, рачунато од Изласка до преласка Јордана, од којих је око тридесет осам проведено између Кадис-Варније и потока Заред пошто је народ одбио да уђе у земљу. Тих четрдесет била је казна: „А деца ваша биће пастири по пустињи четрдесет година… за сваки дан по годину“, по једна година за сваки дан који су уходе провеле у Ханану, док не изумре нараштај који је изашао из Египта. Тачка на карти стоји на Кадис-Варнији, на изворима Аин ел Кудејрат на ивици Негева."
    - "Библија прецизно датира етапе. Израиљ је кренуо из Рамесе „првог месеца петнаести дан“, у трећем месецу стигао у Синајску пустињу, а из ње отишао „у двадесети дан другог месеца друге године“. Затим је дошао Кадис, где је речено: „И остадосте у Кадису дуго времена“, и дуге године о којима се готово ништа не прича: „А времена за које идосмо од Кадис-Варније па докле пређосмо преко потока Зареда, беше тридесет и осам година“. Арон је умро на гори Ор „четрдесете године“, Мојсије је изговорио речи Поновљених закона „четрдесете године први дан једанаестог месеца“, а народ је изашао из Јордана „десетог дана првог месеца“, пет дана пре пуних четрдесет година. Бројеви 33 набрајају логоре на путу, четрдесет две етапе од Рамесе до моавских равница."
    - "Тај број се понавља кроз целу Библију: четрдесет година јели су ману, њихова одећа није се хабала четрдесет година, а и Стефан и Павле говоре о четрдесет година у пустињи. Руски синодални текст Исуса Навина 5,6, следећи грчки, гласи да је Израиљ ишао по пустињи четрдесет две године; хебрејски има четрдесет. По сопственој хронологији Библије те године теку отприлике од 1446. до 1406. п. н. е., што је усвојено на карти; они који Излазак смештају у 13. век стављају их око 1260–1220, а многи научници четрдесет узимају као округао распон једног нараштаја, а не као бројање година."
