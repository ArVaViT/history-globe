id: where-did-joseph-flee-in-egypt
question:
  en: "Where in Egypt did Joseph take Mary and the child?"
  ru: "Куда в Египте Иосиф увёл Марию и Младенца?"
  uk: "Куди в Єгипті Йосип відвів Марію й Дитя?"
  es: "¿A qué lugar de Egipto llevó José a María y al niño?"
  pt: "Para onde, no Egito, José levou Maria e o menino?"
  de: "Wohin in Ägypten brachte Josef Maria und das Kind?"
  fr: "Où en Égypte Joseph emmena-t-il Marie et l’enfant ?"
  pl: "Dokąd w Egipcie Józef zabrał Marię i dziecko?"
  it: "Dove in Egitto Giuseppe portò Maria e il bambino?"
  nl: "Waarheen in Egypte bracht Jozef Maria en het kind?"
  cs: "Kam v Egyptě Josef odvedl Marii a dítě?"
  sv: "Vart i Egypten tog Josef Maria och barnet?"
  nb: "Hvor i Egypt tok Josef med Maria og barnet?"
answer:
  en:
    - "Matthew does not say. He writes only that Joseph “took the young child and his mother by night, and departed into Egypt: And was there until the death of Herod”, and that after the dream in Egypt he came back to the land of Israel and settled at Nazareth. Egypt was the nearest Roman province outside Herod's reach, with a Jewish population of hundreds of thousands, above all in Alexandria; the map point stands at Heliopolis, the On of Genesis, about 410 km from Bethlehem in a straight line, the first stop that the later tradition names in the Nile valley."
    - "The places come from tradition. The Gospel of Pseudo-Matthew, a Latin text of the early Middle Ages, has the idols fall at a city it calls Sotinen in Hermopolis; a homily ascribed to the patriarch Theophilus of Alexandria (died 412) but written much later, in which the Virgin tells him the story in a vision, takes the family by Bubastis and Hermopolis up the Nile to a house at Qusqam in Upper Egypt. The Coptic Church keeps a fuller route today, from Pelusium by Bubastis, Heliopolis and Babylon of Egypt (Old Cairo) up to Qusqam: the sycamore and spring at Matariya in Heliopolis, the crypt of the church of St Sergius in Old Cairo, and the monastery of al-Muharraq at Qusqam, where the family is said to have lived six months until the angel told Joseph to return."
    - "The length of the stay is also unknown; Matthew ties the return to Herod's death in 4 BC, and the Copts count about three and a half years. Matthew's point is not the route but the fulfilment: “Out of Egypt have I called my son”, Hosea's words about Israel, now spoken of the child who retraces the nation's path."
  ru:
    - "Матфей не говорит. Он пишет лишь, что Иосиф «взял Младенца и Матерь Его ночью и пошел в Египет, и там был до смерти Ирода», а после сна в Египте вернулся в землю Израилеву и поселился в Назарете. Египет был ближайшей римской провинцией вне власти Ирода, с иудейским населением в сотни тысяч, прежде всего в Александрии; точка карты стоит в Илиополе — Оне Книги Бытия, примерно в 410 км от Вифлеема по прямой, первой остановке в долине Нила, которую называет позднейшее предание."
    - "Все места — из предания. Евангелие Псевдо-Матфея, латинский текст раннего Средневековья, обрушивает идолов в городе, который называет Сотинен в Гермополе; проповедь, приписанная патриарху Феофилу Александрийскому (умер в 412 году), но написанная много позже, где Богородица рассказывает ему всё в видении, ведёт семью через Бубастис и Гермополь вверх по Нилу до дома в Кускаме в Верхнем Египте. Коптская церковь хранит и сегодня более полный маршрут — от Пелусия (библейского Сина) через Бубастис, Илиополь и Вавилон Египетский (Старый Каир) до Кускама: сикомора и источник в Матарии в Илиополе, крипта церкви святого Сергия в Старом Каире и монастырь аль-Мухаррак в Кускаме, где, по преданию, семья прожила полгода, пока ангел не велел Иосифу вернуться."
    - "Длительность пребывания тоже неизвестна; Матфей связывает возвращение со смертью Ирода в 4 г. до н. э., а копты насчитывают около трёх с половиной лет. Для Матфея важен не маршрут, а исполнение: «из Египта воззвал Я Сына Моего» — слова Осии об Израиле, сказанные теперь о Младенце, который повторяет путь народа."
  uk:
    - "Матвій не каже. Він пише лише, що Йосип «взяв хлопятко й матїр його в ночі, та й пійшов у Єгипет» і «пробував там аж до смерти Іродової», а після сну в Єгипті повернувся в землю Ізраїлеву й оселився в Назареті. Єгипет був найближчою римською провінцією поза досяжністю Ірода, з єврейським населенням у сотні тисяч, насамперед в Александрії; точка мапи стоїть у Геліополі, Оні з Книги Буття, приблизно за 410 км від Вифлеєму по прямій, на першій зупинці в долині Нілу, яку називає пізніша традиція."
    - "Місця походять із традиції. Євангеліє Псевдо-Матвія, латинський текст раннього середньовіччя, змушує ідолів упасти в місті, яке воно називає Сотінен у Гермополі; проповідь, приписувана патріархові Александрійському Феофілу (помер 412), але написана значно пізніше, в якій Діва розповідає йому історію у видінні, веде родину через Бубастіс і Гермополь Нілом угору до дому в Кускамі у Верхньому Єгипті. Коптська церква нині зберігає повніший маршрут, від Пелусія через Бубастіс, Геліополь і Вавилон Єгипетський (Старий Каїр) угору до Кускама: сикомора й джерело в Матарії в Геліополі, крипта церкви святого Сергія в Старому Каїрі та монастир аль-Мухаррак у Кускамі, де, як кажуть, родина жила шість місяців, доки ангел не звелів Йосипові повертатися."
    - "Тривалість перебування також невідома; Матвій пов'язує повернення зі смертю Ірода 4 р. до н. е., а копти рахують близько трьох з половиною років. Суть Матвія не в маршруті, а в здійсненні: «Із Єгипту покликав я сина мого» — слова Осії про Ізраїль, тепер сказані про дитя, що повторює шлях народу."
  es:
    - "Mateo no lo dice. Escribe solo que José «tomó al niño y á su madre de noche, y se fué á Egipto; Y estuvo allá hasta la muerte de Herodes», y que tras el sueño en Egipto volvió a la tierra de Israel y se estableció en Nazaret. Egipto era la provincia romana más cercana fuera del alcance de Herodes, con una población judía de cientos de miles, sobre todo en Alejandría; el punto del mapa está en Heliópolis, la On del Génesis, a unos 410 km de Belén en línea recta, la primera parada que la tradición posterior nombra en el valle del Nilo."
    - "Los lugares proceden de la tradición. El Evangelio del Pseudo-Mateo, un texto latino de la alta Edad Media, hace caer los ídolos en una ciudad que llama Sotinen, en Hermópolis; una homilía atribuida al patriarca Teófilo de Alejandría (muerto en 412) pero escrita mucho después, en la que la Virgen le cuenta la historia en una visión, lleva a la familia por Bubastis y Hermópolis, Nilo arriba, hasta una casa en Qusqam, en el Alto Egipto. La Iglesia copta conserva hoy una ruta más completa, desde Pelusio por Bubastis, Heliópolis y Babilonia de Egipto (el Antiguo Cairo) hasta Qusqam: el sicomoro y la fuente de Matariya, en Heliópolis, la cripta de la iglesia de San Sergio en el Antiguo Cairo y el monasterio de al-Muharraq en Qusqam, donde se dice que la familia vivió seis meses hasta que el ángel dijo a José que regresara."
    - "Tampoco se conoce la duración de la estancia; Mateo vincula el regreso a la muerte de Herodes en el 4 a. C., y los coptos cuentan unos tres años y medio. Lo que importa a Mateo no es la ruta sino el cumplimiento: «De Egipto llamé á mi Hijo», palabras de Oseas sobre Israel, dichas ahora del niño que recorre de nuevo el camino de la nación."
  pt:
    - "Mateus não diz. Escreve apenas que José “tomou o menino e sua mãe, de noite, e partiu para o Egito, e lá ficou até a morte de Herodes”, e que, depois do sonho no Egito, voltou à terra de Israel e se fixou em Nazaré. O Egito era a província romana mais próxima fora do alcance de Herodes, com uma população judaica de centenas de milhares, sobretudo em Alexandria; o ponto do mapa está em Heliópolis, o On de Gênesis, a cerca de 410 km de Belém em linha reta, a primeira parada que a tradição posterior nomeia no vale do Nilo."
    - "Os lugares vêm da tradição. O Evangelho de Pseudo-Mateus, texto latino do início da Idade Média, faz os ídolos caírem numa cidade que chama Sotinen, em Hermópolis; uma homilia atribuída ao patriarca Teófilo de Alexandria (morto em 412) mas escrita muito depois, na qual a Virgem lhe conta a história numa visão, leva a família por Bubástis e Hermópolis, Nilo acima, até uma casa em Cuscam, no Alto Egito. A Igreja copta guarda hoje uma rota mais completa, de Pelúsio por Bubástis, Heliópolis e Babilônia do Egito (Velho Cairo) até Cuscam: o sicômoro e a fonte de Matariya, em Heliópolis, a cripta da igreja de São Sérgio no Velho Cairo e o mosteiro de al-Muharraq em Cuscam, onde se diz que a família viveu seis meses até que o anjo mandou José voltar."
    - "A duração da estada também é desconhecida; Mateus liga o regresso à morte de Herodes em 4 a.C., e os coptas contam cerca de três anos e meio. O ponto de Mateus não é a rota, mas o cumprimento: “Do Egito chamei o meu filho”, palavras de Oseias sobre Israel, ditas agora do menino que refaz o caminho da nação."
  de:
    - "Matthäus sagt es nicht. Er schreibt nur, Josef „stand auf und nahm das Kindlein und seine Mutter zu sich bei der Nacht und entwich nach Ägyptenland. Und blieb allda bis nach dem Tod des Herodes“, und dass er nach dem Traum in Ägypten ins Land Israel zurückkam und sich in Nazareth niederließ. Ägypten war die nächste römische Provinz außerhalb des Machtbereichs des Herodes, mit einer jüdischen Bevölkerung von Hunderttausenden, vor allem in Alexandria; der Kartenpunkt liegt bei Heliopolis, dem On der Genesis, in der Luftlinie etwa 410 km von Bethlehem, der ersten Station im Niltal, die die spätere Überlieferung nennt."
    - "Die Orte stammen aus der Überlieferung. Das Pseudo-Matthäus-Evangelium, ein lateinischer Text des frühen Mittelalters, lässt die Götzenbilder in einer Stadt namens Sotinen in Hermopolis fallen; eine Homilie, die dem Patriarchen Theophilus von Alexandria (gestorben 412) zugeschrieben, aber viel später verfasst wurde und in der die Jungfrau ihm die Geschichte in einer Vision erzählt, führt die Familie über Bubastis und Hermopolis den Nil hinauf zu einem Haus in Quskam in Oberägypten. Die Koptische Kirche bewahrt heute eine ausführlichere Route, von Pelusium über Bubastis, Heliopolis und Babylon in Ägypten (Alt-Kairo) hinauf nach Quskam: die Sykomore und Quelle in Matarija bei Heliopolis, die Krypta der Sergiuskirche in Alt-Kairo und das Kloster al-Muharraq in Quskam, wo die Familie sechs Monate gelebt haben soll, bis der Engel Josef zur Rückkehr aufforderte."
    - "Auch die Dauer des Aufenthalts ist unbekannt; Matthäus bindet die Rückkehr an den Tod des Herodes 4 v. Chr., und die Kopten zählen etwa dreieinhalb Jahre. Matthäus' Anliegen ist nicht die Route, sondern die Erfüllung: „Aus Ägypten habe ich meinen Sohn gerufen“, Hoseas Worte über Israel, nun gesprochen über das Kind, das den Weg des Volkes zurückgeht."
  fr:
    - "Matthieu ne le dit pas. Il écrit seulement que Joseph « prit de nuit le petit enfant et sa mère, et se retira en Égypte. Il y resta jusqu’à la mort d’Hérode », et qu’après le songe en Égypte il revint au pays d’Israël et s’établit à Nazareth. L’Égypte était la province romaine la plus proche hors de portée d’Hérode, avec une population juive de centaines de milliers de personnes, surtout à Alexandrie ; le point de la carte est à Héliopolis, l’On de la Genèse, à environ 410 km de Bethléem en ligne droite, première étape que la tradition postérieure nomme dans la vallée du Nil."
    - "Les lieux viennent de la tradition. L’Évangile du Pseudo-Matthieu, texte latin du haut Moyen Âge, fait tomber les idoles dans une ville qu’il appelle Sotinen, en Hermopolis ; une homélie attribuée au patriarche Théophile d’Alexandrie (mort en 412) mais écrite bien plus tard, où la Vierge lui raconte l’histoire dans une vision, conduit la famille par Bubastis et Hermopolis, en remontant le Nil, jusqu’à une maison à Qousqam en Haute-Égypte. L’Église copte garde aujourd’hui un itinéraire plus complet, de Péluse par Bubastis, Héliopolis et Babylone d’Égypte (le Vieux Caire) jusqu’à Qousqam : le sycomore et la source de Matariya à Héliopolis, la crypte de l’église Saint-Serge du Vieux Caire et le monastère d’al-Muharraq à Qousqam, où la famille aurait vécu six mois jusqu’à ce que l’ange dise à Joseph de revenir."
    - "La durée du séjour est aussi inconnue ; Matthieu lie le retour à la mort d’Hérode en 4 av. J.-C., et les Coptes comptent environ trois ans et demi. Matthieu ne vise pas l’itinéraire mais l’accomplissement : « J’ai appelé mon fils hors d’Égypte », mots d’Osée sur Israël, dits ici de l’enfant qui refait le chemin de la nation."
  pl:
    - "Mateusz tego nie mówi. Pisze tylko, że Józef „wziął dzieciątko i matkę jego w nocy, i uszedł do Egiptu; I był tam aż do śmierci Herodowej”, i że po śnie w Egipcie wrócił do ziemi Izraela i osiadł w Nazarecie. Egipt był najbliższą prowincją rzymską poza zasięgiem Heroda, z ludnością żydowską liczącą setki tysięcy, przede wszystkim w Aleksandrii; punkt na mapie stoi w Heliopolis, On z Księgi Rodzaju, około 410 km od Betlejem w linii prostej, w pierwszym przystanku w dolinie Nilu, który wymienia późniejsza tradycja."
    - "Miejsca pochodzą z tradycji. Ewangelia Pseudo-Mateusza, łaciński tekst wczesnego średniowiecza, każe upaść bożkom w mieście, które nazywa Sotinen w Hermopolis; homilia przypisywana patriarsze Teofilowi Aleksandryjskiemu (zm. 412), lecz napisana znacznie później, w której Dziewica opowiada mu tę historię w widzeniu, prowadzi rodzinę przez Bubastis i Hermopolis w górę Nilu do domu w Kusqam w Górnym Egipcie. Kościół koptyjski zachowuje dziś pełniejszą trasę, z Peluzjum przez Bubastis, Heliopolis i Babilon Egipski (Stary Kair) w górę do Kusqam: sykomora i źródło w Matarijji w Heliopolis, krypta kościoła św. Sergiusza w Starym Kairze i klasztor al-Muharraq w Kusqam, gdzie rodzina miała mieszkać sześć miesięcy, aż anioł kazał Józefowi wracać."
    - "Długość pobytu też jest nieznana; Mateusz wiąże powrót ze śmiercią Heroda w 4 p.n.e., a Koptowie liczą około trzech i pół roku. Sensem Mateusza nie jest trasa, lecz wypełnienie: „Z Egiptum wezwał syna mego”, słowa Ozeasza o Izraelu, wypowiedziane teraz o dziecku, które powtarza drogę narodu."
  it:
    - "Matteo non lo dice. Scrive soltanto che Giuseppe «prese di notte il fanciullino e sua madre, e si ritirò in Egitto; ed ivi stette fino alla morte di Erode», e che dopo il sogno in Egitto tornò nel paese d’Israele e si stabilì a Nazaret. L’Egitto era la provincia romana più vicina fuori dalla portata di Erode, con una popolazione ebraica di centinaia di migliaia, soprattutto ad Alessandria; il punto della mappa sta a Eliopoli, l’On della Genesi, a circa 410 km da Betlemme in linea retta, la prima sosta nella valle del Nilo che la tradizione posteriore nomina."
    - "I luoghi vengono dalla tradizione. Il Vangelo dello Pseudo-Matteo, un testo latino dell’alto Medioevo, fa cadere gli idoli in una città che chiama Sotinen a Ermopoli; un’omelia attribuita al patriarca Teofilo di Alessandria (morto nel 412) ma scritta molto più tardi, in cui la Vergine gli racconta la storia in una visione, conduce la famiglia per Bubasti ed Ermopoli lungo il Nilo fino a una casa a Qusqam nell’Alto Egitto. La Chiesa copta conserva oggi un itinerario più ampio, da Pelusio per Bubasti, Eliopoli e Babilonia d’Egitto (Vecchio Cairo) fino a Qusqam: il sicomoro e la sorgente a Matariya a Eliopoli, la cripta della chiesa di San Sergio nel Vecchio Cairo e il monastero di al-Muharraq a Qusqam, dove si dice che la famiglia visse sei mesi finché l’angelo disse a Giuseppe di tornare."
    - "Anche la durata del soggiorno è ignota; Matteo lega il ritorno alla morte di Erode nel 4 a.C., e i Copti contano circa tre anni e mezzo. Il punto di Matteo non è il percorso ma il compimento: «Fuor d’Egitto chiamai il mio figliuolo», parole di Osea su Israele, ora dette del bambino che ripercorre il cammino della nazione."
  nl:
    - "Mattheüs zegt het niet. Hij schrijft alleen: “Hij dan opgestaan zijnde, nam het Kindeken en Zijn moeder tot zich in den nacht, en vertrok naar Egypte; En was aldaar tot den dood van Herodes”, en dat hij na de droom in Egypte terugkeerde naar het land Israël en zich in Nazareth vestigde. Egypte was de dichtstbijzijnde Romeinse provincie buiten het bereik van Herodes, met een Joodse bevolking van honderdduizenden, vooral in Alexandrië; het punt op de kaart staat bij Heliopolis, het On van Genesis, hemelsbreed ongeveer 410 km van Bethlehem, de eerste halte die de latere overlevering in de Nijlvallei noemt."
    - "De plaatsen komen uit de overlevering. Het Pseudo-Mattheüsevangelie, een Latijnse tekst uit de vroege middeleeuwen, laat de afgodsbeelden vallen in een stad die het Sotinen noemt in Hermopolis; een aan patriarch Theofilus van Alexandrië (overleden 412) toegeschreven maar veel later geschreven homilie, waarin de Maagd hem het verhaal in een visioen vertelt, voert het gezin via Bubastis en Hermopolis de Nijl op naar een huis in Qusqam in Opper-Egypte. De Koptische Kerk bewaart nu een vollediger route, van Pelusium via Bubastis, Heliopolis en Babylon in Egypte (Oud-Caïro) naar Qusqam: de sycomoor en bron te Matariya in Heliopolis, de crypte van de Sint-Sergiuskerk in Oud-Caïro, en het klooster al-Muharraq te Qusqam, waar het gezin zes maanden zou hebben gewoond tot de engel Jozef zei terug te keren."
    - "Ook de duur van het verblijf is onbekend; Mattheüs verbindt de terugkeer met de dood van Herodes in 4 v.Chr., en de Kopten rekenen ongeveer drieënhalf jaar. Mattheüs’ punt is niet de route maar de vervulling: “Uit Egypte heb Ik Mijn Zoon geroepen”, Hosea’s woorden over Israël, nu gezegd van het kind dat het pad van het volk herhaalt."
  cs:
    - "Matouš to neříká. Píše jen, že Josef „vstav hned v noci, vzal dítě i matku jeho, a odšel do Egypta. A byl tam až do smrti Herodesovy“, a že se po snu v Egyptě vrátil do země Izraelské a usadil se v Nazaretě. Egypt byl nejbližší římská provincie mimo Herodův dosah, s židovským obyvatelstvem o stovkách tisíc, zejména v Alexandrii; bod na mapě stojí v Héliopoli, v Onu z Genesis, asi 410 km od Betléma vzdušnou čarou, první zastávka, kterou pozdější tradice v údolí Nilu jmenuje."
    - "Místa pocházejí z tradice. Pseudo-Matoušovo evangelium, latinský text raného středověku, nechává modly padnout ve městě, které nazývá Sotinen v Hermopoli; homilie připisovaná alexandrijskému patriarchovi Theofilovi (zemřel 412), ale napsaná mnohem později, v níž mu Panna vypráví příběh ve vidění, vede rodinu přes Bubastis a Hermopoli po Nilu do domu v Qusqamu v Horním Egyptě. Koptská církev dnes uchovává plnější trasu, z Pelúsia přes Bubastis, Héliopolis a Babylón v Egyptě (Stará Káhira) do Qusqamu: sykomoru a pramen v Matariji v Héliopoli, kryptu kostela sv. Sergia ve Staré Káhiře a klášter al-Muharraq v Qusqamu, kde rodina prý žila šest měsíců, dokud anděl neřekl Josefovi, aby se vrátil."
    - "Délka pobytu také není známa; Matouš váže návrat k Herodově smrti roku 4 př. n. l. a Koptové počítají asi tři a půl roku. Matoušovým záměrem není cesta, ale naplnění: „Z Egypta povolal jsem Syna svého“, Ozeášova slova o Izraeli, nyní řečená o dítěti, které prochází znovu cestu národa."
  sv:
    - "Matteus säger det inte. Han skriver bara att Josef ”tog barnet och dess moder med sig om natten, och drog bort till Egypten. Där blev han kvar intill Herodes’ död”, och att han efter drömmen i Egypten återvände till Israels land och bosatte sig i Nasaret. Egypten var den närmaste romerska provinsen utom Herodes räckvidd, med en judisk befolkning på hundratusentals, framför allt i Alexandria; kartpunkten står vid Heliopolis, 1 Moseboks On, omkring 410 km från Betlehem fågelvägen, den första anhalt i Nildalen som den senare traditionen nämner."
    - "Platserna kommer från traditionen. Pseudo-Matteusevangeliet, en latinsk text från tidig medeltid, låter avgudabilderna falla i en stad som det kallar Sotinen i Hermopolis; en homilia som tillskrivs Alexandrias patriark Teofilos (död 412) men som skrevs mycket senare, där Jungfrun berättar historien för honom i en syn, för familjen via Bubastis och Hermopolis uppför Nilen till ett hus i Qusqam i Övre Egypten. Den koptiska kyrkan bevarar i dag en fylligare rutt, från Pelusium via Bubastis, Heliopolis och Babylon i Egypten (Gamla Kairo) upp till Qusqam: sykomoren och källan i Matariya i Heliopolis, kryptan i Sankt Sergios kyrka i Gamla Kairo och klostret al-Muharraq i Qusqam, där familjen sägs ha bott i sex månader tills ängeln sade åt Josef att återvända."
    - "Vistelsens längd är också okänd; Matteus knyter återkomsten till Herodes död 4 f.Kr., och kopterna räknar omkring tre och ett halvt år. Matteus poäng är inte vägen utan uppfyllelsen: ”Ut ur Egypten kallade jag min son”, Hoseas ord om Israel, nu sagda om barnet som går om nationens väg."
  nb:
    - "Matteus sier det ikke. Han skriver bare at Josef «tok barnet og dets mor om natten og drog bort til Egypten, og han blev der til Herodes' død», og at han etter drømmen i Egypt vendte tilbake til Israels land og slo seg ned i Nasaret. Egypt var den nærmeste romerske provinsen utenfor Herodes' rekkevidde, med en jødisk befolkning på hundretusener, ikke minst i Aleksandria; kartpunktet står ved Heliopolis, Genesis' On, omtrent 410 km fra Betlehem i luftlinje, det første stoppet som senere tradisjon nevner i Nildalen."
    - "Stedene kommer fra tradisjonen. Pseudo-Matteus-evangeliet, en latinsk tekst fra tidlig middelalder, lar avgudene falle i en by det kaller Sotinen i Hermopolis; en preken tilskrevet patriarken Teofilus av Aleksandria (død 412) men skrevet mye senere, der Jomfruen forteller ham historien i et syn, tar familien via Bubastis og Hermopolis opp Nilen til et hus i Qusqam i Øvre Egypt. Den koptiske kirke har i dag en fyldigere rute, fra Pelusium via Bubastis, Heliopolis og Babylon i Egypt (Gamle Kairo) opp til Qusqam: sykomoren og kilden i Matariya i Heliopolis, krypten i Sankt Sergius' kirke i Gamle Kairo og klosteret al-Muharraq i Qusqam, der familien sies å ha bodd seks måneder til engelen sa til Josef at han skulle vende tilbake."
    - "Oppholdets lengde er også ukjent; Matteus knytter hjemreisen til Herodes' død i 4 f.Kr., og kopterne regner omtrent tre og et halvt år. Matteus' poeng er ikke ruten, men oppfyllelsen: «Fra Egypten kalte jeg min sønn», Hoseas ord om Israel, nå sagt om barnet som går nasjonens vei på nytt."
