id: where-was-persia
question:
  en: "Where was Persia?"
  ru: "Где находилась Персия?"
  uk: "Де була Персія?"
  es: "¿Dónde estaba Persia?"
  pt: "Onde ficava a Pérsia?"
  de: "Wo lag Persien?"
  fr: "Où se trouvait la Perse ?"
  pl: "Gdzie leżała Persja?"
  it: "Dov’era la Persia?"
  cs: "Kde ležela Persie?"
  nl: "Waar lag Perzië?"
  sv: "Var låg Persien?"
  nb: "Hvor lå Persia?"
  tl: "Nasaan ang Persia?"
  da: "Hvor lå Persien?"
answer:
  en:
    - "Persia proper was Parsa, the Persis of the Greeks: the highlands of Fars in south-western Iran, north-east of the Persian Gulf, with the royal cities of Pasargadae and Persepolis north-east of today's Shiraz. In the Bible “Persia” is the empire its kings built from about 550 BC, which in Esther reaches “from India even unto Ethiopia, over an hundred and seven and twenty provinces”. The map point does not stand in Fars but on Ecbatana, today's Hamadan in western Iran, one of the empire's royal cities, about 1,280 km east of Jerusalem in a straight line."
    - "The Persian kings moved between several capitals. Ecbatana, the old city of the Medes, was where, Xenophon says, the king spent the summer, and there under Darius the roll with the decree of Cyrus was found, “at Achmetha, in the palace that is in the province of the Medes”. Susa, where Nehemiah served and Esther is set, lies about 290 km to the south; Babylon, about 455 km south-west of Ecbatana, fell to Cyrus in 539 BC, and in “the first year of Cyrus king of Persia” the exiles were allowed to go home. Daniel's ram with two horns is “the kings of Media and Persia”."
    - "Alexander burned Persepolis in 330 BC, and the empire passed to the Macedonians; Parthian and then Sasanian kings later ruled Iran again. Europeans called the whole country Persia until 1935, when its government asked foreign states to use its own name, Iran; the province of Fars keeps the old one."
  ru:
    - "Собственно Персия — это Парса, Персида греков: нагорье Фарса на юго-западе Ирана, к северо-востоку от Персидского залива, с царскими городами Пасаргадами и Персеполем к северо-востоку от нынешнего Шираза. В Библии «Персия» — это держава, которую её цари создали начиная примерно с 550 г. до н. э. и которая в книге Есфири простирается «над ста двадцатью семью областями от Индии и до Ефиопии». Точка карты стоит не в Фарсе, а на Екбатане, нынешнем Хамадане на западе Ирана, одном из царских городов державы, примерно в 1280 км к востоку от Иерусалима по прямой."
    - "Персидские цари переезжали между несколькими столицами. В Екбатане, древнем городе Мидян, царь, по словам Ксенофонта, проводил лето, и там при Дарии нашли свиток с указом Кира: «в Екбатане во дворце, который в области Мидии». Сузы, где служил Неемия и где происходит действие книги Есфири, лежат примерно в 290 км к югу; Вавилон, примерно в 455 км к юго-западу от Екбатаны, пал перед Киром в 539 г. до н. э., и «в первый год Кира, царя Персидского» пленникам позволили вернуться домой. Овен с двумя рогами у Даниила — это «цари Мидийский и Персидский»."
    - "Александр сжёг Персеполь в 330 г. до н. э., и держава перешла к македонянам; позже Ираном снова правили Парфяне, а затем Сасаниды. Европейцы называли всю страну Персией до 1935 года, когда её правительство попросило иностранные государства называть её собственным именем — Иран; провинция Фарс хранит старое имя."
  uk:
    - "Власне Персія — це Парса, Персида греків: нагір'я Фарс на південному заході Ірану, на північний схід від Перської затоки, з царськими містами Пасаргади й Персеполь на північний схід від нинішнього Шираза. У Біблії «Персія» — це імперія, яку її царі збудували від близько 550 р. до н. е. і яка в Книзі Естер простягається «від Индиї до Етиопиї» і налічує сто двадцять сім країн. Точка на мапі стоїть не у Фарсі, а на Екбатані, нинішньому Хамадані на заході Ірану, одному з царських міст імперії, приблизно за 1280 км на схід від Єрусалима по прямій."
    - "Перські царі пересувалися між кількома столицями. Екбатана, старе місто мідян, була, за Ксенофонтом, місцем, де цар проводив літо, і саме там за Дарія знайшли сувій із указом Кіра «в Екбатанї, в палатї, що в країнї Мидиї». Сузи, де служив Неемія і де розгортається Книга Естер, лежать приблизно за 290 км на південь; Вавилон, приблизно за 455 км на південний захід від Екбатани, упав перед Кіром 539 р. до н. е., і «Першого року Кира, царя Перського» вигнанцям дозволили повернутися додому. Даниїлів баран із двома рогами — це «царі Мидийський та Перський»."
    - "Александр спалив Персеполь 330 р. до н. е., і імперія перейшла до македонців; парфянські, а потім сасанідські царі згодом знову правили Іраном. Європейці називали всю країну Персією до 1935 р., коли її уряд попросив іноземні держави вживати її власну назву — Іран; провінція Фарс зберігає стару."
  es:
    - "La Persia propiamente dicha era Parsa, la Pérsida de los griegos: las tierras altas de Fars, en el suroeste de Irán, al noreste del golfo Pérsico, con las ciudades reales de Pasargada y Persépolis, al noreste de la actual Shiraz. En la Biblia, «Persia» es el imperio que sus reyes construyeron desde aproximadamente el 550 a. C., que en Ester se extiende «desde la India hasta la Etiopía sobre ciento veinte y siete provincias». El punto del mapa no está en Fars, sino en Ecbatana, la actual Hamadán, en el oeste de Irán, una de las ciudades reales del imperio, a unos 1280 km al este de Jerusalén en línea recta."
    - "Los reyes persas se desplazaban entre varias capitales. Ecbatana, la antigua ciudad de los medos, era donde, según Jenofonte, el rey pasaba el verano, y allí, bajo Darío, se halló el rollo con el decreto de Ciro, «en Achmetta, en el palacio que está en la provincia de Media». Susa, donde sirvió Nehemías y donde se sitúa Ester, queda a unos 290 km al sur; Babilonia, a unos 455 km al suroeste de Ecbatana, cayó ante Ciro en 539 a. C., y «el primer año de Ciro rey de Persia» se permitió a los desterrados volver a casa. El carnero de dos cuernos de Daniel son «los reyes de Media y de Persia»."
    - "Alejandro incendió Persépolis en 330 a. C., y el imperio pasó a los macedonios; más tarde reyes partos y luego sasánidas volvieron a gobernar Irán. Los europeos llamaron Persia a todo el país hasta 1935, cuando su gobierno pidió a los Estados extranjeros que usaran su propio nombre, Irán; la provincia de Fars conserva el antiguo."
  pt:
    - "A Pérsia propriamente dita era Parsa, a Pérside dos gregos: as terras altas de Fars, no sudoeste do Irã, a nordeste do golfo Pérsico, com as cidades reais de Pasárgada e Persépolis, a nordeste da atual Xiraz. Na Bíblia, “Pérsia” é o império que seus reis construíram a partir de cerca de 550 a.C., que em Ester vai “desde a Índia até a Etiópia, sobre cento e vinte e sete províncias”. O ponto do mapa não está em Fars, mas em Ecbatana, a atual Hamadã, no oeste do Irã, uma das cidades reais do império, a cerca de 1.280 km a leste de Jerusalém em linha reta."
    - "Os reis persas se deslocavam entre várias capitais. Ecbatana, a antiga cidade dos medos, era onde, segundo Xenofonte, o rei passava o verão, e ali, sob Dario, foi encontrado o rolo com o decreto de Ciro, “em Acmeta, no palácio que fica na província da Média”. Susã, onde Neemias serviu e onde se passa Ester, fica a cerca de 290 km ao sul; a Babilônia, a cerca de 455 km a sudoeste de Ecbatana, caiu diante de Ciro em 539 a.C., e “No primeiro ano de Ciro, rei da Pérsia” os exilados foram autorizados a voltar para casa. O carneiro de dois chifres de Daniel são “os reis da Média e da Pérsia”."
    - "Alexandre queimou Persépolis em 330 a.C., e o império passou aos macedônios; reis partas e depois sassânidas voltaram a governar o Irã. Os europeus chamaram todo o país de Pérsia até 1935, quando o seu governo pediu aos Estados estrangeiros que usassem o seu próprio nome, Irã; a província de Fars conserva o antigo."
  de:
    - "Persien im engeren Sinn war Parsa, die Persis der Griechen: das Hochland von Fars im Südwesten Irans, nordöstlich des Persischen Golfs, mit den Königsstädten Pasargadai und Persepolis nordöstlich des heutigen Schiras. In der Bibel ist „Persien“ das Reich, das seine Könige seit etwa 550 v. Chr. errichteten und das im Buch Ester reicht „von Indien bis an Mohrenland über hundert und siebenundzwanzig Länder“. Der Kartenpunkt steht nicht in Fars, sondern auf Ekbatana, dem heutigen Hamadan im Westen Irans, einer der Königsstädte des Reiches, in der Luftlinie etwa 1280 km östlich von Jerusalem."
    - "Die persischen Könige zogen zwischen mehreren Hauptstädten umher. Ekbatana, die alte Stadt der Meder, war nach Xenophon der Ort, an dem der König den Sommer verbrachte, und dort wurde unter Darius die Rolle mit dem Erlass des Kyrus gefunden, „zu Ahmetha im Schloß, das in Medien liegt“. Susa, wo Nehemia diente und das Buch Ester spielt, liegt etwa 290 km südlich; Babylon, etwa 455 km südwestlich von Ekbatana, fiel 539 v. Chr. an Kyrus, und „im ersten Jahr des Kores, des Königs in Persien“ durften die Verbannten heimkehren. Daniels Widder mit den zwei Hörnern sind „die Könige in Medien und Persien“."
    - "Alexander verbrannte Persepolis 330 v. Chr., und das Reich ging an die Mazedonier; später herrschten wieder parthische und dann sasanidische Könige über Iran. Europäer nannten das ganze Land bis 1935 Persien, als seine Regierung die fremden Staaten bat, seinen eigenen Namen Iran zu verwenden; die Provinz Fars behält den alten."
  fr:
    - "La Perse proprement dite était Parsa, la Perside des Grecs : les hautes terres du Fars, dans le sud-ouest de l’Iran, au nord-est du golfe Persique, avec les villes royales de Pasargades et de Persépolis, au nord-est de l’actuelle Chiraz. Dans la Bible, la « Perse » est l’empire que ses rois bâtirent à partir d’environ 550 av. J.-C., qui, dans Esther, s’étend « depuis l’Inde jusqu’en Éthiopie sur cent vingt-sept provinces ». Le point de la carte ne se trouve pas dans le Fars mais à Ecbatane, l’actuelle Hamadan, dans l’ouest de l’Iran, l’une des villes royales de l’empire, à environ 1 280 km à l’est de Jérusalem à vol d’oiseau."
    - "Les rois perses se déplaçaient entre plusieurs capitales. Ecbatane, l’ancienne ville des Mèdes, était, dit Xénophon, l’endroit où le roi passait l’été, et c’est là que, sous Darius, fut trouvé le rouleau portant le décret de Cyrus, « à Achmetha, capitale de la province de Médie ». Suse, où Néhémie servit et où se situe Esther, se trouve à environ 290 km au sud ; Babylone, à environ 455 km au sud-ouest d’Ecbatane, tomba aux mains de Cyrus en 539 av. J.-C., et « La première année de Cyrus, roi de Perse », les exilés furent autorisés à rentrer chez eux. Le bélier à deux cornes de Daniel, ce sont « les rois des Mèdes et des Perses »."
    - "Alexandre brûla Persépolis en 330 av. J.-C., et l’empire passa aux Macédoniens ; des rois parthes, puis sassanides, gouvernèrent plus tard de nouveau l’Iran. Les Européens appelèrent tout le pays Perse jusqu’en 1935, date à laquelle son gouvernement demanda aux États étrangers d’employer son propre nom, Iran ; la province du Fars garde l’ancien."
  pl:
    - "Persja właściwa to Parsa, Persyda Greków: wyżyny Fars w południowo-zachodnim Iranie, na północny wschód od Zatoki Perskiej, z królewskimi miastami Pasargady i Persepolis na północny wschód od dzisiejszego Szirazu. W Biblii „Persja” to imperium zbudowane przez jej królów od około 550 p.n.e., które w Księdze Estery sięga od Indii aż po Etiopię i obejmuje sto dwadzieścia siedem krain. Punkt na mapie nie stoi w Fars, lecz w Ekbatanie, dzisiejszym Hamadanie w zachodnim Iranie, jednym z królewskich miast imperium, około 1280 km na wschód od Jerozolimy w linii prostej."
    - "Królowie perscy przenosili się między kilkoma stolicami. W Ekbatanie, dawnym mieście Medów, według Ksenofonta król spędzał lato i tam za Dariusza znaleziono zwój z dekretem Cyrusa, „w Achmecie na zamku, który jest w ziemi Medskiej”. Suza, gdzie służył Nehemiasz i gdzie rozgrywa się Księga Estery, leży około 290 km na południe; Babilon, około 455 km na południowy zachód od Ekbatany, padł przed Cyrusem w 539 p.n.e., a „roku pierwszego Cyrusa, króla Perskiego” wygnańcom pozwolono wrócić do domu. Baran Daniela z dwoma rogami to „królowie, Medski i Perski”."
    - "Aleksander spalił Persepolis w 330 p.n.e. i imperium przeszło w ręce Macedończyków; później Iranem znów rządzili królowie partyjscy, a potem sasanidzcy. Europejczycy nazywali cały kraj Persją do 1935 roku, gdy jego rząd poprosił obce państwa o używanie własnej nazwy, Iran; prowincja Fars zachowuje starą."
  it:
    - "La Persia propriamente detta era Parsa, la Perside dei Greci: gli altopiani del Fars nell’Iran sud-occidentale, a nord-est del Golfo Persico, con le città regali di Pasargade e Persepoli a nord-est dell’odierna Shiraz. Nella Bibbia «Persia» è l’impero che i suoi re costruirono dal 550 a.C. circa, che in Ester si estende «dall’India sino all’Etiopia sopra centoventisette province». Il punto della mappa non si trova nel Fars ma a Ecbatana, l’odierna Hamadan nell’Iran occidentale, una delle città regali dell’impero, a circa 1.280 km a est di Gerusalemme in linea d’aria."
    - "I re persiani si spostavano tra diverse capitali. Ecbatana, l’antica città dei Medi, era dove, dice Senofonte, il re trascorreva l’estate, e qui sotto Dario fu trovato il rotolo con il decreto di Ciro, «nel castello d’Ahmetha, ch’è nella provincia di Media». Susa, dove servì Neemia e dove è ambientato Ester, si trova circa 290 km a sud; Babilonia, circa 455 km a sud-ovest di Ecbatana, cadde in mano a Ciro nel 539 a.C., e «nel primo anno di Ciro, re di Persia» agli esuli fu permesso di tornare a casa. Il montone con due corna di Daniele è «i re di Media e di Persia»."
    - "Alessandro bruciò Persepoli nel 330 a.C., e l’impero passò ai Macedoni; re parti e poi sasanidi governarono di nuovo l’Iran. Gli Europei chiamarono l’intero paese Persia fino al 1935, quando il suo governo chiese agli Stati stranieri di usare il suo nome proprio, Iran; la provincia del Fars conserva l’antico."
  cs:
    - "Vlastní Persie byla Pársa, Persis Řeků: vysočina Fárs v jihozápadním Íránu, severovýchodně od Perského zálivu, s královskými městy Pasargadai a Persepolis severovýchodně od dnešního Šírázu. V Bibli je „Persie“ říší, kterou její králové budovali od zhruba roku 550 př. n. l. a která v Knize Ester sahá „od Indie až k Mouřenínské zemi nad sto dvadcíti a sedmi krajinami“. Bod na mapě nestojí ve Fársu, ale v Ekbatanách, dnešním Hamadánu v západním Íránu, jednom z královských měst říše, vzdušnou čarou asi 1 280 km východně od Jeruzaléma."
    - "Perští králové se přesouvali mezi několika hlavními městy. Ekbatany, staré město Médů, byly místem, kde podle Xenofónta král trávil léto, a tam za Dareia byl nalezen svitek s Kýrovým výnosem, „v Achmeta na hradě, kterýž jest v Médské krajině“. Susy, kde sloužil Nehemjáš a kde se odehrává Ester, leží asi 290 km na jih; Babylón, asi 455 km jihozápadně od Ekbatan, padl Kýrovi roku 539 př. n. l. a „léta prvního Cýra krále Perského“ směli vyhnanci jít domů. Danielův beran se dvěma rohy jsou „králové Médský a Perský“."
    - "Alexandr spálil Persepolis roku 330 př. n. l. a říše přešla na Makedonce; později opět vládli Íránu partští a pak sásánovští králové. Evropané nazývali celou zemi Persií až do roku 1935, kdy její vláda požádala cizí státy, aby užívaly její vlastní jméno, Írán; provincie Fárs si staré jméno ponechala."
  nl:
    - "Perzië in eigenlijke zin was Parsa, de Persis van de Grieken: het hoogland van Fars in het zuidwesten van Iran, ten noordoosten van de Perzische Golf, met de koninklijke steden Pasargadae en Persepolis ten noordoosten van het huidige Shiraz. In de Bijbel is “Perzië” het rijk dat zijn koningen vanaf ongeveer 550 v.Chr. bouwden, dat in Ester reikt “van Indië af tot aan Morenland toe, honderd zeven en twintig landschappen”. Het punt op de kaart staat niet in Fars maar op Ekbatana, het huidige Hamadan in het westen van Iran, een van de koninklijke steden van het rijk, hemelsbreed ongeveer 1280 km ten oosten van Jeruzalem."
    - "De Perzische koningen trokken heen en weer tussen meerdere hoofdsteden. Ekbatana, de oude stad van de Meden, was volgens Xenofon waar de koning de zomer doorbracht, en daar werd onder Darius de rol met het besluit van Cyrus gevonden, “te Achmetha, in de burcht, die in het landschap Medië is”. Susa, waar Nehemia diende en waar Ester speelt, ligt ongeveer 290 km naar het zuiden; Babylon, ongeveer 455 km ten zuidwesten van Ekbatana, viel in 539 v.Chr. aan Cyrus, en in “het eerste jaar nu van Kores, koning van Perzië” mochten de ballingen naar huis gaan. Daniëls ram met twee hoorns is “de koningen der Meden en der Perzen”."
    - "Alexander verbrandde Persepolis in 330 v.Chr., en het rijk ging over naar de Macedoniërs; later regeerden Parthische en daarna Sassanidische koningen opnieuw over Iran. Europeanen noemden het hele land Perzië tot 1935, toen de regering de buitenlandse staten vroeg haar eigen naam, Iran, te gebruiken; de provincie Fars bewaart de oude."
  sv:
    - "Egentliga Persien var Parsa, grekernas Persis: höglandet Fars i sydvästra Iran, nordost om Persiska viken, med de kungliga städerna Pasargadae och Persepolis nordost om dagens Shiraz. I Bibeln är ”Persien” det rike dess kungar byggde från omkring 550 f.Kr., som i Ester sträcker sig ”från Indien ända till Etiopien, över ett hundra tjugusju hövdingdömen”. Kartpunkten står inte i Fars utan på Ekbatana, dagens Hamadan i västra Iran, en av rikets kungliga städer, omkring 1 280 km öster om Jerusalem i fågelvägen."
    - "De persiska kungarna flyttade mellan flera huvudstäder. Ekbatana, mederna gamla stad, var enligt Xenofon där kungen tillbringade sommaren, och där fann man under Dareios rullen med Kyros’ påbud, ”i Ametas borg, i hövdingdömet Medien”. Susa, där Nehemja tjänade och Ester utspelar sig, ligger omkring 290 km åt söder; Babylon, omkring 455 km sydväst om Ekbatana, föll för Kyros 539 f.Kr., och ”i den persiske konungen Kores’ första regeringsår” fick de landsflyktiga återvända hem. Daniels bagge med de två hornen är ”Mediens och Persiens konungar”."
    - "Alexander brände Persepolis 330 f.Kr., och riket övergick till makedonierna; partiska och senare sasanidiska kungar styrde Iran på nytt. Européer kallade hela landet Persien till 1935, då dess regering bad främmande stater att använda dess eget namn, Iran; provinsen Fars behåller det gamla."
  nb:
    - "Persia i egentlig forstand var Parsa, grekernes Persis: høylandet Fars i Sørvest-Iran, nordøst for Persiagulfen, med kongebyene Pasargadae og Persepolis nordøst for dagens Shiraz. I Bibelen er «Persia» riket som dets konger bygde fra omkring 550 f.Kr., og som i Ester strekker seg «fra India like til Etiopia over hundre og syv og tyve landskaper». Kartpunktet står ikke i Fars, men på Ekbatana, dagens Hamadan i Vest-Iran, en av rikets kongebyer, omtrent 1280 km øst for Jerusalem i luftlinje."
    - "De persiske kongene flyttet mellom flere hovedsteder. Ekbatana, medernes gamle by, var der, sier Ksenofon, kongen tilbrakte sommeren, og der ble det under Dareios funnet en rull med Kyros’ påbud, «i borgen Ahmeta, som ligger i landskapet Media». Susa, der Nehemja tjente og Ester er satt, ligger omtrent 290 km mot sør; Babylon, omtrent 455 km sørvest for Ekbatana, falt til Kyros i 539 f.Kr., og i «perserkongen Kyros’ første år» fikk de landflyktige lov til å reise hjem. Daniels vær med de to hornene er «kongene av Media og Persia»."
    - "Aleksander brente Persepolis i 330 f.Kr., og riket gikk over til makedonerne; partiske og så sasanidiske konger styrte senere Iran igjen. Europeerne kalte hele landet Persia til 1935, da regjeringen ba fremmede stater om å bruke landets eget navn, Iran; provinsen Fars beholder det gamle."
  tl:
    - "Ang Persia mismo ay ang Parsa, ang Persida ng mga Griyego: ang kabundukan ng Fars sa timog-kanlurang Iran, sa hilagang-silangan ng Golpo ng Persia, na may mga maharlikang lungsod na Pasargadae at Persepolis sa hilagang-silangan ng Shiraz ngayon. Sa Biblia, ang “Persia” ay ang imperyong itinayo ng mga hari nito mula noong mga 550 BK, na sa Esther ay umaabot “mula sa India hanggang sa Etiopia, sa isang daan at dalawang pu't pitong lalawigan”. Wala sa Fars ang punto sa mapa kundi sa Achmetta, ang Hamadan ngayon sa kanlurang Iran, isa sa mga maharlikang lungsod ng imperyo, mga 1,280 km sa silangan ng Jerusalem sa tuwid na guhit."
    - "Lumipat-lipat ang mga haring Persiano sa ilang kabisera. Ang Achmetta, ang lumang lungsod ng mga Medo, ay kung saan, ayon kay Xenophon, ginugol ng hari ang tag-init, at doon sa ilalim ni Dario natagpuan ang balumbon na may dekreto ni Ciro, “sa Achmetta, sa bahay-hari na nasa lalawigan ng Media”. Ang Susan, kung saan naglingkod si Nehemias at itinakda si Esther, ay mga 290 km sa timog; ang Babilonia, mga 455 km sa timog-kanluran ng Achmetta, ay bumagsak kay Ciro noong 539 BK, at “nang unang taon nga ni Ciro na hari sa Persia” ay pinahintulutan ang mga destiyero na umuwi. Ang tupa ni Daniel na may dalawang sungay ay “ang mga hari sa Media at Persia”."
    - "Sinunog ni Alejandro ang Persepolis noong 330 BK, at ang imperyo ay napunta sa mga Macedonio; kalaunan ay muling pinamunuan ng mga haring Parto at pagkatapos ay Sasanida ang Iran. Tinawag ng mga Europeo ang buong bansa na Persia hanggang 1935, nang hilingin ng pamahalaan nito sa mga dayuhang estado na gamitin ang sarili nitong pangalan, Iran; pinananatili ng lalawigan ng Fars ang luma."
  da:
    - "Persien i egentlig forstand var Parsa, grækernes Persis: højlandet Fars i det sydvestlige Iran, nordøst for Den Persiske Bugt, med kongebyerne Pasargadae og Persepolis nordøst for nutidens Shiraz. I Bibelen er »Persien« det imperium, dets konger opbyggede fra omkring 550 f.Kr., og som i Ester række »fra Indien og indtil Morland over hundrede og syv og tyve Landskaber«. Kortets punkt står ikke i Fars, men på Ekbatana, nutidens Hamadan i det vestlige Iran, en af imperiets kongebyer, ca. 1.280 km øst for Jerusalem i fugleflugt."
    - "De persiske konger flyttede mellem flere hovedstæder. Ekbatana, mediernes gamle by, var, hvor kongen ifølge Xenofon tilbragte sommeren, og dér blev under Darius rullen med Kyros’ dekret fundet, »i Akmetha, paa Slottet, i Landskabet Medien«. Susa, hvor Nehemias tjente, og hvor Ester foregår, ligger ca. 290 km mod syd; Babylon, ca. 455 km sydvest for Ekbatana, faldt til Kyros i 539 f.Kr., og »i Kyrus’s, Kongen af Persiens, første Aar« fik de landflygtige lov til at rejse hjem. Daniels væder med to horn er »Kongerne af Medien og Persien«."
    - "Alexander brændte Persepolis i 330 f.Kr., og imperiet overgik til makedonerne; parthiske og senere sassanidiske konger herskede igen over Iran. Europæerne kaldte hele landet Persien indtil 1935, da dets regering bad fremmede stater om at bruge dets eget navn, Iran; provinsen Fars bevarer det gamle."
