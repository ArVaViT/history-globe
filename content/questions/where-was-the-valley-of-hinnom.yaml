id: where-was-the-valley-of-hinnom
question:
  en: "Where was the Valley of Hinnom, the Gehenna of the Gospels?"
  ru: "Где находилась долина Еннома — евангельская геенна?"
  uk: "Де була долина Гінном, Геєна Євангелій?"
  es: "¿Dónde estaba el valle de Hinnom, la Gehenna de los Evangelios?"
  pt: "Onde ficava o vale de Hinom, a Geena dos Evangelhos?"
  de: "Wo lag das Hinnomtal, das Gehenna der Evangelien?"
  fr: "Où se trouvait la vallée de Hinnom, la Géhenne des Évangiles ?"
  pl: "Gdzie leżała Dolina Hinnom, Gehenna z Ewangelii?"
  it: "Dov’era la Valle di Innom, la Geenna dei Vangeli?"
  cs: "Kde leželo Hinómovo údolí, Gehenna evangelií?"
  nl: "Waar lag het Dal van Hinnom, de Gehenna van de evangeliën?"
  sv: "Var låg Hinnoms dal, evangeliernas Gehenna?"
  nb: "Hvor lå Hinnom-dalen, evangeliets Gehenna?"
  tl: "Nasaan ang Libis ng Hinnom, ang Gehenna ng mga Ebanghelyo?"
  da: "Hvor lå Hinnoms Dal, evangeliernes Gehenna?"
  sr: "Где је била Долина Еномова, Геена из јеванђеља?"
  hu: "Hol volt a Hinnom-völgy, az evangéliumok gyehennája?"
  fi: "Missä oli Hinnomin laakso, evankeliumien Gehenna?"
  vi: "Trũng Hi-nôm, Ghê-hen-na của các sách Phúc Âm, ở đâu?"
  ro: "Unde se afla Valea Hinom, Gheena din Evanghelii?"
  bg: "Къде се е намирала долината Еном — геената от Евангелията?"
answer:
  en:
    - "The Valley of Hinnom is the valley that curves round the west and south of Jerusalem's Old City, today's Wadi er-Rababi or Gei Ben Hinnom: it runs south from below the Jaffa Gate, turns east under Mount Zion and the quarter of Abu Tor, and joins the Kidron below the Pool of Siloam, near the spring of En-rogel. The map point stands in it, about 1 km south-west of the map's point for Jerusalem and 1.7 km from the Kidron's in a straight line. In Joshua the border of Judah and Benjamin “went up by the valley of the son of Hinnom unto the south side of the Jebusite; the same is Jerusalem”, and after the exile Judah dwelt “from Beer-sheba unto the valley of Hinnom”."
    - "The place was not always agreed. Arab tradition calls part of the Kidron, under the eastern wall of the Temple Mount, Wadi Jahannam, the valley of Gehenna, and medieval Muslims and Christians alike set the Last Judgment there; a few nineteenth-century scholars put Hinnom in the Kidron or in the central Tyropoeon valley. The border in Joshua decides it for the western and southern valley: from En-rogel the line climbs the valley of Hinnom past the south of the city and then to “the top of the mountain that lieth before the valley of Hinnom westward”. Jeremiah went out to the valley “by the entry of the east gate”, as the King James Version renders it; the Hebrew Harsith is more likely the Potsherd Gate."
    - "In the valley stood Tophet, where the kings of Judah burned their children: Jeremiah condemns “the high places of Tophet, which is in the valley of the son of Hinnom, to burn their sons and their daughters in the fire”, and Josiah “defiled Topheth… that no man might make his son or his daughter to pass through the fire to Molech” about 622 BC. From its Hebrew name, Ge Hinnom, came the Greek Geenna, Gehenna, the place of fiery judgment in the Gospels: fear him “which is able to destroy both soul and body in hell”. The common story that the valley was the city's ever-burning rubbish dump goes back to the medieval commentator David Kimhi, about 1200, and has no ancient evidence. History Globe has an article on the valley; this answer keeps to where it was."
  ru:
    - "Долина Еннома — это долина, огибающая Старый город Иерусалима с запада и юга, нынешняя Вади-эр-Рабаби, или Гей-Бен-Хинном: она идёт на юг от подножия Яффских ворот, поворачивает на восток под горой Сион и кварталом Абу-Тор и сливается с Кедроном ниже Силоамского пруда, у источника Ен-Рогел. Точка карты стоит в ней, примерно в 1 км к юго-западу от точки Иерусалима и в 1,7 км от точки Кедрона по прямой. В книге Иисуса Навина граница Иуды и Вениамина «идет вверх к долине сына Енномова с южной стороны Иевуса, который есть Иерусалим», а после плена иудеи расположились «от Вирсавии и до долины Енномовой»."
    - "Это место определяли не всегда одинаково. Арабское предание называет часть Кедрона под восточной стеной Храмовой горы Вади-Джаханнам, долиной геенны, и средневековые мусульмане и христиане одинаково помещали там Страшный суд; немногие учёные XIX века искали долину Еннома в Кедроне или в средней, Тиропеонской долине. Граница в книге Иисуса Навина решает дело в пользу западной и южной долины: от Ен-Рогела линия поднимается долиной Еннома мимо юга города, а затем «на вершину горы, которая к западу против долины Енномовой». Иеремия выходил в долину, «которая у ворот Харшиф», — так Синодальный перевод сохраняет еврейское имя, которое скорее значит «ворота черепков»; английская Библия короля Якова передаёт его как восточные ворота."
    - "В долине стоял Тофет, где цари Иудеи сжигали детей: Иеремия обличает «высоты Тофета в долине сыновей Енномовых, чтобы сожигать сыновей своих и дочерей своих в огне», а Иосия около 622 г. до н. э. «осквернил… Тофет, что на долине сыновей Еннома, чтобы никто не проводил сына своего и дочери своей чрез огонь Молоху». Из её еврейского имени, Ге-Хинном, вышло греческое Геенна — в Евангелиях место огненного суда: бойтесь того, «кто может и душу и тело погубить в геенне». Расхожий рассказ, будто долина была вечно горящей городской свалкой, восходит к средневековому комментатору Давиду Кимхи, около 1200 г., и древних подтверждений не имеет. Долине в History Globe посвящена отдельная статья; здесь ответ о том, где она была."
  uk:
    - "Долина Гінном — долина, що огинає із заходу й півдня Старе місто Єрусалима, нинішній Ваді-ер-Рабабі, або Ґей-Бен-Хінном: вона йде на південь від Яффських воріт, повертає на схід під горою Сіон і кварталом Абу-Тор і впадає в Кедрон нижче басейну Силоам, біля джерела Ен-Рогел. Точка на мапі стоїть у ній, приблизно за 1 км на південний захід від точки Єрусалима на мапі і за 1,7 км від точки Кедрону по прямій. У Книзі Ісуса Навина межа Юди й Веніямина «тягнеться гряниця в долину сина Енномового на полуднє від нагірньої стїни Евузійської, се Ерусалим», а після вигнання юдеї оселилися «від Бирсабії до долини Енномової»."
    - "Місце не завжди було загальновизнаним. Арабський переказ називає частину Кедрону під східним муром Храмової гори Ваді-Джаннам, долиною Геєни, і середньовічні мусульмани й християни однаково поміщали там Страшний суд; кілька вчених XIX ст. поміщали Гінном у Кедроні або в центральній долині Тіропеон. Межа в Книзі Ісуса Навина вирішує справу для західної й південної долини: від Ен-Рогела лінія піднімається долиною Гінном повз південь міста, а потім до «верх гори, що стоїть на захід сонця перед долиною Еннома». Єремія вийшов у долину «біля входу східної брами», як передає Біблія короля Якова; єврейське Харсіт, імовірніше, означає Черепяну браму (так у тексті Куліша, Єр 19:2)."
    - "У долині стояв Тофет, де царі Юди палили своїх дітей: Єремія засуджує «висоти Тофет в долинї потомків Енномових, щоб там палити синів своїх і дочки свої», а Йосія «Посквернив і Тофет ... щоб нїхто не проводив сина свого чи дочку свою через огонь Молохові» близько 622 р. до н. е. Від її єврейської назви, Ге-Хінном, постало грецьке Геєнна, місце вогняного суду в Євангеліях: треба боятися того, «хто зможе погубити і душу й тїло в пеклї». Поширена розповідь, що долина була вічно палаючим сміттєзвалищем міста, сягає середньовічного коментатора Давида Кімхі, близько 1200 р., і не має давніх підтверджень. В «Історичному глобусі» є стаття про долину; ця відповідь стосується лише того, де вона була."
  es:
    - "El valle de Hinnom es el valle que rodea por el oeste y el sur la Ciudad Vieja de Jerusalén, hoy Wadi er-Rababi o Gei Ben Hinnom: corre hacia el sur desde debajo de la puerta de Jafa, gira al este bajo el monte Sion y el barrio de Abu Tor, y se une al Cedrón bajo el estanque de Siloé, cerca de la fuente de En-rogel. El punto del mapa está en él, a 1 km al suroeste del punto del mapa para Jerusalén y a 1,7 km del del Cedrón en línea recta. En Josué, la frontera de Judá y Benjamín «sube este término por el valle del hijo de Hinnom al lado del Jebuseo al mediodía: esta es Jerusalem», y tras el destierro Judá habitó «desde Beer-seba hasta el valle de Hinnom»."
    - "No siempre hubo acuerdo sobre el lugar. La tradición árabe llama a parte del Cedrón, bajo el muro oriental del Monte del Templo, Wadi Jahannam, el valle de la Gehenna, y tanto musulmanes como cristianos medievales situaron allí el Juicio Final; algunos estudiosos del siglo XIX pusieron Hinnom en el Cedrón o en el valle central del Tiropeón. La frontera de Josué lo decide a favor del valle occidental y meridional: desde En-rogel la línea sube por el valle de Hinnom pasando por el sur de la ciudad y luego hasta «la cumbre del monte que está delante del valle de Hinnom hacia el occidente». Jeremías salió al valle «á la entrada de la puerta oriental», como lo traduce la King James Version; el hebreo Harsith es más probablemente la puerta de los Tiestos."
    - "En el valle estaba Tofet, donde los reyes de Judá quemaban a sus hijos: Jeremías condena «los altos de Topheth, que es en el valle del hijo de Hinnom, para quemar al fuego sus hijos y sus hijas», y Josías «profanó á Topheth, que está en el valle del hijo de Hinnom, porque ninguno pasase su hijo ó su hija por fuego á Moloch» hacia el 622 a. C. De su nombre hebreo, Ge Hinnom, vino el griego Geenna, Gehenna, el lugar del juicio de fuego en los Evangelios: temed a «aquel que puede destruir el alma y el cuerpo en el infierno». La historia común de que el valle era el basurero siempre ardiente de la ciudad se remonta al comentarista medieval David Kimji, hacia 1200, y no tiene pruebas antiguas. History Globe tiene un artículo sobre el valle; esta respuesta se ciñe a dónde estaba."
  pt:
    - "O vale de Hinom é o vale que contorna o oeste e o sul da Cidade Velha de Jerusalém, hoje Wadi er-Rababi ou Gei Ben Hinnom: corre para o sul a partir de baixo da Porta de Jafa, vira para o leste sob o monte Sião e o bairro de Abu Tor, e se junta ao Cedrom abaixo do tanque de Siloé, perto da fonte de En-Rogel. O ponto do mapa fica nele, a cerca de 1 km a sudoeste do ponto de Jerusalém no mapa e a 1,7 km do do Cedrom em linha reta. Em Josué, a fronteira de Judá e Benjamim “subia pelo vale do filho de Hinom até a encosta dos jebuseus (também chamada Jerusalém), ao sul”, e depois do exílio Judá habitou “desde Berseba até o vale de Hinom”."
    - "O lugar nem sempre foi consensual. A tradição árabe chama parte do Cedrom, sob a muralha oriental do monte do Templo, de Wadi Jahannam, o vale da Geena, e muçulmanos e cristãos medievais situaram ali o Juízo Final; alguns estudiosos do século XIX puseram Hinom no Cedrom ou no vale central do Tiropeão. A fronteira em Josué decide pelo vale ocidental e meridional: de En-Rogel a linha sobe o vale de Hinom pelo sul da cidade e depois até “o topo do monte que fica em frente ao vale de Hinom, a oeste”. Jeremias saiu ao vale pela entrada da porta oriental, como a versão King James traduz; o hebraico Harsit é mais provavelmente a Porta dos Cacos."
    - "No vale ficava Tofete, onde os reis de Judá queimavam seus filhos: Jeremias condena “os altos de Tofete, que está no vale do filho de Hinom, para queimarem os seus filhos e as suas filhas no fogo”, e Josias “profanou Tofete… para que ninguém fizesse seu filho ou sua filha passar pelo fogo a Moloque”, por volta de 622 a.C. De seu nome hebraico, Ge Hinom, veio o grego Geena, o lugar do juízo de fogo nos Evangelhos: temam “aquele que pode destruir tanto a alma quanto o corpo na Geena”. A história comum de que o vale era o depósito de lixo sempre em chamas da cidade remonta ao comentarista medieval David Kimhi, por volta de 1200, e não tem evidência antiga. O History Globe tem um artigo sobre o vale; esta resposta trata apenas de onde ficava."
  de:
    - "Das Hinnomtal ist das Tal, das sich im Westen und Süden um die Altstadt Jerusalems krümmt, heute Wadi er-Rababi oder Gei Ben Hinnom: Es verläuft von unterhalb des Jaffators nach Süden, wendet sich unter dem Berg Zion und dem Viertel Abu Tor nach Osten und mündet unterhalb des Teichs Siloah beim Quell En-Rogel in das Kidrontal. Der Kartenpunkt steht darin, in der Luftlinie etwa 1 km südwestlich des Kartenpunkts für Jerusalem und 1,7 km von dem des Kidron. Bei Josua heißt es von der Grenze zwischen Juda und Benjamin: „darnach geht sie herauf zum Tal des Sohnes Hinnoms an der Mittagseite des Jebusiters, das ist Jerusalem“, und nach dem Exil wohnte Juda „von Beer-Seba an bis an das Tal Hinnom“."
    - "Über den Ort war man sich nicht immer einig. Die arabische Überlieferung nennt einen Teil des Kidron unter der Ostmauer des Tempelbergs Wadi Dschahannam, das Tal der Gehenna, und mittelalterliche Muslime wie Christen setzten dorthin das Jüngste Gericht; einige Gelehrte des 19. Jahrhunderts verlegten das Hinnom in den Kidron oder ins zentrale Tyropoiontal. Die Grenzbeschreibung bei Josua entscheidet für das westliche und südliche Tal: Von En-Rogel steigt die Linie durch das Hinnomtal südlich der Stadt hinauf und dann „an die Spitze des Berges, der vor dem Tal Hinnom liegt abendwärts“. Jeremia ging in das Tal hinaus „vor dem Ziegeltor“, wie die Lutherbibel es wiedergibt, die King-James-Bibel dagegen mit Osttor; das hebräische Harsit ist eher das Scherbentor."
    - "Im Tal stand Tofet, wo die Könige von Juda ihre Kinder verbrannten: Jeremia verurteilt, dass sie „die Altäre des Thopheth im Tal Ben-Hinnom“ bauen, „daß sie ihre Söhne und Töchter verbrennen“, und Josia „verunreinigte auch das Topheth im Tal der Kinder Hinnom, daß niemand seinen Sohn oder seine Tochter dem Moloch durchs Feuer ließ gehen“, um 622 v. Chr. Aus seinem hebräischen Namen Ge Hinnom kam das griechische Geenna, Gehenna, der Ort des feurigen Gerichts in den Evangelien: Man solle den fürchten, „der Leib und Seele verderben kann in der Hölle“. Die verbreitete Erzählung, das Tal sei die ewig brennende Müllkippe der Stadt gewesen, geht auf den mittelalterlichen Ausleger David Kimchi um 1200 zurück und hat keinen antiken Beleg. History Globe hat einen Artikel über das Tal; diese Antwort beschränkt sich darauf, wo es lag."
  fr:
    - "La vallée de Hinnom est la vallée qui contourne à l’ouest et au sud la vieille ville de Jérusalem, l’actuel Wadi er-Rababi ou Gei Ben Hinnom : elle descend vers le sud depuis le dessous de la porte de Jaffa, tourne vers l’est sous le mont Sion et le quartier d’Abu Tor, et rejoint le Cédron sous le bassin de Siloé, près de la source d’En-Roguel. Le point de la carte s’y trouve, à environ 1 km au sud-ouest du point de la carte pour Jérusalem et à 1,7 km de celui du Cédron à vol d’oiseau. Dans Josué, la frontière de Juda et de Benjamin « montait de là par la vallée de Ben-Hinnom au côté méridional de Jebus, qui est Jérusalem », et après l’exil, Juda s’établit « depuis Beer-Schéba jusqu’à la vallée de Hinnom »."
    - "L’emplacement n’a pas toujours fait l’unanimité. La tradition arabe appelle une partie du Cédron, sous le mur oriental du mont du Temple, Wadi Jahannam, la vallée de la Géhenne, et les musulmans comme les chrétiens du Moyen Âge y plaçaient le Jugement dernier ; quelques spécialistes du XIXe siècle ont situé Hinnom dans le Cédron ou dans la vallée centrale du Tyropéon. La frontière de Josué tranche pour la vallée occidentale et méridionale : depuis En-Roguel, la ligne monte la vallée de Hinnom au sud de la ville, puis jusqu’« au sommet de la montagne, qui est devant la vallée de Hinnom à l’occident ». Jérémie sortit vers la vallée par l’entrée de la porte de l’est, selon la King James Version ; l’hébreu Harsith est plus probablement la porte des Tessons."
    - "Dans la vallée se trouvait Topheth, où les rois de Juda brûlaient leurs enfants : Jérémie condamne « des hauts lieux à Topheth dans la vallée de Ben-Hinnom, pour brûler au feu leurs fils et leurs filles », et Josias « souilla Topheth… afin que personne ne fît plus passer son fils ou sa fille par le feu en l’honneur de Moloc », vers 622 av. J.-C. De son nom hébreu, Gé Hinnom, vint le grec Géenna, la Géhenne, lieu du jugement par le feu dans les Évangiles : craignez « celui qui peut faire périr l’âme et le corps dans la géhenne ». L’histoire courante selon laquelle la vallée était le dépotoir toujours en feu de la ville remonte au commentateur médiéval David Kimhi, vers 1200, et n’a aucune preuve ancienne. History Globe consacre un article à la vallée ; cette réponse se limite à son emplacement."
  pl:
    - "Dolina Hinnom to dolina okrążająca od zachodu i południa Stare Miasto Jerozolimy, dziś Wadi er-Rababi lub Gei Ben Hinnom: biegnie na południe spod Bramy Jafskiej, skręca na wschód pod górą Syjon i dzielnicą Abu Tor i łączy się z Cedronem poniżej sadzawki Siloe, koło źródła En-Rogel. Punkt na mapie stoi w niej, około 1 km na południowy zachód od punktu Jerozolimy na mapie i 1,7 km od punktu Cedronu w linii prostej. U Jozuego granica Judy i Beniamina biegnie „przez dolinę syna Hennomowego po bok Jebuzejczyka od południa, co jest Jeruzalem”, a po wygnaniu Juda mieszkała „od Beerseby aż do Giehennom”."
    - "Miejsce nie zawsze było uzgodnione. Tradycja arabska nazywa część Cedronu pod wschodnim murem Wzgórza Świątynnego Wadi Dżahannam, doliną Gehenny, a średniowieczni muzułmanie i chrześcijanie umieszczali tam Sąd Ostateczny; kilku uczonych XIX wieku umieszczało Hinnom w Cedronie lub w środkowej dolinie Tyropoeon. Granica u Jozuego rozstrzyga o dolinie zachodniej i południowej: od En-Rogel linia wspina się doliną Hinnom na południe od miasta, a potem na „wierzch góry, która jest przeciwko dolinie Hennom na zachód”. Jeremiasz wyszedł do doliny, „która jest u wrót bramy wschodniej”, jak oddaje to Biblia Gdańska; hebrajskie Charsit to raczej Brama Garncarska."
    - "W dolinie stał Tofet, gdzie królowie Judy palili swoje dzieci: Jeremiasz potępia to, że „pobudowali wyżyny Tofet, które jest w dolinie syna Hennomowego, aby palili synów swych i córki swe ogniem”, a Jozjasz „splugawił też i Tofet… aby więcej nikt nie przewodził syna swego, ani córki swojej przez ogień ku czci Molochowi” około 622 p.n.e. Od jej hebrajskiej nazwy, Ge Hinnom, pochodzi greckie Geenna, Gehenna, miejsce ognistego sądu w Ewangeliach: bójcie się tego, „który może i duszę i ciało zatracić w piekielnym ogniu”. Popularna opowieść, że dolina była wiecznie płonącym wysypiskiem śmieci miasta, sięga średniowiecznego komentatora Dawida Kimchiego, około 1200, i nie ma starożytnych dowodów. History Globe ma artykuł o dolinie; ta odpowiedź ogranicza się do jej położenia."
  it:
    - "La Valle di Innom è la valle che curva attorno a ovest e a sud della Città Vecchia di Gerusalemme, oggi Wadi er-Rababi o Gei Ben Hinnom: corre a sud da sotto la Porta di Giaffa, gira a est sotto il Monte Sion e il quartiere di Abu Tor, e si unisce al Cedron sotto la piscina di Siloe, presso la sorgente di En-Roghel. Il punto della mappa si trova in essa, a circa 1 km a sud-ovest del punto della mappa per Gerusalemme e a 1,7 km da quello del Cedron in linea d’aria. In Giosuè il confine tra Giuda e Beniamino «saliva per la valle di Ben-Hinnom fino al versante meridionale del monte de’ Gebusei che è Gerusalemme», e dopo l’esilio Giuda abitò «da Beer-Sceba fino alla valle di Hinnom»."
    - "Il luogo non fu sempre concordemente fissato. La tradizione araba chiama una parte del Cedron, sotto il muro orientale del Monte del Tempio, Wadi Jahannam, la valle della Geenna, e musulmani e cristiani medievali vi collocarono il Giudizio finale; alcuni studiosi dell’Ottocento posero Innom nel Cedron o nella valle centrale del Tiropeo. Il confine in Giosuè decide per la valle occidentale e meridionale: da En-Roghel la linea risale la valle di Innom oltre il sud della città e poi fino al «sommo del monte ch’è dirimpetto alla valle di Hinnom a occidente». Geremia uscì verso la valle «all’ingresso della porta orientale», come la rende la King James Version; l’ebraico Harsith è più probabilmente la Porta dei Cocci."
    - "Nella valle sorgeva Tofet, dove i re di Giuda bruciavano i loro figli: Geremia condanna «gli alti luoghi di Tofet, nella valle del figliuolo di Hinnom, per bruciarvi nel fuoco i loro figliuoli e le loro figliuole», e Giosia «contaminò Tofeth… affinché nessuno facesse più passare per il fuoco il suo figliuolo o la sua figliuola in onore di Molec» verso il 622 a.C. Dal suo nome ebraico, Ge Hinnom, venne il greco Geenna, il luogo del giudizio di fuoco nei Vangeli: temete colui «che può far perire e l’anima e il corpo nella geenna». La storia comune che la valle fosse la discarica sempre in fiamme della città risale al commentatore medievale David Kimhi, verso il 1200, e non ha alcuna prova antica. History Globe ha un articolo sulla valle; questa risposta si limita a dove si trovava."
  cs:
    - "Hinómovo údolí je údolí, které se obloukem stáčí kolem západu a jihu Starého města Jeruzaléma, dnešní Wádí er-Rabábi neboli Gej Ben Hinom: běží na jih od Jaffské brány, stáčí se na východ pod Horou Sijón a čtvrtí Abú Tor a ústí do Kidronu pod rybníkem Siloe, poblíž pramene Én-rógel. Bod na mapě stojí v něm, asi 1 km jihozápadně od bodu Jeruzaléma na mapě a 1,7 km od bodu Kidronu vzdušnou čarou. U Jozua hranice Judy a Benjamína šla „přes údolí synů Hinnom k straně Jebus od poledne, jenž jest Jeruzalém“, a po vyhnanství Juda bydlel „od Bersabé až do Gehinnom“."
    - "Místo nebylo vždy shodně určováno. Arabská tradice nazývá část Kidronu pod východní hradbou Chrámové hory Wádí Džahannam, údolí Gehenny, a středověcí muslimové i křesťané tam kladli Poslední soud; několik badatelů 19. století kladlo Hinom do Kidronu nebo do středního údolí Tyropoion. O západním a jižním údolí rozhoduje hranice u Jozua: od Én-rógelu stoupá linie údolím Hinómovým kolem jihu města a pak k „vrchu hory, kteráž jest naproti údolí Hinnom na západ“. Jeremjáš vyšel do údolí „u vrat brány východní“, jak to překládá anglická Bible krále Jakuba; hebrejské Charsit je spíše Střepová brána."
    - "V údolí stál Tofet, kde králové Judy pálili své děti: Jeremjáš odsuzuje „výsosti Tofet, kteréž jest v údolí syna Hinnom, aby pálili syny své i dcery své ohněm“ a Jošijáš „poškvrnil také i Tofet… aby více žádný nevodil syna svého aneb dcery své skrze oheň Molochovi“ kolem roku 622 př. n. l. Z hebrejského jména Ge Hinom vzniklo řecké Geenna, Gehenna, místo ohnivého soudu v evangeliích: bojte se toho, „kterýž může i duši i tělo zatratiti v pekelném ohni“. Obvyklý příběh, že údolí bylo věčně hořící smetiště města, sahá k středověkému komentátorovi Davidu Kimchimu kolem roku 1200 a nemá starověký doklad. History Globe má o údolí článek; tato odpověď se drží jen toho, kde leželo."
  nl:
    - "Het Dal van Hinnom is het dal dat om het westen en zuiden van de Oude Stad van Jeruzalem buigt, het huidige Wadi er-Rababi of Gei Ben Hinnom: het loopt naar het zuiden vanaf onder de Jaffapoort, draait naar het oosten onder de berg Sion en de wijk Abu Tor, en komt onder de vijver van Siloam, bij de bron En-Rogel, uit in het Kidrondal. Het punt op de kaart staat erin, ongeveer 1 km ten zuidwesten van het punt voor Jeruzalem en hemelsbreed 1,7 km van dat van het Kidrondal. In Jozua loopt de grens van Juda en Benjamin: “deze landpale zal opgaan door het dal van den zoon van Hinnom, aan de zijde van den Jebusiet van het zuiden, dezelve is Jeruzalem”, en na de ballingschap woonde Juda “van Ber-seba af tot aan het dal Hinnom”."
    - "De plaats was niet altijd onomstreden. De Arabische overlevering noemt een deel van het Kidrondal, onder de oostmuur van de Tempelberg, Wadi Jahannam, het dal van de Gehenna, en middeleeuwse moslims en christenen plaatsten daar beide het Laatste Oordeel; enkele negentiende-eeuwse geleerden plaatsten Hinnom in het Kidrondal of in het centrale Tyropoeondal. De grens in Jozua beslist het voor het westelijke en zuidelijke dal: vanaf En-Rogel klimt de lijn het dal van Hinnom op langs het zuiden van de stad en dan naar “de spits van den berg, die voor aan het dal van Hinnom is, westwaarts”. Jeremia ging uit naar het dal “bij de ingang van de oostpoort”, zoals de King James Version het weergeeft; het Hebreeuwse Charsiet is waarschijnlijk de Potscherfpoort."
    - "In het dal stond Tofet, waar de koningen van Juda hun kinderen verbrandden: Jeremia veroordeelt “de hoogten van Tofeth, dat in het dal des zoons van Hinnom is, om hun zonen en hun dochteren met vuur te verbranden”, en Josia “verontreinigde ook Thofeth… opdat niemand zijn zoon of zijn dochter voor den Molech door het vuur deed gaan”, omstreeks 622 v.Chr. Van zijn Hebreeuwse naam, Ge Hinnom, kwam het Griekse Geenna, Gehenna, de plaats van het vurige oordeel in de evangeliën: vrees Hem “Die beide ziel en lichaam kan verderven in de hel”. Het gangbare verhaal dat het dal de eeuwig brandende vuilnisbelt van de stad was, gaat terug op de middeleeuwse commentator David Kimhi, omstreeks 1200, en heeft geen oud bewijs. History Globe heeft een artikel over het dal; dit antwoord beperkt zich tot de ligging."
  sv:
    - "Hinnoms dal är dalen som böjer sig runt väster och söder om Jerusalems Gamla stad, i dag Wadi er-Rababi eller Gei Ben Hinnom: den löper söderut från nedanför Jaffaporten, svänger österut under Sions berg och kvarteret Abu Tor och förenas med Kidron nedanför Siloadammen, nära källan En-Rogel. Kartpunkten står i den, omkring 1 km sydväst om kartans punkt för Jerusalem och 1,7 km från Kidrons i fågelvägen. Hos Josua ”drog sig gränsen uppåt Hinnoms sons dal, söder om Jebus’ höjd, det är Jerusalem”, och efter landsflykten bodde Juda ”från Beer-Seba ända till Hinnoms dal”."
    - "Platsen var inte alltid överenskommen. Arabisk tradition kallar en del av Kidron, under Tempelbergets östra mur, Wadi Jahannam, Gehennas dal, och medeltida muslimer och kristna förlade där båda den yttersta domen; några forskare på 1800-talet placerade Hinnom i Kidron eller i den centrala Tyropoiondalen. Gränsen hos Josua avgör det för den västra och södra dalen: från En-Rogel stiger linjen uppför Hinnoms dal förbi stadens södra sida och sedan till ”toppen av det berg som ligger gent emot Hinnomsdalen, västerut”. King James-översättningen låter Jeremia gå ut till dalen vid östra portens ingång; det hebreiska Harsith är snarare Lerskärvsporten."
    - "I dalen stod Tofet, där Judas kungar brände sina barn: Jeremia fördömer ”Tofethöjderna i Hinnoms sons dal”, uppbyggda ”för att där uppbränna sina söner och döttrar i eld”, och Josia ”orenade ock Tofet i Hinnoms barns dal, för att ingen skulle låta sin son eller dotter gå genom eld, till offer åt Molok” omkring 622 f.Kr. Från dess hebreiska namn, Ge Hinnom, kom det grekiska Geenna, Gehenna, platsen för eldig dom i evangelierna: frukta honom ”som har makt att förgöra både själ och kropp i Gehenna”. Den vanliga berättelsen att dalen var stadens ständigt brinnande soptipp går tillbaka till den medeltida kommentatorn David Kimchi, omkring 1200, och saknar antika belägg. History Globe har en artikel om dalen; det här svaret håller sig till var den låg."
  nb:
    - "Hinnom-dalen er dalen som svinger rundt vest og sør for Jerusalems gamleby, i dag Wadi er-Rababi eller Gei Ben Hinnom: den løper sørover fra under Jaffaporten, svinger østover under Sionfjellet og bydelen Abu Tor, og møter Kedron under Siloa-dammen, nær kilden En-Rogel. Kartpunktet står i den, omtrent 1 km sørvest for kartets punkt for Jerusalem og 1,7 km fra Kedrons i luftlinje. Hos Josva «gikk grensen op til Hinnoms sønns dal, til sydsiden av Jebus, det er Jerusalem», og etter eksilet bodde Juda «fra Be’erseba til Hinnoms dal»."
    - "Det var ikke alltid enighet om stedet. Arabisk tradisjon kaller en del av Kedron, under den østre muren av Tempelplassen, Wadi Jahannam, Gehennas dal, og middelalderens muslimer og kristne la begge den siste dom dit; noen forskere på 1800-tallet la Hinnom i Kedron eller i den sentrale Tyropoion-dalen. Grensen hos Josva avgjør det for den vestre og søndre dalen: fra En-Rogel stiger linjen opp Hinnom-dalen forbi byens sørside og så til «toppen av det fjell som ligger rett i vest for Hinnoms dal». Jeremia gikk ut til dalen ved «inngangen til østporten», slik King James Version gjengir det (by the entry of the east gate); det hebraiske Harsit er mer sannsynlig Potteskårporten."
    - "I dalen sto Tofet, der Judas konger brente barna sine: Jeremia fordømmer at de «har bygget Tofet-haugene i Hinnoms sønns dal for å opbrenne sine sønner og sine døtre med ild», og Josjia «gjorde … Tofet i Hinnoms barns dal urent, så ikke nogen skulde la sin sønn eller datter gå gjennem ilden for Molok» omkring 622 f.Kr. Fra det hebraiske navnet, Ge Hinnom, kom det greske Geenna, Gehenna, stedet for brennende dom i evangeliene: frykt for ham «som kan ødelegge både sjel og legeme i helvede». Den vanlige historien om at dalen var byens stadig brennende søppelfylling, går tilbake til middelalderkommentatoren David Kimhi, omkring 1200, og har ingen antikk støtte. History Globe har en artikkel om dalen; dette svaret holder seg til hvor den lå."
  tl:
    - "Ang Libis ng Hinnom ay ang libis na pumapalibot sa kanluran at timog ng Lumang Lungsod ng Jerusalem, ang Wadi er-Rababi o Gei Ben Hinnom ngayon: tumatakbo ito sa timog mula sa ibaba ng Pintuang Jaffa, lumiliko sa silangan sa ilalim ng Bundok Sion at ng distrito ng Abu Tor, at sumasama sa Cedron sa ibaba ng Tangke ng Siloe, malapit sa bukal ng En-rogel. Nasa loob nito ang punto sa mapa, mga 1 km sa timog-kanluran ng punto ng mapa para sa Jerusalem at 1.7 km mula sa Cedron sa tuwid na guhit. Sa Josue, ang hangganan ng Juda at Benjamin ay “pasampa sa libis ng anak ni Hinnom hanggang sa dako ng Jebuseo na dakong timugan (na siya ring Jerusalem)”, at pagkatapos ng pagkatapon, ang mga taga-Juda ay “nagsihantong mula sa Beer-seba hanggang sa libis ni Hinnom”."
    - "Hindi laging napagkakasunduan ang pook. Tinatawag ng tradisyong Arabe ang bahagi ng Cedron, sa ilalim ng silangang pader ng Bundok ng Templo, na Wadi Jahannam, ang libis ng Gehenna, at inilagay roon ng mga Muslim at Kristiyano noong Gitnang Panahon ang Huling Paghuhukom; inilagay ng ilang iskolar noong ika-19 na siglo ang Hinnom sa Cedron o sa gitnang lambak ng Tyropoeon. Ang hangganan sa Josue ang nagpapasya para sa kanluran at timog na lambak: mula sa En-rogel ay umaakyat ang guhit sa libis ng Hinnom sa timog ng lungsod at pagkatapos ay sa “taluktok ng bundok na dumudoon sa harap ng libis ng Hinnom na dakong kalunuran”. Lumabas si Jeremias sa libis sa pasukan ng silangang pintuan, ayon sa pagsasalin ng King James Version; ang Hebreong Harsit, “basag na palayok”, ay mas malamang na ang Pintuan ng Basag na Palayok."
    - "Sa libis nakatayo ang Topheth, kung saan sinunog ng mga hari ng Juda ang kanilang mga anak: hinahatulan ni Jeremias ang “mga mataas na dako ng Topheth, na nasa libis ng anak ni Hinnom, upang sunugin ang kanilang mga anak na lalake at babae sa apoy”, at si Josias, noong mga 622 BK, “nilapastangan ang Topheth… upang huwag paraanin ng sinoman ang kaniyang anak na lalake o babae sa apoy kay Moloch”. Mula sa pangalan nitong Hebreo, Ge Hinnom, nagmula ang Griyegong Geenna, Gehenna, ang pook ng nag-aapoy na paghatol sa mga Ebanghelyo: katakutan ang “makapupuksa sa kaluluwa at sa katawan sa impierno”. Ang karaniwang kuwento na nagbabagang tapunan ng basura ng lungsod ang libis ay mula sa komentaristang medyebal na si David Kimhi, mga 1200, at walang sinaunang ebidensiya. May artikulo ang History Globe tungkol sa libis; ang sagot na ito ay nakatuon sa kung nasaan ito."
  da:
    - "Hinnoms Dal er dalen, der bugter sig rundt om Jerusalems gamle bydel mod vest og syd, nutidens Wadi er-Rababi eller Gei Ben Hinnom: Den løber sydpå fra neden for Jaffaporten, drejer mod øst under Zions Bjerg og Abu Tor-kvarteret og støder til Kedron neden for Siloam-dammen, nær kilden En-Rogel. Kortets punkt står i den, ca. 1 km sydvest for kortets punkt for Jerusalem og 1,7 km fra Kedrons i fugleflugt. Hos Josva hedder det: »Landemærket gaar saa op til Hinnoms Søns Dal, mod den søndre Side af Jebus, det er Jerusalem«, og efter eksilet boede Juda »fra Beersaba indtil Hinnoms Dal«."
    - "Stedet har ikke altid været enigt fastlagt. Arabisk tradition kalder en del af Kedron under Tempelbjergets østmur Wadi Jahannam, Gehennas dal, og middelalderens muslimer og kristne placerede begge den yderste dom dér; nogle få forskere i 1800-tallet placerede Hinnom i Kedron eller i den centrale Tyropoion-dal. Grænsen hos Josva afgør det for den vestlige og sydlige dal: Fra En-Rogel stiger linjen op ad Hinnoms Dal forbi byens sydside og derefter til »Toppen af Bjerget, som ligger tværs over for Hinnoms Dal mod Vesten«. Jeremias gik ud til dalen ved indgangen til Østporten, som King James-versionen gengiver det; det hebraiske Harsit er mere sandsynligt Potteskårsporten."
    - "I dalen stod Tofet, hvor Judas konger brændte deres børn: Jeremias fordømmer »Tofeths Høje, som ere i Ben-Hinnoms Dal, for at opbrænde deres Sønner og Døtre i Ilden«, og Josias »vanhelligede Tofet, som var i Hinnoms Børns Dal, for at ikke nogen skulde lade sin Søn eller sin Datter gaa igennem Ilden til Molek« omkring 622 f.Kr. Af dens hebraiske navn, Ge Hinnom, kom det græske Geenna, Gehenna, det ildfulde doms sted i evangelierne: Frygt »ham, som kan fordærve baade Sjæl og Legeme i Helvede«. Den almindelige historie om, at dalen var byens evigt brændende losseplads, går tilbage til den middelalderlige kommentator David Kimhi, omkring 1200, og har ingen antik dokumentation. History Globe har en artikel om dalen; dette svar holder sig til, hvor den lå."
  sr:
    - "Долина Еномова је долина која се савија око запада и југа Старог града Јерусалима, данас Вади ер-Рабаби или Геј Бен Хином: пружа се на југ испод Јафске капије, скреће на исток испод горе Сион и четврти Абу Тор и улива се у Кедрон испод Силоамског језера, близу извора Ен-Рогил. Тачка на карти стоји у њој, око 1 км југозападно од тачке Јерусалима на карти и 1,7 км од тачке Кедрона ваздушном линијом. Код Исуса Навина за међу Јуде и Венијамина стоји: „одатле иде та међа преко долине синова Еномових покрај Јевусеја с југа, а то је Јерусалим“, а после прогонства Јудејци су се населили „од Вирсавеје до долине Емона“."
    - "О месту се није увек било сагласно. Арапско предање назива део Кедрона, испод источног зида Храмовне горе, Вади Џаханам, долина Геене, и средњовековни муслимани и хришћани једнако су ту смештали Последњи суд; неколико научника из деветнаестог века стављало је Еном у Кедрон или у средишњу Тиропеонску долину. Међа у Књизи Исуса Навина решава то за западну и јужну долину: од Ен-Рогила линија се пење долином Еномовом поред југа града, а затим на „врх горе која је према долини Еном к западу“. Јеремија је изашао у долину „пред вратима источним“, како то преводи и Верзија краља Јакова; хебрејско Харсит вероватније је Капија црепова."
    - "У долини је стајао Тофет, где су краљеви Јуде спаљивали своју децу: Јеремија осуђује „висине Тофету, који је у долини сина Еномовог, да сажижу синове своје и кћери своје огњем“, а о Јосији се каже: „Оскврни и Тофет, који беше у долини синова Еномових, да не би нико више водио сина свог ни кћери своје кроз огањ Молоху“ око 622. п. н. е. Од њеног хебрејског имена, Ге Хином, настала је грчка Геена, место огњеног суда у јеванђељима: бојте се „Оног који може и душу и тело погубити у паклу“. Раширена прича да је долина била вечно тињајуће градско ђубриште потиче од средњовековног коментатора Давида Кимхија, око 1200, и нема древних доказа. History Globe има чланак о долини; овај одговор говори само о томе где се налазила."
  hu:
    - "A Hinnom-völgy az a völgy, amely Jeruzsálem Óvárosának nyugati és déli oldalát ívben megkerüli, ma Wadi er-Rababi vagy Gei Ben Hinnom: a Jaffa-kapu alatt indul délre, a Sion-hegy és az Abu Tor negyed alatt keletre fordul, és a Siloám-tó alatt, az Én-Rógel forrás közelében csatlakozik a Kidronhoz. A térkép pontja benne áll, a Jeruzsálem-ponttól mintegy 1 km-re délnyugatra és a Kidron-ponttól légvonalban 1,7 km-re. Józsuénál Júda és Benjámin határáról ez áll: „felmegy a határ a Hinnom fiának völgyén, Jebuzeusnak, azaz Jeruzsálemnek déli oldala felé”, a száműzetés után pedig Júda „Beér-Sebától mind a Hinnóm völgyéig” lakott."
    - "A helyet nem mindig látták egyformán. Az arab hagyomány a Kidron egy részét a Templomhegy keleti fala alatt Wadi Jahannamnak, a gyehenna völgyének nevezi, és a középkori muszlimok és keresztények egyaránt oda tették az utolsó ítéletet; néhány 19. századi tudós a Hinnomot a Kidronba vagy a központi Türopoiosz-völgybe helyezte. Józsué határleírása eldönti a nyugati és déli völgy javára: az Én-Rógeltől a vonal a Hinnom-völgyön halad fel a város déli oldalán, majd „a hegynek tetejére, a mely átellenben van a Hinnom völgyével napnyugat felé”. Jeremiás a King James Version szerint „a keleti kapu bejáratánál” ment ki a völgybe; a héber Harszit nagyobb valószínűséggel a Cserépkapu."
    - "A völgyben állt a Tófet, ahol Júda királyai gyermekeiket égették: Jeremiás elítéli azokat, akik „felépítették a Tófet magaslatait, a mely a Ben-Hinnom völgyében van, hogy megégessék fiaikat és leányaikat tűzben”, Jósiás pedig Kr. e. 622 körül „Megfertőztette a Tófetet … hogy senki az ő fiát, vagy leányát át ne vihesse a tűzön Moloknak”. Héber nevéből, Ge Hinnom, lett a görög Geenna, a gyehenna, a tüzes ítélet helye az evangéliumokban: féljetek attól, „a ki mind a lelket, mind a testet elvesztheti a gyehennában”. A közkeletű történet, hogy a völgy a város örökké égő szeméttelepe volt, a középkori magyarázóra, Dávid Kimhire megy vissza, 1200 körül, és nincs mögötte ókori bizonyíték. A History Globe cikket közöl a völgyről; ez a válasz arra szorítkozik, hol volt."
  fi:
    - "Hinnomin laakso on laakso, joka kaartuu Jerusalemin vanhankaupungin länsi- ja eteläpuolella, nykyinen Wadi er-Rababi eli Gei Ben Hinnom: se kulkee etelään Jaffan portin alta, kääntyy itään Siioninvuoren ja Abu Torin kaupunginosan alla ja yhtyy Kidroniin Siloan altaan alapuolella, En-Rogelin lähteen lähellä. Kartan piste on siinä, noin 1 km Jerusalemin kartan pisteestä lounaaseen ja 1,7 km Kidronin pisteestä linnuntietä. Joosuan kirjassa Juudan ja Benjaminin raja ”nousee Ben-Hinnomin laaksoon, Jebusilaiskukkulan, se on Jerusalemin, eteläpuolitse”, ja pakkosiirtolaisuuden jälkeen Juuda asui ”Beersebasta aina Hinnomin laaksoon saakka”."
    - "Paikasta ei aina oltu yksimielisiä. Arabialainen perimätieto kutsuu osaa Kidronista, Temppelivuoren itämuurin alla, nimellä Wadi Jahannam, Gehennan laakso, ja keskiaikaiset muslimit ja kristityt sijoittivat viimeisen tuomion sinne; muutamat 1800-luvun tutkijat sijoittivat Hinnomin Kidroniin tai keskiseen Tyropoionin laaksoon. Joosuan kirjan raja ratkaisee asian läntisen ja eteläisen laakson hyväksi: En-Rogelista linja nousee Hinnomin laaksoa kaupungin eteläpuolitse ja sitten ”sen vuoren laelle, joka on vastapäätä Hinnomin laaksoa, lännessä päin”. Jeremia meni laaksoon King James -käännöksen mukaan itäportin sisäänkäynnin luona; heprean Harsit on todennäköisemmin Saviastiaportti."
    - "Laaksossa oli Tofet, jossa Juudan kuninkaat polttivat lapsiaan: Jeremia tuomitsee sen, kun ”he ovat rakentaneet Toofet-uhrikukkulat Ben-Hinnomin laaksoon, polttaakseen tulessa poikiansa ja tyttäriänsä”, ja Josia noin 622 eaa. ”saastutti myöskin polttopaikan Ben-Hinnomin laaksossa, ettei kukaan voisi panna poikaansa tai tytärtänsä kulkemaan tulen läpi Molokin kunniaksi”. Sen heprealaisesta nimestä Ge Hinnom tuli kreikan Geenna, Gehenna, evankeliumien tulisen tuomion paikka: peljätkää häntä, ”joka voi sekä sielun että ruumiin hukuttaa helvettiin”. Yleinen kertomus, että laakso oli kaupungin alati palava kaatopaikka, periytyy keskiaikaiselta selittäjältä David Kimhiltä, noin 1200, eikä sille ole antiikin todisteita. History Globessa on artikkeli laaksosta; tämä vastaus keskittyy siihen, missä se oli."
  vi:
    - "Trũng Hi-nôm là thung lũng uốn quanh phía tây và nam Thành Cổ của Giê-ru-sa-lem, nay là Wadi er-Rababi hay Gei Ben Hinnom: nó chạy về phía nam từ dưới Cổng Jaffa, rẽ về phía đông dưới Núi Si-ôn và khu Abu Tor, rồi nhập với Xết-rôn bên dưới Ao Si-lô-ê, gần suối Ên-Rô-ghên. Điểm trên bản đồ nằm trong đó, cách điểm Giê-ru-sa-lem khoảng 1 km về phía tây nam và cách điểm Xết-rôn 1,7 km theo đường thẳng. Trong sách Giô-suê, giới hạn giữa Giu-đa và Bên-gia-min “đi lên ngang qua trũng con trai Hi-nôm, về cạnh nam của Giê-hu, tức là Giê-ru-sa-lem”, và sau cuộc lưu đày người Giu-đa cư ngụ “ở từ Bê-e-sê-ba cho đến trũng Hin-nôm”."
    - "Địa điểm không phải lúc nào cũng được đồng thuận. Truyền thống Ả Rập gọi một phần Xết-rôn, dưới tường đông của Núi Đền, là Wadi Jahannam, thung lũng Gehenna, và cả người Hồi giáo lẫn Cơ Đốc thời Trung Cổ đều đặt Sự Phán xét Cuối cùng ở đó; một vài học giả thế kỷ 19 đặt Hi-nôm trong Xết-rôn hoặc trong thung lũng trung tâm Tyropoeon. Giới hạn trong sách Giô-suê quyết định cho thung lũng phía tây và nam: từ Ên-Rô-ghên, đường ranh leo lên Trũng Hi-nôm qua phía nam thành rồi đến “chót núi nằm ngang trũng Hi-nôm về hướng tây”. Giê-rê-mi đi ra trũng này “gần đường vào cửa Gốm”; bản King James dịch chữ Hê-bơ-rơ Harsith là “cửa đông”, nhưng nhiều khả năng đó là Cửa Gốm."
    - "Trong thung lũng có Tô-phết, nơi các vua Giu-đa thiêu con mình: Giê-rê-mi lên án “các nơi cao của Tô-phết, trong trũng của con trai Hi-nôm, đặng đốt con trai con gái mình trong lửa”, và Giô-si-a “làm ô uế Tô-phết… hầu cho từ rày về sau, không ai được đưa con trai hay là con gái mình qua lửa cho Mo-lóc” khoảng năm 622 TCN. Từ tên Hê-bơ-rơ của nó, Ge Hinnom, có tiếng Hy Lạp Geenna, Gehenna, nơi phán xét bằng lửa trong các sách Phúc Âm: hãy sợ Đấng “làm cho mất được linh hồn và thân thể trong địa ngục”. Câu chuyện phổ biến rằng thung lũng là bãi rác cháy mãi của thành bắt nguồn từ nhà chú giải thời Trung Cổ David Kimhi, khoảng năm 1200, và không có bằng chứng cổ xưa. History Globe có một bài về thung lũng; câu trả lời này chỉ bàn về nơi nó ở."
  ro:
    - "Valea Hinom este valea care se curbează în jurul părților de vest și de sud ale Orașului Vechi al Ierusalimului, azi Wadi er-Rababi sau Gei Ben Hinom: coboară spre sud de sub Poarta Jaffa, face o cotitură spre est sub Muntele Sion și cartierul Abu Tor și se unește cu Chedronul sub Scăldătoarea Siloamului, lângă izvorul En-Rogel. Punctul de pe hartă se află în ea, la circa 1 km sud-vest de punctul Ierusalimului de pe hartă și la 1,7 km de al Chedronului în linie dreaptă. În Iosua, hotarul dintre Iuda și Beniamin se urca prin valea fiului lui Hinom până la latura de sud a iebusitului, adică Ierusalimul, iar după exil Iuda a locuit „în Virsavee până la râpa Enom”."
    - "Locul nu a fost întotdeauna acceptat la fel. Tradiția arabă numește o parte a Chedronului, sub zidul estic al Muntelui Templului, Wadi Jahannam, valea Gheenei, iar musulmanii și creștinii medievali au așezat acolo deopotrivă Judecata de Apoi; câțiva cercetători din secolul al XIX-lea au pus Hinomul în Chedron sau în valea centrală a Tiropeonului. Hotarul din Iosua decide în favoarea văii de vest și de sud: de la En-Rogel linia urcă valea Hinomului pe la sudul cetății și apoi spre culmea muntelui care se află înaintea văii Hinomului, spre apus. Ieremia a ieșit la vale „înaintea ușilor porții Harsit”, pe care King James Version o redă drept poarta de răsărit; ebraicul Harsit este mai probabil Poarta Oalelor."
    - "În vale se afla Tofetul, unde regii lui Iuda își ardeau copiii: Ieremia condamnă înălțimile Tofetului din valea fiului lui Hinom, unde fiii și fiicele erau arși în foc, iar Iosia „au spurcat Tofetul cel din valea fiului lui Enom, ca nimenea să nu-și treacă pre feciorul său sau pre fata sa lui Moloh prin foc”, în jurul anului 622 î.Hr. Din numele ei ebraic, Ge Hinom, a venit grecescul Geenna, Gheena, locul judecății de foc din Evanghelii: să ne temem de „cela ce poate să piarză și trupul și sufletul, în gheena”. Povestea obișnuită că valea era groapa de gunoi mereu aprinsă a orașului merge înapoi până la comentatorul medieval David Kimhi, în jurul anului 1200, și nu are dovezi antice. History Globe are un articol despre vale; răspunsul de față se ține de locul unde se afla."
  bg:
    - "Долината Еном е долината, която обикаля западната и южната страна на Стария град на Йерусалим, днешните Уади ер-Рабаби или Гей Бен Хином: тя се спуска на юг под Яфската порта, завива на изток под Сион и квартала Абу Тор и се съединява с Кедрон под къпалнята Силоам, близо до извора Ен-Рогел. Точката на картата стои в нея, на около 1 км югозападно от точката на картата за Йерусалим и на 1,7 км от тази за Кедрон по права линия. В книга Иисус Навин границата между Юда и Вениамин „възлазяше… през дола на Еномовия син към южната страна на Иевус (това е Ерусалим;)“, а след изгнанието Юда се засели „от Вирсавее дори до дола Еномов“."
    - "Мястото не винаги е било безспорно. Арабското предание нарича част от Кедрон, под източната стена на Храмовия хълм, Уади Джаханам — долината на геената, и средновековните мюсюлмани и християни еднакво поставяха там Страшния съд; неколцина учени от XIX в. поставяха Еном в Кедрон или в централната долина Тиропеон. Границата в книга Иисус Навин решава въпроса в полза на западната и южната долина: от Ен-Рогел линията се изкачва по долината Еном покрай южната страна на града и после до „върха на гората която е срещу дола на Еном към запад“. Йеремия излезе в долината през входа на портата, която King James Version нарича източна; еврейското Харсит по-вероятно означава Портата на глинените отломки."
    - "В долината се намираше Тофет, където юдейските царе изгаряха децата си: Йеремия осъжда „високите места на Тофет, Който е в дола на Еномовия син, За да горят синовете си и дъщерите си в огън“, а Йосия около 622 г. пр.н.е. „оскверни Тофета… за да не може никой да преведе сина си или дъщеря си през огъня Молоху“. От еврейското ѝ име, Ге Хином, идва гръцкото Геена — мястото на огнения съд в Евангелията: да се боим от онзи, „който може и душа и тело да погуби в пъкъла“. Разпространеният разказ, че долината била вечно горящото сметище на града, води началото си от средновековния тълкувател Давид Кимхи, около 1200 г., и няма древни доказателства. В History Globe има статия за долината; този отговор се ограничава с това къде се е намирала."
