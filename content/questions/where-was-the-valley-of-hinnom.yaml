id: where-was-the-valley-of-hinnom
question:
  en: "Where was the Valley of Hinnom, the Gehenna of the Gospels?"
  ru: "Где находилась долина Еннома — евангельская геенна?"
  uk: "Де була долина Гінном, Геєна Євангелій?"
  es: "¿Dónde estaba el valle de Hinnom, la Gehenna de los Evangelios?"
  pt: "Onde ficava o vale de Hinom, a Geena dos Evangelhos?"
  de: "Wo lag das Hinnomtal, das Gehenna der Evangelien?"
  fr: "Où se trouvait la vallée de Hinnom, la Géhenne des Évangiles ?"
answer:
  en:
    - "The Valley of Hinnom is the valley that curves round the west and south of Jerusalem's Old City, today's Wadi er-Rababi or Gei Ben Hinnom: it runs south from below the Jaffa Gate, turns east under Mount Zion and the quarter of Abu Tor, and joins the Kidron below the Pool of Siloam, near the spring of En-rogel. The map point stands in it, about 1 km south-west of the map's point for Jerusalem and 1.7 km from the Kidron's in a straight line. In Joshua the border of Judah and Benjamin “went up by the valley of the son of Hinnom unto the south side of the Jebusite; the same is Jerusalem”, and after the exile Judah dwelt “from Beer-sheba unto the valley of Hinnom”."
    - "The place was not always agreed. Arab tradition calls part of the Kidron, under the eastern wall of the Temple Mount, Wadi Jahannam, the valley of Gehenna, and medieval Muslims and Christians alike set the Last Judgment there; a few nineteenth-century scholars put Hinnom in the Kidron or in the central Tyropoeon valley. The border in Joshua decides it for the western and southern valley: from En-rogel the line climbs the valley of Hinnom past the south of the city and then to “the top of the mountain that lieth before the valley of Hinnom westward”. Jeremiah went out to the valley “by the entry of the east gate”, as the King James Version renders it; the Hebrew Harsith is more likely the Potsherd Gate, and the Synodal translation keeps the name."
    - "In the valley stood Tophet, where the kings of Judah burned their children: Jeremiah condemns “the high places of Tophet, which is in the valley of the son of Hinnom, to burn their sons and their daughters in the fire”, and Josiah “defiled Topheth… that no man might make his son or his daughter to pass through the fire to Molech” about 622 BC. From its Hebrew name, Ge Hinnom, came the Greek Geenna, Gehenna, the place of fiery judgment in the Gospels: fear him “which is able to destroy both soul and body in hell”. The common story that the valley was the city's ever-burning rubbish dump goes back to the medieval commentator David Kimhi, about 1200, and has no ancient evidence. History Globe has an article on the valley; this answer keeps to where it was."
  ru:
    - "Долина Еннома — это долина, огибающая Старый город Иерусалима с запада и юга, нынешняя Вади-эр-Рабаби, или Гей-Бен-Хинном: она идёт на юг от подножия Яффских ворот, поворачивает на восток под горой Сион и кварталом Абу-Тор и сливается с Кедроном ниже Силоамского пруда, у источника Ен-Рогел. Точка карты стоит в ней, примерно в 1 км к юго-западу от точки Иерусалима и в 1,7 км от точки Кедрона по прямой. В книге Иисуса Навина граница Иуды и Вениамина «идет вверх к долине сына Енномова с южной стороны Иевуса, который есть Иерусалим», а после плена иудеи расположились «от Вирсавии и до долины Енномовой»."
    - "Это место определяли не всегда одинаково. Арабское предание называет часть Кедрона под восточной стеной Храмовой горы Вади-Джаханнам, долиной геенны, и средневековые мусульмане и христиане одинаково помещали там Страшный суд; немногие учёные XIX века искали долину Еннома в Кедроне или в средней, Тиропеонской долине. Граница в книге Иисуса Навина решает дело в пользу западной и южной долины: от Ен-Рогела линия поднимается долиной Еннома мимо юга города, а затем «на вершину горы, которая к западу против долины Енномовой». Иеремия выходил в долину, «которая у ворот Харшиф», — так Синодальный перевод сохраняет еврейское имя, которое скорее значит «ворота черепков»; английская Библия короля Якова передаёт его как восточные ворота."
    - "В долине стоял Тофет, где цари Иудеи сжигали детей: Иеремия обличает «высоты Тофета в долине сыновей Енномовых, чтобы сожигать сыновей своих и дочерей своих в огне», а Иосия около 622 г. до н. э. «осквернил… Тофет, что на долине сыновей Еннома, чтобы никто не проводил сына своего и дочери своей чрез огонь Молоху». Из её еврейского имени, Ге-Хинном, вышло греческое Геенна — в Евангелиях место огненного суда: бойтесь того, «кто может и душу и тело погубить в геенне». Расхожий рассказ, будто долина была вечно горящей городской свалкой, восходит к средневековому комментатору Давиду Кимхи, около 1200 г., и древних подтверждений не имеет. Долине в History Globe посвящена отдельная статья; здесь ответ о том, где она была."
  uk:
    - "Долина Гінном — долина, що огинає із заходу й півдня Старе місто Єрусалима, нинішній Ваді-ер-Рабабі, або Ґей-Бен-Хінном: вона йде на південь від Яффських воріт, повертає на схід під горою Сіон і кварталом Абу-Тор і впадає в Кедрон нижче басейну Силоам, біля джерела Ен-Рогел. Точка на мапі стоїть у ній, приблизно за 1 км на південний захід від точки Єрусалима на мапі і за 1,7 км від точки Кедрону по прямій. У Книзі Ісуса Навина межа Юди й Веніямина «тягнеться гряниця в долину сина Енномового на полуднє від нагірньої стїни Евузійської, се Ерусалим», а після вигнання юдеї оселилися «від Бирсабії до долини Енномової»."
    - "Місце не завжди було загальновизнаним. Арабський переказ називає частину Кедрону під східним муром Храмової гори Ваді-Джаннам, долиною Геєни, і середньовічні мусульмани й християни однаково поміщали там Страшний суд; кілька вчених XIX ст. поміщали Гінном у Кедроні або в центральній долині Тіропеон. Межа в Книзі Ісуса Навина вирішує справу для західної й південної долини: від Ен-Рогела лінія піднімається долиною Гінном повз південь міста, а потім до «верх гори, що стоїть на захід сонця перед долиною Еннома». Єремія вийшов у долину «біля входу східної брами», як передає Біблія короля Якова; єврейське Харсіт, імовірніше, означає Черепяну браму (так у тексті Куліша, Єр 19:2), а синодальний переклад зберігає єврейську назву."
    - "У долині стояв Тофет, де царі Юди палили своїх дітей: Єремія засуджує «висоти Тофет в долинї потомків Енномових, щоб там палити синів своїх і дочки свої», а Йосія «Посквернив і Тофет ... щоб нїхто не проводив сина свого чи дочку свою через огонь Молохові» близько 622 р. до н. е. Від її єврейської назви, Ге-Хінном, постало грецьке Геєнна, місце вогняного суду в Євангеліях: треба боятися того, «хто зможе погубити і душу й тїло в пеклї». Поширена розповідь, що долина була вічно палаючим сміттєзвалищем міста, сягає середньовічного коментатора Давида Кімхі, близько 1200 р., і не має давніх підтверджень. В «Історичному глобусі» є стаття про долину; ця відповідь стосується лише того, де вона була."
  es:
    - "El valle de Hinnom es el valle que rodea por el oeste y el sur la Ciudad Vieja de Jerusalén, hoy Wadi er-Rababi o Gei Ben Hinnom: corre hacia el sur desde debajo de la puerta de Jafa, gira al este bajo el monte Sion y el barrio de Abu Tor, y se une al Cedrón bajo el estanque de Siloé, cerca de la fuente de En-rogel. El punto del mapa está en él, a 1 km al suroeste del punto del mapa para Jerusalén y a 1,7 km del del Cedrón en línea recta. En Josué, la frontera de Judá y Benjamín «sube este término por el valle del hijo de Hinnom al lado del Jebuseo al mediodía: esta es Jerusalem», y tras el destierro Judá habitó «desde Beer-seba hasta el valle de Hinnom»."
    - "No siempre hubo acuerdo sobre el lugar. La tradición árabe llama a parte del Cedrón, bajo el muro oriental del Monte del Templo, Wadi Jahannam, el valle de la Gehenna, y tanto musulmanes como cristianos medievales situaron allí el Juicio Final; algunos estudiosos del siglo XIX pusieron Hinnom en el Cedrón o en el valle central del Tiropeón. La frontera de Josué lo decide a favor del valle occidental y meridional: desde En-rogel la línea sube por el valle de Hinnom pasando por el sur de la ciudad y luego hasta «la cumbre del monte que está delante del valle de Hinnom hacia el occidente». Jeremías salió al valle «á la entrada de la puerta oriental», como lo traduce la King James Version; el hebreo Harsith es más probablemente la puerta de los Tiestos, y la traducción sinodal conserva el nombre."
    - "En el valle estaba Tofet, donde los reyes de Judá quemaban a sus hijos: Jeremías condena «los altos de Topheth, que es en el valle del hijo de Hinnom, para quemar al fuego sus hijos y sus hijas», y Josías «profanó á Topheth, que está en el valle del hijo de Hinnom, porque ninguno pasase su hijo ó su hija por fuego á Moloch» hacia el 622 a. C. De su nombre hebreo, Ge Hinnom, vino el griego Geenna, Gehenna, el lugar del juicio de fuego en los Evangelios: temed a «aquel que puede destruir el alma y el cuerpo en el infierno». La historia común de que el valle era el basurero siempre ardiente de la ciudad se remonta al comentarista medieval David Kimji, hacia 1200, y no tiene pruebas antiguas. History Globe tiene un artículo sobre el valle; esta respuesta se ciñe a dónde estaba."
  pt:
    - "O vale de Hinom é o vale que contorna o oeste e o sul da Cidade Velha de Jerusalém, hoje Wadi er-Rababi ou Gei Ben Hinnom: corre para o sul a partir de baixo da Porta de Jafa, vira para o leste sob o monte Sião e o bairro de Abu Tor, e se junta ao Cedrom abaixo do tanque de Siloé, perto da fonte de En-Rogel. O ponto do mapa fica nele, a cerca de 1 km a sudoeste do ponto de Jerusalém no mapa e a 1,7 km do do Cedrom em linha reta. Em Josué, a fronteira de Judá e Benjamim “subia pelo vale do filho de Hinom até a encosta dos jebuseus (também chamada Jerusalém), ao sul”, e depois do exílio Judá habitou “desde Berseba até o vale de Hinom”."
    - "O lugar nem sempre foi consensual. A tradição árabe chama parte do Cedrom, sob a muralha oriental do monte do Templo, de Wadi Jahannam, o vale da Geena, e muçulmanos e cristãos medievais situaram ali o Juízo Final; alguns estudiosos do século XIX puseram Hinom no Cedrom ou no vale central do Tiropeão. A fronteira em Josué decide pelo vale ocidental e meridional: de En-Rogel a linha sobe o vale de Hinom pelo sul da cidade e depois até “o topo do monte que fica em frente ao vale de Hinom, a oeste”. Jeremias saiu ao vale pela entrada da porta oriental, como a versão King James traduz; o hebraico Harsit é mais provavelmente a Porta dos Cacos, e a tradução Sinodal conserva o nome."
    - "No vale ficava Tofete, onde os reis de Judá queimavam seus filhos: Jeremias condena “os altos de Tofete, que está no vale do filho de Hinom, para queimarem os seus filhos e as suas filhas no fogo”, e Josias “profanou Tofete… para que ninguém fizesse seu filho ou sua filha passar pelo fogo a Moloque”, por volta de 622 a.C. De seu nome hebraico, Ge Hinom, veio o grego Geena, o lugar do juízo de fogo nos Evangelhos: temam “aquele que pode destruir tanto a alma quanto o corpo na Geena”. A história comum de que o vale era o depósito de lixo sempre em chamas da cidade remonta ao comentarista medieval David Kimhi, por volta de 1200, e não tem evidência antiga. O History Globe tem um artigo sobre o vale; esta resposta trata apenas de onde ficava."
  de:
    - "Das Hinnomtal ist das Tal, das sich im Westen und Süden um die Altstadt Jerusalems krümmt, heute Wadi er-Rababi oder Gei Ben Hinnom: Es verläuft von unterhalb des Jaffators nach Süden, wendet sich unter dem Berg Zion und dem Viertel Abu Tor nach Osten und mündet unterhalb des Teichs Siloah beim Quell En-Rogel in das Kidrontal. Der Kartenpunkt steht darin, in der Luftlinie etwa 1 km südwestlich des Kartenpunkts für Jerusalem und 1,7 km von dem des Kidron. Bei Josua heißt es von der Grenze zwischen Juda und Benjamin: „darnach geht sie herauf zum Tal des Sohnes Hinnoms an der Mittagseite des Jebusiters, das ist Jerusalem“, und nach dem Exil wohnte Juda „von Beer-Seba an bis an das Tal Hinnom“."
    - "Über den Ort war man sich nicht immer einig. Die arabische Überlieferung nennt einen Teil des Kidron unter der Ostmauer des Tempelbergs Wadi Dschahannam, das Tal der Gehenna, und mittelalterliche Muslime wie Christen setzten dorthin das Jüngste Gericht; einige Gelehrte des 19. Jahrhunderts verlegten das Hinnom in den Kidron oder ins zentrale Tyropoiontal. Die Grenzbeschreibung bei Josua entscheidet für das westliche und südliche Tal: Von En-Rogel steigt die Linie durch das Hinnomtal südlich der Stadt hinauf und dann „an die Spitze des Berges, der vor dem Tal Hinnom liegt abendwärts“. Jeremia ging in das Tal hinaus „vor dem Ziegeltor“, wie die Lutherbibel es wiedergibt, die King-James-Bibel dagegen mit Osttor; das hebräische Harsit ist eher das Scherbentor, und die Synodalübersetzung behält den Namen."
    - "Im Tal stand Tofet, wo die Könige von Juda ihre Kinder verbrannten: Jeremia verurteilt, dass sie „die Altäre des Thopheth im Tal Ben-Hinnom“ bauen, „daß sie ihre Söhne und Töchter verbrennen“, und Josia „verunreinigte auch das Topheth im Tal der Kinder Hinnom, daß niemand seinen Sohn oder seine Tochter dem Moloch durchs Feuer ließ gehen“, um 622 v. Chr. Aus seinem hebräischen Namen Ge Hinnom kam das griechische Geenna, Gehenna, der Ort des feurigen Gerichts in den Evangelien: Man solle den fürchten, „der Leib und Seele verderben kann in der Hölle“. Die verbreitete Erzählung, das Tal sei die ewig brennende Müllkippe der Stadt gewesen, geht auf den mittelalterlichen Ausleger David Kimchi um 1200 zurück und hat keinen antiken Beleg. History Globe hat einen Artikel über das Tal; diese Antwort beschränkt sich darauf, wo es lag."
  fr:
    - "La vallée de Hinnom est la vallée qui contourne à l’ouest et au sud la vieille ville de Jérusalem, l’actuel Wadi er-Rababi ou Gei Ben Hinnom : elle descend vers le sud depuis le dessous de la porte de Jaffa, tourne vers l’est sous le mont Sion et le quartier d’Abu Tor, et rejoint le Cédron sous le bassin de Siloé, près de la source d’En-Roguel. Le point de la carte s’y trouve, à environ 1 km au sud-ouest du point de la carte pour Jérusalem et à 1,7 km de celui du Cédron à vol d’oiseau. Dans Josué, la frontière de Juda et de Benjamin « montait de là par la vallée de Ben-Hinnom au côté méridional de Jebus, qui est Jérusalem », et après l’exil, Juda s’établit « depuis Beer-Schéba jusqu’à la vallée de Hinnom »."
    - "L’emplacement n’a pas toujours fait l’unanimité. La tradition arabe appelle une partie du Cédron, sous le mur oriental du mont du Temple, Wadi Jahannam, la vallée de la Géhenne, et les musulmans comme les chrétiens du Moyen Âge y plaçaient le Jugement dernier ; quelques spécialistes du XIXe siècle ont situé Hinnom dans le Cédron ou dans la vallée centrale du Tyropéon. La frontière de Josué tranche pour la vallée occidentale et méridionale : depuis En-Roguel, la ligne monte la vallée de Hinnom au sud de la ville, puis jusqu’« au sommet de la montagne, qui est devant la vallée de Hinnom à l’occident ». Jérémie sortit vers la vallée par l’entrée de la porte de l’est, selon la King James Version ; l’hébreu Harsith est plus probablement la porte des Tessons, et la Bible synodale russe garde le nom."
    - "Dans la vallée se trouvait Topheth, où les rois de Juda brûlaient leurs enfants : Jérémie condamne « des hauts lieux à Topheth dans la vallée de Ben-Hinnom, pour brûler au feu leurs fils et leurs filles », et Josias « souilla Topheth… afin que personne ne fît plus passer son fils ou sa fille par le feu en l’honneur de Moloc », vers 622 av. J.-C. De son nom hébreu, Gé Hinnom, vint le grec Géenna, la Géhenne, lieu du jugement par le feu dans les Évangiles : craignez « celui qui peut faire périr l’âme et le corps dans la géhenne ». L’histoire courante selon laquelle la vallée était le dépotoir toujours en feu de la ville remonte au commentateur médiéval David Kimhi, vers 1200, et n’a aucune preuve ancienne. History Globe consacre un article à la vallée ; cette réponse se limite à son emplacement."
