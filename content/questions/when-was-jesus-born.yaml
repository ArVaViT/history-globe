id: when-was-jesus-born
question:
  en: "When was Jesus born, and who ruled then?"
  ru: "Когда родился Иисус и кто тогда правил?"
  uk: "Коли народився Ісус і хто тоді правив?"
  es: "¿Cuándo nació Jesús y quién gobernaba entonces?"
  pt: "Quando nasceu Jesus, e quem governava então?"
  de: "Wann wurde Jesus geboren, und wer herrschte damals?"
  fr: "Quand Jésus est-il né, et qui régnait alors ?"
answer:
  en:
    - "Jesus was born a few years before the start of the Christian era: most scholars place the birth between about 6 and 4 BC, in the last years of Herod the Great, king of Judea under the emperor Augustus; a minority, dating Herod's death to 1 BC, place it in 3–2 BC; the map uses 5 BC as a conventional point."
    - 'Matthew says: "Now when Jesus was born in Bethlehem of Judaea in the days of Herod the king, behold, there came wise men from the east to Jerusalem", and Luke also opens "in the days of Herod, the king of Judaea". Herod had taken Jerusalem in 37 BC and died after a lunar eclipse and before Passover, as Josephus says; this is usually dated to 4 BC, by some to 1 BC. The birth therefore falls before Herod''s death. Luke adds that John the Baptist began to preach in the fifteenth year of Tiberius, AD 28/29, and that Jesus was then about thirty years old, which fits roughly. The Christian era itself was fixed centuries later and set the birth a few years too late.'
    - "Rome's emperor was Augustus (27 BC–AD 14), and Judea was a client kingdom of Rome. After Herod's death his sons divided the land: Archelaus took Judea, and Matthew says that Joseph, afraid of Archelaus, settled in Galilee, which Herod Antipas ruled. Luke's census under Quirinius is a known difficulty: Josephus dates Quirinius's census to AD 6, when Judea became a Roman province, and how this fits the reign of Herod is debated, so the map does not tie the birth to it."
  ru:
    - "Иисус родился за несколько лет до начала нашей эры: большинство учёных относят рождение примерно к 6–4 гг. до н. э., к последним годам Ирода Великого, царя Иудеи при императоре Августе; меньшинство, датируя смерть Ирода 1 г. до н. э., — к 3–2 гг. до н. э.; карта показывает условный 5 г. до н. э."
    - "Матфей пишет: «Когда же Иисус родился в Вифлееме Иудейском во дни царя Ирода, пришли в Иерусалим волхвы с востока», и Лука тоже начинает «во дни Ирода, царя Иудейского». Ирод взял Иерусалим в 37 г. до н. э. и умер, по Иосифу Флавию, после лунного затмения и перед Пасхой; обычно это 4 г. до н. э., по мнению некоторых — 1 г. до н. э. Значит, рождение было раньше смерти Ирода. Лука добавляет, что Иоанн Креститель начал проповедь в пятнадцатый год Тиверия, 28/29 г. н. э., и что Иисусу было тогда лет тридцать, — это приблизительно согласуется с этими датами. Сама христианская эра была установлена столетия спустя и сдвинула рождение на несколько лет позже."
    - "Императором в Риме был Август (27 г. до н. э. — 14 г. н. э.), а Иудея была зависимым от Рима царством. После смерти Ирода землю разделили его сыновья: Иудею получил Архелай, и Матфей говорит, что Иосиф, убоявшись Архелая, поселился в Галилее, которой правил Ирод Антипа. Перепись при Квиринии у Луки — известная трудность: Иосиф Флавий относит перепись Квириния к 6 г. н. э., когда Иудея стала римской провинцией, и как это согласовать с царствованием Ирода, спорно, поэтому карта не привязывает рождение к ней."
  uk:
    - "Ісус народився за кілька років до початку християнської ери: більшість учених відносить народження приблизно до 6–4 рр. до н. е., в останні роки Ірода Великого, царя Юдеї за імператора Августа; меншість, датуючи смерть Ірода 1 р. до н. е., відносить його до 3–2 рр. до н. е.; мапа використовує 5 р. до н. е. як умовну точку."
    - "Матвій каже: «Як же народивсь Ісус у Витлеємі Юдейському за царя Ірода, прийшли мудрцї зі сходу в Єрусалим», і Лука також починає: «Був за Ірода, царя Юдейського». Ірод узяв Єрусалим 37 р. до н. е. і помер після місячного затемнення та перед Пасхою, як каже Йосиф Флавій; це зазвичай датують 4 р. до н. е., дехто — 1 р. до н. е. Отже, народження припадає на час до смерті Ірода. Лука додає, що Іван Хреститель почав проповідувати на п'ятнадцятому році Тиверія, 28/29 р. н. е., і що Ісусові тоді було близько тридцяти років, що приблизно сходиться. Саму християнську еру було встановлено століттями пізніше, і вона віднесла народження на кілька років надто пізно."
    - "Імператором Рима був Август (27 р. до н. е. — 14 р. н. е.), а Юдея була залежним царством Рима. Після смерті Ірода його сини розділили країну: Архелай узяв Юдею, і Матвій каже, що Йосип, боячись Архелая, оселився в Галілеї, якою правив Ірод Антипа. Перепис за Квиринія, про який пише Лука, — відома складність: Йосиф Флавій датує перепис Квиринія 6 р. н. е., коли Юдея стала римською провінцією, і як це поєднується з царюванням Ірода, обговорюється, тож мапа не прив'язує народження до нього."
  es:
    - "Jesús nació unos años antes del comienzo de la era cristiana: la mayoría de los estudiosos sitúa el nacimiento aproximadamente entre el 6 y el 4 a. C., en los últimos años de Herodes el Grande, rey de Judea bajo el emperador Augusto; una minoría, que fecha la muerte de Herodes en el 1 a. C., lo sitúa en el 3–2 a. C.; el mapa usa el 5 a. C. como punto convencional."
    - "Mateo dice: «Y como fué nacido Jesús en Bethlehem de Judea en días del rey Herodes, he aquí unos magos vinieron del oriente á Jerusalem», y Lucas también comienza «en los días de Herodes, rey de Judea». Herodes había tomado Jerusalén en el 37 a. C. y murió después de un eclipse lunar y antes de la Pascua, como dice Josefo; esto suele fecharse en el 4 a. C., y algunos lo fechan en el 1 a. C. El nacimiento cae, pues, antes de la muerte de Herodes. Lucas añade que Juan el Bautista comenzó a predicar en el año quince de Tiberio, el 28/29 d. C., y que Jesús tenía entonces unos treinta años, lo que encaja aproximadamente. La propia era cristiana fue fijada siglos después y puso el nacimiento unos años demasiado tarde."
    - "El emperador de Roma era Augusto (27 a. C.–14 d. C.), y Judea era un reino cliente de Roma. Tras la muerte de Herodes, sus hijos se repartieron la tierra: Arquelao recibió Judea, y Mateo dice que José, temeroso de Arquelao, se estableció en Galilea, que gobernaba Herodes Antipas. El censo de Cirenio en Lucas es una dificultad conocida: Josefo fecha el censo de Cirenio en el 6 d. C., cuando Judea pasó a ser provincia romana, y cómo encaja esto con el reinado de Herodes es debatido, de modo que el mapa no ata el nacimiento a él."
  pt:
    - "Jesus nasceu alguns anos antes do início da era cristã: a maioria dos estudiosos situa o nascimento entre cerca de 6 e 4 a.C., nos últimos anos de Herodes, o Grande, rei da Judeia sob o imperador Augusto; uma minoria, datando a morte de Herodes em 1 a.C., o situa em 3–2 a.C.; o mapa usa 5 a.C. como ponto convencional."
    - "Mateus diz: “Tendo Jesus nascido em Belém da Judeia, nos dias do rei Herodes, eis que magos do oriente chegaram a Jerusalém”, e Lucas também abre “nos dias de Herodes, rei da Judeia”. Herodes tomara Jerusalém em 37 a.C. e morreu depois de um eclipse lunar e antes da Páscoa, como diz Josefo; isso é geralmente datado de 4 a.C., por alguns de 1 a.C. O nascimento cai, portanto, antes da morte de Herodes. Lucas acrescenta que João Batista começou a pregar no décimo quinto ano de Tibério, 28/29 d.C., e que Jesus tinha então cerca de trinta anos, o que combina mais ou menos. A própria era cristã foi fixada séculos depois e pôs o nascimento alguns anos tarde demais."
    - "O imperador de Roma era Augusto (27 a.C.–14 d.C.), e a Judeia era um reino cliente de Roma. Após a morte de Herodes, seus filhos dividiram a terra: Arquelau ficou com a Judeia, e Mateus diz que José, com medo de Arquelau, se fixou na Galileia, que Herodes Antipas governava. O recenseamento de Lucas sob Quirino é uma dificuldade conhecida: Josefo data o recenseamento de Quirino em 6 d.C., quando a Judeia se tornou província romana, e como isso se ajusta ao reinado de Herodes é debatido, de modo que o mapa não liga o nascimento a ele."
  de:
    - "Jesus wurde einige Jahre vor Beginn der christlichen Zeitrechnung geboren: Die meisten Gelehrten setzen die Geburt zwischen etwa 6 und 4 v. Chr., in die letzten Jahre Herodes' des Großen, des Königs von Judäa unter Kaiser Augustus; eine Minderheit, die Herodes' Tod auf 1 v. Chr. datiert, setzt sie auf 3–2 v. Chr.; die Karte verwendet 5 v. Chr. als herkömmlichen Punkt."
    - "Matthäus sagt: „Da Jesus geboren war zu Bethlehem im jüdischen Lande, zur Zeit des Königs Herodes, siehe, da kamen die Weisen vom Morgenland nach Jerusalem“, und auch Lukas beginnt: „Zu der Zeit des Herodes, des Königs von Judäa“. Herodes hatte Jerusalem 37 v. Chr. eingenommen und starb nach einer Mondfinsternis und vor dem Passafest, wie Josephus sagt; das datiert man meist auf 4 v. Chr., manche auf 1 v. Chr. Die Geburt fällt also vor den Tod des Herodes. Lukas fügt hinzu, Johannes der Täufer habe im fünfzehnten Jahr des Tiberius, 28/29 n. Chr., zu predigen begonnen, und Jesus sei damals etwa dreißig Jahre alt gewesen, was ungefähr passt. Die christliche Zeitrechnung selbst wurde Jahrhunderte später festgelegt und setzte die Geburt einige Jahre zu spät an."
    - "Roms Kaiser war Augustus (27 v. Chr.–14 n. Chr.), und Judäa war ein Klientelkönigreich Roms. Nach dem Tod des Herodes teilten seine Söhne das Land: Archelaos erhielt Judäa, und Matthäus sagt, Josef habe sich aus Furcht vor Archelaos in Galiläa niedergelassen, das Herodes Antipas regierte. Der Zensus des Lukas unter Quirinius ist eine bekannte Schwierigkeit: Josephus datiert Quirinius' Schätzung auf 6 n. Chr., als Judäa römische Provinz wurde, und wie das zur Regierungszeit des Herodes passt, ist umstritten, weshalb die Karte die Geburt nicht daran bindet."
  fr:
    - "Jésus naquit quelques années avant le début de l’ère chrétienne : la plupart des savants placent la naissance entre 6 et 4 av. J.-C. environ, dans les dernières années d’Hérode le Grand, roi de Judée sous l’empereur Auguste ; une minorité, datant la mort d’Hérode de 1 av. J.-C., la place en 3–2 av. J.-C. ; la carte retient 5 av. J.-C. comme repère conventionnel."
    - "Matthieu dit : « Jésus étant né à Bethléhem en Judée, au temps du roi Hérode, voici des mages d’Orient arrivèrent à Jérusalem », et Luc s’ouvre aussi « Du temps d’Hérode, roi de Judée ». Hérode avait pris Jérusalem en 37 av. J.-C. et mourut après une éclipse de lune et avant la Pâque, dit Josèphe ; on date d’ordinaire cet événement de 4 av. J.-C., certains de 1 av. J.-C. La naissance se situe donc avant la mort d’Hérode. Luc ajoute que Jean le Baptiste commença à prêcher la quinzième année de Tibère, 28/29 apr. J.-C., et que Jésus avait alors environ trente ans, ce qui concorde à peu près. L’ère chrétienne elle-même fut fixée des siècles plus tard et plaça la naissance quelques années trop tard."
    - "L’empereur de Rome était Auguste (27 av. J.-C.–14 apr. J.-C.), et la Judée était un royaume client de Rome. À la mort d’Hérode, ses fils se partagèrent le pays : Archélaüs reçut la Judée, et Matthieu dit que Joseph, craignant Archélaüs, s’établit en Galilée, que gouvernait Hérode Antipas. Le recensement de Luc sous Quirinius est une difficulté connue : Josèphe date le recensement de Quirinius de 6 apr. J.-C., quand la Judée devint province romaine, et la façon dont il s’accorde avec le règne d’Hérode est débattue, aussi la carte n’y rattache-t-elle pas la naissance."
