id: when-was-jesus-born
question:
  en: "When was Jesus born, and who ruled then?"
  ru: "Когда родился Иисус и кто тогда правил?"
  uk: "Коли народився Ісус і хто тоді правив?"
  es: "¿Cuándo nació Jesús y quién gobernaba entonces?"
  pt: "Quando nasceu Jesus, e quem governava então?"
  de: "Wann wurde Jesus geboren, und wer herrschte damals?"
  fr: "Quand Jésus est-il né, et qui régnait alors ?"
  pl: "Kiedy urodził się Jezus i kto wtedy rządził?"
  it: "Quando nacque Gesù, e chi regnava allora?"
  nl: "Wanneer werd Jezus geboren, en wie regeerde toen?"
  cs: "Kdy se narodil Ježíš a kdo tehdy vládl?"
  sv: "När föddes Jesus, och vem regerade då?"
  nb: "Når ble Jesus født, og hvem regjerte da?"
  tl: "Kailan ipinanganak si Jesus, at sino ang namuno noon?"
  da: "Hvornår blev Jesus født, og hvem regerede dengang?"
  sr: "Када је рођен Исус и ко је тада владао?"
  hu: "Mikor született Jézus, és ki uralkodott akkor?"
  fi: "Milloin Jeesus syntyi ja ketkä hallitsivat silloin?"
  vi: "Giê-su sinh khi nào, và lúc ấy ai cai trị?"
  ro: "Când s-a născut Isus și cine conducea atunci?"
  bg: "Кога е роден Исус и кой е управлявал тогава?"
answer:
  en:
    - "Jesus was born a few years before the start of the Christian era: most scholars place the birth between about 6 and 4 BC, in the last years of Herod the Great, king of Judea under the emperor Augustus; a minority, dating Herod's death to 1 BC, place it in 3–2 BC; the map uses 5 BC as a conventional point."
    - 'Matthew says: "Now when Jesus was born in Bethlehem of Judaea in the days of Herod the king, behold, there came wise men from the east to Jerusalem", and Luke also opens "in the days of Herod, the king of Judaea". Herod had taken Jerusalem in 37 BC and died after a lunar eclipse and before Passover, as Josephus says; this is usually dated to 4 BC, by some to 1 BC. The birth therefore falls before Herod''s death. Luke adds that John the Baptist began to preach in the fifteenth year of Tiberius, AD 28/29, and that Jesus was then about thirty years old, which fits roughly. The Christian era itself was fixed centuries later and set the birth a few years too late.'
    - "Rome's emperor was Augustus (27 BC–AD 14), and Judea was a client kingdom of Rome. After Herod's death his sons divided the land: Archelaus took Judea, and Matthew says that Joseph, afraid of Archelaus, settled in Galilee, which Herod Antipas ruled. Luke's census under Quirinius is a known difficulty: Josephus dates Quirinius's census to AD 6, when Judea became a Roman province, and how this fits the reign of Herod is debated, so the map does not tie the birth to it."
  ru:
    - "Иисус родился за несколько лет до начала нашей эры: большинство учёных относят рождение примерно к 6–4 гг. до н. э., к последним годам Ирода Великого, царя Иудеи при императоре Августе; меньшинство, датируя смерть Ирода 1 г. до н. э., — к 3–2 гг. до н. э.; карта показывает условный 5 г. до н. э."
    - "Матфей пишет: «Когда же Иисус родился в Вифлееме Иудейском во дни царя Ирода, пришли в Иерусалим волхвы с востока», и Лука тоже начинает «во дни Ирода, царя Иудейского». Ирод взял Иерусалим в 37 г. до н. э. и умер, по Иосифу Флавию, после лунного затмения и перед Пасхой; обычно это 4 г. до н. э., по мнению некоторых — 1 г. до н. э. Значит, рождение было раньше смерти Ирода. Лука добавляет, что Иоанн Креститель начал проповедь в пятнадцатый год Тиверия, 28/29 г. н. э., и что Иисусу было тогда лет тридцать, — это приблизительно согласуется с этими датами. Сама христианская эра была установлена столетия спустя и сдвинула рождение на несколько лет позже."
    - "Императором в Риме был Август (27 г. до н. э. — 14 г. н. э.), а Иудея была зависимым от Рима царством. После смерти Ирода землю разделили его сыновья: Иудею получил Архелай, и Матфей говорит, что Иосиф, убоявшись Архелая, поселился в Галилее, которой правил Ирод Антипа. Перепись при Квиринии у Луки — известная трудность: Иосиф Флавий относит перепись Квириния к 6 г. н. э., когда Иудея стала римской провинцией, и как это согласовать с царствованием Ирода, спорно, поэтому карта не привязывает рождение к ней."
  uk:
    - "Ісус народився за кілька років до початку християнської ери: більшість учених відносить народження приблизно до 6–4 рр. до н. е., в останні роки Ірода Великого, царя Юдеї за імператора Августа; меншість, датуючи смерть Ірода 1 р. до н. е., відносить його до 3–2 рр. до н. е.; мапа використовує 5 р. до н. е. як умовну точку."
    - "Матвій каже: «Як же народивсь Ісус у Витлеємі Юдейському за царя Ірода, прийшли мудрцї зі сходу в Єрусалим», і Лука також починає: «Був за Ірода, царя Юдейського». Ірод узяв Єрусалим 37 р. до н. е. і помер після місячного затемнення та перед Пасхою, як каже Йосиф Флавій; це зазвичай датують 4 р. до н. е., дехто — 1 р. до н. е. Отже, народження припадає на час до смерті Ірода. Лука додає, що Іван Хреститель почав проповідувати на п'ятнадцятому році Тиверія, 28/29 р. н. е., і що Ісусові тоді було близько тридцяти років, що приблизно сходиться. Саму християнську еру було встановлено століттями пізніше, і вона віднесла народження на кілька років надто пізно."
    - "Імператором Рима був Август (27 р. до н. е. — 14 р. н. е.), а Юдея була залежним царством Рима. Після смерті Ірода його сини розділили країну: Архелай узяв Юдею, і Матвій каже, що Йосип, боячись Архелая, оселився в Галілеї, якою правив Ірод Антипа. Перепис за Квиринія, про який пише Лука, — відома складність: Йосиф Флавій датує перепис Квиринія 6 р. н. е., коли Юдея стала римською провінцією, і як це поєднується з царюванням Ірода, обговорюється, тож мапа не прив'язує народження до нього."
  es:
    - "Jesús nació unos años antes del comienzo de la era cristiana: la mayoría de los estudiosos sitúa el nacimiento aproximadamente entre el 6 y el 4 a. C., en los últimos años de Herodes el Grande, rey de Judea bajo el emperador Augusto; una minoría, que fecha la muerte de Herodes en el 1 a. C., lo sitúa en el 3–2 a. C.; el mapa usa el 5 a. C. como punto convencional."
    - "Mateo dice: «Y como fué nacido Jesús en Bethlehem de Judea en días del rey Herodes, he aquí unos magos vinieron del oriente á Jerusalem», y Lucas también comienza «en los días de Herodes, rey de Judea». Herodes había tomado Jerusalén en el 37 a. C. y murió después de un eclipse lunar y antes de la Pascua, como dice Josefo; esto suele fecharse en el 4 a. C., y algunos lo fechan en el 1 a. C. El nacimiento cae, pues, antes de la muerte de Herodes. Lucas añade que Juan el Bautista comenzó a predicar en el año quince de Tiberio, el 28/29 d. C., y que Jesús tenía entonces unos treinta años, lo que encaja aproximadamente. La propia era cristiana fue fijada siglos después y puso el nacimiento unos años demasiado tarde."
    - "El emperador de Roma era Augusto (27 a. C.–14 d. C.), y Judea era un reino cliente de Roma. Tras la muerte de Herodes, sus hijos se repartieron la tierra: Arquelao recibió Judea, y Mateo dice que José, temeroso de Arquelao, se estableció en Galilea, que gobernaba Herodes Antipas. El censo de Cirenio en Lucas es una dificultad conocida: Josefo fecha el censo de Cirenio en el 6 d. C., cuando Judea pasó a ser provincia romana, y cómo encaja esto con el reinado de Herodes es debatido, de modo que el mapa no ata el nacimiento a él."
  pt:
    - "Jesus nasceu alguns anos antes do início da era cristã: a maioria dos estudiosos situa o nascimento entre cerca de 6 e 4 a.C., nos últimos anos de Herodes, o Grande, rei da Judeia sob o imperador Augusto; uma minoria, datando a morte de Herodes em 1 a.C., o situa em 3–2 a.C.; o mapa usa 5 a.C. como ponto convencional."
    - "Mateus diz: “Tendo Jesus nascido em Belém da Judeia, nos dias do rei Herodes, eis que magos do oriente chegaram a Jerusalém”, e Lucas também abre “nos dias de Herodes, rei da Judeia”. Herodes tomara Jerusalém em 37 a.C. e morreu depois de um eclipse lunar e antes da Páscoa, como diz Josefo; isso é geralmente datado de 4 a.C., por alguns de 1 a.C. O nascimento cai, portanto, antes da morte de Herodes. Lucas acrescenta que João Batista começou a pregar no décimo quinto ano de Tibério, 28/29 d.C., e que Jesus tinha então cerca de trinta anos, o que combina mais ou menos. A própria era cristã foi fixada séculos depois e pôs o nascimento alguns anos tarde demais."
    - "O imperador de Roma era Augusto (27 a.C.–14 d.C.), e a Judeia era um reino cliente de Roma. Após a morte de Herodes, seus filhos dividiram a terra: Arquelau ficou com a Judeia, e Mateus diz que José, com medo de Arquelau, se fixou na Galileia, que Herodes Antipas governava. O recenseamento de Lucas sob Quirino é uma dificuldade conhecida: Josefo data o recenseamento de Quirino em 6 d.C., quando a Judeia se tornou província romana, e como isso se ajusta ao reinado de Herodes é debatido, de modo que o mapa não liga o nascimento a ele."
  de:
    - "Jesus wurde einige Jahre vor Beginn der christlichen Zeitrechnung geboren: Die meisten Gelehrten setzen die Geburt zwischen etwa 6 und 4 v. Chr., in die letzten Jahre Herodes' des Großen, des Königs von Judäa unter Kaiser Augustus; eine Minderheit, die Herodes' Tod auf 1 v. Chr. datiert, setzt sie auf 3–2 v. Chr.; die Karte verwendet 5 v. Chr. als herkömmlichen Punkt."
    - "Matthäus sagt: „Da Jesus geboren war zu Bethlehem im jüdischen Lande, zur Zeit des Königs Herodes, siehe, da kamen die Weisen vom Morgenland nach Jerusalem“, und auch Lukas beginnt: „Zu der Zeit des Herodes, des Königs von Judäa“. Herodes hatte Jerusalem 37 v. Chr. eingenommen und starb nach einer Mondfinsternis und vor dem Passafest, wie Josephus sagt; das datiert man meist auf 4 v. Chr., manche auf 1 v. Chr. Die Geburt fällt also vor den Tod des Herodes. Lukas fügt hinzu, Johannes der Täufer habe im fünfzehnten Jahr des Tiberius, 28/29 n. Chr., zu predigen begonnen, und Jesus sei damals etwa dreißig Jahre alt gewesen, was ungefähr passt. Die christliche Zeitrechnung selbst wurde Jahrhunderte später festgelegt und setzte die Geburt einige Jahre zu spät an."
    - "Roms Kaiser war Augustus (27 v. Chr.–14 n. Chr.), und Judäa war ein Klientelkönigreich Roms. Nach dem Tod des Herodes teilten seine Söhne das Land: Archelaos erhielt Judäa, und Matthäus sagt, Josef habe sich aus Furcht vor Archelaos in Galiläa niedergelassen, das Herodes Antipas regierte. Der Zensus des Lukas unter Quirinius ist eine bekannte Schwierigkeit: Josephus datiert Quirinius' Schätzung auf 6 n. Chr., als Judäa römische Provinz wurde, und wie das zur Regierungszeit des Herodes passt, ist umstritten, weshalb die Karte die Geburt nicht daran bindet."
  fr:
    - "Jésus naquit quelques années avant le début de l’ère chrétienne : la plupart des savants placent la naissance entre 6 et 4 av. J.-C. environ, dans les dernières années d’Hérode le Grand, roi de Judée sous l’empereur Auguste ; une minorité, datant la mort d’Hérode de 1 av. J.-C., la place en 3–2 av. J.-C. ; la carte retient 5 av. J.-C. comme repère conventionnel."
    - "Matthieu dit : « Jésus étant né à Bethléhem en Judée, au temps du roi Hérode, voici des mages d’Orient arrivèrent à Jérusalem », et Luc s’ouvre aussi « Du temps d’Hérode, roi de Judée ». Hérode avait pris Jérusalem en 37 av. J.-C. et mourut après une éclipse de lune et avant la Pâque, dit Josèphe ; on date d’ordinaire cet événement de 4 av. J.-C., certains de 1 av. J.-C. La naissance se situe donc avant la mort d’Hérode. Luc ajoute que Jean le Baptiste commença à prêcher la quinzième année de Tibère, 28/29 apr. J.-C., et que Jésus avait alors environ trente ans, ce qui concorde à peu près. L’ère chrétienne elle-même fut fixée des siècles plus tard et plaça la naissance quelques années trop tard."
    - "L’empereur de Rome était Auguste (27 av. J.-C.–14 apr. J.-C.), et la Judée était un royaume client de Rome. À la mort d’Hérode, ses fils se partagèrent le pays : Archélaüs reçut la Judée, et Matthieu dit que Joseph, craignant Archélaüs, s’établit en Galilée, que gouvernait Hérode Antipas. Le recensement de Luc sous Quirinius est une difficulté connue : Josèphe date le recensement de Quirinius de 6 apr. J.-C., quand la Judée devint province romaine, et la façon dont il s’accorde avec le règne d’Hérode est débattue, aussi la carte n’y rattache-t-elle pas la naissance."
  pl:
    - "Jezus urodził się kilka lat przed początkiem ery chrześcijańskiej: większość uczonych umieszcza narodziny między około 6 a 4 p.n.e., w ostatnich latach Heroda Wielkiego, króla Judei za cesarza Augusta; mniejszość, datując śmierć Heroda na 1 p.n.e., umieszcza je w 3–2 p.n.e.; mapa używa 5 p.n.e. jako punktu umownego."
    - "Mateusz mówi: „A gdy się Jezus narodził w Betlehemie Judzkiem za dnia Heroda króla, oto mędrcy ze wschodu słońca przybyli do Jeruzalemu”, a Łukasz też zaczyna „za dni Heroda, króla Judzkiego”. Herod zdobył Jerozolimę w 37 p.n.e. i zmarł po zaćmieniu Księżyca, a przed Paschą, jak mówi Józef Flawiusz; zwykle datuje się to na 4 p.n.e., według niektórych na 1 p.n.e. Narodziny przypadają więc przed śmiercią Heroda. Łukasz dodaje, że Jan Chrzciciel zaczął nauczać w piętnastym roku Tyberiusza, 28/29 n.e., i że Jezus miał wtedy około trzydziestu lat, co z grubsza pasuje. Sama era chrześcijańska została ustalona wieki później i wyznaczyła narodziny o kilka lat za późno."
    - "Cesarzem Rzymu był August (27 p.n.e.–14 n.e.), a Judea była królestwem zależnym od Rzymu. Po śmierci Heroda jego synowie podzielili kraj: Archelaos objął Judeę, a Mateusz mówi, że Józef, bojąc się Archelaosa, osiadł w Galilei, którą rządził Herod Antypas. Spis Kwiryniusza u Łukasza jest znaną trudnością: Józef Flawiusz datuje spis Kwiryniusza na 6 n.e., gdy Judea stała się prowincją rzymską, a to, jak wpisuje się w panowanie Heroda, jest sporne, więc mapa nie wiąże z nim narodzin."
  it:
    - "Gesù nacque alcuni anni prima dell’inizio dell’era cristiana: la maggior parte degli studiosi colloca la nascita tra il 6 e il 4 a.C. circa, negli ultimi anni di Erode il Grande, re di Giudea sotto l’imperatore Augusto; una minoranza, datando la morte di Erode all’1 a.C., la colloca nel 3–2 a.C.; la mappa usa il 5 a.C. come punto convenzionale."
    - "Matteo dice: «Or essendo Gesù nato in Betleem di Giudea, ai dì del re Erode, ecco dei magi d’Oriente arrivarono in Gerusalemme», e anche Luca si apre «Ai dì d’Erode, re della Giudea». Erode aveva preso Gerusalemme nel 37 a.C. e morì dopo un’eclissi di luna e prima della Pasqua, come dice Giuseppe Flavio; di solito si data al 4 a.C., da alcuni all’1 a.C. La nascita cade dunque prima della morte di Erode. Luca aggiunge che Giovanni Battista cominciò a predicare nel quindicesimo anno di Tiberio, 28/29 d.C., e che Gesù aveva allora circa trent’anni, il che concorda all’incirca. L’era cristiana stessa fu fissata secoli dopo e pose la nascita alcuni anni troppo tardi."
    - "L’imperatore di Roma era Augusto (27 a.C.–14 d.C.), e la Giudea era un regno cliente di Roma. Dopo la morte di Erode i suoi figli si divisero il territorio: Archelao ebbe la Giudea, e Matteo dice che Giuseppe, temendo Archelao, si stabilì in Galilea, governata da Erode Antipa. Il censimento di Quirinio in Luca è una difficoltà nota: Giuseppe Flavio data il censimento di Quirinio al 6 d.C., quando la Giudea divenne provincia romana, e come ciò si accordi con il regno di Erode è discusso, perciò la mappa non vi lega la nascita."
  nl:
    - "Jezus werd enkele jaren vóór het begin van onze jaartelling geboren: de meeste geleerden plaatsen de geboorte tussen ongeveer 6 en 4 v.Chr., in de laatste jaren van Herodes de Grote, koning van Judea onder keizer Augustus; een minderheid, die de dood van Herodes in 1 v.Chr. dateert, plaatst haar in 3–2 v.Chr.; de kaart gebruikt 5 v.Chr. als conventioneel punt."
    - "Mattheüs zegt: “Toen nu Jezus geboren was te Bethlehem, gelegen in Judea, in de dagen van den koning Herodes, ziet, enige wijzen van het Oosten zijn te Jeruzalem aangekomen”, en ook Lukas opent “in de dagen van Herodes, den koning van Judea”. Herodes had Jeruzalem in 37 v.Chr. ingenomen en stierf na een maansverduistering en vóór Pesach, zoals Josephus zegt; dit wordt gewoonlijk op 4 v.Chr. gedateerd, door sommigen op 1 v.Chr. De geboorte valt dus vóór de dood van Herodes. Lukas voegt eraan toe dat Johannes de Doper begon te prediken in het vijftiende jaar van Tiberius, 28/29 n.Chr., en dat Jezus toen ongeveer dertig jaar oud was, wat ruwweg past. De christelijke jaartelling zelf werd eeuwen later vastgesteld en plaatste de geboorte enkele jaren te laat."
    - "De keizer van Rome was Augustus (27 v.Chr.–14 n.Chr.), en Judea was een vazalkoninkrijk van Rome. Na de dood van Herodes verdeelden zijn zonen het land: Archelaüs kreeg Judea, en Mattheüs zegt dat Jozef, bevreesd voor Archelaüs, zich in Galilea vestigde, dat door Herodes Antipas werd bestuurd. Lukas’ volkstelling onder Quirinius is een bekend probleem: Josephus dateert de volkstelling van Quirinius in 6 n.Chr., toen Judea een Romeinse provincie werd, en hoe dit past bij de regering van Herodes wordt besproken, dus de kaart verbindt de geboorte er niet mee."
  cs:
    - "Ježíš se narodil několik let před počátkem křesťanského letopočtu: většina badatelů klade narození mezi asi 6 a 4 př. n. l., do posledních let Heroda Velikého, krále Judska za císaře Augusta; menšina, která datuje Herodovu smrt do roku 1 př. n. l., je klade do 3–2 př. n. l.; mapa užívá jako smluvní bod rok 5 př. n. l."
    - "Matouš praví: „Když se pak narodil Ježíš v Betlémě Judově, za dnů Herodesa krále, aj, mudrci od východu slunce přijeli do Jeruzaléma“ a také Lukáš začíná „za dnů Herodesa krále Judského“. Herodes dobyl Jeruzalém roku 37 př. n. l. a zemřel po zatmění měsíce a před Pesachem, jak říká Josephus Flavius; to se obvykle datuje do roku 4 př. n. l., někteří do roku 1 př. n. l. Narození tedy spadá před Herodovu smrt. Lukáš dodává, že Jan Křtitel začal kázat v patnáctém roce Tiberiově, 28/29 n. l., a že Ježíšovi bylo tehdy asi třicet let, což zhruba odpovídá. Samotný křesťanský letopočet byl stanoven o staletí později a klade narození o několik let příliš pozdě."
    - "Římským císařem byl Augustus (27 př. n. l.–14 n. l.) a Judsko bylo klientským královstvím Říma. Po Herodově smrti synové rozdělili zemi: Archelaos dostal Judsko a Matouš praví, že Josef, bojící se Archelaa, se usadil v Galileji, kterou vládl Herodes Antipas. Lukášovo sčítání za Quiriniuse je známou obtíží: Josephus Flavius datuje Quiriniovo sčítání do roku 6 n. l., kdy se Judsko stalo římskou provincií, a jak to zapadá do vlády Herodovy, se diskutuje, takže mapa narození s ním nespojuje."
  sv:
    - "Jesus föddes några år före den kristna tideräkningens början: de flesta forskare förlägger födelsen till mellan omkring 6 och 4 f.Kr., under de sista åren av Herodes den store, kung av Judeen under kejsar Augustus; en minoritet, som daterar Herodes död till 1 f.Kr., förlägger den till 3–2 f.Kr.; kartan använder 5 f.Kr. som en konventionell punkt."
    - "Matteus säger: ”När nu Jesus var född i Betlehem i Judeen, på konung Herodes’ tid, då kommo vise män från österns länder till Jerusalem”, och Lukas inleder också ”på den tid då Herodes var konung över Judeen”. Herodes hade intagit Jerusalem 37 f.Kr. och dog efter en månförmörkelse och före påsk, som Josefus säger; detta dateras vanligen till 4 f.Kr., av somliga till 1 f.Kr. Födelsen infaller därför före Herodes död. Lukas tillägger att Johannes Döparen började predika i Tiberius femtonde år, 28/29 e.Kr., och att Jesus då var omkring trettio år gammal, vilket ungefär stämmer. Den kristna tideräkningen fastställdes först flera århundraden senare och satte födelsen några år för sent."
    - "Roms kejsare var Augustus (27 f.Kr.–14 e.Kr.), och Judeen var ett klientkungarike under Rom. Efter Herodes död delade hans söner landet: Archelaos tog Judeen, och Matteus säger att Josef, rädd för Archelaos, bosatte sig i Galileen, som Herodes Antipas styrde. Lukas skattskrivning under Quirinius är en känd svårighet: Josefus daterar Quirinius skattskrivning till 6 e.Kr., då Judeen blev romersk provins, och hur detta passar med Herodes regeringstid är omdiskuterat, så kartan knyter inte födelsen till den."
  nb:
    - "Jesus ble født noen år før begynnelsen av den kristne tidsregningen: de fleste forskere plasserer fødselen mellom omkring 6 og 4 f.Kr., i de siste årene av Herodes den store, konge av Judea under keiser Augustus; et mindretall, som daterer Herodes' død til 1 f.Kr., plasserer den i 3–2 f.Kr.; kartet bruker 5 f.Kr. som et konvensjonelt punkt."
    - "Matteus sier: «Da Jesus var født i Betlehem i Judea, i kong Herodes' dager, se, da kom nogen vismenn fra Østerland til Jerusalem», og Lukas åpner også «I de dager da Herodes var konge i Jødeland». Herodes hadde inntatt Jerusalem i 37 f.Kr. og døde etter en måneformørkelse og før påske, slik Josefus sier; dette dateres vanligvis til 4 f.Kr., av noen til 1 f.Kr. Fødselen faller derfor før Herodes' død. Lukas tilføyer at døperen Johannes begynte å forkynne i Tiberius' femtende år, 28/29 e.Kr., og at Jesus da var omkring tretti år gammel, noe som omtrent stemmer. Selve den kristne tidsregningen ble fastsatt århundrer senere og satte fødselen noen år for sent."
    - "Roms keiser var Augustus (27 f.Kr.–14 e.Kr.), og Judea var et klientrike under Roma. Etter Herodes' død delte sønnene landet: Arkelaus fikk Judea, og Matteus sier at Josef, redd for Arkelaus, slo seg ned i Galilea, som Herodes Antipas styrte. Lukas' folketelling under Kvirinius er en kjent vanskelighet: Josefus daterer Kvirinius' folketelling til 6 e.Kr., da Judea ble romersk provins, og hvordan dette passer med Herodes' regjeringstid, er omdiskutert, så kartet knytter ikke fødselen til den."
  tl:
    - "Ipinanganak si Jesus ilang taon bago ang simula ng panahong Kristiyano: itinatakda ng karamihan ng iskolar ang kapanganakan sa pagitan ng mga 6 at 4 BK, sa mga huling taon ni Herodes na Dakila, hari ng Judea sa ilalim ni Emperador Augusto; ang isang minorya, na nagtatakda ng kamatayan ni Herodes sa 1 BK, ay naglalagay nito sa 3–2 BK; ginagamit ng mapa ang 5 BK bilang kombensiyonal na punto."
    - "Sinasabi ni Mateo: “Nang ipanganak nga si Jesus sa Bet-lehem ng Judea sa mga kaarawan ng haring si Herodes, narito, ang mga Pantas na lalake ay nagsidating sa Jerusalem”, at nagsisimula rin si Lucas “nang mga araw ni Herodes, hari sa Judea”. Kinuha ni Herodes ang Jerusalem noong 37 BK at namatay pagkatapos ng eklipse ng buwan at bago ang Paskua, ayon kay Josephus; karaniwang itinatakda ito sa 4 BK, at ng ilan sa 1 BK. Kaya bago mamatay si Herodes ang kapanganakan. Idinaragdag ni Lucas na nagsimulang mangaral si Juan Bautista sa ikalabinlimang taon ni Tiberio, 28/29 AD, at mga tatlumpung taong gulang noon si Jesus, na humigit-kumulang ay tumutugma. Itinakda ang panahong Kristiyano mismo makalipas ang mga siglo at inilagay ang kapanganakan nang ilang taong huli."
    - "Ang emperador ng Roma ay si Augusto (27 BK–14 AD), at ang Judea ay kahariang kliyente ng Roma. Pagkamatay ni Herodes, hinati ng kaniyang mga anak ang lupain: kinuha ni Arquelao ang Judea, at sinasabi ni Mateo na si Jose, na natakot kay Arquelao, ay tumira sa Galilea, na pinamunuan ni Herodes Antipas. Kilalang suliranin ang sensus ni Lucas sa ilalim ni Quirinio: itinatakda ni Josephus ang sensus ni Quirinio sa 6 AD, nang maging lalawigang Romano ang Judea, at pinagtatalunan kung paano ito umaangkop sa paghahari ni Herodes, kaya hindi iniuugnay ng mapa ang kapanganakan dito."
  da:
    - "Jesus blev født nogle år før begyndelsen af den kristne tidsregning: de fleste forskere placerer fødslen mellem omkring 6 og 4 f.Kr., i de sidste år af Herodes den Store, konge af Judæa under kejser Augustus; et mindretal, der dater Herodes' død til 1 f.Kr., placerer den i 3–2 f.Kr.; kortet bruger 5 f.Kr. som et konventionelt punkt."
    - "Mattæus siger: »Men da Jesus var født i Bethlehem i Judæa, i Kong Herodes's Dage, se, da kom der vise fra Østerland til Jerusalem«, og Lukas åbner ligeledes: »I de Dage, da Herodes var Konge i Judæa«. Herodes havde indtaget Jerusalem i 37 f.Kr. og døde efter en måneformørkelse og før påske, som Josefus siger; det dateres sædvanligvis til 4 f.Kr., af nogle til 1 f.Kr. Fødslen falder derfor før Herodes' død. Lukas tilføjer, at Johannes Døberen begyndte at prædike i Tiberius' femtende år, 28/29 e.Kr., og at Jesus da var omkring tredive år gammel, hvilket nogenlunde passer. Selve den kristne tidsregning blev fastlagt århundreder senere og satte fødslen nogle år for sent."
    - "Roms kejser var Augustus (27 f.Kr.–14 e.Kr.), og Judæa var et klientkongerige under Rom. Efter Herodes' død delte hans sønner landet: Arkelaus fik Judæa, og Mattæus siger, at Josef, bange for Arkelaus, bosatte sig i Galilæa, som Herodes Antipas herskede over. Lukas' folketælling under Kvirinius er en kendt vanskelighed: Josefus dater Kvirinius' folketælling til 6 e.Kr., da Judæa blev romersk provins, og hvordan det passer med Herodes' regering, er omdiskuteret, så kortet knytter ikke fødslen til den."
  sr:
    - "Исус је рођен неколико година пре почетка хришћанске ере: већина научника смешта рођење између око 6. и 4. п. н. е., у последње године Ирода Великог, краља Јудеје под царем Августом; мањина, која Иродову смрт датира у 1. п. н. е., смешта га у 3–2. п. н. е.; карта користи 5. п. н. е. као условну тачку."
    - "Матеј каже: „А кад се роди Исус у Витлејему јудејском, за времена цара Ирода, а то дођу мудраци с истока у Јерусалим“, а и Лука почиње: „У време Ирода цара јудејског“. Ирод је заузео Јерусалим 37. п. н. е. и умро после помрачења Месеца а пре Пасхе, како каже Јосиф Флавије; то се обично датира у 4. п. н. е., а неки у 1. п. н. е. Рођење дакле пада пре Иродове смрти. Лука додаје да је Јован Крститељ почео да проповеда у петнаестој години Тиверија, 28/29. н. е., и да је Исус тада имао око тридесет година, што отприлике одговара. Сама хришћанска ера утврђена је вековима касније и поставила је рођење неколико година прекасно."
    - "Римски цар био је Август (27. п. н. е.–14. н. е.), а Јудеја је била клијентско краљевство Рима. После Иродове смрти његови синови поделили су земљу: Архелај је узео Јудеју, а Матеј каже да се Јосиф, уплашен од Архелаја, настанио у Галилеји, којом је владао Ирод Антипа. Лукин попис под Кирином познат је проблем: Јосиф Флавије датира Киринов попис у 6. н. е., кад је Јудеја постала римска провинција, а како се то слаже с владавином Ирода, расправља се, па карта рођење не веже за њега."
  hu:
    - "Jézus néhány évvel a keresztény időszámítás kezdete előtt született: a legtöbb kutató a születést Kr. e. 6 és 4 közé teszi, vagyis Nagy Heródesnek, az Augusztus császár alatti júdeai királynak az utolsó éveire; egy kisebbség, amely Heródes halálát Kr. e. 1-re keltezi, Kr. e. 3–2-re teszi; a térkép megállapodás szerint Kr. e. 5-öt használ."
    - "Máté ezt mondja: „A mikor pedig megszületik vala Jézus a júdeai Bethlehemben, Heródes király idejében, ímé napkeletről bölcsek jövének Jeruzsálembe”, Lukács pedig szintén így kezdi: „Heródesnek, a Júdea királyának idejében”. Heródes Kr. e. 37-ben foglalta el Jeruzsálemet, és Josephus szerint holdfogyatkozás után és a páska előtt halt meg; ezt általában Kr. e. 4-re keltezik, egyesek Kr. e. 1-re. A születés tehát Heródes halála előtt van. Lukács hozzáteszi, hogy Keresztelő János Tiberius tizenötödik évében, Kr. u. 28/29-ben kezdett prédikálni, és hogy Jézus ekkor mintegy harmincéves volt, ami nagyjából egyezik. Magát a keresztény időszámítást évszázadokkal később állapították meg, és a születést néhány évvel túl későre tette."
    - "Róma császára Augusztus volt (Kr. e. 27–Kr. u. 14), Júdea pedig Róma hűbéres királysága. Heródes halála után fiai felosztották a földet: Arkhelaosz kapta Júdeát, és Máté szerint József, aki félt Arkhelaosztól, Galileában telepedett le, amelyet Heródes Antipász uralt. Lukács Cirénius alatti összeírása ismert nehézség: Josephus Cirénius összeírását Kr. u. 6-ra teszi, amikor Júdea római provincia lett, és hogy ez hogyan illik Heródes uralkodásához, vitatott, ezért a térkép nem köti hozzá a születést."
  fi:
    - "Jeesus syntyi muutamia vuosia ennen kristillisen ajanlaskun alkua: useimmat tutkijat sijoittavat syntymän vuosien noin 6 ja 4 eaa. välille, Herodes Suuren, Juudean kuninkaan, viimeisille vuosille keisari Augustuksen aikana; vähemmistö, joka ajoittaa Herodeksen kuoleman vuoteen 1 eaa., sijoittaa sen vuosiin 3–2 eaa.; kartta käyttää sovinnaisena kohtana vuotta 5 eaa."
    - "Matteus sanoo: ”Kun Jeesus oli syntynyt Juudean Beetlehemissä kuningas Herodeksen aikana, niin katso, tietäjiä tuli itäisiltä mailta Jerusalemiin”, ja Luukaskin aloittaa ”Herodeksen, Juudean kuninkaan, aikana”. Herodes oli valloittanut Jerusalemin vuonna 37 eaa. ja kuoli kuunpimennyksen jälkeen ja ennen pääsiäistä, kuten Josephus sanoo; tämä ajoitetaan yleensä vuoteen 4 eaa., joidenkin mukaan vuoteen 1 eaa. Syntymä sijoittuu siis ennen Herodeksen kuolemaa. Luukas lisää, että Johannes Kastaja aloitti saarnaamisen Tiberiuksen viidentenätoista vuotena, 28/29 jaa., ja että Jeesus oli silloin noin kolmenkymmenen vuoden ikäinen, mikä sopii likimain. Kristillinen ajanlasku itse vahvistettiin vuosisatoja myöhemmin ja asetti syntymän muutaman vuoden liian myöhäiseksi."
    - "Rooman keisari oli Augustus (27 eaa.–14 jaa.), ja Juudea oli Rooman vasallivaltio. Herodeksen kuoltua hänen poikansa jakoivat maan: Arkelaus sai Juudean, ja Matteuksen mukaan Joosef, peläten Arkelausta, asettui Galileaan, jota Herodes Antipas hallitsi. Luukkaan Quiriniuksen aikainen väestönlaskenta on tunnettu vaikeus: Josephus ajoittaa Quiriniuksen väestönlaskennan vuoteen 6 jaa., jolloin Juudeasta tuli Rooman provinssi, ja se, miten tämä sopii Herodeksen hallituskauteen, on kiistanalaista, joten kartta ei sido syntymää siihen."
  vi:
    - "Giê-su sinh vài năm trước khi kỷ nguyên Cơ Đốc bắt đầu: đa số học giả đặt năm sinh vào khoảng giữa năm 6 và 4 TCN, trong những năm cuối của Hê-rốt Đại đế, vua Giu-đê dưới quyền hoàng đế Au-gút-tơ; một thiểu số, định niên đại cái chết của Hê-rốt vào năm 1 TCN, đặt vào năm 3–2 TCN; bản đồ dùng năm 5 TCN làm mốc quy ước."
    - "Ma-thi-ơ nói: “Khi Đức Chúa Jêsus đã sanh tại thành Bết-lê-hem, xứ Giu-đê, đang đời vua Hê-rốt, có mấy thầy bác sĩ ở đông phương đến thành Giê-ru-sa-lem”, và Lu-ca cũng mở đầu “trong đời Hê-rốt, vua nước Giu-đê”. Hê-rốt chiếm Giê-ru-sa-lem năm 37 TCN và chết sau một lần nguyệt thực và trước lễ Vượt qua, như Giô-sê-phu nói; điều này thường được xác định vào năm 4 TCN, có người cho là năm 1 TCN. Vì vậy ngày sinh rơi vào trước khi Hê-rốt chết. Lu-ca thêm rằng Giăng Báp-tít bắt đầu rao giảng vào năm thứ mười lăm đời Ti-be-rơ, năm 28/29, và lúc đó Giê-su khoảng ba mươi tuổi, điều này tương hợp đại thể. Chính kỷ nguyên Cơ Đốc được ấn định nhiều thế kỷ sau và đặt năm sinh muộn hơn vài năm."
    - "Hoàng đế Rô-ma là Au-gút-tơ (27 TCN–năm 14), và Giu-đê là một vương quốc chư hầu của Rô-ma. Sau cái chết của Hê-rốt, các con trai ông chia nhau xứ: A-chê-la-u nhận Giu-đê, và Ma-thi-ơ nói Giô-sép, sợ A-chê-la-u, định cư ở Ga-li-lê, do Hê-rốt An-ti-ba cai trị. Cuộc kiểm tra dân số dưới thời Qui-ri-ni-u trong Lu-ca là một khó khăn đã biết: Giô-sê-phu xác định cuộc kiểm tra dân số của Qui-ri-ni-u vào năm 6, khi Judea trở thành tỉnh La Mã, và việc điều này khớp với triều Hê-rốt thế nào còn tranh luận, nên bản đồ không gắn ngày sinh với nó."
  ro:
    - "Isus s-a născut cu câțiva ani înainte de începutul erei creștine: cei mai mulți cercetători așază nașterea între circa 6 și 4 î.Hr., în ultimii ani ai lui Irod cel Mare, regele Iudeei sub împăratul Augustus; o minoritate, care datează moartea lui Irod în 1 î.Hr., o pune în 3–2 î.Hr.; harta folosește 5 î.Hr. ca punct convențional."
    - "Matei spune: „Iar dacă s’au născut Iisus în Vitleemul Iudeei, în zilele lui Irod împăratul, iată Maghii dela răsărit au venit în Ierusalim”, iar Luca începe și el „în zilele lui Irod, împăratul Iudeei”. Irod luase Ierusalimul în 37 î.Hr. și a murit după o eclipsă de lună și înainte de Paști, după Iosif Flaviu; aceasta se datează de obicei în 4 î.Hr., de unii în 1 î.Hr. Nașterea cade deci înainte de moartea lui Irod. Luca adaugă că Ioan Botezătorul a început să propovăduiască în anul al cincisprezecelea al lui Tiberiu, 28/29 d.Hr., și că Isus avea atunci circa treizeci de ani, ceea ce se potrivește aproximativ. Era creștină a fost fixată abia după secole și a așezat nașterea cu câțiva ani prea târziu."
    - "Împăratul Romei era Augustus (27 î.Hr.–14 d.Hr.), iar Iudeea era un regat clientelar al Romei. După moartea lui Irod, fiii lui au împărțit țara: Arhelau a luat Iudeea, iar Matei spune că Iosif, temându-se de Arhelau, s-a așezat în Galileea, pe care o conducea Irod Antipa. Recensământul lui Quirinius din Luca este o dificultate cunoscută: Iosif Flaviu datează recensământul lui Quirinius în 6 d.Hr., când Iudeea a devenit provincie romană, iar potrivirea lui cu domnia lui Irod este disputată, de aceea harta nu leagă nașterea de el."
  bg:
    - "Исус е роден няколко години преди началото на християнската ера: повечето учени поставят раждането между около 6 и 4 г. пр.н.е., в последните години на Ирод Велики, цар на Юдея при император Август; малцинство, което датира смъртта на Ирод през 1 г. пр.н.е., го поставя през 3–2 г. пр.н.е.; картата използва 5 г. пр.н.е. като условна точка."
    - "Матей казва: „когато се роди Исус във Витлеем Юдейски в дните на цар Ирода, ето мъдреци от изток пристигнаха в Иерусалим“, а Лука също започва „В дните на Ирода царя Юдейскаго“. Ирод превзел Йерусалим през 37 г. пр.н.е. и умрял след лунно затъмнение и преди Пасха, както казва Йосиф Флавий; това обикновено се датира през 4 г. пр.н.е., а от някои — през 1 г. пр.н.е. Следователно раждането е преди смъртта на Ирод. Лука добавя, че Йоан Кръстител започнал да проповядва в петнадесетата година на Тиберий, 28/29 г. н.е., и че тогава Исус бил на около тридесет години, което горе-долу съвпада. Самата християнска ера била установена векове по-късно и поставила раждането няколко години твърде късно."
    - "Император на Рим бил Август (27 г. пр.н.е. – 14 г. н.е.), а Юдея била зависимо от Рим царство. След смъртта на Ирод синовете му разделили земята: Архелай взел Юдея, а Матей казва, че Йосиф, уплашен от Архелай, се заселил в Галилея, управлявана от Ирод Антипа. Преброяването при Квириний, за което говори Лука, е известна трудност: Йосиф Флавий датира преброяването на Квириний през 6 г. н.е., когато Юдея станала римска провинция, и как това се съгласува с царуването на Ирод, е спорно, затова картата не свързва раждането с него."
