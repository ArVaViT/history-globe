id: where-was-derbe
question:
  en: "Where was Derbe?"
  ru: "Где находилась Дервия?"
  uk: "Де була Дервія?"
  es: "¿Dónde estaba Derbe?"
  pt: "Onde ficava Derbe?"
  de: "Wo lag Derbe?"
  fr: "Où se trouvait Derbe ?"
  pl: "Gdzie leżała Derbe?"
  it: "Dov’era Derbe?"
  nl: "Waar lag Derbe?"
  cs: "Kde byla Derbe?"
  sv: "Var låg Derbe?"
answer:
  en:
    - "Derbe lay in south-eastern Lycaonia, on the plain of central Turkey, at or very near the mound of Kerti Hüyük about 22 km north-east of Karaman, ancient Laranda; the map point stands on the mound. It is about 95 km east-south-east of Lystra and 96 km south-east of Konya, ancient Iconium, in a straight line, and about 645 km from Jerusalem. Older scholars, following William Ramsay, put Derbe at Gudelisin farther west; in 1956 Michael Ballance found at Kerti Hüyük a dedication of AD 157 by “the council and people of Derbe”, but after a bishop of Derbe's tombstone turned up at Devri Şehri, about 4 km away, he proposed that site instead, so the exact spot is not fully settled."
    - "Derbe was the farthest point of Paul's first journey. Stoned at Lystra, Paul “rose up, and came into the city: and the next day he departed with Barnabas to Derbe. And when they had preached the gospel to that city, and had taught many, they returned again to Lystra, and to Iconium, and Antioch”. From Derbe the road ran on east through the Taurus by the Cilician Gates to Tarsus, Paul's home town, about 145 km away in a straight line, the short way back to Syria; instead they turned round and went back through the towns that had driven them out, to strengthen the new churches."
    - "Acts tells of no trouble at Derbe, and when Paul later lists his persecutions “at Antioch, at Iconium, at Lystra”, Derbe is missing. He came back on his second journey, and among the men who went with him to Asia was “Gaius of Derbe”. In the first century BC the town had been the seat of Antipater of Derbe, a friend of Cicero, until Amyntas of Galatia killed him; after 25 BC it belonged to the Roman province of Galatia and later called itself Claudio-Derbe on its coins."
  ru:
    - "Дервия лежала на юго-востоке Ликаонии, на равнине в центре Турции, на холме Керти-Хююк примерно в 22 км к северо-востоку от Карамана, древней Ларанды, или совсем рядом с ним; точка карты стоит на холме. Отсюда примерно 95 км до Листры к западу-северо-западу и 96 км до Коньи, древней Иконии, к северо-западу по прямой, а до Иерусалима около 645 км. Прежние учёные вслед за Уильямом Рамзаем помещали Дервию западнее, у Гюделисина; в 1956 г. Майкл Балланс нашёл на Керти-Хююке посвящение 157 г. от «совета и народа Дервии», но, когда в Деври-Шехри, примерно в 4 км оттуда, нашлось надгробие епископа Дервии, предложил это место, так что точное место ещё не вполне установлено."
    - "Дервия была самой дальней точкой первого путешествия Павла. Побитый камнями в Листре, Павел «встал и пошел в город, а на другой день удалился с Варнавою в Дервию. Проповедав Евангелие сему городу и приобретя довольно учеников, они обратно проходили Листру, Иконию и Антиохию». От Дервии дорога шла дальше на восток через Тавр, Киликийскими воротами, к Тарсу, родному городу Павла, примерно в 145 км по прямой, — короткий путь назад в Сирию; но они повернули и пошли обратно через города, которые их изгнали, чтобы укрепить новые церкви."
    - "Деяния не говорят ни о каких гонениях в Дервии, и когда Павел позже перечисляет гонения, постигшие его «в Антиохии, Иконии, Листрах», Дервии в этом списке нет. Он вернулся сюда во втором путешествии, а среди спутников, шедших с ним в Асию, был Гаий из Дервии. В I веке до н. э. городом владел Антипатр Дервийский, друг Цицерона, пока его не убил Аминта Галатский; после 25 г. до н. э. Дервия вошла в римскую провинцию Галатию и позже называла себя на монетах Клавдио-Дервией."
  uk:
    - "Дервія лежала на південному сході Лікаонії, на рівнині центральної Туреччини, на пагорбі Керті-Хююк або дуже близько до нього, приблизно за 22 км на північний схід від Карамана, давньої Лоранди; точка мапи стоїть на пагорбі. Вона лежить приблизно за 95 км на схід-південний схід від Лістри і за 96 км на південний схід від Коні, давньої Іконії, по прямій, і приблизно за 645 км від Єрусалиму. Старіші вчені, за Вільямом Рамсеєм, ставили Дервію в Гуделісіні далі на захід; 1956 р. Майкл Баленс знайшов у Керті-Хююку присвяту 157 р. н. е. від «ради і народу Дервії», але після того як у Деврі-Шехрі, приблизно за 4 км, з'явилася надгробна плита єпископа Дервії, він запропонував натомість те місце, тож точне місце не цілком вирішене."
    - "Дервія була найдальшою точкою першої подорожі Павла. Побитий камінням у Лістрі, Павло «уставши ввійшов у город, а назавтра вийшов з Варнавою в Дервию». «І благовіствувавши городу сьому, і навчивши многих, вернулись вони в Листру, і Іконию, і Антиохию». Від Дервії дорога йшла далі на схід крізь Тавр через Кілікійські ворота до Тарса, рідного міста Павла, приблизно за 145 км по прямій, коротким шляхом назад до Сирії; натомість вони повернули й пішли назад через міста, що їх прогнали, щоб зміцнити нові церкви."
    - "Дії не розповідають про жодні неприємності в Дервії, і коли Павло пізніше перелічує свої переслідування «в Антиохиї, в Ікониї, в Листрі», Дервії немає. Він повернувся під час другої подорожі, а серед людей, що пішли з ним до Азії, був «Гай Дервянин». У I ст. до н. е. місто було резиденцією Антипатра з Дервії, друга Цицерона, доки Аминта Галатійський не вбив його; після 25 р. до н. е. воно належало римській провінції Галатія і пізніше називало себе на монетах Клавдіо-Дервією."
  es:
    - "Derbe se hallaba en el sureste de Licaonia, en la llanura del centro de Turquía, en el tell de Kerti Hüyük o muy cerca de él, a unos 22 km al noreste de Karaman, la antigua Laranda; el punto del mapa está sobre el tell. Queda a unos 95 km al este-sureste de Listra y a 96 km al sureste de Konya, la antigua Iconio, en línea recta, y a unos 645 km de Jerusalén. Los estudiosos más antiguos, siguiendo a William Ramsay, situaban Derbe en Gudelisin, más al oeste; en 1956 Michael Ballance halló en Kerti Hüyük una dedicatoria del 157 d. C. de «el consejo y el pueblo de Derbe», pero después de que apareciera en Devri Şehri, a unos 4 km, la lápida de un obispo de Derbe, propuso en cambio ese sitio, de modo que el sitio exacto no está del todo zanjado."
    - "Derbe fue el punto más lejano del primer viaje de Pablo. Apedreado en Listra, Pablo «se levantó y entró en la ciudad; y un día después, partió con Bernabé á Derbe. Y como hubieron anunciado el evangelio á aquella ciudad, y enseñado á muchos, volvieron á Listra, y á Iconio, y á Antioquía». Desde Derbe el camino seguía hacia el este por el Tauro, por las Puertas de Cilicia, hasta Tarso, la ciudad natal de Pablo, a unos 145 km en línea recta, el camino corto de regreso a Siria; en cambio dieron la vuelta y regresaron por las ciudades que los habían expulsado, para fortalecer a las nuevas iglesias."
    - "Hechos no cuenta ningún problema en Derbe, y cuando Pablo enumera más tarde sus persecuciones «en Antioquía, en Iconio, en Listra», Derbe falta. Volvió en su segundo viaje, y entre los hombres que lo acompañaron hasta Asia estaba «Gayo de Derbe». En el siglo I a. C. la ciudad había sido sede de Antípatro de Derbe, amigo de Cicerón, hasta que Amintas de Galacia lo mató; después del 25 a. C. perteneció a la provincia romana de Galacia y más tarde se llamó a sí misma Claudio-Derbe en sus monedas."
  pt:
    - "Derbe ficava no sudeste da Licaônia, na planície da Turquia central, no montículo de Kerti Hüyük ou muito perto dele, cerca de 22 km a nordeste de Karaman, a antiga Laranda; o ponto do mapa está no montículo. Fica a cerca de 95 km a lés-sudeste de Listra e 96 km a sudeste de Konya, a antiga Icônio, em linha reta, e a cerca de 645 km de Jerusalém. Estudiosos mais antigos, seguindo William Ramsay, puseram Derbe em Gudelisin, mais a oeste; em 1956 Michael Ballance achou em Kerti Hüyük uma dedicatória de 157 d.C. por “o conselho e o povo de Derbe”, mas depois que apareceu em Devri Şehri, a cerca de 4 km, a lápide de um bispo de Derbe, propôs esse local em seu lugar, de modo que o ponto exato não está plenamente assentado."
    - "Derbe foi o ponto mais distante da primeira viagem de Paulo. Apedrejado em Listra, Paulo “se levantou e entrou na cidade. No dia seguinte, ele partiu com Barnabé para Derbe. Depois de pregarem o Evangelho naquela cidade e fazerem muitos discípulos, voltaram para Listra, Icônio e Antioquia”. De Derbe a estrada seguia a leste pelo Touro, pelas Portas da Cilícia, até Tarso, a terra de Paulo, a cerca de 145 km em linha reta, o caminho curto de volta à Síria; em vez disso deram meia-volta e retornaram pelas cidades que os tinham expulsado, para fortalecer as novas igrejas."
    - "Atos não conta nenhum problema em Derbe, e quando Paulo lista mais tarde suas perseguições “em Antioquia, Icônio e Listra”, Derbe falta. Ele voltou na segunda viagem, e entre os homens que o acompanharam até a Ásia estava “Gaio de Derbe”. No século I a.C. a cidade fora a sede de Antípatro de Derbe, amigo de Cícero, até que Amintas da Galácia o matou; depois de 25 a.C. pertenceu à província romana da Galácia e mais tarde se chamou Cláudio-Derbe em suas moedas."
  de:
    - "Derbe lag im südöstlichen Lykaonien, auf der Ebene der Zentraltürkei, bei oder ganz nahe dem Hügel Kerti Hüyük etwa 22 km nordöstlich von Karaman, dem antiken Laranda; der Kartenpunkt liegt auf dem Hügel. Es liegt in der Luftlinie etwa 95 km ostsüdöstlich von Lystra und 96 km südöstlich von Konya, dem antiken Ikonion, und etwa 645 km von Jerusalem. Ältere Gelehrte setzten Derbe nach William Ramsay bei Gudelisin weiter westlich an; 1956 fand Michael Ballance in Kerti Hüyük eine Widmung von 157 n. Chr. von „Rat und Volk von Derbe“, doch nachdem in Devri Şehri, etwa 4 km entfernt, der Grabstein eines Bischofs von Derbe auftauchte, schlug er diese Stätte vor, sodass der genaue Ort nicht ganz geklärt ist."
    - "Derbe war der fernste Punkt der ersten Reise des Paulus. In Lystra gesteinigt, „stand er auf und ging in die Stadt. Und den andern Tag ging er aus mit Barnabas gen Derbe“; „und sie predigten der Stadt das Evangelium und unterwiesen ihrer viele und zogen wieder gen Lystra und Ikonion und Antiochien“. Von Derbe führte die Straße weiter nach Osten durch den Taurus über die Kilikische Pforte nach Tarsus, Pauli Heimatstadt, in der Luftlinie etwa 145 km entfernt, der kurze Weg zurück nach Syrien; stattdessen kehrten sie um und gingen durch die Städte zurück, die sie vertrieben hatten, um die neuen Gemeinden zu stärken."
    - "Die Apostelgeschichte erzählt von keinem Ärger in Derbe, und wenn Paulus später seine Verfolgungen aufzählt, „zu Antiochien, zu Ikonien, zu Lystra“, fehlt Derbe. Er kam auf seiner zweiten Reise wieder, und unter den Männern, die mit ihm nach Asien zogen, war „Gajus von Derbe“. Im 1. Jahrhundert v. Chr. war die Stadt Sitz des Antipater von Derbe, eines Freundes Ciceros, bis Amyntas von Galatien ihn tötete; nach 25 v. Chr. gehörte sie zur römischen Provinz Galatien und nannte sich später auf ihren Münzen Claudio-Derbe."
  fr:
    - "Derbe se trouvait dans le sud-est de la Lycaonie, sur la plaine du centre de la Turquie, sur ou tout près du tertre de Kerti Hüyük, à environ 22 km au nord-est de Karaman, l’antique Laranda ; le point de la carte est sur le tertre. Il est à environ 95 km à l’est-sud-est de Lystre et à 96 km au sud-est de Konya, l’antique Icone, en ligne droite, et à environ 645 km de Jérusalem. Les anciens savants, à la suite de William Ramsay, plaçaient Derbe à Gudelisin, plus à l’ouest ; en 1956, Michael Ballance trouva à Kerti Hüyük une dédicace de 157 apr. J.-C. par « le conseil et le peuple de Derbe », mais après qu’une pierre tombale d’un évêque de Derbe eut surgi à Devri Şehri, à environ 4 km, il proposa plutôt ce site, de sorte que l’endroit exact n’est pas entièrement fixé."
    - "Derbe fut le point le plus éloigné du premier voyage de Paul. Lapidé à Lystre, Paul « se leva, et entra dans la ville. Le lendemain, il partit pour Derbe avec Barnabas. Quand ils eurent évangélisé cette ville et fait un certain nombre de disciples, ils retournèrent à Lystre, à Icone et à Antioche ». De Derbe, la route continuait vers l’est à travers le Taurus par les Portes ciliciennes jusqu’à Tarse, ville natale de Paul, à environ 145 km en ligne droite, chemin court pour revenir en Syrie ; ils firent demi-tour et repassèrent par les villes qui les avaient chassés, pour affermir les nouvelles Églises."
    - "Les Actes ne racontent aucun trouble à Derbe, et quand Paul énumère plus tard ses persécutions « à Antioche, à Icone, à Lystre », Derbe manque. Il y revint lors de son deuxième voyage, et parmi les hommes qui l’accompagnèrent en Asie figurait « Gaïus de Derbe ». Au Ier siècle av. J.-C., la ville avait été le siège d’Antipater de Derbe, ami de Cicéron, jusqu’à ce qu’Amyntas de Galatie le tue ; après 25 av. J.-C., elle appartint à la province romaine de Galatie et se nomma plus tard Claudio-Derbe sur ses monnaies."
  pl:
    - "Derbe leżała w południowo-wschodniej Likaonii, na równinie środkowej Turcji, w pobliżu kopca Kerti Hüyük lub na nim, około 22 km na północny wschód od Karaman, starożytnej Laranda; punkt na mapie stoi na kopcu. Jest około 95 km na wschód-południowy wschód od Listry i 96 km na południowy wschód od Konyi, starożytnego Ikonium, w linii prostej, i około 645 km od Jerozolimy. Starsi uczeni, idąc za Williamem Ramsayem, umieszczali Derbe w Gudelisin dalej na zachód; w 1956 Michael Ballance znalazł w Kerti Hüyük dedykację z 157 n.e. od „rady i ludu Derbe”, lecz po tym, jak nagrobek biskupa Derbe wyszedł na jaw w Devri Şehri, około 4 km dalej, zaproponował to miejsce, więc dokładne położenie nie jest całkiem ustalone."
    - "Derbe było najdalszym punktem pierwszej podróży Pawła. Ukamienowany w Listrze, Paweł „wstawszy wszedł do miasta, a nazajutrz odszedł z Barnabaszem do Derby. A opowiedziawszy Ewangieliję onemu miastu i wiele uczniów pozyskawszy, wrócili się do Listry, do Ikonii, i do Antyjochyi”. Z Derbe droga biegła dalej na wschód przez Taurus Bramami Cylicyjskimi do Tarsu, rodzinnego miasta Pawła, około 145 km w linii prostej, krótką drogą z powrotem do Syrii; zamiast tego zawrócili i wrócili przez miasta, które ich wypędziły, by umocnić nowe Kościoły."
    - "Dzieje nie opowiadają o żadnych kłopotach w Derbe, a gdy Paweł później wylicza swoje prześladowania „w Antyjochii, w Ikonii i w Listrze”, Derbe brakuje. Wrócił w drugiej podróży, a wśród ludzi, którzy z nim poszli do Azji, był „Gajus Derbejczyk”. W I wieku p.n.e. miasto było siedzibą Antypatra z Derbe, przyjaciela Cycerona, aż Amyntas z Galacji go zabił; po 25 p.n.e. należało do rzymskiej prowincji Galacji, a później nazywało się na monetach Klaudio-Derbe."
  it:
    - "Derbe sorgeva nella Licaonia sud-orientale, sulla pianura della Turchia centrale, al tumulo di Kerti Hüyük o molto vicino, circa 22 km a nord-est di Karaman, l’antica Laranda; il punto della mappa sta sul tumulo. Dista circa 95 km a est-sud-est da Listra e 96 km a sud-est da Konya, l’antica Icònio, in linea retta, e circa 645 km da Gerusalemme. Gli studiosi più vecchi, seguendo William Ramsay, ponevano Derbe a Gudelisin più a ovest; nel 1956 Michael Ballance trovò a Kerti Hüyük una dedica del 157 d.C. da parte del «consiglio e popolo di Derbe», ma dopo che a Devri Şehri, a circa 4 km, comparve la lapide di un vescovo di Derbe, propose invece quel sito, così il luogo esatto non è del tutto fissato."
    - "Derbe fu il punto più lontano del primo viaggio di Paolo. Lapidato a Listra, Paolo «si rialzò, ed entrò nella città; e il giorno seguente, partì con Barnaba per Derba. E avendo evangelizzata quella città e fatti molti discepoli se ne tornarono a Listra, a Iconio ed Antiochia». Da Derbe la strada proseguiva a est attraverso il Tauro per le Porte della Cilicia fino a Tarso, la città di Paolo, a circa 145 km in linea retta, la via breve per tornare in Siria; invece tornarono indietro attraverso le città che li avevano cacciati, per rafforzare le nuove chiese."
    - "Gli Atti non riferiscono guai a Derbe, e quando Paolo elenca poi le sue persecuzioni «ad Antiochia, ad Iconio ed a Listra», Derbe manca. Vi tornò nel secondo viaggio, e tra gli uomini che lo accompagnarono in Asia vi fu «Gaio di Derba». Nel I secolo a.C. la città era stata la sede di Antipatro di Derbe, amico di Cicerone, finché Aminta di Galazia lo uccise; dopo il 25 a.C. appartenne alla provincia romana di Galazia e più tardi si chiamò Claudio-Derbe sulle sue monete."
  nl:
    - "Derbe lag in het zuidoosten van Lykaonië, op de vlakte van Midden-Turkije, op of vlak bij de heuvel Kerti Hüyük, ongeveer 22 km ten noordoosten van Karaman, het oude Laranda; het punt op de kaart staat op de heuvel. Het ligt hemelsbreed ongeveer 95 km oost-zuidoostelijk van Lystra en 96 km zuidoostelijk van Konya, het oude Ikonium, en ongeveer 645 km van Jeruzalem. Oudere geleerden, William Ramsay volgend, plaatsten Derbe bij Gudelisin, verder westelijk; in 1956 vond Michael Ballance bij Kerti Hüyük een wijding uit 157 n.Chr. door “de raad en het volk van Derbe”, maar toen een grafsteen van een bisschop van Derbe opdook bij Devri Şehri, ongeveer 4 km verderop, stelde hij die plaats voor, zodat de exacte plek niet helemaal vaststaat."
    - "Derbe was het verste punt van Paulus’ eerste reis. Gestenigd te Lystra, “stond hij op, en kwam in de stad; en des anderen daags ging hij met Barnabas uit naar Derbe. En als zij derzelve stad het Evangelie verkondigd en vele discipelen gemaakt hadden, keerden zij weder naar Lystre, en Ikonium, en Antiochië”. Vanaf Derbe liep de weg verder naar het oosten door de Taurus via de Cilicische Poort naar Tarsus, de geboortestad van Paulus, hemelsbreed ongeveer 145 km, de korte weg terug naar Syrië; in plaats daarvan keerden zij om en gingen terug door de steden die hen hadden verdreven, om de nieuwe gemeenten te versterken."
    - "Handelingen vertelt van geen moeilijkheden te Derbe, en wanneer Paulus later zijn vervolgingen opsomt “in Antiochië, in Ikonium en in Lystre”, ontbreekt Derbe. Hij kwam er terug op zijn tweede reis, en onder de mannen die hem naar Asia vergezelden was “Gajus van Derbe”. In de eerste eeuw v.Chr. was de stad de zetel van Antipater van Derbe, een vriend van Cicero, tot Amyntas van Galatië hem doodde; na 25 v.Chr. behoorde zij tot de Romeinse provincie Galatië en noemde zich later Claudio-Derbe op haar munten."
  cs:
    - "Derbe ležela v jihovýchodní Lykaonii, na planině středního Turecka, na pahorku Kerti Hüyük nebo velmi blízko něj, asi 22 km severovýchodně od Karamanu, starověké Laranda; bod na mapě stojí na pahorku. Je asi 95 km východojihovýchodně od Lystry a 96 km jihovýchodně od Konye, starověkého Ikonia, vzdušnou čarou, a asi 645 km od Jeruzaléma. Starší badatelé, následující Williama Ramsaye, kladli Derbe na Gudelisin dále na západ; roku 1956 Michael Ballance našel na Kerti Hüyük věnování z roku 157 n. l. od „rady a lidu Derbe“, ale poté, co se u Devri Şehri, asi 4 km odtud, objevil náhrobek derbského biskupa, navrhl místo toto, takže přesné místo není zcela vyřešeno."
    - "Derbe byla nejvzdálenějším bodem Pavlovy první cesty. Ukamenovaný v Lystře „vstal a všel do města, a nazejtří odšel s Barnabášem do Derben. A kázavše evangelium městu tomu, a učedlníků mnoho získavše, navrátili se do Lystry a do Ikonie a do Antiochie“. Z Derbe vedla cesta dál na východ přes Taurus Kilikijskými branami do Tarsu, Pavlova rodného města, asi 145 km vzdušnou čarou, krátkou cestou zpět do Sýrie; místo toho se obrátili a šli zpět městy, která je vyhnala, aby upevnili nové církve."
    - "Skutky nevypráví o žádných potížích v Derbe a když Pavel později vyjmenovává svá pronásledování „v Antiochii, v Ikonii, a v Lystře“, Derbe chybí. Vrátil se na druhé cestě a mezi muži, kteří s ním šli do Asie, byl „Gáius Derbeus“. V 1. století př. n. l. bylo město sídlem Antipatra z Derbe, Ciceronova přítele, dokud ho Amyntas Galatský nezabil; po roce 25 př. n. l. patřilo k římské provincii Galacie a později se na svých mincích nazývalo Claudio-Derbe."
  sv:
    - "Derbe låg i sydöstra Lykaonien, på slätten i centrala Turkiet, vid eller mycket nära kullen Kerti Hüyük omkring 22 km nordost om Karaman, det forntida Laranda; kartpunkten står på kullen. Det ligger omkring 95 km ost-sydost om Lystra och 96 km sydost om Konya, det forntida Ikonion, fågelvägen, och omkring 645 km från Jerusalem. Äldre forskare, som följde William Ramsay, placerade Derbe vid Gudelisin längre västerut; 1956 fann Michael Ballance vid Kerti Hüyük en dedikation från 157 e.Kr. av ”Derbes råd och folk”, men sedan en biskop av Derbes gravsten dykt upp vid Devri Şehri, omkring 4 km bort, föreslog han i stället den platsen, så den exakta platsen är inte helt avgjord."
    - "Derbe var den yttersta punkten på Paulus första resa. Stenad i Lystra ”reste han sig upp och gick in i staden. Dagen därefter begav han sig med Barnabas åstad därifrån till Derbe. Och de förkunnade evangelium i den staden och vunno ganska många lärjungar. Sedan vände de tillbaka till Lystra och Ikonium och Antiokia”. Från Derbe gick vägen vidare österut genom Taurus via de kilikiska portarna till Tarsos, Paulus hemstad, omkring 145 km bort fågelvägen, den korta vägen tillbaka till Syrien; i stället vände de om och gick tillbaka genom städerna som hade drivit ut dem, för att styrka de nya församlingarna."
    - "Apostlagärningarna berättar inte om något besvär i Derbe, och när Paulus senare räknar upp sina förföljelser ”i Antiokia, Ikonium och Lystra”, saknas Derbe. Han kom tillbaka på sin andra resa, och bland männen som följde honom till Asien var ”Gajus från Derbe”. På första århundradet f.Kr. hade staden varit säte för Antipater av Derbe, en vän till Cicero, tills Amyntas av Galatien dödade honom; efter 25 f.Kr. tillhörde den den romerska provinsen Galatien och kallade sig senare Claudio-Derbe på sina mynt."
