id: where-did-jesus-feed-the-five-thousand
question:
  en: "Where did Jesus feed the five thousand?"
  ru: "Где Иисус накормил пять тысяч человек?"
  uk: "Де Ісус нагодував п'ять тисяч?"
  es: "¿Dónde dio de comer Jesús a los cinco mil?"
  pt: "Onde Jesus alimentou os cinco mil?"
  de: "Wo speiste Jesus die Fünftausend?"
  fr: "Où Jésus a-t-il nourri les cinq mille ?"
  pl: "Gdzie Jezus nakarmił pięć tysięcy?"
  it: "Dove Gesù sfamò i cinquemila?"
  nl: "Waar voedde Jezus de vijfduizend?"
  cs: "Kde Ježíš nasytil pět tisíc?"
  sv: "Var mättade Jesus de fem tusen?"
  nb: "Hvor mettet Jesus de fem tusen?"
  tl: "Saan pinakain ni Jesus ang limang libo?"
  da: "Hvor mættede Jesus de fem tusinde?"
  sr: "Где је Исус нахранио пет хиљада?"
  hu: "Hol etette meg Jézus az ötezret?"
  fi: "Missä Jeesus ruokki viisituhatta?"
  vi: "Giê-su đã cho năm ngàn người ăn ở đâu?"
  ro: "Unde i-a săturat Isus pe cei cinci mii?"
  bg: "Къде Исус е нахранил петте хиляди?"
answer:
  en:
    - "On the shore of the Sea of Galilee, in a lonely place that Luke alone locates: Jesus withdrew with the apostles “into a desert place belonging to the city called Bethsaida”, at the north end of the lake east of the Jordan's mouth; the map point stands at Bethsaida, about 6 km north-east of Capernaum in a straight line. Christian tradition has shown the place since the fourth century at Tabgha, on the north-west shore west of Capernaum, where the Church of the Multiplication keeps the mosaic of the loaves and fishes; many scholars prefer the north-eastern shore with Luke, and the exact spot is unknown."
    - "All four Gospels tell the miracle, the only one they share. Mark says Jesus called the apostles “apart into a desert place” and they went “by ship privately”, while the crowd “ran afoot thither out of all cities, and outwent them”; there was “green grass” to sit on, so it was spring, and John adds that the Passover was near and the men numbered about five thousand, “beside women and children”, says Matthew. Afterwards Jesus “constrained his disciples to get into the ship, and to go to the other side before unto Bethsaida”, while John has them cross “toward Capernaum”; next day boats from Tiberias came “nigh unto the place where they did eat bread”. A crossing “to Bethsaida” after a feeding near Bethsaida is the puzzle: commentators read Mark's words as a run along the shore, or put the feeding further down the eastern side, or at Tabgha, taking Luke's Bethsaida loosely."
    - "The tradition at Tabgha, Heptapegon, “seven springs”, goes back to Egeria's time: the note preserved by Peter the Deacon says that by the springs is a grassy field where the Lord fed the people from five loaves and two fishes, and that the stone on which he laid them had been made into an altar. A small shrine stood there in the fourth century, and in the fifth a basilica with mosaics of the lake's birds and plants and, before the altar, the basket of loaves between two fish; A. E. Mader and A. M. Schneider uncovered it from 1932, and the present church of the 1980s was built on the old plan. The memory probably settled on the west shore because the pilgrims' road ran there; the eastern shore of Luke's Bethsaida lay far from their path."
  ru:
    - "На берегу Галилейского моря, в пустынном месте, которое из евангелистов определяет один Лука: Иисус удалился с апостолами «в пустое место, близ города, называемого Вифсаидою», у северного конца озера к востоку от устья Иордана; точка карты стоит в Вифсаиде, примерно в 6 км к северо-востоку от Капернаума по прямой. Христианское предание с IV века показывает это место в Табхе, на северо-западном берегу западнее Капернаума, где церковь Умножения хлебов хранит мозаику с хлебами и рыбами; многие учёные вслед за Лукой предпочитают северо-восточный берег, а точное место неизвестно."
    - "Чудо рассказывают все четыре Евангелия — единственное из чудес, общее им всем. Марк говорит, что Иисус позвал апостолов «в пустынное место» и они «отправились… в лодке одни», а народ «бежали туда пешие из всех городов» и опередил их; сидели на «зеленой траве», что указывает на весну, Иоанн добавляет, что приближалась Пасха и мужчин было около пяти тысяч — «кроме женщин и детей», говорит Матфей. Потом Иисус «понудил учеников Своих войти в лодку и отправиться вперед на другую сторону к Вифсаиде», а у Иоанна они плывут «на ту сторону моря, в Капернаум», куда назавтра пришли лодки из Тивериады, искавшие Его «близко к тому месту, где ели хлеб». Переправа «к Вифсаиде» после насыщения близ Вифсаиды — загадка: толкователи понимают слова Марка как путь вдоль берега, или помещают насыщение дальше по восточному берегу, или относят его к Табхе, считая Вифсаиду у Луки приблизительной."
    - "Предание в Табхе — Гептапегон, «семь источников» — восходит ко временам Эгерии: заметка, сохранённая Петром Диаконом, говорит, что у источников есть травянистое поле, где Господь накормил народ пятью хлебами и двумя рыбами, а камень, на который Он их положил, обращён в алтарь. В IV веке там стояла малая часовня, а в V веке — базилика с мозаиками птиц и растений озера и, перед алтарём, с корзиной хлебов между двумя рыбами; А. Э. Мадер и А. М. Шнайдер раскрыли её начиная с 1932 года, и нынешняя церковь 1980-х годов построена по старому плану. Память закрепилась на западном берегу, вероятно, потому, что там шла дорога паломников; восточный берег Лукиной Вифсаиды лежал далеко от их пути."
  uk:
    - "На березі Галілейського моря, в безлюдному місці, яке розміщує лише Лука: Ісус відійшов з апостолами «окроме у місце пусте города, званого Витсаїда», на північному кінці озера, на схід від гирла Йордану; точка мапи стоїть у Віфсаїді, приблизно за 6 км на північний схід від Капернауму по прямій. Християнська традиція показує це місце з IV ст. у Табгі, на північно-західному березі, на захід від Капернауму, де церква Розмноження зберігає мозаїку з хлібами й рибами; багато вчених за Лукою віддає перевагу північно-східному берегові, і точне місце невідоме."
    - "Усі чотири Євангелії розповідають про це чудо, єдине, що вони поділяють. Марко каже, що Ісус сказав апостолам: «Ійдїть ви самі окроме в пусте місце», і вони «поплили в пусте місце човном, окроме», тоді як народ «збігались туди пішки з усїх городів, та й випередили їх»; було «на зеленій траві» сидіти, отже, це була весна, а Іван додає, що Пасха була близько, а чоловіків було близько п'яти тисяч, «опріч жінок та дїтей», каже Матвій. Потім Ісус «примусив учеників своїх увійти в човен, та плисти на той бік попереду ʼд Витсаїдї», а в Івана вони пливуть «на той бік моря у Капернаум»; наступного дня човни з Тіверіади прибули «поблизу місця, де їли хлїб». Переправа «до Віфсаїди» після годування біля Віфсаїди — загадка: тлумачі читають слова Марка як біг уздовж берега, або ставлять годування далі по східному боці, або в Табгі, розуміючи Лукову Віфсаїду вільно."
    - "Традиція в Табгі, Гептапегон, «сім джерел», сягає часу Егерії: примітка, збережена Петром Дияконом, каже, що біля джерел є трав'яне поле, де Господь нагодував народ п'ятьма хлібами й двома рибами, а камінь, на який Він їх поклав, зробили жертовником. У IV ст. тут стояла невелика святиня, а в V — базиліка з мозаїками озерних птахів і рослин і, перед жертовником, кошик із хлібами між двома рибами; А. Е. Мадер і А. М. Шнайдер відкрили її від 1932 р., а нинішню церкву 1980-х збудовано за давнім планом. Пам'ять, імовірно, осіла на західному березі, бо там проходила дорога прочан; східний берег Лукової Віфсаїди лежав далеко від їхнього шляху."
  es:
    - "En la orilla del mar de Galilea, en un lugar solitario que solo sitúa Lucas: Jesús se retiró con los apóstoles «aparte á un lugar desierto de la ciudad que se llama Bethsaida», en el extremo norte del lago, al este de la desembocadura del Jordán; el punto del mapa está en Betsaida, a unos 6 km al noreste de Cafarnaúm en línea recta. La tradición cristiana muestra el lugar desde el siglo IV en Tabgha, en la orilla noroeste, al oeste de Cafarnaúm, donde la iglesia de la Multiplicación conserva el mosaico de los panes y los peces; muchos estudiosos prefieren la orilla nororiental con Lucas, y el lugar exacto se desconoce."
    - "Los cuatro Evangelios cuentan este milagro, el único que comparten. En Marcos Jesús llama a los apóstoles: «Venid vosotros aparte al lugar desierto»; «se fueron en un barco al lugar desierto aparte», y la multitud «concurrieron allá muchos á pie de las ciudades, y llegaron antes que ellos»; había «la hierba verde» para sentarse, señal de primavera. Juan añade la Pascua cercana y unos cinco mil hombres, «sin las mujeres y los niños», dice Mateo. Jesús «dió priesa á sus discípulos á subir en el barco, é ir delante de él á Bethsaida de la otra parte», y Juan los hace cruzar «hacia Capernaum»; al día siguiente, barcas de Tiberias «junto al lugar donde habían comido el pan». Una travesía «a Betsaida» tras comer cerca de Betsaida es el enigma: se lee a Marcos como carrera por la orilla, o se sitúa la comida más abajo en el lado oriental o en Tabgha, con una Betsaida de Lucas amplia."
    - "La tradición de Tabgha, Heptapegon, «siete fuentes», se remonta a los tiempos de Egeria: la nota conservada por Pedro Diácono dice que junto a las fuentes hay un campo de hierba donde el Señor dio de comer al pueblo con cinco panes y dos peces, y que la piedra sobre la que los puso se había convertido en altar. Un pequeño santuario se alzaba allí en el siglo IV, y en el V una basílica con mosaicos de las aves y plantas del lago y, ante el altar, el cesto de panes entre dos peces; A. E. Mader y A. M. Schneider la sacaron a la luz desde 1932, y la iglesia actual, de los años 1980, se construyó sobre el plano antiguo. El recuerdo probablemente se asentó en la orilla occidental porque el camino de los peregrinos pasaba por allí; la orilla oriental de la Betsaida de Lucas quedaba lejos de su ruta."
  pt:
    - "Na margem do mar da Galileia, num lugar solitário que só Lucas localiza: Jesus retirou-se com os apóstolos “para uma região deserta de uma cidade chamada Betsaida”, na ponta norte do lago, a leste da foz do Jordão; o ponto do mapa está em Betsaida, a cerca de 6 km a nordeste de Cafarnaum em linha reta. A tradição cristã mostra o lugar desde o século IV em Tabgha, na margem noroeste, a oeste de Cafarnaum, onde a Igreja da Multiplicação guarda o mosaico dos pães e peixes; muitos estudiosos preferem, com Lucas, a margem nordeste, e o local exato é desconhecido."
    - "Os quatro Evangelhos contam o milagre, o único comum a todos. Marcos diz que Jesus chamou os apóstolos: “Venham para um lugar deserto”, e eles foram “no barco… a sós”, enquanto muitos “correram para lá a pé, vindo de todas as cidades. Eles chegaram antes deles”; havia “grama verde” para sentar, de modo que era primavera, e João acrescenta a Páscoa próxima e cerca de cinco mil homens, “além de mulheres e crianças”, diz Mateus. Depois Jesus “mandou os discípulos entrarem no barco e seguirem… para Betsaida”, enquanto João os faz atravessar “em direção a Cafarnaum”; no dia seguinte barcos de Tiberíades chegaram “perto do lugar onde comeram o pão”. Uma travessia “para Betsaida” depois de uma refeição perto de Betsaida é o enigma: uns leem as palavras de Marcos como corrida pela margem, outros põem a refeição no lado leste, ou em Tabgha, tomando Betsaida em sentido largo."
    - "A tradição de Tabgha, Heptapegon, “sete fontes”, remonta ao tempo de Egéria: a nota conservada por Pedro Diácono diz que junto às fontes há um campo de relva onde o Senhor alimentou o povo com cinco pães e dois peixes, e que a pedra sobre a qual os pôs foi feita altar. Uma pequena capela existia ali no século IV, e no V uma basílica com mosaicos das aves e plantas do lago e, diante do altar, o cesto de pães entre dois peixes; A. E. Mader e A. M. Schneider a descobriram a partir de 1932, e a igreja atual, dos anos 1980, foi construída sobre a planta antiga. A memória provavelmente se fixou na margem oeste porque a estrada dos peregrinos passava ali; a margem leste da Betsaida de Lucas ficava longe do caminho deles."
  de:
    - "Am Ufer des Sees Genezareth, an einem einsamen Ort, den allein Lukas verortet: Jesus zog sich mit den Aposteln „besonders in eine Wüste bei der Stadt, die da heißt Bethsaida“ zurück, am Nordende des Sees östlich der Jordanmündung; der Kartenpunkt liegt bei Betsaida, in der Luftlinie etwa 6 km nordöstlich von Kapernaum. Die christliche Überlieferung zeigt den Ort seit dem 4. Jahrhundert in Tabgha am Nordwestufer westlich von Kapernaum, wo die Brotvermehrungskirche das Mosaik von Broten und Fischen bewahrt; viele Gelehrte ziehen mit Lukas das Nordostufer vor, und die genaue Stelle ist unbekannt."
    - "Alle vier erzählen das Wunder, das einzige, das sie teilen. Markus sagt, Jesus rief die Apostel „besonders an eine wüste Stätte“, und sie fuhren „in einem Schiff“, während das Volk „zu Fuß aus allen Städten“ lief und ihnen zuvorkam; es gab „grünes Gras“ zum Lagern, also war es Frühling, Johannes fügt hinzu, das Passa sei nahe gewesen; die Männer zählten etwa fünftausend, nach Matthäus „ohne Weiber und Kinder“. Danach „trieb er seine Jünger, daß sie in das Schiff träten und vor ihm hinüberführen gen Bethsaida“, während Johannes sie „gen Kapernaum“ fahren lässt; am nächsten Tag kamen Schiffe von Tiberias „nahe zur Stätte, da sie das Brot gegessen hatten“. Eine Überfahrt „gen Bethsaida“ nach einer Speisung bei Betsaida ist das Rätsel: Man liest Markus als Lauf am Ufer, setzt die Speisung weiter südlich an die Ostseite oder nach Tabgha oder nimmt Lukas' Betsaida weit."
    - "Die Überlieferung in Tabgha, Heptapegon, „sieben Quellen“, reicht in Egerias Zeit zurück: Die von Petrus Diaconus bewahrte Notiz sagt, bei den Quellen liege ein Grasfeld, wo der Herr das Volk mit fünf Broten und zwei Fischen speiste, und der Stein, auf den er sie legte, sei zum Altar gemacht worden. Im 4. Jahrhundert stand dort ein kleiner Schrein, im 5. eine Basilika mit Mosaiken der Vögel und Pflanzen des Sees und vor dem Altar dem Brotkorb zwischen zwei Fischen; A. E. Mader und A. M. Schneider legten sie ab 1932 frei, und die heutige Kirche der 1980er Jahre wurde nach dem alten Plan gebaut. Die Erinnerung ließ sich wohl am Westufer nieder, weil die Pilgerstraße dort verlief; das Ostufer von Lukas' Betsaida lag weit von ihrem Weg."
  fr:
    - "Sur la rive de la mer de Galilée, en un lieu isolé que Luc seul situe : Jésus se retira avec les apôtres « à l’écart, du côté d’une ville appelée Bethsaïda », à l’extrémité nord du lac, à l’est de l’embouchure du Jourdain ; le point de la carte est à Bethsaïda, à environ 6 km au nord-est de Capernaüm en ligne droite. La tradition chrétienne montre le lieu depuis le IVe siècle à Tabgha, sur la rive nord-ouest, à l’ouest de Capernaüm, où l’église de la Multiplication conserve la mosaïque des pains et des poissons ; beaucoup de savants préfèrent avec Luc la rive nord-est, et l’endroit exact est inconnu."
    - "Les quatre Évangiles le racontent, seul miracle commun. Chez Marc, Jésus appelle les apôtres « à l’écart dans un lieu désert » ; ils partirent « dans une barque, pour aller à l’écart » et la foule, venue à pied de toutes les villes, « les devança » ; il y avait de « l’herbe verte » : c’était le printemps, la Pâque étant proche selon Jean ; les hommes étaient environ cinq mille, « sans les femmes et les enfants », dit Matthieu. Jésus « obligea ses disciples à monter dans la barque et à passer avant lui de l’autre côté, vers Bethsaïda », mais Jean les fait aller « à Capernaüm » ; le lendemain, des barques de Tibériade vinrent « près du lieu où ils avaient mangé le pain ». Traverser vers Bethsaïda après un repas près de Bethsaïda fait énigme : on lit chez Marc une course le long du rivage, ou l’on place le repas plus bas à l’est, ou à Tabgha, la Bethsaïda de Luc étant prise au sens large."
    - "La tradition de Tabgha, l’Heptapegon, « les sept sources », remonte au temps d’Égérie : la note conservée par Pierre Diacre dit qu’auprès des sources se trouve un champ herbeux où le Seigneur nourrit le peuple avec cinq pains et deux poissons, et que la pierre sur laquelle il les déposa fut faite autel. Un petit sanctuaire s’y dressait au IVe siècle, et au Ve une basilique aux mosaïques d’oiseaux et de plantes du lac et, devant l’autel, la corbeille de pains entre deux poissons ; A. E. Mader et A. M. Schneider la mirent au jour à partir de 1932, et l’église actuelle, des années 1980, fut bâtie sur l’ancien plan. Le souvenir s’est probablement fixé sur la rive ouest parce que la route des pèlerins y passait ; la rive orientale de la Bethsaïda de Luc était loin de leur chemin."
  pl:
    - "Na brzegu Jeziora Galilejskiego, w odludnym miejscu, które lokalizuje tylko Łukasz: Jezus ustąpił z apostołami „osobno na miejsce puste przy mieście, które zowią Betsaida”, na północnym krańcu jeziora na wschód od ujścia Jordanu; punkt na mapie stoi w Betsaidzie, około 6 km na północny wschód od Kafarnaum w linii prostej. Tradycja chrześcijańska pokazuje to miejsce od IV wieku w Tabgha, na północno-zachodnim brzegu na zachód od Kafarnaum, gdzie kościół Rozmnożenia zachowuje mozaikę chlebów i ryb; wielu uczonych woli za Łukaszem brzeg północno-wschodni, a dokładne miejsce jest nieznane."
    - "Ten cud opowiadają wszystkie cztery Ewangelie, jedyny wspólny wszystkim. Marek mówi, że Jezus wezwał apostołów „osobno na miejsce puste”, a oni odjechali „w łodzi na miejsce puste osobno”, a tłum „zbieżeli się tam pieszo ze wszystkich miast, i poprzedzili je”; sadzano ich „na zielonej trawie”, więc była wiosna, a Jan dodaje, że Pascha była blisko; mężów było około pięciu tysięcy, „oprócz niewiast i dziatek”, mówi Mateusz. Potem Jezus „przymusił ucznie swoje, aby wstąpili w łódź, i uprzedzili go na drugą stronę ku Betsaidzie”, a Jan każe im płynąć „do Kapernaum”; nazajutrz przypłynęły łodzie z Tyberiady „blisko do onego miejsca, gdzie jedli chleb”. Przeprawa „ku Betsaidzie” po nakarmieniu koło Betsaidy to zagadka: komentatorzy czytają słowa Marka jako bieg wzdłuż brzegu, umieszczają nakarmienie dalej na wschodzie albo w Tabgha, rozumiejąc Betsaidę Łukasza swobodnie."
    - "Tradycja w Tabgha, Heptapegon, „siedem źródeł”, sięga czasów Egerii: notatka zachowana przez Piotra Diakona mówi, że przy źródłach jest trawiasta łąka, na której Pan nakarmił lud pięcioma chlebami i dwiema rybami, a kamień, na którym je położył, uczyniono ołtarzem. Mała kaplica stała tam w IV wieku, a w V bazylika z mozaikami ptaków i roślin jeziora oraz, przed ołtarzem, koszem chlebów między dwiema rybami; A. E. Mader i A. M. Schneider odsłonili ją od 1932, a obecny kościół z lat 80. zbudowano według dawnego planu. Pamięć osiadła prawdopodobnie na brzegu zachodnim, bo tamtędy biegła droga pielgrzymów; wschodni brzeg Betsaidy Łukasza leżał daleko od ich szlaku."
  it:
    - "Sulla riva del lago di Tiberiade, in un luogo solitario che solo Luca localizza: Gesù si ritirò con gli apostoli «in disparte verso una città chiamata Betsaida», all’estremità nord del lago a est della foce del Giordano; il punto della mappa si trova a Betsaida, a circa 6 km a nord-est di Cafarnao in linea retta. La tradizione cristiana mostra il luogo dal IV secolo a Tabgha, sulla riva nord-occidentale a ovest di Cafarnao, dove la chiesa della Moltiplicazione conserva il mosaico dei pani e dei pesci; molti studiosi preferiscono con Luca la riva nord-orientale, e il punto esatto è ignoto."
    - "I quattro Vangeli raccontano il miracolo, l’unico in comune. Marco dice che Gesù chiamò gli apostoli «in disparte, in luogo solitario» e che partirono in barca, mentre «da tutte le città accorsero là a piedi e vi giunsero prima di loro»; la gente sedette «sull’erba verde», dunque era primavera; per Giovanni la Pasqua era vicina e gli uomini circa cinquemila, «oltre le donne e i fanciulli», dice Matteo. Poi Gesù «obbligò i suoi discepoli a montar nella barca e a precederlo sull’altra riva, verso Betsaida»; per Giovanni vanno «verso Capernaum»; il giorno dopo barche da Tiberiade giunsero «presso al luogo dove avean mangiato il pane». Una traversata «verso Betsaida» dopo un pasto presso Betsaida è il rompicapo: si legge Marco come una corsa lungo la riva, o si pone il pasto più giù sul lato orientale, o a Tabgha, prendendo la Betsaida di Luca in senso lato."
    - "La tradizione di Tabgha, Heptapegon, «sette sorgenti», risale ai tempi di Egeria: la nota conservata da Pietro Diacono dice che presso le sorgenti c’è un campo erboso dove il Signore sfamò il popolo con cinque pani e due pesci, e che la pietra su cui li depose era stata fatta altare. Un piccolo santuario vi sorgeva nel IV secolo, e nel V una basilica con mosaici di uccelli e piante del lago e, davanti all’altare, il cesto dei pani tra due pesci; A. E. Mader e A. M. Schneider la portarono alla luce dal 1932, e la chiesa attuale degli anni 1980 fu costruita sull’antica pianta. La memoria si fissò probabilmente sulla riva occidentale perché la strada dei pellegrini passava di lì; la riva orientale della Betsaida di Luca era lontana dal loro percorso."
  nl:
    - "Aan de oever van het Meer van Galilea, op een eenzame plek die alleen Lukas aanwijst: Jezus trok met de apostelen terug “in een woeste plaats der stad, genaamd Bethsaida”, aan het noordeinde van het meer ten oosten van de Jordaanmonding; het punt op de kaart staat bij Bethsaïda, hemelsbreed ongeveer 6 km ten noordoosten van Kafarnaüm. De christelijke overlevering toont de plek sinds de vierde eeuw bij Tabgha, aan de noordwestoever ten westen van Kafarnaüm, waar de Broodvermenigvuldigingskerk het mozaïek van de broden en vissen bewaart; veel geleerden verkiezen met Lukas de noordoostoever, en de precieze plek is onbekend."
    - "Het enige wonder dat alle vier de Evangeliën vertellen. Marcus: Hij riep de apostelen “in een woeste plaats hier alleen” en zij vertrokken “in een schip, naar een woeste plaats, alleen”, terwijl velen “liepen gezamenlijk te voet van alle steden derwaarts, en kwamen hun voor”; “het groene gras”: lente; Johannes: Pesach was nabij; Mattheüs: ongeveer vijfduizend mannen, “zonder de vrouwen en kinderen”. Daarna “dwong Hij Zijn discipelen in het schip te gaan, en voor henen te varen aan de andere zijde tegen over Bethsaida”; Johannes laat hen oversteken “naar Kapernaum”, en daags erna kwamen boten uit Tiberias “nabij de plaats, waar zij het brood gegeten hadden”. Een overtocht “tegen over Bethsaida” na een maaltijd bij Bethsaïda is het raadsel; sommigen lezen een tocht langs de oever, anderen plaatsen de maaltijd oostelijker of te Tabgha, met een ruime lezing van Lukas’ Bethsaïda."
    - "De overlevering te Tabgha, Heptapegon, “zeven bronnen”, gaat terug tot Egeria’s tijd: de aantekening die Petrus de Diaken bewaarde, zegt dat bij de bronnen een grasveld is waar de Heer het volk voedde met vijf broden en twee vissen, en dat de steen waarop Hij ze legde tot altaar was gemaakt. Er stond daar in de vierde eeuw een kleine kapel, in de vijfde een basiliek met mozaïeken van vogels en planten van het meer en, voor het altaar, de mand met broden tussen twee vissen; A. E. Mader en A. M. Schneider legden haar vanaf 1932 bloot, en de huidige kerk uit de jaren 1980 is naar het oude plan gebouwd. De herinnering bleef waarschijnlijk aan de westoever hangen omdat de pelgrimsroute daar liep; de oostoever van Lukas’ Bethsaïda lag ver van hun pad."
  cs:
    - "Na břehu Galilejského jezera, na pustém místě, které určuje jen Lukáš: Ježíš se s apoštoly odebral „na místo pusté města řečeného Betsaida“, na severním konci jezera východně od ústí Jordánu; bod na mapě stojí v Betsaidě, asi 6 km severovýchodně od Kafarnaa vzdušnou čarou. Křesťanská tradice ukazuje místo od 4. století v Tabše, na severozápadním břehu západně od Kafarnaa, kde bazilika Rozmnožení chlebů uchovává mozaiku chlebů a ryb; mnozí badatelé s Lukášem dávají přednost severovýchodnímu břehu a přesné místo není známo."
    - "Všechna čtyři evangelia vyprávějí zázrak, jediný, který mají společný. Marek praví, že Ježíš řekl apoštolům: „Pojďte vy sami obzvláštně na pusté místo“, a oni se plavili „až na pusté místo soukromí“, zatímco zástup „sběhli se tam ze všech měst pěšky, a předešli je“; posadit se měli „na zelené trávě“, takže bylo jaro, a Jan dodává, že byl blízko Pesach, a mužů bylo okolo pěti tisíc, „kromě žen a dětí“, říká Matouš. Potom Ježíš „přinutil učedlníky své vstoupiti na lodí, aby jej předešli přes moře do Betsaidy“, zatímco u Jana se plavili „přes moře do Kafarnaum“; příštího dne připluly lodě z Tiberiady „k tomu místu blízko, kdežto byli jedli chléb“. Přeplavba „do Betsaidy“ po nasycení u Betsaidy je hádanka: vykladači čtou Markova slova jako běh podél břehu, nebo kladou nasycení dále po východní straně, nebo do Tabše a berou Lukášovu Betsaidu volně."
    - "Tradice v Tabše, Heptapegon, „sedm pramenů“, sahá do doby Egerie: poznámka zachovaná Petrem Jáhnem říká, že u pramenů je travnatá louka, kde Pán nasytil lid pěti chleby a dvěma rybami, a že kámen, na který je položil, byl proměněn v oltář. Malá svatyně tam stála ve 4. století a v 5. bazilika s mozaikami ptáků a rostlin jezera a před oltářem s košem chlebů mezi dvěma rybami; A. E. Mader a A. M. Schneider ji odkryli od roku 1932 a dnešní kostel z 80. let byl postaven podle starého půdorysu. Paměť se pravděpodobně usadila na západním břehu, protože tam vedla poutnická cesta; východní břeh Lukášovy Betsaidy ležel daleko od jejich cesty."
  sv:
    - "Vid Galileiska sjöns strand, på en ensam plats som bara Lukas lokaliserar: Jesus drog sig undan med apostlarna, ”till en stad som hette Betsaida, där de kunde vara allena”, vid sjöns norra ände öster om Jordans mynning; kartpunkten står vid Betsaida, omkring 6 km nordost om Kafarnaum fågelvägen. Kristen tradition har visat platsen sedan 300-talet vid Tabgha, på nordvästra stranden väster om Kafarnaum, där Brödundrets kyrka bevarar mosaiken med bröden och fiskarna; många forskare föredrar med Lukas den nordöstra stranden, och den exakta platsen är okänd."
    - "Alla fyra berättar undret, det enda de delar. Markus: Jesus kallade apostlarna till ensamhet, och de for ”i båten bort till en öde trakt, där de kunde vara allena”, medan ”från alla städer strömmade då människor ... dit landvägen och kommo fram före dem”; folket fick lägga sig ned ”i gröna gräset”, så det var vår, och Johannes tillägger att påsken var nära och att männen var ”vid pass fem tusen”, ”förutom kvinnor och barn”, säger Matteus. Efteråt ”nödgade han sina lärjungar att stiga i båten och i förväg fara över till Betsaida ...”, medan Johannes låter dem fara ”till Kapernaum”; nästa dag lade båtar från Tiberias till ”nära det ställe där folket bespisades”. Gåtan är en överfart ”till Betsaida” efter en måltid nära Betsaida: man läser Markus ord som en färd längs stranden, eller förlägger måltiden längre söderut på östra sidan eller vid Tabgha och tar Lukas Betsaida löst."
    - "Traditionen i Tabgha, Heptapegon, ”sju källor”, går tillbaka till Egerias tid: anteckningen som bevarats av diakonen Petrus säger att vid källorna finns en gräsbevuxen äng där Herren mättade folket med fem bröd och två fiskar, och att stenen han lade dem på hade gjorts till ett altare. En liten helgedom stod där på 300-talet, och på 400-talet en basilika med mosaiker av sjöns fåglar och växter och, framför altaret, korgen med bröd mellan två fiskar; A. E. Mader och A. M. Schneider grävde fram den från 1932, och den nuvarande kyrkan från 1980-talet byggdes efter den gamla planen. Minnet slog sannolikt rot på västra stranden eftersom pilgrimernas väg gick där; östra stranden vid Lukas Betsaida låg långt från deras stig."
  nb:
    - "På bredden av Galileasjøen, på et ensomt sted som bare Lukas stedfester: Jesus trakk seg tilbake med apostlene «avsides til en by som heter Betsaida», ved nordenden av innsjøen øst for Jordans munning; kartpunktet står ved Betsaida, omtrent 6 km nordøst for Kapernaum i luftlinje. Kristen tradisjon har vist stedet siden 300-tallet ved Tabgha, på nordvestkysten vest for Kapernaum, der Brødunderets kirke bevarer mosaikken med brødene og fiskene; mange forskere foretrekker nordøstkysten sammen med Lukas, og det nøyaktige stedet er ukjent."
    - "Alle fire evangelier forteller miraklet, det eneste de deler. Markus sier at Jesus kalte apostlene «avsides til et øde sted», og de drog «i båten til et øde sted for sig selv», men «fra alle byene løp de til fots dit og kom før dem»; det var «det grønne gress» å sitte på, altså vår, og Johannes tilføyer at påsken var nær og at mennene var omkring fem tusen, «foruten kvinner og barn», sier Matteus. Etterpå «nødde han sine disipler til å gå i båten og fare i forveien over til hin side, til Betsaida», mens Johannes lar dem krysse «til Kapernaum»; neste dag kom båter fra Tiberias «nær til det sted hvor de hadde fått mat efter Herrens takkebønn». En overfart «til Betsaida» etter bespisning nær Betsaida er gåten: kommentatorer leser Markus' ord som en løpetur langs stranden, eller legger bespisningen lenger ned på østsiden, eller ved Tabgha, med Lukas' Betsaida tatt løst."
    - "Tradisjonen ved Tabgha, Heptapegon, «syv kilder», går tilbake til Egerias tid: notisen bevart av Peter Diakonen sier at det ved kildene er en gressdekt slette der Herren mettet folket med fem brød og to fisker, og at steinen han la dem på, var gjort til alter. En liten helligdom sto der på 300-tallet, og på 400-tallet en basilika med mosaikker av innsjøens fugler og planter og, foran alteret, brødkurven mellom to fisker; A. E. Mader og A. M. Schneider avdekket den fra 1932, og dagens kirke fra 1980-årene ble bygget etter den gamle planen. Minnet slo trolig rot på vestkysten fordi pilegrimenes vei gikk der; Lukas' Betsaida på østkysten lå langt fra deres rute."
  tl:
    - "Sa baybayin ng Dagat ng Galilea, sa isang liblib na lugar na si Lucas lamang ang naglalagay: umalis si Jesus kasama ang mga apostol “bukod sa isang bayan na tinatawag na Betsaida”, sa hilagang dulo ng lawa sa silangan ng bukana ng Jordan; ang tuldok sa mapa ay nasa Bethsaida, mga 6 km sa hilagang-silangan ng Capernaum sa tuwid na guhit. Ipinakikita ng tradisyong Kristiyano ang lugar mula pa noong ikaapat na siglo sa Tabgha, sa hilagang-kanlurang baybayin sa kanluran ng Capernaum, kung saan iningatan ng Simbahan ng Pagpaparami ang mosaiko ng mga tinapay at isda; mas gusto ng maraming iskolar ang hilagang-silangang baybayin kasama ni Lucas, at hindi alam ang eksaktong lugar."
    - "Ang tanging himalang nasa apat na Ebanghelyo. Kay Marcos, tinawag ni Jesus ang mga apostol na “magsiparito kayo ng bukod sa isang dakong ilang”, at “nangasa daong” sila, habang “nagsisitakbo … mula sa lahat ng mga bayan…” ang karamihan; may “damuhang sariwa”, kaya tagsibol, malapit na ang Paskua (Juan) at mga 5,000 ang lalaki, “bukod pa ang mga babae at ang mga bata” (Mateo). Saka, “pinalulan niya sa daong ang kaniyang mga alagad … sa kabilang ibayo, sa Betsaida”, sa Juan, tumawid sila “hanggang sa Capernaum”; kinabukasan, may mga daong mula sa Tiberias “malapit sa dako na kanilang kinainan ng tinapay”. Palaisipan ang pagtawid “sa Betsaida” matapos magpakain sa may Bethsaida: binabasa ito ng ilang komentarista bilang paglalayag sa baybayin; inilalagay ng iba ang pagpapakain sa mas ibaba sa silangang panig, o sa Tabgha, kung maluwag ang basa sa Bethsaida ni Lucas."
    - "Ang tradisyon sa Tabgha, Heptapegon, “pitong bukal”, ay nagmula sa panahon ni Egeria: sinasabi ng tala na iningatan ni Pedro na Diakono na sa tabi ng mga bukal ay may madamong bukid kung saan pinakain ng Panginoon ang bayan ng limang tinapay at dalawang isda, at na ang batong pinaglagyan niya ng mga ito ay ginawang dambana. Isang maliit na dambana ang tumayo roon noong ikaapat na siglo, at noong ikalima ay isang basilika na may mga mosaiko ng mga ibon at halaman ng lawa at, sa harap ng dambana, ang basket ng mga tinapay sa pagitan ng dalawang isda; hinukay ito nina A. E. Mader at A. M. Schneider mula 1932, at itinayo ang kasalukuyang simbahan noong dekada 1980 sa lumang plano. Marahil nanatili ang alaala sa kanlurang baybayin dahil doon dumaan ang daan ng mga peregrino; malayo sa kanilang daan ang silangang baybayin ng Bethsaida ni Lucas."
  da:
    - "På Genesaret Søs bred, på et ensomt sted, som kun Lukas stedfæster: Jesus trak sig tilbage med apostlene og »drog bort afsides til en By, som kaldes Bethsajda«, ved søens nordende øst for Jordans munding; kortets punkt står ved Betsajda, omkring 6 km nordøst for Kapernaum i luftlinje. Kristen tradition har siden 300-tallet vist stedet ved Tabgha, på nordvestkysten vest for Kapernaum, hvor Brødmiraklets kirke bevarer mosaikken med brød og fisk; mange forskere foretrækker med Lukas nordøstkysten, og det nøjagtige sted er ukendt."
    - "Alle fire evangelier fortæller miraklet, det eneste fælles. Markus siger, at Jesus kaldte apostlene »afsides til et øde Sted«, og at de »droge bort i Skibet til et øde Sted afsides«, mens folk »til Fods strømmede de sammen derhen fra alle Byerne og kom før end de«; der var »det grønne Græs« at sidde i, så det var forår, og Johannes tilføjer, at påsken var nær, og mændene var omkring 5.000, »foruden Kvinder og Børn«, siger Mattæus. Siden »nødte han sine Disciple til at gaa om Bord i Skibet og i Forvejen sætte over til hin Side, til Bethsajda«, mens Johannes lader dem krydse »til Kapernaum«; næste dag kom både fra Tiberias »nær til det Sted, hvor de spiste Brødet«. Overfarten »til Bethsajda« efter en mætning nær Betsajda er gåden: kommentatorer læser Markus' ord som et løb langs stranden eller placerer mætningen længere nede på østsiden eller ved Tabgha og tager Lukas' Betsajda løst."
    - "Traditionen ved Tabgha, Heptapegon, »syv kilder«, går tilbage til Egerias tid: noten bevaret af diakonen Peter siger, at der ved kilderne er en græsbevokset mark, hvor Herren mættede folket med fem brød og to fisk, og at stenen, som han lagde dem på, var gjort til et alter. En lille helligdom stod der i 300-tallet, og i 400-tallet en basilika med mosaikker af søens fugle og planter og, foran alteret, brødkurven mellem to fisk; A. E. Mader og A. M. Schneider afdækkede den fra 1932, og den nuværende kirke fra 1980'erne blev bygget efter den gamle plan. Erindringen slog sandsynligvis rod på vestkysten, fordi pilgrimmenes vej løb dér; østkysten ved Lukas' Betsajda lå langt fra deres vej."
  sr:
    - "На обали Галилејског мора, на усамљеном месту које само Лука одређује: „И узевши их отиде насамо у пустињу код града који се зваше Витсаида“, на северном крају језера источно од ушћа Јордана; тачка на карти стоји у Витсаиди, око 6 км североисточно од Капернаума правом линијом. Хришћанско предање показује то место од 4. века у Табги, на северозападној обали западно од Капернаума, где црква Умножења хлебова чува мозаик хлебова и риба; многи научници са Луком радије бирају североисточну обалу, а тачно место је непознато."
    - "Сва четири јеванђеља причају чудо, једино које деле. Марко каже да је Исус позвао апостоле: „Дођите ви сами насамо“, па: „И одоше на лађи у пусто место сами“, док људи „пешице из свих градова стецаху се онамо, и престигоше их“; седали су „по зеленој трави“, па је било пролеће, а Јован додаје да је „близу пасха, празник јеврејски“ и да је мушкараца било око пет хиљада, „осим жена и деце“, каже Матеј. Потом, по Марку: „И одмах натера ученике своје да уђу у лађу и да иду напред на оне стране у Витсаиду“, док код Јована они прелазе „преко мора у Капернаум“; сутрадан су лађе из Тиверијаде стигле „близу оног места где једоше хлеб“. Прелазак „у Витсаиду“ после нахрањења код Витсаиде је загонетка: тумачи Марково место читају као трчање дуж обале, или смештају нахрањење даље низ источну страну, или у Табгу, узимајући Лукину Витсаиду слободно."
    - "Предање у Табги, Хептапегону, „седам извора“, сеже у Егеријино доба: белешка коју је сачувао ђакон Петар каже да је код извора травната њива где је Господ нахранио народ са пет хлебова и две рибе, и да је камен на који их је положио претворен у олтар. Мала светиња стајала је ту у 4. веку, а у 5. базилика с мозаицима птица и биљака језера и, пред олтаром, корпом хлебова између две рибе; А. Е. Мадер и А. М. Шнајдер открили су је од 1932, а садашња црква из 1980-их саграђена је по старом плану. Сећање се вероватно сместило на западну обалу јер је ходочасницима пут ишао тамо; источна обала Лукине Витсаиде лежала је далеко од њиховог пута."
  hu:
    - "A Galileai-tenger partján, egy elhagyatott helyen, amelyet egyedül Lukács határoz meg: Jézus az apostolokkal „elvonula magánosan a Bethsaida nevű városnak puszta helyére”, a tó északi végén, a Jordán torkolatától keletre; a térképi pont Betszaidánál áll, Kapernaumtól egyenes vonalban mintegy 6 km-re északkeletre. A keresztény hagyomány a 4. század óta a Kapernaumtól nyugatra, az északnyugati parton fekvő Tabghánál mutatja a helyet, ahol a Kenyérszaporítás temploma őrzi a kenyerek és halak mozaikját; sok kutató Lukáccsal együtt az északkeleti partot részesíti előnyben, a pontos hely ismeretlen."
    - "Mind a négy evangélium elbeszéli a csodát, az egyetlen közöset. Márk szerint Jézus „csupán ti magatok valamely puszta helyre” hívta az apostolokat, akik „hajón” mentek, „csupán ő magok”, a sokaság pedig „minden városból egybefutának oda gyalog, és megelőzék őket”; „zöld pázsit” volt, tehát tavasz; János szerint közel volt a páska, a férfiak mintegy ötezren voltak, Máté szerint „asszonyokon és gyermekeken kívül”. Azután Jézus „kényszeríté tanítványait, hogy hajóba szálljanak, és menjenek át előre a túlsó partra Bethsaida felé”, János szerint „mennek vala a tengeren túl Kapernaumba”; másnap hajók jöttek Tiberiásból „közel ahhoz a helyhez, a hol a kenyeret ették”. Talány az átkelés „Bethsaida felé” Bethsaida melletti etetés után: a magyarázók Márk szavait part menti futásnak olvassák, vagy az etetést lejjebb teszik keleten, vagy Tabghába, Lukács Bethsaidáját tágan véve."
    - "A tabghai hagyomány, a Heptapegon, „hét forrás”, Egeria idejéig nyúlik vissza: a Diakónus Péter által megőrzött feljegyzés szerint a források mellett füves mező van, ahol az Úr öt kenyérrel és két hallal etette a népet, és a kő, amelyre letette őket, oltárrá lett. Kis szentély állt ott a 4. században, az 5.-ben pedig bazilika a tó madarainak és növényeinek mozaikjaival, az oltár előtt a két hal közti kenyérkosárral; A. E. Mader és A. M. Schneider 1932-től tárta fel, a mai, 1980-as évekbeli templom a régi alaprajzra épült. Az emlék valószínűleg a nyugati parton telepedett meg, mert a zarándokút ott haladt; Lukács Bethsaidájának keleti partja messze esett az útjuktól."
  fi:
    - "Galileanjärven rannalla, autiossa paikassa, jonka vain Luukas paikantaa: Jeesus vetäytyi apostolien kanssa ”yksinäisyyteen lähelle Beetsaida nimistä kaupunkia”, järven pohjoispäähän Jordanin suun itäpuolelle; kartan piste on Betsaidassa, noin 6 km Kapernaumista koilliseen linnuntietä. Kristillinen perimätieto on osoittanut paikan 300-luvulta lähtien Tabghassa, luoteisrannalla Kapernaumista länteen, missä Moninkertaistamisen kirkko säilyttää leipien ja kalojen mosaiikin; monet tutkijat suosivat Luukkaan mukaan koillisrantaa, ja tarkka paikka on tuntematon."
    - "Kaikki neljä evankeliumia kertovat ihmeen, ainoan yhteisen. Markuksen mukaan apostolit kutsuttiin ”yksinäisyyteen, autioon paikkaan”, ja he menivät ”venheellä”, kun monet ”riensivät sinne jalkaisin kaikista kaupungeista ja saapuivat ennen heitä”; istuttiin ”vihantaan ruohikkoon”, joten kevät, ja Johannes lisää pääsiäisen olleen lähellä; miehiä noin viisituhatta, ”paitsi naisia ja lapsia”, sanoo Matteus. Sitten Jeesus ”vaati opetuslapsiansa astumaan venheeseen ja kulkemaan edeltä toiselle rannalle, Beetsaidaan”, kun taas Johannes antaa heidän lähteä ”Kapernaumiin”; seuraavana päivänä Tiberiaasta tuli venheitä ”lähelle sitä paikkaa, jossa he olivat syöneet leipää”. Ylitys Betsaidaan sen läheisen ruokkimisen jälkeen on arvoitus: Markuksen sanat luetaan rantajuoksuna, tai ruokkiminen sijoitetaan etelämmäs itärannalle tai Tabghaan Luukkaan Betsaidaa väljästi tulkiten."
    - "Tabghan, Heptapegonin, ”seitsemän lähteen”, perimätieto ulottuu Egerian aikaan: Pietari Diakonin säilyttämä merkintä sanoo, että lähteiden luona on ruohoinen kenttä, jolla Herra ruokki kansan viidellä leivällä ja kahdella kalalla, ja että kivi, jolle hän ne laski, oli tehty alttariksi. Pieni pyhäkkö seisoi siellä 300-luvulla, ja 400-luvulla basilika, jonka mosaiikeissa on järven lintuja ja kasveja ja alttarin edessä leipäkori kahden kalan välissä; A. E. Mader ja A. M. Schneider paljastivat sen vuodesta 1932, ja nykyinen 1980-luvun kirkko rakennettiin vanhan pohjapiirroksen mukaan. Muisto asettui luultavasti länsirannalle, koska pyhiinvaeltajien tie kulki siellä; Luukkaan Betsaidan itäranta oli kaukana heidän reitiltään."
  vi:
    - "Trên bờ Biển Ga-li-lê, ở một nơi vắng mà chỉ Lu-ca xác định: Giê-su lui đi với các sứ đồ “đến gần thành kia gọi là Bết-sai-đa”, ở đầu bắc của hồ, phía đông cửa sông Giô-đanh; điểm bản đồ đứng tại Bết-sai-đa, cách Ca-bê-na-um khoảng 6 km về phía đông bắc theo đường thẳng. Truyền thống Cơ Đốc từ thế kỷ 4 chỉ nơi ấy tại Tabgha, ở bờ tây bắc phía tây Ca-bê-na-um, nơi Nhà thờ Hóa bánh ra nhiều giữ bức khảm bánh và cá; nhiều học giả theo Lu-ca ưa bờ đông bắc, và địa điểm chính xác không được biết."
    - "Cả bốn sách Phúc Âm đều kể phép lạ này, phép lạ duy nhất mà cả bốn sách cùng chép. Mác nói Giê-su gọi các sứ đồ “đi tẻ ra trong nơi vắng vẻ” và họ “xuống thuyền đặng đi tẻ ra”, trong khi đoàn dân “từ khắp các thành đều chạy bộ đến nơi Chúa cùng sứ đồ vừa đi, và đã tới đó trước”; có “cỏ xanh” để ngồi, nên đó là mùa xuân, và Giăng thêm rằng lễ Vượt qua gần tới, số người ước chừng năm ngàn, “không kể đàn bà con nít”, Ma-thi-ơ nói. Sau đó Giê-su “giục môn đồ vào thuyền, qua bờ bên kia trước mình, hướng đến thành Bết-sai-đa”, trong khi Giăng cho họ sang “hướng về thành Ca-bê-na-um”; hôm sau có thuyền từ Ti-bê-ri-át đến “lại gần nơi chúng đã ăn bánh”. Một chuyến sang “hướng đến thành Bết-sai-đa” sau bữa ăn gần Bết-sai-đa là điều khó hiểu: các nhà chú giải đọc lời Mác là một chặng chạy dọc bờ, hoặc đặt bữa ăn xa hơn về phía đông, hoặc tại Tabgha, hiểu Bết-sai-đa của Lu-ca rộng rãi."
    - "Truyền thống ở Tabgha, Heptapegon, “bảy suối”, có từ thời Egeria: ghi chú do Phó tế Peter lưu lại nói rằng bên các suối có một cánh đồng cỏ nơi Chúa cho dân ăn từ năm cái bánh và hai con cá, và tảng đá Ngài đặt chúng lên đã được làm thành bàn thờ. Một điện nhỏ đứng đó ở thế kỷ 4, và ở thế kỷ 5 một thánh đường với các bức khảm chim và cây của hồ và, trước bàn thờ, giỏ bánh giữa hai con cá; A. E. Mader và A. M. Schneider khai quật từ 1932, và nhà thờ hiện nay của thập niên 1980 được xây theo mặt bằng cũ. Ký ức có lẽ dừng lại ở bờ tây vì đường hành hương chạy ở đó; bờ đông của Bết-sai-đa trong Lu-ca nằm xa lối họ đi."
  ro:
    - "Pe malul Mării Galileii, într-un loc pustiu pe care îl localizează doar Luca: Isus s-a retras cu apostolii „în loc pustiu al cetăței ce se chiamă Vitsaida”, la capătul de nord al lacului, la est de gura Iordanului; punctul de pe hartă stă la Betsaida, la circa 6 km nord-est de Capernaum în linie dreaptă. Tradiția creștină arată locul din secolul al IV-lea la Tabgha, pe malul de nord-vest, la vest de Capernaum, unde Biserica Înmulțirii pâinilor păstrează mozaicul pâinilor și al peștilor; mulți cercetători preferă, cu Luca, malul de nord-est, iar locul exact nu se știe."
    - "Toate patru Evangheliile povestesc minunea, singura lor comună. Marcu spune că Isus i-a chemat pe apostoli „deosebi, în loc pustiu” și ei au mers „singuri cu corabia”, în timp ce mulțimea, „pedestri din toate cetățile alergau acolo, și mai înainte decât ei au venit”; era „iarbă verde”, deci primăvară, iar Ioan adaugă că Paștele era aproape și bărbații erau circa cinci mii, „afară de muieri și de copii”, spune Matei. Apoi Isus „au silit pre ucenicii săi să intre în corabie și să meargă mai înainte, de ceea parte, la Vitsaida”, pe când la Ioan ei „mergeau … la Capernaum”; a doua zi au venit corăbii din Tiberiada „aproape de locul unde au mâncat pâinea”. O traversare „la Vitsaida” după o săturare lângă Betsaida este enigma: unii citesc cuvintele lui Marcu ca alergare pe mal, alții pun săturarea mai jos pe malul de est sau la Tabgha, luând Betsaida lui Luca în sens larg."
    - "Tradiția de la Tabgha, Heptapegon, „șapte izvoare”, merge până în vremea Egeriei: nota păstrată de Petru Diaconul spune că lângă izvoare este un câmp cu iarbă unde Domnul a săturat poporul din cinci pâini și doi pești și că piatra pe care le-a așezat fusese făcută altar. Un mic sanctuar stătea acolo în secolul al IV-lea, iar în al V-lea o bazilică cu mozaicuri de păsări și plante ale lacului și, înaintea altarului, coșul cu pâini între doi pești; A. E. Mader și A. M. Schneider au scos-o la lumină din 1932, iar biserica de azi, din anii 1980, a fost zidită după vechiul plan. Amintirea s-a fixat probabil pe malul de vest pentru că drumul pelerinilor trecea pe acolo; malul de est al Betsaidei lui Luca era departe de calea lor."
  bg:
    - "На брега на Галилейското езеро, на уединено място, което само Лука локализира: Исус се оттеглил с апостолите „в едно пусто место на града нарицаемия Витсаида“, в северния край на езерото, източно от устието на Йордан; точката на картата стои на Витсаида, на около 6 км североизточно от Капернаум по права линия. Християнската традиция от IV в. показва мястото при Табха, на северозападния бряг, западно от Капернаум, където църквата „Умножаването на хлебовете“ пази мозайката с хлябовете и рибите; много учени предпочитат с Лука североизточния бряг, а точното място е неизвестно."
    - "И четирите Евангелия разказват чудото — единственото, което споделят. Марко казва, че Исус повикал апостолите „на страна в пусто место“ и те отишли „с ладията на страна“, а народът „стекоха се там пеши от всичките градове, и пристигнаха преди тех“; имало „зелената трева“ за сядане, значи било пролет, а Йоан добавя, че Пасха била близо и мъжете били около пет хиляди, „освен жени и децата“, казва Матей. След това Исус „понуди учениците си да влезат в ладията, и да идат преди него отвъд към Витсаида“, докато при Йоан те прекосяват „отвъд морето в Капернаум“; на другия ден ладии от Тивериада дошли „близо до местото дето ядоха хлеба“. Прекосяване „към Витсаида“ след нахранване край Витсаида е загадката: тълкувателите четат думите на Марко като плаване покрай брега или поставят нахранването по-надолу по източния бряг, или при Табха, като тълкуват Витсаида на Лука свободно."
    - "Традицията при Табха, Хептапегон, „седем извора“, стига до времето на Егерия: бележката, запазена от Петър Дякон, казва, че при изворите има тревиста поляна, където Господ нахранил народа с пет хляба и две риби, и че камъкът, на който ги положил, бил превърнат в олтар. През IV в. там стояло малко светилище, а през V в. — базилика с мозайки на птиците и растенията на езерото и, пред олтара, кошницата с хлябове между две риби; А. Е. Мадер и А. М. Шнайдер я разкрили от 1932 г., а днешната църква от 80-те години е построена по стария план. Споменът вероятно се установил на западния бряг, защото там минавал поклонническият път; източният бряг на Витсаида от Лука лежал далеч от пътя им."
