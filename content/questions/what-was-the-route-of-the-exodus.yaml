id: what-was-the-route-of-the-exodus
question:
  en: "What was the route of the Exodus?"
  ru: "Каким путём шёл Исход?"
  uk: "Яким був маршрут Виходу?"
  es: "¿Cuál fue la ruta del Éxodo?"
  pt: "Qual foi a rota do Êxodo?"
  de: "Welchen Weg nahm der Auszug aus Ägypten?"
  fr: "Quel fut l’itinéraire de l’Exode ?"
  pl: "Którędy biegła droga Wyjścia?"
  it: "Qual fu il percorso dell’Esodo?"
  nl: "Wat was de route van de uittocht?"
  cs: "Kudy vedla cesta exodu?"
  sv: "Vilken var uttågets rutt?"
  nb: "Hva var ruten for uttoget?"
  tl: "Ano ang ruta ng Exodo?"
  da: "Hvad var ruten for udvandringen?"
answer:
  en:
    - "The Bible gives the stations, not the roads: Israel left Rameses in the eastern Nile Delta for Succoth and Etham, turned back to the sea and crossed it, went three days to Marah, then by Elim and Rephidim to Mount Sinai, which they reached in the third month; from Sinai they went by Kibroth-hattaavah and Hazeroth to Kadesh-barnea on the edge of the Negev; after thirty-eight years in the wilderness, by Mount Hor and the way of the Red Sea round Edom, up through Moab past the Arnon, Dibon and Heshbon to the plains of Moab at Shittim opposite Jericho. Summed in straight lines from station to station as the map places them, the way comes to about 1,250 km, more than three times the 383 km from Rameses to Shittim as the crow flies; Rameses to Sinai alone is about 325 km in a straight line."
    - "Exodus says that “God led them not through the way of the land of the Philistines, although that was near”, the coast road to Gaza, “but God led the people about, through the way of the wilderness of the Red sea”. Deuteronomy remarks: “There are eleven days' journey from Horeb by the way of mount Seir unto Kadesh-barnea”, about 240 km in a straight line, and adds that “the space in which we came from Kadesh-barnea, until we were come over the brook Zered, was thirty and eight years”. From Mount Hor “they journeyed from mount Hor by the way of the Red sea, to compass the land of Edom”, and at the end “the children of Israel set forward, and pitched in the plains of Moab on this side Jordan by Jericho”. Numbers 33 lists some forty camps in all."
    - "Only a few of the stations are placed with confidence: Rameses at Qantir, Succoth at Tell el-Maskhuta, Kadesh-barnea at the springs of Ain el-Qudeirat; the rest depend on where Mount Sinai is put, and the map follows the southern route to Jebel Musa, the tradition since the fourth century, while others lead Israel along the coast, across the middle of the peninsula, or into north-western Arabia. No camp has left traces that archaeology can date, and the map's year of 1446 BC is one convention; many scholars put the Exodus in the thirteenth century BC or doubt that it happened as told. The crossing of the sea and the site of Sinai are treated in their own questions."
  ru:
    - "Библия называет стоянки, а не дороги: Израиль вышел из Раамсеса в восточной дельте Нила в Сокхоф и Ефам, повернул к морю и перешёл его, три дня шёл до Мерры, затем через Елим и Рефидим к горе Синай, куда пришёл в третий месяц; от Синая — через Киброт-Гаттааву и Асироф в Кадес-Варни на краю Негева; после тридцати восьми лет в пустыне — через гору Ор и дорогой Чермного моря в обход Едома, вверх через Моав мимо Арнона, Дивона и Есевона на равнины Моава в Ситтим напротив Иерихона. Если сложить прямые отрезки от стоянки к стоянке, как их ставит карта, путь составит около 1250 км — втрое с лишним больше 383 км от Раамсеса до Ситтима по прямой; от Раамсеса до Синая по прямой около 325 км."
    - "Исход говорит, что «Бог не повел его по дороге земли Филистимской, потому что она близка» — это приморская дорога на Газу, — «обвел Бог народ дорогою пустынною к Чермному морю». Второзаконие замечает, что Кадес-Варни лежит «в расстоянии одиннадцати дней пути от Хорива, по дороге от горы Сеир», — около 240 км по прямой, — и добавляет: «С тех пор, как мы пошли в Кадес-Варни и как прошли долину Заред, минуло тридцать восемь лет». От горы Ор «отправились они путем Чермного моря, чтобы миновать землю Едома», и наконец «остановились на равнинах Моава, при Иордане, против Иерихона». Книга Чисел, глава 33, перечисляет около сорока станов."
    - "Лишь немногие стоянки привязаны уверенно: Раамсес — Кантир, Сокхоф — Телль-эль-Масхута, Кадес-Варни — источники Айн-эль-Кудейрат; остальное зависит от того, где искать Синай. Карта следует южному пути к Джебель-Муса, преданию с IV века, а другие ведут Израиль вдоль берега, через середину полуострова или в северо-западную Аравию. Ни одна стоянка не оставила следов, которые археология могла бы датировать, а 1446 г. до н. э. на карте — лишь одна из условностей: многие учёные относят Исход к XIII веку до н. э. или сомневаются, что он был таким, как рассказан. Переходу через море и месту Синая посвящены отдельные вопросы."
  uk:
    - "Біблія називає зупинки, а не дороги: Ізраїль вирушив із Раамсеса у східній дельті Нілу до Сокхоту й Етаму, повернув назад до моря й перейшов його, три дні йшов до Мерри, потім через Елім і Рефідім до гори Синай, куди дійшов у третьому місяці; від Синаю через Кіброт-Гаттааву й Хацерот до Кадесу на краю Негеву; після тридцяти восьми років у пустелі — через гору Гор і шляхом Червоного моря довкола Едому, угору через Моав повз Арнон, Дівон і Гесбон до моавських рівнин у Ситтімі навпроти Єрихону. Якщо підсумувати прямі лінії від зупинки до зупинки, як їх розміщує мапа, шлях становить близько 1250 км, більш ніж утричі більше за 383 км від Раамсеса до Ситтіма по прямій; лише від Раамсеса до Синаю — близько 325 км по прямій."
    - "Книга Вихід каже, що «не повів їх Бог по дорозї до землї Филистимської, хоч вона й близька», — приморської дороги на Газу, — «повів Бог люде по дорозї до степу Червономорського». Повторення Закону зауважує: «Одинайцять день ходи від Гореба, по дорозї від Сеїр-гори до Кадес-Барнеї», близько 240 км по прямій, і додає: «А часу того, що йшли ми від Кадес-Барне, покіль перебріли Серед-ріку, минуло трийцять і вісїм років». Від гори Гор «рушили дальше від Ор-гори шляхом до Червоного моря, щоб обминути Едом землю», а наприкінці «рушили сини Ізрайлеві та й отаборились на рівнинї Моабський, по другім боцї Йордана навпроти Єрихону». Числа 33 перелічує загалом близько сорока таборів."
    - "Лише кілька зупинок розміщено з упевненістю: Раамсес у Кантірі, Сокхот у Тель-ель-Мескхуті, Кадес біля джерел Айн-ель-Кудейрат; решта залежить від того, де розміщено гору Синай, а мапа йде південним маршрутом до Джебель-Муси, традиції від IV ст., тоді як інші ведуть Ізраїль уздовж узбережжя, через середину півострова чи в північно-західну Аравію. Жоден табір не залишив слідів, які археологія могла б датувати, а рік мапи, 1446 до н. е., — одна з умовностей; багато вчених відносять Вихід до XIII ст. до н. е. або сумніваються, що він був таким, як розповідається. Перехід через море і місце Синаю розглянуто в окремих питаннях."
  es:
    - "La Biblia da las estaciones, no los caminos: Israel salió de Ramesés, en el este del delta del Nilo, hacia Sucot y Etam, volvió hacia el mar y lo cruzó, anduvo tres días hasta Mara, luego por Elim y Refidim hasta el monte Sinaí, adonde llegaron en el mes tercero; desde el Sinaí fueron por Kibrot-hataava y Haserot hasta Cades-barnea, en el borde del Négev; tras treinta y ocho años en el desierto, por el monte Hor y el camino del mar Rojo rodeando Edom, subiendo por Moab pasando el Arnón, Dibón y Hesbón hasta las llanuras de Moab, en Sitim, frente a Jericó. Sumando en líneas rectas de estación en estación según las sitúa el mapa, el camino llega a unos 1250 km, más de tres veces los 383 km que hay en línea recta de Ramesés a Sitim; solo de Ramesés al Sinaí hay unos 325 km en línea recta."
    - "Éxodo dice que «Dios no los llevó por el camino de la tierra de los Filisteos, que estaba cerca», la ruta de la costa hacia Gaza, sino que «hizo Dios al pueblo que rodease por el camino del desierto del mar Bermejo». Deuteronomio observa: «Once jornadas hay desde Horeb, camino del monte de Seir, hasta Cades-barnea», unos 240 km en línea recta, y añade que «los días que anduvimos de Cades-barnea hasta que pasamos el arroyo de Zered, fueron treinta y ocho años». Desde el monte Hor «partieron del monte de Hor, camino del mar Bermejo, para rodear la tierra de Edom», y al final «movieron los hijos de Israel, y asentaron en los campos de Moab, de esta parte del Jordán de Jericó». Números 33 enumera unos cuarenta campamentos en total."
    - "Solo unas pocas estaciones se sitúan con seguridad: Ramesés en Qantir, Sucot en Tell el-Maskhuta, Cades-barnea en las fuentes de Ain el-Qudeirat; el resto depende de dónde se ponga el monte Sinaí, y el mapa sigue la ruta del sur hasta el Jebel Musa, la tradición desde el siglo IV, mientras que otros llevan a Israel por la costa, a través del centro de la península o hacia el noroeste de Arabia. Ningún campamento ha dejado huellas que la arqueología pueda fechar, y el año 1446 a. C. del mapa es una convención; muchos estudiosos sitúan el Éxodo en el siglo XIII a. C. o dudan de que ocurriera como se cuenta. El cruce del mar y el emplazamiento del Sinaí se tratan en sus propias preguntas."
  pt:
    - "A Bíblia dá as paradas, não as estradas: Israel partiu de Ramessés, no leste do delta do Nilo, para Sucote e Etã, voltou ao mar e o atravessou, andou três dias até Mara, depois por Elim e Refidim até o monte Sinai, que alcançou no terceiro mês; do Sinai foi por Quibrote-Hataavá e Hazerote até Cades-Barneia, na orla do Neguebe; após trinta e oito anos no deserto, pelo monte Hor e o caminho do mar Vermelho, contornando Edom, subiu por Moabe, passando por Arnom, Dibom e Hesbom, até as planícies de Moabe, em Sitim, defronte de Jericó. Somadas em linha reta de parada em parada, como o mapa as situa, a rota chega a cerca de 1.250 km, mais de três vezes os 383 km de Ramessés a Sitim em linha reta; só de Ramessés ao Sinai são cerca de 325 km em linha reta."
    - "Êxodo diz que “Deus não os guiou pelo caminho da terra dos filisteus, embora fosse mais perto”, a estrada da costa para Gaza, “mas Deus fez o povo dar a volta pelo caminho do deserto, perto do Mar Vermelho”. Deuteronômio observa: “São onze dias de jornada desde Horebe, pelo caminho do monte Seir, até Cades-Barneia”, cerca de 240 km em linha reta, e acrescenta que “os dias em que caminhamos desde Cades-Barneia até atravessarmos o ribeiro de Zerede foram trinta e oito anos”. Do monte Hor “viajaram do monte Hor pelo caminho do mar Vermelho, para contornar a terra de Edom”, e no fim “os filhos de Israel partiram e acamparam nas campinas de Moabe, do outro lado do Jordão, na altura de Jericó”. Números 33 lista ao todo uns quarenta acampamentos."
    - "Poucas paradas são situadas com segurança: Ramessés em Qantir, Sucote em Tell el-Maskhuta, Cades-Barneia nas fontes de Ain el-Qudeirat; as demais dependem de onde se põe o monte Sinai, e o mapa segue a rota do sul até Jebel Musa, a tradição desde o século IV, enquanto outros levam Israel pela costa, pelo meio da península ou para o noroeste da Arábia. Nenhum acampamento deixou vestígios que a arqueologia possa datar, e o ano de 1446 a.C. do mapa é uma convenção; muitos estudiosos situam o Êxodo no século XIII a.C. ou duvidam de que tenha ocorrido como narrado. A travessia do mar e o local do Sinai são tratados em perguntas próprias."
  de:
    - "Die Bibel nennt die Stationen, nicht die Straßen: Israel zog von Ramses im östlichen Nildelta nach Sukkot und Etam, wandte sich zum Meer zurück und durchquerte es, ging drei Tage nach Mara, dann über Elim und Refidim zum Berg Sinai, den es im dritten Monat erreichte; vom Sinai ging es über Kibrot-Taawa und Hazerot nach Kadesch-Barnea am Rand des Negev; nach achtunddreißig Jahren in der Wüste über den Berg Hor und den Weg zum Roten Meer um Edom herum, durch Moab hinauf, an Arnon, Dibon und Heschbon vorbei, zu den Ebenen Moabs bei Schittim gegenüber Jericho. In geraden Linien von Station zu Station, wie die Karte sie setzt, summiert sich der Weg auf etwa 1250 km, mehr als das Dreifache der 383 km Luftlinie von Ramses nach Schittim; Ramses bis Sinai allein sind in der Luftlinie etwa 325 km."
    - "Im 2. Buch Mose heißt es, „führte sie Gott nicht auf der Straße durch der Philister Land, die am nächsten war“, der Küstenstraße nach Gaza, sondern: „Darum führte er das Volk um auf die Straße durch die Wüste am Schilfmeer“. Das 5. Buch Mose bemerkt: „Elf Tagereisen von Horeb, durch den Weg des Gebirges Seir, bis gen Kades-Barnea“, etwa 240 km in der Luftlinie, und fügt hinzu: „Die Zeit aber, die wir von Kades-Barnea zogen, bis wir durch den Bach Sered kamen, war achtunddreißig Jahre“. Vom Berg Hor „zogen sie ... auf dem Wege gegen das Schilfmeer, daß sie um der Edomiter Land hinzögen“, und am Ende „zogen die Kinder Israel und lagerten sich in das Gefilde Moab jenseit des Jordans, gegenüber Jericho“. 4. Mose 33 zählt insgesamt etwa vierzig Lager auf."
    - "Nur wenige der Stationen lassen sich sicher verorten: Ramses bei Qantir, Sukkot bei Tell el-Maschuta, Kadesch-Barnea an den Quellen von Ain el-Qudeirat; die übrigen hängen davon ab, wo man den Berg Sinai ansetzt, und die Karte folgt der südlichen Route zum Dschebel Musa, der Überlieferung seit dem 4. Jahrhundert, während andere Israel an der Küste entlang, quer über die Mitte der Halbinsel oder nach Nordwestarabien führen. Kein Lager hat Spuren hinterlassen, die die Archäologie datieren könnte, und das Kartenjahr 1446 v. Chr. ist eine Konvention; viele Gelehrte setzen den Auszug ins 13. Jahrhundert v. Chr. oder bezweifeln, dass er sich wie erzählt ereignete. Die Durchquerung des Meeres und die Lage des Sinai werden in eigenen Fragen behandelt."
  fr:
    - "La Bible donne les stations, non les routes : Israël quitta Ramsès, dans l’est du delta du Nil, pour Succoth et Étham, revint vers la mer et la traversa, fit trois jours de marche jusqu’à Mara, puis par Élim et Rephidim gagna le mont Sinaï, atteint au troisième mois ; du Sinaï, il alla par Kibroth-Hattaava et Hatséroth à Kadès-Barnéa, en lisière du Néguev ; après trente-huit ans dans le désert, par le mont Hor et le chemin de la mer Rouge autour d’Édom, il remonta par Moab, passant l’Arnon, Dibon et Hesbon, jusqu’aux plaines de Moab à Sittim, en face de Jéricho. Additionné en lignes droites de station en station comme la carte les place, le trajet atteint environ 1 250 km, plus de trois fois les 383 km de Ramsès à Sittim à vol d’oiseau ; de Ramsès au Sinaï seulement, environ 325 km en ligne droite."
    - "L’Exode dit que « Dieu ne le conduisit point par le chemin du pays des Philistins, quoique le plus proche », la route côtière de Gaza, « mais Dieu fit faire au peuple un détour par le chemin du désert, vers la mer Rouge ». Le Deutéronome remarque : « Il y a onze journées depuis Horeb, par le chemin de la montagne de Séir, jusqu’à Kadès-Barnéa », environ 240 km en ligne droite, et ajoute que « le temps que durèrent nos marches de Kadès-Barnéa au passage du torrent de Zéred fut de trente-huit ans ». Du mont Hor, « ils partirent de la montagne de Hor par le chemin de la mer Rouge, pour contourner le pays d’Édom », et à la fin « les enfants d’Israël partirent, et ils campèrent dans les plaines de Moab, au-delà du Jourdain, vis-à-vis de Jéricho ». Nombres 33 énumère une quarantaine de campements en tout."
    - "Seules quelques stations sont situées avec certitude : Ramsès à Qantir, Succoth à Tell el-Maskhouta, Kadès-Barnéa aux sources d’Aïn el-Qoudeirat ; les autres dépendent de l’emplacement du mont Sinaï, et la carte suit la route du sud jusqu’au Djebel Moussa, tradition depuis le IVe siècle, tandis que d’autres mènent Israël le long de la côte, à travers le milieu de la péninsule ou jusqu’au nord-ouest de l’Arabie. Aucun campement n’a laissé de traces que l’archéologie puisse dater, et l’année 1446 av. J.-C. de la carte est une convention ; nombre de savants placent l’Exode au XIIIe siècle av. J.-C. ou doutent qu’il ait eu lieu comme on le raconte. La traversée de la mer et le site du Sinaï sont traités dans des questions à part."
  pl:
    - "Biblia podaje stacje, nie drogi: Izrael wyszedł z Ramses we wschodniej Delcie Nilu do Sukkot i Etam, zawrócił nad morze i przeszedł je, szedł trzy dni do Mara, potem przez Elim i Refidim do Góry Synaj, którą osiągnął w trzecim miesiącu; z Synaju przez Kibrot-Hattaawa i Chasserot do Kadesz-Barnea na skraju Negewu; po trzydziestu ośmiu latach na pustyni przez Górę Hor i drogą Morza Czerwonego wokół Edomu, przez Moab obok Arnonu, Dibon i Cheszbon do równin Moabu w Szittim naprzeciw Jerycha. Zsumowana liniami prostymi od stacji do stacji, jak je umieszcza mapa, droga wynosi około 1250 km, ponad trzy razy więcej niż 383 km z Ramses do Szittim w linii prostej; sam odcinek z Ramses do Synaju to około 325 km w linii prostej."
    - "Księga Wyjścia mówi, że „nie prowadził ich Bóg drogą ziemi Filistyńskiej, chociaż bliższa była”, szlakiem nadbrzeżnym do Gazy, „ale obwodził Bóg lud drogą pustyni nad morzem czerwonem”. Księga Powtórzonego Prawa zauważa: „A jest jedenaście dni drogi od Horebu przez górę Seir aż do Kades Barne”, około 240 km w linii prostej, i dodaje: „A czasu, któregośmy chodzili od Kades Barne, ażeśmy się przeprawili przez potok Zared, było trzydzieści i osiem lat”. Po Górze Hor: „ruszyli się od góry Hor drogą ku morzu czerwonemu, aby obeszli ziemię Edomską”, a na końcu „ruszyli się synowie Izraelscy, i położyli się obozem na polach Moabskich, z tej strony Jordanu przeciw Jerychowi”. Księga Liczb 33 wylicza w sumie około czterdziestu obozów."
    - "Tylko kilka stacji da się umieścić z pewnością: Ramses w Qantir, Sukkot w Tell el-Maskhuta, Kadesz-Barnea przy źródłach Ajn el-Kudejrat; reszta zależy od tego, gdzie umieszcza się Górę Synaj, a mapa idzie za trasą południową do Dżabal Musa, tradycją od IV wieku, podczas gdy inni prowadzą Izraela wybrzeżem, środkiem półwyspu albo do północno-zachodniej Arabii. Żaden obóz nie zostawił śladów, które archeologia mogłaby datować, a rok 1446 p.n.e. na mapie jest jedną z konwencji; wielu uczonych umieszcza Wyjście w XIII wieku p.n.e. albo wątpi, że wydarzyło się tak, jak je opowiedziano. Przejście przez morze i położenie Synaju omawiają osobne pytania."
  it:
    - "La Bibbia dà le tappe, non le strade: Israele lasciò Ramses, nel Delta orientale del Nilo, per Succot ed Etam, tornò indietro verso il mare e lo attraversò, andò per tre giorni fino a Mara, poi per Elim e Refidim fino al Monte Sinai, che raggiunse nel terzo mese; dal Sinai andò per Kibrot-Taava e Cazerot fino a Kades-Barnea al margine del Negev; dopo trentotto anni nel deserto, per il Monte Or e la via del Mar Rosso attorno a Edom, su attraverso Moab oltre l’Arnon, Dibon e Chesbon fino alle pianure di Moab a Sittim, di fronte a Gerico. Sommando in linee rette da tappa a tappa come le colloca la mappa, il percorso arriva a circa 1.250 km, più di tre volte i 383 km in linea d’aria da Ramses a Sittim; da Ramses al Sinai soltanto sono circa 325 km in linea retta."
    - "L’Esodo dice che «Iddio non lo condusse per la via del paese de’ Filistei, perché troppo vicina», la strada costiera per Gaza, «ma Iddio fece fare al popolo un giro per la via del deserto, verso il mar Rosso». Il Deuteronomio osserva: «Vi sono undici giornate dallo Horeb, per la via del monte Seir, fino a Kades-Barnea», circa 240 km in linea retta, e aggiunge che «il tempo che durarono le nostre marce, da Kades-Barnea al passaggio del torrente di Zered, fu di trentotto anni». Dal Monte Or «gl’Israeliti si partirono dal monte Hor, movendo verso il mar Rosso per fare il giro del paese di Edom», e alla fine «i figliuoli d’Israele partirono e si accamparono nelle pianure di Moab, oltre il Giordano di Gerico». Numeri 33 elenca in tutto una quarantina di accampamenti."
    - "Solo pochi dei luoghi di sosta sono collocati con sicurezza: Ramses a Qantir, Succot a Tell el-Maskhuta, Kades-Barnea alle sorgenti di Ain el-Qudeirat; gli altri dipendono da dove si colloca il Monte Sinai, e la mappa segue il percorso meridionale fino al Gebel Musa, la tradizione dal IV secolo, mentre altri conducono Israele lungo la costa, attraverso il centro della penisola o nell’Arabia nord-occidentale. Nessun accampamento ha lasciato tracce che l’archeologia possa datare, e l’anno 1446 a.C. della mappa è una convenzione; molti studiosi collocano l’Esodo nel XIII secolo a.C. o dubitano che sia avvenuto come raccontato. L’attraversamento del mare e il sito del Sinai sono trattati in domande a sé."
  nl:
    - "De Bijbel geeft de stations, niet de wegen: Israël vertrok uit Raämses in de oostelijke Nijldelta naar Sukkot en Etam, keerde terug naar de zee en stak haar over, ging drie dagen naar Mara, daarna via Elim en Refidim naar de berg Sinaï, die zij in de derde maand bereikten; van de Sinaï gingen zij via Kibrot-Hattaäva en Hazerot naar Kades-Barnea aan de rand van de Negev; na achtendertig jaar in de woestijn via de berg Hor en de weg van de Rode Zee rond Edom, omhoog door Moab langs de Arnon, Dibon en Chesbon naar de vlakten van Moab bij Sittim tegenover Jericho. Opgeteld in rechte lijnen van station tot station zoals de kaart ze plaatst, komt de weg op ongeveer 1.250 km, ruim drie keer de 383 km van Raämses naar Sittim hemelsbreed; alleen al Raämses naar de Sinaï is hemelsbreed ongeveer 325 km."
    - "Exodus zegt: “zo leidde hen God niet op den weg van het land der Filistijnen, hoewel die nader was”, de kustweg naar Gaza, “maar God leidde het volk om, langs den weg van de woestijn der Schelfzee”. Deuteronomium merkt op: “Elf dag reizen zijn het van Horeb, door den weg van het gebergte Seir, tot aan Kades-Barnea”, hemelsbreed ongeveer 240 km, en voegt eraan toe: “de dagen nu, die wij gewandeld hebben van Kades-Barnea, totdat wij over de beek Zered getogen zijn, waren acht en dertig jaren”. Vanaf de berg Hor “reisden zij van den berg Hor, op den weg der Schelfzee, dat zij om het land der Edomieten heentogen”, en aan het eind “reisden de kinderen van Israël, en legerden zich in de vlakke velden van Moab, aan deze zijde van de Jordaan van Jericho”. Numeri 33 somt in totaal ongeveer veertig kampen op."
    - "Slechts enkele stations worden met zekerheid geplaatst: Raämses bij Qantir, Sukkot bij Tell el-Maskhuta, Kades-Barnea bij de bronnen van Ain el-Qudeirat; de rest hangt af van waar men de berg Sinaï plaatst, en de kaart volgt de zuidelijke route naar de Jebel Musa, de traditie sinds de vierde eeuw, terwijl anderen Israël langs de kust laten trekken, dwars over het midden van het schiereiland of naar Noordwest-Arabië. Geen enkel kamp heeft sporen nagelaten die de archeologie kan dateren, en het jaar 1446 v.Chr. op de kaart is één conventie; veel geleerden plaatsen de uittocht in de 13e eeuw v.Chr. of betwijfelen dat hij zo is gebeurd als verteld. De doortocht door de zee en de plaats van de Sinaï worden in eigen vragen behandeld."
  cs:
    - "Bible uvádí stanice, nikoli silnice: Izrael vyšel z Ramesse ve východní Nilské deltě do Sukotu a Etamu, obrátil se zpět k moři a přešel je, tři dny šel do Máry, pak přes Élim a Refídim k hoře Sinaj, kterou dosáhl ve třetím měsíci; od Sinaje přes Kibrót-hataavu a Chacerót do Kádeš-barnea na okraji Negevu; po osmatřiceti letech na poušti přes horu Hor a cestou k Rudému moři kolem Edómu, vzhůru Moábem kolem Arnonu, Dibonu a Chešbónu na pláně Moábu u Šitimu naproti Jerichu. Sečteno přímými čarami od stanice ke stanici, jak je mapa umisťuje, vychází cesta na asi 1 250 km, více než třikrát tolik, kolik činí 383 km vzdušnou čarou z Ramesse do Šitimu; samotná cesta z Ramesse k Sinaji měří vzdušnou čarou asi 325 km."
    - "Exodus říká, že „nevedl jich Bůh cestou země Filistinské, ačkoli bližší byla“, pobřežní silnicí do Gazy, „ale obvedl Bůh lid cestou přes poušť, kteráž jest při moři Rudém“. Deuteronomium poznamenává: „Jedenácte dní cesty jest od Oréb přes hory Seir až do Kádesbarne“, vzdušnou čarou asi 240 km, a dodává: „Času pak, v němž jsme šli z Kádesbarne, až jsme přešli potok Záred, bylo let třidceti osm“. Od hory Hor „hnuli se s hory Hor cestou k moři Rudému, aby obešli zemi Idumejskou“ a nakonec „táhli synové Izraelští a položili se na polích Moábských, nedocházeje k Jordánu, naproti Jerichu“. Čísla 33 uvádějí celkem asi čtyřicet táborů."
    - "S jistotou je umístěno jen několik stanic: Ramesse v Kantíru, Sukot v Tell al-Maskhúta, Kádeš-barnea u pramenů Ajn Qudejrát; ostatní závisejí na tom, kam se klade hora Sinaj, a mapa sleduje jižní trasu k Džebel Músá, tradici od 4. století, zatímco jiní vedou Izrael podél pobřeží, středem poloostrova nebo do severozápadní Arábie. Žádný tábor nezanechal stopy, které by archeologie mohla datovat, a rok 1446 př. n. l. na mapě je jednou z konvencí; mnozí badatelé kladou exodus do 13. století př. n. l. nebo pochybují, že se stal tak, jak se vypráví. Přechod moře a místo Sinaje se probírají ve vlastních otázkách."
  sv:
    - "Bibeln anger stationerna, inte vägarna: Israel lämnade Rameses i östra Nildeltat för Suckot och Etam, vände tillbaka till havet och gick över det, gick tre dagar till Mara, sedan via Elim och Refidim till Sinaiberget, som de nådde i tredje månaden; från Sinai gick de via Kivrot-Hattaava och Haserot till Kadesh-Barnea i utkanten av Negev; efter trettioåtta år i öknen, via berget Hor och vägen mot Sävhavet runt Edom, upp genom Moab förbi Arnon, Dibon och Heshbon till Moabs hedar vid Shittim mitt emot Jeriko. Summerat i raka linjer från station till station som kartan placerar dem blir vägen omkring 1 250 km, mer än tre gånger de 383 km från Rameses till Shittim fågelvägen; enbart Rameses till Sinai är omkring 325 km fågelvägen."
    - "2 Mosebok säger att Gud förde dem ”icke på den väg som gick igenom filistéernas land, fastän denna var den genaste”, kustvägen till Gaza, utan att Gud ”lät folket taga en omväg genom öknen åt Röda havet till”. 5 Mosebok anmärker: ”elva dagsresor från Horeb, åt Seirs bergsbygd till, fram till Kades-Barnea”, omkring 240 km fågelvägen, och tillägger att ”den tid som åtgick för vår vandring från Kades-Barnea, till dess vi gingo över bäcken Sered, var trettioåtta år”. Från berget Hor ”bröto [de] upp ... och togo vägen åt Röda havet till, för att gå omkring Edoms land”, och till slut ”Israels barn bröto upp och lägrade sig på Moabs hedar, på andra sidan Jordan mitt emot Jeriko”. 4 Mosebok 33 förtecknar sammanlagt omkring fyrtio lägerplatser."
    - "Bara några av stationerna är placerade med säkerhet: Rameses vid Qantir, Suckot vid Tell el-Maskhuta, Kadesh-Barnea vid källorna Ain el-Qudeirat; resten beror på var Sinaiberget förläggs, och kartan följer den södra rutten till Jebel Musa, traditionen sedan 300-talet, medan andra låter Israel följa kusten, korsa halvöns mitt eller dra in i nordvästra Arabien. Ingen lägerplats har lämnat spår som arkeologin kan datera, och kartans år 1446 f.Kr. är en konvention; många forskare förlägger uttåget till 1200-talet f.Kr. eller betvivlar att det skedde som det berättas. Havets övergång och Sinais läge behandlas i egna frågor."
  nb:
    - "Bibelen gir stasjonene, ikke veiene: Israel forlot Ramses i det østlige Nildeltaet for Sukkot og Etam, vendte tilbake mot havet og krysset det, gikk tre dager til Mara, så via Elim og Refidim til Sinai, som de nådde i den tredje måneden; fra Sinai gikk de via Kibrot-Hattaava og Haserot til Kadesj-Barnea i utkanten av Negev; etter trettiåtte år i ørkenen, via Hor-fjellet og veien mot Rødehavet rundt Edom, opp gjennom Moab forbi Arnon, Dibon og Hesjbon til Moabs sletter ved Sjittim midt imot Jeriko. Summert i rette linjer fra stasjon til stasjon slik kartet plasserer dem, blir veien omtrent 1 250 km, mer enn tre ganger de 383 km fra Ramses til Sjittim i luftlinje; Ramses til Sinai alene er omtrent 325 km i luftlinje."
    - "2 Mosebok sier at «da førte Gud dem ikke på veien til filistrenes land, skjønt den var den nærmeste», kystveien til Gasa, «Men Gud lot folket ta omveien gjennem ørkenen mot det Røde Hav». 5 Mosebok bemerker: «elleve dagsreiser fra Horeb efter den vei som fører til Se'ir-fjellene, til Kades-Barnea», omtrent 240 km i luftlinje, og tilføyer at «Den tid vi var på vandring fra Kades-Barnea, til vi gikk over Sered-bekken, var åtte og tretti år». Fra Hor-fjellet «brøt de op fra fjellet Hor og tok veien til det Røde Hav for å dra omkring Edoms land», og til slutt «brøt Israels barn op og leiret sig på Moabs ødemarker på hin side Jordan midt imot Jeriko». 4 Mos 33 lister opp omtrent førti leirplasser til sammen."
    - "Bare noen få av stasjonene er plassert med sikkerhet: Ramses ved Qantir, Sukkot ved Tell el-Maskhuta, Kadesj-Barnea ved kildene Ain el-Qudeirat; resten avhenger av hvor Sinai plasseres, og kartet følger den sørlige ruten til Jebel Musa, tradisjonen siden 300-tallet, mens andre fører Israel langs kysten, tvers over midten av halvøya eller inn i det nordvestlige Arabia. Ingen leir har etterlatt spor som arkeologien kan datere, og kartets år 1446 f.Kr. er én konvensjon; mange forskere plasserer uttoget på 1200-tallet f.Kr. eller tviler på at det skjedde slik det er fortalt. Kryssingen av havet og stedet for Sinai behandles i egne spørsmål."
  tl:
    - "Ibinibigay ng Biblia ang mga istasyon, hindi ang mga daan: umalis ang Israel sa Rameses sa silangang Delta ng Nilo patungong Succoth at Etham, bumalik sa dagat at tumawid dito, naglakbay ng tatlong araw hanggang sa Mara, pagkatapos ay sa Elim at Rephidim hanggang sa Bundok Sinai, na narating nila sa ikatlong buwan; mula sa Sinai ay sa Kibroth-hattaavah at Haseroth hanggang sa Cades-barnea sa gilid ng Negev; pagkatapos ng tatlumpu't walong taon sa ilang, sa Bundok Hor at sa daan ng Dagat na Pula paikot sa Edom, paakyat sa Moab sa Arnon, Dibon at Hesbon hanggang sa mga kapatagan ng Moab sa Sittim sa tapat ng Jerico. Pinagsama sa tuwid na guhit mula istasyon hanggang istasyon ayon sa mapa, umaabot ito sa mga 1,250 km, mahigit tatlong ulit ng 383 km mula Rameses hanggang Sittim sa tuwid na guhit; ang Rameses hanggang Sinai lamang ay mga 325 km."
    - "Ayon sa Exodo, “hindi sila pinatnubayan ng Dios sa daang patungo sa lupain ng mga Filisteo, bagaman malapit”, ang daan sa baybayin patungong Gaza, “kundi pinatnubayan ng Dios ang bayan sa palibot, sa daang patungo sa ilang sa tabi ng Dagat na Mapula”. Sabi ng Deuteronomio: “Labing isang araw na lakbayin mula sa Horeb kung dadaan ng bundok ng Seir hanggang sa Cades-barnea”, mga 240 km sa tuwid na guhit; at “ang mga araw na ating ipinaglakad mula sa Cades-barnea hanggang sa tayo'y nakarating sa batis ng Zered, ay tatlong pu't walong taon”. Mula sa Bundok Hor, “sila'y naglakbay mula sa bundok ng Hor na napasa daang patungo sa Dagat na Mapula upang lumiko sa lupain ng Edom”, at “ang mga anak ni Israel ay naglakbay at humantong sa mga kapatagan ng Moab sa dako roon ng Jordan na nasa tapat ng Jerico”. Inililista ng Mga Bilang 33 ang mga apatnapung kampamento."
    - "Kaunti lamang sa mga istasyon ang nailalagay nang may katiyakan: ang Rameses sa Qantir, ang Succoth sa Tell el-Maskhuta, ang Cades-barnea sa mga bukal ng Ain el-Qudeirat; ang iba ay nakasalalay sa kung saan inilalagay ang Bundok Sinai, at sinusunod ng mapa ang rutang timog patungong Jebel Musa, ang tradisyon mula pa noong ikaapat na siglo, samantalang ang iba ay inaakay ang Israel sa baybayin, sa gitna ng tangway, o sa hilagang-kanlurang Arabia. Walang kampamentong nag-iwan ng bakas na maitatakda ng arkeolohiya, at ang taon ng mapa na 1446 BK ay isang kombensiyon; inilalagay ng maraming iskolar ang Exodo sa ikalabintatlong siglo BK o pinagdududahan na nangyari ito ayon sa salaysay. Tinatalakay sa sarili nilang mga tanong ang pagtawid sa dagat at ang pook ng Sinai."
  da:
    - "Bibelen giver stationerne, ikke vejene: Israel forlod Ramses i det østlige Nildelta til Sukkot og Etam, vendte tilbage mod havet og krydsede det, gik tre dage til Mara, derefter forbi Elim og Refidim til Sinajbjerget, som de nåede i den tredje måned; fra Sinaj gik de forbi Kibrot-ha-Ta'ava og Haserot til Kadesj-Barnea på kanten af Negev; efter otteogtredive år i ørkenen forbi bjerget Hor og Det Røde Havs vej rundt om Edom, op gennem Moab forbi Arnon, Dibon og Hesjbon til Moabs sletter ved Sjittim lige over for Jeriko. Lagt sammen i rette linjer fra station til station, som kortet placerer dem, bliver vejen omkring 1.250 km, mere end tre gange de 383 km fra Ramses til Sjittim i luftlinje; Ramses til Sinaj alene er omkring 325 km i luftlinje."
    - "Anden Mosebog siger: »da førte Gud dem ikke ad Vejen til Filistrene, skønt den var nærmest«, kystvejen til Gaza, »Og Gud førte Folket omkring ad Vejen igennem Ørkenen mod det røde Hav«. Femte Mosebog bemærker: »elleve Dages Rejse fra Horeb til Seirs Bjerge, indtil Kades-Barnea«, omkring 240 km i luftlinje, og tilføjer, at »de Dage, vi have vandret fra Kades-Barnea, indtil vi kom over Bækken Sered, vare otte og tredive Aar«. Fra bjerget Hor »rejste de fra det Bjerg Hor paa Vejen til det røde Hav, for at drage omkring Edoms Land«, og til sidst »Israels Børn rejste derfra; og de lejrede sig paa Moabiternes slette Marker, paa hin Side Jordanen mod Jeriko«. Fjerde Mosebog 33 opregner i alt omkring fyrre lejre."
    - "Kun få af stationerne er placeret med sikkerhed: Ramses ved Qantir, Sukkot ved Tell el-Maskhuta, Kadesj-Barnea ved kilderne i Ajin el-Qudeirat; resten afhænger af, hvor Sinajbjerget placeres, og kortet følger den sydlige rute til Jebel Musa, traditionen siden 300-tallet, mens andre fører Israel langs kysten, tværs over midten af halvøen eller ind i det nordvestlige Arabien. Ingen lejr har efterladt spor, som arkæologien kan datere, og kortets år 1446 f.Kr. er én konvention; mange forskere placerer udvandringen i 1200-tallet f.Kr. eller betvivler, at den fandt sted som fortalt. Havets overgang og Sinajs placering behandles i deres egne spørgsmål."
