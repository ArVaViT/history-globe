id: where-was-bethel
question:
  en: "Where was Bethel?"
  ru: "Где находился Вефиль?"
  uk: "Де був Бет-Ел?"
  es: "¿Dónde estaba Betel?"
  pt: "Onde ficava Betel?"
  de: "Wo lag Bethel?"
  fr: "Où se trouvait Béthel ?"
  pl: "Gdzie leżał Betel?"
  it: "Dov’era Betel?"
  nl: "Waar lag Bethel?"
  cs: "Kde byl Bét-el?"
  sv: "Var låg Betel?"
  nb: "Hvor lå Betel?"
  tl: "Saan ang Beth-el?"
  da: "Hvor lå Betel?"
  sr: "Где је био Ветиљ?"
  hu: "Hol volt Bétel?"
  fi: "Missä Betel oli?"
  vi: "Bê-tên ở đâu?"
  ro: "Unde se afla Betelul?"
  bg: "Къде се е намирал Ветил?"
answer:
  en:
    - "Bethel stood in the hills about 16 km north of Jerusalem in a straight line, on the watershed road that runs along the ridge, near the border between the lands of Benjamin and Ephraim. Most scholars identify it with the village of Beitin, north of Ramallah in the West Bank, where the map's point stands; other sites have been proposed, and the point is marked as disputed."
    - 'In Genesis Abraham pitches his tent between Bethel and Ai and builds an altar, and Jacob, sleeping there on his way to Haran, dreams of a ladder reaching to heaven: "And he called the name of that place Beth-el: but the name of that city was called Luz at the first." When the kingdom divided, Jeroboam made Bethel the royal sanctuary of Israel: "And he set the one in Beth-el, and the other put he in Dan", the two golden calves. Amos prophesied there against the house of Jeroboam II, and Josiah later tore down its altar.'
    - "W. F. Albright and J. L. Kelso excavated at Beitin between 1927 and 1960 and found a walled town of the Middle Bronze Age and a burned town of the Late Bronze Age; the dating of several layers has been questioned since. In the fourth century Eusebius knew Bethel as a village twelve Roman miles from Jerusalem, about 18 km, on the road to Neapolis (Shechem). Shiloh, where the tabernacle stood, lies about 15 km further north along the same hills."
  ru:
    - "Вефиль стоял в горах примерно в 16 км к северу от Иерусалима по прямой, на дороге, идущей по водоразделу вдоль хребта, у границы земель Вениамина и Ефрема. Большинство учёных отождествляют его с деревней Бейтин к северу от Рамаллы на Западном берегу, где и стоит точка карты; предлагались и другие места, и точка помечена как спорная."
    - "В Книге Бытия Авраам ставит шатёр между Вефилем и Гаем и строит жертвенник, а Иаков, заночевав здесь по пути в Харран, видит во сне лестницу до неба: «И нарек Иаков имя месту тому: Вефиль, а прежнее имя того города было: Луз». При разделении царства Иеровоам сделал Вефиль царским святилищем Израиля: «И поставил одного в Вефиле, а другого в Дане» — двух золотых тельцов. Здесь пророчествовал Амос против дома Иеровоама II, а позднее Иосия разрушил здешний жертвенник."
    - "У. Ф. Олбрайт и Дж. Л. Келсо вели в Бейтине раскопки с 1927 по 1960 год и нашли обнесённый стеной город среднего бронзового века и сгоревший город позднего бронзового века; датировки нескольких слоёв с тех пор оспариваются. В IV веке Евсевий знал Вефиль как селение в двенадцати римских милях от Иерусалима, около 18 км, по дороге на Неаполис (Сихем). Силом, где стояла скиния, лежит примерно в 15 км дальше на север по тем же горам."
  uk:
    - "Бет-Ел стояв у пагорбах приблизно за 16 км на північ від Єрусалиму по прямій, на вододільній дорозі, що йде вздовж хребта, поблизу кордону між землями Веніямина й Єфрема. Більшість учених ототожнює його з селом Бейтін, на північ від Рамалли на Західному березі, де стоїть точка мапи; запропоновано й інші місця, і точка позначена як спірна."
    - "У Книзі Буття Авраам ставить намет між Бет-Елом і Гаєм і будує жертовник, а Яків, спочиваючи там на шляху до Харана, бачить драбину, що сягає неба: «І прозвав Яков урочище то Бетель; прежне прізвище городу було Луз». Коли царство розділилося, Єровоам зробив Бет-Ел царською святинею Ізраїлю: «І поставив одно в Бетелї, друге ж у Данї» — двох золотих тельців. Амос пророкував там проти дому Єровоама II, а Йосія згодом зруйнував його жертовник."
    - "В. Ф. Олбрайт і Дж. Л. Келсо розкопували в Бейтіні між 1927 і 1960 рр. і знайшли мурове місто середньої бронзи й спалене місто пізньої бронзи; датування кількох шарів відтоді оскаржують. У IV ст. Євсевій знав Бет-Ел як село за дванадцять римських миль від Єрусалиму, близько 18 км, на дорозі до Неаполя (Сихему). Шіло, де стояла скинія, лежить приблизно за 15 км далі на північ тими самими пагорбами."
  es:
    - "Betel se alzaba en las colinas, a unos 16 km al norte de Jerusalén en línea recta, en el camino de la divisoria que sigue la cresta, cerca de la frontera entre las tierras de Benjamín y Efraín. La mayoría de los estudiosos la identifica con la aldea de Beitín, al norte de Ramala, en Cisjordania, donde está el punto del mapa; se han propuesto otros lugares, y el punto está marcado como discutido."
    - "En Génesis, Abraham planta su tienda entre Betel y Hai y construye un altar, y Jacob, durmiendo allí de camino a Harán, sueña con una escalera que llega al cielo: «Y llamó el nombre de aquel lugar Beth-el, bien que Luz era el nombre de la ciudad primero». Cuando se dividió el reino, Jeroboam hizo de Betel el santuario real de Israel: «Y puso el uno en Beth-el, y el otro puso en Dan», los dos becerros de oro. Amós profetizó allí contra la casa de Jeroboam II, y Josías derribó más tarde su altar."
    - "W. F. Albright y J. L. Kelso excavaron en Beitín entre 1927 y 1960 y hallaron una ciudad amurallada de la Edad del Bronce Medio y una ciudad incendiada del Bronce Final; la datación de varios estratos se ha puesto en duda desde entonces. En el siglo IV, Eusebio conocía Betel como una aldea a doce millas romanas de Jerusalén, unos 18 km, en el camino de Neápolis (Siquem). Silo, donde se alzaba el tabernáculo, queda unos 15 km más al norte por las mismas colinas."
  pt:
    - "Betel ficava nos montes a cerca de 16 km ao norte de Jerusalém em linha reta, na estrada da divisória das águas que corre ao longo da crista, perto da fronteira entre as terras de Benjamim e Efraim. A maioria dos estudiosos a identifica com a aldeia de Beitin, ao norte de Ramala, na Cisjordânia, onde está o ponto do mapa; outros locais foram propostos, e o ponto está marcado como disputado."
    - "Em Gênesis, Abraão arma sua tenda entre Betel e Ai e constrói um altar, e Jacó, dormindo ali a caminho de Harã, sonha com uma escada que chega ao céu: “Ele chamou o nome daquele lugar de Betel, mas o nome da cidade era Luz no princípio.” Quando o reino se dividiu, Jeroboão fez de Betel o santuário real de Israel: “Ele colocou um em Betel, e o outro ele pôs em Dã”, os dois bezerros de ouro. Amós profetizou ali contra a casa de Jeroboão II, e Josias derrubou depois o seu altar."
    - "W. F. Albright e J. L. Kelso escavaram em Beitin entre 1927 e 1960 e acharam uma cidade murada do Bronze Médio e uma cidade queimada do Bronze Final; a datação de várias camadas foi questionada depois. No século IV Eusébio conhecia Betel como uma aldeia a doze milhas romanas de Jerusalém, cerca de 18 km, na estrada para Neápolis (Siquém). Siló, onde ficava o tabernáculo, fica a cerca de 15 km mais ao norte, ao longo dos mesmos montes."
  de:
    - "Bethel lag im Bergland etwa 16 km nördlich von Jerusalem in der Luftlinie, an der Wasserscheidenstraße, die auf dem Höhenrücken verläuft, nahe der Grenze zwischen den Gebieten Benjamins und Ephraims. Die meisten Gelehrten setzen es mit dem Dorf Beitin nördlich von Ramallah im Westjordanland gleich, wo der Kartenpunkt steht; andere Stätten sind vorgeschlagen worden, und der Punkt ist als umstritten gekennzeichnet."
    - "In der Genesis schlägt Abraham sein Zelt zwischen Bethel und Ai auf und baut einen Altar, und Jakob, der dort auf dem Weg nach Haran schläft, träumt von einer Leiter bis zum Himmel und „hieß die Stätte Beth-El; zuvor aber hieß die Stadt Lus“. Als das Reich sich teilte, machte Jerobeam Bethel zum königlichen Heiligtum Israels: „Und er setzte eins zu Beth-El, und das andere tat er gen Dan“, die beiden goldenen Kälber. Amos weissagte dort gegen das Haus Jerobeams II., und Josia riss später seinen Altar nieder."
    - "W. F. Albright und J. L. Kelso gruben zwischen 1927 und 1960 in Beitin und fanden eine ummauerte Stadt der Mittelbronzezeit und eine verbrannte Stadt der Spätbronzezeit; die Datierung mehrerer Schichten ist seither in Frage gestellt worden. Im 4. Jahrhundert kannte Eusebius Bethel als Dorf zwölf römische Meilen von Jerusalem, etwa 18 km, an der Straße nach Neapolis (Sichem). Silo, wo die Stiftshütte stand, liegt etwa 15 km weiter nördlich in denselben Bergen."
  fr:
    - "Béthel se dressait dans les collines à environ 16 km au nord de Jérusalem en ligne droite, sur la route de la ligne de partage des eaux qui longe la crête, près de la frontière entre les territoires de Benjamin et d’Éphraïm. La plupart des savants l’identifient au village de Beitin, au nord de Ramallah, en Cisjordanie, où se trouve le point de la carte ; d’autres sites ont été proposés, et le point est marqué comme discuté."
    - "Dans la Genèse, Abraham dresse sa tente entre Béthel et Aï et bâtit un autel, et Jacob, qui y dort en route vers Haran, rêve d’une échelle qui touche le ciel : « Il donna à ce lieu le nom de Béthel ; mais la ville s’appelait auparavant Luz. » Quand le royaume se divisa, Jéroboam fit de Béthel le sanctuaire royal d’Israël : « Il plaça l’un de ces veaux à Béthel, et il mit l’autre à Dan », les deux veaux d’or. Amos y prophétisa contre la maison de Jéroboam II, et Josias abattit plus tard son autel."
    - "W. F. Albright et J. L. Kelso fouillèrent à Beitin de 1927 à 1960 et trouvèrent une ville fortifiée du Bronze moyen et une ville brûlée du Bronze récent ; la datation de plusieurs couches a été mise en doute depuis. Au IVe siècle, Eusèbe connaissait Béthel comme un village à douze milles romains de Jérusalem, environ 18 km, sur la route de Néapolis (Sichem). Silo, où se dressait le tabernacle, est à environ 15 km plus au nord, le long des mêmes collines."
  pl:
    - "Betel stał w górach około 16 km na północ od Jerozolimy w linii prostej, przy drodze wododziałowej biegnącej grzbietem, blisko granicy ziem Beniamina i Efraima. Większość uczonych utożsamia go ze wsią Bejtin, na północ od Ramallah na Zachodnim Brzegu, gdzie stoi punkt mapy; zaproponowano inne miejsca, a punkt oznaczono jako sporny."
    - "W Księdze Rodzaju Abraham rozbija namiot między Betel a Aj i buduje ołtarz, a Jakub, śpiąc tam w drodze do Charanu, śni o drabinie sięgającej nieba: „I nazwał imię miejsca onego Betel; bo było przedtem imię miasta onego Luz.” Gdy królestwo się podzieliło, Jeroboam uczynił Betel królewskim sanktuarium Izraela: „I postawił jednego w Betel, a drugiego postawił w Dan”, dwa złote cielce. Amos prorokował tam przeciw domowi Jeroboama II, a Jozjasz zburzył później jego ołtarz."
    - "W. F. Albright i J. L. Kelso prowadzili wykopaliska w Bejtin w latach 1927–1960 i znaleźli otoczone murem miasto z epoki brązu środkowego i spalone miasto z epoki późnego brązu; datowanie kilku warstw podważono od tamtej pory. W IV wieku Euzebiusz znał Betel jako wieś dwanaście mil rzymskich od Jerozolimy, około 18 km, przy drodze do Neapolis (Sychem). Szilo, gdzie stał przybytek, leży około 15 km dalej na północ w tych samych górach."
  it:
    - "Betel sorgeva sulle colline a circa 16 km a nord di Gerusalemme in linea retta, sulla strada di spartiacque che corre lungo il crinale, presso il confine tra le terre di Beniamino ed Efraim. La maggior parte degli studiosi la identifica con il villaggio di Beitin, a nord di Ramallah in Cisgiordania, dove sta il punto della mappa; sono stati proposti altri siti, e il punto è segnato come discusso."
    - "Nella Genesi Abramo pianta la tenda tra Betel e Ai e costruisce un altare, e Giacobbe, dormendo qui nel viaggio verso Carran, sogna una scala che arriva al cielo: «E pose nome a quel luogo Bethel; ma, prima, il nome della città era Luz». Quando il regno si divise, Geroboamo fece di Betel il santuario reale d’Israele: «E ne mise uno a Bethel, e l’altro a Dan», i due vitelli d’oro. Amos profetizzò qui contro la casa di Geroboamo II, e Giosia ne abbatté poi l’altare."
    - "W. F. Albright e J. L. Kelso scavarono a Beitin tra il 1927 e il 1960 e trovarono una città murata del Bronzo Medio e una città bruciata del Bronzo Tardo; la datazione di vari strati è stata messa in discussione da allora. Nel IV secolo Eusebio conosceva Betel come un villaggio a dodici miglia romane da Gerusalemme, circa 18 km, sulla strada per Neapoli (Sichem). Silo, dove sorgeva il tabernacolo, si trova circa 15 km più a nord lungo le stesse colline."
  nl:
    - "Bethel lag in het bergland, hemelsbreed ongeveer 16 km ten noorden van Jeruzalem, aan de waterscheidingsweg die over de bergkam loopt, nabij de grens tussen de gebieden van Benjamin en Efraïm. De meeste geleerden identificeren het met het dorp Beitin, ten noorden van Ramallah op de Westelijke Jordaanoever, waar het punt op de kaart staat; andere plaatsen zijn voorgesteld, en het punt is als omstreden gemarkeerd."
    - "In Genesis slaat Abraham zijn tent op tussen Bethel en Ai en bouwt een altaar, en Jakob, die daar slaapt op weg naar Haran, droomt van een ladder die tot de hemel reikt: “En hij noemde den naam dier plaats Beth-El; daar toch de naam dier stad te voren was Luz.” Toen het koninkrijk werd verdeeld, maakte Jerobeam Bethel tot het koninklijk heiligdom van Israël: “En hij zette het ene te Beth-El, en het andere stelde hij te Dan”, de twee gouden kalveren. Amos profeteerde daar tegen het huis van Jerobeam II, en Josia brak later zijn altaar af."
    - "W. F. Albright en J. L. Kelso groeven tussen 1927 en 1960 te Beitin en vonden een ommuurde stad uit de Midden-Bronstijd en een verbrande stad uit de Late Bronstijd; de datering van verscheidene lagen is sindsdien betwist. In de vierde eeuw kende Eusebius Bethel als een dorp op twaalf Romeinse mijlen van Jeruzalem, ongeveer 18 km, aan de weg naar Neapolis (Sichem). Silo, waar de tabernakel stond, ligt ongeveer 15 km verder naar het noorden in hetzelfde bergland."
  cs:
    - "Bét-el stál v horách asi 16 km severně od Jeruzaléma vzdušnou čarou, na rozvodní silnici podél hřebene, poblíž hranice mezi územím Benjamínovým a Efrajimovým. Většina badatelů jej ztotožňuje s vesnicí Bejtin, severně od Ramalláhu na Západním břehu, kde stojí bod na mapě; navržena byla i jiná místa a bod je označen jako sporný."
    - "V Genesis Abraham rozbíjí stan mezi Bét-elem a Aj a staví oltář a Jákob, spící tam na cestě do Cháranu, sní o žebříku sahajícím k nebi: „Protož nazval jméno místa toho Bethel, ješto prvé to město sloulo Lůza.“ Když se království rozdělilo, Jarobeám učinil z Bét-elu královskou svatyni Izraele: „I postavil jedno v Bethel, a druhé postavil v Dan“, dvě zlatá telata. Amos tam prorokoval proti domu Jarobeáma II. a Jošijáš později zbořil jeho oltář."
    - "W. F. Albright a J. L. Kelso kopali v Bejtinu v letech 1927 až 1960 a našli opevněné město střední doby bronzové a vypálené město pozdní doby bronzové; datování několika vrstev bylo od té doby zpochybněno. Ve 4. století znal Eusebios Bét-el jako vesnici dvanáct římských mil od Jeruzaléma, asi 18 km, na cestě do Neapolis (Šekem). Šílo, kde stál stánek, leží asi 15 km dále na sever týmiž horami."
  sv:
    - "Betel låg i bergen omkring 16 km norr om Jerusalem fågelvägen, vid vattendelarvägen som löper längs åsen, nära gränsen mellan Benjamins och Efraims områden. De flesta forskare identifierar det med byn Beitin, norr om Ramallah på Västbanken, där kartans punkt står; andra platser har föreslagits, och punkten är markerad som omstridd."
    - "I 1 Mosebok slår Abraham upp sitt tält mellan Betel och Ai och bygger ett altare, och Jakob, som sover där på väg till Haran, drömmer om en stege som når till himmelen: ”Och han gav den platsen namnet Betel; förut hade staden hetat Lus.” När riket delades gjorde Jerobeam Betel till Israels kungliga helgedom: ”Och han ställde upp den ena i Betel, och den andra satte han upp i Dan”, de två gyllene kalvarna. Amos profeterade där mot Jerobeam II:s hus, och Josia rev senare ned dess altare."
    - "W. F. Albright och J. L. Kelso grävde i Beitin mellan 1927 och 1960 och fann en muromgärdad stad från mellanbronsåldern och en bränd stad från senbronsåldern; dateringen av flera lager har ifrågasatts sedan dess. På 300-talet kände Eusebios Betel som en by tolv romerska mil från Jerusalem, omkring 18 km, på vägen till Neapolis (Shekem). Shilo, där tabernaklet stod, ligger omkring 15 km längre norrut längs samma berg."
  nb:
    - "Betel sto i åsene omtrent 16 km nord for Jerusalem i luftlinje, på vannskilleveien som løper langs ryggen, nær grensen mellom Benjamins og Efraims land. De fleste forskere identifiserer det med landsbyen Beitin, nord for Ramallah på Vestbredden, der kartets punkt står; andre steder er foreslått, og punktet er markert som omstridt."
    - "I 1 Mosebok slår Abraham opp teltet sitt mellom Betel og Ai og bygger et alter, og Jakob, som sover der på vei til Harran, drømmer om en stige som når til himmelen: «Og han kalte dette sted Betel; før hette byen Luz.» Da riket ble delt, gjorde Jeroboam Betel til Israels kongelige helligdom: «Og han stilte den ene op i Betel, og den andre satte han i Dan», de to gullkalvene. Amos profeterte der mot Jeroboam IIs hus, og Josjia rev senere ned alteret."
    - "W. F. Albright og J. L. Kelso gravde ut ved Beitin mellom 1927 og 1960 og fant en befestet by fra mellombronsealderen og en brent by fra senbronsealderen; dateringen av flere lag er siden blitt trukket i tvil. På 300-tallet kjente Eusebius Betel som en landsby tolv romerske mil fra Jerusalem, omtrent 18 km, på veien til Neapolis (Sikem). Sjilo, der tabernaklet sto, ligger omtrent 15 km lenger nord langs de samme åsene."
  tl:
    - "Nakatayo ang Beth-el sa mga burol na mga 16 km sa hilaga ng Jerusalem sa tuwid na guhit, sa daan sa hati ng tubig na tumatakbo sa tagaytay, malapit sa hangganan ng mga lupain ng Benjamin at Ephraim. Kinikilala ito ng karamihan ng iskolar sa nayon ng Beitin, hilaga ng Ramallah sa West Bank, kung saan nakatayo ang tuldok ng mapa; may iba pang pook na iminungkahi, at minarkahang pinagtatalunan ang punto."
    - "Sa Genesis, itinayo ni Abraham ang kaniyang tolda sa pagitan ng Beth-el at Hai at nagtayo ng dambana, at si Jacob, na natutulog doon sa daan patungong Haran, ay nanaginip ng hagdang umaabot sa langit: “At ang ipinangalan niya sa dakong yaon ay Betel: datapuwa't ang pangalan ng bayan nang una ay Luz.” Nang mahati ang kaharian, ginawa ni Jeroboam na maharlikang santuwaryo ng Israel ang Beth-el: “At inilagay niya ang isa sa Bethel, at ang isa'y inilagay sa Dan”, ang dalawang gintong guya. Nagpropesiya roon si Amos laban sa sambahayan ni Jeroboam II, at kalaunan ay giniba ni Josias ang dambana nito."
    - "Hinukay nina W. F. Albright at J. L. Kelso ang Beitin sa pagitan ng 1927 at 1960 at natagpuan ang bayang may pader ng Gitnang Panahon ng Tanso at sinunog na bayan ng Huling Panahon ng Tanso; pinagdududahan mula noon ang petsa ng ilang patong. Noong ikaapat na siglo, kilala ni Eusebio ang Beth-el bilang nayon na labindalawang milyang Romano mula sa Jerusalem, mga 18 km, sa daan patungong Neapolis (Sichem). Ang Shiloh, kung saan nakatayo ang tabernakulo, ay mga 15 km pa sa hilaga sa parehong mga burol."
  da:
    - "Betel lå i bjergene omkring 16 km nord for Jerusalem i luftlinje, på vandskelsvejen, der løber langs højderyggen, nær grænsen mellem Benjamins og Efraims lande. De fleste forskere identificerer det med landsbyen Beitin, nord for Ramallah på Vestbredden, hvor kortets punkt står; andre steder er foreslået, og punktet er markeret som omstridt."
    - "I Første Mosebog slår Abraham sit telt op mellem Betel og Aj og bygger et alter, og Jakob, der sover dér på vej til Karan, drømmer om en stige, der når til himlen: »Og han kaldte det samme Steds Navn Bethel, men ellers var Lus Stadens Navn fra Begyndelsen.« Da riget blev delt, gjorde Jeroboam Betel til Israels kongelige helligdom: »Og han satte den ene i Bethel, og den anden satte han i Dan«, de to gyldne kalve. Amos profeterede dér mod Jeroboam II's hus, og Josias nedrev senere dets alter."
    - "W. F. Albright og J. L. Kelso udgravede i Beitin mellem 1927 og 1960 og fandt en befæstet by fra mellembronzealderen og en brændt by fra senbronzealderen; dateringen af flere lag er siden blevet draget i tvivl. I 300-tallet kendte Eusebios Betel som en landsby tolv romerske mil fra Jerusalem, omkring 18 km, på vejen til Neapolis (Sikem). Silo, hvor tabernaklet stod, ligger omkring 15 km længere mod nord langs de samme bjerge."
  sr:
    - "Ветиљ је стајао у брдима око 16 км северно од Јерусалима правом линијом, на вододелном путу који води дуж гребена, близу границе земаља Венијамина и Јефрема. Већина научника поистовећује га са селом Бејтин, северно од Рамале на Западној обали, где стоји тачка на карти; предложена су и друга налазишта, па је тачка означена као спорна."
    - "У Постању Аврам подиже шатор између Ветиља и Гаја и гради жртвеник, а Јаков, спавајући ту на путу у Харан, сања лествице које досежу до неба: „И прозва оно место Ветиљ, а пре беше име оном граду Луз.“ Кад се краљевство поделило, Јеровоам је од Ветиља направио краљевско светилиште Израела: „И намести једно у Ветиљу, а друго намести у Дану“, два златна телета. Амос је тамо пророковао против дома Јеровоама II, а Јосија је касније срушио његов олтар."
    - "В. Ф. Олбрајт и Џ. Л. Келсо ископавали су у Бејтину између 1927. и 1960. и пронашли град са зидом из средњег бронзаног доба и спаљени град из касног бронзаног доба; датирање неколико слојева од тада је доведено у питање. У 4. веку Јевсевије је знао Ветиљ као село дванаест римских миља од Јерусалима, око 18 км, на путу за Неапољ (Сихем). Сило, где је стајала скинија, лежи око 15 км даље на север дуж истих брда."
  hu:
    - "Bétel a hegyekben állt, Jeruzsálemtől egyenes vonalban mintegy 16 km-re északra, a gerincen futó vízválasztó úton, Benjámin és Efraim földje határának közelében. A legtöbb kutató a ciszjordániai Rámalláhtól északra fekvő Bejtín faluval azonosítja, ahol a térkép pontja áll; más helyeket is javasoltak, és a pont vitatottként jelölt."
    - "A Mózes első könyvében Ábrahám sátrát Bétel és Aj között veti fel és oltárt épít, Jákób pedig, útban Háránba itt alva, a mennyig érő létráról álmodik: „És nevezé annak a helynek nevét Béthelnek, az előtt pedig Lúz vala annak a városnak neve.” Amikor a királyság kettészakadt, Jeroboám Bételt tette Izráel királyi szentélyévé: „És az egyiket helyhezteté Béthelbe, a másikat pedig Dánba”, vagyis a két aranyborjút. Ámós itt prófétált II. Jeroboám háza ellen, Jósiás pedig később lerombolta oltárát."
    - "W. F. Albright és J. L. Kelso 1927 és 1960 között ásott Bejtínben, és középső bronzkori fallal körülvett várost és késő bronzkori felégetett várost talált; több réteg keltezését azóta megkérdőjelezték. A 4. században Eusebius Bételt Jeruzsálemtől tizenkét római mérföldre, mintegy 18 km-re lévő falunak ismerte a Neapolisz (Sikem) felé vezető úton. Siló, ahol a szentélysátor állt, mintegy 15 km-rel északabbra fekszik ugyanazon hegyek mentén."
  fi:
    - "Betel seisoi vuoristossa noin 16 km Jerusalemista pohjoiseen linnuntietä, harjannetta pitkin kulkevalla vedenjakajatiellä, lähellä Benjaminin ja Efraimin maiden rajaa. Useimmat tutkijat tunnistavat sen Beitinin kylään Ramallahista pohjoiseen Länsirannalla, jossa kartan piste on; muita paikkoja on ehdotettu, ja piste on merkitty kiistanalaiseksi."
    - "1. Mooseksen kirjassa Abraham pystyttää telttansa Betelin ja Ain väliin ja rakentaa alttarin, ja Jaakob, nukkuessaan siellä matkallaan Harraniin, näkee unta taivaaseen ulottuvista tikapuista: ”Ja hän kutsui paikan Beeteliksi; mutta ennen oli kaupungin nimenä Luus.” Valtakunnan jakautuessa Jerobeam teki Betelistä Israelin kuninkaallisen pyhäkön: ”Ja hän pystytti toisen Beeteliin, ja toisen hän asetti Daaniin”, nuo kaksi kultaista vasikkaa. Aamos profetoi siellä Jerobeam II:n huonetta vastaan, ja Josia kukisti myöhemmin sen alttarin."
    - "W. F. Albright ja J. L. Kelso kaivoivat Beitinissä vuosina 1927–1960 ja löysivät keskipronssikautisen muuratun kaupungin ja myöhäispronssikautisen palaneen kaupungin; useiden kerrosten ajoitusta on sittemmin kyseenalaistettu. 300-luvulla Eusebios tunsi Betelin kylänä kahdentoista roomalaisen mailin päässä Jerusalemista, noin 18 km, Neapolikseen (Sikemiin) johtavalla tiellä. Silo, jossa ilmestysmaja seisoi, on noin 15 km kauempana pohjoiseen samoilla kukkuloilla."
  vi:
    - "Bê-tên đứng trong miền đồi cách Giê-ru-sa-lem khoảng 16 km về phía bắc theo đường thẳng, trên con đường phân thủy chạy dọc sống đồi, gần biên giới giữa đất Bên-gia-min và Ép-ra-im. Đa số học giả đồng nhất nó với làng Beitin, phía bắc Ramallah ở Bờ Tây, nơi điểm bản đồ đứng; các địa điểm khác đã được đề nghị, và điểm được đánh dấu là còn tranh luận."
    - "Trong Sáng thế ký, Áp-ra-ham dựng trại giữa Bê-tên và A-hi và lập bàn thờ, còn Gia-cốp, ngủ ở đó trên đường đến Cha-ran, chiêm bao thấy cái thang chạm tới trời: “rồi đặt tên chốn nầy là Bê-tên; còn nguyên khi trước tên thành là Lu-xơ.” Khi vương quốc chia đôi, Giê-rô-bô-am làm Bê-tên thành thánh địa hoàng gia của Y-sơ-ra-ên: “Người đặt con này tại Bê-tên, và con kia tại Đan”, hai bò con vàng. A-mốt nói tiên tri tại đó nghịch cùng nhà Giê-rô-bô-am II, và Giô-si-a về sau phá bàn thờ của nó."
    - "W. F. Albright và J. L. Kelso khai quật tại Beitin giữa 1927 và 1960 và tìm thấy một thị trấn có tường thời đồ đồng giữa và một thị trấn bị đốt thời đồ đồng muộn; niên đại của nhiều lớp từ đó đã bị nghi vấn. Ở thế kỷ 4, Eusebius biết Bê-tên là một làng cách Giê-ru-sa-lem mười hai dặm La Mã, khoảng 18 km, trên đường đi Nê-a-bô-li (Si-chem). Si-lô, nơi đền tạm đứng, nằm xa hơn khoảng 15 km về phía bắc dọc cùng miền đồi."
  ro:
    - "Betelul se afla în dealuri, la circa 16 km nord de Ierusalim în linie dreaptă, pe drumul liniei de despărțire a apelor care merge de-a lungul crestei, aproape de granița dintre țările lui Beniamin și Efraim. Cei mai mulți cercetători îl identifică cu satul Beitin, la nord de Ramallah, în Cisiordania, unde se află punctul hărții; au fost propuse și alte locuri, iar punctul este marcat ca disputat."
    - "În Facere, Avraam își întinde cortul între Betel și Ai și zidește un altar, iar Iacov, dormind acolo în drum spre Haran, visează o scară care ajunge la cer: „Și a chemat numele locului aceluia: casa lui Dumnezeu, iară mai nainte se chemà: cetatea Ulamluz.” Când regatul s-a împărțit, Ieroboam a făcut din Betel sanctuarul regal al Israelului: „Și una o a pus în Vetil, iar una în Dan”, cei doi viței de aur. Amos a prorocit acolo împotriva casei lui Ieroboam al II-lea, iar Iosia a dărâmat mai târziu altarul de acolo."
    - "W. F. Albright și J. L. Kelso au săpat la Beitin între 1927 și 1960 și au găsit un oraș cu ziduri din Bronzul Mijlociu și un oraș ars din Bronzul Târziu; datarea mai multor straturi a fost pusă de atunci la îndoială. În secolul al IV-lea, Eusebiu cunoștea Betelul ca pe un sat aflat la douăsprezece mile romane de Ierusalim, circa 18 km, pe drumul spre Neapolis (Sihem). Silo, unde stătea cortul întâlnirii, se află la circa 15 km mai departe spre nord, în aceleași dealuri."
  bg:
    - "Ветил стоял в хълмовете на около 16 км северно от Йерусалим по права линия, на пътя по вододела, който върви по билото, близо до границата между земите на Вениамин и Ефрем. Повечето учени го отъждествяват със село Бейтин, северно от Рамала на Западния бряг, където стои точката на картата; предлагани са и други места и точката е отбелязана като спорна."
    - "В Битие Авраам разпъва шатъра си между Ветил и Гай и издига олтар, а Яков, като спи там на път за Харан, сънува стълба, стигаща до небето: „И нарече името на онова място Ветил; а името на онзи град беше по-напред Луз.“ Когато царството се разделило, Йеровоам направил Ветил царско светилище на Израил: „тури единия идол в Ветил, а другия тури в Дан“ — двата златни телеца. Амос пророкувал там срещу дома на Йеровоам II, а Йосия по-късно съборил олтара му."
    - "У. Ф. Олбрайт и Дж. Л. Келсо разкопавали в Бейтин между 1927 и 1960 г. и открили укрепен град от средната бронзова епоха и изгорял град от късната бронзова епоха; датировката на няколко слоя оттогава е поставяна под съмнение. През IV в. Евсевий познава Ветил като село на дванадесет римски мили от Йерусалим, около 18 км, по пътя за Неапол (Сихем). Силом, където стояла скинията, е на около 15 км по-на север по същите хълмове."
