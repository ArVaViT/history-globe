id: where-was-samaria
question:
  en: "Where was Samaria?"
  ru: "Где находилась Самария?"
  uk: "Де була Самарія?"
  es: "¿Dónde estaba Samaria?"
  pt: "Onde ficava a Samaria?"
  de: "Wo lag Samaria?"
  fr: "Où se trouvait la Samarie ?"
  pl: "Gdzie leżała Samaria?"
  it: "Dov’era la Samaria?"
  cs: "Kde leželo Samaří?"
  nl: "Waar lag Samaria?"
  sv: "Var låg Samaria?"
  nb: "Hvor lå Samaria?"
  tl: "Nasaan ang Samaria?"
  da: "Hvor lå Samaria?"
  sr: "Где је била Самарија?"
answer:
  en:
    - "Samaria was both a city and a region. The city stood on a lone hill in the central highlands, at today's Sebastia in the West Bank, about 56 km north of Jerusalem in a straight line and 11 km north-west of Shechem; the map point stands on it. King Omri “bought the hill Samaria of Shemer for two talents of silver” about 880 BC, built a city on it and made it the capital of the northern kingdom, and the name passed from the city to the land around it, the hill country of Ephraim and Manasseh between Judea and Galilee."
    - "In the time of Jesus Samaria was the belt of hills between Galilee, which began at the plain of Jezreel, and Judea, which began north of Bethel; its people were the Samaritans, whose holy mountain was Gerizim above Shechem. The direct road from Galilee to Jerusalem crossed it, so John says of Jesus, “he must needs go through Samaria”, and brings him “to a city of Samaria, which is called Sychar”, about 11 km from the old capital. Luke has him pass “through the midst of Samaria and Galilee”, which the Russian Synodal Bible renders as between the two, along their border."
    - "Acts sends the witnesses “in Jerusalem, and in all Judæa, and in Samaria”, and Philip “went down to the city of Samaria”, which may be Herod's rebuilt Sebaste or, as the Russian Synodal Bible takes it, a city of the region. Today Israel uses the name for the northern West Bank around Nablus, Jenin and Tulkarm."
  ru:
    - "Самария — и город, и область. Город стоял на отдельном холме в центральном нагорье, на месте нынешней Себастии на Западном берегу, примерно в 56 км к северу от Иерусалима по прямой и в 11 км к северо-западу от Сихема; на нём и стоит точка карты. Около 880 г. до н. э. «купил Амврий гору Семерон у Семира за два таланта серебра», построил на ней город и сделал его столицей Северного царства, а имя перешло от города на окрестную землю — горы Ефрема и Манассии между Иудеей и Галилеей."
    - "Во времена Иисуса Самария была полосой гор между Галилеей, начинавшейся у Изреельской равнины, и Иудеей, начинавшейся к северу от Вефиля; её жители были самаряне, чьей священной горой был Гаризим над Сихемом. Прямая дорога из Галилеи в Иерусалим шла через неё, и Иоанн пишет об Иисусе: «Надлежало же Ему проходить через Самарию», и Он приходит «в город Самарийский, называемый Сихарь», примерно в 11 км от древней столицы. У Луки Он «проходил между Самариею и Галилеею», то есть по их границе; в английской Библии короля Иакова — через середину Самарии и Галилеи."
    - "Книга Деяний посылает свидетелей «в Иерусалиме, и во всей Иудее, и Самарии», а Филипп «пришел в город Самарийский» — может быть, в отстроенную Иродом Севастию, а может быть, в другой город области, как понимает это Синодальный перевод. Сегодня этим именем в Израиле называют север Западного берега вокруг Наблуса, Дженина и Тулькарма."
  uk:
    - "Самарія була і містом, і краєм. Місто стояло на самотньому пагорбі в центральному нагір'ї, у нинішній Себастії на Західному березі Йордану, приблизно за 56 км на північ від Єрусалима по прямій і за 11 км на північний захід від Сихема; точка на мапі стоїть на ньому. Цар Омрі «купив у Семера гору Самарию за два таланти срібла» близько 880 р. до н. е., збудував на ній місто й зробив його столицею північного царства, а назва перейшла з міста на землю навколо, гірський край Ефраїма й Манасії між Юдеєю та Галілеєю."
    - "За часів Ісуса Самарія була поясом пагорбів між Галілеєю, що починалася від Єзреельської рівнини, і Юдеєю, що починалася на північ від Бет-Ела; її жителі були самарянами, чия свята гора — Гарізім над Сихемом. Пряма дорога з Галілеї до Єрусалима перетинала її, тож Іван каже про Ісуса: «Треба ж було Йому проходити через Самарию», і приводить Його «в город Самарянський, названий Сихар», приблизно за 11 км від старої столиці. Лука каже, що Він пройшов «серединою Самариї та Галилеї», що російська синодальна Біблія передає як між ними двома, вздовж їхнього кордону."
    - "Дії посилають свідків «в Єрусалимі й у всїй Юдеї і Самариї», а Пилип «прийшовши в город Самарийський» — це може бути відбудована Іродом Себаста або, як розуміє російська синодальна Біблія, місто краю. Нині Ізраїль вживає цю назву для північної частини Західного берега навколо Наблуса, Дженіна й Тулькарма."
  es:
    - "Samaria era a la vez una ciudad y una región. La ciudad se alzaba sobre una colina aislada en las tierras altas centrales, en la actual Sebastia, en Cisjordania, a unos 56 km al norte de Jerusalén en línea recta y a 11 km al noroeste de Siquem; el punto del mapa está sobre ella. El rey Omri «compró… de Semer el monte de Samaria por dos talentos de plata» hacia el 880 a. C., edificó en él una ciudad y la hizo capital del reino del norte, y el nombre pasó de la ciudad a la tierra de alrededor, la región montañosa de Efraín y Manasés entre Judea y Galilea."
    - "En tiempos de Jesús, Samaria era el cinturón de colinas entre Galilea, que empezaba en la llanura de Jezreel, y Judea, que empezaba al norte de Betel; su gente eran los samaritanos, cuyo monte santo era el Gerizim, sobre Siquem. El camino directo de Galilea a Jerusalén la cruzaba, por lo que Juan dice de Jesús que «era menester que pasase por Samaria», y lo lleva «á una ciudad de Samaria que se llamaba Sichâr», a unos 11 km de la antigua capital. Lucas lo hace pasar «por medio de Samaria y de Galilea», lo que la Biblia sinodal rusa traduce como entre las dos, a lo largo de su frontera."
    - "Los Hechos envían a los testigos «en Jerusalem, y en toda Judea, y Samaria», y Felipe, «descendiendo á la ciudad de Samaria», que puede ser la Sebaste reconstruida por Herodes o, como la entiende la Biblia sinodal rusa, una ciudad de la región. Hoy Israel usa el nombre para el norte de Cisjordania en torno a Nablus, Yenín y Tulkarem."
  pt:
    - "Samaria era ao mesmo tempo uma cidade e uma região. A cidade ficava numa colina isolada nas terras altas centrais, na atual Sebastia, na Cisjordânia, a cerca de 56 km ao norte de Jerusalém em linha reta e 11 km a noroeste de Siquém; o ponto do mapa fica sobre ela. O rei Onri “comprou a colina de Samaria de Semer por dois talentos de prata”, por volta de 880 a.C., construiu nela uma cidade e fez dela a capital do reino do norte, e o nome passou da cidade à terra em redor, a região montanhosa de Efraim e Manassés entre a Judeia e a Galileia."
    - "No tempo de Jesus, a Samaria era o cinturão de colinas entre a Galileia, que começava na planície de Jezreel, e a Judeia, que começava ao norte de Betel; seu povo eram os samaritanos, cujo monte sagrado era o Gerizim, acima de Siquém. A estrada direta da Galileia a Jerusalém a atravessava, e por isso João diz de Jesus: “Ele precisava passar por Samaria”, e o leva “a uma cidade de Samaria chamada Sicar”, a cerca de 11 km da antiga capital. Lucas o faz passar “pelas fronteiras de Samaria e da Galileia”, o que a Bíblia Sinodal russa traduz como entre as duas, ao longo da sua fronteira."
    - "Atos envia as testemunhas “em Jerusalém, em toda a Judeia e Samaria”, e Filipe “desceu à cidade de Samaria”, que pode ser a Sebaste reconstruída por Herodes ou, como entende a Bíblia Sinodal russa, uma cidade da região. Hoje Israel usa o nome para o norte da Cisjordânia em torno de Nablus, Jenin e Tulkarm."
  de:
    - "Samaria war Stadt und Region zugleich. Die Stadt stand auf einem einzelnen Hügel im zentralen Bergland, beim heutigen Sebastia im Westjordanland, in der Luftlinie etwa 56 km nördlich von Jerusalem und 11 km nordwestlich von Sichem; der Kartenpunkt steht auf ihr. König Omri „kaufte den Berg Samaria von Semer um zwei Zentner Silber“ um 880 v. Chr., baute darauf eine Stadt und machte sie zur Hauptstadt des Nordreichs, und der Name ging von der Stadt auf das umliegende Land über, das Bergland von Ephraim und Manasse zwischen Judäa und Galiläa."
    - "Zur Zeit Jesu war Samaria der Hügelgürtel zwischen Galiläa, das an der Jesreel-Ebene begann, und Judäa, das nördlich von Bethel begann; seine Bewohner waren die Samaritaner, deren heiliger Berg der Garizim über Sichem war. Die direkte Straße von Galiläa nach Jerusalem durchquerte es, weshalb Johannes von Jesus sagt: „Er mußte aber durch Samaria reisen“, und ihn „in eine Stadt Samarias, die heißt Sichar“ bringt, etwa 11 km von der alten Hauptstadt. Lukas lässt ihn „mitten durch Samarien und Galiläa“ ziehen, was die russische Synodalbibel als zwischen beiden, entlang ihrer Grenze, wiedergibt."
    - "Die Apostelgeschichte sendet die Zeugen „zu Jerusalem und in ganz Judäa und Samarien“, und Philippus „kam hinab in eine Stadt in Samarien“, was das von Herodes wiederaufgebaute Sebaste sein kann oder, wie es die russische Synodalbibel versteht, eine Stadt der Region. Heute verwendet Israel den Namen für das nördliche Westjordanland um Nablus, Dschenin und Tulkarm."
  fr:
    - "La Samarie était à la fois une ville et une région. La ville se dressait sur une colline isolée des hautes terres du centre, à l’emplacement de l’actuelle Sébastia, en Cisjordanie, à environ 56 km au nord de Jérusalem à vol d’oiseau et à 11 km au nord-ouest de Sichem ; le point de la carte s’y trouve. Le livre des Rois dit d’Omri, vers 880 av. J.-C. : « il acheta de Schémer la montagne de Samarie pour deux talents d’argent » ; il y bâtit une ville et en fit la capitale du royaume du nord, et le nom passa de la ville au pays environnant, la région montagneuse d’Éphraïm et de Manassé entre la Judée et la Galilée."
    - "Au temps de Jésus, la Samarie était la ceinture de collines entre la Galilée, qui commençait à la plaine de Jizreel, et la Judée, qui commençait au nord de Béthel ; ses habitants étaient les Samaritains, dont la montagne sainte était le Garizim, au-dessus de Sichem. La route directe de la Galilée à Jérusalem la traversait, si bien que Jean dit de Jésus : « Comme il fallait qu’il passât par la Samarie », et le mène « dans une ville de Samarie, nommée Sychar », à environ 11 km de l’ancienne capitale. Luc le fait passer par le milieu de la Samarie et de la Galilée ; la Bible synodale russe la rend par « entre » les deux, le long de leur frontière."
    - "Les Actes envoient les témoins « à Jérusalem, dans toute la Judée, dans la Samarie », et Philippe, « étant descendu dans la ville de Samarie », peut-être la Sébaste rebâtie par Hérode ou, comme l’entend la Bible synodale russe, une ville de la région. Aujourd’hui, Israël emploie le nom pour le nord de la Cisjordanie autour de Naplouse, de Jénine et de Tulkarem."
  pl:
    - "Samaria była zarówno miastem, jak i regionem. Miasto stało na samotnym wzgórzu w środkowej wyżynie, w dzisiejszym Sebastia na Zachodnim Brzegu, około 56 km na północ od Jerozolimy w linii prostej i 11 km na północny zachód od Sychem; stoi na nim punkt na mapie. Król Omri „kupił górę Samaryi od Semera za dwa talenty srebra” około 880 p.n.e., zbudował na niej miasto i uczynił je stolicą królestwa północnego, a nazwa przeszła z miasta na otaczającą je ziemię, górską krainę Efraima i Manassesa między Judeą a Galileą."
    - "W czasach Jezusa Samaria była pasem wzgórz między Galileą, która zaczynała się na równinie Jizreel, a Judeą, która zaczynała się na północ od Betel; jej mieszkańcami byli Samarytanie, których świętą górą był Garizim nad Sychem. Prosta droga z Galilei do Jerozolimy przecinała ją, więc Jan mówi o Jezusie: „musiał iść przez Samaryję”, i prowadzi go „do miasta Samaryi, które zowią Sychar”, około 11 km od dawnej stolicy. Łukasz każe mu przejść „pośrodkiem Samaryi i Galilei”, co rosyjska Biblia synodalna oddaje jako między nimi, wzdłuż ich granicy."
    - "Dzieje wysyłają świadków „w Jeruzalemie, i we wszystkiej Judzkiej ziemi, i w Samaryi”, a Filip „zaszedłszy do miasta Samaryjskiego”, które może być odbudowaną przez Heroda Sebastą albo, jak ujmuje to rosyjska Biblia synodalna, miastem regionu. Dziś Izrael używa tej nazwy dla północnego Zachodniego Brzegu wokół Nablusu, Dżeninu i Tulkarm."
  it:
    - "La Samaria era sia una città sia una regione. La città sorgeva su un colle isolato negli altopiani centrali, nell’odierna Sebastia in Cisgiordania, a circa 56 km a nord di Gerusalemme in linea d’aria e a 11 km a nord-ovest di Sichem; il punto della mappa si trova su di essa. Il re Omri «comprò da Scemer il monte di Samaria per due talenti d’argento» verso l’880 a.C., vi edificò una città e ne fece la capitale del regno settentrionale, e il nome passò dalla città alla terra circostante, la regione collinare di Efraim e Manasse tra la Giudea e la Galilea."
    - "Ai tempi di Gesù la Samaria era la fascia di colline tra la Galilea, che iniziava alla pianura di Izreel, e la Giudea, che iniziava a nord di Betel; il suo popolo erano i Samaritani, il cui monte santo era il Garizim sopra Sichem. La via diretta dalla Galilea a Gerusalemme la attraversava, così Giovanni dice di Gesù: «doveva passare per la Samaria», e lo porta «a una città della Samaria, chiamata Sichar», a circa 11 km dall’antica capitale. Luca lo fa passare «in mezzo alla Samaria e alla Galilea», che la Bibbia sinodale russa rende come tra le due, lungo il loro confine."
    - "Gli Atti mandano i testimoni «in Gerusalemme, e in tutta la Giudea e Samaria», e Filippo, «disceso nella città di Samaria», che può essere la Sebaste ricostruita da Erode o, come la intende la Bibbia sinodale russa, una città della regione. Oggi Israele usa il nome per la Cisgiordania settentrionale attorno a Nablus, Jenin e Tulkarm."
  cs:
    - "Samaří bylo město i kraj. Město stálo na osamělém pahorku ve středních vysočinách, na dnešní Sebastii na Západním břehu, vzdušnou čarou asi 56 km severně od Jeruzaléma a 11 km severozápadně od Šekemu; stojí na něm bod na mapě. Král Omrí „koupil horu Someron od Semera za dvě hřivny stříbra“ kolem roku 880 př. n. l., vystavěl na ní město a učinil z něj hlavní město severního království a jméno přešlo z města na okolní zemi, horskou zemi Efrajimovu a Manasesovu mezi Judskem a Galilejí."
    - "V době Ježíšově bylo Samaří pásmem pahorků mezi Galilejí, která začínala u Jizreelské roviny, a Judskem, které začínalo severně od Bét-elu; jeho obyvateli byli Samaritáni, jejichž svatou horou byl Gerizim nad Šekemem. Přímá cesta z Galileje do Jeruzaléma jím procházela, a proto Jan o Ježíšovi říká: „Musil pak jíti skrze Samaří“, a přivádí ho „k městu Samařskému, kteréž slove Sichar“, asi 11 km od starého hlavního města. Lukáš ho nechává projít „skrze Samaří a Galilei“, což ruská synodální Bible překládá jako mezi oběma, podél jejich hranice."
    - "Skutky posílají svědky „i v Jeruzalémě, i ve všem Judstvu, i v Samaří“ a Filip „všed do města Samaří“, což může být Herodem znovu vystavěná Sebaste nebo, jak to bere ruská synodální Bible, město kraje. Dnes Izrael užívá toto jméno pro severní Západní břeh kolem Nábulusu, Džanínu a Túlkarmu."
  nl:
    - "Samaria was zowel een stad als een streek. De stad lag op een alleenstaande heuvel in het centrale hoogland, bij het huidige Sebastia in de Westelijke Jordaanoever, hemelsbreed ongeveer 56 km ten noorden van Jeruzalem en 11 km ten noordwesten van Sichem; het punt op de kaart staat erop. Koning Omri “kocht den berg Samaria van Semer, voor twee talenten zilvers” omstreeks 880 v.Chr., bouwde er een stad op en maakte haar de hoofdstad van het noordelijke koninkrijk, en de naam ging van de stad over op het land eromheen, het bergland van Efraïm en Manasse tussen Judea en Galilea."
    - "In de tijd van Jezus was Samaria de gordel van heuvels tussen Galilea, dat bij de vlakte van Jizreël begon, en Judea, dat ten noorden van Bethel begon; de bewoners waren de Samaritanen, wier heilige berg de Gerizim boven Sichem was. De directe weg van Galilea naar Jeruzalem liep erdoor, zodat Johannes van Jezus zegt: “Hij moest door Samaria gaan”, en brengt Hem “in een stad van Samaria, genaamd Sichar”, ongeveer 11 km van de oude hoofdstad. Lukas laat Hem trekken “door het midden van Samaria en Galilea”, wat de Russische Synodale Bijbel weergeeft als tussen die twee, langs hun grens."
    - "Handelingen zendt de getuigen “te Jeruzalem, als in geheel Judea en Samaria”, en Filippus “kwam af in de stad van Samaria”, wat het door Herodes herbouwde Sebaste kan zijn of, zoals de Russische Synodale Bijbel het opvat, een stad van de streek. Tegenwoordig gebruikt Israël de naam voor de noordelijke Westelijke Jordaanoever rond Nabloes, Jenin en Tulkarm."
  sv:
    - "Samaria var både en stad och en region. Staden låg på en ensam kulle i det centrala höglandet, vid dagens Sebastia på Västbanken, omkring 56 km norr om Jerusalem i fågelvägen och 11 km nordväst om Shekem; kartpunkten står på den. Kung Omri ”köpte berget Samaria av Semer för två talenter silver” omkring 880 f.Kr., byggde en stad på det och gjorde den till det norra rikets huvudstad, och namnet gick över från staden till landet omkring den, Efraims och Manasses bergsbygd mellan Judeen och Galileen."
    - "På Jesu tid var Samaria bältet av kullar mellan Galileen, som började vid Jisreelslätten, och Judeen, som började norr om Betel; dess folk var samariterna, vars heliga berg var Gerisim ovanför Shekem. Den direkta vägen från Galileen till Jerusalem korsade det, så Johannes säger om Jesus: ”Därvid måste han taga vägen genom Samarien”, och för honom ”till en stad i Samarien som hette Sykar”, omkring 11 km från den gamla huvudstaden. Lukas låter honom ta vägen ”mellan Samarien och Galileen”; den ryska synodala bibeln återger det som mellan de två, längs deras gräns."
    - "Apostlagärningarna sänder vittnena ”både i Jerusalem och i hela Judeen och Samarien”, och Filippos ”kom så ned till huvudstaden i Samarien”, vilket kan vara Herodes’ återuppbyggda Sebaste eller, som den ryska synodala bibeln uppfattar det, en stad i regionen. I dag använder Israel namnet för norra Västbanken kring Nablus, Jenin och Tulkarm."
  nb:
    - "Samaria var både en by og en region. Byen lå på en enslig høyde i det sentrale høylandet, ved dagens Sebastia på Vestbredden, omtrent 56 km nord for Jerusalem i luftlinje og 11 km nordvest for Sikem; kartpunktet står på den. Kong Omri «kjøpte Samaria-fjellet av Semer for to talenter sølv» omkring 880 f.Kr., bygde en by på det og gjorde den til hovedstad i nordriket, og navnet gikk fra byen over til landet rundt, Efraims og Manasses fjellland mellom Judea og Galilea."
    - "På Jesu tid var Samaria beltet av åser mellom Galilea, som begynte ved Jisreel-sletten, og Judea, som begynte nord for Betel; folket var samaritanene, hvis hellige fjell var Garisim over Sikem. Den direkte veien fra Galilea til Jerusalem krysset det, så Johannes sier om Jesus: «Han måtte da reise gjennem Samaria», og fører ham «til en by i Samaria, som heter Sykar», omtrent 11 km fra den gamle hovedstaden. Lukas lar ham dra «midt imellem Samaria og Galilea», noe den russiske synodale bibelen gjengir som mellom de to, langs grensen deres."
    - "Apostlenes gjerninger sender vitnene «både i Jerusalem og i hele Judea og Samaria», og Filip «kom da ned til en by i Samaria», som kan være Herodes’ gjenoppbygde Sebaste eller, slik den russiske synodale bibelen tar det, en by i regionen. I dag bruker Israel navnet om det nordlige Vestbredden rundt Nablus, Jenin og Tulkarm."
  tl:
    - "Ang Samaria ay isang lungsod at isa ring rehiyon. Ang lungsod ay nakatayo sa isang nag-iisang burol sa gitnang kabundukan, sa Sebastia ngayon sa West Bank, mga 56 km sa hilaga ng Jerusalem sa tuwid na guhit at 11 km sa hilagang-kanluran ng Sichem; naroon ang punto sa mapa. Noong mga 880 BK ay nakuha ni Haring Omri ang burol: “binili niya ang burol ng Samaria kay Semer sa halagang dalawang talentong pilak”. Nagtayo siya roon ng lungsod at ginawa itong kabisera ng hilagang kaharian, at ang pangalan ay lumipat mula sa lungsod patungo sa nakapaligid na lupain, ang maburol na lupain ng Ephraim at Manases sa pagitan ng Judea at Galilea."
    - "Nang panahon ni Jesus, ang Samaria ay ang sinturon ng mga burol sa pagitan ng Galilea, na nagsisimula sa kapatagan ng Jezreel, at ng Judea, na nagsisimula sa hilaga ng Beth-el; ang mga tao nito ay mga Samaritano, na ang banal na bundok ay ang Gerizim sa itaas ng Sichem. Dumaan dito ang tuwirang daan mula sa Galilea patungong Jerusalem, kaya sinabi ni Juan tungkol kay Jesus, “kinakailangang magdaan siya sa Samaria”, at dinadala siya “sa isang bayan ng Samaria, na tinatawag na Sicar”, mga 11 km mula sa lumang kabisera. Sinasabi ni Lucas na siya ay nagdaraan “sa mga hangganan ng Samaria at Galilea”, na isinasalin ng Bibliyang Synodal na Ruso bilang sa pagitan ng dalawa, sa kanilang hangganan."
    - "Isinusugo ng Mga Gawa ang mga saksi “sa Jerusalem, at sa buong Judea at Samaria”, at “bumaba si Felipe sa bayan ng Samaria”, na maaaring ang muling itinayong Sebaste ni Herodes o, gaya ng pagkaunawa ng Bibliyang Synodal na Ruso, isang lungsod ng rehiyon. Ngayon ginagamit ng Israel ang pangalan para sa hilagang West Bank sa paligid ng Nablus, Jenin at Tulkarm."
  da:
    - "Samaria var både en by og en region. Byen lå på en enlig bakke i det centrale højland, ved nutidens Sebastia på Vestbredden, ca. 56 km nord for Jerusalem i fugleflugt og 11 km nordvest for Sikem; kortets punkt står på den. Kong Omri »købte Samarias Bjerg af Semer for to Centner Sølv« omkring 880 f.Kr., byggede en by på det og gjorde den til det nordlige riges hovedstad, og navnet gik fra byen til landet omkring den, Efraims og Manasses bjergland mellem Judæa og Galilæa."
    - "I Jesu tid var Samaria bæltet af højdedrag mellem Galilæa, som begyndte ved Jizre’el-sletten, og Judæa, som begyndte nord for Betel; dets folk var samaritanerne, hvis hellige bjerg var Garizim over Sikem. Den direkte vej fra Galilæa til Jerusalem krydsede det, så Johannes siger om Jesus: »han maatte rejse igennem Samaria«, og bringer ham »til en By i Samaria, som kaldes Sykar«, ca. 11 km fra den gamle hovedstad. Lukas lader ham drage »midt imellem Samaria og Galilæa«, hvilket den russiske synodale bibel gengiver som mellem de to, langs deres grænse."
    - "Apostlenes Gerninger sender vidnerne »baade i Jerusalem og i hele Judæa og Samaria«, og »kom Filip til Byen Samaria«, som kan være Herodes’ genopbyggede Sebaste eller, som den russiske synodale bibel tager det, en by i regionen. I dag bruger Israel navnet om den nordlige del af Vestbredden omkring Nablus, Jenin og Tulkarm."
  sr:
    - "Самарија је била и град и област. Град је стајао на усамљеном брду у централном горју, у данашњој Себастији на Западној обали, око 56 км северно од Јерусалима ваздушном линијом и 11 км северозападно од Сихема; тачка на карти стоји на њему. Краљ Амрије је око 880. п. н. е. „купи гору самаријску од Семера за два таланта сребра“, на њој сагради град и учини га престоницом северног краљевства, а име је са града прешло на земљу око њега, брдовити крај Јефрема и Манасије између Јудеје и Галилеје."
    - "У Исусово време Самарија је била појас брда између Галилеје, која је почињала на равници Језраел, и Јудеје, која је почињала северно од Ветиља; њени становници били су Самарјани, чија је света гора била Гаризим изнад Сихема. Непосредни пут из Галилеје у Јерусалим прелазио је преко ње, па Јован за Исуса каже „ваљало Му је проћи кроз Самарију“ и доводи га „у град самаријски који се зове Сихар“, око 11 км од старе престонице. Лука га води „између Самарије и Галилеје“, а Руска синодална Библија то преводи као пролаз између њих двеју, дуж њихове границе."
    - "Дела шаљу сведоке „у Јерусалиму и по свој Јудеји и Самарији“, а Филип је сишао „у град самаријски“, што може бити Иродова обновљена Себаста или, како то узима Руска синодална Библија, неки град области. Данас Израел то име користи за северни део Западне обале око Набулуса, Џенина и Тулкарема."
