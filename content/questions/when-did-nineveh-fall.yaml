id: when-did-nineveh-fall
question:
  en: "When did Nineveh fall?"
  ru: "Когда пала Ниневия?"
  uk: "Коли впала Ніневія?"
  es: "¿Cuándo cayó Nínive?"
  pt: "Quando caiu Nínive?"
  de: "Wann fiel Ninive?"
  fr: "Quand Ninive est-elle tombée ?"
  pl: "Kiedy upadła Niniwa?"
  it: "Quando cadde Ninive?"
  nl: "Wanneer viel Nineve?"
  cs: "Kdy padlo Ninive?"
  sv: "När föll Nineve?"
  nb: "Når falt Ninive?"
  tl: "Kailan bumagsak ang Ninive?"
  da: "Hvornår faldt Nineve?"
  sr: "Када је пала Нинива?"
  hu: "Mikor esett el Ninive?"
  fi: "Milloin Niinive kukistui?"
  vi: "Ni-ni-ve sụp đổ khi nào?"
  ro: "Când a căzut Ninive?"
  bg: "Кога е паднала Ниневия?"
answer:
  en:
    - "Nineveh fell in 612 BC to the Babylonians under Nabopolassar and the Medes under Cyaxares, after a siege of about three months, as the Babylonian Chronicle records."
    - 'Assyria had ruled the Near East for a century and a half, taking Samaria in 722 BC and besieging Jerusalem in 701. After Ashurbanipal''s death its power broke: Nabopolassar made Babylon independent in 626 BC and in alliance with the Medes marched on the Assyrian cities. The Chronicle tells that in the fourteenth year of Nabopolassar the kings came to Nineveh, fought from the month of Simanu to Abu, took the city and turned it into a mound of ruins. The prophets Nahum and Zephaniah had foretold it: "Nineveh is laid waste: who will bemoan her?"'
    - "The last Assyrian king, Ashur-uballit II, held out at Harran, which fell in 610 BC; the Egyptian army that marched north to help him in 609 killed King Josiah of Judah at Megiddo on the way, and Egypt's own defeat at Carchemish in 605 BC left the west to Babylon. Nineveh was never rebuilt as a city; only a small settlement lived on at the site, opposite today's Mosul."
  ru:
    - "Ниневия пала в 612 г. до н. э. под натиском вавилонян во главе с Набопаласаром и мидян во главе с Киаксаром после примерно трёхмесячной осады, как сообщает Вавилонская хроника."
    - "Ассирия полтора века правила Ближним Востоком: взяла Самарию в 722 г. до н. э., осаждала Иерусалим в 701-м. После смерти Ашшурбанапала её сила надломилась: Набопаласар в 626 г. до н. э. сделал Вавилон независимым и в союзе с мидянами двинулся на ассирийские города. Хроника говорит, что в четырнадцатый год Набопаласара цари подошли к Ниневии, сражались с месяца симану до месяца абу, взяли город и обратили его в груду развалин. Пророки Наум и Софония предрекли это: «разорена Ниневия! Кто пожалеет о ней?»"
    - "Последний ассирийский царь, Ашшур-убаллит II, держался в Харране, который пал в 610 г. до н. э.; египетское войско, шедшее ему на помощь в 609-м, по пути убило при Мегиддоне царя Иосию, а поражение самого Египта при Кархемисе в 605 г. до н. э. отдало запад Вавилону. Ниневию уже не отстроили как город; на её месте, напротив нынешнего Мосула, осталось лишь небольшое поселение."
  uk:
    - "Ніневія впала 612 р. до н. е. перед вавилонянами під проводом Набополасара та мідійцями під проводом Кіаксара, після облоги приблизно в три місяці, як записано у Вавилонській хроніці."
    - "Ассирія панувала на Близькому Сході півтора століття, узявши Самарію 722 р. до н. е. та облягши Єрусалим 701 р. Після смерті Ашшурбаніпала її міць зламалася: Набополасар зробив Вавилон незалежним 626 р. до н. е. і в союзі з мідійцями рушив на ассирійські міста. Хроніка розповідає, що в чотирнадцятому році Набополасара царі прийшли до Ніневії, билися від місяця сіману до абу, взяли місто й обернули його на купу руїн. Пророки Наум і Софонія провістили це: «Збурена Ниневія! Хто пожалує тебе?»"
    - "Останній ассирійський цар, Ашшур-убаллід II, тримався в Харані, який упав 610 р. до н. е.; єгипетське військо, що рушило на північ йому на допомогу 609 р., по дорозі вбило в Мегіддо юдейського царя Йосію, а власна поразка Єгипту при Каркемиші 605 р. до н. е. залишила захід Вавилонові. Ніневію ніколи не відбудовано як місто; на цьому місці жило лише невелике поселення навпроти нинішнього Мосула."
  es:
    - "Nínive cayó en el 612 a. C. ante los babilonios de Nabopolasar y los medos de Ciáxares, tras un asedio de unos tres meses, como registra la Crónica babilónica."
    - "Asiria había dominado el Próximo Oriente durante siglo y medio, tomando Samaria en el 722 a. C. y asediando Jerusalén en el 701. Tras la muerte de Asurbanipal su poder se quebró: Nabopolasar hizo independiente a Babilonia en el 626 a. C. y, aliado con los medos, marchó sobre las ciudades asirias. La Crónica cuenta que en el año catorce de Nabopolasar los reyes llegaron a Nínive, combatieron desde el mes de Simanu hasta Abu, tomaron la ciudad y la convirtieron en un montón de ruinas. Los profetas Nahum y Sofonías lo habían predicho: «Nínive es asolada: ¿quién se compadecerá de ella?»."
    - "El último rey asirio, Asur-uballit II, resistió en Harán, que cayó en el 610 a. C.; el ejército egipcio que marchó al norte en el 609 para ayudarle mató en el camino al rey Josías de Judá en Meguido, y la propia derrota de Egipto en Carquemis en el 605 a. C. dejó el oeste a Babilonia. Nínive nunca fue reconstruida como ciudad; solo un pequeño asentamiento sobrevivió en el lugar, frente a la actual Mosul."
  pt:
    - "Nínive caiu em 612 a.C. diante dos babilônios sob Nabopolassar e dos medos sob Ciaxares, após um cerco de cerca de três meses, como registra a Crônica Babilônica."
    - "A Assíria dominara o Oriente Próximo por século e meio, tomando Samaria em 722 a.C. e sitiando Jerusalém em 701. Depois da morte de Assurbanípal seu poder se quebrou: Nabopolassar tornou Babilônia independente em 626 a.C. e, aliado aos medos, marchou contra as cidades assírias. A Crônica conta que no décimo quarto ano de Nabopolassar os reis chegaram a Nínive, lutaram do mês de Simanu ao de Abu, tomaram a cidade e a converteram num monte de ruínas. Os profetas Naum e Sofonias o haviam predito: “Nínive está devastada! Quem lamentará por ela?”"
    - "O último rei assírio, Assur-Uballit II, resistiu em Harã, que caiu em 610 a.C.; o exército egípcio que marchou para o norte em 609 para ajudá-lo matou em Megido o rei Josias de Judá, e a própria derrota do Egito em Carquemis, em 605 a.C., deixou o ocidente para Babilônia. Nínive nunca foi reconstruída como cidade; só um pequeno povoado sobreviveu no local, diante da atual Mossul."
  de:
    - "Ninive fiel 612 v. Chr. an die Babylonier unter Nabopolassar und die Meder unter Kyaxares, nach einer Belagerung von etwa drei Monaten, wie die Babylonische Chronik berichtet."
    - "Assyrien hatte den Vorderen Orient ein Jahrhundert und ein halbes beherrscht, 722 v. Chr. Samaria genommen und 701 Jerusalem belagert. Nach Assurbanipals Tod brach seine Macht: Nabopolassar machte Babylon 626 v. Chr. unabhängig und zog im Bund mit den Medern gegen die assyrischen Städte. Die Chronik erzählt, im vierzehnten Jahr Nabopolassars seien die Könige nach Ninive gekommen, hätten vom Monat Simanu bis Abu gekämpft, die Stadt genommen und in einen Trümmerhügel verwandelt. Die Propheten Nahum und Zefanja hatten es vorausgesagt: „Ninive ist zerstört; wer will Mitleid mit ihr haben?“"
    - "Der letzte assyrische König, Assuruballit II., hielt sich in Haran, das 610 v. Chr. fiel; das ägyptische Heer, das ihm 609 zu Hilfe nach Norden zog, tötete unterwegs König Josia von Juda bei Megiddo, und Ägyptens eigene Niederlage bei Karkemisch 605 v. Chr. überließ den Westen Babylon. Ninive wurde nie wieder als Stadt aufgebaut; nur eine kleine Siedlung bestand an der Stätte fort, gegenüber dem heutigen Mossul."
  fr:
    - "Ninive tomba en 612 av. J.-C. devant les Babyloniens de Nabopolassar et les Mèdes de Cyaxare, après un siège d’environ trois mois, comme le rapporte la Chronique babylonienne."
    - "L’Assyrie avait dominé le Proche-Orient pendant un siècle et demi, prenant Samarie en 722 av. J.-C. et assiégeant Jérusalem en 701. Après la mort d’Assurbanipal, sa puissance se brisa : Nabopolassar rendit Babylone indépendante en 626 av. J.-C. et, allié aux Mèdes, marcha sur les villes assyriennes. La Chronique raconte que, la quatorzième année de Nabopolassar, les rois vinrent à Ninive, combattirent du mois de Simanu à Abu, prirent la ville et en firent un monceau de ruines. Les prophètes Nahum et Sophonie l’avaient annoncé : « Ninive est détruite ! Qui la plaindra ? »"
    - "Le dernier roi assyrien, Assur-uballit II, tint à Haran, qui tomba en 610 av. J.-C. ; l’armée égyptienne qui marcha vers le nord pour l’aider en 609 tua en chemin le roi Josias de Juda à Meguiddo, et la propre défaite de l’Égypte à Carkemisch en 605 av. J.-C. laissa l’Ouest à Babylone. Ninive ne fut jamais rebâtie comme ville ; seule une petite agglomération subsista sur le site, en face de l’actuelle Mossoul."
  pl:
    - "Niniwa upadła w 612 p.n.e. pod naporem Babilończyków pod wodzą Nabopolasara i Medów pod wodzą Kiaksaresa, po oblężeniu trwającym około trzech miesięcy, jak notuje Kronika Babilońska."
    - "Asyria panowała na Bliskim Wschodzie przez półtora wieku, zdobywszy Samarię w 722 p.n.e. i oblegając Jerozolimę w 701. Po śmierci Asurbanipala jej potęga się załamała: Nabopolasar uczynił Babilon niepodległym w 626 p.n.e. i w sojuszu z Medami ruszył na miasta asyryjskie. Kronika opowiada, że w czternastym roku Nabopolasara królowie przybyli pod Niniwę, walczyli od miesiąca simanu do abu, zdobyli miasto i obrócili je w kopiec ruin. Prorocy Nahum i Sofoniasz zapowiedzieli to: „Zburzone jest Niniwe, któżby się go użalił?”"
    - "Ostatni król asyryjski, Aszur-uballit II, trzymał się w Charanie, który upadł w 610 p.n.e.; armia egipska, która w 609 ruszyła na północ, by mu pomóc, zabiła w drodze króla Judy Jozjasza pod Megiddo, a klęska samego Egiptu pod Karkemisz w 605 p.n.e. zostawiła zachód Babilonowi. Niniwa nie została nigdy odbudowana jako miasto; na miejscu przetrwała tylko mała osada, naprzeciw dzisiejszego Mosulu."
  it:
    - "Ninive cadde nel 612 a.C. in mano ai Babilonesi di Nabopolassar e ai Medi di Ciassare, dopo un assedio di circa tre mesi, come registra la Cronaca babilonese."
    - "L’Assiria aveva dominato il Vicino Oriente per un secolo e mezzo, prendendo Samaria nel 722 a.C. e assediando Gerusalemme nel 701. Dopo la morte di Assurbanipal la sua potenza si spezzò: Nabopolassar rese indipendente Babilonia nel 626 a.C. e in alleanza con i Medi marciò sulle città assire. La Cronaca racconta che nel quattordicesimo anno di Nabopolassar i re vennero a Ninive, combatterono dal mese di Simanu ad Abu, presero la città e la ridussero a un cumulo di rovine. I profeti Naum e Sofonia l’avevano predetto: «Ninive è devastata! Chi la compiangerà?»"
    - "L’ultimo re assiro, Assur-uballit II, resistette a Carran, che cadde nel 610 a.C.; l’esercito egiziano che marciò verso nord per aiutarlo nel 609 uccise lungo la via il re Giosia di Giuda a Meghiddo, e la sconfitta dell’Egitto stesso a Carchemis nel 605 a.C. lasciò l’Occidente a Babilonia. Ninive non fu mai ricostruita come città; sul sito sopravvisse solo un piccolo insediamento, di fronte all’odierna Mosul."
  nl:
    - "Nineve viel in 612 v.Chr. aan de Babyloniërs onder Nabopolassar en de Meden onder Cyaxares, na een beleg van ongeveer drie maanden, zoals de Babylonische kroniek vermeldt."
    - "Assyrië had anderhalve eeuw over het Nabije Oosten geheerst, Samaria ingenomen in 722 v.Chr. en Jeruzalem belegerd in 701. Na de dood van Assurbanipal brak zijn macht: Nabopolassar maakte Babylon in 626 v.Chr. onafhankelijk en trok in bondgenootschap met de Meden op tegen de Assyrische steden. De kroniek vertelt dat in het veertiende jaar van Nabopolassar de koningen naar Nineve kwamen, vochten van de maand Simanu tot Abu, de stad innamen en in een puinhoop veranderden. De profeten Nahum en Zefanja hadden het voorzegd: “Nineve is verstoord, wie zal medelijden met haar hebben?”"
    - "De laatste Assyrische koning, Assur-uballit II, hield stand in Haran, dat in 610 v.Chr. viel; het Egyptische leger dat in 609 naar het noorden trok om hem te helpen, doodde onderweg koning Josia van Juda bij Megiddo, en Egypte’s eigen nederlaag bij Karkemis in 605 v.Chr. liet het westen aan Babylon. Nineve werd nooit meer als stad herbouwd; alleen een kleine nederzetting bleef op de plek bestaan, tegenover het huidige Mosul."
  cs:
    - "Ninive padlo roku 612 př. n. l. Babyloňanům pod Nabopolassarem a Médům pod Kyaxarem po obléhání trvajícím asi tři měsíce, jak zaznamenává babylonská kronika."
    - "Asýrie vládla Blízkému východu půldruhého století, dobyla Samaří roku 722 př. n. l. a oblehla Jeruzalém roku 701. Po smrti Aššurbanipala se její moc zlomila: Nabopolassar učinil Babylón nezávislým roku 626 př. n. l. a ve spojenectví s Médy táhl proti asyrským městům. Kronika vypráví, že ve čtrnáctém roce Nabopolassarově králové přitáhli k Ninive, bojovali od měsíce simanu do abu, město dobyli a obrátili v hromadu rozvalin. Proroci Nachum a Sofonjáš to předpověděli: „Vyplundrováno jest Ninive. Kdož by ho litovati měl?“"
    - "Poslední asyrský král Aššuruballit II. se držel v Cháranu, který padl roku 610 př. n. l.; egyptské vojsko, které mu roku 609 táhlo na pomoc na sever, cestou zabilo judského krále Jošijáše u Megida a porážka samotného Egypta u Karkemíše roku 605 př. n. l. přenechala západ Babylónu. Ninive nebylo nikdy obnoveno jako město; na místě žila jen malá osada, naproti dnešnímu Mosulu."
  sv:
    - "Nineve föll 612 f.Kr. för babylonierna under Nabopolassar och mederna under Kyaxares, efter en belägring på omkring tre månader, som den babyloniska krönikan uppger."
    - "Assyrien hade styrt Främre Orienten i ett och ett halvt sekel, intagit Samaria 722 f.Kr. och belägrat Jerusalem 701. Efter Assurbanipals död bröts dess makt: Nabopolassar gjorde Babylon självständigt 626 f.Kr. och tågade i förbund med mederna mot de assyriska städerna. Krönikan berättar att kungarna i Nabopolassars fjortonde år kom till Nineve, stred från månaden simanu till abu, intog staden och förvandlade den till en ruinhög. Profeterna Nahum och Sefanja hade förutsagt det: ”Nineve är ödelagt, men vem kan ömka det?”"
    - "Den siste assyriske kungen, Assur-uballit II, höll ut i Harran, som föll 610 f.Kr.; den egyptiska armé som tågade norrut för att hjälpa honom 609 dräpte kung Josia av Juda vid Megiddo på vägen, och Egyptens eget nederlag vid Karkemish 605 f.Kr. lämnade väst åt Babylon. Nineve återuppbyggdes aldrig som stad; bara en liten bosättning levde kvar på platsen, mitt emot dagens Mosul."
  nb:
    - "Ninive falt i 612 f.Kr. til babylonerne under Nabopolassar og mederne under Kyaksares, etter en beleiring på omtrent tre måneder, slik Den babylonske krønike melder."
    - "Assyria hadde hersket over Midtøsten i halvannet århundre, tok Samaria i 722 f.Kr. og beleiret Jerusalem i 701. Etter Assurbanipals død brøt makten sammen: Nabopolassar gjorde Babylon uavhengig i 626 f.Kr. og marsjerte i forbund med mederne mot de assyriske byene. Krøniken forteller at i Nabopolassars fjortende år kom kongene til Ninive, kjempet fra måneden simanu til abu, tok byen og gjorde den til en ruinhaug. Profetene Nahum og Sefanja hadde forutsagt det: «Ødelagt er Ninive! Hvem vil ha medynk med det?»"
    - "Den siste assyriske kongen, Assur-uballit II, holdt stand i Harran, som falt i 610 f.Kr.; den egyptiske hæren som marsjerte nordover for å hjelpe ham i 609, drepte kong Josjia av Juda ved Megiddo underveis, og Egypts eget nederlag ved Karkemisj i 605 f.Kr. overlot vesten til Babylon. Ninive ble aldri gjenoppbygd som by; bare en liten bosetting levde videre på stedet, rett overfor dagens Mosul."
  tl:
    - "Bumagsak ang Ninive noong 612 BK sa mga Babilonio sa ilalim ni Nabopolasar at sa mga Medo sa ilalim ni Ciaxares, pagkaraan ng pagkubkob na mga tatlong buwan, gaya ng itinala ng Kronikang Babilonio."
    - "Pinamunuan ng Asiria ang Malapit na Silangan nang isa't kalahating siglo, na kinuha ang Samaria noong 722 BK at kinubkob ang Jerusalem noong 701. Pagkamatay ni Ashurbanipal ay nabali ang kapangyarihan nito: ginawang malaya ni Nabopolasar ang Babilonia noong 626 BK at, kasama ang mga Medo, nagmartsa sa mga lungsod ng Asiria. Isinasalaysay ng Kronika na sa ikalabing apat na taon ni Nabopolasar ay dumating ang mga hari sa Ninive, nakipaglaban mula sa buwan ng Simanu hanggang Abu, kinuha ang lungsod at ginawang burol ng guho. Hinulaan ito nina Nahum at Zefanias: “Ang Ninive ay nahahandusay na sira: sinong mananaghoy sa kaniya?”"
    - "Ang huling haring Asirio, si Ashur-uballit II, ay nanindigan sa Haran, na bumagsak noong 610 BK; ang hukbong Egipcio na nagmartsa pahilaga upang tulungan siya noong 609 ay pumatay kay Haring Josias ng Juda sa Megiddo sa daan, at ang sariling pagkatalo ng Egipto sa Carchemis noong 605 BK ay nag-iwan sa kanluran sa Babilonia. Hindi na muling itinayo ang Ninive bilang lungsod; isang maliit na pamayanan lamang ang nanatili sa pook, sa tapat ng Mosul ngayon."
  da:
    - "Nineve faldt i 612 f.Kr. til babylonierne under Nabopolassar og mederne under Kyaxares efter en belejring på omkring tre måneder, som den babyloniske krønike beretter."
    - "Assyrien havde hersket over Nærorienten i halvandet århundrede, indtog Samaria i 722 f.Kr. og belejrede Jerusalem i 701. Efter Assurbanipals død brød dets magt sammen: Nabopolassar gjorde Babylon uafhængigt i 626 f.Kr. og drog i forbund med mederne mod de assyriske byer. Krøniken fortæller, at kongerne i Nabopolassars fjortende år kom til Nineve, kæmpede fra måneden Simanu til Abu, indtog byen og forvandlede den til en bunke ruiner. Profeterne Nahum og Sefanja havde forudsagt det: »Ødelagt er Ninive! hvo vil have Medynk med den?«"
    - "Den sidste assyriske konge, Assur-uballit II, holdt stand i Karan, som faldt i 610 f.Kr.; den egyptiske hær, der marcherede nordpå for at hjælpe ham i 609, dræbte undervejs kong Josias af Juda ved Megiddo, og Egyptens eget nederlag ved Karkemisj i 605 f.Kr. overlod Vesten til Babylon. Nineve blev aldrig genopbygget som by; kun en lille bosættelse levede videre på stedet, over for nutidens Mosul."
  sr:
    - "Нинива је пала 612. п. н. е. пред Вавилонцима под Набополасаром и Мидијцима под Кијаксаром, после опсаде од око три месеца, како бележи Вавилонска хроника."
    - "Асирија је владала Блиским истоком век и по, заузевши Самарију 722. п. н. е. и опсевши Јерусалим 701. После Асурбанипалове смрти њена моћ се сломила: Набополасар је учинио Вавилон независним 626. п. н. е. и у савезу с Мидијцима кренуо на асирске градове. Хроника прича да су у четрнаестој години Набополасаровој краљеви дошли пред Ниниву, борили се од месеца Симану до Абу, заузели град и претворили га у хрпу рушевина. Пророци Наум и Софонија су то прорекли: „Опусте Ниневија; ко ће је жалити?“"
    - "Последњи асирски краљ, Асур-убалит II, одржао се у Харану, који је пао 610. п. н. е.; египатска војска која је 609. кренула на север да му помогне убила је на путу краља Јосију Јудиног код Мегида, а египатски пораз код Хархемиса 605. п. н. е. препустио је запад Вавилону. Нинива никад није обновљена као град; само је мало насеље опстало на том месту, насупрот данашњем Мосулу."
  hu:
    - "Ninive Kr. e. 612-ben esett el a Nabopolasszar vezette babiloniak és a Kyaxarész vezette médek kezén, mintegy háromhónapos ostrom után, ahogy a babiloni krónika feljegyzi."
    - "Asszíria másfél évszázadig uralta a Közel-Keletet, Kr. e. 722-ben elfoglalta Szamáriát, Kr. e. 701-ben pedig ostrom alá vette Jeruzsálemet. Assurbanipal halála után hatalma megtört: Nabopolasszar Kr. e. 626-ban függetlenné tette Babilont, és a médekkel szövetkezve az asszír városok ellen vonult. A krónika szerint Nabopolasszar tizennegyedik évében a királyok Ninivéhez érkeztek, Szimánu hónaptól Abu hónapig harcoltak, bevették a várost, és romhalmazzá tették. Náhum és Sofóniás próféták megjövendölték: „Elpusztult Ninive! Ki bánkódik rajta?”"
    - "Az utolsó asszír király, II. Assur-uballit Háránban tartotta magát, amely Kr. e. 610-ben elesett; az egyiptomi sereg, amely Kr. e. 609-ben északra vonult a megsegítésére, útközben Megiddónál megölte Jósiást, Júda királyát, Egyiptom saját karkemisi veresége Kr. e. 605-ben pedig a nyugatot Babilonra hagyta. Ninive soha nem épült újjá városként; a helyén csak kis település élt tovább, a mai Moszullal szemben."
  fi:
    - "Niinive kukistui vuonna 612 eaa. babylonialaisille Nabopolassarin johdolla ja meedialaisille Kyaksareen johdolla noin kolme kuukautta kestäneen piirityksen jälkeen, kuten Babylonian kronikka kertoo."
    - "Assyria oli hallinnut Lähi-itää puolitoista vuosisataa, valloittanut Samarian vuonna 722 eaa. ja piirittänyt Jerusalemia vuonna 701. Assurbanipalin kuoleman jälkeen sen valta murtui: Nabopolassar teki Babylonin itsenäiseksi vuonna 626 eaa. ja marssi liitossa meedialaisten kanssa assyrialaisia kaupunkeja vastaan. Kronikka kertoo, että Nabopolassarin neljäntenätoista vuotena kuninkaat tulivat Niiniveen, taistelivat simanu-kuusta abu-kuuhun, valtasivat kaupungin ja muuttivat sen raunioiden kumpuksi. Profeetat Nahum ja Sefanja olivat ennustaneet sen: ”Hävitetty on Niinive! Kuka sitä surkuttelisi”."
    - "Viimeinen assyrialaiskuningas Assur-uballit II piti puolensa Harranissa, joka kaatui vuonna 610 eaa.; egyptiläinen armeija, joka marssi pohjoiseen auttamaan häntä vuonna 609, surmasi matkalla Juudan kuninkaan Josian Megiddossa, ja Egyptin oma tappio Karkemisissa vuonna 605 eaa. jätti lännen Babylonille. Niinivea ei koskaan rakennettu uudelleen kaupungiksi; paikalla eli vain pieni asutus nykyisen Mosulin vastapäätä."
  vi:
    - "Ni-ni-ve sụp đổ năm 612 TCN trước người Ba-by-lôn dưới quyền Nabopolassar và người Mê-đi dưới quyền Cyaxares, sau cuộc vây khoảng ba tháng, như Biên niên sử Ba-by-lôn ghi lại."
    - "Assyria đã thống trị Cận Đông một thế kỷ rưỡi, chiếm Sa-ma-ri năm 722 TCN và vây Giê-ru-sa-lem năm 701. Sau khi Ashurbanipal qua đời, quyền lực của nó đổ vỡ: Nabopolassar cho Ba-by-lôn độc lập năm 626 TCN và liên minh với người Mê-đi tiến đánh các thành của Assyria. Biên niên sử kể rằng vào năm thứ mười bốn đời Nabopolassar, các vua đến Ni-ni-ve, giao chiến từ tháng Simanu đến tháng Abu, chiếm thành và biến nó thành một gò đống đổ nát. Các nhà tiên tri Na-hum và Sô-phô-ni đã báo trước: “Ni-ni-ve đã hoang vu! Ai sẽ có lòng thương xót người?”"
    - "Vua Assyria cuối cùng, Ashur-uballit II, cố thủ tại Cha-ran, nơi thất thủ năm 610 TCN; đạo quân Ê-díp-tô hành quân lên bắc giúp ông năm 609 đã giết vua Giô-si-a của Giu-đa tại Mê-ghi-đô trên đường đi, và thất bại của chính Ê-díp-tô tại Cạt-kê-mít năm 605 TCN để lại phương tây cho Ba-by-lôn. Ni-ni-ve không bao giờ được xây lại thành một đô thị; chỉ một khu định cư nhỏ còn tồn tại ở địa điểm này, đối diện Mosul ngày nay."
  ro:
    - "Ninive a căzut în 612 î.Hr. în fața babilonienilor conduși de Nabopolasar și a mezilor conduși de Ciaxar, după un asediu de circa trei luni, așa cum consemnează Cronica babiloniană."
    - "Asiria stăpânise Orientul Apropiat un secol și jumătate, luând Samaria în 722 î.Hr. și asediind Ierusalimul în 701. După moartea lui Așurbanipal, puterea ei s-a frânt: Nabopolasar a făcut Babilonul independent în 626 î.Hr. și, în alianță cu mezii, a pornit împotriva cetăților asiriene. Cronica povestește că în anul al paisprezecelea al lui Nabopolasar regii au venit la Ninive, s-au luptat din luna Simanu până în Abu, au luat orașul și l-au prefăcut într-o movilă de ruine. Prorocii Naum și Țefania o prevestiseră: „ticăloasa Ninevi, cine o va plânge pre ea?”"
    - "Ultimul rege asirian, Așur-uballit al II-lea, a rezistat la Haran, care a căzut în 610 î.Hr.; armata egipteană pornită spre nord să-l ajute, în 609, l-a ucis pe drum, la Meghido, pe Iosia, regele Iudei, iar înfrângerea Egiptului la Carchemiș, în 605 î.Hr., a lăsat vestul în seama Babilonului. Ninive nu a mai fost reclădită ca oraș; doar o mică așezare a trăit mai departe pe locul ei, în fața Mosulului de azi."
  bg:
    - "Ниневия паднала през 612 г. пр.н.е. пред вавилонците начело с Набополасар и мидийците начело с Киаксар след около тримесечна обсада, както съобщава Вавилонската хроника."
    - "Асирия господствала над Близкия изток век и половина: превзела Самария през 722 г. пр.н.е. и обсадила Йерусалим през 701 г. След смъртта на Ашурбанипал силата ѝ се прекършила: Набополасар направил Вавилон независим през 626 г. пр.н.е. и в съюз с мидийците тръгнал срещу асирийските градове. Хрониката разказва, че в четиринадесетата година на Набополасар царете дошли до Ниневия, сражавали се от месец симану до месец абу, превзели града и го превърнали в купчина развалини. Пророците Наум и Софония били предсказали това: „Ниневия запустя! Кой ще я пожали?“"
    - "Последният асирийски цар, Ашур-убалит II, се задържал в Харан, който паднал през 610 г. пр.н.е.; египетската войска, която тръгнала на север да му помогне през 609 г., убила по пътя юдейския цар Йосия при Мегидо, а собственото поражение на Египет при Кархемис през 605 г. пр.н.е. оставило запада на Вавилон. Ниневия никога не била възстановена като град; на мястото ѝ, срещу днешния Мосул, продължило да живее само малко селище."
