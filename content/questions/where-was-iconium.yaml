id: where-was-iconium
question:
  en: "Where was Iconium?"
  ru: "Где находилась Икония?"
  uk: "Де була Іконія?"
  es: "¿Dónde estaba Iconio?"
  pt: "Onde ficava Icônio?"
  de: "Wo lag Ikonion?"
  fr: "Où se trouvait Icone ?"
  pl: "Gdzie leżało Ikonium?"
  it: "Dov’era Icònio?"
  cs: "Kde leželo Ikonium?"
  nl: "Waar lag Ikonium?"
  sv: "Var låg Ikonion?"
  nb: "Hvor lå Ikonium?"
  tl: "Nasaan ang Iconio?"
  da: "Hvor lå Ikonion?"
answer:
  en:
    - "Iconium is the modern city of Konya in central Turkey, on the edge of the Anatolian plateau, and the ancient town lies beneath it; the map point stands on the old centre. It is about 124 km east-south-east of Pisidian Antioch, 33 km north-north-east of Lystra and 96 km north-west of Derbe in a straight line, and about 720 km from Jerusalem. Watered by streams from the hills to the west, it was the richest town of a dry plain, and the Roman road from Antioch to the east ran through it."
    - "Paul and Barnabas came here after they were driven out of Antioch. “It came to pass in Iconium, that they went both together into the synagogue of the Jews, and so spake, that a great multitude both of the Jews and also of the Greeks believed.” They stayed “long time”, but “the multitude of the city was divided: and part held with the Jews, and part with the apostles”; when Gentiles and Jews with their rulers moved to stone them, “they were ware of it, and fled unto Lystra and Derbe, cities of Lycaonia”. Luke's wording sets Iconium apart from Lycaonia, and William Ramsay argued that this was right for Paul's day, when Iconium still counted itself Phrygian, as Xenophon had called it in 401 BC."
    - "Under Claudius the city took the name Claudiconium, and Hadrian made it a Roman colony. The second-century Acts of Paul set here the story of Thecla, a young woman of Iconium who left her betrothed to follow Paul; Tertullian already knew it as a romance written by a presbyter of Asia. In the twelfth and thirteenth centuries Konya was the capital of the Seljuk sultans of Rum, and the poet Jalal al-Din Rumi is buried there."
  ru:
    - "Икония — нынешний город Конья в центре Турции, на краю Анатолийского плато; древний город лежит под ним, и точка карты стоит на старом центре. Отсюда примерно 124 км до Антиохии Писидийской к западу-северо-западу, 33 км до Листры к юго-юго-западу и 96 км до Дервии к юго-востоку по прямой, а до Иерусалима около 720 км. Орошаемая ручьями с гор на западе, Икония была самым богатым городом засушливой равнины, и через неё проходила римская дорога из Антиохии на восток."
    - "Павел и Варнава пришли сюда, изгнанные из Антиохии. «В Иконии они вошли вместе в Иудейскую синагогу и говорили так, что уверовало великое множество Иудеев и Еллинов». Они пробыли здесь «довольно времени», но «народ в городе разделился: и одни были на стороне Иудеев, а другие на стороне Апостолов»; когда язычники и Иудеи со своими начальниками устремились побить их камнями, апостолы, «узнав о сем, удалились в Ликаонские города Листру и Дервию». Слова Луки отделяют Иконию от Ликаонии, и Уильям Рамзай доказывал, что для времени Павла это верно: Икония тогда ещё считала себя фригийской, как назвал её Ксенофонт в 401 г. до н. э."
    - "При Клавдии город принял имя Клавдиконий, а Адриан сделал его римской колонией. «Деяния Павла» II века помещают здесь рассказ о Фекле, девушке из Иконии, которая оставила жениха, чтобы следовать за Павлом; уже Тертуллиан знал, что это повесть, сочинённая пресвитером из Асии. В XII–XIII веках Конья была столицей сельджукских султанов Рума, и здесь похоронен поэт Джалаладдин Руми."
  uk:
    - "Іконія — це сучасне місто Коня в центральній Туреччині, на краю Анатолійського плато, і давнє місто лежить під ним; точка на мапі стоїть на старому центрі. Вона лежить приблизно за 124 км на схід-південний схід від Пісідійської Антіохії, за 33 км на північ-північний схід від Лістри та за 96 км на північний захід від Дервії по прямій, і приблизно за 720 км від Єрусалима. Зрошувана потоками з пагорбів на заході, вона була найбагатшим містом сухої рівнини, і римська дорога з Антіохії на схід проходила через неї."
    - "Павло й Варнава прийшли сюди після того, як їх вигнали з Антіохії. «Стало ся ж в Ікониї, увійшли вони вкупі в Жидівську школу, і промовляли так, що увірувало велике множество і Жидів і Єленян.» Вони пробули «доволї ... часу», але «роздїлилась громада городська, і одні були з Жидами, а другі з апостолами»; коли погани та юдеї з їхніми князями вирішили їх покаменувати, вони, «довідавшись, повтїкали в городи Ликаонські, Листру та Дервию». Слова Луки відділяють Іконію від Лікаонії, і Вільям Рамзай доводив, що за часів Павла це було слушно, коли Іконія ще вважала себе фрігійською, як називав її Ксенофонт 401 р. до н. е."
    - "За Клавдія місто прийняло назву Клавдіконій, а Адріан зробив його римською колонією. У «Діяннях Павла» II ст. саме тут відбувається історія Фекли, молодої жительки Іконії, яка покинула нареченого, щоб піти за Павлом; Тертуліан уже знав її як вигадану повість, написану пресвітером з Азії. У XII–XIII ст. Коня була столицею сельджуцьких султанів Рума, і там похований поет Джалаладдін Румі."
  es:
    - "Iconio es la actual ciudad de Konya, en el centro de Turquía, al borde de la meseta de Anatolia, y la ciudad antigua yace bajo ella; el punto del mapa está sobre el casco viejo. Dista unos 124 km al estesureste de Antioquía de Pisidia, 33 km al nornoreste de Listra y 96 km al noroeste de Derbe en línea recta, y unos 720 km de Jerusalén. Regada por arroyos de las colinas del oeste, era la ciudad más rica de una llanura seca, y la calzada romana de Antioquía hacia el este pasaba por ella."
    - "Pablo y Bernabé llegaron aquí tras ser expulsados de Antioquía. «Aconteció en Iconio, que entrados juntamente en la sinagoga de los Judíos, hablaron de tal manera, que creyó una grande multitud de Judíos, y asimismo de Griegos». Se quedaron «mucho tiempo», pero «el vulgo de la ciudad estaba dividido; y unos eran con los Judíos, y otros con los apóstoles»; cuando gentiles y judíos con sus príncipes se lanzaron a apedrearlos, «huyeron á Listra y Derbe, ciudades de Licaonia». La redacción de Lucas distingue Iconio de Licaonia, y William Ramsay sostuvo que era correcto para los días de Pablo, cuando Iconio aún se tenía por frigia, como la había llamado Jenofonte en 401 a. C."
    - "Bajo Claudio la ciudad tomó el nombre de Claudiconio, y Adriano la hizo colonia romana. Los Hechos de Pablo, del siglo II, sitúan aquí la historia de Tecla, una joven de Iconio que dejó a su prometido para seguir a Pablo; Tertuliano ya la conocía como una novela escrita por un presbítero de Asia. En los siglos XII y XIII, Konya fue la capital de los sultanes selyúcidas de Rum, y allí está sepultado el poeta Yalal al-Din Rumi."
  pt:
    - "Icônio é a atual cidade de Konya, no centro da Turquia, na orla do planalto da Anatólia, e a antiga cidade jaz sob ela; o ponto do mapa fica no centro antigo. Fica a cerca de 124 km a lés-sudeste de Antioquia da Pisídia, 33 km a nor-nordeste de Listra e 96 km a noroeste de Derbe em linha reta, e a cerca de 720 km de Jerusalém. Irrigada por riachos das colinas a oeste, era a cidade mais rica de uma planície seca, e a estrada romana de Antioquia para o leste passava por ela."
    - "Paulo e Barnabé chegaram aqui depois de serem expulsos de Antioquia. “Em Icônio, eles entraram juntos na sinagoga dos judeus e falaram de tal modo que creu uma grande multidão, tanto de judeus como de gregos.” Ficaram ali “muito tempo”, mas “a multidão da cidade estava dividida. Uma parte tomou o partido dos judeus, e a outra parte, o dos apóstolos”; quando gentios e judeus com os seus líderes se moveram para apedrejá-los, “eles, percebendo isso, fugiram para as cidades da Licaônia, Listra e Derbe”. A redação de Lucas distingue Icônio da Licaônia, e William Ramsay sustentou que isso era correto para o tempo de Paulo, quando Icônio ainda se contava como frígia, como Xenofonte a havia chamado em 401 a.C."
    - "Sob Cláudio, a cidade tomou o nome de Claudiconium, e Adriano fez dela uma colônia romana. Os Atos de Paulo, do século II, situam aqui a história de Tecla, uma jovem de Icônio que deixou o noivo para seguir Paulo; Tertuliano já a conhecia como um romance escrito por um presbítero da Ásia. Nos séculos XII e XIII, Konya foi a capital dos sultões seljúcidas de Rum, e o poeta Jalal al-Din Rumi está sepultado ali."
  de:
    - "Ikonion ist die heutige Stadt Konya im Zentrum der Türkei am Rand des anatolischen Hochlands, und die antike Stadt liegt unter ihr; der Kartenpunkt steht auf dem alten Zentrum. Es liegt in der Luftlinie etwa 124 km ostsüdöstlich von Antiochia in Pisidien, 33 km nordnordöstlich von Lystra und 96 km nordwestlich von Derbe sowie etwa 720 km von Jerusalem entfernt. Von Bächen aus den Bergen im Westen bewässert, war es die reichste Stadt einer trockenen Ebene, und die römische Straße von Antiochia nach Osten führte durch sie."
    - "Paulus und Barnabas kamen hierher, nachdem man sie aus Antiochia vertrieben hatte. „Es geschah aber zu Ikonion, daß sie zusammenkamen und predigten in der Juden Schule, also daß eine große Menge der Juden und Griechen gläubig ward.“ Sie blieben „eine lange Zeit“, doch „die Menge aber der Stadt spaltete sich; etliche hielten's mit den Juden und etliche mit den Aposteln“; als Heiden und Juden mit ihren Obersten sie steinigen wollten, „wurden sie des inne und entflohen in die Städte des Landes Lykaonien, gen Lystra und Derbe“. Die Wortwahl des Lukas trennt Ikonion von Lykaonien, und William Ramsay hielt das für zutreffend zu Zeiten des Paulus, als Ikonion sich noch als phrygisch verstand, wie schon Xenophon es 401 v. Chr. genannt hatte."
    - "Unter Klaudius nahm die Stadt den Namen Claudiconium an, und Hadrian machte sie zur römischen Kolonie. Die Paulusakten aus dem 2. Jahrhundert verlegen hierher die Geschichte der Thekla, einer jungen Frau aus Ikonion, die ihren Verlobten verließ, um Paulus zu folgen; Tertullian kannte sie bereits als Roman eines Presbyters in Asien. Im 12. und 13. Jahrhundert war Konya die Hauptstadt der seldschukischen Sultane von Rum, und der Dichter Dschalal ad-Din Rumi ist dort begraben."
  fr:
    - "Icone est l’actuelle ville de Konya, dans le centre de la Turquie, au bord du plateau anatolien, et la ville antique gît sous elle ; le point de la carte se trouve sur le vieux centre. Elle est à environ 124 km à l’est-sud-est d’Antioche de Pisidie, à 33 km au nord-nord-est de Lystre et à 96 km au nord-ouest de Derbé à vol d’oiseau, et à environ 720 km de Jérusalem. Arrosée par des cours d’eau venus des collines de l’ouest, elle était la ville la plus riche d’une plaine aride, et la route romaine d’Antioche vers l’est la traversait."
    - "Paul et Barnabas y vinrent après avoir été chassés d’Antioche. « À Icone, Paul et Barnabas entrèrent ensemble dans la synagogue des Juifs, et ils parlèrent de telle manière qu’une grande multitude de Juifs et de Grecs crurent. » Ils y restèrent « assez longtemps », mais « la population de la ville se divisa : les uns étaient pour les Juifs, les autres pour les apôtres » ; quand les païens et les Juifs, avec leurs chefs, se mirent en mouvement pour les lapider, « Paul et Barnabas, en ayant eu connaissance, se réfugièrent dans les villes de la Lycaonie, à Lystre et à Derbe ». La formulation de Luc distingue Icone de la Lycaonie, et William Ramsay soutint qu’elle était juste pour l’époque de Paul, où Icone se comptait encore comme phrygienne, ainsi que l’avait appelée Xénophon en 401 av. J.-C."
    - "Sous Claude, la ville prit le nom de Claudiconium, et Hadrien en fit une colonie romaine. Les Actes de Paul, du IIe siècle, y situent l’histoire de Thècle, jeune femme d’Icone qui quitta son fiancé pour suivre Paul ; Tertullien la connaissait déjà comme un roman écrit par un presbytre d’Asie. Aux XIIe et XIIIe siècles, Konya fut la capitale des sultans seldjoukides de Roum, et le poète Djalal ad-Din Rumi y est enterré."
  pl:
    - "Ikonium to dzisiejsze miasto Konya w środkowej Turcji, na skraju wyżyny anatolijskiej, a starożytne miasto leży pod nim; punkt na mapie stoi w dawnym centrum. Leży ono w linii prostej około 124 km na wschód-południowy wschód od Antiochii Pizydyjskiej, 33 km na północ-północny wschód od Listry i 96 km na północny zachód od Derbe, a od Jerozolimy około 720 km. Zasilane strumieniami ze wzgórz na zachodzie, było najbogatszym miastem suchej równiny, a rzymska droga z Antiochii na wschód przebiegała przez nie."
    - "Paweł i Barnaba przybyli tu po wygnaniu z Antiochii. „I stało się w Ikonii, że także weszli do bóżnicy żydowskiej, a tak mówili, że uwierzyło i Żydów, i Greków wielkie mnóstwo”. Przebywali tam „przez długi czas”, ale „rozerwało się mnóstwo miejskie, a byli jedni z Żydami a drudzy z Apostołami”; gdy poganie i Żydzi wraz z przywódcami zamierzali ich ukamienować, „zrozumiawszy to, uciekli do miast Likaońskich, do Listry i do Derby”. Sformułowanie Łukasza odróżnia Ikonium od Likaonii, a William Ramsay dowodził, że było to słuszne za czasów Pawła, gdy Ikonium wciąż uważało się za frygijskie, jak nazwał je Ksenofont w 401 p.n.e."
    - "Za Klaudiusza miasto przyjęło nazwę Klaudikonium, a Hadrian uczynił je rzymską kolonią. Dzieje Pawła z II wieku umieszczają tu opowieść o Tekli, młodej kobiecie z Ikonium, która porzuciła narzeczonego, by pójść za Pawłem; Tertulian znał ją już jako romans napisany przez prezbitera z Azji. W XII i XIII wieku Konya była stolicą seldżuckich sułtanów Rum, a poeta Dżalaladdin Rumi jest tam pochowany."
  it:
    - "Icònio è l’odierna città di Konya nella Turchia centrale, al margine dell’altopiano anatolico, e l’antica città giace sotto di essa; il punto della mappa si trova nel centro storico. Dista circa 124 km a est-sud-est da Antiochia di Pisidia, 33 km a nord-nord-est da Listra e 96 km a nord-ovest da Derbe in linea d’aria, e circa 720 km da Gerusalemme. Irrigata da ruscelli provenienti dalle colline a ovest, era la città più ricca di una pianura arida, e la strada romana da Antiochia verso est la attraversava."
    - "Paolo e Barnaba vi giunsero dopo essere stati cacciati da Antiochia: «in Iconio pure Paolo e Barnaba entrarono nella sinagoga dei Giudei e parlarono in maniera che una gran moltitudine di Giudei e di Greci credette». Vi rimasero «molto tempo», ma «la popolazione della città era divisa; gli uni tenevano per i Giudei, e gli altri per gli apostoli»; quando Gentili e Giudei con i loro capi si mossero per lapidarli, «conosciuta la cosa, se ne fuggirono nelle città di Licaonia, Listra e Derba». La formulazione di Luca distingue Icònio dalla Licaonia, e William Ramsay sostenne che ciò era esatto per l’epoca di Paolo, quando Icònio si considerava ancora frigia, come l’aveva chiamata Senofonte nel 401 a.C."
    - "Sotto Claudio la città prese il nome di Claudiconium, e Adriano ne fece una colonia romana. Gli Atti di Paolo, del II secolo, vi ambientano la storia di Tecla, una giovane di Icònio che lasciò il fidanzato per seguire Paolo; già Tertulliano la conosceva come un romanzo scritto da un presbitero dell’Asia. Nel XII e XIII secolo Konya fu la capitale dei sultani selgiuchidi di Rum, e vi è sepolto il poeta Jalal al-Din Rumi."
  cs:
    - "Ikonium je dnešní město Konya ve středním Turecku, na okraji anatolské náhorní roviny, a starověké město leží pod ním; bod na mapě stojí na starém středu. Leží vzdušnou čarou asi 124 km východojihovýchodně od Antiochie Pisidské, 33 km severoseverovýchodně od Lystry a 96 km severozápadně od Derbe a asi 720 km od Jeruzaléma. Zavlažováno potoky z pahorků na západě bylo nejbohatším městem suché roviny a procházela jím římská silnice z Antiochie na východ."
    - "Pavel a Barnabáš sem přišli poté, co byli vyhnáni z Antiochie. „I stalo se v Ikonii, že vešli spolu do školy Židovské, a mluvili slovo Boží, takže jest uvěřilo i Židů i Řeků veliké množství.“ Zůstali „za dlouhý čas“, ale „rozdělilo se množství města, a jedni byli s Židy, a jiní s apoštoly“; když se pohané i Židé s knížaty svými obořili na apoštoly, aby je kamenovali, „oni srozuměvše tomu, utekli do měst Lykaonitských, do Lystry a do Derben“. Lukášovo znění odlišuje Ikonium od Lykaonie a William Ramsay tvrdil, že to platilo v Pavlově době, kdy se Ikonium stále počítalo za frygické, jak je roku 401 př. n. l. nazval Xenofón."
    - "Za Klaudia město přijalo jméno Klaudikonium a Hadrianus z něj učinil římskou kolonii. Skutky Pavlovy ze 2. století sem kladou příběh Thekly, mladé ženy z Ikonia, která opustila snoubence, aby následovala Pavla; Tertullianus ji už znal jako román sepsaný presbyterem z Asie. Ve 12. a 13. století byla Konya hlavním městem seldžuckých sultánů z Rúmu a je tu pohřben básník Džalál ad-Dín Rúmí."
  nl:
    - "Ikonium is de moderne stad Konya in Midden-Turkije, aan de rand van het Anatolische plateau, en de oude stad ligt eronder; het punt op de kaart staat op het oude centrum. Het ligt hemelsbreed ongeveer 124 km ten oostzuidoosten van Antiochië in Pisidië, 33 km ten noordnoordoosten van Lystra en 96 km ten noordwesten van Derbe, en ongeveer 720 km van Jeruzalem. Bewaterd door beken uit de heuvels in het westen was het de rijkste stad van een droge vlakte, en de Romeinse weg van Antiochië naar het oosten liep er doorheen."
    - "Paulus en Barnabas kwamen hier nadat zij uit Antiochië waren verdreven. “Het geschiedde te Ikonium, dat zij te zamen gingen in de synagoge der Joden, en alzo spraken, dat een grote menigte, beiden van Joden en Grieken, geloofde.” Zij bleven er “een langen tijd”, maar “de menigte der stad werd verdeeld, en sommigen waren met de Joden, en sommigen met de apostelen”; toen heidenen en joden met hun oversten hen wilden stenigen, “zijn zij, alles overlegd hebbende, gevlucht naar de steden van Lykaonië, namelijk Lystre en Derbe”. Lukas' formulering stelt Ikonium tegenover Lykaonië, en William Ramsay betoogde dat dit juist was voor de tijd van Paulus, toen Ikonium zichzelf nog Frygisch noemde, zoals Xenofon het in 401 v.Chr. had genoemd."
    - "Onder Claudius nam de stad de naam Claudiconium aan, en Hadrianus maakte haar tot Romeinse kolonie. De Handelingen van Paulus uit de tweede eeuw plaatsen hier het verhaal van Thekla, een jonge vrouw uit Ikonium die haar verloofde verliet om Paulus te volgen; Tertullianus kende het al als een roman, geschreven door een presbyter uit Asia. In de twaalfde en dertiende eeuw was Konya de hoofdstad van de Seltsjoekse sultans van Rum, en de dichter Djalal ad-Din Roemi ligt er begraven."
  sv:
    - "Ikonion är den moderna staden Konya i centrala Turkiet, vid kanten av den anatoliska platån, och den antika staden ligger under den; kartpunkten står på den gamla stadskärnan. Den ligger omkring 124 km öst-sydost om Antiochia i Pisidien, 33 km nord-nordost om Lystra och 96 km nordväst om Derbe i fågelvägen, och omkring 720 km från Jerusalem. Bevattnad av bäckar från bergen i väster var den den rikaste staden på en torr slätt, och den romerska vägen från Antiochia österut gick genom den."
    - "Paulus och Barnabas kom hit efter att de hade blivit utdrivna från Antiochia. ”På samma sätt tillgick det i Ikonium: de gingo in i judarnas synagoga och talade så, att en stor hop av både judar och greker kommo till tro.” De stannade ”en längre tid”, men ”folket i staden delade sig, så att somliga höllo med judarna, andra åter med apostlarna”; när hedningar och judar med deras föreståndare ville stena dem, ”flydde de, så snart de förstodo huru det var, till städerna Lystra och Derbe i Lykaonien”. Lukas formulering skiljer Ikonion från Lykaonien, och William Ramsay hävdade att detta var riktigt på Paulus tid, då Ikonion ännu räknade sig som frygiskt, så som Xenofon hade kallat det år 401 f.Kr."
    - "Under Claudius tog staden namnet Claudiconium, och Hadrianus gjorde den till en romersk koloni. Paulusakterna från 100-talet förlägger hit berättelsen om Thekla, en ung kvinna från Ikonion som lämnade sin trolovade för att följa Paulus; Tertullianus kände redan till den som en roman skriven av en presbyter i Asien. På 1100- och 1200-talen var Konya huvudstad för de seldjukiska sultanerna av Rum, och poeten Jalal al-Din Rumi är begravd där."
  nb:
    - "Ikonium er den moderne byen Konya i det sentrale Tyrkia, ved kanten av det anatoliske platået, og den antikke byen ligger under den; kartpunktet står i det gamle sentrum. Den ligger omtrent 124 km øst-sørøst for Antiokia i Pisidia, 33 km nord-nordøst for Lystra og 96 km nordvest for Derbe i luftlinje, og omtrent 720 km fra Jerusalem. Den fikk vann fra bekker i åsene i vest og var den rikeste byen på en tørr slette, og den romerske veien fra Antiokia mot øst gikk gjennom den."
    - "Paulus og Barnabas kom hit etter at de var drevet ut av Antiokia. «I Ikonium skjedde det da at de sammen gikk inn i jødenes synagoge og talte således at en stor mengde både av jøder og av grekere kom til troen.» De ble der «en lang tid», men «mengden i byen delte sig; nogen holdt med jødene, andre med apostlene»; da både hedninger og jøder med sine styresmenn stormet frem for å stene dem, «de merket dette, flydde de til byene i Lykaonia, Lystra og Derbe». Lukas’ ordbruk skiller Ikonium fra Lykaonia, og William Ramsay hevdet at dette var riktig for Paulus’ dager, da Ikonium ennå regnet seg som frygisk, slik Ksenofon hadde kalt det i 401 f.Kr."
    - "Under Klaudius tok byen navnet Claudiconium, og Hadrian gjorde den til en romersk koloni. Paulus-aktene fra 100-tallet legger fortellingen om Tekla hit, en ung kvinne fra Ikonium som forlot sin forlovede for å følge Paulus; Tertullian kjente den allerede som en roman skrevet av en presbyter i Asia. På 1100- og 1200-tallet var Konya hovedstad for de seldsjukkiske sultanene av Rum, og dikteren Jalal al-Din Rumi er gravlagt der."
  tl:
    - "Ang Iconio ay ang makabagong lungsod ng Konya sa gitnang Turkey, sa gilid ng talampas ng Anatolia, at ang sinaunang bayan ay nasa ilalim nito; nakatayo ang punto sa mapa sa lumang sentro. Mga 124 km ito sa silangan-timog-silangan ng Antioquia ng Pisidia, 33 km sa hilaga-hilagang-silangan ng Listra at 96 km sa hilagang-kanluran ng Derbe sa tuwid na guhit, at mga 720 km mula sa Jerusalem. Dinidiligan ng mga sapa mula sa mga burol sa kanluran, ito ang pinakamayamang bayan ng isang tuyong kapatagan, at dumaan dito ang daang Romano mula sa Antioquia patungong silangan."
    - "Pumunta rito sina Pablo at Bernabe pagkatapos silang palayasin sa Antioquia. “Nangyari sa Iconio na sila'y magkasamang nagsipasok sa sinagoga ng mga Judio, at nangagsalita ng gayon na lamang na ano pa't nagsisampalataya ang lubhang marami sa mga Judio at sa mga Griego.” Nagsitira sila “ng mahabang panahon”, ngunit “nagkabahabahagi ang karamihan sa bayan; at ang isang bahagi'y nakisama sa mga Judio, at ang ibang bahagi'y nakisama sa mga apostol”; nang kumilos ang mga Gentil at ang mga Judio kasama ang kanilang mga pinuno upang sila'y batuhin, “sa pagkaalam nila nito, ay nagsitakas na patungo sa mga bayan ng Licaonia, Listra at Derbe”. Ibinubukod ng pananalita ni Lucas ang Iconio sa Licaonia, at ipinagtanggol ni William Ramsay na tama ito noong panahon ni Pablo, nang ituring pa ng Iconio ang sarili na Frigio, gaya ng tawag dito ni Xenophon noong 401 BK."
    - "Sa ilalim ni Claudio ay kinuha ng lungsod ang pangalang Claudiconium, at ginawa itong kolonyang Romano ni Hadriano. Ang Mga Gawa ni Pablo noong ika-2 siglo ay inilagay dito ang kuwento ni Thecla, isang dalagang taga-Iconio na iniwan ang kaniyang katipan upang sumunod kay Pablo; kilala na ito ni Tertullian bilang isang nobelang isinulat ng isang presbitero ng Asia. Noong ika-12 at ika-13 siglo ay ang Konya ang kabisera ng mga sultan ng Seljuk ng Rum, at nakalibing doon ang makatang si Jalal al-Din Rumi."
  da:
    - "Ikonion er den moderne by Konya i det centrale Tyrkiet, ved kanten af det anatoliske plateau, og den antikke by ligger under den; kortets punkt står i det gamle centrum. Den ligger ca. 124 km øst-sydøst for Antiokia i Pisidien, 33 km nord-nordøst for Lystra og 96 km nordvest for Derbe i fugleflugt og ca. 720 km fra Jerusalem. Forsynet med vand fra bække fra højderne mod vest var den rigeste by på en tør slette, og den romerske vej fra Antiokia mod øst gik gennem den."
    - "Paulus og Barnabas kom hertil, efter at de var blevet drevet ud af Antiokia. »Det skete i Ikonium, at de sammen gik ind i Jødernes Synagoge og talte saaledes, at en stor Mængde, baade af Jøder og Grækere, troede.« De blev »en Tid lang« der, men »Mængden i Byen blev uenig, og nogle holdt med Jøderne, andre med Apostlene«; hedninge og jøder sammen med deres rådsherrer kom i bevægelse for at stene dem, og »de fik dette at vide, flygtede de bort til Byerne i Lykaonien, Lystra og Derbe«. Lukas’ formulering sætter Ikonion for sig selv i forhold til Lykaonien, og William Ramsay hævdede, at det var rigtigt for Paulus’ tid, da Ikonion stadig regnede sig for frygisk, som Xenofon havde kaldt det i 401 f.Kr."
    - "Under Klaudius tog byen navnet Claudiconium, og Hadrian gjorde den til romersk koloni. Paulusakterne fra 100-tallet lægger beretningen om Thekla hertil, en ung kvinde fra Ikonion, som forlod sin forlovede for at følge Paulus; Tertullian kendte den allerede som en roman skrevet af en presbyter i Asia. I 1100- og 1200-tallet var Konya hovedstad for de seldjukkiske sultaner af Rum, og digteren Jalal ad-Din Rumi er begravet der."
