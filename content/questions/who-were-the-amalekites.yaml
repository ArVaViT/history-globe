id: who-were-the-amalekites
question:
  en: "Who were the Amalekites, and where did they live?"
  ru: "Кто такие амаликитяне и где они жили?"
  uk: "Хто були амаликитяни і де вони жили?"
  es: "¿Quiénes eran los amalecitas y dónde vivían?"
  pt: "Quem eram os amalequitas, e onde viviam?"
  de: "Wer waren die Amalekiter, und wo lebten sie?"
  fr: "Qui étaient les Amalécites, et où habitaient-ils ?"
  pl: "Kim byli Amalekici i gdzie mieszkali?"
  it: "Chi erano gli Amaleciti, e dove vivevano?"
  cs: "Kdo byli Amalekovci a kde žili?"
  nl: "Wie waren de Amalekieten, en waar woonden zij?"
  sv: "Vilka var amalekiterna, och var bodde de?"
  nb: "Hvem var amalekittene, og hvor bodde de?"
  tl: "Sino ang mga Amalecita, at saan sila nanirahan?"
  da: "Hvem var amalekitterne, og hvor boede de?"
  sr: "Ко су били Амаличани и где су живели?"
  hu: "Kik voltak az amálekiták, és hol éltek?"
  fi: "Keitä amalekilaiset olivat ja missä he asuivat?"
  vi: "Người A-ma-léc là ai, và họ sống ở đâu?"
  ro: "Cine erau amaleciții și unde locuiau?"
  bg: "Кои са били амаликитяните и къде са живели?"
answer:
  en:
    - "The Amalekites were a nomad people of the Negev and the Sinai desert, between the hill country of Judah and Egypt, and they are known from the Bible alone: no Egyptian or Assyrian text and no excavation has yet named them. The map's point for Amalek stands at Kadesh-barnea, about 145 km south-west of Jerusalem in a straight line, where Genesis puts “all the country of the Amalekites” and where the spies reported that “the Amalekites dwell in the land of the south”. Saul pursued them “from Havilah until thou comest to Shur, that is over against Egypt”, and in David's day they were “of old the inhabitants of the land, as thou goest to Shur”. Genesis makes Amalek a grandson of Esau by Eliphaz and his concubine Timna; Balaam calls him “the first of the nations”."
    - "Their war with Israel runs through the whole story. At Rephidim “then came Amalek, and fought with Israel”, falling on “all that were feeble behind thee”; the Lord swore “war with Amalek from generation to generation”. When Israel tried to enter the land against his word, Amalekites and Canaanites chased them to Hormah. Eglon of Moab and the Midianites of Gideon's day brought Amalekites with them."
    - "When Saul was king, Samuel sent him: “Now go and smite Amalek, and utterly destroy all that they have”; Saul spared Agag and the best of the flocks, lost the kingdom for it, and Samuel “hewed Agag in pieces before the LORD in Gilgal”. Amalekite raiders burned David's Ziklag and fled on camels; the man who claimed to have killed Saul was an Amalekite. The last of them, Chronicles says, were destroyed by Simeonites in Mount Seir in Hezekiah's reign. In Esther, Haman is “the Agagite”, a descendant of Agag in Jewish tradition, and the synagogue still reads “Remember what Amalek did” on the sabbath before Purim."
    - "Scholars note that Genesis already knows “the country of the Amalekites” in Abraham's day, generations before Amalek was born to Eliphaz; either the writer names the land by its later people or the Amalekites were older than that genealogy, and “the first of the nations” has been read as the oldest of them. Surveys of the Negev and Sinai show that herders of the Bronze and Iron Ages left little but stone circles and sherds, so a people of tents is unlikely to be found by digging; the “city of Amalek” that Saul reached has been sought at Tel Masos, the map's Hormah, but this is a guess. In later Jewish thought Amalek became the name of every enemy of Israel, and the command to blot him out has troubled readers since antiquity."
  ru:
    - "Амаликитяне — кочевой народ Негева и Синайской пустыни, между горами Иудеи и Египтом, известный только по Библии: ни один египетский или ассирийский текст и ни одни раскопки их пока не назвали. Точка карты для Амалика стоит в Кадес-Варни, примерно в 145 км к юго-западу от Иерусалима по прямой, где Бытие помещает «всю страну Амаликитян» и где соглядатаи донесли: «Амалик живет на южной части земли». Саул преследовал их «от Хавилы до окрестностей Сура, что пред Египтом», а во дни Давида они «издавна населяли эту страну до Сура». Бытие делает Амалика внуком Исава от Елифаза и его наложницы Фамны; Валаам говорит: «первый из народов Амалик»."
    - "Их война с Израилем проходит через всю историю. В Рефидиме «пришли Амаликитяне и воевали с Израильтянами», напав на «всех ослабевших»; Господь объявил «брань у Господа против Амалика из рода в род». Когда Израиль попытался войти в землю вопреки Его слову, амаликитяне и хананеи гнали его до Хормы. Еглон Моавитский и мадианитяне времён Гедеона приводили амаликитян с собой."
    - "Когда Саул стал царём, Самуил послал его: «теперь иди и порази Амалика и истреби все, что у него»; Саул пощадил Агага и лучший скот, лишился за это царства, и Самуил «разрубил… Агага пред Господом в Галгале». Амаликитские налётчики сожгли Секелаг Давида и ушли на верблюдах; человек, уверявший, что убил Саула, был амаликитянин. Последних из них, по Паралипоменону, истребили симеониты на горе Сеир при Езекии. В книге Есфирь Аман по еврейскому тексту — агагитянин, потомок Агага по иудейскому преданию, и синагога доныне читает «Помни, как поступил с тобою Амалик» в субботу перед Пуримом."
    - "Учёные замечают, что Бытие знает «страну Амаликитян» уже во дни Авраама, за поколения до рождения Амалика у Елифаза: либо автор называет землю по её позднейшему народу, либо амаликитяне старше этой родословной, и слова «первый из народов» понимали как указание на его древность. Обследования Негева и Синая показывают, что скотоводы бронзового и железного веков оставили лишь каменные круги да черепки, так что народ шатров едва ли найдут лопатой; город, о котором сказано: «дошел Саул до города Амаликова», искали в Тель-Масосе, Хорме на карте, но это лишь догадка. В позднейшей иудейской мысли Амалик стал именем всякого врага Израиля, а повеление изгладить его память смущает читателей с древности."
  uk:
    - "Амаликитяни були кочовим народом Негеву та Синайської пустелі, між гірським краєм Юди й Єгиптом, і відомі вони лише з Біблії: жоден єгипетський чи ассирійський текст і жодні розкопки поки що не назвали їх. Точка Амалека на мапі стоїть у Кадес-Барнеа, приблизно за 145 км на південний захід від Єрусалима по прямій, де Книга Буття поміщає «всю землю Амалекиїв» і де розвідники повідомили: «Амалек живе в землї полуденнїй». Саул переслідував їх «від Хавили та й до Сира, що навпроти Египту», а за Давида вони були тими, «що здавна жили в тій землї аж до Суру й до Египту». Книга Буття робить Амалека онуком Ісава від Еліфаза і його наложниці Тимни; Валаам каже: «Первим Амалик зробився між всїма царствами»."
    - "Їхня війна з Ізраїлем проходить крізь усю історію. У Рефідімі «І прийшов Амалек, і бив на Ізраїля», напавши на «всїх малосильних позад тебе»; Господь поклявся, що «війна у Господа проти Амалека з роду в рід». Коли Ізраїль спробував увійти в землю проти Його слова, амаликитяни та ханаанеї гнали їх до Хорми. Еглон Моавський і мідіяни за днів Гедеона привели з собою амаликитян."
    - "Коли Саул був царем, Самуїл послав його: «іди та й побий Амалика і розпростори проклін на все що в його»; Саул пощадив Агага і найкращу худобу, втратив через це царство, і про Самуїла сказано: «розтяв Самуїл Агага на шматки перед Господом у Галгалї». Амаликитські напасники спалили Ціклаг Давида і втекли на верблюдах; чоловік, який стверджував, що вбив Саула, був амаликитянином. Останніх із них, каже Книга Хронік, знищили симеоніти на горі Сеїр за часів Єзекії. В Естер Аман — агагіянин, нащадок Агага за юдейським переказом, а синагога досі читає «Памятай, що вчинив з тобою Амалик» у суботу перед Пурімом."
    - "Учені зауважують, що Книга Буття вже знає «землю Амалекиїв» за днів Авраама, за кілька поколінь до того, як Амалек народився в Еліфаза; або автор називає край за його пізнішим народом, або амаликитяни були давніші за цю генеалогію, а «первим» читали як найстарший із них. Обстеження Негеву та Синаю показують, що скотарі бронзового й залізного віків залишили мало, крім кам'яних кіл і черепків, тож народ, що жив у наметах, навряд чи знайдуть розкопками; «місто Амалека», до якого дійшов Саул, шукали в Тель-Масосі, на мапі це Хорма, але це здогад. У пізнішій юдейській думці Амалек став назвою кожного ворога Ізраїлю, а заповідь стерти його непокоїть читачів від давнини."
  es:
    - "Los amalecitas eran un pueblo nómada del Négueb y del desierto del Sinaí, entre la región montañosa de Judá y Egipto, y se conocen solo por la Biblia: ningún texto egipcio o asirio ni ninguna excavación los ha nombrado hasta hoy. El punto del mapa para Amalec está en Cades-barnea, a unos 145 km al suroeste de Jerusalén en línea recta, donde el Génesis sitúa todo el territorio de los amalecitas y donde los espías informaron de que «Amalec habita la tierra del mediodía». Saúl los persiguió «desde Havila hasta llegar á Shur, que está á la frontera de Egipto», y en tiempos de David ellos «habitaban de largo tiempo la tierra, desde como se va á Shur». El Génesis hace de Amalec un nieto de Esaú por Elifaz y su concubina Timna; Balaam lo llama «Amalec, cabeza de gentes»."
    - "Su guerra con Israel recorre toda la historia. En Refidim «Y vino Amalec, y peleó con Israel», atacando a «todos los flacos que iban detrás de ti»; el Señor juró que «Jehová tendrá guerra con Amalec de generación en generación». Cuando Israel intentó entrar en la tierra contra su palabra, amalecitas y cananeos los persiguieron hasta Horma. Eglón de Moab y los madianitas de los días de Gedeón llevaron consigo amalecitas."
    - "Cuando Saúl era rey, Samuel lo envió: «Ve pues, y hiere á Amalec, y destruiréis en él todo lo que tuviere»; Saúl perdonó a Agag y lo mejor de los rebaños, perdió el reino por ello, y Samuel «cortó en pedazos á Agag delante de Jehová en Gilgal». Salteadores amalecitas quemaron Siclag, la ciudad de David, y huyeron en camellos; el hombre que dijo haber matado a Saúl era amalecita. Los últimos de ellos, dice Crónicas, fueron destruidos por los simeonitas en el monte Seir en el reinado de Ezequías. En Ester, Amán es «Agageo», descendiente de Agag según la tradición judía, y la sinagoga sigue leyendo «Acuérdate de lo que te hizo Amalec» el sábado anterior a Purim."
    - "Los estudiosos señalan que el Génesis ya conoce el territorio de los amalecitas en tiempos de Abraham, generaciones antes de que Amalec naciera de Elifaz; o bien el escritor nombra la tierra por su pueblo posterior, o bien los amalecitas eran más antiguos que esa genealogía, y «cabeza de gentes» se ha leído como la más antigua de ellas. Las prospecciones del Négueb y del Sinaí muestran que los pastores de las Edades del Bronce y del Hierro dejaron poco más que círculos de piedras y tiestos, de modo que un pueblo de tiendas difícilmente se halla excavando; la «ciudad de Amalec» a la que llegó Saúl se ha buscado en Tel Masos, la Horma del mapa, pero es una conjetura. En el pensamiento judío posterior, Amalec pasó a ser el nombre de todo enemigo de Israel, y el mandato de borrarlo ha inquietado a los lectores desde la Antigüedad."
  pt:
    - "Os amalequitas eram um povo nômade do Neguebe e do deserto do Sinai, entre a região montanhosa de Judá e o Egito, e são conhecidos somente pela Bíblia: nenhum texto egípcio ou assírio e nenhuma escavação os nomeou até hoje. O ponto do mapa para Amaleque fica em Cades-Barneia, a cerca de 145 km a sudoeste de Jerusalém em linha reta, onde o Gênesis põe “todo o território dos amalequitas” e onde os espias relataram que “Amaleque habita na terra do Sul”. Saul os perseguiu “desde Havilá até chegar a Sur, que fica a leste do Egito”, e nos dias de Davi eram “povos que desde tempos antigos habitavam a terra que se estendia na direção de Sur”. O Gênesis faz de Amaleque um neto de Esaú por Elifaz e sua concubina Timna; Balaão o chama “a primeira das nações”."
    - "Sua guerra com Israel percorre toda a história. Em Refidim, “Amaleque veio e lutou contra Israel”, atacando “todos os que estavam fracos atrás de você”; o SENHOR jurou que “fará guerra contra Amaleque de geração em geração”. Quando Israel tentou entrar na terra contra a palavra dele, amalequitas e cananeus o perseguiram até Hormá. Eglom de Moabe e os midianitas dos dias de Gideão levaram amalequitas consigo."
    - "No reinado de Saul, Samuel o enviou: “vá, ataque os amalequitas e destrua totalmente tudo o que lhes pertence”; Saul poupou Agague e o melhor dos rebanhos, perdeu o reino por isso, e Samuel “despedaçou Agague perante o SENHOR em Gilgal”. Saqueadores amalequitas queimaram Ziclague, de Davi, e fugiram em camelos; o homem que dizia ter matado Saul era amalequita. Os últimos deles, diz Crônicas, foram destruídos por simeonitas no monte Seir, no reinado de Ezequias. Em Ester, Hamã é “o agagita”, descendente de Agague na tradição judaica, e a sinagoga ainda lê “Lembre-se do que Amaleque fez a você” no sábado anterior ao Purim."
    - "Os estudiosos observam que o Gênesis já conhece “o território dos amalequitas” nos dias de Abraão, gerações antes de Amaleque nascer de Elifaz; ou o autor nomeia a terra pelo seu povo posterior, ou os amalequitas eram mais antigos do que essa genealogia, e “a primeira das nações” foi lida como a mais antiga delas. Os levantamentos do Neguebe e do Sinai mostram que os pastores das Idades do Bronze e do Ferro deixaram pouco além de círculos de pedras e cacos, de modo que um povo de tendas dificilmente será achado escavando; a “cidade de Amaleque” a que Saul chegou foi procurada em Tel Masos, a Hormá do mapa, mas é um palpite. No pensamento judaico posterior, Amaleque tornou-se o nome de todo inimigo de Israel, e a ordem de eliminá-lo perturba os leitores desde a Antiguidade."
  de:
    - "Die Amalekiter waren ein Nomadenvolk des Negev und der Sinai-Wüste zwischen dem Bergland Juda und Ägypten, und man kennt sie allein aus der Bibel: Kein ägyptischer oder assyrischer Text und keine Ausgrabung hat sie bisher genannt. Der Kartenpunkt für Amalek steht bei Kadesch-Barnea, in der Luftlinie etwa 145 km südwestlich von Jerusalem, wo die Genesis „das ganze Land der Amalekiter“ ansetzt und wo die Kundschafter berichteten: „So wohnen die Amalekiter im Lande gegen Mittag“. Saul verfolgte sie „von Hevila an bis gen Sur, das vor Ägypten liegt“, und zu Davids Zeit waren sie „von alters her die Einwohner dieses Landes, wo man kommt gen Sur“. Die Genesis macht Amalek zum Enkel Esaus von Eliphas und dessen Nebenfrau Timna; Bileam nennt ihn „die Ersten unter den Heiden“."
    - "Ihr Krieg mit Israel durchzieht die ganze Geschichte. In Refidim „kam Amalek und stritt wider Israel“ und fiel über „alle die Schwachen, die dir hinten nachzogen“ her; der HERR schwor, er werde streiten „wider Amalek von Kind zu Kindeskind“. Als Israel gegen sein Wort ins Land ziehen wollte, jagten Amalekiter und Kanaaniter es bis Horma. Eglon von Moab und die Midianiter zur Zeit Gideons brachten Amalekiter mit."
    - "Als Saul König war, sandte Samuel ihn: „So zieh nun hin und schlage die Amalekiter und verbanne sie mit allem, was sie haben“; Saul verschonte Agag und das Beste der Herden, verlor dafür das Königtum, und „Also hieb Samuel den Agag zu Stücken vor dem HERRN in Gilgal“. Amalekitische Räuber verbrannten Davids Ziklag und flohen auf Kamelen; der Mann, der Saul getötet haben wollte, war ein Amalekiter. Die letzten von ihnen, sagt die Chronik, wurden unter Hiskia von Simeoniten im Gebirge Seir vernichtet. Im Buch Ester ist Haman „der Agagiter“, nach jüdischer Überlieferung ein Nachkomme Agags, und die Synagoge liest am Sabbat vor Purim noch immer „Gedenke, was dir die Amalekiter taten“."
    - "Gelehrte merken an, dass die Genesis „das ganze Land der Amalekiter“ schon zu Abrahams Zeit kennt, Generationen bevor Amalek dem Eliphas geboren wurde; entweder benennt der Verfasser das Land nach seinem späteren Volk, oder die Amalekiter waren älter als diese Genealogie, und „die Ersten unter den Heiden“ wurde als die ältesten von ihnen gelesen. Geländebegehungen im Negev und Sinai zeigen, dass Hirten der Bronze- und Eisenzeit wenig mehr als Steinkreise und Scherben hinterließen, sodass ein Zeltvolk kaum durch Graben zu finden ist; die „Stadt Amalek“, die Saul erreichte, wurde bei Tel Masos gesucht, auf der Karte Horma, aber das ist eine Vermutung. Im späteren jüdischen Denken wurde Amalek zum Namen jedes Feindes Israels, und der Befehl, ihn auszutilgen, beunruhigt Leser seit der Antike."
  fr:
    - "Les Amalécites étaient un peuple nomade du Négev et du désert du Sinaï, entre la région montagneuse de Juda et l’Égypte, et ils ne sont connus que par la Bible : aucun texte égyptien ou assyrien et aucune fouille ne les a encore nommés. Le point de la carte pour Amalek se trouve à Kadès-Barnéa, à environ 145 km au sud-ouest de Jérusalem à vol d’oiseau, où la Genèse place le pays des Amalécites, battus « sur tout leur territoire », et où les espions rapportèrent que « Les Amalécites habitent la contrée du midi ». Saül les poursuivit « depuis Havila jusqu’à Schur, qui est en face de l’Égypte », et du temps de David ils habitaient la contrée « dès les temps anciens, du côté de Schur ». La Genèse fait d’Amalek un petit-fils d’Ésaü par Éliphaz et sa concubine Thimna ; Balaam l’appelle « la première des nations »."
    - "Leur guerre avec Israël traverse toute l’histoire. À Rephidim, « Amalek vint combattre Israël », tombant « sur tous ceux qui se traînaient les derniers » ; l’Éternel jura « il y aura guerre de l’Éternel contre Amalek, de génération en génération ». Quand Israël tenta d’entrer dans le pays contre sa parole, Amalécites et Cananéens les poursuivirent jusqu’à Horma. Églon de Moab et les Madianites du temps de Gédéon amenèrent avec eux des Amalécites."
    - "Quand Saül était roi, Samuel l’envoya : « Va maintenant, frappe Amalek, et dévouez par interdit tout ce qui lui appartient » ; Saül épargna Agag et les meilleures bêtes des troupeaux, perdit le royaume pour cela, et Samuel « mit Agag en pièces devant l’Éternel, à Guilgal ». Des pillards amalécites incendièrent Tsiklag, la ville de David, et s’enfuirent sur des chameaux ; l’homme qui affirmait avoir tué Saül était un Amalécite. Les derniers d’entre eux, disent les Chroniques, furent détruits par des Siméonites dans la montagne de Séir sous le règne d’Ézéchias. Dans Esther, Haman est « l’Agaguite », descendant d’Agag selon la tradition juive, et la synagogue lit encore « Souviens-toi de ce que te fit Amalek » le sabbat qui précède Pourim."
    - "Les spécialistes notent que la Genèse connaît déjà le pays des Amalécites du temps d’Abraham, des générations avant la naissance d’Amalek d’Éliphaz ; soit l’auteur nomme le pays d’après son peuple ultérieur, soit les Amalécites étaient plus anciens que cette généalogie, et « la première des nations » a été lue comme la plus ancienne d’entre elles. Les prospections du Négev et du Sinaï montrent que les pasteurs de l’âge du Bronze et de l’âge du Fer n’ont laissé guère plus que des cercles de pierres et des tessons, de sorte qu’un peuple de tentes a peu de chances d’être retrouvé par la fouille ; « la ville d’Amalek » que Saül atteignit a été cherchée à Tel Masos, l’Horma de la carte, mais ce n’est qu’une conjecture. Dans la pensée juive ultérieure, Amalek devint le nom de tous les ennemis d’Israël, et le commandement de l’effacer trouble les lecteurs depuis l’Antiquité."
  pl:
    - "Amalekici byli ludem koczowniczym Negewu i pustyni Synaj, między krainą górską Judy a Egiptem, i znani są wyłącznie z Biblii: żaden tekst egipski ani asyryjski i żadne wykopaliska nie nazwały ich dotąd. Punkt na mapie dla Amaleka stoi w Kadesz-Barnea, około 145 km na południowy zachód od Jerozolimy w linii prostej, gdzie Księga Rodzaju umieszcza „wszystkę krainę Amalekitów” i gdzie zwiadowcy donieśli, że „Amalek mieszka w ziemi na południe”. Saul ścigał ich „od Hewila, którędy chodzą do Sur, które jest przeciw Egiptowi”, a za czasów Dawida „ci mieszkali w onej ziemi zdawna; którędy chodzą przez Sur aż do ziemi Egipskiej”. Księga Rodzaju czyni Amaleka wnukiem Ezawa przez Elifaza i jego nałożnicę Timnę; Balaam nazywa go: „Początek narodów jest Amalek”."
    - "Ich wojna z Izraelem przewija się przez całą opowieść. W Refidim „przyciągnął Amalek, aby walczył z Izraelem w Rafidym”, uderzając na „wszystkie mdłe, idące za tobą”; Pan poprzysiągł, że „wojna Pańska, będzie przeciwko Amalekowi od rodzaju do rodzaju”. Gdy Izrael próbował wejść do ziemi wbrew jego słowu, Amalekita i Kananejczyk ścigali go aż do Hormy. Eglon z Moabu i Madianici z czasów Gedeona sprowadzili z sobą Amalekitów."
    - "Za króla Saula Samuel posłał go: „Przetoż idź, a pobij Amaleka, i wytrać jako przeklęte wszystko, co ma”; Saul oszczędził Agaga i najlepsze z trzód, stracił za to królestwo, a Samuel „rozsiekał w kęsy Samuel Agaga przed obliczem Pańskiem w Galgal”. Amalekiccy najeźdźcy spalili Siklag Dawida i uciekli na wielbłądach; człowiek, który twierdził, że zabił Saula, był Amalekitą. Ostatni z nich, mówi Księga Kronik, zostali wytępieni przez Symeonitów na górze Seir za panowania Ezechiasza. W Księdze Estery król wywyższa „Hamana, syna Hamedatowego, Agagiejczyka”, potomka Agaga według tradycji żydowskiej, a synagoga wciąż czyta w szabat przed Purim „Pomnij na to, coć uczynił Amalek”."
    - "Uczeni zauważają, że Księga Rodzaju zna już „wszystkę krainę Amalekitów” za czasów Abrahama, pokolenia przed urodzeniem Amaleka Elifazowi; albo autor nazywa kraj od jego późniejszego ludu, albo Amalekici byli starsi niż ta genealogia, a „Początek narodów” odczytywano jako najstarszy z nich. Badania Negewu i Synaju pokazują, że pasterze epoki brązu i żelaza zostawili niewiele poza kręgami z kamieni i skorupami, więc ludu namiotów raczej nie znajdzie się łopatą; „miasto Amalek”, do którego dotarł Saul, szukano w Tel Masos, na mapie Horma, ale to domysł. W późniejszej myśli żydowskiej Amalek stał się nazwą każdego wroga Izraela, a nakaz wymazania go niepokoi czytelników od starożytności."
  it:
    - "Gli Amaleciti erano un popolo nomade del Negheb e del deserto del Sinai, tra la regione collinare di Giuda e l’Egitto, e sono noti dalla sola Bibbia: nessun testo egiziano o assiro e nessuno scavo li ha finora nominati. Il punto della mappa per Amalek si trova a Kades-Barnea, a circa 145 km a sud-ovest di Gerusalemme in linea d’aria, dove la Genesi pone «gli Amalekiti su tutto il loro territorio» e dove gli esploratori riferirono che «Gli Amalekiti abitano la parte meridionale del paese». Saul li inseguì «da Havila fino a Shur, che sta dirimpetto all’Egitto», e ai tempi di Davide «abitavano da tempi antichi il paese, dal lato di Shur fino al paese d’Egitto». La Genesi fa di Amalek un nipote di Esaù tramite Elifaz e la sua concubina Timna; Balaam lo chiama «la prima delle nazioni»."
    - "La loro guerra con Israele attraversa l’intera storia. A Refidim «venne Amalek a dar battaglia a Israele», piombando su «tutti i deboli che ti seguivano»; l’Eterno giurò che «farà guerra ad Amalek d’età in età». Quando Israele tentò di entrare nel paese contro la sua parola, Amaleciti e Cananei lo inseguirono fino a Corma. Eglon di Moab e i Madianiti ai tempi di Gedeone portarono con sé degli Amaleciti."
    - "Quando Saul era re, Samuele lo mandò: «Ora va’, sconfiggi Amalek, vota allo sterminio tutto ciò che gli appartiene»; Saul risparmiò Agag e il meglio del gregge, per questo perse il regno, e Samuele «fe’ squartare Agag in presenza dell’Eterno a Ghilgal». Predoni amaleciti bruciarono Siclag di Davide e fuggirono su cammelli; l’uomo che affermò di aver ucciso Saul era un Amalecita. Gli ultimi di loro, dicono le Cronache, furono distrutti dai Simeoniti sul Monte Seir ai tempi di Ezechia. In Ester, Aman è «l’Agaghita», un discendente di Agag nella tradizione ebraica, e la sinagoga legge ancora «Ricordati di ciò che ti fece Amalek» nel sabato prima di Purim."
    - "Gli studiosi notano che la Genesi conosce già «gli Amalekiti su tutto il loro territorio» ai tempi di Abramo, generazioni prima che Amalek nascesse a Elifaz; o lo scrittore nomina il paese con il suo popolo posteriore o gli Amaleciti erano più antichi di quella genealogia, e «la prima delle nazioni» è stata letta come la più antica di esse. Le ricognizioni del Negheb e del Sinai mostrano che i pastori delle età del Bronzo e del Ferro lasciarono poco più che cerchi di pietre e cocci, così che un popolo di tende difficilmente si troverà scavando; la «città di Amalek» che Saul raggiunse è stata cercata a Tel Masos, la Corma della mappa, ma è una congettura. Nel pensiero ebraico posteriore Amalek divenne il nome di ogni nemico di Israele, e il comando di cancellarlo ha turbato i lettori fin dall’antichità."
  cs:
    - "Amalekovci byli nomádský lid Negevu a Sinajské pouště, mezi judskými horami a Egyptem, a jsou známi jen z Bible: žádný egyptský ani asyrský text a žádné vykopávky je dosud nejmenovaly. Bod Amaleka na mapě stojí v Kádeš-barnea, vzdušnou čarou asi 145 km jihozápadně od Jeruzaléma, kde Genesis klade „všecku krajinu Amalechitského“ a kde zvědové hlásili, že „Amalech bydlí v kraji poledním“. Saul je pronásledoval „od Hevilah, kudy se chodí do Sur, kteréž jest naproti Egyptu“ a v Davidově době „bydlili v zemi té od starodávna“, „kudy se chodí přes Sur“. Genesis činí Amaleka vnukem Ezauovým od Elifaze a jeho družky Timny; Bileám ho nazývá „počátek národů“."
    - "Jejich válka s Izraelem prochází celým příběhem. V Refídimu „přitáhl pak Amalech, a bojoval s Izraelem“ a pobil „zadní houf tvůj všech mdlých, kteříž šli za tebou“; Hospodin přísahal „boj Hospodinův proti Amalechovi od národu až do národu“. Když se Izrael pokusil vstoupit do země proti jeho slovu, honili ho Amalekovci a Kananejci až k Chormě. Eglon Moábský i Midianité Gedeonových dnů přivedli s sebou Amalekovce."
    - "Za Saula mu Samuel řekl: „Protož i hned táhni a zkaz Amalecha, a zahlaďte jako proklaté všecko, což má“; Saul ušetřil Agaga a nejlepší z dobytka, přišel kvůli tomu o království a „rozsekal Samuel Agaga na kusy před Hospodinem v Galgala“. Amalekovští lupiči vypálili Davidův Siklag a uprchli na velbloudech; muž, který tvrdil, že zabil Saula, byl Amalekovec. Poslední z nich, praví Kroniky, vyhubili Simeonci v hoře Seír za Chizkijáše. V Ester je Haman Agagský, podle židovské tradice potomek Agaga, a synagoga dosud čte „Pamatuj na to, coť učinil Amalech na cestě“ v sobotu před Purimem."
    - "Badatelé poznamenávají, že Genesis už zná „krajinu Amalechitského“ za Abrahama, generace předtím, než se Amalek narodil Elifazovi; buď pisatel jmenuje zemi podle jejího pozdějšího lidu, nebo byli Amalekovci starší než ta genealogie, a „počátek národů“ se čte jako nejstarší z nich. Průzkumy Negevu a Sinaje ukazují, že pastevci doby bronzové a železné zanechali málo kromě kamenných kruhů a střepů, takže lid stanů se výkopy sotva najde; Saul přitáhl „až k městu Amalechovu“ a to se hledalo v Tel Masos, na mapě Chorma, ale to je dohad. V pozdějším židovském myšlení se Amalek stal jménem každého nepřítele Izraele a příkaz jej vymazat trápí čtenáře od starověku."
  nl:
    - "De Amalekieten waren een nomadisch volk van de Negev en de Sinaïwoestijn, tussen het bergland van Juda en Egypte, en zij zijn alleen uit de Bijbel bekend: geen Egyptische of Assyrische tekst en geen opgraving heeft hen tot nu toe genoemd. Het punt op de kaart voor Amalek staat bij Kades-Barnea, hemelsbreed ongeveer 145 km ten zuidwesten van Jeruzalem, waar Genesis “al het land der Amalekieten” plaatst en waar de verspieders meldden dat “de Amalekieten wonen in het land van het zuiden”. Saul sloeg hen “van Havila af, tot daar gij komt te Sur, dat voor aan Egypte is”, en in Davids tijd waren zij “vanouds geweest de inwoners des lands, dat gij gaat naar Sur”. Genesis maakt Amalek tot kleinzoon van Ezau via Elifaz en diens bijwijf Timna; Bileam noemt hem “de eersteling der heidenen”."
    - "Hun oorlog met Israël loopt door het hele verhaal. Bij Refidim “kwam Amalek en streed tegen Israel”, en trof “al de zwakken achter u”; de HEER zwoer er oorlog mee: “zo zal de oorlog des HEEREN tegen Amalek zijn, van geslacht tot geslacht”. Toen Israël tegen zijn woord in het land wilde binnengaan, joegen Amalekieten en Kanaänieten het tot Chorma. Eglon van Moab en de Midianieten uit Gideons tijd brachten Amalekieten mee."
    - "Toen Saul koning was, zond Samuël hem: “Ga nu heen, en sla Amalek, en verban alles, wat hij heeft”; Saul spaarde Agag en de beste van de kudden, verloor daarom het koninkrijk, en “hieuw Samuel Agag in stukken, voor het aangezicht des HEEREN te Gilgal”. Amalekitische plunderaars verbrandden Davids Ziklag en vluchtten op kamelen; de man die beweerde Saul te hebben gedood was een Amalekiet. De laatsten van hen, zegt Kronieken, werden onder Chizkia door Simeonieten op het gebergte Seïr vernietigd. In Ester is Haman “den Agagiet”, in de joodse overlevering een nakomeling van Agag, en de synagoge leest nog steeds “Gedenkt, wat u Amalek gedaan heeft” op de sabbat vóór Purim."
    - "Geleerden merken op dat Genesis al “het land der Amalekieten” kent in de dagen van Abraham, generaties voordat Amalek aan Elifaz werd geboren; ofwel noemt de schrijver het land naar zijn latere volk, ofwel waren de Amalekieten ouder dan die genealogie, en “de eersteling der heidenen” is gelezen als de oudste van hen. Verkenningen van de Negev en de Sinaï tonen dat herders van de Bronstijd en de ijzertijd weinig meer achterlieten dan stenen cirkels en scherven, zodat een volk van tenten waarschijnlijk niet door opgraving wordt gevonden; de “stad Amalek” die Saul bereikte is gezocht bij Tel Masos, het Chorma van de kaart, maar dat is een gok. In het latere joodse denken werd Amalek de naam van elke vijand van Israël, en het gebod hem uit te wissen heeft lezers sinds de oudheid verontrust."
  sv:
    - "Amalekiterna var ett nomadfolk i Negev och Sinaiöknen, mellan Judas bergsbygd och Egypten, och de är bara kända från Bibeln: ingen egyptisk eller assyrisk text och ingen utgrävning har ännu nämnt dem. Kartans punkt för Amalek står vid Kadesh-Barnea, omkring 145 km sydväst om Jerusalem i fågelvägen, där Första Moseboken förlägger ”amalekiternas hela land” och där spejarna rapporterade att ”Amalekiterna bo i Sydlandet”. Saul förföljde dem ”från Havila fram emot Sur, som ligger öster om Egypten”, och på Davids tid bodde de, som det heter, ”sedan gammalt där i landet, fram emot Sur och ända intill Egyptens land”. Första Moseboken gör Amalek till sonson till Esau genom Elifas och hans bihustru Timna; Bileam sjunger: ”En förstling bland folken är Amalek”."
    - "Deras krig med Israel löper genom hela berättelsen. Vid Refidim ”kom Amalek och gav sig i strid med Israel”, och angrep, som det sägs, ”alla de svaga som hade blivit efter”; Herren svor att ”HERREN skall strida mot Amalek från släkte till släkte”. När Israel försökte gå in i landet mot hans ord, jagade amalekiter och kananéer dem till Horma. Eglon av Moab och midjaniterna på Gideons tid tog med sig amalekiter."
    - "På Sauls tid sände Samuel honom: ”Så drag nu åstad och slå amalekiterna och giv dem till spillo, med allt vad de hava”; Saul skonade Agag och det bästa av hjordarna, förlorade riket därför, och Samuel högg ”Agag i stycken inför HERREN, i Gilgal”. Amalekitiska plundrare brände Davids Siklag och flydde på kameler; mannen som sade sig ha dödat Saul var en amalekit. De sista av dem, säger Krönikeböckerna, förintades av simeoniter i Seirs berg under Hiskias regering. I Ester är Haman ”agagiten”, i judisk tradition en ättling till Agag, och synagogan läser fortfarande ”Kom ihåg vad Amalek gjorde mot dig” på sabbaten före Purim."
    - "Forskare noterar att Första Moseboken redan på Abrahams tid känner ”amalekiternas hela land”, generationer innan Amalek föddes åt Elifas; antingen namnger skribenten landet efter dess senare folk, eller så var amalekiterna äldre än den släktlinjen, och ”en förstling bland folken” har lästs som det äldsta av dem. Undersökningar av Negev och Sinai visar att herdar under brons- och järnåldern lämnade lite annat än stencirklar och skärvor, så ett tältfolk går knappast att finna genom grävning; ”Amaleks stad” som Saul nådde har sökts vid Tel Masos, kartans Horma, men detta är en gissning. I senare judisk tanke blev Amalek namnet på varje Israels fiende, och befallningen att utplåna honom har oroat läsare sedan antiken."
  nb:
    - "Amalekittene var et nomadefolk i Negev og Sinai-ørkenen, mellom Judas fjellland og Egypt, og de er bare kjent fra Bibelen: ingen egyptisk eller assyrisk tekst og ingen utgraving har så langt nevnt dem. Kartets punkt for Amalek står i Kadesj-Barnea, omtrent 145 km sørvest for Jerusalem i luftlinje, der Første Mosebok plasserer «hele amalekittenes land» og der speiderne meldte at «Amalekittene bor i sydlandet». Saul forfulgte dem «fra Havila til bortimot Sur, som ligger østenfor Egypten», og på Davids tid var de folk som «fra eldgammel tid hadde bodd i det land som strekker sig bortimot Sur». Første Mosebok gjør Amalek til et barnebarn av Esau ved Elifas og hans medhustru Timna; Bileam kaller ham «Det første blandt hedningefolkene»."
    - "Deres krig med Israel går gjennom hele fortellingen. Ved Refidim «kom Amalek og stred med Israel», og falt over «alle de utmattede som var blitt liggende efter»; Herren sa at han skulle «stride mot Amalek fra slekt til slekt». Da Israel forsøkte å gå inn i landet mot hans ord, jagde amalekitter og kanaaneere dem til Horma. Eglon av Moab og midianittene på Gideons tid tok med seg amalekitter."
    - "Da Saul var konge, sendte Samuel ham: «Gå nu avsted og slå Amalek, og slå med bann alt hvad hans er»; Saul sparte Agag og det beste av feet, mistet riket for det, og «Så hugg Samuel Agag ned for Herrens åsyn i Gilgal». Amalekittiske plyndrere brente Davids Siklag og flyktet på kameler; mannen som påsto å ha drept Saul, var en amalekitt. De siste av dem, sier Krønikebøkene, ble utryddet av simeonittene i Seirfjellet i Hiskias tid. I Ester er Haman «agagitten», en etterkommer av Agag i jødisk tradisjon, og synagogen leser fortsatt «Kom i hu hvad Amalek gjorde mot dig på veien» på sabbaten før purim."
    - "Forskere påpeker at Første Mosebok allerede kjenner «amalekittenes land» på Abrahams tid, generasjoner før Amalek ble født av Elifas; enten navngir forfatteren landet etter dets senere folk, eller så var amalekittene eldre enn den slektsrekken, og «Det første blandt hedningefolkene» er blitt lest som det eldste av dem. Undersøkelser av Negev og Sinai viser at gjetere i bronse- og jernalderen etterlot lite annet enn steinsirkler og potteskår, så et teltfolk finner man neppe ved å grave; «amalekittenes by» som Saul nådde, er søkt ved Tel Masos, kartets Horma, men dette er en gjetning. I senere jødisk tenkning ble Amalek navnet på hver fiende av Israel, og befalingen om å utslette ham har plaget lesere siden antikken."
  tl:
    - "Ang mga Amalecita ay isang bayang lagalag sa Negev at disyerto ng Sinai, sa pagitan ng maburol na lupain ng Juda at Egipto, at kilala lamang sa Biblia: wala pang tekstong Egipcio o Asirio at paghuhukay na nagpangalan sa kanila. Nasa Cades-barnea ang punto ng mapa para sa Amalec, mga 145 km sa timog-kanluran ng Jerusalem sa tuwid na guhit, kung saan inilalagay ng Genesis ang “buong lupain ng mga Amalecita” at kung saan iniulat ng mga tiktik na “Si Amalec ay tumatahan sa lupain ng Timugan”. Tinugis sila ni Saul “mula sa Havila kung patungo ka sa Shur, na nasa tapat ng Egipto”, at nang panahon ni David sila ay “dating nangananahan sa lupain, mula nang gaya ng kung ikaw ay paroroon sa Shur”. Ginagawa ng Genesis si Amalec na apo ni Esau kay Eliphaz at sa kaniyang babae na si Timna; tinatawag siya ni Balaam na “siyang dating panguna sa mga bansa”."
    - "Dumadaloy sa buong salaysay ang digmaan nila sa Israel. Sa Rephidim, “dumating si Amalec, at nakipaglaban sa Israel”, na sinalakay ang “yaong lahat na mahina sa hulihan mo”; sumumpa ang Panginoon na “makikipagdigma kay Amalec sa buong panahon ng lahi nito”. Nang tangkaing pumasok ng Israel sa lupain laban sa kaniyang salita, hinabol sila ng mga Amalecita at Cananeo hanggang Horma. Isinama ni Eglon ng Moab at ng mga Midianita nang panahon ni Gedeon ang mga Amalecita."
    - "Nang hari si Saul, isinugo siya ni Samuel: “Ngayo'y yumaon ka at saktan mo ang Amalec, at iyong lubos na lipulin ang buo nilang tinatangkilik”; iniligtas ni Saul si Agag at ang pinakamahusay sa kawan, nawala ang kaharian dahil dito, at “pinagputolputol ni Samuel si Agag sa harap ng Panginoon sa Gilgal”. Sinunog ng mga mananalakay na Amalecita ang Siclag ni David at tumakas sa mga kamelyo; Amalecita ang taong nag-angking pumatay kay Saul. Ang huli sa kanila, ayon sa Mga Cronica, ay winasak ng mga Simeonita sa Bundok Seir sa paghahari ni Ezechias. Sa Esther, si Aman ay “Agageo”, inapo ni Agag sa tradisyong Judio, at binabasa pa rin ng sinagoga ang “Alalahanin mo ang ginawa sa iyo ng Amalec” sa sabbath bago ang Purim."
    - "Napapansin ng mga iskolar na kilala na ng Genesis ang “buong lupain ng mga Amalecita” noong panahon ni Abraham, mga salinlahi bago ipanganak si Amalec kay Eliphaz; pinangalanan ng manunulat ang lupain sa kalaunang bayan nito o mas matanda ang mga Amalecita kaysa sa talaangkan, at ang “siyang dating panguna sa mga bansa” ay binasa bilang pinakamatanda sa kanila. Ipinapakita ng mga pagsisiyasat sa Negev at Sinai na halos mga bilog na bato at piraso ng palayok lamang ang iniwan ng mga pastol ng Panahong Tanso at Bakal, kaya malabong matagpuan sa paghuhukay ang bayan ng mga tolda; ang “bayan ng Amalec” na narating ni Saul ay hinanap sa Tel Masos, ang Horma ng mapa, ngunit hula ito. Sa kalaunang kaisipang Judio, ang Amalec ay naging pangalan ng bawat kaaway ng Israel, at ang utos na pawiin siya ay bumabagabag sa mga mambabasa mula pa noong sinaunang panahon."
  da:
    - "Amalekitterne var et nomadefolk i Negev og Sinai-ørkenen, mellem Judas bjerge og Egypten, og de kendes kun fra Bibelen: Ingen egyptisk eller assyrisk tekst og ingen udgravning har endnu nævnt dem. Kortets punkt for Amalek står ved Kadesj-Barnea, ca. 145 km sydvest for Jerusalem i fugleflugt, hvor Første Mosebog placerer »Amalekiternes hele Land«, og hvor spionerne meldte, at »Amalek bor sydligt i Landet«. Saul forfulgte dem »fra Hevila indtil man kommer til Sur, som ligger lige for Ægypten«, og i Davids tid »boede« de »i Landet, som hørte dem til fra gammel Tid, i Retningen af Schur«. Første Mosebog gør Amalek til sønnesøn af Esau ved Elifaz og hans medhustru Timna; Bileam kalder ham »det første af Hedningefolkene«."
    - "Deres krig med Israel løber gennem hele historien. Ved Refidim kom Amalek og »stred imod Israel«, idet han slog Israels »Bagtrop, alle de udmattede, som droge efter dig«; »Herrens Strid skal være imod Amalek fra Slægt til Slægt«. Da Israel forsøgte at trænge ind i landet mod hans ord, jagede amalekitter og kana’anæere dem til Horma. Eglon af Moab og midianitterne i Gideons tid tog amalekitter med sig."
    - "Da Saul var konge, sendte Samuel ham: »Gak nu hen, og du skal slaa Amalek, og I skulle ødelægge alt det, han har«; Saul skånede Agag og det bedste af hjorden, mistede kongedømmet derfor, og Samuel »sønderhuggede Agag for Herrens Ansigt i Gilgal«. Amalekitiske plyndrere brændte Davids Siklag og flygtede på kameler; manden, der påstod at have dræbt Saul, var en amalekit. De sidste af dem, siger Krønikebøgerne, blev udryddet af simeonitter i Se’ir-bjerget i Hizkijas tid. I Ester er Haman »Agagiten«, en efterkommer af Agag i jødisk tradition, og synagogen læser stadig »Kom i Hu, hvad Amalek gjorde dig paa Vejen« på sabbatten før Purim."
    - "Forskere bemærker, at Første Mosebog allerede kender »Amalekiternes hele Land« i Abrahams tid, generationer før Amalek blev født af Elifaz; enten navngiver forfatteren landet efter dets senere folk, eller amalekitterne var ældre end den slægtsregistrering, og »det første af Hedningefolkene« er blevet læst som det ældste af dem. Undersøgelser af Negev og Sinai viser, at hyrder fra bronze- og jernalderen efterlod lidt andet end stencirkler og potteskår, så et folk af telte er usandsynligt at blive fundet ved udgravning; »Amaleks Stad«, Saul nåede, er blevet søgt ved Tel Masos, kortets Horma, men det er et gæt. I senere jødisk tænkning blev Amalek navnet på enhver af Israels fjender, og befalingen om at udslette ham har plaget læsere siden antikken."
  sr:
    - "Амаличани су били номадски народ Негева и синајске пустиње, између јудејског горја и Египта, и познати су само из Библије: ниједан египатски или асирски текст ни ископавање још их није именовало. Тачка Амалика на карти стоји у Кадис-Варнији, око 145 км југозападно од Јерусалима ваздушном линијом, где Постање говори о „земљи амаличкој“ и где су уходе јавиле да „Амалик живи на јужној страни“. Саул их је гонио „од Авиле до Сура, који је према Мисиру“, а у Давидово време народи „живљаху од старине у оној земљи од Сура па до земље мисирске“. Постање чини Амалика унуком Исава од Елифаса и његове иноче Тамне; Валам каже: „Амалик је почетак народима“."
    - "Њихов рат са Израелом протеже се кроз целу причу. „Дође Амалик да се бије с Израиљем у Рафидину“, нападајући „све уморне који иђаху за тобом“; Господ се заклео: „Господ ће ратовати на Амалика од колена до колена“. Кад је Израел покушао да уђе у земљу против његове речи, Амаличани и Хананеји потерали су их до Хорме. Јеглон Моавски и Мадијанци из Гедеоновог доба довели су са собом Амаличане."
    - "Кад је Саул био краљ, Самуило га је послао: „иди и побиј Амалика, и затри као проклето све што год има“; Саул је поштедео Агага и најбоље из стада, изгубио је због тога краљевство, а „исече Самуило Агага пред Господом у Галгалу“. Амалички пљачкаши спалили су Давидов Сиклаг и побегли на камилама; човек који је тврдио да је убио Саула био је Амаличанин. Последње од њих, кажу Летописи, уништили су Симеуновци на гори Сеир у Језекијино доба. У Јестири је Аман Агагеј, потомак Агага по јеврејском предању, а синагога још чита „Опомињи се шта ти је учинио Амалик“ у суботу пред Пурим."
    - "Научници напомињу да Постање већ познаје „земљу амаличку“ у Аврамово доба, нараштајима пре него што се Амалик родио Елифасу; или писац земљу назива по њеном каснијем народу, или су Амаличани били старији од те родословне линије, а „почетак народима“ тумачен је као најстарији међу њима. Истраживања Негева и Синаја показују да су пастири бронзаног и гвозденог доба оставили мало осим камених кругова и црепова, па је народ шатора мало вероватно наћи копањем; „град амалички“ до којег је Саул стигао тражен је у Тел Масосу, Хорми са карте, али је то нагађање. У каснијој јеврејској мисли Амалик је постао име сваког непријатеља Израела, а заповест да се он збрише мучи читаоце од античког доба."
  hu:
    - "Az amálekiták a Negev és a Sínai-sivatag nomád népe voltak, Júda hegyvidéke és Egyiptom között, és csak a Bibliából ismertek: egyetlen egyiptomi vagy asszír szöveg és egyetlen ásatás sem nevezte meg őket eddig. A térkép Amálek-pontja Kádes-Barneánál áll, Jeruzsálemtől légvonalban mintegy 145 km-re délnyugatra, ahol a Mózes első könyve „az Amálekiták egész mezőségét” helyezi, és ahol a kémek jelentették: „Amálek lakik a dél felől való földön”. Saul megverte őket „Havilától fogva egészen addig, a merre Súrba mennek, mely Égyiptom átellenében van”, Dávid napjaiban pedig „ezek voltak annak a földnek lakosai eleitől fogva, a melyen Súrba mégy egészen Égyiptom földéig”. A Mózes első könyve Amáleket Ézsau unokájává teszi Elifáz és ágyasa, Timna révén; Bálám így nevezi: „Amálek első a nemzetek között”."
    - "Háborújuk Izráellel végigvonul az egész történeten. Refidimnél „Eljöve pedig Amálek és hadakozék Izráel ellen Refidimben”, rátámadva „mind az erőtleneket, a kik hátul valának”; az Úr megesküdött: „harcza lesz az Úrnak Amálek ellen nemzetségről nemzetségre”. Amikor Izráel szava ellenére megpróbált bejutni az országba, az amálekiták és kánaániak Hormáig üldözték. A moábi Eglon és Gedeon napjainak midiánitái magukkal hozták az amálekitákat."
    - "Saul királysága idején Sámuel elküldte: „Most azért menj el és verd meg Amáleket, és pusztítsátok el mindenét”; Saul megkímélte Agágot és a nyájak javát, ezért elvesztette a királyságot, Sámuel pedig „darabokra vagdalá … Agágot az Úr előtt Gilgálban”. Amálekita fosztogatók felégették Dávid Ciklagját, és tevéken menekültek; az a férfi, aki azt állította, hogy megölte Sault, amálekita volt. Az utolsókat, mondja a Krónikák könyve, Ezékiás idején Széir hegyén simeoniták pusztították el. Eszter könyvében Hámán agágita, a zsidó hagyomány szerint Agág leszármazottja, a zsinagóga pedig a Purim előtti szombaton ma is olvassa: „Megemlékezzél arról, a mit Amálek cselekedett rajtad az úton”."
    - "A tudósok megjegyzik, hogy a Mózes első könyve már Ábrahám napjaiban ismeri „az Amálekiták egész mezőségét”, nemzedékekkel azelőtt, hogy Amálek megszületett Elifáznak; vagy az író a földet későbbi népéről nevezi meg, vagy az amálekiták régebbiek voltak annál a nemzedékrendnél, és az „első a nemzetek között” kifejezést a legrégebbiként is értelmezték. A Negev és a Sínai felmérései azt mutatják, hogy a bronz- és vaskor pásztorai alig hagytak többet kőköröknél és cserepeknél, így a sátrak népét aligha találják meg ásatással; az Amálek városát, amelyig Saul eljutott, Tel Masosnál keresik, a térkép Hormájánál, de ez találgatás. A későbbi zsidó gondolkodásban Amálek Izráel minden ellenségének neve lett, és a parancs, hogy töröljék el, ókor óta zavarja az olvasókat."
  fi:
    - "Amalekilaiset olivat Negevin ja Siinain autiomaan paimentolaiskansa Juudan vuoriston ja Egyptin välissä, ja heidät tunnetaan vain Raamatusta: yksikään egyptiläinen tai assyrialainen teksti eikä yksikään kaivaus ole vielä nimennyt heitä. Amalekin kartan piste on Kades-Barneassa, linnuntietä noin 145 km Jerusalemista lounaaseen, jonne Genesis sijoittaa ”koko amalekilaisten maan” ja jossa vakoojat ilmoittivat: ”Amalekilaiset asuvat Etelämaassa.” Saul ajoi heitä takaa ”Havilasta Suuriin päin, joka on Egyptistä itään päin”, ja Daavidin päivinä he ”asuivat siinä maassa, joka muinoin ulottui Suuriin päin”. Genesis tekee Amalekista Esaun pojanpojan Elifaan ja tämän sivuvaimon Timnan kautta; Bileam sanoo hänestä: ”Kansakunnista ensimmäinen on Amalek”."
    - "Heidän sotansa Israelia vastaan kulkee läpi koko kertomuksen. ”Sitten tulivat amalekilaiset ja taistelivat Israelia vastaan Refidimissä”, kaataen ”kaikki heikommat, jotka kulkivat jälkipäässä”; sota julistettiin ikuiseksi: ”Herra sotii amalekilaisia vastaan sukupolvesta sukupolveen”. Kun Israel yritti astua maahan hänen sanaansa vastaan, amalekilaiset ja kanaanilaiset ajoivat heitä Hormaan asti. Moabin Eglon ja Gideonin ajan midianilaiset toivat amalekilaisia mukanaan."
    - "Saulin ollessa kuningas Samuel lähetti hänet: ”Mene siis ja voita amalekilaiset, ja vihkikää tuhon omaksi kaikki, mitä heillä on”; Saul säästi Agagin ja parhaat lampaat, menetti sen vuoksi valtakunnan, ja Samuel ”hakkasi Agagin kappaleiksi Herran edessä Gilgalissa”. Amalekilaiset ryöstäjät polttivat Daavidin Siklagin ja pakenivat kameleilla; mies, joka väitti surmanneensa Saulin, oli amalekilainen. Viimeiset heistä, Aikakirjat sanoo, tuhosivat simeonilaiset Seirvuorella Hiskian aikana. Esterin kirjassa Haman on agagilainen, perimätiedon mukaan Agagin jälkeläinen, ja synagogassa luetaan yhä ”Muista, mitä Amalek teki sinulle” purimia edeltävänä sapattina."
    - "Tutkijat huomauttavat, että Genesis tuntee ”amalekilaisten maan” jo Abrahamin päivinä, sukupolvia ennen kuin Amalek syntyi Elifaalle; joko kirjoittaja nimeää maan sen myöhemmän kansan mukaan tai amalekilaiset olivat vanhempia kuin tuo sukuluettelo, ja ”Kansakunnista ensimmäinen” on luettu vanhimmaksi niistä. Negevin ja Siinain kartoitukset osoittavat, että pronssi- ja rautakauden paimenet jättivät vähän muuta kuin kivirenkaita ja sirpaleita, joten telttojen kansaa ei todennäköisesti löydetä kaivamalla; ”amalekilaisten kaupunkia”, jonne Saul tuli, on etsitty Tel Masosista, kartan Hormasta, mutta tämä on arvaus. Myöhemmässä juutalaisessa ajattelussa Amalekista tuli jokaisen Israelin vihollisen nimi, ja käsky pyyhkiä hänet pois on vaivannut lukijoita antiikista lähtien."
  vi:
    - "Người A-ma-léc là một dân du mục ở Negev và sa mạc Sinai, giữa vùng đồi Giu-đa và Ê-díp-tô, và chỉ được biết qua Kinh Thánh: không văn bản Ai Cập hay A-si-ri nào và không cuộc khai quật nào đã nêu tên họ. Điểm của A-ma-léc trên bản đồ nằm tại Ca-đe-Ba-nê-a, cách Giê-ru-sa-lem khoảng 145 km về phía tây nam theo đường thẳng, nơi sách Sáng thế đặt “khắp miền dân A-ma-léc” và nơi các thám tử báo rằng “Dân A-ma-léc ở miền Nam”. Sau-lơ đuổi họ “từ Ha-vi-la cho đến Su-rơ, đối ngang xứ Ê-díp-tô”, và vào thời Đa-vít họ là “những dân tộc từ lâu đời ở miền lân cận Su-rơ cho đến xứ Ê-díp-tô”. Sách Sáng thế cho A-ma-léc là cháu của Ê-sau qua Ê-li-pha và vợ lẽ Thim-na; Ba-la-am gọi ông là “đứng đầu các nước”."
    - "Cuộc chiến của họ với Y-sơ-ra-ên chạy suốt câu chuyện. Tại Rê-phi-đim “dân A-ma-léc đến khêu chiến cùng Y-sơ-ra-ên”, xông vào đánh “các người yếu theo ngươi”; Đức Giê-hô-va thề rằng Ngài sẽ “chinh chiến với A-ma-léc từ đời nầy qua đời kia”. Khi Y-sơ-ra-ên toan vào xứ trái lời Ngài, người A-ma-léc và người Ca-na-an đuổi họ đến Họt-ma. Éc-lôn của Mô-áp và người Ma-đi-an thời Ghê-đê-ôn đem người A-ma-léc theo."
    - "Khi Sau-lơ làm vua, Sa-mu-ên sai ông: “hãy đi đánh dân A-ma-léc và diệt hết mọi vật thuộc về chúng nó”; Sau-lơ tha A-ga và những con vật tốt nhất, vì thế mất ngôi, và “Sa-mu-ên bèn giết A-ga trước mặt Đức Giê-hô-va tại Ghinh-ganh”. Bọn cướp A-ma-léc đốt Xiếc-lác của Đa-vít và chạy trốn bằng lạc đà; người xưng đã giết Sau-lơ là một người A-ma-léc. Sách Sử Ký nói những người cuối cùng bị người Si-mê-ôn tiêu diệt ở núi Sê-i-rơ thời Ê-xê-chia. Trong sách Ê-xơ-tê, Ha-man là “người A-gát”, hậu duệ của A-ga theo truyền thống Do Thái, và nhà hội vẫn đọc “Hãy nhớ điều A-ma-léc đã làm cho ngươi” vào ngày Sa-bát trước Lễ Purim."
    - "Các học giả ghi nhận rằng sách Sáng thế đã biết “miền dân A-ma-léc” vào thời Áp-ra-ham, nhiều thế hệ trước khi A-ma-léc được sinh ra cho Ê-li-pha; hoặc người viết gọi tên xứ theo dân về sau, hoặc người A-ma-léc cổ hơn gia phả ấy, và “đứng đầu các nước” đã được đọc là lâu đời nhất trong số đó. Các cuộc khảo sát Negev và Sinai cho thấy những người chăn thả thời Đồ Đồng và Đồ Sắt chỉ để lại vòng đá và mảnh gốm, nên một dân sống trong lều khó được tìm thấy bằng khai quật; “thành A-ma-léc” mà Sau-lơ đến được tìm ở Tel Masos, Họt-ma của bản đồ, nhưng đó là phỏng đoán. Trong tư tưởng Do Thái về sau, A-ma-léc trở thành tên của mọi kẻ thù của Y-sơ-ra-ên, và mệnh lệnh xóa bỏ ông đã làm người đọc băn khoăn từ thời cổ đại."
  ro:
    - "Amaleciții erau un popor nomad din Neghev și din deșertul Sinai, între ținutul deluros al lui Iuda și Egipt, și sunt cunoscuți doar din Biblie: niciun text egiptean sau asirian și nicio săpătură nu i-a numit până acum. Punctul Amalecului de pe hartă se află la Cades-Barnea, la circa 145 km sud-vest de Ierusalim în linie dreaptă, unde Geneza pune ținutul amaleciților și unde iscoadele au raportat: „În pământul cel despre miazăzi lăcuește Amalic”. Saul i-a urmărit de la Havila până la Șur, în fața Egiptului, iar în zilele lui David ei erau locuitorii țării pe unde se merge spre Șur: „pământul erà lăcuit dela Ghelamsur și până la pământul Eghipetului”. Geneza face din Amalec un nepot al lui Esau prin Elifaz și concubina lui Timna; Balaam îl numește „începutul neamurilor”."
    - "Războiul lor cu Israel străbate întreaga poveste. La Refidim „a venit Amalic și băteà pre Israil”, lovind „pre cei osteniți, carii erau dinapoia ta”; Domnul a jurat: „cu mână ascunsă bate Domnul pre Amalic din neam în neam.” Când Israel a încercat să intre în țară împotriva cuvântului Lui, amaleciții și canaaniții i-au gonit până la Horma. Eglon al Moabului și madianiții din zilele lui Ghedeon i-au adus cu ei pe amaleciți."
    - "Pe când Saul era rege, Samuel l-a trimis să lovească Amalec și să nimicească tot ce au; Saul i-a cruțat pe Agag și cele mai bune dintre turme, și-a pierdut pentru aceasta regatul, iar „a tăiat Samuil pre Agag înaintea Domnului în Galgala”. Prădători amaleciți au ars Țiclagul lui David și au fugit pe cămile; omul care a pretins că l-a ucis pe Saul era amalecit. Cei din urmă, spune cartea Cronicilor, au fost nimiciți de simeoniți în muntele Seir, în domnia lui Ezechia. În Estera, Haman este numit agaghit, un descendent al lui Agag potrivit tradiției iudaice, iar sinagoga citește și azi „Adu-ți aminte, câte ți-a făcut ție Amalic pre cale” în sabatul dinaintea Purimului."
    - "Cercetătorii observă că Geneza cunoaște deja ținutul amaleciților în zilele lui Avraam, cu generații înainte ca Amalec să se nască din Elifaz; fie autorul numește țara după poporul ei de mai târziu, fie amaleciții erau mai vechi decât acea genealogie, iar „începutul neamurilor” a fost citit ca cel mai vechi dintre ele. Cercetările din Neghev și Sinai arată că păstorii din Epoca Bronzului și a Fierului nu au lăsat decât cercuri de piatră și cioburi, așa că un popor al corturilor este puțin probabil să fie găsit prin săpături; cetatea lui Amalec la care a ajuns Saul a fost căutată la Tel Masos, Horma de pe hartă, dar aceasta este o presupunere. În gândirea iudaică de mai târziu, Amalec a devenit numele fiecărui dușman al lui Israel, iar porunca de a-l șterge i-a frământat pe cititori încă din Antichitate."
  bg:
    - "Амаликитяните бяха номадски народ от Негев и Синайската пустиня, между планинската страна на Юда и Египет, и са известни само от Библията: досега нито египетски или асирийски текст, нито разкопки са ги назовали. Точката на картата за Амалик стои при Кадес-Варни, на около 145 км югозападно от Йерусалим по права линия, където Битие поставя „всичкото място на Амаличаните“ и където съгледвачите съобщиха, че „Амаличаните живеят в таз земя към юг“. Саул ги порази „от Евила до входа на Сур, срещу Египет“, а по времето на Давид те бяха „от старо време жители на земята, от входа на Сур“. Битие прави Амалик внук на Исав от Елифаз и наложницата му Тамна; Валаам го нарича „начало на народите“."
    - "Войната им с Израил минава през целия разказ. При Рефидим „дойде Амалик и направи бой с Израиля“, като нападна „всичките ослабнали зад тебе“; Господ се закле, че „ще бъде Господня бран против Амалика от род в род“. Когато Израил се опита да влезе в земята против словото му, амаликитяни и ханаанци го гониха до Хорма. Еглон Моавски и мадиамците от времето на Гедеон водеха амаликитяни със себе си."
    - "Когато Саул беше цар, Самуил го изпрати: „Иди сега та порази Амалика, и изтреби всичко що има“; Саул пощади Агаг и най-доброто от стадата, загуби заради това царството, а Самуил „съсече… Агага пред Господа в Галгал“. Амаликитски нападатели изгориха Давидовия Циклаг и избягаха на камили; човекът, който твърдеше, че е убил Саул, беше амаликитянин. Последните от тях, казват Летописите, бяха изтребени от симеонци в планината Сеир по времето на Езекия. В Естир Аман е „Агагеца“, потомък на Агаг според юдейското предание, а синагогата и днес чете „Помни що ти направи Амалик“ в съботата преди Пурим."
    - "Учените отбелязват, че Битие вече познава „всичкото място на Амаличаните“ по времето на Авраам, поколения преди Амалик да се роди от Елифаз: или авторът назовава земята по по-късния ѝ народ, или амаликитяните са по-стари от това родословие, а „начало на народите“ е тълкувано като най-стария от тях. Проучванията в Негев и Синай показват, че пастирите от бронзовата и желязната епоха са оставили малко освен каменни кръгове и керамика, така че народ от шатри едва ли ще бъде открит с разкопки; Амаликовият град, до който стигна Саул, е търсен при Тел Масос — Хорма на картата, но това е догадка. В по-късната юдейска мисъл Амалик стана име на всеки враг на Израил, а заповедта той да бъде заличен смущава читателите от древността насам."
