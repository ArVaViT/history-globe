id: where-was-the-decapolis
question:
  en: "Where was the Decapolis?"
  ru: "Где находилось Десятиградие?"
  uk: "Де було Десятимістя?"
  es: "¿Dónde estaba la Decápolis?"
  pt: "Onde ficava a Decápolis?"
  de: "Wo lag die Dekapolis?"
  fr: "Où se trouvait la Décapole ?"
  pl: "Gdzie leżał Dekapol?"
  it: "Dov’era la Decapoli?"
  cs: "Kde leželo Dekapolis?"
  nl: "Waar lag de Dekapolis?"
  sv: "Var låg Dekapolis?"
  nb: "Hvor lå Dekapolis?"
  tl: "Nasaan ang Decapolis?"
  da: "Hvor lå Dekapolis?"
  sr: "Где је био Декаполис?"
  hu: "Hol volt a Dekapolisz?"
  fi: "Missä Dekapolis sijaitsi?"
  vi: "Đê-ca-bô-lơ ở đâu?"
  ro: "Unde se afla Decapole?"
  bg: "Къде се е намирал Декаполис?"
answer:
  en:
    - "The Decapolis, the “ten cities”, was a group of Greek cities east and south-east of the Sea of Galilee, most of them beyond the Jordan in today's Jordan and Syria, with one, Scythopolis, west of the river in Israel. It was a region rather than a single place: the map's point for it stands about 23 km east-south-east of the middle of the lake, a little north-east of Gadara. The cities came under Rome in 63 BC, when Pompey freed them from Hasmonean rule."
    - 'Great multitudes followed Jesus "from Galilee, and from Decapolis, and from Jerusalem, and from Judaea, and from beyond Jordan". The man freed from a legion of devils on the far shore of the lake "began to publish in Decapolis how great things Jesus had done for him", and returning from Tyre and Sidon Jesus "came unto the sea of Galilee, through the midst of the coasts of Decapolis". The manuscripts name the country of the swine differently, Gadarenes, Gergesenes or Gerasenes: the KJV reads Gergesenes in Matthew and Gadarenes in Mark and Luke.'
    - "Pliny the Elder lists ten cities, though he notes that not all writers give the same ones: Damascus, Philadelphia (Rabbah, today's Amman), Raphana, Scythopolis (Beth-shan, which Josephus calls the largest), Gadara (Umm Qais, about 10 km south-east of the lake), Hippos, Dion, Pella, Gerasa (Jerash, more than 50 km from the lake) and Canatha. Gerasa, with its oval plaza and colonnaded streets, is now one of the best preserved Roman cities of the Near East. When the revolt of AD 66 broke out, Jewish bands attacked Gadara, Philadelphia and other cities, and the Greeks of Scythopolis killed the Jews of their own town."
  ru:
    - "Десятиградие, «десять городов», — это группа греческих городов к востоку и юго-востоку от Галилейского моря, большей частью за Иорданом на территории нынешних Иордании и Сирии, и один, Скифополь, к западу от реки в Израиле. Это скорее область, чем одно место: точка карты для него стоит примерно в 23 км к востоко-юго-востоку от середины озера, немного к северо-востоку от Гадары. Города перешли под власть Рима в 63 г. до н. э., когда Помпей освободил их от Хасмонеев."
    - "За Иисусом следовало «множество народа из Галилеи и Десятиградия, и Иерусалима, и Иудеи, и из-за Иордана». Человек, освобождённый от легиона бесов на дальнем берегу озера, «пошел и начал проповедывать в Десятиградии, что сотворил с ним Иисус», а возвращаясь из пределов Тира и Сидона, Иисус «пошел к морю Галилейскому через пределы Десятиградия». Рукописи по-разному называют страну, где паслись свиньи: Гадаринская, Гергесинская или Герасинская; Синодальный перевод, как и KJV, читает у Матфея «Гергесинская», у Марка и Луки — «Гадаринская»."
    - "Плиний Старший перечисляет десять городов, оговаривая, что не все авторы называют одни и те же: Дамаск, Филадельфия (Равва, нынешний Амман), Рафана, Скифополь (Беф-Сан, который Иосиф Флавий называет самым большим), Гадара (Умм-Кайс, около 10 км к юго-востоку от озера), Иппос, Дион, Пелла, Гераса (Джераш, более чем в 50 км от озера) и Каната. Гераса с её овальной площадью и улицами с колоннадами — сегодня один из лучше всего сохранившихся римских городов Ближнего Востока. Когда в 66 г. н. э. вспыхнуло восстание, иудейские отряды напали на Гадару, Филадельфию и другие города, а греки Скифополя перебили иудеев собственного города."
  uk:
    - "Десятимістя, «десять міст», було групою грецьких міст на схід і південний схід від Галілейського моря, більшість із них за Йорданом, у нинішній Йорданії та Сирії, і одне, Скитополь, на захід від річки, в Ізраїлі. Це була радше область, ніж одне місце: точка для нього на мапі стоїть приблизно за 23 км на схід-південний схід від середини озера, трохи на північний схід від Гадари. Міста перейшли під владу Рима 63 р. до н. е., коли Помпей визволив їх від влади Хасмонеїв."
    - "За Ісусом ішли великі натовпи «з Галилеї, й з Десятиграду, й з Єрусалиму, й з Юдеї, й зза Йордану». Чоловік, звільнений від легіону бісів на далекому березі озера, «почав проповідувати в Десятиградї, що зробив йому Ісус», а повертаючись з Тіру й Сидону, Ісус «прийшов до моря Галилейського, у гряницї Десятиградські». Рукописи по-різному називають країну свиней: гадаринці, гергесинці чи герасинці; Біблія короля Якова читає «гергесинці» в Матвія і «гадаринці» у Марка й Луки."
    - "Пліній Старший перелічує десять міст, хоча зауважує, що не всі автори називають одні й ті самі: Дамаск, Філадельфія (Равва, нинішній Амман), Рафана, Скитополь (Бет-Шеан, який Йосиф Флавій називає найбільшим), Гадара (Умм-Кайс, приблизно за 10 км на південний схід від озера), Гіппос, Діон, Пелла, Гераса (Джераш, понад 50 км від озера) і Канафа. Гераса з овальною площею та вулицями з колонадами — нині одне з найкраще збережених римських міст Близького Сходу. Коли 66 р. н. е. вибухнуло повстання, юдейські загони напали на Гадару, Філадельфію та інші міста, а греки Скитополя вбили юдеїв власного міста."
  es:
    - "La Decápolis, las «diez ciudades», era un grupo de ciudades griegas al este y sureste del mar de Galilea, la mayoría de ellas al otro lado del Jordán, en las actuales Jordania y Siria, con una, Escitópolis, al oeste del río, en Israel. Era una región más que un lugar único: el punto del mapa para ella está a unos 23 km al estesureste del centro del lago, un poco al noreste de Gadara. Las ciudades pasaron a Roma en 63 a. C., cuando Pompeyo las liberó del dominio asmoneo."
    - "Grandes multitudes seguían a Jesús «de Galilea y de Decápolis y de Jerusalem y de Judea y de la otra parte del Jordán». El hombre liberado de una legión de demonios en la orilla lejana del lago «comenzó á publicar en Decápolis cuán grandes cosas Jesús había hecho con él», y al volver de Tiro y Sidón Jesús «vino por Sidón á la mar de Galilea, por mitad de los términos de Decápolis». Los manuscritos nombran de manera distinta el país de los cerdos, gadarenos, gergesenos o gerasenos: la King James lee gergesenos en Mateo y gadarenos en Marcos y Lucas."
    - "Plinio el Viejo enumera diez ciudades, aunque advierte que no todos los autores dan las mismas: Damasco, Filadelfia (Rabá, la actual Amán), Rafana, Escitópolis (Bet-seán, que Josefo llama la mayor), Gadara (Umm Qais, a unos 10 km al sureste del lago), Hipos, Dión, Pella, Gerasa (Jerash, a más de 50 km del lago) y Canata. Gerasa, con su plaza oval y sus calles con columnatas, es hoy una de las ciudades romanas mejor conservadas del Próximo Oriente. Cuando estalló la revuelta del 66 d. C., bandas judías atacaron Gadara, Filadelfia y otras ciudades, y los griegos de Escitópolis mataron a los judíos de su propia ciudad."
  pt:
    - "A Decápolis, as “dez cidades”, era um grupo de cidades gregas a leste e sudeste do mar da Galileia, a maioria além do Jordão, na atual Jordânia e Síria, e uma delas, Citópolis, a oeste do rio, em Israel. Era uma região, e não um lugar único: o ponto do mapa para ela fica a cerca de 23 km a lés-sudeste do meio do lago, um pouco a nordeste de Gadara. As cidades passaram a Roma em 63 a.C., quando Pompeu as libertou do domínio asmoneu."
    - "Grandes multidões seguiam Jesus, “da Galileia, de Decápolis, de Jerusalém, da Judeia e do outro lado do Jordão”. O homem libertado de uma legião de demônios na margem oposta do lago “começou a proclamar em Decápolis tudo o que Jesus havia feito por ele”, e, voltando de Tiro e Sidom, Jesus “foi para o mar da Galileia, passando pelo meio da região de Decápolis”. Os manuscritos nomeiam de modo diferente a terra dos porcos, gadarenos, gergesenos ou gerasenos: a King James lê gergesenos em Mateus e gadarenos em Marcos e Lucas."
    - "Plínio, o Velho, relaciona dez cidades, embora observe que nem todos os autores dão as mesmas: Damasco, Filadélfia (Rabá, a atual Amã), Rafana, Citópolis (Bete-Seã, que Josefo chama de a maior), Gadara (Umm Qais, a cerca de 10 km a sudeste do lago), Hipos, Dio, Pela, Gerasa (Jerash, a mais de 50 km do lago) e Canata. Gerasa, com sua praça oval e ruas com colunatas, é hoje uma das cidades romanas mais bem preservadas do Oriente Próximo. Quando eclodiu a revolta de 66 d.C., bandos judeus atacaram Gadara, Filadélfia e outras cidades, e os gregos de Citópolis mataram os judeus da própria cidade."
  de:
    - "Die Dekapolis, die „Zehn Städte“, war eine Gruppe griechischer Städte östlich und südöstlich des Sees Genezareth, die meisten jenseits des Jordans im heutigen Jordanien und Syrien, eine, Skythopolis, westlich des Flusses in Israel. Sie war eher eine Region als ein einzelner Ort: Der Kartenpunkt für sie steht etwa 23 km ostsüdöstlich der Mitte des Sees, ein wenig nordöstlich von Gadara. Die Städte kamen 63 v. Chr. unter Rom, als Pompeius sie von der hasmonäischen Herrschaft befreite."
    - "Große Scharen folgten Jesus „aus Galiläa, aus den Zehn-Städten, von Jerusalem, aus dem jüdischen Lande und von jenseits des Jordans“. Der Mann, der am anderen Ufer des Sees von einer Legion Teufel befreit worden war, „fing an, auszurufen in den zehn Städten, wie große Wohltat ihm Jesus getan hatte“, und auf dem Rückweg von Tyrus und Sidon „kam er an das Galiläische Meer, mitten in das Gebiet der zehn Städte“. Die Handschriften nennen das Land der Schweine unterschiedlich, Gadarener, Gergesener oder Gerasener: Die Lutherbibel liest bei Matthäus Gergesener und bei Markus und Lukas Gadarener."
    - "Plinius der Ältere führt zehn Städte auf, merkt aber an, dass nicht alle Autoren dieselben nennen: Damaskus, Philadelphia (Rabba, das heutige Amman), Raphana, Skythopolis (Bet-Schean, das Josephus die größte nennt), Gadara (Umm Qais, etwa 10 km südöstlich des Sees), Hippos, Dion, Pella, Gerasa (Dscherasch, mehr als 50 km vom See) und Kanatha. Gerasa mit seinem ovalen Platz und seinen Säulenstraßen ist heute eine der besterhaltenen römischen Städte des Nahen Ostens. Als 66 n. Chr. der Aufstand ausbrach, griffen jüdische Banden Gadara, Philadelphia und andere Städte an, und die Griechen von Skythopolis töteten die Juden ihrer eigenen Stadt."
  fr:
    - "La Décapole, les « dix villes », était un groupe de villes grecques à l’est et au sud-est de la mer de Galilée, la plupart au-delà du Jourdain, dans la Jordanie et la Syrie actuelles, une seule, Scythopolis, se trouvant à l’ouest du fleuve, en Israël. C’était une région plutôt qu’un lieu unique : le point de la carte se trouve à environ 23 km à l’est-sud-est du milieu du lac, un peu au nord-est de Gadara. Les villes passèrent sous Rome en 63 av. J.-C., quand Pompée les libéra de la domination hasmonéenne."
    - "De grandes foules suivirent Jésus « de la Galilée, de la Décapole, de Jérusalem, de la Judée, et d’au delà du Jourdain ». L’homme délivré d’une légion de démons sur l’autre rive du lac « se mit à publier dans la Décapole tout ce que Jésus avait fait pour lui », et, revenant de Tyr et de Sidon, Jésus alla « vers la mer de Galilée, en traversant le pays de la Décapole ». Les manuscrits nomment différemment le pays des porcs, Gadaréniens, Gergéséniens ou Géraséniens : le texte de la King James Version lit Gergéséniens chez Matthieu et Gadaréniens chez Marc et chez Luc."
    - "Pline l’Ancien énumère dix villes, tout en notant que tous les auteurs ne donnent pas les mêmes : Damas, Philadelphie (Rabba, l’actuelle Amman), Raphana, Scythopolis (Beth-Schean, que Flavius Josèphe dit être la plus grande), Gadara (Umm Qais, à environ 10 km au sud-est du lac), Hippos, Dion, Pella, Gérasa (Jerash, à plus de 50 km du lac) et Canatha. Gérasa, avec sa place ovale et ses rues à colonnades, est aujourd’hui l’une des villes romaines les mieux conservées du Proche-Orient. Quand éclata la révolte de 66 apr. J.-C., des bandes juives attaquèrent Gadara, Philadelphie et d’autres villes, et les Grecs de Scythopolis tuèrent les Juifs de leur propre ville."
  pl:
    - "Dekapol, „dziesięć miast”, był grupą greckich miast na wschód i południowy wschód od Jeziora Galilejskiego, w większości za Jordanem, w dzisiejszej Jordanii i Syrii, z jednym, Scytopolis, na zachód od rzeki w Izraelu. Był raczej regionem niż pojedynczym miejscem: punkt na mapie dla niego stoi około 23 km na wschód-południowy wschód od środka jeziora, nieco na północny wschód od Gadary. Miasta weszły pod władzę Rzymu w 63 p.n.e., gdy Pompejusz uwolnił je spod rządów hasmonejskich."
    - "Wielkie rzesze szły za Jezusem „z Galilei, z dziesięciu miast, i z Jeruzalemu, i z Judzkiej ziemi, i zza Jordanu”. Człowiek uwolniony od legionu demonów na dalekim brzegu jeziora „począł opowiadać w dziesięciu miastach, jako mu wielkie rzeczy uczynił Jezus”, a wracając z Tyru i Sydonu Jezus „przyszedł nad morze Galilejskie, pośrodkiem granic dziesięciu miast”. Rękopisy różnie nazywają kraj świń: Gadareńczyków, Giergiezeńczyków lub Gerazeńczyków; Biblia Gdańska czyta Giergiezeńczyków u Mateusza, a Gadareńczyków u Marka i Łukasza."
    - "Pliniusz Starszy wymienia dziesięć miast, choć zaznacza, że nie wszyscy pisarze podają te same: Damaszek, Filadelfię (Rabba, dzisiejszy Amman), Rafanę, Scytopolis (Bet-Szean, które według Józefa Flawiusza było największe), Gadarę (Umm Qais, około 10 km na południowy wschód od jeziora), Hippos, Dion, Pellę, Gerasę (Dżarasz, ponad 50 km od jeziora) i Kanatę. Gerasa, ze swoim owalnym placem i ulicami z kolumnadami, jest dziś jednym z najlepiej zachowanych rzymskich miast Bliskiego Wschodu. Gdy wybuchło powstanie w 66 n.e., żydowskie bandy zaatakowały Gadarę, Filadelfię i inne miasta, a Grecy ze Scytopolis wymordowali Żydów własnego miasta."
  it:
    - "La Decapoli, le «dieci città», era un gruppo di città greche a est e sud-est del Lago di Tiberiade, per lo più al di là del Giordano, nell’odierna Giordania e Siria, con una, Scitopoli, a ovest del fiume in Israele. Era una regione più che un luogo singolo: il punto della mappa per essa si trova circa 23 km a est-sud-est del centro del lago, un po’ a nord-est di Gadara. Le città passarono sotto Roma nel 63 a.C., quando Pompeo le liberò dal dominio asmoneo."
    - "Grandi folle seguirono Gesù «dalla Galilea e dalla Decapoli e da Gerusalemme e dalla Giudea e d’oltre il Giordano». L’uomo liberato da una legione di demoni sulla riva opposta del lago «cominciò a pubblicare per la Decapoli le grandi cose che Gesù aveva fatto per lui», e tornando da Tiro e da Sidone Gesù «tornò verso il mar di Galilea», attraverso il territorio della Decapoli. I manoscritti nominano diversamente il paese dei porci, Gadareni, Gergeseni o Geraseni: la King James legge Gergeseni in Matteo e Gadareni in Marco e Luca."
    - "Plinio il Vecchio elenca dieci città, pur notando che non tutti gli autori danno le stesse: Damasco, Filadelfia (Rabba, l’odierna Amman), Rafana, Scitopoli (Beth-Shean, che Giuseppe Flavio chiama la più grande), Gadara (Umm Qais, a circa 10 km a sud-est del lago), Ippo, Dio, Pella, Gerasa (Jerash, a più di 50 km dal lago) e Canata. Gerasa, con la sua piazza ovale e le strade colonnate, è oggi una delle città romane meglio conservate del Vicino Oriente. Quando scoppiò la rivolta del 66 d.C., bande giudaiche attaccarono Gadara, Filadelfia e altre città, e i Greci di Scitopoli uccisero i Giudei della loro stessa città."
  cs:
    - "Dekapolis, „deset měst“, byla skupina řeckých měst východně a jihovýchodně od Galilejského jezera, většina z nich za Jordánem v dnešním Jordánsku a Sýrii, jedno, Skytopolis, západně od řeky v Izraeli. Byl to spíše kraj než jedno místo: bod pro něj na mapě stojí asi 23 km východojihovýchodně od středu jezera, kousek severovýchodně od Gadary. Města se dostala pod Řím roku 63 př. n. l., kdy je Pompeius osvobodil od hasmoneovské vlády."
    - "Velké zástupy šly za Ježíšem „z Galilee a z krajiny Desíti měst, i z Jeruzaléma i z Judstva i z Zajordání“. Muž osvobozený od legie ďáblů na protějším břehu jezera „počal ohlašovati v krajině Desíti měst, kterak veliké věci učinil mu Ježíš“ a vraceje se z Týru a Sidónu, Ježíš „přišel k moři Galilejskému, prostředkem krajin Desíti měst“. Rukopisy jmenují zemi vepřů různě, Gadarští, Gergesenští nebo Gerasenští: KJV čte u Matouše Gergesenští a u Marka a Lukáše Gadarští."
    - "Plinius Starší uvádí deset měst, ačkoli poznamenává, že ne všichni pisatelé uvádějí tatáž: Damašek, Filadelfii (Rabba, dnešní Ammán), Rafanu, Skytopolis (Bét-šean, který Josephus nazývá největším), Gadaru (Umm Qajs, asi 10 km jihovýchodně od jezera), Hippos, Dion, Pellu, Gerasu (Džaraš, přes 50 km od jezera) a Kanatu. Gerasa se svým oválným náměstím a ulicemi se sloupořadími je dnes jedním z nejlépe zachovaných římských měst Blízkého východu. Když roku 66 n. l. vypuklo povstání, židovské tlupy napadly Gadaru, Filadelfii a další města a Řekové ze Skytopole povraždili Židy vlastního města."
  nl:
    - "De Dekapolis, de “tien steden”, was een groep Griekse steden ten oosten en zuidoosten van het Meer van Galilea, de meeste voorbij de Jordaan in het huidige Jordanië en Syrië, met één, Scythopolis, ten westen van de rivier in Israël. Het was eerder een streek dan één plaats: het punt van de kaart daarvoor staat ongeveer 23 km ten oostzuidoosten van het midden van het meer, een beetje ten noordoosten van Gadara. De steden kwamen in 63 v.Chr. onder Rome, toen Pompeius hen bevrijdde van de heerschappij van de Hasmoneeën."
    - "Grote menigten volgden Jezus: “Vele scharen volgden Hem na, van Galilea en van Dekapolis, en van Jeruzalem, en van Judea, en van over de Jordaan”. De man die was bevrijd van een legioen duivels aan de overkant van het meer “begon te verkondigen in het land van Dekapolis, wat grote dingen hem Jezus gedaan had”, en toen Jezus terugkeerde uit Tyrus en Sidon, “kwam aan de zee van Galilea, door het midden der landpalen van Dekapolis”. De handschriften noemen het land van de zwijnen verschillend, Gadarenen, Gergesenen of Gerasenen: de King James Version leest Gergesenen bij Mattheüs en Gadarenen bij Marcus en Lukas."
    - "Plinius de Oudere noemt tien steden, hoewel hij opmerkt dat niet alle schrijvers dezelfde geven: Damascus, Filadelfia (Rabba, het huidige Amman), Raphana, Scythopolis (Beth-Sean, dat volgens Josephus de grootste was), Gadara (Umm Qais, ongeveer 10 km ten zuidoosten van het meer), Hippos, Dion, Pella, Gerasa (Jerash, meer dan 50 km van het meer) en Canatha. Gerasa, met zijn ovale plein en zuilenstraten, is nu een van de best bewaarde Romeinse steden van het Nabije Oosten. Toen in 66 n.Chr. de opstand uitbrak, vielen joodse benden Gadara, Filadelfia en andere steden aan, en de Grieken van Scythopolis doodden de joden van hun eigen stad."
  sv:
    - "Dekapolis, ”de tio städerna”, var en grupp grekiska städer öster och sydost om Galileiska sjön, de flesta bortom Jordan i dagens Jordanien och Syrien, med en, Skythopolis, väster om floden i Israel. Det var en region snarare än en enskild plats: kartans punkt för den står omkring 23 km öst-sydost om sjöns mitt, något nordost om Gadara. Städerna kom under Rom år 63 f.Kr., då Pompejus befriade dem från hasmoneiskt styre."
    - "Stora skaror följde Jesus ”ifrån Galileen och Dekapolis och Jerusalem och Judeen och från landet på andra sidan Jordan”. Mannen som befriades från en legion av onda andar på sjöns bortre strand ”begynte förkunna i Dekapolis huru stora ting Jesus hade gjort med honom”, och på återvägen från Tyros och Sidon kom Jesus ”genom Dekapolis’ område, till Galileiska sjön”. Handskrifterna anger svinens land olika, gadarener, gergesener eller gerasener: KJV har Gergesener i Matteus och Gadarener i Markus och Lukas."
    - "Plinius den äldre förtecknar tio städer, fast han noterar att inte alla författare anger samma: Damaskus, Filadelfia (Rabba, dagens Amman), Raphana, Skythopolis (Bet-Shean, som Josefus kallar den största), Gadara (Umm Qais, omkring 10 km sydost om sjön), Hippos, Dion, Pella, Gerasa (Jerash, mer än 50 km från sjön) och Kanata. Gerasa, med sitt ovala torg och sina kolonnadgator, är nu en av Främre Orientens bäst bevarade romerska städer. När upproret år 66 e.Kr. bröt ut angrep judiska band Gadara, Filadelfia och andra städer, och grekerna i Skythopolis dödade judarna i sin egen stad."
  nb:
    - "Dekapolis, «de ti byene», var en gruppe greske byer øst og sørøst for Galileasjøen, de fleste hinsides Jordan i dagens Jordan og Syria, med én, Skytopolis, vest for elven i Israel. Det var en region snarere enn ett enkelt sted: kartets punkt for den står omtrent 23 km øst-sørøst for midten av innsjøen, litt nordøst for Gadara. Byene kom under Roma i 63 f.Kr., da Pompeius befridde dem fra hasmoneernes styre."
    - "Store skarer fulgte Jesus «fra Galilea og Dekapolis og Jerusalem og Judea og landet hinsides Jordan». Mannen som ble befridd fra en legion av onde ånder på den andre bredden av innsjøen, «begynte å kunngjøre i Dekapolis hvor store ting Jesus hadde gjort imot ham», og på hjemveien fra Tyros og Sidon kom Jesus «til den Galileiske Sjø, midt igjennem Dekapolis-landet». Håndskriftene navngir svinenes land ulikt, gadarenere, gergesenere eller gerasenere: King James-oversettelsen har gergesenere hos Matteus og gadarenere hos Markus og Lukas."
    - "Plinius den eldre oppregner ti byer, men bemerker at ikke alle forfattere gir de samme: Damaskus, Filadelfia (Rabba, dagens Amman), Raphana, Skytopolis (Bet-Sjean, som Josefus kaller den største), Gadara (Umm Qais, omtrent 10 km sørøst for innsjøen), Hippos, Dion, Pella, Gerasa (Jerash, mer enn 50 km fra innsjøen) og Kanata. Gerasa, med sin ovale plass og gater med søyleganger, er nå en av de best bevarte romerske byene i Midtøsten. Da opprøret i 66 e.Kr. brøt ut, angrep jødiske bander Gadara, Filadelfia og andre byer, og grekerne i Skytopolis drepte jødene i sin egen by."
  tl:
    - "Ang Decapolis, ang “sampung lungsod”, ay isang pangkat ng mga lungsod na Griyego sa silangan at timog-silangan ng Dagat ng Galilea, na karamihan ay nasa kabila ng Jordan sa Jordan at Siria ngayon, at ang isa, ang Scythopolis, ay nasa kanluran ng ilog sa Israel. Isa itong rehiyon sa halip na isang lugar: ang punto ng mapa nito ay nasa mga 23 km sa silangan-timog-silangan ng gitna ng lawa, bahagyang hilagang-silangan ng Gadara. Napasailalim ng Roma ang mga lungsod noong 63 BK, nang palayain sila ni Pompeyo mula sa pamamahalang Hasmoneo."
    - "Sinundan si Jesus ng lubhang karamihang tao “mula sa Galilea at Decapolis at Jerusalem at Judea at mula sa dakong ibayo ng Jordan”. Ang lalaking pinalaya mula sa isang lehiyon ng mga demonyo sa malayong pampang ng lawa ay “nagpasimulang ihayag sa Decapolis kung gaanong kadakilang mga bagay ang sa kaniya'y ginawa ni Jesus”, at si Jesus ay “muling umalis sa mga hangganan ng Tiro, at napasa Sidon hanggang sa dagat ng Galilea, na kaniyang tinahak ang mga hangganan ng Decapolis”. Magkakaiba ang pangalan ng mga manuskrito sa lupain ng mga baboy, mga Gadareno, Gergeseno o Gerasano: binabasa ng KJV ang Gergeseno sa Mateo at Gadareno sa Marcos at Lucas."
    - "Inililista ni Plinio na Nakatatanda ang sampung lungsod, bagaman binabanggit niyang hindi magkakapareho ang ibinibigay ng lahat ng manunulat: Damasco, Filadelfia (Rabba, ang Amman ngayon), Raphana, Scythopolis (Beth-san, na tinatawag ni Josephus na pinakamalaki), Gadara (Umm Qais, mga 10 km sa timog-silangan ng lawa), Hippos, Dion, Pella, Gerasa (Jerash, mahigit 50 km mula sa lawa) at Canatha. Ang Gerasa, na may hugis-itlog na plaza at mga lansangang may hanay ng haligi, ay isa ngayon sa pinakamahusay na napanatiling lungsod ng Romano sa Malapit na Silangan. Nang sumiklab ang paghihimagsik ng 66 AD, sinalakay ng mga pangkat na Judio ang Gadara, Filadelfia at iba pang mga lungsod, at pinatay ng mga Griyego ng Scythopolis ang mga Judio ng sarili nilang bayan."
  da:
    - "Dekapolis, »de ti byer«, var en gruppe græske byer øst og sydøst for Genesaret Sø, de fleste hinsides Jordan i nutidens Jordan og Syrien, med én, Skythopolis, vest for floden i Israel. Det var snarere en region end ét sted: Kortets punkt for den står ca. 23 km øst-sydøst for midten af søen, lidt nordøst for Gadara. Byerne kom under Rom i 63 f.Kr., da Pompejus befriede dem fra hasmonæisk herredømme."
    - "Store skarer fulgte Jesus »fra Galilæa og Dekapolis og Jerusalem og Judæa og fra Landet hinsides Jordan«. Manden, der blev befriet fra en legion af dæmoner på søens fjerne bred, »begyndte at kundgøre i Dekapolis, hvor store Ting Jesus havde gjort imod ham«, og på vej tilbage fra Tyrus og Sidon »kom han over Sidon midt igennem Dekapolis’s Egne til Galilæas Sø«. Håndskrifterne navngiver svinenes land forskelligt, Gadarenernes, Gergesenernes eller Gerasenernes: King James-teksten har Gergesenernes i Mattæus og Gadarenernes i Markus og Lukas."
    - "Plinius den Ældre opregner ti byer, selv om han bemærker, at ikke alle forfattere angiver de samme: Damaskus, Filadelfia (Rabba, nutidens Amman), Rafana, Skythopolis (Bet-Sjan, som Josefus kalder den største), Gadara (Umm Qais, ca. 10 km sydøst for søen), Hippos, Dion, Pella, Gerasa (Jerash, mere end 50 km fra søen) og Kanata. Gerasa, med sin ovale plads og søjlebelagte gader, er nu en af Nærorientens bedst bevarede romerske byer. Da oprøret i 66 e.Kr. brød ud, angreb jødiske bander Gadara, Filadelfia og andre byer, og grækerne i Skythopolis dræbte jøderne i deres egen by."
  sr:
    - "Декаполис, „десет градова“, био је група грчких градова источно и југоисточно од Галилејског мора, већином с оне стране Јордана у данашњем Јордану и Сирији, а један, Скитопољ, западно од реке у Израелу. Био је област пре него једно место: тачка на карти за њу стоји око 23 км источно-југоисточно од средине језера, мало североисточно од Гадаре. Градови су дошли под Рим 63. п. н. е., када их је Помпеј ослободио хасмонејске власти."
    - "Велика мноштва следила су Исуса „из Галилеје, и из Десет Градова, и из Јерусалима, и Јудеје, и испреко Јордана“. Човек ослобођен легиона ђавола на далекој обали језера „поче приповедати у Десет градова шта му учини Исус“, а враћајући се из Тира и Сидона Исус „дође на море галилејско у крајеве десетоградске“. Рукописи земљу свиња именују различито, Гадаринци, Гергесинци или Герасинци: Верзија краља Јакова чита Гергесинце код Матеја, а Гадаринце код Марка и Луке."
    - "Плиније Старији наводи десет градова, мада напомиње да сви писци не дају исте: Дамаск, Филаделфију (Раву, данашњи Аман), Рафану, Скитопољ (Вет-Сан, који Јосиф Флавије назива највећим), Гадару (Ум Кеис, око 10 км југоисточно од језера), Хипос, Дион, Пелу, Герасу (Џераш, више од 50 км од језера) и Канату. Гераса, са овалним тргом и улицама са стубовима, данас је један од најбоље очуваних римских градова Блиског истока. Кад је избио устанак 66. н. е., јеврејске чете напале су Гадару, Филаделфију и друге градове, а Грци Скитопоља побили су Јевреје свог града."
  hu:
    - "A Dekapolisz, a „tíz város”, a Galileai-tengertől keletre és délkeletre fekvő görög városok csoportja volt, legtöbbjük a Jordánon túl a mai Jordániában és Szíriában, egy, Szkitopolisz, a folyótól nyugatra Izraelben. Inkább vidék volt, mint egyetlen hely: a térkép pontja a tó közepétől mintegy 23 km-re kelet-délkeletre áll, Gadarától kissé északkeletre. A városok Kr. e. 63-ban kerültek Róma alá, amikor Pompeius felszabadította őket a hasmóneus uralom alól."
    - "Nagy sokaság követte Jézust „Galileából és a Tízvárosból és Jeruzsálemből és Júdeából és a Jordánon túlról”. A tó túlsó partján a légiónyi ördögtől megszabadított ember „kezdé hirdetni a Tízvárosban, mely nagy dolgot cselekedett vele Jézus”, Tírusból és Szidónból visszatérve pedig Jézus „a galileai tengerhez méne, a Tízváros határain át”. A kéziratok másképp nevezik a disznók országát: gadarénusok, gergeszénusok vagy gerazénusok: a King James Version Mátéban gergeszénusokat, Márknál és Lukácsnál gadarénusokat olvas."
    - "Idősebb Plinius tíz várost sorol fel, bár megjegyzi, hogy nem minden író adja meg ugyanazokat: Damaszkusz, Filadelfia (Rabba, a mai Ammán), Raphana, Szkitopolisz (Bét-Seán, amelyet Josephus a legnagyobbnak nevez), Gadara (Umm Qais, a tótól mintegy 10 km-re délkeletre), Hippos, Dion, Pella, Gerasza (Jerash, a tótól több mint 50 km-re) és Kanatha. Gerasza ovális terével és oszlopsoros utcáival ma a Közel-Kelet egyik legjobban megőrzött római városa. Amikor Kr. u. 66-ban kitört a felkelés, zsidó bandák megtámadták Gadarát, Filadelfiát és más városokat, Szkitopolisz görögjei pedig megölték saját városuk zsidóit."
  fi:
    - "Dekapolis, ”kymmenen kaupunkia”, oli ryhmä kreikkalaisia kaupunkeja Galileanjärven itä- ja kaakkoispuolella, useimmat Jordanin takana nykyisessä Jordaniassa ja Syyriassa, yksi, Skytopolis, joen länsipuolella Israelissa. Se oli pikemmin alue kuin yksittäinen paikka: kartan piste sille on noin 23 km järven keskikohdasta itä-kaakkoon, hieman Gadarasta koilliseen. Kaupungit joutuivat Rooman alaisuuteen vuonna 63 eaa., jolloin Pompeius vapautti ne hasmonealaisten vallasta."
    - "Suuria kansanjoukkoja seurasi Jeesusta ”Galileasta ja Dekapolista ja Jerusalemista ja Juudeasta ja Jordanin tuolta puolen”. Järven toisella rannalla legioonan riivaajista vapautettu mies ”rupesi Dekapolin alueella julistamaan, kuinka suuria tekoja Jeesus oli hänelle tehnyt”, ja palatessaan Tyroksen ja Sidonin seuduilta Jeesus tuli ”Galilean järven ääreen Dekapolin alueen keskitse”. Käsikirjoitukset nimeävät sikojen maan eri tavoin, gadaralaisten, gergesalaisten tai gerasalaisten alueeksi: King James -käännös lukee Matteuksessa gergesalaiset ja Markuksessa ja Luukkaassa gadaralaiset."
    - "Plinius vanhempi luettelee kymmenen kaupunkia, vaikka huomauttaa, etteivät kaikki kirjoittajat anna samoja: Damaskos, Filadelfia (Rabba, nykyinen Amman), Raphana, Skytopolis (Bet-Sean, jota Josefus kutsuu suurimmaksi), Gadara (Umm Qais, noin 10 km järvestä kaakkoon), Hippos, Dion, Pella, Gerasa (Jerash, yli 50 km järvestä) ja Kanata. Gerasa soikeine aukioineen ja pylväskatuineen on nykyisin yksi Lähi-idän parhaiten säilyneistä roomalaiskaupungeista. Kun vuoden 66 jaa. kapina puhkesi, juutalaiset joukot hyökkäsivät Gadaraan, Filadelfiaan ja muihin kaupunkeihin, ja Skytopolisin kreikkalaiset tappoivat oman kaupunkinsa juutalaiset."
  vi:
    - "Đê-ca-bô-lơ, “mười thành”, là một nhóm thành Hy Lạp ở phía đông và đông nam Biển Ga-li-lê, phần lớn nằm bên kia sông Giô-đanh trong Jordan và Syria ngày nay, với một thành, Scythopolis, ở phía tây sông thuộc Israel. Đó là một vùng chứ không phải một nơi duy nhất: điểm của nó trên bản đồ nằm cách giữa hồ khoảng 23 km về phía đông đông nam, hơi lệch đông bắc Ga-đa-ra. Các thành thuộc về Rô-ma năm 63 TCN, khi Pompey giải phóng chúng khỏi sự cai trị của nhà Hasmon."
    - "Đoàn dân đông theo Giê-su “từ xứ Ga-li-lê, xứ Đê-ca-bô-lơ, thành Giê-ru-sa-lem, xứ Giu-đê, cho đến xứ bên kia sông Giô-đanh”. Người được giải thoát khỏi một đạo quỉ ở bờ bên kia hồ “đồn ra trong xứ Đê-ca-bô-lơ những điều lớn lao thể nào mà Đức Chúa Jêsus đã làm cho mình”, và khi từ Ty-rơ và Si-đôn trở về, Giê-su “trải địa phận Đê-ca-bô-lơ, đến biển Ga-li-lê”. Các bản chép tay gọi xứ của bầy heo bằng những tên khác nhau, Gadarenes, Gergesenes hay Gerasenes: bản King James đọc Gergesenes trong Ma-thi-ơ và Gadarenes trong Mác và Lu-ca."
    - "Pliny Trưởng liệt kê mười thành, dù ông ghi chú rằng không phải mọi tác giả đều nêu cùng những thành ấy: Đa-mách, Phi-la-đen-phi (Ráp-ba, nay là Amman), Raphana, Scythopolis (Bết-San, mà Josephus gọi là lớn nhất), Ga-đa-ra (Umm Qais, cách hồ khoảng 10 km về phía đông nam), Hippos, Dion, Pella, Giê-ra-sê (Jerash, cách hồ hơn 50 km) và Canatha. Giê-ra-sê, với quảng trường hình bầu dục và các đường phố có hàng cột, nay là một trong những thành La Mã được bảo tồn tốt nhất của Cận Đông. Khi cuộc nổi dậy năm 66 bùng nổ, các toán quân Do Thái tấn công Ga-đa-ra, Phi-la-đen-phi và các thành khác, và người Hy Lạp ở Scythopolis giết người Do Thái của chính thành mình."
  ro:
    - "Decapole, cele „zece cetăți”, era un grup de orașe grecești la est și sud-est de Marea Galileii, cele mai multe dincolo de Iordan, în Iordania și Siria de azi, cu una, Scitopolis, la vest de râu, în Israel. Era mai degrabă o regiune decât un loc unic: punctul ei de pe hartă se află la circa 23 km est-sud-est de mijlocul lacului, puțin la nord-est de Gadara. Cetățile au intrat sub Roma în 63 î.Hr., când Pompei le-a eliberat de stăpânirea hasmoneeană."
    - "Mulțimi mari l-au urmat pe Isus: „noroade multe din Galileea și din Decapole și din Ierusalim și din Iudeea și din ceea parte de Iordan”. Omul eliberat de o legiune de draci, pe țărmul îndepărtat al lacului, „a început a propoveduì în Decapoli câte au făcut Iisus lui”, iar la întoarcerea din Tir și Sidon, Isus „au venit la marea Galileei, în mijlocul hotarelor Decapolei”. Manuscrisele numesc diferit ținutul porcilor, gadarineni, gherghesineni sau gherasineni: King James Version are gherghesineni la Matei și gadarineni la Marcu și Luca."
    - "Pliniu cel Bătrân enumeră zece cetăți, deși notează că nu toți scriitorii le dau pe aceleași: Damasc, Filadelfia (Raba, azi Amman), Rafana, Scitopolis (Bet-Șan, pe care Iosif Flaviu o numește cea mai mare), Gadara (Umm Qais, la circa 10 km sud-est de lac), Hippos, Dion, Pella, Gherasa (Jerash, la peste 50 km de lac) și Canata. Gherasa, cu piața ei ovală și străzile cu colonade, este acum unul dintre cele mai bine păstrate orașe romane din Orientul Apropiat. Când a izbucnit răscoala din anul 66 d.Hr., bande iudaice au atacat Gadara, Filadelfia și alte orașe, iar grecii din Scitopolis i-au ucis pe iudeii din propriul lor oraș."
  bg:
    - "Декаполис, „десетте града“, беше група гръцки градове източно и югоизточно от Галилейско езеро, повечето от тях отвъд Йордан, в днешна Йордания и Сирия, а един, Скитопол, западно от реката, в Израел. Това е по-скоро област, отколкото едно място: точката на картата за нея стои на около 23 км изток-югоизточно от средата на езерото, малко североизточно от Гадара. Градовете попаднаха под властта на Рим през 63 г. пр.н.е., когато Помпей ги освободи от хасмонейското владичество."
    - "Големи множества вървяха след Исус „из Галилея и Декапол, из Иерусалим и Юдея, и из отвъд Иордан“. Човекът, освободен от легион бесове на отсрещния бряг на езерото, „начена да проповедва в Декапол това що му стори Исус“, а на връщане от Тир и Сидон Исус „дойде към морето Галилейско, между пределите Декаполски“. Ръкописите назовават жителите на страната на свинете различно — гадаринци, гергесинци или герасинци: King James Version чете гергесинци при Матей и гадаринци при Марко и Лука."
    - "Плиний Стари изброява десет града, макар да отбелязва, че не всички автори дават едни и същи: Дамаск, Филаделфия (Рава, днешен Аман), Рафана, Скитопол (Бет-Сан, който Йосиф Флавий нарича най-големия), Гадара (Ум Кайс, на около 10 км югоизточно от езерото), Хипос, Дион, Пела, Гераса (Джераш, на повече от 50 км от езерото) и Каната. Гераса с овалния си площад и улиците с колонади днес е един от най-добре запазените римски градове в Близкия изток. Когато избухна въстанието от 66 г. н.е., юдейски отряди нападнаха Гадара, Филаделфия и други градове, а гърците от Скитопол избиха юдеите в собствения си град."
