id: where-was-lystra
question:
  en: "Where was Lystra, the home of Timothy?"
  ru: "Где находилась Листра, родина Тимофея?"
  uk: "Де була Лістра, батьківщина Тимофія?"
  es: "¿Dónde estaba Listra, la patria de Timoteo?"
  pt: "Onde ficava Listra, a terra de Timóteo?"
  de: "Wo lag Lystra, die Heimat des Timotheus?"
  fr: "Où se trouvait Lystre, patrie de Timothée ?"
  pl: "Gdzie leżała Listra, dom Tymoteusza?"
  it: "Dov’era Listra, la patria di Timoteo?"
  cs: "Kde ležela Lystra, domov Timotea?"
  nl: "Waar lag Lystra, de woonplaats van Timoteüs?"
  sv: "Var låg Lystra, Timoteus’ hemort?"
answer:
  en:
    - "Lystra was a small Roman colony in Lycaonia, on the high plateau of central Turkey; its mound rises by the village of Hatunsaray, about 33 km south-south-west of Konya, ancient Iconium, in a straight line, and the map point stands on it. Derbe lay about 95 km to the east-south-east, Pisidian Antioch about 128 km to the north-west, and Jerusalem about 700 km away. Augustus settled veterans there as Colonia Iulia Felix Gemina Lustra, and a Latin inscription read on the mound by J. R. S. Sterrett in 1885 fixed the site."
    - "Paul came to Lystra on his first journey, when he was stoned there, and came back on his second: “Then came he to Derbe and Lystra: and, behold, a certain disciple was there, named Timotheus, the son of a certain woman, which was a Jewess, and believed; but his father was a Greek: which was well reported of by the brethren that were at Lystra and Iconium.” Paul later recalls the faith of Timothy's grandmother Lois and mother Eunice, and that “from a child thou hast known the holy scriptures”. Most take Lystra as Timothy's home town; some read Acts 20:4, “Gaius of Derbe, and Timotheus”, as making Derbe his home instead."
    - "Lystra was a mixed place: Roman colonists and Latin inscriptions above, and below them townspeople who still spoke “the speech of Lycaonia” and worshipped Zeus, whose priest had his temple before the city. On the way back through it on the first journey Paul and Barnabas were “confirming the souls of the disciples… that we must through much tribulation enter into the kingdom of God”, and ordained elders. The mound itself waited for systematic excavation until 2024, when Necmettin Erbakan University in Konya began work there; the stoning is told in the question “Where was Paul stoned?”."
  ru:
    - "Листра — небольшая римская колония в Ликаонии, на высоком плато в центре Турции; её холм поднимается у деревни Хатунсарай, примерно в 33 км к юго-юго-западу от Коньи, древней Иконии, по прямой, и точка карты стоит на нём. Дервия лежала примерно в 95 км к востоку-юго-востоку, Антиохия Писидийская — примерно в 128 км к северо-западу, а до Иерусалима около 700 км. Август поселил здесь ветеранов, назвав колонию Colonia Iulia Felix Gemina Lustra, и латинская надпись, прочитанная на холме Дж. Р. С. Стерреттом в 1885 г., установила место."
    - "Павел пришёл в Листру в первом путешествии, когда его здесь побили камнями, и вернулся во втором: «Дошел он до Дервии и Листры. И вот, там был некоторый ученик, именем Тимофей, которого мать была Иудеянка уверовавшая, а отец Еллин, и о котором свидетельствовали братия, находившиеся в Листре и Иконии». Позже Павел вспоминает веру бабки Тимофея Лоиды и матери Евники и то, что «ты из детства знаешь священные писания». Большинство считает Листру родным городом Тимофея; некоторые же по Деян. 20:4, где рядом названы Гаий Дервянин и Тимофей, относят его родину к Дервии."
    - "Листра была городом смешанным: наверху — римские колонисты и латинские надписи, внизу — горожане, ещё говорившие «по-ликаонски» и чтившие Зевса, жрец которого имел храм перед городом. Возвращаясь через неё в первом путешествии, Павел и Варнава утверждали «души учеников, увещевая пребывать в вере и поучая, что многими скорбями надлежит нам войти в Царствие Божие», и рукоположили пресвитеров. Систематически холм начали раскапывать лишь в 2024 г., когда работы повёл Университет Неджметтина Эрбакана в Конье; о побиении камнями рассказано в вопросе «Где Павла побили камнями?»."
  uk:
    - "Лістра була невеликою римською колонією в Лікаонії, на високому плато центральної Туреччини; її пагорб здіймається біля села Хатунсарай, приблизно за 33 км на південь-південний захід від Коні, давньої Іконії, по прямій, і точка на мапі стоїть на ньому. Дервія лежала приблизно за 95 км на схід-південний схід, Пісідійська Антіохія — приблизно за 128 км на північний захід, а Єрусалим — приблизно за 700 км. Август оселив тут ветеранів як Colonia Iulia Felix Gemina Lustra, а латинський напис, прочитаний на пагорбі Дж. Р. С. Стерреттом 1885 р., визначив місце."
    - "Павло прийшов до Лістри під час першої подорожі, коли його тут побили камінням, і повернувся під час другої: «Прийшов же у Дервию та в Листру; і ось був там один ученик, на ймя Тимотей, син однієї жінки, вірної Жидівки, батька ж Грека, що мав добру славу між братами у Листрі та Ікониї.» Павло пізніше згадує віру Тимофієвої бабусі Лоїди та матері Євники й те, що «з малку сьвяте писаннє знаєш». Більшість вважає Лістру рідним містом Тимофія; дехто, читаючи Дії 20:4, «Гай Дервянин, та Тимотей», вважає його рідним містом натомість Дервію."
    - "Лістра була змішаним місцем: нагорі римські колоністи й латинські написи, а під ними містяни, які ще говорили «по ликаонськи» й поклонялися Зевсові, чий жрець мав храм перед містом. На зворотному шляху через нього під час першої подорожі Павло й Варнава «укріпляючи душі учеників ... і що многими муками треба нам увійти в царство Боже» і висвятили старших. На систематичні розкопки пагорб чекав до 2024 р., коли там розпочав роботу Університет Неджметтіна Ербакана в Коні; побиття камінням розказано в питанні «Де побили камінням Павла?»."
  es:
    - "Listra era una pequeña colonia romana en Licaonia, en la alta meseta del centro de Turquía; su montículo se alza junto a la aldea de Hatunsaray, a unos 33 km al sudsudoeste de Konya, la antigua Iconio, en línea recta, y el punto del mapa está sobre él. Derbe quedaba a unos 95 km al estesureste, Antioquía de Pisidia a unos 128 km al noroeste y Jerusalén a unos 700 km. Augusto estableció allí a veteranos como Colonia Iulia Felix Gemina Lustra, y una inscripción latina leída en el montículo por J. R. S. Sterrett en 1885 fijó el lugar."
    - "Pablo llegó a Listra en su primer viaje, cuando fue apedreado allí, y volvió en el segundo: «Después llegó á Derbe, y á Listra: y he aquí, estaba allí un discípulo llamado Timoteo, hijo de una mujer Judía fiel, mas de padre Griego. De éste daban buen testimonio los hermanos que estaban en Listra y en Iconio». Más tarde Pablo recuerda la fe de la abuela de Timoteo, Loida, y de su madre, Eunice, y que «desde la niñez has sabido las Sagradas Escrituras». La mayoría toma Listra por la ciudad natal de Timoteo; algunos leen Hechos 20:4, «Gayo de Derbe, y Timoteo», como si hiciera de Derbe su patria."
    - "Listra era un lugar mixto: colonos romanos e inscripciones latinas arriba, y debajo de ellos habitantes que aún hablaban «lengua licaónica» y adoraban a Zeus, cuyo sacerdote tenía su templo delante de la ciudad. En el camino de vuelta por ella en el primer viaje, Pablo y Bernabé estuvieron «Confirmando los ánimos de los discípulos… y que es menester que por muchas tribulaciones entremos en el reino de Dios», y constituyeron ancianos. El propio montículo esperó a una excavación sistemática hasta 2024, cuando la Universidad Necmettin Erbakan, de Konya, comenzó allí los trabajos; la lapidación se cuenta en la pregunta «¿Dónde fue apedreado Pablo?»."
  pt:
    - "Listra era uma pequena colônia romana na Licaônia, no alto planalto do centro da Turquia; seu monte se ergue junto à aldeia de Hatunsaray, a cerca de 33 km a su-sudoeste de Konya, a antiga Icônio, em linha reta, e o ponto do mapa fica sobre ele. Derbe ficava a cerca de 95 km a lés-sudeste, Antioquia da Pisídia a cerca de 128 km a noroeste e Jerusalém a cerca de 700 km de distância. Augusto estabeleceu ali veteranos como Colonia Iulia Felix Gemina Lustra, e uma inscrição latina lida no monte por J. R. S. Sterrett em 1885 fixou o sítio."
    - "Paulo chegou a Listra em sua primeira viagem, quando ali foi apedrejado, e voltou na segunda: “Ele chegou a Derbe e a Listra; e eis que estava ali certo discípulo chamado Timóteo, filho de uma judia crente, mas seu pai era grego. Os irmãos que estavam em Listra e Icônio davam bom testemunho dele.” Paulo recorda mais tarde a fé de Loide, avó de Timóteo, e de Eunice, sua mãe, e que “Desde a infância, você conhece as sagradas Escrituras”. A maioria toma Listra como a cidade natal de Timóteo; alguns leem Atos 20:4, “Gaio de Derbe, Timóteo”, como fazendo de Derbe a sua terra."
    - "Listra era um lugar misto: colonos romanos e inscrições latinas no alto e, abaixo deles, habitantes que ainda falavam “em língua licaônica” e adoravam Zeus, cujo sacerdote tinha o seu templo diante da cidade. Na volta por ela, na primeira viagem, Paulo e Barnabé foram “fortalecendo o ânimo dos discípulos… é por meio de muitas aflições que devemos entrar no Reino de Deus”, e ordenaram presbíteros. O próprio monte esperou até 2024 por uma escavação sistemática, quando a Universidade Necmettin Erbakan, de Konya, ali iniciou os trabalhos; o apedrejamento é contado na pergunta “Onde Paulo foi apedrejado?”."
  de:
    - "Lystra war eine kleine römische Kolonie in Lykaonien auf dem Hochland der Zentraltürkei; sein Hügel erhebt sich beim Dorf Hatunsaray, in der Luftlinie etwa 33 km südsüdwestlich von Konya, dem antiken Ikonion, und der Kartenpunkt steht darauf. Derbe lag etwa 95 km ostsüdöstlich, Antiochia in Pisidien etwa 128 km nordwestlich und Jerusalem etwa 700 km entfernt. Augustus siedelte dort Veteranen an als Colonia Iulia Felix Gemina Lustra, und eine lateinische Inschrift, die J. R. S. Sterrett 1885 auf dem Hügel las, sicherte die Lage."
    - "Paulus kam auf seiner ersten Reise nach Lystra, wo er gesteinigt wurde, und kehrte auf seiner zweiten zurück: „Er kam aber gen Derbe und Lystra; und siehe, ein Jünger war daselbst mit Namen Timotheus, eines jüdischen Weibes Sohn, die war gläubig, aber eines griechischen Vaters. Der hatte ein gut Gerücht bei den Brüdern unter den Lystranern und zu Ikonion.“ Paulus erinnert später an den Glauben von Timotheus’ Großmutter Lois und Mutter Eunike und daran, dass „du von Kind auf die heilige Schrift weißt“. Die meisten halten Lystra für Timotheus’ Heimatstadt; manche lesen Apostelgeschichte 20,4, „Gajus von Derbe und Timotheus“, so, dass stattdessen Derbe seine Heimat war."
    - "Lystra war ein gemischter Ort: oben römische Kolonisten und lateinische Inschriften, darunter Städter, die noch „auf lykaonisch“ sprachen und Zeus anbeteten, dessen Priester seinen Tempel vor der Stadt hatte. Auf dem Rückweg durch die Stadt auf der ersten Reise heißt es von Paulus und Barnabas, sie „stärkten die Seelen der Jünger und ermahnten sie, … und daß wir durch viel Trübsale müssen in das Reich Gottes gehen“, und sie ordneten Älteste. Der Hügel selbst wartete bis 2024 auf systematische Grabungen, als die Necmettin-Erbakan-Universität in Konya dort die Arbeit aufnahm; die Steinigung wird in der Frage „Wo wurde Paulus gesteinigt?“ erzählt."
  fr:
    - "Lystre était une petite colonie romaine de Lycaonie, sur le haut plateau du centre de la Turquie ; son tertre s’élève près du village de Hatunsaray, à environ 33 km au sud-sud-ouest de Konya, l’ancienne Icone, à vol d’oiseau, et le point de la carte s’y trouve. Derbé était à environ 95 km à l’est-sud-est, Antioche de Pisidie à environ 128 km au nord-ouest, et Jérusalem à environ 700 km. Auguste y installa des vétérans sous le nom de Colonia Iulia Felix Gemina Lustra, et une inscription latine lue sur le tertre par J. R. S. Sterrett en 1885 a fixé le site."
    - "Paul vint à Lystre lors de son premier voyage, où il fut lapidé, et y revint lors du deuxième : « Il se rendit ensuite à Derbe et à Lystre. Et voici, il y avait là un disciple nommé Timothée, fils d’une femme juive fidèle et d’un père grec. Les frères de Lystre et d’Icone rendaient de lui un bon témoignage. » Paul rappelle plus tard la foi de l’aïeule de Timothée, Loïs, et de sa mère, Eunice, et que « dès ton enfance, tu connais les saintes lettres ». La plupart tiennent Lystre pour la ville natale de Timothée ; certains lisent Actes 20.4, « Gaïus de Derbe, Timothée », comme faisant plutôt de Derbé sa patrie."
    - "Lystre était un lieu mixte : en haut, des colons romains et des inscriptions latines ; en dessous, des habitants qui parlaient encore « en langue lycaonienne » et adoraient Zeus, dont le prêtre avait son temple à l’entrée de la ville. Au retour du premier voyage, Paul et Barnabas passèrent de nouveau par là, « fortifiant l’esprit des disciples, … c’est par beaucoup de tribulations qu’il nous faut entrer dans le royaume de Dieu », et firent nommer des anciens. Le tertre lui-même attendit des fouilles systématiques jusqu’en 2024, quand l’université Necmettin Erbakan de Konya y commença des travaux ; la lapidation est racontée dans la question « Où Paul fut-il lapidé ? »."
  pl:
    - "Listra była małą rzymską kolonią w Likaonii, na wysokiej wyżynie środkowej Turcji; jej wzgórze wznosi się przy wsi Hatunsaray, około 33 km na południe-południowy zachód od Konyi, starożytnego Ikonium, w linii prostej, i tam stoi punkt na mapie. Derbe leżało około 95 km na wschód-południowy wschód, Antiochia Pizydyjska około 128 km na północny zachód, a Jerozolima około 700 km dalej. August osiedlił tam weteranów jako Colonia Iulia Felix Gemina Lustra, a łaciński napis odczytany na wzgórzu przez J. R. S. Sterretta w 1885 roku ustalił miejsce."
    - "Paweł przybył do Listry w pierwszej podróży, gdy go tam ukamienowano, i wrócił w drugiej: „I przyszedł do Derby i do Listry; a oto tam był uczeń niektóry, imieniem Tymoteusz, syn niektórej niewiasty Żydówki wiernej a ojca Greka. Temu świadectwo dawali bracia, którzy byli w Listrze i w Ikonii”. Paweł wspomina później wiarę babki Tymoteusza Lois i matki Eunike oraz to, że „z dzieciństwa umiesz Pisma święte”. Większość uważa Listrę za rodzinne miasto Tymoteusza; niektórzy czytają Dz 20,4, „Gajus Derbejczyk, i Tymoteusz”, jako wskazanie na Derbe."
    - "Listra była miejscem mieszanym: u góry rzymscy koloniści i łacińskie napisy, a pod nimi mieszczanie, którzy wciąż mówili „po likaońsku” i czcili Zeusa, którego kapłan miał świątynię przed miastem. W drodze powrotnej przez nie w pierwszej podróży Paweł i Barnaba, „utwierdzając dusze uczniów… że przez wiele ucisków musimy wnijść do królestwa Bożego”, ustanowili starszych. Samo wzgórze czekało na systematyczne wykopaliska do 2024 roku, gdy rozpoczął tam prace Uniwersytet Necmettina Erbakana w Konyi; ukamienowanie opisuje pytanie „Gdzie ukamienowano Pawła?”."
  it:
    - "Listra era una piccola colonia romana in Licaonia, sull’alto altopiano della Turchia centrale; il suo tell si leva presso il villaggio di Hatunsaray, a circa 33 km a sud-sud-ovest di Konya, l’antica Icònio, in linea d’aria, e il punto della mappa si trova su di esso. Derbe si trovava a circa 95 km a est-sud-est, Antiochia di Pisidia a circa 128 km a nord-ovest, e Gerusalemme a circa 700 km di distanza. Augusto vi insediò dei veterani con il nome di Colonia Iulia Felix Gemina Lustra, e un’iscrizione latina letta sul tell da J. R. S. Sterrett nel 1885 fissò il sito."
    - "Paolo giunse a Listra nel suo primo viaggio, quando vi fu lapidato, e vi tornò nel secondo: «E venne anche a Derba e a Listra; ed ecco, quivi era un certo discepolo, di nome Timoteo, figliuolo di una donna giudea credente, ma di padre greco. Di lui rendevano buona testimonianza i fratelli che erano in Listra ed in Iconio». Paolo ricorda poi la fede della nonna di Timoteo, Loide, e della madre, Eunice, e che «fin da fanciullo hai avuto conoscenza degli Scritti sacri». I più ritengono Listra la città di Timoteo; alcuni leggono At 20,4, «Gaio di Derba e Timoteo», come se facesse invece di Derbe la sua città."
    - "Listra era un luogo misto: coloni romani e iscrizioni latine in alto, e sotto di loro gli abitanti che parlavano ancora «in lingua licaonica» e adoravano Zeus, il cui sacerdote aveva il tempio davanti alla città. Al ritorno attraverso di essa nel primo viaggio Paolo e Barnaba andavano «confermando gli animi dei discepoli, … dicendo loro che dobbiamo entrare nel regno di Dio attraverso molte tribolazioni», e fecero eleggere degli anziani. Il tell stesso attese fino al 2024 gli scavi sistematici, quando vi iniziò i lavori l’Università Necmettin Erbakan di Konya; la lapidazione è narrata nella domanda «Dove fu lapidato Paolo?»."
  cs:
    - "Lystra byla malá římská kolonie v Lykaonii, na vysoké náhorní rovině středního Turecka; její pahorek se zvedá u vsi Hatunsaray, vzdušnou čarou asi 33 km jihojihozápadně od Konye, starověkého Ikonia, a stojí na něm bod na mapě. Derbe leželo asi 95 km na východojihovýchod, Antiochie Pisidská asi 128 km na severozápad a Jeruzalém asi 700 km daleko. Augustus tam usadil veterány jako Colonia Iulia Felix Gemina Lustra a latinský nápis, který na pahorku přečetl J. R. S. Sterrett roku 1885, polohu určil."
    - "Pavel přišel do Lystry na první cestě, kdy tam byl ukamenován, a vrátil se na druhé: „Přišel pak do Derben a do Lystry, aj, učedlník jeden tu byl, jménem Timoteus, syn jedné ženy Židovky věřící, ale otce měl Řeka. Tomu svědectví dobré vydávali ti, jenž byli v Lystře a v Ikonii bratří.“ Pavel později připomíná víru Timoteovy babičky Lois a matky Eunike a to, že „hned od dětinství svatá Písma znáš“. Většina pokládá Lystru za Timoteovo rodné město; někteří čtou Sk 20,4, „Gáius Derbeus a Timoteus“, tak, že jeho domovem bylo místo toho Derbe."
    - "Lystra byla smíšené místo: nahoře římští kolonisté a latinské nápisy, pod nimi měšťané, kteří dosud mluvili „Lykaonitsky“ a uctívali Dia, jehož kněz měl chrám před městem. Když jí Pavel a Barnabáš na první cestě procházeli zpět, „potvrzujíce duší učedlníků… pravíce, že musíme skrze mnohá soužení vjíti do království Božího“, ustanovovali starší. Samotný pahorek čekal na systematický výzkum do roku 2024, kdy tam zahájila práce univerzita Necmettina Erbakana v Konyi; ukamenování je vyprávěno v otázce „Kde byl Pavel ukamenován?“."
  nl:
    - "Lystra was een kleine Romeinse kolonie in Lykaonië, op het hoogland van Midden-Turkije; de heuvel ervan rijst op bij het dorp Hatunsaray, hemelsbreed ongeveer 33 km ten zuidzuidwesten van Konya, het oude Ikonium, en het punt op de kaart staat erop. Derbe lag ongeveer 95 km naar het oostzuidoosten, Antiochië in Pisidië ongeveer 128 km naar het noordwesten, en Jeruzalem ongeveer 700 km verderop. Augustus vestigde er veteranen als Colonia Iulia Felix Gemina Lustra, en een Latijns opschrift dat J. R. S. Sterrett in 1885 op de heuvel las, legde de plaats vast."
    - "Paulus kwam op zijn eerste reis naar Lystra, waar hij werd gestenigd, en keerde op zijn tweede reis terug: “Hij kwam te Derbe en Lystre. En ziet, aldaar was een zeker discipel, met name Timotheus, zoon van een gelovige Joodse vrouw, maar van een Grieksen vader; welken goeden getuigenis gegeven werd van de broederen te Lystre en Ikonium.” Paulus herinnert er later aan dat Timoteüs' grootmoeder Lois en moeder Eunice geloofden, en dat hij “van kinds af de heilige Schriften geweten hebt”. De meesten houden Lystra voor de woonplaats van Timoteüs; sommigen lezen Hand. 20:4, “Gajus van Derbe, en Timotheus”, zo dat Derbe in plaats daarvan zijn woonplaats was."
    - "Lystra was een gemengde plaats: Romeinse kolonisten en Latijnse opschriften boven, en daaronder stedelingen die nog “in het Lycaonisch” spraken en Zeus vereerden, wiens priester zijn tempel voor de stad had. Op de terugweg door de stad op de eerste reis gingen Paulus en Barnabas verder, “versterkende de zielen der discipelen… dat wij door vele verdrukkingen moeten ingaan in het Koninkrijk Gods”, en stelden zij ouderlingen aan. De heuvel zelf wachtte tot 2024 op systematische opgraving, toen de Necmettin Erbakan-universiteit in Konya er met het werk begon; de steniging wordt verteld in de vraag “Waar werd Paulus gestenigd?”."
  sv:
    - "Lystra var en liten romersk koloni i Lykaonien, på Turkiets centrala högplatå; dess kulle reser sig vid byn Hatunsaray, omkring 33 km sydsydväst om Konya, forntidens Ikonion, i fågelvägen, och kartpunkten står på den. Derbe låg omkring 95 km åt ost-sydost, Antiochia i Pisidien omkring 128 km åt nordväst och Jerusalem omkring 700 km bort. Augustus bosatte veteraner där som Colonia Iulia Felix Gemina Lustra, och en latinsk inskrift som J. R. S. Sterrett läste på kullen 1885 fastställde platsen."
    - "Paulus kom till Lystra på sin första resa, då han blev stenad där, och kom tillbaka på sin andra: ”Han kom då också till Derbe och till Lystra. Där fanns en lärjunge vid namn Timoteus, som var son av en troende judisk kvinna och en grekisk fader, och som hade gott vittnesbörd om sig av bröderna i Lystra och Ikonium.” Paulus erinrar sig senare tron hos Timoteus’ mormor Lois och mor Eunike, och att ”du känner från barndomen de heliga skrifter”. De flesta tar Lystra som Timoteus’ hemstad; vissa läser Apg 20:4, ”Gajus från Derbe och Timoteus”, som att Derbe i stället var hans hemort."
    - "Lystra var en blandad plats: romerska kolonister och latinska inskriptioner överst, och under dem stadsbor som fortfarande talade ”lykaoniskt tungomål” och dyrkade Zeus, vars präst hade sitt tempel utanför staden. På vägen tillbaka genom den på den första resan ”styrkte” Paulus och Barnabas ”lärjungarnas själar, i det de förmanade dem … att det är genom mycken bedrövelse som vi måste ingå i Guds rike”, och de utsåg äldste. Själva kullen väntade på systematiska utgrävningar till 2024, då Necmettin Erbakan-universitetet i Konya påbörjade arbete där; stenandet berättas i frågan ”Var blev Paulus stenad?”."
