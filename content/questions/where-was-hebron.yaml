id: where-was-hebron
question:
  en: "Where was Hebron?"
  ru: "Где находился Хеврон?"
  uk: "Де був Хеврон?"
  es: "¿Dónde estaba Hebrón?"
  pt: "Onde ficava Hebrom?"
  de: "Wo lag Hebron?"
  fr: "Où se trouvait Hébron ?"
  pl: "Gdzie leżał Hebron?"
  it: "Dov’era Ebron?"
  cs: "Kde ležel Hebron?"
  nl: "Waar lag Hebron?"
answer:
  en:
    - "Hebron lies high in the hills of Judah, about 30 km south of Jerusalem in a straight line and 40 km north-east of Beersheba, in today's West Bank. The ancient town stood on the hill of Tel Rumeida; the cave of Machpelah lies under the great stone enclosure in the modern city, and Mamre, where Abraham camped, is usually placed a few kilometres to the north at Ramat el-Khalil."
    - 'In Genesis Abraham buys the cave from Ephron the Hittite: "Abraham buried Sarah his wife in the cave of the field of Machpelah before Mamre: the same is Hebron in the land of Canaan"; Isaac and Jacob were buried there too. After the conquest Hebron was given to Caleb. David was anointed king at Hebron: "In Hebron he reigned over Judah seven years and six months: and in Jerusalem he reigned thirty and three years over all Israel and Judah." Absalom began his revolt from the city.'
    - "Hebron was fortified in the Early Bronze Age and rebuilt with massive walls in the Middle Bronze Age. Royal jar handles of the late eighth century BC bear its name, a sign of a centre of the kingdom's administration. After the fall of Judah in 587 or 586 BC the south of the hills passed to Edomite settlers, the later Idumea; Judas Maccabeus took and burned the town, and John Hyrcanus brought it under Hasmonean rule. The enclosure over Machpelah is usually attributed to Herod the Great. Constantine ordered a basilica built at Mamre, and in the fifth century Sozomen still describes a yearly fair there that drew Christians, Jews and pagans alike."
  ru:
    - "Хеврон лежит высоко в горах Иудеи, примерно в 30 км к югу от Иерусалима по прямой и в 40 км к северо-востоку от Вирсавии, на нынешнем Западном берегу. Древний город стоял на холме Тель-Румейда; пещера Махпела находится под большой каменной оградой в современном городе, а Мамре, где стоял шатёр Авраама, обычно помещают в нескольких километрах к северу, в Рамат-эль-Халиле."
    - "В Книге Бытия Авраам покупает пещеру у Ефрона Хеттеянина: «Авраам похоронил Сарру, жену свою, в пещере поля в Махпеле, против Мамре, что ныне Хеврон, в земле Ханаанской»; там же погребены Исаак и Иаков. После завоевания Хеврон достался Халеву. В Хевроне Давид был помазан на царство: «В Хевроне царствовал над Иудою семь лет и шесть месяцев, и в Иерусалиме царствовал тридцать три года над всем Израилем и Иудою». Отсюда начал свой мятеж Авессалом."
    - "Хеврон был укреплён в раннем бронзовом веке и заново обнесён мощными стенами в среднем. На ручках кувшинов с царским клеймом конца VIII века до н. э. стоит его имя — знак центра царского управления. После падения Иудеи в 587 или 586 г. до н. э. юг нагорья заселили едомитяне, и край стал Идумеей; Иуда Маккавей взял и сжёг город, а Иоанн Гиркан подчинил его Хасмонеям. Ограду над Махпелой обычно приписывают Ироду Великому. Константин велел построить в Мамре базилику, а в V веке Созомен ещё описывает там ежегодную ярмарку, куда сходились христиане, иудеи и язычники."
  uk:
    - "Хеврон лежить високо в пагорбах Юдеї, приблизно за 30 км на південь від Єрусалима по прямій і за 40 км на північний схід від Беер-Шеви, нині на Західному березі Йордану. Давнє місто стояло на пагорбі Тель-Румейда; печера Махпела лежить під великою кам'яною огорожею в сучасному місті, а Мамре, де отаборився Авраам, зазвичай розміщують за кілька кілометрів на північ, у Рамат-ель-Халілі."
    - "У Книзі Буття Авраам купує печеру в Ефрона Хеттеянина: «поховав Авраам Сарру, жінку свою, в печері Махпелевого поля, навпроти Мамрійщини. Се Геброн у Канаан землї»; там поховали й Ісаака та Якова. Після завоювання Хеврон віддали Калебові. У Хевроні Давида було помазано на царя: «У Гебронї царював над Юдою сїм год і шість місяцїв, а в Ерусалимі царював трийцять і три годи над усїм Ізраїлем і Юдою». З цього міста Авесалом почав своє повстання."
    - "Хеврон було укріплено в ранньому бронзовому віці й відбудовано з масивними мурами в середньому бронзовому віці. Царські ручки глеків кінця VIII ст. до н. е. мають його назву — ознаку центру адміністрації царства. Після падіння Юдеї 587 або 586 р. до н. е. південь пагорбів перейшов до едомських поселенців — пізнішої Ідумеї; Юда Макавей узяв і спалив місто, а Іван Гіркан підпорядкував його владі Хасмонеїв. Огорожу над Махпелою зазвичай приписують Іродові Великому. Костянтин наказав збудувати базиліку в Мамре, а в V ст. Созомен ще описує щорічний ярмарок там, що збирав християн, юдеїв і язичників."
  es:
    - "Hebrón se alza en lo alto de las colinas de Judá, a unos 30 km al sur de Jerusalén en línea recta y a 40 km al noreste de Beerseba, en la actual Cisjordania. La ciudad antigua estaba en la colina de Tel Rumeida; la cueva de Macpela yace bajo el gran recinto de piedra de la ciudad moderna, y Mamre, donde acampó Abraham, se sitúa por lo común unos kilómetros al norte, en Ramat el-Khalil."
    - "En el Génesis, Abraham compra la cueva a Efrón el hitita: «sepultó Abraham á Sara su mujer en la cueva de la heredad de Macpela enfrente de Mamre, que es Hebrón en la tierra de Canaán»; también Isaac y Jacob fueron sepultados allí. Tras la conquista, Hebrón fue dada a Caleb. David fue ungido rey en Hebrón: «En Hebrón reinó sobre Judá siete años y seis meses: y en Jerusalem reinó treinta y tres años sobre todo Israel y Judá». Absalón inició su rebelión desde la ciudad."
    - "Hebrón fue fortificada en el Bronce Antiguo y reconstruida con macizas murallas en el Bronce Medio. Asas de jarra reales de finales del siglo VIII a. C. llevan su nombre, señal de un centro de la administración del reino. Tras la caída de Judá en 587 o 586 a. C., el sur de las colinas pasó a colonos edomitas, la futura Idumea; Judas Macabeo tomó e incendió la ciudad, y Juan Hircano la sometió al dominio asmoneo. El recinto sobre Macpela se atribuye por lo común a Herodes el Grande. Constantino ordenó construir una basílica en Mamre, y en el siglo V Sozomeno aún describe allí una feria anual que atraía por igual a cristianos, judíos y paganos."
  pt:
    - "Hebrom fica no alto das colinas de Judá, a cerca de 30 km ao sul de Jerusalém em linha reta e 40 km a nordeste de Berseba, na atual Cisjordânia. A antiga cidade ficava na colina de Tel Rumeida; a caverna de Macpela está sob o grande recinto de pedra da cidade moderna, e Manre, onde Abraão acampou, costuma ser situada a alguns quilômetros ao norte, em Ramat el-Khalil."
    - "No Gênesis, Abraão compra a caverna de Efrom, o heteu: “Abraão sepultou Sara, sua mulher, na caverna do campo de Macpela, em frente a Manre (isto é, Hebrom), na terra de Canaã”; Isaque e Jacó também foram sepultados ali. Depois da conquista, Hebrom foi dada a Calebe. Davi foi ungido rei em Hebrom: “Em Hebrom, ele reinou sobre Judá sete anos e seis meses, e em Jerusalém ele reinou trinta e três anos sobre todo o Israel e Judá.” Absalão iniciou a sua revolta a partir da cidade."
    - "Hebrom foi fortificada na Idade do Bronze Antiga e reconstruída com muralhas maciças na Idade do Bronze Média. Alças de jarros reais do final do século VIII a.C. trazem o seu nome, sinal de um centro da administração do reino. Depois da queda de Judá, em 587 ou 586 a.C., o sul das colinas passou a colonos edomitas, a futura Iduméia; Judas Macabeu tomou e queimou a cidade, e João Hircano a trouxe para o domínio asmoneu. O recinto sobre Macpela costuma ser atribuído a Herodes, o Grande. Constantino mandou construir uma basílica em Manre, e no século V Sozômeno ainda descreve ali uma feira anual que atraía cristãos, judeus e pagãos."
  de:
    - "Hebron liegt hoch im Bergland von Juda, in der Luftlinie etwa 30 km südlich von Jerusalem und 40 km nordöstlich von Beerscheba, im heutigen Westjordanland. Die antike Stadt stand auf dem Hügel Tel Rumeida; die Höhle Machpela liegt unter der großen Steinumfassung in der heutigen Stadt, und Mamre, wo Abraham lagerte, wird meist einige Kilometer nördlich bei Ramat al-Chalil angesetzt."
    - "In der Genesis kauft Abraham die Höhle von Efron, dem Hethiter: „Darnach begrub Abraham Sara, sein Weib, in der Höhle des Ackers, die zwiefach ist, Mamre gegenüber, das ist Hebron, im Lande Kanaan“; auch Isaak und Jakob wurden dort begraben. Nach der Eroberung wurde Hebron Kaleb gegeben. David wurde in Hebron zum König gesalbt: „Zu Hebron regierte er sieben Jahre und sechs Monate über Juda; aber zu Jerusalem regierte er dreiunddreißig Jahre über ganz Israel und Juda.“ Absalom begann seinen Aufstand von dieser Stadt aus."
    - "Hebron war in der Frühbronzezeit befestigt und wurde in der Mittelbronzezeit mit massiven Mauern neu gebaut. Königliche Krughenkel aus dem späten 8. Jahrhundert v. Chr. tragen seinen Namen, ein Zeichen für ein Verwaltungszentrum des Königreichs. Nach dem Fall Judas 587 oder 586 v. Chr. ging der Süden des Berglands an edomitische Siedler über, das spätere Idumäa; Judas Makkabäus nahm die Stadt ein und verbrannte sie, und Johannes Hyrkanos brachte sie unter hasmonäische Herrschaft. Die Umfassung über Machpela wird meist Herodes dem Großen zugeschrieben. Konstantin ließ in Mamre eine Basilika bauen, und im 5. Jahrhundert beschreibt Sozomenos dort noch einen jährlichen Markt, der Christen, Juden und Heiden gleichermaßen anzog."
  fr:
    - "Hébron se trouve haut dans les collines de Juda, à environ 30 km au sud de Jérusalem à vol d’oiseau et à 40 km au nord-est de Beer-Schéba, dans l’actuelle Cisjordanie. L’ancienne ville s’élevait sur la colline de Tel Rumeida ; la caverne de Macpéla se trouve sous la grande enceinte de pierre de la ville moderne, et Mamré, où Abraham dressa ses tentes, est généralement placé à quelques kilomètres au nord, à Ramat el-Khalil."
    - "Dans la Genèse, Abraham achète la caverne à Éphron le Héthien : « Abraham enterra Sara, sa femme, dans la caverne du champ de Macpéla, vis-à-vis de Mamré, qui est Hébron, dans le pays de Canaan » ; Isaac et Jacob y furent enterrés aussi. Après la conquête, Hébron fut donnée à Caleb. David fut oint roi à Hébron : « À Hébron il régna sur Juda sept ans et six mois, et à Jérusalem il régna trente-trois ans sur tout Israël et Juda. » Absalom commença sa révolte depuis la ville."
    - "Hébron fut fortifiée au Bronze ancien et rebâtie avec de massifs remparts au Bronze moyen. Des anses de jarres royales de la fin du VIIIe siècle av. J.-C. portent son nom, signe d’un centre de l’administration du royaume. Après la chute de Juda en 587 ou 586 av. J.-C., le sud des collines passa à des colons édomites, l’Idumée ultérieure ; Judas Maccabée prit et incendia la ville, et Jean Hyrcan la plaça sous la domination hasmonéenne. L’enceinte qui surmonte Macpéla est généralement attribuée à Hérode le Grand. Constantin ordonna de bâtir une basilique à Mamré, et au Ve siècle Sozomène y décrit encore une foire annuelle qui attirait chrétiens, Juifs et païens."
  pl:
    - "Hebron leży wysoko we wzgórzach Judy, około 30 km na południe od Jerozolimy w linii prostej i 40 km na północny wschód od Beer-Szeby, na dzisiejszym Zachodnim Brzegu. Starożytne miasto stało na wzgórzu Tel Rumeida; jaskinia Makpela leży pod wielkim kamiennym ogrodzeniem we współczesnym mieście, a Mamre, gdzie obozował Abraham, umieszcza się zwykle kilka kilometrów na północ, w Ramat el-Khalil."
    - "W Księdze Rodzaju Abraham kupuje jaskinię od Efrona Hetyty: „A tak pogrzebał Abraham Sarę, żonę swoję, w jaskini pola w Machpelu przeciwko Mamre, to jest Hebron, w ziemi Chananejskiej”; pochowano tam również Izaaka i Jakuba. Po podboju Hebron dano Kalebowi. Dawid został namaszczony na króla w Hebronie: „W Hebronie królował nad Judą przez siedm lat i przez sześć miesięcy, a w Jeruzalemie królował przez trzydzieści i trzy lata nad wszystkim Izraelem i nad Judą”. Absalom rozpoczął z miasta swój bunt."
    - "Hebron ufortyfikowano we wczesnym brązie i odbudowano z masywnymi murami w średnim brązie. Królewskie uchwyty dzbanów z końca VIII wieku p.n.e. noszą jego nazwę, co świadczy o ośrodku administracji królestwa. Po upadku Judy w 587 lub 586 p.n.e. południe wzgórz przeszło w ręce edomickich osadników, późniejsza Idumea; Juda Machabeusz zdobył i spalił miasto, a Jan Hirkan włączył je pod panowanie hasmonejskie. Ogrodzenie nad Makpelą przypisuje się zwykle Herodowi Wielkiemu. Konstantyn kazał zbudować bazylikę w Mamre, a w V wieku Sozomen opisuje jeszcze coroczny jarmark, który przyciągał chrześcijan, Żydów i pogan."
  it:
    - "Ebron sorge in alto sulle colline di Giuda, a circa 30 km a sud di Gerusalemme in linea d’aria e a 40 km a nord-est di Bersabea, nell’odierna Cisgiordania. L’antica città sorgeva sulla collina di Tel Rumeida; la grotta di Macpela si trova sotto il grande recinto di pietra nella città moderna, e Mamre, dove Abramo pose il campo, si colloca di solito qualche chilometro a nord, a Ramat el-Khalil."
    - "Nella Genesi Abramo compra la grotta da Efron l’Ittita: «Abrahamo seppellì Sara sua moglie nella spelonca del campo di Macpela dirimpetto a Mamre, che è Hebron, nel paese di Canaan»; anche Isacco e Giacobbe vi furono sepolti. Dopo la conquista Ebron fu data a Caleb. Davide fu unto re a Ebron: «A Hebron regnò su Giuda sette anni e sei mesi; e a Gerusalemme regnò trentatre anni su tutto Israele e Giuda». Assalonne diede inizio alla sua rivolta dalla città."
    - "Ebron fu fortificata nell’Antico Bronzo e ricostruita con mura massicce nel Medio Bronzo. Manici di giara regi della fine dell’VIII secolo a.C. portano il suo nome, segno di un centro dell’amministrazione del regno. Dopo la caduta di Giuda nel 587 o 586 a.C. il sud delle colline passò a coloni edomiti, la successiva Idumea; Giuda Maccabeo prese e bruciò la città, e Giovanni Ircano la portò sotto il dominio asmoneo. Il recinto sopra Macpela è di solito attribuito a Erode il Grande. Costantino ordinò di costruire una basilica a Mamre, e nel V secolo Sozomeno descrive ancora una fiera annuale che vi attirava cristiani, ebrei e pagani insieme."
  cs:
    - "Hebron leží vysoko v judských horách, vzdušnou čarou asi 30 km jižně od Jeruzaléma a 40 km severovýchodně od Beer-šeby, na dnešním Západním břehu. Starověké město stálo na pahorku Tel Rumejda; jeskyně Makpela leží pod velkým kamenným ohrazením v moderním městě a Mamre, kde Abraham tábořil, se obvykle klade o několik kilometrů severněji do Ramat el-Chalílu."
    - "V Genesi Abraham kupuje jeskyni od Efróna Hetejského: „pochoval Abraham Sáru, manželku svou, v jeskyni pole Machpelah, proti Mamre, (to slove Hebron), v zemi Kananejské“; Izák a Jákob tam byli pohřbeni také. Po dobytí byl Hebron dán Kálebovi. David byl v Hebronu pomazán králem: „V Hebronu kraloval nad Judou sedm let a šest měsíců, a v Jeruzalémě kraloval třidceti a tři léta nade vším Izraelem a Judou.“ Abšalom zahájil své povstání z města."
    - "Hebron byl opevněn v rané době bronzové a znovu vystavěn s mohutnými hradbami ve střední době bronzové. Královská ucha džbánů z konce 8. století př. n. l. nesou jeho jméno, což svědčí o středisku správy království. Po pádu Judy roku 587 nebo 586 př. n. l. připadl jih hor edomským osadníkům, pozdější Idumeji; Juda Makabejský město dobyl a vypálil a Jan Hyrkán jej podřídil hasmoneovské vládě. Ohrazení nad Makpelou se obvykle připisuje Herodovi Velikému. Konstantin nařídil vystavět baziliku v Mamre a v 5. století Sozomenos stále popisuje každoroční trh, který tam přitahoval křesťany, Židy i pohany."
  nl:
    - "Hebron ligt hoog in het bergland van Juda, hemelsbreed ongeveer 30 km ten zuiden van Jeruzalem en 40 km ten noordoosten van Berseba, in de huidige Westelijke Jordaanoever. De oude stad lag op de heuvel Tel Rumeida; de grot van Machpela ligt onder de grote stenen omheining in de moderne stad, en Mamre, waar Abraham zijn tenten opsloeg, wordt gewoonlijk enkele kilometers naar het noorden geplaatst, bij Ramat el-Khalil."
    - "In Genesis koopt Abraham de grot van Efron de Hethiet: “begroef Abraham zijn huisvrouw Sara in de spelonk des akkers van Machpela, tegenover Mamre, hetwelk is Hebron, in het land Kanaan”; ook Isaak en Jakob werden daar begraven. Na de verovering werd Hebron aan Kaleb gegeven. David werd in Hebron tot koning gezalfd: “Te Hebron regeerde hij over Juda zeven jaren en zes maanden; en te Jeruzalem regeerde hij drie en dertig jaren over gans Israël en Juda.” Absalom begon zijn opstand vanuit de stad."
    - "Hebron werd in de Vroege Bronstijd versterkt en in de Midden-Bronstijd herbouwd met massieve muren. Koninklijke kruikhandvatten uit de late achtste eeuw v.Chr. dragen de naam van de stad, een teken van een bestuurscentrum van het koninkrijk. Na de val van Juda in 587 of 586 v.Chr. ging het zuiden van het bergland over naar Edomitische kolonisten, het latere Idumea; Judas Makkabeüs nam de stad in en verbrandde haar, en Johannes Hyrcanus bracht haar onder Hasmonese heerschappij. De omheining boven Machpela wordt gewoonlijk toegeschreven aan Herodes de Grote. Constantijn liet bij Mamre een basiliek bouwen, en in de vijfde eeuw beschrijft Sozomenos er nog een jaarlijkse markt die christenen, joden en heidenen evenzeer aantrok."
