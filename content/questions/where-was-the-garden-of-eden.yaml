id: where-was-the-garden-of-eden
question:
  en: "Where was the Garden of Eden?"
  ru: "Где находился Едемский сад?"
  uk: "Де був Едемський сад?"
  es: "¿Dónde estaba el jardín del Edén?"
  pt: "Onde ficava o jardim do Éden?"
  de: "Wo lag der Garten Eden?"
  fr: "Où se trouvait le jardin d’Éden ?"
answer:
  en:
    - "Nobody knows, and the map does not place it. Genesis gives only one clue: a river flowed out of Eden and divided into four, the Pishon, the Gihon, the Hiddekel, which is the Tigris, and the Euphrates. Two of the four are real rivers of Mesopotamia; the other two have never been identified with certainty, so every proposal rests on how they are read."
    - "Genesis says: “And the LORD God planted a garden eastward in Eden”, and: “And a river went out of Eden to water the garden; and from thence it was parted, and became into four heads.” The Pishon “compasseth the whole land of Havilah, where there is gold”, and the Gihon “compasseth the whole land of Ethiopia”, in Hebrew Cush. Josephus took the Pishon for the Ganges and the Gihon for the Nile, and so did many after him; others have looked for Havilah and Cush in Arabia or in Babylonia, which gives very different maps."
    - "Two regions are most often proposed. One is the head of the Persian Gulf, where the Tigris and Euphrates meet: here E. A. Speiser read the four heads as rivers converging on one, and later writers took the Pishon for a dried-up river bed running from the Hijaz across Arabia to Kuwait and the Gihon for the Karun from Iran. The other is the highlands of Armenia in eastern Turkey, where the Tigris and Euphrates rise, reading the four heads as sources. Many scholars hold that the story describes a sacred geography that was never meant to be surveyed, and the map lists the Pishon and Gihon among its disputed places."
  ru:
    - "Этого никто не знает, и карта его не показывает. Книга Бытия даёт лишь одну подсказку: из Едема выходила река и разделялась на четыре — Фисон, Гихон, Хиддекель, то есть Тигр, и Евфрат. Две из четырёх — настоящие реки Месопотамии, а две другие так и не отождествлены достоверно, поэтому всякое предположение зависит от того, как их прочесть."
    - "Бытие говорит: «И насадил Господь Бог рай в Едеме на востоке», и далее: «Из Едема выходила река для орошения рая; и потом разделялась на четыре реки». Фисон «обтекает всю землю Хавила, ту, где золото», а Гихон «обтекает всю землю Куш». Иосиф Флавий принимал Фисон за Ганг, а Гихон за Нил, и многие после него тоже; другие искали Хавилу и Куш в Аравии или в Вавилонии, а это даёт совсем разные карты."
    - "Чаще всего предлагают две области. Первая — устье Тигра и Евфрата у Персидского залива: здесь Э. Спайзер прочёл четыре «начала» как реки, сходящиеся в одну, а позднейшие авторы приняли за Фисон высохшее русло, идущее из Хиджаза через Аравию к Кувейту, а за Гихон — Карун из Ирана. Вторая — Армянское нагорье на востоке Турции, где Тигр и Евфрат берут начало, если читать четыре «начала» как истоки. Многие учёные считают, что рассказ описывает священную географию, которую не предполагалось наносить на карту; Фисон и Гихон карта относит к спорным местам."
  uk:
    - "Ніхто не знає, і мапа його не позначає. Книга Буття дає лише одну підказку: ріка виходила з Едему й розділялася на чотири — Фісон, Гіхон, Хіддекель, тобто Тигр, і Євфрат. Дві з чотирьох — справжні річки Месопотамії; дві інші ніколи не були ототожнені напевно, тож кожна пропозиція залежить від того, як їх читати."
    - "Книга Буття каже: «насадив Бог сад у Едемі на востоцї» і «І ріка виходить із Едему на поливаннє саду, а потім розлучається чотирма течіями». Фісон «обтекає всю Гавила землю, де знаходять золото», а Гіхон «обтекає всю Куш землю» — Ефіопії, івритом Куш. Йосиф Флавій вважав Фісон Гангом, а Гіхон Нілом, і так само багато хто після нього; інші шукали Хавілу й Куш в Аравії чи у Вавилонії, що дає дуже різні мапи."
    - "Найчастіше пропонують два краї. Один — верхів'я Перської затоки, де зустрічаються Тигр і Євфрат: тут Е. А. Шпайзер читав чотири «голови» як ріки, що сходяться в одну, а пізніші автори вважали Фісон висохлим річищем, що йшло з Хіджазу через Аравію до Кувейту, а Гіхон — Карун з Ірану. Другий — Вірменське нагір'я на сході Туреччини, де беруть початок Тигр і Євфрат; тут чотири «голови» розуміють як джерела. Багато вчених вважають, що оповідь описує сакральну географію, яку ніколи не мали на меті обстежувати, а мапа перелічує Фісон і Гіхон серед своїх спірних місць."
  es:
    - "Nadie lo sabe, y el mapa no lo sitúa. El Génesis da una sola pista: un río salía del Edén y se dividía en cuatro, el Pisón, el Gihón, el Hiddekel, que es el Tigris, y el Éufrates. Dos de los cuatro son ríos reales de Mesopotamia; los otros dos nunca se han identificado con certeza, de modo que toda propuesta depende de cómo se los lea."
    - "El Génesis dice: «Y había Jehová Dios plantado un huerto en Edén al oriente», y: «Y salía de Edén un río para regar el huerto, y de allí se repartía en cuatro ramales». El Pisón «cerca toda la tierra de Havilah, donde hay oro», y el Gihón «rodea toda la tierra de Etiopía», en hebreo Cus. Josefo tomó el Pisón por el Ganges y el Gihón por el Nilo, y así lo hicieron muchos después de él; otros han buscado Havila y Cus en Arabia o en Babilonia, lo que da mapas muy distintos."
    - "Dos regiones se proponen con más frecuencia. Una es la cabecera del golfo Pérsico, donde se encuentran el Tigris y el Éufrates: aquí E. A. Speiser leyó los cuatro ramales como ríos que convergen en uno, y autores posteriores tomaron el Pisón por un cauce seco que iría del Hiyaz a través de Arabia hasta Kuwait y el Gihón por el Karún, de Irán. La otra son las tierras altas de Armenia, en el este de Turquía, donde nacen el Tigris y el Éufrates, leyendo los cuatro ramales como fuentes. Muchos estudiosos sostienen que el relato describe una geografía sagrada que nunca estuvo destinada a ser levantada en un plano, y el mapa enumera el Pisón y el Gihón entre sus lugares discutidos."
  pt:
    - "Ninguém sabe, e o mapa não o situa. O Gênesis dá apenas uma pista: um rio saía do Éden e se dividia em quatro, o Pisom, o Giom, o Hídequel, que é o Tigre, e o Eufrates. Dois dos quatro são rios reais da Mesopotâmia; os outros dois nunca foram identificados com certeza, de modo que toda proposta depende de como são lidos."
    - "O Gênesis diz: “O SENHOR Deus plantou um jardim no oriente, no Éden”, e: “Um rio saía do Éden para regar o jardim; e dali se dividia, e se tornava a nascente de quatro rios.” O Pisom “flui por toda a terra de Havilá, onde há ouro”, e o Giom “é o mesmo rio que flui por toda a terra de Cuxe”, que outras traduções chamam Etiópia. Josefo tomou o Pisom pelo Ganges e o Giom pelo Nilo, e muitos depois dele fizeram o mesmo; outros procuraram Havilá e Cuxe na Arábia ou na Babilônia, o que dá mapas muito diferentes."
    - "Duas regiões são mais frequentemente propostas. Uma é a cabeceira do golfo Pérsico, onde o Tigre e o Eufrates se encontram: aqui E. A. Speiser leu as quatro cabeças como rios que convergem em um só, e autores posteriores tomaram o Pisom por um leito de rio seco que ia do Hejaz, através da Arábia, até o Kuaite, e o Giom pelo Karun, do Irã. A outra são as terras altas da Armênia, no leste da Turquia, onde nascem o Tigre e o Eufrates, lendo as quatro cabeças como nascentes. Muitos estudiosos sustentam que a história descreve uma geografia sagrada que nunca pretendeu ser levantada em mapa, e o mapa relaciona o Pisom e o Giom entre os seus lugares disputados."
  de:
    - "Niemand weiß es, und die Karte setzt ihn nicht. Die Genesis gibt nur einen Hinweis: Ein Strom floss aus Eden aus und teilte sich in vier, den Pischon, den Gihon, den Hiddekel, der der Tigris ist, und den Euphrat. Zwei der vier sind wirkliche Ströme Mesopotamiens; die beiden anderen sind nie sicher bestimmt worden, sodass jeder Vorschlag davon abhängt, wie sie gelesen werden."
    - "Die Genesis sagt: „Und Gott der HERR pflanzte einen Garten in Eden gegen Morgen“, und: „Und es ging aus von Eden ein Strom, zu wässern den Garten, und er teilte sich von da in vier Hauptwasser.“ Der Pischon „fließt um das ganze Land Hevila; und daselbst findet man Gold“, und der Gihon fließt „um das ganze Mohrenland“, auf Hebräisch Kusch. Josephus hielt den Pischon für den Ganges und den Gihon für den Nil, und viele nach ihm taten es ebenso; andere haben Hawila und Kusch in Arabien oder in Babylonien gesucht, was sehr verschiedene Karten ergibt."
    - "Zwei Regionen werden am häufigsten vorgeschlagen. Die eine ist das Kopfende des Persischen Golfs, wo Tigris und Euphrat zusammenfließen: Hier las E. A. Speiser die vier Hauptwasser als Flüsse, die in einem zusammenlaufen, und spätere Autoren hielten den Pischon für ein ausgetrocknetes Flussbett vom Hedschas durch Arabien bis Kuwait und den Gihon für den Karun aus Iran. Die andere ist das armenische Hochland in der Osttürkei, wo Tigris und Euphrat entspringen, wobei die vier Hauptwasser als Quellen gelesen werden. Viele Gelehrte meinen, die Erzählung beschreibe eine heilige Geografie, die nie zum Vermessen gedacht war, und die Karte führt Pischon und Gihon unter ihren umstrittenen Orten auf."
  fr:
    - "Personne ne le sait, et la carte ne le place pas. La Genèse ne donne qu’un indice : un fleuve sortait d’Éden et se divisait en quatre, le Pischon, le Guihon, le Hiddékel, qui est le Tigre, et l’Euphrate. Deux des quatre sont de vrais fleuves de Mésopotamie ; les deux autres n’ont jamais été identifiés avec certitude, de sorte que toute proposition repose sur la manière dont on les lit."
    - "La Genèse dit : « l’Éternel Dieu planta un jardin en Éden, du côté de l’orient », et : « Un fleuve sortait d’Éden pour arroser le jardin, et de là il se divisait en quatre bras. » Le Pischon est « celui qui entoure tout le pays de Havila, où se trouve l’or », et le Guihon « celui qui entoure tout le pays de Cusch », l’Éthiopie des traductions anciennes, en hébreu Cusch. Flavius Josèphe prit le Pischon pour le Gange et le Guihon pour le Nil, et beaucoup l’ont suivi ; d’autres ont cherché Havila et Cusch en Arabie ou en Babylonie, ce qui donne des cartes très différentes."
    - "Deux régions sont le plus souvent proposées. L’une est le fond du golfe Persique, où se rejoignent le Tigre et l’Euphrate : E. A. Speiser y lisait les quatre bras comme des fleuves convergeant en un seul, et des auteurs plus tardifs ont pris le Pischon pour un lit de fleuve asséché allant du Hedjaz à travers l’Arabie jusqu’au Koweït, et le Guihon pour le Karoun, venu d’Iran. L’autre est le haut pays d’Arménie, dans l’est de la Turquie, où naissent le Tigre et l’Euphrate, les quatre bras étant lus comme des sources. De nombreux spécialistes tiennent que le récit décrit une géographie sacrée qui n’était pas faite pour être arpentée, et la carte range le Pischon et le Guihon parmi ses lieux discutés."
