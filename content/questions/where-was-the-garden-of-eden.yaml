id: where-was-the-garden-of-eden
question:
  en: "Where was the Garden of Eden?"
  ru: "Где находился Едемский сад?"
  uk: "Де був Едемський сад?"
  es: "¿Dónde estaba el jardín del Edén?"
  pt: "Onde ficava o jardim do Éden?"
  de: "Wo lag der Garten Eden?"
  fr: "Où se trouvait le jardin d’Éden ?"
  pl: "Gdzie leżał Ogród Eden?"
  it: "Dov’era il giardino di Eden?"
  cs: "Kde byla zahrada Eden?"
  nl: "Waar lag de hof van Eden?"
  sv: "Var låg Edens lustgård?"
  nb: "Hvor lå Edens hage?"
  tl: "Nasaan ang Halamanan ng Eden?"
  da: "Hvor lå Edens Have?"
  sr: "Где је био Еденски врт?"
  hu: "Hol volt az Éden kertje?"
  fi: "Missä Eedenin puutarha sijaitsi?"
  vi: "Vườn Ê-đen ở đâu?"
  ro: "Unde se afla Grădina Edenului?"
  bg: "Къде се е намирала Едемската градина?"
answer:
  en:
    - "Nobody knows, and the map does not place it. Genesis gives only one clue: a river flowed out of Eden and divided into four, the Pishon, the Gihon, the Hiddekel, which is the Tigris, and the Euphrates. Two of the four are real rivers of Mesopotamia; the other two have never been identified with certainty, so every proposal rests on how they are read."
    - "Genesis says: “And the LORD God planted a garden eastward in Eden”, and: “And a river went out of Eden to water the garden; and from thence it was parted, and became into four heads.” The Pishon “compasseth the whole land of Havilah, where there is gold”, and the Gihon “compasseth the whole land of Ethiopia”, in Hebrew Cush. Josephus took the Pishon for the Ganges and the Gihon for the Nile, and so did many after him; others have looked for Havilah and Cush in Arabia or in Babylonia, which gives very different maps."
    - "Two regions are most often proposed. One is the head of the Persian Gulf, where the Tigris and Euphrates meet: here E. A. Speiser read the four heads as rivers converging on one, and later writers took the Pishon for a dried-up river bed running from the Hijaz across Arabia to Kuwait and the Gihon for the Karun from Iran. The other is the highlands of Armenia in eastern Turkey, where the Tigris and Euphrates rise, reading the four heads as sources. Many scholars hold that the story describes a sacred geography that was never meant to be surveyed, and the map lists the Pishon and Gihon among its disputed places."
  ru:
    - "Этого никто не знает, и карта его не показывает. Книга Бытия даёт лишь одну подсказку: из Едема выходила река и разделялась на четыре — Фисон, Гихон, Хиддекель, то есть Тигр, и Евфрат. Две из четырёх — настоящие реки Месопотамии, а две другие так и не отождествлены достоверно, поэтому всякое предположение зависит от того, как их прочесть."
    - "Бытие говорит: «И насадил Господь Бог рай в Едеме на востоке», и далее: «Из Едема выходила река для орошения рая; и потом разделялась на четыре реки». Фисон «обтекает всю землю Хавила, ту, где золото», а Гихон «обтекает всю землю Куш». Иосиф Флавий принимал Фисон за Ганг, а Гихон за Нил, и многие после него тоже; другие искали Хавилу и Куш в Аравии или в Вавилонии, а это даёт совсем разные карты."
    - "Чаще всего предлагают две области. Первая — устье Тигра и Евфрата у Персидского залива: здесь Э. Спайзер прочёл четыре «начала» как реки, сходящиеся в одну, а позднейшие авторы приняли за Фисон высохшее русло, идущее из Хиджаза через Аравию к Кувейту, а за Гихон — Карун из Ирана. Вторая — Армянское нагорье на востоке Турции, где Тигр и Евфрат берут начало, если читать четыре «начала» как истоки. Многие учёные считают, что рассказ описывает священную географию, которую не предполагалось наносить на карту; Фисон и Гихон карта относит к спорным местам."
  uk:
    - "Ніхто не знає, і мапа його не позначає. Книга Буття дає лише одну підказку: ріка виходила з Едему й розділялася на чотири — Фісон, Гіхон, Хіддекель, тобто Тигр, і Євфрат. Дві з чотирьох — справжні річки Месопотамії; дві інші ніколи не були ототожнені напевно, тож кожна пропозиція залежить від того, як їх читати."
    - "Книга Буття каже: «насадив Бог сад у Едемі на востоцї» і «І ріка виходить із Едему на поливаннє саду, а потім розлучається чотирма течіями». Фісон «обтекає всю Гавила землю, де знаходять золото», а Гіхон «обтекає всю Куш землю» — Ефіопії, івритом Куш. Йосиф Флавій вважав Фісон Гангом, а Гіхон Нілом, і так само багато хто після нього; інші шукали Хавілу й Куш в Аравії чи у Вавилонії, що дає дуже різні мапи."
    - "Найчастіше пропонують два краї. Один — верхів'я Перської затоки, де зустрічаються Тигр і Євфрат: тут Е. А. Шпайзер читав чотири «голови» як ріки, що сходяться в одну, а пізніші автори вважали Фісон висохлим річищем, що йшло з Хіджазу через Аравію до Кувейту, а Гіхон — Карун з Ірану. Другий — Вірменське нагір'я на сході Туреччини, де беруть початок Тигр і Євфрат; тут чотири «голови» розуміють як джерела. Багато вчених вважають, що оповідь описує сакральну географію, яку ніколи не мали на меті обстежувати, а мапа перелічує Фісон і Гіхон серед своїх спірних місць."
  es:
    - "Nadie lo sabe, y el mapa no lo sitúa. El Génesis da una sola pista: un río salía del Edén y se dividía en cuatro, el Pisón, el Gihón, el Hiddekel, que es el Tigris, y el Éufrates. Dos de los cuatro son ríos reales de Mesopotamia; los otros dos nunca se han identificado con certeza, de modo que toda propuesta depende de cómo se los lea."
    - "El Génesis dice: «Y había Jehová Dios plantado un huerto en Edén al oriente», y: «Y salía de Edén un río para regar el huerto, y de allí se repartía en cuatro ramales». El Pisón «cerca toda la tierra de Havilah, donde hay oro», y el Gihón «rodea toda la tierra de Etiopía», en hebreo Cus. Josefo tomó el Pisón por el Ganges y el Gihón por el Nilo, y así lo hicieron muchos después de él; otros han buscado Havila y Cus en Arabia o en Babilonia, lo que da mapas muy distintos."
    - "Dos regiones se proponen con más frecuencia. Una es la cabecera del golfo Pérsico, donde se encuentran el Tigris y el Éufrates: aquí E. A. Speiser leyó los cuatro ramales como ríos que convergen en uno, y autores posteriores tomaron el Pisón por un cauce seco que iría del Hiyaz a través de Arabia hasta Kuwait y el Gihón por el Karún, de Irán. La otra son las tierras altas de Armenia, en el este de Turquía, donde nacen el Tigris y el Éufrates, leyendo los cuatro ramales como fuentes. Muchos estudiosos sostienen que el relato describe una geografía sagrada que nunca estuvo destinada a ser levantada en un plano, y el mapa enumera el Pisón y el Gihón entre sus lugares discutidos."
  pt:
    - "Ninguém sabe, e o mapa não o situa. O Gênesis dá apenas uma pista: um rio saía do Éden e se dividia em quatro, o Pisom, o Giom, o Hídequel, que é o Tigre, e o Eufrates. Dois dos quatro são rios reais da Mesopotâmia; os outros dois nunca foram identificados com certeza, de modo que toda proposta depende de como são lidos."
    - "O Gênesis diz: “O SENHOR Deus plantou um jardim no oriente, no Éden”, e: “Um rio saía do Éden para regar o jardim; e dali se dividia, e se tornava a nascente de quatro rios.” O Pisom “flui por toda a terra de Havilá, onde há ouro”, e o Giom “é o mesmo rio que flui por toda a terra de Cuxe”, que outras traduções chamam Etiópia. Josefo tomou o Pisom pelo Ganges e o Giom pelo Nilo, e muitos depois dele fizeram o mesmo; outros procuraram Havilá e Cuxe na Arábia ou na Babilônia, o que dá mapas muito diferentes."
    - "Duas regiões são mais frequentemente propostas. Uma é a cabeceira do golfo Pérsico, onde o Tigre e o Eufrates se encontram: aqui E. A. Speiser leu as quatro cabeças como rios que convergem em um só, e autores posteriores tomaram o Pisom por um leito de rio seco que ia do Hejaz, através da Arábia, até o Kuaite, e o Giom pelo Karun, do Irã. A outra são as terras altas da Armênia, no leste da Turquia, onde nascem o Tigre e o Eufrates, lendo as quatro cabeças como nascentes. Muitos estudiosos sustentam que a história descreve uma geografia sagrada que nunca pretendeu ser levantada em mapa, e o mapa relaciona o Pisom e o Giom entre os seus lugares disputados."
  de:
    - "Niemand weiß es, und die Karte setzt ihn nicht. Die Genesis gibt nur einen Hinweis: Ein Strom floss aus Eden aus und teilte sich in vier, den Pischon, den Gihon, den Hiddekel, der der Tigris ist, und den Euphrat. Zwei der vier sind wirkliche Ströme Mesopotamiens; die beiden anderen sind nie sicher bestimmt worden, sodass jeder Vorschlag davon abhängt, wie sie gelesen werden."
    - "Die Genesis sagt: „Und Gott der HERR pflanzte einen Garten in Eden gegen Morgen“, und: „Und es ging aus von Eden ein Strom, zu wässern den Garten, und er teilte sich von da in vier Hauptwasser.“ Der Pischon „fließt um das ganze Land Hevila; und daselbst findet man Gold“, und der Gihon fließt „um das ganze Mohrenland“, auf Hebräisch Kusch. Josephus hielt den Pischon für den Ganges und den Gihon für den Nil, und viele nach ihm taten es ebenso; andere haben Hawila und Kusch in Arabien oder in Babylonien gesucht, was sehr verschiedene Karten ergibt."
    - "Zwei Regionen werden am häufigsten vorgeschlagen. Die eine ist das Kopfende des Persischen Golfs, wo Tigris und Euphrat zusammenfließen: Hier las E. A. Speiser die vier Hauptwasser als Flüsse, die in einem zusammenlaufen, und spätere Autoren hielten den Pischon für ein ausgetrocknetes Flussbett vom Hedschas durch Arabien bis Kuwait und den Gihon für den Karun aus Iran. Die andere ist das armenische Hochland in der Osttürkei, wo Tigris und Euphrat entspringen, wobei die vier Hauptwasser als Quellen gelesen werden. Viele Gelehrte meinen, die Erzählung beschreibe eine heilige Geografie, die nie zum Vermessen gedacht war, und die Karte führt Pischon und Gihon unter ihren umstrittenen Orten auf."
  fr:
    - "Personne ne le sait, et la carte ne le place pas. La Genèse ne donne qu’un indice : un fleuve sortait d’Éden et se divisait en quatre, le Pischon, le Guihon, le Hiddékel, qui est le Tigre, et l’Euphrate. Deux des quatre sont de vrais fleuves de Mésopotamie ; les deux autres n’ont jamais été identifiés avec certitude, de sorte que toute proposition repose sur la manière dont on les lit."
    - "La Genèse dit : « l’Éternel Dieu planta un jardin en Éden, du côté de l’orient », et : « Un fleuve sortait d’Éden pour arroser le jardin, et de là il se divisait en quatre bras. » Le Pischon est « celui qui entoure tout le pays de Havila, où se trouve l’or », et le Guihon « celui qui entoure tout le pays de Cusch », l’Éthiopie des traductions anciennes, en hébreu Cusch. Flavius Josèphe prit le Pischon pour le Gange et le Guihon pour le Nil, et beaucoup l’ont suivi ; d’autres ont cherché Havila et Cusch en Arabie ou en Babylonie, ce qui donne des cartes très différentes."
    - "Deux régions sont le plus souvent proposées. L’une est le fond du golfe Persique, où se rejoignent le Tigre et l’Euphrate : E. A. Speiser y lisait les quatre bras comme des fleuves convergeant en un seul, et des auteurs plus tardifs ont pris le Pischon pour un lit de fleuve asséché allant du Hedjaz à travers l’Arabie jusqu’au Koweït, et le Guihon pour le Karoun, venu d’Iran. L’autre est le haut pays d’Arménie, dans l’est de la Turquie, où naissent le Tigre et l’Euphrate, les quatre bras étant lus comme des sources. De nombreux spécialistes tiennent que le récit décrit une géographie sacrée qui n’était pas faite pour être arpentée, et la carte range le Pischon et le Guihon parmi ses lieux discutés."
  pl:
    - "Nikt nie wie, a mapa go nie umieszcza. Księga Rodzaju daje tylko jedną wskazówkę: rzeka wypływała z Edenu i dzieliła się na cztery, Pischon, Gichon, Chiddekel, czyli Tygrys, i Eufrat. Dwie z czterech to prawdziwe rzeki Mezopotamii; dwóch pozostałych nigdy nie zidentyfikowano z pewnością, więc każda propozycja zależy od sposobu ich odczytania."
    - "Księga Rodzaju mówi: „Nasadził też był Pan Bóg sad w Eden, na wschód słońca”, oraz: „A rzeka wychodziła z Eden dla odwilżenia sadu; i stamtąd dzieliła się na cztery główne rzeki”. O Pischonie mówi się: „ta okrąża wszystką ziemię Hewila, gdzie się rodzi złoto”, a Gichon okrąża całą ziemię Kusz, czyli Etiopię. Józef Flawiusz uważał Pischon za Ganges, a Gichon za Nil, i wielu po nim; inni szukali Chawili i Kusz w Arabii lub w Babilonii, co daje bardzo różne mapy."
    - "Najczęściej proponuje się dwa regiony. Jednym jest wierzchołek Zatoki Perskiej, gdzie spotykają się Tygrys i Eufrat: tu E. A. Speiser odczytał cztery głowy jako rzeki zbiegające się w jedną, a późniejsi autorzy uznali Pischon za wyschnięte koryto biegnące z Hidżazu przez Arabię do Kuwejtu, a Gichon za Karun z Iranu. Drugim są wyżyny Armenii we wschodniej Turcji, gdzie biorą początek Tygrys i Eufrat, z odczytaniem czterech głów jako źródeł. Wielu uczonych uważa, że opowieść opisuje świętą geografię, której nigdy nie miano mierzyć, a mapa wymienia Pischon i Gichon wśród swoich miejsc spornych."
  it:
    - "Nessuno lo sa, e la mappa non lo colloca. La Genesi dà un solo indizio: un fiume usciva da Eden e si divideva in quattro, il Pison, il Ghicon, lo Hiddekel, che è il Tigri, e l’Eufrate. Due dei quattro sono fiumi reali della Mesopotamia; gli altri due non sono mai stati identificati con certezza, così che ogni proposta poggia sul modo in cui sono letti."
    - "La Genesi dice: «l’Eterno Iddio piantò un giardino in Eden, in oriente», e: «un fiume usciva d’Eden per adacquare il giardino, e di là si spartiva in quattro bracci». Il Pison «circonda tutto il paese di Havila, dov’è l’oro», e il Ghicon «circonda tutto il paese di Cush», cioè l’Etiopia, in ebraico Cus. Giuseppe Flavio identificò il Pison con il Gange e il Ghicon con il Nilo, e così fecero molti dopo di lui; altri hanno cercato Avila e Cus in Arabia o in Babilonia, il che dà mappe molto diverse."
    - "Si propongono più spesso due regioni. Una è la testata del Golfo Persico, dove il Tigri e l’Eufrate si incontrano: qui E. A. Speiser lesse i quattro bracci come fiumi che convergono in uno, e autori successivi identificarono il Pison con un letto di fiume prosciugato che va dall’Hijaz attraverso l’Arabia fino al Kuwait e il Ghicon con il Karun dall’Iran. L’altra è l’altopiano d’Armenia nella Turchia orientale, dove nascono il Tigri e l’Eufrate, leggendo i quattro bracci come sorgenti. Molti studiosi ritengono che il racconto descriva una geografia sacra che non fu mai destinata a essere rilevata, e la mappa elenca il Pison e il Ghicon tra i suoi luoghi discussi."
  cs:
    - "Nikdo neví a mapa ji neumisťuje. Genesis dává jen jednu stopu: řeka vycházela z Edenu a dělila se na čtyři, Píšon, Gichón, Chidekel, to jest Tigris, a Eufrat. Dvě ze čtyř jsou skutečné řeky Mezopotámie; další dvě nebyly nikdy jistě určeny, takže každý návrh stojí na tom, jak se čtou."
    - "Genesis praví: „Štípil pak byl Hospodin Bůh ráj v Eden na východ“ a: „A řeka vycházela z Eden, k svlažování ráje, a odtud dělila se, a byla ve čtyři hlavní řeky.“ Píšon „obchází všecku zemi Hevilah, kdež jest zlato“ a Gichón „obchází všecku zemi Chus“, hebrejsky Kúš. Josephus pokládal Píšon za Gangu a Gichón za Nil a po něm mnozí; jiní hledali Chavílu a Kúš v Arábii nebo v Babylonii, což dává velmi odlišné mapy."
    - "Nejčastěji se navrhují dvě oblasti. Jednou je čelo Perského zálivu, kde se stékají Tigris a Eufrat: tady E. A. Speiser četl čtyři hlavy jako řeky sbíhající se v jedné a pozdější autoři pokládali Píšon za vyschlé řečiště vedoucí z Hidžázu přes Arábii do Kuvajtu a Gichón za Karún z Íránu. Druhou je Arménská vysočina ve východním Turecku, kde Tigris a Eufrat pramení, přičemž čtyři hlavy se čtou jako prameny. Mnozí badatelé soudí, že příběh popisuje posvátnou geografii, která nikdy neměla být zeměměřena, a mapa uvádí Píšon a Gichón mezi svými sporně umístěnými místy."
  nl:
    - "Niemand weet het, en de kaart plaatst het niet. Genesis geeft maar één aanwijzing: een rivier stroomde uit Eden en splitste zich in vier, de Pison, de Gihon, de Hiddekel, dat is de Tigris, en de Eufraat. Twee van de vier zijn echte rivieren van Mesopotamië; de andere twee zijn nooit met zekerheid geïdentificeerd, zodat elk voorstel afhangt van hoe zij worden gelezen."
    - "Genesis zegt: “Ook had de HEERE God een hof geplant in Eden, tegen het oosten”, en: “Een rivier was voortgaande uit Eden, om dezen hof te bewateren; en werd van daar verdeeld, en werd tot vier hoofden.” De Pison is degene “die het ganse land van Havila omloopt, waar het goud is”, en de Gihon degene “die het ganse land Cusch omloopt”, Ethiopië. Josephus hield de Pison voor de Ganges en de Gihon voor de Nijl, en velen na hem ook; anderen hebben Havila en Kus in Arabië of in Babylonië gezocht, wat zeer verschillende kaarten oplevert."
    - "Twee streken worden het vaakst voorgesteld. De ene is het noordelijke uiteinde van de Perzische Golf, waar Tigris en Eufraat samenkomen: hier las E. A. Speiser de vier hoofden als rivieren die in één samenkomen, en latere schrijvers hielden de Pison voor een opgedroogde rivierbedding die van de Hidjaz door Arabië naar Koeweit loopt en de Gihon voor de Karun uit Iran. De andere is het hoogland van Armenië in het oosten van Turkije, waar Tigris en Eufraat ontspringen, waarbij de vier hoofden als bronnen worden gelezen. Veel geleerden menen dat het verhaal een heilige geografie beschrijft die nooit bedoeld was om te worden opgemeten, en de kaart noemt de Pison en de Gihon onder haar omstreden plaatsen."
  sv:
    - "Ingen vet, och kartan placerar den inte. Första Moseboken ger bara en ledtråd: en flod gick ut från Eden och delade sig i fyra, Pishon, Gihon, Hiddekel, som är Tigris, och Eufrat. Två av de fyra är verkliga floder i Mesopotamien; de andra två har aldrig kunnat identifieras med säkerhet, så varje förslag vilar på hur de läses."
    - "Första Moseboken säger: ”Och HERREN Gud planterade en lustgård i Eden österut”, och: ”Och från Eden gick en flod ut, som vattnade lustgården; sedan delade den sig i fyra grenar.” Pishon ”flyter omkring hela landet Havila, där guld finnes”, och Gihon ”flyter omkring hela landet Kus”, på hebreiska Kush. Josefus tog Pishon för Ganges och Gihon för Nilen, och det gjorde många efter honom; andra har sökt Havila och Kush i Arabien eller i Babylonien, vilket ger mycket olika kartor."
    - "Två regioner föreslås oftast. Den ena är Persiska vikens innersta del, där Tigris och Eufrat möts: här läste E. A. Speiser de fyra grenarna som floder som flyter samman till en, och senare författare tog Pishon för en uttorkad flodbädd som löper från Hijaz över Arabien till Kuwait och Gihon för Karun från Iran. Den andra är Armeniens högland i östra Turkiet, där Tigris och Eufrat har sina källor och där de fyra grenarna läses som källflöden. Många forskare menar att berättelsen beskriver en helig geografi som aldrig var avsedd att kartläggas, och kartan förtecknar Pishon och Gihon bland sina omstridda platser."
  nb:
    - "Ingen vet det, og kartet plasserer den ikke. Første Mosebok gir bare ett spor: en elv rant ut av Eden og delte seg i fire, Pisjon, Gihon, Hiddekel, som er Tigris, og Eufrat. To av de fire er virkelige elver i Mesopotamia; de to andre er aldri blitt identifisert med sikkerhet, så hvert forslag hviler på hvordan de leses."
    - "Første Mosebok sier: «Og Gud Herren plantet en have i Eden, i Østen», og: «Og det gikk en elv ut fra Eden og vannet haven; og siden delte den sig i fire strømmer.» Pisjon «løper omkring hele landet Havila, der hvor det er gull», og Gihon «løper omkring hele landet Kus», som på hebraisk heter Kusj og i King James-oversettelsen Etiopia. Josefus tok Pisjon for Ganges og Gihon for Nilen, og det gjorde mange etter ham; andre har lett etter Havila og Kusj i Arabia eller Babylonia, noe som gir svært ulike kart."
    - "To områder foreslås oftest. Det ene er den innerste delen av Persiagulfen, der Tigris og Eufrat møtes: her leste E. A. Speiser de fire strømmene som elver som løper sammen til én, og senere forfattere tok Pisjon for et uttørket elveleie fra Hijaz tvers over Arabia til Kuwait og Gihon for Karun fra Iran. Det andre er høylandet i Armenia i Øst-Tyrkia, der Tigris og Eufrat har sine kilder, og de fire strømmene leses som kilder. Mange forskere mener at fortellingen beskriver en hellig geografi som aldri var ment å måles opp, og kartet oppfører Pisjon og Gihon blant sine omstridte steder."
  tl:
    - "Walang nakakaalam, at hindi ito inilalagay ng mapa. Isang bakas lamang ang ibinibigay ng Genesis: isang ilog ang lumabas sa Eden at nahati sa apat, ang Pison, ang Gihon, ang Hiddecel, na siyang Tigris, at ang Eufrates. Dalawa sa apat ay tunay na mga ilog ng Mesopotamia; ang dalawa pa ay hindi kailanman nakilala nang tiyak, kaya ang bawat mungkahi ay nakasalalay sa kung paano sila binabasa."
    - "Sinasabi ng Genesis: “naglagay ang Panginoong Dios ng isang halamanan sa Eden, sa dakong silanganan”, at: “may isang ilog na lumabas sa Eden na dumilig sa halamanan; at mula roo'y nabahagi at nagapat na sanga.” Ang Pison ay “lumiligid sa buong lupain ng Havilah, na doo'y may ginto”, at ang Gihon ay “lumiligid sa buong lupain ng Cush”, o Etiopia. Itinuring ni Josephus na ang Pison ay ang Ganges at ang Gihon ay ang Nilo, at gayundin ang marami pagkatapos niya; hinanap ng iba ang Havila at Cush sa Arabia o sa Babilonia, na nagbibigay ng magkakaibang mapa."
    - "Dalawang rehiyon ang pinakamadalas na iminumungkahi. Ang isa ay ang pinakaloob na dulo ng Golpo ng Persia, kung saan nagtatagpo ang Tigris at Eufrates: dito binasa ni E. A. Speiser ang apat na sanga bilang mga ilog na nagtatagpo sa isa, at itinuring ng mga susunod na manunulat ang Pison na tuyong higaan ng ilog na tumatakbo mula sa Hijaz sa buong Arabia hanggang Kuwait at ang Gihon na ang Karun mula sa Iran. Ang isa pa ay ang kabundukan ng Armenia sa silangang Turkey, kung saan nagmumula ang Tigris at Eufrates, na binabasa ang apat na sanga bilang mga bukal. Maraming iskolar ang naniniwalang inilalarawan ng salaysay ang isang sagradong heograpiya na hindi kailanman nilayong sukatin, at inililista ng mapa ang Pison at Gihon sa mga pinagtatalunang lugar."
  da:
    - "Ingen ved det, og kortet placerer den ikke. Første Mosebog giver kun ét spor: En flod gik ud fra Eden og delte sig i fire, Pisjon, Gihon, Hiddekel, som er Tigris, og Eufrat. To af de fire er virkelige floder i Mesopotamien; de to andre er aldrig blevet identificeret med sikkerhed, så ethvert forslag hviler på, hvordan de læses."
    - "Første Mosebog siger: »Og Gud Herren plantede en Have udi Eden mod Østen«, og: »Og der gik en Flod ud fra Eden til at vande Haven, og derfra deltes den og blev til fire Hovedstrømme.« Pisjon »løber om det ganske Land Havila, hvor der er Guld«, og Gihon »løber om det ganske Land Kus«, på hebraisk Kusj. Josefus tog Pisjon for Ganges og Gihon for Nilen, og det gjorde mange efter ham; andre har søgt Havila og Kusj i Arabien eller i Babylonien, hvilket giver meget forskellige kort."
    - "To egne foreslås oftest. Den ene er bunden af Den Persiske Bugt, hvor Tigris og Eufrat mødes: Her læste E. A. Speiser de fire hovedstrømme som floder, der løber sammen i én, og senere forfattere tog Pisjon for et udtørret flodleje fra Hijaz tværs over Arabien til Kuwait og Gihon for Karun fra Iran. Den anden er højlandet i Armenien i det østlige Tyrkiet, hvor Tigris og Eufrat har deres udspring, og de fire hovedstrømme læses som kilder. Mange forskere hævder, at beretningen beskriver en hellig geografi, som aldrig var tænkt til at blive opmålt, og kortet opregner Pisjon og Gihon blandt sine omstridte steder."
  sr:
    - "Нико не зна, а карта га не смешта. Постање даје само један траг: река је истицала из Едена и делила се на четири, Фисон, Гион, Хидекел, то јест Тигар, и Еуфрат. Две од четири су стварне реке Месопотамије; друге две никад нису поуздано поистовећене, па сваки предлог почива на томе како се оне читају."
    - "Постање каже: „И насади Господ Бог врт у Едему на истоку“, и: „А вода течаше из Едема натапајући врт, и оданде се делише у четири реке.“ Фисон „она тече око целе земље евилске, а онде има злата“, а Гион „она тече око целе земље хуске“, на хебрејском Куш. Јосиф Флавије је Фисон узео за Ганг, а Гион за Нил, као и многи после њега; други су Евилу и Куш тражили у Арабији или у Вавилонији, што даје веома различите карте."
    - "Најчешће се предлажу две области. Једна је горњи крај Персијског залива, где се Тигар и Еуфрат сустичу: овде је Е. А. Спајзер читао четири главе као реке које се сливају у једну, а каснији писци узимали су Фисон за исушено речно корито које иде од Хиџаза преко Арабије до Кувајта, а Гион за Карун из Ирана. Друга је јерменско горје у источној Турској, где извиру Тигар и Еуфрат, а четири главе читају се као извори. Многи научници држе да прича описује свету географију која никад није била замишљена да се премери, а карта наводи Фисон и Гион међу својим спорним местима."
  hu:
    - "Senki sem tudja, és a térkép nem helyezi el. A Mózes első könyve egyetlen támpontot ad: egy folyó indult ki Édenből, és négyfelé szakadt, a Písón, a Gihon, a Hiddekel, vagyis a Tigris, és az Eufrátesz. A négyből kettő Mezopotámia valódi folyója; a másik kettőt sosem azonosították biztosan, ezért minden javaslat azon múlik, hogyan olvassák őket."
    - "A Mózes első könyve szerint: „És ültete az Úr Isten egy kertet Édenben, napkelet felől”, és: „Folyóvíz jő vala pedig ki Édenből a kert megöntözésére; és onnét elágazik és négy főágra szakad vala.” A Písón „megkerüli Havilah egész földét, a hol az arany terem”, a Gihon pedig „megkerüli az egész Khús földét”, vagyis Etiópiát (héberül Kús). Josephus a Písónt a Gangésszal, a Gihont a Nílussal azonosította, és sokan követték; mások Havilát és Kúst Arábiában vagy Babilóniában keresték, ami egészen más térképeket ad."
    - "Két vidéket javasolnak leggyakrabban. Az egyik a Perzsa-öböl feje, ahol a Tigris és az Eufrátesz találkozik: itt E. A. Speiser a négy főágat egyetlenbe torkolló folyóknak olvasta, későbbi írók pedig a Písónt a Hidzsázból Arábián át Kuvaitig húzódó kiszáradt folyómederként, a Gihont pedig az iráni Kárúnként értelmezték. A másik a kelet-törökországi Örmény-felföld, ahol a Tigris és az Eufrátesz ered, a négy főágat forrásokként olvasva. Sok tudós úgy véli, hogy a történet olyan szent földrajzot ír le, amelyet sosem szántak felmérésre, a térkép pedig a Písónt és a Gihont a vitatott helyek között sorolja fel."
  fi:
    - "Kukaan ei tiedä, eikä kartta sijoita sitä. Genesis antaa vain yhden vihjeen: joki virtasi ulos Eedenistä ja jakautui neljäksi, Pisoniksi, Gihoniksi, Hiddekeliksi, joka on Tigris, ja Eufratiksi. Kaksi neljästä on todellisia Mesopotamian jokia; kahta muuta ei ole koskaan varmuudella tunnistettu, joten jokainen ehdotus perustuu siihen, miten ne luetaan."
    - "Genesis sanoo: ”Herra Jumala istutti paratiisin Eedeniin, itään”, ja: ”Eedenistä lähti joki, joka kasteli paratiisia, ja se jakaantui sieltä neljään haaraan.” Pison ”kiertää koko Havilan maan, jossa on kultaa”, ja Gihon ”kiertää koko Kuusin maan” (King James -käännöksessä Etiopia, hepreaksi Kus). Josefus piti Pisonia Gangesina ja Gihonia Niilinä, ja niin tekivät monet hänen jälkeensä; toiset ovat etsineet Havilaa ja Kusta Arabiasta tai Babyloniasta, mikä antaa hyvin erilaisia karttoja."
    - "Kahta aluetta ehdotetaan useimmin. Toinen on Persianlahden pää, jossa Tigris ja Eufrat kohtaavat: täällä E. A. Speiser luki neljä haaraa yhteen virtaavina jokina, ja myöhemmät kirjoittajat pitivät Pisonia Hijazista Arabian halki Kuwaitiin kulkevana kuivuneena uomana ja Gihonia Iranin Karunina. Toinen on Armenian ylänkö Itä-Turkissa, jossa Tigris ja Eufrat saavat alkunsa, ja neljä haaraa luetaan lähteinä. Monet tutkijat katsovat, että kertomus kuvaa pyhää maantiedettä, jota ei koskaan ollut tarkoitus kartoittaa, ja kartta luettelee Pisonin ja Gihonin kiistanalaisten paikkojensa joukossa."
  vi:
    - "Không ai biết, và bản đồ không đặt nó. Sách Sáng thế chỉ cho một manh mối: một con sông chảy ra từ Ê-đen và chia làm bốn: Phi-sôn, Ghi-hôn, Hi-đê-ke (tức sông Tigris) và Sông Ơ-phơ-rát. Hai trong bốn sông là sông thật của Mê-sô-bô-ta-mi; hai sông kia chưa bao giờ được đồng nhất một cách chắc chắn, nên mọi đề xuất đều dựa vào cách đọc chúng."
    - "Sách Sáng thế nói: “Giê-hô-va Đức Chúa Trời lập một cảnh vườn tại Ê-đen, ở về hướng Đông”, và: “Một con sông từ Ê-đen chảy ra đặng tưới vườn; rồi từ đó chia ra làm bốn ngả.” Phi-sôn “chảy quanh xứ Ha-vi-la, là nơi có vàng”, và Ghi-hôn “chảy quanh xứ Cu-sơ”, tức Cút (bản King James dịch là Ê-thi-ô-bi). Josephus cho Phi-sôn là sông Hằng và Ghi-hôn là Sông Ni-lơ, và nhiều người sau ông cũng vậy; những người khác tìm Ha-vi-la và Cút ở A-ra-bi hoặc ở Ba-by-lôn, cho ra những bản đồ rất khác nhau."
    - "Hai vùng thường được đề xuất nhất. Một là đầu Vịnh Ba Tư, nơi sông Hi-đê-ke và Ơ-phơ-rát gặp nhau: ở đây E. A. Speiser đọc bốn ngả là các con sông hội tụ về một, và các tác giả về sau cho Phi-sôn là một lòng sông khô chạy từ Hijaz qua A-ra-bi đến Kuwait và Ghi-hôn là sông Karun từ Iran. Vùng kia là cao nguyên Armenia ở đông Thổ Nhĩ Kỳ, nơi sông Hi-đê-ke và Ơ-phơ-rát bắt nguồn, đọc bốn ngả là các nguồn. Nhiều học giả cho rằng câu chuyện mô tả một địa lý thiêng liêng không bao giờ nhằm để đo đạc, và bản đồ liệt kê Phi-sôn và Ghi-hôn trong số các địa điểm còn tranh luận."
  ro:
    - "Nimeni nu știe, iar harta nu o plasează. Geneza dă un singur indiciu: un râu ieșea din Eden și se împărțea în patru, Pison, Ghihon, Hidechel, care este Tigrul, și Eufratul. Două dintre cele patru sunt râuri reale ale Mesopotamiei; celelalte două nu au fost identificate niciodată cu certitudine, așa că fiecare propunere se sprijină pe felul în care sunt citite."
    - "Geneza spune: „au sădit Dumnezeu Raiu în Edem către răsărit”, și: „rîu ieșeà din Edem, ca să ude Raiul, care de acolo se împarte în patru rîuri.” Pisonul „încunjură tot pământul Evilatului; acolo este aur”, iar Ghihonul „încunjură tot pământul Etiopiei”, în ebraică Cuș. Iosif Flaviu a luat Pisonul drept Gange și Ghihonul drept Nil, și așa au făcut mulți după el; alții au căutat Havila și Cuș în Arabia sau în Babilonia, ceea ce dă hărți foarte diferite."
    - "Două regiuni sunt propuse cel mai des. Una este capătul Golfului Persic, unde se întâlnesc Tigrul și Eufratul: aici E. A. Speiser a citit cele patru capete ca râuri care converg într-unul, iar scriitori de mai târziu au luat Pisonul drept o albie uscată care merge din Hijaz peste Arabia până în Kuwait și Ghihonul drept Karunul din Iran. Cealaltă este podișul Armeniei din estul Turciei, unde izvorăsc Tigrul și Eufratul, citind cele patru capete ca izvoare. Mulți cercetători socot că povestea descrie o geografie sacră care nu a fost niciodată menită să fie măsurată, iar harta enumeră Pisonul și Ghihonul printre locurile ei disputate."
  bg:
    - "Никой не знае и картата не я поставя. Битие дава само една следа: река изтичала от Едем и се разделяла на четири — Фисон, Гион, Хидекел, който е Тигър, и Ефрат. Две от четирите са истински реки в Месопотамия; другите две никога не са отъждествени със сигурност, така че всяко предположение зависи от това как се четат те."
    - "Битие казва: „И насади Господ Бог рай в Едем на изток“, и: „И река изхождаше из Едем да напоява рая; и от там се разделяше на четири глави.“ Фисон „обикаля всичката Евилатска земя, дето има злато“, а Гион „обикаля всичката Хуска земя“ — на иврит Куш. Йосиф Флавий смята Фисон за Ганг, а Гион — за Нил, и мнозина след него правят същото; други търсят Хавила и Куш в Арабия или във Вавилония, което дава съвсем различни карти."
    - "Най-често се предлагат две области. Едната е северният край на Персийския залив, където се срещат Тигър и Ефрат: тук Е. А. Спайзер тълкува четирите глави като реки, които се сливат в една, а по-късни автори смятат Фисон за пресъхнало речно корито, което минава от Хиджаз през Арабия до Кувейт, а Гион — за Карун, идващ от Иран. Другата са планините на Армения в Източна Турция, където извират Тигър и Ефрат, при което четирите глави се тълкуват като извори. Много учени смятат, че разказът описва сакрална география, която никога не е била предназначена за измерване, а картата изброява Фисон и Гион сред спорните си места."
