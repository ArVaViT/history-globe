id: when-was-the-exodus
question:
  en: "When was the Exodus?"
  ru: "Когда был Исход?"
  uk: "Коли був Вихід?"
  es: "¿Cuándo fue el Éxodo?"
  pt: "Quando foi o Êxodo?"
  de: "Wann war der Auszug aus Ägypten?"
  fr: "Quand a eu lieu l’Exode ?"
  pl: "Kiedy nastąpiło Wyjście?"
  it: "Quando avvenne l’Esodo?"
  nl: "Wanneer was de uittocht?"
  cs: "Kdy byl exodus?"
answer:
  en:
    - "The date is disputed. Two answers are defended: about 1446 BC, in the fifteenth century, which follows the Bible's own arithmetic and is the year the map uses, and the thirteenth century BC, in the reign of Ramesses II, which follows the name of the store city Rameses and the archaeology of Egypt and Canaan. Some scholars hold that the event cannot be dated at all."
    - "The early date rests on 1 Kings: Solomon began the Temple “in the four hundred and eightieth year after the children of Israel were come out of the land of Egypt, in the fourth year of Solomon's reign”. His fourth year is usually put at 966 BC, which gives 1446 BC; Jephthah's three hundred years of Israel in Transjordan, and the sojourn of “four hundred and thirty years” in Egypt, are read the same way. The late date starts from Exodus 1:11: the Israelites “built for Pharaoh treasure cities, Pithom and Raamses”, and Pi-Ramesses, the Delta capital at Qantir, was built by Ramesses II, who reigned from 1279 to 1213 BC. On this reading the 480 years are twelve generations of forty, a round figure."
    - "The oldest mention of Israel outside the Bible is the stele of Merneptah, son of Ramesses II, which lists Israel among the peoples defeated in Canaan in about 1208 BC; so Israel was in the land by then on either date. The destruction layers of Canaanite cities, the absence of Egyptian records of the event and the late date of many wilderness sites are argued on both sides. The map keeps 1446 BC as a conventional point and marks it as approximate."
  ru:
    - "Дата спорна. Отстаивают два ответа: около 1446 г. до н. э., в XV веке, что следует из собственной арифметики Библии и принято на карте, и XIII век до н. э., царствование Рамсеса II, что следует из имени города для запасов Раамсеса и из археологии Египта и Ханаана. Некоторые учёные считают, что событие вообще нельзя датировать."
    - "Ранняя дата опирается на 3 Царств: Соломон начал строить храм «В четыреста восьмидесятом году по исшествии сынов Израилевых из земли Египетской, в четвертый год царствования Соломонова». Его четвёртый год обычно относят к 966 г. до н. э., что даёт 1446 г. до н. э.; так же читают триста лет Израиля в Заиорданье у Иеффая и «четыреста тридцать лет» пребывания в Египте. Поздняя дата исходит из Исхода 1:11: израильтяне построили фараону «Пифом и Раамсес, города для запасов», а Пер-Рамсес, столицу в дельте у Кантира, построил Рамсес II, царствовавший с 1279 по 1213 г. до н. э. При таком чтении 480 лет — это двенадцать поколений по сорок, круглое число."
    - "Древнейшее упоминание Израиля вне Библии — стела Мернептаха, сына Рамсеса II, где Израиль назван среди народов, разбитых в Ханаане около 1208 г. до н. э.; значит, при любой дате Израиль к тому времени уже был в этой земле. Слои разрушений ханаанских городов, молчание египетских источников и поздняя датировка многих стоянок в пустыне идут в ход у обеих сторон. Карта держит 1446 г. до н. э. как условную точку и помечает её как приблизительную."
  uk:
    - "Дата спірна. Захищають дві відповіді: близько 1446 р. до н. е., у XV ст., яка йде за власною біблійною арифметикою і є роком, що використовує мапа, та XIII ст. до н. е., за царювання Рамсеса II, яка йде за назвою міста-комори Раамсес і за археологією Єгипту та Ханаану. Деякі вчені вважають, що подію взагалі не можна датувати."
    - "Рання дата спирається на 1 Цар: Соломон почав Храм «У чотириста вісїмдесятому роцї по виходї Ізрайлитян із Египту, у четвертому роцї, місяця Зифа, — се є місяць другий — царювання Соломонового над Ізраїлем». Його четвертий рік зазвичай ставлять на 966 р. до н. е., що дає 1446 р. до н. е.; триста років Ізраїлю в Заїорданні в Єфтая і перебування «чотирі ста і трийцять год» в Єгипті читають так само. Пізня дата виходить з Вих 1:11: «збудували вони харчові городи Фараонові: Питом і Раємзес», а Пер-Рамсес, столицю в дельті в Кантірі, збудував Рамсес II, який царював у 1279–1213 рр. до н. е. За цим прочитанням 480 років — це дванадцять поколінь по сорок, кругла цифра."
    - "Найдавніша згадка про Ізраїль поза Біблією — стела Мернептаха, сина Рамсеса II, що зараховує Ізраїль до народів, переможених у Ханаані близько 1208 р. до н. е.; тож Ізраїль був у цій землі на той час за будь-якою датою. Шари руйнування ханаанських міст, відсутність єгипетських записів про подію та пізня дата багатьох пустельних місць обговорюються з обох боків. Мапа лишає 1446 р. до н. е. умовною точкою й позначає її як приблизну."
  es:
    - "La fecha es discutida. Se defienden dos respuestas: hacia el 1446 a. C., en el siglo XV, que sigue la aritmética de la propia Biblia y es el año que usa el mapa, y el siglo XIII a. C., en el reinado de Ramsés II, que sigue el nombre de la ciudad de almacenaje de Ramesés y la arqueología de Egipto y Canaán. Algunos estudiosos sostienen que el acontecimiento no puede fecharse en absoluto."
    - "La fecha temprana se apoya en 1 Reyes: Salomón comenzó el Templo «en el año cuatrocientos ochenta después que los hijos de Israel salieron de Egipto, en el cuarto año del principio del reino de Salomón sobre Israel». Su cuarto año suele situarse en el 966 a. C., lo que da el 1446 a. C.; los trescientos años de Israel en Transjordania de Jefté y la estancia de «cuatrocientos treinta años» en Egipto se leen del mismo modo. La fecha tardía parte de Éxodo 1:11: los israelitas «edificaron á Faraón las ciudades de los bastimentos, Phithom y Raamses», y Pi-Ramsés, la capital del delta en Qantir, fue construida por Ramsés II, que reinó de 1279 a 1213 a. C. Según esta lectura, los 480 años son doce generaciones de cuarenta, una cifra redonda."
    - "La mención más antigua de Israel fuera de la Biblia es la estela de Merneptah, hijo de Ramsés II, que enumera a Israel entre los pueblos derrotados en Canaán hacia el 1208 a. C.; de modo que Israel estaba ya en la tierra para entonces, con cualquiera de las dos fechas. Los estratos de destrucción de las ciudades cananeas, la ausencia de registros egipcios del acontecimiento y la fecha tardía de muchos lugares del desierto se argumentan en ambos sentidos. El mapa mantiene el 1446 a. C. como punto convencional y lo marca como aproximado."
  pt:
    - "A data é disputada. Defendem-se duas respostas: cerca de 1446 a.C., no século XV, que segue a aritmética da própria Bíblia e é o ano que o mapa usa, e o século XIII a.C., no reinado de Ramessés II, que segue o nome da cidade-armazém Ramessés e a arqueologia do Egito e de Canaã. Alguns estudiosos sustentam que o acontecimento não pode ser datado de modo algum."
    - "A data alta se apoia em 1 Reis: Salomão começou o Templo “no quadringentésimo octogésimo ano depois que os filhos de Israel saíram da terra do Egito, no quarto ano do reinado de Salomão”. Seu quarto ano costuma ser posto em 966 a.C., o que dá 1446 a.C.; os trezentos anos de Israel na Transjordânia, em Jefté, e a estada de “quatrocentos e trinta anos” no Egito são lidos do mesmo modo. A data baixa parte de Êxodo 1:11: os israelitas “construíram cidades-armazéns para o Faraó: Pitom e Ramsés”, e Pi-Ramessés, a capital do Delta em Qantir, foi construída por Ramessés II, que reinou de 1279 a 1213 a.C. Nessa leitura, os 480 anos são doze gerações de quarenta, número redondo."
    - "A menção mais antiga de Israel fora da Bíblia é a estela de Merneptá, filho de Ramessés II, que lista Israel entre os povos derrotados em Canaã por volta de 1208 a.C.; assim, Israel estava na terra nessa época em qualquer das datas. As camadas de destruição das cidades cananeias, a ausência de registros egípcios do fato e a data tardia de muitos sítios do deserto são argumentadas dos dois lados. O mapa mantém 1446 a.C. como ponto convencional e o marca como aproximado."
  de:
    - "Das Datum ist umstritten. Zwei Antworten werden vertreten: um 1446 v. Chr., im 15. Jahrhundert, was der eigenen Arithmetik der Bibel folgt und das Jahr ist, das die Karte verwendet, und das 13. Jahrhundert v. Chr. unter Ramses II., was dem Namen der Vorratsstadt Ramses und der Archäologie Ägyptens und Kanaans folgt. Manche Gelehrte meinen, das Ereignis lasse sich gar nicht datieren."
    - "Das frühe Datum beruht auf dem 1. Buch der Könige: Salomo begann den Tempel „im vierhundertachtzigsten Jahr nach dem Ausgang der Kinder Israel aus Ägyptenland, im vierten Jahr des Königreichs Salomo“. Sein viertes Jahr setzt man meist auf 966 v. Chr., was 1446 v. Chr. ergibt; Jeftahs dreihundert Jahre Israels in Transjordanien und der Aufenthalt in Ägypten, der „vierhundertunddreißig Jahre“ währte, werden ebenso gelesen. Das späte Datum geht von 2. Mose 1,11 aus: Man baute dem Pharao „die Städte Pithon und Raemses zu Vorratshäusern“, und Pi-Ramses, die Deltahauptstadt bei Qantir, wurde von Ramses II. erbaut, der von 1279 bis 1213 v. Chr. regierte. Nach dieser Lesart sind die 480 Jahre zwölf Generationen zu vierzig, eine runde Zahl."
    - "Die älteste Erwähnung Israels außerhalb der Bibel ist die Stele des Merenptah, des Sohnes Ramses' II., die Israel unter den um 1208 v. Chr. in Kanaan besiegten Völkern aufführt; Israel war also nach beiden Daten damals im Land. Die Zerstörungsschichten kanaanäischer Städte, das Fehlen ägyptischer Aufzeichnungen über das Ereignis und die späte Datierung vieler Wüstenstätten werden von beiden Seiten angeführt. Die Karte behält 1446 v. Chr. als herkömmlichen Punkt bei und kennzeichnet ihn als ungefähr."
  fr:
    - "La date est discutée. Deux réponses sont défendues : environ 1446 av. J.-C., au XVe siècle, qui suit l’arithmétique de la Bible et est l’année retenue par la carte, et le XIIIe siècle av. J.-C., sous le règne de Ramsès II, qui suit le nom de la ville-entrepôt Ramsès et l’archéologie de l’Égypte et de Canaan. Certains savants tiennent que l’événement ne peut pas être daté du tout."
    - "La date haute repose sur 1 Rois : Salomon commença le Temple « la quatre cent quatre-vingtième année après la sortie des enfants d’Israël du pays d’Égypte … la quatrième année de son règne ». On place d’ordinaire sa quatrième année en 966 av. J.-C., ce qui donne 1446 av. J.-C. ; les trois cents ans d’Israël en Transjordanie, selon Jephté, et le séjour de « quatre cent trente ans » en Égypte se lisent de la même façon. La date basse part d’Exode 1:11 : les Israélites bâtirent « les villes de Pithom et de Ramsès, pour servir de magasins à Pharaon », et Pi-Ramsès, la capitale du delta à Qantir, fut bâtie par Ramsès II, qui régna de 1279 à 1213 av. J.-C. Dans cette lecture, les 480 ans sont douze générations de quarante, chiffre rond."
    - "La plus ancienne mention d’Israël hors de la Bible est la stèle de Mérenptah, fils de Ramsès II, qui range Israël parmi les peuples vaincus en Canaan vers 1208 av. J.-C. ; Israël était donc dans le pays à cette date, quelle que soit la datation. Les couches de destruction des villes cananéennes, l’absence de textes égyptiens sur l’événement et la date tardive de nombreux sites du désert sont allégués de part et d’autre. La carte garde 1446 av. J.-C. comme repère conventionnel et la marque comme approximative."
  pl:
    - "Data jest sporna. Bronione są dwie odpowiedzi: około 1446 p.n.e., w XV wieku, która idzie za własną arytmetyką Biblii i jest rokiem używanym przez mapę, oraz XIII wiek p.n.e., za panowania Ramzesa II, która idzie za nazwą miasta składowego Ramses i archeologią Egiptu i Kanaanu. Niektórzy uczeni twierdzą, że wydarzenia w ogóle nie da się datować."
    - "Wczesna data opiera się na 1 Księdze Królewskiej: Salomon rozpoczął Świątynię „czterechsetnego i ośmdziesiątego roku po wyjściu synów Izraelskich z ziemi Egipskiej, … roku czwartego królowania Salomonowego”. Jego czwarty rok zwykle datuje się na 966 p.n.e., co daje 1446 p.n.e.; trzysta lat Izraela w Transjordanii u Jeftego i pobyt „cztery sta lat, i trzydzieści lat” w Egipcie odczytuje się tak samo. Późna data wychodzi od Wj 1,11: „zbudował lud Izraelski miasta składu Faraonowi: Pytom i Rameses”, a Pi-Ramses, stolica Delty w Qantir, zostało zbudowane przez Ramzesa II, który panował od 1279 do 1213 p.n.e. Według tego odczytania 480 lat to dwanaście pokoleń po czterdzieści, liczba okrągła."
    - "Najstarsza wzmianka o Izraelu poza Biblią to stela Merneptaha, syna Ramzesa II, która wymienia Izrael wśród ludów pokonanych w Kanaanie około 1208 p.n.e.; więc Izrael był w ziemi już wtedy przy obu datach. Warstwy zniszczeń kananejskich miast, brak egipskich zapisów o wydarzeniu i późna data wielu stanowisk na pustyni są przytaczane w argumentach po obu stronach. Mapa zachowuje 1446 p.n.e. jako punkt umowny i oznacza go jako przybliżony."
  it:
    - "La data è discussa. Si difendono due risposte: circa il 1446 a.C., nel XV secolo, che segue l’aritmetica della stessa Bibbia ed è l’anno che la mappa usa, e il XIII secolo a.C., sotto Ramses II, che segue il nome della città di deposito Ramses e l’archeologia dell’Egitto e di Canaan. Alcuni studiosi sostengono che l’evento non si possa datare affatto."
    - "La data alta poggia su 1 Re: Salomone cominciò il Tempio «il quattrocentottantesimo anno dopo l’uscita dei figliuoli d’Israele dal paese d’Egitto, nel quarto anno del suo regno». Il suo quarto anno si pone di solito al 966 a.C., il che dà il 1446 a.C.; i trecento anni d’Israele in Transgiordania di cui parla Iefte e la permanenza di «quattrocento trenta anni» in Egitto si leggono allo stesso modo. La data bassa parte da Esodo 1,11: gli Israeliti costruirono per Faraone «le città di approvvigionamento, Pithom e Raamses», e Pi-Ramses, la capitale del Delta a Qantir, fu costruita da Ramses II, che regnò dal 1279 al 1213 a.C. In questa lettura i 480 anni sono dodici generazioni di quaranta, una cifra tonda."
    - "La più antica menzione di Israele fuori della Bibbia è la stele di Merenptah, figlio di Ramses II, che elenca Israele tra i popoli sconfitti in Canaan intorno al 1208 a.C.; dunque Israele era nel paese a quella data, secondo l’una e l’altra datazione. Gli strati di distruzione delle città cananee, l’assenza di documenti egizi sull’evento e la data tarda di molti siti del deserto sono discussi da entrambe le parti. La mappa mantiene il 1446 a.C. come punto convenzionale e lo segna come approssimativo."
  nl:
    - "De datum is omstreden. Twee antwoorden worden verdedigd: omstreeks 1446 v.Chr., in de 15e eeuw, wat de eigen rekenkunde van de Bijbel volgt en het jaar is dat de kaart gebruikt, en de 13e eeuw v.Chr., onder de regering van Ramses II, wat de naam van de voorraadstad Raämses en de archeologie van Egypte en Kanaän volgt. Sommige geleerden menen dat de gebeurtenis helemaal niet te dateren is."
    - "De vroege datum rust op 1 Koningen: Salomo begon de tempel “in het vierhonderd en tachtigste jaar, na den uitgang der kinderen Israëls uit Egypte, in het vierde jaar van het koninkrijk van Salomo”. Zijn vierde jaar wordt gewoonlijk op 966 v.Chr. gesteld, wat 1446 v.Chr. geeft; de driehonderd jaar van Jefta voor Israël in Transjordanië en het verblijf van “vierhonderd jaren en dertig jaren” in Egypte worden op dezelfde wijze gelezen. De late datum gaat uit van Exodus 1:11: “men bouwde voor Farao schatsteden, Pitom en Raamses”, en Pi-Ramses, de hoofdstad in de Delta bij Qantir, werd gebouwd door Ramses II, die van 1279 tot 1213 v.Chr. regeerde. Volgens deze lezing zijn de 480 jaar twaalf generaties van veertig, een rond getal."
    - "De oudste vermelding van Israël buiten de Bijbel is de stèle van Merneptah, zoon van Ramses II, die Israël noemt onder de volken die omstreeks 1208 v.Chr. in Kanaän werden verslagen; Israël was er dus al in het land, bij beide data. De verwoestingslagen van Kanaänitische steden, het ontbreken van Egyptische berichten over de gebeurtenis en de late datering van veel woestijnplaatsen worden aan beide kanten aangevoerd. De kaart houdt 1446 v.Chr. aan als conventioneel punt en markeert het als bij benadering."
  cs:
    - "Datum je sporné. Hájí se dvě odpovědi: asi 1446 př. n. l., v 15. století, které sleduje vlastní aritmetiku Bible a které mapa užívá, a 13. století př. n. l., za vlády Ramesse II., které sleduje jméno skladištního města Ramesse a archeologii Egypta a Kanaánu. Někteří badatelé tvrdí, že událost nelze datovat vůbec."
    - "Rané datum stojí na První knize Královské: Šalomoun začal chrám „léta čtyřstého osmdesátého po vyjití synů Izraelských z země Egyptské … čtvrtého léta kralování svého nad Izraelem“. Jeho čtvrtý rok se obvykle klade na 966 př. n. l., což dává 1446 př. n. l.; Jiftáchových tři sta let Izraele v Zajordání i pobyt „čtyři sta a třidceti let“ v Egyptě se čtou stejně. Pozdní datum vychází z Ex 1,11: „vystavěl lid Izraelský Faraonovi města skladů, Fiton a Ramesses“, a Pi-Ramesse, hlavní město delty v Kantíru, postavil Ramesse II., který vládl v letech 1279 až 1213 př. n. l. Podle tohoto čtení je 480 let dvanáct generací po čtyřiceti, kulaté číslo."
    - "Nejstarší zmínka o Izraeli mimo Bibli je stéla Merneptaha, syna Ramesse II., která uvádí Izrael mezi národy poraženými v Kanaánu kolem roku 1208 př. n. l.; Izrael tedy byl v zemi do té doby při obou datech. Vrstvy zničení kanaánských měst, absence egyptských záznamů o události a pozdní datování mnoha stanic na poušti se hájí na obou stranách. Mapa si ponechává rok 1446 př. n. l. jako smluvní bod a označuje jej za přibližný."
