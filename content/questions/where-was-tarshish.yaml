id: where-was-tarshish
question:
  en: "Where was Tarshish?"
  ru: "Где находился Фарсис?"
  uk: "Де був Тарсис?"
  es: "¿Dónde estaba Tarsis?"
  pt: "Onde ficava Társis?"
  de: "Wo lag Tarsis?"
  fr: "Où se trouvait Tarsis ?"
  pl: "Gdzie leżał Tarszisz?"
  it: "Dov’era Tarsis?"
  cs: "Kde ležel Taršíš?"
  nl: "Waar lag Tarsis?"
  sv: "Var låg Tarshish?"
  nb: "Hvor lå Tarsis?"
answer:
  en:
    - "Tarshish is disputed. The strongest candidate is Tartessos, the land of silver at the mouth of the Guadalquivir in south-western Spain, near today's Huelva and Seville, which the Phoenicians reached by the eighth century BC, perhaps earlier; the map point stands there, about 3,826 km from Joppa in a straight line, at the far end of the Mediterranean. Tarsus in Cilicia, Sardinia and Carthage have also been proposed, and some hold that the word is not a place at all."
    - "Jonah “rose up to flee unto Tarshish from the presence of the LORD, and went down to Joppa; and he found a ship going to Tarshish”: Tarshish is the opposite end of the world from Nineveh. Ezekiel says that Tarshish traded with Tyre “with silver, iron, tin, and lead”, the metals of Spain, and Isaiah groups it with the far “isles”. Genesis 10 makes Tarshish a son of Javan, the Greeks, which led Josephus to Tarsus; a Phoenician stone of the ninth or eighth century BC found at Nora in Sardinia seems to name Tarshish; and the Greek translators of Isaiah rendered the name as Carthage. An inscription of Esarhaddon of about 670 BC lists Tarsisi among the kings of the lands in the midst of the sea, which suits a place far to the west."
    - "The phrase “ships of Tarshish” became a term for large sea-going merchantmen: Jehoshaphat built “ships of Tharshish to go to Ophir for gold” at Ezion-geber on the Red Sea, which could never reach a western Tarshish. Herodotus tells how the Phocaeans of Ionia, the first Greeks to make long voyages, discovered Tartessos, whose king Arganthonios ruled for eighty years, and how a Samian ship driven past the Pillars of Heracles came home from there with a profit matched by only one other Greek trader. The map shows Tartessos and lists the other candidates on the place card."
  ru:
    - "Фарсис — спорное место. Самый сильный кандидат — Тартесс, страна серебра в устье Гвадалквивира на юго-западе Испании, у нынешних Уэльвы и Севильи, куда финикийцы доходили к VIII веку до н. э., а возможно, и раньше; точка на карте стоит там, примерно в 3826 км от Иоппии по прямой, на дальнем конце Средиземного моря. Предлагали также Тарс в Киликии, Сардинию и Карфаген, а некоторые считают, что это вообще не название места."
    - "Книга Ионы говорит: «И встал Иона, чтобы бежать в Фарсис от лица Господня, и пришел в Иоппию, и нашел корабль, отправлявшийся в Фарсис»; Фарсис — другой край света по сравнению с Ниневией. Иезекииль говорит, что Фарсис платил Тиру «серебром, железом, свинцом и оловом» — металлами Испании, а Исаия ставит его рядом с дальними «островами». Бытие 10 делает Фарсиса сыном Иавана, то есть греков, что привело Иосифа Флавия к Тарсу; финикийский камень IX или VIII века до н. э., найденный в Норе на Сардинии, по-видимому, называет Фарсис; а греческие переводчики Исаии передали это имя как Карфаген. Надпись Асархаддона около 670 г. до н. э. называет Тарсиси среди царей земель посреди моря, что подходит месту далеко на западе."
    - "Выражение «корабли Фарсиса» стало названием больших морских торговых судов: Иосафат строил в Ецион-Гавере на Чермном море корабли, чтобы ходить в Офир за золотом, — оттуда до западного Фарсиса не доплыть. Геродот рассказывает, как фокейцы из Ионии, первыми из греков пустившиеся в дальние плавания, открыли Тартесс, где царь Аргантоний правил восемьдесят лет, и как самосский корабль, унесённый за Геракловы столпы, вернулся оттуда с прибылью, с которой мог сравниться лишь один греческий купец. Карта показывает Тартесс, остальных кандидатов перечисляет в карточке."
  uk:
    - "Місце Тарсису спірне. Найсильніший кандидат — Тартесс, земля срібла в гирлі Гвадалківіру на південному заході Іспанії, біля нинішніх Уельви й Севільї, якого фінікійці досягли вже у VIII ст. до н. е., а можливо, й раніше; точка на мапі стоїть там, приблизно за 3826 км від Яффи по прямій, на дальньому кінці Середземного моря. Пропонували також Тарс у Кілікії, Сардинію та Карфаген, а дехто вважає, що це слово — зовсім не місце."
    - "Йона «устав, щоб утїкати від Господа в Тарсис, і, дойшовши до Яфи, знайшов корабель, що йшов у Тарсис»: Тарсис — протилежний кінець світу від Ніневії. Єзекіїль каже, що Тарсис торгував із Тіром: «срібло, золото, цину й оливо» — металами Іспанії, а Ісая згадує його серед тих, до кого буде послано «по далеких островах». Книга Буття 10 робить Тарсис сином Явана, тобто греків, що привело Йосифа Флавія до Тарса; фінікійський камінь IX чи VIII ст. до н. е., знайдений у Норі на Сардинії, схоже, називає Тарсис; а грецькі перекладачі Ісаї передали назву як Карфаген. Напис Асархаддона близько 670 р. до н. е. перелічує Тарсісі серед царів земель посеред моря, що пасує до місця далеко на заході."
    - "Вислів «тарсійські кораблі» став назвою великих морських торгових суден: Йосафат збудував тарсійські кораблі, щоб плисти в Офір по золото, в Еціон-Гевері на Червоному морі, звідки неможливо було досягти західного Тарсису. Геродот розповідає, як фокейці з Іонії, перші греки, що вирушали в далекі плавання, відкрили Тартесс, чий цар Арганфоній правив вісімдесят років, і як самоський корабель, відігнаний повз Геракліві стовпи, повернувся звідти з прибутком, якого досягнув лише один інший грецький торговець. Мапа показує Тартесс, а інших кандидатів перелічує в картці місця."
  es:
    - "Tarsis se discute. El candidato más fuerte es Tartessos, la tierra de la plata en la desembocadura del Guadalquivir, en el suroeste de España, cerca de las actuales Huelva y Sevilla, a la que llegaron los fenicios en el siglo VIII a. C., quizá antes; el punto del mapa está allí, a unos 3826 km de Jope en línea recta, en el extremo del Mediterráneo. También se han propuesto Tarso de Cilicia, Cerdeña y Cartago, y algunos sostienen que la palabra no designa un lugar en absoluto."
    - "Jonás «se levantó para huir de la presencia de Jehová á Tarsis, y descendió á Joppe; y halló un navío que partía para Tarsis»: Tarsis es el extremo opuesto del mundo respecto de Nínive. Ezequiel dice que Tarsis comerciaba con Tiro «en plata, hierro, estaño, y plomo», los metales de España, e Isaías la agrupa con las lejanas «islas». Génesis 10 hace de Tarsis un hijo de Javán, los griegos, lo que llevó a Josefo a Tarso; una piedra fenicia de los siglos IX u VIII a. C. hallada en Nora, en Cerdeña, parece nombrar Tarsis; y los traductores griegos de Isaías vertieron el nombre como Cartago. Una inscripción de Esar-hadón, de hacia el 670 a. C., enumera Tarsisi entre los reyes de las tierras en medio del mar, lo que conviene a un lugar muy al oeste."
    - "La expresión «naves de Tarsis» pasó a designar grandes mercantes de altura: Josafat hizo «navíos en Tharsis, los cuales habían de ir á Ophir por oro» en Ezión-geber, en el mar Rojo, que nunca podrían llegar a una Tarsis occidental. Heródoto cuenta cómo los foceos de Jonia, los primeros griegos que hicieron largos viajes, descubrieron Tartessos, cuyo rey Argantonio reinó ochenta años, y cómo una nave de Samos arrastrada más allá de las Columnas de Heracles volvió de allí con un beneficio que solo igualó otro comerciante griego. El mapa muestra Tartessos y enumera los demás candidatos en la ficha del lugar."
  pt:
    - "Társis é disputada. O candidato mais forte é Tartessos, a terra da prata na foz do Guadalquivir, no sudoeste da Espanha, perto da atual Huelva e de Sevilha, que os fenícios alcançaram no século VIII a.C., talvez antes; o ponto do mapa fica ali, a cerca de 3.826 km de Jope em linha reta, na outra extremidade do Mediterrâneo. Também foram propostas Tarso, na Cilícia, a Sardenha e Cartago, e alguns sustentam que a palavra nem sequer é um lugar."
    - "Jonas “se levantou para fugir da presença do SENHOR para Társis. Ele desceu a Jope e encontrou um navio que ia para Társis”: Társis é o extremo oposto do mundo em relação a Nínive. Ezequiel diz que Társis comerciava com Tiro com “prata, ferro, estanho e chumbo”, os metais da Espanha, e Isaías a agrupa com as “ilhas distantes”. Gênesis 10 faz de Társis um filho de Javã, os gregos, o que levou Josefo a Tarso; uma pedra fenícia do século IX ou VIII a.C. encontrada em Nora, na Sardenha, parece nomear Társis; e os tradutores gregos de Isaías verteram o nome como Cartago. Uma inscrição de Esar-Hadom, de cerca de 670 a.C., relaciona Tarsisi entre os reis das terras no meio do mar, o que convém a um lugar muito a oeste."
    - "A expressão “navios de Társis” tornou-se um termo para grandes mercantes de alto-mar: Josafá “construiu navios de Társis para irem a Ofir em busca de ouro”, em Eziom-Geber, no mar Vermelho, que nunca poderiam chegar a uma Társis ocidental. Heródoto conta como os foceus da Jônia, os primeiros gregos a fazer longas viagens, descobriram Tartessos, cujo rei Argantônio governou por oitenta anos, e como um navio de Samos, levado para além das Colunas de Héracles, voltou de lá com um lucro igualado por apenas outro mercador grego. O mapa mostra Tartessos e relaciona os outros candidatos na ficha do lugar."
  de:
    - "Tarsis ist umstritten. Der stärkste Kandidat ist Tartessos, das Silberland an der Mündung des Guadalquivir im Südwesten Spaniens, nahe dem heutigen Huelva und Sevilla, das die Phönizier im 8. Jahrhundert v. Chr. erreichten, vielleicht früher; dort steht der Kartenpunkt, in der Luftlinie etwa 3826 km von Joppe, am fernen Ende des Mittelmeers. Auch Tarsus in Kilikien, Sardinien und Karthago wurden vorgeschlagen, und manche halten das Wort überhaupt nicht für einen Ort."
    - "Jona „machte sich auf und floh vor dem HERRN und wollte gen Tharsis und kam hinab gen Japho. Und da er ein Schiff fand, das gen Tharsis wollte fahren“: Tarsis ist das entgegengesetzte Ende der Welt von Ninive. Hesekiel sagt, Tarsis habe mit Tyrus gehandelt und „Silber, Eisen, Zinn und Blei“ gebracht, die Metalle Spaniens, und Jesaja ordnet es den fernen „Inseln“ zu. 1. Mose 10 macht Tarsis zu einem Sohn Jawans, der Griechen, was Josephus zu Tarsus führte; ein phönizischer Stein des 9. oder 8. Jahrhunderts v. Chr., bei Nora auf Sardinien gefunden, scheint Tarsis zu nennen; und die griechischen Übersetzer des Jesaja gaben den Namen als Karthago wieder. Eine Inschrift Asarhaddons von etwa 670 v. Chr. führt Tarsisi unter den Königen der Länder mitten im Meer auf, was zu einem Ort weit im Westen passt."
    - "Der Ausdruck „Tharsisschiffe“ wurde zum Begriff für große seegehende Handelsschiffe: Josaphat „hatte Schiffe lassen machen aufs Meer, die nach Ophir gehen sollten, Gold zu holen“, in Ezjon-Geber am Roten Meer, von wo sie nie ein westliches Tarsis hätten erreichen können. Herodot erzählt, wie die Phokäer Ioniens, die ersten Griechen auf Langfahrten, Tartessos entdeckten, dessen König Arganthonios achtzig Jahre herrschte, und wie ein von den Säulen des Herakles vorbeigetriebenes samisches Schiff von dort mit einem Gewinn heimkehrte, den nur ein weiterer griechischer Händler erreichte. Die Karte zeigt Tartessos und führt die anderen Kandidaten auf der Ortskarte auf."
  fr:
    - "L’emplacement de Tarsis est discuté. Le candidat le plus solide est Tartessos, le pays de l’argent à l’embouchure du Guadalquivir, dans le sud-ouest de l’Espagne, près de l’actuelle Huelva et de Séville, que les Phéniciens atteignirent au VIIIe siècle av. J.-C., peut-être plus tôt ; le point de la carte s’y trouve, à environ 3 826 km de Joppé à vol d’oiseau, à l’autre bout de la Méditerranée. Tarse en Cilicie, la Sardaigne et Carthage ont aussi été proposées, et certains tiennent que le mot n’est pas du tout un lieu."
    - "Jonas « se leva pour s’enfuir à Tarsis, loin de la face de l’Éternel. Il descendit à Japho, et il trouva un navire qui allait à Tarsis » : Tarsis est le bout du monde opposé à Ninive. Ézéchiel dit que Tarsis commerçait avec Tyr « d’argent, de fer, d’étain et de plomb », les métaux de l’Espagne, et Ésaïe la range parmi les « îles lointaines ». La Genèse 10 fait de Tarsis un fils de Javan, les Grecs, ce qui conduisit Flavius Josèphe à Tarse ; une pierre phénicienne du IXe ou du VIIIe siècle av. J.-C., trouvée à Nora en Sardaigne, semble nommer Tarsis ; et les traducteurs grecs d’Ésaïe rendirent le nom par Carthage. Une inscription d’Esar-Haddon d’environ 670 av. J.-C. cite Tarsisi parmi les rois des pays situés au milieu de la mer, ce qui convient à un lieu très à l’ouest."
    - "L’expression « navires de Tarsis » devint un terme désignant les grands navires marchands de haute mer : « Josaphat construisit des navires de Tarsis pour aller à Ophir chercher de l’or », à Étsjon-Guéber, sur la mer Rouge, d’où l’on ne pouvait jamais atteindre une Tarsis occidentale. Hérodote raconte comment les Phocéens d’Ionie, premiers Grecs à entreprendre de longs voyages, découvrirent Tartessos, dont le roi Arganthonios régna quatre-vingts ans, et comment un navire de Samos, poussé au-delà des Colonnes d’Héraclès, en revint avec un profit que seul un autre marchand grec égala. La carte montre Tartessos et énumère les autres candidats sur la fiche du lieu."
  pl:
    - "Położenie Tarszisz jest sporne. Najsilniejszym kandydatem jest Tartessos, kraina srebra u ujścia Gwadalkiwiru w południowo-zachodniej Hiszpanii, blisko dzisiejszej Huelvy i Sewilli, do której Fenicjanie dotarli do VIII wieku p.n.e., a może wcześniej; stoi tam punkt na mapie, około 3826 km od Jafy w linii prostej, na dalekim krańcu Morza Śródziemnego. Proponowano też Tars w Cylicji, Sardynię i Kartaginę, a niektórzy sądzą, że to słowo w ogóle nie jest miejscem."
    - "Jonasz „wstał, aby uciekł do Tarsu od oblicza Pańskiego; a przyszedłszy do Joppen, znalazł okręt, który miał iść do Tarsu”: Tarszisz to przeciwny koniec świata niż Niniwa. Ezechiel mówi, że Tarszisz handlował z Tyrem „srebrem, żelazem, cyną i ołowiem”, metalami Hiszpanii, a Izajasz zalicza go do narodów przy morzu i do dalekich wysp. Rdz 10 czyni Tarszisz synem Jawana, czyli Greków, co skłoniło Józefa Flawiusza do Tarsu; fenicki kamień z IX lub VIII wieku p.n.e. znaleziony w Norze na Sardynii wydaje się wymieniać Tarszisz; a greccy tłumacze Izajasza oddali nazwę jako Kartagina. Napis Asarhaddona z około 670 p.n.e. wymienia Tarsisi wśród królów krain pośrodku morza, co pasuje do miejsca daleko na zachodzie."
    - "Wyrażenie „okręty z Tarsys” stało się określeniem dużych statków handlowych dalekomorskich: Jozafat zbudował w Esjon-Geber nad Morzem Czerwonym okręty, „któreby chodziły do Tarsys” — według Księgi Królewskiej „aby chodziły do Ofir po złoto” — a takie okręty nigdy nie mogły dotrzeć do zachodniego Tarszisz. Herodot opowiada, jak Fokajczycy z Jonii, pierwsi Grecy odbywający dalekie podróże, odkryli Tartessos, którego król Arganthonios rządził przez osiemdziesiąt lat, i jak okręt samijski zniesiony poza Słupy Heraklesa wrócił stamtąd z zyskiem, któremu dorównał tylko jeden inny grecki kupiec. Mapa pokazuje Tartessos, a inne kandydatury wymienia na karcie miejsca."
  it:
    - "Tarsis è discussa. Il candidato più forte è Tartesso, la terra dell’argento alla foce del Guadalquivir nella Spagna sud-occidentale, vicino all’odierna Huelva e Siviglia, che i Fenici raggiunsero entro l’VIII secolo a.C., forse prima; il punto della mappa si trova lì, a circa 3.826 km da Giaffa in linea d’aria, all’estremità del Mediterraneo. Sono state proposte anche Tarso di Cilicia, la Sardegna e Cartagine, e alcuni sostengono che la parola non sia affatto un luogo."
    - "Giona «si levò per fuggirsene a Tarsis, lungi dal cospetto dell’Eterno; e scese a Giaffa, dove trovò una nave che andava a Tarsis»: Tarsis è l’estremità opposta del mondo rispetto a Ninive. Ezechiele dice che Tarsis commerciava con Tiro «d’argento, di ferro, di stagno e di piombo», i metalli della Spagna, e Isaia la raggruppa con le «isole lontane». Gen 10 fa di Tarsis un figlio di Iavan, i Greci, il che condusse Giuseppe Flavio a Tarso; una stele fenicia del IX o VIII secolo a.C. trovata a Nora in Sardegna sembra nominare Tarsis; e i traduttori greci di Isaia resero il nome con Cartagine. Un’iscrizione di Assaraddon del 670 a.C. circa elenca Tarsisi tra i re delle terre in mezzo al mare, il che si addice a un luogo lontano a ovest."
    - "L’espressione «navi di Tarsis» divenne un termine per le grandi navi mercantili d’alto mare: Giosafat costruì «navi di Tarsis per andare a Ofir in cerca d’oro» a Ezion-Gheber sul Mar Rosso, che non avrebbero mai potuto raggiungere una Tarsis occidentale. Erodoto racconta come i Focei della Ionia, i primi Greci a compiere lunghi viaggi, scoprirono Tartesso, il cui re Argantonio regnò ottant’anni, e come una nave di Samo spinta oltre le Colonne d’Ercole tornò da lì con un guadagno eguagliato da un solo altro mercante greco. La mappa mostra Tartesso ed elenca gli altri candidati nella scheda del luogo."
  cs:
    - "Taršíš je sporný. Nejsilnější kandidát je Tartéssos, země stříbra na ústí Guadalquiviru v jihozápadním Španělsku, poblíž dnešní Huelvy a Sevilly, kam Féničané došli v 8. století př. n. l., možná dříve; bod na mapě stojí tam, vzdušnou čarou asi 3 826 km od Joppe, na vzdáleném konci Středozemního moře. Navrhován byl také Tarsos v Kilikii, Sardinie a Kartágo a někteří soudí, že slovo vůbec není místem."
    - "Jonáš „vstal, aby utekl do Tarsu od tváři Hospodinovy. A přišed do Joppe, našel lodí, ana jde do Tarsu“: Taršíš je opačný konec světa od Ninive. Ezechiel říká, že Taršíš obchodoval s Týrem „v stříbře, železe, cínu i olově“, kovech Španělska, a Izajáš jej řadí k dalekým ostrovům: „na ostrovy daleké“. Genesis 10 činí Taršíše synem Javana, Řeků, což vedlo Josepha k Tarsu; fénický kámen z 9. nebo 8. století př. n. l. nalezený v Noře na Sardinii zřejmě jmenuje Taršíš; a řečtí překladatelé Izajáše převedli jméno jako Kartágo. Nápis Asarhadónův z doby kolem roku 670 př. n. l. uvádí Tarsisi mezi králi zemí uprostřed moře, což se hodí na místo daleko na západě."
    - "Obrat lodě taršíšské se stal označením velkých námořních obchodních lodí: v Ecjon-geberu na Rudém moři „nadělal Jozafat lodí mořských, aby jeli do Ofir pro zlato“, které nikdy nemohly dosáhnout západního Taršíše. Hérodotos vypráví, jak Fókajci z Ióňska, první Řekové, kdo podnikali dlouhé plavby, objevili Tartéssos, jehož král Arganthonios vládl osmdesát let, a jak samoská loď zahnaná za Héraklovy sloupy odtud přivezla zisk, jaký dosáhl jen jeden další řecký obchodník. Mapa ukazuje Tartéssos a ostatní kandidáty uvádí na kartě místa."
  nl:
    - "De ligging van Tarsis is omstreden. De sterkste kandidaat is Tartessos, het zilverland aan de monding van de Guadalquivir in het zuidwesten van Spanje, bij het huidige Huelva en Sevilla, dat de Feniciërs in de achtste eeuw v.Chr. bereikten, misschien eerder; daar staat het punt op de kaart, hemelsbreed ongeveer 3826 km van Joppe, aan het verre einde van de Middellandse Zee. Ook Tarsus in Cilicië, Sardinië en Carthago zijn voorgesteld, en sommigen menen dat het woord helemaal geen plaats is."
    - "Jona “maakte zich op om te vluchten naar Tarsis, van het aangezicht des HEEREN; en hij kwam af te Jafo, en vond een schip, gaande naar Tarsis”: Tarsis is het tegenovergestelde einde van de wereld vanaf Nineve. Ezechiël zegt dat Tarsis met Tyrus handel dreef “met zilver, ijzer, tin, en lood”, de metalen van Spanje, en Jesaja rekent het tot “de ver gelegen eilanden”. Gen. 10 maakt Tarsis tot een zoon van Javan, de Grieken, wat Josephus naar Tarsus leidde; een Fenicische steen uit de negende of achtste eeuw v.Chr., gevonden bij Nora op Sardinië, lijkt Tarsis te noemen; en de Griekse vertalers van Jesaja gaven de naam weer als Carthago. Een inscriptie van Esarhaddon van omstreeks 670 v.Chr. noemt Tarsisi onder de koningen van de landen midden in de zee, wat past bij een plaats ver naar het westen."
    - "De uitdrukking “schepen van Tarsis” werd een term voor grote zeegaande koopvaarders: Josafat bouwde “schepen van Tharsis, om naar Ofir te gaan om goud” te Ezeon-Geber aan de Rode Zee, die nooit een westelijk Tarsis hadden kunnen bereiken. Herodotus vertelt hoe de Foceeërs van Ionië, de eerste Grieken die lange reizen maakten, Tartessos ontdekten, waarvan de koning Arganthonios tachtig jaar regeerde, en hoe een Samisch schip dat langs de Zuilen van Herakles was gedreven met een winst terugkeerde die slechts door één andere Griekse handelaar werd geëvenaard. De kaart toont Tartessos en noemt de andere kandidaten op de plaatskaart."
  sv:
    - "Tarshish är omstritt. Den starkaste kandidaten är Tartessos, silverlandet vid Guadalquivirs mynning i sydvästra Spanien, nära dagens Huelva och Sevilla, som fenicierna nådde på 700-talet f.Kr., kanske tidigare; kartpunkten står där, omkring 3 826 km från Joppe i fågelvägen, i Medelhavets yttersta ände. Tarsos i Kilikien, Sardinien och Kartago har också föreslagits, och vissa menar att ordet inte alls är en plats."
    - "Jona ”stod upp och ville fly till Tarsis, undan HERRENS ansikte. Och han for ned till Jafo och fann där ett skepp som skulle gå till Tarsis”: Tarshish är världens motsatta ände från Nineve. Hesekiel säger att Tarshish handlade med Tyros och att ”silver, järn, tenn och bly gavs dig såsom betalning”, Spaniens metaller, och Jesaja grupperar det med de avlägsna ”havsländerna i fjärran”. 1 Mos 10 gör Tarshish till en son till Javan, grekerna, vilket ledde Josefus till Tarsos; en fenicisk sten från 800- eller 700-talet f.Kr. funnen vid Nora på Sardinien tycks nämna Tarshish; och de grekiska översättarna av Jesaja återgav namnet som Kartago. En inskription av Esarhaddon från omkring 670 f.Kr. förtecknar Tarsisi bland kungarna i länderna mitt i havet, vilket passar en plats långt i väster."
    - "Uttrycket ”Tarshish-skepp” blev en benämning på stora havsgående handelsfartyg: Josafat hade låtit bygga ”Tarsis-skepp, som skulle gå till Ofir för att hämta guld” vid Esjon-Geber vid Sävhavet, vilket aldrig kunde nå ett västligt Tarshish. Herodotos berättar hur fokaierna i Jonien, de första greker som gjorde långa sjöresor, upptäckte Tartessos, vars kung Arganthonios regerade i åttio år, och hur ett skepp från Samos som drevs förbi Herakles pelare kom hem därifrån med en vinst som endast en annan grekisk handlare har uppnått. Kartan visar Tartessos och förtecknar de andra kandidaterna på platskortet."
  nb:
    - "Tarsis er omstridt. Den sterkeste kandidaten er Tartessos, sølvlandet ved munningen av Guadalquivir i Sørvest-Spania, nær dagens Huelva og Sevilla, som fønikerne nådde på 700-tallet f.Kr., kanskje tidligere; kartpunktet står der, omtrent 3826 km fra Jaffa i luftlinje, i den fjerne enden av Middelhavet. Tarsos i Kilikia, Sardinia og Kartago er også foreslått, og noen mener at ordet slett ikke er et sted."
    - "Jona «stod op og vilde fly til Tarsis, bort fra Herrens åsyn; og han drog ned til Joppe og fant der et skib som skulde gå til Tarsis»: Tarsis er den motsatte enden av verden fra Ninive. Esekiel sier at Tarsis handlet med Tyros «med sølv, jern, tinn og bly», Spanias metaller, og Jesaja regner det blant de fjerne «kyster». Første Mosebok 10 gjør Tarsis til en sønn av Javan, grekerne, noe som førte Josefus til Tarsos; en fønikisk stein fra 800- eller 700-tallet f.Kr. funnet ved Nora på Sardinia later til å nevne Tarsis; og de greske oversetterne av Jesaja gjengav navnet som Kartago. En innskrift av Asarhaddon fra omkring 670 f.Kr. oppregner Tarsisi blant kongene i landene midt i havet, noe som passer for et sted langt mot vest."
    - "Uttrykket «Tarsis-skip» ble en betegnelse for store havgående handelsskip: Josjafat hadde «ti Tarsis-skib som skulde gå til Ofir efter gull» ved Esjon-Geber ved Rødehavet, som aldri kunne nå et vestlig Tarsis. Herodot forteller hvordan fokaierne fra Ionia, de første grekerne som foretok lange reiser, oppdaget Tartessos, hvis konge Arganthonios regjerte i åtti år, og hvordan et skip fra Samos, drevet forbi Herakles’ søyler, kom hjem derfra med en fortjeneste som bare én annen gresk handelsmann har oppnådd. Kartet viser Tartessos og oppfører de andre kandidatene på stedskortet."
