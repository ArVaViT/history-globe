id: how-far-ur-to-canaan
question:
  en: "How far did Abraham travel from Ur to Canaan?"
  ru: "Сколько прошёл Авраам от Ура до Ханаана?"
  uk: "Яку відстань пройшов Авраам від Ура до Ханаану?"
  es: "¿Qué distancia recorrió Abraham de Ur a Canaán?"
  pt: "Que distância percorreu Abraão de Ur a Canaã?"
  de: "Wie weit zog Abraham von Ur nach Kanaan?"
  fr: "Quelle distance Abraham a-t-il parcourue d’Ur à Canaan ?"
  pl: "Jak daleką drogę przebył Abraham z Ur do Kanaanu?"
  it: "Quanta strada fece Abramo da Ur a Canaan?"
  nl: "Hoe ver reisde Abraham van Ur naar Kanaän?"
  cs: "Jak daleko putoval Abraham z Uru do Kanaánu?"
  sv: "Hur långt reste Abraham från Ur till Kanaan?"
  nb: "Hvor langt reiste Abraham fra Ur til Kanaan?"
  tl: "Gaano kalayo ang nilakbay ni Abraham mula sa Ur hanggang sa Canaan?"
  da: "Hvor langt rejste Abraham fra Ur til Kana'an?"
  sr: "Колико је далеко Аврам путовао од Ура до Ханана?"
answer:
  en:
    - "From Ur to Haran is about 925 km in a straight line and from Haran to Shechem, Abram's first stop in Canaan, about 620 km: some 1,545 km in all, about 52 days on foot at 30 km a day, and the real route along the Euphrates and down through Syria was longer."
    - 'Genesis tells the journey in two stages. Terah "went forth with them from Ur of the Chaldees, to go into the land of Canaan; and they came unto Haran, and dwelt there." After Terah''s death Abram, seventy-five years old, took Sarai and Lot "and the souls that they had gotten in Haran; and they went forth to go into the land of Canaan; and into the land of Canaan they came", passing through to the place of Shechem. The map''s Abraham tour shows the stages at the conventional year 1900 BC; the age of the patriarchs is disputed.'
    - "The figures assume that Ur is Tell el-Muqayyar in southern Iraq, the usual identification; if, as some scholars hold, Ur of the Chaldees lay in northern Mesopotamia near Haran, the first stage was far shorter. Haran is Harran in south-eastern Turkey, on the Balikh, where the routes from Mesopotamia to Syria crossed; Shechem is Tell Balatah by Nablus."
  ru:
    - "От Ура до Харрана около 925 км по прямой, а от Харрана до Сихема, первой остановки Аврама в Ханаане, около 620 км: всего примерно 1545 км — около 52 дней пешего пути по 30 км в день, а настоящий путь вдоль Евфрата и вниз через Сирию был длиннее."
    - "Книга Бытия рассказывает о пути в два этапа. Фарра «вышел с ними из Ура Халдейского, чтобы идти в землю Ханаанскую; но, дойдя до Харрана, они остановились там». После смерти Фарры Аврам, семидесяти пяти лет, взял Сару и Лота «и всех людей, которых они имели в Харране; и вышли, чтобы идти в землю Ханаанскую; и пришли в землю Ханаанскую», дойдя до места Сихема. Тур Авраама на карте показывает эти этапы в условном 1900 г. до н. э.; эпоха патриархов спорна."
    - "Расчёт исходит из того, что Ур — это Телль-эль-Мукайяр на юге Ирака, как обычно принимают; если же, как считают некоторые учёные, Ур Халдейский лежал на севере Месопотамии близ Харрана, первый этап был много короче. Харран — это Харран на юго-востоке Турции, на реке Балих, где скрещивались пути из Месопотамии в Сирию; Сихем — Телль-Балата у Наблуса."
  uk:
    - "Від Ура до Харана приблизно 925 км по прямій, а від Харана до Сихема, першої зупинки Аврама в Ханаані, приблизно 620 км: загалом близько 1545 км, приблизно 52 дні пішки за 30 км на день, а справжній шлях уздовж Євфрату й униз через Сирію був довшим."
    - "Книга Буття розповідає про подорож у двох етапах. Тарах «вивів їх із Ура Халдейського, щоб ійти в землю Канаанську, і прийшли в Гаран та й осїлись там». Після смерті Тараха Аврам, сімдесяти п'яти років, узяв Сару й Лота «і всякі душі, що здобули в Гаранї, та й зійшли геть, щоб ійти в землю Канаанську. І прийшли в Канаан землю», пройшовши до місця Сихем. Тур Авраама на мапі показує етапи за умовним 1900 р. до н. е.; час патріархів спірний."
    - "Ці цифри виходять із того, що Ур — це Тель-ель-Мукаяр на півдні Іраку, що є звичайним ототожненням; якщо, як вважають деякі вчені, Ур Халдейський лежав на півночі Месопотамії поблизу Харана, перший етап був значно коротшим. Харан — це Харран на південному сході Туреччини, на Баліху, де перетиналися шляхи з Месопотамії до Сирії; Сихем — це Тель-Балата біля Наблуса."
  es:
    - "De Ur a Harán hay unos 925 km en línea recta y de Harán a Siquem, la primera parada de Abram en Canaán, unos 620 km: unos 1545 km en total, unos 52 días a pie a 30 km diarios, y la ruta real a lo largo del Éufrates y bajando por Siria era más larga."
    - "Génesis cuenta el viaje en dos etapas. Tara «salió con ellos de Ur de los Caldeos, para ir á la tierra de Canaán: y vinieron hasta Harán, y asentaron allí». Tras la muerte de Tara, Abram, de setenta y cinco años, tomó a Sarai y a Lot «y las almas que habían adquirido en Harán, y salieron para ir á tierra de Canaán; y á tierra de Canaán llegaron», y pasó hasta el lugar de Siquem. El recorrido de Abraham en el mapa muestra las etapas en el año convencional 1900 a. C.; la época de los patriarcas es discutida."
    - "Las cifras suponen que Ur es Tell el-Muqayyar, en el sur de Irak, la identificación habitual; si, como sostienen algunos estudiosos, Ur de los Caldeos estaba en el norte de Mesopotamia, cerca de Harán, la primera etapa fue mucho más corta. Harán es Harrán, en el sureste de Turquía, sobre el Balikh, donde se cruzaban las rutas de Mesopotamia a Siria; Siquem es Tell Balatah, junto a Nablus."
  pt:
    - "De Ur a Harã são cerca de 925 km em linha reta e de Harã a Siquém, a primeira parada de Abrão em Canaã, cerca de 620 km: uns 1.545 km ao todo, cerca de 52 dias a pé a 30 km por dia, e a rota real ao longo do Eufrates e descendo pela Síria era mais longa."
    - "Gênesis conta a viagem em duas etapas. De Terá e dos seus diz: “Eles saíram de Ur dos Caldeus para ir à terra de Canaã. Chegaram a Harã e habitaram ali”. Depois da morte de Terá, Abrão, com setenta e cinco anos, levou Sarai e Ló, “e as pessoas que haviam adquirido em Harã, e partiram para ir à terra de Canaã. Eles entraram na terra de Canaã”, atravessando-a até o lugar de Siquém. O roteiro de Abraão no mapa mostra as etapas no ano convencional de 1900 a.C.; a época dos patriarcas é disputada."
    - "Os números supõem que Ur seja Tell el-Muqayyar, no sul do Iraque, a identificação usual; se, como alguns estudiosos sustentam, Ur dos Caldeus ficava no norte da Mesopotâmia, perto de Harã, a primeira etapa foi bem mais curta. Harã é Harran, no sudeste da Turquia, junto ao Balikh, onde se cruzavam as rotas da Mesopotâmia para a Síria; Siquém é Tell Balata, junto a Nablus."
  de:
    - "Von Ur nach Haran sind es etwa 925 km in der Luftlinie und von Haran nach Sichem, Abrams erster Station in Kanaan, etwa 620 km: zusammen rund 1545 km, bei 30 km am Tag etwa 52 Tage zu Fuß, und der wirkliche Weg am Euphrat entlang und durch Syrien hinab war länger."
    - "Die Genesis erzählt die Reise in zwei Abschnitten. Tarach „führte sie aus Ur in Chaldäa, daß er ins Land Kanaan zöge; und sie kamen gen Haran und wohnten daselbst“. Nach Tarachs Tod nahm der fünfundsiebzigjährige Abram Sarai und Lot „und die Seelen, die sie erworben hatten in Haran; und zogen aus, zu reisen in das Land Kanaan. Und als sie gekommen waren in dasselbe Land“, zog er durch bis an die Stätte Sichem. Die Abraham-Tour der Karte zeigt die Abschnitte im herkömmlichen Jahr 1900 v. Chr.; die Zeit der Erzväter ist umstritten."
    - "Die Zahlen setzen voraus, dass Ur Tell el-Muqayyar im Süden des Irak ist, die übliche Gleichsetzung; lag Ur in Chaldäa jedoch, wie manche Gelehrte meinen, in Nordmesopotamien nahe Haran, so war der erste Abschnitt weit kürzer. Haran ist Harran im Südosten der Türkei am Balich, wo sich die Wege von Mesopotamien nach Syrien kreuzten; Sichem ist Tell Balata bei Nablus."
  fr:
    - "D’Ur à Haran, il y a environ 925 km en ligne droite, et de Haran à Sichem, première étape d’Abram en Canaan, environ 620 km : quelque 1 545 km en tout, environ 52 jours de marche à 30 km par jour ; la route réelle, le long de l’Euphrate puis vers le sud par la Syrie, était plus longue."
    - "La Genèse raconte le voyage en deux étapes. Térach prit Abram, son fils, et les siens, et ils « sortirent ensemble d’Ur en Chaldée, pour aller au pays de Canaan. Ils vinrent jusqu’à Charan, et ils y habitèrent ». Après la mort de Térach, Abram, âgé de soixante-quinze ans, prit Saraï et Lot « avec tous les biens qu’ils possédaient et les serviteurs qu’ils avaient acquis à Charan. Ils partirent pour aller dans le pays de Canaan, et ils arrivèrent au pays de Canaan », parcourant le pays « jusqu’au lieu nommé Sichem ». Le parcours d’Abraham sur la carte montre les étapes à l’année conventionnelle 1900 av. J.-C. ; l’âge des patriarches est discuté."
    - "Ces chiffres supposent qu’Ur est Tell el-Muqayyar, dans le sud de l’Irak, identification habituelle ; si, comme le soutiennent certains savants, l’Ur de Chaldée se trouvait en Mésopotamie du nord, près de Haran, la première étape était bien plus courte. Haran est Harran, dans le sud-est de la Turquie, sur le Balikh, où se croisaient les routes de Mésopotamie vers la Syrie ; Sichem est Tell Balata, près de Naplouse."
  pl:
    - "Z Ur do Charanu jest około 925 km w linii prostej, a z Charanu do Sychem, pierwszego przystanku Abrama w Kanaanie, około 620 km: w sumie około 1545 km, czyli około 52 dni pieszo przy 30 km dziennie, a rzeczywista droga wzdłuż Eufratu i dalej przez Syrię była dłuższa."
    - "Księga Rodzaju opowiada o podróży w dwóch etapach. Terach z synem, wnukiem i synową „wyszli społu z Ur Chaldejskiego, aby szli do ziemi Chananejskiej; a przyszli aż do Haranu, i mieszkali tam”. Po śmierci Teracha Abram, mając siedemdziesiąt pięć lat, wziął Saraj i Lota „i dusze, których nabyli w Haranie, i wyszli, aby szli do ziemi Chananejskiej; i przyszli do ziemi Chananejskiej”, przechodząc aż do miejsca Sychem. Trasa Abrahama na mapie pokazuje etapy w umownym roku 1900 p.n.e.; czas patriarchów jest sporny."
    - "Liczby zakładają, że Ur to Tell el-Muqajjar w południowym Iraku, zwykłe utożsamienie; jeśli, jak twierdzą niektórzy uczeni, Ur Chaldejskie leżało w północnej Mezopotamii w pobliżu Charanu, pierwszy etap był znacznie krótszy. Charan to Harran w południowo-wschodniej Turcji, nad rzeką Balikh, gdzie krzyżowały się szlaki z Mezopotamii do Syrii; Sychem to Tell Balata koło Nablusu."
  it:
    - "Da Ur a Carran ci sono circa 925 km in linea retta e da Carran a Sichem, la prima tappa di Abramo in Canaan, circa 620 km: in tutto circa 1.545 km, circa 52 giorni a piedi a 30 km al giorno, e il percorso reale lungo l’Eufrate e poi giù attraverso la Siria era più lungo."
    - "La Genesi racconta il viaggio in due tappe. Tarach e i suoi «uscirono insieme da Ur de’ Caldei per andare nel paese di Canaan; e, giunti a Charan, dimorarono quivi». Dopo la morte di Tarach, Abramo, di settantacinque anni, prese Sarai e Lot «e le persone che aveano acquistate in Charan, e partirono per andarsene nel paese di Canaan; e giunsero nel paese di Canaan», attraversandolo fino al luogo di Sichem. Il percorso di Abramo sulla mappa mostra le tappe all’anno convenzionale 1900 a.C.; l’età dei patriarchi è discussa."
    - "Le cifre presuppongono che Ur sia Tell el-Muqayyar, nell’Iraq meridionale, l’identificazione abituale; se, come sostengono alcuni studiosi, Ur dei Caldei si trovava nella Mesopotamia settentrionale presso Carran, la prima tappa fu molto più breve. Carran è Harran, nella Turchia sud-orientale, sul Balikh, dove si incrociavano le vie dalla Mesopotamia alla Siria; Sichem è Tell Balatah presso Nablus."
  nl:
    - "Van Ur naar Haran is het hemelsbreed ongeveer 925 km en van Haran naar Sichem, Abrams eerste halte in Kanaän, ongeveer 620 km: samen zo’n 1.545 km, bij 30 km per dag ongeveer 52 dagen te voet, en de werkelijke route langs de Eufraat en door Syrië naar beneden was langer."
    - "Genesis vertelt de reis in twee etappes. Tarach en de zijnen “togen met hen uit Ur der Chaldeen, om te gaan naar het land Kanaän; en zij kwamen tot Haran, en woonden aldaar.” Na de dood van Tarach nam Abram, vijfenzeventig jaar oud, Sarai en Lot, “en de zielen, die zij verkregen hadden in Haran; en zij togen uit, om te gaan naar het land Kanaän, en zij kwamen in het land Kanaän”, en trok door tot de plaats Sichem. De tocht van Abraham op de kaart toont de etappes in het conventionele jaar 1900 v.Chr.; de tijd van de aartsvaders is omstreden."
    - "De cijfers gaan ervan uit dat Ur Tell el-Muqayyar in Zuid-Irak is, de gebruikelijke identificatie; als Ur der Chaldeeën, zoals sommige geleerden menen, in Noord-Mesopotamië bij Haran lag, was de eerste etappe veel korter. Haran is Harran in Zuidoost-Turkije, aan de Balikh, waar de routes van Mesopotamië naar Syrië elkaar kruisten; Sichem is Tell Balatah bij Nabloes."
  cs:
    - "Z Uru do Cháranu je to vzdušnou čarou asi 925 km a z Cháranu do Šekemu, první Abramovy zastávky v Kanaánu, asi 620 km: celkem zhruba 1 545 km, asi 52 dní pěšky při 30 km denně, a skutečná cesta podél Eufratu a dolů přes Sýrii byla delší."
    - "Genesis vypráví cestu ve dvou etapách. Terach s nimi odešel: „vyšli spolu z Ur Kaldejských, aby se brali do země Kananejské, a přišli až do Cháran, a bydlili tam.“ Po Terachově smrti vzal Abram, sedmdesát pět let starý, Sarai a Lota, „i duše, kterýchž dosáhli v Cháran. A vyšedše, brali se do země Kananejské, až i přišli do ní“, a prošel až k místu Šekem. Mapa Abrahamova putování ukazuje etapy ve smluvním roce 1900 př. n. l.; doba patriarchů je sporná."
    - "Údaje předpokládají, že Ur je Tell al-Muqajjar v jižním Iráku, což je obvyklé ztotožnění; pokud, jak někteří badatelé míní, ležel Ur Chaldejský v severní Mezopotámii poblíž Cháranu, byla první etapa mnohem kratší. Cháran je Harran v jihovýchodním Turecku, na řece Balíh, kde se křížily cesty z Mezopotámie do Sýrie; Šekem je Tell Balata u Náblusu."
  sv:
    - "Från Ur till Harran är det omkring 925 km fågelvägen och från Harran till Shekem, Abrams första anhalt i Kanaan, omkring 620 km: sammanlagt omkring 1 545 km, omkring 52 dagar till fots med 30 km om dagen, och den verkliga vägen längs Eufrat och ned genom Syrien var längre."
    - "1 Mosebok berättar resan i två etapper. Tera tog med sig sin familj, och de ”drogo tillsammans ut från det kaldeiska Ur på väg till Kanaans land; men när de kommo till Haran, bosatte de sig där”. Efter Teras död tog Abram, sjuttiofem år gammal, Sarai och Lot, ”och alla ägodelar som de hade förvärvat och tjänarna som de hade skaffat sig i Haran; och de drogo åstad på väg mot Kanaans land och kommo så till Kanaans land”, och drog fram till platsen vid Shekem. Kartans Abrahamstur visar etapperna vid det konventionella året 1900 f.Kr.; patriarkernas tid är omstridd."
    - "Siffrorna förutsätter att Ur är Tell el-Muqayyar i södra Irak, den vanliga identifieringen; om, som vissa forskare menar, det kaldeiska Ur låg i norra Mesopotamien nära Harran, var den första etappen mycket kortare. Harran ligger i sydöstra Turkiet, vid Balikh, där vägarna från Mesopotamien till Syrien korsade varandra; Shekem är Tell Balatah vid Nablus."
  nb:
    - "Fra Ur til Harran er det omtrent 925 km i luftlinje og fra Harran til Sikem, Abrams første stopp i Kanaan, omtrent 620 km: i alt omtrent 1 545 km, omtrent 52 dager til fots med 30 km om dagen, og den virkelige ruten langs Eufrat og ned gjennom Syria var lengre."
    - "1 Mosebok forteller reisen i to etapper. Tarah tok med seg Abram, Lot og Sarai, og «de drog ut sammen fra Ur i Kaldea for å reise til Kana'ans land, og de kom til Karan og bosatte sig der». Etter Tarahs død tok Abram, syttifem år gammel, Sarai og Lot med seg, «og de folk som de hadde fått i Karan; og de drog ut for å reise til Kana'ans land, og de kom til Kana'ans land», og drog gjennom landet til Sikem-bygden. Kartets Abraham-tur viser etappene ved det konvensjonelle året 1900 f.Kr.; patriarkenes tid er omstridt."
    - "Tallene forutsetter at Ur er Tell el-Muqayyar i Sør-Irak, den vanlige identifikasjonen; hvis Ur i Kaldea, som noen forskere mener, lå i det nordlige Mesopotamia nær Harran, var den første etappen langt kortere. Harran er dagens Harran i det sørøstlige Tyrkia, ved Balikh, der veiene fra Mesopotamia til Syria krysset hverandre; Sikem er Tell Balatah ved Nablus."
  tl:
    - "Mula sa Ur hanggang sa Haran ay mga 925 km sa tuwid na guhit, at mula sa Haran hanggang sa Sichem, ang unang hinto ni Abram sa Canaan, mga 620 km: humigit-kumulang 1,545 km sa kabuuan, mga 52 araw na lakad sa 30 km kada araw, at mas mahaba ang tunay na ruta sa tabi ng Eufrates at pababa sa Siria."
    - "Isinasalaysay ng Genesis ang paglalakbay sa dalawang yugto. Si Tara ay “samasamang nagsialis sa Ur ng mga Caldeo upang magsipasok sa lupain ng Canaan, at nagsidating sila sa Haran, at nagsitahan doon.” Pagkamatay ni Tara, isinama ni Abram, pitumpu't limang taong gulang, sina Sarai at Lot “at ang mga taong kanilang nakuha sa Haran; at nagsialis upang pasa lupain ng Canaan; at dumating sa lupain ng Canaan”, na dumaan hanggang sa lugar ng Sichem. Ipinakikita ng paglilibot kay Abraham sa mapa ang mga yugto sa karaniwang taon na 1900 BK; pinagtatalunan ang panahon ng mga patriyarka."
    - "Ipinapalagay ng mga bilang na ang Ur ay ang Tell el-Muqayyar sa timog Iraq, ang karaniwang pagkakakilanlan; kung, gaya ng iginigiit ng ilang iskolar, ang Ur ng mga Caldeo ay nasa hilagang Mesopotamia malapit sa Haran, mas maikli nang malaki ang unang yugto. Ang Haran ay ang Harran sa timog-silangang Turkiya, sa Balikh, kung saan nagkrus ang mga ruta mula sa Mesopotamia patungong Siria; ang Sichem ay ang Tell Balatah sa tabi ng Nablus."
  da:
    - "Fra Ur til Karan er der omkring 925 km i luftlinje og fra Karan til Sikem, Abrams første stop i Kana'an, omkring 620 km: i alt omkring 1.545 km, omkring 52 dage til fods med 30 km om dagen, og den virkelige rute langs Eufrat og ned gennem Syrien var længere."
    - "Første Mosebog fortæller rejsen i to etaper. Tera og de andre »droge ud med dem fra Ur i Kaldæa, at drage til det Land Kanaan, og de kom til Haran og boede der«. Efter Teras død tog Abram, femoghalvfjerds år gammel, Sarai og Lot med »de Folk, som de havde forskaffet sig i Haran, og de droge ud for at rejse til Kanaans Land, og de kom til Kanaans Land«, og drog videre til Sikems sted. Kortets Abraham-tur viser etaperne i det konventionelle år 1900 f.Kr.; patriarkernes tidsalder er omstridt."
    - "Tallene forudsætter, at Ur er Tell el-Muqayyar i det sydlige Irak, den sædvanlige identifikation; hvis Ur i Kaldæa, som nogle forskere mener, lå i det nordlige Mesopotamien nær Karan, var den første etape langt kortere. Karan er Harran i det sydøstlige Tyrkiet ved Balikh, hvor ruterne fra Mesopotamien til Syrien krydsedes; Sikem er Tell Balatah ved Nablus."
  sr:
    - "Од Ура до Харана има око 925 км ваздушном линијом, а од Харана до Сихема, Аврамовог првог застанка у Ханану, око 620 км: укупно око 1.545 км, око 52 дана пешке уз 30 км дневно, а стварни пут дуж Еуфрата и надоле кроз Сирију био је дужи."
    - "Постање причу о путовању казује у два дела. О Тари стоји: „пођоше заједно из Ура халдејског да иду у земљу хананску, и дођоше до Харана, и онде се настанише“. После Тарине смрти Аврам, стар седамдесет пет година, узео је Сару и Лота „са свим благом које беху стекли и с душама које беху добили у Харану; и пођоше у земљу хананску, и дођоше у њу“, па „пође Аврам ту земљу до места Сихема“. Аврамова рута на карти приказује етапе у условној 1900. п. н. е.; доба праотаца је спорно."
    - "Бројке полазе од тога да је Ур Тел ел Мукајар у јужном Ираку, што је уобичајено поистовећивање; ако је, како неки научници сматрају, Ур халдејски лежао у северној Месопотамији близу Харана, прва етапа била је далеко краћа. Харан је данашњи Харан у југоисточној Турској, на Балиху, где су се укрштали путеви из Месопотамије у Сирију; Сихем је Тел Балата код Наблуса."
