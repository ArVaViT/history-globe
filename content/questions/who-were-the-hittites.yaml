id: who-were-the-hittites
question:
  en: "Who were the Hittites?"
  ru: "Кто такие хеттеи?"
  uk: "Хто були хетти?"
  es: "¿Quiénes eran los hititas?"
  pt: "Quem eram os hititas?"
  de: "Wer waren die Hethiter?"
  fr: "Qui étaient les Hittites ?"
answer:
  en:
    - "Two different peoples carry the name. The Hittites of history were an Indo-European people of Anatolia whose empire, ruled from Hattusa near today's Boğazkale, lasted from about 1650 to 1180 BC; they sacked Babylon about 1595 BC, fought Ramesses II at Kadesh on the Orontes about 1274 and made peace with him by a treaty whose text survives in both Egyptian and Hittite copies. After the empire fell, small Neo-Hittite kingdoms kept the name at Carchemish, Hamath and other cities of northern Syria until Assyria swallowed them in the eighth century BC. The Hittites of Genesis are the “children of Heth”, a people living in the hills of Canaan around Hebron, where the map point stands, about 945 km south of Hattusa in a straight line; how the two are related is debated."
    - "Genesis counts Heth among the sons of Canaan. When Sarah died, Abraham “spake unto the sons of Heth, saying, I am a stranger and a sojourner with you: give me a possession of a buryingplace”, and bought the cave of Machpelah from “Ephron the Hittite” for four hundred shekels of silver, “in the audience of the children of Heth”. Esau's Hittite wives “were a grief of mind unto Isaac and to Rebekah”; the spies found that “the Hittites, and the Jebusites, and the Amorites, dwell in the mountains”. Two of David's warriors were Hittites, Ahimelech and Uriah, Bathsheba's husband, and Ezekiel tells Jerusalem: “thy father was an Amorite, and thy mother an Hittite”."
    - "Other passages look north: Joshua is promised “all the land of the Hittites” as far as the Euphrates, Solomon's merchants sold horses to “all the kings of the Hittites”, and the Syrians besieging Samaria fled at the thought that Israel had hired “the kings of the Hittites, and the kings of the Egyptians”. These are the Neo-Hittite kings of Syria; Assyrian scribes called the whole of Syria the land of Hatti."
    - "Until the nineteenth century the Hittites were known only from the Bible. Charles Texier came upon the ruins of Hattusa in 1834, Hugo Winckler's excavations from 1906 brought out a royal archive of thousands of clay tablets, and in 1915 Bedřich Hrozný read their language as Indo-European. The “children of Heth” at Hebron are explained in three ways: as a local Canaanite people that merely shares the name, since Ephron, Zohar, Beeri and Elon bear Semitic names; as settlers who came south from the Hittite world, perhaps after the fall of the empire; or as a later writer's use of the name for the old inhabitants of the land in general, as the Assyrians used “Hatti”. No Hittite text mentions a colony in Canaan, and nothing from Hebron settles it."
  ru:
    - "Это имя носят два разных народа. Хетты, известные истории, — индоевропейский народ Малой Азии, чья держава со столицей в Хаттусе, близ нынешнего Богазкале, просуществовала примерно с 1650 по 1180 г. до н. э.; около 1595 г. они разорили Вавилон, около 1274 г. сразились с Рамсесом II при Кадеше на Оронте и заключили с ним договор, текст которого дошёл до нас и в египетской, и в хеттской записи. После гибели державы малые позднехеттские царства сохраняли имя в Кархемисе, Емафе и других городах северной Сирии, пока в VIII веке до н. э. их не поглотила Ассирия. Хеттеи книги Бытия — народ «сынов Хетовых», живший в горах Ханаана вокруг Хеврона, где и стоит точка карты, примерно в 945 км к югу от Хаттусы по прямой; как связаны те и другие — предмет спора."
    - "Бытие числит Хета среди сыновей Ханаана. Когда умерла Сарра, Авраам «говорил сынам Хетовым, и сказал: я у вас пришлец и поселенец; дайте мне в собственность место для гроба между вами» и купил пещеру Махпелу у Ефрона Хеттеянина за четыреста сиклей серебра «вслух сынов Хетовых». Жёны Исава из хеттеянок «были в тягость Исааку и Ревекке»; соглядатаи донесли, что «Хеттеи, Евеи, Иевусеи и Аморреи живут на горе». Двое из воинов Давида были хеттеи — Ахимелех и Урия, муж Вирсавии, а Иезекииль говорит Иерусалиму: «отец твой Аморрей, и мать твоя Хеттеянка»."
    - "Другие места смотрят на север: Иисусу Навину сказано, что пределы Израиля охватят «всю землю Хеттеев» до Евфрата, купцы Соломона доставляли коней «царям Хеттейским», а сирийцы, осаждавшие Самарию, бежали при мысли, что Израиль нанял «царей Хеттейских и Египетских». Это позднехеттские цари Сирии; ассирийские писцы называли всю Сирию землёй Хатти."
    - "До XIX века хеттов знали только по Библии. Шарль Тексье наткнулся на развалины Хаттусы в 1834 году, раскопки Гуго Винклера с 1906 года извлекли царский архив из тысяч глиняных табличек, а в 1915 году Бедржих Грозный прочёл их язык как индоевропейский. «Сынов Хетовых» в Хевроне объясняют трояко: как местный ханаанский народ, лишь тёзку хеттов, — ведь Ефрон, Цохар, Беэр и Елон носят семитские имена; как переселенцев с хеттского севера, пришедших, быть может, после гибели державы; или как позднейшее имя для прежних жителей земли вообще, как у ассирийцев было «Хатти». Ни один хеттский текст не упоминает поселения в Ханаане, и находки из Хеврона вопроса не решают."
  uk:
    - "Цю назву носять два різні народи. Хетти історії — індоєвропейський народ Анатолії, чия імперія, яку правили з Хаттуси поблизу нинішнього Богазкале, тривала приблизно з 1650 до 1180 р. до н. е.; вони пограбували Вавилон близько 1595 р. до н. е., воювали з Рамсесом II при Кадеші на Оронті близько 1274 р. і уклали з ним мир договором, текст якого зберігся і в єгипетському, і в хетському примірниках. Після падіння імперії невеликі нео-хетські царства зберігали назву в Каркемиші, Хаматі та інших містах північної Сирії, доки Ассирія не поглинула їх у VIII ст. до н. е. Хетти Книги Буття — це «сини Хетові», народ, що жив у пагорбах Ханаану навколо Хеврона, де стоїть точка на мапі, приблизно за 945 км на південь від Хаттуси по прямій; як вони пов'язані — обговорюють."
    - "Книга Буття зараховує Хета до синів Ханаана. Коли померла Сарра, Авраам «рече синам Хетовим: Пересельник і чужениця я в вас! Дайте ж менї в наслїддє гробовище між вами» і купив печеру Махпела в Ефрона, названого в Біблії «Ефрон Хетїянин», за чотириста секлів срібла, «в слухи перед синами Хетовими». Про хетських дружин Ісава сказано: «були вони важкою печаллю Ізаакові й Ребецї»; розвідники виявили, що «Гетії, і Євузії, і Аморії живуть по горах». Двоє воїнів Давида були хеттеями — Ахімелех і Урія, чоловік Вірсавії, а Єзекиїл каже Єрусалимові: «батько твій — Аморій, а мати Гетійка»."
    - "Інші уривки дивляться на північ: Ісусові Навину обіцяно «уся земля Гетійська» аж до Євфрату, торговці Соломона продавали коней, «всї царі Гетїйські», а сирійці, що облягали Самарію, втекли від думки, що Ізраїль найняв «царів Гетїйських і царів Египецьких». Це нео-хетські царі Сирії; ассирійські писарі називали всю Сирію землею Хатті."
    - "До XIX ст. хеттів було відомо лише з Біблії. Шарль Тексьє натрапив на руїни Хаттуси 1834 р., розкопки Гуґо Вінклера від 1906 р. виявили царський архів із тисяч глиняних табличок, а 1915 р. Бедржих Грозний прочитав їхню мову як індоєвропейську. «Сини Хета» в Хевроні пояснюють трьома способами: як місцевий ханаанейський народ, що лише має ту саму назву, бо Ефрон, Цохар, Беері й Елон носять семітські імена; як поселенців, що прийшли на південь із хетського світу, можливо, після падіння імперії; або як вживання назви пізнішим письменником для давніх жителів краю загалом, як ассирійці вживали «Хатті». Жоден хетський текст не згадує колонії в Ханаані, і ніщо з Хеврона цього не вирішує."
  es:
    - "Dos pueblos distintos llevan el nombre. Los hititas de la historia fueron un pueblo indoeuropeo de Anatolia cuyo imperio, gobernado desde Hattusa, cerca de la actual Boğazkale, duró de hacia 1650 a 1180 a. C.; saquearon Babilonia hacia 1595 a. C., combatieron a Ramsés II en Cades, junto al Orontes, hacia 1274 y firmaron con él la paz mediante un tratado cuyo texto se conserva en copias egipcias e hititas. Tras la caída del imperio, pequeños reinos neohititas conservaron el nombre en Carquemis, Hamat y otras ciudades del norte de Siria hasta que Asiria los absorbió en el siglo VIII a. C. Los hititas del Génesis son los «hijos de Heth», un pueblo que vivía en las colinas de Canaán en torno a Hebrón, donde está el punto del mapa, a unos 945 km al sur de Hattusa en línea recta; cómo se relacionan los dos se discute."
    - "El Génesis cuenta a Het entre los hijos de Canaán. Cuando murió Sara, Abraham «habló á los hijos de Heth, diciendo: Peregrino y advenedizo soy entre vosotros; dadme heredad de sepultura con vosotros», y compró la cueva de Macpela a «Ephrón Hetheo» por cuatrocientos siclos de plata, «oyéndolo los hijos de Heth». Las mujeres hititas de Esaú «fueron amargura de espíritu á Isaac y á Rebeca»; los espías hallaron que «el Hetheo, y el Jebuseo, y el Amorrheo, habitan en el monte». Dos guerreros de David eran hititas, Ahimelec y Urías, marido de Betsabé, y Ezequiel dice a Jerusalén: «tu padre Amorrheo, y tu madre Hethea»."
    - "Otros pasajes miran al norte: a Josué se le promete «toda la tierra de los Hetheos» hasta el Éufrates, los mercaderes de Salomón vendían caballos a «todos los reyes de los Hetheos», y los sirios que sitiaban Samaria huyeron ante la idea de que Israel había pagado «á los reyes de los Hetheos, y á los reyes de los Egipcios». Son los reyes neohititas de Siria; los escribas asirios llamaban a toda Siria la tierra de Hati."
    - "Hasta el siglo XIX los hititas solo se conocían por la Biblia. Charles Texier dio con las ruinas de Hattusa en 1834, las excavaciones de Hugo Winckler desde 1906 sacaron a la luz un archivo real de miles de tablillas de arcilla, y en 1915 Bedřich Hrozný leyó su lengua como indoeuropea. Los «hijos de Heth» de Hebrón se explican de tres maneras: como un pueblo cananeo local que solo comparte el nombre, pues Efrón, Zohar, Beeri y Elón llevan nombres semíticos; como colonos llegados al sur desde el mundo hitita, quizá tras la caída del imperio; o como el uso que hace un escritor posterior del nombre para los antiguos habitantes de la tierra en general, como los asirios usaban «Hati». Ningún texto hitita menciona una colonia en Canaán, y nada procedente de Hebrón lo zanja."
  pt:
    - "Dois povos diferentes levam o nome. Os hititas da história eram um povo indo-europeu da Anatólia cujo império, governado de Hattusa, perto da atual Boğazkale, durou de cerca de 1650 a 1180 a.C.; saquearam Babilônia por volta de 1595 a.C., lutaram contra Ramsés II em Cades, no Orontes, por volta de 1274 e fizeram a paz com ele por um tratado cujo texto sobrevive em cópias egípcias e hititas. Depois da queda do império, pequenos reinos neo-hititas conservaram o nome em Carquemis, Hamate e outras cidades do norte da Síria, até que a Assíria os engoliu no século VIII a.C. Os hititas do Gênesis são os “filhos de Hete”, um povo que vivia nas colinas de Canaã em torno de Hebrom, onde está o ponto do mapa, a cerca de 945 km ao sul de Hattusa em linha reta; como os dois se relacionam é debatido."
    - "O Gênesis conta Hete entre os filhos de Canaã. Quando Sara morreu, Abraão “falou aos filhos de Hete, dizendo: Sou estrangeiro e peregrino vivendo entre vocês. Deem-me a propriedade de um lugar de sepultamento entre vocês”, e comprou a caverna de Macpela de “Efrom, o heteu” por quatrocentos siclos de prata, “aos ouvidos dos filhos de Hete”. As mulheres heteias de Esaú “trouxeram amargura de espírito a Isaque e a Rebeca”; os espias constataram que “O heteu, o jebuseu e o amorreu habitam na região montanhosa”. Dois guerreiros de Davi eram hititas, Aimeleque e Urias, marido de Bate-Seba, e Ezequiel diz a Jerusalém: “O seu pai era amorreu, e a sua mãe, heteia”."
    - "Outras passagens olham para o norte: a Josué é prometida “toda a terra dos heteus” até o Eufrates, os mercadores de Salomão vendiam cavalos a “todos os reis dos hititas”, e os sírios que sitiavam Samaria fugiram à ideia de que Israel contratara “os reis dos hititas e os reis dos egípcios”. São os reis neo-hititas da Síria; os escribas assírios chamavam toda a Síria de terra de Hati."
    - "Até o século XIX, os hititas eram conhecidos apenas pela Bíblia. Charles Texier deparou com as ruínas de Hattusa em 1834, as escavações de Hugo Winckler a partir de 1906 revelaram um arquivo real de milhares de tabuinhas de argila, e em 1915 Bedřich Hrozný leu sua língua como indo-europeia. Os “filhos de Hete” em Hebrom são explicados de três modos: como um povo cananeu local que apenas compartilha o nome, já que Efrom, Zoar, Beeri e Elom têm nomes semíticos; como colonos vindos do sul do mundo hitita, talvez depois da queda do império; ou como o uso, por um escritor posterior, do nome para os antigos habitantes da terra em geral, como os assírios usavam “Hati”. Nenhum texto hitita menciona uma colônia em Canaã, e nada de Hebrom resolve a questão."
  de:
    - "Zwei verschiedene Völker tragen den Namen. Die Hethiter der Geschichte waren ein indoeuropäisches Volk Anatoliens, dessen Reich, von Hattusa beim heutigen Boğazkale aus regiert, von etwa 1650 bis 1180 v. Chr. bestand; sie plünderten um 1595 v. Chr. Babylon, kämpften um 1274 bei Kadesch am Orontes gegen Ramses II. und schlossen mit ihm einen Frieden durch einen Vertrag, dessen Text in ägyptischer wie hethitischer Fassung erhalten ist. Nach dem Fall des Reiches bewahrten kleine neuhethitische Königreiche den Namen in Karkemisch, Hamat und anderen Städten Nordsyriens, bis Assyrien sie im 8. Jahrhundert v. Chr. verschlang. Die Hethiter der Genesis sind die „Kinder Heth“, ein Volk, das in den Bergen Kanaans um Hebron lebte, wo der Kartenpunkt steht, in der Luftlinie etwa 945 km südlich von Hattusa; wie beide zusammenhängen, ist umstritten."
    - "Die Genesis zählt Heth zu den Söhnen Kanaans. Als Sara starb, stand Abraham auf und „redete mit den Kindern Heth und sprach: Ich bin ein Fremder und Einwohner bei euch; gebt mir ein Erbbegräbnis bei euch“, und kaufte die Höhle Machpela von Efron, dem Hethiter, für vierhundert Silberschekel, „daß zuhörten die Kinder Heth“. Esaus hethitische Frauen „machten beide Isaak und Rebekka eitel Herzeleid“; die Kundschafter fanden: „die Hethiter und Jebusiter und Amoriter wohnen auf dem Gebirge“. Zwei von Davids Kriegern waren Hethiter, Ahimelech und Uria, der Mann der Batseba, und Hesekiel sagt Jerusalem: „dein Vater aus den Amoritern und deine Mutter aus den Hethitern“."
    - "Andere Stellen blicken nach Norden: Josua wird „das ganze Land der Hethiter“ bis zum Euphrat verheißen, Salomos Händler verkauften Pferde „allen Königen der Hethiter“, und die Syrer, die Samaria belagerten, flohen bei dem Gedanken, Israel habe „die Könige der Hethiter und die Könige der Ägypter“ gedungen. Das sind die neuhethitischen Könige Syriens; assyrische Schreiber nannten ganz Syrien das Land Hatti."
    - "Bis zum 19. Jahrhundert kannte man die Hethiter nur aus der Bibel. Charles Texier stieß 1834 auf die Ruinen von Hattusa, Hugo Wincklers Grabungen ab 1906 brachten ein Königsarchiv mit Tausenden Tontafeln zutage, und 1915 las Bedřich Hrozný ihre Sprache als indoeuropäisch. Die „Kinder Heth“ in Hebron werden auf drei Weisen erklärt: als ein örtliches kanaanäisches Volk, das nur den Namen teilt, da Efron, Zohar, Beeri und Elon semitische Namen tragen; als Siedler, die aus der hethitischen Welt nach Süden kamen, vielleicht nach dem Fall des Reiches; oder als Gebrauch des Namens durch einen späteren Verfasser für die alten Bewohner des Landes überhaupt, wie die Assyrer „Hatti“ gebrauchten. Kein hethitischer Text erwähnt eine Kolonie in Kanaan, und nichts aus Hebron entscheidet es."
  fr:
    - "Deux peuples différents portent le nom. Les Hittites de l’histoire étaient un peuple indo-européen d’Anatolie dont l’empire, gouverné depuis Hattousa, près de l’actuelle Boğazkale, dura d’environ 1650 à 1180 av. J.-C. ; ils mirent Babylone à sac vers 1595 av. J.-C., combattirent Ramsès II à Qadesh sur l’Oronte vers 1274 et firent la paix avec lui par un traité dont le texte subsiste en copies égyptienne et hittite. Après la chute de l’empire, de petits royaumes néo-hittites gardèrent le nom à Carkemisch, à Hamath et dans d’autres villes du nord de la Syrie jusqu’à ce que l’Assyrie les engloutisse au VIIIe siècle av. J.-C. Les Héthiens de la Genèse sont les « fils de Heth », un peuple vivant dans les collines de Canaan autour d’Hébron, où se trouve le point de la carte, à environ 945 km au sud de Hattousa à vol d’oiseau ; le rapport entre les deux est débattu."
    - "La Genèse compte Heth parmi les fils de Canaan. À la mort de Sara, Abraham « parla ainsi aux fils de Heth : Je suis étranger et habitant parmi vous ; donnez-moi la possession d’un sépulcre chez vous », et acheta la caverne de Macpéla à « Éphron, le Héthien » pour quatre cents sicles d’argent, « en présence des fils de Heth ». Les femmes héthiennes d’Ésaü « furent un sujet d’amertume pour le cœur d’Isaac et de Rebecca » ; les espions constatèrent que « les Héthiens, les Jébusiens et les Amoréens habitent la montagne ». Deux des guerriers de David étaient Héthiens, Achimélec et Urie, mari de Bath-Schéba, et Ézéchiel dit à Jérusalem : « ton père était un Amoréen, et ta mère une Héthienne »."
    - "D’autres passages regardent vers le nord : à Josué est promis « tout le pays des Héthiens » jusqu’à l’Euphrate, les marchands de Salomon vendaient des chevaux à « tous les rois des Héthiens », et les Syriens qui assiégeaient Samarie s’enfuirent à l’idée qu’Israël avait pris à sa solde « les rois des Héthiens et les rois des Égyptiens ». Ce sont les rois néo-hittites de Syrie ; les scribes assyriens appelaient toute la Syrie le pays de Hatti."
    - "Jusqu’au XIXe siècle, les Hittites ne furent connus que par la Bible. Charles Texier découvrit les ruines de Hattousa en 1834, les fouilles de Hugo Winckler à partir de 1906 firent sortir des archives royales de milliers de tablettes d’argile, et en 1915 Bedřich Hrozný lut leur langue comme indo-européenne. Les « fils de Heth » d’Hébron s’expliquent de trois manières : comme un peuple cananéen local qui ne fait que partager le nom, puisque Éphron, Tsochar, Beéri et Élon portent des noms sémitiques ; comme des colons venus vers le sud depuis le monde hittite, peut-être après la chute de l’empire ; ou comme l’emploi du nom par un auteur ultérieur pour les anciens habitants du pays en général, comme les Assyriens employaient « Hatti ». Aucun texte hittite ne mentionne une colonie en Canaan, et rien d’Hébron ne tranche."
