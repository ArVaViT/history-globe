id: where-was-lachish
question:
  en: "Where was Lachish, the city Sennacherib besieged?"
  ru: "Где находился Лахис, осаждённый Сеннахиримом?"
  uk: "Де був Лахіш, місто, яке облягав Сінаххеріб?"
  es: "¿Dónde estaba Laquis, la ciudad que asedió Senaquerib?"
  pt: "Onde ficava Laquis, a cidade que Senaqueribe sitiou?"
  de: "Wo lag Lachisch, die Stadt, die Sanherib belagerte?"
  fr: "Où se trouvait Lakis, la ville que Sanchérib assiégea ?"
answer:
  en:
    - "Lachish is Tell ed-Duweir, now Tel Lachish, a large mound in the Shephelah, the low hills between the Judaean highlands and the coastal plain, about 43 km south-west of Jerusalem in a straight line; the map point stands on it. It guarded the road from the coast into the hills of Judah and was the strongest city of the kingdom after Jerusalem. Earlier scholars sought Lachish elsewhere, but since the excavations of the 1930s Tell ed-Duweir is generally accepted."
    - "In 701 BC Sennacherib of Assyria besieged Lachish while his officers went up against Jerusalem. Hezekiah “sent to the king of Assyria to Lachish, saying, I have offended; return from me: that which thou puttest on me will I bear”, and the king of Assyria sent his commanders “from Lachish to king Hezekiah with a great host against Jerusalem”. Sennacherib lined a hall of his palace at Nineveh with reliefs of the siege, now in the British Museum, with a caption that the booty of Lachish passed before him. At the site excavators found the burned city of that year and the Assyrian siege ramp against its south-western corner, the only Assyrian ramp yet found."
    - "A century later the Babylonians came. Jeremiah writes that the army fought “against Lachish, and against Azekah: for these defenced cities remained of the cities of Judah”. Among the ink-written potsherds found in the gate in 1935, the Lachish letters, one officer reports that they are watching for the signals of Lachish because they cannot see Azekah, 17 km to the north-north-east. The city was burned in 587 or 586 BC. Joshua had taken Lachish centuries before; the Canaanite city of the Amarna letters was destroyed in the twelfth century BC, and how that fall relates to Joshua's conquest is disputed."
  ru:
    - "Лахис — это Телль-эд-Дувейр, ныне Тель-Лахиш, большой холм в Шефеле, низких холмах между Иудейскими горами и прибрежной равниной, примерно в 43 км к юго-западу от Иерусалима по прямой; точка карты стоит на нём. Он сторожил дорогу от побережья в горы Иудеи и был самым сильным городом царства после Иерусалима. Прежние исследователи искали Лахис в других местах, но после раскопок 1930-х годов Телль-эд-Дувейр принят почти всеми."
    - "В 701 г. до н. э. ассирийский царь Сеннахирим осадил Лахис, а его военачальники пошли на Иерусалим. Езекия «послал… к царю Ассирийскому в Лахис сказать: виновен я; отойди от меня; что наложишь на меня, я внесу», а царь Ассирийский послал своих военачальников «из Лахиса к царю Езекии с большим войском в Иерусалим». Сеннахирим украсил один из залов своего дворца в Ниневии рельефами осады — теперь они в Британском музее — с надписью о том, что добыча Лахиса проходила перед ним. На месте археологи нашли сожжённый в тот год город и ассирийскую осадную насыпь у его юго-западного угла — единственную найденную до сих пор."
    - "Через сто с лишним лет пришли вавилоняне. Иеремия пишет, что войско воевало «против Лахиса и Азеки; ибо из городов Иудейских сии только оставались, как города укрепленные». Среди черепков с надписями чернилами, найденных в воротах в 1935 году, — лахисских писем — есть донесение военачальника: они следят за сигналами Лахиса, потому что не видят Азеки, лежащей в 17 км к северо-северо-востоку. Город сгорел в 587 или 586 г. до н. э. Иисус Навин взял Лахис за много веков до того; ханаанский город амарнских писем был разрушен в XII веке до н. э., и как это разрушение соотносится с завоеванием Иисуса Навина, спорно."
  uk:
    - "Лахіш — це Телль-ед-Дувейр, нині Тель-Лахіш, великий пагорб у Шефелі, низьких пагорбах між юдейським нагір'ям і прибережною рівниною, приблизно за 43 км на південний захід від Єрусалима по прямій; точка на мапі стоїть на ньому. Він охороняв дорогу з узбережжя в пагорби Юди й був найсильнішим містом царства після Єрусалима. Раніші вчені шукали Лахіш деінде, але від розкопок 1930-х рр. Телль-ед-Дувейр загальновизнаний."
    - "701 р. до н. е. Сінаххеріб Ассирійський облягав Лахіш, поки його вельможі рушили на Єрусалим. Єзекія «послав ... до царя Ассирийського в Лахис, сказати: Я провинився. Йди назад від мене, а що на мене наложиш, нести му», і цар Ассирії послав своїх воєначальників «з Лахиса з великою військовою потугою до короля Езекії в Ерусалим». Сінаххеріб прикрасив зал свого палацу в Ніневії рельєфами облоги, нині в Британському музеї, з написом, що здобич Лахіша проходила перед ним. На місці розкопники знайшли спалене місто того року й ассирійський облоговий насип біля його південно-західного рогу — єдиний ассирійський насип, знайдений досі."
    - "Через століття прийшли вавилоняни. Єремія пише, що військо воювало «проти Лахису, та Азеки; одні бо сї зоставались ізміж городів Юдиних, як городи утверджені». Серед написаних чорнилом черепків, знайдених у брамі 1935 р., — Лахішських листів, — один вельможа повідомляє, що вони стежать за сигналами Лахіша, бо не бачать Азеки, за 17 км на північ-північний схід. Місто було спалене 587 або 586 р. до н. е. Ісус Навин узяв Лахіш за століття до того; ханаанейське місто з листів з Амарни було зруйноване в XII ст. до н. е., і як це падіння співвідноситься із завоюванням Ісуса Навина — спірно."
  es:
    - "Laquis es Tell ed-Duweir, hoy Tel Laquis, un gran montículo en la Sefelá, las colinas bajas entre las tierras altas de Judea y la llanura costera, a unos 43 km al suroeste de Jerusalén en línea recta; el punto del mapa está sobre él. Guardaba el camino de la costa a las colinas de Judá y era la ciudad más fuerte del reino después de Jerusalén. Los estudiosos antiguos buscaron Laquis en otro lugar, pero desde las excavaciones de la década de 1930 se acepta en general Tell ed-Duweir."
    - "En 701 a. C. Senaquerib de Asiria asedió Laquis mientras sus oficiales subían contra Jerusalén. Ezequías «envió á decir al rey de Asiria en Lachîs: Yo he pecado: vuélvete de mí, y llevaré todo lo que me impusieres», y «el rey de Asiria envió al rey Ezechîas, desde Lachîs contra Jerusalem, á Thartán y á Rabsaris y á Rabsaces, con un grande ejército». Senaquerib revistió una sala de su palacio de Nínive con relieves del asedio, hoy en el Museo Británico, con una leyenda que dice que el botín de Laquis desfiló ante él. En el yacimiento, los excavadores hallaron la ciudad incendiada de ese año y la rampa de asedio asiria contra su esquina suroeste, la única rampa asiria hallada hasta hoy."
    - "Un siglo después llegaron los babilonios. Jeremías escribe que el ejército peleaba «contra Lachîs, y contra Azeca; porque de las ciudades fuertes de Judá éstas habían quedado». Entre los tiestos escritos con tinta hallados en la puerta en 1935, las cartas de Laquis, un oficial informa de que vigilan las señales de Laquis porque no pueden ver Azeca, a 17 km al nornoreste. La ciudad fue incendiada en 587 o 586 a. C. Josué había tomado Laquis siglos antes; la ciudad cananea de las cartas de Amarna fue destruida en el siglo XII a. C., y se discute cómo se relaciona esa caída con la conquista de Josué."
  pt:
    - "Laquis é Tell ed-Duweir, hoje Tel Lachish, um grande monte na Sefelá, as colinas baixas entre as terras altas da Judeia e a planície costeira, a cerca de 43 km a sudoeste de Jerusalém em linha reta; o ponto do mapa fica sobre ele. Guardava a estrada da costa para as colinas de Judá e era a cidade mais forte do reino depois de Jerusalém. Estudiosos mais antigos procuraram Laquis em outro lugar, mas desde as escavações da década de 1930 Tell ed-Duweir é geralmente aceita."
    - "Em 701 a.C., Senaqueribe da Assíria sitiou Laquis enquanto seus oficiais subiam contra Jerusalém. Ezequias “enviou mensageiros ao rei da Assíria, em Laquis, dizendo: Eu te ofendi. Retira-te de mim. O que tu me impuseres, eu suportarei”, e o rei da Assíria enviou seus comandantes “de Laquis ao rei Ezequias, com um grande exército para Jerusalém”. Senaqueribe revestiu uma sala do seu palácio em Nínive com relevos do cerco, hoje no Museu Britânico, com uma legenda dizendo que o despojo de Laquis passou diante dele. No sítio, os escavadores encontraram a cidade queimada daquele ano e a rampa de cerco assíria contra o seu canto sudoeste, a única rampa assíria encontrada até hoje."
    - "Um século depois vieram os babilônios. Jeremias escreve que o exército lutava “contra Laquis e contra Azeca; pois somente estas restaram das cidades de Judá como cidades fortificadas”. Entre os cacos de cerâmica escritos a tinta encontrados na porta em 1935, as cartas de Laquis, um oficial informa que estão vigiando os sinais de Laquis porque não conseguem ver Azeca, a 17 km a nor-nordeste. A cidade foi queimada em 587 ou 586 a.C. Josué havia tomado Laquis séculos antes; a cidade cananeia das cartas de Amarna foi destruída no século XII a.C., e como essa queda se relaciona com a conquista de Josué é disputado."
  de:
    - "Lachisch ist Tell ed-Duweir, heute Tel Lachisch, ein großer Hügel in der Schefela, den niedrigen Hügeln zwischen dem judäischen Bergland und der Küstenebene, in der Luftlinie etwa 43 km südwestlich von Jerusalem; der Kartenpunkt steht darauf. Es bewachte die Straße von der Küste in die Berge Judas und war nach Jerusalem die stärkste Stadt des Königreichs. Frühere Forscher suchten Lachisch anderswo, doch seit den Grabungen der 1930er-Jahre ist Tell ed-Duweir allgemein anerkannt."
    - "Im Jahr 701 v. Chr. belagerte Sanherib von Assyrien Lachisch, während seine Offiziere gegen Jerusalem zogen. „Da sandte Hiskia, der König Juda's, zum König von Assyrien gen Lachis und ließ ihm sagen: Ich habe mich versündigt. Kehre um von mir; was du mir auflegst, will ich tragen“, und der König von Assyrien sandte seine Heerführer „von Lachis zum König Hiskia mit großer Macht gen Jerusalem“. Sanherib ließ einen Saal seines Palastes in Ninive mit Reliefs der Belagerung auskleiden, heute im Britischen Museum, mit einer Beischrift, dass die Beute von Lachisch an ihm vorüberzog. Am Ort fanden die Ausgräber die in jenem Jahr verbrannte Stadt und die assyrische Belagerungsrampe an ihrer Südwestecke, die einzige bisher gefundene assyrische Rampe."
    - "Ein Jahrhundert später kamen die Babylonier. Jeremia schreibt, das Heer habe gekämpft „wider Lachis und Aseka; denn diese waren noch übriggeblieben von den festen Städten Juda's“. Unter den mit Tinte beschriebenen Tonscherben, die 1935 im Tor gefunden wurden, den Lachisch-Briefen, meldet ein Offizier, man halte nach den Signalen von Lachisch Ausschau, weil man Aseka, 17 km nordnordöstlich, nicht sehen könne. Die Stadt wurde 587 oder 586 v. Chr. verbrannt. Josua hatte Lachisch Jahrhunderte zuvor eingenommen; die kanaanäische Stadt der Amarna-Briefe wurde im 12. Jahrhundert v. Chr. zerstört, und wie dieser Fall mit Josuas Eroberung zusammenhängt, ist umstritten."
  fr:
    - "Lakis est Tell ed-Duweir, aujourd’hui Tel Lakish, un grand tertre de la Shéphéla, les basses collines entre les hautes terres de Juda et la plaine côtière, à environ 43 km au sud-ouest de Jérusalem à vol d’oiseau ; le point de la carte s’y trouve. Elle gardait la route qui mène de la côte vers les collines de Juda et était la plus forte ville du royaume après Jérusalem. Des spécialistes plus anciens cherchaient Lakis ailleurs, mais depuis les fouilles des années 1930, Tell ed-Duweir est généralement admis."
    - "En 701 av. J.-C., Sanchérib d’Assyrie assiégea Lakis tandis que ses officiers montaient contre Jérusalem. Ézéchias « envoya dire au roi d’Assyrie à Lakis : J’ai commis une faute ! Éloigne-toi de moi. Ce que tu m’imposeras, je le supporterai », et le roi d’Assyrie envoya « de Lakis à Jérusalem, vers le roi Ézéchias, Tharthan, Rab-Saris et Rabschaké avec une puissante armée ». Sanchérib fit revêtir une salle de son palais de Ninive de reliefs du siège, aujourd’hui au British Museum, avec une légende disant que le butin de Lakis défilait devant lui. Sur le site, les fouilleurs ont trouvé la ville incendiée cette année-là et la rampe d’assaut assyrienne contre son angle sud-ouest, la seule rampe assyrienne retrouvée jusqu’ici."
    - "Un siècle plus tard vinrent les Babyloniens. Jérémie écrit que l’armée combattait « contre Lakis et Azéka, car c’étaient des villes fortes qui restaient parmi les villes de Juda ». Parmi les tessons écrits à l’encre trouvés à la porte en 1935, les lettres de Lakis, un officier rapporte qu’on guette les signaux de Lakis parce qu’on ne voit plus Azéka, à 17 km au nord-nord-est. La ville fut incendiée en 587 ou 586 av. J.-C. Josué avait pris Lakis des siècles auparavant ; la ville cananéenne des lettres d’Amarna fut détruite au XIIe siècle av. J.-C., et le rapport de cette chute avec la conquête de Josué est discuté."
