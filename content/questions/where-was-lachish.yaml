id: where-was-lachish
question:
  en: "Where was Lachish, the city Sennacherib besieged?"
  ru: "Где находился Лахис, осаждённый Сеннахиримом?"
  uk: "Де був Лахіш, місто, яке облягав Сінаххеріб?"
  es: "¿Dónde estaba Laquis, la ciudad que asedió Senaquerib?"
  pt: "Onde ficava Laquis, a cidade que Senaqueribe sitiou?"
  de: "Wo lag Lachisch, die Stadt, die Sanherib belagerte?"
  fr: "Où se trouvait Lakis, la ville que Sanchérib assiégea ?"
  pl: "Gdzie leżało Lakisz, miasto oblężone przez Sennacheryba?"
  it: "Dov’era Lachis, la città assediata da Sennacherib?"
  cs: "Kde ležel Lachiš, město, které oblehl Senacherib?"
  nl: "Waar lag Lachis, de stad die Sanherib belegerde?"
  sv: "Var låg Lakish, staden som Sanherib belägrade?"
  nb: "Hvor lå Lakisj, byen Sankerib beleiret?"
  tl: "Nasaan ang Lachis, ang lungsod na kinubkob ni Sennacherib?"
  da: "Hvor lå Lakisj, byen Sankerib belejrede?"
  sr: "Где је био Лахис, град који је опсео Сенахирим?"
  hu: "Hol volt Lákis, a város, amelyet Szanhérib ostromolt?"
  fi: "Missä oli Lakis, kaupunki, jota Sanherib piiritti?"
  vi: "La-ki, thành mà San-chê-ríp vây hãm, ở đâu?"
  ro: "Unde se afla Lachiș, cetatea asediată de Senaherib?"
  bg: "Къде се е намирал Лахис, градът, който Сенахирим обсади?"
answer:
  en:
    - "Lachish is Tell ed-Duweir, now Tel Lachish, a large mound in the Shephelah, the low hills between the Judaean highlands and the coastal plain, about 43 km south-west of Jerusalem in a straight line; the map point stands on it. It guarded the road from the coast into the hills of Judah and was the strongest city of the kingdom after Jerusalem. Earlier scholars sought Lachish elsewhere, but since the excavations of the 1930s Tell ed-Duweir is generally accepted."
    - "In 701 BC Sennacherib of Assyria besieged Lachish while his officers went up against Jerusalem. Hezekiah “sent to the king of Assyria to Lachish, saying, I have offended; return from me: that which thou puttest on me will I bear”, and the king of Assyria sent his commanders “from Lachish to king Hezekiah with a great host against Jerusalem”. Sennacherib lined a hall of his palace at Nineveh with reliefs of the siege, now in the British Museum, with a caption that the booty of Lachish passed before him. At the site excavators found the burned city of that year and the Assyrian siege ramp against its south-western corner, the only Assyrian ramp yet found."
    - "A century later the Babylonians came. Jeremiah writes that the army fought “against Lachish, and against Azekah: for these defenced cities remained of the cities of Judah”. Among the ink-written potsherds found in the gate in 1935, the Lachish letters, one officer reports that they are watching for the signals of Lachish because they cannot see Azekah, 17 km to the north-north-east. The city was burned in 587 or 586 BC. Joshua had taken Lachish centuries before; the Canaanite city of the Amarna letters was destroyed in the twelfth century BC, and how that fall relates to Joshua's conquest is disputed."
  ru:
    - "Лахис — это Телль-эд-Дувейр, ныне Тель-Лахиш, большой холм в Шефеле, низких холмах между Иудейскими горами и прибрежной равниной, примерно в 43 км к юго-западу от Иерусалима по прямой; точка карты стоит на нём. Он сторожил дорогу от побережья в горы Иудеи и был самым сильным городом царства после Иерусалима. Прежние исследователи искали Лахис в других местах, но после раскопок 1930-х годов Телль-эд-Дувейр принят почти всеми."
    - "В 701 г. до н. э. ассирийский царь Сеннахирим осадил Лахис, а его военачальники пошли на Иерусалим. Езекия «послал… к царю Ассирийскому в Лахис сказать: виновен я; отойди от меня; что наложишь на меня, я внесу», а царь Ассирийский послал своих военачальников «из Лахиса к царю Езекии с большим войском в Иерусалим». Сеннахирим украсил один из залов своего дворца в Ниневии рельефами осады — теперь они в Британском музее — с надписью о том, что добыча Лахиса проходила перед ним. На месте археологи нашли сожжённый в тот год город и ассирийскую осадную насыпь у его юго-западного угла — единственную найденную до сих пор."
    - "Через сто с лишним лет пришли вавилоняне. Иеремия пишет, что войско воевало «против Лахиса и Азеки; ибо из городов Иудейских сии только оставались, как города укрепленные». Среди черепков с надписями чернилами, найденных в воротах в 1935 году, — лахисских писем — есть донесение военачальника: они следят за сигналами Лахиса, потому что не видят Азеки, лежащей в 17 км к северо-северо-востоку. Город сгорел в 587 или 586 г. до н. э. Иисус Навин взял Лахис за много веков до того; ханаанский город амарнских писем был разрушен в XII веке до н. э., и как это разрушение соотносится с завоеванием Иисуса Навина, спорно."
  uk:
    - "Лахіш — це Телль-ед-Дувейр, нині Тель-Лахіш, великий пагорб у Шефелі, низьких пагорбах між юдейським нагір'ям і прибережною рівниною, приблизно за 43 км на південний захід від Єрусалима по прямій; точка на мапі стоїть на ньому. Він охороняв дорогу з узбережжя в пагорби Юди й був найсильнішим містом царства після Єрусалима. Раніші вчені шукали Лахіш деінде, але від розкопок 1930-х рр. Телль-ед-Дувейр загальновизнаний."
    - "701 р. до н. е. Сінаххеріб Ассирійський облягав Лахіш, поки його вельможі рушили на Єрусалим. Єзекія «послав ... до царя Ассирийського в Лахис, сказати: Я провинився. Йди назад від мене, а що на мене наложиш, нести му», і цар Ассирії послав своїх воєначальників «з Лахиса з великою військовою потугою до короля Езекії в Ерусалим». Сінаххеріб прикрасив зал свого палацу в Ніневії рельєфами облоги, нині в Британському музеї, з написом, що здобич Лахіша проходила перед ним. На місці розкопники знайшли спалене місто того року й ассирійський облоговий насип біля його південно-західного рогу — єдиний ассирійський насип, знайдений досі."
    - "Через століття прийшли вавилоняни. Єремія пише, що військо воювало «проти Лахису, та Азеки; одні бо сї зоставались ізміж городів Юдиних, як городи утверджені». Серед написаних чорнилом черепків, знайдених у брамі 1935 р., — Лахішських листів, — один вельможа повідомляє, що вони стежать за сигналами Лахіша, бо не бачать Азеки, за 17 км на північ-північний схід. Місто було спалене 587 або 586 р. до н. е. Ісус Навин узяв Лахіш за століття до того; ханаанейське місто з листів з Амарни було зруйноване в XII ст. до н. е., і як це падіння співвідноситься із завоюванням Ісуса Навина — спірно."
  es:
    - "Laquis es Tell ed-Duweir, hoy Tel Laquis, un gran montículo en la Sefelá, las colinas bajas entre las tierras altas de Judea y la llanura costera, a unos 43 km al suroeste de Jerusalén en línea recta; el punto del mapa está sobre él. Guardaba el camino de la costa a las colinas de Judá y era la ciudad más fuerte del reino después de Jerusalén. Los estudiosos antiguos buscaron Laquis en otro lugar, pero desde las excavaciones de la década de 1930 se acepta en general Tell ed-Duweir."
    - "En 701 a. C. Senaquerib de Asiria asedió Laquis mientras sus oficiales subían contra Jerusalén. Ezequías «envió á decir al rey de Asiria en Lachîs: Yo he pecado: vuélvete de mí, y llevaré todo lo que me impusieres», y «el rey de Asiria envió al rey Ezechîas, desde Lachîs contra Jerusalem, á Thartán y á Rabsaris y á Rabsaces, con un grande ejército». Senaquerib revistió una sala de su palacio de Nínive con relieves del asedio, hoy en el Museo Británico, con una leyenda que dice que el botín de Laquis desfiló ante él. En el yacimiento, los excavadores hallaron la ciudad incendiada de ese año y la rampa de asedio asiria contra su esquina suroeste, la única rampa asiria hallada hasta hoy."
    - "Un siglo después llegaron los babilonios. Jeremías escribe que el ejército peleaba «contra Lachîs, y contra Azeca; porque de las ciudades fuertes de Judá éstas habían quedado». Entre los tiestos escritos con tinta hallados en la puerta en 1935, las cartas de Laquis, un oficial informa de que vigilan las señales de Laquis porque no pueden ver Azeca, a 17 km al nornoreste. La ciudad fue incendiada en 587 o 586 a. C. Josué había tomado Laquis siglos antes; la ciudad cananea de las cartas de Amarna fue destruida en el siglo XII a. C., y se discute cómo se relaciona esa caída con la conquista de Josué."
  pt:
    - "Laquis é Tell ed-Duweir, hoje Tel Lachish, um grande monte na Sefelá, as colinas baixas entre as terras altas da Judeia e a planície costeira, a cerca de 43 km a sudoeste de Jerusalém em linha reta; o ponto do mapa fica sobre ele. Guardava a estrada da costa para as colinas de Judá e era a cidade mais forte do reino depois de Jerusalém. Estudiosos mais antigos procuraram Laquis em outro lugar, mas desde as escavações da década de 1930 Tell ed-Duweir é geralmente aceita."
    - "Em 701 a.C., Senaqueribe da Assíria sitiou Laquis enquanto seus oficiais subiam contra Jerusalém. Ezequias “enviou mensageiros ao rei da Assíria, em Laquis, dizendo: Eu te ofendi. Retira-te de mim. O que tu me impuseres, eu suportarei”, e o rei da Assíria enviou seus comandantes “de Laquis ao rei Ezequias, com um grande exército para Jerusalém”. Senaqueribe revestiu uma sala do seu palácio em Nínive com relevos do cerco, hoje no Museu Britânico, com uma legenda dizendo que o despojo de Laquis passou diante dele. No sítio, os escavadores encontraram a cidade queimada daquele ano e a rampa de cerco assíria contra o seu canto sudoeste, a única rampa assíria encontrada até hoje."
    - "Um século depois vieram os babilônios. Jeremias escreve que o exército lutava “contra Laquis e contra Azeca; pois somente estas restaram das cidades de Judá como cidades fortificadas”. Entre os cacos de cerâmica escritos a tinta encontrados na porta em 1935, as cartas de Laquis, um oficial informa que estão vigiando os sinais de Laquis porque não conseguem ver Azeca, a 17 km a nor-nordeste. A cidade foi queimada em 587 ou 586 a.C. Josué havia tomado Laquis séculos antes; a cidade cananeia das cartas de Amarna foi destruída no século XII a.C., e como essa queda se relaciona com a conquista de Josué é disputado."
  de:
    - "Lachisch ist Tell ed-Duweir, heute Tel Lachisch, ein großer Hügel in der Schefela, den niedrigen Hügeln zwischen dem judäischen Bergland und der Küstenebene, in der Luftlinie etwa 43 km südwestlich von Jerusalem; der Kartenpunkt steht darauf. Es bewachte die Straße von der Küste in die Berge Judas und war nach Jerusalem die stärkste Stadt des Königreichs. Frühere Forscher suchten Lachisch anderswo, doch seit den Grabungen der 1930er-Jahre ist Tell ed-Duweir allgemein anerkannt."
    - "Im Jahr 701 v. Chr. belagerte Sanherib von Assyrien Lachisch, während seine Offiziere gegen Jerusalem zogen. „Da sandte Hiskia, der König Juda's, zum König von Assyrien gen Lachis und ließ ihm sagen: Ich habe mich versündigt. Kehre um von mir; was du mir auflegst, will ich tragen“, und der König von Assyrien sandte seine Heerführer „von Lachis zum König Hiskia mit großer Macht gen Jerusalem“. Sanherib ließ einen Saal seines Palastes in Ninive mit Reliefs der Belagerung auskleiden, heute im Britischen Museum, mit einer Beischrift, dass die Beute von Lachisch an ihm vorüberzog. Am Ort fanden die Ausgräber die in jenem Jahr verbrannte Stadt und die assyrische Belagerungsrampe an ihrer Südwestecke, die einzige bisher gefundene assyrische Rampe."
    - "Ein Jahrhundert später kamen die Babylonier. Jeremia schreibt, das Heer habe gekämpft „wider Lachis und Aseka; denn diese waren noch übriggeblieben von den festen Städten Juda's“. Unter den mit Tinte beschriebenen Tonscherben, die 1935 im Tor gefunden wurden, den Lachisch-Briefen, meldet ein Offizier, man halte nach den Signalen von Lachisch Ausschau, weil man Aseka, 17 km nordnordöstlich, nicht sehen könne. Die Stadt wurde 587 oder 586 v. Chr. verbrannt. Josua hatte Lachisch Jahrhunderte zuvor eingenommen; die kanaanäische Stadt der Amarna-Briefe wurde im 12. Jahrhundert v. Chr. zerstört, und wie dieser Fall mit Josuas Eroberung zusammenhängt, ist umstritten."
  fr:
    - "Lakis est Tell ed-Duweir, aujourd’hui Tel Lakish, un grand tertre de la Shéphéla, les basses collines entre les hautes terres de Juda et la plaine côtière, à environ 43 km au sud-ouest de Jérusalem à vol d’oiseau ; le point de la carte s’y trouve. Elle gardait la route qui mène de la côte vers les collines de Juda et était la plus forte ville du royaume après Jérusalem. Des spécialistes plus anciens cherchaient Lakis ailleurs, mais depuis les fouilles des années 1930, Tell ed-Duweir est généralement admis."
    - "En 701 av. J.-C., Sanchérib d’Assyrie assiégea Lakis tandis que ses officiers montaient contre Jérusalem. Ézéchias « envoya dire au roi d’Assyrie à Lakis : J’ai commis une faute ! Éloigne-toi de moi. Ce que tu m’imposeras, je le supporterai », et le roi d’Assyrie envoya « de Lakis à Jérusalem, vers le roi Ézéchias, Tharthan, Rab-Saris et Rabschaké avec une puissante armée ». Sanchérib fit revêtir une salle de son palais de Ninive de reliefs du siège, aujourd’hui au British Museum, avec une légende disant que le butin de Lakis défilait devant lui. Sur le site, les fouilleurs ont trouvé la ville incendiée cette année-là et la rampe d’assaut assyrienne contre son angle sud-ouest, la seule rampe assyrienne retrouvée jusqu’ici."
    - "Un siècle plus tard vinrent les Babyloniens. Jérémie écrit que l’armée combattait « contre Lakis et Azéka, car c’étaient des villes fortes qui restaient parmi les villes de Juda ». Parmi les tessons écrits à l’encre trouvés à la porte en 1935, les lettres de Lakis, un officier rapporte qu’on guette les signaux de Lakis parce qu’on ne voit plus Azéka, à 17 km au nord-nord-est. La ville fut incendiée en 587 ou 586 av. J.-C. Josué avait pris Lakis des siècles auparavant ; la ville cananéenne des lettres d’Amarna fut détruite au XIIe siècle av. J.-C., et le rapport de cette chute avec la conquête de Josué est discuté."
  pl:
    - "Lakisz to Tell ed-Duweir, dziś Tel Lakisz, duże wzgórze w Szefeli, niskich wzgórzach między judzkim górskim pasmem a równiną nadmorską, około 43 km na południowy zachód od Jerozolimy w linii prostej; stoi na nim punkt na mapie. Strzegło drogi z wybrzeża w góry Judy i było najpotężniejszym miastem królestwa po Jerozolimie. Dawniejsi uczeni szukali Lakisz gdzie indziej, ale od wykopalisk w latach 30. XX wieku Tell ed-Duweir jest powszechnie przyjmowane."
    - "W 701 p.n.e. Sennacheryb asyryjski oblegał Lakisz, a jego dowódcy ruszyli na Jerozolimę. Ezechiasz „posłał… do króla Assyryjskiego, do Lachys, mówiąc: Zgrzeszyłem; odciągnij odemnie, cokolwiek na mię włożysz, poniosę”, a król Asyrii wysłał swych dowódców „z Lachys do króla Ezechyjasza z wielkiem wojskiem do Jeruzalemu”. Sennacheryb wyłożył salę swego pałacu w Niniwie reliefami przedstawiającymi oblężenie, dziś w Muzeum Brytyjskim, z napisem, że łupy z Lakisz przeszły przed nim. Na stanowisku archeolodzy znaleźli spalone miasto z tego roku oraz asyryjską rampę oblężniczą przy jego południowo-zachodnim narożniku, jedyną dotąd odkrytą rampę asyryjską."
    - "Wiek później przyszli Babilończycy. Jeremiasz pisze, że wojsko walczyło „przeciwko Lachys, i przeciw Asekowi; albowiem te były pozostały z miast Judzkich miasta obronne”. Wśród skorup zapisanych atramentem, znalezionych w bramie w 1935, listów z Lakisz, jeden oficer donosi, że wypatrują sygnałów z Lakisz, ponieważ nie widzą Azeki, oddalonej o 17 km na północ-północny wschód. Miasto spalono w 587 lub 586 p.n.e. Jozue zdobył Lakisz wieki wcześniej; kananejskie miasto z listów z Amarny zostało zniszczone w XII wieku p.n.e., a jak ten upadek ma się do podboju Jozuego, jest sporne."
  it:
    - "Lachis è Tell ed-Duweir, oggi Tel Lachish, un grande tell nella Sefela, le basse colline tra l’altopiano di Giudea e la pianura costiera, a circa 43 km a sud-ovest di Gerusalemme in linea d’aria; il punto della mappa si trova su di esso. Controllava la strada dalla costa alle colline di Giuda ed era la città più forte del regno dopo Gerusalemme. Studiosi più antichi cercarono Lachis altrove, ma dagli scavi degli anni 1930 Tell ed-Duweir è generalmente accettata."
    - "Nel 701 a.C. Sennacherib d’Assiria assediò Lachis mentre i suoi ufficiali salivano contro Gerusalemme. Ezechia «mandò a dire al re d’Assiria a Lakis: Ho mancato; ritirati da me, ed io mi sottometterò a tutto quello che m’imporrai», e il re d’Assiria «mandò ad Ezechia da Lakis a Gerusalemme, Tartan, Rabsaris e Rabshaké con un grande esercito». Sennacherib rivestì una sala del suo palazzo a Ninive con rilievi dell’assedio, oggi al British Museum, con un’iscrizione che dice che il bottino di Lachis sfilava davanti a lui. Nel sito gli archeologi trovarono la città bruciata di quell’anno e la rampa d’assedio assira contro il suo angolo sud-occidentale, la sola rampa assira finora rinvenuta."
    - "Un secolo dopo vennero i Babilonesi. Geremia scrive che l’esercito combatteva «contro Lachis e Azeka, ch’eran tutto quello che rimaneva, in fatto di città fortificate, fra le città di Giuda». Tra i cocci scritti a inchiostro trovati nella porta nel 1935, le lettere di Lachis, un ufficiale riferisce che stanno osservando i segnali di Lachis perché non riescono a vedere Azeka, a 17 km a nord-nord-est. La città fu bruciata nel 587 o 586 a.C. Giosuè aveva preso Lachis secoli prima; la città cananea delle lettere di Amarna fu distrutta nel XII secolo a.C., e il rapporto di quella caduta con la conquista di Giosuè è discusso."
  cs:
    - "Lachiš je Tell ed-Duweir, dnes Tel Lachiš, rozlehlý pahorek v Šefele, nízkých pahorcích mezi judskou vysočinou a pobřežní rovinou, vzdušnou čarou asi 43 km jihozápadně od Jeruzaléma; stojí na něm bod na mapě. Střežil cestu od pobřeží do judských hor a byl po Jeruzalému nejsilnějším městem království. Dřívější badatelé hledali Lachiš jinde, ale od vykopávek ve 30. letech se Tell ed-Duweir všeobecně přijímá."
    - "Roku 701 př. n. l. oblehl Senacherib Asyrský Lachiš, zatímco jeho velitelé táhli proti Jeruzalému. Chizkijáš „poslal… k králi Assyrskému do Lachis, řka: Zhřešilť jsem, odtáhni ode mne; cožkoli na mne vzložíš, ponesu“ a král Asýrie poslal své velitele „z Lachis k králi Ezechiášovi s vojskem velikým k Jeruzalému“. Senacherib vyzdobil síň svého paláce v Ninive reliéfy obléhání, nyní v Britském muzeu, s nápisem, že kořist z Lachiše procházela před ním. Na místě vykopávači nalezli vypálené město onoho roku a asyrský obléhací val u jeho jihozápadního rohu, jediný dosud nalezený asyrský val."
    - "O století později přišli Babyloňané. Jeremjáš píše, že vojsko bojovalo „proti Lachis a proti Azeku; nebo ta byla pozůstala z měst Judských města hrazená“. V jednom z inkoustem psaných střepů nalezených v bráně roku 1935, v lachišských listech, hlásí důstojník, že pozorují signály z Lachiše, protože nevidí Azeku, 17 km na severoseverovýchod. Město bylo vypáleno roku 587 nebo 586 př. n. l. Jozue dobyl Lachiš o staletí dříve; kananejské město z amarnských listů bylo zničeno ve 12. století př. n. l. a jak ten pád souvisí s Jozuovým dobytím, je sporné."
  nl:
    - "Lachis is Tell ed-Duweir, nu Tel Lachish, een grote heuvel in de Sefela, de lage heuvels tussen het hoogland van Judea en de kustvlakte, hemelsbreed ongeveer 43 km ten zuidwesten van Jeruzalem; het punt op de kaart staat erop. Het bewaakte de weg van de kust naar het bergland van Juda en was na Jeruzalem de sterkste stad van het koninkrijk. Eerdere geleerden zochten Lachis elders, maar sinds de opgravingen van de jaren dertig wordt Tell ed-Duweir algemeen aanvaard."
    - "In 701 v.Chr. belegerde Sanherib van Assyrië Lachis terwijl zijn bevelhebbers tegen Jeruzalem optrokken. Daarop “zond Hizkia, de koning van Juda, tot den koning van Assyrië, naar Lachis, zeggende: Ik heb gezondigd, keer af van mij, wat gij mij opleggen zult, zal ik dragen”, en de koning van Assyrië zond zijn bevelhebbers “van Lachis tot den koning Hizkia, met een zwaar heir naar Jeruzalem”. Sanherib liet een zaal van zijn paleis in Nineve bekleden met reliëfs van het beleg, nu in het British Museum, met een bijschrift dat de buit van Lachis voor hem langs trok. Bij de vindplaats vonden de opgravers de verbrande stad van dat jaar en de Assyrische belegeringshelling tegen de zuidwestelijke hoek, de enige Assyrische helling die tot nu toe is gevonden."
    - "Een eeuw later kwamen de Babyloniërs. Jeremia schrijft dat het leger streed “tegen Lachis en tegen Azeka; want deze, zijnde vaste steden, waren overgebleven onder de steden van Juda”. Onder de met inkt beschreven potscherven die in 1935 in de poort werden gevonden, de brieven van Lachis, meldt een officier dat zij uitkijken naar de signalen van Lachis omdat zij Azeka, 17 km naar het noordnoordoosten, niet kunnen zien. De stad werd in 587 of 586 v.Chr. verbrand. Jozua had Lachis eeuwen eerder ingenomen; de Kanaänitische stad van de Amarnabrieven werd in de twaalfde eeuw v.Chr. verwoest, en hoe die val zich verhoudt tot de verovering door Jozua is omstreden."
  sv:
    - "Lakish är Tell ed-Duweir, i dag Tel Lakish, en stor kulle i Shefela, de låga kullarna mellan det judeiska höglandet och kustslätten, omkring 43 km sydväst om Jerusalem i fågelvägen; kartpunkten står på den. Den vaktade vägen från kusten upp i Judas berg och var rikets starkaste stad efter Jerusalem. Tidigare forskare sökte Lakish på annat håll, men sedan utgrävningarna på 1930-talet godtas Tell ed-Duweir allmänt."
    - "År 701 f.Kr. belägrade Sanherib av Assyrien Lakish medan hans befälhavare drog upp mot Jerusalem. Hiskia sände ”till Assyriens konung i Lakis och lät säga: ’Jag har försyndat mig; vänd om och lämna mig i fred. Vad du lägger på mig vill jag bära’”, och Assyriens konung sände sina befälhavare ”från Lakis åstad … med en stor här mot konung Hiskia i Jerusalem”. Sanherib lät pryda en sal i sitt palats i Nineve med reliefer av belägringen, nu i British Museum, med en text om att Lakishs byte drogs förbi honom. På platsen fann utgrävarna den brända staden från det året och den assyriska belägringsrampen mot dess sydvästra hörn, den enda assyriska ramp som hittills har hittats."
    - "Ett sekel senare kom babylonierna. Jeremia skriver att armén angrep det som ännu återstod av Judas städer, ”nämligen Lakis och Aseka; ty dessa voro de enda av Juda städer, som ännu voro kvar och voro befästa”. Bland de med bläck skrivna lerskärvorna som hittades i porten 1935, Lakishbreven, rapporterar en officer att man spanar efter Lakishs signaler eftersom man inte ser Aseka, 17 km åt nord-nordost. Staden brändes 587 eller 586 f.Kr. Josua hade intagit Lakish århundraden tidigare; den kananeiska staden i Amarnabreven förstördes på 1100-talet f.Kr., och hur det fallet förhåller sig till Josuas erövring är omstritt."
  nb:
    - "Lakisj er Tell ed-Duweir, nå Tel Lakisj, en stor haug i Sjefela, de lave åsene mellom Judas høyland og kystsletten, omtrent 43 km sørvest for Jerusalem i luftlinje; kartpunktet står på den. Den voktet veien fra kysten opp i Judas åser og var rikets sterkeste by etter Jerusalem. Tidligere forskere søkte Lakisj andre steder, men siden utgravningene på 1930-tallet er Tell ed-Duweir alminnelig akseptert."
    - "I 701 f.Kr. beleiret Sankerib av Assyria Lakisj mens hans offiserer dro opp mot Jerusalem. Hiskia sendte bud «til den assyriske konge i Lakis og lot si: Jeg har syndet; vend tilbake fra mig! Hvad du legger på mig, vil jeg bære», og Assyrias konge sendte sine øverste befalsmenn «med en stor hær fra Lakis til kong Esekias i Jerusalem». Sankerib kledde en sal i sitt palass i Ninive med relieffer av beleiringen, nå i British Museum, med en tekst om at byttet fra Lakisj ble ført forbi ham. På stedet fant utgraverne den brente byen fra det året og den assyriske beleiringsrampen mot dens sørvestre hjørne, den eneste assyriske rampen som hittil er funnet."
    - "Et århundre senere kom babylonerne. Jeremia skriver at hæren stred mot «Lakis og Aseka; for det var de faste byer som ennu var igjen av Judas byer». Blant de blekkskrevne potteskårene som ble funnet i porten i 1935, Lakisj-brevene, melder en offiser at de holder utkikk etter signalene fra Lakisj fordi de ikke kan se Aseka, 17 km mot nord-nordøst. Byen ble brent i 587 eller 586 f.Kr. Josva hadde inntatt Lakisj århundrer før; den kanaaneiske byen i Amarna-brevene ble ødelagt på 1100-tallet f.Kr., og hvordan dette fallet forholder seg til Josvas erobring, er omstridt."
  tl:
    - "Ang Lachis ay ang Tell ed-Duweir, ngayon ay Tel Lachish, isang malaking burol sa Sephela, ang mabababang burol sa pagitan ng kabundukan ng Judea at ng kapatagang baybayin, mga 43 km sa timog-kanluran ng Jerusalem sa tuwid na guhit; nakatayo roon ang punto sa mapa. Binantayan nito ang daan mula sa baybayin patungo sa mga burol ng Juda at ito ang pinakamatibay na lungsod ng kaharian pagkatapos ng Jerusalem. Hinanap ng mga naunang iskolar ang Lachis sa ibang lugar, ngunit mula sa mga paghuhukay noong dekada 1930 ay karaniwang tinatanggap ang Tell ed-Duweir."
    - "Noong 701 BK, kinubkob ni Sennacherib ng Asiria ang Lachis habang umahon ang kaniyang mga opisyal laban sa Jerusalem. Si Ezechias ay “nagsugo sa hari sa Asiria sa Lachis, na nagsasabi, Ako'y nagkasala; talikdan mo ako: ang iyong ipabayad sa akin ay aking babayaran”, at isinugo ng hari ng Asiria ang kaniyang mga pinuno “sa haring kay Ezechias na mula sa Lachis na may malaking hukbo sa Jerusalem”. Nilagyan ni Sennacherib ang isang bulwagan ng kaniyang palasyo sa Ninive ng mga relyebe ng pagkubkob, na nasa British Museum ngayon, na may paliwanag na dumaan sa harap niya ang samsam ng Lachis. Sa pook ay natagpuan ng mga naghukay ang nasunog na lungsod ng taong iyon at ang rampa ng pagkubkob ng mga Asirio sa timog-kanlurang sulok nito, ang tanging rampang Asirio na natagpuan pa."
    - "Makalipas ang isang siglo ay dumating ang mga Babilonio. Isinulat ni Jeremias na nakipaglaban ang hukbo “laban sa Lechis at laban sa Azeca; sapagka't ang mga ito lamang ang nalalabi na mga bayan ng Juda na mga bayang nakukutaan”. Sa mga piraso ng palayok na may sulat-tinta na natagpuan sa pintuang-lungsod noong 1935, ang mga liham ng Lachis, iniuulat ng isang opisyal na binabantayan nila ang mga hudyat ng Lachis dahil hindi nila makita ang Azeca, 17 km sa hilaga-hilagang-silangan. Nasunog ang lungsod noong 587 o 586 BK. Nasakop na ni Josue ang Lachis ilang siglo bago nito; ang lungsod ng mga Cananeo sa mga liham ng Amarna ay nawasak noong ika-12 siglo BK, at pinagtatalunan kung paano iniuugnay ang pagbagsak na iyon sa pananakop ni Josue."
  da:
    - "Lakisj er Tell ed-Duweir, nu Tel Lakisj, en stor tell i Sjefela, de lave højdedrag mellem det judæiske højland og kystsletten, ca. 43 km sydvest for Jerusalem i fugleflugt; kortets punkt står på den. Den bevogtede vejen fra kysten op i Judas bjerge og var rigets stærkeste by efter Jerusalem. Tidligere forskere søgte Lakisj andetsteds, men siden udgravningerne i 1930’erne er Tell ed-Duweir almindeligt accepteret."
    - "I 701 f.Kr. belejrede Sankerib af Assyrien Lakisj, mens hans officerer drog op mod Jerusalem. Hizkija sendte »til Kongen af Assyrien, til Lakis og lod sige: Jeg har syndet, vend tilbage fra mig, jeg vil bære, hvad du lægger paa mig«, og Assyriens konge sendte sine øverstbefalende »fra Lakis til Kong Ezekias med en svar Hær til Jerusalem«. Sankerib prydede en sal i sit palads i Nineve med relieffer af belejringen, nu i British Museum, med en billedtekst om, at Lakisj’ bytte blev ført forbi ham. På stedet fandt udgraverne den brændte by fra det år og den assyriske belejringsrampe mod dens sydvestlige hjørne, den eneste assyriske rampe, der endnu er fundet."
    - "Et århundrede senere kom babylonierne. Jeremias skriver, at hæren stred »imod Lakis og imod Aseka; thi disse vare blevne tilovers iblandt Judas Stæder som faste Stæder«. Blandt de blækskrevne potteskår, der blev fundet i porten i 1935, Lakisj-brevene, melder en officer, at man holder udkig efter Lakisj’ signaler, fordi man ikke kan se Azeka, 17 km mod nord-nordøst. Byen blev brændt i 587 eller 586 f.Kr. Josva havde indtaget Lakisj århundreder tidligere; den kana’anæiske by fra Amarna-brevene blev ødelagt i 1100-tallet f.Kr., og hvordan dette fald forholder sig til Josvas erobring, er omstridt."
  sr:
    - "Лахис је Тел ед-Дувејр, данас Тел Лахиш, велика хумка у Сефели, ниским брдима између јудејског горја и приобалне равнице, око 43 км југозападно од Јерусалима ваздушном линијом; тачка на карти стоји на њој. Чувао је пут од обале у јудејска брда и био је најјачи град краљевства после Јерусалима. Ранији научници тражили су Лахис другде, али од ископавања 1930-их Тел ед-Дувејр се опште прихвата."
    - "Године 701. п. н. е. Сенахирим Асирски опсео је Лахис док су се његови заповедници упутили на Јерусалим. Језекија „посла у Лахис к цару асирском и поручи му: Згрешио сам; врати се од мене, шта год наметнеш на ме носићу“, а цар асирски послао је своје заповеднике „из Лахиса к цару Језекији у Јерусалим с великом војском“. Сенахирим је једну дворану своје палате у Ниниви обложио рељефима опсаде, који су сада у Британском музеју, са натписом да је плен из Лахиса прошао пред њим. На налазишту су ископавачи пронашли спаљени град из те године и асирски опсадни насип уз његов југозападни угао, једини асирски насип који је до сада нађен."
    - "Век касније дошли су Вавилонци. Јеремија пише да је војска ударала „на Лахис и Азику, јер ти беху остали тврди градови између градова Јудиних“. Међу црепићима исписаним мастилом пронађеним у капији 1935, Лахишким писмима, један официр јавља да мотре на сигнале из Лахиса јер не виде Азику, удаљену 17 км северо-североисточно. Град је спаљен 587. или 586. п. н. е. Исус Навин је заузео Лахис вековима раније; ханански град из Амарнских писама разорен је у дванаестом веку п. н. е., а како се тај пад односи према освајању Исуса Навина, спорно је."
  hu:
    - "Lákis Tell ed-Duweir, a mai Tel Lachish, nagy halom a Sefélában, a júdeai felföld és a tengerparti síkság közötti alacsony dombvidéken, Jeruzsálemtől légvonalban mintegy 43 km-re délnyugatra; a térkép pontja rajta áll. A tengerpartról a júdai hegyekbe vezető utat őrizte, és Jeruzsálem után a királyság legerősebb városa volt. A korábbi tudósok máshol keresték Lákist, de az 1930-as évek ásatásai óta Tell ed-Duweirt általában elfogadják."
    - "Kr. e. 701-ben az asszíriai Szanhérib ostrom alá vette Lákist, míg tisztjei Jeruzsálem ellen vonultak. Ekkor „elküldött Ezékiás, Júda királya Assiria királyához Lákisba, ezt izenvén: Vétkeztem, térj el én rólam; a mit rám vetsz, elviselem!”, az asszír király pedig vezéreit „Lákisból Ezékiás királyhoz igen nagy haddal Jeruzsálembe” küldte. Szanhérib ninivei palotájának egyik termét az ostrom domborműveivel burkoltatta, melyek ma a Brit Múzeumban vannak, felirattal, hogy Lákis zsákmánya elvonult előtte. A lelőhelyen az ásatók megtalálták az abban az évben felégetett várost és délnyugati sarkánál az asszír ostromrámpát, az egyetlent, amelyet eddig találtak."
    - "Egy évszázaddal később a babiloniak jöttek. Jeremiás szerint a babiloni király serege Júda megmaradt városait vívta, „tudniillik Lákist és Azekát, mert a Júda városai közül csak ezek maradtak vala meg, mint erősített városok”. A kapuban 1935-ben talált tintával írt cserépdarabok, a lákisi levelek egyikében egy tiszt jelenti, hogy Lákis jelzéseit figyelik, mert Azekát nem látják, mely 17 km-re van észak-északkeletre. A várost Kr. e. 587 vagy 586-ban felégették. Józsué évszázadokkal korábban elfoglalta Lákist; az amarnai levelek kánaáni városát a Kr. e. 12. században pusztították el, és hogy ez a bukás hogyan viszonyul Józsué hódításához, vitatott."
  fi:
    - "Lakis on Tell ed-Duweir, nykyisin Tel Lachish, suuri kumpu Sefelassa, Juudean ylänköjen ja rannikkotasangon välisillä matalilla kukkuloilla, linnuntietä noin 43 km Jerusalemista lounaaseen; kartan piste on sen päällä. Se vartioi rannikolta Juudan kukkuloille johtavaa tietä ja oli valtakunnan vahvin kaupunki Jerusalemin jälkeen. Aiemmat tutkijat etsivät Lakista muualta, mutta 1930-luvun kaivausten jälkeen Tell ed-Duweir on yleisesti hyväksytty."
    - "Vuonna 701 eaa. Assyrian Sanherib piiritti Lakista, kun hänen upseerinsa nousivat Jerusalemia vastaan. Hiskia ”lähetti Assurin kuninkaalle Laakiiseen sanan: ’Minä olen rikkonut, käänny pois minun kimpustani. Minä kannan, mitä panet kannettavakseni’”, ja Assurin kuningas ”lähetti Laakiista Tartanin ja ylimmäisen hoviherran ja Rabsaken suuren sotajoukon kanssa kuningas Hiskiaa vastaan Jerusalemiin”. Sanherib vuorasi Niiniven palatsinsa salin piirityksen reliefeillä, jotka ovat nyt British Museumissa, ja kirjoituksella, jonka mukaan Lakiksen sotasaalis kulki hänen edessään. Paikalta kaivajat löysivät sen vuoden palaneen kaupungin ja assyrialaisen piiritysluiskan sen lounaiskulmaa vasten, ainoan toistaiseksi löydetyn assyrialaisen luiskan."
    - "Vuosisata myöhemmin tulivat babylonialaiset. Jeremia kirjoittaa, että sotajoukko taisteli ”Laakista ja Asekaa vastaan, sillä nämä olivat jääneet jäljelle Juudan kaupungeista, varustetuista kaupungeista”. Portista vuonna 1935 löydettyjen musteella kirjoitettujen saviastianpalojen, Lakiksen kirjeiden, joukossa yksi upseeri ilmoittaa, että he tarkkailevat Lakiksen merkkitulia, koska he eivät näe Asekaa, 17 km pohjois-koilliseen. Kaupunki poltettiin vuonna 587 tai 586 eaa. Joosua oli valloittanut Lakiksen vuosisatoja aiemmin; Amarna-kirjeiden kanaanilainen kaupunki tuhoutui 1100-luvulla eaa., ja se, miten tämä tuho liittyy Joosuan valloitukseen, on kiistanalaista."
  vi:
    - "La-ki là Tell ed-Duweir, nay là Tel Lachish, một gò lớn ở Sê-phê-la, các ngọn đồi thấp giữa vùng cao Giu-đê và đồng bằng ven biển, cách Giê-ru-sa-lem khoảng 43 km về phía tây nam theo đường thẳng; điểm trên bản đồ nằm trên gò ấy. Nó canh giữ con đường từ bờ biển vào vùng đồi Giu-đa và là thành mạnh nhất của vương quốc sau Giê-ru-sa-lem. Các học giả trước đây tìm La-ki ở nơi khác, nhưng từ các cuộc khai quật thập niên 1930, Tell ed-Duweir được chấp nhận rộng rãi."
    - "Năm 701 TCN, San-chê-ríp của A-si-ri vây hãm La-ki trong khi các quan của ông tiến lên đánh Giê-ru-sa-lem. Ê-xê-chia “sai sứ đến La-ki nói với vua A-si-ri rằng: Tôi phạm lỗi. Cầu vua lìa khỏi nước tôi; hễ vua đòi tôi điều gì, tôi sẽ chịu”, và vua A-si-ri “ở La-ki sai” các tướng “đem theo một đạo binh mạnh, đến Giê-ru-sa-lem”. San-chê-ríp cho ốp một sảnh trong cung điện của mình tại Ni-ni-ve bằng các phù điêu về cuộc vây hãm, nay ở Bảo tàng Anh, với dòng chú thích rằng chiến lợi phẩm của La-ki đi qua trước mặt ông. Tại địa điểm này, các nhà khai quật tìm thấy thành bị đốt của năm ấy và đường dốc vây hãm của A-si-ri áp vào góc tây nam của thành, đường dốc A-si-ri duy nhất đã được tìm thấy."
    - "Một thế kỷ sau, người Ba-by-lôn đến. Giê-rê-mi viết rằng đạo quân đánh “thành La-ki và thành A-xê-ca; vì trong các thành của Giu-đa chỉ hai thành bền vững đó còn lại”. Trong những mảnh gốm viết bằng mực tìm thấy ở cổng năm 1935, tức các Thư La-ki, một sĩ quan báo rằng họ đang canh chừng các tín hiệu của La-ki vì không thấy được A-xê-ca, cách 17 km về phía bắc đông bắc. Thành bị đốt năm 587 hoặc 586 TCN. Giô-suê đã chiếm La-ki nhiều thế kỷ trước; thành của người Ca-na-an trong các Thư Amarna bị phá hủy vào thế kỷ 12 TCN, và sự sụp đổ ấy liên hệ thế nào với cuộc chinh phục của Giô-suê thì còn tranh luận."
  ro:
    - "Lachiș este Tell ed-Duweir, azi Tel Lachiș, o movilă mare din Șefela, dealurile joase dintre înălțimile Iudeii și câmpia de coastă, la circa 43 km sud-vest de Ierusalim în linie dreaptă; punctul de pe hartă se află pe ea. Păzea drumul dinspre coastă spre dealurile lui Iuda și era cea mai puternică cetate a regatului după Ierusalim. Cercetătorii mai vechi căutau Lachișul în altă parte, dar după săpăturile din anii 1930 Tell ed-Duweir este în general acceptat."
    - "În 701 î.Hr. Senaherib al Asiriei a asediat Lachișul în timp ce comandanții lui urcau împotriva Ierusalimului. Despre Ezechia se spune: „a trimis Ezechia împăratul Iudei soli la împăratul Asirienilor în Lahis, zicând: greșit-am, întoarce-te deasupra mea, ori ce vei pune preste mine, voiu purtà”, iar regele Asiriei și-a trimis comandanții „din Lahis la împăratul Ezechia cu putere grea foarte asupra Ierusalimului”. Senaherib a căptușit o sală a palatului său de la Ninive cu basoreliefuri ale asediului, aflate acum la British Museum, cu o inscripție care spune că prada de la Lachiș a trecut înaintea lui. La fața locului, arheologii au găsit orașul ars din acel an și rampa de asediu asiriană ridicată la colțul de sud-vest, singura rampă asiriană găsită până acum."
    - "Un secol mai târziu au venit babilonienii. Ieremia scrie că armata lupta împotriva Lachișului și a Azecăi, fiindcă acestea erau singurele cetăți întărite rămase dintre cetățile lui Iuda. Printre ostracele scrise cu cerneală, găsite în poartă în 1935, scrisorile de la Lachiș, un ofițer raportează că urmăresc semnalele Lachișului pentru că nu pot vedea Azeca, aflată la 17 km spre nord-nord-est. Orașul a fost ars în 587 sau 586 î.Hr. Iosua cucerise Lachișul cu secole înainte; cetatea canaanită din scrisorile de la Amarna a fost distrusă în secolul al XII-lea î.Hr., iar felul în care această cădere se leagă de cucerirea lui Iosua este disputat."
  bg:
    - "Лахис е Тел ед-Дувейр, днес Тел Лахиш — голям хълм в Шефела, ниските хълмове между Юдейските планини и крайбрежната равнина, на около 43 км югозападно от Йерусалим по права линия; точката на картата стои на него. Той пазеше пътя от брега към хълмовете на Юда и беше най-силният град на царството след Йерусалим. По-ранни учени търсеха Лахис другаде, но след разкопките през 30-те години на XX в. Тел ед-Дувейр е общоприет."
    - "През 701 г. пр.н.е. асирийският цар Сенахирим обсади Лахис, докато военачалниците му се изкачиха срещу Йерусалим. Езекия „проводи… на Асирийския цар в Лахис и рече: Съгреших: върни се от мене: каквото туриш върх мене, ще го нося“, а асирийският цар изпрати военачалниците си „от Лахис при цар Езекия, с голяма сила, в Ерусалим“. Сенахирим покри стените на една зала в двореца си в Ниневия с релефи на обсадата, днес в Британския музей, с надпис, че плячката от Лахис преминала пред него. На мястото археолозите намериха изгорелия град от онази година и асирийския обсаден насип срещу югозападния му ъгъл — единствения асирийски насип, открит досега."
    - "Век по-късно дойдоха вавилонците. Йеремия пише, че войската воювала „против Лахис, и Азика; защото от Юдините градове те бяха останали, градове утвърдени“. Сред надписаните с мастило керамични фрагменти, намерени в портата през 1935 г. — писмата от Лахис, — един офицер съобщава, че следят сигналите на Лахис, защото не виждат Азека, на 17 км север-североизточно. Градът беше изгорен през 587 или 586 г. пр.н.е. Иисус Навин беше превзел Лахис векове по-рано; ханаанският град от писмата от Амарна е разрушен през XII в. пр.н.е., а как това падение се отнася към завладяването при Иисус Навин, е спорно."
