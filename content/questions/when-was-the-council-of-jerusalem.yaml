# Draft question. The date rests on the Gallio inscription; both identifications of Galatians 2 are given.
id: when-was-the-council-of-jerusalem
question:
  en: "When was the Council of Jerusalem?"
  ru: "Когда был Иерусалимский собор?"
  uk: "Коли був Єрусалимський собор?"
  es: "¿Cuándo tuvo lugar el Concilio de Jerusalén?"
  pt: "Quando foi o Concílio de Jerusalém?"
  de: "Wann fand das Apostelkonzil in Jerusalem statt?"
  fr: "Quand le concile de Jérusalem a-t-il eu lieu ?"
answer:
  en:
    - "About AD 49, between Paul's first missionary journey and his second: most scholars put it in 48 or 49, a few in 50 or 51. The map stands at Jerusalem in c. AD 49. The dispute began in Antioch, about 500 km north of Jerusalem in a straight line, where men from Judea taught the Gentile converts, “Except ye be circumcised after the manner of Moses, ye cannot be saved.”"
    - "After Peter's speech to the apostles and elders, James gave the ruling, “that we trouble not them, which from among the Gentiles are turned to God”. The letter sent back by Judas Barsabas and Silas “unto the brethren which are of the Gentiles in Antioch and Syria and Cilicia” asked only “that ye abstain from meats offered to idols, and from blood, and from things strangled, and from fornication”; some ancient manuscripts add the golden rule. Paul then carried the decrees through the cities of his second journey. In Galatians he tells of going up to Jerusalem “fourteen years after” with Barnabas and Titus, when James, Cephas and John “gave to me and Barnabas the right hands of fellowship”, asking only that they remember the poor; most scholars take this to be the same meeting, while others identify it with the earlier famine visit of Acts 11 and date Galatians before the council."
    - "Luke gives no year, so the date is reckoned from the one fixed point in Paul's life. A letter of Claudius inscribed at Delphi, dated AD 51/52, shows that Gallio was proconsul of Achaia from the summer of 51; Paul was brought before him at Corinth, where he spent eighteen months, so he had come there about the beginning of 50, after travelling through Asia Minor and Macedonia. That puts the council and the start of the second journey in 49 or late 48. The famine of Acts 11, which Josephus sets under the procurators Fadus and Tiberius Alexander, about 46–48, and Claudius's expulsion of the Jews from Rome about 49, after which Aquila and Priscilla had “lately come from Italy” when Paul met them in Corinth, fit the same frame; counting the “fourteen years” of Galatians from Paul's conversion about 33 or 34 gives 47 or 48, from his first visit to Jerusalem three years later, 50 or 51."
  ru:
    - "Около 49 г. н. э., между первым миссионерским путешествием Павла и вторым: большинство учёных относят его к 48 или 49 г., немногие — к 50 или 51-му. Карта стоит на Иерусалиме в условном 49 г. н. э. Спор начался в Антиохии, примерно в 500 км к северу от Иерусалима по прямой, где пришедшие из Иудеи учили обращённых язычников: «если не обрежетесь по обряду Моисееву, не можете спастись»."
    - "После речи Петра перед апостолами и пресвитерами решение вынес Иаков: «не затруднять обращающихся к Богу из язычников». Письмо, отправленное с Иудой Варсавой и Силой «находящимся в Антиохии, Сирии и Киликии братиям из язычников», требовало лишь «воздерживаться от идоложертвенного, и крови, и удавленины, и блуда, и не делать другим того, чего себе не хотите» — золотое правило Синодальный перевод взял из части древних рукописей. Затем Павел разносил эти определения по городам своего второго путешествия. В Послании к Галатам он рассказывает, как «через четырнадцать лет» ходил в Иерусалим с Варнавой и Титом, и Иаков, Кифа и Иоанн «подали мне и Варнаве руку общения», прося только помнить нищих; большинство учёных видят здесь ту же встречу, другие же отождествляют её с более ранним приходом в голод из 11-й главы Деяний и датируют Послание к Галатам до собора."
    - "Лука года не называет, и дату выводят из единственной твёрдой точки в жизни Павла. Письмо Клавдия, высеченное в Дельфах и датированное 51/52 г., показывает, что Галлион был проконсулом Ахаии с лета 51 г.; Павла привели к нему в Коринфе, где апостол провёл полтора года, значит, пришёл туда около начала 50-го, пройдя Малую Азию и Македонию. Это ставит собор и начало второго путешествия в 49 г. или в конец 48-го. Голод из 11-й главы Деяний, который Иосиф Флавий относит ко времени прокураторов Фада и Тиберия Александра, около 46–48 гг., и изгнание иудеев из Рима Клавдием около 49 г., после которого Павел встретил в Коринфе Акилу, «недавно пришедшего из Италии», и Прискиллу, укладываются в ту же рамку; если считать «четырнадцать лет» Послания к Галатам от обращения Павла около 33 или 34 г., выходит 47 или 48-й, а от его первого прихода в Иерусалим три года спустя — 50 или 51-й."
  uk:
    - "Близько 49 р. н. е., між першою місійною подорожжю Павла і другою: більшість учених ставить його на 48 або 49 р., декілька — на 50 чи 51. Мапа стоїть в Єрусалимі близько 49 р. н. е. Суперечка почалася в Антіохії, приблизно за 500 км на північ від Єрусалиму по прямій, де люди з Юдеї навчали навернених язичників: «коли не обріжетесь по звичаю Мойсейовому, не можете спасти ся»."
    - "Після промови Петра до апостолів і старших Яків виніс рішення: «не треба тим докучати, которі від поган обернулись до Бога». Лист, надісланий назад із Юдою Варсавою та Силою «братам з поган, що в Антиохиї, і Сириї і Киликиї», просив лише, «щоб удержувались від жертів ідолам, та крови, та давленого, та блуду»; деякі давні рукописи додають золоте правило. Потім Павло ніс ухвали містами своєї другої подорожі. У Посланні до галатів він розповідає, що пішов до Єрусалиму «по чотирнайцяти лїтах» із Варнавою і Титом, коли Яків, Кифа та Йоан «дали правицї менї та Варнаві на товаришуваннє», просячи лише пам'ятати вбогих; більшість учених вважає це тією самою зустріччю, тоді як інші ототожнюють її з ранішим візитом під час голоду з Дій 11 і датують Послання до галатів до собору."
    - "Лука року не дає, тож дату вираховують від єдиної твердої точки життя Павла. Лист Клавдія, висічений у Дельфах і датований 51/52 р. н. е., показує, що Галліон був проконсулом Ахаї від літа 51 р.; Павла було приведено до нього в Коринті, де він пробув вісімнадцять місяців, тож він прибув туди на початку 50 р., проїхавши Малу Азію та Македонію. Це ставить собор і початок другої подорожі на 49 або кінець 48 р. Голод із Дій 11, який Йосиф Флавій відносить до часів прокураторів Фада і Тиберія Александра, близько 46–48 рр., і вигнання Клавдієм євреїв із Рима близько 49 р., після якого Павло зустрів у Коринті Акилу, «тільки що прибувшого з Італиї», і Прискилу, вкладаються в ту саму рамку; якщо рахувати «чотирнадцять років» Послання до галатів від навернення Павла близько 33 або 34 р., вийде 47 або 48, а від його першого візиту до Єрусалиму через три роки — 50 або 51."
  es:
    - "Hacia el 49 d. C., entre el primer viaje misionero de Pablo y el segundo: la mayoría de los estudiosos lo sitúa en el 48 o 49, unos pocos en el 50 o 51. El mapa se sitúa en Jerusalén hacia el 49 d. C. La disputa comenzó en Antioquía, a unos 500 km al norte de Jerusalén en línea recta, donde hombres venidos de Judea enseñaban a los convertidos gentiles: «si no os circuncidáis conforme al rito de Moisés, no podéis ser salvos»."
    - "Tras el discurso de Pedro a los apóstoles y ancianos, Jacobo dio el dictamen: «que los que de los Gentiles se convierten á Dios, no han de ser inquietados». La carta enviada por Judas Barsabás y Silas «á los hermanos de los Gentiles que están en Antioquía, y en Siria, y en Cilicia» pedía solo «que os abstengáis de cosas sacrificadas á ídolos, y de sangre, y de ahogado, y de fornicación»; algunos manuscritos añaden la regla de oro. Pablo llevó luego los decretos por las ciudades de su segundo viaje. En Gálatas cuenta que subió a Jerusalén «pasados catorce años» con Bernabé y Tito, cuando Jacobo, Cefas y Juan «nos dieron las diestras de compañía á mí y á Bernabé», pidiendo solo recordar a los pobres; la mayoría de los estudiosos lo toma por la misma reunión, y otros lo identifican con la visita anterior, de la hambruna, de Hechos 11 y fechan Gálatas antes del concilio."
    - "Lucas no da año; la fecha se calcula desde el único punto fijo de la vida de Pablo. Una carta de Claudio en Delfos, del 51/52 d. C., muestra que Galión fue procónsul de Acaya desde el verano del 51; Pablo fue llevado ante él en Corinto, donde pasó dieciocho meses, así que había llegado hacia comienzos del 50, tras recorrer Asia Menor y Macedonia. Eso sitúa el concilio y el inicio del segundo viaje en el 49 o a fines del 48. La hambruna de Hechos 11, que Josefo sitúa bajo los procuradores Fado y Tiberio Alejandro, hacia 46–48, y la expulsión de los judíos de Roma por Claudio hacia el 49, tras la cual Aquila, que «hacía poco que había venido de Italia», y Priscila encontraron a Pablo en Corinto, encajan igualmente; contando los «catorce años» de Gálatas desde la conversión de Pablo, hacia el 33 o 34, se llega al 47 o 48, y desde su primera visita a Jerusalén, tres años después, al 50 o 51."
  pt:
    - "Por volta de 49 d.C., entre a primeira viagem missionária de Paulo e a segunda: a maioria dos estudiosos o situa em 48 ou 49, alguns em 50 ou 51. O mapa está em Jerusalém em c. 49 d.C. A disputa começou em Antioquia, a cerca de 500 km ao norte de Jerusalém em linha reta, onde homens vindos da Judeia ensinavam aos convertidos gentios: “A menos que vocês sejam circuncidados segundo o costume de Moisés, não podem ser salvos.”"
    - "Depois do discurso de Pedro aos apóstolos e presbíteros, Tiago deu a sentença: “que não perturbemos aqueles dentre os gentios que se convertem a Deus”. A carta enviada por Judas Barsabás e Silas “aos irmãos dentre os gentios em Antioquia, na Síria e na Cilícia” pedia apenas “que se abstenham das coisas sacrificadas aos ídolos, do sangue, das coisas sufocadas e da imoralidade sexual”; alguns manuscritos antigos acrescentam a regra de ouro. Paulo levou então os decretos pelas cidades de sua segunda viagem. Em Gálatas conta que subiu a Jerusalém “depois de um período de catorze anos” com Barnabé e Tito, quando Tiago, Cefas e João “estenderam a Barnabé e a mim a mão direita em sinal de comunhão”, pedindo apenas que se lembrassem dos pobres; a maioria vê aí o mesmo encontro; outros o identificam com a visita anterior, da fome, de Atos 11, e datam Gálatas antes do concílio."
    - "Lucas não dá ano; a data é calculada a partir do único ponto fixo da vida de Paulo. Uma carta de Cláudio inscrita em Delfos, de 51/52 d.C., mostra que Gálio foi procônsul da Acaia desde o verão de 51; Paulo foi levado diante dele em Corinto, onde passou dezoito meses, de modo que chegara ali por volta do início de 50, depois de cruzar a Ásia Menor e a Macedônia. Isso põe o concílio e o início da segunda viagem em 49 ou fins de 48. A fome de Atos 11, que Josefo situa sob os procuradores Fado e Tibério Alexandre, por volta de 46–48, e a expulsão dos judeus de Roma por Cláudio, cerca de 49, após a qual Áquila, que “havia chegado recentemente da Itália” com Priscila, encontrou Paulo em Corinto, cabem no mesmo quadro; contados da conversão de Paulo (cerca de 33 ou 34), os “catorze anos” de Gálatas dão 47 ou 48; da primeira visita a Jerusalém, três anos depois, 50 ou 51."
  de:
    - "Um 49 n. Chr., zwischen der ersten Missionsreise des Paulus und seiner zweiten: Die meisten Gelehrten setzen es auf 48 oder 49, wenige auf 50 oder 51. Die Karte steht um 49 n. Chr. bei Jerusalem. Der Streit begann in Antiochia, etwa 500 km nördlich von Jerusalem in der Luftlinie, wo Männer aus Judäa die Heidenchristen lehrten: „Wo ihr euch nicht beschneiden lasset nach der Weise Mose's, so könnt ihr nicht selig werden.“"
    - "Nach Petrus' Rede vor Aposteln und Ältesten entschied Jakobus, „daß man denen, so aus den Heiden zu Gott sich bekehren, nicht Unruhe mache“. Der Brief, den Judas Barsabas und Silas „den Brüdern aus den Heiden, die zu Antiochien und Syrien und Zilizien sind“ brachten, verlangte nur, „daß ihr euch enthaltet vom Götzenopfer und vom Blut und vom Erstickten und von der Hurerei“; manche alte Handschriften fügen die Goldene Regel hinzu. Paulus trug die Beschlüsse durch die Städte seiner zweiten Reise. Im Galaterbrief erzählt er, „über vierzehn Jahre“ später mit Barnabas und Titus nach Jerusalem gezogen zu sein, wo Jakobus, Kephas und Johannes „mir und Barnabas die rechte Hand“ gaben und nur baten, der Armen zu gedenken; die meisten sehen darin dieselbe Zusammenkunft, andere setzen es mit dem früheren Hungersnotbesuch (Apg 11) gleich und datieren den Brief vor das Konzil."
    - "Lukas nennt kein Jahr, daher rechnet man von dem einen festen Punkt im Leben des Paulus aus. Ein in Delphi eingemeißelter Brief des Klaudius von 51/52 n. Chr. zeigt, dass Gallio ab dem Sommer 51 Prokonsul von Achaja war; Paulus wurde in Korinth, wo er achtzehn Monate blieb, vor ihn gebracht, war also um den Beginn von 50 dort eingetroffen, nach der Reise durch Kleinasien und Mazedonien. Das legt Konzil und Beginn der zweiten Reise auf 49 oder Ende 48. Dazu passen die Hungersnot von Apg 11, die Josephus unter den Prokuratoren Fadus und Tiberius Alexander um 46–48 ansetzt, und Klaudius' Ausweisung der Juden aus Rom um 49, wonach Aquila und Priscilla in Korinth „neulich aus Italien gekommen“ waren; zählt man die „vierzehn Jahre“ des Galaterbriefs von der Bekehrung um 33 oder 34, ergibt das 47 oder 48, vom ersten Jerusalem-Besuch drei Jahre später 50 oder 51."
  fr:
    - "Vers 49 apr. J.-C., entre le premier voyage missionnaire de Paul et le deuxième : la plupart des savants le placent en 48 ou 49, quelques-uns en 50 ou 51. La carte se place à Jérusalem vers 49 apr. J.-C. Le différend naquit à Antioche, à environ 500 km au nord de Jérusalem en ligne droite, où des hommes venus de Judée enseignaient aux convertis païens : « Si vous n’êtes circoncis selon le rite de Moïse, vous ne pouvez être sauvés. »"
    - "Après Pierre devant les apôtres et les anciens, Jacques rendit la décision : « qu’on ne crée pas des difficultés à ceux des païens qui se convertissent à Dieu ». La lettre portée par Judas Barsabas et Silas « aux frères d’entre les païens, qui sont à Antioche, en Syrie, et en Cilicie » demandait seulement « de vous abstenir des viandes sacrifiées aux idoles, du sang, des animaux étouffés, et de l’impudicité » ; d’anciens manuscrits ajoutent la règle d’or. Paul les porta dans les villes de son deuxième voyage. Aux Galates, il dit être monté à Jérusalem « quatorze ans après » avec Barnabas et Tite, quand Jacques, Céphas et Jean « me donnèrent, à moi et à Barnabas, la main d’association », en demandant seulement de se souvenir des pauvres ; la plupart y voient la même rencontre, d’autres la visite antérieure de la famine (Actes 11), et datent Galates avant le concile."
    - "Luc ne donne aucune année ; on part de l’unique point fixe de la vie de Paul. Une lettre de Claude gravée à Delphes, datée de 51/52 apr. J.-C., montre que Gallion fut proconsul d’Achaïe dès l’été 51 ; Paul comparut devant lui à Corinthe, où il passa dix-huit mois, et il y était donc arrivé vers le début de 50, après l’Asie Mineure et la Macédoine. Cela place le concile et le début du deuxième voyage en 49 ou fin 48. La famine d’Actes 11, que Josèphe situe sous les procurateurs Fadus et Tibère Alexandre, vers 46–48, et l’expulsion des Juifs de Rome par Claude vers 49, après laquelle Aquilas, « récemment arrivé d’Italie » avec Priscille, rencontra Paul à Corinthe, s’accordent avec ce cadre ; les « quatorze ans » de Galates, comptés depuis la conversion de Paul vers 33 ou 34, donnent 47 ou 48, et depuis sa première visite à Jérusalem trois ans plus tard, 50 ou 51."
