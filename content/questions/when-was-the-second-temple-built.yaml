id: when-was-the-second-temple-built
question:
  en: "When was the second Temple built?"
  ru: "Когда был построен второй Храм?"
  uk: "Коли було збудовано Другий Храм?"
  es: "¿Cuándo se construyó el Segundo Templo?"
  pt: "Quando foi construído o Segundo Templo?"
  de: "Wann wurde der Zweite Tempel gebaut?"
  fr: "Quand le second Temple a-t-il été bâti ?"
answer:
  en:
    - "The second Temple was finished in the sixth year of Darius I, in the spring of 515 BC, about twenty years after the first exiles returned from Babylon and some seventy years after the Babylonians burned Solomon's Temple in 587 or 586 BC; the map rounds this to c. 516 BC, as many handbooks do, since that year of Darius began in the spring of 516."
    - "Ezra tells the story in stages. In 538 BC, “in the first year of Cyrus king of Persia”, the king decreed: “let him go up to Jerusalem, which is in Judah, and build the house of the LORD God of Israel.” In the second year after the return the foundation was laid, and the old men “that had seen the first house” wept at the sight. Then the work stopped, “unto the second year of the reign of Darius king of Persia”, 520 BC, when Haggai and Zechariah stirred Zerubbabel and the high priest Joshua to build again; Haggai dates his first oracle to the first day of the sixth month of that year. “And this house was finished on the third day of the month Adar, which was in the sixth year of the reign of Darius the king”, a date that the Babylonian calendar tables put in March 515 BC."
    - "Herod the Great rebuilt this Temple from the ground up in the last decades of the first century BC, beginning, Josephus says, in the eighteenth year of his reign, about 20 BC; the sanctuary itself was finished quickly, but the courts and porticoes were still being built in Jesus' day, which is why the Jews told him “Forty and six years was this temple in building”, and Josephus says the work ended only in the 60s AD, a few years before the Romans destroyed it in AD 70. Because the sacrifices never ceased, it counts as the same second Temple."
  ru:
    - "Второй Храм был окончен в шестой год Дария I, весной 515 г. до н. э., примерно через двадцать лет после возвращения первых изгнанников из Вавилона и примерно через семьдесят лет после того, как вавилоняне сожгли Храм Соломона в 587 или 586 г. до н. э.; карта, как и многие справочники, округляет это до 516 г. до н. э., поскольку тот год Дария начался весной 516-го."
    - "Книга Ездры рассказывает это по ступеням. «В первый год Кира, царя Персидского», в 538 г. до н. э., царь повелел: «пусть он идет в Иерусалим, что в Иудее, и строит дом Господа Бога Израилева». На второй год после возвращения положили основание, и старики, «которые видели прежний храм», плакали при этом. Затем работа остановилась «до второго года царствования Дария, царя Персидского», 520 г. до н. э., когда Аггей и Захария подняли Зоровавеля и первосвященника Иисуса строить снова; Аггей датирует своё первое слово первым днём шестого месяца того года. «И окончен дом сей к третьему дню месяца Адара, в шестой год царствования царя Дария» — дата, которую таблицы вавилонского календаря относят к марту 515 г. до н. э."
    - "Ирод Великий перестроил этот Храм с основания в последние десятилетия I века до н. э., начав, по словам Иосифа Флавия, в восемнадцатый год своего царствования, около 20 г. до н. э.; само святилище закончили быстро, но дворы и портики ещё строились во дни Иисуса, потому иудеи и сказали Ему: «сей храм строился сорок шесть лет», а Иосиф Флавий говорит, что работы завершились лишь в 60-х годах н. э., за несколько лет до того, как римляне разрушили Храм в 70 году. Поскольку жертвы не прекращались, это считается тем же вторым Храмом."
  uk:
    - "Другий Храм було завершено на шостому році Дарія I, навесні 515 р. до н. е., приблизно через двадцять років після повернення перших вигнанців із Вавилону і приблизно через сімдесят років після того, як вавилоняни спалили Соломонів Храм 587 або 586 р. до н. е.; мапа округлює це до близько 516 р. до н. е., як і багато довідників, бо цей рік Дарія почався навесні 516 р."
    - "Ездра розповідає цю історію етапами. 538 р. до н. е., «Першого року Кира, царя Перського», цар звелів: «нехай ійде в Ерусалим, що в Юдеї, і будує дім Господа, Бога Ізрайлевого». На другий рік після повернення було закладено фундамент, і старі, «що бачили давнїйший храм», плакали при цьому видовищі. Потім робота зупинилася «до другого року царювання Дарія, царя Перського», 520 р. до н. е., коли Аггей і Захарія спонукали Зоровавеля й первосвященника Ісуса знову будувати; Аггей датує своє перше пророцтво першим днем шостого місяця цього року. «І скінчили сей дім на третий день місяця Адара, шостого року царювання царя Дарія» — дата, яку вавилонські календарні таблиці ставлять на березень 515 р. до н. е."
    - "Ірод Великий перебудував цей Храм від підвалин в останні десятиліття I ст. до н. е., почавши, за Йосифом Флавієм, на вісімнадцятому році свого царювання, близько 20 р. до н. е.; сама святиня була завершена швидко, але двори й портики ще будувалися за днів Ісуса, тому євреї й сказали Йому: «Сорок і шість років будовано церкву сю», а Йосиф Флавій каже, що роботи закінчилися лише у 60-х рр. н. е., за кілька років до того, як римляни зруйнували його 70 р. Оскільки жертви ніколи не припинялися, його зараховують до того самого Другого Храму."
  es:
    - "El Segundo Templo se terminó en el año sexto de Darío I, en la primavera del 515 a. C., unos veinte años después de que regresaran los primeros desterrados de Babilonia y unos setenta años después de que los babilonios incendiaran el Templo de Salomón en el 587 o 586 a. C.; el mapa lo redondea al 516 a. C., como hacen muchos manuales, pues ese año de Darío comenzó en la primavera del 516."
    - "Esdras cuenta la historia por etapas. En el 538 a. C., «en el primer año de Ciro rey de Persia», el rey decretó: «suba á Jerusalem que está en Judá, y edifique la casa á Jehová Dios de Israel». En el segundo año después del regreso se echó el cimiento, y los ancianos «que habían visto la casa primera» lloraron al verlo. Luego la obra cesó, «hasta el año segundo del reinado de Darío rey de Persia», el 520 a. C., cuando Hageo y Zacarías animaron a Zorobabel y al sumo sacerdote Josué a edificar de nuevo; Hageo fecha su primer oráculo el primer día del mes sexto de ese año. «Y esta casa fué acabada al tercer día del mes de Adar, que era el sexto año del reinado del rey Darío», fecha que las tablas del calendario babilónico sitúan en marzo del 515 a. C."
    - "Herodes el Grande reconstruyó este Templo desde los cimientos en las últimas décadas del siglo I a. C., comenzando, según Josefo, en el año dieciocho de su reinado, hacia el 20 a. C.; el propio santuario se terminó pronto, pero los atrios y los pórticos aún se estaban construyendo en tiempos de Jesús, razón por la cual los judíos le dijeron: «En cuarenta y seis años fué este templo edificado», y Josefo dice que la obra terminó solo en los años 60 d. C., pocos años antes de que los romanos lo destruyeran en el 70 d. C. Como los sacrificios nunca cesaron, cuenta como el mismo Segundo Templo."
  pt:
    - "O Segundo Templo foi concluído no sexto ano de Dario I, na primavera de 515 a.C., cerca de vinte anos depois do regresso dos primeiros exilados da Babilônia e uns setenta anos depois de os babilônios queimarem o Templo de Salomão em 587 ou 586 a.C.; o mapa arredonda isso para c. 516 a.C., como muitos manuais, pois esse ano de Dario começou na primavera de 516."
    - "Esdras conta a história por etapas. Em 538 a.C., “no primeiro ano de Ciro, rei da Pérsia”, o rei decretou: “suba a Jerusalém, que fica em Judá, e edifique a casa do SENHOR, o Deus de Israel”. No segundo ano depois do regresso foi lançado o alicerce, e os idosos “que tinham visto a primeira casa” choraram ao ver. Depois a obra parou, “até o segundo ano do reinado de Dario, rei da Pérsia”, 520 a.C., quando Ageu e Zacarias incitaram Zorobabel e o sumo sacerdote Josué a construir de novo; Ageu data seu primeiro oráculo do primeiro dia do sexto mês desse ano. “Esta casa foi terminada no terceiro dia do mês de Adar, que foi no sexto ano do reinado do rei Dario”, data que as tábuas do calendário babilônico situam em março de 515 a.C."
    - "Herodes, o Grande, reconstruiu esse Templo desde os alicerces nas últimas décadas do século I a.C., começando, diz Josefo, no décimo oitavo ano de seu reinado, por volta de 20 a.C.; o santuário em si ficou pronto depressa, mas os pátios e pórticos ainda estavam sendo construídos no tempo de Jesus, e por isso os judeus lhe disseram: “Levou quarenta e seis anos para construir este templo!”, e Josefo diz que a obra só terminou nos anos 60 d.C., poucos anos antes de os romanos o destruírem em 70 d.C. Como os sacrifícios nunca cessaram, ele conta como o mesmo Segundo Templo."
  de:
    - "Der Zweite Tempel wurde im sechsten Jahr Darius' I. im Frühjahr 515 v. Chr. vollendet, etwa zwanzig Jahre nach der Rückkehr der ersten Verbannten aus Babylon und rund siebzig Jahre nachdem die Babylonier den Tempel Salomos 587 oder 586 v. Chr. verbrannt hatten; die Karte rundet auf um 516 v. Chr., wie es viele Handbücher tun, da jenes Jahr des Darius im Frühjahr 516 begann."
    - "Esra erzählt die Geschichte in Etappen. 538 v. Chr., „im ersten Jahr des Kores, des Königs in Persien“, ordnete der König an: „und er ziehe hinauf gen Jerusalem in Juda und baue das Haus des HERRN, des Gottes Israels.“ Im zweiten Jahr nach der Rückkehr wurde der Grund gelegt, und die alten Männer, „die das vorige Haus gesehen hatten“, weinten bei dem Anblick laut. Dann ruhte das Werk „bis ins zweite Jahr des Darius, des Königs in Persien“, 520 v. Chr., als Haggai und Sacharja Serubbabel und den Hohenpriester Jeschua zum erneuten Bau anspornten; Haggai datiert sein erstes Orakel auf den ersten Tag des sechsten Monats jenes Jahres. Sie „vollendeten das Haus bis an den dritten Tag des Monats Adar, das war das sechste Jahr des Königreichs des Königs Darius“, ein Datum, das die babylonischen Kalendertafeln in den März 515 v. Chr. setzen."
    - "Herodes der Große baute diesen Tempel in den letzten Jahrzehnten des 1. Jahrhunderts v. Chr. von Grund auf neu, beginnend, so Josephus, im achtzehnten Jahr seiner Regierung, um 20 v. Chr.; das Heiligtum selbst wurde rasch fertig, aber die Vorhöfe und Säulenhallen wurden zu Jesu Zeit noch gebaut, weshalb die Juden ihm sagten: „Dieser Tempel ist in 46 Jahren erbaut“, und Josephus sagt, die Arbeit sei erst in den 60er Jahren n. Chr. beendet worden, wenige Jahre bevor die Römer ihn 70 n. Chr. zerstörten. Weil die Opfer nie aufhörten, gilt er als derselbe Zweite Tempel."
  fr:
    - "Le second Temple fut achevé la sixième année de Darius Ier, au printemps de 515 av. J.-C., une vingtaine d’années après le retour des premiers exilés de Babylone et quelque soixante-dix ans après que les Babyloniens eurent brûlé le Temple de Salomon en 587 ou 586 av. J.-C. ; la carte arrondit à vers 516 av. J.-C., comme le font beaucoup de manuels, puisque cette année de Darius commença au printemps 516."
    - "Esdras raconte l’histoire par étapes. En 538 av. J.-C., « la première année de Cyrus, roi de Perse », le roi décréta : « qu’il monte à Jérusalem en Juda et bâtisse la maison de l’Éternel, le Dieu d’Israël ! » La seconde année après le retour, les fondations furent posées, et les vieillards « qui avaient vu la première maison » pleurèrent à ce spectacle. Puis l’ouvrage s’arrêta « jusqu’à la seconde année du règne de Darius, roi de Perse », en 520 av. J.-C., quand Aggée et Zacharie poussèrent Zorobabel et le grand prêtre Josué à rebâtir ; Aggée date son premier oracle du premier jour du sixième mois de cette année. « La maison fut achevée le troisième jour du mois d’Adar, dans la sixième année du règne du roi Darius », date que les tables du calendrier babylonien situent en mars 515 av. J.-C."
    - "Hérode le Grand rebâtit ce Temple de fond en comble dans les dernières décennies du Ier siècle av. J.-C., commençant, dit Josèphe, la dix-huitième année de son règne, vers 20 av. J.-C. ; le sanctuaire lui-même fut vite achevé, mais les cours et les portiques se construisaient encore au temps de Jésus, ce qui explique que les Juifs lui dirent : « Il a fallu quarante-six ans pour bâtir ce temple », et Josèphe dit que les travaux ne s’achevèrent que dans les années 60 apr. J.-C., quelques années avant que les Romains le détruisent en 70 apr. J.-C. Comme les sacrifices ne cessèrent jamais, il compte comme le même second Temple."
