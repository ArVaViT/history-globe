id: when-was-the-second-temple-built
question:
  en: "When was the second Temple built?"
  ru: "Когда был построен второй Храм?"
  uk: "Коли було збудовано Другий Храм?"
  es: "¿Cuándo se construyó el Segundo Templo?"
  pt: "Quando foi construído o Segundo Templo?"
  de: "Wann wurde der Zweite Tempel gebaut?"
  fr: "Quand le second Temple a-t-il été bâti ?"
  pl: "Kiedy zbudowano Drugą Świątynię?"
  it: "Quando fu costruito il Secondo Tempio?"
  nl: "Wanneer werd de Tweede Tempel gebouwd?"
  cs: "Kdy byl postaven druhý chrám?"
  sv: "När byggdes det andra templet?"
  nb: "Når ble det andre tempelet bygget?"
  tl: "Kailan itinayo ang Ikalawang Templo?"
  da: "Hvornår blev det andet tempel bygget?"
  sr: "Када је саграђен Други храм?"
answer:
  en:
    - "The second Temple was finished in the sixth year of Darius I, in the spring of 515 BC, about twenty years after the first exiles returned from Babylon and some seventy years after the Babylonians burned Solomon's Temple in 587 or 586 BC; the map rounds this to c. 516 BC, as many handbooks do, since that year of Darius began in the spring of 516."
    - "Ezra tells the story in stages. In 538 BC, “in the first year of Cyrus king of Persia”, the king decreed: “let him go up to Jerusalem, which is in Judah, and build the house of the LORD God of Israel.” In the second year after the return the foundation was laid, and the old men “that had seen the first house” wept at the sight. Then the work stopped, “unto the second year of the reign of Darius king of Persia”, 520 BC, when Haggai and Zechariah stirred Zerubbabel and the high priest Joshua to build again; Haggai dates his first oracle to the first day of the sixth month of that year. “And this house was finished on the third day of the month Adar, which was in the sixth year of the reign of Darius the king”, a date that the Babylonian calendar tables put in March 515 BC."
    - "Herod the Great rebuilt this Temple from the ground up in the last decades of the first century BC, beginning, Josephus says, in the eighteenth year of his reign, about 20 BC; the sanctuary itself was finished quickly, but the courts and porticoes were still being built in Jesus' day, which is why the Jews told him “Forty and six years was this temple in building”, and Josephus says the work ended only in the 60s AD, a few years before the Romans destroyed it in AD 70. Because the sacrifices never ceased, it counts as the same second Temple."
  ru:
    - "Второй Храм был окончен в шестой год Дария I, весной 515 г. до н. э., примерно через двадцать лет после возвращения первых изгнанников из Вавилона и примерно через семьдесят лет после того, как вавилоняне сожгли Храм Соломона в 587 или 586 г. до н. э.; карта, как и многие справочники, округляет это до 516 г. до н. э., поскольку тот год Дария начался весной 516-го."
    - "Книга Ездры рассказывает это по ступеням. «В первый год Кира, царя Персидского», в 538 г. до н. э., царь повелел: «пусть он идет в Иерусалим, что в Иудее, и строит дом Господа Бога Израилева». На второй год после возвращения положили основание, и старики, «которые видели прежний храм», плакали при этом. Затем работа остановилась «до второго года царствования Дария, царя Персидского», 520 г. до н. э., когда Аггей и Захария подняли Зоровавеля и первосвященника Иисуса строить снова; Аггей датирует своё первое слово первым днём шестого месяца того года. «И окончен дом сей к третьему дню месяца Адара, в шестой год царствования царя Дария» — дата, которую таблицы вавилонского календаря относят к марту 515 г. до н. э."
    - "Ирод Великий перестроил этот Храм с основания в последние десятилетия I века до н. э., начав, по словам Иосифа Флавия, в восемнадцатый год своего царствования, около 20 г. до н. э.; само святилище закончили быстро, но дворы и портики ещё строились во дни Иисуса, потому иудеи и сказали Ему: «сей храм строился сорок шесть лет», а Иосиф Флавий говорит, что работы завершились лишь в 60-х годах н. э., за несколько лет до того, как римляне разрушили Храм в 70 году. Поскольку жертвы не прекращались, это считается тем же вторым Храмом."
  uk:
    - "Другий Храм було завершено на шостому році Дарія I, навесні 515 р. до н. е., приблизно через двадцять років після повернення перших вигнанців із Вавилону і приблизно через сімдесят років після того, як вавилоняни спалили Соломонів Храм 587 або 586 р. до н. е.; мапа округлює це до близько 516 р. до н. е., як і багато довідників, бо цей рік Дарія почався навесні 516 р."
    - "Ездра розповідає цю історію етапами. 538 р. до н. е., «Першого року Кира, царя Перського», цар звелів: «нехай ійде в Ерусалим, що в Юдеї, і будує дім Господа, Бога Ізрайлевого». На другий рік після повернення було закладено фундамент, і старі, «що бачили давнїйший храм», плакали при цьому видовищі. Потім робота зупинилася «до другого року царювання Дарія, царя Перського», 520 р. до н. е., коли Аггей і Захарія спонукали Зоровавеля й первосвященника Ісуса знову будувати; Аггей датує своє перше пророцтво першим днем шостого місяця цього року. «І скінчили сей дім на третий день місяця Адара, шостого року царювання царя Дарія» — дата, яку вавилонські календарні таблиці ставлять на березень 515 р. до н. е."
    - "Ірод Великий перебудував цей Храм від підвалин в останні десятиліття I ст. до н. е., почавши, за Йосифом Флавієм, на вісімнадцятому році свого царювання, близько 20 р. до н. е.; сама святиня була завершена швидко, але двори й портики ще будувалися за днів Ісуса, тому євреї й сказали Йому: «Сорок і шість років будовано церкву сю», а Йосиф Флавій каже, що роботи закінчилися лише у 60-х рр. н. е., за кілька років до того, як римляни зруйнували його 70 р. Оскільки жертви ніколи не припинялися, його зараховують до того самого Другого Храму."
  es:
    - "El Segundo Templo se terminó en el año sexto de Darío I, en la primavera del 515 a. C., unos veinte años después de que regresaran los primeros desterrados de Babilonia y unos setenta años después de que los babilonios incendiaran el Templo de Salomón en el 587 o 586 a. C.; el mapa lo redondea al 516 a. C., como hacen muchos manuales, pues ese año de Darío comenzó en la primavera del 516."
    - "Esdras cuenta la historia por etapas. En el 538 a. C., «en el primer año de Ciro rey de Persia», el rey decretó: «suba á Jerusalem que está en Judá, y edifique la casa á Jehová Dios de Israel». En el segundo año después del regreso se echó el cimiento, y los ancianos «que habían visto la casa primera» lloraron al verlo. Luego la obra cesó, «hasta el año segundo del reinado de Darío rey de Persia», el 520 a. C., cuando Hageo y Zacarías animaron a Zorobabel y al sumo sacerdote Josué a edificar de nuevo; Hageo fecha su primer oráculo el primer día del mes sexto de ese año. «Y esta casa fué acabada al tercer día del mes de Adar, que era el sexto año del reinado del rey Darío», fecha que las tablas del calendario babilónico sitúan en marzo del 515 a. C."
    - "Herodes el Grande reconstruyó este Templo desde los cimientos en las últimas décadas del siglo I a. C., comenzando, según Josefo, en el año dieciocho de su reinado, hacia el 20 a. C.; el propio santuario se terminó pronto, pero los atrios y los pórticos aún se estaban construyendo en tiempos de Jesús, razón por la cual los judíos le dijeron: «En cuarenta y seis años fué este templo edificado», y Josefo dice que la obra terminó solo en los años 60 d. C., pocos años antes de que los romanos lo destruyeran en el 70 d. C. Como los sacrificios nunca cesaron, cuenta como el mismo Segundo Templo."
  pt:
    - "O Segundo Templo foi concluído no sexto ano de Dario I, na primavera de 515 a.C., cerca de vinte anos depois do regresso dos primeiros exilados da Babilônia e uns setenta anos depois de os babilônios queimarem o Templo de Salomão em 587 ou 586 a.C.; o mapa arredonda isso para c. 516 a.C., como muitos manuais, pois esse ano de Dario começou na primavera de 516."
    - "Esdras conta a história por etapas. Em 538 a.C., “no primeiro ano de Ciro, rei da Pérsia”, o rei decretou: “suba a Jerusalém, que fica em Judá, e edifique a casa do SENHOR, o Deus de Israel”. No segundo ano depois do regresso foi lançado o alicerce, e os idosos “que tinham visto a primeira casa” choraram ao ver. Depois a obra parou, “até o segundo ano do reinado de Dario, rei da Pérsia”, 520 a.C., quando Ageu e Zacarias incitaram Zorobabel e o sumo sacerdote Josué a construir de novo; Ageu data seu primeiro oráculo do primeiro dia do sexto mês desse ano. “Esta casa foi terminada no terceiro dia do mês de Adar, que foi no sexto ano do reinado do rei Dario”, data que as tábuas do calendário babilônico situam em março de 515 a.C."
    - "Herodes, o Grande, reconstruiu esse Templo desde os alicerces nas últimas décadas do século I a.C., começando, diz Josefo, no décimo oitavo ano de seu reinado, por volta de 20 a.C.; o santuário em si ficou pronto depressa, mas os pátios e pórticos ainda estavam sendo construídos no tempo de Jesus, e por isso os judeus lhe disseram: “Levou quarenta e seis anos para construir este templo!”, e Josefo diz que a obra só terminou nos anos 60 d.C., poucos anos antes de os romanos o destruírem em 70 d.C. Como os sacrifícios nunca cessaram, ele conta como o mesmo Segundo Templo."
  de:
    - "Der Zweite Tempel wurde im sechsten Jahr Darius' I. im Frühjahr 515 v. Chr. vollendet, etwa zwanzig Jahre nach der Rückkehr der ersten Verbannten aus Babylon und rund siebzig Jahre nachdem die Babylonier den Tempel Salomos 587 oder 586 v. Chr. verbrannt hatten; die Karte rundet auf um 516 v. Chr., wie es viele Handbücher tun, da jenes Jahr des Darius im Frühjahr 516 begann."
    - "Esra erzählt die Geschichte in Etappen. 538 v. Chr., „im ersten Jahr des Kores, des Königs in Persien“, ordnete der König an: „und er ziehe hinauf gen Jerusalem in Juda und baue das Haus des HERRN, des Gottes Israels.“ Im zweiten Jahr nach der Rückkehr wurde der Grund gelegt, und die alten Männer, „die das vorige Haus gesehen hatten“, weinten bei dem Anblick laut. Dann ruhte das Werk „bis ins zweite Jahr des Darius, des Königs in Persien“, 520 v. Chr., als Haggai und Sacharja Serubbabel und den Hohenpriester Jeschua zum erneuten Bau anspornten; Haggai datiert sein erstes Orakel auf den ersten Tag des sechsten Monats jenes Jahres. Sie „vollendeten das Haus bis an den dritten Tag des Monats Adar, das war das sechste Jahr des Königreichs des Königs Darius“, ein Datum, das die babylonischen Kalendertafeln in den März 515 v. Chr. setzen."
    - "Herodes der Große baute diesen Tempel in den letzten Jahrzehnten des 1. Jahrhunderts v. Chr. von Grund auf neu, beginnend, so Josephus, im achtzehnten Jahr seiner Regierung, um 20 v. Chr.; das Heiligtum selbst wurde rasch fertig, aber die Vorhöfe und Säulenhallen wurden zu Jesu Zeit noch gebaut, weshalb die Juden ihm sagten: „Dieser Tempel ist in 46 Jahren erbaut“, und Josephus sagt, die Arbeit sei erst in den 60er Jahren n. Chr. beendet worden, wenige Jahre bevor die Römer ihn 70 n. Chr. zerstörten. Weil die Opfer nie aufhörten, gilt er als derselbe Zweite Tempel."
  fr:
    - "Le second Temple fut achevé la sixième année de Darius Ier, au printemps de 515 av. J.-C., une vingtaine d’années après le retour des premiers exilés de Babylone et quelque soixante-dix ans après que les Babyloniens eurent brûlé le Temple de Salomon en 587 ou 586 av. J.-C. ; la carte arrondit à vers 516 av. J.-C., comme le font beaucoup de manuels, puisque cette année de Darius commença au printemps 516."
    - "Esdras raconte l’histoire par étapes. En 538 av. J.-C., « la première année de Cyrus, roi de Perse », le roi décréta : « qu’il monte à Jérusalem en Juda et bâtisse la maison de l’Éternel, le Dieu d’Israël ! » La seconde année après le retour, les fondations furent posées, et les vieillards « qui avaient vu la première maison » pleurèrent à ce spectacle. Puis l’ouvrage s’arrêta « jusqu’à la seconde année du règne de Darius, roi de Perse », en 520 av. J.-C., quand Aggée et Zacharie poussèrent Zorobabel et le grand prêtre Josué à rebâtir ; Aggée date son premier oracle du premier jour du sixième mois de cette année. « La maison fut achevée le troisième jour du mois d’Adar, dans la sixième année du règne du roi Darius », date que les tables du calendrier babylonien situent en mars 515 av. J.-C."
    - "Hérode le Grand rebâtit ce Temple de fond en comble dans les dernières décennies du Ier siècle av. J.-C., commençant, dit Josèphe, la dix-huitième année de son règne, vers 20 av. J.-C. ; le sanctuaire lui-même fut vite achevé, mais les cours et les portiques se construisaient encore au temps de Jésus, ce qui explique que les Juifs lui dirent : « Il a fallu quarante-six ans pour bâtir ce temple », et Josèphe dit que les travaux ne s’achevèrent que dans les années 60 apr. J.-C., quelques années avant que les Romains le détruisent en 70 apr. J.-C. Comme les sacrifices ne cessèrent jamais, il compte comme le même second Temple."
  pl:
    - "Drugą Świątynię ukończono w szóstym roku Dariusza I, wiosną 515 p.n.e., około dwadzieścia lat po powrocie pierwszych wygnańców z Babilonu i jakieś siedemdziesiąt lat po tym, jak Babilończycy spalili Świątynię Salomona w 587 lub 586 p.n.e.; mapa zaokrągla to do około 516 p.n.e., jak wiele podręczników, ponieważ ten rok Dariusza zaczął się wiosną 516."
    - "Ezdrasz opowiada tę historię etapami. W 538 p.n.e., „Roku pierwszego Cyrusa, króla Perskiego”, król zarządził: „a ten niech idzie do Jeruzalemu, które jest w Judztwie, a niech buduje dom Pana, Boga Izraelskiego.” W drugim roku po powrocie założono fundament, a starcy, „którzy widzieli dom pierwszy”, płakali na ten widok. Potem praca ustała, „aż do wtórego roku królestwa Daryjusza, króla Perskiego”, 520 p.n.e., gdy Aggeusz i Zachariasz pobudzili Zorobabela i arcykapłana Jozuego do ponownej budowy; Aggeusz datuje swoją pierwszą wyrocznię na pierwszy dzień szóstego miesiąca tego roku. „I dokończony jest on dom trzeciego dnia miesiąca Adar, a ten był rok szósty panowania Daryjusza króla”, datę, którą babilońskie tablice kalendarzowe umieszczają w marcu 515 p.n.e."
    - "Herod Wielki odbudował tę Świątynię od fundamentów w ostatnich dziesięcioleciach I wieku p.n.e., zaczynając, jak mówi Józef Flawiusz, w osiemnastym roku swego panowania, około 20 p.n.e.; samo sanktuarium ukończono szybko, ale dziedzińce i portyki wciąż budowano za dni Jezusa, dlatego Żydzi powiedzieli mu: „Czterdzieści i sześć lat budowano ten kościół”, a Józef Flawiusz mówi, że prace zakończyły się dopiero w latach 60. n.e., kilka lat przed jej zniszczeniem przez Rzymian w 70 n.e. Ponieważ ofiary nigdy nie ustały, uważa się ją za tę samą Drugą Świątynię."
  it:
    - "Il Secondo Tempio fu terminato nel sesto anno di Dario I, nella primavera del 515 a.C., circa vent’anni dopo il ritorno dei primi esuli da Babilonia e circa settant’anni dopo che i Babilonesi bruciarono il Tempio di Salomone nel 587 o 586 a.C.; la mappa arrotonda al 516 a.C. circa, come fanno molti manuali, poiché quell’anno di Dario cominciò nella primavera del 516."
    - "Esdra racconta la storia per tappe. Nel 538 a.C., «Nel primo anno di Ciro, re di Persia», il re decretò: «e salga a Gerusalemme, ch’è in Giuda, ed edifichi la casa dell’Eterno, dell’Iddio d’Israele». Nel secondo anno dopo il ritorno furono poste le fondamenta, e i vecchi «che avean veduta la prima casa» piansero a quella vista. Poi il lavoro si fermò, «fino al secondo anno del regno di Dario, re di Persia», il 520 a.C., quando Aggeo e Zaccaria spinsero Zorobabele e il sommo sacerdote Giosuè a costruire di nuovo; Aggeo data il suo primo oracolo al primo giorno del sesto mese di quell’anno. «E la casa fu finita il terzo giorno del mese d’Adar, il sesto anno del regno di Dario», data che le tavole del calendario babilonese pongono nel marzo del 515 a.C."
    - "Erode il Grande ricostruì questo Tempio dalle fondamenta negli ultimi decenni del I secolo a.C., cominciando, dice Giuseppe Flavio, nel diciottesimo anno del suo regno, circa il 20 a.C.; il santuario fu finito presto, ma i cortili e i portici erano ancora in costruzione ai tempi di Gesù, ed è per questo che i Giudei gli dissero «Quarantasei anni è durata la fabbrica di questo tempio», e Giuseppe Flavio dice che i lavori terminarono solo negli anni 60 d.C., pochi anni prima che i Romani lo distruggessero nel 70 d.C. Poiché i sacrifici non cessarono mai, esso conta come lo stesso Secondo Tempio."
  nl:
    - "De Tweede Tempel werd voltooid in het zesde jaar van Darius I, in de lente van 515 v.Chr., ongeveer twintig jaar nadat de eerste ballingen uit Babylon waren teruggekeerd en zo’n zeventig jaar nadat de Babyloniërs de tempel van Salomo in 587 of 586 v.Chr. hadden verbrand; de kaart rondt dit af op ca. 516 v.Chr., zoals veel handboeken, aangezien dat jaar van Darius in de lente van 516 begon."
    - "Ezra vertelt het verhaal in etappes. In 538 v.Chr., “in het eerste jaar nu van Kores, koning van Perzië”, decreteerde de koning: “hij trekke op naar Jeruzalem, dat in Juda is, en hij bouwe het huis des HEEREN, des Gods van Israel.” In het tweede jaar na de terugkeer werd het fundament gelegd, en de oude mannen “die het eerste huis gezien hadden”, weenden bij het zien ervan. Daarna lag het werk stil, “tot in het tweede jaar van het koninkrijk van Darius, den koning van Perzië”, 520 v.Chr., toen Haggai en Zacharia Zerubbabel en de hogepriester Jozua aanzetten opnieuw te bouwen; Haggai dateert zijn eerste godsspraak op de eerste dag van de zesde maand van dat jaar. “En dit huis werd volbracht op den derden dag der maand Adar; datzelve was het zesde jaar van het koninkrijk van den koning Darius”, een datum die de Babylonische kalendertabellen in maart 515 v.Chr. plaatsen."
    - "Herodes de Grote herbouwde deze tempel van de grond af in de laatste decennia van de eerste eeuw v.Chr., beginnend, zegt Josephus, in het achttiende jaar van zijn regering, omstreeks 20 v.Chr.; het heiligdom zelf was snel klaar, maar de voorhoven en zuilengangen werden in de tijd van Jezus nog gebouwd, en daarom zeiden de Joden tot Hem: “Zes en veertig jaren is over dezen tempel gebouwd”, en Josephus zegt dat het werk pas in de jaren 60 n.Chr. eindigde, enkele jaren voordat de Romeinen hem in 70 n.Chr. verwoestten. Omdat de offers nooit ophielden, geldt hij als dezelfde Tweede Tempel."
  cs:
    - "Druhý chrám byl dokončen v šestém roce Dareia I., na jaře 515 př. n. l., asi dvacet let po návratu prvních vyhnanců z Babylónu a asi sedmdesát let poté, co Babyloňané spálili Šalomounův chrám roku 587 nebo 586 př. n. l.; mapa to zaokrouhluje na asi 516 př. n. l., jak činí mnohé příručky, neboť onen rok Dareiův začal na jaře 516."
    - "Ezdráš vypráví příběh po etapách. Roku 538 př. n. l., „léta prvního Cýra krále Perského“, král nařídil: „a nechať jde do Jeruzaléma, kterýž jest v Judstvu, a staví dům Hospodina Boha Izraelského.“ Ve druhém roce po návratu byl položen základ a starci, „kteříž byli viděli prvnější dům“, při pohledu plakali. Pak se práce zastavila „až do druhého léta kralování Daria krále Perského“, 520 př. n. l., kdy Ageus a Zacharjáš podnítili Zerubábela a velekněze Jozua, aby stavěli znovu; Ageus datuje své první proroctví na první den šestého měsíce onoho roku. „A dokonán jest ten dům k třetímu dni měsíce Adar, a ten byl rok šestý kralování Daria krále“, datum, které babylonské kalendářní tabulky kladou do března 515 př. n. l."
    - "Herodes Veliký tento chrám přestavěl od základů v posledních desetiletích 1. století př. n. l., počínaje, jak praví Josephus Flavius, osmnáctým rokem své vlády, asi 20 př. n. l.; samotná svatyně byla dokončena rychle, ale nádvoří a sloupořadí se stavěla ještě za Ježíšových dnů, a proto mu Židé řekli: „Čtyřidceti a šest let dělán jest chrám tento“, a Josephus Flavius praví, že práce skončily teprve v šedesátých letech n. l., několik let před jeho zničením Římany roku 70 n. l. Protože se oběti nikdy nepřerušily, počítá se za týž druhý chrám."
  sv:
    - "Det andra templet stod färdigt i Dareios I:s sjätte år, våren 515 f.Kr., omkring tjugo år efter att de första bortförda återvänt från Babylon och omkring sjuttio år efter att babylonierna brände Salomos tempel 587 eller 586 f.Kr.; kartan avrundar detta till omkring 516 f.Kr., som många handböcker gör, eftersom det året av Dareios började våren 516."
    - "Esra berättar historien i etapper. År 538 f.Kr., ”i den persiske konungen Kores’ första regeringsår”, bestämde kungen: ”han drage upp till Jerusalem i Juda för att bygga på HERRENS, Israels Guds, hus.” Det andra året efter återkomsten lades grunden, och de gamla ”som hade sett det förra huset” grät vid åsynen. Sedan upphörde arbetet, ”ända till den persiske konungen Darejaves’ andra regeringsår”, 520 f.Kr., då Haggai och Sakarja eggade Serubbabel och översteprästen Josua att bygga på nytt; Haggai daterar sin första utsaga till första dagen i sjätte månaden det året. ”Och huset blev färdigt till den tredje dagen i månaden Adar, i konung Darejaves’ sjätte regeringsår”, ett datum som de babyloniska kalendertabellerna förlägger till mars 515 f.Kr."
    - "Herodes den store återuppbyggde detta tempel från grunden under de sista decennierna av första århundradet f.Kr., och började, säger Josefus, i sitt artonde regeringsår, omkring 20 f.Kr.; själva helgedomen blev färdig snabbt, men förgårdarna och pelargångarna byggdes fortfarande på Jesu tid, och därför sade judarna till honom: ”I fyrtiosex år har man byggt på detta tempel”, och Josefus säger att arbetet avslutades först på 60-talet e.Kr., några år innan romarna förstörde det år 70 e.Kr. Eftersom offren aldrig upphörde räknas det som samma andra tempel."
  nb:
    - "Det andre tempelet ble fullført i Dareios Is sjette år, våren 515 f.Kr., omtrent tjue år etter at de første bortførte vendte hjem fra Babylon og omtrent sytti år etter at babylonerne brente Salomos tempel i 587 eller 586 f.Kr.; kartet runder av til ca. 516 f.Kr., slik mange håndbøker gjør, siden dette Dareios-året begynte våren 516."
    - "Esra forteller historien i trinn. I 538 f.Kr., «i perserkongen Kyros' første år», bestemte kongen: «han kan dra op til Jerusalem i Juda og bygge Herrens, Israels Guds hus!» I det andre året etter hjemkomsten ble grunnvollen lagt, og de gamle «som hadde sett det første hus» gråt ved synet. Så stanset arbeidet, «før i det annet år av perserkongen Darius' regjering», 520 f.Kr., da Haggai og Sakarja eggte Serubabel og øverstepresten Josva til å bygge igjen; Haggai daterer sitt første ord til første dag i den sjette måneden det året. «Så blev da dette hus fullt ferdig til den tredje dag i måneden adar i det sjette år av kong Darius' regjering», en dato som de babylonske kalendertabellene setter til mars 515 f.Kr."
    - "Herodes den store gjenreiste dette tempelet fra grunnen av i de siste tiårene av det første århundre f.Kr., og begynte, sier Josefus, i sitt attende regjeringsår, omkring 20 f.Kr.; selve helligdommen ble fullført raskt, men forgårdene og søylegangene var fortsatt under bygging på Jesu tid, og derfor sa jødene til ham: «I seks og firti år har det vært bygget på dette tempel», og Josefus sier at arbeidet først ble avsluttet i 60-årene e.Kr., noen få år før romerne ødela det i 70 e.Kr. Fordi ofringene aldri opphørte, regnes det som det samme andre tempelet."
  tl:
    - "Natapos ang Ikalawang Templo sa ikaanim na taon ni Dario I, sa tagsibol ng 515 BK, mga dalawampung taon pagkatapos bumalik ang unang mga ipinatapon mula sa Babilonia at mga pitumpung taon pagkatapos sunugin ng mga Babilonio ang Templo ni Salomon noong 587 o 586 BK; binibilog ito ng mapa sa c. 516 BK, gaya ng maraming aklat-gabay, yamang nagsimula ang taong iyon ni Dario sa tagsibol ng 516."
    - "Isinasalaysay ni Ezra ang kuwento sa mga yugto. Noong 538 BK, “nang unang taon nga ni Ciro na hari sa Persia”, nag-utos ang hari: “umahon siya sa Jerusalem, na nasa Juda, at itayo ang bahay ng Panginoon, ng Dios ng Israel.” Sa ikalawang taon pagkabalik, inilatag ang pundasyon, at umiyak ang matatandang “nangakakita ng unang bahay” sa tanawin. Pagkatapos ay tumigil ang gawain “hanggang sa ikalawang taon ng paghahari ni Dario, na hari sa Persia”, 520 BK, nang udyukan nina Haggeo at Zacharias si Zorobabel at ang mataas na saserdoteng si Josue na magtayo muli; itinatakda ni Haggeo ang una niyang orakulo sa unang araw ng ikaanim na buwan ng taong iyon. “At ang bahay na ito ay nayari nang ikatlong araw ng buwan ng Adar, nang ikaanim na taon ng paghahari ni Dario na hari”, petsang inilalagay ng mga talahanayan ng kalendaryong Babilonio sa Marso 515 BK."
    - "Muling itinayo ni Herodes na Dakila ang Templong ito mula sa pundasyon sa mga huling dekada ng unang siglo BK, na nagsimula, ayon kay Josephus, sa ikalabingwalong taon ng kaniyang paghahari, mga 20 BK; mabilis na natapos ang santuwaryo, ngunit itinatayo pa ang mga bulwagan at portiko noong panahon ni Jesus, kaya sinabi sa kaniya ng mga Judio na “Apat na pu't anim na taon ang pagtatayo ng templong ito”, at sinasabi ni Josephus na natapos lamang ang gawain noong dekada 60 AD, ilang taon bago ito winasak ng mga Romano noong 70 AD. Yamang hindi tumigil ang mga paghahandog, itinuturing itong parehong Ikalawang Templo."
  da:
    - "Det andet tempel stod færdigt i Darius I's sjette år, i foråret 515 f.Kr., omkring tyve år efter, at de første bortførte vendte hjem fra Babylon, og omkring halvfjerds år efter, at babylonierne brændte Salomos tempel i 587 eller 586 f.Kr.; kortet runder det af til ca. 516 f.Kr., som mange håndbøger gør, da det år af Darius begyndte i foråret 516."
    - "Ezra fortæller historien i etaper. I 538 f.Kr., »i Kyrus's, Kongen af Persiens, første Aar«, påbød kongen: »og han drage op til Jerusalem, som er i Juda, og han bygge Herren Israels Guds Hus«. Det andet år efter hjemkomsten blev grundvolden lagt, og de gamle, »som havde set det første Hus«, græd ved synet. Så standsede arbejdet »indtil Darius's, Kongen i Persiens, andet Regeringsaar«, 520 f.Kr., da Haggaj og Zakarias fik Zerubbabel og ypperstepræsten Josva til at bygge igen; Haggaj dater sit første orakel til første dag i sjette måned det år. »Og det Hus blev fuldt færdigt til den tredje Dag i Adar Maaned, i Kong Darius's Regerings sjette Aar«, en dato, som de babyloniske kalendertabeller placerer i marts 515 f.Kr."
    - "Herodes den Store genopbyggede dette tempel fra grunden i de sidste årtier af det første århundrede f.Kr., begyndende, siger Josefus, i sit attende regeringsår, omkring 20 f.Kr.; selve helligdommen blev hurtigt færdig, men forgårdene og søjlegangene var stadig under opførelse i Jesu dage, hvorfor jøderne sagde til ham: »I seks og fyrretyve Aar er der bygget paa dette Tempel«, og Josefus siger, at arbejdet først sluttede i 60'erne e.Kr., få år før romerne ødelagde det i 70 e.Kr. Fordi ofringerne aldrig ophørte, regnes det for det samme andet tempel."
  sr:
    - "Други храм довршен је у шестој години Дарија I, у пролеће 515. п. н. е., око двадесет година пошто су се први изгнаници вратили из Вавилона и неких седамдесет година пошто су Вавилонци спалили Соломунов Храм 587. или 586. п. н. е.; карта то заокружује на око 516. п. н. е., као многи приручници, јер је та година Дарија почела у пролеће 516."
    - "Јездра прича причу по етапама. Године 538. п. н. е., „Прве године Кира, цара персијског“, краљ је наредио: „нек иде у Јерусалим у Јудеји, и нека зида дом Господа Бога Израиљевог“. У другој години после повратка положен је темељ, а старци „који беху видели пређашњи дом“ плакали су при том погледу. Затим је рад стао „до друге године царовања Дарија, цара персијског“, 520. п. н. е., када су Агеј и Захарија подстакли Зоровавеља и првосвештеника Исуса да поново граде; Агеј датира своје прво пророштво првим даном шестог месеца те године. „И сврши се тај дом до трећег дана месеца Адара шесте године царовања цара Дарија“, датум који вавилонске календарске таблице смештају у март 515. п. н. е."
    - "Ирод Велики је из темеља обновио овај Храм у последњим деценијама 1. века п. н. е., почевши, како каже Јосиф Флавије, у осамнаестој години своје владавине, око 20. п. н. е.; сама светиња довршена је брзо, али су дворишта и тремови још грађени у Исусово доба, зато су му Јевреји рекли: „Четрдесет и шест година грађена је ова црква“, а Јосиф Флавије каже да је рад завршен тек 60-их година н. е., неколико година пре него што су га Римљани разорили 70. н. е. Пошто се жртве никад нису прекидале, он се рачуна као исти Други храм."
