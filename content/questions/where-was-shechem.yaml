id: where-was-shechem
question:
  en: "Where was Shechem?"
  ru: "Где находился Сихем?"
  uk: "Де був Сихем?"
  es: "¿Dónde estaba Siquem?"
  pt: "Onde ficava Siquém?"
  de: "Wo lag Sichem?"
  fr: "Où se trouvait Sichem ?"
answer:
  en:
    - "Shechem was the mound of Tell Balata on the eastern edge of today's Nablus in the West Bank, in the pass between Mount Gerizim and Mount Ebal, where the roads of the central hill country cross. The map's point stands on the mound, about 49 km north of Jerusalem in a straight line, 11 km south-east of Samaria and 18 km north of Shiloh; Mount Gerizim's summit is about 1.8 km away and Ebal's 2.4 km. History Globe has an article on Shechem and its history; this answer keeps to where it was."
    - "It is the first place in Canaan that Genesis names: “Abram passed through the land unto the place of Sichem, unto the plain of Moreh.” Jacob, back from Padan-aram, bought “a parcel of a field” before the city, and there the bones of Joseph were later buried. Joseph's brothers fed their father's flock “in Shechem”, about 78 km north of Hebron in a straight line. Joshua gathered all the tribes to Shechem to renew the covenant; it was one of the cities of refuge, “Shechem in mount Ephraim”; and when “all Israel were come to Shechem” to make Rehoboam king, the kingdom divided there, about 931 BC, and Jeroboam “built Shechem in mount Ephraim, and dwelt therein”."
    - "The site was identified only in 1903, by Hermann Thiersch: the town had moved to Flavia Neapolis, founded in AD 72 a little to the west, which Arabic made Nablus, while the old mound kept the ruins. German excavations under Ernst Sellin from 1913 and the American Drew–McCormick expedition under G. Ernest Wright from 1956 uncovered the Middle Bronze Age walls, gates and fortress temple. Nearby lie Jacob's well and the village of Askar, usually taken for the Sychar of John's Gospel, about 0.8 km from the mound, and the shrine shown as Joseph's tomb."
  ru:
    - "Сихем — это холм Телль-Балата на восточной окраине нынешнего Наблуса на Западном берегу, в перевале между горами Гаризим и Гевал, где сходятся дороги центрального нагорья. Точка карты стоит на холме, примерно в 49 км к северу от Иерусалима по прямой, в 11 км к юго-востоку от Самарии и в 18 км к северу от Силома; вершина Гаризима — примерно в 1,8 км, Гевала — в 2,4 км. В History Globe есть статья о Сихеме и его истории; здесь ответ о том, где он был."
    - "Это первое место в Ханаане, которое называет Книга Бытия: «И прошел Аврам по земле сей по длине ее до места Сихема, до дубравы Море». Иаков, вернувшись из Месопотамии, купил перед городом «часть поля», и там позднее схоронили кости Иосифа. Братья Иосифа пасли скот отца «в Сихеме», примерно в 78 км к северу от Хеврона по прямой. Иисус Навин собрал в Сихем все колена, чтобы обновить завет; это был один из городов убежища — «Сихем на горе Ефремовой»; и когда «в Сихем пришли все Израильтяне, чтобы воцарить» Ровоама, там около 931 г. до н. э. разделилось царство, а Иеровоам «обстроил… Сихем на горе Ефремовой и поселился в нем»."
    - "Место опознал лишь в 1903 году Герман Тирш: город с его жителями перешёл в Неаполь (Флавия Неаполис), основанный в 72 г. н. э. немного западнее, — по-арабски Наблус, а древний холм сохранил развалины. Немецкие раскопки Эрнста Зеллина с 1913 года и американская экспедиция Дрю-Маккормик под руководством Дж. Эрнеста Райта с 1956 года открыли стены, ворота и храм-крепость среднего бронзового века. Рядом, примерно в 0,8 км от холма, лежат колодец Иакова и селение Аскар, которое обычно считают евангельским Сихарем, а также святилище, которое показывают как гробницу Иосифа."
  uk:
    - "Сихем був пагорбом Телль-Балата на східній околиці нинішнього Наблуса на Західному березі Йордану, у перевалі між горою Гарізім і горою Гевал, де перетинаються дороги центрального нагір'я. Точка на мапі стоїть на пагорбі, приблизно за 49 км на північ від Єрусалима по прямій, за 11 км на південний схід від Самарії і за 18 км на північ від Шіло; вершина Гарізіма — приблизно за 1,8 км, а Гевала — за 2,4 км. В «Історичному глобусі» є стаття про Сихем та його історію; ця відповідь стосується лише того, де він був."
    - "Це перше місце в Ханаані, яке називає Книга Буття: «І пройшов Аврам землю до врочища Сихема, до дубрави Море́». Яків, повернувшись із Падан-Араму, купив «частину поля» перед містом, і там пізніше поховали кості Йосипа. Брати Йосипа «погнались ... з отецькими вівцями в Сихем», приблизно за 78 км на північ від Хеврона по прямій. Ісус Навин зібрав усі коліна в Сихемі, щоб відновити заповіт; це було одне з міст-захистків, «Сихем на Ефраїмовій горі»; а коли «в Сихемі скупивсь увесь Ізраїль», щоб окликнути Ровоама царем, царство розділилося саме там, близько 931 р. до н. е., і Єровоам «укріпив ... Сихем на Ефраїм-горах та й осївся там»."
    - "Місце було ототожнене лише 1903 р. Германом Тіршем: місто перемістилося до Флавії Неаполіса, заснованого 72 р. н. е. трохи західніше, що арабською стало Наблусом, а старий пагорб зберіг руїни. Німецькі розкопки під керівництвом Ернста Селліна від 1913 р. та американська експедиція Дрю–Мак-Кормік під керівництвом Дж. Ернеста Райта від 1956 р. відкрили мури, брами й храм-фортецю середнього бронзового віку. Поблизу лежать колодязь Якова і село Аскар, яке зазвичай вважають Сихаром Євангелія від Івана, приблизно за 0,8 км від пагорба, та святиня, яку показують як гробницю Йосипа."
  es:
    - "Siquem era el montículo de Tell Balata, en el borde oriental de la actual Nablus, en Cisjordania, en el paso entre el monte Gerizim y el monte Ebal, donde se cruzan los caminos de la región montañosa central. El punto del mapa está sobre el montículo, a unos 49 km al norte de Jerusalén en línea recta, a 11 km al sureste de Samaria y a 18 km al norte de Silo; la cima del Gerizim queda a unos 1,8 km y la del Ebal a 2,4 km. History Globe tiene un artículo sobre Siquem y su historia; esta respuesta se ciñe a dónde estaba."
    - "Es el primer lugar de Canaán que nombra el Génesis: «Y pasó Abram por aquella tierra hasta el lugar de Sichêm, hasta el valle de Moreh». Jacob, de regreso de Padan-aram, compró «una parte del campo» delante de la ciudad, y allí fueron sepultados más tarde los huesos de José. Los hermanos de José apacentaban el rebaño de su padre «en Sichêm», a unos 78 km al norte de Hebrón en línea recta. Josué reunió a todas las tribus en Siquem para renovar la alianza; fue una de las ciudades de refugio, «Sichêm en el monte de Ephraim»; y cuando «todo Israel había venido á Sichêm» para hacer rey a Roboam, el reino se dividió allí, hacia el 931 a. C., y Jeroboam «reedificó… á Sichêm en el monte de Ephraim, y habitó en ella»."
    - "El lugar solo fue identificado en 1903, por Hermann Thiersch: la ciudad se había trasladado a Flavia Neápolis, fundada en el 72 d. C. un poco al oeste, que el árabe convirtió en Nablus, mientras el antiguo montículo conservaba las ruinas. Las excavaciones alemanas de Ernst Sellin desde 1913 y la expedición estadounidense Drew–McCormick de G. Ernest Wright desde 1956 sacaron a la luz las murallas, puertas y el templo-fortaleza del Bronce Medio. Cerca están el pozo de Jacob y la aldea de Askar, que por lo común se toma por la Sicar del Evangelio de Juan, a unos 0,8 km del montículo, y el santuario que se muestra como tumba de José."
  pt:
    - "Siquém era o monte de Tell Balata, na orla oriental da atual Nablus, na Cisjordânia, na passagem entre o monte Gerizim e o monte Ebal, onde se cruzam as estradas da região montanhosa central. O ponto do mapa fica sobre o monte, a cerca de 49 km ao norte de Jerusalém em linha reta, 11 km a sudeste de Samaria e 18 km ao norte de Siló; o cume do Gerizim fica a cerca de 1,8 km e o do Ebal a 2,4 km. O History Globe tem um artigo sobre Siquém e sua história; esta resposta trata apenas de onde ficava."
    - "É o primeiro lugar em Canaã que o Gênesis nomeia: “Abrão atravessou a terra até o lugar de Siquém, até o carvalho de Moré.” Jacó, de volta de Padã-Arã, comprou “a porção de terra” diante da cidade, e ali foram sepultados mais tarde os ossos de José. Os irmãos de José apascentavam o rebanho do pai “em Siquém”, a cerca de 78 km ao norte de Hebrom em linha reta. Josué reuniu todas as tribos em Siquém para renovar a aliança; foi uma das cidades de refúgio, “Siquém, na região montanhosa de Efraim”; e quando “todo o Israel tinha ido a Siquém” para fazer Roboão rei, o reino se dividiu ali, por volta de 931 a.C., e Jeroboão “edificou Siquém na região montanhosa de Efraim, e morou nela”."
    - "O sítio só foi identificado em 1903, por Hermann Thiersch: a cidade havia se mudado para Flávia Neápolis, fundada no ano 72 d.C. um pouco a oeste, que o árabe transformou em Nablus, enquanto o antigo monte conservou as ruínas. As escavações alemãs sob Ernst Sellin a partir de 1913 e a expedição americana Drew–McCormick sob G. Ernest Wright a partir de 1956 trouxeram à luz as muralhas, portas e o templo-fortaleza da Idade do Bronze Média. Nas proximidades ficam o poço de Jacó e a aldeia de Askar, geralmente tomada pela Sicar do Evangelho de João, a cerca de 0,8 km do monte, e o santuário mostrado como túmulo de José."
  de:
    - "Sichem war der Hügel Tell Balata am Ostrand des heutigen Nablus im Westjordanland, im Pass zwischen dem Garizim und dem Ebal, wo sich die Straßen des zentralen Berglands kreuzen. Der Kartenpunkt steht auf dem Hügel, in der Luftlinie etwa 49 km nördlich von Jerusalem, 11 km südöstlich von Samaria und 18 km nördlich von Silo; der Gipfel des Garizim ist etwa 1,8 km entfernt, der des Ebal 2,4 km. History Globe hat einen Artikel über Sichem und seine Geschichte; diese Antwort beschränkt sich darauf, wo es lag."
    - "Es ist der erste Ort in Kanaan, den die Genesis nennt: „zog Abram durch bis an die Stätte Sichem und an den Hain More.“ Jakob, zurück aus Paddan-Aram, kaufte vor der Stadt „ein Stück Acker“, und dort wurden später die Gebeine Josefs begraben. Josefs Brüder weideten die Herde ihres Vaters „in Sichem“, in der Luftlinie etwa 78 km nördlich von Hebron. Josua versammelte alle Stämme in Sichem, um den Bund zu erneuern; es war eine der Freistädte, „Sichem auf dem Gebirge Ephraim“; und als „das ganze Israel war gen Sichem gekommen“, um Rehabeam zum König zu machen, teilte sich dort das Reich, um 931 v. Chr., und Jerobeam „baute Sichem auf dem Gebirge Ephraim und wohnte darin“."
    - "Die Stätte wurde erst 1903 von Hermann Thiersch identifiziert: Die Stadt war nach Flavia Neapolis umgezogen, 72 n. Chr. etwas weiter westlich gegründet und im Arabischen zu Nablus geworden, während der alte Hügel die Ruinen bewahrte. Deutsche Grabungen unter Ernst Sellin ab 1913 und die amerikanische Drew-McCormick-Expedition unter G. Ernest Wright ab 1956 legten die mittelbronzezeitlichen Mauern, Tore und den Festungstempel frei. In der Nähe liegen der Jakobsbrunnen und das Dorf Askar, meist für das Sychar des Johannesevangeliums gehalten, etwa 0,8 km vom Hügel entfernt, sowie die als Josefsgrab gezeigte Stätte."
  fr:
    - "Sichem était le tertre de Tell Balata, à la lisière orientale de l’actuelle Naplouse, en Cisjordanie, dans le défilé entre le mont Garizim et le mont Ébal, là où se croisent les routes de la région montagneuse centrale. Le point de la carte se trouve sur le tertre, à environ 49 km au nord de Jérusalem à vol d’oiseau, à 11 km au sud-est de Samarie et à 18 km au nord de Silo ; le sommet du Garizim est à environ 1,8 km, celui de l’Ébal à 2,4 km. History Globe consacre un article à Sichem et à son histoire ; cette réponse se limite à son emplacement."
    - "C’est le premier lieu de Canaan que nomme la Genèse : « Abram parcourut le pays jusqu’au lieu nommé Sichem, jusqu’aux chênes de Moré. » Jacob, de retour de Paddan-Aram, acheta devant la ville « la portion du champ où il avait dressé sa tente », et c’est là que furent plus tard enterrés les os de Joseph. Les frères de Joseph étaient allés « à Sichem, pour faire paître le troupeau de leur père », à environ 78 km au nord d’Hébron à vol d’oiseau. Josué réunit toutes les tribus à Sichem pour renouveler l’alliance ; elle fut l’une des villes de refuge, « Sichem, dans la montagne d’Éphraïm » ; et quand « tout Israël était venu à Sichem pour le faire roi », c’est-à-dire Roboam, le royaume s’y divisa, vers 931 av. J.-C., et Jéroboam « bâtit Sichem sur la montagne d’Éphraïm, et il y demeura »."
    - "Le site ne fut identifié qu’en 1903, par Hermann Thiersch : la ville s’était déplacée vers Flavia Néapolis, fondée en 72 apr. J.-C. un peu plus à l’ouest, que l’arabe transforma en Naplouse, tandis que l’ancien tertre gardait les ruines. Les fouilles allemandes d’Ernst Sellin à partir de 1913 et l’expédition américaine Drew-McCormick de G. Ernest Wright à partir de 1956 ont mis au jour les remparts, les portes et le temple-forteresse de l’âge du Bronze moyen. À proximité se trouvent le puits de Jacob et le village d’Askar, généralement tenu pour le Sychar de l’Évangile de Jean, à environ 0,8 km du tertre, ainsi que le sanctuaire montré comme le tombeau de Joseph."
