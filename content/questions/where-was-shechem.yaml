id: where-was-shechem
question:
  en: "Where was Shechem?"
  ru: "Где находился Сихем?"
  uk: "Де був Сихем?"
  es: "¿Dónde estaba Siquem?"
  pt: "Onde ficava Siquém?"
  de: "Wo lag Sichem?"
  fr: "Où se trouvait Sichem ?"
  pl: "Gdzie leżał Sychem?"
  it: "Dov’era Sichem?"
  cs: "Kde ležel Šekem?"
  nl: "Waar lag Sichem?"
  sv: "Var låg Shekem?"
  nb: "Hvor lå Sikem?"
  tl: "Nasaan ang Sichem?"
  da: "Hvor lå Sikem?"
answer:
  en:
    - "Shechem was the mound of Tell Balata on the eastern edge of today's Nablus in the West Bank, in the pass between Mount Gerizim and Mount Ebal, where the roads of the central hill country cross. The map's point stands on the mound, about 49 km north of Jerusalem in a straight line, 11 km south-east of Samaria and 18 km north of Shiloh; Mount Gerizim's summit is about 1.8 km away and Ebal's 2.4 km. History Globe has an article on Shechem and its history; this answer keeps to where it was."
    - "It is the first place in Canaan that Genesis names: “Abram passed through the land unto the place of Sichem, unto the plain of Moreh.” Jacob, back from Padan-aram, bought “a parcel of a field” before the city, and there the bones of Joseph were later buried. Joseph's brothers fed their father's flock “in Shechem”, about 78 km north of Hebron in a straight line. Joshua gathered all the tribes to Shechem to renew the covenant; it was one of the cities of refuge, “Shechem in mount Ephraim”; and when “all Israel were come to Shechem” to make Rehoboam king, the kingdom divided there, about 931 BC, and Jeroboam “built Shechem in mount Ephraim, and dwelt therein”."
    - "The site was identified only in 1903, by Hermann Thiersch: the town had moved to Flavia Neapolis, founded in AD 72 a little to the west, which Arabic made Nablus, while the old mound kept the ruins. German excavations under Ernst Sellin from 1913 and the American Drew–McCormick expedition under G. Ernest Wright from 1956 uncovered the Middle Bronze Age walls, gates and fortress temple. Nearby lie Jacob's well and the village of Askar, usually taken for the Sychar of John's Gospel, about 0.8 km from the mound, and the shrine shown as Joseph's tomb."
  ru:
    - "Сихем — это холм Телль-Балата на восточной окраине нынешнего Наблуса на Западном берегу, в перевале между горами Гаризим и Гевал, где сходятся дороги центрального нагорья. Точка карты стоит на холме, примерно в 49 км к северу от Иерусалима по прямой, в 11 км к юго-востоку от Самарии и в 18 км к северу от Силома; вершина Гаризима — примерно в 1,8 км, Гевала — в 2,4 км. В History Globe есть статья о Сихеме и его истории; здесь ответ о том, где он был."
    - "Это первое место в Ханаане, которое называет Книга Бытия: «И прошел Аврам по земле сей по длине ее до места Сихема, до дубравы Море». Иаков, вернувшись из Месопотамии, купил перед городом «часть поля», и там позднее схоронили кости Иосифа. Братья Иосифа пасли скот отца «в Сихеме», примерно в 78 км к северу от Хеврона по прямой. Иисус Навин собрал в Сихем все колена, чтобы обновить завет; это был один из городов убежища — «Сихем на горе Ефремовой»; и когда «в Сихем пришли все Израильтяне, чтобы воцарить» Ровоама, там около 931 г. до н. э. разделилось царство, а Иеровоам «обстроил… Сихем на горе Ефремовой и поселился в нем»."
    - "Место опознал лишь в 1903 году Герман Тирш: город с его жителями перешёл в Неаполь (Флавия Неаполис), основанный в 72 г. н. э. немного западнее, — по-арабски Наблус, а древний холм сохранил развалины. Немецкие раскопки Эрнста Зеллина с 1913 года и американская экспедиция Дрю-Маккормик под руководством Дж. Эрнеста Райта с 1956 года открыли стены, ворота и храм-крепость среднего бронзового века. Рядом, примерно в 0,8 км от холма, лежат колодец Иакова и селение Аскар, которое обычно считают евангельским Сихарем, а также святилище, которое показывают как гробницу Иосифа."
  uk:
    - "Сихем був пагорбом Телль-Балата на східній околиці нинішнього Наблуса на Західному березі Йордану, у перевалі між горою Гарізім і горою Гевал, де перетинаються дороги центрального нагір'я. Точка на мапі стоїть на пагорбі, приблизно за 49 км на північ від Єрусалима по прямій, за 11 км на південний схід від Самарії і за 18 км на північ від Шіло; вершина Гарізіма — приблизно за 1,8 км, а Гевала — за 2,4 км. В «Історичному глобусі» є стаття про Сихем та його історію; ця відповідь стосується лише того, де він був."
    - "Це перше місце в Ханаані, яке називає Книга Буття: «І пройшов Аврам землю до врочища Сихема, до дубрави Море́». Яків, повернувшись із Падан-Араму, купив «частину поля» перед містом, і там пізніше поховали кості Йосипа. Брати Йосипа «погнались ... з отецькими вівцями в Сихем», приблизно за 78 км на північ від Хеврона по прямій. Ісус Навин зібрав усі коліна в Сихемі, щоб відновити заповіт; це було одне з міст-захистків, «Сихем на Ефраїмовій горі»; а коли «в Сихемі скупивсь увесь Ізраїль», щоб окликнути Ровоама царем, царство розділилося саме там, близько 931 р. до н. е., і Єровоам «укріпив ... Сихем на Ефраїм-горах та й осївся там»."
    - "Місце було ототожнене лише 1903 р. Германом Тіршем: місто перемістилося до Флавії Неаполіса, заснованого 72 р. н. е. трохи західніше, що арабською стало Наблусом, а старий пагорб зберіг руїни. Німецькі розкопки під керівництвом Ернста Селліна від 1913 р. та американська експедиція Дрю–Мак-Кормік під керівництвом Дж. Ернеста Райта від 1956 р. відкрили мури, брами й храм-фортецю середнього бронзового віку. Поблизу лежать колодязь Якова і село Аскар, яке зазвичай вважають Сихаром Євангелія від Івана, приблизно за 0,8 км від пагорба, та святиня, яку показують як гробницю Йосипа."
  es:
    - "Siquem era el montículo de Tell Balata, en el borde oriental de la actual Nablus, en Cisjordania, en el paso entre el monte Gerizim y el monte Ebal, donde se cruzan los caminos de la región montañosa central. El punto del mapa está sobre el montículo, a unos 49 km al norte de Jerusalén en línea recta, a 11 km al sureste de Samaria y a 18 km al norte de Silo; la cima del Gerizim queda a unos 1,8 km y la del Ebal a 2,4 km. History Globe tiene un artículo sobre Siquem y su historia; esta respuesta se ciñe a dónde estaba."
    - "Es el primer lugar de Canaán que nombra el Génesis: «Y pasó Abram por aquella tierra hasta el lugar de Sichêm, hasta el valle de Moreh». Jacob, de regreso de Padan-aram, compró «una parte del campo» delante de la ciudad, y allí fueron sepultados más tarde los huesos de José. Los hermanos de José apacentaban el rebaño de su padre «en Sichêm», a unos 78 km al norte de Hebrón en línea recta. Josué reunió a todas las tribus en Siquem para renovar la alianza; fue una de las ciudades de refugio, «Sichêm en el monte de Ephraim»; y cuando «todo Israel había venido á Sichêm» para hacer rey a Roboam, el reino se dividió allí, hacia el 931 a. C., y Jeroboam «reedificó… á Sichêm en el monte de Ephraim, y habitó en ella»."
    - "El lugar solo fue identificado en 1903, por Hermann Thiersch: la ciudad se había trasladado a Flavia Neápolis, fundada en el 72 d. C. un poco al oeste, que el árabe convirtió en Nablus, mientras el antiguo montículo conservaba las ruinas. Las excavaciones alemanas de Ernst Sellin desde 1913 y la expedición estadounidense Drew–McCormick de G. Ernest Wright desde 1956 sacaron a la luz las murallas, puertas y el templo-fortaleza del Bronce Medio. Cerca están el pozo de Jacob y la aldea de Askar, que por lo común se toma por la Sicar del Evangelio de Juan, a unos 0,8 km del montículo, y el santuario que se muestra como tumba de José."
  pt:
    - "Siquém era o monte de Tell Balata, na orla oriental da atual Nablus, na Cisjordânia, na passagem entre o monte Gerizim e o monte Ebal, onde se cruzam as estradas da região montanhosa central. O ponto do mapa fica sobre o monte, a cerca de 49 km ao norte de Jerusalém em linha reta, 11 km a sudeste de Samaria e 18 km ao norte de Siló; o cume do Gerizim fica a cerca de 1,8 km e o do Ebal a 2,4 km. O History Globe tem um artigo sobre Siquém e sua história; esta resposta trata apenas de onde ficava."
    - "É o primeiro lugar em Canaã que o Gênesis nomeia: “Abrão atravessou a terra até o lugar de Siquém, até o carvalho de Moré.” Jacó, de volta de Padã-Arã, comprou “a porção de terra” diante da cidade, e ali foram sepultados mais tarde os ossos de José. Os irmãos de José apascentavam o rebanho do pai “em Siquém”, a cerca de 78 km ao norte de Hebrom em linha reta. Josué reuniu todas as tribos em Siquém para renovar a aliança; foi uma das cidades de refúgio, “Siquém, na região montanhosa de Efraim”; e quando “todo o Israel tinha ido a Siquém” para fazer Roboão rei, o reino se dividiu ali, por volta de 931 a.C., e Jeroboão “edificou Siquém na região montanhosa de Efraim, e morou nela”."
    - "O sítio só foi identificado em 1903, por Hermann Thiersch: a cidade havia se mudado para Flávia Neápolis, fundada no ano 72 d.C. um pouco a oeste, que o árabe transformou em Nablus, enquanto o antigo monte conservou as ruínas. As escavações alemãs sob Ernst Sellin a partir de 1913 e a expedição americana Drew–McCormick sob G. Ernest Wright a partir de 1956 trouxeram à luz as muralhas, portas e o templo-fortaleza da Idade do Bronze Média. Nas proximidades ficam o poço de Jacó e a aldeia de Askar, geralmente tomada pela Sicar do Evangelho de João, a cerca de 0,8 km do monte, e o santuário mostrado como túmulo de José."
  de:
    - "Sichem war der Hügel Tell Balata am Ostrand des heutigen Nablus im Westjordanland, im Pass zwischen dem Garizim und dem Ebal, wo sich die Straßen des zentralen Berglands kreuzen. Der Kartenpunkt steht auf dem Hügel, in der Luftlinie etwa 49 km nördlich von Jerusalem, 11 km südöstlich von Samaria und 18 km nördlich von Silo; der Gipfel des Garizim ist etwa 1,8 km entfernt, der des Ebal 2,4 km. History Globe hat einen Artikel über Sichem und seine Geschichte; diese Antwort beschränkt sich darauf, wo es lag."
    - "Es ist der erste Ort in Kanaan, den die Genesis nennt: „zog Abram durch bis an die Stätte Sichem und an den Hain More.“ Jakob, zurück aus Paddan-Aram, kaufte vor der Stadt „ein Stück Acker“, und dort wurden später die Gebeine Josefs begraben. Josefs Brüder weideten die Herde ihres Vaters „in Sichem“, in der Luftlinie etwa 78 km nördlich von Hebron. Josua versammelte alle Stämme in Sichem, um den Bund zu erneuern; es war eine der Freistädte, „Sichem auf dem Gebirge Ephraim“; und als „das ganze Israel war gen Sichem gekommen“, um Rehabeam zum König zu machen, teilte sich dort das Reich, um 931 v. Chr., und Jerobeam „baute Sichem auf dem Gebirge Ephraim und wohnte darin“."
    - "Die Stätte wurde erst 1903 von Hermann Thiersch identifiziert: Die Stadt war nach Flavia Neapolis umgezogen, 72 n. Chr. etwas weiter westlich gegründet und im Arabischen zu Nablus geworden, während der alte Hügel die Ruinen bewahrte. Deutsche Grabungen unter Ernst Sellin ab 1913 und die amerikanische Drew-McCormick-Expedition unter G. Ernest Wright ab 1956 legten die mittelbronzezeitlichen Mauern, Tore und den Festungstempel frei. In der Nähe liegen der Jakobsbrunnen und das Dorf Askar, meist für das Sychar des Johannesevangeliums gehalten, etwa 0,8 km vom Hügel entfernt, sowie die als Josefsgrab gezeigte Stätte."
  fr:
    - "Sichem était le tertre de Tell Balata, à la lisière orientale de l’actuelle Naplouse, en Cisjordanie, dans le défilé entre le mont Garizim et le mont Ébal, là où se croisent les routes de la région montagneuse centrale. Le point de la carte se trouve sur le tertre, à environ 49 km au nord de Jérusalem à vol d’oiseau, à 11 km au sud-est de Samarie et à 18 km au nord de Silo ; le sommet du Garizim est à environ 1,8 km, celui de l’Ébal à 2,4 km. History Globe consacre un article à Sichem et à son histoire ; cette réponse se limite à son emplacement."
    - "C’est le premier lieu de Canaan que nomme la Genèse : « Abram parcourut le pays jusqu’au lieu nommé Sichem, jusqu’aux chênes de Moré. » Jacob, de retour de Paddan-Aram, acheta devant la ville « la portion du champ où il avait dressé sa tente », et c’est là que furent plus tard enterrés les os de Joseph. Les frères de Joseph étaient allés « à Sichem, pour faire paître le troupeau de leur père », à environ 78 km au nord d’Hébron à vol d’oiseau. Josué réunit toutes les tribus à Sichem pour renouveler l’alliance ; elle fut l’une des villes de refuge, « Sichem, dans la montagne d’Éphraïm » ; et quand « tout Israël était venu à Sichem pour le faire roi », c’est-à-dire Roboam, le royaume s’y divisa, vers 931 av. J.-C., et Jéroboam « bâtit Sichem sur la montagne d’Éphraïm, et il y demeura »."
    - "Le site ne fut identifié qu’en 1903, par Hermann Thiersch : la ville s’était déplacée vers Flavia Néapolis, fondée en 72 apr. J.-C. un peu plus à l’ouest, que l’arabe transforma en Naplouse, tandis que l’ancien tertre gardait les ruines. Les fouilles allemandes d’Ernst Sellin à partir de 1913 et l’expédition américaine Drew-McCormick de G. Ernest Wright à partir de 1956 ont mis au jour les remparts, les portes et le temple-forteresse de l’âge du Bronze moyen. À proximité se trouvent le puits de Jacob et le village d’Askar, généralement tenu pour le Sychar de l’Évangile de Jean, à environ 0,8 km du tertre, ainsi que le sanctuaire montré comme le tombeau de Joseph."
  pl:
    - "Sychem to wzgórze Tell Balata na wschodnim skraju dzisiejszego Nablusu na Zachodnim Brzegu, w przełęczy między Górą Garizim a Górą Ebal, gdzie krzyżują się drogi środkowej krainy górskiej. Punkt na mapie stoi na wzgórzu, około 49 km na północ od Jerozolimy w linii prostej, 11 km na południowy wschód od Samarii i 18 km na północ od Szilo; szczyt Garizim jest oddalony o około 1,8 km, a Ebal o 2,4 km. History Globe ma artykuł o Sychem i jego dziejach; ta odpowiedź ogranicza się do jego położenia."
    - "Jest to pierwsze miejsce w Kanaanie, które nazywa Księga Rodzaju: „przeszedł Abram ziemię onę aż do miejsca Sychem, i aż do równiny Morech”. Jakub, wracając z Paddan-Aram, kupił „część pola” przed miastem i tam później pochowano kości Józefa. Bracia Józefa paśli trzody ojca „w Sychem”, około 78 km na północ od Hebronu w linii prostej. Jozue zgromadził wszystkie pokolenia w Sychem, by odnowić przymierze; było to jedno z miast ucieczki, „Sychem na górze Efraim”; a gdy „w Sychem zebrał się był wszystek Izrael”, aby uczynić Roboama królem, królestwo podzieliło się tam, około 931 p.n.e., a o Jeroboamie czytamy: „zbudował Jeroboam Sychem na górze Efraim, i mieszkał w nim”."
    - "Stanowisko zidentyfikowano dopiero w 1903 roku, przez Hermanna Thierscha: miasto przeniosło się do Flavia Neapolis, założonego w 72 n.e. nieco na zachód, które po arabsku stało się Nablusem, podczas gdy dawne wzgórze zachowało ruiny. Niemieckie wykopaliska pod kierunkiem Ernsta Sellina od 1913 i amerykańska wyprawa Drew–McCormick pod kierunkiem G. Ernesta Wrighta od 1956 odsłoniły mury, bramy i świątynię-twierdzę z epoki średniego brązu. W pobliżu leżą studnia Jakuba i wieś Askar, uważana zwykle za Sychar z Ewangelii Jana, około 0,8 km od wzgórza, oraz sanktuarium pokazywane jako grób Józefa."
  it:
    - "Sichem era il tell di Tell Balata al margine orientale dell’odierna Nablus in Cisgiordania, nel passo tra il Monte Garizim e il Monte Ebal, dove si incrociano le strade della regione collinare centrale. Il punto della mappa si trova sul tell, a circa 49 km a nord di Gerusalemme in linea d’aria, a 11 km a sud-est di Samaria e a 18 km a nord di Silo; la vetta del Monte Garizim dista circa 1,8 km e quella dell’Ebal 2,4 km. History Globe ha un articolo su Sichem e la sua storia; questa risposta si limita a dove si trovava."
    - "È il primo luogo di Canaan che la Genesi nomina: «Abramo traversò il paese fino al luogo di Sichem, fino alla quercia di Moreh». Giacobbe, tornato da Paddan-Aram, comprò «la parte del campo dove avea piantato le sue tende» davanti alla città, e lì furono poi sepolte le ossa di Giuseppe. I fratelli di Giuseppe erano andati «a pascere il gregge del padre a Sichem», a circa 78 km a nord di Ebron in linea d’aria. Giosuè radunò tutte le tribù a Sichem per rinnovare l’alleanza; fu una delle città di rifugio, «Sichem nella contrada montuosa di Efraim»; e quando «tutto Israele era venuto a Sichem» per fare re Roboamo, il regno si divise lì, verso il 931 a.C., e Geroboamo «edificò Sichem nella contrada montuosa di Efraim, e vi si stabilì»."
    - "Il sito fu identificato solo nel 1903, da Hermann Thiersch: la città si era spostata a Flavia Neapolis, fondata nel 72 d.C. un po’ più a ovest, che l’arabo trasformò in Nablus, mentre il vecchio tell conservò le rovine. Gli scavi tedeschi sotto Ernst Sellin dal 1913 e la spedizione americana Drew–McCormick sotto G. Ernest Wright dal 1956 hanno portato alla luce mura, porte e il tempio-fortezza del Medio Bronzo. Nelle vicinanze si trovano il pozzo di Giacobbe e il villaggio di Askar, di solito identificato con la Sicar del Vangelo di Giovanni, a circa 0,8 km dal tell, e il santuario mostrato come tomba di Giuseppe."
  cs:
    - "Šekem byl pahorek Tell Balata na východním okraji dnešního Nábulusu na Západním břehu, v průsmyku mezi horou Gerizim a horou Ébal, kde se kříží cesty středních hor. Bod na mapě stojí na pahorku, vzdušnou čarou asi 49 km severně od Jeruzaléma, 11 km jihovýchodně od Samaří a 18 km severně od Šíla; vrchol Gerizimu je asi 1,8 km daleko a vrchol Ébalu 2,4 km. History Globe má o Šekemu a jeho dějinách článek; tato odpověď se drží jen toho, kde ležel."
    - "Je to první místo v Kanaánu, které Genesis jmenuje: „I prošel Abram tu zemi až k místu Sichem, to jest až k rovině More.“ Jákob, vracející se z Padan-aramu, koupil před městem „díl pole toho“ a tam byly později pohřbeny Josefovy kosti. Josefovi bratři pásli dobytek otce svého „v Sichem“, vzdušnou čarou asi 78 km severně od Hebronu. Jozue svolal všechna pokolení do Šekemu k obnovení smlouvy; bylo to jedno z útočištných měst, „Sichem na hoře Efraim“; a když „tam sešel se byl všecken Izrael, aby ho ustanovili za krále“, království se tam rozdělilo, kolem roku 931 př. n. l., a Jarobeám „vystavěl… Sichem na hoře Efraim, a bydlil v něm“."
    - "Místo bylo určeno až roku 1903 Hermannem Thierschem: město se přesunulo do Flavie Neapole, založené roku 72 n. l. kousek na západ, z níž arabština udělala Nábulus, zatímco starý pahorek podržel zříceniny. Německé vykopávky pod vedením Ernsta Sellina od roku 1913 a americká expedice Drew–McCormick pod vedením G. Ernesta Wrighta od roku 1956 odkryly hradby, brány a pevnostní chrám ze střední doby bronzové. Poblíž leží Jákobova studna a vesnice Askar, obvykle pokládaná za Sychar Janova evangelia, asi 0,8 km od pahorku, a svatyně ukazovaná jako Josefův hrob."
  nl:
    - "Sichem was de heuvel Tell Balata aan de oostrand van het huidige Nabloes in de Westelijke Jordaanoever, in de pas tussen de berg Gerizim en de berg Ebal, waar de wegen van het centrale bergland elkaar kruisen. Het punt op de kaart staat op de heuvel, hemelsbreed ongeveer 49 km ten noorden van Jeruzalem, 11 km ten zuidoosten van Samaria en 18 km ten noorden van Silo; de top van de Gerizim ligt ongeveer 1,8 km verderop en die van de Ebal 2,4 km. History Globe heeft een artikel over Sichem en zijn geschiedenis; dit antwoord beperkt zich tot de ligging."
    - "Het is de eerste plaats in Kanaän die Genesis noemt: “Abram is doorgetogen in dat land, tot aan de plaats Sichem, tot aan het eikenbos More.” Jakob, teruggekeerd uit Paddan-Aram, kocht “een deel des velds” voor de stad, en daar werden later de beenderen van Jozef begraven. Jozefs broers weidden de kudde van hun vader “bij Sichem”, hemelsbreed ongeveer 78 km ten noorden van Hebron. Jozua riep alle stammen naar Sichem om het verbond te vernieuwen; het was een van de vrijsteden, “Sichem op het gebergte van Efraim”; en toen “het ganse Israel was te Sichem gekomen” om Rehabeam koning te maken, verdeelde het koninkrijk zich daar, omstreeks 931 v.Chr., en Jerobeam “bouwde Sichem op het gebergte van Efraim, en woonde daarin”."
    - "De plaats werd pas in 1903 geïdentificeerd, door Hermann Thiersch: de stad was verhuisd naar Flavia Neapolis, in 72 n.Chr. iets naar het westen gesticht, dat in het Arabisch Nabloes werd, terwijl de oude heuvel de ruïnes behield. Duitse opgravingen onder Ernst Sellin vanaf 1913 en de Amerikaanse Drew–McCormick-expeditie onder G. Ernest Wright vanaf 1956 legden de muren, poorten en vestingtempel uit de Midden-Bronstijd bloot. In de buurt liggen de put van Jakob en het dorp Askar, gewoonlijk gezien als het Sichar uit het evangelie van Johannes, op ongeveer 0,8 km van de heuvel, en het heiligdom dat als het graf van Jozef wordt getoond."
  sv:
    - "Shekem var kullen Tell Balata vid östra kanten av dagens Nablus på Västbanken, i passet mellan berget Gerisim och berget Ebal, där det centrala bergslandets vägar korsas. Kartans punkt står på kullen, omkring 49 km norr om Jerusalem i fågelvägen, 11 km sydost om Samaria och 18 km norr om Shilo; Gerisims topp ligger omkring 1,8 km bort och Ebals 2,4 km. History Globe har en artikel om Shekem och dess historia; det här svaret håller sig till var det låg."
    - "Det är den första platsen i Kanaan som Första Moseboken nämner: ”Och Abram drog fram i landet ända till den heliga platsen vid Sikem, till Mores terebint.” Jakob, som kom tillbaka från Paddan-Aram, köpte ”det jordstycke där han hade slagit upp sitt tält” framför staden, och där begrovs senare Josefs ben. Josefs bröder vaktade sin faders får ”i Sikem”, omkring 78 km norr om Hebron i fågelvägen. Josua församlade alla stammar till Shekem för att förnya förbundet; det var en av tillflyktsstäderna, ”Sikem i Efraims bergsbygd”; och när ”hela Israel hade kommit till Sikem” för att göra Rehabeam till kung, delades riket där, omkring 931 f.Kr., och Jerobeam ”befäste Sikem i Efraims bergsbygd och bosatte sig där”."
    - "Platsen identifierades först 1903, av Hermann Thiersch: staden hade flyttat till Flavia Neapolis, grundad år 72 e.Kr. något längre västerut, som arabiskan gjorde till Nablus, medan den gamla kullen behöll ruinerna. Tyska utgrävningar under Ernst Sellin från 1913 och den amerikanska Drew–McCormick-expeditionen under G. Ernest Wright från 1956 avtäckte murar, portar och fästningstemplet från mellersta bronsåldern. I närheten ligger Jakobs brunn och byn Askar, vanligen ansedd som Sykar i Johannesevangeliet, omkring 0,8 km från kullen, och helgedomen som visas som Josefs grav."
  nb:
    - "Sikem var haugen Tell Balata i den østre kanten av dagens Nablus på Vestbredden, i passet mellom Garisim og Ebal, der veiene i det sentrale fjellandet krysser hverandre. Kartets punkt står på haugen, omtrent 49 km nord for Jerusalem i luftlinje, 11 km sørøst for Samaria og 18 km nord for Sjilo; Garisims topp ligger omtrent 1,8 km unna og Ebals 2,4 km. History Globe har en artikkel om Sikem og dets historie; dette svaret holder seg til hvor det lå."
    - "Det er det første stedet i Kanaan som Første Mosebok nevner: «Abram drog gjennem landet til Sikem-bygden, til Mores terebintelund.» Jakob, tilbake fra Paddan-Aram, kjøpte «det stykke mark hvor han hadde slått op sitt telt» foran byen, og der ble senere Josefs ben begravd. Josefs brødre gjætet sin fars buskap «i Sikem», omtrent 78 km nord for Hebron i luftlinje. Josva samlet alle stammene i Sikem for å fornye pakten; det var en av tilfluktsbyene, «Sikem i Efra’im-fjellene»; og da «hele Israel var kommet til Sikem» for å gjøre Rehabeam til konge, ble riket delt der, omkring 931 f.Kr., og Jeroboam «bygget Sikem i Efra’im-fjellene om til en fast by og bosatte sig der»."
    - "Stedet ble først identifisert i 1903, av Hermann Thiersch: byen hadde flyttet til Flavia Neapolis, grunnlagt i 72 e.Kr. litt lenger vest, som på arabisk ble til Nablus, mens den gamle haugen beholdt ruinene. Tyske utgravninger under Ernst Sellin fra 1913 og den amerikanske Drew–McCormick-ekspedisjonen under G. Ernest Wright fra 1956 avdekket murene, portene og festningstempelet fra mellombronsealderen. I nærheten ligger Jakobs brønn og landsbyen Askar, vanligvis regnet for Sykar i Johannesevangeliet, omtrent 0,8 km fra haugen, og helligdommen som vises som Josefs grav."
  tl:
    - "Ang Sichem ay ang burol ng Tell Balata sa silangang gilid ng Nablus ngayon sa West Bank, sa daanan sa pagitan ng Bundok Gerizim at Bundok Ebal, kung saan nagkakrus ang mga daan ng gitnang maburol na lupain. Nasa burol ang punto ng mapa, mga 49 km sa hilaga ng Jerusalem sa tuwid na guhit, 11 km sa timog-silangan ng Samaria at 18 km sa hilaga ng Shiloh; ang tuktok ng Bundok Gerizim ay mga 1.8 km ang layo at ang sa Ebal ay 2.4 km. May artikulo ang History Globe tungkol sa Sichem at sa kasaysayan nito; ang sagot na ito ay nakatuon sa kung nasaan ito."
    - "Ito ang unang lugar sa Canaan na pinangalanan ng Genesis: “naglakbay sa lupain si Abram hanggang sa dako ng Sichem, hanggang sa punong encina ng More.” Si Jacob, pagbalik mula sa Padan-aram, ay bumili ng “pitak ng lupa” sa harap ng lungsod, at doon kalaunan inilibing ang mga buto ni Jose. Ang mga kapatid ni Jose ay nagpastol ng kawan ng kanilang ama “sa Sichem”, mga 78 km sa hilaga ng Hebron sa tuwid na guhit. Tinipon ni Josue ang lahat ng mga lipi sa Sichem upang baguhin ang tipan; isa ito sa mga bayang ampunan, “ang Sichem sa lupaing maburol ng Ephraim”; at nang “ang buong Israel ay naparoon sa Sichem upang gawin siyang hari” si Roboam, nahati roon ang kaharian, mga 931 BK, at “itinayo ni Jeroboam ang Sichem sa lupaing maburol ng Ephraim, at tumahan doon”."
    - "Natukoy lamang ang pook noong 1903, ni Hermann Thiersch: lumipat ang bayan sa Flavia Neapolis, na itinatag noong 72 AD sa bahagyang kanluran, na ginawang Nablus ng Arabe, samantalang pinanatili ng lumang burol ang mga guho. Ang mga paghuhukay ng mga Aleman sa ilalim ni Ernst Sellin mula 1913 at ang ekspedisyong Amerikano ng Drew–McCormick sa ilalim ni G. Ernest Wright mula 1956 ay nakatuklas ng mga pader, tarangkahan at templong kuta ng Gitnang Panahong Tanso. Sa malapit ang balon ni Jacob at ang nayon ng Askar, na karaniwang itinuturing na Sicar ng Ebanghelyo ni Juan, mga 0.8 km mula sa burol, at ang dambanang ipinakikita bilang libingan ni Jose."
  da:
    - "Sikem var tellen Tell Balata ved den østlige udkant af nutidens Nablus på Vestbredden, i passet mellem Garizim og Ebal, hvor vejene i det centrale højland krydser hinanden. Kortets punkt står på tellen, ca. 49 km nord for Jerusalem i fugleflugt, 11 km sydøst for Samaria og 18 km nord for Silo; Garizims top ligger ca. 1,8 km væk og Ebals 2,4 km. History Globe har en artikel om Sikem og dets historie; dette svar holder sig til, hvor det lå."
    - "Det er det første sted i Kana’an, som Første Mosebog nævner: »Abram drog igennem Landet til det Sted Sikem indtil More Lund.« Jakob, hjemvendt fra Paddan-Aram, købte »det Stykke Ager« foran byen, og dér blev Josefs ben senere begravet. Josefs brødre vogtede deres fars kvæg »i Sikem«, ca. 78 km nord for Hebron i fugleflugt. Josva samlede alle stammerne i Sikem for at forny pagten; det var en af tilflugtsbyerne, »Sikem paa Efraims Bjerg«; og da »al Israel var kommen til Sikem« for at gøre Rehabeam til konge, delte riget sig dér, omkring 931 f.Kr., og Jeroboam »byggede Sikem paa Efraims Bjerg og boede derudi«."
    - "Stedet blev først identificeret i 1903, af Hermann Thiersch: Byen var flyttet til Flavia Neapolis, grundlagt i 72 e.Kr. lidt mod vest, som arabisk gjorde til Nablus, mens den gamle tell beholdt ruinerne. Tyske udgravninger under Ernst Sellin fra 1913 og den amerikanske Drew-McCormick-ekspedition under G. Ernest Wright fra 1956 afdækkede mellembronzealderens mure, porte og fæstningstempel. I nærheden ligger Jakobs brønd og landsbyen Askar, sædvanligvis taget for Sykar i Johannesevangeliet, ca. 0,8 km fra tellen, og helligdommen, der vises som Josefs grav."
