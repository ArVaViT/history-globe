id: when-did-the-walls-of-jericho-fall
question:
  en: "When did the walls of Jericho fall?"
  ru: "Когда пали стены Иерихона?"
answer:
  en:
    - "By the Bible's own reckoning, in the year Israel crossed the Jordan, forty years after the Exodus: about 1406 BC on the chronology the map follows, or in the thirteenth century BC on the later dating that many scholars prefer. The city is the mound of Tell es-Sultan beside Elisha's spring, 22 km east of Jerusalem, 250 m below sea level. Whether the ruins show a wall falling at either date is disputed, and the answer has swung back and forth for a century. Since 1997 an Italian–Palestinian expedition under Lorenzo Nigro, at first with Nicolò Marchetti, has dug the mound again; it places the burning of the Middle Bronze city in the sixteenth century BC, and Nigro argues for a smaller settlement in the fourteenth and thirteenth centuries, its remains largely cut away by later levelling."
    - "Joshua says that “Jericho was straitly shut up because of the children of Israel: none went out, and none came in”; Rahab's house “was upon the town wall, and she dwelt upon the wall”; on the seventh day, when the priests blew and the people shouted, “the wall fell down flat, so that the people went up into the city, every man straight before him, and they took the city”. Joshua cursed whoever should rebuild it, and Kings records that in Ahab's days “did Hiel the Beth-elite build Jericho: he laid the foundation thereof in Abiram his firstborn, and set up the gates thereof in his youngest son Segub”. Hebrews sums up: “By faith the walls of Jericho fell down, after they were compassed about seven days.”"
    - "The mound carries a Middle Bronze city with a sloping rampart and a mudbrick wall on a stone base, which fell in a fire; its bricks lie heaped at the foot of the wall. John Garstang, digging in 1930–1936, dated the fall to about 1400 BC and called it Joshua's. Kathleen Kenyon (1952–1958) showed by the pottery that the city was destroyed about 1550 BC, which she linked with the Egyptian expulsion of the Hyksos, and found almost nothing of a town about 1400 and nothing of one about 1250; radiocarbon dates on grain from the burnt city, published in 1995, agree with her. Bryant Wood argued in 1990 from the pottery and scarabs that the destruction belongs after all to about 1400 BC, and some conservative scholars follow him; most archaeologists hold Kenyon's date and take the story as a later telling, while others answer that erosion has carried off the Late Bronze town."
  ru:
    - "По счёту самой Библии — в год, когда Израиль перешёл Иордан, через сорок лет после Исхода: около 1406 г. до н. э. по хронологии карты или в XIII веке до н. э. по более поздней датировке, которую предпочитают многие учёные. Город — холм Телль-эс-Султан у источника Елисея, в 22 км к востоку от Иерусалима, на 250 м ниже уровня моря. Показывают ли развалины падение стены в ту или другую дату, спорно, и ответ за столетие не раз менялся. С 1997 года холм снова копает итало-палестинская экспедиция Лоренцо Нигро, поначалу вместе с Николо Маркетти; она относит пожар города среднего бронзового века к XVI веку до н. э., а Нигро считает, что в XIV–XIII веках здесь было меньшее поселение, остатки которого почти срезаны позднейшими планировками."
    - "Книга Иисуса Навина говорит, что Иерихон был заперт — никто не выходил и не входил; дом Раав «был в городской стене, и она жила в стене»; на седьмой день, когда затрубили священники и воскликнул народ, «обрушилась вся стена города до своего основания, и весь народ пошел в город, каждый с своей стороны, и взяли город». Иисус проклял того, кто отстроит город, и Книга Царств отмечает, что во дни Ахава «Ахиил Вефилянин построил Иерихон: на первенце своем Авираме он положил основание его и на младшем своем сыне Сегубе поставил ворота его». Послание к Евреям подводит итог: «Верою пали стены Иерихонские по семидневном обхождении»."
    - "На холме стоит город среднего бронзового века с наклонным валом и кирпичной стеной на каменном основании, который погиб в огне; его кирпичи лежат грудой у подножия стены. Джон Гарстанг, копавший в 1930–1936 годах, датировал падение примерно 1400 г. до н. э. и назвал его стеной Иисуса Навина. Кэтлин Кеньон (1952–1958) показала по керамике, что город был разрушен около 1550 г. до н. э., и связала это с изгнанием гиксосов египтянами, и почти не нашла города около 1400 года и ничего — около 1250-го; радиоуглеродные даты по зерну из сгоревшего города, опубликованные в 1995 году, с ней согласуются. Брайант Вуд в 1990 году доказывал по керамике и скарабеям, что разрушение всё же относится к 1400 году, и часть консервативных учёных идёт за ним; большинство археологов держится даты Кеньон и считает рассказ поздним, другие отвечают, что город позднего бронзового века унесла эрозия."
