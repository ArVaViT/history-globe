id: when-did-the-walls-of-jericho-fall
question:
  en: "When did the walls of Jericho fall?"
  ru: "Когда пали стены Иерихона?"
  uk: "Коли впали мури Єрихону?"
  es: "¿Cuándo cayeron las murallas de Jericó?"
  pt: "Quando caíram as muralhas de Jericó?"
  de: "Wann fielen die Mauern Jerichos?"
  fr: "Quand les murailles de Jéricho sont-elles tombées ?"
  pl: "Kiedy runęły mury Jerycha?"
  it: "Quando caddero le mura di Gerico?"
  nl: "Wanneer vielen de muren van Jericho?"
  cs: "Kdy padly hradby Jericha?"
  sv: "När föll Jerikos murar?"
  nb: "Når falt murene i Jeriko?"
  tl: "Kailan bumagsak ang mga pader ng Jerico?"
  da: "Hvornår faldt Jerikos mure?"
  sr: "Када су пали зидови Јерихона?"
answer:
  en:
    - "By the Bible's own reckoning, in the year Israel crossed the Jordan, forty years after the Exodus: about 1406 BC on the chronology the map follows, or in the thirteenth century BC on the later dating that many scholars prefer. The city is the mound of Tell es-Sultan beside Elisha's spring, 22 km east of Jerusalem, 250 m below sea level. Whether the ruins show a wall falling at either date is disputed, and the answer has swung back and forth for a century. Since 1997 an Italian–Palestinian expedition under Lorenzo Nigro, at first with Nicolò Marchetti, has dug the mound again; it places the burning of the Middle Bronze city in the sixteenth century BC, and Nigro argues for a smaller settlement in the fourteenth and thirteenth centuries, its remains largely cut away by later levelling."
    - "Joshua says that “Jericho was straitly shut up because of the children of Israel: none went out, and none came in”; Rahab's house “was upon the town wall, and she dwelt upon the wall”; on the seventh day, when the priests blew and the people shouted, “the wall fell down flat, so that the people went up into the city, every man straight before him, and they took the city”. Joshua cursed whoever should rebuild it, and Kings records that in Ahab's days “did Hiel the Beth-elite build Jericho: he laid the foundation thereof in Abiram his firstborn, and set up the gates thereof in his youngest son Segub”. Hebrews sums up: “By faith the walls of Jericho fell down, after they were compassed about seven days.”"
    - "The mound carries a Middle Bronze city with a sloping rampart and a mudbrick wall on a stone base, which fell in a fire; its bricks lie heaped at the foot of the wall. John Garstang, digging in 1930–1936, dated the fall to about 1400 BC and called it Joshua's. Kathleen Kenyon (1952–1958) showed by the pottery that the city was destroyed about 1550 BC, which she linked with the Egyptian expulsion of the Hyksos, and found almost nothing of a town about 1400 and nothing of one about 1250; radiocarbon dates on grain from the burnt city, published in 1995, agree with her. Bryant Wood argued in 1990 from the pottery and scarabs that the destruction belongs after all to about 1400 BC, and some conservative scholars follow him; most archaeologists hold Kenyon's date and take the story as a later telling, while others answer that erosion has carried off the Late Bronze town."
  ru:
    - "По счёту самой Библии — в год, когда Израиль перешёл Иордан, через сорок лет после Исхода: около 1406 г. до н. э. по хронологии карты или в XIII веке до н. э. по более поздней датировке, которую предпочитают многие учёные. Город — холм Телль-эс-Султан у источника Елисея, в 22 км к востоку от Иерусалима, на 250 м ниже уровня моря. Показывают ли развалины падение стены в ту или другую дату, спорно, и ответ за столетие не раз менялся. С 1997 года холм снова копает итало-палестинская экспедиция Лоренцо Нигро, поначалу вместе с Николо Маркетти; она относит пожар города среднего бронзового века к XVI веку до н. э., а Нигро считает, что в XIV–XIII веках здесь было меньшее поселение, остатки которого почти срезаны позднейшими планировками."
    - "Книга Иисуса Навина говорит, что Иерихон был заперт — никто не выходил и не входил; дом Раав «был в городской стене, и она жила в стене»; на седьмой день, когда затрубили священники и воскликнул народ, «обрушилась вся стена города до своего основания, и весь народ пошел в город, каждый с своей стороны, и взяли город». Иисус проклял того, кто отстроит город, и Книга Царств отмечает, что во дни Ахава «Ахиил Вефилянин построил Иерихон: на первенце своем Авираме он положил основание его и на младшем своем сыне Сегубе поставил ворота его». Послание к Евреям подводит итог: «Верою пали стены Иерихонские по семидневном обхождении»."
    - "На холме стоит город среднего бронзового века с наклонным валом и кирпичной стеной на каменном основании, который погиб в огне; его кирпичи лежат грудой у подножия стены. Джон Гарстанг, копавший в 1930–1936 годах, датировал падение примерно 1400 г. до н. э. и назвал его стеной Иисуса Навина. Кэтлин Кеньон (1952–1958) показала по керамике, что город был разрушен около 1550 г. до н. э., и связала это с изгнанием гиксосов египтянами, и почти не нашла города около 1400 года и ничего — около 1250-го; радиоуглеродные даты по зерну из сгоревшего города, опубликованные в 1995 году, с ней согласуются. Брайант Вуд в 1990 году доказывал по керамике и скарабеям, что разрушение всё же относится к 1400 году, и часть консервативных учёных идёт за ним; большинство археологов держится даты Кеньон и считает рассказ поздним, другие отвечают, что город позднего бронзового века унесла эрозия."
  uk:
    - "За власним біблійним відліком — у рік, коли Ізраїль перейшов Йордан, через сорок років після Виходу: близько 1406 р. до н. е. за хронологією, якої дотримується мапа, або в XIII ст. до н. е. за пізнішою датою, якій віддають перевагу багато вчених. Місто — це пагорб Тель-ес-Султан біля Єлисеєвого джерела, за 22 км на схід від Єрусалиму, на 250 м нижче рівня моря. Чи показують руїни падіння муру за будь-якою з цих дат — спірно, і відповідь коливалася туди й сюди протягом століття. Від 1997 р. італійсько-палестинська експедиція під проводом Лоренцо Нігро, спершу разом із Нікколо Маркетті, знову розкопує пагорб; вона відносить спалення міста середньої бронзи до XVI ст. до н. е., а Нігро обстоює менше поселення в XIV і XIII ст., рештки якого значною мірою зрізало пізніше вирівнювання."
    - "Книга Ісуса Навина каже, що «в Ерихонї ворота були зачинені, а зачинивсь він зі страху перед синами Ізраїля, так що нїкому не можна було виходити й увіходити»; хата Рахави «була при міському мурі, і жила вона коло муру»; сьомого дня, коли священики засурмили, а народ закричав, «мури міста впали руїною; нарід же ринув у город, кожен звідти, де стояв; сим робом і опановано місто». Ісус Навин прокляв того, хто відбудує його, а Книга Царів записує, що за днів Ахава «Ахіїл із Бетеля збудував город Ерихон. На перворіднї свойму Абирамі положив підвалину його, а на меньшому синї свойму Сегубі поставив ворота його». Послання до євреїв підсумовує: «Вірою стїни Єрихонські попадали, після семидневних обходин»."
    - "На пагорбі лежить місто середньої бронзи зі схилистим валом і мурованим із сирцю муром на кам'яній основі, що впав у пожежі; його цегла лежить купою біля підніжжя муру. Джон Гарстанг (розкопки 1930–1936 рр.) датував падіння приблизно 1400 р. до н. е. і назвав його містом Ісуса Навина. Кетлін Кеньйон (1952–1958) показала за керамікою, що місто було зруйноване близько 1550 р. до н. е., що вона пов'язала з вигнанням гіксосів єгиптянами, і майже нічого не знайшла від міста близько 1400 р., а від міста близько 1250 р. — нічого; радіовуглецеві дати зерна зі спаленого міста (1995 р.) збігаються з нею. Брайант Вуд 1990 р. доводив за керамікою та скарабеями, що руйнування все ж належить до близько 1400 р. до н. е., і деякі консервативні вчені йдуть за ним; більшість археологів тримається дати Кеньйон і вважає розповідь пізнішим переказом, інші ж кажуть, що ерозія знесла місто пізньої бронзи."
  es:
    - "Según el propio cómputo de la Biblia, en el año en que Israel cruzó el Jordán, cuarenta años después del Éxodo: hacia el 1406 a. C. según la cronología que sigue el mapa, o en el siglo XIII a. C. según la datación posterior que prefieren muchos estudiosos. La ciudad es el tell de Tell es-Sultán, junto a la fuente de Eliseo, a 22 km al este de Jerusalén, a 250 m bajo el nivel del mar. Si las ruinas muestran la caída de una muralla en alguna de las dos fechas es discutido, y la respuesta ha oscilado durante un siglo. Desde 1997, una expedición italo-palestina dirigida por Lorenzo Nigro, al principio con Nicolò Marchetti, ha vuelto a excavar el tell; sitúa el incendio de la ciudad del Bronce Medio en el siglo XVI a. C., y Nigro defiende un asentamiento más pequeño en los siglos XIV y XIII, cuyos restos fueron en buena parte arrasados por nivelaciones posteriores."
    - "Josué dice que «Jericó estaba cerrada, bien cerrada, á causa de los hijos de Israel: nadie entraba, ni salía»; la casa de Rahab «estaba á la pared del muro, y ella vivía en el muro»; el séptimo día, cuando los sacerdotes tocaron y el pueblo gritó, «el muro cayó á plomo. El pueblo subió luego á la ciudad, cada uno en derecho de sí, y tomáronla». Josué maldijo a quien la reedificara, y Reyes registra que en tiempos de Acab «Hiel de Beth-el reedificó á Jericó. En Abiram su primogénito echó el cimiento, y en Segub su hijo postrero puso sus puertas». Hebreos resume: «Por fe cayeron los muros de Jericó con rodearlos siete días»."
    - "El tell contiene una ciudad del Bronce Medio con glacis inclinado y muro de adobe sobre base de piedra, incendiada; sus ladrillos yacen apilados al pie del muro. John Garstang (excavó en 1930–1936) fechó la caída hacia el 1400 a. C. y la llamó de Josué. Kathleen Kenyon (1952–1958) demostró por la cerámica que fue destruida hacia el 1550 a. C., lo que vinculó con la expulsión egipcia de los hicsos, y halló casi nada de población hacia el 1400 y nada hacia el 1250; las dataciones por radiocarbono de grano de la ciudad quemada, de 1995, la confirman. Bryant Wood argumentó en 1990, por cerámica y escarabeos, que la destrucción es, después de todo, de hacia el 1400 a. C., y algunos estudiosos conservadores lo siguen; la mayoría de los arqueólogos mantiene la fecha de Kenyon y ve el relato como posterior; otros responden que la erosión borró la población del Bronce Final."
  pt:
    - "Pela própria contagem da Bíblia, no ano em que Israel atravessou o Jordão, quarenta anos depois do Êxodo: cerca de 1406 a.C. pela cronologia que o mapa segue, ou no século XIII a.C. pela datação posterior que muitos estudiosos preferem. A cidade é o montículo de Tell es-Sultan, junto à fonte de Eliseu, a 22 km a leste de Jerusalém, 250 m abaixo do nível do mar. Se as ruínas mostram uma muralha caindo numa dessas datas é disputado, e a resposta oscilou por um século. Desde 1997 uma missão italo-palestina sob Lorenzo Nigro, no início com Nicolò Marchetti, escava de novo o montículo; situa o incêndio da cidade do Bronze Médio no século XVI a.C., e Nigro defende um povoado menor nos séculos XIV e XIII, cujos restos foram em grande parte removidos por terraplenagens posteriores."
    - "Josué diz que “Jericó estava rigorosamente fechada por causa dos filhos de Israel. Ninguém saía, e ninguém entrava”; a casa de Raabe “ficava na lateral da muralha, e ela morava na muralha”; no sétimo dia, quando os sacerdotes tocaram e o povo gritou, “a muralha caiu rente ao chão, de modo que o povo subiu à cidade, cada homem indo direto para a frente, e tomaram a cidade”. Josué amaldiçoou quem a reconstruísse, e Reis registra que nos dias de Acabe “Hiel, o betelita, edificou Jericó. Ele lançou os seus alicerces com a perda de Abirão, seu primogênito, e colocou os seus portões com a perda de seu filho mais novo, Segube”. Hebreus resume: “Pela fé as muralhas de Jericó caíram, depois de terem sido rodeadas por sete dias.”"
    - "O montículo guarda uma cidade do Bronze Médio, com talude inclinado e muralha de tijolos de barro sobre base de pedra, caída num incêndio; os tijolos jazem amontoados ao pé do muro. John Garstang, em 1930–1936, datou a queda de cerca de 1400 a.C. e a atribuiu a Josué. Kathleen Kenyon (1952–1958) mostrou pela cerâmica que a cidade foi destruída por volta de 1550 a.C., data que ela ligou à expulsão dos hicsos do Egito, e achou quase nada de uma cidade por volta de 1400 e nada por volta de 1250; datações por radiocarbono de grãos da cidade queimada, de 1995, concordam com ela. Bryant Wood sustentou em 1990, pela cerâmica e escaravelhos, que a destruição é afinal de cerca de 1400 a.C., e alguns conservadores o seguem; a maioria dos arqueólogos mantém a data de Kenyon e toma a história por narração posterior; outros respondem que a erosão levou a cidade do Bronze Final."
  de:
    - "Nach der eigenen Rechnung der Bibel in dem Jahr, in dem Israel den Jordan überschritt, vierzig Jahre nach dem Auszug: um 1406 v. Chr. nach der Chronologie, der die Karte folgt, oder im 13. Jahrhundert v. Chr. nach der späteren Datierung, die viele Gelehrte bevorzugen. Die Stadt ist der Hügel Tell es-Sultan bei der Elisa-Quelle, 22 km östlich von Jerusalem, 250 m unter dem Meeresspiegel. Ob die Ruinen zu einem der beiden Zeitpunkte eine fallende Mauer zeigen, ist umstritten, und die Antwort schwankt seit einem Jahrhundert. Seit 1997 gräbt eine italienisch-palästinensische Expedition unter Lorenzo Nigro, anfangs mit Nicolò Marchetti, den Hügel erneut; sie setzt den Brand der mittelbronzezeitlichen Stadt ins 16. Jahrhundert v. Chr., und Nigro vertritt eine kleinere Siedlung im 14. und 13. Jahrhundert, deren Reste spätere Einebnung weitgehend abgetragen hat."
    - "Das Buch Josua sagt: „Jericho aber war verschlossen und verwahrt vor den Kindern Israel, daß niemand aus oder ein kommen konnte“; Rahabs Haus „war an der Stadtmauer, und sie wohnte auch auf der Mauer“; am siebten Tag, als die Priester bliesen und das Volk Feldgeschrei machte: „Und die Mauer fielen um, und das Volk erstieg die Stadt, ein jeglicher stracks vor sich. Also gewannen sie die Stadt“. Josua verfluchte jeden, der sie wieder baue, und die Könige berichten aus der Zeit Ahabs: „Zur selben Zeit baute Hiel von Beth-El Jericho. Es kostete ihn seinen ersten Sohn Abiram, da er den Grund legte, und den jüngsten Sohn Segub, da er die Türen setzte“. Der Hebräerbrief fasst zusammen: „Durch den Glauben fielen die Mauern Jerichos, da sie sieben Tage um sie herumgegangen waren.“"
    - "Der Hügel trägt eine mittelbronzezeitliche Stadt mit geböschtem Wall und Lehmziegelmauer auf Steinsockel, die im Brand unterging; ihre Ziegel liegen am Mauerfuß aufgehäuft. John Garstang datierte bei seinen Grabungen 1930–1936 den Fall auf etwa 1400 v. Chr. und nannte ihn Josuas. Kathleen Kenyon (1952–1958) wies mit der Keramik die Zerstörung um 1550 v. Chr. nach, die sie mit der Vertreibung der Hyksos aus Ägypten verband, und fand von einer Stadt um 1400 fast nichts und um 1250 nichts; 1995 veröffentlichte Radiokarbondaten von Getreide aus der verbrannten Stadt stützen sie. Bryant Wood schloss 1990 aus Keramik und Skarabäen, die Zerstörung gehöre doch um 1400 v. Chr., und manche konservative Gelehrte folgen ihm; die meisten halten an Kenyons Datum fest und sehen in der Erzählung eine spätere Darstellung, andere entgegnen, die Erosion habe die spätbronzezeitliche Stadt abgetragen."
  fr:
    - "Selon le calcul même de la Bible, l’année où Israël passa le Jourdain, quarante ans après l’Exode : vers 1406 av. J.-C. selon la chronologie que suit la carte, ou au XIIIe siècle av. J.-C. selon la datation plus basse que préfèrent de nombreux savants. La ville est le tertre de Tell es-Sultan, près de la source d’Élisée, à 22 km à l’est de Jérusalem, à 250 m sous le niveau de la mer. Que les ruines montrent une muraille tombée à l’une ou l’autre date est discuté, et la réponse a oscillé pendant un siècle. Depuis 1997, une expédition italo-palestinienne dirigée par Lorenzo Nigro, d’abord avec Nicolò Marchetti, fouille de nouveau le tertre ; elle place l’incendie de la ville du Bronze moyen au XVIe siècle av. J.-C., et Nigro soutient l’existence d’une bourgade plus petite aux XIVe et XIIIe siècles, ses vestiges largement emportés par des nivellements ultérieurs."
    - "Josué dit que « Jéricho était fermée et barricadée devant les enfants d’Israël. Personne ne sortait, et personne n’entrait » ; la maison de Rahab « était sur la muraille de la ville » ; le septième jour, quand les prêtres sonnèrent et que le peuple poussa des cris, « la muraille s’écroula ; le peuple monta dans la ville, chacun devant soi. Ils s’emparèrent de la ville ». Josué maudit quiconque la rebâtirait, et les Rois rapportent qu’au temps d’Achab « Hiel de Béthel bâtit Jéricho ; il en jeta les fondements au prix d’Abiram, son premier-né, et il en posa les portes au prix de Segub, son plus jeune fils ». L’épître aux Hébreux résume : « C’est par la foi que les murailles de Jéricho tombèrent, après qu’on en eut fait le tour pendant sept jours. »"
    - "Le tertre porte une ville du Bronze moyen, avec un rempart en pente et un mur de briques crues sur un soubassement de pierre, tombé dans un incendie ; ses briques gisent au pied du mur. John Garstang (1930–1936) data la chute d’environ 1400 av. J.-C. et l’attribua à Josué. Kathleen Kenyon (1952–1958) montra par la céramique que la ville fut détruite vers 1550 av. J.-C., ce qu’elle relia à l’expulsion égyptienne des Hyksôs, et ne trouva presque rien d’une ville vers 1400, rien vers 1250 ; les datations au radiocarbone de grains de la ville brûlée (1995) concordent. Bryant Wood soutint en 1990, par la céramique et les scarabées, que la destruction date bien d’environ 1400 av. J.-C., ce que suivent certains conservateurs ; la plupart des archéologues suivent Kenyon et y voient une mise en forme tardive, d’autres répondant que l’érosion a emporté celle du Bronze récent."
  pl:
    - "Według własnej rachuby Biblii, w roku, w którym Izrael przeszedł Jordan, czterdzieści lat po Wyjściu: około 1406 p.n.e. według chronologii, za którą idzie mapa, albo w XIII wieku p.n.e. według późniejszego datowania, które woli wielu uczonych. Miasto to kopiec Tell es-Sultan przy źródle Elizeusza, 22 km na wschód od Jerozolimy, 250 m poniżej poziomu morza. Czy ruiny pokazują upadający mur w którejkolwiek z tych dat, jest sporne, a odpowiedź kołysze się tam i z powrotem od stu lat. Od 1997 włosko-palestyńska ekspedycja pod kierownictwem Lorenzo Nigro, z początku z Nicolò Marchettim, wykopuje kopiec na nowo; umieszcza spalenie miasta z epoki brązu środkowego w XVI wieku p.n.e., a Nigro dowodzi, że w XIV i XIII wieku istniała mniejsza osada, której pozostałości w znacznej mierze zniosło późniejsze niwelowanie."
    - "Księga Jozuego mówi: „A Jerycho było zamknione, i opatrzone przed synami Izraelskimi, i nikt z niego nie wychodził, ani do niego wchodził”; dom Rachab „był przy murze i ona na murze mieszkała”; siódmego dnia, gdy kapłani zatrąbili, a lud krzyknął, „upadł mur na miejscu swem, i wszedł lud do miasta, każdy przeciw miejscu, gdzie stał, i wzięli miasto”. Jozue przeklął każdego, kto odbuduje miasto, a Księgi Królewskie notują, że za dni Achaba „zbudował Hijel, Betelczyk, miasto Jerycho. Na Abiramie, pierworodnym swoim, założył je, a na Segubie najmłodszym synu swym, wystawił bramy jego”. List do Hebrajczyków podsumowuje: „Wiarą mury Jerycha upadły, gdy je obchodzono przez siedm dni”."
    - "Na kopcu leży miasto z epoki brązu środkowego ze skośnym wałem i murem z cegły mułowej na kamiennej podstawie, które runęło w pożarze; jego cegły leżą u stóp muru. John Garstang, kopiąc w latach 1930–1936, datował upadek na około 1400 p.n.e. i nazwał go upadkiem Jozuego. Kathleen Kenyon (1952–1958) wykazała na podstawie ceramiki, że miasto zniszczono około 1550 p.n.e., co powiązała z wypędzeniem Hyksosów z Egiptu, i nie znalazła prawie śladu miasta około 1400 ani żadnego około 1250; daty radiowęglowe ziarna ze spalonego miasta, opublikowane w 1995, zgadzają się z nią. Bryant Wood dowodził w 1990 z ceramiki i skarabeuszy, że zniszczenie należy jednak do około 1400 p.n.e., i niektórzy konserwatywni uczeni idą za nim; większość archeologów trzyma się daty Kenyon i uważa opowieść za późniejszą, inni zaś odpowiadają, że erozja zabrała miasto z epoki późnego brązu."
  it:
    - "Secondo il computo della stessa Bibbia, nell’anno in cui Israele attraversò il Giordano, quarant’anni dopo l’Esodo: circa il 1406 a.C. secondo la cronologia che la mappa segue, o nel XIII secolo a.C. secondo la datazione più bassa che molti studiosi preferiscono. La città è il tumulo di Tell es-Sultan accanto alla sorgente di Eliseo, a 22 km a est di Gerusalemme, a 250 m sotto il livello del mare. Se le rovine mostrino un muro caduto in una delle due date è discusso, e la risposta è oscillata per un secolo. Dal 1997 una spedizione italo-palestinese sotto Lorenzo Nigro, all’inizio con Nicolò Marchetti, ha scavato di nuovo il tumulo; colloca l’incendio della città del Bronzo Medio nel XVI secolo a.C., e Nigro sostiene un insediamento più piccolo nel XIV e XIII secolo, i cui resti furono in gran parte tagliati via da livellamenti successivi."
    - "Giosuè dice che «Gerico era ben chiusa e barricata per paura de’ figliuoli d’Israele; nessuno ne usciva e nessuno v’entrava»; la casa di Raab «era addossata alle mura della città, ed ella stava di casa sulle mura»; il settimo giorno, quando i sacerdoti suonarono e il popolo gridò, «le mura crollarono. Il popolo salì nella città, ciascuno diritto davanti a sé, e s’impadronirono della città». Giosuè maledisse chiunque la riedificasse, e i Re registrano che ai giorni di Acab «Hiel di Bethel riedificò Gerico; ne gettò le fondamenta su Abiram, suo primogenito, e ne rizzò le porte su Segub, il più giovane de’ suoi figliuoli». L’Epistola agli Ebrei riassume: «Per fede caddero le mura di Gerico, dopo essere state circuite per sette giorni»."
    - "Il tumulo reca una città del Bronzo Medio con bastione inclinato e muro di mattoni crudi su base di pietra, caduta in un incendio; i mattoni giacciono ammassati ai piedi del muro. John Garstang (scavi 1930–1936) datò la caduta a circa il 1400 a.C. e la disse di Giosuè. Kathleen Kenyon (1952–1958) mostrò con la ceramica che la città fu distrutta intorno al 1550 a.C., e la collegò all’espulsione egiziana degli Hyksos; trovò quasi nulla di un abitato verso il 1400 e nulla verso il 1250; il radiocarbonio sul grano della città bruciata (1995) concorda con lei. Bryant Wood sostenne nel 1990, da ceramica e scarabei, che la distruzione spetti dopotutto al 1400 a.C. circa, e alcuni conservatori lo seguono; i più tengono la data di Kenyon e vedono nel racconto una narrazione posteriore, mentre altri rispondono che l’erosione ha asportato la città del Bronzo Tardo."
  nl:
    - "Volgens de eigen rekening van de Bijbel in het jaar dat Israël de Jordaan overstak, veertig jaar na de uittocht: omstreeks 1406 v.Chr. volgens de chronologie die de kaart volgt, of in de 13e eeuw v.Chr. volgens de latere datering die veel geleerden verkiezen. De stad is de heuvel Tell es-Sultan naast de bron van Elisa, 22 km ten oosten van Jeruzalem, 250 m onder zeeniveau. Of de ruïnes bij een van beide data een vallende muur tonen, is omstreden, en het antwoord heeft een eeuw lang heen en weer gezwaaid. Sinds 1997 heeft een Italiaans-Palestijnse expeditie onder Lorenzo Nigro, aanvankelijk met Nicolò Marchetti, de heuvel opnieuw opgegraven; zij plaatst de verbranding van de stad uit de Midden-Bronstijd in de 16e eeuw v.Chr., en Nigro pleit voor een kleinere nederzetting in de 14e en 13e eeuw, waarvan de resten grotendeels door latere egalisatie zijn weggesneden."
    - "Jozua zegt: “Jericho nu sloot de poorten toe, en was gesloten, voor het aangezicht van de kinderen Israëls; er ging niemand uit, en er ging niemand in”; het huis van Rachab “was op den stadsmuur; en zij woonde op den muur”; op de zevende dag, toen de priesters bliezen en het volk juichte, “de muur viel onder zich, en het volk klom in de stad, een ieder tegenover zich, en zij namen de stad in”. Jozua vervloekte wie haar zou herbouwen, en Koningen vermeldt dat in de dagen van Achab “bouwde Hiel, de Betheliet, Jericho; op Abiram, zijn eerstgeborenen zoon, heeft hij haar gegrondvest, en op Segub, zijn jongsten zoon, heeft hij haar poorten gesteld”. Hebreeën vat samen: “Door het geloof zijn de muren van Jericho gevallen, als zij tot zeven dagen toe omringd waren geweest.”"
    - "De heuvel draagt een stad uit de Midden-Bronstijd met een hellende wal en een lemen muur op een stenen basis, die in een brand viel; de stenen liggen opgehoopt aan de voet. John Garstang (1930–1936) dateerde de val omstreeks 1400 v.Chr. en noemde haar die van Jozua. Kathleen Kenyon (1952–1958) toonde met aardewerk aan dat de stad omstreeks 1550 v.Chr. werd verwoest, wat zij verbond met de Egyptische verdrijving van de Hyksos, en vond bijna niets van een stad omstreeks 1400 en niets omstreeks 1250; koolstofdateringen van graan uit de verbrande stad (1995) bevestigen haar. Bryant Wood betoogde in 1990 uit aardewerk en scarabeeën dat de verwoesting toch bij ca. 1400 v.Chr. hoort, en enkele behoudende geleerden volgen hem; de meeste archeologen houden Kenyons datum aan en zien een latere navertelling, anderen antwoorden dat erosie de Late-Bronstijdstad heeft weggevoerd."
  cs:
    - "Podle vlastního počtu Bible v roce, kdy Izrael přešel Jordán, čtyřicet let po exodu: asi 1406 př. n. l. podle chronologie, kterou mapa sleduje, nebo ve 13. století př. n. l. podle pozdějšího datování, které mnozí badatelé upřednostňují. Město je pahorek Tell es-Sultán u Elíšova pramene, 22 km východně od Jeruzaléma, 250 m pod hladinou moře. Zda zříceniny ukazují padající hradbu v kterémkoli z těchto dat, je sporné a odpověď se po století přikláněla sem a tam. Od roku 1997 pahorek znovu zkoumá italsko-palestinská expedice pod vedením Lorenza Nigra, zprvu s Nicolòem Marchettim; klade spálení města střední doby bronzové do 16. století př. n. l. a Nigro hájí menší osídlení ve 14. a 13. století, jehož zbytky z velké části odstranilo pozdější vyrovnávání."
    - "Kniha Jozue praví, že „Jericho pak velmi pilně zavříno bylo pro strach synů Izraelských, a žádný nevycházel ven, ani tam nevcházel“; Rachabin dům „byl při zdi městské, a na zdi ona bydlila“; sedmého dne, když kněží zatroubili a lid zakřičel, „obořila se zed na místě svém. Tedy všel lid do města, jeden každý proti místu, kdež stál. I vzali je“. Jozue proklel každého, kdo by je znovu stavěl, a Kniha Královská zaznamenává, že za Achabových dnů „Hiel Bethelský vystavěl Jericho. V Abiramovi prvorozeném svém založil je, a v Segubovi nejmladším svém postavil brány jeho“. List Židům to shrnuje: „Věrou zdi Jericha padly, když je obcházeli za sedm dní.“"
    - "Pahorek nese město střední doby bronzové se svažitým valem a cihlovou zdí na kamenném soklu, které padlo v ohni; jeho cihly leží nahromaděné u paty zdi. John Garstang, který kopal v letech 1930–1936, datoval pád asi do roku 1400 př. n. l. a nazval jej Jozuovým. Kathleen Kenyonová (1952–1958) podle keramiky ukázala, že město bylo zničeno asi roku 1550 př. n. l., což spojila s vyhnáním Hyksósů z Egypta, a z města kolem roku 1400 nenašla téměř nic a z města kolem roku 1250 nic; radiokarbonová data na obilí ze spáleného města, zveřejněná roku 1995, s ní souhlasí. Bryant Wood roku 1990 z keramiky a skarabeů dovozoval, že zničení přece jen patří asi k roku 1400 př. n. l., a někteří konzervativní badatelé ho následují; většina archeologů drží Kenyonové datum a bere příběh jako pozdější vyprávění, zatímco jiní odpovídají, že eroze odnesla město pozdní doby bronzové."
  sv:
    - "Enligt Bibelns egen räkning det år då Israel gick över Jordan, fyrtio år efter uttåget: omkring 1406 f.Kr. enligt den kronologi som kartan följer, eller på 1200-talet f.Kr. enligt den senare datering som många forskare föredrar. Staden är kullen Tell es-Sultan vid Elishas källa, 22 km öster om Jerusalem och 250 m under havsytan. Om ruinerna visar att en mur föll vid något av de två årtalen är omtvistat, och svaret har svängt fram och tillbaka i ett sekel. Sedan 1997 har en italiensk-palestinsk expedition under Lorenzo Nigro, först tillsammans med Nicolò Marchetti, grävt kullen på nytt; den förlägger branden i mellanbronsålderns stad till 1500-talet f.Kr., och Nigro hävdar att det fanns en mindre bosättning på 1300- och 1200-talen, vars lämningar till stor del skurits bort av senare utjämning."
    - "Josua säger att ”Jeriko hade sina portar stängda, det höll sig tillstängt för Israels barn; ingen gick ut eller in”; Rachavs hus ”låg invid stadsmuren, så att hon bodde invid själva muren”; på sjunde dagen, när prästerna blåste och folket ropade, ”föllo murarna på stället, och folket drog över dem in i staden, var och en rätt fram; så intogo de staden”. Josua förbannade den som skulle bygga upp den på nytt, och Kungaböckerna uppger att beteliten Hiel på Achavs tid byggde upp Jeriko: ”när han lade dess grund, kostade det honom hans äldste son Abiram, och när han satte upp dess portar, kostade det honom hans yngste son Segib”. Hebreerbrevet sammanfattar: ”Genom tron föllo Jerikos murar, sedan man i sju dagar hade gått runt omkring dem.”"
    - "Kullen bär en stad från mellanbronsåldern med en sluttande vall och en lertegelmur på en stenbas, som föll i en brand; dess tegel ligger hopade vid murens fot. John Garstang, som grävde 1930–1936, daterade fallet till ca 1400 f.Kr. och kallade det Josuas. Kathleen Kenyon (1952–1958) visade med keramiken att staden förstördes ca 1550 f.Kr., vilket hon kopplade till hyksosernas fördrivning, och fann nästan ingenting av en stad ca 1400 och ingenting av en ca 1250; radiokoldateringar av säd från den brända staden, publicerade 1995, stämmer med henne. Bryant Wood hävdade 1990 utifrån keramiken och skarabéerna att förstörelsen ändå hör hemma ca 1400 f.Kr., och vissa konservativa forskare följer honom; de flesta arkeologer håller fast vid Kenyons datering och tar berättelsen som en senare återgivning, medan andra svarar att erosion fört bort senbronsålderns stad."
  nb:
    - "Etter Bibelens egen regning, i året Israel krysset Jordan, førti år etter uttoget: omkring 1406 f.Kr. etter kronologien kartet følger, eller på 1200-tallet f.Kr. etter den senere dateringen som mange forskere foretrekker. Byen er haugen Tell es-Sultan ved Elisjas kilde, 22 km øst for Jerusalem, 250 m under havets overflate. Om ruinene viser en mur som falt på noen av datoene, er omstridt, og svaret har svingt fram og tilbake i et århundre. Siden 1997 har en italiensk–palestinsk ekspedisjon under Lorenzo Nigro, først sammen med Nicolò Marchetti, gravd haugen på nytt; den plasserer brannen i mellombronsealderens by på 1500-tallet f.Kr., og Nigro argumenterer for en mindre bosetting på 1300- og 1200-tallet f.Kr., hvis rester i stor grad ble skåret bort av senere planering."
    - "Josva sier at «Jeriko holdt sine porter stengt og var fast tillukket for Israels barns skyld; ingen gikk ut, og ingen kom inn»; Rahabs hus «lå ved byens mur, så hun bodde like ved muren»; på den sjuende dagen, da prestene blåste og folket ropte, «falt muren helt sammen, og folket steg bent inn i byen og inntok den». Josva forbannet den som ville bygge den opp igjen, og Kongebøkene melder at i Ahabs dager «bygget Hiel fra Betel Jeriko op igjen; da han la dets grunnvoll, kostet det ham hans førstefødte sønn Abiram, og da han satte op dets porter, kostet det ham hans yngste sønn Segub». Hebreerbrevet sammenfatter: «Ved tro falt Jerikos murer, da de hadde gått omkring dem i syv dager.»"
    - "Haugen har en by fra mellombronsealderen med en skrånende voll og en mur av leirtegl på en steinsokkel, som falt i en brann; teglsteinene ligger i en haug ved murens fot. John Garstang, som gravde i 1930–1936, daterte fallet til omkring 1400 f.Kr. og kalte det Josvas. Kathleen Kenyon (1952–1958) viste ved keramikken at byen ble ødelagt omkring 1550 f.Kr., som hun knyttet til fordrivelsen av hyksosene fra Egypt, og fant nesten intet av en by omkring 1400 og intet omkring 1250; radiokarbondateringer av korn fra den brente byen, publisert i 1995, stemmer med henne. Bryant Wood hevdet i 1990 ut fra keramikk og skarabeer at ødeleggelsen likevel hører til omkring 1400 f.Kr., og noen konservative følger ham; de fleste arkeologer holder fast ved Kenyons dato og tar fortellingen som en senere gjenfortelling, mens andre svarer at erosjon har fjernet senbronsealderens by."
  tl:
    - "Ayon sa sariling pagbibilang ng Biblia, sa taong tumawid ang Israel sa Jordan, apatnapung taon pagkatapos ng Exodo: mga 1406 BK sa kronolohiya ng mapa, o sa ikalabintatlong siglo BK sa mas huling pagtatakda na mas gusto ng marami. Ang lungsod ay ang Tell es-Sultan sa tabi ng bukal ni Eliseo, 22 km sa silangan ng Jerusalem, 250 m sa ibaba ng dagat. Pinagtatalunan kung ipinakikita ng mga guho ang pagbagsak ng pader sa alinmang petsa, at isang siglo nang pabalik-balik ang sagot. Mula 1997, muling hinukay ng ekspedisyong Italyano–Palestino sa ilalim ni Lorenzo Nigro, noong una ay kasama si Nicolò Marchetti, ang burol; itinatakda nito ang pagsunog sa lungsod ng Gitnang Panahon ng Tanso sa ikalabing-anim na siglo BK, at nangangatwiran si Nigro para sa mas maliit na paninirahan sa ikalabing-apat at ikalabintatlong siglo, na ang mga labi ay naputol ng huling pagpapatag."
    - "Sinasabi ng Josue na “ang Jerico nga ay lubos na nakukubkob dahil sa mga anak ni Israel: walang nakalalabas, at walang nakapapasok”; ang bahay ni Rahab ay “nasa kuta ng bayan, at siya'y tumatahan sa kuta”; sa ikapitong araw, nang humihip ang mga saserdote at humiyaw ang bayan, “ang kuta ay gumuho, na ano pa't ang bayan ay sumampang nasok sa siyudad, na bawa't isa'y matuwid na nagpatuloy, at kanilang sinakop ang bayan”. Isinumpa ni Josue ang magtatayo nito, at itinala ng Mga Hari na sa mga araw ni Achab “itinayo ni Hiel na taga Beth-el ang Jerico: siya'y naglagay ng talagang-baon sa pagkamatay ni Abiram na kaniyang panganay, at itinayo ang mga pintuang-bayan niyaon sa pagkamatay ng kaniyang bunsong anak na si Segub”. Binubuod ng Hebreo: “Sa pananampalataya'y nangalagpak ang mga kuta ng Jerico, pagkatapos na makubkob na pitong araw.”"
    - "May lungsod sa burol ng Gitnang Panahon ng Tanso na may pilapil na dalisdis at pader na laryong putik sa batong pundasyon, bumagsak sa apoy; nakatambak ang mga laryo sa paanan ng pader. Itinakda ni John Garstang (1930–1936) ang pagbagsak sa mga 1400 BK at tinawag na kay Josue. Ayon sa palayok ni Kathleen Kenyon (1952–1958), winasak ang lungsod noong mga 1550 BK, kaugnay ng pagpapaalis ng Egipto sa mga Hyksos, at halos walang bayan noong mga 1400 at wala noong mga 1250; sang-ayon ang radiocarbon sa butil ng sinunog na lungsod (1995). Nangatwiran si Bryant Wood (1990), mula sa palayok at eskarabeo, na mga 1400 BK pa rin ang pagkawasak, at sumusunod ang ilang konserbatibong iskolar; hawak ng karamihan ng arkeologo ang petsa ni Kenyon at itinuturing na mas huling salaysay ang kuwento, ngunit sagot ng iba, tinangay ng pagguho ang bayan ng Huling Panahon ng Tanso."
  da:
    - "Efter Bibelens egen beregning i det år, Israel krydsede Jordan, fyrre år efter udvandringen: omkring 1406 f.Kr. efter den kronologi, kortet følger, eller i 1200-tallet f.Kr. efter den senere datering, som mange forskere foretrækker. Byen er højen Tell es-Sultan ved Elisas kilde, 22 km øst for Jerusalem, 250 m under havets overflade. Om ruinerne viser en mur, der faldt på et af tidspunkterne, er omstridt, og svaret har svinget frem og tilbage i et århundrede. Siden 1997 har en italiensk-palæstinensisk ekspedition under Lorenzo Nigro, først sammen med Nicolò Marchetti, gravet i højen igen; den placerer afbrændingen af mellembronzealderens by i 1500-tallet f.Kr., og Nigro argumenterer for en mindre bosættelse i 1300- og 1200-tallet, hvis rester i vidt omfang blev skåret væk af senere planering."
    - "Josvabogen siger, at »Jeriko havde lukket for sig og var tillukket for Israels Børns Ansigt; der kunde ingen gaa ud, ej heller komme ind«; Rahabs hus »var ved Stadens Mur, og hun boede ved Muren«; på den syvende dag, da præsterne blæste og folket skreg, »Muren faldt lige ned, og Folket steg op i Staden, hver lige frem for sig, og de indtoge Staden«. Josva forbandede den, der ville genopbygge den, og Kongebøgerne beretter, at i Akabs dage »byggede Betheliteren Hiel Jeriko; det kostede ham Abiram, hans førstefødte Søn, der han lagde dens Grundvold, og Segub, hans yngste Søn, der han satte dens Porte«. Hebræerbrevet opsummerer: »Ved Tro faldt Jerikos Mure, efter at de vare omgaaede i syv Dage.«"
    - "Højen rummer en mellembronzealderby med en skrå vold og en lerstensmur på en stensokkel, som faldt i en brand; dens lersten ligger hobet op ved murens fod. John Garstang, der gravede i 1930–1936, daterede faldet til omkring 1400 f.Kr. og kaldte det Josvas. Kathleen Kenyon (1952–1958) viste ud fra keramikken, at byen blev ødelagt omkring 1550 f.Kr., som hun knyttede til egypternes uddrivelse af hyksos, og fandt næsten intet af en by omkring 1400 og intet omkring 1250; radiokulstofdateringer af korn fra den brændte by, fra 1995, stemmer med hende. Bryant Wood hævdede i 1990 af keramik og skarabæer, at ødelæggelsen alligevel hører til omkring 1400 f.Kr., og nogle konservative forskere følger ham; de fleste arkæologer fastholder Kenyons datering og tager beretningen som en senere genfortælling, mens andre svarer, at erosion har ført den sene bronzealders by bort."
  sr:
    - "По рачуну саме Библије, у години кад је Израиљ прешао Јордан, четрдесет година после Изласка: око 1406. п. н. е. по хронологији коју прати карта, или у 13. веку п. н. е. по каснијем датирању које многи научници преферирају. Град је хумка Тел ес Султан поред Јелисијевог извора, 22 км источно од Јерусалима, 250 м испод нивоа мора. Да ли рушевине показују пад зида у једном од та два датума, оспорава се, а одговор се већ век њише напред-назад. Од 1997. италијанско-палестинска експедиција под Лоренцом Нигром, у почетку с Николом Маркетијем, поново копа хумку; она спаљивање града из средњег бронзаног доба смешта у 16. век п. н. е., а Нигро заступа мање насеље у 14. и 13. веку, чији су остаци у великој мери одсечени каснијим равнањем."
    - "Књига Исуса Навина каже: „А Јерихон се затвори, и чуваше се од синова Израиљевих; нико није излазио, нити је ко улазио“; о Равиној кући стоји: „кућа њена беше на зиду градском, и она на зиду становаше“; седмог дана, кад су свештеници затрубили а народ повикао, „попадаше зидови на месту свом; и народ уђе у град, сваки напрема се; и узеше град“. Исус Навин је проклео онога ко би га обновио, а Књиге о царевима бележе да је у Ахавово време „Хил Ветиљанин сазида Јерихон. На Авирону првенцу свом основа га, а на Сегуву мезимцу свом метну му врата“. Посланица Јеврејима сабира: „Вером падоше зидови јерихонски, кад се обилази око њих седам дана.“"
    - "На хумци је град из средњег бронзаног доба с косим бедемом и зидом од необрађене цигле на каменој основи, који је пао у пожару; његове цигле леже нагомилане у подножју зида. Џон Гарстанг, копајући 1930–1936, датирао је пад око 1400. п. н. е. и назвао га Исус-Навиновим. Кетлин Кенион (1952–1958) показала је по керамици да је град уништен око 1550. п. н. е., што је повезала са египатским протеривањем Хикса, и нашла готово ништа од насеља око 1400 и ништа око 1250; радиокарбонски датуми зрна из спаљеног града, објављени 1995, слажу се с њом. Брајант Вуд је 1990. на основу керамике и скарабеја тврдио да рушење ипак припада око 1400. п. н. е., и неки конзервативни научници га следе; већина археолога држи Кенионин датум и узима причу као каснију верзију, док други одговарају да је ерозија однела касно бронзано насеље."
