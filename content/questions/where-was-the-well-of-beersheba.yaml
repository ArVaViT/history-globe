id: where-was-the-well-of-beersheba
question:
  en: "Where was Abraham's well at Beersheba?"
  ru: "Где был колодезь Авраама в Вирсавии?"
  uk: "Де був колодязь Авраама в Беер-Шеві?"
  es: "¿Dónde estaba el pozo de Abraham en Beerseba?"
  pt: "Onde ficava o poço de Abraão em Berseba?"
  de: "Wo lag Abrahams Brunnen bei Beerscheba?"
  fr: "Où se trouvait le puits d’Abraham à Beer-Schéba ?"
  pl: "Gdzie była studnia Abrahama w Beer-Szebie?"
  it: "Dov’era il pozzo di Abramo a Bersabea?"
  cs: "Kde byla Abrahamova studna v Beer-šebě?"
  nl: "Waar was de put van Abraham bij Berseba?"
  sv: "Var låg Abrahams brunn i Beer Sheva?"
  nb: "Hvor lå Abrahams brønn i Beer-Sjeba?"
  tl: "Nasaan ang balon ni Abraham sa Beer-seba?"
  da: "Hvor var Abrahams brønd ved Beersheba?"
  sr: "Где је био Аврамов бунар у Вирсавеји?"
  hu: "Hol volt Ábrahám kútja Beérsebában?"
  fi: "Missä Abrahamin kaivo Beersebassa oli?"
  vi: "Giếng của Áp-ra-ham tại Bê-e-Sê-ba ở đâu?"
  ro: "Unde se afla fântâna lui Avraam din Beer-Șeba?"
  bg: "Къде се е намирал кладенецът на Авраам във Вирсавия?"
answer:
  en:
    - "At Beersheba in the northern Negev, about 70 km south-west of Jerusalem in a straight line, but the exact well cannot be pointed out. The map point stands on Tel Beer Sheva, the mound of the biblical town about 4 km east of the modern city, where a deep well was found outside the city gate; the excavators dated the town to the Iron Age, long after the patriarchs, so no surviving well can be shown to be Abraham's. In the modern city an old well by the stream bed near the Old City, described by Edward Robinson in 1838, is shown as Abraham's Well, by tradition only."
    - "Genesis tells of a quarrel over water with Abimelech, king of Gerar, about 27 km to the north-west: “Abraham reproved Abimelech because of a well of water, which Abimelech's servants had violently taken away.” Abraham gave him seven ewe lambs as a witness “that I have digged this well”, and “he called that place Beer-sheba; because there they sware both of them.” Then he “planted a grove in Beer-sheba, and called there on the name of the LORD, the everlasting God.” The Hebrew name allows both readings, “well of seven” and “well of the oath”, and the story plays on both."
    - "A generation later the Philistines had stopped Abraham's wells, and Isaac dug them again. On the day he made his own oath with Abimelech his servants came and said, “We have found water”, and “he called it Shebah: therefore the name of the city is Beer-sheba unto this day.” Eusebius in the fourth century knew Beersheba as a large village with a Roman garrison and noted that many wells of the patriarchs were still pointed out in the district of Gerar."
  ru:
    - "В Вирсавии на севере Негева, примерно в 70 км к юго-западу от Иерусалима по прямой, но указать сам колодезь нельзя. Точка карты стоит на Тель-Шеве, холме библейского города примерно в 4 км к востоку от современного, где за городскими воротами нашли глубокий колодец; раскопщики датировали город железным веком, много позже патриархов, так что ни один сохранившийся колодец нельзя признать Авраамовым. В современном городе старый колодец у русла возле Старого города, описанный Эдвардом Робинсоном в 1838 году, показывают как «колодец Авраама» — лишь по преданию."
    - "Книга Бытия рассказывает о споре за воду с Авимелехом, царём Герара, лежащего примерно в 27 км к северо-западу: «Авраам упрекал Авимелеха за колодезь с водою, который отняли рабы Авимелеховы». Авраам дал ему семь агниц в свидетельство, «что я выкопал этот колодезь». «Потому и назвал он сие место: Вирсавия, ибо тут оба они клялись». Потом «насадил Авраам при Вирсавии рощу и призвал там имя Господа, Бога вечного». Еврейское имя допускает два прочтения — «колодец семи» и «колодец клятвы», — и рассказ играет обоими."
    - "Через поколение филистимляне завалили колодцы Авраама, и Исаак выкопал их вновь. В тот день, когда он сам заключил клятву с Авимелехом, рабы его пришли и сказали: «мы нашли воду», и «он назвал его: Шива. Посему имя городу тому Беэршива (Вирсавия) до сего дня». Евсевий в IV веке знал Вирсавию как большое селение с римским гарнизоном и отмечал, что многие колодцы патриархов ещё показывают в области Герара."
  uk:
    - "У Беер-Шеві в північному Негеві, приблизно за 70 км на південний захід від Єрусалима по прямій, але точний колодязь вказати неможливо. Точка на мапі стоїть на Тель-Беер-Шеві, пагорбі біблійного міста приблизно за 4 км на схід від сучасного міста, де за міською брамою знайшли глибокий колодязь; розкопники датували місто залізним віком, задовго після патріархів, тож жоден збережений колодязь не можна вважати колодязем Авраама. У сучасному місті старий колодязь біля русла потоку поблизу Старого міста, описаний Едвардом Робінсоном 1838 р., показують як колодязь Авраама, лише за переказом."
    - "Книга Буття розповідає про суперечку за воду з Авімелехом, царем Герара, приблизно за 27 км на північний захід: «докоряв Авраам Абимелеха, за колодязь водяний, що відняли раби Абимелехові». Авраам дав йому сім ягниць як свідоцтво, «що я викопав колодязь сей», і «проложено прізвище місцеві тому: Бейер-Себа, колодязь клятьби; бо там клялись обидва». Потім «посадив Авраам тамариску, і призвав там імя Господа Бога вічного». Єврейська назва допускає обидва прочитання, «колодязь семи» і «колодязь клятви», і оповідь грається обома."
    - "Через покоління філістимляни позасипали колодязі Авраама, і Ісаак викопав їх знову. У день, коли він склав власну присягу з Авімелехом, його раби прийшли й сказали: «Знайшли воду», і «прозвав його Себа, клятьба. Тим назва й міста того Бейер-Себа, колодязь клятьби, по сей день». Євсевій у IV ст. знав Беер-Шеву як велике село з римським гарнізоном і зауважив, що багато колодязів патріархів ще показували в окрузі Герара."
  es:
    - "En Beerseba, en el norte del Négueb, a unos 70 km al suroeste de Jerusalén en línea recta, pero no puede señalarse el pozo exacto. El punto del mapa está sobre Tel Beer Sheva, el montículo de la ciudad bíblica, a unos 4 km al este de la ciudad moderna, donde se halló un pozo profundo fuera de la puerta de la ciudad; los excavadores fecharon la ciudad en la Edad del Hierro, mucho después de los patriarcas, de modo que ningún pozo conservado puede mostrarse como de Abraham. En la ciudad moderna, un viejo pozo junto al cauce del arroyo cerca de la Ciudad Vieja, descrito por Edward Robinson en 1838, se muestra como el Pozo de Abraham, solo por tradición."
    - "El Génesis cuenta una disputa por el agua con Abimelec, rey de Gerar, a unos 27 km al noroeste: «Abraham reconvino á Abimelech á causa de un pozo de agua, que los siervos de Abimelech le habían quitado». Abraham le dio siete corderas como testimonio de que «yo cavé este pozo», y «llamó á aquel lugar Beer-seba; porque allí juraron ambos». Luego «plantó Abraham un bosque en Beer-seba, é invocó allí el nombre de Jehová Dios eterno». El nombre hebreo admite ambas lecturas, «pozo de siete» y «pozo del juramento», y el relato juega con las dos."
    - "Una generación después, los filisteos habían cegado los pozos de Abraham, e Isaac los abrió de nuevo. El día en que hizo su propio juramento con Abimelec, sus siervos vinieron y dijeron: «Agua hemos hallado», y «llamólo Seba: por cuya causa el nombre de aquella ciudad es Beer-seba hasta este día». Eusebio, en el siglo IV, conocía Beerseba como una aldea grande con guarnición romana y señaló que en el distrito de Gerar aún se mostraban muchos pozos de los patriarcas."
  pt:
    - "Em Berseba, no norte do Neguebe, a cerca de 70 km a sudoeste de Jerusalém em linha reta, mas o poço exato não pode ser indicado. O ponto do mapa fica em Tel Beer Sheva, o monte da cidade bíblica a cerca de 4 km a leste da cidade moderna, onde se encontrou um poço profundo fora da porta da cidade; os escavadores datam a cidade da Idade do Ferro, muito depois dos patriarcas, de modo que nenhum poço sobrevivente pode ser mostrado como sendo de Abraão. Na cidade moderna, um velho poço junto ao leito do riacho perto da Cidade Velha, descrito por Edward Robinson em 1838, é mostrado como Poço de Abraão, somente por tradição."
    - "O Gênesis conta uma disputa por água com Abimeleque, rei de Gerar, a cerca de 27 km a noroeste: “Abraão queixou-se a Abimeleque por causa de um poço de água, que os servos de Abimeleque haviam tomado à força.” Abraão lhe deu sete cordeiras como testemunho “de que eu cavei este poço”, e “ele chamou aquele lugar de Berseba, porque ambos fizeram um juramento ali.” Então “plantou uma tamargueira em Berseba, e ali ele invocou o nome do SENHOR, o Deus Eterno.” O nome hebraico permite as duas leituras, “poço dos sete” e “poço do juramento”, e a história joga com ambas."
    - "Uma geração depois, os filisteus haviam entulhado os poços de Abraão, e Isaque os cavou de novo. No dia em que fez o seu próprio juramento com Abimeleque, seus servos vieram e disseram: “Encontramos água.” E “Ele o chamou de ‘Siba’. Por isso o nome da cidade é ‘Berseba’ até o dia de hoje.” Eusébio, no século IV, conhecia Berseba como uma grande aldeia com guarnição romana e observou que muitos poços dos patriarcas ainda eram mostrados no distrito de Gerar."
  de:
    - "Bei Beerscheba im nördlichen Negev, in der Luftlinie etwa 70 km südwestlich von Jerusalem, doch der genaue Brunnen lässt sich nicht zeigen. Der Kartenpunkt steht auf Tel Beer Scheva, dem Hügel der biblischen Stadt etwa 4 km östlich der modernen Stadt, wo vor dem Stadttor ein tiefer Brunnen gefunden wurde; die Ausgräber datierten die Stadt in die Eisenzeit, lange nach den Erzvätern, sodass kein erhaltener Brunnen als der Abrahams erwiesen werden kann. In der modernen Stadt wird ein alter Brunnen am Bachbett nahe der Altstadt, den Edward Robinson 1838 beschrieb, als Abrahams Brunnen gezeigt, nur nach der Überlieferung."
    - "Die Genesis erzählt von einem Streit um Wasser mit Abimelech, dem König von Gerar, etwa 27 km nordwestlich: „Und Abraham setzte Abimelech zur Rede um des Wasserbrunnens willen, den Abimelechs Knechte hatten mit Gewalt genommen.“ Abraham gab ihm sieben Lämmer als Zeugnis, „daß ich diesen Brunnen gegraben habe“, und „Daher heißt die Stätte Beer-Seba, weil sie beide miteinander da geschworen haben.“ Dann: „Abraham aber pflanzte Bäume zu Beer-Seba und predigte daselbst von dem Namen des HERRN, des ewigen Gottes.“ Der hebräische Name erlaubt beide Lesarten, „Brunnen der Sieben“ und „Brunnen des Eides“, und die Erzählung spielt mit beiden."
    - "Eine Generation später hatten die Philister Abrahams Brunnen verstopft, und Isaak grub sie wieder auf. An dem Tag, an dem er seinen eigenen Eid mit Abimelech geschworen hatte, kamen seine Knechte und sagten: „Wir haben Wasser gefunden“, und „er nannte ihn Seba; daher heißt die Stadt Beer-Seba bis auf den heutigen Tag.“ Eusebius kannte Beerscheba im 4. Jahrhundert als großes Dorf mit römischer Garnison und vermerkte, dass im Gebiet von Gerar noch viele Brunnen der Erzväter gezeigt wurden."
  fr:
    - "À Beer-Schéba, dans le nord du Négev, à environ 70 km au sud-ouest de Jérusalem à vol d’oiseau, mais on ne peut pas désigner le puits exact. Le point de la carte se trouve sur Tel Beer Sheva, le tertre de la ville biblique à environ 4 km à l’est de la ville moderne, où un puits profond fut trouvé hors de la porte de la ville ; les fouilleurs ont daté la ville de l’âge du Fer, bien après les patriarches, de sorte qu’aucun puits conservé ne peut être montré comme celui d’Abraham. Dans la ville moderne, un ancien puits près du lit du torrent, à proximité de la vieille ville, décrit par Edward Robinson en 1838, est montré comme le puits d’Abraham, par la seule tradition."
    - "La Genèse raconte une querelle à propos de l’eau avec Abimélec, roi de Guérar, à environ 27 km au nord-ouest : « Abraham fit des reproches à Abimélec, au sujet d’un puits d’eau, dont s’étaient emparés de force les serviteurs d’Abimélec. » Abraham lui donna sept jeunes brebis « afin que cela me serve de témoignage que j’ai creusé ce puits », et « C’est pourquoi on appelle ce lieu Beer-Schéba ; car c’est là qu’ils jurèrent l’un et l’autre. » Puis « Abraham planta des tamaris à Beer-Schéba ; et là il invoqua le nom de l’Éternel, Dieu de l’éternité. » Le nom hébreu permet les deux lectures, « puits des sept » et « puits du serment », et le récit joue sur les deux."
    - "Une génération plus tard, les Philistins avaient comblé les puits d’Abraham, et Isaac les creusa de nouveau. Le jour où il fit son propre serment avec Abimélec, ses serviteurs vinrent lui dire : « Nous avons trouvé de l’eau », et « Il l’appela Schiba. C’est pourquoi on a donné à la ville le nom de Beer-Schéba, jusqu’à ce jour. » Eusèbe, au IVe siècle, connaissait Beer-Schéba comme un grand village avec une garnison romaine, et notait que beaucoup de puits des patriarches étaient encore montrés dans le district de Guérar."
  pl:
    - "W Beer-Szebie w północnym Negewie, około 70 km na południowy zachód od Jerozolimy w linii prostej, ale dokładnej studni nie da się wskazać. Punkt na mapie stoi na Tel Beer Sheva, wzgórzu biblijnego miasta około 4 km na wschód od współczesnego miasta, gdzie za bramą miejską znaleziono głęboką studnię; odkrywcy datowali miasto na epokę żelaza, długo po patriarchach, więc żadnej zachowanej studni nie można uznać za Abrahamową. We współczesnym mieście stara studnia przy korycie potoku koło Starego Miasta, opisana przez Edwarda Robinsona w 1838, jest pokazywana jako Studnia Abrahama, wyłącznie z tradycji."
    - "Księga Rodzaju opowiada o sporze o wodę z Abimelekiem, królem Gerar, oddalonego o około 27 km na północny zachód: „I przymawiał Abraham Abimelechowi o studnią wody, którą mu byli gwałtem odjęli słudzy Abimelechowi”. Abraham dał mu siedem owieczek jako świadectwo, „żem wykopał tę studnię”, i „nazwano miejsce ono Beerseba; albowiem tam obaj przysięgli”. Potem „nasadził Abraham drzewa w Beerseba, i wzywał tam imienia Pana Boga wiecznego”. Hebrajska nazwa dopuszcza oba odczytania, „studnia siedmiu” i „studnia przysięgi”, a opowieść gra na obu."
    - "Pokolenie później Filistyni zasypali studnie Abrahama, a Izaak wykopał je ponownie. W dniu, gdy złożył własną przysięgę z Abimelekiem, przyszli jego słudzy i powiedzieli: „Znaleźliśmy wodę”, a „nazwał ją Syba; dlategoż imię miasta onego jest nazwane Beerseba aż do dnia dzisiejszego”. Euzebiusz w IV wieku znał Beer-Szebę jako dużą wieś z rzymskim garnizonem i zaznaczył, że w okręgu Gerar wciąż pokazywano wiele studni patriarchów."
  it:
    - "A Bersabea nel Negheb settentrionale, a circa 70 km a sud-ovest di Gerusalemme in linea d’aria, ma il pozzo esatto non può essere indicato. Il punto della mappa si trova su Tel Beer Sheva, il tell della città biblica a circa 4 km a est della città moderna, dove fu trovato un pozzo profondo fuori della porta della città; gli scavatori datarono la città all’età del Ferro, molto dopo i patriarchi, così che nessun pozzo superstite può dirsi di Abramo. Nella città moderna un vecchio pozzo presso il letto del torrente vicino alla Città Vecchia, descritto da Edward Robinson nel 1838, è mostrato come Pozzo di Abramo, solo per tradizione."
    - "La Genesi racconta una disputa per l’acqua con Abimelec, re di Gerar, a circa 27 km a nord-ovest: «Abrahamo fece delle rimostranze ad Abimelec per cagione di un pozzo d’acqua, di cui i servi di Abimelec s’erano impadroniti per forza». Abramo gli diede sette agnelle come testimonianza «che io ho scavato questo pozzo», e «egli chiamò quel luogo Beer-Sceba, perché ambedue vi avean fatto giuramento». Poi «piantò un tamarindo a Beer-Sceba, e invocò quivi il nome dell’Eterno, l’Iddio della eternità». Il nome ebraico consente entrambe le letture, «pozzo di sette» e «pozzo del giuramento», e il racconto gioca su entrambe."
    - "Una generazione dopo, i Filistei avevano turato i pozzi di Abramo, e Isacco li scavò di nuovo. Il giorno in cui fece il proprio giuramento con Abimelec, i suoi servi vennero a dirgli: «Abbiam trovato dell’acqua», ed «egli lo chiamò Sciba. Per questo la città porta il nome di Beer-Sceba, fino al di d’oggi». Eusebio nel IV secolo conosceva Bersabea come un grande villaggio con una guarnigione romana e notò che molti pozzi dei patriarchi venivano ancora mostrati nel distretto di Gerar."
  cs:
    - "V Beer-šebě v severním Negevu, vzdušnou čarou asi 70 km jihozápadně od Jeruzaléma, ale přesnou studnu nelze ukázat. Bod na mapě stojí na Tel Beer Sheva, pahorku biblického města asi 4 km východně od moderního města, kde byla nalezena hluboká studna před městskou branou; vykopávači datovali město do doby železné, dlouho po patriarších, takže o žádné dochované studni nelze prokázat, že je Abrahamova. V moderním městě se jako Abrahamova studna ukazuje stará studna u koryta potoka poblíž Starého města, popsaná Edwardem Robinsonem roku 1838, pouze podle tradice."
    - "Genesis vypráví o sporu o vodu s Abimelekem, králem Gerary, asi 27 km na severozápad: „domlouval se Abraham na Abimelecha o studnici vody, kterouž mu mocí odjali služebníci Abimelechovi“. Abraham mu dal sedm jehnic na svědectví, „že jsem kopal studnici tuto“, a „nazváno jest to místo Bersabé, že tu oba dva přisáhli“. Potom „nasázel stromoví v Bersabé, a vzýval tam jméno Hospodina, Boha silného, věčného“. Hebrejské jméno připouští obojí čtení, „studna sedmi“ i „studna přísahy“, a příběh si hraje s oběma."
    - "O generaci později Pelištejci Abrahamovy studny zasypali a Izák je vykopal znovu. V den, kdy učinil vlastní přísahu s Abimelekem, přišli jeho služebníci a řekli: „Nalezli jsme vodu“, a „nazval ji Seba. Protož jméno města toho jest Bersabé až do dnešního dne“. Eusebios ve 4. století znal Beer-šebu jako velkou vesnici s římskou posádkou a poznamenal, že v kraji Gerary se dosud ukazovalo mnoho studní patriarchů."
  nl:
    - "Bij Berseba in de noordelijke Negev, hemelsbreed ongeveer 70 km ten zuidwesten van Jeruzalem, maar de exacte put kan niet worden aangewezen. Het punt op de kaart staat op Tel Beer Sheva, de heuvel van de bijbelse stad ongeveer 4 km ten oosten van de moderne stad, waar buiten de stadspoort een diepe put werd gevonden; de opgravers dateerden de stad in de ijzertijd, lang na de aartsvaders, zodat geen enkele bewaard gebleven put als die van Abraham kan worden aangewezen. In de moderne stad wordt een oude put bij de rivierbedding nabij de Oude Stad, beschreven door Edward Robinson in 1838, getoond als de Put van Abraham, alleen volgens de overlevering."
    - "Genesis vertelt over een twist om water met Abimelech, koning van Gerar, ongeveer 27 km naar het noordwesten: “Abraham berispte Abimelech ter oorzake van een waterput, die Abimelechs knechten met geweld genomen hadden.” Abraham gaf hem zeven ooilammeren als getuigenis, “dat ik dezen put gegraven heb”, en “Daarom noemde men die plaats Ber-seba, omdat die beiden daar gezworen hadden.” Daarna: “hij plantte een bos in Ber-seba, en riep aldaar den Naam des HEEREN, des eeuwigen Gods, aan.” De Hebreeuwse naam laat beide lezingen toe, “put van zeven” en “put van de eed”, en het verhaal speelt met beide."
    - "Een generatie later hadden de Filistijnen Abrahams putten dichtgestopt, en Isaak groef ze opnieuw. Op de dag dat hij zijn eigen eed met Abimelech zwoer, kwamen zijn knechten en zeiden: “Wij hebben water gevonden”, en “hij noemde denzelven Seba; daarom is de naam dier stad Ber-seba, tot op dezen dag.” In de vierde eeuw kende Eusebius Berseba als een groot dorp met een Romeins garnizoen en merkte op dat in het district van Gerar nog veel putten van de aartsvaders werden aangewezen."
  sv:
    - "I Beer Sheva i norra Negev, omkring 70 km sydväst om Jerusalem i fågelvägen, men den exakta brunnen kan inte pekas ut. Kartpunkten står på Tel Beer Sheva, kullen med den bibliska staden omkring 4 km öster om den moderna staden, där en djup brunn hittades utanför stadsporten; utgrävarna daterade staden till järnåldern, långt efter patriarkerna, så ingen bevarad brunn kan visas vara Abrahams. I den moderna staden visas en gammal brunn vid flodbädden nära Gamla staden, beskriven av Edward Robinson 1838, som Abrahams brunn, enbart enligt tradition."
    - "Första Moseboken berättar om ett gräl om vatten med Avimelek, kung av Gerar, omkring 27 km åt nordväst: ”Dock gjorde Abraham Abimelek förebråelser angående en vattenbrunn som Abimeleks tjänare hade tagit ifrån honom.” Abraham gav honom sju lamm som ett vittnesbörd ”därom att det är jag som har grävt denna brunn”, och ”därav kallades det stället Beer-Seba, eftersom de båda där gingo eden”. Därefter planterade Abraham ”en tamarisk vid Beer-Seba och åkallade där HERRENS, den evige Gudens, namn”. Det hebreiska namnet tillåter båda läsningarna, ”sjuns brunn” och ”edens brunn”, och berättelsen spelar på båda."
    - "En generation senare hade filistéerna kastat igen Abrahams brunnar, och Isak grävde ut dem på nytt. Samma dag som han svor sin egen ed med Avimelek kom hans tjänare och sade: ”Vi hava funnit vatten.” ”Och han kallade den Sibea. Därav heter staden Beer-Seba ännu i dag.” Eusebios kände på 300-talet Beer Sheva som en stor by med en romersk garnison och noterade att många av patriarkernas brunnar ännu pekades ut i Gerars distrikt."
  nb:
    - "I Beer-Sjeba i nordlige Negev, omtrent 70 km sørvest for Jerusalem i luftlinje, men den nøyaktige brønnen kan ikke pekes ut. Kartpunktet står på Tel Beer Sheva, haugen til den bibelske byen omtrent 4 km øst for den moderne byen, der en dyp brønn ble funnet utenfor byporten; utgraverne daterte byen til jernalderen, lenge etter patriarkene, så ingen bevart brønn kan påvises å være Abrahams. I den moderne byen vises en gammel brønn ved elveleiet nær gamlebyen, beskrevet av Edward Robinson i 1838, som Abrahams brønn, bare etter tradisjon."
    - "Første Mosebok forteller om en strid om vann med Abimelek, konge i Gerar, omtrent 27 km mot nordvest: «Abraham gikk i rette med Abimelek for en brønn som Abimeleks tjenere hadde tatt med vold.» Abraham ga ham syv ungsauer som vitnesbyrd «at jeg har gravd denne brønn», og «Derfor kalte de dette sted Be’erseba; for der gjorde de begge sin ed.» Og «Abraham plantet en tamarisk i Be’erseba, og der påkalte han Herrens, den evige Guds navn». Det hebraiske navnet tillater begge lesningene, «brønn av sju» og «edens brønn», og fortellingen spiller på begge."
    - "En generasjon senere hadde filistrene stengt Abrahams brønner, og Isak gravde dem opp igjen. Samme dag som han avla sin egen ed med Abimelek, kom hans tjenere og sa: «Vi har funnet vann», og «han kalte den Siba; derfor heter byen Be’erseba den dag i dag.» Eusebius kjente på 300-tallet Beer-Sjeba som en stor landsby med romersk garnison og bemerket at mange av patriarkenes brønner fortsatt ble pekt ut i distriktet Gerar."
  tl:
    - "Sa Beer-seba sa hilagang Negev, mga 70 km sa timog-kanluran ng Jerusalem sa tuwid na guhit, ngunit hindi maituturo ang eksaktong balon. Nasa Tel Beer Sheva ang punto sa mapa, ang burol ng bayan sa Biblia na mga 4 km sa silangan ng makabagong lungsod, kung saan natagpuan ang isang malalim na balon sa labas ng tarangkahan ng bayan; ipinetsa ng mga naghukay ang bayan sa Panahong Bakal, matagal pagkatapos ng mga patriyarka, kaya walang nakaligtas na balon ang maipapakitang kay Abraham. Sa makabagong lungsod, isang lumang balon sa tabi ng sapa malapit sa Lumang Lungsod, na inilarawan ni Edward Robinson noong 1838, ay ipinakikita bilang Balon ni Abraham, ayon sa tradisyon lamang."
    - "Isinasalaysay ng Genesis ang pag-aaway sa tubig kay Abimelech, hari ng Gerar, mga 27 km sa hilagang-kanluran: “pinagwikaan ni Abraham si Abimelech dahil sa isang balon ng tubig, na marahas na inalis sa kaniya ng mga bataan ni Abimelech.” Ibinigay ni Abraham sa kaniya ang pitong korderong babae upang maging “patotoo na hinukay ko ang balong ito”, at “tinawag niya ang dakong yaong Beerseba; sapagka't doon sila kapuwa nanumpa.” Pagkatapos ay “nagtanim si Abraham ng isang punong kahoy na tamaring sa Beerseba, at sinambitla doon ang pangalan ng Panginoong Dios na walang hanggan.” Pinahihintulutan ng pangalang Hebreo ang dalawang pagbasa, “balon ng pito” at “balon ng sumpa”, at nilalaro ng kuwento ang dalawa."
    - "Isang henerasyon pagkatapos, ipinasara ng mga Filisteo ang mga balon ni Abraham, at muling hinukay ni Isaac ang mga ito. Nang araw na gumawa siya ng sarili niyang sumpa kay Abimelech, dumating ang kaniyang mga lingkod at sinabi, “Nakasumpong kami ng tubig”, at “tinawag niyang Seba: kaya't ang pangalan ng bayang yaon ay Beerseba hanggang ngayon.” Kilala ni Eusebio noong ika-4 na siglo ang Beer-seba bilang malaking nayon na may garison na Romano at binanggit na maraming balon ng mga patriyarka ang ipinakikita pa rin sa distrito ng Gerar."
  da:
    - "Ved Beersheba i det nordlige Negev, ca. 70 km sydvest for Jerusalem i fugleflugt, men den nøjagtige brønd kan ikke udpeges. Kortets punkt står på Tel Beer Sheva, tellen for den bibelske by ca. 4 km øst for den moderne by, hvor der blev fundet en dyb brønd uden for byporten; udgraverne daterede byen til jernalderen, længe efter patriarkerne, så ingen bevaret brønd kan påvises at være Abrahams. I den moderne by vises en gammel brønd ved flodlejet nær den gamle bydel, beskrevet af Edward Robinson i 1838, som Abrahams brønd, alene ifølge traditionen."
    - "Første Mosebog fortæller om en strid om vand med Abimelek, konge af Gerar, ca. 27 km mod nordvest: »Abraham straffede Abimelek for den Vandbrønds Skyld, som Abimeleks Tjenere havde borttaget med Vold.« Abraham gav ham syv lam som vidnesbyrd »at jeg har gravet denne Brønd«, og han kaldte »dette Sted Beersaba; thi der svore de begge.« Derefter plantede han »en Lund i Beersaba og paakaldte der Herrens, den evige Guds, Navn.« Det hebraiske navn tillader begge læsninger, »syvs brønd« og »edens brønd«, og beretningen spiller på begge."
    - "En generation senere havde filisterne tilstoppet Abrahams brønde, og Isak gravede dem igen. Den dag, han indgik sin egen ed med Abimelek, kom hans tjenere og sagde: »Vi have fundet Vand«, og »han kaldte den Skibea, deraf er Stadens Navn Beersaba indtil denne Dag.« Eusebios kendte i 300-tallet Beersheba som en stor landsby med romersk garnison og bemærkede, at mange af patriarkernes brønde stadig blev vist i Gerars distrikt."
  sr:
    - "У Вирсавеји у северном Негеву, око 70 км југозападно од Јерусалима ваздушном линијом, али тачан бунар не може се показати. Тачка на карти стоји на Тел Бер Шеви, хумци библијског града око 4 км источно од савременог града, где је испред градске капије пронађен дубок бунар; ископавачи су град датирали у гвоздено доба, далеко после патријараха, па се ниједан преживели бунар не може показати као Аврамов. У савременом граду стари бунар уз корито потока близу Старог града, који је Едвард Робинсон описао 1838, показује се као Аврамов бунар, само по предању."
    - "Постање казује о свађи око воде са Авимелехом, краљем Герара, око 27 км северозападно: „Аврам прекори Авимелеха за студенац, који узеше на силу слуге Авимелехове.“ Аврам му је дао седам јагањаца као сведочанство „да сам ја ископао овај студенац“, и „Отуда се прозва оно место Вирсавеја, јер се онде заклеше обојица.“ Затим „Аврам посади луг на Вирсавеји, и онде призва име Господа Бога Вечног.“ Хебрејско име допушта оба читања, „бунар седам“ и „бунар заклетве“, а прича се игра обема."
    - "Нараштај касније Филистеји су зачепили Аврамове бунаре, а Исак их је поново ископао. У дан када је склопио свој завет са Авимелехом, дошле су његове слуге и рекле: „Нађосмо воду“, и „назва га Савеја; отуда се зове град онај Вирсавеја до данашњег дана.“ Јевсевије је у четвртом веку знао Вирсавеју као велико село са римском посадом и напоменуо да се у крају Герара још показују многи бунари патријараха."
  hu:
    - "Beérsebában, az északi Negevben, Jeruzsálemtől légvonalban mintegy 70 km-re délnyugatra, de a pontos kutat nem lehet megmutatni. A térkép pontja a Tel Beer Sheván áll, a bibliai város halmán a mai várostól mintegy 4 km-re keletre, ahol a városkapun kívül mély kutat találtak; az ásatók a várost a vaskorra keltezték, jóval a pátriárkák után, így egyetlen fennmaradt kútról sem mutatható ki, hogy Ábrahámé volt. A mai városban az Óváros közelében a patakmeder mellett lévő régi kutat, amelyet Edward Robinson 1838-ban leírt, Ábrahám kútjaként mutatják, csupán hagyomány alapján."
    - "A Mózes első könyve vízvita történetét mondja el Abimélekkel, Gerár királyával, mintegy 27 km-re északnyugatra: „Megdorgálá pedig Ábrahám Abiméleket a kútért, melyet erővel elvettek vala az Abimélek szolgái.” Ábrahám hét nőstény bárányt adott neki tanúságul, „hogy én ástam ezt a kútat”, és „Azért nevezék azt a helyet Beérsebának, mivelhogy ott esküdtek vala meg mind a ketten.” Azután „Ábrahám pedig tamariskusfákat ültete Beérsebában, és segítségűl hívá ott az örökkévaló Úr Istennek nevét.” A héber név mindkét olvasatot megengedi, a „hét kútja” és az „eskü kútja”, és a történet mindkettővel játszik."
    - "Egy nemzedékkel később a filiszteusok betömték Ábrahám kútjait, Izsák pedig újra kiásta őket. Azon a napon, amikor ő maga is esküt tett Abiméleknek, szolgái odajöttek, és ezt mondták: „Találtunk vizet”, és „S elnevezé azt Sibáhnak: Azokáért annak a városnak neve Beérseba mind e mai napig.” A Kr. u. 4. században Eusebius nagy falunak ismerte Beérsebát római helyőrséggel, és megjegyezte, hogy a pátriárkák kútjai közül sokat még mutattak Gerár vidékén."
  fi:
    - "Beersebassa Pohjois-Negevissä, linnuntietä noin 70 km Jerusalemista lounaaseen, mutta tarkkaa kaivoa ei voi osoittaa. Kartan piste on Tel Beer Sevalla, Raamatun kaupungin kummulla noin 4 km nykyisestä kaupungista itään, jossa kaupungin portin ulkopuolelta löytyi syvä kaivo; kaivaajat ajoittivat kaupungin rautakaudelle, kauan patriarkkojen jälkeen, joten mitään säilynyttä kaivoa ei voi osoittaa Abrahamin kaivoksi. Nykyisessä kaupungissa vanha kaivo purouoman varrella vanhankaupungin lähellä, jonka Edward Robinson kuvasi vuonna 1838, esitetään Abrahamin kaivona, vain perimätiedon nojalla."
    - "Genesis kertoo riidasta vedestä Gerarin kuninkaan Abimelekin kanssa, noin 27 km luoteeseen: ”Aabraham nuhteli kuitenkin Abimelekia vesikaivon tähden, jonka Abimelekin palvelijat olivat vallanneet.” Abraham antoi hänelle seitsemän uuhikaritsaa todistukseksi, ”että tämä kaivo on minun kaivamani”, ja ”Siitä kutsuttiin paikkaa Beersebaksi, koska he molemmat vannoivat siinä toisilleen valan.” Sitten ”Aabraham istutti tamariskipuun Beersebaan ja huusi siinä avuksi Herran, iankaikkisen Jumalan, nimeä.” Heprealainen nimi sallii molemmat luennat, ”seitsemän kaivo” ja ”valan kaivo”, ja kertomus leikkii kummallakin."
    - "Sukupolvea myöhemmin filistealaiset olivat tukkineet Abrahamin kaivot, ja Iisak kaivatti ne uudelleen auki. Sinä päivänä, jona hän teki oman valansa Abimelekin kanssa, hänen palvelijansa tulivat ja sanoivat: ”Me löysimme vettä”, ja ”Hän antoi sille nimen Siba. Sentähden on kaupungin nimi vielä tänäkin päivänä Beerseba.” Eusebios tunsi 300-luvulla Beersaban suurena kylänä, jossa oli roomalainen varuskunta, ja totesi, että monia patriarkkojen kaivoja näytettiin yhä Gerarin seudulla."
  vi:
    - "Tại Bê-e-Sê-ba ở bắc Negev, cách Giê-ru-sa-lem khoảng 70 km về phía tây nam theo đường thẳng, nhưng không thể chỉ ra chính xác cái giếng. Điểm trên bản đồ nằm trên Tel Beer Sheva, gò của thị trấn trong Kinh Thánh cách thành phố hiện đại khoảng 4 km về phía đông, nơi một cái giếng sâu được tìm thấy ngoài cổng thành; các nhà khai quật xác định niên đại thị trấn vào thời Đồ Sắt, rất lâu sau các tổ phụ, nên không giếng nào còn lại có thể được chỉ là của Áp-ra-ham. Trong thành phố hiện đại, một giếng cũ bên lòng suối gần Thành Cổ, được Edward Robinson mô tả năm 1838, được chỉ là Giếng Áp-ra-ham, chỉ theo truyền thống."
    - "Sách Sáng thế kể một cuộc tranh chấp về nước với A-bi-mê-léc, vua Ghê-ra, cách khoảng 27 km về phía tây bắc: “Áp-ra-ham phàn nàn cùng vua A-bi-mê-léc về vụ một giếng kia bị đầy tớ người chiếm đoạt.” Áp-ra-ham đưa bảy con chiên tơ “đặng làm chứng rằng tôi đã đào cái giếng nầy”, và “họ đặt tên chỗ nầy là Bê-e-Sê-ba; vì tại đó hai người đều đã thề nguyện cùng nhau.” Rồi ông “trồng một cây me tại Bê-e-Sê-ba, và ở đó người cầu khẩn danh Đức Giê-hô-va, là Đức Chúa Trời hằng-hữu.” Tên Hê-bơ-rơ cho phép cả hai cách đọc, “giếng bảy” và “giếng của lời thề”, và câu chuyện chơi chữ với cả hai."
    - "Một thế hệ sau, người Phi-li-tin đã lấp các giếng của Áp-ra-ham, và Y-sác đào lại. Trong ngày ông lập lời thề riêng với A-bi-mê-léc, các đầy tớ ông đến nói: “Chúng tôi đã thấy có nước”, và “Người bèn đặt tên cái giếng đó là Si-ba. Vì cớ đó nên tên thành ấy là Bê-e-Sê-ba cho đến ngày nay.” Vào thế kỷ 4, Eusebius biết Bê-e-Sê-ba là một làng lớn có đồn trú La Mã và ghi chú rằng nhiều giếng của các tổ phụ vẫn còn được chỉ trong vùng Ghê-ra."
  ro:
    - "La Beer-Șeba, în nordul Neghevului, la circa 70 km sud-vest de Ierusalim în linie dreaptă, dar fântâna exactă nu poate fi arătată. Punctul de pe hartă se află pe Tel Beer Sheva, movila orașului biblic, la circa 4 km est de orașul modern, unde a fost găsită o fântână adâncă în afara porții cetății; cei care au săpat au datat orașul în epoca fierului, mult după patriarhi, așa că nicio fântână păstrată nu poate fi arătată ca fiind a lui Avraam. În orașul modern, o fântână veche de lângă albia râului, aproape de Orașul Vechi, descrisă de Edward Robinson în 1838, este arătată drept Fântâna lui Avraam, doar prin tradiție."
    - "Geneza povestește o ceartă pentru apă cu Abimelec, regele Gherarului, aflat la circa 27 km spre nord-vest: „a mustrat Avraam pre Avimeleh pentru fântânile apei, care le-au luat slugile lui Avimeleh.” Avraam i-a dat șapte mielușele drept mărturie „cum că eu am săpat această fântână”, și „a chemat numele locului aceluia, fântâna jurământului, că acolo au jurat amândoi.” Apoi „a sădit Avraam țarină la fântâna jurământului, și a chemat acolo numele Domnului, Dumnezeu veșnic.” Numele ebraic îngăduie ambele citiri, „fântâna celor șapte” și „fântâna jurământului”, iar povestea se joacă cu amândouă."
    - "O generație mai târziu, filistenii astupaseră fântânile lui Avraam, iar Isaac le-a săpat din nou. În ziua în care a făcut propriul jurământ cu Abimelec, slugile lui au venit și i-au spus că au găsit apă, și „o au numit jurământ, pentru aceea au chemat numele cetății aceleia fântâna jurământului, până în ziua de astăzi.” Eusebiu, în secolul al IV-lea, cunoștea Beer-Șeba ca pe un sat mare cu o garnizoană romană și nota că multe fântâni ale patriarhilor se arătau încă în ținutul Gherarului."
  bg:
    - "Във Вирсавия в Северен Негев, на около 70 км югозападно от Йерусалим по права линия, но точният кладенец не може да бъде посочен. Точката на картата стои на Тел Беер Шева — хълма на библейския град на около 4 км източно от съвременния град, където извън градската порта е намерен дълбок кладенец; археолозите датират града в желязната епоха, дълго след патриарсите, така че за нито един запазен кладенец не може да се докаже, че е Авраамовият. В съвременния град един стар кладенец до речното корито близо до Стария град, описан от Едуард Робинсън през 1838 г., се показва като Авраамовия кладенец, само по предание."
    - "Битие разказва за спор за вода с Авимелех, царя на Герар, на около 27 км на северозапад: „обличи Авраам Авимелеха за водния кладенец който бяха отнели Авимелеховите раби“. Авраам му даде седем женски агнета като свидетелство, „че аз съм изкопал този кладенец“, и „наименува онова място Вирсавее (кладенец клетвен); защото там се заклеха двамата“. После „насади Авраам дъбрава във Вирсавее; и призва там името на Йеова Бога Вечнаго“. Еврейското име допуска и двете четения — „кладенец на седемте“ и „кладенец на клетвата“, и разказът играе и с двете."
    - "Едно поколение по-късно филистимците бяха засипали кладенците на Авраам и Исаак ги изкопа отново. В деня, когато сключи собствената си клетва с Авимелех, слугите му дойдоха и казаха: „Намерихме вода“, и той „нарече го Савее; затова е името на града Вирсавее до днес“. Евсевий през IV в. познава Вирсавия като голямо село с римски гарнизон и отбелязва, че в областта на Герар все още се показват много кладенци на патриарсите."
