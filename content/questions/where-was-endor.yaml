id: where-was-endor
question:
  en: "Where was Endor, the home of the witch of Endor?"
  ru: "Где находился Ен-Дор, где жила аэндорская волшебница?"
  uk: "Де був Ендор, батьківщина ендорської чарівниці?"
  es: "¿Dónde estaba Endor, la patria de la adivina de Endor?"
  pt: "Onde ficava En-Dor, a terra da médium de En-Dor?"
  de: "Wo lag Endor, die Heimat der Hexe von Endor?"
  fr: "Où se trouvait En-Dor, patrie de la nécromancienne d’En-Dor ?"
  pl: "Gdzie leżał Endor, dom wiedźmy z Endor?"
  it: "Dov’era Endor, patria della negromante di Endor?"
  cs: "Kde ležel Én-dór, domov věštkyně z Én-dóru?"
  nl: "Waar lag En-Dor, de woonplaats van de waarzegster van En-Dor?"
  sv: "Var låg En-Dor, hemorten för andebesvärjerskan i En-Dor?"
  nb: "Hvor lå En-Dor, hjemstedet til heksen i En-Dor?"
  tl: "Nasaan ang Endor, ang tahanan ng bruha ng Endor?"
  da: "Hvor lå En-Dor, hjemstedet for spåkvinden i En-Dor?"
  sr: "Где је био Ендор, дом ендорске врачаре?"
  hu: "Hol volt Endor, az endori boszorkány lakhelye?"
  fi: "Missä En-Dor, En-Dorin noitavaimon kotipaikka, sijaitsi?"
  vi: "Ên-Đô-rơ, quê của bà đồng ở Ên-Đô-rơ, ở đâu?"
  ro: "Unde se afla Endor, locuința vrăjitoarei din Endor?"
  bg: "Къде се е намирал Ен-Дор, домът на ендорската врачка?"
answer:
  en:
    - "Endor was a village at the eastern end of the valley of Jezreel, on the northern slope of the hill of Moreh, in Lower Galilee in today's Israel. It is most often placed at Khirbet es-Safsafa, near the old Arab village of Indur that kept the name; the map's point stands there, about 4.7 km south of Mount Tabor, 6.7 km north-east of Shunem and about 98 km north of Jerusalem in a straight line. Indur itself and Tell el-Ajjul are other candidates, and a few look to the western end of the valley near Taanach. History Globe has an article on En-dor; this answer keeps to where it was."
    - "Its place explains the story. Before the battle of Gilboa “the Philistines gathered themselves together, and came and pitched in Shunem: and Saul gathered all Israel together, and they pitched in Gilboa”, across the valley to the south. When the Lord did not answer him, Saul said, “Seek me a woman that hath a familiar spirit… And his servants said to him, Behold, there is a woman that hath a familiar spirit at Endor.” To reach her “Saul disguised himself, and put on other raiment, and he went, and two men with him, and they came to the woman by night”: from Israel's camp by the spring in Jezreel, about 11 km in a straight line, past the Philistine camp at Shunem and round the hill of Moreh, behind the enemy lines."
    - "Joshua lists Endor among the Canaanite towns that Manasseh held within Issachar and Asher, beside Beth-shean, Taanach and Megiddo, and Psalm 83 (82 in the Synodal numbering) recalls the enemies of Deborah's day “which perished at Endor”. The map dates Saul's night visit and his death on Gilboa the next day to about 1010 BC, a conventional point. Eusebius placed Endor four miles south of Tabor; Indur was abandoned in 1948, and the kibbutz Ein Dor nearby takes its name from the ancient town."
  ru:
    - "Ен-Дор — селение на восточном краю Изреельской долины, на северном склоне холма Море, в Нижней Галилее, на территории нынешнего Израиля. Чаще всего его помещают в Хирбет-эс-Сафсафе, рядом со старой арабской деревней Индур, сохранившей имя; там и стоит точка карты, примерно в 4,7 км к югу от горы Фавор, в 6,7 км к северо-востоку от Сонама и примерно в 98 км к северу от Иерусалима по прямой. Другие кандидаты — сам Индур и Телль-эль-Аджуль, а немногие ищут его на западном краю долины, у Фаанаха. В History Globe есть статья о Ен-Доре; здесь ответ о том, где он был."
    - "Место объясняет рассказ. Перед битвой на Гелвуе «собрались Филистимляне и пошли и стали станом в Сонаме; собрал и Саул весь народ Израильский, и стали станом на Гелвуе» — к югу, через долину. Когда Господь не ответил ему, Саул сказал: «сыщите мне женщину волшебницу… И отвечали ему слуги его: здесь в Аэндоре есть женщина волшебница». Чтобы дойти до неё, «снял с себя Саул одежды свои и надел другие, и пошел сам и два человека с ним, и пришли они к женщине ночью»: от стана Израиля у источника в Изрееле — около 11 км по прямой — мимо стана филистимлян в Сонаме и вокруг холма Море, в тыл врагу."
    - "Книга Иисуса Навина называет Ен-Дор среди хананейских городов, которыми Манассия владел в уделах Иссахара и Асира, рядом с Беф-Саном, Фаанахом и Мегиддоном, а Псалом 82 (83 в еврейской нумерации) вспоминает врагов времён Деворы, «которые истреблены в Аендоре». Карта относит ночной поход Саула и его гибель на Гелвуе на следующий день примерно к 1010 г. до н. э. — условная точка. Евсевий помещал Ен-Дор в четырёх милях к югу от Фавора; Индур опустел в 1948 году, а соседний кибуц Эйн-Дор назван по древнему городу."
  uk:
    - "Ендор був селом на східному краю Єзреельської долини, на північному схилі пагорба Море, у Нижній Галілеї, на території сучасного Ізраїлю. Його найчастіше розміщують у Хірбет-ес-Сафсафі, біля старого арабського села Індур, яке зберегло цю назву; саме там стоїть точка на мапі, приблизно за 4,7 км на південь від гори Фавор, за 6,7 км на північний схід від Сунема і за 98 км на північ від Єрусалима по прямій. Інші кандидати — сам Індур і Телль-ель-Аджуль, а дехто шукає його на західному краю долини, біля Таанаха. В «Історичному глобусі» є стаття про Ен-Дор; ця відповідь стосується лише того, де він лежав."
    - "Його розташування пояснює оповідь. Перед битвою на Гілбоа «зібрались Филистії до купи і пійшли та й отаборились в Сонамі. Скликав же і Саул усього Ізраїля та й став табором на Гелбуї», навпроти, на півдні, через долину. Коли Господь не відповів йому, Саул наказав: «Ізнайдїте менї жінку-чарівницю; пійду до неї та спитаю. І відказали йому прибічники його: В Аендорі є така женщина». Щоб дістатися до неї, Саул «здіймив ... одїж свою, і повдягав другу та й пійшов із двома провідниками в дорогу. Прийшли вони в ночі до жінки»: від табору Ізраїля біля джерела в Єзреелі, приблизно 11 км по прямій, повз філістимський табір у Сунемі й навколо пагорба Море, у тилу ворога."
    - "Книга Ісуса Навина зараховує Ендор до ханаанських міст, які Манасія тримав в Іссахарі та Асирі, поряд із Бет-Шеаном, Таанахом і Мегіддо, а Псалом 83 (82 за синодальною нумерацією) згадує ворогів днів Дебори, «знищені коло Ендора». Мапа датує нічну відвідину Саула та його смерть на Гілбоа наступного дня приблизно 1010 р. до н. е. — умовною точкою. Євсевій розміщував Ендор за чотири милі на південь від Фавору; Індур було покинуто 1948 року, а поблизу кібуц Ейн-Дор носить назву від стародавнього міста."
  es:
    - "Endor era una aldea en el extremo oriental del valle de Jezreel, en la ladera norte del collado de Moré, en la Baja Galilea, en el actual Israel. Se sitúa con mayor frecuencia en Khirbet es-Safsafa, cerca de la antigua aldea árabe de Indur, que conservó el nombre; el punto del mapa está allí, a unos 4,7 km al sur del monte Tabor, a 6,7 km al noreste de Sunem y a unos 98 km al norte de Jerusalén en línea recta. La propia Indur y Tell el-Ajjul son otros candidatos, y unos pocos miran al extremo occidental del valle, cerca de Taanac. History Globe tiene un artículo sobre En-dor; esta respuesta se ciñe a dónde estaba."
    - "Su situación explica el relato. Antes de la batalla de Gilboa «los Filisteos se juntaron, vinieron y asentaron campo en Sunam: y Saúl juntó á todo Israel, y asentaron campo en Gilboa», al otro lado del valle, hacia el sur. Cuando el Señor no le respondió, Saúl dijo: «Buscadme una mujer que tenga espíritu de pythón… Y sus criados le respondieron: He aquí hay una mujer en Endor que tiene espíritu de pythón». Para llegar hasta ella, «disfrazóse Saúl, y púsose otros vestidos, y fuése con dos hombres, y vinieron á aquella mujer de noche»: desde el campamento de Israel junto a la fuente de Jezreel, a unos 11 km en línea recta, pasando por el campamento filisteo de Sunem y rodeando el collado de Moré, por detrás de las líneas enemigas."
    - "Josué enumera Endor entre las ciudades cananeas que Manasés poseía dentro de Isacar y Aser, junto a Bet-seán, Taanac y Meguido, y el Salmo 83 (82 en la numeración sinodal) recuerda a los enemigos de los días de Débora que «perecieron en Endor». El mapa fecha la visita nocturna de Saúl y su muerte en Gilboa al día siguiente hacia el 1010 a. C., un punto convencional. Eusebio situó Endor a cuatro millas al sur del Tabor; Indur fue abandonada en 1948, y el kibutz Ein Dor, cercano, toma su nombre de la antigua ciudad."
  pt:
    - "En-Dor era uma aldeia na extremidade oriental do vale de Jezreel, na encosta norte do monte Moré, na Baixa Galileia, no atual Israel. É mais frequentemente situada em Khirbet es-Safsafa, perto da antiga aldeia árabe de Indur, que conservou o nome; o ponto do mapa fica ali, a cerca de 4,7 km ao sul do monte Tabor, 6,7 km a nordeste de Suném e cerca de 98 km ao norte de Jerusalém em linha reta. A própria Indur e Tell el-Ajjul são outros candidatos, e alguns olham para a extremidade ocidental do vale, perto de Taanaque. O History Globe tem um artigo sobre En-Dor; esta resposta trata apenas de onde ficava."
    - "Sua posição explica a narrativa. Antes da batalha de Gilboa, “os filisteus se reuniram, vieram e acamparam em Suném. Saul reuniu todo o Israel, e eles acamparam em Gilboa”, do outro lado do vale, ao sul. Quando o Senhor não lhe respondeu, Saul disse: “Procurem para mim uma mulher que consulte espíritos… Seus servos responderam: Há uma mulher que consulta espíritos em En-Dor.” Para chegar a ela, “Saul se disfarçou, vestiu outras roupas e saiu acompanhado de dois homens. Chegaram à mulher durante a noite”: do acampamento de Israel junto à fonte em Jezreel, cerca de 11 km em linha reta, passando pelo acampamento filisteu em Suném e contornando o monte Moré, por trás das linhas inimigas."
    - "Josué enumera En-Dor entre as cidades cananeias que Manassés possuía dentro de Issacar e Aser, ao lado de Bete-Seã, Taanaque e Megido, e o Salmo 83 (82 na numeração sinodal) recorda os inimigos dos dias de Débora, “que pereceram em Endor”. O mapa data a visita noturna de Saul e a sua morte em Gilboa no dia seguinte por volta de 1010 a.C., um ponto convencional. Eusébio situou En-Dor a quatro milhas ao sul do Tabor; Indur foi abandonada em 1948, e o quibutz Ein Dor, nas proximidades, toma o nome da antiga cidade."
  de:
    - "Endor war ein Dorf am Ostende der Jesreel-Ebene, am Nordhang des Hügels More, in Untergaliläa im heutigen Israel. Meist wird es bei Khirbet es-Safsafa angesetzt, nahe dem alten arabischen Dorf Indur, das den Namen bewahrte; dort steht der Kartenpunkt, in der Luftlinie rund 4,7 km südlich des Tabor, 6,7 km nordöstlich von Schunem und etwa 98 km nördlich von Jerusalem. Indur selbst und Tell el-Adschul sind weitere Kandidaten, und einige denken an das Westende der Ebene bei Taanach. History Globe hat einen Artikel über En-Dor; diese Antwort beschränkt sich auf die Lage."
    - "Seine Lage erklärt die Geschichte. Vor der Schlacht am Gilboa heißt es: „Da nun die Philister sich versammelten und kamen und lagerten sich zu Sunem, versammelte Saul auch das ganze Israel, und sie lagerten sich zu Gilboa“, jenseits der Ebene im Süden. Als der HERR ihm nicht antwortete, sprach Saul: „Sucht mir ein Weib, die einen Wahrsagergeist hat, daß ich zu ihr gehe und sie Frage … Siehe, zu Endor ist ein Weib, die hat einen Wahrsagergeist.“ Um zu ihr zu gelangen, heißt es: „Und Saul wechselte seine Kleider und zog andere an und ging hin und zwei Männer mit ihm, und sie kamen bei der Nacht zu dem Weibe“: vom Lager Israels bei der Quelle in Jesreel, in der Luftlinie etwa 11 km, am philistäischen Lager bei Schunem vorbei und um den Hügel More herum, hinter die feindlichen Linien."
    - "Josua führt Endor unter den kanaanäischen Städten auf, die Manasse innerhalb von Issachar und Asser besaß, neben Beth-Schean, Taanach und Megiddo, und Psalm 83 (82 in der synodalen Zählung) erinnert an die Feinde aus Deboras Tagen, „die vertilgt wurden bei Endor“. Die Karte datiert Sauls nächtlichen Besuch und seinen Tod am Gilboa am folgenden Tag auf etwa 1010 v. Chr., ein konventioneller Ansatz. Eusebius verlegte Endor vier Meilen südlich des Tabor; Indur wurde 1948 aufgegeben, und der nahe Kibbuz Ein Dor trägt den Namen der antiken Stadt."
  fr:
    - "En-Dor était un village à l’extrémité orientale de la vallée de Jizreel, sur le versant nord de la colline de Moré, en Basse Galilée, dans l’Israël actuel. On la place le plus souvent à Khirbet es-Safsafa, près de l’ancien village arabe d’Indur, qui en a gardé le nom ; le point de la carte s’y trouve, à environ 4,7 km au sud du mont Thabor, à 6,7 km au nord-est de Sunem et à environ 98 km au nord de Jérusalem à vol d’oiseau. Indur même et Tell el-Ajjul sont d’autres candidats, et quelques-uns regardent vers l’extrémité occidentale de la vallée, près de Thaanac. History Globe consacre un article à En-Dor ; cette réponse se limite à son emplacement."
    - "Sa situation explique le récit. Avant la bataille de Guilboa, « les Philistins se rassemblèrent, et vinrent camper à Sunem ; Saül rassembla tout Israël, et ils campèrent à Guilboa », de l’autre côté de la vallée, au sud. Quand le Seigneur ne lui répondit pas, Saül dit : « Cherchez-moi une femme qui évoque les morts, et j’irai la consulter. Ses serviteurs lui dirent : Voici, à En-Dor il y a une femme qui évoque les morts. » Pour la rejoindre, « Saül se déguisa et prit d’autres vêtements, et il partit avec deux hommes. Ils arrivèrent de nuit chez la femme » : du camp d’Israël près de la source de Jizreel, à environ 11 km à vol d’oiseau, en passant devant le camp philistin de Sunem et en contournant la colline de Moré, derrière les lignes ennemies."
    - "Josué range En-Dor parmi les villes cananéennes que Manassé possédait dans Issacar et dans Aser, à côté de Beth-Schean, de Thaanac et de Meguiddo, et le Psaume 83 (82 dans la numérotation synodale) rappelle les ennemis du temps de Débora, qui « ont été détruits à En-Dor ». La carte date la visite nocturne de Saül et sa mort à Guilboa le lendemain d’environ 1010 av. J.-C., point conventionnel. Eusèbe plaçait En-Dor à quatre milles au sud du Thabor ; Indur fut abandonné en 1948, et le kibboutz voisin d’Ein Dor tire son nom de l’ancienne ville."
  pl:
    - "Endor było wsią na wschodnim krańcu doliny Jizreel, na północnym stoku wzgórza More, w Dolnej Galilei, na terenie dzisiejszego Izraela. Najczęściej umieszcza się je w Khirbet es-Safsafa, koło dawnej arabskiej wsi Indur, która zachowała nazwę; tam stoi punkt na mapie, około 4,7 km na południe od góry Tabor, 6,7 km na północny wschód od Szunem i około 98 km na północ od Jerozolimy w linii prostej. Kandydatami są też sam Indur i Tell el-Ajjul, a nieliczni szukają go na zachodnim krańcu doliny koło Taanak. History Globe ma artykuł o En-Dor; ta odpowiedź ogranicza się do jego położenia."
    - "Jego położenie wyjaśnia opowieść. Przed bitwą pod Gilboa „zebrawszy się tedy Filistynowie, przyciągnęli, a położyli się obozem u Sunam; zebrał też Saul wszystkiego Izraela, a położył się obozem w Gielboe”, po drugiej stronie doliny na południu. Gdy Pan mu nie odpowiadał, Saul rzekł: „Szukajcie mi niewiasty, któraby miała ducha wieszczego… I rzekli słudzy jego do niego: Oto, niewiasta w Endor, mająca ducha wieszczego”. Aby do niej dotrzeć, „odmienił odzienie swoje Saul, a oblókłszy się w insze szaty, szedł sam i dwaj mężowie z nim, a przyszli do niewiasty w nocy”: z obozu Izraela przy źródle w Jizreel, około 11 km w linii prostej, obok filistyńskiego obozu w Szunem i wokół wzgórza More, na tyłach wroga."
    - "Jozue wymienia Endor wśród kananejskich miast, które Manasses posiadał w obrębie Issachara i Aszera, obok Bet-Szean, Taanak i Megiddo, a Psalm 83 (82 w numeracji Biblii synodalnej) wspomina wrogów z czasów Debory, „którzy są wygładzeni w Endor”. Mapa datuje nocną wizytę Saula i jego śmierć na Gilboa następnego dnia na około 1010 p.n.e., co jest punktem umownym. Euzebiusz umieszczał Endor cztery mile na południe od Taboru; Indur opuszczono w 1948 roku, a pobliski kibuc Ein Dor wziął nazwę od starożytnego miasta."
  it:
    - "Endor era un villaggio all’estremità orientale della valle di Izreel, sul versante settentrionale del colle di Morè, nella Bassa Galilea, nell’odierno Israele. Si colloca per lo più a Khirbet es-Safsafa, presso l’antico villaggio arabo di Indur che ne conservò il nome; il punto della mappa si trova lì, a circa 4,7 km a sud del Monte Tabor, a 6,7 km a nord-est di Sunem e a circa 98 km a nord di Gerusalemme in linea d’aria. Lo stesso Indur e Tell el-Ajjul sono altri candidati, e alcuni guardano all’estremità occidentale della valle, presso Taanach. History Globe ha un articolo su En-dor; questa risposta si limita a dove si trovava."
    - "La sua posizione spiega il racconto. Prima della battaglia del Gelboe «i Filistei si radunarono e vennero ad accamparsi a Sunem. Saul parimente radunò tutto Israele, e si accamparono a Ghilboa», al di là della valle, a sud. Quando il Signore non gli rispose, Saul disse: «Cercatemi una donna che sappia evocar gli spiriti… I servi gli dissero: Ecco, a En-Dor v’è una donna che evoca gli spiriti». Per raggiungerla «Saul si contraffece, si mise altri abiti, e partì accompagnato da due uomini. Giunsero di notte presso la donna»: dall’accampamento d’Israele presso la sorgente di Izreel, circa 11 km in linea d’aria, oltre il campo filisteo a Sunem e attorno al colle di Morè, dietro le linee nemiche."
    - "Giosuè elenca Endor tra le città cananee che Manasse teneva entro Issacar e Aser, accanto a Beth-Shean, Taanach e Meghiddo, e il Salmo 83 (82 nella numerazione sinodale) ricorda i nemici dei giorni di Debora, «i quali furon distrutti a Endor». La mappa data la visita notturna di Saul e la sua morte sul Gelboe il giorno seguente al 1010 a.C. circa, un punto convenzionale. Eusebio collocava Endor a quattro miglia a sud del Tabor; Indur fu abbandonata nel 1948, e il vicino kibbutz Ein Dor prende il nome dall’antica città."
  cs:
    - "Én-dór byl vesnicí na východním konci Jizreelského údolí, na severním svahu pahorku Móre, v Dolní Galileji v dnešním Izraeli. Nejčastěji se klade do Chirbet es-Safsafy poblíž staré arabské vsi Indúr, která si jméno zachovala; bod na mapě stojí tam, asi 4,7 km jižně od hory Tábor, 6,7 km severovýchodně od Šúnemu a vzdušnou čarou asi 98 km severně od Jeruzaléma. Další kandidáti jsou samotný Indúr a Tell el-Adžul a někteří hledají místo na západním konci údolí poblíž Taanachu. History Globe má o Én-dóru samostatný článek; tato odpověď se drží jen jeho polohy."
    - "Poloha vysvětluje příběh. Před bitvou u Gilboa „shromáždivše se Filistinští, přitáhli a položili se u Sunem. Shromáždil i Saul všeho Izraele, a položili se v Gelboe“, přes údolí na jihu. Když mu Hospodin neodpovídal, řekl Saul: „Pohledejte mi ženy mající ducha věštího… Jemuž odpověděli služebníci jeho: Aj, žena mající ducha věštího v Endor.“ Aby se k ní dostal, „změniv Saul oděv, oblékl se v roucho jiné, a šel sám a dva muži s ním, a přišli k ženě té v noci“: z izraelského tábora u pramene v Jizreelu, vzdušnou čarou asi 11 km, kolem pelištejského tábora v Šúnemu a okolo pahorku Móre, v týlu nepřítele."
    - "Jozue řadí Én-dór mezi kananejská města, která Manases držel v Isacharu a Ašeru, vedle Bét-šeanu, Taanachu a Megida, a Žalm 83 (82 podle synodálního číslování) připomíná nepřátele z dnů Debořiných, „kteříž jsou do konce vyhlazeni v Endor“. Mapa klade Saulovu noční návštěvu a jeho smrt na Gilboa následujícího dne zhruba do roku 1010 př. n. l., což je smluvní bod. Eusebios umístil Én-dór čtyři míle jižně od Tábora; Indúr byl opuštěn roku 1948 a nedaleký kibuc Ejn Dor má jméno podle starověkého města."
  nl:
    - "En-Dor was een dorp aan het oostelijke einde van de vallei van Jizreël, op de noordhelling van de heuvel More, in Neder-Galilea in het huidige Israël. Het wordt meestal gesitueerd bij Khirbet es-Safsafa, nabij het oude Arabische dorp Indur dat de naam bewaarde; daar staat het punt op de kaart, ongeveer 4,7 km ten zuiden van de berg Tabor, 6,7 km ten noordoosten van Sunem en hemelsbreed ongeveer 98 km ten noorden van Jeruzalem. Indur zelf en Tell el-Ajjul zijn andere kandidaten, en enkelen zoeken het aan het westelijke einde van de vallei bij Taänach. History Globe heeft een artikel over En-Dor; dit antwoord beperkt zich tot de ligging."
    - "Zijn ligging verklaart het verhaal. Voor de slag bij Gilboa lezen we dat “de Filistijnen kwamen en vergaderden zich, en zij legerden zich te Sunem; en Saul vergaderde gans Israël, en zij legerden zich op Gilboa”, aan de overkant van de vallei in het zuiden. Toen de HEER hem niet antwoordde, zei Saul: “Zoekt mij een vrouw, die een waarzeggenden geest heeft… Zijn knechten nu zeiden tot hem: Zie, te Endor is een vrouw, die een waarzeggenden geest heeft.” Om bij haar te komen “Saul verstelde zich, en trok andere klederen aan, en ging heen, en twee mannen met hem, en zij kwamen des nachts tot de vrouw”: van het kamp van Israël bij de bron in Jizreël, hemelsbreed ongeveer 11 km, langs het Filistijnse kamp bij Sunem en om de heuvel More heen, achter de vijandelijke linies."
    - "Jozua noemt En-Dor onder de Kanaänitische steden die Manasse binnen Issachar en Aser bezat, naast Beth-Sean, Taänach en Megiddo, en Psalm 83 (82 in de synodale nummering) herinnert aan de vijanden uit de dagen van Debora, “die verdelgd zijn te Endor”. De kaart dateert Sauls nachtelijke bezoek en zijn dood op de Gilboa de volgende dag op ongeveer 1010 v.Chr., een conventioneel punt. Eusebius plaatste En-Dor vier mijl ten zuiden van de Tabor; Indur werd in 1948 verlaten, en de nabijgelegen kibboets Ein Dor ontleent zijn naam aan de oude stad."
  sv:
    - "En-Dor var en by i östra änden av Jisreeldalen, på norra sluttningen av höjden More, i Nedre Galileen i dagens Israel. Den placeras oftast vid Khirbet es-Safsafa, nära den gamla arabiska byn Indur som bevarade namnet; kartans punkt står där, omkring 4,7 km söder om berget Tabor, 6,7 km nordost om Shunem och omkring 98 km norr om Jerusalem i fågelvägen. Indur själv och Tell el-Ajjul är andra kandidater, och några söker platsen i dalens västra ände nära Taanak. History Globe har en artikel om En-Dor; det här svaret håller sig till var den låg."
    - "Läget förklarar berättelsen. Före slaget vid Gilboa församlade sig ”filistéerna och kommo och lägrade sig vid Sunem. Då församlade ock Saul hela Israel, och de lägrade sig vid Gilboa”, tvärs över dalen åt söder. När Herren inte svarade honom sade Saul: ”Söken upp åt mig någon andebesvärjerska … Hans tjänare svarade honom: ’I En-Dor finnes en andebesvärjerska.’” För att nå henne ”gjorde Saul sig oigenkännlig och tog på sig andra kläder och gick åstad med två män; och de kommo till kvinnan om natten”: från Israels läger vid källan i Jisreel, omkring 11 km i fågelvägen, förbi det filisteiska lägret vid Shunem och runt höjden More, bakom fiendens linjer."
    - "Josua räknar upp En-Dor bland de kanaaneiska städer som Manasse hade inom Isaskar och Asher, vid sidan av Bet-Shean, Taanak och Megiddo, och Psaltaren 83 (82 i den synodala numreringen) påminner om Deboras tids fiender, ”dem som förgjordes vid En-Dor”. Kartan daterar Sauls nattliga besök och hans död på Gilboa följande dag till omkring 1010 f.Kr., en konventionell tidpunkt. Eusebios placerade En-Dor fyra romerska mil söder om Tabor; Indur övergavs 1948, och kibbutzen Ein Dor i närheten har fått sitt namn efter den antika staden."
  nb:
    - "En-Dor var en landsby i den østre enden av Jisreel-dalen, på nordskråningen av høyden More, i Nedre Galilea i dagens Israel. Den plasseres oftest ved Khirbet es-Safsafa, nær den gamle arabiske landsbyen Indur, som beholdt navnet; kartets punkt står der, omtrent 4,7 km sør for Tabor, 6,7 km nordøst for Sjunem og omtrent 98 km nord for Jerusalem i luftlinje. Indur selv og Tell el-Ajjul er andre kandidater, og noen ser mot dalens vestre ende nær Taanak. History Globe har en artikkel om En-Dor; dette svaret holder seg til hvor stedet lå."
    - "Stedets beliggenhet forklarer fortellingen. Før slaget ved Gilboa «trengte de frem til Sunem og leiret sig der. Da samlet Saul hele Israel, og de leiret sig på Gilboa», på den andre siden av dalen mot sør. Da Herren ikke svarte ham, sa Saul: «Finn mig en kvinne som kan mane frem døde, … Hans tjenere svarte: I En-Dor er det en kvinne som kan mane.» For å komme til henne «gjorde Saul sig ukjennelig og tok andre klær på og gikk så avsted i følge med to menn. De kom til kvinnen om natten»: fra Israels leir ved kilden i Jisreel, omtrent 11 km i luftlinje, forbi filistrenes leir ved Sjunem og rundt høyden More, bak fiendens linjer."
    - "Josva nevner En-Dor blant de kanaaneiske byene som Manasse hadde innenfor Issakar og Asjer, ved siden av Bet-Sean, Taanak og Megiddo, og Salme 83 (82 i den synodale nummereringen) minner om fiendene fra Deboras dager: «De blev ødelagt ved En-Dor». Kartet daterer Sauls nattlige besøk og hans død på Gilboa dagen etter til omkring 1010 f.Kr., et konvensjonelt punkt. Eusebius plasserte En-Dor fire romerske mil sør for Tabor; Indur ble forlatt i 1948, og kibbutzen Ein Dor i nærheten har navn etter den gamle byen."
  tl:
    - "Ang Endor ay isang nayon sa silangang dulo ng lambak ng Jezreel, sa hilagang libis ng burol ng Moreh, sa Mababang Galilea sa kasalukuyang Israel. Pinakamadalas itong ilagay sa Khirbet es-Safsafa, malapit sa lumang nayong Arabe ng Indur na nagpanatili ng pangalan; naroon ang punto ng mapa, mga 4.7 km sa timog ng Bundok Tabor, 6.7 km sa hilagang-silangan ng Sunem at mga 98 km sa hilaga ng Jerusalem sa tuwid na guhit. Ang Indur mismo at ang Tell el-Ajjul ay iba pang kandidato, at may ilang tumitingin sa kanlurang dulo ng lambak malapit sa Taanach. May artikulo ang History Globe tungkol sa En-dor; ang sagot na ito ay nakatuon lamang sa kung nasaan ito."
    - "Ipinaliliwanag ng lokasyon nito ang salaysay. Bago ang labanan sa Gilboa, “nagpipisan ang mga Filisteo, at naparoon at humantong sa Sunam: at pinisan ni Saul ang buong Israel, at sila'y humantong sa Gilboa”, sa kabila ng lambak sa timog. Nang hindi sumagot sa kaniya ang Panginoon, sinabi ni Saul: “Ihanap ninyo ako ng isang babae na nakikipagsanggunian sa masamang espiritu… At sinabi ng kaniyang mga lingkod sa kaniya. Narito, may isang babae na nakikipagsanggunian sa masamang espiritu sa Endor.” Upang marating siya, “hindi napakilala si Saul, at nagsuot ng ibang kasuutan, at naparoon siya at ang dalawang lalake na kasama niya, at sila'y dumating sa babae nang kinagabihan”: mula sa kampo ng Israel sa tabi ng bukal sa Jezreel, mga 11 km sa tuwid na guhit, lampas sa kampo ng mga Filisteo sa Sunem at paikot sa burol ng Moreh, sa likod ng mga hanay ng kaaway."
    - "Itinala ni Josue ang Endor sa mga bayang Cananeo na hawak ng Manases sa loob ng Issachar at Aser, kasama ng Beth-san, Taanach at Megiddo, at ginugunita ng Awit 83 (82 sa bilang ng Synodal) ang mga kaaway nang mga araw ni Debora, “na nangamatay sa Endor”. Itinatakda ng mapa ang pagdalaw ni Saul nang gabi at ang kaniyang kamatayan sa Gilboa kinabukasan sa mga 1010 BK, isang kumbensiyonal na punto. Inilagay ni Eusebio ang Endor apat na milya sa timog ng Thabor; iniwan ang Indur noong 1948, at ang kalapit na kibbutz na Ein Dor ay hinango ang pangalan sa sinaunang bayan."
  da:
    - "En-Dor var en landsby i den østlige ende af Jizre’el-dalen, på nordskråningen af More-højen, i Nedre Galilæa i nutidens Israel. Den placeres oftest ved Khirbet es-Safsafa nær den gamle arabiske landsby Indur, som bevarede navnet; kortets punkt står der, ca. 4,7 km syd for Tabor, 6,7 km nordøst for Sjunem og ca. 98 km nord for Jerusalem i fugleflugt. Indur selv og Tell el-Ajjul er andre kandidater, og nogle få søger mod dalens vestlige ende nær Ta’anak. History Globe har en artikel om En-Dor; dette svar holder sig til, hvor stedet lå."
    - "Stedets beliggenhed forklarer beretningen. Før slaget ved Gilboa, »der Filisterne samledes og kom og lejrede sig i Sunem, da samlede Saul al Israel, og de lejrede sig i Gilboa«, tværs over dalen mod syd. Da Herren ikke svarede ham, sagde Saul: »Opleder mig en Kvinde, som har en Spaadoms Aand … og hans Tjenere sagde til ham: Se, der er en Kvinde, som har Spaadoms Aand, i Endor.« For at nå hende gjorde Saul sig »ukendelig og førte sig i andre Klæder, og han gik hen og to Mænd med ham, og de kom til Kvinden om Natten«: fra Israels lejr ved kilden i Jizre’el, ca. 11 km i fugleflugt, forbi filisternes lejr ved Sjunem og rundt om More-højen, bag fjendens linjer."
    - "Josva opregner En-Dor blandt de kana’anæiske byer, som Manasse havde inden for Issakar og Aser, ved siden af Bet-Sjan, Ta’anak og Megiddo, og Salme 83 (82 i den synodale nummerering) minder om Deboras tids fjender, som »bleve ødelagte ved Endor«. Kortet dateres Sauls natlige besøg og hans død på Gilboa næste dag til ca. 1010 f.Kr., et konventionelt tidspunkt. Eusebios placerede En-Dor fire romerske mil syd for Tabor; Indur blev forladt i 1948, og kibbutzen Ein Dor i nærheden har sit navn efter den antikke by."
  sr:
    - "Ендор је било село на источном крају Језраелске долине, на северном обронку брда Море, у Доњој Галилеји, у данашњем Израелу. Најчешће се смешта у Хирбет ес-Сафсафу, близу старог арапског села Индур, које је сачувало име; ту стоји тачка на карти, око 4,7 км јужно од планине Тавор, 6,7 км североисточно од Сунама и око 98 км северно од Јерусалима ваздушном линијом. Други кандидати су сам Индур и Тел ел-Аџул, а неки гледају на западни крај долине, код Танаха. History Globe има чланак о Ендору; овај одговор говори само о томе где се налазио."
    - "Његов положај објашњава причу. Пред битку на Гелвуји „Филистеји скупивши се дођоше и стадоше у логор код Сунима; скупи и Саул све Израиљце, и стадоше у логор код Гелвује“, преко долине на југу. Кад му Господ није одговарао, Саул рече: „Тражите ми жену с духом врачарским… А слуге му рекоше: Ево у Ендору има жена у којој је дух врачарски.“ Да би дошао до ње, „Тада се Саул преруши обукав друге хаљине, и отиде са два човека, и дође к оној жени ноћу“: из израелског логора крај извора у Језраелу, око 11 км ваздушном линијом, мимо филистејског логора у Сунаму и око брда Море, иза непријатељских линија."
    - "Исус Навин набраја Ендор међу ханански градове које је Манасија држао унутар Исахарове и Асирове области, поред Вет-Сана, Танаха и Мегида, а Псалам 83 (82. по синодалној нумерацији) спомиње непријатеље из Деворина доба „који су истребљени у Аендору“. Карта датира Саулов ноћни одлазак и његову смрт на Гелвуји следећег дана у око 1010. п. н. е., по договорној тачки. Јевсевије је Ендор сместио четири миље јужно од Тавора; Индур је напуштен 1948, а оближњи кибуц Ајн Дор носи име по древном граду."
  hu:
    - "Endor falu volt a Jezréel-völgy keleti végén, a Móré-domb északi lejtőjén, Alsó-Galileában, a mai Izraelben. Leggyakrabban Khirbet es-Safsafára teszik, az Indur nevű régi arab falu közelébe, mely megőrizte a nevet; a térkép pontja ott áll, a Tábor-hegytől mintegy 4,7 km-re délre, Súnemtől 6,7 km-re északkeletre és Jeruzsálemtől légvonalban mintegy 98 km-re északra. Maga Indur és Tell el-Ajjul további jelöltek, néhányan pedig a völgy nyugati végén, Taanak közelében keresik. A History Globe cikket közöl Én-Dórról; ez a válasz arra szorítkozik, hol volt."
    - "Fekvése megmagyarázza a történetet. A gilboai csata előtt „a Filiszteusok egybegyűlvén, eljövének és tábort járának Sunemnél: egybegyűjté Saul is az egész Izráelt, és tábort járának Gilboánál”, a völgy túloldalán, délre. Mikor az Úr nem felelt neki, Saul ezt mondta: „Keressetek nékem egy halottidéző asszonyt… Szolgái pedig mondának néki: Ímé, Endorban van egy halottidéző asszony.” Hozzá menet „Másnak tetteté azért Saul magát, és más ruhákat vevén magára, elméne ő és vele két férfi; és elmenének éjjel az asszonyhoz”: Izráel jezréeli forrásnál álló táborából, légvonalban mintegy 11 km-re, a súnemi filiszteus tábor mellett elhaladva és a Móré-dombot megkerülve, az ellenséges vonalak mögé."
    - "Józsué Endort azok közé a kánaáni városok közé sorolja, melyeket Manassé Issakáron és Áseren belül bírt, Bét-Seán, Taanak és Megiddó mellett; a 83. zsoltár (a szinodális számozás szerint 82.) pedig Debóra napjainak ellenségeire emlékeztet, „akik elvesztek vala Endornál”. A térkép Saul éjjeli látogatását és másnapi gilboai halálát Kr. e. 1010 körülre teszi, hagyományos időpontra. Eusebius Endort négy mérföldre délre helyezte a Tábortól; Indurt 1948-ban elhagyták, és a közeli Ein Dor kibuc az ókori városról kapta a nevét."
  fi:
    - "En-Dor oli kylä Jisreelin laakson itäpäässä, Moren kukkulan pohjoisrinteellä Ala-Galileassa nykyisen Israelin alueella. Se sijoitetaan useimmiten Khirbet es-Safsafaan, lähelle vanhaa arabikylää Indur, joka säilytti nimen; kartan piste on siinä, linnuntietä noin 4,7 km Taborvuoresta etelään, 6,7 km Sunemista koilliseen ja noin 98 km Jerusalemista pohjoiseen. Muita ehdokkaita ovat itse Indur ja Tell el-Ajjul, ja jotkut etsivät sitä laakson länsipäästä Taanakin läheltä. History Globessa on artikkeli En-Dorista; tämä vastaus keskittyy sen sijaintiin."
    - "Sijainti selittää tarinan. Ennen Gilboan taistelua ”filistealaiset kokoontuivat, ja he tulivat ja leiriytyivät Suunemiin. Niin Saulkin kokosi koko Israelin, ja he leiriytyivät Gilboaan” laakson toiselle puolelle etelään. Kun Herra ei vastannut hänelle, Saul sanoi: ”Etsikää minulle joku vaimo, jolla on vallassaan vainajahenki… Hänen palvelijansa vastasivat hänelle: ’Katso, Een-Doorissa on vaimo, jolla on vallassaan vainajahenki’”. Tavatakseen hänet ”Saul teki itsensä tuntemattomaksi, pukeutui toisiin vaatteisiin ja lähti matkalle, mukanansa kaksi miestä. He tulivat yöllä vaimon luo”: Israelin leiristä Jisreelin lähteeltä, linnuntietä noin 11 km, filistealaisten Sunemin leirin ohi ja Moren kukkulan ympäri, vihollislinjojen taakse."
    - "Joosua luettelee En-Dorin niiden kanaanilaisten kaupunkien joukkoon, jotka Manasse sai Isaskarin ja Asserin alueelta, Beet-Sean, Taanakin ja Megiddon rinnalla, ja psalmi 83 (synodaalinumeroinnissa 82) muistuttaa Deboran ajan vihollisista, jotka ”tuhottiin Eendorissa”. Kartta ajoittaa Saulin yöllisen vierailun ja hänen kuolemansa Gilboalla seuraavana päivänä noin vuoteen 1010 eaa., mikä on sovinnainen ajankohta. Eusebios sijoitti En-Dorin neljän mailin päähän Taborista etelään; Indur hylättiin vuonna 1948, ja lähellä oleva Ein Dorin kibbutsi on saanut nimensä muinaisesta kaupungista."
  vi:
    - "Ên-Đô-rơ là một làng ở đầu phía đông của thung lũng Gít-rê-ên, trên sườn bắc của Gò Mô-rê, thuộc Hạ Ga-li-lê trong lãnh thổ Israel ngày nay. Nơi này thường được đặt tại Khirbet es-Safsafa, gần ngôi làng Ả Rập cổ Indur còn giữ tên ấy; điểm của bản đồ nằm ở đó, cách Núi Tha-bô khoảng 4,7 km về phía nam, cách Su-nem 6,7 km về phía đông bắc và cách Giê-ru-sa-lem khoảng 98 km về phía bắc theo đường thẳng. Bản thân Indur và Tell el-Ajjul là những ứng viên khác, và một số ít người tìm ở đầu phía tây của thung lũng, gần Tha-a-nác. History Globe có một bài về Ên-Đô-rơ; câu trả lời này chỉ bàn về vị trí của nơi ấy."
    - "Vị trí giải thích câu chuyện. Trước trận Ghinh-bô-a, “dân Phi-li-tin nhóm hiệp, đến đóng trại nơi Su-nem. Còn Sau-lơ cũng hiệp hết thảy Y-sơ-ra-ên, và chúng đóng trại tại Ghinh-bô-a”, bên kia thung lũng về phía nam. Khi Đức Giê-hô-va không đáp lời, Sau-lơ nói: “Hãy kiếm cho ta một người đàn bà biết cầu vong… Các tôi tớ thưa rằng: Tại Ên-đô-rơ có một người đàn bà cầu vong.” Để đến với bà, “Sau-lơ giả dạng mặc những áo khác, đi đem theo hai người, rồi đến nhà người đàn bà nầy lúc ban đêm”: từ trại của Y-sơ-ra-ên bên suối ở Gít-rê-ên, khoảng 11 km theo đường thẳng, đi qua trại Phi-li-tin ở Su-nem và vòng quanh Gò Mô-rê, vào phía sau chiến tuyến địch."
    - "Sách Giô-suê kể Ên-Đô-rơ trong số các thành của người Ca-na-an mà Ma-na-se nắm giữ trong đất của Y-sa-ca và A-se, bên cạnh Bết-Sê-an, Tha-a-nác và Mê-ghi-đô, còn Thi thiên 83 (82 theo cách đánh số Synodal) nhắc đến kẻ thù thời Đê-bô-ra, “kẻ bị hư nát tại Ên-Đô-rơ”. Bản đồ xác định chuyến đi đêm của Sau-lơ và cái chết của ông trên núi Ghinh-bô-a vào ngày hôm sau là khoảng năm 1010 TCN, một mốc quy ước. Eusebius đặt Ên-Đô-rơ cách Tha-bô bốn dặm về phía nam; Indur bị bỏ hoang năm 1948, và kibbutz Ein Dor gần đó lấy tên theo thành cổ."
  ro:
    - "Endor era un sat la capătul estic al văii Izreel, pe panta nordică a dealului Moreh, în Galileea de Jos, în Israelul de astăzi. Este plasat cel mai adesea la Khirbet es-Safsafa, lângă vechiul sat arab Indur, care i-a păstrat numele; punctul de pe hartă se află acolo, la circa 4,7 km sud de Muntele Tabor, la 6,7 km nord-est de Șunem și la circa 98 km nord de Ierusalim în linie dreaptă. Indur însuși și Tell el-Ajjul sunt alți candidați, iar unii privesc spre capătul vestic al văii, lângă Taanac. History Globe are un articol despre En-Dor; răspunsul de față se ocupă doar de locul unde se afla."
    - "Locul explică povestea. Înainte de bătălia de la Ghilboa, „s’au adunat cei de alt neam, și au venit, și au tăbărît la Sonam, și a adunat și Saul toți ostașii lui Israil, și au tăbărît la Ghelvoe”, de cealaltă parte a văii, spre sud. Când Domnul nu i-a răspuns, Saul a zis slugilor sale: „căutați mie femeie, care grăește din pântece … și au zis slugile lui către dânsul: iată este în Endor femeie, care grăește din pântece”. Ca să ajungă la ea, „s’a acoperit Saul, și s’a îmbrăcat cu alte haine, și a mers el și doi bărbați cu dânsul, și a venit la femeie noaptea”: din tabăra lui Israel de lângă izvorul din Izreel, la circa 11 km în linie dreaptă, pe lângă tabăra filistenilor de la Șunem și ocolind dealul Moreh, în spatele liniilor dușmane."
    - "Iosua numără Endorul printre cetățile canaanite pe care Manase le stăpânea în teritoriul lui Isahar și al lui Așer, alături de Bet-Șan, Taanac și Meghido, iar Psalmul 83 (82 în numerotarea sinodală) amintește dușmanii din zilele Deborei, care au pierit la Endor. Harta datează vizita de noapte a lui Saul și moartea lui pe Ghilboa, în ziua următoare, în jurul anului 1010 î.Hr., un reper convențional. Eusebiu plasa Endorul la patru mile spre sud de Tabor; Indur a fost părăsit în 1948, iar kibuțul Ein Dor din apropiere își ia numele de la cetatea antică."
  bg:
    - "Ен-Дор е село в източния край на Изреелската долина, на северния склон на хълма Море, в Долна Галилея, в днешен Израел. Най-често се поставя при Хирбет ес-Сафсафа, близо до старото арабско село Индур, което е запазило името; там стои точката на картата, на около 4,7 км южно от планината Тавор, на 6,7 км североизточно от Сунам и на около 98 км северно от Йерусалим по права линия. Други кандидати са самото Индур и Тел ел-Аджул, а някои търсят мястото в западния край на долината, близо до Танах. В History Globe има статия за Ен-Дор; този отговор се ограничава с това къде се е намирал."
    - "Местоположението му обяснява разказа. Преди битката при Гелвуя „събраха се Филистимците купно и дойдоха та разположиха стана си в Сунам; и събра Саул всичкия Израил, та разположиха стана си в Гелвуе“, от другата страна на долината, на юг. Когато Господ не му отговори, Саул каза: „Потърсете ми жена бесовъпрошателка… И рабите му рекоха му: Ето, има в Ендор една жена бесовъпрошателка.“ За да стигне до нея, „преличи се Саул, и облече други дрехи, и отиде той и двама мъже с него та дойдоха при жената през нощ“: от стана на Израил при извора в Изреел, на около 11 км по права линия, покрай филистимския стан в Сунам и около хълма Море, зад вражеските линии."
    - "Книга Иисус Навин изброява Ен-Дор сред ханаанските градове, които Манасия държеше в пределите на Исахар и Асир, заедно с Бет-Сан, Танах и Мегидо, а Псалом 83 (82 в синодалната номерация) припомня враговете от дните на Девора, „които загинаха в Ендор“. Картата датира нощното посещение на Саул и смъртта му на Гелвуя на следващия ден около 1010 г. пр.н.е. — условна точка. Евсевий поставя Ен-Дор на четири мили южно от Тавор; Индур е изоставено през 1948 г., а близкият кибуц Ейн Дор носи името на древния град."
