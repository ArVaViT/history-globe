id: where-did-moses-see-the-burning-bush
question:
  en: "Where did Moses see the burning bush?"
  ru: "Где Моисей увидел неопалимую купину?"
  uk: "Де Мойсей побачив неопалиму купину?"
  es: "¿Dónde vio Moisés la zarza ardiente?"
  pt: "Onde Moisés viu a sarça ardente?"
  de: "Wo sah Mose den brennenden Dornbusch?"
  fr: "Où Moïse a-t-il vu le buisson ardent ?"
  pl: "Gdzie Mojżesz zobaczył płonący krzew?"
  it: "Dove Mosè vide il roveto ardente?"
  nl: "Waar zag Mozes de brandende braamstruik?"
  cs: "Kde Mojžíš uviděl hořící keř?"
  sv: "Var såg Mose den brinnande busken?"
  nb: "Hvor så Moses den brennende tornebusken?"
  tl: "Saan nakita ni Moises ang nagniningas na palumpong?"
answer:
  en:
    - "At Horeb, “the mountain of God”, while he was keeping Jethro's flock: Exodus says that Moses “led the flock to the backside of the desert, and came to the mountain of God, even to Horeb”. Christian tradition has shown the spot since the fourth century at the foot of Jebel Musa in the south of the Sinai Peninsula, where the map places Horeb, about 380 km south-west of Jerusalem in a straight line. Because the site of the mountain itself is disputed, so is the site of the bush; the question of the mountain has its own page."
    - "Then “the angel of the LORD appeared unto him in a flame of fire out of the midst of a bush: and he looked, and, behold, the bush burned with fire, and the bush was not consumed.” God called to him from the bush and told him, “put off thy shoes from off thy feet, for the place whereon thou standest is holy ground”. Moses' blessing of Joseph remembers God as “him that dwelt in the bush”; in the New Testament Jesus cites the words spoken “in the bush” about the God of Abraham, Isaac and Jacob, and Stephen places the vision “in the wilderness of mount Sina”."
    - "The pilgrim Egeria, about 383, was shown the bush, still alive and sprouting, in a garden in front of a church at the foot of the mountain. The emperor Justinian later enclosed the place in the fortified monastery now called St Catherine's; behind its apse is the Chapel of the Burning Bush, where visitors still take off their shoes, and a bramble growing by its wall is shown as the bush. Those who look for Horeb elsewhere move the bush with it: some to Midian in north-western Arabia, where Jethro was priest, about 100 km east of the map point, others to Har Karkom in the Negev, about 210 km to the north-north-east."
  ru:
    - "У Хорива, «горы Божией», когда Моисей пас стадо Иофора: книга Исход говорит, что «провел он стадо далеко в пустыню и пришел к горе Божией, Хориву». Христианское предание с IV века показывает это место у подножия Джебель-Мусы на юге Синайского полуострова, где карта и ставит Хорив, примерно в 380 км к юго-западу от Иерусалима по прямой. Поскольку место самой горы спорно, спорно и место купины; о горе — отдельная страница."
    - "«И явился ему Ангел Господень в пламени огня из среды тернового куста. И увидел он, что терновый куст горит огнем, но куст не сгорает». Бог воззвал к нему из куста и сказал: «сними обувь твою с ног твоих, ибо место, на котором ты стоишь, есть земля святая». Благословение Моисея Иосифу вспоминает Бога как «Явившегося в терновом кусте»; в Новом Завете Иисус приводит слова, сказанные «при купине», о Боге Авраама, Исаака и Иакова, а Стефан помещает видение «в пустыне горы Синая»."
    - "Паломнице Эгерии около 383 года показали этот куст, ещё живой и дающий побеги, в саду перед церковью у подножия горы. Позже император Юстиниан заключил это место в укреплённый монастырь, ныне называемый монастырём святой Екатерины; за его алтарной апсидой — придел Неопалимой Купины, где посетители и сегодня снимают обувь, а куст ежевики у его стены показывают как ту самую купину. Кто ищет Хорив в другом месте, переносит с ним и купину: одни — в Мадиам на северо-западе Аравии, где Иофор был священником, примерно в 100 км к востоку от точки карты, другие — на Хар-Карком в Негеве, примерно в 210 км к северо-северо-востоку."
  uk:
    - "На Хориві, «горі Божій», коли пас отару Єтра: Книга Вихід каже, що Мойсей «погнавсь з вівцями за степ, і прийшов до Божої Гореб гори». Християнська традиція показує це місце з IV ст. біля підніжжя Джебель-Муси на півдні Синайського півострова, де мапа розміщує Хорив, приблизно за 380 км на південний захід від Єрусалиму по прямій. Оскільки місце самої гори спірне, спірне й місце купини; питання про гору має власну сторінку."
    - "Тоді «явивсь йому ангел Господень ув огнистому поломї ізсеред куща тернового. Побачив, що кущ горить огнем, горить і не згоряє». Бог покликав його з купини й сказав: «іззуй обувє твоє з ніг твоїх, місце бо, що на йому стоїш, земля сьвята». Мойсеєве благословення Йосифа згадує Бога як «того, хто в терновому кущі явився»; у Новому Заповіті Ісус цитує слова, сказані «коло купини», про Бога Авраама, Ісаака та Якова, а Стефан розміщує видіння «в пустинї під горою Синаєм»."
    - "Прочанці Егерії близько 383 р. показали купину, ще живу й таку, що пускає паростки, у саду перед церквою біля підніжжя гори. Імператор Юстиніан пізніше обніс це місце укріпленим монастирем, нині званим монастирем святої Катерини; за його апсидою — каплиця Неопалимої Купини, де відвідувачі досі знімають взуття, а ожина, що росте біля її стіни, показується як купина. Ті, хто шукає Хорив деінде, переносять купину разом із ним: одні — до Мадіаму в північно-західній Аравії, де Єтро був священиком, приблизно за 100 км на схід від точки мапи, інші — до Хар-Кармоку в Негеві, приблизно за 210 км на північ-північний схід."
  es:
    - "En Horeb, «monte de Dios», mientras apacentaba el rebaño de Jetro: Éxodo dice que Moisés «llevó las ovejas detrás del desierto, y vino á Horeb, monte de Dios». La tradición cristiana muestra el lugar desde el siglo IV al pie del Jebel Musa, en el sur de la península del Sinaí, donde el mapa sitúa Horeb, a unos 380 km al suroeste de Jerusalén en línea recta. Como el emplazamiento del propio monte es discutido, también lo es el de la zarza; la cuestión del monte tiene su propia ficha."
    - "Entonces «apareciósele el Angel de Jehová en una llama de fuego en medio de una zarza: y él miró, y vió que la zarza ardía en fuego, y la zarza no se consumía». Dios lo llamó desde la zarza y le dijo: «quita tus zapatos de tus pies, porque el lugar en que tú estás, tierra santa es». La bendición de Moisés a José recuerda a Dios como «el que habitó en la zarza»; en el Nuevo Testamento, Jesús cita las palabras dichas «en la zarza» sobre el Dios de Abraham, Isaac y Jacob, y Esteban sitúa la visión «en el desierto del monte Sina»."
    - "La peregrina Egeria, hacia el 383, vio la zarza, todavía viva y brotando, en un jardín frente a una iglesia al pie del monte. El emperador Justiniano encerró luego el lugar en el monasterio fortificado que hoy se llama de Santa Catalina; detrás de su ábside está la Capilla de la Zarza Ardiente, donde los visitantes aún se descalzan, y una zarza que crece junto a su muro se muestra como la zarza. Quienes buscan el Horeb en otro lugar trasladan con él la zarza: unos a Madián, en el noroeste de Arabia, donde Jetro era sacerdote, a unos 100 km al este del punto del mapa, otros a Har Karkom, en el Négev, a unos 210 km al nor-noreste."
  pt:
    - "Em Horebe, “o monte de Deus”, quando guardava o rebanho de Jetro: Êxodo diz que Moisés “conduziu o rebanho para o interior do deserto e chegou ao monte de Deus, a Horebe”. A tradição cristã mostra o lugar desde o século IV ao pé do Jebel Musa, no sul da península do Sinai, onde o mapa situa Horebe, a cerca de 380 km a sudoeste de Jerusalém em linha reta. Como o local do próprio monte é disputado, também o é o da sarça; a questão do monte tem página própria."
    - "Então “o anjo do SENHOR apareceu a ele em uma chama de fogo do meio de uma sarça. Ele olhou, e eis que a sarça ardia no fogo, e a sarça não era consumida.” Deus o chamou do meio da sarça e lhe disse: “Tire as suas sandálias, pois o lugar em que você está pisando é terra santa”. A bênção de Moisés a José lembra Deus como “aquele que habitou na sarça”; no Novo Testamento Jesus cita as palavras ditas “no relato sobre a Sarça” a respeito do Deus de Abraão, Isaque e Jacó, e Estêvão situa a visão “no deserto do monte Sinai”."
    - "A peregrina Egéria, por volta de 383, viu a sarça, ainda viva e brotando, num jardim diante de uma igreja ao pé do monte. O imperador Justiniano cercou depois o lugar no mosteiro fortificado hoje chamado de Santa Catarina; atrás de sua abside está a Capela da Sarça Ardente, onde os visitantes ainda tiram as sandálias, e uma sarça que cresce junto ao muro é mostrada como a sarça. Os que buscam Horebe em outro lugar movem a sarça com ele: alguns para Midiã, no noroeste da Arábia, onde Jetro era sacerdote, a cerca de 100 km a leste do ponto do mapa, outros para Har Karkom, no Neguebe, a cerca de 210 km a nor-nordeste."
  de:
    - "Am Horeb, dem „Berg Gottes“, als er die Schafe Jitros hütete: Das 2. Buch Mose sagt, Mose „trieb die Schafe hinter die Wüste und kam an den Berg Gottes, Horeb“. Die christliche Überlieferung zeigt die Stelle seit dem 4. Jahrhundert am Fuß des Dschebel Musa im Süden der Sinai-Halbinsel, wo die Karte den Horeb ansetzt, in der Luftlinie etwa 380 km südwestlich von Jerusalem. Weil die Lage des Berges selbst umstritten ist, ist es auch die des Busches; die Frage nach dem Berg hat ihre eigene Seite."
    - "Dann: „Und der Engel des HERRN erschien ihm in einer feurigen Flamme aus dem Busch. Und er sah, daß der Busch mit Feuer brannte und ward doch nicht verzehrt.“ Gott rief ihm aus dem Busch zu: „zieh deine Schuhe aus von deinen Füßen; denn der Ort, darauf du stehst, ist ein heilig Land!“ Moses Segen über Josef erinnert an Gott als den, „der in dem Busch wohnte“; im Neuen Testament zitiert Jesus die Worte „bei dem Busch“ über den Gott Abrahams, Isaaks und Jakobs, und Stephanus setzt die Erscheinung „in der Wüste an dem Berge Sinai“."
    - "Die Pilgerin Egeria bekam um 383 den Busch gezeigt, noch lebendig und treibend, in einem Garten vor einer Kirche am Fuß des Berges. Kaiser Justinian umschloss die Stätte später mit dem befestigten Kloster, das heute Katharinenkloster heißt; hinter seiner Apsis liegt die Dornbuschkapelle, in der Besucher noch heute die Schuhe ausziehen, und ein Dornstrauch an der Mauer wird als der Busch gezeigt. Wer den Horeb anderswo sucht, verlegt den Busch mit ihm: manche nach Midian in Nordwestarabien, wo Jitro Priester war, etwa 100 km östlich des Kartenpunkts, andere zum Har Karkom im Negev, etwa 210 km nord-nordöstlich."
  fr:
    - "À l’Horeb, « la montagne de Dieu », alors qu’il faisait paître le troupeau de Jéthro : l’Exode dit que Moïse « mena le troupeau derrière le désert, et vint à la montagne de Dieu, à Horeb ». La tradition chrétienne montre l’endroit depuis le IVe siècle au pied du Djebel Moussa, dans le sud de la péninsule du Sinaï, où la carte place l’Horeb, à environ 380 km au sud-ouest de Jérusalem en ligne droite. Le site de la montagne elle-même étant discuté, celui du buisson l’est aussi ; la question de la montagne a sa propre page."
    - "Puis « l’ange de l’Éternel lui apparut dans une flamme de feu, au milieu d’un buisson. Moïse regarda ; et voici, le buisson était tout en feu, et le buisson ne se consumait point. » Dieu l’appela du milieu du buisson et lui dit : « ôte tes souliers de tes pieds, car le lieu sur lequel tu te tiens est une terre sainte ». La bénédiction de Moïse sur Joseph se souvient de Dieu comme de « celui qui apparut dans le buisson » ; dans le Nouveau Testament, Jésus cite les paroles dites « à propos du buisson » sur le Dieu d’Abraham, d’Isaac et de Jacob, et Étienne place la vision « au désert de la montagne de Sinaï »."
    - "La pèlerine Égérie, vers 383, se vit montrer le buisson, encore vivant et poussant, dans un jardin devant une église au pied de la montagne. L’empereur Justinien enferma plus tard le lieu dans le monastère fortifié aujourd’hui appelé Sainte-Catherine ; derrière son abside se trouve la chapelle du Buisson ardent, où les visiteurs se déchaussent encore, et une ronce qui pousse près de son mur est montrée comme le buisson. Ceux qui cherchent l’Horeb ailleurs déplacent le buisson avec lui : certains en Madian, dans le nord-ouest de l’Arabie, où Jéthro était prêtre, à environ 100 km à l’est du point de la carte, d’autres à Har Karkom, dans le Néguev, à environ 210 km au nord-nord-est."
  pl:
    - "U Horebu, „góry Bożej”, gdy pasł trzodę Jetra: Księga Wyjścia mówi, że Mojżesz „zagnał trzodę na puszczą, a przyszedł do góry Bożej, do Horeb”. Tradycja chrześcijańska pokazuje to miejsce od IV wieku u stóp Dżabal Musa na południu Półwyspu Synaj, gdzie mapa umieszcza Horeb, około 380 km na południowy zachód od Jerozolimy w linii prostej. Ponieważ położenie samej góry jest sporne, sporne jest też położenie krzewu; pytanie o górę ma własną stronę."
    - "Wtedy „ukazał mu się Anioł Pański w płomieniu ognistym, z pośrodku krza; i widział, a oto, kierz gorzał ogniem, a on kierz nie zgorzał.” Bóg zawołał do niego z krzewu i rzekł: „zzuj buty twe z nóg twoich: albowiem miejsce, na którem ty stoisz, ziemia święta jest”. Błogosławieństwo Mojżesza dla Józefa wspomina Boga jako „mieszkającego w krzu”; w Nowym Testamencie Jezus przywołuje słowa wypowiedziane „ze krza” o Bogu Abrahama, Izaaka i Jakuba, a Szczepan umieszcza widzenie „na puszczy góry Synaj”."
    - "Pątniczce Egerii około 383 roku pokazano krzew, wciąż żywy i wypuszczający pędy, w ogrodzie przed kościołem u stóp góry. Cesarz Justynian zamknął później to miejsce w ufortyfikowanym klasztorze zwanym dziś klasztorem św. Katarzyny; za jego absydą stoi Kaplica Płonącego Krzewu, w której goście nadal zdejmują buty, a kolczasty krzew rosnący przy jej murze pokazuje się jako ten krzew. Ci, którzy szukają Horebu gdzie indziej, przesuwają krzew razem z nim: jedni do Madianu w północno-zachodniej Arabii, gdzie Jetro był kapłanem, około 100 km na wschód od punktu na mapie, inni do Har Karkom w Negewie, około 210 km na północ-północny wschód."
  it:
    - "A Horeb, «la montagna di Dio», mentre custodiva il gregge di Ietro: l’Esodo dice che Mosè, «guidando il gregge dietro al deserto, giunse alla montagna di Dio, a Horeb». La tradizione cristiana mostra il luogo dal IV secolo ai piedi del Gebel Musa nel sud della penisola del Sinai, dove la mappa pone l’Horeb, a circa 380 km a sud-ovest di Gerusalemme in linea retta. Poiché il sito del monte è discusso, lo è anche quello del roveto; la questione del monte ha una scheda a sé."
    - "Allora «l’angelo dell’Eterno gli apparve in una fiamma di fuoco, di mezzo a un pruno. Mosè guardò, ed ecco il pruno era tutto in fiamme, ma non si consumava». Dio lo chiamò dal pruno e gli disse: «togliti i calzari dai piedi, perché il luogo sul quale stai è suolo sacro». La benedizione di Mosè a Giuseppe ricorda Dio come «colui che stava nel pruno»; nel Nuovo Testamento Gesù cita le parole dette «nel passo del “pruno”» sul Dio di Abramo, Isacco e Giacobbe, e Stefano pone la visione «nel deserto del monte Sinai»."
    - "La pellegrina Egeria, verso il 383, vide il roveto, ancora vivo e germogliante, in un giardino davanti a una chiesa ai piedi del monte. L’imperatore Giustiniano racchiuse poi il luogo nel monastero fortificato oggi detto di Santa Caterina; dietro la sua abside è la Cappella del Roveto Ardente, dove i visitatori si tolgono ancora le scarpe, e un rovo che cresce presso il suo muro è mostrato come il roveto. Chi cerca l’Horeb altrove sposta con sé il roveto: alcuni a Madian nell’Arabia nord-occidentale, dove Ietro era sacerdote, a circa 100 km a est del punto della mappa, altri a Har Karkom nel Negev, a circa 210 km a nord-nord-est."
  nl:
    - "Bij Horeb, “den berg Gods”, terwijl hij de kudde van Jethro hoedde: Exodus zegt van Mozes: “hij leidde de kudde achter de woestijn, en hij kwam aan den berg Gods, aan Horeb”. De christelijke overlevering toont de plek sinds de vierde eeuw aan de voet van de Jebel Musa in het zuiden van het Sinaï-schiereiland, waar de kaart Horeb plaatst, hemelsbreed ongeveer 380 km ten zuidwesten van Jeruzalem. Omdat de ligging van de berg zelf omstreden is, is dat ook de ligging van de struik; de vraag naar de berg heeft een eigen pagina."
    - "Toen “de Engel des HEEREN verscheen hem in een vuurvlam uit het midden van een braambos; en hij zag, en ziet, het braambos brandde in het vuur, en het braambos werd niet verteerd.” God riep hem uit de struik en zei: “trek uw schoenen uit van uw voeten; want de plaats, waarop gij staat, is heilig land”. Mozes’ zegen over Jozef gedenkt God als “Desgenen, Die in het braambos woonde”; in het Nieuwe Testament haalt Jezus de woorden aan die “in het doornenbos” werden gesproken over de God van Abraham, Isaak en Jakob, en Stefanus plaatst het visioen “in de woestijn van den berg Sinai”."
    - "De pelgrim Egeria kreeg omstreeks 383 de struik te zien, nog levend en uitlopend, in een tuin voor een kerk aan de voet van de berg. Keizer Justinianus sloot de plek later in binnen het versterkte klooster dat nu Katharinaklooster heet; achter de apsis ligt de Kapel van de Brandende Braamstruik, waar bezoekers nog hun schoenen uittrekken, en een braamstruik langs de muur wordt als de struik getoond. Wie Horeb elders zoeken, verplaatsen de struik mee: sommigen naar Midian in Noordwest-Arabië, waar Jethro priester was, ongeveer 100 km ten oosten van het punt op de kaart, anderen naar Har Karkom in de Negev, ongeveer 210 km naar het noord-noordoosten."
  cs:
    - "Na Orébu, „hoře Boží“, když pásl dobytek Jitrův: Exodus praví, že Mojžíš „hnav stádo po poušti, přišel až k hoře Boží Oréb“. Křesťanská tradice ukazuje místo od 4. století na úpatí Džebel Músá na jihu Sinajského poloostrova, kam mapa klade Oréb, asi 380 km jihozápadně od Jeruzaléma vzdušnou čarou. Protože místo samotné hory je sporné, je sporné i místo keře; otázka hory má vlastní stránku."
    - "Pak „ukázal se mu anděl Hospodinův v plameni ohně z prostředku kře. I viděl, a aj, keř hořel ohněm, a však neshořel.“ Bůh na něj zavolal z keře a řekl mu: „szuj obuv svou s noh svých; nebo místo, na kterémž ty stojíš, země svatá jest“. Mojžíšovo požehnání Josefovi vzpomíná Boha jako „ve kři přebývajícího“; v Novém zákoně Ježíš připomíná, jak „ve kři promluvil k němu Bůh“ jako k Bohu Abrahamovu, Izákovu a Jákobovu, a Štěpán klade vidění „na poušti hory Sinai“."
    - "Poutnice Egerie, kolem roku 383, byla provedena ke keři, dosud živému a vyrážejícímu, v zahradě před kostelem na úpatí hory. Císař Justinián později místo uzavřel do opevněného kláštera nyní zvaného svaté Kateřiny; za jeho apsidou je Kaple hořícího keře, kde si návštěvníci dosud zouvají obuv, a trnitý keř rostoucí u její zdi se ukazuje jako onen keř. Ti, kdo hledají Oréb jinde, přesouvají s ním i keř: někteří do Midjánu v severozápadní Arábii, kde byl Jitro knězem, asi 100 km východně od bodu na mapě, jiní do Har Karkom v Negevu, asi 210 km na severoseverovýchod."
  sv:
    - "Vid Horeb, ”Guds berg”, medan han vaktade Jetros får: 2 Mosebok säger att Mose ”drev en gång fåren bortom öknen och kom så till Guds berg Horeb”. Kristen tradition har sedan 300-talet visat platsen vid foten av Jebel Musa i södra Sinaihalvön, där kartan placerar Horeb, omkring 380 km sydväst om Jerusalem fågelvägen. Eftersom själva bergets plats är omstridd är också busken det; frågan om berget har en egen sida."
    - "Sedan ”uppenbarade sig HERRENS ängel för honom i en eldslåga som slog upp ur en buske. Han såg att busken brann av elden, och att busken dock icke blev förtärd.” Gud ropade till honom ur busken och sade: ”drag dina skor av dina fötter, ty platsen där du står är helig mark”. Moses välsignelse över Josef minns Gud som honom ”som bodde i busken”; i Nya testamentet åberopar Jesus orden som talades ”där det talas om törnbusken” om Abrahams, Isaks och Jakobs Gud, och Stefanos förlägger synen ”i öknen vid berget Sinai”."
    - "Pilgrimen Egeria visades omkring 383 busken, som ännu levde och skötte nya skott, i en trädgård framför en kyrka vid bergets fot. Kejsar Justinianus inneslöt senare platsen i det befästa kloster som nu kallas Sankta Katarinas; bakom dess absid ligger Den brinnande buskens kapell, där besökare ännu tar av sig skorna, och en törnbuske vid dess mur visas som busken. De som söker Horeb på annat håll flyttar busken med det: några till Midjan i nordvästra Arabien, där Jetro var präst, omkring 100 km öster om kartpunkten, andra till Har Karkom i Negev, omkring 210 km åt nord-nordost."
  nb:
    - "Ved Horeb, «Guds berg», mens han gjette Jetros småfe: 2 Mosebok sier at Moses «drev engang småfeet bortom ørkenen og kom til Guds berg, til Horeb». Kristen tradisjon har vist stedet siden 300-tallet ved foten av Jebel Musa i den sørlige delen av Sinai-halvøya, der kartet plasserer Horeb, omtrent 380 km sørvest for Jerusalem i luftlinje. Fordi selve fjellets beliggenhet er omstridt, er det også tornebuskens; spørsmålet om fjellet har sin egen side."
    - "Så «åpenbarte Herrens engel sig for ham i en luende ild, midt ut av en tornebusk; og han så op, og se, tornebusken stod i lys lue, men tornebusken brente ikke op.» Gud ropte til ham fra busken og sa: «dra dine sko av dine føtter! For det sted du står på, er hellig jord». Moses' velsignelse over Josef minner om Gud som «ham som bodde i tornebusken»; i Det nye testamente viser Jesus til ordene som ble talt «om tornebusken» om Abrahams, Isaks og Jakobs Gud, og Stefanus plasserer synet «i berget Sinais ørken»."
    - "Pilegrimen Egeria ble omkring 383 vist busken, fortsatt levende og med skudd, i en hage foran en kirke ved fjellets fot. Keiser Justinian lukket senere stedet inne i det befestede klosteret som nå kalles Sankt Katarina-klosteret; bak apsisen ligger Kapellet ved den brennende tornebusk, der besøkende fortsatt tar av seg skoene, og en tornebusk som vokser ved muren, vises som busken. De som søker Horeb andre steder, flytter busken med seg: noen til Midjan i det nordvestlige Arabia, der Jetro var prest, omtrent 100 km øst for kartpunktet, andre til Har Karkom i Negev, omtrent 210 km mot nord-nordøst."
  tl:
    - "Sa Horeb, “bundok ng Dios”, habang inaalagaan niya ang kawan ni Jethro: sinasabi ng Exodo na “pinatnubayan ang kawan sa likuran ng ilang, at napasa bundok ng Dios, sa Horeb”. Ipinakikita ng tradisyong Kristiyano ang lugar mula pa noong ikaapat na siglo sa paanan ng Jebel Musa sa timog ng Tangway ng Sinai, kung saan inilalagay ng mapa ang Horeb, mga 380 km sa timog-kanluran ng Jerusalem sa tuwid na guhit. Yamang pinagtatalunan ang pook ng bundok mismo, gayon din ang palumpong; may sariling pahina ang tanong tungkol sa bundok."
    - "Pagkatapos “ang anghel ng Panginoon ay napakita sa kaniya, sa isang ningas ng apoy na mula sa gitna ng isang mababang punong kahoy; at siya'y nagmasid, at, narito, ang kahoy ay nagniningas sa apoy, at ang kahoy ay hindi natutupok.” Tinawag siya ng Dios mula sa palumpong at sinabi sa kaniya, “hubarin mo ang iyong panyapak sa iyong mga paa, sapagka't ang dakong iyong kinatatayuan ay banal na lupa”. Naaalala ng pagpapala ni Moises kay Jose ang Dios bilang “tumahan sa mababang punong kahoy”; sa Bagong Tipan, binabanggit ni Jesus ang mga salitang sinalita “tungkol sa Mababang punong kahoy” tungkol sa Dios nina Abraham, Isaac at Jacob, at inilalagay ni Esteban ang pangitain “sa ilang ng bundok ng Sinai”."
    - "Ang peregrinang si Egeria, mga 383, ay ipinakita ang palumpong, buháy pa at sumisibol, sa isang hardin sa harap ng simbahan sa paanan ng bundok. Kalaunan, ipinaloob ng emperador na si Justiniano ang lugar sa kutang monasteryong tinatawag ngayong Santa Catalina; sa likod ng apse nito ang Kapilya ng Nagniningas na Palumpong, kung saan naghuhubad pa rin ng sapin ang mga bisita, at isang tinikan sa tabi ng pader nito ang ipinakikita bilang palumpong. Ang naghahanap ng Horeb sa ibang lugar ay inililipat ang palumpong kasama nito: ang ilan sa Midian sa hilagang-kanlurang Arabia, kung saan saserdote si Jethro, mga 100 km sa silangan ng tuldok sa mapa, ang iba sa Har Karkom sa Negev, mga 210 km sa hilaga-hilagang-silangan."
