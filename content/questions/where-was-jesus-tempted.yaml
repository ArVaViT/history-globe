id: where-was-jesus-tempted
question:
  en: "Where was Jesus tempted?"
  ru: "Где Иисус был искушаем?"
  uk: "Де спокушали Ісуса?"
  es: "¿Dónde fue tentado Jesús?"
  pt: "Onde Jesus foi tentado?"
  de: "Wo wurde Jesus versucht?"
  fr: "Où Jésus fut-il tenté ?"
  pl: "Gdzie kuszono Jezusa?"
  it: "Dove fu tentato Gesù?"
  cs: "Kde byl Ježíš pokoušen?"
  nl: "Waar werd Jezus verzocht?"
  sv: "Var frestades Jesus?"
  nb: "Hvor ble Jesus fristet?"
answer:
  en:
    - "In the wilderness, the Gospels say, without naming the spot: “Then was Jesus led up of the Spirit into the wilderness to be tempted of the devil”, straight after his baptism in the Jordan. Since the Crusader period the place has been shown on Jebel Quruntul, the cliff that rises steeply over Jericho on the west, where the Greek Orthodox Monastery of the Temptation clings to the rock; the map point stands at Jericho below it, about 22 km east of Jerusalem and about 11 km from the traditional place of the baptism in a straight line. Scholars treat the mountain as a tradition, not a record: the wilderness of Judea, the bare slope that falls from the hills to the Jordan rift, is all the text gives."
    - "Luke says Jesus “returned from Jordan, and was led by the Spirit into the wilderness”; Mark that “he was there in the wilderness forty days, tempted of Satan; and was with the wild beasts”. Two of the three temptations move elsewhere: the devil “taketh him up into the holy city, and setteth him on a pinnacle of the temple”, and “into an exceeding high mountain”, from which he shows all the kingdoms of the world; Luke puts the mountain second and the temple last. The wilderness meant is the one John preached in, the desert of Judea between Jerusalem and the Dead Sea, a day's walk from the ford where John baptized; the forty days answer Israel's forty years in the wilderness, and Jesus answers each temptation from Deuteronomy."
    - "The monks came first, the tradition later. About 340 Chariton founded the laura of Douka on Quruntul, and Byzantine cells and chapels filled its caves; but the link with the forty days is recorded only from the twelfth century, when the Crusaders called the cliff Mons Quarantana, the mount of the forty days, and built one church in a cave halfway up and another on the summit; the present monastery, built around the cave chapel, dates from 1895. The Gospels name no mountain, so the identification rests on medieval tradition alone. The “pinnacle of the temple” is usually taken to be a corner of Herod's platform, most often the south-eastern above the Kidron; Josephus says that to look down from the royal portico on the southern side made the head swim."
  ru:
    - "В пустыне, говорят Евангелия, не называя места: «Тогда Иисус возведен был Духом в пустыню, для искушения от диавола», сразу после крещения в Иордане. Со времён крестоносцев это место показывают на горе Каранталь (Джебель-Курунтуль) — утёсе, круто встающем над Иерихоном с запада, где к скале лепится греческий православный монастырь Искушения; точка карты стоит у его подножия, в Иерихоне, примерно в 22 км к востоку от Иерусалима и в 11 км от традиционного места крещения по прямой. Учёные считают гору преданием, а не свидетельством: Иудейская пустыня, голый склон, что спускается с гор в Иорданскую впадину, — всё, что даёт текст."
    - "Лука говорит, что Иисус «возвратился от Иордана и поведен был Духом в пустыню»; Марк — что «был Он там в пустыне сорок дней, искушаемый сатаною, и был со зверями». Два искушения из трёх переносятся в другие места: диавол «берет Его… в святой город, и поставляет Его на крыле храма» и «на весьма высокую гору», откуда показывает все царства мира; у Луки гора идёт второй, а храм — последним. Пустыня здесь та, где проповедовал Иоанн: Иудейская пустыня между Иерусалимом и Мёртвым морем, в дне пути от брода, где он крестил; сорок дней отвечают сорока годам Израиля в пустыне, и на каждое искушение Иисус отвечает словами Второзакония."
    - "Монахи пришли сюда раньше предания. Около 340 года Харитон основал на Карантале лавру Дука, и византийские кельи и часовни заполнили его пещеры; но связь горы с сорока днями записана только с XII века, когда крестоносцы назвали утёс Mons Quarantana — гора сорока дней — и построили одну церковь в пещере на середине склона, а другую на вершине; нынешний монастырь, построенный вокруг пещерной часовни, — 1895 года. Евангелия горы не называют, так что отождествление держится только на средневековом предании. Слова «на крыле храма» обычно относят к углу Иродовой площадки, чаще всего к юго-восточному, над Кедроном; Иосиф Флавий пишет, что у смотревшего вниз с царского портика на южной стороне кружилась голова."
  uk:
    - "У пустелі, кажуть Євангелія, не називаючи місця: «Тодї повів Ісуса дух у пустиню на спокусу дияволську», одразу після його хрещення в Йордані. Від часів хрестоносців це місце показують на Джебель-Курунтулі — скелі, що круто здіймається над Єрихоном із заходу, де до каменю тулиться грецький православний монастир Спокуси; точка на мапі стоїть в Єрихоні під нею, приблизно за 22 км на схід від Єрусалима і приблизно за 11 км від традиційного місця хрещення по прямій. Учені вважають цю гору переказом, а не свідченням: усе, що дає текст, — це Юдейська пустеля, оголений схил, що спадає від пагорбів до Йорданської рифтової долини."
    - "Лука каже, що Ісус «вернувсь од Йордану, і був ведений Духом у пустиню»; Марк — що «був там у пустинї днїв сорок, спокушуваний од сатани; й пробував з дикими зьвірми». Два з трьох випробувань переносяться деінде: диявол «бере Його в сьвятий город, і ставить Його на церковнім крилї» і «на гору височенну», звідки показує Йому всі царства світу; Лука ставить гору другою, а храм останнім. Пустеля, про яку йдеться, — та сама, де проповідував Іван, Юдейська пустеля між Єрусалимом і Мертвим морем, на день ходу від броду, де хрестив Іван; сорок днів відповідають сорока рокам Ізраїлю в пустелі, і на кожне випробування Ісус відповідає з Повторення Закону."
    - "Спершу прийшли ченці, пізніше — переказ. Близько 340 р. Харитон заснував лавру Дук на Курунтулі, і візантійські келії та каплиці заповнили її печери; але зв'язок із сорока днями засвідчено лише від XII ст., коли хрестоносці назвали скелю Mons Quarantana, гора сорока днів, і збудували одну церкву в печері на півдорозі вгору, а іншу на вершині; нинішній монастир, збудований навколо печерної каплиці, датується 1895 роком. Євангелія не називають жодної гори, тож це ототожнення спирається лише на середньовічний переказ. «Церковне крило» зазвичай вважають кутом Іродової платформи, найчастіше південно-східним над Кедроном; Йосиф Флавій пише, що від погляду вниз з царського портика на південному боці паморочилося в голові."
  es:
    - "En el desierto, dicen los Evangelios, sin nombrar el lugar: «Entonces Jesús fué llevado del Espíritu al desierto, para ser tentado del diablo», nada más ser bautizado en el Jordán. Desde la época de los cruzados el lugar se muestra en el Jebel Quruntul, el risco que se alza abrupto sobre Jericó por el oeste, donde el monasterio griego ortodoxo de la Tentación se aferra a la roca; el punto del mapa está en Jericó, bajo él, a unos 22 km al este de Jerusalén y a unos 11 km del lugar tradicional del bautismo en línea recta. Los estudiosos tratan la montaña como una tradición, no como un testimonio: el desierto de Judea, la ladera desnuda que desciende de las colinas a la falla del Jordán, es todo lo que da el texto."
    - "Lucas dice que Jesús «volvió del Jordán, y fué llevado por el Espíritu al desierto»; Marcos, que «estuvo allí en el desierto cuarenta días, y era tentado de Satanás; y estaba con las fieras». Dos de las tres tentaciones se trasladan a otra parte: el diablo «le pasa á la santa ciudad, y le pone sobre las almenas del templo», y lo lleva «á un monte muy alto», desde el cual le muestra todos los reinos del mundo; Lucas pone el monte en segundo lugar y el templo en último. El desierto al que se refieren es aquel en el que predicó Juan, el desierto de Judea entre Jerusalén y el mar Muerto, a una jornada a pie del vado donde Juan bautizaba; los cuarenta días responden a los cuarenta años de Israel en el desierto, y Jesús responde a cada tentación con el Deuteronomio."
    - "Los monjes llegaron primero, la tradición después. Hacia el 340, Cariton fundó la laura de Duka en el Quruntul, y celdas y capillas bizantinas llenaron sus cuevas; pero el vínculo con los cuarenta días solo se registra desde el siglo XII, cuando los cruzados llamaron al risco Mons Quarantana, el monte de los cuarenta días, y construyeron una iglesia en una cueva a media altura y otra en la cima; el monasterio actual, levantado en torno a la capilla de la cueva, data de 1895. Los Evangelios no nombran ningún monte, de modo que la identificación se apoya solo en la tradición medieval. Las «almenas del templo» se entienden por lo común como una esquina de la plataforma de Herodes, casi siempre la sureste, sobre el Cedrón; Josefo dice que mirar hacia abajo desde el pórtico real del lado sur producía vértigo."
  pt:
    - "No deserto, dizem os Evangelhos, sem nomear o lugar: “Então Jesus foi levado pelo Espírito ao deserto, para ser tentado pelo diabo”, logo depois do seu batismo no Jordão. Desde o período das Cruzadas o lugar é mostrado no Jebel Quruntul, o penhasco que se ergue íngreme sobre Jericó, a oeste, onde o mosteiro ortodoxo grego da Tentação se agarra à rocha; o ponto do mapa fica em Jericó, abaixo dele, a cerca de 22 km a leste de Jerusalém e a cerca de 11 km do lugar tradicional do batismo em linha reta. Os estudiosos tratam o monte como tradição, não como registro: o deserto da Judeia, a encosta nua que desce das colinas até o vale do rift do Jordão, é tudo o que o texto dá."
    - "Lucas diz que Jesus “voltou do Jordão e foi guiado pelo Espírito ao deserto”; Marcos, que “Ele ficou no deserto quarenta dias, sendo tentado por Satanás. Estava com os animais selvagens”. Duas das três tentações se passam em outro lugar: o diabo “o levou à cidade santa. Ele o colocou sobre o pináculo do templo”, e “a um monte altíssimo”, de onde lhe mostra todos os reinos do mundo; Lucas põe o monte em segundo lugar e o templo por último. O deserto de que se trata é aquele em que João pregou, o deserto da Judeia entre Jerusalém e o mar Morto, a um dia de caminhada do vau onde João batizava; os quarenta dias correspondem aos quarenta anos de Israel no deserto, e Jesus responde a cada tentação com o Deuteronômio."
    - "Os monges vieram primeiro, a tradição depois. Por volta de 340, Caritão fundou a laura de Douka no Quruntul, e celas e capelas bizantinas encheram as suas grutas; mas a ligação com os quarenta dias só é registrada a partir do século XII, quando os cruzados chamaram o penhasco Mons Quarantana, o monte dos quarenta dias, e construíram uma igreja numa gruta a meia altura e outra no cume; o atual mosteiro, construído em torno da capela da gruta, data de 1895. Os Evangelhos não nomeiam nenhum monte, de modo que a identificação repousa somente na tradição medieval. O “pináculo do templo” costuma ser entendido como um canto da plataforma de Herodes, na maioria das vezes o sudeste, acima do Cedrom; Josefo diz que olhar para baixo do pórtico real, no lado sul, dava vertigem."
  de:
    - "In der Wüste, sagen die Evangelien, ohne den Ort zu nennen: „Da ward Jesus vom Geist in die Wüste geführt, auf daß er von dem Teufel versucht würde“, gleich nach seiner Taufe im Jordan. Seit der Kreuzfahrerzeit wird der Ort auf dem Dschebel Quruntul gezeigt, dem Felsen, der westlich steil über Jericho aufragt und an dem das griechisch-orthodoxe Kloster der Versuchung am Fels klebt; der Kartenpunkt steht darunter in Jericho, etwa 22 km östlich von Jerusalem und in der Luftlinie etwa 11 km von der traditionellen Taufstelle entfernt. Die Forschung behandelt den Berg als Tradition, nicht als Bericht: Die Wüste Judäas, der kahle Hang, der von den Bergen zum Jordangraben abfällt, ist alles, was der Text gibt."
    - "Lukas sagt, Jesus „kam wieder von dem Jordan und ward vom Geist in die Wüste geführt“; Markus, er sei vierzig Tage „allda in der Wüste“ gewesen, „ward versucht von dem Satan und war bei den Tieren“. Zwei der drei Versuchungen verlegen den Schauplatz: „Da führte ihn der Teufel mit sich in die Heilige Stadt und stellte ihn auf die Zinne des Tempels“, und „Wiederum führte ihn der Teufel mit sich auf einen sehr hohen Berg“, von dem aus er ihm alle Reiche der Welt zeigt; Lukas setzt den Berg an die zweite und den Tempel an die letzte Stelle. Gemeint ist die Wüste, in der Johannes predigte, die Wüste Judäa zwischen Jerusalem und dem Toten Meer, einen Tagesmarsch von der Furt, an der Johannes taufte; die vierzig Tage entsprechen Israels vierzig Jahren in der Wüste, und Jesus antwortet auf jede Versuchung mit dem Deuteronomium."
    - "Die Mönche kamen zuerst, die Tradition später. Um 340 gründete Chariton auf dem Quruntul die Laura von Duka, und byzantinische Zellen und Kapellen füllten seine Höhlen; die Verbindung mit den vierzig Tagen ist jedoch erst seit dem 12. Jahrhundert belegt, als die Kreuzfahrer den Felsen Mons Quarantana nannten, den Berg der vierzig Tage, und eine Kirche in einer Höhle auf halber Höhe und eine weitere auf dem Gipfel bauten; das heutige Kloster um die Höhlenkapelle stammt von 1895. Die Evangelien nennen keinen Berg, die Gleichsetzung beruht also allein auf mittelalterlicher Überlieferung. Die „Zinne des Tempels“ wird meist als Ecke der herodianischen Plattform verstanden, am häufigsten die südöstliche über dem Kidron; Josephus sagt, vom Blick von der königlichen Säulenhalle an der Südseite hinab sei einem schwindlig geworden."
  fr:
    - "Dans le désert, disent les Évangiles, sans nommer le lieu : « Alors Jésus fut emmené par l’Esprit dans le désert, pour être tenté par le diable », aussitôt après son baptême dans le Jourdain. Depuis l’époque des croisés, on montre le lieu sur le Jebel Quruntul, la falaise qui domine à pic Jéricho à l’ouest, où le monastère orthodoxe grec de la Tentation s’accroche au roc ; le point de la carte se trouve à Jéricho, en contrebas, à environ 22 km à l’est de Jérusalem et à environ 11 km du lieu traditionnel du baptême à vol d’oiseau. Les spécialistes tiennent la montagne pour une tradition, non pour un témoignage : le désert de Judée, la pente nue qui descend des collines vers le fossé du Jourdain, est tout ce que donne le texte."
    - "Luc dit que Jésus « revint du Jourdain, et il fut conduit par l’Esprit dans le désert » ; Marc, qu’il fut dans le désert, « où il passa quarante jours, tenté par Satan. Il était avec les bêtes sauvages ». Deux des trois tentations se déplacent ailleurs : le diable « le transporta dans la ville sainte, le plaça sur le haut du temple », et « sur une montagne très élevée », d’où il lui montre tous les royaumes du monde ; Luc met la montagne en deuxième et le temple en dernier. Le désert dont il s’agit est celui où prêchait Jean, le désert de Judée entre Jérusalem et la mer Morte, à une journée de marche du gué où Jean baptisait ; les quarante jours répondent aux quarante années d’Israël dans le désert, et Jésus répond à chaque tentation par une parole du Deutéronome."
    - "Les moines vinrent d’abord, la tradition plus tard. Vers 340, Chariton fonda la laure de Douka sur le Quruntul, et des cellules et des chapelles byzantines remplirent ses grottes ; mais le lien avec les quarante jours n’est attesté qu’à partir du XIIe siècle, quand les croisés appelèrent la falaise Mons Quarantana, le mont des quarante jours, et bâtirent une église dans une grotte à mi-hauteur et une autre au sommet ; l’actuel monastère, construit autour de la chapelle de la grotte, date de 1895. Les Évangiles ne nomment aucune montagne, de sorte que l’identification repose sur la seule tradition médiévale. Le « haut du temple » est généralement compris comme un angle de l’esplanade d’Hérode, le plus souvent l’angle sud-est au-dessus du Cédron ; Flavius Josèphe dit que regarder en bas depuis le portique royal du côté sud donnait le vertige."
  pl:
    - "Na pustyni, mówią Ewangelie, nie podając miejsca: „Tedy Jezus zawiedziony jest na puszczę od Ducha, aby był kuszony od dyjabła”, zaraz po chrzcie w Jordanie. Od czasów krzyżowców miejsce to pokazuje się na Jebel Quruntul, urwisku wznoszącym się stromo nad Jerychem od zachodu, gdzie do skały przylega grecko-prawosławny klasztor Kuszenia; punkt na mapie stoi w Jerychu pod nim, około 22 km na wschód od Jerozolimy i około 11 km od tradycyjnego miejsca chrztu w linii prostej. Uczeni traktują tę górę jako tradycję, nie zapis: pustynia judzka, naga pochyłość opadająca ze wzgórz ku rowowi Jordanu, to wszystko, co podaje tekst."
    - "Łukasz mówi, że Jezus „wrócił się od Jordanu, i pędzony jest od Ducha na puszczą”; Marek, że „był tam na puszczy przez czterdzieści dni, będąc kuszony od szatana, a był z zwierzęty”. Dwa z trzech kuszeń przenoszą się gdzie indziej: diabeł wziął go „do miasta świętego, i postawił go na ganku kościelnym”, czyli na szczycie świątyni, oraz „na górę bardzo wysoką”, z której pokazuje mu wszystkie królestwa świata; Łukasz stawia górę na drugim miejscu, a świątynię na końcu. Chodzi o pustynię, w której nauczał Jan, pustynię judzką między Jerozolimą a Morzem Martwym, o dzień drogi od brodu, gdzie Jan chrzcił; czterdzieści dni odpowiada czterdziestu latom Izraela na pustyni, a Jezus odpowiada na każde kuszenie słowami z Księgi Powtórzonego Prawa."
    - "Pierwsi byli mnisi, tradycja przyszła później. Około 340 Charyton założył ławrę Douka na Quruntul, a bizantyjskie cele i kaplice wypełniły jej jaskinie; ale związek z czterdziestoma dniami notuje się dopiero od XII wieku, gdy krzyżowcy nazwali urwisko Mons Quarantana, górą czterdziestu dni, i zbudowali jeden kościół w jaskini w połowie wysokości, a drugi na szczycie; obecny klasztor, zbudowany wokół kaplicy w jaskini, pochodzi z 1895 roku. Ewangelie nie wymieniają żadnej góry, więc identyfikacja opiera się wyłącznie na tradycji średniowiecznej. Miejsce „na ganku kościelnym”, czyli szczyt świątyni, uważa się zwykle za narożnik platformy Heroda, najczęściej południowo-wschodni nad Cedronem; Józef Flawiusz pisze, że spojrzenie w dół z portyku królewskiego po stronie południowej przyprawiało o zawrót głowy."
  it:
    - "Nel deserto, dicono i Vangeli, senza nominare il luogo: «Allora Gesù fu condotto dallo Spirito su nel deserto, per esser tentato dal diavolo», subito dopo il battesimo nel Giordano. Dal periodo crociato il luogo viene mostrato sul Jebel Quruntul, la rupe che si leva ripida sopra Gerico a ovest, dove il monastero greco-ortodosso della Tentazione si aggrappa alla roccia; il punto della mappa si trova a Gerico, sotto di essa, a circa 22 km a est di Gerusalemme e a circa 11 km dal luogo tradizionale del battesimo in linea d’aria. Gli studiosi trattano il monte come una tradizione, non come un dato documentato: il deserto di Giudea, il pendio nudo che scende dalle colline alla depressione del Giordano, è tutto ciò che il testo offre."
    - "Luca dice che Gesù «se ne ritornò dal Giordano, e fu condotto dallo Spirito nel deserto»; Marco che «nel deserto rimase per quaranta giorni, tentato da Satana; e stava tra le fiere». Due delle tre tentazioni si spostano altrove: il diavolo «lo menò seco nella santa città e lo pose sul pinnacolo del tempio», e lo condusse «sopra un monte altissimo», da cui gli mostra tutti i regni del mondo; Luca pone il monte al secondo posto e il tempio per ultimo. Il deserto inteso è quello in cui predicò Giovanni, il deserto di Giudea tra Gerusalemme e il Mar Morto, a un giorno di cammino dal guado dove Giovanni battezzava; i quaranta giorni rispondono ai quarant’anni di Israele nel deserto, e Gesù risponde a ciascuna tentazione con il Deuteronomio."
    - "Prima vennero i monaci, poi la tradizione. Verso il 340 Caritone fondò la laura di Douka sul Quruntul, e celle e cappelle bizantine riempirono le sue grotte; ma il legame con i quaranta giorni è attestato solo dal XII secolo, quando i Crociati chiamarono la rupe Mons Quarantana, il monte dei quaranta giorni, e costruirono una chiesa in una grotta a metà altezza e un’altra sulla sommità; l’attuale monastero, costruito attorno alla cappella della grotta, risale al 1895. I Vangeli non nominano alcun monte, così che l’identificazione si fonda sulla sola tradizione medievale. Il «pinnacolo del tempio» è di solito inteso come un angolo della piattaforma di Erode, il più delle volte quello sud-orientale sopra il Cedron; Giuseppe Flavio dice che guardare in basso dal portico regio sul lato meridionale faceva girare la testa."
  cs:
    - "Na poušti, říkají evangelia, aniž by místo jmenovala: „Tehdy Ježíš veden jest na poušť od Ducha, aby pokoušín byl od ďábla“, hned po křtu v Jordánu. Od doby křižáků se místo ukazuje na Džabal Quruntul, útesu, který strmě vystupuje nad Jerichem na západě, kde se ke skále lepí řecký pravoslavný klášter Pokušení; bod na mapě stojí v Jerichu pod ním, asi 22 km východně od Jeruzaléma a vzdušnou čarou asi 11 km od tradičního místa křtu. Badatelé pokládají horu za tradici, nikoli za záznam: Judská poušť, holý svah klesající z hor do jordánského příkopu, je vše, co text uvádí."
    - "Lukáš říká, že Ježíš se „vrátil od Jordánu, a puzen jest v Duchu na poušť“; Marek, že „byl tam na poušti čtyřidceti dnů, a pokoušín byl od satana; a byl s zvěří“. Dvě ze tří pokušení se přenesou jinam: ďábel ho vzal do „svatého města“ a postavil ho „na vrchu chrámu“ a pak „na horu vysokou velmi“, odkud mu ukazuje všechna království světa; Lukáš klade horu na druhé místo a chrám na poslední. Míněná poušť je ta, v níž kázal Jan, Judská poušť mezi Jeruzalémem a Mrtvým mořem, den cesty od brodu, kde Jan křtil; čtyřicet dnů odpovídá čtyřiceti letům Izraele na poušti a Ježíš odpovídá na každé pokušení z Deuteronomia."
    - "Mniši přišli první, tradice později. Kolem roku 340 založil Chariton lávru Dúka na Quruntulu a byzantské cely a kaple zaplnily její jeskyně; ale souvislost se čtyřiceti dny je doložena až od 12. století, kdy křižáci nazvali útes Mons Quarantana, hora čtyřiceti dnů, a postavili jeden kostel v jeskyni v půli výšky a druhý na vrcholu; dnešní klášter, vystavěný kolem jeskynní kaple, pochází z roku 1895. Evangelia žádnou horu nejmenují, takže ztotožnění stojí jen na středověké tradici. Místo „na vrchu chrámu“ se obvykle pokládá za roh Herodovy plošiny, nejčastěji jihovýchodní nad Kidronem; Josephus říká, že pohled dolů z královského sloupořadí na jižní straně způsoboval závrať."
  nl:
    - "In de woestijn, zeggen de evangeliën, zonder de plek te noemen: “Toen werd Jezus van den Geest weggeleid in de woestijn, om verzocht te worden van den duivel”, onmiddellijk na zijn doop in de Jordaan. Sinds de kruisvaardersperiode wordt de plaats aangewezen op de Jebel Quruntul, de rots die steil oprijst ten westen van Jericho en waaraan het Grieks-orthodoxe Klooster van de Verzoeking tegen de rotswand vastgeklampt zit; het punt op de kaart staat bij Jericho eronder, ongeveer 22 km ten oosten van Jeruzalem en hemelsbreed ongeveer 11 km van de traditionele plaats van de doop. Geleerden beschouwen de berg als een traditie, niet als een bericht: de woestijn van Judea, de kale helling die van het bergland afloopt naar de Jordaanslenk, is alles wat de tekst geeft."
    - "Lukas zegt van Jezus: “keerde wederom van de Jordaan, en werd door den Geest geleid in de woestijn”; Marcus zegt: “Hij was aldaar in de woestijn veertig dagen, verzocht van den satan; en was bij de wilde gedierten”. Twee van de drie verzoekingen verplaatsen zich elders: “Toen nam Hem de duivel mede naar de heilige stad, en stelde Hem op de tinne des tempels”, en “op een zeer hogen berg”, vanwaar hij Hem alle koninkrijken van de wereld toont; Lukas zet de berg op de tweede plaats en de tempel als laatste. De bedoelde woestijn is die waar Johannes predikte, de woestijn van Judea tussen Jeruzalem en de Dode Zee, een dagreis te voet van de voorde waar Johannes doopte; de veertig dagen beantwoorden aan Israëls veertig jaar in de woestijn, en Jezus beantwoordt elke verzoeking met een woord uit Deuteronomium."
    - "De monniken kwamen eerst, de traditie later. Rond 340 stichtte Chariton de lavra van Douka op de Quruntul, en Byzantijnse cellen en kapellen vulden de grotten; maar het verband met de veertig dagen is pas vanaf de twaalfde eeuw bekend, toen de kruisvaarders de rots Mons Quarantana noemden, de berg van de veertig dagen, en één kerk in een grot halverwege en een andere op de top bouwden; het huidige klooster, rond de grotkapel gebouwd, dateert van 1895. De evangeliën noemen geen berg, dus de identificatie berust alleen op middeleeuwse traditie. De “tinne des tempels” wordt gewoonlijk opgevat als een hoek van het platform van Herodes, meestal de zuidoostelijke boven het Kidrondal; Josephus zegt dat men duizelig werd als men vanaf de koninklijke zuilengang aan de zuidzijde omlaag keek."
  sv:
    - "I öknen, säger evangelierna, utan att nämna platsen: ”Därefter blev Jesus av Anden förd upp i öknen, för att han skulle frestas av djävulen”, strax efter sitt dop i Jordan. Sedan korstågstiden har platsen visats på Jebel Quruntul, klippan som reser sig brant över Jeriko i väster, där det grekisk-ortodoxa Frestelseklostret klamrar sig fast vid berget; kartpunkten står vid Jeriko nedanför, omkring 22 km öster om Jerusalem och omkring 11 km från den traditionella dopplatsen i fågelvägen. Forskare behandlar berget som en tradition, inte som ett belägg: Judeens öken, den kala sluttningen som faller från bergen ned mot Jordangraven, är allt texten ger."
    - "Lukas säger att Jesus ”vände tillbaka från Jordan, full av helig ande, och fördes genom Anden omkring i öknen”; Markus att ”han var i öknen i fyrtio dagar och frestades av Satan och levde bland vilddjuren”. Två av de tre frestelserna flyttar någon annanstans: djävulen tog honom ”med sig till den heliga staden och ställde honom uppe på helgedomens mur” och ”upp på ett mycket högt berg”, varifrån han visar honom alla världens riken; Lukas sätter berget som andra frestelse och templet sist. Öknen som avses är den där Johannes predikade, Judeens öken mellan Jerusalem och Döda havet, en dagsmarsch från vadstället där Johannes döpte; de fyrtio dagarna svarar mot Israels fyrtio år i öknen, och Jesus besvarar varje frestelse med ord ur Femte Moseboken."
    - "Munkarna kom först, traditionen senare. Omkring år 340 grundade Chariton lauran Douka på Quruntul, och bysantinska celler och kapell fyllde dess grottor; men kopplingen till de fyrtio dagarna är belagd först från 1100-talet, då korsfararna kallade klippan Mons Quarantana, de fyrtio dagarnas berg, och byggde en kyrka i en grotta halvvägs upp och en annan på toppen; det nuvarande klostret, byggt kring grottkapellet, härrör från 1895. Evangelierna nämner inget berg, så identifieringen vilar enbart på medeltida tradition. ”Helgedomens mur” anses vanligen vara ett hörn av Herodes’ plattform, oftast det sydöstra ovanför Kidron; Josefus säger att det svindlade i huvudet av att se ned från den kungliga pelarhallen på södra sidan."
  nb:
    - "I ørkenen, sier evangeliene, uten å nevne stedet: «Da blev Jesus av Ånden ført ut i ørkenen for å fristes av djevelen», rett etter dåpen i Jordan. Siden korsfarertiden har stedet vært vist på Jebel Quruntul, klippen som reiser seg bratt over Jeriko i vest, der det gresk-ortodokse fristelsesklosteret klamrer seg til fjellet; kartpunktet står i Jeriko nedenfor, omtrent 22 km øst for Jerusalem og omtrent 11 km fra det tradisjonelle dåpsstedet i luftlinje. Forskere regner fjellet som en tradisjon, ikke en opptegnelse: Judea-ørkenen, den nakne skråningen som faller fra åsene ned til Jordan-riften, er alt teksten gir."
    - "Lukas sier at Jesus «vendte tilbake fra Jordan, … og han blev av Ånden ført om i ørkenen»; Markus at «han var i ørkenen og blev fristet av Satan i firti dager, og han var hos de ville dyr». To av de tre fristelsene flytter seg andre steder: djevelen tok ham «med sig til den hellige stad og stilte ham på templets tinde» og «med op på et meget høit fjell», hvorfra han viser ham alle verdens riker; Lukas setter fjellet som nummer to og templet sist. Ørkenen som menes, er den Johannes forkynte i, Judea-ørkenen mellom Jerusalem og Dødehavet, en dagsmarsj fra vadestedet der Johannes døpte; de førti dagene svarer til Israels førti år i ørkenen, og Jesus svarer på hver fristelse fra Femte Mosebok."
    - "Munkene kom først, tradisjonen senere. Omkring 340 grunnla Khariton lavraen Douka på Quruntul, og bysantinske celler og kapeller fylte hulene der; men koblingen til de førti dagene er bare belagt fra 1100-tallet, da korsfarerne kalte klippen Mons Quarantana, de førti dagers fjell, og bygde en kirke i en hule halvveis opp og en annen på toppen; det nåværende klosteret, bygd rundt hulekapellet, stammer fra 1895. Evangeliene nevner ikke noe fjell, så identifiseringen hviler på middelalderlig tradisjon alene. «Templets tinde» antas vanligvis å være et hjørne av Herodes’ plattform, oftest det sørøstlige over Kedron; Josefus sier at det gikk rundt for hodet på en som så ned fra den kongelige søylegangen på sørsiden."
