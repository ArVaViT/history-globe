id: when-did-samaria-fall
question:
  en: "When did Samaria fall to Assyria?"
  ru: "Когда Самария пала под натиском Ассирии?"
  uk: "Коли Самарія впала перед Ассирією?"
  es: "¿Cuándo cayó Samaria ante Asiria?"
  pt: "Quando Samaria caiu diante da Assíria?"
  de: "Wann fiel Samaria an Assyrien?"
  fr: "Quand Samarie est-elle tombée aux mains de l’Assyrie ?"
answer:
  en:
    - "Samaria, the capital of the northern kingdom of Israel, fell to Assyria in 722 BC, after a siege of three years; with it the kingdom of Israel ended."
    - '2 Kings says that Hoshea, the last king of Israel, stopped paying tribute and sought help from Egypt, so "the king of Assyria came up throughout all the land, and went up to Samaria, and besieged it three years. In the ninth year of Hoshea the king of Assyria took Samaria, and carried Israel away into Assyria." The siege began about 725 BC under Shalmaneser V, whom the Bible names; the Babylonian Chronicle credits him with breaking Samaria, and his successor Sargon II, who came to the throne in 722, claims the capture and the deportation in his own inscriptions, so both kings are tied to the fall.'
    - "The Israelites were settled in Halah, on the Habor and in the cities of the Medes, and the king of Assyria brought in people from Babylon, Cuthah, Hamath and elsewhere to the cities of Samaria; Jewish tradition later traced the Samaritans to this mixed settlement, calling them Cutheans, while the Samaritans themselves claim descent from the northern tribes. Samaria became the seat of an Assyrian province. The kingdom had lasted about two centuries since the division under Rehoboam, about 931 BC. Judah survived for another 135 or 136 years, until Babylon took Jerusalem."
  ru:
    - "Самария, столица северного царства Израиль, пала под натиском Ассирии в 722 г. до н. э. после трёхлетней осады; с ней кончилось и Израильское царство."
    - "4-я книга Царств говорит, что Осия, последний царь Израиля, перестал платить дань и искал помощи у Египта, и тогда «пошел царь Ассирийский на всю землю, и приступил к Самарии, и держал ее в осаде три года. В девятый год Осии взял царь Ассирийский Самарию, и переселил Израильтян в Ассирию». Осада началась около 725 г. до н. э. при Салманассаре V, которого называет Библия; Вавилонская хроника приписывает взятие Самарии ему, а его преемник Саргон II, взошедший на престол в 722 г., в своих надписях приписывает захват и переселение себе, так что с падением связаны оба царя."
    - "Израильтян поселили в Халахе, на Хаворе и в городах Мидийских, а царь Ассирийский перевёл в города Самарийские людей из Вавилона, Куты, Емафа и других мест; иудейское предание позднее выводило самарян от этих переселенцев, называя их кутеями, сами же самаряне считают себя потомками северных колен. Самария стала центром ассирийской провинции. Царство просуществовало около двух веков после разделения при Ровоаме, около 931 г. до н. э. Иудея продержалась ещё 135–136 лет, пока Вавилон не взял Иерусалим."
  uk:
    - "Самарія, столиця Північного царства Ізраїль, упала перед Ассирією 722 р. до н. е. після облоги в три роки; разом із нею скінчилося Ізраїльське царство."
    - "Друга книга Царів каже, що Осія, останній цар Ізраїлю, перестав платити данину й шукав допомоги в Єгипту, тож «вирушив царь Ассирийський проти всієї землї й наступив на Самарию та й держав її в облязї три роки. У девятому роцї Осії здобув царь Ассирийський Самарию та й одвів Ізрайлитян полонянами в Ассирию». Облога почалася близько 725 р. до н. е. за Салманассара V, якого називає Біблія; Вавилонська хроніка приписує йому здобуття Самарії, а його наступник Саргон II, що зійшов на престол 722 р., заявляє про взяття й виселення у власних написах, тож обидва царі пов'язані з падінням."
    - "Ізраїльтян було поселено в Халаху, на Хаворі та в містах мідійців, а ассирійський цар привів людей з Вавилону, Кути, Хамату та інших місць у міста Самарії; єврейська традиція згодом виводила самарян із цього змішаного поселення, називаючи їх кутеянами, тоді як самі самаряни стверджують, що походять від північних колін. Самарія стала центром ассирійської провінції. Царство тривало приблизно два століття від поділу за Ровоама, близько 931 р. до н. е. Юда пережила його ще на 135 або 136 років, доки Вавилон не взяв Єрусалим."
  es:
    - "Samaria, la capital del reino del norte de Israel, cayó ante Asiria en el 722 a. C., tras un asedio de tres años; con ella terminó el reino de Israel."
    - "2 Reyes dice que Oseas, el último rey de Israel, dejó de pagar tributo y buscó ayuda en Egipto, de modo que «el rey de Asiria partió contra todo el país, y subió contra Samaria, y estuvo sobre ella tres años. En el año nueve de Oseas tomó el rey de Asiria á Samaria, y trasportó á Israel á Asiria». El asedio comenzó hacia el 725 a. C. bajo Salmanasar V, a quien nombra la Biblia; la Crónica babilónica le atribuye la ruptura de Samaria, y su sucesor Sargón II, que subió al trono en el 722, reclama la captura y la deportación en sus propias inscripciones, de modo que ambos reyes están ligados a la caída."
    - "Los israelitas fueron asentados en Hala, junto al Habor y en las ciudades de los medos, y el rey de Asiria hizo venir gente de Babilonia, Cuta, Hamat y otros lugares a las ciudades de Samaria; la tradición judía hizo luego derivar de este asentamiento mixto a los samaritanos, llamándolos cuteos, mientras que los propios samaritanos afirman descender de las tribus del norte. Samaria pasó a ser sede de una provincia asiria. El reino había durado unos dos siglos desde la división bajo Roboam, hacia el 931 a. C. Judá sobrevivió otros 135 o 136 años, hasta que Babilonia tomó Jerusalén."
  pt:
    - "Samaria, capital do reino do norte, Israel, caiu diante da Assíria em 722 a.C., após um cerco de três anos; com ela terminou o reino de Israel."
    - "2 Reis diz que Oseias, o último rei de Israel, deixou de pagar tributo e buscou ajuda no Egito, de modo que “o rei da Assíria subiu por toda a terra, foi até Samaria e a cercou por três anos. No nono ano de Oseias, o rei da Assíria tomou Samaria e levou Israel cativo para a Assíria”. O cerco começou por volta de 725 a.C. sob Salmaneser V, que a Bíblia nomeia; a Crônica Babilônica lhe atribui a queda de Samaria, e seu sucessor Sargão II, que subiu ao trono em 722, reivindica em suas inscrições a captura e a deportação, de modo que os dois reis estão ligados à queda."
    - "Os israelitas foram instalados em Halá, junto ao Habor e nas cidades dos medos, e o rei da Assíria trouxe gente da Babilônia, de Cuta, de Hamate e de outros lugares para as cidades de Samaria; a tradição judaica depois fez remontar os samaritanos a esse povoamento misto, chamando-os cuteus, enquanto os próprios samaritanos se dizem descendentes das tribos do norte. Samaria tornou-se sede de uma província assíria. O reino durara cerca de dois séculos desde a divisão sob Roboão, por volta de 931 a.C. Judá sobreviveu mais 135 ou 136 anos, até que Babilônia tomou Jerusalém."
  de:
    - "Samaria, die Hauptstadt des Nordreichs Israel, fiel 722 v. Chr. nach dreijähriger Belagerung an Assyrien; damit endete das Königreich Israel."
    - "Im 2. Buch der Könige heißt es, Hosea, der letzte König Israels, habe den Tribut eingestellt und Hilfe in Ägypten gesucht, und so: „Nämlich der König von Assyrien zog über das ganze Land und gen Samaria und belagerte es drei Jahre. Und im neunten Jahr Hoseas gewann der König von Assyrien Samaria und führte Israel weg nach Assyrien“. Die Belagerung begann um 725 v. Chr. unter Salmanassar V., den die Bibel nennt; die Babylonische Chronik schreibt ihm die Einnahme Samarias zu, und sein Nachfolger Sargon II., der 722 den Thron bestieg, beansprucht in eigenen Inschriften Eroberung und Deportation, sodass beide Könige mit dem Fall verbunden sind."
    - "Die Israeliten wurden in Halach, am Habor und in den Städten der Meder angesiedelt, und der König von Assyrien brachte Leute aus Babylon, Kuta, Hamat und anderswoher in die Städte Samarias; die jüdische Überlieferung führte die Samaritaner später auf diese Mischsiedlung zurück und nannte sie Kutäer, während die Samaritaner selbst ihre Abstammung von den Nordstämmen herleiten. Samaria wurde Sitz einer assyrischen Provinz. Das Königreich hatte seit der Teilung unter Rehabeam um 931 v. Chr. etwa zwei Jahrhunderte bestanden. Juda überdauerte weitere 135 oder 136 Jahre, bis Babylon Jerusalem einnahm."
  fr:
    - "Samarie, capitale du royaume d’Israël au nord, tomba aux mains de l’Assyrie en 722 av. J.-C., après un siège de trois ans ; avec elle prit fin le royaume d’Israël."
    - "2 Rois dit qu’Osée, dernier roi d’Israël, cessa de payer le tribut et chercha du secours en Égypte, de sorte que « le roi d’Assyrie parcourut tout le pays, et monta contre Samarie, qu’il assiégea pendant trois ans. La neuvième année d’Osée, le roi d’Assyrie prit Samarie, et emmena Israël captif en Assyrie ». Le siège commença vers 725 av. J.-C. sous Salmanasar V, que nomme la Bible ; la Chronique babylonienne lui attribue la chute de Samarie, et son successeur Sargon II, monté sur le trône en 722, revendique la prise et la déportation dans ses propres inscriptions, si bien que les deux rois sont liés à la chute."
    - "Les Israélites furent établis à Chalach, sur le Chabor et dans les villes des Mèdes, et le roi d’Assyrie fit venir des gens de Babylone, de Cutha, de Hamath et d’ailleurs dans les villes de Samarie ; la tradition juive fit plus tard remonter les Samaritains à ce peuplement mêlé, les appelant Cuthéens, tandis que les Samaritains eux-mêmes se disent descendants des tribus du nord. Samarie devint le siège d’une province assyrienne. Le royaume avait duré environ deux siècles depuis la division sous Roboam, vers 931 av. J.-C. Juda survécut encore 135 ou 136 ans, jusqu’à la prise de Jérusalem par Babylone."
