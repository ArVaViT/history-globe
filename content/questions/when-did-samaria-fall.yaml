id: when-did-samaria-fall
question:
  en: "When did Samaria fall to Assyria?"
  ru: "Когда Самария пала под натиском Ассирии?"
  uk: "Коли Самарія впала перед Ассирією?"
  es: "¿Cuándo cayó Samaria ante Asiria?"
  pt: "Quando Samaria caiu diante da Assíria?"
  de: "Wann fiel Samaria an Assyrien?"
  fr: "Quand Samarie est-elle tombée aux mains de l’Assyrie ?"
  pl: "Kiedy Samaria wpadła w ręce Asyrii?"
  it: "Quando Samaria cadde in mano all’Assiria?"
  nl: "Wanneer viel Samaria aan Assyrië?"
  cs: "Kdy Samaří padlo do rukou Asýrie?"
  sv: "När föll Samaria för Assyrien?"
  nb: "Når falt Samaria til Assyria?"
  tl: "Kailan bumagsak ang Samaria sa Asiria?"
answer:
  en:
    - "Samaria, the capital of the northern kingdom of Israel, fell to Assyria in 722 BC, after a siege of three years; with it the kingdom of Israel ended."
    - '2 Kings says that Hoshea, the last king of Israel, stopped paying tribute and sought help from Egypt, so "the king of Assyria came up throughout all the land, and went up to Samaria, and besieged it three years. In the ninth year of Hoshea the king of Assyria took Samaria, and carried Israel away into Assyria." The siege began about 725 BC under Shalmaneser V, whom the Bible names; the Babylonian Chronicle credits him with breaking Samaria, and his successor Sargon II, who came to the throne in 722, claims the capture and the deportation in his own inscriptions, so both kings are tied to the fall.'
    - "The Israelites were settled in Halah, on the Habor and in the cities of the Medes, and the king of Assyria brought in people from Babylon, Cuthah, Hamath and elsewhere to the cities of Samaria; Jewish tradition later traced the Samaritans to this mixed settlement, calling them Cutheans, while the Samaritans themselves claim descent from the northern tribes. Samaria became the seat of an Assyrian province. The kingdom had lasted about two centuries since the division under Rehoboam, about 931 BC. Judah survived for another 135 or 136 years, until Babylon took Jerusalem."
  ru:
    - "Самария, столица северного царства Израиль, пала под натиском Ассирии в 722 г. до н. э. после трёхлетней осады; с ней кончилось и Израильское царство."
    - "4-я книга Царств говорит, что Осия, последний царь Израиля, перестал платить дань и искал помощи у Египта, и тогда «пошел царь Ассирийский на всю землю, и приступил к Самарии, и держал ее в осаде три года. В девятый год Осии взял царь Ассирийский Самарию, и переселил Израильтян в Ассирию». Осада началась около 725 г. до н. э. при Салманассаре V, которого называет Библия; Вавилонская хроника приписывает взятие Самарии ему, а его преемник Саргон II, взошедший на престол в 722 г., в своих надписях приписывает захват и переселение себе, так что с падением связаны оба царя."
    - "Израильтян поселили в Халахе, на Хаворе и в городах Мидийских, а царь Ассирийский перевёл в города Самарийские людей из Вавилона, Куты, Емафа и других мест; иудейское предание позднее выводило самарян от этих переселенцев, называя их кутеями, сами же самаряне считают себя потомками северных колен. Самария стала центром ассирийской провинции. Царство просуществовало около двух веков после разделения при Ровоаме, около 931 г. до н. э. Иудея продержалась ещё 135–136 лет, пока Вавилон не взял Иерусалим."
  uk:
    - "Самарія, столиця Північного царства Ізраїль, упала перед Ассирією 722 р. до н. е. після облоги в три роки; разом із нею скінчилося Ізраїльське царство."
    - "Друга книга Царів каже, що Осія, останній цар Ізраїлю, перестав платити данину й шукав допомоги в Єгипту, тож «вирушив царь Ассирийський проти всієї землї й наступив на Самарию та й держав її в облязї три роки. У девятому роцї Осії здобув царь Ассирийський Самарию та й одвів Ізрайлитян полонянами в Ассирию». Облога почалася близько 725 р. до н. е. за Салманассара V, якого називає Біблія; Вавилонська хроніка приписує йому здобуття Самарії, а його наступник Саргон II, що зійшов на престол 722 р., заявляє про взяття й виселення у власних написах, тож обидва царі пов'язані з падінням."
    - "Ізраїльтян було поселено в Халаху, на Хаворі та в містах мідійців, а ассирійський цар привів людей з Вавилону, Кути, Хамату та інших місць у міста Самарії; єврейська традиція згодом виводила самарян із цього змішаного поселення, називаючи їх кутеянами, тоді як самі самаряни стверджують, що походять від північних колін. Самарія стала центром ассирійської провінції. Царство тривало приблизно два століття від поділу за Ровоама, близько 931 р. до н. е. Юда пережила його ще на 135 або 136 років, доки Вавилон не взяв Єрусалим."
  es:
    - "Samaria, la capital del reino del norte de Israel, cayó ante Asiria en el 722 a. C., tras un asedio de tres años; con ella terminó el reino de Israel."
    - "2 Reyes dice que Oseas, el último rey de Israel, dejó de pagar tributo y buscó ayuda en Egipto, de modo que «el rey de Asiria partió contra todo el país, y subió contra Samaria, y estuvo sobre ella tres años. En el año nueve de Oseas tomó el rey de Asiria á Samaria, y trasportó á Israel á Asiria». El asedio comenzó hacia el 725 a. C. bajo Salmanasar V, a quien nombra la Biblia; la Crónica babilónica le atribuye la ruptura de Samaria, y su sucesor Sargón II, que subió al trono en el 722, reclama la captura y la deportación en sus propias inscripciones, de modo que ambos reyes están ligados a la caída."
    - "Los israelitas fueron asentados en Hala, junto al Habor y en las ciudades de los medos, y el rey de Asiria hizo venir gente de Babilonia, Cuta, Hamat y otros lugares a las ciudades de Samaria; la tradición judía hizo luego derivar de este asentamiento mixto a los samaritanos, llamándolos cuteos, mientras que los propios samaritanos afirman descender de las tribus del norte. Samaria pasó a ser sede de una provincia asiria. El reino había durado unos dos siglos desde la división bajo Roboam, hacia el 931 a. C. Judá sobrevivió otros 135 o 136 años, hasta que Babilonia tomó Jerusalén."
  pt:
    - "Samaria, capital do reino do norte, Israel, caiu diante da Assíria em 722 a.C., após um cerco de três anos; com ela terminou o reino de Israel."
    - "2 Reis diz que Oseias, o último rei de Israel, deixou de pagar tributo e buscou ajuda no Egito, de modo que “o rei da Assíria subiu por toda a terra, foi até Samaria e a cercou por três anos. No nono ano de Oseias, o rei da Assíria tomou Samaria e levou Israel cativo para a Assíria”. O cerco começou por volta de 725 a.C. sob Salmaneser V, que a Bíblia nomeia; a Crônica Babilônica lhe atribui a queda de Samaria, e seu sucessor Sargão II, que subiu ao trono em 722, reivindica em suas inscrições a captura e a deportação, de modo que os dois reis estão ligados à queda."
    - "Os israelitas foram instalados em Halá, junto ao Habor e nas cidades dos medos, e o rei da Assíria trouxe gente da Babilônia, de Cuta, de Hamate e de outros lugares para as cidades de Samaria; a tradição judaica depois fez remontar os samaritanos a esse povoamento misto, chamando-os cuteus, enquanto os próprios samaritanos se dizem descendentes das tribos do norte. Samaria tornou-se sede de uma província assíria. O reino durara cerca de dois séculos desde a divisão sob Roboão, por volta de 931 a.C. Judá sobreviveu mais 135 ou 136 anos, até que Babilônia tomou Jerusalém."
  de:
    - "Samaria, die Hauptstadt des Nordreichs Israel, fiel 722 v. Chr. nach dreijähriger Belagerung an Assyrien; damit endete das Königreich Israel."
    - "Im 2. Buch der Könige heißt es, Hosea, der letzte König Israels, habe den Tribut eingestellt und Hilfe in Ägypten gesucht, und so: „Nämlich der König von Assyrien zog über das ganze Land und gen Samaria und belagerte es drei Jahre. Und im neunten Jahr Hoseas gewann der König von Assyrien Samaria und führte Israel weg nach Assyrien“. Die Belagerung begann um 725 v. Chr. unter Salmanassar V., den die Bibel nennt; die Babylonische Chronik schreibt ihm die Einnahme Samarias zu, und sein Nachfolger Sargon II., der 722 den Thron bestieg, beansprucht in eigenen Inschriften Eroberung und Deportation, sodass beide Könige mit dem Fall verbunden sind."
    - "Die Israeliten wurden in Halach, am Habor und in den Städten der Meder angesiedelt, und der König von Assyrien brachte Leute aus Babylon, Kuta, Hamat und anderswoher in die Städte Samarias; die jüdische Überlieferung führte die Samaritaner später auf diese Mischsiedlung zurück und nannte sie Kutäer, während die Samaritaner selbst ihre Abstammung von den Nordstämmen herleiten. Samaria wurde Sitz einer assyrischen Provinz. Das Königreich hatte seit der Teilung unter Rehabeam um 931 v. Chr. etwa zwei Jahrhunderte bestanden. Juda überdauerte weitere 135 oder 136 Jahre, bis Babylon Jerusalem einnahm."
  fr:
    - "Samarie, capitale du royaume d’Israël au nord, tomba aux mains de l’Assyrie en 722 av. J.-C., après un siège de trois ans ; avec elle prit fin le royaume d’Israël."
    - "2 Rois dit qu’Osée, dernier roi d’Israël, cessa de payer le tribut et chercha du secours en Égypte, de sorte que « le roi d’Assyrie parcourut tout le pays, et monta contre Samarie, qu’il assiégea pendant trois ans. La neuvième année d’Osée, le roi d’Assyrie prit Samarie, et emmena Israël captif en Assyrie ». Le siège commença vers 725 av. J.-C. sous Salmanasar V, que nomme la Bible ; la Chronique babylonienne lui attribue la chute de Samarie, et son successeur Sargon II, monté sur le trône en 722, revendique la prise et la déportation dans ses propres inscriptions, si bien que les deux rois sont liés à la chute."
    - "Les Israélites furent établis à Chalach, sur le Chabor et dans les villes des Mèdes, et le roi d’Assyrie fit venir des gens de Babylone, de Cutha, de Hamath et d’ailleurs dans les villes de Samarie ; la tradition juive fit plus tard remonter les Samaritains à ce peuplement mêlé, les appelant Cuthéens, tandis que les Samaritains eux-mêmes se disent descendants des tribus du nord. Samarie devint le siège d’une province assyrienne. Le royaume avait duré environ deux siècles depuis la division sous Roboam, vers 931 av. J.-C. Juda survécut encore 135 ou 136 ans, jusqu’à la prise de Jérusalem par Babylone."
  pl:
    - "Samaria, stolica północnego królestwa Izraela, wpadła w ręce Asyrii w 722 p.n.e., po trzyletnim oblężeniu; wraz z nią skończyło się królestwo Izraela."
    - "2 Księga Królewska mówi, że Ozeasz, ostatni król Izraela, przestał płacić daninę i szukał pomocy w Egipcie, więc „ciągnął król Assyryjski przez wszystkę ziemię, aż przyciągnął do Samaryi, pod którą leżał przez trzy lata. A roku dziewiątego Ozeasza wziął król Assyryjski Samaryję, i przeniósł Izraela do Assyryi”. Oblężenie zaczęło się około 725 p.n.e. za Salmanasara V, którego wymienia Biblia; Kronika Babilońska przypisuje mu zdobycie Samarii, a jego następca Sargon II, który wstąpił na tron w 722, we własnych inskrypcjach przypisuje sobie zdobycie i deportację, więc obaj królowie wiążą się z upadkiem."
    - "Izraelitów osiedlono w Chalach, nad Chaburem i w miastach Medów, a król Asyrii sprowadził ludzi z Babilonu, Kuty, Chamat i skądinąd do miast Samarii; tradycja żydowska wywodziła później Samarytan z tego mieszanego osadnictwa, nazywając ich Kutejczykami, podczas gdy sami Samarytanie twierdzą, że pochodzą od plemion północnych. Samaria stała się siedzibą prowincji asyryjskiej. Królestwo trwało około dwóch wieków od podziału za Roboama, około 931 p.n.e. Juda przetrwała jeszcze 135 lub 136 lat, aż Babilon zdobył Jerozolimę."
  it:
    - "Samaria, capitale del regno settentrionale d’Israele, cadde in mano all’Assiria nel 722 a.C., dopo un assedio di tre anni; con essa finì il regno d’Israele."
    - "2 Re dice che Osea, ultimo re d’Israele, smise di pagare il tributo e cercò aiuto dall’Egitto, così «il re d’Assiria invase tutto il paese, salì contro Samaria, e l’assediò per tre anni. L’anno nono di Hosea, il re d’Assiria prese Samaria, e trasportò gl’Israeliti in Assiria». L’assedio cominciò intorno al 725 a.C. sotto Salmanàssar V, che la Bibbia nomina; la Cronaca babilonese gli attribuisce la rottura di Samaria, e il suo successore Sargon II, salito al trono nel 722, rivendica la conquista e la deportazione nelle proprie iscrizioni, così entrambi i re sono legati alla caduta."
    - "Gli Israeliti furono insediati a Chelach, sul Cabor e nelle città dei Medi, e il re d’Assiria fece venire gente da Babilonia, Cuta, Camat e altrove nelle città di Samaria; la tradizione giudaica fece poi risalire i Samaritani a questo insediamento misto, chiamandoli Cutei, mentre i Samaritani stessi rivendicano la discendenza dalle tribù del nord. Samaria divenne sede di una provincia assira. Il regno era durato circa due secoli dalla divisione sotto Roboamo, circa il 931 a.C. Giuda sopravvisse altri 135 o 136 anni, finché Babilonia prese Gerusalemme."
  nl:
    - "Samaria, de hoofdstad van het noordelijke koninkrijk Israël, viel in 722 v.Chr. aan Assyrië, na een beleg van drie jaar; daarmee eindigde het koninkrijk Israël."
    - "2 Koningen zegt dat Hosea, de laatste koning van Israël, ophield schatting te betalen en hulp zocht bij Egypte; daarop: “de koning van Assyrie toog op in het ganse land; ja, hij kwam op naar Samaria, en hij belegerde haar drie jaren. In het negende jaar van Hosea, nam de koning van Assyrie Samaria in, en voerde Israel weg in Assyrie”. Het beleg begon omstreeks 725 v.Chr. onder Salmaneser V, die de Bijbel noemt; de Babylonische kroniek schrijft hem de inname van Samaria toe, en zijn opvolger Sargon II, die in 722 op de troon kwam, claimt in zijn eigen opschriften de verovering en de deportatie, zodat beide koningen aan de val worden verbonden."
    - "De Israëlieten werden gevestigd in Chalach, aan de Chabor en in de steden der Meden, en de koning van Assyrië bracht mensen uit Babylon, Kuta, Hamat en elders naar de steden van Samaria; de Joodse overlevering leidde de Samaritanen later van deze gemengde nederzetting af en noemde hen Kutiërs, terwijl de Samaritanen zelf afstamming van de noordelijke stammen claimen. Samaria werd de zetel van een Assyrische provincie. Het koninkrijk had ongeveer twee eeuwen bestaan sinds de deling onder Rehabeam, omstreeks 931 v.Chr. Juda overleefde nog 135 of 136 jaar, tot Babylon Jeruzalem innam."
  cs:
    - "Samaří, hlavní město severního království Izrael, padlo do rukou Asýrie roku 722 př. n. l. po tříletém obléhání; tím severní království zaniklo."
    - "Druhá kniha Královská praví, že Hóšea, poslední izraelský král, přestal platit tribut a hledal pomoc v Egyptě, takže „táhl král Assyrský po vší zemi; přitáhl také do Samaří, a ležel u ní tři léta. Léta pak devátého Ozee vzal král Assyrský Samaří, a přenesl Izraele do Assyrie“. Obléhání začalo asi roku 725 př. n. l. za Salmanasara V., jejž Bible jmenuje; babylonská kronika mu připisuje prolomení Samaří a jeho nástupce Sargon II., který nastoupil roku 722, si dobytí a deportaci připisuje ve svých nápisech, takže oba králové jsou s pádem spojeni."
    - "Izraelci byli usazeni v Chalachu, na Chabóru a ve městech Médů a asyrský král přivedl lidi z Babylónu, Kuty, Chamatu a odjinud do měst Samaří; židovská tradice později odvozovala Samaritány z tohoto smíšeného osídlení a nazývala je Kutejci, zatímco sami Samaritáni tvrdí, že pocházejí ze severních kmenů. Samaří se stalo sídlem asyrské provincie. Království trvalo asi dvě století od rozdělení za Rechabeáma kolem 931 př. n. l. Judské království přežilo ještě dalších 135 nebo 136 let, než Babylón dobyl Jeruzalém."
  sv:
    - "Samaria, huvudstad i nordriket Israel, föll för Assyrien 722 f.Kr., efter en belägring på tre år; med det upphörde kungariket Israel."
    - "2 Kung säger att Hosea, Israels siste kung, slutade betala tribut och sökte hjälp hos Egypten, så att ”konungen i Assyrien drog upp och angrep hela landet, och drog upp mot Samaria och belägrade det i tre år. I Hoseas nionde regeringsår intog konungen i Assyrien Samaria och förde Israel bort till Assyrien”. Belägringen började omkring 725 f.Kr. under Salmanassar V, som Bibeln nämner vid namn; den babyloniska krönikan tillskriver honom intagandet av Samaria, och hans efterträdare Sargon II, som besteg tronen 722, gör anspråk på intagandet och bortförandet i sina egna inskriptioner, så båda kungarna är knutna till fallet."
    - "Israeliterna bosattes i Halach, vid Habor och i Mediens städer, och Assyriens kung lät folk från Babylon, Kuta, Hamat och andra platser bosätta sig i Samariens städer; judisk tradition härledde senare samariterna från denna blandade bosättning och kallade dem kutéer, medan samariterna själva hävdar att de härstammar från nordstammarna. Samaria blev säte för en assyrisk provins. Riket hade bestått i omkring två århundraden sedan delningen under Rehabeam, omkring 931 f.Kr. Juda överlevde ytterligare 135 eller 136 år, till dess Babylon intog Jerusalem."
  nb:
    - "Samaria, hovedstaden i nordriket Israel, falt til Assyria i 722 f.Kr., etter en beleiring på tre år; med det tok kongeriket Israel slutt."
    - "2 Kongebok sier at Hosea, Israels siste konge, sluttet å betale skatt og søkte hjelp hos Egypt, så «kongen i Assyria drog op over hele landet, og han rykket frem mot Samaria og holdt det kringsatt i tre år. I Hoseas niende år inntok den assyriske konge Samaria og bortførte Israel til Assyria». Beleiringen begynte omkring 725 f.Kr. under Salmanassar V, som Bibelen nevner; Den babylonske krønike tilskriver ham brytingen av Samaria, og hans etterfølger Sargon II, som besteg tronen i 722, hevder erobringen og bortføringen i sine egne innskrifter, så begge kongene knyttes til fallet."
    - "Israelittene ble bosatt i Halah, ved Habor og i Medias byer, og kongen av Assyria hentet folk fra Babylon, Kuta, Hamat og andre steder til Samarias byer; jødisk tradisjon førte senere samaritanerne tilbake til denne blandede bosettingen og kalte dem kuteere, mens samaritanerne selv hevder å stamme fra nordstammene. Samaria ble sete for en assyrisk provins. Kongeriket hadde bestått i omtrent to århundrer siden delingen under Rehabeam, omkring 931 f.Kr. Juda overlevde i ytterligere 135 eller 136 år, til Babylon tok Jerusalem."
  tl:
    - "Bumagsak ang Samaria, kabisera ng hilagang kaharian ng Israel, sa Asiria noong 722 BK, pagkaraan ng tatlong taong pagkubkob; kasama nito ay nagwakas ang kaharian ng Israel."
    - "Sinasabi ng 2 Mga Hari na tumigil si Oseas, ang huling hari ng Israel, sa pagbabayad ng tributo at humingi ng tulong sa Egipto, kaya “umahon ang hari sa Asiria sa buong lupain, at umahon sa Samaria, at kinulong na tatlong taon. Nang ikasiyam na taon ni Oseas, sinakop ng hari sa Asiria ang Samaria, at dinala ang Israel sa Asiria”. Nagsimula ang pagkubkob noong mga 725 BK sa ilalim ni Salmanasar V, na pinangalanan ng Biblia; iniuugnay sa kaniya ng Kronikang Babilonio ang pagbagsak ng Samaria, at ang kahalili niyang si Sargon II, na umakyat sa trono noong 722, ay umaangkin ng pagkuha at pagtapon sa sarili niyang mga inskripsiyon, kaya ang dalawang hari ay iniuugnay sa pagbagsak."
    - "Inilagay ang mga Israelita sa Hala, sa Habor, at sa mga bayan ng mga Medo, at nagdala ang hari ng Asiria ng mga tao mula sa Babilonia, Cuta, Hamath at iba pang lugar sa mga bayan ng Samaria; kalaunan ay iniugnay ng tradisyong Judio ang mga Samaritano sa halo-halong paninirahang ito, na tinawag silang mga Cuteo, samantalang inaangkin ng mga Samaritano mismo na sila'y nagmula sa hilagang mga lipi. Naging luklukan ng lalawigang Asirio ang Samaria. Tumagal ang kaharian nang mga dalawang siglo mula sa paghahati sa ilalim ni Roboam, noong mga 931 BK. Nanatili ang Juda nang 135 o 136 taon pa, hanggang kunin ng Babilonia ang Jerusalem."
