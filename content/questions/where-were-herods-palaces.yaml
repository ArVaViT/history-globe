id: where-were-herods-palaces
question:
  en: "Where were Herod's palaces?"
  ru: "Где находились дворцы Ирода?"
  uk: "Де були палаци Ірода?"
  es: "¿Dónde estaban los palacios de Herodes?"
  pt: "Onde ficavam os palácios de Herodes?"
  de: "Wo standen die Paläste des Herodes?"
  fr: "Où se trouvaient les palais d’Hérode ?"
  pl: "Gdzie były pałace Heroda?"
  it: "Dove si trovavano i palazzi di Erode?"
  cs: "Kde byly Herodovy paláce?"
  nl: "Waar stonden de paleizen van Herodes?"
  sv: "Var låg Herodes’ palats?"
answer:
  en:
    - "Herod the Great built palaces all over his kingdom. In Jerusalem his palace stood on the western hill by the three towers Hippicus, Phasael and Mariamne, where the Citadel by the Jaffa Gate now stands; at Caesarea a palace ran out on a promontory into the sea; at Jericho he enlarged the Hasmonean winter palaces at the mouth of Wadi Qelt, where he died; at Herodium, 12 km south of Jerusalem and 5 km from Bethlehem, he raised a palace-fortress on a hill he had heaped higher, and was buried there; Masada above the Dead Sea had his northern and western palaces, and Machaerus east of the sea, Cypros above Jericho, Alexandrium and Hyrcania were fortresses with palaces. Josephus is the source for most of them, and nearly all have been excavated."
    - "The New Testament meets these buildings without naming Herod. The Roman governors, who lived at Caesarea, used his Jerusalem palace when they came up for the feasts, and most scholars now place there the praetorium of the Passion, where “the soldiers led him away into the hall, called Prætorium; and they call together the whole band”, rather than at the Antonia of the Via Dolorosa tradition; Philo tells how Pilate hung gilded shields in Herod's palace. Herod Antipas, “who himself also was at Jerusalem at that time”, probably stayed in the old Hasmonean palace. Paul at Caesarea was ordered “to be kept in Herod's judgment hall”, the promontory palace, and Agrippa I, after Peter's escape, “went down from Judæa to Cæsarea, and there abode”, and died there."
    - "Ehud Netzer dug Herod's buildings for nearly forty years: the Jericho palaces from 1973, Herodium from 1972, and in 2007 he found on the hill's slope the mausoleum and smashed sarcophagus that he identified as Herod's tomb, a claim some have questioned. Yigael Yadin uncovered Masada in 1963–1965, and the promontory palace at Caesarea was first dug by Netzer and Lee Levine in 1976 and further in the 1990s. Of the Jerusalem palace only its platform survives, under the Citadel and the Armenian Garden; the base of one tower, Phasael or Hippicus, is the “Tower of David”. Herod took Jerusalem in 37 BC and died about 4 BC; the palace is dated to about 23 BC."
  ru:
    - "Ирод Великий строил дворцы по всему своему царству. В Иерусалиме его дворец стоял на западном холме у трёх башен — Гиппика, Фасаила и Мариамны, — где теперь Цитадель у Яффских ворот; в Кесарии дворец выходил на мыс в море; в Иерихоне он расширил зимние дворцы Хасмонеев у выхода Вади-Кельт, где и умер; в Иродионе, в 12 км к югу от Иерусалима и в 5 км от Вифлеема, он возвёл дворец-крепость на холме, который велел досыпать, и там был погребён; на Масаде над Мёртвым морем были его Северный и Западный дворцы, а Махерон к востоку от моря, Кипрос над Иерихоном, Александрион и Гиркания были крепостями с дворцами. Почти обо всех рассказывает Иосиф Флавий, и почти все раскопаны."
    - "Новый Завет встречает эти постройки, не называя Ирода. Римские наместники, жившие в Кесарии, пользовались его иерусалимским дворцом, приезжая на праздники, и большинство учёных теперь помещает туда преторию Страстей, куда «воины отвели Его внутрь двора, то есть в преторию, и собрали весь полк», а не в Антонию, как по преданию Крестного пути; Филон рассказывает, как Пилат повесил позолоченные щиты во дворце Ирода. Ирод Антипа, «который в эти дни был также в Иерусалиме», скорее всего жил в старом дворце Хасмонеев. Павлу в Кесарии велено было «быть под стражею в Иродовой претории» — во дворце на мысу, а Агриппа I после бегства Петра «отправился из Иудеи в Кесарию и там оставался» — и там умер."
    - "Эхуд Нецер копал постройки Ирода почти сорок лет: дворцы Иерихона с 1973 года, Иродион с 1972-го, а в 2007 году нашёл на склоне холма мавзолей и разбитый саркофаг, в которых опознал гробницу Ирода, — некоторые это оспаривают. Игаэль Ядин открыл Масаду в 1963–1965 годах, дворец на мысу в Кесарии начали копать Нецер и Ли Левин в 1976 году и продолжили в 1990-е. От иерусалимского дворца уцелела лишь платформа под Цитаделью и Армянским садом; основание одной из башен, Фасаила или Гиппика, — «башня Давида». Ирод взял Иерусалим в 37 г. до н. э. и умер около 4 г. до н. э.; дворец датируют примерно 23 г. до н. э."
  uk:
    - "Ірод Великий будував палаци по всьому своєму царству. В Єрусалимі його палац стояв на західному пагорбі біля трьох веж — Гіппіка, Фасаїла й Маріамни, там, де нині стоїть Цитадель біля Яффських воріт; у Кесарії палац висувався на мисі в море; в Єрихоні він розбудував хасмонейські зимові палаци біля гирла Ваді-Кельт, де й помер; в Іродіоні, за 12 км на південь від Єрусалима і за 5 км від Вифлеєма, він звів палац-фортецю на штучно підвищеному пагорбі і був там похований; на Масаді над Мертвим морем були його північний і західний палаци, а Махерон на схід від моря, Кіпрос над Єрихоном, Александріон і Гірканія були фортецями з палацами. Йосиф Флавій — джерело для більшості з них, і майже всі розкопано."
    - "Новий Заповіт зустрічає ці будівлі, не називаючи Ірода. Римські намісники, які жили в Кесарії, користувалися його єрусалимським палацом, коли приїжджали на свята, і більшість учених нині поміщають там преторій Страстей, де «Воїни ж повели Його в середину двору, чи то в Претор, і скликали всю роту», а не в Антонії за переказом Віа Долороза; Філон розповідає, як Пилат повісив позолочені щити в палаці Ірода. Ірод Антипа, «що також був у Єрусалимі тими днями», імовірно, зупинився в старому хасмонейському палаці. Павла в Кесарії було наказано «стерегти його в преториї Іродовій», тобто в палаці на мисі, а Агриппа I, після втечі Петра, «перейшовши з Юдеї в Кисарию, жив (там)» і помер там."
    - "Егуд Нецер розкопував будівлі Ірода майже сорок років: палаци Єрихона від 1973 р., Іродіон від 1972 р., а 2007 р. він знайшов на схилі пагорба мавзолей і розбитий саркофаг, які ототожнив із гробницею Ірода, — твердження, яке дехто ставив під сумнів. Ігаель Ядін відкрив Масаду в 1963–1965 рр., а палац на мисі в Кесарії вперше розкопали Нецер і Лі Левін 1976 р. і далі в 1990-х рр. Від єрусалимського палацу зберігся лише його майданчик, під Цитаделлю й Вірменським садом; основа однієї з веж, Фасаїла чи Гіппіка, — це «Вежа Давида». Ірод узяв Єрусалим 37 р. до н. е. і помер близько 4 р. до н. е.; палац датують близько 23 р. до н. е."
  es:
    - "Herodes el Grande construyó palacios por todo su reino. En Jerusalén su palacio se alzaba en la colina occidental junto a las tres torres Hípico, Fasael y Mariamne, donde hoy está la Ciudadela, junto a la puerta de Jafa; en Cesarea, un palacio se adentraba en el mar sobre un promontorio; en Jericó amplió los palacios de invierno asmoneos en la desembocadura del Wadi Qelt, donde murió; en Herodión, a 12 km al sur de Jerusalén y a 5 km de Belén, levantó un palacio-fortaleza sobre una colina que había hecho más alta con tierra amontonada, y fue sepultado allí; Masada, sobre el mar Muerto, tenía sus palacios norte y occidental, y Maqueronte, al este del mar, Cipro, sobre Jericó, Alejandreion e Hircania eran fortalezas con palacios. Josefo es la fuente de la mayoría de ellos, y casi todos han sido excavados."
    - "El Nuevo Testamento se topa con estos edificios sin nombrar a Herodes. Los gobernadores romanos, que vivían en Cesarea, usaban su palacio de Jerusalén cuando subían para las fiestas, y la mayoría de los estudiosos sitúan ahora allí el pretorio de la Pasión, donde «los soldados le llevaron dentro de la sala, es á saber, al Pretorio; y convocan toda la cohorte», y no en la Antonia de la tradición de la Vía Dolorosa; Filón cuenta cómo Pilato colgó escudos dorados en el palacio de Herodes. Herodes Antipas, «el cual también estaba en Jerusalem en aquellos días», probablemente se alojó en el viejo palacio asmoneo. A Pablo, en Cesarea, se le ordenó que lo «guardasen en el pretorio de Herodes», el palacio del promontorio, y Agripa I, tras la fuga de Pedro, «descendiendo de Judea á Cesarea, se quedó allí», y murió allí."
    - "Ehud Netzer excavó los edificios de Herodes durante casi cuarenta años: los palacios de Jericó desde 1973, Herodión desde 1972, y en 2007 halló en la ladera de la colina el mausoleo y el sarcófago destrozado que identificó como la tumba de Herodes, una afirmación que algunos han cuestionado. Yigael Yadin sacó a la luz Masada en 1963–1965, y el palacio del promontorio de Cesarea fue excavado primero por Netzer y Lee Levine en 1976 y más a fondo en la década de 1990. Del palacio de Jerusalén solo sobrevive su plataforma, bajo la Ciudadela y el Jardín Armenio; la base de una torre, Fasael o Hípico, es la «Torre de David». Herodes tomó Jerusalén en 37 a. C. y murió hacia el 4 a. C.; el palacio se fecha hacia el 23 a. C."
  pt:
    - "Herodes, o Grande, construiu palácios por todo o seu reino. Em Jerusalém, seu palácio ficava na colina ocidental, junto às três torres Hípico, Fasael e Mariamne, onde hoje está a Cidadela, junto à Porta de Jafa; em Cesareia, um palácio avançava sobre um promontório no mar; em Jericó, ele ampliou os palácios de inverno asmoneus na foz do Wadi Qelt, onde morreu; em Herodium, a 12 km ao sul de Jerusalém e 5 km de Belém, ergueu um palácio-fortaleza numa colina que ele mandara elevar e foi sepultado ali; Massada, acima do mar Morto, tinha seus palácios norte e oeste, e Maqueronte, a leste do mar, Cypros, acima de Jericó, Alexandreion e Hircânia eram fortalezas com palácios. Josefo é a fonte para a maioria deles, e quase todos foram escavados."
    - "O Novo Testamento encontra esses edifícios sem nomear Herodes. Os governadores romanos, que moravam em Cesareia, usavam seu palácio em Jerusalém quando subiam para as festas, e a maioria dos estudiosos situa ali o pretório da Paixão, onde “Os soldados o levaram para dentro do pátio, que é o Pretório; e reuniram toda a coorte”, e não na Antônia da tradição da Via Dolorosa; Fílon conta como Pilatos pendurou escudos dourados no palácio de Herodes. Herodes Antipas, “que também estava em Jerusalém naqueles dias”, provavelmente se hospedou no antigo palácio asmoneu. Paulo, em Cesareia, foi mandado ficar “guardado no palácio de Herodes”, o palácio do promontório, e Agripa I, depois da fuga de Pedro, “desceu da Judeia para Cesareia e ali permaneceu”, e morreu lá."
    - "Ehud Netzer escavou os edifícios de Herodes por quase quarenta anos: os palácios de Jericó a partir de 1973, Herodium a partir de 1972, e em 2007 encontrou na encosta da colina o mausoléu e o sarcófago despedaçado que identificou como o túmulo de Herodes, afirmação que alguns questionaram. Yigael Yadin trouxe Massada à luz em 1963–1965, e o palácio do promontório em Cesareia foi escavado primeiro por Netzer e Lee Levine em 1976 e mais nos anos 1990. Do palácio de Jerusalém sobrevive apenas a plataforma, sob a Cidadela e o Jardim Armênio; a base de uma torre, Fasael ou Hípico, é a “Torre de Davi”. Herodes tomou Jerusalém em 37 a.C. e morreu por volta de 4 a.C.; o palácio é datado de cerca de 23 a.C."
  de:
    - "Herodes der Große baute Paläste in seinem ganzen Reich. In Jerusalem stand sein Palast auf dem Westhügel bei den drei Türmen Hippikus, Phasael und Mariamne, wo heute die Zitadelle am Jaffator steht; in Caesarea lief ein Palast auf einer Landzunge ins Meer hinaus; in Jericho erweiterte er die hasmonäischen Winterpaläste an der Mündung des Wadi Qelt, wo er starb; im Herodeion, 12 km südlich von Jerusalem und 5 km von Bethlehem, errichtete er eine Palastfestung auf einem von ihm höher aufgeschütteten Hügel und wurde dort begraben; Masada über dem Toten Meer hatte seine Nord- und Westpaläste, und Machärus östlich des Meeres, Kypros über Jericho, Alexandreion und Hyrkania waren Festungen mit Palästen. Josephus ist die Quelle für die meisten, und fast alle sind ausgegraben."
    - "Das Neue Testament begegnet diesen Bauten, ohne Herodes zu nennen. Die römischen Statthalter, die in Caesarea residierten, nutzten seinen Jerusalemer Palast, wenn sie zu den Festen heraufkamen, und die meisten Gelehrten setzen dorthin das Prätorium der Passion, wo es heißt: „Die Kriegsknechte aber führten ihn hinein in das Richthaus und riefen zusammen die ganze Schar“, statt an die Antonia der Tradition der Via Dolorosa; Philo erzählt, wie Pilatus vergoldete Schilde in Herodes’ Palast aufhängte. Herodes Antipas, „welcher in den Tagen auch zu Jerusalem war“, wohnte wahrscheinlich im alten hasmonäischen Palast. In Caesarea ließ der Statthalter den Paulus „verwahren in dem Richthause des Herodes“, im Palast auf der Landzunge, und Agrippa I. „zog von Judäa hinab gen Cäsarea und hielt allda sein Wesen“ nach der Flucht des Petrus und starb dort."
    - "Ehud Netzer grub fast vierzig Jahre an Herodes’ Bauten: die Paläste von Jericho seit 1973, das Herodeion seit 1972, und 2007 fand er am Hang des Hügels das Mausoleum und den zertrümmerten Sarkophag, die er als Herodes’ Grab identifizierte, was manche bezweifelt haben. Yigael Yadin legte Masada 1963–1965 frei, und den Landzungenpalast in Caesarea grub zuerst 1976 Netzer mit Lee Levine, weiter in den 1990er-Jahren. Vom Jerusalemer Palast ist nur die Plattform erhalten, unter der Zitadelle und dem Armenischen Garten; der Sockel eines Turmes, Phasael oder Hippikus, ist der „Davidsturm“. Herodes nahm Jerusalem 37 v. Chr. ein und starb um 4 v. Chr.; der Palast wird auf etwa 23 v. Chr. datiert."
  fr:
    - "Hérode le Grand bâtit des palais dans tout son royaume. À Jérusalem, son palais se dressait sur la colline occidentale, près des trois tours Hippicus, Phasaël et Mariamne, là où se trouve aujourd’hui la Citadelle près de la porte de Jaffa ; à Césarée, un palais s’avançait sur un promontoire dans la mer ; à Jéricho, il agrandit les palais d’hiver hasmonéens à l’embouchure du Wadi Qelt, où il mourut ; à l’Hérodion, à 12 km au sud de Jérusalem et à 5 km de Bethléem, il éleva un palais-forteresse sur une colline qu’il avait exhaussée, et y fut enterré ; Massada, au-dessus de la mer Morte, avait ses palais du nord et de l’ouest, et Machéronte à l’est de la mer, Cypros au-dessus de Jéricho, Alexandrion et Hyrcania étaient des forteresses dotées de palais. Flavius Josèphe est la source de la plupart d’entre eux, et presque tous ont été fouillés."
    - "Le Nouveau Testament rencontre ces bâtiments sans nommer Hérode. Les gouverneurs romains, qui résidaient à Césarée, utilisaient son palais de Jérusalem quand ils montaient pour les fêtes, et la plupart des spécialistes y placent aujourd’hui le prétoire de la Passion, où « Les soldats conduisirent Jésus dans l’intérieur de la cour, c’est-à-dire, dans le prétoire, et ils assemblèrent toute la cohorte », plutôt qu’à l’Antonia de la Via Dolorosa ; Philon raconte comment Pilate fit suspendre des boucliers dorés dans le palais d’Hérode. Hérode Antipas, « qui se trouvait aussi à Jérusalem en ces jours-là », logeait probablement dans l’ancien palais hasmonéen. Paul, à Césarée, reçut l’ordre d’être gardé « dans le prétoire d’Hérode », le palais du promontoire, et Agrippa Ier, après l’évasion de Pierre, « descendit de la Judée à Césarée, pour y séjourner », et y mourut."
    - "Éhud Netzer fouilla les bâtiments d’Hérode pendant près de quarante ans : les palais de Jéricho à partir de 1973, l’Hérodion à partir de 1972, et en 2007 il trouva sur la pente de la colline le mausolée et le sarcophage brisé qu’il identifia comme le tombeau d’Hérode, affirmation que certains ont mise en doute. Yigaël Yadin dégagea Massada en 1963-1965, et le palais du promontoire de Césarée fut d’abord fouillé par Netzer et Lee Levine en 1976, puis davantage dans les années 1990. Du palais de Jérusalem, seule subsiste la plate-forme, sous la Citadelle et le Jardin arménien ; la base d’une tour, Phasaël ou Hippicus, est la « Tour de David ». Hérode prit Jérusalem en 37 av. J.-C. et mourut vers 4 av. J.-C. ; le palais est daté d’environ 23 av. J.-C."
  pl:
    - "Herod Wielki budował pałace w całym swoim królestwie. W Jerozolimie jego pałac stał na zachodnim wzgórzu przy trzech wieżach Hippikos, Fasael i Mariamne, gdzie dziś stoi Cytadela przy Bramie Jafskiej; w Cezarei pałac wybiegał na cyplu w morze; w Jerychu rozbudował hasmonejskie pałace zimowe u ujścia Wadi Qelt, gdzie zmarł; w Herodionie, 12 km na południe od Jerozolimy i 5 km od Betlejem, wzniósł pałac-twierdzę na wzgórzu, które sam podwyższył, i tam został pochowany; Masada nad Morzem Martwym miała jego pałace północny i zachodni, a Macheront na wschód od morza, Kypros nad Jerychem, Aleksandrion i Hirkania były twierdzami z pałacami. Józef Flawiusz jest źródłem większości z nich, a niemal wszystkie zostały odkopane."
    - "Nowy Testament spotyka te budowle, nie wymieniając Heroda. Rzymscy namiestnicy, którzy mieszkali w Cezarei, korzystali z jego pałacu w Jerozolimie, gdy przybywali na święta, i większość uczonych umieszcza tam dziś pretorium Męki Pańskiej, gdzie „żołnierze wprowadzili go do dworu, to jest do ratusza, i zwołali wszystkiej roty”, a nie w Antonii z tradycji Via Dolorosa; Filon opowiada, jak Piłat zawiesił pozłacane tarcze w pałacu Heroda. Herod Antypas, „który też w Jeruzalemie był w one dni”, przebywał zapewne w starym pałacu hasmonejskim. Paweł w Cezarei miał być strzeżony: „rozkazał go strzec na ratuszu Herodowym”, w pałacu na cyplu, a Agryppa I, po ucieczce Piotra, „wyjechawszy z Judzkiej ziemi do Cezaryi, mieszkał tam”, i tam zmarł."
    - "Ehud Netzer badał budowle Heroda przez prawie czterdzieści lat: pałace w Jerychu od 1973, Herodion od 1972, a w 2007 znalazł na zboczu wzgórza mauzoleum i rozbity sarkofag, które zidentyfikował jako grób Heroda, co niektórzy kwestionowali. Jigael Jadin odsłonił Masadę w latach 1963–1965, a pałac na cyplu w Cezarei po raz pierwszy kopali Netzer i Lee Levine w 1976 i dalej w latach 90. Z pałacu jerozolimskiego przetrwała tylko jego platforma, pod Cytadelą i Ogrodem Ormiańskim; podstawa jednej z wież, Fasaela lub Hippikosa, to „Wieża Dawida”. Herod zdobył Jerozolimę w 37 p.n.e. i zmarł około 4 p.n.e.; pałac datuje się na około 23 p.n.e."
  it:
    - "Erode il Grande costruì palazzi in tutto il suo regno. A Gerusalemme il suo palazzo sorgeva sul colle occidentale presso le tre torri Ippico, Fasael e Mariamne, dove ora sorge la Cittadella presso la Porta di Giaffa; a Cesarea un palazzo si protendeva su un promontorio nel mare; a Gerico ampliò i palazzi invernali asmonei alla foce del Wadi Qelt, dove morì; a Erodio, a 12 km a sud di Gerusalemme e 5 km da Betlemme, innalzò un palazzo-fortezza su un colle che aveva fatto innalzare ancora di più, e vi fu sepolto; Masada sopra il Mar Morto aveva i suoi palazzi settentrionale e occidentale, e Macheronte a est del mare, Cypros sopra Gerico, Alessandrio e Ircania erano fortezze con palazzi. Giuseppe Flavio è la fonte per la maggior parte di essi, e quasi tutti sono stati scavati."
    - "Il Nuovo Testamento incontra questi edifici senza nominare Erode. I governatori romani, che vivevano a Cesarea, usavano il suo palazzo di Gerusalemme quando salivano per le feste, e la maggior parte degli studiosi vi colloca oggi il pretorio della Passione, dove «i soldati lo menarono dentro la corte che è il Pretorio, e radunarono tutta la coorte», anziché all’Antonia della tradizione della Via Dolorosa; Filone racconta come Pilato appese scudi dorati nel palazzo di Erode. Erode Antipa, «ch’era anch’egli a Gerusalemme in que’ giorni», probabilmente alloggiò nel vecchio palazzo asmoneo. A Paolo a Cesarea fu ordinato che «fosse custodito nel palazzo d’Erode», il palazzo sul promontorio, e Agrippa I, dopo la fuga di Pietro, «sceso di Giudea a Cesarea, vi si trattenne», e vi morì."
    - "Ehud Netzer scavò gli edifici di Erode per quasi quarant’anni: i palazzi di Gerico dal 1973, Erodio dal 1972, e nel 2007 trovò sul pendio del colle il mausoleo e il sarcofago in frantumi che identificò come la tomba di Erode, un’affermazione che alcuni hanno messo in dubbio. Yigael Yadin portò alla luce Masada nel 1963–1965, e il palazzo sul promontorio di Cesarea fu scavato per la prima volta da Netzer e Lee Levine nel 1976 e ulteriormente negli anni 1990. Del palazzo di Gerusalemme sopravvive solo la piattaforma, sotto la Cittadella e il Giardino Armeno; la base di una torre, Fasael o Ippico, è la «Torre di Davide». Erode prese Gerusalemme nel 37 a.C. e morì verso il 4 a.C.; il palazzo si data al 23 a.C. circa."
  cs:
    - "Herodes Veliký stavěl paláce po celém svém království. V Jeruzalémě stál jeho palác na západním pahorku u tří věží Hippika, Fasaela a Mariamné, kde nyní stojí Citadela u Jaffské brány; v Cesareji vybíhal palác na výběžku do moře; v Jerichu rozšířil hasmoneovské zimní paláce u ústí Wádí Qelt, kde zemřel; v Herodeiu, 12 km jižně od Jeruzaléma a 5 km od Betléma, vztyčil palácovou pevnost na pahorku, který nechal navršit výš, a byl tam pohřben; Masada nad Mrtvým mořem měla jeho severní a západní palác a Machairús východně od moře, Kypros nad Jerichem, Alexandreion a Hyrkánie byly pevnosti s paláci. Josephus je zdrojem většiny z nich a téměř všechny byly vykopány."
    - "Nový zákon se s těmito budovami setkává, aniž by Heroda jmenoval. Římští místodržitelé, kteří sídlili v Cesareji, užívali jeho jeruzalémský palác, když přicházeli na svátky, a většina badatelů tam dnes klade praetorium umučení, kam „Žoldnéři pak uvedli jej vnitř do síně, do radného domu, a svolali všecku sběř“, spíše než do Antonie podle tradice Via Dolorosa; Filón vypráví, jak Pilát zavěsil pozlacené štíty v Herodově paláci. Herodes Antipas, „kterýž také v Jeruzalémě byl v ty dni“, pravděpodobně bydlel ve starém hasmoneovském paláci. Pavlovi bylo v Cesareji nařízeno, aby byl ostříhán „v domě Herodesově“, tedy v paláci na výběžku, a Agrippa I. po Petrově útěku „odebrav se z Judstva do Cesaree, přebýval tam“ a tam zemřel."
    - "Ehud Netzer kopal Herodovy stavby téměř čtyřicet let: paláce v Jerichu od roku 1973, Herodeion od roku 1972 a roku 2007 nalezl na svahu pahorku mauzoleum a rozbitý sarkofág, které označil za Herodův hrob, což někteří zpochybnili. Jigael Jadin odkryl Masadu v letech 1963–1965 a palác na výběžku v Cesareji nejprve kopali Netzer a Lee Levine roku 1976 a dále v 90. letech. Z jeruzalémského paláce se zachovala jen jeho plošina, pod Citadelou a Arménskou zahradou; základ jedné věže, Fasaela nebo Hippika, je „Davidova věž“. Herodes dobyl Jeruzalém roku 37 př. n. l. a zemřel kolem roku 4 př. n. l.; palác se datuje zhruba do roku 23 př. n. l."
  nl:
    - "Herodes de Grote bouwde paleizen door heel zijn koninkrijk. In Jeruzalem stond zijn paleis op de westelijke heuvel bij de drie torens Hippicus, Phasaël en Mariamme, waar nu de Citadel bij de Jaffapoort staat; te Caesarea liep een paleis op een landtong de zee in; bij Jericho breidde hij de Hasmoneese winterpaleizen uit bij de monding van de Wadi Qelt, waar hij stierf; bij Herodium, 12 km ten zuiden van Jeruzalem en 5 km van Bethlehem, bouwde hij een paleisvesting op een heuvel die hij hoger had opgehoogd, en werd er begraven; Masada boven de Dode Zee had zijn noordelijke en westelijke paleizen, en Machaerus ten oosten van de zee, Cypros boven Jericho, Alexandrium en Hyrcania waren vestingen met paleizen. Josephus is de bron voor de meeste ervan, en bijna alle zijn opgegraven."
    - "Het Nieuwe Testament komt deze gebouwen tegen zonder Herodes te noemen. De Romeinse stadhouders, die in Caesarea woonden, gebruikten zijn paleis in Jeruzalem wanneer zij voor de feesten opkwamen, en de meeste geleerden plaatsen daar nu het praetorium van het lijdensverhaal, waar “de krijgsknechten leidden Hem binnen in de zaal, welke is het rechthuis, en riepen de ganse bende samen”, in plaats van bij de Antonia van de overlevering van de Via Dolorosa; Philo vertelt hoe Pilatus vergulde schilden in het paleis van Herodes ophing. Herodes Antipas, “die ook zelf in die dagen binnen Jeruzalem was”, verbleef waarschijnlijk in het oude Hasmoneese paleis. Paulus werd te Caesarea bevolen te worden bewaard “in het rechthuis van Herodes”, het paleis op de landtong, en Agrippa I, na de ontsnapping van Petrus, “vertrok van Judea naar Cesarea, en hield zich aldaar”, en stierf er."
    - "Ehud Netzer groef bijna veertig jaar aan Herodes' bouwwerken: de paleizen van Jericho vanaf 1973, Herodium vanaf 1972, en in 2007 vond hij op de helling van de heuvel het mausoleum en de verbrijzelde sarcofaag die hij als het graf van Herodes identificeerde, een bewering die sommigen in twijfel hebben getrokken. Yigael Yadin legde Masada in 1963–1965 bloot, en het paleis op de landtong bij Caesarea werd in 1976 voor het eerst opgegraven door Netzer en Lee Levine en verder in de jaren negentig. Van het paleis in Jeruzalem is alleen het platform bewaard, onder de Citadel en de Armeense Tuin; de basis van een toren, Phasaël of Hippicus, is de “Toren van David”. Herodes nam Jeruzalem in 37 v.Chr. in en stierf omstreeks 4 v.Chr.; het paleis wordt gedateerd rond 23 v.Chr."
  sv:
    - "Herodes den store byggde palats över hela sitt rike. I Jerusalem stod hans palats på västra kullen vid de tre tornen Hippicus, Phasael och Mariamne, där Citadellet vid Jaffaporten nu står; i Caesarea sköt ett palats ut på en udde i havet; i Jeriko utvidgade han de hasmoneiska vinterpalatsen vid mynningen av Wadi Qelt, där han dog; vid Herodion, 12 km söder om Jerusalem och 5 km från Betlehem, reste han en palatsfästning på en kulle som han hade höjt ytterligare, och han begravdes där; Masada ovanför Döda havet hade hans norra och västra palats, och Machaerus öster om havet, Kypros ovanför Jeriko, Alexandreion och Hyrkania var fästningar med palats. Josefus är källan till de flesta av dem, och nästan alla har grävts ut."
    - "Nya testamentet möter dessa byggnader utan att nämna Herodes. De romerska ståthållarna, som bodde i Caesarea, använde hans palats i Jerusalem när de kom upp till högtiderna, och de flesta forskare förlägger nu passionens pretorium dit, där ”krigsmännen förde honom in i palatset, eller pretoriet, och kallade tillhopa hela den romerska vakten”, snarare än till Antonia enligt Via Dolorosa-traditionen; Filon berättar hur Pilatus hängde upp förgyllda sköldar i Herodes’ palats. Herodes Antipas, som då också var i Jerusalem, bodde sannolikt i det gamla hasmoneiska palatset. Paulus i Caesarea beordrades att ”förvara honom i Herodes’ borg”, uddepalatset, och Agrippa I, efter Petrus’ flykt, ”for ned från Judeen till Cesarea och vistades sedan där”, och dog där."
    - "Ehud Netzer grävde Herodes’ byggnader i nästan fyrtio år: palatsen i Jeriko från 1973, Herodion från 1972, och 2007 fann han på kullens sluttning mausoleet och den krossade sarkofagen som han identifierade som Herodes’ grav, ett påstående som vissa har ifrågasatt. Yigael Yadin avtäckte Masada 1963–1965, och uddepalatset i Caesarea grävdes först av Netzer och Lee Levine 1976 och vidare på 1990-talet. Av Jerusalempalatset finns bara dess plattform kvar, under Citadellet och Armeniska trädgården; basen av ett torn, Phasael eller Hippicus, är ”Davids torn”. Herodes intog Jerusalem 37 f.Kr. och dog omkring 4 f.Kr.; palatset dateras till omkring 23 f.Kr."
