id: who-were-the-nabataeans
question:
  en: "Who were the Nabataeans?"
  ru: "Кто такие набатеи?"
  uk: "Хто були набатеї?"
  es: "¿Quiénes eran los nabateos?"
  pt: "Quem eram os nabateus?"
  de: "Wer waren die Nabatäer?"
  fr: "Qui étaient les Nabatéens ?"
  pl: "Kim byli Nabatejczycy?"
  it: "Chi erano i Nabatei?"
  cs: "Kdo byli Nabatejci?"
  nl: "Wie waren de Nabateeërs?"
  sv: "Vilka var nabateerna?"
  nb: "Hvem var nabateerne?"
  tl: "Sino ang mga Nabateo?"
  da: "Hvem var nabatæerne?"
  sr: "Ко су били Набатејци?"
  hu: "Kik voltak a nabateusok?"
  fi: "Keitä nabatealaiset olivat?"
  vi: "Người Nabataea là ai?"
  ro: "Cine erau nabateenii?"
  bg: "Кои са били набатейците?"
answer:
  en:
    - "The Nabataeans were an Arab people who, from about the fourth century BC, held the old highlands of Edom south of the Dead Sea and the caravan roads of the desert, with Petra, cut into the sandstone of today's southern Jordan, as their capital. The map's point for Paul's Arabia stands in their country, about 190 km south of Jerusalem in a straight line, with Petra 30 km to its north. The Bible names them directly only in 1 Maccabees, and once through their king: in Damascus “the governor under Aretas the king kept the city of the Damascenes with a garrison, desirous to apprehend me”, Paul writes, and he was let down the wall in a basket."
    - "They enter history in 312 BC, when the generals of Antigonus, Athenaeus and then Demetrius, raided “the rock”. Diodorus, drawing on an eyewitness, describes nomads who planted no grain, built no house and drank no wine, who carried frankincense and myrrh from southern Arabia and gathered bitumen from the Dead Sea. Judas and Jonathan Maccabeus met them as friends in the 160s BC. Within two centuries they had a kingdom from Hegra in the Hejaz to the Hauran, a script of their own, and towns in the Negev, Avdat among them; Aretas III held Damascus about 85–72 BC."
    - "Aretas IV (9 BC–AD 40) was the king of Paul's day. Herod Antipas had married his daughter and put her away for Herodias, the marriage John the Baptist condemned; in AD 36 Aretas destroyed Antipas's army, and many Jews, Josephus says, saw in it God's punishment for John. When Paul “went into Arabia, and returned again unto Damascus”, it was into this kingdom. How Aretas's governor came to be in a Roman city is debated: some think Caligula ceded Damascus to him about AD 37, others that an ethnarch headed the Nabataean colony there."
    - "The last king, Rabbel II, moved his court to Bostra, and in AD 106 Trajan made the kingdom the Roman province of Arabia. Petra went on as a city of the province; its tombs and temples, the Khazneh, the theatre and the Deir, belong mostly to the century on either side of Christ, and Johann Ludwig Burckhardt found the site again in 1812. The Nabataean form of Aramaic script became the ancestor of Arabic writing. Petra has been a World Heritage Site since 1985, and the tombs of Hegra, Mada'in Salih in Saudi Arabia, since 2008. A link with Nebaioth, the firstborn of Ishmael whose rams Isaiah sees brought to the altar, has often been proposed, but most scholars doubt it: the two names are spelt with different consonants."
  ru:
    - "Набатеи — арабский народ, который примерно с IV века до н. э. владел старым нагорьем Едома к югу от Мёртвого моря и караванными дорогами пустыни; их столицей была Петра, вырубленная в песчанике нынешней южной Иордании. Точка карты для Аравии Павла стоит в их стране, примерно в 190 км к югу от Иерусалима по прямой, а Петра — в 30 км к северу от неё. Прямо их называет только Первая книга Маккавейская, а ещё раз Библия упоминает их через их царя: «В Дамаске областной правитель царя Ареты стерег город Дамаск, чтобы схватить меня», пишет Павел, и его спустили со стены в корзине."
    - "В историю они входят в 312 г. до н. э., когда полководцы Антигона, сначала Афиней, потом Деметрий, напали на «скалу». Диодор, опираясь на очевидца, описывает кочевников, которые не сеяли хлеба, не строили домов и не пили вина, возили ладан и мирру из южной Аравии и собирали асфальт с Мёртвого моря. Иуда и Ионафан Маккавеи встречали их как друзей в 160-х годах до н. э. За два века у них появились царство от Хегры в Хиджазе до Хаурана, собственное письмо и города в Негеве, среди них Авдат; Арета III держал Дамаск около 85–72 гг. до н. э."
    - "Арета IV (9 г. до н. э. — 40 г. н. э.) был царём во дни Павла. Ирод Антипа женился на его дочери и отослал её ради Иродиады — за этот брак обличал его Иоанн Креститель; в 36 г. Арета уничтожил войско Антипы, и многие иудеи, пишет Иосиф Флавий, увидели в этом Божью кару за Иоанна. Когда Павел «пошел в Аравию и опять возвратился в Дамаск», он ходил в это царство. Как правитель Ареты оказался в римском городе, спорят: одни думают, что Калигула уступил ему Дамаск около 37 г., другие — что этнарх возглавлял набатейскую общину города."
    - "Последний царь, Раббэль II, перенёс двор в Бостру, а в 106 г. н. э. Траян обратил царство в римскую провинцию Аравия. Петра осталась городом провинции; её гробницы и храмы — Эль-Хазне, театр, Эд-Дейр — созданы большей частью в столетие по обе стороны от Рождества Христова, и в 1812 году Иоганн Людвиг Буркхардт вновь нашёл это место. Набатейская разновидность арамейского письма стала предком арабской письменности. Петра — объект Всемирного наследия с 1985 года, гробницы Хегры, Мадаин-Салиха в Саудовской Аравии, — с 2008-го. Связь с Наваиофом, первенцем Измаила, чьих овнов Исаия видит приведёнными к жертвеннику, предлагали не раз, но большинство учёных сомневается: два имени пишутся разными согласными."
  uk:
    - "Набатеї були арабським народом, який приблизно від IV ст. до н. е. тримав давнє нагір'я Едому на південь від Мертвого моря та караванні шляхи пустелі, зі столицею Петрою, вирізаною в пісковику нинішньої південної Йорданії. Точка Павлової Аравії на мапі стоїть у їхньому краї, приблизно за 190 км на південь від Єрусалима по прямій, з Петрою за 30 км на північ від неї. Біблія називає їх напряму лише в Першій книзі Макавеїв, а також один раз через їхнього царя: у Дамаску «царський намістник Арета, стеріг город Дамащан, хотївши піймати мене», пише Павло, і його спустили по мурі в коші."
    - "Вони входять в історію 312 р. до н. е., коли воєначальники Антігона — Афіней, а потім Димитрій — напали на «скелю». Діодор, спираючись на очевидця, описує кочівників, які не сіяли хліба, не будували будинків і не пили вина, що возили ладан і смирну з південної Аравії й збирали бітум з Мертвого моря. Юда та Йонатан Макавеї зустрічали їх як друзів у 160-х рр. до н. е. За два століття вони мали царство від Хегри в Хіджазі до Хаврана, власне письмо й міста в Негеві, серед них Авдат; Арета III тримав Дамаск близько 85–72 рр. до н. е."
    - "Арета IV (9 р. до н. е.–40 р. н. е.) був царем за Павла. Ірод Антипа одружився з його дочкою й відіслав її заради Іродіади — шлюб, який засуджував Іван Хреститель; 36 р. н. е. Арета знищив військо Антипи, і багато юдеїв, каже Йосиф Флавій, бачили в цьому Божу кару за Івана. Коли Павло «пійшов у Аравию, та й знов вернувсь у Дамаск», це було в цьому царстві. Як намісник Арети опинився в римському місті — обговорюють: дехто вважає, що Калігула поступився йому Дамаском близько 37 р. н. е., інші — що етнарх очолював там набатейську колонію."
    - "Останній цар, Раббель II, переніс свій двір до Бостри, і 106 р. н. е. Траян зробив царство римською провінцією Аравія. Петра продовжувала жити як місто провінції; її гробниці й храми, Ель-Хазне, театр і Ед-Дейр, належать здебільшого до століття по обидва боки від Христа, а Йоганн Людвіг Буркгардт віднайшов місце 1812 р. Набатейська форма арамейського письма стала предком арабського письма. Петра є об'єктом Всесвітньої спадщини від 1985 р., а гробниці Хегри, Мадаїн-Саліх у Саудівській Аравії, — від 2008 р. Зв'язок з Наваїофом, первістком Ізмаїла, чиїх баранів Ісая бачить принесеними до жертовника, часто пропонували, але більшість учених сумніваються: ці два імена пишуться різними приголосними."
  es:
    - "Los nabateos eran un pueblo árabe que, desde aproximadamente el siglo IV a. C., ocupó las antiguas tierras altas de Edom al sur del mar Muerto y las rutas de caravanas del desierto, con Petra, excavada en la arenisca del actual sur de Jordania, como capital. El punto del mapa para la Arabia de Pablo está en su país, a unos 190 km al sur de Jerusalén en línea recta, con Petra a 30 km al norte. La Biblia los nombra directamente solo en 1 Macabeos, y una vez a través de su rey: en Damasco, escribe Pablo, «el gobernador de la provincia del rey Aretas guardaba la ciudad de los Damascenos para prenderme», y fue descolgado del muro en un serón."
    - "Entran en la historia en 312 a. C., cuando los generales de Antígono, Atenaio y luego Demetrio, atacaron «la roca». Diodoro, que se basa en un testigo ocular, describe nómadas que no sembraban grano, no construían casas y no bebían vino, que transportaban incienso y mirra desde el sur de Arabia y recogían betún del mar Muerto. Judas y Jonatán Macabeo los trataron como amigos en la década del 160 a. C. En dos siglos tuvieron un reino desde Hegra, en el Hiyaz, hasta el Haurán, una escritura propia y ciudades en el Négueb, entre ellas Avdat; Aretas III tuvo Damasco hacia 85–72 a. C."
    - "Aretas IV (9 a. C.–40 d. C.) fue el rey de los días de Pablo. Herodes Antipas se había casado con su hija y la repudió por Herodías, el matrimonio que condenó Juan el Bautista; en el 36 d. C. Aretas destruyó el ejército de Antipas, y muchos judíos, dice Josefo, vieron en ello el castigo de Dios por Juan. Cuando Pablo escribe: «me fuí á la Arabia, y volví de nuevo á Damasco», se refiere a este reino. Cómo llegó el gobernador de Aretas a una ciudad romana se discute: unos piensan que Calígula le cedió Damasco hacia el 37 d. C., otros que un etnarca presidía la colonia nabatea allí."
    - "El último rey, Rabel II, trasladó su corte a Bosra, y en el 106 d. C. Trajano convirtió el reino en la provincia romana de Arabia. Petra siguió como ciudad de la provincia; sus tumbas y templos, el Khazneh, el teatro y el Deir, pertenecen en su mayoría a los cien años anteriores y posteriores a Cristo, y Johann Ludwig Burckhardt volvió a encontrar el sitio en 1812. La forma nabatea de la escritura aramea fue el antepasado de la escritura árabe. Petra es Patrimonio de la Humanidad desde 1985, y las tumbas de Hegra, Mada'in Salih, en Arabia Saudí, desde 2008. A menudo se ha propuesto un vínculo con Nebaiot, el primogénito de Ismael, cuyos carneros ve Isaías llevados al altar, pero la mayoría de los estudiosos lo dudan: los dos nombres se escriben con consonantes distintas."
  pt:
    - "Os nabateus eram um povo árabe que, desde cerca do século IV a.C., ocupou as antigas terras altas de Edom ao sul do mar Morto e as rotas de caravanas do deserto, com Petra, esculpida no arenito do atual sul da Jordânia, como capital. O ponto do mapa para a Arábia de Paulo fica em seu país, a cerca de 190 km ao sul de Jerusalém em linha reta, com Petra a 30 km ao norte dele. A Bíblia os nomeia diretamente apenas em 1 Macabeus, e uma vez por meio de seu rei: em Damasco, “o governador sob o rei Aretas guardava a cidade de Damasco, desejando me prender”, escreve Paulo, e ele foi descido pela muralha num cesto."
    - "Entram na história em 312 a.C., quando os generais de Antígono, Ateneu e depois Demétrio, atacaram “a rocha”. Diodoro, apoiado numa testemunha ocular, descreve nômades que não semeavam grão, não construíam casa e não bebiam vinho, que levavam incenso e mirra do sul da Arábia e colhiam betume do mar Morto. Judas e Jônatas Macabeu os encontraram como amigos na década de 160 a.C. Em dois séculos tinham um reino de Hegra, no Hejaz, ao Haurã, uma escrita própria e cidades no Neguebe, entre elas Avdat; Aretas III ocupou Damasco por volta de 85–72 a.C."
    - "Aretas IV (9 a.C.–40 d.C.) era o rei do tempo de Paulo. Herodes Antipas casara-se com a filha dele e a repudiara por causa de Herodias, o casamento que João Batista condenou; em 36 d.C., Aretas destruiu o exército de Antipas, e muitos judeus, diz Josefo, viram nisso o castigo de Deus por João. Quando Paulo diz “parti para a Arábia. Depois, retornei a Damasco”, foi para esse reino. Como o governador de Aretas veio a estar numa cidade romana é debatido: alguns pensam que Calígula lhe cedeu Damasco por volta de 37 d.C., outros que um etnarca chefiava ali a colônia nabateia."
    - "O último rei, Rabel II, transferiu a corte para Bostra, e em 106 d.C. Trajano fez do reino a província romana da Arábia. Petra continuou como cidade da província; seus túmulos e templos, o Khazneh, o teatro e o Deir, pertencem em sua maioria ao século anterior e posterior a Cristo, e Johann Ludwig Burckhardt reencontrou o sítio em 1812. A forma nabateia da escrita aramaica tornou-se a antepassada da escrita árabe. Petra é Patrimônio Mundial desde 1985, e os túmulos de Hegra, Mada'in Salih, na Arábia Saudita, desde 2008. Uma ligação com Nebaiote, o primogênito de Ismael, cujos carneiros Isaías vê levados ao altar, foi muitas vezes proposta, mas a maioria dos estudiosos duvida: os dois nomes são escritos com consoantes diferentes."
  de:
    - "Die Nabatäer waren ein arabisches Volk, das ab etwa dem 4. Jahrhundert v. Chr. das alte Hochland von Edom südlich des Toten Meeres und die Karawanenstraßen der Wüste beherrschte, mit Petra, in den Sandstein des heutigen Südjordaniens gehauen, als Hauptstadt. Der Kartenpunkt für Paulus’ Arabien steht in ihrem Land, in der Luftlinie etwa 190 km südlich von Jerusalem, mit Petra 30 km nördlich davon. Die Bibel nennt sie nur im Ersten Buch der Makkabäer unmittelbar und einmal durch ihren König: In Damaskus „verwahrte der Landpfleger des Königs Aretas die Stadt der Damasker und wollte mich greifen“, schreibt Paulus, und er wurde in einem Korb die Mauer hinabgelassen."
    - "In die Geschichte treten sie 312 v. Chr. ein, als die Feldherren des Antigonos, Athenaios und dann Demetrios, „den Felsen“ überfielen. Diodor, der sich auf einen Augenzeugen stützt, beschreibt Nomaden, die kein Getreide säten, kein Haus bauten und keinen Wein tranken, die Weihrauch und Myrrhe aus Südarabien trugen und Erdpech vom Toten Meer sammelten. Judas und Jonatan Makkabäus begegneten ihnen in den 160er-Jahren v. Chr. als Freunden. Binnen zwei Jahrhunderten hatten sie ein Königreich von Hegra im Hedschas bis zum Hauran, eine eigene Schrift und Städte im Negev, darunter Avdat; Aretas III. hielt Damaskus um 85–72 v. Chr."
    - "Aretas IV. (9 v. Chr.–40 n. Chr.) war der König zu Paulus’ Zeit. Herodes Antipas hatte seine Tochter geheiratet und sie für Herodias verstoßen, die Ehe, die Johannes der Täufer verurteilte; im Jahr 36 n. Chr. vernichtete Aretas das Heer des Antipas, und viele Juden sahen darin nach Josephus Gottes Strafe für Johannes. Von Paulus heißt es, er „zog hin nach Arabien und kam wiederum gen Damaskus“; gemeint ist dieses Königreich. Wie Aretas’ Statthalter in eine römische Stadt kam, ist umstritten: Manche meinen, Caligula habe ihm Damaskus um 37 n. Chr. überlassen, andere, ein Ethnarch habe die nabatäische Kolonie dort geleitet."
    - "Der letzte König, Rabbel II., verlegte seinen Hof nach Bostra, und 106 n. Chr. machte Trajan das Königreich zur römischen Provinz Arabia. Petra bestand als Stadt der Provinz fort; seine Gräber und Tempel, das Schatzhaus Chasne, das Theater und das Deir, gehören meist in das Jahrhundert vor und nach Christus, und Johann Ludwig Burckhardt fand die Stätte 1812 wieder. Die nabatäische Form der aramäischen Schrift wurde zur Ahnin der arabischen Schrift. Petra ist seit 1985 Welterbestätte, die Gräber von Hegra, Mada’in Salih in Saudi-Arabien, seit 2008. Eine Verbindung mit Nebajot, dem Erstgeborenen Ismaels, dessen Widder Jesaja zum Altar gebracht sieht, wurde oft vorgeschlagen, doch die meisten Gelehrten zweifeln: Die beiden Namen werden mit verschiedenen Konsonanten geschrieben."
  fr:
    - "Les Nabatéens étaient un peuple arabe qui, à partir d’environ le IVe siècle av. J.-C., tint les anciennes hautes terres d’Édom, au sud de la mer Morte, et les routes caravanières du désert, avec Pétra, taillée dans le grès de l’actuel sud de la Jordanie, pour capitale. Le point de la carte pour l’Arabie de Paul se trouve dans leur pays, à environ 190 km au sud de Jérusalem à vol d’oiseau, Pétra étant à 30 km au nord. La Bible ne les nomme directement que dans le premier livre des Maccabées, et une fois à travers leur roi : à Damas, écrit Paul, « le gouverneur du roi Arétas faisait garder la ville des Damascéniens, pour se saisir de moi », et il fut descendu le long du mur dans une corbeille."
    - "Ils entrent dans l’histoire en 312 av. J.-C., quand les généraux d’Antigone, Athénée puis Démétrios, attaquèrent « le rocher ». Diodore, s’appuyant sur un témoin oculaire, décrit des nomades qui ne semaient pas de grain, ne bâtissaient pas de maison et ne buvaient pas de vin, qui transportaient l’encens et la myrrhe de l’Arabie du Sud et recueillaient le bitume de la mer Morte. Judas et Jonathan Maccabée les rencontrèrent en amis dans les années 160 av. J.-C. En deux siècles, ils eurent un royaume allant de Hégra dans le Hedjaz au Havran, une écriture propre et des villes dans le Négev, dont Avdat ; Arétas III tint Damas vers 85-72 av. J.-C."
    - "Arétas IV (9 av. J.-C.-40 apr. J.-C.) était le roi du temps de Paul. Hérode Antipas avait épousé sa fille et la répudia pour Hérodias, le mariage que condamna Jean-Baptiste ; en 36 apr. J.-C., Arétas détruisit l’armée d’Antipas, et beaucoup de Juifs, dit Flavius Josèphe, y virent le châtiment de Dieu pour Jean. Quand Paul écrit : « je partis pour l’Arabie. Puis je revins encore à Damas », c’est dans ce royaume qu’il alla. Comment le gouverneur d’Arétas se trouvait dans une ville romaine est débattu : certains pensent que Caligula lui céda Damas vers 37 apr. J.-C., d’autres qu’un ethnarque dirigeait la colonie nabatéenne de la ville."
    - "Le dernier roi, Rabbel II, transféra sa cour à Bostra, et en 106 apr. J.-C. Trajan fit du royaume la province romaine d’Arabie. Pétra continua comme ville de la province ; ses tombeaux et ses temples, le Khazneh, le théâtre et le Deir, datent pour la plupart du siècle précédant et suivant le Christ, et Johann Ludwig Burckhardt retrouva le site en 1812. La forme nabatéenne de l’écriture araméenne devint l’ancêtre de l’écriture arabe. Pétra est inscrite au patrimoine mondial depuis 1985, et les tombeaux de Hégra, Mada’in Salih, en Arabie saoudite, depuis 2008. Un lien avec Nebajoth, premier-né d’Ismaël dont Ésaïe voit les béliers amenés à l’autel, a souvent été proposé, mais la plupart des spécialistes en doutent : les deux noms s’écrivent avec des consonnes différentes."
  pl:
    - "Nabatejczycy byli ludem arabskim, który od około IV wieku p.n.e. władał dawnymi wyżynami Edomu na południe od Morza Martwego i karawanowymi drogami pustyni, ze stolicą w Petrze, wykutej w piaskowcu dzisiejszej południowej Jordanii. Punkt na mapie dla Arabii Pawła stoi w ich kraju, około 190 km na południe od Jerozolimy w linii prostej, z Petrą 30 km na północ od niego. Biblia wymienia ich bezpośrednio tylko w 1 Księdze Machabejskiej i raz przez ich króla: Paweł pisze, że „W Damaszku hetman ludu króla Arety osadził był strażą miasto Damaszek, chcąc mię pojmać”, i spuszczono go po murze w koszu."
    - "Wchodzą do historii w 312 p.n.e., gdy wodzowie Antygonosa, Atenajos, a potem Demetriusz, napadli na „skałę”. Diodor, opierając się na naocznym świadku, opisuje koczowników, którzy nie siali zboża, nie budowali domów i nie pili wina, którzy przewozili kadzidło i mirrę z południowej Arabii i zbierali bitum z Morza Martwego. Juda i Jonatan Machabeusz spotkali ich jako przyjaciół w latach 160. p.n.e. W ciągu dwóch stuleci mieli królestwo od Hegry w Hidżazie po Hauran, własne pismo i miasta w Negewie, wśród nich Awdat; Aretas III władał Damaszkiem około 85–72 p.n.e."
    - "Aretas IV (9 p.n.e.–40 n.e.) był królem czasów Pawła. Herod Antypas ożenił się z jego córką i odprawił ją dla Herodiady, małżeństwa, które potępił Jan Chrzciciel; w 36 n.e. Aretas rozbił armię Antypasa, a wielu Żydów, mówi Józef Flawiusz, widziało w tym karę Bożą za Jana. Gdy Paweł pisze: „alem szedł do Arabii i wróciłem się zasię do Damaszku”, chodzi o to królestwo. Jak namiestnik Aretasa znalazł się w rzymskim mieście, jest dyskutowane: niektórzy sądzą, że Kaligula oddał mu Damaszek około 37 n.e., inni, że etnarcha stał na czele nabatejskiej kolonii."
    - "Ostatni król, Rabbel II, przeniósł dwór do Bostry, a w 106 n.e. Trajan uczynił królestwo rzymską prowincją Arabia. Petra istniała dalej jako miasto prowincji; jej grobowce i świątynie, Chazne, teatr i Ad-Dajr, pochodzą w większości ze stulecia po obu stronach Chrystusa, a Johann Ludwig Burckhardt odnalazł to miejsce w 1812. Nabatejska forma pisma aramejskiego stała się przodkiem pisma arabskiego. Petra jest na Liście światowego dziedzictwa od 1985, a groby Hegry, Mada'in Salih w Arabii Saudyjskiej, od 2008. Powiązanie z Nebajotem, pierworodnym Izmaela, którego barany Izajasz widzi przyniesione na ołtarz, często proponowano, lecz większość uczonych w nie wątpi: oba imiona zapisuje się innymi spółgłoskami."
  it:
    - "I Nabatei erano un popolo arabo che, dal IV secolo a.C. circa, tenne gli antichi altopiani di Edom a sud del Mar Morto e le vie carovaniere del deserto, con Petra, scavata nell’arenaria dell’odierna Giordania meridionale, come capitale. Il punto della mappa per l’Arabia di Paolo si trova nel loro paese, a circa 190 km a sud di Gerusalemme in linea d’aria, con Petra a 30 km a nord. La Bibbia li nomina direttamente solo in 1 Maccabei, e una volta attraverso il loro re: a Damasco «il governatore del re Areta avea posto delle guardie alla città dei Damasceni per pigliarmi», scrive Paolo, ed egli fu calato dal muro in una cesta."
    - "Entrano nella storia nel 312 a.C., quando i generali di Antigono, Atenèo e poi Demetrio, assalirono «la roccia». Diodoro, attingendo a un testimone oculare, descrive nomadi che non seminavano grano, non costruivano case e non bevevano vino, che portavano incenso e mirra dall’Arabia meridionale e raccoglievano bitume dal Mar Morto. Giuda e Gionata Maccabeo li incontrarono come amici negli anni 160 a.C. Entro due secoli ebbero un regno da Hegra nell’Hijaz all’Auran, una scrittura propria e città nel Negheb, tra cui Avdat; Areta III tenne Damasco verso l’85–72 a.C."
    - "Areta IV (9 a.C.–40 d.C.) era il re dei tempi di Paolo. Erode Antipa aveva sposato sua figlia e l’aveva ripudiata per Erodiade, il matrimonio che Giovanni Battista condannò; nel 36 d.C. Areta distrusse l’esercito di Antipa, e molti Ebrei, dice Giuseppe Flavio, vi videro la punizione di Dio per Giovanni. Quando Paolo dice: «subito me ne andai in Arabia; quindi tornai di nuovo a Damasco», si tratta di questo regno. Come il governatore di Areta si trovasse in una città romana è discusso: alcuni pensano che Caligola gli avesse ceduto Damasco verso il 37 d.C., altri che un etnarca guidasse lì la colonia nabatea."
    - "L’ultimo re, Rabbel II, trasferì la corte a Bostra, e nel 106 d.C. Traiano fece del regno la provincia romana d’Arabia. Petra continuò come città della provincia; le sue tombe e i suoi templi, il Khazneh, il teatro e il Deir, appartengono per lo più al secolo prima e dopo Cristo, e Johann Ludwig Burckhardt ritrovò il sito nel 1812. La forma nabatea della scrittura aramaica divenne l’antenata della scrittura araba. Petra è Patrimonio mondiale dal 1985, e le tombe di Hegra, Mada’in Salih in Arabia Saudita, dal 2008. Un legame con Nebaiot, il primogenito di Ismaele i cui montoni Isaia vede portati all’altare, è stato spesso proposto, ma la maggior parte degli studiosi ne dubita: i due nomi sono scritti con consonanti diverse."
  cs:
    - "Nabatejci byli arabský lid, který od zhruba 4. století př. n. l. držel staré vysočiny Edómu jižně od Mrtvého moře a karavanní cesty pouště, s Petrou, vytesanou do pískovce dnešního jižního Jordánska, jako hlavním městem. Bod Pavlovy Arábie na mapě stojí v jejich zemi, vzdušnou čarou asi 190 km jižně od Jeruzaléma, s Petrou 30 km na sever od něj. Bible je přímo jmenuje jen v 1. knize Makabejské a jednou skrze jejich krále: v Damašku, píše Pavel, „Hejtman v Damašku lidu Aréty krále, ostříhal města Damašku, chtěje mne do vězení vzíti“, a on byl spuštěn po hradbě v koši."
    - "Do dějin vstupují roku 312 př. n. l., kdy vojevůdci Antigonovi, Athenaios a pak Démétrios, přepadli „skálu“. Diodóros, opírající se o očitého svědka, popisuje nomády, kteří nesili obilí, nestavěli domy a nepili víno, kteří vozili kadidlo a myrhu z jižní Arábie a sbírali asfalt z Mrtvého moře. Juda a Jonatan Makabejští se s nimi setkali jako s přáteli v 60. letech 2. století př. n. l. Do dvou století měli království od Hegry v Hidžázu po Havran, vlastní písmo a města v Negevu, mezi nimi Avdat; Aretas III. držel Damašek kolem let 85–72 př. n. l."
    - "Aretas IV. (9 př. n. l.–40 n. l.) byl králem Pavlovy doby. Herodes Antipas se oženil s jeho dcerou a zapudil ji kvůli Herodiadě, sňatku, který Jan Křtitel odsoudil; roku 36 n. l. Aretas zničil Antipovo vojsko a mnozí Židé, praví Josephus, v tom viděli Boží trest za Jana. Když Pavel píše: „šel jsem do Arabie, přišel jsem pak zase do Damašku“, bylo to do tohoto království. Jak se Aretasův správce ocitl v římském městě, je sporné: někteří soudí, že mu Caligula Damašek asi roku 37 n. l. přenechal, jiní, že tamní nabatejskou kolonii vedl etnarcha."
    - "Poslední král, Rabbel II., přesunul dvůr do Bostry a roku 106 n. l. učinil Traianus z království římskou provincii Arábii. Petra pokračovala jako město provincie; její hrobky a chrámy, Chazné, divadlo a Dajr, pocházejí většinou ze století před a po Kristu a Johann Ludwig Burckhardt místo znovu našel roku 1812. Nabatejská podoba aramejského písma se stala předkem arabského písma. Petra je od roku 1985 na seznamu světového dědictví a hrobky Hegry, Madá'in Sálih v Saúdské Arábii, od roku 2008. Souvislost s Nebajótem, prvorozeným Jišmaelovým, jehož berany Izajáš vidí přiváděné k oltáři, se často navrhovala, ale většina badatelů o ní pochybuje: obě jména se píší různými souhláskami."
  nl:
    - "De Nabateeërs waren een Arabisch volk dat vanaf ongeveer de vierde eeuw v.Chr. het oude hoogland van Edom ten zuiden van de Dode Zee en de karavaanwegen van de woestijn in handen had, met Petra, uitgehouwen in het zandsteen van het huidige zuidelijke Jordanië, als hoofdstad. Het punt op de kaart voor het Arabië van Paulus staat in hun land, hemelsbreed ongeveer 190 km ten zuiden van Jeruzalem, met Petra 30 km ten noorden ervan. De Bijbel noemt hen rechtstreeks alleen in 1 Makkabeeën, en eenmaal via hun koning: Paulus schrijft: “De stadhouder van den koning Aretas in Damaskus, bezette de stad der Damaskenen, willende mij vangen”, en dat hij in een mand langs de muur werd neergelaten."
    - "Zij betreden de geschiedenis in 312 v.Chr., toen de generaals van Antigonus, Athenaeus en daarna Demetrius, “de rots” overvielen. Diodorus, die op een ooggetuige steunt, beschrijft nomaden die geen graan zaaiden, geen huis bouwden en geen wijn dronken, die wierook en mirre uit Zuid-Arabië vervoerden en bitumen van de Dode Zee verzamelden. Judas en Jonatan Makkabeüs ontmoetten hen als vrienden in de jaren 160 v.Chr. Binnen twee eeuwen hadden zij een koninkrijk van Hegra in de Hidjaz tot de Hauran, een eigen schrift en steden in de Negev, onder andere Avdat; Aretas III hield Damascus omstreeks 85–72 v.Chr."
    - "Aretas IV (9 v.Chr.–40 n.Chr.) was de koning in Paulus' tijd. Herodes Antipas was met zijn dochter getrouwd en verstootte haar voor Herodias, het huwelijk dat Johannes de Doper veroordeelde; in 36 n.Chr. vernietigde Aretas het leger van Antipas, en velen joden, zegt Josephus, zagen daarin Gods straf voor Johannes. Paulus schrijft: “ik ging henen naar Arabië, en keerde wederom naar Damaskus”; dat was dit koninkrijk. Hoe Aretas' stadhouder in een Romeinse stad kwam, wordt betwist: sommigen denken dat Caligula Damascus omstreeks 37 n.Chr. aan hem afstond, anderen dat een etnarch aan het hoofd van de Nabateese kolonie daar stond."
    - "De laatste koning, Rabbel II, verplaatste zijn hof naar Bostra, en in 106 n.Chr. maakte Trajanus het koninkrijk tot de Romeinse provincie Arabia. Petra bleef bestaan als stad van de provincie; zijn graven en tempels, de Khazneh, het theater en de Deir, dateren grotendeels uit de eeuw aan weerszijden van Christus, en Johann Ludwig Burckhardt vond de plaats in 1812 terug. De Nabateese vorm van het Aramese schrift werd de voorouder van het Arabische schrift. Petra staat sinds 1985 op de Werelderfgoedlijst, en de graven van Hegra, Mada'in Salih in Saoedi-Arabië, sinds 2008. Een verband met Nebajot, de eerstgeborene van Ismaël wiens rammen Jesaja naar het altaar ziet gebracht, is vaak voorgesteld, maar de meeste geleerden betwijfelen het: de twee namen worden met verschillende medeklinkers geschreven."
  sv:
    - "Nabateerna var ett arabiskt folk som från omkring 300-talet f.Kr. behärskade Edoms gamla högland söder om Döda havet och ökens karavanvägar, med Petra, uthuggen i sandstenen i dagens södra Jordanien, som huvudstad. Kartans punkt för Paulus’ Arabien står i deras land, omkring 190 km söder om Jerusalem i fågelvägen, med Petra 30 km norrut. Bibeln nämner dem direkt bara i 1 Mackabeerboken, och en gång genom deras kung: i Damaskus ”lät konung Aretas’ ståthållare sätta ut vakt vid damaskenernas stad för att gripa mig”, skriver Paulus, och han släpptes ned längs muren i en korg."
    - "De träder in i historien 312 f.Kr., när Antigonos’ generaler, Atenaios och sedan Demetrios, plundrade ”klippan”. Diodoros, som bygger på ett ögonvittne, beskriver nomader som inte sådde säd, inte byggde hus och inte drack vin, som förde rökelse och myrra från södra Arabien och samlade bitumen från Döda havet. Judas och Jonatan Mackabeus mötte dem som vänner på 160-talet f.Kr. Inom två århundraden hade de ett kungarike från Hegra i Hejaz till Hauran, en egen skrift och städer i Negev, bland dem Avdat; Aretas III höll Damaskus omkring 85–72 f.Kr."
    - "Aretas IV (9 f.Kr.–40 e.Kr.) var kungen på Paulus’ tid. Herodes Antipas hade gift sig med hans dotter och förskjutit henne för Herodias, det äktenskap som Johannes Döparen fördömde; år 36 e.Kr. förintade Aretas Antipas’ här, och många judar, säger Josefus, såg däri Guds straff för Johannes. När Paulus for bort ”till Arabien och vände så åter tillbaka till Damaskus” var det till detta kungarike. Hur Aretas’ ståthållare kom att finnas i en romersk stad är omdiskuterat: vissa menar att Caligula överlät Damaskus åt honom omkring år 37, andra att en etnark ledde den nabateiska kolonin där."
    - "Den siste kungen, Rabbel II, flyttade sitt hov till Bostra, och år 106 e.Kr. gjorde Trajanus riket till den romerska provinsen Arabien. Petra fortsatte som stad i provinsen; dess gravar och tempel, Khazneh, teatern och Deir, hör mest till århundradet på ömse sidor om Kristus, och Johann Ludwig Burckhardt återfann platsen 1812. Den nabateiska formen av arameisk skrift blev anfader till arabisk skrift. Petra har varit världsarv sedan 1985, och Hegras gravar, Mada'in Salih i Saudiarabien, sedan 2008. En koppling till Nevajot, Ismaels förstfödde vars baggar Jesaja ser föras till altaret, har ofta föreslagits, men de flesta forskare tvivlar: de två namnen stavas med olika konsonanter."
  nb:
    - "Nabateerne var et arabisk folk som fra omkring 300-tallet f.Kr. holdt Edoms gamle høyland sør for Dødehavet og ørkenens karavaneveier, med Petra, hugget inn i sandsteinen i dagens sørlige Jordan, som hovedstad. Kartets punkt for Paulus’ Arabia står i deres land, omtrent 190 km sør for Jerusalem i luftlinje, med Petra 30 km nord for det. Bibelen nevner dem direkte bare i 1 Makkabeerbok, og én gang gjennom deres konge: i Damaskus «holdt kong Aretas’ landshøvding vakt om damaskenernes by for å gripe mig», skriver Paulus, og han ble firt ned over muren i en kurv."
    - "De trer inn i historien i 312 f.Kr., da Antigonos’ generaler, Atenaios og så Demetrios, gjorde et plyndringstokt mot «klippen». Diodoros, som bygger på et øyenvitne, beskriver nomader som ikke sådde korn, ikke bygde hus og ikke drakk vin, som førte røkelse og myrra fra Sør-Arabia og samlet bek fra Dødehavet. Judas og Jonatan Makkabeus møtte dem som venner i 160-årene f.Kr. Innen to århundrer hadde de et kongedømme fra Hegra i Hijaz til Havran, et eget skriftspråk og byer i Negev, blant dem Avdat; Aretas III holdt Damaskus omkring 85–72 f.Kr."
    - "Aretas IV (9 f.Kr.–40 e.Kr.) var kongen på Paulus’ tid. Herodes Antipas hadde giftet seg med hans datter og forskutt henne for Herodias, ekteskapet døperen Johannes fordømte; i 36 e.Kr. ødela Aretas Antipas’ hær, og mange jøder, sier Josefus, så i det Guds straff for Johannes. Da Paulus «drog … straks bort til Arabia og vendte tilbake til Damaskus», var det til dette riket. Hvordan Aretas’ landshøvding kom til å være i en romersk by, er omdiskutert: noen mener at Caligula overlot Damaskus til ham omkring 37 e.Kr., andre at en etnark ledet den nabateiske kolonien der."
    - "Den siste kongen, Rabbel II, flyttet sitt hoff til Bostra, og i 106 e.Kr. gjorde Trajan kongedømmet til den romerske provinsen Arabia. Petra fortsatte som en by i provinsen; dens graver og templer, Khazneh, teatret og Deir, hører for det meste til århundret på hver side av Kristus, og Johann Ludwig Burckhardt fant stedet igjen i 1812. Den nabateiske formen av arameisk skrift ble opphavet til arabisk skrift. Petra har vært verdensarvsted siden 1985, og gravene i Hegra, Mada’in Salih i Saudi-Arabia, siden 2008. En forbindelse med Nebajot, Ismaels førstefødte, hvis værer Jesaja ser bli brakt til alteret, er ofte foreslått, men de fleste forskere tviler på den: de to navnene skrives med ulike konsonanter."
  tl:
    - "Ang mga Nabateo ay isang bayang Arabe na, mula mga ika-4 na siglo BK, humawak ng dating kabundukan ng Edom sa timog ng Dagat na Patay at ng mga daan ng karabana sa disyerto, na may Petra, tinabas sa batong buhangin ng katimugang Jordan ngayon, bilang kabisera. Nasa kanilang bansa ang punto ng mapa para sa Arabia ni Pablo, mga 190 km sa timog ng Jerusalem sa tuwid na guhit, na ang Petra ay 30 km sa hilaga nito. Sa Biblia, tuwiran silang pinangalanan lamang sa 1 Macabeo, at minsan sa pamamagitan ng kanilang hari: sa Damasco “binantayan ng gobernador na sakop ng haring Aretas ang bayan ng mga taga Damasco, upang ako'y hulihin”, sulat ni Pablo, at ibinaba siya sa pader sa isang basket."
    - "Pumasok sila sa kasaysayan noong 312 BK, nang salakayin “ang bato” ng mga heneral ni Antigonus, sina Atenaeus at pagkatapos ay Demetrio. Inilalarawan ni Diodorus, batay sa isang saksi, ang mga lagalag na hindi nagtatanim ng butil, hindi nagtatayo ng bahay at hindi umiinom ng alak, na nagdadala ng kamanyang at mira mula sa timog Arabia at nangongolekta ng betun mula sa Dagat na Patay. Nakipagkita sa kanila bilang mga kaibigan sina Judas at Jonathan Macabeo noong dekada 160 BK. Sa loob ng dalawang siglo, nagkaroon sila ng kaharian mula sa Hegra sa Hejaz hanggang sa Hauran, sariling sulat, at mga bayan sa Negev, kabilang ang Avdat; hinawakan ni Aretas III ang Damasco noong mga 85–72 BK."
    - "Si Aretas IV (9 BK–40 AD) ang hari noong panahon ni Pablo. Pinakasalan ni Herodes Antipas ang kaniyang anak na babae at hiniwalayan ito para kay Herodias, ang pag-aasawang kinondena ni Juan Bautista; noong 36 AD winasak ni Aretas ang hukbo ni Antipas, at maraming Judio, ayon kay Josephus, ang nakakita rito ng parusa ng Dios para kay Juan. Ang sabi ni Pablo, “sa Arabia ako naparoon; at muling nagbalik ako sa Damasco”, sa kahariang ito iyon. Pinagtatalunan kung paano napunta ang gobernador ni Aretas sa isang lungsod ng Roma: iniisip ng ilan na isinuko ni Caligula ang Damasco sa kaniya noong mga 37 AD, ng iba na isang etnarka ang namuno sa kolonyang Nabateo roon."
    - "Inilipat ng huling hari, si Rabbel II, ang kaniyang korte sa Bostra, at noong 106 AD ginawa ni Trajan na lalawigang Romano ng Arabia ang kaharian. Nagpatuloy ang Petra bilang lungsod ng lalawigan; ang mga libingan at templo nito, ang Khazneh, ang teatro at ang Deir, ay karamihang mula sa siglo bago at pagkatapos ni Cristo, at muling natagpuan ni Johann Ludwig Burckhardt ang pook noong 1812. Ang anyong Nabateo ng sulat na Aramaiko ay naging ninuno ng sulat na Arabe. Pook ng Pamanang Pandaigdig ang Petra mula 1985, at ang mga libingan ng Hegra, Mada'in Salih sa Saudi Arabia, mula 2008. Madalas imungkahi ang kaugnayan kay Nabaioth, panganay ni Ismael na ang mga tupa ay nakikita ni Isaias na dinadala sa dambana, ngunit pinag-aalinlanganan ito ng karamihan ng mga iskolar: magkaiba ang katinig ng dalawang pangalan."
  da:
    - "Nabatæerne var et arabisk folk, der fra omkring 300-tallet f.Kr. besad Edoms gamle højland syd for Det Døde Hav og ørkenens karavanevej, med Petra, hugget ind i sandstenen i nutidens sydlige Jordan, som hovedstad. Kortets punkt for Paulus’ Arabien står i deres land, ca. 190 km syd for Jerusalem i fugleflugt, med Petra 30 km mod nord. Bibelen nævner dem direkte kun i 1 Makkabæerbog og én gang gennem deres konge: I Damaskus »holdt Kong Aretas’s Statholder Damaskenernes Stad bevogtet for at gribe mig«, skriver Paulus, og han blev firet ned ad muren i en kurv."
    - "De træder ind i historien i 312 f.Kr., da Antigonos’ generaler, Athenaios og derefter Demetrios, plyndrede »klippen«. Diodor, der bygger på et øjenvidne, beskriver nomader, som ikke tilsåede korn, ikke byggede huse og ikke drak vin, som bragte røgelse og myrra fra det sydlige Arabien og samlede bitumen fra Det Døde Hav. Judas og Jonatan Makkabæus mødte dem som venner i 160’erne f.Kr. Inden for to århundreder havde de et kongerige fra Hegra i Hijaz til Hauran, en egen skrift og byer i Negev, blandt dem Avdat; Aretas 3. holdt Damaskus omkring 85-72 f.Kr."
    - "Aretas 4. (9 f.Kr.-40 e.Kr.) var konge i Paulus’ tid. Herodes Antipas havde giftet sig med hans datter og forstødt hende for Herodias, det ægteskab Johannes Døberen fordømte; i 36 e.Kr. ødelagde Aretas Antipas’ hær, og mange jøder, siger Josefus, så heri Guds straf for Johannes. Da Paulus »drog bort til Arabien og vendte atter tilbage til Damaskus«, var det til dette kongerige. Hvordan Aretas’ statholder kom til at være i en romersk by, er omdiskuteret: Nogle mener, at Caligula afstod Damaskus til ham omkring 37 e.Kr., andre at en etnark ledede den nabatæiske koloni dér."
    - "Den sidste konge, Rabbel 2., flyttede sit hof til Bostra, og i 106 e.Kr. gjorde Trajan kongeriget til den romerske provins Arabien. Petra fortsatte som provinsens by; dens grave og templer, Khazneh, teatret og Deir, hører mest til århundredet på hver side af Kristus, og Johann Ludwig Burckhardt fandt stedet igen i 1812. Den nabatæiske form af den aramæiske skrift blev forfader til den arabiske skrift. Petra har været på verdensarvslisten siden 1985 og Hegras grave, Mada’in Salih i Saudi-Arabien, siden 2008. En forbindelse til Nebajot, Ismaels førstefødte, hvis »Nebajots Vædre« Esajas ser bragt til alteret, er ofte blevet foreslået, men de fleste forskere tvivler: De to navne staves med forskellige konsonanter."
  sr:
    - "Набатејци су били арапски народ који је од око четвртог века п. н. е. држао старо горје Едома јужно од Мртвог мора и караванске путеве пустиње, са Петром, исклесаном у пешчару данашњег јужног Јордана, као престоницом. Тачка Павлове Арабије на карти стоји у њиховој земљи, око 190 км јужно од Јерусалима ваздушном линијом, а Петра је 30 км северно од ње. Библија их директно именује само у Првој књизи о Макавејцима и једном преко њиховог краља: у Дамаску „незнабожачки кнез цара Арете чуваше град Дамаск и хтеде да ме ухвати“, пише Павле, и био је спуштен низ зид у котарици."
    - "У историју улазе 312. п. н. е., када су Антигонови војсковође, Атеније а затим Димитрије, напали „стену“. Диодор, ослањајући се на очевидца, описује номаде који нису сејали жито, градили куће ни пили вино, који су носили тамјан и смирну из јужне Арабије и скупљали битумен са Мртвог мора. Јуда и Јонатан Макавеј срели су их као пријатеље 160-их п. н. е. У року од два века имали су краљевство од Хегре у Хиџазу до Аврана, сопствено писмо и градове у Негеву, међу њима Авдат; Арета III држао је Дамаск око 85–72. п. н. е."
    - "Арета IV (9. п. н. е.–40. н. е.) био је краљ Павловог доба. Ирод Антипа оженио је његову кћер и отерао је због Иродијаде, брака који је Јован Крститељ осудио; 36. н. е. Арета је уништио Антипину војску, а многи Јевреји, каже Јосиф Флавије, у томе су видели Божју казну за Јована. Павле пише: „отидох у арапску, и опет се вратих у Дамаск“; то је било у ово краљевство. Како је Аретин намесник доспео у римски град, спорно је: неки мисле да му је Калигула уступио Дамаск око 37. н. е., други да је етнарх предводио тамошњу набатејску колонију."
    - "Последњи краљ, Рабел II, преселио је двор у Босру, а 106. н. е. Трајан је од краљевства направио римску провинцију Арабију. Петра је наставила као град провинције; њене гробнице и храмови, Хазна, позориште и Деир, припадају углавном веку с обе стране Христа, а Јохан Лудвиг Буркхарт поново је нашао налазиште 1812. Набатејски облик арамејског писма постао је предак арапског писма. Петра је на листи светске баштине од 1985, а гробнице Хегре, Мадаин Салих у Саудијској Арабији, од 2008. Веза са Навајотом, првенцем Исмаиловим чије овнове Исаија види доведене на олтар, често је предлагана, али већина научника сумња: та два имена пишу се различитим сугласницима."
  hu:
    - "A nabateusok arab nép voltak, amely a Kr. e. 4. századtól birtokolta Edom régi, Holt-tengertől délre fekvő felföldjét és a sivatag karavánútjait, fővárosuk Petra volt, a mai dél-jordániai homokkőbe vájva. A térkép Pál Arábiáját jelölő pontja az ő országukban áll, Jeruzsálemtől légvonalban mintegy 190 km-re délre, Petra pedig 30 km-re északra van tőle. A Biblia csak a Makkabeusok első könyvében nevezi meg őket közvetlenül, és egyszer királyukon át: Damaszkuszban „Aretás király helytartója őrzette a damaskusiak városát, akarván engem megfogni”, írja Pál, és kosárban eresztették le a falon."
    - "Kr. e. 312-ben lépnek a történelembe, amikor Antigonosz hadvezérei, Athénaiosz, majd Démétriusz „a sziklát” fosztogatták. Diodórosz szemtanú nyomán olyan nomádokat ír le, akik nem vetettek gabonát, nem építettek házat, nem ittak bort, Dél-Arábiából tömjént és mirhát szállítottak, és bitument gyűjtöttek a Holt-tengerből. Júdás és Jonatán Makkabeus a Kr. e. 160-as években barátként találkozott velük. Két évszázadon belül királyságuk volt a hidzsázi Hegrától a Hauranig, saját írásuk, és városaik a Negevben, köztük Avdat; III. Aréta Kr. e. 85–72 körül birtokolta Damaszkuszt."
    - "IV. Aréta (Kr. e. 9–Kr. u. 40) Pál korának királya volt. Heródes Antipász feleségül vette a lányát, majd Heródiásért elűzte, ezt a házasságot kárhoztatta Keresztelő János; Kr. u. 36-ban Aréta megsemmisítette Antipász seregét, és sok zsidó, mondja Josephus, ebben látta Isten büntetését Jánosért. Amikor Pál, saját szavaival, „elmentem Arábiába, és ismét visszatértem Damaskusba”, ebbe a királyságba ment. Hogy Aréta helytartója hogyan került egy római városba, vitatott: egyesek szerint Caligula Kr. u. 37 körül átengedte neki Damaszkuszt, mások szerint egy etnarkha állt az ottani nabateus gyarmat élén."
    - "Az utolsó király, II. Rabbél udvarát Boszrába költöztette, Kr. u. 106-ban pedig Traianus a királyságot Arábia római provinciájává tette. Petra a provincia városaként folytatta; sírjai és templomai, a Khazneh, a színház és a Deir, többnyire a Krisztus előtti és utáni évszázadból valók, a helyet Johann Ludwig Burckhardt találta meg újra 1812-ben. Az arámi írás nabateus formája az arab írás őse lett. Petra 1985 óta világörökségi hely, a Hegra sírjai, Mada'in Salih Szaúd-Arábiában, 2008 óta. Kapcsolatot Nebajóttal, Izmael elsőszülöttjével, akinek kosait Ézsaiás az oltárhoz hozva látja, gyakran javasoltak, de a legtöbb tudós kételkedik: a két nevet különböző mássalhangzókkal írják."
  fi:
    - "Nabatealaiset olivat arabikansa, joka noin 300-luvulta eaa. hallitsi Kuolleenmeren eteläpuolista vanhaa Edomin ylänköä ja autiomaan karavaanireittejä, pääkaupunkinaan nykyisen Etelä-Jordanian hiekkakiveen hakattu Petra. Kartan piste Paavalin Arabialle on heidän maassaan, linnuntietä noin 190 km Jerusalemista etelään, ja Petra 30 km sen pohjoispuolella. Raamattu nimeää heidät suoraan vain 1. Makkabilaiskirjassa ja kerran heidän kuninkaansa kautta: Damaskoksessa ”kuningas Aretaan käskynhaltija vartioi damaskolaisten kaupunkia ottaaksensa minut kiinni”, Paavali kirjoittaa, ja hänet laskettiin muuria alas korissa."
    - "He astuvat historiaan vuonna 312 eaa., kun Antigonoksen kenraalit Athenaios ja sitten Demetrios ryöstivät ”kalliota”. Diodoros, silminnäkijään nojaten, kuvaa paimentolaisia, jotka eivät kylväneet viljaa, rakentaneet taloa eivätkä juoneet viiniä, jotka kuljettivat suitsuketta ja mirhaa Etelä-Arabiasta ja keräsivät bitumia Kuolleestamerestä. Juudas ja Jonatan Makkabeus tapasivat heidät ystävinä 160-luvulla eaa. Kahdessa vuosisadassa heillä oli valtakunta Hegrasta Hijazissa Hauraniin, oma kirjoitus ja kaupunkeja Negevissä, muun muassa Avdat; Aretas III hallitsi Damaskosta noin 85–72 eaa."
    - "Aretas IV (9 eaa.–40 jaa.) oli Paavalin ajan kuningas. Herodes Antipas oli naimisissa hänen tyttärensä kanssa ja hylkäsi tämän Herodiaan vuoksi, avioliitto, jota Johannes Kastaja tuomitsi; vuonna 36 jaa. Aretas tuhosi Antipaan armeijan, ja monet juutalaiset, Josefuksen mukaan, näkivät siinä Jumalan rangaistuksen Johanneksesta. Kun Paavali sanoo: ”menin pois Arabiaan ja palasin taas takaisin Damaskoon”, kyse oli tästä valtakunnasta. Miten Aretaan käskynhaltija joutui roomalaiseen kaupunkiin, on kiistanalaista: jotkut ajattelevat, että Caligula luovutti Damaskoksen hänelle noin 37 jaa., toiset että etnarkki johti siellä nabatealaisten siirtokuntaa."
    - "Viimeinen kuningas Rabbel II siirsi hovinsa Bostraan, ja vuonna 106 jaa. Trajanus teki valtakunnasta Rooman Arabian provinssin. Petra jatkui provinssin kaupunkina; sen haudat ja temppelit, Khazneh, teatteri ja Deir, kuuluvat enimmäkseen Kristuksen aikaa ympäröivälle vuosisadalle, ja Johann Ludwig Burckhardt löysi paikan uudelleen vuonna 1812. Nabatealainen aramealaisen kirjoituksen muoto tuli arabialaisen kirjoituksen esi-isäksi. Petra on ollut maailmanperintökohde vuodesta 1985 ja Hegran haudat, Mada’in Salih Saudi-Arabiassa, vuodesta 2008. Yhteyttä Nebajotiin, Ismaelin esikoiseen, jonka oinaat Jesaja näkee tuotavan alttarille, on usein ehdotettu, mutta useimmat tutkijat epäilevät sitä: nimet kirjoitetaan eri konsonanteilla."
  vi:
    - "Người Nabataea là một dân Ả Rập, từ khoảng thế kỷ 4 TCN, nắm giữ vùng cao nguyên cổ của Ê-đôm phía nam Biển Chết và các con đường đoàn lái buôn của sa mạc, với Petra, đục vào sa thạch ở nam Jordan ngày nay, làm kinh đô. Điểm của A-ra-bi của Phao-lô trên bản đồ nằm trong xứ của họ, cách Giê-ru-sa-lem khoảng 190 km về phía nam theo đường thẳng, với Petra cách 30 km về phía bắc. Kinh Thánh chỉ nêu tên họ trực tiếp trong 1 Ma-ca-bê, và một lần qua vua của họ: ở Đa-mách, “quan tổng đốc của vua A-rê-ta giữ thành của người Đa-mách để bắt tôi”, Phao-lô viết, và ông được dòng xuống tường thành trong một cái giỏ."
    - "Họ bước vào lịch sử năm 312 TCN, khi các tướng của Antigonus, Athenaeus rồi Demetrius, đột kích “tảng đá”. Diodorus, dựa trên một người chứng kiến, mô tả những dân du mục không gieo lúa, không xây nhà và không uống rượu, mang nhũ hương và một dược từ nam A-ra-bi và thu nhựa đường từ Biển Chết. Giu-đa và Giô-na-than Ma-ca-bê gặp họ như bạn bè vào thập niên 160 TCN. Trong vòng hai thế kỷ họ có một vương quốc từ Hegra ở Hejaz đến Ha-vơ-ran, một chữ viết riêng, và các thị trấn ở Negev, trong đó có Avdat; A-rê-ta III giữ Đa-mách khoảng 85–72 TCN."
    - "A-rê-ta IV (9 TCN–40) là vua thời Phao-lô. Hê-rốt An-ti-ba đã cưới con gái ông và bỏ bà vì Hê-rô-đia, cuộc hôn nhân mà Giăng Báp-tít lên án; năm 36, A-rê-ta tiêu diệt quân của An-ti-ba, và nhiều người Do Thái, Josephus nói, thấy đó là sự trừng phạt của Đức Chúa Trời vì Giăng. Khi Phao-lô “đi qua xứ A-ra-bi; sau rồi trở về thành Đa-mách”, đó là vào vương quốc này. Việc quan tổng đốc của A-rê-ta ở trong một thành La Mã ra sao còn tranh luận: một số người nghĩ Caligula nhường Đa-mách cho ông khoảng năm 37, người khác cho rằng một vị tộc trưởng (ethnarch) đứng đầu thuộc địa Nabataea ở đó."
    - "Vị vua cuối, Rabbel II, dời triều đình sang Bostra, và năm 106 Trajan biến vương quốc thành tỉnh A-ra-bi của La Mã. Petra tiếp tục là một thành của tỉnh; các lăng mộ và đền của nó, Khazneh, nhà hát và Deir, phần lớn thuộc thế kỷ trước và sau Đấng Christ, và Johann Ludwig Burckhardt tìm lại địa điểm năm 1812. Dạng chữ A-ram của người Nabataea trở thành tổ tiên của chữ viết Ả Rập. Petra là Di sản Thế giới từ năm 1985, và các lăng mộ của Hegra, Mada’in Salih ở Ả Rập Xê Út, từ năm 2008. Mối liên hệ với Nê-ba-giốt, con đầu lòng của Ích-ma-ên mà Ê-sai thấy những con chiên đực được đem lên bàn thờ, thường được đề xuất, nhưng hầu hết học giả nghi ngờ: hai tên được viết bằng phụ âm khác nhau."
  ro:
    - "Nabateenii erau un popor arab care, din circa secolul al IV-lea î.Hr., a stăpânit vechile înălțimi ale Edomului, la sud de Marea Moartă, și drumurile caravanelor din deșert, având drept capitală Petra, săpată în gresia din sudul Iordaniei de azi. Punctul Arabiei lui Pavel de pe hartă se află în țara lor, la circa 190 km sud de Ierusalim în linie dreaptă, cu Petra la 30 km spre nord de el. Biblia îi numește direct doar în 1 Macabei și o dată prin regele lor: la Damasc, „mai marele norodului al lui Areta împăratul păzià cetatea Damascului, vrând să mă prinză”, scrie Pavel, care a fost coborât pe zid într-un coș."
    - "Intră în istorie în 312 î.Hr., când generalii lui Antigonos, Atenaios și apoi Demetrios, au făcut raiduri asupra „stâncii”. Diodor, pe baza unui martor ocular, descrie nomazi care nu semănau grâu, nu construiau case și nu beau vin, care transportau tămâie și smirnă din Arabia de sud și strângeau bitum din Marea Moartă. Iuda și Ionatan Macabeul i-au întâlnit ca prieteni în anii 160 î.Hr. În două secole aveau un regat de la Hegra, în Hijaz, până în Hauran, un alfabet propriu și orașe în Neghev, între ele Avdat; Areta al III-lea a stăpânit Damascul în jurul anilor 85–72 î.Hr."
    - "Areta al IV-lea (9 î.Hr.–40 d.Hr.) a fost regele din vremea lui Pavel. Irod Antipa se căsătorise cu fiica lui și o alungase pentru Irodiada, căsătorie pe care Ioan Botezătorul a condamnat-o; în 36 d.Hr. Areta a nimicit armata lui Antipa, iar mulți iudei, spune Iosif Flaviu, au văzut în aceasta pedeapsa lui Dumnezeu pentru Ioan. Când Pavel scrie: „m’am dus în Arabia, și iarăș m’am întors la Damasc”, este vorba de acest regat. Cum a ajuns guvernatorul lui Areta într-un oraș roman este disputat: unii cred că Caligula i-a cedat Damascul în jurul anului 37 d.Hr., alții că un etnarh conducea acolo colonia nabateană."
    - "Ultimul rege, Rabbel al II-lea, și-a mutat curtea la Bostra, iar în 106 d.Hr. Traian a făcut din regat provincia romană Arabia. Petra a continuat ca oraș al provinciei; mormintele și templele ei, Khazneh, teatrul și Deir, țin mai ales din secolul de o parte și de alta a lui Hristos, iar Johann Ludwig Burckhardt a regăsit locul în 1812. Forma nabateană a scrierii aramaice a devenit strămoșul scrierii arabe. Petra este Sit al Patrimoniului Mondial din 1985, iar mormintele de la Hegra, Mada’in Salih, în Arabia Saudită, din 2008. O legătură cu Nebaiot, întâiul născut al lui Ismael, ai cărui berbeci îi vede Isaia aduși la altar, a fost adesea propusă, dar cei mai mulți cercetători se îndoiesc: cele două nume se scriu cu consoane diferite."
  bg:
    - "Набатейците бяха арабски народ, който от около IV в. пр.н.е. държеше старите планини на Едом южно от Мъртво море и керванните пътища на пустинята, а столицата им беше Петра, изсечена в пясъчника на днешна Южна Йордания. Точката на картата за Арабия на Павел стои в тяхната страна, на около 190 км южно от Йерусалим по права линия, а Петра е на 30 км на север от нея. Библията ги назовава пряко само в 1 Макавейска и веднъж чрез техния цар: в Дамаск „областният управител на Царя Арета взе под стража града Дамаск като искаше да ме улови“, пише Павел, и той беше спуснат по стената в кош."
    - "Те влизат в историята през 312 г. пр.н.е., когато пълководците на Антигон, Атеней, а после Димитър, нападнаха „скалата“. Диодор, позовавайки се на очевидец, описва номади, които не сеели жито, не строели къщи и не пиели вино, пренасяли тамян и смирна от Южна Арабия и събирали битум от Мъртво море. Юда и Йонатан Макавей ги срещнаха като приятели през 60-те години на II в. пр.н.е. В рамките на два века те имаха царство от Хегра в Хиджаз до Хауран, собствена писменост и градове в Негев, сред тях Авдат; Арета III държеше Дамаск около 85–72 г. пр.н.е."
    - "Арета IV (9 г. пр.н.е. – 40 г. н.е.) беше царят по времето на Павел. Ирод Антипа се беше оженил за дъщеря му и я беше отпратил заради Иродиада — брака, който Йоан Кръстител осъди; през 36 г. н.е. Арета разгроми войската на Антипа и мнозина юдеи, казва Йосиф Флавий, видели в това Божие наказание заради Йоан. Когато Павел пише: „отидох в Арабия, и пак се върнах в Дамаск“, става дума за това царство. Как управителят на Арета се е озовал в римски град, е спорно: някои смятат, че Калигула е отстъпил Дамаск на Арета около 37 г. н.е., други — че етнархът е оглавявал набатейската колония там."
    - "Последният цар, Рабел II, премести двора си в Бостра, а през 106 г. н.е. Траян превърна царството в римската провинция Арабия. Петра продължи да съществува като град на провинцията; гробниците и храмовете ѝ — Хазне, театърът и Деир — са предимно от столетието преди и след Христа, а Йохан Лудвиг Буркхарт откри мястото отново през 1812 г. Набатейската форма на арамейското писмо стана прародител на арабската писменост. Петра е обект на световното наследство от 1985 г., а гробниците на Хегра, Мадаин Салих в Саудитска Арабия — от 2008 г. Често е предлагана връзка с Наваиот, първородния на Исмаил, чиито овни Исаия вижда принесени на олтаря, но повечето учени се съмняват: двете имена се пишат с различни съгласни."
