id: who-were-the-nabataeans
question:
  en: "Who were the Nabataeans?"
  ru: "Кто такие набатеи?"
answer:
  en:
    - "The Nabataeans were an Arab people who, from about the fourth century BC, held the old highlands of Edom south of the Dead Sea and the caravan roads of the desert, with Petra, cut into the sandstone of today's southern Jordan, as their capital. The map's point for Paul's Arabia stands in their country, about 190 km south of Jerusalem in a straight line, with Petra 30 km to its north. The Bible names them directly only in 1 Maccabees, and once through their king: in Damascus “the governor under Aretas the king kept the city of the Damascenes with a garrison, desirous to apprehend me”, Paul writes, and he was let down the wall in a basket."
    - "They enter history in 312 BC, when the generals of Antigonus, Athenaeus and then Demetrius, raided “the rock”. Diodorus, drawing on an eyewitness, describes nomads who planted no grain, built no house and drank no wine, who carried frankincense and myrrh from southern Arabia and gathered bitumen from the Dead Sea. Judas and Jonathan Maccabeus met them as friends in the 160s BC. Within two centuries they had a kingdom from Hegra in the Hejaz to the Hauran, a script of their own, and towns in the Negev, Avdat among them; Aretas III held Damascus about 85–72 BC."
    - "Aretas IV (9 BC–AD 40) was the king of Paul's day. Herod Antipas had married his daughter and put her away for Herodias, the marriage John the Baptist condemned; in AD 36 Aretas destroyed Antipas's army, and many Jews, Josephus says, saw in it God's punishment for John. When Paul “went into Arabia, and returned again unto Damascus”, it was into this kingdom. How Aretas's governor came to be in a Roman city is debated: some think Caligula ceded Damascus to him about AD 37, others that an ethnarch headed the Nabataean colony there."
    - "The last king, Rabbel II, moved his court to Bostra, and in AD 106 Trajan made the kingdom the Roman province of Arabia. Petra went on as a city of the province; its tombs and temples, the Khazneh, the theatre and the Deir, belong mostly to the century on either side of Christ, and Johann Ludwig Burckhardt found the site again in 1812. The Nabataean form of Aramaic script became the ancestor of Arabic writing. Petra has been a World Heritage Site since 1985, and the tombs of Hegra, Mada'in Salih in Saudi Arabia, since 2008. A link with Nebaioth, the firstborn of Ishmael whose rams Isaiah sees brought to the altar, has often been proposed, but most scholars doubt it: the two names are spelt with different consonants."
  ru:
    - "Набатеи — арабский народ, который примерно с IV века до н. э. владел старым нагорьем Едома к югу от Мёртвого моря и караванными дорогами пустыни; их столицей была Петра, вырубленная в песчанике нынешней южной Иордании. Точка карты для Аравии Павла стоит в их стране, примерно в 190 км к югу от Иерусалима по прямой, а Петра — в 30 км к северу от неё. Прямо их называет только Первая книга Маккавейская, а ещё раз Библия упоминает их через их царя: «В Дамаске областной правитель царя Ареты стерег город Дамаск, чтобы схватить меня», пишет Павел, и его спустили со стены в корзине."
    - "В историю они входят в 312 г. до н. э., когда полководцы Антигона, сначала Афиней, потом Деметрий, напали на «скалу». Диодор, опираясь на очевидца, описывает кочевников, которые не сеяли хлеба, не строили домов и не пили вина, возили ладан и мирру из южной Аравии и собирали асфальт с Мёртвого моря. Иуда и Ионафан Маккавеи встречали их как друзей в 160-х годах до н. э. За два века у них появились царство от Хегры в Хиджазе до Хаурана, собственное письмо и города в Негеве, среди них Авдат; Арета III держал Дамаск около 85–72 гг. до н. э."
    - "Арета IV (9 г. до н. э. — 40 г. н. э.) был царём во дни Павла. Ирод Антипа женился на его дочери и отослал её ради Иродиады — за этот брак обличал его Иоанн Креститель; в 36 г. Арета уничтожил войско Антипы, и многие иудеи, пишет Иосиф Флавий, увидели в этом Божью кару за Иоанна. Когда Павел «пошел в Аравию и опять возвратился в Дамаск», он ходил в это царство. Как правитель Ареты оказался в римском городе, спорят: одни думают, что Калигула уступил ему Дамаск около 37 г., другие — что этнарх возглавлял набатейскую общину города."
    - "Последний царь, Раббэль II, перенёс двор в Бостру, а в 106 г. н. э. Траян обратил царство в римскую провинцию Аравия. Петра осталась городом провинции; её гробницы и храмы — Эль-Хазне, театр, Эд-Дейр — созданы большей частью в столетие по обе стороны от Рождества Христова, и в 1812 году Иоганн Людвиг Буркхардт вновь нашёл это место. Набатейская разновидность арамейского письма стала предком арабской письменности. Петра — объект Всемирного наследия с 1985 года, гробницы Хегры, Мадаин-Салиха в Саудовской Аравии, — с 2008-го. Связь с Наваиофом, первенцем Измаила, чьих овнов Исаия видит приведёнными к жертвеннику, предлагали не раз, но большинство учёных сомневается: два имени пишутся разными согласными."
