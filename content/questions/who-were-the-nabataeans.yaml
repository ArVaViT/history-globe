id: who-were-the-nabataeans
question:
  en: "Who were the Nabataeans?"
  ru: "Кто такие набатеи?"
  uk: "Хто були набатеї?"
  es: "¿Quiénes eran los nabateos?"
  pt: "Quem eram os nabateus?"
  de: "Wer waren die Nabatäer?"
  fr: "Qui étaient les Nabatéens ?"
answer:
  en:
    - "The Nabataeans were an Arab people who, from about the fourth century BC, held the old highlands of Edom south of the Dead Sea and the caravan roads of the desert, with Petra, cut into the sandstone of today's southern Jordan, as their capital. The map's point for Paul's Arabia stands in their country, about 190 km south of Jerusalem in a straight line, with Petra 30 km to its north. The Bible names them directly only in 1 Maccabees, and once through their king: in Damascus “the governor under Aretas the king kept the city of the Damascenes with a garrison, desirous to apprehend me”, Paul writes, and he was let down the wall in a basket."
    - "They enter history in 312 BC, when the generals of Antigonus, Athenaeus and then Demetrius, raided “the rock”. Diodorus, drawing on an eyewitness, describes nomads who planted no grain, built no house and drank no wine, who carried frankincense and myrrh from southern Arabia and gathered bitumen from the Dead Sea. Judas and Jonathan Maccabeus met them as friends in the 160s BC. Within two centuries they had a kingdom from Hegra in the Hejaz to the Hauran, a script of their own, and towns in the Negev, Avdat among them; Aretas III held Damascus about 85–72 BC."
    - "Aretas IV (9 BC–AD 40) was the king of Paul's day. Herod Antipas had married his daughter and put her away for Herodias, the marriage John the Baptist condemned; in AD 36 Aretas destroyed Antipas's army, and many Jews, Josephus says, saw in it God's punishment for John. When Paul “went into Arabia, and returned again unto Damascus”, it was into this kingdom. How Aretas's governor came to be in a Roman city is debated: some think Caligula ceded Damascus to him about AD 37, others that an ethnarch headed the Nabataean colony there."
    - "The last king, Rabbel II, moved his court to Bostra, and in AD 106 Trajan made the kingdom the Roman province of Arabia. Petra went on as a city of the province; its tombs and temples, the Khazneh, the theatre and the Deir, belong mostly to the century on either side of Christ, and Johann Ludwig Burckhardt found the site again in 1812. The Nabataean form of Aramaic script became the ancestor of Arabic writing. Petra has been a World Heritage Site since 1985, and the tombs of Hegra, Mada'in Salih in Saudi Arabia, since 2008. A link with Nebaioth, the firstborn of Ishmael whose rams Isaiah sees brought to the altar, has often been proposed, but most scholars doubt it: the two names are spelt with different consonants."
  ru:
    - "Набатеи — арабский народ, который примерно с IV века до н. э. владел старым нагорьем Едома к югу от Мёртвого моря и караванными дорогами пустыни; их столицей была Петра, вырубленная в песчанике нынешней южной Иордании. Точка карты для Аравии Павла стоит в их стране, примерно в 190 км к югу от Иерусалима по прямой, а Петра — в 30 км к северу от неё. Прямо их называет только Первая книга Маккавейская, а ещё раз Библия упоминает их через их царя: «В Дамаске областной правитель царя Ареты стерег город Дамаск, чтобы схватить меня», пишет Павел, и его спустили со стены в корзине."
    - "В историю они входят в 312 г. до н. э., когда полководцы Антигона, сначала Афиней, потом Деметрий, напали на «скалу». Диодор, опираясь на очевидца, описывает кочевников, которые не сеяли хлеба, не строили домов и не пили вина, возили ладан и мирру из южной Аравии и собирали асфальт с Мёртвого моря. Иуда и Ионафан Маккавеи встречали их как друзей в 160-х годах до н. э. За два века у них появились царство от Хегры в Хиджазе до Хаурана, собственное письмо и города в Негеве, среди них Авдат; Арета III держал Дамаск около 85–72 гг. до н. э."
    - "Арета IV (9 г. до н. э. — 40 г. н. э.) был царём во дни Павла. Ирод Антипа женился на его дочери и отослал её ради Иродиады — за этот брак обличал его Иоанн Креститель; в 36 г. Арета уничтожил войско Антипы, и многие иудеи, пишет Иосиф Флавий, увидели в этом Божью кару за Иоанна. Когда Павел «пошел в Аравию и опять возвратился в Дамаск», он ходил в это царство. Как правитель Ареты оказался в римском городе, спорят: одни думают, что Калигула уступил ему Дамаск около 37 г., другие — что этнарх возглавлял набатейскую общину города."
    - "Последний царь, Раббэль II, перенёс двор в Бостру, а в 106 г. н. э. Траян обратил царство в римскую провинцию Аравия. Петра осталась городом провинции; её гробницы и храмы — Эль-Хазне, театр, Эд-Дейр — созданы большей частью в столетие по обе стороны от Рождества Христова, и в 1812 году Иоганн Людвиг Буркхардт вновь нашёл это место. Набатейская разновидность арамейского письма стала предком арабской письменности. Петра — объект Всемирного наследия с 1985 года, гробницы Хегры, Мадаин-Салиха в Саудовской Аравии, — с 2008-го. Связь с Наваиофом, первенцем Измаила, чьих овнов Исаия видит приведёнными к жертвеннику, предлагали не раз, но большинство учёных сомневается: два имени пишутся разными согласными."
  uk:
    - "Набатеї були арабським народом, який приблизно від IV ст. до н. е. тримав давнє нагір'я Едому на південь від Мертвого моря та караванні шляхи пустелі, зі столицею Петрою, вирізаною в пісковику нинішньої південної Йорданії. Точка Павлової Аравії на мапі стоїть у їхньому краї, приблизно за 190 км на південь від Єрусалима по прямій, з Петрою за 30 км на північ від неї. Біблія називає їх напряму лише в Першій книзі Макавеїв, а також один раз через їхнього царя: у Дамаску «царський намістник Арета, стеріг город Дамащан, хотївши піймати мене», пише Павло, і його спустили по мурі в коші."
    - "Вони входять в історію 312 р. до н. е., коли воєначальники Антігона — Афіней, а потім Димитрій — напали на «скелю». Діодор, спираючись на очевидця, описує кочівників, які не сіяли хліба, не будували будинків і не пили вина, що возили ладан і смирну з південної Аравії й збирали бітум з Мертвого моря. Юда та Йонатан Макавеї зустрічали їх як друзів у 160-х рр. до н. е. За два століття вони мали царство від Хегри в Хіджазі до Хаврана, власне письмо й міста в Негеві, серед них Авдат; Арета III тримав Дамаск близько 85–72 рр. до н. е."
    - "Арета IV (9 р. до н. е.–40 р. н. е.) був царем за Павла. Ірод Антипа одружився з його дочкою й відіслав її заради Іродіади — шлюб, який засуджував Іван Хреститель; 36 р. н. е. Арета знищив військо Антипи, і багато юдеїв, каже Йосиф Флавій, бачили в цьому Божу кару за Івана. Коли Павло «пійшов у Аравию, та й знов вернувсь у Дамаск», це було в цьому царстві. Як намісник Арети опинився в римському місті — обговорюють: дехто вважає, що Калігула поступився йому Дамаском близько 37 р. н. е., інші — що етнарх очолював там набатейську колонію."
    - "Останній цар, Раббель II, переніс свій двір до Бостри, і 106 р. н. е. Траян зробив царство римською провінцією Аравія. Петра продовжувала жити як місто провінції; її гробниці й храми, Ель-Хазне, театр і Ед-Дейр, належать здебільшого до століття по обидва боки від Христа, а Йоганн Людвіг Буркгардт віднайшов місце 1812 р. Набатейська форма арамейського письма стала предком арабського письма. Петра є об'єктом Всесвітньої спадщини від 1985 р., а гробниці Хегри, Мадаїн-Саліх у Саудівській Аравії, — від 2008 р. Зв'язок з Наваїофом, первістком Ізмаїла, чиїх баранів Ісая бачить принесеними до жертовника, часто пропонували, але більшість учених сумніваються: ці два імена пишуться різними приголосними."
  es:
    - "Los nabateos eran un pueblo árabe que, desde aproximadamente el siglo IV a. C., ocupó las antiguas tierras altas de Edom al sur del mar Muerto y las rutas de caravanas del desierto, con Petra, excavada en la arenisca del actual sur de Jordania, como capital. El punto del mapa para la Arabia de Pablo está en su país, a unos 190 km al sur de Jerusalén en línea recta, con Petra a 30 km al norte. La Biblia los nombra directamente solo en 1 Macabeos, y una vez a través de su rey: en Damasco, escribe Pablo, «el gobernador de la provincia del rey Aretas guardaba la ciudad de los Damascenos para prenderme», y fue descolgado del muro en un serón."
    - "Entran en la historia en 312 a. C., cuando los generales de Antígono, Atenaio y luego Demetrio, atacaron «la roca». Diodoro, que se basa en un testigo ocular, describe nómadas que no sembraban grano, no construían casas y no bebían vino, que transportaban incienso y mirra desde el sur de Arabia y recogían betún del mar Muerto. Judas y Jonatán Macabeo los trataron como amigos en la década del 160 a. C. En dos siglos tuvieron un reino desde Hegra, en el Hiyaz, hasta el Haurán, una escritura propia y ciudades en el Négueb, entre ellas Avdat; Aretas III tuvo Damasco hacia 85–72 a. C."
    - "Aretas IV (9 a. C.–40 d. C.) fue el rey de los días de Pablo. Herodes Antipas se había casado con su hija y la repudió por Herodías, el matrimonio que condenó Juan el Bautista; en el 36 d. C. Aretas destruyó el ejército de Antipas, y muchos judíos, dice Josefo, vieron en ello el castigo de Dios por Juan. Cuando Pablo escribe: «me fuí á la Arabia, y volví de nuevo á Damasco», se refiere a este reino. Cómo llegó el gobernador de Aretas a una ciudad romana se discute: unos piensan que Calígula le cedió Damasco hacia el 37 d. C., otros que un etnarca presidía la colonia nabatea allí."
    - "El último rey, Rabel II, trasladó su corte a Bosra, y en el 106 d. C. Trajano convirtió el reino en la provincia romana de Arabia. Petra siguió como ciudad de la provincia; sus tumbas y templos, el Khazneh, el teatro y el Deir, pertenecen en su mayoría a los cien años anteriores y posteriores a Cristo, y Johann Ludwig Burckhardt volvió a encontrar el sitio en 1812. La forma nabatea de la escritura aramea fue el antepasado de la escritura árabe. Petra es Patrimonio de la Humanidad desde 1985, y las tumbas de Hegra, Mada'in Salih, en Arabia Saudí, desde 2008. A menudo se ha propuesto un vínculo con Nebaiot, el primogénito de Ismael, cuyos carneros ve Isaías llevados al altar, pero la mayoría de los estudiosos lo dudan: los dos nombres se escriben con consonantes distintas."
  pt:
    - "Os nabateus eram um povo árabe que, desde cerca do século IV a.C., ocupou as antigas terras altas de Edom ao sul do mar Morto e as rotas de caravanas do deserto, com Petra, esculpida no arenito do atual sul da Jordânia, como capital. O ponto do mapa para a Arábia de Paulo fica em seu país, a cerca de 190 km ao sul de Jerusalém em linha reta, com Petra a 30 km ao norte dele. A Bíblia os nomeia diretamente apenas em 1 Macabeus, e uma vez por meio de seu rei: em Damasco, “o governador sob o rei Aretas guardava a cidade de Damasco, desejando me prender”, escreve Paulo, e ele foi descido pela muralha num cesto."
    - "Entram na história em 312 a.C., quando os generais de Antígono, Ateneu e depois Demétrio, atacaram “a rocha”. Diodoro, apoiado numa testemunha ocular, descreve nômades que não semeavam grão, não construíam casa e não bebiam vinho, que levavam incenso e mirra do sul da Arábia e colhiam betume do mar Morto. Judas e Jônatas Macabeu os encontraram como amigos na década de 160 a.C. Em dois séculos tinham um reino de Hegra, no Hejaz, ao Haurã, uma escrita própria e cidades no Neguebe, entre elas Avdat; Aretas III ocupou Damasco por volta de 85–72 a.C."
    - "Aretas IV (9 a.C.–40 d.C.) era o rei do tempo de Paulo. Herodes Antipas casara-se com a filha dele e a repudiara por causa de Herodias, o casamento que João Batista condenou; em 36 d.C., Aretas destruiu o exército de Antipas, e muitos judeus, diz Josefo, viram nisso o castigo de Deus por João. Quando Paulo diz “parti para a Arábia. Depois, retornei a Damasco”, foi para esse reino. Como o governador de Aretas veio a estar numa cidade romana é debatido: alguns pensam que Calígula lhe cedeu Damasco por volta de 37 d.C., outros que um etnarca chefiava ali a colônia nabateia."
    - "O último rei, Rabel II, transferiu a corte para Bostra, e em 106 d.C. Trajano fez do reino a província romana da Arábia. Petra continuou como cidade da província; seus túmulos e templos, o Khazneh, o teatro e o Deir, pertencem em sua maioria ao século anterior e posterior a Cristo, e Johann Ludwig Burckhardt reencontrou o sítio em 1812. A forma nabateia da escrita aramaica tornou-se a antepassada da escrita árabe. Petra é Patrimônio Mundial desde 1985, e os túmulos de Hegra, Mada'in Salih, na Arábia Saudita, desde 2008. Uma ligação com Nebaiote, o primogênito de Ismael, cujos carneiros Isaías vê levados ao altar, foi muitas vezes proposta, mas a maioria dos estudiosos duvida: os dois nomes são escritos com consoantes diferentes."
  de:
    - "Die Nabatäer waren ein arabisches Volk, das ab etwa dem 4. Jahrhundert v. Chr. das alte Hochland von Edom südlich des Toten Meeres und die Karawanenstraßen der Wüste beherrschte, mit Petra, in den Sandstein des heutigen Südjordaniens gehauen, als Hauptstadt. Der Kartenpunkt für Paulus’ Arabien steht in ihrem Land, in der Luftlinie etwa 190 km südlich von Jerusalem, mit Petra 30 km nördlich davon. Die Bibel nennt sie nur im Ersten Buch der Makkabäer unmittelbar und einmal durch ihren König: In Damaskus „verwahrte der Landpfleger des Königs Aretas die Stadt der Damasker und wollte mich greifen“, schreibt Paulus, und er wurde in einem Korb die Mauer hinabgelassen."
    - "In die Geschichte treten sie 312 v. Chr. ein, als die Feldherren des Antigonos, Athenaios und dann Demetrios, „den Felsen“ überfielen. Diodor, der sich auf einen Augenzeugen stützt, beschreibt Nomaden, die kein Getreide säten, kein Haus bauten und keinen Wein tranken, die Weihrauch und Myrrhe aus Südarabien trugen und Erdpech vom Toten Meer sammelten. Judas und Jonatan Makkabäus begegneten ihnen in den 160er-Jahren v. Chr. als Freunden. Binnen zwei Jahrhunderten hatten sie ein Königreich von Hegra im Hedschas bis zum Hauran, eine eigene Schrift und Städte im Negev, darunter Avdat; Aretas III. hielt Damaskus um 85–72 v. Chr."
    - "Aretas IV. (9 v. Chr.–40 n. Chr.) war der König zu Paulus’ Zeit. Herodes Antipas hatte seine Tochter geheiratet und sie für Herodias verstoßen, die Ehe, die Johannes der Täufer verurteilte; im Jahr 36 n. Chr. vernichtete Aretas das Heer des Antipas, und viele Juden sahen darin nach Josephus Gottes Strafe für Johannes. Von Paulus heißt es, er „zog hin nach Arabien und kam wiederum gen Damaskus“; gemeint ist dieses Königreich. Wie Aretas’ Statthalter in eine römische Stadt kam, ist umstritten: Manche meinen, Caligula habe ihm Damaskus um 37 n. Chr. überlassen, andere, ein Ethnarch habe die nabatäische Kolonie dort geleitet."
    - "Der letzte König, Rabbel II., verlegte seinen Hof nach Bostra, und 106 n. Chr. machte Trajan das Königreich zur römischen Provinz Arabia. Petra bestand als Stadt der Provinz fort; seine Gräber und Tempel, das Schatzhaus Chasne, das Theater und das Deir, gehören meist in das Jahrhundert vor und nach Christus, und Johann Ludwig Burckhardt fand die Stätte 1812 wieder. Die nabatäische Form der aramäischen Schrift wurde zur Ahnin der arabischen Schrift. Petra ist seit 1985 Welterbestätte, die Gräber von Hegra, Mada’in Salih in Saudi-Arabien, seit 2008. Eine Verbindung mit Nebajot, dem Erstgeborenen Ismaels, dessen Widder Jesaja zum Altar gebracht sieht, wurde oft vorgeschlagen, doch die meisten Gelehrten zweifeln: Die beiden Namen werden mit verschiedenen Konsonanten geschrieben."
  fr:
    - "Les Nabatéens étaient un peuple arabe qui, à partir d’environ le IVe siècle av. J.-C., tint les anciennes hautes terres d’Édom, au sud de la mer Morte, et les routes caravanières du désert, avec Pétra, taillée dans le grès de l’actuel sud de la Jordanie, pour capitale. Le point de la carte pour l’Arabie de Paul se trouve dans leur pays, à environ 190 km au sud de Jérusalem à vol d’oiseau, Pétra étant à 30 km au nord. La Bible ne les nomme directement que dans le premier livre des Maccabées, et une fois à travers leur roi : à Damas, écrit Paul, « le gouverneur du roi Arétas faisait garder la ville des Damascéniens, pour se saisir de moi », et il fut descendu le long du mur dans une corbeille."
    - "Ils entrent dans l’histoire en 312 av. J.-C., quand les généraux d’Antigone, Athénée puis Démétrios, attaquèrent « le rocher ». Diodore, s’appuyant sur un témoin oculaire, décrit des nomades qui ne semaient pas de grain, ne bâtissaient pas de maison et ne buvaient pas de vin, qui transportaient l’encens et la myrrhe de l’Arabie du Sud et recueillaient le bitume de la mer Morte. Judas et Jonathan Maccabée les rencontrèrent en amis dans les années 160 av. J.-C. En deux siècles, ils eurent un royaume allant de Hégra dans le Hedjaz au Havran, une écriture propre et des villes dans le Négev, dont Avdat ; Arétas III tint Damas vers 85-72 av. J.-C."
    - "Arétas IV (9 av. J.-C.-40 apr. J.-C.) était le roi du temps de Paul. Hérode Antipas avait épousé sa fille et la répudia pour Hérodias, le mariage que condamna Jean-Baptiste ; en 36 apr. J.-C., Arétas détruisit l’armée d’Antipas, et beaucoup de Juifs, dit Flavius Josèphe, y virent le châtiment de Dieu pour Jean. Quand Paul écrit : « je partis pour l’Arabie. Puis je revins encore à Damas », c’est dans ce royaume qu’il alla. Comment le gouverneur d’Arétas se trouvait dans une ville romaine est débattu : certains pensent que Caligula lui céda Damas vers 37 apr. J.-C., d’autres qu’un ethnarque dirigeait la colonie nabatéenne de la ville."
    - "Le dernier roi, Rabbel II, transféra sa cour à Bostra, et en 106 apr. J.-C. Trajan fit du royaume la province romaine d’Arabie. Pétra continua comme ville de la province ; ses tombeaux et ses temples, le Khazneh, le théâtre et le Deir, datent pour la plupart du siècle précédant et suivant le Christ, et Johann Ludwig Burckhardt retrouva le site en 1812. La forme nabatéenne de l’écriture araméenne devint l’ancêtre de l’écriture arabe. Pétra est inscrite au patrimoine mondial depuis 1985, et les tombeaux de Hégra, Mada’in Salih, en Arabie saoudite, depuis 2008. Un lien avec Nebajoth, premier-né d’Ismaël dont Ésaïe voit les béliers amenés à l’autel, a souvent été proposé, mais la plupart des spécialistes en doutent : les deux noms s’écrivent avec des consonnes différentes."
