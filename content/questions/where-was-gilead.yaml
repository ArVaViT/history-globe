id: where-was-gilead
question:
  en: "Where was Gilead?"
  ru: "Где находился Галаад?"
  uk: "Де був Гілеад?"
  es: "¿Dónde estaba Galaad?"
  pt: "Onde ficava Gileade?"
  de: "Wo lag Gilead?"
  fr: "Où se trouvait Galaad ?"
  pl: "Gdzie leżał Gilead?"
  it: "Dov’era Galaad?"
  cs: "Kde ležel Gilead?"
  nl: "Waar lag Gilead?"
  sv: "Var låg Gilead?"
answer:
  en:
    - "Gilead was the hill country east of the Jordan, in today's north-western Jordan, between the Yarmuk in the north and the plateau of Moab in the south, cut in two by the gorge of the Jabbok. The map point stands in its middle, on the Jabbok at Penuel, one of the twin mounds of Tell edh-Dhahab, with Mahanaim on the other, about 63 km north-east of Jerusalem in a straight line. The name could mean the hills on either side of the Jabbok or all of Israel's land beyond the river, as in “From Jordan eastward, all the land of Gilead”."
    - "It was a land of woods, pasture and spices. Reuben and Gad saw that “the place was a place for cattle” and asked for it, and Moses gave “half mount Gilead” to them and “the rest of Gilead” to the half-tribe of Manasseh; Ramoth-gilead, about 46 km north-east of the map point, was its border fortress against Damascus. The caravan that bought Joseph came “from Gilead with their camels bearing spicery and balm and myrrh”, and Jeremiah asks, “Is there no balm in Gilead; is there no physician there?” Elijah the Tishbite was “of the inhabitants of Gilead”."
    - "In 733–732 BC Tiglath-pileser III took Gilead and carried its people to Assyria. In New Testament times its north held the Decapolis cities of Gerasa, Pella and Gadara, and its south was Perea, the land of Herod Antipas beyond the Jordan. Today the hills round Ajloun, Jerash and Salt are still wooded with oak and pine."
  ru:
    - "Галаад — нагорье к востоку от Иордана, на северо-западе нынешней Иордании, между Ярмуком на севере и плато Моава на юге, рассечённое надвое ущельем Иавока. Точка карты стоит в его середине, на Иавоке у Пенуэла, одного из двух холмов-близнецов Телль-эд-Дахаб, на другом из которых стоял Маханаим, примерно в 63 км к северо-востоку от Иерусалима по прямой. Имя могло означать горы по обе стороны Иавока или всю землю Израиля за рекой, как в словах «на восток от Иордана, всю землю Галаад»."
    - "Это была страна лесов, пастбищ и благовоний. Рувим и Гад увидели, что земля Галаад «есть место годное для стад», и попросили её, и Моисей отдал им «половину горы Галаада», а «остаток Галаада» — половине колена Манассиина; Рамоф Галаадский, примерно в 46 км к северо-востоку от точки карты, был его пограничной крепостью против Дамаска. Караван, купивший Иосифа, шёл «из Галаада», и «верблюды их несут стираксу, бальзам и ладан», а Иеремия спрашивает: «Разве нет бальзама в Галааде? разве нет там врача?» Илия Фесвитянин был «из жителей Галаадских»."
    - "В 733–732 гг. до н. э. Феглаффелласар III взял Галаад и переселил его жителей в Ассирию. Во времена Нового Завета на севере Галаада стояли города Десятиградия — Гераса, Пелла и Гадара, а юг был Переей, землёй Ирода Антипы за Иорданом. Сегодня горы вокруг Аджлуна, Джераша и Эс-Салта по-прежнему покрыты дубом и сосной."
  uk:
    - "Гілеад був гірським краєм на схід від Йордану, на північному заході нинішньої Йорданії, між Ярмуком на півночі та плато Моаву на півдні, розсіченим навпіл ущелиною Яббоку. Точка на мапі стоїть посередині, на Яббоку біля Пенуела — одного з двох пагорбів Телль-ед-Дагаб, на другому з яких стояв Маханаїм, — приблизно за 63 км на північний схід від Єрусалима по прямій. Назва могла означати пагорби по обидва боки Яббоку або всю землю Ізраїлю за річкою, як у словах «Від Йорданї на схід сонця всю землю Галаад»."
    - "Це був край лісів, пасовищ і пахощів. Рувим і Гад побачили, що Гілеад «як раз годяться про скотину», і попросили його, а Мойсей віддав їм «половину гір Гілеад», а «що осталось з Гілеаду» — половині коліна Манассії; Рамот Гілеадський, приблизно за 46 км на північний схід від точки на мапі, був його прикордонною фортецею проти Дамаска. Караван, що купив Йосипа, прийшов «від Галааду з верблюдами своїми, везучи бурштин, бальзам та ладан», а Єремія питає: «Чи то ж нема балзаму в Галаадї? чи то ж нема там лїкаря?» Елія Тішбіянин був «із горожан Галаадських»."
    - "У 733–732 рр. до н. е. Тіглатпаласар III захопив Гілеад і вивів його населення до Ассирії. За новозавітних часів на півночі лежали міста Десятимістя — Гераса, Пелла й Гадара, а на півдні — Перея, земля Ірода Антипи за Йорданом. Нині пагорби навколо Аджлуна, Джераша й Сальта досі вкриті лісами з дуба та сосни."
  es:
    - "Galaad era la región montañosa al este del Jordán, en el actual noroeste de Jordania, entre el Yarmuk, al norte, y la meseta de Moab, al sur, cortada en dos por la garganta del Jaboc. El punto del mapa está en su centro, sobre el Jaboc, en Peniel, uno de los dos montículos gemelos de Tell edh-Dhahab, con Mahanaim en el otro, a unos 63 km al noreste de Jerusalén en línea recta. El nombre podía designar las colinas a ambos lados del Jaboc o toda la tierra de Israel al otro lado del río, como en «Desde el Jordán al nacimiento del sol, toda la tierra de Galaad»."
    - "Era una tierra de bosques, pastos y especias. Rubén y Gad vieron que era «el país lugar de ganado» y la pidieron, y Moisés les dio «la mitad del monte de Galaad» y «el resto de Galaad» a la media tribu de Manasés; Ramot de Galaad, a unos 46 km al noreste del punto del mapa, era su fortaleza fronteriza frente a Damasco. La caravana que compró a José «venía de Galaad, y sus camellos traían aromas y bálsamo y mirra», y Jeremías pregunta: «¿No hay bálsamo en Galaad? ¿no hay allí médico?». Elías el tisbita era «de los moradores de Galaad»."
    - "En 733–732 a. C. Tiglat-pileser III tomó Galaad y llevó a su gente a Asiria. En tiempos del Nuevo Testamento, su norte contenía las ciudades de la Decápolis Gerasa, Pella y Gadara, y su sur era Perea, la tierra de Herodes Antipas al otro lado del Jordán. Hoy las colinas en torno a Ajlún, Jerash y Salt siguen pobladas de bosques de roble y pino."
  pt:
    - "Gileade era a região montanhosa a leste do Jordão, no atual noroeste da Jordânia, entre o Yarmuk, ao norte, e o planalto de Moabe, ao sul, cortada em duas pela garganta do Jaboque. O ponto do mapa fica no seu centro, no Jaboque, em Peniel, um dos montes gêmeos de Tell edh-Dhahab, com Maanaim no outro, a cerca de 63 km a nordeste de Jerusalém em linha reta. O nome podia designar as colinas de um lado e do outro do Jaboque ou toda a terra de Israel além do rio, como em “desde o Jordão para o leste, toda a terra de Gileade”."
    - "Era uma terra de bosques, pastagens e especiarias. Rúben e Gade viram que “o lugar era um lugar para gado” e o pediram, e Moisés deu “metade da região montanhosa de Gileade” a eles e “o restante de Gileade” à meia tribo de Manassés; Ramote-Gileade, a cerca de 46 km a nordeste do ponto do mapa, era a sua fortaleza de fronteira contra Damasco. A caravana que comprou José vinha “de Gileade, com seus camelos carregando especiarias, bálsamo e mirra”, e Jeremias pergunta: “Não há bálsamo em Gileade? Não há médico lá?” Elias, o tesbita, era “um dos moradores de Gileade”."
    - "Em 733–732 a.C., Tiglate-Pileser III tomou Gileade e levou o seu povo para a Assíria. No tempo do Novo Testamento, o norte abrigava as cidades da Decápolis, Gerasa, Pela e Gadara, e o sul era a Pereia, a terra de Herodes Antipas além do Jordão. Hoje as colinas em torno de Ajloun, Jerash e Salt ainda são cobertas de carvalhos e pinheiros."
  de:
    - "Gilead war das Bergland östlich des Jordans, im heutigen Nordwesten Jordaniens, zwischen dem Jarmuk im Norden und der Hochebene von Moab im Süden, vom Tal des Jabbok in zwei Hälften geschnitten. Der Kartenpunkt steht in seiner Mitte, am Jabbok bei Penuel, einem der beiden Zwillingshügel von Tell edh-Dhahab, auf dem anderen liegt Mahanajim, in der Luftlinie etwa 63 km nordöstlich von Jerusalem. Der Name konnte die Berge zu beiden Seiten des Jabbok meinen oder das ganze Land Israels jenseits des Flusses, wie in „vom Jordan gegen der Sonne Aufgang, das Land Gilead“."
    - "Es war ein Land der Wälder, Weiden und Gewürze. Ruben und Gad sahen es an „als gute Stätte für ihr Vieh“ und baten darum, und Mose gab es ihnen „samt dem halben Gebirge Gilead“ und dem halben Stamm Manasse „das übrige Gilead“; Ramot in Gilead, etwa 46 km nordöstlich des Kartenpunkts, war seine Grenzfestung gegen Damaskus. Die Karawane, die Josef kaufte, kam „von Gilead mit ihren Kamelen; die trugen Würze, Balsam und Myrrhe“, und Jeremia fragt: „Ist denn keine Salbe in Gilead, oder ist kein Arzt da?“ Elia, der Tischbiter, war „aus den Bürgern Gileads“."
    - "In den Jahren 733–732 v. Chr. nahm Tiglat-Pileser III. Gilead ein und führte seine Bewohner nach Assyrien. In neutestamentlicher Zeit lagen in seinem Norden die Dekapolis-Städte Gerasa, Pella und Gadara, und sein Süden war Peräa, das Land des Herodes Antipas jenseits des Jordans. Heute sind die Hügel um Adschlun, Dscherasch und As-Salt noch immer mit Eichen und Kiefern bewaldet."
  fr:
    - "Galaad était la région de collines à l’est du Jourdain, dans le nord-ouest de l’actuelle Jordanie, entre le Yarmouk au nord et le plateau de Moab au sud, coupée en deux par la gorge du Jabbok. Le point de la carte se trouve en son milieu, sur le Jabbok, à Peniel, l’un des deux tertres jumeaux de Tell edh-Dhahab, Mahanaïm occupant l’autre, à environ 63 km au nord-est de Jérusalem à vol d’oiseau. Le nom pouvait désigner les collines de part et d’autre du Jabbok ou tout le pays d’Israël au-delà du fleuve, comme dans « Depuis le Jourdain, vers le soleil levant, … tout le pays de Galaad »."
    - "C’était un pays de bois, de pâturages et d’aromates. Ruben et Gad virent que c’était « un lieu propre pour des troupeaux » et le demandèrent, et Moïse leur donna « la moitié de la montagne de Galaad » et « le reste de Galaad » à la demi-tribu de Manassé ; Ramoth en Galaad, à environ 46 km au nord-est du point de la carte, était sa forteresse frontière face à Damas. La caravane qui acheta Joseph venait « de Galaad ; leurs chameaux étaient chargés d’aromates, de baume et de myrrhe », et Jérémie demande : « N’y a-t-il point de baume en Galaad ? N’y a-t-il point de médecin ? » Élie, le Thischbite, était « l’un des habitants de Galaad »."
    - "En 733-732 av. J.-C., Tiglath-Piléser III prit Galaad et emmena ses habitants en Assyrie. Au temps du Nouveau Testament, son nord comprenait les villes de la Décapole que sont Gérasa, Pella et Gadara, et son sud formait la Pérée, le pays d’Hérode Antipas au-delà du Jourdain. Aujourd’hui encore, les collines autour d’Ajloun, de Jerash et de Salt sont boisées de chênes et de pins."
  pl:
    - "Gilead był górzystą krainą na wschód od Jordanu, w dzisiejszej północno-zachodniej Jordanii, między Jarmukiem na północy a płaskowyżem Moabu na południu, przeciętą na dwie części wąwozem Jabboku. Punkt na mapie stoi w jej środku, nad Jabbokiem w Penuel, na jednym z bliźniaczych pagórków Tell edh-Dhahab, z Mahanaim na drugim, około 63 km na północny wschód od Jerozolimy w linii prostej. Nazwa mogła oznaczać wzgórza po obu stronach Jabboku albo całą ziemię Izraela za rzeką, jak w słowach „Od Jordanu aż na wschód słońca, wszystkę ziemię Galaadską”."
    - "Była to ziemia lasów, pastwisk i wonności. Ruben i Gad zobaczyli, że „miejsce ono było sposobne dla bydła”, i poprosili o nią, a Mojżesz dał im „połowę góry Galaad”, a „ostatek Galaadu” połowie pokolenia Manassesa; Ramot w Gileadzie, około 46 km na północny wschód od punktu na mapie, było jego twierdzą graniczną wobec Damaszku. Karawana, która kupiła Józefa, szła „z Galaad; a wielbłądy ich niosły korzenie, i kadzidło, i myrrę”, a Jeremiasz pyta: „Izali niemasz balsamu w Galaad? Izali tam niemasz lekarza?” Eliasz Tiszbita był „jeden z obywateli Galaadu”."
    - "W latach 733–732 p.n.e. Tiglat-Pileser III zajął Gilead i uprowadził jego mieszkańców do Asyrii. W czasach Nowego Testamentu na jego północy leżały miasta Dekapolu Gerasa, Pella i Gadara, a na południu Perea, kraina Heroda Antypasa za Jordanem. Dziś wzgórza wokół Adżlunu, Dżarasz i Salt wciąż porastają dęby i sosny."
  it:
    - "Galaad era la regione collinare a est del Giordano, nell’odierna Giordania nord-occidentale, tra lo Yarmuk a nord e l’altopiano di Moab a sud, divisa in due dalla gola dello Iabbok. Il punto della mappa si trova al suo centro, sullo Iabbok a Penuel, uno dei due tell gemelli di Tell edh-Dhahab, con Maanaim sull’altro, a circa 63 km a nord-est di Gerusalemme in linea d’aria. Il nome poteva indicare le colline su entrambi i lati dello Iabbok o tutta la terra d’Israele al di là del fiume, come in «dal Giordano, verso oriente, … tutto il paese di Galaad»."
    - "Era una terra di boschi, pascoli e aromi. Ruben e Gad videro che «erano luoghi da bestiame» e la chiesero, e Mosè diede a loro «la metà della contrada montuosa di Galaad» e alla mezza tribù di Manasse «il resto di Galaad»; Ramot di Galaad, a circa 46 km a nord-est del punto della mappa, era la sua fortezza di confine contro Damasco. La carovana che comprò Giuseppe «veniva da Galaad, coi suoi cammelli carichi di aromi, di balsamo e di mirra», e Geremia chiede: «Non v’è egli balsamo in Galaad? Non v’è egli colà alcun medico?» Elia il Tishbita era «uno di quelli che s’erano stabiliti in Galaad»."
    - "Nel 733–732 a.C. Tiglat-Pilèser III prese Galaad e deportò la sua popolazione in Assiria. Nei tempi del Nuovo Testamento il suo nord comprendeva le città della Decapoli di Gerasa, Pella e Gadara, e il suo sud era la Perea, la terra di Erode Antipa al di là del Giordano. Oggi le colline attorno ad Ajloun, Jerash e Salt sono ancora boscose di querce e pini."
  cs:
    - "Gilead byla pahorkatina východně od Jordánu, v dnešním severozápadním Jordánsku, mezi Jarmúkem na severu a moábskou náhorní plošinou na jihu, rozdělená soutěskou Jaboku na dvě poloviny. Bod na mapě stojí uprostřed, na Jaboku u Penuelu, jednoho ze dvou pahorků Tell edh-Dhahab, s Machanajim na druhém, vzdušnou čarou asi 63 km severovýchodně od Jeruzaléma. Jméno mohlo znamenat pahorky po obou stranách Jaboku, nebo celou izraelskou zemi za řekou, jako ve větě „Od Jordánu, proti východu slunce, všecku zemi Galád“."
    - "Byla to země lesů, pastvin a vonných věcí. Rúben a Gád viděli, že je to „místo příhodné pro dobytek“, a požádali o ni; Mojžíš dal jim „polovici hory Galád“ a polovině pokolení Manasesova „ostatek Galád“. Rámot v Gileadu, asi 46 km severovýchodně od bodu na mapě, byl jeho pohraniční pevností proti Damašku. Karavana, která koupila Josefa, přicházela „z Galád, kteřížto na velbloudích svých nesli vonné věci a kadidlo a mirru“, a Jeremjáš se ptá: „Což není žádného lékařství v Galád? Což není žádného lékaře tam?“ Elijáš Tišbijský byl „obyvatel Galádský“."
    - "Roku 733–732 př. n. l. dobyl Gilead Tiglatpilesar III. a odvedl jeho obyvatele do Asýrie. V dobách Nového zákona byla na jeho severu dekapolská města Gerasa, Pella a Gadara a jeho jih tvořila Perea, země Heroda Antipy za Jordánem. Dnes jsou pahorky kolem Adžlúnu, Džarašu a Saltu stále zalesněny duby a borovicemi."
  nl:
    - "Gilead was het heuvelland ten oosten van de Jordaan, in het huidige noordwesten van Jordanië, tussen de Jarmuk in het noorden en het plateau van Moab in het zuiden, in tweeën gesneden door de kloof van de Jabbok. Het punt op de kaart staat in het midden, aan de Jabbok bij Peniël, een van de twee heuvels van Tell edh-Dhahab, met Machanaïm op de andere, hemelsbreed ongeveer 63 km ten noordoosten van Jeruzalem. De naam kon de heuvels aan weerszijden van de Jabbok betekenen of het hele land van Israël voorbij de rivier, zoals in “Van de Jordaan af, tegen den opgang der zon, het ganse land van Gilead”."
    - "Het was een land van bossen, weiden en specerijen. Ruben en Gad zagen dat “deze plaats was een plaats voor vee” en vroegen erom, en Mozes gaf “de helft van het gebergte van Gilead” aan hen en “het overige van Gilead” aan de halve stam van Manasse; Ramot in Gilead, ongeveer 46 km ten noordoosten van het punt op de kaart, was de grensvesting tegen Damascus. De karavaan die Jozef kocht kwam “uit Gilead; en hun kemelen droegen specerijen en balsem, en mirre”, en Jeremia vraagt: “Is er geen balsem in Gilead? Is er geen heelmeester aldaar?” Elia de Tisbiet was “van de inwoneren van Gilead”."
    - "In 733–732 v.Chr. nam Tiglat-Pileser III Gilead in en voerde zijn bevolking weg naar Assyrië. In de tijd van het Nieuwe Testament lagen in het noorden de steden van de Dekapolis Gerasa, Pella en Gadara, en het zuiden was Perea, het land van Herodes Antipas aan de overkant van de Jordaan. Tegenwoordig zijn de heuvels rond Ajloun, Jerash en Salt nog steeds met eiken en dennen bebost."
  sv:
    - "Gilead var bergslandet öster om Jordan, i dagens nordvästra Jordanien, mellan Jarmuk i norr och Moabs högslätt i söder, delat i två av Jabboks klyfta. Kartpunkten står i dess mitt, vid Jabbok i Penuel, en av tvillingkullarna Tell edh-Dhahab, med Mahanajim på den andra, omkring 63 km nordost om Jerusalem i fågelvägen. Namnet kunde betyda höjderna på båda sidor om Jabbok eller hela Israels land bortom floden, som i ”östra sidan om Jordan hela landet Gilead”."
    - "Det var ett land av skogar, betesmarker och kryddor. Ruben och Gad fann att trakten var ”en trakt för boskap” och bad om den, och Mose gav ”hälften av Gileads bergsbygd” åt dem och ”återstoden av Gilead” åt Manasses halva stam; Ramot-Gilead, omkring 46 km nordost om kartpunkten, var dess gränsfästning mot Damaskus. Karavanen som köpte Josef kom ”från Gilead, och deras kameler voro lastade med dragantgummi, balsam och ladanum”, och Jeremia frågar: ”Finnes då ingen balsam i Gilead, finnes ingen läkare där?” Tisbiten Elia var ”en man som förut hade uppehållit sig i Gilead”."
    - "År 733–732 f.Kr. intog Tiglat-Pileser III Gilead och förde bort dess folk till Assyrien. På Nya testamentets tid hade dess norra del Dekapolisstäderna Gerasa, Pella och Gadara, och dess södra del var Peraea, Herodes Antipas’ land bortom Jordan. I dag är höjderna kring Ajloun, Jerash och Salt fortfarande skogsklädda med ek och tall."
