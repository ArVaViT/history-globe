id: where-was-caesarea-maritima
question:
  en: "Where was Caesarea, the city of Cornelius?"
  ru: "Где находилась Кесария, город Корнилия?"
  uk: "Де була Кесарія, місто Корнилія?"
  es: "¿Dónde estaba Cesarea, la ciudad de Cornelio?"
  pt: "Onde ficava Cesareia, a cidade de Cornélio?"
  de: "Wo lag Caesarea, die Stadt des Kornelius?"
  fr: "Où se trouvait Césarée, la ville de Corneille ?"
  pl: "Gdzie leżała Cezarea, miasto Korneliusza?"
  it: "Dov’era Cesarea, la città di Cornelio?"
  nl: "Waar lag Caesarea, de stad van Cornelius?"
  cs: "Kde byla Cesarea, město Korneliovo?"
  sv: "Var låg Caesarea, Cornelius stad?"
  nb: "Hvor lå Cæsarea, Kornelius' by?"
  tl: "Saan ang Cesarea, ang lungsod ni Cornelio?"
  da: "Hvor lå Cæsarea, Kornelius' by?"
  sr: "Где је била Цезареја, град Корнилијев?"
  hu: "Hol volt Cézárea, Kornélius városa?"
  fi: "Missä Kesarea, Korneliuksen kaupunki, oli?"
  vi: "Sê-sa-rê, thành của Cọt-nây, ở đâu?"
  ro: "Unde se afla Cezareea, orașul lui Corneliu?"
  bg: "Къде се е намирала Кесария, градът на Корнилий?"
answer:
  en:
    - "Caesarea Maritima, “Caesarea by the sea”, lies on the Mediterranean coast of Israel between Tel Aviv and Haifa, beside the modern town of Caesarea, about 87 km north-north-west of Jerusalem in a straight line; the map point stands on its ruins, now a national park. It is not Caesarea Philippi, the town at the foot of Mount Hermon where Peter confessed Jesus as the Christ, about 112 km to the north-east."
    - "Herod the Great built the city from 22 BC on the site of a small anchorage called Strato's Tower and named it after Augustus. On a coast with no natural harbour he made one, Sebastos, with breakwaters of concrete laid in the open sea, and raised above it a temple of Rome and Augustus, a theatre, a palace on a promontory and an aqueduct. From AD 6 Caesarea was the seat of the Roman governors of Judea; a stone found in its theatre in 1961 names Pontius Pilate. Where Pilate and Paul lived and were held is told in separate questions."
    - "In Acts the city is where the gospel first reached the gentiles. “There was a certain man in Cæsarea called Cornelius, a centurion of the band called the Italian band”; an angel told him to send to Joppa for Peter, and while Peter spoke in his house the Holy Spirit fell on all who heard. Philip the evangelist “preached in all the cities, till he came to Cæsarea” and made his home there. Herod Agrippa I died in Caesarea in AD 44, and Paul was held there two years under Felix and Festus before he sailed for Rome. Strife between the city's Greeks and Jews helped spark the revolt of AD 66; later Origen taught and Eusebius was bishop there."
  ru:
    - "Кесария Приморская лежит на средиземноморском берегу Израиля между Тель-Авивом и Хайфой, рядом с нынешним городком Кесария, примерно в 87 км к северо-северо-западу от Иерусалима по прямой; точка карты стоит на её развалинах, ныне национальном парке. Это не Кесария Филиппова — городок у подножия Ермона, где Пётр исповедал Иисуса Христом, примерно в 112 км к северо-востоку."
    - "Ирод Великий строил город с 22 г. до н. э. на месте небольшой стоянки, называвшейся Башней Стратона, и назвал его в честь Августа. На берегу без естественной гавани он создал её — Себастос, с волнорезами из бетона, отлитыми прямо в открытом море, — и поставил над ней храм Ромы и Августа, театр, дворец на мысу и водопровод. С 6 г. н. э. Кесария была резиденцией римских наместников Иудеи; камень, найденный в её театре в 1961 году, называет Понтия Пилата. Где жил Пилат и где держали Павла, рассказано в отдельных вопросах."
    - "В Деяниях этот город — место, где Евангелие впервые пришло к язычникам. «В Кесарии был некоторый муж, именем Корнилий, сотник из полка, называемого Италийским»; ангел велел ему послать за Петром в Иоппию, и когда Пётр говорил в его доме, Дух Святой сошёл на всех слушавших. Филипп благовестник, «проходя, благовествовал всем городам, пока пришел в Кесарию», и поселился там. В 44 г. н. э. в Кесарии умер Ирод Агриппа I, а Павла держали здесь два года при Феликсе и Фесте, прежде чем он отплыл в Рим. Вражда греков и иудеев города стала одним из поводов к восстанию 66 г. н. э.; позже здесь учил Ориген и был епископом Евсевий."
  uk:
    - "Кесарія Приморська, «Кесарія біля моря», лежить на середземноморському узбережжі Ізраїлю між Тель-Авівом і Хайфою, поряд із сучасним містом Кесарія, приблизно за 87 км на північ-північний захід від Єрусалиму по прямій; точка мапи стоїть на її руїнах, нині національному парку. Це не Кесарія Пилипова, місто біля підніжжя гори Гермон, де Петро визнав Ісуса Христом, приблизно за 112 км на північний схід."
    - "Ірод Великий збудував місто від 22 р. до н. е. на місці невеликого якірного стоянища, званого Вежею Стратона, і назвав його на честь Августа. На узбережжі без природної гавані він створив її, Себастос, із хвилерізами з бетону, покладеного у відкритому морі, і звів над нею храм Рима й Августа, театр, палац на мисі та акведук. З 6 р. н. е. Кесарія була резиденцією римських правителів Юдеї; камінь, знайдений в її театрі 1961 р., називає Понтія Пилата. Де жили й де утримувалися Пилат і Павло, розповідається в окремих питаннях."
    - "У Діях це місто, де євангелія вперше дійшла до язичників. «Був же один чоловік у Кесариї, на ймя Корнелий, сотник із роти, званої Італийською»; ангел сказав йому послати до Яффи по Петра, і поки Петро говорив у його домі, Святий Дух зійшов на всіх, хто слухав. Євангеліст Пилип «проходячи проповідував по всїх городах, аж доки прийшов у Кесарию» і оселився там. Ірод Агриппа I помер у Кесарії 44 р. н. е., а Павла утримували там два роки за Феликса й Феста, перш ніж він відплив до Рима. Чвари між греками та євреями міста допомогли розпалити повстання 66 р. н. е.; пізніше там навчав Оріген, а Євсевій був єпископом."
  es:
    - "Cesarea Marítima, «Cesarea junto al mar», se encuentra en la costa mediterránea de Israel entre Tel Aviv y Haifa, junto a la moderna población de Cesarea, a unos 87 km al nor-noroeste de Jerusalén en línea recta; el punto del mapa está sobre sus ruinas, hoy parque nacional. No es Cesarea de Filipo, la población al pie del monte Hermón donde Pedro confesó a Jesús como el Cristo, a unos 112 km al noreste."
    - "Herodes el Grande construyó la ciudad desde el 22 a. C. en el lugar de un pequeño fondeadero llamado Torre de Estratón y le puso el nombre de Augusto. En una costa sin puerto natural hizo uno, Sebastos, con rompeolas de hormigón colocados en mar abierto, y sobre él levantó un templo de Roma y Augusto, un teatro, un palacio en un promontorio y un acueducto. Desde el 6 d. C. Cesarea fue la sede de los gobernadores romanos de Judea; una piedra hallada en su teatro en 1961 nombra a Poncio Pilato. Dónde vivieron y estuvieron presos Pilato y Pablo se cuenta en preguntas aparte."
    - "En Hechos, la ciudad es donde el evangelio llegó por primera vez a los gentiles. «Y había un varón en Cesarea llamado Cornelio, centurión de la compañía que se llamaba la Italiana»; un ángel le dijo que enviara a Jope por Pedro, y mientras Pedro hablaba en su casa el Espíritu Santo cayó sobre todos los que oían. Felipe el evangelista «anunciaba el evangelio en todas las ciudades, hasta que llegó á Cesarea» y fijó allí su casa. Herodes Agripa I murió en Cesarea en el 44 d. C., y Pablo estuvo preso allí dos años bajo Félix y Festo antes de zarpar hacia Roma. Las disputas entre griegos y judíos de la ciudad contribuyeron a encender la revuelta del 66 d. C.; más tarde Orígenes enseñó allí y Eusebio fue su obispo."
  pt:
    - "Cesareia Marítima, “Cesareia junto ao mar”, fica na costa mediterrânea de Israel entre Tel Aviv e Haifa, junto à atual cidade de Cesareia, a cerca de 87 km a nor-noroeste de Jerusalém em linha reta; o ponto do mapa está em suas ruínas, hoje parque nacional. Não é Cesareia de Filipe, a cidade ao pé do monte Hermom onde Pedro confessou Jesus como o Cristo, a cerca de 112 km a nordeste."
    - "Herodes, o Grande, construiu a cidade a partir de 22 a.C. no local de um pequeno ancoradouro chamado Torre de Estrato e a nomeou em honra de Augusto. Numa costa sem porto natural fez um, Sebastos, com quebra-mares de concreto lançados em mar aberto, e ergueu acima dele um templo de Roma e Augusto, um teatro, um palácio num promontório e um aqueduto. Desde 6 d.C. Cesareia foi a sede dos governadores romanos da Judeia; uma pedra achada em seu teatro em 1961 nomeia Pôncio Pilatos. Onde Pilatos e Paulo viveram e foram detidos é contado em perguntas à parte."
    - "Em Atos, a cidade é onde o evangelho chegou pela primeira vez aos gentios. “Havia em Cesareia um certo homem chamado Cornélio, centurião do chamado Regimento Italiano”; um anjo lhe disse que mandasse buscar Pedro em Jope, e enquanto Pedro falava em sua casa o Espírito Santo caiu sobre todos os que ouviam. Filipe, o evangelista, “pregava o Evangelho em todas as cidades, até chegar a Cesareia” e fez dela sua casa. Herodes Agripa I morreu em Cesareia em 44 d.C., e Paulo foi detido ali dois anos sob Félix e Festo antes de embarcar para Roma. A rixa entre gregos e judeus da cidade ajudou a acender a revolta de 66 d.C.; mais tarde Orígenes ensinou ali e Eusébio foi bispo."
  de:
    - "Caesarea Maritima, „Caesarea am Meer“, liegt an der Mittelmeerküste Israels zwischen Tel Aviv und Haifa, neben der heutigen Stadt Caesarea, in der Luftlinie etwa 87 km nordnordwestlich von Jerusalem; der Kartenpunkt liegt auf seinen Ruinen, heute ein Nationalpark. Es ist nicht Caesarea Philippi, die Stadt am Fuß des Hermon, wo Petrus Jesus als den Christus bekannte, etwa 112 km im Nordosten."
    - "Herodes der Große baute die Stadt ab 22 v. Chr. an der Stelle eines kleinen Ankerplatzes namens Stratonsturm und benannte sie nach Augustus. An einer Küste ohne natürlichen Hafen schuf er einen, Sebastos, mit Wellenbrechern aus Beton, die im offenen Meer verlegt wurden, und errichtete darüber einen Tempel der Roma und des Augustus, ein Theater, einen Palast auf einer Landzunge und eine Wasserleitung. Ab 6 n. Chr. war Caesarea Sitz der römischen Statthalter Judäas; ein 1961 in seinem Theater gefundener Stein nennt Pontius Pilatus. Wo Pilatus und Paulus wohnten und festgehalten wurden, wird in eigenen Fragen erzählt."
    - "In der Apostelgeschichte ist die Stadt der Ort, wo das Evangelium zuerst die Heiden erreichte. „Es war aber ein Mann zu Cäsarea, mit Namen Kornelius, ein Hauptmann von der Schar, die da heißt die italische“; ein Engel sagte ihm, er solle nach Joppe um Petrus senden, und als Petrus in seinem Haus sprach, fiel der Heilige Geist auf alle Hörer. Philippus der Evangelist „predigte allen Städten das Evangelium, bis daß er kam gen Cäsarea“ und ließ sich dort nieder. Herodes Agrippa I. starb 44 n. Chr. in Caesarea, und Paulus wurde dort zwei Jahre unter Felix und Festus festgehalten, ehe er nach Rom segelte. Der Streit zwischen den Griechen und Juden der Stadt trug zum Ausbruch des Aufstands von 66 n. Chr. bei; später lehrte dort Origenes, und Eusebius war dort Bischof."
  fr:
    - "Césarée Maritime, « Césarée-sur-mer », se trouve sur la côte méditerranéenne d’Israël entre Tel-Aviv et Haïfa, à côté de la ville moderne de Césarée, à environ 87 km au nord-nord-ouest de Jérusalem en ligne droite ; le point de la carte est sur ses ruines, aujourd’hui parc national. Ce n’est pas Césarée de Philippe, la ville au pied du mont Hermon où Pierre confessa Jésus comme le Christ, à environ 112 km au nord-est."
    - "Hérode le Grand bâtit la ville à partir de 22 av. J.-C. sur le site d’un petit mouillage appelé la Tour de Straton et la nomma en l’honneur d’Auguste. Sur une côte sans port naturel, il en fit un, Sebastos, avec des brise-lames de béton posés en pleine mer, et éleva au-dessus un temple de Rome et d’Auguste, un théâtre, un palais sur un promontoire et un aqueduc. À partir de 6 apr. J.-C., Césarée fut le siège des gouverneurs romains de Judée ; une pierre trouvée dans son théâtre en 1961 nomme Ponce Pilate. Où Pilate et Paul vécurent et furent gardés est traité dans des questions à part."
    - "Dans les Actes, la ville est le lieu où l’Évangile atteignit d’abord les païens. « Il y avait à Césarée un homme nommé Corneille, centenier dans la cohorte dite italienne » ; un ange lui dit d’envoyer chercher Pierre à Joppé, et pendant que Pierre parlait dans sa maison le Saint-Esprit descendit sur tous ceux qui écoutaient. Philippe l’évangéliste alla jusqu’à Césarée, « en évangélisant toutes les villes par lesquelles il passait », et s’y établit. Hérode Agrippa Ier mourut à Césarée en 44 apr. J.-C., et Paul y fut gardé deux ans sous Félix et Festus avant de s’embarquer pour Rome. Les querelles entre Grecs et Juifs de la ville aidèrent à allumer la révolte de 66 apr. J.-C. ; plus tard Origène y enseigna et Eusèbe en fut évêque."
  pl:
    - "Cezarea Nadmorska, „Cezarea nad morzem”, leży na wybrzeżu Morza Śródziemnego w Izraelu między Tel Awiwem a Hajfą, obok współczesnego miasta Cezarea, około 87 km na północ-północny zachód od Jerozolimy w linii prostej; punkt na mapie stoi na jej ruinach, dziś parku narodowym. To nie Cezarea Filipowa, miasto u stóp Hermonu, gdzie Piotr wyznał Jezusa jako Chrystusa, około 112 km na północny wschód."
    - "Herod Wielki zbudował miasto od 22 p.n.e. na miejscu małego zakotwiczenia zwanego Wieżą Stratona i nazwał je na cześć Augusta. Na wybrzeżu bez naturalnego portu stworzył jeden, Sebastos, z falochronami z betonu układanego na otwartym morzu, i wzniósł nad nim świątynię Rzymu i Augusta, teatr, pałac na cyplu i akwedukt. Od 6 n.e. Cezarea była siedzibą rzymskich namiestników Judei; kamień znaleziony w jej teatrze w 1961 wymienia Poncjusza Piłata. Gdzie Piłat i Paweł mieszkali i byli przetrzymywani, opowiadają osobne pytania."
    - "W Dziejach jest to miasto, w którym Ewangelia po raz pierwszy dotarła do pogan. „A w Cezaryi był mąż niektóry, imieniem Kornelijusz, setnik, z roty, którą zwano Włoską”; anioł kazał mu posłać do Jafy po Piotra, a gdy Piotr przemawiał w jego domu, Duch Święty zstąpił na wszystkich słuchających. Filip ewangelista „kazał Ewangieliję po wszystkich miastach, aż przyszedł do Cezaryi” i tam zamieszkał. Herod Agryppa I zmarł w Cezarei w 44 n.e., a Paweł był tam trzymany dwa lata za Feliksa i Festusa, zanim popłynął do Rzymu. Spór między Grekami a Żydami w mieście pomógł wzniecić powstanie z 66 n.e.; później nauczał tam Orygenes, a biskupem był Euzebiusz."
  it:
    - "Cesarea Marittima, «Cesarea sul mare», sorge sulla costa mediterranea di Israele tra Tel Aviv e Haifa, accanto alla moderna cittadina di Cesarea, a circa 87 km a nord-nord-ovest di Gerusalemme in linea retta; il punto della mappa sta sulle sue rovine, oggi parco nazionale. Non è Cesarea di Filippo, la città ai piedi del Monte Ermon dove Pietro confessò Gesù come il Cristo, a circa 112 km a nord-est."
    - "Erode il Grande costruì la città dal 22 a.C. sul sito di un piccolo approdo chiamato Torre di Stratone e le diede il nome di Augusto. Su una costa priva di porto naturale ne creò uno, Sebasto, con frangiflutti di calcestruzzo posati in mare aperto, e sopra di esso innalzò un tempio di Roma e di Augusto, un teatro, un palazzo su un promontorio e un acquedotto. Dal 6 d.C. Cesarea fu la sede dei governatori romani della Giudea; una pietra trovata nel suo teatro nel 1961 nomina Ponzio Pilato. Dove Pilato e Paolo vissero e furono tenuti è detto in domande separate."
    - "Negli Atti la città è dove il Vangelo raggiunse per la prima volta i gentili: «v’era in Cesarea un uomo, chiamato Cornelio, centurione della coorte detta l’ “Italica”»; un angelo gli disse di mandare a Giaffa per Pietro, e mentre Pietro parlava in casa sua lo Spirito Santo cadde su tutti coloro che udivano. Filippo l’evangelista «evangelizzò tutte le città, finché venne a Cesarea» e vi pose casa. Erode Agrippa I morì a Cesarea nel 44 d.C., e Paolo vi fu tenuto due anni sotto Felice e Festo prima di salpare per Roma. Le contese tra Greci e Giudei della città contribuirono a innescare la rivolta del 66 d.C.; più tardi vi insegnò Origene ed Eusebio ne fu vescovo."
  nl:
    - "Caesarea Maritima, “Caesarea aan zee”, ligt aan de Middellandse Zeekust van Israël tussen Tel Aviv en Haifa, naast de moderne stad Caesarea, hemelsbreed ongeveer 87 km noord-noordwestelijk van Jeruzalem; het punt op de kaart staat op haar ruïnes, nu een nationaal park. Het is niet Caesarea Filippi, de stad aan de voet van de Hermon waar Petrus Jezus als de Christus beleed, ongeveer 112 km naar het noordoosten."
    - "Herodes de Grote bouwde de stad vanaf 22 v.Chr. op de plaats van een kleine ankerplaats genaamd Stratonstoren en noemde haar naar Augustus. Aan een kust zonder natuurlijke haven maakte hij er een, Sebastos, met golfbrekers van beton in open zee, en liet erboven een tempel van Rome en Augustus verrijzen, een theater, een paleis op een landtong en een aquaduct. Vanaf 6 n.Chr. was Caesarea de zetel van de Romeinse gouverneurs van Judea; een steen die in 1961 in het theater werd gevonden, noemt Pontius Pilatus. Waar Pilatus en Paulus woonden en gevangen werden gehouden, staat in afzonderlijke vragen."
    - "In Handelingen is de stad de plaats waar het evangelie voor het eerst de heidenen bereikte. “Er was een zeker man te Cesarea, met name Cornelius, een hoofdman over honderd, uit de bende, genaamd de Italiaanse”; een engel zei hem naar Joppe te zenden voor Petrus, en terwijl Petrus in zijn huis sprak, viel de Heilige Geest op allen die hoorden. Van Filippus de evangelist staat: “het land doorgaande, verkondigde hij het Evangelie in alle steden, totdat hij te Cesarea kwam”, en hij vestigde zich daar. Herodes Agrippa I stierf in Caesarea in 44 n.Chr., en Paulus werd er twee jaar vastgehouden onder Felix en Festus voordat hij naar Rome voer. Twist tussen de Grieken en Joden van de stad hielp de opstand van 66 n.Chr. ontsteken; later onderwees Origenes er en was Eusebius er bisschop."
  cs:
    - "Cesarea Maritima, „Cesarea u moře“, leží na středomořském pobřeží Izraele mezi Tel Avivem a Haifou, vedle dnešního města Caesarea, asi 87 km severoseverozápadně od Jeruzaléma vzdušnou čarou; bod na mapě stojí na jejích zříceninách, dnes národním parku. Není to Cesarea Filipova, město na úpatí Hermonu, kde Petr vyznal Ježíše jako Krista, asi 112 km na severovýchod."
    - "Herodes Veliký vystavěl město od roku 22 př. n. l. na místě malého kotviště zvaného Stratonova věž a pojmenoval je po Augustovi. Na pobřeží bez přirozeného přístavu vytvořil přístav, Sebastos, s vlnolamy z betonu uloženého na otevřeném moři, a nad ním postavil chrám Říma a Augusta, divadlo, palác na výběžku a akvadukt. Od roku 6 n. l. byla Cesarea sídlem římských místodržících Judska; kámen nalezený roku 1961 v jejím divadle jmenuje Pontia Piláta. Kde Pilát a Pavel žili a byli drženi, vyprávějí samostatné otázky."
    - "Ve Skutcích je to město, kam evangelium poprvé dosáhlo pohanů. „Muž pak nějaký byl v Cesarii, jménem Kornelius, setník, z zástupu, kterýž sloul Vlaský“; anděl mu řekl, aby poslal do Joppe pro Petra, a zatímco Petr mluvil v jeho domě, sestoupil Duch svatý na všechny, kdo slyšeli. Filip evangelista „chodě, kázal evangelium všem městům, až přišel do Cesaree“ a usadil se tam. Herodes Agrippa I. zemřel v Cesareji roku 44 n. l. a Pavel tam byl držen dva roky za Felixe a Festa, než se plavil do Říma. Spory mezi řeckými a židovskými obyvateli města pomohly zažehnout povstání roku 66 n. l.; později tam učil Origenes a Eusebios byl biskupem."
  sv:
    - "Caesarea Maritima, ”Caesarea vid havet”, ligger vid Israels medelhavskust mellan Tel Aviv och Haifa, intill den moderna staden Caesarea, omkring 87 km nord-nordväst om Jerusalem fågelvägen; kartpunkten står på dess ruiner, nu en nationalpark. Det är inte Caesarea Filippi, staden vid foten av Hermon där Petrus bekände Jesus som Kristus, omkring 112 km åt nordost."
    - "Herodes den store byggde staden från 22 f.Kr. på platsen för en liten ankarplats som hette Stratons torn och uppkallade den efter Augustus. På en kust utan naturlig hamn skapade han en, Sebastos, med vågbrytare av betong lagda i öppet hav, och reste ovanför den ett tempel för Rom och Augustus, en teater, ett palats på en udde och en akvedukt. Från år 6 e.Kr. var Caesarea säte för de romerska ståthållarna i Judeen; en sten som hittades i dess teater 1961 nämner Pontius Pilatus. Var Pilatus och Paulus bodde och hölls berättas i separata frågor."
    - "I Apostlagärningarna är staden platsen där evangeliet först nådde hedningarna. ”I Cesarea bodde en man vid namn Kornelius, en hövitsman vid den så kallade italiska krigsskaran”; en ängel sade åt honom att sända till Joppe efter Petrus, och medan Petrus talade i hans hus föll den helige Ande ”på alla dem som hörde hans tal”. Evangelisten Filippos ”förkunnade evangelium i alla städer, till dess han kom till Cesarea” och gjorde sitt hem där. Herodes Agrippa I dog i Caesarea år 44 e.Kr., och Paulus hölls där i två år under Felix och Festus innan han seglade till Rom. Stridigheter mellan stadens greker och judar bidrog till att utlösa upproret år 66 e.Kr.; senare undervisade Origenes och Eusebios var biskop där."
  nb:
    - "Cæsarea Maritima, «Cæsarea ved havet», ligger på Israels Middelhavskyst mellom Tel Aviv og Haifa, ved siden av den moderne byen Cæsarea, omtrent 87 km nord-nordvest for Jerusalem i luftlinje; kartpunktet står på ruinene, nå en nasjonalpark. Det er ikke Cæsarea Filippi, byen ved foten av Hermon der Peter bekjente Jesus som Messias, omtrent 112 km mot nordøst."
    - "Herodes den store bygget byen fra 22 f.Kr. på stedet for en liten ankerplass kalt Stratons tårn og oppkalte den etter Augustus. På en kyst uten naturlig havn laget han en, Sebastos, med molo av betong lagt ut i åpent hav, og reiste over den et tempel for Roma og Augustus, et teater, et palass på en odde og en akvedukt. Fra 6 e.Kr. var Cæsarea sete for de romerske landshøvdingene i Judea; en stein funnet i teateret i 1961 nevner Pontius Pilatus. Hvor Pilatus og Paulus bodde og ble holdt, fortelles i egne spørsmål."
    - "I Apostlenes gjerninger er byen stedet der evangeliet først nådde hedningene. «Det var en mann i Cesarea ved navn Kornelius, høvedsmann ved den hærdeling som kaltes den italiske»; en engel ba ham sende til Jaffa etter Peter, og mens Peter talte i huset hans, falt Den hellige ånd på alle som hørte. Evangelisten Filip «forkynte evangeliet i alle byene, inntil han kom til Cesarea» og tok bolig der. Herodes Agrippa I døde i Cæsarea i 44 e.Kr., og Paulus ble holdt der i to år under Feliks og Festus før han seilte til Roma. Strid mellom byens grekere og jøder var med på å tenne opprøret i 66 e.Kr.; senere underviste Origenes der, og Eusebius var biskop der."
  tl:
    - "Ang Cesarea Maritima, “Cesarea sa tabi ng dagat”, ay nasa baybayin ng Mediteraneo ng Israel sa pagitan ng Tel Aviv at Haifa, sa tabi ng makabagong bayan ng Cesarea, mga 87 km sa hilaga-hilagang-kanluran ng Jerusalem sa tuwid na guhit; ang tuldok sa mapa ay nasa mga guho nito, pambansang liwasan ngayon. Hindi ito ang Cesarea ni Filipo, ang bayan sa paanan ng Bundok Hermon kung saan ipinahayag ni Pedro na si Jesus ang Cristo, mga 112 km sa hilagang-silangan."
    - "Itinayo ni Herodes na Dakila ang lungsod mula 22 BK sa pook ng maliit na daungan na tinatawag na Tore ni Strato at pinangalanan itong Augusto. Sa baybaying walang likas na daungan, gumawa siya ng isa, ang Sebastos, na may mga pangpigil-alon na kongkreto sa bukas na dagat, at nagtayo sa ibabaw nito ng templo ng Roma at Augusto, teatro, palasyo sa tangos at akwedukto. Mula 6 AD, luklukan ang Cesarea ng mga gobernador na Romano ng Judea; may batong natagpuan sa teatro nito noong 1961 na nagpapangalan kay Poncio Pilato. Ang tinirhan at kinulungan nina Pilato at Pablo ay isinasalaysay sa hiwalay na mga tanong."
    - "Sa Mga Gawa, ang lungsod ang unang pinaabot ng ebanghelyo sa mga hentil. “May isang lalake nga sa Cesarea, na nagngangalang Cornelio, senturion ng pulutong na tinatawag na pulutong Italiano”; sinabihan siya ng anghel na magsugo sa Joppa para kay Pedro, at habang nagsasalita si Pedro sa kaniyang bahay, bumaba ang Espiritu Santo sa lahat ng nakarinig. Tungkol kay Felipe na ebanghelista: “ipinangaral niya ang evangelio sa lahat ng mga bayan, hanggang sa dumating siya sa Cesarea”, at doon siya tumira. Namatay si Herodes Agripa I sa Cesarea noong 44 AD, at ibinilanggo roon si Pablo nang dalawang taon sa ilalim nina Felix at Festo bago maglayag patungong Roma. Ang alitan ng mga Griyego at Judio ng lungsod ay nakatulong sa pagsiklab ng paghihimagsik noong 66 AD; kalaunan ay nagturo roon si Origenes at naging obispo si Eusebio."
  da:
    - "Cæsarea Maritima, »Cæsarea ved havet«, ligger på Israels middelhavskyst mellem Tel Aviv og Haifa, ved siden af den moderne by Caesarea, omkring 87 km nordnordvest for Jerusalem i luftlinje; kortets punkt står på dens ruiner, nu en nationalpark. Det er ikke Cæsarea Filippi, byen ved foden af Hermon, hvor Peter bekendte Jesus som Kristus, omkring 112 km mod nordøst."
    - "Herodes den Store byggede byen fra 22 f.Kr. på stedet for et lille ankerleje kaldet Stratons Tårn og opkaldte den efter Augustus. På en kyst uden naturlig havn skabte han en, Sebastos, med bølgebrydere af beton lagt i åbent hav, og rejste over den et tempel for Rom og Augustus, et teater, et palads på et forbjerg og et akvædukt. Fra 6 e.Kr. var Cæsarea sæde for de romerske landshøvdinge i Judæa; en sten fundet i dens teater i 1961 nævner Pontius Pilatus. Hvor Pilatus og Paulus boede og blev holdt, fortælles i særskilte spørgsmål."
    - "I Apostlenes Gerninger er byen stedet, hvor evangeliet første gang nåede hedningerne: »en Mand i Kæsarea ved Navn Kornelius, en Høvedsmand ved den Afdeling, som kaldes den italienske«; en engel bad ham sende bud til Joppe efter Peter, og mens Peter talte i hans hus, faldt Helligånden over alle, der hørte det. Evangelisten Filip »drog omkring og forkyndte Evangeliet i alle Byerne, indtil han kom til Kæsarea« og tog bolig dér. Herodes Agrippa I døde i Cæsarea i 44 e.Kr., og Paulus blev holdt dér i to år under Felix og Festus, før han sejlede til Rom. Strid mellem byens grækere og jøder var med til at udløse oprøret i 66 e.Kr.; senere underviste Origenes, og Eusebios var biskop dér."
  sr:
    - "Цезареја Маритима, „Цезареја на мору“, лежи на средоземној обали Израела између Тел Авива и Хаифе, поред савременог градића Цезареје, око 87 км северо-северозападно од Јерусалима правом линијом; тачка на карти стоји на њеним рушевинама, данас националном парку. То није Цезареја Филипова, град у подножју Хермона где је Петар исповедио Исуса као Христа, око 112 км североисточно."
    - "Ирод Велики саградио је град од 22. п. н. е. на месту мале сидришне луке зване Стратонова кула и назвао га по Августу. На обали без природне луке направио је једну, Себастос, са лукобранима од бетона положеног у отворено море, и подигао изнад ње храм Рима и Августа, позориште, палату на рту и аквадукт. Од 6. н. е. Цезареја је била седиште римских намесника Јудеје; камен пронађен у њеном позоришту 1961. именује Понтија Пилата. Где су Пилат и Павле живели и били држани, прича се у посебним питањима."
    - "У Делима то је град где је еванђеље први пут стигло до незнабожаца. „А у Ћесарији беше један човек по имену Корнилије, капетан од чете која се зваше талијанска“; анђео му је рекао да пошаље у Јопу по Петра, и док је Петар говорио у његовој кући, Дух Свети пао је на све који су слушали. Филип јеванђелист, о коме стоји „пролазећи проповедаше јеванђеље свима градовима, док не дође у Ћесарију“, настанио се тамо. Ирод Агрипа I умро је у Цезареји 44. н. е., а Павле је ту држан две године под Филиксом и Фистом пре него што је запловио за Рим. Свађа између грчког и јеврејског становништва града помогла је да букне устанак 66. н. е.; касније је Ориген ту поучавао, а Јевсевије био епископ."
  hu:
    - "Caesarea Maritima, „a tengeri Cézárea” Izrael földközi-tengeri partján fekszik Tel Aviv és Haifa között, a mai Cézárea város mellett, Jeruzsálemtől egyenes vonalban mintegy 87 km-re észak-északnyugatra; a térképi pont romjain áll, amelyek ma nemzeti park. Nem azonos Fülöp Cézáreájával, a Hermon lábánál fekvő várossal, ahol Péter Krisztusnak vallotta Jézust, mintegy 112 km-re északkeletre."
    - "Nagy Heródes Kr. e. 22-től építette a várost a Sztratón tornya nevű kis horgonyzóhely helyén, és Augusztusról nevezte el. A természetes kikötő nélküli parton kikötőt csinált, a Sebastost, nyílt tengerbe rakott beton hullámtörőkkel, és fölé Róma és Augusztus templomát, színházat, a hegyfokon palotát és vízvezetéket emelt. Kr. u. 6-tól Cézárea Júdea római helytartóinak székhelye volt; egy 1961-ben a színházában talált kő megnevezi Poncius Pilátust. Hogy hol lakott Pilátus, és hol tartották fogva Pált, külön kérdések mondják el."
    - "Az Apostolok cselekedeteiben a város az, ahol az evangélium először elérte a pogányokat. „Vala pedig Czézáreában egy Kornélius nevű férfiú, százados az úgynevezett itáliai seregből”; angyal mondta neki, hogy küldjön Joppéba Péterért, és míg Péter a házában beszélt, a Szentlélek leszállt mindazokra, akik hallották. Fülöp evangélista „széjjeljárva hirdeté az evangyéliomot minden városnak, míglen Czézáreába juta”, és ott telepedett le. I. Heródes Agrippa Kr. u. 44-ben halt meg Cézáreában, Pált pedig két évig tartották ott fogva Félix és Fesztusz alatt, mielőtt Rómába hajózott. A város görögjei és zsidói közötti viszály segített kirobbantani a Kr. u. 66-os felkelést; később Órigenész tanított, Eusebius pedig püspök volt itt."
  fi:
    - "Kesarea Maritima, ”Kesarea meren rannalla”, sijaitsee Israelin Välimeren rannikolla Tel Avivin ja Haifan välissä nykyisen Kesarean kaupungin vieressä, noin 87 km Jerusalemista pohjois-luoteeseen linnuntietä; karttapiste on sen raunioilla, jotka ovat nykyään kansallispuisto. Se ei ole Filippoksen Kesarea, kaupunki Hermonvuoren juurella, jossa Pietari tunnusti Jeesuksen Kristukseksi, noin 112 km koilliseen."
    - "Herodes Suuri rakensi kaupungin vuodesta 22 eaa. alkaen pienen Stratonin tornin ankkuripaikan paikalle ja nimesi sen Augustuksen mukaan. Rannikolle, jolla ei ollut luonnollista satamaa, hän teki sellaisen, Sebastoksen, avomerelle laskettuine betonisine aallonmurtajineen, ja rakensi sen yläpuolelle Rooman ja Augustuksen temppelin, teatterin, palatsin niemelle ja vesijohdon. Vuodesta 6 jaa. Kesarea oli Rooman käskynhaltijoiden asuinpaikka; sen teatterista vuonna 1961 löydetty kivi mainitsee Pontius Pilatuksen. Missä Pilatus ja Paavali asuivat ja olivat vangittuina, kerrotaan erillisissä kysymyksissä."
    - "Apostolien teoissa kaupunki on paikka, jossa evankeliumi tavoitti ensimmäisen kerran pakanat. ”Kesareassa oli mies, nimeltä Kornelius, sadanpäämies niin kutsutussa italialaisessa sotaväenosastossa”; enkeli käski hänen lähettää Joppeen noutamaan Pietaria, ja Pietarin puhuessa hänen talossaan Pyhä Henki tuli kaikkien päälle, jotka kuulivat. Evankelista Filippos ”julisti evankeliumia kaikissa kaupungeissa, kunnes tuli Kesareaan” ja asettui sinne. Herodes Agrippa I kuoli Kesareassa vuonna 44 jaa., ja Paavalia pidettiin siellä kaksi vuotta Felixin ja Festuksen alaisena ennen kuin hän purjehti Roomaan. Kaupungin kreikkalaisten ja juutalaisten välinen kiista auttoi sytyttämään vuoden 66 jaa. kapinan; myöhemmin Origenes opetti siellä ja Eusebios oli siellä piispa."
  vi:
    - "Sê-sa-rê Maritima, “Sê-sa-rê bên biển”, nằm trên bờ Địa Trung Hải của Israel giữa Tel Aviv và Haifa, cạnh thị trấn Caesarea hiện đại, cách Giê-ru-sa-lem khoảng 87 km về phía bắc-tây bắc theo đường thẳng; điểm bản đồ đứng trên tàn tích của nó, nay là một công viên quốc gia. Nó không phải Sê-sa-rê Phi-líp, thị trấn dưới chân núi Hẹt-môn nơi Phi-e-rơ xưng Giê-su là Đấng Christ, cách khoảng 112 km về phía đông bắc."
    - "Hê-rốt Đại đế xây thành từ năm 22 TCN trên chỗ một bến neo nhỏ tên là Tháp Strato và đặt tên theo Au-gút-tơ. Trên một bờ biển không có hải cảng tự nhiên, ông làm ra một cảng, Sebastos, với đê chắn sóng bằng bê tông đặt giữa biển khơi, và dựng phía trên một đền thờ Rô-ma và Au-gút-tơ, một nhà hát, một cung điện trên mũi đất và một ống dẫn nước. Từ năm 6, Sê-sa-rê là trụ sở các tổng đốc La Mã của Judea; một khối đá tìm thấy trong nhà hát của nó năm 1961 nêu tên Bôn-xơ Phi-lát. Phi-lát và Phao-lô sống và bị giam ở đâu được kể trong các câu hỏi riêng."
    - "Trong sách Công vụ, thành là nơi Tin Lành lần đầu đến với dân ngoại. “Trong thành Sê-sa-rê, có một người tên là Cọt-nây, làm đội trưởng của đội binh gọi là Y-ta-li”; thiên sứ bảo ông sai người đến Giốp-bê tìm Phi-e-rơ, và khi Phi-e-rơ nói trong nhà ông, Đức Thánh Linh giáng trên mọi người nghe. Phi-líp, người truyền giảng, đi “đến thành Sê-sa-rê, cũng giảng Tin Lành khắp những thành nào mình đã ghé qua”, rồi lập nhà ở đó. Hê-rốt Ạc-ríp-ba I chết ở Sê-sa-rê năm 44, và Phao-lô bị giam ở đó hai năm dưới Phê-lít và Phê-tu trước khi dong buồm đến Rô-ma. Xung đột giữa người Hy Lạp và người Do Thái của thành góp phần châm ngòi cuộc nổi dậy năm 66; về sau Origen dạy học và Eusebius làm giám mục ở đó."
  ro:
    - "Cezareea Maritimă, „Cezareea de lângă mare”, se află pe coasta mediteraneană a Israelului, între Tel Aviv și Haifa, lângă orașul modern Cezareea, la circa 87 km nord-nord-vest de Ierusalim în linie dreaptă; punctul de pe hartă stă pe ruinele ei, azi parc național. Nu este Cezareea lui Filip, orașul de la poalele Muntelui Hermon unde Petru l-a mărturisit pe Isus ca Hristos, la circa 112 km spre nord-est."
    - "Irod cel Mare a zidit orașul din 22 î.Hr. pe locul unui mic ancoraj numit Turnul lui Strato și l-a numit după Augustus. Pe o coastă fără port natural, a făcut unul, Sebastos, cu diguri de beton așezate în largul mării, și a ridicat deasupra lui un templu al Romei și al lui Augustus, un teatru, un palat pe un promontoriu și un apeduct. Din 6 d.Hr., Cezareea a fost reședința guvernatorilor romani ai Iudeei; o piatră găsită în teatrul ei în 1961 îl numește pe Pontiu Pilat. Unde au locuit și au fost ținuți Pilat și Pavel se spune în întrebări aparte."
    - "În Faptele Apostolilor, orașul este locul unde Evanghelia a ajuns întâia oară la neamuri: „un bărbat oarecare erà în Chesariea, anume Cornilie, sutaș din ceata ce se chemà Italienească”; un înger i-a spus să trimită la Iafo după Petru, iar în timp ce Petru vorbea în casa lui, Duhul Sfânt a căzut peste toți cei ce auzeau. Evanghelistul Filip „binevesteà în toate cetățile, până a venit el la Chesariea” și și-a făcut acolo casa. Irod Agripa I a murit la Cezareea în 44 d.Hr., iar Pavel a fost ținut acolo doi ani sub Felix și Festus, înainte de a pleca pe mare spre Roma. Conflictul dintre grecii și evreii orașului a ajutat la aprinderea răscoalei din 66 d.Hr.; mai târziu, Origen a predat acolo, iar Eusebiu a fost episcop."
  bg:
    - "Кесария Морска, „Кесария край морето“, лежи на средиземноморския бряг на Израел между Тел Авив и Хайфа, до съвременния град Кесария, на около 87 км север-северозападно от Йерусалим по права линия; точката на картата стои на руините ѝ, днес национален парк. Това не е Кесария Филипова — градът в подножието на Ермон, където Петър изповядал Исус като Христос, на около 112 км на североизток."
    - "Ирод Велики построил града от 22 г. пр.н.е. на мястото на малко котвено място, наречено Стратоновата кула, и го нарекъл в чест на Август. На бряг без естествено пристанище той направил такова — Себастос, с вълноломи от бетон, положени в открито море, — и издигнал над него храм на Рим и Август, театър, дворец на нос и акведукт. От 6 г. н.е. Кесария била седалище на римските управители на Юдея; камък, открит в театъра ѝ през 1961 г., назовава Понтий Пилат. Къде са живели и къде са държани Пилат и Павел, се разказва в отделни въпроси."
    - "В Деяния градът е мястото, където благовестието за пръв път стигнало до езичниците. „Имаше пак некой си человек в Кесария на име Корнилий, стотник от полкът нарицаемия Италийски“; ангел му казал да прати в Яфа за Петър, и докато Петър говорел в дома му, Светият Дух слязъл върху всички, които слушали. Благовестникът Филип „проповедваше евангелието по всичките градове докле дойде в Кесария“ и се заселил там. Ирод Агрипа I умрял в Кесария през 44 г. н.е., а Павел бил държан там две години при Феликс и Фест, преди да отплава за Рим. Враждата между гърците и юдеите в града помогнала да избухне въстанието от 66 г. н.е.; по-късно там поучавал Ориген и бил епископ Евсевий."
