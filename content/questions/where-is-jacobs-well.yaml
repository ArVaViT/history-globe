id: where-is-jacobs-well
question:
  en: "Where is Jacob's well?"
  ru: "Где находится колодец Иакова?"
  uk: "Де колодязь Якова?"
  es: "¿Dónde está el pozo de Jacob?"
  pt: "Onde fica o poço de Jacó?"
  de: "Wo ist der Jakobsbrunnen?"
  fr: "Où est le puits de Jacob ?"
  pl: "Gdzie jest studnia Jakuba?"
  it: "Dov’è il pozzo di Giacobbe?"
  nl: "Waar is de put van Jakob?"
  cs: "Kde je Jákobova studna?"
  sv: "Var ligger Jakobs brunn?"
  nb: "Hvor er Jakobs brønn?"
  tl: "Nasaan ang balon ni Jacob?"
  da: "Hvor er Jakobs brønd?"
  sr: "Где је Јаковљев бунар?"
  hu: "Hol van Jákób kútja?"
  fi: "Missä Jaakobin kaivo on?"
  vi: "Giếng Gia-cốp ở đâu?"
  ro: "Unde se află fântâna lui Iacov?"
  bg: "Къде е Якововият кладенец?"
answer:
  en:
    - "At the eastern edge of Nablus in the West Bank, where the pass between Mount Gerizim and Mount Ebal opens on to the plain: the well lies at the foot of Gerizim, a few hundred metres from the mound of ancient Shechem, Tell Balata, and about a kilometre south of the village of Askar, where the map places Sychar. Jerusalem is 49 km to the south and Nazareth 54 km to the north, so the well stands about halfway on the road from Judaea to Galilee through Samaria. It is one of the few holy places of the Gospels whose identification almost no one disputes, kept today in the crypt of the Greek Orthodox church of St Photini, the name tradition gives the Samaritan woman."
    - "John sets the scene: Jesus “cometh he to a city of Samaria, which is called Sychar, near to the parcel of ground that Jacob gave to his son Joseph. Now Jacob's well was there. Jesus therefore, being wearied with his journey, sat thus on the well: and it was about the sixth hour.” The woman objects, “thou hast nothing to draw with, and the well is deep”, and asks, “Art thou greater than our father Jacob, which gave us the well, and drank thereof himself, and his children, and his cattle?” Pointing to Gerizim she says, “Our fathers worshipped in this mountain”. Genesis knows the field but not the well: Jacob “bought a parcel of a field, where he had spread his tent, at the hand of the children of Hamor, Shechem's father, for an hundred pieces of money”, and in it Joseph's bones were buried, as Joshua records."
    - "The well is cut through rock and is deep: Henry Maundrell in 1697 gave thirty-five yards, 105 feet or about 32 m, and the Survey of Western Palestine (1882) found 75 feet, about 23 m, after centuries of rubbish; it has since been cleared. A church stood over it by the 380s, when Jerome's Paula visited; the pilgrim Arculf about 680 saw a cruciform church with the well at its centre; the Crusaders rebuilt it, and after its ruin the Greek Orthodox bought the site about 1860 and finished the present church in 2007. Joseph's traditional tomb lies a few hundred metres to the north. On Gerizim above, the Samaritans' temple stood, by its excavator's dating, from the fifth century BC until John Hyrcanus destroyed it, and they still keep Passover on the mountain."
  ru:
    - "На восточной окраине Наблуса на Западном берегу, где проход между горами Гаризим и Гевал открывается на равнину: колодец лежит у подножия Гаризима, в нескольких сотнях метров от холма древнего Сихема, Телль-Балаты, и примерно в километре к югу от деревни Аскар, куда карта помещает Сихарь. Иерусалим — в 49 км к югу, Назарет — в 54 км к северу, так что колодец стоит примерно на полпути из Иудеи в Галилею через Самарию. Это одно из немногих святых мест Евангелий, чьё отождествление почти никто не оспаривает; сегодня он хранится в крипте греческой православной церкви святой Фотинии — так предание зовёт самарянку."
    - "Иоанн задаёт место действия: Иисус «приходит Он в город Самарийский, называемый Сихарь, близ участка земли, данного Иаковом сыну своему Иосифу. Там был колодезь Иаковлев. Иисус, утрудившись от пути, сел у колодезя. Было около шестого часа». Женщина возражает: «тебе и почерпнуть нечем, а колодезь глубок» — и спрашивает: «Неужели ты больше отца нашего Иакова, который дал нам этот колодезь и сам из него пил, и дети его, и скот его?» Указывая на Гаризим, она говорит: «Отцы наши поклонялись на этой горе». Бытие знает поле, но не колодец: Иаков «купил часть поля, на котором раскинул шатер свой, у сынов Еммора, отца Сихемова, за сто монет», и в нём, как записано у Иисуса Навина, похоронили кости Иосифа."
    - "Колодец высечен в скале и глубок: Генри Маундрелл в 1697 году назвал тридцать пять ярдов, 105 футов, около 32 м, а Обзор Западной Палестины (1882) — 75 футов, около 23 м, после столетий мусора; с тех пор его расчистили. Церковь стояла над ним уже в 380-е годы, когда его посетила Павла, спутница Иеронима; паломник Аркульф около 680 года видел крестообразную церковь с колодцем посередине; крестоносцы отстроили её, а после её гибели греческая православная церковь купила место около 1860 года и завершила нынешний храм в 2007-м. Традиционная гробница Иосифа лежит в нескольких сотнях метров к северу. На Гаризиме наверху храм самарян стоял, по датировке его раскопщика, с V века до н. э., пока его не разрушил Иоанн Гиркан, и они до сих пор справляют на горе Пасху."
  uk:
    - "На східному краю Наблуса на Західному березі, де перевал між горою Геризим і горою Евал відкривається на рівнину: колодязь лежить біля підніжжя Геризиму, за кілька сотень метрів від пагорба давнього Сихему, Тель-Балата, і приблизно за кілометр на південь від села Аскар, де мапа розміщує Сихар. Єрусалим — за 49 км на південь, а Назарет — за 54 км на північ, тож колодязь стоїть приблизно посередині дороги з Юдеї до Галілеї через Самарію. Це одне з небагатьох святих місць Євангелій, ототожнення якого майже ніхто не оскаржує, збережене нині в крипті грецької православної церкви святої Фотини, імені, яке традиція дає самарянці."
    - "Іван змальовує обстановку: «Приходить оце в город Самарянський, названий Сихар, поблизу хутора, що дав Яков Йосифу, синові своєму. Була ж там криниця Яковова. Оце ж Ісус, утомившись у дорозї, сидїв так на криницї; було ж коло шестої години». Жінка заперечує: «і черпака не маєш, і колодязь глибокий» — і питає: «Хиба Ти більший єси отця нашого Якова, що дав нам сей колодязь? і він сам з него пив, і сини його, й скот його». Показуючи на Геризим, вона каже: «Батьки наші на сїй горі покланялись». Книга Буття знає поле, але не колодязь: Яків «купив частину поля, де отаборивсь, у синів Геммора, отця Сихемового, за сто срібняків», і на ньому поховано кості Йосифа, як записує Книга Ісуса Навина."
    - "Колодязь прорубано крізь скелю, і він глибокий: Генрі Мандрел 1697 р. дав тридцять п'ять ярдів, 105 футів, або близько 32 м, а «Огляд Західної Палестини» (1882) знайшов 75 футів, близько 23 м, після століть сміття; відтоді його очищено. Церква стояла над ним уже в 380-х рр., коли його відвідала Павла, учениця Єроніма; прочанин Аркульф близько 680 р. бачив хрестоподібну церкву з колодязем у центрі; хрестоносці відбудували її, а після її руйнування грецькі православні купили місце близько 1860 р. і завершили нинішню церкву 2007 р. Традиційна гробниця Йосифа лежить за кілька сотень метрів на північ. На Геризимі вгорі стояв храм самарян, за датуванням його розкопувача, від V ст. до н. е., доки Іван Гіркан не зруйнував його, і вони досі справляють Пасху на горі."
  es:
    - "En el borde oriental de Nablus, en Cisjordania, donde el paso entre el monte Gerizim y el monte Ebal se abre a la llanura: el pozo está al pie del Gerizim, a unos cientos de metros del tell de la antigua Siquem, Tell Balata, y a un kilómetro al sur de la aldea de Askar, donde el mapa sitúa Sicar. Jerusalén queda a 49 km al sur y Nazaret a 54 km al norte, de modo que el pozo se encuentra aproximadamente a medio camino en la ruta de Judea a Galilea por Samaria. Es uno de los pocos lugares santos de los Evangelios cuya identificación casi nadie discute, y se conserva hoy en la cripta de la iglesia greco-ortodoxa de Santa Fotina, el nombre que la tradición da a la samaritana."
    - "Juan describe la escena: «Vino, pues, á una ciudad de Samaria que se llamaba Sichâr, junto á la heredad que Jacob dió á José su hijo. Y estaba allí la fuente de Jacob. Pues Jesús, cansado del camino, así se sentó á la fuente. Era como la hora de sexta». La mujer objeta: «no tienes con qué sacarla, y el pozo es hondo», y pregunta: «¿Eres tú mayor que nuestro padre Jacob, que nos dió este pozo, del cual él bebió, y sus hijos, y sus ganados?». Señalando el Gerizim, dice: «Nuestros padres adoraron en este monte». Génesis conoce el campo pero no el pozo: Jacob «compró una parte del campo, donde tendió su tienda, de mano de los hijos de Hamor, padre de Sichêm, por cien piezas de moneda», y en él fueron sepultados los huesos de José, como registra Josué."
    - "El pozo está excavado en la roca y es profundo: Henry Maundrell, en 1697, dio treinta y cinco yardas, 105 pies o unos 32 m, y el Survey of Western Palestine (1882) halló 75 pies, unos 23 m, tras siglos de escombros; desde entonces ha sido despejado. Una iglesia se alzaba sobre él en los años 380, cuando lo visitó Paula, la compañera de Jerónimo; el peregrino Arculfo, hacia el 680, vio una iglesia cruciforme con el pozo en su centro; los cruzados la reconstruyeron, y tras su ruina los greco-ortodoxos compraron el lugar hacia 1860 y terminaron la iglesia actual en 2007. La tumba tradicional de José queda a unos cientos de metros al norte. En el Gerizim, sobre el pozo, se alzó el templo de los samaritanos, según la datación de su excavador, desde el siglo V a. C. hasta que Juan Hircano lo destruyó, y aún celebran la Pascua en el monte."
  pt:
    - "Na orla leste de Nablus, na Cisjordânia, onde a passagem entre o monte Gerizim e o monte Ebal se abre para a planície: o poço fica ao pé do Gerizim, a algumas centenas de metros do montículo da antiga Siquém, Tell Balata, e a cerca de um quilômetro ao sul da aldeia de Askar, onde o mapa situa Sicar. Jerusalém está 49 km ao sul e Nazaré 54 km ao norte, de modo que o poço fica mais ou menos a meio caminho na estrada da Judeia à Galileia por Samaria. É um dos poucos lugares santos dos Evangelhos cuja identificação quase ninguém contesta, hoje guardado na cripta da igreja greco-ortodoxa de Santa Fotina, nome que a tradição dá à mulher samaritana."
    - "João monta a cena: Jesus “chegou a uma cidade de Samaria chamada Sicar, perto do terreno que Jacó deu a seu filho José. O poço de Jacó estava lá. Jesus, pois, cansado da viagem, sentou-se à beira do poço. Era por volta da hora sexta.” A mulher objeta: “o senhor não tem com que tirar a água, e o poço é fundo”, e pergunta: “Por acaso o senhor é maior do que o nosso pai Jacó, que nos deu o poço, do qual ele mesmo bebeu, assim como os seus filhos e o seu gado?” Apontando o Gerizim, diz: “Nossos pais adoraram neste monte”. Gênesis conhece o campo, não o poço: Jacó “comprou a porção de terra onde havia armado sua tenda, das mãos dos filhos de Hamor, pai de Siquém, por cem peças de prata”, e nela foram sepultados os ossos de José, como registra Josué."
    - "O poço é aberto na rocha e é fundo: Henry Maundrell, em 1697, deu trinta e cinco jardas, 105 pés ou cerca de 32 m, e o Survey of Western Palestine (1882) achou 75 pés, cerca de 23 m, depois de séculos de entulho; desde então foi limpo. Uma igreja o cobria já nos anos 380, quando o visitou Paula, discípula de Jerônimo; o peregrino Arculfo, por volta de 680, viu uma igreja em forma de cruz com o poço no centro; os cruzados a reconstruíram, e depois de sua ruína os greco-ortodoxos compraram o local por volta de 1860 e concluíram a igreja atual em 2007. O túmulo tradicional de José fica a algumas centenas de metros ao norte. No Gerizim, acima, ficou o templo dos samaritanos, segundo a datação de seu escavador, do século V a.C. até que João Hircano o destruiu, e eles ainda celebram a Páscoa no monte."
  de:
    - "Am Ostrand von Nablus im Westjordanland, wo sich der Pass zwischen Garizim und Ebal zur Ebene öffnet: Der Brunnen liegt am Fuß des Garizim, wenige hundert Meter vom Hügel des alten Sichem, Tell Balata, und etwa einen Kilometer südlich des Dorfes Askar, wo die Karte Sychar ansetzt. Jerusalem ist 49 km im Süden und Nazareth 54 km im Norden, der Brunnen liegt also etwa auf halbem Weg an der Straße von Judäa nach Galiläa durch Samaria. Er ist eine der wenigen heiligen Stätten der Evangelien, deren Gleichsetzung fast niemand bestreitet, und befindet sich heute in der Krypta der griechisch-orthodoxen Kirche der heiligen Photini; so nennt die Überlieferung die Samariterin."
    - "Johannes stellt die Szene: „Da kam er in eine Stadt Samarias, die heißt Sichar, nahe bei dem Feld, das Jakob seinem Sohn Joseph gab. Es war aber daselbst Jakobs Brunnen. Da nun Jesus müde war von der Reise, setzte er sich also auf den Brunnen; und es war um die sechste Stunde.“ Die Frau wendet ein: „hast du doch nichts, womit du schöpfest, und der Brunnen ist tief“, und fragt: „Bist du mehr denn unser Vater Jakob, der uns diesen Brunnen gegeben hat? Und er hat daraus getrunken und seine Kinder und sein Vieh.“ Auf den Garizim weisend sagt sie: „Unsere Väter haben auf diesem Berge angebetet“. Die Genesis kennt das Feld, aber nicht den Brunnen: Jakob „kaufte ein Stück Acker von den Kindern Hemors, des Vaters Sichems, um hundert Groschen; daselbst richtete er seine Hütte auf“, und darin wurden Josefs Gebeine begraben, wie Josua berichtet."
    - "Der Brunnen ist durch Fels getrieben und tief: Henry Maundrell gab 1697 fünfunddreißig Yards an, 105 Fuß oder etwa 32 m, und der Survey of Western Palestine (1882) fand nach Jahrhunderten von Schutt 75 Fuß, etwa 23 m; seitdem wurde er geräumt. Über ihm stand schon in den 380er Jahren eine Kirche, als Paula, die Gefährtin des Hieronymus, ihn besuchte; der Pilger Arkulf sah um 680 eine kreuzförmige Kirche mit dem Brunnen in der Mitte; die Kreuzfahrer bauten sie neu, und nach ihrem Verfall kaufte die griechisch-orthodoxe Kirche die Stätte um 1860 und vollendete die heutige Kirche 2007. Josefs überliefertes Grab liegt wenige hundert Meter nördlich. Auf dem Garizim darüber stand nach der Datierung seines Ausgräbers der Tempel der Samaritaner vom 5. Jahrhundert v. Chr. bis Johannes Hyrkanos ihn zerstörte, und sie feiern noch immer das Passa auf dem Berg."
  fr:
    - "À la lisière est de Naplouse, en Cisjordanie, là où le défilé entre le mont Garizim et le mont Ébal s’ouvre sur la plaine : le puits se trouve au pied du Garizim, à quelques centaines de mètres du tertre de l’antique Sichem, Tell Balata, et à environ un kilomètre au sud du village d’Askar, où la carte place Sychar. Jérusalem est à 49 km au sud et Nazareth à 54 km au nord, de sorte que le puits se trouve à peu près à mi-chemin sur la route de Judée en Galilée par la Samarie. C’est l’un des rares lieux saints des Évangiles dont presque personne ne conteste l’identification, gardé aujourd’hui dans la crypte de l’église grecque orthodoxe Sainte-Photine, nom que la tradition donne à la Samaritaine."
    - "Jean plante le décor : « il arriva dans une ville de Samarie, nommée Sychar, près du champ que Jacob avait donné à Joseph, son fils. Là se trouvait le puits de Jacob. Jésus, fatigué du voyage, était assis au bord du puits. C’était environ la sixième heure. » La femme objecte : « tu n’as rien pour puiser, et le puits est profond », et demande : « Es-tu plus grand que notre père Jacob, qui nous a donné ce puits, et qui en a bu lui-même, ainsi que ses fils et ses troupeaux ? » Montrant le Garizim, elle dit : « Nos pères ont adoré sur cette montagne ». La Genèse connaît le champ mais non le puits : Jacob « acheta la portion du champ où il avait dressé sa tente, des fils d’Hamor, père de Sichem, pour cent kesita », et les ossements de Joseph y furent enterrés, comme le rapporte Josué."
    - "Le puits est creusé dans le roc et profond : Henry Maundrell en 1697 donna trente-cinq yards, 105 pieds ou environ 32 m, et le Survey of Western Palestine (1882) trouva 75 pieds, environ 23 m, après des siècles de décombres ; il a été déblayé depuis. Une église s’élevait au-dessus dès les années 380, quand Paula, la compagne de Jérôme, le visita ; le pèlerin Arculf, vers 680, vit une église cruciforme avec le puits en son centre ; les croisés la rebâtirent, et après sa ruine les Grecs orthodoxes achetèrent le site vers 1860 et achevèrent l’église actuelle en 2007. Le tombeau traditionnel de Joseph se trouve à quelques centaines de mètres au nord. Sur le Garizim, au-dessus, se dressait le temple des Samaritains, selon la datation de son fouilleur, du Ve siècle av. J.-C. jusqu’à sa destruction par Jean Hyrcan, et ils y célèbrent encore la Pâque sur la montagne."
  pl:
    - "Na wschodnim skraju Nablusu na Zachodnim Brzegu, gdzie przełęcz między Garizim a Ebal otwiera się na równinę: studnia leży u stóp Garizim, kilkaset metrów od kopca starożytnego Sychem, Tell Balata, i około kilometra na południe od wsi Askar, gdzie mapa umieszcza Sychar. Jerozolima jest 49 km na południe, a Nazaret 54 km na północ, więc studnia stoi mniej więcej w połowie drogi z Judei do Galilei przez Samarię. Jest jednym z niewielu świętych miejsc Ewangelii, którego utożsamienia prawie nikt nie kwestionuje, i jest dziś zachowana w krypcie greckoprawosławnego kościoła św. Fotyny, imienia, które tradycja nadaje Samarytance."
    - "Jan ustawia scenę: „I przyszedł do miasta Samaryi, które zowią Sychar, blisko folwarku, który był dał Jakób Józefowi, synowi swemu. I była tam studnia Jakóbowa; przetoż będąc Jezus na drodze spracowany, siedział tak na studni; a było około szóstej godziny.” Kobieta zarzuca: „nie masz i czem naczerpać, a studnia jest głęboka”, i pyta: „Izażeś ty jest większy niżeli ojciec nasz Jakób, który nam dał tę studnię, i sam z niej pił, i synowie jego, i dobytek jego?” Wskazując Garizim, mówi: „Ojcowie nasi na tej górze chwalili Boga”. Księga Rodzaju zna pole, ale nie studnię: Jakub „kupił część pola, na którem rozbił namiot swój, od synów Hemora, ojca Sychemowego, za sto jagniąt”, i w nim pochowano kości Józefa, jak zapisuje Jozue."
    - "Studnia jest wykuta w skale i głęboka: Henry Maundrell w 1697 podał trzydzieści pięć jardów, 105 stóp, czyli około 32 m, a Survey of Western Palestine (1882) znalazł 75 stóp, około 23 m, po wiekach nagromadzonych śmieci; od tamtej pory ją oczyszczono. Kościół stał nad nią już w latach 380, gdy odwiedziła ją Paula, towarzyszka Hieronima; pielgrzym Arkulf około 680 zobaczył kościół na planie krzyża ze studnią pośrodku; krzyżowcy go odbudowali, a po jego ruinie grekoprawosławni kupili miejsce około 1860 i ukończyli obecny kościół w 2007. Tradycyjny grób Józefa leży kilkaset metrów na północ. Na Garizim powyżej stała świątynia Samarytan, według datowania jej odkrywcy od V wieku p.n.e., aż Jan Hirkan ją zburzył, i nadal obchodzą na górze Paschę."
  it:
    - "Al margine orientale di Nablus in Cisgiordania, dove il passo tra il Monte Garizim e il Monte Ebal si apre sulla pianura: il pozzo giace ai piedi del Garizim, a poche centinaia di metri dal tumulo dell’antica Sichem, Tell Balata, e a circa un chilometro a sud del villaggio di Askar, dove la mappa pone Sicar. Gerusalemme è a 49 km a sud e Nazaret a 54 km a nord, così il pozzo sta a metà strada sulla via dalla Giudea alla Galilea attraverso la Samaria. È uno dei pochi luoghi santi dei Vangeli la cui identificazione quasi nessuno contesta, custodito oggi nella cripta della chiesa greco-ortodossa di Santa Fotini, il nome che la tradizione dà alla Samaritana."
    - "Giovanni descrive la scena: Gesù «giunse dunque a una città della Samaria, chiamata Sichar, vicina al podere che Giacobbe dette a Giuseppe, suo figliuolo; e quivi era la fonte di Giacobbe. Gesù dunque, stanco del cammino, stava così a sedere presso la fonte. Era circa l’ora sesta». La donna obietta: «tu non hai nulla per attingere, e il pozzo è profondo», e chiede: «Sei tu più grande di Giacobbe nostro padre che ci dette questo pozzo e ne bevve egli stesso co’ suoi figliuoli e il suo bestiame?» Indicando il Garizim dice: «I nostri padri hanno adorato su questo monte». La Genesi conosce il campo ma non il pozzo: Giacobbe «comprò dai figliuoli di Hemor, padre di Sichem, per cento pezzi di danaro, la parte del campo dove avea piantato le sue tende», e in esso furono sepolte le ossa di Giuseppe, come registra Giosuè."
    - "Il pozzo è scavato nella roccia ed è profondo: Henry Maundrell nel 1697 diede trentacinque iarde, 105 piedi o circa 32 m, e il Survey of Western Palestine (1882) trovò 75 piedi, circa 23 m, dopo secoli di detriti; da allora è stato sgombrato. Una chiesa vi sorgeva sopra già negli anni 380, quando lo visitò Paola, la compagna di Girolamo; il pellegrino Arculfo verso il 680 vide una chiesa cruciforme con il pozzo al centro; i Crociati la ricostruirono, e dopo la sua rovina i greco-ortodossi comprarono il sito intorno al 1860 e terminarono l’attuale chiesa nel 2007. La tomba tradizionale di Giuseppe si trova poche centinaia di metri a nord. Sul Garizim, sopra, sorgeva il tempio dei Samaritani, secondo la datazione di chi lo scavò, dal V secolo a.C. finché Giovanni Ircano lo distrusse, ed essi celebrano ancora la Pasqua sul monte."
  nl:
    - "Aan de oostrand van Nabloes op de Westelijke Jordaanoever, waar de pas tussen de Gerizim en de Ebal uitkomt op de vlakte: de put ligt aan de voet van de Gerizim, enkele honderden meters van de heuvel van het oude Sichem, Tell Balata, en ongeveer een kilometer ten zuiden van het dorp Askar, waar de kaart Sichar plaatst. Jeruzalem ligt 49 km naar het zuiden en Nazareth 54 km naar het noorden, dus de put ligt ongeveer halverwege de weg van Judea naar Galilea door Samaria. Het is een van de weinige heilige plaatsen van de Evangeliën waarvan de identificatie vrijwel niemand betwist, nu bewaard in de crypte van de Grieks-orthodoxe Sint-Fotinikerk, de naam die de overlevering aan de Samaritaanse vrouw geeft."
    - "Johannes schetst het toneel: “Hij kwam dan in een stad van Samaria, genaamd Sichar, nabij het stuk land, hetwelk Jakob zijn zoon Jozef gaf. En aldaar was de fontein Jakobs. Jezus dan, vermoeid zijnde van de reize, zat alzo neder nevens de fontein. Het was omtrent de zesde ure.” De vrouw werpt tegen: “Gij hebt niet om mede te putten, en de put is diep”, en vraagt: “Zijt Gij meerder dan onze vader Jakob, die ons den put gegeven heeft, en hijzelf heeft daaruit gedronken, en zijn kinderen en zijn vee?” Wijzend naar de Gerizim zegt zij: “Onze vaders hebben op dezen berg aangebeden”. Genesis kent het veld maar niet de put: Jakob “kocht een deel des velds, waarop hij zijn tent gespannen had, van de hand der zonen van Hemor, den vader van Sichem, voor honderd stukken gelds”, en daarin werden de beenderen van Jozef begraven, zoals Jozua vermeldt."
    - "De put is door rots gehouwen en diep: Henry Maundrell gaf in 1697 vijfendertig yards, 105 voet of ongeveer 32 m, en de Survey of Western Palestine (1882) vond na eeuwen vuilnis 75 voet, ongeveer 23 m; hij is sindsdien schoongemaakt. Er stond al in de jaren 380 een kerk boven, toen Hiëronymus’ Paula er kwam; de pelgrim Arculf zag omstreeks 680 een kruisvormige kerk met de put in het midden; de kruisvaarders herbouwden haar, en na haar ondergang kochten de Grieks-orthodoxen de plek omstreeks 1860 en voltooiden de huidige kerk in 2007. Jozefs traditionele graf ligt enkele honderden meters naar het noorden. Op de Gerizim erboven stond de tempel van de Samaritanen, volgens de datering van de opgraver, vanaf de vijfde eeuw v.Chr. tot Johannes Hyrcanus hem verwoestte, en zij vieren er nog Pesach."
  cs:
    - "Na východním okraji Náblusu na Západním břehu, kde se průsmyk mezi Gerizimem a Ébalem otevírá do roviny: studna leží na úpatí Gerizimu, několik set metrů od pahorku starověkého Šekemu, Tell Balata, a asi kilometr jižně od vesnice Askar, kam mapa klade Sychar. Jeruzalém je 49 km na jih a Nazaret 54 km na sever, takže studna stojí zhruba v polovině cesty z Judska do Galileje přes Samaří. Je to jedno z mála svatých míst evangelií, jehož ztotožnění téměř nikdo nezpochybňuje, dnes uchovávané v kryptě řeckého pravoslavného kostela svaté Fotiny, jak tradice nazývá Samaritánku."
    - "Jan líčí scénu: Ježíš „přišel k městu Samařskému, kteréž slove Sichar, vedle popluží, kteréž byl dal Jákob Jozefovi, synu svému. Byla pak tu studnice Jákobova. Protož ustav na cestě Ježíš, posadil se tak na studnici. A bylo již okolo šesté hodiny.“ Žena namítá: „aniž máš, čím bys navážil, a studnice jest hluboká“ a ptá se: „Zdaliž jsi ty větší nežli otec náš Jákob, kterýž nám dal tuto studnici, a sám z ní pil, i synové jeho, i dobytek jeho?“ Ukazujíc na Gerizim, říká: „Otcové naši na této hoře modlívali se“. Genesis zná pole, ale ne studnu: Jákob „koupil díl pole toho, na němž byl rozbil stan svůj, od synů Emora, otce Sichemova, za sto ovec“, a v něm byly pochovány Josefovy kosti, jak zaznamenává Jozue."
    - "Studna je vytesána ve skále a je hluboká: Henry Maundrell roku 1697 udal pětatřicet yardů, 105 stop, asi 32 m, a Survey of Western Palestine (1882) po staletích nánosu našel 75 stop, asi 23 m; od té doby byla vyčištěna. Kostel nad ní stál už v 380. letech, kdy ji navštívila Paula, o níž píše Jeroným; poutník Arculf kolem roku 680 viděl křížový kostel se studnou uprostřed; křižáci jej přestavěli a po jeho zkáze koupili místo kolem roku 1860 řečtí pravoslavní a dokončili dnešní kostel roku 2007. Tradiční Josefův hrob leží několik set metrů severně. Na Gerizimu nad ní stál chrám Samaritánů, podle datování jeho vykopavače od 5. století př. n. l., dokud jej nezničil Jan Hyrkanos, a oni dodnes slaví na hoře Pesach."
  sv:
    - "I östra utkanten av Nablus på Västbanken, där passet mellan Gerisim och Ebal öppnar sig mot slätten: brunnen ligger vid foten av Gerisim, några hundra meter från den forntida staden Shekems kulle, Tell Balata, och omkring en kilometer söder om byn Askar, där kartan placerar Sykar. Jerusalem ligger 49 km åt söder och Nasaret 54 km åt norr, så brunnen ligger ungefär halvvägs på vägen från Judeen till Galileen genom Samaria. Det är en av de få heliga platserna i evangelierna vars identifiering nästan ingen bestrider, och den bevaras i dag i kryptan till den grekisk-ortodoxa Sankta Fotinis kyrka, namnet som traditionen ger den samaritiska kvinnan."
    - "Johannes tecknar scenen: ”Så kom han till en stad i Samarien som hette Sykar, nära det jordstycke som Jakob gav åt sin son Josef. Och där var Jakobs brunn. Eftersom nu Jesus var trött av vandringen, satte han sig strax ned vid brunnen. Det var vid den sjätte timmen.” Kvinnan invänder: ”du har ju intet att hämta upp vatten med, och brunnen är djup”, och frågar: ”Icke är du väl förmer än vår fader Jakob, som gav oss brunnen och själv med sina barn och sin boskap drack ur den?” Pekande mot Gerisim säger hon: ”Våra fäder hava tillbett på detta berg”. 1 Mosebok känner till åkern men inte brunnen: ”Det jordstycke där han hade slagit upp sitt tält köpte han av Hamors, Sikems faders, barn för hundra kesitor”, och i den begroves Josefs ben, som Josua berättar."
    - "Brunnen är uthuggen genom berg och är djup: Henry Maundrell angav 1697 trettiofem yards, 105 fot eller omkring 32 m, och Survey of Western Palestine (1882) fann 75 fot, omkring 23 m, efter århundraden av skräp; den har sedan dess rensats. En kyrka stod över den på 380-talet, när Hieronymus' Paula besökte den; pilgrimen Arculf såg omkring 680 en korsformad kyrka med brunnen i mitten; korsfararna byggde upp den, och efter dess ruin köpte de grekisk-ortodoxa platsen omkring 1860 och slutförde den nuvarande kyrkan 2007. Josefs traditionella grav ligger några hundra meter norrut. På Gerisim ovanför stod samariternas tempel, enligt dess utgrävares datering, från 400-talet f.Kr. tills Johannes Hyrkanos förstörde det, och de firar fortfarande påsk på berget."
  nb:
    - "I den østlige kanten av Nablus på Vestbredden, der passet mellom Garisim og Ebal åpner seg mot sletten: brønnen ligger ved foten av Garisim, noen hundre meter fra haugen til det gamle Sikem, Tell Balata, og omtrent en kilometer sør for landsbyen Askar, der kartet plasserer Sykar. Jerusalem ligger 49 km mot sør og Nasaret 54 km mot nord, så brønnen ligger omtrent halvveis på veien fra Judea til Galilea gjennom Samaria. Det er et av de få hellige stedene i evangeliene hvis identifikasjon nesten ingen bestrider, og det bevares i dag i krypten i den gresk-ortodokse Sankt Fotini-kirken, navnet tradisjonen gir den samaritanske kvinnen."
    - "Johannes setter scenen: Jesus kom «til en by i Samaria, som heter Sykar, nær ved det stykke land som Jakob gav sin sønn Josef; og der var Jakobs brønn. Jesus, som var trett av reisen, satt nu der ved brønnen; det var omkring den sjette time.» Kvinnen innvender: «du har jo ikke noget å dra op vann med, og brønnen er dyp», og spør: «Du er da vel ikke større enn vår far Jakob, som gav oss brønnen og selv drakk av den, han og hans sønner og hans fe?» Med blikket mot Garisim sier hun: «Våre fedre tilbad på dette fjell». 1 Mosebok kjenner åkeren, men ikke brønnen: «Og det stykke mark hvor han hadde slått op sitt telt, kjøpte han av sønnene til Hemor, Sikems far, for hundre kesitter», og i den ble Josefs ben begravd, slik Josva opptegner."
    - "Brønnen er hogd gjennom berg og er dyp: Henry Maundrell oppga i 1697 35 yards, 105 fot eller omtrent 32 m, og Survey of Western Palestine (1882) fant 75 fot, omtrent 23 m, etter århundrer med søppel; den er siden blitt ryddet. En kirke sto over den i 380-årene, da Hieronymus' Paula besøkte den; pilegrimen Arculf så omkring 680 en korsformet kirke med brønnen i midten; korsfarerne bygget den opp igjen, og etter at den lå i ruiner kjøpte de gresk-ortodokse stedet omkring 1860 og fullførte dagens kirke i 2007. Josefs tradisjonelle grav ligger noen hundre meter mot nord. På Garisim over sto samaritanernes tempel, etter utgraverens datering, fra 400-tallet f.Kr. til Johannes Hyrkan ødela det, og de feirer fortsatt påske på fjellet."
  tl:
    - "Sa silangang gilid ng Nablus sa Kanlurang Pampang, kung saan bumubukas sa kapatagan ang daanan sa pagitan ng Bundok Gerizim at Bundok Ebal: ang balon ay nasa paanan ng Gerizim, ilang daang metro mula sa burol ng sinaunang Sichem, ang Tell Balata, at mga isang kilometro sa timog ng nayon ng Askar, kung saan inilalagay ng mapa ang Sicar. Ang Jerusalem ay 49 km sa timog at ang Nazaret ay 54 km sa hilaga, kaya ang balon ay halos nasa kalagitnaan ng daan mula Judea hanggang Galilea sa pamamagitan ng Samaria. Isa ito sa kakaunting banal na lugar ng mga Ebanghelyo na halos walang nagtatalo sa pagkakakilanlan, na iniingatan ngayon sa krypta ng simbahang Griyegong Ortodokso ni San Photini, ang pangalang ibinibigay ng tradisyon sa babaeng Samaritana."
    - "Sabi ni Juan: “Sumapit nga siya sa isang bayan ng Samaria, na tinatawag na Sicar, malapit sa bahagi ng lupang ibinigay ni Jacob kay Jose na kaniyang anak: At naroon ang balon ni Jacob. Si Jesus nga, nang napapagod na sa kaniyang paglalakbay, ay naupong gayon sa tabi ng balon. Magiikaanim na nga ang oras.” Tumutol ang babae, “wala kang sukat isalok ng tubig, at malalim ang balon”, at nagtanong, “Dakila ka pa baga sa aming amang si Jacob, na sa ami'y nagbigay ng balon, at dito'y uminom siya, at ang kaniyang mga anak, at ang kaniyang mga hayop?” Sa pagturo sa Gerizim: “Nagsisamba ang aming mga magulang sa bundok na ito”. Alam ng Genesis ang bukid ngunit hindi ang balon: “binili ang pitak ng lupa na pinagtayuan ng kaniyang tolda, sa kamay ng mga anak ni Hamor, na ama ni Sichem, ng isang daang putol na salapi”, at doon inilibing ang mga buto ni Jose ayon kay Josue."
    - "Hiwa sa bato ang balon at malalim: nagbigay si Henry Maundrell noong 1697 ng tatlumpu't limang yarda, 105 piye o mga 32 m, at nakita ng Survey of Western Palestine (1882) ang 75 piye, mga 23 m, pagkatapos ng mga siglo ng basura; nalinis na ito mula noon. May simbahan sa ibabaw nito noong dekada 380, nang dumalaw si Paula ni Jeronimo; nakita ng peregrinong si Arculf mga 680 ang simbahang hugis krus na nasa gitna ang balon; muling itinayo ito ng mga Krusado, at pagkatapos ng pagkaguho nito ay binili ng mga Griyegong Ortodokso ang pook mga 1860 at tinapos ang kasalukuyang simbahan noong 2007. Ang tradisyonal na libingan ni Jose ay ilang daang metro sa hilaga. Sa Gerizim sa itaas, nakatayo ang templo ng mga Samaritano, ayon sa pagtatakda ng humukay nito, mula ikalimang siglo BK hanggang sirain ito ni Juan Hircano, at ipinagdiriwang pa rin nila ang Paskua sa bundok."
  da:
    - "I den østlige udkant af Nablus på Vestbredden, hvor passet mellem Garizim og Ebal åbner sig mod sletten: brønden ligger ved foden af Garizim, nogle hundrede meter fra højen i det gamle Sikem, Tell Balata, og omkring en kilometer syd for landsbyen Askar, hvor kortet placerer Sykar. Jerusalem ligger 49 km mod syd og Nazaret 54 km mod nord, så brønden ligger omtrent midtvejs på vejen fra Judæa til Galilæa gennem Samaria. Det er et af evangeliernes få hellige steder, hvis identifikation næsten ingen bestrider, og den bevares i dag i krypten i den græsk-ortodokse Sankt Fotinis kirke, det navn traditionen giver den samaritanske kvinde."
    - "Johannes sætter scenen: »Han kommer da til en By i Samaria, som kaldes Sykar, nær ved det Stykke Land, som Jakob gav sin Søn Josef. Og der var Jakobs Brønd. Jesus satte sig da, træt af Rejsen, ned ved Brønden; det var ved den sjette Time.« Kvinden indvender: »du har jo intet at drage op med, og Brønden er dyb«, og spørger: »Mon du er større end vor Fader Jakob, som har givet os Brønden, og han har selv drukket deraf og hans Børn og hans Kvæg?« Idet hun peger på Garizim, siger hun: »Vore Fædre have tilbedet paa dette Bjerg«. Første Mosebog kender marken, men ikke brønden: Jakob »købte det Stykke Ager, paa hvilket han havde slaget Telt op, af Hemors, Sikems Faders, Sønner, for hundrede Penninge«, og i den blev Josefs ben begravet, som Josva beretter."
    - "Brønden er hugget gennem klippe og er dyb: Henry Maundrell gav i 1697 femogtredive yards, 105 fod eller omkring 32 m, og Survey of Western Palestine (1882) fandt 75 fod, omkring 23 m, efter århundreders affald; den er siden blevet ryddet. En kirke stod over den i 380'erne, da Hieronymus' Paula besøgte den; pilgrimmen Arculf så omkring 680 en korsformet kirke med brønden i midten; korsfarerne genopbyggede den, og efter dens ruin købte de græsk-ortodokse stedet omkring 1860 og færdiggjorde den nuværende kirke i 2007. Josefs traditionelle grav ligger nogle hundrede meter mod nord. På Garizim ovenfor stod samaritanernes tempel, efter dets udgravers datering, fra 400-tallet f.Kr., indtil Johannes Hyrkan ødelagde det, og de holder stadig påske på bjerget."
  sr:
    - "На источном рубу Наблуса на Западној обали, где се превој између горе Гаризим и горе Гевал отвара на равницу: бунар лежи у подножју Гаризима, неколико стотина метара од хумке древног Сихема, Тел Балате, и око километра јужно од села Аскар, где карта поставља Сихар. Јерусалим је 49 км јужно, а Назарет 54 км северно, па бунар стоји отприлике на средини пута из Јудеје у Галилеју кроз Самарију. То је једно од ретких светих места Јеванђеља чије поистовећење готово нико не оспорава, а данас се чува у крипти грчке православне цркве свете Фотини, имена које предање даје Самарићанки."
    - "Јован поставља сцену: „Тако дође у град самаријски који се зове Сихар, близу села које даде Јаков Јосифу, сину свом. А онде беше извор Јаковљев; и Исус уморан од пута сеђаше на извору; а беше око шестог сахата.“ Жена приговара: „Ни захватити немаш чим, а студенац је дубок“, и пита: „Еда ли си ти већи од нашег оца Јакова, који нам даде овај студенац, и он из њега пијаше и синови његови и стока његова?“ Показујући на Гаризим каже: „Оци наши молише се Богу на овој гори“. Постање познаје њиву, али не и бунар: Јаков „купи комад земље, где разапе шатор свој, од синова Емора оца Сихемовог за сто новаца“, и у њој су сахрањене Јосифове кости, како бележи Исус Навин."
    - "Бунар је усечен кроз стену и дубок је: Хенри Мандрел је 1697. дао тридесет пет јарди, 105 стопа или око 32 м, а Survey of Western Palestine (1882) нашао је 75 стопа, око 23 м, после векова смећа; од тада је очишћен. Црква је над њим стајала већ 380-их, кад је посетила Јеронимова Паула; ходочасник Аркулф је око 680. видео крстообразну цркву с бунаром у средини; крсташи су је обновили, а после њеног пропадања грчки православци купили су локалитет око 1860. и 2007. довршили садашњу цркву. Јосифов традиционални гроб лежи неколико стотина метара северно. На Гаризиму изнад стајао је самарићански храм, по датирању његовог ископавача, од 5. века п. н. е. док га Јован Хиркан није разорио, а они и данас славе Пасху на гори."
  hu:
    - "Nablusz keleti szélén, ciszjordániai területen, ahol a Garizim-hegy és az Ébál-hegy közötti hágó a síkságra nyílik: a kút a Garizim lábánál fekszik, néhány száz méterre az ókori Sikem halmától, a Tell Balatától, és mintegy egy kilométerre délre Aszkar falutól, ahol a térkép Szükárt helyezi el. Jeruzsálem 49 km-re délre van, Názáret 54 km-re északra, így a kút nagyjából félúton áll a Júdeából Galileába Szamárián át vezető úton. Az evangéliumok kevés szent helyének egyike, amelynek azonosítását szinte senki sem vitatja, ma a görögkeleti Szent Photini-templom kriptájában őrzik, ez a név, amelyet a hagyomány a szamáriai asszonynak ad."
    - "János megalapozza a jelenetet: Jézus „Megy vala azért Samáriának Sikár nevű városába, annak a teleknek szomszédjába, a melyet Jákób adott vala az ő fiának, Józsefnek. Ott vala pedig a Jákób forrása. Jézus azért, az utazástól elfáradva, azonmód leüle a forráshoz. Mintegy hat óra vala.” Az asszony ellenveti: „nincs mivel merítened, és a kút mély”, és megkérdezi: „Avagy nagyobb vagy-é te a mi atyánknál, Jákóbnál, a ki nékünk adta ezt a kutat, és ebből ivott ő is, a fiai is és jószága is?” A Garizimra mutatva ezt mondja: „A mi atyáink ezen a hegyen imádkoztak”. A Mózes első könyve a mezőt ismeri, a kutat nem: Jákób „megvevé a mezőnek azt a részét, a hol sátorát felvonta vala, Khámornak a Sekhem atyjának fiaitól száz pénzen”, és abban temették el József csontjait, ahogy Józsué feljegyzi."
    - "A kút sziklába vájt és mély: Henry Maundrell 1697-ben harmincöt yardot, 105 lábat, vagyis mintegy 32 m-t adott meg, a Survey of Western Palestine (1882) pedig 75 lábat, mintegy 23 m-t talált évszázadok szemetével, azóta kitisztították. Templom állt fölötte a 380-as években, amikor Hieronymus Paulája meglátogatta; Arculfus zarándok mintegy 680-ban kereszt alakú templomot látott, közepén a kúttal; a keresztesek újjáépítették, romlása után a görögkeletiek mintegy 1860-ban megvették a helyet, és 2007-ben fejezték be a mai templomot. József hagyományos sírja néhány száz méterre északra van. A fölötte lévő Garizimon állt a szamaritánusok temploma feltárójának keltezése szerint a Kr. e. 5. századtól, míg Hürkánosz János le nem rombolta, és a páskát ma is a hegyen tartják."
  fi:
    - "Nablusin itäreunalla Länsirannalla, missä Garisiminvuoren ja Ebalvuoren välinen sola avautuu tasangolle: kaivo on Garisiminvuoren juurella, muutaman sadan metrin päässä muinaisen Sikemin kummusta, Tell Balatasta, ja noin kilometrin Askarin kylästä etelään, johon kartta sijoittaa Sykarin. Jerusalem on 49 km etelässä ja Nasaret 54 km pohjoisessa, joten kaivo on suunnilleen puolivälissä Juudeasta Galileaan Samarian kautta kulkevalla tiellä. Se on yksi evankeliumien harvoista pyhistä paikoista, jonka tunnistusta lähes kukaan ei kiistä, ja sitä pidetään nykyään kreikkalaisortodoksisen Pyhän Fotinen kirkon kryptassa, nimen, jonka perimätieto antaa samarialaiselle naiselle."
    - "Johannes asettaa näyttämön: ”Niin hän tuli Sykar nimiseen Samarian kaupunkiin, joka on lähellä sitä maa-aluetta, minkä Jaakob oli antanut pojalleen Joosefille. Ja siellä oli Jaakobin lähde. Kun nyt Jeesus oli matkasta väsynyt, istui hän lähteen reunalle. Ja oli noin kuudes hetki.” Nainen vastustaa: ”eipä sinulla ole ammennusastiaa, ja kaivo on syvä”, ja kysyy: ”Et kai sinä ole suurempi kuin meidän isämme Jaakob, joka antoi meille tämän kaivon ja joi siitä, hän itse sekä hänen poikansa ja karjansa?” Garisimiin viitaten hän sanoo: ”Meidän isämme ovat kumartaen rukoilleet tällä vuorella”. 1. Mooseksen kirja tuntee pellon mutta ei kaivoa: Jaakob ”osti sen maapalstan, johon hän oli pystyttänyt telttansa, Hamorin, Sikemin isän, pojilta sadalla kesitalla”, ja siihen haudattiin Joosefin luut, kuten Joosua kertoo."
    - "Kaivo on hakattu kallion läpi ja on syvä: Henry Maundrell antoi vuonna 1697 mitaksi kolmekymmentäviisi jaardia, 105 jalkaa eli noin 32 m, ja Survey of Western Palestine (1882) löysi 75 jalkaa, noin 23 m, vuosisatojen roskien jälkeen; se on sittemmin puhdistettu. Kirkko seisoi sen päällä jo 380-luvulla, jolloin Hieronymuksen Paula vieraili; pyhiinvaeltaja Arculf näki noin 680 ristinmuotoisen kirkon kaivo keskellään; ristiretkeläiset rakensivat sen uudelleen, ja sen tuhouduttua kreikkalaisortodoksit ostivat paikan noin 1860 ja saivat nykyisen kirkon valmiiksi vuonna 2007. Joosefin perimätiedon mukainen hauta on muutaman sadan metrin päässä pohjoiseen. Ylhäällä Garisiminvuorella seisoi samarialaisten temppeli kaivajansa ajoituksen mukaan 400-luvulta eaa., kunnes Johannes Hyrkanos tuhosi sen, ja he viettävät yhä pääsiäistä vuorella."
  vi:
    - "Ở rìa đông Nablus tại Bờ Tây, nơi đèo giữa núi Ga-ri-xim và núi Ê-banh mở ra đồng bằng: giếng nằm dưới chân Ga-ri-xim, cách gò Si-chem cổ, Tell Balata, vài trăm mét, và cách làng Askar, nơi bản đồ đặt Si-kha, khoảng một kilômét về phía nam. Giê-ru-sa-lem cách 49 km về phía nam và Na-xa-rét 54 km về phía bắc, nên giếng đứng khoảng giữa đường từ Giu-đê đến Ga-li-lê qua Sa-ma-ri. Đó là một trong số ít thánh địa của các sách Phúc Âm mà gần như không ai tranh cãi về xác định, ngày nay được giữ trong hầm mộ của nhà thờ Chính thống Hy Lạp Thánh Photini, tên truyền thống đặt cho người đàn bà Sa-ma-ri."
    - "Giăng dựng bối cảnh: Ngài “đến một thành thuộc về xứ Sa-ma-ri, gọi là Si-kha, gần đồng ruộng mà Gia-cốp cho Giô-sép là con mình. Tại đó có cái giếng Gia-cốp. Nhân đi đường mỏi mệt, Đức Chúa Jêsus ngồi gần bên giếng; bấy giờ độ chừng giờ thứ sáu.” Người đàn bà thưa: “Chúa không có gì mà múc, và giếng thì sâu”, và hỏi: “Tổ phụ chúng tôi là Gia-cốp để giếng nầy lại cho chúng tôi, chính người uống giếng nầy, cả đến con cháu cùng các bầy vật người nữa, vậy Chúa há lớn hơn Gia-cốp sao?” Chỉ về Ga-ri-xim, bà nói: “Tổ phụ chúng tôi đã thờ lạy trên hòn núi nầy”. Sáng thế ký biết cánh đồng mà không biết giếng: Gia-cốp “mua miếng đất chỗ người đóng trại, giá một trăm miếng bạc của con Hê-mô, cha Si-chem”, và trong đó hài cốt Giô-sép được chôn, như Giô-suê ghi."
    - "Giếng được khoét xuyên đá và sâu: Henry Maundrell năm 1697 cho ba mươi lăm yard, 105 feet hay khoảng 32 m, và Survey of Western Palestine (1882) thấy 75 feet, khoảng 23 m, vì giếng đã bị rác lấp suốt nhiều thế kỷ; từ đó nó đã được dọn sạch. Một nhà thờ đứng trên đó vào những năm 380, khi Paula của Jerome viếng thăm; người hành hương Arculf khoảng 680 thấy một nhà thờ hình chữ thập với giếng ở giữa; quân Thập tự chinh xây lại, và sau khi nó đổ nát, Chính thống Hy Lạp mua khu đất khoảng 1860 và hoàn tất nhà thờ hiện nay năm 2007. Mộ truyền thống của Giô-sép nằm cách vài trăm mét về phía bắc. Trên Ga-ri-xim phía trên, đền thờ của người Sa-ma-ri đứng, theo niên đại của người khai quật, từ thế kỷ 5 TCN cho đến khi John Hyrcanus phá hủy, và họ vẫn giữ lễ Vượt qua trên núi."
  ro:
    - "La marginea de est a orașului Nablus din Cisiordania, unde trecătoarea dintre Muntele Garizim și Muntele Ebal se deschide spre câmpie: fântâna se află la poalele Garizimului, la câteva sute de metri de movila vechiului Sihem, Tell Balata, și la circa un kilometru sud de satul Askar, unde harta așază Sihar. Ierusalimul este la 49 km spre sud și Nazaretul la 54 km spre nord, deci fântâna se află cam la jumătatea drumului dinspre Iudeea spre Galileea prin Samaria. Este unul dintre puținele locuri sfinte din Evanghelii a căror identificare aproape nimeni nu o contestă, păstrat azi în cripta bisericii greco-ortodoxe Sfânta Fotini, numele pe care tradiția îl dă samaritencei."
    - "Ioan pune scena: „Deci au venit în cetatea Samariei, care se chiamă Sihar, aproape de locul care a dat Iacov lui Iosif fiului său. Și erà acolo puțul lui Iacov, iar Iisus, ostenit fiind de călătorie, ședeà așà la puț; și erà ca la al șaselea ceas.” Femeia obiectează: „nici ciutură ai, și puțul este adânc”, și întreabă: „Au doară tu mai mare ești decât Iacov părintele nostru, care ne-a dat nouă puțul acesta, și el însuș dintr’însul a băut, și fii lui și dobitoacele lui?” Arătând spre Garizim, spune: „Părinții noștri în muntele acesta s’au închinat”. Facerea cunoaște ogorul, dar nu fântâna: Iacov „a cumpărat o parte din țarină, unde și-a întins cortul său, dela Emor tatăl lui Sihem, cu o sută de miei”, iar în ea au fost îngropate oasele lui Iosif, după cum consemnează Iosua."
    - "Fântâna este săpată prin stâncă și este adâncă: Henry Maundrell, în 1697, a dat treizeci și cinci de yarzi, 105 ft, adică circa 32 m, iar Survey of Western Palestine (1882) a găsit 75 ft, circa 23 m, după secole de gunoaie; de atunci a fost curățată. O biserică stătea deasupra ei în anii 380, când a vizitat-o Paula lui Ieronim; pelerinul Arculf, pe la 680, a văzut o biserică în formă de cruce cu fântâna în centru; cruciații au reclădit-o, iar după ruinarea ei, ortodocșii greci au cumpărat locul pe la 1860 și au isprăvit biserica de azi în 2007. Mormântul tradițional al lui Iosif se află la câteva sute de metri spre nord. Pe Garizim, deasupra, stătea templul samaritenilor, după datarea săpătorului lui, din secolul al V-lea î.Hr. până când Ioan Hircan l-a distrus, iar ei încă țin Paștele pe munte."
  bg:
    - "На източния край на Наблус на Западния бряг, където проходът между планините Гаризим и Гевал се отваря към равнината: кладенецът лежи в подножието на Гаризим, на няколкостотин метра от могилата на древния Сихем, Тел Балата, и на около километър южно от село Аскар, където картата поставя Сихар. Йерусалим е на 49 км на юг, а Назарет на 54 км на север, така че кладенецът стои горе-долу по средата на пътя от Юдея до Галилея през Самария. Той е едно от малкото евангелски свети места, чието отъждествяване почти никой не оспорва, и днес се пази в криптата на гръцката православна църква „Света Фотина“ — името, което традицията дава на самарянката."
    - "Йоан описва сцената: Исус „дойде в един Самарийски град нарицаем Сихар, близу до местото което даде Яков на сина си Иосифа. И там имаше кладенец Яковов. Исус прочее утруден от път, седеше така на кладенеца; а часът беше около шест.“ Жената възразява: „нито печерпало имаш, и кладенецът е дълбок“, и пита: „Ти по-голем ли си от отца ни Якова който ни даде кладенеца, и той е пил от него, и синовете му, и добитъците му?“ Сочейки Гаризим, тя казва: „Бащите ни в таз гора се поклониха“. Битие познава нивата, но не и кладенеца: Яков „купи стяжанието на нивата дето простря шатъра си от синовете на Емора, отца Сихемова, за сто сребърници“, и в нея били погребани костите на Йосиф, както съобщава Иисус Навин."
    - "Кладенецът е изсечен в скала и е дълбок: Хенри Мондрел през 1697 г. дава тридесет и пет ярда, 105 фута или около 32 м, а Survey of Western Palestine (1882) намира 75 фута, около 23 м, след векове натрупани отпадъци; оттогава е почистен. Църква стояла над него към 80-те години на IV в., когато го посетила Павла на Йероним; поклонникът Аркулф около 680 г. видял кръстовидна църква с кладенеца в средата; кръстоносците я възстановили, а след разрушаването ѝ гръцките православни купили мястото около 1860 г. и завършили днешната църква през 2007 г. Традиционният гроб на Йосиф лежи на няколкостотин метра на север. На Гаризим горе, според датировката на археолога, който го е разкопал, стоял храмът на самаряните от V в. пр.н.е., докато Йоан Хиркан го разрушил, и те още празнуват Пасха на планината."
