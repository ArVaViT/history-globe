id: where-was-colossae
question:
  en: "Where was Colossae?"
  ru: "Где находились Колоссы?"
  uk: "Де були Колоси?"
  es: "¿Dónde estaba Colosas?"
  pt: "Onde ficava Colossos?"
  de: "Wo lag Kolossä?"
  fr: "Où se trouvait Colosses ?"
  pl: "Gdzie leżały Kolosy?"
  it: "Dov’era Colosse?"
  nl: "Waar lag Kolosse?"
  cs: "Kde byly Kolosy?"
  sv: "Var låg Kolossai?"
  nb: "Hvor lå Kolossai?"
  tl: "Saan ang Colosas?"
  da: "Hvor lå Kolossæ?"
  sr: "Где су биле Колосе?"
answer:
  en:
    - "Colossae stood in the valley of the Lycus in Phrygia, in the south-west of Asia Minor, about 170 km east of Ephesus in a straight line; the map point stands on its mound near the town of Honaz in Turkey, under the mountain of the same name. Its two neighbours in the letter were close by: Laodicea 14 km down the valley to the west, and Hierapolis, with its hot springs and white terraces, 19 km to the north-west."
    - "Paul wrote “To the saints and faithful brethren in Christ which are at Colosse”, but had never been there: he speaks of his struggle for them and for those at Laodicea, “as many as have not seen my face in the flesh”. The church had been founded by Epaphras, “who is one of you”, and the letter travelled with Onesimus, also “one of you”, the runaway slave of Philemon, whose house church was in the same town. Paul asked that the letter be read at Laodicea too, and the Laodicean letter at Colossae, so the three churches of the valley were one circle."
    - "Herodotus calls Colossae “a great city of Phrygia” where Xerxes halted in 481 BC, and Xenophon found it “populous, prosperous and large” eighty years later, on the road east from Sardis. By Strabo's day it was a small town overshadowed by Laodicea, though its wool, dyed a colour named after the town, was still prized. An earthquake shook the valley in AD 60, in the reign of Nero; Tacitus records that Laodicea rebuilt itself without help from Rome and does not mention Colossae, and the town faded in the Byzantine period, its people moving to Chonai on the slope above. Long left unexcavated, unlike its neighbours, the mound was surveyed by Pamukkale University from 2021, and the first excavations began there in 2025."
  ru:
    - "Колоссы стояли в долине Лика во Фригии, на юго-западе Малой Азии, примерно в 170 км к востоку от Ефеса по прямой; точка карты стоит на его холме у турецкого города Хоназ, под одноимённой горой. Оба соседа, названные в послании, были рядом: Лаодикия — в 14 км вниз по долине на запад, а Иераполь с его горячими источниками и белыми террасами — в 19 км к северо-западу."
    - "Павел писал «находящимся в Колоссах святым и верным братиям во Христе», но сам там не бывал: он говорит о своём подвиге ради них и ради тех, кто в Лаодикии, «и ради всех, кто не видел лица моего в плоти». Церковь основал Епафрас, «ваш», а послание шло с Онисимом, тоже «от вас», — беглым рабом Филимона, чья домашняя церковь была в том же городе. Павел просил прочесть послание и в Лаодикии, а лаодикийское — в Колоссах, так что три церкви долины составляли один круг."
    - "Геродот называет Колоссы «большим городом Фригии», где Ксеркс останавливался в 481 г. до н. э., а Ксенофонт восемьдесят лет спустя нашёл их «многолюдными, богатыми и большими», на дороге из Сардиса на восток. Ко времени Страбона это был городок в тени Лаодикии, хотя его шерсть, крашенная в цвет, названный по городу, ещё ценилась. В 60 году, при Нероне, долину потрясло землетрясение; Тацит пишет, что Лаодикия отстроилась без помощи Рима, а Колоссы не упоминает, и в византийское время город угас — жители перебрались в Хоны на склоне выше. В отличие от соседей, холм долго не раскапывали; с 2021 года его обследовал Университет Памуккале, а в 2025 году там начались первые раскопки."
  uk:
    - "Колоси стояли в долині Лікуса у Фрігії, на південному заході Малої Азії, приблизно за 170 км на схід від Ефеса по прямій; точка мапи стоїть на їхньому пагорбі біля міста Хоназ у Туреччині, під горою з тією самою назвою. Два сусіди, названі в посланні, були поряд: Лаодікея за 14 км униз долиною на захід та Ієраполіс, з гарячими джерелами й білими терасами, за 19 км на північний захід."
    - "Павло написав «до сьвятих і вірних братів у Христї, що в Колосах», але ніколи там не був: він говорить про свою боротьбу за них і за лаодикійців, «тих, що не бачили обличчя мого в тїлї». Церкву заснував Епафрас, «що з вас», а послання несли разом з Онисимом, також «котрий з між вас», утікачем-рабом Филимона, чия домашня церква була в тому самому місті. Павло просив, щоб послання прочитали й у Лаодікеї, а лаодикійське послання в Колосах, тож три церкви долини були одним колом."
    - "Геродот називає Колоси «великим містом у Фрігії», де Ксеркс зупинився 481 р. до н. е., а Ксенофонт вісімдесят років по тому знайшов їх «людними, заможними і великими», на дорозі на схід від Сард. За Страбона це було невелике місто в тіні Лаодікеї, хоча його вовна, забарвлена кольором, названим на честь міста, ще цінувалася. Землетрус вразив долину 60 р. н. е., за Нерона; Тацит записує, що Лаодікея відбудувалася без допомоги Рима, і про Колоси не згадує, а місто зникло у візантійську добу, його люди переселилися до Хон на схилі вище. Довго нерозкопаний, на відміну від сусідів, пагорб було обстежено Університетом Памуккале з 2021 р., а перші розкопки там почалися 2025 р."
  es:
    - "Colosas se alzaba en el valle del Licos, en Frigia, en el suroeste de Asia Menor, a unos 170 km al este de Éfeso en línea recta; el punto del mapa está en su tell, cerca de la población de Honaz, en Turquía, bajo la montaña del mismo nombre. Sus dos vecinas de la carta estaban cerca: Laodicea, a 14 km valle abajo hacia el oeste, y Hierápolis, con sus fuentes termales y terrazas blancas, a 19 km al noroeste."
    - "Pablo escribió «A los santos y hermanos fieles en Cristo que están en Colosas», pero nunca había estado allí: habla de su lucha por ellos y por los de Laodicea, «los que nunca vieron mi rostro en carne». La iglesia había sido fundada por Epafras, «el cual es de vosotros», y la carta viajó con Onésimo, también «de vosotros», el esclavo fugitivo de Filemón, cuya iglesia doméstica estaba en la misma ciudad. Pablo pidió que la carta se leyera también en Laodicea, y la carta de Laodicea en Colosas, de modo que las tres iglesias del valle formaban un círculo."
    - "Heródoto llama a Colosas «una gran ciudad de Frigia», donde Jerjes hizo alto en el 481 a. C., y Jenofonte la halló «populosa, próspera y grande» ochenta años después, en el camino hacia el este desde Sardis. En tiempos de Estrabón era una pequeña población eclipsada por Laodicea, aunque su lana, teñida de un color que llevaba el nombre de la ciudad, seguía siendo apreciada. Un terremoto sacudió el valle en el 60 d. C., en el reinado de Nerón; Tácito registra que Laodicea se reconstruyó sin ayuda de Roma y no menciona Colosas, y la ciudad se fue extinguiendo en el período bizantino, mudándose su población a Chonai, en la ladera de arriba. Durante mucho tiempo sin excavar, a diferencia de sus vecinas, el tell fue prospectado por la Universidad de Pamukkale desde 2021, y las primeras excavaciones comenzaron allí en 2025."
  pt:
    - "Colossos ficava no vale do Lico, na Frígia, no sudoeste da Ásia Menor, a cerca de 170 km a leste de Éfeso em linha reta; o ponto do mapa está em seu montículo, perto da cidade de Honaz, na Turquia, sob a montanha de mesmo nome. Suas duas vizinhas da carta ficavam perto: Laodiceia, 14 km vale abaixo a oeste, e Hierápolis, com suas fontes quentes e terraços brancos, 19 km a noroeste."
    - "Paulo escreveu “aos santos e fiéis irmãos em Cristo em Colossos”, mas nunca estivera lá: fala de sua luta por eles e pelos de Laodiceia, “por todos os que não me viram pessoalmente”. A igreja fora fundada por Epafras, “que é um de vocês”, e a carta viajou com Onésimo, também “um de vocês”, o escravo fugido de Filemom, cuja igreja doméstica ficava na mesma cidade. Paulo pediu que a carta fosse lida também em Laodiceia, e a carta de Laodiceia em Colossos, de modo que as três igrejas do vale formavam um só círculo."
    - "Heródoto chama Colossos de “uma grande cidade da Frígia”, onde Xerxes parou em 481 a.C., e Xenofonte a achou “populosa, próspera e grande” oitenta anos depois, na estrada para leste desde Sardes. No tempo de Estrabão era uma pequena cidade ofuscada por Laodiceia, embora sua lã, tingida de uma cor que levava o nome da cidade, ainda fosse apreciada. Um terremoto abalou o vale em 60 d.C., no reinado de Nero; Tácito registra que Laodiceia se reconstruiu sem ajuda de Roma e não menciona Colossos, e a cidade se apagou no período bizantino, seu povo passando para Chonai, na encosta acima. Por muito tempo não escavado, ao contrário de suas vizinhas, o montículo foi prospectado pela Universidade de Pamukkale a partir de 2021, e as primeiras escavações ali começaram em 2025."
  de:
    - "Kolossä lag im Tal des Lykos in Phrygien, im Südwesten Kleinasiens, in der Luftlinie etwa 170 km östlich von Ephesus; der Kartenpunkt liegt auf seinem Hügel nahe der Stadt Honaz in der Türkei, unter dem gleichnamigen Berg. Seine beiden Nachbarn im Brief waren nah: Laodizea 14 km talabwärts im Westen und Hierapolis mit seinen heißen Quellen und weißen Terrassen 19 km im Nordwesten."
    - "Paulus schrieb „den Heiligen zu Kolossä und den gläubigen Brüdern in Christo“, war aber nie dort gewesen: Er spricht von seinem Kampf um sie und die zu Laodizea, „alle, die meine Person im Fleisch nicht gesehen haben“. Die Gemeinde war von Epaphras gegründet worden, „der von den euren ist“, und der Brief reiste mit Onesimus, ebenfalls „von den euren“, dem entlaufenen Sklaven des Philemon, dessen Hausgemeinde in derselben Stadt war. Paulus bat, den Brief auch in Laodizea zu lesen und den von Laodizea in Kolossä, sodass die drei Gemeinden des Tals ein Kreis waren."
    - "Herodot nennt Kolossä „eine große Stadt Phrygiens“, wo Xerxes 481 v. Chr. rastete, und Xenophon fand es achtzig Jahre später „volkreich, wohlhabend und groß“ an der Straße von Sardes nach Osten. Zu Strabons Zeit war es eine kleine Stadt im Schatten Laodizeas, doch seine Wolle, in einer nach dem Ort benannten Farbe gefärbt, war noch gesucht. Ein Erdbeben erschütterte das Tal im Jahr 60 n. Chr. unter Nero; Tacitus berichtet, Laodizea habe sich ohne Hilfe Roms wieder aufgebaut, und erwähnt Kolossä nicht, und die Stadt verfiel in byzantinischer Zeit, ihre Bewohner zogen nach Chonai am Hang darüber. Lange unausgegraben, anders als seine Nachbarn, wurde der Hügel ab 2021 von der Pamukkale-Universität vermessen, und 2025 begannen dort die ersten Ausgrabungen."
  fr:
    - "Colosses se dressait dans la vallée du Lycos, en Phrygie, dans le sud-ouest de l’Asie Mineure, à environ 170 km à l’est d’Éphèse en ligne droite ; le point de la carte est sur son tertre près de la ville de Honaz, en Turquie, sous la montagne du même nom. Ses deux voisines de la lettre étaient proches : Laodicée à 14 km en aval de la vallée, à l’ouest, et Hiérapolis, avec ses sources chaudes et ses terrasses blanches, à 19 km au nord-ouest."
    - "Paul écrivit « aux saints et fidèles frères en Christ qui sont à Colosses » mais n’y était jamais allé : il parle du combat qu’il soutient pour eux et pour ceux de Laodicée, « tous ceux qui n’ont pas vu mon visage en la chair ». L’Église avait été fondée par Épaphras, « qui est des vôtres », et la lettre voyagea avec Onésime, lui aussi « des vôtres », l’esclave fugitif de Philémon, dont l’Église domestique était dans la même ville. Paul demanda que la lettre soit lue aussi à Laodicée, et celle de Laodicée à Colosses, de sorte que les trois Églises de la vallée formaient un cercle."
    - "Hérodote appelle Colosses « une grande ville de Phrygie » où Xerxès fit halte en 481 av. J.-C., et Xénophon la trouva « peuplée, prospère et grande » quatre-vingts ans plus tard, sur la route de l’est depuis Sardes. À l’époque de Strabon, c’était une petite ville éclipsée par Laodicée, bien que sa laine, teinte d’une couleur portant le nom de la ville, fût encore prisée. Un tremblement de terre secoua la vallée en 60 apr. J.-C., sous Néron ; Tacite rapporte que Laodicée se reconstruisit sans l’aide de Rome et ne mentionne pas Colosses, et la ville déclina à l’époque byzantine, ses habitants gagnant Chonai sur la pente au-dessus. Longtemps laissé sans fouille, contrairement à ses voisines, le tertre fut prospecté par l’université de Pamukkale à partir de 2021, et les premières fouilles y ont commencé en 2025."
  pl:
    - "Kolosy stały w dolinie Likosu we Frygii, w południowo-zachodniej Azji Mniejszej, około 170 km na wschód od Efezu w linii prostej; punkt na mapie stoi na ich kopcu koło miasta Honaz w Turcji, pod górą o tej samej nazwie. Dwaj ich sąsiedzi z listu leżeli blisko: Laodycea 14 km w dół doliny na zachód i Hierapolis, ze swoimi gorącymi źródłami i białymi tarasami, 19 km na północny zachód."
    - "Paweł napisał „Tym, którzy są w Kolosiech, świętym i wiernym braciom w Chrystusie Jezusie”, ale nigdy tam nie był: mówi o swoim zmaganiu o nich i o tych w Laodycei, „którzykolwiek nie widzieli oblicza mego w ciele”. Kościół założył Epafras, „który z was jest sługa Chrystusowy”, a list zaniósł Onezym, także „który jest z was”, zbiegły niewolnik Filemona, którego Kościół domowy był w tym samym mieście. Paweł prosił, by list przeczytano także w Laodycei, a list laodycejski w Kolosach, tak że trzy Kościoły doliny stanowiły jeden krąg."
    - "Herodot nazywa Kolosy „wielkim miastem Frygii”, gdzie Kserkses zatrzymał się w 481 p.n.e., a Ksenofont osiemdziesiąt lat później znalazł je „ludnym, zamożnym i dużym”, przy drodze na wschód z Sardes. Za czasów Strabona było małym miastem przyćmionym przez Laodyceę, choć jego wełna, barwiona kolorem nazwanym od miasta, była wciąż ceniona. Trzęsienie ziemi wstrząsnęło doliną w 60 n.e., za panowania Nerona; Tacyt notuje, że Laodycea odbudowała się bez pomocy Rzymu, a o Kolosach nie wspomina, i miasto zanikało w okresie bizantyjskim, a jego mieszkańcy przenieśli się do Chonai na stoku powyżej. Przez długi czas niewykopywany, w przeciwieństwie do sąsiadów, kopiec badał Uniwersytet Pamukkale od 2021, a pierwsze wykopaliska rozpoczęły się tam w 2025."
  it:
    - "Colosse sorgeva nella valle del Lico in Frigia, nel sud-ovest dell’Asia Minore, a circa 170 km a est di Efeso in linea retta; il punto della mappa sta sul suo tumulo presso la città di Honaz in Turchia, sotto il monte omonimo. Le due città vicine nominate nella lettera erano a breve distanza: Laodicea 14 km a valle verso ovest, e Gerapoli, con le sue sorgenti calde e le terrazze bianche, 19 km a nord-ovest."
    - "Paolo scrisse «ai santi e fedeli fratelli in Cristo che sono in Colosse», ma non vi era mai stato: parla della sua lotta per loro e per quelli di Laodicea, «e per tutti quelli che non hanno veduto la mia faccia». La chiesa era stata fondata da Epafra, «che è dei vostri», e la lettera viaggiò con Onesimo, anch’egli «dei vostri», lo schiavo fuggitivo di Filemone, la cui chiesa domestica era nella stessa città. Paolo chiese che la lettera fosse letta anche a Laodicea, e quella di Laodicea a Colosse, così le tre chiese della valle erano un solo cerchio."
    - "Erodoto chiama Colosse «una grande città della Frigia» dove Serse sostò nel 481 a.C., e Senofonte la trovò «popolosa, prospera e grande» ottant’anni dopo, sulla strada verso est da Sardi. Ai tempi di Strabone era una piccola città eclissata da Laodicea, benché la sua lana, tinta di un colore che portava il nome della città, fosse ancora apprezzata. Un terremoto scosse la valle nel 60 d.C., sotto Nerone; Tacito registra che Laodicea si ricostruì senza aiuto da Roma e non menziona Colosse, e la città svanì in età bizantina, la sua gente trasferendosi a Chonai sul pendio sopra. A lungo lasciato non scavato, a differenza dei suoi vicini, il tumulo fu esplorato dall’Università di Pamukkale dal 2021, e i primi scavi vi cominciarono nel 2025."
  nl:
    - "Kolosse lag in het dal van de Lycus in Frygië, in het zuidwesten van Klein-Azië, hemelsbreed ongeveer 170 km ten oosten van Efeze; het punt op de kaart staat op zijn heuvel bij de stad Honaz in Turkije, onder de berg met dezelfde naam. Zijn twee buren uit de brief lagen vlakbij: Laodicea 14 km verderop in het dal naar het westen, en Hiërapolis, met zijn warme bronnen en witte terrassen, 19 km naar het noordwesten."
    - "Paulus schreef “Den heiligen en gelovigen broederen in Christus, die te Kolosse zijn”, maar was er nooit geweest: hij spreekt van zijn strijd voor hen en voor hen te Laodicea, “zo velen als er mijn aangezicht in het vlees niet hebben gezien”. De gemeente was gesticht door Epafras, “die uit de uwen is”, en de brief reisde met Onesimus, eveneens “uit de uwen”, de weggelopen slaaf van Filemon, wiens huisgemeente in dezelfde stad was. Paulus vroeg de brief ook te Laodicea te lezen, en de Laodicese brief te Kolosse, zodat de drie gemeenten van het dal één kring vormden."
    - "Herodotus noemt Kolosse “een grote stad van Frygië” waar Xerxes in 481 v.Chr. halt hield, en Xenophon vond haar tachtig jaar later “volkrijk, welvarend en groot”, aan de weg oostwaarts vanuit Sardes. In Strabo’s tijd was het een klein stadje overschaduwd door Laodicea, al was zijn wol, geverfd in een naar de stad genoemde kleur, nog gewild. Een aardbeving schudde het dal in 60 n.Chr., onder Nero; Tacitus meldt dat Laodicea zichzelf zonder hulp van Rome herbouwde en noemt Kolosse niet, en de stad verdween in de Byzantijnse tijd, haar bewoners trokken naar Chonai op de helling erboven. Lang onopgegraven, anders dan zijn buren, werd de heuvel vanaf 2021 door de Pamukkale-universiteit onderzocht, en in 2025 begonnen daar de eerste opgravingen."
  cs:
    - "Kolosy stály v údolí Lykos ve Frygii, na jihozápadě Malé Asie, asi 170 km východně od Efezu vzdušnou čarou; bod na mapě stojí na jejich pahorku poblíž města Honaz v Turecku, pod horou téhož jména. Jeho dva sousedé z listu byli nablízku: Laodikeia 14 km dolů údolím na západ a Hierapolis s horkými prameny a bílými terasami 19 km severozápadně."
    - "Pavel psal „těm, kteříž jsou v městě Kolossis, svatým a věrným bratřím v Kristu“, ale nikdy tam nebyl: mluví o svém zápase za ně i za ty v Laodikeii, „kteřížkoli neviděli tváři mé podle těla“. Církev založil Epafras, „kterýž od vás jest“, a list nesl Onésimos, rovněž „kterýž jest tam od vás“, uprchlý otrok Filemonův, jehož domácí církev byla ve stejném městě. Pavel žádal, aby se list četl i v Laodikeii a laodikejský list v Kolosech, takže tři církve údolí byly jedním kruhem."
    - "Hérodotos nazývá Kolosy „velkým městem ve Frygii“, kde se roku 481 př. n. l. zastavil Xerxes, a Xenofón je o osmdesát let později shledal „lidnaté, bohaté a velké“, na cestě na východ ze Sard. Za Strabóna to bylo malé město zastíněné Laodikeií, ač jeho vlna, barvená barvou pojmenovanou po městě, byla dosud ceněna. Zemětřesení otřáslo údolím roku 60 n. l., za vlády Neronovy; Tacitus zaznamenává, že Laodikeia se obnovila bez pomoci Říma, a Kolos nezmiňuje, a město v byzantském období upadlo, jeho lidé se přestěhovali do Chonai na svahu nad ním. Pahorek, dlouho nezkoumaný, na rozdíl od svých sousedů, byl zkoumán Univerzitou Pamukkale od roku 2021 a první vykopávky tam začaly roku 2025."
  sv:
    - "Kolossai låg i Lykosdalen i Frygien, i sydvästra Mindre Asien, omkring 170 km öster om Efesos fågelvägen; kartpunkten står på dess kulle nära staden Honaz i Turkiet, under berget med samma namn. Dess två grannar i brevet låg nära: Laodikeia 14 km nedför dalen åt väster, och Hierapolis, med sina varma källor och vita terrasser, 19 km åt nordväst."
    - "Paulus skrev till ”de heliga som bo i Kolosse, de troende bröderna i Kristus”, men hade aldrig varit där: han talar om sin kamp för dem och för dem i Laodikeia, ”för alla de andra som icke personligen hava sett mitt ansikte”. Församlingen hade grundats av Epafras, ”eder landsman”, och brevet reste med Onesimos, också ”eder landsman”, Filemons förrymde slav, vars husförsamling fanns i samma stad. Paulus bad att brevet skulle läsas även i Laodikeia, och Laodikeiabrevet i Kolossai, så att dalens tre församlingar utgjorde en krets."
    - "Herodotos kallar Kolossai ”en stor stad i Frygien” där Xerxes gjorde uppehåll 481 f.Kr., och Xenofon fann den ”folkrik, välmående och stor” åttio år senare, på vägen österut från Sardes. På Strabons tid var den en liten stad i skuggan av Laodikeia, fast dess ull, färgad i en färg uppkallad efter staden, fortfarande var eftertraktad. En jordbävning skakade dalen år 60 e.Kr., under Neros regering; Tacitus uppger att Laodikeia byggde upp sig själv utan hjälp från Rom och nämner inte Kolossai, och staden förföll under bysantinsk tid, då dess invånare flyttade till Chonai på sluttningen ovanför. Kullen lämnades länge ogrävd, till skillnad från grannarna, men kartlades av Pamukkale universitet från 2021, och de första utgrävningarna började där 2025."
  nb:
    - "Kolossai sto i Lykos-dalen i Frygia, i sørvest i Lilleasia, omtrent 170 km øst for Efesos i luftlinje; kartpunktet står på dens haug nær byen Honaz i Tyrkia, under fjellet med samme navn. De to naboene i brevet lå like ved: Laodikea 14 km nede i dalen mot vest, og Hierapolis, med sine varme kilder og hvite terrasser, 19 km mot nordvest."
    - "Paulus skrev «til de hellige og troende brødre i Kristus i Kolossæ», men hadde aldri vært der: han taler om sin strid for dem og for dem i Laodikea, «så mange som ikke har sett mitt åsyn i kjødet». Menigheten var grunnlagt av Epafras, «som er fra eders by», og brevet ble sendt med Onesimus, også «fra eders by», Filemons rømte slave, hvis husmenighet var i den samme byen. Paulus ba om at brevet skulle leses også i Laodikea, og Laodikea-brevet i Kolossai, så de tre menighetene i dalen var én krets."
    - "Herodot kaller Kolossai «en stor by i Frygia» der Xerxes gjorde holdt i 481 f.Kr., og Xenofon fant den «folkerik, velstående og stor» åtti år senere, på veien østover fra Sardes. På Strabons tid var den en liten by i skyggen av Laodikea, selv om ullen, farget i en farge oppkalt etter byen, fortsatt var verdsatt. Et jordskjelv rystet dalen i 60 e.Kr., under Nero; Tacitus melder at Laodikea gjenreiste seg uten hjelp fra Roma og nevner ikke Kolossai, og byen visnet hen i den bysantinske perioden, da folket flyttet til Chonai i skråningen over. Haugen ble lenge ikke gravd ut, i motsetning til naboene; Pamukkale-universitetet kartla den fra 2021, og de første utgravingene begynte der i 2025."
  tl:
    - "Nakatayo ang Colosas sa libis ng Lyco sa Frigia, sa timog-kanluran ng Asia Menor, mga 170 km sa silangan ng Efeso sa tuwid na guhit; ang tuldok sa mapa ay nasa burol nito malapit sa bayan ng Honaz sa Turkiya, sa ilalim ng bundok na kapangalan. Malapit ang dalawang kapitbahay nito sa liham: ang Laodicea 14 km pababa sa libis sa kanluran, at ang Hierapolis, na may mainit na bukal at puting mga terasa, 19 km sa hilagang-kanluran."
    - "Sumulat si Pablo “Sa mga banal at tapat na mga kapatid kay Cristo, na nangasa sa Colosas”, ngunit hindi pa siya nakararating doon: nagsasalita siya ng kaniyang pagpipilit para sa kanila at sa mga nasa Laodicea, “sa lahat na hindi nakakita ng mukha ko sa laman”. Itinatag ang iglesia ni Epafras, “na isa sa inyo”, at kasama ng liham si Onesimo, “isa sa inyo” din, ang tumakas na alipin ni Filemon, na ang iglesia sa bahay ay nasa parehong bayan. Hiniling ni Pablo na basahin din ang liham sa Laodicea, at ang liham ng Laodicea sa Colosas, kaya iisang bilog ang tatlong iglesia ng libis."
    - "Tinatawag ni Herodoto ang Colosas na “dakilang lungsod ng Frigia” kung saan huminto si Xerxes noong 481 BK, at nakita ito ni Xenofonte na “makapal ang populasyon, maunlad at malaki” walumpung taon pagkaraan, sa daan pasilangan mula Sardis. Noong panahon ni Estrabon, maliit na bayan na ito na natatabunan ng Laodicea, bagaman pinahahalagahan pa rin ang lana nito, na tinina ng kulay na ipinangalan sa bayan. Niyanig ng lindol ang libis noong 60 AD, sa paghahari ni Nero; itinala ni Tacito na itinayong muli ng Laodicea ang sarili nang walang tulong ng Roma at hindi binabanggit ang Colosas, at nawala ang bayan sa panahong Bizantino, lumipat ang mga tao nito sa Chonai sa dalisdis sa itaas. Matagal na hindi hinukay, di tulad ng mga kapitbahay nito, ang burol ay sinuri ng Pamukkale University mula 2021, at nagsimula roon ang unang mga paghuhukay noong 2025."
  da:
    - "Kolossæ lå i Lykosdalen i Frygien, i Lilleasiens sydvest, omkring 170 km øst for Efesos i luftlinje; kortets punkt står på dens høj nær byen Honaz i Tyrkiet, under bjerget af samme navn. Dens to naboer i brevet lå tæt på: Laodikea 14 km nede ad dalen mod vest og Hierapolis, med sine varme kilder og hvide terrasser, 19 km mod nordvest."
    - "Paulus skrev »til de hellige og troende Brødre i Kristus i Kolossæ«, men havde aldrig været dér: han taler om sin kamp for dem og for dem i Laodikea, »alle, som ikke have set mit Aasyn i Kødet«. Menigheden var grundlagt af Epafras, »han, som er fra eders By«, og brevet rejste med Onesimus, »som er fra eders By«, Filemons undslupne træl, hvis husmenighed var i samme by. Paulus bad om, at brevet også blev læst i Laodikea, og Laodikea-brevet i Kolossæ, så dalens tre menigheder var én kreds."
    - "Herodot kalder Kolossæ »en stor by i Frygien«, hvor Xerxes holdt hvil i 481 f.Kr., og Xenofon fandt den »folkerig, velstående og stor« firs år senere, på vejen øst fra Sardes. På Strabons tid var den en lille by i skyggen af Laodikea, selv om dens uld, farvet i en farve opkaldt efter byen, stadig var eftertragtet. Et jordskælv rystede dalen i 60 e.Kr., under Nero; Tacitus beretter, at Laodikea genopbyggede sig selv uden hjælp fra Rom og nævner ikke Kolossæ, og byen forsvandt i den byzantinske periode, idet dens folk flyttede til Chonai på skråningen ovenfor. Længe uudgravet, i modsætning til sine naboer, blev højen undersøgt af Pamukkale Universitet fra 2021, og de første udgravninger begyndte dér i 2025."
  sr:
    - "Колосе су стајале у долини Лика у Фригији, на југозападу Мале Азије, око 170 км источно од Ефеса правом линијом; тачка на карти стоји на њиховој хумци близу града Хоназа у Турској, испод планине истог имена. Два суседа из посланице била су близу: Лаодикија 14 км низ долину на западу, и Хијераполис, са топлим изворима и белим терасама, 19 км северозападно."
    - "Павле је писао „светима који су у Колосима и верној браћи у Христу Исусу“, али никад није био тамо: говори о својој борби за њих и за оне у Лаодикији, „за све који не видеше лице моје у телу“. Цркву је основао Епафрас, „који је од вас“, а посланицу је носио Онисим, такође „који је од вас“, одбегли роб Филимонов, чија је кућна црква била у истом граду. Павле је тражио да се посланица прочита и у Лаодикији, а лаодикијска у Колосима, па су три цркве долине биле један круг."
    - "Херодот зове Колосе „великим градом Фригије“ где се Ксеркс зауставио 481. п. н. е., а Ксенофонт га је осамдесет година касније нашао „насељеним, напредним и великим“, на путу на исток од Сарда. У Страбоново доба био је мали град у сенци Лаодикије, мада се његова вуна, бојена бојом названом по граду, и даље ценила. Земљотрес је потресао долину 60. н. е., за Неронове владавине; Тацит бележи да се Лаодикија обновила без помоћи Рима и не помиње Колосе, а град је бледео у византијско доба, и његови становници су се преселили у Хоне на падини изнад. Дуго неископавана, за разлику од суседа, хумка је прегледана од 2021. од стране Универзитета Памукале, а прва ископавања тамо почела су 2025."
