id: how-far-jerusalem-to-bethlehem
question:
  en: "How far is Bethlehem from Jerusalem?"
  ru: "Как далеко от Иерусалима до Вифлеема?"
  uk: "Як далеко Вифлеєм від Єрусалиму?"
  es: "¿A qué distancia está Belén de Jerusalén?"
  pt: "Qual é a distância de Jerusalém a Belém?"
  de: "Wie weit ist Bethlehem von Jerusalem entfernt?"
  fr: "À quelle distance de Jérusalem se trouve Bethléem ?"
answer:
  en:
    - "Bethlehem is about 8 km south of Jerusalem in a straight line and about 10 km by the Roman road on the map, a walk of two to three hours. Eusebius, in the fourth century, put it at six Roman miles, about 9 km, and so did the pilgrim of Bordeaux in AD 333: four miles to Rachel's tomb and two more to the town."
    - "The two towns sit on the same ridge of the Judean hills, with the road running south past Rachel's tomb: “And Rachel died, and was buried in the way to Ephrath, which is Beth-lehem.” Micah's “Beth-lehem Ephratah, though thou be little among the thousands of Judah” answered the question Herod put to the scribes, and the Magi who had come to Jerusalem rode on the short last stage to the child. Herod then “slew all the children that were in Bethlehem, and in all the coasts thereof”; a town of this size, within an evening's walk of the capital, would have had few children of two years and under."
    - "The nearness explains the ease with which Joseph, of “the house and lineage of David”, could be counted in his ancestral town and the family could present the child in the Temple forty days later. In the second century Justin Martyr, born in Palestine, said Jesus was born in a cave near the village, and Origen wrote that the cave was shown to visitors; Constantine had the Church of the Nativity built over it, dedicated in 339, and the present building, rebuilt by Justinian in the sixth century, still stands on the same spot."
  ru:
    - "Вифлеем лежит примерно в 8 км к югу от Иерусалима по прямой и примерно в 10 км по римской дороге на карте — два-три часа ходьбы. Евсевий в IV веке считал шесть римских миль, около 9 км, и столько же бордоский паломник в 333 году: четыре мили до гробницы Рахили и ещё две до города."
    - "Два города стоят на одном хребте Иудейских гор, а дорога идёт на юг мимо гробницы Рахили: «И умерла Рахиль, и погребена на дороге в Ефрафу, то есть Вифлеем». Слова Михея «И ты, Вифлеем-Ефрафа, мал ли ты между тысячами Иудиными?» были ответом на вопрос, который Ирод задал книжникам, и волхвы, пришедшие в Иерусалим, проехали короткий последний переход к Младенцу. Затем Ирод «послал избить всех младенцев в Вифлееме и во всех пределах его»; в городке такого размера, в вечернем переходе от столицы, детей двух лет и младше было немного."
    - "Близость объясняет, как легко Иосиф, «из дома и рода Давидова», мог записаться в городе предков, а семья сорок дней спустя принести Младенца в Храм. Во II веке Иустин Мученик, уроженец Палестины, писал, что Иисус родился в пещере близ селения, а Ориген — что пещеру показывают приходящим; Константин велел построить над ней храм Рождества, освящённый в 339 году, и нынешнее здание, перестроенное Юстинианом в VI веке, стоит на том же месте."
  uk:
    - "Вифлеєм лежить приблизно за 8 км на південь від Єрусалиму по прямій і приблизно за 10 км римською дорогою на мапі — дві-три години ходу. Євсевій у IV ст. визначав відстань у шість римських миль, близько 9 км, і так само чинив Бордоський прочанин 333 р.: чотири милі до гробниці Рахілі й ще дві до містечка."
    - "Обидва міста стоять на одному хребті Юдейських пагорбів, а дорога йде на південь повз гробницю Рахілі: «Умерла ж Рахеля, і поховано її на шляху до Евфрата, се єсть Бетлегем». Слова Міхи «І ти, Бетлеєме — ти, Ефрато, хоч ти малий між тисячами в Юдеї» були відповіддю на питання, яке Ірод поставив книжникам, а волхви, що прийшли до Єрусалиму, їхали далі короткою останньою ділянкою до дитяти. Згодом Ірод «послав повбивати всїх дїтей у Витлеємі й у всїх границях його»; у містечку такого розміру, за вечір ходу від столиці, дітей віком до двох років було б небагато."
    - "Близькість пояснює, чому Йосипа, «з дому й роду Давидового», було легко записати в рідному місті предків і чому родина могла піднести дитя в Храмі за сорок днів. У II ст. Юстин Мученик, що народився в Палестині, казав, що Ісус народився в печері поблизу села, а Оріген пише, що печеру показували відвідувачам; Костянтин звів над нею церкву Різдва, освячену 339 р., а нинішня будівля, перебудована Юстиніаном у VI ст., і досі стоїть на тому самому місці."
  es:
    - "Belén está a unos 8 km al sur de Jerusalén en línea recta y a unos 10 km por la calzada romana del mapa, un paseo de dos a tres horas. Eusebio, en el siglo IV, la situó a seis millas romanas, unos 9 km, y lo mismo hizo el peregrino de Burdeos en el año 333 d. C.: cuatro millas hasta la tumba de Raquel y dos más hasta la población."
    - "Las dos poblaciones se asientan en la misma cresta de las colinas de Judea, con el camino que va hacia el sur pasando por la tumba de Raquel: «Así murió Rachêl, y fué sepultada en el camino de Ephrata, la cual es Beth-lehem». El «Beth-lehem Ephrata, pequeña para ser en los millares de Judá» de Miqueas respondió a la pregunta que Herodes hizo a los escribas, y los magos que habían llegado a Jerusalén cabalgaron el breve último tramo hasta el niño. Herodes «mató á todos los niños que había en Bethlehem y en todos sus términos»; una población de este tamaño, a una tarde de camino de la capital, habría tenido pocos niños de dos años abajo."
    - "La cercanía explica la facilidad con que José, «de la casa y familia de David», pudo ser censado en su ciudad ancestral y la familia pudo presentar al niño en el Templo cuarenta días después. En el siglo II, Justino Mártir, nacido en Palestina, dijo que Jesús nació en una cueva cercana a la aldea, y Orígenes escribió que la cueva se mostraba a los visitantes; Constantino hizo construir sobre ella la iglesia de la Natividad, dedicada en 339, y el edificio actual, reconstruido por Justiniano en el siglo VI, sigue en pie en el mismo lugar."
  pt:
    - "Belém fica a cerca de 8 km ao sul de Jerusalém em linha reta e a cerca de 10 km pela estrada romana do mapa, uma caminhada de duas a três horas. Eusébio, no século IV, a situou a seis milhas romanas, cerca de 9 km, e o mesmo fez o peregrino de Bordeaux em 333 d.C.: quatro milhas até o túmulo de Raquel e mais duas até a cidade."
    - "As duas cidades ficam na mesma crista dos montes da Judeia, com a estrada correndo para o sul, passando pelo túmulo de Raquel: “Raquel morreu, e foi sepultada no caminho para Efrata (também chamada Belém)”. O “Belém Efrata, embora seja pequena entre os clãs de Judá”, de Miqueias, respondeu à pergunta que Herodes fez aos escribas, e os magos, que tinham vindo a Jerusalém, cavalgaram o curto último trecho até o menino. Herodes então “mandou matar todos os meninos que havia em Belém e em todos os seus arredores”; uma cidade desse tamanho, a uma caminhada de tarde da capital, teria poucas crianças de dois anos para baixo."
    - "A proximidade explica a facilidade com que José, “da casa e família de Davi”, podia ser recenseado em sua cidade ancestral e a família podia apresentar o menino no Templo quarenta dias depois. No século II, Justino Mártir, nascido na Palestina, disse que Jesus nasceu numa gruta perto da aldeia, e Orígenes escreveu que a gruta era mostrada aos visitantes; Constantino mandou construir sobre ela a Igreja da Natividade, dedicada em 339, e o edifício atual, reconstruído por Justiniano no século VI, ainda se ergue no mesmo lugar."
  de:
    - "Bethlehem liegt etwa 8 km südlich von Jerusalem in der Luftlinie und etwa 10 km auf der römischen Straße der Karte, ein Fußmarsch von zwei bis drei Stunden. Eusebius setzte es im 4. Jahrhundert auf sechs römische Meilen an, etwa 9 km, und ebenso der Pilger von Bordeaux im Jahr 333 n. Chr.: vier Meilen bis zum Grab Rahels und zwei weitere bis zur Stadt."
    - "Die beiden Städte liegen auf demselben Rücken der judäischen Berge, die Straße führt nach Süden am Grab Rahels vorbei: „Also starb Rahel und ward begraben an dem Wege gen Ephrath, das nun heißt Bethlehem.“ Michas „Und du Bethlehem Ephrata, die du klein bist unter den Städten in Juda“ beantwortete die Frage, die Herodes den Schriftgelehrten stellte, und die Weisen, die nach Jerusalem gekommen waren, zogen die kurze letzte Strecke zum Kind weiter. Herodes „ließ alle Kinder zu Bethlehem töten und an seinen ganzen Grenzen“; in einer Stadt dieser Größe, einen Abendspaziergang von der Hauptstadt entfernt, wird es nur wenige Kinder von zwei Jahren und darunter gegeben haben."
    - "Die Nähe erklärt, wie leicht Josef, „von dem Hause und Geschlechte Davids“, in seiner Vaterstadt gezählt werden und die Familie das Kind vierzig Tage später im Tempel darstellen konnte. Im 2. Jahrhundert sagte Justin der Märtyrer, der in Palästina geboren war, Jesus sei in einer Höhle nahe dem Dorf geboren worden, und Origenes schrieb, die Höhle werde Besuchern gezeigt; Konstantin ließ über ihr die Geburtskirche errichten, 339 geweiht, und der heutige Bau, im 6. Jahrhundert von Justinian erneuert, steht noch an derselben Stelle."
  fr:
    - "Bethléem est à environ 8 km au sud de Jérusalem en ligne droite et à environ 10 km par la route romaine de la carte, soit deux à trois heures de marche. Eusèbe, au IVe siècle, la situait à six milles romains, environ 9 km, tout comme le pèlerin de Bordeaux en 333 apr. J.-C. : quatre milles jusqu’au tombeau de Rachel et deux de plus jusqu’à la ville."
    - "Les deux villes sont sur la même crête des collines de Judée, la route filant vers le sud devant le tombeau de Rachel : « Rachel mourut, et elle fut enterrée sur le chemin d’Éphrata, qui est Bethléhem. » Le « Bethléhem Éphrata, petite entre les milliers de Juda » de Michée répondit à la question qu’Hérode posa aux scribes, et les mages venus à Jérusalem firent à cheval le court dernier trajet jusqu’à l’enfant. Hérode « envoya tuer tous les enfants de deux ans et au-dessous qui étaient à Bethléhem et dans tout son territoire » ; une ville de cette taille, à une soirée de marche de la capitale, devait compter peu d’enfants de cet âge."
    - "La proximité explique l’aisance avec laquelle Joseph, « de la maison et de la famille de David », put se faire inscrire dans sa ville ancestrale, et la famille présenter l’enfant au Temple quarante jours plus tard. Au IIe siècle, Justin Martyr, né en Palestine, dit que Jésus naquit dans une grotte près du village, et Origène écrivit qu’on la montrait aux visiteurs ; Constantin fit bâtir sur elle l’église de la Nativité, consacrée en 339, et l’édifice actuel, reconstruit par Justinien au VIe siècle, se dresse toujours au même endroit."
