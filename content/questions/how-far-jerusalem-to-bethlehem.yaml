id: how-far-jerusalem-to-bethlehem
question:
  en: "How far is Bethlehem from Jerusalem?"
  ru: "Как далеко от Иерусалима до Вифлеема?"
  uk: "Як далеко Вифлеєм від Єрусалиму?"
  es: "¿A qué distancia está Belén de Jerusalén?"
  pt: "Qual é a distância de Jerusalém a Belém?"
  de: "Wie weit ist Bethlehem von Jerusalem entfernt?"
  fr: "À quelle distance de Jérusalem se trouve Bethléem ?"
  pl: "Jak daleko od Jerozolimy jest Betlejem?"
  it: "Quanto dista Betlemme da Gerusalemme?"
  nl: "Hoe ver ligt Bethlehem van Jeruzalem?"
  cs: "Jak daleko je Betlém od Jeruzaléma?"
  sv: "Hur långt är Betlehem från Jerusalem?"
  nb: "Hvor langt er Betlehem fra Jerusalem?"
  tl: "Gaano kalayo ang Bethlehem mula sa Jerusalem?"
  da: "Hvor langt er Betlehem fra Jerusalem?"
  sr: "Колико је Витлејем удаљен од Јерусалима?"
  hu: "Milyen messze van Betlehem Jeruzsálemtől?"
  fi: "Kuinka kaukana Betlehem on Jerusalemista?"
  vi: "Bết-lê-hem cách Giê-ru-sa-lem bao xa?"
  ro: "Cât de departe este Betleemul de Ierusalim?"
  bg: "Колко далеч е Витлеем от Йерусалим?"
answer:
  en:
    - "Bethlehem is about 8 km south of Jerusalem in a straight line and about 10 km by the Roman road on the map, a walk of two to three hours. Eusebius, in the fourth century, put it at six Roman miles, about 9 km, and so did the pilgrim of Bordeaux in AD 333: four miles to Rachel's tomb and two more to the town."
    - "The two towns sit on the same ridge of the Judean hills, with the road running south past Rachel's tomb: “And Rachel died, and was buried in the way to Ephrath, which is Beth-lehem.” Micah's “Beth-lehem Ephratah, though thou be little among the thousands of Judah” answered the question Herod put to the scribes, and the Magi who had come to Jerusalem rode on the short last stage to the child. Herod then “slew all the children that were in Bethlehem, and in all the coasts thereof”; a town of this size, within an evening's walk of the capital, would have had few children of two years and under."
    - "The nearness explains the ease with which Joseph, of “the house and lineage of David”, could be counted in his ancestral town and the family could present the child in the Temple forty days later. In the second century Justin Martyr, born in Palestine, said Jesus was born in a cave near the village, and Origen wrote that the cave was shown to visitors; Constantine had the Church of the Nativity built over it, dedicated in 339, and the present building, rebuilt by Justinian in the sixth century, still stands on the same spot."
  ru:
    - "Вифлеем лежит примерно в 8 км к югу от Иерусалима по прямой и примерно в 10 км по римской дороге на карте — два-три часа ходьбы. Евсевий в IV веке считал шесть римских миль, около 9 км, и столько же бордоский паломник в 333 году: четыре мили до гробницы Рахили и ещё две до города."
    - "Два города стоят на одном хребте Иудейских гор, а дорога идёт на юг мимо гробницы Рахили: «И умерла Рахиль, и погребена на дороге в Ефрафу, то есть Вифлеем». Слова Михея «И ты, Вифлеем-Ефрафа, мал ли ты между тысячами Иудиными?» были ответом на вопрос, который Ирод задал книжникам, и волхвы, пришедшие в Иерусалим, проехали короткий последний переход к Младенцу. Затем Ирод «послал избить всех младенцев в Вифлееме и во всех пределах его»; в городке такого размера, в вечернем переходе от столицы, детей двух лет и младше было немного."
    - "Близость объясняет, как легко Иосиф, «из дома и рода Давидова», мог записаться в городе предков, а семья сорок дней спустя принести Младенца в Храм. Во II веке Иустин Мученик, уроженец Палестины, писал, что Иисус родился в пещере близ селения, а Ориген — что пещеру показывают приходящим; Константин велел построить над ней храм Рождества, освящённый в 339 году, и нынешнее здание, перестроенное Юстинианом в VI веке, стоит на том же месте."
  uk:
    - "Вифлеєм лежить приблизно за 8 км на південь від Єрусалиму по прямій і приблизно за 10 км римською дорогою на мапі — дві-три години ходу. Євсевій у IV ст. визначав відстань у шість римських миль, близько 9 км, і так само чинив Бордоський прочанин 333 р.: чотири милі до гробниці Рахілі й ще дві до містечка."
    - "Обидва міста стоять на одному хребті Юдейських пагорбів, а дорога йде на південь повз гробницю Рахілі: «Умерла ж Рахеля, і поховано її на шляху до Евфрата, се єсть Бетлегем». Слова Міхи «І ти, Бетлеєме — ти, Ефрато, хоч ти малий між тисячами в Юдеї» були відповіддю на питання, яке Ірод поставив книжникам, а волхви, що прийшли до Єрусалиму, їхали далі короткою останньою ділянкою до дитяти. Згодом Ірод «послав повбивати всїх дїтей у Витлеємі й у всїх границях його»; у містечку такого розміру, за вечір ходу від столиці, дітей віком до двох років було б небагато."
    - "Близькість пояснює, чому Йосипа, «з дому й роду Давидового», було легко записати в рідному місті предків і чому родина могла піднести дитя в Храмі за сорок днів. У II ст. Юстин Мученик, що народився в Палестині, казав, що Ісус народився в печері поблизу села, а Оріген пише, що печеру показували відвідувачам; Костянтин звів над нею церкву Різдва, освячену 339 р., а нинішня будівля, перебудована Юстиніаном у VI ст., і досі стоїть на тому самому місці."
  es:
    - "Belén está a unos 8 km al sur de Jerusalén en línea recta y a unos 10 km por la calzada romana del mapa, un paseo de dos a tres horas. Eusebio, en el siglo IV, la situó a seis millas romanas, unos 9 km, y lo mismo hizo el peregrino de Burdeos en el año 333 d. C.: cuatro millas hasta la tumba de Raquel y dos más hasta la población."
    - "Las dos poblaciones se asientan en la misma cresta de las colinas de Judea, con el camino que va hacia el sur pasando por la tumba de Raquel: «Así murió Rachêl, y fué sepultada en el camino de Ephrata, la cual es Beth-lehem». El «Beth-lehem Ephrata, pequeña para ser en los millares de Judá» de Miqueas respondió a la pregunta que Herodes hizo a los escribas, y los magos que habían llegado a Jerusalén cabalgaron el breve último tramo hasta el niño. Herodes «mató á todos los niños que había en Bethlehem y en todos sus términos»; una población de este tamaño, a una tarde de camino de la capital, habría tenido pocos niños de dos años abajo."
    - "La cercanía explica la facilidad con que José, «de la casa y familia de David», pudo ser censado en su ciudad ancestral y la familia pudo presentar al niño en el Templo cuarenta días después. En el siglo II, Justino Mártir, nacido en Palestina, dijo que Jesús nació en una cueva cercana a la aldea, y Orígenes escribió que la cueva se mostraba a los visitantes; Constantino hizo construir sobre ella la iglesia de la Natividad, dedicada en 339, y el edificio actual, reconstruido por Justiniano en el siglo VI, sigue en pie en el mismo lugar."
  pt:
    - "Belém fica a cerca de 8 km ao sul de Jerusalém em linha reta e a cerca de 10 km pela estrada romana do mapa, uma caminhada de duas a três horas. Eusébio, no século IV, a situou a seis milhas romanas, cerca de 9 km, e o mesmo fez o peregrino de Bordeaux em 333 d.C.: quatro milhas até o túmulo de Raquel e mais duas até a cidade."
    - "As duas cidades ficam na mesma crista dos montes da Judeia, com a estrada correndo para o sul, passando pelo túmulo de Raquel: “Raquel morreu, e foi sepultada no caminho para Efrata (também chamada Belém)”. O “Belém Efrata, embora seja pequena entre os clãs de Judá”, de Miqueias, respondeu à pergunta que Herodes fez aos escribas, e os magos, que tinham vindo a Jerusalém, cavalgaram o curto último trecho até o menino. Herodes então “mandou matar todos os meninos que havia em Belém e em todos os seus arredores”; uma cidade desse tamanho, a uma caminhada de tarde da capital, teria poucas crianças de dois anos para baixo."
    - "A proximidade explica a facilidade com que José, “da casa e família de Davi”, podia ser recenseado em sua cidade ancestral e a família podia apresentar o menino no Templo quarenta dias depois. No século II, Justino Mártir, nascido na Palestina, disse que Jesus nasceu numa gruta perto da aldeia, e Orígenes escreveu que a gruta era mostrada aos visitantes; Constantino mandou construir sobre ela a Igreja da Natividade, dedicada em 339, e o edifício atual, reconstruído por Justiniano no século VI, ainda se ergue no mesmo lugar."
  de:
    - "Bethlehem liegt etwa 8 km südlich von Jerusalem in der Luftlinie und etwa 10 km auf der römischen Straße der Karte, ein Fußmarsch von zwei bis drei Stunden. Eusebius setzte es im 4. Jahrhundert auf sechs römische Meilen an, etwa 9 km, und ebenso der Pilger von Bordeaux im Jahr 333 n. Chr.: vier Meilen bis zum Grab Rahels und zwei weitere bis zur Stadt."
    - "Die beiden Städte liegen auf demselben Rücken der judäischen Berge, die Straße führt nach Süden am Grab Rahels vorbei: „Also starb Rahel und ward begraben an dem Wege gen Ephrath, das nun heißt Bethlehem.“ Michas „Und du Bethlehem Ephrata, die du klein bist unter den Städten in Juda“ beantwortete die Frage, die Herodes den Schriftgelehrten stellte, und die Weisen, die nach Jerusalem gekommen waren, zogen die kurze letzte Strecke zum Kind weiter. Herodes „ließ alle Kinder zu Bethlehem töten und an seinen ganzen Grenzen“; in einer Stadt dieser Größe, einen Abendspaziergang von der Hauptstadt entfernt, wird es nur wenige Kinder von zwei Jahren und darunter gegeben haben."
    - "Die Nähe erklärt, wie leicht Josef, „von dem Hause und Geschlechte Davids“, in seiner Vaterstadt gezählt werden und die Familie das Kind vierzig Tage später im Tempel darstellen konnte. Im 2. Jahrhundert sagte Justin der Märtyrer, der in Palästina geboren war, Jesus sei in einer Höhle nahe dem Dorf geboren worden, und Origenes schrieb, die Höhle werde Besuchern gezeigt; Konstantin ließ über ihr die Geburtskirche errichten, 339 geweiht, und der heutige Bau, im 6. Jahrhundert von Justinian erneuert, steht noch an derselben Stelle."
  fr:
    - "Bethléem est à environ 8 km au sud de Jérusalem en ligne droite et à environ 10 km par la route romaine de la carte, soit deux à trois heures de marche. Eusèbe, au IVe siècle, la situait à six milles romains, environ 9 km, tout comme le pèlerin de Bordeaux en 333 apr. J.-C. : quatre milles jusqu’au tombeau de Rachel et deux de plus jusqu’à la ville."
    - "Les deux villes sont sur la même crête des collines de Judée, la route filant vers le sud devant le tombeau de Rachel : « Rachel mourut, et elle fut enterrée sur le chemin d’Éphrata, qui est Bethléhem. » Le « Bethléhem Éphrata, petite entre les milliers de Juda » de Michée répondit à la question qu’Hérode posa aux scribes, et les mages venus à Jérusalem firent à cheval le court dernier trajet jusqu’à l’enfant. Hérode « envoya tuer tous les enfants de deux ans et au-dessous qui étaient à Bethléhem et dans tout son territoire » ; une ville de cette taille, à une soirée de marche de la capitale, devait compter peu d’enfants de cet âge."
    - "La proximité explique l’aisance avec laquelle Joseph, « de la maison et de la famille de David », put se faire inscrire dans sa ville ancestrale, et la famille présenter l’enfant au Temple quarante jours plus tard. Au IIe siècle, Justin Martyr, né en Palestine, dit que Jésus naquit dans une grotte près du village, et Origène écrivit qu’on la montrait aux visiteurs ; Constantin fit bâtir sur elle l’église de la Nativité, consacrée en 339, et l’édifice actuel, reconstruit par Justinien au VIe siècle, se dresse toujours au même endroit."
  pl:
    - "Betlejem leży około 8 km na południe od Jerozolimy w linii prostej i około 10 km rzymską drogą z mapy, czyli dwie do trzech godzin marszu. Euzebiusz w IV wieku podawał sześć mil rzymskich, około 9 km, i tak samo pielgrzym z Bordeaux w 333 roku: cztery mile do grobu Rachel i dwie dalej do miasta."
    - "Oba miasta leżą na tym samym grzbiecie judzkich wzgórz, a droga biegnie na południe obok grobu Rachel: „A tak umarła Rachel, i pogrzebiona jest na drodze ku Efracie; tać jest Betlehem.” Słowa Micheasza „Betlehemie Efrata! acześ najmniejszy między tysiącami Judzkimi” odpowiedziały na pytanie, które Herod postawił uczonym w Piśmie, a magowie, którzy przybyli do Jerozolimy, ruszyli dalej na krótki ostatni odcinek do dziecka. Herod „pobił wszystkie dziatki, które były w Betlehemie i po wszystkich granicach jego”; w mieście tej wielkości, o wieczorny spacer od stolicy, było niewiele dzieci w wieku dwóch lat i poniżej."
    - "Bliskość wyjaśnia, jak łatwo Józef, „z domu i z familii Dawidowej”, mógł zostać zapisany w mieście przodków, a rodzina mogła przedstawić dziecko w Świątyni czterdzieści dni później. W II wieku Justyn Męczennik, urodzony w Palestynie, mówił, że Jezus narodził się w jaskini w pobliżu wsi, a Orygenes pisał, że jaskinię pokazywano odwiedzającym; Konstantyn kazał nad nią zbudować bazylikę Narodzenia, poświęconą w 339, a obecna budowla, odbudowana przez Justyniana w VI wieku, stoi nadal w tym samym miejscu."
  it:
    - "Betlemme si trova a circa 8 km a sud di Gerusalemme in linea retta e a circa 10 km lungo la strada romana della mappa, una camminata di due-tre ore. Eusebio, nel IV secolo, la collocava a sei miglia romane, circa 9 km, e così il pellegrino di Bordeaux nel 333 d.C.: quattro miglia fino alla tomba di Rachele e due ancora fino alla città."
    - "Le due città sorgono sullo stesso crinale dei monti della Giudea, con la strada che corre a sud oltre la tomba di Rachele: «E Rachele morì, e fu sepolta sulla via di Efrata; cioè di Bethlehem». Il «Bethlehem Efrata, piccola per essere tra i migliaia di Giuda» di Michea rispose alla domanda che Erode pose agli scribi, e i Magi, che erano giunti a Gerusalemme, cavalcarono per la breve ultima tappa verso il bambino. Erode poi «mandò ad uccidere tutti i maschi ch’erano in Betleem e in tutto il suo territorio dall’età di due anni in giù»; una città di queste dimensioni, a una breve camminata serale dalla capitale, avrebbe avuto pochi bambini di due anni e meno."
    - "La vicinanza spiega la facilità con cui Giuseppe, «della casa e famiglia di Davide», poté essere censito nella città dei suoi avi e la famiglia poté presentare il bambino al Tempio quaranta giorni dopo. Nel II secolo Giustino Martire, nato in Palestina, disse che Gesù nacque in una grotta vicino al villaggio, e Origene scrisse che la grotta veniva mostrata ai visitatori; Costantino vi fece costruire sopra la chiesa della Natività, consacrata nel 339, e l’edificio attuale, ricostruito da Giustiniano nel VI secolo, sorge ancora nello stesso luogo."
  nl:
    - "Bethlehem ligt hemelsbreed ongeveer 8 km ten zuiden van Jeruzalem en ongeveer 10 km via de Romeinse weg op de kaart, een wandeling van twee tot drie uur. Eusebius stelde het in de vierde eeuw op zes Romeinse mijlen, ongeveer 9 km, en dat deed ook de pelgrim van Bordeaux in 333 n.Chr.: vier mijlen tot het graf van Rachel en nog twee tot de stad."
    - "De twee steden liggen op dezelfde bergrug van het Judese bergland, met de weg die zuidwaarts langs het graf van Rachel loopt: “Alzo stierf Rachel; en zij werd begraven aan den weg naar Efrath, hetwelk is Bethlehem.” Micha’s “Bethlehem Efratha! zijt gij klein om te wezen onder de duizenden van Juda” beantwoordde de vraag die Herodes aan de schriftgeleerden stelde, en de wijzen die in Jeruzalem waren aangekomen, reisden door over het korte laatste stuk naar het kind. Herodes “heeft omgebracht al de kinderen, die binnen Bethlehem, en in al deszelfs landpalen waren”; in een stad van deze grootte, op een avondwandeling van de hoofdstad, zouden er maar weinig kinderen van twee jaar en jonger zijn geweest."
    - "De nabijheid verklaart hoe gemakkelijk Jozef, “uit het huis en geslacht van David”, in zijn voorouderlijke stad kon worden geregistreerd en het gezin veertig dagen later het kind in de tempel kon aanbieden. In de tweede eeuw zei Justinus Martyr, geboren in Palestina, dat Jezus in een grot bij het dorp werd geboren, en Origenes schreef dat de grot aan bezoekers werd getoond; Constantijn liet er de Geboortekerk overheen bouwen, ingewijd in 339, en het huidige gebouw, in de zesde eeuw herbouwd door Justinianus, staat nog op dezelfde plaats."
  cs:
    - "Betlém leží asi 8 km jižně od Jeruzaléma vzdušnou čarou a asi 10 km po římské silnici na mapě, což jsou dvě až tři hodiny chůze. Eusebios ve 4. století jej udával na šest římských mil, asi 9 km, a stejně tak bordeauxský poutník roku 333 n. l.: čtyři míle k Ráchelinu hrobu a dvě další k městu."
    - "Obě města leží na témž hřebeni judských hor a silnice vede na jih kolem Ráchelina hrobu: „I umřela Ráchel, a pochována jest na cestě k Efratě, jenž jest Betlém.“ Micheášovo „Betléme Efrata, jakžkoli jsi nejmenší mezi tisíci Judskými“ odpovědělo na otázku, kterou Herodes položil zákoníkům, a mágové, kteří přišli do Jeruzaléma, jeli dál posledním krátkým úsekem k dítěti. Herodes pak „zmordoval všecky dítky, kteréž byly v Betlémě i ve všech končinách jeho“; v městečku této velikosti, na dosah večerní procházky od hlavního města, by bylo dětí do dvou let jen málo."
    - "Blízkost vysvětluje, jak snadno mohl být Josef „z domu a z čeledi Davidovy“ sečten ve městě svých předků a jak mohla rodina o čtyřicet dní později představit dítě v chrámě. Ve 2. století Justin Mučedník, rodák z Palestiny, řekl, že se Ježíš narodil v jeskyni poblíž vesnice, a Origenes napsal, že jeskyni ukazovali návštěvníkům; Konstantin nad ní dal postavit baziliku Narození, vysvěcenou roku 339, a dnešní stavba, přestavěná Justiniánem v 6. století, stojí na témže místě."
  sv:
    - "Betlehem ligger omkring 8 km söder om Jerusalem fågelvägen och omkring 10 km via den romerska vägen på kartan, en promenad på två till tre timmar. Eusebios angav på 300-talet sex romerska mil, omkring 9 km, och det gjorde också pilgrimen från Bordeaux år 333 e.Kr.: fyra romerska mil till Rakels grav och ytterligare två till staden."
    - "De båda städerna ligger på samma ås i de judeiska bergen, med vägen löpande söderut förbi Rakels grav: ”Så dog Rakel, och hon blev begraven vid vägen till Efrat, det är Bet-Lehem.” Mikas ”du Bet-Lehem Efrata, som är så ringa för att vara bland Juda släkter” besvarade frågan som Herodes ställde till de skriftlärda, och de vise männen som hade kommit till Jerusalem red vidare den korta sista etappen till barnet. Herodes lät sedan döda ”alla de gossebarn i Betlehem och hela området däromkring”; en stad av denna storlek, inom en kvällspromenad från huvudstaden, skulle ha haft få barn på två år och därunder."
    - "Närheten förklarar hur lätt Josef, ”av Davids hus och släkt”, kunde bli upptecknad i sina förfäders stad och hur familjen kunde frambära barnet i templet fyrtio dagar senare. På 100-talet sade Justinus Martyren, född i Palestina, att Jesus föddes i en grotta nära byn, och Origenes skrev att grottan visades för besökare; Konstantin lät bygga Födelsekyrkan över den, invigd 339, och den nuvarande byggnaden, återuppbyggd av Justinianus på 500-talet, står ännu på samma plats."
  nb:
    - "Betlehem ligger omtrent 8 km sør for Jerusalem i luftlinje og omtrent 10 km langs romerveien på kartet, en gåtur på to til tre timer. Eusebius satte den på 300-tallet til seks romerske mil, omtrent 9 km, og det gjorde også pilegrimen fra Bordeaux i 333 e.Kr.: fire romerske mil til Rakels grav og to til for å nå byen."
    - "De to byene ligger på den samme ryggen i det judeiske høylandet, med veien sørover forbi Rakels grav: «Så døde Rakel, og hun blev begravet på veien til Efrat, det er Betlehem.» Mikas «du Betlehem, Efrata, som er liten til å være med blandt Judas tusener» svarte på spørsmålet Herodes stilte de skriftlærde, og magierne som hadde kommet til Jerusalem, red videre på den korte siste etappen til barnet. Herodes «lot drepe alle de guttebarn som var i Betlehem og alt landet deromkring»; en by av denne størrelsen, innen en kvelds gange fra hovedstaden, ville hatt få barn på to år og derunder."
    - "Nærheten forklarer hvor lett Josef, av «Davids hus og ætt», kunne bli innskrevet i sin forfedreby, og hvor lett familien kunne fremstille barnet i tempelet førti dager senere. På 100-tallet sa Justin Martyr, født i Palestina, at Jesus ble født i en hule nær landsbyen, og Origenes skrev at hulen ble vist til besøkende; Konstantin lot Fødselskirken bygge over den, viet i 339, og dagens bygning, gjenoppbygd av Justinian på 500-tallet, står fortsatt på samme sted."
  tl:
    - "Ang Bethlehem ay nasa mga 8 km sa timog ng Jerusalem sa tuwid na guhit at mga 10 km sa daang Romano sa mapa, dalawa hanggang tatlong oras na lakad. Si Eusebio, noong ikaapat na siglo, ay naglagay nito sa anim na milyang Romano, mga 9 km, at gayon din ang peregrino ng Bordeaux noong 333 AD: apat na milya hanggang sa libingan ni Raquel at dalawa pa hanggang sa bayan."
    - "Ang dalawang bayan ay nasa iisang tagaytay ng mga burol ng Judea, at ang daan ay patimog na dumaraan sa libingan ni Raquel: “At namatay si Raquel at inilibing sa daang patungo sa Ephrata (na siyang Bethlehem).” Ang “Beth-lehem Ephrata, na maliit upang lumagay sa libolibo ng Juda” ni Mikas ang sumagot sa tanong na ibinigay ni Herodes sa mga eskriba, at ang mga Pantas na dumating sa Jerusalem ay nagpatuloy sa maikling huling yugto patungo sa sanggol. Pagkatapos ay ipinapatay ni Herodes “ang lahat ng mga sanggol na lalake na nangasa Bet-lehem, at sa buong palibotlibot noon”; ang gayong kaliit na bayan, na isang gabing lakad lamang mula sa kabisera, ay malamang na kaunti lamang ang batang dalawang taon pababa."
    - "Ipinaliliwanag ng lapit ang kadalian ng pagbibilang kay Jose, na “sa angkan at sa lahi ni David”, sa bayan ng kaniyang mga ninuno at ng pag-aalay ng pamilya sa bata sa Templo makalipas ang apatnapung araw. Noong ikalawang siglo, sinabi ni Justino Martir, na ipinanganak sa Palestina, na ipinanganak si Jesus sa isang yungib malapit sa nayon, at isinulat ni Origenes na ipinakikita ang yungib sa mga dumadalaw; ipinatayo ni Constantino ang Simbahan ng Kapanganakan sa ibabaw nito, na inilaan noong 339, at ang kasalukuyang gusali, na itinayong muli ni Justiniano noong ikaanim na siglo, ay nakatayo pa rin sa parehong lugar."
  da:
    - "Betlehem ligger omkring 8 km syd for Jerusalem i luftlinje og omkring 10 km ad den romerske vej på kortet, en gåtur på to til tre timer. Eusebios satte den i 300-tallet til seks romerske mil, omkring 9 km, og det gjorde pilgrimmen fra Bordeaux også i 333 e.Kr.: fire romerske mil til Rakels grav og to mere til byen."
    - "De to byer ligger på samme højderyg i de judæiske bjerge, med vejen sydpå forbi Rakels grav: »Saa døde Rakel og blev begraven paa Vejen til Efrat, det er Bethlehem.« Mikas »Bethlehem Efrata, liden til at være iblandt Judas Tusinder« besvarede det spørgsmål, Herodes stillede de skriftkloge, og magierne, som var kommet til Jerusalem, red videre på den korte sidste etape til barnet. Herodes »lod alle Drengebørn ihjelslaa, som vare i Bethlehem og i hele dens Omegn«; i en by af denne størrelse, inden for en aftens gang fra hovedstaden, ville der have været få børn på to år og derunder."
    - "Nærheden forklarer, hvor let Josef, der var »af Davids Hus og Slægt«, kunne blive skrevet i mandtal i sin slægtsby, og familien kunne fremstille barnet i Templet fyrre dage senere. I 100-tallet sagde Justin Martyr, født i Palæstina, at Jesus blev født i en hule nær landsbyen, og Origenes skrev, at hulen blev vist for besøgende; Konstantin lod Fødselskirken bygge over den, indviet i 339, og den nuværende bygning, genopført af Justinian i 500-tallet, står stadig på samme sted."
  sr:
    - "Витлејем је око 8 км јужно од Јерусалима ваздушном линијом и око 10 км римским путем на карти, шетња од два до три сата. Јевсевије га је у 4. веку ставио на шест римских миља, око 9 км, а тако и ходочасник из Бордоа 333. н. е.: четири миље до Рахиљиног гроба и још две до градића."
    - "Оба града леже на истом гребену јудејских брда, а пут иде на југ поред Рахиљиног гроба: „И умре Рахиља, и погребоше је на путу који иде у Ефрату, а то је Витлејем.“ Михино „Витлејеме Ефрато, ако и јеси најмањи међу хиљадама Јудиним“ одговорило је на питање које је Ирод поставио књижевницима, а маги који су дошли у Јерусалим јахали су последњом кратком деоницом до детета. Ирод је затим послао да побију „сву децу по Витлејему и по свој околини његовој“; у граду те величине, на вечерњу шетњу од престонице, било би мало деце од две године и млађе."
    - "Близина објашњава како је Јосиф, „из дома и племена Давидовог“, могао бити пописан у граду својих предака и како је породица могла да донесе дете у Храм четрдесет дана касније. У 2. веку Јустин Мученик, рођен у Палестини, рекао је да се Исус родио у пећини близу села, а Ориген је писао да се та пећина показује посетиоцима; Константин је над њом подигао Цркву Рођења, посвећену 339, а садашња грађевина, обновљена за Јустинијана у 6. веку, и даље стоји на истом месту."
  hu:
    - "Betlehem Jeruzsálemtől egyenes vonalban mintegy 8 km-re délre van, a térképen látható római úton mintegy 10 km-re, két-három órás séta. Eusebius a 4. században hat római mérföldre, mintegy 9 km-re tette, és így a bordeaux-i zarándok is Kr. u. 333-ban: négy mérföld Ráhel sírjáig, és még kettő a városig."
    - "A két város ugyanazon a júdeai hegyi gerincen fekszik, az út délre halad, Ráhel sírja mellett: „És meghala Rákhel, és eltemetteték az Efratába (azaz Bethlehembe) vivő úton.” Mikeás szava: „Efratának Bethleheme, bár kicsiny vagy a Júda ezrei között” megválaszolta a kérdést, amelyet Heródes az írástudóknak feltett, a Jeruzsálembe érkezett mágusok pedig lovagoltak tovább a gyermekhez, a rövid utolsó szakaszon. Heródes ezután „megölete Bethlehemben és annak egész környékén minden gyermeket”; egy ekkora településen, amely a fővárostól egy esti séta távolságra van, aligha lehetett sok két éven aluli gyermek."
    - "A közelség magyarázza, hogy Józsefet, aki „a Dávid házából és háznépe közül való volt”, összeszámlálhatták ősei városában, és a család negyven nappal később bemutathatta a gyermeket a templomban. A 2. században a Palesztinában született Jusztinosz azt mondta, hogy Jézus a falu közelében egy barlangban született, Órigenész pedig azt írta, hogy a barlangot megmutatták a látogatóknak; Konstantin a Születés-templomot e fölé építtette, felszentelése Kr. u. 339-ben történt, a mai épület, amelyet Justinianus a 6. században újjáépített, ma is ugyanazon a helyen áll."
  fi:
    - "Betlehem on noin 8 km Jerusalemista etelään linnuntietä ja noin 10 km kartan roomalaista tietä pitkin, kahden tai kolmen tunnin kävelymatka. Eusebios arvioi 300-luvulla matkan kuudeksi roomalaiseksi mailiksi, noin 9 km, ja samoin Bordeaux'n pyhiinvaeltaja vuonna 333 jaa.: neljä mailia Rakelin haudalle ja kaksi lisää kaupunkiin."
    - "Kaksi kaupunkia sijaitsee samalla Juudean vuoriston selänteellä, ja tie kulkee etelään Rakelin haudan ohi: Rakel kuoli, ja ”hänet haudattiin Efratan tien varteen, se on Beetlehemiin”. Miikan ”Beetlehem Efrata, joka olet vähäinen olemaan Juudan sukujen joukossa” vastasi kysymykseen, jonka Herodes esitti kirjanoppineille, ja Jerusalemiin tulleet tietäjät jatkoivat lyhyttä viimeistä osuutta lapsen luo. Herodes lähetti sitten tappamaan ”kaikki poikalapset Beetlehemistä ja koko sen ympäristöstä”; tämän kokoisessa kaupungissa, joka oli illan kävelymatkan päässä pääkaupungista, olisi ollut vain vähän kaksivuotiaita ja nuorempia lapsia."
    - "Läheisyys selittää, miten helposti Joosef, joka oli ”Daavidin huonetta ja sukua”, saattoi tulla luetuksi esi-isiensä kaupungissa ja perhe saattoi tuoda lapsen temppeliin neljäkymmentä päivää myöhemmin. Toisella vuosisadalla Justinos Marttyyri, joka oli syntynyt Palestiinassa, sanoi Jeesuksen syntyneen luolassa lähellä kylää, ja Origenes kirjoitti, että luola näytettiin vierailijoille; Konstantinus rakennutti sen päälle Syntymäkirkon, joka vihittiin käyttöön vuonna 339, ja nykyinen rakennus, jonka Justinianus rakennutti uudelleen 500-luvulla, seisoo yhä samalla paikalla."
  vi:
    - "Bết-lê-hem nằm cách Giê-ru-sa-lem khoảng 8 km về phía nam theo đường thẳng và khoảng 10 km theo con đường La Mã trên bản đồ, một chặng đi bộ từ hai đến ba giờ. Eusebius, ở thế kỷ 4, cho là sáu dặm La Mã, khoảng 9 km, và người hành hương từ Bordeaux năm 333 cũng vậy: bốn dặm đến mộ Ra-chên và hai dặm nữa đến thị trấn."
    - "Hai thị trấn nằm trên cùng một sườn núi của miền đồi Giu-đê, với con đường chạy về phía nam qua mộ Ra-chên: “Ra-chên qua đời, được chôn bên con đường đi về Ê-phơ-rát, tức là Bết-lê-hem.” Lời Mi-chê, “Hỡi Bết-lê-hem Ép-ra-ta, ngươi ở trong hàng ngàn Giu-đa là nhỏ lắm”, trả lời câu hỏi Hê-rốt đặt ra cho các thầy thông giáo, và các đạo sĩ đã đến Giê-ru-sa-lem cưỡi đi chặng cuối ngắn đến với hài nhi. Sau đó Hê-rốt “sai giết hết thảy con trai … ở thành Bết-lê-hem và cả hạt”; một thị trấn cỡ ấy, cách kinh đô chỉ một buổi tối đi bộ, hẳn có rất ít trẻ từ hai tuổi trở xuống."
    - "Khoảng cách gần giải thích vì sao Giô-sép, “dòng dõi nhà Đa-vít”, có thể được ghi danh tại thị trấn của tổ tiên, và vì sao gia đình có thể dâng hài nhi tại Đền Thờ bốn mươi ngày sau. Ở thế kỷ 2, Justin Tử đạo, sinh tại Palestine, nói Giê-su sinh trong một hang gần làng, và Origen viết rằng hang ấy được chỉ cho du khách; Constantine cho xây Nhà thờ Chúa Giáng sinh trên đó, khánh thành năm 339, và công trình hiện nay, do Justinian xây lại ở thế kỷ 6, vẫn đứng đúng chỗ cũ."
  ro:
    - "Betleemul se află la circa 8 km sud de Ierusalim în linie dreaptă și la circa 10 km pe drumul roman de pe hartă, adică două-trei ore de mers pe jos. Eusebiu, în secolul al IV-lea, îl punea la șase mile romane, circa 9 km, la fel ca Pelerinul din Bordeaux în 333 d.Hr.: patru mile până la mormântul Rahelei și încă două până la târg."
    - "Cele două orașe se află pe aceeași creastă a dealurilor Iudeii, iar drumul merge spre sud pe lângă mormântul Rahelei: „Și a murit Rahila și s’a îngropat în calea Efratului, acesta este Vitleim.” Cuvintele lui Mica, „Vitleime casa Eufratului, mic ești a fì întru miile Iudei”, au răspuns întrebării pe care Irod le-a pus-o cărturarilor, iar magii, ajunși la Ierusalim, au făcut călare scurta ultimă etapă până la prunc. Irod „a omorît pre toți pruncii, cari erau în Vitleem și întru toate hotarele lui”; într-un oraș de această mărime, la o seară de mers de capitală, ar fi fost puțini copii de doi ani și mai mici."
    - "Apropierea explică ușurința cu care Iosif, „din casa și din seminția lui David”, a putut fi înscris în orașul strămoșilor săi și familia a putut aduce pruncul la Templu patruzeci de zile mai târziu. În secolul al II-lea, Iustin Martirul, născut în Palestina, spunea că Isus s-a născut într-o peșteră de lângă sat, iar Origen scria că peștera era arătată vizitatorilor; Constantin a pus să se zidească deasupra ei Biserica Nașterii Domnului, sfințită în 339, iar clădirea de azi, reclădită de Iustinian în secolul al VI-lea, stă și acum pe același loc."
  bg:
    - "Витлеем е на около 8 км южно от Йерусалим по права линия и на около 10 км по римския път на картата — два-три часа пеша. Евсевий през IV в. го поставя на шест римски мили, около 9 км, както и Бордоският поклонник през 333 г. н.е.: четири мили до гроба на Рахил и още две до града."
    - "Двата града стоят на едно и също било на Юдейските възвишения, а пътят води на юг покрай гроба на Рахил: „И умря Рахил, и погребе се на пътя на Ефрата, която е Витлеем.“ Думите на Миха „Витлеем Ефрато, Ако и да си малък за да бъдеш между тисящите Юдини“ отговорили на въпроса, който Ирод задал на книжниците, и мъдреците, дошли в Йерусалим, изминали краткия последен етап до детето. После Ирод „погуби всичките младенци във Витлеем и по всичките негови предели“; в град с такива размери, на една вечер път пеша от столицата, е имало малко деца на две години и по-малки."
    - "Близостта обяснява лекотата, с която Йосиф, „от дома и рода Давидов“, могъл да бъде преброен в града на предците си, а семейството да представи детето в Храма четиридесет дни по-късно. През II в. Юстин Мъченик, роден в Палестина, казва, че Исус се родил в пещера близо до селото, а Ориген пише, че пещерата се показвала на посетителите; Константин построил над нея църквата „Рождество Христово“, осветена през 339 г., а днешната сграда, възстановена от Юстиниан през VI в., все още стои на същото място."
