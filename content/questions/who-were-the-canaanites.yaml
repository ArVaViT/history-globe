id: who-were-the-canaanites
question:
  en: "Who were the Canaanites?"
  ru: "Кто такие хананеи?"
  uk: "Хто були ханаанеї?"
  es: "¿Quiénes eran los cananeos?"
  pt: "Quem eram os cananeus?"
  de: "Wer waren die Kanaaniter?"
  fr: "Qui étaient les Cananéens ?"
answer:
  en:
    - "The Canaanites were the peoples of the land west of the Jordan before Israel and beside it: townsfolk of the coast and the valleys who spoke a Semitic tongue of which Hebrew itself is a dialect, and worshipped El, Baal, Asherah and Anat. The name is older than the Bible: a letter from Mari of the eighteenth century BC may already use it, the Amarna letters of the fourteenth call the land Kinahhi, when it was an Egyptian province, and the stele of Merneptah about 1208 BC names Canaan beside Israel. Genesis makes Canaan a son of Ham, cursed by Noah, and lists his sons from Sidon and Heth to the Jebusites and Amorites, with a border “from Sidon, as thou comest to Gerar, unto Gaza”. The map's point for Canaan stands in the hills of Galilee."
    - "The Bible uses the name in a narrow and a wide sense. To the spies “the Canaanites dwell by the sea, and by the coast of Jordan”, while Hittites, Jebusites and Amorites hold the hills; elsewhere they are one of the seven nations “greater and mightier than thou”, to be driven out. Judah “could not drive out the inhabitants of the valley, because they had chariots of iron”; Manasseh left Beth-shean, Taanach, Dor, Ibleam and Megiddo, “but the Canaanites would dwell in that land”, and Israel “put the Canaanites to tribute”."
    - "In Deborah's song “then fought the kings of Canaan in Taanach by the waters of Megiddo”; and the people “took their daughters to be their wives… and served their gods”. Because Canaanites traded, the word came to mean a merchant: Hosea's “merchant” is in Hebrew a Canaanite, and Zechariah's last line, “there shall be no more the Canaanite in the house of the LORD”, is read both ways. The Canaanites did not vanish: the Phoenicians of Tyre and Sidon were Canaanites who stayed on the coast, and the “woman of Canaan” who came to Jesus near Tyre is Mark's “Syrophenician”."
    - "What they believed is known from Ugarit on the Syrian coast, where tablets found from 1929 preserve the myths of Baal, El, Asherah and Anat of the fourteenth and thirteenth centuries BC. Whether Israel came from outside the land or from within it is debated. The Bible tells of a conquest; many archaeologists since the 1980s see the first Israelites as mostly hill-country Canaanites who settled new villages in the twelfth century BC, when Merneptah first names Israel; others defend an entry from outside, dated to the fifteenth or the thirteenth century. Even the name is argued over: Lemche held that no one ever called himself a Canaanite, and Rainey answered from the Amarna letters that the people of Canaan did."
  ru:
    - "Хананеи — народы земли к западу от Иордана до Израиля и рядом с ним: жители городов на побережье и в долинах, говорившие на семитском языке, диалектом которого является и сам еврейский, и почитавшие Эла, Ваала, Ашеру и Анат. Имя старше Библии: его, возможно, уже знает письмо из Мари XVIII века до н. э., амарнские письма XIV века зовут страну Кинахху, когда она была египетской провинцией, а стела Мернептаха около 1208 г. до н. э. называет Ханаан рядом с Израилем. Бытие делает Ханаана сыном Хама, проклятым Ноем, и перечисляет его сыновей от Сидона и Хета до Иевусеев и Аморреев, с пределами «от Сидона к Герару до Газы». Точка карты для Ханаана стоит в горах Галилеи."
    - "Библия употребляет имя в узком и в широком смысле. Соглядатаям «Хананеи же живут при море и на берегу Иордана», а горы держат Хеттеи, Иевусеи и Аморреи; в других местах это один из семи народов, «которые многочисленнее и сильнее тебя», подлежащих изгнанию. Иуда «жителей долины не мог прогнать, потому что у них были железные колесницы»; Манассия оставил Бефсан, Фаанах, Дор, Ивлеам и Мегиддон, «и остались Хананеи жить в земле сей», а когда Израиль пришёл в силу, «тогда сделал он Хананеев данниками»."
    - "В песне Деворы «тогда сразились цари Ханаанские в Фанаахе у вод Мегиддонских»; а израильтяне «брали дочерей их себе в жены… и служили богам их». Поскольку хананеи торговали, слово стало значить «купец»: у Осии «Хананеянин с неверными весами», а последний стих Захарии — «не будет более ни одного Хананея в доме Господа Саваофа» — читают и так, и так. Хананеи не исчезли: финикийцы Тира и Сидона — это хананеи, оставшиеся на побережье, и «женщина Хананеянка», пришедшая к Иисусу близ Тира, у Марка — «сирофиникиянка»."
    - "Во что они верили, известно по Угариту на сирийском берегу, где таблички, находимые с 1929 года, сохранили мифы о Ваале, Эле, Ашере и Анат XIV–XIII веков до н. э. Пришёл ли Израиль в землю извне или вышел из неё самой — предмет спора. Библия рассказывает о завоевании; многие археологи с 1980-х годов видят в первых израильтянах по большей части хананеев горной страны, заселивших новые деревни в XII веке до н. э., когда Мернептах впервые называет Израиль; другие отстаивают приход извне, в XV или XIII веке. Спорят даже об имени: Лемхе считал, что никто не называл себя хананеем, а Рейни отвечал по амарнским письмам, что жители Ханаана называли."
  uk:
    - "Ханаанеї були народами землі на захід від Йордану перед Ізраїлем і поруч із ним: жителями міст узбережжя й долин, які говорили семітською мовою, діалектом якої є сама єврейська, і поклонялися Елю, Ваалу, Ашері й Анат. Назва давніша за Біблію: лист із Марі XVIII ст. до н. е., можливо, вже вживає її, листи з Амарни XIV ст. називають країну Кінахі, коли вона була єгипетською провінцією, а стела Мернептаха близько 1208 р. до н. е. називає Ханаан поруч з Ізраїлем. Книга Буття робить Ханаана сином Хама, проклятим Ноєм, і перелічує його синів від Сідона та Хета до євусеїв і амореїв, з межею «від Сидону до Герару, до Гази». Точка Ханаану на мапі стоїть у пагорбах Галілеї."
    - "Біблія вживає назву у вузькому й широкому значенні. Для розвідників «Канаанїї живуть над морем і здовж берегів Іорданських», тоді як хеттеї, євусеї й амореї тримають пагорби; в інших місцях вони — один із семи народів, «більших і потужніщих за тебе», яких треба вигнати. Про Юду сказано: «Подолян же не здолїв прогнати, бо в них були залїзні колесницї»; Манасія залишив Бет-Шеан, Таанах, Дор, Івлеам і Мегіддо: «Так і вдалось Канаанїям зістатись на житлї в цїй країнї», а Ізраїль, як сказано, «зробив він Канаанїїв свойми крепаками»."
    - "У пісні Дебори «царі Канаанські в Танаах у вод Мегидонських» билися; а народ «Брали за себе їх дочки ... і служили їх богам». Оскільки ханаанеї торгували, слово стало означати купця: «купець» в Осії — на івриті ханаанеянин, а останній рядок Захарії, «не буде тих часів ніякого крамаря в дому Господа сил небесних», читають в обох значеннях. Ханаанеї не зникли: фінікійці Тіру та Сідона були ханаанеями, що залишилися на узбережжі, а «жінка Канаанка», яка прийшла до Ісуса поблизу Тіру, — це Марків «Сирофиникиянка»."
    - "У що вони вірили, відомо з Угарита на сирійському узбережжі, де таблички, знайдені від 1929 р., зберігають міфи про Ваала, Еля, Ашеру й Анат XIV і XIII ст. до н. е. Чи прийшов Ізраїль ззовні, чи зсередини краю, обговорюють. Біблія розповідає про завоювання; багато археологів від 1980-х рр. бачать у перших ізраїльтянах здебільшого ханаанеїв гірського краю, які заселили нові села в XII ст. до н. е., коли Мернептах уперше називає Ізраїль; інші обстоюють входження ззовні, датоване XV або XIII ст. Навіть назва викликає суперечки: Лемке стверджував, що ніхто ніколи не називав себе ханаанеєм, а Рейні на підставі листів з Амарни відповідав, що жителі Ханаану називали себе ханаанеями."
  es:
    - "Los cananeos eran los pueblos de la tierra al oeste del Jordán antes de Israel y junto a él: gente de las ciudades de la costa y de los valles que hablaba una lengua semítica de la que el propio hebreo es un dialecto, y que adoraba a El, Baal, Asera y Anat. El nombre es más antiguo que la Biblia: una carta de Mari del siglo XVIII a. C. quizá ya lo use, las cartas de Amarna del siglo XIV llaman a la tierra Kinahhi, cuando era una provincia egipcia, y la estela de Merneptah, hacia 1208 a. C., nombra Canaán junto a Israel. El Génesis hace de Canaán un hijo de Cam, maldecido por Noé, y enumera a sus hijos desde Sidón y Het hasta los jebuseos y los amorreos, con una frontera «desde Sidón, viniendo á Gerar hasta Gaza». El punto del mapa para Canaán está en las colinas de Galilea."
    - "La Biblia usa el nombre en un sentido estrecho y en otro amplio. Para los espías, «el Cananeo habita junto á la mar, y á la ribera del Jordán», mientras que hititas, jebuseos y amorreos ocupan los montes; en otros pasajes son una de las siete naciones «mayores y más fuertes que tú», que habían de ser expulsadas. Judá «no pudo echar á los que habitaban en los llanos, los cuales tenían carros herrados»; Manasés dejó Bet-seán, Taanac, Dor, Ibleam y Meguido, «mas el Cananeo quiso habitar en esta tierra», e Israel «hizo al Cananeo tributario»."
    - "En el cántico de Débora, «entonces pelearon los reyes de Canaán en Taanac, junto á las aguas de Megiddo»; y los israelitas «tomaron de sus hijas por mujeres… y sirvieron á sus dioses». Como los cananeos comerciaban, la palabra pasó a significar mercader: el «mercader» de Oseas es en hebreo un cananeo, y la última línea de Zacarías, «no habrá más Cananeo alguno en la casa de Jehová de los ejércitos», se lee de ambas maneras. Los cananeos no desaparecieron: los fenicios de Tiro y Sidón eran cananeos que permanecieron en la costa, y la «mujer Cananea» que acudió a Jesús cerca de Tiro es la «Sirofenisa» de Marcos."
    - "Lo que creían se conoce por Ugarit, en la costa siria, donde las tablillas halladas desde 1929 conservan los mitos de Baal, El, Asera y Anat de los siglos XIV y XIII a. C. Si Israel vino de fuera de la tierra o de dentro de ella se discute. La Biblia cuenta una conquista; muchos arqueólogos desde la década de 1980 ven en los primeros israelitas sobre todo a cananeos de la región montañosa que se asentaron en aldeas nuevas en el siglo XII a. C., cuando Merneptah nombra por primera vez a Israel; otros defienden una entrada desde fuera, fechada en el siglo XV o en el XIII. Hasta el nombre se discute: Lemche sostuvo que nadie se llamó nunca a sí mismo cananeo, y Rainey respondió, a partir de las cartas de Amarna, que la gente de Canaán sí lo hacía."
  pt:
    - "Os cananeus eram os povos da terra a oeste do Jordão antes de Israel e ao lado dele: moradores de cidades da costa e dos vales que falavam uma língua semítica da qual o próprio hebraico é um dialeto, e adoravam El, Baal, Aserá e Anat. O nome é mais antigo do que a Bíblia: uma carta de Mari do século XVIII a.C. talvez já o use, as cartas de Amarna do século XIV chamam a terra Kinahhi, quando era uma província egípcia, e a estela de Merneptá, por volta de 1208 a.C., nomeia Canaã ao lado de Israel. O Gênesis faz de Canaã um filho de Cam, amaldiçoado por Noé, e enumera seus filhos de Sidom e Hete aos jebuseus e amorreus, com uma fronteira “desde Sidom — indo na direção de Gerar — até Gaza”. O ponto do mapa para Canaã fica nas colinas da Galileia."
    - "A Bíblia usa o nome em sentido estreito e em sentido largo. Para os espias, “O cananeu habita junto ao mar e ao longo da margem do Jordão”, enquanto hititas, jebuseus e amorreus ocupam as colinas; em outros lugares são uma das sete nações “maiores e mais poderosas do que você”, que devem ser expulsas. Os de Judá “não conseguiram expulsar os habitantes do vale, porque estes tinham carros de ferro”; Manassés deixou Bete-Seã, Taanaque, Dor, Ibleão e Megido, “mas os cananeus persistiram em habitar naquela terra”, e Israel “sujeitou os cananeus a trabalhos forçados”."
    - "No cântico de Débora, “os reis de Canaã lutaram em Taanaque, junto às águas de Megido”; e o povo, diz o texto, “Eles tomaram as filhas deles para serem suas mulheres… e serviram aos seus deuses”. Como os cananeus comerciavam, a palavra passou a significar mercador: o “comerciante” de Oseias é, em hebraico, um cananeu, e a última linha de Zacarias, “não haverá mais cananeu na casa do SENHOR dos Exércitos”, é lida nos dois sentidos. Os cananeus não desapareceram: os fenícios de Tiro e Sidom eram cananeus que permaneceram na costa, e a “mulher cananeia” que veio a Jesus perto de Tiro é a “siro-fenícia” de Marcos."
    - "No que acreditavam conhece-se por Ugarite, na costa síria, onde tabuinhas encontradas a partir de 1929 preservam os mitos de Baal, El, Aserá e Anat dos séculos XIV e XIII a.C. Se Israel veio de fora da terra ou de dentro dela é debatido. A Bíblia conta uma conquista; muitos arqueólogos desde a década de 1980 veem os primeiros israelitas como sobretudo cananeus da região montanhosa que fundaram novas aldeias no século XII a.C., quando Merneptá nomeia Israel pela primeira vez; outros defendem uma entrada de fora, datada do século XV ou XIII. Até o nome é disputado: Lemche sustentou que ninguém jamais se chamou cananeu, e Rainey respondeu, a partir das cartas de Amarna, que o povo de Canaã o fazia."
  de:
    - "Die Kanaaniter waren die Völker des Landes westlich des Jordans vor Israel und neben ihm: Stadtbewohner der Küste und der Täler, die eine semitische Sprache sprachen, von der das Hebräische selbst ein Dialekt ist, und El, Baal, Aschera und Anat verehrten. Der Name ist älter als die Bibel: Ein Brief aus Mari des 18. Jahrhunderts v. Chr. mag ihn schon gebrauchen, die Amarna-Briefe des 14. nennen das Land Kinahhi, als es eine ägyptische Provinz war, und die Stele des Merenptah nennt um 1208 v. Chr. Kanaan neben Israel. Die Genesis macht Kanaan zu einem Sohn Hams, von Noah verflucht, und zählt seine Söhne von Sidon und Heth bis zu den Jebusitern und Amoritern auf, mit einer Grenze „von Sidon an durch Gerar bis gen Gaza“. Der Kartenpunkt für Kanaan steht in den Bergen Galiläas."
    - "Die Bibel gebraucht den Namen in einem engen und einem weiten Sinn. Den Kundschaftern zufolge gilt: „die Kanaaniter aber wohnen am Meer und um den Jordan“, während Hethiter, Jebusiter und Amoriter das Bergland halten; anderswo sind sie eins der sieben Völker, „die größer und stärker sind denn du“, die vertrieben werden sollen. Juda „konnte die Einwohner im Grunde nicht vertreiben, darum daß sie eiserne Wagen hatten“; Manasse vertrieb Bet-Schean, Taanach, Dor, Jibleam und Megiddo nicht, „und die Kanaaniter blieben wohnen im Land“, und Israel „machte es die Kanaaniter zinsbar“."
    - "In Deboras Lied „stritten die Könige der Kanaaniter zu Thaanach am Wasser Megiddos“; und das Volk: „nahmen sie jener Töchter zu Weibern … und dienten jener Göttern“. Weil Kanaaniter Handel trieben, kam das Wort zur Bedeutung Kaufmann: Der „Kaufmann“ bei Hosea ist im Hebräischen ein Kanaaniter, und Sacharjas letzter Satz, „wird kein Kanaaniter mehr sein im Hause des HERRN Zebaoth“, wird in beiden Weisen gelesen. Die Kanaaniter verschwanden nicht: Die Phönizier von Tyrus und Sidon waren Kanaaniter, die an der Küste blieben, und das „kanaanäische Weib“, das bei Tyrus zu Jesus kam, ist das „aus Syrophönizien“ des Markus."
    - "Was sie glaubten, ist aus Ugarit an der syrischen Küste bekannt, wo seit 1929 gefundene Tafeln die Mythen von Baal, El, Aschera und Anat aus dem 14. und 13. Jahrhundert v. Chr. bewahren. Ob Israel von außerhalb des Landes oder aus ihm kam, ist umstritten. Die Bibel erzählt von einer Eroberung; viele Archäologen sehen seit den 1980er-Jahren in den ersten Israeliten überwiegend Kanaaniter des Berglands, die im 12. Jahrhundert v. Chr. neue Dörfer gründeten, als Merenptah Israel erstmals nennt; andere verteidigen einen Einzug von außen, ins 15. oder 13. Jahrhundert datiert. Selbst der Name ist umstritten: Lemche meinte, niemand habe sich je Kanaaniter genannt, und Rainey entgegnete aus den Amarna-Briefen, dass die Leute von Kanaan es taten."
  fr:
    - "Les Cananéens étaient les peuples du pays situé à l’ouest du Jourdain avant Israël et à côté de lui : citadins de la côte et des vallées qui parlaient une langue sémitique dont l’hébreu lui-même est un dialecte, et adoraient El, Baal, Ashéra et Anat. Le nom est plus ancien que la Bible : une lettre de Mari du XVIIIe siècle av. J.-C. l’emploie peut-être déjà, les lettres d’Amarna du XIVe appellent le pays Kinahhi, quand c’était une province égyptienne, et la stèle de Mérenptah vers 1208 av. J.-C. nomme Canaan à côté d’Israël. La Genèse fait de Canaan un fils de Cham, maudit par Noé, et énumère ses fils depuis Sidon et Heth jusqu’aux Jébusiens et aux Amoréens, avec une frontière « depuis Sidon, du côté de Guérar, jusqu’à Gaza ». Le point de la carte pour Canaan se trouve dans les collines de Galilée."
    - "La Bible emploie le nom dans un sens étroit et dans un sens large. Pour les espions, « les Cananéens habitent près de la mer et le long du Jourdain », tandis que Héthiens, Jébusiens et Amoréens tiennent la montagne ; ailleurs ils sont l’une des sept nations « plus nombreuses et plus puissantes que toi », qu’il faut chasser. Juda « ne put chasser les habitants de la plaine, parce qu’ils avaient des chars de fer » ; Manassé laissa Beth-Schean, Thaanac, Dor, Jibleam et Meguiddo, « et les Cananéens voulurent rester dans ce pays », et Israël « assujettit les Cananéens à un tribut »."
    - "Dans le chant de Débora, « Alors combattirent les rois de Canaan, à Thaanac, aux eaux de Meguiddo » ; et les Israélites « prirent leurs filles pour femmes … et ils servirent leurs dieux ». Comme les Cananéens faisaient du commerce, le mot en vint à signifier un marchand : le « marchand » d’Osée (« Éphraïm est un marchand ») est en hébreu un Cananéen, et la dernière ligne de Zacharie, « il n’y aura plus de marchands dans la maison de l’Éternel des armées », se lit des deux manières. Les Cananéens ne disparurent pas : les Phéniciens de Tyr et de Sidon étaient des Cananéens restés sur la côte, et la « femme cananéenne » venue trouver Jésus près de Tyr est la « syro-phénicienne » de Marc."
    - "Ce qu’ils croyaient est connu par Ougarit, sur la côte syrienne, où des tablettes trouvées à partir de 1929 conservent les mythes de Baal, d’El, d’Ashéra et d’Anat des XIVe et XIIIe siècles av. J.-C. Savoir si Israël venait de l’extérieur du pays ou de l’intérieur est débattu. La Bible raconte une conquête ; de nombreux archéologues depuis les années 1980 voient dans les premiers Israélites surtout des Cananéens de la région montagneuse qui fondèrent de nouveaux villages au XIIe siècle av. J.-C., quand Mérenptah nomme Israël pour la première fois ; d’autres défendent une entrée venue de l’extérieur, datée du XVe ou du XIIIe siècle. Même le nom est discuté : Lemche soutint que personne ne s’était jamais appelé Cananéen, et Rainey répondit, d’après les lettres d’Amarna, que les gens de Canaan le faisaient."
