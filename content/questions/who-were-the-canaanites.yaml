id: who-were-the-canaanites
question:
  en: "Who were the Canaanites?"
  ru: "Кто такие хананеи?"
  uk: "Хто були ханаанеї?"
  es: "¿Quiénes eran los cananeos?"
  pt: "Quem eram os cananeus?"
  de: "Wer waren die Kanaaniter?"
  fr: "Qui étaient les Cananéens ?"
  pl: "Kim byli Kananejczycy?"
  it: "Chi erano i Cananei?"
  cs: "Kdo byli Kananejci?"
  nl: "Wie waren de Kanaänieten?"
  sv: "Vilka var kananéerna?"
  nb: "Hvem var kanaaneerne?"
  tl: "Sino ang mga Cananeo?"
  da: "Hvem var kana’anæerne?"
  sr: "Ко су били Хананеји?"
  hu: "Kik voltak a kánaániak?"
  fi: "Keitä kanaanilaiset olivat?"
  vi: "Người Ca-na-an là ai?"
  ro: "Cine erau canaaniții?"
  bg: "Кои са били ханаанците?"
answer:
  en:
    - "The Canaanites were the peoples of the land west of the Jordan before Israel and beside it: townsfolk of the coast and the valleys who spoke a Semitic tongue of which Hebrew itself is a dialect, and worshipped El, Baal, Asherah and Anat. The name is older than the Bible: a letter from Mari of the eighteenth century BC may already use it, the Amarna letters of the fourteenth call the land Kinahhi, when it was an Egyptian province, and the stele of Merneptah about 1208 BC names Canaan beside Israel. Genesis makes Canaan a son of Ham, cursed by Noah, and lists his sons from Sidon and Heth to the Jebusites and Amorites, with a border “from Sidon, as thou comest to Gerar, unto Gaza”. The map's point for Canaan stands in the hills of Galilee."
    - "The Bible uses the name in a narrow and a wide sense. To the spies “the Canaanites dwell by the sea, and by the coast of Jordan”, while Hittites, Jebusites and Amorites hold the hills; elsewhere they are one of the seven nations “greater and mightier than thou”, to be driven out. Judah “could not drive out the inhabitants of the valley, because they had chariots of iron”; Manasseh left Beth-shean, Taanach, Dor, Ibleam and Megiddo, “but the Canaanites would dwell in that land”, and Israel “put the Canaanites to tribute”."
    - "In Deborah's song “then fought the kings of Canaan in Taanach by the waters of Megiddo”; and the people “took their daughters to be their wives… and served their gods”. Because Canaanites traded, the word came to mean a merchant: Hosea's “merchant” is in Hebrew a Canaanite, and Zechariah's last line, “there shall be no more the Canaanite in the house of the LORD”, is read both ways. The Canaanites did not vanish: the Phoenicians of Tyre and Sidon were Canaanites who stayed on the coast, and the “woman of Canaan” who came to Jesus near Tyre is Mark's “Syrophenician”."
    - "What they believed is known from Ugarit on the Syrian coast, where tablets found from 1929 preserve the myths of Baal, El, Asherah and Anat of the fourteenth and thirteenth centuries BC. Whether Israel came from outside the land or from within it is debated. The Bible tells of a conquest; many archaeologists since the 1980s see the first Israelites as mostly hill-country Canaanites who settled new villages in the twelfth century BC, when Merneptah first names Israel; others defend an entry from outside, dated to the fifteenth or the thirteenth century. Even the name is argued over: Lemche held that no one ever called himself a Canaanite, and Rainey answered from the Amarna letters that the people of Canaan did."
  ru:
    - "Хананеи — народы земли к западу от Иордана до Израиля и рядом с ним: жители городов на побережье и в долинах, говорившие на семитском языке, диалектом которого является и сам еврейский, и почитавшие Эла, Ваала, Ашеру и Анат. Имя старше Библии: его, возможно, уже знает письмо из Мари XVIII века до н. э., амарнские письма XIV века зовут страну Кинахху, когда она была египетской провинцией, а стела Мернептаха около 1208 г. до н. э. называет Ханаан рядом с Израилем. Бытие делает Ханаана сыном Хама, проклятым Ноем, и перечисляет его сыновей от Сидона и Хета до Иевусеев и Аморреев, с пределами «от Сидона к Герару до Газы». Точка карты для Ханаана стоит в горах Галилеи."
    - "Библия употребляет имя в узком и в широком смысле. Соглядатаям «Хананеи же живут при море и на берегу Иордана», а горы держат Хеттеи, Иевусеи и Аморреи; в других местах это один из семи народов, «которые многочисленнее и сильнее тебя», подлежащих изгнанию. Иуда «жителей долины не мог прогнать, потому что у них были железные колесницы»; Манассия оставил Бефсан, Фаанах, Дор, Ивлеам и Мегиддон, «и остались Хананеи жить в земле сей», а когда Израиль пришёл в силу, «тогда сделал он Хананеев данниками»."
    - "В песне Деворы «тогда сразились цари Ханаанские в Фанаахе у вод Мегиддонских»; а израильтяне «брали дочерей их себе в жены… и служили богам их». Поскольку хананеи торговали, слово стало значить «купец»: у Осии «Хананеянин с неверными весами», а последний стих Захарии — «не будет более ни одного Хананея в доме Господа Саваофа» — читают и так, и так. Хананеи не исчезли: финикийцы Тира и Сидона — это хананеи, оставшиеся на побережье, и «женщина Хананеянка», пришедшая к Иисусу близ Тира, у Марка — «сирофиникиянка»."
    - "Во что они верили, известно по Угариту на сирийском берегу, где таблички, находимые с 1929 года, сохранили мифы о Ваале, Эле, Ашере и Анат XIV–XIII веков до н. э. Пришёл ли Израиль в землю извне или вышел из неё самой — предмет спора. Библия рассказывает о завоевании; многие археологи с 1980-х годов видят в первых израильтянах по большей части хананеев горной страны, заселивших новые деревни в XII веке до н. э., когда Мернептах впервые называет Израиль; другие отстаивают приход извне, в XV или XIII веке. Спорят даже об имени: Лемхе считал, что никто не называл себя хананеем, а Рейни отвечал по амарнским письмам, что жители Ханаана называли."
  uk:
    - "Ханаанеї були народами землі на захід від Йордану перед Ізраїлем і поруч із ним: жителями міст узбережжя й долин, які говорили семітською мовою, діалектом якої є сама єврейська, і поклонялися Елю, Ваалу, Ашері й Анат. Назва давніша за Біблію: лист із Марі XVIII ст. до н. е., можливо, вже вживає її, листи з Амарни XIV ст. називають країну Кінахі, коли вона була єгипетською провінцією, а стела Мернептаха близько 1208 р. до н. е. називає Ханаан поруч з Ізраїлем. Книга Буття робить Ханаана сином Хама, проклятим Ноєм, і перелічує його синів від Сідона та Хета до євусеїв і амореїв, з межею «від Сидону до Герару, до Гази». Точка Ханаану на мапі стоїть у пагорбах Галілеї."
    - "Біблія вживає назву у вузькому й широкому значенні. Для розвідників «Канаанїї живуть над морем і здовж берегів Іорданських», тоді як хеттеї, євусеї й амореї тримають пагорби; в інших місцях вони — один із семи народів, «більших і потужніщих за тебе», яких треба вигнати. Про Юду сказано: «Подолян же не здолїв прогнати, бо в них були залїзні колесницї»; Манасія залишив Бет-Шеан, Таанах, Дор, Івлеам і Мегіддо: «Так і вдалось Канаанїям зістатись на житлї в цїй країнї», а Ізраїль, як сказано, «зробив він Канаанїїв свойми крепаками»."
    - "У пісні Дебори «царі Канаанські в Танаах у вод Мегидонських» билися; а народ «Брали за себе їх дочки ... і служили їх богам». Оскільки ханаанеї торгували, слово стало означати купця: «купець» в Осії — на івриті ханаанеянин, а останній рядок Захарії, «не буде тих часів ніякого крамаря в дому Господа сил небесних», читають в обох значеннях. Ханаанеї не зникли: фінікійці Тіру та Сідона були ханаанеями, що залишилися на узбережжі, а «жінка Канаанка», яка прийшла до Ісуса поблизу Тіру, — це Марків «Сирофиникиянка»."
    - "У що вони вірили, відомо з Угарита на сирійському узбережжі, де таблички, знайдені від 1929 р., зберігають міфи про Ваала, Еля, Ашеру й Анат XIV і XIII ст. до н. е. Чи прийшов Ізраїль ззовні, чи зсередини краю, обговорюють. Біблія розповідає про завоювання; багато археологів від 1980-х рр. бачать у перших ізраїльтянах здебільшого ханаанеїв гірського краю, які заселили нові села в XII ст. до н. е., коли Мернептах уперше називає Ізраїль; інші обстоюють входження ззовні, датоване XV або XIII ст. Навіть назва викликає суперечки: Лемке стверджував, що ніхто ніколи не називав себе ханаанеєм, а Рейні на підставі листів з Амарни відповідав, що жителі Ханаану називали себе ханаанеями."
  es:
    - "Los cananeos eran los pueblos de la tierra al oeste del Jordán antes de Israel y junto a él: gente de las ciudades de la costa y de los valles que hablaba una lengua semítica de la que el propio hebreo es un dialecto, y que adoraba a El, Baal, Asera y Anat. El nombre es más antiguo que la Biblia: una carta de Mari del siglo XVIII a. C. quizá ya lo use, las cartas de Amarna del siglo XIV llaman a la tierra Kinahhi, cuando era una provincia egipcia, y la estela de Merneptah, hacia 1208 a. C., nombra Canaán junto a Israel. El Génesis hace de Canaán un hijo de Cam, maldecido por Noé, y enumera a sus hijos desde Sidón y Het hasta los jebuseos y los amorreos, con una frontera «desde Sidón, viniendo á Gerar hasta Gaza». El punto del mapa para Canaán está en las colinas de Galilea."
    - "La Biblia usa el nombre en un sentido estrecho y en otro amplio. Para los espías, «el Cananeo habita junto á la mar, y á la ribera del Jordán», mientras que hititas, jebuseos y amorreos ocupan los montes; en otros pasajes son una de las siete naciones «mayores y más fuertes que tú», que habían de ser expulsadas. Judá «no pudo echar á los que habitaban en los llanos, los cuales tenían carros herrados»; Manasés dejó Bet-seán, Taanac, Dor, Ibleam y Meguido, «mas el Cananeo quiso habitar en esta tierra», e Israel «hizo al Cananeo tributario»."
    - "En el cántico de Débora, «entonces pelearon los reyes de Canaán en Taanac, junto á las aguas de Megiddo»; y los israelitas «tomaron de sus hijas por mujeres… y sirvieron á sus dioses». Como los cananeos comerciaban, la palabra pasó a significar mercader: el «mercader» de Oseas es en hebreo un cananeo, y la última línea de Zacarías, «no habrá más Cananeo alguno en la casa de Jehová de los ejércitos», se lee de ambas maneras. Los cananeos no desaparecieron: los fenicios de Tiro y Sidón eran cananeos que permanecieron en la costa, y la «mujer Cananea» que acudió a Jesús cerca de Tiro es la «Sirofenisa» de Marcos."
    - "Lo que creían se conoce por Ugarit, en la costa siria, donde las tablillas halladas desde 1929 conservan los mitos de Baal, El, Asera y Anat de los siglos XIV y XIII a. C. Si Israel vino de fuera de la tierra o de dentro de ella se discute. La Biblia cuenta una conquista; muchos arqueólogos desde la década de 1980 ven en los primeros israelitas sobre todo a cananeos de la región montañosa que se asentaron en aldeas nuevas en el siglo XII a. C., cuando Merneptah nombra por primera vez a Israel; otros defienden una entrada desde fuera, fechada en el siglo XV o en el XIII. Hasta el nombre se discute: Lemche sostuvo que nadie se llamó nunca a sí mismo cananeo, y Rainey respondió, a partir de las cartas de Amarna, que la gente de Canaán sí lo hacía."
  pt:
    - "Os cananeus eram os povos da terra a oeste do Jordão antes de Israel e ao lado dele: moradores de cidades da costa e dos vales que falavam uma língua semítica da qual o próprio hebraico é um dialeto, e adoravam El, Baal, Aserá e Anat. O nome é mais antigo do que a Bíblia: uma carta de Mari do século XVIII a.C. talvez já o use, as cartas de Amarna do século XIV chamam a terra Kinahhi, quando era uma província egípcia, e a estela de Merneptá, por volta de 1208 a.C., nomeia Canaã ao lado de Israel. O Gênesis faz de Canaã um filho de Cam, amaldiçoado por Noé, e enumera seus filhos de Sidom e Hete aos jebuseus e amorreus, com uma fronteira “desde Sidom — indo na direção de Gerar — até Gaza”. O ponto do mapa para Canaã fica nas colinas da Galileia."
    - "A Bíblia usa o nome em sentido estreito e em sentido largo. Para os espias, “O cananeu habita junto ao mar e ao longo da margem do Jordão”, enquanto hititas, jebuseus e amorreus ocupam as colinas; em outros lugares são uma das sete nações “maiores e mais poderosas do que você”, que devem ser expulsas. Os de Judá “não conseguiram expulsar os habitantes do vale, porque estes tinham carros de ferro”; Manassés deixou Bete-Seã, Taanaque, Dor, Ibleão e Megido, “mas os cananeus persistiram em habitar naquela terra”, e Israel “sujeitou os cananeus a trabalhos forçados”."
    - "No cântico de Débora, “os reis de Canaã lutaram em Taanaque, junto às águas de Megido”; e o povo, diz o texto, “Eles tomaram as filhas deles para serem suas mulheres… e serviram aos seus deuses”. Como os cananeus comerciavam, a palavra passou a significar mercador: o “comerciante” de Oseias é, em hebraico, um cananeu, e a última linha de Zacarias, “não haverá mais cananeu na casa do SENHOR dos Exércitos”, é lida nos dois sentidos. Os cananeus não desapareceram: os fenícios de Tiro e Sidom eram cananeus que permaneceram na costa, e a “mulher cananeia” que veio a Jesus perto de Tiro é a “siro-fenícia” de Marcos."
    - "No que acreditavam conhece-se por Ugarite, na costa síria, onde tabuinhas encontradas a partir de 1929 preservam os mitos de Baal, El, Aserá e Anat dos séculos XIV e XIII a.C. Se Israel veio de fora da terra ou de dentro dela é debatido. A Bíblia conta uma conquista; muitos arqueólogos desde a década de 1980 veem os primeiros israelitas como sobretudo cananeus da região montanhosa que fundaram novas aldeias no século XII a.C., quando Merneptá nomeia Israel pela primeira vez; outros defendem uma entrada de fora, datada do século XV ou XIII. Até o nome é disputado: Lemche sustentou que ninguém jamais se chamou cananeu, e Rainey respondeu, a partir das cartas de Amarna, que o povo de Canaã o fazia."
  de:
    - "Die Kanaaniter waren die Völker des Landes westlich des Jordans vor Israel und neben ihm: Stadtbewohner der Küste und der Täler, die eine semitische Sprache sprachen, von der das Hebräische selbst ein Dialekt ist, und El, Baal, Aschera und Anat verehrten. Der Name ist älter als die Bibel: Ein Brief aus Mari des 18. Jahrhunderts v. Chr. mag ihn schon gebrauchen, die Amarna-Briefe des 14. nennen das Land Kinahhi, als es eine ägyptische Provinz war, und die Stele des Merenptah nennt um 1208 v. Chr. Kanaan neben Israel. Die Genesis macht Kanaan zu einem Sohn Hams, von Noah verflucht, und zählt seine Söhne von Sidon und Heth bis zu den Jebusitern und Amoritern auf, mit einer Grenze „von Sidon an durch Gerar bis gen Gaza“. Der Kartenpunkt für Kanaan steht in den Bergen Galiläas."
    - "Die Bibel gebraucht den Namen in einem engen und einem weiten Sinn. Den Kundschaftern zufolge gilt: „die Kanaaniter aber wohnen am Meer und um den Jordan“, während Hethiter, Jebusiter und Amoriter das Bergland halten; anderswo sind sie eins der sieben Völker, „die größer und stärker sind denn du“, die vertrieben werden sollen. Juda „konnte die Einwohner im Grunde nicht vertreiben, darum daß sie eiserne Wagen hatten“; Manasse vertrieb Bet-Schean, Taanach, Dor, Jibleam und Megiddo nicht, „und die Kanaaniter blieben wohnen im Land“, und Israel „machte es die Kanaaniter zinsbar“."
    - "In Deboras Lied „stritten die Könige der Kanaaniter zu Thaanach am Wasser Megiddos“; und das Volk: „nahmen sie jener Töchter zu Weibern … und dienten jener Göttern“. Weil Kanaaniter Handel trieben, kam das Wort zur Bedeutung Kaufmann: Der „Kaufmann“ bei Hosea ist im Hebräischen ein Kanaaniter, und Sacharjas letzter Satz, „wird kein Kanaaniter mehr sein im Hause des HERRN Zebaoth“, wird in beiden Weisen gelesen. Die Kanaaniter verschwanden nicht: Die Phönizier von Tyrus und Sidon waren Kanaaniter, die an der Küste blieben, und das „kanaanäische Weib“, das bei Tyrus zu Jesus kam, ist das „aus Syrophönizien“ des Markus."
    - "Was sie glaubten, ist aus Ugarit an der syrischen Küste bekannt, wo seit 1929 gefundene Tafeln die Mythen von Baal, El, Aschera und Anat aus dem 14. und 13. Jahrhundert v. Chr. bewahren. Ob Israel von außerhalb des Landes oder aus ihm kam, ist umstritten. Die Bibel erzählt von einer Eroberung; viele Archäologen sehen seit den 1980er-Jahren in den ersten Israeliten überwiegend Kanaaniter des Berglands, die im 12. Jahrhundert v. Chr. neue Dörfer gründeten, als Merenptah Israel erstmals nennt; andere verteidigen einen Einzug von außen, ins 15. oder 13. Jahrhundert datiert. Selbst der Name ist umstritten: Lemche meinte, niemand habe sich je Kanaaniter genannt, und Rainey entgegnete aus den Amarna-Briefen, dass die Leute von Kanaan es taten."
  fr:
    - "Les Cananéens étaient les peuples du pays situé à l’ouest du Jourdain avant Israël et à côté de lui : citadins de la côte et des vallées qui parlaient une langue sémitique dont l’hébreu lui-même est un dialecte, et adoraient El, Baal, Ashéra et Anat. Le nom est plus ancien que la Bible : une lettre de Mari du XVIIIe siècle av. J.-C. l’emploie peut-être déjà, les lettres d’Amarna du XIVe appellent le pays Kinahhi, quand c’était une province égyptienne, et la stèle de Mérenptah vers 1208 av. J.-C. nomme Canaan à côté d’Israël. La Genèse fait de Canaan un fils de Cham, maudit par Noé, et énumère ses fils depuis Sidon et Heth jusqu’aux Jébusiens et aux Amoréens, avec une frontière « depuis Sidon, du côté de Guérar, jusqu’à Gaza ». Le point de la carte pour Canaan se trouve dans les collines de Galilée."
    - "La Bible emploie le nom dans un sens étroit et dans un sens large. Pour les espions, « les Cananéens habitent près de la mer et le long du Jourdain », tandis que Héthiens, Jébusiens et Amoréens tiennent la montagne ; ailleurs ils sont l’une des sept nations « plus nombreuses et plus puissantes que toi », qu’il faut chasser. Juda « ne put chasser les habitants de la plaine, parce qu’ils avaient des chars de fer » ; Manassé laissa Beth-Schean, Thaanac, Dor, Jibleam et Meguiddo, « et les Cananéens voulurent rester dans ce pays », et Israël « assujettit les Cananéens à un tribut »."
    - "Dans le chant de Débora, « Alors combattirent les rois de Canaan, à Thaanac, aux eaux de Meguiddo » ; et les Israélites « prirent leurs filles pour femmes … et ils servirent leurs dieux ». Comme les Cananéens faisaient du commerce, le mot en vint à signifier un marchand : le « marchand » d’Osée (« Éphraïm est un marchand ») est en hébreu un Cananéen, et la dernière ligne de Zacharie, « il n’y aura plus de marchands dans la maison de l’Éternel des armées », se lit des deux manières. Les Cananéens ne disparurent pas : les Phéniciens de Tyr et de Sidon étaient des Cananéens restés sur la côte, et la « femme cananéenne » venue trouver Jésus près de Tyr est la « syro-phénicienne » de Marc."
    - "Ce qu’ils croyaient est connu par Ougarit, sur la côte syrienne, où des tablettes trouvées à partir de 1929 conservent les mythes de Baal, d’El, d’Ashéra et d’Anat des XIVe et XIIIe siècles av. J.-C. Savoir si Israël venait de l’extérieur du pays ou de l’intérieur est débattu. La Bible raconte une conquête ; de nombreux archéologues depuis les années 1980 voient dans les premiers Israélites surtout des Cananéens de la région montagneuse qui fondèrent de nouveaux villages au XIIe siècle av. J.-C., quand Mérenptah nomme Israël pour la première fois ; d’autres défendent une entrée venue de l’extérieur, datée du XVe ou du XIIIe siècle. Même le nom est discuté : Lemche soutint que personne ne s’était jamais appelé Cananéen, et Rainey répondit, d’après les lettres d’Amarna, que les gens de Canaan le faisaient."
  pl:
    - "Kananejczycy byli ludami ziemi na zachód od Jordanu przed Izraelem i obok niego: mieszkańcami miast wybrzeża i dolin, którzy mówili językiem semickim, którego dialektem jest sam hebrajski, i czcili Ela, Baala, Aszerę i Anat. Nazwa jest starsza niż Biblia: list z Mari z XVIII wieku p.n.e. może już jej używać, listy z Amarny z XIV wieku nazywają kraj Kinahhi, gdy był egipską prowincją, a stela Merneptaha z około 1208 p.n.e. wymienia Kanaan obok Izraela. Księga Rodzaju czyni Kanaana synem Chama, przeklętym przez Noego, i wylicza jego synów od Sydona i Heta po Jebusytów i Amorytów, z granicą „od Sydonu idąc do Gerary, aż do Gazy”. Punkt Kanaanu na mapie stoi we wzgórzach Galilei."
    - "Biblia używa tej nazwy w sensie wąskim i szerokim. Dla zwiadowców „Chananejczyk zaś mieszka nad morzem, i nad brzegiem Jordanu”, podczas gdy Hetyci, Jebusyci i Amoryci zajmują góry; gdzie indziej są jednym z siedmiu narodów „większych, i możniejszych, niżliś ty”, które trzeba wypędzić. Juda „nie wypędził mieszkających w dolinie, bo mieli wozy żelazne”; Manasses nie wypędził mieszkańców Bet-Szean, Taanak, Dor, Jibleam i Megiddo, „i począł Chananejczyk mieszkać w onej ziemi”, a Izrael „uczynił Chananejczyka hołdownikiem”."
    - "W pieśni Debory „walczyli królowie Chananejscy w Tanach u wód Magieddo”; a lud „brali sobie córki ich za żony… i służyli bogom ich”. Ponieważ Kananejczycy handlowali, słowo zaczęło oznaczać kupca: słowo „Kupcem” u Ozeasza jest po hebrajsku Kananejczykiem, a ostatni wers Zachariasza, „nie będzie Chananejczyka więcej w domu Pana zastępów”, czyta się na oba sposoby. Kananejczycy nie zniknęli: Fenicjanie z Tyru i Sydonu byli Kananejczykami, którzy pozostali na wybrzeżu, a „niewiasta Chananejska”, która przyszła do Jezusa koło Tyru, to u Marka kobieta „rodem z Syrofenicyi”."
    - "To, w co wierzyli, znamy z Ugarit na wybrzeżu syryjskim, gdzie tabliczki znalezione od 1929 zachowują mity o Baalu, Elu, Aszerze i Anat z XIV i XIII wieku p.n.e. Czy Izrael przyszedł spoza kraju, czy z jego wnętrza, jest dyskutowane. Biblia opowiada o podboju; wielu archeologów od lat 80. widzi w pierwszych Izraelitach głównie kananejskich mieszkańców gór, którzy zakładali nowe wsie w XII wieku p.n.e., gdy Merneptah po raz pierwszy wymienia Izrael; inni bronią wejścia z zewnątrz, datowanego na XV lub XIII wiek. Spór dotyczy nawet nazwy: Lemche twierdził, że nikt nigdy nie nazywał siebie Kananejczykiem, a Rainey odpowiedział na podstawie listów z Amarny, że lud Kanaanu tak robił."
  it:
    - "I Cananei erano i popoli del paese a ovest del Giordano prima di Israele e accanto ad esso: gente di città della costa e delle valli che parlava una lingua semitica di cui l’ebraico stesso è un dialetto, e adorava El, Baal, Asera e Anat. Il nome è più antico della Bibbia: una lettera di Mari del XVIII secolo a.C. può già usarlo, le lettere di Amarna del XIV chiamano il paese Kinahhi, quando era una provincia egiziana, e la stele di Merneptah verso il 1208 a.C. nomina Canaan accanto a Israele. La Genesi fa di Canaan un figlio di Cam, maledetto da Noè, ed elenca i suoi figli da Sidone e Chet ai Gebusei e agli Amorei, con un confine «da Sidon, in direzione di Gherar, fino a Gaza». Il punto della mappa per Canaan si trova sulle colline della Galilea."
    - "La Bibbia usa il nome in senso stretto e in senso ampio. Per gli esploratori «i Cananei abitano presso il mare e lungo il Giordano», mentre Ittiti, Gebusei e Amorei tengono le colline; altrove sono una delle sette nazioni «più grandi e più potenti di te», da scacciare. Giuda «non poté cacciare gli abitanti della valle, perché aveano de’ carri di ferro»; Manasse lasciò Beth-Shean, Taanach, Dor, Ibleam e Meghiddo, «essendo i Cananei decisi a restare in quel paese», e Israele «assoggettò i Cananei a servitù»."
    - "Nel canto di Debora «pugnarono i re di Canaan a Taanac, presso le acque di Meghiddo»; e i figliuoli d’Israele «sposarono le loro figliuole… e servirono ai loro dèi». Poiché i Cananei commerciavano, la parola venne a significare mercante: il «mercante» di Osea è in ebraico un Cananeo, e l’ultimo verso di Zaccaria, «non vi saran più Cananei nella casa dell’Eterno degli eserciti», è letto in entrambi i modi. I Cananei non scomparvero: i Fenici di Tiro e Sidone erano Cananei rimasti sulla costa, e la «donna cananea» che venne da Gesù presso Tiro è la «sirofenicia» di Marco."
    - "Ciò in cui credevano è noto da Ugarit sulla costa siriana, dove tavolette trovate dal 1929 conservano i miti di Baal, El, Asera e Anat del XIV e XIII secolo a.C. Se Israele sia venuto da fuori del paese o dall’interno è discusso. La Bibbia racconta una conquista; molti archeologi dagli anni 1980 vedono i primi Israeliti per lo più come Cananei della regione collinare che fondarono nuovi villaggi nel XII secolo a.C., quando Merneptah nomina per la prima volta Israele; altri difendono un ingresso da fuori, datato al XV o al XIII secolo. Persino il nome è oggetto di disputa: Lemche sostenne che nessuno si sia mai definito Cananeo, e Rainey rispose dalle lettere di Amarna che lo facevano gli abitanti di Canaan."
  cs:
    - "Kananejci byly národy země západně od Jordánu před Izraelem a vedle něj: obyvatelé měst pobřeží a údolí, kteří mluvili semitským jazykem, jehož dialektem je i hebrejština, a uctívali Ela, Baala, Ašeru a Anat. Jméno je starší než Bible: dopis z Mari z 18. století př. n. l. je snad už užívá, amarnské listy 14. století nazývají zemi Kinahhi, když byla egyptskou provincií, a Merneptahova stéla kolem roku 1208 př. n. l. jmenuje Kanaán vedle Izraele. Genesis činí Kanaána synem Chamovým, prokletým Noem, a vyjmenovává jeho syny od Sidóna a Cheta po Jebúsejce a Amorejce, s hranicí „od Sidonu, když jdeš k Gerar až do Gázy“. Bod Kanaánu na mapě stojí v galilejských pahorcích."
    - "Bible užívá jména v užším i širším smyslu. Zvědům „Kananejský pak bydlí při moři a při břehu Jordánském“, zatímco Chetité, Jebúsejci a Amorejci drží hory; jinde jsou jedním ze sedmi národů, „větších a silnějších, nežli jsi ty“, které je třeba vyhnat. Juda „nevyhnal obyvatelů údolí, proto že vozy železné měli“; Manases nevyhnal Bét-šean, Taanach, Dor, Jibleam a Megido, „i počal Kananejský svobodně bydliti v zemi té“ a Izrael „uvedl Kananejského pod plat“."
    - "V Debořině písni „tehdáž bojovali králové Kananejští v Tanach při vodách Mageddo“; a Izraelci „brali sobě dcery jejich za manželky… a sloužili bohům jejich“. Protože Kananejci obchodovali, slovo začalo znamenat kupce: Ozeášův kramář je hebrejsky Kananejec a poslední řádek Zacharjášův, „Aniž bude Kananejský více v domě Hospodina zástupů“, se čte oběma způsoby. Kananejci nezmizeli: Féničané z Týru a Sidónu byli Kananejci, kteří zůstali na pobřeží, a „žena Kananejská“, která přišla k Ježíšovi poblíž Týru, je Markova Syrofénická."
    - "Co věřili, je známo z Ugaritu na syrském pobřeží, kde tabulky nalezené od roku 1929 uchovávají mýty o Baalovi, Elovi, Ašeře a Anat z 14. a 13. století př. n. l. Zda Izrael přišel zvenčí, nebo z vnitra země, je sporné. Bible vypráví o dobytí; mnozí archeologové od 80. let vidí první Izraelity většinou jako horské Kananejce, kteří ve 12. století př. n. l. osídlili nové vesnice, kdy Merneptah poprvé jmenuje Izrael; jiní hájí vstup zvenčí, datovaný do 15. nebo 13. století. I samo jméno je předmětem sporu: Lemche tvrdil, že se nikdo nenazýval Kananejcem, a Rainey odpověděl z amarnských listů, že lid Kanaánu ano."
  nl:
    - "De Kanaänieten waren de volken van het land ten westen van de Jordaan vóór Israël en naast Israël: stedelingen van de kust en de dalen die een Semitische taal spraken waarvan het Hebreeuws zelf een dialect is, en El, Baäl, Asjera en Anat vereerden. De naam is ouder dan de Bijbel: een brief uit Mari van de achttiende eeuw v.Chr. gebruikt hem misschien al, de Amarnabrieven van de veertiende noemen het land Kinahhi, toen het een Egyptische provincie was, en de stèle van Merneptah noemt omstreeks 1208 v.Chr. Kanaän naast Israël. Genesis maakt Kanaän tot een zoon van Cham, vervloekt door Noach, en somt zijn zonen op van Sidon en Chet tot de Jebusieten en Amorieten, met een grens “van Sidon, daar gij gaat naar Gerar tot Gaza toe”. Het punt op de kaart voor Kanaän staat in de heuvels van Galilea."
    - "De Bijbel gebruikt de naam in een enge en een brede zin. Voor de verspieders “de Kanaanieten wonen aan de zee, en aan den oever van de Jordaan”, terwijl Hettieten, Jebusieten en Amorieten het bergland bezetten; elders zijn zij een van de zeven volken “die meerder en machtiger zijn dan gij”, die verdreven moesten worden. Juda “ging niet voort om de inwoners des dals te verdrijven, omdat zij ijzeren wagenen hadden”; Manasse verdreef Beth-Sean, Taänach, Dor, Jibleam en Megiddo niet, “en de Kanaanieten wilden wonen in hetzelve land”, en Israël, toen het sterk werd, “de Kanaanieten op cijns stelde”."
    - "In het lied van Debora “toen streden de koningen van Kanaan, te Thaanach aan de wateren van Megiddo”; en het volk: “Zo namen zij zich derzelver dochters tot vrouwen, en gaven hun dochters aan derzelver zonen; en zij dienden derzelver goden.” Omdat Kanaänieten handel dreven, ging het woord koopman betekenen: de “koopman” van Hosea is in het Hebreeuws een Kanaäniet, en de laatste regel van Zacharia, “er zal geen Kanaaniet meer zijn, in het huis des HEEREN der heirscharen”, wordt op beide manieren gelezen. De Kanaänieten verdwenen niet: de Feniciërs van Tyrus en Sidon waren Kanaänieten die aan de kust bleven, en de “Kananese vrouw” die bij Tyrus tot Jezus kwam is Marcus' “Syro-Fenicie”."
    - "Wat zij geloofden is bekend uit Ugarit aan de Syrische kust, waar tabletten, gevonden vanaf 1929, de mythen van Baäl, El, Asjera en Anat uit de veertiende en dertiende eeuw v.Chr. bewaren. Of Israël van buiten het land kwam of uit het land zelf, wordt betwist. De Bijbel vertelt een verovering; veel archeologen zien sinds de jaren tachtig de eerste Israëlieten grotendeels als Kanaänieten uit het bergland die in de twaalfde eeuw v.Chr. nieuwe dorpen vestigden, toen Merneptah Israël voor het eerst noemt; anderen verdedigen een binnenkomst van buiten, gedateerd in de vijftiende of de dertiende eeuw. Zelfs de naam is omstreden: Lemche hield vol dat niemand zichzelf ooit Kanaäniet noemde, en Rainey antwoordde aan de hand van de Amarnabrieven dat de mensen van Kanaän dat wel deden."
  sv:
    - "Kananéerna var folken i landet väster om Jordan före Israel och vid dess sida: stadsbor vid kusten och i dalarna som talade ett semitiskt språk, varav hebreiskan själv är en dialekt, och som dyrkade El, Baal, Asherah och Anat. Namnet är äldre än Bibeln: ett brev från Mari från 1700-talet f.Kr. kan redan använda det, Amarnabreven från 1300-talet kallar landet Kinahhi, då det var en egyptisk provins, och Merneptahs stele omkring 1208 f.Kr. nämner Kanaan bredvid Israel. Första Moseboken gör Kanaan till son till Ham, förbannad av Noa, och förtecknar hans söner från Sidon och Het till jebuséerna och amoréerna, med en gräns ”från Sidon fram emot Gerar ända till Gasa”. Kartans punkt för Kanaan står i Galileens berg."
    - "Bibeln använder namnet i en snäv och en vid mening. För spejarna bor kananéerna ”vid havet och utmed Jordan”, medan hetiter, jebuséer och amoréer håller bergen; på andra ställen är de ett av de sju folken, ”större och mäktigare än du”, som ska drivas ut. Juda ”kunde icke fördriva dem som bodde i dalbygden, därför att dessa hade stridsvagnar av järn”; Manasse lät Bet-Shean, Taanak, Dor, Jivleam och Megiddo vara, ”utan kananéerna förmådde hålla sig kvar där i landet”, och när israeliterna blev starkare ”läto de kananéerna bliva arbetspliktiga under sig”."
    - "I Deboras sång ”stridde Kanaans konungar vid Taanak, invid Megiddos vatten”; och folket tog ”deras döttrar till hustrur åt sig … och tjänade deras gudar”. Eftersom kananéerna handlade kom ordet att betyda köpman: Hoseas köpman är på hebreiska en kanané, och Sakarjas sista rad, ”ingen kanané skall mer finnas i HERREN Sebaots hus”, läses åt båda hållen. Kananéerna försvann inte: fenicierna i Tyros och Sidon var kananéer som stannade kvar vid kusten, och ”en kananeisk kvinna” som kom till Jesus nära Tyros är Markus’ kvinna ”av syrofenicisk härkomst”."
    - "Vad de trodde är känt från Ugarit på den syriska kusten, där lertavlor som hittades från 1929 bevarar myterna om Baal, El, Asherah och Anat från 1300- och 1200-talen f.Kr. Huruvida Israel kom utifrån eller från landet självt är omdiskuterat. Bibeln berättar om en erövring; många arkeologer sedan 1980-talet ser de första israeliterna mestadels som kananéer från bergslandet som bosatte nya byar på 1100-talet f.Kr., då Merneptah först nämner Israel; andra försvarar ett intåg utifrån, daterat till 1400- eller 1200-talet. Även namnet är omstritt: Lemche hävdade att ingen någonsin kallade sig kanané, och Rainey svarade utifrån Amarnabreven att folket i Kanaan gjorde det."
  nb:
    - "Kanaaneerne var folkene i landet vest for Jordan før Israel og ved siden av det: bofaste folk ved kysten og i dalene som talte et semittisk språk som hebraisk selv er en dialekt av, og som dyrket El, Baal, Asjera og Anat. Navnet er eldre enn Bibelen: et brev fra Mari fra 1700-tallet f.Kr. bruker det kanskje allerede, Amarna-brevene fra 1300-tallet kaller landet Kinahhi, da det var en egyptisk provins, og Merneptahs stele omkring 1208 f.Kr. nevner Kanaan ved siden av Israel. Første Mosebok gjør Kanaan til en sønn av Ham, forbannet av Noah, og oppregner hans sønner fra Sidon og Het til jebusittene og amorittene, med en grense «fra Sidon bortimot Gerar like til Gasa». Kartets punkt for Kanaan står i åsene i Galilea."
    - "Bibelen bruker navnet i en snever og en vid betydning. For speiderne «kana’anittene bor ute ved havet og langsmed Jordan», mens hetittene, jebusittene og amorittene holder fjellbygdene; andre steder er de ett av de «syv folk, som er større og sterkere enn du», som skal drives ut. Juda «var ikke i stand til å drive bort innbyggerne i dalen, for de hadde jernvogner»; Manasse lot Bet-Sean, Taanak, Dor, Jibleam og Megiddo stå, og «det lyktes kana’anittene å bli boende der i landet», og da Israel ble sterkt, «gjorde de kana’anittene arbeidspliktige»."
    - "I Deboras sang «stred Kana’ans konger ved Ta’anak, ved Megiddos vann»; og siden «tok de deres døtre til hustruer og gav sine døtre til deres sønner og dyrket deres guder». Fordi kanaaneerne drev handel, kom ordet til å bety en kjøpmann: Hoseas «kjøpmann» er på hebraisk en kanaaneer, og Sakarjas siste linje, «det skal ikke mere være nogen kana’anitt i Herrens, hærskarenes Guds hus», leses begge veier. Kanaaneerne forsvant ikke: fønikerne i Tyros og Sidon var kanaaneere som ble boende ved kysten, og «en kananeisk kvinne» som kom til Jesus nær Tyros, er Markus’ «syrofønikisk»."
    - "Hva de trodde, er kjent fra Ugarit på den syriske kysten, der tavler funnet fra 1929 bevarer myter om Baal, El, Asjera og Anat fra 1300- og 1200-tallet f.Kr. Om Israel kom utenfra eller innenfra landet, er omdiskutert. Bibelen forteller om en erobring; mange arkeologer siden 1980-årene ser de første israelittene som for det meste kanaaneere i fjellandet som bosatte nye landsbyer på 1100-tallet f.Kr., da Merneptah første gang nevner Israel; andre forsvarer et inntog utenfra, datert til 1400- eller 1200-tallet. Selv navnet er det strid om: Lemche hevdet at ingen noen gang kalte seg kanaaneer, og Rainey svarte fra Amarna-brevene at folket i Kanaan gjorde det."
  tl:
    - "Ang mga Cananeo ay ang mga bayan ng lupain sa kanluran ng Jordan bago at kasama ng Israel: mga taga-bayan ng baybayin at ng mga lambak na nagsasalita ng wikang Semitiko na isang diyalekto ang Hebreo mismo, at sumasamba kay El, Baal, Asherah at Anat. Mas matanda sa Biblia ang pangalan: maaaring ginagamit na ito ng isang liham mula sa Mari noong ika-18 siglo BK, tinatawag ng mga liham ng Amarna noong ika-14 ang lupain na Kinahhi, nang ito ay lalawigang Egipcio, at pinangalanan ng stele ni Merneptah noong mga 1208 BK ang Canaan sa tabi ng Israel. Ginagawa ng Genesis na anak ni Ham si Canaan, isinumpa ni Noe, at inililista ang kaniyang mga anak mula Sidon at Heth hanggang sa mga Jebuseo at Amorrheo, na may hangganan “mula sa Sidon, kung patungo sa Gerar, hanggang sa Gaza”. Nasa mga burol ng Galilea ang punto ng mapa para sa Canaan."
    - "Ginagamit ng Biblia ang pangalan sa makitid at malawak na kahulugan. Para sa mga tiktik, “ang Cananeo ay tumatahan sa tabi ng dagat, at sa mga pangpang ng Jordan”, samantalang hawak ng mga Hetheo, Jebuseo at Amorrheo ang mga burol; sa iba, isa sila sa pitong bansang “lalong malalaki at mga lalong makapangyarihan kay sa iyo”, na papalayasin. Sinasabi ng Mga Hukom na hindi napalayas ng Juda ang mga nasa libis: “hindi niya mapalayas ang mga nananahan sa libis, dahil sa sila'y may mga karong bakal”; hindi pinalayas ng Manases ang Beth-san, Taanach, Dor, Ibleam at Megiddo, “kundi ang mga Cananeo ay nagsitahan sa lupaing yaon”, at “pinapagatag ang mga Cananeo” ng Israel."
    - "Sa awit ni Debora, “nagsilaban ang mga hari ng Canaan, Sa Taanach na nasa tabi ng tubig sa Megiddo”; at kinuha ng bayan “ang kanilang mga anak na babae upang maging mga asawa nila… at naglingkod sa kanilang mga dios”. Dahil nakipagkalakalan ang mga Cananeo, ang salita ay naging kahulugang mangangalakal: ang “mangangalakal” ni Oseas ay Cananeo sa Hebreo, at ang huling linya ni Zacharias, “hindi na magkakaroon pa ng Cananeo sa bahay ng Panginoon ng mga hukbo”, ay binabasa sa dalawang paraan. Hindi naglaho ang mga Cananeo: ang mga Fenicio ng Tiro at Sidon ay mga Cananeong nanatili sa baybayin, at ang “babaing Cananea” na lumapit kay Jesus malapit sa Tiro ay ang Sirofenicia ni Marcos."
    - "Alam ang kanilang pinaniniwalaan mula sa Ugarit sa baybaying Siria, kung saan ang mga tableta na natagpuan mula 1929 ay nag-iingat ng mga mito nina Baal, El, Asherah at Anat noong ika-14 at ika-13 siglo BK. Pinagtatalunan kung ang Israel ay nagmula sa labas ng lupain o sa loob nito. Isinasalaysay ng Biblia ang pananakop; maraming arkeologo mula dekada 1980 ang nakikita sa unang mga Israelita ang halos mga Cananeo sa maburol na lupain na nagtayo ng bagong mga nayon noong ika-12 siglo BK, nang unang pangalanan ni Merneptah ang Israel; ipinagtatanggol ng iba ang pagpasok mula sa labas, na ipinepetsa sa ika-15 o ika-13 siglo. Pinagtatalunan pati ang pangalan: sinabi ni Lemche na walang tumawag sa sarili na Cananeo, at sumagot si Rainey mula sa mga liham ng Amarna na ginawa ito ng mga taga-Canaan."
  da:
    - "Kana’anæerne var folkene i landet vest for Jordan før Israel og ved siden af det: byboere på kysten og i dalene, som talte et semitisk sprog, hvoraf selve hebraisk er en dialekt, og tilbad El, Ba’al, Asjera og Anat. Navnet er ældre end Bibelen: Et brev fra Mari fra 1700-tallet f.Kr. bruger det måske allerede, Amarna-brevene fra 1300-tallet kalder landet Kinahhi, da det var en egyptisk provins, og Merneptahs stele omkring 1208 f.Kr. nævner Kana’an ved siden af Israel. Første Mosebog gør Kana’an til en søn af Kam, forbandet af Noa, og opregner hans sønner fra Sidon og Het til jebusitterne og amoritterne, med en grænse »fra Zidon henimod Gerar indtil Gaza«. Kortets punkt for Kana’an står i Galilæas bjerge."
    - "Bibelen bruger navnet i en snæver og en vid betydning. For spionerne bor kana’anæerne »ved Havet og ved Jordanens Bred«, mens hittitter, jebusitter og amoritter holder bjergene; andetsteds er de ét af de syv folk, »som ere mangfoldigere og vældigere end du«, der skal drives ud. Juda »mægtede ikke at fordrive Indbyggerne i Dalen, fordi de havde Jernvogne«; Manasse fordrev ikke indbyggerne i Bet-Sjan, Ta’anak, Dor, Jibleam og Megiddo, og »Kananiten boede roligt i det samme Land«, og Israel »gjorde Kananiten skatskyldig«."
    - "I Deboras sang »strede Kanaans Konger udi Thaanak ved Megiddo Vand«; og folket »toge sig deres Døtre til Hustruer … og de tjente deres Guder«. Fordi kana’anæerne drev handel, kom ordet til at betyde en købmand: Hoseas »købmand« er på hebraisk en kana’anæer, og Zakarias’ sidste linje, »der skal ingen Kananit ydermere være i den Herre Zebaoths Hus«, læses begge veje. Kana’anæerne forsvandt ikke: Fønikerne i Tyrus og Sidon var kana’anæere, der blev på kysten, og »en kananæisk Kvinde«, der kom til Jesus nær Tyrus, er Markus’ »Syrofønikerinde«."
    - "Hvad de troede, kendes fra Ugarit på den syriske kyst, hvor tavler fundet fra 1929 bevarer myterne om Ba’al, El, Asjera og Anat fra 1300- og 1200-tallet f.Kr. Om Israel kom udefra eller indefra er omdiskuteret. Bibelen fortæller om en erobring; mange arkæologer siden 1980’erne ser de første israelitter som for det meste kana’anæere fra højlandet, der bosatte nye landsbyer i 1100-tallet f.Kr., da Merneptah første gang nævner Israel; andre forsvarer en indvandring udefra, dateret til 1400- eller 1200-tallet. Selv navnet er omstridt: Lemche hævdede, at ingen nogensinde kaldte sig selv kana’anæer, og Rainey svarede ud fra Amarna-brevene, at folket i Kana’an gjorde det."
  sr:
    - "Хананеји су били народи земље западно од Јордана пре Израела и поред њега: градски становници обале и долина који су говорили семитским језиком чији је дијалект и сам хебрејски, и клањали се Елу, Валу, Ашери и Анат. Име је старије од Библије: писмо из града Мари из осамнаестог века п. н. е. можда га већ користи, Амарнска писма из четрнаестог зову земљу Кинахи, кад је била египатска провинција, а стела Мернептаха око 1208. п. н. е. именује Ханан поред Израела. Постање чини Ханана сином Хамовим, проклетим од Ноја, и набраја његове синове од Сидона и Хета до Јевусејаца и Аморејаца, са међом „од Сидона идући на Герар па до Газе“. Тачка Ханана на карти стоји у галилејским брдима."
    - "Библија користи име у ужем и ширем смислу. Уходама „Хананеји живе на мору и на Јордану“, док Хетити, Јевусејци и Аморејци држе брда; на другим местима они су један од седам народа „већих и јачих од тебе“, које треба протерати. Јуда „не изагна оне који живљаху у долини, јер имаху гвоздена кола“; Манасија је оставио Вет-Сан, Танах, Дор, Ивлеам и Мегидо, „и Хананеји стадоше живети у тој земљи“, а о Израелу пише: „А кад ојача Израиљ, удари на Хананеје данак“."
    - "У Деворином спеву „цареви ханански у Танаху на води мегидској“; а народ „жењаху се кћерима њиховим… и служаху боговима њиховим“. Будући да су Хананеји трговали, реч је почела да значи трговца: Осијин „трговац“ на хебрејском је Хананеј, а Захаријин последњи ред, „неће више бити Хананејца у дому Господа над војскама“, чита се на оба начина. Хананеји нису ишчезли: Феничани из Тира и Сидона били су Хананеји који су остали на обали, а „жена Хананејка“ која је дошла Исусу близу Тира је Марково „Сирофиничанка“."
    - "У шта су веровали познато је из Угарита на сиријској обали, где плоче пронађене од 1929. чувају митове о Валу, Елу, Ашери и Анат из четрнаестог и тринаестог века п. н. е. Да ли је Израел дошао споља или из саме земље, спорно је. Библија прича о освајању; многи археолози од 1980-их виде прве Израелце углавном као брдске Хананеје који су настанили нова села у дванаестом веку п. н. е., када Мернептах први пут именује Израел; други бране долазак споља, датиран у петнаести или тринаести век. Чак се и о имену спори: Лемке је држао да себе нико никад није звао Хананејем, а Рејни је из Амарнских писама одговорио да јесу људи Ханана."
  hu:
    - "A kánaániak Izráel előtt és mellette a Jordántól nyugatra fekvő föld népei voltak: a part és a völgyek városlakói, akik egy sémi nyelvet beszéltek, amelynek maga a héber is nyelvjárása, és Elt, Baált, Aserát és Anatot imádták. A név régebbi a Bibliánál: a Kr. e. 18. századi egyik mari levél talán már használja, a 14. századi amarnai levelek Kinahhinak nevezik a földet, amikor egyiptomi provincia volt, és a Kr. e. 1208 körüli Merneptah-sztélé Kánaánt Izráel mellett nevezi meg. A Mózes első könyve Kánaánt Hám fiává teszi, akit Nóé megátkozott, és felsorolja fiait Szidóntól és Héttől a jebuzeusokig és emoreusokig, határral „Czídonból Gérár felé menve Gázáig”. A térkép Kánaán-pontja a galileai hegyekben áll."
    - "A Biblia szűkebb és tágabb értelemben használja a nevet. A kémek szerint „a tenger mellett, és a Jordán partján pedig Kananeus lakik”, míg „Khitteus, Jebuzeus és Emoreus lakik a hegyeken”; másutt a hét nép egyike, „náladnál nagyobbakat és erősebbeket”, akiket ki kell űzni. Júdánál „a völgy lakóit nem lehetett kiűzni, mert vas-szekereik voltak”; Manassé nem űzte el Bét-Seán, Taanak, Dór, Jibleám és Megiddó lakosait, „És a Kananeusnak tetszett ott lakni azon a földön”, Izráel pedig „adófizetőjévé tette a Kananeust”."
    - "Debóra énekében „Akkor harczoltak a Kanaán királyai Taanaknál, Megiddó vizénél”; és a nép „azok leányait vették magoknak feleségül … és szolgálák azoknak isteneit”. Mivel a kánaániak kereskedtek, a szó kereskedőt kezdett jelenteni: Hóseás kereskedője héberül kánaánita – „Kanaánita ő! Hamis mértékek vannak kezében” –, és Zakariás utolsó sorát, „nem lészen többé Kananeus a Seregek Urának házában e napon”, mindkét módon olvassák. A kánaániak nem tűntek el: a tíruszi és szidóni föníciaiak a parton maradt kánaániak voltak, és „egy kananeus asszony”, aki Tírusz közelében Jézushoz jött, Márk „síro-fenicziai” asszonya."
    - "Hitükről az északi szíriai parton fekvő Ugaritból tudunk, ahol az 1929-től talált táblák a Kr. e. 14. és 13. századból megőrzik Baál, El, Aséra és Anat mítoszait. Hogy Izráel kívülről jött-e az országba vagy belülről, vitatott. A Biblia hódításról beszél; az 1980-as évek óta sok régész az első izráelitákat többnyire hegyvidéki kánaániaknak látja, akik a Kr. e. 12. században új falvakban telepedtek meg, amikor Merneptah először nevezi meg Izráelt; mások kívülről érkezést védenek, a Kr. e. 15. vagy 13. századra keltezve. Még a név is vita tárgya: Lemche szerint senki sem nevezte magát kánaánitának, Rainey pedig az amarnai levelekből azt felelte, hogy Kánaán népe igen."
  fi:
    - "Kanaanilaiset olivat Jordanin länsipuolisen maan kansoja ennen Israelia ja sen rinnalla: rannikon ja laaksojen kaupunkilaisia, jotka puhuivat seemiläistä kieltä, jonka murre heprea itse on, ja palvoivat Elia, Baalia, Asheraa ja Anatia. Nimi on Raamattua vanhempi: Marin 1700-luvun eaa. kirje saattaa jo käyttää sitä, 1300-luvun Amarna-kirjeet kutsuvat maata nimellä Kinahhi, kun se oli Egyptin provinssi, ja Merneptahin stele noin 1208 eaa. nimeää Kanaanin Israelin rinnalla. Genesis tekee Kanaanista Hamin pojan, Nooan kiroaman, ja luettelee hänen poikansa Sidonista ja Hetistä jebusilaisiin ja amorilaisiin, rajan ollessa ”Siidonista Gerariin päin aina Gassaan asti”. Kartan piste Kanaanille on Galilean kukkuloilla."
    - "Raamattu käyttää nimeä kapeassa ja laajassa merkityksessä. Vakoojille ”kanaanilaiset asuvat meren rannalla ja Jordanin varsilla”, kun taas heettiläiset, jebusilaiset ja amorilaiset pitävät kukkuloita; muualla he ovat yksi niistä seitsemästä kansasta, jotka ovat ”sinua suuremmat ja väkevämmät”, ja heidät on karkotettava. Juuda ”ei kyennyt karkoittamaan niitä, jotka asuivat tasangolla, koska heillä oli raudoitettuja sotavaunuja”; Manasse ei saanut haltuunsa Bet-Seania, Taanakia, Dooria, Jibleamia eikä Megiddoa, ”vaan kanaanilaisten onnistui jäädä asumaan siihen maahan”, ja kun Israel voimistui, ”saattoi se kanaanilaiset työveron alaisiksi”."
    - "Deboran laulussa ”silloin taistelivat Kanaanin kuninkaat Taanakissa, Megiddon vesien varsilla”; ja israelilaiset: ”he ottivat heidän tyttäriänsä vaimoikseen… ja palvelivat heidän jumaliansa”. Koska kanaanilaiset kävivät kauppaa, sanasta tuli kauppiaan nimi: Hoosean kauppias on heprean kielessä kanaanilainen, ja Sakarjan viimeinen rivi, jonka mukaan ”Eikä ole enää sinä päivänä yhtään kaupustelijaa Herran Sebaotin temppelissä”, luetaan molemmilla tavoin. Kanaanilaiset eivät kadonneet: Tyroksen ja Sidonin foinikialaiset olivat rannikolle jääneitä kanaanilaisia, ja ”kanaanilainen vaimo”, joka tuli Jeesuksen luo Tyroksen lähellä, on Markuksen ”syyrofoinikialainen”."
    - "Heidän uskomuksensa tunnetaan Ugaritista Syyrian rannikolta, jossa vuodesta 1929 löydetyt tabletit säilyttävät Baalin, Elin, Asheran ja Anatin myytit 1300- ja 1200-luvuilta eaa. Se, tuliko Israel maan ulkopuolelta vai sen sisältä, on kiistanalaista. Raamattu kertoo valloituksesta; monet arkeologit näkevät 1980-luvulta lähtien ensimmäiset israelilaiset enimmäkseen vuoristokanaanilaisina, jotka asettuivat uusiin kyliin 1100-luvulla eaa., kun Merneptah ensimmäisen kerran nimeää Israelin; toiset puolustavat sisääntuloa ulkoa, ajoitettuna 1400- tai 1200-luvulle. Jopa nimestä kiistellään: Lemche katsoi, ettei kukaan koskaan kutsunut itseään kanaanilaiseksi, ja Rainey vastasi Amarna-kirjeiden pohjalta, että Kanaanin ihmiset tekivät niin."
  vi:
    - "Người Ca-na-an là các dân của vùng đất phía tây sông Giô-đanh trước và bên cạnh Y-sơ-ra-ên: dân thành thị ven biển và các thung lũng nói một thứ tiếng Semit mà chính tiếng Hê-bơ-rơ là một phương ngữ, và thờ El, Ba-anh, Asherah và Anat. Tên gọi cổ hơn Kinh Thánh: một bức thư từ Mari thế kỷ 18 TCN có thể đã dùng nó, Thư Amarna thế kỷ 14 gọi xứ này là Kinahhi, khi nó là một tỉnh của Ai Cập, và tấm bia của Merneptah khoảng 1208 TCN nêu Ca-na-an bên cạnh Y-sơ-ra-ên. Sách Sáng thế cho Ca-na-an là con của Cham, bị Nô-ê rủa, và liệt kê các con ông từ Si-đôn và Hếch đến người Giê-bu-sít và A-mô-rít, với một địa phận “về hướng Ghê-ra, chạy từ Si-đôn tới Ga-xa”. Điểm của Ca-na-an trên bản đồ nằm trong vùng đồi Ga-li-lê."
    - "Kinh Thánh dùng tên này theo nghĩa hẹp và nghĩa rộng. Với các thám tử, “dân Ca-na-an ở gần biển và dọc dài theo mé Giô-đanh”, còn người Hê-tít, Giê-bu-sít và A-mô-rít giữ vùng đồi; ở nơi khác, họ là một trong bảy dân tộc “lớn và mạnh hơn ngươi”, phải bị đuổi đi. về Giu-đa, “dân sự ở trũng, thì họ đuổi đi không đặng, vì chúng nó có những xe bằng sắt”; Ma-na-se để lại Bết-Sê-an, Tha-a-nác, Đô-rơ, Gíp-lê-am và Mê-ghi-đô, “vì dân Ca-na-an quyết định ở trong xứ ấy”, và Y-sơ-ra-ên “bắt dân Ca-na-an phục dịch”."
    - "Trong bài ca của Đê-bô-ra, “Các vua Ca-na-an chiến tranh Tại Tha-a-nác, tại nước Mê-ghi-đô”; và dân “cưới con gái của chúng nó làm vợ… và hầu việc các thần của chúng nó”. Vì người Ca-na-an buôn bán, từ này có nghĩa là thương nhân: “người buôn bán” của Ô-sê trong tiếng Hê-bơ-rơ là một người Ca-na-an, và câu cuối của Xa-cha-ri, “sẽ không còn có người Ca-na-an trong nhà Đức Giê-hô-va vạn quân”, được đọc theo cả hai cách. Người Ca-na-an không biến mất: người Phê-ni-xi ở Ty-rơ và Si-đôn là người Ca-na-an ở lại trên bờ biển, và “người đàn bà xứ Ca-na-an” đến với Giê-su gần Ty-rơ là người “Sy-rô-phê-ni-xi” của Mác."
    - "Điều họ tin được biết từ Ugarit trên bờ biển Syria, nơi các bảng đất sét tìm thấy từ năm 1929 lưu giữ các thần thoại về Ba-anh, El, Asherah và Anat thuộc thế kỷ 14 và 13 TCN. Y-sơ-ra-ên đến từ bên ngoài xứ hay từ bên trong thì còn tranh luận. Kinh Thánh kể về một cuộc chinh phục; nhiều nhà khảo cổ từ thập niên 1980 coi những người Y-sơ-ra-ên đầu tiên phần lớn là người Ca-na-an vùng đồi lập những làng mới vào thế kỷ 12 TCN, khi Merneptah lần đầu nêu tên Y-sơ-ra-ên; người khác bênh vực một cuộc tiến vào từ bên ngoài, vào thế kỷ 15 hoặc 13. Ngay cả tên gọi cũng bị tranh cãi: Lemche cho rằng chưa ai từng tự gọi mình là người Ca-na-an, và Rainey đáp từ Thư Amarna rằng dân Ca-na-an đã làm vậy."
  ro:
    - "Canaaniții erau popoarele țării de la vest de Iordan dinaintea lui Israel și alături de el: orășeni ai coastei și ai văilor care vorbeau o limbă semitică din care însăși ebraica este un dialect și se închinau lui El, Baal, Așera și Anat. Numele este mai vechi decât Biblia: o scrisoare de la Mari din secolul al XVIII-lea î.Hr. l-ar putea folosi deja, scrisorile de la Amarna din secolul al XIV-lea numesc țara Kinahhi, când era o provincie egipteană, iar stela lui Merneptah din jurul anului 1208 î.Hr. numește Canaanul alături de Israel. Geneza face din Canaan un fiu al lui Ham, blestemat de Noe, și îi enumeră fiii, de la Sidon și Het până la iebusiți și amoriți, cu un hotar „dela Sidon până la Gherara și Gaza”. Punctul Canaanului de pe hartă se află în dealurile Galileii."
    - "Biblia folosește numele într-un sens îngust și unul larg. Pentru iscoade, „Hananeul lăcuește lângă mare și lângă rîul Iordanului”, în timp ce hitiții, iebusiții și amoriții stăpânesc dealurile; în alte locuri ei sunt unul dintre cele șapte neamuri „mari și multe și mai tari decât voi”, care trebuie izgonite. Iuda nu a putut izgoni locuitorii văii, pentru că aveau care de fier; Manase a lăsat Bet-Șan, Taanac, Dor, Ibleam și Meghido, iar canaaniții au stăruit să locuiască în ținutul acela, iar Israel i-a pus pe canaaniți la tribut."
    - "În cântarea Deborei, regii Canaanului s-au luptat la Taanac, lângă apele Meghidoului; iar poporul „au luat de femei pre fetele lor … și au slujit dumnezeilor lor”. Fiindcă canaaniții făceau comerț, cuvântul a ajuns să însemne negustor: negustorul din Osea este în ebraică un canaanit, iar ultimul rând din Zaharia, „nu va mai fi Hananeu în casa Domnului”, este citit în ambele feluri. Canaaniții nu au dispărut: fenicienii din Tir și Sidon erau canaaniți rămași pe coastă, iar femeia canaanită („o muiere Hananiancă”) care a venit la Isus lângă Tir este, la Marcu, femeia „elină, de neam din Finichia Siriei”."
    - "Ce credeau ei se știe de la Ugarit, pe coasta Siriei, unde tăblițele găsite din 1929 păstrează miturile lui Baal, El, Așera și Anat din secolele al XIV-lea și al XIII-lea î.Hr. Dacă Israel a venit din afara țării sau dinăuntrul ei este disputat. Biblia povestește o cucerire; mulți arheologi de prin anii 1980 văd în primii israeliți mai ales canaaniți din dealuri care au întemeiat sate noi în secolul al XII-lea î.Hr., când Merneptah numește pentru prima dată Israelul; alții apără o intrare din afară, datată în secolul al XV-lea sau al XIII-lea. Până și numele este disputat: Lemche a susținut că nimeni nu s-a numit vreodată canaanit, iar Rainey a răspuns din scrisorile de la Amarna că oamenii din Canaan o făceau."
  bg:
    - "Ханаанците бяха народите на земята западно от Йордан преди Израил и наред с него: жители на градовете по брега и в долините, които говореха семитски език, чийто диалект е и самият еврейски, и почитаха Ел, Ваал, Ашера и Анат. Името е по-старо от Библията: едно писмо от Мари от XVIII в. пр.н.е. може би вече го употребява, писмата от Амарна от XIV в. наричат земята Кинаххи, когато тя беше египетска провинция, а стелата на Мернептах от около 1208 г. пр.н.е. назовава Ханаан наред с Израил. Битие прави Ханаан син на Хам, проклет от Ной, и изброява синовете му от Сидон и Хет до йевусейците и аморейците, с граница „от Сидон като отхожда някой на Герар до Газа“. Точката на картата за Ханаан стои в хълмовете на Галилея."
    - "Библията употребява името в тесен и в широк смисъл. За съгледвачите „Ханаанците живеят при морето и при бреговете на Йордан“, докато хетейци, йевусейци и аморейци държат планините; другаде те са един от седемте народа, „по-големи и по-силни от тебе“, които трябва да бъдат изгонени. Юда „не можа да изгони жителите на дола, защото имаха железни колесници“; Манасия остави Бет-Сан, Танах, Дор, Ивлеам и Мегидо, „но Ханаанците упорствуваха да живеят в оназ земя“, а израилтяните „туриха Ханаанците под данък“."
    - "В песента на Девора „Тогаз ратуваха Ханаанските царе В Таанах близу при водите на Магедон“; а народът „взеха за себе си дъщерите им за жени… и служиха на боговете им“. Понеже ханаанците търгуваха, думата започна да означава търговец: „търговец“ при Осия на еврейски е „ханаанец“, а последният ред на Захария — „не ще има вече Ханаанец В дома на Господа Саваота“ — се чете и по двата начина. Ханаанците не изчезнаха: финикийците от Тир и Сидон бяха ханаанци, останали на брега, а „жена Хананейка“, която дойде при Исус край Тир, при Марко е „Сирофиникианка“."
    - "Какво са вярвали, се знае от Угарит на сирийското крайбрежие, където плочки, намирани от 1929 г., пазят митовете за Ваал, Ел, Ашера и Анат от XIV и XIII в. пр.н.е. Дали Израил е дошъл отвън, или е израснал в самата земя, е спорно. Библията разказва за завладяване; много археолози от 80-те години на XX в. виждат в първите израилтяни предимно ханаанци от планинската страна, основали нови села през XII в. пр.н.е., когато Мернептах за първи път назовава Израил; други защитават идване отвън, датирано в XV или XIII в. Спори се дори за името: Лемхе твърдеше, че никой никога не се е наричал ханаанец, а Рейни отговори с писмата от Амарна, че жителите на Ханаан са се наричали така."
