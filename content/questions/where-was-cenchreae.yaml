id: where-was-cenchreae
question:
  en: "Where was Cenchreae, the church of Phoebe?"
  ru: "Где находились Кенхреи, церковь Фивы?"
  uk: "Де були Кенхреї, церква Фиви?"
  es: "¿Dónde estaba Cencreas, la iglesia de Febe?"
  pt: "Onde ficava Cencreia, a igreja de Febe?"
  de: "Wo lag Kenchreä, die Gemeinde der Phöbe?"
  fr: "Où se trouvait Cenchrées, l’Église de Phœbé ?"
  pl: "Gdzie leżała Kenchrea, Kościół Febe?"
  it: "Dov’era Cencre, la chiesa di Febe?"
  nl: "Waar lag Kenchreeën, de gemeente van Febe?"
  cs: "Kde byly Kenchreje, církev Foibé?"
  sv: "Var låg Kenchreai, Foibes församling?"
  nb: "Hvor lå Kenkreae, Føbes menighet?"
  tl: "Saan ang Cencrea, ang iglesia ni Febe?"
  da: "Hvor lå Kenkreæ, Føbes menighed?"
  sr: "Где је била Кенхреја, црква Фиве?"
answer:
  en:
    - "Cenchreae was the eastern harbour of Corinth, on the Saronic Gulf at today's village of Kechries in Greece; the map point stands on the bay. It lay about 11 km east of Corinth in a straight line (Strabo gives seventy stadia from the city) and served the trade with Asia, while Lechaeum on the Gulf of Corinth served the trade with Italy. Ephesus, where Paul sailed from here, is about 380 km across the Aegean."
    - "Paul left Greece from Cenchreae about AD 52, at the end of his second journey, sailing for Syria with Priscilla and Aquila, “having shorn his head in Cenchrea: for he had a vow”; the vow is usually taken as Paul's, though the Greek could refer to Aquila. A few years later, probably writing from Corinth, he commended to the Romans “Phebe our sister, which is a servant of the church which is at Cenchrea”, asking them to help her, “for she hath been a succourer of many, and of myself also”. The Greek word is diakonos; whether it names an office, deacon, or a service is disputed. She is usually taken to have carried the letter to Rome, about 1,000 km away in a straight line."
    - "The port flourished after Corinth was refounded as a Roman colony in 44 BC; Pausanias saw a temple of Aphrodite and sanctuaries of Asclepius and Isis. American excavations in the 1960s found warehouses, fish tanks and, in the sunken southern part of the harbour, crates of panels of coloured glass, still packed, that went down in an earthquake of the later fourth century AD. The moles and part of the harbour now lie in shallow water by the shore, and a Christian basilica was later built at its southern end."
  ru:
    - "Кенхреи — восточная гавань Коринфа на Сароническом заливе, там, где сегодня стоит греческая деревня Кехриес; точка карты стоит у бухты. Гавань лежала примерно в 11 км к востоку от Коринфа по прямой (Страбон называет семьдесят стадий от города) и обслуживала торговлю с Асией, а Лехей на Коринфском заливе — торговлю с Италией. До Ефеса, куда Павел отплыл отсюда, — около 380 км через Эгейское море."
    - "Павел покинул Грецию из Кенхрей около 52 г., в конце второго путешествия, отплыв в Сирию с Акилой и Прискиллой, «остригши голову в Кенхреях, по обету»; обет обычно считают Павловым, хотя по-гречески его можно отнести и к Акиле. Несколько лет спустя, вероятно из Коринфа, он писал римлянам: «Представляю вам Фиву, сестру нашу, диакониссу церкви Кенхрейской», — и просил помочь ей, «ибо и она была помощницею многим и мне самому». Греческое слово — диакон; означает ли оно должность или просто служение, спорят, и Синодальный перевод передаёт его как «диакониссу», а Библия короля Якова — как «служительницу». Обычно считают, что Фива и доставила послание в Рим — примерно за 1000 км по прямой."
    - "Гавань процветала после того, как в 44 г. до н. э. Коринф был заново основан как римская колония; Павсаний видел здесь храм Афродиты и святилища Асклепия и Исиды. Американские раскопки 1960-х годов открыли склады, садки для рыбы, а в ушедшей под воду южной части гавани — ящики с панно из цветного стекла, ещё упакованные, которые затонули при землетрясении во второй половине IV века н. э. Молы и часть гавани лежат теперь на мелководье у берега, а у её южного конца позже построили христианскую базилику."
  uk:
    - "Кенхреї були східною гаванню Коринта, на Сароніській затоці, біля нинішнього села Кехріес у Греції; точка мапи стоїть на бухті. Вони лежали приблизно за 11 км на схід від Коринта по прямій (Страбон дає сімдесят стадій від міста) і обслуговували торгівлю з Азією, тоді як Лехей на Коринфській затоці обслуговував торгівлю з Італією. Ефес, куди звідси відплив Павло, лежить приблизно за 380 км через Егейське море."
    - "Павло залишив Грецію з Кенхреїв близько 52 р. н. е., наприкінці своєї другої подорожі, відпливши до Сирії з Прискиллою й Акилою, «остригши голову в Кинхреях; бо зробив був обітницю»; обітницю зазвичай вважають Павловою, хоча грецьке слово могло б стосуватися Акили. Кілька років потому, імовірно пишучи з Коринта, він рекомендував римлянам «Фиву, сестру нашу, служительку церкви, що в Кенхреях», просячи допомогти їй, «бо вона була заступницею многим, і самому менї». Грецьке слово — діаконос; чи воно називає уряд, диякона, чи служіння, спірно. Її зазвичай вважають тією, що віднесла послання до Рима, приблизно за 1000 км по прямій."
    - "Порт розквітнув після того, як Коринт було заново засновано як римську колонію 44 р. до н. е.; Павсаній бачив храм Афродіти та святилища Асклепія й Ісіди. Американські розкопки 1960-х рр. знайшли склади, рибні басейни і, в затопленій південній частині гавані, ящики з панелями кольорового скла, ще запаковані, що пішли на дно під час землетрусу пізнього IV ст. н. е. Молі й частина гавані нині лежать на мілкій воді біля берега, а християнську базиліку було згодом збудовано на її південному кінці."
  es:
    - "Cencreas era el puerto oriental de Corinto, en el golfo Sarónico, en la actual aldea de Kechries, en Grecia; el punto del mapa está en la bahía. Quedaba a unos 11 km al este de Corinto en línea recta (Estrabón da setenta estadios desde la ciudad) y servía al comercio con Asia, mientras que Lequeo, en el golfo de Corinto, servía al comercio con Italia. Éfeso, adonde zarpó Pablo desde aquí, queda a unos 380 km a través del Egeo."
    - "Pablo salió de Grecia desde Cencreas hacia el 52 d. C., al final de su segundo viaje, navegando hacia Siria con Priscila y Aquila, «habiéndose trasquilado la cabeza en Cencreas, porque tenía voto»; el voto suele tomarse por el de Pablo, aunque el griego podría referirse a Aquila. Unos años después, probablemente escribiendo desde Corinto, recomendó a los romanos a «Febe nuestra hermana, la cual es diaconisa de la iglesia que está en Cencreas», pidiéndoles que la ayudaran, «porque ella ha ayudado á muchos, y á mí mismo». La palabra griega es diakonos; si nombra un cargo, el de diácono, o un servicio es discutido. Suele pensarse que llevó la carta a Roma, a unos 1000 km en línea recta."
    - "El puerto floreció después de que Corinto fuera refundada como colonia romana en el 44 a. C.; Pausanias vio un templo de Afrodita y santuarios de Asclepio e Isis. Las excavaciones estadounidenses de los años 1960 hallaron almacenes, estanques de peces y, en la parte sur hundida del puerto, cajas de paneles de vidrio de colores, aún embalados, que se hundieron en un terremoto de finales del siglo IV d. C. Los muelles y parte del puerto yacen hoy en aguas poco profundas junto a la orilla, y más tarde se construyó una basílica cristiana en su extremo sur."
  pt:
    - "Cencreia era o porto oriental de Corinto, no golfo Sarônico, na atual aldeia de Kechries, na Grécia; o ponto do mapa está na baía. Ficava a cerca de 11 km a leste de Corinto em linha reta (Estrabão dá setenta estádios desde a cidade) e servia ao comércio com a Ásia, enquanto Lecaion, no golfo de Corinto, servia ao comércio com a Itália. Éfeso, para onde Paulo navegou daqui, fica a cerca de 380 km através do Egeu."
    - "Paulo deixou a Grécia por Cencreia por volta de 52 d.C., ao fim de sua segunda viagem, navegando para a Síria com Priscila e Áquila: “Ele raspou a cabeça em Cencreia, pois tinha feito um voto.” O voto costuma ser tomado como de Paulo, embora o grego possa referir-se a Áquila. Alguns anos depois, provavelmente escrevendo de Corinto, recomendou aos romanos “Febe, nossa irmã, que é serva da igreja que está em Cencreia”, pedindo que a ajudassem, “pois ela própria tem ajudado muitos, inclusive a mim”. A palavra grega é diakonos; se nomeia um ofício, o de diácono, ou um serviço é disputado. Costuma-se supor que ela levou a carta a Roma, a cerca de 1.000 km em linha reta."
    - "O porto floresceu depois que Corinto foi refundada como colônia romana em 44 a.C.; Pausânias viu ali um templo de Afrodite e santuários de Asclépio e Ísis. Escavações americanas nos anos 1960 acharam armazéns, tanques de peixe e, na parte sul afundada do porto, caixas de painéis de vidro colorido, ainda embalados, que afundaram num terremoto do fim do século IV d.C. Os molhes e parte do porto jazem hoje em águas rasas junto à margem, e uma basílica cristã foi depois construída em sua ponta sul."
  de:
    - "Kenchreä war der östliche Hafen von Korinth am Saronischen Golf beim heutigen Dorf Kechries in Griechenland; der Kartenpunkt liegt an der Bucht. Es lag in der Luftlinie etwa 11 km östlich von Korinth (Strabon gibt siebzig Stadien von der Stadt an) und bediente den Handel mit Asien, während Lechaion am Golf von Korinth den Handel mit Italien bediente. Ephesus, wohin Paulus von hier segelte, ist etwa 380 km über die Ägäis entfernt."
    - "Paulus verließ Griechenland von Kenchreä aus um 52 n. Chr., am Ende seiner zweiten Reise, und segelte mit Priscilla und Aquila nach Syrien: „Und er schor sein Haupt zu Kenchreä, denn er hatte ein Gelübde“; das Gelübde gilt meist als das des Paulus, obwohl sich das Griechische auch auf Aquila beziehen könnte. Einige Jahre später, wohl von Korinth aus schreibend, empfahl er den Römern „unsere Schwester Phöbe, welche ist im Dienste der Gemeinde zu Kenchreä“ und bat sie um Hilfe, „denn sie hat auch vielen Beistand getan, auch mir selbst“. Das griechische Wort ist diakonos; ob es ein Amt, Diakon, oder einen Dienst bezeichnet, ist umstritten. Man nimmt an, dass sie den Brief nach Rom brachte, in der Luftlinie rund 1000 km entfernt."
    - "Der Hafen blühte auf, nachdem Korinth 44 v. Chr. als römische Kolonie neu gegründet worden war; Pausanias sah einen Tempel der Aphrodite und Heiligtümer des Asklepios und der Isis. Amerikanische Ausgrabungen in den 1960er Jahren fanden Lagerhäuser, Fischbecken und im versunkenen Südteil des Hafens noch verpackte Kisten mit Tafeln aus farbigem Glas, die bei einem Erdbeben im späteren 4. Jahrhundert n. Chr. untergingen. Die Molen und ein Teil des Hafens liegen heute im flachen Wasser am Ufer, und an seinem Südende wurde später eine christliche Basilika gebaut."
  fr:
    - "Cenchrées était le port oriental de Corinthe, sur le golfe Saronique, à l’actuel village de Kechries, en Grèce ; le point de la carte est sur la baie. Elle se trouvait à environ 11 km à l’est de Corinthe en ligne droite (Strabon donne soixante-dix stades depuis la ville) et servait au commerce avec l’Asie, tandis que Léchaion, sur le golfe de Corinthe, servait au commerce avec l’Italie. Éphèse, vers où Paul fit voile d’ici, est à environ 380 km de l’autre côté de la mer Égée."
    - "Paul quitta la Grèce par Cenchrées vers 52 apr. J.-C., à la fin de son deuxième voyage, s’embarquant pour la Syrie avec Priscille et Aquilas, « après s’être fait raser la tête à Cenchrées, car il avait fait un vœu » ; on attribue d’ordinaire le vœu à Paul, bien que le grec puisse viser Aquilas. Quelques années plus tard, écrivant probablement de Corinthe, il recommanda aux Romains « Phœbé, notre sœur, qui est diaconesse de l’Église de Cenchrées », leur demandant de l’aider, « car elle a donné aide à plusieurs et à moi-même ». Le mot grec est diakonos ; s’il désigne une charge, celle de diacre, ou un service est discuté. On pense d’ordinaire qu’elle porta la lettre à Rome, à environ 1 000 km en ligne droite."
    - "Le port prospéra après la refondation de Corinthe en colonie romaine en 44 av. J.-C. ; Pausanias y vit un temple d’Aphrodite et des sanctuaires d’Asclépios et d’Isis. Des fouilles américaines des années 1960 y trouvèrent des entrepôts, des viviers et, dans la partie sud engloutie du port, des caisses de panneaux de verre coloré, encore emballés, qui sombrèrent lors d’un séisme de la fin du IVe siècle apr. J.-C. Les môles et une partie du port gisent aujourd’hui en eau peu profonde près du rivage, et une basilique chrétienne fut bâtie plus tard à son extrémité sud."
  pl:
    - "Kenchrea była wschodnim portem Koryntu, na Zatoce Sarońskiej, w dzisiejszej wsi Kechries w Grecji; punkt na mapie stoi nad zatoką. Leżała około 11 km na wschód od Koryntu w linii prostej (Strabon podaje siedemdziesiąt stadiów od miasta) i obsługiwała handel z Azją, podczas gdy Lechajon w Zatoce Korynckiej obsługiwał handel z Italią. Efez, dokąd stąd odpłynął Paweł, jest około 380 km przez Morze Egejskie."
    - "Paweł opuścił Grecję z Kenchrei około 52 n.e., pod koniec drugiej podróży, płynąc do Syrii z Pryscyllą i Akwilą, „ogoliwszy głowę w Kienchreach: bo był uczynił ślub”; zwykle uważa się, że ślub był Pawła, choć greckie sformułowanie może odnosić się do Akwili. Kilka lat później, prawdopodobnie pisząc z Koryntu, polecił Rzymianom „Febę, siostrę naszę, która jest służebnicą zboru Kienchreeńskiego”, prosząc, by jej pomogli, „albowiem i ona wielom gospody użyczała, aż i mnie samemu”. Greckie słowo to diakonos; czy oznacza urząd, diakona, czy służbę, jest sporne. Zwykle uważa się, że zaniosła list do Rzymu, około 1000 km w linii prostej."
    - "Port kwitł po ponownym założeniu Koryntu jako rzymskiej kolonii w 44 p.n.e.; Pauzaniasz widział tam świątynię Afrodyty oraz sanktuaria Asklepiosa i Izydy. Amerykańskie wykopaliska w latach 60. odkryły magazyny, zbiorniki na ryby i, w zatopionej południowej części portu, skrzynie z panelami z kolorowego szkła, wciąż zapakowane, które poszły na dno w trzęsieniu ziemi późnego IV wieku n.e. Mola i część portu leżą dziś w płytkiej wodzie przy brzegu, a chrześcijańską bazylikę zbudowano później na jego południowym krańcu."
  it:
    - "Cencre era il porto orientale di Corinto, sul golfo Saronico presso l’odierno villaggio di Kechries in Grecia; il punto della mappa sta sulla baia. Distava circa 11 km a est di Corinto in linea retta (Strabone dà settanta stadi dalla città) e serviva il commercio con l’Asia, mentre Lecheo sul golfo di Corinto serviva quello con l’Italia. Efeso, dove Paolo salpò da qui, dista circa 380 km attraverso l’Egeo."
    - "Paolo lasciò la Grecia da Cencre verso il 52 d.C., alla fine del secondo viaggio, salpando per la Siria con Priscilla e Aquila, «dopo essersi fatto tosare il capo a Cencrea, perché avea fatto un voto»; il voto è di solito inteso come di Paolo, benché il greco possa riferirsi ad Aquila. Pochi anni dopo, probabilmente scrivendo da Corinto, raccomandò ai Romani «Febe, nostra sorella, che è diaconessa della chiesa di Cencrea», chiedendo di assisterla, «poiché ella pure ha prestato assistenza a molti e anche a me stesso». La parola greca è diakonos; se designi un ufficio, quello di diacono, o un servizio è discusso. Di solito si ritiene che abbia portato la lettera a Roma, a circa 1.000 km in linea retta."
    - "Il porto fiorì dopo che Corinto fu rifondata come colonia romana nel 44 a.C.; Pausania vide un tempio di Afrodite e santuari di Asclepio e di Iside. Scavi americani degli anni 1960 trovarono magazzini, vasche per il pesce e, nella parte meridionale sommersa del porto, casse di pannelli di vetro colorato, ancora imballate, andate a fondo in un terremoto della seconda metà del IV secolo d.C. I moli e parte del porto giacciono ora in acque basse presso la riva, e una basilica cristiana fu poi costruita alla sua estremità meridionale."
  nl:
    - "Kenchreeën was de oosthaven van Korinthe, aan de Saronische Golf bij het huidige dorp Kechries in Griekenland; het punt op de kaart staat aan de baai. Het lag hemelsbreed ongeveer 11 km ten oosten van Korinthe (Strabo geeft zeventig stadiën vanaf de stad) en diende de handel met Asia, terwijl Lechaion aan de Golf van Korinthe de handel met Italië diende. Efeze, waarheen Paulus vanhier voer, ligt ongeveer 380 km over de Egeïsche Zee."
    - "Paulus verliet Griekenland vanuit Kenchreeën omstreeks 52 n.Chr., aan het eind van zijn tweede reis, op weg naar Syrië met Priscilla en Aquila, “zijn hoofd te Kenchreen geschoren hebbende; want hij had een gelofte gedaan”; de gelofte wordt gewoonlijk als die van Paulus opgevat, al kan het Grieks op Aquila slaan. Enkele jaren later, waarschijnlijk schrijvend uit Korinthe, beval hij de Romeinen aan “Febe, onze zuster, die een dienares is der Gemeente, die te Kenchreen is”, met het verzoek haar bij te staan, “want zij is een voorstandster geweest van velen, ook van mijzelven”. Het Griekse woord is diakonos; of het een ambt, diaken, of een dienst aanduidt, is omstreden. Men neemt gewoonlijk aan dat zij de brief naar Rome bracht, hemelsbreed ongeveer 1.000 km ver."
    - "De haven bloeide nadat Korinthe in 44 v.Chr. als Romeinse kolonie was herbouwd; Pausanias zag een tempel van Aphrodite en heiligdommen van Asklepios en Isis. Amerikaanse opgravingen in de jaren 1960 vonden pakhuizen, visbakken en, in het verzonken zuidelijke deel van de haven, kisten met panelen van gekleurd glas, nog ingepakt, die ondergingen in een aardbeving in de latere vierde eeuw n.Chr. De pieren en een deel van de haven liggen nu in ondiep water bij de kust, en aan het zuidelijke einde werd later een christelijke basiliek gebouwd."
  cs:
    - "Kenchreje byly východním přístavem Korintu, na Sarónském zálivu u dnešní vesnice Kechries v Řecku; bod na mapě stojí v zátoce. Ležely asi 11 km východně od Korintu vzdušnou čarou (Strabón udává sedmdesát stadií od města) a sloužily obchodu s Asií, zatímco Lechaion v Korintském zálivu sloužilo obchodu s Itálií. Efez, kam odtud Pavel plul, je asi 380 km přes Egejské moře."
    - "Pavel odplul z Řecka z Kenchrejí asi roku 52 n. l., na konci své druhé cesty, do Sýrie s Priscillou a Akvilou, „oholiv hlavu v Cenchreis; nebo byl učinil slib“; slib se obvykle připisuje Pavlovi, ač řečtina může odkazovat na Akvilu. O několik let později, nejspíše psaje z Korintu, doporučil Římanům „Fében, sestru naši, služebnici církve Cenchrenské“ a žádal je, aby jí pomohli, „nebo i ona mnohým hostem ochotně posluhovala, až i mně také“. Řecké slovo je diakonos; zda označuje úřad, jáhenku, nebo službu, je sporné. Obvykle se soudí, že odnesla list do Říma, asi 1 000 km vzdušnou čarou."
    - "Přístav vzkvétal po obnovení Korintu jako římské kolonie roku 44 př. n. l.; Pausaniás viděl chrám Afrodity a svatyně Asklépia a Isidy. Americké vykopávky v 60. letech našly sklady, nádrže na ryby a v potopené jižní části přístavu bedny s tabulemi barevného skla, dosud zabalené, které se potopily při zemětřesení pozdního 4. století n. l. Hráze a část přístavu dnes leží v mělké vodě u břehu a na jeho jižním konci byla později postavena křesťanská bazilika."
  sv:
    - "Kenchreai var Korinths östra hamn, vid Saroniska viken i dagens by Kechries i Grekland; kartpunkten står vid viken. Den låg omkring 11 km öster om Korinth fågelvägen (Strabon anger sjuttio stadier från staden) och tjänade handeln med Asien, medan Lechaion vid Korinthiska viken tjänade handeln med Italien. Efesos, dit Paulus seglade härifrån, ligger omkring 380 km tvärs över Egeiska havet."
    - "Paulus lämnade Grekland från Kenchreai omkring 52 e.Kr., i slutet av sin andra resa, och seglade till Syrien med Priscilla och Aquila, ”sedan han i Kenkrea hade låtit raka sitt huvud; han hade nämligen bundit sig genom ett löfte”; löftet anses vanligen vara Paulus, fastän grekiskan kan syfta på Aquila. Några år senare, sannolikt skrivande från Korinth, anbefallde han åt romarna ”vår syster Febe, som är församlingstjänarinna i Kenkrea”, och bad dem bistå henne, ”ty hon har själv varit ett stöd för många och jämväl för mig”. Det grekiska ordet är diakonos; om det anger ett ämbete, diakon, eller en tjänst är omstritt. Hon anses vanligen ha burit brevet till Rom, omkring 1 000 km bort fågelvägen."
    - "Hamnen blomstrade efter att Korinth återgrundats som romersk koloni 44 f.Kr.; Pausanias såg ett tempel för Afrodite och helgedomar för Asklepios och Isis. Amerikanska utgrävningar på 1960-talet fann magasin, fiskbassänger och, i den sjunkna södra delen av hamnen, lådor med paneler av färgat glas, fortfarande packade, som gick under i en jordbävning under senare delen av 300-talet e.Kr. Pirarna och en del av hamnen ligger nu på grunt vatten vid stranden, och en kristen basilika byggdes senare vid dess södra ände."
  nb:
    - "Kenkreae var Korints østlige havn, ved Saronbukta ved dagens landsby Kechries i Hellas; kartpunktet står på bukta. Den lå omtrent 11 km øst for Korint i luftlinje (Strabon oppgir sytti stadier fra byen) og betjente handelen med Asia, mens Lechaion ved Korintbukta betjente handelen med Italia. Efesos, dit Paulus seilte herfra, ligger omtrent 380 km tvers over Egeerhavet."
    - "Paulus forlot Hellas fra Kenkreae omkring 52 e.Kr., ved slutten av sin andre reise, og seilte til Syria med Priskilla og Akvilas, «efterat han i Kenkreæ hadde klippet sitt hår; for han hadde et løfte på sig»; løftet regnes vanligvis som Paulus', selv om det greske kunne vise til Akvilas. Noen år senere, trolig skrivende fra Korint, anbefalte han for romerne «Føbe, vår søster, som er menighets-tjenerinne i Kenkreæ», og ba dem hjelpe henne, «for hun har også gått mange til hånde, ja mig selv». Det greske ordet er diakonos; om det betegner et embete, diakon, eller en tjeneste, er omstridt. Hun antas vanligvis å ha båret brevet til Roma, omtrent 1 000 km unna i luftlinje."
    - "Havnen blomstret etter at Korint ble gjenopprettet som romersk koloni i 44 f.Kr.; Pausanias så et tempel for Afrodite og helligdommer for Asklepios og Isis. Amerikanske utgravinger på 1960-tallet fant lagerhus, fiskekar og, i den nedsunkne sørlige delen av havnen, kasser med paneler av farget glass, fortsatt pakket, som gikk under i et jordskjelv seint på 300-tallet e.Kr. Moloene og en del av havnen ligger nå på grunt vann ved kysten, og en kristen basilika ble senere bygget i dens sørlige ende."
  tl:
    - "Ang Cencrea ay ang silangang daungan ng Corinto, sa Golpo ng Saronic sa nayon ng Kechries sa Grecia ngayon; ang tuldok sa mapa ay nasa look. Ito ay mga 11 km sa silangan ng Corinto sa tuwid na guhit (pitumpung estadio mula sa lungsod ayon kay Estrabon) at naglingkod sa kalakalan sa Asia, samantalang ang Lechaeum sa Golpo ng Corinto ay naglingkod sa kalakalan sa Italia. Ang Efeso, kung saan naglayag si Pablo mula rito, ay mga 380 km sa kabila ng Aegeo."
    - "Umalis si Pablo sa Grecia mula sa Cencrea mga 52 AD, sa dulo ng ikalawang paglalakbay, na naglalayag patungong Siria kasama sina Priscila at Aquila, “inahit niya ang kaniyang buhok sa Cencrea; sapagka't siya'y may panata”; karaniwang kinukuha na kay Pablo ang panata, bagaman maaaring tumukoy ang Griyego kay Aquila. Pagkaraan ng ilang taon, marahil sumusulat mula sa Corinto, ipinagtagubilin niya sa mga taga-Roma si “Febe na ating kapatid na babae, na lingkod sa iglesia na nasa Cencrea”, na hinihiling na tulungan siya, “sapagka't siya nama'y naging katulong ng marami, at ng aking sarili naman”. Ang salitang Griyego ay diakonos; pinagtatalunan kung pinangangalanan nito ang katungkulan, diyakono, o isang paglilingkod. Karaniwang inaakalang dinala niya ang liham sa Roma, mga 1,000 km ang layo sa tuwid na guhit."
    - "Umunlad ang daungan pagkatapos muling itatag ang Corinto bilang kolonyang Romano noong 44 BK; nakita ni Pausanias ang templo ni Aphrodite at mga santuwaryo ni Asclepius at Isis. Natagpuan ng mga paghuhukay na Amerikano noong dekada 1960 ang mga bodega, tangke ng isda at, sa lumubog na timog na bahagi ng daungan, mga kahon ng panel na kulay na salamin, nakabalot pa, na lumubog sa lindol noong huling ikaapat na siglo AD. Nasa mababaw na tubig sa tabi ng baybayin ang mga mole at bahagi ng daungan ngayon, at kalaunan ay isang basilikang Kristiyano ang itinayo sa katimugang dulo nito."
  da:
    - "Kenkreæ var Korinths østhavn, ved Saroniske Bugt ved nutidens landsby Kechries i Grækenland; kortets punkt står på bugten. Den lå omkring 11 km øst for Korinth i luftlinje (Strabon angiver halvfjerds stadier fra byen) og tjente handelen med Asien, mens Lechaeum ved Korinthbugten tjente handelen med Italien. Efesos, hvortil Paulus sejlede herfra, er omkring 380 km over Ægæerhavet."
    - "Paulus forlod Grækenland fra Kenkreæ omkring 52 e.Kr., ved slutningen af sin anden rejse, og sejlede til Syrien med Priskilla og Akvila, »efter at han havde ladet sit Haar klippe af i Kenkreæ; thi han havde et Løfte paa sig«; løftet tages sædvanligvis for Paulus', selv om den græske tekst kunne henvise til Akvila. Nogle år senere, sandsynligvis skrivende fra Korinth, anbefalede han til romerne »Føbe, vor Søster, som er Tjenerinde ved Menigheden i Kenkreæ«, og bad dem hjælpe hende, »thi ogsaa hun har været en Hjælperske for mange og for mig selv med«. Det græske ord er diakonos; om det betegner et embede, diakon, eller en tjeneste, er omstridt. Hun tages sædvanligvis for at have båret brevet til Rom, omkring 1.000 km væk i luftlinje."
    - "Havnen blomstrede, efter at Korinth i 44 f.Kr. blev genstiftet som romersk koloni; Pausanias så et Afrodite-tempel og helligdomme for Asklepios og Isis. Amerikanske udgravninger i 1960'erne fandt lagerbygninger, fiskebassiner og, i den sunkne sydlige del af havnen, kasser med paneler af farvet glas, stadig pakket, der gik under i et jordskælv i den senere del af 300-tallet e.Kr. Moleerne og en del af havnen ligger nu på lavt vand ved kysten, og en kristen basilika blev senere bygget i dens sydende."
  sr:
    - "Кенхреја је била источна лука Коринта, на Саронском заливу код данашњег села Кехрије у Грчкој; тачка на карти стоји на заливу. Лежала је око 11 км источно од Коринта правом линијом (Страбон даје седамдесет стадија од града) и служила је трговини с Азијом, док је Лехеј на Коринтском заливу служио трговини с Италијом. Ефес, куда је Павле одавде запловио, удаљен је око 380 км преко Егеја."
    - "Павле је напустио Грчку из Кенхреје око 52. н. е., на крају свог другог путовања, пловећи за Сирију с Прискилом и Акилом, па је „остриже главу у Кенхреји, јер се беше заветовао“; завет се обично приписује Павлу, мада би се грчки могао односити на Акилу. Неколико година касније, вероватно пишући из Коринта, препоручио је Римљанима „Фиву сестру нашу, која је слушкиња код цркве у Кенхреји“, тражећи да јој помогну, „јер је она многима помогла, и самоме мени“. Грчка реч је дијаконос; да ли означава службу, ђакона, или услугу, спорно је. Обично се узима да је она однела посланицу у Рим, удаљен око 1.000 км правом линијом."
    - "Пристаниште је процветало пошто је Коринт 44. п. н. е. обновљен као римска колонија; Паусанија је видео храм Афродите и светилишта Асклепија и Изиде. Америчка ископавања 1960-их нашла су складишта, рибњаке и, у потопљеном јужном делу луке, сандуке плоча од обојеног стакла, још увек упаковане, које су потонуле у земљотресу касног 4. века н. е. Молови и део луке сада леже у плиткој води уз обалу, а на њеном јужном крају касније је саграђена хришћанска базилика."
