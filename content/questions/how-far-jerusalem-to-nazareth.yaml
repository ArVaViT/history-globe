id: how-far-jerusalem-to-nazareth
question:
  en: "How far is Nazareth from Jerusalem?"
  ru: "Как далеко от Иерусалима до Назарета?"
  uk: "Як далеко Назарет від Єрусалиму?"
  es: "¿A qué distancia está Nazaret de Jerusalén?"
  pt: "Qual é a distância de Nazaré a Jerusalém?"
  de: "Wie weit ist Nazareth von Jerusalem entfernt?"
  fr: "Quelle distance y a-t-il de Nazareth à Jérusalem ?"
  pl: "Jak daleko od Jerozolimy leży Nazaret?"
  it: "Quanto dista Nazaret da Gerusalemme?"
  nl: "Hoe ver ligt Nazareth van Jeruzalem?"
  cs: "Jak daleko je Nazaret od Jeruzaléma?"
  sv: "Hur långt är Nasaret från Jerusalem?"
  nb: "Hvor langt er Nasaret fra Jerusalem?"
  tl: "Gaano kalayo ang Nazaret mula sa Jerusalem?"
  da: "Hvor langt er Nazaret fra Jerusalem?"
  sr: "Колико је Назарет удаљен од Јерусалима?"
  hu: "Milyen messze van Názáret Jeruzsálemtől?"
  fi: "Kuinka kaukana Nasaret on Jerusalemista?"
  vi: "Na-xa-rét cách Giê-ru-sa-lem bao xa?"
  ro: "Cât de departe este Nazaretul de Ierusalim?"
  bg: "Колко далеч е Назарет от Йерусалим?"
answer:
  en:
    - "About 105 km in a straight line, Nazareth lying north of Jerusalem in the hills of Lower Galilee; by the Roman roads on the map the way is about 146 km, four or five days on foot. Luke has the family of Jesus make the journey every spring for Passover, and it is the setting of the one story of his boyhood: the Gospel does not say how long it took, only that on the way home they “went a day's journey” before they missed him."
    - "Luke tells it plainly: “Now his parents went to Jerusalem every year at the feast of the passover. And when he was twelve years old, they went up to Jerusalem after the custom of the feast.” Galileans travelled in caravans of kin and neighbours, and Josephus reckons three days for those who hurried through Samaria. In such a company the parents, “supposing him to have been in the company”, walked a whole day before they “sought him among their kinsfolk and acquaintance”; they turned back, and “after three days they found him in the temple, sitting in the midst of the doctors”. Then “he went down with them, and came to Nazareth”. The boy of twelve gives the map its year, AD 8, counted from the conventional birth in 5 BC."
    - "Two roads joined the towns. The ridge road through Samaria was the direct one: Jacob's well at Sychar lies roughly half way, about 54 km from Nazareth and 49 km from Jerusalem in a straight line, and Luke tells of a Samaritan village that would not receive Jesus “because his face was as though he would go to Jerusalem”. The other road went down to the Jordan valley, about 95 km to Jericho, and climbed 22 km more to the city, both in a straight line. Luke also has Joseph go up “from Galilee, out of the city of Nazareth” to Bethlehem, about 111 km in a straight line, before the birth. The roads, the days on foot and the distances to Capernaum and the lake are set out in the question on Jerusalem and Galilee."
  ru:
    - "Около 105 км по прямой: Назарет лежит к северу от Иерусалима, в горах Нижней Галилеи; по римским дорогам на карте путь составляет около 146 км — четыре-пять дней пешком. Лука пишет, что семья Иисуса ходила этим путём каждую весну на Пасху, и на нём разворачивается единственный рассказ о Его отрочестве: Евангелие не говорит, сколько длился путь, только что на обратной дороге родители прошли «дневной путь», прежде чем хватились Его."
    - "Лука рассказывает просто: «Каждый год родители Его ходили в Иерусалим на праздник Пасхи. И когда Он был двенадцати лет, пришли они также по обычаю в Иерусалим на праздник». Галилеяне шли караванами родни и соседей, а Иосиф Флавий считает три дня для тех, кто спешил через Самарию. В таком караване родители, думая, «что Он идет с другими», целый день шли, прежде чем «стали искать Его между родственниками и знакомыми»; они вернулись, и «через три дня нашли Его в храме, сидящего посреди учителей». Потом «Он пошел с ними и пришел в Назарет». Двенадцатилетний Отрок даёт карте её год — 8 г. н. э., считая от условного года рождения, 5 г. до н. э."
    - "Города соединяли две дороги. Прямая шла по хребту через Самарию: колодец Иакова у Сихаря лежит примерно на полпути, в 54 км от Назарета и в 49 км от Иерусалима по прямой, и Лука рассказывает о самарянском селении, где Иисуса не приняли, «потому что Он имел вид путешествующего в Иерусалим». Другая дорога спускалась в долину Иордана, около 95 км до Иерихона, и поднималась ещё на 22 км к городу — оба отрезка по прямой. Ещё до Рождества Иосиф, по Луке, пошёл «из Галилеи, из города Назарета» в Вифлеем — около 111 км по прямой. Дороги, дни пути и расстояния до Капернаума и озера разобраны в вопросе об Иерусалиме и Галилее."
  uk:
    - "Близько 105 км по прямій; Назарет лежить на північ від Єрусалиму в пагорбах Нижньої Галілеї; римськими дорогами на мапі шлях становить близько 146 км, чотири-п'ять днів пішки. Лука показує, що родина Ісуса проходила цей шлях щовесни на Пасху, і це місце дії єдиної розповіді про Його дитинство: Євангеліє не каже, скільки це тривало, лише що на зворотному шляху вони «увійшли на день ходи», перш ніж помітили Його відсутність."
    - "Лука розповідає це просто: «ходили батько-мати Його щороку в Єрусалим у сьвято пасхи. І як було Йому дванайцять років, пійшли вони в Єрусалим сьвятковим звичаєм». Галілеяни мандрували караванами з рідні та сусідів, а Йосиф Флавій обчислює три дні для тих, хто поспішав через Самарію. У такому гурті батьки, «думаючи, що Він між товариством», пройшли цілий день, перш ніж «шукали Його між родиною та знакомими»; вони повернулися, і «через три днї знайшли Його в церкві, сидячого серед учителїв». Потім «пійшов з ними, й прийшов у Назарет». Дванадцятирічний хлопчик дає мапі її рік, 8 р. н. е., відлічений від умовного народження 5 р. до н. е."
    - "Два шляхи сполучали ці міста. Хребтова дорога через Самарію була прямою: колодязь Якова в Сихарі лежить приблизно посередині, приблизно за 54 км від Назарета і за 49 км від Єрусалиму по прямій, а Лука розповідає про самарянське село, яке не прийняло Ісуса, «бо лице Його було грядуще в Єрусалим». Інша дорога спускалася до Йорданської долини, близько 95 км до Єрихону, і піднімалася ще 22 км до міста, обидва відрізки по прямій. Лука також каже, що Йосип пішов «із Галилеї, з города Назарета» до Вифлеєму, приблизно 111 км по прямій, перед народженням. Дороги, дні ходу та відстані до Капернауму й озера викладено в питанні про Єрусалим і Галілею."
  es:
    - "Unos 105 km en línea recta, pues Nazaret queda al norte de Jerusalén, en las colinas de la Baja Galilea; por las calzadas romanas del mapa el camino es de unos 146 km, cuatro o cinco días a pie. Lucas hace que la familia de Jesús realice el viaje cada primavera para la Pascua, y es el escenario del único relato de su niñez: el Evangelio no dice cuánto duró, solo que en el camino de vuelta «anduvieron camino de un día» antes de echarlo de menos."
    - "Lucas lo cuenta con sencillez: «iban sus padres todos los años á Jerusalem en la fiesta de la Pascua. Y cuando fué de doce años, subieron ellos á Jerusalem conforme á la costumbre del día de la fiesta». Los galileos viajaban en caravanas de parientes y vecinos, y Josefo calcula tres días para quienes se apresuraban por Samaria. En una compañía así, los padres, «pensando que estaba en la compañía», anduvieron un día entero y entonces «le buscaban entre los parientes y entre los conocidos»; volvieron atrás, y «tres días después le hallaron en el templo, sentado en medio de los doctores». Luego «descendió con ellos, y vino á Nazaret». El niño de doce años da al mapa su año, el 8 d. C., contado desde el nacimiento convencional en el 5 a. C."
    - "Dos caminos unían las poblaciones. El camino de la cresta por Samaria era el directo: el pozo de Jacob en Sicar queda aproximadamente a medio camino, a unos 54 km de Nazaret y 49 km de Jerusalén en línea recta, y Lucas cuenta de una aldea samaritana que no quiso recibir a Jesús «porque era su traza de ir á Jerusalem». El otro camino bajaba al valle del Jordán, unos 95 km hasta Jericó, y subía 22 km más hasta la ciudad, ambos en línea recta. Lucas hace también que José suba «de Galilea, de la ciudad de Nazaret» a Belén, a unos 111 km en línea recta, antes del nacimiento. Los caminos, los días a pie y las distancias hasta Cafarnaúm y el lago se exponen en la pregunta sobre Jerusalén y Galilea."
  pt:
    - "Cerca de 105 km em linha reta, ficando Nazaré ao norte de Jerusalém, nos montes da Baixa Galileia; pelas estradas romanas do mapa o caminho é de cerca de 146 km, quatro ou cinco dias a pé. Lucas faz a família de Jesus fazer a viagem todas as primaveras para a Páscoa, e é o cenário do único episódio da sua infância: o Evangelho não diz quanto durou, apenas que na volta “caminharam um dia inteiro” antes de sentir a falta dele."
    - "Lucas conta com simplicidade: “Seus pais iam todos os anos a Jerusalém, na festa da Páscoa. Quando ele completou doze anos, eles subiram a Jerusalém, segundo o costume da festa”. Os galileus viajavam em caravanas de parentes e vizinhos, e Josefo calcula três dias para quem se apressava por Samaria. Numa companhia assim os pais, “supondo que ele estivesse na caravana”, andaram um dia inteiro antes de “procurá-lo entre os seus parentes e conhecidos”; voltaram, e “após três dias, o encontraram no templo, sentado no meio dos mestres”. Então “ele desceu com eles e foi para Nazaré”. O menino de doze anos dá ao mapa o seu ano, 8 d.C., contado a partir do nascimento convencional em 5 a.C."
    - "Duas estradas ligavam as cidades. A da crista, por Samaria, era a direta: o poço de Jacó, em Sicar, fica mais ou menos no meio, a cerca de 54 km de Nazaré e 49 km de Jerusalém em linha reta, e Lucas conta de uma aldeia samaritana que não recebeu Jesus “porque ele estava a caminho de Jerusalém”. A outra descia ao vale do Jordão, cerca de 95 km até Jericó, e subia mais 22 km até a cidade, ambos em linha reta. Lucas faz também José subir “da Galileia, da cidade de Nazaré” a Belém, cerca de 111 km em linha reta, antes do nascimento. As estradas, os dias a pé e as distâncias até Cafarnaum e o lago estão expostos na pergunta sobre Jerusalém e a Galileia."
  de:
    - "Etwa 105 km in der Luftlinie, Nazareth liegt nördlich von Jerusalem in den Bergen von Untergaliläa; auf den römischen Straßen der Karte sind es etwa 146 km, vier oder fünf Tage zu Fuß. Lukas lässt die Familie Jesu die Reise jedes Frühjahr zum Passafest machen, und sie ist der Schauplatz der einen Geschichte aus seiner Kindheit: Das Evangelium sagt nicht, wie lange sie dauerte, nur dass sie auf dem Heimweg „eine Tagereise weit“ kamen, ehe sie ihn vermissten."
    - "Lukas erzählt es schlicht: „Und seine Eltern gingen alle Jahre gen Jerusalem auf das Osterfest. Und da er zwölf Jahre alt war, gingen sie hinauf gen Jerusalem nach der Gewohnheit des Festes.“ Die Galiläer reisten in Karawanen aus Verwandten und Nachbarn, und Josephus rechnet drei Tage für Eilige durch Samaria. In einer solchen Gesellschaft gingen die Eltern, die „meinten aber, er wäre unter den Gefährten“, einen ganzen Tag, ehe sie ihn „unter den Gefreunden und Bekannten“ suchten; sie kehrten um, und „nach drei Tagen fanden sie ihn im Tempel sitzen mitten unter den Lehrern“. Dann: „Und er ging mit ihnen hinab und kam gen Nazareth“. Der Zwölfjährige gibt der Karte ihr Jahr, 8 n. Chr., gezählt von der herkömmlichen Geburt im Jahr 5 v. Chr."
    - "Zwei Straßen verbanden die Städte. Die Höhenstraße durch Samaria war die direkte: Der Jakobsbrunnen bei Sychar liegt ungefähr auf halbem Weg, in der Luftlinie etwa 54 km von Nazareth und 49 km von Jerusalem, und Lukas erzählt von einem samaritischen Dorf, das Jesus nicht annahm, „darum daß er sein Angesicht gewendet hatte, zu wandeln gen Jerusalem“. Die andere Straße führte hinab ins Jordantal, etwa 95 km bis Jericho, und stieg weitere 22 km zur Stadt an, beides in der Luftlinie. Lukas lässt auch Josef vor der Geburt „aus Galiläa, aus der Stadt Nazareth“ nach Bethlehem hinaufziehen, in der Luftlinie etwa 111 km. Die Straßen, die Tage zu Fuß und die Entfernungen nach Kapernaum und zum See stehen in der Frage zu Jerusalem und Galiläa."
  fr:
    - "Environ 105 km en ligne droite, Nazareth se trouvant au nord de Jérusalem, dans les collines de la Basse Galilée ; par les routes romaines de la carte, le trajet est d’environ 146 km, quatre ou cinq jours de marche. Luc fait faire ce voyage à la famille de Jésus chaque printemps pour la Pâque, et c’est le cadre du seul récit de son enfance : l’Évangile ne dit pas combien de temps il dura, seulement qu’au retour ils « firent une journée de chemin » avant de s’apercevoir de son absence."
    - "Luc le raconte simplement : « Les parents de Jésus allaient chaque année à Jérusalem, à la fête de Pâque. Lorsqu’il fut âgé de douze ans, ils y montèrent, selon la coutume de la fête. » Les Galiléens voyageaient en caravanes de parents et de voisins, et Josèphe compte trois jours pour ceux qui se hâtaient par la Samarie. Dans une telle troupe, les parents, « croyant qu’il était avec leurs compagnons de voyage », marchèrent une journée entière avant de le chercher « parmi leurs parents et leurs connaissances » ; ils revinrent sur leurs pas, et « au bout de trois jours, ils le trouvèrent dans le temple, assis au milieu des docteurs ». Puis « il descendit avec eux pour aller à Nazareth ». L’enfant de douze ans donne à la carte son année, 8 apr. J.-C., comptée depuis la naissance conventionnelle en 5 av. J.-C."
    - "Deux routes reliaient les villes. La route de crête par la Samarie était la plus directe : le puits de Jacob, à Sychar, se trouve à peu près à mi-chemin, à environ 54 km de Nazareth et 49 km de Jérusalem en ligne droite, et Luc raconte qu’un bourg samaritain refusa de recevoir Jésus « parce qu’il se dirigeait sur Jérusalem ». L’autre route descendait vers la vallée du Jourdain, à environ 95 km jusqu’à Jéricho, puis montait 22 km de plus jusqu’à la ville, le tout en ligne droite. Luc fait aussi monter Joseph « de la Galilée, de la ville de Nazareth » à Bethléem, environ 111 km en ligne droite, avant la naissance. Les routes, les jours de marche et les distances jusqu’à Capernaüm et au lac sont exposés dans la question sur Jérusalem et la Galilée."
  pl:
    - "Około 105 km w linii prostej, przy czym Nazaret leży na północ od Jerozolimy we wzgórzach Dolnej Galilei; rzymskimi drogami z mapy to około 146 km, cztery lub pięć dni pieszo. Łukasz każe rodzinie Jezusa odbywać tę podróż co wiosnę na Paschę i to jest tło jedynej opowieści o jego chłopięctwie: Ewangelia nie mówi, jak długo trwała, tylko że w drodze powrotnej „uszli dzień drogi”, zanim spostrzegli jego brak."
    - "Łukasz opowiada to prosto: „A rodzice jego chadzali na każdy rok do Jeruzalemu na święto wielkanocne. A gdy już był we dwunastym roku, a oni wstępowali do Jeruzalemu według zwyczaju onego święta.” Galilejczycy podróżowali karawanami krewnych i sąsiadów, a Józef Flawiusz liczy trzy dni tym, którzy śpieszyli się przez Samarię. W takim towarzystwie rodzice, „mniemając, że jest w towarzystwie podróżnem”, szli cały dzień, zanim „szukali go między krewnymi i między znajomymi”; zawrócili, a potem w Świątyni „stało się po trzech dniach, że go znaleźli siedzącego w kościele w pośrodku doktorów”. Potem „zstąpił z nimi, i przyszedł do Nazaretu”. Dwunastolatek daje mapie jej rok, 8 n.e., liczony od umownych narodzin w 5 p.n.e."
    - "Dwie drogi łączyły oba miasta. Droga grzbietem przez Samarię była bezpośrednia: studnia Jakuba w Sychar leży mniej więcej w połowie, około 54 km od Nazaretu i 49 km od Jerozolimy w linii prostej, a Łukasz opowiada o samarytańskiej wiosce, która nie przyjęła Jezusa, „przeto że oblicze jego obrócone było do Jeruzalemu”. Druga droga schodziła do doliny Jordanu, około 95 km do Jerycha, i wspinała się jeszcze 22 km do miasta, obie w linii prostej. Łukasz każe też Józefowi wstąpić „z Galilei z miasta Nazaretu” do Betlejem, około 111 km w linii prostej, przed narodzinami. Drogi, dni marszu i odległości do Kafarnaum i jeziora podaje pytanie o Jerozolimę i Galileę."
  it:
    - "Circa 105 km in linea retta, con Nazaret a nord di Gerusalemme sulle colline della Bassa Galilea; lungo le strade romane della mappa il percorso è di circa 146 km, quattro o cinque giorni a piedi. Luca fa compiere alla famiglia di Gesù il viaggio ogni primavera per la Pasqua, ed esso è lo scenario dell’unico racconto della sua fanciullezza: il Vangelo non dice quanto durasse, solo che sulla via del ritorno «camminarono una giornata» prima di accorgersi della sua assenza."
    - "Luca lo racconta con semplicità: «i suoi genitori andavano ogni anno a Gerusalemme per la festa di Pasqua. E quando egli fu giunto ai dodici anni, salirono a Gerusalemme, secondo l’usanza della festa». I Galilei viaggiavano in carovane di parenti e vicini, e Giuseppe Flavio calcola tre giorni per chi si affrettava attraverso la Samaria. In una simile compagnia i genitori, «stimando ch’egli fosse nella comitiva», camminarono un’intera giornata prima di «cercarlo fra i parenti e i conoscenti»; tornarono indietro, e «tre giorni dopo lo trovarono nel tempio, seduto in mezzo a’ dottori». Poi «discese con loro, e venne a Nazaret». Il ragazzo di dodici anni dà alla mappa il suo anno, l’8 d.C., contato dalla nascita convenzionale nel 5 a.C."
    - "Due strade collegavano le città. La strada di crinale attraverso la Samaria era quella diretta: il pozzo di Giacobbe a Sicar si trova più o meno a metà, a circa 54 km da Nazaret e 49 km da Gerusalemme in linea retta, e Luca racconta di un villaggio samaritano che non ricevette Gesù «perché era diretto verso Gerusalemme». L’altra strada scendeva alla valle del Giordano, circa 95 km fino a Gerico, e saliva per altri 22 km fino alla città, entrambi in linea retta. Luca fa anche salire Giuseppe «di Galilea, dalla città di Nazaret» a Betlemme, circa 111 km in linea retta, prima della nascita. Le strade, i giorni a piedi e le distanze da Cafarnao e dal lago sono esposti nella domanda su Gerusalemme e la Galilea."
  nl:
    - "Ongeveer 105 km hemelsbreed; Nazareth ligt ten noorden van Jeruzalem in het heuvelland van Neder-Galilea; langs de Romeinse wegen op de kaart is het ongeveer 146 km, vier of vijf dagen te voet. Lukas laat het gezin van Jezus de reis elk voorjaar voor het Pesachfeest maken, en zij is het toneel van het enige verhaal uit zijn jongensjaren: het Evangelie zegt niet hoe lang zij duurde, alleen dat zij op de terugweg “een dagreize” gingen voordat zij Hem misten."
    - "Lukas vertelt het eenvoudig: “Zijn ouders reisden alle jaar naar Jeruzalem, op het feest van pascha. En toen Hij twaalf jaren oud geworden was, en zij naar Jeruzalem opgegaan waren, naar de gewoonte van den feestdag.” Galileeërs reisden in karavanen van familieleden en buren, en Josephus rekent drie dagen voor wie zich door Samaria haastten. In zo’n gezelschap liepen de ouders, “menende, dat Hij in het gezelschap op den weg was”, een hele dag voordat zij “zochten Hem onder de magen, en onder de bekenden”; zij keerden terug, en “na drie dagen, dat zij Hem vonden in den tempel, zittende in het midden der leraren”. Daarna: “En Hij ging met hen af, en kwam te Nazareth”. De jongen van twaalf geeft de kaart haar jaar, 8 n.Chr., geteld vanaf de conventionele geboorte in 5 v.Chr."
    - "Twee wegen verbonden de steden. De bergkamweg door Samaria was de directe: de bron van Jakob bij Sichar ligt ongeveer halverwege, hemelsbreed ongeveer 54 km van Nazareth en 49 km van Jeruzalem, en Lukas vertelt van een Samaritaans dorp dat Jezus niet wilde ontvangen “omdat Zijn aangezicht was als reizende naar Jeruzalem”. De andere weg liep af naar de Jordaanvallei, hemelsbreed ongeveer 95 km naar Jericho, en klom nog 22 km naar de stad. Lukas laat Jozef vóór de geboorte ook opgaan “van Galilea, uit de stad Nazareth” naar Bethlehem, hemelsbreed ongeveer 111 km. De wegen, de dagen te voet en de afstanden naar Kafarnaüm en het meer staan uiteengezet in de vraag over Jeruzalem en Galilea."
  cs:
    - "Asi 105 km vzdušnou čarou, Nazaret leží severně od Jeruzaléma v kopcích Dolní Galileje; po římských silnicích na mapě je cesta dlouhá asi 146 km, čtyři až pět dní pěšky. Podle Lukáše konala Ježíšova rodina tuto cestu každé jaro na Pesach a je dějištěm jediného příběhu z jeho chlapectví: evangelium neříká, jak dlouho trvala, jen že na zpáteční cestě „ušli den cesty“, než ho postrádali."
    - "Lukáš to vypráví prostě: „I chodívali rodičové jeho každého roku do Jeruzaléma na den slavný velikonoční. A když byl ve dvanácti letech, a oni vstupovali do Jeruzaléma, podle obyčeje toho dne svátečního.“ Galilejci putovali v karavanách příbuzných a sousedů a Josephus Flavius počítá tři dny těm, kdo spěchali přes Samaří. V takové družině rodiče, „domnívajíce se pak o něm, že by byl v zástupu“, šli celý den, než „hledali ho mezi příbuznými a známými“; vrátili se a „po třech dnech … nalezli jej v chrámě, an sedí mezi doktory“. Potom „šel s nimi, a přišel do Nazarétu“. Dvanáctiletý chlapec dává mapě rok 8 n. l., počítaný od smluvního narození roku 5 př. n. l."
    - "Obě města spojovaly dvě cesty. Hřebenová cesta přes Samaří byla přímá: Jákobova studna u Sychar leží zhruba v polovině, vzdušnou čarou asi 54 km od Nazareta a 49 km od Jeruzaléma, a Lukáš vypráví o samařské vsi, která Ježíše nepřijala, „protože obličej jeho byl obrácen k jití do Jeruzaléma“. Druhá cesta sestupovala do Jordánského údolí, vzdušnou čarou asi 95 km do Jericha, a stoupala dalších 22 km k městu. Lukáš také nechává Josefa před narozením vystoupit „od Galilee z města Nazarétu“ do Betléma, vzdušnou čarou asi 111 km. Cesty, dny pěšky a vzdálenosti ke Kafarnaum a k jezeru jsou probrány v otázce o cestě z Jeruzaléma do Galileje."
  sv:
    - "Omkring 105 km fågelvägen, med Nasaret norr om Jerusalem i bergen i Nedre Galileen; via de romerska vägarna på kartan är sträckan omkring 146 km, fyra eller fem dagar till fots. Lukas låter Jesu familj göra resan varje vår till påsk, och den är miljön för den enda berättelsen om hans barndom: evangeliet säger inte hur lång tid den tog, bara att de på hemvägen ”vandrade så en dagsled” innan de saknade honom."
    - "Lukas berättar det rakt på sak: ”Nu plägade hans föräldrar årligen vid påskhögtiden begiva sig till Jerusalem. När han var tolv år gammal, gingo de också dit upp, såsom sed var vid högtiden.” Galileer reste i karavaner av släktingar och grannar, och Josefus räknar tre dagar för dem som skyndade genom Samaria. I ett sådant sällskap vandrade föräldrarna, som ”menade att han var med i ressällskapet”, en hel dag innan de ”sökte efter honom bland fränder och vänner”; de vände tillbaka, och ”efter tre dagar funno de honom i helgedomen, där han satt mitt ibland lärarna”. Sedan ”följde han med dem och kom ned till Nasaret”. Tolvåringen ger kartan dess år, 8 e.Kr., räknat från den konventionella födelsen 5 f.Kr."
    - "Två vägar band samman städerna. Åsvägen genom Samaria var den direkta: Jakobs brunn vid Sykar ligger ungefär halvvägs, omkring 54 km från Nasaret och 49 km från Jerusalem fågelvägen, och Lukas berättar om en samaritisk by som inte ville ta emot Jesus, ”eftersom han var stadd på färd till Jerusalem”. Den andra vägen gick ned till Jordandalen, omkring 95 km till Jeriko, och steg ytterligare 22 km till staden, båda fågelvägen. Lukas låter också Josef gå upp ”från staden Nasaret i Galileen” till Betlehem, omkring 111 km fågelvägen, före födelsen. Vägarna, dagsmarscherna och avstånden till Kafarnaum och sjön redovisas i frågan om Jerusalem och Galileen."
  nb:
    - "Omtrent 105 km i luftlinje, med Nasaret nord for Jerusalem i åsene i Nedre Galilea; langs romerveiene på kartet er veien omtrent 146 km, fire eller fem dager til fots. Lukas lar Jesu familie gjøre reisen hver vår til påske, og den er rammen om den ene fortellingen fra hans guttedom: evangeliet sier ikke hvor lang tid den tok, bare at de på hjemveien var kommet «en dags reise frem» før de savnet ham."
    - "Lukas forteller det enkelt: «Og hans foreldre drog hvert år til Jerusalem til påskefesten. Og da han var tolv år gammel, drog de der op, som det var skikk på høitiden.» Galileerne reiste i karavaner av slekt og naboer, og Josefus regner tre dager for dem som hastet gjennom Samaria. I et slikt følge gikk foreldrene, «da de trodde at han var i reisefølget», en hel dag før de «lette efter ham blandt slektninger og kjenninger»; de vendte tilbake, og «tre dager derefter, da fant de ham i templet; der satt han midt iblandt lærerne». Videre heter det: «Og han gikk ned med dem og kom til Nasaret». Tolvåringen gir kartet dets år, 8 e.Kr., regnet fra den konvensjonelle fødselen i 5 f.Kr."
    - "To veier forbandt byene. Åsryggveien gjennom Samaria var den direkte: Jakobs brønn ved Sykar ligger omtrent halvveis, omtrent 54 km fra Nasaret og 49 km fra Jerusalem i luftlinje, og Lukas forteller om en samaritansk landsby som ikke ville ta imot Jesus, «fordi hans åsyn var vendt mot Jerusalem». Den andre veien gikk ned til Jordandalen, omtrent 95 km til Jeriko, og steg 22 km opp til byen, begge i luftlinje. Lukas lar også Josef dra op «fra Galilea, fra byen Nasaret» til Betlehem, omtrent 111 km i luftlinje, før fødselen. Veiene, dagene til fots og avstandene til Kapernaum og innsjøen er fremstilt i spørsmålet om Jerusalem og Galilea."
  tl:
    - "Mga 105 km sa tuwid na guhit, ang Nazaret ay nasa hilaga ng Jerusalem sa mga burol ng Mababang Galilea; sa mga daang Romano sa mapa ay mga 146 km ang daan, apat o limang araw na lakad. Ayon kay Lucas, taun-taon ginagawa ng pamilya ni Jesus ang paglalakbay tuwing tagsibol para sa Paskua, at ito ang tagpuan ng nag-iisang kuwento ng kaniyang pagkabata: hindi sinasabi ng Ebanghelyo kung gaano katagal ito, kundi sa pag-uwi ay “nagsiyaon sila nang isang araw na paglalakbay” bago nila siya hinanap."
    - "Simpleng isinasalaysay ni Lucas: “Nagsisiparoon taon-taon ang kaniyang mga magulang sa Jerusalem sa kapistahan ng paskua. At nang siya'y may labindalawang taon na, ay nagsiahon sila ayon sa kaugalian ng kapistahan.” Naglalakbay ang mga taga-Galilea sa mga karabana ng kamag-anak at kapitbahay, at tatlong araw ang bilang ni Josephus para sa mga nagmamadali sa Samaria. Sa gayong pangkat, ang mga magulang, “sa pagaakala nilang siya'y nasa kasamahan”, ay naglakad ng buong araw bago “hinahanap nila siya sa mga kamaganak at mga kakilala”; bumalik sila, at “nang makaraan ang tatlong araw, ay nangatagpuan nila siya sa templo, na nakaupo sa gitna ng mga guro”. Pagkatapos ay “lumusong siyang kasama nila, at napasa Nazaret”. Ang batang labindalawa ang nagbibigay sa mapa ng taon nito, 8 AD, na binilang mula sa karaniwang kapanganakan noong 5 BK."
    - "Dalawang daan ang nag-ugnay sa mga bayan. Ang daan sa tagaytay sa Samaria ang tuwiran: ang balon ni Jacob sa Sicar ay nasa mga gitna, mga 54 km mula sa Nazaret at 49 km mula sa Jerusalem sa tuwid na guhit, at isinasalaysay ni Lucas ang isang nayon ng mga Samaritano na hindi tumanggap kay Jesus “sapagka't ang mukha niya'y anyong patungo sa Jerusalem”. Ang isa pang daan ay bumaba sa libis ng Jordan, mga 95 km hanggang sa Jerico, at umakyat ng 22 km pa hanggang sa lungsod, parehong sa tuwid na guhit. Isinasalaysay rin ni Lucas na si Jose ay “umahon mula sa Galilea, mula sa bayan ng Nazaret” patungong Bethlehem, mga 111 km sa tuwid na guhit, bago ang kapanganakan. Ang mga daan, ang mga araw na lakad at ang mga layo hanggang sa Capernaum at sa lawa ay nakasaad sa tanong tungkol sa Jerusalem at Galilea."
  da:
    - "Omkring 105 km i luftlinje; Nazaret ligger nord for Jerusalem i Nedre Galilæas bjerge; ad de romerske veje på kortet er vejen omkring 146 km, fire eller fem dage til fods. Lukas lader Jesu familie foretage rejsen hvert forår til påske, og den er rammen om den ene beretning fra hans drengetid: evangeliet siger ikke, hvor lang tid den tog, kun dette: på hjemvejen »kom de en Dags Rejse frem«, før de savnede ham."
    - "Lukas fortæller det enkelt: »Og hans Forældre droge hvert Aar op til Jerusalem paa Paaskehøjtiden. Og da han var bleven tolv Aar gammel, og de gik op efter Højtidens Sædvane«. Galilæerne rejste i karavaner af slægtninge og naboer, og Josefus regner med tre dage for dem, der skyndte sig gennem Samaria. I et sådant følge vandrede forældrene, »da de mente, at han var i Rejsefølget«, en hel dag, før de »ledte efter ham iblandt deres Slægtninge og Kyndinge«; de vendte om, og »efter tre Dage, da fandt de ham i Helligdommen, hvor han sad midt iblandt Lærerne«. Derpå drog han ned »med dem og kom til Nazareth«. Drengen på tolv giver kortet dets år, 8 e.Kr., regnet fra den konventionelle fødsel i 5 f.Kr."
    - "To veje forbandt byerne. Højdedragsvejen gennem Samaria var den direkte: Jakobs brønd ved Sykar ligger nogenlunde midtvejs, omkring 54 km fra Nazaret og 49 km fra Jerusalem i luftlinje, og Lukas fortæller om en samaritansk landsby, der ikke ville modtage Jesus, »fordi han var paa Vejen til Jerusalem«. Den anden vej gik ned til Jordandalen, omkring 95 km til Jeriko, og steg 22 km mere op til byen, begge i luftlinje. Lukas lader også Josef drage op »fra Galilæa, fra Byen Nazareth« til Betlehem, omkring 111 km i luftlinje, før fødslen. Vejene, dagene til fods og afstandene til Kapernaum og søen er gennemgået i spørgsmålet om Jerusalem og Galilæa."
  sr:
    - "Око 105 км ваздушном линијом, Назарет лежи северно од Јерусалима у брдима Доње Галилеје; римским путевима на карти пут износи око 146 км, четири или пет дана пешке. Лука каже да је Исусова породица тај пут прелазила сваког пролећа за Пасху, а то је и сцена јединог предања из његовог дечаштва: Јеванђеље не каже колико је трајао, већ само да се на повратку о њима каже: „отидоше дан хода“, пре него што су приметили да Га нема."
    - "Лука то прича једноставно: „И родитељи Његови иђаху сваке године у Јерусалим о празнику пасхе. И кад Му би дванаест година, дођоше они у Јерусалим по обичају празника.“ Галилејци су путовали у каравану сродника и суседа, а Јосиф Флавије рачуна три дана за оне који су пожуривали кроз Самарију. У таквом друштву родитељи су, „мислећи да је с друштвом“, ходали цео дан, па је записано: „стадоше Га тражити по родбини и по знанцима“; вратили су се и „после три дана нађоше Га у цркви где седи међу учитељима“. Затим „сиђе с њима и дође у Назарет“. Дечак од дванаест година даје карти њену годину, 8. н. е., рачунато од условног рођења 5. п. н. е."
    - "Два пута су спајала градове. Гребенски пут кроз Самарију био је непосредан: Јаковљев бунар код Сихара лежи отприлике на пола, око 54 км од Назарета и 49 км од Јерусалима ваздушном линијом, а Лука прича о једном самарићанском селу које није примило Исуса, „јер видеше да иде у Јерусалим“. Други пут силазио је у долину Јордана, око 95 км до Јерихона, и пењао се још 22 км до града, обоје ваздушном линијом. Лука такође каже да Јосиф пре рођења иде „из Галилеје, из града Назарета“ у Витлејем, око 111 км ваздушном линијом. Путеви, дани пешачења и даљине до Капернаума и језера изложени су у питању о Јерусалиму и Галилеји."
  hu:
    - "Egyenes vonalban mintegy 105 km, Názáret Jeruzsálemtől északra fekszik, Alsó-Galilea dombjai között; a térképen látható római utakon az út mintegy 146 km, gyalog négy-öt nap. Lukács szerint Jézus családja minden tavasszal megtette az utat a páskára, és ez a színhelye gyermekkora egyetlen történetének: az evangélium nem mondja meg, mennyi ideig tartott, csak azt, hogy hazafelé „egy napi járó földet menének”, mielőtt hiányát észrevették."
    - "Lukács egyszerűen elmondja: „Az ő szülei pedig évenként feljártak Jeruzsálembe a húsvét ünnepére. És mikor tizenkét esztendős lett, fölmenének Jeruzsálembe az ünnep szokása szerint.” A galileaiak rokonok és szomszédok karavánjaiban utaztak, Josephus pedig három napot számít azoknak, akik sietve haladtak át Szamárián. Egy ilyen társaságban a szülők, „azt gondolván, hogy az úti társaságban van, egy napi járó földet menének, és keresék őt a rokonok és az ismerősök között”; visszafordultak, és „harmadnapra megtalálták őt a templomban, a doktorok között ülve”. Majd „aláméne velök, és méne Názáretbe”. A tizenkét éves fiú adja a térkép évét, Kr. u. 8-at, a szokásos Kr. e. 5-ös születéstől számítva."
    - "Két út kötötte össze a városokat. A közvetlen a szamáriai gerincút volt: a szükári Jákób kútja nagyjából félúton van, egyenes vonalban Názárettől mintegy 54 km-re, Jeruzsálemtől 49 km-re, és Lukács egy szamaritánus faluról mesél, amely nem fogadta be Jézust, „mivelhogy ő Jeruzsálembe megy vala”. A másik út a Jordán völgyébe ereszkedett, Jerikóig mintegy 95 km-t, onnan még 22 km-t kapaszkodott a városig, mindkettőt egyenes vonalban számítva. Lukács azt is mondja, hogy József a születés előtt felment „Galileából, Názáret városából” Betlehembe, egyenes vonalban mintegy 111 km-re. Az utakat, a gyalog töltött napokat, valamint a Kapernaumig és a tóig tartó távolságokat a Jeruzsálem és Galilea közötti távolságról szóló kérdés ismerteti."
  fi:
    - "Noin 105 km linnuntietä, Nasaretin sijaitessa Jerusalemista pohjoiseen Ala-Galilean kukkuloilla; kartan roomalaisia teitä pitkin matka on noin 146 km, neljä tai viisi päivää jalan. Luukkaan mukaan Jeesuksen perhe teki matkan joka kevät pääsiäiseksi, ja se on hänen lapsuutensa ainoan kertomuksen näyttämö: evankeliumi ei sano, kuinka kauan matka kesti, vain että kotimatkalla he ”kulkivat päivänmatkan” ennen kuin kaipasivat häntä."
    - "Luukas kertoo asian suoraan: ”Ja hänen vanhempansa matkustivat joka vuosi Jerusalemiin pääsiäisjuhlille. Hänen ollessaan kaksitoistavuotias he niinikään vaelsivat ylös sinne juhlan tavan mukaan.” Galilealaiset matkustivat sukulaisten ja naapurien karavaaneina, ja Josephus laskee kolme päivää niille, jotka kiirehtivät Samarian halki. Tällaisessa seurueessa vanhemmat, jotka ”luulivat hänen olevan matkaseurueessa”, kulkivat kokonaisen päivän ennen kuin ”etsivät häntä sukulaisten ja tuttavien joukosta”; he palasivat, ja ”kolmen päivän kuluttua he löysivät hänet pyhäköstä, jossa hän istui opettajain keskellä”. Sitten ”hän lähti heidän kanssansa ja tuli Nasaretiin”. Kaksitoistavuotias poika antaa kartalle sen vuoden, 8 jaa., laskettuna sovinnaisesta syntymästä vuonna 5 eaa."
    - "Kaupunkeja yhdisti kaksi tietä. Samarian halki kulkeva harjutie oli suora: Jaakobin kaivo Sykarissa on suunnilleen puolivälissä, linnuntietä noin 54 km:n päässä Nasaretista ja 49 km:n päässä Jerusalemista, ja Luukas kertoo samarialaisesta kylästä, joka ei ottanut Jeesusta vastaan, ”koska hän oli vaeltamassa kohti Jerusalemia”. Toinen tie laski Jordanin laaksoon, noin 95 km Jerikoon, ja nousi vielä 22 km kaupunkiin, kumpikin linnuntietä. Luukas kertoo myös, että Joosef lähti ennen syntymää ylös ”Galileasta, Nasaretin kaupungista” Betlehemiin, linnuntietä noin 111 km. Tiet, jalkaisin kuljetut päivät ja etäisyydet Kapernaumiin ja järvelle esitetään Jerusalemia ja Galileaa koskevassa kysymyksessä."
  vi:
    - "Khoảng 105 km theo đường thẳng, Na-xa-rét nằm ở phía bắc Giê-ru-sa-lem trong miền đồi Hạ Ga-li-lê; theo các con đường La Mã trên bản đồ, quãng đường dài khoảng 146 km, bốn hoặc năm ngày đi bộ. Lu-ca kể gia đình Giê-su thực hiện chuyến đi mỗi mùa xuân để dự lễ Vượt qua, và đó là bối cảnh của câu chuyện duy nhất về thời niên thiếu của Ngài: sách Phúc Âm không nói chuyến đi mất bao lâu, chỉ nói rằng trên đường về, hai người “đi trót một ngày” rồi mới nhận ra Ngài vắng mặt."
    - "Lu-ca kể giản dị: “hằng năm đến ngày lễ Vượt qua, cha mẹ Đức Chúa Jêsus thường đến thành Giê-ru-sa-lem. Khi Ngài lên mười hai tuổi, theo lệ thường ngày lễ, cùng lên thành Giê-ru-sa-lem.” Người Ga-li-lê đi theo đoàn gồm bà con và láng giềng, và Giô-sê-phu tính ba ngày cho những người đi vội qua Sa-ma-ri. Trong một đoàn như thế, cha mẹ “tưởng rằng Ngài cũng đồng đi với bạn đi đường”, đi trọn một ngày rồi mới “tìm hỏi trong đám bà con quen biết”; họ quay lại, và “khỏi ba ngày, gặp Ngài tại trong đền thờ đang ngồi giữa mấy thầy thông thái”. Sau đó “Ngài theo về thành Na-xa-rét”. Tuổi mười hai của cậu bé cho bản đồ mốc năm của nó, năm 8, tính từ năm sinh quy ước 5 TCN."
    - "Hai con đường nối hai thị trấn. Con đường sống núi qua Sa-ma-ri là đường thẳng: giếng Gia-cốp ở Si-kha nằm ở khoảng giữa đường, cách Na-xa-rét khoảng 54 km và cách Giê-ru-sa-lem 49 km theo đường thẳng, và Lu-ca kể về một làng Sa-ma-ri không tiếp rước Giê-su “vì Ngài đi thẳng lên thành Giê-ru-sa-lem”. Con đường kia đi xuống đồng bằng Giô-đanh, khoảng 95 km đến Giê-ri-cô, rồi leo thêm 22 km đến thành, cả hai theo đường thẳng. Lu-ca cũng kể Giô-sép đi “từ thành Na-xa-rét, xứ Ga-li-lê, lên thành Đa-vít, gọi là Bết-lê-hem” trước khi Giê-su ra đời, khoảng 111 km theo đường thẳng. Các con đường, số ngày đi bộ và khoảng cách đến Ca-bê-na-um cùng cái hồ được trình bày trong câu hỏi về Giê-ru-sa-lem và Ga-li-lê."
  ro:
    - "Circa 105 km în linie dreaptă, Nazaretul aflându-se la nord de Ierusalim, în dealurile Galileii de Jos; pe drumurile romane de pe hartă, calea are circa 146 km, patru sau cinci zile pe jos. Luca arată familia lui Isus făcând drumul în fiecare primăvară de Paști, iar acesta este cadrul singurei povestiri din copilăria lui: Evanghelia nu spune cât a durat, ci doar că la întoarcere „au venit cale de o zi” până să-i simtă lipsa."
    - "Luca o spune simplu: „Și se duceau părinții lui în fiecare an în Ierusalim, la praznicul paștilor. Și când au fost de doisprezece ani, suindu-se ei în Ierusalim după obiceiul praznicului”. Galileenii călătoreau în caravane de rude și vecini, iar Iosif Flaviu socotește trei zile pentru cei care se grăbeau prin Samaria. Într-o astfel de ceată, părinții, „socotind că este el cu alte soții”, au mers o zi întreagă și abia apoi „l-au căutat pre el prin rudenii și prin cunoscuți”; s-au întors, iar „după trei zile l-au aflat în biserică, șezând în mijlocul dascălilor”. Apoi „s’au pogorît împreună cu dânșii și au venit în Nazaret”. Băiatul de doisprezece ani dă hărții anul ei, 8 d.Hr., socotit de la nașterea convențională din 5 î.Hr."
    - "Două drumuri legau orașele. Drumul de creastă prin Samaria era cel direct: fântâna lui Iacov de la Sihar se află cam la jumătate, la circa 54 km de Nazaret și 49 km de Ierusalim în linie dreaptă, iar Luca povestește despre un sat samaritean care nu l-a primit pe Isus, „că fața lui erà mergând spre Ierusalim”. Celălalt drum cobora în valea Iordanului, circa 95 km până la Ierihon, și urca încă 22 km până la oraș, ambele în linie dreaptă. Luca spune și că Iosif s-a suit „din Galileea, din cetatea Nazaret” la Betleem, circa 111 km în linie dreaptă, înainte de naștere. Drumurile, zilele de mers pe jos și distanțele până la Capernaum și la lac sunt prezentate în întrebarea despre Ierusalim și Galileea."
  bg:
    - "Около 105 км по права линия: Назарет лежи северно от Йерусалим, в хълмовете на Долна Галилея; по римските пътища на картата разстоянието е около 146 км — четири-пет дни пеша. Според Лука семейството на Исус изминавало този път всяка пролет за Пасха и на него се развива единственият разказ за детството му: Евангелието не казва колко време траело пътуването, а само че на връщане те „изминаха един ден път“, преди да усетят, че го няма."
    - "Лука го разказва просто: „ходеха родителите му всека година в Ерусалим за празника на пасхата. И когато стана той на дванадесет години, като възлезоха по обичаю в Ерусалим за праздника“. Галилейците пътували в кервани от роднини и съседи, а Йосиф Флавий смята три дни за бързащите през Самария. В такава група родителите, като „мислеха да е с дружината“, вървели цял ден, преди да го потърсят — „търсеха го между роднините и познайниците си“; върнали се и „след три дни намериха го в храма седнал между учителите“. После „слезе с тех, и дойде в Назарет“. Дванадесетгодишното момче дава на картата нейната година, 8 г. н.е., броено от условното раждане през 5 г. пр.н.е."
    - "Два пътя свързвали градовете. Прекият бил пътят по билото през Самария: Якововият кладенец при Сихар лежи горе-долу по средата, на около 54 км от Назарет и на 49 км от Йерусалим по права линия, а Лука разказва за самарянско село, което не приело Исус, „защото лицето му бе на пътуване към Ерусалим“. Другият слизал в Йорданската долина, около 95 км до Йерихон, и се изкачвал още 22 км до града, и двете по права линия. Лука също казва, че преди Рождество Йосиф възлязъл „от Галилея, от града Назарет“ до Витлеем, на около 111 км по права линия. Пътищата, дните пеша и разстоянията до Капернаум и езерото са изложени във въпроса за Йерусалим и Галилея."
