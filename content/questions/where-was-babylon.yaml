id: where-was-babylon
question:
  en: "Where was Babylon?"
  ru: "Где находился Вавилон?"
  uk: "Де був Вавилон?"
  es: "¿Dónde estaba Babilonia?"
  pt: "Onde ficava Babilônia?"
  de: "Wo lag Babylon?"
  fr: "Où se trouvait Babylone ?"
  pl: "Gdzie leżał Babilon?"
  it: "Dov’era Babilonia?"
  nl: "Waar lag Babylon?"
  cs: "Kde byl Babylón?"
  sv: "Var låg Babylon?"
  nb: "Hvor lå Babylon?"
  tl: "Saan ang Babilonia?"
  da: "Hvor lå Babylon?"
  sr: "Где је био Вавилон?"
answer:
  en:
    - "Babylon lay on the Euphrates in southern Mesopotamia, beside the modern town of Hillah in Iraq, about 85 km south of Baghdad; its ruins and partly rebuilt walls are still there."
    - "The city rose under Hammurabi in the eighteenth century BC and reached its height under Nebuchadnezzar II (605–562 BC), who rebuilt it with double walls, palaces, the Ishtar Gate and the ziggurat Etemenanki. It was to this Babylon that the exiles from Judah were brought in 597 and in 586 BC (587 is also held); tablets from the royal palace list rations for Jehoiachin, king of Judah, whom 2 Kings also places at the Babylonian court."
    - "In 539 BC Cyrus of Persia took the city, as the Nabonidus Chronicle and the Cyrus Cylinder record; the Book of Daniel sets the feast of Belshazzar on the night of its fall, and Ezra opens with Cyrus's decree letting the exiles return. Alexander the Great died in Nebuchadnezzar's palace in 323 BC. After Seleucia was founded on the Tigris the people drained away, and when Trajan came in AD 116 he found mostly mounds."
  ru:
    - "Вавилон стоял на Евфрате в южной Месопотамии, рядом с нынешним городом Хилла в Ираке, примерно в 85 км к югу от Багдада; руины и частично восстановленные стены стоят там и сегодня."
    - "Город возвысился при Хаммурапи в XVIII веке до н. э., а расцвета достиг при Навуходоносоре II (605–562 гг. до н. э.), который отстроил его с двойными стенами, дворцами, воротами Иштар и зиккуратом Этеменанки. В этот Вавилон уводили переселенцев из Иудеи в 597 и в 586 г. до н. э. (называют и 587-й); таблички из царского дворца перечисляют выдачи Иехонии, царю Иудейскому, которого и 4-я книга Царств помещает при вавилонском дворе."
    - "В 539 г. до н. э. город взял Кир Персидский, о чём сообщают Хроника Набонида и Цилиндр Кира; книга Даниила относит пир Валтасара к ночи его падения, а книга Ездры начинается с указа Кира, разрешившего переселенцам вернуться. Александр Македонский умер во дворце Навуходоносора в 323 г. до н. э. После основания Селевкии на Тигре жители разошлись, и Траян в 116 г. н. э. застал здесь в основном холмы."
  uk:
    - "Вавилон лежав на Євфраті в південній Месопотамії, поряд із сучасним містом Гілла в Іраку, приблизно за 85 км на південь від Багдада; його руїни та частково відбудовані мури досі там."
    - "Місто піднеслося за Хаммурапі у XVIII ст. до н. е. і сягнуло вершини за Навуходоносора II (605–562 рр. до н. е.), який відбудував його з подвійними мурами, палацами, брамою Іштар і зіґуратом Етеменанкі. До цього Вавилону були приведені вигнанці з Юдеї 597 і 586 р. до н. е. (називають і 587); таблички з царського палацу перелічують пайки для Єхонії, царя Юдеї, якого й 2 Цар ставить при вавилонському дворі."
    - "539 р. до н. е. Кір Перський узяв місто, як записують Хроніка Набоніда та Циліндр Кіра; Книга Даниїла відносить бенкет Валтасара на ніч його падіння, а Ездра відкривається указом Кіра, що дозволяв вигнанцям повернутися. Александр Великий помер у палаці Навуходоносора 323 р. до н. е. Після заснування Селевкії на Тигрі люди відтекли, і коли Траян прийшов 116 р. н. е., він знайшов здебільшого пагорби."
  es:
    - "Babilonia se alzaba sobre el Éufrates, en el sur de Mesopotamia, junto a la actual población de Hilla, en Irak, a unos 85 km al sur de Bagdad; sus ruinas y sus murallas en parte reconstruidas siguen allí."
    - "La ciudad surgió bajo Hammurabi en el siglo XVIII a. C. y alcanzó su apogeo bajo Nabucodonosor II (605–562 a. C.), que la reconstruyó con doble muralla, palacios, la Puerta de Ishtar y el zigurat Etemenanki. A esta Babilonia fueron llevados los desterrados de Judá en el 597 y en el 586 a. C. (también se sostiene el 587); tablillas del palacio real enumeran raciones para Joaquín, rey de Judá, a quien 2 Reyes sitúa también en la corte babilónica."
    - "En el 539 a. C. Ciro de Persia tomó la ciudad, como registran la Crónica de Nabonido y el Cilindro de Ciro; el libro de Daniel sitúa el festín de Belsasar en la noche de su caída, y Esdras se abre con el decreto de Ciro que permite regresar a los desterrados. Alejandro Magno murió en el palacio de Nabucodonosor en el 323 a. C. Tras la fundación de Seleucia sobre el Tigris, la población se fue marchando, y cuando Trajano llegó en el 116 d. C. halló sobre todo montículos."
  pt:
    - "Babilônia ficava no Eufrates, no sul da Mesopotâmia, junto à atual cidade de Hilla, no Iraque, a cerca de 85 km ao sul de Bagdá; suas ruínas e muralhas parcialmente reconstruídas ainda estão ali."
    - "A cidade se ergueu sob Hamurabi no século XVIII a.C. e atingiu o auge sob Nabucodonosor II (605–562 a.C.), que a reconstruiu com muralhas duplas, palácios, o Portão de Ishtar e o zigurate Etemenanki. Foi para essa Babilônia que os exilados de Judá foram levados em 597 e em 586 a.C. (também se defende 587); tabuinhas do palácio real listam rações para Joaquim, rei de Judá, que 2 Reis também situa na corte babilônica."
    - "Em 539 a.C. Ciro da Pérsia tomou a cidade, como registram a Crônica de Nabonido e o Cilindro de Ciro; o livro de Daniel põe o banquete de Belsazar na noite de sua queda, e Esdras abre com o decreto de Ciro que deixou os exilados voltar. Alexandre, o Grande, morreu no palácio de Nabucodonosor em 323 a.C. Depois da fundação de Selêucia no Tigre a população se esvaiu, e quando Trajano chegou, em 116 d.C., encontrou sobretudo montículos."
  de:
    - "Babylon lag am Euphrat in Südmesopotamien, neben der heutigen Stadt Hilla im Irak, etwa 85 km südlich von Bagdad; seine Ruinen und teilweise wiederaufgebauten Mauern sind noch dort."
    - "Die Stadt stieg im 18. Jahrhundert v. Chr. unter Hammurabi auf und erreichte ihren Höhepunkt unter Nebukadnezar II. (605–562 v. Chr.), der sie mit doppelten Mauern, Palästen, dem Ischtar-Tor und der Zikkurat Etemenanki neu erbaute. In dieses Babylon wurden die Verbannten aus Juda 597 und 586 v. Chr. (auch 587 wird vertreten) gebracht; Tafeln aus dem Königspalast verzeichnen Rationen für Jojachin, den König von Juda, den auch 2. Könige am babylonischen Hof verortet."
    - "539 v. Chr. nahm Kyrus von Persien die Stadt, wie die Nabonid-Chronik und der Kyrus-Zylinder berichten; das Buch Daniel legt das Fest Belsazars in die Nacht ihres Falls, und Esra beginnt mit dem Erlass des Kyrus, der die Verbannten heimkehren lässt. Alexander der Große starb 323 v. Chr. in Nebukadnezars Palast. Nach der Gründung von Seleukia am Tigris verlief sich die Bevölkerung, und als Trajan 116 n. Chr. kam, fand er meist Trümmerhügel."
  fr:
    - "Babylone s’élevait sur l’Euphrate, dans le sud de la Mésopotamie, à côté de la ville moderne de Hilla, en Irak, à environ 85 km au sud de Bagdad ; ses ruines et ses murailles en partie reconstruites s’y trouvent encore."
    - "La ville s’éleva sous Hammurabi au XVIIIe siècle av. J.-C. et atteignit son apogée sous Nebucadnetsar II (605–562 av. J.-C.), qui la rebâtit avec des doubles murailles, des palais, la porte d’Ishtar et la ziggurat Etemenanki. C’est à cette Babylone que furent amenés les exilés de Juda en 597 et en 586 av. J.-C. (587 est aussi retenu) ; des tablettes du palais royal énumèrent des rations pour Jojakin, roi de Juda, que 2 Rois place aussi à la cour babylonienne."
    - "En 539 av. J.-C., Cyrus de Perse prit la ville, comme le rapportent la Chronique de Nabonide et le Cylindre de Cyrus ; le livre de Daniel place le festin de Belschatsar la nuit de sa chute, et Esdras s’ouvre sur le décret de Cyrus laissant revenir les exilés. Alexandre le Grand mourut dans le palais de Nebucadnetsar en 323 av. J.-C. Après la fondation de Séleucie sur le Tigre, la population s’écoula, et quand Trajan vint en 116 apr. J.-C., il ne trouva guère que des tertres."
  pl:
    - "Babilon leżał nad Eufratem w południowej Mezopotamii, obok dzisiejszego miasta Hilla w Iraku, około 85 km na południe od Bagdadu; jego ruiny i częściowo odbudowane mury wciąż tam stoją."
    - "Miasto wzniosło się za Hammurabiego w XVIII wieku p.n.e. i osiągnęło szczyt za Nabuchodonozora II (605–562 p.n.e.), który odbudował je z podwójnymi murami, pałacami, Bramą Isztar i zigguratem Etemenanki. Do tego Babilonu sprowadzono wygnańców z Judy w 597 i w 586 p.n.e. (przyjmuje się też 587); tabliczki z pałacu królewskiego wymieniają racje dla Jojakina, króla Judy, którego 2 Księga Królewska też umieszcza na dworze babilońskim."
    - "W 539 p.n.e. Cyrus z Persji zdobył miasto, jak notują Kronika Nabonida i Cylinder Cyrusa; Księga Daniela umieszcza ucztę Belszassara w noc jego upadku, a Księga Ezdrasza zaczyna się dekretem Cyrusa pozwalającym wygnańcom wrócić. Aleksander Wielki zmarł w pałacu Nabuchodonozora w 323 p.n.e. Po założeniu Seleucji nad Tygrysem ludzie się wyprowadzili, a gdy Trajan przybył w 116 n.e., zastał głównie kopce."
  it:
    - "Babilonia sorgeva sull’Eufrate nella Mesopotamia meridionale, accanto all’odierna città di Hillah in Iraq, a circa 85 km a sud di Baghdad; le sue rovine e le mura in parte ricostruite sono ancora lì."
    - "La città crebbe sotto Hammurabi nel XVIII secolo a.C. e raggiunse l’apogeo sotto Nabucodonosor II (605–562 a.C.), che la ricostruì con doppie mura, palazzi, la Porta di Ishtar e la ziqqurat Etemenanki. A questa Babilonia furono portati gli esuli di Giuda nel 597 e nel 586 a.C. (si sostiene anche il 587); tavolette del palazzo reale elencano le razioni per Ioiachin, re di Giuda, che anche 2 Re colloca alla corte babilonese."
    - "Nel 539 a.C. Ciro di Persia prese la città, come registrano la Cronaca di Nabonedo e il Cilindro di Ciro; il libro di Daniele pone il banchetto di Baldassarre nella notte della sua caduta, ed Esdra si apre con l’editto di Ciro che lascia tornare gli esuli. Alessandro Magno morì nel palazzo di Nabucodonosor nel 323 a.C. Dopo la fondazione di Seleucia sul Tigri la popolazione si disperse, e quando Traiano venne nel 116 d.C. vi trovò per lo più cumuli."
  nl:
    - "Babylon lag aan de Eufraat in Zuid-Mesopotamië, naast de huidige stad Hilla in Irak, ongeveer 85 km ten zuiden van Bagdad; haar ruïnes en deels herbouwde muren staan er nog."
    - "De stad kwam op onder Hammurabi in de achttiende eeuw v.Chr. en bereikte haar hoogtepunt onder Nebukadnessar II (605–562 v.Chr.), die haar herbouwde met dubbele muren, paleizen, de Istarpoort en de ziggurat Etemenanki. Naar dit Babylon werden de ballingen uit Juda gebracht in 597 en in 586 v.Chr. (ook 587 wordt aangehouden); tabletten uit het koninklijk paleis vermelden rantsoenen voor Jojachin, koning van Juda, die ook 2 Koningen aan het Babylonische hof plaatst."
    - "In 539 v.Chr. nam Cyrus van Perzië de stad in, zoals de Kroniek van Nabonidus en de Cyruscilinder vermelden; het boek Daniël plaatst het feest van Belsazar in de nacht van haar val, en Ezra opent met het decreet van Cyrus dat de ballingen laat terugkeren. Alexander de Grote stierf in 323 v.Chr. in het paleis van Nebukadnessar. Nadat Seleucië aan de Tigris was gesticht, liep de bevolking weg, en toen Trajanus in 116 n.Chr. kwam, vond hij vooral heuvels."
  cs:
    - "Babylón ležel na Eufratu v jižní Mezopotámii, vedle dnešního města Hilla v Iráku, asi 85 km jižně od Bagdádu; jeho zříceniny a částečně znovu vystavěné hradby tam dosud stojí."
    - "Město vzrostlo za Chammurapiho v 18. století př. n. l. a vrcholu dosáhlo za Nebukadnesara II. (605–562 př. n. l.), který je přestavěl s dvojitými hradbami, paláci, Ištařinou bránou a zikkuratem Etemenanki. Do tohoto Babylónu byli přivedeni vyhnanci z Judska roku 597 a 586 př. n. l. (hájí se i 587); tabulky z královského paláce uvádějí příděly pro judského krále Jójakína, kterého Druhá kniha Královská také klade na babylonský dvůr."
    - "Roku 539 př. n. l. město dobyl perský Kýros, jak zaznamenávají kronika Nabonida a Kýrův válec; kniha Daniel klade hostinu Belšasarovu na noc jeho pádu a Ezdráš začíná Kýrovým výnosem propouštějícím vyhnance. Alexandr Veliký zemřel v Nebukadnesarově paláci roku 323 př. n. l. Po založení Seleukeie na Tigridu lidé odcházeli a když přišel roku 116 n. l. Traianus, našel už většinou jen pahorky."
  sv:
    - "Babylon låg vid Eufrat i södra Mesopotamien, intill dagens stad Hillah i Irak, omkring 85 km söder om Bagdad; dess ruiner och delvis återuppbyggda murar finns kvar."
    - "Staden steg under Hammurabi på 1700-talet f.Kr. och nådde sin höjd under Nebukadnessar II (605–562 f.Kr.), som byggde upp den med dubbla murar, palats, Ishtarporten och zigguraten Etemenanki. Det var till detta Babylon som de bortförda från Juda fördes 597 och 586 f.Kr. (587 hävdas också); tavlor från kungapalatset förtecknar ransoner till Jojakin, Judas kung, som 2 Kung också placerar vid det babyloniska hovet."
    - "År 539 f.Kr. intog Kyros av Persien staden, som Nabonidkrönikan och Kyroscylindern uppger; Daniels bok förlägger Belshassars fest till natten då den föll, och Esra öppnar med Kyros påbud som lät de bortförda återvända. Alexander den store dog i Nebukadnessars palats 323 f.Kr. Efter att Seleukia grundats vid Tigris rann befolkningen bort, och när Trajanus kom år 116 e.Kr. fann han mest kullar."
  nb:
    - "Babylon lå ved Eufrat i det sørlige Mesopotamia, ved siden av dagens by Hilla i Irak, omtrent 85 km sør for Bagdad; ruinene og delvis gjenreiste murer er der fortsatt."
    - "Byen steg fram under Hammurabi på 1700-tallet f.Kr. og nådde sin høyde under Nebukadnesar II (605–562 f.Kr.), som gjenreiste den med doble murer, palasser, Istar-porten og zigguraten Etemenanki. Det var til dette Babylon at de bortførte fra Juda ble brakt i 597 og i 586 f.Kr. (587 er også foreslått); tavler fra det kongelige palasset lister rasjoner til Jojakin, Judas konge, som 2 Kongebok også plasserer ved det babylonske hoffet."
    - "I 539 f.Kr. tok Kyros av Persia byen, slik Nabonid-krøniken og Kyros-sylinderen melder; Daniels bok legger Belsasars gjestebud til natten da den falt, og Esra åpner med Kyros' påbud som lot de bortførte vende hjem. Aleksander den store døde i Nebukadnesars palass i 323 f.Kr. Etter at Seleukia ble grunnlagt ved Tigris, rant folket bort, og da Trajan kom i 116 e.Kr., fant han mest hauger."
  tl:
    - "Ang Babilonia ay nasa Eufrates sa timog Mesopotamia, sa tabi ng makabagong bayan ng Hillah sa Iraq, mga 85 km sa timog ng Baghdad; naroon pa rin ang mga guho nito at bahagyang muling itinayong mga pader."
    - "Lumitaw ang lungsod sa ilalim ni Hammurabi noong ikalabingwalong siglo BK at umabot sa tugatog sa ilalim ni Nabucodonosor II (605–562 BK), na muling nagtayo nito na may dobleng pader, mga palasyo, Pintuan ng Ishtar at ang ziggurat na Etemenanki. Sa Babilonia ito dinala ang mga ipinatapon mula sa Juda noong 597 at 586 BK (itinuturing din ang 587); inililista ng mga tapyas mula sa palasyo ng hari ang mga rasyon para kay Joachin, hari ng Juda, na inilalagay rin ng 2 Mga Hari sa korte ng Babilonia."
    - "Noong 539 BK, kinuha ni Ciro ng Persia ang lungsod, gaya ng itinala ng Kronika ni Nabonido at ng Silindro ni Ciro; itinatakda ng Aklat ni Daniel ang piging ni Belsasar sa gabi ng pagbagsak nito, at nagsisimula ang Ezra sa kautusan ni Ciro na pinahintulutang bumalik ang mga ipinatapon. Namatay si Alejandro Magno sa palasyo ni Nabucodonosor noong 323 BK. Pagkatapos itatag ang Seleucia sa Tigris, lumisan ang mga tao, at nang dumating si Trajano noong 116 AD, halos mga burol ang nakita niya."
  da:
    - "Babylon lå ved Eufrat i det sydlige Mesopotamien, ved siden af den moderne by Hillah i Irak, omkring 85 km syd for Bagdad; dets ruiner og delvis genopbyggede mure er der stadig."
    - "Byen rejste sig under Hammurabi i 1700-tallet f.Kr. og nåede sit højdepunkt under Nebukadnezar II (605–562 f.Kr.), som genopbyggede den med dobbelte mure, paladser, Ishtar-porten og ziggurraten Etemenanki. Det var til dette Babylon, at de bortførte fra Juda blev bragt i 597 og i 586 f.Kr. (587 holdes også for muligt); tavler fra det kongelige palads opregner rationer til Jojakin, Judas konge, som Anden Kongebog også placerer ved det babyloniske hof."
    - "I 539 f.Kr. indtog Kyros af Persien byen, som Nabonid-krøniken og Kyros-cylinderen beretter; Daniels Bog sætter Belsazars gæstebud på natten for dens fald, og Ezra åbner med Kyros' dekret, der lod de bortførte vende tilbage. Alexander den Store døde i Nebukadnezars palads i 323 f.Kr. Efter at Seleukia var grundlagt ved Tigris, drænedes folk bort, og da Trajan kom i 116 e.Kr., fandt han mest høje."
  sr:
    - "Вавилон је лежао на Еуфрату у јужној Месопотамији, поред савременог града Хиле у Ираку, око 85 км јужно од Багдада; његове рушевине и делимично обновљени зидови и данас су тамо."
    - "Град је порастао под Хамурапијем у 18. веку п. н. е. и достигао врхунац под Навуходоносором II (605–562. п. н. е.), који га је обновио двоструким зидинама, палатама, Иштарином капијом и зигуратом Етеменанки. У овај Вавилон довођени су изгнаници из Јуде 597. и 586. п. н. е. (држи се и 587); таблице из краљевске палате наводе оброке за Јоахина, краља Јуде, кога и 2. књига о царевима смешта на вавилонски двор."
    - "Године 539. п. н. е. Кир Персијски заузео је град, како бележе Набонидова хроника и Киров цилиндар; Књига пророка Данила смешта гозбу Валтасарову у ноћ његовог пада, а Јездра почиње Кировим указом који изгнаницима допушта повратак. Александар Велики умро је у Навуходоносоровој палати 323. п. н. е. Пошто је на Тигру основана Селеукија, становништво се одлило, а кад је Трајан 116. н. е. дошао, нашао је углавном хумке."
