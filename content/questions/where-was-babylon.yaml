id: where-was-babylon
question:
  en: "Where was Babylon?"
  ru: "Где находился Вавилон?"
  uk: "Де був Вавилон?"
  es: "¿Dónde estaba Babilonia?"
  pt: "Onde ficava Babilônia?"
  de: "Wo lag Babylon?"
  fr: "Où se trouvait Babylone ?"
answer:
  en:
    - "Babylon lay on the Euphrates in southern Mesopotamia, beside the modern town of Hillah in Iraq, about 85 km south of Baghdad; its ruins and partly rebuilt walls are still there."
    - "The city rose under Hammurabi in the eighteenth century BC and reached its height under Nebuchadnezzar II (605–562 BC), who rebuilt it with double walls, palaces, the Ishtar Gate and the ziggurat Etemenanki. It was to this Babylon that the exiles from Judah were brought in 597 and in 586 BC (587 is also held); tablets from the royal palace list rations for Jehoiachin, king of Judah, whom 2 Kings also places at the Babylonian court."
    - "In 539 BC Cyrus of Persia took the city, as the Nabonidus Chronicle and the Cyrus Cylinder record; the Book of Daniel sets the feast of Belshazzar on the night of its fall, and Ezra opens with Cyrus's decree letting the exiles return. Alexander the Great died in Nebuchadnezzar's palace in 323 BC. After Seleucia was founded on the Tigris the people drained away, and when Trajan came in AD 116 he found mostly mounds."
  ru:
    - "Вавилон стоял на Евфрате в южной Месопотамии, рядом с нынешним городом Хилла в Ираке, примерно в 85 км к югу от Багдада; руины и частично восстановленные стены стоят там и сегодня."
    - "Город возвысился при Хаммурапи в XVIII веке до н. э., а расцвета достиг при Навуходоносоре II (605–562 гг. до н. э.), который отстроил его с двойными стенами, дворцами, воротами Иштар и зиккуратом Этеменанки. В этот Вавилон уводили переселенцев из Иудеи в 597 и в 586 г. до н. э. (называют и 587-й); таблички из царского дворца перечисляют выдачи Иехонии, царю Иудейскому, которого и 4-я книга Царств помещает при вавилонском дворе."
    - "В 539 г. до н. э. город взял Кир Персидский, о чём сообщают Хроника Набонида и Цилиндр Кира; книга Даниила относит пир Валтасара к ночи его падения, а книга Ездры начинается с указа Кира, разрешившего переселенцам вернуться. Александр Македонский умер во дворце Навуходоносора в 323 г. до н. э. После основания Селевкии на Тигре жители разошлись, и Траян в 116 г. н. э. застал здесь в основном холмы."
  uk:
    - "Вавилон лежав на Євфраті в південній Месопотамії, поряд із сучасним містом Гілла в Іраку, приблизно за 85 км на південь від Багдада; його руїни та частково відбудовані мури досі там."
    - "Місто піднеслося за Хаммурапі у XVIII ст. до н. е. і сягнуло вершини за Навуходоносора II (605–562 рр. до н. е.), який відбудував його з подвійними мурами, палацами, брамою Іштар і зіґуратом Етеменанкі. До цього Вавилону були приведені вигнанці з Юдеї 597 і 586 р. до н. е. (називають і 587); таблички з царського палацу перелічують пайки для Єхонії, царя Юдеї, якого й 2 Цар ставить при вавилонському дворі."
    - "539 р. до н. е. Кір Перський узяв місто, як записують Хроніка Набоніда та Циліндр Кіра; Книга Даниїла відносить бенкет Валтасара на ніч його падіння, а Ездра відкривається указом Кіра, що дозволяв вигнанцям повернутися. Александр Великий помер у палаці Навуходоносора 323 р. до н. е. Після заснування Селевкії на Тигрі люди відтекли, і коли Траян прийшов 116 р. н. е., він знайшов здебільшого пагорби."
  es:
    - "Babilonia se alzaba sobre el Éufrates, en el sur de Mesopotamia, junto a la actual población de Hilla, en Irak, a unos 85 km al sur de Bagdad; sus ruinas y sus murallas en parte reconstruidas siguen allí."
    - "La ciudad surgió bajo Hammurabi en el siglo XVIII a. C. y alcanzó su apogeo bajo Nabucodonosor II (605–562 a. C.), que la reconstruyó con doble muralla, palacios, la Puerta de Ishtar y el zigurat Etemenanki. A esta Babilonia fueron llevados los desterrados de Judá en el 597 y en el 586 a. C. (también se sostiene el 587); tablillas del palacio real enumeran raciones para Joaquín, rey de Judá, a quien 2 Reyes sitúa también en la corte babilónica."
    - "En el 539 a. C. Ciro de Persia tomó la ciudad, como registran la Crónica de Nabonido y el Cilindro de Ciro; el libro de Daniel sitúa el festín de Belsasar en la noche de su caída, y Esdras se abre con el decreto de Ciro que permite regresar a los desterrados. Alejandro Magno murió en el palacio de Nabucodonosor en el 323 a. C. Tras la fundación de Seleucia sobre el Tigris, la población se fue marchando, y cuando Trajano llegó en el 116 d. C. halló sobre todo montículos."
  pt:
    - "Babilônia ficava no Eufrates, no sul da Mesopotâmia, junto à atual cidade de Hilla, no Iraque, a cerca de 85 km ao sul de Bagdá; suas ruínas e muralhas parcialmente reconstruídas ainda estão ali."
    - "A cidade se ergueu sob Hamurabi no século XVIII a.C. e atingiu o auge sob Nabucodonosor II (605–562 a.C.), que a reconstruiu com muralhas duplas, palácios, o Portão de Ishtar e o zigurate Etemenanki. Foi para essa Babilônia que os exilados de Judá foram levados em 597 e em 586 a.C. (também se defende 587); tabuinhas do palácio real listam rações para Joaquim, rei de Judá, que 2 Reis também situa na corte babilônica."
    - "Em 539 a.C. Ciro da Pérsia tomou a cidade, como registram a Crônica de Nabonido e o Cilindro de Ciro; o livro de Daniel põe o banquete de Belsazar na noite de sua queda, e Esdras abre com o decreto de Ciro que deixou os exilados voltar. Alexandre, o Grande, morreu no palácio de Nabucodonosor em 323 a.C. Depois da fundação de Selêucia no Tigre a população se esvaiu, e quando Trajano chegou, em 116 d.C., encontrou sobretudo montículos."
  de:
    - "Babylon lag am Euphrat in Südmesopotamien, neben der heutigen Stadt Hilla im Irak, etwa 85 km südlich von Bagdad; seine Ruinen und teilweise wiederaufgebauten Mauern sind noch dort."
    - "Die Stadt stieg im 18. Jahrhundert v. Chr. unter Hammurabi auf und erreichte ihren Höhepunkt unter Nebukadnezar II. (605–562 v. Chr.), der sie mit doppelten Mauern, Palästen, dem Ischtar-Tor und der Zikkurat Etemenanki neu erbaute. In dieses Babylon wurden die Verbannten aus Juda 597 und 586 v. Chr. (auch 587 wird vertreten) gebracht; Tafeln aus dem Königspalast verzeichnen Rationen für Jojachin, den König von Juda, den auch 2. Könige am babylonischen Hof verortet."
    - "539 v. Chr. nahm Kyrus von Persien die Stadt, wie die Nabonid-Chronik und der Kyrus-Zylinder berichten; das Buch Daniel legt das Fest Belsazars in die Nacht ihres Falls, und Esra beginnt mit dem Erlass des Kyrus, der die Verbannten heimkehren lässt. Alexander der Große starb 323 v. Chr. in Nebukadnezars Palast. Nach der Gründung von Seleukia am Tigris verlief sich die Bevölkerung, und als Trajan 116 n. Chr. kam, fand er meist Trümmerhügel."
  fr:
    - "Babylone s’élevait sur l’Euphrate, dans le sud de la Mésopotamie, à côté de la ville moderne de Hilla, en Irak, à environ 85 km au sud de Bagdad ; ses ruines et ses murailles en partie reconstruites s’y trouvent encore."
    - "La ville s’éleva sous Hammurabi au XVIIIe siècle av. J.-C. et atteignit son apogée sous Nebucadnetsar II (605–562 av. J.-C.), qui la rebâtit avec des doubles murailles, des palais, la porte d’Ishtar et la ziggurat Etemenanki. C’est à cette Babylone que furent amenés les exilés de Juda en 597 et en 586 av. J.-C. (587 est aussi retenu) ; des tablettes du palais royal énumèrent des rations pour Jojakin, roi de Juda, que 2 Rois place aussi à la cour babylonienne."
    - "En 539 av. J.-C., Cyrus de Perse prit la ville, comme le rapportent la Chronique de Nabonide et le Cylindre de Cyrus ; le livre de Daniel place le festin de Belschatsar la nuit de sa chute, et Esdras s’ouvre sur le décret de Cyrus laissant revenir les exilés. Alexandre le Grand mourut dans le palais de Nebucadnetsar en 323 av. J.-C. Après la fondation de Séleucie sur le Tigre, la population s’écoula, et quand Trajan vint en 116 apr. J.-C., il ne trouva guère que des tertres."
