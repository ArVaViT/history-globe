id: where-was-nineveh
question:
  en: "Where was Nineveh?"
  ru: "Где находилась Ниневия?"
  uk: "Де була Ніневія?"
  es: "¿Dónde estaba Nínive?"
  pt: "Onde ficava Nínive?"
  de: "Wo lag Ninive?"
  fr: "Où se trouvait Ninive ?"
  pl: "Gdzie leżała Niniwa?"
  it: "Dov’era Ninive?"
  cs: "Kde leželo Ninive?"
  nl: "Waar lag Nineve?"
  sv: "Var låg Nineve?"
answer:
  en:
    - "Nineveh stood on the east bank of the Tigris in northern Iraq, opposite the modern city of Mosul; its ruins are the two mounds of Kuyunjik and Nebi Yunus, now inside the city's built-up area."
    - 'It was one of the royal cities of Assyria and became its capital about 700 BC, when Sennacherib built his palace, a wall about 12 km long and canals bringing water from the hills. The Bible says that after his campaign against Judah in 701 BC Sennacherib "returned, and dwelt at Nineveh", and that he was killed there by his sons. The Book of Jonah is set in the same city: "Arise, go to Nineveh, that great city, and cry against it."'
    - "In 612 BC the Babylonians and the Medes took and destroyed Nineveh after a siege of about three months, as the Babylonian Chronicle records, and Assyria never recovered. Only a small settlement lived on at the site; the town that became Mosul grew on the opposite bank. The palaces, the reliefs and the library of Ashurbanipal were uncovered from the 1840s by Botta, Layard and their successors."
  ru:
    - "Ниневия стояла на восточном берегу Тигра на севере нынешнего Ирака, напротив Мосула; её руины — два холма, Куюнджик и Неби-Юнус, сегодня внутри городской застройки."
    - "Это был один из царских городов Ассирии, а около 700 г. до н. э. он стал её столицей: Сеннахирим построил здесь дворец, стену длиной около 12 км и каналы, подводившие воду с гор. Библия говорит, что после похода на Иудею в 701 г. до н. э. Сеннахирим «возвратился… и жил в Ниневии» и что здесь его убили сыновья. В этом же городе происходит действие книги Ионы: «встань, иди в Ниневию, город великий, и проповедуй в нем»."
    - "В 612 г. до н. э. вавилоняне и мидяне после примерно трёхмесячной осады взяли и разрушили Ниневию, как сообщает Вавилонская хроника, и Ассирия уже не поднялась. На месте города осталось лишь небольшое поселение, а на другом берегу вырос Мосул. Дворцы, рельефы и библиотеку Ашшурбанапала раскопали с 1840-х годов Ботта, Лэйярд и их преемники."
  uk:
    - "Ніневія стояла на східному березі Тигру на півночі Іраку, навпроти сучасного міста Мосул; її руїни — два пагорби, Куюнджик і Неби-Юнус, нині в межах забудови міста."
    - "Це було одне з царських міст Ассирії, і столицею вона стала близько 700 р. до н. е., коли Сінаххеріб збудував тут свій палац, мур завдовжки близько 12 км і канали, що підводили воду з пагорбів. Біблія каже, що після його походу проти Юди 701 р. до н. е. Сінаххеріб «вернувсь, та й седїв у Ниневиї» і що там його вбили сини. Книга Йони розгортається в тому самому місті: «Устань, подайсь у Ниневію, в город великий, і проповідуй проти його»."
    - "612 р. до н. е. вавилоняни й мідяни взяли та зруйнували Ніневію після приблизно тримісячної облоги, як записано у Вавилонській хроніці, і Ассирія так і не оговталася. На місці жила лише невелика оселя; місто, що стало Мосулом, виросло на протилежному березі. Палаци, рельєфи й бібліотеку Ашшурбаніпала відкрили від 1840-х рр. Ботта, Лейярд та їхні наступники."
  es:
    - "Nínive se alzaba en la orilla oriental del Tigris, en el norte de Irak, frente a la actual ciudad de Mosul; sus ruinas son los dos montículos de Kuyunjik y Nebi Yunus, hoy dentro de la zona edificada de la ciudad."
    - "Fue una de las ciudades reales de Asiria y se convirtió en su capital hacia el 700 a. C., cuando Senaquerib construyó su palacio, una muralla de unos 12 km de longitud y canales que traían agua de las colinas. La Biblia dice que, tras su campaña contra Judá en 701 a. C., Senaquerib «tornó á Nínive, donde se estuvo», y que allí lo mataron sus hijos. El libro de Jonás se sitúa en la misma ciudad: «Levántate, y ve á Nínive, ciudad grande, y pregona contra ella»."
    - "En 612 a. C. los babilonios y los medos tomaron y destruyeron Nínive tras un asedio de unos tres meses, como registra la Crónica babilónica, y Asiria nunca se recuperó. Solo un pequeño poblado siguió viviendo en el lugar; la ciudad que llegó a ser Mosul creció en la orilla opuesta. Los palacios, los relieves y la biblioteca de Asurbanipal fueron sacados a la luz desde la década de 1840 por Botta, Layard y sus sucesores."
  pt:
    - "Nínive ficava na margem leste do Tigre, no norte do Iraque, em frente à cidade moderna de Mosul; suas ruínas são os dois montes de Kuyunjik e Nebi Yunus, hoje dentro da área urbanizada da cidade."
    - "Era uma das cidades reais da Assíria e tornou-se sua capital por volta de 700 a.C., quando Senaqueribe construiu seu palácio, uma muralha de cerca de 12 km e canais que traziam água das colinas. A Bíblia diz que, depois de sua campanha contra Judá em 701 a.C., Senaqueribe, “rei da Assíria, partiu, voltou para casa e viveu em Nínive”, e que foi morto ali por seus filhos. O livro de Jonas se passa na mesma cidade: “Levante-se, vá à grande cidade de Nínive e pregue contra ela.”"
    - "Em 612 a.C., os babilônios e os medos tomaram e destruíram Nínive depois de um cerco de cerca de três meses, como registra a Crônica Babilônica, e a Assíria nunca se recuperou. Apenas um pequeno povoado sobreviveu no local; a cidade que se tornou Mosul cresceu na margem oposta. Os palácios, os relevos e a biblioteca de Assurbanípal foram descobertos a partir da década de 1840 por Botta, Layard e seus sucessores."
  de:
    - "Ninive lag am Ostufer des Tigris im Nordirak, gegenüber der heutigen Stadt Mosul; seine Ruinen sind die beiden Hügel Kuyunjik und Nebi Yunus, die heute im bebauten Stadtgebiet liegen."
    - "Es war eine der Königsstädte Assyriens und wurde um 700 v. Chr. dessen Hauptstadt, als Sanherib seinen Palast, eine etwa 12 km lange Mauer und Kanäle baute, die Wasser aus den Bergen heranführten. Die Bibel sagt von Sanherib nach seinem Feldzug gegen Juda im Jahr 701 v. Chr.: „kehrte um und blieb zu Ninive“; dort wurde er von seinen Söhnen getötet. Das Buch Jona spielt in derselben Stadt: „Mache dich auf und gehe in die große Stadt Ninive und predige wider sie!“"
    - "612 v. Chr. nahmen die Babylonier und Meder Ninive nach einer Belagerung von etwa drei Monaten ein und zerstörten es, wie die Babylonische Chronik berichtet, und Assyrien erholte sich nie wieder. Nur eine kleine Siedlung lebte an der Stelle fort; die Stadt, aus der Mosul wurde, wuchs am gegenüberliegenden Ufer. Die Paläste, die Reliefs und die Bibliothek Assurbanipals wurden ab den 1840er-Jahren von Botta, Layard und ihren Nachfolgern freigelegt."
  fr:
    - "Ninive s’élevait sur la rive orientale du Tigre, dans le nord de l’Irak, en face de la ville moderne de Mossoul ; ses ruines sont les deux tertres de Koyunjik et de Nebi Younès, aujourd’hui dans la zone bâtie de la ville."
    - "C’était l’une des villes royales d’Assyrie, qui en devint la capitale vers 700 av. J.-C., quand Sanchérib y bâtit son palais, un rempart d’environ 12 km de long et des canaux amenant l’eau des collines. La Bible dit qu’après sa campagne contre Juda en 701 av. J.-C., Sanchérib « s’en retourna ; et il resta à Ninive », et qu’il y fut tué par ses fils. Le livre de Jonas se déroule dans la même ville : « Lève-toi, va à Ninive, la grande ville, et crie contre elle ! »"
    - "En 612 av. J.-C., les Babyloniens et les Mèdes prirent et détruisirent Ninive après un siège d’environ trois mois, comme le rapporte la Chronique babylonienne, et l’Assyrie ne s’en releva jamais. Seule une petite agglomération survécut sur le site ; la ville qui devint Mossoul se développa sur la rive opposée. Les palais, les reliefs et la bibliothèque d’Assurbanipal furent mis au jour à partir des années 1840 par Botta, Layard et leurs successeurs."
  pl:
    - "Niniwa stała na wschodnim brzegu Tygrysu w północnym Iraku, naprzeciw współczesnego miasta Mosul; jej ruiny to dwa wzgórza, Kuyunjik i Nebi Yunus, leżące dziś w zabudowie miasta."
    - "Była jednym z królewskich miast Asyrii i około 700 p.n.e. stała się jej stolicą, gdy Sennacheryb zbudował pałac, mur długi na około 12 km i kanały doprowadzające wodę ze wzgórz. Biblia mówi, że po jego wyprawie przeciw Judzie w 701 p.n.e. „wrócił się Seneacheryb, król Assyryjski, a mieszkał w Niniwe”, i że zabili go tam synowie. Księga Jonasza rozgrywa się w tym samym mieście: „Wstań, idź do Niniwy miasta tego wielkiego, a wołaj przeciwko niemu”."
    - "W 612 p.n.e. Babilończycy i Medowie zdobyli i zniszczyli Niniwę po około trzymiesięcznym oblężeniu, jak zapisano w Kronice Babilońskiej, i Asyria już się nie podniosła. Na miejscu żyła tylko mała osada; miasto, które stało się Mosulem, wyrosło na przeciwległym brzegu. Pałace, reliefy i bibliotekę Asurbanipala odkrywali od lat 40. XIX wieku Botta, Layard i ich następcy."
  it:
    - "Ninive sorgeva sulla riva orientale del Tigri nell’Iraq settentrionale, di fronte all’odierna città di Mosul; le sue rovine sono i due tell di Kuyunjik e Nebi Yunus, oggi all’interno dell’area edificata della città."
    - "Era una delle città regali dell’Assiria e ne divenne la capitale verso il 700 a.C., quando Sennacherib costruì il suo palazzo, una cinta muraria lunga circa 12 km e canali che portavano l’acqua dalle colline. La Bibbia dice che dopo la sua campagna contro Giuda nel 701 a.C. Sennacherib «se ne tornò a Ninive, dove rimase», e che lì fu ucciso dai suoi figli. Il libro di Giona è ambientato nella stessa città: «Lèvati, va’ a Ninive, la gran città, e predica contro di lei»."
    - "Nel 612 a.C. i Babilonesi e i Medi presero e distrussero Ninive dopo un assedio di circa tre mesi, come registra la Cronaca babilonese, e l’Assiria non si riprese mai. Solo un piccolo insediamento sopravvisse nel sito; la città che divenne Mosul crebbe sulla riva opposta. I palazzi, i rilievi e la biblioteca di Assurbanipal furono portati alla luce dagli anni 1840 da Botta, Layard e dai loro successori."
  cs:
    - "Ninive stálo na východním břehu Tigridu v severním Iráku, naproti dnešnímu městu Mosul; jeho zříceniny tvoří dva pahorky Kujundžik a Nebi Júnus, nyní uvnitř zastavěné části města."
    - "Bylo jedním z královských měst Asýrie a jejím hlavním městem se stalo kolem roku 700 př. n. l., kdy Senacherib vystavěl svůj palác, hradbu dlouhou asi 12 km a kanály přivádějící vodu z hor. Bible říká, že po tažení proti Judsku roku 701 př. n. l. Senacherib, „navrátiv se, bydlil v Ninive“, a že tam byl zabit svými syny. Kniha Jonáš se odehrává v témže městě: „Vstaň, jdi do Ninive města toho velikého, a volej proti němu.“"
    - "Roku 612 př. n. l. Babyloňané a Médové po obléhání trvajícím asi tři měsíce Ninive dobyli a zničili, jak zaznamenává Babylonská kronika, a Asýrie se už nikdy nevzpamatovala. Na místě žila jen malá osada; město, z něhož se stal Mosul, vyrostlo na protějším břehu. Paláce, reliéfy a knihovnu Aššurbanipalovu odkryli od 40. let 19. století Botta, Layard a jejich nástupci."
  nl:
    - "Nineve lag op de oostoever van de Tigris in het noorden van Irak, tegenover de moderne stad Mosoel; de ruïnes zijn de twee heuvels Kuyunjik en Nebi Yunus, nu binnen het bebouwde gebied van de stad."
    - "Het was een van de koninklijke steden van Assyrië en werd rond 700 v.Chr. de hoofdstad, toen Sanherib er zijn paleis bouwde, een muur van ongeveer 12 km lang en kanalen die water uit de heuvels aanvoerden. De Bijbel zegt dat Sanherib na zijn veldtocht tegen Juda in 701 v.Chr. “toog henen, en keerde weder; en hij bleef te Nineve”, en dat hij daar door zijn zonen werd gedood. Het boek Jona speelt zich in dezelfde stad af: “Maak u op, ga naar de grote stad Nineve, en predik tegen haar.”"
    - "In 612 v.Chr. namen de Babyloniërs en de Meden Nineve in en verwoestten het na een beleg van ongeveer drie maanden, zoals de Babylonische kroniek meldt, en Assyrië herstelde zich nooit. Slechts een kleine nederzetting bleef op de plek bestaan; de stad die Mosoel werd, groeide op de overkant. De paleizen, de reliëfs en de bibliotheek van Assurbanipal werden vanaf de jaren 1840 blootgelegd door Botta, Layard en hun opvolgers."
  sv:
    - "Nineve låg på Tigris östra strand i norra Irak, mitt emot den moderna staden Mosul; dess ruiner är de två kullarna Kuyunjik och Nebi Yunus, nu inom stadens bebyggda område."
    - "Det var en av Assyriens kungastäder och blev dess huvudstad omkring 700 f.Kr., då Sanherib byggde sitt palats, en mur på omkring 12 km och kanaler som förde vatten från bergen. Bibeln säger att Sanherib efter sin kampanj mot Juda 701 f.Kr. ”tågade tillbaka; och han stannade sedan i Nineve”, och att han dödades där av sina söner. Jonaboken utspelar sig i samma stad: ”Stå upp och begiv dig till Nineve, den stora staden, och predika för den.”"
    - "År 612 f.Kr. intog och förstörde babylonierna och mederna Nineve efter en belägring på omkring tre månader, som Babyloniska krönikan berättar, och Assyrien återhämtade sig aldrig. Endast en liten bosättning levde kvar på platsen; staden som blev Mosul växte upp på motsatta stranden. Palatsen, relieferna och Assurbanipals bibliotek framgrävdes från 1840-talet av Botta, Layard och deras efterföljare."
