id: where-was-smyrna
question:
  en: "Where was Smyrna in the Bible?"
  ru: "Где находилась библейская Смирна?"
  uk: "Де була Смирна в Біблії?"
  es: "¿Dónde estaba Esmirna en la Biblia?"
  pt: "Onde ficava Esmirna na Bíblia?"
  de: "Wo lag Smyrna in der Bibel?"
  fr: "Où se trouvait Smyrne dans la Bible ?"
  pl: "Gdzie leżała Smyrna w Biblii?"
  it: "Dov’era Smirne nella Bibbia?"
  cs: "Kde ležela Smyrna v Bibli?"
  nl: "Waar lag Smyrna in de Bijbel?"
  sv: "Var låg Smyrna i Bibeln?"
  nb: "Hvor lå Smyrna i Bibelen?"
  tl: "Nasaan ang Smirna sa Biblia?"
answer:
  en:
    - "Smyrna is İzmir, the third city of Turkey, at the head of a long gulf on the Aegean coast; the map point stands in the city. Ephesus was about 56 km to the south in a straight line, Pergamum 79 km to the north and Sardis 79 km to the east, so Smyrna stood where the coast road met the road up the Hermus valley. The Roman city rose about 300 BC on the slopes of Mount Pagus, the hill now crowned by the castle of Kadifekale; older Smyrna had stood across the bay at Bayraklı."
    - "The Bible names Smyrna only in Revelation, which about AD 95 sends it the second of the seven letters, one of the two with no rebuke. It speaks for “the first and the last, which was dead, and is alive”, warns of prison and “tribulation ten days”, and promises: “be thou faithful unto death, and I will give thee a crown of life.” Ramsay and Hemer read the words against the city's past: Strabo says that after the Lydians destroyed old Smyrna its people lived in villages for some four hundred years before the new city rose, and the buildings ringing Mount Pagus were likened to a crown. Others think the images need no local key."
    - "Early in the second century Ignatius of Antioch stopped at Smyrna on his way to Rome and later wrote to its church and to its bishop Polycarp. Polycarp was burned in the stadium of Smyrna; the church's account of his death, dated by some to about 155–156 and by others later, is generally held to be the oldest Christian martyrdom story after the New Testament. After an earthquake about 178 Marcus Aurelius helped rebuild the city, and the colonnades of its Roman agora from that rebuilding are excavated in the centre of İzmir."
  ru:
    - "Смирна — это Измир, третий по величине город Турции, в глубине длинного залива на эгейском берегу; точка карты стоит в городе. Ефес лежал примерно в 56 км к югу по прямой, Пергам — в 79 км к северу, а Сардис — в 79 км к востоку, так что Смирна стояла там, где береговая дорога встречалась с дорогой вверх по долине Герма. Римский город вырос около 300 г. до н. э. на склонах горы Пагос, которую сейчас венчает крепость Кадифекале; старая Смирна стояла по другую сторону залива, в Байраклы."
    - "Библия называет Смирну только в Откровении, которое около 95 г. посылает ей второе из семи посланий — одно из двух без обличения. Оно говорит от лица Того, «Который был мертв, и се, жив», предупреждает о темнице и о том, что «будете иметь скорбь дней десять», и обещает: «Будь верен до смерти, и дам тебе венец жизни». Рамзей и Хемер толковали эти слова по истории города: Страбон пишет, что после того как лидийцы разрушили старую Смирну, жители около четырёхсот лет жили по деревням, пока не вырос новый город, а постройки вокруг горы Пагос сравнивали с венцом. Другие считают, что эти образы не нуждаются в местном ключе."
    - "В начале II века Игнатий Антиохийский по пути в Рим останавливался в Смирне, а потом написал её церкви и её епископу Поликарпу. Поликарпа сожгли на стадионе Смирны; рассказ церкви о его смерти, который одни датируют около 155–156 гг., а другие — более поздними годами, обычно считают древнейшим христианским повествованием о мученичестве после Нового Завета. После землетрясения около 178 г. Марк Аврелий помог отстроить город, и колоннады его римской агоры, возведённые тогда, раскопаны в центре Измира."
  uk:
    - "Смирна — це Ізмір, третє місто Туреччини, на вершині довгої затоки на егейському узбережжі; точка на мапі стоїть у місті. Ефес був приблизно за 56 км на південь по прямій, Пергам — за 79 км на північ, а Сарди — за 79 км на схід, тож Смирна стояла там, де прибережна дорога зустрічалася з дорогою вгору долиною Герма. Римське місто постало близько 300 р. до н. е. на схилах гори Пагос, пагорба, нині увінчаного замком Кадіфекале; давня Смирна стояла через затоку в Байраклі."
    - "Біблія називає Смирну лише в Одкровенні, яке близько 95 р. н. е. надсилає їй другий із семи листів, один із двох без докору. Він говорить від імені «Первий і Останнїй, що був мертвий і ожив», застерігає про в'язницю й про те, що «мати мете горе десять день», і обіцяє: «Будь вірний аж до смерти, і дам тобі вінець життя.» Рамзай і Гемер читають ці слова на тлі минулого міста: Страбон каже, що після того, як лідійці зруйнували стару Смирну, її жителі близько чотирьохсот років жили по селах, поки постало нове місто, а будівлі навколо гори Пагос порівнювали з вінцем. Інші вважають, що образи не потребують місцевого ключа."
    - "На початку II ст. Ігнатій Антіохійський зупинявся в Смирні дорогою до Рима і пізніше писав її церкві й її єпископові Полікарпові. Полікарпа спалили на стадіоні Смирни; розповідь церкви про його смерть, яку одні датують близько 155–156 рр., а інші пізніше, вважають найдавнішою оповіддю про християнську мученицьку смерть після Нового Заповіту. Після землетрусу близько 178 р. Марк Аврелій допоміг відбудувати місто, і колонади його римської агори з тієї відбудови розкопано в центрі Ізміра."
  es:
    - "Esmirna es İzmir, la tercera ciudad de Turquía, en el extremo de un largo golfo de la costa del Egeo; el punto del mapa está en la ciudad. Éfeso quedaba a unos 56 km al sur en línea recta, Pérgamo a 79 km al norte y Sardis a 79 km al este, de modo que Esmirna estaba donde el camino de la costa se encontraba con el que sube por el valle del Hermo. La ciudad romana se alzó hacia el 300 a. C. en las laderas del monte Pagos, la colina hoy coronada por el castillo de Kadifekale; la Esmirna más antigua había estado al otro lado de la bahía, en Bayraklı."
    - "La Biblia nombra Esmirna solo en el Apocalipsis, que hacia el 95 d. C. le envía la segunda de las siete cartas, una de las dos sin reproche. Habla en nombre de «El primero y postrero, que fué muerto, y vivió», advierte de la cárcel y de «tribulación de diez días», y promete: «Sé fiel hasta la muerte, y yo te daré la corona de la vida». Ramsay y Hemer leen las palabras a la luz del pasado de la ciudad: Estrabón dice que, tras destruir los lidios la vieja Esmirna, su gente vivió en aldeas unos cuatrocientos años antes de que surgiera la nueva ciudad, y los edificios que rodeaban el monte Pagos se comparaban con una corona. Otros piensan que las imágenes no necesitan clave local."
    - "A principios del siglo II, Ignacio de Antioquía se detuvo en Esmirna de camino a Roma y escribió después a su iglesia y a su obispo Policarpo. Policarpo fue quemado en el estadio de Esmirna; el relato de su muerte que hizo la iglesia, fechado por unos hacia 155–156 y por otros más tarde, se tiene en general por el relato de martirio cristiano más antiguo después del Nuevo Testamento. Tras un terremoto hacia 178, Marco Aurelio ayudó a reconstruir la ciudad, y las columnatas de su ágora romana de esa reconstrucción están excavadas en el centro de İzmir."
  pt:
    - "Esmirna é İzmir, a terceira cidade da Turquia, na cabeceira de um longo golfo na costa do Egeu; o ponto do mapa fica na cidade. Éfeso ficava a cerca de 56 km ao sul em linha reta, Pérgamo a 79 km ao norte e Sardes a 79 km a leste, de modo que Esmirna ficava onde a estrada da costa encontrava a estrada que sobe o vale do Hermo. A cidade romana surgiu por volta de 300 a.C. nas encostas do monte Pagos, a colina hoje coroada pelo castelo de Kadifekale; a Esmirna mais antiga ficava do outro lado da baía, em Bayraklı."
    - "A Bíblia nomeia Esmirna apenas no Apocalipse, que por volta de 95 d.C. lhe envia a segunda das sete cartas, uma das duas sem repreensão. Fala em nome de “O primeiro e o último, que esteve morto e tornou a viver”, adverte de prisão e de “tribulação por dez dias” e promete: “Seja fiel até a morte, e eu lhe darei a coroa da vida.” Ramsay e Hemer leem as palavras à luz do passado da cidade: Estrabão diz que, depois que os lídios destruíram a velha Esmirna, seu povo viveu em aldeias por cerca de quatrocentos anos antes de a nova cidade surgir, e os edifícios em torno do monte Pagos eram comparados a uma coroa. Outros pensam que as imagens não precisam de chave local."
    - "No início do século II, Inácio de Antioquia parou em Esmirna a caminho de Roma e mais tarde escreveu à sua igreja e ao seu bispo Policarpo. Policarpo foi queimado no estádio de Esmirna; o relato da igreja sobre a sua morte, datado por alguns de cerca de 155–156 e por outros de mais tarde, é geralmente tido pela mais antiga narrativa de martírio cristão depois do Novo Testamento. Depois de um terremoto por volta de 178, Marco Aurélio ajudou a reconstruir a cidade, e as colunatas da sua ágora romana dessa reconstrução estão escavadas no centro de İzmir."
  de:
    - "Smyrna ist İzmir, die drittgrößte Stadt der Türkei, am Ende eines langen Golfs an der Ägäisküste; der Kartenpunkt steht in der Stadt. Ephesus lag in der Luftlinie etwa 56 km südlich, Pergamon 79 km nördlich und Sardes 79 km östlich, Smyrna lag also dort, wo sich die Küstenstraße und die Straße das Hermostal hinauf trafen. Die römische Stadt entstand um 300 v. Chr. an den Hängen des Pagos, des Hügels, den heute die Burg Kadifekale krönt; das ältere Smyrna hatte jenseits der Bucht bei Bayraklı gestanden."
    - "Die Bibel nennt Smyrna nur in der Offenbarung, die ihm um 95 n. Chr. das zweite der sieben Sendschreiben schickt, eines der beiden ohne Tadel. In ihm spricht „der Erste und der Letzte, der tot war und ist lebendig geworden“, und es warnt vor Gefängnis und „Trübsal haben zehn Tage“ und verheißt: „Sei getreu bis an den Tod, so will ich dir die Krone des Lebens geben.“ Ramsay und Hemer lesen die Worte vor dem Hintergrund der Vergangenheit der Stadt: Strabon sagt, nachdem die Lyder das alte Smyrna zerstört hatten, hätten seine Bewohner etwa vierhundert Jahre in Dörfern gelebt, bis die neue Stadt entstand, und die Bauten rund um den Pagos wurden mit einer Krone verglichen. Andere meinen, die Bilder brauchten keinen örtlichen Schlüssel."
    - "Anfang des 2. Jahrhunderts hielt Ignatius von Antiochia auf dem Weg nach Rom in Smyrna an und schrieb später an seine Gemeinde und an ihren Bischof Polykarp. Polykarp wurde im Stadion von Smyrna verbrannt; der Bericht der Gemeinde über seinen Tod, von manchen auf etwa 155–156 datiert, von anderen später, gilt allgemein als die älteste christliche Märtyrererzählung nach dem Neuen Testament. Nach einem Erdbeben um 178 half Mark Aurel beim Wiederaufbau der Stadt, und die Säulenhallen ihrer römischen Agora aus diesem Wiederaufbau sind im Zentrum von İzmir ausgegraben."
  fr:
    - "Smyrne est Izmir, troisième ville de Turquie, au fond d’un long golfe de la côte égéenne ; le point de la carte se trouve dans la ville. Éphèse était à environ 56 km au sud à vol d’oiseau, Pergame à 79 km au nord et Sardes à 79 km à l’est : Smyrne se dressait donc là où la route côtière rencontrait la route qui remonte la vallée de l’Hermos. La ville romaine s’éleva vers 300 av. J.-C. sur les pentes du mont Pagos, la colline aujourd’hui couronnée par le château de Kadifekale ; la plus ancienne Smyrne s’était trouvée de l’autre côté de la baie, à Bayraklı."
    - "La Bible ne nomme Smyrne que dans l’Apocalypse, qui lui adresse vers 95 apr. J.-C. la deuxième des sept lettres, l’une des deux sans reproche. Elle fait parler « le premier et le dernier, celui qui était mort, et qui est revenu à la vie », avertit de la prison et d’« une tribulation de dix jours », et promet : « Sois fidèle jusqu’à la mort, et je te donnerai la couronne de vie. » Ramsay et Hemer lisent ces paroles à la lumière du passé de la ville : Strabon dit qu’après la destruction de l’ancienne Smyrne par les Lydiens, ses habitants vécurent dans des villages pendant quelque quatre cents ans avant que la nouvelle ville ne s’élève, et les bâtiments qui ceignaient le mont Pagos étaient comparés à une couronne. D’autres pensent que ces images n’ont pas besoin de clé locale."
    - "Au début du IIe siècle, Ignace d’Antioche s’arrêta à Smyrne en route pour Rome et écrivit plus tard à son Église et à son évêque Polycarpe. Polycarpe fut brûlé dans le stade de Smyrne ; le récit de sa mort par l’Église, daté par certains d’environ 155-156 et par d’autres plus tard, est généralement tenu pour le plus ancien récit de martyre chrétien après le Nouveau Testament. Après un tremblement de terre vers 178, Marc Aurèle aida à reconstruire la ville, et les colonnades de son agora romaine, issues de cette reconstruction, sont fouillées au centre d’Izmir."
  pl:
    - "Smyrna to Izmir, trzecie miasto Turcji, na końcu długiej zatoki na wybrzeżu Morza Egejskiego; punkt na mapie stoi w mieście. Efez leżał około 56 km na południe w linii prostej, Pergamon 79 km na północ, a Sardes 79 km na wschód, więc Smyrna stała tam, gdzie droga przybrzeżna spotykała się z drogą w górę doliny Hermosu. Rzymskie miasto powstało około 300 p.n.e. na stokach góry Pagos, wzgórza wieńczonego dziś zamkiem Kadifekale; starsza Smyrna stała po drugiej stronie zatoki w Bayraklı."
    - "Biblia wymienia Smyrnę tylko w Apokalipsie, która około 95 n.e. posyła jej drugi z siedmiu listów, jeden z dwóch bez nagany. Przemawia w nim „pierwszy i ostatni, który był umarł i ożył”; list ostrzega przed więzieniem i zapowiada, że będą mieli „ucisk przez dziesięć dni”, i obiecuje: „Bądź wierny aż do śmierci, a dam ci koronę żywota”. Ramsay i Hemer odczytują te słowa na tle przeszłości miasta: Strabon mówi, że po zniszczeniu starej Smyrny przez Lidyjczyków jej mieszkańcy żyli we wsiach przez około czterysta lat, zanim powstało nowe miasto, a budowle otaczające górę Pagos porównywano do korony. Inni sądzą, że obrazy nie potrzebują lokalnego klucza."
    - "Na początku II wieku Ignacy Antiocheński zatrzymał się w Smyrnie w drodze do Rzymu i później napisał do jej zboru i do jego biskupa Polikarpa. Polikarp został spalony na stadionie w Smyrnie; relacja zboru o jego śmierci, datowana przez jednych na około 155–156, a przez innych później, jest powszechnie uważana za najstarszą chrześcijańską opowieść o męczeństwie po Nowym Testamencie. Po trzęsieniu ziemi około 178 Marek Aureliusz pomógł odbudować miasto, a kolumnady jego rzymskiej agory z tej odbudowy są odkopane w centrum Izmiru."
  it:
    - "Smirne è İzmir, la terza città della Turchia, in fondo a un lungo golfo sulla costa egea; il punto della mappa si trova nella città. Efeso distava circa 56 km a sud in linea d’aria, Pergamo 79 km a nord e Sardi 79 km a est, così che Smirne sorgeva dove la strada costiera incontrava la strada che risale la valle dell’Ermo. La città romana sorse verso il 300 a.C. sulle pendici del Monte Pagos, la collina oggi coronata dal castello di Kadifekale; la vecchia Smirne si trovava dall’altra parte della baia a Bayraklı."
    - "La Bibbia nomina Smirne solo nell’Apocalisse, che intorno al 95 d.C. le manda la seconda delle sette lettere, una delle due senza rimprovero. Parla a nome di colui che è «il primo e l’ultimo, che fu morto e tornò in vita», avverte di prigione e di «una tribolazione di dieci giorni», e promette: «Sii fedele fino alla morte, e io ti darò la corona della vita». Ramsay e Hemer leggono le parole alla luce del passato della città: Strabone dice che dopo che i Lidi distrussero la vecchia Smirne i suoi abitanti vissero in villaggi per circa quattrocento anni prima che sorgesse la nuova città, e gli edifici attorno al Monte Pagos erano paragonati a una corona. Altri pensano che le immagini non richiedano alcuna chiave locale."
    - "All’inizio del II secolo Ignazio di Antiochia si fermò a Smirne mentre andava a Roma e scrisse più tardi alla sua chiesa e al suo vescovo Policarpo. Policarpo fu bruciato nello stadio di Smirne; il racconto della sua morte scritto dalla chiesa, datato da alcuni al 155–156 circa e da altri più tardi, è generalmente ritenuto la più antica storia di martirio cristiano dopo il Nuovo Testamento. Dopo un terremoto verso il 178 Marco Aurelio aiutò a ricostruire la città, e i colonnati della sua agorà romana risalenti a quella ricostruzione sono scavati nel centro di İzmir."
  cs:
    - "Smyrna je İzmir, třetí největší město Turecka, na konci dlouhého zálivu na egejském pobřeží; bod na mapě stojí ve městě. Efez byl vzdušnou čarou asi 56 km na jih, Pergamon 79 km na sever a Sardy 79 km na východ, takže Smyrna stála tam, kde se pobřežní cesta setkávala s cestou vzhůru údolím Herma. Římské město vyrostlo kolem roku 300 př. n. l. na svazích hory Pagos, pahorku nyní korunovaného hradem Kadifekale; starší Smyrna stála naproti přes záliv v Bayraklı."
    - "Bible jmenuje Smyrnu jen ve Zjevení, které jí asi roku 95 n. l. posílá druhý ze sedmi listů, jeden ze dvou bez pokárání. Mluví za toho, „ten první i poslední, kterýž byl mrtvý, a ožil“, varuje před vězením a tím, že „budete míti úzkost za deset dní“, a slibuje: „Budiž věrný až do smrti, a dámť korunu života.“ Ramsay a Hemer čtou ta slova proti minulosti města: Strabón říká, že když Lýdové starou Smyrnu zničili, její obyvatelé asi čtyři sta let žili ve vsích, než vyrostlo nové město, a stavby obklopující horu Pagos byly přirovnávány ke koruně. Jiní soudí, že obrazy místní klíč nepotřebují."
    - "Počátkem 2. století se Ignatios Antiochijský zastavil ve Smyrně na cestě do Říma a později psal její církvi a jejímu biskupu Polykarpovi. Polykarp byl spálen na stadionu ve Smyrně; zpráva církve o jeho smrti, datovaná některými zhruba do let 155–156 a jinými později, se všeobecně pokládá za nejstarší křesťanský příběh mučednictví po Novém zákoně. Po zemětřesení kolem roku 178 pomohl Marcus Aurelius město obnovit a sloupořadí jeho římské agory z této obnovy jsou vykopána ve středu İzmiru."
  nl:
    - "Smyrna is İzmir, de derde stad van Turkije, aan het binnenste uiteinde van een lange golf aan de Egeïsche kust; het punt op de kaart staat in de stad. Efeze lag hemelsbreed ongeveer 56 km naar het zuiden, Pergamum 79 km naar het noorden en Sardes 79 km naar het oosten, zodat Smyrna lag waar de kustweg de weg omhoog door het Hermusdal ontmoette. De Romeinse stad verrees omstreeks 300 v.Chr. op de hellingen van de berg Pagus, de heuvel die nu wordt bekroond door het kasteel Kadifekale; het oudere Smyrna had aan de overkant van de baai gelegen, bij Bayraklı."
    - "De Bijbel noemt Smyrna alleen in de Openbaring, die er omstreeks 95 n.Chr. de tweede van de zeven brieven naartoe stuurt, een van de twee zonder berisping. Zij spreekt namens “de Eerste en de Laatste, Die dood geweest is, en weder levend is geworden”, waarschuwt voor de gevangenis — “gij zult een verdrukking hebben van tien dagen” — en belooft: “Zijt getrouw tot den dood, en Ik zal u geven de kroon des levens.” Ramsay en Hemer lezen de woorden tegen het verleden van de stad: Strabo zegt dat het volk van het oude Smyrna, nadat de Lydiërs het hadden verwoest, ongeveer vierhonderd jaar in dorpen leefde voordat de nieuwe stad verrees, en dat de gebouwen rond de berg Pagus met een kroon werden vergeleken. Anderen menen dat de beelden geen plaatselijke sleutel nodig hebben."
    - "Vroeg in de tweede eeuw hield Ignatius van Antiochië halt te Smyrna op weg naar Rome en schreef later aan de gemeente van de stad en aan haar bisschop Polycarpus. Polycarpus werd verbrand in het stadion van Smyrna; het verslag van de kerk over zijn dood, door sommigen gedateerd omstreeks 155–156 en door anderen later, geldt algemeen als het oudste christelijke martelaarsverhaal na het Nieuwe Testament. Na een aardbeving omstreeks 178 hielp Marcus Aurelius bij de herbouw van de stad, en de zuilengangen van haar Romeinse agora uit die herbouw zijn opgegraven in het centrum van İzmir."
  sv:
    - "Smyrna är İzmir, Turkiets tredje stad, vid änden av en lång vik på Egeiska kusten; kartpunkten står i staden. Efesos låg omkring 56 km åt söder i fågelvägen, Pergamon 79 km åt norr och Sardes 79 km åt öster, så Smyrna låg där kustvägen möter vägen upp i Hermosdalen. Den romerska staden reste sig omkring 300 f.Kr. på sluttningarna av berget Pagos, kullen som nu kröns av borgen Kadifekale; det äldre Smyrna hade legat på andra sidan viken vid Bayraklı."
    - "Bibeln nämner Smyrna bara i Uppenbarelseboken, som omkring år 95 e.Kr. sänder den det andra av de sju breven, ett av de två utan tillrättavisning. Det talar för ”den förste och den siste, han som var död och åter har blivit levande”, varnar för fängelse och ”bedrövelse i tio dagar” och lovar: ”Var trogen intill döden, så skall jag giva dig livets krona.” Ramsay och Hemer läser orden mot stadens förflutna: Strabon säger att efter att lydierna förstört det gamla Smyrna levde dess folk i byar i ungefär fyrahundra år innan den nya staden reste sig, och byggnaderna kring berget Pagos liknades vid en krona. Andra menar att bilderna inte behöver någon lokal nyckel."
    - "Tidigt på 100-talet stannade Ignatios av Antiochia i Smyrna på väg till Rom och skrev senare till dess församling och till dess biskop Polykarpos. Polykarpos brändes på stadion i Smyrna; församlingens berättelse om hans död, av vissa daterad till omkring 155–156 och av andra senare, anses allmänt vara den äldsta kristna martyrberättelsen efter Nya testamentet. Efter en jordbävning omkring 178 hjälpte Marcus Aurelius till att bygga upp staden, och kolonnaderna på dess romerska agora från denna återuppbyggnad är utgrävda i İzmirs centrum."
  nb:
    - "Smyrna er İzmir, Tyrkias tredje by, innerst i en lang bukt på Egeerhavskysten; kartpunktet står i byen. Efesos lå omtrent 56 km mot sør i luftlinje, Pergamon 79 km mot nord og Sardes 79 km mot øst, så Smyrna lå der kystveien møtte veien opp Hermos-dalen. Den romerske byen reiste seg omkring 300 f.Kr. i skråningene av Pagos-fjellet, høyden som nå er kronet av borgen Kadifekale; det eldre Smyrna hadde ligget på den andre siden av bukten ved Bayraklı."
    - "Bibelen nevner Smyrna bare i Åpenbaringen, som omkring 95 e.Kr. sender den det andre av de syv brevene, ett av de to uten refselse. Det taler på vegne av «den første og den siste, han som var død og er blitt levende», advarer om fengsel og «trengsel i ti dager», og lover: «Vær tro inntil døden, så vil jeg gi dig livsens krone!» Ramsay og Hemer leser ordene mot byens fortid: Strabon sier at etter at lyderne ødela det gamle Smyrna, bodde folket i landsbyer i omtrent fire hundre år før den nye byen reiste seg, og bygningene rundt Pagos ble sammenlignet med en krone. Andre mener at bildene ikke trenger noen lokal nøkkel."
    - "Tidlig på 100-tallet stanset Ignatius av Antiokia i Smyrna på vei til Roma og skrev senere til menigheten der og til dens biskop Polykarp. Polykarp ble brent i Smyrnas stadion; menighetens beretning om hans død, datert av noen til omkring 155–156 og av andre senere, regnes alminnelig som den eldste kristne martyrfortellingen etter Det nye testamentet. Etter et jordskjelv omkring 178 hjalp Marcus Aurelius med å gjenreise byen, og søylegangene i dens romerske agora fra denne gjenoppbyggingen er gravd ut i sentrum av İzmir."
  tl:
    - "Ang Smirna ay ang İzmir, ang ikatlong lungsod ng Turkey, sa pinakaloob na dulo ng isang mahabang golpo sa baybaying Aegeo; nasa lungsod ang punto sa mapa. Ang Efeso ay mga 56 km sa timog sa tuwid na guhit, ang Pergamo 79 km sa hilaga at ang Sardis 79 km sa silangan, kaya nakatayo ang Smirna kung saan nagtagpo ang daan sa baybayin at ang daang paakyat sa lambak ng Hermus. Ang lungsod ng mga Romano ay umahon noong mga 300 BK sa mga dalisdis ng Bundok Pagus, ang burol na ngayon ay kinoronahan ng kastilyo ng Kadifekale; ang mas lumang Smirna ay nakatayo sa kabila ng look sa Bayraklı."
    - "Pinangalanan lamang ng Biblia ang Smirna sa Apocalipsis, na mga 95 AD ay nagpapadala rito ng ikalawa sa pitong liham, isa sa dalawang walang pagsaway. Ito ay sinasabi “ng una at ng huli, na namatay, at muling nabuhay”, nagbababala ng bilangguan at “kapighatiang sangpung araw”, at nangangako: “Magtapat ka hanggang sa kamatayan, at bibigyan kita ng putong ng buhay.” Binabasa nina Ramsay at Hemer ang mga salita ayon sa nakaraan ng lungsod: sinasabi ni Strabo na pagkatapos wasakin ng mga Lidio ang lumang Smirna, nanirahan ang mga tao nito sa mga nayon sa loob ng mga apat na raang taon bago bumangon ang bagong lungsod, at ang mga gusaling nakapaligid sa Bundok Pagus ay inihalintulad sa isang korona. Iniisip ng iba na hindi kailangan ng mga larawan ang susing lokal."
    - "Noong simula ng ika-2 siglo, huminto sa Smirna si Ignacio ng Antioquia patungong Roma at kalaunan ay sumulat sa iglesia nito at sa obispo nitong si Policarpo. Si Policarpo ay sinunog sa istadyum ng Smirna; ang salaysay ng iglesia tungkol sa kaniyang kamatayan, na ipinepetsa ng ilan sa mga 155–156 at ng iba nang mas huli, ay karaniwang itinuturing na pinakamatandang salaysay ng martir na Kristiyano pagkatapos ng Bagong Tipan. Pagkatapos ng lindol noong mga 178, tumulong si Marcus Aurelius sa muling pagtatayo ng lungsod, at ang mga kolonada ng agorang Romano nito mula sa muling pagtatayong iyon ay nahukay sa gitna ng İzmir."
