id: where-was-mizpah
question:
  en: "Where was Mizpah, where Samuel judged Israel?"
  ru: "Где находилась Массифа, в которой Самуил судил Израиль?"
  uk: "Де була Міцпа, де Самуїл судив Ізраїль?"
  es: "¿Dónde estaba Mizpa, donde Samuel juzgó a Israel?"
  pt: "Onde ficava Mispá, onde Samuel julgou Israel?"
  de: "Wo lag Mizpa, wo Samuel Israel richtete?"
  fr: "Où se trouvait Mitspa, où Samuel jugea Israël ?"
  pl: "Gdzie leżała Mispa, gdzie Samuel sądził Izraela?"
  it: "Dov’era Mizpa, dove Samuele giudicò Israele?"
  cs: "Kde ležela Micpa, kde Samuel soudil Izraele?"
  nl: "Waar lag Mizpa, waar Samuël Israël richtte?"
  sv: "Var låg Mispa, där Samuel dömde Israel?"
  nb: "Hvor lå Mispa, der Samuel dømte Israel?"
  tl: "Nasaan ang Mizpa, kung saan naghukom si Samuel sa Israel?"
  da: "Hvor lå Mispa, hvor Samuel dømte Israel?"
  sr: "Где је била Масфа, где је Самуило судио Израелу?"
answer:
  en:
    - "Mizpah of Benjamin, where Samuel judged Israel and Saul was chosen king, is usually identified with Tell en-Nasbeh, a low hill beside the old road north from Jerusalem, about 12 km from the city in a straight line; the map point stands there. The main alternative is Nebi Samwil, the high hill north-west of Jerusalem where a later tradition shows the tomb of Samuel. The name means “watchtower”, and the Bible has more than one Mizpah: another lay in Gilead, east of the Jordan, about 59 km away."
    - "At Mizpah all Israel gathered before the war on Benjamin, and here Samuel called the people when the Philistines pressed them: “they gathered together to Mizpeh, and drew water, and poured it out before the LORD, and fasted on that day… And Samuel judged the children of Israel in Mizpeh.” After the victory he “took a stone, and set it between Mizpeh and Shen, and called the name of it Eben-ezer, saying, Hitherto hath the LORD helped us.” Mizpah was one of the three towns of his yearly circuit with Bethel and Gilgal, and here Saul was chosen by lot. Later Asa of Judah fortified it with the stones Baasha had brought to Ramah, 4 km away; the massive wall of Tell en-Nasbeh is often linked with this work."
    - "After the Babylonians burned Jerusalem in 587 or 586 BC, Mizpah became the seat of Gedaliah, the governor they appointed: “Then went Jeremiah unto Gedaliah the son of Ahikam to Mizpah; and dwelt with him among the people that were left in the land.” There Ishmael son of Nethaniah murdered Gedaliah. William F. Badè excavated Tell en-Nasbeh in 1926–1935, and the finds fit this story: the town was not destroyed with Jerusalem and flourished in the sixth century BC, which is the strongest argument for the identification."
    - "The Mizpah of Gilead is the heap of stones where Jacob and Laban parted: “The LORD watch between me and thee, when we are absent one from another.” Jephthah came home there from his victory and his daughter came out to meet him. Its site is unknown; the map follows the proposal at Jel‘ad in the hills of Gilead, one of several candidates."
  ru:
    - "Массифа Вениаминова, где Самуил судил Израиль и где Саул был избран царём, обычно отождествляется с Телль-эн-Насбе — невысоким холмом у старой дороги из Иерусалима на север, примерно в 12 км от города по прямой; точка карты стоит там. Главная альтернатива — Неби-Самуил, высокий холм к северо-западу от Иерусалима, где позднее предание показывает гробницу Самуила. Имя означает «сторожевая башня», и Массифа в Библии не одна: другая лежала в Галааде, за Иорданом, примерно в 59 км отсюда."
    - "В Массифе собрался весь Израиль перед войной с Вениамином, и сюда Самуил созвал народ, когда теснили филистимляне: «И собрались в Массифу, и черпали воду, и проливали пред Господом, и постились в тот день… И судил Самуил сынов Израилевых в Массифе». После победы «взял Самуил один камень, и поставил между Массифою и между Сеном, и назвал его Авен-Езер, сказав: до сего места помог нам Господь». Массифа была одним из трёх городов, которые он обходил из года в год вместе с Вефилем и Галгалом, и здесь Саул был избран по жребию. Позже Аса, царь Иудейский, укрепил её камнями, которые Вааса свёз в Раму, в 4 км отсюда; с этой стройкой часто связывают мощную стену Телль-эн-Насбе."
    - "Когда вавилоняне сожгли Иерусалим в 587 или 586 г. до н. э., Массифа стала резиденцией Годолии, которого они поставили начальником: «И пришел Иеремия к Годолии, сыну Ахикама, в Массифу, и жил с ним среди народа, остававшегося в стране». Там Исмаил, сын Нафании, убил Годолию. Уильям Бейд раскапывал Телль-эн-Насбе в 1926–1935 гг., и находки согласуются с этим рассказом: город не был разрушен вместе с Иерусалимом и процветал в VI веке до н. э. — это самый сильный довод в пользу отождествления."
    - "Массифа Галаадская — это груда камней, у которой расстались Иаков и Лаван: «да надзирает Господь надо мною и над тобою, когда мы скроемся друг от друга». Туда вернулся с победы Иеффай, и навстречу ему вышла его дочь. Место её неизвестно; карта следует предположению о Джел‘аде в горах Галаада — одному из нескольких."
  uk:
    - "Міцпу Веніяминову, де Самуїл судив Ізраїль і де Саула було обрано царем, зазвичай ототожнюють із Телль-ен-Насбе, низьким пагорбом біля старої дороги на північ від Єрусалима, приблизно за 12 км від міста по прямій; точка на мапі стоїть там. Головна альтернатива — Неби-Самуїл, високий пагорб на північний захід від Єрусалима, де пізніший переказ показує гробницю Самуїла. Назва означає «сторожова вежа», і в Біблії більше ніж одна Міцпа: інша лежала в Гілеаді, на схід від Йордану, приблизно за 59 км."
    - "У Міцпі зібрався весь Ізраїль перед війною проти Веніямина, і тут Самуїл скликав народ, коли його тиснули філістимляни: «І зійшлись вони в Массифу, і черпали воду й виливали її перед Господом та постили того дня ... І судив Самуїл суд синам Ізрайлевим у Массифі.» Після перемоги він «взяв величезного каменя та й поставив його між Массифою і Сеном, і назвав його Авен-Езер, та й промовив: Ось поки Господь дав нам підмогу!» Міцпа була одним із трьох міст його щорічного обходу разом із Бет-Елом і Гілгалом, і тут жеребом було обрано Саула. Пізніше Аса Юдейський укріпив її камінням, яке Вааса звіз до Рами, за 4 км; масивний мур Телль-ен-Насбе часто пов'язують із цією роботою."
    - "Після того як вавилоняни спалили Єрусалим 587 або 586 р. до н. е., Міцпа стала осідком Гедалії, призначеного ними намісника: «І прийшов Еремія до Годолїї Ахикаменка в Массифу, й пробував із ним серед люду, що позостався в країнї.» Там Ізмаїл, син Нетанії, вбив Гедалію. Вільям Ф. Баде розкопував Телль-ен-Насбе в 1926–1935 рр., і знахідки відповідають цій оповіді: місто не було зруйноване разом з Єрусалимом і процвітало в VI ст. до н. е. — це найсильніший аргумент на користь ототожнення."
    - "Міцпа Гілеадська — це купа каміння, де розійшлися Яків і Лаван: «Нехай вартує Господь між мною й тобою, як ми розійдемось різно одни з одним.» Єфтай повернувся туди зі своєї перемоги, і назустріч йому вийшла його дочка. Її місце невідоме; мапа слідує пропозиції Джель'ад у пагорбах Гілеаду, одному з кількох кандидатів."
  es:
    - "Mizpa de Benjamín, donde Samuel juzgó a Israel y Saúl fue elegido rey, se identifica por lo común con Tell en-Nasbeh, una colina baja junto al antiguo camino que sale hacia el norte de Jerusalén, a unos 12 km de la ciudad en línea recta; el punto del mapa está allí. La principal alternativa es Nebi Samwil, la alta colina al noroeste de Jerusalén donde una tradición posterior muestra la tumba de Samuel. El nombre significa «atalaya», y la Biblia tiene más de una Mizpa: otra estaba en Galaad, al este del Jordán, a unos 59 km."
    - "En Mizpa se reunió todo Israel antes de la guerra contra Benjamín, y aquí convocó Samuel al pueblo cuando lo acosaban los filisteos: «juntándose en Mizpa, sacaron agua, y derramáronla delante de Jehová, y ayunaron aquel día… Y juzgó Samuel á los hijos de Israel en Mizpa». Tras la victoria, «tomó luego Samuel una piedra, y púsola entre Mizpa y Sen, y púsole por nombre Eben-ezer, diciendo: Hasta aquí nos ayudó Jehová». Mizpa era una de las tres ciudades de su recorrido anual, con Betel y Gilgal, y aquí fue elegido Saúl por suerte. Más tarde, Asa de Judá la fortificó con las piedras que Baasa había llevado a Ramá, a 4 km de distancia; la maciza muralla de Tell en-Nasbeh suele vincularse con esta obra."
    - "Después de que los babilonios incendiaran Jerusalén en 587 o 586 a. C., Mizpa fue la sede de Gedalías, el gobernador que ellos nombraron: «Fuése entonces Jeremías á Gedalías hijo de Ahicam, á Mizpa, y moró con él en medio del pueblo que había quedado en la tierra». Allí Ismael, hijo de Netanías, asesinó a Gedalías. William F. Badè excavó Tell en-Nasbeh en 1926–1935, y los hallazgos encajan con este relato: la ciudad no fue destruida con Jerusalén y floreció en el siglo VI a. C., que es el argumento más fuerte a favor de la identificación."
    - "La Mizpa de Galaad es el montón de piedras donde se separaron Jacob y Labán: «Atalaye Jehová entre mí y entre ti, cuando nos apartáremos el uno del otro». Jefté volvió allí a su casa tras su victoria y su hija salió a recibirlo. Su emplazamiento se desconoce; el mapa sigue la propuesta de Jel‘ad, en las colinas de Galaad, uno de varios candidatos."
  pt:
    - "Mispá de Benjamim, onde Samuel julgou Israel e Saul foi escolhido rei, é geralmente identificada com Tell en-Nasbeh, uma colina baixa junto à antiga estrada para o norte a partir de Jerusalém, a cerca de 12 km da cidade em linha reta; o ponto do mapa fica ali. A principal alternativa é Nebi Samwil, a colina alta a noroeste de Jerusalém onde uma tradição posterior mostra o túmulo de Samuel. O nome significa “torre de vigia”, e a Bíblia tem mais de uma Mispá: outra ficava em Gileade, a leste do Jordão, a cerca de 59 km."
    - "Em Mispá todo o Israel se reuniu antes da guerra contra Benjamim, e aqui Samuel convocou o povo quando os filisteus o pressionavam: “eles se reuniram em Mispá, tiraram água e a derramaram perante o SENHOR; jejuaram naquele dia… E Samuel julgou os filhos de Israel em Mispá.” Depois da vitória, “Samuel pegou uma pedra, colocou-a entre Mispá e Sem, e lhe deu o nome de Ebenézer, dizendo: Até aqui o SENHOR nos ajudou.” Mispá era uma das três cidades do seu circuito anual, com Betel e Gilgal, e aqui Saul foi escolhido por sorteio. Mais tarde, Asa de Judá a fortificou com as pedras que Baasa havia levado a Ramá, a 4 km; a maciça muralha de Tell en-Nasbeh é muitas vezes ligada a essa obra."
    - "Depois que os babilônios queimaram Jerusalém, em 587 ou 586 a.C., Mispá tornou-se a sede de Gedalias, o governador que eles nomearam: “Jeremias foi a Gedalias, filho de Aicão, a Mispá, e morou com ele entre o povo que havia sido deixado na terra.” Ali Ismael, filho de Netanias, assassinou Gedalias. William F. Badè escavou Tell en-Nasbeh em 1926–1935, e os achados concordam com esta história: a cidade não foi destruída com Jerusalém e floresceu no século VI a.C., o que é o argumento mais forte a favor da identificação."
    - "A Mispá de Gileade é o monte de pedras onde Jacó e Labã se separaram: “O SENHOR vigie entre mim e você, quando estivermos ausentes um do outro.” Jefté voltou para casa ali, depois da sua vitória, e sua filha saiu ao seu encontro. Seu sítio é desconhecido; o mapa segue a proposta de Jel‘ad, nas colinas de Gileade, um dos vários candidatos."
  de:
    - "Das benjaminitische Mizpa, wo Samuel Israel richtete und Saul zum König erwählt wurde, wird meist mit Tell en-Nasbeh gleichgesetzt, einem niedrigen Hügel an der alten Straße nach Norden von Jerusalem, in der Luftlinie etwa 12 km von der Stadt entfernt; dort steht der Kartenpunkt. Die wichtigste Alternative ist Nebi Samwil, der hohe Hügel nordwestlich von Jerusalem, wo eine spätere Überlieferung das Grab Samuels zeigt. Der Name bedeutet „Wachturm“, und die Bibel kennt mehr als ein Mizpa: ein weiteres lag in Gilead östlich des Jordans, etwa 59 km entfernt."
    - "In Mizpa versammelte sich ganz Israel vor dem Krieg gegen Benjamin, und hier rief Samuel das Volk zusammen, als die Philister es bedrängten: „Und sie kamen zusammen gen Mizpa und schöpften Wasser und gossen's aus vor dem HERRN und fasteten denselben Tag … Also richtete Samuel die Kinder Israel zu Mizpa.“ Nach dem Sieg „nahm Samuel einen Stein und setzte ihn zwischen Mizpa und Sen und hieß ihn Eben-Ezer und sprach: Bis hierher hat uns der HERR geholfen.“ Mizpa gehörte mit Bethel und Gilgal zu den drei Orten seines jährlichen Rundgangs, und hier wurde Saul durchs Los erwählt. Später befestigte Asa von Juda es mit den Steinen, die Baesa nach Rama, 4 km entfernt, gebracht hatte; die massive Mauer von Tell en-Nasbeh wird oft mit diesem Werk verbunden."
    - "Nachdem die Babylonier Jerusalem 587 oder 586 v. Chr. verbrannt hatten, wurde Mizpa Sitz Gedaljas, des von ihnen eingesetzten Statthalters: „Also kam Jeremia zu Gedalja, dem Sohn Ahikams, gen Mizpa und blieb bei ihm unter dem Volk, das im Lande noch übrig war.“ Dort ermordete Ismael, der Sohn Netanjas, den Gedalja. William F. Badè grub Tell en-Nasbeh 1926–1935 aus, und die Funde passen zu dieser Geschichte: Die Stadt wurde nicht mit Jerusalem zerstört und blühte im 6. Jahrhundert v. Chr., was das stärkste Argument für die Gleichsetzung ist."
    - "Das Mizpa in Gilead ist der Steinhaufen, an dem sich Jakob und Laban trennten: „Der HERR sehe darein zwischen mir und dir, wenn wir voneinander kommen.“ Jeftah kam dort von seinem Sieg heim, und seine Tochter ging ihm entgegen. Seine Lage ist unbekannt; die Karte folgt dem Vorschlag Dschal‘ad in den Bergen Gileads, einem von mehreren Kandidaten."
  fr:
    - "Mitspa de Benjamin, où Samuel jugea Israël et où Saül fut choisi comme roi, est généralement identifiée à Tell en-Nasbeh, une colline basse au bord de l’ancienne route qui monte vers le nord depuis Jérusalem, à environ 12 km de la ville à vol d’oiseau ; le point de la carte s’y trouve. La principale autre possibilité est Nebi Samwil, la haute colline au nord-ouest de Jérusalem où une tradition plus tardive montre le tombeau de Samuel. Le nom signifie « tour de guet », et la Bible connaît plus d’une Mitspa : une autre se trouvait en Galaad, à l’est du Jourdain, à environ 59 km."
    - "À Mitspa, tout Israël se rassembla avant la guerre contre Benjamin, et c’est là que Samuel convoqua le peuple quand les Philistins le pressaient : « Et ils s’assemblèrent à Mitspa. Ils puisèrent de l’eau et la répandirent devant l’Éternel, et ils jeûnèrent ce jour-là… Samuel jugea les enfants d’Israël à Mitspa. » Après la victoire, « Samuel prit une pierre, qu’il plaça entre Mitspa et Schen, et il l’appela du nom d’Ében-Ézer, en disant : Jusqu’ici l’Éternel nous a secourus. » Mitspa était l’une des trois villes de sa tournée annuelle, avec Béthel et Guilgal, et c’est là que Saül fut désigné par le sort. Plus tard, Asa de Juda la fortifia avec les pierres que Baescha avait amenées à Rama, à 4 km de là ; le massif rempart de Tell en-Nasbeh est souvent rattaché à ces travaux."
    - "Après que les Babyloniens eurent incendié Jérusalem en 587 ou 586 av. J.-C., Mitspa devint le siège de Guedalia, le gouverneur qu’ils avaient établi : « Jérémie alla vers Guedalia, fils d’Achikam, à Mitspa, et il resta avec lui parmi le peuple qui était demeuré dans le pays. » C’est là qu’Ismaël, fils de Nethania, assassina Guedalia. William F. Badè fouilla Tell en-Nasbeh en 1926-1935, et les trouvailles s’accordent avec ce récit : la ville ne fut pas détruite avec Jérusalem et prospéra au VIe siècle av. J.-C., ce qui est le meilleur argument en faveur de l’identification."
    - "La Mitspa de Galaad est le monceau de pierres où Jacob et Laban se séparèrent : « Que l’Éternel veille sur toi et sur moi, quand nous nous serons l’un et l’autre perdus de vue. » Jephté y rentra après sa victoire, et sa fille vint au-devant de lui. Son emplacement est inconnu ; la carte suit la proposition de Jel‘ad, dans les collines de Galaad, l’un de plusieurs candidats."
  pl:
    - "Mispa Beniaminowa, gdzie Samuel sądził Izraela i gdzie wybrano Saula na króla, jest zwykle utożsamiana z Tell en-Nasbeh, niskim wzgórzem przy dawnej drodze na północ od Jerozolimy, około 12 km od miasta w linii prostej; tam stoi punkt na mapie. Główną alternatywą jest Nebi Samwil, wysokie wzgórze na północny zachód od Jerozolimy, gdzie późniejsza tradycja pokazuje grób Samuela. Nazwa oznacza „wieżę strażniczą”, a Biblia zna więcej niż jedną Mispę: inna leżała w Gileadzie, na wschód od Jordanu, około 59 km stąd."
    - "W Mispie zgromadził się cały Izrael przed wojną z Beniaminem, i tu Samuel wezwał lud, gdy naciskali go Filistyni: „zgromadzili się do Masfa, a czerpając wodę, wylewali przed Panem, i pościli tam dnia onego… I sądził Samuel syny Izraelskie w Masfa”. Po zwycięstwie „wziął Samuel kamień jeden, i postawił go między Masfa a między Sen, i nazwał imię jego Ebenezer, mówiąc: Aż póty pomagał nam Pan”. Mispa była jednym z trzech miast jego rocznego objazdu, obok Betel i Gilgal, i tu losem wybrano Saula. Później Asa z Judy ufortyfikował ją kamieniami, które Baasza przywiózł do Rama, 4 km stąd; z tą pracą często łączy się masywny mur Tell en-Nasbeh."
    - "Gdy Babilończycy spalili Jerozolimę w 587 lub 586 p.n.e., Mispa stała się siedzibą Gedaliasza, mianowanego przez nich namiestnika: „Przyszedł tedy Jeremijasz do Godolijasza, syna Ahikamowego, do Masfy, i mieszkał z nim w pośród ludu, który był pozostał w ziemi”. Tam Izmael, syn Netaniasza, zamordował Gedaliasza. William F. Badè prowadził wykopaliska w Tell en-Nasbeh w latach 1926–1935, a znaleziska pasują do tej opowieści: miasto nie zostało zniszczone razem z Jerozolimą i rozkwitało w VI wieku p.n.e., co jest najsilniejszym argumentem za utożsamieniem."
    - "Mispa w Gileadzie to kopiec kamieni, gdzie rozstali się Jakub i Laban: „Niech upatruje Pan między mną i między tobą, gdy się rozejdziemy jeden od drugiego”. Jefte wrócił tam do domu po swoim zwycięstwie, a jego córka wyszła mu na spotkanie. Jej położenie jest nieznane; mapa idzie za propozycją w Jel‘ad na wzgórzach Gileadu, jednym z kilku kandydatów."
  it:
    - "Mizpa di Beniamino, dove Samuele giudicò Israele e Saul fu scelto come re, si identifica di solito con Tell en-Nasbeh, una bassa collina accanto all’antica strada che va a nord da Gerusalemme, a circa 12 km dalla città in linea d’aria; il punto della mappa si trova lì. La principale alternativa è Nebi Samwil, l’alta collina a nord-ovest di Gerusalemme dove una tradizione posteriore mostra la tomba di Samuele. Il nome significa «torre di guardia», e la Bibbia ha più di una Mizpa: un’altra si trovava in Galaad, a est del Giordano, a circa 59 km di distanza."
    - "A Mizpa tutto Israele si radunò prima della guerra contro Beniamino, e qui Samuele chiamò il popolo quando i Filistei lo incalzavano: «Ed essi si adunarono a Mitspa, attinsero dell’acqua e la sparsero davanti all’Eterno, e digiunarono quivi quel giorno… E Samuele fece la funzione di giudice d’Israele a Mitspa». Dopo la vittoria «prese una pietra, la pose tra Mitspa e Scen, e la chiamò Eben-Ezer, dicendo: Fin qui l’Eterno ci ha soccorsi». Mizpa era una delle tre città del suo giro annuale, con Betel e Gàlgala, e qui Saul fu scelto per sorteggio. Più tardi Asa di Giuda la fortificò con le pietre che Baasa aveva portato a Rama, a 4 km di distanza; la massiccia muraglia di Tell en-Nasbeh è spesso collegata a questo lavoro."
    - "Dopo che i Babilonesi incendiarono Gerusalemme nel 587 o 586 a.C., Mizpa divenne la sede di Godolia, il governatore da loro nominato: «E Geremia andò da Ghedalia, figliuolo di Ahikam, a Mitspa, e dimorò con lui in mezzo al popolo che era rimasto nel paese». Là Ismaele figlio di Netania assassinò Godolia. William F. Badè scavò Tell en-Nasbeh nel 1926–1935, e i ritrovamenti si accordano con questo racconto: la città non fu distrutta con Gerusalemme e fiorì nel VI secolo a.C., che è l’argomento più forte a favore dell’identificazione."
    - "La Mizpa di Galaad è il mucchio di pietre dove Giacobbe e Laban si separarono: «L’Eterno tenga l’occhio su me e su te quando non ci potremo vedere l’un l’altro». Iefte tornò là a casa dalla sua vittoria e sua figlia gli uscì incontro. Il suo sito è sconosciuto; la mappa segue la proposta di Jel‘ad nelle colline di Galaad, uno dei vari candidati."
  cs:
    - "Micpa Benjamínova, kde Samuel soudil Izraele a byl zvolen králem Saul, se obvykle ztotožňuje s Tell en-Nasbeh, nízkým pahorkem u staré cesty na sever od Jeruzaléma, vzdušnou čarou asi 12 km od města; bod na mapě stojí tam. Hlavní alternativou je Nebi Samwil, vysoký pahorek severozápadně od Jeruzaléma, kde pozdější tradice ukazuje Samuelův hrob. Jméno znamená „strážní věž“ a Bible zná více než jednu Micpu: jiná ležela v Gileadu, východně od Jordánu, asi 59 km daleko."
    - "V Micpě se shromáždil všechen Izrael před válkou proti Benjamínovi a sem svolal Samuel lid, když na něj tlačili Pelištejci: „shromáždili se do Masfa, a vážíce vodu, vylévali před Hospodinem, a postíce se v ten den… A soudil Samuel syny Izraelské v Masfa.“ Po vítězství „vzav Samuel kámen jeden, položil jej mezi Masfa a mezi Sen, a nazval jméno jeho Eben-Ezer; nebo řekl: Až potud pomáhal nám Hospodin.“ Micpa byla jedním ze tří měst jeho výročního obchůzkového okruhu spolu s Bét-elem a Gilgalem a zde byl losem zvolen Saul. Později ji Asa Judský opevnil kameny, které Baeša přivezl do Rámy, 4 km daleko; mohutná hradba Tell en-Nasbeh se s touto prací často spojuje."
    - "Poté, co Babyloňané roku 587 nebo 586 př. n. l. vypálili Jeruzalém, se Micpa stala sídlem Gedaljáše, správce, jehož ustanovili: „Takž přišel Jeremiáš k Godoliášovi synu Achikamovu do Masfa, a bydlil s ním u prostřed lidu pozůstalého v zemi.“ Tam Jišmael, syn Netanjášův, Gedaljáše zavraždil. William F. Badè vykopával Tell en-Nasbeh v letech 1926–1935 a nálezy tomuto příběhu odpovídají: město nebylo zničeno spolu s Jeruzalémem a vzkvétalo v 6. století př. n. l., což je nejsilnější argument pro ztotožnění."
    - "Micpa Gileadská je hromada kamení, kde se rozešli Jákob a Laban: „Nechať Hospodin hledí na mne a na tebe, když se rozejdeme od sebe.“ Jiftách se tam vrátil domů z vítězství a vyšla mu naproti jeho dcera. Její místo je neznámé; mapa sleduje návrh Jel‘ad v pahorcích Gileadu, jednoho z několika kandidátů."
  nl:
    - "Mizpa van Benjamin, waar Samuël Israël richtte en Saul tot koning werd gekozen, wordt gewoonlijk geïdentificeerd met Tell en-Nasbeh, een lage heuvel naast de oude weg naar het noorden vanuit Jeruzalem, hemelsbreed ongeveer 12 km van die stad; daar staat het punt op de kaart. Het voornaamste alternatief is Nebi Samwil, de hoge heuvel ten noordwesten van Jeruzalem waar een latere overlevering het graf van Samuël toont. De naam betekent “wachttoren”, en de Bijbel kent meer dan één Mizpa: een ander lag in Gilead, ten oosten van de Jordaan, ongeveer 59 km verderop."
    - "Te Mizpa verzamelde heel Israël zich vóór de oorlog tegen Benjamin, en hier riep Samuël het volk toen de Filistijnen hen bedrukten: “Zij werden vergaderd te Mizpa, en zij schepten water, en goten het uit voor het aangezicht des HEEREN; en zij vastten te dien dage… Alzo richtte Samuel de kinderen Israels te Mizpa.” Na de overwinning “Samuel nu nam een steen, en stelde dien tussen Mizpa en tussen Sen, en hij noemde diens naam Eben-Haezer; en hij zeide: Tot hiertoe heeft de HEERE ons geholpen.” Mizpa was met Bethel en Gilgal een van de drie steden van zijn jaarlijkse rondgang, en hier werd Saul door het lot gekozen. Later versterkte Asa van Juda het met de stenen die Baësa naar Rama, 4 km verderop, had gebracht; de massieve muur van Tell en-Nasbeh wordt vaak met dit werk in verband gebracht."
    - "Nadat de Babyloniërs Jeruzalem in 587 of 586 v.Chr. hadden verbrand, werd Mizpa de zetel van Gedalja, de door hen aangestelde stadhouder: “Alzo kwam Jeremia tot Gedalia, den zoon van Ahikam, te Mizpa; en hij woonde bij hem in het midden des volks, die in het land waren overgelaten.” Daar vermoordde Ismaël, de zoon van Netanja, Gedalja. William F. Badè groef Tell en-Nasbeh op in 1926–1935, en de vondsten passen bij dit verhaal: de stad werd niet met Jeruzalem verwoest en bloeide in de zesde eeuw v.Chr., wat het sterkste argument voor de identificatie is."
    - "Het Mizpa van Gilead is de steenhoop waar Jakob en Laban afscheid van elkaar namen: “Dat de HEERE opzicht neme tussen mij en tussen u, wanneer wij de een van den ander zullen verborgen zijn!” Jefta kwam daar thuis van zijn overwinning en zijn dochter kwam hem tegemoet. De plaats is onbekend; de kaart volgt het voorstel bij Jel‘ad in de heuvels van Gilead, een van meerdere kandidaten."
  sv:
    - "Benjamins Mispa, där Samuel dömde Israel och Saul utsågs till kung, identifieras vanligen med Tell en-Nasbeh, en låg kulle bredvid den gamla vägen norrut från Jerusalem, omkring 12 km från staden i fågelvägen; kartpunkten står där. Det främsta alternativet är Nebi Samwil, den höga kullen nordväst om Jerusalem där en senare tradition visar Samuels grav. Namnet betyder ”vakttorn”, och Bibeln har mer än en Mispa: en annan låg i Gilead, öster om Jordan, omkring 59 km bort."
    - "I Mispa samlades hela Israel före kriget mot Benjamin, och här kallade Samuel samman folket när filistéerna ansatte dem: ”Då församlade de sig i Mispa och öste upp vatten och göto ut det inför HERREN och fastade den dagen … Och Samuel dömde Israels barn i Mispa.” Efter segern ”tog Samuel en sten och reste den mellan Mispa och Sen och gav den namnet Eben-Haeser, i det han sade: ’Allt härintill har HERREN hjälpt oss.’” Mispa var en av de tre städerna på hans årliga rundresa, tillsammans med Betel och Gilgal, och här utsågs Saul genom lottkastning. Senare befäste Asa av Juda den med stenarna som Basha hade fört till Rama, 4 km bort; Tell en-Nasbehs massiva mur förknippas ofta med detta arbete."
    - "Sedan babylonierna brände Jerusalem 587 eller 586 f.Kr. blev Mispa säte för Gedalja, den ståthållare de utsett: ”Så begav sig då Jeremia till Gedalja, Ahikams son, i Mispa och stannade hos honom bland folket som var kvar i landet.” Där mördade Ismael, Netanjas son, Gedalja. William F. Badè grävde ut Tell en-Nasbeh 1926–1935, och fynden stämmer med denna berättelse: staden förstördes inte tillsammans med Jerusalem och blomstrade på 500-talet f.Kr., vilket är det starkaste argumentet för identifieringen."
    - "Gileads Mispa är stenhögen där Jakob och Laban skildes åt: ”HERREN vare väktare mellan mig och dig, när vi icke mer se varandra.” Jefta kom hem dit från sin seger, och hans dotter gick ut för att möta honom. Platsens läge är okänt; kartan följer förslaget Jel‘ad i Gileads berg, en av flera kandidater."
  nb:
    - "Mispa i Benjamin, der Samuel dømte Israel og Saul ble valgt til konge, identifiseres vanligvis med Tell en-Nasbeh, en lav høyde ved den gamle veien nordover fra Jerusalem, omtrent 12 km fra byen i luftlinje; kartpunktet står der. Det viktigste alternativet er Nebi Samwil, den høye høyden nordvest for Jerusalem, der en senere tradisjon viser Samuels grav. Navnet betyr «vakttårn», og Bibelen har mer enn én Mispa: en annen lå i Gilead, øst for Jordan, omtrent 59 km unna."
    - "I Mispa samlet hele Israel seg før krigen mot Benjamin, og her kalte Samuel folket sammen da filistrene presset dem: «Så samlet de sig i Mispa, og de øste op vann og helte det ut for Herrens åsyn, og de fastet den dag … Og Samuel dømte Israels barn i Mispa.» Etter seieren heter det: «Samuel tok en sten og satte den imellem Mispa og Sen; denne sten kalte han Eben-Eser og sa: Hittil har Herren hjulpet oss.» Mispa var en av de tre byene på hans årlige rundreise, sammen med Betel og Gilgal, og her ble Saul valgt ved loddkasting. Senere befestet Asa av Juda den med steinene som Basja hadde brakt til Rama, 4 km unna; den massive muren ved Tell en-Nasbeh knyttes ofte til dette arbeidet."
    - "Etter at babylonerne brente Jerusalem i 587 eller 586 f.Kr., ble Mispa sete for Gedalja, landsstyreren de innsatte: «Og Jeremias kom til Gedalja, Akikams sønn, i Mispa, og han blev hos ham midt iblandt folket, blandt dem som var blitt tilbake i landet.» Der myrdet Ismael, Netanjas sønn, Gedalja. William F. Badè gravde ut Tell en-Nasbeh i 1926–1935, og funnene passer til denne fortellingen: byen ble ikke ødelagt sammen med Jerusalem og blomstret på 500-tallet f.Kr., som er det sterkeste argumentet for identifiseringen."
    - "Mispa i Gilead er steinhaugen der Jakob og Laban skiltes: «Herren holde vakt mellem mig og dig, når vi kommer hverandre av syne.» Jefta kom hjem dit fra sin seier, og hans datter gikk ut for å møte ham. Stedet er ukjent; kartet følger forslaget om Jel‘ad i Gileads åser, en av flere kandidater."
  tl:
    - "Ang Mizpa ng Benjamin, kung saan naghukom si Samuel sa Israel at pinili si Saul bilang hari, ay karaniwang kinikilala sa Tell en-Nasbeh, isang mababang burol sa tabi ng lumang daan patungong hilaga mula sa Jerusalem, mga 12 km mula sa lungsod sa tuwid na guhit; naroon ang punto sa mapa. Ang pangunahing alternatibo ay ang Nebi Samwil, ang mataas na burol sa hilagang-kanluran ng Jerusalem kung saan ipinakikita ng huling tradisyon ang libingan ni Samuel. Ang pangalan ay nangangahulugang “tore ng bantay”, at higit sa isa ang Mizpa sa Biblia: ang isa pa ay nasa Gilead, sa silangan ng Jordan, mga 59 km ang layo."
    - "Sa Mizpa nagtipon ang buong Israel bago ang digmaan laban sa Benjamin, at dito tinawag ni Samuel ang bayan nang pinipilit sila ng mga Filisteo: “sila'y nagtitipon sa Mizpa, at nagsiigib ng tubig, at ibinuhos sa harap ng Panginoon, at nagsipagayuno nang araw na yaon… At naghukom si Samuel sa mga anak ni Israel sa Mizpa.” Pagkatapos ng tagumpay, “kumuha si Samuel ng isang bato, at inilagay sa pagitan ng Mizpa at ng Sen, at tinawag ang pangalan niyaon na Ebenezer, na sinasabi, Hanggang dito'y tinulungan tayo ng Panginoon.” Ang Mizpa ay isa sa tatlong bayan ng kaniyang taunang paglilibot kasama ang Beth-el at Gilgal, at dito pinili si Saul sa pamamagitan ng palabunutan. Nang maglaon, pinatibay ito ni Asa ng Juda ng mga batong dinala ni Baasa sa Rama, 4 km ang layo; ang napakalaking pader ng Tell en-Nasbeh ay madalas iniuugnay sa gawaing ito."
    - "Pagkatapos sunugin ng mga Babilonio ang Jerusalem noong 587 o 586 BK, ang Mizpa ang naging luklukan ni Gedalias, ang gobernador na itinalaga nila: “Nang magkagayo'y naparoon si Jeremias kay Gedalias na anak ni Ahicam sa Mizpa, at tumahang kasama niya sa gitna ng bayan na naiwan sa lupain.” Doon pinatay ni Ismael na anak ni Nethanias si Gedalias. Hinukay ni William F. Badè ang Tell en-Nasbeh noong 1926–1935, at ang mga natagpuan ay umaayon sa kuwentong ito: hindi nawasak ang bayan kasama ng Jerusalem at umunlad noong ika-6 na siglo BK, na siyang pinakamatibay na argumento para sa pagkakakilanlan."
    - "Ang Mizpa ng Gilead ay ang bunton ng mga bato kung saan naghiwalay sina Jacob at Laban: “Bantayan ng Panginoon ako at ikaw, pag nagkakahiwalay tayo.” Umuwi roon si Jephte mula sa kaniyang tagumpay at lumabas ang kaniyang anak na babae upang salubungin siya. Hindi alam ang pook nito; sinusunod ng mapa ang mungkahi sa Jel‘ad sa mga burol ng Gilead, isa sa ilang kandidato."
  da:
    - "Benjamins Mispa, hvor Samuel dømte Israel, og Saul blev valgt til konge, identificeres sædvanligvis med Tell en-Nasbeh, en lav høj ved siden af den gamle vej nordpå fra Jerusalem, ca. 12 km fra byen i fugleflugt; kortets punkt står der. Det vigtigste alternativ er Nebi Samwil, den høje bakke nordvest for Jerusalem, hvor en senere tradition viser Samuels grav. Navnet betyder »vagttårn«, og Bibelen har mere end ét Mispa: Et andet lå i Gilead, øst for Jordan, ca. 59 km væk."
    - "Ved Mispa samledes hele Israel før krigen mod Benjamin, og her kaldte Samuel folket sammen, da filisterne trængte dem: »de samledes til Mizpa, og de droge Vand op og udøste det for Herrens Ansigt og fastede paa samme Dag … og Samuel dømte Israels Børn i Mizpa.« Efter sejren »tog Samuel en Sten og satte den imellem Mizpa og imellem Sen og kaldte dens Navn Eben-Ezer; og han sagde: Hidindtil har Herren hjulpet os.« Mispa var en af de tre byer på hans årlige rundrejse sammen med Betel og Gilgal, og her blev Saul valgt ved lodtrækning. Senere befæstede Asa af Juda den med de sten, Basja havde ført til Rama, 4 km væk; Tell en-Nasbehs massive mur knyttes ofte til dette arbejde."
    - "Efter at babylonierne brændte Jerusalem i 587 eller 586 f.Kr., blev Mispa sæde for Gedalja, den guvernør, de indsatte: »Saa kom Jeremias til Gedalia, Ahikams Søn, til Mizpa, og han boede hos ham midt iblandt Folket, som var blevet tilbage i Landet.« Dér myrdede Ismael, Netanjas søn, Gedalja. William F. Badè udgravede Tell en-Nasbeh i 1926-1935, og fundene passer til denne beretning: Byen blev ikke ødelagt sammen med Jerusalem og blomstrede i 500-tallet f.Kr., hvilket er det stærkeste argument for identifikationen."
    - "Gileads Mispa er stendyngen, hvor Jakob og Laban skiltes: »Herren skal se til imellem mig og imellem dig; thi vi komme hverandre af Syne.« Jefta kom hjem dertil efter sin sejr, og hans datter kom ud for at møde ham. Dets beliggenhed er ukendt; kortet følger forslaget ved Jel’ad i Gileads bjerge, en af flere kandidater."
  sr:
    - "Масфа Венијаминова, где је Самуило судио Израелу и где је Саул изабран за краља, обично се поистовећује са Тел ен-Насбехом, ниским брдом поред старог пута на север од Јерусалима, око 12 км од града ваздушном линијом; тачка на карти стоји ту. Главна алтернатива је Неби Самвил, високо брдо северозападно од Јерусалима где каснија традиција показује Самуилов гроб. Име значи „стражарница“, а Библија познаје више од једне Масфе: друга је лежала у Галаду, источно од Јордана, око 59 км далеко."
    - "У Масфи се сав Израел окупио пред рат против Венијамина, и овде је Самуило сазвао народ кад су га притискали Филистеји: „И скупише се у Миспу, и црпући воду проливаше пред Господом, и постише онај дан… И Самуило суђаше синовима Израиљевим у Миспи.“ После победе: „Тада узе Самуило камен, и метну га између Миспе и Сена, и назва га Евен-Езер, јер рече: Довде нам Господ поможе.“ Масфа је била један од три града његовог годишњег обиласка, заједно са Ветиљем и Галгалом, а овде је Саул изабран жребом. Касније ју је Аса Јудин утврдио камењем које је Васа довукао у Раму, удаљену 4 км; масивни зид Тел ен-Насбеха често се доводи у везу са тим радом."
    - "Пошто су Вавилонци спалили Јерусалим 587. или 586. п. н. е., Масфа је постала седиште Годолије, намесника кога су поставили: „И тако дође Јеремија ка Годолији, сину Ахикамовом у Миспу, и оста с њим у народу, који још оста у земљи.“ Ту је Исмаило, син Нетаније, убио Годолију. Вилијам Ф. Баде ископавао је Тел ен-Насбех 1926–1935, а налази одговарају овој причи: град није разорен са Јерусалимом и цветао је у шестом веку п. н. е., што је најјачи аргумент за поистовећење."
    - "Масфа Галадска је гомила камења где су се Јаков и Лаван раздвојили: „Нека Господ гледа између мене и тебе, кад не узможемо видети један другог.“ Јефтај се ту вратио кући из своје победе и његова кћи изашла му је у сусрет. Њен положај је непознат; карта прати предлог у Јеладу у галадским брдима, једном од неколико кандидата."
