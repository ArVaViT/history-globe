id: where-was-mizpah
question:
  en: "Where was Mizpah, where Samuel judged Israel?"
  ru: "Где находилась Массифа, в которой Самуил судил Израиль?"
  uk: "Де була Міцпа, де Самуїл судив Ізраїль?"
  es: "¿Dónde estaba Mizpa, donde Samuel juzgó a Israel?"
  pt: "Onde ficava Mispá, onde Samuel julgou Israel?"
  de: "Wo lag Mizpa, wo Samuel Israel richtete?"
  fr: "Où se trouvait Mitspa, où Samuel jugea Israël ?"
answer:
  en:
    - "Mizpah of Benjamin, where Samuel judged Israel and Saul was chosen king, is usually identified with Tell en-Nasbeh, a low hill beside the old road north from Jerusalem, about 12 km from the city in a straight line; the map point stands there. The main alternative is Nebi Samwil, the high hill north-west of Jerusalem where a later tradition shows the tomb of Samuel. The name means “watchtower”, and the Bible has more than one Mizpah: another lay in Gilead, east of the Jordan, about 59 km away."
    - "At Mizpah all Israel gathered before the war on Benjamin, and here Samuel called the people when the Philistines pressed them: “they gathered together to Mizpeh, and drew water, and poured it out before the LORD, and fasted on that day… And Samuel judged the children of Israel in Mizpeh.” After the victory he “took a stone, and set it between Mizpeh and Shen, and called the name of it Eben-ezer, saying, Hitherto hath the LORD helped us.” Mizpah was one of the three towns of his yearly circuit with Bethel and Gilgal, and here Saul was chosen by lot. Later Asa of Judah fortified it with the stones Baasha had brought to Ramah, 4 km away; the massive wall of Tell en-Nasbeh is often linked with this work."
    - "After the Babylonians burned Jerusalem in 587 or 586 BC, Mizpah became the seat of Gedaliah, the governor they appointed: “Then went Jeremiah unto Gedaliah the son of Ahikam to Mizpah; and dwelt with him among the people that were left in the land.” There Ishmael son of Nethaniah murdered Gedaliah. William F. Badè excavated Tell en-Nasbeh in 1926–1935, and the finds fit this story: the town was not destroyed with Jerusalem and flourished in the sixth century BC, which is the strongest argument for the identification."
    - "The Mizpah of Gilead is the heap of stones where Jacob and Laban parted: “The LORD watch between me and thee, when we are absent one from another.” Jephthah came home there from his victory and his daughter came out to meet him. Its site is unknown; the map follows the proposal at Jel‘ad in the hills of Gilead, one of several candidates."
  ru:
    - "Массифа Вениаминова, где Самуил судил Израиль и где Саул был избран царём, обычно отождествляется с Телль-эн-Насбе — невысоким холмом у старой дороги из Иерусалима на север, примерно в 12 км от города по прямой; точка карты стоит там. Главная альтернатива — Неби-Самуил, высокий холм к северо-западу от Иерусалима, где позднее предание показывает гробницу Самуила. Имя означает «сторожевая башня», и Массифа в Библии не одна: другая лежала в Галааде, за Иорданом, примерно в 59 км отсюда."
    - "В Массифе собрался весь Израиль перед войной с Вениамином, и сюда Самуил созвал народ, когда теснили филистимляне: «И собрались в Массифу, и черпали воду, и проливали пред Господом, и постились в тот день… И судил Самуил сынов Израилевых в Массифе». После победы «взял Самуил один камень, и поставил между Массифою и между Сеном, и назвал его Авен-Езер, сказав: до сего места помог нам Господь». Массифа была одним из трёх городов, которые он обходил из года в год вместе с Вефилем и Галгалом, и здесь Саул был избран по жребию. Позже Аса, царь Иудейский, укрепил её камнями, которые Вааса свёз в Раму, в 4 км отсюда; с этой стройкой часто связывают мощную стену Телль-эн-Насбе."
    - "Когда вавилоняне сожгли Иерусалим в 587 или 586 г. до н. э., Массифа стала резиденцией Годолии, которого они поставили начальником: «И пришел Иеремия к Годолии, сыну Ахикама, в Массифу, и жил с ним среди народа, остававшегося в стране». Там Исмаил, сын Нафании, убил Годолию. Уильям Бейд раскапывал Телль-эн-Насбе в 1926–1935 гг., и находки согласуются с этим рассказом: город не был разрушен вместе с Иерусалимом и процветал в VI веке до н. э. — это самый сильный довод в пользу отождествления."
    - "Массифа Галаадская — это груда камней, у которой расстались Иаков и Лаван: «да надзирает Господь надо мною и над тобою, когда мы скроемся друг от друга». Туда вернулся с победы Иеффай, и навстречу ему вышла его дочь. Место её неизвестно; карта следует предположению о Джел‘аде в горах Галаада — одному из нескольких."
  uk:
    - "Міцпу Веніяминову, де Самуїл судив Ізраїль і де Саула було обрано царем, зазвичай ототожнюють із Телль-ен-Насбе, низьким пагорбом біля старої дороги на північ від Єрусалима, приблизно за 12 км від міста по прямій; точка на мапі стоїть там. Головна альтернатива — Неби-Самуїл, високий пагорб на північний захід від Єрусалима, де пізніший переказ показує гробницю Самуїла. Назва означає «сторожова вежа», і в Біблії більше ніж одна Міцпа: інша лежала в Гілеаді, на схід від Йордану, приблизно за 59 км."
    - "У Міцпі зібрався весь Ізраїль перед війною проти Веніямина, і тут Самуїл скликав народ, коли його тиснули філістимляни: «І зійшлись вони в Массифу, і черпали воду й виливали її перед Господом та постили того дня ... І судив Самуїл суд синам Ізрайлевим у Массифі.» Після перемоги він «взяв величезного каменя та й поставив його між Массифою і Сеном, і назвав його Авен-Езер, та й промовив: Ось поки Господь дав нам підмогу!» Міцпа була одним із трьох міст його щорічного обходу разом із Бет-Елом і Гілгалом, і тут жеребом було обрано Саула. Пізніше Аса Юдейський укріпив її камінням, яке Вааса звіз до Рами, за 4 км; масивний мур Телль-ен-Насбе часто пов'язують із цією роботою."
    - "Після того як вавилоняни спалили Єрусалим 587 або 586 р. до н. е., Міцпа стала осідком Гедалії, призначеного ними намісника: «І прийшов Еремія до Годолїї Ахикаменка в Массифу, й пробував із ним серед люду, що позостався в країнї.» Там Ізмаїл, син Нетанії, вбив Гедалію. Вільям Ф. Баде розкопував Телль-ен-Насбе в 1926–1935 рр., і знахідки відповідають цій оповіді: місто не було зруйноване разом з Єрусалимом і процвітало в VI ст. до н. е. — це найсильніший аргумент на користь ототожнення."
    - "Міцпа Гілеадська — це купа каміння, де розійшлися Яків і Лаван: «Нехай вартує Господь між мною й тобою, як ми розійдемось різно одни з одним.» Єфтай повернувся туди зі своєї перемоги, і назустріч йому вийшла його дочка. Її місце невідоме; мапа слідує пропозиції Джель'ад у пагорбах Гілеаду, одному з кількох кандидатів."
  es:
    - "Mizpa de Benjamín, donde Samuel juzgó a Israel y Saúl fue elegido rey, se identifica por lo común con Tell en-Nasbeh, una colina baja junto al antiguo camino que sale hacia el norte de Jerusalén, a unos 12 km de la ciudad en línea recta; el punto del mapa está allí. La principal alternativa es Nebi Samwil, la alta colina al noroeste de Jerusalén donde una tradición posterior muestra la tumba de Samuel. El nombre significa «atalaya», y la Biblia tiene más de una Mizpa: otra estaba en Galaad, al este del Jordán, a unos 59 km."
    - "En Mizpa se reunió todo Israel antes de la guerra contra Benjamín, y aquí convocó Samuel al pueblo cuando lo acosaban los filisteos: «juntándose en Mizpa, sacaron agua, y derramáronla delante de Jehová, y ayunaron aquel día… Y juzgó Samuel á los hijos de Israel en Mizpa». Tras la victoria, «tomó luego Samuel una piedra, y púsola entre Mizpa y Sen, y púsole por nombre Eben-ezer, diciendo: Hasta aquí nos ayudó Jehová». Mizpa era una de las tres ciudades de su recorrido anual, con Betel y Gilgal, y aquí fue elegido Saúl por suerte. Más tarde, Asa de Judá la fortificó con las piedras que Baasa había llevado a Ramá, a 4 km de distancia; la maciza muralla de Tell en-Nasbeh suele vincularse con esta obra."
    - "Después de que los babilonios incendiaran Jerusalén en 587 o 586 a. C., Mizpa fue la sede de Gedalías, el gobernador que ellos nombraron: «Fuése entonces Jeremías á Gedalías hijo de Ahicam, á Mizpa, y moró con él en medio del pueblo que había quedado en la tierra». Allí Ismael, hijo de Netanías, asesinó a Gedalías. William F. Badè excavó Tell en-Nasbeh en 1926–1935, y los hallazgos encajan con este relato: la ciudad no fue destruida con Jerusalén y floreció en el siglo VI a. C., que es el argumento más fuerte a favor de la identificación."
    - "La Mizpa de Galaad es el montón de piedras donde se separaron Jacob y Labán: «Atalaye Jehová entre mí y entre ti, cuando nos apartáremos el uno del otro». Jefté volvió allí a su casa tras su victoria y su hija salió a recibirlo. Su emplazamiento se desconoce; el mapa sigue la propuesta de Jel‘ad, en las colinas de Galaad, uno de varios candidatos."
  pt:
    - "Mispá de Benjamim, onde Samuel julgou Israel e Saul foi escolhido rei, é geralmente identificada com Tell en-Nasbeh, uma colina baixa junto à antiga estrada para o norte a partir de Jerusalém, a cerca de 12 km da cidade em linha reta; o ponto do mapa fica ali. A principal alternativa é Nebi Samwil, a colina alta a noroeste de Jerusalém onde uma tradição posterior mostra o túmulo de Samuel. O nome significa “torre de vigia”, e a Bíblia tem mais de uma Mispá: outra ficava em Gileade, a leste do Jordão, a cerca de 59 km."
    - "Em Mispá todo o Israel se reuniu antes da guerra contra Benjamim, e aqui Samuel convocou o povo quando os filisteus o pressionavam: “eles se reuniram em Mispá, tiraram água e a derramaram perante o SENHOR; jejuaram naquele dia… E Samuel julgou os filhos de Israel em Mispá.” Depois da vitória, “Samuel pegou uma pedra, colocou-a entre Mispá e Sem, e lhe deu o nome de Ebenézer, dizendo: Até aqui o SENHOR nos ajudou.” Mispá era uma das três cidades do seu circuito anual, com Betel e Gilgal, e aqui Saul foi escolhido por sorteio. Mais tarde, Asa de Judá a fortificou com as pedras que Baasa havia levado a Ramá, a 4 km; a maciça muralha de Tell en-Nasbeh é muitas vezes ligada a essa obra."
    - "Depois que os babilônios queimaram Jerusalém, em 587 ou 586 a.C., Mispá tornou-se a sede de Gedalias, o governador que eles nomearam: “Jeremias foi a Gedalias, filho de Aicão, a Mispá, e morou com ele entre o povo que havia sido deixado na terra.” Ali Ismael, filho de Netanias, assassinou Gedalias. William F. Badè escavou Tell en-Nasbeh em 1926–1935, e os achados concordam com esta história: a cidade não foi destruída com Jerusalém e floresceu no século VI a.C., o que é o argumento mais forte a favor da identificação."
    - "A Mispá de Gileade é o monte de pedras onde Jacó e Labã se separaram: “O SENHOR vigie entre mim e você, quando estivermos ausentes um do outro.” Jefté voltou para casa ali, depois da sua vitória, e sua filha saiu ao seu encontro. Seu sítio é desconhecido; o mapa segue a proposta de Jel‘ad, nas colinas de Gileade, um dos vários candidatos."
  de:
    - "Das benjaminitische Mizpa, wo Samuel Israel richtete und Saul zum König erwählt wurde, wird meist mit Tell en-Nasbeh gleichgesetzt, einem niedrigen Hügel an der alten Straße nach Norden von Jerusalem, in der Luftlinie etwa 12 km von der Stadt entfernt; dort steht der Kartenpunkt. Die wichtigste Alternative ist Nebi Samwil, der hohe Hügel nordwestlich von Jerusalem, wo eine spätere Überlieferung das Grab Samuels zeigt. Der Name bedeutet „Wachturm“, und die Bibel kennt mehr als ein Mizpa: ein weiteres lag in Gilead östlich des Jordans, etwa 59 km entfernt."
    - "In Mizpa versammelte sich ganz Israel vor dem Krieg gegen Benjamin, und hier rief Samuel das Volk zusammen, als die Philister es bedrängten: „Und sie kamen zusammen gen Mizpa und schöpften Wasser und gossen's aus vor dem HERRN und fasteten denselben Tag … Also richtete Samuel die Kinder Israel zu Mizpa.“ Nach dem Sieg „nahm Samuel einen Stein und setzte ihn zwischen Mizpa und Sen und hieß ihn Eben-Ezer und sprach: Bis hierher hat uns der HERR geholfen.“ Mizpa gehörte mit Bethel und Gilgal zu den drei Orten seines jährlichen Rundgangs, und hier wurde Saul durchs Los erwählt. Später befestigte Asa von Juda es mit den Steinen, die Baesa nach Rama, 4 km entfernt, gebracht hatte; die massive Mauer von Tell en-Nasbeh wird oft mit diesem Werk verbunden."
    - "Nachdem die Babylonier Jerusalem 587 oder 586 v. Chr. verbrannt hatten, wurde Mizpa Sitz Gedaljas, des von ihnen eingesetzten Statthalters: „Also kam Jeremia zu Gedalja, dem Sohn Ahikams, gen Mizpa und blieb bei ihm unter dem Volk, das im Lande noch übrig war.“ Dort ermordete Ismael, der Sohn Netanjas, den Gedalja. William F. Badè grub Tell en-Nasbeh 1926–1935 aus, und die Funde passen zu dieser Geschichte: Die Stadt wurde nicht mit Jerusalem zerstört und blühte im 6. Jahrhundert v. Chr., was das stärkste Argument für die Gleichsetzung ist."
    - "Das Mizpa in Gilead ist der Steinhaufen, an dem sich Jakob und Laban trennten: „Der HERR sehe darein zwischen mir und dir, wenn wir voneinander kommen.“ Jeftah kam dort von seinem Sieg heim, und seine Tochter ging ihm entgegen. Seine Lage ist unbekannt; die Karte folgt dem Vorschlag Dschal‘ad in den Bergen Gileads, einem von mehreren Kandidaten."
  fr:
    - "Mitspa de Benjamin, où Samuel jugea Israël et où Saül fut choisi comme roi, est généralement identifiée à Tell en-Nasbeh, une colline basse au bord de l’ancienne route qui monte vers le nord depuis Jérusalem, à environ 12 km de la ville à vol d’oiseau ; le point de la carte s’y trouve. La principale autre possibilité est Nebi Samwil, la haute colline au nord-ouest de Jérusalem où une tradition plus tardive montre le tombeau de Samuel. Le nom signifie « tour de guet », et la Bible connaît plus d’une Mitspa : une autre se trouvait en Galaad, à l’est du Jourdain, à environ 59 km."
    - "À Mitspa, tout Israël se rassembla avant la guerre contre Benjamin, et c’est là que Samuel convoqua le peuple quand les Philistins le pressaient : « Et ils s’assemblèrent à Mitspa. Ils puisèrent de l’eau et la répandirent devant l’Éternel, et ils jeûnèrent ce jour-là… Samuel jugea les enfants d’Israël à Mitspa. » Après la victoire, « Samuel prit une pierre, qu’il plaça entre Mitspa et Schen, et il l’appela du nom d’Ében-Ézer, en disant : Jusqu’ici l’Éternel nous a secourus. » Mitspa était l’une des trois villes de sa tournée annuelle, avec Béthel et Guilgal, et c’est là que Saül fut désigné par le sort. Plus tard, Asa de Juda la fortifia avec les pierres que Baescha avait amenées à Rama, à 4 km de là ; le massif rempart de Tell en-Nasbeh est souvent rattaché à ces travaux."
    - "Après que les Babyloniens eurent incendié Jérusalem en 587 ou 586 av. J.-C., Mitspa devint le siège de Guedalia, le gouverneur qu’ils avaient établi : « Jérémie alla vers Guedalia, fils d’Achikam, à Mitspa, et il resta avec lui parmi le peuple qui était demeuré dans le pays. » C’est là qu’Ismaël, fils de Nethania, assassina Guedalia. William F. Badè fouilla Tell en-Nasbeh en 1926-1935, et les trouvailles s’accordent avec ce récit : la ville ne fut pas détruite avec Jérusalem et prospéra au VIe siècle av. J.-C., ce qui est le meilleur argument en faveur de l’identification."
    - "La Mitspa de Galaad est le monceau de pierres où Jacob et Laban se séparèrent : « Que l’Éternel veille sur toi et sur moi, quand nous nous serons l’un et l’autre perdus de vue. » Jephté y rentra après sa victoire, et sa fille vint au-devant de lui. Son emplacement est inconnu ; la carte suit la proposition de Jel‘ad, dans les collines de Galaad, l’un de plusieurs candidats."
