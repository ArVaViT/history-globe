id: how-far-egypt-to-canaan
question:
  en: "How far was it from Egypt to Canaan?"
  ru: "Как далеко было от Египта до Ханаана?"
  uk: "Яка відстань від Єгипту до Ханаану?"
  es: "¿Qué distancia había de Egipto a Canaán?"
  pt: "Qual era a distância do Egito a Canaã?"
  de: "Wie weit war es von Ägypten nach Kanaan?"
  fr: "Quelle distance y avait-il de l’Égypte à Canaan ?"
  pl: "Jak daleko było z Egiptu do Kanaanu?"
  it: "Quanto distava l’Egitto da Canaan?"
  nl: "Hoe ver was het van Egypte naar Kanaän?"
  cs: "Jak daleko to bylo z Egypta do Kanaánu?"
  sv: "Hur långt var det från Egypten till Kanaan?"
  nb: "Hvor langt var det fra Egypt til Kanaan?"
  tl: "Gaano kalayo mula sa Egipto hanggang sa Canaan?"
  da: "Hvor langt var der fra Egypten til Kana'an?"
  sr: "Колико је далеко било од Египта до Ханана?"
  hu: "Milyen messze van Egyiptom Kánaántól?"
  fi: "Kuinka pitkä matka oli Egyptistä Kanaaniin?"
  vi: "Từ Ê-díp-tô đến Ca-na-an xa bao nhiêu?"
  ro: "Cât de departe era de la Egipt până în Canaan?"
  bg: "Колко е било разстоянието от Египет до Ханаан?"
answer:
  en:
    - "From the land of Goshen in the eastern Nile Delta, where Jacob's family settled, to Gaza on the southern coast of Canaan is about 260 km in a straight line; to Beersheba about 290 km, to Hebron about 320 km and to Jerusalem about 340 km. At 25–30 km a day that is ten to fourteen days on foot. The frontier between the two lands was the Brook of Egypt, the Wadi el-Arish, about 190 km from Goshen and 74 km short of Gaza, so most of the way lay across the sand and scrub of northern Sinai. The map point stands on Goshen, at Qantir, the site of Rameses."
    - "The patriarchs went down this way again and again. “Abram went down into Egypt to sojourn there; for the famine was grievous in the land.” Joseph was sold to a caravan of Ishmeelites “going to carry it down to Egypt”; his brothers went twice for corn, and he sent his father “ten asses laden with the good things of Egypt”. Then “Jacob rose up from Beer-sheba: and the sons of Israel carried Jacob their father... in the wagons which Pharaoh had sent”, and Judah went ahead “to direct his face unto Goshen”. After his death his sons carried him back to the cave of Machpelah at Hebron; Genesis has the funeral pass by the threshing floor of Atad by the Jordan, a far longer way round."
    - "The usual road was the coast road, which the Egyptians called the Way of Horus and lined with forts and wells, from Tjaru on the edge of the Delta to Gaza; Exodus calls it “the way of the land of the Philistines, although that was near”, and says God led Israel the other way, into the wilderness, so that a short journey became forty years. The Synodal text of Exodus 12:40, following the Greek, counts the 430 years as the time Israel and their fathers lived in Egypt and in the land of Canaan, which shortens the stay in Egypt itself; the Hebrew has Egypt alone. In the Gospels the same road carried Joseph, Mary and the child, who “departed into Egypt” to escape Herod. The map's Joseph tour uses 1700 BC, a conventional point, since the age of the patriarchs is disputed."
  ru:
    - "От земли Гесем в восточной дельте Нила, где поселилась семья Иакова, до Газы на южном побережье Ханаана около 260 км по прямой; до Вирсавии около 290 км, до Хеврона около 320 км и до Иерусалима около 340 км. По 25–30 км в день это от десяти до четырнадцати дней пешком. Границей двух земель был поток Египетский, вади Эль-Ариш, примерно в 190 км от Гесема и в 74 км от Газы, так что большая часть пути шла по пескам и кустарнику северного Синая. Точка карты стоит на Гесеме, у Кантира, на месте Раамсеса."
    - "Патриархи ходили этим путём снова и снова. «Сошел Аврам в Египет, пожить там, потому что усилился голод в земле той». Иосифа продали каравану Измаильтян, которые шли «отвезти это в Египет»; братья дважды ходили за хлебом, а он послал отцу «десять ослов, навьюченных лучшими произведениями Египетскими». Потом «Иаков отправился из Вирсавии; и повезли сыны Израилевы Иакова, отца своего... на колесницах, которые послал фараон», а Иуда шёл впереди, «чтобы он указал путь в Гесем». После смерти Иакова сыновья отнесли его в пещеру Махпела у Хеврона; по Книге Бытия похоронное шествие прошло через Горен-гаатад при Иордане — гораздо более длинным путём."
    - "Обычной была приморская дорога, которую египтяне называли Путём Хора и снабдили крепостями и колодцами, от Чару на краю дельты до Газы; Исход говорит, что Бог не повёл Израиль «по дороге земли Филистимской, потому что она близка», а повёл другим путём, в пустыню, так что короткий путь растянулся на сорок лет. Синодальный текст Исхода 12:40, вслед за греческим, относит 430 лет ко времени, когда сыны Израилевы «и отцы их обитали в Египте и в земле Ханаанской», что сокращает пребывание в самом Египте; в еврейском тексте назван один Египет. В Евангелиях той же дорогой шли Иосиф, Мария и Младенец, когда Иосиф, спасаясь от Ирода, «пошел в Египет». Тур об Иосифе на карте берёт 1700 г. до н. э. как условную точку, поскольку время патриархов спорно."
  uk:
    - "Від краю Гошен у східній частині дельти Нілу, де оселилася родина Якова, до Гази на південному узбережжі Ханаану близько 260 км по прямій; до Беер-Шеви близько 290 км, до Хеврона близько 320 км, до Єрусалиму близько 340 км. За 25–30 км на день це від десяти до чотирнадцяти днів пішки. Кордоном між двома країнами був Потік Єгипетський, Ваді-ель-Аріш, приблизно за 190 км від Гошену і за 74 км до Гази, тож більша частина шляху пролягала через пісок і чагарники північного Сінаю. Точка мапи стоїть на Гошені, у Кантірі, на місці Раамсеса."
    - "Патріархи ходили цією дорогою знову й знову. «Спустивсь Аврам у Египет на пробуваннє таменькі, бо тяжка була вона в тїй землї». Йосипа продали каравану ізмаїльтян, які, як сказано, везли «бурштин, бальзам та ладан в Египет»; його брати двічі ходили по зерно, а він послав батькові «десять ослів з уюками всїх благ Египецьких». Потім «рушив Яков од Бейер-Саби, і повезли сини Ізраїлеві панотця свого … на колесницях, що послав Фараон по його», а Юду було послано наперед «направляти лице його до Госену». Після його смерті сини перенесли його назад до печери Махпела біля Хеврона; за Книгою Буття похоронна процесія проходить повз тік Атад над Йорданом — набагато довшим обхідним шляхом."
    - "Звичайною дорогою була приморська дорога, яку єгиптяни називали Шляхом Гора й обставили фортецями та колодязями, від Чару на краю дельти до Гази; Книга Вихід називає її «по дорозї до землї Филистимської, хоч вона й близька» і каже, що Бог повів Ізраїль іншим шляхом, у пустелю, тож короткий похід розтягнувся на сорок років. Синодальний текст Вих 12:40, услід за грецьким, відносить 430 років до часу, коли Ізраїль та їхні батьки жили в Єгипті й у землі Ханаанській, що скорочує перебування в самому Єгипті; в єврейському тексті названо один Єгипет. В Євангеліях тією самою дорогою йшли Йосип, Марія й Дитя: рятуючись від Ірода, Йосип узяв хлопятко з матір'ю «та й пійшов у Єгипет». Тур Йосипа на мапі бере 1700 р. до н. е. як умовну точку, бо час патріархів спірний."
  es:
    - "Desde la tierra de Gosén, en el este del delta del Nilo, donde se estableció la familia de Jacob, hasta Gaza, en la costa sur de Canaán, hay unos 260 km en línea recta; hasta Beerseba unos 290 km, hasta Hebrón unos 320 km y hasta Jerusalén unos 340 km. A 25–30 km diarios son de diez a catorce días a pie. La frontera entre ambas tierras era el torrente de Egipto, el uadi el-Arish, a unos 190 km de Gosén y a 74 km antes de Gaza, de modo que la mayor parte del camino discurría por la arena y el matorral del norte del Sinaí. El punto del mapa está en Gosén, en Qantir, el emplazamiento de Ramsés."
    - "Los patriarcas bajaron por este camino una y otra vez. «Descendió Abram á Egipto para peregrinar allá; porque era grande el hambre en la tierra». José fue vendido a una caravana de ismaelitas que «iban á llevarlo á Egipto»; sus hermanos fueron dos veces a por grano, y él envió a su padre «diez asnos cargados de lo mejor de Egipto». Después «levantóse Jacob de Beer-seba; y tomaron los hijos de Israel á su padre Jacob... en los carros que Faraón había enviado para llevarlo», y Judá fue enviado por delante a Gosén. Tras su muerte, sus hijos lo llevaron de vuelta a la cueva de Macpela, en Hebrón; Génesis hace pasar el cortejo fúnebre por la era de Atad, junto al Jordán, un rodeo mucho mayor."
    - "El camino habitual era la ruta de la costa, que los egipcios llamaban el Camino de Horus y que bordeaban fortalezas y pozos, desde Tjaru, en el borde del delta, hasta Gaza; Éxodo la llama «el camino de la tierra de los Filisteos, que estaba cerca», y dice que Dios llevó a Israel por el otro, al desierto, de modo que un viaje corto se convirtió en cuarenta años. El texto sinodal de Éxodo 12:40, siguiendo el griego, cuenta los 430 años como el tiempo que Israel y sus padres habitaron en Egipto y en la tierra de Canaán, lo que acorta la estancia en el propio Egipto; el hebreo tiene solo Egipto. En los Evangelios, el mismo camino llevó a José, a María y al niño, que «se fué á Egipto» para escapar de Herodes. El recorrido de José en el mapa usa el 1700 a. C., un punto convencional, pues la época de los patriarcas es discutida."
  pt:
    - "Da terra de Gósen, no leste do delta do Nilo, onde se estabeleceu a família de Jacó, a Gaza, na costa sul de Canaã, são cerca de 260 km em linha reta; a Berseba cerca de 290 km, a Hebrom cerca de 320 km e a Jerusalém cerca de 340 km. A 25–30 km por dia são dez a catorze dias a pé. A fronteira entre as duas terras era o ribeiro do Egito, o uádi el-Arish, a cerca de 190 km de Gósen e 74 km antes de Gaza, de modo que a maior parte do caminho atravessava areias e arbustos do norte do Sinai. O ponto do mapa fica em Gósen, em Qantir, o local de Ramessés."
    - "Os patriarcas desceram por esse caminho muitas vezes. “Abrão desceu ao Egito para viver ali como estrangeiro, pois a fome era severa na terra.” José foi vendido a uma caravana de ismaelitas “descendo para levá-los ao Egito”; seus irmãos foram duas vezes buscar cereal, e ele mandou a seu pai “dez jumentos carregados com as melhores coisas do Egito”. Depois “Jacó levantou-se de Berseba, e os filhos de Israel levaram Jacó, seu pai… nas carroças que o Faraó tinha enviado”, e Judá foi adiante “para mostrar o caminho à sua frente até Gósen”. Depois de sua morte, os filhos o levaram de volta à caverna de Macpela, em Hebrom; Gênesis faz o cortejo passar pela eira de Atade, junto ao Jordão, um caminho muito mais longo."
    - "A estrada habitual era a da costa, que os egípcios chamavam Caminho de Hórus e guarneciam de fortes e poços, de Tjaru, na orla do Delta, até Gaza; Êxodo a chama “o caminho da terra dos filisteus, embora fosse mais perto”, e diz que Deus levou Israel pelo outro, para o deserto, de modo que uma viagem curta virou quarenta anos. O texto sinodal de Êxodo 12:40, seguindo o grego, conta os 430 anos como o tempo em que Israel e seus pais viveram no Egito e na terra de Canaã, o que encurta a permanência no próprio Egito; o hebraico menciona só o Egito. Nos Evangelhos a mesma estrada levou José, Maria e o menino, quando José “partiu para o Egito” para escapar de Herodes. O roteiro de José no mapa usa 1700 a.C., um ponto convencional, pois a época dos patriarcas é disputada."
  de:
    - "Vom Land Goschen im östlichen Nildelta, wo sich Jakobs Familie niederließ, bis Gaza an der Südküste Kanaans sind es etwa 260 km Luftlinie; bis Beerscheba etwa 290 km, bis Hebron etwa 320 km und bis Jerusalem etwa 340 km. Bei 25–30 km am Tag sind das zehn bis vierzehn Tage zu Fuß. Die Grenze zwischen beiden Ländern war der Bach Ägyptens, das Wadi el-Arisch, etwa 190 km von Goschen und 74 km vor Gaza, sodass der größte Teil des Weges durch Sand und Buschland des nördlichen Sinai führte. Der Kartenpunkt liegt auf Goschen, bei Qantir, der Stätte von Ramses."
    - "Die Erzväter zogen immer wieder diesen Weg hinab. „Da zog Abram hinab nach Ägypten, daß er sich daselbst als ein Fremdling aufhielte; denn die Teuerung war groß im Lande.“ Josef wurde an einen Zug von Ismaelitern verkauft, die „zogen hinab nach Ägypten“; seine Brüder gingen zweimal um Getreide, und er sandte seinem Vater „zehn Esel, mit Gut aus Ägypten beladen“. Dann „machte sich Jakob auf von Beer-Seba; und die Kinder Israels führten Jakob, ihren Vater, ... auf den Wagen, die Pharao gesandt hatte“, und Juda ging voraus, „daß dieser ihn anwiese zu Gosen“. Nach seinem Tod brachten ihn seine Söhne zurück in die Höhle Machpela bei Hebron; die Genesis lässt den Trauerzug an der Tenne Atad am Jordan vorbeiziehen, einem weit längeren Umweg."
    - "Die übliche Straße war die Küstenstraße, die die Ägypter Horusweg nannten und mit Festungen und Brunnen säumten, von Tscharu am Rand des Deltas nach Gaza; das 2. Buch Mose nennt sie „auf der Straße durch der Philister Land, die am nächsten war“ und sagt, Gott habe Israel den anderen Weg geführt, in die Wüste, sodass aus einer kurzen Reise vierzig Jahre wurden. Der Synodaltext von 2. Mose 12,40 zählt, der griechischen Fassung folgend, die 430 Jahre als die Zeit, die Israel und seine Väter in Ägypten und im Land Kanaan lebten, was den Aufenthalt in Ägypten selbst verkürzt; der hebräische Text nennt nur Ägypten. In den Evangelien trug dieselbe Straße Josef, Maria und das Kind, die „nach Ägyptenland“ entwichen, um Herodes zu entgehen. Die Josef-Tour der Karte verwendet 1700 v. Chr., einen herkömmlichen Zeitpunkt, da die Zeit der Erzväter umstritten ist."
  fr:
    - "Du pays de Gosen, dans l’est du delta du Nil, où s’établit la famille de Jacob, à Gaza, sur la côte sud de Canaan, il y a environ 260 km en ligne droite ; à Beer-Schéba environ 290 km, à Hébron environ 320 km et à Jérusalem environ 340 km. À 25–30 km par jour, cela fait dix à quatorze jours de marche. La frontière entre les deux pays était le torrent d’Égypte, l’oued el-Arich, à environ 190 km de Gosen et à 74 km de Gaza ; la plus grande partie du trajet traversait donc le sable et la broussaille du nord du Sinaï. Le point de la carte est sur Gosen, à Qantir, site de Ramsès."
    - "Les patriarches descendirent cette route maintes fois. « Abram descendit en Égypte pour y séjourner, car la famine était grande dans le pays. » Joseph fut vendu à une caravane d’Ismaélites « qu’ils transportaient en Égypte » ; ses frères y allèrent deux fois chercher du blé, et il envoya à son père « dix ânes chargés de ce qu’il y avait de meilleur en Égypte ». Puis « Jacob quitta Beer-Schéba ; et les fils d’Israël mirent Jacob, leur père, … sur les chars que Pharaon avait envoyés », et Juda partit devant « pour l’informer qu’il se rendait en Gosen ». À sa mort, ses fils le ramenèrent à la caverne de Macpéla, à Hébron ; la Genèse fait passer le cortège par l’aire d’Athad, au-delà du Jourdain, un détour bien plus long."
    - "La route ordinaire était la route côtière, que les Égyptiens appelaient chemin d’Horus et jalonnaient de forts et de puits, de Tjarou, au bord du delta, à Gaza ; l’Exode l’appelle « le chemin du pays des Philistins, quoique le plus proche » et dit que Dieu conduisit Israël par l’autre voie, dans le désert, si bien qu’un court trajet devint quarante ans. Le texte synodal d’Exode 12:40, d’après le grec, compte les 430 ans comme le temps passé par Israël et ses pères en Égypte et au pays de Canaan, ce qui raccourcit le séjour en Égypte même ; l’hébreu ne parle que de l’Égypte. Dans les Évangiles, la même route porta Joseph, Marie et l’enfant, qui « se retira en Égypte » pour échapper à Hérode. Le parcours de Joseph sur la carte retient 1700 av. J.-C., point conventionnel, l’âge des patriarches étant discuté."
  pl:
    - "Z ziemi Goszen we wschodniej Delcie Nilu, gdzie osiadła rodzina Jakuba, do Gazy na południowym wybrzeżu Kanaanu jest około 260 km w linii prostej; do Beer-Szeby około 290 km, do Hebronu około 320 km i do Jerozolimy około 340 km. Przy 25–30 km dziennie to od dziesięciu do czternastu dni pieszo. Granicę między obiema krainami stanowił Potok Egipski, Wadi el-Arisz, około 190 km od Goszen i 74 km przed Gazą, więc większość drogi wiodła przez piaski i zarośla północnego Synaju. Punkt na mapie stoi na Goszen, w Qantir, na miejscu Ramses."
    - "Patriarchowie schodzili tą drogą raz po raz. „A był głód w ziemi onej: przeto zstąpił Abram do Egiptu, aby tam był gościem do czasu, ciężki bowiem był głód w ziemi.” Józef został sprzedany karawanie Izmaelitów, których wielbłądy „szły, aby to zaniosły do Egiptu”; jego bracia dwa razy jechali po zboże, a on posłał ojcu „dziesięć osłów, niosących z najlepszych rzeczy Egipskich”. Potem „powstał Jakób z Beerseby; i wzięli synowie Izraelowi Jakóba ojca swego… na wozy, które był posłał Farao”, a Juda poszedł przodem: „posłał przed sobą Judasa do Józefa, aby mu oznajmił pierwej, niżby przyjechał do Gosen”. Po jego śmierci synowie zawieźli go z powrotem do jaskini Makpela w Hebronie; Księga Rodzaju każe pogrzebowi przejść obok klepiska Atad nad Jordanem, co było znacznie dłuższą drogą naokoło."
    - "Zwykłą drogą był szlak nadbrzeżny, który Egipcjanie nazywali Drogą Horusa i obsadzili go fortami i studniami, od Tjaru na skraju Delty do Gazy; Księga Wyjścia nazywa go „drogą ziemi Filistyńskiej”, „chociaż bliższa była”, i mówi, że Bóg poprowadził Izraela inaczej, na pustynię, tak że krótka podróż stała się czterdziestoma latami. Tekst synodalny Wj 12,40, idący za greckim, liczy 430 lat jako czas, który Izrael i jego ojcowie mieszkali w Egipcie i w ziemi Kanaan, co skraca pobyt w samym Egipcie; tekst hebrajski ma tylko Egipt. W Ewangeliach tą samą drogą szli Józef, Maria i dziecko; Józef „wziął dzieciątko i matkę jego w nocy, i uszedł do Egiptu”, aby uciec przed Herodem. Trasa Józefa na mapie przyjmuje rok 1700 p.n.e., punkt umowny, ponieważ czas patriarchów jest sporny."
  it:
    - "Dalla terra di Gosen, nel Delta orientale del Nilo, dove si stabilì la famiglia di Giacobbe, a Gaza, sulla costa meridionale di Canaan, ci sono circa 260 km in linea retta; a Bersabea circa 290 km, a Ebron circa 320 km e a Gerusalemme circa 340 km. A 25–30 km al giorno sono da dieci a quattordici giorni a piedi. Il confine tra le due terre era il Torrente d’Egitto, il Wadi el-Arish, a circa 190 km da Gosen e a 74 km prima di Gaza, così che la maggior parte del percorso attraversava la sabbia e la macchia del Sinai settentrionale. Il punto della mappa si trova su Gosen, a Qantir, il sito di Ramses."
    - "I patriarchi scesero più volte lungo questa via. «Abramo scese in Egitto per soggiornarvi, perché la fame era grave nel paese». Giuseppe fu venduto a una carovana di Ismaeliti «che portava in Egitto»; i suoi fratelli vi andarono due volte per il grano, ed egli mandò a suo padre «dieci asini carichi delle migliori cose d’Egitto». Poi «Giacobbe partì da Beer-Sceba; e i figliuoli d’Israele fecero salire Giacobbe loro padre … sui carri che Faraone avea mandato», e Giuda fu mandato avanti «a Giuseppe, perché questi lo introducesse nel paese di Goscen». Dopo la sua morte i figli lo riportarono alla grotta di Macpela a Ebron; la Genesi fa passare il corteo funebre per l’aia di Atad presso il Giordano, un giro molto più lungo."
    - "La strada abituale era la via costiera, che gli Egizi chiamavano Via di Horus e fiancheggiavano di fortezze e di pozzi, da Tjaru, al margine del Delta, a Gaza; l’Esodo dice che «Iddio non lo condusse per la via del paese de’ Filistei, perché troppo vicina», ma per l’altra, nel deserto, così che un breve viaggio divenne di quarant’anni. Il testo sinodale di Esodo 12,40, che segue il greco, conta i 430 anni come il tempo in cui Israele e i suoi padri vissero in Egitto e nella terra di Canaan, il che accorcia la permanenza nell’Egitto stesso; l’ebraico ha il solo Egitto. Nei Vangeli la stessa strada portò Giuseppe, Maria e il bambino: Giuseppe «prese di notte il fanciullino e sua madre, e si ritirò in Egitto» per sfuggire a Erode. Il percorso di Giuseppe sulla mappa usa il 1700 a.C., un punto convenzionale, poiché l’età dei patriarchi è discussa."
  nl:
    - "Van het land Gosen in de oostelijke Nijldelta, waar de familie van Jakob zich vestigde, naar Gaza aan de zuidkust van Kanaän is het hemelsbreed ongeveer 260 km; naar Berseba ongeveer 290 km, naar Hebron ongeveer 320 km en naar Jeruzalem ongeveer 340 km. Met 25–30 km per dag is dat tien tot veertien dagen te voet. De grens tussen de twee landen was de Beek van Egypte, de Wadi el-Arisj, ongeveer 190 km van Gosen en 74 km vóór Gaza, zodat het grootste deel van de weg over het zand en de struiken van het noordelijke Sinaï liep. Het punt op de kaart staat op Gosen, bij Qantir, de plaats van Raämses."
    - "De aartsvaders trokken deze weg telkens opnieuw naar beneden. “Zo toog Abram af naar Egypte, om daar als een vreemdeling te verkeren, dewijl de honger zwaar was in dat land.” Jozef werd verkocht aan een reisgezelschap van Ismaëlieten “reizende, om dat af te brengen naar Egypte”; zijn broers gingen tweemaal om koren, en hij zond zijn vader “tien ezelen, dragende van het beste van Egypte”. Daarna “maakte zich Jakob op van Ber-seba; en de zonen van Israël voerden Jakob, hun vader, … op de wagenen, die Farao gezonden had”, en Juda ging voorop “om voor zijn aangezicht aanwijzing te doen naar Gosen”. Na zijn dood voerden zijn zonen hem terug naar de spelonk van Machpela bij Hebron; Genesis laat de begrafenisstoet langs de dorsvloer van Atad aan de Jordaan trekken, een veel langere omweg."
    - "De gewone route was de kustweg, door de Egyptenaren de Weg van Horus genoemd en met forten en bronnen omzoomd, van Tjaru aan de rand van de Delta naar Gaza; Exodus noemt haar “den weg van het land der Filistijnen, hoewel die nader was”, en zegt dat God Israël de andere kant op leidde, de woestijn in, zodat een korte reis veertig jaar werd. De Synodale tekst van Exodus 12:40 rekent, in navolging van het Grieks, de 430 jaar als de tijd dat Israël en zijn vaderen in Egypte en in het land Kanaän woonden, waardoor het verblijf in Egypte zelf korter wordt; het Hebreeuws heeft alleen Egypte. In de Evangeliën bracht dezelfde weg Jozef, Maria en het kind, die naar Egypte “vertrok” om aan Herodes te ontkomen. De Jozef-tocht op de kaart gebruikt 1700 v.Chr., een conventioneel punt, aangezien de tijd van de aartsvaders omstreden is."
  cs:
    - "Z oblasti Gošen ve východní Nilské deltě, kde se usadila Jákobova rodina, do Gazy na jižním pobřeží Kanaánu je to asi 260 km vzdušnou čarou; do Beer-šeby asi 290 km, do Hebronu asi 320 km a do Jeruzaléma asi 340 km. Při 25–30 km denně to jsou pěšky deset až čtrnáct dní. Hranici mezi oběma zeměmi tvořil Egyptský potok, vádí al-Aríš, asi 190 km od Gošenu a 74 km před Gazou, takže většina cesty vedla přes písek a křoviny severního Sinaje. Bod na mapě stojí v Gošenu, v Kantíru, na místě Ramesse."
    - "Patriarchové šli touto cestou znovu a znovu. „Sstoupil Abram do Egypta, aby tam byl pohostinu; nebo veliký byl hlad v té zemi.“ Josef byl prodán karavaně Izmaelitů, kteří „na velbloudích svých nesli vonné věci a kadidlo a mirru do Egypta“; jeho bratři šli dvakrát pro obilí a on poslal otci „deset oslů, kteříž nesli z nejlepších věcí Egyptských“. Pak „vstal … Jákob z Bersabé; a synové Izraelovi vzali Jákoba otce svého … na vozy, kteréž poslal pro něho Farao“ a Juda šel napřed, aby ukázal cestu do Gošenu. Po jeho smrti jej synové donesli zpět do jeskyně Makpela u Hebronu; podle Genesis pohřební průvod minul humno Atad u Jordánu, což byla mnohem delší oklika."
    - "Obvyklou cestou byla pobřežní silnice, kterou Egypťané nazývali Horova cesta a lemovali pevnostmi a studnami, od Čaru na okraji delty do Gazy; Exodus ji nazývá „cestou země Filistinské, ačkoli bližší byla“ a praví, že Bůh vedl Izrael jinudy, do pustiny, takže z krátké cesty se stalo čtyřicet let. Synodální text Ex 12,40 podle řečtiny počítá 430 let jako dobu, po niž Izrael a jejich otcové žili v Egyptě a v zemi Kanaán, čímž se pobyt v samotném Egyptě zkracuje; hebrejský text má jen Egypt. V evangeliích touž cestou šel Josef, který „vstav hned v noci, vzal dítě i matku jeho, a odšel do Egypta“, aby unikl Herodovi. Mapa Josefova putování užívá rok 1700 př. n. l., smluvní bod, neboť doba patriarchů je sporná."
  sv:
    - "Från landet Goshen i östra Nildeltat, där Jakobs familj bosatte sig, till Gaza på Kanaans sydkust är det omkring 260 km fågelvägen; till Beer Sheva omkring 290 km, till Hebron omkring 320 km och till Jerusalem omkring 340 km. Med 25–30 km om dagen är det tio till fjorton dagar till fots. Gränsen mellan de båda länderna var Egyptens bäck, Wadi el-Arish, omkring 190 km från Goshen och 74 km före Gaza, så den största delen av vägen gick över sand och buskmark i norra Sinai. Kartpunkten står på Goshen, vid Qantir, platsen för Rameses."
    - "Patriarkerna gick denna väg ned igen och igen. ”Abram drog ned till Egypten för att bo där någon tid, eftersom hungersnöden var så svår i landet.” Josef såldes till ett tåg av ismaeliter som var ”på väg med detta ned till Egypten”; hans bröder for två gånger efter säd, och han sände sin far ”tio åsnor, lastade med det bästa Egypten hade”. Sedan bröt Jakob upp ”från Beer-Seba; och Israels söner satte sin fader Jakob och sina späda barn och sina hustrur på vagnarna som Farao hade sänt”, och Juda sändes före till Josef, ”för att denne skulle visa honom vägen till Gosen”. Efter hans död förde hans söner honom tillbaka till grottan i Makpela vid Hebron; 1 Mosebok låter begravningståget passera Atads tröskplats vid Jordan, en mycket längre omväg."
    - "Den vanliga vägen var kustvägen, som egyptierna kallade Horus väg och kantade med fästningar och brunnar, från Tjaru vid Deltats kant till Gaza; 2 Mosebok kallar den ”den väg som gick igenom filistéernas land, fastän denna var den genaste” och säger att Gud förde Israel åt andra hållet, ut i öknen, så att en kort resa blev fyrtio år. Synodalbibelns text i 2 Mos 12:40, som följer den grekiska, räknar de 430 åren som den tid Israel och deras fäder bodde i Egypten och i Kanaans land, vilket förkortar vistelsen i själva Egypten; hebreiskan har Egypten ensamt. I evangelierna bar samma väg Josef, Maria och barnet, som ”drog bort till Egypten” för att undkomma Herodes. Kartans Josefstur använder 1700 f.Kr., en konventionell tidpunkt, eftersom patriarkernas tid är omstridd."
  nb:
    - "Fra Gosen-landet i det østlige Nildeltaet, der Jakobs familie slo seg ned, til Gasa på Kanaans sørlige kyst er det omtrent 260 km i luftlinje; til Beer-Sjeba omtrent 290 km, til Hebron omtrent 320 km og til Jerusalem omtrent 340 km. Med 25–30 km om dagen er det ti til fjorten dager til fots. Grensen mellom de to landene var Egypts bekk, Wadi el-Arish, omtrent 190 km fra Gosen og 74 km før Gasa, så mesteparten av veien gikk over sand og kratt i det nordlige Sinai. Kartpunktet står på Gosen, ved Qantir, stedet for Ramses."
    - "Patriarkene dro ned denne veien igjen og igjen. «Abram drog ned til Egypten for å opholde sig der, for hungersnøden var stor i landet.» Josef ble solgt til et reisefølge av ismaelitter som var «på vei med dette ned til Egypten»; brødrene hans dro to ganger for å kjøpe korn, og han sendte sin far «ti asener som bar av det beste Egypten hadde». Så «brøt Jakob op fra Be'erseba; og Israels sønner kjørte Jakob, sin far, … i de vogner som Farao hadde sendt», og Juda ble sendt i forveien til Josef, så han skulde «vise ham vei til Gosen». Etter hans død førte sønnene ham tilbake til hulen i Makpela ved Hebron; 1 Mosebok lar begravelsesfølget gå forbi treskeplassen Goren-Haatad ved Jordan, en langt lengre omvei."
    - "Den vanlige veien var kystveien, som egypterne kalte Horus-veien og kantet med festninger og brønner, fra Tjaru ved kanten av deltaet til Gasa; 2 Mosebok kaller den «veien til filistrenes land, skjønt den var den nærmeste», og sier at Gud førte Israel den andre veien, inn i ødemarken, slik at en kort reise ble til førti år. Synodalbibelens tekst i 2 Mos 12,40, som følger den greske, regner de 430 årene som tiden Israel og deres fedre bodde i Egypt og i Kanaans land, noe som forkorter oppholdet i selve Egypt; den hebraiske teksten har Egypt alene. I evangeliene bar den samme veien Josef, Maria og barnet, som «drog bort til Egypten» for å slippe unna Herodes. Kartets Josef-tur bruker 1700 f.Kr., et konvensjonelt punkt, siden patriarkenes tid er omstridt."
  tl:
    - "Mula sa lupain ng Gosen sa silangang Delta ng Nilo, kung saan nanirahan ang pamilya ni Jacob, hanggang sa Gaza sa katimugang baybayin ng Canaan ay mga 260 km sa tuwid na guhit; hanggang sa Beer-seba mga 290 km, hanggang sa Hebron mga 320 km at hanggang sa Jerusalem mga 340 km. Sa 25–30 km kada araw, iyon ay sampu hanggang labing-apat na araw na lakad. Ang hangganan ng dalawang lupain ay ang Batis ng Egipto, ang Wadi el-Arish, mga 190 km mula sa Gosen at 74 km bago ang Gaza, kaya karamihan ng daan ay sa buhangin at palumpong ng hilagang Sinai. Ang tuldok sa mapa ay nasa Gosen, sa Qantir, ang pook ng Rameses."
    - "Paulit-ulit na bumaba ang mga patriyarka sa daang ito. “Bumaba si Abram na nasok sa Egipto, upang manirahan doon; sapagka't mahigpit ang kagutom sa lupain.” Ipinagbili si Jose sa isang karabana ng mga Ismaelita “na kanilang dadalhin sa Egipto”; dalawang ulit na nagpunta ang kaniyang mga kapatid para sa trigo, at nagpadala siya sa kaniyang ama ng “sangpung asnong may pasang mabuting mga bagay sa Egipto”. Pagkatapos ay “bumangon si Jacob mula sa Beerseba; at dinala ng mga anak ni Israel si Jacob na kanilang ama … sa mga kariton na ipinadala ni Faraon”, at nauna si Juda “upang ituro ang daan na patungo sa Gosen”. Pagkamatay niya, ibinalik siya ng kaniyang mga anak sa yungib ng Macpela sa Hebron; ayon sa Genesis ay dumaan ang libing sa giikan ng Atad sa tabi ng Jordan, isang mas mahabang pagliko."
    - "Ang karaniwang daan ay ang daan sa baybayin, na tinawag ng mga Egipcio na Daan ni Horus at nilagyan ng mga kuta at balon, mula sa Tjaru sa gilid ng Delta hanggang Gaza; tinawag ito ng Exodo na “daang patungo sa lupain ng mga Filisteo, bagaman malapit”, at sinasabing inakay ng Diyos ang Israel sa kabila, sa ilang, kaya ang maikling paglalakbay ay naging apatnapung taon. Ang tekstong Sinodal ng Exodo 12:40, na sumusunod sa Griyego, ay binibilang ang 430 taon bilang panahong tumira ang Israel at ang kanilang mga ama sa Egipto at sa lupain ng Canaan, kaya umiikli ang pananatili sa Egipto mismo; Egipto lamang ang nasa Hebreo. Sa mga Ebanghelyo, ito rin ang daan nina Jose, Maria at ng sanggol, na “napasa Egipto” upang makatakas kay Herodes. Ginagamit ng paglilibot kay Jose sa mapa ang 1700 BK, isang kombensiyonal na punto, dahil pinagtatalunan ang panahon ng mga patriyarka."
  da:
    - "Fra Gosjens land i det østlige Nildelta, hvor Jakobs familie bosatte sig, til Gaza på Kana'ans sydlige kyst er der omkring 260 km i luftlinje; til Beersheba omkring 290 km, til Hebron omkring 320 km og til Jerusalem omkring 340 km. Med 25–30 km om dagen er det ti til fjorten dage til fods. Grænsen mellem de to lande var Egyptens Bæk, Wadi el-Arish, omkring 190 km fra Gosjen og 74 km før Gaza, så størstedelen af vejen gik over sand og krat i det nordlige Sinai. Kortets punkt står på Gosjen, ved Qantir, stedet for Ramses."
    - "Patriarkerne drog ned ad denne vej igen og igen. »Abram drog ned til Ægypten at leve som fremmed der; thi Hungeren var svar i Landet.« Josef blev solgt til en karavane af ismaelitter, der »gik for at drage ned til Ægypten«; hans brødre drog to gange efter korn, og han sendte sin far »ti Asener, som bare af Ægyptens bedste Gods«. Så »brød Jakob op fra Beersaba; og Israels Sønner førte Jakob, deres Fader, … paa Vognene, som Farao havde sendt«, og han »sendte Juda foran sig til Josef, for at denne skulde vise ham til Gosen«. Efter hans død bar hans sønner ham tilbage til Makpela-hulen ved Hebron; Første Mosebog lader begravelsesfølget gå forbi tærskepladsen Goren-ha-Atad ved Jordan, en langt længere omvej."
    - "Den sædvanlige vej var kystvejen, som egypterne kaldte Horus' vej og kantede med fæstninger og brønde, fra Tjaru ved Deltaets kant til Gaza; Anden Mosebog kalder den »Vejen til Filistrene, skønt den var nærmest« og siger, at Gud førte Israel den anden vej, ud i ørkenen, så en kort rejse blev til fyrre år. Den russiske synodale bibeltekst af 2 Mos 12,40 følger den græske og regner de 430 år som den tid, Israel og deres fædre boede i Egypten og i Kana'ans land, hvilket forkorter selve opholdet i Egypten; den hebraiske tekst har Egypten alene. I evangelierne bar den samme vej Josef, Maria og barnet, som »drog bort til Ægypten« for at undslippe Herodes. Kortets Josef-tur bruger 1700 f.Kr., et konventionelt punkt, da patriarkernes tidsalder er omstridt."
  sr:
    - "Од земље Гесем у источној делти Нила, где се настанила Јаковљева породица, до Газе на јужној обали Ханана има око 260 км ваздушном линијом; до Вирсавеје око 290 км, до Хеврона око 320 км и до Јерусалима око 340 км. Уз 25–30 км дневно то је десет до четрнаест дана пешке. Међа између две земље био је Поток египатски, Вади ел Ариш, око 190 км од Гесема и 74 км пре Газе, па је већи део пута водио преко песка и шибља северног Синаја. Тачка на карти стоји на Гесему, у Кантиру, на месту Рамесе."
    - "Праоци су се овим путем спуштали изнова и изнова. „Аврам сиђе у Мисир да се онде склони; јер глад беше велика у оној земљи.“ Јосиф је продат гомили Исмаиљаца која је ишла од Галада с натовареним камилама, „те ношаху у Мисир“; његова браћа су двапут ишла по жито, а он је оцу послао „десет магараца натоварених најлепших ствари што има у Мисиру“. Затим „пође Јаков од Вирсавеје; и синови Израиљеви посадише Јакова, оца свог и децу своју и жене своје на кола која посла Фараон по њ“, а Јуда је послат напред Јосифу, у Гесем. После његове смрти синови су га однели назад у пећину у Макпели код Хеврона; Постање води сахрану поред гумна Хатад код Јордана, а то је далеко дужи заобилазни пут."
    - "Уобичајени пут био је приобални, који су Египћани звали Хоров пут и оивичили утврђењима и бунарима, од Чаруа на ивици Делте до Газе; Излазак га назива „путем к земљи филистејској, ако и беше краћи“ и каже да је Бог Израиљ одвео другим путем, у пустињу, тако да се кратко путовање претворило у четрдесет година. Руски синодални текст Изласка 12,40, следећи грчки, рачуна 430 година као време које су Израиљ и његови преци провели у Египту и у земљи Ханану, чиме се скраћује боравак у самом Египту; хебрејски има само Египат. У Јеванђељима истим путем су ишли Јосиф, Марија и дете, који су отишли у Мисир да побегну од Ирода. Јосифова рута на карти користи 1700. п. н. е., условну тачку, јер се доба праотаца оспорава."
  hu:
    - "A Nílus-delta keleti részén fekvő Gósen földjétől, ahol Jákób családja letelepedett, Kánaán déli partján fekvő Gázáig egyenes vonalban mintegy 260 km; Beérsebáig mintegy 290 km, Hebronig mintegy 320 km, Jeruzsálemig mintegy 340 km. Napi 25–30 km-rel ez gyalog tíz-tizennégy nap. A két föld határa Egyiptom patakja, a Wadi el-Arish volt, Gósentől mintegy 190 km-re, Gázától 74 km-re, így az út zöme az Észak-Sínai-félsziget homokján és bozótján vezetett át. A térképi pont Gósenen áll, Qantirnál, Ramszesz helyén."
    - "Az ősatyák újra meg újra ezen az úton jártak le. „Ábrám aláméne Égyiptomba, hogy ott tartózkodjék, mert nagy vala az éhség az országban.” Józsefet ismáelita kereskedőknek adták el, akik úton voltak, „hogy alávigyék Égyiptomba”; testvérei kétszer mentek gabonáért, ő pedig atyjának küldött „tíz szamarat égyiptomi javakkal terhelve”. Azután „felkerekedék azért Jákób Beérsebából, és elvivék Izráel fiai Jákóbot az ő atyjokat […] a szekereken, melyeket a Faraó küldött vala érette”, Júda pedig előre ment, „hogy útmutatója legyen Gósen felé”. Halála után fiai visszavitték a hebroni Makpéla barlangjába; a Mózes első könyve szerint a gyászmenet a Jordán melletti Átád szérűje mellett haladt el, ami jóval hosszabb kerülő."
    - "A szokásos út a parti út volt, amelyet az egyiptomiak Hórusz útjának neveztek, erődök és kutak szegélyezték, a delta szélén fekvő Tjarutól Gázáig; a Mózes második könyve „a Filiszteusok földje felé” vezető útnak nevezi, „noha közel vala az”, és azt mondja, hogy Isten Izráelt másfelé vezette, a pusztába, így a rövid út negyven évvé vált. A 2Móz 12,40 szinodális szövege a görögöt követve úgy számítja a 430 évet, mint az időt, amíg Izráel és atyái Egyiptomban és Kánaán földjén éltek, ami megrövidíti az Egyiptomban töltött időt; a héberben csak Egyiptom áll. Az evangéliumokban ugyanezen az úton haladt József, Mária és a gyermek, akik Heródes elől „Égyiptomba távozék”. A térkép József-túrája a Kr. e. 1700-at használja, amely megszokott időpont, mivel az ősatyák korát vitatják."
  fi:
    - "Itäisen Niilin suiston Gosenin maasta, johon Jaakobin perhe asettui, Gazaan Kanaanin eteläisellä rannikolla on noin 260 km linnuntietä; Beersebaan on noin 290 km, Hebroniin noin 320 km ja Jerusalemiin noin 340 km. 25–30 km:n päivävauhdilla se on kymmenestä neljääntoista päivää jalan. Maiden välinen raja oli Egyptin puro, Wadi el-Arish, noin 190 km Gosenista ja 74 km ennen Gazaa, joten suurin osa matkasta kulki Pohjois-Siinain hiekan ja pensaikon halki. Karttapiste on Gosenissa, Qantirissa, Ramseksen paikalla."
    - "Patriarkat kulkivat tätä tietä alas yhä uudelleen. ”Abram meni Egyptiin, asuakseen siellä jonkun aikaa, sillä nälänhätä maassa oli kova.” Joosef myytiin ismaelilaiskaravaanille, joka oli ”viemässä niitä Egyptiin”; hänen veljensä kävivät kahdesti viljaa hakemassa, ja hän lähetti isälleen ”kymmenen aasia, jotka olivat kuormitetut Egyptin parhaimmilla tavaroilla”. Sitten ”Jaakob lähti Beersebasta, ja Israelin pojat nostivat isänsä Jaakobin … vaunuihin, jotka farao oli lähettänyt häntä noutamaan”, ja Juuda lähetettiin edellä ”ilmoittamaan hänelle tulostaan Gooseniin”. Hänen kuoltuaan hänen poikansa veivät hänet takaisin Makpelan luolaan Hebroniin; 1. Mooseksen kirjan mukaan hautajaissaatto kulki Atadin puimatantereen ohi Jordanin varrella, paljon pitempää kiertotietä."
    - "Tavallinen tie oli rannikkotie, jota egyptiläiset kutsuivat Horuksen tieksi ja jonka varrella oli linnakkeita ja kaivoja, Deltan reunalla olevasta Tjarusta Gazaan; 2. Mooseksen kirja sanoo, ettei Jumala johdattanut Israelia ”sitä tietä, joka kulki filistealaisten maan kautta, vaikka se oli suorin”, vaan toista tietä, erämaahan, niin että lyhyt matka muuttui neljäksikymmeneksi vuodeksi. Synodaalinen teksti 2. Moos. 12:40:ssä laskee kreikkalaista tekstiä seuraten 430 vuotta ajaksi, jonka Israel ja heidän isänsä asuivat Egyptissä ja Kanaanin maassa, mikä lyhentää itse Egyptissä vietettyä aikaa; heprean teksti mainitsee pelkän Egyptin. Evankeliumeissa samaa tietä kulkivat Joosef, Maria ja lapsi, jotka Herodesta paetessaan lähtivät Egyptiin. Kartan Joosefin kierros käyttää vuotta 1700 eaa., sovinnaista kohtaa, koska patriarkkojen aikakaudesta kiistellään."
  vi:
    - "Từ xứ Gô-sen ở phía đông châu thổ sông Ni-lơ, nơi gia đình Gia-cốp định cư, đến Ga-xa trên bờ biển phía nam Ca-na-an là khoảng 260 km theo đường thẳng; đến Bê-e-Sê-ba khoảng 290 km, đến Hếp-rôn khoảng 320 km và đến Giê-ru-sa-lem khoảng 340 km. Với 25–30 km một ngày, đó là mười đến mười bốn ngày đi bộ. Biên giới giữa hai xứ là Khe Ê-díp-tô, tức Wadi el-Arish, cách Gô-sen khoảng 190 km và cách Ga-xa 74 km, nên phần lớn đường đi băng qua cát và bụi rậm miền bắc Si-nai. Điểm trên bản đồ nằm tại Gô-sen, ở Qantir, địa điểm của Ram-se-sơ."
    - "Các tổ phụ đi xuống đường này nhiều lần. “Sự đói kém ấy lớn, nên Áp-ram xuống xứ Ê-díp-tô mà kiều ngụ.” Giô-sép bị bán cho một đoàn người Ích-ma-ên “đang đem đi đến xứ Ê-díp-tô”; các anh ông hai lần xuống mua lúa, và ông sai đem về cho cha “mười con lừa chở các vật quí nhất trong xứ Ê-díp-tô”. Rồi “từ Bê-e-Sê-ba, Gia-cốp khởi đi; các con trai Y-sơ-ra-ên để Gia-cốp, cha mình, cùng các vợ và con mình lên xe cộ của Pha-ra-ôn đã sai đến rước những người đó”, còn Giu-đa đi trước đến Gô-sen. Sau khi ông qua đời, các con trai đưa ông về hang Mặc-bê-la ở Hếp-rôn; Sáng thế ký kể đám tang đi qua Gô-ren-A-tát, sân đạp lúa bên sông Giô-đanh, một đường vòng xa hơn nhiều."
    - "Con đường thông thường là đường ven biển, mà người Ê-díp-tô gọi là Đường Horus và dựng đầy đồn lũy cùng giếng nước, từ Tjaru ở rìa châu thổ đến Ga-xa; sách Xuất Ê-díp-tô Ký gọi đó là “đường về xứ Phi-li-tin, là đường gần hơn hết”, và nói Đức Chúa Trời dẫn Y-sơ-ra-ên đi đường khác, vào đồng vắng, nên một chuyến đi ngắn trở thành bốn mươi năm. Bản Synodal của Xuất 12:40, theo bản Hy Lạp, tính 430 năm là thời gian Y-sơ-ra-ên và tổ phụ họ sống ở Ê-díp-tô và ở xứ Ca-na-an, điều này rút ngắn thời gian ở riêng Ê-díp-tô; bản Hê-bơ-rơ chỉ có Ê-díp-tô. Trong các sách Phúc Âm, cũng con đường ấy đã đưa Giô-sép, Ma-ri và Hài Nhi, những người “lánh qua nước Ê-díp-tô” để tránh Hê-rốt. Chuyến hành trình Giô-sép trên bản đồ dùng năm 1700 TCN, một mốc quy ước, vì thời đại các tổ phụ còn đang tranh luận."
  ro:
    - "Din ținutul Gosen, în estul Deltei Nilului, unde s-a așezat familia lui Iacov, până la Gaza, pe coasta de sud a Canaanului, sunt circa 260 km în linie dreaptă; până la Beer-Șeba circa 290 km, până la Hebron circa 320 km și până la Ierusalim circa 340 km. Cu 25–30 km pe zi, asta înseamnă zece până la paisprezece zile pe jos. Granița dintre cele două țări era Pârâul Egiptului, wadi el-Arish, la circa 190 km de Gosen și la 74 km înainte de Gaza, astfel că cea mai mare parte a drumului trecea prin nisipul și tufărișul nordului Sinaiului. Punctul de pe hartă stă pe Gosen, la Qantir, locul Ramsesului."
    - "Patriarhii au coborât pe acest drum iar și iar. „Și s’a făcut foamete pre pământ; și s’a pogorît Avram în Eghipet ca să lăcuiască acolo, pentrucă se întărise foametea pre pământ.” Iosif a fost vândut unei caravane de ismaeliți care „mergeau să se pogoare în Eghipet”; frații lui au mers de două ori după grâu, iar el i-a trimis tatălui său „zece asini, cari purtau de toate bunătățile Eghipetului”. Apoi Iacov s-a ridicat din Beer-Șeba, iar fiii lui Israel și-au luat tatăl în carele trimise de Faraon, iar Iuda a fost trimis înainte spre Gosen. După moartea lui, fiii l-au dus înapoi la peștera Macpela din Hebron; Facerea face ca cortegiul funerar să treacă pe la aria lui Atad de lângă Iordan, un ocol mult mai lung."
    - "Drumul obișnuit era drumul de coastă, pe care egiptenii îl numeau Calea lui Horus și îl împânziseră cu fortărețe și fântâni, de la Tjaru, la marginea Deltei, până la Gaza; Ieșirea îl numește „pre calea pământului Filistenilor, că erà aproape” și spune că Dumnezeu a dus Israelul pe altă cale, în pustie, astfel că o călătorie scurtă a devenit patruzeci de ani. Textul sinodal din Ieșirea 12:40, după Septuaginta, socotește cei 430 de ani ca timpul în care Israel și părinții lor au locuit în Egipt și în țara Canaanului, ceea ce scurtează șederea în Egipt propriu-zis; textul ebraic are numai Egiptul. În Evanghelii, același drum i-a purtat pe Iosif, pe Maria și pe prunc, care „s’au dus în Eghipet” ca să scape de Irod. Turul lui Iosif de pe hartă folosește anul 1700 î.Hr., un punct convențional, deoarece epoca patriarhilor este disputată."
  bg:
    - "От земята Гесем в източната делта на Нил, където се заселило семейството на Яков, до Газа на южното крайбрежие на Ханаан има около 260 км по права линия; до Вирсавия — около 290 км, до Хеврон — около 320 км и до Йерусалим — около 340 км. При 25–30 км на ден това са десет до четиринадесет дни пеша. Границата между двете земи бил Египетският поток, Уади ел-Ариш, на около 190 км от Гесем и 74 км преди Газа, така че по-голямата част от пътя минавала през пясъците и храсталаците на северен Синай. Точката на картата стои в Гесем, при Кантир, мястото на Раамсес."
    - "Патриарсите слизали по този път отново и отново. „Слезе Аврам в Египет да поживее там, защото гладът беше тежък в Ханаанската земя.“ Йосиф бил продаден на керван исмаиляни, които „отхождаха да ги носят долу в Египет“; братята му ходили два пъти за жито, а той пратил на баща си „десет осли натоварени от Египетското добро“. След това „стана Яков от Вирсавее, и взеха синовете Израилеви Якова отца си… на колата които проводи Фараон“, а Юда тръгнал пред него, „за да прати той известие преди него в Гесен“. След смъртта му синовете му го пренесли обратно в пещерата Махпела при Хеврон; според Битие погребалното шествие минало край гумното на Атад при Йордан — много по-дълъг обиколен път."
    - "Обичайният път бил крайбрежният, който египтяните наричали Пътя на Хор и обзавели с крепости и кладенци, от Чару на края на Делтата до Газа; Изход го нарича „пътя на Филистимската земя, ако и да беше най-ближен“ и казва, че Бог превел Израил по друг път, през пустинята, така че краткото пътуване станало четиридесет години. Синодалният текст на Изход 12:40, следвайки гръцкия, отнася 430-те години към времето, когато Израил и бащите им живели в Египет и в Ханаанската земя, което скъсява престоя в самия Египет; еврейският текст има само Египет. В Евангелията по същия път минали Йосиф, Мария и детето: за да избяга от Ирод, Йосиф „отиде в Египет“. Обиколката за Йосиф на картата използва 1700 г. пр.н.е. като условна точка, тъй като епохата на патриарсите е спорна."
