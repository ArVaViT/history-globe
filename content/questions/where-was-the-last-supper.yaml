id: where-was-the-last-supper
question:
  en: "Where was the Last Supper?"
  ru: "Где была Тайная вечеря?"
  uk: "Де відбулася Таємна вечеря?"
  es: "¿Dónde fue la Última Cena?"
  pt: "Onde foi a Última Ceia?"
  de: "Wo fand das letzte Abendmahl statt?"
  fr: "Où eut lieu la dernière Cène ?"
  pl: "Gdzie odbyła się Ostatnia Wieczerza?"
  it: "Dove si svolse l’Ultima Cena?"
  cs: "Kde se konala poslední večeře?"
  nl: "Waar vond het Laatste Avondmaal plaats?"
  sv: "Var hölls den sista måltiden?"
  nb: "Hvor ble det siste måltid holdt?"
  tl: "Saan ginanap ang Huling Hapunan?"
answer:
  en:
    - "The Gospels do not say where the house stood, only that it was inside Jerusalem. Tradition since the fourth century places it on the south-western hill, today's Mount Zion, just outside the Zion Gate of the Old City, where the Cenacle, a Gothic hall of the Crusader period, is shown as the upper room; the map point stands on that hill, about 800 m south-west of the Jerusalem point and about 1.3 km from Gethsemane in a straight line. The site is likely rather than proven. The night of the supper, the eve of the Passover or the feast itself, is treated in the question on the date of the crucifixion."
    - "Mark tells how the room was found: Jesus sent two disciples into the city, where “there shall meet you a man bearing a pitcher of water: follow him”, and the master of the house “will shew you a large upper room furnished and prepared”. Luke repeats the sign of the pitcher; Matthew says only “Go into the city to such a man”. The owner is never named. After the Ascension the apostles “went up into an upper room, where abode both Peter, and James, and John, and Andrew”; at Pentecost a sound from heaven “filled all the house where they were sitting”; and later Peter, freed from prison, came “to the house of Mary the mother of John, whose surname was Mark; where many were gathered together praying”. Christian tradition took these as one house and one room, though Luke's words do not say so."
    - "The tradition goes back to the fourth century. Cyril of Jerusalem, about 350, spoke of the upper church of the apostles where the Spirit came down; Epiphanius wrote that when Hadrian came to Jerusalem he found a small church of God still standing on Zion, where the disciples had gone up to the upper room; Egeria in the 380s describes Pentecost kept in Sion. The basilica of Holy Sion rose there late in the fourth century; the Persians burnt it in 614, the Crusaders rebuilt it, and their hall is the Cenacle of today, with the cenotaph venerated as David's tomb beneath it; the Franciscans held it from the 1330s until the Ottomans made it a mosque in the sixteenth century. Bargil Pixner argued in 1990 that walls under the Cenacle belong to a Jewish-Christian synagogue, and later that the house stood in an Essene quarter; many scholars find both unproven."
  ru:
    - "Евангелия не говорят, где стоял дом, — только что он был в Иерусалиме. Предание с IV века помещает его на юго-западном холме, нынешней горе Сион, сразу за Сионскими воротами Старого города, где горницей показывают Сионскую горницу — готический зал времён крестоносцев; точка карты стоит на этом холме, примерно в 800 м к юго-западу от точки Иерусалима и в 1,3 км от Гефсимании по прямой. Место вероятное, но не доказанное. О ночи вечери — накануне Пасхи или в самый праздник — говорит вопрос о дате распятия."
    - "Марк рассказывает, как нашли комнату: Иисус послал двух учеников в город, где «встретится вам человек, несущий кувшин воды; последуйте за ним», и хозяин дома «покажет вам горницу большую, устланную, готовую». Лука повторяет знак с кувшином; Матфей говорит только: «пойдите в город к такому-то». Хозяин нигде не назван. После Вознесения апостолы «взошли в горницу, где и пребывали, Петр и Иаков, Иоанн и Андрей»; в Пятидесятницу шум с неба «наполнил весь дом, где они находились»; позже Пётр, выведенный из темницы, пришёл «к дому Марии, матери Иоанна, называемого Марком, где многие собрались и молились». Христианское предание сочло всё это одним домом и одной горницей, хотя слова Луки этого не говорят."
    - "Предание прослеживается до IV века. Кирилл Иерусалимский около 350 года говорил о верхней церкви апостолов, где сошёл Дух; Епифаний писал, что Адриан, придя в Иерусалим, нашёл на Сионе ещё стоящую малую церковь Божию — там, где ученики поднялись в горницу; Эгерия в 380-х годах описывает службу Пятидесятницы на Сионе. В конце IV века там встала базилика Святого Сиона; персы сожгли её в 614 году, крестоносцы отстроили, и их зал — нынешняя Сионская горница, а под ней кенотаф, почитаемый как гробница Давида; францисканцы владели ею с 1330-х годов, пока османы в XVI веке не обратили её в мечеть. Баргил Пикснер в 1990 году доказывал, что стены под горницей принадлежат иудеохристианской синагоге, а позже — что дом стоял в ессейском квартале; многие учёные считают и то и другое недоказанным."
  uk:
    - "Євангелія не кажуть, де стояв дім, лише що він був усередині Єрусалима. Переказ від IV ст. поміщає його на південно-західному пагорбі, нинішній горі Сіон, одразу за Сіонською брамою Старого міста, де Сіонську горницю, готичну залу доби хрестоносців, показують як горницю; точка на мапі стоїть на тому пагорбі, приблизно за 800 м на південний захід від точки Єрусалима і приблизно за 1,3 км від Гетсиманії по прямій. Це місце ймовірне, але не доведене. Ніч вечері, переддень Пасхи чи саме свято, розглянуто в питанні про дату розп'яття."
    - "Марк розповідає, як знайшли кімнату: Ісус послав двох учнів у місто, де «зустріне вас чоловік, несучи глек води; йдїть за ним», а господар дому «покаже гірницю простору, прибрану й готову». Лука повторює знак глека; Матвій каже лише «Йдїть у город до оттакого». Власника не названо ніколи. Після Вознесіння апостоли «зійшли на гірницю, де пробували Петр та Яков, та Йоан, та Андрей»; на П'ятдесятницю гук з неба «сповнив увесь дім, де вони сидїли»; а пізніше Петро, звільнений із в'язниці, прийшов «до хати Мариї, матери Йоана, званого Марком, де многі зібрались і молились». Християнський переказ вважав це одним домом і однією кімнатою, хоч слова Луки цього не кажуть."
    - "Переказ сягає IV ст. Кирило Єрусалимський близько 350 р. говорив про верхню церкву апостолів, де зійшов Дух; Єпіфаній писав, що коли Адріан прийшов до Єрусалима, він застав на Сіоні невелику церкву Божу, де учні зійшли до горниці; Егерія в 380-х рр. описує П'ятдесятницю, що святкувалася на Сіоні. Базиліка Святого Сіону постала там наприкінці IV ст.; перси спалили її 614 р., хрестоносці відбудували її, і їхня зала — нинішня Сіонська горниця, з кенотафом, що його шанують як гробницю Давида, під нею; францисканці володіли нею з 1330-х рр., доки османи не зробили її мечеттю у XVI ст. Баргіл Пікснер 1990 р. доводив, що мури під горницею належать іудео-християнській синагозі, а пізніше — що дім стояв в ессейському кварталі; багато вчених вважають обидва твердження недоведеними."
  es:
    - "Los Evangelios no dicen dónde estaba la casa, solo que estaba dentro de Jerusalén. La tradición desde el siglo IV la sitúa en la colina suroccidental, el actual monte Sion, justo fuera de la puerta de Sion de la Ciudad Vieja, donde el Cenáculo, una sala gótica de la época de los cruzados, se muestra como el aposento alto; el punto del mapa está en esa colina, a unos 800 m al suroeste del punto de Jerusalén y a unos 1,3 km de Getsemaní en línea recta. El lugar es probable, no demostrado. La noche de la cena, la víspera de la Pascua o la propia fiesta, se trata en la pregunta sobre la fecha de la crucifixión."
    - "Marcos cuenta cómo se halló la sala: Jesús envió a dos discípulos a la ciudad, donde «os encontrará un hombre que lleva un cántaro de agua; seguidle», y el señor de la casa «os mostrará un gran cenáculo ya preparado». Lucas repite la señal del cántaro; Mateo dice solo: «Id á la ciudad á cierto hombre». El dueño nunca es nombrado. Tras la Ascensión, los apóstoles «subieron al aposento alto, donde moraban Pedro y Jacobo, y Juan y Andrés»; en Pentecostés un estruendo del cielo «hinchió toda la casa donde estaban sentados»; y más tarde Pedro, liberado de la cárcel, llegó «á casa de María la madre de Juan, el que tenía por sobrenombre Marcos, donde muchos estaban juntos orando». La tradición cristiana tomó todo esto como una sola casa y una sola sala, aunque las palabras de Lucas no lo dicen."
    - "La tradición se remonta al siglo IV. Cirilo de Jerusalén, hacia el 350, habló de la iglesia superior de los apóstoles donde descendió el Espíritu; Epifanio escribió que, cuando Adriano llegó a Jerusalén, halló aún en pie en Sion una pequeña iglesia de Dios, donde los discípulos subieron al aposento alto; Egeria, en los años 380, describe Pentecostés en Sion. La basílica de Santa Sion se alzó a fines del siglo IV; los persas la quemaron en 614, los cruzados la reconstruyeron, y su sala es el Cenáculo actual, con el cenotafio venerado como tumba de David debajo; los franciscanos lo tuvieron desde los años 1330 hasta que los otomanos lo hicieron mezquita en el siglo XVI. Bargil Pixner sostuvo en 1990 que unos muros bajo el Cenáculo pertenecen a una sinagoga judeocristiana, y después que la casa estaba en un barrio esenio; muchos estudiosos las consideran no demostradas."
  pt:
    - "Os Evangelhos não dizem onde ficava a casa, apenas que era dentro de Jerusalém. A tradição desde o século IV a situa na colina sudoeste, o atual monte Sião, logo fora da Porta de Sião da Cidade Velha, onde o Cenáculo, uma sala gótica do período das Cruzadas, é mostrado como a sala do andar de cima; o ponto do mapa fica nessa colina, a cerca de 800 m a sudoeste do ponto de Jerusalém e a cerca de 1,3 km do Getsêmani em linha reta. O sítio é provável, não comprovado. A noite da ceia, a véspera da Páscoa ou a própria festa, é tratada na pergunta sobre a data da crucificação."
    - "Marcos conta como o cenáculo foi encontrado: Jesus enviou dois discípulos à cidade, onde “um homem carregando um cântaro de água virá ao encontro de vocês. Sigam-no”, e o dono da casa “lhes mostrará uma grande sala no andar de cima, mobiliada e pronta”. Lucas repete o sinal do cântaro; Mateus diz apenas “Vão à cidade, a um certo homem”. O dono nunca é nomeado. Depois da Ascensão, os apóstolos “subiram ao cenáculo onde estavam hospedados, isto é, Pedro, João, Tiago, André…”; no Pentecostes veio do céu um som que “encheu toda a casa onde estavam assentados”; e mais tarde Pedro, libertado da prisão, foi “à casa de Maria, mãe de João, chamado Marcos, onde muitos estavam reunidos e oravam”. A tradição cristã tomou essas passagens por uma só casa e uma só sala, embora as palavras de Lucas não o digam."
    - "A tradição remonta ao século IV. Cirilo de Jerusalém, por volta de 350, falou da igreja superior dos apóstolos onde o Espírito desceu; Epifânio escreveu que, quando Adriano chegou a Jerusalém, encontrou ainda de pé uma pequena igreja de Deus em Sião, onde os discípulos haviam subido ao cenáculo; Egéria, na década de 380, descreve o Pentecostes celebrado em Sião. A basílica da Santa Sião se ergueu ali no fim do século IV; os persas a queimaram em 614, os cruzados a reconstruíram, e seu salão é o Cenáculo de hoje, com o cenotáfio venerado como túmulo de Davi embaixo; os franciscanos o mantiveram desde a década de 1330 até que os otomanos o fizeram mesquita no século XVI. Bargil Pixner sustentou em 1990 que paredes sob o Cenáculo pertencem a uma sinagoga judeu-cristã e, mais tarde, que a casa ficava num bairro essênio; muitos estudiosos acham ambas não comprovadas."
  de:
    - "Die Evangelien sagen nicht, wo das Haus stand, nur dass es innerhalb Jerusalems lag. Die Überlieferung seit dem 4. Jahrhundert setzt es auf den südwestlichen Hügel, den heutigen Berg Zion, unmittelbar außerhalb des Zionstors der Altstadt, wo der Abendmahlssaal, eine gotische Halle der Kreuzfahrerzeit, als Obergemach gezeigt wird; der Kartenpunkt steht auf diesem Hügel, in der Luftlinie etwa 800 m südwestlich des Jerusalem-Punkts und etwa 1,3 km von Gethsemane. Die Stätte ist wahrscheinlich, aber nicht bewiesen. Die Nacht des Mahls, der Vorabend des Passa oder das Fest selbst, wird in der Frage nach dem Datum der Kreuzigung behandelt."
    - "Markus erzählt, wie der Raum gefunden wurde: Jesus sandte zwei Jünger in die Stadt, wo „es wird euch ein Mensch begegnen, der trägt einen Krug mit Wasser; folget ihm nach“, und der Hausherr „wird euch einen großen Saal zeigen, der mit Polstern versehen und bereit ist“. Lukas wiederholt das Zeichen des Kruges; Matthäus sagt nur: „Gehet hin in die Stadt zu einem“. Der Eigentümer wird nie genannt. Nach der Himmelfahrt „stiegen sie auf den Söller, da denn sich aufhielten Petrus und Jakobus, Johannes und Andreas“; an Pfingsten „erfüllte“ ein Brausen vom Himmel „das ganze Haus, da sie saßen“; und später kam der aus dem Gefängnis befreite Petrus „vor das Haus Marias, der Mutter des Johannes, der mit dem Zunamen Markus hieß, da viele beieinander waren und beteten“. Die Überlieferung hielt dies für ein Haus und einen Raum, obwohl Lukas das nicht sagt."
    - "Die Überlieferung reicht ins 4. Jahrhundert zurück. Kyrill von Jerusalem sprach um 350 von der oberen Apostelkirche, wo der Geist herabkam; Epiphanius schrieb, Hadrian habe in Jerusalem auf dem Zion noch eine kleine Kirche Gottes gefunden, wo die Jünger ins Obergemach gegangen waren; Egeria beschreibt in den 380er-Jahren Pfingsten in Sion. Die Basilika Hagia Sion erhob sich dort Ende des 4. Jahrhunderts; die Perser verbrannten sie 614, die Kreuzfahrer bauten sie wieder auf, und ihre Halle ist der heutige Abendmahlssaal, darunter der als Davids Grab verehrte Kenotaph; die Franziskaner hielten ihn seit den 1330er-Jahren, bis ihn die Osmanen im 16. Jahrhundert zur Moschee machten. Bargil Pixner vertrat 1990, Mauern unter dem Saal gehörten zu einer judenchristlichen Synagoge, später, das Haus habe in einem Essenerviertel gestanden; viele halten beides für unbewiesen."
  fr:
    - "Les Évangiles ne disent pas où se trouvait la maison, seulement qu’elle était à l’intérieur de Jérusalem. La tradition depuis le IVe siècle la place sur la colline sud-ouest, l’actuel mont Sion, juste hors de la porte de Sion de la vieille ville, où le Cénacle, salle gothique de l’époque des croisés, est montré comme la chambre haute ; le point de la carte se trouve sur cette colline, à environ 800 m au sud-ouest du point de Jérusalem et à environ 1,3 km de Gethsémané à vol d’oiseau. Le site est probable plutôt que prouvé. La nuit du repas, veille de la Pâque ou fête elle-même, est traitée dans la question sur la date de la crucifixion."
    - "Marc raconte comment la salle fut trouvée : Jésus envoya deux disciples dans la ville, où « vous rencontrerez un homme portant une cruche d’eau, suivez-le », et le maître de la maison « vous montrera une grande chambre haute, meublée et toute prête ». Luc répète le signe de la cruche ; Matthieu dit seulement : « Allez à la ville chez un tel ». Le propriétaire n’est jamais nommé. Après l’Ascension, les apôtres « montèrent dans la chambre haute où ils se tenaient d’ordinaire ; c’étaient Pierre, Jean, Jacques, André » ; à la Pentecôte, un bruit venu du ciel « remplit toute la maison où ils étaient assis » ; et plus tard Pierre, délivré de prison, se dirigea « vers la maison de Marie, mère de Jean, surnommé Marc, où beaucoup de personnes étaient réunies et priaient ». La tradition chrétienne y a vu une seule maison et une seule salle, ce que Luc ne dit pas."
    - "La tradition remonte au IVe siècle. Cyrille de Jérusalem, vers 350, parlait de l’église haute des apôtres où l’Esprit descendit ; Épiphane écrivit qu’à l’arrivée d’Hadrien, une petite église de Dieu se dressait encore sur Sion, où les disciples étaient montés à la chambre haute ; Égérie, dans les années 380, décrit la Pentecôte fêtée à Sion. La basilique de la Sainte-Sion s’y éleva à la fin du IVe siècle ; les Perses la brûlèrent en 614, les croisés la rebâtirent, et leur salle est le Cénacle actuel, au-dessus du cénotaphe vénéré comme le tombeau de David ; les franciscains l’occupèrent dès les années 1330, jusqu’à ce que les Ottomans en fassent une mosquée au XVIe siècle. Bargil Pixner soutint en 1990 que des murs sous le Cénacle sont ceux d’une synagogue judéo-chrétienne, puis que la maison était dans un quartier essénien ; beaucoup jugent ces thèses non prouvées."
  pl:
    - "Ewangelie nie mówią, gdzie stał dom, tylko że znajdował się wewnątrz Jerozolimy. Tradycja od IV wieku umieszcza go na południowo-zachodnim wzgórzu, dzisiejszym Syjonie, tuż za Bramą Syjońską Starego Miasta, gdzie Wieczernik, gotycka sala z okresu krzyżowców, jest pokazywany jako górna izba; punkt na mapie stoi na tym wzgórzu, około 800 m na południowy zachód od punktu Jerozolimy i około 1,3 km od Getsemani w linii prostej. Miejsce jest prawdopodobne, ale nie dowiedzione. Noc wieczerzy, wigilię Paschy albo samo święto, omawia pytanie o datę ukrzyżowania."
    - "Marek opowiada, jak znaleziono izbę: Jezus posłał dwóch uczniów do miasta, gdzie „spotka się z wami człowiek, dzban wody niosący; idźcież za nim”, a gospodarz domu „on wam ukaże salę wielką usłaną i gotową”. Łukasz powtarza znak dzbana; Mateusz mówi tylko: „Idźcie do miasta, do niektórego człowieka”. Właściciel nigdy nie jest nazwany. Po Wniebowstąpieniu apostołowie „wstąpili na salę, gdzie mieszkali Piotr, i Jakób, i Jan, i Andrzej”; w Pięćdziesiątnicę szum z nieba „napełnił wszystek dom, kędy siedzieli”; a później Piotr, uwolniony z więzienia, przyszedł „do domu Maryi, matki Janowej, którego nazywano Markiem, gdzie się ich było wiele zgromadziło i modlili się”. Tradycja chrześcijańska uznała to za jeden dom i jedną izbę, choć słowa Łukasza tego nie mówią."
    - "Tradycja sięga IV wieku. Cyryl Jerozolimski około 350 mówił o górnym kościele apostołów, gdzie zstąpił Duch; Epifaniusz pisał, że gdy Hadrian przybył do Jerozolimy, zastał na Syjonie wciąż stojący mały kościół Boży, gdzie uczniowie wstąpili do górnej izby; Egeria w latach 380. opisuje Pięćdziesiątnicę obchodzoną na Syjonie. Bazylika Świętego Syjonu powstała tam pod koniec IV wieku; Persowie spalili ją w 614, krzyżowcy odbudowali, a ich sala jest dzisiejszym Wieczernikiem, z kenotafem czczonym jako grób Dawida pod nim; franciszkanie posiadali go od lat 30. XIV wieku, aż Osmanowie przekształcili go w meczet w XVI wieku. Bargil Pixner twierdził w 1990, że mury pod Wieczernikiem należą do judeochrześcijańskiej synagogi, a później, że dom stał w dzielnicy esseńskiej; wielu uczonych uważa oba twierdzenia za niedowiedzione."
  it:
    - "I Vangeli non dicono dove sorgesse la casa, solo che era dentro Gerusalemme. La tradizione dal IV secolo la colloca sulla collina sud-occidentale, l’odierno Monte Sion, subito fuori dalla Porta di Sion della Città Vecchia, dove il Cenacolo, una sala gotica del periodo crociato, è mostrato come la sala di sopra; il punto della mappa si trova su quella collina, a circa 800 m a sud-ovest del punto di Gerusalemme e a circa 1,3 km dal Getsemani in linea d’aria. Il sito è probabile più che provato. La notte della cena, la vigilia della Pasqua o la festa stessa, è trattata nella domanda sulla data della crocifissione."
    - "Marco racconta come fu trovata la sala: Gesù mandò due discepoli in città, dove «vi verrà incontro un uomo che porterà una brocca d’acqua; seguitelo», e il padrone di casa «vi mostrerà di sopra una gran sala ammobiliata e pronta». Luca ripete il segno della brocca; Matteo dice soltanto: «Andate in città dal tale». Il proprietario non è mai nominato. Dopo l’Ascensione gli apostoli «salirono nella sala di sopra ove solevano trattenersi Pietro e Giovanni e Giacomo e Andrea»; alla Pentecoste un suono dal cielo «riempì tutta la casa dov’essi sedevano»; e più tardi Pietro, liberato dalla prigione, venne «alla casa di Maria, madre di Giovanni soprannominato Marco, dove molti fratelli stavano raunati e pregavano». La tradizione cristiana intese questi come una sola casa e una sola sala, benché le parole di Luca non lo dicano."
    - "Risale al IV secolo: Cirillo di Gerusalemme, verso il 350, parlò della chiesa superiore degli apostoli dove scese lo Spirito; Epifanio scrisse che quando Adriano giunse a Gerusalemme trovò ancora in piedi su Sion una piccola chiesa di Dio, dove i discepoli erano saliti alla sala di sopra; Egeria negli anni 380 descrive la Pentecoste celebrata a Sion. La basilica di Santa Sion vi sorse alla fine del IV secolo; i Persiani la bruciarono nel 614, i Crociati la ricostruirono, la loro sala è il Cenacolo di oggi, con sotto il cenotafio venerato come tomba di Davide; i Francescani lo tennero dagli anni 1330 finché gli Ottomani ne fecero una moschea nel XVI secolo. Bargil Pixner sostenne nel 1990 che le mura sotto il Cenacolo appartengano a una sinagoga giudeo-cristiana, e poi che la casa sorgesse in un quartiere degli Esseni; molti studiosi le trovano entrambe non provate."
  cs:
    - "Evangelia neříkají, kde dům stál, jen že byl uvnitř Jeruzaléma. Tradice od 4. století ho klade na jihozápadní pahorek, dnešní Horu Sijón, těsně za Sijónskou bránou Starého města, kde se jako horní místnost ukazuje Večeřadlo, gotický sál z doby křižáků; bod na mapě stojí na tom pahorku, asi 800 m jihozápadně od bodu Jeruzaléma a vzdušnou čarou asi 1,3 km od Getsemane. Místo je pravděpodobné, ne prokázané. Noc večeře, předvečer velikonoc, nebo sám svátek, se probírá v otázce o datu ukřižování."
    - "Marek vypráví, jak byla místnost nalezena: Ježíš poslal dva učedníky do města, kde „potkáť vás člověk dčbán vody nesa. Jdětež za ním“, a hospodář domu „ukáže večeřadlo veliké, podlážené a připravené“. Lukáš opakuje znamení džbánu; Matouš říká jen „Jděte tam k jednomu do města“. Majitel není nikdy jmenován. Po nanebevstoupení apoštolové „vstoupili do vrchního příbytku domu, kdež přebývali, i Petr i Jakub, i Jan a Ondřej“; o letnicích zvuk s nebe „naplnil všecken dům, kdež seděli“; a později Petr, propuštěn z vězení, přišel „k domu Marie, matky Janovy, kterýž příjmí měl Marek, kdež se jich bylo mnoho sešlo, a modlili se“. Křesťanská tradice je pokládala za jeden dům a jednu místnost, ačkoli Lukášova slova to neříkají."
    - "Tradice sahá do 4. století. Cyril Jeruzalémský kolem roku 350 mluvil o horním kostele apoštolů, kde sestoupil Duch; Epifanios psal, že když Hadrianus přišel do Jeruzaléma, nalezl na Sijónu stále stát malý Boží kostel, kam učedníci vystoupili do horní místnosti; Egerie v 380. letech popisuje letnice slavené na Sijónu. Bazilika Svatého Sijónu tam vyrostla koncem 4. století; Peršané ji roku 614 vypálili, křižáci ji obnovili a jejich sál je dnešním Večeřadlem, s kenotafem uctívaným jako Davidův hrob pod ním; františkáni je drželi od 30. let 14. století, dokud z něj Osmané v 16. století neudělali mešitu. Bargil Pixner roku 1990 tvrdil, že zdi pod Večeřadlem patří židokřesťanské synagoze, a později, že dům stál v esejské čtvrti; mnozí badatelé oboje pokládají za nedokázané."
  nl:
    - "De evangeliën zeggen niet waar het huis stond, alleen dat het in Jeruzalem lag. De overlevering plaatst het sinds de vierde eeuw op de zuidwestelijke heuvel, de huidige berg Sion, net buiten de Sionspoort van de Oude Stad, waar het Cenakel, een gotische zaal uit de kruisvaardersperiode, wordt getoond als de bovenzaal; het punt op de kaart staat op die heuvel, ongeveer 800 m ten zuidwesten van het punt van Jeruzalem en hemelsbreed ongeveer 1,3 km van Getsemane. De plaats is waarschijnlijk maar niet bewezen. De nacht van het avondmaal, de vooravond van Pesach of het feest zelf, wordt behandeld in de vraag over de datum van de kruisiging."
    - "Marcus vertelt hoe de zaal werd gevonden: Jezus zond twee leerlingen de stad in, waar “u zal een mens ontmoeten, dragende een kruik water, volgt dien”, en de heer des huizes “zal u wijzen een grote opperzaal, toegerust en gereed”. Lukas herhaalt het teken van de kruik; Mattheüs zegt alleen “Gaat heen in de stad, tot zulk een”. De eigenaar wordt nooit genoemd. Na de hemelvaart “gingen zij op in de opperzaal, waar zij bleven, namelijk Petrus en Jakobus, en Johannes en Andreas”; met Pinksteren kwam een geluid uit de hemel dat “het gehele huis, waar zij zaten” vervulde; en later kwam Petrus, uit de gevangenis bevrijd, “naar het huis van Maria, de moeder van Johannes, die toegenaamd was Markus, alwaar velen samenvergaderd en biddende waren”. De christelijke traditie hield dit voor één huis en één zaal, hoewel de woorden van Lukas dat niet zeggen."
    - "De overlevering gaat terug tot de vierde eeuw. Cyrillus van Jeruzalem noemde omstreeks 350 de bovenkerk van de apostelen waar de Geest neerdaalde; Epiphanius schreef dat Hadrianus bij zijn komst in Jeruzalem een kleine kerk van God nog op de Sion zag staan, waar de leerlingen naar de bovenzaal gingen; Egeria beschrijft in de jaren 380 Pinksteren op de Sion. De basiliek van Heilige Sion verrees er laat in de vierde eeuw; de Perzen verbrandden haar in 614, de kruisvaarders herbouwden haar en hun zaal is het huidige Cenakel, met daaronder het als graf van David vereerde cenotaaf; de franciscanen hadden het vanaf 1330 tot de Ottomanen er in de zestiende eeuw een moskee van maakten. Bargil Pixner betoogde in 1990 dat muren onder het Cenakel bij een joods-christelijke synagoge horen, en later dat het huis in een Essenenwijk stond; velen achten beide onbewezen."
  sv:
    - "Evangelierna säger inte var huset låg, bara att det låg inne i Jerusalem. Traditionen sedan 300-talet förlägger det till den sydvästra kullen, dagens Sions berg, strax utanför Sions port i Gamla staden, där Cenaculum, en gotisk sal från korstågstiden, visas som salen i övre våningen; kartpunkten står på den kullen, omkring 800 m sydväst om Jerusalempunkten och omkring 1,3 km från Getsemane i fågelvägen. Platsen är sannolik snarare än bevisad. Måltidens natt, påskaftonen eller själva högtiden, behandlas i frågan om korsfästelsens datum."
    - "Markus berättar hur rummet hittades: Jesus sände två lärjungar in i staden, där ”skolen I möta en man som bär en kruka vatten. Följen honom”, och husbonden ”skall visa eder en stor sal i övre våningen, tillredd och ordnad för måltid”. Lukas upprepar tecknet med krukan; Matteus säger bara ”Gån in i staden till den och den”. Ägaren nämns aldrig vid namn. Efter himmelsfärden ”gingo de upp i den sal i övre våningen, där de plägade vara tillsammans: Petrus och Johannes och Jakob och Andreas”; vid pingst fyllde ett dån från himlen ”hela huset där de sutto”; och senare kom Petrus, befriad ur fängelset, ”till det hus där Maria bodde, hon som var moder till den Johannes som ock kallades Markus; där voro ganska många församlade och bådo”. Kristen tradition tog dessa som ett hus och ett rum, fastän Lukas ord inte säger det."
    - "Traditionen går tillbaka till 300-talet. Kyrillos av Jerusalem talade omkring 350 om apostlarnas övre kyrka där Anden kom ned; Epifanios skrev att när Hadrianus kom till Jerusalem fann han en liten Guds kyrka som ännu stod på Sion, dit lärjungarna hade gått upp till salen i övre våningen; Egeria beskriver på 380-talet hur pingsten firades i Sion. Basilikan Heliga Sion reste sig där sent på 300-talet; perserna brände den 614, korsfararna byggde upp den igen, och deras sal är dagens Cenaculum, med kenotafen som vördas som Davids grav under den; franciskanerna höll den från 1330-talet tills osmanerna gjorde den till en moské på 1500-talet. Bargil Pixner hävdade 1990 att murar under Cenaculum tillhör en judekristen synagoga, och senare att huset låg i ett essenerkvarter; många forskare finner båda obevisade."
  nb:
    - "Evangeliene sier ikke hvor huset sto, bare at det var inne i Jerusalem. Tradisjonen siden 300-tallet plasserer det på den sørvestre høyden, dagens Sionfjellet, like utenfor Sionporten i gamlebyen, der Nattverdsalen, en gotisk hall fra korsfarertiden, vises som salen i øvre etasje; kartpunktet står på den høyden, omtrent 800 m sørvest for Jerusalem-punktet og omtrent 1,3 km fra Getsemane i luftlinje. Stedet er sannsynlig snarere enn bevist. Natten for måltidet, påskeaften eller selve høytiden, behandles i spørsmålet om korsfestelsens dato."
    - "Markus forteller hvordan rommet ble funnet: Jesus sendte to disipler inn i byen, der «skal møte eder en mann som bærer en krukke vann; følg ham», og husbonden «skal vise eder en stor sal, som står ferdig med benker og hynder». Lukas gjentar tegnet med krukken; Matteus sier bare: «Gå inn i byen til en mann der». Eieren nevnes aldri. Etter himmelfarten «gikk de op på den sal hvor de holdt til både Peter og Johannes, og Jakob og Andreas»; ved pinse fylte en lyd fra himmelen «hele huset der de satt»; og senere kom Peter, befridd fra fengselet, «til det hus som eides av Maria, mor til Johannes som kaltes med tilnavn Markus; der var mange samlet og holdt bønn». Kristen tradisjon tok disse som ett hus og ett rom, selv om Lukas’ ord ikke sier det."
    - "Tradisjonen går tilbake til 300-tallet. Kyrillos av Jerusalem talte omkring 350 om apostlenes øvre kirke der Ånden kom ned; Epifanios skrev at da Hadrian kom til Jerusalem, fant han en liten Guds kirke som fortsatt sto på Sion, der disiplene hadde gått opp til salen i øvre etasje; Egeria beskriver på 380-tallet pinsen feiret på Sion. Basilikaen Hellige Sion reiste seg der sent på 300-tallet; perserne brente den i 614, korsfarerne gjenreiste den, og deres hall er dagens Nattverdssal, med kenotafet som æres som Davids grav under; fransiskanerne hadde den fra 1330-årene til osmanene gjorde den til moské på 1500-tallet. Bargil Pixner hevdet i 1990 at murer under Nattverdsalen hører til en jødekristen synagoge, og senere at huset sto i et essenerkvarter; mange forskere finner begge deler ubevist."
  tl:
    - "Hindi sinasabi ng mga Ebanghelyo kung saan nakatayo ang bahay, tanging nasa loob ito ng Jerusalem. Inilalagay ito ng tradisyon mula pa noong ika-4 na siglo sa timog-kanlurang burol, ang Bundok Sion ngayon, sa labas lamang ng Pintuang Sion ng Lumang Lungsod, kung saan ipinakikita ang Cenacle, isang bulwagang Gotiko ng panahon ng mga Krusado, bilang silid sa itaas; nasa burol na iyon ang punto sa mapa, mga 800 m sa timog-kanluran ng punto ng Jerusalem at mga 1.3 km mula sa Getsemani sa tuwid na guhit. Malamang ngunit hindi napatunayan ang pook. Ang gabi ng hapunan, ang bisperas ng Paskua o ang kapistahan mismo, ay tinatalakay sa tanong tungkol sa petsa ng pagpapako sa krus."
    - "Sa Marcos, isinugo ni Jesus ang dalawang alagad sa lungsod, kung saan “masasalubong ninyo ang isang lalake na may dalang isang bangang tubig: sundan ninyo siya”, at sinabi tungkol sa may-ari ng bahay: “ituturo niya sa inyo ang isang malaking silid sa itaas na nagagayakan at handa na”. Inuulit ni Lucas ang tanda ng banga; kay Mateo, “Magsipasok kayo sa bayan sa gayong tao” lamang. Walang pangalan ang may-ari. Pagkatapos ng Pag-akyat, “nagsiakyat sila sa silid sa itaas, na kinatitirahan nila; ni Pedro at ni Juan at ni Santiago at ni Andres”; sa Pentecostes, “pinuno ang buong bahay na kanilang kinauupuan” ng tunog mula sa langit; at kalaunan ay pumaroon si Pedro “sa bahay ni Maria na ina ni Juan na may pamagat na Marcos; na kinaroroonan ng maraming nangagkakatipon at nagsisipanalangin”. Iisa ang tingin ng tradisyon sa mga ito, bagaman hindi ito sinasabi ni Lucas."
    - "Mula ika-4 na siglo ang tradisyon: binanggit ni Cirilo ng Jerusalem, mga 350, ang itaas na simbahan ng mga apostol na pinagbabaan ng Espiritu; isinulat ni Epifanio na pagdating ni Hadriano sa Jerusalem ay may maliit na simbahan ng Dios sa Sion, kung saan umakyat ang mga alagad sa itaas na silid; inilarawan ni Egeria noong dekada 380 ang Pentecostes sa Sion. Doon itinayo noong huling ika-4 na siglo ang basilika ng Banal na Sion, na sinunog ng mga Persiano noong 614 at muling itinayo ng mga Krusado; ang bulwagan nila ang Cenacle ngayon, na may cenotaph sa ilalim na pinararangalan bilang libingan ni David, hawak ng mga Pransiskano mula dekada 1330 hanggang gawing moske ng mga Otomano noong ika-16 siglo. Iginiit ni Bargil Pixner (1990) na sinagogang Judio-Kristiyano ang mga pader sa ilalim, at kalaunan na nasa distrito ng mga Essene ang bahay; pinagdududahan ng maraming iskolar ang dalawa."
