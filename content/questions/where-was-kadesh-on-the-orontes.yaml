id: where-was-kadesh-on-the-orontes
question:
  en: "Where was Kadesh on the Orontes, where Egypt fought the Hittites?"
  ru: "Где находился Кадеш на Оронте, где Египет сражался с хеттами?"
  uk: "Де був Кадеш на Оронті, де Єгипет воював із хеттами?"
  es: "¿Dónde estaba Cades del Orontes, donde Egipto combatió contra los hititas?"
  pt: "Onde ficava Cades, no Orontes, onde o Egito lutou contra os hititas?"
  de: "Wo lag Kadesch am Orontes, wo Ägypten gegen die Hethiter kämpfte?"
  fr: "Où se trouvait Qadesh sur l’Oronte, où l’Égypte combattit les Hittites ?"
  pl: "Gdzie leżał Kadesz nad Orontesem, gdzie Egipt walczył z Hetytami?"
  it: "Dov’era Kades sull’Oronte, dove l’Egitto combatté gli Ittiti?"
  cs: "Kde ležel Kádeš na Orontu, kde Egypt bojoval s Chetity?"
  nl: "Waar lag Kades aan de Orontes, waar Egypte tegen de Hettieten streed?"
  sv: "Var låg Kadesh vid Orontes, där Egypten stred mot hettiterna?"
  nb: "Hvor lå Kadesj ved Orontes, der Egypt kjempet mot hettittene?"
  tl: "Nasaan ang Cades sa Orontes, kung saan nakipaglaban ang Egipto sa mga Hetheo?"
  da: "Hvor lå Kadesj ved Orontes, hvor Egypten kæmpede mod hittitterne?"
  sr: "Где је био Кадис на Оронту, где се Египат борио с Хетитима?"
answer:
  en:
    - "Kadesh is Tell Nebi Mend, a large mound on the Orontes river in western Syria, south-west of Homs and just south of the lake of Homs; the map point stands on it. It lies about 332 km north of Jerusalem and 118 km north of Damascus in a straight line. It is a different place from Kadesh-barnea in the desert south of Judah, about 477 km away, where Israel camped in the wilderness, and from Kedesh in Galilee."
    - "Kadesh commanded the valley between the Lebanon and the Anti-Lebanon, the road from Egypt and Canaan to the north, and its kings stood at the crossroads of empires. A king of Kadesh led the coalition that Thutmose III of Egypt defeated at Megiddo about 1457 BC. About 1274 BC Ramesses II marched on Kadesh and was ambushed by the Hittite king Muwatalli II below its walls; Ramesses had the battle carved on his temples as a victory, but Kadesh stayed in Hittite hands, and some sixteen years later Ramesses and Hattusili III made the peace treaty whose text survives in both Egyptian and Hittite. In Hellenistic times the town was called Laodicea; it was excavated by Maurice Pézard in 1921–1922 and by a British team under Peter Parr from 1975."
    - "The Bible does not name this Kadesh for certain. In the route of David's census the Hebrew and the King James Version read “Then they came to Gilead, and to the land of Tahtim-hodshi”, a phrase no one has explained; some Greek manuscripts read “the land of the Hittites, Kadesh”, and many scholars and some modern translations emend the verse to “Kadesh in the land of the Hittites”, which is why the map shows Kadesh at this verse. Others think the census did not reach so far north. Riblah, where Pharaoh Necho put King Jehoahaz in bonds and Nebuchadnezzar later judged Zedekiah, lies only about 12 km south of Kadesh on the same river."
  ru:
    - "Кадеш — это Телль-Неби-Менд, большой холм на реке Оронт в западной Сирии, к юго-западу от Хомса, чуть южнее Хомского озера; точка карты стоит на нём. Отсюда около 332 км до Иерусалима на юг и 118 км до Дамаска по прямой. Это не Кадес (Кадес-Варни) в пустыне к югу от Иудеи, примерно в 477 км отсюда, где Израиль стоял станом в пустыне, и не Кедес в Галилее."
    - "Кадеш господствовал над долиной между Ливаном и Антиливаном — дорогой из Египта и Ханаана на север, — и его цари стояли на перекрёстке держав. Царь Кадеша возглавлял союз, который египетский фараон Тутмос III разбил при Мегиддоне около 1457 г. до н. э. Около 1274 г. до н. э. Рамсес II выступил на Кадеш и под его стенами попал в засаду хеттского царя Муваталли II; Рамсес велел высечь битву на стенах своих храмов как победу, но Кадеш остался за хеттами, а лет через шестнадцать Рамсес и Хаттусили III заключили мирный договор, текст которого сохранился и по-египетски, и по-хеттски. В эллинистическое время город называли Лаодикией; его раскапывали Морис Пезар в 1921–1922 гг. и британская экспедиция Питера Парра с 1975 года."
    - "Библия не называет этот Кадеш с уверенностью. В рассказе о переписи Давида еврейский текст и Синодальный перевод читают: «и пришли в Галаад и в землю Тахтим-Ходши» — выражение, которое никто не объяснил; некоторые греческие рукописи читают «землю хеттеев, Кадеш», и многие учёные и некоторые современные переводы исправляют стих на «Кадеш в земле хеттеев», поэтому карта и показывает Кадеш при этом стихе. Другие думают, что перепись так далеко на север не заходила. Ривла, где фараон Нехао заключил в оковы царя Иоахаза, а позже Навуходоносор судил Седекию, лежит всего примерно в 12 км к югу от Кадеша, на той же реке."
  uk:
    - "Кадеш — це Телль-Неби-Менд, великий пагорб на річці Оронт на заході Сирії, на південний захід від Хомса і трохи на південь від озера Хомс; точка на мапі стоїть на ньому. Він лежить приблизно за 332 км на північ від Єрусалима і за 118 км на північ від Дамаска по прямій. Це інше місце, ніж Кадес-Барнеа в пустелі на південь від Юдеї, приблизно за 477 км звідти, де Ізраїль отаборився в пустелі, і ніж Кедес у Галілеї."
    - "Кадеш панував над долиною між Ліваном і Антиліваном, дорогою з Єгипту й Ханаану на північ, і його царі стояли на перехресті імперій. Цар Кадеша очолював коаліцію, яку Тутмос III Єгипетський розбив при Мегіддо близько 1457 р. до н. е. Близько 1274 р. до н. е. Рамсес II рушив на Кадеш і потрапив у засідку хетського царя Муватталі II під його мурами; Рамсес наказав вирізьбити битву на своїх храмах як перемогу, але Кадеш залишився в руках хеттів, і приблизно через шістнадцять років Рамсес і Хаттусілі III уклали мирний договір, текст якого зберігся і єгипетською, і хетською. В елліністичні часи місто називалося Лаодікея; його розкопували Моріс Пезар 1921–1922 рр. і британська команда під керівництвом Пітера Парра від 1975 р."
    - "Біблія не називає цей Кадеш напевно. У маршруті Давидового перепису єврейський текст і Біблія короля Якова читають: «Тодї прибули в Галаад та й пройшли до землї Тахтим-Годші», і цього виразу ніхто не пояснив; деякі грецькі рукописи читають «земля хеттів, Кадеш», і багато вчених та деякі сучасні переклади виправляють вірш на «Кадеш у землі хеттів», через що мапа й показує Кадеш при цьому вірші. Інші вважають, що перепис не сягав так далеко на північ. Рівла, де фараон Нехо закував царя Йоахаза в кайдани, а Навуходоносор пізніше судив Седекію, лежить лише приблизно за 12 км на південь від Кадеша на тій самій річці."
  es:
    - "Cades es Tell Nebi Mend, un gran montículo junto al río Orontes, en el oeste de Siria, al suroeste de Homs y justo al sur del lago de Homs; el punto del mapa está sobre él. Queda a unos 332 km al norte de Jerusalén y a 118 km al norte de Damasco en línea recta. Es un lugar distinto de Cades-barnea, en el desierto al sur de Judá, a unos 477 km, donde acampó Israel en el desierto, y de Cedes, en Galilea."
    - "Cades dominaba el valle entre el Líbano y el Antilíbano, el camino de Egipto y Canaán hacia el norte, y sus reyes se hallaban en la encrucijada de los imperios. Un rey de Cades encabezó la coalición que Tutmosis III de Egipto derrotó en Meguido hacia 1457 a. C. Hacia 1274 a. C. Ramsés II marchó sobre Cades y cayó en una emboscada del rey hitita Muwatalli II al pie de sus murallas; Ramsés hizo esculpir la batalla en sus templos como una victoria, pero Cades siguió en manos hititas, y unos dieciséis años después Ramsés y Hattusili III firmaron el tratado de paz cuyo texto se conserva en egipcio y en hitita. En época helenística la ciudad se llamó Laodicea; fue excavada por Maurice Pézard en 1921–1922 y por un equipo británico bajo Peter Parr desde 1975."
    - "La Biblia no nombra con certeza esta Cades. En la ruta del censo de David, el hebreo y la versión King James leen que llegaron a Galaad y a la tierra de Tahtim-hodshi, expresión que nadie ha explicado; algunos manuscritos griegos leen «la tierra de los hititas, Cades», y muchos estudiosos y algunas traducciones modernas enmiendan el versículo en «Cades en la tierra de los hititas», por lo cual el mapa muestra Cades en este versículo. Otros piensan que el censo no llegó tan al norte. Ribla, donde el faraón Necao puso preso al rey Joacaz y donde Nabucodonosor juzgó más tarde a Sedequías, queda a solo unos 12 km al sur de Cades, en el mismo río."
  pt:
    - "Cades é Tell Nebi Mend, um grande monte no rio Orontes, no oeste da Síria, a sudoeste de Homs e logo ao sul do lago de Homs; o ponto do mapa fica sobre ele. Fica a cerca de 332 km ao norte de Jerusalém e 118 km ao norte de Damasco em linha reta. É um lugar diferente de Cades-Barneia, no deserto ao sul de Judá, a cerca de 477 km de distância, onde Israel acampou no deserto, e de Quedes, na Galileia."
    - "Cades dominava o vale entre o Líbano e o Antilíbano, a estrada do Egito e de Canaã para o norte, e seus reis estavam na encruzilhada dos impérios. Um rei de Cades liderou a coalizão que Tutmés III do Egito derrotou em Megido por volta de 1457 a.C. Por volta de 1274 a.C., Ramsés II marchou sobre Cades e foi emboscado pelo rei hitita Muwatali II sob as suas muralhas; Ramsés mandou gravar a batalha em seus templos como uma vitória, mas Cades permaneceu em mãos hititas, e cerca de dezesseis anos depois Ramsés e Hattusil III fizeram o tratado de paz cujo texto sobrevive em egípcio e em hitita. Na época helenística a cidade se chamou Laodiceia; foi escavada por Maurice Pézard em 1921–1922 e por uma equipe britânica sob Peter Parr a partir de 1975."
    - "A Bíblia não nomeia com certeza esta Cades. No itinerário do recenseamento de Davi, o hebraico e a versão King James leem “então chegaram a Gileade e à terra de Tatim-Hodsi”, expressão que ninguém explicou; alguns manuscritos gregos leem “a terra dos hititas, Cades”, e muitos estudiosos e algumas traduções modernas emendam o versículo para “Cades, na terra dos hititas”, razão pela qual o mapa mostra Cades neste versículo. Outros pensam que o recenseamento não chegou tão ao norte. Ribla, onde o faraó Neco pôs em correntes o rei Jeoacaz e onde Nabucodonosor mais tarde julgou Zedequias, fica a apenas cerca de 12 km ao sul de Cades, no mesmo rio."
  de:
    - "Kadesch ist Tell Nebi Mend, ein großer Hügel am Orontes im Westen Syriens, südwestlich von Homs und knapp südlich des Sees von Homs; der Kartenpunkt steht darauf. Es liegt in der Luftlinie etwa 332 km nördlich von Jerusalem und 118 km nördlich von Damaskus. Es ist ein anderer Ort als Kadesch-Barnea in der Wüste südlich von Juda, rund 477 km entfernt, wo Israel in der Wüste lagerte, und als Kedesch in Galiläa."
    - "Kadesch beherrschte das Tal zwischen Libanon und Antilibanon, die Straße von Ägypten und Kanaan nach Norden, und seine Könige standen an der Kreuzung der Großreiche. Ein König von Kadesch führte die Koalition an, die Thutmosis III. von Ägypten um 1457 v. Chr. bei Megiddo besiegte. Um 1274 v. Chr. zog Ramses II. gegen Kadesch und geriet unter seinen Mauern in einen Hinterhalt des hethitischen Königs Muwatalli II.; Ramses ließ die Schlacht als Sieg an seine Tempel meißeln, doch Kadesch blieb in hethitischer Hand, und etwa sechzehn Jahre später schlossen Ramses und Hattusili III. den Friedensvertrag, dessen Text auf Ägyptisch und Hethitisch erhalten ist. In hellenistischer Zeit hieß die Stadt Laodizea; ausgegraben wurde sie 1921–1922 von Maurice Pézard und ab 1975 von einem britischen Team unter Peter Parr."
    - "Die Bibel nennt dieses Kadesch nicht mit Sicherheit. Auf der Route der Volkszählung Davids lesen der hebräische Text und die Lutherbibel: „und kamen gen Gilead und ins Niederland Hodsi“, eine Wendung, die niemand erklärt hat; einige griechische Handschriften lesen „das Land der Hethiter, Kadesch“, und viele Gelehrte und einige moderne Übersetzungen ändern den Vers in „Kadesch im Land der Hethiter“, weshalb die Karte Kadesch an dieser Stelle zeigt. Andere meinen, die Zählung sei nicht so weit nach Norden gelangt. Ribla, wo Pharao Necho König Joahas in Fesseln legte und Nebukadnezar später Zedekia richtete, liegt nur etwa 12 km südlich von Kadesch am selben Fluss."
  fr:
    - "Qadesh est Tell Nebi Mend, grand tertre sur l’Oronte, dans l’ouest de la Syrie, au sud-ouest de Homs et juste au sud du lac de Homs ; le point de la carte s’y trouve. Elle est à environ 332 km au nord de Jérusalem et à 118 km au nord de Damas à vol d’oiseau. C’est un lieu différent de Kadès-Barnéa, dans le désert au sud de Juda, à environ 477 km de là, où Israël campa au désert, et de Kédesch en Galilée."
    - "Qadesh dominait la vallée entre le Liban et l’Anti-Liban, la route qui menait de l’Égypte et de Canaan vers le nord, et ses rois se tenaient au carrefour des empires. Un roi de Qadesh conduisit la coalition que Thoutmosis III d’Égypte vainquit à Meguiddo vers 1457 av. J.-C. Vers 1274 av. J.-C., Ramsès II marcha sur Qadesh et tomba dans une embuscade tendue par le roi hittite Mouwatalli II sous ses murs ; Ramsès fit graver la bataille sur ses temples comme une victoire, mais Qadesh resta aux mains des Hittites, et environ seize ans plus tard Ramsès et Hattousili III conclurent le traité de paix dont le texte subsiste en égyptien et en hittite. À l’époque hellénistique, la ville s’appelait Laodicée ; elle fut fouillée par Maurice Pézard en 1921-1922, puis par une équipe britannique dirigée par Peter Parr à partir de 1975."
    - "La Bible ne nomme pas ce Qadesh avec certitude. Dans l’itinéraire du recensement de David, l’hébreu et la Bible Louis Segond lisent : « Ils allèrent en Galaad et dans le pays de Thachthim-Hodschi », expression que personne n’a expliquée ; certains manuscrits grecs lisent le pays des Héthiens, Qadesh, et de nombreux spécialistes et certaines traductions modernes corrigent le verset en Qadesh dans le pays des Héthiens, ce qui explique que la carte montre Qadesh à ce verset. D’autres pensent que le recensement n’alla pas si loin vers le nord. Ribla, où le pharaon Néco enchaîna le roi Joachaz et où Nebucadnetsar jugea plus tard Sédécias, n’est qu’à environ 12 km au sud de Qadesh, sur le même fleuve."
  pl:
    - "Kadesz to Tell Nebi Mend, duże wzgórze nad rzeką Orontes w zachodniej Syrii, na południowy zachód od Hims i tuż na południe od jeziora Hims; stoi na nim punkt na mapie. Leży około 332 km na północ od Jerozolimy i 118 km na północ od Damaszku w linii prostej. To inne miejsce niż Kadesz-Barnea na pustyni na południe od Judy, oddalone o około 477 km, gdzie Izrael obozował na pustyni, oraz niż Kedesz w Galilei."
    - "Kadesz panował nad doliną między Libanem a Antylibanem, drogą z Egiptu i Kanaanu na północ, a jego królowie stali na rozdrożu imperiów. Król Kadesz dowodził koalicją, którą Totmes III z Egiptu pokonał pod Megiddo około 1457 p.n.e. Około 1274 p.n.e. Ramzes II ruszył na Kadesz i wpadł w zasadzkę zastawioną przez króla hetyckiego Muwatallego II pod jego murami; Ramzes kazał wykuć tę bitwę na swoich świątyniach jako zwycięstwo, ale Kadesz pozostało w rękach hetyckich, a około szesnaście lat później Ramzes i Hattusili III zawarli traktat pokojowy, którego tekst zachował się po egipsku i po hetycku. W czasach hellenistycznych miasto zwano Laodyceą; wykopywał je Maurice Pézard w latach 1921–1922, a od 1975 zespół brytyjski pod kierunkiem Petera Parra."
    - "Biblia nie wymienia tego Kadesz z pewnością. W trasie spisu ludności Dawida tekst hebrajski i Biblia króla Jakuba (King James Version) mają: przyszli do Gileadu i do ziemi Tahtim-hodshi, co jest wyrażeniem, którego nikt nie wyjaśnił; niektóre rękopisy greckie czytają ziemia Hetytów, Kadesz, a wielu uczonych i niektóre współczesne przekłady poprawia werset na Kadesz w ziemi Hetytów, dlatego mapa pokazuje Kadesz przy tym wersecie. Inni sądzą, że spis nie sięgał tak daleko na północ. Ribla, gdzie faraon Neko zakuł w kajdany króla Joachaza, a Nabuchodonozor osądził później Sedekiasza, leży zaledwie około 12 km na południe od Kadesz nad tą samą rzeką."
  it:
    - "Kades è Tell Nebi Mend, un grande tell sul fiume Oronte nella Siria occidentale, a sud-ovest di Homs e subito a sud del lago di Homs; il punto della mappa si trova su di esso. Dista circa 332 km a nord di Gerusalemme e 118 km a nord di Damasco in linea d’aria. È un luogo diverso da Kades-Barnea, nel deserto a sud di Giuda, a circa 477 km di distanza, dove Israele si accampò nel deserto, e da Kedes in Galilea."
    - "Kades dominava la valle tra il Libano e l’Antilibano, la via dall’Egitto e da Canaan verso nord, e i suoi re stavano all’incrocio degli imperi. Un re di Kades guidò la coalizione che Tutmosi III d’Egitto sconfisse a Meghiddo verso il 1457 a.C. Verso il 1274 a.C. Ramses II marciò su Kades e cadde in un’imboscata tesa dal re ittita Muwatalli II sotto le sue mura; Ramses fece scolpire la battaglia sui suoi templi come una vittoria, ma Kades rimase in mano ittita, e circa sedici anni dopo Ramses e Hattusili III conclusero il trattato di pace il cui testo sopravvive sia in egiziano sia in ittita. In età ellenistica la città si chiamava Laodicea; fu scavata da Maurice Pézard nel 1921–1922 e da una squadra britannica guidata da Peter Parr dal 1975."
    - "La Bibbia non nomina con certezza questa Kades. Nel percorso del censimento di Davide l’ebraico e la King James Version leggono «Poi andarono in Galaad e nel paese di Tahtim-Hodshi», una frase che nessuno ha spiegato; alcuni manoscritti greci leggono «il paese degli Ittiti, Kades», e molti studiosi e alcune traduzioni moderne correggono il versetto in «Kades nel paese degli Ittiti», ed è per questo che la mappa mostra Kades in corrispondenza di questo versetto. Altri pensano che il censimento non arrivasse così a nord. Ribla, dove il faraone Neco mise in catene il re Ioacaz e dove Nabucodonosor giudicò poi Sedecia, si trova solo a circa 12 km a sud di Kades, sullo stesso fiume."
  cs:
    - "Kádeš je Tell Nebi Mend, rozlehlý pahorek na řece Orontu v západní Sýrii, jihozápadně od Homsu a těsně jižně od homsského jezera; stojí na něm bod na mapě. Leží vzdušnou čarou asi 332 km severně od Jeruzaléma a 118 km severně od Damašku. Je to jiné místo než Kádeš-barnea na poušti jižně od Judska, vzdálená asi 477 km, kde Izrael tábořil na poušti, a než Kedeš v Galileji."
    - "Kádeš ovládal údolí mezi Libanonem a Antilibanonem, cestu z Egypta a Kanaánu na sever, a jeho králové stáli na křižovatce říší. Král Kádeše vedl koalici, kterou egyptský Thutmose III. porazil u Megida kolem roku 1457 př. n. l. Kolem roku 1274 př. n. l. táhl Ramesse II. na Kádeš a pod jeho hradbami ho přepadl chetitský král Muwatalli II.; Ramesse nechal bitvu vytesat na své chrámy jako vítězství, ale Kádeš zůstal v rukou Chetitů a asi o šestnáct let později uzavřeli Ramesse a Chattušili III. mírovou smlouvu, jejíž text se dochoval v egyptské i chetitské verzi. V helénistické době se město jmenovalo Laodikeia; vykopával je Maurice Pézard v letech 1921–1922 a britský tým pod vedením Petera Parra od roku 1975."
    - "Bible tento Kádeš jistě nejmenuje. V trase Davidova sčítání lidu čtou hebrejský text a anglická Bible krále Jakuba přišli do Gileadu a do země Tachtim-chodší, což je spojení, které nikdo nevysvětlil; některé řecké rukopisy čtou „země Chetitů, Kádeš“ a mnozí badatelé a některé moderní překlady verš opravují na „Kádeš v zemi Chetitů“, a proto mapa Kádeš u tohoto verše ukazuje. Jiní se domnívají, že sčítání tak daleko na sever nedosáhlo. Ribla, kde faraon Néko spoutal krále Joachaze a kde později Nebukadnesar soudil Sidkijáše, leží jen asi 12 km jižně od Kádeše na téže řece."
  nl:
    - "Kades is Tell Nebi Mend, een grote heuvel aan de rivier de Orontes in het westen van Syrië, ten zuidwesten van Homs en net ten zuiden van het meer van Homs; het punt op de kaart staat erop. Het ligt hemelsbreed ongeveer 332 km ten noorden van Jeruzalem en 118 km ten noorden van Damascus. Het is een andere plaats dan Kades-Barnea in de woestijn ten zuiden van Juda, ongeveer 477 km verderop, waar Israël in de woestijn kampeerde, en dan Kedes in Galilea."
    - "Kades beheerste het dal tussen de Libanon en de Antilibanon, de weg van Egypte en Kanaän naar het noorden, en zijn koningen stonden op het kruispunt van rijken. Een koning van Kades leidde de coalitie die Thoetmosis III van Egypte rond 1457 v.Chr. bij Megiddo versloeg. Rond 1274 v.Chr. trok Ramses II op tegen Kades en werd onder de muren door de Hettitische koning Muwatalli II in een hinderlaag gelokt; Ramses liet de slag als overwinning in zijn tempels uithouwen, maar Kades bleef in Hettitische handen, en ongeveer zestien jaar later sloten Ramses en Hattusili III het vredesverdrag waarvan de tekst bewaard is gebleven in zowel het Egyptisch als het Hettitisch. In de hellenistische tijd heette de stad Laodicea; zij werd opgegraven door Maurice Pézard in 1921–1922 en door een Brits team onder Peter Parr vanaf 1975."
    - "De Bijbel noemt dit Kades niet met zekerheid. In de route van Davids volkstelling leest de Hebreeuwse tekst, evenals de King James Version, dat zij kwamen in Gilead en in het land Tachtim-Chodsji, een uitdrukking die niemand heeft verklaard; sommige Griekse handschriften lezen het land van de Hettieten, Kades, en veel geleerden en enkele moderne vertalingen verbeteren het vers tot Kades in het land van de Hettieten, en daarom toont de kaart Kades bij dit vers. Anderen denken dat de volkstelling niet zo ver naar het noorden reikte. Ribla, waar Farao Necho koning Joachaz in boeien sloeg en Nebukadnessar later Zedekia veroordeelde, ligt slechts ongeveer 12 km ten zuiden van Kades aan dezelfde rivier."
  sv:
    - "Kadesh är Tell Nebi Mend, en stor kulle vid floden Orontes i västra Syrien, sydväst om Homs och strax söder om sjön vid Homs; kartpunkten står på den. Den ligger omkring 332 km norr om Jerusalem och 118 km norr om Damaskus i fågelvägen. Den är en annan plats än Kadesh-Barnea i öknen söder om Juda, omkring 477 km bort, där Israel slog läger i öknen, och än Kedesh i Galileen."
    - "Kadesh behärskade dalen mellan Libanon och Antilibanon, vägen från Egypten och Kanaan norrut, och dess kungar stod vid imperiernas korsväg. En kung av Kadesh ledde koalitionen som Thutmosis III av Egypten besegrade vid Megiddo omkring 1457 f.Kr. Omkring 1274 f.Kr. marscherade Ramses II mot Kadesh och föll i bakhåll av den hettitiske kungen Muwatalli II under dess murar; Ramses lät rista slaget på sina tempel som en seger, men Kadesh förblev i hettitisk hand, och omkring sexton år senare slöt Ramses och Hattusili III det fredsavtal vars text finns bevarad på både egyptiska och hettitiska. Under hellenistisk tid kallades staden Laodikeia; den grävdes ut av Maurice Pézard 1921–1922 och av ett brittiskt team under Peter Parr från 1975."
    - "Bibeln nämner inte detta Kadesh med säkerhet. I färdvägen för Davids folkräkning lyder den hebreiska texten och King James-översättningen: ”Därifrån kommo de till Gilead och Tatim-Hodsis land”, en fras som ingen har förklarat; några grekiska handskrifter har ”hettiternas land, Kadesh”, och många forskare och några moderna översättningar ändrar versen till ”Kadesh i hettiternas land”, vilket är anledningen till att kartan visar Kadesh vid denna vers. Andra menar att folkräkningen inte nådde så långt norrut. Rivla, där farao Neko satte kung Joachas i fängelse och Nebukadnessar senare dömde Sidkia, ligger bara omkring 12 km söder om Kadesh vid samma flod."
  nb:
    - "Kadesj er Tell Nebi Mend, en stor haug ved elven Orontes i det vestlige Syria, sørvest for Homs og like sør for Homs-sjøen; kartpunktet står på den. Den ligger omtrent 332 km nord for Jerusalem og 118 km nord for Damaskus i luftlinje. Det er et annet sted enn Kadesj-Barnea i ørkenen sør for Juda, omtrent 477 km unna, der Israel slo leir i ørkenen, og enn Kedesj i Galilea."
    - "Kadesj behersket dalen mellom Libanon og Anti-Libanon, veien fra Egypt og Kanaan mot nord, og dens konger sto i korsveien mellom stormaktene. En konge av Kadesj ledet koalisjonen som Tutmosis III av Egypt beseiret ved Megiddo omkring 1457 f.Kr. Omkring 1274 f.Kr. marsjerte Ramses II mot Kadesj og ble overfalt av hettittkongen Muwatalli II under murene; Ramses lot slaget hugge inn på sine templer som en seier, men Kadesj forble på hettittenes hender, og omtrent seksten år senere inngikk Ramses og Hattusili III fredstraktaten hvis tekst er bevart både på egyptisk og hettittisk. I hellenistisk tid ble byen kalt Laodikea; den ble gravd ut av Maurice Pézard i 1921–1922 og av et britisk lag under Peter Parr fra 1975."
    - "Bibelen nevner ikke dette Kadesj med sikkerhet. I ruten for Davids folketelling lyder den hebraiske teksten og King James Version «Then they came to Gilead, and to the land of Tahtim-hodshi», en frase ingen har forklart; noen greske håndskrifter har lesemåten hettittenes land, Kadesj, og mange forskere og noen moderne oversettelser endrer verset til Kadesj i hettittenes land, og det er grunnen til at kartet viser Kadesj ved dette verset. Andre mener at folketellingen ikke nådde så langt nord. Ribla, der Farao Neko la kong Joahas i lenker og Nebukadnesar senere avsa dom over Sidkia, ligger bare omtrent 12 km sør for Kadesj ved samme elv."
  tl:
    - "Ang Cades ay ang Tell Nebi Mend, isang malaking burol sa ilog Orontes sa kanlurang Siria, sa timog-kanluran ng Homs at sa timog lamang ng lawa ng Homs; nakatayo roon ang punto sa mapa. Mga 332 km ito sa hilaga ng Jerusalem at 118 km sa hilaga ng Damasco sa tuwid na guhit. Ibang lugar ito mula sa Cades-barnea sa disyerto sa timog ng Juda, mga 477 km ang layo, kung saan nagkampo ang Israel sa ilang, at mula sa Cedes sa Galilea."
    - "Pinamunuan ng Cades ang lambak sa pagitan ng Libano at Anti-Libano, ang daan mula sa Egipto at Canaan patungong hilaga, at nasa sangandaan ng mga imperyo ang mga hari nito. Pinamunuan ng isang hari ng Cades ang koalisyon na tinalo ni Thutmose III ng Egipto sa Megiddo noong mga 1457 BK. Noong mga 1274 BK ay sumulong si Ramesses II laban sa Cades at tinambangan ng haring Hetheo na si Muwatalli II sa ibaba ng mga pader nito; ipinaukit ni Ramesses ang labanan sa kaniyang mga templo bilang tagumpay, ngunit nanatili ang Cades sa mga Hetheo, at mga labing-anim na taon pagkaraan ay nilagdaan nina Ramesses at Hattusili III ang kasunduang pangkapayapaan na ang teksto ay nananatili sa Egipcio at sa Hetheo. Noong panahong Helenistiko, tinawag ang bayan na Laodicea; hinukay ito ni Maurice Pézard noong 1921–1922 at ng isang pangkat Britaniko sa ilalim ni Peter Parr mula 1975."
    - "Hindi tiyak na pinangalanan ng Biblia ang Cades na ito. Sa ruta ng sensus ni David, binabasa ng Hebreo at ng King James Version ang “Saka sila nagsiparoon sa Galaad, at sa lupain ng Tatimhodsi”, isang pariralang walang nakapagpaliwanag; binabasa ng ilang manuskritong Griyego ang “lupain ng mga Hetheo, Cades”, at maraming iskolar at ilang makabagong salin ang nag-aayos ng talata bilang “Cades sa lupain ng mga Hetheo”, kaya ipinapakita ng mapa ang Cades sa talatang ito. Iniisip ng iba na hindi umabot nang ganoon kalayo sa hilaga ang sensus. Ang Ribla, kung saan iginapos ni Faraon Necho si Haring Joachaz at kung saan nang maglaon ay hinatulan ni Nabucodonosor si Sedecias, ay mga 12 km lamang sa timog ng Cades sa iisang ilog."
  da:
    - "Kadesj er Tell Nebi Mend, en stor tell ved floden Orontes i det vestlige Syrien, sydvest for Homs og lige syd for Homs-søen; kortets punkt står på den. Den ligger ca. 332 km nord for Jerusalem og 118 km nord for Damaskus i fugleflugt. Det er et andet sted end Kadesj-Barnea i ørkenen syd for Juda, ca. 477 km væk, hvor Israel lejrede sig i ørkenen, og end Kedesj i Galilæa."
    - "Kadesj behersker dalen mellem Libanon og Anti-Libanon, vejen fra Egypten og Kana’an mod nord, og dens konger stod ved imperiernes korsvej. En konge af Kadesj ledede den koalition, som Thutmosis 3. af Egypten besejrede ved Megiddo omkring 1457 f.Kr. Omkring 1274 f.Kr. rykkede Ramses 2. mod Kadesj og blev overfaldet af den hittitiske konge Muwatalli 2. neden for dens mure; Ramses lod slaget indhugge på sine templer som en sejr, men Kadesj forblev på hittitternes hænder, og omkring seksten år senere indgik Ramses og Hattusili 3. den fredstraktat, hvis tekst er bevaret både på egyptisk og hittitisk. I hellenistisk tid hed byen Laodikea; den blev udgravet af Maurice Pézard i 1921-1922 og af et britisk hold under Peter Parr fra 1975."
    - "Bibelen nævner ikke dette Kadesj med sikkerhed. I ruten for Davids folketælling læser den hebraiske tekst og King James-oversættelsen, at de kom til Gilead og til landet Tahtim-Hodsji, et udtryk ingen har kunnet forklare; nogle græske håndskrifter læser »hittitternes land, Kadesj«, og mange forskere og nogle moderne oversættelser retter verset til »Kadesj i hittitternes land«, hvilket er grunden til, at kortet viser Kadesj ved dette vers. Andre mener, at folketællingen ikke nåede så langt mod nord. Ribla, hvor farao Neko lagde kong Joakaz i lænker, og hvor Nebukadnezar senere holdt ret over Zedekias, ligger kun ca. 12 km syd for Kadesj ved den samme flod."
  sr:
    - "Кадис је Тел Неби Менд, велика хумка на реци Оронт у западној Сирији, југозападно од Хомса и одмах јужно од језера Хомс; тачка на карти стоји на њој. Лежи око 332 км северно од Јерусалима и 118 км северно од Дамаска ваздушном линијом. То је друго место од Кадис-Варније у пустињи јужно од Јуде, удаљене око 477 км, где је Израел логоровао у пустињи, и од Кедеса у Галилеји."
    - "Кадис је господарио долином између Ливана и Антиливана, путем од Египта и Ханана ка северу, а његови краљеви стајали су на раскршћу царстава. Један краљ Кадиса предводио је коалицију коју је Тутмес III од Египта победио код Мегида око 1457. п. н. е. Око 1274. п. н. е. Рамзес II кренуо је на Кадис и био је заседом нападнут од хетитског краља Муваталија II испод његових зидина; Рамзес је дао да се битка уклеше на његовим храмовима као победа, али је Кадис остао у хетитским рукама, а неких шеснаест година касније Рамзес и Хатушили III склопили су мировни уговор чији текст је сачуван и на египатском и на хетитском. У хеленистичко доба град се звао Лаодикија; ископао га је Морис Пезар 1921–1922, а британски тим под Питером Паром од 1975."
    - "Библија овај Кадис не именује са сигурношћу. У ходу Давидовог пописа хебрејски текст и Верзија краља Јакова читају да су дошли у Галад и у земљу Тахтим-Ходши, израз који нико није објаснио; неки грчки рукописи читају земља Хетита, Кадис, а многи научници и неки савремени преводи исправљају стих у Кадис у земљи Хетита, због чега карта приказује Кадис на овом стиху. Други мисле да попис није допро тако далеко на север. Ривла, где је фараон Нехао ставио краља Јоахаза у окове и где је Навуходоносор касније судио Седекији, лежи само око 12 км јужно од Кадиса на истој реци."
