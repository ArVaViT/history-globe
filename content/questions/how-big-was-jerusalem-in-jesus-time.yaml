id: how-big-was-jerusalem-in-jesus-time
question:
  en: "How big was Jerusalem in the time of Jesus?"
  ru: "Насколько велик был Иерусалим во времена Иисуса?"
  uk: "Якого розміру був Єрусалим за часів Ісуса?"
  es: "¿Qué tamaño tenía Jerusalén en tiempos de Jesús?"
  pt: "Qual era o tamanho de Jerusalém no tempo de Jesus?"
  de: "Wie groß war Jerusalem zur Zeit Jesu?"
  fr: "Quelle était la taille de Jérusalem au temps de Jésus ?"
  pl: "Jak duża była Jerozolima za czasów Jezusa?"
  it: "Quanto era grande Gerusalemme ai tempi di Gesù?"
  nl: "Hoe groot was Jeruzalem in de tijd van Jezus?"
  cs: "Jak velký byl Jeruzalém za Ježíšovy doby?"
  sv: "Hur stort var Jerusalem på Jesu tid?"
  nb: "Hvor stor var Jerusalem på Jesu tid?"
  tl: "Gaano kalaki ang Jerusalem noong panahon ni Jesus?"
  da: "Hvor stor var Jerusalem på Jesu tid?"
  sr: "Колики је био Јерусалим у Исусово доба?"
  hu: "Mekkora volt Jeruzsálem Jézus korában?"
  fi: "Kuinka suuri Jerusalem oli Jeesuksen aikaan?"
  vi: "Giê-ru-sa-lem thời Giê-su rộng bao nhiêu?"
  ro: "Cât de mare era Ierusalimul pe vremea lui Isus?"
  bg: "Колко голям е бил Йерусалим по времето на Исус?"
answer:
  en:
    - "A walled city of roughly 85 ha, by the map's reconstruction of the First and Second Walls, about the size of today's Old City within its Ottoman walls (86 ha): the Temple Mount with Herod's platform of some 14 ha, the Upper City on the western hill with Herod's palace and its three towers, the Lower City on the ridge of the City of David down to the pool of Siloam, and the Antonia fortress at the Temple's corner. Houses had spread north of the Second Wall into the suburb of Bezetha, which Herod Agrippa I began to enclose with the Third Wall in AD 41–44; with it the city grew to about 180 ha. Estimates of the people in Jesus' day run from 25,000–30,000 (Jeremias) to about 40,000 (Broshi); for the larger city before 70, Broshi reckoned about 80,000 and Levine 60,000–70,000; the feasts swelled it several times over."
    - "The Gospels show the city from outside and within. Coming down the Mount of Olives, “when he was come near, he beheld the city, and wept over it”; “when he was come into Jerusalem, all the city was moved, saying, Who is this?” The disciples admired the Temple, “how it was adorned with goodly stones and gifts”. Pilgrims filled it: “his parents went to Jerusalem every year at the feast of the passover”, and at Pentecost “there were dwelling at Jerusalem Jews, devout men, out of every nation under heaven”. Josephus, who knew the city before AD 70, describes its three walls, the two hills and the valley between them, and gives the whole circuit at thirty-three stadia, about 6 km; his figures of millions at Passover are not taken literally."
    - "The First Wall ran from Herod's towers east to the Temple and round the western hill above the Hinnom valley to Siloam; the Second Wall, whose course is the least known, enclosed the markets between the Gennath gate and the Antonia, leaving the quarry where Golgotha is placed outside; the Third Wall, finished only in the revolt of 66, took in the north. The city's water came from the Gihon through Hezekiah's tunnel, from cisterns and from aqueducts out of the hills to the south. The map draws the walls of Jesus' day from Josephus and the excavations, placing the uncertain stretches itself, and shows the Ottoman walls and the City of David of about 1000 BC for comparison."
  ru:
    - "Обнесённый стеной город примерно в 85 га, по реконструкции Первой и Второй стен на карте, — величиной с нынешний Старый город в османских стенах (86 га): Храмовая гора с Иродовой платформой около 14 га, Верхний город на западном холме с дворцом Ирода и его тремя башнями, Нижний город на гребне Города Давидова вниз до купальни Силоам и крепость Антония у угла Храма. К северу от Второй стены дома разрослись в предместье Безета, которое Ирод Агриппа I в 41–44 годах начал обносить Третьей стеной; с ней город вырос примерно до 180 га. Число жителей при Иисусе оценивают от 25–30 тысяч (Иеремиас) до примерно 40 тысяч (Броши); для большего города перед 70 годом Броши насчитывал около 80 тысяч, Левин — 60–70 тысяч; в праздники людей становилось в несколько раз больше."
    - "Евангелия показывают город снаружи и изнутри. Спускаясь с горы Елеонской, Иисус, «когда приблизился к городу, то, смотря на него, заплакал о нем»; «когда вошел Он в Иерусалим, весь город пришел в движение и говорил: кто Сей?» Ученики восхищались храмом, «что он украшен дорогими камнями и вкладами». Город наполняли паломники: «Каждый год родители Его ходили в Иерусалим на праздник Пасхи», а в Пятидесятницу: «В Иерусалиме же находились Иудеи, люди набожные, из всякого народа под небом». Иосиф Флавий, знавший город до 70 года, описывает три его стены, два холма и долину между ними и даёт весь обвод в тридцать три стадия, около 6 км; его миллионы на Пасху буквально не принимают."
    - "Первая стена шла от башен Ирода на восток к Храму и вокруг западного холма над долиной Еннома к Силоаму; Вторая, чей ход известен хуже всего, охватывала рынки между воротами Геннат и Антонией, оставляя снаружи каменоломню, где помещают Голгофу; Третья, достроенная лишь в восстание 66 года, взяла север. Воду город брал из Гихона по туннелю Езекии, из цистерн и по акведукам с холмов на юге. Карта чертит стены времён Иисуса по Иосифу Флавию и раскопкам, неясные участки проводя сама, и для сравнения показывает османские стены и Город Давидов около 1000 г. до н. э."
  uk:
    - "Місто, обнесене мурами, площею приблизно 85 га — за реконструкцією мапи Першого й Другого мурів, — приблизно як сучасне Старе місто в межах його османських мурів (86 га): Храмова гора з Іродовою платформою близько 14 га, Верхнє місто на західному пагорбі з Іродовим палацом і його трьома баштами, Нижнє місто на гребені Міста Давида аж до сілоамського басейну та фортеця Антонія на розі Храму. Забудова поширилася на північ від Другого муру в передмістя Безети, яке Ірод Агриппа I почав обводити Третім муром у 41–44 рр. н. е.; з ним місто зросло приблизно до 180 га. Оцінки кількості людей за днів Ісуса сягають від 25 000–30 000 (Єреміас) до близько 40 000 (Броші); для більшого міста до 70 р. Броші обчислював близько 80 000, а Левін — 60 000–70 000; на свята населення зростало в кілька разів."
    - "Євангелії показують місто ззовні й зсередини. Сходячи з Оливкової гори, «як наближивсь, то, побачивши город, заплакав над ним»; «як увійшов Він у Єрусалим, здвигнувсь увесь город, говорячи: Хто се такий?» Учні милувалися Храмом, «що каміннєм красним та посьвятами украшена». Прочани наповнювали його: «ходили батько-мати Його щороку в Єрусалим у сьвято пасхи», а на П'ятдесятницю «домували ж у Єрусалимі Жиди, люде побожні, з усякого народу під небом». Йосиф Флавій, який знав місто до 70 р. н. е., описує його три мури, два пагорби й долину між ними та визначає весь обхід у тридцять три стадії, близько 6 км; його цифри в мільйони на Пасху не слід сприймати буквально."
    - "Перший мур ішов від Іродових башт на схід до Храму й навколо західного пагорба над долиною Гінном до Сілоаму; Другий мур, перебіг якого найменш відомий, охоплював ринки між брамою Геннат та Антонією, лишаючи поза собою каменярню, де розміщують Голгофу; Третій мур, закінчений лише під час повстання 66 р., узяв у межі північ. Воду місту давав Гіхон через тунель Єзекії, цистерни й акведуки з пагорбів на півдні. Мапа викреслює мури часів Ісуса за Йосифом Флавієм і розкопками, самотужки розміщуючи непевні відтинки, і для порівняння показує османські мури та Місто Давида близько 1000 р. до н. е."
  es:
    - "Una ciudad amurallada de unas 85 ha, según la reconstrucción del mapa de la Primera y la Segunda Muralla, aproximadamente como la Ciudad Vieja actual de murallas otomanas (86 ha): el monte del Templo, con la plataforma herodiana de unas 14 ha; la Ciudad Alta, en la colina occidental, con el palacio de Herodes y sus tres torres; la Ciudad Baja, en la loma de la Ciudad de David hasta el estanque de Siloé; y la fortaleza Antonia, en la esquina del Templo. Las casas se extendían al norte de la Segunda Muralla, en el suburbio de Bezetá, que Herodes Agripa I empezó a cercar con la Tercera Muralla en 41–44 d. C.; con ella creció a unas 180 ha. Su población en tiempos de Jesús se estima de 25 000–30 000 (Jeremias) a unos 40 000 (Broshi); para la ciudad mayor anterior al 70, Broshi calculó unos 80 000 y Levine 60 000–70 000; las fiestas la multiplicaban varias veces."
    - "Los Evangelios muestran la ciudad desde fuera y desde dentro. Al bajar del monte de los Olivos, «como llegó cerca, viendo la ciudad, lloró sobre ella»; «entrando él en Jerusalem, toda la ciudad se alborotó, diciendo: ¿Quién es éste?». Los discípulos admiraban el Templo, «adornado de hermosas piedras y dones». Los peregrinos la llenaban: «iban sus padres todos los años á Jerusalem en la fiesta de la Pascua», y en Pentecostés «moraban... en Jerusalem Judíos, varones religiosos, de todas las naciones debajo del cielo». Josefo, que conoció la ciudad antes del año 70 d. C., describe sus tres murallas, las dos colinas y el valle entre ellas, y da para todo el perímetro treinta y tres estadios, unos 6 km; sus cifras de millones en la Pascua no se toman al pie de la letra."
    - "La Primera Muralla iba desde las torres de Herodes hacia el este hasta el Templo y rodeaba la colina occidental sobre el valle de Hinom hasta Siloé; la Segunda Muralla, cuyo trazado es el menos conocido, encerraba los mercados entre la puerta Genat y la Antonia, dejando fuera la cantera donde se sitúa el Gólgota; la Tercera Muralla, terminada solo en la revuelta del año 66, abarcaba el norte. El agua de la ciudad venía del Gihón por el túnel de Ezequías, de cisternas y de acueductos desde las colinas del sur. El mapa dibuja las murallas de los días de Jesús a partir de Josefo y de las excavaciones, situando él mismo los tramos inciertos, y muestra las murallas otomanas y la Ciudad de David hacia el 1000 a. C. como comparación."
  pt:
    - "Uma cidade murada de cerca de 85 ha, pela reconstrução da Primeira e da Segunda Muralha no mapa, quase o tamanho da Cidade Velha de hoje dentro das muralhas otomanas (86 ha): o monte do Templo, com a plataforma de Herodes de cerca de 14 ha, a Cidade Alta na colina ocidental, com o palácio de Herodes e suas três torres, a Cidade Baixa na crista da Cidade de Davi até o tanque de Siloé, e a fortaleza Antônia, no canto do Templo. As casas se haviam estendido ao norte da Segunda Muralha, no subúrbio de Bezeta, que Herodes Agripa I começou a cercar com a Terceira Muralha em 41–44 d.C.; com ela a cidade passou a cerca de 180 ha. As estimativas da população no tempo de Jesus vão de 25.000–30.000 (Jeremias) a cerca de 40.000 (Broshi); para a cidade maior antes de 70, Broshi calculou cerca de 80.000 e Levine 60.000–70.000; as festas a multiplicavam várias vezes."
    - "Os Evangelhos mostram a cidade de fora e de dentro. Descendo o monte das Oliveiras, “quando ele se aproximou, viu a cidade e chorou sobre ela”; “quando ele entrou em Jerusalém, toda a cidade se agitou, perguntando: ‘Quem é este?’” Os discípulos admiravam o Templo, “como estava adornado com belas pedras e ofertas dedicadas”. Os peregrinos a enchiam: “Seus pais iam todos os anos a Jerusalém, na festa da Páscoa”, e no Pentecostes “habitavam em Jerusalém judeus, homens piedosos, de todas as nações sob o céu”. Josefo, que conheceu a cidade antes de 70 d.C., descreve suas três muralhas, as duas colinas e o vale entre elas, e dá o perímetro total em trinta e três estádios, cerca de 6 km; seus números de milhões na Páscoa não são tomados ao pé da letra."
    - "A Primeira Muralha ia das torres de Herodes para leste até o Templo e contornava a colina ocidental acima do vale de Hinom até Siloé; a Segunda Muralha, cujo traçado é o menos conhecido, cercava os mercados entre a porta Genate e a Antônia, deixando fora a pedreira onde se situa o Gólgota; a Terceira Muralha, concluída só na revolta de 66, abrangia o norte. A água da cidade vinha do Giom pelo túnel de Ezequias, de cisternas e de aquedutos vindos das colinas ao sul. O mapa traça as muralhas do tempo de Jesus a partir de Josefo e das escavações, colocando por si os trechos incertos, e mostra, para comparação, as muralhas otomanas e a Cidade de Davi por volta de 1000 a.C."
  de:
    - "Eine ummauerte Stadt von etwa 85 ha nach der Rekonstruktion der Ersten und Zweiten Mauer auf der Karte, so groß wie die heutige Altstadt innerhalb ihrer osmanischen Mauern (86 ha): der Tempelberg mit Herodes' Plattform von etwa 14 ha, die Oberstadt auf dem Westhügel mit dem Palast des Herodes und seinen drei Türmen, die Unterstadt auf dem Rücken der Stadt Davids bis zum Teich Siloah und die Burg Antonia an der Ecke des Tempels. Die Häuser hatten sich nördlich der Zweiten Mauer in die Vorstadt Bezetha ausgebreitet, die Herodes Agrippa I. 41–44 n. Chr. mit der Dritten Mauer zu umschließen begann; damit wuchs die Stadt auf etwa 180 ha. Zur Zeit Jesu schätzt man 25 000–30 000 (Jeremias) bis etwa 40 000 (Broshi) Einwohner; für die größere Stadt vor 70 rechnete Broshi mit etwa 80 000, Levine mit 60 000–70 000; an den Festen schwoll sie um ein Mehrfaches an."
    - "Die Evangelien zeigen die Stadt von außen und von innen. Beim Abstieg vom Ölberg „sah er die Stadt an und weinte über sie“, als er nahe hinzukam; „als er zu Jerusalem einzog, erregte sich die ganze Stadt und sprach: Wer ist der?“ Die Jünger rühmten den Tempel, „daß er geschmückt wäre mit feinen Steinen und Kleinoden“. Pilger füllten sie: „Seine Eltern gingen alle Jahre gen Jerusalem auf das Osterfest“, und zu Pfingsten: „Es waren aber Juden zu Jerusalem wohnend, die waren gottesfürchtige Männer aus allerlei Volk, das unter dem Himmel ist“. Josephus, der die Stadt vor 70 n. Chr. kannte, beschreibt ihre drei Mauern, die beiden Hügel und das Tal dazwischen und gibt den ganzen Umfang mit dreiunddreißig Stadien an, etwa 6 km; seine Millionenzahlen beim Passafest nimmt man nicht wörtlich."
    - "Die Erste Mauer verlief von den Türmen des Herodes ostwärts zum Tempel und um den Westhügel über dem Hinnomtal bis nach Siloah; die Zweite Mauer, deren Verlauf am wenigsten bekannt ist, umschloss die Märkte zwischen dem Gennat-Tor und der Antonia und ließ den Steinbruch, in den man Golgatha verlegt, draußen; die Dritte Mauer, erst im Aufstand von 66 vollendet, schloss den Norden ein. Das Wasser der Stadt kam vom Gihon durch den Tunnel Hiskias, aus Zisternen und aus Aquädukten, die es aus den Bergen im Süden heranführten. Die Karte zeichnet die Mauern der Zeit Jesu nach Josephus und den Ausgrabungen und setzt die unsicheren Abschnitte selbst und zeigt zum Vergleich die osmanischen Mauern und die Stadt Davids um 1000 v. Chr."
  fr:
    - "Une ville fortifiée d’environ 85 ha, selon la reconstitution de la première et de la deuxième enceinte, soit à peu près la Vieille Ville actuelle dans ses remparts ottomans (86 ha) : le mont du Temple, avec la plate-forme d’Hérode, de quelque 14 ha ; la ville haute, sur la colline occidentale, avec le palais d’Hérode et ses trois tours ; la ville basse, sur la crête de la Cité de David jusqu’au bassin de Siloé ; et la forteresse Antonia, à l’angle du Temple. Les maisons débordaient au nord, dans le faubourg de Bézétha, qu’Hérode Agrippa Ier commença d’enclore par la troisième enceinte en 41–44 apr. J.-C. ; la ville atteignit alors 180 ha environ. On estime sa population au temps de Jésus de 25 000–30 000 (Jeremias) à 40 000 environ (Broshi) ; pour la ville agrandie d’avant 70, Broshi compte environ 80 000 âmes et Levine 60 000–70 000 ; les fêtes la multipliaient plusieurs fois."
    - "Les Évangiles montrent la ville du dehors et du dedans. En descendant du mont des Oliviers, « comme il approchait de la ville, Jésus, en la voyant, pleura sur elle » ; « lorsqu’il entra dans Jérusalem, toute la ville fut émue, et l’on disait : Qui est celui-ci ? » Les disciples admiraient le Temple : on parlait « des belles pierres et des offrandes qui faisaient l’ornement du temple ». Les pèlerins l’emplissaient : « Les parents de Jésus allaient chaque année à Jérusalem, à la fête de Pâque », et à la Pentecôte « il y avait en séjour à Jérusalem des Juifs, hommes pieux, de toutes les nations qui sont sous le ciel ». Josèphe, qui la connaissait avant 70 apr. J.-C., en décrit les trois enceintes, les deux collines et la vallée qui les sépare, et donne le tour complet à trente-trois stades, soit 6 km environ ; ses millions de pèlerins à la Pâque ne se prennent pas à la lettre."
    - "La première enceinte allait des tours d’Hérode, vers l’est, jusqu’au Temple, puis contournait la colline occidentale au-dessus de la vallée de Hinnom jusqu’à Siloé ; la deuxième, dont le tracé est le moins bien connu, renfermait les marchés entre la porte de Génath et l’Antonia, laissant à l’extérieur la carrière où l’on place le Golgotha ; la troisième, achevée seulement lors de la révolte de 66, englobait le nord. L’eau de la ville venait du Guihon par le tunnel d’Ézéchias, de citernes et d’aqueducs amenant l’eau des collines du sud. La carte dessine les murailles du temps de Jésus d’après Josèphe et les fouilles, plaçant elle-même les tronçons incertains, et montre pour comparaison les remparts ottomans et la Cité de David vers 1000 av. J.-C."
  pl:
    - "Miasto otoczone murami, o powierzchni około 85 ha według rekonstrukcji Pierwszego i Drugiego Muru na mapie, mniej więcej tyle co dzisiejsze Stare Miasto w obrębie osmańskich murów (86 ha): Wzgórze Świątynne z platformą Heroda o powierzchni około 14 ha, Górne Miasto na wzgórzu zachodnim z pałacem Heroda i jego trzema wieżami, Dolne Miasto na grzbiecie Miasta Dawida aż do sadzawki Siloe oraz twierdza Antonia przy narożniku Świątyni. Domy rozlały się na północ od Drugiego Muru, na przedmieście Bezeta, które Herod Agryppa I zaczął otaczać Trzecim Murem w latach 41–44 n.e.; wraz z nim miasto urosło do około 180 ha. Szacunki liczby ludności w czasach Jezusa sięgają od 25 000–30 000 (Jeremias) do około 40 000 (Broshi); dla większego miasta sprzed roku 70 Broshi liczył około 80 000, a Levine 60 000–70 000; w czasie świąt liczba ta rosła kilkakrotnie."
    - "Ewangelie pokazują miasto z zewnątrz i od wewnątrz. Gdy Jezus schodził z Góry Oliwnej, „gdy się przybliżył, ujrzawszy miasto, płakał nad niem”; „A gdy on wjechał do Jeruzalemu, wzruszyło się wszystko miasto, mówiąc: Któż ten jest?” Uczniowie podziwiali Świątynię: „iż był pięknym kamieniem i upominkami ozdobiony”. Wypełniali je pielgrzymi: rodzice Jezusa „chadzali na każdy rok do Jeruzalemu na święto wielkanocne”, a w Pięćdziesiątnicę „byli w Jeruzalemie mieszkający Żydowie, mężowie nabożni, z każdego narodu tych, którzy są pod niebem”. Józef Flawiusz, który znał miasto sprzed roku 70 n.e., opisuje jego trzy mury, dwa wzgórza i dolinę między nimi, a cały obwód podaje jako trzydzieści trzy stadia, około 6 km; jego liczb rzędu milionów w czasie Paschy nie bierze się dosłownie."
    - "Pierwszy Mur biegł od wież Heroda na wschód do Świątyni i wokół wzgórza zachodniego nad doliną Hinnom do Siloe; Drugi Mur, którego przebieg jest najmniej znany, obejmował targowiska między bramą Gennat a Antonią, pozostawiając na zewnątrz kamieniołom, w którym umieszcza się Golgotę; Trzeci Mur, ukończony dopiero w czasie powstania w 66 roku, obejmował północ. Wodę dla miasta dostarczał Gichon przez tunel Ezechiasza, a także cysterny i akwedukty prowadzące ze wzgórz na południu. Mapa rysuje mury z czasów Jezusa na podstawie Józefa Flawiusza i wykopalisk, sama wyznaczając niepewne odcinki, a dla porównania pokazuje mury osmańskie i Miasto Dawida z około 1000 roku p.n.e."
  it:
    - "Una città cinta di mura di circa 85 ha, secondo la ricostruzione della mappa della Prima e della Seconda Cinta, all’incirca quanto l’odierna Città Vecchia entro le mura ottomane (86 ha): il Monte del Tempio con la piattaforma di Erode di circa 14 ha, la Città Alta sul colle occidentale con il palazzo di Erode e le sue tre torri, la Città Bassa sul crinale della Città di Davide fino alla piscina di Siloe, e la fortezza Antonia all’angolo del Tempio. Le case si erano estese a nord della Seconda Cinta nel sobborgo di Bezeta, che Erode Agrippa I cominciò a racchiudere con la Terza Cinta nel 41–44 d.C.; con essa la città giunse a circa 180 ha. Le stime degli abitanti ai tempi di Gesù vanno da 25.000–30.000 (Jeremias) a circa 40.000 (Broshi); per la città più estesa prima del 70, Broshi calcolava circa 80.000 e Levine 60.000–70.000; le feste la gonfiavano di varie volte."
    - "I Vangeli mostrano la città da fuori e da dentro. Scendendo dal Monte degli Ulivi, «come si fu avvicinato, vedendo la città, pianse su lei»; «essendo egli entrato in Gerusalemme, tutta la città fu commossa», chiedendosi chi fosse. I discepoli facevano notare «come il tempio fosse adorno di belle pietre e di doni consacrati». I pellegrini la riempivano: «i suoi genitori andavano ogni anno a Gerusalemme per la festa di Pasqua», e a Pentecoste «in Gerusalemme si trovavan di soggiorno dei Giudei, uomini religiosi d’ogni nazione di sotto il cielo». Giuseppe Flavio, che conobbe la città prima del 70 d.C., descrive le sue tre cinta, i due colli e la valle tra loro, e dà all’intero perimetro trentatré stadi, circa 6 km; le sue cifre di milioni di persone a Pasqua non sono prese alla lettera."
    - "La Prima Cinta correva dalle torri di Erode verso est fino al Tempio e attorno al colle occidentale sopra la Valle di Innom fino a Siloe; la Seconda Cinta, il cui tracciato è il meno noto, racchiudeva i mercati tra la porta di Gennat e l’Antonia, lasciando fuori la cava dove si colloca il Golgota; la Terza Cinta, terminata solo nella rivolta del 66, comprendeva il nord. L’acqua della città veniva dal Ghicon attraverso il tunnel di Ezechia, da cisterne e da acquedotti dalle colline a sud. La mappa disegna le mura dell’epoca di Gesù in base a Giuseppe Flavio e agli scavi, collocando da sé i tratti incerti, e mostra per confronto le mura ottomane e la Città di Davide del 1000 a.C. circa."
  nl:
    - "Een ommuurde stad van ruwweg 85 ha, volgens de reconstructie van de Eerste en Tweede Muur op de kaart, zo groot als de huidige Oude Stad binnen haar Ottomaanse muren (86 ha): de Tempelberg met Herodes’ platform van zo’n 14 ha, de Bovenstad op de westelijke heuvel met Herodes’ paleis en zijn drie torens, de Benedenstad op de rug van de Stad van David tot de vijver van Siloam, en de vesting Antonia op de tempelhoek. Ten noorden van de Tweede Muur lag de voorstad Bezeta, die Herodes Agrippa I in 41–44 n.Chr. met de Derde Muur begon te omsluiten; zo groeide de stad tot ongeveer 180 ha. Schattingen van het aantal inwoners in Jezus’ tijd lopen van 25.000–30.000 (Jeremias) tot ongeveer 40.000 (Broshi); voor de grotere stad vóór 70 raamde Broshi ongeveer 80.000 en Levine 60.000–70.000; tijdens de feesten nam het aantal vele malen toe."
    - "De Evangeliën tonen de stad van buiten en van binnen. Toen Jezus van de Olijfberg afdaalde, “als Hij nabij kwam, en de stad zag, weende Hij over haar”; “als Hij te Jeruzalem inkwam, werd de gehele stad beroerd, zeggende: Wie is Deze?” De leerlingen bewonderden de tempel, “dat hij met schone stenen en begiftigingen versierd was”. Pelgrims vulden haar: “Zijn ouders reisden alle jaar naar Jeruzalem, op het feest van pascha”, en met Pinksteren “er waren Joden, te Jeruzalem wonende, godvruchtige mannen van allen volke dergenen, die onder den hemel zijn”. Josephus, die de stad vóór 70 n.Chr. kende, beschrijft haar drie muren, de twee heuvels en het dal ertussen, en geeft de hele omtrek op drieëndertig stadiën, ongeveer 6 km; zijn getallen van miljoenen bij het Pesachfeest worden niet letterlijk genomen."
    - "De Eerste Muur liep van de torens van Herodes oostwaarts naar de tempel en om de westelijke heuvel boven het Hinnomdal naar Siloam; de Tweede Muur, waarvan het verloop het minst bekend is, omsloot de markten tussen de Gennatpoort en de Antonia en liet de steengroeve waar Golgota wordt gesitueerd buiten de stad; de Derde Muur, pas tijdens de opstand van 66 voltooid, omvatte het noorden. Het water van de stad kwam van de Gihon door de tunnel van Chizkia, uit regenbakken en uit aquaducten vanuit de heuvels in het zuiden. De kaart tekent de muren uit de tijd van Jezus naar Josephus en de opgravingen, vult de onzekere gedeelten zelf in, en toont ter vergelijking de Ottomaanse muren en de Stad van David van omstreeks 1000 v.Chr."
  cs:
    - "Opevněné město o rozloze zhruba 85 ha podle mapové rekonstrukce Prvních a Druhých hradeb, asi jako dnešní Staré Město uvnitř osmanských hradeb (86 ha): Chrámová hora s Herodovou terasou o výměře asi 14 ha, Horní město na západním návrší s Herodovým palácem a jeho třemi věžemi, Dolní město na hřebeni Města Davidova až k rybníku Siloe a pevnost Antonia v rohu chrámu. Domy se rozrostly i severně od Druhých hradeb do předměstí Bezeta, které Herodes Agrippa I. začal v letech 41–44 n. l. obklopovat Třetími hradbami; tím město vzrostlo na asi 180 ha. Odhady obyvatel za Ježíšových dnů jdou od 25 000–30 000 (Jeremias) po asi 40 000 (Broshi); pro větší město před rokem 70 počítal Broshi asi 80 000 a Levine 60 000–70 000; o svátcích se počet několikanásobně zvýšil."
    - "Evangelia ukazují město zvenčí i zevnitř. Při sestupu z Olivové hory „když se přiblížil, uzřev město, plakal nad ním“; „když vjel do Jeruzaléma, zbouřilo se všecko město, řkouce: I kdo jest tento?“ Učedníci obdivovali chrám, „kterak by kamením pěkným i jinými okrasami ozdoben byl“. Poutníci jej plnili: „chodívali rodičové jeho každého roku do Jeruzaléma na den slavný velikonoční“ a o letnicích „byli pak v Jeruzalémě přebývající Židé, muži nábožní, ze všelikého národu, kterýž pod nebem jest“. Josephus Flavius, který město před rokem 70 n. l. znal, popisuje jeho troje hradby, dvě návrší a údolí mezi nimi a celý obvod udává na třicet tři stadií, asi 6 km; jeho počty milionů o Pesachu se doslova neberou."
    - "První hradby vedly od Herodových věží na východ k chrámu a kolem západního návrší nad Hinómovým údolím k Siloe; Druhé hradby, jejichž průběh je nejméně znám, obepínaly trhy mezi branou Gennat a Antonií a lom, kde se hledá Golgota, nechávaly vně; Třetí hradby, dokončené až za povstání roku 66, zahrnuly sever. Voda přicházela z Gichónu Chizkijášovým tunelem, z cisteren a z akvaduktů z hor na jihu. Mapa kreslí hradby Ježíšovy doby podle Josepha a vykopávek, nejisté úseky doplňuje sama, a pro srovnání ukazuje osmanské hradby a Město Davidovo kolem roku 1000 př. n. l."
  sv:
    - "En muromgärdad stad på ungefär 85 ha, enligt kartans rekonstruktion av första och andra muren, ungefär lika stor som dagens gamla stad innanför sina osmanska murar (86 ha): Tempelberget med Herodes plattform på omkring 14 ha, Övre staden på västra kullen med Herodes palats och dess tre torn, Nedre staden på åsen i Davids stad ned till Siloadammen och Antoniaborgen vid templets hörn. Husen hade spridit sig norr om andra muren in i förstaden Bezeta, som Herodes Agrippa I började innesluta med tredje muren 41–44 e.Kr.; med den växte staden till omkring 180 ha. Uppskattningarna av antalet invånare på Jesu tid sträcker sig från 25 000–30 000 (Jeremias) till omkring 40 000 (Broshi); för den större staden före år 70 räknade Broshi med omkring 80 000 och Levine med 60 000–70 000; högtiderna fick folkmängden att mångdubblas."
    - "Evangelierna visar staden utifrån och inifrån. På väg ned från Olivberget: ”Då han nu kom närmare och fick se staden, begynte han gråta över den”; ”När han så drog in i Jerusalem, kom hela staden i rörelse, och man frågade: ’Vem är denne?’” Lärjungarna beundrade templet, ”huru den var uppförd av härliga stenar och prydd med helgedomsskänker”. Pilgrimer fyllde den: hans föräldrar plägade ”årligen vid påskhögtiden begiva sig till Jerusalem”, och vid pingst ”bodde i Jerusalem fromma judiska män från allahanda folk under himmelen”. Josefus, som kände staden före år 70 e.Kr., beskriver dess tre murar, de två kullarna och dalen mellan dem och anger hela omkretsen till trettiotre stadier, omkring 6 km; hans siffror på miljontals människor vid påsk tas inte bokstavligt."
    - "Första muren gick från Herodes torn österut till templet och runt västra kullen ovanför Hinnoms dal till Siloa; andra muren, vars sträckning är minst känd, omslöt marknaderna mellan Gennatporten och Antonia och lämnade stenbrottet där Golgota förläggs utanför; tredje muren, färdigställd först under upproret år 66, omfattade norra delen. Stadens vatten kom från Gihon genom Hiskias tunnel, från cisterner och från vattenledningar från höjderna i söder. Kartan ritar Jesu tids murar efter Josefus och utgrävningarna och placerar själv de osäkra sträckorna, och visar de osmanska murarna och Davids stad omkring 1000 f.Kr. som jämförelse."
  nb:
    - "En befestet by på omtrent 85 ha, etter kartets rekonstruksjon av den første og den andre muren, omtrent på størrelse med dagens gamleby innenfor de osmanske murene (86 ha): Tempelhøyden med Herodes' plattform på rundt 14 ha, Øvre by på den vestlige høyden med Herodes' palass og dets tre tårn, Nedre by på Davidsbyens rygg ned til Siloa-dammen, og Antonia-festningen i tempelets hjørne. Husene hadde bredt seg nord for den andre muren inn i forstaden Bezeta, som Herodes Agrippa I begynte å omslutte med den tredje muren i 41–44 e.Kr.; med den vokste byen til omtrent 180 ha. Anslagene for innbyggertallet på Jesu tid varierer fra 25 000–30 000 (Jeremias) til omtrent 40 000 (Broshi); for den større byen før år 70 regnet Broshi med omtrent 80 000 og Levine med 60 000–70 000; høytidene fikk tallet til å vokse flere ganger."
    - "Evangeliene viser byen utenfra og innenfra. Da Jesus kom ned fra Oljeberget, «da han kom nær og så byen, gråt han over den»; «da han drog inn i Jerusalem, kom hele byen i bevegelse og sa: Hvem er dette?» Disiplene beundret tempelet, som var «prydet med fagre stener og tempelgaver». Pilegrimer fylte byen: «hans foreldre drog hvert år til Jerusalem til påskefesten», og ved pinse «bodde det i Jerusalem jøder, gudfryktige menn fra alle folkeslag under himmelen». Josefus, som kjente byen før år 70, beskriver dens tre murer, de to høydene og dalen mellom dem, og oppgir hele omkretsen til trettitre stadier, omtrent 6 km; hans tall på millioner ved påsketiden tas ikke bokstavelig."
    - "Den første muren gikk fra Herodes' tårn østover til tempelet og rundt den vestlige høyden over Hinnoms dal til Siloa; den andre muren, hvis forløp er minst kjent, omsluttet markedene mellom Gennat-porten og Antonia og lot steinbruddet der Golgata antas å ligge, stå utenfor; den tredje muren, som først ble ferdig under opprøret i 66, tok inn nordsiden. Byens vann kom fra Gihon gjennom Hiskias tunnel, fra sisterner og fra akvedukter fra høydene i sør. Kartet tegner murene fra Jesu tid etter Josefus og utgravingene, med de usikre strekningene plassert av kartet selv, og viser de osmanske murene og Davidsbyen fra omtrent 1000 f.Kr. til sammenligning."
  tl:
    - "Lungsod na may pader na humigit-kumulang 85 ha, ayon sa muling paggawa ng mapa sa Una at Ikalawang Pader, halos kasinlaki ng Lumang Lungsod sa loob ng mga pader nitong Otomano (86 ha): ang Bundok ng Templo na may plataporma ni Herodes na mga 14 ha, ang Itaas na Lungsod sa kanlurang burol na may palasyo ni Herodes at tatlong tore nito, ang Ibabang Lungsod sa tagaytay ng Bayan ni David pababa sa tangke ng Siloe, at ang kuta ng Antonia sa sulok ng Templo. Lumaganap ang mga bahay sa hilaga ng Ikalawang Pader sa arabal ng Bezeta, na sinimulang kulungin ni Herodes Agripa I ng Ikatlong Pader noong 41–44 AD; lumaki ito hanggang mga 180 ha. Tinatayang 25,000–30,000 ang tao noong panahon ni Jesus (Jeremias) hanggang mga 40,000 (Broshi); para sa mas malaking lungsod bago ang 70, mga 80,000 ayon kay Broshi at 60,000–70,000 ayon kay Levine; ilang ulit itong lumobo tuwing pista."
    - "Ipinakikita ng mga Ebanghelyo ang lungsod mula sa labas at sa loob. Pababa sa Bundok ng mga Olibo, “nang malapit na siya, nakita niya ang bayan, at ito'y kaniyang tinangisan”; “nang pumasok si Jesus sa Jerusalem, ay nagkagulo ang buong bayan, na nagsasabi, Sino kaya ito?” Hinangaan ng mga alagad ang Templo, “kung paanong ito'y pinalamutihan ng magagandang bato at mga hain”. Pinuno ito ng mga peregrino: “nagsisiparoon taon-taon ang kaniyang mga magulang sa Jerusalem sa kapistahan ng paskua”, at sa Pentecostes, “may mga nagsisitahan nga sa Jerusalem na mga Judio, mga lalaking religioso, na buhat sa bawa't bansa sa ilalim ng langit”. Inilarawan ni Josephus, na nakakilala rito bago ang 70 AD, ang tatlong pader nito, dalawang burol at lambak sa pagitan, at ang paligid na tatlumpu't tatlong estadio, mga 6 km; hindi literal ang kaniyang milyon-milyon tuwing Paskua."
    - "Ang Unang Pader ay tumakbo mula sa mga tore ni Herodes pasilangan hanggang sa Templo at paikot sa kanlurang burol sa itaas ng libis ng Hinnom hanggang sa Siloe; ang Ikalawang Pader, na ang takbo ang pinakakaunting alam, ay kumulong sa mga pamilihan sa pagitan ng pintuang Gennath at ng Antonia, at iniwan sa labas ang kantera kung saan inilalagay ang Golgota; ang Ikatlong Pader, na natapos lamang sa paghihimagsik noong 66, ay kumulong sa hilaga. Ang tubig ng lungsod ay nagmula sa Gihon sa pamamagitan ng lagusan ni Ezechias, mula sa mga sisterna at mula sa mga akwedukto na galing sa mga burol sa timog. Iginuguhit ng mapa ang mga pader noong panahon ni Jesus mula kay Josephus at sa mga paghuhukay, at ang mapa na mismo ang naglalagay sa mga di-tiyak na bahagi, at ipinakikita nito ang mga pader na Otomano at ang Bayan ni David noong mga 1000 BK bilang paghahambing."
  da:
    - "En by med mure på omkring 85 ha efter kortets rekonstruktion af første og anden mur, omtrent som nutidens Gamleby inden for sine osmanniske mure (86 ha): Tempelbjerget med Herodes' platform på omkring 14 ha, Øvrebyen på den vestlige høj med Herodes' palads og dets tre tårne, Nedrebyen på Davidsbyens højderyg ned til Siloam-dammen og Antonia-fæstningen ved Templets hjørne. Husene havde bredt sig nord for anden mur ind i forstaden Bezeta, som Herodes Agrippa I begyndte at omslutte med tredje mur i 41–44 e.Kr.; hermed voksede byen til omkring 180 ha. Overslag over befolkningen på Jesu tid går fra 25.000–30.000 (Jeremias) til omkring 40.000 (Broshi); for den større by før 70 regnede Broshi med omkring 80.000 og Levine med 60.000–70.000; højtiderne fik tallet til at svulme adskillige gange op."
    - "Evangelierne viser byen udefra og indefra. Da Jesus kom ned ad Oliebjerget: »da han kom nær til og saa Staden, græd han over den«; »da han drog ind i Jerusalem, kom hele Staden i Bevægelse og sagde: ›Hvem er denne?‹« Disciplene beundrede Templet, som var »prydet med smukke Stene og Tempelgaver«. Pilgrimme fyldte byen: »hans Forældre droge hvert Aar op til Jerusalem paa Paaskehøjtiden«, og til pinse: »Men der var Jøder, bosiddende i Jerusalem, gudfrygtige Mænd af alle Folkeslag under Himmelen«. Josefus, som kendte byen før 70 e.Kr., beskriver dens tre mure, de to høje og dalen imellem dem og angiver hele omkredsen til treogtredive stadier, omkring 6 km; hans tal på millioner ved påske tages ikke bogstaveligt."
    - "Første mur løb fra Herodes' tårne mod øst til Templet og rundt om den vestlige høj over Hinnoms Dal til Siloam; anden mur, hvis forløb er det mindst kendte, omsluttede markederne mellem Gennat-porten og Antonia og lod stenbruddet, hvor Golgata placeres, ligge udenfor; tredje mur, først færdig under oprøret i 66, omfattede nordsiden. Byens vand kom fra Gihon gennem Hizkijas tunnel, fra cisterner og fra akvædukter fra højderne mod syd. Kortet tegner murene fra Jesu tid efter Josefus og udgravningerne og placerer selv de usikre strækninger og viser til sammenligning de osmanniske mure og Davidsbyen fra omkring 1000 f.Kr."
  sr:
    - "Град с бедемима површине отприлике 85 ха, према реконструкцији Првог и Другог бедема на карти, приближно колико и данашњи Стари град унутар османских бедема (86 ха): Храмовна гора с Иродовом платформом од око 14 ха, Горњи град на западном брду с Иродовом палатом и њеним трима кулама, Доњи град на гребену Давидовог града све до Силоамске бање, и тврђава Антонија на углу Храма. Куће су се прошириле северно од Другог бедема у предграђе Безету, које је Ирод Агрипа I почео да опасује Трећим бедемом 41–44. н. е.; с њим је град нарастао на око 180 ха. Процене броја становника у Исусово доба крећу се од 25.000–30.000 (Јеремијас) до око 40.000 (Броши); за већи град пре 70. н. е. Броши рачуна око 80.000, а Левин 60.000–70.000; о празницима је тај број нарастао неколико пута."
    - "Јеванђеља приказују град споља и изнутра. Силазећи с Маслинске горе: „И кад се приближи, угледа град и заплака за њим“; „И кад Он уђе у Јерусалим, узбуни се сав град говорећи: Ко је то?“ Ученици су се дивили Храму, „да је украшена лепим камењем и закладима“. Ходочасници су га пунили: „родитељи Његови иђаху сваке године у Јерусалим о празнику пасхе“, а о Педесетници „у Јерусалиму стајаху Јевреји људи побожни из сваког народа који је под небом“. Јосиф Флавије, који је познавао град пре 70. н. е., описује његова три бедема, два брда и долину међу њима, а цео обим даје као тридесет три стадија, око 6 км; његови бројеви о милионима за Пасху не узимају се дословно."
    - "Први бедем ишао је од Иродових кула на исток до Храма и око западног брда изнад долине Хином до Силоама; Други бедем, чији је ток најмање познат, обухватао је пијаце између капије Генат и Антоније, остављајући изван себе каменолом у коме се смешта Голгота; Трећи бедем, довршен тек у буни 66. н. е., обухватио је север. Вода у град је долазила из Гиона кроз Језекијин тунел, из цистерни и из аквадуката с брда на југу. Карта црта бедеме Исусовог доба према Јосифу Флавију и ископавањима, сама одређујући несигурне деонице, и ради поређења приказује османске бедеме и Давидов град из око 1000. п. н. е."
  hu:
    - "Falakkal körülvett város, a térkép Első és Második Fal-rekonstrukciója szerint nagyjából 85 ha, vagyis körülbelül akkora, mint a mai Óváros oszmán falain belül (86 ha): a Templomhegy Heródes mintegy 14 ha-os teraszával, a Felső Város a nyugati dombon Heródes palotájával és három tornyával, az Alsó Város Dávid városának gerincén a Siloám taváig, és az Antonia-erőd a Templom sarkánál. A házak a Második Falon túl északra, Bezeta külvárosába is kiterjedtek, amelyet I. Heródes Agrippa Kr. u. 41–44-ben kezdett a Harmadik Fallal bekeríteni; ezzel a város mintegy 180 ha-ra nőtt. A lakosság számát Jézus korában 25 000–30 000-re (Jeremias) és mintegy 40 000-re (Broshi) becsülik; a 70 előtti nagyobb városra Broshi mintegy 80 000-et, Levine 60 000–70 000-et számított; az ünnepek ennek többszörösére duzzasztották."
    - "Az evangéliumok kívülről és belülről is megmutatják a várost. Az Olajfák hegyéről leereszkedve: „mikor közeledett, látván a várost, síra azon”; „a mikor bemegy vala Jeruzsálembe, felháborodék az egész város, mondván: Kicsoda ez?” A tanítványok a templomot csodálták, mert „szép kövekkel és ajándékokkal van felékesítve”. A zarándokok megtöltötték: „az ő szülei pedig évenként feljártak Jeruzsálembe a húsvét ünnepére”, pünkösdkor pedig „lakoznak vala pedig Jeruzsálemben zsidók, istenfélő férfiak, minden nép közül, melyek az ég alatt vannak”. Josephus, aki a várost Kr. u. 70 előtt ismerte, leírja három falát, a két dombot és a köztük húzódó völgyet, a teljes kerületet pedig harminchárom stadionban, mintegy 6 km-ben adja meg; a páska idejére megadott milliós számait nem veszik szó szerint."
    - "Az Első Fal Heródes tornyaitól keletre a Templomig futott, majd a nyugati dombot megkerülve a Hinnom-völgy fölött Siloámig; a Második Fal, amelynek lefutása a legkevésbé ismert, a Gennat-kapu és az Antonia közötti piacokat fogta körül, a Golgota helyének tartott kőbányát kívül hagyva; a Harmadik Fal, amely csak a 66-os lázadás idején készült el, északon zárta be a várost. A város vize a Gihonból jött az Ezékiás-alagúton át, ciszternákból és a déli hegyekből érkező vízvezetékekből. A térkép Jézus korának falait Josephus és az ásatások alapján rajzolja meg, a bizonytalan szakaszokat maga helyezve el, és összehasonlításul az oszmán falakat és a Kr. e. 1000 körüli Dávid városát is feltünteti."
  fi:
    - "Muurien ympäröimä kaupunki, jonka laajuus oli kartan Ensimmäisen ja Toisen muurin rekonstruktion mukaan noin 85 ha eli suunnilleen nykyisen Vanhankaupungin ottomaanimuurien sisäpuolen kokoinen (86 ha): Temppelivuori Herodeksen noin 14 ha:n tasanteineen, Yläkaupunki läntisellä kukkulalla Herodeksen palatsineen ja kolmine torneineen, Alakaupunki Daavidin kaupungin harjanteella aina Siloan lammikolle asti sekä Antonian linnoitus temppelin kulmassa. Talot olivat levinneet Toisen muurin pohjoispuolelle Bezetan esikaupunkiin, jonka Herodes Agrippa I alkoi sulkea Kolmannella muurilla vuosina 41–44 jaa.; sen myötä kaupunki kasvoi noin 180 hehtaariin. Asukasarviot Jeesuksen ajalle vaihtelevat 25 000–30 000:sta (Jeremias) noin 40 000:een (Broshi); suuremmalle kaupungille ennen vuotta 70 Broshi arvioi noin 80 000 ja Levine 60 000–70 000; juhlat moninkertaistivat väkimäärän."
    - "Evankeliumit näyttävät kaupungin sekä ulkoa että sisältä. Öljymäeltä alas tullessaan ”kun hän tuli lähemmäksi ja näki kaupungin, itki hän sitä”; ”kun hän tuli Jerusalemiin, joutui koko kaupunki liikkeelle ja sanoi: Kuka tämä on?” Opetuslapset ihailivat temppeliä, ”kuinka se oli kauniilla kivillä ja temppelilahjoilla kaunistettu”. Pyhiinvaeltajat täyttivät kaupungin: ”hänen vanhempansa matkustivat joka vuosi Jerusalemiin pääsiäisjuhlille”, ja helluntaina ”Jerusalemissa asui juutalaisia, jumalaapelkääväisiä miehiä, kaikkinaisista kansoista, mitä taivaan alla on”. Josephus, joka tunsi kaupungin ennen vuotta 70 jaa., kuvaa sen kolme muuria, kaksi kukkulaa ja niiden välisen laakson ja antaa koko kehän pituudeksi kolmekymmentäkolme stadionia, noin 6 km; hänen pääsiäisen miljoonia koskevia lukujaan ei oteta kirjaimellisesti."
    - "Ensimmäinen muuri kulki Herodeksen torneilta itään temppelille ja kiersi läntisen kukkulan Hinnomin laakson yläpuolella Siloaan; Toinen muuri, jonka kulku tunnetaan huonoimmin, ympäröi Gennathin portin ja Antonian väliset torit jättäen ulkopuolelle louhoksen, johon Golgata sijoitetaan; Kolmas muuri, joka valmistui vasta vuoden 66 kapinassa, otti sisäänsä pohjoisen. Kaupungin vesi tuli Gihonista Hiskian tunnelin kautta, sisterneistä ja etelän kukkuloilta tulevista vesijohdoista. Kartta piirtää Jeesuksen ajan muurit Josephuksen ja kaivausten pohjalta, sijoittaen epävarmat osuudet itse, ja näyttää vertailun vuoksi ottomaanien muurit sekä noin vuoden 1000 eaa. Daavidin kaupungin."
  vi:
    - "Một thành có tường bao quanh rộng chừng 85 ha, theo phục dựng của bản đồ về Tường thứ nhất và Tường thứ hai, xấp xỉ diện tích Khu Phố Cổ ngày nay trong các bức tường Ottoman (86 ha): núi Đền Thờ với nền đài của Hê-rốt rộng khoảng 14 ha, Thượng Thành trên ngọn đồi phía tây với cung điện của Hê-rốt và ba tòa tháp, Hạ Thành trên sườn đồi của Thành Đa-vít chạy xuống ao Si-lô-ê, và pháo đài Antonia ở góc Đền Thờ. Nhà cửa đã lan ra phía bắc Tường thứ hai, tới khu ngoại ô Bezetha, nơi Hê-rốt Ạc-ríp-ba I bắt đầu cho bao bằng Tường thứ ba vào năm 41–44; nhờ đó thành mở rộng đến khoảng 180 ha. Các ước tính về dân số thời Giê-su dao động từ 25.000–30.000 (Jeremias) đến khoảng 40.000 (Broshi); với thành rộng hơn trước năm 70, Broshi tính khoảng 80.000 và Levine 60.000–70.000; vào các kỳ lễ, dân số tăng lên gấp nhiều lần."
    - "Các sách Phúc Âm cho thấy thành từ bên ngoài lẫn bên trong. Khi đi xuống từ núi Ô-li-ve, Ngài “gần đến thành, thấy thì khóc về thành”; “khi Ngài đã vào thành Giê-ru-sa-lem, thì cả thành đều xôn xao, nói rằng: Người nầy là ai?” Các môn đồ trầm trồ về Đền Thờ, về “đá đẹp và đồ dâng làm rực rỡ trong đền thờ”. Khách hành hương lấp đầy thành: “hằng năm đến ngày lễ Vượt qua, cha mẹ Đức Chúa Jêsus thường đến thành Giê-ru-sa-lem”, và vào lễ Ngũ Tuần “có người Giu-đa, kẻ mộ đạo, từ các dân thiên hạ đến, ở tại thành Giê-ru-sa-lem”. Giô-sê-phu, người biết thành trước năm 70, mô tả ba lớp tường, hai ngọn đồi và thung lũng giữa chúng, và cho chu vi toàn thành là ba mươi ba stadia, khoảng 6 km; những con số hàng triệu người vào lễ Vượt qua của ông không được hiểu theo nghĩa đen."
    - "Tường thứ nhất chạy từ các tháp của Hê-rốt về phía đông đến Đền Thờ rồi vòng quanh ngọn đồi phía tây trên trũng Hi-nôm tới Si-lô-ê; Tường thứ hai, mà đường đi là điều ít được biết nhất, bao quanh các khu chợ giữa cổng Gennath và Antonia, để lại bên ngoài mỏ đá nơi người ta xác định Gô-gô-tha; Tường thứ ba, chỉ hoàn thành trong cuộc nổi dậy năm 66, bao lấy phía bắc. Nước của thành đến từ Ghi-hôn qua đường hầm Ê-xê-chia, từ các bể chứa và từ các ống dẫn nước từ những ngọn đồi phía nam. Bản đồ vẽ các bức tường thời Giê-su theo Giô-sê-phu và các cuộc khai quật, tự xác định vị trí những đoạn chưa chắc chắn, và cho thấy các bức tường Ottoman cùng Thành Đa-vít vào khoảng năm 1000 TCN để so sánh."
  ro:
    - "O cetate înconjurată de ziduri, de circa 85 ha după reconstituirea de pe hartă a Primului și a celui de-al Doilea Zid, cam cât Orașul Vechi de azi în zidurile sale otomane (86 ha): Muntele Templului cu platforma lui Irod de circa 14 ha, Orașul de Sus pe dealul de vest cu palatul lui Irod și cele trei turnuri ale lui, Orașul de Jos pe creasta Cetății lui David până la scăldătoarea Siloamului și fortăreața Antonia la colțul Templului. Casele se întinseseră la nord de al Doilea Zid, în suburbia Bezetha, pe care Irod Agripa I a început s-o cuprindă cu al Treilea Zid în 41–44 d.Hr.; astfel orașul a ajuns la circa 180 ha. Estimările pentru locuitorii din vremea lui Isus merg de la 25 000–30 000 (Jeremias) la circa 40 000 (Broshi); pentru orașul mai mare dinainte de 70, Broshi a socotit circa 80 000, iar Levine 60 000–70 000; sărbătorile îl umflau de mai multe ori."
    - "Evangheliile arată cetatea din afară și dinăuntru. Coborând de pe Muntele Măslinilor: „dacă s’au apropiat, văzând cetatea, au plâns de dânsa”; „intrând el în Ierusalim, s’a cutremurat toată cetatea, zicând: cine este acesta?” Ucenicii admirau Templul, „că este împodobită cu pietre frumoase și cu podoabe”. Pelerinii îl umpleau: „se duceau părinții lui în fiecare an în Ierusalim, la praznicul paștilor”, iar la Cincizecime „erau în Ierusalim locuitori Iudei, bărbați cucernici, dintru tot neamul ce este supt cer”. Iosif Flaviu, care a cunoscut cetatea dinainte de 70 d.Hr., îi descrie cele trei ziduri, cele două dealuri și valea dintre ele și dă întregul ocol la treizeci și trei de stadii, circa 6 km; cifrele sale de milioane la Paști nu se iau literal."
    - "Primul Zid mergea de la turnurile lui Irod spre est până la Templu și în jurul dealului de vest, deasupra văii Hinom, până la Siloam; al Doilea Zid, al cărui traseu este cel mai puțin cunoscut, cuprindea piețele dintre poarta Gennath și Antonia, lăsând în afară cariera unde se așază Golgota; al Treilea Zid, terminat abia în revolta din anul 66, cuprindea nordul. Apa cetății venea de la Ghihon prin tunelul lui Ezechia, din cisterne și din apeducte aduse din dealurile din sud. Harta desenează zidurile din vremea lui Isus după Iosif Flaviu și după săpături, așezând ea însăși tronsoanele nesigure, și arată, spre comparație, zidurile otomane și Cetatea lui David de pe la 1000 î.Hr."
  bg:
    - "Град, ограден със стени, от около 85 ха според реконструкцията на Първата и Втората стена на картата — горе-долу колкото днешния Стар град в османските му стени (86 ха): Храмовият хълм с Иродовата платформа от около 14 ха, Горният град на западния хълм с двореца на Ирод и трите му кули, Долният град по билото на Давидовия град до къпалнята Силоам и крепостта Антония при ъгъла на Храма. Къщите се били разпрострели северно от Втората стена в предградието Безета, което Ирод Агрипа I започнал да огражда с Третата стена през 41–44 г. н.е.; с нея градът нараснал до около 180 ха. Оценките за населението по времето на Исус са от 25 000–30 000 (Йеремиас) до около 40 000 (Броши); за по-големия град преди 70 г. Броши смята около 80 000, а Левин 60 000–70 000; празниците го увеличавали няколкократно."
    - "Евангелията показват града отвън и отвътре. Слизайки от Елеонския хълм, Исус, „като наближи та виде градът, плака за него“; „когато влезе в Иерусалим, всичкият град се потресе, и казваха: Кой е този?“ Учениците се възхищавали на Храма, „че е украсен с хубави камене и с посвещения“. Поклонници го изпълвали: „ходеха родителите му всека година в Ерусалим за празника на пасхата“, а на Петдесетница „имаше в Ерусалим да живеят Юдеи, человеци благочестиви от всеки народ що има под небето“. Йосиф Флавий, който познавал града преди 70 г. н.е., описва трите му стени, двата хълма и долината между тях и дава цялата обиколка като тридесет и три стадия, около 6 км; неговите милиони на Пасха не се приемат буквално."
    - "Първата стена вървяла от Иродовите кули на изток до Храма и около западния хълм над долината Еном до Силоам; Втората стена, чието трасе е най-слабо познато, обхващала пазарите между портата Генат и Антония, като оставяла навън кариерата, където се поставя Голгота; Третата стена, довършена едва при въстанието от 66 г., обхванала севера. Водата идвала от Гион през тунела на Езекия, от цистерни и по акведукти от хълмовете на юг. Картата чертае стените от времето на Исус по Йосиф Флавий и разкопките, като сама прекарва несигурните участъци, и за сравнение показва османските стени и Давидовия град от около 1000 г. пр.н.е."
