id: where-did-the-hasmoneans-rule
question:
  en: "Where did the Hasmoneans rule from?"
  ru: "Откуда правили Хасмонеи?"
  uk: "Звідки правили хасмонеї?"
  es: "¿Desde dónde gobernaron los asmoneos?"
  pt: "De onde governaram os hasmoneus?"
  de: "Von wo herrschten die Hasmonäer?"
  fr: "D’où régnaient les Hasmonéens ?"
  pl: "Skąd rządzili Hasmoneusze?"
  it: "Da dove regnarono gli Asmonei?"
  nl: "Vanwaar regeerden de Hasmoneeën?"
  cs: "Odkud vládli Hasmoneovci?"
  sv: "Varifrån härskade hasmoneerna?"
  nb: "Hvor regjerte hasmoneerne fra?"
  tl: "Saan namuno ang mga Hasmoneo?"
  da: "Hvorfra herskede hasmonæerne?"
answer:
  en:
    - "From Jerusalem, where the map point stands. The family came from Modein, a village in the foothills north-west of the city, where in 167 BC the priest Mattathias refused to sacrifice to the gods of Antiochus IV and began the revolt; his son Judas Maccabeus took Jerusalem and cleansed the Temple in December 164 BC, the event kept as Hanukkah, “the feast of the dedication” at which John shows Jesus walking in Solomon's porch."
    - "Judas' brothers turned the revolt into a state: Jonathan became high priest in 152 BC, Simon won freedom from tribute in 142, and the people made him hereditary high priest and ruler. John Hyrcanus (134–104 BC) conquered Idumea and Samaria and razed the temple on Gerizim; Aristobulus I took the title of king; Alexander Jannaeus (103–76) pushed the borders to the coast and across the Jordan, nearly to the size of David's kingdom; his widow Salome Alexandra reigned until 67. Their palace stood in the Upper City of Jerusalem above the Temple, and they built winter palaces with pools and gardens at Jericho, excavated since the 1970s. Daniel's visions of the little horn and of the forces that would “pollute the sanctuary of strength” were read in these years, with the promise that “the people that do know their God shall be strong, and do exploits”."
    - "The dynasty ended in civil war. Salome's sons Hyrcanus II and Aristobulus II both appealed to Pompey, who took Jerusalem in 63 BC and entered the Holy of Holies; Rome kept Hyrcanus as high priest and ethnarch, and the last Hasmonean king, Antigonus, reigned with Parthian help from 40 to 37 BC until Herod, whose wife Mariamne was a Hasmonean princess, took the city with Roman legions. The books of Maccabees, which tell the first part of the story, are in the Greek and Slavonic Bibles but not in the Hebrew canon."
  ru:
    - "Из Иерусалима, где и стоит точка карты. Род происходил из Модина, селения в предгорьях к северо-западу от города, где в 167 г. до н. э. священник Маттафия отказался принести жертву богам Антиоха IV и начал восстание; его сын Иуда Маккавей взял Иерусалим и очистил Храм в декабре 164 г. до н. э. — это событие вспоминают в Хануку, «праздник обновления», на котором Иоанн показывает Иисуса ходящим в притворе Соломоновом."
    - "Братья Иуды превратили восстание в государство: Ионафан стал первосвященником в 152 г. до н. э., Симон в 142-м добился свободы от дани, и народ сделал его наследственным первосвященником и правителем. Иоанн Гиркан (134–104 гг.) завоевал Идумею и Самарию и разрушил храм на Гаризиме; Аристобул I принял титул царя; Александр Яннай (103–76) раздвинул границы до побережья и за Иордан, почти до размеров царства Давида; его вдова Саломея Александра правила до 67 г. Их дворец стоял в Верхнем городе Иерусалима над Храмом, а в Иерихоне они построили зимние дворцы с бассейнами и садами, раскопанные с 1970-х годов. Видения Даниила о небольшом роге и о войске, которое «осквернит святилище могущества», читали в эти годы, вместе с обещанием: «люди, чтущие своего Бога, усилятся и будут действовать»."
    - "Династия кончилась междоусобицей. Сыновья Саломеи Гиркан II и Аристобул II оба обратились к Помпею, который взял Иерусалим в 63 г. до н. э. и вошёл в Святое святых; Рим оставил Гиркана первосвященником и этнархом, а последний хасмонейский царь Антигон правил с помощью парфян с 40 по 37 г. до н. э., пока Ирод, чья жена Мариамна была хасмонейской царевной, не взял город с римскими легионами. Книги Маккавейские, рассказывающие первую часть этой истории, есть в греческой и славянской Библии, но не в еврейском каноне."
  uk:
    - "З Єрусалиму, де стоїть точка мапи. Родина походила з Модіна, села в передгір'ях на північний захід від міста, де 167 р. до н. е. священик Маттафій відмовився жертвувати богам Антіоха IV і розпочав повстання; його син Юда Макавей узяв Єрусалим і очистив Храм у грудні 164 р. до н. е., подія, що її відзначають як Хануку, «поновини», на яких Іван показує Ісуса, що «ходив … по церкві у Соломоновім ходнику»."
    - "Брати Юди перетворили повстання на державу: Йонатан став первосвящеником 152 р. до н. е., Симон здобув свободу від данини 142 р., і народ зробив його спадковим первосвящеником і правителем. Іван Гіркан (134–104 рр. до н. е.) підкорив Ідумею та Самарію й зруйнував храм на Геризимі; Аристовул I прийняв титул царя; Александр Яннай (103–76) відсунув кордони до узбережжя і через Йордан, майже до розмірів царства Давида; його вдова Саломея Александра царювала до 67 р. Їхній палац стояв у Верхньому місті Єрусалиму над Храмом, і вони будували зимові палаци з басейнами й садами в Єрихоні, розкопувані від 1970-х рр. Видіння Даниїла про малий ріг і про війська, що «опоганить сьвятиню могутностї», читали в ці роки, разом з обітницею, що «люде, віддані щиро свойму Богу, з усїх сил стануть до дїла»."
    - "Династія закінчилася громадянською війною. Сини Саломеї, Гіркан II та Аристовул II, обидва звернулися до Помпея, який узяв Єрусалим 63 р. до н. е. і ввійшов у Святе святих; Рим залишив Гіркана первосвящеником і етнархом, а останній хасмонейський цар Антигон царював за парфянської допомоги з 40 до 37 р. до н. е., доки Ірод, чия дружина Маріамна була хасмонейською принцесою, не взяв місто з римськими легіонами. Книги Макавеїв, які розповідають першу частину історії, є в грецьких і слов'янських Бібліях, але не в єврейському каноні."
  es:
    - "Desde Jerusalén, donde está el punto del mapa. La familia procedía de Modín, una aldea de las estribaciones al noroeste de la ciudad, donde en el 167 a. C. el sacerdote Matatías se negó a sacrificar a los dioses de Antíoco IV y comenzó la revuelta; su hijo Judas Macabeo tomó Jerusalén y purificó el Templo en diciembre del 164 a. C., hecho que se conmemora como Janucá, «la fiesta de la dedicación» en la que Juan muestra a Jesús andando en el pórtico de Salomón."
    - "Los hermanos de Judas convirtieron la revuelta en un estado: Jonatán fue sumo sacerdote en el 152 a. C., Simón obtuvo la libertad del tributo en el 142, y el pueblo lo hizo sumo sacerdote hereditario y gobernante. Juan Hircano (134–104 a. C.) conquistó Idumea y Samaria y arrasó el templo del Gerizim; Aristóbulo I tomó el título de rey; Alejandro Janeo (103–76) llevó las fronteras hasta la costa y al otro lado del Jordán, casi hasta el tamaño del reino de David; su viuda Salomé Alejandra reinó hasta el 67. Su palacio se alzaba en la Ciudad Alta de Jerusalén, sobre el Templo, y construyeron palacios de invierno con estanques y jardines en Jericó, excavados desde los años 1970. Las visiones de Daniel sobre el cuerno pequeño y sobre las fuerzas que «contaminarán el santuario de fortaleza» se leyeron en estos años, con la promesa de que «el pueblo que conoce á su Dios, se esforzará, y hará»."
    - "La dinastía terminó en guerra civil. Los hijos de Salomé, Hircano II y Aristóbulo II, apelaron ambos a Pompeyo, que tomó Jerusalén en el 63 a. C. y entró en el Lugar Santísimo; Roma mantuvo a Hircano como sumo sacerdote y etnarca, y el último rey asmoneo, Antígono, reinó con ayuda de los partos del 40 al 37 a. C. hasta que Herodes, cuya mujer Mariamne era una princesa asmonea, tomó la ciudad con legiones romanas. Los libros de los Macabeos, que cuentan la primera parte de la historia, están en las Biblias griega y eslava, pero no en el canon hebreo."
  pt:
    - "De Jerusalém, onde está o ponto do mapa. A família vinha de Modin, uma aldeia no sopé dos montes a noroeste da cidade, onde em 167 a.C. o sacerdote Matatias recusou sacrificar aos deuses de Antíoco IV e iniciou a revolta; seu filho Judas Macabeu tomou Jerusalém e purificou o Templo em dezembro de 164 a.C., fato lembrado no Hanucá, a “Festa da Dedicação” em que João mostra Jesus caminhando no pórtico de Salomão."
    - "Os irmãos de Judas fizeram da revolta um Estado: Jônatas tornou-se sumo sacerdote em 152 a.C., Simão obteve a liberdade do tributo em 142, e o povo o fez sumo sacerdote hereditário e governante. João Hircano (134–104 a.C.) conquistou a Iduméia e Samaria e arrasou o templo do Gerizim; Aristóbulo I tomou o título de rei; Alexandre Janeu (103–76) levou as fronteiras até a costa e além do Jordão, quase ao tamanho do reino de Davi; sua viúva Salomé Alexandra reinou até 67. Seu palácio ficava na Cidade Alta de Jerusalém, acima do Templo, e construíram palácios de inverno com tanques e jardins em Jericó, escavados desde os anos 1970. As visões de Daniel sobre o pequeno chifre e sobre as forças que “profanarão o santuário, a própria fortaleza” foram lidas nesses anos, com a promessa de que “o povo que conhece o seu Deus será forte e tomará medidas”."
    - "A dinastia terminou em guerra civil. Os filhos de Salomé, Hircano II e Aristóbulo II, apelaram ambos a Pompeu, que tomou Jerusalém em 63 a.C. e entrou no Santo dos Santos; Roma manteve Hircano como sumo sacerdote e etnarca, e o último rei hasmoneu, Antígono, reinou com ajuda dos partas de 40 a 37 a.C., até que Herodes, cuja mulher Mariamne era princesa hasmoneia, tomou a cidade com legiões romanas. Os livros dos Macabeus, que contam a primeira parte da história, estão nas Bíblias grega e eslava, mas não no cânon hebraico."
  de:
    - "Von Jerusalem, wo der Kartenpunkt steht. Die Familie stammte aus Modein, einem Dorf im Vorland nordwestlich der Stadt, wo der Priester Mattatias 167 v. Chr. sich weigerte, den Göttern des Antiochos IV. zu opfern, und den Aufstand begann; sein Sohn Judas Makkabäus nahm Jerusalem ein und reinigte den Tempel im Dezember 164 v. Chr., was als Chanukka begangen wird, die „Kirchweihe“, bei der Johannes Jesus in der Halle Salomos wandeln lässt."
    - "Judas' Brüder machten aus dem Aufstand einen Staat: Jonathan wurde 152 v. Chr. Hoherpriester, Simon errang 142 die Freiheit vom Tribut, und das Volk machte ihn zum erblichen Hohenpriester und Herrscher. Johannes Hyrkanos (134–104 v. Chr.) eroberte Idumäa und Samaria und schleifte den Garizim-Tempel; Aristobul I. nahm den Königstitel an; Alexander Jannäus (103–76) schob die Grenzen zur Küste und über den Jordan, fast auf Davids Reichsgröße; seine Witwe Salome Alexandra regierte bis 67. Ihr Palast stand in der Oberstadt Jerusalems über dem Tempel, und sie bauten Winterpaläste mit Becken und Gärten in Jericho, ausgegraben seit den 1970ern. Daniels Visionen vom kleinen Horn und von den Heeren, die „das Heiligtum in der Feste entweihen“ würden, las man in diesen Jahren, mit der Verheißung: „die vom Volk, so ihren Gott kennen, werden sich ermannen und es ausrichten“."
    - "Die Dynastie endete im Bürgerkrieg. Salomes Söhne Hyrkanos II. und Aristobul II. riefen beide Pompeius an, der 63 v. Chr. Jerusalem nahm und das Allerheiligste betrat; Rom behielt Hyrkanos als Hohenpriester und Ethnarchen, und der letzte hasmonäische König, Antigonos, regierte mit parthischer Hilfe von 40 bis 37 v. Chr., bis Herodes, dessen Frau Mariamne eine hasmonäische Prinzessin war, die Stadt mit römischen Legionen nahm. Die Makkabäerbücher, die den ersten Teil der Geschichte erzählen, stehen in der griechischen und slawischen Bibel, nicht im hebräischen Kanon."
  fr:
    - "De Jérusalem, où se trouve le point de la carte. La famille venait de Modin, village des contreforts au nord-ouest de la ville, où en 167 av. J.-C. le prêtre Mattathias refusa de sacrifier aux dieux d’Antiochus IV et commença la révolte ; son fils Judas Maccabée prit Jérusalem et purifia le Temple en décembre 164 av. J.-C., événement conservé comme Hanoucca, « la fête de la Dédicace » où Jean montre Jésus se promenant sous le portique de Salomon."
    - "Les frères de Judas firent de la révolte un État : Jonathan devint grand prêtre en 152 av. J.-C., Simon obtint en 142 l’affranchissement du tribut, et le peuple le fit grand prêtre héréditaire et chef. Jean Hyrcan (134–104 av. J.-C.) conquit l’Idumée et la Samarie et rasa le temple du Garizim ; Aristobule Ier prit le titre de roi ; Alexandre Jannée (103–76) porta les frontières à la côte et au-delà du Jourdain, presque celles du royaume de David ; sa veuve Salomé Alexandra régna jusqu’en 67. Leur palais était dans la ville haute de Jérusalem, au-dessus du Temple, et ils bâtirent à Jéricho des palais d’hiver à bassins et jardins, fouillés depuis les années 1970. Les visions de Daniel, sur la petite corne et les troupes qui « profaneront le sanctuaire, la forteresse » furent lues alors, avec la promesse que « ceux du peuple qui connaîtront leur Dieu agiront avec fermeté »."
    - "La dynastie finit en guerre civile. Les fils de Salomé, Hyrcan II et Aristobule II, en appelèrent tous deux à Pompée, qui prit Jérusalem en 63 av. J.-C. et entra dans le Saint des saints ; Rome garda Hyrcan comme grand prêtre et ethnarque, et le dernier roi hasmonéen, Antigone, régna avec l’aide des Parthes de 40 à 37 av. J.-C. jusqu’à ce qu’Hérode, dont l’épouse Mariamne était princesse hasmonéenne, prenne la ville avec des légions romaines. Les livres des Maccabées, qui racontent la première partie de l’histoire, figurent dans les Bibles grecque et slavonne, mais non dans le canon hébreu."
  pl:
    - "Z Jerozolimy, gdzie stoi punkt na mapie. Rodzina pochodziła z Modin, wsi u podnóża gór na północny zachód od miasta, gdzie w 167 p.n.e. kapłan Mattatiasz odmówił złożenia ofiary bogom Antiocha IV i rozpoczął powstanie; jego syn Juda Machabeusz zdobył Jerozolimę i oczyścił Świątynię w grudniu 164 p.n.e., co obchodzi się jako Chanukę, „poświęcanie kościoła”, podczas którego Jan ukazuje Jezusa przechadzającego się w przysionku Salomona."
    - "Bracia Judy zamienili powstanie w państwo: Jonatan został arcykapłanem w 152 p.n.e., Szymon wywalczył wolność od daniny w 142, a lud uczynił go dziedzicznym arcykapłanem i władcą. Jan Hirkan (134–104 p.n.e.) podbił Idumeę i Samarię i zrównał z ziemią świątynię na Garizim; Arystobul I przyjął tytuł króla; Aleksander Janneusz (103–76) rozszerzył granice do wybrzeża i za Jordan, prawie do rozmiarów królestwa Dawida; jego wdowa Salome Aleksandra rządziła do 67. Ich pałac stał w Górnym Mieście w Jerozolimie nad Świątynią, a zimowe pałace z basenami i ogrodami zbudowali w Jerychu, wykopywane od lat 70. Wizje Daniela o małym rogu i o wojskach, które „splugawią świątnicę, i twierdze zniosą”, odczytywano w tych latach, wraz z obietnicą, że lud znający swego Boga okaże się mocny i dokona wielkich czynów."
    - "Dynastia zakończyła się wojną domową. Synowie Salome, Hirkan II i Arystobul II, odwołali się obaj do Pompejusza, który zdobył Jerozolimę w 63 p.n.e. i wszedł do Miejsca Najświętszego; Rzym zostawił Hirkana jako arcykapłana i etnarchę, a ostatni król hasmonejski, Antygon, rządził z pomocą Partów od 40 do 37 p.n.e., aż Herod, którego żona Mariamne była księżniczką hasmonejską, zdobył miasto z rzymskimi legionami. Księgi Machabejskie, które opowiadają pierwszą część tej historii, są w Biblii greckiej i słowiańskiej, ale nie w kanonie hebrajskim."
  it:
    - "Da Gerusalemme, dove si trova il punto della mappa. La famiglia veniva da Modin, un villaggio ai piedi delle colline a nord-ovest della città, dove nel 167 a.C. il sacerdote Mattatia rifiutò di sacrificare agli dèi di Antioco IV e diede inizio alla rivolta; suo figlio Giuda Maccabeo prese Gerusalemme e purificò il Tempio nel dicembre del 164 a.C., evento ricordato come Hanukkah, «la festa della Dedicazione» in cui Giovanni mostra Gesù che passeggia nel portico di Salomone."
    - "I fratelli di Giuda trasformarono la rivolta in uno Stato: Gionata divenne sommo sacerdote nel 152 a.C., Simone ottenne la libertà dal tributo nel 142, e il popolo lo fece sommo sacerdote ereditario e capo. Giovanni Ircano (134–104 a.C.) conquistò l’Idumea e la Samaria e rase al suolo il tempio sul Garizim; Aristobulo I prese il titolo di re; Alessandro Ianneo (103–76) portò i confini alla costa e oltre il Giordano, quasi quanto il regno di Davide; la vedova Salome Alessandra regnò fino al 67. Il loro palazzo stava nella Città Alta sopra il Tempio, e a Gerico costruirono palazzi invernali con piscine e giardini, scavati dagli anni 1970. Le visioni di Daniele sul piccolo corno e sulle forze che «profaneranno il santuario, la fortezza» furono lette in questi anni, con la promessa che «il popolo di quelli che conoscono il loro Dio mostrerà fermezza, e agirà»."
    - "La dinastia finì in una guerra civile. I figli di Salome, Ircano II e Aristobulo II, si appellarono entrambi a Pompeo, che prese Gerusalemme nel 63 a.C. ed entrò nel Santo dei Santi; Roma tenne Ircano come sommo sacerdote ed etnarca, e l’ultimo re asmoneo, Antigono, regnò con l’aiuto dei Parti dal 40 al 37 a.C. finché Erode, la cui moglie Mariamme era una principessa asmonea, prese la città con le legioni romane. I libri dei Maccabei, che raccontano la prima parte della storia, sono nelle Bibbie greca e slava ma non nel canone ebraico."
  nl:
    - "Vanuit Jeruzalem, waar het punt op de kaart staat. De familie kwam uit Modein, een dorp in de uitlopers ten noordwesten van de stad, waar de priester Mattathias in 167 v.Chr. weigerde te offeren aan de goden van Antiochus IV en de opstand begon; zijn zoon Judas Makkabeüs nam Jeruzalem in en reinigde de tempel in december 164 v.Chr., de gebeurtenis die als Chanoeka wordt gevierd, “het feest der vernieuwing des tempels” waarop Johannes Jezus laat wandelen in de zuilengang van Salomo."
    - "Judas’ broers maakten de opstand tot staat: Jonatan werd hogepriester in 152 v.Chr., Simon verwierf in 142 vrijheid van schatting, en het volk maakte hem erfelijk hogepriester en heerser. Johannes Hyrcanus (134–104 v.Chr.) veroverde Idumea en Samaria, sloopte de tempel op de Gerizim; Aristobulus I werd koning; Alexander Jannaeus (103–76) bracht de grenzen naar de kust en over de Jordaan, bijna tot de omvang van Davids rijk; zijn weduwe Salome Alexandra regeerde tot 67. Hun paleis stond in de Bovenstad boven de tempel, en zij bouwden winterpaleizen met vijvers en tuinen te Jericho, sinds de jaren 1970 opgegraven. Daniëls visioenen van de kleine hoorn en van de legers die “het heiligdom ontheiligen, en de sterkte” zouden, las men in deze jaren, met de belofte dat “het volk, die hun God kennen, zullen zij grijpen, en zullen het doen”."
    - "De dynastie eindigde in een burgeroorlog. Salome’s zonen Hyrcanus II en Aristobulus II deden beiden een beroep op Pompeius, die Jeruzalem in 63 v.Chr. innam en het Allerheiligste binnenging; Rome liet Hyrcanus hogepriester en etnarch, en de laatste Hasmoneese koning, Antigonus, regeerde met Parthische hulp van 40 tot 37 v.Chr. tot Herodes, wiens vrouw Mariamne een Hasmoneese prinses was, de stad met Romeinse legioenen innam. De boeken van de Makkabeeën, die het eerste deel van het verhaal vertellen, staan in de Griekse en Slavische bijbels maar niet in de Hebreeuwse canon."
  cs:
    - "Z Jeruzaléma, kde stojí bod na mapě. Rod pocházel z Modeínu, vesnice v podhůří severozápadně od města, kde roku 167 př. n. l. kněz Matatiáš odmítl obětovat bohům Antiocha IV. a zahájil povstání; jeho syn Juda Makabejský dobyl Jeruzalém a očistil chrám v prosinci 164 př. n. l., událost připomínaná jako Chanuka, „posvícení“, o němž Jan ukazuje Ježíše, jak se procházel v Šalomounově síňci."
    - "Judovi bratři přeměnili povstání ve stát: Jonatan se stal veleknězem roku 152 př. n. l., Šimon roku 142 vybojoval osvobození od tributu a lid z něj učinil dědičného velekněze a vládce. Jan Hyrkanos (134–104 př. n. l.) dobyl Idumeu a Samaří a srovnal se zemí chrám na Gerizimu; Aristobúlos I. přijal titul krále; Alexandr Jannaios (103–76) posunul hranice k pobřeží a přes Jordán, téměř k rozloze Davidova království; jeho vdova Salome Alexandra vládla do roku 67. Jejich palác stál v Horním městě Jeruzaléma nad chrámem a postavili zimní paláce s bazény a zahradami v Jerichu, zkoumané od 70. let. Danielova vidění malého rohu a vojsk, která „poškvrní svatyně a pevnosti“, se v těch letech četla, s příslibem, že lid, který zná svého Boha, bude silný a bude jednat."
    - "Dynastie skončila občanskou válkou. Salomini synové Hyrkanos II. a Aristobúlos II. se oba obrátili na Pompeia, který roku 63 př. n. l. dobyl Jeruzalém a vstoupil do Nejsvětější svatyně; Řím ponechal Hyrkana veleknězem a etnarchou a poslední hasmonejský král Antigonos vládl s parthskou pomocí od 40 do 37 př. n. l., dokud město s římskými legiemi nedobyl Herodes, jehož žena Mariamna byla hasmonejskou princeznou. Knihy Makabejské, které vyprávějí první část příběhu, jsou v řecké a slovanské Bibli, ale nejsou v hebrejském kánonu."
  sv:
    - "Från Jerusalem, där kartpunkten står. Släkten kom från Modin, en by i förbergen nordväst om staden, där prästen Mattatias 167 f.Kr. vägrade offra till Antiochos IV:s gudar och startade upproret; hans son Judas Mackabaios intog Jerusalem och renade templet i december 164 f.Kr., händelsen som firas som Hanukka, ”tempelinvigningens högtid” då Johannes låter Jesus gå i Salomos pelargång."
    - "Judas bröder gjorde upproret till en stat: Jonatan blev överstepräst 152 f.Kr., Simon vann frihet från tribut 142, och folket gjorde honom till ärftlig överstepräst och härskare. Johannes Hyrkanos (134–104 f.Kr.) erövrade Idumeen och Samaria och jämnade templet på Gerisim med marken; Aristobulos I tog kungatiteln; Alexander Jannaios (103–76) sköt gränserna till kusten och över Jordan, nästan till storleken av Davids rike; hans änka Salome Alexandra regerade till 67. Deras palats stod i Övre staden i Jerusalem ovanför templet, och de byggde vinterpalats med bassänger och trädgårdar i Jeriko, utgrävda sedan 1970-talet. Daniels syner om det lilla hornet och om de härar som skulle ”oskära helgedomens fäste” lästes under dessa år, med löftet att ”de av folket, som känna sin Gud, skola stå fasta och hålla ut”."
    - "Dynastin slutade i inbördeskrig. Salomes söner Hyrkanos II och Aristobulos II vädjade båda till Pompejus, som intog Jerusalem 63 f.Kr. och gick in i det allra heligaste; Rom behöll Hyrkanos som överstepräst och etnark, och den siste hasmoneiske kungen, Antigonos, regerade med partiskt stöd 40–37 f.Kr. tills Herodes, vars hustru Mariamne var en hasmoneisk prinsessa, intog staden med romerska legioner. Mackabeerböckerna, som berättar den första delen av historien, finns i de grekiska och slaviska biblarna men inte i den hebreiska kanon."
  nb:
    - "Fra Jerusalem, der kartpunktet står. Familien kom fra Modin, en landsby i foten av åsene nordvest for byen, der presten Mattatias i 167 f.Kr. nektet å ofre til Antiokhos IV's guder og begynte opprøret; hans sønn Judas Makkabeus inntok Jerusalem og renset tempelet i desember 164 f.Kr., hendelsen som minnes som hanukka, «tempelvielsens fest» der Johannes viser Jesus gå omkring i Salomos søylegang."
    - "Judas' brødre gjorde opprøret til en stat: Jonatan ble øversteprest i 152 f.Kr., Simon vant frihet fra tributt i 142, og folket gjorde ham til arvelig øversteprest og hersker. Johannes Hyrkan (134–104 f.Kr.) erobret Idumea og Samaria og jevnet tempelet på Garisim med jorden; Aristobulos I tok kongetittelen; Aleksander Jannaios (103–76) førte grensene til kysten og over Jordan, nesten til størrelsen på Davids rike; hans enke Salome Alexandra regjerte til 67. Palasset deres sto i Øvre by i Jerusalem over tempelet, og de bygget vinterpalasser med bassenger og hager i Jeriko, utgravd siden 1970-årene. Daniels syner om det lille hornet og om hærene som skulle «vanhellige helligdommen, den faste borg», ble lest i disse årene, sammen med løftet om at «de av folket som kjenner sin Gud, skal stå fast og holde ut»."
    - "Dynastiet endte i borgerkrig. Salomes sønner Hyrkan II og Aristobulos II appellerte begge til Pompeius, som inntok Jerusalem i 63 f.Kr. og gikk inn i Det aller helligste; Roma beholdt Hyrkan som øversteprest og etnark, og den siste hasmoneiske kongen, Antigonos, regjerte med partisk hjelp fra 40 til 37 f.Kr. til Herodes, hvis hustru Mariamme var en hasmoneisk prinsesse, tok byen med romerske legioner. Makkabeerbøkene, som forteller den første delen av historien, står i de greske og slaviske biblene, men ikke i den hebraiske kanon."
  tl:
    - "Mula sa Jerusalem, kung saan nakatayo ang tuldok sa mapa. Ang pamilya ay nagmula sa Modin, isang nayon sa paanan ng mga burol sa hilagang-kanluran ng lungsod, kung saan noong 167 BK ay tumanggi ang saserdoteng si Matatias na maghandog sa mga diyos ni Antioco IV at sinimulan ang paghihimagsik; kinuha ng anak niyang si Judas Macabeo ang Jerusalem at nilinis ang Templo noong Disyembre 164 BK, ang pangyayaring ipinagdiriwang bilang Hanukkah, ang “kapistahan ng pagtatalaga” na kung saan ipinakikita ni Juan na naglalakad si Jesus sa portiko ni Salomon."
    - "Ginawang estado ng mga kapatid ni Judas ang paghihimagsik: mataas na saserdote si Jonathan (152 BK); nakamit ni Simon ang kalayaan sa tributo (142) at ginawa siyang namamanang mataas na saserdote at pinuno. Sinakop ni Juan Hircano (134–104 BK) ang Idumea at Samaria at giniba ang templo sa Gerizim; kinuha ni Aristobulo I ang titulong hari; itinulak ni Alejandro Janeo (103–76) ang hangganan hanggang baybayin at lampas Jordan, halos kasinlaki ng kaharian ni David; naghari ang balo niyang si Salome Alexandra hanggang 67. Palasyo nila: Itaas na Lungsod, sa itaas ng Templo; nagtayo sila ng palasyong pantaglamig na may tangke at hardin sa Jerico, hinukay mula 1970s. Binasa noon ang pangitain ni Daniel tungkol sa maliit na sungay at sa mga pulutong na “lalapastanganin ang santuario…”, at ang pangakong “ang bayan na nakakakilala ng kanilang dios ay magiging matibay…”."
    - "Nagwakas sa digmaang sibil ang dinastiya. Parehong umapela ang mga anak ni Salome na sina Hircano II at Aristobulo II kay Pompeyo, na kumuha sa Jerusalem noong 63 BK at pumasok sa Dakong Kabanal-banalan; pinanatili ng Roma si Hircano bilang mataas na saserdote at etnarka, at ang huling haring Hasmoneo, si Antigono, ay naghari sa tulong ng mga Parto mula 40 hanggang 37 BK hanggang sa kunin ni Herodes, na ang asawang si Mariamne ay prinsesang Hasmoneo, ang lungsod kasama ang mga lehiyong Romano. Ang mga aklat ng Macabeo, na nagsasalaysay ng unang bahagi ng kuwento, ay nasa mga Biblia sa Griyego at Eslabo ngunit wala sa kanon ng Hebreo."
  da:
    - "Fra Jerusalem, hvor kortets punkt står. Familien kom fra Modin, en landsby i forbjergene nordvest for byen, hvor præsten Mattatias i 167 f.Kr. nægtede at ofre til Antiochus IV's guder og begyndte opstanden; hans søn Judas Makkabæus indtog Jerusalem og rensede Templet i december 164 f.Kr., begivenheden, der fejres som Hanukka, »Tempelvielsens Fest«, hvor Johannes viser Jesus gående i Salomons søjlegang."
    - "Judas' brødre gjorde opstanden til en stat: Jonatan blev ypperstepræst i 152 f.Kr., Simon vandt frihed fra tribut i 142, og folket gjorde ham til arvelig ypperstepræst og hersker. Johannes Hyrkan (134–104 f.Kr.) erobrede Idumæa og Samaria og jævnede templet på Garizim; Aristobul I tog kongetitlen; Alexander Jannæus (103–76) skubbede grænserne ud til kysten og over Jordan, næsten til størrelsen af Davids kongerige; hans enke Salome Alexandra regerede til 67. Deres palads lå i Jerusalems Øvreby over Templet, og de byggede vinterpaladser med bassiner og haver i Jeriko, udgravet siden 1970'erne. Daniels syner om det lille horn og om de styrker, der skulle »vanhellige Helligdommen, den faste Borg«, blev læst i disse år, med løftet om, at »de af Folket, som kende deres Gud, skulle staa fast og vise det i Gerning«."
    - "Dynastiet endte i borgerkrig. Salomes sønner Hyrkan II og Aristobul II appellerede begge til Pompeius, som indtog Jerusalem i 63 f.Kr. og gik ind i Det Allerhelligste; Rom beholdt Hyrkan som ypperstepræst og etnark, og den sidste hasmonæiske konge, Antigonos, regerede med partisk hjælp fra 40 til 37 f.Kr., indtil Herodes, hvis hustru Mariamne var en hasmonæisk prinsesse, indtog byen med romerske legioner. Makkabæerbøgerne, som fortæller den første del af historien, findes i de græske og slaviske bibler, men ikke i den hebraiske kanon."
