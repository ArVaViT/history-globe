id: how-far-jerusalem-to-babylon
question:
  en: "How far was Babylon from Jerusalem?"
  ru: "Как далеко был Вавилон от Иерусалима?"
  uk: "Як далеко Вавилон від Єрусалиму?"
  es: "¿A qué distancia estaba Babilonia de Jerusalén?"
  pt: "Qual era a distância de Jerusalém a Babilônia?"
  de: "Wie weit war Babylon von Jerusalem entfernt?"
  fr: "À quelle distance de Jérusalem se trouvait Babylone ?"
  pl: "Jak daleko od Jerozolimy leżał Babilon?"
  it: "Quanto distava Babilonia da Gerusalemme?"
  nl: "Hoe ver was Babylon van Jeruzalem?"
  cs: "Jak daleko byl Babylón od Jeruzaléma?"
  sv: "Hur långt var Babylon från Jerusalem?"
  nb: "Hvor langt var Babylon fra Jerusalem?"
  tl: "Gaano kalayo ang Babilonia mula sa Jerusalem?"
  da: "Hvor langt var Babylon fra Jerusalem?"
answer:
  en:
    - "Babylon lay about 870 km east of Jerusalem in a straight line, about 29 days on foot at 30 km a day; but no road crossed the desert between them, so the exiles and the returning companies went the long way round, north through Syria and then down the Euphrates, and the journey took months."
    - 'The Bible gives one measured journey. Ezra''s company left Babylon on the first day of the first month and reached Jerusalem on the first day of the fifth month: "For upon the first day of the first month began he to go up from Babylon, and on the first day of the fifth month came he to Jerusalem, according to the good hand of his God upon him" — four months, with a stop of three days at the river Ahava on the way. On the usual dating this was the seventh year of Artaxerxes I, about 458 BC.'
    - "The exiles of 597 and of 587 or 586 BC were marched the same way under guard; Jeremiah had told them to build houses and plant gardens in Babylon, for the captivity would last seventy years. Babylon itself stood on the Euphrates beside today's Hillah in Iraq, about 85 km south of Baghdad."
  ru:
    - "Вавилон лежал примерно в 870 км к востоку от Иерусалима по прямой — около 29 дней пешего пути по 30 км в день; но пустыню между ними дорога не пересекала, и переселенцы, и возвращавшиеся шли кружным путём — на север через Сирию и затем вниз по Евфрату, и путь занимал месяцы."
    - "Библия даёт одно измеренное путешествие. Спутники Ездры вышли из Вавилона в первый день первого месяца и пришли в Иерусалим в первый день пятого: «Ибо в первый день первого месяца было начало выхода из Вавилона, и в первый день пятого месяца он пришел в Иерусалим, так как благодеющая рука Бога его была над ним» — четыре месяца, с трёхдневной стоянкой у реки Агавы по дороге. По обычной датировке это седьмой год Артаксеркса I, около 458 г. до н. э."
    - "Переселенцев 597 и 587 или 586 гг. до н. э. вели тем же путём под стражей; Иеремия велел им строить дома и разводить сады в Вавилоне, ибо плен продлится семьдесят лет. Сам Вавилон стоял на Евфрате рядом с нынешней Хиллой в Ираке, примерно в 85 км к югу от Багдада."
  uk:
    - "Вавилон лежав приблизно за 870 км на схід від Єрусалиму по прямій, близько 29 днів пішки за 30 км на день; але жодна дорога не перетинала пустелі між ними, тож вигнанці та загони, що поверталися, йшли довгим обхідним шляхом — на північ через Сирію, а потім униз по Євфрату, і подорож тривала місяці."
    - "Біблія наводить одну виміряну подорож. Загін Ездри вирушив із Вавилона першого дня першого місяця й дійшов до Єрусалиму першого дня п'ятого місяця: «Бо першого дня першого місяця був початок виходу з Вавилону, й першого дня пятого місяця прийшов він у Ерусалим, — бо добродїйна рука Бога його була над ним» — чотири місяці, із триденною зупинкою біля річки Агава в дорозі. За звичною датою це був сьомий рік Артаксеркса I, близько 458 р. до н. е."
    - "Вигнанців 597 р. і 587 чи 586 р. до н. е. гнали тією самою дорогою під охороною; Єремія наказав їм будувати доми й садити сади у Вавилоні, бо неволя триватиме сімдесят років. Сам Вавилон стояв на Євфраті поряд із сучасною Гіллою в Іраку, приблизно за 85 км на південь від Багдада."
  es:
    - "Babilonia estaba a unos 870 km al este de Jerusalén en línea recta, unos 29 días a pie a 30 km diarios; pero ningún camino cruzaba el desierto entre ambas, de modo que los desterrados y las compañías que regresaban daban el largo rodeo, hacia el norte por Siria y luego descendiendo por el Éufrates, y el viaje duraba meses."
    - "La Biblia da un viaje medido. La compañía de Esdras salió de Babilonia el primer día del primer mes y llegó a Jerusalén el primer día del mes quinto: «Porque el día primero del primer mes fué el principio de la partida de Babilonia, y al primero del mes quinto llegó á Jerusalem, según la buena mano de su Dios sobre él», es decir, cuatro meses, con una parada de tres días junto al río Ahava en el camino. Según la datación habitual, esto fue en el año séptimo de Artajerjes I, hacia el 458 a. C."
    - "Los desterrados del 597 y del 587 o 586 a. C. fueron conducidos por el mismo camino bajo custodia; Jeremías les había dicho que edificaran casas y plantaran huertos en Babilonia, pues el cautiverio duraría setenta años. La propia Babilonia se alzaba sobre el Éufrates, junto a la actual Hilla, en Irak, a unos 85 km al sur de Bagdad."
  pt:
    - "Babilônia ficava a cerca de 870 km a leste de Jerusalém em linha reta, uns 29 dias a pé a 30 km por dia; mas nenhuma estrada atravessava o deserto entre as duas, de modo que os exilados e as caravanas de regresso faziam o longo desvio, ao norte pela Síria e depois descendo o Eufrates, e a viagem levava meses."
    - "A Bíblia dá uma única viagem medida. A caravana de Esdras deixou Babilônia no primeiro dia do primeiro mês e chegou a Jerusalém no primeiro dia do quinto mês: “no primeiro dia do primeiro mês ele começou a subir da Babilônia; e no primeiro dia do quinto mês ele chegou a Jerusalém, segundo a boa mão do seu Deus sobre ele” — quatro meses, com uma parada de três dias no rio Aava pelo caminho. Pela datação usual era o sétimo ano de Artaxerxes I, cerca de 458 a.C."
    - "Os exilados de 597 e de 587 ou 586 a.C. foram levados pelo mesmo caminho sob guarda; Jeremias lhes tinha dito que construíssem casas e plantassem hortas na Babilônia, pois o cativeiro duraria setenta anos. A própria Babilônia ficava no Eufrates, junto à Hilla de hoje, no Iraque, a cerca de 85 km ao sul de Bagdá."
  de:
    - "Babylon lag etwa 870 km östlich von Jerusalem in der Luftlinie, bei 30 km am Tag etwa 29 Tage zu Fuß; aber keine Straße durchquerte die Wüste dazwischen, sodass die Verbannten und die heimkehrenden Züge den langen Umweg nahmen, nordwärts durch Syrien und dann den Euphrat hinab, und die Reise dauerte Monate."
    - "Die Bibel gibt eine gemessene Reise. Esras Zug verließ Babylon am ersten Tag des ersten Monats und erreichte Jerusalem am ersten Tag des fünften Monats: „Denn am ersten Tage des ersten Monats ward er Rats, heraufzuziehen von Babel, und am ersten Tage des fünften Monats kam er gen Jerusalem nach der guten Hand Gottes über ihm“ – vier Monate, mit drei Tagen Rast am Fluss Ahawa unterwegs. Nach der üblichen Datierung war das das siebte Jahr des Artaxerxes I., etwa 458 v. Chr."
    - "Die Verbannten von 597 und von 587 oder 586 v. Chr. wurden unter Bewachung denselben Weg getrieben; Jeremia hatte ihnen gesagt, sie sollten in Babylon Häuser bauen und Gärten pflanzen, denn die Gefangenschaft werde siebzig Jahre dauern. Babylon selbst lag am Euphrat neben dem heutigen Hilla im Irak, etwa 85 km südlich von Bagdad."
  fr:
    - "Babylone se trouvait à environ 870 km à l’est de Jérusalem en ligne droite, soit environ 29 jours de marche à 30 km par jour ; mais aucune route ne traversait le désert entre les deux villes, si bien que les exilés et les convois de retour prirent le long détour, au nord par la Syrie puis en descendant l’Euphrate, et le voyage dura des mois."
    - "La Bible donne un seul voyage mesuré. La troupe d’Esdras quitta Babylone le premier jour du premier mois et atteignit Jérusalem le premier jour du cinquième mois : « il était parti de Babylone le premier jour du premier mois, et il arriva à Jérusalem le premier jour du cinquième mois, la bonne main de son Dieu étant sur lui » — quatre mois, avec une halte de trois jours au bord du fleuve d’Ahava. Selon la datation habituelle, c’était la septième année d’Artaxerxès Ier, vers 458 av. J.-C."
    - "Les exilés de 597 et de 587 ou 586 av. J.-C. furent conduits par la même route sous escorte ; Jérémie leur avait dit de bâtir des maisons et de planter des jardins à Babylone, car la captivité durerait soixante-dix ans. Babylone elle-même s’élevait sur l’Euphrate, près de l’actuelle Hilla, en Irak, à environ 85 km au sud de Bagdad."
  pl:
    - "Babilon leżał około 870 km na wschód od Jerozolimy w linii prostej, czyli około 29 dni drogi pieszo przy 30 km dziennie; ale żadna droga nie przecinała pustyni między nimi, więc wygnańcy i wracające grupy szli naokoło, na północ przez Syrię, a potem w dół Eufratu, i podróż trwała miesiące."
    - "Biblia podaje jedną zmierzoną podróż. Grupa Ezdrasza wyruszyła z Babilonu pierwszego dnia pierwszego miesiąca i dotarła do Jerozolimy pierwszego dnia piątego miesiąca: „Albowiem w pierwszy dzień miesiąca pierwszego wyszedł z Babilonu, a dnia pierwszego miesiąca piątego przyszedł do Jeruzalemu według łaskawego wspomożenia Boga swego” — cztery miesiące, z trzydniowym postojem nad rzeką Ahawa w drodze. Według zwykłego datowania był to siódmy rok Artakserksesa I, około 458 p.n.e."
    - "Wygnańcy z 597 i z 587 lub 586 p.n.e. szli tą samą drogą pod strażą; Jeremiasz kazał im budować domy i sadzić ogrody w Babilonie, bo niewola potrwa siedemdziesiąt lat. Sam Babilon stał nad Eufratem obok dzisiejszej Hilli w Iraku, około 85 km na południe od Bagdadu."
  it:
    - "Babilonia si trovava a circa 870 km a est di Gerusalemme in linea retta, circa 29 giorni a piedi a 30 km al giorno; ma nessuna strada attraversava il deserto tra le due città, così gli esuli e le compagnie di ritorno fecero il lungo giro, a nord attraverso la Siria e poi giù lungo l’Eufrate, e il viaggio durò mesi."
    - "La Bibbia dà un solo viaggio misurato. La compagnia di Esdra lasciò Babilonia il primo giorno del primo mese e giunse a Gerusalemme il primo giorno del quinto mese: «avea fissata la partenza da Babilonia per il primo giorno del primo mese, e arrivò a Gerusalemme il primo giorno del quinto mese, assistito dalla benefica mano del suo Dio» — quattro mesi, con una sosta di tre giorni al fiume Aava lungo la via. Secondo la datazione abituale era il settimo anno di Artaserse I, circa il 458 a.C."
    - "Gli esuli del 597 e del 587 o 586 a.C. furono condotti per la stessa strada sotto scorta; Geremia aveva detto loro di costruire case e piantare giardini a Babilonia, perché la cattività sarebbe durata settant’anni. La stessa Babilonia sorgeva sull’Eufrate accanto all’odierna Hillah, in Iraq, a circa 85 km a sud di Baghdad."
  nl:
    - "Babylon lag hemelsbreed ongeveer 870 km ten oosten van Jeruzalem, bij 30 km per dag ongeveer 29 dagen te voet; maar er liep geen weg door de woestijn ertussen, dus de ballingen en de terugkerende groepen gingen de lange weg om, naar het noorden door Syrië en vervolgens langs de Eufraat naar beneden, en de reis duurde maanden."
    - "De Bijbel geeft één gemeten reis. Ezra’s groep vertrok uit Babylon op de eerste dag van de eerste maand en bereikte Jeruzalem op de eerste dag van de vijfde maand: “Want op den eersten der eerste maand was het begin des optochts uit Babel, en op den eersten der vijfde maand kwam hij te Jeruzalem, naar de goede hand zijns Gods over hem” — vier maanden, met onderweg een verblijf van drie dagen aan de rivier de Ahava. Volgens de gebruikelijke datering was dit het zevende jaar van Artaxerxes I, omstreeks 458 v.Chr."
    - "De ballingen van 597 en van 587 of 586 v.Chr. werden onder bewaking over dezelfde weg gevoerd; Jeremia had hun gezegd huizen te bouwen en tuinen te planten in Babylon, want de ballingschap zou zeventig jaar duren. Babylon zelf lag aan de Eufraat naast het huidige Hilla in Irak, ongeveer 85 km ten zuiden van Bagdad."
  cs:
    - "Babylón ležel asi 870 km východně od Jeruzaléma vzdušnou čarou, což je asi 29 dní pěšky při 30 km denně; ale mezi nimi nevedla pouští žádná cesta, a proto vyhnanci i vracející se družiny šli dlouhou oklikou, na sever přes Sýrii a pak dolů podél Eufratu, a cesta trvala měsíce."
    - "Bible zaznamenává jednu změřenou cestu. Ezdrášova družina opustila Babylón prvního dne prvního měsíce a do Jeruzaléma dorazila prvního dne pátého měsíce: „Prvního zajisté dne měsíce prvního vyšel z Babylona, a prvního dne měsíce pátého přišel do Jeruzaléma s pomocí Boha svého“ – čtyři měsíce, s třídenní zastávkou u řeky Ahava. Podle obvyklého datování to bylo v sedmém roce Artaxerxa I., asi 458 př. n. l."
    - "Vyhnanci z let 597 a 587 nebo 586 př. n. l. byli pod stráží vedeni toutéž cestou; Jeremjáš jim vzkázal, aby si v Babylóně stavěli domy a sázeli zahrady, neboť zajetí potrvá sedmdesát let. Samotný Babylón stál na Eufratu vedle dnešní Hilly v Iráku, asi 85 km jižně od Bagdádu."
  sv:
    - "Babylon låg omkring 870 km öster om Jerusalem fågelvägen, omkring 29 dagar till fots med 30 km om dagen; men ingen väg gick över öknen mellan dem, så de bortförda och de återvändande skarorna tog den långa omvägen, norrut genom Syrien och sedan ned längs Eufrat, och resan tog månader."
    - "Bibeln anger en uppmätt resa. Esras skara lämnade Babylon första dagen i första månaden och nådde Jerusalem första dagen i femte månaden: ”Ty på första dagen i första månaden blev det bestämt att man skulle draga upp från Babel; och på första dagen i femte månaden kom han till Jerusalem, eftersom Guds goda hand var över honom” — fyra månader, med ett uppehåll på tre dagar vid floden Ahava på vägen. Enligt den vanliga dateringen var detta Artaxerxes I:s sjunde år, omkring 458 f.Kr."
    - "De bortförda år 597 och år 587 eller 586 f.Kr. fördes samma väg under bevakning; Jeremia hade sagt åt dem att bygga hus och plantera trädgårdar i Babylon, ty fångenskapen skulle vara i sjuttio år. Själva Babylon låg vid Eufrat intill dagens Hillah i Irak, omkring 85 km söder om Bagdad."
  nb:
    - "Babylon lå omtrent 870 km øst for Jerusalem i luftlinje, omtrent 29 dager til fots med 30 km om dagen; men ingen vei krysset ørkenen mellom dem, så de bortførte og de hjemvendende følgene gikk den lange veien rundt, nordover gjennom Syria og så ned langs Eufrat, og reisen tok måneder."
    - "Bibelen gir én målt reise. Esras følge forlot Babylon på den første dagen i den første måneden og nådde Jerusalem på den første dagen i den femte måneden: «For på den første dag i den første måned begynte han å ordne alt til ferden fra Babel, og på den første dag i den femte måned kom han til Jerusalem; for hans Gud holdt sin gode hånd over ham» — fire måneder, med et opphold på tre dager ved elven Ahava underveis. Etter den vanlige dateringen var dette Artaxerxes Is syvende år, omtrent 458 f.Kr."
    - "De bortførte fra 597 og fra 587 eller 586 f.Kr. ble marsjert samme vei under bevoktning; Jeremia hadde sagt til dem at de skulle bygge hus og plante hager i Babylon, for fangenskapet ville vare i sytti år. Selve Babylon lå ved Eufrat ved dagens Hilla i Irak, omtrent 85 km sør for Bagdad."
  tl:
    - "Ang Babilonia ay nasa mga 870 km sa silangan ng Jerusalem sa tuwid na guhit, mga 29 na araw na lakad sa 30 km kada araw; ngunit walang daang tumatawid sa disyerto sa pagitan nila, kaya ang mga ipinatapon at ang mga bumabalik na pangkat ay dumaan sa mahabang paikot, hilaga sa Siria at pagkatapos ay pababa sa Eufrates, at inabot ng mga buwan ang paglalakbay."
    - "Nagbibigay ang Biblia ng isang nasukat na paglalakbay. Ang pangkat ni Ezra ay umalis sa Babilonia sa unang araw ng unang buwan at dumating sa Jerusalem sa unang araw ng ikalimang buwan: “Sapagka't sa unang araw ng unang buwan ay nagpasimula siyang umahon mula sa Babilonia, at sa unang araw ng ikalimang buwan ay dumating siya sa Jerusalem, ayon sa mabuting kamay ng kaniyang Dios na sumasa kaniya” — apat na buwan, na may tigil na tatlong araw sa ilog ng Ahava sa daan. Ayon sa karaniwang pagtatakda ng petsa, ito ang ikapitong taon ni Artajerjes I, mga 458 BK."
    - "Ang mga ipinatapon noong 597 at noong 587 o 586 BK ay pinalakad sa parehong daan sa ilalim ng bantay; sinabihan sila ni Jeremias na magtayo ng mga bahay at magtanim ng mga halamanan sa Babilonia, sapagkat tatagal ang pagkabihag ng pitumpung taon. Ang Babilonia mismo ay nakatayo sa Eufrates sa tabi ng Hillah ngayon sa Iraq, mga 85 km sa timog ng Baghdad."
  da:
    - "Babylon lå omkring 870 km øst for Jerusalem i luftlinje, omkring 29 dage til fods med 30 km om dagen; men ingen vej krydsede ørkenen imellem dem, så de bortførte og de hjemvendende følger gik den lange omvej, nordpå gennem Syrien og derefter ned langs Eufrat, og rejsen tog måneder."
    - "Bibelen giver én målt rejse. Ezras følge forlod Babylon på den første dag i den første måned og nåede Jerusalem på den første dag i den femte måned: »Thi paa den første Dag i den første Maaned besluttede han at drage op fra Babel, og paa den første Dag i den femte Maaned kom han til Jerusalem, efterdi hans Guds gode Haand var over ham« – fire måneder, med et ophold på tre dage ved floden Ahava undervejs. Efter den sædvanlige datering var dette Artaxerxes I's syvende år, omkring 458 f.Kr."
    - "De bortførte fra 597 og fra 587 eller 586 f.Kr. blev marcheret samme vej under bevogtning; Jeremias havde sagt til dem, at de skulle bygge huse og plante haver i Babylon, for fangenskabet ville vare halvfjerds år. Selve Babylon lå ved Eufrat ved siden af nutidens Hillah i Irak, omkring 85 km syd for Bagdad."
