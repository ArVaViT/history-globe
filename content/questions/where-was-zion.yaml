id: where-was-zion
question:
  en: "Where was Zion?"
  ru: "Где находился Сион?"
  uk: "Де був Сіон?"
  es: "¿Dónde estaba Sion?"
  pt: "Onde ficava Sião?"
  de: "Wo lag Zion?"
  fr: "Où se trouvait Sion ?"
answer:
  en:
    - "Zion was first the Jebusite stronghold on the narrow eastern ridge of Jerusalem, above the Gihon spring, which David took and renamed the City of David; then the name passed to the Temple hill just north of it, and in the Psalms and the prophets to the whole city. The hill called Mount Zion today is a third place, the higher western hill outside the Zion Gate of the Old City, which took the name only in the Christian era. In a straight line the three lie close: the map's point for the City of David is about 0.5 km south of Mount Moriah and 0.7 km east of today's Mount Zion. History Globe's articles on Zion and Mount Zion follow the name in full; this answer gives the short version."
    - "The Bible starts with the ridge: “David took the strong hold of Zion: the same is the city of David.” When Solomon brought the ark up “out of the city of David, which is Zion” to the new Temple, the name went up with it, and the Temple hill became the holy mountain: “Yet have I set my king upon my holy hill of Zion”; “For the LORD hath chosen Zion; he hath desired it for his habitation.” The prophets use it for Jerusalem and its people — “out of Zion shall go forth the law” — and the exiles in Babylon “wept, when we remembered Zion”. In Hebrews it is lifted off the map altogether: “ye are come unto mount Sion, and unto the city of the living God, the heavenly Jerusalem”."
    - "How the name reached the western hill is not recorded exactly. Josephus, after AD 70, took that hill for David's citadel; by the fourth century Christian pilgrims climbed it as Sion and were shown David's palace there, and the church of Holy Sion later stood on it. The meaning of the word itself is uncertain, perhaps “fortress” or “dry place”, and it is probably older than Israel. The map's point labelled Zion stands with Jerusalem's."
  ru:
    - "Сионом сначала называлась крепость иевусеев на узком восточном хребте Иерусалима над источником Гион, которую Давид взял и назвал Городом Давидовым; потом имя перешло на храмовый холм чуть севернее, а в псалмах и у пророков — на весь город. Холм, который сегодня зовётся горой Сион, — третье место: более высокий западный холм за Сионскими воротами Старого города, получивший это имя лишь в христианскую эпоху. По прямой все три близко: точка карты для Города Давидова лежит примерно в 0,5 км к югу от горы Мориа и в 0,7 км к востоку от нынешней горы Сион. Статьи History Globe о Сионе и горе Сион прослеживают имя полностью; здесь — краткий ответ."
    - "Библия начинает с хребта: «Но Давид взял крепость Сион: это — город Давидов». Когда Соломон перенёс ковчег «из города Давидова, то есть Сиона» в новый Храм, имя поднялось вместе с ним, и храмовый холм стал святой горой: «Я помазал Царя Моего над Сионом, святою горою Моею»; «Ибо избрал Господь Сион, возжелал его в жилище Себе». Пророки называют так Иерусалим и его народ — «от Сиона выйдет закон», — а пленники в Вавилоне «плакали, когда вспоминали о Сионе». В Послании к Евреям имя совсем отрывается от карты: «вы приступили к горе Сиону и ко граду Бога живого, и к небесному Иерусалиму»."
    - "Как имя перешло на западный холм, точно не записано. Иосиф Флавий после 70 г. н. э. принимал этот холм за крепость Давида; к IV веку христианские паломники поднимались на него как на Сион, и им показывали там дворец Давида, а позднее на нём стояла церковь Святого Сиона. Значение самого слова неясно — возможно, «крепость» или «сухое место», — и оно, вероятно, старше Израиля. Точка карты с именем Сион стоит вместе с точкой Иерусалима."
  uk:
    - "Сіон був спершу євусейською твердинею на вузькому східному пасмі Єрусалима, над джерелом Гіхон, яку Давид узяв і перейменував на Місто Давида; потім назва перейшла на храмовий пагорб одразу на північ від неї, а в Псалмах і пророків — на ціле місто. Пагорб, який нині називають горою Сіон, — це третє місце, вищий західний пагорб за Сіонською брамою Старого міста, який отримав цю назву лише в християнську добу. По прямій ці три місця близько: точка Міста Давида на мапі лежить приблизно за 0,5 км на південь від гори Морія і за 0,7 км на схід від нинішньої гори Сіон. Статті «Історичного глобуса» про Сіон і гору Сіон простежують назву повністю; ця відповідь дає коротку версію."
    - "Біблія починає з пасма: «Давид же зайняв приступом замок Сион, — се Давидове місто». Коли Соломон вивів ковчег «з Давидового города, се є з Сиону» до нового Храму, назва піднялася разом із ним, і храмовий пагорб став святою горою: «Се ж я помазав царя мого над Сионом, сьвятою горою моєю»; «Бо Господь вибрав собі Сиона, бажав його собі за оселю». Пророки вживають її для Єрусалима та його народу — «з Сиону вийде закон», — а вигнанці у Вавилоні «сидїли ми і плакали, як Сиона спогадали». У Посланні до євреїв вона взагалі знімається з мапи: «приступили ви до Сионської гори і до города Бога живого, Єрусалима небесного»."
    - "Як назва дійшла до західного пагорба, точно не записано. Йосиф Флавій після 70 р. н. е. вважав цей пагорб цитаделлю Давида; до IV ст. християнські паломники піднімалися на нього як на Сіон і їм показували там палац Давида, а церква Святого Сіону пізніше стояла на ньому. Значення самого слова невпевнене, можливо, «твердиня» або «суха місцина», і воно, ймовірно, давніше за Ізраїль. Точка на мапі з написом Сіон збігається з точкою Єрусалима."
  es:
    - "Sion fue primero la fortaleza jebusea en la estrecha loma oriental de Jerusalén, sobre la fuente de Gihón, que David tomó y rebautizó Ciudad de David; luego el nombre pasó a la colina del Templo, justo al norte, y en los Salmos y los profetas a toda la ciudad. La colina que hoy se llama monte Sion es un tercer lugar, la colina occidental, más alta, fuera de la puerta de Sion de la Ciudad Vieja, que tomó el nombre solo en la era cristiana. En línea recta, los tres quedan próximos: el punto del mapa para la Ciudad de David está a unos 0,5 km al sur del monte Moria y a 0,7 km al este del actual monte Sion. Los artículos de History Globe sobre Sion y el monte Sion siguen el nombre por extenso; esta respuesta da la versión breve."
    - "La Biblia empieza con la loma: «David tomó la fortaleza de Sión, la cual es la ciudad de David». Cuando Salomón subió el arca «de la ciudad de David, que es Sión» al nuevo Templo, el nombre subió con ella, y la colina del Templo pasó a ser el monte santo: «Yo empero he puesto mi rey sobre Sión, monte de mi santidad»; «Porque Jehová ha elegido á Sión; deseóla por habitación para sí». Los profetas lo usan para Jerusalén y su pueblo, «de Sión saldrá la ley», y los desterrados en Babilonia «aun llorábamos, acordándonos de Sión». En Hebreos se la saca del mapa por completo: «os habéis llegado al monte de Sión, y á la ciudad del Dios vivo, Jerusalem la celestial»."
    - "Cómo llegó el nombre a la colina occidental no consta con exactitud. Josefo, después del 70 d. C., tomó esa colina por la ciudadela de David; en el siglo IV los peregrinos cristianos la subían como Sion y les mostraban allí el palacio de David, y más tarde se alzó en ella la iglesia de Santa Sion. El significado de la propia palabra es incierto, quizá «fortaleza» o «lugar seco», y probablemente es más antigua que Israel. El punto del mapa rotulado Sion está con el de Jerusalén."
  pt:
    - "Sião foi primeiro a fortaleza jebuseia na estreita crista oriental de Jerusalém, acima da fonte de Giom, que Davi tomou e rebatizou Cidade de Davi; depois o nome passou à colina do Templo, logo ao norte, e nos Salmos e nos profetas a toda a cidade. A colina chamada hoje monte Sião é um terceiro lugar, a colina ocidental, mais alta, fora da Porta de Sião da Cidade Velha, que só tomou o nome na era cristã. Em linha reta os três ficam próximos: o ponto do mapa para a Cidade de Davi está a cerca de 0,5 km ao sul do monte Moriá e 0,7 km a leste do atual monte Sião. Os artigos do History Globe sobre Sião e o monte Sião seguem o nome por inteiro; esta resposta dá a versão curta."
    - "A Bíblia começa pela crista: “Davi tomou a fortaleza de Sião. Esta é a cidade de Davi.” Quando Salomão trouxe a arca “da cidade de Davi, que é Sião” para o novo Templo, o nome subiu com ela, e a colina do Templo tornou-se o monte santo: “eu estabeleci o meu Rei no meu santo monte de Sião”; “Pois o SENHOR escolheu Sião. Ele a desejou para sua habitação.” Os profetas a usam para Jerusalém e seu povo — “a lei sairá de Sião” — e os exilados na Babilônia “choramos, quando nos lembramos de Sião”. Em Hebreus ela é erguida para fora do mapa: “vocês chegaram ao monte Sião e à cidade do Deus vivo, a Jerusalém celestial”."
    - "Como o nome chegou à colina ocidental não está registrado com exatidão. Josefo, depois de 70 d.C., tomou essa colina pela cidadela de Davi; no século IV os peregrinos cristãos subiam a ela como Sião e lhes mostravam o palácio de Davi, e a igreja da Santa Sião se ergueu depois sobre ela. O significado da própria palavra é incerto, talvez “fortaleza” ou “lugar seco”, e provavelmente é mais antigo do que Israel. O ponto do mapa rotulado Sião fica junto ao de Jerusalém."
  de:
    - "Zion war zuerst die jebusitische Bergfeste auf dem schmalen östlichen Höhenrücken Jerusalems, über der Gihon-Quelle, die David einnahm und in Stadt Davids umbenannte; dann ging der Name auf den Tempelhügel unmittelbar nördlich davon über, und in den Psalmen und bei den Propheten auf die ganze Stadt. Der Hügel, der heute Berg Zion heißt, ist ein dritter Ort, der höhere Westhügel vor dem Zionstor der Altstadt, der den Namen erst in christlicher Zeit erhielt. In der Luftlinie liegen die drei nah beieinander: Der Kartenpunkt der Stadt Davids ist etwa 0,5 km südlich des Bergs Morija und 0,7 km östlich des heutigen Bergs Zion. Die Artikel von History Globe über Zion und den Berg Zion verfolgen den Namen ausführlich; diese Antwort gibt die Kurzfassung."
    - "Die Bibel beginnt mit dem Höhenrücken: „David aber gewann die Burg Zion, das ist Davids Stadt.“ Als Salomo die Lade „aus der Stadt Davids, das ist Zion“ zum neuen Tempel hinaufbrachte, ging der Name mit hinauf, und der Tempelhügel wurde der heilige Berg: „Aber ich habe meinen König eingesetzt auf meinem heiligen Berg Zion“; „Denn der HERR hat Zion erwählt und hat Lust, daselbst zu wohnen.“ Die Propheten gebrauchen ihn für Jerusalem und sein Volk – „Denn von Zion wird das Gesetz ausgehen“ – und die Verbannten in Babylon „weinten, wenn wir an Zion gedachten“. Im Hebräerbrief wird er ganz von der Karte gehoben: „ihr seid gekommen zu dem Berge Zion und zu der Stadt des lebendigen Gottes, dem himmlischen Jerusalem“."
    - "Wie der Name auf den Westhügel kam, ist nicht genau überliefert. Josephus hielt nach 70 n. Chr. diesen Hügel für Davids Burg; im 4. Jahrhundert bestiegen christliche Pilger ihn als Sion und bekamen dort Davids Palast gezeigt, und später stand die Kirche Hagia Sion darauf. Die Bedeutung des Wortes selbst ist unsicher, vielleicht „Festung“ oder „trockener Ort“, und es ist wohl älter als Israel. Der mit Zion beschriftete Kartenpunkt steht bei dem Jerusalems."
  fr:
    - "Sion fut d’abord la forteresse jébusienne sur l’étroite crête orientale de Jérusalem, au-dessus de la source de Guihon, que David prit et rebaptisa Cité de David ; puis le nom passa à la colline du Temple, juste au nord, et, dans les Psaumes et les prophètes, à la ville entière. La colline appelée aujourd’hui mont Sion est un troisième lieu, la colline occidentale plus haute, hors de la porte de Sion de la vieille ville, qui n’a pris le nom qu’à l’ère chrétienne. À vol d’oiseau, les trois sont proches : le point de la carte pour la Cité de David est à environ 0,5 km au sud du mont Morija et à 0,7 km à l’est de l’actuel mont Sion. Les articles de History Globe sur Sion et le mont Sion suivent le nom en détail ; cette réponse en donne la version courte."
    - "La Bible commence par la crête : « David s’empara de la forteresse de Sion : c’est la cité de David. » Quand Salomon fit monter l’arche « de la cité de David, qui est Sion » vers le nouveau Temple, le nom monta avec elle, et la colline du Temple devint la montagne sainte : « C’est moi qui ai oint mon roi sur Sion, ma montagne sainte ! » ; « Oui, l’Éternel a choisi Sion, il l’a désirée pour sa demeure. » Les prophètes l’emploient pour Jérusalem et son peuple — « de Sion sortira la loi » — et les exilés de Babylone : « Nous étions assis et nous pleurions, en nous souvenant de Sion ». Dans l’épître aux Hébreux, elle est tout à fait détachée de la carte : « vous vous êtes approchés de la montagne de Sion, de la cité du Dieu vivant, la Jérusalem céleste »."
    - "La manière dont le nom atteignit la colline occidentale n’est pas exactement consignée. Flavius Josèphe, après 70 apr. J.-C., tenait cette colline pour la citadelle de David ; au IVe siècle, les pèlerins chrétiens la gravissaient comme Sion et s’y faisaient montrer le palais de David, et l’église de la Sainte-Sion s’y dressa plus tard. Le sens du mot lui-même est incertain, peut-être « forteresse » ou « lieu sec », et il est probablement plus ancien qu’Israël. Le point de la carte étiqueté Sion se trouve avec celui de Jérusalem."
