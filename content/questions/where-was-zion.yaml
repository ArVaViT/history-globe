id: where-was-zion
question:
  en: "Where was Zion?"
  ru: "Где находился Сион?"
  uk: "Де був Сіон?"
  es: "¿Dónde estaba Sion?"
  pt: "Onde ficava Sião?"
  de: "Wo lag Zion?"
  fr: "Où se trouvait Sion ?"
  pl: "Gdzie leżał Syjon?"
  it: "Dov’era Sion?"
  cs: "Kde ležel Sijón?"
  nl: "Waar lag Sion?"
  sv: "Var låg Sion?"
  nb: "Hvor lå Sion?"
  tl: "Nasaan ang Sion?"
  da: "Hvor lå Zion?"
  sr: "Где је био Сион?"
  hu: "Hol volt Sion?"
  fi: "Missä Siion sijaitsi?"
  vi: "Si-ôn ở đâu?"
  ro: "Unde se afla Sionul?"
  bg: "Къде се е намирал Сион?"
answer:
  en:
    - "Zion was first the Jebusite stronghold on the narrow eastern ridge of Jerusalem, above the Gihon spring, which David took and renamed the City of David; then the name passed to the Temple hill just north of it, and in the Psalms and the prophets to the whole city. The hill called Mount Zion today is a third place, the higher western hill outside the Zion Gate of the Old City, which took the name only in the Christian era. In a straight line the three lie close: the map's point for the City of David is about 0.5 km south of Mount Moriah and 0.7 km east of today's Mount Zion. History Globe's articles on Zion and Mount Zion follow the name in full; this answer gives the short version."
    - "The Bible starts with the ridge: “David took the strong hold of Zion: the same is the city of David.” When Solomon brought the ark up “out of the city of David, which is Zion” to the new Temple, the name went up with it, and the Temple hill became the holy mountain: “Yet have I set my king upon my holy hill of Zion”; “For the LORD hath chosen Zion; he hath desired it for his habitation.” The prophets use it for Jerusalem and its people — “out of Zion shall go forth the law” — and the exiles in Babylon “wept, when we remembered Zion”. In Hebrews it is lifted off the map altogether: “ye are come unto mount Sion, and unto the city of the living God, the heavenly Jerusalem”."
    - "How the name reached the western hill is not recorded exactly. Josephus, after AD 70, took that hill for David's citadel; by the fourth century Christian pilgrims climbed it as Sion and were shown David's palace there, and the church of Holy Sion later stood on it. The meaning of the word itself is uncertain, perhaps “fortress” or “dry place”, and it is probably older than Israel. The map's point labelled Zion stands with Jerusalem's."
  ru:
    - "Сионом сначала называлась крепость иевусеев на узком восточном хребте Иерусалима над источником Гион, которую Давид взял и назвал Городом Давидовым; потом имя перешло на храмовый холм чуть севернее, а в псалмах и у пророков — на весь город. Холм, который сегодня зовётся горой Сион, — третье место: более высокий западный холм за Сионскими воротами Старого города, получивший это имя лишь в христианскую эпоху. По прямой все три близко: точка карты для Города Давидова лежит примерно в 0,5 км к югу от горы Мориа и в 0,7 км к востоку от нынешней горы Сион. Статьи History Globe о Сионе и горе Сион прослеживают имя полностью; здесь — краткий ответ."
    - "Библия начинает с хребта: «Но Давид взял крепость Сион: это — город Давидов». Когда Соломон перенёс ковчег «из города Давидова, то есть Сиона» в новый Храм, имя поднялось вместе с ним, и храмовый холм стал святой горой: «Я помазал Царя Моего над Сионом, святою горою Моею»; «Ибо избрал Господь Сион, возжелал его в жилище Себе». Пророки называют так Иерусалим и его народ — «от Сиона выйдет закон», — а пленники в Вавилоне «плакали, когда вспоминали о Сионе». В Послании к Евреям имя совсем отрывается от карты: «вы приступили к горе Сиону и ко граду Бога живого, и к небесному Иерусалиму»."
    - "Как имя перешло на западный холм, точно не записано. Иосиф Флавий после 70 г. н. э. принимал этот холм за крепость Давида; к IV веку христианские паломники поднимались на него как на Сион, и им показывали там дворец Давида, а позднее на нём стояла церковь Святого Сиона. Значение самого слова неясно — возможно, «крепость» или «сухое место», — и оно, вероятно, старше Израиля. Точка карты с именем Сион стоит вместе с точкой Иерусалима."
  uk:
    - "Сіон був спершу євусейською твердинею на вузькому східному пасмі Єрусалима, над джерелом Гіхон, яку Давид узяв і перейменував на Місто Давида; потім назва перейшла на храмовий пагорб одразу на північ від неї, а в Псалмах і пророків — на ціле місто. Пагорб, який нині називають горою Сіон, — це третє місце, вищий західний пагорб за Сіонською брамою Старого міста, який отримав цю назву лише в християнську добу. По прямій ці три місця близько: точка Міста Давида на мапі лежить приблизно за 0,5 км на південь від гори Морія і за 0,7 км на схід від нинішньої гори Сіон. Статті «Історичного глобуса» про Сіон і гору Сіон простежують назву повністю; ця відповідь дає коротку версію."
    - "Біблія починає з пасма: «Давид же зайняв приступом замок Сион, — се Давидове місто». Коли Соломон вивів ковчег «з Давидового города, се є з Сиону» до нового Храму, назва піднялася разом із ним, і храмовий пагорб став святою горою: «Се ж я помазав царя мого над Сионом, сьвятою горою моєю»; «Бо Господь вибрав собі Сиона, бажав його собі за оселю». Пророки вживають її для Єрусалима та його народу — «з Сиону вийде закон», — а вигнанці у Вавилоні «сидїли ми і плакали, як Сиона спогадали». У Посланні до євреїв вона взагалі знімається з мапи: «приступили ви до Сионської гори і до города Бога живого, Єрусалима небесного»."
    - "Як назва дійшла до західного пагорба, точно не записано. Йосиф Флавій після 70 р. н. е. вважав цей пагорб цитаделлю Давида; до IV ст. християнські паломники піднімалися на нього як на Сіон і їм показували там палац Давида, а церква Святого Сіону пізніше стояла на ньому. Значення самого слова невпевнене, можливо, «твердиня» або «суха місцина», і воно, ймовірно, давніше за Ізраїль. Точка на мапі з написом Сіон збігається з точкою Єрусалима."
  es:
    - "Sion fue primero la fortaleza jebusea en la estrecha loma oriental de Jerusalén, sobre la fuente de Gihón, que David tomó y rebautizó Ciudad de David; luego el nombre pasó a la colina del Templo, justo al norte, y en los Salmos y los profetas a toda la ciudad. La colina que hoy se llama monte Sion es un tercer lugar, la colina occidental, más alta, fuera de la puerta de Sion de la Ciudad Vieja, que tomó el nombre solo en la era cristiana. En línea recta, los tres quedan próximos: el punto del mapa para la Ciudad de David está a unos 0,5 km al sur del monte Moria y a 0,7 km al este del actual monte Sion. Los artículos de History Globe sobre Sion y el monte Sion siguen el nombre por extenso; esta respuesta da la versión breve."
    - "La Biblia empieza con la loma: «David tomó la fortaleza de Sión, la cual es la ciudad de David». Cuando Salomón subió el arca «de la ciudad de David, que es Sión» al nuevo Templo, el nombre subió con ella, y la colina del Templo pasó a ser el monte santo: «Yo empero he puesto mi rey sobre Sión, monte de mi santidad»; «Porque Jehová ha elegido á Sión; deseóla por habitación para sí». Los profetas lo usan para Jerusalén y su pueblo, «de Sión saldrá la ley», y los desterrados en Babilonia «aun llorábamos, acordándonos de Sión». En Hebreos se la saca del mapa por completo: «os habéis llegado al monte de Sión, y á la ciudad del Dios vivo, Jerusalem la celestial»."
    - "Cómo llegó el nombre a la colina occidental no consta con exactitud. Josefo, después del 70 d. C., tomó esa colina por la ciudadela de David; en el siglo IV los peregrinos cristianos la subían como Sion y les mostraban allí el palacio de David, y más tarde se alzó en ella la iglesia de Santa Sion. El significado de la propia palabra es incierto, quizá «fortaleza» o «lugar seco», y probablemente es más antigua que Israel. El punto del mapa rotulado Sion está con el de Jerusalén."
  pt:
    - "Sião foi primeiro a fortaleza jebuseia na estreita crista oriental de Jerusalém, acima da fonte de Giom, que Davi tomou e rebatizou Cidade de Davi; depois o nome passou à colina do Templo, logo ao norte, e nos Salmos e nos profetas a toda a cidade. A colina chamada hoje monte Sião é um terceiro lugar, a colina ocidental, mais alta, fora da Porta de Sião da Cidade Velha, que só tomou o nome na era cristã. Em linha reta os três ficam próximos: o ponto do mapa para a Cidade de Davi está a cerca de 0,5 km ao sul do monte Moriá e 0,7 km a leste do atual monte Sião. Os artigos do History Globe sobre Sião e o monte Sião seguem o nome por inteiro; esta resposta dá a versão curta."
    - "A Bíblia começa pela crista: “Davi tomou a fortaleza de Sião. Esta é a cidade de Davi.” Quando Salomão trouxe a arca “da cidade de Davi, que é Sião” para o novo Templo, o nome subiu com ela, e a colina do Templo tornou-se o monte santo: “eu estabeleci o meu Rei no meu santo monte de Sião”; “Pois o SENHOR escolheu Sião. Ele a desejou para sua habitação.” Os profetas a usam para Jerusalém e seu povo — “a lei sairá de Sião” — e os exilados na Babilônia “choramos, quando nos lembramos de Sião”. Em Hebreus ela é erguida para fora do mapa: “vocês chegaram ao monte Sião e à cidade do Deus vivo, a Jerusalém celestial”."
    - "Como o nome chegou à colina ocidental não está registrado com exatidão. Josefo, depois de 70 d.C., tomou essa colina pela cidadela de Davi; no século IV os peregrinos cristãos subiam a ela como Sião e lhes mostravam o palácio de Davi, e a igreja da Santa Sião se ergueu depois sobre ela. O significado da própria palavra é incerto, talvez “fortaleza” ou “lugar seco”, e provavelmente é mais antigo do que Israel. O ponto do mapa rotulado Sião fica junto ao de Jerusalém."
  de:
    - "Zion war zuerst die jebusitische Bergfeste auf dem schmalen östlichen Höhenrücken Jerusalems, über der Gihon-Quelle, die David einnahm und in Stadt Davids umbenannte; dann ging der Name auf den Tempelhügel unmittelbar nördlich davon über, und in den Psalmen und bei den Propheten auf die ganze Stadt. Der Hügel, der heute Berg Zion heißt, ist ein dritter Ort, der höhere Westhügel vor dem Zionstor der Altstadt, der den Namen erst in christlicher Zeit erhielt. In der Luftlinie liegen die drei nah beieinander: Der Kartenpunkt der Stadt Davids ist etwa 0,5 km südlich des Bergs Morija und 0,7 km östlich des heutigen Bergs Zion. Die Artikel von History Globe über Zion und den Berg Zion verfolgen den Namen ausführlich; diese Antwort gibt die Kurzfassung."
    - "Die Bibel beginnt mit dem Höhenrücken: „David aber gewann die Burg Zion, das ist Davids Stadt.“ Als Salomo die Lade „aus der Stadt Davids, das ist Zion“ zum neuen Tempel hinaufbrachte, ging der Name mit hinauf, und der Tempelhügel wurde der heilige Berg: „Aber ich habe meinen König eingesetzt auf meinem heiligen Berg Zion“; „Denn der HERR hat Zion erwählt und hat Lust, daselbst zu wohnen.“ Die Propheten gebrauchen ihn für Jerusalem und sein Volk – „Denn von Zion wird das Gesetz ausgehen“ – und die Verbannten in Babylon „weinten, wenn wir an Zion gedachten“. Im Hebräerbrief wird er ganz von der Karte gehoben: „ihr seid gekommen zu dem Berge Zion und zu der Stadt des lebendigen Gottes, dem himmlischen Jerusalem“."
    - "Wie der Name auf den Westhügel kam, ist nicht genau überliefert. Josephus hielt nach 70 n. Chr. diesen Hügel für Davids Burg; im 4. Jahrhundert bestiegen christliche Pilger ihn als Sion und bekamen dort Davids Palast gezeigt, und später stand die Kirche Hagia Sion darauf. Die Bedeutung des Wortes selbst ist unsicher, vielleicht „Festung“ oder „trockener Ort“, und es ist wohl älter als Israel. Der mit Zion beschriftete Kartenpunkt steht bei dem Jerusalems."
  fr:
    - "Sion fut d’abord la forteresse jébusienne sur l’étroite crête orientale de Jérusalem, au-dessus de la source de Guihon, que David prit et rebaptisa Cité de David ; puis le nom passa à la colline du Temple, juste au nord, et, dans les Psaumes et les prophètes, à la ville entière. La colline appelée aujourd’hui mont Sion est un troisième lieu, la colline occidentale plus haute, hors de la porte de Sion de la vieille ville, qui n’a pris le nom qu’à l’ère chrétienne. À vol d’oiseau, les trois sont proches : le point de la carte pour la Cité de David est à environ 0,5 km au sud du mont Morija et à 0,7 km à l’est de l’actuel mont Sion. Les articles de History Globe sur Sion et le mont Sion suivent le nom en détail ; cette réponse en donne la version courte."
    - "La Bible commence par la crête : « David s’empara de la forteresse de Sion : c’est la cité de David. » Quand Salomon fit monter l’arche « de la cité de David, qui est Sion » vers le nouveau Temple, le nom monta avec elle, et la colline du Temple devint la montagne sainte : « C’est moi qui ai oint mon roi sur Sion, ma montagne sainte ! » ; « Oui, l’Éternel a choisi Sion, il l’a désirée pour sa demeure. » Les prophètes l’emploient pour Jérusalem et son peuple — « de Sion sortira la loi » — et les exilés de Babylone : « Nous étions assis et nous pleurions, en nous souvenant de Sion ». Dans l’épître aux Hébreux, elle est tout à fait détachée de la carte : « vous vous êtes approchés de la montagne de Sion, de la cité du Dieu vivant, la Jérusalem céleste »."
    - "La manière dont le nom atteignit la colline occidentale n’est pas exactement consignée. Flavius Josèphe, après 70 apr. J.-C., tenait cette colline pour la citadelle de David ; au IVe siècle, les pèlerins chrétiens la gravissaient comme Sion et s’y faisaient montrer le palais de David, et l’église de la Sainte-Sion s’y dressa plus tard. Le sens du mot lui-même est incertain, peut-être « forteresse » ou « lieu sec », et il est probablement plus ancien qu’Israël. Le point de la carte étiqueté Sion se trouve avec celui de Jérusalem."
  pl:
    - "Syjon był najpierw jebusyckim grodem na wąskim wschodnim grzbiecie Jerozolimy, nad źródłem Gichon, który Dawid zdobył i przemianował na Miasto Dawida; potem nazwa przeszła na wzgórze Świątyni tuż na północ od niego, a w Psalmach i u proroków na całe miasto. Wzgórze zwane dziś górą Syjon to trzecie miejsce, wyższe zachodnie wzgórze za Bramą Syjońską Starego Miasta, które przyjęło tę nazwę dopiero w epoce chrześcijańskiej. W linii prostej te trzy miejsca leżą blisko: punkt Miasta Dawida na mapie jest około 0,5 km na południe od góry Moria i 0,7 km na wschód od dzisiejszej góry Syjon. Artykuły History Globe o Syjonie i górze Syjon śledzą nazwę w pełni; ta odpowiedź podaje wersję skróconą."
    - "Biblia zaczyna od grzbietu: „Wszakże wziął Dawid zamek Syoński, a toć jest miasto Dawidowe”. Gdy Salomon sprowadził arkę „z miasta Dawidowego, które jest Syon” do nowej Świątyni, nazwa poszła w górę razem z nią, a wzgórze Świątyni stało się górą świętą: „Jamci postanowił króla mojego nad Syonem, górą świętą moją”; „Albowiem obrał Pan Syon, i upodobał go sobie na mieszkanie”. Prorocy używają jej dla Jerozolimy i jej ludu — „z Syonu wyjdzie zakon” — a wygnańcy w Babilonie „tameśmy siadali i płakali, wspominając na Syon”. W Liście do Hebrajczyków zostaje zupełnie uniesiona z mapy: „Aleście przystąpili do góry Syon i do miasta Boga żywego, do Jeruzalemu niebieskiego”."
    - "Jak nazwa dotarła na zachodnie wzgórze, nie jest dokładnie zapisane. Józef Flawiusz, po 70 n.e., uważał to wzgórze za cytadelę Dawida; do IV wieku chrześcijańscy pielgrzymi wspinali się na nie jako na Syjon i pokazywano im tam pałac Dawida, a później stanął na nim kościół Świętego Syjonu. Znaczenie samego słowa jest niepewne, być może „twierdza” albo „suche miejsce”, i nazwa jest prawdopodobnie starsza niż Izrael. Punkt opisany na mapie jako Syjon stoi razem z punktem Jerozolimy."
  it:
    - "Sion fu dapprima la roccaforte gebusea sullo stretto crinale orientale di Gerusalemme, sopra la sorgente di Ghicon, che Davide prese e ribattezzò Città di Davide; poi il nome passò al colle del Tempio subito a nord di essa, e nei Salmi e nei profeti all’intera città. Il colle oggi chiamato Monte Sion è un terzo luogo, il colle occidentale più alto fuori dalla Porta di Sion della Città Vecchia, che prese il nome solo in epoca cristiana. In linea d’aria i tre sono vicini: il punto della mappa per la Città di Davide dista circa 0,5 km a sud del Monte Moria e 0,7 km a est dell’odierno Monte Sion. Gli articoli di History Globe su Sion e sul Monte Sion seguono il nome per intero; questa risposta ne dà la versione breve."
    - "La Bibbia comincia dal crinale: «Davide prese la fortezza di Sion, che è la città di Davide». Quando Salomone portò su l’arca «dalla città di Davide, cioè da Sion» al nuovo Tempio, il nome salì con essa, e il colle del Tempio divenne il monte santo: «io ho stabilito il mio re sopra Sion, monte della mia santità»; «l’Eterno ha scelto Sion, l’ha desiderata per sua dimora». I profeti lo usano per Gerusalemme e il suo popolo — «da Sion uscirà la legge» — e gli esuli a Babilonia dicono: «sedevamo ed anche piangevamo ricordandoci di Sion». Nella Lettera agli Ebrei è sollevato del tutto dalla carta: «voi siete venuti al monte di Sion, e alla città dell’Iddio vivente, che è la Gerusalemme celeste»."
    - "Come il nome sia giunto al colle occidentale non è registrato con esattezza. Giuseppe Flavio, dopo il 70 d.C., considerò quel colle la cittadella di Davide; nel IV secolo i pellegrini cristiani lo salivano come Sion e vi si mostrava il palazzo di Davide, e più tardi vi sorse la chiesa di Santa Sion. Il significato della parola stessa è incerto, forse «fortezza» o «luogo arido», ed è probabilmente più antico di Israele. Il punto della mappa etichettato Sion sta con quello di Gerusalemme."
  cs:
    - "Sijón byl původně jebúsejská pevnost na úzkém východním hřebeni Jeruzaléma nad pramenem Gichón, kterou David dobyl a přejmenoval na Město Davidovo; pak jméno přešlo na chrámový pahorek těsně na sever od ní a v Žalmech a u proroků na celé město. Pahorek dnes zvaný Hora Sijón je třetím místem, vyšším západním pahorkem za Sijónskou bránou Starého města, který jméno přijal až v křesťanské době. Vzdušnou čarou leží ta tři místa blízko: bod Města Davidova na mapě je asi 0,5 km jižně od hory Moria a 0,7 km východně od dnešní Hory Sijón. Články History Globe o Sijónu a Hoře Sijón sledují jméno úplně; tato odpověď podává stručnou verzi."
    - "Bible začíná hřebenem: „A však vzal David hrad Sion, toť jest město Davidovo.“ Když Šalomoun přenesl truhlu „z města Davidova, jenž jest Sion“ do nového chrámu, šlo s ní vzhůru i jméno a chrámový pahorek se stal svatou horou: „Jáť jsem ustanovil krále svého nad Sionem, horou svatou mou“; „Neboť jest vyvolil Hospodin Sion, oblíbil jej sobě za svůj příbytek.“ Proroci je užívají pro Jeruzalém a jeho lid – „z Siona vyjde zákon“ – a vyhnanci v Babylóně „plakávali, rozpomínajíce se na Sion“. V listu Židům je zcela odvedeno z mapy: „přistoupili jste k hoře Sionu, a k městu Boha živého, Jeruzalému nebeskému“."
    - "Jak jméno došlo na západní pahorek, není přesně zaznamenáno. Josephus po roce 70 n. l. pokládal ten pahorek za Davidovu citadelu; ve 4. století na něj křesťanští poutníci vystupovali jako na Sijón a ukazoval se jim tam Davidův palác a později na něm stál kostel Svatého Sijónu. Význam samotného slova je nejistý, snad „pevnost“ nebo „suché místo“, a je pravděpodobně starší než Izrael. Bod na mapě označený Sijón stojí s bodem Jeruzaléma."
  nl:
    - "Sion was eerst de Jebusitische vesting op de smalle oostelijke heuvelrug van Jeruzalem, boven de bron Gihon, die David innam en omdoopte tot Stad van David; daarna ging de naam over op de tempelheuvel net ten noorden daarvan, en in de Psalmen en de profeten op de hele stad. De heuvel die nu berg Sion heet is een derde plaats, de hogere westelijke heuvel buiten de Sionspoort van de Oude Stad, die de naam pas in de christelijke tijd kreeg. Hemelsbreed liggen de drie dicht bij elkaar: het punt op de kaart voor de Stad van David ligt ongeveer 0,5 km ten zuiden van de berg Moria en 0,7 km ten oosten van de huidige berg Sion. De artikelen van History Globe over Sion en de berg Sion volgen de naam uitvoerig; dit antwoord geeft de korte versie."
    - "De Bijbel begint met de heuvelrug: “David nam den burg Sion in; dezelve is de stad Davids.” Toen Salomo de ark opbracht “uit de stad Davids, dewelke is Sion” naar de nieuwe tempel, ging de naam mee omhoog, en de tempelheuvel werd de heilige berg: “Ik toch heb Mijn Koning gezalfd over Sion, den berg Mijner heiligheid”; “Want de HEERE heeft Sion verkoren, Hij heeft het begeerd tot Zijn woonplaats.” De profeten gebruiken het voor Jeruzalem en zijn volk — “uit Sion zal de wet uitgaan” — en de ballingen in Babylon: “ook weenden wij, als wij gedachten aan Sion”. In Hebreeën wordt het helemaal van de kaart getild: “gij zijt gekomen tot den berg Sion, en de stad des levenden Gods, tot het hemelse Jeruzalem”."
    - "Hoe de naam de westelijke heuvel bereikte, is niet precies overgeleverd. Josephus hield die heuvel na 70 n.Chr. voor Davids burcht; in de vierde eeuw beklommen christelijke pelgrims hem als Sion en kregen er Davids paleis te zien, en de kerk van Heilig Sion stond er later op. De betekenis van het woord zelf is onzeker, misschien “vesting” of “droge plaats”, en het is waarschijnlijk ouder dan Israël. Het punt op de kaart met het label Sion staat bij dat van Jeruzalem."
  sv:
    - "Sion var först den jebusitiska fästningen på Jerusalems smala östra ås, ovanför Gihonkällan, som David intog och döpte om till Davids stad; sedan gick namnet över till Tempelkullen strax norr om den, och i Psaltaren och hos profeterna till hela staden. Kullen som i dag kallas Sions berg är en tredje plats, den högre västra kullen utanför Sions port i Gamla staden, som fick namnet först under den kristna tiden. I fågelvägen ligger de tre nära: kartans punkt för Davids stad ligger omkring 0,5 km söder om berget Moria och 0,7 km öster om dagens Sions berg. History Globes artiklar om Sion och Sions berg följer namnet i sin helhet; det här svaret ger den korta versionen."
    - "Bibeln börjar med åsen: ”David intog likväl Sions borg, det är Davids stad.” När Salomo förde arken upp ”från Davids stad, det är Sion” till det nya templet, följde namnet med, och Tempelkullen blev det heliga berget: ”Jag själv har insatt min konung på Sion, mitt heliga berg”; ”Ty HERREN har utvalt Sion, där vill han hava sin boning.” Profeterna använder det för Jerusalem och dess folk — ”från Sion skall lag utgå” — och de landsflyktiga i Babylon satt och ”gräto, när vi tänkte på Sion”. I Hebreerbrevet lyfts det helt av kartan: ”I haven kommit till Sions berg och den levande Gudens stad, det himmelska Jerusalem”."
    - "Hur namnet nådde västra kullen är inte exakt nedtecknat. Josefus, efter år 70 e.Kr., tog den kullen för Davids citadell; på 300-talet besteg kristna pilgrimer den som Sion och fick se Davids palats där, och kyrkan Heliga Sion stod senare på den. Själva ordets betydelse är osäker, kanske ”fästning” eller ”torr plats”, och det är sannolikt äldre än Israel. Kartans punkt märkt Sion står tillsammans med Jerusalems."
  nb:
    - "Sion var først den jebusittiske borgen på Jerusalems smale østre åsrygg, over Gihon-kilden, som David inntok og omdøpte til Davidsbyen; så gikk navnet over til tempelhøyden like nord for den, og i Salmene og profetene til hele byen. Høyden som i dag kalles Sionfjellet, er et tredje sted, den høyere vestre høyden utenfor Sionporten i gamlebyen, som fikk navnet først i den kristne tid. I luftlinje ligger de tre tett: kartets punkt for Davidsbyen er omtrent 0,5 km sør for Moriafjellet og 0,7 km øst for dagens Sionfjellet. History Globes artikler om Sion og Sionfjellet følger navnet fullt ut; dette svaret gir kortversjonen."
    - "Bibelen begynner med åsryggen: «David inntok allikevel Sions borg, det er Davids stad.» Da Salomo førte arken opp «fra Davids stad, det er Sion» til det nye tempelet, fulgte navnet med opp, og tempelhøyden ble det hellige fjellet: «Og jeg har dog innsatt min konge på Sion, mitt hellige berg!»; «For Herren har utkåret Sion, han har attrådd det til sin bolig». Profetene bruker det om Jerusalem og dets folk – «For fra Sion skal lov utgå» – og de landflyktige i Babylon «der satt vi og gråt når vi kom Sion i hu». I Hebreerbrevet løftes det helt av kartet: «I er kommet til Sions berg og den levende Guds stad, det himmelske Jerusalem»."
    - "Hvordan navnet nådde den vestre høyden, er ikke nøyaktig opptegnet. Josefus, etter 70 e.Kr., tok den høyden for Davids borg; innen 300-tallet besteg kristne pilegrimer den som Sion og ble vist Davids palass der, og kirken Hellige Sion sto senere på den. Selve ordets betydning er usikker, kanskje «festning» eller «tørt sted», og det er trolig eldre enn Israel. Kartets punkt merket Sion står sammen med Jerusalems."
  tl:
    - "Ang Sion ay una ang moog ng mga Jebuseo sa makitid na silangang tagaytay ng Jerusalem, sa itaas ng bukal ng Gihon, na kinuha ni David at pinalitan ng pangalang Bayan ni David; pagkatapos ay lumipat ang pangalan sa burol ng Templo sa hilaga nito, at sa mga Awit at mga propeta ay sa buong lungsod. Ang burol na tinatawag na Bundok Sion ngayon ay ikatlong lugar, ang mas mataas na kanlurang burol sa labas ng Pintuang Sion ng Lumang Lungsod, na kumuha ng pangalan sa panahong Kristiyano lamang. Sa tuwid na guhit, magkakalapit ang tatlo: ang punto ng mapa para sa Bayan ni David ay mga 0.5 km sa timog ng Bundok Moria at 0.7 km sa silangan ng Bundok Sion ngayon. Sinusundan nang buo ng mga artikulo ng History Globe tungkol sa Sion at Bundok Sion ang pangalan; ibinibigay ng sagot na ito ang maikling bersyon."
    - "Nagsisimula ang Biblia sa tagaytay: “sinakop ni David ang katibayan sa Sion; na siyang bayan ni David.” Nang iniahon ni Salomon ang kaban “mula sa bayan ni David na siyang Sion” patungo sa bagong Templo, sumama ang pangalan, at ang burol ng Templo ay naging banal na bundok: “inilagay ko ang aking hari sa aking banal na bundok ng Sion”; “pinili ng Panginoon ang Sion; kaniyang ninasa na pinaka tahanan niya.” Ginagamit ito ng mga propeta para sa Jerusalem at sa bayan nito — “mula sa Sion ay lalabas ang kautusan” — at ang mga destiyero sa Babilonia ay “nagiyak tayo, nang ating maalaala ang Sion”. Sa Mga Hebreo ay inalis ito sa mapa: “nagsilapit kayo sa bundok ng Sion, at sa bayan ng Dios na buhay, ang Jerusalem sa kalangitan”."
    - "Hindi eksaktong naitala kung paano nakarating ang pangalan sa kanlurang burol. Itinuring ni Josephus, pagkatapos ng 70 AD, ang burol na iyon na kuta ni David; noong ika-4 na siglo, inakyat ito ng mga peregrinong Kristiyano bilang Sion at ipinakita roon ang palasyo ni David, at kalaunan ay nakatayo roon ang simbahan ng Banal na Sion. Hindi tiyak ang kahulugan ng salita mismo, marahil “kuta” o “tuyong lugar”, at malamang ay mas matanda ito kaysa sa Israel. Kasama ng sa Jerusalem ang punto ng mapa na may label na Sion."
  da:
    - "Zion var først jebusitternes borg på Jerusalems smalle østlige højderyg, over Gihon-kilden, som David indtog og omdøbte til Davidsbyen; derefter gik navnet over til tempelhøjen lige nord for den, og i Salmerne og profeterne til hele byen. Bakken, der i dag kaldes Zions Bjerg, er et tredje sted, den højere vestlige høj uden for den gamle bydels Zionsport, som først fik navnet i den kristne tid. I fugleflugt ligger de tre tæt: Kortets punkt for Davidsbyen ligger ca. 0,5 km syd for Morija-bjerget og 0,7 km øst for nutidens Zions Bjerg. History Globes artikler om Zion og Zions Bjerg følger navnet fuldt ud; dette svar giver den korte version."
    - "Bibelen begynder med højdedraget: »David indtog Zions Befæstning, det er Davids Stad.« Da Salomo førte arken op »fra Davids Stad, det er Zion« til det nye tempel, fulgte navnet med op, og tempelhøjen blev det hellige bjerg: »Jeg har dog indsat min Konge over Zion, mit hellige Bjerg«; »Thi Herren har udvalgt Zion, han har begæret sig den til Bolig.« Profeterne bruger det om Jerusalem og dets folk — »thi fra Zion skal udgaa Lov« — og de landflygtige i Babylon »græd, naar vi kom Zion i Hu«. I Hebræerbrevet løftes det helt væk fra kortet: »I ere komne til Zions Bjerg og til den levende Guds Stad, til det himmelske Jerusalem«."
    - "Hvordan navnet nåede den vestlige høj, er ikke optegnet nøjagtigt. Josefus tog efter 70 e.Kr. den høj for Davids borg; i 300-tallet besteg kristne pilgrimme den som Sion og blev vist Davids palads der, og kirken Hellige Sion stod senere på den. Selve ordets betydning er usikker, måske »fæstning« eller »tørt sted«, og det er sandsynligvis ældre end Israel. Kortets punkt mærket Zion står sammen med Jerusalems."
  sr:
    - "Сион је најпре било јебусејско утврђење на уском источном гребену Јерусалима, изнад извора Гион, које је Давид заузео и преименовао у Давидов град; затим је име прешло на брдо Храма одмах северно од њега, а у псалмима и код пророка на цео град. Брдо које се данас зове гора Сион треће је место, више западно брдо изван Сионске капије Старог града, које је име добило тек у хришћанско доба. Ваздушном линијом сва три леже близу: тачка Давидовог града на карти је око 0,5 км јужно од горе Морије и 0,7 км источно од данашње горе Сион. History Globe у чланцима о Сиону и гори Сион прати име у целини; овај одговор даје кратку верзију."
    - "Библија почиње гребеном: „Давид узе кулу Сион, то је град Давидов.“ Када је Соломун пренео ковчег „из града Давидовог, а то је Сион“ у нови Храм, име је пошло са њим, а брдо Храма постало је света гора: „Ја сам помазао цара свог на Сиону, на светој гори својој“; „Јер је изабрао Господ Сион, и омиле Му живети на њему.“ Пророци га користе за Јерусалим и његов народ — „из Сиона изаћи закон“ — а прогнаници у Вавилону „плакасмо опомињући се Сиона“. У Посланици Јеврејима подигнут је потпуно с карте: „приступисте к сионској гори, и ка граду Бога Живога, Јерусалиму небеском“."
    - "Како је име дошло на западно брдо, није тачно забележено. Јосиф Флавије је после 70. н. е. то брдо узео за Давидову цитаделу; до четвртог века хришћански ходочасници пењали су се на њега као на Сион и показивана им је тамо Давидова палата, а црква Светог Сиона касније је на њему стајала. Значење саме речи је неизвесно, можда „тврђава“ или „сухо место“, и вероватно је старије од Израела. Тачка на карти означена као Сион стоји заједно са Јерусалимовом."
  hu:
    - "Sion eleinte a jebuzeusok erőssége volt Jeruzsálem keskeny keleti gerincén, a Gihon-forrás fölött, amelyet Dávid elfoglalt és Dávid városának nevezett át; azután a név a tőle északra fekvő Templomhegyre ment át, a zsoltárokban és a prófétáknál pedig az egész városra. A ma Sion-hegynek nevezett domb egy harmadik hely, a magasabb nyugati domb az Óváros Sion-kapuján kívül, amely a nevet csak a keresztény korban kapta. Légvonalban a három közel van egymáshoz: Dávid városa térképi pontja mintegy 0,5 km-re délre van a Móriá-hegytől és 0,7 km-re keletre a mai Sion-hegytől. A History Globe Sionról és a Sion-hegyről szóló cikkei teljes egészében követik a nevet; ez a válasz a rövid változatot adja."
    - "A Biblia a gerinccel kezd: „Bevevé mindazáltal Dávid a Sion várát, és az immár a Dávid városa.” Amikor Salamon a ládát felvitte „a Dávid városából, mely a Sion” az új templomba, a név vele ment, és a Templomhegy lett a szent hegy: a zsoltár szava szerint: „Én kentem ám fel az én királyomat a Sionon, az én szent hegyemen!”; „Mert a Siont választotta ki az Úr, azt szerette meg magának lakhelyül”. A próféták Jeruzsálemre és népére használják – „tanítás Sionból jő” –, a babiloni számkivetettek pedig „ültünk és sírtunk, mikor a Sionról megemlékezénk”. A Zsidókhoz írt levélben le is emelkedik a térképről: „járultatok Sion hegyéhez, és az élő Istennek városához, a mennyei Jeruzsálemhez”."
    - "Hogy a név hogyan jutott a nyugati dombra, nincs pontosan feljegyezve. Josephus Kr. u. 70 után azt a dombot tartotta Dávid fellegvárának; a 4. századra a keresztény zarándokok Sionként mászták meg, és ott mutatták nekik Dávid palotáját, később a Szent Sion-templom állt rajta. Maga a szó jelentése bizonytalan, talán „erőd” vagy „száraz hely”, és valószínűleg régebbi Izráelnél. A Sionnak nevezett térképi pont Jeruzsálemével együtt áll."
  fi:
    - "Siion oli ensin jebusilaisten linnake Jerusalemin kapealla itäisellä harjanteella Gihonin lähteen yläpuolella, jonka Daavid valloitti ja nimesi Daavidin kaupungiksi; sitten nimi siirtyi sen pohjoispuolella olevalle Temppelikukkulalle ja Psalmeissa ja profeetoissa koko kaupungille. Nykyisin Siioninvuoreksi kutsuttu kukkula on kolmas paikka, korkeampi läntinen kukkula vanhankaupungin Siionin portin ulkopuolella, joka sai nimen vasta kristillisenä aikana. Linnuntietä nämä kolme ovat lähellä toisiaan: kartan piste Daavidin kaupungille on noin 0,5 km Morianvuoresta etelään ja 0,7 km nykyisestä Siioninvuoresta itään. History Globen artikkelit Siionista ja Siioninvuoresta seuraavat nimeä kokonaisuudessaan; tämä vastaus antaa lyhyen version."
    - "Raamattu alkaa harjanteesta: ”Daavid valloitti Siionin vuorilinnan, se on Daavidin kaupungin.” Kun Salomo toi arkin ”Daavidin kaupungista, se on Siionista” uuteen temppeliin, nimi nousi sen mukana, ja Temppelikukkulasta tuli pyhä vuori: ”Minä olen asettanut kuninkaani Siioniin, pyhälle vuorelleni”; ”Sillä Herra on valinnut Siionin, halunnut sen asunnoksensa.” Profeetat käyttävät sitä Jerusalemista ja sen kansasta – ”Siionista lähtee laki” – ja Babylonin pakkosiirtolaiset ”istuimme ja itkimme, kun Siionia muistelimme”. Heprealaiskirjeessä se nostetaan kokonaan pois kartalta: ”te olette käyneet Siionin vuoren tykö ja elävän Jumalan kaupungin, taivaallisen Jerusalemin tykö”."
    - "Miten nimi siirtyi läntiselle kukkulalle, ei ole tarkasti kirjattu. Josefus piti vuoden 70 jaa. jälkeen sitä kukkulaa Daavidin linnakkeena; 300-luvulla kristityt pyhiinvaeltajat nousivat sille Siionina ja heille näytettiin siellä Daavidin palatsia, ja Pyhän Siionin kirkko seisoi myöhemmin sillä. Sanan merkitys on epävarma, ehkä ”linnoitus” tai ”kuiva paikka”, ja se on luultavasti Israelia vanhempi. Kartan Siioniksi nimetty piste seisoo Jerusalemin pisteen kanssa."
  vi:
    - "Si-ôn trước hết là đồn lũy của người Giê-bu-sít trên sống đồi đông hẹp của Giê-ru-sa-lem, phía trên suối Ghi-hôn, mà Đa-vít chiếm và đổi tên thành Thành Đa-vít; rồi tên gọi truyền sang ngọn đồi Đền thờ ngay phía bắc, và trong Thi thiên cùng các sách tiên tri sang cả thành. Ngọn đồi gọi là Núi Si-ôn ngày nay là nơi thứ ba, ngọn đồi phía tây cao hơn ngoài Cổng Si-ôn của Thành Cổ, chỉ nhận tên ấy trong thời đại Cơ Đốc. Theo đường thẳng, ba nơi nằm gần nhau: điểm của bản đồ cho Thành Đa-vít cách Núi Mô-ri-a khoảng 0,5 km về phía nam và cách Núi Si-ôn ngày nay 0,7 km về phía đông. Các bài của History Globe về Si-ôn và Núi Si-ôn theo dõi tên gọi đầy đủ; câu trả lời này đưa phiên bản ngắn."
    - "Kinh Thánh bắt đầu với sống đồi: “Đa-vít hãm lấy đồn Si-ôn: ấy là thành Đa-vít.” Khi Sa-lô-môn đem hòm giao ước lên “từ thành của Đa-vít, tức là Si-ôn” đến Đền thờ mới, tên gọi cũng đi lên theo, và ngọn đồi Đền thờ trở thành núi thánh: “Dầu vậy, ta đã lập Vua ta Trên Si-ôn là núi thánh ta”; “Vì Đức Giê-hô-va đã chọn Si-ôn; Ngài ước Si-ôn làm nơi ở của Ngài.” Các tiên tri dùng nó cho Giê-ru-sa-lem và dân thành — “luật pháp sẽ ra từ Si-ôn” — và những người lưu đày ở Ba-by-lôn “nhớ lại Si-ôn, và khóc”. Trong thư Hê-bơ-rơ, nó được nâng khỏi bản đồ hoàn toàn: “anh em đã tới gần núi Si-ôn, gần thành của Đức Chúa Trời hằng sống, tức là Giê-ru-sa-lem trên trời”."
    - "Tên gọi đến ngọn đồi phía tây như thế nào không được ghi lại chính xác. Josephus, sau năm 70, coi ngọn đồi ấy là thành lũy của Đa-vít; đến thế kỷ 4, người hành hương Cơ Đốc leo lên đó như Sion và được chỉ cung điện của Đa-vít ở đấy, và nhà thờ Holy Sion về sau đứng trên đó. Nghĩa của chính từ này không chắc chắn, có lẽ là “pháo đài” hoặc “nơi khô”, và nó có lẽ cổ hơn Y-sơ-ra-ên. Điểm trên bản đồ ghi Si-ôn đứng cùng điểm của Giê-ru-sa-lem."
  ro:
    - "Sionul a fost mai întâi cetatea iebusită de pe creasta îngustă din est a Ierusalimului, deasupra izvorului Ghihon, pe care David a luat-o și a redenumit-o Cetatea lui David; apoi numele a trecut la dealul Templului, chiar la nord de ea, și, în Psalmi și la prooroci, la întreg orașul. Dealul numit azi Muntele Sion este un al treilea loc, dealul vestic mai înalt, în afara Porții Sionului din Orașul Vechi, care a primit numele abia în epoca creștină. În linie dreaptă, cele trei sunt apropiate: punctul Cetății lui David de pe hartă se află la circa 0,5 km sud de Muntele Moria și la 0,7 km est de Muntele Sion de azi. Articolele History Globe despre Sion și Muntele Sion urmăresc numele pe larg; răspunsul de față dă versiunea scurtă."
    - "Biblia începe cu creasta: „a luat David întăritura Sionului, aceasta este cetatea lui David.” Când Solomon a urcat chivotul din Cetatea lui David, adică Sion, la noul Templu, numele a urcat odată cu el, iar dealul Templului a devenit muntele sfânt: Psalmii îl numesc muntele sfânt al Sionului, pe care Domnul și-a pus regele, și spun că Domnul a ales Sionul și l-a dorit ca locuință. Proorocii îl folosesc pentru Ierusalim și poporul lui — „din Sion va ieșì legea” — iar exilații din Babilon au plâns aducându-și aminte de Sion. În Epistola către Evrei este ridicat cu totul de pe hartă: „v’ați apropiat de muntele Sionului și de cetatea Dumnezeului celui viu, Ierusalimul cel ceresc”."
    - "Cum a ajuns numele pe dealul vestic nu este consemnat exact. Iosif Flaviu, după anul 70 d.Hr., a luat acel deal drept cetatea lui David; până în secolul al IV-lea, pelerinii creștini îl urcau ca Sion și li se arăta palatul lui David acolo, iar biserica Sfintei Sion s-a ridicat mai târziu pe el. Înțelesul cuvântului însuși este nesigur, poate „fortăreață” sau „loc uscat”, și este probabil mai vechi decât Israel. Punctul de pe hartă etichetat Sion stă împreună cu al Ierusalimului."
  bg:
    - "Сион беше отначало йевусейската твърдина на тесния източен хребет на Йерусалим, над извора Гион, която Давид превзе и нарече Давидов град; после името премина към храмовия хълм точно на север от него, а в Псалмите и пророците — към целия град. Хълмът, наричан днес Сион, е трето място — по-високият западен хълм извън Сионската порта на Стария град, който е получил името едва в християнската епоха. По права линия трите са близо едно до друго: точката на картата за Давидовия град е на около 0,5 км южно от Мория и на 0,7 км източно от днешния Сион. Статиите на History Globe за Сион и за планината Сион проследяват името подробно; този отговор дава краткия вариант."
    - "Библията започва с хребета: „Давид превзе твърдела Сион: той е Давидовият град.“ Когато Соломон пренесе ковчега „от Давидовия град, който е Сион“, в новия Храм, името се изкачи заедно с него и храмовият хълм стана светата планина: „помазах Царя си Над Сион, светата моя гора“; „Защото избра Господ Сиона: Благоволи да живее в него.“ Пророците го употребяват за Йерусалим и неговия народ — „от Сион ще излезе закон“, а изгнаниците във Вавилон „плакахме когато поменахме Сиона“. В Посланието към евреите той е изцяло издигнат над картата: „пристъпихте до гората Сион, и до града на Бога живаго, небесния Ерусалим“."
    - "Как името е стигнало до западния хълм, не е записано точно. Йосиф Флавий след 70 г. н.е. смята този хълм за цитаделата на Давид; към IV в. християнските поклонници се изкачват на него като на Сион и там им показват двореца на Давид, а по-късно на него е издигната църквата „Света Сион“. Значението на самата дума е несигурно — може би „крепост“ или „сухо място“, и тя вероятно е по-стара от Израил. Точката на картата с надпис Сион стои заедно с тази на Йерусалим."
