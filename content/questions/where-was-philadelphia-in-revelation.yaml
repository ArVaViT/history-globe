id: where-was-philadelphia-in-revelation
question:
  en: "Where was Philadelphia in Revelation?"
  ru: "Где находилась Филадельфия из Откровения?"
answer:
  en:
    - "The Philadelphia of Revelation is Alaşehir in the province of Manisa in western Turkey, at the foot of Mount Tmolus above the valley of the Cogamis, a tributary of the Hermus; the map point stands in the town. It lay about 44 km east of Sardis and 77 km north-west of Laodicea in a straight line, on the road from Sardis up into Phrygia. It is not the other Philadelphia of the time, Rabbah of the Ammonites, today's Amman, which Ptolemy II renamed after himself and which became a city of the Decapolis; the Bible never calls that city Philadelphia."
    - "Revelation, about AD 95, sends Philadelphia the sixth of the seven letters, which, like the letter to Smyrna, has no rebuke: “behold, I have set before thee an open door, and no man can shut it: for thou hast a little strength, and hast kept my word”. The city, founded in the second century BC by the kings of Pergamum and named after Attalus II Philadelphus, stood at the gateway to the uplands of Phrygia, and some read the open door as that position, others as a door for the gospel. The promise “Him that overcometh will I make a pillar in the temple of my God, and he shall go no more out” is often set against a city so shaken by earthquakes, Strabo says, that most of its people lived out in the countryside."
    - "Early in the second century Ignatius of Antioch passed through under guard and later wrote to the Philadelphians from Troas. In the Middle Ages Philadelphia held out as a Byzantine city in the midst of Turkish Anatolia until 1390, when it fell to the Ottoman sultan Bayezid I. In the centre of Alaşehir stand the massive brick piers of a Byzantine basilica known as the church of St John."
  ru:
    - "Филадельфия Откровения — это Алашехир в провинции Маниса на западе Турции, у подножия горы Тмол над долиной Когамиса, притока Герма; точка карты стоит в городе. Она лежала примерно в 44 км к востоку от Сардиса и в 77 км к северо-западу от Лаодикии по прямой, на дороге из Сардиса вверх во Фригию. Это не другая Филадельфия того времени — Равва Аммонитская, нынешний Амман, которую Птолемей II назвал в свою честь и которая вошла в Десятиградие; Библия никогда не называет тот город Филадельфией."
    - "Откровение около 95 г. посылает Филадельфии шестое из семи посланий, в котором, как и в послании Смирне, нет обличения: «вот, Я отворил перед тобою дверь, и никто не может затворить ее; ты не много имеешь силы, и сохранил слово Мое». Город, основанный во II веке до н. э. пергамскими царями и названный в честь Аттала II Филадельфа, стоял у ворот во Фригийское нагорье, и одни видят в отворённой двери это положение, другие — дверь для благовестия. Обещание «Побеждающего сделаю столпом в храме Бога Моего, и он уже не выйдет вон» часто сопоставляют с городом, который, по словам Страбона, так трясли землетрясения, что большинство жителей жило за городом, на полях."
    - "В начале II века Игнатий Антиохийский прошёл здесь под стражей, а потом написал филадельфийцам из Троады. В Средние века Филадельфия держалась как византийский город среди турецкой Анатолии до 1390 года, когда её взял османский султан Баязид I. В центре Алашехира стоят массивные кирпичные столбы византийской базилики, известной как церковь святого Иоанна."
