id: where-was-philadelphia-in-revelation
question:
  en: "Where was Philadelphia in Revelation?"
  ru: "Где находилась Филадельфия из Откровения?"
  uk: "Де була Філадельфія з Одкровення?"
  es: "¿Dónde estaba Filadelfia, la del Apocalipsis?"
  pt: "Onde ficava Filadélfia, no Apocalipse?"
  de: "Wo lag Philadelphia in der Offenbarung?"
  fr: "Où se trouvait Philadelphie, dans l’Apocalypse ?"
  pl: "Gdzie leżała Filadelfia z Apokalipsy?"
  it: "Dov’era Filadelfia dell’Apocalisse?"
  cs: "Kde ležela Filadelfie ze Zjevení?"
  nl: "Waar lag Filadelfia in de Openbaring?"
  sv: "Var låg Filadelfia i Uppenbarelseboken?"
  nb: "Hvor lå Filadelfia i Åpenbaringen?"
  tl: "Nasaan ang Filadelfia sa Apocalipsis?"
  da: "Hvor lå Filadelfia i Johannes’ Åbenbaring?"
  sr: "Где је била Филаделфија из Откривења?"
answer:
  en:
    - "The Philadelphia of Revelation is Alaşehir in the province of Manisa in western Turkey, at the foot of Mount Tmolus above the valley of the Cogamis, a tributary of the Hermus; the map point stands in the town. It lay about 44 km east of Sardis and 77 km north-west of Laodicea in a straight line, on the road from Sardis up into Phrygia. It is not the other Philadelphia of the time, Rabbah of the Ammonites, today's Amman, which Ptolemy II renamed after himself and which became a city of the Decapolis; the Bible never calls that city Philadelphia."
    - "Revelation, about AD 95, sends Philadelphia the sixth of the seven letters, which, like the letter to Smyrna, has no rebuke: “behold, I have set before thee an open door, and no man can shut it: for thou hast a little strength, and hast kept my word”. The city, founded in the second century BC by the kings of Pergamum and named after Attalus II Philadelphus, stood at the gateway to the uplands of Phrygia, and some read the open door as that position, others as a door for the gospel. The promise “Him that overcometh will I make a pillar in the temple of my God, and he shall go no more out” is often set against a city so shaken by earthquakes, Strabo says, that most of its people lived out in the countryside."
    - "Early in the second century Ignatius of Antioch passed through under guard and later wrote to the Philadelphians from Troas. In the Middle Ages Philadelphia held out as a Byzantine city in the midst of Turkish Anatolia until 1390, when it fell to the Ottoman sultan Bayezid I. In the centre of Alaşehir stand the massive brick piers of a Byzantine basilica known as the church of St John."
  ru:
    - "Филадельфия Откровения — это Алашехир в провинции Маниса на западе Турции, у подножия горы Тмол над долиной Когамиса, притока Герма; точка карты стоит в городе. Она лежала примерно в 44 км к востоку от Сардиса и в 77 км к северо-западу от Лаодикии по прямой, на дороге из Сардиса вверх во Фригию. Это не другая Филадельфия того времени — Равва Аммонитская, нынешний Амман, которую Птолемей II назвал в свою честь и которая вошла в Десятиградие; Библия никогда не называет тот город Филадельфией."
    - "Откровение около 95 г. посылает Филадельфии шестое из семи посланий, в котором, как и в послании Смирне, нет обличения: «вот, Я отворил перед тобою дверь, и никто не может затворить ее; ты не много имеешь силы, и сохранил слово Мое». Город, основанный во II веке до н. э. пергамскими царями и названный в честь Аттала II Филадельфа, стоял у ворот во Фригийское нагорье, и одни видят в отворённой двери это положение, другие — дверь для благовестия. Обещание «Побеждающего сделаю столпом в храме Бога Моего, и он уже не выйдет вон» часто сопоставляют с городом, который, по словам Страбона, так трясли землетрясения, что большинство жителей жило за городом, на полях."
    - "В начале II века Игнатий Антиохийский прошёл здесь под стражей, а потом написал филадельфийцам из Троады. В Средние века Филадельфия держалась как византийский город среди турецкой Анатолии до 1390 года, когда её взял османский султан Баязид I. В центре Алашехира стоят массивные кирпичные столбы византийской базилики, известной как церковь святого Иоанна."
  uk:
    - "Філадельфія з Одкровення — це Алашехір у провінції Маніса на заході Туреччини, біля підніжжя гори Тмол над долиною Когаміса, притоки Герма; точка на мапі стоїть у місті. Вона лежала приблизно за 44 км на схід від Сард і за 77 км на північний захід від Лаодікеї по прямій, на дорозі від Сард угору у Фрігію. Це не інша Філадельфія того часу, Равва Аммонітська, нинішній Амман, яку Птолемей II перейменував на свою честь і яка стала містом Десятимістя; Біблія ніколи не називає те місто Філадельфією."
    - "Одкровення, близько 95 р. н. е., надсилає Філадельфії шостий із семи листів, який, як і лист до Смирни, не має докору: «ось дав я перед тобою незачинені двері, і нїхто не може зачинити їх; ти малу маєш силу, а схоронив моє слово». Місто, засноване в II ст. до н. е. царями Пергама і назване на честь Аттала II Філадельфа, стояло біля входу у нагір'я Фрігії, і дехто читає відчинені двері як це розташування, інші — як двері для Євангелія. Обітницю «Хто побідить, зроблю його стовпом в храмі Бога мого, і вже не вийде геть» часто зіставляють з містом, яке, за Страбоном, так трусили землетруси, що більшість його жителів жила за містом, на селі."
    - "На початку II ст. Ігнатій Антіохійський проїжджав під вартою і пізніше писав філадельфійцям із Троади. У Середньовіччі Філадельфія трималася як візантійське місто посеред турецької Анатолії до 1390 р., коли впала перед османським султаном Баязидом I. У центрі Алашехіра стоять масивні цегляні стовпи візантійської базиліки, відомої як церква святого Івана."
  es:
    - "La Filadelfia del Apocalipsis es Alaşehir, en la provincia de Manisa, en el oeste de Turquía, al pie del monte Tmolo, sobre el valle del Cogamis, afluente del Hermo; el punto del mapa está en la ciudad. Quedaba a unos 44 km al este de Sardis y a 77 km al noroeste de Laodicea en línea recta, en el camino que sube de Sardis a Frigia. No es la otra Filadelfia de la época, Rabá de los amonitas, la actual Amán, que Ptolomeo II rebautizó con su propio nombre y que llegó a ser una ciudad de la Decápolis; la Biblia nunca llama Filadelfia a esa ciudad."
    - "El Apocalipsis, hacia el 95 d. C., envía a Filadelfia la sexta de las siete cartas, que, como la dirigida a Esmirna, no contiene reproche: «he aquí, he dado una puerta abierta delante de ti, la cual ninguno puede cerrar; porque tienes un poco de potencia, y has guardado mi palabra». La ciudad, fundada en el siglo II a. C. por los reyes de Pérgamo y llamada así por Átalo II Filadelfo, se alzaba en la puerta de las tierras altas de Frigia, y unos leen la puerta abierta como esa posición, otros como una puerta para el Evangelio. La promesa «Al que venciere, yo lo haré columna en el templo de mi Dios, y nunca más saldrá fuera» se pone a menudo frente a una ciudad tan sacudida por terremotos que, según Estrabón, la mayor parte de su gente vivía en el campo."
    - "A principios del siglo II, Ignacio de Antioquía pasó por allí bajo custodia y más tarde escribió a los filadelfios desde Troas. En la Edad Media, Filadelfia resistió como ciudad bizantina en medio de la Anatolia turca hasta 1390, cuando cayó ante el sultán otomano Bayaceto I. En el centro de Alaşehir se alzan los macizos pilares de ladrillo de una basílica bizantina conocida como la iglesia de San Juan."
  pt:
    - "A Filadélfia do Apocalipse é Alaşehir, na província de Manisa, no oeste da Turquia, ao pé do monte Tmolo, acima do vale do Cogamo, afluente do Hermo; o ponto do mapa fica na cidade. Ficava a cerca de 44 km a leste de Sardes e 77 km a noroeste de Laodiceia em linha reta, na estrada que sobe de Sardes para a Frígia. Não é a outra Filadélfia da época, Rabá dos amonitas, a atual Amã, que Ptolomeu II rebatizou com o próprio nome e que se tornou uma cidade da Decápolis; a Bíblia nunca chama essa cidade de Filadélfia."
    - "O Apocalipse, por volta de 95 d.C., envia a Filadélfia a sexta das sete cartas, que, como a carta a Esmirna, não traz repreensão: “eis que coloquei diante de você uma porta aberta, a qual ninguém pode fechar… você tem pouca força, mas guardou a minha palavra”. A cidade, fundada no século II a.C. pelos reis de Pérgamo e assim chamada em honra de Átalo II Filadelfo, ficava à entrada das terras altas da Frígia, e alguns leem a porta aberta como essa posição, outros como uma porta para o evangelho. A promessa “Àquele que vencer, eu o farei coluna no templo do meu Deus, e dali ele jamais sairá” é muitas vezes posta em contraste com uma cidade tão abalada por terremotos, diz Estrabão, que a maior parte de sua gente vivia no campo."
    - "No início do século II, Inácio de Antioquia passou por ali sob guarda e mais tarde escreveu de Trôade aos filadelfianos. Na Idade Média, Filadélfia resistiu como cidade bizantina no meio da Anatólia turca até 1390, quando caiu diante do sultão otomano Bajazeto I. No centro de Alaşehir erguem-se os maciços pilares de tijolo de uma basílica bizantina conhecida como igreja de São João."
  de:
    - "Das Philadelphia der Offenbarung ist Alaşehir in der Provinz Manisa im Westen der Türkei, am Fuß des Tmolos über dem Tal des Kogamis, eines Nebenflusses des Hermos; der Kartenpunkt steht in der Stadt. Es lag in der Luftlinie etwa 44 km östlich von Sardes und 77 km nordwestlich von Laodizea, an der Straße von Sardes hinauf nach Phrygien. Es ist nicht das andere Philadelphia jener Zeit, Rabba der Ammoniter, das heutige Amman, das Ptolemäus II. nach sich selbst umbenannte und das eine Stadt der Dekapolis wurde; die Bibel nennt jene Stadt nie Philadelphia."
    - "Die Offenbarung schickt um 95 n. Chr. Philadelphia das sechste der sieben Sendschreiben, das wie das an Smyrna keinen Tadel enthält: „Siehe, ich habe vor dir gegeben eine offene Tür, und niemand kann sie zuschließen; denn du hast eine kleine Kraft, und hast mein Wort behalten“. Die Stadt, im 2. Jahrhundert v. Chr. von den Königen von Pergamon gegründet und nach Attalos II. Philadelphos benannt, lag am Tor zum Hochland Phrygiens, und manche verstehen die offene Tür als diese Lage, andere als Tür für das Evangelium. Die Verheißung „Wer überwindet, den will ich machen zum Pfeiler in dem Tempel meines Gottes, und er soll nicht mehr hinausgehen“ wird oft einer Stadt gegenübergestellt, die nach Strabon so von Erdbeben erschüttert wurde, dass die meisten Einwohner auf dem Land lebten."
    - "Anfang des 2. Jahrhunderts kam Ignatius von Antiochia unter Bewachung durch und schrieb später von Troas aus an die Philadelphier. Im Mittelalter hielt sich Philadelphia als byzantinische Stadt inmitten des türkischen Anatolien bis 1390, als es an den osmanischen Sultan Bayezid I. fiel. Im Zentrum von Alaşehir stehen die massiven Ziegelpfeiler einer byzantinischen Basilika, die als Johanneskirche bekannt ist."
  fr:
    - "La Philadelphie de l’Apocalypse est Alaşehir, dans la province de Manisa, dans l’ouest de la Turquie, au pied du mont Tmolos, au-dessus de la vallée du Cogamis, affluent de l’Hermos ; le point de la carte se trouve dans la ville. Elle était à environ 44 km à l’est de Sardes et à 77 km au nord-ouest de Laodicée à vol d’oiseau, sur la route qui monte de Sardes vers la Phrygie. Elle ne doit pas être confondue avec l’autre Philadelphie de l’époque, Rabba des Ammonites, l’actuelle Amman, que Ptolémée II rebaptisa d’après lui-même et qui devint une ville de la Décapole ; la Bible n’appelle jamais cette ville Philadelphie."
    - "L’Apocalypse, vers 95 apr. J.-C., adresse à Philadelphie la sixième des sept lettres, qui, comme la lettre à Smyrne, ne comporte aucun reproche : « parce que tu as peu de puissance, et que tu as gardé ma parole, … j’ai mis devant toi une porte ouverte, que personne ne peut fermer ». La ville, fondée au IIe siècle av. J.-C. par les rois de Pergame et nommée d’après Attale II Philadelphe, se dressait à l’entrée des hautes terres de la Phrygie, et certains lisent la porte ouverte comme cette position, d’autres comme une porte ouverte à l’Évangile. La promesse « Celui qui vaincra, je ferai de lui une colonne dans le temple de mon Dieu, et il n’en sortira plus » est souvent rapprochée d’une ville si secouée par les tremblements de terre, dit Strabon, que la plupart de ses habitants vivaient à la campagne."
    - "Au début du IIe siècle, Ignace d’Antioche y passa sous escorte et écrivit plus tard aux Philadelphiens depuis Troas. Au Moyen Âge, Philadelphie resta une ville byzantine au milieu de l’Anatolie turque jusqu’en 1390, date à laquelle elle tomba aux mains du sultan ottoman Bayezid Ier. Au centre d’Alaşehir se dressent les massifs piliers de briques d’une basilique byzantine connue sous le nom d’église Saint-Jean."
  pl:
    - "Filadelfia z Apokalipsy to Alaşehir w prowincji Manisa w zachodniej Turcji, u stóp góry Tmolos nad doliną Kogamis, dopływu Hermosu; punkt na mapie stoi w mieście. Leżała około 44 km na wschód od Sardes i 77 km na północny zachód od Laodycei w linii prostej, przy drodze z Sardes w górę do Frygii. Nie jest to inna Filadelfia tamtych czasów, Rabba Ammonitów, dzisiejszy Amman, którą Ptolemeusz II nazwał od siebie i która stała się miastem Dekapolu; Biblia nigdy nie nazywa tego miasta Filadelfią."
    - "Apokalipsa, około 95 n.e., posyła Filadelfii szósty z siedmiu listów, który, podobnie jak list do Smyrny, nie zawiera nagany: „otom wystawił przed tobą drzwi otworzone, a żaden nie może ich zamknąć; bo acz masz niewielką moc, przecięś zachował słowo moje”. Miasto, założone w II wieku p.n.e. przez królów Pergamonu i nazwane od Attalosa II Filadelfosa, stało u bramy wyżyn Frygii, a niektórzy odczytują otwarte drzwi jako to położenie, inni jako drzwi dla ewangelii. Obietnicę, że zwycięzca będzie filarem w świątyni Boga — „Kto zwycięży, uczynię go filarem w kościele Boga mojego, a więcej z niego już nie wynijdzie” — często zestawia się z miastem tak nawiedzanym trzęsieniami ziemi, że według Strabona większość jego mieszkańców żyła na wsi."
    - "Na początku II wieku Ignacy Antiocheński przeszedł tędy pod strażą i później napisał do Filadelfijczyków z Troady. W średniowieczu Filadelfia opierała się jako bizantyjskie miasto pośrodku tureckiej Anatolii aż do 1390, gdy padła przed osmańskim sułtanem Bajazydem I. W centrum Alaşehir stoją masywne ceglane filary bizantyjskiej bazyliki znanej jako kościół św. Jana."
  it:
    - "La Filadelfia dell’Apocalisse è Alaşehir, nella provincia di Manisa nella Turchia occidentale, ai piedi del Monte Tmolo sopra la valle del Cogamis, un affluente dell’Ermo; il punto della mappa si trova nella città. Distava circa 44 km a est di Sardi e 77 km a nord-ovest di Laodicea in linea d’aria, sulla strada che da Sardi sale verso la Frigia. Non è l’altra Filadelfia dell’epoca, Rabba degli Ammoniti, l’odierna Amman, che Tolomeo II ribattezzò con il proprio nome e che divenne una città della Decapoli; la Bibbia non chiama mai Filadelfia quella città."
    - "L’Apocalisse, intorno al 95 d.C., manda a Filadelfia la sesta delle sette lettere, che, come la lettera a Smirne, non contiene rimproveri: «Ecco, io ti ho posta dinanzi una porta aperta, che nessuno può chiudere, perché, pur avendo poca forza, hai serbata la mia parola». La città, fondata nel II secolo a.C. dai re di Pergamo e chiamata così da Attalo II Filadelfo, sorgeva alla porta degli altopiani della Frigia, e alcuni leggono la porta aperta come quella posizione, altri come una porta per il Vangelo. La promessa «Chi vince io lo farò una colonna nel tempio del mio Dio, ed egli non ne uscirà mai più» è spesso messa a confronto con una città così scossa dai terremoti, dice Strabone, che la maggior parte dei suoi abitanti viveva fuori, in campagna."
    - "All’inizio del II secolo Ignazio di Antiochia vi passò sotto scorta e più tardi scrisse ai Filadelfiesi da Troade. Nel Medioevo Filadelfia resistette come città bizantina in mezzo all’Anatolia turca fino al 1390, quando cadde in mano al sultano ottomano Bayezid I. Nel centro di Alaşehir sorgono i massicci pilastri di mattoni di una basilica bizantina nota come chiesa di San Giovanni."
  cs:
    - "Filadelfie ze Zjevení je Alaşehir v provincii Manisa v západním Turecku, na úpatí hory Tmólos nad údolím Kogamidu, přítoku Herma; bod na mapě stojí ve městě. Ležela vzdušnou čarou asi 44 km východně od Sard a 77 km severozápadně od Laodikeie na cestě ze Sard vzhůru do Frygie. Není to druhá Filadelfie té doby, Rabba Amonitských, dnešní Ammán, kterou Ptolemaios II. přejmenoval po sobě a která se stala městem Dekapole; Bible toto město nikdy Filadelfií nenazývá."
    - "Zjevení, asi roku 95 n. l., posílá Filadelfii šestý ze sedmi listů, který jako list do Smyrny neobsahuje žádné pokárání: „Aj, postavil jsem před tebou dveře otevřené, a žádnýť jich nemůže zavříti. Nebo máš ač nevelikou moc, a ostříhal jsi slova mého.“ Město, založené ve 2. století př. n. l. pergamskými králi a pojmenované po Attalovi II. Filadelfovi, stálo u brány do frygické vysočiny a někteří čtou otevřené dveře jako toto postavení, jiní jako dveře pro evangelium. Slib „Kdo zvítězí, učiním jej sloupem v chrámě Boha svého, a nevyjdeť již více ven“ se často klade proti městu tak otřásanému zemětřeseními, že podle Strabóna většina jeho obyvatel žila venku na venkově."
    - "Počátkem 2. století prošel Ignatios Antiochijský pod stráží a později psal Filadelfským z Troady. Ve středověku se Filadelfie držela jako byzantské město uprostřed tureckého Anatolu až do roku 1390, kdy padla osmanskému sultánovi Bajezidovi I. Ve středu Alaşehiru stojí mohutné cihlové pilíře byzantské baziliky známé jako kostel sv. Jana."
  nl:
    - "Het Filadelfia van de Openbaring is Alaşehir in de provincie Manisa in het westen van Turkije, aan de voet van de Tmolus boven het dal van de Cogamis, een zijrivier van de Hermus; het punt op de kaart staat in de stad. Het lag hemelsbreed ongeveer 44 km ten oosten van Sardes en 77 km ten noordwesten van Laodicea, aan de weg van Sardes omhoog naar Frygië. Het is niet het andere Filadelfia van die tijd, Rabba van de Ammonieten, het huidige Amman, dat Ptolemaeus II naar zichzelf hernoemde en dat een stad van de Dekapolis werd; de Bijbel noemt die stad nooit Filadelfia."
    - "De Openbaring stuurt Filadelfia omstreeks 95 n.Chr. de zesde van de zeven brieven, die, net als de brief aan Smyrna, geen berisping bevat: “zie, Ik heb een geopende deur voor u gegeven, en niemand kan die sluiten; want gij hebt kleine kracht, en gij hebt Mijn woord bewaard”. De stad, in de tweede eeuw v.Chr. gesticht door de koningen van Pergamum en genoemd naar Attalus II Philadelphus, lag aan de toegang tot het hoogland van Frygië, en sommigen lezen de open deur als die ligging, anderen als een deur voor het evangelie. De belofte “Die overwint, Ik zal hem maken tot een pilaar in den tempel Mijns Gods, en hij zal niet meer daaruit gaan” wordt vaak gezet tegenover een stad die volgens Strabo zo door aardbevingen werd geteisterd dat de meeste inwoners op het platteland woonden."
    - "Vroeg in de tweede eeuw kwam Ignatius van Antiochië onder bewaking langs en schreef later vanuit Troas aan de Filadelfianen. In de middeleeuwen hield Filadelfia stand als Byzantijnse stad te midden van Turks Anatolië tot 1390, toen het viel aan de Ottomaanse sultan Bayezid I. In het centrum van Alaşehir staan de massieve bakstenen pijlers van een Byzantijnse basiliek die bekendstaat als de kerk van Sint-Johannes."
  sv:
    - "Filadelfia i Uppenbarelseboken är Alaşehir i provinsen Manisa i västra Turkiet, vid foten av berget Tmolos ovanför dalen Kogamis, en biflod till Hermos; kartpunkten står i staden. Den låg omkring 44 km öster om Sardes och 77 km nordväst om Laodikeia i fågelvägen, vid vägen från Sardes upp i Frygien. Den är inte tidens andra Filadelfia, ammoniternas Rabba, dagens Amman, som Ptolemaios II döpte om efter sig själv och som blev en stad i Dekapolis; Bibeln kallar aldrig den staden Filadelfia."
    - "Uppenbarelseboken, omkring år 95 e.Kr., sänder Filadelfia det sjätte av de sju breven, som liksom brevet till Smyrna saknar tillrättavisning: ”Se, jag har låtit dig finna en öppen dörr, som ingen kan tillsluta. Ty väl är din kraft ringa, men du har tagit vara på mitt ord”. Staden, grundad på 100-talet f.Kr. av kungarna av Pergamon och uppkallad efter Attalos II Filadelfos, låg vid porten till Frygiens högland, och vissa läser den öppna dörren som detta läge, andra som en dörr för evangeliet. Löftet ”Den som vinner seger, honom skall jag göra till en pelare i min Guds tempel, och han skall aldrig mer lämna det” ställs ofta mot en stad som så ofta skakades av jordbävningar, säger Strabon, att de flesta av dess invånare bodde ute på landsbygden."
    - "Tidigt på 100-talet passerade Ignatios av Antiochia under bevakning och skrev senare till filadelfierna från Troas. Under medeltiden höll sig Filadelfia kvar som en bysantinsk stad mitt i det turkiska Anatolien till 1390, då den föll för den osmanske sultanen Bayezid I. I Alaşehirs centrum står de massiva tegelpelarna av en bysantinsk basilika känd som Sankt Johanneskyrkan."
  nb:
    - "Åpenbaringens Filadelfia er Alaşehir i provinsen Manisa i Vest-Tyrkia, ved foten av Tmolos-fjellet over Kogamis-dalen, en sideelv til Hermos; kartpunktet står i byen. Den lå omtrent 44 km øst for Sardes og 77 km nordvest for Laodikea i luftlinje, ved veien fra Sardes opp i Frygia. Det er ikke den andre Filadelfia fra samme tid, Rabba i ammonittenes land, dagens Amman, som Ptolemaios II ga navn etter seg selv og som ble en by i Dekapolis; Bibelen kaller aldri den byen Filadelfia."
    - "Johannes’ Åpenbaring, omkring 95 e.Kr., sender Filadelfia det sjette av de syv brevene, som i likhet med brevet til Smyrna ikke har noen refselse: «se, jeg har satt foran dig en åpnet dør, og ingen kan lukke den til; for du har liten styrke, og har dog tatt vare på mitt ord». Byen, grunnlagt på 100-tallet f.Kr. av kongene av Pergamon og oppkalt etter Attalos II Filadelfos, lå ved porten til Frygias høyland, og noen leser den åpne døren som denne beliggenheten, andre som en dør for evangeliet. Løftet «Den som seirer, ham vil jeg gjøre til en støtte i min Guds tempel, og han skal aldri mere gå ut derfra» settes ofte opp mot en by som ble så rammet av jordskjelv, sier Strabon, at de fleste av innbyggerne bodde ute på landet."
    - "Tidlig på 100-tallet kom Ignatius av Antiokia gjennom under bevoktning og skrev senere til filadelfierne fra Troas. I middelalderen holdt Filadelfia stand som bysantinsk by midt i det tyrkiske Anatolia til 1390, da den falt til den osmanske sultanen Bayezid I. I sentrum av Alaşehir står de massive teglpilarene av en bysantinsk basilika kjent som Sankt Johannes-kirken."
  tl:
    - "Ang Filadelfia ng Apocalipsis ay ang Alaşehir sa lalawigan ng Manisa sa kanlurang Turkey, sa paanan ng Bundok Tmolus sa itaas ng lambak ng Cogamis, isang sanga ng Hermus; nasa bayan ang punto sa mapa. Mga 44 km ito sa silangan ng Sardis at 77 km sa hilagang-kanluran ng Laodicea sa tuwid na guhit, sa daan mula sa Sardis paakyat sa Frigia. Hindi ito ang isa pang Filadelfia noong panahong iyon, ang Rabba ng mga Ammonita, ang Amman ngayon, na pinangalanang muli ni Ptolemy II sa kaniyang sarili at naging lungsod ng Decapolis; hindi kailanman tinatawag ng Biblia na Filadelfia ang lungsod na iyon."
    - "Ang Apocalipsis, mga 95 AD, ay nagpapadala sa Filadelfia ng ikaanim sa pitong liham, na, gaya ng liham sa Smirna, ay walang pagsaway: “narito, inilagay ko sa harapan mo ang isang pintuang bukas, na di mailalapat ng sinoman”… “ikaw ay may kaunting kapangyarihan, at tinupad mo ang aking salita”. Ang lungsod, itinatag noong ika-2 siglo BK ng mga hari ng Pergamo at ipinangalan kay Attalus II Philadelphus, ay nakatayo sa pasukan ng kabundukan ng Frigia, at binabasa ng ilan ang bukas na pintuan bilang ang posisyong iyon, ng iba bilang pintuan para sa ebanghelyo. Ang pangakong “Ang magtagumpay, ay gagawin kong haligi sa templo ng aking Dios, at hindi na siya'y lalabas pa doon” ay madalas inihahambing sa isang lungsod na labis na niyayanig ng mga lindol, ayon kay Strabo, na ang karamihan ng mga tao nito ay naninirahan sa labas sa kanayunan."
    - "Noong simula ng ika-2 siglo, dumaan dito si Ignacio ng Antioquia sa ilalim ng bantay at kalaunan ay sumulat sa mga taga-Filadelfia mula sa Troas. Noong Gitnang Panahon, nanatili ang Filadelfia bilang lungsod ng Bizantino sa gitna ng Anatoliang Turko hanggang 1390, nang bumagsak ito sa sultan ng mga Otomano na si Bayezid I. Sa gitna ng Alaşehir ay nakatayo ang napakalaking ladrilyong haligi ng isang basilikang Bizantino na kilala bilang simbahan ni San Juan."
  da:
    - "Åbenbaringens Filadelfia er Alaşehir i provinsen Manisa i det vestlige Tyrkiet, ved foden af Tmolos-bjerget over Kogamis-dalen, en biflod til Hermos; kortets punkt står i byen. Den lå ca. 44 km øst for Sardes og 77 km nordvest for Laodikea i fugleflugt, på vejen fra Sardes op i Frygien. Den er ikke den anden Filadelfia fra dengang, ammonitternes Rabba, nutidens Amman, som Ptolemaios 2. omdøbte efter sig selv, og som blev en by i Dekapolis; Bibelen kalder aldrig den by Filadelfia."
    - "Johannes’ Åbenbaring, omkring 95 e.Kr., sender Filadelfia det sjette af de syv breve, som ligesom brevet til Smyrna ikke har nogen irettesættelse: »Se, jeg har givet dig, at der foran dig er en aabnet Dør, som ingen kan lukke; thi du har kun liden Kraft, og dog har du bevaret mit Ord«. Byen, grundlagt i 100-tallet f.Kr. af Pergamons konger og opkaldt efter Attalos 2. Filadelfos, lå ved porten til Frygiens højland, og nogle læser den åbne dør som denne beliggenhed, andre som en dør for evangeliet. Løftet »Den, som sejrer, ham vil jeg gøre til en Søjle i min Guds Tempel, og han skal ikke mere gaa ud derfra« sættes ofte op imod en by så rystet af jordskælv, siger Strabon, at de fleste af dens folk boede ude på landet."
    - "Tidligt i 100-tallet e.Kr. kom Ignatius af Antiokia forbi under bevogtning og skrev senere til filadelfierne fra Troas. I middelalderen holdt Filadelfia stand som byzantinsk by midt i det tyrkiske Anatolien indtil 1390, da den faldt til den osmanniske sultan Bayezid 1. I Alaşehirs centrum står de massive murstenspiller af en byzantinsk basilika kendt som Sankt Johannes-kirken."
  sr:
    - "Филаделфија из Откривења је Алашехир у провинцији Маниса у западној Турској, у подножју планине Тмол изнад долине Когамиса, притоке Херма; тачка на карти стоји у граду. Лежала је око 44 км источно од Сарда и 77 км северозападно од Лаодикије ваздушном линијом, на путу од Сарда горе у Фригију. То није друга Филаделфија тог доба, Рава Амонова, данашњи Аман, коју је Птолемеј II преименовао по себи и која је постала град Декаполиса; Библија тај град никад не назива Филаделфијом."
    - "Откривење, око 95. н. е., шаље Филаделфији шесто од седам писама које, као и писмо Смирни, нема прекора: „гле, дадох пред тобом врата отворена, и нико их не може затворити; јер имаш мало силе, и држао си моју реч“. Град, који су у другом веку п. н. е. основали пергамски краљеви и назвали га по Аталу II Филаделфу, стајао је на капији горја Фригије, а неки отворена врата читају као тај положај, други као врата за јеванђеље. Обећање „Који победи учинићу га стубом у цркви Бога свог, и више неће изићи напоље“ често се супротставља граду који су земљотреси толико потресали, каже Страбон, да је већина његових становника живела напољу на селу."
    - "Почетком другог века Игњатије Антиохијски прошао је под стражом и касније писао Филаделфијанима из Троаде. У средњем веку Филаделфија се као византијски град држала усред турске Анадолије све до 1390, кад је пала у руке османског султана Бајазита I. У средишту Алашехира стоје масивни стубови од опеке византијске базилике познате као црква светог Јована."
