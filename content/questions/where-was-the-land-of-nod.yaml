id: where-was-the-land-of-nod
question:
  en: "Where was the land of Nod, where Cain went?"
  ru: "Где находилась земля Нод, куда ушёл Каин?"
  uk: "Де була земля Нод, куди пішов Каїн?"
  es: "¿Dónde estaba la tierra de Nod, adonde fue Caín?"
  pt: "Onde ficava a terra de Node, para onde Caim foi?"
  de: "Wo lag das Land Nod, wohin Kain ging?"
  fr: "Où se trouvait la terre de Nod, où alla Caïn ?"
  pl: "Gdzie leżała ziemia Nod, dokąd poszedł Kain?"
  it: "Dov’era la terra di Nod, dove andò Caino?"
  cs: "Kde ležela země Nód, kam odešel Kain?"
  nl: "Waar lag het land Nod, waarheen Kaïn ging?"
  sv: "Var låg landet Nod, dit Kain drog?"
  nb: "Hvor lå landet Nod, dit Kain dro?"
  tl: "Nasaan ang lupain ng Nod, kung saan nagtungo si Cain?"
answer:
  en:
    - "No one knows: the Bible places the land of Nod only “on the east of Eden”, and Eden itself cannot be fixed on a map, so the map shows the verse rather than a point. Genesis says that “Cain went out from the presence of the LORD, and dwelt in the land of Nod, on the east of Eden”, and that there he built a city and named it Enoch after his son. No ancient text outside Genesis and its retellings names such a country, and no attempt to match it with a real region has won acceptance."
    - "Most commentators take the name as a play on words. Nod comes from the Hebrew verb for wandering, the same root as Cain's sentence a few verses earlier: “a fugitive and a vagabond shalt thou be in the earth”, which Cain repeats in his complaint. The land of Nod is then the land of wandering, the condition of the exile put as a place. Eusebius, following the Greek Bible's Naid, notes only that it was the land where Cain dwelt and that the name means “restlessness”."
    - "Josephus retells the story differently: Cain, having travelled over many countries, built with his wife a city named Nod and settled there, so that in his account Nod is the name of a city. Attempts to place it somewhere east of Mesopotamia, in Iran or further into Asia, rest on guesses about Eden and have no evidence behind them. In English “the land of Nod” later became a jesting name for sleep, a pun that has nothing to do with Genesis."
  ru:
    - "Этого никто не знает: Библия помещает землю Нод лишь «на восток от Едема», а сам Едем на карте не найти, поэтому карта показывает стих, а не точку. Книга Бытия говорит: «И пошел Каин от лица Господня и поселился в земле Нод, на восток от Едема», и там он построил город и назвал его Енох по имени сына. Ни один древний текст, кроме Бытия и его пересказов, такой страны не называет, и ни одна попытка связать её с реальной областью не получила признания."
    - "Большинство толкователей видят в названии игру слов. Нод происходит от еврейского глагола «скитаться» — того же корня, что и приговор Каину несколькими стихами раньше: «ты будешь изгнанником и скитальцем на земле», и Каин повторяет эти слова в своей жалобе. Земля Нод тогда — земля скитания, участь изгнанника, названная как место. Евсевий, следуя греческому «Наид», отмечает лишь, что это земля, где жил Каин, и что имя значит «беспокойство»."
    - "Иосиф Флавий пересказывает историю иначе: Каин, пройдя многие страны, построил с женой город по имени Нод и поселился в нём, так что у него Нод — название города. Попытки поместить его где-то к востоку от Месопотамии, в Иране или дальше в Азии, держатся на догадках о Едеме и не опираются ни на какие данные. В английском языке «земля Нод» позднее стала шутливым названием сна — каламбур, к Бытию отношения не имеющий."
  uk:
    - "Ніхто не знає: Біблія поміщає землю Нод лише «на востоцї ʼд Едену», а сам Еден неможливо зафіксувати на мапі, тож мапа показує вірш, а не точку. Книга Буття каже, що «зійшов Каїн од обличчя Господнього, і пробував у Нод-землї, на востоцї ʼд Едену», і що там він збудував місто й назвав його Енохом на честь сина. Жоден давній текст поза Книгою Буття та її переказами не називає такої країни, і жодна спроба зіставити її з реальною областю не здобула визнання."
    - "Більшість коментаторів вважають назву грою слів. Нод походить від єврейського дієслова «блукати», того самого кореня, що й вирок Каїнові кількома віршами раніше: «Волоцюгою й утїкачем будеш на землї», який Каїн повторює у своєму скарженні. Земля Нод тоді — земля блукання, стан вигнанця, виражений як місце. Євсевій, услід за Наїдом грецької Біблії, зауважує лише, що це була земля, де жив Каїн, і що назва означає «неспокій»."
    - "Йосиф Флавій переказує історію інакше: Каїн, обійшовши багато країн, збудував зі своєю дружиною місто на ім'я Нод і оселився там, так що в його викладі Нод — назва міста. Спроби розмістити її десь на схід від Месопотамії, в Ірані чи далі в Азії спираються на здогади про Еден і не мають доказів. В англійській мові «земля Нод» пізніше стала жартівливою назвою сну — гра слів, яка не має нічого спільного з Книгою Буття."
  es:
    - "Nadie lo sabe: la Biblia sitúa la tierra de Nod solo «al oriente de Edén», y el propio Edén no puede fijarse en un mapa, por lo que el mapa muestra el versículo y no un punto. El Génesis dice que «salió Caín de delante de Jehová, y habitó en tierra de Nod, al oriente de Edén», y que allí edificó una ciudad y la llamó Enoc, por su hijo. Ningún texto antiguo fuera del Génesis y de sus relecturas nombra tal país, y ningún intento de identificarlo con una región real ha sido aceptado."
    - "La mayoría de los comentaristas toman el nombre como un juego de palabras. Nod procede del verbo hebreo para vagar, la misma raíz que la sentencia de Caín unos versículos antes: «errante y extranjero serás en la tierra», que Caín repite en su queja. La tierra de Nod es entonces la tierra del errar, la condición del desterrado puesta como un lugar. Eusebio, siguiendo el Naid de la Biblia griega, señala solo que era la tierra donde habitó Caín y que el nombre significa «inquietud»."
    - "Josefo cuenta la historia de otro modo: Caín, tras recorrer muchos países, construyó con su mujer una ciudad llamada Nod y se estableció en ella, de modo que en su relato Nod es el nombre de una ciudad. Los intentos de situarla al este de Mesopotamia, en Irán o más adentro de Asia, se apoyan en conjeturas sobre el Edén y no tienen pruebas detrás. En inglés, «the land of Nod» pasó después a ser un nombre jocoso para el sueño, un juego de palabras que nada tiene que ver con el Génesis."
  pt:
    - "Ninguém sabe: a Bíblia situa a terra de Node apenas “a leste do Éden”, e o próprio Éden não pode ser fixado num mapa, de modo que o mapa mostra o versículo e não um ponto. O Gênesis diz que “Caim saiu da presença do SENHOR e foi habitar na terra de Node, a leste do Éden”, e que ali construiu uma cidade e lhe deu o nome de Enoque, em honra de seu filho. Nenhum texto antigo fora do Gênesis e de suas retomadas nomeia tal país, e nenhuma tentativa de identificá-lo com uma região real ganhou aceitação."
    - "A maioria dos comentaristas toma o nome como um jogo de palavras. Node vem do verbo hebraico que significa vagar, a mesma raiz da sentença de Caim, poucos versículos antes: “Você será um fugitivo e um errante pela terra”, que Caim repete em sua queixa. A terra de Node é então a terra do vaguear, a condição do exilado posta como lugar. Eusébio, seguindo o Naíd da Bíblia grega, observa apenas que era a terra onde Caim habitou e que o nome significa “inquietação”."
    - "Josefo reconta a história de outro modo: Caim, tendo percorrido muitos países, construiu com sua mulher uma cidade chamada Node e se estabeleceu ali, de modo que em seu relato Node é o nome de uma cidade. As tentativas de situá-la a leste da Mesopotâmia, no Irã ou mais adiante na Ásia, apoiam-se em conjecturas sobre o Éden e não têm evidência por trás. Em inglês, “the land of Nod” tornou-se mais tarde um nome jocoso para o sono, um trocadilho que nada tem a ver com o Gênesis."
  de:
    - "Niemand weiß es: Die Bibel setzt das Land Nod nur „jenseit Eden, gegen Morgen“, und Eden selbst lässt sich nicht auf einer Karte festlegen, sodass die Karte den Vers statt eines Punktes zeigt. Die Genesis sagt: „Also ging Kain von dem Angesicht des HERRN und wohnte im Lande Nod, jenseit Eden, gegen Morgen“, und dass er dort eine Stadt baute und sie nach seinem Sohn Henoch nannte. Kein antiker Text außerhalb der Genesis und ihrer Nacherzählungen nennt ein solches Land, und kein Versuch, es mit einer wirklichen Region gleichzusetzen, hat sich durchgesetzt."
    - "Die meisten Ausleger verstehen den Namen als Wortspiel. Nod kommt vom hebräischen Verb für Umherirren, derselben Wurzel wie Kains Urteil einige Verse zuvor: „Unstet und flüchtig sollst du sein auf Erden“, was Kain in seiner Klage wiederholt. Das Land Nod ist dann das Land des Umherirrens, der Zustand des Verbannten als Ort ausgedrückt. Eusebius, der dem Naid der griechischen Bibel folgt, vermerkt nur, es sei das Land gewesen, in dem Kain wohnte, und der Name bedeute „Unruhe“."
    - "Josephus erzählt die Geschichte anders: Kain habe, nachdem er viele Länder durchreist hatte, mit seiner Frau eine Stadt namens Nod gebaut und sich dort niedergelassen, sodass Nod bei ihm der Name einer Stadt ist. Versuche, es östlich von Mesopotamien zu verorten, in Iran oder weiter in Asien, beruhen auf Vermutungen über Eden und haben keinen Beleg. Im Englischen wurde „the land of Nod“ später zu einem scherzhaften Namen für den Schlaf, ein Wortspiel, das mit der Genesis nichts zu tun hat."
  fr:
    - "Personne ne le sait : la Bible ne situe la terre de Nod que « à l’orient d’Éden », et Éden lui-même ne peut être fixé sur une carte, si bien que la carte montre le verset plutôt qu’un point. La Genèse dit que « Caïn s’éloigna de la face de l’Éternel, et habita dans la terre de Nod, à l’orient d’Éden », et qu’il y bâtit une ville qu’il nomma Hénoc, du nom de son fils. Aucun texte ancien en dehors de la Genèse et de ses reprises ne nomme un tel pays, et aucune tentative de l’identifier à une région réelle n’a été admise."
    - "La plupart des commentateurs prennent le nom pour un jeu de mots. Nod vient du verbe hébreu qui désigne l’errance, la même racine que la sentence portée contre Caïn quelques versets plus haut : « Tu seras errant et vagabond sur la terre », que Caïn reprend dans sa plainte. La terre de Nod est alors le pays de l’errance, la condition de l’exilé exprimée comme un lieu. Eusèbe, suivant le Naid de la Bible grecque, note seulement que c’était le pays où Caïn habita et que le nom signifie « agitation »."
    - "Flavius Josèphe raconte l’histoire autrement : Caïn, ayant parcouru de nombreux pays, bâtit avec sa femme une ville nommée Nod et s’y établit, de sorte que chez lui Nod est le nom d’une ville. Les tentatives pour la placer à l’est de la Mésopotamie, en Iran ou plus avant en Asie reposent sur des conjectures à propos d’Éden et n’ont aucune preuve derrière elles. En anglais, « the land of Nod » est devenu plus tard un nom plaisant du sommeil, jeu de mots sans rapport avec la Genèse."
  pl:
    - "Nikt nie wie: Biblia umieszcza ziemię Nod tylko „na wschód słońca od Eden”, a samego Edenu nie da się ustalić na mapie, więc mapa pokazuje werset, a nie punkt. Księga Rodzaju mówi, że „odszedł Kain od oblicza Pańskiego, i mieszkał w ziemi Nod, na wschód słońca od Eden”, i że tam zbudował miasto i nazwał je Henoch od imienia swego syna. Żaden starożytny tekst poza Księgą Rodzaju i jej opowiedzeniami nie wymienia takiego kraju, a żadna próba dopasowania go do rzeczywistego regionu nie zyskała uznania."
    - "Większość komentatorów traktuje tę nazwę jako grę słów. Nod pochodzi od hebrajskiego czasownika oznaczającego wędrowanie, od tego samego rdzenia co wyrok na Kaina kilka wersetów wcześniej: „tułaczem, i biegunem będziesz na ziemi”, który Kain powtarza w swojej skardze. Ziemia Nod jest więc ziemią wędrowania, stanem wygnańca ujętym jako miejsce. Euzebiusz, idąc za Naid greckiej Biblii, zaznacza tylko, że była to ziemia, gdzie mieszkał Kain, a nazwa oznacza „niepokój”."
    - "Józef Flawiusz opowiada tę historię inaczej: Kain, przebywszy wiele krajów, zbudował wraz z żoną miasto zwane Nod i tam się osiedlił, tak że w jego relacji Nod jest nazwą miasta. Próby umieszczenia go gdzieś na wschód od Mezopotamii, w Iranie lub dalej w Azji, opierają się na domysłach o Edenie i nie mają za sobą żadnych dowodów. W angielskim „land of Nod” stało się później żartobliwą nazwą snu, kalamburem, który nie ma nic wspólnego z Księgą Rodzaju."
  it:
    - "Nessuno lo sa: la Bibbia colloca la terra di Nod solo «ad oriente di Eden», e lo stesso Eden non può essere fissato su una mappa, così che la mappa mostra il versetto anziché un punto. La Genesi dice che «Caino si partì dal cospetto dell’Eterno e dimorò nel paese di Nod, ad oriente di Eden», e che lì costruì una città e la chiamò Enoc dal nome del figlio. Nessun testo antico al di fuori della Genesi e delle sue rielaborazioni nomina un tale paese, e nessun tentativo di farlo corrispondere a una regione reale ha ottenuto accettazione."
    - "La maggior parte dei commentatori intende il nome come un gioco di parole. Nod deriva dal verbo ebraico per «vagare», la stessa radice della sentenza di Caino pochi versetti prima: «tu sarai vagabondo e fuggiasco sulla terra», che Caino ripete nel suo lamento. La terra di Nod è allora la terra dell’errare, la condizione dell’esule espressa come luogo. Eusebio, seguendo il Naid della Bibbia greca, nota soltanto che era la terra in cui Caino dimorò e che il nome significa «irrequietezza»."
    - "Giuseppe Flavio racconta la storia in modo diverso: Caino, dopo aver percorso molti paesi, costruì con la moglie una città chiamata Nod e vi si stabilì, così che nel suo racconto Nod è il nome di una città. I tentativi di collocarla da qualche parte a est della Mesopotamia, in Iran o più oltre in Asia, poggiano su congetture su Eden e non hanno prove dietro di sé. In inglese «the land of Nod» divenne poi un nome scherzoso per il sonno, un gioco di parole che non ha nulla a che fare con la Genesi."
  cs:
    - "Nikdo neví: Bible klade zemi Nód jen „k východní straně naproti Eden“ a samotný Eden nelze na mapě určit, takže mapa ukazuje verš místo bodu. Genesis říká, že „odšed Kain od tváři Hospodinovy, bydlil v zemi Nód, k východní straně naproti Eden“, a že tam vystavěl město a nazval je Enoch po svém synu. Žádný starověký text mimo Genesis a její převyprávění takovou zemi nejmenuje a žádný pokus o ztotožnění se skutečným krajem nezískal uznání."
    - "Většina komentátorů bere jméno jako slovní hříčku. Nód pochází z hebrejského slovesa pro potulování, téhož kořene jako Kainův trest o pár veršů dříve: „tulákem a běhounem budeš na zemi“, což Kain opakuje ve své stížnosti. Země Nód je tedy země potulek, stav vyhnance vyjádřený jako místo. Eusebios, který následuje tvar Naid v řecké Bibli, poznamenává jen, že to byla země, kde Kain bydlel, a že jméno znamená „neklid“."
    - "Josephus vypráví příběh jinak: Kain, procestovav mnoho zemí, vystavěl se svou ženou město jménem Nód a usadil se v něm, takže v jeho podání je Nód jménem města. Pokusy umístit je někam východně od Mezopotámie, do Íránu nebo hlouběji do Asie, se opírají o dohady o Edenu a nemají za sebou žádný doklad. V angličtině se „land of Nod“ později stalo žertovným jménem pro spánek, slovní hříčka, která s Genesis nemá nic společného."
  nl:
    - "Niemand weet het: de Bijbel plaatst het land Nod alleen “ten oosten van Eden”, en Eden zelf kan niet op een kaart worden vastgelegd, zodat de kaart het vers toont in plaats van een punt. Genesis zegt: “Kain ging uit van het aangezicht des HEEREN; en hij woonde in het land Nod, ten oosten van Eden”, en dat hij daar een stad bouwde en haar naar zijn zoon Henoch noemde. Geen oude tekst buiten Genesis en zijn navertellingen noemt zo'n land, en geen poging om het met een werkelijke streek te vereenzelvigen heeft aanvaarding gevonden."
    - "De meeste uitleggers vatten de naam op als een woordspeling. Nod komt van het Hebreeuwse werkwoord voor zwerven, dezelfde stam als Kaïns vonnis enkele verzen eerder: “zwervende en dolende zijn op aarde”, wat Kaïn in zijn klacht herhaalt. Het land Nod is dan het land van het zwerven, de toestand van de ballingschap als plaats uitgedrukt. Eusebius, die de Griekse Bijbel met Naid volgt, merkt alleen op dat het het land was waar Kaïn woonde en dat de naam “onrust” betekent."
    - "Josephus vertelt het verhaal anders: Kaïn bouwde, na vele landen te hebben doorreisd, met zijn vrouw een stad genaamd Nod en vestigde zich daar, zodat Nod in zijn verslag de naam van een stad is. Pogingen om het ten oosten van Mesopotamië te plaatsen, in Iran of verder in Azië, berusten op gissingen over Eden en hebben geen bewijs. In het Engels werd “the land of Nod” later een grappige naam voor slaap, een woordspeling die niets met Genesis te maken heeft."
  sv:
    - "Ingen vet: Bibeln placerar landet Nod bara ”öster om Eden”, och Eden själv kan inte fixeras på en karta, så kartan visar versen i stället för en punkt. Första Moseboken säger att ”Kain gick bort ifrån HERRENS ansikte och bosatte sig i landet Nod, öster om Eden”, och att han där byggde en stad och kallade den Henok efter sin son. Ingen antik text utanför Första Moseboken och dess återberättelser nämner ett sådant land, och inget försök att koppla det till en verklig region har vunnit acceptans."
    - "De flesta kommentatorer tar namnet som ett ordspel. Nod kommer från det hebreiska verbet för att vandra, samma rot som Kains dom några verser tidigare: ”Ostadig och flyktig skall du bliva på jorden”, som Kain upprepar i sin klagan. Landet Nod är då vandringens land, förvisningens tillstånd uttryckt som en plats. Eusebios, som följer den grekiska Bibelns Naid, noterar bara att det var landet där Kain bodde och att namnet betyder ”rastlöshet”."
    - "Josefus återberättar historien annorlunda: Kain, som hade rest genom många länder, byggde tillsammans med sin hustru en stad som hette Nod och bosatte sig där, så att Nod i hans berättelse är namnet på en stad. Försök att placera det någonstans öster om Mesopotamien, i Iran eller längre in i Asien, vilar på gissningar om Eden och saknar belägg. På engelska blev ”the land of Nod” senare ett skämtsamt namn på sömn, ett ordspel som inte har med Första Moseboken att göra."
  nb:
    - "Ingen vet det: Bibelen plasserer landet Nod bare «østenfor Eden», og Eden selv kan ikke fastsettes på et kart, så kartet viser verset snarere enn et punkt. Første Mosebok sier at «Så gikk Kain bort fra Herrens åsyn og bosatte sig i landet Nod, østenfor Eden», og at han der bygde en by og kalte den Enok etter sin sønn. Ingen antikk tekst utenfor Første Mosebok og dens gjenfortellinger nevner et slikt land, og intet forsøk på å knytte det til en virkelig region har vunnet tilslutning."
    - "De fleste kommentatorer tar navnet som et ordspill. Nod kommer av det hebraiske verbet for å flakke, samme rot som Kains dom noen vers tidligere: «omflakkende og hjemløs skal du være på jorden», som Kain gjentar i sin klage. Landet Nod er da flakkets land, eksilets tilstand fremstilt som et sted. Eusebius, som følger den greske bibelens Naid, bemerker bare at det var landet der Kain bodde, og at navnet betyr «rastløshet»."
    - "Josefus gjenforteller historien annerledes: Kain, som hadde reist gjennom mange land, bygde sammen med sin hustru en by kalt Nod og slo seg ned der, slik at Nod i hans fremstilling er navnet på en by. Forsøk på å plassere det et sted øst for Mesopotamia, i Iran eller lenger inn i Asia, hviler på gjetninger om Eden og har ingen beviser bak seg. På engelsk ble «the land of Nod» senere et spøkefullt navn på søvn, et ordspill som ikke har noe med Første Mosebok å gjøre."
  tl:
    - "Walang nakakaalam: inilalagay lamang ng Biblia ang lupain ng Nod “sa silanganan ng Eden”, at ang Eden mismo ay hindi maitatakda sa mapa, kaya ipinapakita ng mapa ang talata sa halip na isang punto. Sinasabi ng Genesis na “umalis si Cain sa harapan ng Panginoon at tumahan sa lupain ng Nod, sa silanganan ng Eden”, at na doon ay nagtayo siya ng lungsod at pinangalanan itong Enoc sa pangalan ng kaniyang anak. Walang sinaunang tekstong labas sa Genesis at sa mga pagsasalaysay muli nito ang nagpapangalan sa gayong bansa, at walang pagtatangkang iugnay ito sa isang tunay na rehiyon ang nagtagumpay."
    - "Karamihan ng mga komentarista ay itinuturing na laro sa salita ang pangalan. Ang Nod ay hango sa pandiwang Hebreo para sa pagpapagala-gala, ang parehong ugat ng hatol kay Cain ilang talata bago nito: “ikaw ay magiging palaboy at hampas-lupa sa lupa”, na inuulit ni Cain sa kaniyang pagdaing. Ang lupain ng Nod ay ang lupain ng pagpapagala-gala, ang kalagayan ng destiyero na inilagay bilang isang lugar. Si Eusebio, na sumusunod sa Naid ng Biblia sa Griyego, ay nagtatala lamang na ito ang lupaing tinirhan ni Cain at na ang pangalan ay nangangahulugang “pagkabalisa”."
    - "Iba ang pagsasalaysay ni Josephus: si Cain, matapos maglakbay sa maraming bansa, ay nagtayo kasama ng kaniyang asawa ng lungsod na pinangalanang Nod at nanirahan doon, kaya sa kaniyang salaysay ang Nod ay pangalan ng isang lungsod. Ang mga pagtatangkang ilagay ito sa silangan ng Mesopotamia, sa Iran o mas malayo sa Asia, ay nakasalalay sa mga hula tungkol sa Eden at walang ebidensiya. Sa Ingles, ang “the land of Nod” ay naging birong pangalan para sa tulog, isang laro sa salita na walang kinalaman sa Genesis."
