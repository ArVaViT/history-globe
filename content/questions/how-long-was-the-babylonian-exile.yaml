id: how-long-was-the-babylonian-exile
question:
  en: "How long did the Babylonian exile last?"
  ru: "Сколько длился вавилонский плен?"
  uk: "Як довго тривало Вавилонське вигнання?"
  es: "¿Cuánto duró el exilio en Babilonia?"
  pt: "Quanto durou o exílio na Babilônia?"
  de: "Wie lange dauerte das babylonische Exil?"
  fr: "Combien de temps a duré l’exil à Babylone ?"
  pl: "Jak długo trwała niewola babilońska?"
  it: "Quanto durò l’esilio babilonese?"
  nl: "Hoe lang duurde de Babylonische ballingschap?"
  cs: "Jak dlouho trvalo babylónské vyhnanství?"
  sv: "Hur länge varade den babyloniska exilen?"
  nb: "Hvor lenge varte det babylonske eksilet?"
  tl: "Gaano katagal ang pagkatapon sa Babilonia?"
  da: "Hvor længe varede eksilet i Babylon?"
answer:
  en:
    - "About fifty to seventy years, depending on where one starts and stops. The first deportation from Jerusalem came in March 597 BC, when Nebuchadnezzar took the city and carried off King Jehoiachin; the Temple was burned in 586 (587 is also held); and Cyrus let the exiles return in 538. From the first deportation to the return is 59 years, from the fall of the Temple 48; from the Temple's burning to its rebuilding in 516 is 70."
    - "Jeremiah had set the term: “these nations shall serve the king of Babylon seventy years”, and “after seventy years be accomplished at Babylon I will visit you”. The Chronicler counts those years as the land's missed sabbaths, Daniel “understood by books the number of the years”, and Zechariah's angel, about 519 BC, still asks how long the Lord's anger against Jerusalem will last, “these threescore and ten years”. Readers have fitted the seventy years in several ways: from Nebuchadnezzar's first campaign in 605 to Cyrus' decree (67 years), from 586 to the finished Temple in 516 (70), or as a round number for a lifetime."
    - "The deportations themselves were three: in 597, when “all the princes, and all the mighty men of valour, even ten thousand captives” were taken; in 586, after the city burned; and in 582, when Jeremiah counts a further 745 persons. Cuneiform tablets from a settlement called Al-Yahudu, “Judah-town”, and its neighbours in Babylonia, dated from 572 to 477 BC, show Judeans farming there generations after the return began, and the community that stayed grew into the Babylonian Jewry of the Talmud a thousand years later."
  ru:
    - "Примерно от пятидесяти до семидесяти лет, смотря откуда и докуда считать. Первое переселение из Иерусалима было в марте 597 г. до н. э., когда Навуходоносор взял город и увёл царя Иехонию; Храм сгорел в 586 г. (называют и 587-й); Кир отпустил переселенцев в 538-м. От первого переселения до возвращения — 59 лет, от гибели Храма — 48; от сожжения Храма до его восстановления в 516 г. — 70."
    - "Срок назначил Иеремия: «народы сии будут служить царю Вавилонскому семьдесят лет» и «когда исполнится вам в Вавилоне семьдесят лет, тогда Я посещу вас». Летописец считает эти годы как субботы, которых не праздновала земля, Даниил «сообразил по книгам число лет», а ангел у Захарии около 519 г. всё ещё спрашивает, доколе продлится гнев Господа на Иерусалим — «вот уже семьдесят лет». Семьдесят лет укладывали по-разному: от первого похода Навуходоносора в 605 г. до указа Кира (67 лет), от 586 г. до завершённого Храма в 516-м (70) или как круглое число — срок человеческой жизни."
    - "Самих переселений было три: в 597 г., когда увели «всех князей, и все храброе войско, — десять тысяч было переселенных»; в 586-м, после сожжения города; и в 582-м, когда Иеремия насчитывает ещё 745 человек. Клинописные таблички из поселения Аль-Яхуду, «Иудейский город», и соседних с ним в Вавилонии, датированные 572–477 гг. до н. э., показывают иудеев, возделывавших там землю, — поколения спустя после начала возвращения, а оставшаяся община выросла в вавилонское еврейство Талмуда тысячу лет спустя."
  uk:
    - "Приблизно від п'ятдесяти до сімдесяти років, залежно від того, звідки починати і де закінчувати. Перша депортація з Єрусалиму відбулася в березні 597 р. до н. е., коли Навуходоносор узяв місто й вивів царя Єхонію; Храм було спалено 586 р. (також називають 587); а Кір дозволив вигнанцям повернутися 538 р. Від першої депортації до повернення 59 років, від падіння Храму 48; від спалення Храму до його відбудови 516 р. — 70."
    - "Єремія визначив строк: «служити муть сї народи цареві Вавилонському сїмдесять років» і «аж як упливе вам повних сїмдесять років у Вавилонї, аж тодї я навідаюсь до вас». Автор Хронік розглядає ці роки як пропущені землею суботи, Даниїл «дослїдив із книг число років», а ангел у Захарії близько 519 р. до н. е. ще питає, доки триватиме гнів Господа на Єрусалим, «уже сїмдесять років». Читачі вкладали сімдесят років по-різному: від першого походу Навуходоносора 605 р. до указу Кіра (67 років), від 586 р. до завершеного Храму 516 р. (70) або як круге число на цілий вік."
    - "Самих депортацій було три: 597 р., коли було забрано «усїх князїв, і все хоробре військо — десять тисяч»; 586 р., після спалення міста; і 582 р., коли Єремія рахує ще 745 осіб. Клинописні таблички з поселення Аль-Яхуду, «Юдиного міста», та його сусідів у Вавилонії, датовані 572–477 рр. до н. е., показують юдеїв, які вели там господарство через покоління після початку повернення, а громада, що залишилася, виросла у вавилонське єврейство Талмуду тисячу років по тому."
  es:
    - "Entre cincuenta y setenta años, según dónde se empiece y se termine. La primera deportación desde Jerusalén tuvo lugar en marzo del 597 a. C., cuando Nabucodonosor tomó la ciudad y se llevó al rey Joaquín; el Templo fue incendiado en el 586 (también se sostiene el 587); y Ciro permitió el regreso de los desterrados en el 538. De la primera deportación al regreso hay 59 años, de la caída del Templo 48; del incendio del Templo a su reconstrucción en el 516 hay 70."
    - "Jeremías había fijado el plazo: «servirán estas gentes al rey de Babilonia setenta años», y «cuando en Babilonia se cumplieren los setenta años, yo os visitaré». El cronista cuenta esos años como los sábados que la tierra no había tenido, Daniel dice: «miré atentamente en los libros el número de los años», y el ángel de Zacarías, hacia el 519 a. C., sigue preguntando hasta cuándo durará la ira del Señor contra Jerusalén, «por espacio de setenta años». Los lectores han encajado los setenta años de varias maneras: desde la primera campaña de Nabucodonosor en el 605 hasta el decreto de Ciro (67 años), desde el 586 hasta el Templo terminado en el 516 (70), o como una cifra redonda para una vida."
    - "Las deportaciones fueron tres: en el 597, cuando se llevaron a «todos los príncipes, y á todos los hombres valientes, hasta diez mil cautivos»; en el 586, tras el incendio de la ciudad; y en el 582, cuando Jeremías cuenta otras 745 personas. Tablillas cuneiformes de un asentamiento llamado Al-Yahudu, «ciudad de Judá», y de sus vecinos en Babilonia, fechadas entre 572 y 477 a. C., muestran a judíos que cultivaban la tierra allí generaciones después de iniciado el regreso, y la comunidad que se quedó llegó a ser el judaísmo babilónico del Talmud mil años después."
  pt:
    - "Cerca de cinquenta a setenta anos, conforme o ponto de partida e de chegada. A primeira deportação de Jerusalém ocorreu em março de 597 a.C., quando Nabucodonosor tomou a cidade e levou o rei Joaquim; o Templo foi queimado em 586 (também se defende 587); e Ciro permitiu o regresso dos exilados em 538. Da primeira deportação ao regresso são 59 anos, da queda do Templo 48; da queima do Templo à sua reconstrução em 516 são 70."
    - "Jeremias fixara o prazo: “estas nações servirão ao rei da Babilônia por setenta anos”, e “quando se completarem setenta anos para a Babilônia, eu os visitarei”. O Cronista conta esses anos como os sábados que a terra perdera, Daniel “entendeu pelos livros o número de anos”, e o anjo de Zacarias, por volta de 519 a.C., ainda pergunta até quando durará a ira do Senhor contra Jerusalém, “nestes setenta anos”. Os leitores ajustaram os setenta anos de várias maneiras: da primeira campanha de Nabucodonosor em 605 ao decreto de Ciro (67 anos), de 586 ao Templo concluído em 516 (70), ou como número redondo para uma vida inteira."
    - "As deportações foram três: em 597, quando foram levados “todos os príncipes e todos os guerreiros valentes, dez mil cativos ao todo”; em 586, depois que a cidade foi queimada; e em 582, quando Jeremias conta mais 745 pessoas. Tabuinhas cuneiformes de um povoado chamado Al-Yahudu, “cidade de Judá”, e de seus vizinhos na Babilônia, datadas de 572 a 477 a.C., mostram judaítas cultivando a terra ali gerações depois de começado o regresso, e a comunidade que ficou se tornou o judaísmo babilônico do Talmude, mil anos depois."
  de:
    - "Etwa fünfzig bis siebzig Jahre, je nachdem, wo man beginnt und endet. Die erste Wegführung aus Jerusalem geschah im März 597 v. Chr., als Nebukadnezar die Stadt einnahm und König Jojachin wegführte; der Tempel wurde 586 verbrannt (auch 587 wird vertreten); und Kyrus ließ die Verbannten 538 heimkehren. Von der ersten Wegführung bis zur Rückkehr sind es 59 Jahre, vom Fall des Tempels 48; vom Brand des Tempels bis zu seinem Wiederaufbau 516 sind es 70."
    - "Jeremia hatte die Frist gesetzt: „Und sollen diese Völker dem König zu Babel dienen siebzig Jahre“, und: „Wenn zu Babel siebzig Jahre aus sind, so will ich euch besuchen“. Der Chronist zählt diese Jahre als die versäumten Sabbate des Landes, Daniel „merkte ... in den Büchern auf die Zahl der Jahre“, und der Engel bei Sacharja fragt um 519 v. Chr. noch, wie lange der Zorn des Herrn gegen Jerusalem währen werde, „über welche du zornig bist gewesen diese siebzig Jahre“. Die Leser haben die siebzig Jahre auf mehrere Weisen eingepasst: von Nebukadnezars erstem Feldzug 605 bis zu Kyrus' Erlass (67 Jahre), von 586 bis zum vollendeten Tempel 516 (70) oder als runde Zahl für ein Menschenleben."
    - "Die Wegführungen selbst waren drei: 597, als „alle Obersten, alle Gewaltigen, zehntausend Gefangene“ weggeführt wurden; 586, nach dem Brand der Stadt; und 582, als Jeremia weitere 745 Personen zählt. Keilschrifttafeln aus einer Siedlung namens Al-Yahudu, „Judastadt“, und ihren Nachbarorten in Babylonien, datiert von 572 bis 477 v. Chr., zeigen Judäer, die dort noch Generationen nach Beginn der Rückkehr Landwirtschaft betrieben, und die Gemeinde, die blieb, wuchs zum babylonischen Judentum des Talmud tausend Jahre später heran."
  fr:
    - "Environ cinquante à soixante-dix ans, selon le point de départ et d’arrivée. La première déportation de Jérusalem eut lieu en mars 597 av. J.-C., quand Nebucadnetsar prit la ville et emmena le roi Jojakin ; le Temple fut brûlé en 586 (587 est aussi retenu) ; et Cyrus laissa revenir les exilés en 538. De la première déportation au retour, il y a 59 ans, de la chute du Temple 48 ; de l’incendie du Temple à sa reconstruction en 516, 70."
    - "Jérémie avait fixé le terme : « ces nations seront asservies au roi de Babylone pendant soixante-dix ans », et « dès que soixante-dix ans seront écoulés pour Babylone, je me souviendrai de vous ». Le Chroniqueur compte ces années comme les sabbats que le pays n’avait pas connus, Daniel comprit « par les livres » le « nombre des années », et l’ange de Zacharie, vers 519 av. J.-C., demande encore jusqu’à quand durera la colère du Seigneur contre Jérusalem, « depuis soixante-dix ans ». Les lecteurs ont fait entrer ces soixante-dix ans de plusieurs façons : de la première campagne de Nebucadnetsar en 605 au décret de Cyrus (67 ans), de 586 au Temple achevé en 516 (70), ou comme un nombre rond pour une vie."
    - "Les déportations furent trois : en 597, quand furent emmenés « tous les chefs et tous les hommes vaillants, au nombre de dix mille exilés » ; en 586, après l’incendie de la ville ; et en 582, où Jérémie compte encore 745 personnes. Des tablettes cunéiformes d’une localité nommée Al-Yahudu, « la ville de Juda », et de ses voisines en Babylonie, datées de 572 à 477 av. J.-C., montrent des Judéens y cultivant la terre des générations après le début du retour, et la communauté restée sur place devint le judaïsme babylonien du Talmud mille ans plus tard."
  pl:
    - "Od pięćdziesięciu do siedemdziesięciu lat, zależnie od tego, od kiedy do kiedy się liczy. Pierwsza deportacja z Jerozolimy nastąpiła w marcu 597 p.n.e., gdy Nabuchodonozor zdobył miasto i uprowadził króla Jojakina; Świątynię spalono w 586 (przyjmuje się też 587); a Cyrus pozwolił wygnańcom wrócić w 538. Od pierwszej deportacji do powrotu mija 59 lat, od upadku Świątyni 48; od spalenia Świątyni do jej odbudowy w 516 jest 70."
    - "Jeremiasz wyznaczył ten okres: „służyć będą te narody królowi Babilońskiemu siedmdziesiąt lat” i „Jako się jedno wypełnią siedmdziesiąt lat Babilonowi, nawiedzę was”. Kronikarz liczy te lata jako pominięte szabaty ziemi, Daniel mówi: „ja Danijel zrozumiałem z ksiąg liczbę lat”, a anioł u Zachariasza, około 519 p.n.e., wciąż pyta, jak długo potrwa gniew Pana na Jerozolimę: „na któreś się gniewał już siedmdziesiąt lat”. Czytelnicy dopasowywali siedemdziesiąt lat na kilka sposobów: od pierwszej wyprawy Nabuchodonozora w 605 do dekretu Cyrusa (67 lat), od 586 do ukończonej Świątyni w 516 (70) albo jako okrągłą liczbę na ludzkie życie."
    - "Deportacje były trzy: w 597, gdy uprowadzono „wszystkich książąt, i wszystek lud rycerski, więźniów dziesięć tysięcy”; w 586, po spaleniu miasta; i w 582, gdy Jeremiasz liczy jeszcze 745 osób. Tabliczki klinowe z osady zwanej Al-Jahudu, „Miasto Judy”, i sąsiednich w Babilonii, datowane od 572 do 477 p.n.e., ukazują Judejczyków uprawiających tam ziemię całe pokolenia po rozpoczęciu powrotu, a wspólnota, która została, rozrosła się w babilońską społeczność żydowską Talmudu, istniejącą tysiąc lat później."
  it:
    - "Da cinquanta a settant’anni circa, a seconda di dove si comincia e si finisce. La prima deportazione da Gerusalemme avvenne nel marzo del 597 a.C., quando Nabucodonosor prese la città e portò via il re Ioiachin; il Tempio fu bruciato nel 586 (si sostiene anche il 587); e Ciro permise agli esuli di tornare nel 538. Dalla prima deportazione al ritorno sono 59 anni, dalla caduta del Tempio 48; dall’incendio del Tempio alla sua ricostruzione nel 516 sono 70."
    - "Geremia aveva fissato il termine: «queste nazioni serviranno il re di Babilonia per settant’anni», e «quando settant’anni saranno compiuti per Babilonia, io vi visiterò». Il Cronista conta quegli anni come i sabati mancati del paese; Daniele scrive: «meditando sui libri, vidi che il numero degli anni» era di settant’anni; e l’angelo di Zaccaria, intorno al 519 a.C., chiede ancora fino a quando durerà l’ira del Signore contro Gerusalemme, «durante quei settant’anni». I lettori hanno collocato i settant’anni in vari modi: dalla prima campagna di Nabucodonosor nel 605 al decreto di Ciro (67 anni), dal 586 al Tempio finito nel 516 (70), o come numero tondo per una vita intera."
    - "Le deportazioni furono tre: nel 597, quando furono portati via «tutti i capi, tutti gli uomini valorosi, in numero di diecimila prigioni»; nel 586, dopo l’incendio della città; e nel 582, quando Geremia conta altre 745 persone. Tavolette cuneiformi di un insediamento chiamato Al-Yahudu, «città di Giuda», e dei suoi vicini in Babilonia, datate dal 572 al 477 a.C., mostrano Giudei che vi lavoravano la terra generazioni dopo l’inizio del ritorno, e la comunità rimasta crebbe fino a diventare l’ebraismo babilonese del Talmud mille anni dopo."
  nl:
    - "Ongeveer vijftig tot zeventig jaar, afhankelijk van waar men begint en eindigt. De eerste deportatie uit Jeruzalem vond plaats in maart 597 v.Chr., toen Nebukadnessar de stad innam en koning Jojachin wegvoerde; de tempel werd in 586 in brand gestoken (ook 587 wordt aangehouden); en Cyrus liet de ballingen in 538 terugkeren. Van de eerste deportatie tot de terugkeer is het 59 jaar, van de val van de tempel 48; van de brand van de tempel tot de herbouw ervan in 516 is het 70."
    - "Jeremia had de termijn vastgesteld: “deze volken zullen den koning van Babel dienen zeventig jaren”, en “als zeventig jaren te Babel zullen vervuld zijn, zal Ik ulieden bezoeken”. De kroniekschrijver telt die jaren als de gemiste sabbatten van het land, Daniël “merkte … in de boeken, dat het getal der jaren” zeventig was, en de engel bij Zacharia vraagt omstreeks 519 v.Chr. nog steeds hoe lang de toorn van de HEER tegen Jeruzalem zal duren, “deze zeventig jaren”. Lezers hebben de zeventig jaren op verschillende manieren ingepast: van Nebukadnessars eerste veldtocht in 605 tot Cyrus’ decreet (67 jaar), van 586 tot de voltooide tempel in 516 (70), of als een rond getal voor een mensenleven."
    - "De deportaties zelf waren er drie: in 597, toen “al de vorsten, en alle strijdbare helden, tien duizend gevangen” werden weggevoerd; in 586, nadat de stad was verbrand; en in 582, toen Jeremia nog eens 745 personen telt. Spijkerschrifttabletten uit een nederzetting genaamd Al-Yahudu, “Judastad”, en haar buren in Babylonië, gedateerd van 572 tot 477 v.Chr., tonen dat Judeeërs er generaties nadat de terugkeer begon nog landbouw bedreven, en de gemeenschap die bleef groeide uit tot het Babylonische jodendom van de Talmoed duizend jaar later."
  cs:
    - "Asi padesát až sedmdesát let, podle toho, kde se začne a skončí. První deportace z Jeruzaléma přišla v březnu 597 př. n. l., kdy Nebukadnesar dobyl město a odvlekl krále Jójakína; chrám byl spálen roku 586 (hájí se i rok 587); a Kýros dovolil vyhnancům návrat roku 538. Od první deportace k návratu je to 59 let, od pádu chrámu 48; od spálení chrámu po jeho obnovu roku 516 je to 70."
    - "Jeremjáš stanovil lhůtu: „sloužiti budou národové tito králi Babylonskému sedmdesáte let“ a „jakž se jen vyplní Babylonu sedmdesáte let, navštívím vás“. Letopisec počítá ta léta jako zameškané soboty země, Daniel „porozuměl jsem z knih počtu let“ a Zacharjášův anděl, asi roku 519 př. n. l., se stále ptá, jak dlouho potrvá Hospodinův hněv na Jeruzalém, „na kteréž jsi hněval se již sedmdesáte let“. Čtenáři těch sedmdesát let skládali různě: od prvního Nebukadnesarova tažení roku 605 po Kýrův výnos (67 let), od roku 586 po dokončený chrám roku 516 (70), nebo jako kulaté číslo pro lidský věk."
    - "Deportací bylo samotných tři: roku 597, kdy Nebukadnesar odvedl „všecka knížata i všecky muže udatné, deset tisíců zajatých“; roku 586, po spálení města; a roku 582, kdy Jeremjáš počítá dalších 745 osob. Klínopisné tabulky z osady zvané Al-Jahúdu, „Judské město“, a jejích sousedů v Babylonii, datované do let 572 až 477 př. n. l., ukazují Judejce hospodařící tam ještě generace po začátku návratu, a obec, která zůstala, vyrostla v babylonské židovstvo Talmudu o tisíc let později."
  sv:
    - "Omkring femtio till sjuttio år, beroende på var man börjar och slutar. Den första deportationen från Jerusalem kom i mars 597 f.Kr., när Nebukadnessar intog staden och förde bort kung Jojakin; templet brändes 586 (587 hävdas också); och Kyros lät de bortförda återvända 538. Från den första deportationen till återkomsten är det 59 år, från templets fall 48; från templets brand till dess återuppbyggnad 516 är det 70."
    - "Jeremia hade satt tiden: ”dessa folk skola vara Babels konung underdåniga i sjuttio år”, och ”först när sjuttio år hava gått till ända i Babel, skall jag se till eder”. Krönikeförfattaren räknar dessa år som landets uteblivna sabbater, ”till dess att landet hade fått gottgörelse för sina sabbater”, Daniel lade märke till ”det antal år” i skrifterna, och Sakarjas ängel, omkring 519 f.Kr., frågar fortfarande hur länge det ska dröja innan Herren förbarmar sig över Jerusalem: ”Du har ju nu varit vred på dem i sjuttio år.” Läsare har passat in de sjuttio åren på flera sätt: från Nebukadnessars första fälttåg 605 till Kyros påbud (67 år), från 586 till det färdiga templet 516 (70), eller som ett runt tal för en livstid."
    - "Deportationerna var själva tre: 597, då det står att ”han förde bort i fångenskap hela Jerusalem, alla hövitsmän och alla tappra stridsmän; tio tusen förde han bort”; 586, efter att staden brunnit; och 582, då Jeremia räknar ytterligare 745 personer. Kilskriftstavlor från en bosättning kallad Al-Yahudu, ”Juda stad”, och dess grannar i Babylonien, daterade från 572 till 477 f.Kr., visar judéer som brukade jorden där generationer efter att återkomsten hade börjat, och samfundet som blev kvar växte till den babyloniska judenheten i Talmud ett tusen år senare."
  nb:
    - "Omtrent femti til sytti år, avhengig av hvor man begynner og slutter. Den første bortføringen fra Jerusalem kom i mars 597 f.Kr., da Nebukadnesar inntok byen og førte bort kong Jojakin; tempelet ble brent i 586 (587 er også foreslått); og Kyros lot de bortførte vende hjem i 538. Fra den første bortføringen til hjemkomsten er det 59 år, fra tempelets fall 48; fra tempelets brann til gjenoppbyggingen i 516 er det 70."
    - "Jeremia hadde fastsatt tiden: «disse folkeslag skal tjene Babels konge i sytti år», og «Når sytti år er gått til ende for Babel, vil jeg se til eder». Krønikeskriveren regner disse årene som landets uteblitte sabbater, Daniel la «i bøkene merke til tallet på de år», og Sakarjas engel, omkring 519 f.Kr., spør fortsatt hvor lenge Herrens vrede mot Jerusalem skal vare, «nu i sytti år». Lesere har tilpasset de sytti årene på flere måter: fra Nebukadnesars første felttog i 605 til Kyros' påbud (67 år), fra 586 til det ferdige tempelet i 516 (70), eller som et rundt tall for en livstid."
    - "Selve bortføringene var tre: i 597, da «hele Jerusalem, alle de fornemste og alle rikmenn - ti tusen fanger» ble tatt; i 586, etter at byen brant; og i 582, da Jeremia teller ytterligere 745 personer. Kileskrifttavler fra en bosetting kalt Al-Yahudu, «Judas by», og dens naboer i Babylonia, datert fra 572 til 477 f.Kr., viser judeere som drev jordbruk der generasjoner etter at hjemkomsten var begynt, og samfunnet som ble igjen, vokste til den babylonske jødedommen i Talmud tusen år senere."
  tl:
    - "Mga limampu hanggang pitumpung taon, depende sa kung saan sisimulan at tatapusin. Ang unang pagpapatapon mula sa Jerusalem ay noong Marso 597 BK, nang kunin ni Nabucodonosor ang lungsod at dalhin si Haring Joachin; sinunog ang Templo noong 586 (itinuturing din ang 587); at pinabalik ni Ciro ang mga ipinatapon noong 538. Mula sa unang pagpapatapon hanggang sa pagbabalik ay 59 taon, mula sa pagbagsak ng Templo ay 48; mula sa pagsunog ng Templo hanggang sa muling pagtatayo nito noong 516 ay 70."
    - "Itinakda ni Jeremias ang panahon: “ang mga bansang ito ay maglilingkod sa hari sa Babilonia na pitong pung taon”, at “pagkatapos na maganap ang pitong pung taon sa Babilonia, aking dadalawin kayo”. Binibilang ng Cronista ang mga taong iyon bilang mga sabbath na hindi naipangilin ng lupain, “nakaunawa” si Daniel “sa pamamagitan ng mga aklat, ng bilang ng mga taon”, at ang anghel ni Zacharias, noong mga 519 BK, ay nagtatanong pa rin kung hanggang kailan ang galit ng Panginoon sa Jerusalem, “nitong pitong pung taon”. Isinaayos ng mga mambabasa ang pitumpung taon sa iba't ibang paraan: mula sa unang kampanya ni Nabucodonosor noong 605 hanggang sa kautusan ni Ciro (67 taon), mula 586 hanggang sa natapos na Templo noong 516 (70), o bilang bilog na bilang ng isang buhay."
    - "Tatlo ang mga pagpapatapon: noong 597, nang dalhin ang “lahat na prinsipe, at ang lahat na makapangyarihang lalake na may tapang, sa makatuwid baga'y sangpung libong bihag”; noong 586, pagkasunog ng lungsod; at noong 582, nang bilangin ni Jeremias ang karagdagang 745 katao. Ipinakikita ng mga tapyas na cuneiform mula sa isang pamayanang tinatawag na Al-Yahudu, “Bayan ng Juda”, at mga karatig nito sa Babilonia, na may petsang 572 hanggang 477 BK, na nagsasaka roon ang mga Judeano mga salinlahi pagkatapos magsimula ang pagbabalik, at ang pamayanang nanatili ay naging Judaismong Babilonio ng Talmud isang libong taon pagkaraan."
  da:
    - "Omkring halvtreds til halvfjerds år, afhængigt af hvor man begynder og slutter. Den første bortførelse fra Jerusalem kom i marts 597 f.Kr., da Nebukadnezar indtog byen og førte kong Jojakin bort; Templet blev brændt i 586 (587 holdes også for muligt); og Kyros lod de bortførte vende hjem i 538. Fra den første bortførelse til hjemkomsten er der 59 år, fra Templets fald 48; fra Templets afbrænding til dets genopbygning i 516 er der 70."
    - "Jeremias havde fastsat tidsrummet: »disse Folk skulle tjene Kongen af Babel halvfjerdsindstyve Aar«, og »Naar halvfjerdsindstyve Aar ere forløbne for Babel, da vil jeg besøge eder«. Krønikeskriveren regner disse år som landets forsømte sabbatter, Daniel gav »i Bøgerne Agt paa Aarenes Tal«, og Zakarias' engel spørger omkring 519 f.Kr. stadig, hvor længe Herrens vrede mod Jerusalem vil vare: »over Jerusalem og over Judas Stæder, paa hvilke du har været vred nu i halvfjerdsindstyve Aar«. Læsere har indpasset de halvfjerds år på flere måder: fra Nebukadnezars første felttog i 605 til Kyros' dekret (67 år), fra 586 til det færdige Tempel i 516 (70) eller som et rundt tal for en menneskealder."
    - "Selve bortførelserne var tre: i 597, da »alle Øversterne og alle de vældige til Strid, ti Tusinde fangne« blev ført bort; i 586, efter at byen var brændt; og i 582, da Jeremias tæller yderligere 745 personer. Kileskrifttavler fra en bosættelse kaldet Al-Yahudu, »Judas by«, og dens nabobyer i Babylonien, dateret fra 572 til 477 f.Kr., viser judæere, der dyrkede jorden dér generationer efter, at hjemkomsten var begyndt, og det samfund, der blev tilbage, voksede ud til den babyloniske jødedom i Talmud tusind år senere."
