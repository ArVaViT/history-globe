id: how-long-was-the-babylonian-exile
question:
  en: "How long did the Babylonian exile last?"
  ru: "Сколько длился вавилонский плен?"
  uk: "Як довго тривало Вавилонське вигнання?"
  es: "¿Cuánto duró el exilio en Babilonia?"
  pt: "Quanto durou o exílio na Babilônia?"
  de: "Wie lange dauerte das babylonische Exil?"
  fr: "Combien de temps a duré l’exil à Babylone ?"
answer:
  en:
    - "About fifty to seventy years, depending on where one starts and stops. The first deportation from Jerusalem came in March 597 BC, when Nebuchadnezzar took the city and carried off King Jehoiachin; the Temple was burned in 586 (587 is also held); and Cyrus let the exiles return in 538. From the first deportation to the return is 59 years, from the fall of the Temple 48; from the Temple's burning to its rebuilding in 516 is 70."
    - "Jeremiah had set the term: “these nations shall serve the king of Babylon seventy years”, and “after seventy years be accomplished at Babylon I will visit you”. The Chronicler counts those years as the land's missed sabbaths, Daniel “understood by books the number of the years”, and Zechariah's angel, about 519 BC, still asks how long the Lord's anger against Jerusalem will last, “these threescore and ten years”. Readers have fitted the seventy years in several ways: from Nebuchadnezzar's first campaign in 605 to Cyrus' decree (67 years), from 586 to the finished Temple in 516 (70), or as a round number for a lifetime."
    - "The deportations themselves were three: in 597, when “all the princes, and all the mighty men of valour, even ten thousand captives” were taken; in 586, after the city burned; and in 582, when Jeremiah counts a further 745 persons. Cuneiform tablets from a settlement called Al-Yahudu, “Judah-town”, and its neighbours in Babylonia, dated from 572 to 477 BC, show Judeans farming there generations after the return began, and the community that stayed grew into the Babylonian Jewry of the Talmud a thousand years later."
  ru:
    - "Примерно от пятидесяти до семидесяти лет, смотря откуда и докуда считать. Первое переселение из Иерусалима было в марте 597 г. до н. э., когда Навуходоносор взял город и увёл царя Иехонию; Храм сгорел в 586 г. (называют и 587-й); Кир отпустил переселенцев в 538-м. От первого переселения до возвращения — 59 лет, от гибели Храма — 48; от сожжения Храма до его восстановления в 516 г. — 70."
    - "Срок назначил Иеремия: «народы сии будут служить царю Вавилонскому семьдесят лет» и «когда исполнится вам в Вавилоне семьдесят лет, тогда Я посещу вас». Летописец считает эти годы как субботы, которых не праздновала земля, Даниил «сообразил по книгам число лет», а ангел у Захарии около 519 г. всё ещё спрашивает, доколе продлится гнев Господа на Иерусалим — «вот уже семьдесят лет». Семьдесят лет укладывали по-разному: от первого похода Навуходоносора в 605 г. до указа Кира (67 лет), от 586 г. до завершённого Храма в 516-м (70) или как круглое число — срок человеческой жизни."
    - "Самих переселений было три: в 597 г., когда увели «всех князей, и все храброе войско, — десять тысяч было переселенных»; в 586-м, после сожжения города; и в 582-м, когда Иеремия насчитывает ещё 745 человек. Клинописные таблички из поселения Аль-Яхуду, «Иудейский город», и соседних с ним в Вавилонии, датированные 572–477 гг. до н. э., показывают иудеев, возделывавших там землю, — поколения спустя после начала возвращения, а оставшаяся община выросла в вавилонское еврейство Талмуда тысячу лет спустя."
  uk:
    - "Приблизно від п'ятдесяти до сімдесяти років, залежно від того, звідки починати і де закінчувати. Перша депортація з Єрусалиму відбулася в березні 597 р. до н. е., коли Навуходоносор узяв місто й вивів царя Єхонію; Храм було спалено 586 р. (також називають 587); а Кір дозволив вигнанцям повернутися 538 р. Від першої депортації до повернення 59 років, від падіння Храму 48; від спалення Храму до його відбудови 516 р. — 70."
    - "Єремія визначив строк: «служити муть сї народи цареві Вавилонському сїмдесять років» і «аж як упливе вам повних сїмдесять років у Вавилонї, аж тодї я навідаюсь до вас». Автор Хронік розглядає ці роки як пропущені землею суботи, Даниїл «дослїдив із книг число років», а ангел у Захарії близько 519 р. до н. е. ще питає, доки триватиме гнів Господа на Єрусалим, «уже сїмдесять років». Читачі вкладали сімдесят років по-різному: від першого походу Навуходоносора 605 р. до указу Кіра (67 років), від 586 р. до завершеного Храму 516 р. (70) або як круге число на цілий вік."
    - "Самих депортацій було три: 597 р., коли було забрано «усїх князїв, і все хоробре військо — десять тисяч»; 586 р., після спалення міста; і 582 р., коли Єремія рахує ще 745 осіб. Клинописні таблички з поселення Аль-Яхуду, «Юдиного міста», та його сусідів у Вавилонії, датовані 572–477 рр. до н. е., показують юдеїв, які вели там господарство через покоління після початку повернення, а громада, що залишилася, виросла у вавилонське єврейство Талмуду тисячу років по тому."
  es:
    - "Entre cincuenta y setenta años, según dónde se empiece y se termine. La primera deportación desde Jerusalén tuvo lugar en marzo del 597 a. C., cuando Nabucodonosor tomó la ciudad y se llevó al rey Joaquín; el Templo fue incendiado en el 586 (también se sostiene el 587); y Ciro permitió el regreso de los desterrados en el 538. De la primera deportación al regreso hay 59 años, de la caída del Templo 48; del incendio del Templo a su reconstrucción en el 516 hay 70."
    - "Jeremías había fijado el plazo: «servirán estas gentes al rey de Babilonia setenta años», y «cuando en Babilonia se cumplieren los setenta años, yo os visitaré». El cronista cuenta esos años como los sábados que la tierra no había tenido, Daniel dice: «miré atentamente en los libros el número de los años», y el ángel de Zacarías, hacia el 519 a. C., sigue preguntando hasta cuándo durará la ira del Señor contra Jerusalén, «por espacio de setenta años». Los lectores han encajado los setenta años de varias maneras: desde la primera campaña de Nabucodonosor en el 605 hasta el decreto de Ciro (67 años), desde el 586 hasta el Templo terminado en el 516 (70), o como una cifra redonda para una vida."
    - "Las deportaciones fueron tres: en el 597, cuando se llevaron a «todos los príncipes, y á todos los hombres valientes, hasta diez mil cautivos»; en el 586, tras el incendio de la ciudad; y en el 582, cuando Jeremías cuenta otras 745 personas. Tablillas cuneiformes de un asentamiento llamado Al-Yahudu, «ciudad de Judá», y de sus vecinos en Babilonia, fechadas entre 572 y 477 a. C., muestran a judíos que cultivaban la tierra allí generaciones después de iniciado el regreso, y la comunidad que se quedó llegó a ser el judaísmo babilónico del Talmud mil años después."
  pt:
    - "Cerca de cinquenta a setenta anos, conforme o ponto de partida e de chegada. A primeira deportação de Jerusalém ocorreu em março de 597 a.C., quando Nabucodonosor tomou a cidade e levou o rei Joaquim; o Templo foi queimado em 586 (também se defende 587); e Ciro permitiu o regresso dos exilados em 538. Da primeira deportação ao regresso são 59 anos, da queda do Templo 48; da queima do Templo à sua reconstrução em 516 são 70."
    - "Jeremias fixara o prazo: “estas nações servirão ao rei da Babilônia por setenta anos”, e “quando se completarem setenta anos para a Babilônia, eu os visitarei”. O Cronista conta esses anos como os sábados que a terra perdera, Daniel “entendeu pelos livros o número de anos”, e o anjo de Zacarias, por volta de 519 a.C., ainda pergunta até quando durará a ira do Senhor contra Jerusalém, “nestes setenta anos”. Os leitores ajustaram os setenta anos de várias maneiras: da primeira campanha de Nabucodonosor em 605 ao decreto de Ciro (67 anos), de 586 ao Templo concluído em 516 (70), ou como número redondo para uma vida inteira."
    - "As deportações foram três: em 597, quando foram levados “todos os príncipes e todos os guerreiros valentes, dez mil cativos ao todo”; em 586, depois que a cidade foi queimada; e em 582, quando Jeremias conta mais 745 pessoas. Tabuinhas cuneiformes de um povoado chamado Al-Yahudu, “cidade de Judá”, e de seus vizinhos na Babilônia, datadas de 572 a 477 a.C., mostram judaítas cultivando a terra ali gerações depois de começado o regresso, e a comunidade que ficou se tornou o judaísmo babilônico do Talmude, mil anos depois."
  de:
    - "Etwa fünfzig bis siebzig Jahre, je nachdem, wo man beginnt und endet. Die erste Wegführung aus Jerusalem geschah im März 597 v. Chr., als Nebukadnezar die Stadt einnahm und König Jojachin wegführte; der Tempel wurde 586 verbrannt (auch 587 wird vertreten); und Kyrus ließ die Verbannten 538 heimkehren. Von der ersten Wegführung bis zur Rückkehr sind es 59 Jahre, vom Fall des Tempels 48; vom Brand des Tempels bis zu seinem Wiederaufbau 516 sind es 70."
    - "Jeremia hatte die Frist gesetzt: „Und sollen diese Völker dem König zu Babel dienen siebzig Jahre“, und: „Wenn zu Babel siebzig Jahre aus sind, so will ich euch besuchen“. Der Chronist zählt diese Jahre als die versäumten Sabbate des Landes, Daniel „merkte ... in den Büchern auf die Zahl der Jahre“, und der Engel bei Sacharja fragt um 519 v. Chr. noch, wie lange der Zorn des Herrn gegen Jerusalem währen werde, „über welche du zornig bist gewesen diese siebzig Jahre“. Die Leser haben die siebzig Jahre auf mehrere Weisen eingepasst: von Nebukadnezars erstem Feldzug 605 bis zu Kyrus' Erlass (67 Jahre), von 586 bis zum vollendeten Tempel 516 (70) oder als runde Zahl für ein Menschenleben."
    - "Die Wegführungen selbst waren drei: 597, als „alle Obersten, alle Gewaltigen, zehntausend Gefangene“ weggeführt wurden; 586, nach dem Brand der Stadt; und 582, als Jeremia weitere 745 Personen zählt. Keilschrifttafeln aus einer Siedlung namens Al-Yahudu, „Judastadt“, und ihren Nachbarorten in Babylonien, datiert von 572 bis 477 v. Chr., zeigen Judäer, die dort noch Generationen nach Beginn der Rückkehr Landwirtschaft betrieben, und die Gemeinde, die blieb, wuchs zum babylonischen Judentum des Talmud tausend Jahre später heran."
  fr:
    - "Environ cinquante à soixante-dix ans, selon le point de départ et d’arrivée. La première déportation de Jérusalem eut lieu en mars 597 av. J.-C., quand Nebucadnetsar prit la ville et emmena le roi Jojakin ; le Temple fut brûlé en 586 (587 est aussi retenu) ; et Cyrus laissa revenir les exilés en 538. De la première déportation au retour, il y a 59 ans, de la chute du Temple 48 ; de l’incendie du Temple à sa reconstruction en 516, 70."
    - "Jérémie avait fixé le terme : « ces nations seront asservies au roi de Babylone pendant soixante-dix ans », et « dès que soixante-dix ans seront écoulés pour Babylone, je me souviendrai de vous ». Le Chroniqueur compte ces années comme les sabbats que le pays n’avait pas connus, Daniel comprit « par les livres » le « nombre des années », et l’ange de Zacharie, vers 519 av. J.-C., demande encore jusqu’à quand durera la colère du Seigneur contre Jérusalem, « depuis soixante-dix ans ». Les lecteurs ont fait entrer ces soixante-dix ans de plusieurs façons : de la première campagne de Nebucadnetsar en 605 au décret de Cyrus (67 ans), de 586 au Temple achevé en 516 (70), ou comme un nombre rond pour une vie."
    - "Les déportations furent trois : en 597, quand furent emmenés « tous les chefs et tous les hommes vaillants, au nombre de dix mille exilés » ; en 586, après l’incendie de la ville ; et en 582, où Jérémie compte encore 745 personnes. Des tablettes cunéiformes d’une localité nommée Al-Yahudu, « la ville de Juda », et de ses voisines en Babylonie, datées de 572 à 477 av. J.-C., montrent des Judéens y cultivant la terre des générations après le début du retour, et la communauté restée sur place devint le judaïsme babylonien du Talmud mille ans plus tard."
