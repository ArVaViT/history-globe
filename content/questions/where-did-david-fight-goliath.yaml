id: where-did-david-fight-goliath
question:
  en: "Where did David fight Goliath?"
  ru: "Где Давид сразился с Голиафом?"
  uk: "Де Давид бився з Голіятом?"
  es: "¿Dónde combatió David contra Goliat?"
  pt: "Onde Davi lutou contra Golias?"
  de: "Wo kämpfte David gegen Goliat?"
  fr: "Où David a-t-il affronté Goliath ?"
  pl: "Gdzie Dawid walczył z Goliatem?"
  it: "Dove Davide combatté contro Golia?"
  nl: "Waar streed David tegen Goliat?"
  cs: "Kde David bojoval s Goliášem?"
  sv: "Var kämpade David mot Goljat?"
  nb: "Hvor kjempet David mot Goliat?"
  tl: "Saan nakipaglaban si David kay Goliath?"
  da: "Hvor kæmpede David mod Goliat?"
answer:
  en:
    - "In the valley of Elah, the broad valley of Wadi es-Sant in the foothills of Judah, about 25 km south-west of Jerusalem and 20 km west of Bethlehem in a straight line, on the way down from the hill country to the Philistine plain. The map point stands in the valley between the two towns the story names."
    - "First Samuel says the Philistines “pitched between Shochoh and Azekah, in Ephes-dammim”, while “Saul and the men of Israel were gathered together, and pitched by the valley of Elah”; “the Philistines stood on a mountain on the one side, and Israel stood on a mountain on the other side: and there was a valley between them.” Socoh, Khirbet Shuweikeh, stands on the southern side of the valley, and Azekah, Tell Zakariyeh, about 4 km to the west-north-west at its western bend; the brook in the valley bed is where David chose his stones. The name Elah means terebinth."
    - "The valley was the border between Judah and the Philistines: Gath, Goliath's city, lies about 15 km down the valley to the west, and the routed Philistines fled “by the way to Shaaraim, even unto Gath, and unto Ekron”. On the northern ridge opposite Socoh stands Khirbet Qeiyafa, a fortified town of about 1000 BC with two gates, excavated from 2007, which its excavators take for the Shaaraim of the story, a name meaning two gates; others doubt the identification. The map shows the valley, Socoh, Azekah, Ephes-dammim and Gath."
  ru:
    - "В долине дуба — широкой долине Вади-эс-Сант в предгорьях Иудеи, примерно в 25 км к юго-западу от Иерусалима и в 20 км к западу от Вифлеема по прямой, на спуске из нагорья к Филистимской равнине. Точка на карте стоит в долине между двумя городками, которые называет рассказ."
    - "Первая книга Царств говорит, что филистимляне «расположились станом между Сокхофом и Азеком в Ефес-Даммиме», а «Саул и Израильтяне собрались и расположились станом в долине дуба»; «И стали Филистимляне на горе с одной стороны, и Израильтяне на горе с другой стороны, а между ними была долина». Сокхоф, Хирбет-Шувейке, стоит на южной стороне долины, а Азек, Телль-Закария, — примерно в 4 км к западо-северо-западу, у западного изгиба долины; в русле потока на дне долины Давид и выбрал камни. Еврейское название долины, Эла, значит «теревинф»."
    - "Долина была границей между Иудеей и филистимлянами: Геф, город Голиафа, лежит примерно в 15 км ниже по долине к западу, и разбитые филистимляне бежали «по дороге Шааримской до Гефа и до Аккарона». На северной гряде напротив Сокхофа стоит Хирбет-Кейафа — укреплённый городок около 1000 г. до н. э. с двумя воротами, раскапываемый с 2007 года; его исследователи видят в нём Шаараим из рассказа, имя которого значит «двое ворот», другие в этом сомневаются. Карта показывает долину, Сокхоф, Азек, Ефес-Даммим и Геф."
  uk:
    - "У долині Ела, широкій долині Ваді-ес-Сант у передгір'ях Юдеї, приблизно за 25 км на південний захід від Єрусалиму і за 20 км на захід від Вифлеєму по прямій, на спуску з гірської країни до Филистимської рівнини. Точка мапи стоїть у долині між двома містами, які називає розповідь."
    - "Перша книга Самуїла каже, що филистимляни «отаборились під Ефес-Даммимом між Сохотом і Азеком», тоді як «Саул же й Ізраїльське військо скупились й отаборились в долинї Теребінта»; «Филистії стали по сїм боцї на горі, а Ізрайлитяне по тім боцї на горі, так що між ними була долина». Сохо, Хірбет-Шуває, стоїть на південному боці долини, а Азека, Тель-Закарія, приблизно за 4 км на захід-північний захід на її західному вигині; потік на дні долини — це місце, де Давид обирав свої камені. Ім'я Ела означає теребінт."
    - "Долина була кордоном між Юдеєю й филистимлянами: Гат, місто Голіята, лежить приблизно за 15 км вниз долиною на захід, а розбитих филистимлян гнали «по дорозї Шааримській, до Гета й до Аккарону». На північному хребті навпроти Сохо стоїть Хірбет-Кейяфа, укріплене місто близько 1000 р. до н. е. з двома брамами, розкопуване з 2007 р., яке його дослідники вважають Шаараїмом з розповіді, назва якого означає дві брами; інші сумніваються в ототожненні. Мапа показує долину, Сохо, Азеку, Ефес-Даммім і Гат."
  es:
    - "En el valle de Ela, el amplio valle del uadi es-Sant, en las estribaciones de Judá, a unos 25 km al suroeste de Jerusalén y a 20 km al oeste de Belén en línea recta, en el descenso de la región montañosa a la llanura filistea. El punto del mapa está en el valle, entre las dos poblaciones que nombra el relato."
    - "Primer Samuel dice que los filisteos «asentaron el campo entre Sochô y Azeca, en Ephes-dammim», mientras que «Saúl y los hombres de Israel se juntaron, y asentaron el campo en el valle del Alcornoque»; «los Filisteos estaban sobre el un monte de la una parte, é Israel estaba sobre el otro monte de la otra parte, y el valle entre ellos». Soco, Khirbet Shuweikeh, se alza en el lado sur del valle, y Azeca, Tell Zakariyeh, a unos 4 km al oeste-noroeste, en su recodo occidental; el arroyo del lecho del valle es donde David escogió sus piedras. El nombre Ela significa terebinto."
    - "El valle era la frontera entre Judá y los filisteos: Gat, la ciudad de Goliat, queda a unos 15 km valle abajo hacia el oeste, y los filisteos derrotados huyeron «por el camino de Saraim, hasta Gath y Ecrón». En la cresta norte, frente a Soco, se alza Khirbet Qeiyafa, una ciudad fortificada de hacia el 1000 a. C. con dos puertas, excavada desde 2007, que sus excavadores identifican con la Saaraim del relato, nombre que significa dos puertas; otros dudan de la identificación. El mapa muestra el valle, Soco, Azeca, Efes-damim y Gat."
  pt:
    - "No vale de Elá, o amplo vale do uádi es-Sant, no sopé de Judá, a cerca de 25 km a sudoeste de Jerusalém e 20 km a oeste de Belém em linha reta, no caminho que desce dos montes para a planície filisteia. O ponto do mapa está no vale entre as duas cidades que a história nomeia."
    - "Primeiro Samuel diz que os filisteus “acamparam entre Socó e Azeca, em Efes-Damim”, enquanto “Saul e os homens de Israel se reuniram, acamparam no vale de Elá”; “os filisteus se posicionaram na encosta de um monte, e os israelitas na encosta do outro monte, com o vale entre eles”. Socó, Khirbet Shuweikeh, fica no lado sul do vale, e Azeca, Tell Zakariyeh, a cerca de 4 km a oés-noroeste, na curva ocidental; o riacho do leito do vale é onde Davi escolheu suas pedras. O nome Elá significa terebinto."
    - "O vale era a fronteira entre Judá e os filisteus: Gate, a cidade de Golias, fica a cerca de 15 km vale abaixo, a oeste, e os filisteus derrotados fugiram “pelo caminho de Saaraim, até Gate e Ecrom”. Na crista norte, em frente a Socó, fica Khirbet Qeiyafa, cidade fortificada de cerca de 1000 a.C. com duas portas, escavada desde 2007, que seus escavadores tomam pela Saaraim da história, nome que significa duas portas; outros duvidam da identificação. O mapa mostra o vale, Socó, Azeca, Efes-Damim e Gate."
  de:
    - "Im Elatal, dem breiten Tal des Wadi es-Sant im Vorland Judas, etwa 25 km südwestlich von Jerusalem und 20 km westlich von Bethlehem in der Luftlinie, auf dem Weg vom Bergland hinab zur Philisterebene. Der Kartenpunkt liegt im Tal zwischen den beiden Orten, die die Erzählung nennt."
    - "Das 1. Buch Samuel sagt, die Philister „lagerten sich zwischen Socho und Aseka bei Ephes-Dammim“, während „Saul und die Männer Israels kamen zusammen und lagerten sich im Eichgrunde“; „die Philister standen auf einem Berge jenseits und die Israeliten auf einem Berge diesseits, daß ein Tal zwischen ihnen war“. Socho, Chirbet Schuweike, liegt auf der Südseite des Tals und Aseka, Tell Sakarija, etwa 4 km westnordwestlich an seiner westlichen Biegung; im Bach in der Talsohle wählte David seine Steine. Der Name Ela bedeutet Terebinthe."
    - "Das Tal war die Grenze zwischen Juda und den Philistern: Gat, die Stadt Goliats, liegt etwa 15 km talabwärts im Westen, und die geschlagenen Philister flohen „auf dem Wege zu den Toren bis gen Gath und gen Ekron“. Auf dem nördlichen Rücken gegenüber von Socho liegt Chirbet Qeiyafa, eine befestigte Stadt von etwa 1000 v. Chr. mit zwei Toren, seit 2007 ausgegraben, die ihre Ausgräber für das Schaaraim der Erzählung halten, einen Namen, der „zwei Tore“ bedeutet; andere bezweifeln die Gleichsetzung. Die Karte zeigt das Tal, Socho, Aseka, Efes-Dammim und Gat."
  fr:
    - "Dans la vallée d’Éla, large vallée de l’oued es-Sant dans les contreforts de Juda, à environ 25 km au sud-ouest de Jérusalem et 20 km à l’ouest de Bethléem en ligne droite, sur la descente de la montagne vers la plaine des Philistins. Le point de la carte se trouve dans la vallée, entre les deux villes que nomme le récit."
    - "Le premier livre de Samuel dit que les Philistins « campèrent entre Soco et Azéka, à Éphès-Dammim », tandis que « Saül et les hommes d’Israël se rassemblèrent aussi ; ils campèrent dans la vallée des térébinthes » ; « Les Philistins étaient vers la montagne d’un côté, et Israël était vers la montagne de l’autre côté : la vallée les séparait. » Soco, Khirbet Shuweikeh, se trouve sur le côté sud de la vallée, et Azéka, Tell Zakariyeh, à environ 4 km à l’ouest-nord-ouest, à son coude occidental ; le torrent du fond de la vallée est celui où David choisit ses pierres. Le nom d’Éla signifie térébinthe."
    - "La vallée formait la frontière entre Juda et les Philistins : Gath, ville de Goliath, se trouve à environ 15 km en aval, à l’ouest, et les Philistins en déroute s’enfuirent « dans le chemin de Schaaraïm jusqu’à Gath et jusqu’à Ékron ». Sur la crête nord, en face de Soco, se dresse Khirbet Qeiyafa, ville fortifiée d’environ 1000 av. J.-C. à deux portes, fouillée depuis 2007, que ses fouilleurs prennent pour le Schaaraïm du récit, nom qui signifie deux portes ; d’autres doutent de cette identification. La carte montre la vallée, Soco, Azéka, Éphès-Dammim et Gath."
  pl:
    - "W Dolinie Ela, szerokiej dolinie Wadi es-Sant u podnóża gór Judy, około 25 km na południowy zachód od Jerozolimy i 20 km na zachód od Betlejem w linii prostej, w drodze w dół z krainy górskiej na równinę filistyńską. Punkt na mapie stoi w dolinie między dwoma miastami, o których mówi opowieść."
    - "Pierwsza Księga Samuela mówi, że Filistyni „położyli się obozem między Sochotem i między Asekiem na granicach Domim”, a „Saul i mężowie Izraelscy zebrali się, i położyli się obozem w dolinie Ela”; „Filistynowie stali na górze z jednej strony, ale Izraelczycy stali na górze z drugiej strony; a dolina była między nimi.” Soko, Chirbet Szuwejka, stoi po południowej stronie doliny, a Azeka, Tell Zakarija, około 4 km na zachód-północny zachód, przy jej zachodnim zakręcie; w potoku na dnie doliny Dawid wybrał swoje kamienie. Nazwa Ela oznacza terebint."
    - "Dolina była granicą między Judą a Filistynami: Gat, miasto Goliata, leży około 15 km w dół doliny na zachód, a rozbici Filistyni uciekali „po drodze Saraim aż do Get i aż do Akkaronu”. Na północnym grzbiecie naprzeciw Soko stoi Chirbet Kajafa, ufortyfikowane miasto z około 1000 p.n.e. z dwiema bramami, wykopywane od 2007, które jego odkrywcy biorą za Szaaraim z opowieści, nazwę znaczącą dwie bramy; inni wątpią w to utożsamienie. Mapa pokazuje dolinę, Soko, Azekę, Efes-Dammim i Gat."
  it:
    - "Nella valle di Ela, l’ampia valle di Wadi es-Sant ai piedi delle colline di Giuda, a circa 25 km a sud-ovest di Gerusalemme e 20 km a ovest di Betlemme in linea retta, sulla via di discesa dalle colline alla pianura filistea. Il punto della mappa si trova nella valle tra le due città che il racconto nomina."
    - "Primo Samuele dice che i Filistei «si accamparono fra Soco e Azeka, a Efes-Dammim», mentre «Saul e gli uomini d’Israele si radunarono anch’essi, si accamparono nella valle dei terebinti»; «I Filistei stavano sul monte da una parte, e Israele stava sul monte dall’altra parte; e fra loro c’era la valle». Soco, Khirbet Shuweikeh, sorge sul lato meridionale della valle, e Azeka, Tell Zakariyeh, a circa 4 km a ovest-nord-ovest alla sua curva occidentale; il torrente sul fondo della valle è dove Davide scelse le sue pietre. Il nome Ela significa terebinto."
    - "La valle era il confine tra Giuda e i Filistei: Gat, la città di Golia, si trova a circa 15 km a valle verso ovest, e i Filistei sbaragliati «caddero sulla via di Shaaraim, fino a Gath e fino ad Ekron». Sul crinale settentrionale di fronte a Soco sorge Khirbet Qeiyafa, una città fortificata del 1000 a.C. circa con due porte, scavata dal 2007, che i suoi scavatori ritengono la Saaraim del racconto, un nome che significa due porte; altri dubitano dell’identificazione. La mappa mostra la valle, Soco, Azeka, Efes-Dammim e Gat."
  nl:
    - "In het dal van Ela, het brede dal van de Wadi es-Sant in de uitlopers van Juda, hemelsbreed ongeveer 25 km ten zuidwesten van Jeruzalem en 20 km ten westen van Bethlehem, op de weg van het bergland naar de Filistijnse vlakte. Het punt op de kaart staat in het dal tussen de twee steden die het verhaal noemt."
    - "Eerste Samuël zegt dat de Filistijnen “legerden zich tussen Socho en tussen Azeka, aan het einde van Dammim”, terwijl “Saul en de mannen van Israel verzamelden zich, en legerden zich in het eikendal”; “de Filistijnen nu stonden aan een berg aan gene, en de Israëlieten stonden aan een berg aan deze zijde; en de vallei was tussen hen.” Socho, Khirbet Shuweikeh, ligt aan de zuidkant van het dal, en Azeka, Tell Zakariyeh, ongeveer 4 km naar het west-noordwesten bij de westelijke bocht; in de beek op de dalbodem koos David zijn stenen. De naam Ela betekent terebint."
    - "Het dal was de grens tussen Juda en de Filistijnen: Gat, de stad van Goliat, ligt ongeveer 15 km verderop in het dal naar het westen, en de verslagen Filistijnen vluchtten “op den weg van Saaraim, en tot aan Gath, en tot aan Ekron”. Op de noordelijke bergkam tegenover Socho ligt Khirbet Qeiyafa, een versterkte stad uit omstreeks 1000 v.Chr. met twee poorten, opgegraven sinds 2007, die de opgravers houden voor het Saäraïm van het verhaal, een naam die twee poorten betekent; anderen betwijfelen die identificatie. De kaart toont het dal, Socho, Azeka, Efes-Dammim en Gat."
  cs:
    - "V údolí Éla, širokém údolí Wádí as-Sant v podhůří Judska, asi 25 km jihozápadně od Jeruzaléma a 20 km západně od Betléma vzdušnou čarou, na cestě z vrchoviny dolů na pelištejskou pláň. Bod na mapě stojí v údolí mezi dvěma městy, která příběh jmenuje."
    - "První kniha Samuelova praví, že Pelištejci „položili se mezi Socho a Azeka na pomezí Dammim“, zatímco „Saul a muži Izraelští sebravše se, položili se v údolí Elah“; „I stáli Filistinští na hoře s strany jedné, a Izraelští stáli na hoře s strany druhé, a údolí bylo mezi nimi.“ Sókó, Chirbet Šuveika, stojí na jižní straně údolí a Azeka, Tell Zakarija, asi 4 km západoseverozápadně na jeho západním ohybu; potok na dně údolí je místem, kde David vybral své kameny. Jméno Éla znamená terebint."
    - "Údolí tvořilo hranici mezi Judskem a Pelištejci: Gat, Goliášovo město, leží asi 15 km dolů údolím na západ a rozprášení Pelištejci utíkali „po cestě k Saraim, až do Gát a až do Akaron“. Na severním hřebeni naproti Sókó stojí Chirbet Qejafa, opevněné město z doby kolem 1000 př. n. l. se dvěma branami, zkoumané od roku 2007, které vykopavači pokládají za Šaarajim z příběhu, jméno znamenající dvě brány; jiní ztotožnění zpochybňují. Mapa ukazuje údolí, Sókó, Azeku, Efes-damím a Gat."
  sv:
    - "I Elas dal, den breda dalen Wadi es-Sant i Judas förberg, omkring 25 km sydväst om Jerusalem och 20 km väster om Betlehem fågelvägen, på vägen ned från bergsbygden till filistéslätten. Kartpunkten står i dalen mellan de två städer som berättelsen nämner."
    - "Första Samuelsboken säger att filistéerna ”lägrade sig mellan Soko och Aseka, vid Efes-Dammim”, medan ”Saul och Israels män hade ock församlat sig och lägrat sig i Terebintdalen”; ”Filistéerna stodo vid berget på ena sidan, och israeliterna stodo vid berget på andra sidan, så att de hade dalen emellan sig.” Soko, Khirbet Shuweikeh, ligger på dalens södra sida, och Aseka, Tell Zakariyeh, omkring 4 km väst-nordväst därom vid dess västra krök; bäcken i dalbottnen är där David valde sina stenar. Namnet Ela betyder terebint."
    - "Dalen var gränsen mellan Juda och filistéerna: Gat, Goljats stad, ligger omkring 15 km nedför dalen västerut, och de slagna filistéerna flydde och föll ”på vägen till Saaraim, och sedan ända till Gat och ända till Ekron”. På norra åsen mitt emot Soko ligger Khirbet Qeiyafa, en befäst stad från omkring 1000 f.Kr. med två portar, utgrävd sedan 2007, som utgrävarna håller för berättelsens Shaarajim, ett namn som betyder två portar; andra betvivlar identifieringen. Kartan visar dalen, Soko, Aseka, Efes-Dammim och Gat."
  nb:
    - "I Eladalen, den brede dalen Wadi es-Sant i foten av Judas høyland, omtrent 25 km sørvest for Jerusalem og 20 km vest for Betlehem i luftlinje, på veien ned fra høylandet til filistersletten. Kartpunktet står i dalen mellom de to byene fortellingen nevner."
    - "1 Samuelsbok sier at filisterne «slo leir mellem Soko og Aseka ved Efes-Dammim», mens «Saul og Israels menn samlet sig og; de leiret sig i Terebintedalen»; «Filistrene stod ved fjellet på den ene side, og israelittene ved fjellet på den andre side, så de hadde dalen imellem sig.» Soko, Khirbet Shuweikeh, ligger på sørsiden av dalen, og Aseka, Tell Zakariyeh, omtrent 4 km mot vest-nordvest ved dens vestlige sving; bekken i dalbunnen er der David valgte sine steiner. Navnet Ela betyr terebint."
    - "Dalen var grensen mellom Juda og filisterne: Gat, Goliats by, ligger omtrent 15 km nede i dalen mot vest, og de slagne filisterne flyktet «på veien til Sa'ara'im og helt frem til Gat og til Ekron». På den nordlige ryggen rett overfor Soko ligger Khirbet Qeiyafa, en befestet by fra omkring 1000 f.Kr. med to porter, utgravd fra 2007, som utgraverne regner for fortellingens Sjaarajim, et navn som betyr to porter; andre tviler på identifikasjonen. Kartet viser dalen, Soko, Aseka, Efes-Dammim og Gat."
  tl:
    - "Sa libis ng Ela, ang malawak na libis ng Wadi es-Sant sa paanan ng mga burol ng Juda, mga 25 km sa timog-kanluran ng Jerusalem at 20 km sa kanluran ng Bethlehem sa tuwid na guhit, sa daan pababa mula sa kabundukan hanggang sa kapatagan ng mga Filisteo. Ang tuldok sa mapa ay nasa libis sa pagitan ng dalawang bayang pinangalanan ng kuwento."
    - "Sinasabi ng 1 Samuel na ang mga Filisteo ay “nagsihantong sa pagitan ng Socho at ng Azeca, sa Ephesdammim”, samantalang “nagpipisan si Saul at ang mga lalake ng Israel, at nagsihantong sa libis ng Ela”; “nagsitayo ang mga Filisteo sa isang dako sa bundok, at tumayo ang Israel sa kabilang dako sa bundok: at may isang libis sa pagitan nila.” Ang Socho, Khirbet Shuweikeh, ay nasa timog na panig ng libis, at ang Azeca, Tell Zakariyeh, mga 4 km sa kanluran-hilagang-kanluran sa kanlurang liko nito; ang batis sa ilalim ng libis ang pinagpilian ni David ng kaniyang mga bato. Ang pangalang Ela ay nangangahulugang terebinto."
    - "Ang libis ang hangganan ng Juda at ng mga Filisteo: ang Gath, lungsod ni Goliath, ay mga 15 km pababa sa libis sa kanluran, at tumakas ang mga natalong Filisteo “sa daang patungo sa Saraim, hanggang sa Gath, at sa Ecron”. Sa hilagang tagaytay sa tapat ng Socho nakatayo ang Khirbet Qeiyafa, isang bayang nakukutaan noong mga 1000 BK na may dalawang pintuan, hinukay mula 2007, na itinuturing ng mga humukay na Saaraim ng kuwento, pangalang nangangahulugang dalawang pintuan; pinagdududahan ito ng iba. Ipinakikita ng mapa ang libis, Socho, Azeca, Ephesdammim at Gath."
  da:
    - "I Terebintedalen, den brede dal Wadi es-Sant i Judas forbjerge, omkring 25 km sydvest for Jerusalem og 20 km vest for Betlehem i luftlinje, på vej ned fra bjerglandet til filisternes slette. Kortets punkt står i dalen mellem de to byer, som fortællingen nævner."
    - "Første Samuelsbog siger, at filisterne »lejrede sig imellem Soko og imellem Aseka ved Efes-Dammim«, mens »Saul og Israels Mænd samledes og lejrede sig i Egens Dal«; »Filisterne stode paa Bjerget paa hin Side, og Israeliterne stode paa Bjerget paa denne Side, og Dalen var imellem dem.« Soko, Khirbet Shuweikeh, ligger på dalens sydside, og Azeka, Tell Zakariyeh, omkring 4 km mod vestnordvest ved dens vestlige bugt; bækken i dalbunden er, hvor David valgte sine sten. Navnet Ela betyder terebint."
    - "Dalen var grænsen mellem Juda og filisterne: Gat, Goliats by, ligger omkring 15 km nede ad dalen mod vest, og de slagne filistre faldt »paa Vejen til Saarajim og indtil Gath og indtil Ekron«. På den nordlige højderyg over for Soko ligger Khirbet Qeiyafa, en befæstet by fra omkring 1000 f.Kr. med to porte, udgravet fra 2007, som dens udgravere tager for fortællingens Sja'arajim, et navn der betyder to porte; andre betvivler identifikationen. Kortet viser dalen, Soko, Azeka, Efes-Dammim og Gat."
