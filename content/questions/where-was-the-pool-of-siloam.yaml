id: where-was-the-pool-of-siloam
question:
  en: "Where was the Pool of Siloam?"
  ru: "Где находилась купальня Силоам?"
  uk: "Де був басейн Силоам?"
  es: "¿Dónde estaba el estanque de Siloé?"
  pt: "Onde ficava o tanque de Siloé?"
  de: "Wo lag der Teich Siloah?"
  fr: "Où se trouvait le bassin de Siloé ?"
  pl: "Gdzie leżała sadzawka Siloe?"
  it: "Dov’era la piscina di Siloe?"
  cs: "Kde ležel rybník Siloe?"
  nl: "Waar lag de vijver van Siloam?"
  sv: "Var låg Siloadammen?"
  nb: "Hvor lå Siloa-dammen?"
  tl: "Nasaan ang Tangke ng Siloe?"
  da: "Hvor lå Siloam-dammen?"
  sr: "Где је било Силоамско језеро?"
  hu: "Hol volt a Siloám-tó?"
  fi: "Missä Siloan allas sijaitsi?"
  vi: "Ao Si-lô-ê ở đâu?"
  ro: "Unde se afla Scăldătoarea Siloamului?"
  bg: "Къде се е намирала къпалнята Силоам?"
answer:
  en:
    - "At the southern end of the City of David, the oldest part of Jerusalem, below the Old City walls near the village of Silwan, which keeps the name; the map point stands there. It lay where the water of the Gihon spring, about 300 m away in a straight line, comes out after running through Hezekiah's tunnel, and about 1.2 km south of the Pool of Bethesda. Two pools are shown today: the small Byzantine one at the tunnel's outlet, long taken for the pool of the Gospel, and a larger stepped pool of Jesus' day found a little to the south-east in 2004."
    - "John tells how Jesus anointed the eyes of a man born blind with clay and said, “Go, wash in the pool of Siloam, (which is by interpretation, Sent.) He went his way therefore, and washed, and came seeing.” Luke mentions “those eighteen, upon whom the tower in Siloam fell”. The water had come there long before: Hezekiah “made a pool, and a conduit, and brought water into the city” before the Assyrian invasion of 701 BC, and Nehemiah's builders repaired “the wall of the pool of Siloah by the king's garden”."
    - "Frederick Bliss and Archibald Dickie uncovered the Byzantine church and pool at the tunnel's outlet in 1894–1897. In 2004 repair work on a pipe led Ronny Reich and Eli Shukron to the older pool: a great stepped reservoir some 70 m long, plastered in the Hasmonean period and used until the war against Rome, from which a stepped street climbs towards the Temple Mount. Most scholars now take it for the pool of John 9; part of it still lies under an orchard, and its full excavation was announced at the end of 2022."
  ru:
    - "На южном конце города Давидова, древнейшей части Иерусалима, ниже стен Старого города, у деревни Сильван, которая хранит имя; там стоит точка карты. Купальня лежала там, где вода источника Гион, примерно в 300 м по прямой, выходит наружу, пройдя тоннель Езекии, и примерно в 1,2 км к югу от купальни Вифезда. Сегодня показывают два водоёма: малый византийский у выхода тоннеля, который долго считали евангельским, и больший ступенчатый водоём времён Иисуса, найденный чуть юго-восточнее в 2004 году."
    - "Иоанн рассказывает, как Иисус помазал брением глаза слепорождённому и сказал: «пойди, умойся в купальне Силоам, что значит посланный. Он пошел, и умылся, и пришел зрячим». Лука упоминает «те восемнадцать человек, на которых упала башня Силоамская». Вода пришла сюда задолго до того: Езекия «сделал пруд и водопровод и провел воду в город» перед ассирийским нашествием 701 г. до н. э., а строители Неемии чинили «стену у водоема Селах против царского сада»."
    - "Фредерик Блисс и Арчибальд Дики в 1894–1897 годах открыли византийскую церковь и водоём у выхода тоннеля. В 2004 году ремонт трубы привёл Рони Райха и Эли Шукрона к более древней купальне: большому ступенчатому водоёму длиной около 70 м, оштукатуренному в хасмонейское время и служившему до войны с Римом; от него ступенчатая улица поднимается к Храмовой горе. Большинство учёных теперь считают его купальней из 9-й главы Иоанна; часть его ещё лежит под садом, а в конце 2022 года объявили о его полных раскопках."
  uk:
    - "На південному кінці Міста Давида, найдавнішої частини Єрусалима, під мурами Старого міста біля села Сільван, яке зберігає цю назву; точка на мапі стоїть там. Він лежав там, де вода джерела Гіхон, приблизно за 300 м по прямій, виходить після проходження тунелем Єзекії, і приблизно за 1,2 км на південь від басейну Віфезда. Нині показують два басейни: малий візантійський біля виходу тунелю, який довго вважали басейном з Євангелія, і більший східчастий басейн часів Ісуса, знайдений трохи на південний схід 2004 р."
    - "Іван розповідає, як Ісус помазав очі сліпородженого глиною і сказав: «Іди, вмий ся в купелї Силоамській (що перекладом: Посланий). Пійшов же і вмивсь, та й прийшов видющий.» Лука згадує «ті вісїмнайцять, що впала на них башта в Силоамі». Вода прийшла туди задовго до цього: Єзекія «зробив став і водопровід, і провів у город воду» перед ассирійським вторгненням 701 р. до н. е., а будівники Неемії лагодили «мур коло ставка Селаха, проти царського садка»."
    - "Фредерік Бліс і Арчібальд Дікі відкрили візантійську церкву й басейн біля виходу тунелю в 1894–1897 рр. 2004 р. ремонт труби привів Ронні Райха й Елі Шукрона до старшого басейну: великого східчастого резервуара завдовжки близько 70 м, обмазаного в хасмонейську добу й використовуваного до війни проти Рима, від якого східчаста вулиця піднімається до Храмової гори. Більшість учених нині вважають його басейном з Івана 9; частина його досі лежить під садом, а повні розкопки було оголошено наприкінці 2022 р."
  es:
    - "En el extremo sur de la Ciudad de David, la parte más antigua de Jerusalén, bajo las murallas de la Ciudad Vieja, cerca de la aldea de Silwan, que conserva el nombre; el punto del mapa está allí. Se hallaba donde sale el agua de la fuente de Gihón, a unos 300 m en línea recta, después de recorrer el túnel de Ezequías, y a unos 1,2 km al sur del estanque de Betesda. Hoy se muestran dos estanques: el pequeño bizantino, a la salida del túnel, tenido durante mucho tiempo por el estanque del Evangelio, y uno mayor, con escalones, de los días de Jesús, hallado un poco al sureste en 2004."
    - "Juan cuenta cómo Jesús untó con barro los ojos de un ciego de nacimiento y dijo: «Ve, lávate en el estanque de Siloé (que significa, si lo interpretares, Enviado). Y fué entonces, y lavóse, y volvió viendo». Lucas menciona a «aquellos dieciocho, sobre los cuales cayó la torre en Siloé». El agua había llegado allí mucho antes: Ezequías «hizo el estanque, y el conducto, y metió las aguas en la ciudad» antes de la invasión asiria del 701 a. C., y los constructores de Nehemías repararon «el muro del estanque de Selah hacia la huerta del rey»."
    - "Frederick Bliss y Archibald Dickie sacaron a la luz la iglesia y el estanque bizantinos a la salida del túnel en 1894–1897. En 2004, unas obras de reparación de una tubería llevaron a Ronny Reich y Eli Shukron al estanque más antiguo: un gran depósito con escalones de unos 70 m de longitud, enlucido en época asmonea y usado hasta la guerra contra Roma, del que sube hacia el Monte del Templo una calle con escalones. La mayoría de los estudiosos lo toman ahora por el estanque de Juan 9; parte de él sigue bajo un huerto, y su excavación completa se anunció a finales de 2022."
  pt:
    - "Na extremidade sul da Cidade de Davi, a parte mais antiga de Jerusalém, abaixo das muralhas da Cidade Velha, perto da aldeia de Silwan, que conserva o nome; o ponto do mapa fica ali. Ficava onde sai a água da fonte de Giom, a cerca de 300 m em linha reta, depois de correr pelo túnel de Ezequias, e a cerca de 1,2 km ao sul do tanque de Betesda. Dois tanques são mostrados hoje: o pequeno, bizantino, na saída do túnel, há muito tomado pelo tanque do Evangelho, e um tanque escalonado maior, do tempo de Jesus, encontrado um pouco a sudeste em 2004."
    - "João conta como Jesus ungiu os olhos de um cego de nascença com barro e disse: “Vá, lave-se no tanque de Siloé (que significa ‘Enviado’). Então ele foi, lavou-se e voltou vendo.” Lucas menciona “aqueles dezoito sobre os quais caiu a torre de Siloé”. A água chegara ali muito antes: Ezequias “fez o tanque e o aqueduto, e trouxe água para a cidade” antes da invasão assíria de 701 a.C., e os construtores de Neemias repararam “a muralha do tanque de Selá, junto ao jardim do rei”."
    - "Frederick Bliss e Archibald Dickie descobriram a igreja e o tanque bizantinos na saída do túnel em 1894–1897. Em 2004, obras de reparo numa tubulação levaram Ronny Reich e Eli Shukron ao tanque mais antigo: um grande reservatório escalonado de cerca de 70 m de comprimento, revestido de reboco no período asmoneu e usado até a guerra contra Roma, do qual sobe uma rua escalonada em direção ao monte do Templo. A maioria dos estudiosos o toma hoje pelo tanque de João 9; parte dele ainda jaz sob um pomar, e sua escavação completa foi anunciada no final de 2022."
  de:
    - "Am Südende der Stadt Davids, des ältesten Teils von Jerusalem, unterhalb der Mauern der Altstadt beim Dorf Silwan, das den Namen bewahrt; dort steht der Kartenpunkt. Er lag dort, wo das Wasser der Gihon-Quelle, in der Luftlinie etwa 300 m entfernt, nach dem Lauf durch den Hiskia-Tunnel austritt, und etwa 1,2 km südlich des Teichs Betesda. Heute werden zwei Teiche gezeigt: der kleine byzantinische am Tunnelausgang, lange für den Teich des Evangeliums gehalten, und ein größerer Stufenteich aus Jesu Zeit, der 2004 ein wenig südöstlich gefunden wurde."
    - "Johannes erzählt, wie Jesus die Augen eines Blindgeborenen mit Kot bestrich und sagte: „Gehe hin zu dem Teich Siloah (das ist verdolmetscht: gesandt) und wasche dich! Da ging er hin und wusch sich und kam sehend.“ Lukas erwähnt „die achtzehn, auf die der Turm von Siloah fiel“. Das Wasser war lange zuvor dorthin gekommen: Von Hiskia ist vor dem assyrischen Einfall von 701 v. Chr. verzeichnet: „der Teich und die Wasserleitung, durch die er Wasser in die Stadt geleitet hat“, und Nehemias Bauleute besserten „die Mauer am Teich Siloah bei dem Garten des Königs“ aus."
    - "Frederick Bliss und Archibald Dickie legten 1894–1897 die byzantinische Kirche und den Teich am Tunnelausgang frei. Im Jahr 2004 führten Reparaturarbeiten an einem Rohr Ronny Reich und Eli Shukron zum älteren Teich: einem großen Stufenbecken von etwa 70 m Länge, in hasmonäischer Zeit verputzt und bis zum Krieg gegen Rom benutzt, von dem eine Stufenstraße zum Tempelberg hinaufführt. Die meisten Gelehrten halten ihn heute für den Teich von Johannes 9; ein Teil liegt noch unter einem Obstgarten, und seine vollständige Ausgrabung wurde Ende 2022 angekündigt."
  fr:
    - "À l’extrémité sud de la Cité de David, la plus ancienne partie de Jérusalem, en dessous des remparts de la vieille ville, près du village de Silwan, qui en garde le nom ; le point de la carte s’y trouve. Il se trouvait là où l’eau de la source de Guihon, à environ 300 m à vol d’oiseau, sort après avoir traversé le tunnel d’Ézéchias, et à environ 1,2 km au sud de la piscine de Béthesda. Deux bassins sont montrés aujourd’hui : le petit bassin byzantin à la sortie du tunnel, longtemps tenu pour le bassin de l’Évangile, et un bassin à gradins plus grand, du temps de Jésus, découvert un peu plus au sud-est en 2004."
    - "Jean raconte comment Jésus appliqua de la boue sur les yeux d’un aveugle de naissance et lui dit : « Va, et lave-toi au réservoir de Siloé (nom qui signifie envoyé). Il y alla, se lava, et s’en retourna voyant clair. » Luc mentionne « ces dix-huit personnes sur qui est tombée la tour de Siloé ». L’eau y était arrivée bien avant : Ézéchias « fit l’étang et l’aqueduc, et amena les eaux dans la ville » avant l’invasion assyrienne de 701 av. J.-C., et les bâtisseurs de Néhémie réparèrent « le mur de l’étang de Siloé, près du jardin du roi »."
    - "Frederick Bliss et Archibald Dickie mirent au jour l’église et le bassin byzantins à la sortie du tunnel en 1894-1897. En 2004, des travaux de réparation sur une canalisation conduisirent Ronny Reich et Eli Shukron au bassin plus ancien : un grand réservoir à gradins d’environ 70 m de long, enduit à l’époque hasmonéenne et utilisé jusqu’à la guerre contre Rome, d’où une rue à degrés monte vers le mont du Temple. La plupart des spécialistes y voient aujourd’hui le bassin de Jean 9 ; une partie se trouve encore sous un verger, et sa fouille complète a été annoncée à la fin de 2022."
  pl:
    - "Na południowym krańcu Miasta Dawida, najstarszej części Jerozolimy, poniżej murów Starego Miasta, koło wsi Silwan, która zachowuje tę nazwę; tam stoi punkt na mapie. Leżała tam, gdzie woda ze źródła Gichon, oddalonego o około 300 m w linii prostej, wypływa po przebiegu tunelem Ezechiasza, i około 1,2 km na południe od sadzawki Betesda. Pokazuje się dziś dwie sadzawki: małą bizantyjską przy wylocie tunelu, od dawna uważaną za sadzawkę z Ewangelii, i większą sadzawkę ze schodami z czasów Jezusa, odnalezioną nieco na południowy wschód w 2004."
    - "Jan opowiada, jak Jezus pomazał oczy człowieka ślepego od urodzenia błotem i rzekł: „Idź, umyj się w sadzawce Syloe, co się wykłada posłany. Poszedł tedy i umył się, i przyszedł widząc”. Łukasz wspomina „ośmnaście onych, na które upadła wieża w Syloe”. Woda dotarła tam dawno wcześniej: Ezechiasz „uczynił sadzawkę, i rury, którymi przywiódł wodę do miasta” przed asyryjską inwazją w 701 p.n.e., a budowniczowie Nehemiasza naprawili „mur nad stawem Selach ku ogrodowi królewskiemu”."
    - "Frederick Bliss i Archibald Dickie odsłonili bizantyjski kościół i sadzawkę przy wylocie tunelu w latach 1894–1897. W 2004 prace naprawcze przy rurze doprowadziły Ronny'ego Reicha i Eliego Shukrona do starszej sadzawki: wielkiego zbiornika ze schodami o długości około 70 m, otynkowanego w okresie hasmonejskim i używanego do wojny z Rzymem, z którego wspina się ulica ze schodami ku Wzgórzu Świątynnemu. Większość uczonych uważa ją dziś za sadzawkę z J 9; jej część wciąż leży pod sadem, a pełne wykopaliska ogłoszono pod koniec 2022 roku."
  it:
    - "All’estremità meridionale della Città di Davide, la parte più antica di Gerusalemme, sotto le mura della Città Vecchia presso il villaggio di Silwan, che ne conserva il nome; il punto della mappa si trova lì. Sorgeva dove l’acqua della sorgente di Ghicon, a circa 300 m di distanza in linea d’aria, esce dopo aver percorso il tunnel di Ezechia, e a circa 1,2 km a sud della piscina di Betesda. Oggi se ne mostrano due: la piccola piscina bizantina allo sbocco del tunnel, a lungo ritenuta la piscina del Vangelo, e una più grande piscina a gradini dei tempi di Gesù trovata un po’ a sud-est nel 2004."
    - "Giovanni racconta come Gesù spalmò gli occhi di un cieco nato con del fango e disse: «Va’, làvati nella vasca di Siloe (che significa: mandato). Egli dunque andò e si lavò, e tornò che ci vedeva». Luca menziona «quei diciotto sui quali cadde la torre in Siloe». L’acqua vi era giunta molto prima: Ezechia, prima dell’invasione assira del 701 a.C., «fece il serbatoio e l’acquedotto e condusse le acque nella città», e i costruttori di Neemia riparavano «il muro del serbatoio di Scelah, presso il giardino del re»."
    - "Frederick Bliss e Archibald Dickie portarono alla luce la chiesa e la piscina bizantine allo sbocco del tunnel nel 1894–1897. Nel 2004 lavori di riparazione a una tubatura condussero Ronny Reich ed Eli Shukron alla piscina più antica: un grande serbatoio a gradini lungo circa 70 m, intonacato in epoca asmonea e usato fino alla guerra contro Roma, dal quale una strada a gradini sale verso il Monte del Tempio. La maggior parte degli studiosi la ritiene oggi la piscina di Gv 9; una parte si trova ancora sotto un frutteto, e il suo scavo completo è stato annunciato alla fine del 2022."
  cs:
    - "Na jižním konci Města Davidova, nejstarší části Jeruzaléma, pod hradbami Starého města poblíž vsi Silwán, která jméno zachovává; bod na mapě stojí tam. Ležel tam, kde vychází voda z pramene Gichón, vzdušnou čarou asi 300 m daleko, po průchodu Chizkijášovým tunelem, a asi 1,2 km jižně od rybníka Bethesda. Dnes se ukazují dva rybníky: malý byzantský na výtoku tunelu, dlouho pokládaný za rybník evangelia, a větší schodišťový rybník z Ježíšovy doby nalezený kousek na jihovýchod roku 2004."
    - "Jan vypráví, jak Ježíš pomazal oči slepého od narození blátem a řekl: „Jdi, umej se v rybníku Siloe, jenž se vykládá: Poslaný. A on šel a umyl se, i přišel, vida.“ Lukáš zmiňuje „oněch osmnácte, na kteréžto upadla věže v Siloe“. Voda se tam dostala dávno předtím: Chizkijáš „udělal rybník, a vodu po trubách uvedl do města“ před asyrským vpádem roku 701 př. n. l. a Nehemjášovi stavitelé opravovali „zed rybníka Selach, od zahrady královské“."
    - "Frederick Bliss a Archibald Dickie odkryli byzantský kostel a rybník na výtoku tunelu v letech 1894–1897. Roku 2004 vedly opravy potrubí Ronnyho Reicha a Eliho Shukrona ke starší nádrži: velkému schodišťovému rybníku dlouhému asi 70 m, omítnutému v období hasmoneovském a užívanému až do války proti Římu, z něhož stoupá schodišťová ulice k Chrámové hoře. Většina badatelů ji nyní pokládá za rybník z Janova evangelia 9; část leží dosud pod sadem a její úplné vykopání bylo oznámeno koncem roku 2022."
  nl:
    - "Aan het zuidelijke uiteinde van de Stad van David, het oudste deel van Jeruzalem, onder de muren van de Oude Stad bij het dorp Silwan, dat de naam bewaart; het punt op de kaart staat daar. Het lag waar het water van de bron Gihon, hemelsbreed ongeveer 300 m verderop, uitkomt nadat het door de tunnel van Chizkia is gelopen, en ongeveer 1,2 km ten zuiden van de vijver van Bethesda. Tegenwoordig worden twee vijvers getoond: de kleine Byzantijnse bij de uitgang van de tunnel, lang voor de vijver uit het evangelie gehouden, en een grotere vijver met trappen uit de tijd van Jezus, in 2004 iets ten zuidoosten ervan gevonden."
    - "Johannes vertelt hoe Jezus de ogen van een van geboorte blinde man met slijk bestreek en zei: “Ga heen, was u in het badwater Siloam (hetwelk overgezet wordt: uitgezonden). Hij dan ging heen en wies zich, en kwam ziende.” Lukas noemt “die achttien, op welke de toren in Siloam viel”. Het water was er al lang eerder gekomen: Chizkia, van wie staat “hoe hij den vijver en den watergang gemaakt heeft, en water in de stad gebracht heeft”, deed dat vóór de Assyrische inval van 701 v.Chr., en de bouwers van Nehemia herstelden “den muur des vijvers Schelah bij des konings hof”."
    - "Frederick Bliss en Archibald Dickie legden in 1894–1897 de Byzantijnse kerk en vijver bij de uitgang van de tunnel bloot. In 2004 leidde reparatiewerk aan een leiding Ronny Reich en Eli Shukron naar de oudere vijver: een groot stenen bekken met trappen van zo'n 70 m lang, in de Hasmoneese tijd gepleisterd en gebruikt tot de oorlog tegen Rome, vanwaar een straat met trappen omhoog loopt naar de Tempelberg. De meeste geleerden houden haar nu voor de vijver van Joh. 9; een deel ligt nog onder een boomgaard, en de volledige opgraving ervan werd eind 2022 aangekondigd."
  sv:
    - "I södra änden av Davids stad, det äldsta Jerusalem, nedanför Gamla stadens murar nära byn Silwan, som bevarar namnet; kartpunkten står där. Den låg där vattnet från Gihonkällan, omkring 300 m bort i fågelvägen, kommer ut efter att ha runnit genom Hiskias tunnel, och omkring 1,2 km söder om Betesdadammen. Två dammar visas i dag: den lilla bysantinska vid tunnelns utlopp, länge ansedd som evangeliets damm, och en större trappstegsdamm från Jesu tid som hittades något sydost om den 2004."
    - "Johannes berättar hur Jesus smorde ögonen på en man som var född blind med deg av spott och sade: ”Gå bort och två dig i dammen Siloam (det betyder utsänd). Mannen gick då dit och tvådde sig; och när han kom igen, kunde han se.” Lukas nämner ”de aderton som dödades, när tornet i Siloam föll på dem”. Vattnet hade kommit dit långt tidigare: Hiskia ”anlade dammen och vattenledningen och ledde vatten in i staden” före den assyriska invasionen 701 f.Kr., och Nehemjas byggare reparerade ”muren vid Vattenledningsdammen, invid den kungliga trädgården”."
    - "Frederick Bliss och Archibald Dickie avtäckte den bysantinska kyrkan och dammen vid tunnelns utlopp 1894–1897. År 2004 ledde reparationsarbete på en rörledning Ronny Reich och Eli Shukron till den äldre dammen: en stor trappstegsreservoar på omkring 70 m längd, putsad under hasmoneisk tid och använd fram till kriget mot Rom, från vilken en trappgata stiger mot Tempelberget. De flesta forskare tar den nu för dammen i Joh 9; en del av den ligger fortfarande under en fruktträdgård, och dess fullständiga utgrävning tillkännagavs i slutet av 2022."
  nb:
    - "I den sørlige enden av Davidsbyen, den eldste delen av Jerusalem, under gamlebyens murer nær landsbyen Silwan, som bevarer navnet; kartpunktet står der. Den lå der vannet fra Gihon-kilden, omtrent 300 m unna i luftlinje, kommer ut etter å ha rent gjennom Hiskias tunnel, og omtrent 1,2 km sør for Betesda-dammen. To dammer vises i dag: den lille bysantinske ved tunnelens utløp, lenge regnet for evangeliets dam, og en større dam med trinn fra Jesu tid som ble funnet litt lenger sørøst i 2004."
    - "Johannes forteller hvordan Jesus smurte øynene på en mann som var født blind, med leire og sa: «Gå og vask dig i dammen Siloa, det er utlagt: utsendt. Han gikk da bort og vasket sig, og kom tilbake seende.» Lukas nevner «hine atten som tårnet ved Siloa falt over». Vannet hadde kommet dit lenge før: Hiskia «gjorde dammen og vannledningen og førte vannet inn i byen» før den assyriske invasjonen i 701 f.Kr., og Nehemjas byggere satte i stand «muren ved Selah-dammen ved kongens have»."
    - "Frederick Bliss og Archibald Dickie avdekket den bysantinske kirken og dammen ved tunnelens utløp i 1894–1897. I 2004 førte reparasjonsarbeid på et rør Ronny Reich og Eli Shukron til den eldre dammen: et stort reservoar med trinn, omtrent 70 m langt, pusset i hasmoneertiden og brukt til krigen mot Roma, hvorfra en trinnbelagt gate stiger mot Tempelplassen. De fleste forskere tar den nå for dammen i Joh 9; en del av den ligger fortsatt under en frukthage, og full utgraving ble kunngjort i slutten av 2022."
  tl:
    - "Sa katimugang dulo ng Bayan ni David, ang pinakamatandang bahagi ng Jerusalem, sa ibaba ng mga pader ng Lumang Lungsod malapit sa nayon ng Silwan, na nagpapanatili ng pangalan; naroon ang punto sa mapa. Nasa lugar ito kung saan lumalabas ang tubig ng bukal ng Gihon, mga 300 m ang layo sa tuwid na guhit, pagkatapos dumaan sa lagusan ni Ezechias, at mga 1.2 km sa timog ng Tangke ng Betesda. Dalawang tangke ang ipinakikita ngayon: ang maliit na Bizantino sa labasan ng lagusan, na matagal nang itinuring na tangke ng Ebanghelyo, at isang mas malaking tangkeng may baytang noong panahon ni Jesus na natagpuan nang bahagya sa timog-silangan noong 2004."
    - "Isinasalaysay ni Juan kung paano pinahiran ni Jesus ng putik ang mga mata ng isang taong ipinanganak na bulag at sinabi, “Humayo ka, maghugas ka sa tangke ng Siloe (na kung liliwanagin ay Sinugo). Siya nga'y humayo, at naghugas, at nagbalik na nakakakita.” Binabanggit ni Lucas ang “yaong labingwalo, na nalagpakan ng moog sa Siloe”. Matagal nang naroon ang tubig: ginawa ni Ezechias “ang tipunan ng tubig, at ang padaluyan, at nagdala ng tubig sa bayan” bago ang paglusob ng Asiria noong 701 BK, at inayos ng mga tagapagtayo ni Nehemias ang “pader ng tangke ng Selah sa tabi ng halamanan ng hari”."
    - "Natuklasan nina Frederick Bliss at Archibald Dickie ang simbahang Bizantino at tangke sa labasan ng lagusan noong 1894–1897. Noong 2004, ang pagkukumpuni ng isang tubo ang nagdala kina Ronny Reich at Eli Shukron sa mas lumang tangke: isang malaking imbakang may baytang na mga 70 m ang haba, na pinlasteran noong panahong Hasmoneo at ginamit hanggang sa digmaan laban sa Roma, kung saan umaakyat ang isang kalyeng may baytang patungo sa Bundok ng Templo. Karamihan ng mga iskolar ngayon ay itinuturing itong tangke ng Juan 9; ang bahagi nito ay nasa ilalim pa ng isang taniman, at inihayag ang buong paghuhukay nito sa katapusan ng 2022."
  da:
    - "I den sydlige ende af Davidsbyen, Jerusalems ældste del, neden for den gamle bydels mure nær landsbyen Silwan, som bevarer navnet; kortets punkt står der. Den lå, hvor vandet fra Gihon-kilden, ca. 300 m væk i fugleflugt, kommer ud efter at have løbet gennem Hizkijas tunnel, og ca. 1,2 km syd for Betesda-dammen. To damme vises i dag: den lille byzantinske ved tunnelens udløb, længe taget for evangeliets dam, og en større trindelt dam fra Jesu tid, fundet lidt mod sydøst i 2004."
    - "Johannes fortæller, hvordan Jesus salvede øjnene på en mand, der var født blind, med dynd og sagde: »Gaa hen, to dig i Dammen Siloam« (»hvilket er udlagt: udsendt«). »Da gik han bort og toede sig, og han kom seende tilbage.« Lukas nævner »hine atten, som Taarnet i Siloam faldt ned over og ihjelslog«. Vandet var kommet dertil længe før: Hizkija lavede før den assyriske invasion i 701 f.Kr. »Dammen og Vandledningen, hvorved han førte Vandet ind i Staden«, og Nehemias’ bygmestre istandsatte »Muren ved Sela Dam hen imod Kongens Have«."
    - "Frederick Bliss og Archibald Dickie afdækkede den byzantinske kirke og dam ved tunnelens udløb i 1894-1897. I 2004 førte reparationsarbejde på et rør Ronny Reich og Eli Shukron til den ældre dam: et stort trindelt reservoir på ca. 70 m, pudset i den hasmonæiske periode og brugt indtil krigen mod Rom, hvorfra en trindelt gade stiger mod Tempelbjerget. De fleste forskere tager den nu for dammen i Joh 9; en del af den ligger stadig under en frugtplantage, og dens fulde udgravning blev annonceret i slutningen af 2022."
  sr:
    - "На јужном крају Давидовог града, најстаријег дела Јерусалима, испод зидова Старог града код села Силван, које чува име; тачка на карти стоји ту. Лежало је тамо где вода извора Гион, удаљеног око 300 м ваздушном линијом, излази пошто прође кроз Језекијин тунел, и око 1,2 км јужно од Витездског језера. Данас се показују два језера: мало византијско на излазу тунела, дуго узимано за језеро из јеванђеља, и веће степенасто језеро из Исусовог времена, пронађено мало југоисточније 2004."
    - "Јован казује како је Исус помазао очи човеку слепом од рођења блатом и рекао: „Иди умиј се у бањи силоамској (које значи послан). Отиде, дакле, и уми се, и дође гледајући.“ Лука помиње „оних осамнаест што на њих паде кула силоамска“. Вода је ту дошла много раније: о Језекији се пише „како је начинио језеро, и воду довео у град“, пре асирске најезде 701. п. н. е., а Немијини градитељи поправљали су „зид код бање силоамске од врта царевог“."
    - "Фредерик Блис и Арчибалд Дики открили су византијску цркву и језеро на излазу тунела 1894–1897. Године 2004. радови на поправци цеви довели су Ронија Рајха и Ели Шукрона до старијег језера: великог степенастог резервоара дугог око 70 м, малтерисаног у хасмонејско доба и коришћеног до рата против Рима, из којег степенаста улица води ка Храмовној гори. Већина научника сада га узима за језеро из Јн 9; део његов још лежи испод воћњака, а његово потпуно ископавање најављено је крајем 2022."
  hu:
    - "Dávid városának déli végén, Jeruzsálem legrégibb részén, az Óváros falai alatt, Silwan falu közelében, amely megőrzi a nevet; a térkép pontja ott áll. Ott feküdt, ahol a Gihon-forrás vize, légvonalban mintegy 300 m-re, Ezékiás alagútján át kifolyik, és mintegy 1,2 km-re délre a Betesda-tótól. Ma két tavat mutatnak: az alagút kifolyásánál a kis bizánci tavat, amelyet sokáig az evangéliumi tónak tartottak, és egy nagyobb, lépcsős, Jézus korabeli tavat, amelyet kissé délkeletebbre találtak 2004-ben."
    - "János elmondja, hogyan kente be Jézus egy vakon született ember szemét sárral, és mondta: „Menj el, mosakodjál meg a Siloám tavában (a mi azt jelenti: Küldött). Elméne azért és megmosakodék, és megjöve látva.” Lukács említi a tizennyolcat, „a kire rászakadt a torony Siloámban”. A víz régen odaért: Ezékiás a Kr. e. 701-es asszír támadás előtt, ahogy a Királyok könyve mondja, „miképen csinálta a tavat és a vízcsöveket, a melyekkel a vizet a városba vezette”, Nehémiás építői pedig javították „a Selah tó kőfalát a király kertje felé”."
    - "Frederick Bliss és Archibald Dickie 1894–1897-ben tárta fel a bizánci templomot és tavat az alagút kifolyásánál. 2004-ben egy csőjavítás Ronny Reichet és Eli Shukront a régebbi tóhoz vezette: egy mintegy 70 m hosszú nagy lépcsős tározóhoz, amelyet a hasmóneus korban vakoltak, és a Róma elleni háborúig használtak, és amelyből lépcsős utca vezet a Templomhegy felé. A legtöbb tudós ma a János 9 tavának tartja; egy része még gyümölcsös alatt fekszik, és teljes feltárását 2022 végén jelentették be."
  fi:
    - "Daavidin kaupungin, Jerusalemin vanhimman osan, eteläpäässä, vanhankaupungin muurien alapuolella Silwanin kylän lähellä, joka säilyttää nimen; kartan piste on siellä. Se sijaitsi siinä, missä Gihonin lähteen vesi, noin 300 m linnuntietä, tulee ulos juostuaan Hiskian tunnelin läpi, ja noin 1,2 km Betesdan lammikosta etelään. Nykyisin näytetään kaksi allasta: pieni bysanttilainen tunnelin suulla, jota pidettiin pitkään evankeliumin altaana, ja suurempi, Jeesuksen aikainen portaallinen allas, joka löydettiin hieman kaakkoon vuonna 2004."
    - "Johannes kertoo, kuinka Jeesus voiteli syntymästään sokean miehen silmät savella ja sanoi: ”Mene ja peseydy Siiloan lammikossa” – se on käännettynä: lähetetty – ”Niin hän meni ja peseytyi ja palasi näkevänä.” Luukas mainitsee ”ne kahdeksantoista, jotka saivat surmansa, kun torni Siloassa kaatui heidän päällensä”. Vesi oli tullut sinne jo kauan sitten: Hiskia ”rakensi lammikon ja vesijohdon ja johti veden kaupunkiin” ennen assyrialaisten hyökkäystä vuonna 701 eaa., ja Nehemian rakentajat korjasivat ”Vesijohtolammikon muurin, kuninkaan puutarhan luota”."
    - "Frederick Bliss ja Archibald Dickie paljastivat bysanttilaisen kirkon ja altaan tunnelin suulla vuosina 1894–1897. Vuonna 2004 putken korjaustyö johdatti Ronny Reichin ja Eli Shukronin vanhemman altaan äärelle: suuri portaallinen säiliö, noin 70 m pitkä, rapattu hasmonealaisaikana ja käytetty Roomaa vastaan käytyyn sotaan asti, ja siitä nousee portaallinen katu kohti Temppelivuorta. Useimmat tutkijat pitävät sitä nykyään Johanneksen luvun 9 allasena; osa siitä on yhä hedelmätarhan alla, ja sen täydellinen kaivaus ilmoitettiin vuoden 2022 lopussa."
  vi:
    - "Ở đầu nam của Thành Đa-vít, phần cổ nhất của Giê-ru-sa-lem, bên dưới tường Thành Cổ gần làng Silwan, nơi giữ tên ấy; điểm trên bản đồ nằm ở đó. Nó nằm nơi nước của suối Ghi-hôn, cách khoảng 300 m theo đường thẳng, chảy ra sau khi đi qua đường hầm của Ê-xê-chia, và cách Ao Bê-tết-đa khoảng 1,2 km về phía nam. Ngày nay có hai ao được chỉ: ao Byzantine nhỏ ở cửa ra của đường hầm, từ lâu được coi là ao trong Phúc Âm, và một ao lớn hơn có bậc thang thời Giê-su được tìm thấy hơi lệch đông nam vào năm 2004."
    - "Giăng kể Giê-su bôi bùn lên mắt một người mù từ lúc sinh ra và phán: “Hãy đi, rửa nơi ao Si-lô-ê (nghĩa là chịu sai đi). Vậy, người đi đến ao đó, rửa, và trở lại, thì được thấy rõ.” Lu-ca nhắc đến “mười tám người bị tháp Si-lô-ê ngã xuống đè chết”. Nước đã đến đó từ lâu trước: Ê-xê-chia có “cuộc xây hồ chứa nước, và kinh dẫn nước vào trong thành” trước cuộc xâm lăng của A-si-ri năm 701 TCN, và những người xây của Nê-hê-mi sửa “vách ngăn của ao Si-lô-ê gần bên vườn vua”."
    - "Frederick Bliss và Archibald Dickie phát lộ nhà thờ và ao Byzantine ở cửa ra đường hầm năm 1894–1897. Năm 2004, công việc sửa một đường ống đã dẫn Ronny Reich và Eli Shukron đến ao cổ hơn: một hồ chứa lớn có bậc thang dài khoảng 70 m, trát vữa vào thời Hasmon và dùng cho đến cuộc chiến chống Rô-ma, từ đó một con đường bậc thang leo lên Núi Đền. Hầu hết học giả nay coi nó là ao trong Giăng 9; một phần của nó vẫn nằm dưới một vườn cây ăn quả, và kế hoạch khai quật toàn bộ được công bố vào cuối năm 2022."
  ro:
    - "La capătul sudic al Cetății lui David, cea mai veche parte a Ierusalimului, sub zidurile Orașului Vechi, lângă satul Silwan, care păstrează numele; punctul de pe hartă se află acolo. Se afla unde iese apa izvorului Ghihon, aflat la circa 300 m în linie dreaptă, după ce a străbătut tunelul lui Ezechia, și la circa 1,2 km sud de Scăldătoarea Betesda. Astăzi sunt arătate două scăldători: cea mică, bizantină, de la ieșirea tunelului, socotită multă vreme scăldătoarea Evangheliei, și una mai mare, cu trepte, din vremea lui Isus, găsită puțin spre sud-est în 2004."
    - "Ioan povestește cum Isus a uns ochii unui orb din naștere cu lut și i-a zis: „mergi de te spală în scăldătoarea Siloamului, (ce se tâlcuește, Trimes). Deci s’a dus, și s’a spălat, și a venit văzând.” Luca pomenește „acei optsprezece, preste cari a căzut turnul în Siloam”. Apa ajunsese acolo cu mult înainte: Ezechia a adus apă în cetate, „fântâna și drumul apei, prin care a băgat apă în cetate”, înainte de invazia asiriană din 701 î.Hr., iar zidarii lui Neemia au reparat „zidul scăldătoarei Siloam spre grădina împăratului”."
    - "Frederick Bliss și Archibald Dickie au dezgropat biserica bizantină și scăldătoarea de la ieșirea tunelului în 1894–1897. În 2004, lucrări de reparație la o conductă i-au dus pe Ronny Reich și Eli Shukron la scăldătoarea mai veche: un mare rezervor cu trepte, lung de vreo 70 m, tencuit în epoca hasmoneeană și folosit până la războiul împotriva Romei, din care o stradă cu trepte urcă spre Muntele Templului. Cei mai mulți cercetători o socot acum scăldătoarea din Ioan 9; o parte din ea se află încă sub o livadă, iar săparea ei completă a fost anunțată la sfârșitul lui 2022."
  bg:
    - "В южния край на Давидовия град, най-старата част на Йерусалим, под стените на Стария град близо до село Силуан, което пази името; точката на картата стои там. Тя се намираше там, където водата на извора Гион, на около 300 м по права линия, излиза, след като е преминала през тунела на Езекия, и на около 1,2 км южно от къпалнята Витезда. Днес се показват две къпални: малката византийска при изхода на тунела, дълго смятана за къпалнята от Евангелието, и по-голяма, със стъпала, от времето на Исус, намерена малко на югоизток през 2004 г."
    - "Йоан разказва как Исус помаза с кал очите на един сляп по рождение и каза: „Иди, омий се в къпалнята Силоам (което се тълкува Проводен). И тъй отиде, оми се, и дойде прогледнал.“ Лука споменава „осемнадесетте онези върх които падна стълпът Силоамски“. Водата беше дошла там много по-рано: Езекия „направи водоема и водовода та доведе водата в града“ преди асирийското нашествие от 701 г. пр.н.е., а строителите на Неемия поправиха „стената на Силоамския водоем при царската градина“."
    - "Фредерик Блис и Арчибалд Дики разкриха византийската църква и къпалнята при изхода на тунела през 1894–1897 г. През 2004 г. ремонт на тръба доведе Рони Райх и Ели Шукрон до по-старата къпалня: голям резервоар със стъпала, дълъг около 70 м, измазан в хасмонейския период и използван до войната срещу Рим, от който улица със стъпала се изкачва към Храмовия хълм. Повечето учени днес я смятат за къпалнята от Йоан 9; част от нея все още лежи под една овощна градина, а пълното ѝ разкопаване беше обявено в края на 2022 г."
