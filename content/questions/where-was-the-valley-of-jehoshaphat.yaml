id: where-was-the-valley-of-jehoshaphat
question:
  en: "Where was the Valley of Jehoshaphat?"
  ru: "Где находилась долина Иосафата?"
  uk: "Де була долина Йосафата?"
  es: "¿Dónde estaba el valle de Josafat?"
  pt: "Onde ficava o vale de Josafá?"
  de: "Wo lag das Tal Josaphat?"
  fr: "Où se trouvait la vallée de Josaphat ?"
  pl: "Gdzie leżała Dolina Jozafata?"
  it: "Dov’era la Valle di Giosafat?"
  cs: "Kde leželo Jozafatovo údolí?"
  nl: "Waar lag het Dal van Josafat?"
  sv: "Var låg Josafats dal?"
  nb: "Hvor lå Josjafats dal?"
  tl: "Nasaan ang Libis ng Josaphat?"
  da: "Hvor lå Josafats Dal?"
answer:
  en:
    - "No one knows for certain: the valley of Jehoshaphat is named only by the prophet Joel, and most commentators take it as a symbolic name, “the valley where the Lord judges”, rather than a place on the ground. Since at least the fourth century AD tradition has put it in the Kidron valley, the deep valley between the Temple Mount and the Mount of Olives on the east side of Jerusalem, and the map follows that tradition: its point stands in the Kidron, about 0.7 km north-east of the map's point for Jerusalem and 0.6 km from the Mount of Olives in a straight line. History Globe has an article on the valley; this answer keeps to where it was sought."
    - "Joel uses the name twice: “I will also gather all nations, and will bring them down into the valley of Jehoshaphat, and will plead with them there for my people”, and “Let the heathen be wakened, and come up to the valley of Jehoshaphat: for there will I sit to judge all the heathen round about.” Two verses later the same place is “the valley of decision”. The name means “the Lord judges”, which suits the oracle whatever valley Joel meant. Some link it with the valley of Berachah, where King Jehoshaphat and his people blessed the Lord after the enemy armies destroyed one another, south of Jerusalem near Tekoa; others with the great valley Zechariah sees opening when the Mount of Olives is split “toward the east and toward the west”."
    - "Eusebius' Onomasticon and the pilgrim from Bordeaux, in AD 333, already place the valley of Jehoshaphat at the Kidron. Jews, Christians and Muslims came to expect the Last Judgment there, which is why the slopes hold the great Jewish cemetery of the Mount of Olives and Muslim graves under the eastern wall of the Old City. At the valley floor stand rock-cut tombs of the Second Temple period, named by later tradition the Tomb of Absalom, the Tomb of Zechariah and the Tomb of Jehoshaphat. The Kidron is the valley the map shows; whether Joel had it in mind cannot be known."
  ru:
    - "Точно никто не знает: долину Иосафата называет только пророк Иоиль, и большинство толкователей считает это имя символическим — «долина, где судит Господь», — а не местом на земле. По меньшей мере с IV века н. э. предание помещает её в долину Кедрона — глубокую долину между Храмовой горой и Елеонской горой на восточной стороне Иерусалима, и карта следует этому преданию: её точка стоит в Кедроне, примерно в 0,7 км к северо-востоку от точки Иерусалима и в 0,6 км от Елеонской горы по прямой. В History Globe есть статья об этой долине; здесь ответ о том, где её искали."
    - "Иоиль называет её дважды: «Я соберу все народы, и приведу их в долину Иосафата, и там произведу над ними суд за народ Мой» и «Пусть воспрянут народы и низойдут в долину Иосафата; ибо там Я воссяду, чтобы судить все народы отовсюду». Двумя стихами ниже то же место — «долина суда». Имя значит «Господь судит», и это подходит к пророчеству, какую бы долину ни имел в виду Иоиль. Одни связывают её с долиной благословения, где царь Иосафат и его народ благословили Господа, когда вражеские войска истребили друг друга, к югу от Иерусалима близ Фекои; другие — с великой долиной, которая, по видению Захарии, откроется, когда гора Елеонская «раздвоится… от востока к западу»."
    - "Ономастикон Евсевия и паломник из Бордо в 333 году уже помещают долину Иосафата у Кедрона. Иудеи, христиане и мусульмане стали ждать там Страшного суда, поэтому на склонах лежат большое иудейское кладбище Елеонской горы и мусульманские могилы под восточной стеной Старого города. На дне долины стоят высеченные в скале гробницы времени Второго Храма, которые позднее предание назвало гробницей Авессалома, гробницей Захарии и гробницей Иосафата. Карта показывает Кедрон; имел ли его в виду Иоиль, узнать нельзя."
  uk:
    - "Ніхто не знає напевно: долину Йосафата називає лише пророк Йоїл, і більшість коментаторів розуміють це як символічну назву, «долина, де Господь судить», а не місце на землі. Принаймні від IV ст. н. е. переказ поміщає її в долині Кедрону, глибокій долині між Храмовою горою та Оливковою горою на східному боці Єрусалима, і мапа слідує цьому переказові: її точка стоїть у Кедроні, приблизно за 0,7 км на північний схід від точки Єрусалима на мапі і за 0,6 км від Оливкової гори по прямій. В «Історичному глобусі» є стаття про долину; ця відповідь стосується лише того, де її шукали."
    - "Йоїл уживає назву двічі: «Позбіраю всї народи на Йосафатовій долинї, і заведу там над ними суд за мій люд» і «Рушайте, народи, зійдїть на Йосафатову долину; бо там я засяду, судити всї народи звідʼусюди!» Двома віршами далі те саме місце — «долина відплатна». Назва означає «Господь судить», що пасує оракулові, яку б долину не мав на увазі Йоїл. Дехто пов'язує її з долиною Берахи, де цар Йосафат і його народ благословили Господа, коли ворожі війська знищили одне одного, на південь від Єрусалима біля Текої; інші — з великою долиною, яку бачить Захарія, коли Оливкова гора розпадеться «на схід сонця й на захід»."
    - "Ономастикон Євсевія і бордоський паломник 333 р. н. е. уже поміщають долину Йосафата в Кедроні. Юдеї, християни й мусульмани стали чекати Страшного суду там, тому на її схилах лежать великий юдейський цвинтар Оливкової гори та мусульманські могили під східним муром Старого міста. На дні долини стоять вирубані в скелі гробниці доби Другого Храму, названі пізнішим переказом гробницею Авесалома, гробницею Захарії та гробницею Йосафата. Кедрон — це долина, яку показує мапа; чи мав його на увазі Йоїл, знати не можна."
  es:
    - "Nadie lo sabe con certeza: el valle de Josafat lo nombra solo el profeta Joel, y la mayoría de los comentaristas lo toman como un nombre simbólico, «el valle donde el Señor juzga», más que como un lugar sobre el terreno. Desde al menos el siglo IV d. C. la tradición lo ha puesto en el valle del Cedrón, el profundo valle entre el Monte del Templo y el monte de los Olivos, en el lado este de Jerusalén, y el mapa sigue esa tradición: su punto está en el Cedrón, a unos 0,7 km al noreste del punto del mapa para Jerusalén y a 0,6 km del monte de los Olivos en línea recta. History Globe tiene un artículo sobre el valle; esta respuesta se ciñe a dónde se lo buscó."
    - "Joel usa el nombre dos veces: «Juntaré todas las gentes, y harélas descender al valle de Josaphat, y allí entraré en juicio con ellos á causa de mi pueblo», y «Las gentes se despierten, y suban al valle de Josaphat: porque allí me sentaré para juzgar todas las gentes de alrededor». Dos versículos después, el mismo lugar es «el valle de la decisión». El nombre significa «el Señor juzga», lo que conviene al oráculo sea cual sea el valle que Joel tuviera en mente. Algunos lo vinculan con el valle de Beracá, donde el rey Josafat y su pueblo bendijeron al Señor después de que los ejércitos enemigos se destruyeran entre sí, al sur de Jerusalén, cerca de Tecoa; otros, con el gran valle que Zacarías ve abrirse cuando el monte de los Olivos se parte «hacia el oriente y hacia el occidente»."
    - "El Onomasticon de Eusebio y el peregrino de Burdeos, en el 333 d. C., ya sitúan el valle de Josafat en el Cedrón. Judíos, cristianos y musulmanes llegaron a esperar allí el Juicio Final, por lo que las laderas albergan el gran cementerio judío del monte de los Olivos y tumbas musulmanas bajo el muro oriental de la Ciudad Vieja. En el fondo del valle hay tumbas excavadas en la roca de la época del Segundo Templo, llamadas por la tradición posterior la Tumba de Absalón, la Tumba de Zacarías y la Tumba de Josafat. El Cedrón es el valle que muestra el mapa; si Joel lo tenía en mente no puede saberse."
  pt:
    - "Ninguém sabe ao certo: o vale de Josafá é nomeado apenas pelo profeta Joel, e a maioria dos comentaristas o toma como um nome simbólico, “o vale onde o Senhor julga”, e não um lugar no terreno. Desde pelo menos o século IV d.C., a tradição o põe no vale do Cedrom, o vale profundo entre o monte do Templo e o monte das Oliveiras, no lado leste de Jerusalém, e o mapa segue essa tradição: seu ponto fica no Cedrom, a cerca de 0,7 km a nordeste do ponto de Jerusalém no mapa e a 0,6 km do monte das Oliveiras em linha reta. O History Globe tem um artigo sobre o vale; esta resposta trata apenas de onde foi procurado."
    - "Joel usa o nome duas vezes: “reunirei todas as nações, e as farei descer ao vale de Josafá; e ali executarei juízo sobre elas por causa do meu povo”, e “Que as nações se despertem, e subam ao vale de Josafá; pois ali me assentarei para julgar todas as nações ao redor.” Dois versículos depois, o mesmo lugar é “o vale da decisão”. O nome significa “o Senhor julga”, o que convém ao oráculo, qualquer que seja o vale que Joel tinha em mente. Alguns o ligam ao vale de Beraca, onde o rei Josafá e seu povo bendisseram o Senhor depois que os exércitos inimigos se destruíram mutuamente, ao sul de Jerusalém, perto de Tecoa; outros, ao grande vale que Zacarias vê abrir-se quando o monte das Oliveiras é fendido “do leste para o oeste”."
    - "O Onomástico de Eusébio e o peregrino de Bordeaux, em 333 d.C., já situam o vale de Josafá no Cedrom. Judeus, cristãos e muçulmanos passaram a esperar ali o Juízo Final, razão pela qual as encostas abrigam o grande cemitério judaico do monte das Oliveiras e túmulos muçulmanos sob a muralha oriental da Cidade Velha. No fundo do vale há túmulos escavados na rocha do período do Segundo Templo, chamados pela tradição posterior Túmulo de Absalão, Túmulo de Zacarias e Túmulo de Josafá. O Cedrom é o vale que o mapa mostra; se Joel o tinha em mente não se pode saber."
  de:
    - "Niemand weiß es sicher: Das Tal Josaphat wird nur vom Propheten Joel genannt, und die meisten Ausleger verstehen es als symbolischen Namen, „das Tal, wo der Herr richtet“, nicht als Ort auf der Erde. Seit mindestens dem 4. Jahrhundert n. Chr. setzt die Überlieferung es in das Kidrontal, das tiefe Tal zwischen Tempelberg und Ölberg an der Ostseite Jerusalems, und die Karte folgt dieser Überlieferung: Ihr Punkt steht im Kidron, in der Luftlinie etwa 0,7 km nordöstlich des Kartenpunkts für Jerusalem und 0,6 km vom Ölberg. History Globe hat einen Artikel über das Tal; diese Antwort beschränkt sich darauf, wo es gesucht wurde."
    - "Joel gebraucht den Namen zweimal: „will ich alle Heiden zusammenbringen und will sie in das Tal Josaphat hinabführen und will mit ihnen daselbst rechten wegen meines Volks“, und: „Die Heiden werden sich aufmachen und heraufkommen zum Tal Josaphat; denn daselbst will ich sitzen, zu richten alle Heiden um und um.“ Zwei Verse später ist von demselben Ort als „Tal des Urteils“ die Rede. Der Name bedeutet „der Herr richtet“, was zum Orakel passt, welches Tal Joel auch meinte. Manche verbinden es mit dem Tal Beracha südlich von Jerusalem bei Tekoa, wo König Josaphat und sein Volk den Herrn lobten, nachdem sich die feindlichen Heere gegenseitig vernichtet hatten; andere mit dem großen Tal, das Sacharja sich öffnen sieht, wenn der Ölberg gespalten wird „vom Aufgang bis zum Niedergang“."
    - "Das Onomastikon des Eusebius und der Pilger von Bordeaux im Jahr 333 n. Chr. setzen das Tal Josaphat bereits an den Kidron. Juden, Christen und Muslime erwarteten dort das Jüngste Gericht, weshalb die Hänge den großen jüdischen Friedhof des Ölbergs und muslimische Gräber unter der Ostmauer der Altstadt tragen. Auf dem Talgrund stehen Felsgräber aus der Zeit des Zweiten Tempels, von der späteren Überlieferung Grab Absaloms, Grab des Sacharja und Grab Josaphats genannt. Der Kidron ist das Tal, das die Karte zeigt; ob Joel ihn im Sinn hatte, kann nicht gewusst werden."
  fr:
    - "Personne ne le sait avec certitude : la vallée de Josaphat n’est nommée que par le prophète Joël, et la plupart des commentateurs y voient un nom symbolique, « la vallée où le Seigneur juge », plutôt qu’un lieu sur le terrain. Depuis le IVe siècle apr. J.-C. au moins, la tradition la place dans la vallée du Cédron, la profonde vallée entre le mont du Temple et le mont des Oliviers, à l’est de Jérusalem, et la carte suit cette tradition : son point se trouve dans le Cédron, à environ 0,7 km au nord-est du point de la carte pour Jérusalem et à 0,6 km du mont des Oliviers à vol d’oiseau. History Globe consacre un article à la vallée ; cette réponse se limite à l’endroit où on l’a cherchée."
    - "Joël emploie le nom deux fois : « Je rassemblerai toutes les nations, et je les ferai descendre dans la vallée de Josaphat ; là, j’entrerai en jugement avec elles, au sujet de mon peuple », et « Que les nations se réveillent, et qu’elles montent vers la vallée de Josaphat ! Car là je siégerai pour juger toutes les nations d’alentour. » Deux versets plus loin, le même lieu est « la vallée du jugement ». Le nom signifie « l’Éternel juge », ce qui convient à l’oracle quelle que soit la vallée que Joël avait en vue. Certains la rapprochent de la vallée de Beraca, où le roi Josaphat et son peuple bénirent l’Éternel après que les armées ennemies se furent détruites l’une l’autre, au sud de Jérusalem, près de Tekoa ; d’autres, de la grande vallée que Zacharie voit s’ouvrir quand le mont des Oliviers se fend « à l’orient et à l’occident »."
    - "L’Onomasticon d’Eusèbe et le pèlerin de Bordeaux, en 333 apr. J.-C., placent déjà la vallée de Josaphat au Cédron. Juifs, chrétiens et musulmans en vinrent à y attendre le Jugement dernier, ce qui explique que les pentes portent le grand cimetière juif du mont des Oliviers et des tombes musulmanes sous le mur oriental de la vieille ville. Au fond de la vallée se dressent des tombeaux creusés dans le roc, de l’époque du Second Temple, que la tradition ultérieure a nommés tombeau d’Absalom, tombeau de Zacharie et tombeau de Josaphat. Le Cédron est la vallée que montre la carte ; que Joël l’ait eue en tête, on ne peut le savoir."
  pl:
    - "Nikt nie wie na pewno: dolinę Jozafata wymienia tylko prorok Joel, a większość komentatorów traktuje ją jako nazwę symboliczną, „dolinę, w której Pan sądzi”, a nie miejsce na ziemi. Co najmniej od IV wieku n.e. tradycja umieszcza ją w dolinie Cedronu, głębokiej dolinie między Wzgórzem Świątynnym a Górą Oliwną po wschodniej stronie Jerozolimy, i mapa idzie za tą tradycją: jej punkt stoi w Cedronie, około 0,7 km na północny wschód od punktu Jerozolimy na mapie i 0,6 km od Góry Oliwnej w linii prostej. History Globe ma artykuł o dolinie; ta odpowiedź ogranicza się do tego, gdzie jej szukano."
    - "Joel używa tej nazwy dwukrotnie: „Zgromadzę też wszystkie narody, i sprowadzę je na dolinę Jozafat, i będę się tam z nimi sądził o lud swój”, oraz: „Niech się ocucą i przyciągną te narody na dolinę Jozafat; bo tam siedzieć będę, abym sądził wszystkie narody okoliczne”. Dwa wersety dalej to samo miejsce nazwane jest „doliną posieczenia”. Nazwa oznacza „Pan sądzi”, co pasuje do wyroczni, jakąkolwiek dolinę miał na myśli Joel. Niektórzy wiążą ją z doliną Beracha, gdzie król Jozafat i jego lud błogosławili Pana po tym, jak wrogie armie nawzajem się wyniszczyły, na południe od Jerozolimy koło Tekoa; inni z wielką doliną, którą Zachariasz widzi otwierającą się, gdy Góra Oliwna rozszczepi się „na wschód i na zachód słońca”."
    - "Onomastikon Euzebiusza i pielgrzym z Bordeaux w 333 n.e. już umieszczają dolinę Jozafata w Cedronie. Żydzi, chrześcijanie i muzułmanie spodziewali się tam Sądu Ostatecznego, dlatego na stokach leży wielki żydowski cmentarz na Górze Oliwnej i muzułmańskie groby pod wschodnim murem Starego Miasta. Na dnie doliny stoją wykute w skale groby z okresu Drugiej Świątyni, nazwane przez późniejszą tradycję Grobem Absaloma, Grobem Zachariasza i Grobem Jozafata. Cedron jest doliną, którą pokazuje mapa; czy Joel miał ją na myśli, nie można wiedzieć."
  it:
    - "Nessuno lo sa con certezza: la valle di Giosafat è nominata solo dal profeta Gioele, e la maggior parte dei commentatori la intende come un nome simbolico, «la valle dove il Signore giudica», più che un luogo sul terreno. Almeno dal IV secolo d.C. la tradizione la pone nella valle del Cedron, la profonda valle tra il Monte del Tempio e il Monte degli Ulivi sul lato orientale di Gerusalemme, e la mappa segue quella tradizione: il suo punto si trova nel Cedron, a circa 0,7 km a nord-est del punto della mappa per Gerusalemme e a 0,6 km dal Monte degli Ulivi in linea d’aria. History Globe ha un articolo sulla valle; questa risposta si limita a dove fu cercata."
    - "Gioele usa il nome due volte: «io radunerò tutte le nazioni, e le farò scendere nella valle di Giosafat; e verrò quivi in giudizio con esse, a proposito del mio popolo», e «Si muovano e salgan le nazioni alla valle di Giosafat! Poiché là io mi assiderò a giudicar le nazioni d’ogn’intorno». Due versetti dopo lo stesso luogo è «la valle del Giudizio». Il nome significa «il Signore giudica», il che si adatta all’oracolo qualunque valle Gioele intendesse. Alcuni lo collegano con la valle di Beracà, dove il re Giosafat e il suo popolo benedissero il Signore dopo che gli eserciti nemici si furono distrutti a vicenda, a sud di Gerusalemme presso Tekoa; altri con la grande valle che Zaccaria vede aprirsi quando il Monte degli Ulivi si spacca «da levante a ponente»."
    - "L’Onomasticon di Eusebio e il pellegrino di Bordeaux, nel 333 d.C., pongono già la valle di Giosafat nel Cedron. Ebrei, cristiani e musulmani vennero ad attendervi il Giudizio finale, ed è per questo che i pendii custodiscono il grande cimitero ebraico del Monte degli Ulivi e tombe musulmane sotto il muro orientale della Città Vecchia. Sul fondo della valle sorgono tombe scavate nella roccia del periodo del Secondo Tempio, chiamate dalla tradizione successiva Tomba di Assalonne, Tomba di Zaccaria e Tomba di Giosafat. Il Cedron è la valle che la mappa mostra; se Gioele l’avesse in mente non si può sapere."
  cs:
    - "Nikdo neví jistě: Jozafatovo údolí jmenuje jen prorok Joel a většina komentátorů je bere jako symbolické jméno, „údolí, kde soudí Hospodin“, spíše než místo na zemi. Nejméně od 4. století n. l. je tradice klade do údolí Kidronu, hlubokého údolí mezi Chrámovou horou a Olivovou horou na východní straně Jeruzaléma, a mapa tuto tradici sleduje: její bod stojí v Kidronu, asi 0,7 km severovýchodně od bodu Jeruzaléma a 0,6 km od Olivové hory vzdušnou čarou. History Globe má o údolí článek; tato odpověď se drží jen toho, kde se hledalo."
    - "Joel užívá jména dvakrát: „Shromáždím také všecky národy, a svedu je do údolí Jozafat, abych se tam soudil s nimi o lid svůj“ a „Probudíť se a přitáhnou národové ti do údolé Jozafat; nebo tam se posadím, abych soudil všecky ty národy okolní.“ O dva verše dál je totéž místo „údolí posekání“. Jméno znamená „Hospodin soudí“, což věštbě sluší, ať Joel mínil které údolí. Někteří je spojují s údolím Beracha, kde král Jozafat a jeho lid dobrořečili Hospodinu poté, co nepřátelská vojska zničila jedno druhé, jižně od Jeruzaléma poblíž Tekoi; jiní s velkým údolím, které Zacharjáš vidí otevírat se, když se Olivová hora rozdvojí „k východu a k západu“."
    - "Eusebiův Onomasticon a poutník z Bordeaux roku 333 n. l. už kladou Jozafatovo údolí na Kidron. Židé, křesťané i muslimové tam očekávali Poslední soud, a proto svahy nesou velký židovský hřbitov na Olivové hoře a muslimské hroby pod východní hradbou Starého města. Na dně údolí stojí skalní hrobky z doby druhého chrámu, pozdější tradicí nazvané Hrob Abšalomův, Hrob Zacharjášův a Hrob Jozafatův. Kidron je údolí, které mapa ukazuje; zda je Joel měl na mysli, nelze vědět."
  nl:
    - "Niemand weet het zeker: het dal van Josafat wordt alleen door de profeet Joël genoemd, en de meeste uitleggers vatten het op als een symbolische naam, “het dal waar de HEER oordeelt”, eerder dan een plaats op de grond. Sinds ten minste de vierde eeuw n.Chr. plaatst de overlevering het in het Kidrondal, het diepe dal tussen de Tempelberg en de Olijfberg aan de oostkant van Jeruzalem, en de kaart volgt die overlevering: het punt staat in het Kidrondal, ongeveer 0,7 km ten noordoosten van het punt voor Jeruzalem en hemelsbreed 0,6 km van de Olijfberg. History Globe heeft een artikel over het dal; dit antwoord beperkt zich tot waar het werd gezocht."
    - "Joël gebruikt de naam tweemaal: “Dan zal Ik alle heidenen vergaderen, en zal hen afvoeren in het dal van Josafat; en Ik zal met hen aldaar richten, vanwege Mijn volk”, en “De heidenen zullen zich opmaken, en optrekken naar het dal van Josafat; maar aldaar zal Ik zitten, om te richten alle heidenen van rondom.” Twee verzen later heet dezelfde plaats “het dal des dorswagens”. De naam betekent “de HEER oordeelt”, wat bij het orakel past welk dal Joël ook bedoelde. Sommigen verbinden het met het dal van Beracha, waar koning Josafat en zijn volk de HEER loofden nadat de vijandelijke legers elkaar hadden vernietigd, ten zuiden van Jeruzalem bij Tekoa; anderen met het grote dal dat Zacharia ziet opengaan wanneer de Olijfberg wordt gespleten “naar het oosten, en naar het westen”."
    - "Eusebius' Onomasticon en de pelgrim van Bordeaux plaatsen in 333 n.Chr. het dal van Josafat al bij het Kidron. Joden, christenen en moslims gingen er het Laatste Oordeel verwachten, en daarom bevatten de hellingen de grote joodse begraafplaats van de Olijfberg en moslimgraven onder de oostmuur van de Oude Stad. Op de dalbodem staan in de rots uitgehouwen graven uit de tijd van de Tweede Tempel, door latere overlevering het Graf van Absalom, het Graf van Zacharia en het Graf van Josafat genoemd. Het Kidron is het dal dat de kaart toont; of Joël het voor ogen had, valt niet te weten."
  sv:
    - "Ingen vet med säkerhet: Josafats dal nämns bara av profeten Joel, och de flesta kommentatorer tar det som ett symboliskt namn, ”dalen där Herren dömer”, snarare än en plats på marken. Åtminstone sedan 300-talet e.Kr. har traditionen förlagt den till Kidrondalen, den djupa dalen mellan Tempelberget och Olivberget på Jerusalems östra sida, och kartan följer den traditionen: dess punkt står i Kidron, omkring 0,7 km nordost om kartans punkt för Jerusalem och 0,6 km från Olivberget i fågelvägen. History Globe har en artikel om dalen; det här svaret håller sig till var den söktes."
    - "Joel använder namnet två gånger: ”då skall jag samla tillhopa alla hednafolk och föra dem ned till Josafats dal, och där skall jag hålla dom över dem för mitt folks och min arvedels, Israels, skull”, och ”Ja, må hednafolken resa sig och draga åstad till Josafats dal; ty där skall jag sitta till doms över alla folk häromkring.” Två verser senare är samma plats ”Domens dal”. Namnet betyder ”Herren dömer”, vilket passar profetian vilken dal Joel än avsåg. Vissa förbinder den med Berakadalen, där kung Josafat och hans folk lovade Herren sedan fiendehärarna hade förintat varandra, söder om Jerusalem nära Tekoa; andra med den stora dal som Sakarja ser öppnas när Olivberget rämnar ”mot öster och väster”."
    - "Eusebios’ Onomastikon och pilgrimen från Bordeaux, år 333 e.Kr., förlägger redan Josafats dal till Kidron. Judar, kristna och muslimer kom att vänta den yttersta domen där, vilket är varför sluttningarna rymmer Olivbergets stora judiska begravningsplats och muslimska gravar under Gamla stadens östra mur. På dalbotten står uthuggna gravar från andra tempeltiden, av senare tradition kallade Absaloms grav, Sakarjas grav och Josafats grav. Kidron är dalen som kartan visar; huruvida Joel hade den i tankarna kan inte vetas."
  nb:
    - "Ingen vet det sikkert: Josjafats dal er bare nevnt av profeten Joel, og de fleste kommentatorer tar det som et symbolsk navn, «dalen der Herren dømmer», snarere enn et sted på bakken. Siden minst 300-tallet e.Kr. har tradisjonen lagt den i Kedron-dalen, den dype dalen mellom Tempelplassen og Oljeberget på østsiden av Jerusalem, og kartet følger tradisjonen: punktet står i Kedron, omtrent 0,7 km nordøst for kartets punkt for Jerusalem og 0,6 km fra Oljeberget i luftlinje. History Globe har en artikkel om dalen; dette svaret holder seg til hvor den ble søkt."
    - "Joel bruker navnet to ganger: «da vil jeg samle alle hedningefolk og føre dem ned i Josafats dal, og jeg vil der gå i rette med dem for mitt folks og min arvs, Israels, skyld», og «Hedningefolkene skal våkne op og dra til Josafats dal; for der vil jeg sitte og dømme alle hedningefolk fra alle kanter.» To vers senere kalles det samme stedet «avgjørelsens dal». Navnet betyr «Herren dømmer», noe som passer for profetordet uansett hvilken dal Joel mente. Noen knytter den til Lovprisningsdalen, der kong Josjafat og hans folk lovet Herren etter at fiendehærene hadde ødelagt hverandre, sør for Jerusalem nær Tekoa; andre til den store dalen Sakarja ser åpne seg når Oljeberget revner «mot øst og vest»."
    - "Eusebius’ Onomasticon og pilegrimen fra Bordeaux, i 333 e.Kr., plasserer allerede Josjafats dal ved Kedron. Jøder, kristne og muslimer kom til å vente den siste dom der, og derfor har skråningene den store jødiske gravplassen på Oljeberget og muslimske graver under gamlebyens østmur. På dalbunnen står fjellhuggede graver fra det andre tempelets tid, av senere tradisjon kalt Absaloms grav, Sakarjas grav og Josjafats grav. Kedron er dalen kartet viser; om Joel hadde den i tankene, kan ikke vites."
  tl:
    - "Walang tiyak na nakakaalam: pinangalanan lamang ang libis ni Josaphat ng propetang si Joel, at itinuturing ng karamihan ng mga komentarista na simbolikong pangalan, “ang libis na kung saan humahatol ang Panginoon”, sa halip na isang pook sa lupa. Mula pa man lamang noong ika-4 na siglo AD, inilagay ito ng tradisyon sa lambak ng Cedron, ang malalim na lambak sa pagitan ng Bundok ng Templo at ng Bundok ng mga Olibo sa silangang bahagi ng Jerusalem, at sinusundan ng mapa ang tradisyong iyon: nasa Cedron ang punto nito, mga 0.7 km sa hilagang-silangan ng punto ng mapa para sa Jerusalem at 0.6 km mula sa Bundok ng mga Olibo sa tuwid na guhit. May artikulo ang History Globe tungkol sa libis; ang sagot na ito ay nakatuon sa kung saan ito hinanap."
    - "Dalawang beses ginagamit ni Joel ang pangalan: “Aking pipisanin ang lahat na bansa, at aking ibababa sila sa libis ni Josaphat; at ako'y makikipagtanggol sa kanila roon dahil sa aking bayan”, at “Magpakasigla ang mga bansa, at magsisampa sa libis ni Josaphat; sapagka't doo'y uupo ako upang hatulan ang lahat na bansa sa palibot.” Dalawang talata ang makalipas, ang gayunding lugar ay ang “libis ng pasiya”. Nangangahulugang “humahatol ang Panginoon” ang pangalan, na angkop sa orakulo anuman ang libis na tinutukoy ni Joel. Iniuugnay ito ng ilan sa libis ng Baracah, kung saan pinuri ng Haring Josaphat at ng kaniyang bayan ang Panginoon nang pagwasakin ng mga hukbong kaaway ang isa't isa, sa timog ng Jerusalem malapit sa Tecoa; ng iba sa dakilang libis na nakikita ni Zacharias na bumubukas kapag nahati ang Bundok ng mga Olibo “sa dakong silanganan at sa dakong kalunuran”."
    - "Ang Onomasticon ni Eusebio at ang peregrino mula sa Bordeaux, noong 333 AD, ay inilalagay na ang libis ni Josaphat sa Cedron. Inaasahan ng mga Judio, Kristiyano at Muslim ang Huling Paghuhukom doon, kaya ang mga dalisdis ay may malaking sementeryong Judio ng Bundok ng mga Olibo at mga libingang Muslim sa ilalim ng silangang pader ng Lumang Lungsod. Sa sahig ng libis ay nakatayo ang mga libingang tinabas sa bato ng panahon ng Ikalawang Templo, na pinangalanan ng huling tradisyon na Libingan ni Absalom, Libingan ni Zacharias at Libingan ni Josaphat. Ang Cedron ang libis na ipinapakita ng mapa; hindi malalaman kung ito ang nasa isip ni Joel."
  da:
    - "Ingen ved det med sikkerhed: Josafats dal nævnes kun af profeten Joel, og de fleste kommentatorer tager det som et symbolsk navn, »dalen hvor Herren dømmer«, snarere end et sted på jorden. Siden mindst 300-tallet e.Kr. har traditionen placeret den i Kedron-dalen, den dybe dal mellem Tempelbjerget og Oliebjerget på Jerusalems østside, og kortet følger denne tradition: Dets punkt står i Kedron, ca. 0,7 km nordøst for kortets punkt for Jerusalem og 0,6 km fra Oliebjerget i fugleflugt. History Globe har en artikel om dalen; dette svar holder sig til, hvor den blev søgt."
    - "Joel bruger navnet to gange: »da vil jeg samle alle Hedningerne og føre dem ned til Josafats Dal; og der vil jeg gaa i Rette med dem om mit Folk«, og »Opvækkes skulle Hedningerne og drage op til Josafats Dal; thi der vil jeg sidde, at dømme alle Hedningerne trindt omkring fra.« To vers senere er det samme sted »Dommens Dal«. Navnet betyder »Herren dømmer«, hvilket passer til orakelet, uanset hvilken dal Joel mente. Nogle knytter den til Lovsangsdalen, hvor kong Josafat og hans folk lovpriste Herren, efter at fjendens hære havde udryddet hinanden, syd for Jerusalem nær Tekoa; andre til den store dal, Zakarias ser åbne sig, når Oliebjerget revner »fra dets Midte af i Øst og Vest«."
    - "Eusebius’ Onomasticon og pilgrimmen fra Bordeaux, i 333 e.Kr., placerer allerede Josafats dal ved Kedron. Jøder, kristne og muslimer kom til at forvente den yderste dom dér, hvilket er grunden til, at skråningerne rummer Oliebjergets store jødiske kirkegård og muslimske grave under den gamle bydels østmur. På dalbunden står klippehuggede grave fra det andet tempels tid, af senere tradition kaldt Absalons grav, Zakarias’ grav og Josafats grav. Kedron er den dal, kortet viser; om Joel havde den i tankerne, kan ikke vides."
