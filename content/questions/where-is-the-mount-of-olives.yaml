id: where-is-the-mount-of-olives
question:
  en: "Where is the Mount of Olives?"
  ru: "Где находится гора Елеонская?"
  uk: "Де Оливкова гора?"
  es: "¿Dónde está el monte de los Olivos?"
  pt: "Onde fica o monte das Oliveiras?"
  de: "Wo liegt der Ölberg?"
  fr: "Où est le mont des Oliviers ?"
  pl: "Gdzie jest Góra Oliwna?"
  it: "Dov’è il Monte degli Ulivi?"
  nl: "Waar ligt de Olijfberg?"
  cs: "Kde je Olivová hora?"
  sv: "Var ligger Olivberget?"
  nb: "Hvor ligger Oljeberget?"
  tl: "Nasaan ang Bundok ng mga Olibo?"
  da: "Hvor ligger Oliebjerget?"
  sr: "Где је Маслинска гора?"
  hu: "Hol van az Olajfák hegye?"
  fi: "Missä Öljymäki on?"
  vi: "Núi Ô-li-ve ở đâu?"
  ro: "Unde se află Muntele Măslinilor?"
  bg: "Къде е Елеонският хълм?"
answer:
  en:
    - "The Mount of Olives is the ridge immediately east of Jerusalem, across the Kidron valley from the Temple Mount: the map point stands on its summit, about 1.1 km east of the Jerusalem point in a straight line, with Gethsemane at its foot some 600 m down the slope. The main summit rises a little over 800 m above sea level, about 80 m higher than the Temple platform, so the whole city lies in view from it; Mount Scopus carries the ridge on to the north, and Bethphage and Bethany lie on the eastern slope towards Jericho. The article on the mount tells its history in full; this page answers the question of place."
    - "Acts measures it: the disciples came back “unto Jerusalem from the mount called Olivet, which is from Jerusalem a sabbath day's journey”, the two thousand cubits, about a kilometre, allowed on the sabbath; Josephus reckons it five or six stadia from the city. Zechariah fixes its side: “the mount of Olives, which is before Jerusalem on the east”. Ezekiel saw the glory of the LORD leave the city and stand “upon the mountain which is on the east side of the city”; David fled from Absalom “by the ascent of mount Olivet”; and in his last week Jesus came to Jerusalem over it from Bethphage, sat on it “over against the temple” to speak of the end, spent the nights there, prayed in Gethsemane and, by Luke, was taken up from it near Bethany."
    - "Today the mount lies in East Jerusalem. Its western face is the Jewish cemetery, in use since biblical times, below the village of at-Tur on the top; on the slope stand the Chapel of the Ascension, the Pater Noster church on the site of Constantine's Eleona basilica, the Russian church of Mary Magdalene with its golden domes, Dominus Flevit and the Church of All Nations at Gethsemane, and at the foot the rock-cut Kidron tombs of the Second Temple period. The view of the Old City from the summit is the one most pictures of Jerusalem show."
  ru:
    - "Гора Елеонская — гряда сразу к востоку от Иерусалима, за Кедронской долиной напротив Храмовой горы: точка карты стоит на её вершине, примерно в 1,1 км к востоку от точки Иерусалима по прямой, а у подножия, метрах в 600 ниже по склону, — Гефсимания. Главная вершина поднимается чуть выше 800 м над уровнем моря, примерно на 80 м выше храмовой площадки, так что с неё виден весь город; к северу гряду продолжает гора Скопус, а на восточном склоне, в сторону Иерихона, лежат Виффагия и Вифания. Статья о горе рассказывает её историю целиком; эта страница отвечает на вопрос о месте."
    - "Деяния дают меру: ученики «возвратились в Иерусалим с горы, называемой Елеон, которая находится близ Иерусалима, в расстоянии субботнего пути» — две тысячи локтей, около километра, разрешённые в субботу; Иосиф Флавий считает от города пять или шесть стадий. Захария называет сторону: «на горе Елеонской, которая перед лицем Иерусалима к востоку». Иезекииль видел, как слава Господня покинула город и «остановилась над горою, которая на восток от города»; Давид бежал от Авессалома, когда «пошел на гору Елеонскую»; а в последнюю неделю Иисус пришёл через неё в Иерусалим из Виффагии, сидел на ней «против храма», говоря о конце, проводил там ночи, молился в Гефсимании и, по Луке, вознёсся с неё близ Вифании."
    - "Сегодня гора лежит в Восточном Иерусалиме. Её западный склон — еврейское кладбище, где хоронят с библейских времён, ниже селения Эт-Тур на вершине; на склоне стоят часовня Вознесения, церковь Pater Noster на месте Константиновой базилики Элеона, русская церковь Марии Магдалины с золотыми куполами, Dominus Flevit и церковь Всех Наций в Гефсимании, а у подножия — высеченные в скале гробницы Кедрона времён Второго храма. Вид на Старый город с вершины — тот самый, что показывает большинство фотографий Иерусалима."
  uk:
    - "Оливкова гора — це хребет безпосередньо на схід від Єрусалиму, через долину Кедрон від Храмової гори: точка мапи стоїть на її вершині, приблизно за 1,1 км на схід від точки Єрусалиму по прямій, а Гетсиманія — біля її підніжжя, приблизно за 600 м униз по схилу. Головна вершина здіймається трохи понад 800 м над рівнем моря, приблизно на 80 м вище за платформу Храму, тож звідти видно все місто; гора Скопус продовжує хребет на північ, а Віфагія й Віфанія лежать на східному схилі в напрямку Єрихону. Стаття про гору розповідає її історію повністю; ця сторінка відповідає на питання про місце."
    - "Дії вимірюють її: учні повернулися «в Єрусалим із гори, званої Оливною, що поблизу Єрусалиму на субітнїй день ходи», тобто дві тисячі ліктів, близько кілометра, дозволені в суботу; Йосиф Флавій обчислює п'ять-шість стадій від міста. Захарія визначає її бік: «на горі Оливній, що навпроти Ерусалиму до сходу сонця». Єзекіїль бачив, як слава Господня залишила місто й стала «над горою, що на востоцї од городу»; Давид утікав від Авесалома, «ійшов на Оливну Гору»; а в останній тиждень Ісус прийшов до Єрусалиму через неї з Віфагії, сидів на ній «навпроти церкви», щоб говорити про кінець, проводив там ночі, молився в Гетсиманії і, за Лукою, був узятий із неї поблизу Віфанії."
    - "Нині гора лежить у Східному Єрусалимі. Її західний бік — це єврейське кладовище, що вживається з біблійних часів, під селом ет-Тур на вершині; на схилі стоять каплиця Вознесіння, церква Патер Ностер на місці базиліки Елеона Константина, російська церква Марії Магдалини із золотими банями, Домінус Флевіт і Церква Всіх Націй у Гетсиманії, а біля підніжжя — висічені в скелі кедронські гробниці доби Другого Храму. Вид на Старе місто з вершини — той, який показує більшість картин Єрусалиму."
  es:
    - "El monte de los Olivos es la cresta situada inmediatamente al este de Jerusalén, al otro lado del valle del Cedrón respecto al monte del Templo: el punto del mapa está en su cima, a unos 1,1 km al este del punto de Jerusalén en línea recta, con Getsemaní al pie, unos 600 m ladera abajo. La cima principal se alza algo más de 800 m sobre el nivel del mar, unos 80 m más que la plataforma del Templo, de modo que desde ella se ve toda la ciudad; el monte Escopus prolonga la cresta hacia el norte, y Betfagé y Betania quedan en la ladera oriental hacia Jericó. El artículo sobre el monte cuenta su historia completa; esta ficha responde a la cuestión del lugar."
    - "Hechos lo mide: los discípulos volvieron «á Jerusalem del monte que se llama del Olivar, el cual está cerca de Jerusalem camino de un sábado», los dos mil codos, cerca de un kilómetro, permitidos en sábado; Josefo lo calcula a cinco o seis estadios de la ciudad. Zacarías fija su lado: «el monte de las Olivas, que está en frente de Jerusalem á la parte de oriente». Ezequiel vio la gloria del Señor salir de la ciudad y detenerse «sobre el monte que está al oriente de la ciudad»; David huyó de Absalón por «la cuesta de las olivas»; y en su última semana Jesús llegó a Jerusalén por él desde Betfagé, se sentó en él «delante del templo» para hablar del fin, pasó allí las noches, oró en Getsemaní y, según Lucas, fue elevado desde él cerca de Betania."
    - "Hoy el monte queda en Jerusalén Este. Su ladera occidental es el cementerio judío, en uso desde tiempos bíblicos, bajo la aldea de at-Tur, en la cima; en la ladera se alzan la Capilla de la Ascensión, la iglesia del Pater Noster en el lugar de la basílica de Eleona de Constantino, la iglesia rusa de María Magdalena con sus cúpulas doradas, Dominus Flevit y la Basílica de Todas las Naciones en Getsemaní, y al pie las tumbas excavadas en la roca del Cedrón, del período del Segundo Templo. La vista de la Ciudad Vieja desde la cima es la que muestran la mayoría de las imágenes de Jerusalén."
  pt:
    - "O monte das Oliveiras é a crista imediatamente a leste de Jerusalém, do outro lado do vale do Cedrom em relação ao monte do Templo: o ponto do mapa está em seu cume, a cerca de 1,1 km a leste do ponto de Jerusalém em linha reta, com o Getsêmani ao pé, uns 600 m encosta abaixo. O cume principal se eleva um pouco mais de 800 m acima do nível do mar, uns 80 m acima da plataforma do Templo, de modo que toda a cidade se vê dele; o monte Scopus prolonga a crista ao norte, e Betfagé e Betânia ficam na encosta oriental, rumo a Jericó. O artigo sobre o monte conta sua história por inteiro; esta página responde à questão do lugar."
    - "Atos o mede: os discípulos voltaram “para Jerusalém, do monte chamado das Oliveiras, que fica perto de Jerusalém, à distância de uma jornada de sábado”, os dois mil côvados, cerca de um quilômetro, permitidos no sábado; Josefo o calcula a cinco ou seis estádios da cidade. Zacarias fixa seu lado: “o monte das Oliveiras, que está em frente a Jerusalém, a leste”. Ezequiel viu a glória do SENHOR deixar a cidade e parar “sobre o monte que está ao lado leste da cidade”; Davi fugiu de Absalão “pela encosta do Monte das Oliveiras”; e em sua última semana Jesus veio a Jerusalém por ele desde Betfagé, sentou-se nele “de frente para o templo” para falar do fim, passou ali as noites, orou no Getsêmani e, segundo Lucas, foi elevado dele perto de Betânia."
    - "Hoje o monte fica em Jerusalém Oriental. Sua face ocidental é o cemitério judaico, em uso desde os tempos bíblicos, abaixo da aldeia de at-Tur, no alto; na encosta estão a Capela da Ascensão, a igreja do Pater Noster no local da basílica de Eleona de Constantino, a igreja russa de Maria Madalena com suas cúpulas douradas, o Dominus Flevit e a Igreja de Todas as Nações no Getsêmani, e ao pé os túmulos talhados na rocha do Cedrom, do período do Segundo Templo. A vista da Cidade Velha do cume é a que a maioria das imagens de Jerusalém mostra."
  de:
    - "Der Ölberg ist der Höhenzug unmittelbar östlich von Jerusalem, jenseits des Kidrontals vom Tempelberg: Der Kartenpunkt liegt auf seinem Gipfel, in der Luftlinie etwa 1,1 km östlich des Jerusalem-Punkts, mit Gethsemane an seinem Fuß, gut 600 m den Hang hinab. Der Hauptgipfel steigt knapp über 800 m über den Meeresspiegel, etwa 80 m höher als die Tempelplattform, sodass die ganze Stadt von dort zu überblicken ist; der Skopusberg setzt den Rücken nach Norden fort, und Betphage und Bethanien liegen am Osthang Richtung Jericho. Der Artikel über den Berg erzählt seine Geschichte ausführlich; diese Seite beantwortet die Frage nach dem Ort."
    - "Die Apostelgeschichte misst ihn: Die Jünger wandten um gen Jerusalem „von dem Berge, der da heißt Ölberg, welcher ist nahe bei Jerusalem und liegt einen Sabbatweg davon“, die zweitausend Ellen, etwa einen Kilometer, die am Sabbat erlaubt waren; Josephus rechnet fünf oder sechs Stadien von der Stadt. Sacharja bestimmt seine Seite: „auf dem Ölberge, der vor Jerusalem liegt gegen Morgen“. Hesekiel sah die Herrlichkeit des Herrn die Stadt verlassen und sich stellen „auf den Berg, der gegen Morgen vor der Stadt liegt“; David floh vor Absalom: „David aber ging den Ölberg hinan“; und in seiner letzten Woche kam Jesus von Betphage über ihn nach Jerusalem, saß auf ihm „gegenüber dem Tempel“, um vom Ende zu sprechen, verbrachte dort die Nächte, betete in Gethsemane und wurde nach Lukas nahe Bethanien von dort aufgenommen."
    - "Heute liegt der Berg in Ostjerusalem. Seine Westseite ist der jüdische Friedhof, seit biblischer Zeit in Gebrauch, unterhalb des Dorfes at-Tur auf der Höhe; am Hang stehen die Himmelfahrtskapelle, die Pater-noster-Kirche an der Stelle von Konstantins Eleona-Basilika, die russische Maria-Magdalena-Kirche mit ihren goldenen Kuppeln, Dominus Flevit und die Kirche aller Nationen in Gethsemane, und am Fuß die in den Fels gehauenen Kidrongräber der Zeit des Zweiten Tempels. Der Blick auf die Altstadt vom Gipfel ist der, den die meisten Bilder von Jerusalem zeigen."
  fr:
    - "Le mont des Oliviers est la crête immédiatement à l’est de Jérusalem, de l’autre côté de la vallée du Cédron en face du mont du Temple : le point de la carte est sur son sommet, à environ 1,1 km à l’est du point de Jérusalem en ligne droite, avec Gethsémané à son pied, à quelque 600 m en bas de la pente. Le sommet principal s’élève à un peu plus de 800 m au-dessus du niveau de la mer, environ 80 m plus haut que la plate-forme du Temple, de sorte que toute la ville s’y offre à la vue ; le mont Scopus prolonge la crête vers le nord, et Bethphagé et Béthanie se trouvent sur le versant oriental vers Jéricho. L’article sur la montagne en raconte toute l’histoire ; cette page répond à la question du lieu."
    - "Les Actes la mesurent : les disciples revinrent « à Jérusalem, de la montagne appelée des oliviers, qui est près de Jérusalem, à la distance d’un chemin de sabbat », soit les deux mille coudées, environ un kilomètre, permises le jour du sabbat ; Josèphe la compte à cinq ou six stades de la ville. Zacharie en fixe le côté : « la montagne des oliviers, qui est vis-à-vis de Jérusalem, du côté de l’orient ». Ézéchiel vit la gloire de l’Éternel quitter la ville et se placer « sur la montagne qui est à l’orient de la ville » ; David, fuyant Absalom, « monta la colline des oliviers » ; et pendant sa dernière semaine, Jésus vint à Jérusalem par là depuis Bethphagé, s’y assit « en face du temple » pour parler de la fin, y passa les nuits, pria à Gethsémané et, selon Luc, en fut enlevé près de Béthanie."
    - "Aujourd’hui le mont se trouve à Jérusalem-Est. Sa face occidentale est le cimetière juif, en usage depuis les temps bibliques, sous le village d’at-Tur au sommet ; sur la pente se dressent la chapelle de l’Ascension, l’église du Pater Noster sur le site de la basilique de l’Éléona de Constantin, l’église russe Sainte-Marie-Madeleine aux dômes dorés, le Dominus Flevit et l’église de toutes les Nations à Gethsémané, et au pied les tombeaux du Cédron taillés dans le roc, de l’époque du second Temple. La vue de la Vieille Ville depuis le sommet est celle que montrent la plupart des images de Jérusalem."
  pl:
    - "Góra Oliwna to grzbiet bezpośrednio na wschód od Jerozolimy, po drugiej stronie doliny Cedronu od Wzgórza Świątynnego: punkt na mapie stoi na jej szczycie, około 1,1 km na wschód od punktu Jerozolimy w linii prostej, z Getsemani u jej podnóża, około 600 m w dół stoku. Główny szczyt wznosi się nieco ponad 800 m n.p.m., około 80 m wyżej niż platforma Świątyni, więc całe miasto leży z niego w polu widzenia; Góra Skopus prowadzi grzbiet dalej na północ, a Betfage i Betania leżą na stoku wschodnim ku Jerychu. Artykuł o górze opowiada jej historię w całości; ta strona odpowiada na pytanie o miejsce."
    - "Dzieje ją mierzą: uczniowie wrócili „do Jeruzalemu od góry, którą zowią oliwną, która jest blisko Jeruzalemu, mając drogi przez jeden sabat”, dwa tysiące łokci, około kilometra, dozwolone w szabat; Józef Flawiusz liczy pięć lub sześć stadiów od miasta. Zachariasz określa jej stronę: „na górze Oliwnej, która jest przeciwko Jeruzalemowi na wschód słońca”. Ezechiel ujrzał chwałę Pana opuszczającą miasto i stającą „na górze, która jest na wschód miasta”; Dawid uciekał przed Absalomem, idąc „na górę oliwną wstępując i płacząc”; a w ostatnim tygodniu Jezus przeszedł przez nią z Betfage do Jerozolimy, siedział na niej naprzeciw Świątyni, „przeciwko kościołowi”, by mówić o końcu, spędzał tam noce, modlił się w Getsemani i według Łukasza został z niej wzięty w górę blisko Betanii."
    - "Dziś góra leży we Wschodniej Jerozolimie. Jej zachodnie zbocze to cmentarz żydowski, używany od czasów biblijnych, poniżej wsi at-Tur na szczycie; na stoku stoją Kaplica Wniebowstąpienia, kościół Pater Noster na miejscu bazyliki Eleona Konstantyna, rosyjski kościół Marii Magdaleny ze złotymi kopułami, Dominus Flevit i Kościół Wszystkich Narodów w Getsemani, a u podnóża wykute w skale groby Cedronu z okresu Drugiej Świątyni. Widok na Stare Miasto ze szczytu to ten, który pokazuje większość obrazów Jerozolimy."
  it:
    - "Il Monte degli Ulivi è il crinale immediatamente a est di Gerusalemme, oltre la valle del Cedron rispetto al Monte del Tempio: il punto della mappa sta sulla sua sommità, a circa 1,1 km a est del punto di Gerusalemme in linea retta, con il Getsemani ai suoi piedi, a circa 600 m di discesa. La vetta principale si leva poco più di 800 m sul livello del mare, circa 80 m più in alto della piattaforma del Tempio, così da essa si vede l’intera città; il Monte Scopus prosegue il crinale a nord, e Betfage e Betania giacciono sul versante orientale verso Gerico. L’articolo sul monte ne narra la storia per intero; questa pagina risponde alla domanda sul luogo."
    - "Gli Atti lo misurano: i discepoli tornarono «a Gerusalemme dal monte chiamato dell’Uliveto, il quale è vicino a Gerusalemme, non distandone che un cammin di sabato», i duemila cubiti, circa un chilometro, consentiti di sabato; Giuseppe Flavio lo calcola a cinque o sei stadi dalla città. Zaccaria ne fissa il lato: «sul monte degli Ulivi ch’è dirimpetto a Gerusalemme a levante». Ezechiele vide la gloria dell’Eterno lasciare la città e fermarsi «sul monte ch’è ad oriente della città»; Davide, fuggendo da Assalonne, «saliva il monte degli Ulivi; saliva piangendo»; e nell’ultima settimana Gesù venne a Gerusalemme oltre di esso da Betfage, vi sedette «dirimpetto al tempio» a parlare della fine, vi passò le notti, pregò al Getsemani e, secondo Luca, fu portato in alto da esso presso Betania."
    - "Oggi il monte si trova a Gerusalemme Est. Il suo versante occidentale è il cimitero ebraico, in uso dai tempi biblici, sotto il villaggio di at-Tur in cima; sul pendio sorgono la Cappella dell’Ascensione, la chiesa del Pater Noster sul sito della basilica dell’Eleona di Costantino, la chiesa russa di Maria Maddalena con le sue cupole dorate, il Dominus Flevit e la Chiesa di Tutte le Nazioni al Getsemani, e ai piedi le tombe scavate nella roccia del Cedron del periodo del Secondo Tempio. La vista della Città Vecchia dalla sommità è quella che mostra la maggior parte delle immagini di Gerusalemme."
  nl:
    - "De Olijfberg is de bergrug direct ten oosten van Jeruzalem, aan de overkant van het Kidrondal vanaf de Tempelberg: het punt op de kaart staat op de top, hemelsbreed ongeveer 1,1 km ten oosten van het punt Jeruzalem, met Getsemane aan de voet, zo’n 600 m lager op de helling. De hoogste top ligt iets meer dan 800 m boven zeeniveau, ongeveer 80 m hoger dan het tempelplatform, zodat de hele stad er in zicht ligt; de Scopusberg zet de bergrug naar het noorden voort, en Bethfage en Bethanië liggen op de oosthelling richting Jericho. Het artikel over de berg vertelt zijn geschiedenis uitvoerig; deze pagina beantwoordt de vraag naar de plaats."
    - "Handelingen meet hem af: de discipelen keerden “wederom naar Jeruzalem, van den berg, die genaamd wordt de Olijf berg, welke is nabij Jeruzalem, liggende van daar een sabbatsreize”, de tweeduizend ellen, ongeveer een kilometer, die op sabbat waren toegestaan; Josephus rekent vijf of zes stadiën vanaf de stad. Zacharia bepaalt zijn zijde: “den Olijfberg, die voor Jeruzalem ligt, tegen het oosten”. Ezechiël zag de heerlijkheid van de HEER de stad verlaten en staan “op den berg, die tegen het oosten der stad is”; David vluchtte voor Absalom “door den opgang der olijven”; en in zijn laatste week kwam Jezus er vanuit Bethfage overheen naar Jeruzalem, zat erop “tegen den tempel over” om over het einde te spreken, bracht er de nachten door, bad in Getsemane en werd volgens Lukas ervandaan opgenomen nabij Bethanië."
    - "Tegenwoordig ligt de berg in Oost-Jeruzalem. Zijn westelijke helling is de Joodse begraafplaats, in gebruik sinds de bijbelse tijd, onder het dorp at-Tur op de top; op de helling staan de Hemelvaartskapel, de Pater-Nosterkerk op de plaats van Constantijns Eleona-basiliek, de Russische kerk van Maria Magdalena met haar gouden koepels, Dominus Flevit en de Kerk van Alle Naties te Getsemane, en aan de voet de in de rots uitgehouwen Kidrongraven uit de tijd van de Tweede Tempel. Het uitzicht op de Oude Stad vanaf de top is dat wat de meeste afbeeldingen van Jeruzalem tonen."
  cs:
    - "Olivová hora je hřeben bezprostředně východně od Jeruzaléma, přes údolí Kidron od Chrámové hory: bod na mapě stojí na jejím vrcholu, asi 1,1 km východně od bodu Jeruzaléma vzdušnou čarou, s Getsemane na jejím úpatí asi 600 m po svahu dolů. Hlavní vrchol se zvedá o málo přes 800 m nad mořem, asi 80 m výše než chrámová terasa, takže z něj je vidět celé město; Skopus nese hřeben dál na sever a Betfage a Betanie leží na východním svahu směrem k Jerichu. Článek o hoře vypráví její dějiny celé; tato stránka odpovídá na otázku místa."
    - "Skutky ji měří: učedníci se vrátili „do Jeruzaléma od hory, jenž slove Olivetská, kteráž jest blízko Jeruzaléma, vzdálí cesty jednoho dne svátečního“, dvou tisíc loktů, asi kilometr, povolených v sobotu; Josephus Flavius ji počítá na pět nebo šest stadií od města. Zacharjáš určuje její stranu: „na hoře Olivetské, kteráž jest naproti Jeruzalému od východu“. Ezechiel viděl slávu Hospodinovu opustit město a stát „na hoře, kteráž jest na východ městu“; David utíkal před Abšalomem „k vrchu hory Olivetské“; a v posledním týdnu Ježíš přišel do Jeruzaléma přes ni z Betfage, seděl na ní „proti chrámu“, aby mluvil o konci, trávil tam noci, modlil se v Getsemane a podle Lukáše byl od ní vzat blízko Betanie."
    - "Dnes hora leží ve východním Jeruzalémě. Její západní svah je židovský hřbitov, užívaný od biblických dob, pod vesnicí at-Túr na vrcholu; na svahu stojí Kaple Nanebevstoupení, kostel Pater noster na místě Konstantinovy baziliky Eleona, ruský kostel sv. Marie Magdalské se zlatými kupolemi, Dominus Flevit a Bazilika Všech národů v Getsemane a při úpatí skalní hrobky Kidronu z doby druhého chrámu. Pohled na Staré Město z vrcholu je ten, který ukazuje většina obrazů Jeruzaléma."
  sv:
    - "Olivberget är åsen omedelbart öster om Jerusalem, tvärs över Kidrondalen från Tempelberget: kartpunkten står på dess topp, omkring 1,1 km öster om Jerusalempunkten fågelvägen, med Getsemane vid dess fot omkring 600 m nedför sluttningen. Huvudtoppen reser sig något över 800 m över havet, omkring 80 m högre än tempelplattformen, så att hela staden ligger i sikte därifrån; Skopusberget för åsen vidare norrut, och Betfage och Betania ligger på östra sluttningen mot Jeriko. Artikeln om berget berättar dess historia i sin helhet; den här sidan besvarar frågan om platsen."
    - "Apostlagärningarna mäter det: lärjungarna vände tillbaka till Jerusalem ”från det berg som kallas Oljeberget, vilket ligger nära Jerusalem, icke längre därifrån, än man får färdas på en sabbat”, de två tusen alnarna, omkring en kilometer, som tilläts på sabbaten; Josefus räknar fem eller sex stadier från staden. Sakarja anger dess sida: ”Oljeberget, gent emot Jerusalem, österut”. Hesekiel såg HERRENS härlighet lämna staden och stanna ”på berget öster om staden”; David flydde undan Absalom ”uppför Oljeberget”; och under sin sista vecka kom Jesus till Jerusalem över det från Betfage, satt på det ”mitt emot helgedomen” för att tala om slutet, tillbringade nätterna där, bad i Getsemane och togs enligt Lukas upp från det nära Betania."
    - "I dag ligger berget i Östjerusalem. Dess västra sida är den judiska begravningsplatsen, i bruk sedan bibelns tid, nedanför byn at-Tur på toppen; på sluttningen står Himmelsfärdskapellet, Pater Noster-kyrkan på platsen för Konstantins Eleona-basilika, den ryska Maria från Magdalas kyrka med sina gyllene kupoler, Dominus Flevit och Alla nationers kyrka i Getsemane, och vid foten de uthuggna Kidrongravarna från det andra templets tid. Utsikten över gamla staden från toppen är den som de flesta bilder av Jerusalem visar."
  nb:
    - "Oljeberget er ryggen rett øst for Jerusalem, på den andre siden av Kedrondalen fra Tempelhøyden: kartpunktet står på toppen, omtrent 1,1 km øst for Jerusalem-punktet i luftlinje, med Getsemane ved foten omtrent 600 m nedover skråningen. Hovedtoppen reiser seg litt over 800 m over havet, omtrent 80 m høyere enn tempelplattformen, så hele byen ligger i utsikt derfra; Scopusfjellet fører ryggen videre mot nord, og Betfage og Betania ligger på østskråningen mot Jeriko. Artikkelen om fjellet forteller dets historie fullt ut; denne siden svarer på spørsmålet om sted."
    - "Apostlenes gjerninger måler det: disiplene vendte tilbake «til Jerusalem fra det berg som kalles Oljeberget og ligger nær ved Jerusalem, en sabbatsreise derfra», de to tusen alenene, omtrent en kilometer, som var tillatt på sabbaten; Josefus regner det til fem eller seks stadier fra byen. Sakarja fastsetter dets side: «Oljeberget, som ligger midt imot Jerusalem i øst». Esekiel så Herrens herlighet forlate byen og stå «på det berg som er østenfor staden»; David «gikk gråtende opefter Oljeberget» på flukt fra Absalom; og i sin siste uke kom Jesus til Jerusalem over det fra Betfage, satt på det «rett imot templet» for å tale om enden, overnattet der, ba i Getsemane og ble, ifølge Lukas, tatt opp fra det nær Betania."
    - "I dag ligger fjellet i Øst-Jerusalem. Dets vestside er den jødiske gravlunden, i bruk siden bibelsk tid, under landsbyen at-Tur på toppen; i skråningen står Himmelfartskapellet, Pater noster-kirken på stedet for Konstantins Eleona-basilika, den russiske Maria Magdalena-kirken med gylne kupler, Dominus Flevit og Alle nasjoners kirke i Getsemane, og ved foten de fjellhogde Kedron-gravene fra det andre tempelets tid. Utsikten over gamlebyen fra toppen er den de fleste bilder av Jerusalem viser."
  tl:
    - "Ang Bundok ng mga Olibo ay ang tagaytay na kaagad sa silangan ng Jerusalem, sa kabila ng libis ng Cedron mula sa Bundok ng Templo: ang tuldok sa mapa ay nasa tuktok nito, mga 1.1 km sa silangan ng tuldok ng Jerusalem sa tuwid na guhit, at ang Getsemani sa paanan nito mga 600 m pababa sa dalisdis. Ang pangunahing tuktok ay tumataas nang bahagyang higit sa 800 m sa ibabaw ng dagat, mga 80 m na mas mataas kaysa sa plataporma ng Templo, kaya nakikita mula roon ang buong lungsod; ipinagpapatuloy ng Bundok Scopus ang tagaytay sa hilaga, at ang Betfage at Betania ay nasa silangang dalisdis patungong Jerico. Isinasalaysay nang buo ng artikulo tungkol sa bundok ang kasaysayan nito; sinasagot ng pahinang ito ang tanong ng lugar."
    - "Sinusukat ito ng Mga Gawa: bumalik ang mga alagad “sa Jerusalem buhat sa tinatawag na bundok ng mga Olivo, na malapit sa Jerusalem, na isang araw ng sabbath lakarin”, ang dalawang libong siko, mga isang kilometro, na pinapayagan sa sabbath; binibilang ni Josephus na lima o anim na estadio. Itinatakda ni Zacharias ang panig nito: “bundok ng mga Olivo, na nasa tapat ng Jerusalem sa dakong silanganan”. Nakita ni Ezekiel ang kaluwalhatian ng Panginoon na umalis sa lungsod at lumagay “sa ibabaw ng bundok na nasa dakong silanganan ng bayan”; tumakas si David kay Absalom “sa ahunan sa bundok ng mga Olibo”; at sa huling linggo niya, dumaan dito si Jesus mula sa Betfage patungong Jerusalem, naupo roon “sa tapat ng templo” upang magsalita tungkol sa wakas, ginugol ang mga gabi roon, nanalangin sa Getsemani at, ayon kay Lucas, iniakyat mula roon malapit sa Betania."
    - "Ngayon ay nasa Silangang Jerusalem ang bundok. Ang kanlurang mukha nito ay ang sementeryong Judio, ginagamit mula pa sa panahon ng Biblia, sa ibaba ng nayon ng at-Tur sa tuktok; sa dalisdis ay nakatayo ang Kapilya ng Pag-akyat, ang simbahang Pater Noster sa lugar ng basilikang Eleona ni Constantino, ang simbahang Ruso ni Maria Magdalena na may mga gintong simboryo, ang Dominus Flevit at ang Simbahan ng Lahat ng mga Bansa sa Getsemani, at sa paanan ang mga libingan ng Cedron na hiwa sa bato mula sa panahon ng Ikalawang Templo. Ang tanawin ng Lumang Lungsod mula sa tuktok ang ipinakikita ng karamihan ng larawan ng Jerusalem."
  da:
    - "Oliebjerget er højderyggen umiddelbart øst for Jerusalem, hinsides Kedron-dalen fra Tempelbjerget: kortets punkt står på dets top, omkring 1,1 km øst for Jerusalem-punktet i luftlinje, med Getsemane ved foden omkring 600 m nede ad skråningen. Hovedtoppen hæver sig lidt over 800 m over havets overflade, omkring 80 m højere end tempelplatformen, så hele byen ligger for dens syn; Skopusbjerget fører højderyggen videre mod nord, og Betfage og Betania ligger på østskråningen mod Jeriko. Artiklen om bjerget fortæller dets historie fuldt ud; denne side besvarer spørgsmålet om stedet."
    - "Apostlenes Gerninger måler det: disciplene vendte tilbage »til Jerusalem fra det Bjerg, som kaldes Oliebjerget og er nær ved Jerusalem, en Sabbatsvej derfra«, de to tusind alen, omkring en kilometer, der var tilladt på sabbatten; Josefus regner det for fem eller seks stadier fra byen. Zakarias fastlægger dets side: »Oliebjerget, som er lige over for Jerusalem imod Østen«. Ezekiel så Herrens herlighed forlade byen og blive stående »paa Bjerget, som er Østen for Staden«; David flygtede fra Absalon »ad Opgangen til Oliebjerget«; og i sin sidste uge kom Jesus til Jerusalem over det fra Betfage, sad på det »lige over for Helligdommen« for at tale om enden, tilbragte nætterne der, bad i Getsemane og blev ifølge Lukas optaget fra det nær Betania."
    - "I dag ligger bjerget i Østjerusalem. Dets vestlige side er den jødiske kirkegård, i brug siden bibelsk tid, under landsbyen at-Tur på toppen; på skråningen står Himmelfartskapellet, Fadervor-kirken på stedet for Konstantins Eleona-basilika, den russiske Maria Magdalene-kirke med sine gyldne kupler, Dominus Flevit og Alle Nationers Kirke ved Getsemane, og ved foden de klippehuggede Kedron-grave fra det andet tempels tid. Udsigten over Gamlebyen fra toppen er den, de fleste billeder af Jerusalem viser."
  sr:
    - "Маслинска гора је гребен непосредно источно од Јерусалима, преко долине Кедрон од Храмовне горе: тачка на карти стоји на њеном врху, око 1,1 км источно од јерусалимске тачке правом линијом, а Гетсимански врт у њеном подножју око 600 м низ падину. Главни врх уздиже се нешто преко 800 м надморске висине, око 80 м више од платформе Храма, па се с њега види цео град; Скопус наставља гребен на север, а Витфага и Витанија леже на источној падини према Јерихону. Чланак о гори прича њену историју у целини; ова страница одговара на питање места."
    - "Дела је мере: „Тада се вратише у Јерусалим с горе која се зове маслинска, која је близу Јерусалима један суботни дан хода“, то јест две хиљаде лаката, око километра, колико је суботом дозвољено; Јосиф Флавије рачуна пет или шест стадија од града. Захарија одређује њену страну: „на гори маслинској која је према Јерусалиму с истока“. Језекиљ је видео славу Господњу како напушта град и „стаде на гори која је с истока граду“; Давид је бежао од Авесалома: „иђаше уз гору маслинску“; а у својој последњој недељи Исус је дошао у Јерусалим преко ње из Витфаге, седео на њој „према цркви“ да говори о крају, проводио ноћи тамо, молио се у Гетсиманском врту и, по Луки, био узет с ње близу Витаније."
    - "Данас гора лежи у Источном Јерусалиму. Њена западна страна је јеврејско гробље, у употреби од библијских времена, испод села ет Тур на врху; на падини стоје капела Вазнесења, црква Оче наш на месту Константинове базилике Елеоне, руска црква Марије Магдалене са златним куполама, Доминус Флевит и Црква свих народа у Гетсиманији, а у подножју гробнице Кедрона усечене у стену из доба Другог храма. Поглед на Стари град са врха онај је који приказује већина слика Јерусалима."
  hu:
    - "Az Olajfák hegye a Jeruzsálemtől közvetlenül keletre húzódó gerinc, a Kidron-völgy túloldalán a Templomhegytől: a térképi pont a csúcsán áll, a jeruzsálemi ponttól egyenes vonalban mintegy 1,1 km-re keletre, lábánál Gecsemánéval, mintegy 600 m-rel lejjebb a lejtőn. A fő csúcs valamivel több mint 800 m-rel emelkedik a tengerszint fölé, mintegy 80 m-rel magasabban a Templom teraszánál, így az egész város látszik róla; a Szkopusz-hegy folytatja a gerincet északra, Betfagé és Betánia pedig a keleti lejtőn fekszik Jerikó felé. A hegyről szóló cikk részletesen elmeséli a történetét; ez az oldal a hely kérdésére válaszol."
    - "Az ApCsel megméri: a tanítványok visszatértek „Jeruzsálembe a hegyről, mely hívatik Olajfák hegyének, mely Jeruzsálem mellett van, egy szombatnapi járóföldre”, vagyis a szombaton megengedett kétezer singre, mintegy egy kilométerre; Josephus öt-hat stadionra számítja a várostól. Zakariás meghatározza az oldalát: „az Olajfák hegyére veti lábait, a mely szemben van Jeruzsálemmel napkelet felől”. Ezékiel látta az Úr dicsőségét elhagyni a várost, és megállni „a hegyre, mely a várostól keletre van”; Dávid Absolon elől menekült: „Dávid pedig felméne az olajfáknak hegyén”; utolsó hetében pedig Jézus Betfagéból ezen át ment Jeruzsálembe, ült rajta „a templom átellenében”, hogy a végről beszéljen, itt töltötte az éjszakákat, Gecsemánéban imádkozott, és Lukács szerint Betánia közelében innen vétetett fel."
    - "Ma a hegy Kelet-Jeruzsálemben fekszik. Nyugati oldala a bibliai idők óta használt zsidó temető, a tetején lévő et-Túr falu alatt; a lejtőn áll a Mennybemenetel kápolnája, a Miatyánk-templom Konstantin Eleona-bazilikájának helyén, az aranykupolás orosz Mária Magdolna-templom, a Dominus Flevit és a Minden Nemzetek Temploma Gecsemánéban, a lábánál pedig a második templomi kor sziklába vájt kidroni sírjai. A szemlélő a csúcsról az Óvárost úgy látja, ahogy a legtöbb jeruzsálemi kép mutatja."
  fi:
    - "Öljymäki on Jerusalemin välittömästi itäpuolella oleva harjanne Kidronin laakson toisella puolella Temppelivuoresta: karttapiste on sen huipulla, noin 1,1 km Jerusalemin pisteestä itään linnuntietä, ja Getsemane sen juurella noin 600 m rinnettä alas. Päähuippu nousee hieman yli 800 m merenpinnan yläpuolelle, noin 80 m temppelin tasannetta korkeammalle, joten koko kaupunki näkyy siitä; Skopusvuori jatkaa harjannetta pohjoiseen, ja Betfage ja Betania ovat itärinteellä Jerikoa kohti. Vuorta koskeva artikkeli kertoo sen historian kokonaisuudessaan; tämä sivu vastaa paikan kysymykseen."
    - "Apostolien teot mittaavat sen: opetuslapset palasivat ”Jerusalemiin vuorelta, jota kutsutaan Öljymäeksi ja joka on lähellä Jerusalemia, sapatinmatkan päässä”, kahdentuhannen kyynärän, noin kilometrin, päässä, mikä sapattina sallittiin; Josephus arvioi sen viiden tai kuuden stadionin päähän kaupungista. Sakarja määrittää sen sivun: Öljymäki, ”joka on Jerusalemin edustalla itää kohti”. Hesekiel näki Herran kirkkauden poistuvan kaupungista ja asettuvan ”vuorelle, joka on itään päin kaupungista”; Daavid pakeni Absalomia, ja hän ”kulki itkien Öljymäkeä ylös”; ja viimeisellä viikollaan Jeesus tuli Jerusalemiin sen yli Betfagesta, istui sillä ”vastapäätä pyhäkköä” puhuakseen lopusta, vietti siellä yöt, rukoili Getsemanessa ja Luukkaan mukaan otettiin sieltä ylös lähellä Betaniaa."
    - "Nykyään vuori on Itä-Jerusalemissa. Sen länsirinne on juutalainen hautausmaa, käytössä raamatullisista ajoista, huipulla olevan at-Turin kylän alapuolella; rinteellä ovat Taivaaseenastumisen kappeli, Isä meidän -kirkko Konstantinuksen Eleona-basilikan paikalla, Maria Magdaleenan venäläinen kirkko kultaisine kupoleineen, Dominus Flevit ja Kaikkien kansojen kirkko Getsemanessa sekä juurella kallioon hakatut Kidronin haudat Toisen temppelin ajalta. Näkymä Vanhaankaupunkiin huipulta on se, jonka useimmat Jerusalemin kuvat näyttävät."
  vi:
    - "Núi Ô-li-ve là sống đồi ngay phía đông Giê-ru-sa-lem, bên kia thung lũng Xết-rôn so với núi Đền Thờ: điểm bản đồ đứng trên đỉnh, cách điểm Giê-ru-sa-lem khoảng 1,1 km về phía đông theo đường thẳng, với Ghết-sê-ma-nê dưới chân khoảng 600 m xuống sườn. Đỉnh chính cao hơn mực nước biển chút ít trên 800 m, cao hơn nền Đền Thờ khoảng 80 m, nên toàn thành nằm trong tầm nhìn từ đó; núi Scopus nối sống đồi về phía bắc, còn Bê-pha-giê và Bê-tha-ni nằm trên sườn đông về phía Giê-ri-cô. Bài viết về ngọn núi kể đầy đủ lịch sử của nó; trang này trả lời câu hỏi về vị trí."
    - "Sách Công vụ đo nó: các môn đồ “từ núi gọi là Ô-li-ve trở về thành Giê-ru-sa-lem; núi ấy cách thành Giê-ru-sa-lem một quãng đường ước đi một ngày Sa-bát”, tức hai ngàn thước, khoảng một kilômét, được phép đi ngày sa-bát; Giô-sê-phu tính nó cách thành năm hay sáu stadia. Xa-cha-ri xác định phía của nó: “núi ô-li-ve, là núi đối ngang Giê-ru-sa-lem về phía đông”. Ê-xê-chi-ên thấy sự vinh hiển của Đức Giê-hô-va rời thành và “đứng trên núi phía đông thành”; Đa-vít chạy trốn Áp-sa-lôm: “Đa-vít trèo lên núi Ô-li-ve”; và trong tuần cuối, Giê-su vào Giê-ru-sa-lem qua núi từ Bê-pha-giê, ngồi trên núi, “đối ngang đền thờ”, để nói về sự cuối cùng, nghỉ đêm ở đó, cầu nguyện ở Ghết-sê-ma-nê và, theo Lu-ca, được cất lên từ đó gần Bê-tha-ni."
    - "Ngày nay núi nằm trong Đông Giê-ru-sa-lem. Sườn tây là nghĩa trang Do Thái, dùng từ thời Kinh Thánh, dưới làng at-Tur trên đỉnh; trên sườn có Nhà nguyện Thăng Thiên, nhà thờ Pater Noster trên nền thánh đường Eleona của Constantine, nhà thờ Nga của Ma-ri Ma-đơ-len với những mái vòm vàng, Dominus Flevit và Nhà thờ Vạn Quốc tại Ghết-sê-ma-nê, và dưới chân là các mộ Xết-rôn đục đá thời Đền Thờ thứ hai. Cảnh Khu Phố Cổ nhìn từ đỉnh là cảnh mà phần lớn tranh ảnh Giê-ru-sa-lem cho thấy."
  ro:
    - "Muntele Măslinilor este creasta aflată imediat la est de Ierusalim, de cealaltă parte a văii Chedronului față de Muntele Templului: punctul de pe hartă stă pe culmea lui, la circa 1,1 km est de punctul Ierusalimului în linie dreaptă, cu Ghetsimani la poalele lui, vreo 600 m mai jos pe pantă. Culmea principală se ridică puțin peste 800 m deasupra nivelului mării, cu circa 80 m mai sus decât platforma Templului, așa că tot orașul se vede de pe ea; Muntele Scopus continuă creasta spre nord, iar Betfage și Betania se află pe panta de est, spre Ierihon. Articolul despre munte îi spune istoria pe larg; această pagină răspunde întrebării despre loc."
    - "Faptele Apostolilor îl măsoară: ucenicii s-au întors „în Ierusalim dela muntele ce se chiamă Eleon, care este aproape de Ierusalim, calea sâmbetei având”, cei două mii de coți, circa un kilometru, îngăduiți în sabat; Iosif Flaviu îl socotește la cinci sau șase stadii de oraș. Zaharia îi fixează latura: „muntele Maslinilor cel din preajma Ierusalimului despre răsărit”. Ezechiel a văzut slava Domnului părăsind cetatea și stând „pre muntele care erà în preajma cetății”, la est de oraș; David a fugit de Absalom „pre coasta muntelui maslinilor”; iar în ultima sa săptămână Isus a venit la Ierusalim peste el dinspre Betfage, a șezut pe el „în preajma bisericei” ca să vorbească despre sfârșit, și-a petrecut nopțile acolo, s-a rugat în Ghetsimani și, după Luca, a fost înălțat de pe el lângă Betania."
    - "Azi muntele se află în Ierusalimul de Est. Fața lui de vest este cimitirul evreiesc, folosit din vremea biblică, sub satul at-Tur de pe culme; pe pantă se află Capela Înălțării, biserica Pater Noster, pe locul bazilicii Eleona a lui Constantin, biserica rusă a Mariei Magdalena cu cupolele ei aurite, Dominus Flevit și Biserica Tuturor Neamurilor din Ghetsimani, iar la poale mormintele săpate în stâncă din valea Chedronului, din vremea celui de-al Doilea Templu. Priveliștea Orașului Vechi de pe culme este cea pe care o arată cele mai multe imagini ale Ierusalimului."
  bg:
    - "Елеонският хълм е билото непосредствено източно от Йерусалим, отвъд долината Кедрон срещу Храмовия хълм: точката на картата стои на върха му, на около 1,1 км източно от точката на Йерусалим по права линия, а Гетсимания е в подножието му, на около 600 м надолу по склона. Главният връх се издига малко над 800 м надморска височина, около 80 м по-високо от храмовата платформа, така че целият град се вижда от него; Скопус продължава билото на север, а Витфагия и Витания лежат на източния склон към Йерихон. Статията за хълма разказва историята му изцяло; тази страница отговаря на въпроса за мястото."
    - "Деяния го измерват: учениците „се върнаха в Ерусалим от гората нарицаема Елеонска, която е близу до Ерусалим един съботен ден път“ — двете хиляди лакътя, около километър, позволени в събота; Йосиф Флавий смята, че е на пет или шест стадия от града. Захария посочва страната му: „Елеонската гора, която е среща Ерусалим към изток“. Йезекиил видял славата Господня да напуска града и да застава „на гората която е към Изток на града“; Давид бягал от Авесалом „през възхода на маслинената гора“; а през последната си седмица Исус дошъл в Йерусалим през него от Витфагия, седял на него „срещу храма“, за да говори за края, нощувал там, молил се в Гетсимания и, според Лука, бил възнесен от него близо до Витания."
    - "Днес хълмът е в Източен Йерусалим. Западният му склон е юдейското гробище, използвано от библейски времена, под селото ат-Тур на върха; по склона стоят параклисът на Възнесението, църквата „Патер Ностер“ на мястото на Константиновата базилика Елеона, руската църква „Света Мария Магдалина“ със златните си куполи, „Доминус флевит“ и църквата на Всички народи в Гетсимания, а в подножието — изсечените в скалата гробници в Кедрон от периода на Втория храм. Изгледът към Стария град от върха е този, който показват повечето изображения на Йерусалим."
