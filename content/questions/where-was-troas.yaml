id: where-was-troas
question:
  en: "Where was Troas, where Paul saw the man of Macedonia?"
  ru: "Где находилась Троада, где Павлу явился Македонянин?"
  uk: "Де була Троада, де Павло побачив македонця?"
  es: "¿Dónde estaba Troas, donde Pablo vio al varón de Macedonia?"
  pt: "Onde ficava Trôade, onde Paulo viu o homem da Macedônia?"
  de: "Wo lag Troas, wo Paulus den Mann aus Mazedonien sah?"
  fr: "Où se trouvait Troas, où Paul vit le Macédonien ?"
  pl: "Gdzie leżała Troada, gdzie Paweł ujrzał męża z Macedonii?"
  it: "Dov’era Troade, dove Paolo vide l’uomo di Macedonia?"
  cs: "Kde ležela Troas, kde Pavel spatřil muže z Makedonie?"
  nl: "Waar lag Troas, waar Paulus de man uit Macedonië zag?"
  sv: "Var låg Troas, där Paulus såg mannen från Makedonien?"
  nb: "Hvor lå Troas, der Paulus så mannen fra Makedonia?"
  tl: "Nasaan ang Troas, kung saan nakita ni Pablo ang lalaki ng Macedonia?"
answer:
  en:
    - "Troas, in full Alexandria Troas, was a port on the Aegean coast of north-west Asia Minor, by the village of Dalyan in the province of Çanakkale in Turkey, opposite the island of Tenedos and south of Troy; the map point stands on its ruins. Assos lay about 33 km to the south-east in a straight line, and Neapolis in Macedonia, where Paul first landed in Europe, about 198 km across the northern Aegean. In Paul's day it was a Roman colony and the chief harbour for the crossing from Asia to Macedonia."
    - "The New Testament brings Paul here three times. On the second journey, about AD 50, “they passing by Mysia came down to Troas”, and in the night “there stood a man of Macedonia, and prayed him, saying, Come over into Macedonia, and help us”; from here the story is told as “we”. The crossing took two days, “with a straight course to Samothracia, and the next day to Neapolis”; years later the same sea took five days the other way. Paul came back to preach and found “a door was opened unto me of the Lord”; on his last journey, about AD 57, he stayed seven days, talked at the breaking of bread until midnight, and Eutychus “fell down from the third loft, and was taken up dead”, but was brought alive. Second Timothy asks for “the cloke that I left at Troas with Carpus”."
    - "Antigonus founded the city late in the fourth century BC, and Lysimachus renamed it Alexandria after Alexander; under Augustus it became a Roman colony. Early in the second century Ignatius of Antioch, taken under guard to Rome, wrote three of his letters here, and Zosimus says that Constantine began his new capital near Troas before choosing Byzantium. The circuit of the walls, baths, a theatre and the silted basins of the harbour can still be traced on the shore."
  ru:
    - "Троада, полностью Александрия Троадская, — гавань на эгейском берегу северо-запада Малой Азии, у деревни Дальян в турецкой провинции Чанаккале, напротив острова Тенедос и к югу от Трои; точка карты стоит на её развалинах. Асс лежал примерно в 33 км к юго-востоку по прямой, а македонский Неаполь, где Павел впервые ступил на землю Европы, — примерно в 198 км через северную часть Эгейского моря. Во времена Павла это была римская колония и главная гавань для переправы из Асии в Македонию."
    - "Новый Завет приводит сюда Павла трижды. Во втором путешествии, около 50 г., «миновав же Мисию, сошли они в Троаду», и ночью ему было видение: «предстал некий муж, Македонянин, прося его и говоря: приди в Македонию и помоги нам»; отсюда рассказ ведётся от лица «мы». Переправа заняла два дня — «мы прямо прибыли в Самофракию, а на другой день в Неаполь», — а годы спустя обратный путь по тому же морю занял пять дней. Позже Павел пришёл сюда благовествовать, и ему «отверста была дверь Господом»; в последнем путешествии, около 57 г., он пробыл здесь семь дней, беседовал при преломлении хлеба до полуночи, и Евтих «упал вниз с третьего жилья, и поднят мертвым», но его привели живым. Второе послание к Тимофею просит принести «фелонь, который я оставил в Троаде у Карпа»."
    - "Город основал Антигон в конце IV века до н. э., а Лисимах переименовал его в Александрию в честь Александра; при Августе он стал римской колонией. В начале II века Игнатий Антиохийский, которого под стражей везли в Рим, написал отсюда три своих послания, а Зосим сообщает, что Константин начал строить новую столицу близ Троады, прежде чем выбрал Византий. На берегу и сейчас можно проследить кольцо стен, бани, театр и занесённые илом бассейны гавани."
  uk:
    - "Троада, повністю Александрія Троада, була портом на егейському узбережжі північного заходу Малої Азії, біля села Далян у провінції Чанаккале в Туреччині, навпроти острова Тенедос і на південь від Трої; точка на мапі стоїть на її руїнах. Ассос лежав приблизно за 33 км на південний схід по прямій, а Неаполь у Македонії, де Павло вперше зійшов на берег у Європі, — приблизно за 198 км через північну частину Егейського моря. За Павла це була римська колонія і головна гавань для переправи з Азії до Македонії."
    - "Новий Заповіт приводить Павла сюди тричі. Під час другої подорожі, близько 50 р. н. е., «Перейшовши ж Мисию, прийшли в Трояду», і вночі «стояв один чоловік Македонець, благаючи його й говорячи: Прийшовши в Македонию, поможи нам»; відтоді оповідь ведеться від «ми». Переправа тривала два дні: «приспіли ми в Самотракию, другого ж дня в Неаполь»; через роки те саме море в протилежному напрямку забрало п'ять днів. Павло повернувся проповідувати й побачив, що «відчинено менї двері в Господї»; під час останньої подорожі, близько 57 р. н. е., він пробув сім днів, розмовляв при ламанні хліба до півночі, і Євтих «упав з третього поверху до долу, і підняли його мертвого», але був повернений живим. Друге послання до Тимофія просить: «Плащ, що зоставив я в Троядї в Карпа»."
    - "Антігон заснував місто наприкінці IV ст. до н. е., а Лісімах перейменував його на Александрію на честь Александра; за Августа воно стало римською колонією. На початку II ст. Ігнатій Антіохійський, якого везли під вартою до Рима, написав тут три зі своїх листів, а Зосим каже, що Костянтин почав свою нову столицю поблизу Троади, перш ніж обрав Візантій. Обриси мурів, лазні, театр і замулені басейни гавані досі можна простежити на березі."
  es:
    - "Troas, en su nombre completo Alejandría de Troas, era un puerto de la costa egea del noroeste de Asia Menor, junto a la aldea de Dalyan, en la provincia de Çanakkale, en Turquía, frente a la isla de Ténedos y al sur de Troya; el punto del mapa está sobre sus ruinas. Asón quedaba a unos 33 km al sureste en línea recta, y Neápolis, en Macedonia, donde Pablo desembarcó por primera vez en Europa, a unos 198 km a través del Egeo septentrional. En tiempos de Pablo era una colonia romana y el principal puerto para la travesía de Asia a Macedonia."
    - "El Nuevo Testamento lleva a Pablo aquí tres veces. En el segundo viaje, hacia el 50 d. C., «pasando á Misia, descendieron á Troas», y de noche «Un varón Macedonio se puso delante, rogándole, y diciendo: Pasa á Macedonia, y ayúdanos»; desde aquí el relato se cuenta en «nosotros». La travesía duró dos días, «vinimos camino derecho á Samotracia, y el día siguiente á Neápolis»; años después, el mismo mar tardó cinco días en sentido contrario. Pablo volvió a predicar y halló que «me fué abierta puerta en el Señor»; en su último viaje, hacia el 57 d. C., se quedó siete días, habló en la fracción del pan hasta medianoche, y Eutico «cayó del tercer piso abajo, y fué alzado muerto», pero fue llevado vivo. La segunda carta a Timoteo pide «el capote que dejé en Troas en casa de Carpo»."
    - "Antígono fundó la ciudad a finales del siglo IV a. C., y Lisímaco la rebautizó Alejandría en honor de Alejandro; bajo Augusto pasó a ser colonia romana. A principios del siglo II, Ignacio de Antioquía, llevado bajo custodia a Roma, escribió aquí tres de sus cartas, y Zósimo dice que Constantino empezó su nueva capital cerca de Troas antes de elegir Bizancio. El circuito de las murallas, los baños, un teatro y las cuencas cegadas del puerto aún pueden reconocerse en la costa."
  pt:
    - "Trôade, em seu nome completo Alexandria Trôade, era um porto na costa egeia do noroeste da Ásia Menor, junto à aldeia de Dalyan, na província de Çanakkale, na Turquia, em frente à ilha de Tenedos e ao sul de Troia; o ponto do mapa fica sobre suas ruínas. Assôs ficava a cerca de 33 km a sudeste em linha reta, e Neápolis, na Macedônia, onde Paulo desembarcou pela primeira vez na Europa, a cerca de 198 km através do norte do Egeu. No tempo de Paulo era uma colônia romana e o principal porto para a travessia da Ásia para a Macedônia."
    - "O Novo Testamento traz Paulo aqui três vezes. Na segunda viagem, por volta de 50 d.C., “Passando pela Mísia, desceram a Trôade”, e à noite “Havia um homem da Macedônia em pé, rogando-lhe e dizendo: Passa à Macedônia e ajuda-nos”; daqui a narrativa passa a ser contada em “nós”. A travessia levou dois dias, “fizemos uma rota direta para Samotrácia, e no dia seguinte para Neápolis”; anos depois, o mesmo mar levou cinco dias no sentido contrário. Paulo voltou para pregar e achou que “uma porta me foi aberta no Senhor”; na última viagem, por volta de 57 d.C., ficou sete dias, falou até a meia-noite na fração do pão, e Êutico “caiu do terceiro andar e foi recolhido morto”, mas foi trazido de volta com vida. 2 Timóteo pede “a capa que deixei em Trôade com Carpo”."
    - "Antígono fundou a cidade no fim do século IV a.C., e Lisímaco a rebatizou como Alexandria em honra de Alexandre; sob Augusto tornou-se colônia romana. No início do século II, Inácio de Antioquia, levado sob guarda a Roma, escreveu aqui três de suas cartas, e Zósimo diz que Constantino começou sua nova capital perto de Trôade antes de escolher Bizâncio. O traçado das muralhas, banhos, um teatro e as bacias assoreadas do porto ainda podem ser seguidos na costa."
  de:
    - "Troas, vollständig Alexandria Troas, war ein Hafen an der Ägäisküste im Nordwesten Kleinasiens, beim Dorf Dalyan in der türkischen Provinz Çanakkale, gegenüber der Insel Tenedos und südlich von Troja; der Kartenpunkt steht auf seinen Ruinen. Assos lag in der Luftlinie etwa 33 km südöstlich und Neapolis in Mazedonien, wo Paulus zum ersten Mal europäischen Boden betrat, etwa 198 km jenseits der nördlichen Ägäis. Zu Paulus’ Zeit war es eine römische Kolonie und der wichtigste Hafen für die Überfahrt von Asien nach Mazedonien."
    - "Das Neue Testament führt Paulus dreimal hierher. Auf der zweiten Reise, um 50 n. Chr., heißt es: „Sie zogen aber an Mysien vorüber und kamen hinab gen Troas“, und in der Nacht erschien „ein Mann aus Mazedonien, der stand und bat ihn und sprach: Komm herüber nach Mazedonien und hilf uns!“; von hier an wird die Geschichte in der Wir-Form erzählt. Die Überfahrt dauerte zwei Tage, „geradewegs kamen wir gen Samothrazien, des andern Tages gen Neapolis“; Jahre später dauerte sie in Gegenrichtung fünf Tage. Paulus kam zurück, um zu predigen, und fand, dass ihm „eine Tür aufgetan war in dem HERRN“; auf seiner letzten Reise, um 57 n. Chr., blieb er sieben Tage, redete beim Brotbrechen bis Mitternacht, und Eutychus „fiel hinunter vom dritten Söller und ward tot aufgehoben“, wurde aber lebend gebracht. Der Zweite Timotheusbrief erbittet „den Mantel, den ich zu Troas ließ bei Karpus“."
    - "Antigonos gründete die Stadt Ende des 4. Jahrhunderts v. Chr., und Lysimachos benannte sie nach Alexander in Alexandria um; unter Augustus wurde sie römische Kolonie. Anfang des 2. Jahrhunderts schrieb Ignatius von Antiochia, unter Bewachung nach Rom gebracht, hier drei seiner Briefe, und Zosimos sagt, Konstantin habe seine neue Hauptstadt bei Troas begonnen, bevor er sich für Byzanz entschied. Der Mauerring, Bäder, ein Theater und die verlandeten Hafenbecken lassen sich am Ufer noch verfolgen."
  fr:
    - "Troas, de son nom complet Alexandrie de Troade, était un port de la côte égéenne du nord-ouest de l’Asie Mineure, près du village de Dalyan, dans la province de Çanakkale, en Turquie, en face de l’île de Ténédos et au sud de Troie ; le point de la carte se trouve sur ses ruines. Assos était à environ 33 km au sud-est à vol d’oiseau, et Néapolis en Macédoine, où Paul aborda pour la première fois en Europe, à environ 198 km de l’autre côté du nord de la mer Égée. Au temps de Paul, c’était une colonie romaine et le principal port pour la traversée de l’Asie vers la Macédoine."
    - "Le Nouveau Testament amène Paul ici trois fois. Lors du deuxième voyage, vers 50 apr. J.-C., « Ils franchirent alors la Mysie, et descendirent à Troas », et pendant la nuit « un Macédonien lui apparut, et lui fit cette prière : Passe en Macédoine, secours-nous ! » ; dès lors le récit dit « nous ». La traversée dura deux jours : « nous fîmes voile directement vers la Samothrace, et le lendemain nous débarquâmes à Néapolis » ; des années plus tard, la même mer en prit cinq dans l’autre sens. Paul revint prêcher, le Seigneur lui ayant, écrit-il, « ouvert une porte » ; lors de son dernier voyage, vers 57 apr. J.-C., il y resta sept jours, s’entretint jusqu’à minuit à la fraction du pain, et Eutychus « tomba du troisième étage en bas, et il fut relevé mort », mais fut ramené vivant. La seconde épître à Timothée réclame « le manteau que j’ai laissé à Troas chez Carpus »."
    - "Antigone fonda la ville à la fin du IVe siècle av. J.-C., et Lysimaque la rebaptisa Alexandrie d’après Alexandre ; sous Auguste, elle devint colonie romaine. Au début du IIe siècle, Ignace d’Antioche, emmené sous escorte à Rome, y écrivit trois de ses lettres, et Zosime dit que Constantin commença sa nouvelle capitale près de Troas avant de choisir Byzance. Le tracé des murailles, des bains, un théâtre et les bassins ensablés du port peuvent encore se suivre sur le rivage."
  pl:
    - "Troada, w pełnej nazwie Aleksandria Troas, była portem na egejskim wybrzeżu północno-zachodniej Azji Mniejszej, przy wsi Dalyan w prowincji Çanakkale w Turcji, naprzeciw wyspy Tenedos i na południe od Troi; punkt na mapie stoi na jej ruinach. Assos leżało około 33 km na południowy wschód w linii prostej, a Neapolis w Macedonii, gdzie Paweł po raz pierwszy wylądował w Europie, około 198 km przez północną część Morza Egejskiego. W czasach Pawła była rzymską kolonią i głównym portem dla przeprawy z Azji do Macedonii."
    - "Nowy Testament sprowadza Pawła tu trzy razy. W drugiej podróży, około 50 n.e., „minąwszy Mizyję, zstąpili do Troady”, a w nocy „Mąż niejaki Macedończyk stał, prosząc go i mówiąc: Przepraw się do Macedonii, a ratuj nas”; od tego miejsca opowieść prowadzona jest jako „my”. Przeprawa trwała dwa dni, „prostośmy bieżeli do Samotracyi, a nazajutrz do Neapolu”; po latach to samo morze zajęło pięć dni w drugą stronę. Paweł wrócił, by nauczać, i „drzwi mi były otworzone w Panu”; w ostatniej podróży, około 57 n.e., został siedem dni, rozmawiał przy łamaniu chleba do północy, a Eutych „padł na dół z trzeciego piętra i podniesiony jest umarły”, lecz przyprowadzono go żywego. Drugi List do Tymoteusza prosi o „opończę, którąm zostawił w Troadzie u Karpusa”."
    - "Antygonos założył miasto pod koniec IV wieku p.n.e., a Lizymach przemianował je na Aleksandrię od Aleksandra; za Augusta stało się rzymską kolonią. Na początku II wieku Ignacy Antiocheński, wieziony pod strażą do Rzymu, napisał tu trzy ze swoich listów, a Zosimos mówi, że Konstantyn zaczął budować swoją nową stolicę koło Troady, zanim wybrał Bizancjum. Obwód murów, łaźnie, teatr i zamulone baseny portu można wciąż prześledzić na wybrzeżu."
  it:
    - "Troade, per esteso Alessandria Troade, era un porto sulla costa egea dell’Asia Minore nord-occidentale, presso il villaggio di Dalyan nella provincia di Çanakkale in Turchia, di fronte all’isola di Tenedo e a sud di Troia; il punto della mappa si trova sulle sue rovine. Asso distava circa 33 km a sud-est in linea d’aria, e Neapoli in Macedonia, dove Paolo sbarcò per la prima volta in Europa, circa 198 km attraverso l’Egeo settentrionale. Ai tempi di Paolo era una colonia romana e il porto principale per la traversata dall’Asia alla Macedonia."
    - "Il Nuovo Testamento porta qui Paolo tre volte. Nel secondo viaggio, verso il 50 d.C., «passata la Misia, discesero in Troas», e di notte «Un uomo macedone gli stava dinanzi, e lo pregava dicendo: Passa in Macedonia e soccorrici»; da qui il racconto è fatto al «noi». La traversata richiese due giorni, «tirammo diritto, verso Samotracia, e il giorno seguente verso Neapoli»; anni dopo lo stesso mare richiese cinque giorni nell’altra direzione. Paolo tornò a predicare e, dice, «essendomi aperta una porta nel Signore»; nel suo ultimo viaggio, verso il 57 d.C., si fermò sette giorni, parlò fino a mezzanotte allo spezzare del pane, ed Eutico «cadde giù dal terzo piano, e fu levato morto», ma fu ricondotto vivo. La seconda lettera a Timoteo chiede «il mantello che ho lasciato a Troas da Carpo»."
    - "Antigono fondò la città alla fine del IV secolo a.C., e Lisimaco la ribattezzò Alessandria in onore di Alessandro; sotto Augusto divenne colonia romana. All’inizio del II secolo Ignazio di Antiochia, condotto sotto scorta a Roma, vi scrisse tre delle sue lettere, e Zosimo dice che Costantino iniziò la sua nuova capitale presso Troade prima di scegliere Bisanzio. Il perimetro delle mura, le terme, un teatro e i bacini interrati del porto possono ancora essere seguiti sulla riva."
  cs:
    - "Troas, celým jménem Alexandria Troas, byl přístav na egejském pobřeží severozápadní Malé Asie, u vsi Dalyan v provincii Çanakkale v Turecku, naproti ostrovu Tenedos a jižně od Tróje; bod na mapě stojí na jeho zříceninách. Assos ležel vzdušnou čarou asi 33 km na jihovýchod a Neapolis v Makedonii, kde Pavel poprvé vstoupil v Evropě na pevninu, asi 198 km přes severní Egejské moře. V Pavlově době to byla římská kolonie a hlavní přístav pro přeplavbu z Asie do Makedonie."
    - "Nový zákon přivádí Pavla sem třikrát. Na druhé cestě, kolem roku 50 n. l., „pominuvše Myzii, šli do Troady“ a v noci se mu ukázalo vidění, „jako by muž nějaký Macedonský stál, a prosil ho, řka: Přijda do Macedonie, pomoz nám“; od tohoto místa je příběh vyprávěn v „my“. Plavba trvala dva dny, „přímým během připlavili jsme se do Samotracie a nazejtří do Neapolis“; o léta později trvala táž plavba opačným směrem pět dní. Pavel se vrátil kázat a shledal, že „dveře mi otevříny byly skrze Pána“; na poslední cestě, kolem roku 57 n. l., zůstal sedm dní, mluvil při lámání chleba do půlnoci a Eutychos „spadl s třetího ponebí dolů, a vzat jest mrtvý“, ale byl přiveden živý. Druhý list Timoteovi žádá o plášť, který Pavel zanechal v Troadě u Karpa."
    - "Antigonos založil město koncem 4. století př. n. l. a Lysimachos je přejmenoval na Alexandrii po Alexandrovi; za Augusta se stalo římskou kolonií. Počátkem 2. století zde Ignatios Antiochijský, vezený pod stráží do Říma, napsal tři ze svých listů a Zósimos říká, že Konstantin začal své nové hlavní město poblíž Troady, než zvolil Byzantion. Obvod hradeb, lázně, divadlo a zanesené přístavní nádrže lze na pobřeží dosud sledovat."
  nl:
    - "Troas, voluit Alexandria Troas, was een havenstad aan de Egeïsche kust van het noordwesten van Klein-Azië, bij het dorp Dalyan in de provincie Çanakkale in Turkije, tegenover het eiland Tenedos en ten zuiden van Troje; het punt op de kaart staat op haar ruïnes. Assos lag hemelsbreed ongeveer 33 km naar het zuidoosten, en Neapolis in Macedonië, waar Paulus voor het eerst in Europa aan land ging, ongeveer 198 km over de noordelijke Egeïsche Zee. In de tijd van Paulus was het een Romeinse kolonie en de voornaamste haven voor de oversteek van Azië naar Macedonië."
    - "Het Nieuwe Testament brengt Paulus hier driemaal. Op de tweede reis, omstreeks 50 n.Chr., reisden zij Mysië voorbij en “kwamen af tot Troas”, en 's nachts zag Paulus een gezicht: “er was een Macedonisch man staande, die hem bad en zeide: Kom over in Macedonië, en help ons”; vanaf hier is het verhaal in de “wij”-vorm. De oversteek duurde twee dagen: “liepen wij recht naar Samothrace, en den volgende dag naar Neapolis”; jaren later duurde dezelfde zee vijf dagen de andere kant op. Paulus kwam terug om te prediken, toen “mij een deur geopend was in den Heere”; op zijn laatste reis, omstreeks 57 n.Chr., bleef hij zeven dagen en sprak bij het breken van het brood tot middernacht, en Eutychus “viel van de derde zoldering nederwaarts, en werd dood opgenomen”, maar werd levend teruggebracht. 2 Timoteüs vraagt om “den reismantel mede, dien ik te Troas bij Karpus gelaten heb”."
    - "Antigonus stichtte de stad laat in de vierde eeuw v.Chr., en Lysimachus noemde haar Alexandria naar Alexander; onder Augustus werd zij een Romeinse kolonie. Vroeg in de tweede eeuw schreef Ignatius van Antiochië, onder bewaking naar Rome gebracht, hier drie van zijn brieven, en Zosimus zegt dat Constantijn zijn nieuwe hoofdstad bij Troas begon voordat hij Byzantium koos. De omtrek van de muren, baden, een theater en de dichtgeslibde havenbekkens zijn nog aan de kust te volgen."
  sv:
    - "Troas, fullständigt Alexandria Troas, var en hamn på Egeiska kusten i nordvästra Mindre Asien, vid byn Dalyan i provinsen Çanakkale i Turkiet, mitt emot ön Tenedos och söder om Troja; kartpunkten står på dess ruiner. Assos låg omkring 33 km åt sydost i fågelvägen, och Neapolis i Makedonien, där Paulus först landade i Europa, omkring 198 km över norra Egeiska havet. På Paulus’ tid var det en romersk koloni och den främsta hamnen för överfarten från Asien till Makedonien."
    - "Nya testamentet för Paulus hit tre gånger. På den andra resan, omkring år 50 e.Kr., ”begåvo de sig över Mysien ned till Troas”, och om natten ”visade sig för Paulus i en syn om natten en macedonisk man, som stod där och bad honom och sade: ’Far över till Macedonien och hjälp oss.’” Härifrån berättas historien som ”vi”. Överfarten tog två dagar, ”raka vägen till Samotrace och dagen därefter till Neapolis”; år senare tog samma hav fem dagar åt andra hållet. Paulus kom tillbaka för att predika och fann att ”en dörr till verksamhet i Herren öppnades för mig”; på sin sista resa, omkring år 57 e.Kr., stannade han sju dagar, samtalade vid brödsbrytelsen till midnatt, och Eutykos ”störtade ned från tredje våningen; och när man tog upp honom, var han död”, men fördes hem levande. Andra Timoteusbrevet ber om ”den mantel som jag lämnade kvar hos Karpus i Troas”."
    - "Antigonos grundade staden sent på 300-talet f.Kr., och Lysimachos döpte om den till Alexandria efter Alexander; under Augustus blev den en romersk koloni. Tidigt på 100-talet skrev Ignatios av Antiochia, förd under bevakning till Rom, tre av sina brev här, och Zosimos säger att Konstantin påbörjade sin nya huvudstad nära Troas innan han valde Byzantion. Murarnas sträckning, badhus, en teater och hamnens igenslammade bassänger kan fortfarande skönjas vid stranden."
  nb:
    - "Troas, fullt navn Alexandria Troas, var en havn på Egeerhavskysten i det nordvestlige Lilleasia, ved landsbyen Dalyan i provinsen Çanakkale i Tyrkia, rett overfor øya Tenedos og sør for Troja; kartpunktet står på ruinene. Assos lå omtrent 33 km mot sørøst i luftlinje, og Neapolis i Makedonia, der Paulus først gikk i land i Europa, omtrent 198 km tvers over det nordlige Egeerhavet. På Paulus’ tid var den en romersk koloni og hovedhavnen for overfarten fra Asia til Makedonia."
    - "Det nye testamentet bringer Paulus hit tre ganger. På den annen reise, omkring 50 e.Kr., «drog de da utenom Mysia og drog ned til Troas», og om natten «Det stod en mann fra Makedonia og bad ham og sa: Kom over til Makedonia og hjelp oss!»; herfra fortelles historien i «vi»-form. Overfarten tok to dager: de «styrte rett frem til Samotrake, og den næste dag til Neapolis»; år senere tok det samme havet fem dager den andre veien. Paulus kom tilbake for å forkynne og fant at «en dør var mig oplatt i Herren»; på sin siste reise, omkring 57 e.Kr., ble han syv dager, holdt samtaler ved brødbrytelsen til midnatt, og Evtykos «falt ned fra tredje stokkverk, Og blev tatt død op», men ble ført levende bort. Andre Timoteusbrev ber om «den kappe som jeg lot bli i Troas hos Karpus»."
    - "Antigonos grunnla byen sent på 300-tallet f.Kr., og Lysimakhos omdøpte den til Alexandria etter Aleksander; under Augustus ble den en romersk koloni. Tidlig på 100-tallet skrev Ignatius av Antiokia, ført under bevoktning til Roma, tre av sine brev her, og Zosimos sier at Konstantin begynte sin nye hovedstad nær Troas før han valgte Byzantion. Murenes omkrets, badene, et teater og de tilslammede havnebassengene kan fortsatt spores på kysten."
  tl:
    - "Ang Troas, sa buong pangalan ay Alexandria Troas, ay isang daungan sa baybayin ng Aegeo ng hilagang-kanlurang Asia Minor, sa tabi ng nayon ng Dalyan sa lalawigan ng Çanakkale sa Turkey, sa tapat ng pulo ng Tenedos at sa timog ng Troy; nasa mga guho nito ang punto sa mapa. Ang Ason ay mga 33 km sa timog-silangan sa tuwid na guhit, at ang Neapolis sa Macedonia, kung saan unang lumapag si Pablo sa Europa, mga 198 km sa kabila ng hilagang Aegeo. Noong panahon ni Pablo, isa itong kolonyang Romano at ang pangunahing daungan sa pagtawid mula Asia patungong Macedonia."
    - "Tatlong beses dinala ng Bagong Tipan si Pablo rito. Sa ikalawang paglalakbay, mga 50 AD, “pagkaraan nila sa Misia, ay nagsilusong sila sa Troas”, at sa gabi ay “may isang lalaking taga Macedonia na nakatayo, na namamanhik sa kaniya, at sinasabi, Tumawid ka sa Macedonia, at tulungan mo kami”; mula rito ang salaysay ay sa “kami”. Dalawang araw ang pagtawid, “pinunta namin ang Samotracia, at nang kinabukasa'y ang Neapolis”; makalipas ang mga taon, limang araw ito sa kabilang direksiyon. Bumalik si Pablo upang mangaral nang, ayon sa kaniya, “mabuksan sa akin ang isang pinto sa Panginoon”; sa huli niyang paglalakbay, mga 57 AD, nanatili siya nang pitong araw, nagsalita sa pagputol ng tinapay hanggang hatinggabi, at si Eutico ay “nahulog buhat sa ikatlong grado, at siya'y binuhat na patay”, ngunit binuhay. Hinihingi ng 2 Timoteo ang “balabal na aking iniwan sa Troas kay Carpo”."
    - "Itinatag ni Antigonus ang lungsod noong huling bahagi ng ika-4 na siglo BK, at pinangalanan itong muli ni Lisimaco na Alexandria kay Alejandro; sa ilalim ni Augusto, naging kolonyang Romano ito. Noong simula ng ika-2 siglo, si Ignacio ng Antioquia, na dinala sa ilalim ng bantay sa Roma, ay sumulat dito ng tatlo sa kaniyang mga liham, at sinasabi ni Zosimus na sinimulan ni Constantino ang kaniyang bagong kabisera malapit sa Troas bago piliin ang Byzantium. Ang paligid ng mga pader, mga paliguan, isang teatro at ang mga nabanlikang palanggana ng daungan ay masusubaybayan pa sa baybayin."
