id: where-was-galilee
question:
  en: "Where was Galilee?"
  ru: "Где находилась Галилея?"
  uk: "Де була Галілея?"
  es: "¿Dónde estaba Galilea?"
  pt: "Onde ficava a Galileia?"
  de: "Wo lag Galiläa?"
  fr: "Où se trouvait la Galilée ?"
  pl: "Gdzie leżała Galilea?"
  it: "Dov’era la Galilea?"
  cs: "Kde ležela Galilea?"
  nl: "Waar lag Galilea?"
  sv: "Var låg Galileen?"
  nb: "Hvor lå Galilea?"
answer:
  en:
    - "Galilee was the northern part of the land west of the Jordan, today the north of Israel: from the plain of Jezreel in the south to the borders of Tyre and the hills of Lebanon in the north, and from the Sea of Galilee and the upper Jordan in the east towards the coastal plain by Acco. The map point stands on the western shore of the lake beside Tiberias, about 115 km north of Jerusalem in a straight line; Nazareth is about 22 km to the west of it and Capernaum about 14 km to the north."
    - "Josephus, who commanded Galilee in the war of AD 66, divides it into Upper Galilee, a highland rising to about 1,200 m at Mount Meron, and Lower Galilee, low ridges and fertile valleys with Nazareth, Cana and Sepphoris, falling to the lake about 210 m below sea level. Joshua names Kedesh “in Galilee in mount Naphtali” as a city of refuge in the north; from Kedesh to Jezreel, on the edge of its plain, is about 64 km in a straight line, so the whole region was small."
    - "Isaiah calls it “Galilee of the nations”, a frontier ringed by Phoenicians and Arameans, and Matthew sees the words fulfilled when Jesus settles at Capernaum: “by the way of the sea, beyond Jordan, Galilee of the Gentiles”. In his time it was ruled not by Pilate but by Herod Antipas, “being tetrarch of Galilee”, with Samaria lying between it and Judea; Matthew writes that “Jesus went about all Galilee, teaching in their synagogues”, and most of his ministry was spent in a few towns round the lake."
  ru:
    - "Галилея — северная часть земли к западу от Иордана, нынешний север Израиля: от Изреельской равнины на юге до пределов Тира и гор Ливана на севере и от Галилейского моря и верхнего Иордана на востоке до приморской равнины у Акко. Точка карты стоит на западном берегу озера рядом с Тивериадой, примерно в 115 км к северу от Иерусалима по прямой; Назарет лежит примерно в 22 км к западу от неё, а Капернаум — примерно в 14 км к северу."
    - "Иосиф Флавий, командовавший Галилеей в войну 66 г. н. э., делит её на Верхнюю Галилею, нагорье, поднимающееся примерно до 1200 м у горы Мерон, и Нижнюю — невысокие гряды и плодородные долины с Назаретом, Каной и Сепфорисом, спускающиеся к озеру на 210 м ниже уровня моря. Книга Иисуса Навина называет городом убежища на севере Кедес «в Галилее на горе Неффалимовой»; от Кедеса до Изрееля на краю его равнины около 64 км по прямой, так что вся область была невелика."
    - "Исаия называет её Галилеей языческой — пограничным краем среди финикийцев и арамеев, и Матфей видит исполнение этих слов, когда Иисус поселяется в Капернауме: «на пути приморском, за Иорданом, Галилея языческая». В Его время ею правил не Пилат, а Ирод Антипа, который «был четвертовластником в Галилее», а между ней и Иудеей лежала Самария; Матфей пишет: «И ходил Иисус по всей Галилее, уча в синагогах их», и бо́льшая часть Его служения прошла в нескольких городах вокруг озера."
  uk:
    - "Галілея була північною частиною землі на захід від Йордану, нині — північ Ізраїлю: від Єзреельської рівнини на півдні до кордонів Тіру й пагорбів Лівану на півночі, і від Галілейського моря та верхнього Йордану на сході до прибережної рівнини біля Акко. Точка на мапі стоїть на західному березі озера поруч із Тіверіадою, приблизно за 115 км на північ від Єрусалима по прямій; Назарет лежить приблизно за 22 км на захід від неї, а Капернаум — приблизно за 14 км на північ."
    - "Йосиф Флавій, який командував Галілеєю у війні 66 р. н. е., ділить її на Верхню Галілею — нагір'я, що здіймається приблизно до 1200 м на горі Мерон, і Нижню Галілею — невисокі пасма та родючі долини з Назаретом, Каною й Сепфорісом, що спадають до озера, яке лежить приблизно на 210 м нижче рівня моря. Книга Ісуса Навина називає Кедес «в Галилеї на Нафталїєвій горі» містом-захистом на півночі; від Кедеса до Єзреелю, на краю його рівнини, приблизно 64 км по прямій, тож увесь край був невеликий."
    - "Ісая називає її «Галилею поганською» — прикордонням, оточеним фінікійцями й арамеями, а Матвій бачить ці слова сповненими, коли Ісус оселяється в Капернаумі: «на морському шляху, за Йорданом, Галилея поганська». За його часів нею правив не Пилат, а Ірод Антипа, «четверовластником у Галилеї», а між нею та Юдеєю лежала Самарія; Матвій пише, що «ходив Ісус по всїй Галилеї, навчаючи по школах їх», і більшу частину своєї служби він провів у кількох містах навколо озера."
  es:
    - "Galilea era la parte septentrional de la tierra al oeste del Jordán, hoy el norte de Israel: desde la llanura de Jezreel, al sur, hasta las fronteras de Tiro y las colinas del Líbano, al norte, y desde el mar de Galilea y el alto Jordán, al este, hacia la llanura costera junto a Aco. El punto del mapa está en la orilla occidental del lago, junto a Tiberíades, a unos 115 km al norte de Jerusalén en línea recta; Nazaret queda a unos 22 km al oeste y Cafarnaúm a unos 14 km al norte."
    - "Josefo, que mandó en Galilea en la guerra del 66 d. C., la divide en Alta Galilea, una región montañosa que se eleva hasta unos 1200 m en el monte Merón, y Baja Galilea, de cordilleras bajas y valles fértiles, con Nazaret, Caná y Séforis, que desciende hasta el lago, a unos 210 m bajo el nivel del mar. Josué nombra a Cedes «en Galilea, en el monte de Nephtalí» como ciudad de refugio en el norte; de Cedes a Jezreel, en el borde de su llanura, hay unos 64 km en línea recta, de modo que toda la región era pequeña."
    - "Isaías la llama «Galilea de las gentes», una frontera rodeada de fenicios y arameos, y Mateo ve cumplidas esas palabras cuando Jesús se establece en Cafarnaúm: «camino de la mar, de la otra parte del Jordán, Galilea de los Gentiles». En su tiempo la gobernaba no Pilato, sino Herodes Antipas, «tetrarca de Galilea», con Samaria entre ella y Judea; Mateo escribe que «rodeó Jesús toda Galilea, enseñando en las sinagogas de ellos», y la mayor parte de su ministerio transcurrió en unas pocas ciudades en torno al lago."
  pt:
    - "A Galileia era a parte norte da terra a oeste do Jordão, hoje o norte de Israel: da planície de Jezreel, ao sul, até as fronteiras de Tiro e as colinas do Líbano, ao norte, e do mar da Galileia e do alto Jordão, a leste, em direção à planície costeira junto a Aco. O ponto do mapa fica na margem ocidental do lago, ao lado de Tiberíades, a cerca de 115 km ao norte de Jerusalém em linha reta; Nazaré fica a cerca de 22 km a oeste dele e Cafarnaum a cerca de 14 km ao norte."
    - "Josefo, que comandou a Galileia na guerra do ano 66 d.C., divide-a em Alta Galileia, uma região montanhosa que se eleva a cerca de 1.200 m no monte Meron, e Baixa Galileia, de colinas baixas e vales férteis, com Nazaré, Caná e Séforis, descendo até o lago, a cerca de 210 m abaixo do nível do mar. Josué menciona Quedes, “na Galileia, na região montanhosa de Naftali”, como cidade de refúgio no norte; de Quedes a Jezreel, na orla da sua planície, são cerca de 64 km em linha reta, de modo que toda a região era pequena."
    - "Isaías a chama “Galileia das nações”, uma fronteira cercada por fenícios e arameus, e Mateus vê as palavras cumpridas quando Jesus se estabelece em Cafarnaum: “caminho do mar, além do Jordão, Galileia dos gentios”. Em seu tempo ela era governada não por Pilatos, mas por Herodes Antipas, “Herodes tetrarca da Galileia”, com a Samaria entre ela e a Judeia; Mateus escreve que “Jesus percorria toda a Galileia, ensinando nas sinagogas deles”, e a maior parte do seu ministério se passou em poucas cidades em torno do lago."
  de:
    - "Galiläa war der nördliche Teil des Landes westlich des Jordans, heute der Norden Israels: von der Jesreel-Ebene im Süden bis zu den Grenzen von Tyrus und den Bergen des Libanon im Norden und vom See Genezareth und dem oberen Jordan im Osten bis zur Küstenebene bei Akko. Der Kartenpunkt steht am Westufer des Sees neben Tiberias, in der Luftlinie etwa 115 km nördlich von Jerusalem; Nazareth liegt rund 22 km westlich davon, Kapernaum rund 14 km nördlich."
    - "Josephus, der Galiläa im Krieg des Jahres 66 n. Chr. befehligte, teilt es in Obergaliläa, ein Hochland, das am Meron bis auf etwa 1200 m ansteigt, und Untergaliläa, niedrige Höhenzüge und fruchtbare Täler mit Nazareth, Kana und Sepphoris, die zum See hin auf etwa 210 m unter dem Meeresspiegel abfallen. Josua nennt Kedesch „in Galiläa, auf dem Gebirge Naphthali“ als Freistadt im Norden; von Kedesch bis Jesreel am Rand der Ebene sind es in der Luftlinie rund 64 km, die ganze Region war also klein."
    - "Jesaja nennt es „der Heiden Galiläa“, ein Grenzland, von Phöniziern und Aramäern umringt, und Matthäus sieht die Worte erfüllt, als Jesus sich in Kapernaum niederlässt: „am Wege des Meeres, jenseit des Jordans, und das heidnische Galiläa“. Zu seiner Zeit herrschte dort nicht Pilatus, sondern Herodes Antipas, der „Vierfürst in Galiläa“, wobei Samaria zwischen Galiläa und Judäa lag; Matthäus schreibt, „Jesus ging umher im ganzen galiläischen Lande, lehrte sie in ihren Schulen“, und den größten Teil seines Wirkens verbrachte er in wenigen Orten rund um den See."
  fr:
    - "La Galilée était la partie nord du pays situé à l’ouest du Jourdain, aujourd’hui le nord d’Israël : de la plaine de Jizreel au sud jusqu’aux frontières de Tyr et aux collines du Liban au nord, et de la mer de Galilée et du haut Jourdain à l’est vers la plaine côtière d’Acco. Le point de la carte se trouve sur la rive occidentale du lac, à côté de Tibériade, à environ 115 km au nord de Jérusalem à vol d’oiseau ; Nazareth est à environ 22 km à l’ouest, et Capernaüm à environ 14 km au nord."
    - "Flavius Josèphe, qui commanda en Galilée lors de la guerre de 66 apr. J.-C., la divise en Haute Galilée, région montagneuse qui s’élève à environ 1 200 m au mont Méron, et en Basse Galilée, faite de basses crêtes et de vallées fertiles où se trouvent Nazareth, Cana et Sepphoris, et qui descend vers le lac, à environ 210 m au-dessous du niveau de la mer. Josué nomme Kédesch, « en Galilée, dans la montagne de Nephthali », comme ville de refuge du nord ; de Kédesch à Jizreel, au bord de sa plaine, il y a environ 64 km à vol d’oiseau : toute la région était donc petite."
    - "Ésaïe l’appelle « le territoire des Gentils », région frontière cernée de Phéniciens et d’Araméens, et Matthieu voit ces paroles s’accomplir lorsque Jésus s’établit à Capernaüm : « la contrée voisine de la mer, du pays au delà du Jourdain, Et de la Galilée des Gentils ». À son époque, elle était gouvernée non par Pilate mais par Hérode Antipas, « tétrarque de la Galilée », la Samarie s’interposant entre elle et la Judée ; Matthieu écrit que « Jésus parcourait toute la Galilée, enseignant dans les synagogues », et la plus grande partie de son ministère se passa dans quelques villes autour du lac."
  pl:
    - "Galilea była północną częścią kraju na zachód od Jordanu, dziś północą Izraela: od równiny Jizreel na południu po granice Tyru i wzgórza Libanu na północy oraz od Jeziora Galilejskiego i górnego Jordanu na wschodzie ku nadmorskiej równinie koło Akko. Punkt na mapie stoi na zachodnim brzegu jeziora obok Tyberiady, około 115 km na północ od Jerozolimy w linii prostej; Nazaret leży około 22 km na zachód od niego, a Kafarnaum około 14 km na północ."
    - "Józef Flawiusz, który dowodził w Galilei podczas wojny w 66 n.e., dzieli ją na Górną Galileę, wyżynę wznoszącą się do około 1200 m na górze Meron, i Dolną Galileę, niskie grzbiety i żyzne doliny z Nazaretem, Kaną i Seforis, opadającą ku jezioru leżącemu około 210 m poniżej poziomu morza. Jozue wymienia Kedesz „w Galilei na górze Neftali” jako miasto ucieczki na północy; od Kedesz do Jizreel, na skraju jego równiny, jest około 64 km w linii prostej, więc cały region był niewielki."
    - "Izajasz wspomina „Galileę ludną”, pogranicze otoczone przez Fenicjan i Aramejczyków, a Mateusz widzi te słowa spełnione, gdy Jezus osiada w Kafarnaum: „przy drodze morskiej za Jordanem, Galilea poganów”. W jego czasach rządził nią nie Piłat, lecz Herod Antypas, „Herod Tetrarchą Galilejskim”, a Samaria leżała między nią a Judeą; Mateusz pisze, że „obchodził Jezus wszystkę Galileją, ucząc w bóżnicach ich”, a większość jego służby upłynęła w kilku miastach wokół jeziora."
  it:
    - "La Galilea era la parte settentrionale della terra a ovest del Giordano, oggi il nord di Israele: dalla pianura di Izreel a sud fino ai confini di Tiro e alle colline del Libano a nord, e dal Lago di Tiberiade e dall’alto Giordano a est verso la pianura costiera presso Acco. Il punto della mappa si trova sulla riva occidentale del lago, accanto a Tiberiade, a circa 115 km a nord di Gerusalemme in linea d’aria; Nazaret è a circa 22 km a ovest e Cafarnao a circa 14 km a nord."
    - "Giuseppe Flavio, che comandò la Galilea nella guerra del 66 d.C., la divide in Alta Galilea, un altopiano che sale fino a circa 1.200 m al Monte Meron, e Bassa Galilea, fatta di basse alture e valli fertili con Nazaret, Cana e Sefforis, che scende fino al lago, a circa 210 m sotto il livello del mare. Giosuè nomina Kedes «in Galilea nella contrada montuosa di Neftali» come città di rifugio nel nord; da Kedes a Izreel, al margine della sua pianura, ci sono circa 64 km in linea d’aria, così che l’intera regione era piccola."
    - "Isaia la chiama «la Galilea de’ Gentili», una frontiera circondata da Fenici e Aramei, e Matteo vede le parole adempiersi quando Gesù si stabilisce a Cafarnao: «sulla via del mare, al di là del Giordano, la Galilea dei Gentili». Ai suoi tempi era governata non da Pilato ma da Erode Antipa, «tetrarca della Galilea», con la Samaria posta tra essa e la Giudea; Matteo scrive che «Gesù andava attorno per tutta la Galilea, insegnando nelle loro sinagoghe», e la maggior parte del suo ministero si svolse in poche città attorno al lago."
  cs:
    - "Galilea byla severní část země západně od Jordánu, dnes sever Izraele: od Jizreelské roviny na jihu k hranicím Týru a libanonským horám na severu a od Galilejského jezera a horního Jordánu na východě směrem k pobřežní rovině u Akka. Bod na mapě stojí na západním břehu jezera vedle Tiberiady, vzdušnou čarou asi 115 km severně od Jeruzaléma; Nazaret je od něj asi 22 km na západ a Kafarnaum asi 14 km na sever."
    - "Josephus, který za války roku 66 n. l. velel v Galileji, ji dělí na Horní Galileu, vysočinu stoupající u hory Meron asi do 1 200 m, a Dolní Galileu, nízké hřbety a úrodná údolí s Nazaretem, Kánou a Sefórisem, klesající k jezeru asi 210 m pod hladinou moře. Jozue jmenuje mezi útočištnými městy na severu Kedeš: „Kádes v Galilei na hoře Neftalím“; od Kedeše do Jizreelu, na okraj jeho roviny, je to vzdušnou čarou asi 64 km, takže celá oblast byla malá."
    - "Izajáš ji nazývá Galilejí pohanů, pohraničím obklopeným Féničany a Aramejci, a Matouš vidí slova naplněná, když se Ježíš usadí v Kafarnaum: „při moři za Jordánem, Galilea pohanská“. V jeho době jí nevládl Pilát, ale Herodes Antipas, „čtvrtákem v Galilei“, přičemž mezi ní a Judskem leželo Samaří; Matouš píše, že „procházel Ježíš všecku Galilei, uče v shromážděních jejich“, a většinu svého působení strávil v několika městech kolem jezera."
  nl:
    - "Galilea was het noordelijke deel van het land ten westen van de Jordaan, nu het noorden van Israël: van de vlakte van Jizreël in het zuiden tot de grenzen van Tyrus en de heuvels van Libanon in het noorden, en van het Meer van Galilea en de bovenloop van de Jordaan in het oosten naar de kustvlakte bij Akko. Het punt op de kaart staat aan de westoever van het meer naast Tiberias, hemelsbreed ongeveer 115 km ten noorden van Jeruzalem; Nazareth ligt ongeveer 22 km ten westen ervan en Kafarnaüm ongeveer 14 km ten noorden."
    - "Josephus, die in de oorlog van 66 n.Chr. het bevel voerde over Galilea, verdeelt het in Boven-Galilea, een hoogland dat bij de berg Meron tot ongeveer 1200 m stijgt, en Neder-Galilea, lage heuvelruggen en vruchtbare dalen met Nazareth, Kana en Sefforis, dat afloopt naar het meer, ongeveer 210 m onder zeeniveau. Jozua noemt Kedes “in Galilea, op het gebergte van Nafthali” als vrijstad in het noorden; van Kedes naar Jizreël, aan de rand van zijn vlakte, is het hemelsbreed ongeveer 64 km, zodat het hele gebied klein was."
    - "Jesaja noemt het “Galilea der heidenen”, een grensland omringd door Feniciërs en Arameeërs, en Mattheüs ziet de woorden vervuld wanneer Jezus zich in Kafarnaüm vestigt: “aan den weg der zee over de Jordaan, Galilea der volken”. In zijn tijd werd het niet door Pilatus bestuurd maar door Herodes Antipas, die “een viervorst over Galilea” was, met Samaria tussen Galilea en Judea; Mattheüs schrijft dat “Jezus omging geheel Galilea, lerende in hun synagogen”, en het grootste deel van zijn bediening bracht hij door in enkele steden rond het meer."
  sv:
    - "Galileen var den norra delen av landet väster om Jordan, i dag norra Israel: från Jisreelslätten i söder till Tyros gränser och Libanons höjder i norr, och från Galileiska sjön och övre Jordan i öster mot kustslätten vid Acko. Kartpunkten står på sjöns västra strand bredvid Tiberias, omkring 115 km norr om Jerusalem i fågelvägen; Nasaret ligger omkring 22 km väster om den och Kafarnaum omkring 14 km norrut."
    - "Josefus, som förde befälet över Galileen i kriget år 66 e.Kr., delar in den i Övre Galileen, ett högland som reser sig till omkring 1 200 m vid berget Meron, och Nedre Galileen, låga åsar och bördiga dalar med Nasaret, Kana och Sepforis, som sluttar ned mot sjön omkring 210 m under havsytan. Josua nämner ”Kedes i Galileen, i Naftali bergsbygd” bland tillflyktsstäderna i norr; från Kedesh till Jisreel, vid kanten av dess slätt, är det omkring 64 km i fågelvägen, så hela regionen var liten."
    - "Jesaja talar om ”hedningarnas område”, en gränstrakt omgiven av fenicier och araméer, och Matteus ser orden uppfyllda när Jesus bosätter sig i Kafarnaum: ”trakten åt havet till, landet på andra sidan Jordan, hedningarnas Galileen”. På hans tid styrdes den inte av Pilatus utan av Herodes Antipas, som var ”landsfurste i Galileen”, med Samaria liggande mellan den och Judeen; Matteus skriver att Jesus ”gick omkring i hela Galileen och undervisade i deras synagogor”, och största delen av hans verksamhet tillbringades i några få städer runt sjön."
  nb:
    - "Galilea var den nordlige delen av landet vest for Jordan, i dag Nord-Israel: fra Jisreel-sletten i sør til grensene mot Tyros og Libanons høyder i nord, og fra Galileasjøen og øvre Jordan i øst mot kystsletten ved Akko. Kartpunktet står på vestbredden av innsjøen ved siden av Tiberias, omtrent 115 km nord for Jerusalem i luftlinje; Nasaret ligger omtrent 22 km vest for det og Kapernaum omtrent 14 km mot nord."
    - "Josefus, som var øverstkommanderende i Galilea i krigen i 66 e.Kr., deler landet i Øvre Galilea, et høyland som stiger til omtrent 1200 m ved Meron-fjellet, og Nedre Galilea, lave åser og fruktbare daler med Nasaret, Kana og Sepforis, som faller ned mot innsjøen omtrent 210 m under havet. Josva nevner Kedesj «i Galilea i Naftali-fjellene» som en tilfluktsby i nord; fra Kedesj til Jisreel, ved kanten av sletten, er det omtrent 64 km i luftlinje, så hele regionen var liten."
    - "Jesaja kaller den «hedningenes Galilea», et grenseland omringet av fønikere og arameere, og Matteus ser ordene oppfylt da Jesus slår seg ned i Kapernaum: «ved sjøen, landet på hin side Jordan, hedningenes Galilea». På hans tid var det ikke Pilatus som styrte landet, men Herodes Antipas, «fjerdingsfyrste i Galilea», med Samaria liggende mellom det og Judea; Matteus skriver at «Jesus gikk omkring i hele Galilea og lærte folket i deres synagoger», og mesteparten av hans virke ble tilbrakt i noen få byer rundt innsjøen."
