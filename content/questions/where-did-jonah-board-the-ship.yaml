id: where-did-jonah-board-the-ship
question:
  en: "Where did Jonah board the ship?"
  ru: "Где Иона сел на корабль?"
  uk: "Де Йона сів на корабель?"
  es: "¿Dónde embarcó Jonás?"
  pt: "Onde Jonas embarcou no navio?"
  de: "Wo ging Jona an Bord des Schiffes?"
  fr: "Où Jonas s’embarqua-t-il ?"
  pl: "Gdzie Jonasz wsiadł na okręt?"
  it: "Dove Giona si imbarcò sulla nave?"
  nl: "Waar ging Jona aan boord van het schip?"
  cs: "Kde Jonáš nastoupil na loď?"
  sv: "Var gick Jona ombord på skeppet?"
  nb: "Hvor gikk Jona om bord på skipet?"
  tl: "Saan sumakay si Jonas sa barko?"
  da: "Hvor gik Jonas om bord på skibet?"
  sr: "Где се Јона укрцао на лађу?"
answer:
  en:
    - "At Joppa, today's Jaffa, the old port on a rocky headland at the southern edge of Tel Aviv-Yafo: Jonah “went down to Joppa; and he found a ship going to Tarshish: so he paid the fare thereof, and went down into it”. Joppa was the nearest port to the hill country, about 55 km north-west of Jerusalem in a straight line and about 93 km south-west of Jonah's home at Gath-hepher in Galilee; the map point stands on the ancient mound. Where he was going, and where he was sent instead, is told in the question on Jonah's mission."
    - "Joppa had been a port long before Jonah. Egyptian kings held it from the fifteenth century BC, and excavators have found the gate of their fortress; the cedar for Solomon's Temple was brought “in floats by sea to Joppa” and carried up to Jerusalem, and the returned exiles brought it the same way “to the sea of Joppa”. A ship bound for Tarshish was a large sea-going merchantman, probably Phoenician, made for the long run west; the sailors “cried every man unto his god, and cast forth the wares that were in the ship into the sea”, while Jonah had gone down into the hold and lay fast asleep. The harbour itself was small and open to the wind, and Josephus describes how dangerous its rocks were to ships."
    - "Centuries later Peter stayed at Joppa “many days” with Simon a tanner, “whose house is by the sea side”, and on its roof saw the vision that sent him to the Roman centurion Cornelius at Caesarea, 51 km up the coast: the prophet who fled from Joppa rather than preach to the gentiles of Nineveh and the apostle who went out from Joppa to a gentile house are often set side by side, the more so since Jesus called Peter “Simon Bar-jona”, son of Jonah. Jerome, describing Paula's pilgrimage of the 380s, names Joppa as the port of Jonah's flight. The map uses 780 BC, a point in the reign of Jeroboam II, under whom Jonah prophesied."
  ru:
    - "В Иоппии, нынешней Яффе, старой гавани на скалистом мысу у южного края Тель-Авива-Яффо: Иона «пришел в Иоппию, и нашел корабль, отправлявшийся в Фарсис, отдал плату за провоз и вошел в него». Иоппия была ближайшей гаванью для горной страны — примерно в 55 км к северо-западу от Иерусалима по прямой и в 93 км к юго-западу от родного Гафхефера Ионы в Галилее; точка карты стоит на древнем холме. Куда он плыл и куда был послан вместо этого, рассказано в вопросе о миссии Ионы."
    - "Иоппия была гаванью задолго до Ионы. Египетские цари владели ею с XV века до н. э., и археологи нашли ворота их крепости; кедры для храма Соломона пригоняли «в плотах по морю в Яфу» и везли в Иерусалим, и вернувшиеся из плена доставляли лес так же — «по морю в Яфу». Корабль в Фарсис был большим морским торговым судном, вероятно финикийским, рассчитанным на дальний путь на запад; корабельщики «взывали каждый к своему богу, и стали бросать в море кладь с корабля», а Иона «спустился во внутренность корабля, лег и крепко заснул». Сама гавань была маленькой и открытой ветрам, и Иосиф Флавий описывает, как опасны были её скалы для кораблей."
    - "Спустя века Пётр «довольно дней пробыл» в Иоппии у Симона кожевника, «которого дом находится при море», и на его кровле увидел видение, пославшее его к римскому сотнику Корнилию в Кесарию, в 51 км вверх по побережью: пророка, бежавшего из Иоппии, лишь бы не проповедовать язычникам Ниневии, и апостола, вышедшего из Иоппии в дом язычника, часто ставят рядом — тем более что Иисус назвал Петра «Симон, сын Ионин». Иероним, описывая паломничество Павлы в 380-х годах, называет Иоппию пристанью, откуда бежал Иона. Карта берёт 780 г. до н. э. — точку в царствование Иеровоама II, при котором пророчествовал Иона."
  uk:
    - "У Яффі, нині Яффо, давньому порту на скелястому мисі на південному краю Тель-Авіва-Яффи: Йона, «дойшовши до Яфи, знайшов корабель, що йшов у Тарсис, заплатив гроші за переправу, й вступив на нього». Яффа була найближчим портом до гірської країни, приблизно за 55 км на північний захід від Єрусалиму по прямій і приблизно за 93 км на південний захід від дому Йони в Гат-Хефері в Галілеї; точка мапи стоїть на давньому пагорбі. Куди він ішов і куди його послали натомість, розповідається в питанні про місію Йони."
    - "Яффа була портом задовго до Йони. Єгипетські царі володіли нею з XV ст. до н. е., і археологи знайшли браму їхньої фортеці; кедр для Соломонового Храму привозили «в плотях морем до Яфи» й несли до Єрусалиму, і повернені вигнанці перевозили його так само «морем у Яфу». Корабель, що йшов у Тарсис, був великим морським торговим судном, імовірно фінікійським, збудованим для довгого рейсу на захід; моряки «почали взивати кожен до свого бога. І викидали в море склад із корабля», тоді як Йона зійшов у трюм і міцно спав. Сама гавань була малою й відкритою вітрам, і Йосиф Флавій описує, наскільки небезпечними для кораблів були її скелі."
    - "Століттями пізніше Петро пробув у Яффі «доволї днїв» у «одного Симона кожомяки (гарбаря)», «що хата його над морем», і на його даху побачив видіння, яке послало його до римського сотника Корнилія в Кесарії, за 51 км вгору узбережжям: пророка, що втік із Яффи, аби не проповідувати язичникам Ніневії, й апостола, що вийшов із Яффи до язичницького дому, часто ставлять поруч, тим паче що Ісус назвав Петра «Симоне, сину Йонин». Єронім, описуючи паломництво Павли в 380-х рр., називає Яффу портом втечі Йони. Мапа використовує 780 р. до н. е., точку в царюванні Єровоама II, за якого пророкував Йона."
  es:
    - "En Jope, la actual Jaffa, el viejo puerto sobre un promontorio rocoso en el extremo sur de Tel Aviv-Yafo: Jonás «descendió á Joppe; y halló un navío que partía para Tarsis; y pagando su pasaje entró en él». Jope era el puerto más cercano a la región montañosa, a unos 55 km al noroeste de Jerusalén en línea recta y a unos 93 km al suroeste de la patria de Jonás, Gat-hefer, en Galilea; el punto del mapa está sobre el tell antiguo. Adónde iba, y adónde fue enviado en cambio, se cuenta en la pregunta sobre la misión de Jonás."
    - "Jope era puerto mucho antes de Jonás. Los reyes egipcios la tuvieron desde el siglo XV a. C., y los excavadores han hallado la puerta de su fortaleza; el cedro para el Templo de Salomón fue traído «en balsas por la mar hasta Joppe» y llevado a Jerusalén, y los desterrados que regresaron lo trajeron del mismo modo «á la mar de Joppe». Un navío para Tarsis era un gran mercante de altura, probablemente fenicio, hecho para la larga travesía hacia el oeste; los marineros «cada uno llamaba á su dios: y echaron á la mar los enseres que había en la nave», mientras que Jonás había bajado a la bodega y dormía profundamente. El puerto mismo era pequeño y estaba abierto al viento, y Josefo describe lo peligrosas que eran sus rocas para los barcos."
    - "Siglos después, Pedro se quedó en Jope «muchos días» con Simón, un curtidor, «que tiene su casa junto á la mar», y en su azotea tuvo la visión que lo envió al centurión romano Cornelio en Cesarea, a 51 km costa arriba: el profeta que huyó de Jope en lugar de predicar a los gentiles de Nínive y el apóstol que salió de Jope hacia una casa gentil se ponen a menudo uno junto al otro, tanto más cuanto que Jesús llamó a Pedro «Simón, hijo de Jonás». Jerónimo, al describir la peregrinación de Paula en los años 380, nombra Jope como el puerto de la huida de Jonás. El mapa usa el 780 a. C., un punto del reinado de Jeroboam II, bajo el cual profetizó Jonás."
  pt:
    - "Em Jope, a Jafa de hoje, o velho porto num promontório rochoso no extremo sul de Tel Aviv-Yafo: Jonas “desceu a Jope e encontrou um navio que ia para Társis; então pagou a passagem e desceu para dentro dele”. Jope era o porto mais próximo dos montes, a cerca de 55 km a noroeste de Jerusalém em linha reta e a cerca de 93 km a sudoeste da terra de Jonas, Gate-Héfer, na Galileia; o ponto do mapa está no montículo antigo. Para onde ia, e para onde foi enviado em vez disso, conta-se na pergunta sobre a missão de Jonas."
    - "Jope era porto muito antes de Jonas. Reis egípcios a mantiveram desde o século XV a.C., e os escavadores acharam a porta de sua fortaleza; o cedro para o Templo de Salomão foi trazido “em jangadas pelo mar até Jope” e levado a Jerusalém, e os exilados que voltaram o trouxeram do mesmo modo “até o mar, para Jope”. Um navio para Társis era um grande mercante de alto-mar, provavelmente fenício, feito para a longa rota ao oeste; os marinheiros “cada um clamou ao seu deus. Eles lançaram a carga que estava no navio ao mar”, enquanto Jonas descera às partes mais profundas do navio e dormia profundamente. O próprio porto era pequeno e aberto ao vento, e Josefo descreve como seus rochedos eram perigosos para os navios."
    - "Séculos depois Pedro ficou em Jope “muitos dias” com um curtidor chamado Simão, “cuja casa fica à beira-mar”, e em seu terraço teve a visão que o enviou ao centurião romano Cornélio, em Cesareia, 51 km costa acima: o profeta que fugiu de Jope em vez de pregar aos gentios de Nínive e o apóstolo que saiu de Jope para uma casa gentia costumam ser postos lado a lado, ainda mais porque Jesus chamou Pedro de “Simão, filho de Jonas”. Jerônimo, ao descrever a peregrinação de Paula nos anos 380, nomeia Jope como o porto da fuga de Jonas. O mapa usa 780 a.C., um ponto do reinado de Jeroboão II, sob quem Jonas profetizou."
  de:
    - "In Joppe, dem heutigen Jaffa, dem alten Hafen auf einer felsigen Landzunge am Südrand von Tel Aviv-Jaffa: Jona „kam hinab gen Japho. Und da er ein Schiff fand, das gen Tharsis wollte fahren, gab er Fährgeld und trat hinein“. Joppe war der dem Bergland nächste Hafen, in der Luftlinie etwa 55 km nordwestlich von Jerusalem und etwa 93 km südwestlich von Jonas Heimat Gat-Hefer in Galiläa; der Kartenpunkt liegt auf dem antiken Hügel. Wohin er wollte und wohin er stattdessen gesandt wurde, steht in der Frage zu Jonas Sendung."
    - "Joppe war lange vor Jona ein Hafen. Ägyptische Könige hielten es seit dem 15. Jahrhundert v. Chr., und Ausgräber haben das Tor ihrer Festung gefunden; das Zedernholz für Salomos Tempel wurde „auf Flößen ... im Meer gen Japho“ gebracht und von dort nach Jerusalem hinaufgeschafft, und die heimgekehrten Verbannten brachten es auf demselben Weg „aufs Meer gen Japho“. Ein Schiff nach Tarsis war ein großer hochseetüchtiger Frachter, wohl phönizisch, für die lange Fahrt nach Westen gebaut; die Seeleute „schrieen, ein jeglicher zu seinem Gott, und warfen das Gerät, das im Schiff war, ins Meer“, während Jona in den Schiffsraum hinabgestiegen war und fest schlief. Der Hafen selbst war klein und dem Wind offen, und Josephus schildert, wie gefährlich seine Felsen für Schiffe waren."
    - "Jahrhunderte später blieb Petrus „lange Zeit zu Joppe ... bei einem Simon, der ein Gerber war“, „des Haus am Meer liegt“, und sah auf dessen Dach die Vision, die ihn zum römischen Hauptmann Kornelius nach Caesarea schickte, 51 km die Küste hinauf: Der Prophet, der aus Joppe floh, statt den Heiden von Ninive zu predigen, und der Apostel, der von Joppe zu einem heidnischen Haus ausging, werden oft nebeneinandergestellt, zumal Jesus Petrus „Simon, Jona's Sohn“ nannte. Hieronymus nennt in der Schilderung von Paulas Pilgerreise der 380er Jahre Joppe als Hafen von Jonas Flucht. Die Karte verwendet 780 v. Chr., einen Punkt in der Regierung Jerobeams II., unter dem Jona weissagte."
  fr:
    - "À Joppé, aujourd’hui Jaffa, l’ancien port sur un promontoire rocheux à la limite sud de Tel-Aviv-Jaffa : Jonas « descendit à Japho, et il trouva un navire qui allait à Tarsis ; il paya le prix du transport, et s’embarqua ». Joppé était le port le plus proche de la montagne, à environ 55 km au nord-ouest de Jérusalem en ligne droite et à environ 93 km au sud-ouest de Gath-Hépher, patrie de Jonas en Galilée ; le point de la carte est sur le tertre antique. Où il allait, et où il fut envoyé à la place, est raconté dans la question sur la mission de Jonas."
    - "Joppé était un port bien avant Jonas. Les rois d’Égypte la tenaient dès le XVe siècle av. J.-C., et les fouilleurs ont trouvé la porte de leur forteresse ; le cèdre du Temple de Salomon fut amené « par mer en radeaux jusqu’à Japho » et monté à Jérusalem, et les exilés revenus le firent venir de la même façon « par mer jusqu’à Japho ». Un navire pour Tarsis était un grand marchand de haute mer, probablement phénicien, fait pour la longue route vers l’ouest ; les mariniers « implorèrent chacun leur dieu, et ils jetèrent dans la mer les objets qui étaient sur le navire », tandis que Jonas était descendu au fond du navire et dormait profondément. Le port lui-même était petit et ouvert au vent, et Josèphe décrit le danger de ses rochers pour les navires."
    - "Des siècles plus tard, Pierre demeura à Joppé « quelque temps » chez Simon, un corroyeur, « dont la maison est près de la mer », et sur son toit eut la vision qui l’envoya chez le centurion romain Corneille, à Césarée, à 51 km plus haut sur la côte : le prophète qui fuit Joppé plutôt que de prêcher aux païens de Ninive et l’apôtre qui part de Joppé vers une maison païenne sont souvent rapprochés, d’autant que Jésus appela Pierre « Simon, fils de Jonas ». Jérôme, décrivant le pèlerinage de Paula dans les années 380, nomme Joppé comme le port de la fuite de Jonas. La carte retient 780 av. J.-C., un point du règne de Jéroboam II, sous lequel Jonas prophétisa."
  pl:
    - "W Jafie, starym porcie na skalistym przylądku na południowym skraju Tel Awiwu-Jafy: Jonasz „przyszedłszy do Joppen, znalazł okręt, który miał iść do Tarsu, a zapłaciwszy od niego wstąpił nań”. Jafa była najbliższym portem od strony gór, około 55 km na północny zachód od Jerozolimy w linii prostej i około 93 km na południowy zachód od rodzinnego Gat-Chefer Jonasza w Galilei; punkt na mapie stoi na starożytnym kopcu. Dokąd zmierzał i dokąd posłano go zamiast tego, opowiada pytanie o misję Jonasza."
    - "Jafa była portem na długo przed Jonaszem. Królowie egipscy trzymali ją od XV wieku p.n.e., a wykopaliska odsłoniły bramę ich fortecy; cedr do Świątyni Salomona sprowadzono „na tratwach po morzu do Joppy” i stamtąd wniesiono do Jerozolimy, a powracający wygnańcy sprowadzali go tak samo „do morza Joppy”. Okręt płynący do Tarszisz był dużym okrętem handlowym dalekiej żeglugi, prawdopodobnie fenickim, zbudowanym na długi rejs na zachód; żeglarze „wołali każdy do boga swego, a wyrzucali do morza to, co mieli na okręcie”, podczas gdy Jonasz zszedł do ładowni i spał twardo. Sam port był mały i otwarty na wiatr, a Józef Flawiusz opisuje, jak groźne dla okrętów były jego skały."
    - "Wieki później Piotr przebywał w Jafie „przez wiele dni” u Szymona garbarza, „który ma dom nad morzem”, i na jego dachu miał widzenie, które posłało go do rzymskiego setnika Korneliusza w Cezarei, 51 km dalej wzdłuż wybrzeża: prorok, który uciekł z Jafy, zamiast głosić poganom Niniwy, i apostoł, który z Jafy wyszedł do domu pogańskiego, są często stawiani obok siebie, tym bardziej że Jezus nazwał Piotra „Szymonie, synu Jonaszowy”, synem Jonasza. Hieronim, opisując pielgrzymkę Pauli z lat 80. IV wieku, wymienia Jafę jako port ucieczki Jonasza. Mapa używa 780 p.n.e., punktu w czasie panowania Jeroboama II, za którego Jonasz prorokował."
  it:
    - "A Giaffa, l’odierna Jaffa, l’antico porto su un promontorio roccioso al margine meridionale di Tel Aviv-Yafo: Giona «scese a Giaffa, dove trovò una nave che andava a Tarsis; e, pagato il prezzo del suo passaggio, s’imbarcò». Giaffa era il porto più vicino alle colline, a circa 55 km a nord-ovest di Gerusalemme in linea retta e a circa 93 km a sud-ovest della patria di Giona, Gat-Efer in Galilea; il punto della mappa sta sul tumulo antico. Dove andava, e dove fu invece mandato, è detto nella domanda sulla missione di Giona."
    - "Giaffa era un porto molto prima di Giona. I re egizi la tennero dal XV secolo a.C., e gli scavatori hanno trovato la porta della loro fortezza; il cedro per il Tempio di Salomone fu spedito «per mare su zattere fino a Jafo» e portato su a Gerusalemme, e gli esuli ritornati lo portarono per la stessa via, «per mare sino a Jafo». Una nave diretta a Tarsis era un grande mercantile d’alto mare, probabilmente fenicio, fatto per la lunga rotta verso occidente; i marinai: «ognuno gridò al suo dio e gettarono a mare le mercanzie ch’erano a bordo»; Giona intanto era sceso nel fondo della nave e dormiva profondamente. Il porto era piccolo e aperto al vento, e Giuseppe Flavio descrive quanto le sue rocce fossero pericolose per le navi."
    - "Secoli dopo Pietro rimase a Giaffa «molti giorni» da Simone, un conciatore, «che ha la casa presso al mare», e sul suo tetto ebbe la visione che lo mandò dal centurione romano Cornelio a Cesarea, 51 km più su lungo la costa: il profeta che fuggì da Giaffa piuttosto che predicare ai gentili di Ninive e l’apostolo che partì da Giaffa verso una casa gentile sono spesso accostati, tanto più che Gesù chiamò Pietro «Simone, figliuol di Giona». Girolamo, descrivendo il pellegrinaggio di Paola negli anni 380, nomina Giaffa come il porto della fuga di Giona. La mappa usa il 780 a.C., un punto nel regno di Geroboamo II, sotto il quale Giona profetizzò."
  nl:
    - "In Joppe, het huidige Jaffa, de oude haven op een rotsige landtong aan de zuidrand van Tel Aviv-Yafo: Jona “kwam af te Jafo, en vond een schip, gaande naar Tarsis, en hij gaf de vracht daarvan, en ging neder in hetzelve”. Joppe was de dichtstbijzijnde haven van het bergland, hemelsbreed ongeveer 55 km ten noordwesten van Jeruzalem en ongeveer 93 km ten zuidwesten van Jona’s woonplaats Gat-Chefer in Galilea; het punt op de kaart staat op de oude heuvel. Waarheen hij ging en waarheen hij in plaats daarvan werd gezonden, staat in de vraag over Jona’s zending."
    - "Joppe was al lang vóór Jona een haven. Egyptische koningen hielden haar vanaf de 15e eeuw v.Chr., en opgravers vonden de poort van hun vesting; het cederhout voor de tempel van Salomo werd “met vlotten, over de zee, naar Jafo” gebracht en naar Jeruzalem gevoerd, en de teruggekeerde ballingen brachten het op dezelfde wijze “aan de zee naar Jafo”. Een schip naar Tarsis was een groot zeegaand koopvaardijschip, waarschijnlijk Fenicisch, gebouwd voor de lange reis naar het westen; de zeelieden “riepen een iegelijk tot zijn god, en wierpen de vaten, die in het schip waren, in de zee”, terwijl Jona was afgedaald in het ruim en “lag neder, en was met een diepen slaap bevangen”. De haven zelf was klein en open voor de wind, en Josephus beschrijft hoe gevaarlijk haar rotsen voor schepen waren."
    - "Eeuwen later bleef Petrus “vele dagen te Joppe … bij een zekeren Simon, een lederbereider”, “die zijn huis heeft bij de zee”, en zag op het dak het visioen dat hem naar de Romeinse hoofdman Cornelius in Caesarea zond, 51 km verder langs de kust: de profeet die uit Joppe vluchtte in plaats van te prediken tot de heidenen van Nineve en de apostel die uit Joppe naar een heidens huis ging, worden vaak naast elkaar gezet, temeer omdat Jezus Petrus “Simon, Bar-Jona” noemde, zoon van Jona. Hiëronymus noemt, bij de beschrijving van Paula’s bedevaart in de jaren 380, Joppe als de haven van Jona’s vlucht. De kaart gebruikt 780 v.Chr., een punt in de regering van Jerobeam II, onder wie Jona profeteerde."
  cs:
    - "V Joppe, dnešní Jaffě, starém přístavu na skalnatém ostrohu na jižním okraji Tel Avivu-Jaffy: Jonáš „přišed do Joppe, našel lodí, ana jde do Tarsu, a zaplativ od ní, vstoupil na ni“. Joppe byla nejbližším přístavem k vrchovině, asi 55 km severozápadně od Jeruzaléma vzdušnou čarou a asi 93 km jihozápadně od Jonášova domova v Gat-chefer v Galileji; bod na mapě stojí na starověkém pahorku. Kam jel a kam byl poslán místo toho, vypráví otázka o Jonášově poslání."
    - "Joppe byla přístavem dávno před Jonášem. Egyptští králové ji drželi od 15. století př. n. l. a vykopavači našli bránu jejich pevnosti; cedry pro Šalomounův chrám byly dovezeny „v vořích po moři k Joppe“ a vyvezeny do Jeruzaléma a navrátilci z vyhnanství je dopravili stejnou cestou „k moři Joppen“. Loď do Taršíše byla velká námořní obchodní loď, pravděpodobně fénická, stavěná pro dlouhou plavbu na západ; plavci „volali jeden každý k bohu svému, a vyhazovali to, což měli na lodí, do moře“, zatímco Jonáš „byl sešel k bokům lodí, a položiv se, spal tvrdě“. Samotný přístav byl malý a otevřený větru a Josephus Flavius popisuje, jak nebezpečné byly jeho skály lodím."
    - "O staletí později Petr pobýval v Joppe „za mnohé dni“ u Šimona koželuha, „kterýž má dům u moře“, a na jeho střeše viděl vidění, které ho poslalo k římskému setníkovi Korneliovi do Cesareje, 51 km po pobřeží: prorok, který z Joppe utekl, aby nekázal pohanům v Ninive, a apoštol, který z Joppe vyšel do pohanského domu, se často kladou vedle sebe, tím spíše, že Ježíš nazval Petra „Šimone, synu Jonášův“. Jeroným, popisující Paulinu pouť v 380. letech, jmenuje Joppe jako přístav Jonášova útěku. Mapa užívá rok 780 př. n. l., bod ve vládě Jarobeáma II., za něhož Jonáš prorokoval."
  sv:
    - "I Joppe, dagens Jaffa, den gamla hamnen på en klippig udde i södra kanten av Tel Aviv-Yafo: Jona ”for ned till Jafo och fann där ett skepp som skulle gå till Tarsis. Och sedan han hade erlagt betalning för resan, steg han ombord därpå”. Joppe var den närmaste hamnen från bergslandet, omkring 55 km nordväst om Jerusalem fågelvägen och omkring 93 km sydväst om Jonas hemort Gat-Hefer i Galileen; kartpunkten står på den forntida kullen. Vart han skulle, och vart han sändes i stället, berättas i frågan om Jonas uppdrag."
    - "Joppe hade varit hamn långt före Jona. Egyptiska kungar höll det från 1400-talet f.Kr., och utgrävare har funnit porten till deras fästning; cedern till Salomos tempel fördes ”på havet till Jafo” och bars upp till Jerusalem, och de hemkomna bortförda förde den samma väg, ”sjöledes ... till Jafo”. Ett skepp på väg till Tarshish var en stor havsgående handelsfarkost, sannolikt fenicisk, byggd för den långa färden västerut; sjömännen ”ropade var och en till sin gud”, och ”vad löst som fanns i skeppet kastade de i havet”, medan Jona hade gått ned i det inre av fartyget och låg i djup sömn. Själva hamnen var liten och öppen för vinden, och Josefus beskriver hur farliga dess klippor var för fartyg."
    - "Århundraden senare bodde Petrus i Joppe ”en längre tid” hos garvaren Simon, ”som har ett hus vid havet”, och såg på dess tak synen som sände honom till den romerske hövitsmannen Cornelius i Caesarea, 51 km norrut längs kusten: profeten som flydde från Joppe i stället för att predika för hedningarna i Nineve och aposteln som gick ut från Joppe till ett hedniskt hus ställs ofta bredvid varandra, desto mer eftersom Jesus kallade Petrus ”Simon, Jonas’ son”. Hieronymus, som beskriver Paulas pilgrimsfärd på 380-talet, nämner Joppe som hamnen för Jonas flykt. Kartan använder 780 f.Kr., en punkt under Jerobeam II:s regering, då Jona profeterade."
  nb:
    - "I Jaffa, Bibelens Joppe, den gamle havnen på en klippeodde i den sørlige kanten av Tel Aviv-Jaffa: Jona «drog ned til Joppe og fant der et skib som skulde gå til Tarsis, og han betalte frakten og gikk ombord». Jaffa var havnen nærmest høylandet, omtrent 55 km nordvest for Jerusalem i luftlinje og omtrent 93 km sørvest for Jonas hjem Gat-Hefer i Galilea; kartpunktet står på den eldgamle haugen. Hvor han skulle, og hvor han i stedet ble sendt, fortelles i spørsmålet om Jonas oppdrag."
    - "Jaffa hadde vært havn lenge før Jona. Egyptiske konger holdt den fra 1400-tallet f.Kr., og utgraverne har funnet porten til festningen deres; sedertreet til Salomos tempel ble ført «i flåter på havet til Joppe» og båret opp til Jerusalem, og de hjemvendte bortførte førte det samme veien «sjøveien til Joppe». Et skip på vei til Tarsis var en stor havgående handelsbåt, trolig fønikisk, bygget for den lange ruten vestover; sjøfolkene «ropte hver til sin gud, og de kastet de ting som var i skibet, ut i havet», mens Jona hadde gått ned i skipets nederste rom og lå i dyp søvn. Selve havnen var liten og åpen for vinden, og Josefus beskriver hvor farlige klippene var for skip."
    - "Århundrer senere ble Peter i Jaffa «en lengere tid» hos Simon, en garver, «som har et hus ved havet», og så på taket synet som sendte ham til den romerske høvedsmannen Kornelius i Cæsarea, 51 km oppover kysten: profeten som flyktet fra Jaffa heller enn å forkynne for hedningene i Ninive, og apostelen som gikk ut fra Jaffa til et hedensk hus, stilles ofte side om side, særlig siden Jesus kalte Peter «Simon, Jonas' sønn». Hieronymus, som beskriver Paulas pilegrimsreise i 380-årene, nevner Jaffa som havnen for Jonas flukt. Kartet bruker 780 f.Kr., et punkt i Jeroboam IIs regjeringstid, under hvem Jona profeterte."
  tl:
    - "Sa Joppa, ngayo'y Jaffa, ang lumang daungan sa mabatong tangos sa timog na gilid ng Tel Aviv-Yafo: si Jonas ay “lumusong sa Joppe, at nakasumpong ng sasakyan na patungo sa Tarsis: sa gayo'y nagbayad siya ng upa niyaon, at siya'y lumulan”. Ang Joppa ang pinakamalapit na daungan sa kabundukan, mga 55 km sa hilagang-kanluran ng Jerusalem sa tuwid na guhit at mga 93 km sa timog-kanluran ng tahanan ni Jonas sa Gath-hepher sa Galilea; ang tuldok sa mapa ay nasa sinaunang burol. Ang pupuntahan niya at kung saan siya ipinadala sa halip ay isinasalaysay sa tanong tungkol sa misyon ni Jonas."
    - "Matagal nang daungan ang Joppa bago si Jonas. Hinawakan ito ng mga haring Egipcio mula sa ikalabinlimang siglo BK, at natagpuan ng mga humukay ang pintuan ng kanilang kuta; dinala ang sedro para sa Templo ni Salomon “sa mga balsa na idadaan sa dagat hanggang sa Joppe” at iniahon sa Jerusalem, at gayon din ito dinala ng mga bumalik na ipinatapon, “sa dagat, hanggang sa Joppa”. Ang barkong patungong Tharsis ay malaking barkong pangkalakal sa karagatan, marahil Fenicio, gawa para sa mahabang biyahe sa kanluran; “dumaing ang bawa't tao sa kanikaniyang dios; at kanilang inihagis sa dagat ang mga daladalahang nangasa sasakyan”, samantalang bumaba si Jonas sa loob ng barko at nahigang mahimbing na natutulog. Maliit ang daungan at bukas sa hangin, at inilalarawan ni Josephus kung gaano kapanganib ang mga bato nito sa mga barko."
    - "Makalipas ang mga siglo, nanatili si Pedro sa Joppa nang “maraming mga araw” kay Simon na mangluluto ng balat, “na ang kaniyang bahay ay nasa tabi ng dagat”, at sa bubong nito ay nakita ang pangitaing nagpadala sa kaniya sa senturyong Romano na si Cornelio sa Cesarea, 51 km pataas sa baybayin: ang propetang tumakas mula sa Joppa sa halip na mangaral sa mga hentil ng Ninive at ang apostol na lumabas mula sa Joppa patungo sa bahay ng hentil ay madalas pagtabihin, lalo na't tinawag ni Jesus si Pedro na “Simon Bar-Jonas”, anak ni Jonas. Pinangalanan ni Jeronimo, na naglalarawan sa peregrinasyon ni Paula noong dekada 380, ang Joppa bilang daungan ng pagtakas ni Jonas. Ginagamit ng mapa ang 780 BK, isang punto sa paghahari ni Jeroboam II, na sa ilalim niya nagpropesiya si Jonas."
  da:
    - "I Joppe, nutidens Jaffa, den gamle havn på en klippehalvø ved Tel Aviv-Yafos sydlige udkant: Jonas »drog ned til Jafo og fandt et Skib, som vilde fare til Tharsis, og han gav Fragt derfor og gik om Bord«. Joppe var den nærmeste havn til bjerglandet, omkring 55 km nordvest for Jerusalem i luftlinje og omkring 93 km sydvest for Jonas' hjem i Gat-Hefer i Galilæa; kortets punkt står på den antikke høj. Hvor han skulle hen, og hvor han i stedet blev sendt, fortælles i spørgsmålet om Jonas' mission."
    - "Joppe havde været havn længe før Jonas. Egyptiske konger holdt den fra 1400-tallet f.Kr., og udgravere har fundet porten til deres fæstning; cedertræet til Salomos tempel blev bragt »i Flaader paa Havet ned til Jafo« og ført op til Jerusalem, og de hjemvendte bortførte bragte det samme vej »til Havet imod Jafo«. Et skib på vej til Tarsis var et stort havgående handelsskib, sandsynligvis fønikisk, bygget til den lange tur mod vest; sømændene »raabte hver til sin Gud, og de kastede Redskaberne, som vare udi Skibet, i Havet«, mens Jonas var gået ned i skibsrummet og lå og sov tungt. Selve havnen var lille og åben for vinden, og Josefus beskriver, hvor farlige dens klipper var for skibe."
    - "Århundreder senere boede Peter »mange Dage« i Joppe hos Simon, en garver, »hvis Hus er ved Havet«, og så på dets tag synet, der sendte ham til den romerske høvedsmand Kornelius i Cæsarea, 51 km oppe ad kysten: profeten, der flygtede fra Joppe frem for at prædike for Ninives hedninger, og apostlen, der gik ud fra Joppe til et hedensk hus, stilles ofte side om side, så meget mere som Jesus kaldte Peter »Simon Jonas's Søn«. Hieronymus, der beskriver Paulas pilgrimsrejse i 380'erne, nævner Joppe som havnen for Jonas' flugt. Kortet bruger 780 f.Kr., et punkt i Jeroboam II's regering, under hvilken Jonas profeterede."
  sr:
    - "У Јопи, данашњој Јафи, старој луци на стеновитом рту на јужној ивици Тел Авив-Јафе: Јона је, како стоји, „сишав у Јопу нађе лађу која иђаше у Тарсис и платив возарину уђе у њу“. Јопа је била најближа лука брдском крају, око 55 км северозападно од Јерусалима правом линијом и око 93 км југозападно од Јонина завичаја Гетефера у Галилеји; тачка на карти стоји на древној хумци. Куда је ишао и куда је уместо тога послан, прича се у питању о Јонином послању."
    - "Јопа је била лука много пре Јоне. Египатски краљеви држали су је од 15. века п. н. е., а ископавачи су пронашли капију њихове тврђаве; кедровина за Соломунов Храм довезена је „у слаповима морем у Јопу“ и однета горе у Јерусалим, а повратници из изгнанства довезли су је истим путем „у море јопско“. Лађа за Тарсис била је велики прекоморски трговачки брод, вероватно феничански, начињен за дуг пут на запад; морнари су „призиваху сваки свог бога, и бацаху шта беше у лађи у море“, а Јона је био сишао на дно лађе и тврдо спавао. Сама лука била је мала и отворена ветру, а Јосиф Флавије описује колико су њене стене биле опасне за бродове."
    - "Векове касније Петар је остао у Јопи „много дана“ код Симона кожара, „ког је кућа код мора“, и на њеном крову видео визију која га је послала римском стотнику Корнилију у Цезареји, 51 км уз обалу: пророк који је побегао из Јопе уместо да проповеда незнабошцима Ниниве и апостол који је из Јопе отишао у незнабожачку кућу често се стављају један поред другог, утолико пре што је Исус назвао Петра „Симоне сине Јонин“. Јероним, описујући Паулино ходочашће из 380-их, помиње Јопу као луку Јонина бекства. Карта користи 780. п. н. е., тачку у владавини Јеровоама II, под којим је Јона пророковао."
