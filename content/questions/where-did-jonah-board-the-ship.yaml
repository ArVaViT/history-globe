id: where-did-jonah-board-the-ship
question:
  en: "Where did Jonah board the ship?"
  ru: "Где Иона сел на корабль?"
  uk: "Де Йона сів на корабель?"
  es: "¿Dónde embarcó Jonás?"
  pt: "Onde Jonas embarcou no navio?"
  de: "Wo ging Jona an Bord des Schiffes?"
  fr: "Où Jonas s’embarqua-t-il ?"
answer:
  en:
    - "At Joppa, today's Jaffa, the old port on a rocky headland at the southern edge of Tel Aviv-Yafo: Jonah “went down to Joppa; and he found a ship going to Tarshish: so he paid the fare thereof, and went down into it”. Joppa was the nearest port to the hill country, about 55 km north-west of Jerusalem in a straight line and about 93 km south-west of Jonah's home at Gath-hepher in Galilee; the map point stands on the ancient mound. Where he was going, and where he was sent instead, is told in the question on Jonah's mission."
    - "Joppa had been a port long before Jonah. Egyptian kings held it from the fifteenth century BC, and excavators have found the gate of their fortress; the cedar for Solomon's Temple was brought “in floats by sea to Joppa” and carried up to Jerusalem, and the returned exiles brought it the same way “to the sea of Joppa”. A ship bound for Tarshish was a large sea-going merchantman, probably Phoenician, made for the long run west; the sailors “cried every man unto his god, and cast forth the wares that were in the ship into the sea”, while Jonah had gone down into the hold and lay fast asleep. The harbour itself was small and open to the wind, and Josephus describes how dangerous its rocks were to ships."
    - "Centuries later Peter stayed at Joppa “many days” with Simon a tanner, “whose house is by the sea side”, and on its roof saw the vision that sent him to the Roman centurion Cornelius at Caesarea, 51 km up the coast: the prophet who fled from Joppa rather than preach to the gentiles of Nineveh and the apostle who went out from Joppa to a gentile house are often set side by side, the more so since Jesus called Peter “Simon Bar-jona”, son of Jonah. Jerome, describing Paula's pilgrimage of the 380s, names Joppa as the port of Jonah's flight. The map uses 780 BC, a point in the reign of Jeroboam II, under whom Jonah prophesied."
  ru:
    - "В Иоппии, нынешней Яффе, старой гавани на скалистом мысу у южного края Тель-Авива-Яффо: Иона «пришел в Иоппию, и нашел корабль, отправлявшийся в Фарсис, отдал плату за провоз и вошел в него». Иоппия была ближайшей гаванью для горной страны — примерно в 55 км к северо-западу от Иерусалима по прямой и в 93 км к юго-западу от родного Гафхефера Ионы в Галилее; точка карты стоит на древнем холме. Куда он плыл и куда был послан вместо этого, рассказано в вопросе о миссии Ионы."
    - "Иоппия была гаванью задолго до Ионы. Египетские цари владели ею с XV века до н. э., и археологи нашли ворота их крепости; кедры для храма Соломона пригоняли «в плотах по морю в Яфу» и везли в Иерусалим, и вернувшиеся из плена доставляли лес так же — «по морю в Яфу». Корабль в Фарсис был большим морским торговым судном, вероятно финикийским, рассчитанным на дальний путь на запад; корабельщики «взывали каждый к своему богу, и стали бросать в море кладь с корабля», а Иона «спустился во внутренность корабля, лег и крепко заснул». Сама гавань была маленькой и открытой ветрам, и Иосиф Флавий описывает, как опасны были её скалы для кораблей."
    - "Спустя века Пётр «довольно дней пробыл» в Иоппии у Симона кожевника, «которого дом находится при море», и на его кровле увидел видение, пославшее его к римскому сотнику Корнилию в Кесарию, в 51 км вверх по побережью: пророка, бежавшего из Иоппии, лишь бы не проповедовать язычникам Ниневии, и апостола, вышедшего из Иоппии в дом язычника, часто ставят рядом — тем более что Иисус назвал Петра «Симон, сын Ионин». Иероним, описывая паломничество Павлы в 380-х годах, называет Иоппию пристанью, откуда бежал Иона. Карта берёт 780 г. до н. э. — точку в царствование Иеровоама II, при котором пророчествовал Иона."
  uk:
    - "У Яффі, нині Яффо, давньому порту на скелястому мисі на південному краю Тель-Авіва-Яффи: Йона, «дойшовши до Яфи, знайшов корабель, що йшов у Тарсис, заплатив гроші за переправу, й вступив на нього». Яффа була найближчим портом до гірської країни, приблизно за 55 км на північний захід від Єрусалиму по прямій і приблизно за 93 км на південний захід від дому Йони в Гат-Хефері в Галілеї; точка мапи стоїть на давньому пагорбі. Куди він ішов і куди його послали натомість, розповідається в питанні про місію Йони."
    - "Яффа була портом задовго до Йони. Єгипетські царі володіли нею з XV ст. до н. е., і археологи знайшли браму їхньої фортеці; кедр для Соломонового Храму привозили «в плотях морем до Яфи» й несли до Єрусалиму, і повернені вигнанці перевозили його так само «морем у Яфу». Корабель, що йшов у Тарсис, був великим морським торговим судном, імовірно фінікійським, збудованим для довгого рейсу на захід; моряки «почали взивати кожен до свого бога. І викидали в море склад із корабля», тоді як Йона зійшов у трюм і міцно спав. Сама гавань була малою й відкритою вітрам, і Йосиф Флавій описує, наскільки небезпечними для кораблів були її скелі."
    - "Століттями пізніше Петро пробув у Яффі «доволї днїв» у «одного Симона кожомяки (гарбаря)», «що хата його над морем», і на його даху побачив видіння, яке послало його до римського сотника Корнилія в Кесарії, за 51 км вгору узбережжям: пророка, що втік із Яффи, аби не проповідувати язичникам Ніневії, й апостола, що вийшов із Яффи до язичницького дому, часто ставлять поруч, тим паче що Ісус назвав Петра «Симоне, сину Йонин». Єронім, описуючи паломництво Павли в 380-х рр., називає Яффу портом втечі Йони. Мапа використовує 780 р. до н. е., точку в царюванні Єровоама II, за якого пророкував Йона."
  es:
    - "En Jope, la actual Jaffa, el viejo puerto sobre un promontorio rocoso en el extremo sur de Tel Aviv-Yafo: Jonás «descendió á Joppe; y halló un navío que partía para Tarsis; y pagando su pasaje entró en él». Jope era el puerto más cercano a la región montañosa, a unos 55 km al noroeste de Jerusalén en línea recta y a unos 93 km al suroeste de la patria de Jonás, Gat-hefer, en Galilea; el punto del mapa está sobre el tell antiguo. Adónde iba, y adónde fue enviado en cambio, se cuenta en la pregunta sobre la misión de Jonás."
    - "Jope era puerto mucho antes de Jonás. Los reyes egipcios la tuvieron desde el siglo XV a. C., y los excavadores han hallado la puerta de su fortaleza; el cedro para el Templo de Salomón fue traído «en balsas por la mar hasta Joppe» y llevado a Jerusalén, y los desterrados que regresaron lo trajeron del mismo modo «á la mar de Joppe». Un navío para Tarsis era un gran mercante de altura, probablemente fenicio, hecho para la larga travesía hacia el oeste; los marineros «cada uno llamaba á su dios: y echaron á la mar los enseres que había en la nave», mientras que Jonás había bajado a la bodega y dormía profundamente. El puerto mismo era pequeño y estaba abierto al viento, y Josefo describe lo peligrosas que eran sus rocas para los barcos."
    - "Siglos después, Pedro se quedó en Jope «muchos días» con Simón, un curtidor, «que tiene su casa junto á la mar», y en su azotea tuvo la visión que lo envió al centurión romano Cornelio en Cesarea, a 51 km costa arriba: el profeta que huyó de Jope en lugar de predicar a los gentiles de Nínive y el apóstol que salió de Jope hacia una casa gentil se ponen a menudo uno junto al otro, tanto más cuanto que Jesús llamó a Pedro «Simón, hijo de Jonás». Jerónimo, al describir la peregrinación de Paula en los años 380, nombra Jope como el puerto de la huida de Jonás. El mapa usa el 780 a. C., un punto del reinado de Jeroboam II, bajo el cual profetizó Jonás."
  pt:
    - "Em Jope, a Jafa de hoje, o velho porto num promontório rochoso no extremo sul de Tel Aviv-Yafo: Jonas “desceu a Jope e encontrou um navio que ia para Társis; então pagou a passagem e desceu para dentro dele”. Jope era o porto mais próximo dos montes, a cerca de 55 km a noroeste de Jerusalém em linha reta e a cerca de 93 km a sudoeste da terra de Jonas, Gate-Héfer, na Galileia; o ponto do mapa está no montículo antigo. Para onde ia, e para onde foi enviado em vez disso, conta-se na pergunta sobre a missão de Jonas."
    - "Jope era porto muito antes de Jonas. Reis egípcios a mantiveram desde o século XV a.C., e os escavadores acharam a porta de sua fortaleza; o cedro para o Templo de Salomão foi trazido “em jangadas pelo mar até Jope” e levado a Jerusalém, e os exilados que voltaram o trouxeram do mesmo modo “até o mar, para Jope”. Um navio para Társis era um grande mercante de alto-mar, provavelmente fenício, feito para a longa rota ao oeste; os marinheiros “cada um clamou ao seu deus. Eles lançaram a carga que estava no navio ao mar”, enquanto Jonas descera às partes mais profundas do navio e dormia profundamente. O próprio porto era pequeno e aberto ao vento, e Josefo descreve como seus rochedos eram perigosos para os navios."
    - "Séculos depois Pedro ficou em Jope “muitos dias” com um curtidor chamado Simão, “cuja casa fica à beira-mar”, e em seu terraço teve a visão que o enviou ao centurião romano Cornélio, em Cesareia, 51 km costa acima: o profeta que fugiu de Jope em vez de pregar aos gentios de Nínive e o apóstolo que saiu de Jope para uma casa gentia costumam ser postos lado a lado, ainda mais porque Jesus chamou Pedro de “Simão, filho de Jonas”. Jerônimo, ao descrever a peregrinação de Paula nos anos 380, nomeia Jope como o porto da fuga de Jonas. O mapa usa 780 a.C., um ponto do reinado de Jeroboão II, sob quem Jonas profetizou."
  de:
    - "In Joppe, dem heutigen Jaffa, dem alten Hafen auf einer felsigen Landzunge am Südrand von Tel Aviv-Jaffa: Jona „kam hinab gen Japho. Und da er ein Schiff fand, das gen Tharsis wollte fahren, gab er Fährgeld und trat hinein“. Joppe war der dem Bergland nächste Hafen, in der Luftlinie etwa 55 km nordwestlich von Jerusalem und etwa 93 km südwestlich von Jonas Heimat Gat-Hefer in Galiläa; der Kartenpunkt liegt auf dem antiken Hügel. Wohin er wollte und wohin er stattdessen gesandt wurde, steht in der Frage zu Jonas Sendung."
    - "Joppe war lange vor Jona ein Hafen. Ägyptische Könige hielten es seit dem 15. Jahrhundert v. Chr., und Ausgräber haben das Tor ihrer Festung gefunden; das Zedernholz für Salomos Tempel wurde „auf Flößen ... im Meer gen Japho“ gebracht und von dort nach Jerusalem hinaufgeschafft, und die heimgekehrten Verbannten brachten es auf demselben Weg „aufs Meer gen Japho“. Ein Schiff nach Tarsis war ein großer hochseetüchtiger Frachter, wohl phönizisch, für die lange Fahrt nach Westen gebaut; die Seeleute „schrieen, ein jeglicher zu seinem Gott, und warfen das Gerät, das im Schiff war, ins Meer“, während Jona in den Schiffsraum hinabgestiegen war und fest schlief. Der Hafen selbst war klein und dem Wind offen, und Josephus schildert, wie gefährlich seine Felsen für Schiffe waren."
    - "Jahrhunderte später blieb Petrus „lange Zeit zu Joppe ... bei einem Simon, der ein Gerber war“, „des Haus am Meer liegt“, und sah auf dessen Dach die Vision, die ihn zum römischen Hauptmann Kornelius nach Caesarea schickte, 51 km die Küste hinauf: Der Prophet, der aus Joppe floh, statt den Heiden von Ninive zu predigen, und der Apostel, der von Joppe zu einem heidnischen Haus ausging, werden oft nebeneinandergestellt, zumal Jesus Petrus „Simon, Jona's Sohn“ nannte. Hieronymus nennt in der Schilderung von Paulas Pilgerreise der 380er Jahre Joppe als Hafen von Jonas Flucht. Die Karte verwendet 780 v. Chr., einen Punkt in der Regierung Jerobeams II., unter dem Jona weissagte."
  fr:
    - "À Joppé, aujourd’hui Jaffa, l’ancien port sur un promontoire rocheux à la limite sud de Tel-Aviv-Jaffa : Jonas « descendit à Japho, et il trouva un navire qui allait à Tarsis ; il paya le prix du transport, et s’embarqua ». Joppé était le port le plus proche de la montagne, à environ 55 km au nord-ouest de Jérusalem en ligne droite et à environ 93 km au sud-ouest de Gath-Hépher, patrie de Jonas en Galilée ; le point de la carte est sur le tertre antique. Où il allait, et où il fut envoyé à la place, est raconté dans la question sur la mission de Jonas."
    - "Joppé était un port bien avant Jonas. Les rois d’Égypte la tenaient dès le XVe siècle av. J.-C., et les fouilleurs ont trouvé la porte de leur forteresse ; le cèdre du Temple de Salomon fut amené « par mer en radeaux jusqu’à Japho » et monté à Jérusalem, et les exilés revenus le firent venir de la même façon « par mer jusqu’à Japho ». Un navire pour Tarsis était un grand marchand de haute mer, probablement phénicien, fait pour la longue route vers l’ouest ; les mariniers « implorèrent chacun leur dieu, et ils jetèrent dans la mer les objets qui étaient sur le navire », tandis que Jonas était descendu au fond du navire et dormait profondément. Le port lui-même était petit et ouvert au vent, et Josèphe décrit le danger de ses rochers pour les navires."
    - "Des siècles plus tard, Pierre demeura à Joppé « quelque temps » chez Simon, un corroyeur, « dont la maison est près de la mer », et sur son toit eut la vision qui l’envoya chez le centurion romain Corneille, à Césarée, à 51 km plus haut sur la côte : le prophète qui fuit Joppé plutôt que de prêcher aux païens de Ninive et l’apôtre qui part de Joppé vers une maison païenne sont souvent rapprochés, d’autant que Jésus appela Pierre « Simon, fils de Jonas ». Jérôme, décrivant le pèlerinage de Paula dans les années 380, nomme Joppé comme le port de la fuite de Jonas. La carte retient 780 av. J.-C., un point du règne de Jéroboam II, sous lequel Jonas prophétisa."
