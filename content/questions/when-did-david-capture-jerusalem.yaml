# Draft question (the date of the capture; the article "Jebus" covers the city's name and identity).
id: when-did-david-capture-jerusalem
question:
  en: "When did David capture Jerusalem?"
  ru: "Когда Давид взял Иерусалим?"
  uk: "Коли Давид здобув Єрусалим?"
  es: "¿Cuándo conquistó David Jerusalén?"
  pt: "Quando Davi conquistou Jerusalém?"
  de: "Wann eroberte David Jerusalem?"
  fr: "Quand David a-t-il pris Jérusalem ?"
  pl: "Kiedy Dawid zdobył Jerozolimę?"
  it: "Quando Davide conquistò Gerusalemme?"
  nl: "Wanneer veroverde David Jeruzalem?"
  cs: "Kdy David dobyl Jeruzalém?"
  sv: "När intog David Jerusalem?"
  nb: "Når inntok David Jerusalem?"
  tl: "Kailan kinuha ni David ang Jerusalem?"
  da: "Hvornår indtog David Jerusalem?"
  sr: "Када је Давид заузео Јерусалим?"
answer:
  en:
    - "About 1003 BC on the usual chronology: David was made king at Hebron about 1010 BC, reigned there seven years and six months, then took the Jebusite stronghold of Zion and made it his capital. The map uses c. 1003 BC; many writers round it to c. 1000 BC, and some scholars doubt that the Bible's round figures can be dated so closely. Hebron lies about 31 km south of Jerusalem in a straight line."
    - "“In Hebron he reigned over Judah seven years and six months: and in Jerusalem he reigned thirty and three years over all Israel and Judah.” Once all the tribes had anointed him, David marched on Jerusalem, a city that had stayed Canaanite between Judah and Benjamin: “the Jebusites dwell with the children of Judah at Jerusalem unto this day”. The Jebusites mocked that the blind and the lame could hold the walls, but “David took the strong hold of Zion: the same is the city of David”. Chronicles adds that Joab went up first and became chief; the Hebrew word tsinnor in David's order, rendered “gutter” in English Bibles and “spear” in the Russian, has long been read as a water shaft by which the city was entered. David then built “round about from Millo and inward”."
    - "The year is counted backward from the division of the kingdom about 931 BC: Solomon's forty years give about 970 for his accession, David's forty years about 1010, and the seven and a half years at Hebron bring the capture to about 1003 or 1002 BC; because the forty-year figures may be round, c. 1000 BC is common. The city David took was the ridge south of the Temple Mount now called the City of David, above the Gihon spring. Warren's Shaft, found in 1867, was long taken for the “gutter”, but Reich and Shukron's excavations concluded that the shaft was not opened until centuries later. In 2005 Eilat Mazar found the Large Stone Structure above the Stepped Stone Structure and called it David's palace; Finkelstein and others date the remains later and see a small town in David's day. The Tel Dan stele, found in 1993, names the “house of David” in the ninth century BC."
  ru:
    - "Около 1003 г. до н. э. по обычной хронологии: Давид был поставлен царём в Хевроне около 1010 г. до н. э., царствовал там семь лет и шесть месяцев, затем взял иевусейскую крепость Сион и сделал её своей столицей. Карта показывает условный 1003 г. до н. э.; многие округляют до 1000 г., а некоторые учёные сомневаются, что круглые числа Библии можно датировать так точно. Хеврон лежит примерно в 31 км к югу от Иерусалима по прямой."
    - "«В Хевроне царствовал над Иудою семь лет и шесть месяцев, и в Иерусалиме царствовал тридцать три года над всем Израилем и Иудою». Когда все колена помазали его, Давид пошёл на Иерусалим — город, остававшийся ханаанским между Иудой и Вениамином: «Иевусеи живут с сынами Иуды в Иерусалиме даже до сего дня». Иевусеи насмехались, что стены удержат и слепые с хромыми, «но Давид взял крепость Сион: это — город Давидов». Паралипоменон добавляет, что Иоав взошёл первым и стал военачальником; еврейское слово циннор в приказе Давида, переданное в Синодальном переводе как «копьё», а в английских Библиях как «водосток», давно читают как водяную шахту, через которую вошли в город. Затем Давид «обстроил кругом от Милло и внутри»."
    - "Год отсчитывают назад от разделения царства около 931 г. до н. э.: сорок лет Соломона дают около 970 г. для его воцарения, сорок лет Давида — около 1010-го, а семь с половиной лет в Хевроне приводят взятие города примерно к 1003 или 1002 г. до н. э.; поскольку сорокалетние числа могут быть круглыми, часто пишут «около 1000 г.». Город, взятый Давидом, — это гребень к югу от Храмовой горы, ныне Город Давида, над источником Гихон. Шахту Уоррена, открытую в 1867 году, долго считали тем самым «водостоком», но раскопки Райха и Шукрона показали, что шахта была открыта лишь столетия спустя. В 2005 году Эйлат Мазар нашла над Ступенчатой каменной структурой Большую каменную структуру и назвала её дворцом Давида; Финкельштейн и другие датируют остатки позже и видят во дни Давида небольшой городок. Стела из Тель-Дана, найденная в 1993 году, называет «дом Давида» в IX веке до н. э."
  uk:
    - "Близько 1003 р. до н. е. за звичною хронологією: Давида було оголошено царем у Хевроні близько 1010 р. до н. е., він царював там сім років і шість місяців, а потім узяв євусейську твердиню Сіон і зробив її своєю столицею. Мапа використовує близько 1003 р. до н. е.; багато авторів округлюють до близько 1000 р. до н. е., а деякі вчені сумніваються, що круглі біблійні цифри можна датувати так точно. Хеврон лежить приблизно за 31 км на південь від Єрусалиму по прямій."
    - "«У Гебронї царював над Юдою сїм год і шість місяцїв, а в Ерусалимі царював трийцять і три годи над усїм Ізраїлем і Юдою». Коли всі коліна помазали його, Давид рушив на Єрусалим, місто, що залишилося ханаанським між Юдою та Веніяміном: «от і живуть Евузії з синами Юди в Ерусалимі по сей день». Євусеї глузували, що мури можуть оборонити й сліпі та криві, але «Давид же зайняв приступом замок Сион, — се Давидове місто». Хроніки додають, що Йоав піднявся першим і став головою; єврейське слово цінор у Давидовому наказі, яке в англійських Бібліях передано як «жолоб», а в російській як «спис», здавна читали як водяну шахту, якою увійшли в місто. Тоді Давид збудував «навкруги, почавши від долини Милло, і з середини»."
    - "Рік відліковують назад від поділу царства близько 931 р. до н. е.: сорок років Соломона дають близько 970 для його вступу на престол, сорок років Давида — близько 1010, а сім з половиною років у Хевроні доводять взяття до близько 1003 чи 1002 р. до н. е.; бо сорокарічні цифри можуть бути круглими, поширеним є близько 1000 р. до н. е. Місто, яке взяв Давид, — це хребет на південь від Храмової гори, що нині зветься Містом Давида, над джерелом Гіхон. Шахту Воррена, знайдену 1867 року, довго вважали «жолобом», але розкопки Райха й Шукрона дійшли висновку, що шахту відкрили лише через століття. 2005 року Ейлат Мазар знайшла Велику кам'яну споруду над Ступінчастою кам'яною спорудою й назвала її палацом Давида; Фінкельштайн та інші датують рештки пізніше й бачать за днів Давида невелике містечко. Стела з Тель-Дана, знайдена 1993 року, називає «дім Давида» в IX ст. до н. е."
  es:
    - "Hacia el 1003 a. C. según la cronología habitual: David fue hecho rey en Hebrón hacia el 1010 a. C., reinó allí siete años y seis meses, y luego tomó la fortaleza jebusea de Sión y la hizo su capital. El mapa usa aproximadamente el 1003 a. C.; muchos autores lo redondean al 1000 a. C., y algunos estudiosos dudan de que las cifras redondas de la Biblia puedan fecharse con tanta precisión. Hebrón está a unos 31 km al sur de Jerusalén en línea recta."
    - "«En Hebrón reinó sobre Judá siete años y seis meses: y en Jerusalem reinó treinta y tres años sobre todo Israel y Judá». Cuando todas las tribus lo hubieron ungido, David marchó sobre Jerusalén, una ciudad que había permanecido cananea entre Judá y Benjamín: «antes quedó el Jebuseo en Jerusalem con los hijos de Judá, hasta hoy». Los jebuseos se burlaron de que los ciegos y los cojos podían defender los muros, pero «David tomó la fortaleza de Sión, la cual es la ciudad de David». Crónicas añade que Joab subió primero y fue hecho jefe; la palabra hebrea tsinnor en la orden de David, traducida «gutter» («canal») en las Biblias inglesas y «lanza» en la rusa, se ha leído desde hace tiempo como un pozo de agua por el que se entró en la ciudad. David edificó luego «alrededor, desde Millo para adentro»."
    - "El año se calcula hacia atrás desde la división del reino hacia el 931 a. C.: los cuarenta de Salomón dan hacia el 970 su ascenso, los de David hacia el 1010, y los siete años y medio en Hebrón la conquista hacia el 1003 o 1002 a. C.; como los cuarenta años pueden ser redondos, es corriente fechar hacia el 1000 a. C. La ciudad que tomó David era la loma al sur del monte del Templo, hoy Ciudad de David, sobre la fuente del Gihón. El pozo de Warren, hallado en 1867, se tuvo mucho tiempo por el «canal», pero la excavación de Reich y Shukron mostró que no se abrió hasta siglos después. En 2005 Eilat Mazar halló la Gran Estructura de Piedra sobre la Estructura de Piedra Escalonada y la llamó palacio de David; Finkelstein y otros fechan los restos más tarde y ven una pequeña población en su tiempo. La estela de Tel Dan, hallada en 1993, nombra la «casa de David» en el siglo IX a. C."
  pt:
    - "Por volta de 1003 a.C., pela cronologia usual: Davi foi feito rei em Hebrom por volta de 1010 a.C., reinou ali sete anos e seis meses, depois tomou a fortaleza jebusita de Sião e a fez sua capital. O mapa usa c. 1003 a.C.; muitos autores arredondam para c. 1000 a.C., e alguns estudiosos duvidam de que os números redondos da Bíblia possam ser datados com tanta precisão. Hebrom fica a cerca de 31 km ao sul de Jerusalém em linha reta."
    - "“Em Hebrom, ele reinou sobre Judá sete anos e seis meses, e em Jerusalém ele reinou trinta e três anos sobre todo o Israel e Judá.” Depois que todas as tribos o ungiram, Davi marchou sobre Jerusalém, cidade que permanecera cananeia entre Judá e Benjamim: “os jebuseus vivem com os filhos de Judá em Jerusalém até o dia de hoje”. Os jebuseus zombaram, dizendo que os cegos e os coxos bastariam para defender as muralhas, mas “Davi tomou a fortaleza de Sião. Esta é a cidade de Davi”. Crônicas acrescenta que Joabe subiu primeiro e foi feito chefe; a palavra hebraica tsinnor, na ordem de Davi, traduzida por “calha” nas Bíblias inglesas e por “lança” na russa, é lida há muito como um poço de água por onde se entrou na cidade. Davi então construiu “em redor, desde o Milo e para dentro”."
    - "O ano é contado de trás para a frente a partir da divisão do reino, por volta de 931 a.C.: os quarenta anos de Salomão dão cerca de 970 para sua subida ao trono, os de Davi cerca de 1010, e os sete anos e meio em Hebrom levam a conquista a cerca de 1003 ou 1002 a.C.; como os quarenta anos podem ser redondos, c. 1000 a.C. é comum. A cidade tomada por Davi foi a crista ao sul do monte do Templo, hoje Cidade de Davi, acima da fonte de Giom. O Poço de Warren, achado em 1867, foi tido por muito tempo como a “calha”, mas Reich e Shukron concluíram que só foi aberto séculos depois. Em 2005 Eilat Mazar encontrou a Grande Estrutura de Pedra acima da Estrutura de Pedra em Degraus e a chamou de palácio de Davi; Finkelstein e outros datam os restos mais tarde e veem uma vila no tempo de Davi. A estela de Tel Dã, achada em 1993, menciona a “casa de Davi” no século IX a.C."
  de:
    - "Um 1003 v. Chr. nach der üblichen Chronologie: David wurde um 1010 v. Chr. in Hebron zum König gemacht, regierte dort sieben Jahre und sechs Monate, nahm dann die jebusitische Burg Zion ein und machte sie zu seiner Hauptstadt. Die Karte verwendet etwa 1003 v. Chr.; viele runden auf etwa 1000 v. Chr., und manche Gelehrte bezweifeln, dass sich die runden Zahlen der Bibel so genau datieren lassen. Hebron liegt etwa 31 km südlich von Jerusalem in der Luftlinie."
    - "„Zu Hebron regierte er sieben Jahre und sechs Monate über Juda; aber zu Jerusalem regierte er dreiunddreißig Jahre über ganz Israel und Juda.“ Nachdem ihn alle Stämme gesalbt hatten, zog David gegen Jerusalem, eine Stadt, die zwischen Juda und Benjamin kanaanäisch geblieben war: „also blieben die Jebusiter mit den Kindern Juda zu Jerusalem bis auf diesen Tag“. Die Jebusiter höhnten, Blinde und Lahme könnten die Mauern halten, doch „David aber gewann die Burg Zion, das ist Davids Stadt“. Die Chronik fügt hinzu, dass Joab zuerst hinaufstieg und Hauptmann wurde; das hebräische Wort zinnor in Davids Befehl, im Englischen mit „gutter“ (Rinne), im Russischen mit „Speer“ wiedergegeben, wurde lange als Wasserschacht gelesen, durch den man in die Stadt gelangte. David baute dann „ringsumher von Millo an einwärts“."
    - "Das Jahr wird von der Reichsteilung um 931 v. Chr. rückwärts gezählt: Salomos vierzig Jahre ergeben etwa 970 für seinen Antritt, Davids vierzig Jahre etwa 1010, und die siebeneinhalb Jahre in Hebron legen die Eroberung auf etwa 1003 oder 1002 v. Chr.; weil die Vierzigjahreszahlen rund sein können, ist um 1000 v. Chr. üblich. Die Stadt, die David nahm, war der Rücken südlich des Tempelbergs, heute Stadt Davids genannt, über der Gihon-Quelle. Der 1867 gefundene Warren-Schacht galt lange als die „Rinne“, doch nach den Grabungen von Reich und Schukron wurde er erst Jahrhunderte später geöffnet. 2005 fand Eilat Mazar über der Stufensteinstruktur die Große Steinstruktur und nannte sie Davids Palast; Finkelstein und andere datieren die Reste später und sehen zu Davids Zeit eine kleine Stadt. Die 1993 gefundene Tel-Dan-Stele nennt das „Haus Davids“ im 9. Jahrhundert v. Chr."
  fr:
    - "Vers 1003 av. J.-C. selon la chronologie habituelle : David fut fait roi à Hébron vers 1010 av. J.-C., y régna sept ans et six mois, puis prit la forteresse jébusienne de Sion et en fit sa capitale. La carte retient vers 1003 av. J.-C. ; beaucoup d’auteurs arrondissent à vers 1000 av. J.-C., et certains savants doutent que les chiffres ronds de la Bible permettent une datation si précise. Hébron est à environ 31 km au sud de Jérusalem en ligne droite."
    - "« À Hébron il régna sur Juda sept ans et six mois, et à Jérusalem il régna trente-trois ans sur tout Israël et Juda. » Quand toutes les tribus l’eurent oint, David marcha sur Jérusalem, ville restée cananéenne entre Juda et Benjamin : « les Jébusiens ont habité avec les fils de Juda à Jérusalem jusqu’à ce jour ». Les Jébusiens raillaient : aveugles et boiteux suffiraient à tenir les murs, mais « David s’empara de la forteresse de Sion : c’est la cité de David ». Les Chroniques ajoutent que Joab monta le premier et devint chef ; le mot hébreu tsinnor, dans l’ordre de David, rendu par « gouttière » dans les Bibles anglaises et par « lance » dans la russe, a longtemps été lu comme un puits d’eau par lequel on entra dans la ville. David bâtit ensuite : « il fit de tous côtés des constructions, en dehors et en dedans de Millo »."
    - "On compte à rebours depuis la division du royaume, vers 931 av. J.-C. : quarante ans pour Salomon donnent vers 970 pour son avènement, quarante pour David vers 1010, et les sept ans et demi de Hébron placent la prise vers 1003 ou 1002 av. J.-C. ; les quarante ans pouvant être un chiffre rond, vers 1000 est courant. La ville prise par David est la crête au sud du mont du Temple, aujourd’hui la Cité de David, au-dessus de la source du Guihon. Le puits de Warren (1867) fut longtemps pris pour la « gouttière », mais Reich et Shukron ont conclu qu’il ne fut ouvert que des siècles plus tard. En 2005, Eilat Mazar trouva la Grande Structure en pierre au-dessus de la Structure en pierres à gradins et la dit palais de David ; Finkelstein et d’autres la datent plus tard et voient une petite bourgade. La stèle de Tel Dan (1993) nomme la « maison de David » au IXe siècle av. J.-C."
  pl:
    - "Około 1003 p.n.e. według zwykłej chronologii: Dawid został królem w Hebronie około 1010 p.n.e., panował tam siedem lat i sześć miesięcy, po czym zdobył jebusycką twierdzę Syjon i uczynił ją swoją stolicą. Mapa używa roku około 1003 p.n.e.; wielu autorów zaokrągla go do około 1000 p.n.e., a niektórzy uczeni wątpią, czy okrągłe liczby Biblii można datować tak dokładnie. Hebron leży około 31 km na południe od Jerozolimy w linii prostej."
    - "„W Hebronie królował nad Judą przez siedm lat i przez sześć miesięcy, a w Jeruzalemie królował przez trzydzieści i trzy lata nad wszystkim Izraelem i nad Judą.” Gdy wszystkie plemiona namaściły Dawida, ruszył on na Jerozolimę, miasto, które pozostało kananejskie między Judą a Beniaminem: „mieszkał Jebuzejczyk z syny Juda w Jeruzalemie aż do dnia tego”. Jebusyci szydzili, że mury utrzymają ślepi i chromi, ale „wziął Dawid zamek Syoński, a toć jest miasto Dawidowe”. Księgi Kronik dodają, że pierwszy wstąpił Joab i został wodzem; hebrajskie słowo cinnor w rozkazie Dawida, oddane w Biblii angielskiej słowem „rynna”, a w rosyjskiej „włócznia”, od dawna odczytuje się jako szyb wodny, którym wchodzono do miasta. Dawid zbudował następnie miasto „wszędy w koło od Mello, i wewnątrz”."
    - "Rok liczy się wstecz od podziału królestwa około 931 p.n.e.: czterdzieści lat Salomona daje około 970 na jego wstąpienie na tron, czterdzieści lat Dawida około 1010, a siedem i pół roku w Hebronie przesuwa zdobycie na około 1003 lub 1002 p.n.e.; ponieważ liczby czterdziestu lat mogą być okrągłe, powszechny jest rok około 1000 p.n.e. Miasto, które zdobył Dawid, było grzbietem na południe od Wzgórza Świątynnego, zwanym dziś Miastem Dawida, nad źródłem Gichon. Szyb Warrena, odkryty w 1867, od dawna uważano za „rynny”, ale wykopaliska Reicha i Shukrona wykazały, że szyb otwarto dopiero wieki później. W 2005 Eilat Mazar odkryła Wielką Strukturę Kamienną nad Schodkową Strukturą Kamienną i nazwała ją pałacem Dawida; Finkelstein i inni datują pozostałości później i widzą w czasach Dawida małe miasto. Stela z Tel Dan, znaleziona w 1993, wymienia „dom Dawida” w IX wieku p.n.e."
  it:
    - "Circa il 1003 a.C. secondo la cronologia abituale: Davide fu fatto re a Ebron intorno al 1010 a.C., vi regnò sette anni e sei mesi, poi prese la fortezza gebusea di Sion e ne fece la sua capitale. La mappa usa il 1003 a.C. circa; molti autori arrotondano al 1000 a.C. circa, e alcuni studiosi dubitano che le cifre tonde della Bibbia si possano datare con tanta precisione. Ebron dista circa 31 km a sud di Gerusalemme in linea retta."
    - "«A Hebron regnò su Giuda sette anni e sei mesi; e a Gerusalemme regnò trentatre anni su tutto Israele e Giuda». Dopo che tutte le tribù lo ebbero unto, Davide marciò su Gerusalemme, una città rimasta cananea tra Giuda e Beniamino: «i Gebusei hanno abitato coi figliuoli di Giuda in Gerusalemme fino al dì d’oggi». I Gebusei schernirono dicendo che i ciechi e gli zoppi avrebbero potuto tenere le mura, ma «Davide prese la fortezza di Sion, che è la città di Davide». Le Cronache aggiungono che Ioab salì per primo e fu fatto capo; la parola ebraica tsinnor nell’ordine di Davide, resa «gutter» nelle Bibbie inglesi e «lancia» in quella russa, è da tempo letta come un pozzo d’acqua attraverso cui si entrò in città. Davide poi «vi fece attorno delle costruzioni cominciando da Millo, e nell’interno»."
    - "L’anno si conta a ritroso dalla divisione del regno, circa il 931 a.C.: i quarant’anni di Salomone danno circa il 970 per la sua ascesa, quelli di Davide circa il 1010, e i sette anni e mezzo a Ebron portano la presa a circa il 1003 o 1002 a.C.; poiché le cifre di quarant’anni possono essere tonde, è comune il 1000 a.C. circa. La città presa da Davide era il crinale a sud del Monte del Tempio, oggi detto Città di Davide, sopra la sorgente del Ghicon. Il Pozzo di Warren, scoperto nel 1867, fu a lungo ritenuto il «gutter», ma Reich e Shukron hanno concluso che fu aperto solo secoli dopo. Nel 2005 Eilat Mazar trovò la Grande Struttura di Pietra sopra la Struttura a Gradoni di Pietra e la chiamò palazzo di Davide; Finkelstein e altri datano i resti più tardi e vedono una piccola città. La stele di Tel Dan, trovata nel 1993, nomina la «casa di Davide» nel IX secolo a.C."
  nl:
    - "Omstreeks 1003 v.Chr. volgens de gebruikelijke chronologie: David werd omstreeks 1010 v.Chr. in Hebron koning, regeerde daar zeven jaar en zes maanden, nam toen de Jebusitische vesting Sion in en maakte haar tot zijn hoofdstad. De kaart gebruikt ca. 1003 v.Chr.; veel auteurs ronden af op ca. 1000 v.Chr., en sommige geleerden betwijfelen of de ronde getallen van de Bijbel zo nauwkeurig te dateren zijn. Hebron ligt hemelsbreed ongeveer 31 km ten zuiden van Jeruzalem."
    - "“Te Hebron regeerde hij over Juda zeven jaren en zes maanden; en te Jeruzalem regeerde hij drie en dertig jaren over gans Israel en Juda.” Toen alle stammen hem hadden gezalfd, trok David op Jeruzalem af, een stad die tussen Juda en Benjamin Kanaänitisch was gebleven: “alzo woonden de Jebusieten bij de kinderen van Juda te Jeruzalem, tot dezen dag toe”. De Jebusieten spotten dat de blinden en kreupelen de muren konden verdedigen, maar “David nam den burg Sion in; dezelve is de stad Davids”. Kronieken voegt eraan toe dat Joab het eerst opklom en hoofd werd; het Hebreeuwse woord tsinnor in Davids bevel, in Engelse bijbels weergegeven als “goot” en in de Russische als “spies”, is lang opgevat als een waterschacht waardoor de stad werd binnengedrongen. David bouwde daarna “rondom van Millo af en binnenwaarts”."
    - "Het jaar wordt teruggerekend vanaf de deling van het koninkrijk omstreeks 931 v.Chr.: Salomo’s veertig jaar geven ongeveer 970 voor zijn troonsbestijging, Davids veertig jaar ongeveer 1010, en de zeven en een half jaar in Hebron brengen de verovering op ongeveer 1003 of 1002 v.Chr.; omdat de veertig jaar rond kunnen zijn, is ca. 1000 v.Chr. gangbaar. De stad die David innam, was de rug ten zuiden van de Tempelberg, nu Stad van David, boven de bron Gihon. De Warrenschacht, in 1867 gevonden, gold lang als de “goot”, maar Reich en Shukron concludeerden dat de schacht pas eeuwen later werd geopend. In 2005 vond Eilat Mazar de Grote Steenstructuur boven de Getrapte Steenstructuur en noemde haar Davids paleis; Finkelstein en anderen dateren de resten later en zien in Davids tijd een stadje. De stèle van Tel Dan (1993) noemt het “huis van David” in de 9e eeuw v.Chr."
  cs:
    - "Asi 1003 př. n. l. podle obvyklé chronologie: Davida učinili králem v Hebronu asi 1010 př. n. l., kraloval tam sedm let a šest měsíců, pak dobyl jebusejskou pevnost Sijón a učinil z ní své hlavní město. Mapa užívá asi 1003 př. n. l.; mnozí autoři zaokrouhlují na asi 1000 př. n. l. a někteří badatelé pochybují, že lze kulatá čísla Bible datovat tak přesně. Hebron leží asi 31 km jižně od Jeruzaléma vzdušnou čarou."
    - "„V Hebronu kraloval nad Judou sedm let a šest měsíců, a v Jeruzalémě kraloval třidceti a tři léta nade vším Izraelem a Judou.“ Když ho všechny kmeny pomazaly, David vytáhl na Jeruzalém, město, které zůstalo kanaánské mezi Judou a Benjamínem: „bydlil Jebuzejský s syny Judskými v Jeruzalémě až do tohoto dne“. Jebusejští se posmívali, že hradby udrží slepí a kulhaví, ale „vzal David hrad Sion, toť jest město Davidovo“. Letopisy dodávají, že Joáb vystoupil první a stal se předním; hebrejské slovo cinnór v Davidově rozkazu, v anglických biblích přeložené „žlab“ a v ruské „kopí“, se dávno čte jako vodní šachta, kterou se do města vstoupilo. David pak stavěl „vůkol od Mello až do vnitřku“."
    - "Rok se počítá zpětně od rozdělení království kolem 931 př. n. l.: Šalomounových čtyřicet let dává pro nástup asi 970, Davidových čtyřicet let asi 1010 a sedm a půl roku v Hebronu přenáší dobytí na asi 1003 nebo 1002 př. n. l.; protože čtyřicetileté údaje mohou být kulaté, užívá se běžně asi 1000 př. n. l. Město, které David dobyl, bylo návrší jižně od Chrámové hory, dnes zvané Město Davidovo, nad pramenem Gichón. Warrenova šachta, objevená roku 1867, se dlouho pokládala za „žlab“, ale vykopávky Reicha a Šukrona dospěly k závěru, že šachta byla otevřena až o staletí později. Roku 2005 Eilat Mazar nalezla Velkou kamennou stavbu nad Stupňovitou kamennou stavbou a nazvala ji Davidovým palácem; Finkelstein a jiní kladou nálezy později a vidí za Davidových dnů malé městečko. Stéla z Tel Danu, nalezená roku 1993, jmenuje „dům Davidův“ v 9. století př. n. l."
  sv:
    - "Omkring 1003 f.Kr. enligt den vanliga kronologin: David blev kung i Hebron omkring 1010 f.Kr., regerade där i sju år och sex månader, intog sedan den jebusitiska borgen Sion och gjorde den till sin huvudstad. Kartan använder omkring 1003 f.Kr.; många skribenter avrundar det till omkring 1000 f.Kr., och vissa forskare betvivlar att Bibelns runda tal kan dateras så noga. Hebron ligger omkring 31 km söder om Jerusalem fågelvägen."
    - "”I Hebron regerade han över Juda i sju år och sex månader, och i Jerusalem regerade han i trettiotre år över hela Israel och Juda.” När alla stammar hade smort honom tågade David mot Jerusalem, en stad som hade förblivit kananeisk mellan Juda och Benjamin: jebuséerna ”bodde kvar bland Juda barn i Jerusalem, såsom de göra ännu i dag”. Jebuséerna hånade att de blinda och halta kunde hålla murarna, men ”David intog likväl Sions borg, det är Davids stad”. Krönikeböckerna tillägger att Joav gick först upp och blev hövding; det hebreiska ordet tsinnor i Davids befallning, återgivet som ”gutter” i engelska biblar och som ”spjut” i den ryska, har länge lästs som ett vattenschakt genom vilken staden intogs. David uppförde sedan byggnader ”runt omkring, från Millo och vidare inåt”."
    - "Året räknas bakåt från rikets delning omkring 931 f.Kr.: Salomos fyrtio år ger omkring 970 för hans tronbestigning, Davids fyrtio år omkring 1010, och de sju och ett halvt åren i Hebron för erövringen till omkring 1003 eller 1002 f.Kr.; eftersom fyrtioårsangivelserna kan vara runda är omkring 1000 f.Kr. vanligt. Staden som David intog var åsen söder om Tempelberget som nu kallas Davids stad, ovanför källan Gihon. Warrens schakt, funnet 1867, ansågs länge vara ”gutter”, men Reichs och Shukrons utgrävningar kom fram till att schaktet inte öppnades förrän århundraden senare. År 2005 fann Eilat Mazar Den stora stenbyggnaden ovanför Den trappstegsformade stenkonstruktionen och kallade den Davids palats; Finkelstein och andra daterar resterna senare och ser en liten stad på Davids tid. Stelen från Tel Dan, funnen 1993, nämner ”Davids hus” på 800-talet f.Kr."
  nb:
    - "Omkring 1003 f.Kr. etter den vanlige kronologien: David ble gjort til konge i Hebron omkring 1010 f.Kr., regjerte der i sju år og seks måneder, og tok så jebusittenes festning Sion og gjorde den til sin hovedstad. Kartet bruker ca. 1003 f.Kr.; mange forfattere runder av til ca. 1000 f.Kr., og noen forskere tviler på at Bibelens runde tall kan dateres så nøyaktig. Hebron ligger omtrent 31 km sør for Jerusalem i luftlinje."
    - "«I Hebron regjerte han over Juda i syv år og seks måneder, og i Jerusalem regjerte han i tre og tretti år over hele Israel og Juda.» Da alle stammene hadde salvet ham, marsjerte David mot Jerusalem, en by som hadde forblitt kanaanittisk mellom Juda og Benjamin: «jebusittene blev boende sammen med Judas barn i Jerusalem og der bor de den dag idag». Jebusittene hånte at de blinde og lamme kunne holde murene, men «David inntok allikevel Sions borg, det er Davids stad». Krønikebøkene tilføyer at Joab steg først opp og ble høvding; det hebraiske ordet tsinnor i Davids ordre, gjengitt «gutter» i engelske bibler og «spyd» i den russiske, har lenge vært lest som en vannsjakt som byen ble gått inn gjennom. David bygget så «rundt omkring fra Milo og innover»."
    - "Året regnes bakover fra rikets deling omkring 931 f.Kr.: Salomos førti år gir omkring 970 for hans tronbestigelse, Davids førti år omkring 1010, og de sju og et halvt årene i Hebron bringer inntaket til omkring 1003 eller 1002 f.Kr.; fordi tallene på førti år kan være runde, er ca. 1000 f.Kr. vanlig. Byen David tok, var ryggen sør for Tempelhøyden som nå kalles Davidsbyen, over kilden Gihon. Warrens sjakt, funnet i 1867, ble lenge ansett som «gutter», men Reichs og Shukrons utgravinger konkluderte med at sjakten ikke ble åpnet før flere århundrer senere. I 2005 fant Eilat Mazar Den store steinstrukturen over Trappestrukturen i stein og kalte den Davids palass; Finkelstein og andre datere restene senere og ser en liten by i Davids dager. Tel Dan-stelen, funnet i 1993, nevner «Davids hus» på 800-tallet f.Kr."
  tl:
    - "Mga 1003 BK ayon sa karaniwang kronolohiya: ginawang hari si David sa Hebron noong mga 1010 BK, naghari roon ng pitong taon at anim na buwan, pagkatapos ay kinuha ang kutang Jebuseo ng Sion at ginawa itong kabisera. Ginagamit ng mapa ang c. 1003 BK; binibilog ito ng marami sa c. 1000 BK, at pinagdududahan ng ilang iskolar na maitatakda nang gayon kalapit ang bilog na mga bilang ng Biblia. Ang Hebron ay nasa mga 31 km sa timog ng Jerusalem sa tuwid na guhit."
    - "“Sa Hebron ay naghari siya sa Juda na pitong taon at anim na buwan: at sa Jerusalem ay naghari siya na tatlong pu at tatlong taon sa buong Israel at Juda.” Nang pahiran na siya ng lahat ng lipi, nagmartsa si David sa Jerusalem, isang lungsod na nanatiling Cananeo sa pagitan ng Juda at Benjamin: “ang mga Jebuseo ay nanahang kasama ng mga anak ni Juda sa Jerusalem hanggang sa araw na ito”. Tinuya ng mga Jebuseo na ang bulag at pilay ang makapipigil sa mga pader, ngunit “sinakop ni David ang katibayan sa Sion; na siyang bayan ni David”. Idinaragdag ng Mga Cronica na umakyat muna si Joab at naging pinuno; ang salitang Hebreo na tsinnor sa utos ni David, isinasalin na “kanal” sa mga Biblia sa Ingles at “sibat” sa Ruso, ay matagal nang binabasa bilang daluyan ng tubig na pinasukan sa lungsod. Pagkatapos ay itinayo ni David ang kuta “sa palibot mula sa Millo, at sa loob”."
    - "Binibilang pabalik mula sa paghahati ng kaharian noong mga 931 BK: ang 40 taon ni Salomon: mga 970 ang pag-akyat niya; kay David: mga 1010; 7½ taon sa Hebron: pagkuha sa mga 1003 o 1002 BK; maaaring bilog ang 40, kaya karaniwan ang c. 1000 BK. Ang kinuha ni David ay ang tagaytay sa timog ng Bundok ng Templo (ang Bayan ni David ngayon) sa itaas ng bukal ng Gihon. Ang Dalirot ni Warren (1867) ay matagal na itinuring na “kanal”, ngunit napagpasyahan nina Reich at Shukron na binuksan ito makalipas ang mga siglo. Noong 2005, nakita ni Eilat Mazar ang Malaking Istrukturang Bato sa itaas ng Hagdang-hagdang Istrukturang Bato at tinawag itong palasyo ni David; ayon kay Finkelstein at iba pa, mas huli ang mga labi at maliit na bayan lamang noong panahon ni David. Ang estela ng Tel Dan (1993) ay may “sangbahayan ni David” noong ika-9 na siglo BK."
  da:
    - "Omkring 1003 f.Kr. efter den sædvanlige kronologi: David blev gjort til konge i Hebron omkring 1010 f.Kr., regerede der i syv år og seks måneder, indtog derefter jebusiternes fæstning Zion og gjorde den til sin hovedstad. Kortet bruger ca. 1003 f.Kr.; mange forfattere runder af til ca. 1000 f.Kr., og nogle forskere betvivler, at Bibelens runde tal kan dateres så nøjagtigt. Hebron ligger omkring 31 km syd for Jerusalem i luftlinje."
    - "»Han regerede i Hebron over Juda syv Aar og seks Maaneder og regerede i Jerusalem i tre og tredive Aar over hele Israel og Juda.« Da alle stammerne havde salvet ham, drog David mod Jerusalem, en by, der var forblevet kana'anæisk mellem Juda og Benjamin: »saa boede Jebusiterne tillige med Judas Børn i Jerusalem indtil denne Dag«. Jebusiterne hånede, at de blinde og de lamme kunne holde murene, men »David indtog Zions Befæstning, det er Davids Stad«. Krønikebøgerne tilføjer, at Joab gik først op og blev høvding; det hebraiske ord tsinnor i Davids ordre, gengivet »gutter« i engelske bibler og »spyd« i den russiske, er længe blevet læst som en vandskakt, ad hvilken byen blev indtaget. David byggede derefter »trindt omkring fra Millo af og indadtil«."
    - "Året regnes baglæns fra rigets deling omkring 931 f.Kr.: Salomos fyrre år giver omkring 970 for hans tronbestigelse, Davids fyrre år omkring 1010, og de syv et halvt år i Hebron fører indtagelsen til omkring 1003 eller 1002 f.Kr.; da fyrre-årstallene kan være runde, er ca. 1000 f.Kr. almindeligt. Den by, David indtog, var højderyggen syd for Tempelbjerget, nu kaldet Davidsbyen, over Gihon-kilden. Warrens skakt, fundet i 1867, blev længe anset for »Vandrenden«, men Reichs og Shukrons udgravninger konkluderede, at skakten først blev åbnet århundreder senere. I 2005 fandt Eilat Mazar den Store Stenstruktur over den Trinformede Stenstruktur og kaldte den Davids palads; Finkelstein og andre dater resterne senere og ser en lille by i Davids dage. Tel Dan-stelen, fundet i 1993, nævner »Davids hus« i 800-tallet f.Kr."
  sr:
    - "Око 1003. п. н. е. по уобичајеној хронологији: Давид је постао краљ у Хеврону око 1010. п. н. е., ту је владао седам година и шест месеци, затим је заузео јевусејско утврђење Сион и учинио га својом престоницом. Карта користи око 1003. п. н. е.; многи писци заокружују на око 1000. п. н. е., а неки научници сумњају да се округле бројке из Библије могу тако тачно датирати. Хеврон лежи око 31 км јужно од Јерусалима правом линијом."
    - "„У Хеврону царова над Јудом седам година и шест месеци; а у Јерусалиму царова тридесет и три године над свим Израиљем и Јудом.“ Пошто су га сва племена помазала, Давид је кренуо на Јерусалим, град који је остао хананејски између Јуде и Венијамина: „осташе Јевусеји са синовима Јудиним у Јерусалиму до данас“. Јевусеји су се ругали да зидове могу држати слепи и хроми, али „Давид узе кулу Сион, то је град Давидов“. Дневници додају да је Јоав први изашао и постао поглавар; хебрејска реч цинор у Давидовој наредби, у енглеским Библијама преведена као „олук“, а у руској као „копље“, одавно се чита као водено окно кроз које је град заузет. Давид је затим градио „унаоколо од Милона и унутра“."
    - "Година се рачуна уназад од поделе краљевства око 931. п. н. е.: Соломунових четрдесет година даје око 970. за његово ступање на престо, Давидових четрдесет око 1010, а седам и по година у Хеврону доводе заузимање на око 1003. или 1002. п. н. е.; пошто четрдесетогодишње бројке могу бити округле, уобичајено је око 1000. п. н. е. Град који је Давид заузео био је гребен јужно од Храмовне горе, који се данас зове Давидов град, изнад извора Гион. Воренов шахт, пронађен 1867, дуго је сматран „олуком“, али су ископавања Рајха и Шукрона закључила да шахт није отворен до векова касније. Године 2005. Елат Мазар пронашла је Велику камену грађевину изнад Степенасте камене грађевине и назвала је Давидовом палатом; Финкелштајн и други датирају остатке касније и виде мали градић у Давидово време. Стела из Тел Дана, пронађена 1993, помиње „дом Давидов“ у 9. веку п. н. е."
