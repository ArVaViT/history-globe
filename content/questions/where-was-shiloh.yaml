id: where-was-shiloh
question:
  en: "Where was Shiloh?"
  ru: "Где находился Силом?"
  uk: "Де було Шіло?"
  es: "¿Dónde estaba Silo?"
  pt: "Onde ficava Siló?"
  de: "Wo lag Silo?"
  fr: "Où se trouvait Silo ?"
answer:
  en:
    - "Shiloh lay in the hill country of Ephraim at Khirbet Seilun, in today's West Bank, about 30 km north of Jerusalem in a straight line, 15 km north of Bethel and about 18 km south of Shechem. The identification is secure: Judges places Shiloh north of Bethel, east of the highway from Bethel to Shechem and south of Lebonah, and the ruin fits."
    - 'After the conquest "the whole congregation of the children of Israel assembled together at Shiloh, and set up the tabernacle of the congregation there", and Joshua cast lots there for the remaining tribes. Elkanah and Hannah came up to worship when Eli and his sons were priests, Hannah brought the child Samuel to the house of the LORD, and "the LORD appeared again in Shiloh: for the LORD revealed himself to Samuel in Shiloh". The ark was carried from Shiloh into battle against the Philistines and captured, and Eli died at the news. Jeremiah later warned Jerusalem with its fate: "go ye now unto my place which was in Shiloh".'
    - "A Danish expedition dug here in 1926–1932 and Israel Finkelstein in 1981–1984. In the Middle Bronze Age Shiloh was a walled town; a dump of offering vessels from the Late Bronze Age suggests a sanctuary before Israel's time. Israelite pillared buildings with storage jars were burnt in a destruction that radiocarbon dates to the second half of the eleventh century BC; many link it to the Philistine victory, but the Bible does not describe Shiloh's fall. Eusebius placed the village twelve miles from Neapolis, and Byzantine churches with mosaic floors have been uncovered there."
  ru:
    - "Силом стоял на горе Ефремовой, на месте Хирбет-Сейлун на нынешнем Западном берегу, примерно в 30 км к северу от Иерусалима по прямой, в 15 км к северу от Вефиля и примерно в 18 км к югу от Сихема. Отождествление надёжно: Книга Судей помещает Силом на север от Вефиля, на восток от дороги из Вефиля в Сихем и на юг от Левоны, и городище этому соответствует."
    - "После завоевания «все общество сынов Израилевых собралось в Силом, и поставили там скинию собрания», и Иисус Навин бросил здесь жребий для остальных колен. Сюда приходили поклониться Елкана и Анна, когда священниками были Илий и его сыновья; Анна привела отрока Самуила в дом Господень, и «продолжал Господь являться в Силоме после того, как открыл Себя Самуилу в Силоме». Ковчег взяли из Силома на битву с филистимлянами, и он был захвачен, а Илий, услышав об этом, умер. Позже Иеремия предостерегал Иерусалим его участью: «Пойдите же на место Мое в Силом»."
    - "В 1926–1932 годах здесь копала датская экспедиция, в 1981–1984 годах — Израэль Финкельштейн. В среднем бронзовом веке Силом был городом со стеной; свалка жертвенной посуды позднего бронзового века говорит о святилище ещё до Израиля. Израильские здания со столбами и сосудами для запасов сгорели при разрушении, которое радиоуглерод датирует второй половиной XI века до н. э.; многие связывают его с победой филистимлян, но Библия не описывает падения Силома. Евсевий помещал селение в двенадцати милях от Неаполя, и там открыты византийские церкви с мозаичными полами."
  uk:
    - "Шіло лежало в гірському краї Ефраїма в Хірбет-Сейлуні, нині на Західному березі Йордану, приблизно за 30 км на північ від Єрусалима по прямій, за 15 км на північ від Бет-Ела і приблизно за 18 км на південь від Сихема. Ототожнення певне: Книга Суддів поміщає Шіло на північ від Бет-Ела, на схід від шляху з Бет-Ела до Сихема й на південь від Левони, і руїна відповідає цьому."
    - "Після завоювання «зібралась разом вся громада Ізраїлська в Силомі, і поставила там громадський намет», і Ісус Навин кидав там жереби для решти колін. Елкана й Анна приходили вклонятися, коли Ілій з синами були священиками, Анна привела хлопчика Самуїла до дому Господнього, і «являвся дальш Господь у Силомі, як обявився Самуїлові словом своїм Господнїм». Ковчег понесли з Шіло в бій проти філістимлян, і його було захоплено, а Ілій помер від цієї вістки. Єремія пізніше застерігав Єрусалим його долею: «Ійдїте ж до місця мого в Сило»."
    - "Данська експедиція копала тут у 1926–1932 рр., а Ізраїль Фінкельштейн — у 1981–1984 рр. У середньому бронзовому віці Шіло було містом із мурами; звалище жертовного посуду пізнього бронзового віку вказує на святилище ще до часів Ізраїлю. Ізраїльські будівлі з колонами та коморними глеками були спалені під час руйнування, яке радіовуглецевий метод датує другою половиною XI ст. до н. е.; багато хто пов'язує його з перемогою філістимлян, але Біблія не описує падіння Шіло. Євсевій розмістив село за дванадцять миль від Неаполя, і там відкрито візантійські церкви з мозаїчними підлогами."
  es:
    - "Silo se hallaba en la región montañosa de Efraín, en Khirbet Seilun, en la actual Cisjordania, a unos 30 km al norte de Jerusalén en línea recta, a 15 km al norte de Betel y a unos 18 km al sur de Siquem. La identificación es segura: Jueces sitúa Silo al norte de Betel, al este del camino principal de Betel a Siquem y al sur de Lebona, y la ruina encaja."
    - "Tras la conquista, «toda la congregación de los hijos de Israel se juntó en Silo, y asentaron allí el tabernáculo del testimonio», y Josué echó allí suertes para las tribus restantes. Elcana y Ana subían a adorar cuando Elí y sus hijos eran sacerdotes, Ana llevó al niño Samuel a la casa del Señor, y «tornó Jehová á aparecer en Silo: porque Jehová se manifestó á Samuel en Silo». El arca fue llevada de Silo a la batalla contra los filisteos y capturada, y Elí murió al saberlo. Jeremías advirtió más tarde a Jerusalén con su suerte: «Andad empero ahora á mi lugar que fué en Silo»."
    - "Una expedición danesa excavó aquí en 1926–1932 e Israel Finkelstein en 1981–1984. En el Bronce Medio, Silo era una ciudad amurallada; un vertedero de vasijas de ofrenda del Bronce Final sugiere un santuario anterior a la época de Israel. Edificios israelitas de pilares con jarras de almacenaje fueron quemados en una destrucción que el radiocarbono fecha en la segunda mitad del siglo XI a. C.; muchos la vinculan con la victoria filistea, pero la Biblia no describe la caída de Silo. Eusebio situó la aldea a doce millas de Neápolis, y allí se han descubierto iglesias bizantinas con suelos de mosaico."
  pt:
    - "Siló ficava na região montanhosa de Efraim, em Khirbet Seilun, na atual Cisjordânia, a cerca de 30 km ao norte de Jerusalém em linha reta, 15 km ao norte de Betel e cerca de 18 km ao sul de Siquém. A identificação é segura: Juízes situa Siló ao norte de Betel, a leste da estrada que vai de Betel a Siquém e ao sul de Lebona, e a ruína se ajusta."
    - "Depois da conquista, “Toda a congregação dos filhos de Israel se reuniu em Siló, e ali armaram a Tenda do Encontro”, e Josué lançou ali as sortes para as tribos restantes. Elcana e Ana subiam para adorar quando Eli e seus filhos eram sacerdotes, Ana trouxe o menino Samuel à casa do SENHOR, e “O SENHOR voltou a aparecer em Siló; pois o SENHOR se revelava a Samuel em Siló”. A arca foi levada de Siló para a batalha contra os filisteus e capturada, e Eli morreu com a notícia. Jeremias mais tarde advertiu Jerusalém com o seu destino: “vão agora ao meu lugar que estava em Siló”."
    - "Uma expedição dinamarquesa escavou aqui em 1926–1932 e Israel Finkelstein em 1981–1984. Na Idade do Bronze Média, Siló era uma cidade murada; um depósito de vasos de oferendas da Idade do Bronze Final sugere um santuário anterior aos tempos de Israel. Edifícios israelitas de pilares, com jarros de armazenamento, foram queimados numa destruição que o radiocarbono data da segunda metade do século XI a.C.; muitos a ligam à vitória filisteia, mas a Bíblia não descreve a queda de Siló. Eusébio situou a aldeia a doze milhas de Neápolis, e igrejas bizantinas com pisos de mosaico foram trazidas à luz ali."
  de:
    - "Silo lag im Bergland von Ephraim bei Khirbet Seilun, im heutigen Westjordanland, in der Luftlinie etwa 30 km nördlich von Jerusalem, 15 km nördlich von Bethel und etwa 18 km südlich von Sichem. Die Gleichsetzung ist sicher: Das Richterbuch setzt Silo nördlich von Bethel an, östlich der Straße von Bethel nach Sichem und südlich von Lebona, und die Ruine passt dazu."
    - "Nach der Eroberung „versammelte sich die ganze Gemeinde der Kinder Israel gen Silo und richteten daselbst auf die Hütte des Stifts“, und Josua warf dort das Los für die übrigen Stämme. Elkana und Hanna kamen zum Gottesdienst hinauf, als Eli und seine Söhne Priester waren, Hanna brachte den Knaben Samuel in das Haus des HERRN, und „der HERR erschien hinfort zu Silo; denn der HERR war durch Samuel offenbart worden zu Silo durchs Wort des HERRN“. Die Lade wurde von Silo in die Schlacht gegen die Philister getragen und genommen, und Eli starb bei der Nachricht. Jeremia warnte später Jerusalem mit seinem Schicksal: „Gehet hin an meinen Ort zu Silo“."
    - "Eine dänische Expedition grub hier 1926–1932 und Israel Finkelstein 1981–1984. In der Mittelbronzezeit war Silo eine ummauerte Stadt; eine Ablagerung von Opfergefäßen aus der Spätbronzezeit lässt ein Heiligtum vor Israels Zeit vermuten. Israelitische Pfeilerhäuser mit Vorratskrügen verbrannten bei einer Zerstörung, die die Radiokarbonmethode in die zweite Hälfte des 11. Jahrhunderts v. Chr. datiert; viele verbinden sie mit dem Sieg der Philister, doch die Bibel beschreibt den Fall Silos nicht. Eusebius setzte das Dorf zwölf Meilen von Neapolis an, und byzantinische Kirchen mit Mosaikböden sind dort freigelegt worden."
  fr:
    - "Silo se trouvait dans la région montagneuse d’Éphraïm, à Khirbet Seilun, dans l’actuelle Cisjordanie, à environ 30 km au nord de Jérusalem à vol d’oiseau, à 15 km au nord de Béthel et à environ 18 km au sud de Sichem. L’identification est sûre : le livre des Juges place Silo au nord de Béthel, à l’orient de la route qui monte de Béthel à Sichem et au midi de Lebona, et la ruine y correspond."
    - "Après la conquête, « Toute l’assemblée des enfants d’Israël se réunit à Silo, et ils y placèrent la tente d’assignation », et Josué y tira au sort le partage pour les tribus restantes. Elkana et Anne y montaient pour se prosterner du temps où Éli et ses fils étaient sacrificateurs, Anne mena le petit Samuel dans la maison de l’Éternel, et « L’Éternel continuait à apparaître dans Silo ; car l’Éternel se révélait à Samuel, dans Silo, par la parole de l’Éternel ». L’arche fut emportée de Silo pour le combat contre les Philistins et prise, et Éli mourut à cette nouvelle. Jérémie avertit plus tard Jérusalem en rappelant son sort : « Allez donc au lieu qui m’était consacré à Silo »."
    - "Une expédition danoise y fouilla en 1926-1932 et Israel Finkelstein en 1981-1984. Au Bronze moyen, Silo était une ville fortifiée ; un dépôt de vases d’offrande du Bronze récent suggère un sanctuaire antérieur à l’époque d’Israël. Des bâtiments israélites à piliers, avec des jarres de stockage, furent incendiés dans une destruction que le radiocarbone date de la seconde moitié du XIe siècle av. J.-C. ; beaucoup la relient à la victoire des Philistins, mais la Bible ne décrit pas la chute de Silo. Eusèbe plaçait le village à douze milles de Néapolis, et des églises byzantines aux sols de mosaïque y ont été mises au jour."
