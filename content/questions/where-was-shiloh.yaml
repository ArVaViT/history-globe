id: where-was-shiloh
question:
  en: "Where was Shiloh?"
  ru: "Где находился Силом?"
  uk: "Де було Шіло?"
  es: "¿Dónde estaba Silo?"
  pt: "Onde ficava Siló?"
  de: "Wo lag Silo?"
  fr: "Où se trouvait Silo ?"
  pl: "Gdzie leżało Szilo?"
  it: "Dov’era Silo?"
  cs: "Kde leželo Šílo?"
  nl: "Waar lag Silo?"
  sv: "Var låg Shilo?"
  nb: "Hvor lå Sjilo?"
  tl: "Nasaan ang Shiloh?"
  da: "Hvor lå Silo?"
  sr: "Где је био Сило?"
  hu: "Hol volt Siló?"
  fi: "Missä Silo sijaitsi?"
  vi: "Si-lô ở đâu?"
  ro: "Unde se afla Silo?"
  bg: "Къде се е намирал Силом?"
answer:
  en:
    - "Shiloh lay in the hill country of Ephraim at Khirbet Seilun, in today's West Bank, about 30 km north of Jerusalem in a straight line, 15 km north of Bethel and about 18 km south of Shechem. The identification is secure: Judges places Shiloh north of Bethel, east of the highway from Bethel to Shechem and south of Lebonah, and the ruin fits."
    - 'After the conquest "the whole congregation of the children of Israel assembled together at Shiloh, and set up the tabernacle of the congregation there", and Joshua cast lots there for the remaining tribes. Elkanah and Hannah came up to worship when Eli and his sons were priests, Hannah brought the child Samuel to the house of the LORD, and "the LORD appeared again in Shiloh: for the LORD revealed himself to Samuel in Shiloh". The ark was carried from Shiloh into battle against the Philistines and captured, and Eli died at the news. Jeremiah later warned Jerusalem with its fate: "go ye now unto my place which was in Shiloh".'
    - "A Danish expedition dug here in 1926–1932 and Israel Finkelstein in 1981–1984. In the Middle Bronze Age Shiloh was a walled town; a dump of offering vessels from the Late Bronze Age suggests a sanctuary before Israel's time. Israelite pillared buildings with storage jars were burnt in a destruction that radiocarbon dates to the second half of the eleventh century BC; many link it to the Philistine victory, but the Bible does not describe Shiloh's fall. Eusebius placed the village twelve miles from Neapolis, and Byzantine churches with mosaic floors have been uncovered there."
  ru:
    - "Силом стоял на горе Ефремовой, на месте Хирбет-Сейлун на нынешнем Западном берегу, примерно в 30 км к северу от Иерусалима по прямой, в 15 км к северу от Вефиля и примерно в 18 км к югу от Сихема. Отождествление надёжно: Книга Судей помещает Силом на север от Вефиля, на восток от дороги из Вефиля в Сихем и на юг от Левоны, и городище этому соответствует."
    - "После завоевания «все общество сынов Израилевых собралось в Силом, и поставили там скинию собрания», и Иисус Навин бросил здесь жребий для остальных колен. Сюда приходили поклониться Елкана и Анна, когда священниками были Илий и его сыновья; Анна привела отрока Самуила в дом Господень, и «продолжал Господь являться в Силоме после того, как открыл Себя Самуилу в Силоме». Ковчег взяли из Силома на битву с филистимлянами, и он был захвачен, а Илий, услышав об этом, умер. Позже Иеремия предостерегал Иерусалим его участью: «Пойдите же на место Мое в Силом»."
    - "В 1926–1932 годах здесь копала датская экспедиция, в 1981–1984 годах — Израэль Финкельштейн. В среднем бронзовом веке Силом был городом со стеной; свалка жертвенной посуды позднего бронзового века говорит о святилище ещё до Израиля. Израильские здания со столбами и сосудами для запасов сгорели при разрушении, которое радиоуглерод датирует второй половиной XI века до н. э.; многие связывают его с победой филистимлян, но Библия не описывает падения Силома. Евсевий помещал селение в двенадцати милях от Неаполя, и там открыты византийские церкви с мозаичными полами."
  uk:
    - "Шіло лежало в гірському краї Ефраїма в Хірбет-Сейлуні, нині на Західному березі Йордану, приблизно за 30 км на північ від Єрусалима по прямій, за 15 км на північ від Бет-Ела і приблизно за 18 км на південь від Сихема. Ототожнення певне: Книга Суддів поміщає Шіло на північ від Бет-Ела, на схід від шляху з Бет-Ела до Сихема й на південь від Левони, і руїна відповідає цьому."
    - "Після завоювання «зібралась разом вся громада Ізраїлська в Силомі, і поставила там громадський намет», і Ісус Навин кидав там жереби для решти колін. Елкана й Анна приходили вклонятися, коли Ілій з синами були священиками, Анна привела хлопчика Самуїла до дому Господнього, і «являвся дальш Господь у Силомі, як обявився Самуїлові словом своїм Господнїм». Ковчег понесли з Шіло в бій проти філістимлян, і його було захоплено, а Ілій помер від цієї вістки. Єремія пізніше застерігав Єрусалим його долею: «Ійдїте ж до місця мого в Сило»."
    - "Данська експедиція копала тут у 1926–1932 рр., а Ізраель Фінкельштейн — у 1981–1984 рр. У середньому бронзовому віці Шіло було містом із мурами; звалище жертовного посуду пізнього бронзового віку вказує на святилище ще до часів Ізраїлю. Ізраїльські будівлі з колонами та коморними глеками були спалені під час руйнування, яке радіовуглецевий метод датує другою половиною XI ст. до н. е.; багато хто пов'язує його з перемогою філістимлян, але Біблія не описує падіння Шіло. Євсевій розмістив село за дванадцять миль від Неаполя, і там відкрито візантійські церкви з мозаїчними підлогами."
  es:
    - "Silo se hallaba en la región montañosa de Efraín, en Khirbet Seilun, en la actual Cisjordania, a unos 30 km al norte de Jerusalén en línea recta, a 15 km al norte de Betel y a unos 18 km al sur de Siquem. La identificación es segura: Jueces sitúa Silo al norte de Betel, al este del camino principal de Betel a Siquem y al sur de Lebona, y la ruina encaja."
    - "Tras la conquista, «toda la congregación de los hijos de Israel se juntó en Silo, y asentaron allí el tabernáculo del testimonio», y Josué echó allí suertes para las tribus restantes. Elcana y Ana subían a adorar cuando Elí y sus hijos eran sacerdotes, Ana llevó al niño Samuel a la casa del Señor, y «tornó Jehová á aparecer en Silo: porque Jehová se manifestó á Samuel en Silo». El arca fue llevada de Silo a la batalla contra los filisteos y capturada, y Elí murió al saberlo. Jeremías advirtió más tarde a Jerusalén con su suerte: «Andad empero ahora á mi lugar que fué en Silo»."
    - "Una expedición danesa excavó aquí en 1926–1932 e Israel Finkelstein en 1981–1984. En el Bronce Medio, Silo era una ciudad amurallada; un vertedero de vasijas de ofrenda del Bronce Final sugiere un santuario anterior a la época de Israel. Edificios israelitas de pilares con jarras de almacenaje fueron quemados en una destrucción que el radiocarbono fecha en la segunda mitad del siglo XI a. C.; muchos la vinculan con la victoria filistea, pero la Biblia no describe la caída de Silo. Eusebio situó la aldea a doce millas de Neápolis, y allí se han descubierto iglesias bizantinas con suelos de mosaico."
  pt:
    - "Siló ficava na região montanhosa de Efraim, em Khirbet Seilun, na atual Cisjordânia, a cerca de 30 km ao norte de Jerusalém em linha reta, 15 km ao norte de Betel e cerca de 18 km ao sul de Siquém. A identificação é segura: Juízes situa Siló ao norte de Betel, a leste da estrada que vai de Betel a Siquém e ao sul de Lebona, e a ruína se ajusta."
    - "Depois da conquista, “Toda a congregação dos filhos de Israel se reuniu em Siló, e ali armaram a Tenda do Encontro”, e Josué lançou ali as sortes para as tribos restantes. Elcana e Ana subiam para adorar quando Eli e seus filhos eram sacerdotes, Ana trouxe o menino Samuel à casa do SENHOR, e “O SENHOR voltou a aparecer em Siló; pois o SENHOR se revelava a Samuel em Siló”. A arca foi levada de Siló para a batalha contra os filisteus e capturada, e Eli morreu com a notícia. Jeremias mais tarde advertiu Jerusalém com o seu destino: “vão agora ao meu lugar que estava em Siló”."
    - "Uma expedição dinamarquesa escavou aqui em 1926–1932 e Israel Finkelstein em 1981–1984. Na Idade do Bronze Média, Siló era uma cidade murada; um depósito de vasos de oferendas da Idade do Bronze Final sugere um santuário anterior aos tempos de Israel. Edifícios israelitas de pilares, com jarros de armazenamento, foram queimados numa destruição que o radiocarbono data da segunda metade do século XI a.C.; muitos a ligam à vitória filisteia, mas a Bíblia não descreve a queda de Siló. Eusébio situou a aldeia a doze milhas de Neápolis, e igrejas bizantinas com pisos de mosaico foram trazidas à luz ali."
  de:
    - "Silo lag im Bergland von Ephraim bei Khirbet Seilun, im heutigen Westjordanland, in der Luftlinie etwa 30 km nördlich von Jerusalem, 15 km nördlich von Bethel und etwa 18 km südlich von Sichem. Die Gleichsetzung ist sicher: Das Richterbuch setzt Silo nördlich von Bethel an, östlich der Straße von Bethel nach Sichem und südlich von Lebona, und die Ruine passt dazu."
    - "Nach der Eroberung „versammelte sich die ganze Gemeinde der Kinder Israel gen Silo und richteten daselbst auf die Hütte des Stifts“, und Josua warf dort das Los für die übrigen Stämme. Elkana und Hanna kamen zum Gottesdienst hinauf, als Eli und seine Söhne Priester waren, Hanna brachte den Knaben Samuel in das Haus des HERRN, und „der HERR erschien hinfort zu Silo; denn der HERR war durch Samuel offenbart worden zu Silo durchs Wort des HERRN“. Die Lade wurde von Silo in die Schlacht gegen die Philister getragen und genommen, und Eli starb bei der Nachricht. Jeremia warnte später Jerusalem mit seinem Schicksal: „Gehet hin an meinen Ort zu Silo“."
    - "Eine dänische Expedition grub hier 1926–1932 und Israel Finkelstein 1981–1984. In der Mittelbronzezeit war Silo eine ummauerte Stadt; eine Ablagerung von Opfergefäßen aus der Spätbronzezeit lässt ein Heiligtum vor Israels Zeit vermuten. Israelitische Pfeilerhäuser mit Vorratskrügen verbrannten bei einer Zerstörung, die die Radiokarbonmethode in die zweite Hälfte des 11. Jahrhunderts v. Chr. datiert; viele verbinden sie mit dem Sieg der Philister, doch die Bibel beschreibt den Fall Silos nicht. Eusebius setzte das Dorf zwölf Meilen von Neapolis an, und byzantinische Kirchen mit Mosaikböden sind dort freigelegt worden."
  fr:
    - "Silo se trouvait dans la région montagneuse d’Éphraïm, à Khirbet Seilun, dans l’actuelle Cisjordanie, à environ 30 km au nord de Jérusalem à vol d’oiseau, à 15 km au nord de Béthel et à environ 18 km au sud de Sichem. L’identification est sûre : le livre des Juges place Silo au nord de Béthel, à l’orient de la route qui monte de Béthel à Sichem et au midi de Lebona, et la ruine y correspond."
    - "Après la conquête, « Toute l’assemblée des enfants d’Israël se réunit à Silo, et ils y placèrent la tente d’assignation », et Josué y tira au sort le partage pour les tribus restantes. Elkana et Anne y montaient pour se prosterner du temps où Éli et ses fils étaient sacrificateurs, Anne mena le petit Samuel dans la maison de l’Éternel, et « L’Éternel continuait à apparaître dans Silo ; car l’Éternel se révélait à Samuel, dans Silo, par la parole de l’Éternel ». L’arche fut emportée de Silo pour le combat contre les Philistins et prise, et Éli mourut à cette nouvelle. Jérémie avertit plus tard Jérusalem en rappelant son sort : « Allez donc au lieu qui m’était consacré à Silo »."
    - "Une expédition danoise y fouilla en 1926-1932 et Israel Finkelstein en 1981-1984. Au Bronze moyen, Silo était une ville fortifiée ; un dépôt de vases d’offrande du Bronze récent suggère un sanctuaire antérieur à l’époque d’Israël. Des bâtiments israélites à piliers, avec des jarres de stockage, furent incendiés dans une destruction que le radiocarbone date de la seconde moitié du XIe siècle av. J.-C. ; beaucoup la relient à la victoire des Philistins, mais la Bible ne décrit pas la chute de Silo. Eusèbe plaçait le village à douze milles de Néapolis, et des églises byzantines aux sols de mosaïque y ont été mises au jour."
  pl:
    - "Szilo leżało w krainie górskiej Efraima w Khirbet Seilun, na dzisiejszym Zachodnim Brzegu, około 30 km na północ od Jerozolimy w linii prostej, 15 km na północ od Betel i około 18 km na południe od Sychem. Identyfikacja jest pewna: Księga Sędziów umieszcza Szilo na północ od Betel, na wschód od drogi z Betel do Sychem i na południe od Lebony, a ruiny się zgadzają."
    - "Po podboju „się zebrało wszystko zgromadzenie synów Izraelskich do Sylo, i postawili tam namiot zgromadzenia”, a Jozue rzucał tam losy dla pozostałych pokoleń. Elkana i Anna przychodzili oddawać cześć, gdy kapłanami byli Heli i jego synowie; Anna przyprowadziła dziecko Samuela do domu Pańskiego, a „napotem ukazywał się Pan Samuelowi w Sylo, tak jako mu się przedtem objawił Pan w Sylo przez słowo swoje”. Arkę wyniesiono z Szilo do bitwy z Filistynami i zdobyto, a Heli umarł na wieść o tym. Jeremiasz później ostrzegał Jerozolimę jej losem: „idźcie przynajmniej na miejsce moje, które było w Sylo”."
    - "Duńska wyprawa kopała tu w latach 1926–1932, a Israel Finkelstein w latach 1981–1984. W średnim brązie Szilo było miastem otoczonym murem; wysypisko naczyń ofiarnych z późnego brązu wskazuje na sanktuarium sprzed czasów Izraela. Izraelskie budynki filarowe z dzbanami magazynowymi spłonęły w zniszczeniu, które datowanie radiowęglowe umieszcza w drugiej połowie XI wieku p.n.e.; wielu wiąże je z filistyńskim zwycięstwem, ale Biblia nie opisuje upadku Szilo. Euzebiusz umieszczał wieś dwanaście mil od Neapolis, a odkryto tu bizantyjskie kościoły z mozaikowymi posadzkami."
  it:
    - "Silo sorgeva nella regione collinare di Efraim a Khirbet Seilun, nell’odierna Cisgiordania, a circa 30 km a nord di Gerusalemme in linea d’aria, a 15 km a nord di Betel e a circa 18 km a sud di Sichem. L’identificazione è sicura: Giudici pone Silo a nord di Betel, a est della strada principale da Betel a Sichem e a sud di Lebona, e la rovina vi corrisponde."
    - "Dopo la conquista «tutta la raunanza de’ figliuoli d’Israele s’adunò a Sciloh, e quivi rizzarono la tenda di convegno», e Giosuè vi tirò a sorte per le tribù rimaste. Elkana e Anna salivano ad adorare quando Eli e i suoi figli erano sacerdoti, Anna portò il piccolo Samuele alla casa dell’Eterno, e «l’Eterno continuò ad apparire a Sciloh, poiché a Sciloh l’Eterno si rivelava a Samuele mediante la sua parola». L’arca fu portata da Silo in battaglia contro i Filistei e fu catturata, ed Eli morì alla notizia. Geremia ammonì più tardi Gerusalemme con la sua sorte: «Andate dunque al mio luogo ch’era a Silo»."
    - "Una spedizione danese vi scavò nel 1926–1932 e Israel Finkelstein nel 1981–1984. Nel Medio Bronzo Silo era una città murata; un deposito di vasi per offerte del Tardo Bronzo suggerisce un santuario precedente all’epoca di Israele. Edifici israelitici a pilastri con giare per derrate furono bruciati in una distruzione che il radiocarbonio data alla seconda metà dell’XI secolo a.C.; molti la collegano alla vittoria filistea, ma la Bibbia non descrive la caduta di Silo. Eusebio collocò il villaggio a dodici miglia da Neapoli, e vi sono state portate alla luce chiese bizantine con pavimenti a mosaico."
  cs:
    - "Šílo leželo v horské zemi Efrajimově v Chirbet Seilun, na dnešním Západním břehu, vzdušnou čarou asi 30 km severně od Jeruzaléma, 15 km severně od Bét-elu a asi 18 km jižně od Šekemu. Ztotožnění je jisté: Kniha Soudců klade Šílo severně od Bét-elu, východně od silnice z Bét-elu do Šekemu a jižně od Lebóny a zřícenina tomu odpovídá."
    - "Po dobytí „shromáždilo se pak všecko množství synů Izraelských do Sílo, a tu postavili stánek úmluvy“ a Jozue tam losoval o zbývající kmeny. Elkána a Chana přicházeli klanět se, když byli kněžími Élí a jeho synové, Chana přinesla chlapce Samuela do domu Hospodinova a Hospodin se zjevoval znovu: „Nebo se jemu i potom ukazoval Hospodin v Sílo, jakož se byl prvé zjevil Hospodin Samuelovi v Sílo.“ Truhla byla ze Šíla odnesena do bitvy proti Pelištejcům a zajata a Élí při té zprávě zemřel. Jeremjáš s jeho osudem později varoval Jeruzalém: „jděte aspoň na místo mé, kteréž bylo v Sílo“."
    - "Dánská expedice zde kopala v letech 1926–1932 a Israel Finkelstein v letech 1981–1984. Ve střední době bronzové bylo Šílo opevněným městem; hromada obětních nádob z pozdní doby bronzové naznačuje svatyni před dobou Izraele. Izraelské pilířové budovy se zásobními džbány vyhořely při zkáze, kterou radiokarbon datuje do druhé poloviny 11. století př. n. l.; mnozí ji spojují s pelištejským vítězstvím, ale Bible pád Šíla nepopisuje. Eusebios umístil vesnici dvanáct mil od Neapole a byly zde odkryty byzantské kostely s mozaikovými podlahami."
  nl:
    - "Silo lag in het bergland van Efraïm bij Khirbet Seilun, in de huidige Westelijke Jordaanoever, hemelsbreed ongeveer 30 km ten noorden van Jeruzalem, 15 km ten noorden van Bethel en ongeveer 18 km ten zuiden van Sichem. De identificatie is zeker: Richteren plaatst Silo ten noorden van Bethel, ten oosten van de hoofdweg van Bethel naar Sichem en ten zuiden van Lebona, en de ruïne past erbij."
    - "Na de verovering lezen we dat “de ganse vergadering van de kinderen Israels verzamelde zich te Silo, en zij richtten aldaar op de tent der samenkomst”, en Jozua wierp daar het lot voor de overige stammen. Elkana en Hanna gingen op om te aanbidden toen Eli en zijn zonen priesters waren, Hanna bracht het kind Samuël naar het huis van de HEER, en “de HEERE voer voort te verschijnen te Silo; want de HEERE openbaarde Zich aan Samuel te Silo”. De ark werd uit Silo meegenomen de strijd in tegen de Filistijnen en buitgemaakt, en Eli stierf bij het bericht. Jeremia waarschuwde Jeruzalem later met het lot van Silo: “gaat nu henen naar Mijn plaats, die te Silo was”."
    - "Een Deense expeditie groef hier in 1926–1932 en Israel Finkelstein in 1981–1984. In de Midden-Bronstijd was Silo een ommuurde stad; een stortplaats van offervaten uit de Late Bronstijd wijst op een heiligdom vóór de tijd van Israël. Israëlitische pijlergebouwen met voorraadkruiken werden verbrand in een verwoesting die volgens de radiokoolstofdatering in de tweede helft van de elfde eeuw v.Chr. valt; velen brengen die in verband met de Filistijnse overwinning, maar de Bijbel beschrijft de val van Silo niet. Eusebius plaatste het dorp twaalf mijl van Neapolis, en er zijn Byzantijnse kerken met mozaïekvloeren blootgelegd."
  sv:
    - "Shilo låg i Efraims bergsbygd vid Khirbet Seilun, på dagens Västbanken, omkring 30 km norr om Jerusalem i fågelvägen, 15 km norr om Betel och omkring 18 km söder om Shekem. Identifieringen är säker: Domarboken placerar Shilo norr om Betel, öster om vägen från Betel till Shekem och söder om Levona, och ruinen stämmer."
    - "Efter erövringen ”församlade sig Israels barns hela menighet i Silo och uppsatte där uppenbarelsetältet”, och Josua kastade där lott för de återstående stammarna. Elkana och Hanna drog upp för att tillbe när Eli och hans söner var präster, Hanna förde gossen Samuel in i HERRENS hus, och ”HERREN fortfor att låta se sig i Silo; ty HERREN uppenbarade sig för Samuel i Silo genom HERRENS ord”. Arken bars från Shilo i striden mot filistéerna och togs, och Eli dog vid beskedet. Jeremia varnade senare Jerusalem med dess öde: ”Gån bort till den plats i Silo, där jag först lät mitt namn bo”."
    - "En dansk expedition grävde här 1926–1932 och Israel Finkelstein 1981–1984. Under mellersta bronsåldern var Shilo en befäst stad; en avfallshög med offerkärl från sen bronsålder tyder på en helgedom före Israels tid. Israelitiska pelarbyggnader med förrådskrukor brändes i en förstörelse som radiokol dateras till andra hälften av 1000-talet f.Kr.; många förbinder den med filistéernas seger, men Bibeln beskriver inte Shilos fall. Eusebios placerade byn tolv romerska mil från Neapolis, och bysantinska kyrkor med mosaikgolv har avtäckts där."
  nb:
    - "Sjilo lå i Efraims fjellland ved Khirbet Seilun, på dagens Vestbredd, omtrent 30 km nord for Jerusalem i luftlinje, 15 km nord for Betel og omtrent 18 km sør for Sikem. Identifiseringen er sikker: Dommerboken plasserer Sjilo nord for Betel, øst for hovedveien fra Betel til Sikem og sør for Lebona, og ruinen passer."
    - "Etter erobringen heter det: «hele Israels barns menighet samlet sig i Silo og reiste der sammenkomstens telt», og Josva kastet lodd der for de gjenværende stammene. Elkana og Hanna dro opp for å tilbe da Eli og hans sønner var prester, Hanna brakte gutten Samuel til Herrens hus, og «Herren blev ved å la sig se i Silo; for Herren åpenbarte sig for Samuel i Silo ved Herrens ord.» Arken ble hentet fra Silo ut i kampen mot filistrene og tatt til fange, og Eli døde ved budskapet. Jeremia advarte senere Jerusalem med dens skjebne: «Gå til min bolig som var i Silo»."
    - "En dansk ekspedisjon gravde her i 1926–1932 og Israel Finkelstein i 1981–1984. I mellombronsealderen var Sjilo en befestet by; en avfallshaug med offerkar fra senbronsealderen tyder på en helligdom før Israels tid. Israelittiske bygninger med søyler og lagerkrukker ble brent i en ødeleggelse som radiokarbon daterer til siste halvdel av 1000-tallet f.Kr.; mange knytter den til filistrenes seier, men Bibelen beskriver ikke Sjilos fall. Eusebius plasserte landsbyen tolv romerske mil fra Neapolis, og bysantinske kirker med mosaikkgulv er avdekket der."
  tl:
    - "Ang Shiloh ay nasa maburol na lupain ng Ephraim sa Khirbet Seilun, sa kasalukuyang West Bank, mga 30 km sa hilaga ng Jerusalem sa tuwid na guhit, 15 km sa hilaga ng Beth-el at mga 18 km sa timog ng Sichem. Tiyak ang pagkakakilanlan: inilalagay ng Mga Hukom ang Shiloh sa hilaga ng Beth-el, sa silangan ng lansangang-bayan mula Beth-el hanggang Sichem at sa timog ng Lebona, at umaakma ang guho."
    - "Pagkatapos ng pananakop, “ang buong kapisanan ng mga anak ni Israel ay nagpupulong sa Silo, at itinayo ang tabernakulo ng kapisanan doon”, at doon nagpalabunutan si Josue para sa mga natitirang lipi. Umahon sina Elcana at Ana upang sumamba nang sina Eli at ang kaniyang mga anak ang mga saserdote, dinala ni Ana ang batang si Samuel sa bahay ng Panginoon, at “napakilala uli ang Panginoon sa Silo, sapagka't ang Panginoo'y napakilala kay Samuel sa Silo”. Dinala ang kaban mula sa Shiloh sa labanan laban sa mga Filisteo at nabihag, at namatay si Eli sa balita. Nagbabala si Jeremias kalaunan sa Jerusalem sa pamamagitan ng sinapit nito: “magsiparoon kayo ngayon sa aking dako na nasa Silo”."
    - "Isang ekspedisyong Danes ang humukay dito noong 1926–1932 at si Israel Finkelstein noong 1981–1984. Sa Gitnang Panahong Tanso, ang Shiloh ay isang bayang may pader; ang isang tambakan ng mga sisidlang pang-alay mula sa Huling Panahong Tanso ay nagmumungkahi ng isang santuwaryo bago ang panahon ng Israel. Ang mga gusaling may haligi ng mga Israelita na may mga banga ng imbakan ay nasunog sa isang pagkawasak na ayon sa radiocarbon ay sa ikalawang kalahati ng ika-11 siglo BK; iniuugnay ito ng marami sa tagumpay ng mga Filisteo, ngunit hindi inilalarawan ng Biblia ang pagbagsak ng Shiloh. Inilagay ni Eusebio ang nayon sa labindalawang milya mula sa Neapolis, at may mga simbahang Bizantino na may sahig na mosaiko ang nahukay doon."
  da:
    - "Silo lå i Efraims bjerge ved Khirbet Seilun, i dagens Vestbred, ca. 30 km nord for Jerusalem i fugleflugt, 15 km nord for Betel og ca. 18 km syd for Sikem. Identifikationen er sikker: Dommerbogen placerer Silo nord for Betel, øst for landevejen fra Betel til Sikem og syd for Lebona, og ruinen passer."
    - "Efter erobringen »samledes al Israels Børns Menighed i Silo og satte der Forsamlingens Paulun«, og Josva kastede lod dér for de resterende stammer. Elkana og Hanna drog op for at tilbede, da Eli og hans sønner var præster, Hanna førte drengen Samuel til »Herrens Hus i Silo«, og »Herren blev ved at lade sig se i Silo; thi Herren havde aabenbaret sig for Samuel i Silo ved Herrens Ord«. Arken blev båret fra Silo i kamp mod filisterne og taget, og Eli døde ved budskabet. Jeremias advarede senere Jerusalem med dens skæbne: »gaar dog til mit Sted, som var i Silo«."
    - "En dansk ekspedition gravede her i 1926-1932 og Israel Finkelstein i 1981-1984. I mellembronzealderen var Silo en befæstet by; en dynge af offerkar fra sen bronzealder antyder en helligdom før Israels tid. Israelitiske søjlebygninger med lagerkrukker brændte i en ødelæggelse, som kulstof-14-datering sætter til anden halvdel af 1000-tallet f.Kr.; mange knytter den til filisternes sejr, men Bibelen beskriver ikke Silos fald. Eusebios placerede landsbyen tolv romerske mil fra Neapolis, og byzantinske kirker med mosaikgulve er blevet afdækket der."
  sr:
    - "Сило је лежао у брдовитом крају Јефрема у Хирбет Сејлуну, у данашњој Западној обали, око 30 км северно од Јерусалима ваздушном линијом, 15 км северно од Ветиља и око 18 км јужно од Сихема. Поистовећење је сигурно: Књига о судијама смешта Сило северно од Ветиља, источно од друма од Ветиља до Сихема и јужно од Левоне, а рушевина одговара."
    - "После освајања „сабра се сав збор синова Израиљевих у Силом и онде наместише шатор од састанка“, а Исус Навин је ту бацао жреб за преостала племена. Елкана и Ана долазили су да се клањају кад су Илије и његови синови били свештеници, Ана је довела дете Самуила у дом Господњи, и „Господ се стаде опет јављати у Силому, јер се Господ јављаше Самуилу у Силому“. Ковчег је из Сила однет у битку против Филистеја и заробљен, а Илије је на вест умро. Јеремија је касније упозоравао Јерусалим његовом судбином: „идите сада на моје место, које је било у Силому“."
    - "Дански тим копао је овде 1926–1932, а Израел Финкелштајн 1981–1984. У средњем бронзаном добу Сило је био утврђен град; хрпа посуда за приносе из касног бронзаног доба наговештава светилиште пре Израеловог времена. Израелске зграде са стубовима и посудама за залихе изгореле су у разарању које радиокарбон датира у другу половину једанаестог века п. н. е.; многи га везују за филистејску победу, али Библија не описује пад Сила. Јевсевије је село сместио дванаест миља од Неапоља, а ту су откривене византијске цркве са мозаичким подовима."
  hu:
    - "Siló Efraim hegyvidékén feküdt Khirbet Seilunnál, a mai Ciszjordániában, Jeruzsálemtől légvonalban mintegy 30 km-re északra, Bétheltől 15 km-re északra és Sikemtől mintegy 18 km-re délre. Az azonosítás biztos: a Bírák könyve Silót Bétheltől északra, a Bétheltől Sikem felé vezető országúttól keletre és Lebónától délre helyezi, és a rom illik hozzá."
    - "A hódítás után „Izráel fiainak egész gyülekezete pedig összegyülekezék Silóban és oda helyhezteték a gyülekezetnek sátorát”, és Józsué ott vetett sorsot a megmaradt törzsek számára. Elkána és Anna oda zarándokoltak, amikor Éli és fiai voltak a papok, Anna a kis Sámuelt az Úr házába vitte, és „az Úr kezde ismét megjelenni Silóban, mert kijelentette magát az Úr Sámuelnek Silóban”. A frigyládát Silóból vitték a filiszteusok elleni csatába, és elvették, Éli pedig a hírre meghalt. Jeremiás később Siló sorsával intette Jeruzsálemet: „menjetek csak el az én helyemre, a mely Silóban van”."
    - "Dán expedíció ásott itt 1926–1932-ben, Israel Finkelstein pedig 1981–1984-ben. A középső bronzkorban Siló falakkal övezett város volt; a késő bronzkori áldozati edények lerakata Izráel kora előtti szentélyre utal. Az izráelita oszlopos épületeket tárolóedényekkel egy pusztulásban égették el, amelyet a radiokarbon a Kr. e. 11. század második felére keltez; sokan a filiszteus győzelemhez kötik, de a Biblia nem írja le Siló bukását. Eusebius a falut Neapolisztól tizenkét mérföldre helyezte, és itt mozaikpadlós bizánci templomokat tártak fel."
  fi:
    - "Silo sijaitsi Efraimin vuoristossa Khirbet Seilunissa nykyisellä Länsirannalla, linnuntietä noin 30 km Jerusalemista pohjoiseen, 15 km Betelistä pohjoiseen ja noin 18 km Sikemistä etelään. Tunnistus on varma: Tuomarien kirja sijoittaa Silon Betelistä pohjoiseen, Betelistä Sikemiin johtavan valtatien itäpuolelle ja Lebonasta etelään, ja rauniot sopivat tähän."
    - "Valloituksen jälkeen ”kaikki israelilaisten seurakunta kokoontui Siiloon, ja he pystyttivät sinne ilmestysmajan”, ja Joosua heitti siellä arpaa jäljellä oleville sukukunnille. Elkana ja Hanna tulivat palvomaan Elin ja hänen poikiensa ollessa pappeina, Hanna toi lapsi Samuelin Herran huoneeseen, ja ”Herra ilmestyi edelleenkin Siilossa; sillä Herra ilmestyi Samuelille Siilossa Herran sanan kautta”. Arkki vietiin Silosta taisteluun filistealaisia vastaan ja vallattiin, ja Eli kuoli uutisen kuultuaan. Jeremia varoitti myöhemmin Jerusalemia sen kohtalolla: ”Menkääpä minun asuinpaikkaani, joka oli Siilossa”."
    - "Tanskalainen retkikunta kaivoi täällä vuosina 1926–1932 ja Israel Finkelstein vuosina 1981–1984. Keskipronssikaudella Silo oli muurein ympäröity kaupunki; myöhäispronssikauden uhriastioiden kasa viittaa pyhäkköön ennen Israelin aikaa. Israelilaiset pilarirakennukset varastoruukkuineen paloivat tuhossa, jonka radiohiiliajoitus sijoittaa 1000-luvun eaa. toiselle puoliskolle; monet yhdistävät sen filistealaisten voittoon, mutta Raamattu ei kuvaa Silon kukistumista. Eusebios sijoitti kylän kahdentoista mailin päähän Neapoliksesta, ja siellä on paljastettu bysanttilaisia mosaiikkilattiaisia kirkkoja."
  vi:
    - "Si-lô nằm trong vùng đồi núi Ép-ra-im tại Khirbet Seilun, nay thuộc Bờ Tây, cách Giê-ru-sa-lem khoảng 30 km về phía bắc theo đường thẳng, cách Bê-tên 15 km về phía bắc và cách Si-chem khoảng 18 km về phía nam. Sự đồng nhất này chắc chắn: sách Các Quan Xét đặt Si-lô ở phía bắc Bê-tên, phía đông đường cái từ Bê-tên đến Si-chem và phía nam Lê-bô-na, và tàn tích khớp với điều đó."
    - "Sau cuộc chinh phục, “Cả hội chúng dân Y-sơ-ra-ên nhóm hiệp tại Si-lô, và lập hội mạc tại đó”, và Giô-suê bắt thăm tại đó cho các chi phái còn lại. Ên-ca-na và An-ne lên thờ phượng khi Hê-li và các con trai ông là thầy tế lễ, An-ne đem đứa trẻ Sa-mu-ên đến đền của Đức Giê-hô-va, và “Đức Giê-hô-va cứ hiện ra tại Si-lô, vì ấy tại Si-lô mà Đức Giê-hô-va hiện ra cùng Sa-mu-ên”. Hòm giao ước được đem từ Si-lô ra trận chống người Phi-li-tin và bị bắt, và Hê-li chết khi nghe tin. Về sau Giê-rê-mi cảnh báo Giê-ru-sa-lem bằng số phận của nó: “hãy đi đến chỗ ở cũ của ta” tại Si-lô."
    - "Một đoàn thám hiểm Đan Mạch khai quật ở đây năm 1926–1932 và Israel Finkelstein năm 1981–1984. Vào thời Đồ Đồng Giữa, Si-lô là một thị trấn có tường; một đống đồ dâng cúng từ cuối thời Đồ Đồng gợi ý có một nơi thánh trước thời Y-sơ-ra-ên. Các tòa nhà có cột của người Y-sơ-ra-ên với bình chứa bị cháy trong một cuộc hủy diệt mà niên đại carbon phóng xạ là nửa sau thế kỷ 11 TCN; nhiều người liên hệ nó với chiến thắng của người Phi-li-tin, nhưng Kinh Thánh không mô tả sự sụp đổ của Si-lô. Eusebius đặt làng này cách Neapolis mười hai dặm, và các nhà thờ Byzantine có nền khảm đã được phát lộ tại đó."
  ro:
    - "Silo se afla în ținutul deluros al lui Efraim, la Khirbet Seilun, în Cisiordania de azi, la circa 30 km nord de Ierusalim în linie dreaptă, la 15 km nord de Betel și la circa 18 km sud de Sihem. Identificarea este sigură: cartea Judecătorilor așază Silo la nord de Betel, la est de drumul mare de la Betel la Sihem și la sud de Lebona, iar ruina se potrivește."
    - "După cucerire, „s’a strâns toată adunarea fiilor lui Israil în Silo, și a întins acolo cortul mărturiei”, iar Iosua a tras acolo la sorți pentru semințiile rămase. Elcana și Ana urcau să se închine pe vremea când Eli și fiii lui erau preoți, Ana a adus la casa Domnului pe pruncul Samuel, iar Domnul i S-a arătat din nou lui Samuel la Silo și i S-a descoperit acolo. Chivotul a fost dus de la Silo în luptă împotriva filistenilor și a fost capturat, iar Eli a murit la vestea aceasta. Ieremia a avertizat mai târziu Ierusalimul cu soarta lui, trimițându-l la locul Domnului care fusese în Silo."
    - "O expediție daneză a săpat aici în 1926–1932, iar Israel Finkelstein în 1981–1984. În Epoca Bronzului Mijlociu, Silo era un oraș întărit cu ziduri; o groapă de gunoi cu vase de ofrandă din Epoca Bronzului Târziu sugerează un sanctuar dinaintea vremii lui Israel. Clădiri israelite cu stâlpi și vase de provizii au fost arse într-o distrugere pe care radiocarbonul o datează în a doua jumătate a secolului al XI-lea î.Hr.; mulți o leagă de victoria filistenilor, dar Biblia nu descrie căderea cetății Silo. Eusebiu plasa satul la douăsprezece mile de Neapolis, iar aici au fost scoase la iveală biserici bizantine cu podele de mozaic."
  bg:
    - "Силом се намираше в планинската страна на Ефрем, при Хирбет Сейлун, в днешния Западен бряг, на около 30 км северно от Йерусалим по права линия, на 15 км северно от Ветил и на около 18 км южно от Сихем. Отъждествяването е сигурно: книга Съдии поставя Силом северно от Ветил, източно от главния път от Ветил за Сихем и южно от Левона, и руината отговаря на това."
    - "След завладяването „събра се всичкото събрание на Израилевите синове в Сило, и поставиха там скинията на събранието“, и Иисус Навин хвърли там жребий за останалите племена. Елкана и Ана идваха да се покланят, когато Илий и синовете му бяха свещеници, Ана доведе детето Самуил в дома Господен, и „пак захвана Господ да се явява в Сило; защото се откриваше Господ Самуилу в Сило“. Ковчегът беше изнесен от Силом в битка срещу филистимците и пленен, а Илий умря, щом чу вестта. По-късно Йеремия предупреждава Йерусалим със съдбата му: „идете сега към мястото ми което бе в Сило“."
    - "Датска експедиция разкопава тук през 1926–1932 г., а Израел Финкелщайн — през 1981–1984 г. През средната бронзова епоха Силом беше град със стени; сметище с жертвени съдове от късната бронзова епоха подсказва светилище отпреди времето на Израил. Израилски сгради с колони и с делви за съхранение са изгорени при разрушение, което радиовъглеродният метод датира във втората половина на XI в. пр.н.е.; мнозина го свързват с филистимската победа, но Библията не описва падането на Силом. Евсевий поставя селото на дванадесет мили от Неапол, а там са разкрити византийски църкви с мозаечни подове."
