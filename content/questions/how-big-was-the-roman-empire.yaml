id: how-big-was-the-roman-empire
question:
  en: "How big was the Roman Empire in Jesus' day?"
  ru: "Насколько велика была Римская империя во дни Иисуса?"
  uk: "Якого розміру була Римська імперія за днів Ісуса?"
  es: "¿Qué extensión tenía el Imperio romano en tiempos de Jesús?"
  pt: "Qual era o tamanho do Império Romano no tempo de Jesus?"
  de: "Wie groß war das Römische Reich zur Zeit Jesu?"
  fr: "Quelle était la taille de l’Empire romain à l’époque de Jésus ?"
  pl: "Jak wielkie było Cesarstwo Rzymskie za czasów Jezusa?"
  it: "Quanto era grande l’Impero romano ai tempi di Gesù?"
  nl: "Hoe groot was het Romeinse Rijk in de tijd van Jezus?"
  cs: "Jak velká byla Římská říše za Ježíšových dnů?"
  sv: "Hur stort var Romerska riket på Jesu tid?"
  nb: "Hvor stort var Romerriket på Jesu tid?"
  tl: "Gaano kalaki ang Imperyong Romano noong kaarawan ni Jesus?"
  da: "Hvor stort var Romerriget på Jesu tid?"
answer:
  en:
    - "Under Tiberius (AD 14–37) the empire reached from the Atlantic to the Euphrates and from the Rhine and Danube to the Sahara: all of Spain, Gaul, Italy and Greece, most of the Balkans and Asia Minor, Syria, Egypt and the North African coast. Rome, where the map point stands, lay about 2,300 km from Jerusalem in a straight line, 1,950 km from Alexandria and 1,400 km from the middle of Spain. By Rein Taagepera's measurements the empire covered about 5 million square kilometres at its largest under Trajan, a century later, and most of that was already Roman in Jesus' lifetime."
    - "Luke frames the Nativity by it: “there went out a decree from Caesar Augustus, that all the world should be taxed”, and he dates the Baptist's preaching to “the fifteenth year of the reign of Tiberius Caesar”. Augustus himself listed his conquests in the inscription he left for his tomb, from Spain and the Alps to Egypt and the Danube, and Tacitus counts the garrison of AD 23: twenty-five legions on the Rhine and the Danube, in Spain, Dalmatia, Africa, Egypt and Syria, with as many auxiliaries, and a ring of client kings beyond. Judea was one corner of this: a province under a prefect since AD 6, while Galilee was ruled by Herod's son Antipas, one of the client princes."
    - "How many people lived in it is a guess. The old reckoning of Karl Julius Beloch gave 54 million for AD 14; recent estimates for that year run from about 45 to 60 million, and up to some 75 million at the peak in the second century. A Roman citizen such as Paul could travel the whole of it on one law and, in the east, one language, Greek; he could say “I appeal unto Caesar” in Caesarea and be sent to Rome, as the last chapters of Acts tell."
  ru:
    - "При Тиберии (14–37 гг.) империя простиралась от Атлантики до Евфрата и от Рейна и Дуная до Сахары: вся Испания, Галлия, Италия и Греция, большая часть Балкан и Малой Азии, Сирия, Египет и побережье Северной Африки. Рим, где стоит точка карты, лежал примерно в 2300 км от Иерусалима по прямой, в 1950 км от Александрии и в 1400 км от середины Испании. По измерениям Рейна Таагеперы, империя занимала около 5 миллионов квадратных километров в пору наибольшего размаха при Траяне, столетием позже, и большая часть этого была римской уже при жизни Иисуса."
    - "Лука обрамляет ею Рождество: «вышло от кесаря Августа повеление сделать перепись по всей земле», а проповедь Крестителя он датирует так: «В пятнадцатый же год правления Тиверия кесаря». Сам Август перечислил свои завоевания в надписи, оставленной для своей гробницы, — от Испании и Альп до Египта и Дуная, а Тацит считает войско 23 года: двадцать пять легионов на Рейне и Дунае, в Испании, Далмации, Африке, Египте и Сирии, столько же вспомогательных войск и кольцо зависимых царей за границей. Иудея была одним углом этого мира: провинция под началом префекта с 6 года, тогда как Галилеей правил сын Ирода Антипа, один из зависимых князей."
    - "Сколько в ней жило людей — догадка. Старый подсчёт Карла Юлиуса Белоха давал 54 миллиона на 14 год; новые оценки на тот же год — примерно от 45 до 60 миллионов, а на пик во II веке — до 75 миллионов. Римский гражданин, как Павел, мог проехать её всю при одном законе и, на востоке, одном языке — греческом; он мог сказать в Кесарии «Требую суда кесарева» и быть отправленным в Рим, как рассказывают последние главы Деяний."
  uk:
    - "За Тиверія (14–37 рр. н. е.) імперія простягалася від Атлантики до Євфрату й від Рейну та Дунаю до Сахари: уся Іспанія, Галлія, Італія й Греція, більша частина Балкан і Малої Азії, Сирія, Єгипет і північноафриканське узбережжя. Рим, де стоїть точка мапи, лежав приблизно за 2300 км від Єрусалиму по прямій, за 1950 км від Александрії та за 1400 км від середини Іспанії. За вимірами Рейна Таагепери, імперія охоплювала близько 5 мільйонів квадратних кілометрів у найбільшому обсязі за Траяна, сторіччям пізніше, і більша частина цього вже була римською за життя Ісуса."
    - "Лука окреслює нею Різдво: «вийшло повелїннє від кесаря Августа переписати всю вселенну», а проповідь Хрестителя датує так: «У пятнайцятий же рік правлення Тиверия кесаря». Сам Август перелічив свої завоювання в написі, який залишив для своєї гробниці, — від Іспанії та Альп до Єгипту й Дунаю, а Тацит рахує гарнізон 23 р. н. е.: двадцять п'ять легіонів на Рейні й Дунаї, в Іспанії, Далмації, Африці, Єгипті та Сирії, з такою самою кількістю допоміжних військ, а за ними — коло залежних царів. Юдея була одним із кутків цього: провінція під префектом від 6 р. н. е., тоді як Галілеєю правив Іродів син Антипа, один із залежних князів."
    - "Скільки людей жило в ній, можна лише гадати. Давня оцінка Карла Юліуса Белоха дала 54 мільйони на 14 р. н. е.; новітні оцінки на цей рік коливаються приблизно від 45 до 60 мільйонів, а на піку, у II ст. — до якихось 75 мільйонів. Римський громадянин, як-от Павло, міг подорожувати нею всією за одним законом і, на сході, однією мовою — грецькою; він міг сказати в Кесарії: «Покликуюсь до кесаря» — і бути відісланим до Рима, як розповідають останні розділи Дій."
  es:
    - "Bajo Tiberio (14–37 d. C.) el imperio se extendía desde el Atlántico hasta el Éufrates y desde el Rin y el Danubio hasta el Sahara: toda Hispania, la Galia, Italia y Grecia, la mayor parte de los Balcanes y de Asia Menor, Siria, Egipto y la costa del norte de África. Roma, donde está el punto del mapa, distaba de Jerusalén unos 2300 km en línea recta, 1950 km de Alejandría y 1400 km del centro de España. Según las mediciones de Rein Taagepera, el imperio abarcó unos 5 millones de kilómetros cuadrados en su máxima extensión, bajo Trajano, un siglo después, y la mayor parte de ese territorio ya era romana en vida de Jesús."
    - "Lucas enmarca la Natividad en él: «salió edicto de parte de Augusto César, que toda la tierra fuese empadronada», y fecha la predicación del Bautista en «el año quince del imperio de Tiberio César». El propio Augusto enumeró sus conquistas en la inscripción que dejó para su tumba, desde España y los Alpes hasta Egipto y el Danubio, y Tácito cuenta la guarnición del año 23 d. C.: veinticinco legiones en el Rin y el Danubio, en Hispania, Dalmacia, África, Egipto y Siria, con otras tantas tropas auxiliares, y un anillo de reyes clientes más allá. Judea era un rincón de este conjunto: una provincia bajo un prefecto desde el año 6 d. C., mientras que Galilea estaba gobernada por Antipas, hijo de Herodes, uno de los príncipes clientes."
    - "Cuánta gente vivía en él es una conjetura. El antiguo cálculo de Karl Julius Beloch daba 54 millones para el año 14 d. C.; las estimaciones recientes para ese año van de unos 45 a 60 millones, y hasta unos 75 millones en el punto máximo del siglo II. Un ciudadano romano como Pablo podía recorrerlo entero con una sola ley y, en el oriente, una sola lengua, el griego; podía decir «A César apelo» en Cesarea y ser enviado a Roma, como cuentan los últimos capítulos de Hechos."
  pt:
    - "Sob Tibério (14–37 d.C.) o império ia do Atlântico ao Eufrates e do Reno e do Danúbio ao Saara: toda a Espanha, a Gália, a Itália e a Grécia, a maior parte dos Bálcãs e da Ásia Menor, a Síria, o Egito e a costa do norte da África. Roma, onde está o ponto do mapa, ficava a cerca de 2.300 km de Jerusalém em linha reta, a 1.950 km de Alexandria e a 1.400 km do centro da Espanha. Pelas medições de Rein Taagepera, o império cobriu cerca de 5 milhões de quilômetros quadrados no auge, sob Trajano, um século depois, e a maior parte disso já era romana em vida de Jesus."
    - "Lucas enquadra o Natal nele: “saiu um decreto da parte de César Augusto para que todo o mundo fosse recenseado”, e data a pregação do Batista “no décimo quinto ano do reinado de Tibério César”. O próprio Augusto listou suas conquistas na inscrição que deixou para o seu túmulo, da Espanha e dos Alpes ao Egito e ao Danúbio, e Tácito conta a guarnição do ano 23 d.C.: vinte e cinco legiões no Reno e no Danúbio, na Espanha, na Dalmácia, na África, no Egito e na Síria, com outros tantos auxiliares, e um cinturão de reis clientes além. A Judeia era um canto disso: província sob um prefeito desde 6 d.C., enquanto a Galileia era governada por Antipas, filho de Herodes, um dos príncipes clientes."
    - "Quantas pessoas viviam nele é uma conjetura. O antigo cálculo de Karl Julius Beloch dava 54 milhões para o ano 14 d.C.; as estimativas recentes para esse ano vão de cerca de 45 a 60 milhões, e até uns 75 milhões no auge, no século II. Um cidadão romano como Paulo podia percorrê-lo todo sob uma só lei e, no Oriente, uma só língua, o grego; podia dizer “Apelo para César!” em Cesareia e ser enviado a Roma, como contam os últimos capítulos de Atos."
  de:
    - "Unter Tiberius (14–37 n. Chr.) reichte das Reich vom Atlantik bis zum Euphrat und von Rhein und Donau bis zur Sahara: ganz Spanien, Gallien, Italien und Griechenland, der größte Teil des Balkans und Kleinasiens, Syrien, Ägypten und die nordafrikanische Küste. Rom, wo der Kartenpunkt liegt, war in der Luftlinie etwa 2300 km von Jerusalem entfernt, 1950 km von Alexandria und 1400 km von der Mitte Spaniens. Nach den Messungen von Rein Taagepera umfasste das Reich unter Trajan, ein Jahrhundert später, auf seinem Höhepunkt etwa 5 Millionen Quadratkilometer, und das meiste davon war schon zu Jesu Lebzeiten römisch."
    - "Lukas rahmt die Weihnachtsgeschichte damit ein: „daß ein Gebot von dem Kaiser Augustus ausging, daß alle Welt geschätzt würde“, und er datiert das Auftreten des Täufers „in dem fünfzehnten Jahr des Kaisertums Kaisers Tiberius“. Augustus selbst zählte seine Eroberungen in der Inschrift auf, die er für sein Grab hinterließ, von Spanien und den Alpen bis Ägypten und zur Donau, und Tacitus zählt die Besatzung des Jahres 23 n. Chr.: fünfundzwanzig Legionen am Rhein und an der Donau, in Spanien, Dalmatien, Afrika, Ägypten und Syrien, mit ebenso vielen Hilfstruppen und einem Ring von Klientelkönigen dahinter. Judäa war ein Winkel davon: seit 6 n. Chr. eine Provinz unter einem Präfekten, während Galiläa von Herodes' Sohn Antipas regiert wurde, einem der Klientelfürsten."
    - "Wie viele Menschen darin lebten, ist eine Schätzung. Die alte Rechnung von Karl Julius Beloch ergab 54 Millionen für das Jahr 14 n. Chr.; neuere Schätzungen für dieses Jahr reichen von etwa 45 bis 60 Millionen und bis zu etwa 75 Millionen auf dem Höhepunkt im 2. Jahrhundert. Ein römischer Bürger wie Paulus konnte das ganze Reich unter einem Recht und im Osten mit einer Sprache, dem Griechischen, bereisen; er konnte in Caesarea sagen: „Ich berufe mich auf den Kaiser!“ und nach Rom geschickt werden, wie es die letzten Kapitel der Apostelgeschichte erzählen."
  fr:
    - "Sous Tibère (14–37 apr. J.-C.), l’Empire allait de l’Atlantique à l’Euphrate et du Rhin et du Danube au Sahara : toute l’Espagne, la Gaule, l’Italie et la Grèce, la plus grande partie des Balkans et de l’Asie Mineure, la Syrie, l’Égypte et la côte d’Afrique du Nord. Rome, où se trouve le point de la carte, était à environ 2 300 km de Jérusalem en ligne droite, à 1 950 km d’Alexandrie et à 1 400 km du centre de l’Espagne. D’après les mesures de Rein Taagepera, l’Empire couvrait environ 5 millions de kilomètres carrés à son apogée sous Trajan, un siècle plus tard, et la plus grande partie en était déjà romaine du vivant de Jésus."
    - "Luc en fait le cadre de la Nativité : « parut un édit de César Auguste, ordonnant un recensement de toute la terre », et il date la prédication du Baptiste de « la quinzième année du règne de Tibère César ». Auguste énuméra lui-même ses conquêtes dans l’inscription laissée pour son tombeau, de l’Espagne et des Alpes à l’Égypte et au Danube, et Tacite compte la garnison de 23 apr. J.-C. : vingt-cinq légions sur le Rhin et le Danube, en Espagne, en Dalmatie, en Afrique, en Égypte et en Syrie, avec autant d’auxiliaires, et au-delà un cercle de rois clients. La Judée n’en était qu’un coin : province gouvernée par un préfet depuis 6 apr. J.-C., tandis que la Galilée avait pour maître Antipas, fils d’Hérode, l’un de ces princes clients."
    - "Combien d’habitants il comptait, on en est réduit à le conjecturer. L’ancien calcul de Karl Julius Beloch donnait 54 millions pour 14 apr. J.-C. ; les estimations récentes pour cette année vont d’environ 45 à 60 millions, et jusqu’à quelque 75 millions à l’apogée, au IIe siècle. Un citoyen romain comme Paul pouvait le parcourir tout entier sous une seule loi et, en Orient, une seule langue, le grec ; il pouvait dire « J’en appelle à César » à Césarée et être envoyé à Rome, comme le racontent les derniers chapitres des Actes."
  pl:
    - "Za Tyberiusza (14–37 n.e.) cesarstwo sięgało od Atlantyku po Eufrat i od Renu i Dunaju po Saharę: cała Hiszpania, Galia, Italia i Grecja, większość Bałkanów i Azji Mniejszej, Syria, Egipt i wybrzeże Afryki Północnej. Rzym, w którym stoi punkt na mapie, leżał około 2300 km od Jerozolimy w linii prostej, 1950 km od Aleksandrii i 1400 km od środka Hiszpanii. Według pomiarów Reina Taagepery cesarstwo zajmowało około 5 milionów km² w największym rozmiarze za Trajana, sto lat później, a większość tego obszaru była rzymska już za życia Jezusa."
    - "Łukasz osadza w nim narodziny Jezusa: „I stało się w one dni, że wyszedł dekret od cesarza Augusta, aby popisano wszystek świat”, a początek nauczania Chrzciciela datuje słowami: „roku piętnastego panowania Tyberyjusza Cesarza”. Sam August wyliczył swoje podboje w inskrypcji pozostawionej dla jego grobowca, od Hiszpanii i Alp po Egipt i Dunaj, a Tacyt podaje załogi wojskowe z 23 n.e.: dwadzieścia pięć legionów nad Renem i Dunajem, w Hiszpanii, Dalmacji, Afryce, Egipcie i Syrii, z równą liczbą oddziałów pomocniczych, a dalej pierścień królów-klientów. Judea była jednym z zakątków tego świata: od 6 n.e. prowincją pod rządami prefekta, podczas gdy Galileą rządził syn Heroda, Antypas, jeden z książąt-klientów."
    - "Ilu ludzi w nim mieszkało, to tylko przypuszczenie. Dawny rachunek Karla Juliusa Belocha dawał 54 miliony na rok 14 n.e.; nowsze szacunki dla tego roku wahają się od około 45 do 60 milionów, a w szczytowym punkcie w II wieku sięgają około 75 milionów. Obywatel rzymski, taki jak Paweł, mógł podróżować po całym cesarstwie na podstawie jednego prawa i, na wschodzie, jednego języka, greki; mógł w Cezarei powiedzieć „apeluję do cesarza” i zostać wysłany do Rzymu, jak opowiadają ostatnie rozdziały Dziejów Apostolskich."
  it:
    - "Sotto Tiberio (14–37 d.C.) l’impero si estendeva dall’Atlantico all’Eufrate e dal Reno e dal Danubio al Sahara: tutta la Spagna, la Gallia, l’Italia e la Grecia, la maggior parte dei Balcani e dell’Asia Minore, la Siria, l’Egitto e la costa nordafricana. Roma, dove si trova il punto della mappa, distava circa 2.300 km da Gerusalemme in linea retta, 1.950 km da Alessandria e 1.400 km dal centro della Spagna. Secondo le misurazioni di Rein Taagepera, l’impero coprì circa 5 milioni di chilometri quadrati al suo massimo sotto Traiano, un secolo dopo, e la maggior parte di quel territorio era già romana durante la vita di Gesù."
    - "Luca vi inquadra la Natività: «un decreto uscì da parte di Cesare Augusto, che si facesse un censimento di tutto l’impero», e data la predicazione del Battista «nell’anno decimoquinto dell’impero di Tiberio Cesare». Augusto stesso elencò le sue conquiste nell’iscrizione lasciata per la propria tomba, dalla Spagna e dalle Alpi all’Egitto e al Danubio, e Tacito conta la guarnigione del 23 d.C.: venticinque legioni sul Reno e sul Danubio, in Spagna, Dalmazia, Africa, Egitto e Siria, con altrettanti ausiliari, e oltre il confine una cintura di re clienti. La Giudea era un angolo di questo mondo: provincia sotto un prefetto dal 6 d.C., mentre la Galilea era governata da Antipa, figlio di Erode, uno dei principi clienti."
    - "Quante persone vi vivessero è una congettura. Il vecchio calcolo di Karl Julius Beloch dava 54 milioni per il 14 d.C.; le stime recenti per quell’anno vanno da circa 45 a 60 milioni, e fino a circa 75 milioni al culmine nel II secolo. Un cittadino romano come Paolo poteva percorrerlo tutto sotto un’unica legge e, in oriente, un’unica lingua, il greco; poteva dire «Io mi appello a Cesare» a Cesarea ed essere mandato a Roma, come raccontano gli ultimi capitoli degli Atti."
  nl:
    - "Onder Tiberius (14–37 n.Chr.) reikte het rijk van de Atlantische Oceaan tot de Eufraat en van de Rijn en de Donau tot de Sahara: heel Spanje, Gallië, Italië en Griekenland, het grootste deel van de Balkan en Klein-Azië, Syrië, Egypte en de Noord-Afrikaanse kust. Rome, waar het punt op de kaart staat, lag hemelsbreed ongeveer 2.300 km van Jeruzalem, 1.950 km van Alexandrië en 1.400 km van het midden van Spanje. Volgens de metingen van Rein Taagepera besloeg het rijk onder Trajanus, een eeuw later, op zijn grootst ongeveer 5 miljoen vierkante kilometer, en het grootste deel daarvan was al in Jezus’ leven Romeins."
    - "Lukas plaatst de geboorte van Jezus erin: “er een gebod uitging van den Keizer Augustus, dat de gehele wereld beschreven zou worden”, en hij dateert de prediking van de Doper “in het vijftiende jaar der regering van den keizer Tiberius”. Augustus zelf somde zijn veroveringen op in het opschrift dat hij voor zijn graf naliet, van Spanje en de Alpen tot Egypte en de Donau, en Tacitus telt de bezetting van 23 n.Chr.: vijfentwintig legioenen aan de Rijn en de Donau, in Spanje, Dalmatië, Afrika, Egypte en Syrië, met evenveel hulptroepen, en daarbuiten een kring van vazalkoningen. Judea was een hoek daarvan: sinds 6 n.Chr. een provincie onder een prefect, terwijl Galilea werd bestuurd door Herodes’ zoon Antipas, een van de vazalvorsten."
    - "Hoeveel mensen er woonden, is gissen. De oude raming van Karl Julius Beloch gaf 54 miljoen voor 14 n.Chr.; recente schattingen voor dat jaar lopen van ongeveer 45 tot 60 miljoen, en tot zo’n 75 miljoen op het hoogtepunt in de tweede eeuw. Een Romeins burger als Paulus kon het hele rijk doorreizen onder één recht en, in het oosten, één taal, het Grieks; hij kon in Caesarea zeggen: “Ik beroep mij op den keizer” en naar Rome worden gezonden, zoals de laatste hoofdstukken van Handelingen vertellen."
  cs:
    - "Za Tiberia (14–37 n. l.) sahala říše od Atlantiku k Eufratu a od Rýna a Dunaje k Sahaře: celé Španělsko, Galie, Itálie a Řecko, většina Balkánu a Malé Asie, Sýrie, Egypt a severoafrické pobřeží. Řím, kde stojí bod na mapě, leží asi 2 300 km vzdušnou čarou od Jeruzaléma, 1 950 km od Alexandrie a 1 400 km od středu Španělska. Podle měření Reina Taagepery pokrývala říše na vrcholu za Traiana, o století později, asi 5 milionů km² a většina z toho byla římská už za Ježíšova života."
    - "Lukáš jí rámuje narození Páně: „vyšlo jest vyrčení od císaře Augusta, aby byl popsán všecken svět“, a kázání Křtitelovo datuje do „léta pak patnáctého císařství Tiberia císaře“. Sám Augustus vypsal své výboje v nápisu, který zanechal pro svou hrobku, od Španělska a Alp po Egypt a Dunaj, a Tacitus uvádí posádky roku 23 n. l.: dvacet pět legií na Rýně a Dunaji, ve Španělsku, Dalmácii, Africe, Egyptě a Sýrii, s právě tolika pomocnými sbory, a za nimi pás klientských králů. Judsko bylo jedním koutem této říše: od roku 6 n. l. provincií pod prefektem, zatímco Galileji spravoval Herodův syn Antipas, jeden z klientských knížat."
    - "Kolik lidí v ní žilo, je dohad. Starý odhad Karla Julia Beloche dával pro rok 14 n. l. 54 milionů; novější odhady pro tento rok jdou od asi 45 do 60 milionů a na vrcholu ve 2. století až k asi 75 milionům. Římský občan jako Pavel mohl procestovat celou říši pod jedním právem a na východě s jedním jazykem, řečtinou; mohl v Cesareji říci „K císaři se odvolávám“ a být poslán do Říma, jak vyprávějí poslední kapitoly Skutků."
  sv:
    - "Under Tiberius (14–37 e.Kr.) sträckte sig riket från Atlanten till Eufrat och från Rhen och Donau till Sahara: hela Spanien, Gallien, Italien och Grekland, större delen av Balkan och Mindre Asien, Syrien, Egypten och Nordafrikas kust. Rom, där kartpunkten står, låg omkring 2 300 km från Jerusalem fågelvägen, 1 950 km från Alexandria och 1 400 km från mitten av Spanien. Enligt Rein Taageperas mätningar täckte riket omkring 5 miljoner kvadratkilometer som störst under Trajanus, ett sekel senare, och det mesta av detta var redan romerskt under Jesu levnad."
    - "Lukas ramar in Jesu födelse med det: ”från kejsar Augustus utgick ett påbud att hela världen skulle skattskrivas”, och han daterar Döparens förkunnelse till ”femtonde året av kejsar Tiberius’ regering”. Augustus själv förtecknade sina erövringar i inskriften han lämnade till sin grav, från Spanien och Alperna till Egypten och Donau, och Tacitus räknar upp garnisonen år 23 e.Kr.: tjugofem legioner vid Rhen och Donau, i Spanien, Dalmatien, Afrika, Egypten och Syrien, med lika många hjälptrupper och en ring av klientkungar bortom dem. Judeen var ett hörn av detta: en provins under en prefekt sedan år 6 e.Kr., medan Galileen styrdes av Herodes son Antipas, en av klientfurstarna."
    - "Hur många människor som levde i riket är en gissning. Karl Julius Belochs gamla beräkning gav 54 miljoner för år 14 e.Kr.; nyare uppskattningar för det året ligger mellan omkring 45 och 60 miljoner, och upp till omkring 75 miljoner vid toppen under 100-talet. En romersk medborgare som Paulus kunde resa genom hela riket under en och samma lag och, i öster, ett enda språk, grekiskan; han kunde säga ”Jag vädjar till kejsaren” i Caesarea och sändas till Rom, som de sista kapitlen i Apostlagärningarna berättar."
  nb:
    - "Under Tiberius (14–37 e.Kr.) rakk riket fra Atlanterhavet til Eufrat og fra Rhinen og Donau til Sahara: hele Spania, Gallia, Italia og Hellas, det meste av Balkan og Lilleasia, Syria, Egypt og den nordafrikanske kysten. Roma, der kartpunktet står, lå omtrent 2 300 km fra Jerusalem i luftlinje, 1 950 km fra Aleksandria og 1 400 km fra midten av Spania. Ifølge Rein Taageperas målinger dekket riket omtrent 5 millioner kvadratkilometer på det største under Trajan, et århundre senere, og det meste av dette var allerede romersk i Jesu levetid."
    - "Lukas rammer inn fødselsfortellingen med det: «det utgikk et bud fra keiser Augustus at all verden skulde innskrives i manntall», og han daterer døperen Johannes' forkynnelse til «det femtende år av keiser Tiberius' regjering». Augustus selv listet opp sine erobringer i innskriften han etterlot for sin grav, fra Spania og Alpene til Egypt og Donau, og Tacitus teller garnisonen i 23 e.Kr.: tjuefem legioner ved Rhinen og Donau, i Spania, Dalmatia, Afrika, Egypt og Syria, med like mange hjelpetropper, og en ring av klientkonger utenfor. Judea var ett hjørne av dette: en provins under en prefekt siden 6 e.Kr., mens Galilea ble styrt av Herodes' sønn Antipas, en av klientfyrstene."
    - "Hvor mange som bodde i det, er et gjett. Karl Julius Belochs gamle beregning ga 54 millioner for 14 e.Kr.; nyere anslag for det året spenner fra omtrent 45 til 60 millioner, og opptil rundt 75 millioner på høydepunktet på 100-tallet. En romersk borger som Paulus kunne reise gjennom hele riket under én lov og, i øst, ett språk, gresk; han kunne si «jeg innanker min sak for keiseren» i Cæsarea og bli sendt til Roma, slik de siste kapitlene i Apostlenes gjerninger forteller."
  tl:
    - "Sa ilalim ni Tiberio (14–37 AD) ang imperyo ay umabot mula sa Atlantiko hanggang sa Eufrates at mula sa Rhin at Danubio hanggang sa Sahara: ang buong Espana, Galia, Italia at Grecia, karamihan ng Balkan at Asia Menor, Siria, Egipto at ang baybayin ng Hilagang Aprika. Ang Roma, kung saan nakatayo ang tuldok sa mapa, ay nasa mga 2,300 km mula sa Jerusalem sa tuwid na guhit, 1,950 km mula sa Alejandria at 1,400 km mula sa gitna ng Espana. Ayon sa mga sukat ni Rein Taagepera, ang imperyo ay sumaklaw ng mga 5 milyong kilometro kuwadrado sa pinakamalaki nito sa ilalim ni Trajano, isang siglo pagkatapos, at ang karamihan niyon ay Romano na noong buhay ni Jesus."
    - "Binabalangkas ito ni Lucas sa pamamagitan nito sa Kapanganakan: “lumabas ang isang utos mula kay Augusto Cesar, na magpatala ang buong sanglibutan”, at itinatakda niya ang pangangaral ng Bautista sa “ikalabinglimang taon ng paghahari ni Tiberio Cesar”. Si Augusto mismo ay naglista ng kaniyang mga pananakop sa inskripsiyong iniwan niya para sa kaniyang libingan, mula sa Espana at sa Alpes hanggang sa Egipto at Danubio, at binibilang ni Tacito ang hukbong bantay noong 23 AD: dalawampu't limang lehiyon sa Rhin at Danubio, sa Espana, Dalmacia, Aprika, Egipto at Siria, na may kasindami ring pantulong na tropa, at isang singsing ng mga haring kliyente sa kabila. Ang Judea ay isang sulok nito: isang lalawigang pinamumunuan ng isang prepekto mula pa noong 6 AD, samantalang ang Galilea ay pinamunuan ng anak ni Herodes na si Antipas, isa sa mga prinsipeng kliyente."
    - "Hula lamang kung ilang tao ang nanirahan dito. Ang lumang pagtataya ni Karl Julius Beloch ay nagbigay ng 54 milyon para sa 14 AD; ang mga kamakailang tantiya para sa taong iyon ay mula mga 45 hanggang 60 milyon, at hanggang mga 75 milyon sa tugatog nito noong ikalawang siglo. Ang isang mamamayang Romano gaya ni Pablo ay makapaglalakbay sa buong imperyo sa ilalim ng iisang batas at, sa silangan, iisang wika, ang Griyego; maaari niyang sabihin ang “Maghahabol ako kay Cesar” sa Cesarea at ipadala sa Roma, gaya ng isinasalaysay ng mga huling kabanata ng Mga Gawa."
  da:
    - "Under Tiberius (14–37 e.Kr.) strakte riget sig fra Atlanterhavet til Eufrat og fra Rhinen og Donau til Sahara: hele Spanien, Gallien, Italien og Grækenland, det meste af Balkan og Lilleasien, Syrien, Egypten og Nordafrikas kyst. Rom, hvor kortets punkt ligger, lå omkring 2.300 km fra Jerusalem i luftlinje, 1.950 km fra Alexandria og 1.400 km fra Spaniens midte. Ifølge Rein Taageperas målinger dækkede riget omkring 5 millioner kvadratkilometer på sit højeste under Trajan, et århundrede senere, og det meste af det var allerede romersk i Jesu levetid."
    - "Lukas rammer Jesu fødsel ind med det: »en Befaling udgik fra Kejser Augustus, at al Verden skulde skrives i Mandtal«, og han daterer Døberens prædiken til »Kejser Tiberius's femtende Regeringsaar«. Augustus opregnede selv sine erobringer i den indskrift, han efterlod til sin grav, fra Spanien og Alperne til Egypten og Donau, og Tacitus opregner garnisonen i 23 e.Kr.: femogtyve legioner ved Rhinen og Donau, i Spanien, Dalmatien, Afrika, Egypten og Syrien, med lige så mange hjælpetropper og en ring af klientkonger udenfor. Judæa var et hjørne af dette: en provins under en præfekt siden 6 e.Kr., mens Galilæa blev styret af Herodes' søn Antipas, en af klientfyrsterne."
    - "Hvor mange mennesker der boede i det, er et gæt. Karl Julius Belochs gamle beregning gav 54 millioner for 14 e.Kr.; nyere overslag for det år går fra omkring 45 til 60 millioner og op til omkring 75 millioner på toppen i 100-tallet. En romersk borger som Paulus kunne rejse gennem hele riget under én lov og i øst på ét sprog, græsk; han kunne sige »Jeg skyder mig ind under Kejseren« i Cæsarea og blive sendt til Rom, som Apostlenes Gerningers sidste kapitler fortæller."
