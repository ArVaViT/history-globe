id: where-was-pergamum
question:
  en: "Where was Pergamum, “where Satan's seat is”?"
  ru: "Где находился Пергам, «где престол сатаны»?"
  uk: "Де був Пергам, «де престол сатани»?"
  es: "¿Dónde estaba Pérgamo, «donde está la silla de Satanás»?"
  pt: "Onde ficava Pérgamo, “onde está o trono de Satanás”?"
  de: "Wo lag Pergamon, „da des Satans Stuhl ist“?"
  fr: "Où se trouvait Pergame, « là où Satan a sa demeure » ?"
  pl: "Gdzie leżał Pergamon, „gdzie jest stolica szatańska”?"
  it: "Dov’era Pergamo, «là dov’è il trono di Satana»?"
  cs: "Kde ležel Pergamon, „kdež jest stolice satanova“?"
  nl: "Waar lag Pergamum, “daar de troon des satans is”?"
  sv: "Var låg Pergamon, ”där varest Satan har sin tron”?"
  nb: "Hvor lå Pergamon, «der hvor Satan har sin trone»?"
  tl: "Nasaan ang Pergamo, “sa kinaroroonan ng luklukan ni Satanas”?"
  da: "Hvor lå Pergamon, »der, hvor Satans Trone er«?"
answer:
  en:
    - "Pergamum is Bergama in western Turkey, in the province of İzmir: the ancient citadel crowns a steep hill above the valley of the Caicus, about 25 km from the Aegean, and the map point stands on it. It lay about 61 km from Thyatira and 79 km from Smyrna in a straight line, and 112 km south-east of Troas. Its Attalid kings made it one of the great capitals of the Hellenistic world, until the last of them left his kingdom to Rome in 133 BC and it became the province of Asia."
    - "Revelation, about AD 95, sends Pergamum the third of the seven letters: “I know thy works, and where thou dwellest, even where Satan's seat is”, and recalls the days “wherein Antipas was my faithful martyr, who was slain among you”. What the seat means is disputed: the great altar of Zeus on the citadel, the temple of Rome and Augustus that the Greeks of Asia were allowed to build here in 29 BC, the sanctuary of Asclepius, whose sign was a serpent, or the city's place as a seat of Roman power. The letter also rebukes those who hold the teaching of Balaam and of the Nicolaitans."
    - "German excavations, begun by Carl Humann in 1878, laid bare the citadel with its steep theatre, its library and the temple of Trajan; the Great Altar was taken to Berlin and rebuilt in the Pergamon Museum. Below the hill lie the Asclepieion, where Galen, born in Pergamum about AD 129, studied medicine, and the Red Basilica, a huge temple of Egyptian gods with a church later built inside it. Pliny, after Varro, says that parchment was invented here, and the site has been on the UNESCO World Heritage List since 2014."
  ru:
    - "Пергам — это нынешняя Бергама на западе Турции, в провинции Измир: древний акрополь венчает крутой холм над долиной Каика, примерно в 25 км от Эгейского моря, и точка карты стоит на нём. Он лежал примерно в 61 км от Фиатиры и в 79 км от Смирны по прямой и в 112 км к юго-востоку от Троады. Цари из династии Атталидов сделали его одной из великих столиц эллинистического мира, пока последний из них не завещал своё царство Риму в 133 г. до н. э. и оно не стало провинцией Асия."
    - "Откровение около 95 г. посылает Пергаму третье из семи посланий: «знаю твои дела, и что ты живешь там, где престол сатаны», — и вспоминает дни, «в которые у вас, где живет сатана, умерщвлен верный свидетель Мой Антипа». Что значит этот престол, спорят: великий алтарь Зевса на акрополе, храм Рима и Августа, который греки Асии получили право построить здесь в 29 г. до н. э., святилище Асклепия, знаком которого был змей, или положение города как оплота римской власти. Послание обличает и тех, кто держится учения Валаама и николаитов."
    - "Немецкие раскопки, начатые Карлом Хуманом в 1878 году, открыли акрополь с крутым театром, библиотекой и храмом Траяна; Пергамский алтарь увезли в Берлин и собрали заново в Пергамском музее. Под холмом лежат Асклепион, где учился медицине Гален, родившийся в Пергаме около 129 г., и Красная базилика — огромный храм египетских богов, внутри которого позже построили церковь. Плиний вслед за Варроном пишет, что здесь изобрели пергамент, а с 2014 года место внесено в Список всемирного наследия ЮНЕСКО."
  uk:
    - "Пергам — це Бергама в західній Туреччині, у провінції Ізмір: давня цитадель вінчає крутий пагорб над долиною Каїка, приблизно за 25 км від Егейського моря, і точка на мапі стоїть на ній. Він лежав приблизно за 61 км від Тіатири і за 79 км від Смирни по прямій, і за 112 км на південний схід від Троади. Його царі з династії Аталідів зробили його однією з великих столиць елліністичного світу, поки останній з них не заповів своє царство Римові 133 р. до н. е. і воно не стало провінцією Азія."
    - "Одкровення, близько 95 р. н. е., надсилає Пергаму третій із семи листів: «Знаю дїла твої, і що ти домуєш, де престол сатани», і згадує дні, «коли Антипа, сьвідок мій вірний, убитий у вас». Що означає цей престол — спірно: великий жертовник Зевса на цитаделі, храм Роми й Августа, який грекам Азії дозволили збудувати тут 29 р. до н. е., святилище Асклепія, чиїм знаком був змій, або місце міста як осідку римської влади. Лист також докоряє тим, хто тримається науки Валаама й ніколаїтів."
    - "Німецькі розкопки, розпочаті Карлом Гуманом 1878 р., відкрили цитадель із крутим театром, бібліотекою та храмом Траяна; Великий жертовник вивезено до Берліна й відбудовано в Пергамському музеї. Під пагорбом лежать Асклепійон, де Гален, народжений у Пергамі близько 129 р. н. е., вивчав медицину, і Червона базиліка — величезний храм єгипетських богів, усередині якого пізніше збудували церкву. Пліній, услід за Варроном, каже, що пергамент винайдено тут, а місце внесено до Списку всесвітньої спадщини ЮНЕСКО від 2014 р."
  es:
    - "Pérgamo es Bergama, en el oeste de Turquía, en la provincia de İzmir: la antigua ciudadela corona una empinada colina sobre el valle del Caico, a unos 25 km del Egeo, y el punto del mapa está sobre ella. Quedaba a unos 61 km de Tiatira y a 79 km de Esmirna en línea recta, y a 112 km al sureste de Troas. Sus reyes atálidas la hicieron una de las grandes capitales del mundo helenístico, hasta que el último de ellos legó su reino a Roma en 133 a. C. y pasó a ser la provincia de Asia."
    - "El Apocalipsis, hacia el 95 d. C., envía a Pérgamo la tercera de las siete cartas: «Yo sé tus obras, y dónde moras, donde está la silla de Satanás», y recuerda «los días en que fué Antipas mi testigo fiel, el cual ha sido muerto entre vosotros». Qué significa la silla se discute: el gran altar de Zeus en la ciudadela, el templo de Roma y Augusto que a los griegos de Asia se les permitió construir aquí en 29 a. C., el santuario de Asclepio, cuyo emblema era una serpiente, o el lugar de la ciudad como sede del poder romano. La carta reprende también a quienes sostienen la doctrina de Balaam y de los nicolaítas."
    - "Las excavaciones alemanas, iniciadas por Carl Humann en 1878, dejaron al descubierto la ciudadela con su empinado teatro, su biblioteca y el templo de Trajano; el Gran Altar fue llevado a Berlín y reconstruido en el Museo de Pérgamo. Bajo la colina se hallan el Asclepeion, donde estudió medicina Galeno, nacido en Pérgamo hacia el 129 d. C., y la Basílica Roja, un enorme templo de dioses egipcios en cuyo interior se construyó más tarde una iglesia. Plinio, siguiendo a Varrón, dice que el pergamino se inventó aquí, y el yacimiento figura en la Lista del Patrimonio Mundial de la UNESCO desde 2014."
  pt:
    - "Pérgamo é Bergama, no oeste da Turquia, na província de İzmir: a antiga cidadela coroa uma colina íngreme acima do vale do Caico, a cerca de 25 km do mar Egeu, e o ponto do mapa fica sobre ela. Ficava a cerca de 61 km de Tiatira e 79 km de Esmirna em linha reta, e a 112 km a sudeste de Trôade. Seus reis atálidas fizeram dela uma das grandes capitais do mundo helenístico, até que o último deles legou o seu reino a Roma em 133 a.C. e ela se tornou a província da Ásia."
    - "O Apocalipse, por volta de 95 d.C., envia a Pérgamo a terceira das sete cartas: “Conheço as suas obras e onde você habita, onde está o trono de Satanás”, e recorda os dias “de Antipas, minha testemunha, meu servo fiel, que foi morto entre vocês”. O que significa o trono é disputado: o grande altar de Zeus na cidadela, o templo de Roma e Augusto que os gregos da Ásia foram autorizados a construir aqui em 29 a.C., o santuário de Asclépio, cujo símbolo era uma serpente, ou o lugar da cidade como sede do poder romano. A carta também repreende os que seguem o ensino de Balaão e dos nicolaítas."
    - "As escavações alemãs, iniciadas por Carl Humann em 1878, revelaram a cidadela com seu teatro íngreme, sua biblioteca e o templo de Trajano; o Grande Altar foi levado para Berlim e reconstruído no Museu de Pérgamo. Abaixo da colina ficam o Asclepeion, onde Galeno, nascido em Pérgamo por volta de 129 d.C., estudou medicina, e a Basílica Vermelha, um enorme templo de deuses egípcios em cujo interior foi construída mais tarde uma igreja. Plínio, seguindo Varrão, diz que o pergaminho foi inventado aqui, e o sítio consta da Lista do Patrimônio Mundial da UNESCO desde 2014."
  de:
    - "Pergamon ist Bergama im Westen der Türkei, in der Provinz İzmir: Die antike Burg krönt einen steilen Hügel über dem Tal des Kaikos, etwa 25 km von der Ägäis entfernt, und der Kartenpunkt steht darauf. Es lag in der Luftlinie etwa 61 km von Thyatira und 79 km von Smyrna sowie 112 km südöstlich von Troas. Seine attalidischen Könige machten es zu einer der großen Hauptstädte der hellenistischen Welt, bis der letzte von ihnen sein Königreich 133 v. Chr. Rom vermachte und es zur Provinz Asia wurde."
    - "Die Offenbarung schickt um 95 n. Chr. Pergamon das dritte der sieben Sendschreiben: „Ich weiß, was du tust und wo du wohnst, da des Satans Stuhl ist“, und erinnert an die Tage, „in welchen Antipas, mein treuer Zeuge, bei euch getötet ist“. Was der Stuhl bedeutet, ist umstritten: der große Zeusaltar auf der Burg, der Tempel für Roma und Augustus, den die Griechen Asiens hier 29 v. Chr. bauen durften, das Heiligtum des Asklepios, dessen Zeichen eine Schlange war, oder die Stellung der Stadt als Sitz der römischen Macht. Das Sendschreiben tadelt auch jene, die an der Lehre Bileams und der Nikolaiten festhalten."
    - "Deutsche Grabungen, 1878 von Carl Humann begonnen, legten die Burg mit ihrem steilen Theater, ihrer Bibliothek und dem Trajanstempel frei; der Große Altar wurde nach Berlin gebracht und im Pergamonmuseum wiederaufgebaut. Unterhalb des Hügels liegen das Asklepieion, wo Galen, um 129 n. Chr. in Pergamon geboren, Medizin studierte, und die Rote Halle, ein riesiger Tempel ägyptischer Götter, in den später eine Kirche gebaut wurde. Plinius sagt nach Varro, dass hier das Pergament erfunden wurde, und die Stätte steht seit 2014 auf der UNESCO-Welterbeliste."
  fr:
    - "Pergame est Bergama, dans l’ouest de la Turquie, dans la province d’Izmir : l’antique citadelle couronne une colline abrupte au-dessus de la vallée du Caïque, à environ 25 km de la mer Égée, et le point de la carte s’y trouve. Elle était à environ 61 km de Thyatire et à 79 km de Smyrne à vol d’oiseau, et à 112 km au sud-est de Troas. Ses rois attalides en firent l’une des grandes capitales du monde hellénistique, jusqu’à ce que le dernier d’entre eux lègue son royaume à Rome en 133 av. J.-C. et qu’elle devienne la province d’Asie."
    - "L’Apocalypse, vers 95 apr. J.-C., adresse à Pergame la troisième des sept lettres : « Je sais où tu demeures, je sais que là est le trône de Satan », et rappelle les jours d’« Antipas, mon témoin fidèle, qui a été mis à mort chez vous ». Ce que désigne le trône est discuté : le grand autel de Zeus sur la citadelle, le temple de Rome et d’Auguste que les Grecs d’Asie furent autorisés à y bâtir en 29 av. J.-C., le sanctuaire d’Asclépios, dont l’emblème était un serpent, ou la place de la ville comme siège du pouvoir romain. La lettre reproche aussi à certains de s’attacher à la doctrine de Balaam et à celle des Nicolaïtes."
    - "Les fouilles allemandes, commencées par Carl Humann en 1878, ont dégagé la citadelle avec son théâtre à pic, sa bibliothèque et le temple de Trajan ; le Grand Autel fut emporté à Berlin et reconstruit au musée de Pergame. Au pied de la colline se trouvent l’Asklépieion, où Galien, né à Pergame vers 129 apr. J.-C., étudia la médecine, et la Basilique rouge, immense temple de divinités égyptiennes dans lequel une église fut bâtie plus tard. Pline, d’après Varron, dit que le parchemin fut inventé ici, et le site est inscrit sur la liste du patrimoine mondial de l’UNESCO depuis 2014."
  pl:
    - "Pergamon to Bergama w zachodniej Turcji, w prowincji Izmir: starożytna cytadela wieńczy stromo wzgórze nad doliną Kaikosu, około 25 km od Morza Egejskiego, i na niej stoi punkt na mapie. Leżał około 61 km od Tiatyry i 79 km od Smyrny w linii prostej oraz 112 km na południowy wschód od Troady. Jego królowie Attalidzi uczynili z niego jedną z wielkich stolic świata hellenistycznego, aż ostatni z nich zostawił swoje królestwo Rzymowi w 133 p.n.e. i stało się ono prowincją Azja."
    - "Apokalipsa, około 95 n.e., posyła Pergamonowi trzeci z siedmiu listów: „Znam uczynki twoje i gdzie mieszkasz, to jest, gdzie jest stolica szatańska”, i przypomina „w one dni, w które Antypas, świadek mój wierny, zabity jest u was”. Co znaczy ta stolica, jest sporne: wielki ołtarz Zeusa na cytadeli, świątynia Romy i Augusta, którą Grecy z Azji mogli tu zbudować w 29 p.n.e., sanktuarium Asklepiosa, którego znakiem był wąż, albo miejsce miasta jako siedziby rzymskiej władzy. List gani też tych, którzy trzymają naukę Balaama i nikolaitów."
    - "Niemieckie wykopaliska, rozpoczęte przez Carla Humanna w 1878, odsłoniły cytadelę ze stromym teatrem, biblioteką i świątynią Trajana; Wielki Ołtarz zabrano do Berlina i odbudowano w Muzeum Pergamońskim. Pod wzgórzem leżą Asklepiejon, gdzie studiował medycynę Galen, urodzony w Pergamonie około 129 n.e., i Czerwona Bazylika, ogromna świątynia bóstw egipskich, w której później zbudowano kościół. Pliniusz, za Warronem, mówi, że pergamin wynaleziono tutaj, a stanowisko od 2014 roku znajduje się na Liście światowego dziedzictwa UNESCO."
  it:
    - "Pergamo è Bergama nella Turchia occidentale, nella provincia di İzmir: l’antica cittadella corona una ripida collina sopra la valle del Caico, a circa 25 km dall’Egeo, e il punto della mappa si trova su di essa. Distava circa 61 km da Tiatira e 79 km da Smirne in linea d’aria, e 112 km a sud-est di Troade. I suoi re attalidi ne fecero una delle grandi capitali del mondo ellenistico, finché l’ultimo di loro lasciò il suo regno a Roma nel 133 a.C. ed essa divenne la provincia d’Asia."
    - "L’Apocalisse, intorno al 95 d.C., manda a Pergamo la terza delle sette lettere: «Io conosco dove tu abiti, cioè là dov’è il trono di Satana», e ricorda i «giorni in cui Antipa, il mio fedel testimone, fu ucciso tra voi». Che cosa significhi il trono è discusso: il grande altare di Zeus sulla cittadella, il tempio di Roma e di Augusto che i Greci d’Asia ebbero il permesso di costruire qui nel 29 a.C., il santuario di Asclepio, il cui segno era un serpente, oppure il posto della città come sede del potere romano. La lettera rimprovera anche coloro che professano la dottrina di Balaam e dei Nicolaiti."
    - "Gli scavi tedeschi, iniziati da Carl Humann nel 1878, hanno messo in luce la cittadella con il suo ripido teatro, la sua biblioteca e il tempio di Traiano; il Grande Altare fu portato a Berlino e ricostruito nel Pergamonmuseum. Ai piedi della collina si trovano l’Asclepieion, dove Galeno, nato a Pergamo verso il 129 d.C., studiò medicina, e la Basilica Rossa, un enorme tempio di divinità egizie con una chiesa costruita in seguito al suo interno. Plinio, sulla scorta di Varrone, dice che la pergamena fu inventata qui, e il sito è nella Lista del Patrimonio mondiale dell’UNESCO dal 2014."
  cs:
    - "Pergamon je Bergama v západním Turecku, v provincii İzmir: starověká akropole korunuje strmý pahorek nad údolím řeky Kaikos, asi 25 km od Egejského moře, a stojí na ní bod na mapě. Ležel vzdušnou čarou asi 61 km od Tyatiry, 79 km od Smyrny a 112 km jihovýchodně od Troady. Jeho králové z dynastie Attalovců z něj učinili jedno z velkých hlavních měst helénistického světa, až poslední z nich roku 133 př. n. l. odkázal své království Římu a stalo se provincií Asie."
    - "Zjevení, asi roku 95 n. l., posílá Pergamonu třetí ze sedmi listů: „Vím skutky tvé, i kde bydlíš, totiž tu, kdež jest stolice satanova“, a připomíná dny, „když Antipas, svědek můj věrný, zamordován jest u vás“. Co stolice znamená, je sporné: velký oltář Diův na akropoli, chrám Romy a Augusta, který směli Řekové z Asie zde roku 29 př. n. l. postavit, svatyně Asklépiova, jehož znamením byl had, nebo postavení města jako sídla římské moci. List také kárá ty, kdo drží učení Bileámovo a nikolaitů."
    - "Německé vykopávky, které roku 1878 zahájil Carl Humann, odkryly akropoli se strmým divadlem, knihovnou a Traianovým chrámem; Velký oltář byl odvezen do Berlína a znovu vystavěn v Pergamonském muzeu. Pod pahorkem leží Asklépieion, kde studoval medicínu Galénos, narozený v Pergamonu kolem roku 129 n. l., a Červená bazilika, obrovský chrám egyptských bohů s kostelem později vystavěným uvnitř. Plinius podle Varrona říká, že zde byl vynalezen pergamen, a lokalita je od roku 2014 na seznamu světového dědictví UNESCO."
  nl:
    - "Pergamum is Bergama in het westen van Turkije, in de provincie İzmir: de oude burcht kroont een steile heuvel boven het dal van de Caicus, ongeveer 25 km van de Egeïsche Zee, en het punt op de kaart staat erop. Het lag hemelsbreed ongeveer 61 km van Thyatira en 79 km van Smyrna, en 112 km ten zuidoosten van Troas. Zijn Attalidische koningen maakten het tot een van de grote hoofdsteden van de hellenistische wereld, totdat de laatste van hen zijn koninkrijk in 133 v.Chr. aan Rome naliet en het de provincie Asia werd."
    - "De Openbaring stuurt Pergamum omstreeks 95 n.Chr. de derde van de zeven brieven: “Ik weet uw werken, en waar gij woont; namelijk daar de troon des satans is”, en herinnert aan de dagen “in welke Antipas, Mijn getrouwe getuige was, welke gedood is bij ulieden”. Wat de troon betekent, is omstreden: het grote altaar van Zeus op de burcht, de tempel van Rome en Augustus die de Grieken van Asia hier in 29 v.Chr. mochten bouwen, het heiligdom van Asclepius, wiens teken een slang was, of de positie van de stad als zetel van de Romeinse macht. De brief bestraft ook wie de leer van Bileam en van de Nikolaïeten aanhangen."
    - "Duitse opgravingen, in 1878 begonnen door Carl Humann, legden de burcht bloot met zijn steile theater, zijn bibliotheek en de tempel van Trajanus; het Grote Altaar werd naar Berlijn gebracht en herbouwd in het Pergamonmuseum. Onder de heuvel liggen het Asclepieion, waar Galenus, omstreeks 129 n.Chr. in Pergamum geboren, geneeskunde studeerde, en de Rode Basiliek, een enorme tempel van Egyptische goden waarin later een kerk werd gebouwd. Plinius zegt, naar Varro, dat perkament hier werd uitgevonden, en de plaats staat sinds 2014 op de Werelderfgoedlijst van UNESCO."
  sv:
    - "Pergamon är Bergama i västra Turkiet, i provinsen İzmir: den antika akropolis kröner en brant kulle ovanför Kaikosdalen, omkring 25 km från Egeiska havet, och kartpunkten står på den. Den låg omkring 61 km från Tyatira och 79 km från Smyrna i fågelvägen, och 112 km sydost om Troas. Dess attalidiska kungar gjorde den till en av den hellenistiska världens stora huvudstäder, tills den siste av dem testamenterade sitt rike åt Rom år 133 f.Kr. och det blev provinsen Asien."
    - "Uppenbarelseboken, omkring år 95 e.Kr., sänder Pergamon det tredje av de sju breven: ”Jag vet var du bor: där varest Satan har sin tron”, och påminner om dagarna då ”Antipas, mitt vittne, min trogne tjänare, blev dräpt hos eder”. Vad tronen betyder är omstritt: Zeus stora altare på akropolis, templet för Rom och Augustus som grekerna i Asien fick bygga här år 29 f.Kr., Asklepios helgedom, vars tecken var en orm, eller stadens plats som säte för romersk makt. Brevet tillrättavisar också dem som håller fast vid Bileams lära och nikolaiternas."
    - "Tyska utgrävningar, påbörjade av Carl Humann 1878, frilade akropolis med dess branta teater, dess bibliotek och Trajanustemplet; Stora altaret fördes till Berlin och återuppbyggdes i Pergamonmuseet. Nedanför kullen ligger Asklepieion, där Galenos, född i Pergamon omkring år 129 e.Kr., studerade medicin, och Röda basilikan, ett enormt tempel för egyptiska gudar med en kyrka som senare byggdes inuti. Plinius säger efter Varro att pergament uppfanns här, och platsen står sedan 2014 på Unescos världsarvslista."
  nb:
    - "Pergamon er Bergama i Vest-Tyrkia, i provinsen İzmir: den antikke citadellet kroner en bratt høyde over Kaikos-dalen, omtrent 25 km fra Egeerhavet, og kartpunktet står på den. Den lå omtrent 61 km fra Tyatira og 79 km fra Smyrna i luftlinje, og 112 km sørøst for Troas. Dens attalidiske konger gjorde den til en av den hellenistiske verdens store hovedsteder, til den siste av dem testamenterte riket sitt til Roma i 133 f.Kr. og det ble provinsen Asia."
    - "Johannes’ Åpenbaring, omkring 95 e.Kr., sender Pergamon det tredje av de syv brevene: «Jeg vet hvor du bor, der hvor Satan har sin trone», og minner om dagene «da Antipas var mitt trofaste vidne, han som blev slått ihjel hos eder». Hva tronen betyr, er omdiskutert: Zevs’ store alter på citadellet, tempelet for Roma og Augustus som grekerne i Asia fikk bygge her i 29 f.Kr., Asklepios-helligdommen, hvis tegn var en slange, eller byens stilling som sete for romersk makt. Brevet refser også dem som holder fast ved Bileams og nikolaittenes lære."
    - "Tyske utgravninger, påbegynt av Carl Humann i 1878, avdekket citadellet med det bratte teatret, biblioteket og Trajans tempel; Det store alteret ble ført til Berlin og gjenreist i Pergamonmuseet. Under høyden ligger Asklepieion, der Galen, født i Pergamon omkring 129 e.Kr., studerte medisin, og Den røde basilika, et enormt tempel for egyptiske guder med en kirke bygd inni seg senere. Plinius sier, etter Varro, at pergament ble oppfunnet her, og stedet har stått på UNESCOs verdensarvliste siden 2014."
  tl:
    - "Ang Pergamo ay ang Bergama sa kanlurang Turkey, sa lalawigan ng İzmir: ang sinaunang kuta ay nasa tuktok ng matarik na burol sa ibabaw ng lambak ng Caicus, mga 25 km mula sa Dagat Aegeo, at naroon ang punto sa mapa. Mga 61 km ito mula sa Tiatira at 79 km mula sa Smirna sa tuwid na guhit, at 112 km sa timog-silangan ng Troas. Ginawa itong isa sa mga dakilang kabisera ng daigdig Helenistiko ng mga haring Attalida nito, hanggang iwan ng huli sa kanila ang kaniyang kaharian sa Roma noong 133 BK at maging lalawigan ng Asia."
    - "Ang Apocalipsis, mga 95 AD, ay nagpapadala sa Pergamo ng ikatlo sa pitong liham: “Nalalaman ko kung saan ka tumatahan, sa makatuwid baga'y sa kinaroroonan ng luklukan ni Satanas”, at ginugunita ang mga araw “ni Antipas na aking saksi, aking taong tapat, na pinatay sa gitna ninyo”. Pinagtatalunan kung ano ang kahulugan ng luklukan: ang dakilang altar ni Zeus sa kuta, ang templo ng Roma at Augusto na pinahintulutang itayo rito ng mga Griyego ng Asia noong 29 BK, ang santuwaryo ni Asclepius na ang sagisag ay ahas, o ang lugar ng lungsod bilang luklukan ng kapangyarihang Romano. Sinasaway rin ng liham ang mga humahawak sa aral ni Balaam at ng mga Nicolaita."
    - "Ang mga paghuhukay ng mga Aleman, na sinimulan ni Carl Humann noong 1878, ay naglantad sa kuta na may matarik nitong teatro, aklatan at templo ni Trajan; ang Dakilang Altar ay dinala sa Berlin at itinayong muli sa Pergamon Museum. Sa ibaba ng burol ang Asclepieion, kung saan nag-aral ng medisina si Galen, na ipinanganak sa Pergamo noong mga 129 AD, at ang Pulang Basilika, isang malaking templo ng mga diyos ng Egipto na may simbahang itinayo sa loob nito nang huli. Sinasabi ni Plinio, kasunod ni Varro, na dito naimbento ang pergamino, at nasa Listahan ng Pamanang Pandaigdig ng UNESCO ang pook mula noong 2014."
  da:
    - "Pergamon er Bergama i det vestlige Tyrkiet, i provinsen İzmir: Den antikke borg kroner en stejl bakke over Kaikos-dalen, ca. 25 km fra Ægæerhavet, og kortets punkt står på den. Den lå ca. 61 km fra Thyatira og 79 km fra Smyrna i fugleflugt og 112 km sydøst for Troas. Dens attalidiske konger gjorde den til en af den hellenistiske verdens store hovedstæder, indtil den sidste af dem i 133 f.Kr. testamenterede sit rige til Rom, og det blev provinsen Asia."
    - "Johannes’ Åbenbaring, omkring 95 e.Kr., sender Pergamon det tredje af de syv breve: »Jeg ved, hvor du bor, der, hvor Satans Trone er«, og minder om dagene »i Antipas’s, mit tro Vidnes Dage, han, som blev ihjelslaaet hos eder«. Hvad tronen betyder, er omstridt: Zeus’ store alter på borgen, templet for Rom og Augustus, som grækerne i Asia fik lov til at bygge her i 29 f.Kr., Asklepios’ helligdom, hvis tegn var en slange, eller byens stilling som sæde for romersk magt. Brevet irettesætter også dem, der holder fast ved Bileams og nikolaiternes lære."
    - "Tyske udgravninger, påbegyndt af Carl Humann i 1878, blotlagde borgen med dens stejle teater, dens bibliotek og Trajans tempel; Det Store Alter blev ført til Berlin og genopbygget i Pergamonmuseet. Neden for bakken ligger Asklepieion, hvor Galen, født i Pergamon omkring 129 e.Kr., studerede medicin, og Den Røde Basilika, et kæmpe tempel for egyptiske guder med en kirke senere bygget indeni. Plinius siger efter Varro, at pergament blev opfundet her, og stedet har stået på UNESCOs verdensarvsliste siden 2014."
