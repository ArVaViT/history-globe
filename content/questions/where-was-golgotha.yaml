id: where-was-golgotha
question:
  en: "Where was Golgotha, and where is Gethsemane?"
  ru: "Где находилась Голгофа и где Гефсимания?"
  uk: "Де була Голгофа і де Гетсиманія?"
  es: "¿Dónde estaba el Gólgota y dónde está Getsemaní?"
  pt: "Onde ficava o Gólgota, e onde fica o Getsêmani?"
  de: "Wo lag Golgatha, und wo liegt Gethsemane?"
  fr: "Où se trouvait le Golgotha, et où est Gethsémané ?"
  pl: "Gdzie leżała Golgota i gdzie jest Getsemani?"
  it: "Dov’era il Golgota, e dov’è Getsemani?"
  cs: "Kde ležela Golgota a kde jsou Getsemane?"
  nl: "Waar lag Golgota, en waar ligt Getsemane?"
  sv: "Var låg Golgota, och var ligger Getsemane?"
  nb: "Hvor lå Golgata, og hvor ligger Getsemane?"
  tl: "Nasaan ang Golgota, at nasaan ang Getsemani?"
answer:
  en:
    - "The site of Golgotha is not known for certain. The map puts it at the Church of the Holy Sepulchre in the Old City of Jerusalem, the place venerated since the fourth century and the one most scholars accept; since the nineteenth century others have proposed Gordon's Calvary, a skull-shaped cliff with the Garden Tomb beside it, north of the Damascus Gate. The place card lists three candidates: the church, a spot just south of it, and Gordon's Calvary. Gethsemane lay across the Kidron valley at the foot of the Mount of Olives, about a kilometre east of the traditional Golgotha."
    - 'The Gospels say little about the place: Jesus "went forth into a place called the place of a skull, which is called in the Hebrew Golgotha"; it "was nigh to the city", and "in the place where he was crucified there was a garden; and in the garden a new sepulchre". Hebrews adds that he "suffered without the gate". No Gospel calls Golgotha a hill. Eusebius, in the early fourth century, placed Golgotha north of Mount Zion, and in 335 the church that Constantine built over the rock and the tomb was dedicated; Eusebius says the tomb was found when a pagan temple on the spot was pulled down. Excavations inside the church have shown that the site was a disused quarry with rock-cut tombs, which lay outside the city wall of Jesus'' day.'
    - 'The skull-shaped hill was first proposed by Otto Thenius in 1842 and made famous by General Charles Gordon in 1883; against it, Gabriel Barkay dated the Garden Tomb to the eighth or seventh century BC, centuries before Jesus, while its defenders still hold to the site. Gethsemane is firmer in its general position though not in its exact spot: Jesus "went forth with his disciples over the brook Cedron, where was a garden", and Matthew names it "a place called Gethsemane"; the gardens shown today lie beside the road up the Mount of Olives, and the traditions differ as to which is the place.'
  ru:
    - "Место Голгофы точно неизвестно. Карта помещает её в храме Гроба Господня в Старом городе Иерусалима — там, где её почитают с IV века; это место принимает большинство учёных, а с XIX века другие предлагают «Голгофу Гордона», похожую на череп скалу с Садовой гробницей рядом, к северу от Дамасских ворот. В карточке места три кандидата: храм, место чуть южнее него и «Голгофа Гордона». Гефсимания лежала за долиной Кедрона у подножия горы Елеонской, примерно в километре к востоку от традиционной Голгофы."
    - "Евангелия говорят о месте немного: Иисус «вышел на место, называемое Лобное, по-еврейски Голгофа»; оно «было недалеко от города», и «на том месте, где Он распят, был сад, и в саду гроб новый». Послание к Евреям добавляет, что Он «пострадал вне врат». Ни одно Евангелие не называет Голгофу горой. Евсевий в начале IV века помещал Голгофу к северу от горы Сион, а в 335 году был освящён храм, который Константин построил над скалой и гробницей; Евсевий пишет, что гробницу нашли, когда снесли стоявший на этом месте языческий храм. Раскопки внутри храма показали, что здесь была заброшенная каменоломня с высеченными в скале гробницами, лежавшая вне городской стены времён Иисуса."
    - "Холм, похожий на череп, первым предложил Отто Тениус в 1842 году, а прославил генерал Чарльз Гордон в 1883 году; против этого места говорит то, что Габриэль Баркай датировал Садовую гробницу VIII или VII веком до н. э., за столетия до Иисуса, хотя его сторонники держатся своего мнения. С Гефсиманией яснее в общем положении, но не в точном месте: Иисус «вышел с учениками Своими за поток Кедрон, где был сад», а Матфей называет его «место, называемое Гефсимания»; сады, которые показывают сегодня, лежат у дороги на гору Елеонскую, и предания расходятся в том, какой из них и есть то место."
  uk:
    - "Місце Голгофи достеменно не відоме. Мапа розміщує її біля храму Гробу Господнього в Старому місті Єрусалима — місця, яке шанують із IV ст. і яке визнає більшість учених; з XIX ст. інші пропонували Голгофу Гордона — скелю у формі черепа з Садовою гробницею поруч, на північ від Дамаських воріт. У картці місця наведено трьох кандидатів: храм, місце трохи на південь від нього та Голгофу Гордона. Гетсиманія лежала за долиною Кедрону, біля підніжжя Оливкової гори, приблизно за кілометр на схід від традиційної Голгофи."
    - "Євангелія мало кажуть про це місце: Ісус «вийшов Він на врочище (місце) Черепове, що зветь ся по єврейськи Голгота»; воно було «поблизу города», і «на місцї, де розпято Його, сад, а в саду новий гріб». Послання до євреїв додає, що він «осторонь воріт пострадав». Жодне з Євангелій не називає Голгофу пагорбом. Євсевій на початку IV ст. розміщував Голгофу на північ від гори Сіон, а 335 р. було освячено храм, який Костянтин збудував над скелею та гробницею; Євсевій каже, що гробницю знайшли, коли розібрали язичницький храм на цьому місці. Розкопки всередині храму показали, що місце було занедбаним кар'єром із вирубаними в скелі гробницями, які лежали поза міським муром за часів Ісуса."
    - "Пагорб у формі черепа вперше запропонував Отто Тениус 1842 року, а широко відомим його зробив генерал Чарльз Гордон 1883 року; проти цього Ґабріель Баркай датував Садову гробницю VIII або VII ст. до н. е., за століття до Ісуса, хоч її прихильники досі тримаються цього місця. Загальне розташування Гетсиманії певніше, хоч і не точне місце: Ісус «вийшов з учениками своїми за потік Кедрон, де був сад», а Матвій називає його «врочище Гетсиман»; сади, які показують нині, лежать біля дороги на Оливкову гору, і традиції розходяться щодо того, який із них те місце."
  es:
    - "El emplazamiento del Gólgota no se conoce con certeza. El mapa lo sitúa en la iglesia del Santo Sepulcro, en la Ciudad Vieja de Jerusalén, el lugar venerado desde el siglo IV y el que aceptan la mayoría de los estudiosos; desde el siglo XIX otros han propuesto el Calvario de Gordon, un risco con forma de calavera con la Tumba del Jardín junto a él, al norte de la puerta de Damasco. La ficha del lugar enumera tres candidatos: la iglesia, un punto situado justo al sur de ella y el Calvario de Gordon. Getsemaní estaba al otro lado del valle del Cedrón, al pie del monte de los Olivos, a un kilómetro al este del Gólgota tradicional."
    - "Los Evangelios dicen poco del lugar: Jesús «salió al lugar que se dice de la Calavera, y en hebreo, Gólgotha»; «era cerca de la ciudad», y «en aquel lugar donde había sido crucificado, había un huerto; y en el huerto un sepulcro nuevo». Hebreos añade que «padeció fuera de la puerta». Ningún Evangelio llama colina al Gólgota. Eusebio, a principios del siglo IV, situó el Gólgota al norte del monte Sion, y en 335 se dedicó la iglesia que Constantino construyó sobre la roca y el sepulcro; Eusebio dice que el sepulcro se halló al derribar un templo pagano que había en el lugar. Las excavaciones en el interior de la iglesia han mostrado que el sitio era una cantera abandonada con tumbas excavadas en la roca, que quedaba fuera de la muralla de la ciudad en tiempos de Jesús."
    - "La colina con forma de calavera fue propuesta por primera vez por Otto Thenius en 1842 y la hizo famosa el general Charles Gordon en 1883; frente a ella, Gabriel Barkay fechó la Tumba del Jardín en el siglo VIII o VII a. C., siglos antes de Jesús, aunque sus defensores siguen aferrados al lugar. Getsemaní es más firme en su posición general, aunque no en su punto exacto: Jesús «salióse con sus discípulos tras el arroyo de Cedrón, donde estaba un huerto», y Mateo lo nombra como «la aldea que se llama Gethsemaní»; los huertos que se muestran hoy están junto al camino que sube al monte de los Olivos, y las tradiciones difieren sobre cuál es el lugar."
  pt:
    - "O sítio do Gólgota não é conhecido com certeza. O mapa o situa na Igreja do Santo Sepulcro, na Cidade Velha de Jerusalém, o lugar venerado desde o século IV e o que a maioria dos estudiosos aceita; desde o século XIX outros propuseram o Calvário de Gordon, um penhasco em forma de caveira com o Túmulo do Jardim ao lado, ao norte da Porta de Damasco. A ficha do lugar relaciona três candidatos: a igreja, um ponto logo ao sul dela e o Calvário de Gordon. O Getsêmani ficava do outro lado do vale do Cedrom, ao pé do monte das Oliveiras, a cerca de um quilômetro a leste do Gólgota tradicional."
    - "Os Evangelhos dizem pouco sobre o lugar: Jesus saiu “para o lugar chamado ‘Lugar da Caveira’, que em hebraico é chamado ‘Gólgota’”; ficava “perto da cidade”, e “no lugar onde ele foi crucificado havia um jardim. No jardim havia um sepulcro novo”. Hebreus acrescenta que ele “sofreu fora da porta”. Nenhum Evangelho chama o Gólgota de colina. Eusébio, no início do século IV, situou o Gólgota ao norte do monte Sião, e em 335 foi dedicada a igreja que Constantino construiu sobre a rocha e o túmulo; Eusébio diz que o túmulo foi encontrado quando se demoliu um templo pagão que havia no local. Escavações no interior da igreja mostraram que o sítio era uma pedreira em desuso com túmulos escavados na rocha, que ficavam fora da muralha da cidade do tempo de Jesus."
    - "A colina em forma de caveira foi proposta pela primeira vez por Otto Thenius em 1842 e tornada famosa pelo general Charles Gordon em 1883; contra ela, Gabriel Barkay datou o Túmulo do Jardim do século VIII ou VII a.C., séculos antes de Jesus, embora os seus defensores ainda mantenham o sítio. O Getsêmani é mais firme em sua posição geral, embora não em seu ponto exato: Jesus “saiu com os seus discípulos para o outro lado do ribeiro de Cedrom, onde havia um jardim”, e Mateus o chama “um lugar chamado Getsêmani”; os jardins mostrados hoje ficam junto à estrada que sobe o monte das Oliveiras, e as tradições divergem sobre qual deles é o lugar."
  de:
    - "Die Lage von Golgatha ist nicht sicher bekannt. Die Karte setzt es an die Grabeskirche in der Altstadt von Jerusalem, den seit dem 4. Jahrhundert verehrten Ort, den die meisten Gelehrten annehmen; seit dem 19. Jahrhundert haben andere Gordons Kalvarienberg vorgeschlagen, einen schädelförmigen Felsen mit dem Gartengrab daneben, nördlich des Damaskustors. Die Ortskarte führt drei Kandidaten auf: die Kirche, eine Stelle unmittelbar südlich davon und Gordons Kalvarienberg. Gethsemane lag jenseits des Kidrontals am Fuß des Ölbergs, etwa einen Kilometer östlich des traditionellen Golgatha."
    - "Die Evangelien sagen wenig über den Ort: Jesus „ging hinaus zur Stätte, die da heißt Schädelstätte, welche heißt auf hebräisch Golgatha“; sie war „nahe bei der Stadt“, und „an der Stätte, da er gekreuzigt ward, ein Garten, und im Garten ein neues Grab“. Der Hebräerbrief fügt hinzu, er habe „gelitten draußen vor dem Tor“. Kein Evangelium nennt Golgatha einen Hügel. Eusebius setzte Golgatha Anfang des 4. Jahrhunderts nördlich des Bergs Zion an, und 335 wurde die Kirche geweiht, die Konstantin über dem Felsen und dem Grab errichtet hatte; Eusebius sagt, das Grab sei gefunden worden, als ein heidnischer Tempel an der Stelle abgerissen wurde. Grabungen in der Kirche haben gezeigt, dass der Ort ein aufgelassener Steinbruch mit Felsgräbern war, der zur Zeit Jesu außerhalb der Stadtmauer lag."
    - "Den schädelförmigen Hügel schlug erstmals 1842 Otto Thenius vor, und 1883 machte ihn General Charles Gordon berühmt; dagegen datierte Gabriel Barkay das Gartengrab ins 8. oder 7. Jahrhundert v. Chr., Jahrhunderte vor Jesus, während seine Verfechter am Ort festhalten. Gethsemane ist in seiner ungefähren Lage gesicherter, wenn auch nicht an der genauen Stelle: „Da Jesus solches geredet hatte, ging er hinaus mit seinen Jüngern über den Bach Kidron; da war ein Garten“, und bei Matthäus kommt er „zu einem Hofe, der hieß Gethsemane“; die heute gezeigten Gärten liegen an der Straße den Ölberg hinauf, und die Überlieferungen gehen darin auseinander, welcher der Ort ist."
  fr:
    - "L’emplacement du Golgotha n’est pas connu avec certitude. La carte le place à l’église du Saint-Sépulcre, dans la vieille ville de Jérusalem, lieu vénéré depuis le IVe siècle et celui que retiennent la plupart des spécialistes ; depuis le XIXe siècle, d’autres ont proposé le Calvaire de Gordon, une falaise en forme de crâne, avec le Tombeau du Jardin à ses côtés, au nord de la porte de Damas. La fiche du lieu énumère trois candidats : l’église, un point situé juste au sud, et le Calvaire de Gordon. Gethsémané se trouvait de l’autre côté de la vallée du Cédron, au pied du mont des Oliviers, à environ un kilomètre à l’est du Golgotha traditionnel."
    - "Les Évangiles disent peu de chose du lieu : Jésus « arriva au lieu du crâne, qui se nomme en hébreu Golgotha » ; il « était près de la ville », et « il y avait un jardin dans le lieu où Jésus avait été crucifié, et dans le jardin un sépulcre neuf ». L’épître aux Hébreux ajoute qu’il « a souffert hors de la porte ». Aucun Évangile n’appelle le Golgotha une colline. Eusèbe, au début du IVe siècle, plaçait le Golgotha au nord du mont Sion, et en 335 fut dédiée l’église que Constantin avait fait bâtir sur le rocher et le tombeau ; Eusèbe dit que le tombeau fut retrouvé quand on démolit un temple païen élevé en ce lieu. Les fouilles menées à l’intérieur de l’église ont montré que le site était une carrière abandonnée, avec des tombes creusées dans le roc, située hors de l’enceinte de la ville au temps de Jésus."
    - "La colline en forme de crâne fut proposée pour la première fois par Otto Thenius en 1842 et rendue célèbre par le général Charles Gordon en 1883 ; contre cette hypothèse, Gabriel Barkay a daté le Tombeau du Jardin du VIIIe ou du VIIe siècle av. J.-C., soit des siècles avant Jésus, tandis que ses défenseurs restent attachés au site. Gethsémané est plus assuré dans sa position générale que dans son emplacement exact : Jésus « alla avec ses disciples de l’autre côté du torrent du Cédron, où se trouvait un jardin », et Matthieu le nomme « un lieu appelé Gethsémané » ; les jardins que l’on montre aujourd’hui bordent la route qui monte au mont des Oliviers, et les traditions diffèrent sur celui qui est le lieu."
  pl:
    - "Położenie Golgoty nie jest znane z pewnością. Mapa umieszcza ją przy kościele Grobu Pańskiego w Starym Mieście Jerozolimy, w miejscu czczonym od IV wieku i przyjmowanym przez większość uczonych; od XIX wieku inni proponują Kalwarię Gordona, skałę w kształcie czaszki z Grobem Ogrodowym obok, na północ od Bramy Damasceńskiej. Karta miejsca wymienia trzech kandydatów: kościół, punkt tuż na południe od niego i Kalwarię Gordona. Getsemani leżało za doliną Cedronu, u stóp Góry Oliwnej, około kilometra na wschód od tradycyjnej Golgoty."
    - "Ewangelie mówią o tym miejscu niewiele: Jezus „wyszedł na ono miejsce, które zwano trupich głów, a po żydowsku zowią je Golgota”; „blisko miasta było ono miejsce”, a „był na onem miejscu, gdzie był ukrzyżowany, ogród, a w ogrodzie grób nowy”. List do Hebrajczyków dodaje, że „za bramą ucierpiał”. Żadna Ewangelia nie nazywa Golgoty wzgórzem. Euzebiusz na początku IV wieku umieszczał Golgotę na północ od góry Syjon, a w 335 poświęcono kościół, który Konstantyn zbudował nad skałą i grobem; Euzebiusz pisze, że grób odnaleziono, gdy zburzono pogańską świątynię stojącą w tym miejscu. Wykopaliska wewnątrz kościoła wykazały, że miejsce było nieczynnym kamieniołomem z grobami wykutymi w skale, które leżały poza murem miejskim z czasów Jezusa."
    - "Wzgórze w kształcie czaszki zaproponował po raz pierwszy Otto Thenius w 1842 roku, a rozsławił generał Charles Gordon w 1883; Gabriel Barkay datował Grób Ogrodowy na VIII lub VII wiek p.n.e., na stulecia przed Jezusem, choć jego obrońcy wciąż trzymają się tego miejsca. Getsemani jest pewniejsze co do ogólnego położenia, choć nie co do dokładnego miejsca: Jezus „wyszedł z uczniami swoimi przez potok Cedron, gdzie był ogród”, a Mateusz podaje, że przyszli „na miejsce, które zwano Gietsemane”; ogrody pokazywane dziś leżą przy drodze na Górę Oliwną, a tradycje różnią się co do tego, które jest tym miejscem."
  it:
    - "L’ubicazione del Golgota non è nota con certezza. La mappa lo pone alla Chiesa del Santo Sepolcro nella Città Vecchia di Gerusalemme, il luogo venerato dal IV secolo e quello che la maggior parte degli studiosi accetta; dall’Ottocento altri hanno proposto il Calvario di Gordon, una rupe a forma di teschio con accanto la Tomba del Giardino, a nord della Porta di Damasco. La scheda del luogo elenca tre candidati: la chiesa, un punto poco a sud di essa e il Calvario di Gordon. Getsemani si trovava al di là della valle del Cedron, ai piedi del Monte degli Ulivi, a circa un chilometro a est del Golgota tradizionale."
    - "I Vangeli dicono poco del luogo: Gesù «venne al luogo del Teschio, che in ebraico si chiama Golgota»; esso «era vicino alla città», e «nel luogo dov’egli fu crocifisso c’era un orto; e in quell’orto un sepolcro nuovo». La Lettera agli Ebrei aggiunge che egli «soffrì fuor della porta». Nessun Vangelo chiama il Golgota un colle. Eusebio, all’inizio del IV secolo, collocò il Golgota a nord del Monte Sion, e nel 335 fu dedicata la chiesa che Costantino costruì sopra la roccia e la tomba; Eusebio dice che la tomba fu trovata quando fu demolito un tempio pagano che sorgeva sul posto. Gli scavi all’interno della chiesa hanno mostrato che il sito era una cava in disuso con tombe scavate nella roccia, che si trovava fuori dalle mura della città ai tempi di Gesù."
    - "Il colle a forma di teschio fu proposto per la prima volta da Otto Thenius nel 1842 e reso famoso dal generale Charles Gordon nel 1883; contro di esso, Gabriel Barkay datò la Tomba del Giardino all’VIII o al VII secolo a.C., secoli prima di Gesù, mentre i suoi difensori restano fedeli al sito. Getsemani è più sicuro nella posizione generale, anche se non nel punto esatto: Gesù «uscì coi suoi discepoli di là dal torrente Chedron, dov’era un orto», e Matteo lo nomina «un podere detto Getsemani»; gli orti mostrati oggi si trovano accanto alla strada che sale al Monte degli Ulivi, e le tradizioni divergono su quale sia il luogo."
  cs:
    - "Poloha Golgoty není s jistotou známa. Mapa ji klade ke chrámu Božího hrobu ve Starém městě v Jeruzalémě, na místo uctívané od 4. století a to, které přijímá většina badatelů; od 19. století se navrhovala jiná místa, Gordonova Kalvárie, lebkovitý útes se Zahradním hrobem vedle, severně od Damašské brány. Karta místa uvádí tři kandidáty: kostel, místo těsně jižně od něj a Gordonovu Kalvárii. Getsemane ležely za údolím Kidronu u úpatí Olivové hory, asi kilometr východně od tradiční Golgoty."
    - "Evangelia o místě říkají málo: Ježíš „šel až na místo, kteréž slove popravné, a Židovsky Golgota“; bylo „blízko města“ a „na tom místě, kdež ukřižován byl, zahrada, a v zahradě hrob nový“. List Židům dodává, že „vně za branou trpěl“. Žádné evangelium nenazývá Golgotu pahorkem. Eusebios na počátku 4. století umístil Golgotu severně od hory Sijón a roku 335 byl vysvěcen kostel, který Konstantin vystavěl nad skálou a hrobem; Eusebios říká, že hrob byl nalezen, když byl zbořen pohanský chrám na tom místě. Vykopávky uvnitř kostela ukázaly, že místo bylo opuštěným lomem se skalními hroby, který ležel mimo hradbu města v Ježíšově době."
    - "Lebkovitý pahorek poprvé navrhl Otto Thenius roku 1842 a proslavil jej generál Charles Gordon roku 1883; proti tomu Gabriel Barkay datoval Zahradní hrob do 8. nebo 7. století př. n. l., tedy o staletí před Ježíše, zatímco jeho obhájci na místě stále trvají. Getsemane je ve své obecné poloze jistější, i když ne v přesném místě: Ježíš „vyšel s učedlníky svými přes potok Cedron, kdež byla zahrada“ a Matouš je nazývá „místo, kteréž sloulo Getsemany“; zahrady ukazované dnes leží při cestě na Olivovou horu a tradice se liší v tom, které je to místo."
  nl:
    - "De ligging van Golgota is niet met zekerheid bekend. De kaart plaatst het bij de Heilig Grafkerk in de Oude Stad van Jeruzalem, de plaats die sinds de vierde eeuw wordt vereerd en die de meeste geleerden aanvaarden; sinds de negentiende eeuw hebben anderen Gordons Calvarie voorgesteld, een schedelvormige rots met het Tuingraf ernaast, ten noorden van de Damascuspoort. De plaatskaart noemt drie kandidaten: de kerk, een plek net ten zuiden ervan en Gordons Calvarie. Getsemane lag aan de overkant van het Kidrondal aan de voet van de Olijfberg, ongeveer een kilometer ten oosten van het traditionele Golgota."
    - "De evangeliën zeggen weinig over de plaats: Jezus “ging uit naar de plaats, genaamd Hoofdschedelplaats, welke in het Hebreeuws genaamd wordt Golgotha”; zij “was nabij de stad”, en “er was in de plaats, waar Hij gekruist was, een hof, en in den hof een nieuw graf”. Hebreeën voegt eraan toe dat Hij “buiten de poort geleden” heeft. Geen evangelie noemt Golgota een heuvel. Eusebius plaatste Golgota in het begin van de vierde eeuw ten noorden van de berg Sion, en in 335 werd de kerk ingewijd die Constantijn over de rots en het graf had gebouwd; Eusebius zegt dat het graf werd gevonden toen een heidense tempel op die plek werd afgebroken. Opgravingen in de kerk hebben aangetoond dat de plaats een buiten gebruik geraakte steengroeve was met in de rots uitgehouwen graven, die buiten de stadsmuur van Jezus' tijd lagen."
    - "De schedelvormige heuvel werd voor het eerst voorgesteld door Otto Thenius in 1842 en beroemd gemaakt door generaal Charles Gordon in 1883; daartegenover dateerde Gabriel Barkay het Tuingraf in de achtste of zevende eeuw v.Chr., eeuwen vóór Jezus, terwijl zijn verdedigers aan de plaats vasthouden. Getsemane staat in zijn algemene ligging steviger, hoewel niet op zijn exacte plek: Jezus “ging uit met Zijn discipelen over de beek Kedron, waar een hof was”, en Mattheüs noemt het “een plaats genaamd Gethsemane”; de tuinen die men tegenwoordig toont liggen naast de weg die de Olijfberg opklimt, en de tradities verschillen over welke de plaats is."
  sv:
    - "Platsen för Golgota är inte säkert känd. Kartan placerar den vid Gravkyrkan i Gamla staden i Jerusalem, platsen som vördats sedan 300-talet och den som de flesta forskare godtar; sedan 1800-talet har andra föreslagit Gordons Golgota, en skallformad klippa med Trädgårdsgraven bredvid, norr om Damaskusporten. Platskortet förtecknar tre kandidater: kyrkan, en plats strax söder om den och Gordons Golgota. Getsemane låg på andra sidan Kidrondalen vid foten av Olivberget, omkring en kilometer öster om det traditionella Golgota."
    - "Evangelierna säger litet om platsen: Jesus ”kom så ut till det ställe som kallades Huvudskalleplatsen, på hebreiska Golgata”; det ”låg nära staden”, och ”invid det ställe där han hade blivit korsfäst var en örtagård, och i örtagården fanns en ny grav”. Hebreerbrevet tillägger att han led ”utanför stadsporten”. Inget evangelium kallar Golgota en kulle. Eusebios placerade i början av 300-talet Golgota norr om Sions berg, och år 335 invigdes kyrkan som Konstantin lät bygga över klippan och graven; Eusebios säger att graven hittades när ett hednatempel på platsen revs. Utgrävningar inne i kyrkan har visat att platsen var ett övergivet stenbrott med uthuggna gravar, som låg utanför stadsmuren på Jesu tid."
    - "Den skallformade kullen föreslogs först av Otto Thenius 1842 och gjordes berömd av generalen Charles Gordon 1883; mot den har Gabriel Barkay daterat Trädgårdsgraven till 700- eller 600-talet f.Kr., århundraden före Jesus, medan dess försvarare fortfarande håller fast vid platsen. Getsemane är säkrare i fråga om sitt allmänna läge men inte sitt exakta ställe: Jesus ”begav sig med sina lärjungar därifrån och gick över bäcken Kidron till andra sidan. Där var en örtagård”, och Matteus nämner det som ”ett ställe som hette Getsemane”; trädgårdarna som visas i dag ligger vid vägen upp över Olivberget, och traditionerna skiljer sig åt om vilken som är platsen."
  nb:
    - "Hvor Golgata lå, er ikke kjent med sikkerhet. Kartet plasserer det ved Gravkirken i Jerusalems gamleby, stedet som har vært æret siden 300-tallet og det flest forskere godtar; siden 1800-tallet har andre foreslått Gordons Golgata, en hodeskalleformet klippe med Hagegraven ved siden av, nord for Damaskusporten. Stedskortet oppfører tre kandidater: kirken, et punkt rett sør for den og Gordons Golgata. Getsemane lå på den andre siden av Kedron-dalen ved foten av Oljeberget, omtrent en kilometer øst for det tradisjonelle Golgata."
    - "Evangeliene sier lite om stedet: Jesus «gikk ut til det sted som kalles Hodeskalle-stedet, på hebraisk Golgata»; det var «nær ved byen», og «på det sted hvor Jesus blev korsfestet, var det en have, og i haven en ny grav». Hebreerbrevet tilføyer at han «led … utenfor porten». Ingen evangelist kaller Golgata en høyde. Eusebius plasserte Golgata nord for Sionfjellet tidlig på 300-tallet, og i 335 ble kirken som Konstantin bygde over klippen og graven, viet; Eusebius sier at graven ble funnet da et hedensk tempel på stedet ble revet. Utgravninger inne i kirken har vist at stedet var et nedlagt steinbrudd med utskårne graver, som lå utenfor bymuren på Jesu tid."
    - "Den hodeskalleformede høyden ble først foreslått av Otto Thenius i 1842 og gjort berømt av general Charles Gordon i 1883; mot den daterte Gabriel Barkay Hagegraven til 700- eller 600-tallet f.Kr., århundrer før Jesus, mens dens forsvarere fortsatt holder fast ved stedet. Getsemane er sikrere i sin generelle beliggenhet, men ikke på det nøyaktige punktet: da Jesus hadde talt, «gikk han ut med sine disipler over bekken Kedron; der var en have», og Matteus kaller det «et sted som heter Getsemane»; hagene som vises i dag, ligger ved veien opp Oljeberget, og tradisjonene er uenige om hvilken som er stedet."
  tl:
    - "Hindi tiyak na alam ang kinaroroonan ng Golgota. Inilalagay ito ng mapa sa Simbahan ng Banal na Sepulkro sa Lumang Lungsod ng Jerusalem, ang pook na pinararangalan mula pa noong ika-4 na siglo at ang tinatanggap ng karamihan ng mga iskolar; mula pa noong ika-19 na siglo ay iminungkahi ng iba ang Kalbaryo ni Gordon, isang bangin na hugis bungo na may Libingan sa Halamanan sa tabi nito, sa hilaga ng Pintuang Damasco. Inililista ng kard ng lugar ang tatlong kandidato: ang simbahan, isang pook sa timog lamang nito, at ang Kalbaryo ni Gordon. Ang Getsemani ay nasa kabila ng lambak ng Cedron sa paanan ng Bundok ng mga Olibo, mga isang kilometro sa silangan ng tradisyonal na Golgota."
    - "Kaunti ang sinasabi ng mga Ebanghelyo: si Jesus ay “lumabas, na pasan niya ang krus, hanggang sa dakong tinatawag na Dako ng bungo, na sa wikang Hebreo ay tinatawag na Golgota”; ito ay “malapit sa bayan”, at “sa dako nga ng pinagpakuan sa kaniya ay may isang halamanan; at sa halamana'y may isang bagong libingan”. Idinaragdag ng Hebreo na siya ay “nagbata sa labas ng pintuan”. Walang Ebanghelyo na tumatawag sa Golgota na burol. Inilagay ni Eusebio noong simula ng ika-4 na siglo ang Golgota sa hilaga ng Bundok Sion, at noong 335 ay itinalaga ang simbahang itinayo ni Constantino sa ibabaw ng bato at libingan; ayon sa kaniya, natagpuan ang libingan nang gibain ang isang paganong templo roon. Ipinakita ng mga paghuhukay sa loob ng simbahan na isa itong lumang tibagan na may mga libingang tinabas sa bato, sa labas ng pader ng lungsod noong panahon ni Jesus."
    - "Ang burol na hugis bungo ay unang iminungkahi ni Otto Thenius noong 1842 at pinatanyag ni Heneral Charles Gordon noong 1883; laban dito, itinakda ni Gabriel Barkay ang Libingan sa Halamanan sa ika-8 o ika-7 siglo BK, mga siglo bago si Jesus, bagaman nanatili pa rin ang mga tagapagtanggol nito sa pook. Mas matatag ang Getsemani sa pangkalahatang posisyon nito bagaman hindi sa eksaktong lugar: si Jesus ay “umalis na kasama ng kaniyang mga alagad na nagsitawid ng batis ng Cedron, na doo'y may isang halamanan”, at tinatawag ito ni Mateo na “isang dako na tinatawag na Getsemani”; ang mga halamanang ipinakikita ngayon ay nasa tabi ng daang paakyat sa Bundok ng mga Olibo, at magkakaiba ang mga tradisyon kung alin ang pook."
