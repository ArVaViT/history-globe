id: how-long-were-pauls-journeys
question:
  en: "How long were Paul's missionary journeys?"
  ru: "Какой длины были миссионерские путешествия Павла?"
  uk: "Яка довжина місійних подорожей Павла?"
  es: "¿Qué longitud tuvieron los viajes misioneros de Pablo?"
  pt: "Qual era a extensão das viagens missionárias de Paulo?"
  de: "Wie lang waren die Missionsreisen des Paulus?"
  fr: "Quelle fut la longueur des voyages missionnaires de Paul ?"
  pl: "Jak długie były podróże misyjne Pawła?"
  it: "Quanto furono lunghi i viaggi missionari di Paolo?"
  nl: "Hoe lang waren de zendingsreizen van Paulus?"
  cs: "Jak dlouhé byly Pavlovy misijní cesty?"
  sv: "Hur långa var Paulus missionsresor?"
  nb: "Hvor lange var Paulus' misjonsreiser?"
  tl: "Gaano kahaba ang mga paglalakbay misyonero ni Pablo?"
  da: "Hvor lange var Paulus' missionsrejser?"
  sr: "Колико су дуга била Павлова мисионарска путовања?"
answer:
  en:
    - "Measured from stop to stop in straight lines along the routes of the four tours on the map, Paul's first journey comes to about 1,980 km, the second about 3,650 km, the third about 2,850 km and the voyage to Rome about 2,995 km: more than 11,000 km in all. At a walker's 30 km a day those lengths would take 66, 122, 95 and 100 days on the road, but each journey was partly by sea, real roads are longer than straight lines, and Paul stayed for months or years in some cities, so the figures are a yardstick, not a timetable."
    - 'The first journey (c. AD 47 on the map; Acts 13–14) went from Antioch down to its port Seleucia, "and from thence they sailed to Cyprus", then from Perga up into the hills to Antioch of Pisidia, Iconium, Lystra and Derbe, and back the same way to the coast; the legs on land measure about 1,255 km by the roads on the map. The second (c. AD 50; Acts 15:36–18:22) began with the words "Let us go again and visit our brethren in every city where we have preached the word of the Lord": overland through Derbe and Lystra to Troas, by sea to Macedonia, then Philippi, Thessalonica, Berea, Athens and Corinth, where Paul stayed a year and six months, and home by sea through Ephesus and Caesarea; its land legs, about 2,825 km, are the longest of the four.'
    - "The third (c. AD 54; Acts 18:23–21:17) took Paul over all the country of Galatia and Phrygia to Ephesus, 1,035 km from Antioch by the roads on the map, where he spent about three years, then through Macedonia to Troas and down the coast of Asia by Miletus, Rhodes and Patara to Tyre, Caesarea and Jerusalem; about 1,935 km of it on land. The voyage to Rome (AD 59–60) ran from Caesarea by Sidon, Myra and Crete to the wreck on Malta (Melita), then by Syracuse and Rhegium to Puteoli, from where a road joined the Appian Way, about 235 km in all to Rome; only that last stretch was on foot. The years are conventional points, since Paul's chronology is debated; Gallio's year of office at Corinth, 51–52, is its firmest anchor."
  ru:
    - "Если мерить от остановки к остановке по прямой вдоль маршрутов четырёх туров на карте, первое путешествие Павла составляет около 1980 км, второе — около 3650 км, третье — около 2850 км, а путь в Рим — около 2995 км: всего более 11 000 км. Пешеходу при 30 км в день на эти расстояния понадобилось бы 66, 122, 95 и 100 дней в дороге, но каждое путешествие отчасти шло морем, настоящие дороги длиннее прямых, а в некоторых городах Павел жил месяцами и годами, так что эти цифры — мерка, а не расписание."
    - "Первое путешествие (на карте — около 47 г. н. э.; Деян. 13–14) шло из Антиохии к её гавани Селевкии, «а оттуда отплыли в Кипр», затем от Пергии в горы к Антиохии Писидийской, Иконии, Листре и Дервии и той же дорогой обратно к побережью; сухопутные отрезки по дорогам на карте составляют около 1255 км. Второе (около 50 г.; Деян. 15:36–18:22) началось словами «пойдем опять, посетим братьев наших по всем городам, в которых мы проповедали слово Господне»: по суше через Дервию и Листру до Троады, морем в Македонию, затем Филиппы, Фессалоника, Верия, Афины и Коринф, где Павел прожил год и шесть месяцев, и домой морем через Ефес и Кесарию; его сухопутные отрезки, около 2825 км, самые длинные из четырёх."
    - "Третье (около 54 г.; Деян. 18:23–21:17) провело Павла через страну Галатийскую и Фригию в Ефес, 1035 км от Антиохии по дорогам на карте, где он провёл около трёх лет, потом через Македонию в Троаду и вдоль берега Асии мимо Милита, Родоса и Патары в Тир, Кесарию и Иерусалим; на суше из него около 1935 км. Путь в Рим (59–60 гг.) шёл из Кесарии мимо Сидона, Мир и Крита до крушения у Мелита (Мальты), затем через Сиракузы и Ригию в Путеол, откуда дорога выходила на Аппиеву, всего около 235 км до Рима; пешком был только этот последний участок. Годы условны, поскольку хронология Павла спорна; самая твёрдая её опора — год проконсульства Галлиона в Коринфе, 51–52."
  uk:
    - "Якщо міряти від зупинки до зупинки прямими лініями вздовж маршрутів чотирьох турів на мапі, перша подорож Павла становить близько 1980 км, друга — близько 3650 км, третя — близько 2850 км, а плавання до Рима — близько 2995 км: понад 11 000 км загалом. За пішохідних 30 км на день ці довжини забрали б 66, 122, 95 і 100 днів дороги, але кожна подорож частково йшла морем, справжні дороги довші за прямі лінії, а в деяких містах Павло залишався місяцями чи роками, тож ці цифри — мірило, а не розклад."
    - "Перша подорож (близько 47 р. н. е. на мапі; Дії 13–14) пішла з Антіохії вниз до її порту Селевкії, «а звідтіля відплили в Кипр», потім від Перге вгору в пагорби до Антіохії Пісідійської, Іконії, Лістри й Дервії та назад тим самим шляхом до узбережжя; сухопутні ділянки становлять близько 1255 км дорогами на мапі. Друга (близько 50 р. н. е.; Дії 15:36–18:22) почалася словами: «Вернувшись одвідаємо братів наших по всїх городах, де проповідували ми слово Господнє»: суходолом через Дервію та Лістру до Троади, морем до Македонії, потім Філіппи, Солунь, Верія, Афіни та Коринт, де Павло пробув рік і шість місяців, і додому морем через Ефес і Кесарію; її сухопутні ділянки, близько 2825 км, найдовші з чотирьох."
    - "Третя (близько 54 р. н. е.; Дії 18:23–21:17) провела Павла по всій країні Галатії та Фрігії до Ефеса, 1035 км від Антіохії дорогами на мапі, де він пробув близько трьох років, потім через Македонію до Троади й униз узбережжям Азії через Мілет, Родос і Патару до Тіру, Кесарії та Єрусалиму; близько 1935 км із цього суходолом. Плавання до Рима (59–60 рр. н. е.) йшло з Кесарії через Сідон, Мири Лікійські та Крит до аварії на Мальті (Мелиті), потім через Сиракузи й Регій до Путеол, звідки дорога виходила на Аппієву, загалом близько 235 км до Рима; пішки йшлося лише цим останнім відтинком. Роки — умовні точки, бо хронологія Павла дискусійна; рік перебування Галліона на посаді в Коринті, 51–52, є її найміцнішою опорою."
  es:
    - "Medido de parada en parada en líneas rectas a lo largo de las rutas de los cuatro recorridos del mapa, el primer viaje de Pablo suma unos 1980 km, el segundo unos 3650 km, el tercero unos 2850 km y el viaje a Roma unos 2995 km: más de 11 000 km en total. A los 30 km diarios de un caminante, esas longitudes requerirían 66, 122, 95 y 100 días de camino, pero cada viaje fue en parte por mar, los caminos reales son más largos que las líneas rectas y Pablo permaneció meses o años en algunas ciudades, de modo que las cifras son una vara de medir, no un calendario."
    - "El primer viaje (hacia el 47 d. C. en el mapa; Hechos 13–14) fue de Antioquía bajando a su puerto, Seleucia, «y de allí navegaron á Cipro», luego desde Perge, subiendo a las colinas, hasta Antioquía de Pisidia, Iconio, Listra y Derbe, y de vuelta por el mismo camino hasta la costa; los tramos por tierra miden unos 1255 km por los caminos del mapa. El segundo (hacia el 50 d. C.; Hechos 15:36–18:22) comenzó con las palabras «Volvamos á visitar á los hermanos por todas las ciudades en las cuales hemos anunciado la palabra del Señor»: por tierra a través de Derbe y Listra hasta Troas, por mar a Macedonia, luego Filipos, Tesalónica, Berea, Atenas y Corinto, donde Pablo permaneció un año y seis meses, y de regreso por mar pasando por Éfeso y Cesarea; sus tramos por tierra, unos 2825 km, son los más largos de los cuatro."
    - "El tercero (hacia el 54 d. C.; Hechos 18:23–21:17) llevó a Pablo por toda la región de Galacia y Frigia hasta Éfeso, a 1035 km de Antioquía por los caminos del mapa, donde pasó unos tres años, luego por Macedonia hasta Troas y bajando por la costa de Asia por Mileto, Rodas y Pátara hasta Tiro, Cesarea y Jerusalén; unos 1935 km de él por tierra. El viaje a Roma (59–60 d. C.) fue de Cesarea por Sidón, Mira y Creta hasta el naufragio en Malta (Melita), luego por Siracusa y Regio hasta Puteoli, desde donde un camino enlazaba con la vía Apia, unos 235 km en total hasta Roma; solo ese último trecho fue a pie. Los años son puntos convencionales, pues la cronología de Pablo es debatida; el año de cargo de Galión en Corinto, 51–52, es su ancla más firme."
  pt:
    - "Medida de parada em parada em linhas retas ao longo das rotas dos quatro roteiros do mapa, a primeira viagem de Paulo chega a cerca de 1.980 km, a segunda a cerca de 3.650 km, a terceira a cerca de 2.850 km e a viagem a Roma a cerca de 2.995 km: mais de 11.000 km ao todo. A 30 km por dia de um caminhante, esses percursos levariam 66, 122, 95 e 100 dias de estrada, mas cada viagem foi em parte por mar, as estradas reais são mais longas que as linhas retas, e Paulo ficou meses ou anos em algumas cidades, de modo que os números são uma medida de referência, não um horário."
    - "A primeira viagem (cerca de 47 d.C. no mapa; Atos 13–14) foi de Antioquia até seu porto Selêucia, “de lá navegaram para Chipre”, depois de Perge subiu aos montes até Antioquia da Pisídia, Icônio, Listra e Derbe, e voltou pelo mesmo caminho até a costa; os trechos por terra medem cerca de 1.255 km pelas estradas do mapa. A segunda (cerca de 50 d.C.; Atos 15:36–18:22) começou com as palavras “Voltemos agora e visitemos nossos irmãos em todas as cidades nas quais proclamamos a palavra do Senhor”: por terra através de Derbe e Listra até Trôade, por mar à Macedônia, depois Filipos, Tessalônica, Bereia, Atenas e Corinto, onde Paulo ficou um ano e seis meses, e de volta por mar por Éfeso e Cesareia; seus trechos por terra, cerca de 2.825 km, são os mais longos dos quatro."
    - "A terceira (cerca de 54 d.C.; Atos 18:23–21:17) levou Paulo por toda a região da Galácia e da Frígia até Éfeso, a 1.035 km de Antioquia pelas estradas do mapa, onde passou cerca de três anos, depois pela Macedônia até Trôade e descendo a costa da Ásia por Mileto, Rodes e Pátara até Tiro, Cesareia e Jerusalém; cerca de 1.935 km dela por terra. A viagem a Roma (59–60 d.C.) foi de Cesareia por Sidom, Mira e Creta até o naufrágio em Malta (Melita), depois por Siracusa e Régio até Putéoli, de onde uma estrada se ligava à via Ápia, cerca de 235 km ao todo até Roma; só esse último trecho foi a pé. Os anos são pontos convencionais, pois a cronologia de Paulo é debatida; o ano em que Gálio exerceu o cargo em Corinto, 51–52, é a sua âncora mais firme."
  de:
    - "Von Halt zu Halt in geraden Linien entlang den Routen der vier Reisen auf der Karte gemessen, kommt die erste Reise des Paulus auf etwa 1980 km, die zweite auf etwa 3650 km, die dritte auf etwa 2850 km und die Fahrt nach Rom auf etwa 2995 km: zusammen mehr als 11 000 km. Bei 30 km am Tag eines Fußgängers wären das 66, 122, 95 und 100 Tage auf der Straße, aber jede Reise führte zum Teil über das Meer, wirkliche Straßen sind länger als gerade Linien, und Paulus blieb in manchen Städten Monate oder Jahre, sodass die Zahlen ein Maßstab sind, kein Fahrplan."
    - "Die erste Reise (auf der Karte etwa 47 n. Chr.; Apg 13–14) führte von Antiochia hinab zu seinem Hafen Seleukia, „und von da schifften sie gen Zypern“, dann von Perge hinauf ins Bergland nach Antiochia in Pisidien, Ikonion, Lystra und Derbe und auf demselben Weg zurück zur Küste; die Landstrecken messen auf den Straßen der Karte etwa 1255 km. Die zweite (etwa 50 n. Chr.; Apg 15,36–18,22) begann mit den Worten: „Laß uns wiederum ziehen und nach unsern Brüdern sehen durch alle Städte, in welchen wir des HERRN Wort verkündigt haben“: über Land durch Derbe und Lystra nach Troas, zur See nach Mazedonien, dann Philippi, Thessalonich, Beröa, Athen und Korinth, wo Paulus ein Jahr und sechs Monate blieb, und heim zur See über Ephesus und Caesarea; ihre Landstrecken, etwa 2825 km, sind die längsten der vier."
    - "Die dritte (etwa 54 n. Chr.; Apg 18,23–21,17) führte Paulus durch das ganze Land Galatien und Phrygien nach Ephesus, 1035 km von Antiochia auf den Straßen der Karte, wo er etwa drei Jahre verbrachte, dann durch Mazedonien nach Troas und die Küste Asiens hinab über Milet, Rhodos und Patara nach Tyrus, Caesarea und Jerusalem; etwa 1935 km davon über Land. Die Fahrt nach Rom (59–60 n. Chr.) ging von Caesarea über Sidon, Myra und Kreta zum Schiffbruch auf Malta (Melite), dann über Syrakus und Rhegion nach Puteoli, von wo eine Straße auf die Via Appia traf, insgesamt etwa 235 km bis Rom; nur diese letzte Strecke ging zu Fuß. Die Jahre sind herkömmliche Punkte, da die Chronologie des Paulus umstritten ist; das Amtsjahr Gallios in Korinth, 51–52, ist ihr festester Anker."
  fr:
    - "Mesuré d’étape en étape en lignes droites le long des itinéraires des quatre parcours de la carte, le premier voyage de Paul représente environ 1 980 km, le deuxième environ 3 650 km, le troisième environ 2 850 km et le voyage vers Rome environ 2 995 km : plus de 11 000 km en tout. À 30 km par jour de marche, ces longueurs feraient 66, 122, 95 et 100 jours de route, mais chaque voyage fut en partie maritime, les routes réelles sont plus longues que les lignes droites et Paul séjourna des mois ou des années dans certaines villes : ces chiffres sont donc un étalon, non un calendrier."
    - "Le premier voyage (vers 47 apr. J.-C. sur la carte ; Actes 13–14) alla d’Antioche à son port Séleucie, « et de là ils s’embarquèrent pour l’île de Chypre », puis de Perge, dans les collines, jusqu’à Antioche de Pisidie, Icone, Lystre et Derbe, et revint par le même chemin vers la côte ; les étapes terrestres mesurent environ 1 255 km par les routes de la carte. Le deuxième (vers 50 apr. J.-C. ; Actes 15:36–18:22) commença par ces mots : « Retournons visiter les frères dans toutes les villes où nous avons annoncé la parole du Seigneur » : par terre, par Derbe et Lystre jusqu’à Troas, par mer en Macédoine, puis Philippes, Thessalonique, Bérée, Athènes et Corinthe, où Paul resta « un an et six mois », et retour par mer par Éphèse et Césarée ; ses étapes terrestres, environ 2 825 km, sont les plus longues des quatre."
    - "Le troisième (vers 54 apr. J.-C. ; Actes 18:23–21:17) mena Paul à travers toute la Galatie et la Phrygie jusqu’à Éphèse, à 1 035 km d’Antioche par les routes de la carte, où il passa environ trois ans, puis par la Macédoine jusqu’à Troas et le long de la côte d’Asie, par Milet, Rhodes et Patara, jusqu’à Tyr, Césarée et Jérusalem ; environ 1 935 km de ce trajet par terre. Le voyage vers Rome (59–60 apr. J.-C.) alla de Césarée par Sidon, Myra et la Crète jusqu’au naufrage à Malte (Mélita), puis par Syracuse et Rhegium jusqu’à Pouzzoles, d’où une route rejoignait la voie Appienne, environ 235 km en tout jusqu’à Rome ; seul ce dernier tronçon se fit à pied. Les années sont des repères conventionnels, la chronologie de Paul étant débattue ; l’année de charge de Gallion à Corinthe, 51–52, en est l’ancrage le plus ferme."
  pl:
    - "Mierzona od przystanku do przystanku liniami prostymi wzdłuż tras czterech wypraw na mapie, pierwsza podróż Pawła ma około 1980 km, druga około 3650 km, trzecia około 2850 km, a podróż do Rzymu około 2995 km: łącznie ponad 11 000 km. Przy 30 km dziennie, jakie robi pieszy, odcinki te zajęłyby 66, 122, 95 i 100 dni drogi, ale każda podróż odbywała się częściowo morzem, prawdziwe drogi są dłuższe niż linie proste, a Paweł w niektórych miastach przebywał miesiącami lub latami, więc liczby są miarą porównawczą, nie rozkładem jazdy."
    - "Pierwsza podróż (około 47 n.e. na mapie; Dz 13–14) wiodła z Antiochii w dół do jej portu Seleucji, „a stamtąd płynęli do Cypru”, potem z Perge w góry do Antiochii Pizydyjskiej, Ikonium, Listry i Derbe i tą samą drogą z powrotem na wybrzeże; odcinki lądowe mierzą około 1255 km według dróg z mapy. Druga (około 50 n.e.; Dz 15,36–18,22) zaczęła się od słów: „Wróciwszy się, nawiedźmy braci naszych po wszystkich miastach, w którycheśmy opowiadali słowo Pańskie”: lądem przez Derbe i Listrę do Troady, morzem do Macedonii, potem do Filippi, Tesaloniki, Berei, Aten i Koryntu, gdzie Paweł przebywał rok i sześć miesięcy, i do domu morzem przez Efez i Cezareę; jej odcinki lądowe, około 2825 km, są najdłuższe z czterech."
    - "Trzecia (około 54 n.e.; Dz 18,23–21,17) wiodła Pawła przez całą krainę Galacji i Frygii do Efezu, 1035 km od Antiochii drogami z mapy, gdzie spędził około trzech lat, potem przez Macedonię do Troady i w dół wybrzeżem Azji przez Milet, Rodos i Patarę do Tyru, Cezarei i Jerozolimy; około 1935 km tego lądem. Podróż do Rzymu (59–60 n.e.) biegła z Cezarei przez Sydon, Mirę i Kretę do rozbicia na Malcie (Melita), potem przez Syrakuzy i Region do Puteoli, skąd droga łączyła się z Drogą Appijską, łącznie około 235 km do Rzymu; tylko ten ostatni odcinek odbyto pieszo. Lata są punktami umownymi, ponieważ chronologia Pawła jest sporna; rok urzędowania Galliona w Koryncie, 51–52, jest jej najpewniejszym punktem oparcia."
  it:
    - "Misurato di tappa in tappa in linee rette lungo i percorsi dei quattro viaggi sulla mappa, il primo viaggio di Paolo raggiunge circa 1.980 km, il secondo circa 3.650 km, il terzo circa 2.850 km e la traversata verso Roma circa 2.995 km: più di 11.000 km in tutto. Al passo di 30 km al giorno di un camminatore quelle lunghezze richiederebbero 66, 122, 95 e 100 giorni di strada, ma ogni viaggio fu in parte per mare, le strade reali sono più lunghe delle linee rette e Paolo si fermò mesi o anni in alcune città, così le cifre sono un metro di misura, non un orario."
    - "Il primo viaggio (circa 47 d.C. sulla mappa; At 13–14) andò da Antiochia giù al suo porto Seleucia, «e di là navigarono verso Cipro», poi da Perge su per le colline fino ad Antiochia di Pisidia, Icònio, Listra e Derbe, e tornò per la stessa via alla costa; i tratti via terra misurano circa 1.255 km lungo le strade della mappa. Il secondo (circa 50 d.C.; At 15,36–18,22) cominciò con le parole «Torniamo ora a visitare i fratelli in ogni città dove abbiamo annunziato la parola del Signore»: per terra attraverso Derbe e Listra fino a Troade, per mare in Macedonia, poi Filippi, Tessalonica, Berea, Atene e Corinto, dove Paolo rimase «un anno e sei mesi», e a casa per mare passando da Efeso e Cesarea; i suoi tratti via terra, circa 2.825 km, sono i più lunghi dei quattro."
    - "Il terzo (circa 54 d.C.; At 18,23–21,17) portò Paolo attraverso tutto il paese della Galazia e della Frigia fino a Efeso, a 1.035 km da Antiochia lungo le strade della mappa, dove trascorse circa tre anni, poi attraverso la Macedonia fino a Troade e lungo la costa dell’Asia per Mileto, Rodi e Patara fino a Tiro, Cesarea e Gerusalemme; circa 1.935 km di esso via terra. La traversata verso Roma (59–60 d.C.) andò da Cesarea per Sidone, Mira e Creta fino al naufragio a Malta (Melita), poi per Siracusa e Reggio fino a Pozzuoli, da dove una strada si univa alla Via Appia, circa 235 km in tutto fino a Roma; solo quell’ultimo tratto fu a piedi. Gli anni sono punti convenzionali, poiché la cronologia di Paolo è discussa; l’anno di carica di Gallione a Corinto, 51–52, ne è il punto d’ancoraggio più saldo."
  nl:
    - "Gemeten van halte tot halte in rechte lijnen langs de routes van de vier tochten op de kaart, komt de eerste reis van Paulus op ongeveer 1.980 km, de tweede op ongeveer 3.650 km, de derde op ongeveer 2.850 km en de reis naar Rome op ongeveer 2.995 km: samen meer dan 11.000 km. Bij 30 km per dag voor een voetganger zouden die afstanden 66, 122, 95 en 100 dagen onderweg kosten, maar elke reis ging deels over zee, echte wegen zijn langer dan rechte lijnen, en Paulus verbleef in sommige steden maanden of jaren, dus de cijfers zijn een maatstaf, geen dienstregeling."
    - "De eerste reis (ca. 47 n.Chr. op de kaart; Handelingen 13–14) ging van Antiochië naar beneden naar de haven Seleucië, “en van daar scheepten zij af naar Cyprus”, daarna vanuit Perge omhoog het bergland in naar Antiochië in Pisidië, Ikonium, Lystra en Derbe, en langs dezelfde weg terug naar de kust; de etappes over land meten ongeveer 1.255 km langs de wegen op de kaart. De tweede (ca. 50 n.Chr.; Handelingen 15:36–18:22) begon met de woorden: “Laat ons nu wederkeren, en bezoeken onze broeders in elke stad, in welke wij het Woord des Heeren verkondigd hebben”: over land via Derbe en Lystra naar Troas, over zee naar Macedonië, daarna Filippi, Tessalonica, Berea, Athene en Korinthe, waar Paulus een jaar en zes maanden bleef, en naar huis over zee via Efeze en Caesarea; de landetappes, ongeveer 2.825 km, zijn de langste van de vier."
    - "De derde (ca. 54 n.Chr.; Handelingen 18:23–21:17) voerde Paulus door heel het land Galatië en Frygië naar Efeze, 1.035 km van Antiochië langs de wegen op de kaart, waar hij ongeveer drie jaar doorbracht, daarna door Macedonië naar Troas en langs de kust van Asia via Milete, Rhodos en Patara naar Tyrus, Caesarea en Jeruzalem; ongeveer 1.935 km daarvan over land. De reis naar Rome (59–60 n.Chr.) liep van Caesarea via Sidon, Myra en Kreta naar de schipbreuk op Malta (Melite), daarna via Syracuse en Regium naar Puteoli, vanwaar een weg aansloot op de Via Appia, in totaal ongeveer 235 km naar Rome; alleen dat laatste stuk ging te voet. De jaren zijn conventionele punten, want de chronologie van Paulus wordt betwist; het ambtsjaar van Gallio in Korinthe, 51–52, is het vaste ankerpunt ervan."
  cs:
    - "Měřeno od zastávky k zastávce přímými čarami podél tras čtyř cest na mapě, vychází první Pavlova cesta asi na 1 980 km, druhá asi na 3 650 km, třetí asi na 2 850 km a plavba do Říma asi na 2 995 km: dohromady přes 11 000 km. Při pěších 30 km denně by to znamenalo 66, 122, 95 a 100 dní na cestě, ale každá cesta vedla zčásti po moři, skutečné silnice jsou delší než přímé čáry a Pavel v některých městech pobýval měsíce či roky, takže čísla jsou měřítkem, nikoli jízdním řádem."
    - "První cesta (na mapě asi 47 n. l.; Sk 13–14) vedla z Antiochie dolů do jejího přístavu Seleukeie, „a odtud plavili se do Cypru“, pak z Perge nahoru do hor k Antiochii Pisidské, Ikoniu, Lystře a Derbe a zpět toutéž cestou k pobřeží; pozemní úseky měří podle silnic na mapě asi 1 255 km. Druhá (asi 50 n. l.; Sk 15,36–18,22) začala slovy „Vracujíce se, navštěvme bratří naše po všech městech, v kterýchž jsme kázali slovo Páně“: souší přes Derbe a Lystru do Troady, po moři do Makedonie, pak Filipy, Tesalonika, Beroia, Atény a Korint, kde Pavel pobyl „půl druhého léta“, a domů po moři přes Efez a Cesareu; její pozemní úseky, asi 2 825 km, jsou ze čtyř nejdelší."
    - "Třetí (asi 54 n. l.; Sk 18,23–21,17) vedla Pavla po celé krajině Galacie a Frygie do Efezu, od Antiochie 1 035 km po silnicích na mapě, kde strávil asi tři roky, pak Makedonií do Troady a dolů pobřežím Asie přes Milét, Rhodos a Patary do Týru, Cesareje a Jeruzaléma; asi 1 935 km z toho po souši. Plavba do Říma (59–60 n. l.) vedla z Cesareje přes Sidón, Myru a Krétu k ztroskotání na Maltě (Melitě), pak přes Syrakusy a Regium do Puteol, odkud se silnice napojovala na Appiovu cestu, celkem asi 235 km do Říma; pěšky jen poslední úsek. Roky jsou smluvní body, protože Pavlova chronologie je sporná; rok Gallionova úřadu v Korintu, 51–52, je její nejpevnější opora."
  sv:
    - "Mätt från stopp till stopp i raka linjer längs de fyra färdernas rutter på kartan blir Paulus första resa omkring 1 980 km, den andra omkring 3 650 km, den tredje omkring 2 850 km och resan till Rom omkring 2 995 km: sammanlagt mer än 11 000 km. Med en vandrares 30 km om dagen skulle de sträckorna ta 66, 122, 95 och 100 dagar på väg, men varje resa gick delvis till sjöss, verkliga vägar är längre än raka linjer, och Paulus stannade månader eller år i vissa städer, så siffrorna är en måttstock, inte en tidtabell."
    - "Den första resan (omkring 47 e.Kr. på kartan; Apg 13–14) gick från Antiochia ned till dess hamn Seleukia, ”och seglade därifrån till Cypern”, sedan från Perge upp i bergen till Antiochia i Pisidien, Ikonion, Lystra och Derbe, och tillbaka samma väg till kusten; landsträckorna mäter omkring 1 255 km längs vägarna på kartan. Den andra (omkring 50 e.Kr.; Apg 15:36–18:22) började med orden ”Låt oss nu fara tillbaka och besöka våra bröder, i alla de städer där vi hava förkunnat Herrens ord”: landvägen genom Derbe och Lystra till Troas, sjövägen till Makedonien, sedan Filippi, Tessalonike, Beroia, Aten och Korinth, där Paulus stannade ett år och sex månader, och hem sjövägen via Efesos och Caesarea; dess landsträckor, omkring 2 825 km, är de längsta av de fyra."
    - "Den tredje (omkring 54 e.Kr.; Apg 18:23–21:17) förde Paulus över hela Galatien och Frygien till Efesos, 1 035 km från Antiochia längs vägarna på kartan, där han tillbringade omkring tre år, sedan genom Makedonien till Troas och ned längs Asiens kust via Miletos, Rhodos och Patara till Tyros, Caesarea och Jerusalem; omkring 1 935 km av den till lands. Resan till Rom (59–60 e.Kr.) gick från Caesarea via Sidon, Myra och Kreta till skeppsbrottet vid Malta (Melite), sedan via Syrakusa och Rhegion till Puteoli, varifrån en väg anslöt till Via Appia, sammanlagt omkring 235 km till Rom; bara den sista sträckan gick till fots. Åren är konventionella punkter, eftersom Paulus kronologi är omdiskuterad; Gallios ämbetsår i Korinth, 51–52, är dess säkraste fäste."
  nb:
    - "Målt fra stopp til stopp i rette linjer langs rutene for de fire turene på kartet, kommer Paulus' første reise på omtrent 1 980 km, den andre på omtrent 3 650 km, den tredje på omtrent 2 850 km og reisen til Roma på omtrent 2 995 km: mer enn 11 000 km til sammen. Med en fotgjengers 30 km om dagen ville disse lengdene tatt 66, 122, 95 og 100 dager på veien, men hver reise gikk delvis til sjøs, virkelige veier er lengre enn rette linjer, og Paulus ble i noen byer i måneder eller år, så tallene er en målestokk, ikke en rutetabell."
    - "Den første reisen (ca. 47 e.Kr. på kartet; Apg 13–14) gikk fra Antiokia ned til havnen Seleukia, «og seilte derfra til Kypern», så fra Perge opp i åsene til Antiokia i Pisidia, Ikonium, Lystra og Derbe, og tilbake samme vei til kysten; etappene på land måler omtrent 1 255 km langs veiene på kartet. Den andre (ca. 50 e.Kr.; Apg 15,36–18,22) begynte med ordene «La oss nu vende tilbake og se til brødrene i enhver by hvor vi forkynte Herrens ord»: over land gjennom Derbe og Lystra til Troas, sjøveien til Makedonia, så Filippi, Tessalonika, Berøa, Aten og Korint, der Paulus ble i et år og seks måneder, og hjem sjøveien via Efesos og Cæsarea; landetappene, omtrent 2 825 km, er de lengste av de fire."
    - "Den tredje (ca. 54 e.Kr.; Apg 18,23–21,17) tok Paulus gjennom hele Galatia og Frygia til Efesos, 1 035 km fra Antiokia langs veiene på kartet, der han var i omtrent tre år, så gjennom Makedonia til Troas og ned langs Asias kyst via Milet, Rhodos og Patara til Tyros, Cæsarea og Jerusalem; omtrent 1 935 km av den på land. Reisen til Roma (59–60 e.Kr.) gikk fra Cæsarea via Sidon, Myra og Kreta til forliset på Malta (Melita), så via Syrakus og Regium til Puteoli, derfra en vei som møtte Via Appia, i alt omtrent 235 km til Roma; bare den siste strekningen var til fots. Årene er konvensjonelle punkter, siden Paulus' kronologi er omdiskutert; Gallios ett år som embetsmann i Korint, 51–52, er det sikreste ankerpunktet."
  tl:
    - "Kapag sinukat mula hintuan hanggang hintuan sa tuwid na guhit sa mga ruta ng apat na paglalakbay sa mapa, ang unang paglalakbay ni Pablo ay mga 1,980 km, ang ikalawa mga 3,650 km, ang ikatlo mga 2,850 km at ang paglalayag patungong Roma mga 2,995 km: mahigit 11,000 km sa kabuuan. Sa 30 km kada araw ng isang naglalakad, aabutin ang mga habang iyon ng 66, 122, 95 at 100 araw sa daan, ngunit bahagyang sa dagat ang bawat paglalakbay, mas mahaba ang tunay na mga daan kaysa sa mga tuwid na guhit, at nanatili si Pablo nang ilang buwan o taon sa ilang lungsod, kaya ang mga bilang ay panukat, hindi iskedyul."
    - "Ang unang paglalakbay (c. 47 AD sa mapa; Mga Gawa 13–14) ay mula sa Antioquia pababa sa daungan nitong Seleucia, “at buhat doo'y nangaglayag hanggang sa Chipre”, pagkatapos ay mula sa Perga paakyat sa mga burol hanggang sa Antioquia ng Pisidia, Iconio, Listra at Derbe, at pabalik sa parehong daan; ang mga bahagi sa lupa ay mga 1,255 km sa mga daan sa mapa. Ang ikalawa (c. 50 AD; Mga Gawa 15:36–18:22) ay nagsimula sa mga salitang “Pagbalikan natin ngayon at dalawin ang mga kapatid sa bawa't bayang pinangaralan natin ng salita ng Panginoon”: sa lupa sa Derbe at Listra hanggang sa Troas, sa dagat patungong Macedonia, pagkatapos ay Filipos, Tesalonica, Berea, Atenas at Corinto, kung saan nanatili si Pablo ng isang taon at anim na buwan, at pauwi sa dagat sa Efeso at Cesarea; ang mga bahagi nito sa lupa, mga 2,825 km, ang pinakamahaba sa apat."
    - "Ang ikatlo (c. 54 AD; Mga Gawa 18:23–21:17) ay nagdala kay Pablo sa buong lupain ng Galacia at Frigia hanggang sa Efeso, 1,035 km mula sa Antioquia sa mga daan sa mapa, kung saan siya nanatili ng mga tatlong taon, pagkatapos ay sa Macedonia hanggang sa Troas at pababa sa baybayin ng Asia sa Mileto, Rodas at Patara hanggang sa Tiro, Cesarea at Jerusalem; mga 1,935 km nito ay sa lupa. Ang paglalayag patungong Roma (59–60 AD) ay mula sa Cesarea sa Sidon, Mira at Creta hanggang sa pagkawasak sa Malta (Melita), pagkatapos ay sa Siracusa at Regio hanggang sa Puteoli, kung saan may daang sumasanib sa Daang Appia, mga 235 km lahat hanggang sa Roma; tanging ang huling bahaging iyon ang nilakad. Kombensiyonal ang mga taon, sapagkat pinagtatalunan ang kronolohiya ni Pablo; ang taon ng panunungkulan ni Galion sa Corinto, 51–52, ang pinakamatibay nitong sandigan."
  da:
    - "Målt fra stop til stop i rette linjer langs de fire tures ruter på kortet udgør Paulus' første rejse omkring 1.980 km, den anden omkring 3.650 km, den tredje omkring 2.850 km og rejsen til Rom omkring 2.995 km: i alt mere end 11.000 km. Med en vandrers 30 km om dagen ville disse længder tage henholdsvis 66, 122, 95 og 100 dage på vejen, men hver rejse foregik delvis til søs, virkelige veje er længere end rette linjer, og Paulus opholdt sig i måneder eller år i nogle byer, så tallene er en målestok, ikke en køreplan."
    - "Den første rejse (ca. 47 e.Kr. på kortet; ApG 13–14) gik fra Antiokia ned til dens havn Seleukia og »sejlede derfra til Kypern«, derefter fra Perge op i højlandet til Antiokia i Pisidien, Ikonion, Lystra og Derbe og tilbage samme vej til kysten; landetaperne måler omkring 1.255 km ad vejene på kortet. Den anden (ca. 50 e.Kr.; ApG 15,36–18,22) begyndte med ordene: »Lader os dog drage tilbage og besøge vore Brødre i hver By, hvor vi have forkyndt Herrens Ord«: over land gennem Derbe og Lystra til Troas, til søs til Makedonien, derefter Filippi, Thessalonika, Berøa, Athen og Korinth, hvor Paulus blev et år og seks måneder, og hjem til søs gennem Efesos og Cæsarea; dens landetaper, omkring 2.825 km, er de længste af de fire."
    - "Den tredje (ca. 54 e.Kr.; ApG 18,23–21,17) førte Paulus over hele Galatiens og Frygiens land til Efesos, 1.035 km fra Antiokia ad vejene på kortet, hvor han tilbragte omkring tre år, derefter gennem Makedonien til Troas og ned langs Asiens kyst forbi Milet, Rhodos og Patara til Tyrus, Cæsarea og Jerusalem; omkring 1.935 km af den over land. Rejsen til Rom (59–60 e.Kr.) gik fra Cæsarea over Sidon, Myra og Kreta til skibbruddet på Malta (Melita), derefter forbi Syrakus og Regium til Puteoli, hvorfra en vej mødte Via Appia, i alt omkring 235 km til Rom; kun den sidste strækning var til fods. Årene er konventionelle punkter, da Paulus' kronologi er omstridt; Gallios embedsår i Korinth, 51–52, er dens sikreste ankerpunkt."
  sr:
    - "Мерено од станице до станице правим линијама дуж рута четири путовања на карти, Павлово прво путовање износи око 1.980 км, друго око 3.650 км, треће око 2.850 км, а путовање у Рим око 2.995 км: укупно више од 11.000 км. Уз 30 км дневно колико пређе пешак те дужине би тражиле 66, 122, 95 и 100 дана на путу, али је свако путовање делом било морем, стварни путеви су дужи од правих линија, а Павле је у неким градовима боравио месецима или годинама, па су бројке мерило, а не ред вожње."
    - "Прво путовање (око 47. н. е. на карти; Дела 13–14) ишло је из Антиохије доле до њене луке Селеукије, „и оданде отпловише у Кипар“, затим из Перге горе у брда до Антиохије Писидијске, Иконија, Листре и Дерве и истим путем назад до обале; копнене деонице мере око 1.255 км путевима на карти. Друго (око 50. н. е.; Дела 15,36–18,22) почело је речима: „Хајде да се вратимо и да обиђемо браћу по свим градовима по којима проповедасмо реч Господњу“: копном преко Дерве и Листре до Троаде, морем у Македонију, затим Филипи, Солун, Верија, Атина и Коринт, где је Павле остао годину и шест месеци, и кући морем кроз Ефес и Цезареју; његове копнене деонице, око 2.825 км, најдуже су од четири."
    - "Треће (око 54. н. е.; Дела 18,23–21,17) повело је Павла кроз сву земљу Галатије и Фригије до Ефеса, 1.035 км од Антиохије путевима на карти, где је провео око три године, затим кроз Македонију до Троаде и низ обалу Азије преко Милета, Родоса и Патаре до Тира, Цезареје и Јерусалима; око 1.935 км тога је копном. Путовање у Рим (59–60. н. е.) ишло је од Цезареје преко Сидона, Мире и Крита до бродолома на Мелити (Малти), затим преко Сиракузе и Ригије до Поцуолија, одакле се пут спајао с Апијевим путем, укупно око 235 км до Рима; само је та последња деоница била пешке. Године су условне тачке, јер се Павлова хронологија расправља; Галионова година службе у Коринту, 51–52, њено је најчвршће упориште."
