id: where-is-patmos
question:
  en: "Where is Patmos?"
  ru: "Где находится Патмос?"
  uk: "Де Патмос?"
  es: "¿Dónde está Patmos?"
  pt: "Onde fica Patmos?"
  de: "Wo liegt Patmos?"
  fr: "Où est Patmos ?"
answer:
  en:
    - "Patmos is a small, rocky Greek island of about 34 square kilometres in the south-eastern Aegean, among the Dodecanese, south of Samos and off the coast of Turkey; Ephesus lies about 100 km to the north-east in a straight line."
    - 'It is named once in the Bible, at the opening of Revelation: "I John, who also am your brother, and companion in tribulation … was in the isle that is called Patmos, for the word of God, and for the testimony of Jesus Christ." There he was told to write what he saw and send it to the seven churches of Asia, from Ephesus to Laodicea. Ancient writers rarely mention the island; Thucydides and Strabo name it in passing.'
    - "Early Christian writers took John's stay as banishment. Irenaeus says the vision was seen toward the end of Domitian's reign, usually taken as about AD 95, and Eusebius says John returned to Ephesus under Nerva, when those whom Domitian had banished were allowed home. Most scholars accept a date under Domitian; some place Revelation in the years after Nero, about AD 68. The map's tour of the seven churches uses AD 95."
  ru:
    - "Патмос — небольшой скалистый греческий остров площадью около 34 кв. км на юго-востоке Эгейского моря, в архипелаге Додеканес, южнее Самоса, у побережья Турции; Ефес лежит примерно в 100 км к северо-востоку по прямой."
    - "В Библии он назван один раз, в начале Откровения: «Я, Иоанн, брат ваш и соучастник в скорби… был на острове, называемом Патмос, за слово Божие и за свидетельство Иисуса Христа». Здесь ему велено записать увиденное и послать семи церквам Асии, от Ефеса до Лаодикии. Древние авторы упоминают остров редко: Фукидид и Страбон называют его мимоходом."
    - "Ранние христианские писатели считали пребывание Иоанна на острове ссылкой. Ириней говорит, что видение было в конце правления Домициана, то есть около 95 г. н. э., а Евсевий — что Иоанн вернулся в Ефес при Нерве, когда сосланным Домицианом разрешили вернуться. Большинство учёных принимают дату при Домициане; некоторые относят Откровение к годам после Нерона, около 68 г. Тур по семи церквам на карте показывает 95 г."
  uk:
    - "Патмос — малий скелястий грецький острів площею близько 34 квадратних кілометрів на південному сході Егейського моря, серед Додеканесу, на південь від Самосу й біля узбережжя Туреччини; Ефес лежить приблизно за 100 км на північний схід по прямій."
    - "Він названий у Біблії один раз, на початку Одкровення: «Я Йоан, і брат вам, і спільник у горю … був на острові, званім Патмос, за слово Боже, і за сьвідкуваннє Ісуса Христа». Там йому було сказано записати побачене і надіслати сімом церквам Азії, від Ефеса до Лаодікеї. Давні письменники рідко згадують острів; Фукідід і Страбон називають його принагідно."
    - "Ранні християнські письменники розуміли перебування Івана як заслання. Іриней каже, що видіння було бачене наприкінці правління Доміціана, що зазвичай розуміють як близько 95 р. н. е., а Євсевій каже, що Іван повернувся до Ефеса за Нерви, коли тим, кого Доміціан вислав, дозволили повернутися додому. Більшість учених приймає дату за Доміціана; дехто відносить Одкровення до років після Нерона, близько 68 р. н. е. Тур семи церков на мапі використовує 95 р. н. е."
  es:
    - "Patmos es una pequeña isla griega rocosa de unos 34 kilómetros cuadrados en el sureste del Egeo, entre las islas del Dodecaneso, al sur de Samos y frente a la costa de Turquía; Éfeso queda a unos 100 km al noreste en línea recta."
    - "Se nombra una sola vez en la Biblia, al comienzo del Apocalipsis: «Yo Juan, vuestro hermano, y participante en la tribulación... estaba en la isla que es llamada Patmos, por la palabra de Dios y el testimonio de Jesucristo». Allí se le dijo que escribiera lo que veía y lo enviara a las siete iglesias de Asia, de Éfeso a Laodicea. Los escritores antiguos rara vez mencionan la isla; Tucídides y Estrabón la nombran de pasada."
    - "Los escritores cristianos antiguos tomaron la estancia de Juan por un destierro. Ireneo dice que la visión se vio hacia el final del reinado de Domiciano, lo que suele tomarse por hacia el 95 d. C., y Eusebio dice que Juan volvió a Éfeso bajo Nerva, cuando se permitió regresar a los que Domiciano había desterrado. La mayoría de los estudiosos acepta una fecha bajo Domiciano; algunos sitúan el Apocalipsis en los años posteriores a Nerón, hacia el 68 d. C. El recorrido por las siete iglesias en el mapa usa el 95 d. C."
  pt:
    - "Patmos é uma pequena ilha grega rochosa, de cerca de 34 quilômetros quadrados, no sudeste do Egeu, entre as do Dodecaneso, ao sul de Samos e ao largo da costa da Turquia; Éfeso fica a cerca de 100 km a nordeste em linha reta."
    - "É nomeada uma só vez na Bíblia, na abertura do Apocalipse: “Eu, João, irmão e companheiro de vocês na tribulação… estava na ilha chamada Patmos por causa da Palavra de Deus e do testemunho de Jesus Cristo.” Ali lhe foi mandado escrever o que via e enviar às sete igrejas da Ásia, de Éfeso a Laodiceia. Os escritores antigos raramente mencionam a ilha; Tucídides e Estrabão a nomeiam de passagem."
    - "Os primeiros escritores cristãos tomaram a estada de João por banimento. Ireneu diz que a visão foi vista perto do fim do reinado de Domiciano, geralmente tomado como cerca de 95 d.C., e Eusébio diz que João voltou a Éfeso sob Nerva, quando os banidos por Domiciano puderam voltar para casa. A maioria dos estudiosos aceita uma data sob Domiciano; alguns situam o Apocalipse nos anos depois de Nero, por volta de 68 d.C. O roteiro das sete igrejas no mapa usa 95 d.C."
  de:
    - "Patmos ist eine kleine, felsige griechische Insel von etwa 34 Quadratkilometern im südöstlichen Ägäischen Meer, im Dodekanes, südlich von Samos und vor der türkischen Küste; Ephesus liegt in der Luftlinie etwa 100 km nordöstlich."
    - "Sie wird in der Bibel einmal genannt, am Anfang der Offenbarung: „Ich, Johannes, der auch euer Bruder und Mitgenosse an der Trübsal ist ..., war auf der Insel, die da heißt Patmos, um des Wortes Gottes willen und des Zeugnisses Jesu Christi.“ Dort wurde ihm gesagt, er solle aufschreiben, was er sah, und es an die sieben Gemeinden in Asien senden, von Ephesus bis Laodizea. Antike Schriftsteller erwähnen die Insel selten; Thukydides und Strabon nennen sie beiläufig."
    - "Frühchristliche Schriftsteller verstanden Johannes' Aufenthalt als Verbannung. Irenäus sagt, die Vision sei gegen Ende der Regierung Domitians gesehen worden, meist auf etwa 95 n. Chr. gedeutet, und Eusebius sagt, Johannes sei unter Nerva nach Ephesus zurückgekehrt, als die von Domitian Verbannten heimkehren durften. Die meisten Gelehrten nehmen eine Datierung unter Domitian an; manche setzen die Offenbarung in die Jahre nach Nero, um 68 n. Chr. Die Sieben-Gemeinden-Tour der Karte verwendet 95 n. Chr."
  fr:
    - "Patmos est une petite île grecque rocheuse d’environ 34 kilomètres carrés dans le sud-est de la mer Égée, parmi les îles du Dodécanèse, au sud de Samos et au large de la côte turque ; Éphèse se trouve à environ 100 km au nord-est en ligne droite."
    - "Elle n’est nommée qu’une fois dans la Bible, au début de l’Apocalypse : « Moi Jean, votre frère, et qui ai part avec vous à la tribulation … j’étais dans l’île appelée Patmos, à cause de la parole de Dieu et du témoignage de Jésus. » Il y reçut l’ordre d’écrire ce qu’il voyait et de l’envoyer aux sept Églises d’Asie, d’Éphèse à Laodicée. Les auteurs anciens mentionnent rarement l’île ; Thucydide et Strabon la nomment en passant."
    - "Les premiers auteurs chrétiens virent dans le séjour de Jean un bannissement. Irénée dit que la vision eut lieu vers la fin du règne de Domitien, d’ordinaire situé vers 95 apr. J.-C., et Eusèbe dit que Jean revint à Éphèse sous Nerva, quand ceux que Domitien avait bannis furent autorisés à rentrer. La plupart des savants admettent une date sous Domitien ; certains placent l’Apocalypse dans les années après Néron, vers 68 apr. J.-C. Le parcours des sept Églises sur la carte retient 95 apr. J.-C."
