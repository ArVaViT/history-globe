id: where-is-patmos
question:
  en: "Where is Patmos?"
  ru: "Где находится Патмос?"
  uk: "Де Патмос?"
  es: "¿Dónde está Patmos?"
  pt: "Onde fica Patmos?"
  de: "Wo liegt Patmos?"
  fr: "Où est Patmos ?"
  pl: "Gdzie leży Patmos?"
  it: "Dov’è Patmos?"
  nl: "Waar ligt Patmos?"
  cs: "Kde je Patmos?"
  sv: "Var ligger Patmos?"
  nb: "Hvor ligger Patmos?"
  tl: "Nasaan ang Patmos?"
  da: "Hvor ligger Patmos?"
  sr: "Где је Патам?"
  hu: "Hol van Pátmosz?"
  fi: "Missä Patmos on?"
  vi: "Bát-mô ở đâu?"
  ro: "Unde se află Patmos?"
  bg: "Къде е Патмос?"
answer:
  en:
    - "Patmos is a small, rocky Greek island of about 34 square kilometres in the south-eastern Aegean, among the Dodecanese, south of Samos and off the coast of Turkey; Ephesus lies about 100 km to the north-east in a straight line."
    - 'It is named once in the Bible, at the opening of Revelation: "I John, who also am your brother, and companion in tribulation … was in the isle that is called Patmos, for the word of God, and for the testimony of Jesus Christ." There he was told to write what he saw and send it to the seven churches of Asia, from Ephesus to Laodicea. Ancient writers rarely mention the island; Thucydides and Strabo name it in passing.'
    - "Early Christian writers took John's stay as banishment. Irenaeus says the vision was seen toward the end of Domitian's reign, usually taken as about AD 95, and Eusebius says John returned to Ephesus under Nerva, when those whom Domitian had banished were allowed home. Most scholars accept a date under Domitian; some place Revelation in the years after Nero, about AD 68. The map's tour of the seven churches uses AD 95."
  ru:
    - "Патмос — небольшой скалистый греческий остров площадью около 34 кв. км на юго-востоке Эгейского моря, в архипелаге Додеканес, южнее Самоса, у побережья Турции; Ефес лежит примерно в 100 км к северо-востоку по прямой."
    - "В Библии он назван один раз, в начале Откровения: «Я, Иоанн, брат ваш и соучастник в скорби… был на острове, называемом Патмос, за слово Божие и за свидетельство Иисуса Христа». Здесь ему велено записать увиденное и послать семи церквам Асии, от Ефеса до Лаодикии. Древние авторы упоминают остров редко: Фукидид и Страбон называют его мимоходом."
    - "Ранние христианские писатели считали пребывание Иоанна на острове ссылкой. Ириней говорит, что видение было в конце правления Домициана, то есть около 95 г. н. э., а Евсевий — что Иоанн вернулся в Ефес при Нерве, когда сосланным Домицианом разрешили вернуться. Большинство учёных принимают дату при Домициане; некоторые относят Откровение к годам после Нерона, около 68 г. Тур по семи церквам на карте показывает 95 г."
  uk:
    - "Патмос — малий скелястий грецький острів площею близько 34 квадратних кілометрів на південному сході Егейського моря, серед Додеканесу, на південь від Самосу й біля узбережжя Туреччини; Ефес лежить приблизно за 100 км на північний схід по прямій."
    - "Він названий у Біблії один раз, на початку Одкровення: «Я Йоан, і брат вам, і спільник у горю … був на острові, званім Патмос, за слово Боже, і за сьвідкуваннє Ісуса Христа». Там йому було сказано записати побачене і надіслати сімом церквам Азії, від Ефеса до Лаодікеї. Давні письменники рідко згадують острів; Фукідід і Страбон називають його принагідно."
    - "Ранні християнські письменники розуміли перебування Івана як заслання. Іриней каже, що видіння було бачене наприкінці правління Доміціана, що зазвичай розуміють як близько 95 р. н. е., а Євсевій каже, що Іван повернувся до Ефеса за Нерви, коли тим, кого Доміціан вислав, дозволили повернутися додому. Більшість учених приймає дату за Доміціана; дехто відносить Одкровення до років після Нерона, близько 68 р. н. е. Тур семи церков на мапі використовує 95 р. н. е."
  es:
    - "Patmos es una pequeña isla griega rocosa de unos 34 kilómetros cuadrados en el sureste del Egeo, entre las islas del Dodecaneso, al sur de Samos y frente a la costa de Turquía; Éfeso queda a unos 100 km al noreste en línea recta."
    - "Se nombra una sola vez en la Biblia, al comienzo del Apocalipsis: «Yo Juan, vuestro hermano, y participante en la tribulación... estaba en la isla que es llamada Patmos, por la palabra de Dios y el testimonio de Jesucristo». Allí se le dijo que escribiera lo que veía y lo enviara a las siete iglesias de Asia, de Éfeso a Laodicea. Los escritores antiguos rara vez mencionan la isla; Tucídides y Estrabón la nombran de pasada."
    - "Los escritores cristianos antiguos tomaron la estancia de Juan por un destierro. Ireneo dice que la visión se vio hacia el final del reinado de Domiciano, lo que suele tomarse por hacia el 95 d. C., y Eusebio dice que Juan volvió a Éfeso bajo Nerva, cuando se permitió regresar a los que Domiciano había desterrado. La mayoría de los estudiosos acepta una fecha bajo Domiciano; algunos sitúan el Apocalipsis en los años posteriores a Nerón, hacia el 68 d. C. El recorrido por las siete iglesias en el mapa usa el 95 d. C."
  pt:
    - "Patmos é uma pequena ilha grega rochosa, de cerca de 34 quilômetros quadrados, no sudeste do Egeu, entre as do Dodecaneso, ao sul de Samos e ao largo da costa da Turquia; Éfeso fica a cerca de 100 km a nordeste em linha reta."
    - "É nomeada uma só vez na Bíblia, na abertura do Apocalipse: “Eu, João, irmão e companheiro de vocês na tribulação… estava na ilha chamada Patmos por causa da Palavra de Deus e do testemunho de Jesus Cristo.” Ali lhe foi mandado escrever o que via e enviar às sete igrejas da Ásia, de Éfeso a Laodiceia. Os escritores antigos raramente mencionam a ilha; Tucídides e Estrabão a nomeiam de passagem."
    - "Os primeiros escritores cristãos tomaram a estada de João por banimento. Ireneu diz que a visão foi vista perto do fim do reinado de Domiciano, geralmente tomado como cerca de 95 d.C., e Eusébio diz que João voltou a Éfeso sob Nerva, quando os banidos por Domiciano puderam voltar para casa. A maioria dos estudiosos aceita uma data sob Domiciano; alguns situam o Apocalipse nos anos depois de Nero, por volta de 68 d.C. O roteiro das sete igrejas no mapa usa 95 d.C."
  de:
    - "Patmos ist eine kleine, felsige griechische Insel von etwa 34 Quadratkilometern im südöstlichen Ägäischen Meer, im Dodekanes, südlich von Samos und vor der türkischen Küste; Ephesus liegt in der Luftlinie etwa 100 km nordöstlich."
    - "Sie wird in der Bibel einmal genannt, am Anfang der Offenbarung: „Ich, Johannes, der auch euer Bruder und Mitgenosse an der Trübsal ist ..., war auf der Insel, die da heißt Patmos, um des Wortes Gottes willen und des Zeugnisses Jesu Christi.“ Dort wurde ihm gesagt, er solle aufschreiben, was er sah, und es an die sieben Gemeinden in Asien senden, von Ephesus bis Laodizea. Antike Schriftsteller erwähnen die Insel selten; Thukydides und Strabon nennen sie beiläufig."
    - "Frühchristliche Schriftsteller verstanden Johannes' Aufenthalt als Verbannung. Irenäus sagt, die Vision sei gegen Ende der Regierung Domitians gesehen worden, meist auf etwa 95 n. Chr. gedeutet, und Eusebius sagt, Johannes sei unter Nerva nach Ephesus zurückgekehrt, als die von Domitian Verbannten heimkehren durften. Die meisten Gelehrten nehmen eine Datierung unter Domitian an; manche setzen die Offenbarung in die Jahre nach Nero, um 68 n. Chr. Die Sieben-Gemeinden-Tour der Karte verwendet 95 n. Chr."
  fr:
    - "Patmos est une petite île grecque rocheuse d’environ 34 kilomètres carrés dans le sud-est de la mer Égée, parmi les îles du Dodécanèse, au sud de Samos et au large de la côte turque ; Éphèse se trouve à environ 100 km au nord-est en ligne droite."
    - "Elle n’est nommée qu’une fois dans la Bible, au début de l’Apocalypse : « Moi Jean, votre frère, et qui ai part avec vous à la tribulation … j’étais dans l’île appelée Patmos, à cause de la parole de Dieu et du témoignage de Jésus. » Il y reçut l’ordre d’écrire ce qu’il voyait et de l’envoyer aux sept Églises d’Asie, d’Éphèse à Laodicée. Les auteurs anciens mentionnent rarement l’île ; Thucydide et Strabon la nomment en passant."
    - "Les premiers auteurs chrétiens virent dans le séjour de Jean un bannissement. Irénée dit que la vision eut lieu vers la fin du règne de Domitien, d’ordinaire situé vers 95 apr. J.-C., et Eusèbe dit que Jean revint à Éphèse sous Nerva, quand ceux que Domitien avait bannis furent autorisés à rentrer. La plupart des savants admettent une date sous Domitien ; certains placent l’Apocalypse dans les années après Néron, vers 68 apr. J.-C. Le parcours des sept Églises sur la carte retient 95 apr. J.-C."
  pl:
    - "Patmos to mała, skalista grecka wyspa o powierzchni około 34 km² na południowo-wschodnim Morzu Egejskim, wśród Dodekanezu, na południe od Samos i u wybrzeża Turcji; Efez leży około 100 km na północny wschód w linii prostej."
    - "Wymieniono ją w Biblii raz, na początku Apokalipsy: „Ja Jan, którym też jest bratem waszym i uczestnikiem w ucisku … byłem na wyspie, którą zowią Patmos, dla słowa Bożego i dla świadectwa Jezusa Chrystusa.” Tam kazano mu zapisać, co widzi, i posłać siedmiu Kościołom Azji, od Efezu do Laodycei. Starożytni pisarze rzadko wspominają wyspę; Tukidydes i Strabon wymieniają ją mimochodem."
    - "Dawni pisarze chrześcijańscy brali pobyt Jana za wygnanie. Ireneusz mówi, że widzenie ujrzano pod koniec panowania Domicjana, zwykle przyjmowanego jako około 95 n.e., a Euzebiusz mówi, że Jan wrócił do Efezu za Nerwy, gdy tym, których Domicjan wygnał, pozwolono wrócić do domu. Większość uczonych przyjmuje datę za Domicjana; niektórzy umieszczają Apokalipsę w latach po Neronie, około 68 n.e. Trasa siedmiu Kościołów na mapie używa 95 n.e."
  it:
    - "Patmos è una piccola isola greca rocciosa di circa 34 chilometri quadrati nell’Egeo sud-orientale, tra il Dodecaneso, a sud di Samo e al largo della costa turca; Efeso si trova a circa 100 km a nord-est in linea retta."
    - "È nominata una volta nella Bibbia, all’inizio dell’Apocalisse: «Io, Giovanni, vostro fratello e partecipe con voi della tribolazione … ero nell’isola chiamata Patmo a motivo della parola di Dio e della testimonianza di Gesù». Là gli fu detto di scrivere ciò che vedeva e di inviarlo alle sette chiese dell’Asia, da Efeso a Laodicea. Gli scrittori antichi nominano raramente l’isola; Tucidide e Strabone la citano di passaggio."
    - "I primi scrittori cristiani intesero il soggiorno di Giovanni come un esilio. Ireneo dice che la visione fu vista verso la fine del regno di Domiziano, di solito inteso come il 95 d.C. circa, ed Eusebio dice che Giovanni tornò a Efeso sotto Nerva, quando a quelli che Domiziano aveva bandito fu permesso di tornare a casa. La maggior parte degli studiosi accetta una data sotto Domiziano; alcuni collocano l’Apocalisse negli anni dopo Nerone, circa il 68 d.C. Il percorso delle sette chiese sulla mappa usa il 95 d.C."
  nl:
    - "Patmos is een klein, rotsachtig Grieks eiland van ongeveer 34 vierkante kilometer in de zuidoostelijke Egeïsche Zee, tussen de Dodekanesos, ten zuiden van Samos en voor de kust van Turkije; Efeze ligt hemelsbreed ongeveer 100 km naar het noordoosten."
    - "Het wordt één keer in de Bijbel genoemd, aan het begin van Openbaring: “Ik, Johannes, die ook uw broeder ben, en medegenoot in de verdrukking … was op het eiland, genaamd Patmos, om het Woord Gods, en om de getuigenis van Jezus Christus.” Daar kreeg hij de opdracht op te schrijven wat hij zag en het te zenden aan de zeven gemeenten van Asia, van Efeze tot Laodicea. Antieke schrijvers noemen het eiland zelden; Thucydides en Strabo vermelden het terloops."
    - "Vroegchristelijke schrijvers namen Johannes’ verblijf als verbanning. Irenaeüs zegt dat het visioen tegen het einde van Domitianus’ regering werd gezien, gewoonlijk opgevat als omstreeks 95 n.Chr., en Eusebius zegt dat Johannes onder Nerva naar Efeze terugkeerde, toen wie Domitianus had verbannen naar huis mocht. De meeste geleerden aanvaarden een datering onder Domitianus; sommigen plaatsen Openbaring in de jaren na Nero, omstreeks 68 n.Chr. De tocht langs de zeven gemeenten op de kaart gebruikt 95 n.Chr."
  cs:
    - "Patmos je malý, skalnatý řecký ostrov o rozloze asi 34 km² v jihovýchodním Egejském moři, mezi Dodekanésy, jižně od Samu a u pobřeží Turecka; Efez leží asi 100 km severovýchodně vzdušnou čarou."
    - "Je jmenován jednou v Bibli, na počátku Zjevení: „Já Jan, kterýž jsem i bratr váš, i spoluúčastník v soužení … byl jsem na ostrově, kterýž slove Patmos, pro slovo Boží a svědectví Ježíše Krista.“ Tam mu bylo řečeno, aby psal, co vidí, a poslal to sedmi církvím v Asii, od Efezu po Laodikeiu. Starověcí spisovatelé o ostrově zmiňují zřídka; Thúkydidés a Strabón jej jmenují jen mimochodem."
    - "Raní křesťanští spisovatelé pokládali Janův pobyt za vyhnanství. Irenej říká, že vidění bylo spatřeno koncem vlády Domitianovy, obvykle kladené asi do roku 95 n. l., a Eusebios říká, že se Jan vrátil do Efezu za Nervy, kdy se vyhnancům Domitianovým dovolilo vrátit domů. Většina badatelů přijímá datum za Domitiana; někteří kladou Zjevení do let po Neronovi, asi 68 n. l. Mapa putování po sedmi církvích užívá rok 95 n. l."
  sv:
    - "Patmos är en liten, klippig grekisk ö på omkring 34 kvadratkilometer i sydöstra Egeiska havet, bland Dodekaneserna, söder om Samos och utanför Turkiets kust; Efesos ligger omkring 100 km nordost därom fågelvägen."
    - "Den nämns en enda gång i Bibeln, i inledningen till Uppenbarelseboken: ”Jag, Johannes, eder broder, som med eder har del i bedrövelsen och riket och ståndaktigheten i Jesus, jag befann mig på den ö som heter Patmos, för Guds ords och Jesu vittnesbörds skull.” Där fick han order att skriva upp vad han såg och sända det till de sju församlingarna i Asien, från Efesos till Laodikeia. Antika skribenter nämner sällan ön; Thukydides och Strabon nämner den i förbigående."
    - "Tidiga kristna skribenter tog Johannes vistelse som landsförvisning. Irenaeus säger att synen sågs mot slutet av Domitianus regering, vanligen räknat som omkring 95 e.Kr., och Eusebios säger att Johannes återvände till Efesos under Nerva, när de som Domitianus hade förvisat fick återvända hem. De flesta forskare godtar en datering under Domitianus; några placerar Uppenbarelseboken i åren efter Nero, omkring 68 e.Kr. Kartans tur över de sju församlingarna använder 95 e.Kr."
  nb:
    - "Patmos er en liten, klippefull gresk øy på omtrent 34 kvadratkilometer i det sørøstlige Egeerhavet, blant Dodekanesene, sør for Samos og utenfor kysten av Tyrkia; Efesos ligger omtrent 100 km mot nordøst i luftlinje."
    - "Den nevnes én gang i Bibelen, i åpningen av Johannes' åpenbaring: «Jeg, Johannes, som er eders bror og har del med eder i trengselen … jeg var på den ø som kalles Patmos, for Guds ords og Jesu vidnesbyrds skyld.» Der ble han bedt om å skrive det han så og sende det til de sju menighetene i Asia, fra Efesos til Laodikea. Antikke forfattere nevner sjelden øya; Thukydid og Strabon nevner den i forbifarten."
    - "Tidlige kristne forfattere tok Johannes' opphold som landsforvisning. Irenaeus sier at synet ble sett mot slutten av Domitians regjering, vanligvis regnet som omkring 95 e.Kr., og Eusebius sier at Johannes vendte tilbake til Efesos under Nerva, da de Domitian hadde forvist, fikk dra hjem. De fleste forskere godtar en datering under Domitian; noen plasserer Åpenbaringen i årene etter Nero, omkring 68 e.Kr. Kartets tur til de sju menighetene bruker 95 e.Kr."
  tl:
    - "Ang Patmos ay maliit, mabatong pulong Griyego na mga 34 kilometro kuwadrado sa timog-silangang Aegeo, sa mga Dodecaneso, sa timog ng Samos at sa labas ng baybayin ng Turkiya; ang Efeso ay mga 100 km sa hilagang-silangan sa tuwid na guhit."
    - "Isang beses lamang itong pinangalanan sa Biblia, sa pambungad ng Apocalipsis: “Akong si Juan, na inyong kapatid at inyong karamay sa kapighatian … ay nasasa pulo na tinatawag na Patmos, dahil sa salita ng Dios at sa patotoo ni Jesus.” Doon siya sinabihang isulat ang nakita at ipadala sa pitong iglesia ng Asia, mula Efeso hanggang Laodicea. Bihirang banggitin ng mga sinaunang manunulat ang pulo; binanggit ito nang pahapyaw nina Tucidides at Estrabon."
    - "Itinuring ng mga sinaunang manunulat na Kristiyano ang pananatili ni Juan bilang pagpapatapon. Sinasabi ni Ireneo na nakita ang pangitain malapit sa wakas ng paghahari ni Domiciano, karaniwang itinuturing na mga 95 AD, at sinasabi ni Eusebio na bumalik si Juan sa Efeso sa ilalim ni Nerva, nang payagang umuwi ang mga ipinatapon ni Domiciano. Tinatanggap ng karamihan ng iskolar ang petsa sa ilalim ni Domiciano; inilalagay ng ilan ang Apocalipsis sa mga taon pagkatapos ni Nero, mga 68 AD. Ginagamit ng paglilibot ng mapa sa pitong iglesia ang 95 AD."
  da:
    - "Patmos er en lille, klippefuld græsk ø på omkring 34 kvadratkilometer i det sydøstlige Ægæiske Hav, blandt Dodekaneserne, syd for Samos og ud for Tyrkiets kyst; Efesos ligger omkring 100 km mod nordøst i luftlinje."
    - "Den nævnes én gang i Bibelen, i begyndelsen af Johannes' Åbenbaring: »Jeg Johannes, eders Broder og meddelagtig i Trængselen og Riget og Udholdenheden i Jesus, var paa den Ø, som kaldes Patmos, for Guds Ords og for Jesu Vidnesbyrds Skyld.« Dér fik han besked på at skrive, hvad han så, og sende det til de syv menigheder i Asien, fra Efesos til Laodikea. Antikke forfattere nævner sjældent øen; Thukydid og Strabon nævner den i forbigående."
    - "Tidlige kristne forfattere tog Johannes' ophold for landsforvisning. Irenæus siger, at synet blev set mod slutningen af Domitians regering, sædvanligvis taget som omkring 95 e.Kr., og Eusebios siger, at Johannes vendte tilbage til Efesos under Nerva, da de, Domitian havde forvist, fik lov at vende hjem. De fleste forskere accepterer en datering under Domitian; nogle placerer Åbenbaringen i årene efter Nero, omkring 68 e.Kr. Kortets tur til de syv menigheder bruger 95 e.Kr."
  sr:
    - "Патам је мало, стеновито грчко острво површине око 34 квадратна километра у југоисточном Егејском мору, међу острвима Додеканеза, јужно од Самоса и поред обале Турске; Ефес лежи око 100 км североисточно ваздушном линијом."
    - "Помиње се једном у Библији, на почетку Откривења: „Ја Јован, који сам и брат ваш и друг у невољи … бејах на острву које се зове Патам, за реч Божију и за сведочанство Исуса Христа.“ Тамо му је речено да напише оно што види и то пошаље седам црквама у Азији, од Ефеса до Лаодикије. Антички писци ретко помињу острво; Тукидид и Страбон наводе га узгред."
    - "Рани хришћански писци су Јованов боравак схватали као прогонство. Иринеј каже да је визија виђена при крају Домицијанове владавине, што се обично узима око 95. н. е., а Јевсевије каже да се Јован вратио у Ефес под Нервом, кад је онима које је Домицијан прогнао дозвољен повратак. Већина научника прихвата датум под Домицијаном; неки Откривење смештају у године после Нерона, око 68. н. е. Рута седам цркава на карти користи 95. н. е."
  hu:
    - "Pátmosz egy kicsi, sziklás görög sziget, mintegy 34 négyzetkilométeres, az Égei-tenger délkeleti részén, a Dodekanészosz szigetei között, Számosztól délre, a török part előtt; Efezus egyenes vonalban mintegy 100 km-re északkeletre fekszik."
    - "A Biblia egyszer nevezi meg, a Jelenések könyve kezdetén: „Én János, a ki néktek atyátokfia is vagyok, társatok is a Jézus Krisztus szenvedésében […] a szigeten valék, a mely Páthmósnak neveztetik, az Isten beszédéért és a Jézus Krisztus bizonyságtételéért.” Ott azt a parancsot kapta, hogy írja le, amit lát, és küldje el Ázsia hét egyházának, Efezustól Laodiceáig. Az ókori írók ritkán említik a szigetet; Thuküdidész és Sztrabón futólag megnevezi."
    - "A korai keresztény írók János tartózkodását száműzetésnek vették. Iréneusz szerint a látomást Domitianus uralkodásának vége felé látták, ezt általában Kr. u. 95 körülre teszik, Eusebius pedig azt mondja, hogy János Nerva alatt tért vissza Efezusba, amikor a Domitianus által száműzötteket hazaengedték. A legtöbb kutató elfogadja a Domitianus alatti keltezést; egyesek a Jelenések könyvét a Néró utáni évekre, mintegy Kr. u. 68-ra teszik. A térkép hét egyházról szóló túrája Kr. u. 95-öt használ."
  fi:
    - "Patmos on pieni, kallioinen kreikkalainen saari, noin 34 neliökilometrin kokoinen, Egeanmeren kaakkoisosassa Dodekanesian saarten joukossa, Samoksesta etelään ja Turkin rannikon edustalla; Efesos on noin 100 km koilliseen linnuntietä."
    - "Se mainitaan Raamatussa kerran, Ilmestyskirjan alussa: ”Minä, Johannes, teidän veljenne, joka teidän kanssanne olen osallinen ahdistukseen ja valtakuntaan ja kärsivällisyyteen Jeesuksessa, minä olin Jumalan sanan ja Jeesuksen todistuksen tähden saaressa, jonka nimi on Patmos.” Siellä hänelle käskettiin kirjoittaa, mitä hän näki, ja lähettää se Aasian seitsemälle seurakunnalle, Efesoksesta Laodikeaan. Muinaiset kirjoittajat mainitsevat saaren harvoin; Thukydides ja Strabon nimeävät sen ohimennen."
    - "Varhaiset kristityt kirjoittajat pitivät Johanneksen oleskelua karkotuksena. Irenaeus sanoo näyn nähdyn Domitianuksen hallituskauden loppupuolella, jonka yleensä katsotaan olleen noin 95 jaa., ja Eusebios sanoo Johanneksen palanneen Efesokseen Nervan aikana, jolloin Domitianuksen karkottamat saivat palata kotiin. Useimmat tutkijat hyväksyvät ajoituksen Domitianuksen aikaan; jotkut sijoittavat Ilmestyskirjan Neron jälkeisille vuosille, noin 68 jaa. Kartan seitsemän seurakunnan kierros käyttää vuotta 95 jaa."
  vi:
    - "Bát-mô là một hòn đảo Hy Lạp nhỏ, đá, rộng khoảng 34 km², ở đông nam biển Aegean, trong quần đảo Dodecanese, phía nam Sa-mốt và ngoài khơi bờ biển Thổ Nhĩ Kỳ; Ê-phê-sô cách khoảng 100 km về phía đông bắc theo đường thẳng."
    - "Nó được nêu một lần trong Kinh Thánh, ở phần mở đầu sách Khải Huyền: “Tôi là Giăng, là anh em và bạn của các anh em về hoạn nạn … tôi đã ở trong đảo gọi là Bát-mô, vì cớ lời Đức Chúa Trời và chứng của Đức Chúa Jêsus.” Ở đó ông được bảo viết điều thấy và gửi cho bảy Hội thánh ở A-si, từ Ê-phê-sô đến Lao-đi-xê. Các tác giả cổ hiếm khi nhắc đến đảo; Thucydides và Strabo nêu nó thoáng qua."
    - "Các tác giả Cơ Đốc sơ khai coi việc Giăng ở đó là bị đày. Irenaeus nói khải tượng được thấy vào cuối triều Domitian, thường được hiểu là khoảng năm 95, và Eusebius nói Giăng trở về Ê-phê-sô dưới thời Nerva, khi những người Domitian đã đày được cho về nhà. Đa số học giả chấp nhận niên đại dưới thời Domitian; một số đặt Khải Huyền vào những năm sau Nero, khoảng năm 68. Hành trình bảy Hội thánh trên bản đồ dùng năm 95."
  ro:
    - "Patmos este o mică insulă grecească stâncoasă, de circa 34 de kilometri pătrați, în sud-estul Mării Egee, printre insulele Dodecaneze, la sud de Samos și în largul coastei Turciei; Efesul se află la circa 100 km spre nord-est în linie dreaptă."
    - "Este numită o singură dată în Biblie, la începutul Apocalipsei: „Eu Ioan, cel ce sunt și fratele vostru, și părtaș întru necazul … fost-am în ostrovul ce se chiamă Patmos, pentru cuvântul lui Dumnezeu, și pentru mărturisirea lui Iisus Hristos.” Acolo i s-a poruncit să scrie ce vede și să trimită celor șapte biserici din Asia, de la Efes până la Laodiceea. Scriitorii antici pomenesc rar insula; Tucidide și Strabon o numesc în treacăt."
    - "Scriitorii creștini timpurii au luat șederea lui Ioan drept surghiun. Irineu spune că vedenia a fost văzută spre sfârșitul domniei lui Domițian, socotit de obicei circa 95 d.Hr., iar Eusebiu spune că Ioan s-a întors la Efes sub Nerva, când cei surghiuniți de Domițian au fost lăsați să se întoarcă acasă. Cei mai mulți cercetători acceptă o dată sub Domițian; unii așază Apocalipsa în anii de după Nero, circa 68 d.Hr. Turul celor șapte biserici de pe hartă folosește 95 d.Hr."
  bg:
    - "Патмос е малък скалист гръцки остров от около 34 квадратни километра в югоизточната част на Егейско море, сред Додеканезите, южно от Самос и край бреговете на Турция; Ефес е на около 100 км на североизток по права линия."
    - "Той е назован веднъж в Библията, в началото на Откровението: „Аз Иоан, който съм и брат ваш и съучастник в скърбите… бех на острова нарицаем Патмос за словото Божие и за свидетелството Исус Христово.“ Там му било казано да напише видяното и да го прати на седемте църкви в Азия, от Ефес до Лаодикия. Древните автори рядко споменават острова; Тукидид и Страбон го назовават мимоходом."
    - "Ранните християнски автори разбирали престоя на Йоан като заточение. Ириней казва, че видението било видяно към края на царуването на Домициан, обикновено приемано за около 95 г. н.е., а Евсевий казва, че Йоан се върнал в Ефес при Нерва, когато на заточените от Домициан било позволено да се приберат. Повечето учени приемат дата при Домициан; някои поставят Откровението в годините след Нерон, около 68 г. н.е. Обиколката на седемте църкви на картата използва 95 г. н.е."
