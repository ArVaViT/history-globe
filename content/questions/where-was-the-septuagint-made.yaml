id: where-was-the-septuagint-made
question:
  en: "Where was the Septuagint made?"
  ru: "Где была создана Септуагинта?"
  uk: "Де було створено Септуагінту?"
  es: "¿Dónde se hizo la Septuaginta?"
  pt: "Onde foi feita a Septuaginta?"
  de: "Wo entstand die Septuaginta?"
  fr: "Où fut faite la Septante ?"
  pl: "Gdzie powstała Septuaginta?"
  it: "Dove fu realizzata la Settanta?"
  cs: "Kde vznikla Septuaginta?"
  nl: "Waar werd de Septuaginta gemaakt?"
  sv: "Var tillkom Septuaginta?"
answer:
  en:
    - "In Alexandria, the Greek capital of Egypt founded by Alexander in 331 BC, about 510 km from Jerusalem in a straight line; the map point stands on it. The Jews of the city, who spoke Greek and were losing their Hebrew, translated the Law of Moses there in the third century BC, and the rest of the scriptures followed over the next two centuries, so that by about 132 BC the grandson of Ben Sira could write in his prologue that the Law, the Prophets and the rest of the books read differently in Greek than in Hebrew."
    - "The story of the translation is told in the Letter of Aristeas, written in Alexandria in the second century BC: King Ptolemy II (283–246 BC), at the suggestion of his librarian, asked the high priest in Jerusalem for seventy-two elders, six from each tribe, who translated the Law on the island of Pharos in seventy-two days. Philo, an Alexandrian Jew of Jesus' time, says the city kept an annual festival on Pharos in honour of the translation, and Josephus retells the letter at length. The number gave the version its name, “the Seventy”, Septuaginta in Latin. Most scholars accept the time and place while treating the royal commission and the miraculous agreement of the translators as legend."
    - "This was the Bible of the first Christians outside Palestine. When Luke quotes the passage the Ethiopian eunuch was reading, “He was led as a sheep to the slaughter; and like a lamb dumb before his shearer”, the words follow the Greek of Isaiah; Apollos, “born at Alexandria, an eloquent man, and mighty in the scriptures”, had learned them in that form. The Dead Sea Scrolls include Greek fragments of the Pentateuch from the second and first centuries BC, among the oldest copies, and some Hebrew texts closer to the Septuagint's source than to the later Masoretic text."
  ru:
    - "В Александрии, греческой столице Египта, основанной Александром в 331 г. до н. э., примерно в 510 км от Иерусалима по прямой; точка карты стоит на ней. Иудеи города, говорившие по-гречески и терявшие еврейский язык, перевели там Закон Моисеев в III веке до н. э., а остальные книги Писания последовали в ближайшие два столетия, так что около 132 г. до н. э. внук Бен-Сиры мог писать в своём предисловии, что Закон, Пророки и прочие книги по-гречески звучат иначе, чем по-еврейски."
    - "Историю перевода рассказывает Письмо Аристея, написанное в Александрии во II веке до н. э.: царь Птолемей II (283–246 гг. до н. э.) по совету своего библиотекаря попросил у первосвященника в Иерусалиме семьдесят два старца, по шесть от каждого колена, и те перевели Закон на острове Фарос за семьдесят два дня. Филон, александрийский иудей времён Иисуса, пишет, что город ежегодно справлял на Фаросе праздник в честь перевода, а Иосиф Флавий пространно пересказывает письмо. Число дало переводу имя — «Семьдесят», по-латыни Септуагинта. Большинство учёных принимают время и место, считая царский заказ и чудесное согласие переводчиков легендой."
    - "Это была Библия первых христиан за пределами Палестины. Когда Лука приводит отрывок, который читал эфиопский евнух, — «как овца, веден был Он на заклание, и, как агнец пред стригущим его безгласен», — слова следуют греческому тексту Исаии; Аполлос, «родом из Александрии, муж красноречивый и сведущий в Писаниях», знал их в этом виде. Среди свитков Мёртвого моря есть греческие фрагменты Пятикнижия II–I веков до н. э., одни из древнейших списков, и еврейские тексты, которые ближе к источнику Септуагинты, чем к позднейшему масоретскому тексту."
  uk:
    - "В Александрії, грецькій столиці Єгипту, заснованій Александром 331 р. до н. е., приблизно за 510 км від Єрусалима по прямій; точка на мапі стоїть на ній. Юдеї міста, які говорили по-грецьки й забували єврейську, переклали тут Закон Мойсея в III ст. до н. е., а решту Писань було переведено протягом наступних двох століть, так що близько 132 р. до н. е. внук Бен Сіри міг написати у своїй передмові, що Закон, Пророки та решта книг звучать по-грецьки інакше, ніж єврейською."
    - "Історію перекладу розповідає Лист Арістея, написаний в Александрії у II ст. до н. е.: цар Птолемей II (283–246 рр. до н. е.) за порадою свого бібліотекаря попросив у первосвященика в Єрусалимі сімдесят двох старійшин, по шість від кожного коліна, які переклали Закон на острові Фарос за сімдесят два дні. Філон, александрійський юдей часів Ісуса, каже, що місто щороку влаштовувало свято на Фаросі на честь перекладу, а Йосиф Флавій докладно переказує лист. Число дало перекладу назву, «Сімдесят», латиною Septuaginta. Більшість учених приймають час і місце, вважаючи царське замовлення та чудесну згоду перекладачів легендою."
    - "Це була Біблія перших християн поза Палестиною. Коли Лука цитує уривок, який читав ефіопський євнух, «Як овечку на зарізь ведено Його; й як ягня перед тим, хто стриже його, безголосе», слова йдуть за грецьким текстом Ісаї; Аполлос, «родом Александриєць, чоловік вимовний і сильний у писаннях», вивчив їх у такій формі. Сувої Мертвого моря містять грецькі уламки П'ятикнижжя II та I ст. до н. е., серед найдавніших примірників, і деякі єврейські тексти, ближчі до першоджерела Септуагінти, ніж до пізнішого масоретського тексту."
  es:
    - "En Alejandría, la capital griega de Egipto fundada por Alejandro en 331 a. C., a unos 510 km de Jerusalén en línea recta; el punto del mapa está sobre ella. Los judíos de la ciudad, que hablaban griego y iban perdiendo el hebreo, tradujeron allí la Ley de Moisés en el siglo III a. C., y el resto de las Escrituras siguió durante los dos siglos siguientes, de modo que hacia el 132 a. C. el nieto de Ben Sira podía escribir en su prólogo que la Ley, los Profetas y el resto de los libros se leen de manera distinta en griego que en hebreo."
    - "La historia de la traducción se cuenta en la Carta de Aristeas, escrita en Alejandría en el siglo II a. C.: el rey Ptolomeo II (283–246 a. C.), por sugerencia de su bibliotecario, pidió al sumo sacerdote de Jerusalén setenta y dos ancianos, seis por tribu, que tradujeron la Ley en la isla de Faros en setenta y dos días. Filón, judío alejandrino de la época de Jesús, dice que la ciudad celebraba cada año una fiesta en Faros en honor de la traducción, y Josefo vuelve a contar la carta con extensión. El número dio a la versión su nombre, «los Setenta», Septuaginta en latín. La mayoría de los estudiosos aceptan el tiempo y el lugar, pero tratan el encargo real y el acuerdo milagroso de los traductores como leyenda."
    - "Esta fue la Biblia de los primeros cristianos fuera de Palestina. Cuando Lucas cita el pasaje que leía el eunuco etíope, «Como oveja á la muerte fué llevado; y como cordero mudo delante del que le trasquila», las palabras siguen el griego de Isaías; Apolos, «natural de Alejandría, varón elocuente, poderoso en las Escrituras», las había aprendido en esa forma. Los manuscritos del mar Muerto incluyen fragmentos griegos del Pentateuco de los siglos II y I a. C., entre las copias más antiguas, y algunos textos hebreos más cercanos a la fuente de la Septuaginta que al texto masorético posterior."
  pt:
    - "Em Alexandria, a capital grega do Egito fundada por Alexandre em 331 a.C., a cerca de 510 km de Jerusalém em linha reta; o ponto do mapa fica sobre ela. Os judeus da cidade, que falavam grego e estavam perdendo o hebraico, traduziram ali a Lei de Moisés no século III a.C., e o resto das Escrituras seguiu nos dois séculos seguintes, de modo que por volta de 132 a.C. o neto de Ben Sirá pôde escrever em seu prólogo que a Lei, os Profetas e os demais livros soam diferentes em grego e em hebraico."
    - "A história da tradução é contada na Carta de Aristeias, escrita em Alexandria no século II a.C.: o rei Ptolomeu II (283–246 a.C.), por sugestão de seu bibliotecário, pediu ao sumo sacerdote em Jerusalém setenta e dois anciãos, seis de cada tribo, que traduziram a Lei na ilha de Faros em setenta e dois dias. Fílon, um judeu alexandrino do tempo de Jesus, diz que a cidade celebrava todo ano uma festa em Faros em honra da tradução, e Josefo recontou a carta longamente. O número deu à versão o seu nome, “os Setenta”, Septuaginta em latim. A maioria dos estudiosos aceita o tempo e o lugar, mas trata a encomenda real e a concordância milagrosa dos tradutores como lenda."
    - "Esta foi a Bíblia dos primeiros cristãos fora da Palestina. Quando Lucas cita a passagem que o eunuco etíope lia, “Ele foi levado como ovelha ao matadouro. Como um cordeiro mudo perante o seu tosquiador”, as palavras seguem o grego de Isaías; Apolo, “natural de Alexandria, homem de grande eloquência… Ele era poderoso nas Escrituras”, as havia aprendido nessa forma. Os Manuscritos do mar Morto incluem fragmentos gregos do Pentateuco dos séculos II e I a.C., entre as cópias mais antigas, e alguns textos hebraicos mais próximos da fonte da Septuaginta do que do posterior texto massorético."
  de:
    - "In Alexandria, der griechischen Hauptstadt Ägyptens, 331 v. Chr. von Alexander gegründet, in der Luftlinie etwa 510 km von Jerusalem; der Kartenpunkt steht dort. Die Juden der Stadt, die Griechisch sprachen und ihr Hebräisch verloren, übersetzten dort im 3. Jahrhundert v. Chr. das Gesetz des Mose, und die übrigen Schriften folgten in den nächsten zwei Jahrhunderten, sodass der Enkel des Ben Sira um 132 v. Chr. in seinem Prolog schreiben konnte, das Gesetz, die Propheten und die übrigen Bücher läsen sich auf Griechisch anders als auf Hebräisch."
    - "Die Geschichte der Übersetzung erzählt der Aristeasbrief, im 2. Jahrhundert v. Chr. in Alexandria geschrieben: König Ptolemaios II. (283–246 v. Chr.) bat auf Anregung seines Bibliothekars den Hohenpriester in Jerusalem um zweiundsiebzig Älteste, sechs aus jedem Stamm, die das Gesetz auf der Insel Pharos in zweiundsiebzig Tagen übersetzten. Philo, ein alexandrinischer Jude zur Zeit Jesu, sagt, die Stadt habe auf Pharos jährlich ein Fest zu Ehren der Übersetzung gefeiert, und Josephus erzählt den Brief ausführlich nach. Die Zahl gab der Fassung ihren Namen, „die Siebzig“, lateinisch Septuaginta. Die meisten Gelehrten akzeptieren Zeit und Ort, behandeln aber den königlichen Auftrag und die wunderbare Übereinstimmung der Übersetzer als Legende."
    - "Dies war die Bibel der ersten Christen außerhalb Palästinas. Wenn Lukas die Stelle zitiert, die der äthiopische Kämmerer las, „Er ist wie ein Schaf zur Schlachtung geführt; und still wie ein Lamm vor seinem Scherer“, folgen die Worte dem Griechisch des Jesaja; Apollos, „von Geburt aus Alexandrien, ein beredter Mann und mächtig in der Schrift“, hatte sie in dieser Form gelernt. Die Schriftrollen vom Toten Meer enthalten griechische Fragmente des Pentateuch aus dem 2. und 1. Jahrhundert v. Chr., darunter einige der ältesten Abschriften, und einige hebräische Texte, die der Vorlage der Septuaginta näher stehen als dem späteren masoretischen Text."
  fr:
    - "À Alexandrie, capitale grecque de l’Égypte fondée par Alexandre en 331 av. J.-C., à environ 510 km de Jérusalem à vol d’oiseau ; le point de la carte s’y trouve. Les Juifs de la ville, qui parlaient grec et perdaient l’hébreu, y traduisirent la Loi de Moïse au IIIe siècle av. J.-C., et le reste des Écritures suivit au cours des deux siècles suivants, si bien que vers 132 av. J.-C. le petit-fils de Ben Sira pouvait écrire dans son prologue que la Loi, les Prophètes et le reste des livres se lisent autrement en grec qu’en hébreu."
    - "L’histoire de la traduction est racontée dans la Lettre d’Aristée, écrite à Alexandrie au IIe siècle av. J.-C. : le roi Ptolémée II (283-246 av. J.-C.), sur la suggestion de son bibliothécaire, demanda au grand prêtre de Jérusalem soixante-douze anciens, six par tribu, qui traduisirent la Loi dans l’île de Pharos en soixante-douze jours. Philon, Juif alexandrin du temps de Jésus, dit que la ville célébrait chaque année une fête à Pharos en l’honneur de la traduction, et Flavius Josèphe reprend longuement la lettre. Le nombre donna à la version son nom, « les Septante », Septuaginta en latin. La plupart des spécialistes admettent l’époque et le lieu, tout en tenant la commande royale et l’accord miraculeux des traducteurs pour une légende."
    - "C’était la Bible des premiers chrétiens hors de Palestine. Quand Luc cite le passage que lisait l’eunuque éthiopien, « Il a été mené comme une brebis à la boucherie ; et, comme un agneau muet devant celui qui le tond », les mots suivent le grec d’Ésaïe ; Apollos, « originaire d’Alexandrie, homme éloquent et versé dans les Écritures », les avait appris sous cette forme. Les manuscrits de la mer Morte comprennent des fragments grecs du Pentateuque des IIe et Ier siècles av. J.-C., parmi les plus anciennes copies, et certains textes hébreux plus proches de la source de la Septante que du texte massorétique plus tardif."
  pl:
    - "W Aleksandrii, greckiej stolicy Egiptu założonej przez Aleksandra w 331 p.n.e., około 510 km od Jerozolimy w linii prostej; stoi na niej punkt na mapie. Żydzi tego miasta, którzy mówili po grecku i tracili hebrajski, przetłumaczyli tam Prawo Mojżesza w III wieku p.n.e., a pozostałe pisma poszły za nim w ciągu następnych dwóch stuleci, tak że około 132 p.n.e. wnuk Ben Syracha mógł napisać w prologu, że Prawo, Prorocy i reszta ksiąg brzmią po grecku inaczej niż po hebrajsku."
    - "Historię przekładu opowiada List Arysteasza, napisany w Aleksandrii w II wieku p.n.e.: król Ptolemeusz II (283–246 p.n.e.), za namową swojego bibliotekarza, poprosił arcykapłana w Jerozolimie o siedemdziesięciu dwóch starszych, po sześciu z każdego pokolenia, którzy przetłumaczyli Prawo na wyspie Faros w siedemdziesiąt dwa dni. Filon, aleksandryjski Żyd z czasów Jezusa, mówi, że miasto obchodziło co roku na Faros święto ku czci przekładu, a Józef Flawiusz opowiada list obszernie. Liczba dała przekładowi nazwę, „Siedemdziesięciu”, po łacinie Septuaginta. Większość uczonych przyjmuje czas i miejsce, traktując królewskie zlecenie i cudowną zgodność tłumaczy jako legendę."
    - "Była to Biblia pierwszych chrześcijan poza Palestyną. Gdy Łukasz cytuje fragment, który czytał etiopski eunuch, „Jako owca ku zabiciu wiedziony jest, a jako baranek niemy przed tym, który go strzyże”, słowa te idą za greckim tekstem Izajasza; Apollos, „rodem z Aleksandryi, mąż wymowny… będąc możnym w Pismach”, nauczył się ich w tej postaci. Zwoje znad Morza Martwego zawierają greckie fragmenty Pięcioksięgu z II i I wieku p.n.e., wśród najstarszych odpisów, oraz niektóre teksty hebrajskie bliższe źródłu Septuaginty niż późniejszemu tekstowi masoreckiemu."
  it:
    - "Ad Alessandria, la capitale greca dell’Egitto fondata da Alessandro nel 331 a.C., a circa 510 km da Gerusalemme in linea d’aria; il punto della mappa si trova su di essa. Gli Ebrei della città, che parlavano greco e stavano perdendo l’ebraico, vi tradussero la Legge di Mosè nel III secolo a.C., e il resto delle Scritture seguì nei due secoli successivi, così che verso il 132 a.C. il nipote di Ben Sira poteva scrivere nel suo prologo che la Legge, i Profeti e gli altri libri si leggono diversamente in greco e in ebraico."
    - "La storia della traduzione è raccontata nella Lettera di Aristea, scritta ad Alessandria nel II secolo a.C.: il re Tolomeo II (283–246 a.C.), su suggerimento del suo bibliotecario, chiese al sommo sacerdote di Gerusalemme settantadue anziani, sei per tribù, che tradussero la Legge sull’isola di Faro in settantadue giorni. Filone, un Ebreo alessandrino dei tempi di Gesù, dice che la città celebrava ogni anno una festa a Faro in onore della traduzione, e Giuseppe Flavio riprende la lettera a lungo. Il numero diede alla versione il suo nome, «i Settanta», Septuaginta in latino. La maggior parte degli studiosi accetta tempo e luogo, ma considera leggenda l’incarico regio e l’accordo miracoloso dei traduttori."
    - "Era la Bibbia dei primi cristiani fuori della Palestina. Quando Luca cita il passo che leggeva l’eunuco etiope, «Egli è stato menato all’uccisione come una pecora; e come un agnello che è muto dinanzi a colui che lo tosa», le parole seguono il greco di Isaia; Apollo, «oriundo d’Alessandria, uomo eloquente e potente nelle Scritture», le aveva apprese in quella forma. I Rotoli del Mar Morto comprendono frammenti greci del Pentateuco del II e I secolo a.C., tra le copie più antiche, e alcuni testi ebraici più vicini alla fonte della Settanta che al successivo testo masoretico."
  cs:
    - "V Alexandrii, řeckém hlavním městě Egypta, které založil Alexandr roku 331 př. n. l., vzdušnou čarou asi 510 km od Jeruzaléma; bod na mapě stojí na ní. Židé města, kteří mluvili řecky a ztráceli hebrejštinu, tam ve 3. století př. n. l. přeložili Mojžíšův zákon a zbytek Písma následoval během dvou století, takže kolem roku 132 př. n. l. mohl vnuk Ben Siry ve svém prologu napsat, že Zákon, Proroci a ostatní knihy znějí v řečtině jinak než v hebrejštině."
    - "Příběh překladu vypráví List Aristeův, napsaný v Alexandrii ve 2. století př. n. l.: král Ptolemaios II. (283–246 př. n. l.) požádal na návrh svého knihovníka velekněze v Jeruzalémě o sedmdesát dva starších, šest z každého kmene, kteří přeložili Zákon na ostrově Faros za sedmdesát dva dní. Filón, alexandrijský Žid Ježíšovy doby, říká, že město slavilo každoroční svátek na Farosu na počest překladu, a Josephus list obšírně převypráví. Číslo dalo verzi její jméno, „Sedmdesát“, latinsky Septuaginta. Většina badatelů přijímá dobu i místo, ale královské zadání a zázračnou shodu překladatelů pokládá za legendu."
    - "Toto byla Bible prvních křesťanů mimo Palestinu. Když Lukáš cituje místo, které četl etiopský dvořan, „Jako ovce k zabití veden jest, a jako beránek němý před tím, kdož jej střiže, tak neotevřel úst svých“, slova sledují řeckého Izajáše; Apollos, „rodem z Alexandrie, muž výmluvný… učený v Písmě“, se je naučil v této podobě. Svitky od Mrtvého moře zahrnují řecké zlomky Pentateuchu z 2. a 1. století př. n. l., mezi nejstaršími opisy, a některé hebrejské texty bližší předloze Septuaginty než pozdějšímu masoretskému textu."
  nl:
    - "In Alexandrië, de Griekse hoofdstad van Egypte, in 331 v.Chr. door Alexander gesticht, hemelsbreed ongeveer 510 km van Jeruzalem; het punt op de kaart staat erop. De joden van de stad, die Grieks spraken en hun Hebreeuws kwijtraakten, vertaalden daar in de derde eeuw v.Chr. de Wet van Mozes, en de rest van de Schriften volgde in de twee eeuwen daarna, zodat de kleinzoon van Ben Sira omstreeks 132 v.Chr. in zijn proloog kon schrijven dat de Wet, de Profeten en de overige boeken in het Grieks anders lezen dan in het Hebreeuws."
    - "Het verhaal van de vertaling wordt verteld in de Brief van Aristeas, in de tweede eeuw v.Chr. in Alexandrië geschreven: koning Ptolemaeus II (283–246 v.Chr.) vroeg, op voorstel van zijn bibliothecaris, de hogepriester in Jeruzalem om tweeënzeventig oudsten, zes uit elke stam, die de Wet vertaalden op het eiland Pharos in tweeënzeventig dagen. Philo, een Alexandrijnse jood uit de tijd van Jezus, zegt dat de stad jaarlijks een feest op Pharos hield ter ere van de vertaling, en Josephus vertelt de brief uitvoerig na. Het getal gaf de vertaling haar naam, “de Zeventig”, in het Latijn Septuaginta. De meeste geleerden aanvaarden tijd en plaats maar beschouwen de koninklijke opdracht en de wonderbaarlijke overeenstemming van de vertalers als legende."
    - "Dit was de Bijbel van de eerste christenen buiten Palestina. Wanneer Lukas de passage aanhaalt die de Ethiopische eunuch las, “Hij is gelijk een schaap ter slachting geleid; en gelijk een lam stemmeloos is voor dien, die het scheert”, volgen de woorden het Grieks van Jesaja; Apollos, “van geboorte een Alexandrier, een welsprekend man… machtig zijnde in de Schriften”, had ze in die vorm geleerd. De Dode-Zeerollen bevatten Griekse fragmenten van de Pentateuch uit de tweede en eerste eeuw v.Chr., onder de oudste afschriften, en enkele Hebreeuwse teksten die dichter bij de bron van de Septuaginta staan dan bij de latere masoretische tekst."
  sv:
    - "I Alexandria, Egyptens grekiska huvudstad som grundades av Alexander 331 f.Kr., omkring 510 km från Jerusalem i fågelvägen; kartpunkten står på den. Stadens judar, som talade grekiska och höll på att förlora sin hebreiska, översatte Mose lag där på 200-talet f.Kr., och resten av skrifterna följde under de närmaste två århundradena, så att Ben Siras sonson omkring 132 f.Kr. kunde skriva i sin prolog att lagen, profeterna och de övriga böckerna lyder annorlunda på grekiska än på hebreiska."
    - "Berättelsen om översättningen återges i Aristeasbrevet, skrivet i Alexandria på 100-talet f.Kr.: kung Ptolemaios II (283–246 f.Kr.) bad, på förslag av sin bibliotekarie, översteprästen i Jerusalem om sjuttiotvå äldste, sex från varje stam, som översatte lagen på ön Faros på sjuttiotvå dagar. Filon, en alexandrinsk jude på Jesu tid, säger att staden firade en årlig fest på Faros till översättningens ära, och Josefus återberättar brevet utförligt. Talet gav versionen dess namn, ”de sjuttio”, Septuaginta på latin. De flesta forskare godtar tiden och platsen men behandlar det kungliga uppdraget och översättarnas underbara samstämmighet som legend."
    - "Detta var de första kristnas bibel utanför Palestina. När Lukas citerar stället som den etiopiske hovmannen läste, ”Såsom ett får fördes han bort till att slaktas; och såsom ett lamm som är tyst inför den som klipper det”, följer orden Jesajas grekiska text; Apollos, ”bördig från Alexandria, en lärd man, mycket förfaren i skrifterna”, hade lärt sig dem i den formen. Dödahavsrullarna innehåller grekiska fragment av Pentateuken från andra och första århundradena f.Kr., bland de äldsta avskrifterna, och några hebreiska texter som står närmare Septuagintas förlaga än den senare masoretiska texten."
