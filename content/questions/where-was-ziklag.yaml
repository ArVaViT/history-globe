id: where-was-ziklag
question:
  en: "Where was Ziklag, David's town among the Philistines?"
  ru: "Где находился Секелаг, город Давида у филистимлян?"
  uk: "Де був Ціклаг, місто Давида серед філістимлян?"
  es: "¿Dónde estaba Siclag, la ciudad de David entre los filisteos?"
  pt: "Onde ficava Ziclague, a cidade de Davi entre os filisteus?"
  de: "Wo lag Ziklag, Davids Stadt bei den Philistern?"
  fr: "Où se trouvait Tsiklag, la ville de David chez les Philistins ?"
answer:
  en:
    - "Ziklag was a town in the Negev, the dry south of Judah, but its exact site is disputed. The map point stands on Tell esh-Sharia (Tel Sera'), a mound on Nahal Gerar about 22 km north-west of Beersheba and 68 km south-west of Jerusalem in a straight line, which many scholars accept; Tel Halif, north-east of Beersheba, was proposed earlier, and in 2019 the excavators of Khirbet er-Ra'i near Lachish argued for their site, which others reject because it lies in the Shephelah rather than in the Negev."
    - "Fleeing from Saul, David asked Achish, king of Gath, for “a place in some town in the country”: “Then Achish gave him Ziklag that day: wherefore Ziklag pertaineth unto the kings of Judah unto this day.” He lived “in the country of the Philistines” for “a full year and four months”, raiding the peoples of the south from there. From Tell esh-Sharia Gath (Tell es-Safi) is about 38 km to the north in a straight line, far enough for David to act unseen."
    - "While David marched with the Philistine army, the Amalekites invaded the south and had “smitten Ziklag, and burned it with fire”, carrying off the women and children. He pursued them past the brook Besor, about 30 km west of the map point, recovered everything and sent part of the spoil “unto the elders of Judah, even to his friends”. At Ziklag he heard of Saul's death, and from there he went up to Hebron, about 43 km to the north-east, to be anointed king."
  ru:
    - "Секелаг — город в Негеве, сухом юге Иудеи, но где именно он стоял, спорят. Точка карты стоит на Телль-эш-Шариа (Тель-Сера), холме у русла Нахаль-Герар примерно в 22 км к северо-западу от Вирсавии и в 68 км к юго-западу от Иерусалима по прямой; это отождествление принимают многие учёные. Раньше предлагали Тель-Халиф к северо-востоку от Вирсавии, а в 2019 году раскопщики Хирбет-ар-Раи близ Лахиса назвали Секелагом свой холм; другие возражают, что он лежит в Шефеле, а не в Негеве."
    - "Спасаясь от Саула, Давид просил Анхуса, царя Гефского: «пусть дано будет мне место в одном из малых городов». «Тогда дал ему Анхус Секелаг, посему Секелаг и остался за царями Иудейскими доныне». Давид прожил «в стране Филистимской» год и четыре месяца и оттуда совершал набеги на народы юга. От Телль-эш-Шариа до Гефа (Телль-эс-Сафи) около 38 км к северу по прямой — достаточно далеко, чтобы Давид действовал незаметно."
    - "Пока Давид шёл с филистимским войском, Амаликитяне напали на Секелаг, «и взяли Секелаг и сожгли его огнем», уведя женщин и детей. Он догнал их за потоком Восор, примерно в 30 км к западу от точки карты, отбил всё и послал часть добычи «к старейшинам Иудиным, друзьям своим». В Секелаге он узнал о смерти Саула и оттуда поднялся в Хеврон, примерно в 43 км к северо-востоку, где его помазали на царство."
  uk:
    - "Ціклаг був містом у Негеві, сухому півдні Юди, але його точне місце спірне. Точка на мапі стоїть на Телль-еш-Шарії (Тель-Сера), пагорбі на Нахаль-Гераре приблизно за 22 км на північний захід від Беер-Шеви і за 68 км на південний захід від Єрусалима по прямій, що його приймають багато вчених; Тель-Халіф на північний схід від Беер-Шеви пропонували раніше, а 2019 р. розкопники Хірбет-ер-Раї біля Лахіша обстоювали своє місце, яке інші відкидають, бо воно лежить у Шефелі, а не в Негеві."
    - "Втікаючи від Саула, Давид просив Анхуса, царя Гата, про «місце на пробуваннє в которому з малих міст твоїх»: «І вказав Анхуз йому ще того ж дня Секелаг; тим остався Секелаг при царях Юдиних і по сей день». Він жив «у займищі Филистійському» «рік і чотири місяцї», звідти нападаючи на народи півдня. Від Телль-еш-Шарії до Гата (Телль-ес-Сафі) приблизно 38 км на північ по прямій — досить далеко, щоб Давид діяв непомітно."
    - "Поки Давид ішов з філістимським військом, амаликитяни вторглися на південь і «злупили Секелаг і спалили його огнем», забравши жінок і дітей. Він переслідував їх повз потік Бесор, приблизно за 30 км на захід від точки на мапі, повернув усе й надіслав частину здобичі «прихильним до його мужам громадським ув Юдї». У Ціклагу він почув про смерть Саула, і звідти він піднявся до Хеврона, приблизно за 43 км на північний схід, щоб бути помазаним на царя."
  es:
    - "Siclag era una ciudad del Négueb, el sur árido de Judá, pero su emplazamiento exacto se discute. El punto del mapa está sobre Tell esh-Sharia (Tel Sera'), un montículo en el Najal Gerar, a unos 22 km al noroeste de Beerseba y a 68 km al suroeste de Jerusalén en línea recta, que muchos estudiosos aceptan; antes se propuso Tel Halif, al noreste de Beerseba, y en 2019 los excavadores de Khirbet er-Ra'i, cerca de Laquis, defendieron su yacimiento, que otros rechazan porque está en la Sefelá y no en el Négueb."
    - "Huyendo de Saúl, David pidió a Aquis, rey de Gat, «lugar en algunas de las ciudades de la tierra»: «Y Achîs le dió aquel día á Siclag. De aquí fué Siclag de los reyes de Judá hasta hoy». Vivió «en la tierra de los Filisteos» un año completo y cuatro meses, haciendo desde allí incursiones contra los pueblos del sur. Desde Tell esh-Sharia, Gat (Tell es-Safi) queda a unos 38 km al norte en línea recta, lo bastante lejos para que David actuara sin ser visto."
    - "Mientras David marchaba con el ejército filisteo, los amalecitas invadieron el sur y habían «desolado á Siclag, y puéstola á fuego», llevándose cautivos a las mujeres y los niños. Los persiguió más allá del arroyo de Besor, a unos 30 km al oeste del punto del mapa, lo recuperó todo y envió parte del botín «á los ancianos de Judá, sus amigos». En Siclag supo de la muerte de Saúl, y desde allí subió a Hebrón, a unos 43 km al noreste, para ser ungido rey."
  pt:
    - "Ziclague era uma cidade no Neguebe, o sul árido de Judá, mas seu sítio exato é disputado. O ponto do mapa fica em Tell esh-Sharia (Tel Sera'), um monte no Nahal Gerar, a cerca de 22 km a noroeste de Berseba e 68 km a sudoeste de Jerusalém em linha reta, que muitos estudiosos aceitam; Tel Halif, a nordeste de Berseba, foi proposto antes, e em 2019 os escavadores de Khirbet er-Ra'i, perto de Laquis, defenderam o seu sítio, que outros rejeitam porque fica na Sefelá e não no Neguebe."
    - "Fugindo de Saul, Davi pediu a Aquis, rei de Gate, “um lugar numa das cidades do interior”: “Naquele dia, Aquis lhe deu Ziclague. Por isso Ziclague pertence aos reis de Judá até o dia de hoje.” Viveu “no território dos filisteus durante um ano e quatro meses”, atacando dali os povos do sul. De Tell esh-Sharia, Gate (Tell es-Safi) fica a cerca de 38 km ao norte em linha reta, longe o bastante para Davi agir sem ser visto."
    - "Enquanto Davi marchava com o exército filisteu, os amalequitas invadiram o sul e “Atacaram Ziclague e a incendiaram”, levando as mulheres e as crianças. Ele os perseguiu além do ribeiro Besor, a cerca de 30 km a oeste do ponto do mapa, recuperou tudo e enviou parte do despojo “aos anciãos de Judá, seus amigos”. Em Ziclague soube da morte de Saul, e dali subiu a Hebrom, a cerca de 43 km a nordeste, para ser ungido rei."
  de:
    - "Ziklag war eine Stadt im Negev, dem trockenen Süden Judas, doch ihre genaue Lage ist umstritten. Der Kartenpunkt steht auf Tell esch-Scharia (Tel Sera), einem Hügel am Nahal Gerar, in der Luftlinie etwa 22 km nordwestlich von Beerscheba und 68 km südwestlich von Jerusalem, den viele Gelehrte annehmen; Tel Halif nordöstlich von Beerscheba wurde früher vorgeschlagen, und 2019 setzten sich die Ausgräber von Chirbet er-Ra’i bei Lachisch für ihre Stätte ein, was andere ablehnen, weil sie in der Schefela statt im Negev liegt."
    - "Auf der Flucht vor Saul bat David Achis, den König von Gat, um „einen Raum in der Städte einer auf dem Lande“: „Da gab ihm Achis des Tages Ziklag. Daher gehört Ziklag zu den Königen Juda's bis auf diesen Tag.“ Er wohnte „in der Philister Lande“ ein Jahr und vier Monate und überfiel von dort die Völker des Südens. Von Tell esch-Scharia ist Gat (Tell es-Safi) in der Luftlinie etwa 38 km nach Norden entfernt, weit genug, damit David unbeobachtet handeln konnte."
    - "Während David mit dem Philisterheer zog, fielen die Amalekiter in den Süden ein und hatten „Ziklag geschlagen und mit Feuer verbrannt“ und die Frauen und Kinder weggeführt. Er verfolgte sie am Bach Besor vorbei, etwa 30 km westlich des Kartenpunkts, holte alles zurück und sandte einen Teil der Beute „den Ältesten in Juda, seinen Freunden“. In Ziklag hörte er von Sauls Tod, und von dort zog er nach Hebron hinauf, etwa 43 km nordöstlich, um zum König gesalbt zu werden."
  fr:
    - "Tsiklag était une ville du Négev, le sud aride de Juda, mais son site exact est discuté. Le point de la carte se trouve sur Tell esh-Sharia (Tel Sera‘), un tertre sur le Nahal Guérar, à environ 22 km au nord-ouest de Beer-Schéba et à 68 km au sud-ouest de Jérusalem à vol d’oiseau, que de nombreux spécialistes admettent ; Tel Halif, au nord-est de Beer-Schéba, avait été proposé plus tôt, et en 2019 les fouilleurs de Khirbet er-Ra‘i, près de Lakis, ont plaidé pour leur site, que d’autres rejettent parce qu’il se trouve dans la Shéphéla et non dans le Négev."
    - "Fuyant Saül, David demanda à Akisch, roi de Gath, « un lieu où je puisse demeurer » « dans l’une des villes du pays » : « Et ce même jour Akisch lui donna Tsiklag. C’est pourquoi Tsiklag a appartenu aux rois de Juda jusqu’à ce jour. » Il demeura « dans le pays des Philistins » pendant « un an et quatre mois », pillant de là les peuples du sud. De Tell esh-Sharia, Gath (Tell es-Safi) est à environ 38 km au nord à vol d’oiseau, assez loin pour que David agisse sans être vu."
    - "Pendant que David marchait avec l’armée philistine, les Amalécites envahirent le sud et avaient « détruit et brûlé Tsiklag », emmenant les femmes et les enfants. Il les poursuivit au-delà du torrent de Besor, à environ 30 km à l’ouest du point de la carte, reprit tout et envoya une partie du butin « aux anciens de Juda, à ses amis ». C’est à Tsiklag qu’il apprit la mort de Saül, et c’est de là qu’il monta à Hébron, à environ 43 km au nord-est, pour être oint roi."
