id: where-was-ziklag
question:
  en: "Where was Ziklag, David's town among the Philistines?"
  ru: "Где находился Секелаг, город Давида у филистимлян?"
  uk: "Де був Ціклаг, місто Давида серед філістимлян?"
  es: "¿Dónde estaba Siclag, la ciudad de David entre los filisteos?"
  pt: "Onde ficava Ziclague, a cidade de Davi entre os filisteus?"
  de: "Wo lag Ziklag, Davids Stadt bei den Philistern?"
  fr: "Où se trouvait Tsiklag, la ville de David chez les Philistins ?"
  pl: "Gdzie leżał Siklag, miasto Dawida wśród Filistynów?"
  it: "Dov’era Siclag, la città di Davide tra i Filistei?"
  cs: "Kde ležel Siklag, Davidovo město mezi Pelištejci?"
  nl: "Waar lag Ziklag, Davids stad onder de Filistijnen?"
  sv: "Var låg Siklag, Davids stad bland filistéerna?"
  nb: "Hvor lå Siklag, Davids by blant filistrene?"
  tl: "Nasaan ang Siclag, ang bayan ni David sa mga Filisteo?"
  da: "Hvor lå Siklag, Davids by blandt filisterne?"
  sr: "Где је био Сиклаг, Давидов град међу Филистејима?"
  hu: "Hol volt Ciklag, Dávid városa a filiszteusok között?"
  fi: "Missä oli Siklag, Daavidin kaupunki filistealaisten keskellä?"
  vi: "Xiếc-lác, thành của Đa-vít giữa người Phi-li-tin, ở đâu?"
  ro: "Unde se afla Țiclag, orașul lui David printre filisteni?"
  bg: "Къде се е намирал Циклаг — градът на Давид сред филистимците?"
answer:
  en:
    - "Ziklag was a town in the Negev, the dry south of Judah, but its exact site is disputed. The map point stands on Tell esh-Sharia (Tel Sera'), a mound on Nahal Gerar about 22 km north-west of Beersheba and 68 km south-west of Jerusalem in a straight line, which many scholars accept; Tel Halif, north-east of Beersheba, was proposed earlier, and in 2019 the excavators of Khirbet er-Ra'i near Lachish argued for their site, which others reject because it lies in the Shephelah rather than in the Negev."
    - "Fleeing from Saul, David asked Achish, king of Gath, for “a place in some town in the country”: “Then Achish gave him Ziklag that day: wherefore Ziklag pertaineth unto the kings of Judah unto this day.” He lived “in the country of the Philistines” for “a full year and four months”, raiding the peoples of the south from there. From Tell esh-Sharia Gath (Tell es-Safi) is about 38 km to the north in a straight line, far enough for David to act unseen."
    - "While David marched with the Philistine army, the Amalekites invaded the south and had “smitten Ziklag, and burned it with fire”, carrying off the women and children. He pursued them past the brook Besor, about 30 km west of the map point, recovered everything and sent part of the spoil “unto the elders of Judah, even to his friends”. At Ziklag he heard of Saul's death, and from there he went up to Hebron, about 43 km to the north-east, to be anointed king."
  ru:
    - "Секелаг — город в Негеве, сухом юге Иудеи, но где именно он стоял, спорят. Точка карты стоит на Телль-эш-Шариа (Тель-Сера), холме у русла Нахаль-Герар примерно в 22 км к северо-западу от Вирсавии и в 68 км к юго-западу от Иерусалима по прямой; это отождествление принимают многие учёные. Раньше предлагали Тель-Халиф к северо-востоку от Вирсавии, а в 2019 году раскопщики Хирбет-ар-Раи близ Лахиса назвали Секелагом свой холм; другие возражают, что он лежит в Шефеле, а не в Негеве."
    - "Спасаясь от Саула, Давид просил Анхуса, царя Гефского: «пусть дано будет мне место в одном из малых городов». «Тогда дал ему Анхус Секелаг, посему Секелаг и остался за царями Иудейскими доныне». Давид прожил «в стране Филистимской» год и четыре месяца и оттуда совершал набеги на народы юга. От Телль-эш-Шариа до Гефа (Телль-эс-Сафи) около 38 км к северу по прямой — достаточно далеко, чтобы Давид действовал незаметно."
    - "Пока Давид шёл с филистимским войском, Амаликитяне напали на Секелаг, «и взяли Секелаг и сожгли его огнем», уведя женщин и детей. Он догнал их за потоком Восор, примерно в 30 км к западу от точки карты, отбил всё и послал часть добычи «к старейшинам Иудиным, друзьям своим». В Секелаге он узнал о смерти Саула и оттуда поднялся в Хеврон, примерно в 43 км к северо-востоку, где его помазали на царство."
  uk:
    - "Ціклаг був містом у Негеві, сухому півдні Юди, але його точне місце спірне. Точка на мапі стоїть на Телль-еш-Шарії (Тель-Сера), пагорбі на Нахаль-Гераре приблизно за 22 км на північний захід від Беер-Шеви і за 68 км на південний захід від Єрусалима по прямій, що його приймають багато вчених; Тель-Халіф на північний схід від Беер-Шеви пропонували раніше, а 2019 р. розкопники Хірбет-ер-Раї біля Лахіша обстоювали своє місце, яке інші відкидають, бо воно лежить у Шефелі, а не в Негеві."
    - "Втікаючи від Саула, Давид просив Анхуса, царя Гата, про «місце на пробуваннє в которому з малих міст твоїх»: «І вказав Анхуз йому ще того ж дня Секелаг; тим остався Секелаг при царях Юдиних і по сей день». Він жив «у займищі Филистійському» «рік і чотири місяцї», звідти нападаючи на народи півдня. Від Телль-еш-Шарії до Гата (Телль-ес-Сафі) приблизно 38 км на північ по прямій — досить далеко, щоб Давид діяв непомітно."
    - "Поки Давид ішов з філістимським військом, амаликитяни вторглися на південь і «злупили Секелаг і спалили його огнем», забравши жінок і дітей. Він переслідував їх повз потік Бесор, приблизно за 30 км на захід від точки на мапі, повернув усе й надіслав частину здобичі «прихильним до його мужам громадським ув Юдї». У Ціклагу він почув про смерть Саула, і звідти він піднявся до Хеврона, приблизно за 43 км на північний схід, щоб бути помазаним на царя."
  es:
    - "Siclag era una ciudad del Négueb, el sur árido de Judá, pero su emplazamiento exacto se discute. El punto del mapa está sobre Tell esh-Sharia (Tel Sera'), un montículo en el Najal Gerar, a unos 22 km al noroeste de Beerseba y a 68 km al suroeste de Jerusalén en línea recta, que muchos estudiosos aceptan; antes se propuso Tel Halif, al noreste de Beerseba, y en 2019 los excavadores de Khirbet er-Ra'i, cerca de Laquis, defendieron su yacimiento, que otros rechazan porque está en la Sefelá y no en el Négueb."
    - "Huyendo de Saúl, David pidió a Aquis, rey de Gat, «lugar en algunas de las ciudades de la tierra»: «Y Achîs le dió aquel día á Siclag. De aquí fué Siclag de los reyes de Judá hasta hoy». Vivió «en la tierra de los Filisteos» un año completo y cuatro meses, haciendo desde allí incursiones contra los pueblos del sur. Desde Tell esh-Sharia, Gat (Tell es-Safi) queda a unos 38 km al norte en línea recta, lo bastante lejos para que David actuara sin ser visto."
    - "Mientras David marchaba con el ejército filisteo, los amalecitas invadieron el sur y habían «desolado á Siclag, y puéstola á fuego», llevándose cautivos a las mujeres y los niños. Los persiguió más allá del arroyo de Besor, a unos 30 km al oeste del punto del mapa, lo recuperó todo y envió parte del botín «á los ancianos de Judá, sus amigos». En Siclag supo de la muerte de Saúl, y desde allí subió a Hebrón, a unos 43 km al noreste, para ser ungido rey."
  pt:
    - "Ziclague era uma cidade no Neguebe, o sul árido de Judá, mas seu sítio exato é disputado. O ponto do mapa fica em Tell esh-Sharia (Tel Sera'), um monte no Nahal Gerar, a cerca de 22 km a noroeste de Berseba e 68 km a sudoeste de Jerusalém em linha reta, que muitos estudiosos aceitam; Tel Halif, a nordeste de Berseba, foi proposto antes, e em 2019 os escavadores de Khirbet er-Ra'i, perto de Laquis, defenderam o seu sítio, que outros rejeitam porque fica na Sefelá e não no Neguebe."
    - "Fugindo de Saul, Davi pediu a Aquis, rei de Gate, “um lugar numa das cidades do interior”: “Naquele dia, Aquis lhe deu Ziclague. Por isso Ziclague pertence aos reis de Judá até o dia de hoje.” Viveu “no território dos filisteus durante um ano e quatro meses”, atacando dali os povos do sul. De Tell esh-Sharia, Gate (Tell es-Safi) fica a cerca de 38 km ao norte em linha reta, longe o bastante para Davi agir sem ser visto."
    - "Enquanto Davi marchava com o exército filisteu, os amalequitas invadiram o sul e “Atacaram Ziclague e a incendiaram”, levando as mulheres e as crianças. Ele os perseguiu além do ribeiro Besor, a cerca de 30 km a oeste do ponto do mapa, recuperou tudo e enviou parte do despojo “aos anciãos de Judá, seus amigos”. Em Ziclague soube da morte de Saul, e dali subiu a Hebrom, a cerca de 43 km a nordeste, para ser ungido rei."
  de:
    - "Ziklag war eine Stadt im Negev, dem trockenen Süden Judas, doch ihre genaue Lage ist umstritten. Der Kartenpunkt steht auf Tell esch-Scharia (Tel Sera), einem Hügel am Nahal Gerar, in der Luftlinie etwa 22 km nordwestlich von Beerscheba und 68 km südwestlich von Jerusalem, den viele Gelehrte annehmen; Tel Halif nordöstlich von Beerscheba wurde früher vorgeschlagen, und 2019 setzten sich die Ausgräber von Chirbet er-Ra’i bei Lachisch für ihre Stätte ein, was andere ablehnen, weil sie in der Schefela statt im Negev liegt."
    - "Auf der Flucht vor Saul bat David Achis, den König von Gat, um „einen Raum in der Städte einer auf dem Lande“: „Da gab ihm Achis des Tages Ziklag. Daher gehört Ziklag zu den Königen Juda's bis auf diesen Tag.“ Er wohnte „in der Philister Lande“ ein Jahr und vier Monate und überfiel von dort die Völker des Südens. Von Tell esch-Scharia ist Gat (Tell es-Safi) in der Luftlinie etwa 38 km nach Norden entfernt, weit genug, damit David unbeobachtet handeln konnte."
    - "Während David mit dem Philisterheer zog, fielen die Amalekiter in den Süden ein und hatten „Ziklag geschlagen und mit Feuer verbrannt“ und die Frauen und Kinder weggeführt. Er verfolgte sie am Bach Besor vorbei, etwa 30 km westlich des Kartenpunkts, holte alles zurück und sandte einen Teil der Beute „den Ältesten in Juda, seinen Freunden“. In Ziklag hörte er von Sauls Tod, und von dort zog er nach Hebron hinauf, etwa 43 km nordöstlich, um zum König gesalbt zu werden."
  fr:
    - "Tsiklag était une ville du Négev, le sud aride de Juda, mais son site exact est discuté. Le point de la carte se trouve sur Tell esh-Sharia (Tel Sera‘), un tertre sur le Nahal Guérar, à environ 22 km au nord-ouest de Beer-Schéba et à 68 km au sud-ouest de Jérusalem à vol d’oiseau, que de nombreux spécialistes admettent ; Tel Halif, au nord-est de Beer-Schéba, avait été proposé plus tôt, et en 2019 les fouilleurs de Khirbet er-Ra‘i, près de Lakis, ont plaidé pour leur site, que d’autres rejettent parce qu’il se trouve dans la Shéphéla et non dans le Négev."
    - "Fuyant Saül, David demanda à Akisch, roi de Gath, « un lieu où je puisse demeurer » « dans l’une des villes du pays » : « Et ce même jour Akisch lui donna Tsiklag. C’est pourquoi Tsiklag a appartenu aux rois de Juda jusqu’à ce jour. » Il demeura « dans le pays des Philistins » pendant « un an et quatre mois », pillant de là les peuples du sud. De Tell esh-Sharia, Gath (Tell es-Safi) est à environ 38 km au nord à vol d’oiseau, assez loin pour que David agisse sans être vu."
    - "Pendant que David marchait avec l’armée philistine, les Amalécites envahirent le sud et avaient « détruit et brûlé Tsiklag », emmenant les femmes et les enfants. Il les poursuivit au-delà du torrent de Besor, à environ 30 km à l’ouest du point de la carte, reprit tout et envoya une partie du butin « aux anciens de Juda, à ses amis ». C’est à Tsiklag qu’il apprit la mort de Saül, et c’est de là qu’il monta à Hébron, à environ 43 km au nord-est, pour être oint roi."
  pl:
    - "Siklag było miastem w Negewie, suchym południu Judy, ale jego dokładne położenie jest sporne. Punkt na mapie stoi na Tell esh-Sharia (Tel Sera'), wzgórzu nad Nahal Gerar około 22 km na północny zachód od Beer-Szeby i 68 km na południowy zachód od Jerozolimy w linii prostej, które przyjmuje wielu uczonych; wcześniej proponowano Tel Halif, na północny wschód od Beer-Szeby, a w 2019 odkrywcy Khirbet er-Ra'i koło Lakisz dowodzili, że to ich stanowisko, co inni odrzucają, bo leży w Szefeli, a nie w Negewie."
    - "Uciekając przed Saulem, Dawid poprosił Achisza, króla Gat, o „miejsce w jednem z miast tego kraju”: „I dał mu Achis dnia onego Syceleg; dla tego Syceleg było królów Judzkich aż do dnia tego”. Mieszkał „w krainie Filistyńskiej” przez „rok i cztery miesiące”, stąd napadając na ludy południa. Z Tell esh-Sharia do Gat (Tell es-Safi) jest około 38 km na północ w linii prostej, dość daleko, by Dawid mógł działać niezauważony."
    - "Gdy Dawid maszerował z armią filistyńską, Amalekici najechali południe i „zburzyli Syceleg, i spalili go ogniem”, uprowadzając kobiety i dzieci. Ścigał ich za potok Besor, około 30 km na zachód od punktu na mapie, odzyskał wszystko i posłał część łupu „starszym w Juda, przyjaciołom swym”. W Siklag usłyszał o śmierci Saula i stamtąd poszedł do Hebronu, około 43 km na północny wschód, by zostać namaszczony na króla."
  it:
    - "Siclag era una città del Negheb, il sud arido di Giuda, ma il suo sito esatto è discusso. Il punto della mappa si trova su Tell esh-Sharia (Tel Sera‘), un tell sul Nahal Gerar a circa 22 km a nord-ovest di Bersabea e 68 km a sud-ovest di Gerusalemme in linea d’aria, che molti studiosi accettano; Tel Halif, a nord-est di Bersabea, fu proposto in precedenza, e nel 2019 gli scavatori di Khirbet er-Ra‘i presso Lachis sostennero il loro sito, che altri rifiutano perché si trova nella Sefela anziché nel Negheb."
    - "In fuga da Saul, Davide chiese ad Achis, re di Gat, «siami dato in una delle città della campagna un luogo dove io possa stabilirmi»: «Ed Akis, in quel giorno, gli diede Tsiklag; perciò Tsiklag ha appartenuto ai re di Giuda fino al dì d’oggi». Visse «nel paese dei Filistei» per «un anno e quattro mesi», compiendo da lì scorrerie contro i popoli del sud. Da Tell esh-Sharia Gat (Tell es-Safi) dista circa 38 km a nord in linea d’aria, abbastanza lontano perché Davide agisse non visto."
    - "Mentre Davide marciava con l’esercito filisteo, gli Amaleciti invasero il sud e «aveano presa Tsiklag e l’aveano incendiata», portando via donne e bambini. Egli li inseguì oltre il torrente Besor, a circa 30 km a ovest del punto della mappa, recuperò ogni cosa e mandò parte del bottino «agli anziani di Giuda, suoi amici». A Siclag seppe della morte di Saul, e da lì salì a Ebron, a circa 43 km a nord-est, per essere unto re."
  cs:
    - "Siklag bylo město v Negevu, suchém jihu Judy, ale jeho přesné místo je sporné. Bod na mapě stojí na Tell esh-Sharia (Tel Sera‘), pahorku na Nachal Gerar asi 22 km severozápadně od Beer-šeby a vzdušnou čarou 68 km jihozápadně od Jeruzaléma, který přijímají mnozí badatelé; dříve byl navržen Tel Halif severovýchodně od Beer-šeby a roku 2019 hájili vykopávači Chirbet er-Ra‘i poblíž Lachiše své naleziště, které jiní odmítají, protože leží v Šefele, nikoli v Negevu."
    - "David na útěku před Saulem požádal Achiše, krále Gatu, o „místo v některém městě krajiny této“: „I dal mu Achis v ten den Sicelech, odkudž Sicelech bylo králů Judských až do dne tohoto.“ Žil „v krajině Filistinské“ po celý rok a čtyři měsíce a odtud přepadal národy na jihu. Z Tell esh-Sharia je to do Gatu (Tell es-Safí) vzdušnou čarou asi 38 km na sever, dost daleko, aby David mohl jednat nepozorován."
    - "Zatímco David táhl s pelištejským vojskem, vpadli Amalekovci na jih a „vyhubili Sicelech, a vypálili jej“ a odvedli ženy a děti. David je pronásledoval za potok Besor, asi 30 km západně od bodu na mapě, všechno získal zpět a část kořisti poslal „starším Juda, přátelům svým“. V Siklagu se dověděl o Saulově smrti a odtud vystoupil do Hebronu, asi 43 km na severovýchod, aby byl pomazán králem."
  nl:
    - "Ziklag was een stad in de Negev, het droge zuiden van Juda, maar de exacte plaats is omstreden. Het punt op de kaart staat op Tell esh-Sharia (Tel Sera'), een heuvel aan de Nahal Gerar ongeveer 22 km ten noordwesten van Berseba en hemelsbreed 68 km ten zuidwesten van Jeruzalem, die veel geleerden aanvaarden; Tel Halif, ten noordoosten van Berseba, werd eerder voorgesteld, en in 2019 bepleitten de opgravers van Khirbet er-Ra'i bij Lachis hun plaats, die anderen verwerpen omdat die in de Sefela ligt en niet in de Negev."
    - "Op de vlucht voor Saul vroeg David aan Achis, koning van Gat, om “een plaats in een van de steden des lands”: “Toen gaf Achis te dien dage Ziklag; daarom is Ziklag van de koningen van Juda geweest tot op dezen dag.” Hij woonde “in het land der Filistijnen” gedurende “een jaar en vier maanden” en overviel van daaruit de volken van het zuiden. Vanaf Tell esh-Sharia ligt Gat (Tell es-Safi) hemelsbreed ongeveer 38 km naar het noorden, ver genoeg zodat David ongezien kon handelen."
    - "Terwijl David met het Filistijnse leger optrok, vielen de Amalekieten het zuiden binnen en hadden Ziklag “geslagen, en dezelve met vuur verbrand”, waarbij de vrouwen en kinderen werden weggevoerd. Hij achtervolgde hen voorbij de beek Besor, ongeveer 30 km ten westen van het punt op de kaart, kreeg alles terug en zond een deel van de buit “tot de oudsten van Juda, zijn vrienden”. Te Ziklag hoorde hij van de dood van Saul, en vanaf daar ging hij naar Hebron, ongeveer 43 km naar het noordoosten, om tot koning te worden gezalfd."
  sv:
    - "Siklag var en stad i Negev, Judas torra söder, men dess exakta läge är omstritt. Kartpunkten står på Tell esh-Sharia (Tel Sera'), en kulle vid Nahal Gerar omkring 22 km nordväst om Beer Sheva och 68 km sydväst om Jerusalem i fågelvägen, som många forskare godtar; Tel Halif, nordost om Beer Sheva, föreslogs tidigare, och 2019 argumenterade utgrävarna av Khirbet er-Ra'i nära Lakish för sin plats, vilket andra avvisar eftersom den ligger i Shefela snarare än i Negev."
    - "På flykt undan Saul bad David Akish, kung av Gat, om ”någon av landsortsstäderna, så att jag får vistas där”: ”Då gav Akis honom samma dag Siklag. Därför hör Siklag ännu i dag under Juda konungar.” Han bodde i filistéernas land ”sammanräknat ett år och fyra månader” och gjorde därifrån räder mot folken i söder. Från Tell esh-Sharia är Gat (Tell es-Safi) omkring 38 km åt norr i fågelvägen, tillräckligt långt för att David skulle kunna agera osedd."
    - "Medan David tågade med den filisteiska hären hade amalekiterna infallit i söder och ”intagit Siklag och bränt upp det i eld”, och fört bort kvinnorna och barnen. Han förföljde dem förbi bäcken Besor, omkring 30 km väster om kartpunkten, återvann allt och sände en del av bytet ”till de äldste i Juda, sina vänner”. I Siklag hörde han om Sauls död, och därifrån drog han upp till Hebron, omkring 43 km åt nordost, för att smörjas till kung."
  nb:
    - "Siklag var en by i Negev, Judas tørre sør, men dens nøyaktige beliggenhet er omstridt. Kartpunktet står på Tell esh-Sharia (Tel Sera‘), en haug ved Nahal Gerar omtrent 22 km nordvest for Beer-Sjeba og 68 km sørvest for Jerusalem i luftlinje, som mange forskere godtar; Tel Halif, nordøst for Beer-Sjeba, ble foreslått tidligere, og i 2019 argumenterte utgraverne av Khirbet er-Ra‘i nær Lakisj for sitt sted, som andre avviser fordi det ligger i Sjefela og ikke i Negev."
    - "På flukt fra Saul ba David Akisj, kongen i Gat, om «et sted å bo på i en av landsbyene»: «Da gav Akis ham samme dag Siklag; derfor har Siklag hørt Judas konger til helt til denne dag.» Han bodde «i filistrenes land» i «ett år og fire måneder» og gjorde derfra plyndringstokter mot folkene i sør. Fra Tell esh-Sharia er det omtrent 38 km i luftlinje nordover til Gat (Tell es-Safi), langt nok til at David kunne handle uten å bli sett."
    - "Mens David marsjerte med filisterhæren, invaderte amalekittene sør og «hadde inntatt Siklag og brent det op», og førte bort kvinnene og barna. Han forfulgte dem forbi Besor-bekken, omtrent 30 km vest for kartpunktet, vant alt tilbake og sendte en del av byttet til «Judas eldste, de som var hans venner». I Siklag hørte han om Sauls død, og derfra dro han opp til Hebron, omtrent 43 km mot nordøst, for å bli salvet til konge."
  tl:
    - "Ang Siclag ay isang bayan sa Negev, ang tuyong timog ng Juda, ngunit pinagtatalunan ang eksaktong pook nito. Nasa Tell esh-Sharia (Tel Sera') ang punto sa mapa, isang burol sa Nahal Gerar mga 22 km sa hilagang-kanluran ng Beer-seba at 68 km sa timog-kanluran ng Jerusalem sa tuwid na guhit, na tinatanggap ng maraming iskolar; iminungkahi nang mas maaga ang Tel Halif, sa hilagang-silangan ng Beer-seba, at noong 2019 ipinagtanggol ng mga naghukay ng Khirbet er-Ra'i malapit sa Lachis ang kanilang pook, na tinatanggihan ng iba dahil nasa Sephela ito sa halip na sa Negev."
    - "Sa pagtakas kay Saul, humingi si David kay Achis, hari ng Gath, ng “isang matatahanan sa isa sa mga bayan sa lupain”: “Nang magkagayo'y ibinigay ni Achis sa kaniya ang Siclag nang araw na yaon: kaya't ang Siclag ay nauukol sa mga hari sa Juda hanggang sa araw na ito.” Tumira siya “sa lupain ng mga Filisteo” nang “isang buong taon, at apat na buwan”, at doon sinalakay ang mga bayan sa timog. Mula sa Tell esh-Sharia, ang Gath (Tell es-Safi) ay mga 38 km sa hilaga sa tuwid na guhit, sapat ang layo para kumilos si David nang hindi nakikita."
    - "Habang sumama si David sa hukbong Filisteo, sinalakay ng mga Amalecita ang timog at “sinaktan ang Siclag, at sinunog ng apoy”, na tinangay ang mga babae at bata. Hinabol niya sila lampas sa batis ng Besor, mga 30 km sa kanluran ng punto sa mapa, binawi ang lahat at nagpadala ng bahagi ng samsam “sa mga matanda sa Juda, sa makatuwid baga'y sa kaniyang mga kaibigan”. Sa Siclag niya narinig ang pagkamatay ni Saul, at mula roon umahon siya sa Hebron, mga 43 km sa hilagang-silangan, upang pahiran bilang hari."
  da:
    - "Siklag var en by i Negev, Judas tørre syd, men dens nøjagtige beliggenhed er omstridt. Kortets punkt står på Tell esh-Sharia (Tel Sera’), en tell ved Nahal Gerar ca. 22 km nordvest for Beersheba og 68 km sydvest for Jerusalem i fugleflugt, som mange forskere accepterer; Tel Halif, nordøst for Beersheba, blev foreslået tidligere, og i 2019 argumenterede udgraverne af Khirbet er-Ra’i nær Lakisj for deres sted, som andre afviser, fordi det ligger i Sjefela og ikke i Negev."
    - "På flugt fra Saul bad David Akisj, konge af Gat, om »et Sted i een af Byerne i Landet«: »Da gav Akis ham Ziklag samme Dag; derfor er Ziklag Judas Kongers indtil denne Dag.« Han boede »i Filisternes Land« i »eet Aar og fire Maaneder« og plyndrede sydens folk derfra. Fra Tell esh-Sharia er der til Gat (Tell es-Safi) ca. 38 km mod nord i fugleflugt, langt nok til, at David kunne handle uset."
    - "Mens David drog med filisternes hær, faldt amalekitterne ind i syd og havde »slaaet Ziklag og opbrændt den med Ild« og bortført kvinderne og børnene. Han forfulgte dem forbi Besor-bækken, ca. 30 km vest for kortets punkt, bragte alt tilbage og sendte en del af byttet »til de Ældste i Juda, til sine Venner«. I Siklag hørte han om Sauls død, og derfra drog han op til Hebron, ca. 43 km mod nordøst, for at blive salvet til konge."
  sr:
    - "Сиклаг је био град у Негеву, сушном југу Јуде, али његово тачно место је спорно. Тачка на карти стоји на Тел еш-Шарији (Тел Сера), хумци на Нахал Герару око 22 км северозападно од Вирсавеје и 68 км југозападно од Јерусалима ваздушном линијом, коју многи научници прихватају; Тел Халиф, североисточно од Вирсавеје, предлаган је раније, а 2019. ископавачи Хирбет ер-Раија код Лахиса заступали су своје налазиште, што други одбацују јер лежи у Сефели, а не у Негеву."
    - "Бежећи од Саула, Давид је тражио од Ахиса, краља Гата, „место у коме граду ове земље“: „И даде му Ахис оног дана Сиклаг. Зато Сиклаг припада царевима Јудиним до данашњег дана.“ Живео је „у земљи филистејској“ „годину и четири месеца“, одатле нападајући народе на југу. Од Тел еш-Шарије Гат (Тел ес-Сафи) је око 38 км северно ваздушном линијом, довољно далеко да Давид делује невиђен."
    - "Док је Давид марширао с филистејском војском, Амаличани су упали на југ и „развалили Сиклаг и огњем га спалили“, одневши жене и децу. Гонио их је преко потока Восор, око 30 км западно од тачке на карти, повратио све и послао део плена „старешинама Јудиним, пријатељима својим“. У Сиклагу је чуо за Саулову смрт, и одатле је отишао у Хеврон, око 43 км североисточно, да буде помазан за краља."
  hu:
    - "Ciklag a Negev, Júda száraz déli részének városa volt, de pontos helye vitatott. A térkép pontja Tell esh-Shariánál (Tel Sera') áll, a Nahal Gerar menti halomnál, Beérsebától mintegy 22 km-re északnyugatra és Jeruzsálemtől légvonalban 68 km-re délnyugatra, amelyet sok tudós elfogad; a Beérsebától északkeletre fekvő Tel Halifot korábban javasolták, 2019-ben pedig a Lákis melletti Khirbet er-Ra'i ásatói érveltek a maguk helye mellett, amit mások elutasítanak, mert a Sefélában fekszik, nem a Negevben."
    - "Saul elől menekülve Dávid azt kérte Ákistól, Gát királyától: „adj helyet nékem valamelyik vidéki városban”. „És néki adá Ákhis azon a napon Siklágot; lőn azért Siklág a Júda királyaié mind e mai napig.” Ott „a Filiszteusok földén” lakott, „egy esztendő és négy hónap” ideig, onnan fosztogatva a déli népeket. Tell esh-Shariától Gát (Tell es-Safi) légvonalban mintegy 38 km-re északra van, elég messze ahhoz, hogy Dávid észrevétlenül cselekedhessen."
    - "Miközben Dávid a filiszteus sereggel vonult, az amálekiták megszállták a déli vidéket, és „leverték Siklágot, és felégették azt tűzzel”, elhurcolva az asszonyokat és gyermekeket. Üldözte őket a Besór patakon túl, a térkép pontjától mintegy 30 km-re nyugatra, mindent visszaszerzett, és a zsákmány egy részét elküldte „Júda véneinek, az ő barátainak”. Ciklagban hallott Saul haláláról, és onnan ment fel Hebronba, mintegy 43 km-re északkeletre, hogy királlyá kenjék."
  fi:
    - "Siklag oli kaupunki Negevissä, Juudan kuivassa eteläosassa, mutta sen tarkka sijainti on kiistanalainen. Kartan piste on Tell esh-Shariassa (Tel Sera‘), Nahal Gerarin varrella olevalla kummulla noin 22 km Beersebasta luoteeseen ja 68 km Jerusalemista lounaaseen linnuntietä, jonka monet tutkijat hyväksyvät; Tel Halifia Beersebasta koilliseen ehdotettiin aiemmin, ja vuonna 2019 Lakiksen lähellä sijaitsevan Khirbet er-Ra‘in kaivajat puolsivat omaa kohdettaan, jota toiset eivät hyväksy, koska se sijaitsee Sefelassa eikä Negevissä."
    - "Paetessaan Saulia Daavid pyysi Gatin kuninkaalta Akikselta: ”annettakoon minulle paikka jossakin maaseutukaupungissa”. ”Niin Aakis antoi hänelle sinä päivänä Siklagin. Sentähden on Siklag Juudan kuningasten oma vielä tänä päivänä.” Hän ”asui filistealaisten maassa, oli vuosi ja neljä kuukautta”, ja ryösti sieltä käsin etelän kansoja. Tell esh-Shariasta Gat (Tell es-Safi) on noin 38 km pohjoiseen linnuntietä, riittävän kaukana, jotta Daavid saattoi toimia huomaamatta."
    - "Daavidin marssiessa filistealaisten armeijan mukana amalekilaiset tunkeutuivat etelään ja ”olivat vallanneet Siklagin ja polttaneet sen tulella” ja veivät mukanaan naiset ja lapset. Hän ajoi heitä takaa Besorin puron ohi, noin 30 km kartan pisteestä länteen, sai kaiken takaisin ja lähetti osan saaliista ”Juudan vanhimmille, ystävillensä”. Siklagissa hän kuuli Saulin kuolemasta, ja sieltä hän nousi Hebroniin, noin 43 km koilliseen, tulemaan voidelluksi kuninkaaksi."
  vi:
    - "Xiếc-lác là một thị trấn ở Negev, miền nam khô cằn của Giu-đa, nhưng địa điểm chính xác còn tranh luận. Điểm trên bản đồ nằm trên Tell esh-Sharia (Tel Sera‘), một gò trên Nahal Gerar cách Bê-e-Sê-ba khoảng 22 km về phía tây bắc và cách Giê-ru-sa-lem 68 km về phía tây nam theo đường thẳng, mà nhiều học giả chấp nhận; Tel Halif, phía đông bắc Bê-e-Sê-ba, từng được đề xuất sớm hơn, và năm 2019 các nhà khai quật Khirbet er-Ra‘i gần La-ki lập luận cho địa điểm của họ, điều những người khác bác bỏ vì nó nằm ở Sê-phê-la chứ không phải ở Negev."
    - "Chạy trốn Sau-lơ, Đa-vít xin A-kích, vua Gát, “một nơi nào thuộc về các thành ở ngoài đồng bằng”: “trong ngày đó A-kích ban Xiếc-lác cho người; bởi cớ ấy, Xiếc-lác thuộc về vua Giu-đa cho đến ngày nay.” Ông ở “trong xứ dân Phi-li-tin” “một năm bốn tháng”, từ đó đột kích các dân miền nam. Từ Tell esh-Sharia đến Gát (Tell es-Safi) khoảng 38 km về phía bắc theo đường thẳng, đủ xa để Đa-vít hành động mà không ai thấy."
    - "Trong khi Đa-vít hành quân cùng quân Phi-li-tin, người A-ma-léc xâm lấn miền nam và “xông vào Xiếc-lác và đã phóng hỏa nó”, bắt đi đàn bà và trẻ con. Ông đuổi theo họ qua Suối Bê-sô, cách điểm trên bản đồ khoảng 30 km về phía tây, thu hồi mọi thứ và gởi một phần chiến lợi phẩm “cho các trưởng lão Giu-đa, tức là bạn hữu người”. Tại Xiếc-lác, ông nghe tin Sau-lơ chết, và từ đó ông lên Hếp-rôn, cách khoảng 43 km về phía đông bắc, để được xức dầu làm vua."
  ro:
    - "Țiclag era un oraș din Neghev, sudul uscat al lui Iuda, dar locul său exact este disputat. Punctul de pe hartă se află pe Tell esh-Sharia (Tel Sera), o movilă pe Nahal Gerar, la circa 22 km nord-vest de Beer-Șeba și la 68 km sud-vest de Ierusalim în linie dreaptă, pe care o acceptă mulți cercetători; Tel Halif, la nord-est de Beer-Șeba, fusese propus mai devreme, iar în 2019 cei care au săpat la Khirbet er-Ra‘i, lângă Lachiș, și-au susținut locul, pe care alții îl resping pentru că se află în Șefela, nu în Neghev."
    - "Fugind de Saul, David i-a cerut lui Achiș, regele Gatului, „loc într’o cetate la câmp”: „Și Anhis i-a dat lui în ziua aceea Sichelagul, pentru aceea a fost Sichelagul a împăratului Iudei până în ziua aceasta.” A locuit „în pământul celor de alt neam” „patru luni”, atacând de acolo popoarele din sud. De la Tell esh-Sharia, Gatul (Tell es-Safi) se află la circa 38 km spre nord în linie dreaptă, destul de departe ca David să acționeze nevăzut."
    - "Pe când David mărșăluia cu armata filistenilor, amaleciții au invadat sudul; Amalic „a bătut Sichelagul și l-a ars cu foc”, luând femeile și copiii. El i-a urmărit dincolo de pârâul Besor, la circa 30 km vest de punctul de pe hartă, a recuperat totul și a trimis o parte din pradă „bătrânilor lui Iuda și celor de aproape ai săi”. La Țiclag a aflat de moartea lui Saul și de acolo s-a urcat la Hebron, la circa 43 km spre nord-est, ca să fie uns rege."
  bg:
    - "Циклаг беше град в Негев, сухия юг на Юда, но точното му място е спорно. Точката на картата стои на Тел еш-Шариа (Тел Сера) — хълм на Нахал Герар на около 22 км северозападно от Вирсавия и на 68 км югозападно от Йерусалим по права линия, който мнозина учени приемат; по-рано е предлаган Тел Халиф, североизточно от Вирсавия, а през 2019 г. разкопвачите на Хирбет ер-Раи край Лахис защитиха своя обект, който други отхвърлят, защото лежи в Шефела, а не в Негев."
    - "Бягайки от Саул, Давид поиска от Анхус, царя на Гет, „място в някой от полските градове“: „И даде му Анхус в този ден Сиклаг; за това Сиклаг остана на Юдините царе и до днес.“ Той живя „в земята на Филистимците“ „една година и четири месеца“, като оттам нападаше народите на юга. От Тел еш-Шариа до Гет (Тел ес-Сафи) има около 38 км на север по права линия — достатъчно далеч, за да действа Давид незабелязано."
    - "Докато Давид вървеше с филистимската войска, амаликитяните нахлуха на юг и „поразили бяха Сиклаг и изгорили го бяха с огън“, като отведоха жените и децата. Той ги преследва отвъд потока Восор, на около 30 км западно от точката на картата, върна всичко и изпрати част от плячката „на Юдините старейшини, на приятелите си“. В Циклаг той чу за смъртта на Саул и оттам се изкачи в Хеврон, на около 43 км на североизток, за да бъде помазан за цар."
