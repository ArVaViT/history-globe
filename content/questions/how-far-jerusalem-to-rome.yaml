id: how-far-jerusalem-to-rome
question:
  en: "How far is it from Jerusalem to Rome?"
  ru: "Как далеко от Иерусалима до Рима?"
  uk: "Як далеко від Єрусалиму до Рима?"
  es: "¿Qué distancia hay de Jerusalén a Roma?"
  pt: "Qual é a distância de Jerusalém a Roma?"
  de: "Wie weit ist es von Jerusalem nach Rom?"
  fr: "Quelle distance y a-t-il de Jérusalem à Rome ?"
  pl: "Jak daleko jest z Jerozolimy do Rzymu?"
  it: "Quanto dista Roma da Gerusalemme?"
  nl: "Hoe ver is het van Jeruzalem naar Rome?"
  cs: "Jak daleko je to z Jeruzaléma do Říma?"
  sv: "Hur långt är det från Jerusalem till Rom?"
  nb: "Hvor langt er det fra Jerusalem til Roma?"
  tl: "Gaano kalayo mula sa Jerusalem hanggang sa Roma?"
answer:
  en:
    - "Rome is about 2,305 km north-west of Jerusalem in a straight line, and about 2,235 km from Caesarea, the port from which Paul sailed. By his actual route on the map, from Caesarea by Sidon, Myra and Crete to the shipwreck on Malta (Melita) and on by Sicily to Puteoli and the Appian Way, the journey measures about 2,995 km stop to stop; it began in the autumn of AD 59 and, after three months' wintering on the island, ended in the spring of 60 on the usual chronology."
    - 'Paul had long wished to see Rome: "oftentimes I purposed to come unto you", he wrote to the Romans, hoping to pass through on his way to Spain. In Jerusalem the Lord told him, "as thou hast testified of me in Jerusalem, so must thou bear witness also at Rome." He arrived as a prisoner. At Puteoli, the port in the Bay of Naples, "we found brethren, and were desired to tarry with them seven days: and so we went toward Rome"; believers came out to meet him "as far as Appii forum, and The three taverns", and in Rome he "was suffered to dwell by himself with a soldier that kept him". The last stage, from Puteoli to Rome by the Appian Way, is about 205 km on the map.'
    - "Rome lies on the Tiber about 25 km from the sea. Its Jewish community grew largely from captives whom Pompey brought to Italy after taking Jerusalem in 63 BC; about AD 49 Claudius expelled the Jews from the city, which is how Aquila and Priscilla came to Corinth. Paul lived two whole years in his own hired house, preaching; after the fire of AD 64 Nero blamed the Christians, and early tradition holds that Peter and Paul were put to death in Rome under him. Ten years after Paul's arrival, in AD 70, an army from Rome destroyed Jerusalem and its Temple."
  ru:
    - "Рим лежит примерно в 2305 км к северо-западу от Иерусалима по прямой и в 2235 км от Кесарии — гавани, из которой отплыл Павел. По его действительному маршруту на карте — из Кесарии мимо Сидона, Мир и Крита до кораблекрушения у Мелита (Мальты) и дальше мимо Сицилии в Путеол и по Аппиевой дороге — путь составляет около 2995 км от остановки к остановке; он начался осенью 59 г. н. э. и после трёхмесячной зимовки на Мелите закончился весной 60 г. по обычной хронологии."
    - "Павел давно хотел увидеть Рим: «я многократно намеревался придти к вам», писал он римлянам, надеясь пройти через Рим по пути в Испанию. В Иерусалиме Господь сказал ему: «как ты свидетельствовал о Мне в Иерусалиме, так надлежит тебе свидетельствовать и в Риме». Он прибыл узником. В Путеоле, гавани в Неаполитанском заливе, «нашли братьев, и были упрошены пробыть у них семь дней, а потом пошли в Рим»; верующие вышли навстречу «до Аппиевой площади и трех гостиниц», а в Риме «Павлу позволено жить особо с воином, стерегущим его». Последний отрезок, от Путеола до Рима по Аппиевой дороге, — около 205 км на карте."
    - "Рим стоит на Тибре примерно в 25 км от моря. Его иудейская община выросла главным образом из пленников, которых Помпей привёл в Италию после взятия Иерусалима в 63 г. до н. э.; около 49 г. н. э. Клавдий изгнал иудеев из города, и так Акила и Прискилла оказались в Коринфе. Павел целых два года жил на своём иждивении, проповедуя; после пожара 64 г. Нерон обвинил христиан, и раннее предание говорит, что Пётр и Павел приняли при нём смерть в Риме. Через десять лет после прибытия Павла, в 70 г. н. э., войско из Рима разрушило Иерусалим и Храм."
  uk:
    - "Рим лежить приблизно за 2305 км на північний захід від Єрусалиму по прямій і приблизно за 2235 км від Кесарії, порту, звідки відплив Павло. За його справжнім маршрутом на мапі, з Кесарії через Сідон, Мири Лікійські й Крит до корабельної аварії на Мальті (Мелиті) та далі повз Сицилію до Путеол і Аппієвою дорогою, подорож становить близько 2995 км від зупинки до зупинки; вона почалася восени 59 р. н. е. і, після тримісячної зимівлі на острові, закінчилася навесні 60 р. за звичною хронологією."
    - "Павло давно прагнув побачити Рим: «часто заміряв я прийти до вас», писав він римлянам, сподіваючись заїхати до них дорогою в Іспанію. В Єрусалимі Господь сказав йому: «як бо ти сьвідкував про мене в Єрусалимі, так ти маєш і в Римі сьвідкувати». Він прибув як в'язень. У Путеолах, порту в Неаполітанській затоці, «знайшовши братів, ублагані були від них перебути у них сїм день»; віруючі вийшли назустріч йому «аж до Апиєвого торгу та Трох Гостинниць», а в Римі йому «дозволено жити окроме з воїном, що стеріг його». Останній відтинок, від Путеол до Рима Аппієвою дорогою, на мапі становить близько 205 км."
    - "Рим лежить на Тибрі приблизно за 25 км від моря. Його єврейська громада виросла здебільшого з полонених, яких Помпей привіз в Італію після взяття Єрусалиму 63 р. до н. е.; близько 49 р. н. е. Клавдій вигнав євреїв із міста, і тому Акила й Прискилла опинилися в Коринті. Павло прожив два цілі роки у власній винайнятій хаті, проповідуючи; після пожежі 64 р. н. е. Нерон звинуватив християн, і рання традиція стверджує, що Петра й Павла було страчено в Римі за нього. Через десять років після прибуття Павла, 70 р. н. е., римське військо зруйнувало Єрусалим і його Храм."
  es:
    - "Roma está a unos 2305 km al noroeste de Jerusalén en línea recta, y a unos 2235 km de Cesarea, el puerto del que zarpó Pablo. Por su ruta real en el mapa, desde Cesarea por Sidón, Mira y Creta hasta el naufragio en Malta (Melita) y de allí por Sicilia hasta Puteoli y la vía Apia, el viaje mide unos 2995 km de escala en escala; comenzó en el otoño del año 59 d. C. y, tras tres meses de invernada en la isla, terminó en la primavera del 60 según la cronología habitual."
    - "Pablo había deseado ver Roma desde hacía tiempo: «muchas veces me he propuesto ir á vosotros», escribió a los romanos, con la esperanza de pasar por allí camino de España. En Jerusalén el Señor le dijo: «como has testificado de mí en Jerusalem, así es menester testifiques también en Roma». Llegó como preso. En Puteoli, el puerto del golfo de Nápoles, «habiendo hallado hermanos, nos rogaron que quedásemos con ellos siete días; y luego vinimos á Roma»; los creyentes salieron a recibirlo «hasta la plaza de Appio, y Las Tres Tabernas», y en Roma «le fué permitido estar por sí, con un soldado que le guardase». El último tramo, de Puteoli a Roma por la vía Apia, mide unos 205 km en el mapa."
    - "Roma se alza sobre el Tíber, a unos 25 km del mar. Su comunidad judía creció en buena parte con los cautivos que Pompeyo llevó a Italia tras tomar Jerusalén en el 63 a. C.; hacia el 49 d. C. Claudio expulsó a los judíos de la ciudad, y así llegaron Aquila y Priscila a Corinto. Pablo vivió dos años enteros en su casa de alquiler, predicando; tras el incendio del 64 d. C., Nerón culpó a los cristianos, y la tradición antigua sostiene que Pedro y Pablo fueron ejecutados en Roma bajo él. Diez años después de la llegada de Pablo, en el 70 d. C., un ejército de Roma destruyó Jerusalén y su Templo."
  pt:
    - "Roma fica a cerca de 2.305 km a noroeste de Jerusalém em linha reta, e a cerca de 2.235 km de Cesareia, o porto de onde Paulo zarpou. Pela sua rota real no mapa, de Cesareia por Sidom, Mira e Creta até o naufrágio em Malta (Melita) e daí pela Sicília até Putéoli e a via Ápia, a viagem mede cerca de 2.995 km de parada em parada; começou no outono de 59 d.C. e, depois de três meses de invernada na ilha, terminou na primavera de 60, pela cronologia usual."
    - "Paulo desejava havia muito ver Roma: “muitas vezes planejei ir até vocês”, escreveu aos romanos, esperando passar por lá a caminho da Espanha. Em Jerusalém o Senhor lhe disse: “assim como você testemunhou a meu respeito em Jerusalém, assim você deve testemunhar também em Roma”. Chegou como prisioneiro. Em Putéoli, o porto do golfo de Nápoles, “encontramos irmãos, e fomos convidados a ficar com eles por sete dias. E assim fomos para Roma”; os crentes saíram ao seu encontro “até a Praça de Ápio e as Três Vendas”, e em Roma ele “recebeu permissão para morar por conta própria, com o soldado que o guardava”. O último trecho, de Putéoli a Roma pela via Ápia, tem cerca de 205 km no mapa."
    - "Roma fica no Tibre, a cerca de 25 km do mar. Sua comunidade judaica cresceu em grande parte dos cativos que Pompeu trouxe à Itália depois de tomar Jerusalém em 63 a.C.; por volta de 49 d.C. Cláudio expulsou os judeus da cidade, e assim Áquila e Priscila chegaram a Corinto. Paulo viveu dois anos inteiros em sua própria casa alugada, pregando; depois do incêndio de 64 d.C. Nero culpou os cristãos, e a tradição antiga diz que Pedro e Paulo foram mortos em Roma sob ele. Dez anos depois da chegada de Paulo, em 70 d.C., um exército vindo de Roma destruiu Jerusalém e o seu Templo."
  de:
    - "Rom liegt etwa 2305 km nordwestlich von Jerusalem in der Luftlinie und etwa 2235 km von Caesarea, dem Hafen, von dem Paulus absegelte. Auf seiner tatsächlichen Route auf der Karte, von Caesarea über Sidon, Myra und Kreta zum Schiffbruch auf Malta (Melite) und weiter über Sizilien nach Puteoli und auf der Via Appia, misst die Reise von Halt zu Halt etwa 2995 km; sie begann im Herbst 59 n. Chr. und endete nach dreimonatiger Überwinterung auf der Insel nach der üblichen Chronologie im Frühjahr 60."
    - "Paulus wollte Rom lange sehen: „daß ich mir oft habe vorgesetzt, zu euch zu kommen“, schrieb er den Römern und hoffte, auf dem Weg nach Spanien bei ihnen durchzureisen. In Jerusalem sagte ihm der Herr: „Denn wie du von mir zu Jerusalem gezeugt hast, also mußt du auch zu Rom zeugen.“ Er kam als Gefangener. In Puteoli, dem Hafen am Golf von Neapel, „fanden wir Brüder und wurden von ihnen gebeten, daß wir sieben Tage dablieben. Und also kamen wir gen Rom“; Gläubige gingen aus, ihm entgegen, „bis gen Appifor und Tretabern“, und in Rom „ward erlaubt zu bleiben, wo er wollte, mit einem Kriegsknechte, der ihn hütete“. Die letzte Etappe, von Puteoli nach Rom auf der Via Appia, beträgt auf der Karte etwa 205 km."
    - "Rom liegt am Tiber etwa 25 km vom Meer. Seine jüdische Gemeinde wuchs großenteils aus Gefangenen, die Pompeius nach der Einnahme Jerusalems 63 v. Chr. nach Italien brachte; um 49 n. Chr. wies Klaudius die Juden aus der Stadt aus, wodurch Aquila und Priscilla nach Korinth kamen. Paulus lebte zwei volle Jahre in seiner eigenen gemieteten Wohnung und predigte; nach dem Brand von 64 n. Chr. gab Nero den Christen die Schuld, und die frühe Überlieferung hält, dass Petrus und Paulus unter ihm in Rom hingerichtet wurden. Zehn Jahre nach der Ankunft des Paulus, im Jahr 70 n. Chr., zerstörte ein Heer aus Rom Jerusalem und seinen Tempel."
  fr:
    - "Rome est à environ 2 305 km au nord-ouest de Jérusalem en ligne droite, et à environ 2 235 km de Césarée, le port d’où Paul embarqua. Par son itinéraire réel sur la carte, de Césarée par Sidon, Myra et la Crète jusqu’au naufrage à Malte (Mélita), puis par la Sicile jusqu’à Pouzzoles et la voie Appienne, le voyage mesure environ 2 995 km d’étape en étape ; commencé à l’automne de 59 apr. J.-C., il s’acheva, après trois mois d’hivernage dans l’île, au printemps de 60 selon la chronologie habituelle."
    - "Paul désirait depuis longtemps voir Rome : « j’ai souvent formé le projet d’aller vous voir », écrivit-il aux Romains, espérant passer chez eux en allant en Espagne. À Jérusalem, le Seigneur lui dit : « de même que tu as rendu témoignage de moi dans Jérusalem, il faut aussi que tu rendes témoignage dans Rome. » Il y arriva prisonnier. À Pouzzoles, port du golfe de Naples, « nous trouvâmes des frères qui nous prièrent de passer sept jours avec eux. Et c’est ainsi que nous allâmes à Rome » ; des croyants vinrent à sa rencontre « jusqu’au Forum d’Appius et aux Trois Tavernes », et à Rome « on permit à Paul de demeurer en son particulier, avec un soldat qui le gardait ». Le dernier tronçon, de Pouzzoles à Rome par la voie Appienne, est d’environ 205 km sur la carte."
    - "Rome est sur le Tibre, à environ 25 km de la mer. Sa communauté juive s’était formée en grande partie de captifs que Pompée amena en Italie après la prise de Jérusalem en 63 av. J.-C. ; vers 49 apr. J.-C., Claude expulsa les Juifs de la ville, ce qui explique comment Aquilas et Priscille se trouvèrent à Corinthe. Paul vécut deux années entières dans une maison qu’il avait louée, prêchant ; après l’incendie de 64 apr. J.-C., Néron accusa les chrétiens, et la tradition ancienne veut que Pierre et Paul aient été mis à mort à Rome sous son règne. Dix ans après l’arrivée de Paul, en 70 apr. J.-C., une armée venue de Rome détruisit Jérusalem et son Temple."
  pl:
    - "Rzym leży około 2305 km na północny zachód od Jerozolimy w linii prostej i około 2235 km od Cezarei, portu, z którego wypłynął Paweł. Rzeczywistą trasą Pawła z mapy, z Cezarei przez Sydon, Mirę i Kretę do rozbicia na Malcie (Melita) i dalej przez Sycylię do Puteoli i Drogą Appijską, podróż mierzy około 2995 km od przystanku do przystanku; zaczęła się jesienią 59 n.e. i, po trzech miesiącach zimowania na wyspie, zakończyła się wiosną 60 według zwykłej chronologii."
    - "Paweł od dawna pragnął zobaczyć Rzym: „żem często zamyślał pójść do was”, pisał do Rzymian, mając nadzieję przejść przez niego w drodze do Hiszpanii. W Jerozolimie Pan powiedział mu: „jakoś o mnie świadczył w Jeruzalemie, tak musisz świadczyć i w Rzymie”. Przybył jako więzień. W Puteoli, porcie w Zatoce Neapolitańskiej, „znalazłszy braci, uproszeniśmy byli od nich, żebyśmy zamieszkali u nich przez siedm dni; a takieśmy szli do Rzymu”; wierzący wyszli mu naprzeciw „aż do rynku Appijuszowego i do Trzech Karczem”, a w Rzymie „Pawłowi dopuszczono, mieszkać osobno z żołnierzem, który go strzegł”. Ostatni odcinek, z Puteoli do Rzymu Drogą Appijską, ma na mapie około 205 km."
    - "Rzym leży nad Tybrem, około 25 km od morza. Jego gmina żydowska wyrosła głównie z jeńców, których Pompejusz sprowadził do Italii po zdobyciu Jerozolimy w 63 p.n.e.; około 49 n.e. Klaudiusz wypędził Żydów z miasta, dlatego Akwila i Pryscylla trafili do Koryntu. Paweł mieszkał dwa pełne lata we własnym wynajętym domu, nauczając; po pożarze w 64 n.e. Neron obwinił chrześcijan, a wczesna tradycja głosi, że za jego rządów Piotr i Paweł ponieśli w Rzymie śmierć. Dziesięć lat po przybyciu Pawła, w 70 n.e., armia z Rzymu zniszczyła Jerozolimę i jej Świątynię."
  it:
    - "Roma si trova a circa 2.305 km a nord-ovest di Gerusalemme in linea retta e a circa 2.235 km da Cesarea, il porto da cui salpò Paolo. Lungo il suo percorso effettivo sulla mappa, da Cesarea per Sidone, Mira e Creta fino al naufragio a Malta (Melita) e poi per la Sicilia fino a Pozzuoli e alla Via Appia, il viaggio misura circa 2.995 km di tappa in tappa; cominciò nell’autunno del 59 d.C. e, dopo tre mesi di svernamento sull’isola, finì nella primavera del 60 secondo la cronologia abituale."
    - "Paolo desiderava da tempo vedere Roma: «molte volte mi sono proposto di recarmi da voi», scrisse ai Romani, sperando di passare da loro nel viaggio verso la Spagna. A Gerusalemme il Signore gli disse: «come hai reso testimonianza di me a Gerusalemme, così bisogna che tu la renda anche a Roma». Vi giunse come prigioniero. A Pozzuoli, il porto nel golfo di Napoli, «avendo quivi trovato de’ fratelli, fummo pregati di rimanere presso di loro sette giorni. E così venimmo a Roma»; i credenti gli vennero incontro «sino al Foro Appio e alle Tre Taverne», e a Roma «a Paolo fu concesso d’abitar da sé col soldato che lo custodiva». L’ultima tappa, da Pozzuoli a Roma lungo la Via Appia, è di circa 205 km sulla mappa."
    - "Roma sorge sul Tevere a circa 25 km dal mare. La sua comunità ebraica crebbe in gran parte dai prigionieri che Pompeo portò in Italia dopo la presa di Gerusalemme nel 63 a.C.; verso il 49 d.C. Claudio espulse gli Ebrei dalla città, ed è così che Aquila e Priscilla giunsero a Corinto. Paolo visse due anni interi in una casa presa a pigione, predicando; dopo l’incendio del 64 d.C. Nerone incolpò i cristiani, e la prima tradizione ritiene che Pietro e Paolo siano stati messi a morte a Roma sotto di lui. Dieci anni dopo l’arrivo di Paolo, nel 70 d.C., un esercito partito da Roma distrusse Gerusalemme e il suo Tempio."
  nl:
    - "Rome ligt hemelsbreed ongeveer 2.305 km ten noordwesten van Jeruzalem, en ongeveer 2.235 km van Caesarea, de haven waaruit Paulus vertrok. Langs zijn werkelijke route op de kaart, van Caesarea via Sidon, Myra en Kreta naar de schipbreuk op Malta (Melite) en verder via Sicilië naar Puteoli en de Via Appia, meet de reis ongeveer 2.995 km van halte tot halte; zij begon in het najaar van 59 n.Chr. en eindigde, na drie maanden overwintering op het eiland, in het voorjaar van 60 volgens de gebruikelijke chronologie."
    - "Paulus wilde Rome al lang zien: “ik menigmaal voorgenomen heb tot u te komen”, schreef hij aan de Romeinen, in de hoop op doorreis naar Spanje. In Jeruzalem zei de Heer tot hem: “gelijk gij te Jeruzalem van Mij betuigd hebt alzo moet gij ook te Rome getuigen.” Hij kwam aan als gevangene. In Puteoli, de haven aan de Golf van Napels, “wij broeders vonden, en werden gebeden, zeven dagen bij hen te blijven; en alzo gingen wij naar Rome”; gelovigen kwamen hem tegemoet “tot Appiusmarkt, en de drie tabernen”, en van zijn verblijf in Rome staat: “aan Paulus werd toegelaten op zichzelven te wonen met den krijgsknecht, die hem bewaarde”. Het laatste traject, van Puteoli naar Rome over de Via Appia, is op de kaart ongeveer 205 km."
    - "Rome ligt aan de Tiber, ongeveer 25 km van de zee. De Joodse gemeenschap groeide grotendeels uit gevangenen die Pompeius naar Italië bracht na de inname van Jeruzalem in 63 v.Chr.; omstreeks 49 n.Chr. verdreef Claudius de Joden uit de stad, waardoor Aquila en Priscilla in Korinthe terechtkwamen. Paulus woonde twee volle jaren in zijn eigen gehuurde woning en predikte; na de brand van 64 n.Chr. wees Nero de christenen aan als schuldigen, en volgens de vroege overlevering werden Petrus en Paulus onder hem in Rome gedood. Tien jaar na de aankomst van Paulus, in 70 n.Chr., verwoestte een leger uit Rome Jeruzalem en zijn tempel."
  cs:
    - "Řím leží asi 2 305 km severozápadně od Jeruzaléma vzdušnou čarou a asi 2 235 km od Cesareje, přístavu, z něhož se Pavel plavil. Po jeho skutečné trase na mapě, z Cesareje přes Sidón, Myru a Krétu k ztroskotání na Maltě (Melitě) a dál přes Sicílii do Puteol a po Appiově cestě, měří cesta od zastávky k zastávce asi 2 995 km; začala na podzim roku 59 n. l. a po tříměsíčním přezimování na ostrově skončila podle obvyklé chronologie na jaře roku 60."
    - "Pavel toužil Řím dávno spatřit: psal Římanům, že „mnohokrát již uložil přijíti k vám“, a doufal, že jím projde na cestě do Španělska. V Jeruzalémě mu Pán řekl: „jakož jsi svědčil o mně v Jeruzalémě, tak musíš svědčiti i v Římě.“ Přišel jako vězeň. V Puteolech, přístavu v Neapolském zálivu, „nalezli jsme bratří, kteříž nás prosili, abychom pobyli u nich za sedm dní. A tak jsme šli k Římu“; věřící mu vyšli naproti „až na rynk Appiův a ke Třem krčmám“ a v Římě „Pavlovi dopuštěno, aby sám bydlil s žoldnéřem, kterýž ho ostříhal“. Poslední úsek, z Puteol do Říma po Appiově cestě, měří na mapě asi 205 km."
    - "Řím leží na Tibeře asi 25 km od moře. Jeho židovská obec vyrostla velkou měrou ze zajatců, které Pompeius přivedl do Itálie po dobytí Jeruzaléma roku 63 př. n. l.; asi roku 49 n. l. Klaudius vyhnal Židy z města, a tak se Akvila a Priscilla dostali do Korintu. Pavel žil dva celé roky ve vlastním najatém domě a kázal; po požáru roku 64 n. l. svalil Nero vinu na křesťany a raná tradice praví, že Petr a Pavel byli za něho v Římě popraveni. Deset let po Pavlově příchodu, roku 70 n. l., vojsko z Říma zničilo Jeruzalém i jeho chrám."
  sv:
    - "Rom ligger omkring 2 305 km nordväst om Jerusalem fågelvägen, och omkring 2 235 km från Caesarea, hamnen varifrån Paulus seglade. Längs hans faktiska rutt på kartan, från Caesarea via Sidon, Myra och Kreta till skeppsbrottet vid Malta (Melite) och vidare via Sicilien till Puteoli och Via Appia, mäter resan omkring 2 995 km från stopp till stopp; den började hösten 59 e.Kr. och slutade, efter tre månaders övervintring på ön, våren 60 enligt den vanliga kronologin."
    - "Paulus hade länge velat se Rom: han hade, skrev han till romarna, ”ofta haft i sinnet att komma till eder”, i hopp om att få passera på väg till Spanien. I Jerusalem sade Herren till honom: ”såsom du har vittnat om mig i Jerusalem, så måste du ock vittna i Rom”. Han kom som fånge. I Puteoli, hamnen i Neapelbukten, ”träffade vi på bröder, och hos dem stannade vi, på deras inbjudning, i sju dagar. På detta sätt kommo vi till Rom”; de troende gick honom till mötes ”ända till Forum Appii och Tres Taberne”, och i Rom ”tillstaddes det Paulus att bo för sig själv, med den krigsman som skulle bevaka honom”. Sista etappen, från Puteoli till Rom längs Via Appia, är omkring 205 km på kartan."
    - "Rom ligger vid Tibern omkring 25 km från havet. Dess judiska samfund växte till stor del av fångar som Pompejus förde till Italien efter intagandet av Jerusalem 63 f.Kr.; omkring 49 e.Kr. utvisade Claudius judarna från staden, och så kom Aquila och Priscilla till Korinth. Paulus bodde två hela år i sitt eget hyrda hus och predikade; efter branden år 64 e.Kr. skyllde Nero på de kristna, och den tidiga traditionen håller före att Petrus och Paulus avrättades i Rom under honom. Tio år efter Paulus ankomst, år 70 e.Kr., förstörde en armé från Rom Jerusalem och dess tempel."
  nb:
    - "Roma ligger omtrent 2 305 km nordvest for Jerusalem i luftlinje, og omtrent 2 235 km fra Cæsarea, havnen Paulus seilte fra. Etter hans faktiske rute på kartet, fra Cæsarea via Sidon, Myra og Kreta til skipbruddet på Malta (Melita) og videre via Sicilia til Puteoli og Via Appia, måler reisen omtrent 2 995 km fra stopp til stopp; den begynte høsten 59 e.Kr. og endte, etter tre måneders overvintring på øya, våren 60 etter den vanlige kronologien."
    - "Paulus hadde lenge ønsket å se Roma; han skrev til romerne at han «ofte har satt mig fore å komme til eder», i håp om å reise gjennom på vei til Spania. I Jerusalem sa Herren til ham: «likesom du vidnet om mig i Jerusalem, således skal du også vidne i Rom.» Han kom som fange. I Puteoli, havnen ved Napolibukta, «fant vi brødre, og de bad oss bli syv dager hos dem; og så kom vi til Rom»; de troende gikk ham i møte «til Forum Appii og Tres Tabernæ», og i Roma fikk han «lov til å bo for sig selv sammen med den stridsmann som holdt vakt over ham». Den siste etappen, fra Puteoli til Roma langs Via Appia, er omtrent 205 km på kartet."
    - "Roma ligger ved Tiberen omtrent 25 km fra havet. Det jødiske samfunnet vokste i stor grad fram av fanger som Pompeius brakte til Italia etter å ha inntatt Jerusalem i 63 f.Kr.; omkring 49 e.Kr. utviste Klaudius jødene fra byen, og slik kom Akvilas og Priskilla til Korint. Paulus bodde to hele år i sitt eget leide hus og forkynte; etter brannen i 64 e.Kr. skyldte Nero på de kristne, og tidlig tradisjon holder at Peter og Paulus ble henrettet i Roma under ham. Ti år etter Paulus' ankomst, i 70 e.Kr., ødela en hær fra Roma Jerusalem og tempelet."
  tl:
    - "Ang Roma ay nasa mga 2,305 km sa hilagang-kanluran ng Jerusalem sa tuwid na guhit, at mga 2,235 km mula sa Cesarea, ang daungang pinaglayagan ni Pablo. Sa aktuwal niyang ruta sa mapa, mula sa Cesarea sa pamamagitan ng Sidon, Mira at Creta hanggang sa pagkawasak ng barko sa Malta (Melita) at pagkatapos ay sa Sicilia hanggang sa Puteoli at sa Daang Appia, sumusukat ang paglalakbay ng mga 2,995 km mula hintuan hanggang hintuan; nagsimula ito sa taglagas ng 59 AD at, pagkatapos ng tatlong buwang pananatili sa isla sa taglamig, nagwakas sa tagsibol ng 60 ayon sa karaniwang kronolohiya."
    - "Matagal nang nais ni Pablo na makita ang Roma: “madalas kong inaakalang makarating sa inyo”, isinulat niya sa mga taga-Roma, na umaasang dumaan doon patungong Espana. Sa Jerusalem ay sinabi sa kaniya ng Panginoon, “kung paano ang pagkapatotoo mo tungkol sa akin sa Jerusalem, ay kailangang patotohanan mo rin gayon sa Roma.” Dumating siyang bilanggo. Sa Puteoli, ang daungan sa Look ng Napoles, “nakasumpong kami ng mga kapatid, at kami'y pinakiusapang matira sa kanilang pitong araw: at sa gayo'y nagsirating kami sa Roma”; sinalubong siya ng mga mananampalataya “sa Pamilihan ng Appio at sa Tatlong Bahay-Tuluyan”, at sa Roma siya'y “pinahintulutang mamahay na magisa na kasama ng kawal na sa kaniya'y nagbabantay”. Ang huling yugto, mula Puteoli hanggang Roma sa Daang Appia, ay mga 205 km sa mapa."
    - "Ang Roma ay nasa Tiber mga 25 km mula sa dagat. Ang pamayanang Judio nito ay lumaki higit sa lahat mula sa mga bihag na dinala ni Pompeyo sa Italia pagkatapos kunin ang Jerusalem noong 63 BK; noong mga 49 AD ay pinatalsik ni Claudio ang mga Judio sa lungsod, kaya sina Aquila at Priscila ay napunta sa Corinto. Dalawang buong taong tumira si Pablo sa sarili niyang inupahang bahay, na nangangaral; pagkatapos ng sunog noong 64 AD, sinisi ni Nero ang mga Kristiyano, at ayon sa sinaunang tradisyon, pinatay sina Pedro at Pablo sa Roma sa ilalim niya. Sampung taon pagkaraang dumating si Pablo, noong 70 AD, winasak ng isang hukbo mula sa Roma ang Jerusalem at ang Templo nito."
