id: where-was-assyria
question:
  en: "Where was Assyria?"
  ru: "Где находилась Ассирия?"
  uk: "Де була Ассирія?"
  es: "¿Dónde estaba Asiria?"
  pt: "Onde ficava a Assíria?"
  de: "Wo lag Assyrien?"
  fr: "Où se trouvait l’Assyrie ?"
  pl: "Gdzie leżała Asyria?"
  it: "Dov’era l’Assiria?"
  nl: "Waar lag Assyrië?"
  cs: "Kde byla Asýrie?"
  sv: "Var låg Assyrien?"
  nb: "Hvor lå Assyria?"
  tl: "Saan ang Asiria?"
  da: "Hvor lå Assyrien?"
  sr: "Где је била Асирија?"
answer:
  en:
    - "Assyria was the land on the upper Tigris in what is now northern Iraq, around Mosul and Erbil; the map point stands on Nineveh, opposite Mosul, about 890 km north-east of Jerusalem in a straight line. Its heartland was small: Ashur, the old capital and the city of its god, lies about 100 km south of Nineveh on the same river, and Calah, today's Nimrud, about 33 km to the south. Genesis places it by the Tigris, the Hiddekel, “which goeth toward the east of Assyria”, and says that Asshur “builded Nineveh, and the city Rehoboth, and Calah”."
    - "From the ninth to the seventh century BC the Assyrian empire reached far beyond this heartland, from western Iran to Egypt, and the Bible meets it in the west. Tiglath-pileser III took “Gilead, and Galilee, all the land of Naphtali, and carried them captive to Assyria” in 733–732 BC; in 722 BC the king of Assyria “took Samaria, and carried Israel away into Assyria, and placed them in Halah and in Habor by the river of Gozan, and in the cities of the Medes”. Halah lay close to Nineveh, the Habor is the Khabur in north-eastern Syria, about 280 km west of the map point, and the cities of the Medes were in the Zagros of western Iran."
    - "For the prophets Assyria was “the rod of mine anger”, and Jonah was sent to Nineveh, “that great city”. The empire fell to the Medes and the Babylonians, who took Ashur in 614 BC and Nineveh in 612; its last king lost Harran in 610 and failed to retake it in 609. The ruins of Nineveh, Nimrud and Khorsabad were dug from the 1840s, and the name lives on among the Assyrian Christians of Iraq, Syria and the diaspora."
  ru:
    - "Ассирия — страна на верхнем Тигре, на севере нынешнего Ирака, вокруг Мосула и Эрбиля; точка карты стоит на Ниневии напротив Мосула, примерно в 890 км к северо-востоку от Иерусалима по прямой. Сердцевина её была невелика: Ассур, древняя столица и город её бога, лежит примерно в 100 км к югу от Ниневии на той же реке, а Калах, нынешний Нимруд, — примерно в 33 км к югу. Книга Бытия помещает её у Тигра, Хиддекеля, который «протекает пред Ассириею», и говорит, что Ассур «построил Ниневию, Реховоф-ир, Калах»."
    - "С IX по VII век до н. э. Ассирийская держава простиралась далеко за пределы этой сердцевины, от западного Ирана до Египта, и Библия встречает её на западе. Феглаффелласар III в 733–732 гг. до н. э. взял «Галаад, и Галилею, всю землю Неффалимову, и переселил их в Ассирию»; в 722 г. до н. э. «взял царь Ассирийский Самарию, и переселил Израильтян в Ассирию, и поселил их в Халахе и в Хаворе, при реке Гозан, и в городах Мидийских». Халах лежал близ Ниневии, Хавор — это Хабур на северо-востоке Сирии, примерно в 280 км к западу от точки карты, а города Мидийские — в горах Загроса на западе Ирана."
    - "Для пророков Ассирия — «жезл гнева Моего», и Иону послали в Ниневию, «город великий». Державу сокрушили Мидяне и Вавилоняне: они взяли Ассур в 614 г. до н. э. и Ниневию в 612 г.; последний её царь потерял Харран в 610 г. и не смог отбить его в 609 г. Развалины Ниневии, Нимруда и Хорсабада раскапывают с 1840-х годов, а имя живёт у ассирийцев-христиан Ирака, Сирии и рассеяния."
  uk:
    - "Ассирія була землею на верхньому Тигрі в нинішньому північному Іраку, довкола Мосула й Ербіля; точка мапи стоїть на Ніневії, навпроти Мосула, приблизно за 890 км на північний схід від Єрусалиму по прямій. Її серцевина була невеликою: Ашшур, давня столиця й місто її бога, лежить приблизно за 100 км на південь від Ніневії на тій самій річці, а Калах, нинішній Німруд, — приблизно за 33 км на південь. Книга Буття розміщує її біля Тигру, Гіддекелю, «що йде на схід соньця від Ассура», і каже, що Ассур «збудовав Ниневу і Регобод-Ір, і Калаг»."
    - "З IX по VII ст. до н. е. ассирійська імперія сягала далеко за межі цієї серцевини, від західного Ірану до Єгипту, і Біблія зустрічає її на заході. Тіглатпаласар III узяв «Галаад і Галилею, усю землю Нефталїєву, та й одвів їх в Ассирию» 733–732 рр. до н. е.; 722 р. до н. е. цар Ассирії «здобув … Самарию та й одвів Ізрайлитян полонянами в Ассирию й поселив їх в Халасї й в Хаборі, при ріцї Гозан, та по Мидийських городах». Халах лежав поблизу Ніневії, Хавор — це Хабур у північно-східній Сирії, приблизно за 280 км на захід від точки мапи, а мідійські міста були в Загросі західного Ірану."
    - "Для пророків Ассирія була «палицею мого гнїву», а Йону було послано до Ніневії, «города великого». Імперія впала перед мідійцями й вавилонянами, які взяли Ашшур 614 р. до н. е. і Ніневію 612 р.; її останній цар утратив Харан 610 р. і не зумів повернути його 609 р. Руїни Ніневії, Німруда та Хорсабада розкопували з 1840-х рр., і назва живе серед ассирійських християн Іраку, Сирії та діаспори."
  es:
    - "Asiria era la tierra del alto Tigris, en lo que hoy es el norte de Irak, en torno a Mosul y Erbil; el punto del mapa está sobre Nínive, frente a Mosul, a unos 890 km al noreste de Jerusalén en línea recta. Su núcleo era pequeño: Asur, la antigua capital y ciudad de su dios, queda a unos 100 km al sur de Nínive, sobre el mismo río, y Cala, la actual Nimrud, a unos 33 km al sur. Génesis la sitúa junto al Tigris, el Hiddekel, «el que va delante de Asiria», y dice que Asur «edificó á Nínive, y á Rehoboth, y á Calah»."
    - "Del siglo IX al VII a. C. el imperio asirio llegó mucho más allá de este núcleo, del oeste de Irán a Egipto, y la Biblia lo encuentra en el oeste. Tiglat-pileser III tomó «Galaad, y Galilea, y toda la tierra de Nephtalí; y trasportólos á Asiria» en 733–732 a. C.; en el 722 a. C. «tomó el rey de Asiria á Samaria, y trasportó á Israel á Asiria, y púsolos en Hala, y en Habor, junto al río de Gozán, y en las ciudades de los Medos». Halah quedaba cerca de Nínive, el Habor es el Jabur, en el noreste de Siria, a unos 280 km al oeste del punto del mapa, y las ciudades de los medos estaban en los Zagros, en el oeste de Irán."
    - "Para los profetas, Asiria era «vara y bastón de mi furor», y Jonás fue enviado a Nínive, «ciudad grande». El imperio cayó ante los medos y los babilonios, que tomaron Asur en el 614 a. C. y Nínive en el 612; su último rey perdió Harán en el 610 y no logró recuperarla en el 609. Las ruinas de Nínive, Nimrud y Jorsabad fueron excavadas desde los años 1840, y el nombre pervive entre los cristianos asirios de Irak, Siria y la diáspora."
  pt:
    - "A Assíria era a terra do alto Tigre, no que é hoje o norte do Iraque, em torno de Mossul e Erbil; o ponto do mapa está em Nínive, defronte de Mossul, a cerca de 890 km a nordeste de Jerusalém em linha reta. Seu coração era pequeno: Assur, a antiga capital e cidade de seu deus, fica a cerca de 100 km ao sul de Nínive, no mesmo rio, e Calá, a Nimrud de hoje, a cerca de 33 km ao sul. Gênesis a situa junto ao Tigre, o Hídequel, “o que flui em frente à Assíria”, e diz que Assur “edificou Nínive, Reobote-Ir, Calá”."
    - "Do século IX ao VII a.C. o império assírio foi muito além desse coração, do oeste do Irã ao Egito, e a Bíblia o encontra no oeste. Tiglate-Pileser III tomou “Gileade e a Galileia, toda a terra de Naftali; e os levou cativos para a Assíria” em 733–732 a.C.; em 722 a.C. o rei da Assíria “tomou Samaria e levou Israel cativo para a Assíria, e os colocou em Hala, e junto a Habor, o rio de Gozã, e nas cidades dos medos”. Halá ficava perto de Nínive, o Habor é o Khabur, no nordeste da Síria, a cerca de 280 km a oeste do ponto do mapa, e as cidades dos medos ficavam nos Zagros, no oeste do Irã."
    - "Para os profetas a Assíria era “a vara da minha ira”, e Jonas foi enviado a Nínive, “a grande cidade”. O império caiu diante dos medos e dos babilônios, que tomaram Assur em 614 a.C. e Nínive em 612; seu último rei perdeu Harã em 610 e não conseguiu retomá-la em 609. As ruínas de Nínive, Nimrud e Khorsabad foram escavadas a partir da década de 1840, e o nome vive entre os cristãos assírios do Iraque, da Síria e da diáspora."
  de:
    - "Assyrien war das Land am oberen Tigris im heutigen Nordirak, um Mossul und Erbil; der Kartenpunkt liegt auf Ninive, gegenüber von Mossul, in der Luftlinie etwa 890 km nordöstlich von Jerusalem. Sein Kernland war klein: Assur, die alte Hauptstadt und Stadt seines Gottes, liegt etwa 100 km südlich von Ninive am selben Fluss und Kalach, das heutige Nimrud, etwa 33 km im Süden. Die Genesis legt es an den Tigris, den Hiddekel, „das fließt vor Assyrien“, und sagt: „Von dem Land ist er gekommen nach Assur und baute Ninive und Rehoboth-Ir und Kalah“."
    - "Vom 9. bis zum 7. Jahrhundert v. Chr. reichte das assyrische Reich weit über dieses Kernland hinaus, vom westlichen Iran bis nach Ägypten, und die Bibel begegnet ihm im Westen. Tiglat-Pileser III. nahm 733–732 v. Chr. „Gilead und Galiläa, das ganze Land Naphthali, und führte sie weg nach Assyrien“; 722 v. Chr. „gewann der König von Assyrien Samaria und führte Israel weg nach Assyrien und setzte sie nach Halah und an den Habor, an das Wasser Gosan und in die Städte der Meder“. Halach lag nahe bei Ninive, der Habor ist der Chabur im Nordosten Syriens, etwa 280 km westlich des Kartenpunkts, und die Städte der Meder lagen im Zagros des westlichen Iran."
    - "Den Propheten war Assyrien „meines Zornes Rute“, und Jona wurde nach Ninive gesandt, der „großen Stadt“. Das Reich fiel an die Meder und die Babylonier, die 614 v. Chr. Assur und 612 Ninive nahmen; sein letzter König verlor Haran 610 und scheiterte 609 bei dem Versuch, es zurückzuerobern. Die Ruinen von Ninive, Nimrud und Chorsabad wurden ab den 1840er Jahren ausgegraben, und der Name lebt unter den assyrischen Christen im Irak, in Syrien und in der Diaspora fort."
  fr:
    - "L’Assyrie était le pays du haut Tigre, dans ce qui est aujourd’hui le nord de l’Irak, autour de Mossoul et d’Erbil ; le point de la carte est sur Ninive, en face de Mossoul, à environ 890 km au nord-est de Jérusalem en ligne droite. Son cœur était petit : Assour, l’ancienne capitale et la ville de son dieu, se trouve à environ 100 km au sud de Ninive sur le même fleuve, et Calach, l’actuelle Nimroud, à environ 33 km au sud. La Genèse la place près du Tigre, le Hiddékel, « qui coule à l’orient de l’Assyrie », et dit qu’Assur « bâtit Ninive, Rehoboth Hir, Calach »."
    - "Du IXe au VIIe siècle av. J.-C., l’empire assyrien s’étendit bien au-delà de ce cœur, de l’ouest de l’Iran à l’Égypte, et la Bible le rencontre à l’ouest. Tiglath-Piléser III prit « Galaad et la Galilée, tout le pays de Nephthali, et il emmena captifs les habitants en Assyrie » en 733–732 av. J.-C. ; en 722 av. J.-C., le roi d’Assyrie « prit Samarie, et emmena Israël captif en Assyrie. Il les fit habiter à Chalach, et sur le Chabor, fleuve de Gozan, et dans les villes des Mèdes ». Chalach était tout près de Ninive, le Chabor est le Khabur du nord-est de la Syrie, à environ 280 km à l’ouest du point de la carte, et les villes des Mèdes se trouvaient dans le Zagros, dans l’ouest de l’Iran."
    - "Pour les prophètes, l’Assyrie était la « verge de ma colère », et Jonas fut envoyé à Ninive, « la grande ville ». L’empire tomba devant les Mèdes et les Babyloniens, qui prirent Assour en 614 av. J.-C. et Ninive en 612 ; son dernier roi perdit Haran en 610 et ne parvint pas à la reprendre en 609. Les ruines de Ninive, de Nimroud et de Khorsabad furent fouillées à partir des années 1840, et le nom survit chez les chrétiens assyriens d’Irak, de Syrie et de la diaspora."
  pl:
    - "Asyria była krainą nad górnym Tygrysem w dzisiejszym północnym Iraku, wokół Mosulu i Irbilu; punkt na mapie stoi na Niniwie, naprzeciw Mosulu, około 890 km na północny wschód od Jerozolimy w linii prostej. Jej rdzeń był niewielki: Aszur, dawna stolica i miasto jej boga, leży około 100 km na południe od Niniwy nad tą samą rzeką, a Kalach, dzisiejszy Nimrud, około 33 km na południe. Księga Rodzaju umieszcza ją nad Tygrysem, tam zwanym Chydekel, który „płynie na wschód słońca ku Asyryi”, i mówi, że Assur „zbudował Niniwe, i Rechobot miasto, i Chale”."
    - "Od IX do VII wieku p.n.e. imperium asyryjskie sięgało daleko poza ten rdzeń, od zachodniego Iranu po Egipt, i Biblia spotyka je na zachodzie. Tiglat-Pileser III wziął „Galaad, i Galileę, wszystkę ziemię Neftali, a przeniósł obywatele jej do Assyryi” w 733–732 p.n.e.; w 722 p.n.e. „wziął król Assyryjski Samaryję, i przeniósł Izraela do Assyryi, a osadził je w Hala i w Habor nad rzeką Gozan i w miastach Medskich”. Chalach leżało blisko Niniwy, Chabur to rzeka Chabur w północno-wschodniej Syrii, około 280 km na zachód od punktu na mapie, a miasta Medów były w Zagrosie w zachodnim Iranie."
    - "Dla proroków Asyria była „rózdze gniewu mego”, a Jonasz został posłany do „Niniwy miasta tego wielkiego”. Imperium padło przed Medami i Babilończykami, którzy zdobyli Aszur w 614 p.n.e. i Niniwę w 612; jego ostatni król stracił Charan w 610 i nie zdołał go odzyskać w 609. Ruiny Niniwy, Nimrudu i Chorsabadu wykopywano od lat 40. XIX wieku, a nazwa żyje wśród chrześcijan asyryjskich Iraku, Syrii i diaspory."
  it:
    - "L’Assiria era la terra sull’alto Tigri nell’attuale Iraq settentrionale, attorno a Mosul ed Erbil; il punto della mappa sta su Ninive, di fronte a Mosul, a circa 890 km a nord-est di Gerusalemme in linea retta. Il suo cuore era piccolo: Assur, l’antica capitale e città del suo dio, si trova a circa 100 km a sud di Ninive sullo stesso fiume, e Calach, l’odierna Nimrud, a circa 33 km a sud. La Genesi la colloca presso il Tigri, lo Hiddekel, che «scorre a oriente dell’Assiria», e dice che Assur edificò Ninive, la città di Recobot e Calach."
    - "Dal IX al VII secolo a.C. l’impero assiro si estese ben oltre questo cuore, dall’Iran occidentale all’Egitto, e la Bibbia lo incontra a ovest. Tiglat-Pilèser III prese «Galaad, la Galilea, tutto il paese di Neftali, e ne menò gli abitanti in cattività in Assiria» nel 733–732 a.C.; nel 722 a.C. il re d’Assiria «prese Samaria, e trasportò gl’Israeliti in Assiria e li collocò in Halah, e sullo Habor, fiume di Gozan, e nelle città dei Medi». Chelach era vicina a Ninive, il Cabor è il Khabur nella Siria nord-orientale, a circa 280 km a ovest del punto della mappa, e le città dei Medi erano nello Zagros dell’Iran occidentale."
    - "Per i profeti l’Assiria era «verga della mia ira», e Giona fu mandato a Ninive, «la gran città». L’impero cadde davanti ai Medi e ai Babilonesi, che presero Assur nel 614 a.C. e Ninive nel 612; il suo ultimo re perse Carran nel 610 e non riuscì a riprenderla nel 609. Le rovine di Ninive, Nimrud e Khorsabad furono scavate dagli anni 1840, e il nome sopravvive tra i cristiani assiri dell’Iraq, della Siria e della diaspora."
  nl:
    - "Assyrië was het land aan de bovenloop van de Tigris in het huidige Noord-Irak, rond Mosul en Erbil; het punt op de kaart staat op Nineve, tegenover Mosul, hemelsbreed ongeveer 890 km ten noordoosten van Jeruzalem. Het kerngebied was klein: Assur, de oude hoofdstad en de stad van zijn god, ligt ongeveer 100 km ten zuiden van Nineve aan dezelfde rivier, en Kalach, het huidige Nimroed, ongeveer 33 km naar het zuiden. Genesis plaatst het aan de Tigris, de Hiddekel, “deze is gaande naar het oosten van Assur”, en zegt dat Assur “heeft gebouwd Nineve, en Rehoboth, Ir, en Kalach”."
    - "Van de 9e tot de 7e eeuw v.Chr. reikte het Assyrische rijk ver voorbij dit kerngebied, van West-Iran tot Egypte, en de Bijbel ontmoet het in het westen. Tiglat-Pileser III nam in 733–732 v.Chr. “Gilead, en Galilea, het ganse land van Nafthali; en hij voerde hen weg naar Assyrie”; in 722 v.Chr. “nam de koning van Assyrie Samaria in, en voerde Israel weg in Assyrie, en deed ze wonen in Halah, en in Habor, aan de rivier Gozan, en in de steden der Meden”. Chalach lag dicht bij Nineve, de Chabor is de Khabur in Noordoost-Syrië, ongeveer 280 km ten westen van het punt op de kaart, en de steden van de Meden lagen in de Zagros van West-Iran."
    - "Voor de profeten was Assyrië “de roede Mijns toorns”, en Jona werd naar Nineve gezonden, “de grote stad”. Het rijk viel aan de Meden en de Babyloniërs, die Assur in 614 v.Chr. innamen en Nineve in 612; zijn laatste koning verloor Haran in 610 en slaagde er in 609 niet in het te heroveren. De ruïnes van Nineve, Nimroed en Khorsabad werden vanaf de jaren 1840 opgegraven, en de naam leeft voort onder de Assyrische christenen van Irak, Syrië en de diaspora."
  cs:
    - "Asýrie byla země na horním Tigridu v dnešním severním Iráku, kolem Mosulu a Arbílu; bod na mapě stojí na Ninive, naproti Mosulu, asi 890 km severovýchodně od Jeruzaléma vzdušnou čarou. Její jádro bylo malé: Aššúr, staré hlavní město a město jejího boha, leží asi 100 km jižně od Ninive na téže řece a Kalach, dnešní Nimrúd, asi 33 km na jih. Genesis ji klade k Tigridu, Hidekel, „kteráž teče k východní straně Assyrské země“, a praví, že Aššúr „vystavěl Ninive, a Rohobot město, a Chále“."
    - "Od 9. do 7. století př. n. l. sahala asyrská říše daleko za toto jádro, od západního Íránu po Egypt, a Bible se s ní setkává na západě. Tiglatpilesar III. vzal „Galád a Galilei, i všecku zemi Neftalím, a přenesl obyvatele jejich do Assyrie“ v letech 733–732 př. n. l.; roku 722 př. n. l. „vzal král Assyrský Samaří, a přenesl Izraele do Assyrie, a osadil je v Chelach a v Chabor při řece Gozan, a v městech Médských“. Chalach ležel blízko Ninive, Chabór je Chábúr v severovýchodní Sýrii, asi 280 km západně od bodu na mapě, a města Médů byla v Zagrosu západního Íránu."
    - "Prorokům byla Asýrie, podle Izajáše, „metle hněvu mého“, a Jonáš byl poslán do „Ninive města toho velikého“. Říše padla Médům a Babyloňanům, kteří dobyli Aššúr roku 614 př. n. l. a Ninive roku 612; její poslední král ztratil Cháran roku 610 a roku 609 se jej nepodařilo znovu získat. Zříceniny Ninive, Nimrúdu a Chorsábádu byly odkrývány od 40. let 19. století a jméno žije mezi asyrskými křesťany Iráku, Sýrie a diaspory."
  sv:
    - "Assyrien var landet vid övre Tigris i det som nu är norra Irak, kring Mosul och Erbil; kartpunkten står på Nineve, mitt emot Mosul, omkring 890 km nordost om Jerusalem fågelvägen. Dess kärnland var litet: Assur, den gamla huvudstaden och stad för dess gud, ligger omkring 100 km söder om Nineve vid samma flod, och Kalach, dagens Nimrud, omkring 33 km åt söder. 1 Mosebok förlägger det vid Tigris, Hiddekel, som ”har sitt lopp öster om Assyrien”, och säger att Assur ”byggde Nineve, Rehobot-Ir och Kela”."
    - "Från 800-talet till 600-talet f.Kr. nådde det assyriska riket långt bortom detta kärnland, från västra Iran till Egypten, och Bibeln möter det i väster. Tiglat-Pileser III intog ”Gilead och Galileen, hela Naftali land, och förde folket bort till Assyrien” 733–732 f.Kr.; 722 f.Kr. ”intog konungen i Assyrien Samaria och förde Israel bort till Assyrien och lät dem bo i Hala och vid Habor – en ström i Gosan – och i Mediens städer”. Halach låg nära Nineve, Habor är Khabur i nordöstra Syrien, omkring 280 km väster om kartpunkten, och Mediens städer låg i Zagros i västra Iran."
    - "För profeterna var Assyrien ”min vredes ris”, och Jona sändes till ”Nineve, den stora staden”. Riket föll för mederna och babylonierna, som intog Assur 614 f.Kr. och Nineve 612; dess siste kung förlorade Harran 610 och misslyckades med att återta det 609. Ruinerna av Nineve, Nimrud och Khorsabad grävdes ut från 1840-talet, och namnet lever kvar bland de assyriska kristna i Irak, Syrien och diasporan."
  nb:
    - "Assyria var landet ved øvre Tigris i det som nå er Nord-Irak, rundt Mosul og Erbil; kartpunktet står på Ninive, rett overfor Mosul, omtrent 890 km nordøst for Jerusalem i luftlinje. Kjerneområdet var lite: Assur, den gamle hovedstaden og guden Assurs by, ligger omtrent 100 km sør for Ninive ved samme elv, og Kalah, dagens Nimrud, omtrent 33 km mot sør. 1 Mosebok plasserer det ved Tigris, Hiddekel, «det er den som går østenfor Assur», og sier om Nimrod: «Fra dette land drog han ut til Assur og bygget Ninive og Rehobot-Ir og Kalah»."
    - "Fra 800- til 600-tallet f.Kr. strakte det assyriske riket seg langt utover dette kjerneområdet, fra det vestlige Iran til Egypt, og Bibelen møter det i vest. Tiglat-Pileser III tok «Gilead og Galilea, hele Naftalis land; og han bortførte innbyggerne til Assyria» i 733–732 f.Kr.; i 722 f.Kr. «inntok den assyriske konge Samaria og bortførte Israel til Assyria; og han lot dem bo i Halah og ved Habor, en elv i Gosan, og i Medias byer». Halah lå nær Ninive, Habor er Khabur i Nordøst-Syria, omtrent 280 km vest for kartpunktet, og Medias byer lå i Zagros i det vestlige Iran."
    - "For profetene var Assyria «min vredes ris», og Jona ble sendt til Ninive, «den store stad». Riket falt for mederne og babylonerne, som tok Assur i 614 f.Kr. og Ninive i 612; dets siste konge mistet Harran i 610 og mislyktes i å ta det tilbake i 609. Ruinene av Ninive, Nimrud og Khorsabad ble gravd ut fra 1840-årene, og navnet lever videre blant de assyriske kristne i Irak, Syria og diasporaen."
  tl:
    - "Ang Asiria ay ang lupain sa itaas na Tigris sa ngayon ay hilagang Iraq, sa palibot ng Mosul at Erbil; ang tuldok sa mapa ay nasa Ninive, sa tapat ng Mosul, mga 890 km sa hilagang-silangan ng Jerusalem sa tuwid na guhit. Maliit ang sentro nito: ang Assur, ang lumang kabisera at lungsod ng diyos nito, ay mga 100 km sa timog ng Ninive sa parehong ilog, at ang Calah, ang Nimrud ngayon, mga 33 km sa timog. Inilalagay ito ng Genesis sa tabi ng Tigris, ang Hiddecel, “na siyang umaagos sa tapat ng Asiria”, at sinasabing itinayo ni Assur “ang Ninive, at ang Rehobotir, at ang Calah”."
    - "Mula ikasiyam hanggang ikapitong siglo BK, umabot ang imperyong Asirio nang malayo sa sentrong ito, mula kanlurang Iran hanggang Egipto, at nakatagpo ito ng Biblia sa kanluran. Kinuha ni Tiglath-pileser III “ang Galaad, at ang Galilea, ang buong lupain ng Nephtali; at kaniyang dinalang bihag sila sa Asiria” noong 733–732 BK; noong 722 BK, “sinakop ng hari sa Asiria ang Samaria, at dinala ang Israel sa Asiria, at inilagay sila sa Hala, at sa Habor, sa ilog ng Gozan, at sa mga bayan ng mga Medo”. Ang Hala ay malapit sa Ninive, ang Habor ay ang Khabur sa hilagang-silangang Siria, mga 280 km sa kanluran ng tuldok sa mapa, at ang mga bayan ng mga Medo ay nasa Zagros ng kanlurang Iran."
    - "Para sa mga propeta, ang Asiria ang “pamalo ng aking galit”, at isinugo si Jonas sa Ninive, “malaking bayang yaon”. Bumagsak ang imperyo sa mga Medo at mga Babilonio, na kumuha sa Assur noong 614 BK at Ninive noong 612; nawala ng huling hari nito ang Haran noong 610 at nabigong bawiin ito noong 609. Hinukay ang mga guho ng Ninive, Nimrud at Khorsabad mula dekada 1840, at nabubuhay ang pangalan sa mga Kristiyanong Asirio ng Iraq, Siria at diaspora."
  da:
    - "Assyrien var landet ved øvre Tigris i det nuværende nordlige Irak, omkring Mosul og Erbil; kortets punkt står på Nineve, over for Mosul, omkring 890 km nordøst for Jerusalem i luftlinje. Dets kerneland var lille: Assur, den gamle hovedstad og dens guds by, ligger omkring 100 km syd for Nineve ved samme flod, og Kala, nutidens Nimrud, omkring 33 km mod syd. Første Mosebog placerer det ved Tigris, Hiddekel, »hvilken gaar Østen for Assyrien«, og siger om Assur, at »han byggede Ninive og Rekoboth-Ir og Kala«."
    - "Fra 800- til 600-tallet f.Kr. nåede det assyriske imperium langt ud over dette kerneland, fra det vestlige Iran til Egypten, og Bibelen møder det i vest. Tiglat-Pileser III tog »Gilead og Galilæa, alt Nafthalis Land, og han bortførte dem til Assyrien« i 733–732 f.Kr.; i 722 f.Kr. »indtog Kongen af Assyrien Samaria og førte Israel bort til Assyrien; og han lod dem bo i Hala og i Habor ved Floden Gosan og i Medernes Stæder«. Halah lå tæt på Nineve, Habor er Khabur i det nordøstlige Syrien, omkring 280 km vest for kortets punkt, og Medernes byer lå i Zagros i det vestlige Iran."
    - "For profeterne var Assyrien »min Vredes Ris«, og Jonas blev sendt til Nineve, »den store Stad«. Imperiet faldt for mederne og babylonierne, som indtog Assur i 614 f.Kr. og Nineve i 612; dets sidste konge mistede Karan i 610 og undlod at generobre det i 609. Ruinerne af Nineve, Nimrud og Khorsabad blev gravet fra 1840'erne, og navnet lever videre blandt assyriske kristne i Irak, Syrien og diasporaen."
  sr:
    - "Асирија је била земља на горњем Тигру у данашњем северном Ираку, око Мосула и Ербила; тачка на карти стоји на Ниниви, преко пута Мосула, око 890 км североисточно од Јерусалима правом линијом. Њено језгро било је мало: Ашур, стара престоница и град њеног бога, лежи око 100 км јужно од Ниниве на истој реци, а Халах, данашњи Нимруд, око 33 км јужно. Постање је смешта поред Тигра, Хидекела: „она тече к асирској“, и каже: „Из те земље изађе Асур, и сазида Ниневију и Ровот град и Халах“."
    - "Од 9. до 7. века п. н. е. асирско царство досезало је далеко изван овог језгра, од западног Ирана до Египта, а Библија га среће на западу. Теглат-Феласар III је 733–732. п. н. е., како стоји, „узе … Галад и Галилеју, сву земљу Нефталимову, и пресели народ оданде у Асирију“; 722. п. н. е. „узе цар асирски Самарију и одведе Израиља у Асирију и насели у Алају и у Авору на води Гозану и у градовима мидским“. Хала је лежала близу Ниниве, Хавор је Хабур у североисточној Сирији, око 280 км западно од тачке на карти, а мидски градови били су у Загросу западног Ирана."
    - "Пророцима је Асирија била „шиби гнева мог“, а Јона је послан у Ниниву, „град велики“. Царство су срушили Мидијци и Вавилонци, који су заузели Ашур 614. п. н. е. и Ниниву 612; њен последњи краљ изгубио је Харан 610. и није успео да га поврати 609. Рушевине Ниниве, Нимруда и Хорсабада ископаване су од 1840-их, а име живи међу асирским хришћанима Ирака, Сирије и дијаспоре."
