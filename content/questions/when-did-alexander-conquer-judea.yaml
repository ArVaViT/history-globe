# Draft question. Alexander's visit to Jerusalem in Josephus is given as the legend most historians take it for.
id: when-did-alexander-conquer-judea
question:
  en: "When did Alexander the Great conquer Judea?"
  ru: "Когда Александр Македонский завоевал Иудею?"
  uk: "Коли Александр Великий завоював Юдею?"
  es: "¿Cuándo conquistó Alejandro Magno Judea?"
  pt: "Quando Alexandre, o Grande, conquistou a Judeia?"
  de: "Wann eroberte Alexander der Große Judäa?"
  fr: "Quand Alexandre le Grand a-t-il conquis la Judée ?"
  pl: "Kiedy Aleksander Wielki podbił Judeę?"
  it: "Quando Alessandro Magno conquistò la Giudea?"
  nl: "Wanneer veroverde Alexander de Grote Judea?"
  cs: "Kdy Alexandr Veliký dobyl Judsko?"
  sv: "När erövrade Alexander den store Judeen?"
  nb: "Når erobret Aleksander den store Judea?"
  tl: "Kailan sinakop ni Alejandro Magno ang Judea?"
  da: "Hvornår erobrede Alexander den Store Judæa?"
  sr: "Када је Александар Велики освојио Јудеју?"
  hu: "Mikor hódította meg Nagy Sándor Júdeát?"
  fi: "Milloin Aleksanteri Suuri valloitti Juudean?"
  vi: "A-léc-xan-đơ Đại đế chinh phục Giu-đê khi nào?"
  ro: "Când a cucerit Alexandru cel Mare Iudeea?"
  bg: "Кога Александър Велики е завладял Юдея?"
answer:
  en:
    - "In 332 BC. After defeating Darius III at Issus in November 333, Alexander marched down the coast of Syria and Phoenicia, took Tyre after a siege of seven months and Gaza after two more, and went on into Egypt; Judea, in the hills between the two, passed to him with the rest of the Persian province without any battle that the sources record. The map stands at Tyre in 332 BC. Tyre lies about 166 km north of Jerusalem in a straight line and Gaza about 79 km to the south-west."
    - "The Greek and Roman historians of Alexander, Arrian, Diodorus and Curtius, do not mention the Jews at all. Josephus tells that while Tyre was besieged Alexander demanded help from the high priest Jaddua, who refused for his oath to Darius, and that after Gaza the king came up to Jerusalem, where Jaddua met him in his vestments, Alexander bowed before the Name on the priest's mitre and was shown the book of Daniel foretelling that a Greek would destroy the Persian empire. Most historians take the story for a legend of a later age; what is secure is that Samaria revolted against Alexander's governor Andromachus in 331 and was punished, as Curtius records, and the papyri of fugitives found in a cave of Wadi ed-Daliyeh in 1962 fit that account, while Judea stayed quiet and kept its laws."
    - "Daniel's visions were read of these years: the he goat that “came from the west on the face of the whole earth, and touched not the ground” and broke the two horns of the ram, “the kings of Media and Persia”; the angel explains that “the rough goat is the king of Grecia: and the great horn that is between his eyes is the first king”, and that when the great horn is broken four rise in its place, as Alexander's empire was divided among his generals after his death at Babylon in 323 BC. Many commentators also read Zechariah's oracle against Tyre, of which he says, “he will smite her power in the sea”, and against Gaza, where “the king shall perish”, as a picture of the march of 332, though others date the chapter earlier. Judea then belonged to the Ptolemies of Egypt from 301 BC and passed to the Seleucids after the battle of Panium in 200 BC."
  ru:
    - "В 332 г. до н. э. Разбив Дария III при Иссе в ноябре 333 г., Александр прошёл вдоль берега Сирии и Финикии, взял Тир после семимесячной осады и Газу ещё через два месяца и двинулся в Египет; Иудея, в горах между ними, перешла к нему вместе с остальной персидской провинцией без какого-либо сражения, о котором сообщали бы источники. Карта стоит на Тире в 332 г. до н. э. Тир лежит примерно в 166 км к северу от Иерусалима по прямой, Газа — в 79 км к юго-западу."
    - "Греческие и римские историки Александра — Арриан, Диодор, Курций — об иудеях вовсе не упоминают. Иосиф Флавий рассказывает, что во время осады Тира Александр потребовал помощи у первосвященника Иаддуя, тот отказал ради присяги Дарию, а после Газы царь поднялся в Иерусалим, где Иаддуй встретил его в облачении; Александр поклонился Имени на кидаре первосвященника, и ему показали книгу Даниила, предрекшую, что грек сокрушит Персидскую державу. Большинство историков считают рассказ легендой более позднего времени; достоверно же то, что Самария в 331 г. восстала против наместника Александра Андромаха и была наказана, как сообщает Курций, и с этим согласуются папирусы беглецов, найденные в 1962 году в пещере Вади-эд-Далие, а Иудея осталась спокойной и сохранила свои законы."
    - "Видения Даниила читали об этих годах: козёл («с запада шел козел по лицу всей земли, не касаясь земли») сломил оба рога овна — «цари Мидийский и Персидский»; ангел объясняет, что «козел косматый — царь Греции, а большой рог, который между глазами его, это первый ее царь», и что, когда большой рог сломится, на его место выйдут четыре, — как держава Александра была поделена между его полководцами после его смерти в Вавилоне в 323 г. до н. э. Многие толкователи читают и пророчество Захарии о Тире, чью силу Господь «поразит… в море», и о Газе, где «не станет царя», как картину похода 332 года, хотя другие датируют главу раньше. Затем Иудея принадлежала египетским Птолемеям с 301 г. до н. э. и после битвы при Панионе в 200 г. до н. э. перешла к Селевкидам."
  uk:
    - "332 р. до н. е. Розбивши Дарія III при Іссі в листопаді 333 р., Александр рушив униз узбережжям Сирії та Фінікії, узяв Тір після семимісячної облоги й Газу ще за два місяці та пішов далі до Єгипту; Юдея, у пагорбах між ними, перейшла до нього разом з рештою перської провінції без жодної битви, яку фіксують джерела. Мапа стоїть у Тірі 332 р. до н. е. Тір лежить приблизно за 166 км на північ від Єрусалиму по прямій, а Газа — приблизно за 79 км на південний захід."
    - "Грецькі й римські історики Александра, Арріан, Діодор і Курцій, євреїв узагалі не згадують. Йосиф Флавій розповідає, що під час облоги Тіру Александр зажадав допомоги від первосвященика Яддуя, який відмовив через присягу Дарієві, і що після Гази цар прийшов до Єрусалиму, де Яддуй зустрів його в священних шатах, Александр вклонився перед Ім'ям на мітрі священика, і йому показали книгу Даниїла, яка провіщала, що грек зруйнує перську імперію. Більшість істориків вважає цю розповідь легендою пізнішої доби; певно ж відомо, що Самарія повстала проти Александрового намісника Андромаха 331 р. і була покарана, як повідомляє Курцій, а папіруси втікачів, знайдені в печері Ваді-ед-Далія 1962 року, узгоджуються з цією розповіддю, тоді як Юдея залишалася спокійною й зберегла свої закони."
    - "Видіння Даниїла читали про ці роки: козел, що «від заходу несеться по всїй землї … не доторкуючись до землї», який ламає обидва роги барана, «се царі Мидийський та Перський»; ангел пояснює: «цап кудлатий — царь Грециї, а здоровенний ріг, що між очима в нього, се перший потугою царь її», а коли великий ріг ламається, на його місці постають чотири, як Александрова імперія була поділена між його воєначальниками після його смерті у Вавилоні 323 р. до н. е. Багато тлумачів також читають оракул Захарії проти Тіру, про який сказано, що Господь «зломить силу його на морі», і проти Гази, де «не стане царя в Газі», як картину походу 332 р., хоча інші датують розділ раніше. Відтак Юдея з 301 р. до н. е. належала Птолемеям Єгипетським, а після битви при Паніоні 200 р. до н. е. перейшла до Селевкідів."
  es:
    - "En el 332 a. C. Tras derrotar a Darío III en Iso, en noviembre del 333, Alejandro marchó hacia el sur por la costa de Siria y Fenicia, tomó Tiro tras un asedio de siete meses y Gaza tras dos más, y siguió hacia Egipto; Judea, en las colinas entre ambas, pasó a él con el resto de la provincia persa sin batalla alguna que registren las fuentes. El mapa se sitúa en Tiro en el 332 a. C. Tiro queda a unos 166 km al norte de Jerusalén en línea recta y Gaza a unos 79 km al suroeste."
    - "Los historiadores griegos y romanos de Alejandro, Arriano, Diodoro y Curcio, no mencionan a los judíos en absoluto. Josefo cuenta que, mientras Tiro estaba sitiada, Alejandro exigió ayuda al sumo sacerdote Jadúa, que se negó por su juramento a Darío, y que tras Gaza el rey subió a Jerusalén, donde Jadúa lo recibió con sus vestiduras, Alejandro se inclinó ante el Nombre que había en la mitra del sacerdote y se le mostró el libro de Daniel, que anunciaba que un griego destruiría el imperio persa. La mayoría de los historiadores tiene el relato por una leyenda de época posterior; lo seguro es que Samaria se rebeló contra el gobernador de Alejandro, Andrómaco, en el 331 y fue castigada, como registra Curcio, y los papiros de fugitivos hallados en una cueva del uadi ed-Daliyeh en 1962 encajan con ese relato, mientras que Judea permaneció tranquila y conservó sus leyes."
    - "Las visiones de Daniel se leyeron sobre estos años: el macho cabrío que «venía de la parte del poniente sobre la haz de toda la tierra, el cual no tocaba la tierra» y quebró los dos cuernos del carnero, «los reyes de Media y de Persia»; el ángel explica que «el macho cabrío es el rey de Javán: y el cuerno grande que tenía entre sus ojos es el rey primero», y que cuando el gran cuerno es quebrado, cuatro suben en su lugar, como el imperio de Alejandro se dividió entre sus generales tras su muerte en Babilonia en el 323 a. C. Muchos leen también el oráculo de Zacarías contra Tiro («herirá en la mar su fortaleza»), y contra Gaza, donde «de Gaza perecerá el rey», como imagen de la marcha del 332, aunque otros fechan el capítulo antes. Judea perteneció luego a los Ptolomeos de Egipto desde el 301 a. C. y pasó a los Seléucidas tras la batalla de Panio en el 200 a. C."
  pt:
    - "Em 332 a.C. Depois de derrotar Dario III em Isso, em novembro de 333, Alexandre desceu pela costa da Síria e da Fenícia, tomou Tiro após um cerco de sete meses e Gaza após mais dois, e seguiu para o Egito; a Judeia, nos montes entre os dois, passou a ele com o resto da província persa sem nenhuma batalha registrada pelas fontes. O mapa está em Tiro em 332 a.C. Tiro fica a cerca de 166 km ao norte de Jerusalém em linha reta, e Gaza a cerca de 79 km a sudoeste."
    - "Os historiadores gregos e romanos de Alexandre, Arriano, Diodoro e Cúrcio, não mencionam os judeus. Josefo conta que, durante o cerco de Tiro, Alexandre exigiu ajuda do sumo sacerdote Jadua, que a recusou por causa do juramento a Dario, e que depois de Gaza o rei subiu a Jerusalém, onde Jadua o recebeu em suas vestes; Alexandre se curvou diante do Nome na mitra do sacerdote e lhe mostraram o livro de Daniel, que predizia que um grego destruiria o império persa. A maioria dos historiadores toma a história por lenda de época posterior; o que é seguro é que Samaria se revoltou contra o governador de Alexandre, Andrômaco, em 331 e foi castigada, como registra Cúrcio, e os papiros de fugitivos achados numa caverna do uádi ed-Daliyeh em 1962 combinam com esse relato, enquanto a Judeia ficou quieta e manteve suas leis."
    - "As visões de Daniel foram lidas à luz desses anos: o bode que “veio do oeste sobre a superfície de toda a terra, e não tocava no chão” e quebrou os dois chifres do carneiro, “os reis da Média e da Pérsia”; o anjo explica que “o bode peludo é o rei da Grécia. O grande chifre que está entre os seus olhos é o primeiro rei”, e que, quebrado o grande chifre, quatro se levantam em seu lugar, como o império de Alexandre foi dividido entre seus generais depois de sua morte em Babilônia, em 323 a.C. Muitos comentaristas leem também o oráculo de Zacarias contra Tiro, da qual se diz que “ferirá o seu poder no mar”, e contra Gaza, onde “o rei perecerá”, como um retrato da marcha de 332, embora outros datem o capítulo mais cedo. A Judeia pertenceu então aos ptolomeus do Egito desde 301 a.C. e passou aos selêucidas depois da batalha de Pânio, em 200 a.C."
  de:
    - "Im Jahr 332 v. Chr. Nach dem Sieg über Dareios III. bei Issos im November 333 zog Alexander die Küste Syriens und Phöniziens hinab, nahm Tyrus nach siebenmonatiger Belagerung und Gaza nach zwei weiteren Monaten ein und zog weiter nach Ägypten; Judäa, im Bergland dazwischen, fiel ihm mit dem Rest der persischen Provinz ohne eine Schlacht zu, die die Quellen verzeichnen. Die Karte steht 332 v. Chr. bei Tyrus. Tyrus liegt etwa 166 km nördlich von Jerusalem in der Luftlinie und Gaza etwa 79 km südwestlich."
    - "Die griechischen und römischen Geschichtsschreiber Alexanders, Arrian, Diodor und Curtius, erwähnen die Juden überhaupt nicht. Josephus erzählt, Alexander habe während der Belagerung von Tyrus vom Hohenpriester Jaddua Hilfe verlangt, der sie wegen seines Eides auf Dareios verweigerte, und nach Gaza sei der König nach Jerusalem hinaufgezogen, wo Jaddua ihm im Ornat entgegentrat, Alexander sich vor dem Namen auf der Mitra des Priesters verneigte und ihm das Buch Daniel gezeigt wurde, das voraussagt, ein Grieche werde das persische Reich zerstören. Die meisten halten die Geschichte für eine spätere Legende; gesichert ist, dass Samaria 331 gegen Alexanders Statthalter Andromachos aufstand und bestraft wurde, wie Curtius berichtet, und die 1962 in einer Höhle des Wadi ed-Daliye gefundenen Flüchtlingspapyri passen dazu, während Judäa ruhig blieb und seine Gesetze behielt."
    - "Daniels Visionen las man auf diese Jahre: der Ziegenbock, der „vom Abend her über die ganze Erde“ kam, „daß er die Erde nicht berührte“, und die beiden Hörner des Widders zerbrach, „die Könige in Medien und Persien“; der Engel deutet: „Der Ziegenbock aber ist der König in Griechenland. Das Horn zwischen seinen Augen ist der erste König“, und wenn das große Horn zerbricht, erheben sich vier an seiner Stelle, wie Alexanders Reich nach seinem Tod 323 v. Chr. in Babylon unter seine Feldherren zerfiel. Viele Ausleger lesen auch Sacharjas Spruch gegen Tyrus, von dem es heißt: „wird ihre Macht, die sie auf dem Meer hat, schlagen“, und gegen Gaza, wo es heißt: „es wird aus sein mit dem König zu Gaza“, als Bild des Zuges von 332, andere datieren das Kapitel früher. Judäa gehörte dann ab 301 v. Chr. den Ptolemäern und fiel nach der Schlacht von Panion 200 v. Chr. an die Seleukiden."
  fr:
    - "En 332 av. J.-C. Après avoir vaincu Darius III à Issos en novembre 333, Alexandre descendit la côte de Syrie et de Phénicie, prit Tyr après un siège de sept mois et Gaza après deux de plus, et poursuivit vers l’Égypte ; la Judée, dans les collines entre les deux, passa à lui avec le reste de la province perse sans aucune bataille que les sources mentionnent. La carte se place à Tyr en 332 av. J.-C. Tyr est à environ 166 km au nord de Jérusalem en ligne droite et Gaza à environ 79 km au sud-ouest."
    - "Les historiens grecs et romains d’Alexandre, Arrien, Diodore et Quinte-Curce, ne mentionnent pas du tout les Juifs. Josèphe raconte que, pendant le siège de Tyr, Alexandre exigea l’aide du grand prêtre Jaddua, qui refusa à cause de son serment à Darius, et qu’après Gaza le roi monta à Jérusalem, où Jaddua vint à sa rencontre en habits sacerdotaux ; Alexandre se prosterna devant le Nom inscrit sur la tiare du prêtre et se vit montrer le livre de Daniel annonçant qu’un Grec détruirait l’empire perse. La plupart des historiens y voient une légende d’un âge postérieur ; ce qui est sûr, c’est que Samarie se révolta en 331 contre le gouverneur d’Alexandre, Andromaque, et fut punie, comme le rapporte Quinte-Curce, et que les papyrus de fugitifs trouvés en 1962 dans une grotte du Wadi ed-Daliyeh concordent avec ce récit, tandis que la Judée resta calme et garda ses lois."
    - "Les visions de Daniel furent lues à la lumière de ces années : le bouc qui « venait de l’occident, et parcourait toute la terre à sa surface, sans la toucher » et brisa les deux cornes du bélier, « les rois des Mèdes et des Perses » ; l’ange explique : « Le bouc, c’est le roi de Javan, la grande corne entre ses yeux, c’est le premier roi », et quand la grande corne se brise, quatre s’élèvent à sa place, comme l’empire d’Alexandre fut partagé entre ses généraux après sa mort à Babylone en 323 av. J.-C. Beaucoup lisent aussi l’oracle de Zacharie contre Tyr, dont il dit : « Il précipitera sa puissance dans la mer », et contre Gaza, où « le roi disparaîtra », comme une image de la marche de 332, d’autres datant le chapitre plus haut. La Judée appartint ensuite aux Ptolémées d’Égypte dès 301 av. J.-C. et passa aux Séleucides après la bataille du Panion en 200 av. J.-C."
  pl:
    - "W 332 p.n.e. Po pokonaniu Dariusza III pod Issos w listopadzie 333 Aleksander ruszył w dół wybrzeżem Syrii i Fenicji, zdobył Tyr po siedmiomiesięcznym oblężeniu, a Gazę po dwóch następnych miesiącach i poszedł dalej do Egiptu; Judea, leżąca w górach między nimi, przeszła pod jego władzę wraz z resztą perskiej prowincji bez żadnej bitwy, o której wspominają źródła. Mapa stoi w Tyrze w 332 p.n.e. Tyr leży około 166 km na północ od Jerozolimy w linii prostej, a Gaza około 79 km na południowy zachód."
    - "Greccy i rzymscy historycy Aleksandra, Arrian, Diodor i Kurcjusz, w ogóle nie wspominają o Żydach. Józef Flawiusz opowiada, że podczas oblężenia Tyru Aleksander zażądał pomocy od arcykapłana Jaddui, który odmówił ze względu na przysięgę złożoną Dariuszowi, a po Gazie król przyszedł do Jerozolimy, gdzie Jaddua wyszedł mu naprzeciw w szatach kapłańskich, Aleksander pokłonił się przed Imieniem na mitrze kapłana i pokazano mu księgę Daniela zapowiadającą, że Grek zniszczy państwo perskie. Większość historyków uważa tę opowieść za legendę z późniejszej epoki; pewne jest, że Samaria zbuntowała się przeciw namiestnikowi Aleksandra Andromachowi w 331 i została ukarana, jak notuje Kurcjusz, a papirusy uchodźców znalezione w jaskini w Wadi ed-Dalija w 1962 pasują do tej relacji, podczas gdy Judea zachowała spokój i swoje prawa."
    - "Wizje Daniela odczytywano w odniesieniu do tych lat: kozieł, który „przychodził od zachodu na oblicze wszystkiej ziemi, a nikt się go nie dotykał na ziemi” i złamał oba rogi barana, którym są „królowie, Medski i Perski”; anioł wyjaśnia, że „ten kozieł kosmaty jest król Grecki, a ten róg wielki, który jest między oczyma jego, jest król pierwszy”, i że gdy wielki róg się złamie, wyrastają na jego miejscu cztery, tak jak imperium Aleksandra podzielono między jego wodzów po jego śmierci w Babilonie w 323 p.n.e. Wielu komentatorów odczytuje też wyrocznię Zachariasza przeciw Tyrowi, o którym mówi: „a wrazi w morze siłę jego”, i przeciw Gazie, gdzie „zginie król z Gazy”, jako obraz pochodu z 332, choć inni datują ten rozdział wcześniej. Judea należała potem do Ptolemeuszy z Egiptu od 301 p.n.e., a po bitwie pod Panion w 200 p.n.e. przeszła pod Seleucydów."
  it:
    - "Nel 332 a.C. Dopo aver sconfitto Dario III a Isso nel novembre del 333, Alessandro scese lungo la costa della Siria e della Fenicia, prese Tiro dopo un assedio di sette mesi e Gaza dopo altri due, e proseguì in Egitto; la Giudea, sulle alture tra le due, passò a lui con il resto della provincia persiana senza alcuna battaglia che le fonti registrino. La mappa si trova a Tiro nel 332 a.C. Tiro dista circa 166 km a nord di Gerusalemme in linea retta e Gaza circa 79 km a sud-ovest."
    - "Gli storici greci e romani di Alessandro, Arriano, Diodoro e Curzio, non menzionano affatto gli Ebrei. Giuseppe Flavio racconta che durante l’assedio di Tiro Alessandro chiese aiuto al sommo sacerdote Iaddua, che rifiutò per il suo giuramento a Dario, e che dopo Gaza il re salì a Gerusalemme, dove Iaddua lo incontrò in paramenti; Alessandro si inchinò davanti al Nome sulla mitra del sacerdote e gli fu mostrato il libro di Daniele che preannunciava che un Greco avrebbe distrutto l’impero persiano. La maggior parte degli storici considera il racconto una leggenda di età posteriore; è sicuro che Samaria si ribellò nel 331 al governatore di Alessandro, Andromaco, e fu punita, come registra Curzio, e i papiri di fuggiaschi trovati in una grotta di Wadi ed-Daliyeh nel 1962 concordano con quel resoconto, mentre la Giudea rimase tranquilla e conservò le sue leggi."
    - "Le visioni di Daniele furono lette in rapporto a questi anni: il capro che, «dall’occidente … percorreva tutta la superficie della terra senza toccare il suolo», spezzò le due corna del montone, «i re di Media e di Persia»; l’angelo spiega: «Il becco peloso è il re di Grecia; e il gran corno fra i suoi due occhi è il primo re», e che quando il gran corno è spezzato ne sorgono quattro al suo posto, come l’impero di Alessandro fu diviso tra i suoi generali dopo la sua morte a Babilonia nel 323 a.C. Molti leggono anche l’oracolo di Zaccaria contro Tiro («getterà la sua potenza nel mare») e contro Gaza («Gaza non avrà più re») come un quadro della marcia del 332, benché altri datino il capitolo prima. La Giudea appartenne poi ai Tolomei d’Egitto dal 301 a.C. e passò ai Seleucidi dopo la battaglia di Panion nel 200 a.C."
  nl:
    - "In 332 v.Chr. Nadat hij in november 333 bij Issus Darius III had verslagen, trok Alexander langs de kust van Syrië en Fenicië naar het zuiden, nam Tyrus in na een beleg van zeven maanden en Gaza na nog twee, en trok verder naar Egypte; Judea, in het bergland tussen beide, kwam met de rest van de Perzische provincie in zijn handen zonder enige slag die de bronnen vermelden. De kaart staat bij Tyrus in 332 v.Chr. Tyrus ligt hemelsbreed ongeveer 166 km ten noorden van Jeruzalem en Gaza ongeveer 79 km ten zuidwesten."
    - "De Griekse en Romeinse geschiedschrijvers van Alexander, Arrianus, Diodorus en Curtius, noemen de Joden niet. Josephus vertelt dat Alexander tijdens het beleg van Tyrus hulp eiste van hogepriester Jaddua, die weigerde vanwege zijn eed aan Darius, en dat de koning na Gaza naar Jeruzalem optrok, waar Jaddua hem in ambtsgewaad tegemoet kwam, Alexander zich boog voor de Naam op de mijter van de priester en het boek Daniël te zien kreeg, dat voorspelt dat een Griek het Perzische rijk zou vernietigen. De meeste historici houden het verhaal voor een latere legende; zeker is dat Samaria in 331 tegen Alexanders gouverneur Andromachus in opstand kwam en werd gestraft, zoals Curtius vermeldt, en de papyri van vluchtelingen uit een grot van de Wadi ed-Daliyeh (1962) passen daarbij, terwijl Judea rustig bleef en zijn wetten behield."
    - "Daniëls visioenen werden op deze jaren betrokken: de geitenbok die “kwam … van het westen over den gansen aardbodem, en roerde de aarde niet aan” en de twee hoornen van de ram brak, “de koningen der Meden en der Perzen”; de engel zegt: “Die harige bok nu, is de koning van Griekenland; en de grote hoorn, welke tussen zijn ogen is, is de eerste koning”, en als die hoorn breekt, komen er vier op zijn plaats, zoals Alexanders rijk na zijn dood in Babylon in 323 v.Chr. onder zijn generaals werd verdeeld. Velen lezen ook Zacharia’s godsspraak tegen Tyrus, “Hij zal haar vesting in de zee verslaan”, en tegen Gaza, waar “de koning van Gaza zal vergaan”, als beeld van de veldtocht van 332, al dateren anderen het hoofdstuk eerder. Judea was daarna vanaf 301 v.Chr. van de Ptolemaeën van Egypte en kwam na de slag bij Panium in 200 v.Chr. aan de Seleuciden."
  cs:
    - "Roku 332 př. n. l. Po porážce Dareia III. u Issu v listopadu 333 táhl Alexandr dolů podél pobřeží Sýrie a Fénicie, dobyl Týr po sedmiměsíčním obléhání a Gazu po dalších dvou a pokračoval do Egypta; Judsko, v horách mezi nimi, mu připadlo spolu se zbytkem perské provincie bez jakékoli bitvy, kterou by prameny zaznamenávaly. Mapa stojí u Týru v roce 332 př. n. l. Týr leží asi 166 km severně od Jeruzaléma vzdušnou čarou a Gaza asi 79 km jihozápadně."
    - "Řečtí a římští dějepisci Alexandra, Arrianos, Diodóros a Curtius, o Židech vůbec nepíší. Josephus Flavius vypráví, že při obléhání Týru žádal Alexandr o pomoc velekněze Jadua, který ji odepřel pro přísahu Dareiovi, a že po Gaze král přitáhl do Jeruzaléma, kde se s ním Jadua setkal v rouchu, Alexandr se poklonil Jménu na knězově mitře a byla mu ukázána kniha Daniel, předpovídající, že Řek zničí perskou říši. Většina historiků pokládá příběh za legendu pozdější doby; jisté je, že se Samaří roku 331 vzbouřilo proti Alexandrovu místodržiteli Andromachovi a bylo potrestáno, jak zaznamenává Curtius, a papyry uprchlíků nalezené roku 1962 v jeskyni Wádí ad-Dálija tomu odpovídají, zatímco Judsko zůstalo klidné a podrželo své zákony."
    - "Danielova vidění se vykládala o těchto letech: kozel, který „přicházel od západu na svrchek vší země, a žádný se ho nedotýkal na zemi“ a zlámal oba rohy skopce, „králové Médský a Perský“; anděl vysvětluje: „Kozel pak ten chlupatý jest král Řecký, a roh ten veliký, kterýž jest mezi očima jeho, jest král první“, a když se veliký roh zlomí, vzejdou čtyři na jeho místě, jako byla Alexandrova říše po jeho smrti v Babylóně roku 323 př. n. l. rozdělena mezi jeho vojevůdce. Mnozí vykladači čtou též Zacharjášovo proroctví proti Týru, o němž praví: „vrazí do moře sílu jeho“, a proti Gaze, kde „zahyne král z Gázy“, jako obraz tažení roku 332, ač jiní tu kapitolu datují dříve. Judsko pak patřilo od roku 301 př. n. l. egyptským Ptolemaiovcům a po bitvě u Panionu roku 200 př. n. l. přešlo na Seleukovce."
  sv:
    - "År 332 f.Kr. Efter att ha besegrat Dareios III vid Issos i november 333 tågade Alexander ned längs Syriens och Feniciens kust, intog Tyros efter en belägring på sju månader och Gaza efter ytterligare två, och drog vidare in i Egypten; Judeen, i bergen mellan de två, övergick till honom med resten av den persiska provinsen utan någon strid som källorna redovisar. Kartan står vid Tyros år 332 f.Kr. Tyros ligger omkring 166 km norr om Jerusalem fågelvägen och Gaza omkring 79 km åt sydväst."
    - "De grekiska och romerska historikerna om Alexander, Arrianos, Diodoros och Curtius, nämner inte judarna alls. Josefus berättar att Alexander under belägringen av Tyros krävde hjälp av översteprästen Jaddua, som vägrade på grund av sin ed till Dareios, och att kungen efter Gaza drog upp till Jerusalem, där Jaddua mötte honom i sin prästdräkt, Alexander böjde sig inför Namnet på prästens mitra och fick se Daniels bok, som förutsade att en grek skulle förstöra det persiska riket. De flesta historiker tar berättelsen för en legend från en senare tid; det säkra är att Samaria gjorde uppror mot Alexanders ståthållare Andromachos 331 och straffades, som Curtius uppger, och papyrerna efter flyktingar som hittades i en grotta i Wadi ed-Daliyeh 1962 stämmer med den redogörelsen, medan Judeen höll sig lugnt och behöll sina lagar."
    - "Daniels syner lästes om dessa år: bocken som Daniel såg ”komma västerifrån och gå fram över hela jorden, dock utan att röra vid jorden” och som krossade de två hornen på väduren, ”Mediens och Persiens konungar”; ängeln förklarar att ”bocken är Javans konung, och det stora hornet i hans panna är den förste konungen”, och att när det stora hornet brister sönder skjuter fyra upp i dess ställe, liksom Alexanders rike delades mellan hans generaler efter hans död i Babylon 323 f.Kr. Många kommentatorer läser också Sakarjas utsaga mot Tyros, om vilken han säger ”han skall bryta hennes murar ned i havet”, och mot Gaza, där ”Gasa mister sin konung”, som en bild av tåget 332, men andra daterar kapitlet tidigare. Judeen tillhörde sedan Ptolemaierna i Egypten från 301 f.Kr. och övergick till Seleukiderna efter slaget vid Panion år 200 f.Kr."
  nb:
    - "I 332 f.Kr. Etter å ha beseiret Dareios III ved Issos i november 333 marsjerte Aleksander ned langs kysten av Syria og Fønikia, inntok Tyros etter en beleiring på sju måneder og Gasa etter to til, og gikk videre inn i Egypt; Judea, i åsene mellom de to, gikk over til ham sammen med resten av den persiske provinsen uten noen kamp som kildene melder om. Kartet står ved Tyros i 332 f.Kr. Tyros ligger omtrent 166 km nord for Jerusalem i luftlinje og Gasa omtrent 79 km mot sørvest."
    - "De greske og romerske historikerne om Aleksander, Arrian, Diodor og Curtius, nevner ikke jødene i det hele tatt. Josefus forteller at mens Tyros var beleiret, krevde Aleksander hjelp fra øverstepresten Jaddua, som nektet på grunn av sin ed til Dareios, og at kongen etter Gasa kom opp til Jerusalem, der Jaddua møtte ham i sine embetsdrakter, Aleksander bøyde seg for Navnet på prestens mitra og ble vist Daniels bok som forutsa at en greker ville ødelegge det persiske riket. De fleste historikere regner fortellingen for en legende fra en senere tid; det som er sikkert, er at Samaria gjorde opprør mot Aleksanders guvernør Andromakhos i 331 og ble straffet, slik Curtius melder, og papyrusene etter flyktninger funnet i en hule i Wadi ed-Daliyeh i 1962 passer med den beretningen, mens Judea holdt seg stille og beholdt sine lover."
    - "Daniels syner er blitt lest om disse årene: gjetebukken som «kom fra vest og fór frem over hele jorden uten å røre ved jorden» og brøt de to hornene på væren, «kongene av Media og Persia»; engelen forklarer at «den raggete bukk er kongen av Grekenland, og det store horn mellem dens øine er den første konge», og at når det store hornet brytes, vokser fire opp i dets sted, slik Aleksanders rike ble delt mellom hans generaler etter hans død i Babylon i 323 f.Kr. Mange kommentatorer leser også Sakarjas orakel mot Tyros, om hvilket det heter at Herren skal «styrte dets murer i havet», og mot Gasa, som «skal miste sin konge», som et bilde av marsjen i 332, selv om andre datere kapittelet tidligere. Judea tilhørte deretter ptolemeerne i Egypt fra 301 f.Kr. og gikk over til seleukidene etter slaget ved Panion i 200 f.Kr."
  tl:
    - "Noong 332 BK. Pagkatapos talunin si Dario III sa Isos noong Nobyembre 333, nagmartsa si Alejandro pababa sa baybayin ng Siria at Fenicia, kinuha ang Tiro pagkatapos ng pagkubkob na pitong buwan at ang Gaza pagkaraan ng dalawa pa, at nagpatuloy sa Egipto; ang Judea, sa mga burol sa pagitan ng dalawa, ay napunta sa kaniya kasama ng natitirang lalawigang Persiano nang walang anumang labanang itinala ng mga pinagkunan. Nasa Tiro ang mapa noong 332 BK. Ang Tiro ay nasa mga 166 km sa hilaga ng Jerusalem sa tuwid na guhit at ang Gaza ay mga 79 km sa timog-kanluran."
    - "Hindi binabanggit ng mga mananalaysay na Griyego at Romano ni Alejandro, sina Arriano, Diodoro at Curcio, ang mga Judio. Ayon kay Josephus, habang kinukubkob ang Tiro ay humingi si Alejandro ng tulong sa mataas na saserdoteng si Jadua, na tumanggi dahil sa sumpa kay Dario; pagkatapos ng Gaza ay umahon ang hari sa Jerusalem, sinalubong siya ni Jadua na nakabihis-saserdote, yumuko si Alejandro sa Pangalan sa mitra ng saserdote at ipinakita sa kaniya ang aklat ni Daniel na humuhulang wawasakin ng isang Griyego ang imperyong Persiano. Alamat ng mas huling panahon ito ayon sa karamihan; tiyak na naghimagsik ang Samaria laban sa gobernador ni Alejandro na si Andromaco noong 331 at pinarusahan, ayon kay Curcio, at tumutugma rito ang mga papiro ng mga takas na natagpuan sa yungib ng Wadi ed-Daliyeh noong 1962, samantalang tahimik ang Judea at iningatan ang mga batas nito."
    - "Binasa ang mga pangitain ni Daniel sa mga taong ito: ang kambing na lalake na “nagmula sa kalunuran sa ibabaw ng buong lupa, at hindi sumayad sa lupa” at bumali sa dalawang sungay ng lalaking tupa, “ang mga hari sa Media at Persia”; ayon sa anghel, “ang may magaspang na balahibo na lalaking kambing ay siyang hari sa Grecia: at ang malaking sungay na nasa pagitan ng kaniyang mga mata ay siyang unang hari”, at kapag nabali ito ay apat ang bumabangon, gaya ng paghahati ng imperyo ni Alejandro sa mga heneral pagkamatay niya sa Babilonia (323 BK). Ang orakulo ni Zacharias laban sa Tiro, na “sisirain sa dagat ang kapangyarihan niya”, at laban sa Gaza, na “ang hari ay mamamatay sa Gaza”, ay binabasa ng marami bilang larawan ng martsa noong 332, bagaman mas maaga ayon sa iba. Napasa ang Judea sa mga Ptolemeo ng Egipto mula 301 BK at sa mga Seleucida pagkatapos ng Panium noong 200 BK."
  da:
    - "I 332 f.Kr. Efter at have besejret Darius III ved Issos i november 333 drog Alexander ned langs Syriens og Fønikiens kyst, indtog Tyrus efter en belejring på syv måneder og Gaza efter yderligere to og drog videre til Egypten; Judæa, i bjergene mellem de to, gik over til ham sammen med resten af den persiske provins uden nogen kamp, som kilderne beretter om. Kortet står ved Tyrus i 332 f.Kr. Tyrus ligger omkring 166 km nord for Jerusalem i luftlinje og Gaza omkring 79 km mod sydvest."
    - "De græske og romerske historikere om Alexander, Arrian, Diodor og Curtius, nævner slet ikke jøderne. Josefus fortæller, at Alexander, mens Tyrus var belejret, krævede hjælp af ypperstepræsten Jaddua, som nægtede på grund af sin ed til Darius, og at kongen efter Gaza drog op til Jerusalem, hvor Jaddua mødte ham i sine dragter, Alexander bøjede sig for Navnet på præstens turban og blev vist Daniels bog, som forudsagde, at en græker ville ødelægge det persiske rige. De fleste historikere anser fortællingen for en legende fra en senere tid; hvad der er sikkert, er, at Samaria gjorde oprør mod Alexanders guvernør Andromachos i 331 og blev straffet, som Curtius beretter, og flygtningenes papyrer, fundet i en hule i Wadi ed-Daliyeh i 1962, passer med den beretning, mens Judæa forblev roligt og bevarede sine love."
    - "Daniels syner blev læst på disse år: gedebukken, der »kom fra Vesten hen over al Jorden, og den rørte ikke ved Jorden«, og som brækkede vædderens to horn, »Kongerne af Medien og Persien«; englen forklarer, at »den laadne Buk er Kongen af Grækenland; og det store Horn, som var imellem dens Øjne, er den første Konge«, og at når det store horn brydes, rejser fire sig i dets sted, som Alexanders rige blev delt mellem hans generaler efter hans død i Babylon i 323 f.Kr. Mange kommentatorer læser også Zakarias' orakel mod Tyrus, om hvilket han siger, at Herren vil »slaa dens Magt paa Havet«, og mod Gaza, hvor »Gaza skal miste sin Konge«, som et billede af marchen i 332, selv om andre dater kapitlet tidligere. Judæa tilhørte derefter Ptolemæerne i Egypten fra 301 f.Kr. og gik over til Seleukiderne efter slaget ved Panion i 200 f.Kr."
  sr:
    - "Године 332. п. н. е. После победе над Даријем III код Иса у новембру 333, Александар је кренуо низ обалу Сирије и Феникије, заузео Тир после опсаде од седам месеци и Газу после још два, и отишао даље у Египат; Јудеја, у брдима између њих, прешла је на њега са остатком персијске провинције без икакве битке коју извори бележе. Карта стоји на Тиру у 332. п. н. е. Тир лежи око 166 км северно од Јерусалима правом линијом, а Газа око 79 км југозападно."
    - "Грчки и римски историчари Александра, Аријан, Диодор и Курције, Јевреје уопште не помињу. Јосиф Флавије прича да је Александар, док је Тир био опседнут, тражио помоћ од првосвештеника Јадве, који је одбио због заклетве Дарију, и да је после Газе краљ дошао у Јерусалим, где га је Јадва дочекао у свештеничком оделу, да се Александар поклонио пред Именом на свештеникову митри и да му је показана Данилова књига која прориче да ће Грк уништити персијско царство. Већина историчара држи ту причу за легенду каснијег доба; сигурно је да се Самарија 331. побунила против Александровог намесника Андромаха и била кажњена, како бележи Курције, и да се с тим извештајем слажу папируси бегунаца пронађени у пећини Вади ед Далија 1962, док је Јудеја остала мирна и задржала своје законе."
    - "Данилове визије читане су у вези с овим годинама: јарац о коме је речено: „иђаше јарац од запада поврх све земље, а не дотицаше се земље“ и који је сломио оба рога овна, то јест „цареви мидски и персијски“; анђео објашњава: „А руњави је јарац цар грчки; и велики рог што му беше међу очима, то је први цар“, и да кад се велики рог сломи, на његовом месту израсту четири, као што је Александрово царство подељено међу његове војсковође после његове смрти у Вавилону 323. п. н. е. Многи тумачи и Захаријино пророштво против Тира, о коме каже: „врћи ће у море силу његову“, и против Газе, где „погинуће цар у Гази“, читају као слику похода из 332, иако други то поглавље датирају раније. Јудеја је затим од 301. п. н. е. припадала Птолемејима у Египту, а после битке код Паниона 200. п. н. е. прешла је на Селеукиде."
  hu:
    - "Kr. e. 332-ben. Miután Kr. e. 333 novemberében Issosnál legyőzte III. Dáriust, Nagy Sándor lehaladt Szíria és Fönícia partján, hét hónapos ostrom után bevette Tíruszt, további két hónap után Gázát, és Egyiptomba vonult tovább; a kettő közötti hegyvidéken fekvő Júdea a perzsa provincia többi részével együtt jutott hozzá, anélkül, hogy a források csatát jegyeztek volna fel. A térkép Tíruszon áll, Kr. e. 332-ben. Tírusz Jeruzsálemtől egyenes vonalban mintegy 166 km-re északra van, Gáza mintegy 79 km-re délnyugatra."
    - "Nagy Sándor görög és római történetírói, Arrianosz, Diodórosz és Curtius egyáltalán nem említik a zsidókat. Josephus szerint Tírusz ostroma idején Sándor segítséget követelt Jaddua főpaptól, aki a Dáriusnak tett esküjére hivatkozva megtagadta, Gáza után pedig a király felment Jeruzsálembe, ahol Jaddua ünnepi ruhájában fogadta, Sándor meghajolt a főpap süvegén lévő Név előtt, és megmutatták neki a Dániel könyvét, amely megjövendöli, hogy egy görög elpusztítja a perzsa birodalmat. A legtöbb történész a történetet későbbi kor legendájának tartja; biztos, hogy Szamária Kr. e. 331-ben fellázadt Sándor helytartója, Andromakhosz ellen, és megbűnhődött, ahogy Curtius feljegyzi, és az 1962-ben a Wadi ed-Daliyeh egyik barlangjában talált menekültpapiruszok megfelelnek ennek a beszámolónak, míg Júdea nyugodt maradt, és megtartotta törvényeit."
    - "Dániel látomásait ezekről az évekről olvasták: a kecskebak, amely „jöve napnyugot felől az egész föld színére, és nem is illeté a földet”, és összetörte a kos két szarvát, Média és Perzsia királyait; az angyal megmagyarázza: „A szőrös kecskebak Görögország királya, a nagy szarv pedig, a mely szemei között vala, az az első király”, és hogy amikor a nagy szarv eltörik, négy támad a helyén, ahogy Sándor birodalma felosztatott tábornokai között a Kr. e. 323-ban Babilonban bekövetkezett halála után. Sok magyarázó Zakariás Tírusz elleni jövendölését is, amelyről ezt mondja: „megrontja hatalmát a tengeren”, és Gázáról, amelyből „kivész a király”, a Kr. e. 332-es menet képének olvassa, bár mások korábbra keltezik a fejezetet. Júdea ezután Kr. e. 301-től az egyiptomi Ptolemaiosoké volt, és a Kr. e. 200-as Panion melletti csata után a Szeleukidákra szállt."
  fi:
    - "Vuonna 332 eaa. Voitettuaan Dareios III:n Issoksessa marraskuussa 333 Aleksanteri eteni alas Syyrian ja Foinikian rannikkoa, valtasi Tyroksen seitsemän kuukauden piirityksen jälkeen ja Gazan kahden kuukauden jälkeen ja jatkoi Egyptiin; Juudea, joka sijaitsee niiden välisillä vuorilla, joutui hänelle muun Persian provinssin mukana ilman taistelua, jonka lähteet mainitsisivat. Kartta on Tyroksessa vuonna 332 eaa. Tyros on noin 166 km Jerusalemista pohjoiseen linnuntietä ja Gaza noin 79 km lounaaseen."
    - "Aleksanterin kreikkalaiset ja roomalaiset historioitsijat Arrianos, Diodoros ja Curtius eivät mainitse juutalaisia lainkaan. Josephus kertoo, että Tyroksen piirityksen aikana Aleksanteri vaati apua ylimmäiseltä papilta Jadduaalta, joka kieltäytyi Dareiokselle antamansa valan tähden, ja että Gazan jälkeen kuningas tuli ylös Jerusalemiin, missä Jaddua tapasi hänet virkapuvussaan, Aleksanteri kumarsi Nimeä, joka oli papin hiipassa, ja hänelle näytettiin Danielin kirja, joka ennusti kreikkalaisen tuhoavan Persian valtakunnan. Useimmat historioitsijat pitävät tarinaa myöhemmän ajan legendana; varmaa on, että Samaria kapinoi Aleksanterin käskynhaltijaa Andromakhosta vastaan vuonna 331 ja sitä rangaistiin, kuten Curtius kertoo, ja Wadi ed-Daliyehin luolasta vuonna 1962 löydetyt pakolaisten papyrukset sopivat siihen, kun taas Juudea pysyi rauhallisena ja piti lakinsa."
    - "Danielin näkyjä luettiin näistä vuosista: kauris, joka ”tuli päivän laskun puolelta, kulki koko maan ylitse eikä maata koskettanut” ja mursi oinaan kaksi sarvea, ”Meedian ja Persian kuninkaat”; enkeli selittää, että ”kauris on Jaavanin kuningas, ja suuri sarvi, joka sillä oli keskellä otsaa, on ensimmäinen kuningas”, ja että kun suuri sarvi särkyy, sen sijalle nousee neljä, kuten Aleksanterin valtakunta jaettiin hänen kenraaliensa kesken hänen kuoltuaan Babylonissa vuonna 323 eaa. Monet selittäjät lukevat myös Sakarjan ennustuksen Tyrosta vastaan, josta sanotaan: ”syöksee mereen sen voiman”, ja Gazaa vastaan, jossa ”hukkuu kuningas”, kuvaksi vuoden 332 marssista, vaikka toiset ajoittavat luvun aiemmaksi. Juudea kuului sitten Egyptin Ptolemaioksille vuodesta 301 eaa. ja siirtyi seleukideille Paneionin taistelun jälkeen vuonna 200 eaa."
  vi:
    - "Năm 332 TCN. Sau khi đánh bại Đa-ri-út III tại Issus vào tháng 11 năm 333, A-léc-xan-đơ tiến xuống dọc bờ biển Sy-ri và Phê-ni-xi, chiếm Ty-rơ sau cuộc vây hãm bảy tháng và Ga-xa sau hai tháng nữa, rồi đi tiếp vào Ê-díp-tô; Giu-đê, trong miền đồi giữa hai nơi, rơi vào tay ông cùng với phần còn lại của tỉnh Phe-rơ-sơ mà không có trận đánh nào được các nguồn ghi lại. Bản đồ đặt tại Ty-rơ năm 332 TCN. Ty-rơ nằm cách Giê-ru-sa-lem khoảng 166 km về phía bắc theo đường thẳng và Ga-xa khoảng 79 km về phía tây nam."
    - "Các sử gia Hy Lạp và La Mã của A-léc-xan-đơ, Arrian, Diodorus và Curtius, hoàn toàn không nhắc đến người Do Thái. Giô-sê-phu kể rằng trong lúc Ty-rơ bị vây, A-léc-xan-đơ đòi thầy tế lễ thượng phẩm Gia-đua giúp đỡ, nhưng ông từ chối vì lời thề với Đa-ri-út, và sau Ga-xa nhà vua lên Giê-ru-sa-lem, nơi Gia-đua ra đón trong lễ phục; A-léc-xan-đơ cúi lạy trước Danh trên mão của thầy tế lễ và được cho xem sách Đa-ni-ên báo trước rằng một người Hy Lạp sẽ phá hủy đế quốc Phe-rơ-sơ. Đa số sử gia coi câu chuyện là truyền thuyết của thời sau; điều chắc chắn là Sa-ma-ri nổi dậy chống tổng đốc Andromachus của A-léc-xan-đơ năm 331 và bị trừng phạt, như Curtius ghi, và các giấy cói của những người chạy trốn tìm thấy trong một hang ở Wadi ed-Daliyeh năm 1962 khớp với tường thuật ấy, còn Giu-đê vẫn yên tĩnh và giữ luật của mình."
    - "Các khải tượng của Đa-ni-ên được đọc là nói về những năm này: con dê đực “đến từ phía tây, đi khắp trên mặt đất mà không đụng đến đất” và húc gãy hai sừng của con chiên đực, “các vua nước Mê-đi và Phe-rơ-sơ”; thiên sứ giải thích rằng “con dê xờm đực, tức là vua nước Gờ-réc; và cái sừng lớn ở giữa hai con mắt, tức là vua đầu nhất”, và khi sừng lớn gãy thì bốn sừng mọc lên thay, như đế quốc của A-léc-xan-đơ bị chia cho các tướng sau khi ông qua đời tại Ba-by-lôn năm 323 TCN. Nhiều nhà chú giải cũng đọc sấm ngôn của Xa-cha-ri nghịch cùng Ty-rơ, về nơi ấy ông nói Chúa sẽ “xô quyền thế nó xuống biển”, và nghịch cùng Ga-xa, nơi “vua Ga-xa sẽ bị diệt”, như một bức tranh về cuộc hành quân năm 332, dù những người khác đặt niên đại chương này sớm hơn. Giu-đê sau đó thuộc các vua Ptolemy của Ê-díp-tô từ năm 301 TCN và chuyển sang các vua Seleucus sau trận Panium năm 200 TCN."
  ro:
    - "În 332 î.Hr. După ce l-a învins pe Darius al III-lea la Issos, în noiembrie 333, Alexandru a coborât pe coasta Siriei și a Feniciei, a luat Tirul după un asediu de șapte luni și Gaza după încă două, și a mers mai departe în Egipt; Iudeea, în dealurile dintre cele două, a trecut la el odată cu restul provinciei persane, fără nicio bătălie pe care s-o consemneze izvoarele. Harta stă la Tir, în 332 î.Hr. Tirul se află la circa 166 km nord de Ierusalim în linie dreaptă, iar Gaza la circa 79 km spre sud-vest."
    - "Istoricii greci și romani ai lui Alexandru, Arrian, Diodor și Curtius, nu-i pomenesc deloc pe evrei. Iosif Flaviu povestește că, în timpul asediului Tirului, Alexandru a cerut ajutor de la marele preot Iadua, care a refuzat pentru jurământul făcut lui Darius, și că după Gaza regele s-a urcat la Ierusalim, unde Iadua l-a întâmpinat în veșmintele sale; Alexandru s-a plecat înaintea Numelui de pe mitra preotului și i s-a arătat cartea lui Daniel, care prevestea că un grec va nimici imperiul persan. Cei mai mulți istorici o socotesc legendă târzie; sigur este că Samaria s-a răsculat în 331 împotriva guvernatorului lui Alexandru, Andromah, și a fost pedepsită, după cum consemnează Curtius, iar papirusurile fugarilor găsite într-o peșteră din Wadi ed-Daliyeh în 1962 se potrivesc acestei relatări, în timp ce Iudeea a rămas liniștită și și-a păstrat legile."
    - "Vedeniile lui Daniel au fost citite în raport cu acești ani: țapul care a venit dinspre apus peste fața întregului pământ, fără să atingă pământul, și a rupt cele două coarne ale berbecului, adică regii Mediei și ai Persiei; îngerul tâlcuiește: „țapul caprelor împăratul Elenilor este, și cornul cel mare, care erà între ochii lui, acesta este împăratul cel dintâiu”, iar când cornul cel mare se rupe se ridică patru în locul lui, după cum imperiul lui Alexandru a fost împărțit între generalii săi după moartea lui la Babilon, în 323 î.Hr. Mulți citesc și profeția lui Zaharia împotriva Tirului, despre care spune: „va bate pre mare tăriea lui”, și împotriva Gazei, unde „va perì împăratul dela Gaza”, ca imagine a marșului din 332, deși alții datează capitolul mai devreme. Iudeea a aparținut apoi Ptolemeilor din 301 î.Hr. și a trecut la Seleucizi după bătălia de la Panion, în 200 î.Hr."
  bg:
    - "През 332 г. пр.н.е. След като разбил Дарий III при Иса през ноември 333 г., Александър слязъл по крайбрежието на Сирия и Финикия, превзел Тир след седеммесечна обсада и Газа след още два месеца и продължил към Египет; Юдея, в планините между тях, преминала към него заедно с останалата част от персийската провинция без битка, за която да споменават източниците. Картата стои на Тир през 332 г. пр.н.е. Тир е на около 166 км северно от Йерусалим по права линия, а Газа — на около 79 км на югозапад."
    - "Гръцките и римските историци на Александър — Ариан, Диодор и Курций — изобщо не споменават юдеите. Йосиф Флавий разказва, че по време на обсадата на Тир Александър поискал помощ от първосвещеника Ядуй, който отказал заради клетвата си към Дарий, и че след Газа царят дошъл в Йерусалим, където Ядуй го посрещнал в одеждите си; Александър се поклонил пред Името на митрата на първосвещеника и му показали книгата на Даниил, която предсказвала, че грък ще унищожи Персийската империя. Повечето историци смятат разказа за легенда от по-късна епоха; сигурно е, че Самария въстанала срещу Александровия управител Андромах през 331 г. и била наказана, както съобщава Курций, и с това се съгласуват папирусите на бегълци, открити през 1962 г. в пещера в Уади ед-Далие, докато Юдея останала спокойна и запазила законите си."
    - "Виденията на Даниил се четели за тези години: ярецът, който „идеше от запад по лицето на всичката земя, и не се допираше до земята“ и счупил двата рога на овена — „царете на Мидия и на Персия“; ангелът обяснява, че „ярецът е царът Гръцки; и големий рог който е между очите му, той е първий цар“, и че когато големият рог се счупи, на мястото му израстват четири — както империята на Александър била разделена между пълководците му след смъртта му във Вавилон през 323 г. пр.н.е. Много тълкуватели четат и пророчеството на Захария срещу Тир, за който той казва, че Господ „ще порази в морето силата му“, и срещу Газа, където „ще погине царят“, като картина на похода от 332 г., макар други да датират главата по-рано. После Юдея принадлежала на египетските Птолемеи от 301 г. пр.н.е. и минала към Селевкидите след битката при Панион през 200 г. пр.н.е."
