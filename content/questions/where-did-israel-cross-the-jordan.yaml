id: where-did-israel-cross-the-jordan
question:
  en: "Where did Israel cross the Jordan?"
  ru: "Где Израиль перешёл Иордан?"
  uk: "Де Ізраїль перейшов Йордан?"
  es: "¿Dónde cruzó Israel el Jordán?"
  pt: "Onde Israel atravessou o Jordão?"
  de: "Wo überquerte Israel den Jordan?"
  fr: "Où Israël a-t-il passé le Jourdain ?"
answer:
  en:
    - "Opposite Jericho. The Book of Joshua says that the people came from Shittim to the river and “passed over right against Jericho”, and that they camped at Gilgal, “in the east border of Jericho”. The exact spot is not known. The map point stands on Gilgal at Khirbet el-Mefjir, about 2 km north-east of Tell es-Sultan, the mound of Jericho, and about 21 km in a straight line from Shittim, the last camp east of the river; Khirbet en-Nitla south-east of Jericho is the other usual candidate for Gilgal. Local tradition puts the crossing at the ford of Qasr al-Yahud, about 10 km south-east of the map point, where the baptism of Jesus is also remembered."
    - "The text describes the river stopping upstream: the waters “stood and rose up upon an heap very far from the city Adam, that is beside Zaretan”, while those flowing to the Dead Sea “failed, and were cut off”. Adam is identified with Tell ed-Damiyeh, near the mouth of the Jabbok, about 28 km north of Jericho in a straight line, and Zarethan with Tell es-Sa'idiyeh, 18 km further north. It was the spring harvest, when “Jordan overfloweth all his banks”, and the priests with the ark stood “on dry ground in the midst of Jordan” until all had crossed; twelve stones from the riverbed were set up at Gilgal, and in the fourth century Eusebius was shown them at the second mile from Jericho."
    - "How it happened is read in different ways. Many take it as a plain miracle; others note that the high marl banks near Damiyeh have collapsed and dammed the river for hours, as in the earthquake of 1927, and see God's hand in the timing. The date also divides scholars: the map follows the early chronology, about 1406 BC, forty years after an Exodus dated from 1 Kings 6:1, while many put Joshua in the thirteenth century BC or read the conquest story as later tradition. A psalm keeps it in one line: “Jordan was driven back”."
  ru:
    - "Против Иерихона. Книга Иисуса Навина говорит, что «двинулись они от Ситтима и пришли к Иордану», что «народ переходил против Иерихона» и что стан поставили в Галгале, «на восточной стороне Иерихона». Точное место неизвестно. Точка карты стоит на Галгале, в Хирбет-эль-Мефджире, примерно в 2 км к северо-востоку от Телль-эс-Султана, холма Иерихона, и примерно в 21 км по прямой от Ситтима, последнего стана к востоку от реки; другое обычное предположение для Галгала — Хирбет-эн-Нитла к юго-востоку от Иерихона. Местное предание помещает переход у брода Каср-эль-Яхуд, примерно в 10 км к юго-востоку от точки карты, где вспоминают и крещение Иисуса."
    - "Текст описывает, как река остановилась выше по течению: «вода, текущая сверху, остановилась и стала стеною на весьма большое расстояние, до города Адама, который подле Цартана», а вода, текущая в Мёртвое море, «ушла и иссякла». Адам отождествляют с Телль-эд-Дамией близ устья Иавока, примерно в 28 км к северу от Иерихона по прямой, а Цартан — с Телль-эс-Саидией, ещё в 18 км севернее. Была весенняя жатва, когда Иордан «выступает из всех берегов своих», и священники с ковчегом «стояли на суше среди Иордана», пока все не перешли; двенадцать камней из русла поставили в Галгале, и в IV веке Евсевию показывали их у второй мили от Иерихона."
    - "Как это произошло, понимают по-разному. Многие видят здесь прямое чудо; другие замечают, что высокие мергелевые берега у Дамии не раз обрушивались и на несколько часов перегораживали реку, как при землетрясении 1927 года, и видят руку Божию в самом времени события. Дата тоже разделяет учёных: карта следует ранней хронологии, около 1406 г. до н. э., через сорок лет после Исхода, датированного по 3 Цар 6:1, а многие относят Иисуса Навина к XIII веку до н. э. или считают рассказ о завоевании позднейшим преданием. Псалом хранит это событие в одной строке: «Иордан обратился назад»."
  uk:
    - "Навпроти Єрихону. Книга Ісуса Навина каже, що народ прийшов із Ситтіма до річки й «переходив навпроти Ерихона», а отаборився в Гілгалі, «на східній сторонї від Ерихону». Точне місце невідоме. Точка мапи стоїть на Гілгалі в Хірбет-ель-Мефджирі, приблизно за 2 км на північний схід від Тель-ес-Султана, пагорба Єрихону, і приблизно за 21 км по прямій від Ситтіма, останнього табору на схід від річки; Хірбет-ен-Нітла на південний схід від Єрихону — інший звичайний кандидат на Гілгал. Місцева традиція ставить перехід біля броду Каср-ель-Яхуд, приблизно за 10 км на південний схід від точки мапи, де також пам'ятають хрещення Ісуса."
    - "Текст описує, як річка зупинилася вище за течією: вода «стояла як мур аж до міста Адаму, та аж до Сартана», тоді як та, що йшла вниз до Мертвого моря, «стекла зовсїм». Адам ототожнюють із Тель-ед-Дамією, біля гирла Яббока, приблизно за 28 км на північ від Єрихону по прямій, а Цартан — із Тель-ес-Саїдією, ще на 18 км північніше. Це був час весняних жнив, коли «Йордань же виступає під жнива всюди з берегів своїх», і священики з ковчегом стояли «на суші посеред Йорданї», доки всі не перейшли; дванадцять каменів з русла було поставлено в Гілгалі, і в IV ст. Євсевію показали їх на другій милі від Єрихону."
    - "Як це сталося, читають по-різному. Багато хто вважає це простим дивом; інші зауважують, що високі мергелеві береги біля Дамії обвалювалися і запружували річку на години, як під час землетрусу 1927 р., і бачать руку Бога в часі. Дата також розділяє вчених: мапа йде за ранньою хронологією, близько 1406 р. до н. е., через сорок років після Виходу, датованого за 1 Цар 6:1, тоді як багато хто відносить Ісуса Навина до XIII ст. до н. е. або читає розповідь про завоювання як пізніше передання. Псалом зберігає це в одному рядку: «Йордан назад повернувся»."
  es:
    - "Frente a Jericó. El libro de Josué dice que el pueblo vino de Sitim al río y «pasó en derecho de Jericó», y que acamparon en Gilgal, «al lado oriental de Jericó». El lugar exacto no se conoce. El punto del mapa está en Gilgal, en Khirbet el-Mefjir, a unos 2 km al noreste de Tell es-Sultán, el tell de Jericó, y a unos 21 km en línea recta de Sitim, el último campamento al este del río; Khirbet en-Nitla, al sureste de Jericó, es el otro candidato habitual para Gilgal. La tradición local sitúa el cruce en el vado de Qasr al-Yahud, a unos 10 km al sureste del punto del mapa, donde se recuerda también el bautismo de Jesús."
    - "El texto describe que el río se detuvo aguas arriba: las aguas «se pararon como en un montón bien lejos de la ciudad de Adam, que está al lado de Sarethan», mientras que las que descendían hacia el mar Muerto «se acabaron y fueron partidas». Adam se identifica con Tell ed-Damiyeh, cerca de la desembocadura del Jaboc, a unos 28 km al norte de Jericó en línea recta, y Saretán con Tell es-Sa'idiyeh, 18 km más al norte. Era la cosecha de primavera, cuando «el Jordán suele reverter sobre todos sus bordes», y los sacerdotes con el arca «estuvieron en seco, firmes en medio del Jordán» hasta que todos hubieron pasado; doce piedras del lecho del río fueron erigidas en Gilgal, y en el siglo IV a Eusebio se las mostraron a la segunda milla de Jericó."
    - "Cómo ocurrió se lee de distintas maneras. Muchos lo toman por un milagro sin más; otros señalan que las altas orillas de marga cerca de Damiyeh se han derrumbado y han represado el río durante horas, como en el terremoto de 1927, y ven la mano de Dios en el momento. La fecha también divide a los estudiosos: el mapa sigue la cronología temprana, hacia el 1406 a. C., cuarenta años después de un Éxodo fechado a partir de 1 Reyes 6:1, mientras que muchos sitúan a Josué en el siglo XIII a. C. o leen el relato de la conquista como tradición posterior. Un salmo lo guarda en una línea: «el Jordán se volvió atrás»."
  pt:
    - "Em frente a Jericó. O livro de Josué diz que o povo veio de Sitim ao rio e “atravessou perto de Jericó”, e que acampou em Gilgal, “na fronteira leste de Jericó”. O local exato não se conhece. O ponto do mapa está em Gilgal, em Khirbet el-Mefjir, a cerca de 2 km a nordeste de Tell es-Sultan, o montículo de Jericó, e a cerca de 21 km em linha reta de Sitim, o último acampamento a leste do rio; Khirbet en-Nitla, a sudeste de Jericó, é o outro candidato usual a Gilgal. A tradição local põe a travessia no vau de Qasr al-Yahud, a cerca de 10 km a sudeste do ponto do mapa, onde se recorda também o batismo de Jesus."
    - "O texto descreve o rio parando a montante: as águas “pararam e se ergueram em um só monte muito longe dali, em Adã, a cidade que fica ao lado de Zaretã”, enquanto as que desciam para o mar Morto “foram totalmente cortadas”. Adã se identifica com Tell ed-Damiyeh, perto da foz do Jaboque, a cerca de 28 km ao norte de Jericó em linha reta, e Zaretã com Tell es-Sa'idiyeh, 18 km mais ao norte. Era a colheita da primavera, quando “o Jordão transborda por todas as suas margens”, e os sacerdotes com a arca ficaram “em terra seca no meio do Jordão” até todos atravessarem; doze pedras do leito foram erguidas em Gilgal, e no século IV mostraram-nas a Eusébio, a duas milhas de Jericó."
    - "Como aconteceu é lido de modos diferentes. Muitos o tomam por milagre simples; outros observam que as altas barrancas de marga perto de Damiyeh desabaram e represaram o rio por horas, como no terremoto de 1927, e veem a mão de Deus na hora. A data também divide os estudiosos: o mapa segue a cronologia alta, cerca de 1406 a.C., quarenta anos depois de um Êxodo datado a partir de 1 Reis 6:1, enquanto muitos põem Josué no século XIII a.C. ou leem a conquista como tradição posterior. Um salmo a guarda numa linha: “O Jordão retrocedeu”."
  de:
    - "Gegenüber von Jericho. Das Buch Josua sagt, das Volk sei von Schittim zum Fluss gekommen: „Also ging das Volk hinüber, Jericho gegenüber“; und es habe in Gilgal gelagert, „gegen Morgen vor der Stadt Jericho“. Die genaue Stelle ist nicht bekannt. Der Kartenpunkt liegt auf Gilgal bei Chirbet el-Mefdschir, etwa 2 km nordöstlich von Tell es-Sultan, dem Hügel von Jericho, und etwa 21 km Luftlinie von Schittim, dem letzten Lager östlich des Flusses; Chirbet en-Nitla südöstlich von Jericho ist der andere übliche Kandidat für Gilgal. Die örtliche Überlieferung setzt den Übergang an die Furt von Qasr el-Jahud, etwa 10 km südöstlich des Kartenpunkts, wo man sich auch an die Taufe Jesu erinnert."
    - "Der Text beschreibt, wie der Fluss weiter oben zum Stillstand kam: Das Wasser „stand ... aufgerichtet auf einem Haufen, sehr ferne, bei der Stadt Adam, die zur Seite Zarthans liegt“, während „das Wasser, das zum Meer hinunterlief, zum Salzmeer, das nahm ab und verfloß“. Adam wird mit Tell ed-Damije nahe der Jabbok-Mündung gleichgesetzt, in der Luftlinie etwa 28 km nördlich von Jericho, und Zaretan mit Tell es-Saidije, 18 km weiter nördlich. Es war die Erntezeit im Frühjahr: „der Jordan aber war voll an allen seinen Ufern“, und die Priester mit der Lade „standen still im Trockenen mitten im Jordan“, bis alle hinübergezogen waren; zwölf Steine aus dem Flussbett wurden in Gilgal aufgerichtet, und im 4. Jahrhundert wurden sie Eusebius an der zweiten Meile von Jericho gezeigt."
    - "Wie es geschah, wird verschieden gelesen. Viele nehmen es als schlichtes Wunder; andere weisen darauf hin, dass die hohen Mergelufer nahe Damije eingestürzt sind und den Fluss stundenlang aufgestaut haben, wie beim Erdbeben von 1927, und sehen in der Zeitwahl Gottes Hand. Auch das Datum spaltet die Gelehrten: Die Karte folgt der frühen Chronologie, um 1406 v. Chr., vierzig Jahre nach einem Auszug, der aus 1. Könige 6,1 datiert wird, während viele Josua ins 13. Jahrhundert v. Chr. setzen oder die Eroberungserzählung als spätere Überlieferung lesen. Ein Psalm bewahrt es in einer Zeile: „der Jordan wandte sich zurück“."
  fr:
    - "En face de Jéricho. Le livre de Josué dit que le peuple vint de Sittim au fleuve et « passa vis-à-vis de Jéricho », et qu’il campa à Guilgal, « à l’extrémité orientale de Jéricho ». Le lieu exact n’est pas connu. Le point de la carte est sur Guilgal, à Khirbet el-Mefjir, à environ 2 km au nord-est de Tell es-Sultan, le tertre de Jéricho, et à environ 21 km en ligne droite de Sittim, dernier campement à l’est du fleuve ; Khirbet en-Nitla, au sud-est de Jéricho, est l’autre candidat habituel pour Guilgal. La tradition locale place le passage au gué de Qasr al-Yahud, à environ 10 km au sud-est du point de la carte, où l’on se souvient aussi du baptême de Jésus."
    - "Le texte décrit le fleuve s’arrêtant en amont : les eaux « s’arrêtèrent, et s’élevèrent en un monceau, à une très grande distance, près de la ville d’Adam, qui est à côté de Tsarthan », tandis que celles qui descendaient vers la mer Salée « furent complètement coupées ». Adam s’identifie à Tell ed-Damiyeh, près de l’embouchure du Jabbok, à environ 28 km au nord de Jéricho en ligne droite, et Tsarthan à Tell es-Saïdiyeh, 18 km plus au nord. C’était la moisson de printemps, quand « le Jourdain regorge par-dessus toutes ses rives », et les prêtres portant l’arche s’arrêtèrent « de pied ferme sur le sec, au milieu du Jourdain » jusqu’à ce que tous aient passé ; douze pierres du lit du fleuve furent dressées à Guilgal, et au IVe siècle Eusèbe se les fit montrer au deuxième mille de Jéricho."
    - "On lit de diverses façons comment cela s’est produit. Beaucoup y voient un miracle pur et simple ; d’autres notent que les hautes berges de marne près de Damiyeh se sont effondrées et ont barré le fleuve pendant des heures, comme lors du séisme de 1927, et voient la main de Dieu dans le moment. La date divise aussi les savants : la carte suit la chronologie haute, vers 1406 av. J.-C., quarante ans après un Exode daté d’après 1 Rois 6:1, tandis que beaucoup placent Josué au XIIIe siècle av. J.-C. ou lisent le récit de la conquête comme une tradition tardive. Un psaume la garde en une ligne : « Le Jourdain retourna en arrière »."
