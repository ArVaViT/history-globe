id: where-did-israel-cross-the-jordan
question:
  en: "Where did Israel cross the Jordan?"
  ru: "Где Израиль перешёл Иордан?"
  uk: "Де Ізраїль перейшов Йордан?"
  es: "¿Dónde cruzó Israel el Jordán?"
  pt: "Onde Israel atravessou o Jordão?"
  de: "Wo überquerte Israel den Jordan?"
  fr: "Où Israël a-t-il passé le Jourdain ?"
  pl: "Gdzie Izrael przeszedł Jordan?"
  it: "Dove Israele attraversò il Giordano?"
  nl: "Waar stak Israël de Jordaan over?"
  cs: "Kde Izrael přešel Jordán?"
  sv: "Var gick Israel över Jordan?"
  nb: "Hvor krysset Israel Jordan?"
  tl: "Saan tumawid ang Israel sa Jordan?"
  da: "Hvor krydsede Israel Jordan?"
  sr: "Где је Израиљ прешао Јордан?"
answer:
  en:
    - "Opposite Jericho. The Book of Joshua says that the people came from Shittim to the river and “passed over right against Jericho”, and that they camped at Gilgal, “in the east border of Jericho”. The exact spot is not known. The map point stands on Gilgal at Khirbet el-Mefjir, about 2 km north-east of Tell es-Sultan, the mound of Jericho, and about 21 km in a straight line from Shittim, the last camp east of the river; Khirbet en-Nitla south-east of Jericho is the other usual candidate for Gilgal. Local tradition puts the crossing at the ford of Qasr al-Yahud, about 10 km south-east of the map point, where the baptism of Jesus is also remembered."
    - "The text describes the river stopping upstream: the waters “stood and rose up upon an heap very far from the city Adam, that is beside Zaretan”, while those flowing to the Dead Sea “failed, and were cut off”. Adam is identified with Tell ed-Damiyeh, near the mouth of the Jabbok, about 28 km north of Jericho in a straight line, and Zarethan with Tell es-Sa'idiyeh, 18 km further north. It was the spring harvest, when “Jordan overfloweth all his banks”, and the priests with the ark stood “on dry ground in the midst of Jordan” until all had crossed; twelve stones from the riverbed were set up at Gilgal, and in the fourth century Eusebius was shown them at the second mile from Jericho."
    - "How it happened is read in different ways. Many take it as a plain miracle; others note that the high marl banks near Damiyeh have collapsed and dammed the river for hours, as was reported after the earthquake of 1927, and see God's hand in the timing. The date also divides scholars: the map follows the early chronology, about 1406 BC, forty years after an Exodus dated from 1 Kings 6:1, while many put Joshua in the thirteenth century BC or read the conquest story as later tradition. A psalm keeps it in one line: “Jordan was driven back”."
  ru:
    - "Против Иерихона. Книга Иисуса Навина говорит, что «двинулись они от Ситтима и пришли к Иордану», что «народ переходил против Иерихона» и что стан поставили в Галгале, «на восточной стороне Иерихона». Точное место неизвестно. Точка карты стоит на Галгале, в Хирбет-эль-Мефджире, примерно в 2 км к северо-востоку от Телль-эс-Султана, холма Иерихона, и примерно в 21 км по прямой от Ситтима, последнего стана к востоку от реки; другое обычное предположение для Галгала — Хирбет-эн-Нитла к юго-востоку от Иерихона. Местное предание помещает переход у брода Каср-эль-Яхуд, примерно в 10 км к юго-востоку от точки карты, где вспоминают и крещение Иисуса."
    - "Текст описывает, как река остановилась выше по течению: «вода, текущая сверху, остановилась и стала стеною на весьма большое расстояние, до города Адама, который подле Цартана», а вода, текущая в Мёртвое море, «ушла и иссякла». Адам отождествляют с Телль-эд-Дамией близ устья Иавока, примерно в 28 км к северу от Иерихона по прямой, а Цартан — с Телль-эс-Саидией, ещё в 18 км севернее. Была весенняя жатва, когда Иордан «выступает из всех берегов своих», и священники с ковчегом «стояли на суше среди Иордана», пока все не перешли; двенадцать камней из русла поставили в Галгале, и в IV веке Евсевию показывали их у второй мили от Иерихона."
    - "Как это произошло, понимают по-разному. Многие видят здесь прямое чудо; другие замечают, что высокие мергелевые берега у Дамии не раз обрушивались и на несколько часов перегораживали реку, как сообщали после землетрясения 1927 года, и видят руку Божию в самом времени события. Дата тоже разделяет учёных: карта следует ранней хронологии, около 1406 г. до н. э., через сорок лет после Исхода, датированного по 3 Цар 6:1, а многие относят Иисуса Навина к XIII веку до н. э. или считают рассказ о завоевании позднейшим преданием. Псалом хранит это событие в одной строке: «Иордан обратился назад»."
  uk:
    - "Навпроти Єрихону. Книга Ісуса Навина каже, що народ прийшов із Ситтіма до річки й «переходив навпроти Ерихона», а отаборився в Гілгалі, «на східній сторонї від Ерихону». Точне місце невідоме. Точка мапи стоїть на Гілгалі в Хірбет-ель-Мефджирі, приблизно за 2 км на північний схід від Тель-ес-Султана, пагорба Єрихону, і приблизно за 21 км по прямій від Ситтіма, останнього табору на схід від річки; Хірбет-ен-Нітла на південний схід від Єрихону — інший звичайний кандидат на Гілгал. Місцева традиція ставить перехід біля броду Каср-ель-Яхуд, приблизно за 10 км на південний схід від точки мапи, де також пам'ятають хрещення Ісуса."
    - "Текст описує, як річка зупинилася вище за течією: вода «стояла як мур аж до міста Адаму, та аж до Сартана», тоді як та, що йшла вниз до Мертвого моря, «стекла зовсїм». Адам ототожнюють із Тель-ед-Дамією, біля гирла Яббока, приблизно за 28 км на північ від Єрихону по прямій, а Цартан — із Тель-ес-Саїдією, ще на 18 км північніше. Це був час весняних жнив, коли «Йордань же виступає під жнива всюди з берегів своїх», і священики з ковчегом стояли «на суші посеред Йорданї», доки всі не перейшли; дванадцять каменів з русла було поставлено в Гілгалі, і в IV ст. Євсевію показали їх на другій милі від Єрихону."
    - "Як це сталося, читають по-різному. Багато хто вважає це простим дивом; інші зауважують, що високі мергелеві береги біля Дамії обвалювалися і запружували річку на години, як повідомляли після землетрусу 1927 р., і бачать руку Бога в часі. Дата також розділяє вчених: мапа йде за ранньою хронологією, близько 1406 р. до н. е., через сорок років після Виходу, датованого за 1 Цар 6:1, тоді як багато хто відносить Ісуса Навина до XIII ст. до н. е. або читає розповідь про завоювання як пізніше передання. Псалом зберігає це в одному рядку: «Йордан назад повернувся»."
  es:
    - "Frente a Jericó. El libro de Josué dice que el pueblo vino de Sitim al río y «pasó en derecho de Jericó», y que acamparon en Gilgal, «al lado oriental de Jericó». El lugar exacto no se conoce. El punto del mapa está en Gilgal, en Khirbet el-Mefjir, a unos 2 km al noreste de Tell es-Sultán, el tell de Jericó, y a unos 21 km en línea recta de Sitim, el último campamento al este del río; Khirbet en-Nitla, al sureste de Jericó, es el otro candidato habitual para Gilgal. La tradición local sitúa el cruce en el vado de Qasr al-Yahud, a unos 10 km al sureste del punto del mapa, donde se recuerda también el bautismo de Jesús."
    - "El texto describe que el río se detuvo aguas arriba: las aguas «se pararon como en un montón bien lejos de la ciudad de Adam, que está al lado de Sarethan», mientras que las que descendían hacia el mar Muerto «se acabaron y fueron partidas». Adam se identifica con Tell ed-Damiyeh, cerca de la desembocadura del Jaboc, a unos 28 km al norte de Jericó en línea recta, y Saretán con Tell es-Sa'idiyeh, 18 km más al norte. Era la cosecha de primavera, cuando «el Jordán suele reverter sobre todos sus bordes», y los sacerdotes con el arca «estuvieron en seco, firmes en medio del Jordán» hasta que todos hubieron pasado; doce piedras del lecho del río fueron erigidas en Gilgal, y en el siglo IV a Eusebio se las mostraron a la segunda milla de Jericó."
    - "Cómo ocurrió se lee de distintas maneras. Muchos lo toman por un milagro sin más; otros señalan que las altas orillas de marga cerca de Damiyeh se han derrumbado y han represado el río durante horas, como se informó tras el terremoto de 1927, y ven la mano de Dios en el momento. La fecha también divide a los estudiosos: el mapa sigue la cronología temprana, hacia el 1406 a. C., cuarenta años después de un Éxodo fechado a partir de 1 Reyes 6:1, mientras que muchos sitúan a Josué en el siglo XIII a. C. o leen el relato de la conquista como tradición posterior. Un salmo lo guarda en una línea: «el Jordán se volvió atrás»."
  pt:
    - "Em frente a Jericó. O livro de Josué diz que o povo veio de Sitim ao rio e “atravessou perto de Jericó”, e que acampou em Gilgal, “na fronteira leste de Jericó”. O local exato não se conhece. O ponto do mapa está em Gilgal, em Khirbet el-Mefjir, a cerca de 2 km a nordeste de Tell es-Sultan, o montículo de Jericó, e a cerca de 21 km em linha reta de Sitim, o último acampamento a leste do rio; Khirbet en-Nitla, a sudeste de Jericó, é o outro candidato usual a Gilgal. A tradição local põe a travessia no vau de Qasr al-Yahud, a cerca de 10 km a sudeste do ponto do mapa, onde se recorda também o batismo de Jesus."
    - "O texto descreve o rio parando a montante: as águas “pararam e se ergueram em um só monte muito longe dali, em Adã, a cidade que fica ao lado de Zaretã”, enquanto as que desciam para o mar Morto “foram totalmente cortadas”. Adã se identifica com Tell ed-Damiyeh, perto da foz do Jaboque, a cerca de 28 km ao norte de Jericó em linha reta, e Zaretã com Tell es-Sa'idiyeh, 18 km mais ao norte. Era a colheita da primavera, quando “o Jordão transborda por todas as suas margens”, e os sacerdotes com a arca ficaram “em terra seca no meio do Jordão” até todos atravessarem; doze pedras do leito foram erguidas em Gilgal, e no século IV mostraram-nas a Eusébio, a duas milhas de Jericó."
    - "Como aconteceu é lido de modos diferentes. Muitos o tomam por milagre simples; outros observam que as altas barrancas de marga perto de Damiyeh desabaram e represaram o rio por horas, como se relatou após o terremoto de 1927, e veem a mão de Deus na hora. A data também divide os estudiosos: o mapa segue a cronologia alta, cerca de 1406 a.C., quarenta anos depois de um Êxodo datado a partir de 1 Reis 6:1, enquanto muitos põem Josué no século XIII a.C. ou leem a conquista como tradição posterior. Um salmo a guarda numa linha: “O Jordão retrocedeu”."
  de:
    - "Gegenüber von Jericho. Das Buch Josua sagt, das Volk sei von Schittim zum Fluss gekommen: „Also ging das Volk hinüber, Jericho gegenüber“; und es habe in Gilgal gelagert, „gegen Morgen vor der Stadt Jericho“. Die genaue Stelle ist nicht bekannt. Der Kartenpunkt liegt auf Gilgal bei Chirbet el-Mefdschir, etwa 2 km nordöstlich von Tell es-Sultan, dem Hügel von Jericho, und etwa 21 km Luftlinie von Schittim, dem letzten Lager östlich des Flusses; Chirbet en-Nitla südöstlich von Jericho ist der andere übliche Kandidat für Gilgal. Die örtliche Überlieferung setzt den Übergang an die Furt von Qasr el-Jahud, etwa 10 km südöstlich des Kartenpunkts, wo man sich auch an die Taufe Jesu erinnert."
    - "Der Text beschreibt, wie der Fluss weiter oben zum Stillstand kam: Das Wasser „stand ... aufgerichtet auf einem Haufen, sehr ferne, bei der Stadt Adam, die zur Seite Zarthans liegt“, während „das Wasser, das zum Meer hinunterlief, zum Salzmeer, das nahm ab und verfloß“. Adam wird mit Tell ed-Damije nahe der Jabbok-Mündung gleichgesetzt, in der Luftlinie etwa 28 km nördlich von Jericho, und Zaretan mit Tell es-Saidije, 18 km weiter nördlich. Es war die Erntezeit im Frühjahr: „der Jordan aber war voll an allen seinen Ufern“, und die Priester mit der Lade „standen still im Trockenen mitten im Jordan“, bis alle hinübergezogen waren; zwölf Steine aus dem Flussbett wurden in Gilgal aufgerichtet, und im 4. Jahrhundert wurden sie Eusebius an der zweiten Meile von Jericho gezeigt."
    - "Wie es geschah, wird verschieden gelesen. Viele nehmen es als schlichtes Wunder; andere weisen darauf hin, dass die hohen Mergelufer nahe Damije eingestürzt sind und den Fluss stundenlang aufgestaut haben, wie es nach dem Erdbeben von 1927 berichtet wurde, und sehen in der Zeitwahl Gottes Hand. Auch das Datum spaltet die Gelehrten: Die Karte folgt der frühen Chronologie, um 1406 v. Chr., vierzig Jahre nach einem Auszug, der aus 1. Könige 6,1 datiert wird, während viele Josua ins 13. Jahrhundert v. Chr. setzen oder die Eroberungserzählung als spätere Überlieferung lesen. Ein Psalm bewahrt es in einer Zeile: „der Jordan wandte sich zurück“."
  fr:
    - "En face de Jéricho. Le livre de Josué dit que le peuple vint de Sittim au fleuve et « passa vis-à-vis de Jéricho », et qu’il campa à Guilgal, « à l’extrémité orientale de Jéricho ». Le lieu exact n’est pas connu. Le point de la carte est sur Guilgal, à Khirbet el-Mefjir, à environ 2 km au nord-est de Tell es-Sultan, le tertre de Jéricho, et à environ 21 km en ligne droite de Sittim, dernier campement à l’est du fleuve ; Khirbet en-Nitla, au sud-est de Jéricho, est l’autre candidat habituel pour Guilgal. La tradition locale place le passage au gué de Qasr al-Yahud, à environ 10 km au sud-est du point de la carte, où l’on se souvient aussi du baptême de Jésus."
    - "Le texte décrit le fleuve s’arrêtant en amont : les eaux « s’arrêtèrent, et s’élevèrent en un monceau, à une très grande distance, près de la ville d’Adam, qui est à côté de Tsarthan », tandis que celles qui descendaient vers la mer Salée « furent complètement coupées ». Adam s’identifie à Tell ed-Damiyeh, près de l’embouchure du Jabbok, à environ 28 km au nord de Jéricho en ligne droite, et Tsarthan à Tell es-Saïdiyeh, 18 km plus au nord. C’était la moisson de printemps, quand « le Jourdain regorge par-dessus toutes ses rives », et les prêtres portant l’arche s’arrêtèrent « de pied ferme sur le sec, au milieu du Jourdain » jusqu’à ce que tous aient passé ; douze pierres du lit du fleuve furent dressées à Guilgal, et au IVe siècle Eusèbe se les fit montrer au deuxième mille de Jéricho."
    - "On lit de diverses façons comment cela s’est produit. Beaucoup y voient un miracle pur et simple ; d’autres notent que les hautes berges de marne près de Damiyeh se sont effondrées et ont barré le fleuve pendant des heures, comme on l’a rapporté après le séisme de 1927, et voient la main de Dieu dans le moment. La date divise aussi les savants : la carte suit la chronologie haute, vers 1406 av. J.-C., quarante ans après un Exode daté d’après 1 Rois 6:1, tandis que beaucoup placent Josué au XIIIe siècle av. J.-C. ou lisent le récit de la conquête comme une tradition tardive. Un psaume la garde en une ligne : « Le Jourdain retourna en arrière »."
  pl:
    - "Naprzeciw Jerycha. Księga Jozuego mówi, że lud przyszedł z Szittim nad rzekę, a „lud przeprawiał się przeciwko Jerychu”, i że obozował w Gilgal, „w Galgal ku stronie wschodniej Jerycha”. Dokładne miejsce nie jest znane. Punkt na mapie stoi na Gilgal w Chirbet el-Mefdżir, około 2 km na północny wschód od Tell es-Sultan, kopca Jerycha, i około 21 km w linii prostej od Szittim, ostatniego obozu na wschód od rzeki; Chirbet en-Nitla na południowy wschód od Jerycha to drugi zwykły kandydat na Gilgal. Miejscowa tradycja umieszcza przeprawę na brodzie Kasr al-Jahud, około 10 km na południowy wschód od punktu na mapie, gdzie wspomina się też chrzest Jezusa."
    - "Tekst opisuje zatrzymanie rzeki w górze jej biegu: wody „stanęły w jednej kupie bardzo daleko od Adama, miasta, które jest ku stronie Sartan”, a te, które płynęły do Morza Martwego, „zginęły i ustały”. Adam utożsamia się z Tell ed-Damija, blisko ujścia Jabok, około 28 km na północ od Jerycha w linii prostej, a Sartan z Tell es-Saidija, 18 km dalej na północ. Były wiosenne żniwa, gdy „Jordan wzbiera i wylewa na wszystkie brzegi swoje”, a kapłani z arką „stali na suszy w pośród Jordanu”, aż wszyscy przeszli; dwanaście kamieni z dna rzeki ustawiono w Gilgal, a w IV wieku pokazano je Euzebiuszowi w drugiej mili od Jerycha."
    - "Jak do tego doszło, odczytuje się różnie. Wielu uważa to za zwykły cud; inni zauważają, że wysokie margliste brzegi koło Damiji osunęły się i na wiele godzin zatamowały rzekę, jak donoszono po trzęsieniu ziemi w 1927, i widzą rękę Boga w chwili zdarzenia. Data też dzieli uczonych: mapa idzie za wczesną chronologią, około 1406 p.n.e., czterdzieści lat po Wyjściu datowanym z 1 Krl 6,1, podczas gdy wielu umieszcza Jozuego w XIII wieku p.n.e. albo uważa opowieść o podboju za późniejszą tradycję. Psalm zachowuje to w jednym wersie: „Jordan wrócił się nazad”."
  it:
    - "Di fronte a Gerico. Il libro di Giosuè dice che il popolo venne da Sittim al fiume e «passò dirimpetto a Gerico», e che si accampò a Gàlgala, «all’estremità orientale di Gerico». Il punto esatto non è noto. Il punto della mappa si trova a Gàlgala, a Khirbet el-Mefjir, a circa 2 km a nord-est di Tell es-Sultan, il tumulo di Gerico, e a circa 21 km in linea retta da Sittim, l’ultimo accampamento a est del fiume; Khirbet en-Nitla a sud-est di Gerico è l’altro candidato abituale per Gàlgala. La tradizione locale pone l’attraversamento al guado di Qasr al-Yahud, a circa 10 km a sud-est del punto della mappa, dove si ricorda anche il battesimo di Gesù."
    - "Il testo descrive il fiume che si ferma a monte: le acque «si fermarono e si elevarono in un mucchio, a una grandissima distanza, fin presso la città di Adam che è allato di Tsartan», mentre quelle che scendevano verso il Mar Morto «furono interamente separate da esse». Adam è identificata con Tell ed-Damiyeh, presso la foce dello Iabbok, a circa 28 km a nord di Gerico in linea retta, e Sartan con Tell es-Sa’idiyeh, 18 km più a nord. Era il raccolto di primavera, quando «il Giordano straripa da per tutto durante tutto il tempo della mèsse», e i sacerdoti con l’arca «stettero a piè fermo sull’asciutto, in mezzo al Giordano» finché tutti ebbero attraversato; dodici pietre dal letto del fiume furono rizzate a Gàlgala, e nel IV secolo a Eusebio furono mostrate al secondo miglio da Gerico."
    - "Il modo in cui avvenne è letto in modi diversi. Molti lo considerano un semplice miracolo; altri notano che le alte rive di marna presso Damiyeh sono crollate e hanno sbarrato il fiume per ore, come fu riferito dopo il terremoto del 1927, e vedono la mano di Dio nella tempistica. Anche la data divide gli studiosi: la mappa segue la cronologia alta, circa il 1406 a.C., quarant’anni dopo un Esodo datato da 1 Re 6,1, mentre molti collocano Giosuè nel XIII secolo a.C. o leggono il racconto della conquista come tradizione posteriore. Un salmo lo conserva in una riga: «il Giordano tornò addietro»."
  nl:
    - "Tegenover Jericho. Het boek Jozua zegt dat het volk van Sittim naar de rivier kwam; “toen trok het volk over, tegenover Jericho”. Daarna kampeerden zij te Gilgal, “aan het oosteinde van Jericho”. De precieze plek is niet bekend. Het punt op de kaart staat op Gilgal bij Khirbet el-Mefjir, ongeveer 2 km ten noordoosten van Tell es-Sultan, de heuvel van Jericho, en hemelsbreed ongeveer 21 km van Sittim, het laatste kamp ten oosten van de rivier; Khirbet en-Nitla ten zuidoosten van Jericho is de andere gebruikelijke kandidaat voor Gilgal. De lokale overlevering plaatst de oversteek bij de voorde van Qasr al-Yahud, ongeveer 10 km ten zuidoosten van het punt op de kaart, waar ook de doop van Jezus wordt herdacht."
    - "De tekst beschrijft hoe de rivier stroomopwaarts stilviel: de wateren “stonden … zij rezen op een hoop, zeer verre van de stad Adam af, die ter zijde van Sarthan ligt”, terwijl die naar de Dode Zee afliepen, “vergingen, zij werden afgesneden”. Adam wordt gelijkgesteld met Tell ed-Damiyeh, bij de monding van de Jabbok, hemelsbreed ongeveer 28 km ten noorden van Jericho, en Zaretan met Tell es-Sa’idiyeh, 18 km verder naar het noorden. Het was de oogst van de lente: “de Jordaan nu was vol al de dagen des oogstes aan al haar oevers”, en de priesters met de ark “stonden steevast op het droge, in het midden van de Jordaan” totdat allen waren overgestoken; twaalf stenen uit de rivierbedding werden te Gilgal opgericht, en in de vierde eeuw kreeg Eusebius ze te zien bij de tweede mijlpaal vanaf Jericho."
    - "Hoe het gebeurde, wordt op verschillende manieren gelezen. Velen nemen het als een zuiver wonder; anderen wijzen erop dat de hoge mergeloevers bij Damiyeh zijn ingestort en de rivier uren hebben afgedamd, zoals na de aardbeving van 1927 werd gemeld, en zien Gods hand in de timing. Ook de datum verdeelt de geleerden: de kaart volgt de vroege chronologie, omstreeks 1406 v.Chr., veertig jaar na een uittocht gedateerd vanaf 1 Koningen 6:1, terwijl velen Jozua in de 13e eeuw v.Chr. plaatsen of het verhaal van de verovering als latere overlevering lezen. Een psalm bewaart het in één regel: “de Jordaan keerde achterwaarts”."
  cs:
    - "Naproti Jerichu. Kniha Jozue praví, že lid přišel od Šitimu k řece a „lid přešel naproti Jerichu“ a že se utábořili v Gilgalu, kde „položili se v Galgala k straně východní Jericha“. Přesné místo není známo. Bod na mapě stojí na Gilgalu v Chirbet al-Mafdžir, asi 2 km severovýchodně od Tell es-Sultánu, pahorku Jericha, a asi 21 km vzdušnou čarou od Šitimu, posledního tábora východně od řeky; Chirbet an-Nitla jihovýchodně od Jericha je druhým obvyklým kandidátem na Gilgal. Místní tradice klade přechod k brodu Qasr al-Jahúd, asi 10 km jihovýchodně od bodu na mapě, kde se vzpomíná i křest Ježíšův."
    - "Text popisuje zastavení řeky proti proudu: vody „shrnuly se v hromadu jednu velmi daleko od Adam města, kteréž leží k straně Sartan“, zatímco ty, které odtékaly k Mrtvému moři, „k moři slanému sešly a sběhly“. Adam je ztotožňován s Tell ad-Damíja, poblíž ústí Jabboku, asi 28 km severně od Jericha vzdušnou čarou, a Caretan s Tell as-Sa'ídíja, o 18 km dále na sever. Bylo jarní žně, kdy se Jordán „rozvodňuje se a vystupuje ze všech břehů svých“, a kněží s truhlou stáli „na suše u prostřed Jordánu“, dokud lid všechen nepřešel; dvanáct kamenů z koryta bylo postaveno v Gilgalu a ve 4. století je Eusebiovi ukázali u druhé míle od Jericha."
    - "Jak se to stalo, se čte různě. Mnozí v tom vidí prostý zázrak; jiní poznamenávají, že vysoké slínové břehy u Damíje se zřítily a zahradily řeku na hodiny, jak se uvádělo po zemětřesení roku 1927, a vidí Boží ruku v načasování. Datum také dělí badatele: mapa sleduje raný počet, asi 1406 př. n. l., čtyřicet let po exodu datovaném z 1Kr 6,1, zatímco mnozí kladou Jozue do 13. století př. n. l. nebo čtou příběh o dobytí jako pozdější tradici. Žalm to uchovává v jediném řádku: „Jordán nazpět se obrátil“."
  sv:
    - "Mitt emot Jeriko. Josuas bok säger att folket kom från Shittim till floden och ”gick över mitt emot Jeriko”, och att de lägrade sig i Gilgal, ”på gränsen av östra Jerikoområdet”. Den exakta platsen är inte känd. Kartpunkten står på Gilgal vid Khirbet el-Mefjir, omkring 2 km nordost om Tell es-Sultan, Jerikos kulle, och omkring 21 km fågelvägen från Shittim, det sista lägret öster om floden; Khirbet en-Nitla sydost om Jeriko är den andra vanliga kandidaten för Gilgal. Lokal tradition förlägger övergången till vadstället Qasr al-Yahud, omkring 10 km sydost om kartpunkten, där man också minns Jesu dop."
    - "Texten beskriver hur floden stannade uppströms: vattnet ”blev stående såsom en samlad hög långt borta, uppe vid Adam, staden som ligger bredvid Saretan”, medan det som flöt ned mot Döda havet ”blev sålunda helt och hållet avskuret”. Adam identifieras med Tell ed-Damiyeh, nära Jabboks mynning, omkring 28 km norr om Jeriko fågelvägen, och Saretan med Tell es-Sa'idiyeh, 18 km längre norrut. Det var vårskörden, då Jordan är ”under hela skördetiden full över alla sina bräddar”, och prästerna med arken stod ”på torr mark mitt i Jordan” tills alla hade kommit över; tolv stenar ur flodbädden restes i Gilgal, och på 300-talet visades de för Eusebios vid andra milstolpen från Jeriko."
    - "Hur det gick till läses på olika sätt. Många tar det som ett rent under; andra noterar att de höga märgelbankarna nära Damiyeh har rasat och dämt upp floden i timmar, som rapporterades efter jordbävningen 1927, och ser Guds hand i tidpunkten. Dateringen delar också forskarna: kartan följer den tidiga kronologin, omkring 1406 f.Kr., fyrtio år efter ett uttåg daterat från 1 Kung 6:1, medan många förlägger Josua till 1200-talet f.Kr. eller läser erövringsberättelsen som senare tradition. En psalm bevarar det i en enda rad: ”Jordan vände tillbaka”."
  nb:
    - "Midt imot Jeriko. Josvas bok sier at folket kom fra Sjittim til elven og «gikk over midt imot Jeriko», og at de slo leir ved Gilgal, «lengst mot øst i landet omkring Jeriko». Det nøyaktige stedet er ikke kjent. Kartpunktet står på Gilgal ved Khirbet el-Mefjir, omtrent 2 km nordøst for Tell es-Sultan, haugen Jeriko, og omtrent 21 km i luftlinje fra Sjittim, den siste leiren øst for elven; Khirbet en-Nitla sørøst for Jeriko er den andre vanlige kandidaten for Gilgal. Lokal tradisjon plasserer overgangen ved vadestedet Qasr al-Yahud, omtrent 10 km sørøst for kartpunktet, der Jesu dåp også minnes."
    - "Teksten beskriver at elven stanset oppstrøms: vannet «stod som en vegg langt borte, ved byen Adam, som ligger tett ved Sartan», mens det som rant ned mot Dødehavet, «løp helt bort». Adam identifiseres med Tell ed-Damiyeh, nær utløpet av Jabbok, omtrent 28 km nord for Jeriko i luftlinje, og Saretan med Tell es-Sa'idiyeh, 18 km lenger nord. Det var vårhøsten, da «Jordan gikk over alle sine bredder hele høsttiden igjennem», og prestene med arken «stod på tørr grunn midt i Jordan» til alle var over; tolv steiner fra elveleiet ble reist ved Gilgal, og på 300-tallet ble Eusebius vist dem to romerske mil fra Jeriko."
    - "Hvordan det skjedde, leses ulikt. Mange tar det som et rent mirakel; andre peker på at de høye mergelbreddene nær Damiyeh har rast sammen og demmet opp elven i timevis, slik det ble meldt etter jordskjelvet i 1927, og ser Guds hånd i tidspunktet. Dateringen deler også forskerne: kartet følger den tidlige kronologien, omkring 1406 f.Kr., førti år etter et uttog datert fra 1 Kong 6,1, mens mange setter Josva til 1200-tallet f.Kr. eller leser erobringsfortellingen som senere tradisjon. En salme holder det fast i én linje: «Jordan vendte om og løp tilbake»."
  tl:
    - "Sa tapat ng Jerico. Sinasabi ng Aklat ni Josue na ang bayan ay nagmula sa Sittim hanggang sa ilog at “tumawid sa tapat ng Jerico”, at nagkampo sa Gilgal, “sa hangganang silanganan ng Jerico”. Hindi alam ang eksaktong lugar. Ang tuldok sa mapa ay nasa Gilgal sa Khirbet el-Mefjir, mga 2 km sa hilagang-silangan ng Tell es-Sultan, ang burol ng Jerico, at mga 21 km sa tuwid na guhit mula sa Sittim, ang huling kampo sa silangan ng ilog; ang Khirbet en-Nitla sa timog-silangan ng Jerico ang isa pang karaniwang kandidato para sa Gilgal. Inilalagay ng lokal na tradisyon ang pagtawid sa tawiran ng Qasr al-Yahud, mga 10 km sa timog-silangan ng tuldok sa mapa, kung saan inaalala rin ang bautismo ni Jesus."
    - "Inilalarawan ng teksto ang paghinto ng ilog sa itaas: ang tubig ay “tumigil, at nagisang bunton na malayo sa kanila, sa Adam, na bayang nasa tabi ng Sarethan”, samantalang ang umaagos patungo sa Dagat na Patay ay “lubos na nahawi”. Ang Adam ay kinikilala sa Tell ed-Damiyeh, malapit sa bukana ng Jaboc, mga 28 km sa hilaga ng Jerico sa tuwid na guhit, at ang Sarethan sa Tell es-Sa'idiyeh, 18 km pa sa hilaga. Panahon iyon ng anihan sa tagsibol, nang “inaapawan ng Jordan ang lahat niyang pangpang”, at ang mga saserdote na may kaban ay tumayo “sa tuyong lupa sa gitna ng Jordan” hanggang makatawid ang lahat; ang labindalawang bato mula sa higaan ng ilog ay itinayo sa Gilgal, at noong ikaapat na siglo ay ipinakita ang mga ito kay Eusebio sa ikalawang milya mula sa Jerico."
    - "Iba-iba ang pagbasa kung paano ito nangyari. Itinuturing ito ng marami na payak na himala; binabanggit naman ng iba na gumuho ang matataas na pampang ng marl malapit sa Damiyeh at hinarangan ang ilog nang ilang oras, gaya ng iniulat pagkatapos ng lindol noong 1927, at nakikita ang kamay ng Dios sa tiyempo. Hati rin ang mga iskolar sa petsa: sinusunod ng mapa ang maagang kronolohiya, mga 1406 BK, apatnapung taon pagkatapos ng Exodo na itinakda mula sa 1 Mga Hari 6:1, samantalang inilalagay ng marami si Josue sa ikalabintatlong siglo BK o binabasa ang kuwento ng pananakop bilang huling tradisyon. Iningatan ito ng isang awit sa isang linya: “ang Jordan ay napaurong”."
  da:
    - "Over for Jeriko. Josvabogen siger, at folket kom fra Sjittim til floden, og at »saa gik Folket over imod Jeriko«, og at de slog lejr i Gilgal, »paa Østgrænsen af Jerikos Landemærke«. Det nøjagtige sted er ukendt. Kortets punkt står på Gilgal ved Khirbet el-Mefjir, omkring 2 km nordøst for Tell es-Sultan, Jerikos høj, og omkring 21 km i luftlinje fra Sjittim, den sidste lejr øst for floden; Khirbet en-Nitla sydøst for Jeriko er den anden sædvanlige kandidat til Gilgal. Lokal tradition placerer overgangen ved vadestedet Qasr al-Yahud, omkring 10 km sydøst for kortets punkt, hvor Jesu dåb også erindres."
    - "Teksten beskriver, hvordan floden standsede opstrøms: vandet »rejste sig til een Dynge saare langt borte ved den Stad Adam, som ligger op til Zarthans Side«, mens det, der løb ned til Det Døde Hav, »blev aldeles afskaaret«. Adam identificeres med Tell ed-Damiyeh nær Jabboks munding, omkring 28 km nord for Jeriko i luftlinje, og Saretan med Tell es-Sa'idiyeh, 18 km længere mod nord. Det var forårshøsten, da »Jordanen var fuld over alle sine Bredder hele Høsten igennem«, og præsterne med arken »stode fast paa det tørre, midt i Jordanen«, indtil alle var kommet over; tolv sten fra flodlejet blev rejst i Gilgal, og i 300-tallet blev Eusebius vist dem ved den anden romerske mil fra Jeriko."
    - "Hvordan det skete, læses forskelligt. Mange tager det som et rent mirakel; andre bemærker, at de høje mergelbredder ved Damiyeh er styrtet sammen og har opdæmmet floden i timevis, som det blev rapporteret efter jordskælvet i 1927, og ser Guds hånd i timingen. Dateringen deler også forskerne: kortet følger den tidlige kronologi, omkring 1406 f.Kr., fyrre år efter en udvandring dateret ud fra 1 Kong 6,1, mens mange placerer Josva i 1200-tallet f.Kr. eller læser erobringsfortællingen som senere tradition. En salme bevarer det i én linje: »Jordanen vendte om og løb tilbage«."
  sr:
    - "Наспрам Јерихона. Књига Исуса Навина каже да је народ дошао од Ситима до реке, па: „народ прелажаше према Јерихону“, и да су се улогорили у Галгалу, „с истока Јерихону“. Тачно место није познато. Тачка на карти стоји на Галгалу у Хирбет ел Мефџиру, око 2 км североисточно од Тел ес Султана, хумке Јерихона, и око 21 км правом линијом од Ситима, последњег логора источно од реке; Хирбет ен Нитла југоисточно од Јерихона други је уобичајени кандидат за Галгал. Локално предање смешта прелаз на газ Каср ел Јахуд, око 10 км југоисточно од тачке на карти, где се памти и крштење Исусово."
    - "Текст описује како се река зауставља узводно: „заустави се вода што је текла одозго, и стаде у једну гомилу врло надалеко, код града Адама, који је крај Заретана“, док је она што је текла доле у море „отече сасвим“. Адам се поистовећује с Тел ед Дамијом, близу ушћа Јабока, око 28 км северно од Јерихона правом линијом, а Заретан с Тел ес Саидијом, 18 км даље на север. Била је пролећна жетва, кад је, како стоји, Јордан „пун преко брегова својих за све време жетве“, а свештеници с ковчегом „стајаху на сувом усред Јордана“ док сви нису прешли; дванаест камена из корита реке постављено је у Галгалу, а у 4. веку Јевсевију су их показали на другој миљи од Јерихона."
    - "Како се то догодило, чита се на различите начине. Многи то узимају као просто чудо; други примећују да су се високе лапорне обале близу Дамије урушиле и преградиле реку на сате, као што је забележено после земљотреса 1927, и виде Божју руку у тренутку. И датум дели научнике: карта прати рану хронологију, око 1406. п. н. е., четрдесет година после Изласка датираног из Прве књиге о царевима 6,1, док многи Исуса Навина стављају у 13. век п. н. е. или причу о освајању читају као каснију предају. Један псалам га чува у једном реду: „Јордан се обрати натраг“."
