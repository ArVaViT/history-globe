id: where-did-naaman-bathe
question:
  en: "Where did Naaman bathe?"
  ru: "Где омывался Нееман?"
  uk: "Де купався Нееман?"
  es: "¿Dónde se bañó Naamán?"
  pt: "Onde Naamã se lavou?"
  de: "Wo badete Naaman?"
  fr: "Où Naaman s’est-il baigné ?"
answer:
  en:
    - "In the Jordan, the river that runs from the Sea of Galilee down to the Dead Sea; the text names no spot on its banks. The map point for the river stands near Jericho, about 67 km from Samaria in a straight line; the text does not say to which reach of the river Naaman drove from Elisha's door."
    - "Naaman, “captain of the host of the king of Syria”, was a leper; a captive Israelite girl told his wife of “the prophet that is in Samaria”, and he came with his horses and chariot to the door of Elisha's house, where a servant told him: “Go and wash in Jordan seven times, and thy flesh shall come again to thee, and thou shalt be clean.” He was angry: “Are not Abana and Pharpar, rivers of Damascus, better than all the waters of Israel?” His servants talked him round, and he “dipped himself seven times in Jordan, according to the saying of the man of God: and his flesh came again like unto the flesh of a little child”. Jesus recalled the story at Nazareth: of all the lepers in Israel in Elisha's day, “none of them was cleansed, saving Naaman the Syrian”."
    - "Naaman's rivers are real. The Abana is the Barada, which rises in the Anti-Lebanon and makes Damascus an oasis; the Pharpar is usually taken as the Awaj, south of the city. Both are clear mountain streams, while the Jordan below Galilee is a muddy, winding river in a hot trench below sea level; Damascus is about 205 km in a straight line from the map point on the Jordan near Jericho, so the prophet's cure sent a great man a long way to a poor river. Naaman asked for two mules' burden of earth to take home, meaning to worship Israel's God on Israel's soil in Damascus."
  ru:
    - "В Иордане — реке, что течёт от Галилейского моря к Мёртвому; места на её берегу текст не называет. Точка карты для реки стоит у Иерихона, примерно в 67 км от Самарии по прямой; к какому участку реки Нееман поехал от дверей Елисея, текст не говорит."
    - "Нееман, «военачальник царя Сирийского», был прокажённым; пленная израильтянка сказала его жене, что ему надо бы побывать «у пророка, который в Самарии», и он приехал на конях и колеснице к дому Елисея, где слуга передал ему: «пойди, омойся семь раз в Иордане, и обновится тело твое у тебя, и будешь чист». Он разгневался: «разве Авана и Фарфар, реки Дамасские, не лучше всех вод Израильских?» Слуги его уговорили, и он «окунулся в Иордане семь раз, по слову человека Божия, и обновилось тело его, как тело малого ребенка». Иисус вспомнил эту историю в Назарете: из всех прокажённых Израиля при Елисее «ни один из них не очистился, кроме Неемана Сириянина»."
    - "Реки Неемана настоящие. Авана — это Барада, которая берёт начало в Антиливане и делает Дамаск оазисом; Фарфар обычно отождествляют с Аваджем к югу от города. Обе — прозрачные горные реки, тогда как Иордан ниже Галилеи — мутная извилистая река в жаркой впадине ниже уровня моря; от Дамаска до точки карты на Иордане у Иерихона около 205 км по прямой, так что пророк послал вельможу далеко, к неказистой реке. Нееман попросил земли, сколько снесут два лошака, чтобы поклоняться Богу Израиля на земле Израиля в Дамаске."
  uk:
    - "У Йордані, річці, що тече від Галілейського моря до Мертвого; текст не називає місця на її берегах. Точка мапи для річки стоїть поблизу Єрихону, приблизно за 67 км від Самарії по прямій; текст не каже, до якого відтинка річки Нееман поїхав від дверей Єлисея."
    - "Нееман, «гетьман царя Сирийського», був прокажений; полонена ізраїльська дівчинка розповіла його дружині про «пророка, що в Самариї», і він приїхав зі своїми кіньми й колісницею до дверей дому Єлисея, де слуга сказав йому: «Ійди та викупайся сїм раз у Йорданї, так тїло твоє знов посьвіжіє й будеш чистим». Він розгнівався: «Чи то ж ріки Дамаські, Абана та Фарфар не лучші, нїж води в Йорданї?» Слуги вмовили його, і він «пійшов … та й викупавсь сїм раз у Йорданї, поринаючи, як звелїв чоловік Божий, й осьвіжіло тїло його, як у молодого хлопця, і він очистивсь». Ісус згадав цю історію в Назареті: з усіх прокажених в Ізраїлі за днів Єлисея «жоден з них не очистивсь, тільки Неєман Сириянин»."
    - "Нееманові ріки справжні. Авана — це Барада, що бере початок в Антилівані і робить Дамаск оазою; Фарфар зазвичай ототожнюють з Авадж, на південь від міста. Обидві — чисті гірські потоки, тоді як Йордан нижче Галілеї — каламутна звивиста річка в гарячому рові нижче рівня моря; Дамаск лежить приблизно за 205 км по прямій від точки мапи на Йордані поблизу Єрихону, тож зцілення пророка послало великого чоловіка далеко до бідної річки. Нееман попросив землі на два мули, щоб узяти додому, маючи намір поклонятися Богові Ізраїлю на ізраїльській землі в Дамаску."
  es:
    - "En el Jordán, el río que corre del mar de Galilea al mar Muerto; el texto no nombra ningún lugar de sus orillas. El punto del mapa para el río está cerca de Jericó, a unos 67 km de Samaria en línea recta; el texto no dice a qué tramo del río fue Naamán desde la puerta de Eliseo."
    - "Naamán, «general del ejército del rey de Siria», era leproso; una muchacha israelita cautiva habló a su mujer de «el profeta que está en Samaria», y él llegó con sus caballos y su carro a la puerta de la casa de Eliseo, donde un mensajero le dijo: «Ve, y lávate siete veces en el Jordán, y tu carne se te restaurará, y serás limpio». Se enojó: «Abana y Pharphar, ríos de Damasco, ¿no son mejores que todas las aguas de Israel?». Sus criados lo persuadieron, y «zambullóse siete veces en el Jordán, conforme á la palabra del varón de Dios: y su carne se volvió como la carne de un niño». Jesús recordó la historia en Nazaret: de todos los leprosos de Israel en tiempos de Eliseo, «ninguno de ellos fué limpio, sino Naamán el Siro»."
    - "Los ríos de Naamán son reales. El Abana es el Barada, que nace en el Antilíbano y hace de Damasco un oasis; el Farfar suele tomarse por el Awaj, al sur de la ciudad. Ambos son arroyos de montaña claros, mientras que el Jordán por debajo de Galilea es un río fangoso y sinuoso en una fosa calurosa bajo el nivel del mar; Damasco está a unos 205 km en línea recta del punto del mapa en el Jordán, cerca de Jericó, de modo que la curación del profeta mandó a un gran hombre un largo camino hasta un río pobre. Naamán pidió la carga de dos mulas de tierra para llevarla a casa, con la intención de adorar al Dios de Israel en suelo de Israel en Damasco."
  pt:
    - "No Jordão, o rio que corre do mar da Galileia até o mar Morto; o texto não nomeia nenhum ponto de suas margens. O ponto do mapa para o rio fica perto de Jericó, a cerca de 67 km de Samaria em linha reta; o texto não diz a que trecho do rio Naamã foi desde a porta de Eliseu."
    - "Naamã, “comandante do exército do rei da Síria”, era leproso; uma menina israelita cativa falou à mulher dele de “o profeta que está em Samaria”, e ele veio com seus cavalos e carros à porta da casa de Eliseu, onde um mensageiro lhe disse: “Vá e lave-se no Jordão sete vezes, e a sua carne será restaurada, e você ficará limpo.” Ele se indignou: “Não são Abana e Farfar, os rios de Damasco, melhores do que todas as águas de Israel?” Seus servos o persuadiram, e ele “mergulhou sete vezes no Jordão, conforme a palavra do homem de Deus; e a sua carne foi restaurada como a carne de uma criança pequena”. Jesus lembrou a história em Nazaré: de todos os leprosos de Israel no tempo de Eliseu, “nenhum deles foi purificado, senão Naamã, o sírio”."
    - "Os rios de Naamã são reais. O Abana é o Barada, que nasce no Anti-Líbano e faz de Damasco um oásis; o Farfar costuma ser tomado pelo Awaj, ao sul da cidade. Ambos são ribeiros de montanha limpos, enquanto o Jordão abaixo da Galileia é um rio barrento e sinuoso numa fossa quente abaixo do nível do mar; Damasco fica a cerca de 205 km em linha reta do ponto do mapa no Jordão perto de Jericó, de modo que a cura do profeta mandou um grande homem longe, a um rio pobre. Naamã pediu “a carga de terra de duas mulas” para levar para casa, pretendendo adorar o Deus de Israel em solo de Israel, em Damasco."
  de:
    - "Im Jordan, dem Fluss, der vom See Genezareth hinab zum Toten Meer fließt; der Text nennt keine Stelle an seinen Ufern. Der Kartenpunkt für den Fluss liegt bei Jericho, in der Luftlinie etwa 67 km von Samaria; der Text sagt nicht, zu welchem Flussabschnitt Naaman von Elisas Tür aus fuhr."
    - "Naaman, „der Feldhauptmann des Königs von Syrien“, war aussätzig; ein gefangenes israelitisches Mädchen sagte seiner Frau von „dem Propheten zu Samaria“, und er kam mit Rossen und Wagen zur Tür von Elisas Haus, wo ihm ein Bote sagen ließ: „Gehe hin und wasche dich siebenmal im Jordan, so wird dir dein Fleisch wieder erstattet und rein werden.“ Er wurde zornig: „Sind nicht die Wasser Amana und Pharphar zu Damaskus besser denn alle Wasser in Israel?“ Seine Knechte redeten ihm zu, und er „taufte sich im Jordan siebenmal, wie der Mann Gottes geredet hatte; und sein Fleisch ward wieder erstattet wie das Fleisch eines jungen Knaben“. Jesus erinnerte in Nazareth an die Geschichte: Von allen Aussätzigen Israels zu Elisas Zeiten „deren keiner wurde gereinigt denn allein Naeman aus Syrien“."
    - "Naamans Flüsse sind wirklich. Der Abana ist der Barada, der im Antilibanon entspringt und Damaskus zur Oase macht; der Parpar gilt meist als der Awadsch, südlich der Stadt. Beide sind klare Bergbäche, während der Jordan unterhalb Galiläas ein trüber, gewundener Fluss in einem heißen Graben unter dem Meeresspiegel ist; Damaskus ist in der Luftlinie etwa 205 km vom Kartenpunkt am Jordan bei Jericho entfernt, die Heilung des Propheten schickte also einen großen Mann weit zu einem armen Fluss. Naaman erbat zwei Maultierlasten Erde für zu Hause, um Israels Gott auf israelitischem Boden in Damaskus anzubeten."
  fr:
    - "Dans le Jourdain, le fleuve qui coule de la mer de Galilée à la mer Morte ; le texte ne nomme aucun lieu sur ses rives. Le point de la carte pour le fleuve se trouve près de Jéricho, à environ 67 km de Samarie en ligne droite ; le texte ne dit pas à quel tronçon du fleuve Naaman se rendit depuis la porte d’Élisée."
    - "Naaman, « chef de l’armée du roi de Syrie », était lépreux ; une petite captive israélite parla à sa femme du « prophète qui est à Samarie », et il vint avec ses chevaux et son char à la porte de la maison d’Élisée, où un messager lui dit : « Va, et lave-toi sept fois dans le Jourdain ; ta chair redeviendra saine, et tu seras pur. » Il s’irrita : « Les fleuves de Damas, l’Abana et le Parpar, ne valent-ils pas mieux que toutes les eaux d’Israël ? » Ses serviteurs le persuadèrent, et « il descendit alors et se plongea sept fois dans le Jourdain, selon la parole de l’homme de Dieu ; et sa chair redevint comme la chair d’un jeune enfant ». Jésus rappela l’histoire à Nazareth : de tous les lépreux d’Israël du temps d’Élisée, « aucun d’eux ne fut purifié, si ce n’est Naaman le Syrien »."
    - "Les fleuves de Naaman sont réels. L’Abana est le Barada, qui naît dans l’Anti-Liban et fait de Damas une oasis ; le Parpar est d’ordinaire pris pour l’Awaj, au sud de la ville. Tous deux sont des torrents de montagne limpides, alors que le Jourdain en aval de la Galilée est un fleuve boueux et sinueux dans une fosse chaude sous le niveau de la mer ; Damas est à environ 205 km en ligne droite du point de la carte sur le Jourdain près de Jéricho, de sorte que la guérison prescrite par le prophète envoya un grand homme très loin vers un pauvre fleuve. Naaman demanda de la terre, une charge de deux mulets, à emporter chez lui, voulant adorer le Dieu d’Israël sur la terre d’Israël, à Damas."
