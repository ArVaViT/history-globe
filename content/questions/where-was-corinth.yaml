id: where-was-corinth
question:
  en: "Where was Corinth?"
  ru: "Где находился Коринф?"
  uk: "Де був Коринт?"
  es: "¿Dónde estaba Corinto?"
  pt: "Onde ficava Corinto?"
  de: "Wo lag Korinth?"
  fr: "Où se trouvait Corinthe ?"
answer:
  en:
    - "Corinth stands in Greece at the isthmus that joins the Peloponnese to the mainland, below the rock of Acrocorinth, about 75 km west of Athens in a straight line (88 km by the road on the map) and about 1,315 km from Jerusalem. It had a harbour on each sea, Lechaeum on the Gulf of Corinth and Cenchreae on the Saronic Gulf, and ships were hauled across the isthmus on a paved way."
    - '"After these things Paul departed from Athens, and came to Corinth", where he lodged with Aquila and Priscilla, tentmakers lately expelled from Rome by Claudius. "And he continued there a year and six months, teaching the word of God among them." The Jews brought him before the proconsul Gallio, who refused to judge the case; an inscription at Delphi dates Gallio''s year of office to 51–52, one of the firmest dates in Paul''s life. Paul wrote two letters to the church, and Romans was probably written from Corinth: it commends Phoebe of Cenchreae.'
    - "Corinth was a rich trading city from the seventh century BC. In 146 BC the Romans under Mummius sacked it, put most of those found there to the sword and sold the women and children, and the site lay desolate until Julius Caesar founded a Roman colony there in 44 BC, settled largely with freedmen; it became the seat of the proconsul of Achaia. Nero began a canal through the isthmus in AD 67, but the work was abandoned. About AD 96 the church of Rome wrote to the Corinthians the letter known as 1 Clement."
  ru:
    - "Коринф стоит в Греции у перешейка, соединяющего Пелопоннес с материком, под скалой Акрокоринфа, примерно в 75 км к западу от Афин по прямой (88 км по дороге на карте) и примерно в 1315 км от Иерусалима. У него было по гавани на каждом море — Лехей на Коринфском заливе и Кенхреи на Сароническом, а корабли перетаскивали через перешеек по мощёному волоку."
    - "«После сего Павел, оставив Афины, пришел в Коринф», где поселился у Акилы и Прискиллы, делателей палаток, недавно изгнанных из Рима Клавдием. «И он оставался там год и шесть месяцев, поучая их слову Божию». Иудеи привели его на суд к проконсулу Галлиону, но тот отказался судить; надпись в Дельфах датирует год проконсульства Галлиона 51–52 гг., и это одна из самых твёрдых дат в жизни Павла. Павел написал церкви два послания, а Послание к Римлянам, вероятно, написано в Коринфе: в нём он представляет Фиву из Кенхрей."
    - "Коринф был богатым торговым городом с VII века до н. э. В 146 г. до н. э. римляне под началом Муммия разграбили его, большую часть застигнутых в городе предали мечу, а женщин и детей продали в рабство, и место лежало в запустении, пока Юлий Цезарь не основал здесь в 44 г. до н. э. римскую колонию, заселённую в основном вольноотпущенниками; Коринф стал резиденцией проконсула Ахаии. В 67 г. н. э. Нерон начал прорывать канал через перешеек, но работу бросили. Около 96 г. н. э. римская церковь написала коринфянам послание, известное как Первое послание Климента."
  uk:
    - "Коринт стоїть у Греції на перешийку, що з'єднує Пелопоннес з материком, під скелею Акрокорінфа, приблизно за 75 км на захід від Афін по прямій (88 км дорогою на мапі) і приблизно за 1315 км від Єрусалиму. Він мав гавань на кожному морі, Лехей на Коринфській затоці й Кенхреї на Сароніській, а кораблі перетягали через перешийок по вимощеному шляху."
    - "«Після сього, покинувши Павел Атини, прийшов у Коринт», де він оселився в Акили й Прискилли, наметників, нещодавно вигнаних Клавдієм із Рима. «І пробував там рік і шість місяцїв, навчаючи між ними слова Божого». Євреї привели його перед проконсула Галліона, який відмовився судити справу; напис у Дельфах датує рік перебування Галліона на посаді 51–52, що є однією з найтвердіших дат у житті Павла. Павло написав церкві два послання, а Послання до римлян було, ймовірно, написане з Коринта: воно рекомендує Фиву з Кенхреїв."
    - "Коринт був багатим торговим містом із VII ст. до н. е. 146 р. до н. е. римляни під проводом Муммія розграбували його, вбили мечем більшість тих, кого там знайшли, і продали жінок та дітей, і місце лежало пустим, доки Юлій Цезар не заснував там римську колонію 44 р. до н. е., заселену здебільшого вільновідпущениками; він став резиденцією проконсула Ахаї. Нерон почав канал крізь перешийок 67 р. н. е., але роботу покинули. Близько 96 р. н. е. церква Рима написала коринтянам послання, відоме як 1 Климента."
  es:
    - "Corinto se alza en Grecia, en el istmo que une el Peloponeso con el continente, bajo la roca del Acrocorinto, a unos 75 km al oeste de Atenas en línea recta (88 km por el camino del mapa) y a unos 1315 km de Jerusalén. Tenía un puerto en cada mar, Lequeo en el golfo de Corinto y Cencreas en el golfo Sarónico, y los barcos eran arrastrados a través del istmo por una vía pavimentada."
    - "«Pasadas estas cosas, Pablo partió de Atenas, y vino á Corinto», donde se alojó con Aquila y Priscila, fabricantes de tiendas recién expulsados de Roma por Claudio. «Y se detuvo allí un año y seis meses, enseñándoles la palabra de Dios». Los judíos lo llevaron ante el procónsul Galión, que se negó a juzgar el caso; una inscripción de Delfos fecha el año de cargo de Galión en 51–52, una de las fechas más firmes de la vida de Pablo. Pablo escribió dos cartas a la iglesia, y Romanos se escribió probablemente desde Corinto: recomienda a Febe de Cencreas."
    - "Corinto fue una rica ciudad comercial desde el siglo VII a. C. En el 146 a. C. los romanos, bajo Mummio, la saquearon, pasaron a cuchillo a casi todos los que hallaron en ella y vendieron a las mujeres y los niños, y el lugar quedó desolado hasta que Julio César fundó allí una colonia romana en el 44 a. C., poblada en buena parte con libertos; llegó a ser la sede del procónsul de Acaya. Nerón comenzó un canal a través del istmo en el 67 d. C., pero la obra fue abandonada. Hacia el 96 d. C. la iglesia de Roma escribió a los corintios la carta conocida como 1 Clemente."
  pt:
    - "Corinto fica na Grécia, no istmo que liga o Peloponeso ao continente, sob a rocha do Acrocorinto, a cerca de 75 km a oeste de Atenas em linha reta (88 km pela estrada do mapa) e a cerca de 1.315 km de Jerusalém. Tinha um porto em cada mar, Lecaion no golfo de Corinto e Cencreia no golfo Sarônico, e os navios eram arrastados através do istmo por uma via pavimentada."
    - "“Depois destas coisas, Paulo partiu de Atenas e chegou a Corinto”, onde se hospedou com Áquila e Priscila, fabricantes de tendas há pouco expulsos de Roma por Cláudio. “Ele morou ali um ano e seis meses, ensinando a palavra de Deus entre eles.” Os judeus o levaram ao procônsul Gálio, que recusou julgar o caso; uma inscrição de Delfos data o ano de cargo de Gálio em 51–52, uma das datas mais firmes da vida de Paulo. Paulo escreveu duas cartas à igreja, e Romanos foi provavelmente escrita de Corinto: recomenda Febe, de Cencreia."
    - "Corinto foi uma rica cidade comercial desde o século VII a.C. Em 146 a.C. os romanos sob Múmio a saquearam, passaram à espada a maioria dos que ali encontraram e venderam as mulheres e crianças, e o local jazeu desolado até que Júlio César ali fundou em 44 a.C. uma colônia romana, povoada em grande parte por libertos; tornou-se a sede do procônsul da Acaia. Nero começou um canal através do istmo em 67 d.C., mas a obra foi abandonada. Por volta de 96 d.C. a igreja de Roma escreveu aos coríntios a carta conhecida como 1 Clemente."
  de:
    - "Korinth liegt in Griechenland an der Landenge, die die Peloponnes mit dem Festland verbindet, unter dem Felsen Akrokorinth, in der Luftlinie etwa 75 km westlich von Athen (88 km auf der Straße der Karte) und etwa 1315 km von Jerusalem. Es hatte an jedem Meer einen Hafen, Lechaion am Golf von Korinth und Kenchreä am Saronischen Golf, und Schiffe wurden auf einem gepflasterten Weg über die Landenge gezogen."
    - "„Darnach schied Paulus von Athen und kam gen Korinth“, wo er bei Aquila und Priscilla wohnte, Zeltmachern, die Klaudius kürzlich aus Rom ausgewiesen hatte. „Er saß aber daselbst ein Jahr und sechs Monate und lehrte das Wort Gottes.“ Die Juden brachten ihn vor den Prokonsul Gallio, der es ablehnte, den Fall zu richten; eine Inschrift in Delphi datiert Gallios Amtsjahr auf 51–52, eines der festesten Daten im Leben des Paulus. Paulus schrieb der Gemeinde zwei Briefe, und der Römerbrief wurde wohl in Korinth geschrieben: Er empfiehlt Phöbe von Kenchreä."
    - "Korinth war seit dem 7. Jahrhundert v. Chr. eine reiche Handelsstadt. 146 v. Chr. plünderten es die Römer unter Mummius, töteten die meisten dort Angetroffenen mit dem Schwert und verkauften Frauen und Kinder, und die Stätte lag öde, bis Julius Caesar dort 44 v. Chr. eine römische Kolonie gründete, großenteils mit Freigelassenen besiedelt; sie wurde Sitz des Prokonsuls von Achaja. Nero begann 67 n. Chr. einen Kanal durch die Landenge, doch die Arbeit wurde aufgegeben. Um 96 n. Chr. schrieb die Gemeinde von Rom den Korinthern den als 1. Clemensbrief bekannten Brief."
  fr:
    - "Corinthe se dresse en Grèce sur l’isthme qui relie le Péloponnèse au continent, sous le rocher de l’Acrocorinthe, à environ 75 km à l’ouest d’Athènes en ligne droite (88 km par la route de la carte) et à environ 1 315 km de Jérusalem. Elle avait un port sur chaque mer, Léchaion sur le golfe de Corinthe et Cenchrées sur le golfe Saronique, et les navires étaient halés à travers l’isthme sur une voie pavée."
    - "« Après cela, Paul partit d’Athènes, et se rendit à Corinthe », où il logea chez Aquilas et Priscille, faiseurs de tentes récemment expulsés de Rome par Claude. « Il y demeura un an et six mois, enseignant parmi les Corinthiens la parole de Dieu. » Les Juifs l’amenèrent devant le proconsul Gallion, qui refusa de juger l’affaire ; une inscription de Delphes date l’année de charge de Gallion de 51–52, l’une des dates les plus fermes de la vie de Paul. Paul écrivit deux lettres à l’Église, et Romains fut probablement écrite de Corinthe : elle recommande Phœbé de Cenchrées."
    - "Corinthe était une riche cité marchande dès le VIIe siècle av. J.-C. En 146 av. J.-C., les Romains sous Mummius la mirent à sac, passèrent par l’épée la plupart de ceux qu’ils y trouvèrent et vendirent les femmes et les enfants, et le site resta désert jusqu’à ce que Jules César y fonde une colonie romaine en 44 av. J.-C., peuplée surtout d’affranchis ; elle devint le siège du proconsul d’Achaïe. Néron commença un canal à travers l’isthme en 67 apr. J.-C., mais le travail fut abandonné. Vers 96 apr. J.-C., l’Église de Rome écrivit aux Corinthiens la lettre connue comme 1 Clément."
