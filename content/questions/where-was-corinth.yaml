id: where-was-corinth
question:
  en: "Where was Corinth?"
  ru: "Где находился Коринф?"
  uk: "Де був Коринт?"
  es: "¿Dónde estaba Corinto?"
  pt: "Onde ficava Corinto?"
  de: "Wo lag Korinth?"
  fr: "Où se trouvait Corinthe ?"
  pl: "Gdzie leżał Korynt?"
  it: "Dov’era Corinto?"
  nl: "Waar lag Korinthe?"
  cs: "Kde byl Korint?"
  sv: "Var låg Korinth?"
  nb: "Hvor lå Korint?"
  tl: "Saan ang Corinto?"
  da: "Hvor lå Korinth?"
  sr: "Где је био Коринт?"
  hu: "Hol volt Korinthus?"
  fi: "Missä Korintti oli?"
  vi: "Cô-rinh-tô ở đâu?"
  ro: "Unde se afla Corintul?"
  bg: "Къде се е намирал Коринт?"
answer:
  en:
    - "Corinth stands in Greece at the isthmus that joins the Peloponnese to the mainland, below the rock of Acrocorinth, about 75 km west of Athens in a straight line (88 km by the road on the map) and about 1,315 km from Jerusalem. It had a harbour on each sea, Lechaeum on the Gulf of Corinth and Cenchreae on the Saronic Gulf, and ships were hauled across the isthmus on a paved way."
    - '"After these things Paul departed from Athens, and came to Corinth", where he lodged with Aquila and Priscilla, tentmakers lately expelled from Rome by Claudius. "And he continued there a year and six months, teaching the word of God among them." The Jews brought him before the proconsul Gallio, who refused to judge the case; an inscription at Delphi dates Gallio''s year of office to 51–52, one of the firmest dates in Paul''s life. Paul wrote two letters to the church, and Romans was probably written from Corinth: it commends Phoebe of Cenchreae.'
    - "Corinth was a rich trading city from the seventh century BC. In 146 BC the Romans under Mummius sacked it, put most of those found there to the sword and sold the women and children, and the site lay desolate until Julius Caesar founded a Roman colony there in 44 BC, settled largely with freedmen; it became the seat of the proconsul of Achaia. Nero began a canal through the isthmus in AD 67, but the work was abandoned. About AD 96 the church of Rome wrote to the Corinthians the letter known as 1 Clement."
  ru:
    - "Коринф стоит в Греции у перешейка, соединяющего Пелопоннес с материком, под скалой Акрокоринфа, примерно в 75 км к западу от Афин по прямой (88 км по дороге на карте) и примерно в 1315 км от Иерусалима. У него было по гавани на каждом море — Лехей на Коринфском заливе и Кенхреи на Сароническом, а корабли перетаскивали через перешеек по мощёному волоку."
    - "«После сего Павел, оставив Афины, пришел в Коринф», где поселился у Акилы и Прискиллы, делателей палаток, недавно изгнанных из Рима Клавдием. «И он оставался там год и шесть месяцев, поучая их слову Божию». Иудеи привели его на суд к проконсулу Галлиону, но тот отказался судить; надпись в Дельфах датирует год проконсульства Галлиона 51–52 гг., и это одна из самых твёрдых дат в жизни Павла. Павел написал церкви два послания, а Послание к Римлянам, вероятно, написано в Коринфе: в нём он представляет Фиву из Кенхрей."
    - "Коринф был богатым торговым городом с VII века до н. э. В 146 г. до н. э. римляне под началом Муммия разграбили его, большую часть застигнутых в городе предали мечу, а женщин и детей продали в рабство, и место лежало в запустении, пока Юлий Цезарь не основал здесь в 44 г. до н. э. римскую колонию, заселённую в основном вольноотпущенниками; Коринф стал резиденцией проконсула Ахаии. В 67 г. н. э. Нерон начал прорывать канал через перешеек, но работу бросили. Около 96 г. н. э. римская церковь написала коринфянам послание, известное как Первое послание Климента."
  uk:
    - "Коринт стоїть у Греції на перешийку, що з'єднує Пелопоннес з материком, під скелею Акрокорінфа, приблизно за 75 км на захід від Афін по прямій (88 км дорогою на мапі) і приблизно за 1315 км від Єрусалиму. Він мав гавань на кожному морі, Лехей на Коринфській затоці й Кенхреї на Сароніській, а кораблі перетягали через перешийок по вимощеному шляху."
    - "«Після сього, покинувши Павел Атини, прийшов у Коринт», де він оселився в Акили й Прискилли, наметників, нещодавно вигнаних Клавдієм із Рима. «І пробував там рік і шість місяцїв, навчаючи між ними слова Божого». Євреї привели його перед проконсула Галліона, який відмовився судити справу; напис у Дельфах датує рік перебування Галліона на посаді 51–52, що є однією з найтвердіших дат у житті Павла. Павло написав церкві два послання, а Послання до римлян було, ймовірно, написане з Коринта: воно рекомендує Фиву з Кенхреїв."
    - "Коринт був багатим торговим містом із VII ст. до н. е. 146 р. до н. е. римляни під проводом Муммія розграбували його, вбили мечем більшість тих, кого там знайшли, і продали жінок та дітей, і місце лежало пустим, доки Юлій Цезар не заснував там римську колонію 44 р. до н. е., заселену здебільшого вільновідпущениками; він став резиденцією проконсула Ахаї. Нерон почав канал крізь перешийок 67 р. н. е., але роботу покинули. Близько 96 р. н. е. церква Рима написала коринтянам послання, відоме як 1 Климента."
  es:
    - "Corinto se alza en Grecia, en el istmo que une el Peloponeso con el continente, bajo la roca del Acrocorinto, a unos 75 km al oeste de Atenas en línea recta (88 km por el camino del mapa) y a unos 1315 km de Jerusalén. Tenía un puerto en cada mar, Lequeo en el golfo de Corinto y Cencreas en el golfo Sarónico, y los barcos eran arrastrados a través del istmo por una vía pavimentada."
    - "«Pasadas estas cosas, Pablo partió de Atenas, y vino á Corinto», donde se alojó con Aquila y Priscila, fabricantes de tiendas recién expulsados de Roma por Claudio. «Y se detuvo allí un año y seis meses, enseñándoles la palabra de Dios». Los judíos lo llevaron ante el procónsul Galión, que se negó a juzgar el caso; una inscripción de Delfos fecha el año de cargo de Galión en 51–52, una de las fechas más firmes de la vida de Pablo. Pablo escribió dos cartas a la iglesia, y Romanos se escribió probablemente desde Corinto: recomienda a Febe de Cencreas."
    - "Corinto fue una rica ciudad comercial desde el siglo VII a. C. En el 146 a. C. los romanos, bajo Mummio, la saquearon, pasaron a cuchillo a casi todos los que hallaron en ella y vendieron a las mujeres y los niños, y el lugar quedó desolado hasta que Julio César fundó allí una colonia romana en el 44 a. C., poblada en buena parte con libertos; llegó a ser la sede del procónsul de Acaya. Nerón comenzó un canal a través del istmo en el 67 d. C., pero la obra fue abandonada. Hacia el 96 d. C. la iglesia de Roma escribió a los corintios la carta conocida como 1 Clemente."
  pt:
    - "Corinto fica na Grécia, no istmo que liga o Peloponeso ao continente, sob a rocha do Acrocorinto, a cerca de 75 km a oeste de Atenas em linha reta (88 km pela estrada do mapa) e a cerca de 1.315 km de Jerusalém. Tinha um porto em cada mar, Lecaion no golfo de Corinto e Cencreia no golfo Sarônico, e os navios eram arrastados através do istmo por uma via pavimentada."
    - "“Depois destas coisas, Paulo partiu de Atenas e chegou a Corinto”, onde se hospedou com Áquila e Priscila, fabricantes de tendas há pouco expulsos de Roma por Cláudio. “Ele morou ali um ano e seis meses, ensinando a palavra de Deus entre eles.” Os judeus o levaram ao procônsul Gálio, que recusou julgar o caso; uma inscrição de Delfos data o ano de cargo de Gálio em 51–52, uma das datas mais firmes da vida de Paulo. Paulo escreveu duas cartas à igreja, e Romanos foi provavelmente escrita de Corinto: recomenda Febe, de Cencreia."
    - "Corinto foi uma rica cidade comercial desde o século VII a.C. Em 146 a.C. os romanos sob Múmio a saquearam, passaram à espada a maioria dos que ali encontraram e venderam as mulheres e crianças, e o local jazeu desolado até que Júlio César ali fundou em 44 a.C. uma colônia romana, povoada em grande parte por libertos; tornou-se a sede do procônsul da Acaia. Nero começou um canal através do istmo em 67 d.C., mas a obra foi abandonada. Por volta de 96 d.C. a igreja de Roma escreveu aos coríntios a carta conhecida como 1 Clemente."
  de:
    - "Korinth liegt in Griechenland an der Landenge, die die Peloponnes mit dem Festland verbindet, unter dem Felsen Akrokorinth, in der Luftlinie etwa 75 km westlich von Athen (88 km auf der Straße der Karte) und etwa 1315 km von Jerusalem. Es hatte an jedem Meer einen Hafen, Lechaion am Golf von Korinth und Kenchreä am Saronischen Golf, und Schiffe wurden auf einem gepflasterten Weg über die Landenge gezogen."
    - "„Darnach schied Paulus von Athen und kam gen Korinth“, wo er bei Aquila und Priscilla wohnte, Zeltmachern, die Klaudius kürzlich aus Rom ausgewiesen hatte. „Er saß aber daselbst ein Jahr und sechs Monate und lehrte das Wort Gottes.“ Die Juden brachten ihn vor den Prokonsul Gallio, der es ablehnte, den Fall zu richten; eine Inschrift in Delphi datiert Gallios Amtsjahr auf 51–52, eines der festesten Daten im Leben des Paulus. Paulus schrieb der Gemeinde zwei Briefe, und der Römerbrief wurde wohl in Korinth geschrieben: Er empfiehlt Phöbe von Kenchreä."
    - "Korinth war seit dem 7. Jahrhundert v. Chr. eine reiche Handelsstadt. 146 v. Chr. plünderten es die Römer unter Mummius, töteten die meisten dort Angetroffenen mit dem Schwert und verkauften Frauen und Kinder, und die Stätte lag öde, bis Julius Caesar dort 44 v. Chr. eine römische Kolonie gründete, großenteils mit Freigelassenen besiedelt; sie wurde Sitz des Prokonsuls von Achaja. Nero begann 67 n. Chr. einen Kanal durch die Landenge, doch die Arbeit wurde aufgegeben. Um 96 n. Chr. schrieb die Gemeinde von Rom den Korinthern den als 1. Clemensbrief bekannten Brief."
  fr:
    - "Corinthe se dresse en Grèce sur l’isthme qui relie le Péloponnèse au continent, sous le rocher de l’Acrocorinthe, à environ 75 km à l’ouest d’Athènes en ligne droite (88 km par la route de la carte) et à environ 1 315 km de Jérusalem. Elle avait un port sur chaque mer, Léchaion sur le golfe de Corinthe et Cenchrées sur le golfe Saronique, et les navires étaient halés à travers l’isthme sur une voie pavée."
    - "« Après cela, Paul partit d’Athènes, et se rendit à Corinthe », où il logea chez Aquilas et Priscille, faiseurs de tentes récemment expulsés de Rome par Claude. « Il y demeura un an et six mois, enseignant parmi les Corinthiens la parole de Dieu. » Les Juifs l’amenèrent devant le proconsul Gallion, qui refusa de juger l’affaire ; une inscription de Delphes date l’année de charge de Gallion de 51–52, l’une des dates les plus fermes de la vie de Paul. Paul écrivit deux lettres à l’Église, et Romains fut probablement écrite de Corinthe : elle recommande Phœbé de Cenchrées."
    - "Corinthe était une riche cité marchande dès le VIIe siècle av. J.-C. En 146 av. J.-C., les Romains sous Mummius la mirent à sac, passèrent par l’épée la plupart de ceux qu’ils y trouvèrent et vendirent les femmes et les enfants, et le site resta désert jusqu’à ce que Jules César y fonde une colonie romaine en 44 av. J.-C., peuplée surtout d’affranchis ; elle devint le siège du proconsul d’Achaïe. Néron commença un canal à travers l’isthme en 67 apr. J.-C., mais le travail fut abandonné. Vers 96 apr. J.-C., l’Église de Rome écrivit aux Corinthiens la lettre connue comme 1 Clément."
  pl:
    - "Korynt leży w Grecji na przesmyku łączącym Peloponez z lądem stałym, pod skałą Akrokorynt, około 75 km na zachód od Aten w linii prostej (88 km drogą z mapy) i około 1315 km od Jerozolimy. Miał port nad każdym z mórz, Lechajon na Zatoce Korynckiej i Kenchreę na Zatoce Sarońskiej, a statki przeciągano przez przesmyk brukowaną drogą."
    - "„Potem Paweł odszedłszy z Aten, przyszedł do Koryntu”, gdzie zamieszkał u Akwili i Pryscylli, wytwórców namiotów, niedawno wypędzonych z Rzymu przez Klaudiusza. „I mieszkał tam rok i sześć miesięcy, nauczając u nich słowa Bożego.” Żydzi stawili go przed prokonsulem Gallionem, który odmówił osądzenia sprawy; napis w Delfach datuje rok urzędowania Galliona na 51–52, jedną z najpewniejszych dat w życiu Pawła. Paweł napisał dwa listy do tego Kościoła, a List do Rzymian został prawdopodobnie napisany w Koryncie: poleca Febę z Kenchrei."
    - "Korynt był bogatym miastem handlowym od VII wieku p.n.e. W 146 p.n.e. Rzymianie pod wodzą Mummiusza złupili go, większość znalezionych tam ludzi wycięli w pień, a kobiety i dzieci sprzedali, i miejsce leżało w pustce, aż Juliusz Cezar założył tam w 44 p.n.e. rzymską kolonię, zasiedloną w znacznej mierze wyzwoleńcami; stał się siedzibą prokonsula Achai. Neron rozpoczął kanał przez przesmyk w 67 n.e., ale pracę porzucono. Około 96 n.e. Kościół w Rzymie napisał do Koryntian list znany jako 1 List Klemensa."
  it:
    - "Corinto sorge in Grecia sull’istmo che unisce il Peloponneso alla terraferma, sotto la rupe dell’Acrocorinto, a circa 75 km a ovest di Atene in linea retta (88 km lungo la strada della mappa) e a circa 1.315 km da Gerusalemme. Aveva un porto su ciascun mare, Lecheo sul golfo di Corinto e Cencre sul golfo Saronico, e le navi erano trascinate attraverso l’istmo su una via lastricata."
    - "«Dopo queste cose egli, partitosi da Atene, venne a Corinto», dove alloggiò presso Aquila e Priscilla, fabbricanti di tende da poco espulsi da Roma da Claudio. «Ed egli dimorò quivi un anno e sei mesi, insegnando fra loro la parola di Dio». I Giudei lo condussero davanti al proconsole Gallione, che rifiutò di giudicare il caso; un’iscrizione a Delfi data l’anno di carica di Gallione al 51–52, una delle date più salde della vita di Paolo. Paolo scrisse due lettere alla chiesa, e Romani fu probabilmente scritta da Corinto: raccomanda Febe di Cencre."
    - "Corinto fu una ricca città commerciale dal VII secolo a.C. Nel 146 a.C. i Romani sotto Mummio la saccheggiarono, passarono a fil di spada la maggior parte di quelli che vi trovarono e vendettero donne e bambini, e il sito giacque desolato finché Giulio Cesare vi fondò una colonia romana nel 44 a.C., popolata in gran parte di liberti; divenne la sede del proconsole d’Acaia. Nerone iniziò un canale attraverso l’istmo nel 67 d.C., ma l’opera fu abbandonata. Intorno al 96 d.C. la chiesa di Roma scrisse ai Corinzi la lettera nota come 1 Clemente."
  nl:
    - "Korinthe ligt in Griekenland op de landengte die de Peloponnesos met het vasteland verbindt, onder de rots van Acrocorinthe, hemelsbreed ongeveer 75 km ten westen van Athene (88 km langs de weg op de kaart) en ongeveer 1.315 km van Jeruzalem. Het had een haven aan elke zee, Lechaion aan de Golf van Korinthe en Kenchreeën aan de Saronische Golf, en schepen werden over een bestraat pad over de landengte getrokken."
    - "“Scheidde Paulus van Athene en kwam te Korinthe”, waar hij logeerde bij Aquila en Priscilla, tentenmakers die kort tevoren door Claudius uit Rome waren verdreven. “En hij onthield zich aldaar een jaar en zes maanden, lerende onder hen het Woord Gods.” De Joden brachten hem voor de proconsul Gallio, die weigerde de zaak te beoordelen; een inscriptie te Delphi dateert Gallio’s ambtsjaar in 51–52, een van de vaste data in Paulus’ leven. Paulus schreef twee brieven aan de gemeente, en Romeinen werd waarschijnlijk uit Korinthe geschreven: het beveelt Febe van Kenchreeën aan."
    - "Korinthe was vanaf de zevende eeuw v.Chr. een rijke handelsstad. In 146 v.Chr. plunderden de Romeinen onder Mummius haar, doodden de meesten die er werden gevonden en verkochten de vrouwen en kinderen, en de plek lag woest tot Julius Caesar er in 44 v.Chr. een Romeinse kolonie stichtte, grotendeels bevolkt met vrijgelatenen; zij werd de zetel van de proconsul van Achaja. Nero begon in 67 n.Chr. een kanaal door de landengte, maar het werk werd gestaakt. Omstreeks 96 n.Chr. schreef de gemeente van Rome aan de Korinthiërs de brief die bekendstaat als 1 Clemens."
  cs:
    - "Korint leží v Řecku na šíji, která spojuje Peloponés s pevninou, pod skalou Akrokorintu, asi 75 km západně od Atén vzdušnou čarou (88 km po silnici na mapě) a asi 1 315 km od Jeruzaléma. Měl přístav na každém moři, Lechaion v Korintském zálivu a Kenchreje v Sarónském zálivu, a lodě se přes šíji přetahovaly po dlážděné cestě."
    - "„Potom pak Pavel vyšed z Atén, přišel do Korintu“, kde bydlil u Akvily a Priscilly, stanařů, které Klaudius nedávno vyhnal z Říma. „I byl tu půl druhého léta, káže jim slovo Boží.“ Židé jej přivedli před prokonzula Gallióna, který odmítl případ soudit; nápis v Delfách datuje Gallionovo úřadování do let 51–52, což je jedno z nejpevnějších dat v Pavlově životě. Pavel napsal církvi dva listy a List Římanům byl pravděpodobně napsán z Korintu: doporučuje Foibé z Kenchrejí."
    - "Korint byl bohatým obchodním městem od 7. století př. n. l. Roku 146 př. n. l. jej Římané pod Mummiem vyplenili, většinu zde nalezených přivedli na meč a ženy a děti prodali, a místo leželo pusté, dokud tam roku 44 př. n. l. Julius Caesar nezaložil římskou kolonii, osídlenou z velké části propuštěnci; stalo se sídlem prokonzula Achaje. Nero zahájil roku 67 n. l. kanál přes šíji, ale dílo bylo opuštěno. Kolem roku 96 n. l. napsala římská církev Korintským list známý jako 1. Klement."
  sv:
    - "Korinth ligger i Grekland vid näset som förbinder Peloponnesos med fastlandet, under klippan Akrokorinth, omkring 75 km väster om Aten fågelvägen (88 km via vägen på kartan) och omkring 1 315 km från Jerusalem. Det hade en hamn vid vartdera havet, Lechaion vid Korinthiska viken och Kenchreai vid Saroniska viken, och fartyg drogs över näset på en stenlagd väg."
    - "”Därefter lämnade Paulus Aten och kom till Korint”, där han tog in hos Aquila och Priscilla, tältmakare som nyligen hade fördrivits från Rom av Claudius. ”Så uppehöll han sig där bland dem ett år och sex månader och undervisade i Guds ord.” Judarna förde honom inför prokonsuln Gallio, som vägrade döma i saken; en inskription i Delfi daterar Gallios ämbetsår till 51–52, en av de säkraste dateringarna i Paulus liv. Paulus skrev två brev till församlingen, och Romarbrevet skrevs sannolikt från Korinth: det anbefaller Foibe från Kenchreai."
    - "Korinth var en rik handelsstad från 600-talet f.Kr. År 146 f.Kr. plundrade romarna under Mummius den, dödade de flesta som hittades där med svärd och sålde kvinnorna och barnen, och platsen låg öde tills Julius Caesar grundade en romersk koloni där 44 f.Kr., bosatt till stor del med frigivna; den blev säte för prokonsuln av Achaia. Nero påbörjade en kanal genom näset år 67 e.Kr., men arbetet övergavs. Omkring år 96 e.Kr. skrev Roms församling till korinthierna brevet som kallas 1 Clemensbrevet."
  nb:
    - "Korint ligger i Hellas ved landtangen som forbinder Peloponnes med fastlandet, under klippen Akrokorint, omtrent 75 km vest for Aten i luftlinje (88 km langs veien på kartet) og omtrent 1 315 km fra Jerusalem. Det hadde en havn ved hvert hav, Lechaion ved Korintbukta og Kenkreae ved Saronbukta, og skip ble trukket over landtangen på en brolagt vei."
    - "«Derefter drog han fra Aten og kom til Korint», der han bodde hos Akvilas og Priskilla, teltmakere som nylig var utvist fra Roma av Klaudius. «Så tok han ophold der i et år og seks måneder, og lærte Guds ord iblandt dem.» Jødene førte ham for prokonsulen Gallio, som nektet å dømme i saken; en innskrift i Delfi daterer Gallios embetsår til 51–52, en av de sikreste datoene i Paulus' liv. Paulus skrev to brev til menigheten, og Romerbrevet ble trolig skrevet fra Korint: det anbefaler Føbe fra Kenkreae."
    - "Korint var en rik handelsby fra 600-tallet f.Kr. I 146 f.Kr. plyndret romerne under Mummius den, drepte de fleste som ble funnet der med sverdet og solgte kvinner og barn, og stedet lå øde til Julius Cæsar grunnla en romersk koloni der i 44 f.Kr., befolket i stor grad med frigitte slaver; den ble sete for prokonsulen i Akaia. Nero begynte en kanal gjennom landtangen i 67 e.Kr., men arbeidet ble oppgitt. Omkring 96 e.Kr. skrev menigheten i Roma til korinterne brevet kjent som 1 Klemens."
  tl:
    - "Nakatayo ang Corinto sa Grecia sa istmong nag-uugnay sa Peloponeso sa kalupaan ng Grecia, sa ibaba ng bato ng Acrocorinto, mga 75 km sa kanluran ng Atenas sa tuwid na guhit (88 km sa daan sa mapa) at mga 1,315 km mula sa Jerusalem. May daungan ito sa bawat dagat, ang Lechaeum sa Golpo ng Corinto at ang Cencrea sa Golpong Saroniko, at hinihila ang mga barko sa kabila ng istmo sa daang nalalatagan ng bato."
    - "“Pagkatapos ng mga bagay na ito'y umalis siya sa Atenas, at napasa Corinto”, kung saan tumuloy siya kina Aquila at Priscila, mga gumagawa ng tolda na kapapaalis lamang sa Roma ni Claudio. “At siya'y tumahan doong isang taon at anim na buwan, na itinuturo sa kanila ang salita ng Dios.” Dinala siya ng mga Judio sa prokonsul na si Galion, na tumangging humatol sa kaso; itinatakda ng isang inskripsiyon sa Delfos ang taon ng panunungkulan ni Galion sa 51–52, isa sa pinakamatibay na petsa sa buhay ni Pablo. Sumulat si Pablo ng dalawang liham sa iglesia, at marahil isinulat ang Mga Taga-Roma mula sa Corinto: ipinagtatagubilin nito si Febe ng Cencrea."
    - "Mayamang lungsod pangkalakal ang Corinto mula ikapitong siglo BK. Noong 146 BK, sinamsam ito ng mga Romano sa ilalim ni Mummius, pinatay sa tabak ang karamihan ng nasumpungan at ipinagbili ang mga babae at bata, at nanatiling wasak ang pook hanggang magtatag si Julio Cesar ng kolonyang Romano roon noong 44 BK, na tinirhan higit sa lahat ng mga pinalayang alipin; naging luklukan ito ng prokonsul ng Acaya. Nagsimula si Nero ng kanal sa istmo noong 67 AD, ngunit iniwan ang gawain. Mga 96 AD, sumulat ang iglesia ng Roma sa mga taga-Corinto ng liham na kilala bilang 1 Clemente."
  da:
    - "Korinth ligger i Grækenland ved det næs, der forbinder Peloponnes med fastlandet, under klippen Akrokorinth, omkring 75 km vest for Athen i luftlinje (88 km ad vejen på kortet) og omkring 1.315 km fra Jerusalem. Det havde en havn ved hvert hav, Lechaeum ved Korinthbugten og Kenkreæ ved Saroniske Bugt, og skibe blev slæbt over næsset på en brolagt vej."
    - "»Derefter forlod Paulus Athen og kom til Korinth«, hvor han boede hos Akvila og Priskilla, teltmagere, som Klaudius for nylig havde udvist fra Rom. »Og han slog sig ned der et Aar og seks Maaneder og lærte Guds Ord iblandt dem.« Jøderne førte ham for prokonsul Gallio, som nægtede at dømme i sagen; en indskrift i Delfi dater Gallios embedsår til 51–52, en af de sikreste datoer i Paulus' liv. Paulus skrev to breve til menigheden, og Romerbrevet blev sandsynligvis skrevet fra Korinth: det anbefaler Føbe fra Kenkreæ."
    - "Korinth var en rig handelsby fra 600-tallet f.Kr. I 146 f.Kr. plyndrede romerne under Mummius den, huggede de fleste af dem, der blev fundet dér, ned og solgte kvinderne og børnene, og stedet lå øde, indtil Julius Cæsar grundlagde en romersk koloni dér i 44 f.Kr., befolket i vid udstrækning med frigivne; den blev sæde for prokonsulen i Akaja. Nero begyndte en kanal gennem næsset i 67 e.Kr., men arbejdet blev opgivet. Omkring 96 e.Kr. skrev menigheden i Rom til korintherne det brev, der kendes som 1 Klemens."
  sr:
    - "Коринт стоји у Грчкој на превлаци која спаја Пелопонез са копном, испод стене Акрокоринта, око 75 км западно од Атине правом линијом (88 км путем на карти) и око 1.315 км од Јерусалима. Имао је луку на сваком мору, Лехеј на Коринтском заливу и Кенхреју на Саронском, а бродови су преко превлаке вучени поплочаним путем."
    - "„А потом се одлучи Павле од Атине и дође у Коринт“, где је становао код Акиле и Прискиле, израђивача шатора које је недавно из Рима протерао Клаудије. „И он седи онде годину и шест месеци учећи их речи Божјој.“ Јевреји су га довели пред проконзула Галиона, који је одбио да суди; натпис у Делфима датира Галионову годину службе у 51–52, један од најчвршћих датума у Павловом животу. Павле је писао две посланице цркви, а Посланица Римљанима вероватно је писана из Коринта: препоручује Фиву из Кенхреје."
    - "Коринт је био богат трговачки град од 7. века п. н. е. Године 146. п. н. е. Римљани под Мумијем опљачкали су га, већину затечених посекли мачем и продали жене и децу, а место је лежало пусто док Јулије Цезар ту 44. п. н. е. није основао римску колонију, насељену углавном ослобођеницима; постао је седиште проконзула Ахаје. Нерон је 67. н. е. започео канал кроз превлаку, али је рад напуштен. Око 96. н. е. црква у Риму написала је Коринћанима посланицу познату као 1. Климентова."
  hu:
    - "Korinthus Görögországban áll a Peloponnészoszt a szárazfölddel összekötő földszoroson, az Akrokorinthosz sziklája alatt, Athéntől egyenes vonalban mintegy 75 km-re nyugatra (a térképen látható úton 88 km) és Jeruzsálemtől mintegy 1315 km-re. Mindkét tengeren volt kikötője: a Korinthoszi-öbölben Lekheion, a Szaróni-öbölben Kenkhreai, és a hajókat kövezett úton vontatták át a földszoroson."
    - "„Ezekután Pál Athénből eltávozván, méne Korinthusba”, ahol Akvilánál és Priszcillánál lakott, azoknál a sátorkészítőknél, akiket nemrég űzött ki Rómából Klaudius. „És ott lakozék egy esztendeig és hat hónapig, tanítva köztük az Isten ígéjét.” A zsidók Gallió prokonzul elé vitték, aki megtagadta az ügy elbírálását; egy delphoi felirat Gallió hivatali évét Kr. u. 51–52-re keltezi, ez Pál életének egyik legszilárdabb dátuma. Pál két levelet írt az egyháznak, a Római levél pedig valószínűleg Korinthusból íródott: ajánlja Fébét Kenkhreaiból."
    - "Korinthus gazdag kereskedőváros volt a Kr. e. 7. századtól. Kr. e. 146-ban a rómaiak Mummius vezetésével kifosztották, a talált emberek zömét kardélre hányták, az asszonyokat és gyermekeket eladták, és a hely pusztán feküdt, míg Julius Caesar Kr. e. 44-ben római gyarmatot nem alapított ott, nagyrészt felszabadítottakkal betelepítve; Akhája prokonzuljának székhelye lett. Néró Kr. u. 67-ben csatornát kezdett a földszoroson át, de a munkát elhagyták. Mintegy Kr. u. 96-ban a római egyház levelet írt a korinthusiaknak, az 1Kelemen néven ismert levelet."
  fi:
    - "Korintti sijaitsee Kreikassa Peloponnesoksen mantereeseen yhdistävällä kannaksella Akrokorintin kallion alla, noin 75 km Ateenasta länteen linnuntietä (88 km kartan tietä pitkin) ja noin 1 315 km Jerusalemista. Sillä oli satama kummallakin merellä, Lechaion Korintinlahdella ja Kenkreat Saronin lahdella, ja laivoja vedettiin kannaksen yli päällystettyä tietä pitkin."
    - "”Sen jälkeen Paavali lähti Ateenasta ja meni Korinttoon”, missä hän yöpyi Akylaan ja Priskillan luona, telttaseppien, jotka Klaudius oli äskettäin karkottanut Roomasta. ”Niin hän viipyi siellä vuoden ja kuusi kuukautta opettaen heidän keskuudessaan Jumalan sanaa.” Juutalaiset veivät hänet prokonsuli Gallion eteen, joka kieltäytyi tuomitsemasta asiaa; Delfoin kirjoitus ajoittaa Gallion virkavuoden vuosiin 51–52, yhteen Paavalin elämän varmimmista päivämääristä. Paavali kirjoitti seurakunnalle kaksi kirjettä, ja Roomalaiskirje kirjoitettiin luultavasti Korintista: siinä suositellaan Foibea Kenkreista."
    - "Korintti oli rikas kauppakaupunki 600-luvulta eaa. Vuonna 146 eaa. roomalaiset Mummiuksen johdolla ryöstivät sen, surmasivat suurimman osan sieltä löydetyistä miekalla ja myivät naiset ja lapset, ja paikka oli autiona, kunnes Julius Caesar perusti sinne roomalaisen siirtokunnan vuonna 44 eaa., asutettuna suurelta osin vapautetuilla orjilla; siitä tuli Akaian prokonsulin asuinpaikka. Nero aloitti kanavan kaivamisen kannaksen läpi vuonna 67 jaa., mutta työ hylättiin. Noin 96 jaa. Rooman seurakunta kirjoitti korinttilaisille kirjeen, joka tunnetaan nimellä 1. Klemensin kirje."
  vi:
    - "Cô-rinh-tô đứng ở Hy Lạp tại eo đất nối bán đảo Peloponnese với đất liền, dưới tảng đá Acrocorinth, cách A-thên khoảng 75 km về phía tây theo đường thẳng (88 km theo đường trên bản đồ) và cách Giê-ru-sa-lem khoảng 1.315 km. Nó có một cảng trên mỗi biển, Lechaeum trên Vịnh Cô-rinh-tô và Xen-cơ-rê trên Vịnh Saronic, và tàu được kéo qua eo đất trên một con đường lát."
    - "“Phao-lô đi khỏi thành A-thên, mà tới thành Cô-rinh-tô”, nơi ông ở nhà A-qui-la và Bê-rít-sin, những thợ làm trại mới bị Cơ-lốt đuổi khỏi Rô-ma. “Phao-lô ở lại đó một năm sáu tháng, dạy đạo Đức Chúa Trời trong đám họ.” Người Do Thái đưa ông ra trước quan trấn thủ Ga-li-ôn, người từ chối xét vụ này; một bia ký ở Delphi định niên đại năm nhiệm chức của Ga-li-ôn là 51–52, một trong những mốc vững nhất trong đời Phao-lô. Phao-lô viết hai thư cho hội thánh, và thư Rô-ma có lẽ được viết từ Cô-rinh-tô: nó gởi gắm Phê-bê ở Xen-cơ-rê."
    - "Cô-rinh-tô là thành thương mại giàu có từ thế kỷ 7 TCN. Năm 146 TCN, người La Mã dưới quyền Mummius cướp phá nó, giết bằng gươm hầu hết những người tìm thấy ở đó và bán đàn bà con trẻ, và địa điểm hoang vắng cho đến khi Giu-lơ Sê-sa lập một thuộc địa La Mã ở đó năm 44 TCN, định cư phần lớn bằng những người được giải phóng; nó trở thành trụ sở của quan trấn thủ A-chai. Nero bắt đầu một con kênh xuyên eo đất năm 67, nhưng công việc bị bỏ. Khoảng năm 96, hội thánh Rô-ma viết cho người Cô-rinh-tô bức thư gọi là 1 Clement."
  ro:
    - "Corintul se află în Grecia, la istmul care leagă Peloponezul de continent, sub stânca Acrocorintului, la circa 75 km vest de Atena în linie dreaptă (88 km pe drumul de pe hartă) și la circa 1315 km de Ierusalim. Avea un port la fiecare mare, Lechaion pe Golful Corintului și Chencrea pe Golful Saronic, iar corăbiile erau trase peste istm pe un drum pavat."
    - "„Iar după acestea ieșind Pavel din Atena, a venit la Corint”, unde a locuit la Acvila și Priscila, făcători de corturi izgoniți de curând din Roma de Claudiu. „Și a șezut acolo un an și șase luni, învățând întru ei cuvântul lui Dumnezeu.” Iudeii l-au adus înaintea proconsulului Galion, care a refuzat să judece cazul; o inscripție de la Delfi datează anul de mandat al lui Galion în 51–52, una dintre cele mai sigure date din viața lui Pavel. Pavel a scris două epistole bisericii, iar Epistola către Romani a fost scrisă probabil de la Corint: o recomandă pe Febe din Chencrea."
    - "Corintul a fost un oraș comercial bogat din secolul al VII-lea î.Hr. În 146 î.Hr., romanii conduși de Mummius l-au jefuit, au trecut prin sabie pe cei mai mulți dintre cei găsiți acolo și au vândut femeile și copiii, iar locul a zăcut pustiu până când Iuliu Cezar a întemeiat acolo o colonie romană în 44 î.Hr., populată în mare parte cu liberți; a devenit sediul proconsulului Ahaiei. Nero a început un canal prin istm în 67 d.Hr., dar lucrarea a fost abandonată. Circa 96 d.Hr., biserica Romei a scris corintenilor epistola cunoscută ca 1 Clement."
  bg:
    - "Коринт е в Гърция, на провлака, който свързва Пелопонес с континента, под скалата на Акрокоринт, на около 75 км западно от Атина по права линия (88 км по пътя на картата) и на около 1315 км от Йерусалим. Той имал пристанище на всяко от двете морета — Лехайон на Коринтския залив и Кенхрея на Сароническия, — а корабите били теглени през провлака по павиран път."
    - "„Подир това отлъчи се Павел от Атина и дойде в Коринт“, където отседнал у Акила и Прискила, майстори на шатри, наскоро изгонени от Рим от Клавдий. Той останал там „…година и шест месеца та ги поучаваше на Слово Божие“. Юдеите го изправили пред проконсула Галион, който отказал да съди делото; надпис в Делфи датира годината на управлението на Галион в 51–52 г. — една от най-твърдите дати в живота на Павел. Павел написал две послания до църквата, а Римляни вероятно е писано от Коринт: то препоръчва Фива от Кенхрея."
    - "Коринт бил богат търговски град от VII в. пр.н.е. През 146 г. пр.н.е. римляните начело с Мумий го разграбили, избили повечето заварени там и продали жените и децата, а мястото лежало пусто, докато Юлий Цезар основал там римска колония през 44 г. пр.н.е., заселена главно с освободени роби; тя станала седалище на проконсула на Ахая. Нерон започнал канал през провлака през 67 г. н.е., но работата била изоставена. Около 96 г. н.е. римската църква писала на коринтяните посланието, известно като 1 Климент."
