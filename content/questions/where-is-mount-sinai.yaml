id: where-is-mount-sinai
question:
  en: "Where is Mount Sinai?"
  ru: "Где находится гора Синай?"
  uk: "Де гора Синай?"
  es: "¿Dónde está el monte Sinaí?"
  pt: "Onde fica o monte Sinai?"
  de: "Wo liegt der Berg Sinai?"
  fr: "Où est le mont Sinaï ?"
  pl: "Gdzie jest góra Synaj?"
  it: "Dov’è il Monte Sinai?"
  nl: "Waar ligt de berg Sinaï?"
  cs: "Kde je hora Sinaj?"
  sv: "Var ligger Sinaiberget?"
  nb: "Hvor ligger Sinai?"
  tl: "Nasaan ang Bundok Sinai?"
  da: "Hvor ligger Sinajbjerget?"
  sr: "Где је гора Синај?"
  hu: "Hol van a Sínai-hegy?"
  fi: "Missä Siinainvuori on?"
  vi: "Núi Si-na-i ở đâu?"
  ro: "Unde se află Muntele Sinai?"
  bg: "Къде е планината Синай?"
answer:
  en:
    - 'The site of Mount Sinai is disputed: the traditional mountain is Jebel Musa ("Mount of Moses") in the south of the Sinai Peninsula, Egypt, and that is where the map places it, but the Bible gives no location that can be fixed, and several other mountains have been proposed.'
    - 'Exodus says that Israel reached the mountain in the third month after leaving Egypt: they "were come to the desert of Sinai, and had pitched in the wilderness; and there Israel camped before the mount." The same mountain is called Horeb, the mountain of God, where Moses saw the burning bush, and Deuteronomy counts "eleven days'' journey from Horeb by the way of mount Seir unto Kadesh-barnea". From Jebel Musa to the usual site of Kadesh-barnea is about 240 km in a straight line, about 8 days on foot at 30 km a day.'
    - "The candidates on the map, beside Jebel Musa, are its neighbouring peaks Ras es-Safsafeh and Jebel Katherina, Jebel Serbal about 35 km to the west, Jebel Sin Bishar in the west of the peninsula, and Har Karkom in the Negev, about 210 km to the north-north-east; some writers also look for the mountain in north-western Arabia. Christian monks settled below Jebel Musa by the fourth century, and the monastery of St Catherine still stands at its foot. None of the proposals has been proved, so the map shows the traditional site and lists the others on the place card."
  ru:
    - "Местоположение горы Синай спорно: традиционная гора — Джебель-Муса («гора Моисея») на юге Синайского полуострова, в Египте, и там её показывает карта; но Библия не даёт привязки, которую можно установить точно, и предлагались другие горы."
    - "Книга Исход говорит, что Израиль пришёл к горе в третий месяц после выхода из Египта: «пришли в пустыню Синайскую, и расположились там станом в пустыне; и расположился там Израиль станом против горы». Та же гора зовётся Хоривом, горой Божией, где Моисей видел неопалимую купину, а Второзаконие указывает: «в расстоянии одиннадцати дней пути от Хорива, по дороге от горы Сеир к Кадес-Варни». От Джебель-Мусы до обычно принимаемого места Кадеса около 240 км по прямой, примерно 8 дней пешего пути по 30 км в день."
    - "Другие кандидаты на карте, кроме Джебель-Мусы, — соседние вершины Рас-эс-Сафсафе и гора Святой Екатерины, Джебель-Сербал в 35 км западнее, Джебель-Син-Бишар на западе полуострова и Хар-Карком в Негеве, примерно в 210 км к северо-северо-востоку; некоторые ищут гору и на северо-западе Аравии. Христианские монахи жили под Джебель-Мусой уже в IV веке, и у подножия до сих пор стоит монастырь Святой Екатерины. Ни одно из предложений не доказано, поэтому карта показывает традиционное место, а остальные перечисляет в карточке."
  uk:
    - "Місце гори Синай спірне: традиційна гора — Джебель-Муса («Гора Мойсея») на півдні Синайського півострова в Єгипті, і саме там її розміщує мапа, але Біблія не дає розташування, яке можна було б зафіксувати, і запропоновано кілька інших гір."
    - "Книга Вихід каже, що Ізраїль дійшов до гори на третьому місяці після виходу з Єгипту: вони «прийшли в Синайський степ, да й отаборились у пустинї» і розташувалися табором проти гори. Ту саму гору називають Хорив, гора Божа, де Мойсей бачив неопалиму купину, а Повторення Закону рахує «Одинайцять день ходи від Гореба, по дорозї від Сеїр-гори до Кадес-Барнеї». Від Джебель-Муси до звичайного місця Кадес-Барне близько 240 км по прямій, приблизно 8 днів пішки за 30 км на день."
    - "Кандидати на мапі, окрім Джебель-Муси, — її сусідні піки Рас-ес-Сафсафа й Джебель-Катеріна, Джебель-Сербаль приблизно за 35 км на захід, Джебель-Сін-Бішар на заході півострова та Хар-Карком у Негеві, приблизно за 210 км на північ-північний схід; деякі автори також шукають гору в північно-західній Аравії. Християнські ченці оселилися під Джебель-Мусою до IV ст., і монастир святої Катерини досі стоїть біля її підніжжя. Жодна з пропозицій не доведена, тож мапа показує традиційне місце, а решту перелічує на картці місця."
  es:
    - "El emplazamiento del monte Sinaí es discutido: el monte tradicional es el Jebel Musa («monte de Moisés»), en el sur de la península del Sinaí, en Egipto, y allí lo sitúa el mapa, pero la Biblia no da ninguna ubicación que pueda fijarse, y se han propuesto otros varios montes."
    - "Éxodo dice que Israel llegó al monte en el mes tercero tras salir de Egipto: «llegaron al desierto de Sinaí, y asentaron en el desierto; y acampó allí Israel delante del monte». El mismo monte se llama Horeb, el monte de Dios, donde Moisés vio la zarza ardiente, y Deuteronomio cuenta «Once jornadas hay desde Horeb, camino del monte de Seir, hasta Cades-barnea». Del Jebel Musa al emplazamiento habitual de Cades-barnea hay unos 240 km en línea recta, unos 8 días a pie a 30 km diarios."
    - "Los candidatos del mapa, junto al Jebel Musa, son sus cumbres vecinas Ras es-Safsafeh y Jebel Katherina, el Jebel Serbal, a unos 35 km al oeste, el Jebel Sin Bishar, en el oeste de la península, y Har Karkom, en el Négev, a unos 210 km al nor-noreste; algunos autores buscan también el monte en el noroeste de Arabia. Monjes cristianos se establecieron bajo el Jebel Musa en el siglo IV, y el monasterio de Santa Catalina sigue en pie a su pie. Ninguna de las propuestas ha sido demostrada, de modo que el mapa muestra el emplazamiento tradicional y enumera los otros en la ficha del lugar."
  pt:
    - "O local do monte Sinai é disputado: o monte tradicional é o Jebel Musa (“monte de Moisés”), no sul da península do Sinai, no Egito, e é ali que o mapa o situa, mas a Bíblia não dá localização que se possa fixar, e vários outros montes foram propostos."
    - "Êxodo diz que Israel chegou ao monte no terceiro mês depois de sair do Egito: “chegaram ao deserto do Sinai, acamparam no deserto; ali Israel acampou diante do monte.” O mesmo monte é chamado Horebe, o monte de Deus, onde Moisés viu a sarça ardente, e Deuteronômio conta “onze dias de jornada desde Horebe, pelo caminho do monte Seir, até Cades-Barneia”. Do Jebel Musa ao local usual de Cades-Barneia são cerca de 240 km em linha reta, uns 8 dias a pé a 30 km por dia."
    - "Os candidatos no mapa, além do Jebel Musa, são seus picos vizinhos Ras es-Safsafeh e Jebel Katherina, o Jebel Serbal, a cerca de 35 km a oeste, o Jebel Sin Bishar, no oeste da península, e Har Karkom, no Neguebe, a cerca de 210 km a nor-nordeste; alguns autores buscam também o monte no noroeste da Arábia. Monges cristãos se estabeleceram abaixo do Jebel Musa já no século IV, e o mosteiro de Santa Catarina ainda está ao seu pé. Nenhuma das propostas foi provada, de modo que o mapa mostra o local tradicional e lista os outros na ficha do lugar."
  de:
    - "Die Lage des Berges Sinai ist umstritten: Der überlieferte Berg ist der Dschebel Musa („Mosesberg“) im Süden der Sinai-Halbinsel in Ägypten, und dort setzt ihn die Karte an, doch die Bibel gibt keine Lage an, die sich festlegen ließe, und mehrere andere Berge sind vorgeschlagen worden."
    - "Das 2. Buch Mose sagt, Israel habe den Berg im dritten Monat nach dem Auszug aus Ägypten erreicht: „kamen sie dieses Tages in die Wüste Sinai“ und „lagerten sich in der Wüste daselbst gegenüber dem Berge“. Derselbe Berg heißt Horeb, der Berg Gottes, wo Mose den brennenden Busch sah, und das 5. Buch Mose zählt „Elf Tagereisen von Horeb, durch den Weg des Gebirges Seir, bis gen Kades-Barnea“. Vom Dschebel Musa bis zur üblichen Stätte von Kadesch-Barnea sind es in der Luftlinie etwa 240 km, bei 30 km am Tag etwa 8 Tage zu Fuß."
    - "Die Kandidaten auf der Karte neben dem Dschebel Musa sind seine Nachbargipfel Ras es-Safsafa und Dschebel Katharina, der Dschebel Serbal etwa 35 km westlich, der Dschebel Sin Bischar im Westen der Halbinsel und der Har Karkom im Negev, etwa 210 km nord-nordöstlich; manche Autoren suchen den Berg auch in Nordwestarabien. Christliche Mönche ließen sich schon im 4. Jahrhundert unterhalb des Dschebel Musa nieder, und das Katharinenkloster steht noch an seinem Fuß. Keiner der Vorschläge ist bewiesen, daher zeigt die Karte die überlieferte Stätte und führt die anderen auf der Ortskarte auf."
  fr:
    - "L’emplacement du mont Sinaï est discuté : la montagne traditionnelle est le Djebel Moussa (« montagne de Moïse ») dans le sud de la péninsule du Sinaï, en Égypte, et c’est là que la carte la place, mais la Bible ne donne aucune localisation qui puisse être fixée, et plusieurs autres montagnes ont été proposées."
    - "L’Exode dit qu’Israël atteignit la montagne le troisième mois après la sortie d’Égypte : « ils arrivèrent au désert de Sinaï, et ils campèrent dans le désert ; Israël campa là, vis-à-vis de la montagne. » La même montagne s’appelle Horeb, la montagne de Dieu, où Moïse vit le buisson ardent, et le Deutéronome compte « onze journées depuis Horeb, par le chemin de la montagne de Séir, jusqu’à Kadès-Barnéa ». Du Djebel Moussa au site habituel de Kadès-Barnéa, il y a environ 240 km en ligne droite, environ 8 jours de marche à 30 km par jour."
    - "Les candidats de la carte, à côté du Djebel Moussa, sont ses sommets voisins Ras es-Safsafeh et Djebel Katherina, le Djebel Serbal à environ 35 km à l’ouest, le Djebel Sin Bishar dans l’ouest de la péninsule, et Har Karkom dans le Néguev, à environ 210 km au nord-nord-est ; certains auteurs cherchent aussi la montagne dans le nord-ouest de l’Arabie. Des moines chrétiens s’installèrent sous le Djebel Moussa dès le IVe siècle, et le monastère Sainte-Catherine se dresse toujours à son pied. Aucune des propositions n’est prouvée, de sorte que la carte montre le site traditionnel et énumère les autres sur la fiche du lieu."
  pl:
    - "Położenie góry Synaj jest sporne: tradycyjną górą jest Dżabal Musa („Góra Mojżesza”) na południu Półwyspu Synaj w Egipcie i tam umieszcza ją mapa, ale Biblia nie podaje żadnego położenia, które dałoby się ustalić, i zaproponowano kilka innych gór."
    - "Księga Wyjścia mówi, że Izrael dotarł do góry w trzecim miesiącu po opuszczeniu Egiptu: „przyszedłszy aż na puszczą Synaj, położyli się obozem na puszczy, i rozbił tam Izrael namioty przeciw górze.” Ta sama góra nazywa się Horeb, góra Boża, gdzie Mojżesz zobaczył płonący krzew, a Księga Powtórzonego Prawa liczy „jedenaście dni drogi od Horebu przez górę Seir aż do Kades Barne”. Z Dżabal Musa do zwykłego miejsca Kadesz-Barnea jest około 240 km w linii prostej, około 8 dni pieszo przy 30 km dziennie."
    - "Kandydatami na mapie, obok Dżabal Musa, są sąsiednie szczyty Ras es-Safsafa i Dżabal Katarina, Dżabal Serbal około 35 km na zachód, Dżabal Sin Biszar na zachodzie półwyspu i Har Karkom w Negewie, około 210 km na północ-północny wschód; niektórzy autorzy szukają też góry w północno-zachodniej Arabii. Mnisi chrześcijańscy osiedlili się poniżej Dżabal Musa już w IV wieku, a klasztor św. Katarzyny wciąż stoi u jej podnóża. Żadna z propozycji nie została dowiedziona, więc mapa pokazuje miejsce tradycyjne, a pozostałe wymienia na karcie miejsca."
  it:
    - "Il sito del Monte Sinai è discusso: il monte tradizionale è il Gebel Musa («Monte di Mosè») nel sud della penisola del Sinai, in Egitto, ed è lì che la mappa lo pone, ma la Bibbia non dà alcuna localizzazione che si possa fissare, e sono stati proposti diversi altri monti."
    - "L’Esodo dice che Israele raggiunse il monte nel terzo mese dopo aver lasciato l’Egitto: «giunsero al deserto di Sinai e si accamparono nel deserto; quivi si accampò Israele, dirimpetto al monte». Lo stesso monte è chiamato Horeb, la montagna di Dio, dove Mosè vide il roveto ardente, e il Deuteronomio conta «undici giornate dallo Horeb, per la via del monte Seir, fino a Kades-Barnea». Dal Gebel Musa al sito abituale di Kades-Barnea ci sono circa 240 km in linea retta, circa 8 giorni a piedi a 30 km al giorno."
    - "I candidati sulla mappa, oltre al Gebel Musa, sono le vette vicine Ras es-Safsafeh e Gebel Katherina, il Gebel Serbal a circa 35 km a ovest, il Gebel Sin Bishar nell’ovest della penisola e Har Karkom nel Negev, a circa 210 km a nord-nord-est; alcuni autori cercano il monte anche nell’Arabia nord-occidentale. Monaci cristiani si stabilirono sotto il Gebel Musa già nel IV secolo, e il monastero di Santa Caterina sorge ancora ai suoi piedi. Nessuna delle proposte è stata provata, così la mappa mostra il sito tradizionale ed elenca gli altri sulla scheda del luogo."
  nl:
    - "De ligging van de berg Sinaï is omstreden: de traditionele berg is de Jebel Musa (“berg van Mozes”) in het zuiden van het Sinaï-schiereiland in Egypte, en daar plaatst de kaart hem, maar de Bijbel geeft geen ligging die vast te stellen is, en verscheidene andere bergen zijn voorgesteld."
    - "Exodus zegt dat Israël de berg bereikte in de derde maand na het verlaten van Egypte: zij “kwamen in de woestijn Sinai, en zij legerden zich in de woestijn; Israel nu legerde zich aldaar tegenover dien berg.” Dezelfde berg heet Horeb, de berg Gods, waar Mozes de brandende braamstruik zag, en Deuteronomium telt “elf dag reizen” “van Horeb, door den weg van het gebergte Seir, tot aan Kades-Barnea”. Van de Jebel Musa naar de gebruikelijke plaats van Kades-Barnea is het hemelsbreed ongeveer 240 km, bij 30 km per dag ongeveer 8 dagen te voet."
    - "De kandidaten op de kaart zijn, naast de Jebel Musa, de naburige pieken Ras es-Safsafeh en Jebel Katherina, de Jebel Serbal ongeveer 35 km naar het westen, de Jebel Sin Bishar in het westen van het schiereiland, en Har Karkom in de Negev, ongeveer 210 km naar het noord-noordoosten; sommige schrijvers zoeken de berg ook in Noordwest-Arabië. Christelijke monniken vestigden zich in de vierde eeuw onder de Jebel Musa, en het Katharinaklooster staat nog aan zijn voet. Geen van de voorstellen is bewezen, dus de kaart toont de traditionele plaats en noemt de andere op de plaatskaart."
  cs:
    - "Místo hory Sinaj je sporné: tradiční horou je Džebel Músá („Mojžíšova hora“) na jihu Sinajského poloostrova v Egyptě a tam ji mapa klade, ale Bible nedává žádnou polohu, kterou by bylo možno určit, a bylo navrženo několik dalších hor."
    - "Exodus říká, že Izrael dosáhl hory ve třetím měsíci po odchodu z Egypta: „přišli až na poušť Sinai a položili se na té poušti; a tu rozbili Izraelští stany naproti hoře.“ Táž hora se nazývá Oréb, hora Boží, kde Mojžíš viděl hořící keř, a Deuteronomium počítá „Jedenácte dní cesty jest od Oréb přes hory Seir až do Kádesbarne“. Z Džebel Músá k obvyklému místu Kádeš-barnea je to asi 240 km vzdušnou čarou, asi 8 dní pěšky při 30 km denně."
    - "Kandidáti na mapě vedle Džebel Músá jsou sousední vrcholy Ras as-Safsáfa a Džebel Katrína, Džebel Serbál asi 35 km na západ, Džebel Sin Bišár na západě poloostrova a Har Karkom v Negevu, asi 210 km na severoseverovýchod; někteří autoři hledají horu i v severozápadní Arábii. Křesťanští mniši se pod Džebel Músá usadili ve 4. století a klášter svaté Kateřiny stojí u jeho úpatí dodnes. Žádný z návrhů nebyl prokázán, a proto mapa ukazuje tradiční místo a ostatní uvádí na kartě místa."
  sv:
    - "Sinaibergets läge är omstritt: det traditionella berget är Jebel Musa (”Moses berg”) i södra Sinaihalvön i Egypten, och dit placerar kartan det, men Bibeln ger ingen plats som kan fastställas, och flera andra berg har föreslagits."
    - "2 Mosebok säger att Israel nådde berget i tredje månaden efter uttåget ur Egypten: de ”kommo så till Sinais öken och lägrade sig i öknen; Israel lägrade sig där mitt emot berget”. Samma berg kallas Horeb, Guds berg, där Mose såg den brinnande busken, och 5 Mosebok räknar ”elva dagsresor från Horeb, åt Seirs bergsbygd till, fram till Kades-Barnea”. Från Jebel Musa till den vanliga platsen för Kadesh-Barnea är det omkring 240 km fågelvägen, omkring 8 dagar till fots med 30 km om dagen."
    - "Kandidaterna på kartan, förutom Jebel Musa, är dess grannar Ras es-Safsafeh och Jebel Katherina, Jebel Serbal omkring 35 km åt väster, Jebel Sin Bishar i västra delen av halvön och Har Karkom i Negev, omkring 210 km åt nord-nordost; några skribenter söker också berget i nordvästra Arabien. Kristna munkar bosatte sig under Jebel Musa på 300-talet, och Sankta Katarinas kloster står ännu vid dess fot. Inget av förslagen har bevisats, så kartan visar den traditionella platsen och förtecknar de övriga på platskortet."
  nb:
    - "Sinais beliggenhet er omstridt: det tradisjonelle fjellet er Jebel Musa («Moses' fjell») i den sørlige delen av Sinai-halvøya i Egypt, og dit plasserer kartet det, men Bibelen gir ingen beliggenhet som kan fastsettes, og flere andre fjell er foreslått."
    - "2 Mosebok sier at Israel nådde fjellet i den tredje måneden etter at de forlot Egypt: de «kom til Sinai ørken og slo leir i ørkenen, og Israel leiret sig der midt imot fjellet.» Det samme fjellet kalles Horeb, Guds berg, der Moses så den brennende tornebusken, og 5 Mosebok teller «elleve dagsreiser fra Horeb efter den vei som fører til Se'ir-fjellene, til Kades-Barnea». Fra Jebel Musa til det vanlige stedet for Kadesj-Barnea er det omtrent 240 km i luftlinje, omtrent 8 dager til fots med 30 km om dagen."
    - "Kandidatene på kartet, ved siden av Jebel Musa, er nabotoppene Ras es-Safsafeh og Jebel Katherina, Jebel Serbal omtrent 35 km mot vest, Jebel Sin Bishar i den vestlige delen av halvøya og Har Karkom i Negev, omtrent 210 km mot nord-nordøst; noen forfattere søker også fjellet i det nordvestlige Arabia. Kristne munker slo seg ned under Jebel Musa på 300-tallet, og Sankt Katarina-klosteret står fortsatt ved foten. Ingen av forslagene er bevist, så kartet viser det tradisjonelle stedet og lister de andre på stedskortet."
  tl:
    - "Pinagtatalunan ang pook ng Bundok Sinai: ang tradisyonal na bundok ay ang Jebel Musa (“Bundok ni Moises”) sa timog ng Tangway ng Sinai, Egipto, at doon ito inilalagay ng mapa, ngunit walang ibinibigay ang Biblia na lokasyong matitiyak, at maraming ibang bundok ang iminungkahi."
    - "Sinasabi ng Exodo na narating ng Israel ang bundok sa ikatlong buwan pagkaalis sa Egipto: “dumating sa ilang ng Sinai, ay humantong sila sa ilang; at doo'y humantong ang Israel sa harap ng bundok.” Tinatawag din ang parehong bundok na Horeb, ang bundok ng Dios, kung saan nakita ni Moises ang nagniningas na palumpong, at binibilang ng Deuteronomio ang “labing isang araw na lakbayin mula sa Horeb kung dadaan ng bundok ng Seir hanggang sa Cades-barnea”. Mula sa Jebel Musa hanggang sa karaniwang pook ng Cades-barnea ay mga 240 km sa tuwid na guhit, mga 8 araw na lakad sa 30 km kada araw."
    - "Ang mga kandidato sa mapa, bukod sa Jebel Musa, ay ang mga katabing tuktok nito na Ras es-Safsafeh at Jebel Katherina, ang Jebel Serbal mga 35 km sa kanluran, ang Jebel Sin Bishar sa kanluran ng tangway, at ang Har Karkom sa Negev, mga 210 km sa hilaga-hilagang-silangan; hinahanap din ng ilang manunulat ang bundok sa hilagang-kanlurang Arabia. Nanirahan na ang mga monghe na Kristiyano sa ibaba ng Jebel Musa pagsapit ng ikaapat na siglo, at nakatayo pa rin sa paanan nito ang monasteryo ni Santa Catalina. Wala sa mga mungkahi ang napatunayan, kaya ipinakikita ng mapa ang tradisyonal na pook at inililista ang iba sa kard ng lugar."
  da:
    - "Sinajbjergets sted er omstridt: det traditionelle bjerg er Jebel Musa (»Moses' bjerg«) i den sydlige del af Sinaihalvøen, Egypten, og det er dér, kortet placerer det, men Bibelen giver ingen placering, der kan fastlægges, og flere andre bjerge er blevet foreslået."
    - "Anden Mosebog siger, at Israel nåede bjerget i den tredje måned efter udtoget af Egypten: de »kom til Sinai Ørk og lejrede sig i Ørken, og der lejrede Israel sig lige for Bjerget«. Det samme bjerg kaldes Horeb, Guds bjerg, hvor Moses så den brændende tornebusk, og Femte Mosebog regner »elleve Dages Rejse fra Horeb til Seirs Bjerge, indtil Kades-Barnea«. Fra Jebel Musa til det sædvanlige sted for Kadesj-Barnea er der omkring 240 km i luftlinje, omkring 8 dage til fods med 30 km om dagen."
    - "Kandidaterne på kortet ved siden af Jebel Musa er dens nabotoppe Ras es-Safsafeh og Jebel Katherina, Jebel Serbal omkring 35 km mod vest, Jebel Sin Bishar i den vestlige del af halvøen og Har Karkom i Negev, omkring 210 km mod nordnordøst; nogle skribenter søger også bjerget i det nordvestlige Arabien. Kristne munke slog sig ned under Jebel Musa i 300-tallet, og Sankt Katharina-klosteret står stadig ved dets fod. Ingen af forslagene er bevist, så kortet viser det traditionelle sted og opregner de andre på stedets kort."
  sr:
    - "Место горе Синај је спорно: традиционална гора је Џебел Муса („Мојсијева гора“) на југу Синајског полуострва, у Египту, и ту је карта поставља, али Библија не даје положај који би се могао утврдити, а предложено је неколико других планина."
    - "Излазак каже да је Израиљ стигао до горе у трећем месецу после изласка из Египта: „дођоше у пустињу синајску, и стадоше у логор у пустињи, а логор начинише Израиљци онде под гором“. Иста гора зове се Хорив, гора Божија, где је Мојсије видео купину која гори, а Поновљени закон рачуна „једанаест дана хода од Хорива преко горе Сира до Кадис-Варније“. Од Џебел Мусе до уобичајеног места Кадис-Варније има око 240 км правом линијом, око 8 дана пешке уз 30 км дневно."
    - "Кандидати на карти, поред Џебел Мусе, јесу њени суседни врхови Рас ес Сафсафа и Џебел Катерина, Џебел Сербал око 35 км на западу, Џебел Син Бишар на западу полуострва, и Хар Каркум у Негеву, око 210 км северно-североисточно; неки писци гору траже и у северозападној Арабији. Хришћански монаси населили су се испод Џебел Мусе до 4. века, а манастир Свете Катарине још стоји у њеном подножју. Ниједан од предлога није доказан, па карта приказује традиционално место, а остала наводи на картици места."
  hu:
    - "A Sínai-hegy helye vitatott: a hagyományos hegy a Dzsebel Músza („Mózes hegye”) a Sínai-félsziget déli részén, Egyiptomban, és a térkép ide teszi, de a Biblia nem ad rögzíthető helyet, és több más hegyet is javasoltak."
    - "A Mózes második könyve szerint Izráel az Egyiptomból való kivonulás utáni harmadik hónapban érte el a hegyet: „érkezének a Sinai pusztába és táborba szállának a pusztában; a hegygyel átellenben szálla pedig ott táborba az Izráel.” Ugyanezt a hegyet nevezik Hórebnek, az Isten hegyének, ahol Mózes látta az égő csipkebokrot, az 5Móz pedig számol: „Tizenegy napi járóföldön Hórebtől fogva, a Szeir hegyének menve, Kádes-Barneáig.” A Dzsebel Músza és a Kádes-Barnea szokásos helye között egyenes vonalban mintegy 240 km van, napi 30 km-rel mintegy 8 napi gyaloglás."
    - "A térképen a Dzsebel Músza mellett jelöltek szomszédos csúcsai, a Rasz esz-Szafszáfa és a Dzsebel Katarina, a mintegy 35 km-re nyugatra lévő Dzsebel Szerbál, a félsziget nyugati részén lévő Dzsebel Szin Bisár, és a Negev Har Karkomja, mintegy 210 km-re észak-északkeletre; egyes írók a hegyet Északnyugat-Arábiában is keresik. Keresztény szerzetesek a 4. századra letelepedtek a Dzsebel Músza alatt, és a Szent Katalin-kolostor ma is a lábánál áll. Egyik javaslat sem bizonyított, ezért a térkép a hagyományos helyet mutatja, a többit a helykártyán sorolja fel."
  fi:
    - "Siinainvuoren paikasta kiistellään: perinteinen vuori on Jebel Musa (”Mooseksen vuori”) Siinain niemimaan eteläosassa Egyptissä, ja siihen kartta sen sijoittaa, mutta Raamattu ei anna sijaintia, joka voitaisiin määrittää, ja useita muita vuoria on ehdotettu."
    - "2. Mooseksen kirja kertoo, että Israel saapui vuorelle kolmantena kuukautena Egyptistä lähdön jälkeen: he olivat ”tulleet Siinain erämaahan ja leiriytyneet erämaahan; ja Israel oli siellä leirissä vuoren kohdalla.” Samaa vuorta kutsutaan Hoorebiksi, Jumalan vuoreksi, jolla Mooses näki palavan pensaan, ja 5. Mooseksen kirja laskee ”Hoorebista on yksitoista päivänmatkaa, Seirin vuoriston tietä, Kaades-Barneaan”. Jebel Musalta Kades-Barnean tavalliselle paikalle on noin 240 km linnuntietä, noin 8 päivää jalan 30 km:n päivävauhdilla."
    - "Kartan ehdokkaat Jebel Musan lisäksi ovat sen naapurihuiput Ras es-Safsafeh ja Jebel Katherina, Jebel Serbal noin 35 km länteen, Jebel Sin Bishar niemimaan länsiosassa ja Har Karkom Negevissä, noin 210 km pohjois-koilliseen; jotkut kirjoittajat etsivät vuorta myös Luoteis-Arabiasta. Kristityt munkit asettuivat Jebel Musan alapuolelle 300-luvulle mennessä, ja Pyhän Katariinan luostari seisoo yhä sen juurella. Mitään ehdotuksista ei ole todistettu, joten kartta näyttää perinteisen paikan ja luettelee muut paikkakortissa."
  vi:
    - "Địa điểm núi Si-na-i còn tranh luận: ngọn núi truyền thống là Jebel Musa (“Núi của Môi-se”) ở phía nam bán đảo Si-nai, Ê-díp-tô, và đó là nơi bản đồ đặt nó, nhưng Kinh Thánh không cho vị trí nào có thể xác định, và nhiều ngọn núi khác đã được đề nghị."
    - "Sách Xuất Ê-díp-tô Ký nói Y-sơ-ra-ên đến núi vào tháng thứ ba sau khi rời Ê-díp-tô: họ “đến nơi đồng vắng Si-na-i, đóng trại tại đó, đối diện cùng núi”. Cũng ngọn núi ấy được gọi là Hô-rếp, núi của Đức Chúa Trời, nơi Môi-se thấy bụi gai cháy, và sách Phục truyền kể “Từ Hô-rếp tới Ca-đe-Ba-nê-a, bởi đường núi Sê-i-rơ, đi mười một ngày đường”. Từ Jebel Musa đến địa điểm thông thường của Ca-đe-Ba-nê-a khoảng 240 km theo đường thẳng, chừng 8 ngày đi bộ với 30 km một ngày."
    - "Các ứng viên trên bản đồ, bên cạnh Jebel Musa, là các đỉnh lân cận Ras es-Safsafeh và Jebel Katherina, Jebel Serbal cách khoảng 35 km về phía tây, Jebel Sin Bishar ở phía tây bán đảo, và Har Karkom ở Nê-ghép, cách khoảng 210 km về phía bắc-đông bắc; một số tác giả cũng tìm ngọn núi ở tây bắc A-ra-bi. Các tu sĩ Cơ Đốc định cư dưới Jebel Musa từ thế kỷ 4, và tu viện Thánh Catherine vẫn đứng dưới chân nó. Không đề nghị nào được chứng minh, nên bản đồ cho thấy địa điểm truyền thống và liệt kê các nơi khác trên thẻ địa điểm."
  ro:
    - "Locul Muntelui Sinai este disputat: muntele tradițional este Jebel Musa („Muntele lui Moise”), în sudul Peninsulei Sinai, în Egipt, și acolo îl așază harta, dar Biblia nu dă nicio localizare care să poată fi fixată, și au fost propuși mai mulți alți munți."
    - "Ieșirea spune că Israel a ajuns la munte în luna a treia după ieșirea din Egipt: „au venit în pustia Sina, și a tăbărît acolo Israil împreajma muntelui.” Același munte se numește Horeb, muntele lui Dumnezeu, unde Moise a văzut rugul aprins, iar Deuteronomul numără: „Unsprezece zile din Horiv cale pre muntele Siir până la Kadisul Varni”. De la Jebel Musa până la locul obișnuit al Cades-Barnea sunt circa 240 km în linie dreaptă, circa 8 zile pe jos, cu 30 km pe zi."
    - "Candidații de pe hartă, alături de Jebel Musa, sunt vârfurile vecine Ras es-Safsafeh și Jebel Katherina, Jebel Serbal, la circa 35 km spre vest, Jebel Sin Bishar, în vestul peninsulei, și Har Karkom, în Neghev, la circa 210 km spre nord-nord-est; unii autori caută muntele și în nord-vestul Arabiei. Monahi creștini s-au așezat sub Jebel Musa până în secolul al IV-lea, iar mănăstirea Sfânta Ecaterina stă și azi la poalele lui. Niciuna dintre propuneri nu a fost dovedită, așa că harta arată locul tradițional și înșiră celelalte locuri pe fișa locului."
  bg:
    - "Мястото на планината Синай е спорно: традиционната планина е Джебел Муса („Мойсеевата планина“) в южната част на Синайския полуостров, Египет, и там я поставя картата, но Библията не дава местоположение, което да може да се установи, и са предлагани няколко други планини."
    - "Изход казва, че Израил стигнал планината в третия месец след излизането от Египет: „дойдоха в Синайската пустиня, и разположиха стан в пустинята; и там постави шатрите си Израил срещу гората.“ Същата планина се нарича Хорив, Божията планина, където Мойсей видял горящата къпина, а Второзаконие брои: „Единадесет дни са от Хорив през пътя на гората Сиир до Кадис-варни“. От Джебел Муса до обичайното място на Кадес-Варни има около 240 км по права линия, около 8 дни пеша при 30 км на ден."
    - "Кандидатите на картата освен Джебел Муса са съседните му върхове Рас ес-Сафсафе и Джебел Катерина, Джебел Сербал на около 35 км на запад, Джебел Син Бишар в западната част на полуострова и Хар Карком в Негев, на около 210 км на север-североизток; някои автори търсят планината и в Северозападна Арабия. Християнски монаси се заселили под Джебел Муса към IV в., а манастирът „Света Екатерина“ още стои в подножието ѝ. Никое от предложенията не е доказано, затова картата показва традиционното място и изброява другите в картичката на мястото."
