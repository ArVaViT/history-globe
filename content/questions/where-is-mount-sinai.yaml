id: where-is-mount-sinai
question:
  en: "Where is Mount Sinai?"
  ru: "Где находится гора Синай?"
  uk: "Де гора Синай?"
  es: "¿Dónde está el monte Sinaí?"
  pt: "Onde fica o monte Sinai?"
  de: "Wo liegt der Berg Sinai?"
  fr: "Où est le mont Sinaï ?"
answer:
  en:
    - 'The site of Mount Sinai is disputed: the traditional mountain is Jebel Musa ("Mount of Moses") in the south of the Sinai Peninsula, Egypt, and that is where the map places it, but the Bible gives no location that can be fixed, and several other mountains have been proposed.'
    - 'Exodus says that Israel reached the mountain in the third month after leaving Egypt: they "were come to the desert of Sinai, and had pitched in the wilderness; and there Israel camped before the mount." The same mountain is called Horeb, the mountain of God, where Moses saw the burning bush, and Deuteronomy counts "eleven days'' journey from Horeb by the way of mount Seir unto Kadesh-barnea". From Jebel Musa to the usual site of Kadesh-barnea is about 240 km in a straight line, about 8 days on foot at 30 km a day.'
    - "The candidates on the map, beside Jebel Musa, are its neighbouring peaks Ras es-Safsafeh and Jebel Katherina, Jebel Serbal about 35 km to the west, Jebel Sin Bishar in the west of the peninsula, and Har Karkom in the Negev, about 210 km to the north-north-east; some writers also look for the mountain in north-western Arabia. Christian monks settled below Jebel Musa by the fourth century, and the monastery of St Catherine still stands at its foot. None of the proposals has been proved, so the map shows the traditional site and lists the others on the place card."
  ru:
    - "Местоположение горы Синай спорно: традиционная гора — Джебель-Муса («гора Моисея») на юге Синайского полуострова, в Египте, и там её показывает карта; но Библия не даёт привязки, которую можно установить точно, и предлагались другие горы."
    - "Книга Исход говорит, что Израиль пришёл к горе в третий месяц после выхода из Египта: «пришли в пустыню Синайскую, и расположились там станом в пустыне; и расположился там Израиль станом против горы». Та же гора зовётся Хоривом, горой Божией, где Моисей видел неопалимую купину, а Второзаконие указывает: «в расстоянии одиннадцати дней пути от Хорива, по дороге от горы Сеир к Кадес-Варни». От Джебель-Мусы до обычно принимаемого места Кадеса около 240 км по прямой, примерно 8 дней пешего пути по 30 км в день."
    - "Другие кандидаты на карте, кроме Джебель-Мусы, — соседние вершины Рас-эс-Сафсафе и гора Святой Екатерины, Джебель-Сербал в 35 км западнее, Джебель-Син-Бишар на западе полуострова и Хар-Карком в Негеве, примерно в 210 км к северо-северо-востоку; некоторые ищут гору и на северо-западе Аравии. Христианские монахи жили под Джебель-Мусой уже в IV веке, и у подножия до сих пор стоит монастырь Святой Екатерины. Ни одно из предложений не доказано, поэтому карта показывает традиционное место, а остальные перечисляет в карточке."
  uk:
    - "Місце гори Синай спірне: традиційна гора — Джебель-Муса («Гора Мойсея») на півдні Синайського півострова в Єгипті, і саме там її розміщує мапа, але Біблія не дає розташування, яке можна було б зафіксувати, і запропоновано кілька інших гір."
    - "Книга Вихід каже, що Ізраїль дійшов до гори на третьому місяці після виходу з Єгипту: вони «прийшли в Синайський степ, да й отаборились у пустинї» і розташувалися табором проти гори. Ту саму гору називають Хорив, гора Божа, де Мойсей бачив неопалиму купину, а Повторення Закону рахує «Одинайцять день ходи від Гореба, по дорозї від Сеїр-гори до Кадес-Барнеї». Від Джебель-Муси до звичайного місця Кадес-Барне близько 240 км по прямій, приблизно 8 днів пішки за 30 км на день."
    - "Кандидати на мапі, окрім Джебель-Муси, — її сусідні піки Рас-ес-Сафсафа й Джебель-Катеріна, Джебель-Сербаль приблизно за 35 км на захід, Джебель-Сін-Бішар на заході півострова та Хар-Карком у Негеві, приблизно за 210 км на північ-північний схід; деякі автори також шукають гору в північно-західній Аравії. Християнські ченці оселилися під Джебель-Мусою до IV ст., і монастир святої Катерини досі стоїть біля її підніжжя. Жодна з пропозицій не доведена, тож мапа показує традиційне місце, а решту перелічує на картці місця."
  es:
    - "El emplazamiento del monte Sinaí es discutido: el monte tradicional es el Jebel Musa («monte de Moisés»), en el sur de la península del Sinaí, en Egipto, y allí lo sitúa el mapa, pero la Biblia no da ninguna ubicación que pueda fijarse, y se han propuesto otros varios montes."
    - "Éxodo dice que Israel llegó al monte en el mes tercero tras salir de Egipto: «llegaron al desierto de Sinaí, y asentaron en el desierto; y acampó allí Israel delante del monte». El mismo monte se llama Horeb, el monte de Dios, donde Moisés vio la zarza ardiente, y Deuteronomio cuenta «Once jornadas hay desde Horeb, camino del monte de Seir, hasta Cades-barnea». Del Jebel Musa al emplazamiento habitual de Cades-barnea hay unos 240 km en línea recta, unos 8 días a pie a 30 km diarios."
    - "Los candidatos del mapa, junto al Jebel Musa, son sus cumbres vecinas Ras es-Safsafeh y Jebel Katherina, el Jebel Serbal, a unos 35 km al oeste, el Jebel Sin Bishar, en el oeste de la península, y Har Karkom, en el Négev, a unos 210 km al nor-noreste; algunos autores buscan también el monte en el noroeste de Arabia. Monjes cristianos se establecieron bajo el Jebel Musa en el siglo IV, y el monasterio de Santa Catalina sigue en pie a su pie. Ninguna de las propuestas ha sido demostrada, de modo que el mapa muestra el emplazamiento tradicional y enumera los otros en la ficha del lugar."
  pt:
    - "O local do monte Sinai é disputado: o monte tradicional é o Jebel Musa (“monte de Moisés”), no sul da península do Sinai, no Egito, e é ali que o mapa o situa, mas a Bíblia não dá localização que se possa fixar, e vários outros montes foram propostos."
    - "Êxodo diz que Israel chegou ao monte no terceiro mês depois de sair do Egito: “chegaram ao deserto do Sinai, acamparam no deserto; ali Israel acampou diante do monte.” O mesmo monte é chamado Horebe, o monte de Deus, onde Moisés viu a sarça ardente, e Deuteronômio conta “onze dias de jornada desde Horebe, pelo caminho do monte Seir, até Cades-Barneia”. Do Jebel Musa ao local usual de Cades-Barneia são cerca de 240 km em linha reta, uns 8 dias a pé a 30 km por dia."
    - "Os candidatos no mapa, além do Jebel Musa, são seus picos vizinhos Ras es-Safsafeh e Jebel Katherina, o Jebel Serbal, a cerca de 35 km a oeste, o Jebel Sin Bishar, no oeste da península, e Har Karkom, no Neguebe, a cerca de 210 km a nor-nordeste; alguns autores buscam também o monte no noroeste da Arábia. Monges cristãos se estabeleceram abaixo do Jebel Musa já no século IV, e o mosteiro de Santa Catarina ainda está ao seu pé. Nenhuma das propostas foi provada, de modo que o mapa mostra o local tradicional e lista os outros na ficha do lugar."
  de:
    - "Die Lage des Berges Sinai ist umstritten: Der überlieferte Berg ist der Dschebel Musa („Mosesberg“) im Süden der Sinai-Halbinsel in Ägypten, und dort setzt ihn die Karte an, doch die Bibel gibt keine Lage an, die sich festlegen ließe, und mehrere andere Berge sind vorgeschlagen worden."
    - "Das 2. Buch Mose sagt, Israel habe den Berg im dritten Monat nach dem Auszug aus Ägypten erreicht: „kamen sie dieses Tages in die Wüste Sinai“ und „lagerten sich in der Wüste daselbst gegenüber dem Berge“. Derselbe Berg heißt Horeb, der Berg Gottes, wo Mose den brennenden Busch sah, und das 5. Buch Mose zählt „Elf Tagereisen von Horeb, durch den Weg des Gebirges Seir, bis gen Kades-Barnea“. Vom Dschebel Musa bis zur üblichen Stätte von Kadesch-Barnea sind es in der Luftlinie etwa 240 km, bei 30 km am Tag etwa 8 Tage zu Fuß."
    - "Die Kandidaten auf der Karte neben dem Dschebel Musa sind seine Nachbargipfel Ras es-Safsafa und Dschebel Katharina, der Dschebel Serbal etwa 35 km westlich, der Dschebel Sin Bischar im Westen der Halbinsel und der Har Karkom im Negev, etwa 210 km nord-nordöstlich; manche Autoren suchen den Berg auch in Nordwestarabien. Christliche Mönche ließen sich schon im 4. Jahrhundert unterhalb des Dschebel Musa nieder, und das Katharinenkloster steht noch an seinem Fuß. Keiner der Vorschläge ist bewiesen, daher zeigt die Karte die überlieferte Stätte und führt die anderen auf der Ortskarte auf."
  fr:
    - "L’emplacement du mont Sinaï est discuté : la montagne traditionnelle est le Djebel Moussa (« montagne de Moïse ») dans le sud de la péninsule du Sinaï, en Égypte, et c’est là que la carte la place, mais la Bible ne donne aucune localisation qui puisse être fixée, et plusieurs autres montagnes ont été proposées."
    - "L’Exode dit qu’Israël atteignit la montagne le troisième mois après la sortie d’Égypte : « ils arrivèrent au désert de Sinaï, et ils campèrent dans le désert ; Israël campa là, vis-à-vis de la montagne. » La même montagne s’appelle Horeb, la montagne de Dieu, où Moïse vit le buisson ardent, et le Deutéronome compte « onze journées depuis Horeb, par le chemin de la montagne de Séir, jusqu’à Kadès-Barnéa ». Du Djebel Moussa au site habituel de Kadès-Barnéa, il y a environ 240 km en ligne droite, environ 8 jours de marche à 30 km par jour."
    - "Les candidats de la carte, à côté du Djebel Moussa, sont ses sommets voisins Ras es-Safsafeh et Djebel Katherina, le Djebel Serbal à environ 35 km à l’ouest, le Djebel Sin Bishar dans l’ouest de la péninsule, et Har Karkom dans le Néguev, à environ 210 km au nord-nord-est ; certains auteurs cherchent aussi la montagne dans le nord-ouest de l’Arabie. Des moines chrétiens s’installèrent sous le Djebel Moussa dès le IVe siècle, et le monastère Sainte-Catherine se dresse toujours à son pied. Aucune des propositions n’est prouvée, de sorte que la carte montre le site traditionnel et énumère les autres sur la fiche du lieu."
