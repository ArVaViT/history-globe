id: where-was-elijah-taken-up
question:
  en: "Where was Elijah taken up into heaven?"
  ru: "Где Илия был взят на небо?"
  uk: "Де Іллю було взято на небо?"
  es: "¿Dónde fue elevado Elías al cielo?"
  pt: "Onde Elias foi levado ao céu?"
  de: "Wo wurde Elia in den Himmel aufgenommen?"
  fr: "Où Élie fut-il enlevé au ciel ?"
  pl: "Gdzie Eliasz został wzięty do nieba?"
  it: "Dove fu rapito in cielo Elia?"
  nl: "Waar werd Elia ten hemel opgenomen?"
  cs: "Kde byl Elijáš vzat do nebe?"
  sv: "Var upptogs Elia till himlen?"
  nb: "Hvor ble Elia tatt opp til himmelen?"
  tl: "Saan itinaas si Elias sa langit?"
  da: "Hvor blev Elija optaget til himlen?"
answer:
  en:
    - "East of the Jordan, opposite Jericho: Elijah and Elisha crossed the river on dry ground, and as they walked on, a chariot of fire parted them and “Elijah went up by a whirlwind into heaven”. The Bible names no spot beyond the river. The map point for the Jordan stands about 16 km from Jericho and 31 km from Jerusalem in a straight line; tradition shows the place at Elijah's Hill, Tell al-Kharrar, in Wadi al-Kharrar on the Jordanian bank, beside the ford of al-Maghtas that is also held to be the place of Jesus' baptism, about 11 km from Jericho."
    - "The last journey is told stage by stage. “Elijah went with Elisha from Gilgal”, then “they went down to Beth-el”, then “they came to Jericho”, and at each place Elisha refused to leave him. At the Jordan “fifty men of the sons of the prophets went, and stood to view afar off”, and “Elijah took his mantle, and wrapped it together, and smote the waters, and they were divided hither and thither”. Elisha asked for a double portion of his spirit, saw him taken and cried, “My father, my father, the chariot of Israel, and the horsemen thereof”; then he struck the water with the fallen mantle and crossed back alone. Since the road “went down” to Bethel, the Gilgal of this chapter is often put on the hills north of Bethel, at Jiljiliya, where the map follows OpenBible; others take it for the Gilgal by Jericho."
    - "The place echoes two others. Moses had died on Mount Nebo “over against Jericho”, about 16 km beyond the river point, and Israel had crossed the Jordan dry-shod into the land at the same reach; Elijah leaves it the way they came. Malachi promised, “Behold, I will send you Elijah the prophet before the coming of the great and dreadful day of the LORD”, and Jesus said of John, who baptized at this ford, “this is Elias, which was for to come”. The year is not given: the story stands after the death of Ahaziah of Israel, about 852 BC, and Elisha is already named as Elijah's servant in the next reign, so the map uses about 850 BC; a letter from Elijah to Jehoram of Judah in Chronicles is read either as sent earlier or as written beforehand."
  ru:
    - "К востоку от Иордана, напротив Иерихона: Илия и Елисей перешли реку посуху, и когда они шли дальше, колесница огненная разлучила их, «и понесся Илия в вихре на небо». Места за рекой Библия не называет. Точка карты для Иордана стоит примерно в 16 км от Иерихона и в 31 км от Иерусалима по прямой; предание показывает это место на холме Илии, Телль-эль-Харрар, в вади Харрар на иорданском берегу, рядом с бродом аль-Махтас, где почитают и место Крещения Иисуса, примерно в 11 км от Иерихона."
    - "Последний путь описан по остановкам. «Шел Илия с Елисеем из Галгала», потом «пошли они в Вефиль», потом «пришли в Иерихон», и всякий раз Елисей отказывался оставить его. У Иордана «пятьдесят человек из сынов пророческих пошли и стали вдали напротив их», и «взял Илия милоть свою, и свернул, и ударил ею по воде, и расступилась она туда и сюда». Елисей попросил, чтобы дух Илии был на нём вдвойне, увидел, как его взяли, и воскликнул: «отец мой, отец мой, колесница Израиля и конница его!» — а потом ударил по воде упавшей милотью и перешёл назад один. Поскольку в еврейском тексте из Галгала в Вефиль «спускаются», Галгал этой главы часто помещают в горах к северу от Вефиля, у Джильджилии, как и карта вслед за OpenBible; другие считают его Галгалом у Иерихона."
    - "Это место перекликается с двумя другими. Моисей умер на горе Нево, «что против Иерихона», примерно в 16 км от точки реки, и на этом же участке Израиль перешёл Иордан посуху, входя в землю; Илия покидает её тем же путём. Малахия обещал: «Вот, Я пошлю к вам Илию, пророка, пред наступлением дня Господня, великого и страшного», а Иисус сказал об Иоанне, крестившем у этого брода: «он есть Илия, которому должно придти». Год не назван: рассказ стоит после смерти Охозии Израильского, около 852 г. до н. э., а в следующее царствование Елисей уже назван слугой Илии, поэтому карта берёт около 850 г. до н. э.; письмо Илии Иораму Иудейскому в Паралипоменоне объясняют либо как посланное раньше, либо как написанное заранее."
  uk:
    - "На схід від Йордану, навпроти Єрихону: Ілля й Єлисей перейшли річку по сухому, і коли вони йшли далі, вогняна колісниця розлучила їх, і Іллю «понесли … в бурі на небо». Біблія не називає місця за річкою. Точка мапи для Йордану стоїть приблизно за 16 км від Єрихону і за 31 км від Єрусалиму по прямій; традиція показує це місце на Пагорбі Іллі, Тель-аль-Харрар, у Ваді-аль-Харрар на йорданському березі, поряд із бродом аль-Магтас, що його також вважають місцем хрещення Ісуса, приблизно за 11 км від Єрихону."
    - "Остання подорож розповідається етап за етапом. «Йшов Ілия з Елисеєм із Галгалу», потім «пійшли вони в Бетель», потім «пійшли вони в Ерихон», і в кожному місці Єлисей відмовлявся залишити його. Біля Йордану «Пятьдесять же чоловіка синів пророцьких пійшли на бік та й стояли оддалеки їх», і «взяв Елия гуню свою, згорнув її та й ударив по водї, й розступилась вода на обидва боки». Єлисей попросив подвійну частку його духу, побачив, як його взято, і закричав: «Батеньку мій, батеньку! ой колеснице Ізрайлева й візниче його!»; потім він ударив по воді гунею, що впала, і перейшов назад сам. Оскільки дорога «спускалась» до Бет-Ела, Гілгал цього розділу часто ставлять на пагорбах на північ від Бет-Ела, в Джільджілії, де мапа йде за OpenBible; інші вважають його Гілгалом біля Єрихону."
    - "Місце відлунює двох інших. Мойсей помер на горі Нево, «що проти Єрихону», приблизно за 16 км за річковою точкою, а Ізраїль перейшов Йордан по сухому в землю на тому самому відтинку; Ілля залишає її тим шляхом, яким вони прийшли. Малахія обіцяв: «Ось, я пошлю до вас пророка Ілию перед настаннєм дня Господнього, дня великого й страшного», а Ісус сказав про Івана, який хрестив на цьому броді: «він єсть Ілия, що має прийти». Рік не названо: історія стоїть після смерті Охозії Ізраїльського, близько 852 р. до н. е., а Єлисей уже названий слугою Іллі в наступне царювання, тож мапа використовує близько 850 р. до н. е.; лист Іллі до Йорама Юдейського в Хроніках читають або як надісланий раніше, або як написаний наперед."
  es:
    - "Al este del Jordán, frente a Jericó: Elías y Eliseo cruzaron el río en seco, y mientras caminaban, un carro de fuego los separó y «Elías subió al cielo en un torbellino». La Biblia no nombra ningún lugar más allá del río. El punto del mapa para el Jordán está a unos 16 km de Jericó y 31 km de Jerusalén en línea recta; la tradición muestra el lugar en la Colina de Elías, Tell al-Kharrar, en el uadi al-Kharrar, en la orilla jordana, junto al vado de al-Maghtas, que se tiene también por el lugar del bautismo de Jesús, a unos 11 km de Jericó."
    - "El último viaje se cuenta etapa por etapa. «Elías venía con Eliseo de Gilgal», luego «Descendieron pues á Beth-el», luego «Vinieron pues á Jericó», y en cada lugar Eliseo se negó a dejarlo. En el Jordán «vinieron cincuenta varones de los hijos de los profetas, y paráronse enfrente á lo lejos», y «Tomando entonces Elías su manto, doblólo, é hirió las aguas, las cuales se apartaron á uno y á otro lado». Eliseo pidió una porción doble de su espíritu, lo vio ser quitado y clamó: «¡Padre mío, padre mío, carro de Israel y su gente de á caballo!»; luego golpeó el agua con el manto caído y cruzó de vuelta solo. Como el camino «descendía» a Betel, la Gilgal de este capítulo suele situarse en las colinas al norte de Betel, en Jiljiliya, donde el mapa sigue a OpenBible; otros la toman por la Gilgal junto a Jericó."
    - "El lugar evoca otros dos. Moisés había muerto en el monte Nebo, «enfrente de Jericó», a unos 16 km más allá del punto del río, e Israel había cruzado el Jordán a pie enjuto hacia la tierra en el mismo tramo; Elías la deja por donde ellos entraron. Malaquías prometió: «He aquí, yo os envío á Elías el profeta, antes que venga el día de Jehová grande y terrible», y Jesús dijo de Juan, que bautizaba en este vado: «él es aquel Elías que había de venir». No se da el año: la historia sigue a la muerte de Ocozías de Israel, hacia el 852 a. C., y Eliseo ya aparece como siervo de Elías en el reinado siguiente, de modo que el mapa usa hacia el 850 a. C.; una carta de Elías a Joram de Judá en Crónicas se lee o bien como enviada antes o bien como escrita de antemano."
  pt:
    - "A leste do Jordão, defronte de Jericó: Elias e Eliseu atravessaram o rio em terra seca, e enquanto caminhavam um carro de fogo os separou e “Elias subiu ao céu em um redemoinho”. A Bíblia não nomeia nenhum ponto além do rio. O ponto do mapa para o Jordão fica a cerca de 16 km de Jericó e 31 km de Jerusalém em linha reta; a tradição mostra o lugar na Colina de Elias, Tell al-Kharrar, no uádi al-Kharrar, na margem jordaniana, junto ao vau de al-Maghtas, que também se tem por lugar do batismo de Jesus, a cerca de 11 km de Jericó."
    - "A última viagem é contada etapa por etapa. “Elias partiu de Gilgal com Eliseu”, depois “eles desceram a Betel”, depois “eles foram a Jericó”, e em cada lugar Eliseu recusou deixá-lo. No Jordão “cinquenta homens dos filhos dos profetas foram e pararam em frente a eles, a certa distância”, e “Elias pegou o seu manto, enrolou-o e feriu as águas; e elas se dividiram para um lado e para o outro”. Eliseu pediu uma porção dobrada de seu espírito, viu-o ser tomado e clamou: “Meu pai, meu pai, os carros de Israel e seus cavaleiros!”; depois feriu a água com o manto caído e atravessou de volta sozinho. Como a estrada “desceu” a Betel, o Gilgal deste capítulo costuma ser posto nos montes ao norte de Betel, em Jiljiliya, onde o mapa segue o OpenBible; outros o tomam pelo Gilgal junto a Jericó."
    - "O lugar ecoa dois outros. Moisés morrera no monte Nebo “em frente a Jericó”, a cerca de 16 km além do ponto do rio, e Israel atravessara o Jordão a pé enxuto para a terra no mesmo trecho; Elias a deixa pelo caminho por onde eles vieram. Malaquias prometeu: “Eis que eu lhes enviarei o profeta Elias antes que venha o grande e terrível dia do SENHOR”, e Jesus disse de João, que batizava neste vau, “ele é o Elias que estava para vir”. O ano não é dado: a história vem depois da morte de Acazias de Israel, por volta de 852 a.C., e Eliseu já é nomeado servo de Elias no reinado seguinte, por isso o mapa usa cerca de 850 a.C.; uma carta de Elias a Jeorão de Judá em Crônicas é lida ou como enviada antes ou como escrita de antemão."
  de:
    - "Östlich des Jordan, gegenüber von Jericho: Elia und Elisa durchquerten den Fluss auf trockenem Boden, und als sie weitergingen, trennte sie ein feuriger Wagen, und „Elia fuhr also im Wetter gen Himmel“. Die Bibel nennt keinen Ort jenseits des Flusses. Der Kartenpunkt für den Jordan liegt in der Luftlinie etwa 16 km von Jericho und 31 km von Jerusalem; die Überlieferung zeigt die Stelle am Elijahügel, Tell al-Charrar, im Wadi al-Charrar am jordanischen Ufer, neben der Furt al-Maghtas, die auch als Ort der Taufe Jesu gilt, etwa 11 km von Jericho."
    - "Die letzte Reise wird Station für Station erzählt. Es „gingen Elia und Elisa von Gilgal“, dann „hinab gen Beth-El“, dann „gen Jericho“, und an jedem Ort weigerte sich Elisa, ihn zu verlassen. Am Jordan „fünfzig Männer unter der Propheten Kindern gingen hin und traten gegenüber von ferne“, und „Da nahm Elia seinen Mantel und wickelte ihn zusammen und schlug ins Wasser; das teilte sich auf beiden Seiten“. Elisa bat um ein doppeltes Teil seines Geistes, sah ihn entrückt und rief: „Vater, mein Vater, Wagen Israels und seine Reiter!“; dann schlug er mit dem herabgefallenen Mantel ins Wasser und ging allein zurück. Da die Straße nach Bethel „hinab“ ging, setzt man das Gilgal dieses Kapitels oft auf die Höhen nördlich von Bethel, bei Dschildschilija, wo die Karte OpenBible folgt; andere halten es für das Gilgal bei Jericho."
    - "Der Ort hallt zwei andere wider. Mose war auf dem Berg Nebo „gegenüber Jericho“ gestorben, etwa 16 km jenseits des Flusspunkts, und Israel war an derselben Stelle trockenen Fußes in das Land gezogen; Elia verlässt es auf dem Weg, den sie kamen. Maleachi verhieß: „Siehe, ich will euch senden den Propheten Elia, ehe denn da komme der große und schreckliche Tag des HERRN“, und Jesus sagte von Johannes, der an dieser Furt taufte: „er ist Elia, der da soll zukünftig sein“. Das Jahr wird nicht genannt: Die Erzählung steht nach dem Tod Ahasjas von Israel, um 852 v. Chr., und Elisa wird in der nächsten Regierung bereits als Elias Diener genannt, daher verwendet die Karte etwa 850 v. Chr.; ein Brief Elias an Joram von Juda in der Chronik wird entweder als früher gesandt oder als vorab geschrieben gelesen."
  fr:
    - "À l’est du Jourdain, en face de Jéricho : Élie et Élisée traversèrent le fleuve à sec, et tandis qu’ils marchaient, un char de feu les sépara et « Élie monta au ciel dans un tourbillon ». La Bible ne nomme aucun lieu au-delà du fleuve. Le point de la carte pour le Jourdain est à environ 16 km de Jéricho et à 31 km de Jérusalem en ligne droite ; la tradition montre le lieu à la colline d’Élie, Tell al-Kharrar, dans l’oued al-Kharrar, sur la rive jordanienne, près du gué d’al-Maghtas, tenu aussi pour le lieu du baptême de Jésus, à environ 11 km de Jéricho."
    - "Le dernier voyage est raconté étape par étape. « Élie partait de Guilgal avec Élisée », puis « ils descendirent à Béthel », puis « ils arrivèrent à Jéricho », et en chaque lieu Élisée refusa de le quitter. Au Jourdain, « cinquante hommes d’entre les fils des prophètes arrivèrent et s’arrêtèrent à distance vis-à-vis », et « Élie prit son manteau, le roula, et en frappa les eaux, qui se partagèrent çà et là ». Élisée demanda une double portion de son esprit, le vit enlevé et cria : « Mon père ! Mon père ! Char d’Israël et sa cavalerie ! » ; puis il frappa l’eau avec le manteau tombé et repassa seul. Comme la route « descendait » à Béthel, le Guilgal de ce chapitre est souvent placé sur les collines au nord de Béthel, à Jiljiliya, où la carte suit OpenBible ; d’autres y voient le Guilgal près de Jéricho."
    - "Le lieu fait écho à deux autres. Moïse était mort sur le mont Nebo « vis-à-vis de Jéricho », à environ 16 km au-delà du point du fleuve, et Israël avait passé le Jourdain à pied sec dans le pays au même endroit ; Élie le quitte comme ils étaient venus. Malachie promit : « Voici, je vous enverrai Élie, le prophète, avant que le jour de l’Éternel arrive, ce jour grand et redoutable », et Jésus dit de Jean, qui baptisait à ce gué : « c’est lui qui est l’Élie qui devait venir ». L’année n’est pas donnée : le récit suit la mort d’Achazia d’Israël, vers 852 av. J.-C., et Élisée est déjà nommé serviteur d’Élie au règne suivant, si bien que la carte retient vers 850 av. J.-C. ; une lettre d’Élie à Joram de Juda dans les Chroniques se lit soit comme envoyée plus tôt, soit comme écrite d’avance."
  pl:
    - "Na wschód od Jordanu, naprzeciw Jerycha: Eliasz i Elizeusz przeszli rzekę po suchym gruncie, a gdy szli dalej, ognisty wóz rozdzielił ich i „wstąpił Elijasz w wichrze do nieba”. Biblia nie wymienia żadnego miejsca za rzeką. Punkt na mapie dla Jordanu stoi około 16 km od Jerycha i 31 km od Jerozolimy w linii prostej; tradycja wskazuje miejsce na Wzgórzu Eliasza, Tell al-Charrar, w Wadi al-Charrar na brzegu jordańskim, obok brodu al-Maghtas, uważanego też za miejsce chrztu Jezusa, około 11 km od Jerycha."
    - "Ostatnią podróż opowiada się etapami. „Wyszedł Elijasz z Elizeuszem z Galgal”, potem „przyszli do Betel”, potem „przyszli do Jerycha”, i w każdym miejscu Elizeusz odmawiał opuszczenia go. Nad Jordanem „pięćdziesiąt mężów synów prorockich szli, i stanęli naprzeciwko z daleko”, a „wziąwszy Elijasz płaszcz swój, zwinął go, a uderzył nim wody, i rozdzieliły się tam i sam”. Elizeusz poprosił o podwójny udział w jego duchu, ujrzał, jak został wzięty, i zawołał: „Ojcze mój, ojcze mój! Wozie Izraelski i jazdo jego”; potem uderzył wodę upadłym płaszczem i przeszedł z powrotem sam. Ponieważ droga „schodziła” do Betel, Gilgal z tego rozdziału umieszcza się często na wzgórzach na północ od Betel, w Dżiladżilija, za czym idzie mapa według OpenBible; inni biorą je za Gilgal koło Jerycha."
    - "Miejsce przywołuje dwa inne. Mojżesz umarł na górze Nebo, „na przeciwko Jerychu”, około 16 km za punktem nad rzeką, a Izrael przeszedł Jordan suchą nogą do ziemi w tym samym odcinku; Eliasz opuszcza ją tą samą drogą, którą oni przyszli. Malachiasz obiecał: „Oto, Ja wam poślę Elijasza proroka, pierwej niż przyjdzie on wielki i straszny dzień Pański”, a Jezus powiedział o Janie, który chrzcił na tym brodzie: „onci jest Elijasz, który miał przyjść”. Roku nie podano: opowieść stoi po śmierci Ochozjasza z Izraela, około 852 p.n.e., a Elizeusz jest już nazwany sługą Eliasza za następnego panowania, więc mapa używa około 850 p.n.e.; list Eliasza do Jorama z Judy w Księgach Kronik odczytuje się albo jako wysłany wcześniej, albo jako napisany z góry."
  it:
    - "A est del Giordano, di fronte a Gerico: Elia ed Eliseo attraversarono il fiume all’asciutto, e mentre proseguivano un carro di fuoco li separò ed «Elia salì al cielo in un turbine». La Bibbia non nomina alcun luogo oltre il fiume. Il punto della mappa per il Giordano sta a circa 16 km da Gerico e 31 km da Gerusalemme in linea retta; la tradizione mostra il luogo alla Collina di Elia, Tell al-Kharrar, nel Wadi al-Kharrar sulla riva giordana, accanto al guado di al-Maghtas, ritenuto anche il luogo del battesimo di Gesù, a circa 11 km da Gerico."
    - "L’ultimo viaggio è raccontato tappa per tappa. «Elia si partì da Ghilgal con Eliseo», poi «discesero a Bethel», poi «se ne vennero a Gerico», e a ogni tappa Eliseo rifiutò di lasciarlo. Al Giordano «cinquanta uomini di tra i discepoli dei profeti andarono dietro a loro e si fermarono dirimpetto al Giordano, da lungi», ed «Elia prese il suo mantello, lo rotolò, e percosse le acque, le quali si divisero di qua e di là». Eliseo chiese una parte doppia del suo spirito, lo vide rapito e gridò: «Padre mio, padre mio! Carro d’Israele e sua cavalleria!»; poi percosse l’acqua con il mantello caduto e tornò indietro da solo. Poiché la strada «scendeva» a Betel, il Gàlgala di questo capitolo è spesso posto sulle colline a nord di Betel, a Jiljiliya, dove la mappa segue OpenBible; altri lo ritengono il Gàlgala presso Gerico."
    - "Il luogo richiama altri due. Mosè era morto sul Monte Nebo «difaccia a Gerico», a circa 16 km oltre il punto sul fiume, e Israele aveva attraversato il Giordano all’asciutto nello stesso tratto per entrare nella terra; Elia la lascia per la via per cui essi erano venuti. Malachia promise: «Ecco, io vi mando Elia, il profeta, prima che venga il giorno dell’Eterno, giorno grande e spaventevole», e Gesù disse di Giovanni, che battezzava a questo guado: «egli è l’Elia che dovea venire». L’anno non è dato: la storia si colloca dopo la morte di Acazia d’Israele, intorno all’852 a.C., ed Eliseo è già nominato servo di Elia nel regno seguente, così la mappa usa l’850 a.C. circa; una lettera di Elia a Ioram di Giuda nelle Cronache è letta o come inviata prima o come scritta in anticipo."
  nl:
    - "Ten oosten van de Jordaan, tegenover Jericho: Elia en Elisa staken de rivier droog over, en terwijl zij verder liepen, scheidde een vurige wagen hen en “voer Elia met een onweder ten hemel”. De Bijbel noemt geen plek voorbij de rivier. Het punt op de kaart voor de Jordaan staat hemelsbreed ongeveer 16 km van Jericho en 31 km van Jeruzalem; de overlevering toont de plek bij Elia’s Heuvel, Tell al-Kharrar, in de Wadi al-Kharrar op de Jordaanse oever, naast de voorde van al-Maghtas die ook als de plaats van Jezus’ doop geldt, ongeveer 11 km van Jericho."
    - "De laatste reis wordt etappe na etappe verteld. “Elia met Elisa ging van Gilgal”, daarna “gingen zij af naar Beth-El”, daarna “kwamen zij te Jericho”, en bij elke plaats weigerde Elisa hem te verlaten. Aan de Jordaan “En vijftig mannen van de zonen der profeten gingen henen, en stonden tegenover van verre”, en “Toen nam Elia zijn mantel, en wond hem samen, en sloeg het water, en het werd herwaarts en derwaarts verdeeld”. Elisa vroeg een dubbel deel van zijn geest, zag hem opgenomen worden en riep: “Mijn vader, mijn vader, wagen Israels en zijn ruiteren!”; daarna sloeg hij het water met de gevallen mantel en stak alleen terug. Omdat de weg naar Bethel “afging”, wordt het Gilgal van dit hoofdstuk vaak op de heuvels ten noorden van Bethel geplaatst, bij Jiljiliya, waar de kaart OpenBible volgt; anderen houden het voor het Gilgal bij Jericho."
    - "De plaats echoot twee andere. Mozes was gestorven op de berg Nebo “recht tegenover Jericho”, ongeveer 16 km voorbij het rivierpunt, en Israël was bij hetzelfde stuk de Jordaan droogvoets overgestoken het land in; Elia verlaat het zoals zij kwamen. Maleachi beloofde: “Ziet, Ik zende ulieden den profeet Elia, eer dat die grote en die vreselijke dag des HEEREN komen zal”, en Jezus zei van Johannes, die bij deze voorde doopte: “hij is Elias, die komen zou”. Het jaar wordt niet genoemd: het verhaal staat na de dood van Achazia van Israël, omstreeks 852 v.Chr., en Elisa wordt in de volgende regering al als Elia’s dienaar genoemd, zodat de kaart ongeveer 850 v.Chr. gebruikt; een brief van Elia aan Joram van Juda in Kronieken wordt gelezen als eerder verzonden of als vooraf geschreven."
  cs:
    - "Východně od Jordánu, naproti Jerichu: Elijáš a Elíša přešli řeku po suchu a když šli dál, rozdělil je ohnivý vůz a „vstoupil Eliáš u vichru do nebe“. Bible nejmenuje žádné místo za řekou. Bod na mapě pro Jordán stojí asi 16 km od Jericha a 31 km od Jeruzaléma vzdušnou čarou; tradice ukazuje místo na Elijášově pahorku, Tell al-Charrár, ve Wádí al-Charrár na jordánském břehu, vedle brodu al-Maghtas, který se také pokládá za místo Ježíšova křtu, asi 11 km od Jericha."
    - "Poslední cesta je vyprávěna po etapách. „Vyšel Eliáš s Elizeem z Galgala“, potom „přišli do Bethel“, potom „přišli do Jericha“ a na každém místě Elíša odmítl ho opustit. U Jordánu „padesáte pak mužů z synů prorockých šli, a postavili se naproti zdaleka“ a „vzav Eliáš plášť svůj, svinul jej a udeřil na vodu. I rozdělila se sem i tam“. Elíša požádal o dvojnásobný díl jeho ducha, viděl ho vzatého a volal: „Otče můj, otče můj! Vozové Izraelští i jezdci jeho!“; pak udeřil na vodu spadlým pláštěm a přešel zpět sám. Protože se do Bét-elu „sestupuje“, klade se Gilgal této kapitoly často na hory severně od Bét-elu, do Džiljílíje, kde mapa sleduje OpenBible; jiní ho pokládají za Gilgal u Jericha."
    - "Místo připomíná dvě další. Mojžíš zemřel na hoře Nebo „proti Jerichu“, asi 16 km za bodem u řeky, a Izrael přešel Jordán suchou nohou do země na témže úseku řeky; Elijáš ji opouští cestou, kterou přišli. Malachiáš zaslíbil: „Aj, já pošli vám Eliáše proroka, prvé nežli přijde den Hospodinův veliký a hrozný“ a Ježíš o Janovi, který na tomto brodu křtil, řekl: „Onť jest Eliáš, kterýž přijíti měl.“ Rok není uveden: příběh stojí po smrti Achazjáše Izraelského, asi 852 př. n. l., a Elíša je již jmenován jako Elijášův sluha v následující vládě, a proto mapa užívá asi 850 př. n. l.; Elijášův list Jehoramovi Judskému v Letopisech se čte buď jako poslaný dříve, nebo jako napsaný předem."
  sv:
    - "Öster om Jordan, mitt emot Jeriko: Elia och Elisha gick över floden på torr mark, och medan de gick vidare skilde en eldvagn dem åt och ”Elia for i stormvinden upp till himmelen”. Bibeln nämner ingen plats bortom floden. Kartpunkten för Jordan står omkring 16 km från Jeriko och 31 km från Jerusalem fågelvägen; traditionen visar platsen vid Elias kulle, Tell al-Kharrar, i Wadi al-Kharrar på den jordanska stranden, intill vadstället al-Maghtas som också hålls för platsen för Jesu dop, omkring 11 km från Jeriko."
    - "Den sista färden berättas etapp för etapp. ”Gingo Elia och Elisa från Gilgal”, sedan ”gingo de ned till Betel”, sedan ”kommo de till Jeriko”, och på varje plats vägrade Elisha lämna honom. Vid Jordan ”gingo femtio män av profetlärjungarna ock åstad och ställde sig på något avstånd, längre bort”, och ”Elia tog sin mantel och vek ihop den och slog på vattnet; då delade sig detta åt två sidor”. Elisha bad om en dubbel arvslott av hans ande, såg honom tas upp och ropade: ”Min fader, min fader! Du som för Israel är både vagnar och ryttare!”; sedan slog han på vattnet med den fallna manteln och gick över tillbaka ensam. Eftersom vägen ”gick ned” till Betel placeras Gilgal i detta kapitel ofta på bergen norr om Betel, vid Jiljiliya, där kartan följer OpenBible; andra tar det för Gilgal vid Jeriko."
    - "Platsen ger eko av två andra. Mose hade dött på berget Nebo ”gent emot Jeriko”, omkring 16 km bortom flodpunkten, och Israel hade gått över Jordan torrskodda in i landet vid samma sträcka; Elia lämnar det på samma väg som de kom. Malaki lovade: ”Se, jag skall sända till eder profeten Elia, förrän HERRENS stora och fruktansvärda dag kommer”, och Jesus sade om Johannes, som döpte vid detta vadställe: ”han är Elias, den som skulle komma”. Året anges inte: berättelsen står efter Achasjas död i Israel, omkring 852 f.Kr., och Elisha nämns redan som Elias tjänare under nästa regering, så kartan använder omkring 850 f.Kr.; ett brev från Elia till Joram av Juda i Krönikeböckerna läses antingen som sänt tidigare eller som skrivet i förväg."
  nb:
    - "Øst for Jordan, midt imot Jeriko: Elia og Elisja krysset elven på tørr grunn, og mens de gikk videre, skilte en ildvogn dem, og «Elias fór i stormen op til himmelen». Bibelen nevner ikke noe sted hinsides elven. Kartpunktet for Jordan står omtrent 16 km fra Jeriko og 31 km fra Jerusalem i luftlinje; tradisjonen viser stedet ved Elias høyde, Tell al-Kharrar, i Wadi al-Kharrar på den jordanske bredden, ved vadestedet al-Maghtas som også regnes for stedet for Jesu dåp, omtrent 11 km fra Jeriko."
    - "Den siste reisen fortelles etappe for etappe. «Gikk Elias og Elisa fra Gilgal», så «gikk de ned til Betel», så «kom de til Jeriko», og på hvert sted nektet Elisja å forlate ham. Ved Jordan gikk femti av profetenes disipler «avsted og blev stående midt imot dem langt borte», og «Da tok Elias sin kappe og rullet den sammen og slo på vannet, og det skilte sig til begge sider». Elisja ba om en dobbel del av hans ånd, så ham tatt bort og ropte: «Min far, min far, Israels vogner og ryttere!»; så slo han på vannet med den falne kappen og gikk alene tilbake. Siden veien «gikk ned» til Betel, plasseres Gilgal i dette kapitlet ofte i åsene nord for Betel, ved Jiljiliya, der kartet følger OpenBible; andre regner det for Gilgal ved Jeriko."
    - "Stedet ekkoer to andre. Moses hadde dødd på Nebo «midt imot Jeriko», omtrent 16 km hinsides elvepunktet, og Israel hadde krysset Jordan tørrskodd inn i landet på den samme strekningen; Elia forlater det den veien de kom. Malaki lovet: «Se, jeg sender eder Elias, profeten, før Herrens dag kommer, den store og forferdelige», og Jesus sa om Johannes, som døpte ved dette vadestedet: «Han er den Elias som skal komme». Året oppgis ikke: fortellingen står etter Ahasjas død i Israel, omkring 852 f.Kr., og Elisja nevnes allerede som Elias' tjener i den neste regjeringen, så kartet bruker omkring 850 f.Kr.; et brev fra Elia til Joram av Juda i Krønikebøkene leses enten som sendt tidligere eller som skrevet på forhånd."
  tl:
    - "Sa silangan ng Jordan, sa tapat ng Jerico: tumawid sa ilog sina Elias at Eliseo sa tuyong lupa, at habang nagpapatuloy sila, naghiwalay sila ng isang karo ng apoy at “si Elias ay sumampa sa langit sa pamamagitan ng isang ipoipo”. Walang pinangalanang lugar ang Biblia sa kabila ng ilog. Ang tuldok sa mapa para sa Jordan ay mga 16 km mula sa Jerico at 31 km mula sa Jerusalem sa tuwid na guhit; ipinakikita ng tradisyon ang lugar sa Burol ni Elias, Tell al-Kharrar, sa Wadi al-Kharrar sa pampang ng Jordan, sa tabi ng tawiran ng al-Maghtas na itinuturing ding lugar ng bautismo ni Jesus, mga 11 km mula sa Jerico."
    - "Yugto-yugto ang huling paglalakbay. “Si Elias ay yumaong kasama ni Eliseo mula sa Gilgal”, “bumaba sila sa Beth-el”, “nagsiparoon sila sa Jerico”, at sa bawat lugar ay tumanggi si Eliseo na iwan siya. Sa Jordan, “limangpu sa mga anak ng mga propeta ay nagsiyaon, at nagsitayo sa tapat nila sa malayo”, at “kinuha ni Elias ang kaniyang balabal, at tiniklop, at hinampas ang tubig, at nahawi dito at doon”. Humingi si Eliseo ng dobleng bahagi ng kaniyang espiritu, nakita siyang itinaas at sumigaw, “Ama ko, ama ko, mga karo ng Israel at mga mangangabayo niyaon!”; hinampas niya ang tubig ng nahulog na balabal at tumawid pabalik nang mag-isa. Yamang “bumaba” ang daan sa Beth-el, madalas ilagay ang Gilgal na ito sa mga burol sa hilaga ng Beth-el, sa Jiljiliya, na sinusunod ng mapa mula sa OpenBible; ang iba, ang Gilgal malapit sa Jerico."
    - "Naghahalintulad ang lugar sa dalawa pa. Namatay si Moises sa Bundok Nebo “na nasa tapat ng Jerico”, mga 16 km sa kabila ng punto ng ilog, at tumawid ang Israel sa Jordan na tuyo ang paa papasok sa lupain sa parehong bahagi; umalis dito si Elias sa daan na pinasok nila. Ipinangako ni Malakias, “aking susuguin sa inyo si Elias na propeta bago dumating ang dakila at kakilakilabot na kaarawan ng Panginoon”, at sinabi ni Jesus tungkol kay Juan, na nagbautismo sa tawirang ito, “siya'y si Elias na paririto”. Hindi ibinibigay ang taon: nasa kuwento pagkamatay ni Ochozias ng Israel, mga 852 BK, at pinangalanan na si Eliseo bilang lingkod ni Elias sa sumunod na paghahari, kaya ginagamit ng mapa ang mga 850 BK; ang liham ni Elias kay Joram ng Juda sa Mga Cronica ay binabasa na ipinadala nang mas maaga o isinulat nang una."
  da:
    - "Øst for Jordan, over for Jeriko: Elija og Elisa krydsede floden på tørt land, og mens de gik videre, skilte en ildvogn dem ad, og »Elias for op i en Storm til Himmelen«. Bibelen nævner intet sted hinsides floden. Kortets punkt for Jordan står omkring 16 km fra Jeriko og 31 km fra Jerusalem i luftlinje; traditionen viser stedet ved Elijas Høj, Tell al-Kharrar, i Wadi al-Kharrar på den jordanske bred, ved siden af vadestedet al-Maghtas, der også anses for stedet for Jesu dåb, omkring 11 km fra Jeriko."
    - "Den sidste rejse fortælles etape for etape. Først »gik Elias og Elisa fra Gilgal«, så »de kom ned til Bethel«, så »de kom til Jeriko«, og ved hvert sted nægtede Elisa at forlade ham. Ved Jordan »halvtredsindstyve Mænd af Profeternes Børn gik frem og stode tværs overfor langtfra«, og så »tog Elias sin Kappe og svøbte den sammen og slog Vandet, og det skiltes ad til begge Sider«. Elisa bad om en dobbelt del af hans ånd, så ham optaget og råbte: »Min Fader, min Fader, Israels Vogne og hans Ryttere!«; så slog han vandet med den faldne kappe og gik alene tilbage. Da vejen »gik ned« til Betel, placeres kapitlets Gilgal ofte på højene nord for Betel, ved Jiljiliya, hvor kortet følger OpenBible; andre tager det for Gilgal ved Jeriko."
    - "Stedet ekkoer to andre. Moses var død på Nebobjerget »lige over for Jeriko«, omkring 16 km hinsides flodpunktet, og Israel var krydset over Jordan tørskoet ind i landet ved samme strækning; Elija forlader det, som de kom. Malakias lovede: »Se, jeg sender eder Elias, Profeten, førend Herrens Dag kommer, den store og den forfærdelige«, og Jesus sagde om Johannes, der døbte ved dette vadested: »Han er Elias, som skal komme«. Året er ikke angivet: historien står efter Akazjas død i Israel, omkring 852 f.Kr., og Elisa nævnes allerede som Elijas tjener i den næste regering, så kortet bruger omkring 850 f.Kr.; et brev fra Elija til Joram af Juda i Krønikebøgerne læses enten som sendt tidligere eller som skrevet på forhånd."
