id: where-was-tarsus
question:
  en: "Where was Tarsus, Paul's home town?"
  ru: "Где находился Тарс, родной город Павла?"
  uk: "Де був Тарс, рідне місто Павла?"
  es: "¿Dónde estaba Tarso, la ciudad natal de Pablo?"
  pt: "Onde ficava Tarso, a cidade natal de Paulo?"
  de: "Wo lag Tarsus, die Heimatstadt des Paulus?"
  fr: "Où se trouvait Tarse, la ville natale de Paul ?"
  pl: "Gdzie leżał Tars, rodzinne miasto Pawła?"
  it: "Dov’era Tarso, la città natale di Paolo?"
  cs: "Kde ležel Tarsos, Pavlovo rodné město?"
  nl: "Waar lag Tarsus, de geboortestad van Paulus?"
  sv: "Var låg Tarsos, Paulus’ hemstad?"
  nb: "Hvor lå Tarsos, Paulus’ hjemby?"
  tl: "Nasaan ang Tarso, ang bayan ni Pablo?"
  da: "Hvor lå Tarsus, Paulus’ hjemby?"
answer:
  en:
    - "Tarsus lies in the plain of Cilicia in southern Turkey, about 20 km inland from the Mediterranean, and is still a city of the same name. It is about 570 km north of Jerusalem in a straight line, about 820 km by the roads on the map, and 135 km west of Antioch in Syria (207 km by road). In antiquity the river Cydnus ran through the city to a lagoon that served as its harbour."
    - 'Paul was born there: "I am a man which am a Jew of Tarsus, a city in Cilicia, a citizen of no mean city", he told the Roman commander in Jerusalem, and then told the crowd that he had been brought up in Jerusalem at the feet of Gamaliel. In Damascus the Lord sent Ananias to seek "Saul, of Tarsus". After his conversion the brethren "brought him down to Caesarea, and sent him forth to Tarsus", and he stayed in Syria and Cilicia until Barnabas came to Tarsus to find him and brought him to Antioch.'
    - "The mound of Gözlükule shows settlement from the Neolithic onward, and Hittite texts name the town Tarsa. In 401 BC Xenophon found it a large and prosperous city, Alexander fell ill there in 333 BC, Mark Antony made it a free city, and in 41 BC Cleopatra sailed up the Cydnus to meet him. Strabo, writing under Augustus, says its people surpassed even Athens and Alexandria in their zeal for philosophy and learning. The emperor Julian was buried in a suburb of Tarsus in 363."
  ru:
    - "Тарс лежит на Киликийской равнине на юге Турции, примерно в 20 км от Средиземного моря, и до сих пор остаётся городом с тем же именем. От Иерусалима до него около 570 км на север по прямой и около 820 км по дорогам на карте, от Антиохии Сирийской — 135 км на запад (207 км по дороге). В древности через город текла река Кидн, впадавшая в лагуну, служившую гаванью."
    - "Здесь родился Павел: «я Иудеянин, Тарсянин, гражданин небезызвестного Киликийского города», — сказал он римскому тысяченачальнику в Иерусалиме, а затем сказал народу, что воспитан в Иерусалиме при ногах Гамалиила. В Дамаске Господь послал Ананию спросить «Тарсянина, по имени Савла». После обращения братия «отправили его в Кесарию и препроводили в Тарс», и он оставался в Сирии и Киликии, пока Варнава не пришёл в Тарс искать его и не привёл в Антиохию."
    - "Холм Гёзлюкуле хранит следы поселения начиная с неолита, а хеттские тексты называют город Тарса. В 401 г. до н. э. Ксенофонт застал его большим и процветающим городом, в 333 г. до н. э. здесь заболел Александр, Марк Антоний сделал Тарс свободным городом, а в 41 г. до н. э. Клеопатра поднялась по Кидну, чтобы встретиться с ним. Страбон, писавший при Августе, говорит, что жители Тарса в любви к философии и учёности превзошли даже Афины и Александрию. В 363 году в предместье Тарса был похоронен император Юлиан."
  uk:
    - "Тарс лежить на Кілікійській рівнині на півдні Туреччини, приблизно за 20 км углиб країни від Середземного моря, і досі є містом з тією самою назвою. Він лежить приблизно за 570 км на північ від Єрусалима по прямій, приблизно за 820 км дорогами на мапі, і за 135 км на захід від Антіохії в Сирії (207 км дорогою). У давнину річка Кідн проходила крізь місто до лагуни, яка слугувала йому гаванню."
    - "Павло народився там: «Я чоловік Жидовин Тарсийський, славного города Киликиї житель», — сказав він римському тисячникові в Єрусалимі, а потім розповів натовпові, що виховувався в Єрусалимі при ногах Гамаліїла. У Дамаску Господь послав Ананію шукати «Тарсянина, на ймя Савла». Після навернення брати «привели в Кесарию, та й вислали його в Тарс», і він пробув у Сирії та Кілікії, поки Варнава не прийшов у Тарс шукати його й не привів до Антіохії."
    - "Пагорб Гезлюкуле показує поселення від неоліту, а хетські тексти називають місто Тарса. 401 р. до н. е. Ксенофонт застав його великим і заможним містом, Александр захворів там 333 р. до н. е., Марк Антоній зробив його вільним містом, а 41 р. до н. е. Клеопатра пливла вгору по Кідну, щоб зустрітися з ним. Страбон, пишучи за Августа, каже, що його жителі переважали навіть Афіни й Александрію в завзятті до філософії та науки. Імператора Юліана було поховано в передмісті Тарса 363 р."
  es:
    - "Tarso se halla en la llanura de Cilicia, en el sur de Turquía, a unos 20 km tierra adentro desde el Mediterráneo, y sigue siendo una ciudad del mismo nombre. Queda a unos 570 km al norte de Jerusalén en línea recta, a unos 820 km por las calzadas del mapa, y a 135 km al oeste de Antioquía de Siria (207 km por calzada). En la Antigüedad el río Cidno atravesaba la ciudad hasta una laguna que le servía de puerto."
    - "Pablo nació allí: «Yo de cierto soy hombre Judío, ciudadano de Tarso, ciudad no obscura de Cilicia», dijo al tribuno romano en Jerusalén, y luego dijo a la multitud que se había criado en Jerusalén a los pies de Gamaliel. En Damasco, el Señor envió a Ananías a buscar a «Saulo, de Tarso». Tras su conversión, los hermanos «le acompañaron hasta Cesarea, y le enviaron á Tarso», y se quedó en Siria y Cilicia hasta que Bernabé fue a Tarso a buscarlo y lo llevó a Antioquía."
    - "El montículo de Gözlükule muestra poblamiento desde el Neolítico, y los textos hititas nombran la ciudad Tarsa. En 401 a. C. Jenofonte la halló grande y próspera, Alejandro enfermó allí en 333 a. C., Marco Antonio la hizo ciudad libre, y en 41 a. C. Cleopatra remontó el Cidno para encontrarse con él. Estrabón, que escribe bajo Augusto, dice que sus habitantes superaban incluso a Atenas y Alejandría en su celo por la filosofía y el saber. El emperador Juliano fue sepultado en un arrabal de Tarso en 363."
  pt:
    - "Tarso fica na planície da Cilícia, no sul da Turquia, a cerca de 20 km para o interior a partir do Mediterrâneo, e ainda é uma cidade com o mesmo nome. Fica a cerca de 570 km ao norte de Jerusalém em linha reta, cerca de 820 km pelas estradas do mapa, e a 135 km a oeste de Antioquia da Síria (207 km por estrada). Na Antiguidade, o rio Cidno atravessava a cidade até uma lagoa que servia de porto."
    - "Paulo nasceu ali: “Eu sou um judeu de Tarso, na Cilícia, cidadão de uma cidade importante”, disse ele ao comandante romano em Jerusalém, e depois disse à multidão que fora criado em Jerusalém aos pés de Gamaliel. Em Damasco, o Senhor enviou Ananias a procurar “Saulo, de Tarso”. Depois da sua conversão, os irmãos “levaram-no para Cesareia e o enviaram para Tarso”, e ele permaneceu na Síria e na Cilícia até que Barnabé veio a Tarso procurá-lo e o levou a Antioquia."
    - "O monte de Gözlükule mostra ocupação desde o Neolítico, e textos hititas nomeiam a cidade Tarsa. Em 401 a.C., Xenofonte a achou uma cidade grande e próspera, Alexandre adoeceu ali em 333 a.C., Marco Antônio fez dela uma cidade livre, e em 41 a.C. Cleópatra subiu o Cidno para encontrá-lo. Estrabão, escrevendo sob Augusto, diz que seu povo superava até Atenas e Alexandria no zelo pela filosofia e pelo saber. O imperador Juliano foi sepultado num subúrbio de Tarso em 363."
  de:
    - "Tarsus liegt in der Ebene Kilikiens in der Südtürkei, etwa 20 km landeinwärts vom Mittelmeer, und ist noch heute eine Stadt desselben Namens. Es liegt in der Luftlinie etwa 570 km nördlich von Jerusalem, auf den Straßen der Karte etwa 820 km, und 135 km westlich von Antiochia in Syrien (207 km auf der Straße). In der Antike floss der Kydnos durch die Stadt zu einer Lagune, die als ihr Hafen diente."
    - "Paulus wurde dort geboren: „Ich bin ein jüdischer Mann von Tarsus, ein Bürger einer namhaften Stadt in Zilizien“, sagte er dem römischen Oberst in Jerusalem und erklärte dann der Menge, er sei in Jerusalem zu den Füßen Gamaliels erzogen worden. In Damaskus sandte der Herr Hananias, „Saul von Tarsus“ zu suchen. Nach seiner Bekehrung „geleiteten“ ihn die Brüder „gen Cäsarea und schickten ihn gen Tarsus“, und er blieb in Syrien und Kilikien, bis Barnabas nach Tarsus kam, um ihn zu suchen, und ihn nach Antiochia brachte."
    - "Der Hügel Gözlükule zeigt Besiedlung seit der Jungsteinzeit, und hethitische Texte nennen die Stadt Tarsa. Im Jahr 401 v. Chr. fand Xenophon sie als große und wohlhabende Stadt, Alexander erkrankte dort 333 v. Chr., Marcus Antonius machte sie zur freien Stadt, und 41 v. Chr. fuhr Kleopatra den Kydnos hinauf, um ihn zu treffen. Strabon, der unter Augustus schrieb, sagt, ihre Bewohner übertrafen selbst Athen und Alexandria im Eifer für Philosophie und Bildung. Der Kaiser Julian wurde 363 in einem Vorort von Tarsus bestattet."
  fr:
    - "Tarse se trouve dans la plaine de Cilicie, dans le sud de la Turquie, à environ 20 km à l’intérieur des terres depuis la Méditerranée, et c’est encore une ville du même nom. Elle est à environ 570 km au nord de Jérusalem à vol d’oiseau, à environ 820 km par les routes de la carte, et à 135 km à l’ouest d’Antioche de Syrie (207 km par la route). Dans l’Antiquité, le fleuve Cydnos traversait la ville jusqu’à une lagune qui lui servait de port."
    - "Paul y est né : « Je suis Juif, … de Tarse en Cilicie, citoyen d’une ville qui n’est pas sans importance », dit-il au tribun romain à Jérusalem, puis il dit à la foule qu’il avait été élevé à Jérusalem, aux pieds de Gamaliel. À Damas, le Seigneur envoya Ananias chercher « un nommé Saul de Tarse ». Après sa conversion, les frères « l’emmenèrent à Césarée, et le firent partir pour Tarse », et il resta en Syrie et en Cilicie jusqu’à ce que Barnabas vienne le chercher à Tarse et l’amène à Antioche."
    - "Le tertre de Gözlükule montre une occupation dès le néolithique, et des textes hittites nomment la ville Tarsa. En 401 av. J.-C., Xénophon la trouva grande et prospère, Alexandre y tomba malade en 333 av. J.-C., Marc Antoine en fit une ville libre, et en 41 av. J.-C. Cléopâtre remonta le Cydnos pour le rejoindre. Strabon, écrivant sous Auguste, dit que ses habitants surpassaient même Athènes et Alexandrie par leur zèle pour la philosophie et le savoir. L’empereur Julien fut enterré dans un faubourg de Tarse en 363."
  pl:
    - "Tars leży na równinie Cylicji w południowej Turcji, około 20 km w głąb lądu od Morza Śródziemnego, i wciąż jest miastem o tej samej nazwie. Leży około 570 km na północ od Jerozolimy w linii prostej, około 820 km drogami z mapy, i 135 km na zachód od Antiochii w Syrii (207 km drogą). W starożytności rzeka Kydnos płynęła przez miasto do laguny, która służyła mu za port."
    - "Paweł się tam urodził: „Jamci jest człowiek Żyd Tarseńczyk, mieszczanin nie z podłego miasta w Cylicyi”, powiedział rzymskiemu dowódcy w Jerozolimie, a potem powiedział tłumowi, że wychowano go w Jerozolimie u stóp Gamaliela. W Damaszku Pan posłał Ananiasza, by szukał „Saula imieniem Tarseńczyka”. Po jego nawróceniu bracia „odprowadzili go do Cezaryi i odesłali go do Tarsu”, a on przebywał w Syrii i Cylicji, aż Barnaba przyszedł do Tarsu, by go znaleźć, i przyprowadził go do Antiochii."
    - "Wzgórze Gözlükule wykazuje osadnictwo od neolitu, a teksty hetyckie nazywają miasto Tarsa. W 401 p.n.e. Ksenofont zastał je jako duże i zamożne miasto, Aleksander zachorował tu w 333 p.n.e., Marek Antoniusz uczynił je wolnym miastem, a w 41 p.n.e. Kleopatra wpłynęła w górę Kydnosu, by się z nim spotkać. Strabon, pisząc za Augusta, mówi, że jego mieszkańcy przewyższali nawet Ateny i Aleksandrię w gorliwości dla filozofii i nauki. Cesarz Julian został pochowany na przedmieściu Tarsu w 363."
  it:
    - "Tarso si trova nella pianura della Cilicia, nella Turchia meridionale, a circa 20 km nell’entroterra dal Mediterraneo, ed è ancora una città con lo stesso nome. Dista circa 570 km a nord di Gerusalemme in linea d’aria, circa 820 km lungo le strade della mappa, e 135 km a ovest di Antiochia di Siria (207 km per strada). Nell’antichità il fiume Cidno attraversava la città fino a una laguna che serviva da porto."
    - "Paolo vi nacque: «Io sono un Giudeo, di Tarso, cittadino di quella non oscura città di Cilicia», disse al comandante romano a Gerusalemme, e poi disse alla folla di essere stato allevato a Gerusalemme ai piedi di Gamaliele. A Damasco il Signore mandò Anania a cercare «Saulo, da Tarso». Dopo la sua conversione i fratelli «lo condussero a Cesarea, e di là lo mandarono a Tarso», ed egli rimase in Siria e in Cilicia finché Barnaba venne a Tarso a cercarlo e lo portò ad Antiochia."
    - "Il tell di Gözlükule mostra insediamenti dal Neolitico in poi, e testi ittiti nominano la città Tarsa. Nel 401 a.C. Senofonte la trovò una città grande e prospera, Alessandro vi si ammalò nel 333 a.C., Marco Antonio ne fece una città libera, e nel 41 a.C. Cleopatra risalì il Cidno per incontrarlo. Strabone, scrivendo sotto Augusto, dice che i suoi abitanti superavano persino Atene e Alessandria nello zelo per la filosofia e il sapere. L’imperatore Giuliano fu sepolto in un sobborgo di Tarso nel 363."
  cs:
    - "Tarsos leží v Kilikijské rovině v jižním Turecku, asi 20 km ve vnitrozemí od Středozemního moře, a je dosud městem téhož jména. Je vzdušnou čarou asi 570 km severně od Jeruzaléma, asi 820 km po silnicích na mapě, a 135 km západně od syrské Antiochie (207 km po silnici). Ve starověku protékala městem řeka Kydnos do laguny, která mu sloužila jako přístav."
    - "Pavel se tam narodil: „Jáť jsem člověk Žid Tarsenský, neposledního města Cilické země obyvatel“, řekl římskému veliteli v Jeruzalémě, a pak řekl zástupu, že byl vychován v Jeruzalémě u nohou Gamalielových. V Damašku poslal Pán Ananiáše hledat „Saule, jménem Tarsenského“. Po jeho obrácení ho bratří „dovedli do Cesaree, a poslali jej do Tarsu“ a zůstal v Sýrii a Kilikii, dokud pro něj Barnabáš nepřišel do Tarsu a nepřivedl ho do Antiochie."
    - "Pahorek Gözlükule vykazuje osídlení od neolitu a chetitské texty nazývají město Tarsa. Roku 401 př. n. l. je Xenofón shledal rozlehlým a prosperujícím městem, Alexandr tam roku 333 př. n. l. onemocněl, Marcus Antonius z něj učinil svobodné město a roku 41 př. n. l. Kleopatra vyplula po Kydnu, aby se s ním setkala. Strabón, píšící za Augusta, říká, že jeho obyvatelé předčili i Atény a Alexandrii v horlivosti pro filozofii a vzdělanost. Císař Julianus byl roku 363 pohřben na předměstí Tarsu."
  nl:
    - "Tarsus ligt in de vlakte van Cilicië in het zuiden van Turkije, ongeveer 20 km landinwaarts van de Middellandse Zee, en is nog steeds een stad met dezelfde naam. Het ligt hemelsbreed ongeveer 570 km ten noorden van Jeruzalem, ongeveer 820 km via de wegen op de kaart, en 135 km ten westen van Antiochië in Syrië (207 km via de weg). In de oudheid liep de rivier de Cydnus door de stad naar een lagune die als haven diende."
    - "Paulus werd daar geboren: “Ik ben een Joods man van Tarsen, een burger van geen onvermaarde stad in Cilicië”, zei hij tot de Romeinse bevelhebber in Jeruzalem, en vertelde daarna de menigte dat hij in Jeruzalem was opgevoed aan de voeten van Gamaliël. In Damascus zond de Heer Ananias om “Saulus, van Tarsen” te zoeken. Na zijn bekering verstonden de broeders het gevaar en “geleidden hem tot Cesarea, en zonden hem af naar Tarsen”, en hij bleef in Syrië en Cilicië totdat Barnabas naar Tarsus kwam om hem te zoeken en hem naar Antiochië bracht."
    - "De heuvel Gözlükule toont bewoning vanaf het Neolithicum, en Hettitische teksten noemen de stad Tarsa. In 401 v.Chr. vond Xenofon haar een grote en welvarende stad, in 333 v.Chr. werd Alexander er ziek, Marcus Antonius maakte haar tot vrije stad, en in 41 v.Chr. voer Cleopatra de Cydnus op om hem te ontmoeten. Strabo, die onder Augustus schreef, zegt dat haar inwoners zelfs Athene en Alexandrië overtroffen in hun ijver voor filosofie en wetenschap. Keizer Julianus werd in 363 begraven in een voorstad van Tarsus."
  sv:
    - "Tarsos ligger på Kilikiens slätt i södra Turkiet, omkring 20 km inåt landet från Medelhavet, och är fortfarande en stad med samma namn. Det är omkring 570 km norr om Jerusalem i fågelvägen, omkring 820 km längs vägarna på kartan, och 135 km väster om Antiochia i Syrien (207 km längs vägen). I antiken rann floden Kydnos genom staden till en lagun som fungerade som dess hamn."
    - "Paulus föddes där: ”Jag är en judisk man från Tarsus, medborgare alltså i en betydande stad i Cilicien”, sade han till den romerske översten i Jerusalem, och sedan berättade han för folket att han hade blivit uppfostrad i Jerusalem vid Gamaliels fötter. I Damaskus sände Herren Ananias för att söka upp ”Saulus, från Tarsus”. Efter hans omvändelse ”förde de honom ned till Cesarea och sände honom därifrån vidare till Tarsus”, och han stannade i Syrien och Kilikien tills Barnabas kom till Tarsos för att söka upp honom och förde honom till Antiochia."
    - "Kullen Gözlükule visar bosättning från yngre stenåldern och framåt, och hettitiska texter nämner staden som Tarsa. År 401 f.Kr. fann Xenofon den som en stor och välmående stad, Alexander insjuknade där 333 f.Kr., Marcus Antonius gjorde den till en fri stad, och 41 f.Kr. seglade Kleopatra uppför Kydnos för att möta honom. Strabon, som skrev under Augustus, säger att dess folk överträffade till och med Aten och Alexandria i nit för filosofi och lärdom. Kejsar Julianus begravdes i en förort till Tarsos år 363."
  nb:
    - "Tarsos ligger på slettene i Kilikia i Sør-Tyrkia, omtrent 20 km inne i landet fra Middelhavet, og er fortsatt en by med samme navn. Den ligger omtrent 570 km nord for Jerusalem i luftlinje, omtrent 820 km langs veiene på kartet, og 135 km vest for Antiokia i Syria (207 km langs vei). I antikken rant elven Kydnos gjennom byen til en lagune som tjente som havn."
    - "Paulus ble født der: «Jeg er en jøde, fra Tarsus, borger av en ikke ukjent by i Kilikia», sa han til den romerske befalingsmannen i Jerusalem, og fortalte så folket at han var oppfostret i Jerusalem ved Gamaliels føtter. I Damaskus sendte Herren Ananias for å oppsøke «Saulus, fra Tarsus». Etter omvendelsen «førte de ham ned til Cesarea, og sendte ham derfra til Tarsus», og han ble i Syria og Kilikia til Barnabas kom til Tarsos for å finne ham og førte ham til Antiokia."
    - "Haugen Gözlükule viser bosetting fra yngre steinalder og utover, og hettittiske tekster kaller byen Tarsa. I 401 f.Kr. fant Ksenofon den som en stor og velstående by, Aleksander ble syk der i 333 f.Kr., Marcus Antonius gjorde den til en fri by, og i 41 f.Kr. seilte Kleopatra opp Kydnos for å møte ham. Strabon, som skrev under Augustus, sier at innbyggerne overgikk til og med Aten og Aleksandria i iver etter filosofi og lærdom. Keiser Julian ble gravlagt i en forstad til Tarsos i 363."
  tl:
    - "Ang Tarso ay nasa kapatagan ng Cilicia sa timog Turkey, mga 20 km sa loob ng lupain mula sa Mediteraneo, at isa pa ring lungsod na may gayunding pangalan. Mga 570 km ito sa hilaga ng Jerusalem sa tuwid na guhit, mga 820 km sa mga daang nasa mapa, at 135 km sa kanluran ng Antioquia sa Siria (207 km sa daan). Noong sinaunang panahon, dumaloy ang ilog Cydnus sa lungsod patungo sa isang lagoon na nagsilbing daungan nito."
    - "Doon ipinanganak si Pablo: “Ako'y Judio, na taga Tarso sa Cilicia, isang mamamayan ng bayang hindi kakaunti ang kahalagahan”, sinabi niya sa kumandanteng Romano sa Jerusalem, at pagkatapos ay sinabi sa karamihan na pinag-aral siya sa Jerusalem sa paanan ni Gamaliel. Sa Damasco isinugo ng Panginoon si Ananias upang hanapin si “Saulo, lalaking taga Tarso”. Pagkatapos ng kaniyang pagbabalik-loob, “inihatid nila siya sa Cesarea, at siya'y sinugo nila sa Tarso”, at nanatili siya sa Siria at Cilicia hanggang sa pumunta si Bernabe sa Tarso upang hanapin siya at dalhin sa Antioquia."
    - "Ipinakikita ng burol ng Gözlükule ang paninirahan mula pa sa Neolitiko, at pinangangalanan ng mga tekstong Hetheo ang bayan na Tarsa. Noong 401 BK nasumpungan ito ni Xenophon na isang malaki at maunlad na lungsod, nagkasakit doon si Alejandro noong 333 BK, ginawa itong malayang lungsod ni Marco Antonio, at noong 41 BK ay naglayag si Cleopatra sa Cydnus upang salubungin siya. Sinasabi ni Strabo, na sumulat sa ilalim ni Augusto, na nahigitan ng mga tao nito maging ang Atenas at Alejandria sa sigasig para sa pilosopiya at pag-aaral. Inilibing si Emperador Juliano sa isang karatig ng Tarso noong 363."
  da:
    - "Tarsus ligger i Kilikiens slette i det sydlige Tyrkiet, ca. 20 km inde i landet fra Middelhavet, og er stadig en by af samme navn. Den ligger ca. 570 km nord for Jerusalem i fugleflugt, ca. 820 km ad vejene på kortet, og 135 km vest for Antiokia i Syrien (207 km ad vej). I antikken løb floden Kydnos gennem byen til en lagune, der tjente som dens havn."
    - "Paulus blev født der: »Jeg er en jødisk Mand fra Tarsus, Borger i en ikke ubekendt By i Kilikien«, sagde han til den romerske kommandant i Jerusalem, og fortalte derpå skaren, at han var »opfostret i denne Stad, oplært ved Gamaliels Fødder«. I Damaskus sendte Herren Ananias for at opsøge »Saulus fra Tarsus«. Efter hans omvendelse førte brødrene ham »ned til Kæsarea og sendte ham videre til Tarsus«, og han blev i Syrien og Kilikien, indtil Barnabas kom til Tarsus for at finde ham og førte ham til Antiokia."
    - "Tellen Gözlükule viser bosættelse fra stenalderen og fremefter, og hittitiske tekster nævner byen som Tarsa. I 401 f.Kr. fandt Xenofon den som en stor og velstående by, Alexander blev syg der i 333 f.Kr., Marcus Antonius gjorde den til fristad, og i 41 f.Kr. sejlede Kleopatra op ad Kydnos for at møde ham. Strabon, der skrev under Augustus, siger, at dens folk overgik selv Athen og Alexandria i iver efter filosofi og lærdom. Kejser Julian blev begravet i en forstad til Tarsus i 363."
