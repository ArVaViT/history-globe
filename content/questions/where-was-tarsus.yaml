id: where-was-tarsus
question:
  en: "Where was Tarsus, Paul's home town?"
  ru: "Где находился Тарс, родной город Павла?"
  uk: "Де був Тарс, рідне місто Павла?"
  es: "¿Dónde estaba Tarso, la ciudad natal de Pablo?"
  pt: "Onde ficava Tarso, a cidade natal de Paulo?"
  de: "Wo lag Tarsus, die Heimatstadt des Paulus?"
  fr: "Où se trouvait Tarse, la ville natale de Paul ?"
answer:
  en:
    - "Tarsus lies in the plain of Cilicia in southern Turkey, about 20 km inland from the Mediterranean, and is still a city of the same name. It is about 570 km north of Jerusalem in a straight line, about 820 km by the roads on the map, and 135 km west of Antioch in Syria (207 km by road). In antiquity the river Cydnus ran through the city to a lagoon that served as its harbour."
    - 'Paul was born there: "I am a man which am a Jew of Tarsus, a city in Cilicia, a citizen of no mean city", he told the Roman commander in Jerusalem, and then told the crowd that he had been brought up in Jerusalem at the feet of Gamaliel. In Damascus the Lord sent Ananias to seek "Saul, of Tarsus". After his conversion the brethren "brought him down to Caesarea, and sent him forth to Tarsus", and he stayed in Syria and Cilicia until Barnabas came to Tarsus to find him and brought him to Antioch.'
    - "The mound of Gözlükule shows settlement from the Neolithic onward, and Hittite texts name the town Tarsa. In 401 BC Xenophon found it a large and prosperous city, Alexander fell ill there in 333 BC, Mark Antony made it a free city, and in 41 BC Cleopatra sailed up the Cydnus to meet him. Strabo, writing under Augustus, says its people surpassed even Athens and Alexandria in their zeal for philosophy and learning. The emperor Julian was buried in a suburb of Tarsus in 363."
  ru:
    - "Тарс лежит на Киликийской равнине на юге Турции, примерно в 20 км от Средиземного моря, и до сих пор остаётся городом с тем же именем. От Иерусалима до него около 570 км на север по прямой и около 820 км по дорогам на карте, от Антиохии Сирийской — 135 км на запад (207 км по дороге). В древности через город текла река Кидн, впадавшая в лагуну, служившую гаванью."
    - "Здесь родился Павел: «я Иудеянин, Тарсянин, гражданин небезызвестного Киликийского города», — сказал он римскому тысяченачальнику в Иерусалиме, а затем сказал народу, что воспитан в Иерусалиме при ногах Гамалиила. В Дамаске Господь послал Ананию спросить «Тарсянина, по имени Савла». После обращения братия «отправили его в Кесарию и препроводили в Тарс», и он оставался в Сирии и Киликии, пока Варнава не пришёл в Тарс искать его и не привёл в Антиохию."
    - "Холм Гёзлюкуле хранит следы поселения начиная с неолита, а хеттские тексты называют город Тарса. В 401 г. до н. э. Ксенофонт застал его большим и процветающим городом, в 333 г. до н. э. здесь заболел Александр, Марк Антоний сделал Тарс свободным городом, а в 41 г. до н. э. Клеопатра поднялась по Кидну, чтобы встретиться с ним. Страбон, писавший при Августе, говорит, что жители Тарса в любви к философии и учёности превзошли даже Афины и Александрию. В 363 году в предместье Тарса был похоронен император Юлиан."
  uk:
    - "Тарс лежить на Кілікійській рівнині на півдні Туреччини, приблизно за 20 км углиб країни від Середземного моря, і досі є містом з тією самою назвою. Він лежить приблизно за 570 км на північ від Єрусалима по прямій, приблизно за 820 км дорогами на мапі, і за 135 км на захід від Антіохії в Сирії (207 км дорогою). У давнину річка Кідн проходила крізь місто до лагуни, яка слугувала йому гаванню."
    - "Павло народився там: «Я чоловік Жидовин Тарсийський, славного города Киликиї житель», — сказав він римському тисячникові в Єрусалимі, а потім розповів натовпові, що виховувався в Єрусалимі при ногах Гамаліїла. У Дамаску Господь послав Ананію шукати «Тарсянина, на ймя Савла». Після навернення брати «привели в Кесарию, та й вислали його в Тарс», і він пробув у Сирії та Кілікії, поки Варнава не прийшов у Тарс шукати його й не привів до Антіохії."
    - "Пагорб Гезлюкуле показує поселення від неоліту, а хетські тексти називають місто Тарса. 401 р. до н. е. Ксенофонт застав його великим і заможним містом, Александр захворів там 333 р. до н. е., Марк Антоній зробив його вільним містом, а 41 р. до н. е. Клеопатра пливла вгору по Кідну, щоб зустрітися з ним. Страбон, пишучи за Августа, каже, що його жителі переважали навіть Афіни й Александрію в завзятті до філософії та науки. Імператора Юліана було поховано в передмісті Тарса 363 р."
  es:
    - "Tarso se halla en la llanura de Cilicia, en el sur de Turquía, a unos 20 km tierra adentro desde el Mediterráneo, y sigue siendo una ciudad del mismo nombre. Queda a unos 570 km al norte de Jerusalén en línea recta, a unos 820 km por las calzadas del mapa, y a 135 km al oeste de Antioquía de Siria (207 km por calzada). En la Antigüedad el río Cidno atravesaba la ciudad hasta una laguna que le servía de puerto."
    - "Pablo nació allí: «Yo de cierto soy hombre Judío, ciudadano de Tarso, ciudad no obscura de Cilicia», dijo al tribuno romano en Jerusalén, y luego dijo a la multitud que se había criado en Jerusalén a los pies de Gamaliel. En Damasco, el Señor envió a Ananías a buscar a «Saulo, de Tarso». Tras su conversión, los hermanos «le acompañaron hasta Cesarea, y le enviaron á Tarso», y se quedó en Siria y Cilicia hasta que Bernabé fue a Tarso a buscarlo y lo llevó a Antioquía."
    - "El montículo de Gözlükule muestra poblamiento desde el Neolítico, y los textos hititas nombran la ciudad Tarsa. En 401 a. C. Jenofonte la halló grande y próspera, Alejandro enfermó allí en 333 a. C., Marco Antonio la hizo ciudad libre, y en 41 a. C. Cleopatra remontó el Cidno para encontrarse con él. Estrabón, que escribe bajo Augusto, dice que sus habitantes superaban incluso a Atenas y Alejandría en su celo por la filosofía y el saber. El emperador Juliano fue sepultado en un arrabal de Tarso en 363."
  pt:
    - "Tarso fica na planície da Cilícia, no sul da Turquia, a cerca de 20 km para o interior a partir do Mediterrâneo, e ainda é uma cidade com o mesmo nome. Fica a cerca de 570 km ao norte de Jerusalém em linha reta, cerca de 820 km pelas estradas do mapa, e a 135 km a oeste de Antioquia da Síria (207 km por estrada). Na Antiguidade, o rio Cidno atravessava a cidade até uma lagoa que servia de porto."
    - "Paulo nasceu ali: “Eu sou um judeu de Tarso, na Cilícia, cidadão de uma cidade importante”, disse ele ao comandante romano em Jerusalém, e depois disse à multidão que fora criado em Jerusalém aos pés de Gamaliel. Em Damasco, o Senhor enviou Ananias a procurar “Saulo, de Tarso”. Depois da sua conversão, os irmãos “levaram-no para Cesareia e o enviaram para Tarso”, e ele permaneceu na Síria e na Cilícia até que Barnabé veio a Tarso procurá-lo e o levou a Antioquia."
    - "O monte de Gözlükule mostra ocupação desde o Neolítico, e textos hititas nomeiam a cidade Tarsa. Em 401 a.C., Xenofonte a achou uma cidade grande e próspera, Alexandre adoeceu ali em 333 a.C., Marco Antônio fez dela uma cidade livre, e em 41 a.C. Cleópatra subiu o Cidno para encontrá-lo. Estrabão, escrevendo sob Augusto, diz que seu povo superava até Atenas e Alexandria no zelo pela filosofia e pelo saber. O imperador Juliano foi sepultado num subúrbio de Tarso em 363."
  de:
    - "Tarsus liegt in der Ebene Kilikiens in der Südtürkei, etwa 20 km landeinwärts vom Mittelmeer, und ist noch heute eine Stadt desselben Namens. Es liegt in der Luftlinie etwa 570 km nördlich von Jerusalem, auf den Straßen der Karte etwa 820 km, und 135 km westlich von Antiochia in Syrien (207 km auf der Straße). In der Antike floss der Kydnos durch die Stadt zu einer Lagune, die als ihr Hafen diente."
    - "Paulus wurde dort geboren: „Ich bin ein jüdischer Mann von Tarsus, ein Bürger einer namhaften Stadt in Zilizien“, sagte er dem römischen Oberst in Jerusalem und erklärte dann der Menge, er sei in Jerusalem zu den Füßen Gamaliels erzogen worden. In Damaskus sandte der Herr Hananias, „Saul von Tarsus“ zu suchen. Nach seiner Bekehrung „geleiteten“ ihn die Brüder „gen Cäsarea und schickten ihn gen Tarsus“, und er blieb in Syrien und Kilikien, bis Barnabas nach Tarsus kam, um ihn zu suchen, und ihn nach Antiochia brachte."
    - "Der Hügel Gözlükule zeigt Besiedlung seit der Jungsteinzeit, und hethitische Texte nennen die Stadt Tarsa. Im Jahr 401 v. Chr. fand Xenophon sie als große und wohlhabende Stadt, Alexander erkrankte dort 333 v. Chr., Marcus Antonius machte sie zur freien Stadt, und 41 v. Chr. fuhr Kleopatra den Kydnos hinauf, um ihn zu treffen. Strabon, der unter Augustus schrieb, sagt, ihre Bewohner übertrafen selbst Athen und Alexandria im Eifer für Philosophie und Bildung. Der Kaiser Julian wurde 363 in einem Vorort von Tarsus bestattet."
  fr:
    - "Tarse se trouve dans la plaine de Cilicie, dans le sud de la Turquie, à environ 20 km à l’intérieur des terres depuis la Méditerranée, et c’est encore une ville du même nom. Elle est à environ 570 km au nord de Jérusalem à vol d’oiseau, à environ 820 km par les routes de la carte, et à 135 km à l’ouest d’Antioche de Syrie (207 km par la route). Dans l’Antiquité, le fleuve Cydnos traversait la ville jusqu’à une lagune qui lui servait de port."
    - "Paul y est né : « Je suis Juif, … de Tarse en Cilicie, citoyen d’une ville qui n’est pas sans importance », dit-il au tribun romain à Jérusalem, puis il dit à la foule qu’il avait été élevé à Jérusalem, aux pieds de Gamaliel. À Damas, le Seigneur envoya Ananias chercher « un nommé Saul de Tarse ». Après sa conversion, les frères « l’emmenèrent à Césarée, et le firent partir pour Tarse », et il resta en Syrie et en Cilicie jusqu’à ce que Barnabas vienne le chercher à Tarse et l’amène à Antioche."
    - "Le tertre de Gözlükule montre une occupation dès le néolithique, et des textes hittites nomment la ville Tarsa. En 401 av. J.-C., Xénophon la trouva grande et prospère, Alexandre y tomba malade en 333 av. J.-C., Marc Antoine en fit une ville libre, et en 41 av. J.-C. Cléopâtre remonta le Cydnos pour le rejoindre. Strabon, écrivant sous Auguste, dit que ses habitants surpassaient même Athènes et Alexandrie par leur zèle pour la philosophie et le savoir. L’empereur Julien fut enterré dans un faubourg de Tarse en 363."
