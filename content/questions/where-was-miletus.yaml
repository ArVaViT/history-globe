id: where-was-miletus
question:
  en: "Where was Miletus, where Paul said farewell to the elders of Ephesus?"
  ru: "Где находился Милит, где Павел простился с пресвитерами Ефеса?"
  uk: "Де був Мілет, де Павло прощався зі старшими Ефеса?"
  es: "¿Dónde estaba Mileto, donde Pablo se despidió de los ancianos de Éfeso?"
  pt: "Onde ficava Mileto, onde Paulo se despediu dos presbíteros de Éfeso?"
  de: "Wo lag Milet, wo Paulus sich von den Ältesten von Ephesus verabschiedete?"
  fr: "Où se trouvait Milet, où Paul fit ses adieux aux anciens d’Éphèse ?"
  pl: "Gdzie leżał Milet, gdzie Paweł pożegnał starszych z Efezu?"
  it: "Dov’era Mileto, dove Paolo salutò gli anziani di Efeso?"
  cs: "Kde ležel Milét, kde se Pavel loučil se staršími z Efezu?"
  nl: "Waar lag Milete, waar Paulus afscheid nam van de ouderlingen van Efeze?"
answer:
  en:
    - "Miletus stood on a peninsula near the mouth of the Maeander on the west coast of Asia Minor; its ruins, by the village of Balat in the province of Aydın in Turkey, now lie several kilometres inland, cut off from the sea by the river's silt, and the map point stands on them. Ephesus was about 46 km to the north in a straight line, the island of Patmos about 69 km to the west-south-west, and Jerusalem about 970 km away."
    - "About AD 57, hurrying to be in Jerusalem by Pentecost, “Paul had determined to sail by Ephesus”, and the ship put in at Miletus instead: “from Miletus he sent to Ephesus, and called the elders of the church.” The messengers had to go and the elders to come back, so the stop took several days. His address to them is the only speech in Acts that Paul makes to Christians; at its end “they all wept sore, and fell on Paul's neck, and kissed him, sorrowing most of all for the words which he spake, that they should see his face no more.” Second Timothy adds: “Trophimus have I left at Miletum sick.”"
    - "In the archaic age Miletus was one of the richest Greek cities, the mother of colonies around the Black Sea and the home of Thales, Anaximander and Anaximenes; the Persians took it in 494 BC after the sea battle of Lade. Under Rome it had a Jewish community, and an inscription on the seats of its theatre reserves a place for the Jews and the God-fearers, though its exact wording is read in more than one way. The great theatre and the Baths of Faustina still stand, and the market gate of Miletus was taken to the Pergamon Museum in Berlin."
  ru:
    - "Милит стоял на полуострове у устья Меандра, на западном берегу Малой Азии; его развалины у деревни Балат в турецкой провинции Айдын лежат теперь в нескольких километрах от моря, отрезанные от него речным илом, и точка карты стоит на них. Ефес был примерно в 46 км к северу по прямой, остров Патмос — примерно в 69 км к западо-юго-западу, а Иерусалим — примерно в 970 км."
    - "Около 57 г., торопясь к Пятидесятнице в Иерусалим, Павел решил плыть мимо Ефеса — «ибо Павлу рассудилось миновать Ефес», — и корабль пристал в Милите: «Из Милита же послав в Ефес, он призвал пресвитеров церкви». Посланным нужно было дойти, а пресвитерам — прийти, так что стоянка заняла несколько дней. Его речь к ним — единственная в Деяниях речь Павла к христианам; в конце «немалый плач был у всех, и, падая на выю Павла, целовали его, скорбя особенно от сказанного им слова, что они уже не увидят лица его». Второе послание к Тимофею добавляет: «Трофима же я оставил больного в Милите»."
    - "В архаическую эпоху Милит был одним из богатейших греческих городов, метрополией колоний вокруг Чёрного моря и родиной Фалеса, Анаксимандра и Анаксимена; персы взяли его в 494 г. до н. э. после морской битвы при Ладе. При римлянах здесь жила иудейская община, и надпись на скамьях театра отводит место иудеям и «богобоязненным», хотя точный смысл её слов читают по-разному. Большой театр и термы Фаустины стоят до сих пор, а рыночные ворота Милита увезли в Пергамский музей в Берлине."
  uk:
    - "Мілет стояв на півострові поблизу гирла Меандра на західному узбережжі Малої Азії; його руїни, біля села Балат у провінції Айдин у Туреччині, нині лежать за кілька кілометрів углиб суходолу, відрізані від моря наносами річки, і точка на мапі стоїть на них. Ефес лежав приблизно за 46 км на північ по прямій, острів Патмос — приблизно за 69 км на захід-південний захід, а Єрусалим — приблизно за 970 км."
    - "Близько 57 р. н. е., поспішаючи бути в Єрусалимі до П'ятдесятниці, «Надумавсь бо Павел плисти мимо Єфеса», і корабель зайшов натомість до Мілета: «З Милета ж, піславши в Єфес, прикликав старших церковних.» Посланцям треба було дійти, а старшим — прибути, тож зупинка тривала кілька днів. Його промова до них — єдина промова в Діях, яку Павло виголошує до християн; наприкінці «Доволї ж було плачу у всїх, і, впавши на шию Павлові, цїлували його, смуткуючи найбільш про те слово, що промовив, що більш не мають лиця його видїти». Друге послання до Тимофія додає: «а Трофима зоставив я в Милетї недужного»."
    - "В архаїчну добу Мілет був одним із найбагатших грецьких міст, матір'ю колоній навколо Чорного моря і батьківщиною Фалеса, Анаксімандра й Анаксімена; перси взяли його 494 р. до н. е. після морської битви при Ладе. За Риму тут була юдейська громада, і напис на сидіннях його театру резервує місце для юдеїв і богобоязливих, хоча його точне формулювання читають по-різному. Великий театр і лазні Фаустини досі стоять, а ринкову браму Мілета перевезено до Пергамського музею в Берліні."
  es:
    - "Mileto se alzaba en una península cerca de la desembocadura del Meandro, en la costa occidental de Asia Menor; sus ruinas, junto a la aldea de Balat, en la provincia de Aydın, en Turquía, están hoy varios kilómetros tierra adentro, aisladas del mar por el limo del río, y el punto del mapa está sobre ellas. Éfeso quedaba a unos 46 km al norte en línea recta, la isla de Patmos a unos 69 km al oesudoeste y Jerusalén a unos 970 km."
    - "Hacia el 57 d. C., con prisa por estar en Jerusalén para Pentecostés, «Pablo se había propuesto pasar adelante de Efeso», y la nave hizo escala en Mileto: «enviando desde Mileto á Efeso, hizo llamar á los ancianos de la iglesia». Los mensajeros tuvieron que ir y los ancianos regresar, de modo que la parada duró varios días. Su discurso a ellos es el único de los Hechos que Pablo dirige a cristianos; al final, «Entonces hubo un gran lloro de todos: y echándose en el cuello de Pablo, le besaban, doliéndose en gran manera por la palabra que dijo, que no habían de ver más su rostro». La segunda carta a Timoteo añade: «á Trófimo dejé en Mileto enfermo»."
    - "En la época arcaica, Mileto fue una de las ciudades griegas más ricas, madre de colonias en torno al mar Negro y patria de Tales, Anaximandro y Anaxímenes; los persas la tomaron en 494 a. C. tras la batalla naval de Lade. Bajo Roma tuvo una comunidad judía, y una inscripción en los asientos de su teatro reserva un lugar a los judíos y a los temerosos de Dios, aunque su redacción exacta se lee de más de una manera. El gran teatro y las Termas de Faustina siguen en pie, y la puerta del mercado de Mileto fue llevada al Museo de Pérgamo, en Berlín."
  pt:
    - "Mileto ficava numa península perto da foz do Meandro, na costa oeste da Ásia Menor; suas ruínas, junto à aldeia de Balat, na província de Aydın, na Turquia, estão hoje vários quilômetros para o interior, separadas do mar pelo aluvião do rio, e o ponto do mapa fica sobre elas. Éfeso ficava a cerca de 46 km ao norte em linha reta, a ilha de Patmos a cerca de 69 km a oés-sudoeste e Jerusalém a cerca de 970 km de distância."
    - "Por volta de 57 d.C., apressando-se para estar em Jerusalém no Pentecostes, “Paulo havia decidido passar ao largo de Éfeso”, e o navio aportou em Mileto: “De Mileto, ele mandou a Éfeso e chamou a si os presbíteros da igreja.” Os mensageiros tiveram de ir e os presbíteros de voltar, de modo que a parada durou vários dias. O seu discurso a eles é o único em Atos que Paulo faz a cristãos; ao fim dele, “Todos choraram muito e, abraçando Paulo, o beijavam, entristecendo-se sobretudo por causa da palavra que ele havia dito, de que não veriam mais o seu rosto.” Segunda Timóteo acrescenta: “deixei Trófimo doente em Mileto.”"
    - "Na época arcaica, Mileto foi uma das cidades gregas mais ricas, mãe de colônias em torno do mar Negro e terra de Tales, Anaximandro e Anaxímenes; os persas a tomaram em 494 a.C., depois da batalha naval de Lade. Sob Roma teve uma comunidade judaica, e uma inscrição nos assentos do seu teatro reserva um lugar para os judeus e os tementes a Deus, embora a sua redação exata seja lida de mais de uma maneira. O grande teatro e os Banhos de Faustina ainda estão de pé, e o portão do mercado de Mileto foi levado para o Museu de Pérgamo, em Berlim."
  de:
    - "Milet lag auf einer Halbinsel nahe der Mündung des Mäander an der Westküste Kleinasiens; seine Ruinen, beim Dorf Balat in der türkischen Provinz Aydın, liegen heute mehrere Kilometer im Landesinneren, vom Meer durch den Schlamm des Flusses abgeschnitten, und der Kartenpunkt steht auf ihnen. Ephesus lag in der Luftlinie etwa 46 km nördlich, die Insel Patmos etwa 69 km westsüdwestlich und Jerusalem etwa 970 km entfernt."
    - "Um 57 n. Chr. wollte Paulus in Eile zu Pfingsten in Jerusalem sein: „Denn Paulus hatte beschlossen, an Ephesus vorüberzuschiffen“, und das Schiff legte stattdessen in Milet an: „von Milet sandte er gen Ephesus und ließ fordern die Ältesten von der Gemeinde.“ Die Boten mussten hin, die Ältesten zurück, der Halt dauerte also mehrere Tage. Seine Ansprache an sie ist die einzige Rede in der Apostelgeschichte, die Paulus vor Christen hält; an ihrem Ende heißt es: „Es war aber viel Weinen unter ihnen allen, und sie fielen Paulus um den Hals und küßten ihn, am allermeisten betrübt über das Wort, das er sagte, sie würden sein Angesicht nicht mehr sehen“. Der Zweite Timotheusbrief fügt hinzu: „Trophimus aber ließ ich zu Milet krank.“"
    - "In der archaischen Zeit war Milet eine der reichsten griechischen Städte, Mutter von Kolonien rund um das Schwarze Meer und Heimat von Thales, Anaximander und Anaximenes; die Perser nahmen es 494 v. Chr. nach der Seeschlacht bei Lade ein. Unter Rom hatte es eine jüdische Gemeinde, und eine Inschrift auf den Sitzen seines Theaters reserviert einen Platz für die Juden und die Gottesfürchtigen, auch wenn ihr genauer Wortlaut verschieden gelesen wird. Das große Theater und die Faustina-Thermen stehen noch, und das Marktor von Milet kam in das Pergamonmuseum in Berlin."
  fr:
    - "Milet s’élevait sur une presqu’île près de l’embouchure du Méandre, sur la côte occidentale de l’Asie Mineure ; ses ruines, près du village de Balat, dans la province d’Aydın, en Turquie, se trouvent aujourd’hui à plusieurs kilomètres à l’intérieur des terres, coupées de la mer par les alluvions du fleuve, et le point de la carte s’y trouve. Éphèse était à environ 46 km au nord à vol d’oiseau, l’île de Patmos à environ 69 km à l’ouest-sud-ouest, et Jérusalem à environ 970 km."
    - "Vers 57 apr. J.-C., se hâtant d’être à Jérusalem pour la Pentecôte, « Paul avait résolu de passer devant Éphèse sans s’y arrêter », et le navire fit escale à Milet : « de Milet Paul envoya chercher à Éphèse les anciens de l’Église ». Les messagers devaient partir et les anciens revenir, de sorte que l’escale dura plusieurs jours. Son discours à leur adresse est le seul des Actes que Paul prononce devant des chrétiens ; à la fin, « tous fondirent en larmes, et, se jetant au cou de Paul, ils l’embrassaient, affligés surtout de ce qu’il avait dit qu’ils ne verraient plus son visage ». La seconde épître à Timothée ajoute : « j’ai laissé Trophime malade à Milet »."
    - "À l’époque archaïque, Milet fut l’une des plus riches cités grecques, la mère de colonies autour de la mer Noire et la patrie de Thalès, d’Anaximandre et d’Anaximène ; les Perses la prirent en 494 av. J.-C. après la bataille navale de Ladé. Sous Rome, elle eut une communauté juive, et une inscription sur les gradins de son théâtre réserve une place aux Juifs et aux craignant-Dieu, bien que son libellé exact se lise de plus d’une manière. Le grand théâtre et les thermes de Faustine sont encore debout, et la porte du marché de Milet a été transportée au musée de Pergame, à Berlin."
  pl:
    - "Milet stał na półwyspie niedaleko ujścia Meandru na zachodnim wybrzeżu Azji Mniejszej; jego ruiny, przy wsi Balat w prowincji Aydın w Turcji, leżą dziś kilka kilometrów w głębi lądu, odcięte od morza mułem rzeki, i na nich stoi punkt na mapie. Efez leżał około 46 km na północ w linii prostej, wyspa Patmos około 69 km na zachód-południowy zachód, a Jerozolima około 970 km dalej."
    - "Około 57 n.e., spiesząc, by być w Jerozolimie na Pięćdziesiątnicę, „Paweł umyślił był minąć Efez”, a statek zawinął zamiast tego do Miletu: „z Miletu posławszy do Efezu, przyzwał do siebie starszych zborowych”. Posłańcy musieli pojechać, a starsi wrócić, więc postój trwał kilka dni. Jego przemowa do nich jest jedyną mową w Dziejach, jaką Paweł wygłasza do chrześcijan; na jej końcu „stał się wielki płacz wszystkich, a upadając na szyję Pawłową, całowali go”, „smucąc się bardzo, najwięcej tych słów, które im rzekł, że już więcej nie mieli oglądać oblicza jego”. Drugi List do Tymoteusza dodaje: „Trofimam zostawił w Milecie chorego”."
    - "W epoce archaicznej Milet był jednym z najbogatszych miast greckich, matką kolonii wokół Morza Czarnego i ojczyzną Talesa, Anaksymandra i Anaksymenesa; Persowie zdobyli go w 494 p.n.e. po bitwie morskiej pod Lade. Pod rzymskimi rządami miał gminę żydowską, a napis na siedzeniach jego teatru rezerwuje miejsce dla Żydów i bojących się Boga, choć jego dokładne brzmienie odczytuje się na więcej niż jeden sposób. Wielki teatr i Łaźnie Faustyny wciąż stoją, a bramę targową Miletu zabrano do Muzeum Pergamońskiego w Berlinie."
  it:
    - "Mileto sorgeva su una penisola presso la foce del Meandro sulla costa occidentale dell’Asia Minore; le sue rovine, presso il villaggio di Balat nella provincia di Aydın in Turchia, si trovano ora a diversi chilometri nell’entroterra, tagliate fuori dal mare dai sedimenti del fiume, e il punto della mappa si trova su di esse. Efeso distava circa 46 km a nord in linea d’aria, l’isola di Patmos circa 69 km a ovest-sud-ovest, e Gerusalemme circa 970 km."
    - "Verso il 57 d.C., affrettandosi per essere a Gerusalemme per la Pentecoste, «Paolo avea deliberato di navigare oltre Efeso», e la nave fece invece scalo a Mileto: «da Mileto mandò ad Efeso a far chiamare gli anziani della chiesa». I messaggeri dovettero andare e gli anziani tornare, così che la sosta durò parecchi giorni. Il suo discorso a loro è l’unico discorso degli Atti che Paolo rivolge a dei cristiani; alla fine «si fece da tutti un gran piangere; e gettatisi al collo di Paolo, lo baciavano, dolenti sopra tutto per la parola che avea detta, che non vedrebbero più la sua faccia». La seconda lettera a Timoteo aggiunge: «Trofimo l’ho lasciato infermo a Mileto»."
    - "In età arcaica Mileto era una delle più ricche città greche, madre di colonie attorno al Mar Nero e patria di Talete, Anassimandro e Anassimene; i Persiani la presero nel 494 a.C. dopo la battaglia navale di Lade. Sotto Roma ebbe una comunità giudaica, e un’iscrizione sui sedili del suo teatro riserva un posto ai Giudei e ai timorati di Dio, benché la sua formulazione esatta sia letta in più di un modo. Il grande teatro e le Terme di Faustina sono ancora in piedi, e la porta del mercato di Mileto fu portata al Pergamonmuseum di Berlino."
  cs:
    - "Milét stál na poloostrově poblíž ústí Maiandru na západním pobřeží Malé Asie; jeho zříceniny u vsi Balat v provincii Aydın v Turecku leží nyní několik kilometrů ve vnitrozemí, odříznuty od moře naplaveninami řeky, a stojí na nich bod na mapě. Efez byl vzdušnou čarou asi 46 km na sever, ostrov Patmos asi 69 km na západojihozápad a Jeruzalém asi 970 km daleko."
    - "Asi roku 57 n. l., pospíchaje do Jeruzaléma na letnice, „Pavel byl umínil pominouti Efez“ a loď zastavila místo toho v Milétu: „z Milétu poslav do Efezu, povolal k sobě starších církve.“ Poslové museli jít a starší se vrátit, takže zastávka trvala několik dní. Jeho řeč k nim je jedinou řečí ve Skutcích, kterou Pavel pronáší ke křesťanům; na jejím konci „I stal se pláč veliký ode všech, a padajíce na hrdlo Pavlovo, líbali jej, rmoutíce se nejvíce nad tím slovem, kteréž řekl, že by již více neměli tváři jeho viděti.“ Druhý list Timoteovi dodává: „Trofima pak nechal jsem v Milétu nemocného.“"
    - "V archaické době byl Milét jedním z nejbohatších řeckých měst, matkou kolonií kolem Černého moře a domovem Thalése, Anaximandra a Anaximena; Peršané jej dobyli roku 494 př. n. l. po námořní bitvě u Ladé. Za Říma měl židovskou obec a nápis na sedadlech jeho divadla vyhrazuje místo Židům a bohabojným, ačkoli přesné znění se čte více způsoby. Velké divadlo a Faustininy lázně dosud stojí a milétská tržní brána byla odvezena do Pergamonského muzea v Berlíně."
  nl:
    - "Milete lag op een schiereiland bij de monding van de Maeander aan de westkust van Klein-Azië; de ruïnes, bij het dorp Balat in de provincie Aydın in Turkije, liggen nu enkele kilometers landinwaarts, afgesneden van de zee door het slib van de rivier, en het punt op de kaart staat erop. Efeze lag hemelsbreed ongeveer 46 km naar het noorden, het eiland Patmos ongeveer 69 km naar het west-zuidwesten, en Jeruzalem ongeveer 970 km verderop."
    - "Omstreeks 57 n.Chr., haastend om met Pinksteren in Jeruzalem te zijn, “Paulus had voorgenomen Efeze voorbij te varen”, en het schip legde in plaats daarvan aan te Milete: “hij zond van Milete naar Efeze, en hij ontbood de ouderlingen der Gemeente.” De boden moesten gaan en de ouderlingen terugkomen, zodat de tussenstop enkele dagen duurde. Zijn toespraak tot hen is de enige rede in Handelingen die Paulus tot christenen houdt; aan het einde “er werd een groot geween van hen allen; en zij, vallende om den hals van Paulus, kusten hem; zeer bedroefd zijnde, allermeest over het woord, dat hij gezegd had, dat zij zijn aangezicht niet meer zien zouden.” De tweede brief aan Timoteüs voegt toe: “Trofimus heb ik te Milete krank gelaten.”"
    - "In de archaïsche tijd was Milete een van de rijkste Griekse steden, moeder van kolonies rond de Zwarte Zee en woonplaats van Thales, Anaximander en Anaximenes; de Perzen namen het in 494 v.Chr. in na de zeeslag bij Lade. Onder Rome had het een joodse gemeenschap, en een opschrift op de zitplaatsen van het theater reserveert een plaats voor de joden en de godvrezenden, hoewel de exacte bewoording op meer dan één manier wordt gelezen. Het grote theater en de Faustinathermen staan nog, en de marktpoort van Milete werd overgebracht naar het Pergamonmuseum in Berlijn."
