id: where-was-ekron
question:
  en: "Where was Ekron, the city of Baal-zebub?"
  ru: "Где находился Екрон, город Веельзевула?"
  uk: "Де був Екрон, місто Веельзевула?"
  es: "¿Dónde estaba Ecrón, la ciudad de Baal-zebub?"
  pt: "Onde ficava Ecrom, a cidade de Baal-Zebube?"
  de: "Wo lag Ekron, die Stadt des Baal-Sebub?"
  fr: "Où se trouvait Ékron, la ville de Baal-Zebub ?"
answer:
  en:
    - "Ekron is Tel Miqne, also called Khirbet el-Muqanna, a mound on the inner edge of the southern coastal plain of Israel, about 36 km west of Jerusalem in a straight line; the map point stands on it. It was the northernmost of the five Philistine cities, about 9 km north of Gath, and the identification is certain: an inscription found there in 1996 names the city."
    - "In the Bible Ekron is best known for its god. When King Ahaziah of Israel fell through a lattice in Samaria, he sent to “enquire of Baal-zebub the god of Ekron whether I shall recover of this disease”, a journey of some 64 km to the south-west; Elijah met the messengers: “Is it not because there is not a God in Israel, that ye go to enquire of Baal-zebub the god of Ekron?” The name means “lord of the flies”, perhaps a mocking change of Baal-zebul, “Baal the prince”; in the Gospels Beelzebub is the prince of devils. Earlier the captured ark was sent on from Gath to Ekron, as the Hebrew and the King James Version read; the Greek and the Russian Synodal name Ashkelon here. After Goliath fell, Israel pursued the Philistines “to the gates of Ekron”."
    - "Trude Dothan and Seymour Gitin excavated Tel Miqne from 1981 to 1996. The Philistines founded a fortified city here in the twelfth century BC; under Assyrian rule in the seventh century it became the largest olive-oil production centre yet found in the ancient Near East, with over a hundred presses. In its temple the excavators found the inscription of “Achish son of Padi, ruler of Ekron”; Padi is the king whom Ekron's nobles handed over to Hezekiah in 701 BC and whom Sennacherib restored. The city was burned in Nebuchadnezzar's campaign on the Philistine coast, usually dated 604 BC, as Zephaniah had warned: “Ekron shall be rooted up.”"
  ru:
    - "Екрон — это Тель-Микне, или Хирбет-эль-Муканна, холм на внутреннем краю южной прибрежной равнины Израиля, примерно в 36 км к западу от Иерусалима по прямой; точка карты стоит на нём. Это самый северный из пяти филистимских городов, примерно в 9 км к северу от Гефа, и отождествление несомненно: найденная здесь в 1996 году надпись называет город."
    - "В Библии Екрон больше всего известен своим божеством. Когда израильский царь Охозия упал через решётку горницы в Самарии, он послал послов за 64 км к юго-западу: «пойдите, спросите у Веельзевула, божества Аккаронского: выздоровею ли я от сей болезни?»; Илия встретил послов: «разве нет Бога в Израиле, что вы идете вопрошать Веельзевула, божество Аккаронское?» Имя значит «повелитель мух» и, возможно, насмешливо искажает Баал-Зебул — «Баал-князь»; в Евангелиях Веельзевул — князь бесовский. Ещё раньше захваченный ковчег отправили из Гефа в Екрон, как читают еврейский текст и английская Библия короля Якова; в греческом тексте и в Синодальном переводе здесь назван Аскалон. Когда пал Голиаф, израильтяне гнали филистимлян «до ворот Аккарона» — так в книгах Царств называется Екрон."
    - "Труде Дотан и Сеймур Гитин раскапывали Тель-Микне с 1981 по 1996 год. Филистимляне основали здесь укреплённый город в XII веке до н. э.; под властью Ассирии в VII веке он стал крупнейшим из найденных на древнем Ближнем Востоке центров производства оливкового масла — здесь больше сотни давилен. В его храме нашли надпись «Ахиша, сына Падии, правителя Екрона»; Падия — тот царь, которого знать Екрона выдала Езекии в 701 г. до н. э. и которому Сеннахирим вернул престол. Город сгорел во время похода Навуходоносора на филистимское побережье, обычно датируемого 604 г. до н. э., как и предупреждал Софония: «Екрон искоренится»."
  uk:
    - "Екрон — це Тель-Мікне, званий також Хірбет-ель-Муканна, пагорб на внутрішньому краю південної прибережної рівнини Ізраїлю, приблизно за 36 км на захід від Єрусалиму по прямій; точка мапи стоїть на ньому. Це було найпівнічніше з п'яти филистимських міст, приблизно за 9 км на північ від Гата, і ототожнення певне: напис, знайдений там 1996 р., називає місто."
    - "У Біблії Екрон найвідоміший своїм богом. Коли цар Охозія Ізраїльський упав крізь грати в Самарії, він послав «поспитайте в Беел-Себула, Екронського бога, чи я одужаю з сієї недуги моєї?» — подорож приблизно 64 км на південний захід; Ілля зустрів посланців: «Хиба в Ізраїлї та нема Бога, що ви йдете питати в Беел-Себула, Екронського бога». Ім'я Веельзевул означає «володар мух», можливо, глузливе перекручення Ваал-Зевула, «Ваал-князь»; в Євангеліях Вельзевул — князь бісів. Раніше захоплений ковчег було відіслано з Гата до Екрону, як читають єврейський текст і Біблія короля Якова; грецький та російський Синодальний тексти називають тут Аскалон. Після того як Голіят упав, Ізраїль гнався за филистимлянами «до воріт Аккарону»."
    - "Труде Дотан і Сеймур Гітін розкопували Тель-Мікне з 1981 до 1996 р. Филистимляни заснували тут укріплене місто в XII ст. до н. е.; під ассирійською владою в VII ст. воно стало найбільшим досі знайденим центром виробництва оливкової олії на давньому Близькому Сході, із понад сотнею пресів. У його храмі археологи знайшли напис «Анхуса, сина Паді, правителя Екрону»; Паді — це цар, якого вельможі Екрону видали Єзекії 701 р. до н. е. і якого Сінаххеріб відновив. Місто було спалене під час походу Навуходоносора на филистимське узбережжя, зазвичай датованого 604 р. до н. е., як Софонія й попереджав: «а Екрон буде викоренений»."
  es:
    - "Ecrón es Tel Miqne, también llamado Khirbet el-Muqanna, un tell en el borde interior de la llanura costera meridional de Israel, a unos 36 km al oeste de Jerusalén en línea recta; el punto del mapa está sobre él. Era la más septentrional de las cinco ciudades filisteas, a unos 9 km al norte de Gat, y la identificación es segura: una inscripción hallada allí en 1996 nombra la ciudad."
    - "En la Biblia, Ecrón es conocida sobre todo por su dios. Cuando el rey Ocozías de Israel cayó por una celosía en Samaria, envió mensajeros con la orden: «consultad á Baal-zebub dios de Ecrón, si tengo de sanar de esta mi enfermedad», un viaje de unos 64 km al suroeste; Elías salió al encuentro de los mensajeros: «¿No hay Dios en Israel, que vosotros vais á consultar á Baal-zebub dios de Ecrón?». El nombre significa «señor de las moscas», quizá una alteración burlona de Baal-zebul, «Baal el príncipe»; en los Evangelios Beelzebub es el príncipe de los demonios. Antes, el arca capturada fue enviada de Gat a Ecrón, como leen el hebreo y la Biblia del Rey Jacobo; la Biblia griega y el texto sinodal ruso nombran aquí Ascalón. Tras la caída de Goliat, Israel persiguió a los filisteos «hasta las puertas de Ecrón»."
    - "Trude Dothan y Seymour Gitin excavaron Tel Miqne de 1981 a 1996. Los filisteos fundaron aquí una ciudad fortificada en el siglo XII a. C.; bajo el dominio asirio, en el siglo VII, llegó a ser el mayor centro de producción de aceite de oliva hallado hasta ahora en el antiguo Próximo Oriente, con más de cien almazaras. En su templo los excavadores hallaron la inscripción de «Aquis hijo de Padi, gobernante de Ecrón»; Padi es el rey que los nobles de Ecrón entregaron a Ezequías en el 701 a. C. y a quien Senaquerib restituyó. La ciudad fue incendiada en la campaña de Nabucodonosor por la costa filistea, que suele fecharse en el 604 a. C., como había advertido Sofonías: «Ecrón será desarraigada»."
  pt:
    - "Ecrom é Tel Miqne, também chamada Khirbet el-Muqanna, um montículo na borda interna da planície costeira meridional de Israel, a cerca de 36 km a oeste de Jerusalém em linha reta; o ponto do mapa está nele. Era a mais setentrional das cinco cidades filisteias, a cerca de 9 km ao norte de Gate, e a identificação é certa: uma inscrição achada ali em 1996 nomeia a cidade."
    - "Na Bíblia Ecrom é mais conhecida por seu deus. Quando o rei Acazias de Israel caiu pela grade em Samaria, enviou mensageiros: “consultem Baal-Zebube, o deus de Ecrom, para saber se eu me recuperarei desta doença”, viagem de uns 64 km a sudoeste; Elias encontrou os mensageiros: “Acaso é porque não há Deus em Israel que vocês vão consultar Baal-Zebube, o deus de Ecrom?” O nome significa “senhor das moscas”, talvez uma troca zombeteira de Baal-Zebul, “Baal, o príncipe”; nos Evangelhos Belzebu é o príncipe dos demônios. Antes, a arca capturada foi enviada de Gate a Ecrom, como leem o hebraico e a versão King James; o grego e a sinodal russa nomeiam aqui Ascalom. Depois que Golias caiu, Israel perseguiu os filisteus “até as portas de Ecrom”."
    - "Trude Dothan e Seymour Gitin escavaram Tel Miqne de 1981 a 1996. Os filisteus fundaram aqui uma cidade fortificada no século XII a.C.; sob domínio assírio, no século VII, tornou-se o maior centro de produção de azeite já achado no antigo Oriente Próximo, com mais de uma centena de lagares. Em seu templo os escavadores acharam a inscrição de “Aquis, filho de Padi, governante de Ecrom”; Padi é o rei que os nobres de Ecrom entregaram a Ezequias em 701 a.C. e que Senaqueribe restaurou. A cidade foi queimada na campanha de Nabucodonosor na costa filisteia, geralmente datada de 604 a.C., como Sofonias avisara: “Ecrom será arrancada pela raiz.”"
  de:
    - "Ekron ist Tel Miqne, auch Chirbet el-Muqanna genannt, ein Hügel am Innenrand der südlichen Küstenebene Israels, in der Luftlinie etwa 36 km westlich von Jerusalem; der Kartenpunkt liegt darauf. Es war die nördlichste der fünf Philisterstädte, etwa 9 km nördlich von Gat, und die Gleichsetzung ist sicher: Eine dort 1996 gefundene Inschrift nennt die Stadt."
    - "In der Bibel ist Ekron vor allem für seinen Gott bekannt. Als König Ahasja von Israel in Samaria durch ein Gitter fiel, sandte er Boten: „Geht hin und fragt Baal-Sebub, den Gott zu Ekron, ob ich von dieser Krankheit genesen werde“, eine Reise von etwa 64 km nach Südwesten; Elia begegnete den Boten: „Ist denn nun kein Gott in Israel, daß ihr hingehet, zu fragen Baal-Sebub, den Gott Ekrons?“ Der Name bedeutet „Herr der Fliegen“, vielleicht eine spöttische Abwandlung von Baal-Sebul, „Baal, der Fürst“; in den Evangelien ist Beelzebub „der Teufel Obersten“. Zuvor wurde die erbeutete Lade von Gat nach Ekron weitergeschickt, wie der hebräische Text und die King-James-Bibel lesen; die griechische und die russische Synodalbibel nennen hier Aschkelon. Nach Goliats Fall verfolgte Israel die Philister „bis an die Tore Ekrons“."
    - "Trude Dothan und Seymour Gitin gruben Tel Miqne von 1981 bis 1996 aus. Die Philister gründeten hier im 12. Jahrhundert v. Chr. eine befestigte Stadt; unter assyrischer Herrschaft wurde sie im 7. Jahrhundert das größte bisher gefundene Olivenölzentrum des Alten Orients, mit über hundert Pressen. In ihrem Tempel fanden die Ausgräber die Inschrift „Achisch, Sohn des Padi, Herrscher von Ekron“; Padi ist der König, den Ekrons Adlige 701 v. Chr. an Hiskia auslieferten und den Sanherib wieder einsetzte. Die Stadt wurde bei Nebukadnezars Feldzug an der Philisterküste verbrannt, meist auf 604 v. Chr. datiert, wie Zefanja gewarnt hatte: „und Ekron ausgewurzelt werden“."
  fr:
    - "Ékron est Tel Miqne, appelé aussi Khirbet el-Muqanna, un tertre au bord intérieur de la plaine côtière méridionale d’Israël, à environ 36 km à l’ouest de Jérusalem en ligne droite ; le point de la carte y est. C’était la plus septentrionale des cinq villes philistines, à environ 9 km au nord de Gath, et l’identification est certaine : une inscription trouvée là en 1996 nomme la ville."
    - "Dans la Bible, Ékron est surtout connue pour son dieu. Quand le roi Achazia d’Israël tomba par un treillis à Samarie, il envoya dire : « Allez, consultez Baal-Zebub, dieu d’Ékron, pour savoir si je guérirai de cette maladie », voyage d’environ 64 km vers le sud-ouest ; Élie rencontra les messagers : « Est-ce parce qu’il n’y a point de Dieu en Israël que vous allez consulter Baal-Zebub, dieu d’Ékron ? » Le nom signifie « seigneur des mouches », peut-être déformation moqueuse de Baal-Zebul, « Baal le prince » ; dans les Évangiles, Béelzébul est le prince des démons. Plus tôt, l’arche prise fut envoyée de Gath à Ékron, comme le lisent l’hébreu et la version King James ; le grec et la Bible synodale russe nomment ici Askalon. Après la chute de Goliath, Israël poursuivit les Philistins « jusqu’aux portes d’Ékron »."
    - "Trude Dothan et Seymour Gitin fouillèrent Tel Miqne de 1981 à 1996. Les Philistins y fondèrent une ville fortifiée au XIIe siècle av. J.-C. ; sous la domination assyrienne au VIIe siècle, elle devint le plus grand centre de production d’huile d’olive jamais trouvé dans le Proche-Orient ancien, avec plus de cent pressoirs. Dans son temple, les fouilleurs trouvèrent l’inscription d’« Akisch fils de Padi, gouverneur d’Ékron » ; Padi est le roi que les nobles d’Ékron livrèrent à Ézéchias en 701 av. J.-C. et que Sanchérib rétablit. La ville fut brûlée lors de la campagne de Nebucadnetsar sur la côte philistine, d’ordinaire datée de 604 av. J.-C., comme Sophonie l’avait annoncé : « Ékron sera déracinée. »"
