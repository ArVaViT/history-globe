id: where-was-ekron
question:
  en: "Where was Ekron, the city of Baal-zebub?"
  ru: "Где находился Екрон, город Веельзевула?"
  uk: "Де був Екрон, місто Веельзевула?"
  es: "¿Dónde estaba Ecrón, la ciudad de Baal-zebub?"
  pt: "Onde ficava Ecrom, a cidade de Baal-Zebube?"
  de: "Wo lag Ekron, die Stadt des Baal-Sebub?"
  fr: "Où se trouvait Ékron, la ville de Baal-Zebub ?"
  pl: "Gdzie leżał Ekron, miasto Baal-Zebuba?"
  it: "Dov’era Ekron, la città di Baal-Zebub?"
  nl: "Waar lag Ekron, de stad van Baäl-Zebub?"
  cs: "Kde byl Ekron, město Beelzebuba?"
  sv: "Var låg Ekron, Baal-Sebubs stad?"
  nb: "Hvor lå Ekron, Baal-Sebubs by?"
  tl: "Saan ang Ecron, ang lungsod ni Baal-zebub?"
  da: "Hvor lå Ekron, Ba'al-Zebubs by?"
  sr: "Где је био Акарон, град Велзевулов?"
  hu: "Hol volt Ekron, Baál-Zebúb városa?"
  fi: "Missä Ekron, Baal-Sebubin kaupunki, oli?"
  vi: "Éc-rôn, thành của Ba-anh-Xê-bụt, ở đâu?"
  ro: "Unde se afla Ecron, orașul lui Baal-Zebub?"
  bg: "Къде се е намирал Екрон, градът на Веелзевул?"
answer:
  en:
    - "Ekron is Tel Miqne, also called Khirbet el-Muqanna, a mound on the inner edge of the southern coastal plain of Israel, about 36 km west of Jerusalem in a straight line; the map point stands on it. It was the northernmost of the five Philistine cities, about 9 km north of Gath, and the identification is certain: an inscription found there in 1996 names the city."
    - "In the Bible Ekron is best known for its god. When King Ahaziah of Israel fell through a lattice in Samaria, he sent to “enquire of Baal-zebub the god of Ekron whether I shall recover of this disease”, a journey of some 64 km to the south-west; Elijah met the messengers: “Is it not because there is not a God in Israel, that ye go to enquire of Baal-zebub the god of Ekron?” The name means “lord of the flies”, perhaps a mocking change of Baal-zebul, “Baal the prince”; in the Gospels Beelzebub is the prince of devils. Earlier the captured ark was sent on from Gath to Ekron, as the Hebrew and the King James Version read; the Greek and the Russian Synodal name Ashkelon here. After Goliath fell, Israel pursued the Philistines “to the gates of Ekron”."
    - "Trude Dothan and Seymour Gitin excavated Tel Miqne from 1981 to 1996. The Philistines founded a fortified city here in the twelfth century BC; under Assyrian rule in the seventh century it became the largest olive-oil production centre yet found in the ancient Near East, with over a hundred presses. In its temple the excavators found the inscription of “Achish son of Padi, ruler of Ekron”; Padi is the king whom Ekron's nobles handed over to Hezekiah in 701 BC and whom Sennacherib restored. The city was burned in Nebuchadnezzar's campaign on the Philistine coast, usually dated 604 BC, as Zephaniah had warned: “Ekron shall be rooted up.”"
  ru:
    - "Екрон — это Тель-Микне, или Хирбет-эль-Муканна, холм на внутреннем краю южной прибрежной равнины Израиля, примерно в 36 км к западу от Иерусалима по прямой; точка карты стоит на нём. Это самый северный из пяти филистимских городов, примерно в 9 км к северу от Гефа, и отождествление несомненно: найденная здесь в 1996 году надпись называет город."
    - "В Библии Екрон больше всего известен своим божеством. Когда израильский царь Охозия упал через решётку горницы в Самарии, он послал послов за 64 км к юго-западу: «пойдите, спросите у Веельзевула, божества Аккаронского: выздоровею ли я от сей болезни?»; Илия встретил послов: «разве нет Бога в Израиле, что вы идете вопрошать Веельзевула, божество Аккаронское?» Имя значит «повелитель мух» и, возможно, насмешливо искажает Баал-Зебул — «Баал-князь»; в Евангелиях Веельзевул — князь бесовский. Ещё раньше захваченный ковчег отправили из Гефа в Екрон, как читают еврейский текст и английская Библия короля Якова; в греческом тексте и в Синодальном переводе здесь назван Аскалон. Когда пал Голиаф, израильтяне гнали филистимлян «до ворот Аккарона» — так в книгах Царств называется Екрон."
    - "Труде Дотан и Сеймур Гитин раскапывали Тель-Микне с 1981 по 1996 год. Филистимляне основали здесь укреплённый город в XII веке до н. э.; под властью Ассирии в VII веке он стал крупнейшим из найденных на древнем Ближнем Востоке центров производства оливкового масла — здесь больше сотни давилен. В его храме нашли надпись «Ахиша, сына Падии, правителя Екрона»; Падия — тот царь, которого знать Екрона выдала Езекии в 701 г. до н. э. и которому Сеннахирим вернул престол. Город сгорел во время похода Навуходоносора на филистимское побережье, обычно датируемого 604 г. до н. э., как и предупреждал Софония: «Екрон искоренится»."
  uk:
    - "Екрон — це Тель-Мікне, званий також Хірбет-ель-Муканна, пагорб на внутрішньому краю південної прибережної рівнини Ізраїлю, приблизно за 36 км на захід від Єрусалиму по прямій; точка мапи стоїть на ньому. Це було найпівнічніше з п'яти филистимських міст, приблизно за 9 км на північ від Гата, і ототожнення певне: напис, знайдений там 1996 р., називає місто."
    - "У Біблії Екрон найвідоміший своїм богом. Коли цар Охозія Ізраїльський упав крізь грати в Самарії, він послав «поспитайте в Беел-Себула, Екронського бога, чи я одужаю з сієї недуги моєї?» — подорож приблизно 64 км на південний захід; Ілля зустрів посланців: «Хиба в Ізраїлї та нема Бога, що ви йдете питати в Беел-Себула, Екронського бога». Ім'я Веельзевул означає «володар мух», можливо, глузливе перекручення Ваал-Зевула, «Ваал-князь»; в Євангеліях Вельзевул — князь бісів. Раніше захоплений ковчег було відіслано з Гата до Екрону, як читають єврейський текст і Біблія короля Якова; грецький та російський Синодальний тексти називають тут Аскалон. Після того як Голіят упав, Ізраїль гнався за филистимлянами «до воріт Аккарону»."
    - "Труде Дотан і Сеймур Гітін розкопували Тель-Мікне з 1981 до 1996 р. Филистимляни заснували тут укріплене місто в XII ст. до н. е.; під ассирійською владою в VII ст. воно стало найбільшим досі знайденим центром виробництва оливкової олії на давньому Близькому Сході, із понад сотнею пресів. У його храмі археологи знайшли напис «Анхуса, сина Паді, правителя Екрону»; Паді — це цар, якого вельможі Екрону видали Єзекії 701 р. до н. е. і якого Сінаххеріб відновив. Місто було спалене під час походу Навуходоносора на филистимське узбережжя, зазвичай датованого 604 р. до н. е., як Софонія й попереджав: «а Екрон буде викоренений»."
  es:
    - "Ecrón es Tel Miqne, también llamado Khirbet el-Muqanna, un tell en el borde interior de la llanura costera meridional de Israel, a unos 36 km al oeste de Jerusalén en línea recta; el punto del mapa está sobre él. Era la más septentrional de las cinco ciudades filisteas, a unos 9 km al norte de Gat, y la identificación es segura: una inscripción hallada allí en 1996 nombra la ciudad."
    - "En la Biblia, Ecrón es conocida sobre todo por su dios. Cuando el rey Ocozías de Israel cayó por una celosía en Samaria, envió mensajeros con la orden: «consultad á Baal-zebub dios de Ecrón, si tengo de sanar de esta mi enfermedad», un viaje de unos 64 km al suroeste; Elías salió al encuentro de los mensajeros: «¿No hay Dios en Israel, que vosotros vais á consultar á Baal-zebub dios de Ecrón?». El nombre significa «señor de las moscas», quizá una alteración burlona de Baal-zebul, «Baal el príncipe»; en los Evangelios Beelzebub es el príncipe de los demonios. Antes, el arca capturada fue enviada de Gat a Ecrón, como leen el hebreo y la Biblia del Rey Jacobo; la Biblia griega y el texto sinodal ruso nombran aquí Ascalón. Tras la caída de Goliat, Israel persiguió a los filisteos «hasta las puertas de Ecrón»."
    - "Trude Dothan y Seymour Gitin excavaron Tel Miqne de 1981 a 1996. Los filisteos fundaron aquí una ciudad fortificada en el siglo XII a. C.; bajo el dominio asirio, en el siglo VII, llegó a ser el mayor centro de producción de aceite de oliva hallado hasta ahora en el antiguo Próximo Oriente, con más de cien almazaras. En su templo los excavadores hallaron la inscripción de «Aquis hijo de Padi, gobernante de Ecrón»; Padi es el rey que los nobles de Ecrón entregaron a Ezequías en el 701 a. C. y a quien Senaquerib restituyó. La ciudad fue incendiada en la campaña de Nabucodonosor por la costa filistea, que suele fecharse en el 604 a. C., como había advertido Sofonías: «Ecrón será desarraigada»."
  pt:
    - "Ecrom é Tel Miqne, também chamada Khirbet el-Muqanna, um montículo na borda interna da planície costeira meridional de Israel, a cerca de 36 km a oeste de Jerusalém em linha reta; o ponto do mapa está nele. Era a mais setentrional das cinco cidades filisteias, a cerca de 9 km ao norte de Gate, e a identificação é certa: uma inscrição achada ali em 1996 nomeia a cidade."
    - "Na Bíblia Ecrom é mais conhecida por seu deus. Quando o rei Acazias de Israel caiu pela grade em Samaria, enviou mensageiros: “consultem Baal-Zebube, o deus de Ecrom, para saber se eu me recuperarei desta doença”, viagem de uns 64 km a sudoeste; Elias encontrou os mensageiros: “Acaso é porque não há Deus em Israel que vocês vão consultar Baal-Zebube, o deus de Ecrom?” O nome significa “senhor das moscas”, talvez uma troca zombeteira de Baal-Zebul, “Baal, o príncipe”; nos Evangelhos Belzebu é o príncipe dos demônios. Antes, a arca capturada foi enviada de Gate a Ecrom, como leem o hebraico e a versão King James; o grego e a sinodal russa nomeiam aqui Ascalom. Depois que Golias caiu, Israel perseguiu os filisteus “até as portas de Ecrom”."
    - "Trude Dothan e Seymour Gitin escavaram Tel Miqne de 1981 a 1996. Os filisteus fundaram aqui uma cidade fortificada no século XII a.C.; sob domínio assírio, no século VII, tornou-se o maior centro de produção de azeite já achado no antigo Oriente Próximo, com mais de uma centena de lagares. Em seu templo os escavadores acharam a inscrição de “Aquis, filho de Padi, governante de Ecrom”; Padi é o rei que os nobres de Ecrom entregaram a Ezequias em 701 a.C. e que Senaqueribe restaurou. A cidade foi queimada na campanha de Nabucodonosor na costa filisteia, geralmente datada de 604 a.C., como Sofonias avisara: “Ecrom será arrancada pela raiz.”"
  de:
    - "Ekron ist Tel Miqne, auch Chirbet el-Muqanna genannt, ein Hügel am Innenrand der südlichen Küstenebene Israels, in der Luftlinie etwa 36 km westlich von Jerusalem; der Kartenpunkt liegt darauf. Es war die nördlichste der fünf Philisterstädte, etwa 9 km nördlich von Gat, und die Gleichsetzung ist sicher: Eine dort 1996 gefundene Inschrift nennt die Stadt."
    - "In der Bibel ist Ekron vor allem für seinen Gott bekannt. Als König Ahasja von Israel in Samaria durch ein Gitter fiel, sandte er Boten: „Geht hin und fragt Baal-Sebub, den Gott zu Ekron, ob ich von dieser Krankheit genesen werde“, eine Reise von etwa 64 km nach Südwesten; Elia begegnete den Boten: „Ist denn nun kein Gott in Israel, daß ihr hingehet, zu fragen Baal-Sebub, den Gott Ekrons?“ Der Name bedeutet „Herr der Fliegen“, vielleicht eine spöttische Abwandlung von Baal-Sebul, „Baal, der Fürst“; in den Evangelien ist Beelzebub „der Teufel Obersten“. Zuvor wurde die erbeutete Lade von Gat nach Ekron weitergeschickt, wie der hebräische Text und die King-James-Bibel lesen; die griechische und die russische Synodalbibel nennen hier Aschkelon. Nach Goliats Fall verfolgte Israel die Philister „bis an die Tore Ekrons“."
    - "Trude Dothan und Seymour Gitin gruben Tel Miqne von 1981 bis 1996 aus. Die Philister gründeten hier im 12. Jahrhundert v. Chr. eine befestigte Stadt; unter assyrischer Herrschaft wurde sie im 7. Jahrhundert das größte bisher gefundene Olivenölzentrum des Alten Orients, mit über hundert Pressen. In ihrem Tempel fanden die Ausgräber die Inschrift „Achisch, Sohn des Padi, Herrscher von Ekron“; Padi ist der König, den Ekrons Adlige 701 v. Chr. an Hiskia auslieferten und den Sanherib wieder einsetzte. Die Stadt wurde bei Nebukadnezars Feldzug an der Philisterküste verbrannt, meist auf 604 v. Chr. datiert, wie Zefanja gewarnt hatte: „und Ekron ausgewurzelt werden“."
  fr:
    - "Ékron est Tel Miqne, appelé aussi Khirbet el-Muqanna, un tertre au bord intérieur de la plaine côtière méridionale d’Israël, à environ 36 km à l’ouest de Jérusalem en ligne droite ; le point de la carte y est. C’était la plus septentrionale des cinq villes philistines, à environ 9 km au nord de Gath, et l’identification est certaine : une inscription trouvée là en 1996 nomme la ville."
    - "Dans la Bible, Ékron est surtout connue pour son dieu. Quand le roi Achazia d’Israël tomba par un treillis à Samarie, il envoya dire : « Allez, consultez Baal-Zebub, dieu d’Ékron, pour savoir si je guérirai de cette maladie », voyage d’environ 64 km vers le sud-ouest ; Élie rencontra les messagers : « Est-ce parce qu’il n’y a point de Dieu en Israël que vous allez consulter Baal-Zebub, dieu d’Ékron ? » Le nom signifie « seigneur des mouches », peut-être déformation moqueuse de Baal-Zebul, « Baal le prince » ; dans les Évangiles, Béelzébul est le prince des démons. Plus tôt, l’arche prise fut envoyée de Gath à Ékron, comme le lisent l’hébreu et la version King James ; le grec et la Bible synodale russe nomment ici Askalon. Après la chute de Goliath, Israël poursuivit les Philistins « jusqu’aux portes d’Ékron »."
    - "Trude Dothan et Seymour Gitin fouillèrent Tel Miqne de 1981 à 1996. Les Philistins y fondèrent une ville fortifiée au XIIe siècle av. J.-C. ; sous la domination assyrienne au VIIe siècle, elle devint le plus grand centre de production d’huile d’olive jamais trouvé dans le Proche-Orient ancien, avec plus de cent pressoirs. Dans son temple, les fouilleurs trouvèrent l’inscription d’« Akisch fils de Padi, gouverneur d’Ékron » ; Padi est le roi que les nobles d’Ékron livrèrent à Ézéchias en 701 av. J.-C. et que Sanchérib rétablit. La ville fut brûlée lors de la campagne de Nebucadnetsar sur la côte philistine, d’ordinaire datée de 604 av. J.-C., comme Sophonie l’avait annoncé : « Ékron sera déracinée. »"
  pl:
    - "Ekron to Tel Miqne, zwany też Chirbet el-Mukanna, kopiec na wewnętrznym skraju południowej równiny nadbrzeżnej Izraela, około 36 km na zachód od Jerozolimy w linii prostej; punkt na mapie stoi na nim. Było to najbardziej wysunięte na północ z pięciu miast filistyńskich, około 9 km na północ od Gat, a utożsamienie jest pewne: napis znaleziony tam w 1996 wymienia miasto."
    - "W Biblii Ekron jest najbardziej znany z powodu swego boga. Gdy król Ochozjasz z Izraela spadł przez kratę w Samarii, posłał ludzi, mówiąc: „Idźcie, poradźcie się Beelzebuba, boga Akkarońskiego, jeżeli powstanę z tej choroby”, podróż około 64 km na południowy zachód; Eliasz spotkał posłów: „Izali niemasz Boga w Izraelu, iż się idziecie radzić Beelzebuba, boga Akkarońskiego?” Imię znaczy „pan much”, być może szydercza zmiana Baal-Zebul, „Baal książę”; w Ewangeliach Beelzebub jest księciem demonów. Wcześniej pojmaną arkę odesłano z Gat do Ekronu, jak czytają hebrajski i Biblia króla Jakuba; grecki i rosyjski synodalny podają tu Aszkelon. Po upadku Goliata Izrael ścigał Filistynów „aż do bram Akkaronu”."
    - "Trude Dothan i Seymour Gitin wykopywali Tel Miqne w latach 1981–1996. Filistyni założyli tu ufortyfikowane miasto w XII wieku p.n.e.; pod rządami asyryjskimi w VII wieku stało się największym dotąd znalezionym ośrodkiem produkcji oliwy w starożytnym Bliskim Wschodzie, z ponad stu prasami. W jego świątyni odkrywcy znaleźli napis „Achisza syna Padiego, władcy Ekronu”; Padi to król, którego możnowładcy Ekronu wydali Ezechiaszowi w 701 p.n.e. i którego Sennacheryb przywrócił. Miasto spalono podczas wyprawy Nabuchodonozora na wybrzeże filistyńskie, zwykle datowanej na 604 p.n.e., jak ostrzegał Sofoniasz: „Akkaron wykorzeniony będzie.”"
  it:
    - "Ekron è Tel Miqne, detta anche Khirbet el-Muqanna, un tumulo sul margine interno della pianura costiera meridionale di Israele, a circa 36 km a ovest di Gerusalemme in linea retta; il punto della mappa vi sta sopra. Era la più settentrionale delle cinque città filistee, a circa 9 km a nord di Gat, e l’identificazione è certa: un’iscrizione trovata là nel 1996 nomina la città."
    - "Nella Bibbia Ekron è nota soprattutto per il suo dio. Quando il re Acazia d’Israele cadde dalla cancellata a Samaria, mandò dei messi: «Andate a consultare Baal-Zebub, dio di Ekron, per sapere se mi riavrò di questa malattia», un viaggio di circa 64 km a sud-ovest; Elia incontrò i messi: «E’ forse perché non v’è Dio in Israele che voi andate a consultare Baal-Zebub, dio di Ekron?» Il nome significa «signore delle mosche», forse un’alterazione sprezzante di Baal-Zebul, «Baal il principe»; nei Vangeli Beelzebub è il principe dei demoni. Prima, l’arca catturata fu mandata da Gat a Ekron, come leggono l’ebraico e la King James; il greco e il testo sinodale russo nominano qui Ascalona. Dopo la caduta di Golia, Israele inseguì i Filistei «fino all’ingresso di Gath e alle porte di Ekron»."
    - "Trude Dothan e Seymour Gitin scavarono Tel Miqne dal 1981 al 1996. I Filistei vi fondarono una città fortificata nel XII secolo a.C.; sotto il dominio assiro nel VII secolo divenne il più grande centro di produzione di olio d’oliva finora trovato nell’antico Vicino Oriente, con più di cento frantoi. Nel suo tempio gli scavatori trovarono l’iscrizione di «Achis figlio di Padi, governante di Ekron»; Padi è il re che i nobili di Ekron consegnarono a Ezechia nel 701 a.C. e che Sennacherib reintegrò. La città fu bruciata nella campagna di Nabucodonosor sulla costa filistea, di solito datata al 604 a.C., come Sofonia aveva avvertito: «Ekron sarà sradicata»."
  nl:
    - "Ekron is Tel Miqne, ook Khirbet el-Muqanna genoemd, een heuvel aan de binnenrand van de zuidelijke kustvlakte van Israël, hemelsbreed ongeveer 36 km ten westen van Jeruzalem; het punt op de kaart staat erop. Het was de noordelijkste van de vijf Filistijnse steden, ongeveer 9 km ten noorden van Gat, en de identificatie is zeker: een in 1996 daar gevonden inscriptie noemt de stad."
    - "In de Bijbel is Ekron vooral bekend om zijn god. Toen koning Achazia van Israël door een tralie in Samaria viel, zond hij boden: “vraagt Baal-Zebub, den god van Ekron, of ik van deze krankheid genezen zal”, een reis van zo’n 64 km naar het zuidwesten; Elia ontmoette de boden: “Is het, omdat er geen God in Israel is, dat gijlieden heengaat, om Baal-Zebub, den god van Ekron, te vragen?” De naam betekent “heer van de vliegen”, misschien een spottende verandering van Baäl-Zebul, “Baäl de vorst”; in de Evangeliën is Beëlzebul de overste der duivelen. Eerder werd de buitgemaakte ark van Gat naar Ekron doorgestuurd, zoals het Hebreeuws en de King James-vertaling lezen; het Grieks en de Russische Synodale noemen hier Askelon. Nadat Goliat gevallen was, vervolgde Israël de Filistijnen “tot aan de poorten van Ekron”."
    - "Trude Dothan en Seymour Gitin groeven Tel Miqne op van 1981 tot 1996. De Filistijnen stichtten hier in de 12e eeuw v.Chr. een versterkte stad; onder Assyrisch bewind werd zij in de 7e eeuw het grootste olijfoliecentrum dat tot nu toe in het oude Nabije Oosten is gevonden, met meer dan honderd persen. In haar tempel vonden de opgravers de inscriptie van “Achis, zoon van Padi, heerser van Ekron”; Padi is de koning die Ekrons edelen in 701 v.Chr. aan Chizkia overdroegen en die Sanherib herstelde. De stad werd verbrand bij Nebukadnessars veldtocht langs de Filistijnse kust, gewoonlijk gedateerd 604 v.Chr., zoals Zefanja had gewaarschuwd: “Ekron zal uitgeworteld worden.”"
  cs:
    - "Ekron je Tel Miqne, zvaný také Chirbet al-Muqanna, pahorek na vnitřním okraji jižní pobřežní roviny Izraele, asi 36 km západně od Jeruzaléma vzdušnou čarou; bod na mapě stojí na něm. Byl nejsevernějším z pěti pelištejských měst, asi 9 km severně od Gatu, a ztotožnění je jisté: nápis nalezený tam roku 1996 město jmenuje."
    - "V Bibli je Ekron nejznámější pro svého boha. Když izraelský král Achazjáš spadl mříží v Samaří, poslal posly s příkazem: „Jděte, pilně se ptejte Belzebuba, boha Akaron, povstanu-li z nemoci této?“, cesta asi 64 km na jihozápad; Elijáš poslům vyšel vstříc: „Zdali není Boha v Izraeli, že jdete dotazovati se Belzebuba, boha Akaron?“ Jméno znamená „pán much“, snad posměšná změna Baal-zebula, „Baala knížete“; v evangeliích je Belzebub „knížetem ďábelským“. Dříve byla zajatá truhla poslána z Gatu do Ekronu, jak čte hebrejština i anglická Bible krále Jakuba; řecký a ruský synodální text zde jmenují Aškelon. Po pádu Goliáše Izrael honil Pelištejce „až k branám Akaron“."
    - "Trude Dothanová a Seymour Gitin vykopávali Tel Miqne v letech 1981 až 1996. Pelištejci tu ve 12. století př. n. l. založili opevněné město; pod asyrskou vládou se v 7. století stalo největším dosud nalezeným střediskem výroby olivového oleje ve starověkém Blízkém východě, s více než stovkou lisů. V jeho chrámu vykopavači našli nápis „Achiše syna Padiho, vládce Ekronu“; Padi je král, kterého ekronští šlechtici vydali Chizkijášovi roku 701 př. n. l. a kterého Senacherib obnovil. Město bylo vypáleno při Nebukadnesarově tažení na pelištejské pobřeží, obvykle datovaném rokem 604 př. n. l., jak varoval Sofonjáš: „Akaron vykořeněn bude.“"
  sv:
    - "Ekron är Tel Miqne, också kallad Khirbet el-Muqanna, en kulle på den inre kanten av Israels södra kustslätt, omkring 36 km väster om Jerusalem fågelvägen; kartpunkten står på den. Det var den nordligaste av de fem filistéiska städerna, omkring 9 km norr om Gat, och identifieringen är säker: en inskription som hittades där 1996 nämner staden."
    - "I Bibeln är Ekron mest känt för sin gud. När kung Achasja av Israel föll genom ett galler i Samaria sände han bud för att fråga ”Baal-Sebub, guden i Ekron, om jag skall tillfriskna från denna sjukdom”, en färd på omkring 64 km åt sydväst; Elia mötte budbärarna: ”Är det därför att ingen Gud finnes i Israel som I gån åstad och frågen Baal-Sebub, guden i Ekron?” Namnet betyder ”flugornas herre”, kanske en hånfull ändring av Baal-Sebul, ”fursten Baal”; i evangelierna är Beelsebul de onda andarnas furste. Tidigare sändes den erövrade arken vidare från Gat till Ekron, som hebreiskan och King James-bibeln lyder; den grekiska och den ryska Synodalbibeln nämner Ashkelon här. Efter att Goljat fallit förföljde Israel filistéerna ”intill Ekrons portar”."
    - "Trude Dothan och Seymour Gitin grävde ut Tel Miqne 1981–1996. Filistéerna grundade en befäst stad här på 1100-talet f.Kr.; under assyriskt herravälde på 600-talet blev den det största produktionscentret för olivolja som hittills funnits i det forntida Främre Orienten, med över hundra pressar. I dess tempel fann utgrävarna inskriptionen av ”Akish, son till Padi, härskare över Ekron”; Padi är kungen som Ekrons stormän utlämnade till Hiskia 701 f.Kr. och som Sanherib återinsatte. Staden brändes under Nebukadnessars fälttåg mot filistéernas kust, vanligen daterat 604 f.Kr., som Sefanja hade varnat: ”Ekron skall ryckas upp med roten.”"
  nb:
    - "Ekron er Tel Miqne, også kalt Khirbet el-Muqanna, en haug på den indre kanten av Israels sørlige kystslette, omtrent 36 km vest for Jerusalem i luftlinje; kartpunktet står på den. Det var den nordligste av de fem filisterbyene, omtrent 9 km nord for Gat, og identifikasjonen er sikker: en innskrift funnet der i 1996 nevner byen."
    - "I Bibelen er Ekron best kjent for sin gud. Da kong Ahasja av Israel falt gjennom et gitter i Samaria, sendte han bud med ordene: «Gå og spør Ba'al-Sebub, Ekrons gud, om jeg skal komme mig av denne sykdom!», en reise på omtrent 64 km mot sørvest; Elia møtte sendebudene: «Er det fordi det ingen Gud er i Israel, at I går avsted og spør Ba'al-Sebub, Ekrons gud?» Navnet betyr «fluenes herre», kanskje en hånlig endring av Baal-Sebul, «Baal fyrsten»; i evangeliene er Be'elsebul de onde ånders fyrste. Tidligere ble den fangede arken sendt videre fra Gat til Ekron, slik den hebraiske teksten og King James-bibelen lyder; den greske og den russiske synodalteksten nevner Asjkelon her. Etter at Goliat falt, forfulgte Israel filisterne «like til Ekrons porter»."
    - "Trude Dothan og Seymour Gitin gravde ut Tel Miqne fra 1981 til 1996. Filisterne grunnla en befestet by her på 1100-tallet f.Kr.; under assyrisk styre på 600-tallet ble den det største oliventilvirkningssenteret som er funnet i det gamle Midtøsten, med over hundre presser. I tempelet fant utgraverne innskriften til «Akisj, sønn av Padi, hersker over Ekron»; Padi er kongen som Ekrons stormenn utleverte til Hiskia i 701 f.Kr. og som Sankerib satte inn igjen. Byen ble brent i Nebukadnesars felttog langs filisterkysten, vanligvis datert 604 f.Kr., slik Sefanja hadde advart: «Ekron skal rykkes op med rot.»"
  tl:
    - "Ang Ecron ay ang Tel Miqne, tinatawag ding Khirbet el-Muqanna, isang burol sa panloob na gilid ng timog na kapatagan sa baybayin ng Israel, mga 36 km sa kanluran ng Jerusalem sa tuwid na guhit; doon nakatayo ang tuldok ng mapa. Ito ang pinakahilagang lungsod sa limang lungsod ng mga Filisteo, mga 9 km sa hilaga ng Gath, at tiyak ang pagkakakilanlan: pinangalanan ng isang inskripsiyong natagpuan doon noong 1996 ang lungsod."
    - "Kilala ang Ecron sa Biblia lalo na sa diyos nito. Nang mahulog si Haring Ochozias ng Israel sa silahia sa Samaria, nagsugo siya upang “usisain ninyo kay Baal-zebub, na dios sa Ecron, kung ako'y gagaling sa sakit na ito”, mga 64 km sa timog-kanluran; sinalubong ni Elias ang mga sugo: “Dahil ba sa walang Dios sa Israel, na kaya kayo'y nagsisiyaon upang magsipagusisa kay Baal-zebub na dios sa Ecron?” Ang pangalan ay nangangahulugang “panginoon ng mga langaw”, marahil pang-uyam na pagbabago ng Baal-zebul, “Baal ang prinsipe”; sa mga Ebanghelyo, si Beelzebub ang prinsipe ng mga demonyo. Mas maaga, ipinadala ang nabihag na kaban mula sa Gath hanggang sa Ecron, gaya ng sa Hebreo at King James Version; Ascalon ang pinangalanan dito ng Griyego at Sinodal na Ruso. Pagkabagsak ni Goliath, hinabol ng Israel ang mga Filisteo “hanggang sa Gath, at sa mga pintuang-bayan ng Ecron”."
    - "Hinukay nina Trude Dothan at Seymour Gitin ang Tel Miqne mula 1981 hanggang 1996. Nagtayo rito ang mga Filisteo ng lungsod na nakukutaan noong ikalabindalawang siglo BK; sa ilalim ng pamamahalang Asirio noong ikapitong siglo, ito ang naging pinakamalaking sentro ng produksyon ng langis ng olibo na natagpuan pa sa sinaunang Malapit na Silangan, na may mahigit isang daang pisaan. Sa templo nito, natagpuan ng mga humukay ang inskripsiyon ng “Achis anak ni Padi, pinuno ng Ecron”; si Padi ang haring ibinigay ng mga maharlika ng Ecron kay Ezechias noong 701 BK at ibinalik ni Sennacherib. Sinunog ang lungsod sa kampanya ni Nabucodonosor sa baybaying Filisteo, karaniwang may petsang 604 BK, gaya ng babala ni Zefanias: “ang Ecron ay mabubunot.”"
  da:
    - "Ekron er Tel Miqne, også kaldet Khirbet el-Muqanna, en høj på den indre kant af Israels sydlige kystslette, omkring 36 km vest for Jerusalem i luftlinje; kortets punkt står på den. Den var den nordligste af de fem filisterbyer, omkring 9 km nord for Gat, og identifikationen er sikker: en indskrift fundet dér i 1996 nævner byen."
    - "I Bibelen er Ekron mest kendt for sin gud. Da kong Akazja af Israel faldt gennem et gitter i Samaria, sendte han bud og sagde: »Gaar hen, adspørger Baal-Sebub, Ekrons Gud, om jeg skal leve efter denne Sygdom«, en rejse på omkring 64 km mod sydvest; Elias mødte budbringerne: »Mon det er, fordi der er ingen Gud i Israel, at I gaa bort at adspørge Baal-Sebub, Ekrons Gud?« Navnet betyder »fluernes herre«, måske en hånende ændring af Ba'al-Zebul, »Ba'al fyrsten«; i evangelierne er Beelzebul djævlenes fyrste. Tidligere blev den erobrede ark sendt videre fra Gat til Ekron, som den hebraiske tekst og King James-bibelen læser; den græske og den russiske synodale nævner Askalon her. Efter at Goliat var faldet, forfulgte Israel filisterne »indtil Ekrons Porte«."
    - "Trude Dothan og Seymour Gitin udgravede Tel Miqne fra 1981 til 1996. Filisterne grundlagde en befæstet by her i 1100-tallet f.Kr.; under assyrisk herredømme i 600-tallet blev den det største olivenolieproduktionscenter, der endnu er fundet i det antikke Nære Orient, med over hundrede presser. I dens tempel fandt udgraverne indskriften af »Akisj, søn af Padi, hersker over Ekron«; Padi er den konge, som Ekrons stormænd udleverede til Hizkija i 701 f.Kr., og som Sankerib genindsatte. Byen blev brændt i Nebukadnezars felttog på filisterkysten, sædvanligvis dateret 604 f.Kr., som Sefanja havde advaret: »Ekron skal oprykkes med Rod.«"
  sr:
    - "Акарон је Тел Микне, зван и Хирбет ел Мукана, хумка на унутрашњем рубу јужне обалне равнице Израела, око 36 км западно од Јерусалима правом линијом; тачка на карти стоји на њој. Био је најсевернији од пет филистејских градова, око 9 км северно од Гата, а поистовећење је сигурно: натпис пронађен тамо 1996. именује град."
    - "У Библији је Акарон најпознатији по свом богу. Кад је краљ Израела Охозија пао кроз решетку у Самарији, послао је посланике: „Идите, питајте Велзевула бога акаронског хоћу ли оздравити од ове болести“, пут од неких 64 км југозападно; Илија је срео посланике: „Еда ли нема Бога у Израиљу, те идете да питате Велзевула бога у Акарону?“ Име значи „господар мува“, можда подругљива измена Вал-зевула, „Вал кнез“; у Јеванђељима Веелзевул је кнез ђаволски. Раније је заробљени ковчег из Гата послат у Акарон, како читају хебрејски и Библија краља Џејмса; грчки и руски синодални текст овде имају Ашкелон. Пошто је Голијат пао, Израиљ је гонио Филистеје „до врата акаронских“."
    - "Труде Дотан и Сејмур Гитин ископавали су Тел Микне од 1981. до 1996. Филистеји су ту основали утврђен град у 12. веку п. н. е.; под асирском влашћу у 7. веку постао је највећи центар производње маслиновог уља који је до сада пронађен на древном Блиском истоку, са преко сто преса. У његовом храму ископавачи су нашли натпис „Ахиса сина Падијевог, владара Акарона“; Пади је краљ кога су акаронски племићи 701. п. н. е. предали Језекији и кога је Сенахирим вратио. Град је спаљен у Навуходоносоровом походу на филистејску обалу, обично датираном 604. п. н. е., као што је Софонија упозорио: „Акарон ће се искоренити.“"
  hu:
    - "Ekron a Tel Miqne, más néven Hirbet el-Mukanna, Izrael déli parti síkságának belső szélén fekvő halom, Jeruzsálemtől egyenes vonalban mintegy 36 km-re nyugatra; a térképi pont rajta áll. Az öt filiszteus város legészakibbika volt, Gáttól mintegy 9 km-re északra, és az azonosítás biztos: az ott 1996-ban talált felirat megnevezi a várost."
    - "A Bibliában Ekront leginkább istene miatt ismerik. Amikor Ahazja, Izráel királya áteste a szamáriai rácson, követeket küldött, hogy „kérdjetek tanácsot a Baálzebubtól, az Ekron istenétől, hogy meggyógyulok-é e betegségből?”, mintegy 64 km-es útra délnyugatra; Illés találkozott a követekkel: „Nincs-é Isten Izráelben, hogy Baálzebubhoz, az Ekron istenéhez mentek tanácsot kérdeni?” A név „legyek urát” jelent, talán a Baálzebul, „Baál herceg” gúnyos elferdítése; az evangéliumokban Beelzebub az ördögök fejedelme. Korábban az elfogott ládát Gátból Ekronba küldték tovább, ahogy a héber és a King James Biblia olvassa; a görög és az orosz szinodális itt Askelónt nevezi meg. Góliát bukása után Izráel a filiszteusokat üldözte „Ekron kapujáig”."
    - "Trude Dothan és Seymour Gitin 1981-től 1996-ig ásta a Tel Miqnét. A filiszteusok a Kr. e. 12. században erődített várost alapítottak itt; az asszír uralom alatt a 7. században a Közel-Kelet eddig talált legnagyobb olívaolaj-termelő központja lett, több mint száz présszel. Templomában a feltárók megtalálták „Ákis, Padi fia, Ekron uralkodója” feliratát; Padi az a király, akit Ekron nemesei Kr. e. 701-ben Ezékiásnak adtak át, és akit Szanhérib visszaállított. A várost Nabukodonozor filiszteus parti hadjárata során égették fel, amelyet általában Kr. e. 604-re kelteznek, ahogy Sofóniás figyelmeztetett: „Ekron kiirtatik.”"
  fi:
    - "Ekron on Tel Miqne, jota kutsutaan myös Khirbet el-Muqannaksi, kumpu Israelin eteläisen rannikkotasangon sisäreunalla, noin 36 km Jerusalemista länteen linnuntietä; karttapiste on sen päällä. Se oli viidestä filistealaiskaupungista pohjoisin, noin 9 km Gatista pohjoiseen, ja tunnistus on varma: siellä vuonna 1996 löydetty kirjoitus nimeää kaupungin."
    - "Raamatussa Ekron on tunnetuin jumalastaan. Kun Israelin kuningas Ahasja putosi Samariassa ristikon läpi, hän käski kysyä ”Baal-Sebubilta, Ekronin jumalalta, toivunko minä tästä taudista”, noin 64 km:n matkan lounaaseen; Elia kohtasi sanansaattajat: ”Eikö ole Jumalaa Israelissa, koska menette kysymään neuvoa Baal-Sebubilta, Ekronin jumalalta?” Nimi tarkoittaa ”kärpästen herraa”, ehkä pilkallinen muunnos Baal-Sebulista, ”ruhtinas Baalista”; evankeliumeissa Beelsebul on riivaajain päämies. Aiemmin vangittu arkki lähetettiin Gatista Ekroniin, kuten heprealainen teksti ja King Jamesin Raamattu lukevat; kreikkalainen ja venäläinen synodaalinen teksti nimeävät tässä Askelonin. Goljatin kaaduttua Israel ajoi filistealaisia takaa ”Ekronin porteille saakka”."
    - "Trude Dothan ja Seymour Gitin kaivoivat Tel Miqneä vuosina 1981–1996. Filistealaiset perustivat tänne linnoitetun kaupungin 1100-luvulla eaa.; Assyrian vallan alla 600-luvulla siitä tuli suurin tähän mennessä löydetty oliiviöljyn tuotantokeskus muinaisessa Lähi-idässä, yli sadalla puristimella. Sen temppelistä kaivajat löysivät kirjoituksen ”Akis, Padin poika, Ekronin hallitsija”; Padi on kuningas, jonka Ekronin ylimykset luovuttivat Hiskialle vuonna 701 eaa. ja jonka Sanherib palautti. Kaupunki poltettiin Nebukadnessarin filistealaisrannikon sotaretkellä, joka ajoitetaan yleensä vuoteen 604 eaa., kuten Sefanja oli varoittanut: ”Ekron hävitetään.”"
  vi:
    - "Éc-rôn là Tel Miqne, còn gọi là Khirbet el-Muqanna, một gò ở rìa trong của đồng bằng ven biển phía nam Israel, cách Giê-ru-sa-lem khoảng 36 km về phía tây theo đường thẳng; điểm bản đồ đứng trên đó. Đó là thành cực bắc trong năm thành Phi-li-tin, cách Gát khoảng 9 km về phía bắc, và sự đồng nhất là chắc chắn: một bia ký tìm thấy ở đó năm 1996 nêu tên thành."
    - "Trong Kinh Thánh, Éc-rôn nổi tiếng nhất vì thần của nó. Khi vua A-cha-xia của Y-sơ-ra-ên té qua song lầu ở Sa-ma-ri, ông sai người “đi cầu vấn Ba-anh-Xê-bụt, thần của Éc-rôn, đặng cho biết ta sẽ lành bịnh này chăng”, một chuyến đi khoảng 64 km về phía tây nam; Ê-li gặp các sứ giả: “Trong Y-sơ-ra-ên há không có Đức Chúa Trời sao, nên ngươi đi cầu vấn Ba-anh-Xê-bụt, thần của Éc-rôn?” Tên nghĩa là “chúa của ruồi”, có lẽ là cách đổi mỉa mai của Ba-anh-Xê-bun, “Ba-anh vương tử”; trong các sách Phúc Âm, Bê-ên-xê-bun là chúa quỉ. Trước đó hòm giao ước bị bắt được gửi từ Gát đến Éc-rôn, như bản Hê-bơ-rơ và King James đọc; bản Hy Lạp và Synodal của Nga ghi Ách-ca-lôn ở đây. Sau khi Gô-li-át ngã, Y-sơ-ra-ên đuổi người Phi-li-tin “cho đến cửa thành Gát và Éc-rôn”."
    - "Trude Dothan và Seymour Gitin khai quật Tel Miqne từ 1981 đến 1996. Người Phi-li-tin lập một thành kiên cố ở đây vào thế kỷ 12 TCN; dưới ách Assyria vào thế kỷ 7, nó trở thành trung tâm sản xuất dầu ô-li-ve lớn nhất từng tìm thấy ở Cận Đông cổ đại, với hơn một trăm máy ép. Trong đền của nó, các nhà khai quật tìm thấy bia ký của “A-kích con của Padi, người cai trị Éc-rôn”; Padi là vua mà các quý tộc Éc-rôn giao cho Ê-xê-chia năm 701 TCN và San-chê-ríp phục hồi. Thành bị đốt trong cuộc chinh phạt của Nê-bu-cát-nết-sa trên bờ biển Phi-li-tin, thường xác định vào 604 TCN, như Sô-phô-ni đã cảnh báo: “Éc-rôn sẽ bị nhổ đi.”"
  ro:
    - "Ecron este Tel Miqne, numit și Khirbet el-Muqanna, o movilă la marginea interioară a câmpiei de coastă din sudul Israelului, la circa 36 km vest de Ierusalim în linie dreaptă; punctul de pe hartă stă pe ea. Era cel mai nordic dintre cele cinci orașe filistene, la circa 9 km nord de Gat, iar identificarea este sigură: o inscripție găsită acolo în 1996 numește orașul."
    - "În Biblie, Ecronul este cunoscut mai ales pentru zeul său. Când regele Ahazia al Israelului a căzut printr-un grilaj în Samaria, a trimis să-l întrebe pe Baal-Zebub, zeul Ecronului, dacă se va vindeca de boala aceasta, un drum de circa 64 km spre sud-vest; Ilie a întâmpinat solii și le-a spus: nu pentru că nu este Dumnezeu în Israel mergeți să-l întrebați pe Baal-Zebub, zeul Ecronului? Numele înseamnă „stăpânul muștelor”, poate o schimbare batjocoritoare a lui Baal-Zebul, „Baal prințul”; în Evanghelii, Beelzebul este „domnul dracilor”. Mai devreme, chivotul capturat a fost trimis mai departe de la Gat la Ecron, așa cum citesc ebraica și versiunea King James; Biblia greacă și textul sinodal rus numesc aici Ascalonul. După căderea lui Goliat, Israel i-a urmărit pe filisteni până la porțile Ecronului."
    - "Trude Dothan și Seymour Gitin au săpat Tel Miqne din 1981 până în 1996. Filistenii au întemeiat aici un oraș întărit în secolul al XII-lea î.Hr.; sub stăpânirea asiriană, în secolul al VII-lea, a devenit cel mai mare centru de producție de ulei de măsline găsit până acum în Orientul Apropiat antic, cu peste o sută de prese. În templul lui, săpătorii au găsit inscripția lui „Achiș fiul lui Padi, conducătorul Ecronului”; Padi este regele pe care nobilii Ecronului l-au predat lui Ezechia în 701 î.Hr. și pe care Senaherib l-a repus pe tron. Orașul a fost ars în campania lui Nebucadnețar pe coasta filisteană, datată de obicei 604 î.Hr., cum avertizase Țefania: „Acaronul se va desrădăcinà.”"
  bg:
    - "Екрон е Тел Микне, наричан също Хирбет ел-Муканна, могила на вътрешния край на южната крайбрежна равнина на Израел, на около 36 км западно от Йерусалим по права линия; точката на картата стои на нея. Той бил най-северният от петте филистимски града, на около 9 км северно от Гет, и отъждествяването е сигурно: надпис, открит там през 1996 г., назовава града."
    - "В Библията Екрон е най-известен с бога си. Когато израилският цар Охозия паднал през решетката в Самария, той пратил вестители: „Идете, попитайте Ваал-зевува Акаронския бог да ли ще оздравея от тази болест“ — път от около 64 км на югозапад; Илия посрещнал пратениците: „Няма ли Бог в Израил та отивате да попитате Ваал-зевува Акаронския бог?“ Името означава „господар на мухите“, може би подигравателна промяна на Баал-зебул, „Баал князът“; в Евангелията Веелзевул е началникът на бесовете. По-рано плененият ковчег бил пратен от Гет в Екрон, както четат еврейският текст и King James; гръцкият и руският Синодален тук назовават Аскалон. След падането на Голиат Израил гонил филистимците „дори до портите на Акарон“."
    - "Труде Дотан и Сиймор Гитин разкопавали Тел Микне от 1981 до 1996 г. Филистимците основали тук укрепен град през XII в. пр.н.е.; под асирийска власт през VII в. той станал най-големият център за производство на маслинено масло, открит досега в древния Близък изток, с над сто преси. В храма му археолозите открили надписа на „Анхус, син на Пади, владетел на Екрон“; Пади е царят, когото знатните на Екрон предали на Езекия през 701 г. пр.н.е. и когото Сенахирим върнал на престола. Градът бил изгорен при похода на Навуходоносор по филистимския бряг, обикновено датиран 604 г. пр.н.е., както предупредил Софония: „Акарон ще се искорени.“"
