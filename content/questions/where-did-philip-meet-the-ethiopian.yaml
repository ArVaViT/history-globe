id: where-did-philip-meet-the-ethiopian
question:
  en: "Where did Philip baptize the Ethiopian eunuch?"
  ru: "Где Филипп крестил эфиопского евнуха?"
  uk: "Де Филип охрестив ефіопського євнуха?"
  es: "¿Dónde bautizó Felipe al eunuco etíope?"
  pt: "Onde Filipe batizou o eunuco etíope?"
  de: "Wo taufte Philippus den äthiopischen Kämmerer?"
  fr: "Où Philippe a-t-il baptisé l’eunuque éthiopien ?"
  pl: "Gdzie Filip ochrzcił etiopskiego eunucha?"
  it: "Dove Filippo battezzò l’eunuco etiope?"
  nl: "Waar doopte Filippus de Ethiopische kamerling?"
  cs: "Kde Filip pokřtil etiopského eunucha?"
  sv: "Var döpte Filippos den etiopiske eunucken?"
  nb: "Hvor møtte Filip den etiopiske hoffmannen?"
  tl: "Saan binautismuhan ni Felipe ang bating na Etiope?"
  da: "Hvor døbte Filip den etiopiske hofmand?"
answer:
  en:
    - "Somewhere on the road from Jerusalem down to Gaza, the last town before the desert on the way to Egypt, about 79 km south-west of Jerusalem in a straight line; Acts names no place. Two traditions claim the water. Eusebius and Jerome put it at a spring below Beth-zur, about 25 km south of Jerusalem on the road to Hebron, today Ain ed-Dirweh; a later tradition holds to Ein Hanniya in the Rephaim valley on the south-western edge of the city, where the remains of a Byzantine church stand by the spring. Afterwards Philip “was found at Azotus”, Ashdod, 34 km up the coast from Gaza, and preached northward 86 km to Caesarea, where he settled."
    - "Acts tells it: the angel said to Philip, “Arise, and go toward the south unto the way that goeth down from Jerusalem unto Gaza, which is desert”; there he met “a man of Ethiopia, an eunuch of great authority under Candace queen of the Ethiopians, who had the charge of all her treasure, and had come to Jerusalem for to worship”, reading Isaiah in his chariot. “And as they went on their way, they came unto a certain water: and the eunuch said, See, here is water; what doth hinder me to be baptized?” “And he commanded the chariot to stand still: and they went down both into the water, both Philip and the eunuch; and he baptized him.” Then “the Spirit of the Lord caught away Philip, that the eunuch saw him no more: and he went on his way rejoicing”."
    - "Ethiopia here is Kush, the kingdom on the Nile beyond Egypt with its capital at Meroë in today's Sudan, some 1,650 km from Jerusalem in a straight line, not the Ethiopia of the Aksumite highlands; Candace is not a name but kandake, the title of its queen mothers, as Pliny notes. The words “which is desert” may describe the road through the Judaean hills or Gaza itself, whose old city Strabo says lay deserted after Alexander razed it, the new town standing nearer the sea. The map's year is about AD 34, with the scattering of the church after Stephen's death. The place card lists the candidate springs."
  ru:
    - "Где-то на дороге из Иерусалима в Газу, последний город перед пустыней на пути в Египет, примерно в 79 км к юго-западу от Иерусалима по прямой; Деяния места не называют. На эту воду притязают два предания. Евсевий и Иероним помещали её у источника под Беф-Цуром, примерно в 25 км к югу от Иерусалима на дороге в Хеврон, — ныне Айн-эд-Дирве; более позднее предание держится за Эйн-Ханию в долине Рефаим, на юго-западной окраине города, где у источника стоят остатки византийской церкви. Потом Филипп «оказался в Азоте» — Ашдоде, в 34 км вверх по берегу от Газы, — и проповедовал на север 86 км до Кесарии, где и поселился."
    - "Деяния рассказывают: ангел сказал Филиппу: «встань и иди на полдень, на дорогу, идущую из Иерусалима в Газу, на ту, которая пуста»; там ему встретился «муж Ефиоплянин, евнух, вельможа Кандакии, царицы Ефиопской, хранитель всех сокровищ ее, приезжавший в Иерусалим для поклонения», который читал в колеснице Исаию. «Между тем, продолжая путь, они приехали к воде; и евнух сказал: вот вода; что препятствует мне креститься?» «И приказал остановить колесницу, и сошли оба в воду, Филипп и евнух; и крестил его». Затем «Филиппа восхитил Ангел Господень, и евнух уже не видел его и продолжал путь, радуясь»."
    - "Эфиопия здесь — Куш, царство на Ниле за Египтом со столицей в Мероэ в нынешнем Судане, примерно в 1650 км от Иерусалима по прямой, а не Эфиопия Аксумского нагорья; Кандакия — не имя, а «кандаке», титул тамошних цариц-матерей, как отмечает Плиний. Слова «на ту, которая пуста» могут относиться к дороге через Иудейские горы или к самой Газе, старый город которой, по Страбону, лежал в запустении после того, как Александр его разрушил, а новый стоял ближе к морю. Год на карте — около 34 г. н. э., когда церковь рассеялась после смерти Стефана. Карточка места перечисляет источники-кандидаты."
  uk:
    - "Десь на дорозі, що спускається з Єрусалиму до Гази, останнього міста перед пустелею на шляху до Єгипту, приблизно за 79 км на південний захід від Єрусалиму по прямій; Дії не називають місця. Дві традиції претендують на воду. Євсевій та Єронім ставлять це біля джерела під Бет-Цуром, приблизно за 25 км на південь від Єрусалиму на дорозі до Хеврона, нині Айн-ед-Дірве; пізніша традиція тримається Ейн-Ханії в долині Рефаїм на південно-західному краю міста, де біля джерела стоять рештки візантійської церкви. Згодом Филип «опинивсь ув Азотї», Ашдоді, за 34 км угору узбережжям від Гази, і проповідував на північ за 86 км до Кесарії, де й оселився."
    - "Дії розповідають: ангел сказав Филипові: «Устань, та йди на полуднє дорогою, що йде з Єрусалиму в Газу; вона пуста»; там, як сказано, був «чоловік із Єтіопиї, євнух, вельможа Кандакиї, царицї Єтіопської, що був над усїм скарбом її; він приходив поклонитись у Єрусалим», і він читав Ісаю на колісниці. «Верстаючи ж дорогу, прибули до води; й каже євнух: Ось вода; що боронить менї охреститись?» «І звелїв зʼупинити воза; й увійшли обидва в воду, Филип і євнух; і охрестив його». Тоді «Дух Господень ухопив Филипа, і не бачив його більш євнух; і пійшов дорогою своєю, радуючись»."
    - "Ефіопія тут — це Куш, царство на Нілі за Єгиптом зі столицею в Мероє в нинішньому Судані, приблизно за 1650 км від Єрусалиму по прямій, а не Ефіопія Аксумського нагір'я; Кандака — не ім'я, а кандаке, титул цариць-матерів, як зазначає Пліній. Слова «вона пуста» можуть описувати дорогу через юдейські пагорби або саму Газу, чиє старе місто, за Страбоном, лежало спустошеним після того, як його зруйнував Александр, а нове місто стояло ближче до моря. Рік мапи — близько 34 р. н. е., з розсіянням церкви після смерті Стефана. Картка місця перелічує джерела-кандидати."
  es:
    - "En algún punto del camino que baja de Jerusalén a Gaza, la última población antes del desierto en el camino a Egipto, a unos 79 km al suroeste de Jerusalén en línea recta; Hechos no nombra ningún lugar. Dos tradiciones reclaman el agua. Eusebio y Jerónimo la ponen en una fuente bajo Bet-sur, a unos 25 km al sur de Jerusalén en el camino de Hebrón, hoy Ain ed-Dirweh; una tradición posterior sostiene Ein Hanniya, en el valle de Refaím, en el borde suroeste de la ciudad, donde junto a la fuente quedan los restos de una iglesia bizantina. Después Felipe «se halló en Azoto», Asdod, a 34 km costa arriba desde Gaza, y predicó hacia el norte 86 km hasta Cesarea, donde se estableció."
    - "Hechos lo cuenta: el ángel dijo a Felipe: «Levántate y ve hacia el mediodía, al camino que desciende de Jerusalem á Gaza, el cual es desierto»; allí encontró a «un Etiope, eunuco, gobernador de Candace, reina de los Etiopes, el cual era puesto sobre todos sus tesoros, y había venido á adorar á Jerusalem», que leía a Isaías en su carro. «Y yendo por el camino, llegaron á cierta agua; y dijo el eunuco: He aquí agua; ¿qué impide que yo sea bautizado?». «Y mandó parar el carro: y descendieron ambos al agua, Felipe y el eunuco; y bautizóle». Entonces «el Espíritu del Señor arrebató á Felipe; y no le vió más el eunuco, y se fué por su camino gozoso»."
    - "Etiopía es aquí Kush, el reino del Nilo más allá de Egipto, con su capital en Meroe, en el actual Sudán, a unos 1650 km de Jerusalén en línea recta, no la Etiopía de las tierras altas de Aksum; Candace no es un nombre sino kandake, el título de sus reinas madres, como señala Plinio. Las palabras «el cual es desierto» pueden describir el camino por las colinas de Judea o la propia Gaza, cuya vieja ciudad, dice Estrabón, quedó desierta después de que Alejandro la arrasara, alzándose la ciudad nueva más cerca del mar. El año del mapa es hacia el 34 d. C., con la dispersión de la Iglesia tras la muerte de Esteban. La ficha del lugar enumera las fuentes candidatas."
  pt:
    - "Em algum ponto da estrada que desce de Jerusalém a Gaza, a última cidade antes do deserto no caminho do Egito, a cerca de 79 km a sudoeste de Jerusalém em linha reta; Atos não nomeia lugar. Duas tradições reivindicam a água. Eusébio e Jerônimo a põem numa fonte abaixo de Bete-Zur, a cerca de 25 km ao sul de Jerusalém na estrada de Hebrom, hoje Ain ed-Dirweh; uma tradição posterior sustenta Ein Hanniya, no vale de Refaim, na borda sudoeste da cidade, onde restos de uma igreja bizantina estão junto à fonte. Depois Filipe “foi achado em Azoto”, Asdode, 34 km costa acima de Gaza, e pregou rumo ao norte 86 km até Cesareia, onde se fixou."
    - "Atos conta: o anjo disse a Filipe: “Levante-se e vá para o sul, para o caminho que desce de Jerusalém a Gaza. Este é um deserto”; ali ele encontrou “um homem da Etiópia, um eunuco de grande autoridade sob Candace, rainha dos etíopes, responsável por todos os tesouros da rainha, que tinha vindo a Jerusalém para adorar”, lendo Isaías em sua carruagem. “Enquanto seguiam pelo caminho, chegaram a um lugar com água; e o eunuco disse: ‘Eis aqui água. O que me impede de ser batizado?’” “Ele mandou parar a carruagem, e ambos desceram à água, tanto Filipe como o eunuco, e ele o batizou.” Então “o Espírito do Senhor arrebatou Filipe, e o eunuco não o viu mais, e seguiu o seu caminho cheio de alegria”."
    - "A Etiópia aqui é Cuxe, o reino do Nilo além do Egito, com capital em Meroé, no Sudão de hoje, a cerca de 1.650 km de Jerusalém em linha reta, não a Etiópia das terras altas de Aksum; Candace não é nome, mas kandake, título de suas rainhas-mães, como nota Plínio. As palavras “Este é um deserto” podem descrever a estrada pelos montes da Judeia ou a própria Gaza, cuja cidade velha, diz Estrabão, jazia deserta depois que Alexandre a arrasou, estando a nova mais perto do mar. O ano do mapa é cerca de 34 d.C., com a dispersão da igreja depois da morte de Estêvão. A ficha do lugar lista as fontes candidatas."
  de:
    - "Irgendwo auf der Straße von Jerusalem hinab nach Gaza, der letzten Stadt vor der Wüste auf dem Weg nach Ägypten, in der Luftlinie etwa 79 km südwestlich von Jerusalem; die Apostelgeschichte nennt keinen Ort. Zwei Überlieferungen beanspruchen das Wasser. Eusebius und Hieronymus setzen es an eine Quelle unterhalb von Bet-Zur, etwa 25 km südlich von Jerusalem an der Straße nach Hebron, heute Ain ed-Dirweh; eine spätere Überlieferung hält an Ein Hanija im Refaïmtal am südwestlichen Stadtrand fest, wo bei der Quelle die Reste einer byzantinischen Kirche stehen. Danach ward Philippus „gefunden zu Asdod“, Aschdod, 34 km die Küste hinauf von Gaza, und predigte 86 km nordwärts bis Caesarea, wo er sich niederließ."
    - "Die Apostelgeschichte erzählt: Der Engel sagte zu Philippus: „Stehe auf und gehe gegen Mittag auf die Straße, die von Jerusalem geht hinab gen Gaza, die da wüst ist“; dort traf er einen Mann aus Äthiopien, „ein Kämmerer und Gewaltiger der Königin Kandaze ..., welcher war über ihre ganze Schatzkammer, der war gekommen gen Jerusalem, anzubeten“, der in seinem Wagen Jesaja las. „Und als sie zogen der Straße nach, kamen sie an ein Wasser. Und der Kämmerer sprach: Siehe, da ist Wasser; was hindert's, daß ich mich taufen lasse?“ „Und er hieß den Wagen halten, und stiegen hinab in das Wasser beide, Philippus und der Kämmerer, und er taufte ihn.“ Dann „rückte der Geist des HERRN Philippus hinweg, und der Kämmerer sah ihn nicht mehr; er zog aber seine Straße fröhlich“."
    - "Äthiopien ist hier Kusch, das Königreich am Nil jenseits Ägyptens mit der Hauptstadt Meroë im heutigen Sudan, in der Luftlinie rund 1650 km von Jerusalem, nicht das Äthiopien des Hochlands von Aksum; Kandake ist kein Name, sondern der Titel der Königinmütter, wie Plinius bemerkt. Die Worte „die da wüst ist“ können die Straße durch die judäischen Berge oder Gaza selbst beschreiben, dessen alte Stadt nach Strabon nach Alexanders Zerstörung verödet lag, während die neue näher am Meer stand. Das Kartenjahr ist etwa 34 n. Chr., mit der Zerstreuung der Gemeinde nach dem Tod des Stephanus. Die Ortskarte führt die infrage kommenden Quellen auf."
  fr:
    - "Quelque part sur la route qui descend de Jérusalem à Gaza, dernière ville avant le désert sur le chemin de l’Égypte, à environ 79 km au sud-ouest de Jérusalem en ligne droite ; les Actes ne nomment aucun lieu. Deux traditions revendiquent l’eau. Eusèbe et Jérôme la placent à une source sous Beth-Tsur, à environ 25 km au sud de Jérusalem sur la route d’Hébron, aujourd’hui Aïn ed-Dirweh ; une tradition postérieure tient pour Aïn Hanniya, dans la vallée des Rephaïm, à la lisière sud-ouest de la ville, où les vestiges d’une église byzantine se dressent près de la source. Ensuite Philippe « se trouva dans Azot », Asdod, à 34 km au nord de Gaza sur la côte, et prêcha vers le nord sur 86 km jusqu’à Césarée, où il s’établit."
    - "Les Actes racontent : l’ange dit à Philippe : « Lève-toi, et va du côté du midi, sur le chemin qui descend de Jérusalem à Gaza, celui qui est désert » ; il y rencontra « un Éthiopien, un eunuque, ministre de Candace, reine d’Éthiopie, et surintendant de tous ses trésors, venu à Jérusalem pour adorer », qui lisait Ésaïe dans son char. « Comme ils continuaient leur chemin, ils rencontrèrent de l’eau. Et l’eunuque dit : Voici de l’eau ; qu’est-ce qui empêche que je sois baptisé ? » « Il fit arrêter le char ; Philippe et l’eunuque descendirent tous deux dans l’eau, et Philippe baptisa l’eunuque. » Puis « l’Esprit du Seigneur enleva Philippe, et l’eunuque ne le vit plus. Tandis que, joyeux, il poursuivait sa route »."
    - "L’Éthiopie est ici Koush, le royaume du Nil au-delà de l’Égypte, dont la capitale était Méroé, dans le Soudan actuel, à quelque 1 650 km de Jérusalem en ligne droite, et non l’Éthiopie des hautes terres d’Aksoum ; Candace n’est pas un nom mais kandake, titre des reines mères, comme le note Pline. Les mots « celui qui est désert » peuvent décrire la route à travers les collines de Judée ou Gaza elle-même, dont l’ancienne ville, dit Strabon, resta déserte après qu’Alexandre l’eut rasée, la ville nouvelle se tenant plus près de la mer. L’année de la carte est vers 34 apr. J.-C., avec la dispersion de l’Église après la mort d’Étienne. La fiche du lieu énumère les sources candidates."
  pl:
    - "Gdzieś na drodze z Jerozolimy w dół do Gazy, ostatniego miasta przed pustynią w drodze do Egiptu, około 79 km na południowy zachód od Jerozolimy w linii prostej; Dzieje nie podają żadnego miejsca. O wodę ubiegają się dwie tradycje. Euzebiusz i Hieronim umieszczali ją przy źródle poniżej Bet-Sur, około 25 km na południe od Jerozolimy na drodze do Hebronu, dziś Ajn ed-Dirwa; późniejsza tradycja trzyma się Ajn Hanija w dolinie Refaim na południowo-zachodnim skraju miasta, gdzie przy źródle stoją szczątki bizantyjskiego kościoła. Potem „Filip aż w Azocie jest znaleziony”, czyli w Aszdodzie, 34 km w górę wybrzeża od Gazy, i głosił na północ 86 km do Cezarei, gdzie osiadł."
    - "Dzieje opowiadają: anioł rzekł do Filipa: „Wstań, a idź ku południowi na drogę, która od Jeruzalemu idzie ku Gazie, która jest pusta”; tam spotkał etiopskiego eunucha, dostojnika królowej Kandake, który zarządzał wszystkimi jej skarbami i przyjechał do Jerozolimy, aby oddać cześć Bogu, a teraz czytał Izajasza na wozie. „A gdy jechali drogą, przyjechali nad jednę wodę. Tedy rzekł rzezaniec: Otóż woda! Cóż na przeszkodzie, abym nie miał być ochrzczony?” „I kazał stanąć wozowi; i zstąpili obadwaj w wodę, Filip i rzezaniec, i ochrzcił go.” Potem „porwał Filipa Duch Pański i nie widział go więcej rzezaniec, ale jechał drogą swoją, radując się”."
    - "Etiopia to tu Kusz, królestwo nad Nilem za Egiptem ze stolicą w Meroe w dzisiejszym Sudanie, około 1650 km od Jerozolimy w linii prostej, nie Etiopia wyżyn aksumickich; Kandake nie jest imieniem, lecz kandake, tytułem jej królowych matek, jak notuje Pliniusz. Słowa „która jest pusta” mogą opisywać drogę przez wzgórza judzkie albo samą Gazę, której stare miasto, jak mówi Strabon, leżało opuszczone po zniszczeniu go przez Aleksandra, a nowe miasto stało bliżej morza. Rok mapy to około 34 n.e., z rozproszeniem Kościoła po śmierci Szczepana. Karta miejsca wymienia kandydujące źródła."
  it:
    - "Da qualche parte sulla strada che scende da Gerusalemme a Gaza, l’ultima città prima del deserto sulla via dell’Egitto, a circa 79 km a sud-ovest di Gerusalemme in linea retta; gli Atti non nominano alcun luogo. Due tradizioni rivendicano l’acqua. Eusebio e Girolamo la pongono a una sorgente sotto Bet-Zur, a circa 25 km a sud di Gerusalemme sulla strada per Ebron, oggi Ain ed-Dirweh; una tradizione posteriore tiene per Ein Hanniya nella valle dei Refaim, al margine sud-occidentale della città, dove i resti di una chiesa bizantina sorgono presso la sorgente. In seguito Filippo «si ritrovò in Azot», Asdod, a 34 km sulla costa a nord di Gaza, e predicò verso nord per 86 km fino a Cesarea, dove si stabilì."
    - "Lo racconta Atti: l’angelo disse a Filippo: «Lèvati, e vattene dalla parte di mezzodì, sulla via che scende da Gerusalemme a Gaza. Ella è una via deserta»; là incontrò «un Etiopo, un eunuco, ministro di Candace, regina degli Etiopi, il quale era sovrintendente di tutti i tesori di lei, era venuto a Gerusalemme per adorare», che leggeva Isaia sul carro. «E cammin facendo, giunsero a una cert’acqua. E l’eunuco disse: Ecco dell’acqua; che impedisce che io sia battezzato?» «E comandò che il carro si fermasse; e discesero ambedue nell’acqua, Filippo e l’eunuco; e Filippo lo battezzò». Poi «lo Spirito del Signore rapì Filippo; e l’eunuco, continuando il suo cammino tutto allegro, non lo vide più»."
    - "L’Etiopia qui è Kush, il regno sul Nilo oltre l’Egitto con capitale a Meroe nell’odierno Sudan, a circa 1.650 km da Gerusalemme in linea retta, non l’Etiopia degli altopiani aksumiti; Candace non è un nome ma kandake, il titolo delle sue regine madri, come nota Plinio. Le parole «è una via deserta» possono descrivere la strada attraverso le colline della Giudea o la stessa Gaza, la cui vecchia città, dice Strabone, giaceva deserta dopo che Alessandro la rase al suolo, mentre la nuova sorgeva più vicino al mare. L’anno della mappa è il 34 d.C. circa, con la dispersione della Chiesa dopo la morte di Stefano. La scheda del luogo elenca le sorgenti candidate."
  nl:
    - "Ergens aan de weg van Jeruzalem naar beneden naar Gaza, de laatste stad vóór de woestijn op weg naar Egypte, hemelsbreed ongeveer 79 km ten zuidwesten van Jeruzalem; Handelingen noemt geen plaats. Twee overleveringen claimen het water. Eusebius en Hiëronymus plaatsen het bij een bron onder Beth-Zur, ongeveer 25 km ten zuiden van Jeruzalem aan de weg naar Hebron, nu Ain ed-Dirweh; een latere overlevering houdt vast aan Ein Hanniya in het Refaïmdal aan de zuidwestrand van de stad, waar de resten van een Byzantijnse kerk bij de bron staan. Daarna: “Maar Filippus werd gevonden, te Azote”, Asdod, 34 km langs de kust ten noorden van Gaza, en predikte noordwaarts, 86 km tot Caesarea, waar hij zich vestigde."
    - "Handelingen vertelt het: de engel zei tot Filippus: “Sta op, en ga heen tegen het zuiden, op den weg, die van Jeruzalem afdaalt naar Gaza, welke woest is”; daar ontmoette hij “een Moorman, een kamerling, en een machtig heer van Candace, de koningin der Moren, die over al haar schat was, welke was gekomen om aan te bidden te Jeruzalem”, die Jesaja las in zijn wagen. “En alzo zij over weg reisden, kwamen zij aan een zeker water; en de kamerling zeide: Ziedaar water; wat verhindert mij gedoopt te worden?” “En hij gebood den wagen stil te houden; en zij daalden beiden af in het water, zo Filippus als de kamerling, en hij doopte hem.” Toen “nam de Geest des Heeren Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap”."
    - "Ethiopië is hier Kush, het koninkrijk aan de Nijl voorbij Egypte met zijn hoofdstad Meroë in het huidige Soedan, hemelsbreed zo’n 1.650 km van Jeruzalem, niet het Ethiopië van het Aksumitische hoogland; Candace is geen naam maar kandake, de titel van de koningsmoeders, zoals Plinius opmerkt. De woorden “welke woest is” kunnen de weg door het Judese bergland beschrijven of Gaza zelf, waarvan de oude stad volgens Strabo verlaten lag nadat Alexander haar had geslecht, terwijl de nieuwe stad dichter bij de zee stond. Het jaar op de kaart is ongeveer 34 n.Chr., met de verstrooiing van de kerk na de dood van Stefanus. De plaatskaart noemt de kandidaat-bronnen."
  cs:
    - "Někde na cestě z Jeruzaléma dolů do Gazy, posledního města před pouští na cestě do Egypta, asi 79 km jihozápadně od Jeruzaléma vzdušnou čarou; Skutky nejmenují žádné místo. Vodu si nárokují dvě tradice. Eusebios a Jeroným ji kladou k pramenu pod Bét-cúrem, asi 25 km jižně od Jeruzaléma na cestě do Hebronu, dnes Ajn ad-Dirwa; pozdější tradice se drží Ajn Hanija v údolí Refájim na jihozápadním okraji města, kde u pramene stojí zbytky byzantského kostela. Poté, jak se praví, Filip „nalezen jest v Azotu“, Ašdodu, 34 km po pobřeží severně od Gazy, a kázal na sever 86 km do Cesareje, kde se usadil."
    - "Skutky to vyprávějí: anděl řekl Filipovi: „Vstaň a jdi ku polední straně na cestu, kteráž vede od Jeruzaléma do města Gázy, kteréž jest pusté“; tam potkal muže, o němž Skutky říkají: „muž Mouřenín, kleštěnec, komorník královny Mouřenínské Kandáces, kterýž vládl všemi poklady jejími, a byl přijel do Jeruzaléma, aby se modlil“; ve voze četl Izajáše. „A když jeli cestou, přijeli k jedné vodě. I řekl komorník: Aj, teď voda. Proč nemám býti pokřtěn?“ „I rozkázal státi vozu, a sstoupili oba do vody, i Filip i komorník. I pokřtil ho.“ Potom „Duch Páně pochopil Filipa, a neviděl ho více komorník; i jel cestou svou, raduje se“."
    - "Etiopií se zde myslí Kúš, království na Nilu za Egyptem s hlavním městem Meroe v dnešním Súdánu, asi 1 650 km od Jeruzaléma vzdušnou čarou, nikoli etiopská Aksúmská vysočina; Kandaké není jméno, ale kandake, titul jeho královen matek, jak poznamenává Plinius. Slova „kteréž jest pusté“ mohou popisovat cestu judskými horami nebo samotnou Gazu, jejíž staré město podle Strabona leželo po Alexandrově zboření opuštěné, zatímco nové město stálo blíž k moři. Rok na mapě je asi 34 n. l., s rozptýlením církve po Štěpánově smrti. Karta místa uvádí kandidátské prameny."
  sv:
    - "Någonstans på vägen från Jerusalem ned till Gaza, den sista staden före öknen på vägen till Egypten, omkring 79 km sydväst om Jerusalem fågelvägen; Apostlagärningarna nämner ingen plats. Två traditioner gör anspråk på vattnet. Eusebios och Hieronymus förlägger det till en källa nedanför Bet-Sur, omkring 25 km söder om Jerusalem på vägen till Hebron, i dag Ain ed-Dirweh; en senare tradition håller sig till Ein Hanniya i Refaimdalen vid stadens sydvästra kant, där resterna av en bysantinsk kyrka står vid källan. Efteråt ”blev Filippus ... sedd i Asdod”, Ashdod, 34 km uppför kusten från Gaza, och förkunnade norrut 86 km till Caesarea, där han bosatte sig."
    - "Apostlagärningarna berättar: ängeln sade till Filippos: ”Stå upp och begiv dig vid middagstiden ut på den väg som leder ned från Jerusalem till Gasa; den är tom på folk”; där mötte han ”en etiopisk man ... en hovman som var en mäktig herre hos Kandace, drottningen i Etiopien, och var satt över hela hennes skattkammare. Denne hade kommit till Jerusalem för att där tillbedja”, som läste Jesaja i sin vagn. ”Och medan de färdades vägen fram, kommo de till ett vatten. Då sade hovmannen: ’Se, här finnes vatten. Vad hindrar att jag döpes?’” ”Och han lät vagnen stanna; och de stego båda ned i vattnet, Filippus och hovmannen, och han döpte honom.” Sedan ”ryckte Herrens Ande bort Filippus, och hovmannen såg honom icke mer, då han nu glad fortsatte sin färd”."
    - "Etiopien är här Kush, kungariket vid Nilen bortom Egypten med huvudstad i Meroë i dagens Sudan, omkring 1 650 km från Jerusalem fågelvägen, inte Etiopien i Aksums högland; Kandace är inte ett namn utan kandake, titeln på dess drottningmödrar, som Plinius noterar. Orden ”den är tom på folk” kan beskriva vägen genom de judeiska bergen eller Gaza självt, vars gamla stad enligt Strabon låg öde efter att Alexander jämnat den med marken, medan den nya staden låg närmare havet. Kartans år är omkring 34 e.Kr., med kyrkans skingring efter Stefanos död. Platskortet förtecknar de möjliga källorna."
  nb:
    - "Et sted på veien fra Jerusalem ned til Gasa, den siste byen før ørkenen på veien til Egypt, omtrent 79 km sørvest for Jerusalem i luftlinje; Apostlenes gjerninger nevner ikke noe sted. To tradisjoner gjør krav på vannet. Eusebius og Hieronymus satte det til en kilde under Bet-Sur, omtrent 25 km sør for Jerusalem på veien til Hebron, i dag Ain ed-Dirweh; en senere tradisjon holder på Ein Hanniya i Refaim-dalen i byens sørvestlige utkant, der restene av en bysantinsk kirke står ved kilden. Etterpå ble Filip «funnet i Asdod», Asjdod, 34 km oppover kysten fra Gasa, og forkynte nordover 86 km til Cæsarea, hvor han slo seg ned."
    - "Apostlenes gjerninger forteller: engelen sa til Filip: «Stå op og gå mot syd, på den vei som går ned fra Jerusalem til Gasa! Denne vei er øde.» Der møtte han «en etioper, en hoffmann, en høi embedsmann hos Kandake, etiopernes dronning, en som var satt over hele hennes skatt; han var kommet til Jerusalem for å tilbede», som leste Jesaja i vognen sin. «Og som de drog frem på veien, kom de til et sted hvor det var vann, og hoffmannen sa: Se, her er vann; hvad er til hinder for at jeg blir døpt?» «Og han bød vognen holde, og de steg ned i vannet, både Filip og hoffmannen, og han døpte ham.» Så «rykte Herrens Ånd Filip bort, og hoffmannen så ham ikke lenger; for han drog sin vei med glede»."
    - "Etiopia er her Kush, kongeriket ved Nilen hinsides Egypt med hovedstaden Meroë i dagens Sudan, omtrent 1 650 km fra Jerusalem i luftlinje, ikke Etiopia i Aksums høyland; Kandake er ikke et navn, men kandake, tittelen på rikets dronningmødre, som Plinius bemerker. Ordet «øde» kan beskrive veien gjennom de judeiske åsene eller selve Gasa, hvis gamle by ifølge Strabon lå øde etter at Aleksander jevnet den med jorden, mens den nye byen sto nærmere havet. Kartets år er omkring 34 e.Kr., med kirkens spredning etter Stefanus' død. Stedskortet lister kildene som er kandidater."
  tl:
    - "Sa isang lugar sa daan mula sa Jerusalem pababa sa Gaza, ang huling bayan bago ang disyerto sa daan patungong Egipto, mga 79 km sa timog-kanluran ng Jerusalem sa tuwid na guhit; walang pinangalanang lugar ang Mga Gawa. Dalawang tradisyon ang umaangkin sa tubig. Inilalagay ito nina Eusebio at Jeronimo sa isang bukal sa ibaba ng Beth-zur, mga 25 km sa timog ng Jerusalem sa daan patungong Hebron, ngayon ay Ain ed-Dirweh; sinusunod ng huling tradisyon ang Ein Hanniya sa libis ng Rephaim sa timog-kanlurang gilid ng lungsod, kung saan nakatayo ang mga labi ng simbahang Bizantino sa tabi ng bukal. Pagkatapos ay “nasumpungan si Felipe sa Azoto”, ang Asdod, 34 km pataas sa baybayin mula sa Gaza, at nangaral pahilaga ng 86 km hanggang sa Cesarea, kung saan siya tumira."
    - "Ayon sa Mga Gawa, sinabi ng anghel kay Felipe, “Magtindig ka, at ikaw ay pumaroon sa dakong timugan, sa daang palusong mula sa Jerusalem hanggang sa Gaza: na ito'y ilang”; doon nakilala “ang isang lalaking taga Etiopia, isang bating na may dakilang kapamahalaan na sakop ni Candace, reina ng mga Etiope, na siyang namamahala ng lahat niyang kayamanan, at siya'y naparoon sa Jerusalem upang sumamba”, na nagbabasa ng Isaias sa karo. “At sa pagpapatuloy sa daan, ay nagsidating sila sa dakong may tubig; at sinabi ng bating, Narito, ang tubig; ano ang nakahahadlang upang ako'y mabautismuhan?” “At ipinagutos niyang itigil ang karo: at sila'y kapuwa lumusong sa tubig, si Felipe at ang bating; at kaniyang binautismuhan siya.” Pagkatapos “inagaw si Felipe ng Espiritu ng Panginoon; at hindi na siya nakita ng bating, sapagka't ipinagpatuloy niya ang kaniyang lakad na natutuwa”."
    - "Ang Etiopia dito ay ang Kush, ang kahariang nasa Nilo sa kabila ng Egipto na may kabisera sa Meroë sa Sudan ngayon, mga 1,650 km mula sa Jerusalem sa tuwid na guhit, hindi ang Etiopia ng mga kabundukan ng Aksum; ang Candace ay hindi pangalan kundi kandake, titulo ng mga inang reyna nito, gaya ng itinala ni Plinio. Ang mga salitang “na ito'y ilang” ay maaaring naglalarawan sa daan sa mga burol ng Judea o sa Gaza mismo, na ang lumang lungsod ay sinasabi ni Estrabon na nakahandusay na walang tao pagkatapos itong gibain ni Alejandro, at ang bagong bayan ay mas malapit sa dagat. Ang taon ng mapa ay mga 34 AD, sa pagkalat ng iglesia pagkamatay ni Esteban. Inililista ng kard ng lugar ang mga kandidatong bukal."
  da:
    - "Et sted på vejen fra Jerusalem ned til Gaza, den sidste by før ørkenen på vejen til Egypten, omkring 79 km sydvest for Jerusalem i luftlinje; Apostlenes Gerninger nævner intet sted. To traditioner gør krav på vandet. Eusebius og Hieronymus placerer det ved en kilde under Bet-Sur, omkring 25 km syd for Jerusalem på vejen til Hebron, nu Ajin ed-Dirweh; en senere tradition holder sig til Ajin Hanniya i Refa'im-dalen på byens sydvestlige kant, hvor resterne af en byzantinsk kirke står ved kilden. Bagefter blev Filip »funden i Asdod«, 34 km oppe ad kysten fra Gaza, og prædikede nordpå 86 km til Cæsarea, hvor han slog sig ned."
    - "Apostlenes Gerninger fortæller det: Engelen sagde til Filip: »Staa op og gaa mod Syd paa den Vej, som gaar ned fra Jerusalem til Gaza; den er øde.« Dér mødte han »en Æthioper, en Hofmand, en mægtig Mand hos Kandake, Æthiopernes Dronning, som var sat over alle hendes Skatte; han var kommen til Jerusalem for at tilbede«, læsende Esajas i sin vogn. »Men som de droge frem ad Vejen, kom de til noget Vand; og Hofmanden siger: ›Se, her er Vand, hvad hindrer mig fra at blive døbt?‹« »Og han bød, at Vognen skulde holde, og de stege begge ned i Vandet, baade Filip og Hofmanden; og han døbte ham.« Da »bortrykkede Herrens Aand Filip, og Hofmanden saa ham ikke mere; thi han drog sin Vej med Glæde«."
    - "Etiopien er her Kush, kongeriget ved Nilen hinsides Egypten med hovedstad i Meroë i nutidens Sudan, omkring 1.650 km fra Jerusalem i luftlinje, ikke Aksum-højlandets Etiopien; Kandake er ikke et navn, men kandake, titlen på dets dronningemødre, som Plinius bemærker. Ordene »den er øde« kan beskrive vejen gennem de judæiske bjerge eller Gaza selv, hvis gamle by ifølge Strabon lå øde, efter at Alexander havde jævnet den, mens den nye by lå nærmere havet. Kortets år er omkring 34 e.Kr., med kirkens spredning efter Stefanus' død. Stedets kort opregner de mulige kilder."
