id: where-did-philip-meet-the-ethiopian
question:
  en: "Where did Philip baptize the Ethiopian eunuch?"
  ru: "Где Филипп крестил эфиопского евнуха?"
  uk: "Де Филип охрестив ефіопського євнуха?"
  es: "¿Dónde bautizó Felipe al eunuco etíope?"
  pt: "Onde Filipe batizou o eunuco etíope?"
  de: "Wo taufte Philippus den äthiopischen Kämmerer?"
  fr: "Où Philippe a-t-il baptisé l’eunuque éthiopien ?"
answer:
  en:
    - "Somewhere on the road from Jerusalem down to Gaza, the last town before the desert on the way to Egypt, about 79 km south-west of Jerusalem in a straight line; Acts names no place. Two traditions claim the water. Eusebius and Jerome put it at a spring below Beth-zur, about 25 km south of Jerusalem on the road to Hebron, today Ain ed-Dirweh; a later tradition holds to Ein Hanniya in the Rephaim valley on the south-western edge of the city, where the remains of a Byzantine church stand by the spring. Afterwards Philip “was found at Azotus”, Ashdod, 34 km up the coast from Gaza, and preached northward 86 km to Caesarea, where he settled."
    - "Acts tells it: the angel said to Philip, “Arise, and go toward the south unto the way that goeth down from Jerusalem unto Gaza, which is desert”; there he met “a man of Ethiopia, an eunuch of great authority under Candace queen of the Ethiopians, who had the charge of all her treasure, and had come to Jerusalem for to worship”, reading Isaiah in his chariot. “And as they went on their way, they came unto a certain water: and the eunuch said, See, here is water; what doth hinder me to be baptized?” “And he commanded the chariot to stand still: and they went down both into the water, both Philip and the eunuch; and he baptized him.” Then “the Spirit of the Lord caught away Philip, that the eunuch saw him no more: and he went on his way rejoicing”."
    - "Ethiopia here is Kush, the kingdom on the Nile beyond Egypt with its capital at Meroë in today's Sudan, some 1,650 km from Jerusalem in a straight line, not the Ethiopia of the Aksumite highlands; Candace is not a name but kandake, the title of its queen mothers, as Pliny notes. The words “which is desert” may describe the road through the Judaean hills or Gaza itself, whose old city Strabo says lay deserted after Alexander razed it, the new town standing nearer the sea. The map's year is about AD 34, with the scattering of the church after Stephen's death. The place card lists the candidate springs."
  ru:
    - "Где-то на дороге из Иерусалима в Газу, последний город перед пустыней на пути в Египет, примерно в 79 км к юго-западу от Иерусалима по прямой; Деяния места не называют. На эту воду притязают два предания. Евсевий и Иероним помещали её у источника под Беф-Цуром, примерно в 25 км к югу от Иерусалима на дороге в Хеврон, — ныне Айн-эд-Дирве; более позднее предание держится за Эйн-Ханию в долине Рефаим, на юго-западной окраине города, где у источника стоят остатки византийской церкви. Потом Филипп «оказался в Азоте» — Ашдоде, в 34 км вверх по берегу от Газы, — и проповедовал на север 86 км до Кесарии, где и поселился."
    - "Деяния рассказывают: ангел сказал Филиппу: «встань и иди на полдень, на дорогу, идущую из Иерусалима в Газу, на ту, которая пуста»; там ему встретился «муж Ефиоплянин, евнух, вельможа Кандакии, царицы Ефиопской, хранитель всех сокровищ ее, приезжавший в Иерусалим для поклонения», который читал в колеснице Исаию. «Между тем, продолжая путь, они приехали к воде; и евнух сказал: вот вода; что препятствует мне креститься?» «И приказал остановить колесницу, и сошли оба в воду, Филипп и евнух; и крестил его». Затем «Филиппа восхитил Ангел Господень, и евнух уже не видел его и продолжал путь, радуясь»."
    - "Эфиопия здесь — Куш, царство на Ниле за Египтом со столицей в Мероэ в нынешнем Судане, примерно в 1650 км от Иерусалима по прямой, а не Эфиопия Аксумского нагорья; Кандакия — не имя, а «кандаке», титул тамошних цариц-матерей, как отмечает Плиний. Слова «на ту, которая пуста» могут относиться к дороге через Иудейские горы или к самой Газе, старый город которой, по Страбону, лежал в запустении после того, как Александр его разрушил, а новый стоял ближе к морю. Год на карте — около 34 г. н. э., когда церковь рассеялась после смерти Стефана. Карточка места перечисляет источники-кандидаты."
  uk:
    - "Десь на дорозі, що спускається з Єрусалиму до Гази, останнього міста перед пустелею на шляху до Єгипту, приблизно за 79 км на південний захід від Єрусалиму по прямій; Дії не називають місця. Дві традиції претендують на воду. Євсевій та Єронім ставлять це біля джерела під Бет-Цуром, приблизно за 25 км на південь від Єрусалиму на дорозі до Хеврона, нині Айн-ед-Дірве; пізніша традиція тримається Ейн-Ханії в долині Рефаїм на південно-західному краю міста, де біля джерела стоять рештки візантійської церкви. Згодом Филип «опинивсь ув Азотї», Ашдоді, за 34 км угору узбережжям від Гази, і проповідував на північ за 86 км до Кесарії, де й оселився."
    - "Дії розповідають: ангел сказав Филипові: «Устань, та йди на полуднє дорогою, що йде з Єрусалиму в Газу; вона пуста»; там, як сказано, був «чоловік із Єтіопиї, євнух, вельможа Кандакиї, царицї Єтіопської, що був над усїм скарбом її; він приходив поклонитись у Єрусалим», і він читав Ісаю на колісниці. «Верстаючи ж дорогу, прибули до води; й каже євнух: Ось вода; що боронить менї охреститись?» «І звелїв зʼупинити воза; й увійшли обидва в воду, Филип і євнух; і охрестив його». Тоді «Дух Господень ухопив Филипа, і не бачив його більш євнух; і пійшов дорогою своєю, радуючись»."
    - "Ефіопія тут — це Куш, царство на Нілі за Єгиптом зі столицею в Мероє в нинішньому Судані, приблизно за 1650 км від Єрусалиму по прямій, а не Ефіопія Аксумського нагір'я; Кандака — не ім'я, а кандаке, титул цариць-матерів, як зазначає Пліній. Слова «вона пуста» можуть описувати дорогу через юдейські пагорби або саму Газу, чиє старе місто, за Страбоном, лежало спустошеним після того, як його зруйнував Александр, а нове місто стояло ближче до моря. Рік мапи — близько 34 р. н. е., з розсіянням церкви після смерті Стефана. Картка місця перелічує джерела-кандидати."
  es:
    - "En algún punto del camino que baja de Jerusalén a Gaza, la última población antes del desierto en el camino a Egipto, a unos 79 km al suroeste de Jerusalén en línea recta; Hechos no nombra ningún lugar. Dos tradiciones reclaman el agua. Eusebio y Jerónimo la ponen en una fuente bajo Bet-sur, a unos 25 km al sur de Jerusalén en el camino de Hebrón, hoy Ain ed-Dirweh; una tradición posterior sostiene Ein Hanniya, en el valle de Refaím, en el borde suroeste de la ciudad, donde junto a la fuente quedan los restos de una iglesia bizantina. Después Felipe «se halló en Azoto», Asdod, a 34 km costa arriba desde Gaza, y predicó hacia el norte 86 km hasta Cesarea, donde se estableció."
    - "Hechos lo cuenta: el ángel dijo a Felipe: «Levántate y ve hacia el mediodía, al camino que desciende de Jerusalem á Gaza, el cual es desierto»; allí encontró a «un Etiope, eunuco, gobernador de Candace, reina de los Etiopes, el cual era puesto sobre todos sus tesoros, y había venido á adorar á Jerusalem», que leía a Isaías en su carro. «Y yendo por el camino, llegaron á cierta agua; y dijo el eunuco: He aquí agua; ¿qué impide que yo sea bautizado?». «Y mandó parar el carro: y descendieron ambos al agua, Felipe y el eunuco; y bautizóle». Entonces «el Espíritu del Señor arrebató á Felipe; y no le vió más el eunuco, y se fué por su camino gozoso»."
    - "Etiopía es aquí Kush, el reino del Nilo más allá de Egipto, con su capital en Meroe, en el actual Sudán, a unos 1650 km de Jerusalén en línea recta, no la Etiopía de las tierras altas de Aksum; Candace no es un nombre sino kandake, el título de sus reinas madres, como señala Plinio. Las palabras «el cual es desierto» pueden describir el camino por las colinas de Judea o la propia Gaza, cuya vieja ciudad, dice Estrabón, quedó desierta después de que Alejandro la arrasara, alzándose la ciudad nueva más cerca del mar. El año del mapa es hacia el 34 d. C., con la dispersión de la Iglesia tras la muerte de Esteban. La ficha del lugar enumera las fuentes candidatas."
  pt:
    - "Em algum ponto da estrada que desce de Jerusalém a Gaza, a última cidade antes do deserto no caminho do Egito, a cerca de 79 km a sudoeste de Jerusalém em linha reta; Atos não nomeia lugar. Duas tradições reivindicam a água. Eusébio e Jerônimo a põem numa fonte abaixo de Bete-Zur, a cerca de 25 km ao sul de Jerusalém na estrada de Hebrom, hoje Ain ed-Dirweh; uma tradição posterior sustenta Ein Hanniya, no vale de Refaim, na borda sudoeste da cidade, onde restos de uma igreja bizantina estão junto à fonte. Depois Filipe “foi achado em Azoto”, Asdode, 34 km costa acima de Gaza, e pregou rumo ao norte 86 km até Cesareia, onde se fixou."
    - "Atos conta: o anjo disse a Filipe: “Levante-se e vá para o sul, para o caminho que desce de Jerusalém a Gaza. Este é um deserto”; ali ele encontrou “um homem da Etiópia, um eunuco de grande autoridade sob Candace, rainha dos etíopes, responsável por todos os tesouros da rainha, que tinha vindo a Jerusalém para adorar”, lendo Isaías em sua carruagem. “Enquanto seguiam pelo caminho, chegaram a um lugar com água; e o eunuco disse: ‘Eis aqui água. O que me impede de ser batizado?’” “Ele mandou parar a carruagem, e ambos desceram à água, tanto Filipe como o eunuco, e ele o batizou.” Então “o Espírito do Senhor arrebatou Filipe, e o eunuco não o viu mais, e seguiu o seu caminho cheio de alegria”."
    - "A Etiópia aqui é Cuxe, o reino do Nilo além do Egito, com capital em Meroé, no Sudão de hoje, a cerca de 1.650 km de Jerusalém em linha reta, não a Etiópia das terras altas de Aksum; Candace não é nome, mas kandake, título de suas rainhas-mães, como nota Plínio. As palavras “Este é um deserto” podem descrever a estrada pelos montes da Judeia ou a própria Gaza, cuja cidade velha, diz Estrabão, jazia deserta depois que Alexandre a arrasou, estando a nova mais perto do mar. O ano do mapa é cerca de 34 d.C., com a dispersão da igreja depois da morte de Estêvão. A ficha do lugar lista as fontes candidatas."
  de:
    - "Irgendwo auf der Straße von Jerusalem hinab nach Gaza, der letzten Stadt vor der Wüste auf dem Weg nach Ägypten, in der Luftlinie etwa 79 km südwestlich von Jerusalem; die Apostelgeschichte nennt keinen Ort. Zwei Überlieferungen beanspruchen das Wasser. Eusebius und Hieronymus setzen es an eine Quelle unterhalb von Bet-Zur, etwa 25 km südlich von Jerusalem an der Straße nach Hebron, heute Ain ed-Dirweh; eine spätere Überlieferung hält an Ein Hanija im Refaïmtal am südwestlichen Stadtrand fest, wo bei der Quelle die Reste einer byzantinischen Kirche stehen. Danach ward Philippus „gefunden zu Asdod“, Aschdod, 34 km die Küste hinauf von Gaza, und predigte 86 km nordwärts bis Caesarea, wo er sich niederließ."
    - "Die Apostelgeschichte erzählt: Der Engel sagte zu Philippus: „Stehe auf und gehe gegen Mittag auf die Straße, die von Jerusalem geht hinab gen Gaza, die da wüst ist“; dort traf er einen Mann aus Äthiopien, „ein Kämmerer und Gewaltiger der Königin Kandaze ..., welcher war über ihre ganze Schatzkammer, der war gekommen gen Jerusalem, anzubeten“, der in seinem Wagen Jesaja las. „Und als sie zogen der Straße nach, kamen sie an ein Wasser. Und der Kämmerer sprach: Siehe, da ist Wasser; was hindert's, daß ich mich taufen lasse?“ „Und er hieß den Wagen halten, und stiegen hinab in das Wasser beide, Philippus und der Kämmerer, und er taufte ihn.“ Dann „rückte der Geist des HERRN Philippus hinweg, und der Kämmerer sah ihn nicht mehr; er zog aber seine Straße fröhlich“."
    - "Äthiopien ist hier Kusch, das Königreich am Nil jenseits Ägyptens mit der Hauptstadt Meroë im heutigen Sudan, in der Luftlinie rund 1650 km von Jerusalem, nicht das Äthiopien des Hochlands von Aksum; Kandake ist kein Name, sondern der Titel der Königinmütter, wie Plinius bemerkt. Die Worte „die da wüst ist“ können die Straße durch die judäischen Berge oder Gaza selbst beschreiben, dessen alte Stadt nach Strabon nach Alexanders Zerstörung verödet lag, während die neue näher am Meer stand. Das Kartenjahr ist etwa 34 n. Chr., mit der Zerstreuung der Gemeinde nach dem Tod des Stephanus. Die Ortskarte führt die infrage kommenden Quellen auf."
  fr:
    - "Quelque part sur la route qui descend de Jérusalem à Gaza, dernière ville avant le désert sur le chemin de l’Égypte, à environ 79 km au sud-ouest de Jérusalem en ligne droite ; les Actes ne nomment aucun lieu. Deux traditions revendiquent l’eau. Eusèbe et Jérôme la placent à une source sous Beth-Tsur, à environ 25 km au sud de Jérusalem sur la route d’Hébron, aujourd’hui Aïn ed-Dirweh ; une tradition postérieure tient pour Aïn Hanniya, dans la vallée des Rephaïm, à la lisière sud-ouest de la ville, où les vestiges d’une église byzantine se dressent près de la source. Ensuite Philippe « se trouva dans Azot », Asdod, à 34 km au nord de Gaza sur la côte, et prêcha vers le nord sur 86 km jusqu’à Césarée, où il s’établit."
    - "Les Actes racontent : l’ange dit à Philippe : « Lève-toi, et va du côté du midi, sur le chemin qui descend de Jérusalem à Gaza, celui qui est désert » ; il y rencontra « un Éthiopien, un eunuque, ministre de Candace, reine d’Éthiopie, et surintendant de tous ses trésors, venu à Jérusalem pour adorer », qui lisait Ésaïe dans son char. « Comme ils continuaient leur chemin, ils rencontrèrent de l’eau. Et l’eunuque dit : Voici de l’eau ; qu’est-ce qui empêche que je sois baptisé ? » « Il fit arrêter le char ; Philippe et l’eunuque descendirent tous deux dans l’eau, et Philippe baptisa l’eunuque. » Puis « l’Esprit du Seigneur enleva Philippe, et l’eunuque ne le vit plus. Tandis que, joyeux, il poursuivait sa route »."
    - "L’Éthiopie est ici Koush, le royaume du Nil au-delà de l’Égypte, dont la capitale était Méroé, dans le Soudan actuel, à quelque 1 650 km de Jérusalem en ligne droite, et non l’Éthiopie des hautes terres d’Aksoum ; Candace n’est pas un nom mais kandake, titre des reines mères, comme le note Pline. Les mots « celui qui est désert » peuvent décrire la route à travers les collines de Judée ou Gaza elle-même, dont l’ancienne ville, dit Strabon, resta déserte après qu’Alexandre l’eut rasée, la ville nouvelle se tenant plus près de la mer. L’année de la carte est vers 34 apr. J.-C., avec la dispersion de l’Église après la mort d’Étienne. La fiche du lieu énumère les sources candidates."
