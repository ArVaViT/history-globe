id: how-far-jerusalem-to-jericho
question:
  en: "How far is it from Jerusalem to Jericho?"
  ru: "Как далеко от Иерусалима до Иерихона?"
  uk: "Як далеко від Єрусалиму до Єрихону?"
  es: "¿Qué distancia hay de Jerusalén a Jericó?"
  pt: "Qual é a distância de Jerusalém a Jericó?"
  de: "Wie weit ist es von Jerusalem nach Jericho?"
  fr: "Quelle distance y a-t-il de Jérusalem à Jéricho ?"
answer:
  en:
    - "Jericho is about 20 km east of Jerusalem in a straight line; by the Roman road on the map, which runs through Bethany, the way measures about 26 km, less than a day on foot."
    - 'The road is the setting of the parable: "A certain man went down from Jerusalem to Jericho, and fell among thieves." It really does go down: Jerusalem stands on the watershed in the hills of Judah, and Jericho lies in the Jordan Valley about 250 m below sea level, in the deep rift north of the Dead Sea, so the whole descent is steep and passes through the wilderness of Judea.'
    - "The Jericho of the Gospels, where Jesus healed blind Bartimaeus and stayed with Zacchaeus, was the town that grew around the Hasmonean and Herodian winter palaces at the mouth of Wadi Qelt, now Tulul Abu el-Alayiq; Herod the Great died there about 4 BC. The older mound of Tell es-Sultan, the Jericho of Joshua, lies about 2 km to the north beside the spring of Elisha. In 333 the Pilgrim of Bordeaux was shown the spring and the house of Rahab at Jericho."
  ru:
    - "Иерихон лежит примерно в 20 км к востоку от Иерусалима по прямой; по римской дороге на карте, идущей через Вифанию, путь составляет около 26 км — меньше дня пешком."
    - "Эта дорога — место действия притчи: «некоторый человек шел из Иерусалима в Иерихон и попался разбойникам». Дорога и в самом деле идёт вниз: Иерусалим стоит на водоразделе в горах Иудеи, а Иерихон лежит в долине Иордана примерно на 250 м ниже уровня моря, в глубокой впадине к северу от Мёртвого моря, так что весь спуск крут и проходит через Иудейскую пустыню."
    - "Иерихон Евангелий, где Иисус исцелил слепого Вартимея и гостил у Закхея, — это город, выросший вокруг зимних дворцов Хасмонеев и Ирода у выхода Вади-Кельт, ныне Тулуль-Абу-эль-Алайик; там около 4 г. до н. э. умер Ирод Великий. Более древний холм Телль-эс-Султан, Иерихон Иисуса Навина, лежит примерно в 2 км севернее, у источника Елисея. В 333 году Бордоскому паломнику показывали в Иерихоне источник и дом Раав."
  uk:
    - "Єрихон лежить приблизно за 20 км на схід від Єрусалиму по прямій; римською дорогою на мапі, що проходить через Віфанію, шлях становить близько 26 км, менше ніж день пішки."
    - "Ця дорога — місце дії притчі: «Чоловік один ійшов з Єрусалиму в Єрихон, і попав ся розбійникам». Вона справді йде вниз: Єрусалим стоїть на вододілі в юдейських пагорбах, а Єрихон лежить у Йорданській долині приблизно на 250 м нижче рівня моря, у глибокому розломі на північ від Мертвого моря, тож увесь спуск крутий і проходить через Юдейську пустелю."
    - "Єрихон Євангелій, де Ісус зцілив сліпого Вартимея й гостював у Закхея, був містом, що виросло навколо хасмонейських та іродіянських зимових палаців при виході з Ваді-Кельт, нині Тулюль-Абу-ель-Алаїк; Ірод Великий помер там близько 4 р. до н. е. Давніший пагорб Тель-ес-Султан, Єрихон Ісуса Навина, лежить приблизно за 2 км на північ біля Єлисеєвого джерела. 333 р. Бордоському прочанинові показали в Єрихоні джерело та дім Рахави."
  es:
    - "Jericó está a unos 20 km al este de Jerusalén en línea recta; por la calzada romana del mapa, que pasa por Betania, el camino mide unos 26 km, menos de un día a pie."
    - "El camino es el escenario de la parábola: «Un hombre descendía de Jerusalem á Jericó, y cayó en manos de ladrones». En verdad es una bajada: Jerusalén se alza en la divisoria de aguas de las colinas de Judá, y Jericó yace en el valle del Jordán, a unos 250 m bajo el nivel del mar, en la profunda falla al norte del mar Muerto, de modo que todo el descenso es empinado y atraviesa el desierto de Judea."
    - "La Jericó de los Evangelios, donde Jesús sanó al ciego Bartimeo y se hospedó con Zaqueo, era la ciudad que creció en torno a los palacios de invierno asmoneos y herodianos en la desembocadura del uadi Qelt, hoy Tulul Abu el-Alayiq; Herodes el Grande murió allí hacia el 4 a. C. El tell más antiguo de Tell es-Sultán, la Jericó de Josué, queda a unos 2 km al norte, junto a la fuente de Eliseo. En 333, al peregrino de Burdeos le mostraron en Jericó la fuente y la casa de Rahab."
  pt:
    - "Jericó fica a cerca de 20 km a leste de Jerusalém em linha reta; pela estrada romana do mapa, que passa por Betânia, o caminho mede cerca de 26 km, menos de um dia a pé."
    - "A estrada é o cenário da parábola: “Um certo homem descia de Jerusalém para Jericó e caiu nas mãos de salteadores”. Ela de fato desce: Jerusalém está na linha divisória das águas, nos montes de Judá, e Jericó fica no vale do Jordão, a cerca de 250 m abaixo do nível do mar, na profunda fenda ao norte do mar Morto, de modo que toda a descida é íngreme e passa pelo deserto da Judeia."
    - "A Jericó dos Evangelhos, onde Jesus curou o cego Bartimeu e se hospedou com Zaqueu, era a cidade que cresceu em torno dos palácios de inverno hasmoneus e herodianos na saída do uádi Qelt, hoje Tulul Abu el-Alayiq; Herodes, o Grande, morreu ali por volta de 4 a.C. O montículo mais antigo de Tell es-Sultan, a Jericó de Josué, fica a cerca de 2 km ao norte, junto à fonte de Eliseu. Em 333 mostraram ao peregrino de Bordeaux a fonte e a casa de Raabe em Jericó."
  de:
    - "Jericho liegt etwa 20 km östlich von Jerusalem in der Luftlinie; auf der römischen Straße der Karte, die über Bethanien führt, misst der Weg etwa 26 km, weniger als einen Tag zu Fuß."
    - "Diese Straße ist der Schauplatz des Gleichnisses: „Es war ein Mensch, der ging von Jerusalem hinab gen Jericho und fiel unter die Mörder.“ Sie führt wirklich hinab: Jerusalem liegt auf der Wasserscheide im Bergland Judas, Jericho im Jordantal etwa 250 m unter dem Meeresspiegel, im tiefen Graben nördlich des Toten Meeres, sodass der ganze Abstieg steil ist und durch die Wüste Judäas führt."
    - "Das Jericho der Evangelien, wo Jesus den blinden Bartimäus heilte und bei Zachäus einkehrte, war die Stadt, die um die hasmonäischen und herodianischen Winterpaläste an der Mündung des Wadi Kelt gewachsen war, heute Tulul Abu el-Alajik; Herodes der Große starb dort um 4 v. Chr. Der ältere Hügel Tell es-Sultan, das Jericho Josuas, liegt etwa 2 km nördlich neben der Elisa-Quelle. Im Jahr 333 wurden dem Pilger von Bordeaux die Quelle und das Haus Rahabs in Jericho gezeigt."
  fr:
    - "Jéricho est à environ 20 km à l’est de Jérusalem en ligne droite ; par la route romaine de la carte, qui passe par Béthanie, le trajet mesure environ 26 km, moins d’une journée de marche."
    - "Cette route est le cadre de la parabole : « Un homme descendait de Jérusalem à Jéricho. Il tomba au milieu des brigands. » Elle descend réellement : Jérusalem s’élève sur la ligne de partage des eaux, dans les collines de Juda, et Jéricho se trouve dans la vallée du Jourdain, à environ 250 m sous le niveau de la mer, dans la profonde fosse au nord de la mer Morte ; toute la descente est donc raide et traverse le désert de Judée."
    - "Le Jéricho des Évangiles, où Jésus guérit l’aveugle Bartimée et fut l’hôte de Zachée, était la ville née autour des palais d’hiver hasmonéens et hérodiens, à l’embouchure de l’oued Qelt, aujourd’hui Tulul Abu el-Alayiq ; Hérode le Grand y mourut vers 4 av. J.-C. Le tertre plus ancien de Tell es-Sultan, le Jéricho de Josué, se trouve à environ 2 km au nord, près de la source d’Élisée. En 333, le pèlerin de Bordeaux se vit montrer à Jéricho la source et la maison de Rahab."
