id: where-was-laodicea
question:
  en: "Where was Laodicea, the lukewarm church of Revelation?"
  ru: "Где находилась Лаодикия, «тёплая» церковь Откровения?"
  uk: "Де була Лаодікея, теплохолодна церква з Одкровення?"
  es: "¿Dónde estaba Laodicea, la iglesia tibia del Apocalipsis?"
  pt: "Onde ficava Laodiceia, a igreja morna do Apocalipse?"
  de: "Wo lag Laodizea, die lauwarme Gemeinde der Offenbarung?"
  fr: "Où se trouvait Laodicée, l’Église tiède de l’Apocalypse ?"
answer:
  en:
    - "Laodicea on the Lycus lay in the valley of the Lycus in Phrygia, in south-western Asia Minor, on the edge of today's Denizli in Turkey; the map point stands on its ruins. Hierapolis, with its hot springs and white terraces at Pamukkale, was about 10 km to the north in a straight line, Colossae 14 km to the east, and Ephesus about 155 km to the west, on the main road from the coast into the interior. It is not Laodicea in Syria, today's Latakia."
    - "Paul knew the church by letter: Epaphras laboured for “them that are in Laodicea, and them in Hierapolis”, and Paul wrote, “Salute the brethren which are in Laodicea, and Nymphas, and the church which is in his house”, asking the Colossians to read “the epistle from Laodicea”, usually thought lost, though some take it for Ephesians. Revelation, about AD 95, sends Laodicea the last of the seven letters: “thou art lukewarm, and neither cold nor hot”, proud to say “I am rich, and increased with goods, and have need of nothing”. Many read the image against the waters of the valley, hot at Hierapolis and cold at Colossae, while Laodicea drew tepid, limy water by aqueduct; others take it as a plain figure. The letter ends: “Behold, I stand at the door, and knock”."
    - "Antiochus II refounded the city in the mid-third century BC and named it after his wife Laodice; Strabo praises its wealth and the soft black wool of its sheep. After the earthquake of AD 60, Tacitus says, it rebuilt itself without help from Rome. Excavations by Pamukkale University have uncovered colonnaded streets, two theatres, a stadium, water towers whose clay pipes are choked with lime, and a large church of the fourth century."
  ru:
    - "Лаодикия на Лике лежала в долине Лика во Фригии, на юго-западе Малой Азии, на окраине нынешнего турецкого Денизли; точка карты стоит на её развалинах. Иераполь с горячими источниками и белыми террасами Памуккале был примерно в 10 км к северу по прямой, Колоссы — в 14 км к востоку, а Ефес — примерно в 155 км к западу, на главной дороге с побережья вглубь страны. Это не сирийская Лаодикия, нынешняя Латакия."
    - "Павел знал эту церковь по переписке: Епафрас заботился «о находящихся в Лаодикии и Иераполе», а Павел писал: «Приветствуйте братьев в Лаодикии, и Нимфана, и домашнюю церковь его», — и просил колоссян прочитать послание, «которое из Лаодикии»; его обычно считают утраченным, хотя некоторые видят в нём Послание к Ефесянам. Откровение около 95 г. посылает Лаодикии последнее из семи посланий: «ты тепл, а не горяч и не холоден»; она гордо говорит: «Я богат, разбогател и ни в чем не имею нужды». Многие толкуют этот образ по водам долины — горячим в Иераполе и холодным в Колоссах, тогда как в Лаодикию по водопроводу шла тёплая известковая вода; другие видят здесь простое иносказание. Послание кончается словами: «Се, стою у двери и стучу»."
    - "Антиох II основал город заново в середине III века до н. э. и назвал его в честь жены Лаодики; Страбон хвалит его богатство и мягкую чёрную шерсть здешних овец. После землетрясения 60 г. н. э., пишет Тацит, город отстроился без помощи Рима. Раскопки Университета Памуккале открыли улицы с колоннадами, два театра, стадион, водонапорные башни с забитыми известью глиняными трубами и большую церковь IV века."
  uk:
    - "Лаодікея на Лікосі лежала в долині Лікоса у Фрігії, на південному заході Малої Азії, на краю нинішнього Денізлі в Туреччині; точка на мапі стоїть на її руїнах. Ієраполіс, із гарячими джерелами й білими терасами в Памуккале, лежав приблизно за 10 км на північ по прямій, Колоси — за 14 км на схід, а Ефес — приблизно за 155 км на захід, на головній дорозі від узбережжя вглиб країни. Це не Лаодікея в Сирії, нинішня Латакія."
    - "Павло знав цю церкву з листування: Епафрас турбувався «про Лаодичан і Єрополян», а Павло писав: «Витайте братів, що в Лаодикиї, і Нимфана, і домашню церкву його», просячи колосян прочитати «написане з Лаодикиї», яке зазвичай вважають втраченим, хоч дехто ототожнює його з Посланням до ефесян. Одкровення, близько 95 р. н. е., надсилає Лаодікеї останній із семи листів: «яко ж лїтний єси, і нї зимний нї гарячий», який з гордістю каже: «Я багатий, і збагатїв, і нїчого не потрібую». Багато хто читає цей образ на тлі вод долини, гарячих в Ієраполісі та холодних у Колосах, тоді як Лаодікея брала теплувату, вапняну воду акведуком; інші вважають його простою мовною фігурою. Лист закінчується: «Ось, стою під дверми і стукаю»."
    - "Антіох II заснував місто наново в середині III ст. до н. е. й назвав його на честь своєї дружини Лаодіки; Страбон хвалить його багатство й м'яку чорну вовну його овець. Після землетрусу 60 р. н. е., каже Тацит, воно відбудувалося без допомоги Риму. Розкопки Університету Памуккале відкрили вулиці з колонадами, два театри, стадіон, водонапірні вежі, глиняні труби яких забиті вапном, і велику церкву IV ст."
  es:
    - "Laodicea del Lico se alzaba en el valle del Lico, en Frigia, en el suroeste de Asia Menor, en el borde de la actual Denizli, en Turquía; el punto del mapa está sobre sus ruinas. Hierápolis, con sus aguas termales y sus terrazas blancas de Pamukkale, estaba a unos 10 km al norte en línea recta, Colosas a 14 km al este y Éfeso a unos 155 km al oeste, en el camino principal de la costa al interior. No es la Laodicea de Siria, la actual Latakia."
    - "Pablo conocía la iglesia por carta: Epafras se afanaba por «los que están en Laodicea, y los que en Hierápolis», y Pablo escribió: «Saludad á los hermanos que están en Laodicea, y á Nimfas, y á la iglesia que está en su casa», y pidió a los colosenses que leyeran «la de Laodicea», que se suele considerar perdida, aunque algunos la identifican con Efesios. El Apocalipsis, hacia el 95 d. C., envía a Laodicea la última de las siete cartas: «eres tibio, y no frío ni caliente», orgullosa de decir «Yo soy rico, y estoy enriquecido, y no tengo necesidad de ninguna cosa». Muchos leen la imagen en relación con las aguas del valle, calientes en Hierápolis y frías en Colosas, mientras que Laodicea recibía por acueducto agua tibia y calcárea; otros la toman como una figura sencilla. La carta termina: «He aquí, yo estoy á la puerta y llamo»."
    - "Antíoco II refundó la ciudad a mediados del siglo III a. C. y le dio el nombre de su esposa Laodice; Estrabón alaba su riqueza y la suave lana negra de sus ovejas. Tras el terremoto del 60 d. C., dice Tácito, se reconstruyó sin ayuda de Roma. Las excavaciones de la Universidad de Pamukkale han sacado a la luz calles con columnatas, dos teatros, un estadio, torres de agua cuyas tuberías de barro están obstruidas por la cal y una gran iglesia del siglo IV."
  pt:
    - "Laodiceia do Lico ficava no vale do Lico, na Frígia, no sudoeste da Ásia Menor, na orla da atual Denizli, na Turquia; o ponto do mapa fica sobre as suas ruínas. Hierápolis, com as suas fontes termais e os terraços brancos de Pamukkale, ficava a cerca de 10 km ao norte em linha reta, Colossos a 14 km a leste e Éfeso a cerca de 155 km a oeste, na estrada principal da costa para o interior. Não é a Laodiceia da Síria, a atual Lataquia."
    - "Paulo conhecia a igreja por carta: Epafras trabalhava “pelos que estão em Laodiceia, e pelos que estão em Hierápolis”, e Paulo escreveu: “Saúdem os irmãos que estão em Laodiceia, bem como Ninfa e a igreja que está em sua casa”, pedindo aos colossenses que lessem “a carta de Laodiceia”, geralmente tida por perdida, embora alguns a tomem por Efésios. O Apocalipse, por volta de 95 d.C., envia a Laodiceia a última das sete cartas: “você é morno, e não é quente nem frio”, orgulhosa de dizer “Sou rico, adquiri riquezas e não preciso de nada”. Muitos leem a imagem à luz das águas do vale, quentes em Hierápolis e frias em Colossos, enquanto Laodiceia recebia por aqueduto uma água morna e calcária; outros a tomam como simples figura. A carta termina: “Eis que estou à porta e bato”."
    - "Antíoco II refundou a cidade em meados do século III a.C. e deu-lhe o nome de sua esposa Laodice; Estrabão elogia a sua riqueza e a lã negra e macia de suas ovelhas. Depois do terremoto de 60 d.C., diz Tácito, ela se reconstruiu sem ajuda de Roma. As escavações da Universidade de Pamukkale trouxeram à luz ruas com colunatas, dois teatros, um estádio, torres de água cujos canos de barro estão obstruídos pelo calcário e uma grande igreja do século IV."
  de:
    - "Laodizea am Lykos lag im Tal des Lykos in Phrygien, im Südwesten Kleinasiens, am Rand des heutigen Denizli in der Türkei; der Kartenpunkt steht auf seinen Ruinen. Hierapolis, mit seinen heißen Quellen und weißen Terrassen bei Pamukkale, lag in der Luftlinie etwa 10 km nördlich, Kolossae 14 km östlich und Ephesus etwa 155 km westlich, an der Hauptstraße von der Küste ins Landesinnere. Es ist nicht das Laodizea in Syrien, das heutige Latakia."
    - "Paulus kannte die Gemeinde durch einen Brief: Epaphras hatte Fleiß „um die zu Laodizea und zu Hierapolis“, und Paulus schrieb: „Grüßet die Brüder zu Laodizea und den Nymphas und die Gemeinde in seinem Hause“; er bittet die Kolosser, „daß ihr den von Laodizea lest“, den Brief von Laodizea, der meist für verloren gilt, obwohl manche ihn für den Epheserbrief halten. Die Offenbarung schickt um 95 n. Chr. Laodizea das letzte der sieben Sendschreiben: Die Gemeinde sei „lau“ und „weder kalt noch warm“, sage aber stolz: „Ich bin reich und habe gar satt und bedarf nichts.“ Viele lesen das Bild vor dem Hintergrund der Wasser des Tals, heiß bei Hierapolis und kalt bei Kolossae, während Laodizea lauwarmes, kalkhaltiges Wasser durch einen Aquädukt bezog; andere verstehen es als schlichte Redefigur. Das Sendschreiben endet: „Siehe, ich stehe vor der Tür und klopfe an.“"
    - "Antiochos II. gründete die Stadt Mitte des 3. Jahrhunderts v. Chr. neu und benannte sie nach seiner Frau Laodike; Strabon rühmt ihren Reichtum und die weiche schwarze Wolle ihrer Schafe. Nach dem Erdbeben von 60 n. Chr. baute sie sich, so Tacitus, ohne Hilfe Roms wieder auf. Grabungen der Universität Pamukkale haben Säulenstraßen, zwei Theater, ein Stadion, Wassertürme, deren Tonrohre von Kalk verstopft sind, und eine große Kirche des 4. Jahrhunderts freigelegt."
  fr:
    - "Laodicée du Lycus se trouvait dans la vallée du Lycus, en Phrygie, dans le sud-ouest de l’Asie Mineure, à la lisière de l’actuelle Denizli, en Turquie ; le point de la carte se trouve sur ses ruines. Hiérapolis, avec ses sources chaudes et ses terrasses blanches de Pamukkale, était à environ 10 km au nord à vol d’oiseau, Colosses à 14 km à l’est, et Éphèse à environ 155 km à l’ouest, sur la grande route qui menait de la côte vers l’intérieur. Elle ne doit pas être confondue avec Laodicée de Syrie, l’actuelle Lattaquié."
    - "Paul la connaissait par lettre : Épaphras avait « une grande sollicitude » pour « ceux de Laodicée, et pour ceux d’Hiérapolis », et Paul écrivit : « Saluez les frères qui sont à Laodicée, et Nymphas, et l’Église qui est dans sa maison », demandant aux Colossiens de lire « celle qui vous arrivera de Laodicée », lettre généralement tenue pour perdue, bien que certains y voient Éphésiens. L’Apocalypse, vers 95 apr. J.-C., adresse à Laodicée la dernière des sept lettres : « parce que tu es tiède, et que tu n’es ni froid ni bouillant », fière de dire « Je suis riche, je me suis enrichi, et je n’ai besoin de rien ». Beaucoup lisent l’image d’après les eaux de la vallée, chaudes à Hiérapolis et froides à Colosses, tandis que Laodicée recevait par aqueduc une eau tiède et calcaire ; d’autres y voient une simple figure. La lettre s’achève ainsi : « Voici, je me tiens à la porte, et je frappe »."
    - "Antiochos II refonda la ville au milieu du IIIe siècle av. J.-C. et lui donna le nom de son épouse Laodice ; Strabon vante sa richesse et la laine noire et douce de ses moutons. Après le tremblement de terre de 60 apr. J.-C., dit Tacite, elle se reconstruisit sans aide de Rome. Les fouilles de l’université de Pamukkale ont mis au jour des rues à colonnades, deux théâtres, un stade, des châteaux d’eau dont les conduites d’argile sont obstruées par le calcaire, et une grande église du IVe siècle."
