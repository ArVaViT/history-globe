id: where-was-laodicea
question:
  en: "Where was Laodicea, the lukewarm church of Revelation?"
  ru: "Где находилась Лаодикия, «тёплая» церковь Откровения?"
  uk: "Де була Лаодікея, теплохолодна церква з Одкровення?"
  es: "¿Dónde estaba Laodicea, la iglesia tibia del Apocalipsis?"
  pt: "Onde ficava Laodiceia, a igreja morna do Apocalipse?"
  de: "Wo lag Laodizea, die lauwarme Gemeinde der Offenbarung?"
  fr: "Où se trouvait Laodicée, l’Église tiède de l’Apocalypse ?"
  pl: "Gdzie leżała Laodycea, letni zbór z Apokalipsy?"
  it: "Dov’era Laodicea, la chiesa tiepida dell’Apocalisse?"
  cs: "Kde ležela Laodikeia, vlažná církev ze Zjevení?"
  nl: "Waar lag Laodicea, de lauwe gemeente van de Openbaring?"
  sv: "Var låg Laodikeia, den ljumma församlingen i Uppenbarelseboken?"
  nb: "Hvor lå Laodikea, den lunkne menigheten i Åpenbaringen?"
  tl: "Nasaan ang Laodicea, ang malahiningang iglesia ng Apocalipsis?"
answer:
  en:
    - "Laodicea on the Lycus lay in the valley of the Lycus in Phrygia, in south-western Asia Minor, on the edge of today's Denizli in Turkey; the map point stands on its ruins. Hierapolis, with its hot springs and white terraces at Pamukkale, was about 10 km to the north in a straight line, Colossae 14 km to the east, and Ephesus about 155 km to the west, on the main road from the coast into the interior. It is not Laodicea in Syria, today's Latakia."
    - "Paul knew the church by letter: Epaphras laboured for “them that are in Laodicea, and them in Hierapolis”, and Paul wrote, “Salute the brethren which are in Laodicea, and Nymphas, and the church which is in his house”, asking the Colossians to read “the epistle from Laodicea”, usually thought lost, though some take it for Ephesians. Revelation, about AD 95, sends Laodicea the last of the seven letters: “thou art lukewarm, and neither cold nor hot”, proud to say “I am rich, and increased with goods, and have need of nothing”. Many read the image against the waters of the valley, hot at Hierapolis and cold at Colossae, while Laodicea drew tepid, limy water by aqueduct; others take it as a plain figure. The letter ends: “Behold, I stand at the door, and knock”."
    - "Antiochus II refounded the city in the mid-third century BC and named it after his wife Laodice; Strabo praises its wealth and the soft black wool of its sheep. After the earthquake of AD 60, Tacitus says, it rebuilt itself without help from Rome. Excavations by Pamukkale University have uncovered colonnaded streets, two theatres, a stadium, water towers whose clay pipes are choked with lime, and a large church of the fourth century."
  ru:
    - "Лаодикия на Лике лежала в долине Лика во Фригии, на юго-западе Малой Азии, на окраине нынешнего турецкого Денизли; точка карты стоит на её развалинах. Иераполь с горячими источниками и белыми террасами Памуккале был примерно в 10 км к северу по прямой, Колоссы — в 14 км к востоку, а Ефес — примерно в 155 км к западу, на главной дороге с побережья вглубь страны. Это не сирийская Лаодикия, нынешняя Латакия."
    - "Павел знал эту церковь по переписке: Епафрас заботился «о находящихся в Лаодикии и Иераполе», а Павел писал: «Приветствуйте братьев в Лаодикии, и Нимфана, и домашнюю церковь его», — и просил колоссян прочитать послание, «которое из Лаодикии»; его обычно считают утраченным, хотя некоторые видят в нём Послание к Ефесянам. Откровение около 95 г. посылает Лаодикии последнее из семи посланий: «ты тепл, а не горяч и не холоден»; она гордо говорит: «Я богат, разбогател и ни в чем не имею нужды». Многие толкуют этот образ по водам долины — горячим в Иераполе и холодным в Колоссах, тогда как в Лаодикию по водопроводу шла тёплая известковая вода; другие видят здесь простое иносказание. Послание кончается словами: «Се, стою у двери и стучу»."
    - "Антиох II основал город заново в середине III века до н. э. и назвал его в честь жены Лаодики; Страбон хвалит его богатство и мягкую чёрную шерсть здешних овец. После землетрясения 60 г. н. э., пишет Тацит, город отстроился без помощи Рима. Раскопки Университета Памуккале открыли улицы с колоннадами, два театра, стадион, водонапорные башни с забитыми известью глиняными трубами и большую церковь IV века."
  uk:
    - "Лаодікея на Лікосі лежала в долині Лікоса у Фрігії, на південному заході Малої Азії, на краю нинішнього Денізлі в Туреччині; точка на мапі стоїть на її руїнах. Ієраполіс, із гарячими джерелами й білими терасами в Памуккале, лежав приблизно за 10 км на північ по прямій, Колоси — за 14 км на схід, а Ефес — приблизно за 155 км на захід, на головній дорозі від узбережжя вглиб країни. Це не Лаодікея в Сирії, нинішня Латакія."
    - "Павло знав цю церкву з листування: Епафрас турбувався «про Лаодичан і Єрополян», а Павло писав: «Витайте братів, що в Лаодикиї, і Нимфана, і домашню церкву його», просячи колосян прочитати «написане з Лаодикиї», яке зазвичай вважають втраченим, хоч дехто ототожнює його з Посланням до ефесян. Одкровення, близько 95 р. н. е., надсилає Лаодікеї останній із семи листів: «яко ж лїтний єси, і нї зимний нї гарячий», який з гордістю каже: «Я багатий, і збагатїв, і нїчого не потрібую». Багато хто читає цей образ на тлі вод долини, гарячих в Ієраполісі та холодних у Колосах, тоді як Лаодікея брала теплувату, вапняну воду акведуком; інші вважають його простою мовною фігурою. Лист закінчується: «Ось, стою під дверми і стукаю»."
    - "Антіох II заснував місто наново в середині III ст. до н. е. й назвав його на честь своєї дружини Лаодіки; Страбон хвалить його багатство й м'яку чорну вовну його овець. Після землетрусу 60 р. н. е., каже Тацит, воно відбудувалося без допомоги Риму. Розкопки Університету Памуккале відкрили вулиці з колонадами, два театри, стадіон, водонапірні вежі, глиняні труби яких забиті вапном, і велику церкву IV ст."
  es:
    - "Laodicea del Lico se alzaba en el valle del Lico, en Frigia, en el suroeste de Asia Menor, en el borde de la actual Denizli, en Turquía; el punto del mapa está sobre sus ruinas. Hierápolis, con sus aguas termales y sus terrazas blancas de Pamukkale, estaba a unos 10 km al norte en línea recta, Colosas a 14 km al este y Éfeso a unos 155 km al oeste, en el camino principal de la costa al interior. No es la Laodicea de Siria, la actual Latakia."
    - "Pablo conocía la iglesia por carta: Epafras se afanaba por «los que están en Laodicea, y los que en Hierápolis», y Pablo escribió: «Saludad á los hermanos que están en Laodicea, y á Nimfas, y á la iglesia que está en su casa», y pidió a los colosenses que leyeran «la de Laodicea», que se suele considerar perdida, aunque algunos la identifican con Efesios. El Apocalipsis, hacia el 95 d. C., envía a Laodicea la última de las siete cartas: «eres tibio, y no frío ni caliente», orgullosa de decir «Yo soy rico, y estoy enriquecido, y no tengo necesidad de ninguna cosa». Muchos leen la imagen en relación con las aguas del valle, calientes en Hierápolis y frías en Colosas, mientras que Laodicea recibía por acueducto agua tibia y calcárea; otros la toman como una figura sencilla. La carta termina: «He aquí, yo estoy á la puerta y llamo»."
    - "Antíoco II refundó la ciudad a mediados del siglo III a. C. y le dio el nombre de su esposa Laodice; Estrabón alaba su riqueza y la suave lana negra de sus ovejas. Tras el terremoto del 60 d. C., dice Tácito, se reconstruyó sin ayuda de Roma. Las excavaciones de la Universidad de Pamukkale han sacado a la luz calles con columnatas, dos teatros, un estadio, torres de agua cuyas tuberías de barro están obstruidas por la cal y una gran iglesia del siglo IV."
  pt:
    - "Laodiceia do Lico ficava no vale do Lico, na Frígia, no sudoeste da Ásia Menor, na orla da atual Denizli, na Turquia; o ponto do mapa fica sobre as suas ruínas. Hierápolis, com as suas fontes termais e os terraços brancos de Pamukkale, ficava a cerca de 10 km ao norte em linha reta, Colossos a 14 km a leste e Éfeso a cerca de 155 km a oeste, na estrada principal da costa para o interior. Não é a Laodiceia da Síria, a atual Lataquia."
    - "Paulo conhecia a igreja por carta: Epafras trabalhava “pelos que estão em Laodiceia, e pelos que estão em Hierápolis”, e Paulo escreveu: “Saúdem os irmãos que estão em Laodiceia, bem como Ninfa e a igreja que está em sua casa”, pedindo aos colossenses que lessem “a carta de Laodiceia”, geralmente tida por perdida, embora alguns a tomem por Efésios. O Apocalipse, por volta de 95 d.C., envia a Laodiceia a última das sete cartas: “você é morno, e não é quente nem frio”, orgulhosa de dizer “Sou rico, adquiri riquezas e não preciso de nada”. Muitos leem a imagem à luz das águas do vale, quentes em Hierápolis e frias em Colossos, enquanto Laodiceia recebia por aqueduto uma água morna e calcária; outros a tomam como simples figura. A carta termina: “Eis que estou à porta e bato”."
    - "Antíoco II refundou a cidade em meados do século III a.C. e deu-lhe o nome de sua esposa Laodice; Estrabão elogia a sua riqueza e a lã negra e macia de suas ovelhas. Depois do terremoto de 60 d.C., diz Tácito, ela se reconstruiu sem ajuda de Roma. As escavações da Universidade de Pamukkale trouxeram à luz ruas com colunatas, dois teatros, um estádio, torres de água cujos canos de barro estão obstruídos pelo calcário e uma grande igreja do século IV."
  de:
    - "Laodizea am Lykos lag im Tal des Lykos in Phrygien, im Südwesten Kleinasiens, am Rand des heutigen Denizli in der Türkei; der Kartenpunkt steht auf seinen Ruinen. Hierapolis, mit seinen heißen Quellen und weißen Terrassen bei Pamukkale, lag in der Luftlinie etwa 10 km nördlich, Kolossae 14 km östlich und Ephesus etwa 155 km westlich, an der Hauptstraße von der Küste ins Landesinnere. Es ist nicht das Laodizea in Syrien, das heutige Latakia."
    - "Paulus kannte die Gemeinde durch einen Brief: Epaphras hatte Fleiß „um die zu Laodizea und zu Hierapolis“, und Paulus schrieb: „Grüßet die Brüder zu Laodizea und den Nymphas und die Gemeinde in seinem Hause“; er bittet die Kolosser, „daß ihr den von Laodizea lest“, den Brief von Laodizea, der meist für verloren gilt, obwohl manche ihn für den Epheserbrief halten. Die Offenbarung schickt um 95 n. Chr. Laodizea das letzte der sieben Sendschreiben: Die Gemeinde sei „lau“ und „weder kalt noch warm“, sage aber stolz: „Ich bin reich und habe gar satt und bedarf nichts.“ Viele lesen das Bild vor dem Hintergrund der Wasser des Tals, heiß bei Hierapolis und kalt bei Kolossae, während Laodizea lauwarmes, kalkhaltiges Wasser durch einen Aquädukt bezog; andere verstehen es als schlichte Redefigur. Das Sendschreiben endet: „Siehe, ich stehe vor der Tür und klopfe an.“"
    - "Antiochos II. gründete die Stadt Mitte des 3. Jahrhunderts v. Chr. neu und benannte sie nach seiner Frau Laodike; Strabon rühmt ihren Reichtum und die weiche schwarze Wolle ihrer Schafe. Nach dem Erdbeben von 60 n. Chr. baute sie sich, so Tacitus, ohne Hilfe Roms wieder auf. Grabungen der Universität Pamukkale haben Säulenstraßen, zwei Theater, ein Stadion, Wassertürme, deren Tonrohre von Kalk verstopft sind, und eine große Kirche des 4. Jahrhunderts freigelegt."
  fr:
    - "Laodicée du Lycus se trouvait dans la vallée du Lycus, en Phrygie, dans le sud-ouest de l’Asie Mineure, à la lisière de l’actuelle Denizli, en Turquie ; le point de la carte se trouve sur ses ruines. Hiérapolis, avec ses sources chaudes et ses terrasses blanches de Pamukkale, était à environ 10 km au nord à vol d’oiseau, Colosses à 14 km à l’est, et Éphèse à environ 155 km à l’ouest, sur la grande route qui menait de la côte vers l’intérieur. Elle ne doit pas être confondue avec Laodicée de Syrie, l’actuelle Lattaquié."
    - "Paul la connaissait par lettre : Épaphras avait « une grande sollicitude » pour « ceux de Laodicée, et pour ceux d’Hiérapolis », et Paul écrivit : « Saluez les frères qui sont à Laodicée, et Nymphas, et l’Église qui est dans sa maison », demandant aux Colossiens de lire « celle qui vous arrivera de Laodicée », lettre généralement tenue pour perdue, bien que certains y voient Éphésiens. L’Apocalypse, vers 95 apr. J.-C., adresse à Laodicée la dernière des sept lettres : « parce que tu es tiède, et que tu n’es ni froid ni bouillant », fière de dire « Je suis riche, je me suis enrichi, et je n’ai besoin de rien ». Beaucoup lisent l’image d’après les eaux de la vallée, chaudes à Hiérapolis et froides à Colosses, tandis que Laodicée recevait par aqueduc une eau tiède et calcaire ; d’autres y voient une simple figure. La lettre s’achève ainsi : « Voici, je me tiens à la porte, et je frappe »."
    - "Antiochos II refonda la ville au milieu du IIIe siècle av. J.-C. et lui donna le nom de son épouse Laodice ; Strabon vante sa richesse et la laine noire et douce de ses moutons. Après le tremblement de terre de 60 apr. J.-C., dit Tacite, elle se reconstruisit sans aide de Rome. Les fouilles de l’université de Pamukkale ont mis au jour des rues à colonnades, deux théâtres, un stade, des châteaux d’eau dont les conduites d’argile sont obstruées par le calcaire, et une grande église du IVe siècle."
  pl:
    - "Laodycea nad Likosem leżała w dolinie Likosu we Frygii, w południowo-zachodniej Azji Mniejszej, na skraju dzisiejszego Denizli w Turcji; punkt na mapie stoi na jej ruinach. Hierapolis, ze źródłami termalnymi i białymi tarasami w Pamukkale, leżało około 10 km na północ w linii prostej, Kolosy 14 km na wschód, a Efez około 155 km na zachód, przy głównej drodze z wybrzeża w głąb lądu. To nie jest Laodycea w Syrii, dzisiejsza Latakia."
    - "Paweł znał ten zbór z listu: świadczy o Epafrasie, że „gorliwą miłość ma przeciwko wam i przeciwko tym, którzy są w Laodycei i którzy są w Hijerapolu”, i pisze: „Pozdrówcie braci, którzy są w Laodycei, i Nymfasa, i zbór, który jest w domu jego”, prosząc Kolosan o przeczytanie listu, „który jest pisany z Laodycei”, zwykle uważanego za zaginiony, choć niektórzy biorą go za List do Efezjan. Apokalipsa, około 95 n.e., posyła Laodycei ostatni z siedmiu listów: „jesteś letni, a ani zimny ani gorący”, a miasto jest dumne z powiedzenia: „Jestem bogaty i zbogaciłem się, a niczego nie potrzebuję”. Wielu odczytuje ten obraz na tle wód doliny, gorących w Hierapolis i zimnych w Kolosach, podczas gdy Laodycea sprowadzała akweduktem letnią, wapienną wodę; inni biorą go za zwykłą przenośnię. List kończy się słowami: „Oto stoję u drzwi i kołaczę”."
    - "Antioch II odnowił miasto w połowie III wieku p.n.e. i nazwał je od swojej żony Laodike; Strabon chwali jego bogactwo i miękką czarną wełnę jego owiec. Po trzęsieniu ziemi w 60 n.e., pisze Tacyt, odbudowało się bez pomocy Rzymu. Wykopaliska Uniwersytetu Pamukkale odsłoniły ulice z kolumnadami, dwa teatry, stadion, wieże ciśnień, których gliniane rury są zatkane wapieniem, oraz duży kościół z IV wieku."
  it:
    - "Laodicea sul Lico sorgeva nella valle del Lico in Frigia, nell’Asia Minore sud-occidentale, al margine dell’odierna Denizli in Turchia; il punto della mappa si trova sulle sue rovine. Gerapoli, con le sue sorgenti calde e le terrazze bianche di Pamukkale, distava circa 10 km a nord in linea d’aria, Colosse 14 km a est, ed Efeso circa 155 km a ovest, sulla strada principale dalla costa verso l’interno. Non è la Laodicea di Siria, l’odierna Latakia."
    - "Paolo conosceva la chiesa per lettera: Epafra si dava pena «per quelli di Laodicea e per quelli di Jerapoli», e Paolo scrisse: «Salutate i fratelli che sono in Laodicea, e Ninfa e la chiesa che è in casa sua», chiedendo ai Colossesi di leggere «quella che vi sarà mandata da Laodicea», lettera che si ritiene di solito perduta, benché alcuni la identifichino con la lettera agli Efesini. L’Apocalisse, intorno al 95 d.C., manda a Laodicea l’ultima delle sette lettere: «perché sei tiepido, e non sei né freddo né fervente», orgogliosa di dire «Io son ricco, e mi sono arricchito, e non ho bisogno di nulla». Molti leggono l’immagine in rapporto alle acque della valle, calde a Gerapoli e fredde a Colosse, mentre Laodicea attingeva per acquedotto acqua tiepida e calcarea; altri la intendono come una semplice figura. La lettera termina: «Ecco, io sto alla porta e picchio»."
    - "Antioco II rifondò la città a metà del III secolo a.C. e le diede il nome della moglie Laodice; Strabone ne loda la ricchezza e la morbida lana nera delle sue pecore. Dopo il terremoto del 60 d.C., dice Tacito, si ricostruì da sé senza aiuto da Roma. Gli scavi dell’Università di Pamukkale hanno portato alla luce strade con colonnati, due teatri, uno stadio, torri dell’acqua le cui tubature di argilla sono ostruite dal calcare e una grande chiesa del IV secolo."
  cs:
    - "Laodikeia na Lykosu ležela v údolí Lykosu ve Frygii, v jihozápadní Malé Asii, na okraji dnešního Denizli v Turecku; bod na mapě stojí na jejích zříceninách. Hierapolis s horkými prameny a bílými terasami v Pamukkale byla vzdušnou čarou asi 10 km na sever, Kolosy 14 km na východ a Efez asi 155 km na západ, na hlavní cestě od pobřeží do vnitrozemí. Není to Laodikeia v Sýrii, dnešní Latákie."
    - "Pavel církev znal z listu: Epafras se namáhal za ty, „kteříž jsou v Laodicii, i kteříž jsou v Hierapoli“, a Pavel psal: „Pozdravte bratří Laodicenských, i Nymfy, i té církve, kteráž jest v domu jeho“, a žádal Kolosské, aby přečetli list, „kterýž jest psán z Laodicie“, obvykle pokládaný za ztracený, ač jej někteří pokládají za list Efezským. Zjevení, asi roku 95 n. l., posílá Laodikeji poslední ze sedmi listů: „že jsi vlažný, a ani studený, ani horký“, hrdé na slova „Bohatý jsem, a zbohatl jsem, a žádného nepotřebuji“. Mnozí čtou ten obraz proti vodám údolí, horkým v Hierapoli a studeným v Kolosách, zatímco Laodikeia přiváděla akvaduktem vlažnou vodu plnou vápence; jiní jej berou jako prostou figuru. List končí: „Aj, stojímť u dveří, a tluku.“"
    - "Antiochos II. město znovu založil v polovině 3. století př. n. l. a pojmenoval je podle své ženy Laodiké; Strabón chválí jeho bohatství a měkkou černou vlnu jeho ovcí. Po zemětřesení roku 60 n. l. se podle Tacita obnovilo bez pomoci Říma. Vykopávky univerzity Pamukkale odkryly ulice se sloupořadími, dvě divadla, stadion, vodárenské věže, jejichž hliněné trubky jsou ucpané vápencem, a velký kostel ze 4. století."
  nl:
    - "Laodicea aan de Lycus lag in het dal van de Lycus in Frygië, in het zuidwesten van Klein-Azië, aan de rand van het huidige Denizli in Turkije; het punt op de kaart staat op de ruïnes. Hiërapolis, met zijn warme bronnen en witte terrassen bij Pamukkale, lag hemelsbreed ongeveer 10 km naar het noorden, Kolosse 14 km naar het oosten en Efeze ongeveer 155 km naar het westen, aan de hoofdweg van de kust naar het binnenland. Het is niet het Laodicea in Syrië, het huidige Latakia."
    - "Paulus kende de gemeente uit een brief: Epafras had grote ijver voor “degenen, die in Laodicea zijn, en degenen, die in Hierapolis zijn”, en Paulus schreef: “Groet de broeders, die in Laodicea zijn, en Nymfas, en de Gemeente, die in zijn huis is”, en vroeg de Kolossenzen de brief te lezen “die uit Laodicea geschreven is”, meestal als verloren beschouwd, hoewel sommigen hem voor Efeziërs houden. De Openbaring stuurt Laodicea omstreeks 95 n.Chr. de laatste van de zeven brieven: “omdat gij lauw zijt, en noch koud noch heet”, trots zeggend: “Ik ben rijk, en verrijkt geworden, en heb geens dings gebrek”. Velen lezen het beeld tegen de wateren van het dal, heet bij Hiërapolis en koud bij Kolosse, terwijl Laodicea lauw, kalkrijk water via een aquaduct betrok; anderen vatten het op als een gewone beeldspraak. De brief eindigt: “Zie, Ik sta aan de deur, en Ik klop”."
    - "Antiochus II herstichtte de stad in het midden van de derde eeuw v.Chr. en noemde haar naar zijn vrouw Laodice; Strabo prijst haar rijkdom en de zachte zwarte wol van haar schapen. Na de aardbeving van 60 n.Chr. herbouwde zij zichzelf, zegt Tacitus, zonder hulp van Rome. Opgravingen van de Pamukkale-universiteit hebben zuilenstraten blootgelegd, twee theaters, een stadion, watertorens met kleileidingen die dichtgeslibd zijn met kalk, en een grote kerk uit de vierde eeuw."
  sv:
    - "Laodikeia vid Lykos låg i Lykosdalen i Frygien, i sydvästra Mindre Asien, i utkanten av dagens Denizli i Turkiet; kartpunkten står på dess ruiner. Hierapolis, med sina varma källor och vita terrasser vid Pamukkale, låg omkring 10 km åt norr i fågelvägen, Kolossai 14 km åt öster och Efesos omkring 155 km åt väster, vid huvudvägen från kusten in i inlandet. Det är inte Laodikeia i Syrien, dagens Latakia."
    - "Paulus kände församlingen genom brev: Epafras mödade sig för ”dem som bo i Laodicea och i Hierapolis”, och Paulus skrev: ”Hälsen bröderna i Laodicea, så ock Nymfas tillika med den församling som kommer tillhopa i hans hus”, och bad kolosserna läsa ”det brev, som kommer från Laodicea”, vanligen ansett förlorat, fastän vissa tar det för Efesierbrevet. Uppenbarelseboken, omkring år 95 e.Kr., sänder Laodikeia det sista av de sju breven: ”du är ljum och varken varm eller kall”, stolt över att säga ”Jag är rik, ja, jag har vunnit rikedomar och behöver intet”. Många läser bilden mot dalens vatten, hett vid Hierapolis och kallt vid Kolossai, medan Laodikeia hämtade ljumt, kalkrikt vatten genom en akvedukt; andra tar det som en enkel bild. Brevet slutar: ”Se, jag står för dörren och klappar”."
    - "Antiochos II grundade staden på nytt i mitten av 200-talet f.Kr. och uppkallade den efter sin hustru Laodike; Strabon prisar dess rikedom och den mjuka svarta ullen från dess får. Efter jordbävningen år 60 e.Kr. byggde den, säger Tacitus, upp sig själv utan hjälp från Rom. Utgrävningar av Pamukkale-universitetet har avtäckt kolonnadgator, två teatrar, en stadion, vattentorn vars lerrör är igensatta av kalk, och en stor kyrka från 300-talet."
  nb:
    - "Laodikea ved Lykos lå i Lykos-dalen i Frygia, i det sørvestlige Lilleasia, ved kanten av dagens Denizli i Tyrkia; kartpunktet står på ruinene. Hierapolis, med varme kilder og hvite terrasser ved Pamukkale, lå omtrent 10 km mot nord i luftlinje, Kolossai 14 km mot øst og Efesos omtrent 155 km mot vest, ved hovedveien fra kysten og inn i landet. Det er ikke Laodikea i Syria, dagens Latakia."
    - "Paulus kjente menigheten gjennom brev: Epafras hadde «meget strev for eder og dem i Laodikea og dem i Hierapolis», og Paulus skrev: «Hils brødrene i Laodikea, og Nymfas og menigheten i hans hus», og ba kolosserne lese «brevet fra Laodikea», vanligvis regnet som tapt, selv om noen holder det for Efeserbrevet. Johannes’ Åpenbaring, omkring 95 e.Kr., sender Laodikea det siste av de syv brevene: «du er lunken, og hverken kold eller varm», stolt av å si: «Jeg er rik og har overflod og fattes intet». Mange leser bildet mot dalens vann, varmt ved Hierapolis og kaldt ved Kolossai, mens Laodikea fikk lunkent, kalkrikt vann gjennom akvedukt; andre tar det som et enkelt bilde. Brevet slutter: «Se, jeg står for døren og banker»."
    - "Antiokhos II grunnla byen på nytt midt på 200-tallet f.Kr. og oppkalte den etter sin hustru Laodike; Strabon priser dens rikdom og den myke svarte ullen fra sauene. Etter jordskjelvet i 60 e.Kr. gjenreiste den seg, sier Tacitus, uten hjelp fra Roma. Utgravninger ved Pamukkale-universitetet har avdekket gater med søylegang, to teatre, et stadion, vanntårn hvis leirrør er tette av kalk, og en stor kirke fra 300-tallet."
  tl:
    - "Ang Laodicea sa Lycus ay nasa lambak ng Lycus sa Frigia, sa timog-kanlurang Asia Minor, sa gilid ng kasalukuyang Denizli sa Turkey; nakatayo sa mga guho nito ang punto sa mapa. Ang Hierapolis, na may mga mainit na bukal at puting mga hagdan ng bato sa Pamukkale, ay mga 10 km sa hilaga sa tuwid na guhit, ang Colosas ay 14 km sa silangan, at ang Efeso ay mga 155 km sa kanluran, sa pangunahing daan mula sa baybayin patungo sa looban. Hindi ito ang Laodicea sa Siria, ang Latakia ngayon."
    - "Kilala ni Pablo ang iglesia sa liham: nagpagal si Epafras para sa “nangasa Laodicea, at sa nangasa Hierapolis”, at sumulat si Pablo, “Batiin ninyo ang mga kapatid na nangasa Laodicea, at si Nimfas, at ang iglesiang nasa kanilang bahay”, na ipinababasa sa mga taga-Colosas ang “sulat na mula sa Laodicea”, na itinuturing na nawala, bagaman may nag-aakalang Mga Taga-Efeso ito. Ang Apocalipsis, mga 95 AD, ay may huling liham ng pito para sa Laodicea: “ikaw ay malahininga, at hindi mainit o malamig man”, na ipinagmamalaki ang “Ako'y mayaman, at nagkamit ng kayamanan, at hindi ako nangangailangan ng anoman”. Binabasa ito ng marami ayon sa tubig ng lambak, mainit sa Hierapolis, malamig sa Colosas, samantalang ang Laodicea ay may maligamgam at maapog na tubig mula sa aqueduct; payak na tayutay ito para sa iba. Nagtatapos ito: “Narito ako'y nakatayo sa pintuan at tumutuktok”."
    - "Muling itinatag ni Antiochus II ang lungsod noong kalagitnaan ng ika-3 siglo BK at pinangalanan ito sa kaniyang asawang si Laodice; pinupuri ni Strabo ang yaman nito at ang malambot na itim na lana ng mga tupa nito. Pagkatapos ng lindol noong 60 AD, ayon kay Tacitus, itinayo nitong muli ang sarili nang walang tulong mula sa Roma. Ang mga paghuhukay ng Pamantasang Pamukkale ay nakatuklas ng mga lansangang may hanay ng haligi, dalawang teatro, isang istadyum, mga tore ng tubig na ang mga tubong luwad ay barado ng apog, at isang malaking simbahan noong ika-4 na siglo."
