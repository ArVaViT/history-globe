id: when-was-jesus-crucified
question:
  en: "When was Jesus crucified?"
  ru: "Когда распяли Иисуса?"
  uk: "Коли розп'яли Ісуса?"
  es: "¿Cuándo fue crucificado Jesús?"
  pt: "Quando Jesus foi crucificado?"
  de: "Wann wurde Jesus gekreuzigt?"
  fr: "Quand Jésus a-t-il été crucifié ?"
  pl: "Kiedy ukrzyżowano Jezusa?"
  it: "Quando fu crocifisso Gesù?"
  nl: "Wanneer werd Jezus gekruisigd?"
  cs: "Kdy byl Ježíš ukřižován?"
  sv: "När korsfästes Jesus?"
  nb: "Når ble Jesus korsfestet?"
  tl: "Kailan ipinako si Jesus sa krus?"
  da: "Hvornår blev Jesus korsfæstet?"
  sr: "Када је Исус разапет?"
  hu: "Mikor feszítették keresztre Jézust?"
  fi: "Milloin Jeesus ristiinnaulittiin?"
  vi: "Giê-su bị đóng đinh khi nào?"
  ro: "Când a fost răstignit Isus?"
  bg: "Кога е бил разпнат Исус?"
answer:
  en:
    - "The Gospels agree that Jesus died on a Friday, the eve of a sabbath, at Passover, while Pontius Pilate governed Judea (about 26–36), but they do not name the year. Most scholars choose between two dates: Friday 7 April AD 30 and Friday 3 April AD 33. Early writers and a minority give others: Tertullian dates the Passion to the consulship of the two Gemini, AD 29, and Cassiodorus to AD 31. The map uses c. AD 30 as a conventional point; AD 33 is also widely held."
    - "Mark sets the Last Supper on “the first day of unleavened bread, when they killed the passover”, so in the first three Gospels Jesus dies on Nisan 15, the feast day itself. John says those who brought Jesus would not enter the judgment hall, “that they might eat the passover”, and that at the sentence “it was the preparation of the passover”: in John he dies on Nisan 14, when the lambs were slain. Some reconcile the two by calendars in use side by side. The month began with the sighting of the new crescent, which astronomy can reckon. In Nature in 1983 C. J. Humphreys and W. G. Waddington found that in AD 26–36 Nisan 14 fell on a Friday in AD 30 and 33, and Nisan 15 possibly in AD 34, which they thought unlikely; taking John's day and a lunar eclipse on the evening of 3 April 33, they argued for that date. Others, on the same tables, keep AD 30."
    - "Luke dates the start of John the Baptist's preaching “in the fifteenth year of the reign of Tiberius Caesar, Pontius Pilate being governor of Judaea”. Counted from the death of Augustus in AD 14 this is AD 28/29; a few count from an earlier co-regency and get AD 26/27. John names three Passovers in the ministry, so AD 33 allows a ministry of three years or more, while AD 30 needs a shorter one or the earlier count. At the first Passover the Jews say: “Forty and six years was this temple in building”. Herod began the rebuilding in his eighteenth year, 20/19 BC, and forty-six years on is Passover AD 27/28, which suits AD 30; read as “built forty-six years ago”, from the completion of the sanctuary about 18 BC, the words point to AD 29/30, which suits AD 33."
  ru:
    - "Евангелия согласны, что Иисус умер в пятницу, накануне субботы, на Пасху, когда Иудеей управлял Понтий Пилат (примерно 26–36 гг.), но года не называют. Большинство учёных выбирает между двумя датами: пятница 7 апреля 30 г. н. э. и пятница 3 апреля 33 г. н. э. Древние авторы и меньшинство учёных называют другие: Тертуллиан относит Страсти к консульству двух Геминов, 29 г., Кассиодор — к 31 г. Карта показывает условный 30 г.; 33 г. держатся тоже многие."
    - "У Марка Тайная вечеря — «в первый день опресноков, когда заколали пасхального агнца», так что в первых трёх Евангелиях Иисус умирает 15 нисана, в самый праздник. Иоанн пишет, что приведшие Его не вошли в преторию, «чтобы можно было есть пасху», и что при приговоре «была пятница перед Пасхою»: у Иоанна Он умирает 14 нисана, когда закалали агнцев. Некоторые согласуют оба рассказа разными календарями. Месяц начинался с появления нового серпа луны, и это можно рассчитать. В журнале Nature в 1983 г. К. Хамфрис и У. Уоддингтон нашли, что в 26–36 гг. 14 нисана приходилось на пятницу в 30 и 33 г., а 15 нисана — возможно, в 34 г., что они сочли маловероятным; приняв день Иоанна и лунное затмение вечером 3 апреля 33 г., они выбрали эту дату. Другие по тем же таблицам держатся 30 г."
    - "Лука датирует начало проповеди Иоанна Крестителя: «В пятнадцатый же год правления Тиверия кесаря, когда Понтий Пилат начальствовал в Иудее». От смерти Августа в 14 г. это 28/29 г.; немногие считают от более раннего соправления и получают 26/27 г. Иоанн называет в служении три Пасхи, так что 33 г. допускает служение в три года и больше, а 30 г. требует более короткого или раннего счёта. На первой Пасхе иудеи говорят: «сей храм строился сорок шесть лет». Ирод начал перестройку в восемнадцатый год своего царствования, 20/19 г. до н. э., и через сорок шесть лет — Пасха 27/28 г., что подходит к 30 г.; если читать «построен сорок шесть лет назад», от завершения святилища около 18 г. до н. э., слова указывают на 29/30 г., что подходит к 33 г."
  uk:
    - "Євангелії сходяться на тому, що Ісус помер у п'ятницю, напередодні суботи, на Пасху, коли Юдеєю правив Понтій Пилат (близько 26–36 рр.), але року не називають. Більшість учених обирає між двома датами: п'ятниця 7 квітня 30 р. н. е. і п'ятниця 3 квітня 33 р. н. е. Давні письменники та меншість називають інші: Тертуліан датує Страсті Христові консульством двох Гемінів, 29 р. н. е., а Кассіодор — 31 р. н. е. Мапа використовує близько 30 р. н. е. як умовну точку; 33 р. н. е. також широко підтримують."
    - "Марко відносить Тайну вечерю на «первого дня опрісночного, як пасхове ягня кололи», тож у перших трьох Євангеліях Ісус помирає 15 нісана, у саме свято. Іван каже, що ті, хто привів Ісуса, не ввійшли в преторій, «щоб їсти їм пасху», і що під час вироку «була ж пятниця перед пасхою»: в Івана Він помирає 14 нісана, коли різали ягнят. Дехто узгоджує їх календарями, які вживалися поряд. Місяць починався зі спостереження нового серпика, яке астрономія може обчислити. У Nature 1983 р. К. Дж. Гемфріс і В. Дж. Вейддінгтон встановили, що в 26–36 рр. н. е. 14 нісана припадало на п'ятницю в 30 і 33 рр. н. е., а 15 нісана, можливо, у 34 р., що вони вважали малоймовірним; прийнявши день Івана та місячне затемнення увечері 3 квітня 33 р., вони відстоювали цю дату. Інші, на тих самих таблицях, тримаються 30 р. н. е."
    - "Лука датує початок проповіді Івана Хрестителя «пятнайцятим роком правлення Тиверия кесаря, як був ігемоном Понтийський Пилат в Юдеї». Якщо рахувати від смерті Августа 14 р. н. е., це 28/29 р. н. е.; деякі рахують від раннього співправління й отримують 26/27 р. Іван називає три Пасхи за служіння, тож 33 р. н. е. допускає служіння в три роки й довше, тоді як 30 р. н. е. потребує коротшого або раннього відліку. На першу Пасху євреї кажуть: «Сорок і шість років будовано церкву сю». Ірод почав відбудову на вісімнадцятому році свого царювання, 20/19 р. до н. е., і сорок шість років по тому — Пасха 27/28 р. н. е., що підходить до 30 р. н. е.; якщо читати як «збудовано сорок шість років тому», від завершення святині близько 18 р. до н. е., слова вказують на 29/30 р. н. е., що підходить до 33 р. н. е."
  es:
    - "Los Evangelios coinciden en que Jesús murió un viernes, víspera de un sábado, en la Pascua, mientras Poncio Pilato gobernaba Judea (hacia 26–36), pero no nombran el año. La mayoría de los estudiosos elige entre dos fechas: el viernes 7 de abril del 30 d. C. y el viernes 3 de abril del 33 d. C. Escritores antiguos y una minoría proponen otras: Tertuliano fecha la Pasión en el consulado de los dos Géminos, el 29 d. C., y Casiodoro en el 31 d. C. El mapa usa hacia el 30 d. C. como punto convencional; el 33 d. C. también se sostiene ampliamente."
    - "Marcos sitúa la Última Cena «el primer día de los panes sin levadura, cuando sacrificaban la pascua», y así en los tres primeros Evangelios Jesús muere el 15 de Nisán, día de la fiesta. En Juan quienes lo llevaron no entraron en el pretorio «por no ser contaminados, sino que comiesen la pascua», y en la sentencia «era la víspera de la Pascua»: muere el 14 de Nisán, cuando se degollaban los corderos. Algunos los concilian con calendarios simultáneos. El mes empezaba con la luna nueva observada, calculable astronómicamente. En Nature en 1983 C. J. Humphreys y W. G. Waddington hallaron que, entre el 26 y el 36 d. C., el 14 de Nisán cayó en viernes en el 30 y el 33 d. C., y el 15 posiblemente en el 34, lo que consideraron improbable; con el día de Juan y un eclipse lunar la tarde del 3 de abril del 33, defendieron esa fecha. Otros, con las mismas tablas, mantienen el 30."
    - "Lucas fecha el comienzo de la predicación de Juan el Bautista «en el año quince del imperio de Tiberio César, siendo gobernador de Judea Poncio Pilato». Contado desde la muerte de Augusto en el 14 d. C., es el 28/29; unos pocos cuentan desde una corregencia anterior y obtienen el 26/27. Juan nombra tres Pascuas en el ministerio, así que el 33 d. C. permite un ministerio de tres años o más, y el 30 d. C. requiere uno más corto o el cómputo anterior. En la primera Pascua los judíos dicen: «En cuarenta y seis años fué este templo edificado». Herodes comenzó la reconstrucción en su año dieciocho, 20/19 a. C., y cuarenta y seis años después es la Pascua del 27/28 d. C., lo que concuerda con el 30 d. C.; leídas como «fue edificado hace cuarenta y seis años», desde la terminación del santuario hacia el 18 a. C., apuntan al 29/30 d. C., lo que concuerda con el 33 d. C."
  pt:
    - "Os Evangelhos concordam em que Jesus morreu numa sexta-feira, véspera de sábado, na Páscoa, quando Pôncio Pilatos governava a Judeia (cerca de 26–36), mas não nomeiam o ano. A maioria dos estudiosos escolhe entre duas datas: sexta-feira, 7 de abril de 30 d.C., e sexta-feira, 3 de abril de 33 d.C. Escritores antigos e uma minoria dão outras: Tertuliano data a Paixão do consulado dos dois Gêmeos, 29 d.C., e Cassiodoro de 31 d.C. O mapa usa c. 30 d.C. como ponto convencional; 33 d.C. também é amplamente defendido."
    - "Marcos põe a Última Ceia “no primeiro dia dos pães asmos, quando sacrificavam o cordeiro da Páscoa”, daí que nos três primeiros Evangelhos ele morre em 15 de nisã, o próprio dia da festa. João diz que os que levaram Jesus não entraram no Pretório, “para não se contaminarem, mas poderem comer a Páscoa”, e que na sentença “era o Dia da Preparação da Páscoa”: em João ele morre em 14 de nisã, quando os cordeiros eram imolados. Alguns conciliam os dois por calendários usados lado a lado. O mês começava com a observação da lua nova, que a astronomia pode calcular. Na Nature, em 1983, C. J. Humphreys e W. G. Waddington acharam que em 26–36 d.C. o 14 de nisã caiu numa sexta-feira em 30 e 33 d.C., e o 15 de nisã possivelmente em 34, que julgaram improvável; tomando o dia de João e um eclipse lunar na noite de 3 de abril de 33, defenderam essa data. Outros, com as mesmas tabelas, mantêm 30 d.C."
    - "Lucas data o início da pregação de João Batista “no décimo quinto ano do reinado de Tibério César, sendo Pôncio Pilatos governador da Judeia”. Contado da morte de Augusto, em 14 d.C., dá 28/29 d.C.; alguns contam de uma corregência anterior e obtêm 26/27. João nomeia três Páscoas no ministério, de modo que 33 d.C. permite um ministério de três anos ou mais, enquanto 30 d.C. exige um mais curto ou a contagem anterior. Na primeira Páscoa os judeus dizem: “Levou quarenta e seis anos para construir este templo!” Herodes começou a reconstrução em seu décimo oitavo ano, 20/19 a.C., e quarenta e seis anos depois é a Páscoa de 27/28 d.C., o que combina com 30 d.C.; lidas como “construído há quarenta e seis anos”, desde a conclusão do santuário por volta de 18 a.C., as palavras indicam 29/30 d.C., o que combina com 33 d.C."
  de:
    - "Die Evangelien stimmen darin überein, dass Jesus an einem Freitag starb, am Vorabend eines Sabbats, zum Passafest, als Pontius Pilatus Judäa verwaltete (etwa 26–36), nennen aber das Jahr nicht. Die meisten Gelehrten wählen zwischen zwei Daten: Freitag, 7. April 30 n. Chr., und Freitag, 3. April 33 n. Chr. Frühe Schriftsteller und eine Minderheit nennen andere: Tertullian datiert die Passion in das Konsulat der beiden Gemini, 29 n. Chr., und Cassiodor auf 31 n. Chr. Die Karte verwendet um 30 n. Chr. als herkömmlichen Punkt; auch 33 n. Chr. ist weit verbreitet."
    - "Markus legt das Abendmahl auf „am ersten Tage der süßen Brote, da man das Osterlamm opferte“, sodass Jesus nach den ersten drei Evangelien am 15. Nisan, dem Festtag selbst, stirbt. Bei Johannes betraten die, die Jesus brachten, das Richthaus nicht, „sondern Ostern essen möchten“, und bei der Verurteilung war „der Rüsttag auf Ostern“: Er stirbt am 14. Nisan, als die Lämmer geschlachtet wurden. Manche versöhnen sie durch parallele Kalender. Der Monat begann mit der Neumondsichel, die sich astronomisch berechnen lässt. 1983 fanden C. J. Humphreys und W. G. Waddington in Nature, dass der 14. Nisan in den Jahren 26–36 n. Chr. 30 und 33 auf einen Freitag fiel, der 15. möglicherweise 34, was sie für unwahrscheinlich hielten; mit dem Tag des Johannes und einer Mondfinsternis am Abend des 3. April 33 plädierten sie für 33. Andere bleiben auf denselben Tafeln bei 30."
    - "Lukas datiert den Beginn der Predigt Johannes' des Täufers „in dem fünfzehnten Jahr des Kaisertums Kaisers Tiberius, da Pontius Pilatus Landpfleger in Judäa war“. Vom Tod des Augustus 14 n. Chr. gezählt ist das 28/29 n. Chr.; wenige zählen von einer früheren Mitregentschaft und kommen auf 26/27. Johannes nennt drei Passafeste im Wirken, sodass 33 n. Chr. ein Wirken von drei Jahren oder mehr erlaubt, während 30 ein kürzeres oder die frühere Zählung braucht. Beim ersten Passafest sagen die Juden: „Dieser Tempel ist in 46 Jahren erbaut“. Herodes begann den Umbau in seinem achtzehnten Jahr, 20/19 v. Chr., und sechsundvierzig Jahre später ist Passa 27/28 n. Chr., was zu 30 passt; liest man „vor sechsundvierzig Jahren erbaut“, von der Vollendung des Heiligtums um 18 v. Chr. an, weisen die Worte auf 29/30 n. Chr., was zu 33 passt."
  fr:
    - "Les Évangiles s’accordent pour dire que Jésus mourut un vendredi, veille d’un sabbat, à la Pâque, sous le gouvernement de Ponce Pilate en Judée (vers 26–36), mais ils ne nomment pas l’année. La plupart des savants choisissent entre deux dates : le vendredi 7 avril 30 apr. J.-C. et le vendredi 3 avril 33 apr. J.-C. D’anciens auteurs et une minorité en donnent d’autres : Tertullien date la Passion du consulat des deux Gémini, 29 apr. J.-C., et Cassiodore de 31 apr. J.-C. La carte retient vers 30 apr. J.-C. comme repère conventionnel ; 33 apr. J.-C. est aussi largement admis."
    - "Marc situe la dernière Cène « le premier jour des pains sans levain, où l’on immolait la Pâque » ; dans les trois premiers, il meurt donc le 15 Nisan, jour même de la fête. Jean dit que ses accusateurs restèrent hors du prétoire « afin de ne pas se souiller, et de pouvoir manger la Pâque », et qu’à la sentence « c’était la préparation de la Pâque » : chez lui, Jésus meurt le 14 Nisan, quand on immolait les agneaux. Certains les concilient par des calendriers parallèles. Le mois commençait avec le nouveau croissant, que l’astronomie sait calculer. Dans Nature (1983), C. J. Humphreys et W. G. Waddington trouvèrent qu’en 26–36 apr. J.-C. le 14 Nisan tomba un vendredi en 30 et en 33, et le 15 peut-être en 34, improbable selon eux ; retenant le jour de Jean et une éclipse de lune le soir du 3 avril 33, ils plaidèrent pour 33. D’autres, sur les mêmes tables, gardent 30."
    - "Luc date le début de la prédication de Jean le Baptiste « la quinzième année du règne de Tibère César, lorsque Ponce Pilate était gouverneur de la Judée ». Compté depuis la mort d’Auguste en 14 apr. J.-C., cela donne 28/29 apr. J.-C. ; quelques-uns comptent depuis une corégence antérieure et obtiennent 26/27. Jean nomme trois Pâques dans le ministère : 33 apr. J.-C. permet un ministère de trois ans ou plus, 30 en suppose un plus court ou le compte antérieur. À la première Pâque, les Juifs disent : « Il a fallu quarante-six ans pour bâtir ce temple ». Hérode commença la reconstruction la dix-huitième année de son règne, en 20/19 av. J.-C., et quarante-six ans plus tard donnent la Pâque de 27/28 apr. J.-C., qui convient à 30 ; lues comme « bâti il y a quarante-six ans », depuis l’achèvement du sanctuaire vers 18 av. J.-C., ces paroles indiquent 29/30, qui convient à 33."
  pl:
    - "Ewangelie zgadzają się, że Jezus zmarł w piątek, w przeddzień szabatu, w czasie Paschy, gdy Poncjusz Piłat rządził Judeą (około 26–36), ale nie podają roku. Większość uczonych wybiera między dwiema datami: piątek 7 kwietnia 30 n.e. i piątek 3 kwietnia 33 n.e. Dawni pisarze i mniejszość podają inne: Tertulian datuje Mękę na konsulat dwóch Geminów, 29 n.e., a Kasjodor na 31 n.e. Mapa używa około 30 n.e. jako punktu umownego; szeroko przyjmuje się też 33 n.e."
    - "Marek umieszcza Ostatnią Wieczerzę „Pierwszego tedy dnia przaśników, gdy baranka wielkanocnego zabijano”, więc w trzech pierwszych Ewangeliach Jezus umiera 15 nisan, w samo święto. Jan mówi, że ci, którzy przyprowadzili Jezusa, nie weszli do pretorium, „iżby pożywali baranka wielkanocnego”, i że przy wyroku „było to w dzień przygotowania przed wielkanocą”: u Jana umiera 14 nisan, gdy zabijano baranki. Niektórzy godzą je kalendarzami używanymi obok siebie. Miesiąc zaczynał się od zobaczenia nowego sierpa, co astronomia potrafi wyliczyć. W „Nature” w 1983 C. J. Humphreys i W. G. Waddington stwierdzili, że w latach 26–36 n.e. 14 nisan przypadał w piątek w 30 i 33 n.e., a 15 nisan możliwie w 34, co uznali za mało prawdopodobne; biorąc dzień Jana i zaćmienie Księżyca wieczorem 3 kwietnia 33, argumentowali za tą datą. Inni, na tych samych tablicach, zostają przy 30 n.e."
    - "Łukasz datuje początek nauczania Jana Chrzciciela „roku piętnastego panowania Tyberyjusza Cesarza, gdy Poncki Piłat był starostą Judzkim”. Licząc od śmierci Augusta w 14 n.e., jest to 28/29 n.e.; niektórzy liczą od wcześniejszego współrządu i dostają 26/27 n.e. Jan wymienia trzy Paschy w czasie posługi, więc rok 33 pozwala na posługę trwającą trzy lata lub dłużej, a rok 30 wymaga krótszej albo wcześniejszego liczenia. Podczas pierwszej Paschy Żydzi mówią o Świątyni: „Czterdzieści i sześć lat budowano ten kościół”. Herod zaczął przebudowę w osiemnastym roku swego panowania, 20/19 p.n.e., a czterdzieści sześć lat później to Pascha 27/28 n.e., co pasuje do 30 n.e.; odczytane jako „zbudowano czterdzieści sześć lat temu”, od ukończenia sanktuarium około 18 p.n.e., słowa te wskazują na 29/30 n.e., co pasuje do 33 n.e."
  it:
    - "I Vangeli concordano che Gesù morì di venerdì, vigilia di un sabato, a Pasqua, mentre Ponzio Pilato governava la Giudea (circa 26–36), ma non nominano l’anno. La maggior parte degli studiosi sceglie tra due date: venerdì 7 aprile del 30 d.C. e venerdì 3 aprile del 33 d.C. Autori antichi e una minoranza ne danno altre: Tertulliano data la Passione al consolato dei due Gemini, il 29 d.C., e Cassiodoro al 31 d.C. La mappa usa il 30 d.C. circa come punto convenzionale; è molto diffuso anche il 33 d.C."
    - "Marco colloca l’Ultima Cena «il primo giorno degli azzimi, quando si sacrificava la pasqua», dunque nei primi tre Vangeli muore il 15 di Nisan, giorno della festa. Giovanni dice che chi condusse Gesù non entrò nel pretorio «per non contaminarsi e così poter mangiare la pasqua», e che alla sentenza «era la preparazione della Pasqua»: in Giovanni muore il 14 di Nisan, quando si immolavano gli agnelli. Alcuni li conciliano con calendari paralleli. Il mese cominciava con l’avvistamento della nuova luna, calcolabile dall’astronomia. Su Nature (1983) C. J. Humphreys e W. G. Waddington trovarono che nel 26–36 d.C. il 14 di Nisan cadde di venerdì nel 30 e nel 33 d.C., e il 15 forse nel 34 d.C., che giudicarono improbabile; assunto il giorno di Giovanni e un’eclissi lunare la sera del 3 aprile 33, sostennero quella data. Altri, con le stesse tavole, tengono il 30 d.C."
    - "Luca data l’inizio della predicazione di Giovanni Battista «nell’anno decimoquinto dell’impero di Tiberio Cesare, essendo Ponzio Pilato governatore della Giudea». Contato dalla morte di Augusto nel 14 d.C. è il 28/29 d.C.; pochi contano da una precedente coreggenza e ottengono il 26/27 d.C. Giovanni nomina tre Pasque nel ministero, così il 33 d.C. consente un ministero di tre anni o più, mentre il 30 d.C. ne richiede uno più breve o il computo precedente. Alla prima Pasqua i Giudei dicono: «Quarantasei anni è durata la fabbrica di questo tempio». Erode iniziò la ricostruzione nel suo diciottesimo anno, 20/19 a.C., e quarantasei anni dopo è la Pasqua del 27/28 d.C., che si accorda con il 30 d.C.; letta come «costruito quarantasei anni fa», dal completamento del santuario intorno al 18 a.C., la frase indica il 29/30 d.C., che si accorda con il 33 d.C."
  nl:
    - "De Evangeliën zijn het erover eens dat Jezus op een vrijdag stierf, de vooravond van een sabbat, tijdens Pesach, terwijl Pontius Pilatus Judea bestuurde (ongeveer 26–36), maar zij noemen het jaar niet. De meeste geleerden kiezen tussen twee data: vrijdag 7 april 30 n.Chr. en vrijdag 3 april 33 n.Chr. Vroege schrijvers en een minderheid geven andere: Tertullianus dateert het lijden onder het consulaat van de twee Gemini, 29 n.Chr., en Cassiodorus op 31 n.Chr. De kaart gebruikt ca. 30 n.Chr. als conventioneel punt; 33 n.Chr. wordt ook veel aangehouden."
    - "Marcus plaatst het Laatste Avondmaal op “den eersten dag der ongehevelde broden, wanneer zij het pascha slachtten”, dus in de eerste drie Evangeliën sterft Jezus op 15 Nisan, de feestdag zelf. Bij Johannes gingen zij die Jezus brachten het rechthuis niet in, “opdat zij het pascha eten mochten”, en bij het vonnis “het was de voorbereiding van het pascha”: Hij sterft op 14 Nisan, toen de lammeren werden geslacht. Sommigen verzoenen beide met naast elkaar gebruikte kalenders. De maand begon met de nieuwe maansikkel, wat de sterrenkunde kan berekenen. In Nature (1983) vonden Humphreys en Waddington dat in 26–36 n.Chr. 14 Nisan op vrijdag viel in 30 en 33 n.Chr., en 15 Nisan mogelijk in 34, wat zij onwaarschijnlijk vonden; met Johannes’ dag en een maansverduistering op de avond van 3 april 33 pleitten zij voor die datum. Anderen houden op dezelfde tabellen 30 n.Chr. aan."
    - "Lukas dateert het begin van de prediking van Johannes de Doper “in het vijftiende jaar der regering van den keizer Tiberius, als Pontius Pilatus stadhouder was over Judea”. Geteld vanaf Augustus’ dood in 14 n.Chr. is dat 28/29 n.Chr.; enkelen tellen vanaf een eerder medeheerschap en komen op 26/27. Johannes noemt drie Pesachfeesten in het optreden, dus 33 n.Chr. laat drie jaar of meer toe, terwijl 30 n.Chr. een korter optreden of de eerdere telling vereist. Bij het eerste Pesach zeggen de Joden: “Zes en veertig jaren is over dezen tempel gebouwd”. Herodes begon de herbouw in zijn achttiende jaar, 20/19 v.Chr., en zesenveertig jaar later is Pesach 27/28 n.Chr., wat bij 30 past; gelezen als “zesenveertig jaar geleden gebouwd”, vanaf de voltooiing van het heiligdom omstreeks 18 v.Chr., wijzen de woorden op 29/30 n.Chr., wat bij 33 past."
  cs:
    - "Evangelia se shodují, že Ježíš zemřel v pátek, v předvečer soboty, o Pesachu, za správy Pontia Piláta v Judsku (asi 26–36), ale rok neuvádějí. Většina badatelů volí mezi dvěma daty: pátek 7. dubna 30 n. l. a pátek 3. dubna 33 n. l. Staří spisovatelé a menšina uvádějí jiná: Tertullianus datuje umučení do konzulátu dvou Geminů, roku 29 n. l., a Cassiodorus do roku 31 n. l. Mapa užívá asi 30 n. l. jako smluvní bod; široce se hájí i 33 n. l."
    - "Marek o poslední večeři píše: „Prvního pak dne přesnic, když velikonoční beránek zabíjín býval“, takže v prvních třech evangeliích Ježíš umírá 15. nisanu, v samotný den svátku. Jan říká, že ti, kdo Ježíše přivedli, nevešli do radného domu, „aby jedli beránka“, a že při rozsudku „byl den připravování před velikonocí“: u Jana umírá 14. nisanu, kdy se zabíjeli beránci. Někteří obojí smiřují kalendáři užívanými vedle sebe. Měsíc začínal spatřením nového srpku, což astronomie dokáže spočítat. V Nature roku 1983 C. J. Humphreys a W. G. Waddington zjistili, že v letech 26–36 n. l. připadl 14. nisan na pátek v letech 30 a 33 n. l. a 15. nisan možná roku 34 n. l., což pokládali za nepravděpodobné; vzali Janův den a zatmění měsíce večer 3. dubna 33 a hájili toto datum. Jiní na týchž tabulkách zůstávají u roku 30 n. l."
    - "Lukáš datuje začátek kázání Jana Křtitele „léta pak patnáctého císařství Tiberia císaře, když Pontský Pilát spravoval Judstvo“. Počítáno od smrti Augustovy roku 14 n. l. je to 28/29 n. l.; někteří počítají od dřívějšího spoluvládnutí a dostanou 26/27 n. l. Jan jmenuje tři Pesachy ve službě, takže rok 33 n. l. dovoluje službu tři roky či déle, zatímco rok 30 n. l. vyžaduje kratší nebo dřívější počet. O prvním Pesachu Židé říkají: „Čtyřidceti a šest let dělán jest chrám tento“. Herodes zahájil přestavbu v osmnáctém roce vlády, 20/19 př. n. l., a o čtyřicet šest let později je Pesach 27/28 n. l., což vyhovuje roku 30 n. l.; čteno jako „před čtyřiceti šesti lety postaven“ od dokončení svatyně asi 18 př. n. l. míří slova na 29/30 n. l., což vyhovuje roku 33 n. l."
  sv:
    - "Evangelierna är överens om att Jesus dog på en fredag, dagen före en sabbat, vid påsk, medan Pontius Pilatus var ståthållare i Judeen (omkring 26–36), men de nämner inte året. De flesta forskare väljer mellan två datum: fredagen den 7 april 30 e.Kr. och fredagen den 3 april 33 e.Kr. Tidiga skribenter och en minoritet anger andra: Tertullianus daterar lidandet till de båda Geminis konsulat, år 29 e.Kr., och Cassiodorus till år 31 e.Kr. Kartan använder omkring 30 e.Kr. som en konventionell punkt; 33 e.Kr. är också vitt förfäktat."
    - "Markus förlägger den sista måltiden till ”första dagen i det osyrade brödets högtid, när man slaktade påskalammet”, så i de tre första evangelierna dör Jesus den 15 nisan, själva högtidsdagen. Johannes säger att de som förde Jesus inte gick in i pretoriet, ”för att de … skulle kunna äta påskalammet”, och att det vid domen ”var tillredelsedagen före påsken”: hos Johannes dör han den 14 nisan, när lammen slaktades. Somliga förenar dem med kalendrar som användes parallellt. Månaden började med att nymånens skära sågs, vilket astronomin kan räkna ut. I Nature 1983 fann C. J. Humphreys och W. G. Waddington att den 14 nisan under 26–36 e.Kr. föll på en fredag år 30 och 33, och den 15 nisan möjligen år 34, vilket de ansåg osannolikt; med Johannes dag och en månförmörkelse på kvällen den 3 april 33 förordade de det datumet. Andra håller på samma tabeller fast vid 30 e.Kr."
    - "Lukas daterar början på Johannes Döparens predikan ”i femtonde året av kejsar Tiberius’ regering, när Pontius Pilatus var landshövding i Judeen”. Räknat från Augustus död år 14 e.Kr. blir det 28/29 e.Kr.; några räknar från en tidigare samregering och får 26/27 e.Kr. Johannes nämner tre påskar under verksamheten, så 33 e.Kr. ger rum för en verksamhet på tre år eller mer, medan 30 e.Kr. kräver en kortare eller den tidigare räkningen. Vid den första påsken säger judarna: ”I fyrtiosex år har man byggt på detta tempel”. Herodes började ombyggnaden i sitt artonde år, 20/19 f.Kr., och fyrtiosex år senare är påsk 27/28 e.Kr., vilket passar 30 e.Kr.; läst som att helgedomen stod färdig för fyrtiosex år sedan, från dess fullbordan omkring 18 f.Kr., pekar orden på 29/30 e.Kr., vilket passar 33 e.Kr."
  nb:
    - "Evangeliene er enige om at Jesus døde på en fredag, dagen før en sabbat, ved påsketid, mens Pontius Pilatus styrte Judea (omkring 26–36), men de nevner ikke året. De fleste forskere velger mellom to datoer: fredag 7. april 30 e.Kr. og fredag 3. april 33 e.Kr. Tidlige forfattere og et mindretall gir andre: Tertullian daterer lidelsen til de to Geminis konsulat, 29 e.Kr., og Kassiodor til 31 e.Kr. Kartet bruker ca. 30 e.Kr. som et konvensjonelt punkt; 33 e.Kr. er også utbredt."
    - "Markus plasserer den siste nattverd på «den første dag av de usyrede brøds høitid, da de slaktet påskelammet», så i de tre første evangeliene dør Jesus 15. nisan, selve høytidsdagen. Johannes sier at de som førte Jesus fram, ikke gikk inn i borgen, «men kunde ete påske», og at ved dommen var det «beredelses-dagen i påsken»: hos Johannes dør han 14. nisan, da lammene ble slaktet. Noen forener de to ved kalendere som var i bruk side om side. Måneden begynte med synet av nymånen, som astronomien kan beregne. I Nature i 1983 fant C. J. Humphreys og W. G. Waddington at i årene 26–36 e.Kr. falt 14. nisan på en fredag i 30 og 33 e.Kr., og 15. nisan muligens i 34 e.Kr., noe de fant lite sannsynlig; med Johannes' dag og en måneformørkelse om kvelden 3. april 33 argumenterte de for den datoen. Andre beholder 30 e.Kr. på de samme tabellene."
    - "Lukas daterer begynnelsen av døperen Johannes' forkynnelse til «det femtende år av keiser Tiberius' regjering, mens Pontius Pilatus var landshøvding i Judea». Regnet fra Augustus' død i 14 e.Kr. er dette 28/29 e.Kr.; noen få regner fra et tidligere medregentskap og får 26/27 e.Kr. Johannes nevner tre påsker i virksomheten, så 33 e.Kr. gir rom for en virksomhet på tre år eller mer, mens 30 e.Kr. krever en kortere eller den tidligere regningen. Ved den første påsken sier jødene: «I seks og firti år har det vært bygget på dette tempel». Herodes begynte gjenoppbyggingen i sitt attende år, 20/19 f.Kr., og førtiseks år senere er påsken 27/28 e.Kr., som passer med 30 e.Kr.; lest som «bygget for førtiseks år siden», fra helligdommens ferdigstillelse omkring 18 f.Kr., peker ordene på 29/30 e.Kr., som passer med 33 e.Kr."
  tl:
    - "Nagkakasundo ang mga Ebanghelyo na namatay si Jesus noong Biyernes, bisperas ng isang sabbath, sa Paskua, habang si Poncio Pilato ang gobernador ng Judea (mga 26–36), ngunit hindi nila pinangalanan ang taon. Pumipili ang karamihan ng iskolar sa dalawang petsa: Biyernes 7 Abril 30 AD at Biyernes 3 Abril 33 AD. Nagbibigay ng iba ang mga sinaunang manunulat at isang minorya: itinatakda ni Tertuliano ang Pasyon sa konsulado ng dalawang Gemini, 29 AD, at ni Cassiodoro sa 31 AD. Ginagamit ng mapa ang mga 30 AD bilang kombensiyonal na punto; malawak ding pinaniniwalaan ang 33 AD."
    - "Ang Huling Hapunan kay Marcos ay sa “unang araw ng mga tinapay na walang lebadura, nang kanilang inihahain ang kordero ng paskua”, kaya sa unang tatlong Ebanghelyo, namatay si Jesus sa Nisan 15, mismong araw ng pista. Sa Juan, hindi pumasok sa Pretorio ang nagdala kay Jesus, “upang sila'y mangyaring makakain ng kordero ng paskua”, at sa paghatol ay “Paghahanda ng paskua”: namatay siya sa Nisan 14, nang katayin ang kordero. Pinagkakasundo ng ilan sa sabay na kalendaryo. Nagsisimula ang buwan sa pagkakita ng bagong gasuklay, makukuwenta ng astronomiya. Sa Nature (1983), nakita nina Humphreys at Waddington na sa 26–36 AD, Biyernes ang Nisan 14 noong 30 at 33 AD, at posibleng ang Nisan 15 noong 34 AD, na malabo raw; batay sa araw ni Juan at eklipse ng buwan sa gabi ng 3 Abril 33, ipinangatwiran nila ito. Sa parehong talahanayan, nananatili sa 30 AD ang iba."
    - "Itinatakda ni Lucas ang simula ng pangangaral ni Juan Bautista “nang ikalabinglimang taon nga ng paghahari ni Tiberio Cesar, na noo'y gobernador sa Judea si Poncio Pilato”. Mula sa pagkamatay ni Augusto noong 14 AD, 28/29 AD ito; may nagbibilang mula sa naunang magkasamang paghahari: 26/27 AD. Pinangalanan ni Juan ang tatlong Paskua sa ministeryo, kaya payag ang 33 AD sa ministeryong tatlong taon o higit, samantalang ang 30 AD ay nangangailangan ng mas maikli o naunang bilang. Sa unang Paskua sinabi ng mga Judio: “Apat na pu't anim na taon ang pagtatayo ng templong ito”. Sinimulan ni Herodes ang muling pagtatayo sa ika-18 taon niya, 20/19 BK, at 46 taon pagkatapos ay Paskua 27/28 AD, angkop sa 30 AD; kung babasahin bilang “itinayo 46 taon na ang nakararaan”, mula sa pagtatapos ng santuwaryo noong mga 18 BK, tumuturo ito sa 29/30 AD, angkop sa 33 AD."
  da:
    - "Evangelierne er enige om, at Jesus døde på en fredag, dagen før en sabbat, ved påske, mens Pontius Pilatus var landshøvding i Judæa (omkring 26–36), men de nævner ikke året. De fleste forskere vælger mellem to datoer: fredag den 7. april 30 e.Kr. og fredag den 3. april 33 e.Kr. Tidlige forfattere og et mindretal angiver andre: Tertullian dater lidelsen til de to Geminis konsulat, 29 e.Kr., og Cassiodorus til 31 e.Kr. Kortet bruger ca. 30 e.Kr. som et konventionelt punkt; 33 e.Kr. er også udbredt."
    - "Markus placerer den sidste nadver på »de usyrede Brøds første Dag, da man slagtede Paaskelammet«, så i de tre første evangelier dør Jesus den 15. Nisan, selve festdagen. Johannes siger, at dem, der førte Jesus, ikke gik ind i borgen, »for at de ikke skulde besmittes, men kunde spise Paaske«, og at det ved dommen var »Beredelsens Dag i Paasken«: hos Johannes dør han den 14. Nisan, da lammene blev slagtet. Nogle forener de to med sideløbende kalendere. Måneden begyndte med synet af det nye månesegl, som astronomien kan beregne. I Nature i 1983 fandt C. J. Humphreys og W. G. Waddington, at 14. Nisan i 26–36 e.Kr. faldt på en fredag i 30 og 33 e.Kr., og 15. Nisan muligvis i 34 e.Kr., hvilket de anså for usandsynligt; ud fra Johannes' dag og en måneformørkelse om aftenen den 3. april 33 argumenterede de for den dato. Andre, ud fra de samme tabeller, fastholder 30 e.Kr."
    - "Lukas dater begyndelsen af Johannes Døberens prædiken »i Kejser Tiberius's femtende Regeringsaar, da Pontius Pilatus var Landshøvding i Judæa«. Regnet fra Augustus' død i 14 e.Kr. er det 28/29 e.Kr.; nogle få regner fra et tidligere medregentskab og får 26/27 e.Kr. Johannes nævner tre påsker i virksomheden, så 33 e.Kr. tillader en virksomhed på tre år eller mere, mens 30 e.Kr. kræver en kortere eller den tidligere optælling. Ved den første påske siger jøderne: »I seks og fyrretyve Aar er der bygget paa dette Tempel«. Herodes begyndte genopbygningen i sit attende år, 20/19 f.Kr., og seksogfyrre år senere er påsken 27/28 e.Kr., hvilket passer med 30 e.Kr.; læses ordene som, at templet var bygget for seksogfyrre år siden, regnet fra helligdommens færdiggørelse omkring 18 f.Kr., peger de på 29/30 e.Kr., hvilket passer med 33 e.Kr."
  sr:
    - "Јеванђеља се слажу да је Исус умро у петак, уочи суботе, о Пасхи, док је Понтије Пилат управљао Јудејом (око 26–36), али не именују годину. Већина научника бира између два датума: петак, 7. априла 30. н. е. и петак, 3. априла 33. н. е. Рани писци и мањина дају друге: Тертулијан датира Страдање у конзулат двојице Гемина, 29. н. е., а Касиодор у 31. н. е. Карта користи око 30. н. е. као условну тачку; и 33. н. е. је широко прихваћена."
    - "Марко смешта Тајну вечеру „у први дан пресних хлебова, кад клаху пасху“, па у прва три јеванђеља Исус умире 15. нисана, на сам празнични дан. Јован каже да они који су довели Исуса нису хтели да уђу у судницу, „да би могли јести пасху“, и да је при пресуди био „петак уочи пасхе“: код Јована он умире 14. нисана, кад су јагњад клана. Неки их помирују календарима у упоредној употреби. Месец је почињао опажањем младог месеца, што астрономија може да израчуна. У часопису Nature 1983. К. Џ. Хамфрис и В. Г. Вадингтон нашли су да је у 26–36. н. е. 14. нисан падао у петак 30. и 33. н. е., а 15. нисан можда 34. н. е., што су сматрали мало вероватним; узимајући Јованов дан и помрачење Месеца увече 3. априла 33, заступали су тај датум. Други, на истим таблицама, задржавају 30. н. е."
    - "Лука датира почетак проповеди Јована Крститеља „У петнаестој години владања ћесара Тиверија, кад беше Понтије Пилат судија у Јудеји“. Рачунато од Августове смрти 14. н. е. то је 28/29. н. е.; неколицина рачуна од раније сувладавине и добија 26/27. н. е. Јован именује три Пасхе у служби, па 33. н. е. допушта службу од три године или више, док 30. н. е. тражи краћу или раније бројање. На првој Пасхи Јевреји кажу: „Четрдесет и шест година грађена је ова црква“. Ирод је почео обнову у својој осамнаестој години, 20/19. п. н. е., а четрдесет шест година касније је Пасха 27/28. н. е., што одговара 30. н. е.; прочитано као „саграђена пре четрдесет шест година“, од довршетка светиње око 18. п. н. е., речи указују на 29/30. н. е., што одговара 33. н. е."
  hu:
    - "Az evangéliumok egyetértenek abban, hogy Jézus pénteken halt meg, szombat előestéjén, a páska idején, amikor Poncius Pilátus kormányozta Júdeát (mintegy 26–36), de az évet nem nevezik meg. A legtöbb kutató két dátum között választ: Kr. u. 30. április 7., péntek és Kr. u. 33. április 3., péntek. A korai írók és egy kisebbség másokat adnak: Tertullianus a szenvedést a két Geminus consulságára, Kr. u. 29-re teszi, Cassiodorus Kr. u. 31-re. A térkép megállapodás szerint Kr. u. 30 körül használ; a Kr. u. 33-at is széles körben vallják."
    - "Márk az utolsó vacsorát úgy keltezi: „a kovásztalan kenyerek ünnepének első napján, mikor a húsvéti bárányt vágják vala”, így az első három evangéliumban Jézus Niszán 15-én, az ünnepnapon hal meg. János szerint akik Jézust vitték, nem mentek be a törvényházba, „hogy megehessék a husvétibárányt”, és az ítéletkor „Vala pedig a husvét péntekje”: Jánosnál Niszán 14-én hal meg, a bárányok leölésének napján. Egyesek párhuzamos naptárakkal egyeztetik. A hónap az újhold megpillantásával kezdődött; ezt a csillagászat kiszámítja. C. J. Humphreys és W. G. Waddington (Nature, 1983) megállapította, hogy Kr. u. 26–36 között Niszán 14. Kr. u. 30-ban és 33-ban volt péntek, Niszán 15. pedig esetleg Kr. u. 34-ben, amit valószínűtlennek véltek; János napját és a Kr. u. 33. április 3-i esti holdfogyatkozást véve mellette érveltek. Mások ugyanezen táblák alapján Kr. u. 30-nál maradnak."
    - "Lukács Keresztelő János fellépését „Tibérius császár uralkodásának tizenötödik esztendejében pedig, mikor Júdeában Ponczius Pilátus volt a helytartó” keltezi. Augusztus Kr. u. 14-es halálától számítva ez Kr. u. 28/29; néhányan korábbi társuralkodástól számítanak, és Kr. u. 26/27-et kapnak. János három páskát említ a szolgálatban, így Kr. u. 33 három vagy több évi szolgálatot enged, míg Kr. u. 30-hoz rövidebb vagy a korábbi számítás kell. Az első páskán a zsidók azt mondják: „Negyvenhat esztendeig épült ez a templom”. Heródes tizennyolcadik évében, Kr. e. 20/19-ben kezdte az újjáépítést, és negyvenhat évvel később Kr. u. 27/28 páskája van, ez Kr. u. 30-hoz illik; „negyvenhat éve épült” értelemben, a szentély Kr. e. 18 körüli befejezésétől, a szavak Kr. u. 29/30-ra mutatnak, ez Kr. u. 33-hoz illik."
  fi:
    - "Evankeliumit ovat yhtä mieltä siitä, että Jeesus kuoli perjantaina, sapatin aattona, pääsiäisenä, Pontius Pilatuksen hallitessa Juudeaa (noin 26–36), mutta ne eivät mainitse vuotta. Useimmat tutkijat valitsevat kahden ajankohdan väliltä: perjantai 7. huhtikuuta 30 jaa. ja perjantai 3. huhtikuuta 33 jaa. Varhaiset kirjoittajat ja vähemmistö esittävät muita: Tertullianus ajoittaa kärsimyksen kahden Geminuksen konsulikauteen, 29 jaa., ja Cassiodorus vuoteen 31 jaa. Kartta käyttää sovinnaisena kohtana noin vuotta 30 jaa.; myös 33 jaa. on laajalti kannatettu."
    - "Markus sijoittaa viimeisen ehtoollisen ”ensimmäisenä happamattoman leivän päivänä, kun pääsiäislammas teurastettiin”, joten synoptisissa evankeliumeissa Jeesus kuolee nisanin 15., itse juhlapäivänä. Johanneksen mukaan Jeesuksen tuojat eivät menneet tuomiosaliin, jotta ”saattaisivat syödä pääsiäislammasta”, ja tuomittaessa ”oli pääsiäisen valmistuspäivä”: hän kuolee nisanin 14., lampaiden teurastuspäivänä. Jotkut sovittavat ne yhteen rinnakkaisilla kalentereilla. Kuukausi alkoi uuden kuun sirpin havaitsemisesta, minkä tähtitiede voi laskea. Nature-lehdessä 1983 C. J. Humphreys ja W. G. Waddington havaitsivat nisanin 14. osuneen vuosina 26–36 jaa. perjantaille vuosina 30 ja 33 ja nisanin 15. ehkä vuonna 34, jota pitivät epätodennäköisenä; Johanneksen päivän ja 3. huhtikuuta 33 jaa. illan kuunpimennyksen perusteella he puolsivat tuota päivää. Toiset pitävät samoin taulukoin vuotta 30."
    - "Luukas ajoittaa Johannes Kastajan julistuksen alun ”viidentenätoista keisari Tiberiuksen hallitusvuotena, kun Pontius Pilatus oli Juudean maaherrana”. Augustuksen kuolemasta vuonna 14 jaa. laskien tämä on 28/29 jaa.; muutamat laskevat aiemmasta yhteishallinnosta ja saavat 26/27 jaa. Johannes mainitsee kolme pääsiäistä toiminnan aikana, joten 33 jaa. sallii kolmen vuoden tai pidemmän toiminnan, kun taas 30 jaa. vaatii lyhyemmän tai aiemman laskutavan. Ensimmäisenä pääsiäisenä juutalaiset sanovat: ”Neljäkymmentä kuusi vuotta on tätä temppeliä rakennettu”. Herodes aloitti jälleenrakennuksen 18. vuotenaan, 20/19 eaa., ja neljäkymmentäkuusi vuotta myöhemmin on pääsiäinen 27/28 jaa., mikä sopii vuoteen 30; luettuna ”rakennettu neljäkymmentäkuusi vuotta sitten”, pyhäkön valmistumisesta noin 18 eaa., sanat viittaavat vuoteen 29/30 jaa., mikä sopii vuoteen 33."
  vi:
    - "Các sách Phúc Âm đồng ý rằng Giê-su chết vào một ngày thứ Sáu, hôm trước ngày sa-bát, vào lễ Vượt qua, khi Bôn-xơ Phi-lát cai trị Giu-đê (khoảng năm 26–36), nhưng không nêu tên năm. Đa số học giả chọn giữa hai ngày: thứ Sáu 7 tháng 4 năm 30 và thứ Sáu 3 tháng 4 năm 33. Các tác giả xưa và một thiểu số đưa ra những ngày khác: Tertullian định niên đại cuộc Thương khó vào thời hai viên chấp chính Gemini, năm 29, và Cassiodorus vào năm 31. Bản đồ dùng khoảng năm 30 làm mốc quy ước; năm 33 cũng được nhiều người chủ trương."
    - "Mác đặt Bữa Tiệc Ly vào “ngày thứ nhất về lễ ăn bánh không men, là ngày giết chiên con làm lễ Vượt Qua”, nên trong ba sách Phúc Âm đầu, Giê-su chết vào ngày 15 tháng Ni-san, chính ngày lễ. Giăng nói những kẻ điệu Giê-su không vào trường án, “cho được ăn lễ Vượt Qua”, và lúc tuyên án thì “bấy giờ là ngày sắm sửa về lễ Vượt Qua”: theo Giăng, Ngài chết vào ngày 14 tháng Ni-san, khi chiên con bị giết. Có người dung hòa hai bên bằng những lịch được dùng song song. Tháng bắt đầu bằng việc thấy trăng non, điều thiên văn có thể tính. Trên tạp chí Nature năm 1983, C. J. Humphreys và W. G. Waddington thấy rằng trong năm 26–36, ngày 14 tháng Ni-san rơi vào thứ Sáu các năm 30 và 33, và ngày 15 tháng Ni-san có thể vào năm 34, điều họ cho là khó xảy ra; lấy ngày của Giăng và một lần nguyệt thực vào chiều 3 tháng 4 năm 33, họ lập luận cho ngày ấy. Những người khác, trên cùng các bảng, giữ năm 30."
    - "Lu-ca định niên đại việc Giăng Báp-tít bắt đầu rao giảng “Năm thứ mười lăm đời Sê-sa Ti-be-rơ, khi Bôn-xơ Phi-lát làm quan tổng đốc xứ Giu-đê”. Tính từ cái chết của Au-gút-tơ năm 14, đó là năm 28/29; một số ít tính từ thời đồng nhiếp chính sớm hơn và được năm 26/27. Giăng nêu ba lễ Vượt qua trong chức vụ, nên năm 33 cho phép một chức vụ ba năm hoặc hơn, còn năm 30 cần một chức vụ ngắn hơn hoặc cách tính sớm hơn. Ở lễ Vượt qua đầu tiên, người Do Thái nói: “Người ta xây đền thờ nầy mất bốn mươi sáu năm”. Hê-rốt bắt đầu xây lại vào năm thứ mười tám đời mình, 20/19 TCN, và bốn mươi sáu năm sau là lễ Vượt qua năm 27/28, hợp với năm 30; nếu đọc là “đã xây bốn mươi sáu năm trước”, tính từ khi đền thánh hoàn thành khoảng 18 TCN, lời ấy chỉ năm 29/30, hợp với năm 33."
  ro:
    - "Evangheliile sunt de acord că Isus a murit într-o vineri, în ajunul unui sabat, de Paști, în timp ce Pontiu Pilat guverna Iudeea (circa 26–36), dar nu numesc anul. Cei mai mulți cercetători aleg între două date: vineri, 7 aprilie 30 d.Hr., și vineri, 3 aprilie 33 d.Hr. Scriitorii vechi și o minoritate dau altele: Tertulian datează Patima în consulatul celor doi Gemini, 29 d.Hr., iar Cassiodor în 31 d.Hr. Harta folosește circa 30 d.Hr. ca punct convențional; se susține pe larg și 33 d.Hr."
    - "Marcu așază Cina cea de Taină în „ziua cea dintâiu a azimilor, când jertfiau paștile”, deci în primele trei Evanghelii Isus moare la 15 Nisan, chiar în ziua sărbătorii. Ioan spune că cei care l-au adus pe Isus nu au intrat în divan, „ca să mănânce paștele”, și că la osândire „erà vinerea paștelor”: la Ioan el moare la 14 Nisan, când se junghiau mieii. Unii le împacă prin calendare folosite în paralel. Luna începea cu zărirea noii semiluni, care poate fi calculată astronomic. În Nature, în 1983, C. J. Humphreys și W. G. Waddington au găsit că în 26–36 d.Hr. 14 Nisan a căzut într-o vineri în 30 și 33 d.Hr., iar 15 Nisan poate în 34, ceea ce au socotit puțin probabil; luând ziua lui Ioan și o eclipsă de lună în seara zilei de 3 aprilie 33, ei au argumentat pentru acea dată. Alții, pe aceleași tabele, rămân la 30 d.Hr."
    - "Luca datează începutul propovăduirii lui Ioan Botezătorul „în anul al cincisprezecelea al împărăției lui Tiberie Chesarului domnind Pilat din Pont în Iudeea”. Socotit de la moartea lui Augustus, în 14 d.Hr., este 28/29 d.Hr.; unii numără de la o coregență anterioară și obțin 26/27. Ioan numește trei Paști în timpul slujirii, deci 33 d.Hr. îngăduie o slujire de trei ani sau mai mult, iar 30 d.Hr. cere una mai scurtă sau numărătoarea anterioară. La primul Paști, iudeii spun: „în patruzeci și șase de ani, s’a zidit biserica aceasta”. Irod a început reclădirea în anul al optsprezecelea al său, 20/19 î.Hr.; patruzeci și șase de ani mai târziu înseamnă Paștile 27/28 d.Hr., potrivit cu 30 d.Hr.; citite în sensul că a fost zidit cu patruzeci și șase de ani în urmă, de la isprăvirea sanctuarului pe la 18 î.Hr., cuvintele indică 29/30 d.Hr., potrivit cu 33 d.Hr."
  bg:
    - "Евангелията са съгласни, че Исус умрял в петък, в навечерието на събота, по време на Пасха, когато Понтий Пилат управлявал Юдея (около 26–36 г.), но не назовават годината. Повечето учени избират между две дати: петък, 7 април 30 г. н.е., и петък, 3 април 33 г. н.е. Ранни автори и малцинство дават други: Тертулиан датира Страданията в консулството на двамата Гемини, 29 г. н.е., а Касиодор — в 31 г. н.е. Картата използва около 30 г. н.е. като условна точка; 33 г. н.е. също е широко приета."
    - "Марко поставя Тайната вечеря „в първия ден на безквасните хлебове, когато колеха жертви за пасхата“, така че в първите три Евангелия Исус умира на 15 нисан, в самия празник. Йоан казва, че онези, които довели Исус, не влезли в преторията, „да ядат пасхата“, и че при присъдата „Беше же петък на пасхата“: при Йоан той умира на 14 нисан, когато се колели агнетата. Някои съгласуват двете с паралелно използвани календари. Месецът започвал с наблюдаване на новия сърп, което астрономията може да изчисли. В Nature през 1983 г. К. Дж. Хъмфрис и У. Г. Уадингтън установили, че в 26–36 г. 14 нисан се падал в петък през 30 и 33 г., а 15 нисан — евентуално през 34 г., което смятали за малко вероятно; приемайки деня на Йоан и лунното затъмнение вечерта на 3 април 33 г., те защитили тази дата. Други, по същите таблици, държат на 30 г."
    - "Лука датира началото на проповедта на Йоан Кръстител „в петнадесетата година на владението на Тиверия Кесаря, когато Понтийски Пилат бе управител на Юдея“. Броено от смъртта на Август през 14 г. н.е., това е 28/29 г.; някои броят от по-ранно съвладение и получават 26/27 г. Йоан назовава три Пасхи в служението, така че 33 г. позволява служение от три или повече години, а 30 г. изисква по-кратко или по-ранното броене. На първата Пасха юдеите казват: „За четиридесет и шест години е съграден този храм“. Ирод започнал преустройството в осемнадесетата си година, 20/19 г. пр.н.е., и четиридесет и шест години по-късно е Пасха на 27/28 г., което пасва на 30 г.; прочетени като „съграден преди четиридесет и шест години“, от завършването на светилището около 18 г. пр.н.е., думите сочат 29/30 г., което пасва на 33 г."
