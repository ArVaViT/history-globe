id: where-was-the-cave-of-adullam
question:
  en: "Where was the cave of Adullam?"
  ru: "Где находилась пещера Одолламская?"
  uk: "Де була печера Одолам?"
  es: "¿Dónde estaba la cueva de Adulam?"
  pt: "Onde ficava a caverna de Adulão?"
  de: "Wo lag die Höhle Adullam?"
  fr: "Où se trouvait la caverne d’Adullam ?"
  pl: "Gdzie leżała jaskinia Adullam?"
  it: "Dov’era la grotta di Adullam?"
  cs: "Kde byla jeskyně Adulam?"
  nl: "Waar lag de grot van Adullam?"
  sv: "Var låg Adullams grotta?"
  nb: "Hvor lå Adullam-hulen?"
  tl: "Nasaan ang yungib ng Adullam?"
  da: "Hvor lå Adullams hule?"
  sr: "Где је била пећина Одоламска?"
answer:
  en:
    - "The cave of Adullam was at or near the town of Adullam in the Shephelah, the foothills of Judah, about 26 km south-west of Jerusalem and 20 km west-south-west of Bethlehem in a straight line, just above the southern end of the valley of Elah, where David had fought Goliath. The town is usually placed at Khirbet esh-Sheikh Madhkur, a hilltop with rock-cut caves and cisterns, where the map point stands; the old name is thought to survive in the ruin of Id el-Miyeh at its foot. No inscription has confirmed the identification, and the Bible does not say which of the caves David used."
    - "David came here fleeing Saul, after feigning madness before the king of Gath, 16 km away: he “escaped to the cave Adullam”, his family came down to him, and “every one that was in distress, and every one that was in debt, and every one that was discontented, gathered themselves unto him”, about four hundred men. Later, “in the harvest time”, three of his mighty men came to him “unto the cave of Adullam” while the Philistines held Bethlehem; when he longed for water from its well, they broke through and brought it, and he “poured it out unto the LORD”. The same passages say that “David was then in an hold”, and the prophet Gad tells him, “Abide not in the hold”; whether that is the cave itself or another stronghold is disputed. Psalms 57 and 142 (56 and 141 in the Synodal Bible) are headed as prayers “in the cave”; tradition links them to Adullam or to En-gedi."
    - "Adullam was a town long before and after David: Judah's friend Hirah was an Adullamite, Rehoboam fortified it, Micah names it “Adullam the glory of Israel”, and men of Judah lived there again after the exile; Judas Maccabeus kept the sabbath in the city of Odollam. In the fourth century AD Eusebius knew it as a very large village ten miles east of Eleutheropolis, Beth Guvrin. Later pilgrims were shown another “cave of Adullam”, the great Khareitun cave near Tekoa, in the wilderness south-east of Bethlehem, a tradition probably owed to the Crusaders, but the biblical town lies in the lowland."
  ru:
    - "Пещера Одолламская находилась в городе Одоллам или рядом с ним, в Шефеле — предгорьях Иудеи, примерно в 26 км к юго-западу от Иерусалима и в 20 км к западо-юго-западу от Вифлеема по прямой, чуть выше южного конца долины дуба, где Давид сразился с Голиафом. Город обычно помещают на Хирбет-эш-Шейх-Мадкур — вершине холма с высеченными в скале пещерами и цистернами, где стоит точка карты; старое имя, как думают, сохранилось в названии развалин Ид-эль-Мие у его подножия. Надпись этого пока не подтвердила, и Библия не говорит, в какой из пещер укрывался Давид."
    - "Давид пришёл сюда, спасаясь от Саула, после того как притворился безумным перед царём Гефа, в 16 км отсюда: он «убежал в пещеру Одолламскую», к нему пришёл весь дом его отца, и «собрались к нему все притесненные и все должники и все огорченные душею» — около четырёхсот человек. Позже «во время жатвы» трое из его храбрых пришли к Давиду «в пещеру Одоллам», когда филистимляне стояли в Вифлееме; когда он захотел воды из вифлеемского колодезя, они пробились и принесли её, и он «вылил ее во славу Господа». Те же рассказы говорят, что Давид был «в укрепленном месте», а пророк Гад велит ему: «не оставайся в этом убежище»; то ли это сама пещера, то ли другая твердыня, — спорно. Псалмы 56 и 141 (57 и 142 в еврейском счёте) надписаны как молитвы Давида «в пещере»; предание связывает их с Одолламом или с Ен-Гадди."
    - "Одоллам был городом задолго до Давида и после него: друг Иуды Хира был Одолламитянин, Ровоам укрепил город, у Михея сказано: «он пройдет до Одоллама, славы Израиля», а после плена здесь снова жили люди Иудины; Иуда Маккавей справил субботу в городе Одоллам. В IV веке Евсевий знал его как очень большое селение в десяти милях к востоку от Елевферополя, Бейт-Гуврина. Позднейшим паломникам показывали другую «пещеру Одолламскую» — большую пещеру Харейтун близ Фекои, в пустыне к юго-востоку от Вифлеема (предание, вероятно, идёт от крестоносцев), но библейский город лежит в низменности."
  uk:
    - "Печера Одолам була в місті Одолам або поблизу нього, у Шефелі, передгір'ях Юди, приблизно за 26 км на південний захід від Єрусалима і за 20 км на захід-південний захід від Вифлеєма по прямій, трохи вище південного кінця долини Іла, де Давид бився з Голіятом. Місто зазвичай розміщують у Хірбет-еш-Шейх-Мадкурі, на вершині пагорба з вирубаними в скелі печерами та цистернами, де стоїть точка на мапі; стара назва, як вважають, збереглася в руїні Ід-ель-Мія біля його підніжжя. Жоден напис не підтвердив ототожнення, а Біблія не каже, якою саме з печер користувався Давид."
    - "Давид прийшов сюди, втікаючи від Саула, після того як вдавав божевільного перед царем Гата, за 16 км: він «утїк у Адолламську печеру в горах», до нього прийшла його родина, і «скупились коло його всякі злиденники й задовжені, й всякі невдоволені люде», близько чотирьохсот чоловік. Пізніше, «в часї жнив», троє з його силачів прийшли до нього «в печеру Одоллам», коли філістимляни тримали Вифлеєм; коли він запрагнув води з його колодязя, вони прорвалися й принесли її, а він «вилив на жертву в славу Господеві». Ті самі уривки кажуть, що «Давид був тодї там в утвердженому місцї», а пророк Гад каже йому: «Не сиди дальш у сїй рощілинї»; чи це сама печера, чи інша твердиня — спірно. Псалми 57 і 142 (56 і 141 в Синодальній Біблії) мають заголовки молитов «в печері»; переказ пов'язує їх з Одоламом або з Ен-Геді."
    - "Одолам був містом задовго до Давида й після нього: друг Юди Хіра був одоламитянином, Ровоам укріпив його, Міха називає його «Оддоламу, — сієї слави Ізрайлевої», а юдеї знову жили там після вигнання; Юда Макавей святкував суботу в місті Одолам. У IV ст. н. е. Євсевій знав його як дуже велике село за десять миль на схід від Елевтерополя, Бейт-Гуврина. Пізніші паломники бачили іншу «печеру Одолам» — велику печеру Харейтун біля Текої, в пустелі на південний схід від Вифлеєма, переказ, імовірно, що походить від хрестоносців, але біблійне місто лежить у низині."
  es:
    - "La cueva de Adulam estaba en la ciudad de Adulam o cerca de ella, en la Sefelá, las estribaciones de Judá, a unos 26 km al suroeste de Jerusalén y a 20 km al oesudoeste de Belén en línea recta, justo sobre el extremo meridional del valle de Ela, donde David había luchado contra Goliat. La ciudad se sitúa por lo común en Khirbet esh-Sheikh Madhkur, una cima con cuevas y cisternas excavadas en la roca, donde está el punto del mapa; se piensa que el antiguo nombre sobrevive en la ruina de Id el-Miyeh, a su pie. Ninguna inscripción ha confirmado la identificación, y la Biblia no dice cuál de las cuevas usó David."
    - "David llegó aquí huyendo de Saúl, tras fingirse loco ante el rey de Gat, a 16 km: «escapóse á la cueva de Adullam», su familia bajó a verlo, y «juntáronse con él todos los afligidos, y todo el que estaba adeudado, y todos los que se hallaban en amargura de espíritu», unos cuatrocientos hombres. Más tarde, «en tiempo de la siega», tres de sus valientes fueron a él «á la cueva de Adullam» mientras los filisteos ocupaban Belén; cuando él anheló agua de su pozo, la atravesaron y se la trajeron, y él «derramóla á Jehová». Los mismos pasajes dicen que «David entonces estaba en la fortaleza», y el profeta Gad le dice: «No te estés en esta fortaleza»; si se trata de la propia cueva o de otra plaza fuerte se discute. Los Salmos 57 y 142 (56 y 141 en la Biblia sinodal) llevan el título de oraciones hechas «en la cueva»; la tradición los vincula con Adulam o con En-gadi."
    - "Adulam fue una ciudad mucho antes y después de David: Hira, amigo de Judá, era adulamita, Roboam la fortificó, Miqueas dice que «la gloria de Israel vendrá hasta Adullam», y hombres de Judá vivieron de nuevo allí tras el destierro; Judas Macabeo guardó el sábado en la ciudad de Odollam. En el siglo IV d. C., Eusebio la conocía como una aldea muy grande a diez millas al este de Eleuterópolis, Beth Guvrin. Más tarde se mostró a los peregrinos otra «cueva de Adulam», la gran cueva de Khareitun, cerca de Tecoa, en el desierto al sureste de Belén, una tradición debida probablemente a los cruzados, pero la ciudad bíblica está en la tierra baja."
  pt:
    - "A caverna de Adulão ficava na cidade de Adulão, ou perto dela, na Sefelá, o sopé das colinas de Judá, a cerca de 26 km a sudoeste de Jerusalém e 20 km a oés-sudoeste de Belém em linha reta, logo acima da extremidade sul do vale de Elá, onde Davi lutou contra Golias. A cidade é geralmente situada em Khirbet esh-Sheikh Madhkur, uma colina com cavernas escavadas na rocha e cisternas, onde está o ponto do mapa; pensa-se que o antigo nome sobrevive na ruína de Id el-Miyeh, ao seu pé. Nenhuma inscrição confirmou a identificação, e a Bíblia não diz qual das cavernas Davi usou."
    - "Davi veio para cá fugindo de Saul, depois de fingir loucura diante do rei de Gate, a 16 km: “escapou para a caverna de Adulão”, sua família desceu até ele, e “Todos os que estavam em aperto, todos os que estavam endividados e todos os amargurados de espírito se reuniram a ele”, cerca de quatrocentos homens. Mais tarde, “na época da colheita”, três de seus valentes vieram a ele “à caverna de Adulão” enquanto os filisteus ocupavam Belém; quando ele sentiu falta da água do seu poço, eles romperam as linhas e a trouxeram, e ele “a derramou ao SENHOR”. As mesmas passagens dizem que “Davi estava então na fortaleza”, e o profeta Gade lhe diz: “Não fique na fortaleza”; se essa é a própria caverna ou outro reduto é disputado. Os Salmos 57 e 142 (56 e 141 na Bíblia Sinodal) trazem títulos que os apresentam como orações na caverna; a tradição os liga a Adulão ou a En-Gedi."
    - "Adulão era uma cidade muito antes e muito depois de Davi: Hira, amigo de Judá, era adulamita, Roboão a fortificou, Miqueias diz “A glória de Israel chegará até Adulão”, e homens de Judá viveram ali de novo depois do exílio; Judas Macabeu guardou o sábado na cidade de Odolam. No século IV d.C., Eusébio a conhecia como uma aldeia muito grande a dez milhas a leste de Eleuterópolis, Beth Guvrin. Peregrinos posteriores foram levados a outra “caverna de Adulão”, a grande caverna de Khareitun, perto de Tecoa, no deserto a sudeste de Belém, uma tradição provavelmente devida aos cruzados, mas a cidade bíblica fica na planície baixa."
  de:
    - "Die Höhle Adullam lag bei oder nahe der Stadt Adullam in der Schefela, dem Vorland Judas, etwa 26 km südwestlich von Jerusalem und in der Luftlinie 20 km westsüdwestlich von Bethlehem, knapp oberhalb des südlichen Endes des Elatals, wo David gegen Goliat gekämpft hatte. Die Stadt wird meist bei Khirbet esh-Sheikh Madhkur angesetzt, einem Hügel mit Felshöhlen und Zisternen, wo der Kartenpunkt steht; der alte Name soll in der Ruine Id el-Miyeh an seinem Fuß fortleben. Keine Inschrift hat die Gleichsetzung bestätigt, und die Bibel sagt nicht, welche der Höhlen David nutzte."
    - "David kam fliehend vor Saul hierher, nachdem er in Gat, 16 km entfernt, sich wahnsinnig gestellt hatte: Er „entrann in die Höhle Adullam“, seine Familie kam hinab, und „es versammelten sich zu ihm allerlei Männer, die in Not und Schulden und betrübten Herzens waren“, etwa vierhundert. Später kamen „in der Ernte“ drei seiner Helden „in die Höhle Adullam“, während die Philister Bethlehem hielten; sie brachen durch und holten das ersehnte Wasser aus dessen Brunnen, und er „goß es aus dem HERRN“. Dieselben Stellen sagen, „David aber war dazumal an sicherem Ort“, und der Prophet Gad rät: „Bleibe nicht verborgen“; ob die Höhle oder eine andere Feste gemeint ist, ist umstritten. Psalm 57 und 142 (56, 141 in der Synodalbibel) tragen die Überschriften „da er vor Saul floh in die Höhle“ und „da er in der Höhle war“; die Überlieferung verbindet sie mit Adullam oder En-Gedi."
    - "Adullam war lange vor und nach David eine Stadt: Judas Freund Hira war ein Adullamiter, Rehabeam befestigte sie, bei Micha heißt es: „die Herrlichkeit Israels soll kommen bis gen Adullam“, und nach dem Exil lebten wieder Männer aus Juda dort; Judas Makkabäus hielt in der Stadt Odollam den Sabbat. Im 4. Jahrhundert n. Chr. kannte Eusebius es als sehr großes Dorf zehn Meilen östlich von Eleutheropolis, Bet Guvrin. Spätere Pilger bekamen eine andere „Höhle Adullam“ gezeigt, die große Höhle von Chareitun bei Tekoa in der Wüste südöstlich von Bethlehem, eine Überlieferung, die wohl den Kreuzfahrern zu verdanken ist, doch die biblische Stadt liegt im Flachland."
  fr:
    - "La caverne d’Adullam se trouvait dans la ville d’Adullam ou près d’elle, dans la Shéphéla, les contreforts de Juda, à environ 26 km au sud-ouest de Jérusalem et à 20 km à l’ouest-sud-ouest de Bethléem à vol d’oiseau, juste au-dessus de l’extrémité sud de la vallée d’Éla, où David avait combattu Goliath. La ville est généralement placée à Khirbet esh-Sheikh Madhkur, une colline couronnée de grottes et de citernes creusées dans le roc, où se trouve le point de la carte ; l’ancien nom survivrait dans la ruine d’Id el-Miyeh, à son pied. Aucune inscription n’a confirmé l’identification, et la Bible ne dit pas laquelle des cavernes David utilisa."
    - "David y vint, fuyant Saül, après avoir feint la folie devant le roi de Gath, à 16 km : il « se sauva dans la caverne d’Adullam », sa famille le rejoignit, et « Tous ceux qui se trouvaient dans la détresse, qui avaient des créanciers, ou qui étaient mécontents, se rassemblèrent auprès de lui », quatre cents hommes. Puis, « au temps de la moisson », trois de ses vaillants vinrent à lui « dans la caverne d’Adullam », les Philistins tenant Bethléem ; il désira l’eau de sa citerne, ils forcèrent le passage pour l’apporter, et il « la répandit devant l’Éternel ». Les mêmes passages disent « David était alors dans la forteresse », et Gad lui dit : « Ne reste pas dans la forteresse » : caverne ou autre place forte, la question est débattue. Les Psaumes 57 et 142 (56 et 141 dans la Bible synodale) sont intitulés prières « dans la caverne », rattachées par la tradition à Adullam ou à En-Guédi."
    - "Adullam était une ville bien avant et bien après David : l’ami de Juda, Hira, était un Adullamite, Roboam la fortifia, Michée la nomme : « La gloire d’Israël s’en ira jusqu’à Adullam », et des hommes de Juda y habitèrent de nouveau après l’exil ; Judas Maccabée observa le sabbat dans la ville d’Odollam. Au IVe siècle apr. J.-C., Eusèbe la connaissait comme un très grand village à dix milles à l’est d’Éleuthéropolis, Beth Guvrin. Des pèlerins plus tardifs se firent montrer une autre « caverne d’Adullam », la grande grotte de Khareitun près de Tekoa, dans le désert au sud-est de Bethléem, tradition due probablement aux croisés, mais la ville biblique se trouve dans la plaine."
  pl:
    - "Jaskinia Adullam znajdowała się w mieście Adullam lub w jego pobliżu, w Szefeli, u podnóża wzgórz Judy, około 26 km na południowy zachód od Jerozolimy i 20 km na zachód-południowy zachód od Betlejem w linii prostej, tuż nad południowym końcem doliny Ela, gdzie Dawid walczył z Goliatem. Miasto umieszcza się zwykle w Khirbet esh-Sheikh Madhkur, na wzgórzu z wykutymi w skale jaskiniami i cysternami, gdzie stoi punkt na mapie; stara nazwa ma przetrwać w ruinie Id el-Miyeh u jego stóp. Żaden napis nie potwierdził utożsamienia, a Biblia nie mówi, której jaskini używał Dawid."
    - "Dawid przybył tu, uciekając przed Saulem, po udawaniu szaleńca przed królem Gat, oddalonego o 16 km: „uszedł do jaskini Adullam”, zeszła do niego rodzina, i „zebrali się do niego wszyscy, którzy byli utrapieni, i wszyscy, którzy byli dłużni, i wszyscy, którzykolwiek byli w gorzkości serca”, około czterystu mężów. Później trzej z jego mocarzy „przyszli we żniwa do Dawida, do jaskini Odollam”, gdy Filistyni zajmowali Betlejem; gdy zapragnął wody z jego studni, przedarli się i przynieśli ją, a on „wylał przed Panem”. Te same fragmenty mówią, że „Dawid na ten czas był na miejscu obronnem”, a prorok Gad mówi mu: „Nie mieszkaj więcej na tym zamku”; czy chodzi o samą jaskinię, czy o inną twierdzę, jest sporne. Psalmy 57 i 142 (56 i 141 w Biblii synodalnej) mają nagłówki jako modlitwy „gdy był w jaskini”; tradycja wiąże je z Adullam albo z En-Gedi."
    - "Adullam było miastem na długo przed Dawidem i po nim: przyjaciel Judy Chira był Adullamitą, Roboam je ufortyfikował, Mika wymienia je w słowach „aż do Odollam, i aż do chwały Izraelskiej”, a po wygnaniu znów mieszkali tam mężowie z Judy; Juda Machabeusz obchodził szabat w mieście Odollam. W IV wieku n.e. Euzebiusz znał je jako bardzo dużą wieś dziesięć mil na wschód od Eleutheropolis, Bet Guvrin. Późniejszym pielgrzymom pokazywano inną „jaskinię Adullam”, wielką jaskinię Khareitun koło Tekoa, na pustyni na południowy wschód od Betlejem, tradycję zawdzięczaną zapewne krzyżowcom, ale biblijne miasto leży na nizinie."
  it:
    - "La grotta di Adullam si trovava presso la città di Adullam o in essa, nella Sefela, le pendici collinari di Giuda, a circa 26 km a sud-ovest di Gerusalemme e 20 km a ovest-sud-ovest di Betlemme in linea d’aria, subito sopra l’estremità meridionale della valle di Ela, dove Davide aveva combattuto Golia. La città si colloca di solito a Khirbet esh-Sheikh Madhkur, un’altura con grotte e cisterne scavate nella roccia, dove si trova il punto della mappa; si pensa che l’antico nome sopravviva nella rovina di Id el-Miyeh ai suoi piedi. Nessuna iscrizione ha confermato l’identificazione, e la Bibbia non dice quale delle grotte Davide usasse."
    - "Davide vi giunse in fuga da Saul, dopo aver finto la pazzia davanti al re di Gat, a 16 km: «si rifugiò nella spelonca di Adullam», la famiglia scese da lui, e «tutti quelli ch’erano in angustie, che avean dei debiti o che erano scontenti, si radunaron presso di lui», circa quattrocento uomini. Più tardi, «al tempo della mietitura», tre dei suoi prodi lo raggiunsero «nella spelonca di Adullam» mentre i Filistei tenevano Betlemme; quando desiderò l’acqua del suo pozzo, essi si aprirono un varco e gliela portarono, ed egli «la sparse davanti all’Eterno». Gli stessi passi dicono «Davide era allora nella fortezza», e il profeta Gad gli dice: «Non star più in questa fortezza»; se sia la grotta stessa o un’altra roccaforte è discusso. I Salmi 57 e 142 (56 e 141 nella Bibbia sinodale) sono intitolati preghiere «nella spelonca»; la tradizione li lega ad Adullam o a En-Gedi."
    - "Adullam era una città molto prima e molto dopo Davide: l’amico di Giuda, Chira, era un Adullamita, Roboamo la fortificò, Michea la nomina: «fino ad Adullam andrà la gloria d’Israele», e uomini di Giuda vi abitarono di nuovo dopo l’esilio; Giuda Maccabeo osservò il sabato nella città di Odollam. Nel IV secolo d.C. Eusebio la conosceva come un grandissimo villaggio a dieci miglia a est di Eleuteropoli, Beth Guvrin. Pellegrini posteriori si sentirono mostrare un’altra «grotta di Adullam», la grande grotta di Khareitun presso Tekoa, nel deserto a sud-est di Betlemme, una tradizione probabilmente dovuta ai Crociati, ma la città biblica si trova nella pianura."
  cs:
    - "Jeskyně Adulam byla v městě Adulam nebo poblíž něj v Šefele, předhůří Judy, asi 26 km jihozápadně od Jeruzaléma a 20 km západojihozápadně od Betléma vzdušnou čarou, těsně nad jižním koncem údolí Éla, kde David bojoval s Goliášem. Město se obvykle klade do Chirbet eš-Šejch Madhkúr, vrcholu s jeskyněmi a cisternami vytesanými ve skále, kde stojí bod na mapě; staré jméno prý přežívá ve zřícenině Id el-Míja na jeho úpatí. Žádný nápis ztotožnění nepotvrdil a Bible neříká, kterou z jeskyní David užil."
    - "David sem přišel na útěku před Saulem, poté, co předstíral šílenství před králem z Gatu, 16 km daleko: „skryl se v jeskyni Adulam“, jeho rodina k němu přišla a „shromáždili se k němu, kteřížkoli byli v ssoužení, a kteřížkoli byli zadlužilí, a kteřížkoli byli v hořkosti ducha“, asi čtyři sta mužů. Později, „ve žni“, k němu přišli tři z jeho udatných „do jeskyně Adulam“, zatímco Pelištejci drželi Betlém; když zatoužil po vodě z jeho studny, probili se a přinesli ji a on ji „obětoval Hospodinu“. Táž místa říkají, že „David tehdáž byl v pevnosti své“, a prorok Gád mu říká: „Nebývejž déle na tom hradě“; zda je to samotná jeskyně, nebo jiná pevnost, je sporné. Žalmy 57 a 142 (56 a 141 v synodální Bibli) mají nadpis, že David „utekl před Saulem do jeskyně“ a „byl v jeskyni“; tradice je spojuje s Adulamem nebo s En-gedi."
    - "Adulam bylo městem dlouho před Davidem i po něm: Judův přítel Chíra byl Adulamský, Rechabeám je opevnil, Micheáš praví, že až „do Adulam přijde, k slávě Izraelské“, a muži Judští tam po vyhnanství opět bydleli; Juda Makabejský zachoval sobotu v městě Odollam. Ve 4. století n. l. je Eusebios znal jako velmi velkou vesnici deset mil východně od Eleutheropole, Bét Guvrinu. Pozdějším poutníkům se ukazovala jiná „jeskyně Adulam“, velká jeskyně Chareitún poblíž Tekoi, na poušti jihovýchodně od Betléma, tradice patrně dlužná křižákům, ale biblické město leží v nížině."
  nl:
    - "De grot van Adullam lag bij of nabij de stad Adullam in de Sefela, de uitlopers van Juda, hemelsbreed ongeveer 26 km ten zuidwesten van Jeruzalem en 20 km west-zuidwestelijk van Bethlehem, net boven het zuidelijke einde van de vallei van Ela, waar David met Goliat had gestreden. De stad wordt gewoonlijk geplaatst bij Khirbet esh-Sheikh Madhkur, een heuveltop met in de rots uitgehouwen grotten en cisternes, waar het punt op de kaart staat; de oude naam zou voortleven in de ruïne van Id el-Miyeh aan de voet ervan. Geen inscriptie heeft de identificatie bevestigd, en de Bijbel zegt niet welke van de grotten David gebruikte."
    - "David kwam hier op de vlucht voor Saul, na zijn gespeelde waanzin voor de koning van Gat, 16 km verderop: hij “ontkwam in de spelonk van Adullam”, zijn familie kwam, en “tot hem vergaderde alle man, die benauwd was, en alle man, die een schuldeiser had, en alle man, wiens ziel bitterlijk bedroefd was”, zo'n vierhonderd man. Later kwamen drie helden “in den oogst” tot hem “in de spelonk van Adullam” terwijl de Filistijnen Bethlehem hielden; toen hij naar water uit Bethlehems put verlangde, braken zij door en brachten het, en hij “goot het uit voor den HEERE”. Daar staat ook: “David was toen in een vesting”, en de profeet Gad zegt: “Blijf in de vesting niet”; of dit de grot zelf is of een andere vesting, is omstreden. Psalm 57 en 142 (56 en 141 in de Synodale Bijbel) zijn getiteld als gebed “in de spelonk”; de overlevering verbindt ze met Adullam of En-Gedi."
    - "Adullam was al lang voor en na David een stad: Juda's vriend Chira was een Adullamiet, Rehabeam versterkte het, Micha noemt het “tot aan Adullam, tot aan de heerlijkheid Israels”, en mannen van Juda woonden er na de ballingschap opnieuw; Judas Makkabeüs hield de sabbat in de stad Odollam. In de vierde eeuw n.Chr. kende Eusebius het als een zeer groot dorp tien mijl ten oosten van Eleutheropolis, Beth Guvrin. Latere pelgrims kregen een andere “grot van Adullam” te zien, de grote Khareitun-grot bij Tekoa, in de woestijn ten zuidoosten van Bethlehem, een overlevering die waarschijnlijk aan de kruisvaarders te danken is, maar de bijbelse stad ligt in het laagland."
  sv:
    - "Adullams grotta låg vid eller nära staden Adullam i Shefela, Judas utlöpare, omkring 26 km sydväst om Jerusalem och 20 km väst-sydväst om Betlehem i fågelvägen, strax ovanför södra änden av Elas dal, där David hade stridit mot Goljat. Staden förläggs vanligen till Khirbet esh-Sheikh Madhkur, en bergstopp med uthuggna grottor och cisterner, där kartpunkten står; det gamla namnet tros leva kvar i ruinen Id el-Miyeh vid dess fot. Ingen inskription har bekräftat identifieringen, och Bibeln säger inte vilken av grottorna David använde."
    - "David kom hit på flykt undan Saul, efter att ha låtsats vara vansinnig inför kungen av Gat, 16 km bort: han ”flydde undan till Adullams grotta”, hans släkt kom ned till honom, och ”alla slags män som voro i något trångmål, alla som ansattes av fordringsägare och alla missnöjda” församlade sig kring honom, ca 400 man. Senare, ”vid skördetiden”, kom tre av hans hjältar till honom ”vid Adullams grotta” medan filistéerna höll Betlehem; när han längtade efter vatten från brunnen, bröt de sig igenom och hämtade det, och han ”göt ut det såsom ett drickoffer åt HERREN”. Samma ställen säger att ”David var då på borgen”, och Gad säger till honom: ”Du skall icke stanna här på borgen”; om det är grottan eller en annan fästning är omstritt. Psaltaren 57 och 142 (56 och 141 i den synodala bibeln) har rubriker om bönen i grottan; traditionen förbinder dem med Adullam eller En-Gedi."
    - "Adullam var en stad långt före och efter David: Judas vän Hira var en adullamit, Rehabeam befäste den, Mika nämner den (”Ända till Adullam skall Israels härlighet komma”), och Judas män bodde där åter efter landsflykten; Judas Mackabeus firade sabbaten i staden Odollam. På 300-talet e.Kr. kände Eusebios den som en mycket stor by tio romerska mil öster om Eleutheropolis, Beit Guvrin. Senare pilgrimer fick se en annan ”Adullams grotta”, den stora Khareitun-grottan nära Tekoa, sydost om Betlehem, en tradition som sannolikt beror på korsfararna; den bibliska staden ligger i låglandet."
  nb:
    - "Adullam-hulen lå ved eller nær byen Adullam i Sjefela, Judas forberg, omtrent 26 km sørvest for Jerusalem og 20 km vest-sørvest for Betlehem i luftlinje, like over den sørlige enden av Ela-dalen, der David hadde kjempet mot Goliat. Byen plasseres vanligvis ved Khirbet esh-Sheikh Madhkur, en høyde med fjellhuggede huler og sisterner, der kartpunktet står; det gamle navnet antas å overleve i ruinen Id el-Miyeh ved foten. Ingen innskrift har bekreftet identifiseringen, og Bibelen sier ikke hvilken av hulene David brukte."
    - "David kom hit på flukt fra Saul, etter å ha latt som han var vanvittig for kongen i Gat, 16 km unna: han «flyktet til hulen ved Adullam», hans familie kom ned til ham, og «alle som var i nød, eller som var trykket av gjeld, eller som var misfornøide, samlet sig om ham», omkring fire hundre mann. Senere, «da det led mot høsten», kom tre av hans helter til ham «i hulen ved Adullam» mens filistrene holdt Betlehem; da han lengtet etter vann fra byens brønn, brøt de seg igjennom og hentet det, og han «øste det ut for Herren». De samme tekstene sier at «David var dengang selv i borgen», og profeten Gad sier til ham: «Du skal ikke bli i fjellborgen»; om det er selve hulen eller en annen befestning, er omstridt. Salme 57 og 142 (56 og 141 i den synodale bibelen) har overskrifter som plasserer dem «i hulen»; tradisjonen knytter dem til Adullam eller til En-Gedi."
    - "Adullam var en by lenge før og etter David: Judas venn Hira var adullamitt, Rehabeam befestet den, Mika nevner den: «Til Adullam skal Israels stormenn komme», og menn fra Juda bodde der igjen etter eksilet; Judas Makkabeus holdt sabbaten i byen Odollam. På 300-tallet e.Kr. kjente Eusebius den som en meget stor landsby ti romerske mil øst for Eleutheropolis, Bet Guvrin. Senere pilegrimer ble vist en annen «Adullam-hule», den store Khareitun-hulen nær Tekoa, i ørkenen sørøst for Betlehem, en tradisjon som trolig skyldes korsfarerne, men den bibelske byen ligger i lavlandet."
  tl:
    - "Ang yungib ng Adullam ay nasa bayan ng Adullam o malapit dito sa Sephela, ang paanan ng mga burol ng Juda, mga 26 km sa timog-kanluran ng Jerusalem at 20 km sa kanluran-timog-kanluran ng Bethlehem sa tuwid na guhit, sa itaas lamang ng katimugang dulo ng lambak ng Ela, kung saan nakipaglaban si David kay Goliath. Karaniwang inilalagay ang bayan sa Khirbet esh-Sheikh Madhkur, isang burol na may mga yungib at imbakan ng tubig na tinabas sa bato, kung saan nakatayo ang punto sa mapa; ang lumang pangalan ay inaakalang nananatili sa guho ng Id el-Miyeh sa paanan nito. Walang inskripsiyong nagpatibay sa pagkakakilanlan, at hindi sinasabi ng Biblia kung alin sa mga yungib ang ginamit ni David."
    - "Tumakas dito si David kay Saul, pagkatapos magkunwaring baliw sa harap ng hari ng Gath, 16 km ang layo: “tumakas sa yungib ng Adullam”, bumaba sa kaniya ang pamilya niya, at “bawa't isa na napipighati, at bawa't isa na may utang, at bawa't isa na may kalumbayan ay nakipisan sa kaniya”, mga 400 tao. Nang maglaon, tatlo sa kaniyang mandirigma ay “nagsiparoon kay David sa pagaani sa yungib ng Adullam” habang hawak ng mga Filisteo ang Bethlehem; nang manabik siya sa tubig ng balon nito, sumagasa sila at dinala ito, at “kaniyang ibinuhos na handog sa Panginoon”. Doon “si David nga'y nasa katibayan”, at sinabi sa kaniya ng propetang si Gad, “Huwag kang tumahan sa moog”; pinagtatalunan kung ito ang yungib o ibang kuta. Ang Awit 57 at 142 (56 at 141 sa Bibliyang Synodal) ay may pamagat na mga panalangin sa yungib, na iniuugnay ng tradisyon sa Adullam o En-gedi."
    - "Ang Adullam ay isang bayan nang matagal bago at pagkatapos ni David: ang kaibigan ni Juda na si Hira ay isang Adullamita, pinatibay ito ni Roboam, binabanggit ito ni Mikas: “ang kaluwalhatian ng Israel ay darating hanggang sa Adullam”, at muling nanirahan doon ang mga tao ng Juda pagkatapos ng pagkatapon; nagdaos si Judas Macabeo ng sabbath sa lungsod ng Odollam. Noong ika-4 na siglo AD kilala ito ni Eusebio bilang isang napakalaking nayon sampung milya sa silangan ng Eleutheropolis, Beth Guvrin. Ipinakita sa mga huling peregrino ang isa pang “yungib ng Adullam”, ang malaking yungib ng Khareitun malapit sa Tecoa, sa ilang sa timog-silangan ng Bethlehem, isang tradisyong marahil ay utang sa mga Krusado, ngunit nasa mababang lupain ang bayan ng Biblia."
  da:
    - "Adullams hule lå ved eller nær byen Adullam i Sjefela, Judas forbjerge, ca. 26 km sydvest for Jerusalem og 20 km vest-sydvest for Betlehem i fugleflugt, lige over den sydlige ende af Ela-dalen, hvor David havde kæmpet mod Goliat. Byen placeres sædvanligvis ved Khirbet esh-Sheikh Madhkur, en bakketop med klippehuggede huler og cisterner, hvor kortets punkt står; det gamle navn menes at leve videre i ruinen Id el-Miyeh ved dens fod. Ingen indskrift har bekræftet identifikationen, og Bibelen siger ikke, hvilken af hulerne David brugte."
    - "David kom hertil på flugt fra Saul, efter at have spillet vanvittig for kongen af Gat, 16 km væk: Han »undkom til Hulen ved Adullam«, hans familie kom ned til ham, og »hver Mand, som var i Trang, og hver Mand, som trykkedes af Gæld, og hver Mand, som var beskeligen bedrøvet i Sjælen, samlede sig til ham«, ca. fire hundrede mand. Senere kom tre af hans vældige mænd »om Høsten« til ham »til Hulen ved Adullam«, mens filisterne holdt Betlehem; da han længtes efter vand fra dens brønd, brød de igennem og hentede det, og han »udøste det for Herren«. Samme steder står der, at »David var da i Befæstningen«, og profeten Gad siger: »Du skal ikke blive i Befæstningen«; om det er hulen selv eller en anden fæstning, er omstridt. Salme 57 og 142 (56 og 141 i den synodale bibel) er overskrevet som bønner »da han var i Hulen«; traditionen knytter dem til Adullam eller til En-Gedi."
    - "Adullam var en by længe før og efter David: Judas ven Hira var adullamit, Rehabeam befæstede den, Mika siger, at »til Adullam skal Israels Herlighed komme«, og mænd fra Juda boede der igen efter eksilet; Judas Makkabæus holdt sabbat i byen Odollam. I 300-tallet e.Kr. kendte Eusebius den som en meget stor landsby ti romerske mil øst for Eleutheropolis, Bet Guvrin. Senere pilgrimme fik vist en anden »Adullams hule«, den store Khareitun-hule nær Tekoa, i ørkenen sydøst for Betlehem, en tradition som sandsynligvis skyldes korsfarerne, men den bibelske by ligger i lavlandet."
  sr:
    - "Пећина Одоламска била је код града Одолама или близу њега у Сефели, подножју Јудејских брда, око 26 км југозападно од Јерусалима и 20 км западно-југозападно од Витлејема ваздушном линијом, одмах изнад јужног краја долине Ила, где се Давид борио с Голијатом. Град се обично смешта у Хирбет еш-Шеик Мадкур, брдо са пећинама и цистернама исеченим у стени, где стоји тачка на карти; сматра се да је старо име сачувано у рушевини Ид ел-Мије у његовом подножју. Ниједан натпис није потврдио поистовећење, а Библија не каже коју је од пећина Давид користио."
    - "Давид је овамо дошао бежећи од Саула, пошто се претварао луд пред краљем Гата, 16 км далеко: „утече у пећину одоламску“, његова породица сишла је к њему, а „скупише се око њега који год беху у невољи и који беху задужени и који год беху тужног срца“, око четири стотине људи. Касније су „о жетви“ тројица његових јунака дошла к њему „у пећину одоламску“ док су Филистеји држали Витлејем; кад је зажелео воде из његовог студенца, продрли су и донели му је, а он „не хте пити, него је проли пред Господом“. Исти одломци кажу да „Давид беше онда у граду“, а пророк Гад му говори: „Немој остати у том граду“; да ли је то сама пећина или друго утврђење, спорно је. Наслови псалама 57 и 142 (56 и 141 у Синодалној Библији) означавају их као молитве у пећини; предање их везује за Одолам или за Ен-Геди."
    - "Одолам је био град дуго пре и после Давида: Јудин пријатељ Ирас био је Одоламац, Ровоам га је утврдио, Миха га помиње: „до Одолама, славе Израиљеве“, а Јудејци су ту поново живели после прогонства; Јуда Макавеј је светковао суботу у граду Одоламу. У четвртом веку н. е. Јевсевије га је познавао као врло велико село десет миља источно од Елевтерополиса, Бејт Гуврина. Каснијим ходочасницима показивана је друга „пећина Одоламска“, велика пећина Харејтун код Текује, у пустињи југоисточно од Витлејема, предање које највероватније дугује крсташима, али библијски град лежи у низији."
