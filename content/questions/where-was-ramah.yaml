id: where-was-ramah
question:
  en: "Where was Ramah?"
  ru: "Где находилась Рама?"
  uk: "Де була Рама?"
  es: "¿Dónde estaba Ramá?"
  pt: "Onde ficava Ramá?"
  de: "Wo lag Rama?"
  fr: "Où se trouvait Rama ?"
  pl: "Gdzie leżała Rama?"
  it: "Dov’era Rama?"
  cs: "Kde ležela Ráma?"
  nl: "Waar lag Rama?"
  sv: "Var låg Rama?"
  nb: "Hvor lå Rama?"
  tl: "Nasaan ang Rama?"
  da: "Hvor lå Rama?"
  sr: "Где је била Рама?"
  hu: "Hol volt Ráma?"
  fi: "Missä Rama sijaitsi?"
  vi: "Ra-ma ở đâu?"
  ro: "Unde se afla Rama?"
  bg: "Къде се е намирала Рама?"
answer:
  en:
    - "The Ramah most often meant in the Bible, Ramah of Benjamin, is usually identified with the village of er-Ram on a hill by the ridge road about 8.6 km north of Jerusalem in a straight line, today a Palestinian town just north of the city in the West Bank; the map's point stands there, 3.5 km north of Gibeah and 7.7 km south of Bethel. The name means “height”, and several other places bore it: Ramah in Naphtali and in Asher in Galilee, Ramath of the south in Simeon, and Ramoth-gilead east of the Jordan. History Globe has an article on Ramah; this answer sorts out which is which."
    - "Ramah of Benjamin was a border town. Deborah judged Israel “under the palm tree of Deborah between Ramah and Beth-el”; Baasha of Israel “built Ramah, that he might not suffer any to go out or come in to Asa king of Judah”; Isaiah, watching an army come down from the north, cries, “Ramah is afraid; Gibeah of Saul is fled”. After the fall of Jerusalem Nebuzar-adan released Jeremiah at Ramah, where the captives bound for Babylon were gathered, and Jeremiah heard “A voice was heard in Ramah, lamentation, and bitter weeping; Rahel weeping for her children”, words Matthew applies to the children of Bethlehem, about 17 km to the south. Rachel's tomb lay “in the border of Benjamin at Zelzah”, near Ramah on that reading, though Genesis puts it “in the way to Ephrath, which is Beth-lehem”."
    - "Samuel's Ramah is disputed. His father came from “Ramathaim-zophim, of mount Ephraim”; Samuel lived, judged and was buried “in his house at Ramah”. Many identify it with er-Ram, as the map does; others place it at Nebi Samwil, north-west of Jerusalem, or much farther north-west at Rentis, which many also take for New Testament Arimathea. The map's year, about 1050 BC, is a conventional point: the year the map gives for Saul's becoming king, while Samuel still judged from Ramah."
  ru:
    - "Рама, о которой Библия говорит чаще всего, — Рама Вениаминова — обычно отождествляется с селением эр-Рам на холме у дороги по хребту, примерно в 8,6 км к северу от Иерусалима по прямой; сегодня это палестинский городок сразу к северу от города, на Западном берегу. Там и стоит точка карты, в 3,5 км к северу от Гивы и в 7,7 км к югу от Вефиля. Имя значит «высота», и его носили и другие места: Рама в Неффалиме и в Асире в Галилее, южная Рама в Симеоне и Рамоф Галаадский за Иорданом. В History Globe есть статья о Раме; здесь ответ о том, какая Рама где."
    - "Рама Вениаминова была пограничным городом. Девора судила Израиль «под Пальмою Девориною, между Рамою и Вефилем»; Вааса, царь Израильский, «начал строить Раму, чтобы никто не выходил и не уходил к Асе, царю Иудейскому»; Исаия, видя войско, идущее с севера, восклицает: «Рама трясется; Гива Саулова разбежалась». После падения Иерусалима Навузардан отпустил Иеремию в Раме, где собирали пленных для Вавилона, а Иеремия услышал: «голос слышен в Раме, вопль и горькое рыдание; Рахиль плачет о детях своих» — слова, которые Матфей относит к детям Вифлеема, примерно в 17 км к югу. Гроб Рахили был «на пределах Вениаминовых, в Целцахе», то есть, по такому прочтению, близ Рамы, хотя Книга Бытия помещает его «на дороге в Ефрафу, то есть Вифлеем»."
    - "Рама Самуила спорна. Его отец был «из Рамафаим-Цофима, с горы Ефремовой»; Самуил жил и судил в Раме и был погребён «в доме его, в Раме». Многие отождествляют её с эр-Рамом, как и карта; другие помещают её в Неби-Самвиле, к северо-западу от Иерусалима, или гораздо дальше на северо-запад, в Рентисе, который многие считают и новозаветной Аримафеей. Год карты, около 1050 г. до н. э., — условная точка: год, которым карта отмечает воцарение Саула, когда Самуил ещё судил из Рамы."
  uk:
    - "Раму, яку Біблія має на увазі найчастіше, Раму Веніяминову, зазвичай ототожнюють із селом ер-Рам на пагорбі біля хребтової дороги приблизно за 8,6 км на північ від Єрусалима по прямій, нині палестинським містечком одразу на північ від міста на Західному березі Йордану; точка на мапі стоїть там, за 3,5 км на північ від Гіви і за 7,7 км на південь від Бет-Ела. Назва означає «висота», і її носили ще кілька місць: Рама в Нефталимі та в Асірі в Галілеї, Рамат Південний у Симеоні та Рамот Гілеадський на схід від Йордану. В «Історичному глобусі» є стаття про Раму; ця відповідь розрізняє, яка з них яка."
    - "Рама Веніяминова була прикордонним містом. Дебора судила Ізраїль «під Дебора-пальмою між Рамою й Бетелем»; Вааса Ізраїльський «утвердив Раму, щоб нїхто не виходив нї входив до Аси, царя Юдейського»; Ісая, бачачи, як військо спускається з півночі, вигукує: «Рама тремтить; Гива Саулова розбіглась». Після падіння Єрусалима Невузарадан звільнив Єремію в Рамі, де збирали бранців, призначених до Вавилона, і Єремія почув: «Чути голосїннє аж у Рамі, наріканнє й риданнє; Рахиль плаче по своїх дїтях» — слова, які Матвій відносить до дітей Вифлеєма, приблизно за 17 км на південь. Гробниця Рахілі лежала «на гряницї Беняминовій, в Зелзасї», поблизу Рами за цим прочитанням, хоч Книга Буття поміщає її «на шляху до Евфрата, се єсть Бетлегем»."
    - "Рама Самуїла — спірна. Його батько був «із Раматаїм-Зофиму, з гір Ефраїмових»; Самуїл жив, судив і був похований «в дому його в Рамі». Багато хто ототожнює її з ер-Рамом, як і мапа; інші поміщають її в Неби-Самуїлі, на північний захід від Єрусалима, або значно далі на північний захід у Рентісі, який багато хто вважає й новозавітною Аримафеєю. Рік на мапі, близько 1050 р. до н. е., — умовна точка: рік, який мапа дає для воцаріння Саула, коли Самуїл ще судив із Рами."
  es:
    - "La Ramá a la que más a menudo se refiere la Biblia, Ramá de Benjamín, se identifica por lo común con la aldea de er-Ram, sobre una colina junto al camino de la cordillera, a unos 8,6 km al norte de Jerusalén en línea recta, hoy una población palestina justo al norte de la ciudad, en Cisjordania; el punto del mapa está allí, a 3,5 km al norte de Gabaa y a 7,7 km al sur de Betel. El nombre significa «altura», y otros varios lugares lo llevaron: Ramá en Neftalí y en Aser, en Galilea, Ramat del sur en Simeón, y Ramot de Galaad, al este del Jordán. History Globe tiene un artículo sobre Ramá; esta respuesta aclara cuál es cuál."
    - "Ramá de Benjamín era una ciudad fronteriza. Débora juzgaba a Israel «debajo de una palma entre Rama y Beth-el»; Baasa de Israel «edificó á Rama, para no dejar salir ni entrar á ninguno de Asa, rey de Judá»; Isaías, viendo bajar un ejército del norte, clama: «Ramá tembló; Gabaa de Saúl huyó». Tras la caída de Jerusalén, Nabuzaradán liberó a Jeremías en Ramá, donde se reunía a los cautivos destinados a Babilonia, y Jeremías oyó: «Voz fué oída en Ramá, llanto y lloro amargo: Rachêl que lamenta por sus hijos», palabras que Mateo aplica a los niños de Belén, a unos 17 km al sur. La tumba de Raquel estaba «en el término de Benjamín, en Selsah», cerca de Ramá según esa lectura, aunque el Génesis la pone «en el camino de Ephrata, la cual es Beth-lehem»."
    - "La Ramá de Samuel se discute. Su padre era de «Ramathaim de Sophim, del monte de Ephraim»; Samuel vivió, juzgó y fue sepultado «en su casa en Rama». Muchos la identifican con er-Ram, como hace el mapa; otros la sitúan en Nebi Samwil, al noroeste de Jerusalén, o mucho más al noroeste, en Rentis, que muchos toman también por la Arimatea del Nuevo Testamento. El año del mapa, hacia 1050 a. C., es un punto convencional: el año que el mapa da para que Saúl llegue a ser rey, mientras Samuel aún juzgaba desde Ramá."
  pt:
    - "A Ramá mais frequentemente referida na Bíblia, Ramá de Benjamim, é geralmente identificada com a aldeia de er-Ram, numa colina junto à estrada da crista, a cerca de 8,6 km ao norte de Jerusalém em linha reta, hoje uma cidade palestina logo ao norte da cidade, na Cisjordânia; o ponto do mapa fica ali, a 3,5 km ao norte de Gibeá e 7,7 km ao sul de Betel. O nome significa “altura”, e vários outros lugares o tiveram: Ramá em Naftali e em Aser, na Galileia, Ramate do sul, em Simeão, e Ramote-Gileade, a leste do Jordão. O History Globe tem um artigo sobre Ramá; esta resposta distingue qual é qual."
    - "Ramá de Benjamim era uma cidade de fronteira. Débora julgava Israel “debaixo da palmeira de Débora, entre Ramá e Betel”; Baasa, de Israel, “edificou Ramá, para não permitir que ninguém saísse ou chegasse a Asa, rei de Judá”; Isaías, observando um exército que descia do norte, exclama: “Ramá treme. Gibeá de Saul fugiu.” Depois da queda de Jerusalém, Nebuzaradã soltou Jeremias em Ramá, onde os cativos destinados à Babilônia estavam reunidos, e Jeremias ouviu: “Ouve-se uma voz em Ramá, lamentação e choro amargo, Raquel chorando por seus filhos”, palavras que Mateus aplica às crianças de Belém, a cerca de 17 km ao sul. O túmulo de Raquel ficava “na fronteira de Benjamim, em Zelza”, perto de Ramá segundo essa leitura, embora o Gênesis o ponha “no caminho para Efrata (também chamada Belém)”."
    - "A Ramá de Samuel é disputada. Seu pai vinha de “Ramataim-Zofim, da região montanhosa de Efraim”; Samuel morava, julgava e foi sepultado “em sua casa, em Ramá”. Muitos a identificam com er-Ram, como faz o mapa; outros a situam em Nebi Samwil, a noroeste de Jerusalém, ou muito mais a noroeste, em Rentis, que muitos também tomam pela Arimateia do Novo Testamento. O ano do mapa, cerca de 1050 a.C., é um ponto convencional: o ano que o mapa dá para Saul se tornar rei, enquanto Samuel ainda julgava a partir de Ramá."
  de:
    - "Das Rama, das in der Bibel meist gemeint ist, das benjaminitische Rama, wird gewöhnlich mit dem Dorf er-Ram gleichgesetzt, auf einem Hügel an der Höhenstraße, in der Luftlinie etwa 8,6 km nördlich von Jerusalem, heute eine palästinensische Stadt unmittelbar nördlich der Stadt im Westjordanland; dort steht der Kartenpunkt, 3,5 km nördlich von Gibea und 7,7 km südlich von Bethel. Der Name bedeutet „Höhe“, und mehrere andere Orte trugen ihn: Rama in Naftali und in Asser in Galiläa, Ramat des Südens in Simeon und Ramot in Gilead östlich des Jordans. History Globe hat einen Artikel über Rama; diese Antwort klärt, welches welches ist."
    - "Das benjaminitische Rama war eine Grenzstadt. Debora richtete Israel „unter der Palme Deboras zwischen Rama und Beth-El“; Baesa von Israel „baute Rama, daß niemand sollte aus und ein ziehen auf Asas Seite, des Königs Juda's“; Jesaja ruft, als er ein Heer aus dem Norden herabziehen sieht: „Rama erschrickt; Gibea Sauls flieht“. Nach dem Fall Jerusalems ließ Nebusaradan Jeremia in Rama frei, wo die Gefangenen für Babylon gesammelt wurden, und Jeremia hörte: „Man hört eine klägliche Stimme und bitteres Weinen auf der Höhe; Rahel weint über ihre Kinder“, Worte, die Matthäus auf die Kinder von Bethlehem bezieht, etwa 17 km südlich. Rahels Grab lag „in der Grenze Benjamins, zu Zelzah“, nach dieser Lesart nahe Rama, obwohl die Genesis es „an dem Wege gen Ephrath, das nun heißt Bethlehem“ ansetzt."
    - "Samuels Rama ist umstritten. Sein Vater stammte „von Ramathaim-Zophim, vom Gebirge Ephraim“; Samuel wohnte, richtete und wurde begraben „in seinem Hause zu Rama“. Viele setzen es mit er-Ram gleich, wie die Karte; andere verlegen es nach Nebi Samwil, nordwestlich von Jerusalem, oder weit nordwestlich nach Rantis, das viele auch für das neutestamentliche Arimathäa halten. Das Jahr der Karte, etwa 1050 v. Chr., ist ein konventioneller Ansatz: das Jahr, das die Karte für Sauls Königwerden angibt, während Samuel noch von Rama aus richtete."
  fr:
    - "La Rama la plus souvent visée dans la Bible, Rama de Benjamin, est généralement identifiée au village d’er-Ram, sur une colline au bord de la route de crête, à environ 8,6 km au nord de Jérusalem à vol d’oiseau, aujourd’hui une ville palestinienne juste au nord de la ville, en Cisjordanie ; le point de la carte s’y trouve, à 3,5 km au nord de Guibea et à 7,7 km au sud de Béthel. Le nom signifie « hauteur », et plusieurs autres lieux le portaient : Rama en Nephthali et en Aser, en Galilée, Ramath du Midi en Siméon, et Ramoth en Galaad à l’est du Jourdain. History Globe consacre un article à Rama ; cette réponse démêle laquelle est laquelle."
    - "Rama de Benjamin était une ville frontière. Débora siégeait « sous le palmier de Débora, entre Rama et Béthel » ; Baescha d’Israël « bâtit Rama, pour empêcher ceux d’Asa, roi de Juda, de sortir et d’entrer » ; Ésaïe, voyant une armée descendre du nord, s’écrie : « Rama tremble, Guibea de Saül prend la fuite ». Après la chute de Jérusalem, Nebuzaradan relâcha Jérémie à Rama, où l’on rassemblait les captifs destinés à Babylone, et Jérémie entendit : « On entend des cris à Rama, des lamentations, des larmes amères ; Rachel pleure ses enfants », paroles que Matthieu applique aux enfants de Bethléem, à environ 17 km au sud. Le tombeau de Rachel se trouvait « sur la frontière de Benjamin, à Tseltsach », près de Rama selon cette lecture, bien que la Genèse le place « sur le chemin d’Éphrata, qui est Bethléhem »."
    - "La Rama de Samuel est discutée. Son père venait de « Ramathaïm-Tsophim, de la montagne d’Éphraïm » ; Samuel y vécut, y jugea Israël et y fut enterré « dans sa demeure à Rama ». Beaucoup l’identifient à er-Ram, comme le fait la carte ; d’autres la placent à Nebi Samwil, au nord-ouest de Jérusalem, ou bien plus loin au nord-ouest, à Rentis, que beaucoup tiennent aussi pour l’Arimathée du Nouveau Testament. L’année de la carte, vers 1050 av. J.-C., est un point conventionnel : l’année que la carte donne pour l’avènement de Saül, alors que Samuel jugeait encore depuis Rama."
  pl:
    - "Rama, o której Biblia mówi najczęściej, Rama Beniaminowa, jest zwykle utożsamiana z wsią er-Ram na wzgórzu przy drodze grzbietowej około 8,6 km na północ od Jerozolimy w linii prostej, dziś palestyńskim miastem tuż na północ od Jerozolimy na Zachodnim Brzegu; tam stoi punkt na mapie, 3,5 km na północ od Gibei i 7,7 km na południe od Betel. Nazwa oznacza „wysokość” i nosiło ją kilka innych miejsc: Rama w Neftali i w Aszerze w Galilei, Ramat na południu w Symeonie i Ramot w Gileadzie na wschód od Jordanu. History Globe ma artykuł o Ramie; ta odpowiedź rozstrzyga, która jest która."
    - "Rama Beniaminowa była miastem granicznym. Debora sądziła Izraela „pod palmą Debora między Rama i między Betel”; Baasza izraelski „zbudował Ramę, aby nie dopuścił wychodzić i wchodzić nikomu do Azy, króla Judzkiego”; Izajasz, patrząc na armię schodzącą z północy, woła: „ulęknie się Rama, Gabaa Saulowe uciecze”. Po upadku Jerozolimy Nebuzaradan uwolnił Jeremiasza w Ramie, gdzie zgromadzono jeńców idących do Babilonu, a Jeremiasz usłyszał: „Głos w Rama słyszany jest, narzekanie i płacz bardzo gorzki; Rachel płacząca synów swoich”, słowa, które Mateusz odnosi do dzieci Betlejem, oddalonego o około 17 km na południe. Grób Racheli leżał „na granicach Benjamin w Selsa”, według tego odczytania blisko Ramy, choć Księga Rodzaju umieszcza go „na drodze ku Efracie; tać jest Betlehem”."
    - "Rama Samuela jest sporna. Jego ojciec pochodził „z Ramataim Sofim, z góry Efraim”; Samuel mieszkał, sądził i został pochowany „w domu jego w Ramacie”. Wielu utożsamia ją z er-Ram, jak mapa; inni umieszczają ją w Nebi Samwil, na północny zachód od Jerozolimy, albo znacznie dalej na północny zachód w Rentis, które wielu uważa też za nowotestamentową Arymateę. Rok na mapie, około 1050 p.n.e., jest punktem umownym: to rok, który mapa podaje dla objęcia władzy przez Saula, gdy Samuel wciąż sądził z Ramy."
  it:
    - "La Rama più spesso intesa nella Bibbia, Rama di Beniamino, si identifica di solito con il villaggio di er-Ram su una collina presso la strada di crinale a circa 8,6 km a nord di Gerusalemme in linea d’aria, oggi una città palestinese subito a nord della città in Cisgiordania; il punto della mappa si trova lì, a 3,5 km a nord di Gabaa e a 7,7 km a sud di Betel. Il nome significa «altura», e diversi altri luoghi lo portarono: Rama in Neftali e in Aser in Galilea, Ramat del sud in Simeone, e Ramot di Galaad a est del Giordano. History Globe ha un articolo su Rama; questa risposta chiarisce quale sia quale."
    - "Rama di Beniamino era una città di confine. Debora giudicava Israele «sotto la palma di Debora, fra Rama e Bethel»; Baasa d’Israele «edificò Rama, per impedire che alcuno andasse e venisse dalla parte di Asa, re di Giuda»; Isaia, osservando un esercito scendere da nord, grida: «Rama trema, Ghibea di Saul è in fuga». Dopo la caduta di Gerusalemme Nebuzaradan liberò Geremia a Rama, dove erano radunati i prigionieri diretti a Babilonia, e Geremia udì «una voce in Rama, un lamento, un pianto amaro; Rachele piange i suoi figliuoli», parole che Matteo applica ai bambini di Betlemme, a circa 17 km a sud. La tomba di Rachele si trovava «ai confini di Beniamino, a Tseltsah», vicino a Rama in quella lettura, benché la Genesi la ponga «sulla via di Efrata; cioè di Bethlehem»."
    - "La Rama di Samuele è discussa. Suo padre veniva da «Ramathaim-Tsofim, della contrada montuosa di Efraim»; Samuele «tornava a Rama, dove stava di casa», vi giudicò Israele e fu sepolto «nella sua proprietà, a Rama». Molti la identificano con er-Ram, come fa la mappa; altri la collocano a Nebi Samwil, a nord-ovest di Gerusalemme, o molto più a nord-ovest a Rentis, che molti ritengono anche l’Arimatea del Nuovo Testamento. L’anno della mappa, circa il 1050 a.C., è un punto convenzionale: l’anno che la mappa dà per l’ascesa di Saul al regno, mentre Samuele giudicava ancora da Rama."
  cs:
    - "Ráma, která se v Bibli míní nejčastěji, Ráma Benjamínova, se obvykle ztotožňuje s vesnicí er-Ram na pahorku u hřebenové cesty asi 8,6 km vzdušnou čarou severně od Jeruzaléma, dnes palestinským městem těsně severně od Jeruzaléma na Západním břehu; stojí tam bod na mapě, 3,5 km severně od Gibey a 7,7 km jižně od Bét-elu. Jméno znamená „výšina“ a nesla je i další místa: Ráma v Neftalí a v Ašeru v Galileji, Rámat jižní v Simeonovi a Rámot v Gileadu východně od Jordánu. History Globe má o Ráme článek; tato odpověď rozlišuje, která je která."
    - "Ráma Benjamínova byla pohraničním městem. Debora soudila Izraele: „bydlila Debora pod palmou, mezi Ráma a mezi Bethel na hoře Efraim, i chodili k ní synové Izraelští k soudu“; Baeša Izraelský „vytáhl proti Judovi, a stavěl Ráma, aby nedal žádnému vyjíti ani jíti k Azovi králi Judskému“; Izajáš, pozorující vojsko přicházející ze severu, volá: „ulekne se Ráma, Gabaa Saulovo uteče“. Po pádu Jeruzaléma propustil Nebúzaradan Jeremjáše v Ráme, kde byli shromážděni zajatci určení do Babylóna, a Jeremjáš slyšel: „Hlas v Ráma slyšán jest, naříkání a pláč přehořký. Ráchel plačeci synů svých“, slova, která Matouš vztahuje na betlémské děti, asi 17 km na jih. Ráchelin hrob ležel „v končinách Beniamin v Zelzachu“, tedy podle tohoto čtení poblíž Rámy, ačkoli Genesis jej klade „na cestě k Efratě, jenž jest Betlém“."
    - "Samuelova Ráma je sporná. Jeho otec pocházel „z Ramataim Zofim, s hory Efraim“; Samuel žil, soudil a byl pohřben „v domě jeho v Ráma“. Mnozí ji ztotožňují s er-Ram, jako mapa; jiní ji kladou na Nebi Samwil, severozápadně od Jeruzaléma, nebo mnohem dále na severozápad do Rentis, které mnozí pokládají také za novozákonní Arimateu. Rok na mapě, asi 1050 př. n. l., je smluvní bod: rok, který mapa udává pro Saulovo království, zatímco Samuel ještě soudil z Rámy."
  nl:
    - "Het Rama dat in de Bijbel het vaakst wordt bedoeld, Rama van Benjamin, wordt gewoonlijk geïdentificeerd met het dorp er-Ram op een heuvel aan de bergweg, hemelsbreed ongeveer 8,6 km ten noorden van Jeruzalem, tegenwoordig een Palestijnse stad net ten noorden van Jeruzalem in de Westelijke Jordaanoever; daar staat het punt op de kaart, 3,5 km ten noorden van Gibea en 7,7 km ten zuiden van Bethel. De naam betekent “hoogte”, en verschillende andere plaatsen droegen hem: Rama in Naftali en in Aser in Galilea, Ramat van het zuiden in Simeon, en Ramot in Gilead ten oosten van de Jordaan. History Globe heeft een artikel over Rama; dit antwoord legt uit welke welke is."
    - "Rama van Benjamin was een grensstad. Debora richtte Israël “onder den palmboom van Debora, tussen Rama en tussen Beth-El”; Baësa van Israël “bouwde Rama; opdat hij niemand toeliet uit te gaan en in te komen tot Asa, den koning van Juda”; Jesaja, die een leger uit het noorden ziet afdalen, roept: “Rama beeft, Gibea Sauls vlucht”. Na de val van Jeruzalem liet Nebuzaradan Jeremia bij Rama gaan, waar de ballingen op weg naar Babylon waren verzameld, en Jeremia hoorde: “Er is een stem gehoord in Rama, een klage, een zeer bitter geween; Rachel weent over haar kinderen”, woorden die Mattheüs toepast op de kinderen van Bethlehem, ongeveer 17 km naar het zuiden. Het graf van Rachel lag “aan de landpale van Benjamin, te Zelzah”, volgens die lezing bij Rama, hoewel Genesis het plaatst “aan den weg naar Efrath, hetwelk is Bethlehem”."
    - "Het Rama van Samuël is omstreden. Zijn vader kwam uit “Ramathaim-Zofim, van het gebergte van Efraim”; Samuël woonde, richtte en werd begraven “in zijn huis te Rama”. Velen identificeren het met er-Ram, zoals de kaart doet; anderen plaatsen het bij Nebi Samwil, ten noordwesten van Jeruzalem, of veel verder naar het noordwesten bij Rentis, dat velen ook voor het Arimatea van het Nieuwe Testament houden. Het jaar op de kaart, ongeveer 1050 v.Chr., is een conventioneel punt: het jaar dat de kaart geeft voor Sauls koningschap, terwijl Samuël nog vanuit Rama richtte."
  sv:
    - "Rama, som Bibeln oftast avser, Benjamins Rama, identifieras vanligen med byn er-Ram på en kulle vid åsvägen omkring 8,6 km norr om Jerusalem i fågelvägen, i dag en palestinsk stad strax norr om staden på Västbanken; kartans punkt står där, 3,5 km norr om Giva och 7,7 km söder om Betel. Namnet betyder ”höjd”, och flera andra platser bar det: Rama i Naftali och i Asher i Galileen, Ramat i söder i Simeon och Ramot-Gilead öster om Jordan. History Globe har en artikel om Rama; det här svaret reder ut vilken som är vilken."
    - "Benjamins Rama var en gränsstad. Debora dömde Israel ”under Deborapalmen, mellan Rama och Betel i Efraims bergsbygd”; Basha av Israel ”begynte befästa Rama, för att hindra att någon komme vare sig till eller ifrån Asa, Juda konung”; Jesaja, som ser en här komma ned från norr, ropar: ”Rama bävar; Sauls Gibea flyr.” Efter Jerusalems fall lät Nebusaradan Jeremia gå fri i Rama, dit fångarna som skulle föras till Babylon hade samlats, och Jeremia hörde: ”Ett rop höres i Rama, klagan och bitter gråt; det är Rakel som begråter sina barn”, ord som Matteus tillämpar på barnen i Betlehem, omkring 17 km åt söder. Rakels grav låg ”vid Benjamins gräns, vid Selsa”, nära Rama enligt den läsningen, fastän Första Moseboken förlägger den ”vid vägen till Efrat, det är Bet-Lehem”."
    - "Samuels Rama är omstridd. Hans far kom från ”Ramataim-Sofim, i Efraims bergsbygd”; Samuel levde och dömde i Rama, ”ty där var hans hem”, och blev begraven ”där han bodde i Rama”. Många identifierar den med er-Ram, som kartan gör; andra placerar den vid Nebi Samwil, nordväst om Jerusalem, eller mycket längre nordväst vid Rentis, som många också tar för Nya testamentets Arimataia. Kartans år, omkring 1050 f.Kr., är en konventionell tidpunkt: det år kartan anger för Sauls tillträde som kung, medan Samuel ännu dömde från Rama."
  nb:
    - "Rama som oftest menes i Bibelen, Rama i Benjamin, identifiseres vanligvis med landsbyen er-Ram på en høyde ved åsrygg-veien omtrent 8,6 km nord for Jerusalem i luftlinje, i dag en palestinsk by like nord for byen på Vestbredden; kartets punkt står der, 3,5 km nord for Gibea og 7,7 km sør for Betel. Navnet betyr «høyde», og flere andre steder bar det: Rama i Naftali og i Asjer i Galilea, Ramat i sør i Simeon og Ramot-Gilead øst for Jordan. History Globe har en artikkel om Rama; dette svaret reder ut hvilken som er hvilken."
    - "Rama i Benjamin var en grenseby. Debora dømte Israel «under Deboras palmetre mellem Rama og Betel»; Basja av Israel «bygget festningsverker i Rama for å hindre enhver fra å dra fra eller til Asa, Judas konge»; Jesaja, som ser en hær komme ned fra nord, roper: «Rama bever, Sauls Gibea flyr». Etter Jerusalems fall løslot Nebusaradan Jeremia i Rama, der fangene som skulle til Babylon, var samlet, og Jeremia hørte: «En røst høres i Rama, veklage, bitter gråt; Rakel gråter over sine barn», ord Matteus anvender på barna i Betlehem, omtrent 17 km mot sør. Rakels grav lå «på grensen av Benjamin i Selsah», nær Rama etter denne lesningen, selv om Første Mosebok legger den «på veien til Efrat, det er Betlehem»."
    - "Samuels Rama er omstridt. Hans far kom fra «Ramata’im-Sofim i Efra’im-fjellene»; Samuel bodde, dømte og ble begravd «i hans hjem i Rama». Mange identifiserer den med er-Ram, slik kartet gjør; andre plasserer den ved Nebi Samwil, nordvest for Jerusalem, eller mye lenger nordvest ved Rentis, som mange også tar for Arimatea i Det nye testamentet. Kartets år, omkring 1050 f.Kr., er et konvensjonelt punkt: året kartet oppgir for at Saul ble konge, mens Samuel fortsatt dømte fra Rama."
  tl:
    - "Ang Rama na pinakamadalas na tinutukoy sa Biblia, ang Rama ng Benjamin, ay karaniwang kinikilala sa nayon ng er-Ram sa isang burol sa tabi ng daan sa tagaytay na mga 8.6 km sa hilaga ng Jerusalem sa tuwid na guhit, ngayon ay isang bayang Palestino sa hilaga lamang ng lungsod sa West Bank; naroon ang punto ng mapa, 3.5 km sa hilaga ng Gibea at 7.7 km sa timog ng Beth-el. Ang pangalan ay nangangahulugang “taas”, at ilang ibang lugar ang nagdala nito: ang Rama sa Nephtali at sa Aser sa Galilea, ang Ramath ng timog sa Simeon, at ang Ramoth-galaad sa silangan ng Jordan. May artikulo ang History Globe tungkol sa Rama; inaayos ng sagot na ito kung alin ang alin."
    - "Ang Rama ng Benjamin ay bayang hangganan. Si Debora ay humatol sa Israel “sa ilalim ng puno ng palma ni Debora, sa pagitan ng Rama at Beth-el”; nang itayo ni Baasa ng Israel ang Rama, ito ay “upang huwag niyang matiis na sinoma'y lumabas o pumaroon kay Asa na hari sa Juda”; si Isaias, na tanaw ang hukbong bumababa mula sa hilaga, ay sumisigaw, “ang Rama ay nanginginig; ang Gabaa ni Saul ay tumakas”. Pagkabagsak ng Jerusalem, pinalaya ni Nabuzaradan si Jeremias sa Rama, na tipunan ng mga bihag patungong Babilonia, at narinig ni Jeremias ang “Isang tinig ay narinig sa Rama, panaghoy… iniiyakan ni Raquel ang kaniyang mga anak”, mga salitang ikinakapit ni Mateo sa mga bata ng Bethlehem, 17 km sa timog. Ang libingan ni Raquel ay “sa hangganan ng Benjamin sa Selsah”, malapit sa Rama ayon doon, bagaman sa Genesis ito ay “sa daang patungo sa Ephrata (na siyang Bethlehem)”."
    - "Pinagtatalunan ang Rama ni Samuel. Ang kaniyang ama ay “taga Ramathaim-sophim, sa lupaing maburol ng Ephraim”; si Samuel ay nanirahan, humatol at inilibing “sa kaniyang bahay sa Rama”. Marami ang nagkikilala rito sa er-Ram, gaya ng ginagawa ng mapa; ang iba ay naglalagay nito sa Nebi Samwil, sa hilagang-kanluran ng Jerusalem, o mas malayo pa sa hilagang-kanluran sa Rentis, na itinuturing din ng marami na Arimatea ng Bagong Tipan. Ang taon sa mapa, mga 1050 BK, ay isang kumbensiyonal na punto: ang taong ibinibigay ng mapa sa pagiging hari ni Saul, habang humahatol pa si Samuel mula sa Rama."
  da:
    - "Det Rama, der oftest menes i Bibelen, Benjamins Rama, identificeres sædvanligvis med landsbyen er-Ram på en bakke ved højdevejen ca. 8,6 km nord for Jerusalem i fugleflugt, i dag en palæstinensisk by lige nord for byen på Vestbredden; kortets punkt står der, 3,5 km nord for Gibea og 7,7 km syd for Betel. Navnet betyder »højde«, og flere andre steder bar det: Rama i Naftali og i Aser i Galilæa, Ramat i syd i Simeon og Ramot i Gilead øst for Jordan. History Globe har en artikel om Rama; dette svar reder trådene ud."
    - "Benjamins Rama var en grænseby. Debora dømte Israel »under Deboras Palmetræ, imellem Rama og Bethel«; Basja af Israel »byggede Rama, for ikke at tilstede Asa, Judas Konge, at nogen drog ud eller kom ind«; Esajas, der ser en hær komme ned fra nord, råber: »Rama bæver, Sauls Gibea flyr«. Efter Jerusalems fald løslod Nebuzaradan Jeremias ved Rama, hvor de fangne på vej til Babylon blev samlet, og Jeremias hørte: »Der er hørt en Røst i Rama, en Klage, en bitter Graad, Rakel græder over sine Børn«, ord Mattæus anvender på børnene i Betlehem, ca. 17 km mod syd. Rakels grav lå »i Benjamins Landemærke i Zelza«, nær Rama efter den læsning, selv om Første Mosebog placerer den »paa Vejen til Efrath, det er Bethlehem«."
    - "Samuels Rama er omstridt. Hans far kom fra »Ramathaim-Zofim fra Efraims Bjerg«; Samuel boede, dømte og blev begravet »i hans Hjem udi Rama«. Mange identificerer det med er-Ram, som kortet gør; andre placerer det ved Nebi Samwil nordvest for Jerusalem eller langt længere mod nordvest ved Rentis, som mange også tager for Det Nye Testamentes Arimatæa. Kortets år, ca. 1050 f.Kr., er et konventionelt tidspunkt: det år kortet angiver for Sauls kongedømme, mens Samuel stadig dømte fra Rama."
  sr:
    - "Рама која се у Библији најчешће подразумева, Рама Венијаминова, обично се поистовећује са селом ер-Рам на брду поред гребенског пута око 8,6 км северно од Јерусалима ваздушном линијом, данас палестинским градом одмах северно од града на Западној обали; тачка на карти стоји ту, 3,5 км северно од Гаваје и 7,7 км јужно од Ветиља. Име значи „висина“, а носило га је и неколико других места: Рама у Нефталиму и у Асиру у Галилеји, Рамат јужни у Симеуну и Рамот Галадски источно од Јордана. History Globe има чланак о Рами; овај одговор разазнаје која је која."
    - "Рама Венијаминова била је гранични град. Девора је судила Израелу „под палмом између Раме и Ветиља“; Васа Израелски „стаде зидати Раму да не да никоме отићи к Аси, цару Јудином, ни од њега доћи“; Исаија, гледајући војску како долази са севера, виче: „препаде се Рама, Гаваја Саулова побеже“. После пада Јерусалима Навузардан је пустио Јеремију у Рами, где су се скупљали заробљеници упућени у Вавилон, а Јеремија је чуо: „Глас у Рами чу се, нарицање и плач велики; Рахиља плаче за децом својом“, речи које Матеј примењује на децу Витлејема, око 17 км јужно. Рахиљин гроб лежао је „у крају Венијаминовом у Селси“, близу Раме по том читању, мада га Постање смешта „на путу који иде у Ефрату, а то је Витлејем“."
    - "Самуилова Рама је спорна. Његов отац је био „из Раматајим-Софима, из горе Јефремове“; Самуило је живео, судио и био сахрањен „у дому његовом у Рами“. Многи је поистовећују са ер-Рамом, као и карта; други је смештају у Неби Самвил, северозападно од Јерусалима, или много даље северозападно у Рентис, који многи узимају и за новозаветну Ариматеју. Година на карти, око 1050. п. н. е., договорна је тачка: година коју карта даје за Саулово постајање краљем, док је Самуило још судио из Раме."
  hu:
    - "A Bibliában leggyakrabban emlegetett Ráma, a benjámini Ráma, általában er-Ram falujával azonosítják, egy dombon a gerincúton, Jeruzsálemtől légvonalban mintegy 8,6 km-re északra, ma palesztin város közvetlenül a várostól északra Ciszjordániában; a térkép pontja ott áll, Gibeától 3,5 km-re északra és Bétheltől 7,7 km-re délre. A név „magaslatot” jelent, és több más hely is viselte: Ráma Naftáliban és Áserben, Galileában, a déli Rámat Simeonban és a Jordántól keletre Rámót-Gileád. A History Globe cikket közöl Rámáról; ez a válasz tisztázza, melyik melyik."
    - "A benjámini Ráma határváros volt. Debóra Izráel felett ítélkezett: „a Debora-pálmája alatt lakott Ráma és Béthel között”; Baása, Izráel királya „megépíté Rámát, hogy senkit ki és be ne bocsásson Asához a Júda királyához”; Ézsaiás, aki látja, hogy egy hadsereg érkezik északról, felkiált: „megrémül Ráma, Gibea, Saulnak városa elfut”. Jeruzsálem eleste után Nabuzáradán Rámánál engedte szabadon Jeremiást, ahol a Babilonba vitt foglyokat összegyűjtötték, és Jeremiás hallotta: „Szó hallatszott Rámában, sírás és keserves jajgatás; Rákhel siratta az ő fiait”, szavakat, amelyeket Máté a mintegy 17 km-re délre fekvő Betlehem gyermekeire alkalmaz. Ráhel sírja „Benjámin határában, Selsáhnál” volt, ezen olvasat szerint Ráma közelében, bár a Mózes első könyve „az Efratába (azaz Bethlehembe) vivő úton” helyezi."
    - "Sámuel Rámája vitatott. Atyja „Ramataim-Czofimból, az Efraim hegységéről való” volt; Sámuel ott élt, ítélkezett, és eltemették „az ő házában Rámában”. Sokan er-Rammal azonosítják, ahogy a térkép is; mások Nebi Samwilnél keresik, Jeruzsálemtől északnyugatra, vagy sokkal északnyugatabbra, Rentisnél, amelyet sokan az újszövetségi Arimátiának is tartanak. A térkép éve, Kr. e. 1050 körül, hagyományos időpont: az év, amelyet a térkép Saul királlyá válásához ad, míg Sámuel még Rámából ítélkezett."
  fi:
    - "Raamatussa useimmin tarkoitettu Rama, Benjaminin Rama, tunnistetaan yleensä er-Ramin kyläksi kukkulalla harjutien varrella linnuntietä noin 8,6 km Jerusalemista pohjoiseen, nykyisin palestiinalaiskaupunki aivan kaupungin pohjoispuolella Länsirannalla; kartan piste on siellä, 3,5 km Gibeasta pohjoiseen ja 7,7 km Betelistä etelään. Nimi merkitsee ”korkeutta”, ja useat muut paikat kantoivat sitä: Rama Naftalissa ja Asserissa Galileassa, Etelän Raamat Simeonissa ja Ramot-Gilead Jordanin itäpuolella. History Globessa on artikkeli Ramasta; tämä vastaus selvittää, mikä on mikä."
    - "Benjaminin Rama oli rajakaupunki. Debora tuomitsi Israelia ”Deboran-palmun alla, Raaman ja Beetelin välillä”; Israelin Baesa ”linnoitti Raaman, estääkseen ketään pääsemästä Aasan, Juudan kuninkaan, luota tai hänen luokseen”; Jesaja, katsoessaan armeijan tulevan pohjoisesta, huudahtaa: ”Raama vapisee, Saulin Gibea pakenee”. Jerusalemin kukistumisen jälkeen Nebusaradan vapautti Jeremian Raamassa, jonne Babyloniin menevät vangit oli koottu, ja Jeremia kuuli näin: ”Kuule, Raamasta kuuluu valitus, katkera itku: Raakel itkee lapsiansa”, sanat, jotka Matteus soveltaa Betlehemin lapsiin, noin 17 km etelään. Rakelin hauta oli ”Selsahissa Benjaminin rajalla”, tämän lukutavan mukaan lähellä Ramaa, vaikka 1. Mooseksen kirja sijoittaa sen ”Efratan tien varteen, se on Beetlehemiin”."
    - "Samuelin Rama on kiistanalainen. Hänen isänsä asui ”Raamataim-Soofimissa, Efraimin vuoristossa”; Samuel asui ja tuomitsi Raamassa ja hänet haudattiin ”hänen kotipaikkaansa Raamaan”. Monet tunnistavat sen er-Ramiin, kuten kartta tekee; toiset sijoittavat sen Nebi Samwiliin Jerusalemista luoteeseen tai paljon kauemmas luoteeseen Rentisiin, jonka monet myös katsovat Uuden testamentin Arimatiaksi. Kartan vuosi, noin 1050 eaa., on sovinnainen ajankohta: vuosi, jonka kartta antaa Saulin kuninkaaksi tulemiselle, kun Samuel vielä tuomitsi Raamasta."
  vi:
    - "Ra-ma thường được nói đến nhất trong Kinh Thánh, Ra-ma của Bên-gia-min, thường được đồng nhất với làng er-Ram trên một ngọn đồi cạnh con đường sống núi cách Giê-ru-sa-lem khoảng 8,6 km về phía bắc theo đường thẳng, nay là một thị trấn Palestine ngay phía bắc thành phố thuộc Bờ Tây; điểm trên bản đồ nằm ở đó, cách Ghi-bê-a 3,5 km về phía bắc và cách Bê-tên 7,7 km về phía nam. Tên này nghĩa là “nơi cao”, và nhiều nơi khác mang tên ấy: Ra-ma ở Nép-ta-li và ở A-se tại Ga-li-lê, Ra-ma ở miền nam trong đất Si-mê-ôn, và Ra-mốt Ga-la-át phía đông sông Giô-đanh. History Globe có một bài về Ra-ma; câu trả lời này phân biệt nơi nào là nơi nào."
    - "Ra-ma của Bên-gia-min là một thị trấn biên giới. Đê-bô-ra xét đoán Y-sơ-ra-ên “giữa khoảng Ra-ma và Bê-tên, dưới cây chà là Đê-bô-ra”; Ba-ê-sa của Y-sơ-ra-ên “xây đồn lũy Ra-ma, để làm cho dân sự của A-sa, vua Giu-đa, không ra vào”; Ê-sai, nhìn một đạo quân từ phía bắc đi xuống, kêu lên: “Ra-ma run sợ; Ghi-bê-a của Sau-lơ chạy trốn”. Sau khi Giê-ru-sa-lem sụp đổ, Nê-bu-xa-A-đan tha Giê-rê-mi tại Ra-ma, nơi những phu tù bị đưa sang Ba-by-lôn được tập hợp, và Giê-rê-mi nghe: “Tại Ra-ma nghe có tiếng than thở, khóc lóc đắng cay. Ra-chên khóc con cái mình”, những lời Ma-thi-ơ áp dụng cho các trẻ em Bết-lê-hem, cách khoảng 17 km về phía nam. Mộ Ra-chên nằm “trên bờ cõi xứ Bên-gia-min, tại Xết-sa”, gần Ra-ma theo cách đọc ấy, dù sách Sáng thế đặt nó “bên con đường đi về Ê-phơ-rát, tức là Bết-lê-hem”."
    - "Ra-ma của Sa-mu-ên còn tranh luận. Cha ông là người mà Kinh Thánh giới thiệu: “Xưa tại Ra-ma-tha-im-xô-phim, có một người quê ở núi Ép-ra-im, tên là Ên-ca-na”; Sa-mu-ên sống, xét đoán và được chôn “trong nhà người tại Ra-ma”. Nhiều người đồng nhất nó với er-Ram, như bản đồ làm; người khác đặt nó ở Nebi Samwil, phía tây bắc Giê-ru-sa-lem, hoặc xa hơn nhiều về phía tây bắc tại Rentis, nơi nhiều người cũng cho là A-ri-ma-thê trong Tân Ước. Năm của bản đồ, khoảng 1050 TCN, là một mốc quy ước: năm bản đồ ghi cho việc Sau-lơ lên làm vua, trong khi Sa-mu-ên vẫn xét đoán từ Ra-ma."
  ro:
    - "Rama cea mai des avută în vedere în Biblie, Rama lui Beniamin, este identificată de obicei cu satul er-Ram, pe un deal lângă drumul de creastă, la circa 8,6 km nord de Ierusalim în linie dreaptă, azi un oraș palestinian chiar la nord de oraș, în Cisiordania; punctul de pe hartă se află acolo, la 3,5 km nord de Ghibea și la 7,7 km sud de Betel. Numele înseamnă „înălțime”, iar mai multe alte locuri l-au purtat: Rama din Neftali și din Așer, în Galileea, Ramat din sud, în Simeon, și Ramot din Galaad, la est de Iordan. History Globe are un articol despre Rama; răspunsul de față lămurește care este care."
    - "Rama lui Beniamin era un oraș de graniță. Debora judeca Israelul „supt finicul Devora între Rama și între Vetil”; Baeșa al Israelului „a zidit Rama, ca să nu poată nimeni ieșì și intrà la Asa împăratul Iudei”; Isaia, privind o armată care coboară dinspre nord, strigă: „frică va apucà pre Rama cetatea lui Saul, va fugì”. După căderea Ierusalimului, Nebuzaradan l-a eliberat pe Ieremia la Rama, unde erau adunați captivii porniți spre Babilon, iar Ieremia a auzit: „glas în Ramà s’a auzit, plâns și tânguire și jale a Rahilei, care plângeà pre fiii săi”, cuvinte pe care Matei le aplică copiilor din Betleem, aflat la circa 17 km spre sud. Mormântul Rahelei se afla în hotarul lui Beniamin, la Țelțah, aproape de Rama, după această citire, deși Geneza îl pune „în calea Efratului, acesta este Vitleim”."
    - "Rama lui Samuel este disputată. Tatăl lui venea din „Armatem-Sifa din muntele Efraim”; Samuel a locuit, a judecat și a fost îngropat „în casa lui în Armatem”. Mulți o identifică cu er-Ram, cum face harta; alții o plasează la Nebi Samwil, la nord-vest de Ierusalim, sau mult mai departe spre nord-vest, la Rentis, pe care mulți îl socotesc și Arimateea Noului Testament. Anul de pe hartă, circa 1050 î.Hr., este un reper convențional: anul pe care îl dă harta pentru urcarea lui Saul pe tron, în timp ce Samuel încă judeca de la Rama."
  bg:
    - "Рама, която Библията най-често има предвид, Рама във Вениаминовата земя, обикновено се отъждествява със село ер-Рам на хълм до пътя по билото, на около 8,6 км северно от Йерусалим по права линия, днес палестински град точно на север от Йерусалим в Западния бряг; точката на картата стои там, на 3,5 км северно от Гива и на 7,7 км южно от Ветил. Името означава „височина“ и го носеха още няколко места: Рама в Нефталим и в Асир в Галилея, южният Рамат в Симеон и Рамот Галаадски източно от Йордан. В History Globe има статия за Рама; този отговор изяснява кое място кое е."
    - "Рама във Вениаминовата земя беше граничен град. Девора съдеше Израил „под финика на Девора, между Рама и Ветил“; Вааса Израилски „съгради Рама, за да не остави никого да излазя нито да влазя при Аса Юдиния цар“; Исаия, гледайки как една войска слиза от север, възклицава: „Рама се устраши: Гавая Саулова се разбяга“. След падането на Йерусалим Навузардан освободи Йеремия в Рама, където се събираха пленниците за Вавилон, а Йеремия чу: „Глас се чу в Рама, Ридание и горко плакане: Рахил оплакваше чадата си“ — думи, които Матей прилага към децата на Витлеем, на около 17 км на юг. Гробът на Рахил лежеше „в предела на Вениамина у Селса“, според това четене близо до Рама, макар Битие да го поставя „на пътя на Ефрата, която е Витлеем“."
    - "Рама на Самуил е спорна. Баща му беше „от Раматаимсофим, от гората Ефрем“; Самуил живя, съди и беше погребан „в дома в Рама“. Мнозина я отъждествяват с ер-Рам, както прави картата; други я поставят при Неби Самуил, северозападно от Йерусалим, или много по на северозапад, при Рентис, който мнозина приемат и за новозаветната Ариматея. Годината на картата, около 1050 г. пр.н.е., е условна точка: годината, която картата дава за възцаряването на Саул, когато Самуил все още съдеше от Рама."
