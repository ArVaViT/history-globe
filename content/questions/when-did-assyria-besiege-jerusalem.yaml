id: when-did-assyria-besiege-jerusalem
question:
  en: "When did Assyria besiege Jerusalem?"
  ru: "Когда Ассирия осаждала Иерусалим?"
  uk: "Коли Ассирія облягала Єрусалим?"
  es: "¿Cuándo asedió Asiria Jerusalén?"
  pt: "Quando a Assíria sitiou Jerusalém?"
  de: "Wann belagerte Assyrien Jerusalem?"
  fr: "Quand l’Assyrie a-t-elle assiégé Jérusalem ?"
  pl: "Kiedy Asyria oblegała Jerozolimę?"
  it: "Quando l’Assiria assediò Gerusalemme?"
  nl: "Wanneer belegerde Assyrië Jeruzalem?"
  cs: "Kdy Asýrie oblehla Jeruzalém?"
  sv: "När belägrade Assyrien Jerusalem?"
  nb: "Når beleiret Assyria Jerusalem?"
  tl: "Kailan kinubkob ng Asiria ang Jerusalem?"
  da: "Hvornår belejrede Assyrien Jerusalem?"
  sr: "Када је Асирија опсела Јерусалим?"
answer:
  en:
    - "In 701 BC, when Sennacherib king of Assyria marched against Hezekiah of Judah, took the fortified cities of the country, besieged Lachish and sent his army against Jerusalem. The city was not taken. The year is fixed by Sennacherib's own annals, which call this his third campaign; the Bible dates it to the fourteenth year of Hezekiah."
    - '"Now in the fourteenth year of king Hezekiah did Sennacherib king of Assyria come up against all the fenced cities of Judah, and took them." Hezekiah sent to him at Lachish, about 45 km south-west of Jerusalem, confessing "I have offended", and paid three hundred talents of silver and thirty of gold; but the king of Assyria sent Tartan, Rabsaris and Rab-shakeh "from Lachish to king Hezekiah with a great host against Jerusalem", and they stood by the conduit of the upper pool and mocked the city from below its wall. Isaiah promised that the king would not enter the city, and "it came to pass that night, that the angel of the LORD went out, and smote in the camp of the Assyrians an hundred fourscore and five thousand ... So Sennacherib king of Assyria departed, and went and returned, and dwelt at Nineveh."'
    - 'Sennacherib tells the same campaign from the other side on his prisms: he shut Hezekiah up in Jerusalem "like a bird in a cage", set up blockades against him and took tribute, but claims no capture of the city. At Nineveh he lined a room of his palace with reliefs of the siege of Lachish, and at Lachish excavators have found the burned city and the Assyrian siege ramp, the only Assyrian one yet found. Hezekiah also brought the waters of Gihon into the city by a tunnel, usually dated to the years before the siege; its inscription survives. The start of Hezekiah''s reign is disputed (about 729 or 715 BC), so how his fourteenth year fits 701 is a known difficulty. Sennacherib was murdered in 681 BC, by two of his sons according to 2 Kings and by “his son” according to the Babylonian Chronicle, and Jerusalem stood for about another 115 years until Babylon took it in 587 or 586 BC.'
  ru:
    - "В 701 г. до н. э., когда Сеннахирим, царь Ассирийский, пошёл на Езекию, царя Иудейского, взял укреплённые города страны, осадил Лахис и послал войско на Иерусалим. Город взят не был. Год твёрдо установлен по анналам самого Сеннахирима, которые называют этот поход третьим; Библия относит его к четырнадцатому году Езекии."
    - "«В четырнадцатый год царя Езекии, пошел Сеннахирим, царь Ассирийский, против всех укрепленных городов Иуды и взял их». Езекия послал к нему в Лахис, примерно в 45 км к юго-западу от Иерусалима, со словами «виновен я» и заплатил триста талантов серебра и тридцать золота; но царь Ассирийский послал Тартана, Рабсариса и Рабсака «из Лахиса к царю Езекии с большим войском в Иерусалим», и они стали у водопровода верхнего пруда и поносили город из-под его стены. Исаия обещал, что царь не войдёт в город, и «случилось в ту ночь: пошел Ангел Господень и поразил в стане Ассирийском сто восемьдесят пять тысяч ... И отправился, и пошел, и возвратился Сеннахирим, царь Ассирийский, и жил в Ниневии»."
    - "Сеннахирим рассказывает о том же походе с другой стороны на своих призмах: он запер Езекию в Иерусалиме, «как птицу в клетке», поставил против него заслоны и взял дань, но не говорит о взятии города. В Ниневии он украсил зал своего дворца рельефами осады Лахиса, а в Лахисе археологи нашли сожжённый город и ассирийскую осадную насыпь — единственную ассирийскую, найденную до сих пор. Езекия также провёл воды Гиона в город по тоннелю, который обычно относят к годам перед осадой; надпись из него сохранилась. Начало царствования Езекии спорно (около 729 или 715 г. до н. э.), и как его четырнадцатый год соотнести с 701 г. — известная трудность. В 681 г. до н. э. Сеннахирим был убит: по 4-й книге Царств — двумя сыновьями, по Вавилонской хронике — «своим сыном», а Иерусалим простоял ещё около 115 лет, пока Вавилон не взял его в 587 или 586 г. до н. э."
  uk:
    - "701 р. до н. е., коли Сінаххеріб, цар Ассирії, рушив проти Єзекії Юдейського, узяв укріплені міста країни, облягав Лахіш і послав своє військо проти Єрусалиму. Місто взято не було. Рік установлено власними аналами Сінаххеріба, які називають цей похід його третім; Біблія датує його чотирнадцятим роком Єзекії."
    - "«У чотирнайцятому роцї царя Езекії двинув Сеннахирим, царь Ассирийський, проти всїх утверджених городів Юдиних та й поопановував їх». Єзекія послав до нього в Лахіш, приблизно за 45 км на південний захід від Єрусалиму, визнаючи: «Я провинився», — і заплатив триста талантів срібла й тридцять талантів золота; але цар Ассирії послав Тартана, Рабсариса і Рабсака «з Лахиса з великою військовою потугою до короля Езекії в Ерусалим», і вони стали біля водогону верхнього ставу й глумилися з міста під його муром. Ісая обіцяв, що цар не ввійде в місто, і «сталось: однієї ночі прийшов ангел Господень та й положив трупом ув Ассирийському таборі сто вісїмдесять і пять тисяч … І рушив Сеннахирим, царь Ассирийський, та й пійшов і вернувсь, та й седїв у Ниневиї»."
    - "Сінаххеріб розповідає про той самий похід з іншого боку на своїх призмах: він замкнув Єзекію в Єрусалимі «як птаха в клітці», влаштував проти нього облогові споруди й узяв данину, але не заявляє про взяття міста. У Ніневії він прикрасив кімнату свого палацу рельєфами облоги Лахіша, а в Лахіші археологи знайшли спалене місто й ассирійський облоговий насип, єдиний ассирійський, знайдений дотепер. Єзекія також провів води Гіхону в місто тунелем, який зазвичай датують роками перед облогою; його напис зберігся. Початок царювання Єзекії дискусійний (близько 729 або 715 р. до н. е.), тож як чотирнадцятий рік вписується в 701 — відома складність. Сінаххеріба було вбито 681 р. до н. е., двома з його синів за Другою книгою Царів і «сином» за Вавилонською хронікою, а Єрусалим простояв ще приблизно 115 років, поки Вавилон не взяв його 587 або 586 р. до н. е."
  es:
    - "En el 701 a. C., cuando Senaquerib, rey de Asiria, marchó contra Ezequías de Judá, tomó las ciudades fortificadas del país, asedió Laquis y envió su ejército contra Jerusalén. La ciudad no fue tomada. El año lo fijan los propios anales de Senaquerib, que llaman a esta su tercera campaña; la Biblia la fecha en el año catorce de Ezequías."
    - "«Y á los catorce años del rey Ezechîas, subió Sennachêrib rey de Asiria contra todas las ciudades fuertes de Judá, y tomólas». Ezequías envió a decirle en Laquis, a unos 45 km al suroeste de Jerusalén, confesando «Yo he pecado», y pagó trescientos talentos de plata y treinta de oro; pero el rey de Asiria envió a Tartán, Rabsaris y Rabsaces «desde Lachîs contra Jerusalem... con un grande ejército», y estos se detuvieron junto al conducto del estanque de arriba y se burlaron de la ciudad desde el pie de su muro. Isaías prometió que el rey no entraría en la ciudad, y «aconteció que la misma noche salió el ángel de Jehová, é hirió en el campo de los Asirios ciento ochenta y cinco mil... Entonces Sennachêrib, rey de Asiria se partió, y se fué y tornó á Nínive, donde se estuvo»."
    - "Senaquerib la cuenta desde el otro lado en sus prismas: encerró a Ezequías en Jerusalén «como a un pájaro en una jaula», levantó bloqueos y recibió tributo, pero no se atribuye la captura de la ciudad. En Nínive revistió una sala de su palacio con relieves del asedio de Laquis, y en Laquis se han hallado la ciudad quemada y la rampa de asedio asiria, la única asiria conocida. Ezequías hizo entrar las aguas del Gihón en la ciudad por un túnel, que suele fecharse en los años anteriores al asedio; se conserva su inscripción. El comienzo del reinado de Ezequías se discute (hacia el 729 o el 715 a. C.); cómo encaja su año catorce con el 701 es dificultad conocida. Senaquerib fue asesinado en el 681 a. C., por dos de sus hijos según 2 Reyes y por «su hijo» según la Crónica babilónica, y Jerusalén resistió unos 115 años más, hasta que Babilonia la tomó en el 587 o 586 a. C."
  pt:
    - "Em 701 a.C., quando Senaqueribe, rei da Assíria, marchou contra Ezequias de Judá, tomou as cidades fortificadas do país, sitiou Laquis e enviou seu exército contra Jerusalém. A cidade não foi tomada. O ano é fixado pelos próprios anais de Senaqueribe, que chamam essa campanha de a terceira; a Bíblia a data no décimo quarto ano de Ezequias."
    - "“No décimo quarto ano do rei Ezequias, Senaqueribe, rei da Assíria, subiu contra todas as cidades fortificadas de Judá e as tomou.” Ezequias lhe enviou mensageiros em Laquis, a cerca de 45 km a sudoeste de Jerusalém, confessando “Eu te ofendi”, e pagou trezentos talentos de prata e trinta de ouro; mas o rei da Assíria enviou Tartã, Rabe-Saris e Rabsaqué “de Laquis ao rei Ezequias, com um grande exército para Jerusalém”, e eles pararam junto ao aqueduto do tanque superior e zombaram da cidade de baixo de sua muralha. Isaías prometeu que o rei não entraria na cidade, e “naquela noite, o anjo do SENHOR saiu e feriu cento e oitenta e cinco mil no acampamento dos assírios”… “Então Senaqueribe, rei da Assíria, partiu, voltou para casa e viveu em Nínive.”"
    - "Senaqueribe conta a mesma campanha do outro lado em seus prismas: fechou Ezequias em Jerusalém “como um pássaro numa gaiola”, cercou-o e recebeu tributo, mas não alega ter capturado a cidade. Em Nínive revestiu uma sala do palácio com relevos do cerco de Laquis, e em Laquis os escavadores acharam a cidade queimada e a rampa de cerco assíria, a única já encontrada. Ezequias também trouxe as águas do Giom para dentro da cidade por um túnel, geralmente datado dos anos anteriores ao cerco; sua inscrição subsiste. O começo do reinado de Ezequias é disputado (cerca de 729 ou 715 a.C.), de modo que o encaixe do seu décimo quarto ano em 701 é dificuldade conhecida. Senaqueribe foi assassinado em 681 a.C., por dois de seus filhos segundo 2 Reis e por “seu filho” segundo a Crônica Babilônica, e Jerusalém resistiu mais uns 115 anos, até que Babilônia a tomou em 587 ou 586 a.C."
  de:
    - "Im Jahr 701 v. Chr., als Sanherib, der König von Assyrien, gegen Hiskia von Juda zog, die festen Städte des Landes einnahm, Lachisch belagerte und sein Heer gegen Jerusalem sandte. Die Stadt wurde nicht eingenommen. Das Jahr steht durch Sanheribs eigene Annalen fest, die dies seinen dritten Feldzug nennen; die Bibel datiert es in das vierzehnte Jahr Hiskias."
    - "„Im vierzehnten Jahr aber des Königs Hiskia zog herauf Sanherib, der König von Assyrien, wider alle festen Städte Juda's und nahm sie ein.“ Hiskia sandte zu ihm nach Lachisch, etwa 45 km südwestlich von Jerusalem, und ließ ihm sagen: „Ich habe mich versündigt“, und zahlte dreihundert Talente Silber und dreißig Talente Gold; aber der König von Assyrien sandte den Tartan, den Rabsaris und den Rabschake „von Lachis zum König Hiskia mit großer Macht gen Jerusalem“, und sie hielten an der Wasserleitung des oberen Teiches und höhnten die Stadt von unterhalb ihrer Mauer. Jesaja verhieß, der König werde nicht in die Stadt kommen, und „in derselben Nacht fuhr aus der Engel des HERRN und schlug im Lager von Assyrien hundertfünfundachtzigtausend Mann ... Also brach Sanherib, der König von Assyrien, auf und zog weg und kehrte um und blieb zu Ninive.“"
    - "Sanherib erzählt denselben Feldzug auf seinen Prismen aus seiner Sicht: Hiskia habe er „wie einen Vogel im Käfig“ in Jerusalem eingeschlossen, Belagerungswerke gegen ihn errichtet und Tribut genommen, beansprucht aber keine Einnahme. In Ninive schmückte er einen Palastraum mit Reliefs der Belagerung von Lachisch; dort fanden Ausgräber die verbrannte Stadt und die einzige bisher entdeckte assyrische Belagerungsrampe. Hiskias Tunnel, der das Wasser des Gihon in die Stadt leitete, datiert man meist davor; seine Inschrift ist erhalten. Hiskias Regierungsbeginn ist umstritten (etwa 729 oder 715 v. Chr.), wie sein vierzehntes Jahr zu 701 passt, bleibt schwierig. Sanherib wurde 681 v. Chr. ermordet, nach 2. Könige von zwei Söhnen, nach der Babylonischen Chronik von „seinem Sohn“; Jerusalem stand noch etwa 115 Jahre, bis Babylon es 587/586 v. Chr. einnahm."
  fr:
    - "En 701 av. J.-C., quand Sanchérib, roi d’Assyrie, marcha contre Ézéchias de Juda, prit les villes fortes du pays, assiégea Lakis et envoya son armée contre Jérusalem. La ville ne fut pas prise. L’année est fixée par les annales mêmes de Sanchérib, qui y voient sa troisième campagne ; la Bible la date de la quatorzième année d’Ézéchias."
    - "« La quatorzième année du roi Ézéchias, Sanchérib, roi d’Assyrie, monta contre toutes les villes fortes de Juda, et s’en empara. » Ézéchias lui envoya dire à Lakis, à environ 45 km au sud-ouest de Jérusalem : « J’ai commis une faute ! » et paya trois cents talents d’argent et trente d’or ; mais le roi d’Assyrie envoya « de Lakis à Jérusalem, vers le roi Ézéchias, Tharthan, Rab-Saris et Rabschaké avec une puissante armée », qui s’arrêtèrent à l’aqueduc de l’étang supérieur et raillèrent la ville depuis le pied de son mur. Ésaïe promit que le roi n’entrerait pas dans la ville, et « cette nuit-là, l’ange de l’Éternel sortit, et frappa dans le camp des Assyriens cent quatre-vingt-cinq mille hommes … Alors Sanchérib, roi d’Assyrie, leva son camp, partit et s’en retourna ; et il resta à Ninive »."
    - "Sanchérib raconte la même campagne sur ses prismes : il enferma Ézéchias dans Jérusalem « comme un oiseau en cage », éleva des retranchements contre lui et leva un tribut, sans revendiquer la prise de la ville. À Ninive, une salle de son palais porte des reliefs du siège de Lakis ; sur place, les fouilleurs ont trouvé la ville brûlée et la rampe de siège assyrienne, la seule connue. Ézéchias amena aussi les eaux du Guihon dans la ville par un tunnel, d’ordinaire antérieur au siège ; son inscription demeure. Le début du règne d’Ézéchias est discuté (vers 729 ou 715 av. J.-C.), si bien que la façon dont sa quatorzième année s’accorde avec 701 est une difficulté connue. Sanchérib fut assassiné en 681 av. J.-C., par deux fils selon 2 Rois, par « son fils » selon la Chronique babylonienne, et Jérusalem tint encore environ 115 ans, jusqu’à sa prise par Babylone en 587 ou 586 av. J.-C."
  pl:
    - "W 701 p.n.e., gdy Sennacheryb, król Asyrii, wyruszył przeciw Ezechiaszowi z Judy, zdobył warowne miasta kraju, oblegał Lakisz i posłał wojsko przeciw Jerozolimie. Miasta nie zdobyto. Rok ten wyznaczają własne roczniki Sennacheryba, które nazywają to jego trzecią wyprawą; Biblia datuje ją na czternasty rok Ezechiasza."
    - "„Potem czternastego roku króla Ezechyjasza ruszył się Sennacheryb, król Assyryjski, przeciw wszystkim miastom Judzkim obronnym, i wziął je.” Ezechiasz posłał do niego do Lakisz, około 45 km na południowy zachód od Jerozolimy, wyznając: „Zgrzeszyłem”, i zapłacił trzysta talentów srebra i trzydzieści złota; ale król Asyrii posłał Tartana, Rabsarysa i Rabszakego „z Lachys do króla Ezechyjasza z wielkiem wojskiem do Jeruzalemu”, a oni stanęli przy rurach górnej sadzawki i szydzili z miasta. Izajasz obiecał, że król do miasta nie wejdzie: „I stało się onej nocy, że wyszedł Anioł Pański, a pobił w obozie Assyryjskim sto ośmdziesiąt i pięć tysięcy… Przetoż ruszywszy się odjechał i wrócił się Seneacheryb, król Assyryjski, a mieszkał w Niniwe.”"
    - "Sennacheryb opowiada tę wyprawę z drugiej strony na swoich graniastosłupach: zamknął Ezechiasza w Jerozolimie „jak ptaka w klatce”, wzniósł przeciw niemu zapory oblężnicze i pobrał daninę, ale nie twierdzi, że zdobył miasto. W Niniwie wyłożył komnatę swego pałacu reliefami oblężenia Lakisz, a w Lakisz wykopaliska odsłoniły spalone miasto i asyryjską rampę oblężniczą, jedyną znalezioną. Ezechiasz sprowadził też wody Gichonu do miasta tunelem, zwykle datowanym na lata przed oblężeniem; jego inskrypcja się zachowała. Początek panowania Ezechiasza jest sporny (około 729 lub 715 p.n.e.), więc zgranie jego czternastego roku z 701 jest znaną trudnością. Sennacheryb został zamordowany w 681 p.n.e., według 2 Księgi Królewskiej przez dwóch synów, a według Kroniki Babilońskiej przez „jego syna”, a Jerozolima stała jeszcze około 115 lat, aż zdobył ją Babilon w 587 lub 586 p.n.e."
  it:
    - "Nel 701 a.C., quando Sennacherib, re d’Assiria, marciò contro Ezechia di Giuda, prese le città fortificate del paese, assediò Lachis e mandò il suo esercito contro Gerusalemme. La città non fu presa. L’anno è fissato dagli stessi annali di Sennacherib, che la chiamano la sua terza campagna; la Bibbia la data al quattordicesimo anno di Ezechia."
    - "«Or il quattordicesimo anno del re Ezechia, Sennacherib, re d’Assiria, salì contro tutte le città fortificate di Giuda, e le prese». Ezechia mandò a dirgli a Lachis, a circa 45 km a sud-ovest di Gerusalemme, «Ho mancato», e pagò trecento talenti d’argento e trenta d’oro; ma il re d’Assiria «mandò ad Ezechia da Lakis a Gerusalemme, Tartan, Rabsaris e Rabshaké con un grande esercito», ed essi si fermarono presso l’acquedotto dello stagno superiore e schernirono la città da sotto le sue mura. Isaia promise che il re non sarebbe entrato nella città, e «quella stessa notte avvenne che l’angelo dell’Eterno uscì e colpì nel campo degli Assiri cent’ottantacinquemila uomini … Allora Sennacherib re d’Assiria levò il campo, partì e se ne tornò a Ninive, dove rimase»."
    - "Sennacherib racconta la stessa campagna dall’altra parte sui suoi prismi: rinchiuse Ezechia in Gerusalemme «come un uccello in gabbia», pose blocchi contro di lui e riscosse tributo, ma non rivendica la presa della città. A Ninive ornò una sala del palazzo con rilievi dell’assedio di Lachis; a Lachis gli scavi hanno trovato la città bruciata e l’unica rampa d’assedio assira finora scoperta. Ezechia portò in città anche le acque del Ghicon con un tunnel, di solito datato a prima dell’assedio; la sua iscrizione è conservata. L’inizio del regno di Ezechia è discusso (circa 729 o 715 a.C.), perciò accordare il suo quattordicesimo anno con il 701 è una difficoltà nota. Sennacherib fu assassinato nel 681 a.C., da due figli secondo 2 Re e da «suo figlio» secondo la Cronaca babilonese, e Gerusalemme durò ancora circa 115 anni, finché Babilonia la prese nel 587 o 586 a.C."
  nl:
    - "In 701 v.Chr., toen Sanherib, de koning van Assyrië, tegen Chizkia van Juda optrok, de vaste steden van het land innam, Lachis belegerde en zijn leger naar Jeruzalem zond. De stad werd niet ingenomen. Het jaar staat vast door Sanheribs eigen annalen, die dit zijn derde veldtocht noemen; de Bijbel dateert het in het veertiende jaar van Chizkia."
    - "“In het veertiende jaar van den koning Hizkia kwam Sanherib, de koning van Assyrie, op tegen alle vaste steden van Juda, en nam ze in.” Chizkia zond naar hem te Lachis, ongeveer 45 km ten zuidwesten van Jeruzalem, en beleed: “Ik heb gezondigd”, en betaalde driehonderd talenten zilver en dertig talenten goud; maar de koning van Assyrië zond Tartan, Rabsaris en Rabsake “van Lachis tot den koning Hizkia, met een zwaar heir naar Jeruzalem”, en zij bleven staan bij de watergang van de bovenste vijver en bespotten de stad vanaf de voet van haar muur. Jesaja beloofde dat de koning de stad niet zou binnenkomen, en “het geschiedde dan in dienzelven nacht, dat de Engel des HEEREN uitvoer, en sloeg in het leger van Assyrie honderd vijf en tachtig duizend … Zo vertrok Sanherib, de koning van Assyrie, en toog henen, en keerde weder; en hij bleef te Nineve.”"
    - "Sanherib vertelt dezelfde veldtocht op zijn prisma’s: hij sloot Chizkia in Jeruzalem op “als een vogel in een kooi”, richtte blokkades op en nam schatting, maar beweert de stad niet te hebben ingenomen. In Nineve bekleedde hij een zaal van zijn paleis met reliëfs van het beleg van Lachis, waar opgravers de verbrande stad en de Assyrische belegeringshelling vonden, de enige tot nu toe. Chizkia leidde ook het water van de Gihon door een tunnel de stad in, gewoonlijk gedateerd vóór het beleg; het opschrift is bewaard. Het begin van Chizkia’s regering is omstreden (ongeveer 729 of 715 v.Chr.), dus hoe zijn veertiende jaar bij 701 past, is een bekend probleem. Sanherib werd in 681 v.Chr. vermoord, door twee zonen volgens 2 Koningen en door “zijn zoon” volgens de Babylonische kroniek, en Jeruzalem bleef nog ongeveer 115 jaar staan tot Babylon het in 587 of 586 v.Chr. innam."
  cs:
    - "Roku 701 př. n. l., kdy asyrský král Senacherib vytáhl proti Chizkijášovi Judskému, dobyl opevněná města země, oblehl Lachiš a poslal vojsko proti Jeruzalému. Město dobyto nebylo. Rok je určen Senacheribovými vlastními anály, které toto tažení nazývají jeho třetím; Bible je klade do čtrnáctého roku Chizkijášova."
    - "„Potom čtrnáctého léta krále Ezechiáše přitáhl Senacherib král Assyrský proti všechněm městům Judským hrazeným, a zdobýval jich.“ Chizkijáš k němu poslal do Lachiše, asi 45 km jihozápadně od Jeruzaléma, s vyznáním „Zhřešilť jsem“, a zaplatil tři sta talentů stříbra a třicet zlata; ale asyrský král poslal Tartana, Rabsara a Rabsaka „z Lachis k králi Ezechiášovi s vojskem velikým k Jeruzalému“, a ti se postavili u struhy horního rybníka a pod hradbami se městu posmívali. Izajáš zaslíbil, že král do města nevejde, a „stalo se té noci, že vyšel anděl Hospodinův, a zbil v vojště Assyrském sto osmdesáte pět tisíců … Pročež odjel a utekl Senacherib král Assyrský, a navrátiv se, bydlil v Ninive.“"
    - "Senacherib vypráví totéž tažení z druhé strany na svých hranolech: Chizkijáše zavřel v Jeruzalémě „jako ptáka v kleci“, postavil proti němu obléhací stavby a vzal tribut, ale dobytí města si nenárokuje. V Ninive vyzdobil jednu místnost paláce reliéfy obléhání Lachiše a v Lachiši vykopávky odkryly spálené město a asyrský obléhací násep, jediný dosud nalezený. Chizkijáš také přivedl vody Gichónu do města tunelem, obvykle datovaným do let před obléháním; jeho nápis se dochoval. Počátek Chizkijášovy vlády je sporný (asi 729 nebo 715 př. n. l.), takže jak jeho čtrnáctý rok zapadá do roku 701, je známá obtíž. Senacherib byl zavražděn roku 681 př. n. l., podle Druhé knihy Královské dvěma ze svých synů a podle babylonské kroniky „jeho synem“, a Jeruzalém stál ještě asi 115 let, než jej Babylón dobyl roku 587 nebo 586 př. n. l."
  sv:
    - "År 701 f.Kr., när Sanherib, kung av Assyrien, tågade mot Hiskia av Juda, intog landets befästa städer, belägrade Lakish och sände sin här mot Jerusalem. Staden intogs inte. Året är fastställt av Sanheribs egna annaler, som kallar detta hans tredje fälttåg; Bibeln daterar det till Hiskias fjortonde år."
    - "”Och i konung Hiskias fjortonde regeringsår drog Sanherib, konungen i Assyrien, upp och angrep alla befästa städer i Juda och intog dem.” Hiskia sände till honom i Lakish, omkring 45 km sydväst om Jerusalem, och erkände: ”Jag har försyndat mig”, och betalade tre hundra talenter silver och trettio talenter guld; men Assyriens kung ”sände från Lakis åstad Tartan, Rab-Saris och Rab-Sake med en stor här mot konung Hiskia i Jerusalem”, och de stannade vid Övre dammens vattenledning och hånade staden från under dess mur. Jesaja lovade att kungen inte skulle komma in i staden, och ”samma natt gick HERRENS ängel ut och slog i assyriernas läger ett hundra åttiofem tusen man ... Då bröt Sanherib, konungen i Assyrien, upp och tågade tillbaka; och han stannade sedan i Nineve.”"
    - "Sanherib berättar samma fälttåg från andra sidan på sina prismor: han stängde in Hiskia i Jerusalem ”som en fågel i en bur”, reste spärrar mot honom och tog tribut, men gör inte anspråk på att ha intagit staden. I Nineve kläddes ett rum i hans palats med reliefer av belägringen av Lakish, och i Lakish har utgrävare funnit den brända staden och den assyriska belägringsrampen, den enda assyriska som hittills har hittats. Hiskia ledde också Gihons vatten in i staden genom en tunnel, vanligen daterad före belägringen; dess inskription finns bevarad. Början av Hiskias regering är omstridd (ca 729 eller 715 f.Kr.), så hur hans fjortonde år passar med 701 är en svårighet. Sanherib mördades 681 f.Kr., av två av sina söner enligt 2 Kung och av ”sin son” enligt den babyloniska krönikan, och Jerusalem stod kvar i ca 115 år till dess Babylon intog det 587 eller 586 f.Kr."
  nb:
    - "I 701 f.Kr., da Sankerib, kongen av Assyria, marsjerte mot Hiskia av Juda, inntok landets festningsbyer, beleiret Lakisj og sendte hæren sin mot Jerusalem. Byen ble ikke inntatt. Året er fastlagt av Sankeribs egne annaler, som kaller dette hans tredje felttog; Bibelen daterer det til Hiskias fjortende år."
    - "«I kong Esekias' fjortende år drog kongen i Assyria Sankerib op imot alle Judas faste byer og inntok dem.» Hiskia sendte bud til ham i Lakisj, omtrent 45 km sørvest for Jerusalem, og bekjente «Jeg har syndet», og betalte tre hundre talenter sølv og tretti talenter gull; men kongen av Assyria sendte Tartan, Rabsaris og Rabsake «med en stor hær fra Lakis til kong Esekias i Jerusalem», og de stanset ved vannledningen fra den øvre dam og hånte byen nedenfra muren. Jesaja lovet at kongen ikke skulle komme inn i byen, og «Og samme natt skjedde det at Herrens engel gikk ut og slo hundre og fem og åtti tusen mann i assyrernes leir … Da brøt kongen i Assyria Sankerib op og drog bort og vendte tilbake; og siden holdt han sig i ro i Ninive.»"
    - "Sankerib forteller om samme felttog fra den andre siden på prismene sine: han stengte Hiskia inne i Jerusalem «som en fugl i et bur», reiste skanser mot ham og tok tributt, men hevder ikke å ha tatt byen. I Ninive kledde han et rom i palasset med relieffer av beleiringen av Lakisj, og i Lakisj har utgraverne funnet den brente byen og den assyriske beleiringsrampen, den eneste assyriske som er funnet. Hiskia førte også vannet fra Gihon inn i byen gjennom en tunnel, vanligvis datert til årene før beleiringen; innskriften er bevart. Begynnelsen av Hiskias regjeringstid er omstridt (omkring 729 eller 715 f.Kr.), så hvordan hans fjortende år passer med 701, er en kjent vanskelighet. Sankerib ble myrdet i 681 f.Kr., av to sønner ifølge 2 Kongebok og av «sin sønn» ifølge Den babylonske krønike, og Jerusalem sto i omtrent 115 år til, til Babylon tok det i 587 eller 586 f.Kr."
  tl:
    - "Noong 701 BK, nang magmartsa si Sennacherib na hari sa Asiria laban kay Ezechias ng Juda, kinuha ang mga bayang nakukutaan ng bansa, kinubkob ang Lachis at ipinadala ang kaniyang hukbo laban sa Jerusalem. Hindi nakuha ang lungsod. Ang taon ay itinakda ng sariling mga talaan ni Sennacherib, na tumatawag dito na ikatlong kampanya niya; itinatakda ito ng Biblia sa ikalabing apat na taon ni Ezechias."
    - "“Nang ikalabing apat na taon nga ng haring Ezechias ay umahon si Sennacherib na hari sa Asiria laban sa lahat na bayang nakukutaan ng Juda, at pinagsakop.” Nagsugo si Ezechias sa Lachis, mga 45 km sa timog-kanluran ng Jerusalem, na nagsasabi, “Ako'y nagkasala”, at nagbayad ng 300 talentong pilak at 30 talentong ginto; ngunit isinugo ng hari sa Asiria sina Thartan, Rab-saris at Rabsaces “mula sa Lachis na may malaking hukbo sa Jerusalem”, at nagsitayo sila sa tabi ng padaluyan ng tubig ng mataas na tipunan at nangutya sa lungsod mula sa ilalim ng pader. Ipinangako ni Isaias na hindi papasok ang hari, at “nangyari, nang gabing yaon, na ang anghel ng Panginoon ay lumabas, at nanakit sa kampamento ng mga taga Asiria ng isang daan at walong pu't limang libo … Sa gayo'y umalis si Sennacherib na hari sa Asiria, at yumaon, at bumalik, at tumahan sa Ninive.”"
    - "Isinasalaysay ito ni Sennacherib sa mga prisma niya: ikinulong niya si Ezechias sa Jerusalem “parang ibon sa kulungan”, nagtayo ng mga harang at kumuha ng tributo, ngunit hindi inangking nakuha ito. Sa Ninive, nilagyan niya ng mga relyebe ng pagkubkob sa Lachis ang silid ng palasyo; sa Lachis, natagpuan ang sinunog na lungsod at ang tanging rampang pangkubkob ng Asiria na nakita pa. Dinala ni Ezechias ang tubig ng Gihon sa lungsod sa lagusan, karaniwang itinatakda bago ang pagkubkob; may inskripsiyon pa ito. Pinagtatalunan ang simula ng paghahari niya (mga 729 o 715 BK), kaya suliranin kung paano aangkop sa 701 ang ika-14 na taon niya. Pinaslang si Sennacherib noong 681 BK, ng dalawa niyang anak ayon sa 2 Mga Hari at ng “kaniyang anak” ayon sa Kronikang Babilonio; nanatili ang Jerusalem nang mga 115 taon hanggang kunin ng Babilonia noong 587 o 586 BK."
  da:
    - "I 701 f.Kr., da Sankerib, Assyriens konge, drog imod Hizkija af Juda, indtog landets befæstede byer, belejrede Lakisj og sendte sin hær mod Jerusalem. Byen blev ikke indtaget. Året er fastlagt af Sankeribs egne annaler, som kalder dette hans tredje felttog; Bibelen dater det til Hizkijas fjortende år."
    - "»Og i Kong Ezekias's fjortende Aar drog Senakerib, Kongen af Assyrien, op imod alle Judas faste Stæder og indtog dem.« Hizkija sendte bud til ham i Lakisj, omkring 45 km sydvest for Jerusalem, og bekendte: »Jeg har syndet«, og betalte tre hundrede talenter sølv og tredive guld; men Assyriens konge sendte Tartan, Rabsaris og Rabsjake »fra Lakis til Kong Ezekias med en svar Hær til Jerusalem«, og de stillede sig ved den øverste dams vandledning og hånede byen nedefra under dens mur. Esajas lovede, at kongen ikke ville komme ind i byen, og »det skete i den samme Nat, at Herrens Engel for ud og slog i Assyrernes Lejr Hundrede og fem og firsindstyve Tusinde … Saa rejste Senakerib, Kongen af Assyrien, og drog bort og vendte tilbage og blev i Ninive.«"
    - "Sankerib fortæller samme felttog fra den anden side på sine prismer: han spærrede Hizkija inde i Jerusalem »som en fugl i bur«, anlagde blokader mod ham og tog tribut, men gør ikke krav på at have indtaget byen. I Nineve beklædte han et rum i sit palads med relieffer af belejringen af Lakisj, og i Lakisj har udgravere fundet den brændte by og den assyriske belejringsrampe, den eneste fundne. Hizkija ledte også Gihons vand ind i byen gennem en tunnel, sædvanligvis dateret til årene før belejringen; dens indskrift er bevaret. Hizkijas regeringsstart er omstridt (omkring 729 eller 715 f.Kr.), så hans fjortende års forhold til 701 er en kendt vanskelighed. Sankerib blev myrdet i 681 f.Kr., af to af sine sønner ifølge Anden Kongebog og af »sin søn« ifølge den babyloniske krønike, og Jerusalem stod i omkring 115 år endnu, indtil Babylon indtog det i 587 eller 586 f.Kr."
  sr:
    - "Године 701. п. н. е., кад је Сенахирим, краљ Асирије, кренуо на Језекију, владара Јуде, заузео утврђене градове земље, опсео Лахис и послао војску на Јерусалим. Град није освојен. Годину одређују сами Сенахиримови анали, који ово називају његовим трећим походом; Библија то датира у четрнаесту годину Језекијину."
    - "„А четрнаесте године царовања Језекијиног подиже се Сенахирим, цар асирски на све тврде градове Јудине, и узе их.“ Језекија му је послао у Лахис, око 45 км југозападно од Јерусалима, признајући „Згрешио сам“, и платио триста таланата сребра и тридесет злата; али је краљ асирски послао Тартана, Равсариса и Равсака „из Лахиса к цару Језекији у Јерусалим с великом војском“, а они су стали код јаза горњег језера и ругали се граду испод његовог зида. Исаија је обећао да краљ неће ући у град, и „И исту ноћ анђео Господњи изађе и поби у логору асирском сто и осамдесет и пет хиљада … Те се подиже Сенахирим, цар асирски, и отиде, и вративши се оста у Ниневији.“"
    - "Сенахирим исту кампању прича с друге стране на својим призмама: затворио је Језекију у Јерусалиму „као птицу у кавезу“, подигао опсадне ограде против њега и узео данак, али не тврди да је град заузео. У Ниневији је обложио једну просторију своје палате рељефима опсаде Лахиса, а у Лахису су ископавачи пронашли спаљени град и асирски опсадни насип, једини асирски који је до сада пронађен. Језекија је и воде Гиона довео у град тунелом, који се обично датира у године пре опсаде; његов натпис је сачуван. Почетак Језекијине владавине је спорен (око 729. или 715. п. н. е.), па је питање како се његова четрнаеста година слаже са 701. познат проблем. Сенахирим је убијен 681. п. н. е., по 2. књизи о царевима од двојице својих синова, а по Вавилонској хроници од „свог сина“, и Јерусалим је стајао још око 115 година док га Вавилон није заузео 587. или 586. п. н. е."
