id: when-did-assyria-besiege-jerusalem
question:
  en: "When did Assyria besiege Jerusalem?"
  ru: "Когда Ассирия осаждала Иерусалим?"
  uk: "Коли Ассирія облягала Єрусалим?"
  es: "¿Cuándo asedió Asiria Jerusalén?"
  pt: "Quando a Assíria sitiou Jerusalém?"
  de: "Wann belagerte Assyrien Jerusalem?"
  fr: "Quand l’Assyrie a-t-elle assiégé Jérusalem ?"
answer:
  en:
    - "In 701 BC, when Sennacherib king of Assyria marched against Hezekiah of Judah, took the fortified cities of the country, besieged Lachish and sent his army against Jerusalem. The city was not taken. The year is fixed by Sennacherib's own annals, which call this his third campaign; the Bible dates it to the fourteenth year of Hezekiah."
    - '"Now in the fourteenth year of king Hezekiah did Sennacherib king of Assyria come up against all the fenced cities of Judah, and took them." Hezekiah sent to him at Lachish, about 45 km south-west of Jerusalem, confessing "I have offended", and paid three hundred talents of silver and thirty of gold; but the king of Assyria sent Tartan, Rabsaris and Rab-shakeh "from Lachish to king Hezekiah with a great host against Jerusalem", and they stood by the conduit of the upper pool and mocked the city from below its wall. Isaiah promised that the king would not enter the city, and "it came to pass that night, that the angel of the LORD went out, and smote in the camp of the Assyrians an hundred fourscore and five thousand ... So Sennacherib king of Assyria departed, and went and returned, and dwelt at Nineveh."'
    - 'Sennacherib tells the same campaign from the other side on his prisms: he shut Hezekiah up in Jerusalem "like a bird in a cage", set up blockades against him and took tribute, but claims no capture of the city. At Nineveh he lined a room of his palace with reliefs of the siege of Lachish, and at Lachish excavators have found the burned city and the Assyrian siege ramp, the only Assyrian one yet found. Hezekiah also brought the waters of Gihon into the city by a tunnel, usually dated to the years before the siege; its inscription survives. The start of Hezekiah''s reign is disputed (about 729 or 715 BC), so how his fourteenth year fits 701 is a known difficulty. Sennacherib was murdered in 681 BC, by two of his sons according to 2 Kings and by “his son” according to the Babylonian Chronicle, and Jerusalem stood for about another 115 years until Babylon took it in 587 or 586 BC.'
  ru:
    - "В 701 г. до н. э., когда Сеннахирим, царь Ассирийский, пошёл на Езекию, царя Иудейского, взял укреплённые города страны, осадил Лахис и послал войско на Иерусалим. Город взят не был. Год твёрдо установлен по анналам самого Сеннахирима, которые называют этот поход третьим; Библия относит его к четырнадцатому году Езекии."
    - "«В четырнадцатый год царя Езекии, пошел Сеннахирим, царь Ассирийский, против всех укрепленных городов Иуды и взял их». Езекия послал к нему в Лахис, примерно в 45 км к юго-западу от Иерусалима, со словами «виновен я» и заплатил триста талантов серебра и тридцать золота; но царь Ассирийский послал Тартана, Рабсариса и Рабсака «из Лахиса к царю Езекии с большим войском в Иерусалим», и они стали у водопровода верхнего пруда и поносили город из-под его стены. Исаия обещал, что царь не войдёт в город, и «случилось в ту ночь: пошел Ангел Господень и поразил в стане Ассирийском сто восемьдесят пять тысяч ... И отправился, и пошел, и возвратился Сеннахирим, царь Ассирийский, и жил в Ниневии»."
    - "Сеннахирим рассказывает о том же походе с другой стороны на своих призмах: он запер Езекию в Иерусалиме, «как птицу в клетке», поставил против него заслоны и взял дань, но не говорит о взятии города. В Ниневии он украсил зал своего дворца рельефами осады Лахиса, а в Лахисе археологи нашли сожжённый город и ассирийскую осадную насыпь — единственную ассирийскую, найденную до сих пор. Езекия также провёл воды Гиона в город по тоннелю, который обычно относят к годам перед осадой; надпись из него сохранилась. Начало царствования Езекии спорно (около 729 или 715 г. до н. э.), и как его четырнадцатый год соотнести с 701 г. — известная трудность. В 681 г. до н. э. Сеннахирим был убит: по 4-й книге Царств — двумя сыновьями, по Вавилонской хронике — «своим сыном», а Иерусалим простоял ещё около 115 лет, пока Вавилон не взял его в 587 или 586 г. до н. э."
  uk:
    - "701 р. до н. е., коли Сінаххеріб, цар Ассирії, рушив проти Єзекії Юдейського, узяв укріплені міста країни, облягав Лахіш і послав своє військо проти Єрусалиму. Місто взято не було. Рік установлено власними аналами Сінаххеріба, які називають цей похід його третім; Біблія датує його чотирнадцятим роком Єзекії."
    - "«У чотирнайцятому роцї царя Езекії двинув Сеннахирим, царь Ассирийський, проти всїх утверджених городів Юдиних та й поопановував їх». Єзекія послав до нього в Лахіш, приблизно за 45 км на південний захід від Єрусалиму, визнаючи: «Я провинився», — і заплатив триста талантів срібла й тридцять талантів золота; але цар Ассирії послав Тартана, Рабсариса і Рабсака «з Лахиса з великою військовою потугою до короля Езекії в Ерусалим», і вони стали біля водогону верхнього ставу й глумилися з міста під його муром. Ісая обіцяв, що цар не ввійде в місто, і «сталось: однієї ночі прийшов ангел Господень та й положив трупом ув Ассирийському таборі сто вісїмдесять і пять тисяч … І рушив Сеннахирим, царь Ассирийський, та й пійшов і вернувсь, та й седїв у Ниневиї»."
    - "Сінаххеріб розповідає про той самий похід з іншого боку на своїх призмах: він замкнув Єзекію в Єрусалимі «як птаха в клітці», влаштував проти нього облогові споруди й узяв данину, але не заявляє про взяття міста. У Ніневії він прикрасив кімнату свого палацу рельєфами облоги Лахіша, а в Лахіші археологи знайшли спалене місто й ассирійський облоговий насип, єдиний ассирійський, знайдений дотепер. Єзекія також провів води Гіхону в місто тунелем, який зазвичай датують роками перед облогою; його напис зберігся. Початок царювання Єзекії дискусійний (близько 729 або 715 р. до н. е.), тож як чотирнадцятий рік вписується в 701 — відома складність. Сінаххеріба було вбито 681 р. до н. е., двома з його синів за Другою книгою Царів і «сином» за Вавилонською хронікою, а Єрусалим простояв ще приблизно 115 років, поки Вавилон не взяв його 587 або 586 р. до н. е."
  es:
    - "En el 701 a. C., cuando Senaquerib, rey de Asiria, marchó contra Ezequías de Judá, tomó las ciudades fortificadas del país, asedió Laquis y envió su ejército contra Jerusalén. La ciudad no fue tomada. El año lo fijan los propios anales de Senaquerib, que llaman a esta su tercera campaña; la Biblia la fecha en el año catorce de Ezequías."
    - "«Y á los catorce años del rey Ezechîas, subió Sennachêrib rey de Asiria contra todas las ciudades fuertes de Judá, y tomólas». Ezequías envió a decirle en Laquis, a unos 45 km al suroeste de Jerusalén, confesando «Yo he pecado», y pagó trescientos talentos de plata y treinta de oro; pero el rey de Asiria envió a Tartán, Rabsaris y Rabsaces «desde Lachîs contra Jerusalem... con un grande ejército», y estos se detuvieron junto al conducto del estanque de arriba y se burlaron de la ciudad desde el pie de su muro. Isaías prometió que el rey no entraría en la ciudad, y «aconteció que la misma noche salió el ángel de Jehová, é hirió en el campo de los Asirios ciento ochenta y cinco mil... Entonces Sennachêrib, rey de Asiria se partió, y se fué y tornó á Nínive, donde se estuvo»."
    - "Senaquerib la cuenta desde el otro lado en sus prismas: encerró a Ezequías en Jerusalén «como a un pájaro en una jaula», levantó bloqueos y recibió tributo, pero no se atribuye la captura de la ciudad. En Nínive revistió una sala de su palacio con relieves del asedio de Laquis, y en Laquis se han hallado la ciudad quemada y la rampa de asedio asiria, la única asiria conocida. Ezequías hizo entrar las aguas del Gihón en la ciudad por un túnel, que suele fecharse en los años anteriores al asedio; se conserva su inscripción. El comienzo del reinado de Ezequías se discute (hacia el 729 o el 715 a. C.); cómo encaja su año catorce con el 701 es dificultad conocida. Senaquerib fue asesinado en el 681 a. C., por dos de sus hijos según 2 Reyes y por «su hijo» según la Crónica babilónica, y Jerusalén resistió unos 115 años más, hasta que Babilonia la tomó en el 587 o 586 a. C."
  pt:
    - "Em 701 a.C., quando Senaqueribe, rei da Assíria, marchou contra Ezequias de Judá, tomou as cidades fortificadas do país, sitiou Laquis e enviou seu exército contra Jerusalém. A cidade não foi tomada. O ano é fixado pelos próprios anais de Senaqueribe, que chamam essa campanha de a terceira; a Bíblia a data no décimo quarto ano de Ezequias."
    - "“No décimo quarto ano do rei Ezequias, Senaqueribe, rei da Assíria, subiu contra todas as cidades fortificadas de Judá e as tomou.” Ezequias lhe enviou mensageiros em Laquis, a cerca de 45 km a sudoeste de Jerusalém, confessando “Eu te ofendi”, e pagou trezentos talentos de prata e trinta de ouro; mas o rei da Assíria enviou Tartã, Rabe-Saris e Rabsaqué “de Laquis ao rei Ezequias, com um grande exército para Jerusalém”, e eles pararam junto ao aqueduto do tanque superior e zombaram da cidade de baixo de sua muralha. Isaías prometeu que o rei não entraria na cidade, e “naquela noite, o anjo do SENHOR saiu e feriu cento e oitenta e cinco mil no acampamento dos assírios”… “Então Senaqueribe, rei da Assíria, partiu, voltou para casa e viveu em Nínive.”"
    - "Senaqueribe conta a mesma campanha do outro lado em seus prismas: fechou Ezequias em Jerusalém “como um pássaro numa gaiola”, cercou-o e recebeu tributo, mas não alega ter capturado a cidade. Em Nínive revestiu uma sala do palácio com relevos do cerco de Laquis, e em Laquis os escavadores acharam a cidade queimada e a rampa de cerco assíria, a única já encontrada. Ezequias também trouxe as águas do Giom para dentro da cidade por um túnel, geralmente datado dos anos anteriores ao cerco; sua inscrição subsiste. O começo do reinado de Ezequias é disputado (cerca de 729 ou 715 a.C.), de modo que o encaixe do seu décimo quarto ano em 701 é dificuldade conhecida. Senaqueribe foi assassinado em 681 a.C., por dois de seus filhos segundo 2 Reis e por “seu filho” segundo a Crônica Babilônica, e Jerusalém resistiu mais uns 115 anos, até que Babilônia a tomou em 587 ou 586 a.C."
  de:
    - "Im Jahr 701 v. Chr., als Sanherib, der König von Assyrien, gegen Hiskia von Juda zog, die festen Städte des Landes einnahm, Lachisch belagerte und sein Heer gegen Jerusalem sandte. Die Stadt wurde nicht eingenommen. Das Jahr steht durch Sanheribs eigene Annalen fest, die dies seinen dritten Feldzug nennen; die Bibel datiert es in das vierzehnte Jahr Hiskias."
    - "„Im vierzehnten Jahr aber des Königs Hiskia zog herauf Sanherib, der König von Assyrien, wider alle festen Städte Juda's und nahm sie ein.“ Hiskia sandte zu ihm nach Lachisch, etwa 45 km südwestlich von Jerusalem, und ließ ihm sagen: „Ich habe mich versündigt“, und zahlte dreihundert Talente Silber und dreißig Talente Gold; aber der König von Assyrien sandte den Tartan, den Rabsaris und den Rabschake „von Lachis zum König Hiskia mit großer Macht gen Jerusalem“, und sie hielten an der Wasserleitung des oberen Teiches und höhnten die Stadt von unterhalb ihrer Mauer. Jesaja verhieß, der König werde nicht in die Stadt kommen, und „in derselben Nacht fuhr aus der Engel des HERRN und schlug im Lager von Assyrien hundertfünfundachtzigtausend Mann ... Also brach Sanherib, der König von Assyrien, auf und zog weg und kehrte um und blieb zu Ninive.“"
    - "Sanherib erzählt denselben Feldzug auf seinen Prismen aus seiner Sicht: Hiskia habe er „wie einen Vogel im Käfig“ in Jerusalem eingeschlossen, Belagerungswerke gegen ihn errichtet und Tribut genommen, beansprucht aber keine Einnahme. In Ninive schmückte er einen Palastraum mit Reliefs der Belagerung von Lachisch; dort fanden Ausgräber die verbrannte Stadt und die einzige bisher entdeckte assyrische Belagerungsrampe. Hiskias Tunnel, der das Wasser des Gihon in die Stadt leitete, datiert man meist davor; seine Inschrift ist erhalten. Hiskias Regierungsbeginn ist umstritten (etwa 729 oder 715 v. Chr.), wie sein vierzehntes Jahr zu 701 passt, bleibt schwierig. Sanherib wurde 681 v. Chr. ermordet, nach 2. Könige von zwei Söhnen, nach der Babylonischen Chronik von „seinem Sohn“; Jerusalem stand noch etwa 115 Jahre, bis Babylon es 587/586 v. Chr. einnahm."
  fr:
    - "En 701 av. J.-C., quand Sanchérib, roi d’Assyrie, marcha contre Ézéchias de Juda, prit les villes fortes du pays, assiégea Lakis et envoya son armée contre Jérusalem. La ville ne fut pas prise. L’année est fixée par les annales mêmes de Sanchérib, qui y voient sa troisième campagne ; la Bible la date de la quatorzième année d’Ézéchias."
    - "« La quatorzième année du roi Ézéchias, Sanchérib, roi d’Assyrie, monta contre toutes les villes fortes de Juda, et s’en empara. » Ézéchias lui envoya dire à Lakis, à environ 45 km au sud-ouest de Jérusalem : « J’ai commis une faute ! » et paya trois cents talents d’argent et trente d’or ; mais le roi d’Assyrie envoya « de Lakis à Jérusalem, vers le roi Ézéchias, Tharthan, Rab-Saris et Rabschaké avec une puissante armée », qui s’arrêtèrent à l’aqueduc de l’étang supérieur et raillèrent la ville depuis le pied de son mur. Ésaïe promit que le roi n’entrerait pas dans la ville, et « cette nuit-là, l’ange de l’Éternel sortit, et frappa dans le camp des Assyriens cent quatre-vingt-cinq mille hommes … Alors Sanchérib, roi d’Assyrie, leva son camp, partit et s’en retourna ; et il resta à Ninive »."
    - "Sanchérib raconte la même campagne sur ses prismes : il enferma Ézéchias dans Jérusalem « comme un oiseau en cage », éleva des retranchements contre lui et leva un tribut, sans revendiquer la prise de la ville. À Ninive, une salle de son palais porte des reliefs du siège de Lakis ; sur place, les fouilleurs ont trouvé la ville brûlée et la rampe de siège assyrienne, la seule connue. Ézéchias amena aussi les eaux du Guihon dans la ville par un tunnel, d’ordinaire antérieur au siège ; son inscription demeure. Le début du règne d’Ézéchias est discuté (vers 729 ou 715 av. J.-C.), si bien que la façon dont sa quatorzième année s’accorde avec 701 est une difficulté connue. Sanchérib fut assassiné en 681 av. J.-C., par deux fils selon 2 Rois, par « son fils » selon la Chronique babylonienne, et Jérusalem tint encore environ 115 ans, jusqu’à sa prise par Babylone en 587 ou 586 av. J.-C."
