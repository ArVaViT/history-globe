id: where-did-samson-live
question:
  en: "Where did Samson live and die?"
  ru: "Где жил и погиб Самсон?"
  uk: "Де жив і помер Самсон?"
  es: "¿Dónde vivió y murió Sansón?"
  pt: "Onde viveu e morreu Sansão?"
  de: "Wo lebte und starb Simson?"
  fr: "Où Samson a-t-il vécu et où est-il mort ?"
  pl: "Gdzie mieszkał i umarł Samson?"
  it: "Dove visse e morì Sansone?"
  nl: "Waar woonde Simson, en waar stierf hij?"
  cs: "Kde Samson žil a zemřel?"
  sv: "Var bodde och dog Simson?"
answer:
  en:
    - "Samson's country is the valley of Sorek, where the hills of Judah come down to the coastal plain about 23 km west of Jerusalem, on the border between the tribe of Dan and the Philistines. He was born at Zorah, Tel Tzora on the north side of the valley, and Eshtaol lay less than 3 km away; Beth-shemesh is 3 km across the valley, and Timnah, where he took his Philistine wife, 7 km down the valley at Tel Batash. Lehi, where he fought with the jawbone, is not identified; the map places it nearby. He died at Gaza, 58 km to the south-west, the Philistine city at the edge of the desert, and was buried at home between Zorah and Eshtaol."
    - "Judges begins with “a certain man of Zorah, of the family of the Danites, whose name was Manoah”, and says that the Spirit “began to move him at times in the camp of Dan between Zorah and Eshtaol”. “And Samson went down to Timnath, and saw a woman in Timnath of the daughters of the Philistines”; later “he loved a woman in the valley of Sorek, whose name was Delilah”. At Gaza he “took the doors of the gate of the city, and the two posts, and went away with them, bar and all, and put them upon his shoulders, and carried them up to the top of an hill that is before Hebron”, 60 km and some 900 m up, if the hill is at Hebron. Blinded, he was brought “down to Gaza, and bound him with fetters of brass; and he did grind in the prison house”, and when the house of Dagon fell on the Philistine lords, his brothers “buried him between Zorah and Eshtaol in the buryingplace of Manoah his father”."
    - "The places are real and have been dug. Tel Batash, Timnah, excavated by George Kelm and Amihai Mazar in 1977–1989, was a Philistine town of the twelfth and eleventh centuries BC in the valley below Zorah; Beth-shemesh across the valley was then, its excavators Bunimovitz and Lederman argue, a Canaanite border village; there in 2012 they found a small seal of the period showing a man beside a lion, which they link to a Samson-like tale without claiming it shows Samson. Zorah's name survived in the Arab village of Sar'a until 1948, and Eusebius pointed the village out as Samson's home. Of Gaza's temple nothing is known: the ancient city lies under the modern one. The date of Samson is uncertain, in the eleventh century BC on most reckonings, in the last generations before Saul; the map places him about 1100 BC."
  ru:
    - "Страна Самсона — долина Сорек, где горы Иудеи спускаются к приморской равнине примерно в 23 км к западу от Иерусалима, на границе между коленом Дана и филистимлянами. Он родился в Цоре, на Тель-Цоре по северной стороне долины, а Естаол лежал меньше чем в 3 км; Вефсамис — в 3 км через долину, а Фимнафа, где он взял жену-филистимлянку, — в 7 км вниз по долине, на Тель-Баташе. Лехи, где он бился ослиной челюстью, не отождествлён; карта ставит его рядом. Погиб он в Газе, в 58 км к юго-западу, филистимском городе на краю пустыни, а похоронен дома, между Цорою и Естаолом."
    - "Книга Судей начинает с того, что «был человек из Цоры, от племени Данова, именем Маной», и говорит, что «начал Дух Господень действовать в нем в стане Дановом, между Цорою и Естаолом». «И пошел Самсон в Фимнафу и увидел в Фимнафе женщину из дочерей Филистимских»; позже «полюбил он одну женщину, жившую на долине Сорек; имя ей Далида». В Газе он «схватил двери городских ворот с обоими косяками, поднял их вместе с запором, положил на плечи свои и отнес их на вершину горы, которая на пути к Хеврону» — если гора у самого Хеврона, это 60 км пути и около 900 м подъёма. Ослеплённого, «привели его в Газу и оковали его двумя медными цепями, и он молол в доме узников», а когда дом Дагона рухнул на владельцев филистимских, братья «похоронили его между Цорою и Естаолом, во гробе Маноя, отца его»."
    - "Эти места реальны и раскопаны. Тель-Баташ, Фимнафа, которую копали Джордж Келм и Амихай Мазар в 1977–1989 годах, был филистимским городом XII–XI веков до н. э. в долине ниже Цоры; Вефсамис на другой стороне долины был тогда, по мнению его раскопщиков Буниновица и Ледермана, ханаанейским пограничным селением; там в 2012 году они нашли маленькую печать той эпохи с человеком рядом со львом и связывают её с преданием вроде самсонова, не утверждая, что на ней Самсон. Имя Цоры дожило в арабской деревне Сара до 1948 года, и Евсевий указывал на это селение как на родину Самсона. О храме в Газе ничего не известно: древний город лежит под нынешним. Время Самсона неясно — по большинству подсчётов XI век до н. э., последние поколения перед Саулом; карта помещает его около 1100 г. до н. э."
  uk:
    - "Країна Самсона — долина Сорек, де юдейські пагорби спускаються до прибережної рівнини приблизно за 23 км на захід від Єрусалиму, на кордоні між коліном Дана та филистимлянами. Він народився в Цорі, Тель-Цора на північному боці долини, а Ештаол лежав менш ніж за 3 км; Бет-Шемеш — за 3 км через долину, а Тімна, де він узяв свою филистимську дружину, — за 7 км униз долиною в Тель-Баташі. Леха, де він бився щелепою, не ототожнена; мапа розміщує її поблизу. Він помер у Газі, за 58 км на південний захід, филистимському місті на краю пустелі, і був похований удома між Цорою та Ештаолом."
    - "Книга Суддів вводить «один чоловік із Зореага, з поколїння Данового, на імя Маной», і каже, що «почав дух Господень бути в ньому в таборі Дановому між Зореагом і Естаолом». «І пійшов Самсон у Тимнат, і запізнавсь із Филистійською дївчиною»; пізніше «полюбив він на долинї Сорек вродливу женщину на імя Далила». У Газі він «ухопив обоє крила міських воріт разом з засовом, положив їх собі на плечі та й понїс аж на вершину гори, що стоїть навпроти Геброну», 60 км і близько 900 м угору, якщо гора в Хевроні. Осліплений, він був приведений до Гази: «повели в Газу та й закували в мідяні кайдани, і мусїв він у темницї молоти на жорнах», і коли дім Дагона упав на филистимських князів, його брати «поховали між Зореагою й Естаолом в батьківському гробовищі його батька Маноя»."
    - "Місця справжні й розкопані. Тель-Баташ, Тімна, розкопаний Джорджем Келмом та Аміхаєм Мазаром 1977–1989 рр., був филистимським містом XII–XI ст. до н. е. в долині під Цорою; Бет-Шемеш через долину був тоді, як доводять його дослідники Буніновіц і Ледерман, ханаанським прикордонним селом; там 2012 р. вони знайшли невелику печатку цього періоду із зображенням чоловіка поруч зі львом, яку пов'язують із оповіддю, подібною до Самсонової, не стверджуючи, що вона показує Самсона. Назва Цори збереглася в арабському селі Сара до 1948 р., і Євсевій показував це село як батьківщину Самсона. Про храм Гази нічого не відомо: давнє місто лежить під сучасним. Дата Самсона непевна, за більшістю підрахунків — XI ст. до н. е., в останніх поколіннях перед Саулом; мапа ставить його близько 1100 р. до н. е."
  es:
    - "El país de Sansón es el valle de Sorec, donde las colinas de Judá descienden a la llanura costera, a unos 23 km al oeste de Jerusalén, en la frontera entre la tribu de Dan y los filisteos. Nació en Sora, Tel Tzora, en el lado norte del valle, y Estaol quedaba a menos de 3 km; Bet-semes está a 3 km al otro lado del valle, y Timna, donde tomó a su mujer filistea, a 7 km valle abajo, en Tel Batash. Lehi, donde combatió con la quijada, no está identificada; el mapa la sitúa cerca. Murió en Gaza, a 58 km al suroeste, la ciudad filistea en el borde del desierto, y fue sepultado en su tierra, entre Sora y Estaol."
    - "Jueces comienza con «un hombre de Sora, de la tribu de Dan, el cual se llamaba Manoa», y dice que el Espíritu «comenzó á manifestarse en él en los campamentos de Dan, entre Sora y Esthaol». «Y descendiendo Samsón á Timnah, vió en Timnah una mujer de las hijas de los Filisteos»; más tarde «se enamoró de una mujer en el valle de Sorec, la cual se llamaba Dalila». En Gaza, «tomando las puertas de la ciudad con sus dos pilares y su cerrojo, echóselas al hombro, y fuése, y subióse con ellas á la cumbre del monte que está delante de Hebrón», 60 km y unos 900 m de subida, si el monte está en Hebrón. Cegado, «le llevaron á Gaza; y le ataron con cadenas, para que moliese en la cárcel», y cuando la casa de Dagón cayó sobre los príncipes filisteos, sus hermanos «le sepultaron entre Sora y Esthaol, en el sepulcro de su padre Manoa»."
    - "Los lugares son reales y se han excavado. Tel Batash, Timna, excavada por George Kelm y Amihai Mazar en 1977–1989, era una población filistea de los siglos XII y XI a. C. en el valle bajo Sora; Bet-semes, al otro lado del valle, era entonces, sostienen sus excavadores Bunimovitz y Lederman, una aldea fronteriza cananea; allí hallaron en 2012 un pequeño sello de la época que muestra a un hombre junto a un león, que vinculan con un relato parecido al de Sansón sin afirmar que represente a Sansón. El nombre de Sora sobrevivió en la aldea árabe de Sar'a hasta 1948, y Eusebio señaló la aldea como la patria de Sansón. Del templo de Gaza nada se sabe: la ciudad antigua yace bajo la moderna. La fecha de Sansón es incierta, en el siglo XI a. C. según la mayoría de los cómputos, en las últimas generaciones antes de Saúl; el mapa lo sitúa hacia el 1100 a. C."
  pt:
    - "A terra de Sansão é o vale de Soreque, onde os montes de Judá descem à planície costeira, a cerca de 23 km a oeste de Jerusalém, na fronteira entre a tribo de Dã e os filisteus. Ele nasceu em Zorá, Tel Tzora, no lado norte do vale, e Estaol ficava a menos de 3 km; Bete-Semes está a 3 km, do outro lado do vale, e Timna, onde tomou a mulher filisteia, a 7 km vale abaixo, em Tel Batash. Leí, onde lutou com a queixada, não é identificada; o mapa a põe nas proximidades. Morreu em Gaza, a 58 km a sudoeste, a cidade filisteia na orla do deserto, e foi sepultado em casa, entre Zorá e Estaol."
    - "Juízes começa com “um certo homem de Zorá, da família dos danitas, cujo nome era Manoá”, e diz que o Espírito “começou a movê-lo em Maané-Dã, entre Zorá e Estaol”. “Sansão desceu a Timna, e viu em Timna uma mulher das filhas dos filisteus”; mais tarde “ele se apaixonou por uma mulher no vale de Soreque, cujo nome era Dalila”. Em Gaza “agarrou as portas da entrada da cidade, com as duas colunas, e as arrancou, com tranca e tudo. Ele as colocou sobre os ombros e as levou até o topo da montanha que fica em frente a Hebrom”, a 60 km e uns 900 m acima, se o monte for o de Hebrom. Cego, “levaram-no para Gaza e o prenderam com algemas de bronze; e ele virava o moinho na prisão”, e quando o templo de Dagom caiu sobre os governantes filisteus, seus irmãos “o sepultaram entre Zorá e Estaol, no túmulo de Manoá, seu pai”."
    - "Os lugares são reais e foram escavados. Tel Batash, Timna, escavada por George Kelm e Amihai Mazar em 1977–1989, era uma cidade filisteia dos séculos XII e XI a.C. no vale abaixo de Zorá; Bete-Semes, do outro lado do vale, era então, argumentam seus escavadores Bunimovitz e Lederman, uma aldeia cananeia de fronteira; ali, em 2012, acharam um pequeno selo da época mostrando um homem ao lado de um leão, que ligam a um conto semelhante ao de Sansão sem afirmar que o mostre. O nome de Zorá sobreviveu na aldeia árabe de Sar'a até 1948, e Eusébio apontou a aldeia como a terra de Sansão. Do templo de Gaza nada se sabe: a cidade antiga jaz sob a moderna. A data de Sansão é incerta, no século XI a.C. na maioria dos cálculos, nas últimas gerações antes de Saul; o mapa o situa por volta de 1100 a.C."
  de:
    - "Simsons Land ist das Tal Sorek, wo die Berge Judas zur Küstenebene hinabfallen, etwa 23 km westlich von Jerusalem, an der Grenze zwischen dem Stamm Dan und den Philistern. Er wurde in Zora geboren, Tel Zora auf der Nordseite des Tals, und Eschtaol lag weniger als 3 km entfernt; Bet-Schemesch ist 3 km über das Tal, und Timna, wo er seine philistäische Frau nahm, 7 km talabwärts bei Tel Batasch. Lehi, wo er mit dem Kinnbacken kämpfte, ist nicht identifiziert; die Karte setzt es in die Nähe. Er starb in Gaza, 58 km südwestlich, der Philisterstadt am Rand der Wüste, und wurde daheim zwischen Zora und Eschtaol begraben."
    - "Das Buch der Richter beginnt mit „ein Mann zu Zora von einem Geschlecht der Daniter, mit Namen Manoah“ und sagt, der Geist „fing an, ihn zu treiben im Lager Dan zwischen Zora und Esthaol“. „Simson ging gen Thimnath und sah ein Weib zu Thimnath unter den Töchtern der Philister“; später „gewann er ein Weib lieb am Bach Sorek, die hieß Delila“. In Gaza, „da stand er auf zu Mitternacht und ergriff beide Türen an der Stadt Tor samt den Pfosten und hob sie aus mit den Riegeln und legte sie auf seine Schultern und trug sie hinauf auf die Höhe des Berges vor Hebron“, 60 km und 900 m aufwärts, läge der Berg bei Hebron. Geblendet wurde er „hinab gen Gaza“ geführt, „und banden ihn mit zwei ehernen Ketten, und er mußte mahlen im Gefängnis“, und als Dagons Haus auf die Philisterfürsten fiel, „begruben ihn“ seine Brüder „in seines Vaters Manoahs Grab, zwischen Zora und Esthaol“."
    - "Die Orte sind wirklich und wurden ausgegraben. Tel Batasch, Timna, von George Kelm und Amihai Mazar 1977–1989 ausgegraben, war eine philistäische Stadt des 12. und 11. Jahrhunderts v. Chr. im Tal unter Zora; Bet-Schemesch jenseits des Tals war damals nach Meinung seiner Ausgräber Bunimovitz und Lederman ein kanaanäisches Grenzdorf; dort fanden sie 2012 ein kleines Siegel der Zeit mit einem Mann neben einem Löwen, das sie mit einer simsonähnlichen Erzählung verbinden, ohne zu behaupten, es zeige Simson. Zoras Name überlebte im arabischen Dorf Sara bis 1948, und Eusebius zeigte das Dorf als Simsons Heimat. Vom Tempel in Gaza ist nichts bekannt: Die antike Stadt liegt unter der modernen. Die Zeit Simsons ist unsicher, nach den meisten Berechnungen im 11. Jahrhundert v. Chr., in den letzten Generationen vor Saul; die Karte setzt ihn um 1100 v. Chr."
  fr:
    - "Le pays de Samson est la vallée de Sorek, où les collines de Juda descendent vers la plaine côtière, à environ 23 km à l’ouest de Jérusalem, à la frontière entre la tribu de Dan et les Philistins. Il naquit à Tsorea, Tel Tzora, sur le côté nord de la vallée, et Eschthaol se trouvait à moins de 3 km ; Beth-Schémesch est à 3 km de l’autre côté de la vallée, et Thimna, où il prit sa femme philistine, à 7 km en aval, à Tel Batash. Léchi, où il combattit avec la mâchoire, n’est pas identifiée ; la carte la place à proximité. Il mourut à Gaza, à 58 km au sud-ouest, la ville philistine au bord du désert, et fut enterré chez lui, entre Tsorea et Eschthaol."
    - "Les Juges s’ouvrent sur « un homme de Tsorea, de la famille des Danites, et qui s’appelait Manoach », et que l’Esprit « commença à l’agiter à Machané-Dan, entre Tsorea et Eschthaol ». « Samson descendit à Thimna, et il y vit une femme parmi les filles des Philistins » ; puis « il aima une femme dans la vallée de Sorek. Elle se nommait Delila ». À Gaza, il « saisit les battants de la porte de la ville et les deux poteaux, les arracha avec la barre, les mit sur ses épaules, et les porta sur le sommet de la montagne qui est en face d’Hébron », à 60 km et quelque 900 m plus haut, si la colline est à Hébron. Aveuglé, mené à Gaza, où les Philistins « le lièrent avec des chaînes d’airain. Il tournait la meule dans la prison » ; quand la maison de Dagon s’écroula sur les princes, ses frères « l’enterrèrent entre Tsorea et Eschthaol dans le sépulcre de Manoach, son père »."
    - "Les lieux sont réels et ont été fouillés. Tel Batash, Thimna, fouillé par George Kelm et Amihai Mazar en 1977–1989, était une ville philistine des XIIe et XIe siècles av. J.-C. dans la vallée au-dessous de Tsorea ; Beth-Schémesch, de l’autre côté de la vallée, était alors, soutiennent ses fouilleurs Bunimovitz et Lederman, un village cananéen frontalier ; ils y trouvèrent en 2012 un petit sceau de l’époque montrant un homme à côté d’un lion, qu’ils rattachent à un récit proche de Samson sans prétendre qu’il montre Samson. Le nom de Tsorea survécut dans le village arabe de Sar’a jusqu’en 1948, et Eusèbe y voyait la patrie de Samson. Du temple de Gaza, rien n’est connu : la ville antique gît sous la moderne. La date de Samson est incertaine, XIe siècle av. J.-C. dans la plupart des calculs, dernières générations avant Saül ; la carte le place vers 1100 av. J.-C."
  pl:
    - "Krajem Samsona jest dolina Sorek, gdzie wzgórza Judy schodzą ku równinie nadbrzeżnej, około 23 km na zachód od Jerozolimy, na granicy między plemieniem Dan a Filistynami. Urodził się w Sora, Tel Cora po północnej stronie doliny, a Esztaol leżało w odległości mniejszej niż 3 km; Bet-Szemesz jest 3 km po drugiej stronie doliny, a Timna, gdzie wziął filistyńską żonę, 7 km w dół doliny w Tel Batasz. Lechi, gdzie walczył szczęką, nie zostało zidentyfikowane; mapa umieszcza je w pobliżu. Umarł w Gazie, 58 km na południowy zachód, filistyńskim mieście na skraju pustyni, a pochowano go w domu między Sora a Esztaol."
    - "Księga Sędziów zaczyna się od słów „był mąż niektóry z Saraa, z pokolenia Dan, imieniem Manue” i mówi, że „począł go Duch Pański umacniać w obozie Dan między Saraa i między Estaol”. „Szedł tedy Samson do Tamnaty, a ujrzał tam niewiastę z córek Filistyńskich”; później Samson „się rozmiłował niewiasty w dolinie Sorek, której imię Dalila”. W Gazie „ujął wrota bramy miejskiej ze dwiema podwojami, i wyrwał je z zaworą, i włożył na ramiona swoje, a zaniósł je na wierzch góry, która była przeciw Hebronowi”: 60 km i około 900 m w górę, jeśli góra jest przy Hebronie. Oślepionego „wiedli go do Gazy, związawszy go dwoma miedzianymi łańcuchami, i musiał mleć w domu więźniów”, a gdy dom Dagona runął na filistyńskich książąt, jego bracia „pogrzebli go między Saraa, i między Estaol, w grobie Manue, ojca jego”."
    - "Miejsca są prawdziwe i zostały przekopane. Tel Batasz, Timna, wykopywane przez George'a Kelma i Amihaia Mazara w latach 1977–1989, było filistyńskim miastem z XII i XI wieku p.n.e. w dolinie poniżej Sora; Bet-Szemesz po drugiej stronie doliny było wtedy, jak dowodzą jego badacze Bunimovitz i Lederman, kananejską wsią graniczną; tam w 2012 znaleźli małą pieczęć z tego okresu przedstawiającą człowieka obok lwa, którą wiążą z opowieścią podobną do Samsonowej, nie twierdząc, że przedstawia Samsona. Nazwa Sora przetrwała w arabskiej wsi Sar'a do 1948, a Euzebiusz wskazywał wieś jako dom Samsona. O świątyni w Gazie nic nie wiadomo: starożytne miasto leży pod współczesnym. Data Samsona jest niepewna, w XI wieku p.n.e. według większości rachub, w ostatnich pokoleniach przed Saulem; mapa umieszcza go około 1100 p.n.e."
  it:
    - "Il paese di Sansone è la valle di Sorek, dove le colline di Giuda scendono alla pianura costiera, a circa 23 km a ovest di Gerusalemme, al confine tra la tribù di Dan e i Filistei. Nacque a Zorea, Tel Tzora sul lato nord della valle, ed Estaol distava meno di 3 km; Bet-Semes è a 3 km dall’altra parte della valle, e Timna, dove prese la moglie filistea, a 7 km a valle a Tel Batash. Lechi, dove combatté con la mascella, non è identificata; la mappa la pone nelle vicinanze. Morì a Gaza, a 58 km a sud-ovest, la città filistea al margine del deserto, e fu sepolto in patria tra Zorea ed Estaol."
    - "Giudici comincia con «un uomo di Tsorea, della famiglia dei Daniti, per nome Manoah», e dice che lo spirito dell’Eterno «cominciò ad agitarlo quand’esso era a Mahaneh-Dan, fra Tsorea ed Eshtaol». «Sansone scese a Timnah, e vide quivi una donna tra le figliuole de’ Filistei»; più tardi «s’innamorò di una donna della valle di Sorek, che si chiamava Delila». A Gaza «diè di piglio ai battenti della porta della città e ai due stipiti, li divelse insieme con la sbarra, se li mise sulle spalle, e li portò in cima al monte ch’è dirimpetto a Hebron», 60 km e circa 900 m più in alto, se il monte è a Ebron. Accecato, «lo fecero scendere a Gaza, e lo legarono con catene di rame. Ed egli girava la macina nella prigione», e quando la casa di Dagon crollò sui principi filistei, i suoi fratelli «lo seppellirono fra Tsorea ed Eshtaol nel sepolcro di Manoah suo padre»."
    - "I luoghi sono reali e sono stati scavati. Tel Batash, Timna, scavata da George Kelm e Amihai Mazar nel 1977–1989, era una città filistea dei secoli XII e XI a.C. nella valle sotto Zorea; Bet-Semes dall’altra parte della valle era allora, sostengono i suoi scavatori Bunimovitz e Lederman, un villaggio cananeo di confine; là nel 2012 trovarono un piccolo sigillo dell’epoca con un uomo accanto a un leone, che collegano a un racconto simile a quello di Sansone senza affermare che lo raffiguri. Il nome di Zorea sopravvisse nel villaggio arabo di Sar’a fino al 1948, ed Eusebio indicò il villaggio come la patria di Sansone. Del tempio di Gaza non si sa nulla: la città antica giace sotto quella moderna. La data di Sansone è incerta, XI secolo a.C. secondo la maggior parte dei computi, nelle ultime generazioni prima di Saul; la mappa lo pone intorno al 1100 a.C."
  nl:
    - "Simsons land is het dal van de Sorek, waar het bergland van Juda afdaalt naar de kustvlakte, ongeveer 23 km ten westen van Jeruzalem, op de grens tussen de stam Dan en de Filistijnen. Hij werd geboren in Zora, Tel Tzora aan de noordkant van het dal, en Estaol lag op minder dan 3 km; Beth-Semes ligt 3 km aan de overkant van het dal, en Timna, waar hij zijn Filistijnse vrouw nam, 7 km verder in het dal bij Tel Batash. Lechi, waar hij met de kinnebak streed, is niet geïdentificeerd; de kaart plaatst het in de buurt. Hij stierf te Gaza, 58 km naar het zuidwesten, de Filistijnse stad aan de rand van de woestijn, en werd thuis begraven tussen Zora en Estaol."
    - "Richteren: “een man van Zora, uit het geslacht van een Daniet, wiens naam was Manoach”; de Geest “begon hem bij wijlen te drijven in het leger van Dan, tussen Zora en tussen Esthaol”. “En Simson ging af naar Thimnath, en gezien hebbende een vrouw te Thimnath, van de dochteren der Filistijnen”; later: “dat hij een vrouw lief kreeg, aan de beek Sorek, welker naam was Delila”. Te Gaza: “hij greep de deuren der stadspoort met de beide posten, en nam ze weg met den grendelboom, en leide ze op zijn schouderen, en droeg ze opwaarts op de hoogte des bergs, die in het gezicht van Hebron is”, 60 km, 900 m hoger, mits bij Hebron. Verblind: “zij voerden hem af naar Gaza, en bonden hem met twee koperen ketenen, en hij was malende in het gevangenhuis”; toen Dagons huis op de vorsten viel, begroeven zijn broers hem “tussen Zora en tussen Esthaol, in het graf van zijn vader Manoach”."
    - "De plaatsen bestaan echt en zijn opgegraven. Tel Batash, Timna, door George Kelm en Amihai Mazar in 1977–1989 opgegraven, was een Filistijnse stad uit de 12e en 11e eeuw v.Chr. in het dal onder Zora; Beth-Semes aan de overkant was toen, betogen de opgravers Bunimovitz en Lederman, een Kanaänitisch grensdorp; daar vonden zij in 2012 een klein zegel uit die tijd met een man naast een leeuw, dat zij verbinden met een Simson-achtig verhaal zonder te beweren dat het Simson toont. Zora’s naam bleef tot 1948 bewaard in het Arabische dorp Sar’a, en Eusebius wees het dorp aan als Simsons woonplaats. Over de tempel van Gaza is niets bekend: de oude stad ligt onder de moderne. De datum van Simson is onzeker, op de meeste berekeningen in de 11e eeuw v.Chr., in de laatste generaties vóór Saul; de kaart plaatst hem omstreeks 1100 v.Chr."
  cs:
    - "Samsonova země je údolí Sorek, kde se judské hory snižují k pobřežní pláni, asi 23 km západně od Jeruzaléma, na hranici mezi kmenem Dan a Pelištejci. Narodil se v Corei, Tel Corea na severní straně údolí, a Eštaol leželo méně než 3 km odtud; Bét-šemeš je 3 km přes údolí a Timna, kde si vzal pelištejskou ženu, 7 km dolů údolím v Tel Batáš. Lechi, kde bojoval s čelistí, není ztotožněno; mapa je klade poblíž. Zemřel v Gaze, 58 km jihozápadně, pelištejském městě na okraji pouště, a byl pohřben doma mezi Coreou a Eštaolem."
    - "Kniha soudců začíná „muž jeden z Zaraha, z čeledi Dan, jménem Manue“ a praví: „počal ho Duch Hospodinův ponoukati v Mahane Dan, mezi Zaraha a Estaol“. „Šel pak Samson do Tamnata, a uzřel tam ženu ze dcer Filistinských“; později „zamiloval ženu v údolí Sorek, jejíž jméno bylo Dalila“. V Gaze „pochytiv vrata brány městské s oběma veřejemi a s závorou, vložil na ramena svá a vnesl je na vrch hory, kteráž byla naproti Hebronu“, 60 km a asi 900 m vzhůru, leží-li ta hora u Hebronu. Pelištejci jej oslepili a „dovedše ho do Gázy, svázali jej dvěma řetězy železnými. A mlel v domě vězňů“, a když dům Dagonův padl na pelištejská knížata, jeho bratři „pochovali jej mezi Zaraha a Estaol v hrobě Manue otce jeho“."
    - "Místa jsou skutečná a byla zkoumána. Tel Batáš, Timna, který v letech 1977–1989 vykopávali George Kelm a Amihai Mazar, byl pelištejským městem 12. a 11. století př. n. l. v údolí pod Coreou; Bét-šemeš přes údolí byl tehdy, jak tvrdí jeho vykopavači Bunimovitz a Lederman, kanaánskou pohraniční vesnicí; tam roku 2012 našli malou pečeť z té doby zobrazující muže vedle lva, kterou spojují s příběhem podobným Samsonovu, aniž tvrdí, že zobrazuje Samsona. Jméno Corey přežilo v arabské vesnici Sar'a do roku 1948 a Eusebios ukazoval vesnici jako Samsonův domov. O gazském chrámu nic není známo: starověké město leží pod moderním. Datum Samsonovo je nejisté, podle většiny výpočtů 11. století př. n. l., v posledních generacích před Saulem; mapa jej klade asi na rok 1100 př. n. l."
  sv:
    - "Simsons land är Soreks dal, där Judas berg går ned mot kustslätten omkring 23 km väster om Jerusalem, på gränsen mellan Dans stam och filistéerna. Han föddes i Sora, Tel Tzora på dalens norra sida, och Eshtaol låg mindre än 3 km bort; Bet-Shemesh ligger 3 km tvärs över dalen, och Timna, där han tog sin filistéiska hustru, 7 km nedför dalen vid Tel Batash. Lechi, där han stred med käkbenet, är inte identifierat; kartan placerar det i närheten. Han dog i Gaza, 58 km åt sydväst, filistéernas stad vid öknens kant, och begrovs hemma mellan Sora och Eshtaol."
    - "Domarboken börjar med ”en man av daniternas släkt, vid namn Manoa” i Sora, och säger att Herrens Ande ”begynte att verka på honom, medan han var i Dans läger, mellan Sorga och Estaol”. ”När Simson en gång gick ned till Timna, fick han där i Timna se en kvinna, en av filistéernas döttrar”; senare ”fattade han kärlek till en kvinna som hette Delila, vid bäcken Sorek”. I Gaza ”grep han tag i stadsportens dörrar och i de båda dörrposterna och ryckte loss dem jämte bommen, och lade alltsammans på sina axlar och bar upp det till toppen på det berg som ligger gent emot Hebron”, 60 km och omkring 900 m uppför, om berget ligger vid Hebron. Förblindad fördes han ”ned till Gasa och bundo honom med kopparfjättrar, och han måste mala i fängelset”, och när Dagons hus föll över filistéernas furstar ”begrovo [hans bröder] honom mellan Sorga och Estaol, i hans fader Manoas grav”."
    - "Platserna är verkliga och har grävts ut. Tel Batash, Timna, utgrävt av George Kelm och Amihai Mazar 1977–1989, var en filistéisk stad från 1100- och 1000-talen f.Kr. i dalen nedanför Sora; Bet-Shemesh tvärs över dalen var då, hävdar utgrävarna Bunimovitz och Lederman, en kananeisk gränsby; där fann de 2012 ett litet sigill från perioden som visar en man bredvid ett lejon, vilket de kopplar till en Simsonliknande berättelse utan att påstå att det visar Simson. Soras namn överlevde i den arabiska byn Sar'a till 1948, och Eusebios pekade ut byn som Simsons hem. Om Gazas tempel är ingenting känt: den antika staden ligger under den moderna. Simsons datering är osäker, på 1000-talet f.Kr. enligt de flesta beräkningar, under de sista generationerna före Saul; kartan placerar honom omkring 1100 f.Kr."
