id: where-did-jesus-walk-on-water
question:
  en: "Where did Jesus walk on water?"
  ru: "Где Иисус ходил по воде?"
  uk: "Де Ісус ходив по воді?"
  es: "¿Dónde caminó Jesús sobre el agua?"
  pt: "Onde Jesus andou sobre as águas?"
  de: "Wo ging Jesus auf dem Wasser?"
  fr: "Où Jésus a-t-il marché sur l’eau ?"
  pl: "Gdzie Jezus chodził po wodzie?"
  it: "Dove Gesù camminò sull’acqua?"
  nl: "Waar wandelde Jezus op het water?"
  cs: "Kde Ježíš kráčel po vodě?"
  sv: "Var gick Jesus på vattnet?"
  nb: "Hvor gikk Jesus på vannet?"
  tl: "Saan lumakad si Jesus sa ibabaw ng tubig?"
answer:
  en:
    - "On the Sea of Galilee, on the night after the feeding of the five thousand, between the north-eastern shore and the plain of Gennesaret on the north-west: the disciples set out by boat toward Bethsaida, by Mark, or Capernaum, by John, were caught by a head wind “in the midst of the sea”, and landed at last “into the land of Gennesaret”. The map point stands on the lake; its Bethsaida and Gennesaret points lie about 13 km apart in a straight line, Capernaum and Gennesaret about 7 km. The lake is about 21 km long and 13 km wide, so “the midst of the sea” was a few kilometres from any shore, and no spot on the water can be marked."
    - "Matthew tells it: “the ship was now in the midst of the sea, tossed with waves: for the wind was contrary. And in the fourth watch of the night Jesus went unto them, walking on the sea.” The fourth watch was between three and six in the morning. Mark adds that he “would have passed by them”; John, that they “had rowed about five and twenty or thirty furlongs”, about 5 km, when they saw him, and that once he was taken in “immediately the ship was at the land whither they went”. Only Matthew tells of Peter walking toward him and sinking. The storm that Jesus stilled with “Peace, be still” is another night, on the crossing to the country of the Gadarenes on the eastern shore."
    - "The winds are real: the lake lies about 210 m below sea level in the rift valley, and winds drop onto it from the heights around, from the hills of Galilee on the west and at times from the Golan on the east, raising sudden short seas against which a rowing boat makes no way. A fishing boat of the first century, 8.2 m long, found in the mud of the north-west shore near Ginosar in 1986, when a drought lowered the lake, shows the kind of craft the disciples rowed. Gennesaret, where they came ashore, is the fertile plain between Magdala and Capernaum that Josephus praises; the sick were brought to Jesus there in the morning. The map's Galilee tour shows the stages in Mark's order."
  ru:
    - "На Галилейском море, в ночь после насыщения пяти тысяч, между северо-восточным берегом и Геннисаретской равниной на северо-западе: ученики отплыли на лодке к Вифсаиде, по Марку, или в Капернаум, по Иоанну, попали во встречный ветер «на средине моря» и наконец «прибыли в землю Геннисаретскую». Точка карты стоит на озере; его точки Вифсаиды и Геннисарета отстоят друг от друга примерно на 13 км по прямой, Капернаум от Геннисарета — на 7 км. Озеро длиной около 21 км и шириной 13 км, так что лодка «на средине моря» была в нескольких километрах от любого берега, и точки на воде не отметить."
    - "Матфей рассказывает: «лодка была уже на средине моря, и ее било волнами, потому что ветер был противный. В четвертую же стражу ночи пошел к ним Иисус, идя по морю». Четвёртая стража — от трёх до шести часов утра. Марк добавляет, что Он «хотел миновать их»; Иоанн — что они увидели Его, «проплыв около двадцати пяти или тридцати стадий», то есть около 5 км, и что, когда Его приняли, «тотчас лодка пристала к берегу, куда плыли». Один Матфей рассказывает, как Пётр пошёл к Нему по воде и стал тонуть. Буря, которую Иисус унял словами «умолкни, перестань», — другая ночь, на пути в страну Гадаринскую на восточном берегу."
    - "Ветры здесь настоящие: озеро лежит примерно на 210 м ниже уровня моря в рифтовой долине, и на него обрушиваются ветры с окрестных высот — с холмов Галилеи на западе, а порой и с Голан на востоке, — поднимая внезапную короткую волну, против которой гребная лодка не продвигается. Рыбацкая лодка I века длиной 8,2 м, найденная в иле северо-западного берега у Гиносара в 1986 году, когда засуха понизила озеро, показывает, на каком судне гребли ученики. Геннисарет, где они пристали, — плодородная равнина между Магдалой и Капернаумом, которую хвалит Иосиф Флавий; утром туда принесли к Иисусу больных. Галилейский тур карты показывает эти этапы в порядке Марка."
  uk:
    - "На Галілейському морі, тієї ночі після нагодування п'яти тисяч, між північно-східним берегом і рівниною Генісарет на північному заході: учні вирушили човном до Віфсаїди, за Марком, або до Капернауму, за Іваном, потрапили під зустрічний вітер «серед моря» й наприкінці причалили «в землю Генисарецьку». Точка мапи стоїть на озері; її точки Віфсаїди й Генісарету лежать приблизно за 13 км одна від одної по прямій, Капернаум і Генісарет — приблизно за 7 км. Озеро має близько 21 км завдовжки й 13 км завширшки, тож «серед моря» було за кілька кілометрів від будь-якого берега, і жодне місце на воді позначити не можна."
    - "Матвій розповідає: «Човен же був уже серед моря, і било його филями; бо вітер був противний. У четверту ж сторожу ночи, прийшов до них Ісус, ідучи по морю». Четверта сторожа припадала між третьою і шостою ранку. Марко додає, що Він «хотїв минути їх»; Іван — що вони «Одпливши ж гоней на двайцять і пять або трийцять», близько 5 км, коли побачили Його, і що коли Його взяли, «зараз човен опинивсь коло землї, куди вони прямували». Лише Матвій розповідає, як Петро пішов до Нього і почав тонути. Буря, яку Ісус угамував словами «Мовчи, перестань!», — це інша ніч, під час переправи до країни гадаринців на східному березі."
    - "Вітри справжні: озеро лежить приблизно на 210 м нижче рівня моря в рифтовій долині, і вітри спадають на нього з довколишніх висот, з пагорбів Галілеї на заході та часом з Голанів на сході, здіймаючи раптові короткі хвилі, проти яких гребний човен не просувається. Рибальський човен першого століття завдовжки 8,2 м, знайдений в мулі північно-західного берега біля Гінносару 1986 р., коли посуха знизила озеро, показує, яким судном гребли учні. Генісарет, де вони зійшли на берег, — це родюча рівнина між Магдалою та Капернаумом, яку вихваляє Йосиф Флавій; туди вранці принесли хворих до Ісуса. Тур Галілеєю на мапі показує етапи в порядку Марка."
  es:
    - "En el mar de Galilea, en la noche siguiente a la comida de los cinco mil, entre la orilla nororiental y la llanura de Genesaret, en el noroeste: los discípulos zarparon en barca hacia Betsaida, según Marcos, o Cafarnaúm, según Juan, los sorprendió un viento contrario «en medio de la mar», y desembarcaron al fin «á la tierra de Genezaret». El punto del mapa está en el lago; sus puntos de Betsaida y Genesaret distan unos 13 km en línea recta, Cafarnaúm y Genesaret unos 7 km. El lago mide unos 21 km de largo y 13 km de ancho, de modo que «en medio de la mar» estaba a unos kilómetros de cualquier orilla, y no puede marcarse ningún punto del agua."
    - "Mateo lo cuenta: «ya el barco estaba en medio de la mar, atormentado de las ondas; porque el viento era contrario. Mas á la cuarta vela de la noche, Jesús fué á ellos andando sobre la mar». La cuarta vigilia iba de las tres a las seis de la mañana. Marcos añade que «quería precederlos»; Juan, que habían «navegado como veinticinco ó treinta estadios», unos 5 km, cuando lo vieron, y que una vez recibido a bordo «luego el barco llegó á la tierra donde iban». Solo Mateo cuenta que Pedro caminó hacia él y se hundía. La tempestad que Jesús calmó con «Calla, enmudece» es otra noche, en la travesía hacia el país de los gadarenos, en la orilla oriental."
    - "Los vientos son reales: el lago está a unos 210 m bajo el nivel del mar en el valle de la falla, y los vientos caen sobre él desde las alturas circundantes, desde las colinas de Galilea por el oeste y a veces desde el Golán por el este, levantando de pronto un oleaje corto contra el que una barca de remos no avanza. Una barca de pesca del siglo I, de 8,2 m de largo, hallada en el barro de la orilla noroeste, cerca de Ginosar, en 1986, cuando una sequía bajó el lago, muestra la clase de embarcación que remaban los discípulos. Genesaret, donde desembarcaron, es la fértil llanura entre Magdala y Cafarnaúm que Josefo alaba; allí fueron llevados los enfermos a Jesús por la mañana. El recorrido de Galilea en el mapa muestra las etapas en el orden de Marcos."
  pt:
    - "No mar da Galileia, na noite depois da multiplicação dos pães para os cinco mil, entre a margem nordeste e a planície de Genesaré, a noroeste: os discípulos partiram de barco rumo a Betsaida, segundo Marcos, ou Cafarnaum, segundo João, foram apanhados por um vento contrário “no meio do mar” e por fim chegaram “à terra de Genesaré”. O ponto do mapa está no lago; seus pontos de Betsaida e Genesaré distam cerca de 13 km em linha reta, Cafarnaum e Genesaré cerca de 7 km. O lago tem cerca de 21 km de comprimento e 13 de largura, de modo que “o meio do mar” ficava a alguns quilômetros de qualquer margem, e nenhum ponto da água pode ser marcado."
    - "Mateus conta: “o barco já estava no meio do mar, açoitado pelas ondas, pois o vento era contrário. Na quarta vigília da noite, Jesus foi até eles, andando sobre o mar.” A quarta vigília ia das três às seis da manhã. Marcos acrescenta que “teria passado por eles”; João, que haviam remado “cerca de vinte e cinco ou trinta estádios”, uns 5 km, quando o viram, e que, recebido no barco, “imediatamente o barco chegou à terra para onde iam”. Só Mateus conta que Pedro andou em sua direção e afundou. A tempestade que Jesus acalmou com “Paz! Aquiete-se!” é outra noite, na travessia para a terra dos gadarenos, na margem oriental."
    - "Os ventos são reais: o lago fica a cerca de 210 m abaixo do nível do mar, no vale da fenda, e os ventos descem sobre ele das alturas em redor, dos montes da Galileia a oeste e às vezes do Golã a leste, levantando ondas curtas e súbitas contra as quais um barco a remo não avança. Um barco de pesca do século I, de 8,2 m, achado na lama da margem noroeste perto de Ginosar em 1986, quando uma seca baixou o lago, mostra o tipo de embarcação em que os discípulos remavam. Genesaré, onde desembarcaram, é a fértil planície entre Magdala e Cafarnaum que Josefo elogia; ali os doentes foram levados a Jesus pela manhã. O roteiro da Galileia no mapa mostra as etapas na ordem de Marcos."
  de:
    - "Auf dem See Genezareth, in der Nacht nach der Speisung der Fünftausend, zwischen dem Nordostufer und der Ebene Genezareth im Nordwesten: Die Jünger fuhren zu Schiff nach Betsaida, so bei Markus, oder nach Kapernaum, so bei Johannes, gerieten in Gegenwind „mitten auf dem Meer“ und landeten schließlich „in das Land Genezareth“. Der Kartenpunkt liegt auf dem See; seine Punkte Betsaida und Genezareth liegen in der Luftlinie etwa 13 km auseinander, Kapernaum und Genezareth etwa 7 km. Der See ist etwa 21 km lang und 13 km breit, „mitten auf dem Meer“ war also einige Kilometer von jedem Ufer entfernt, und keine Stelle auf dem Wasser lässt sich markieren."
    - "Matthäus erzählt: „Und das Schiff war schon mitten auf dem Meer und litt Not von den Wellen; denn der Wind war ihnen zuwider. Aber in der vierten Nachtwache kam Jesus zu ihnen und ging auf dem Meer.“ Die vierte Nachtwache lag zwischen drei und sechs Uhr morgens. Markus fügt hinzu, „er wollte an ihnen vorübergehen“; Johannes, sie hätten „gerudert ... bei fünfundzwanzig oder dreißig Feld Wegs“, etwa 5 km, als sie ihn sahen, und als sie ihn aufnehmen wollten, „war das Schiff am Lande, da sie hin fuhren“. Nur Matthäus erzählt, wie Petrus ihm entgegenging und sank. Der Sturm, den Jesus mit „Schweig und verstumme!“ stillte, ist eine andere Nacht, auf der Überfahrt in das Land der Gadarener am Ostufer."
    - "Die Winde sind wirklich: Der See liegt etwa 210 m unter dem Meeresspiegel im Grabenbruch, und Winde fallen von den Höhen ringsum auf ihn herab, von den Bergen Galiläas im Westen und zuweilen vom Golan im Osten, und erzeugen plötzlich kurze Wellen, gegen die ein Ruderboot nicht ankommt. Ein 8,2 m langes Fischerboot des 1. Jahrhunderts, das 1986 bei einer Dürre mit niedrigem Wasserstand im Schlamm des Nordwestufers bei Ginnosar gefunden wurde, zeigt die Art Boot, die die Jünger ruderten. Genezareth, wo sie an Land kamen, ist die fruchtbare Ebene zwischen Magdala und Kapernaum, die Josephus preist; dort brachte man am Morgen die Kranken zu Jesus. Die Galiläa-Tour der Karte zeigt die Stationen in der Reihenfolge des Markus."
  fr:
    - "Sur la mer de Galilée, la nuit qui suivit le repas des cinq mille, entre la rive nord-est et la plaine de Génésareth au nord-ouest : les disciples partirent en barque vers Bethsaïda, selon Marc, ou vers Capernaüm, selon Jean, furent pris par un vent contraire « au milieu de la mer », et abordèrent enfin « dans le pays de Génésareth ». Le point de la carte est sur le lac ; ses points de Bethsaïda et de Génésareth sont distants d’environ 13 km en ligne droite, Capernaüm et Génésareth d’environ 7 km. Le lac mesure environ 21 km de long et 13 km de large, de sorte que « le milieu de la mer » était à quelques kilomètres de toute rive, et aucun point de l’eau ne peut être marqué."
    - "Matthieu raconte : « La barque, déjà au milieu de la mer, était battue par les flots ; car le vent était contraire. À la quatrième veille de la nuit, Jésus alla vers eux, marchant sur la mer. » La quatrième veille allait de trois à six heures du matin. Marc ajoute qu’« il voulait les dépasser » ; Jean, qu’« après avoir ramé environ vingt-cinq ou trente stades », soit environ 5 km, ils virent Jésus, et qu’une fois accueilli dans la barque, « aussitôt la barque aborda au lieu où ils allaient ». Seul Matthieu raconte que Pierre marcha vers lui et s’enfonça. La tempête que Jésus apaisa par « Silence ! Tais-toi ! » est une autre nuit, lors de la traversée vers le pays des Gadaréniens, sur la rive orientale."
    - "Les vents sont réels : le lac se trouve à environ 210 m sous le niveau de la mer dans la vallée du rift, et des vents tombent sur lui des hauteurs voisines, des collines de Galilée à l’ouest et parfois du Golan à l’est, soulevant de brusques mers courtes contre lesquelles une barque à rames n’avance pas. Une barque de pêche du Ier siècle, longue de 8,2 m, trouvée dans la vase de la rive nord-ouest près de Guinosar en 1986, quand une sécheresse avait abaissé le lac, montre le genre d’embarcation que les disciples ramaient. Génésareth, où ils abordèrent, est la plaine fertile entre Magdala et Capernaüm que loue Josèphe ; on y amena les malades à Jésus au matin. Le parcours de Galilée sur la carte montre les étapes dans l’ordre de Marc."
  pl:
    - "Na Jeziorze Galilejskim, w nocy po nakarmieniu pięciu tysięcy, między północno-wschodnim brzegiem a równiną Genezaret na północnym zachodzie: uczniowie wypłynęli łodzią ku Betsaidzie, według Marka, albo ku Kafarnaum, według Jana, zaskoczył ich przeciwny wiatr „w pośrodku morza” i wreszcie przybyli „do ziemi Gienezaret”. Punkt na mapie stoi na jeziorze; jego punkty Betsaidy i Genezaret dzieli około 13 km w linii prostej, Kafarnaum i Genezaret około 7 km. Jezioro ma około 21 km długości i 13 km szerokości, więc „w pośrodku morza” było kilka kilometrów od jakiegokolwiek brzegu i żadnego miejsca na wodzie nie da się zaznaczyć."
    - "Mateusz opowiada: „A łódź już w pośrodku morza będąc, miotana była od wałów; albowiem był wiatr przeciwny. Lecz o czwartej straży nocnej szedł do nich Jezus, chodząc po morzu.” Czwarta straż przypadała między trzecią a szóstą rano. Marek dodaje, że „chciał je wyminąć”; Jan, że gdy „odpłynęli jakoby na dwadzieścia i pięć lub trzydzieści stajan”, około 5 km, ujrzeli go, i że gdy go wzięli do łodzi, „zarazem łódź przypłynęła do ziemi, do której jechali”. Tylko Mateusz opowiada o Piotrze, który szedł ku niemu i tonął. Burza, którą Jezus uciszył słowami „Umilknij, a uśmierz się”, to inna noc, w czasie przeprawy do krainy Gadareńczyków na wschodnim brzegu."
    - "Wiatry są prawdziwe: jezioro leży około 210 m poniżej poziomu morza w rowie tektonicznym, a wiatry spadają na nie z wyżyn dokoła, ze wzgórz Galilei na zachodzie, a czasem z Golanu na wschodzie, wzbijając nagłe krótkie fale, przeciw którym łódź wiosłowa nie posuwa się naprzód. Łódź rybacka z I wieku, długa na 8,2 m, znaleziona w mule północno-zachodniego brzegu koło Ginosar w 1986, gdy susza obniżyła jezioro, pokazuje rodzaj łodzi, jakimi wiosłowali uczniowie. Genezaret, gdzie wyszli na brzeg, to żyzna równina między Magdalą a Kafarnaum, którą chwali Józef Flawiusz; tam rano przynoszono do Jezusa chorych. Trasa po Galilei na mapie pokazuje etapy w kolejności Marka."
  it:
    - "Sul lago di Tiberiade, la notte dopo la moltiplicazione dei cinquemila, tra la riva nord-orientale e la piana di Gennesaret a nord-ovest: i discepoli partirono in barca verso Betsaida, secondo Marco, o Cafarnao, secondo Giovanni, furono colti da un vento contrario «in mezzo al mare», e approdarono infine «nel paese di Gennezaret». Il punto della mappa sta sul lago; i suoi punti di Betsaida e di Gennesaret distano circa 13 km in linea retta, Cafarnao e Gennesaret circa 7 km. Il lago è lungo circa 21 km e largo 13, così «in mezzo al mare» era a qualche chilometro da ogni riva, e nessun punto sull’acqua può essere segnato."
    - "Matteo racconta: «la barca, già di molti stadi lontana da terra, era sbattuta dalle onde perché il vento era contrario. Ma alla quarta vigilia della notte Gesù andò verso loro, camminando sul mare». La quarta vigilia andava dalle tre alle sei del mattino. Marco aggiunge che «voleva oltrepassarli»; Giovanni, che «com’ebbero vogato circa venticinque o trenta stadi», circa 5 km, videro Gesù, e che una volta preso a bordo «subito la barca toccò terra là dove eran diretti». Solo Matteo racconta di Pietro che cammina verso di lui e affonda. La tempesta che Gesù placò con «Taci, calmati!» è un’altra notte, durante la traversata verso il paese dei Gadareni sulla riva orientale."
    - "I venti sono reali: il lago giace a circa 210 m sotto il livello del mare nella fossa tettonica, e i venti scendono su di esso dalle alture circostanti, dalle colline della Galilea a ovest e a volte dal Golan a est, sollevando onde improvvise e corte contro le quali una barca a remi non avanza. Una barca da pesca del I secolo, lunga 8,2 m, trovata nel fango della riva nord-occidentale presso Ginosar nel 1986, quando una siccità abbassò il lago, mostra il tipo di imbarcazione che i discepoli remavano. Gennesaret, dove approdarono, è la fertile piana tra Magdala e Cafarnao che Giuseppe Flavio elogia; i malati vi furono portati da Gesù al mattino. Il percorso della Galilea sulla mappa mostra le tappe nell’ordine di Marco."
  nl:
    - "Op het Meer van Galilea, in de nacht na de voeding van de vijfduizend, tussen de noordoostoever en de vlakte van Gennesaret in het noordwesten: de discipelen vertrokken per boot naar Bethsaïda volgens Marcus of Kafarnaüm volgens Johannes, kregen tegenwind “in het midden van de zee”, en kwamen ten slotte aan “in het land Gennesareth”. Het punt op de kaart staat op het meer; de punten Bethsaïda en Gennesaret liggen hemelsbreed ongeveer 13 km uit elkaar, Kafarnaüm en Gennesaret ongeveer 7 km. Het meer is ongeveer 21 km lang en 13 km breed, dus “het midden van de zee” lag enkele kilometers van elke oever, en geen plek op het water kan worden aangewezen."
    - "Mattheüs vertelt: “het schip was nu midden in de zee, zijnde in nood van de baren; want de wind was hun tegen. Maar ter vierde wake des nachts kwam Jezus af tot hen, wandelende op de zee.” De vierde wake was tussen drie en zes uur ’s ochtends. Marcus voegt toe dat Hij “wilde hen voorbijgaan”; Johannes dat zij “omtrent vijf en twintig of dertig stadien gevaren waren”, ongeveer 5 km, toen zij Hem zagen, en dat nadat Hij was opgenomen “terstond kwam het schip aan het land, daar zij naar toe voeren”. Alleen Mattheüs vertelt dat Petrus naar Hem toe liep en zonk. De storm die Jezus stilde met “Zwijg, wees stil!” is een andere nacht, op de overtocht naar het land van de Gadarenen aan de oostoever."
    - "De winden zijn echt: het meer ligt ongeveer 210 m onder zeeniveau in de slenk, en winden storten van de hoogten eromheen op het water, uit de heuvels van Galilea in het westen en soms uit de Golan in het oosten, en wekken plotselinge korte golven waartegen een roeiboot niets vermag. Een vissersboot uit de eerste eeuw, 8,2 m lang, in 1986 bij Ginnosar in het slijk van de noordwestoever gevonden toen droogte het meer verlaagde, toont het soort vaartuig waarmee de discipelen roeiden. Gennesaret, waar zij aan land kwamen, is de vruchtbare vlakte tussen Magdala en Kafarnaüm die Josephus prijst; daar werden ’s ochtends de zieken bij Jezus gebracht. De tocht door Galilea op de kaart toont de etappes in de volgorde van Marcus."
  cs:
    - "Na Galilejském jezeře, v noci po nasycení pěti tisíc, mezi severovýchodním břehem a rovinou Genezaretu na severozápadě: učedníci vypluli lodí k Betsaidě podle Marka nebo ke Kafarnaum podle Jana, zastihl je protivný vítr „uprostřed moře“ a nakonec přistáli „do země Genezaretské“. Bod na mapě stojí na jezeře; jeho body Betsaida a Genezaret leží od sebe asi 13 km vzdušnou čarou, Kafarnaum a Genezaret asi 7 km. Jezero je asi 21 km dlouhé a 13 km široké, takže „uprostřed moře“ bylo několik kilometrů od kteréhokoli břehu a žádné místo na vodě nelze označit."
    - "Matouš vypráví: „Lodí pak již byla uprostřed moře, zmítající se vlnami, nebo byl vítr odporný jim. Při čtvrtém pak bdění nočním bral se k nim Ježíš, jda po moři.“ Čtvrté bdění bylo mezi třetí a šestou ranní. Marek dodává, že „chtěl je pominouti“; Jan, že se odplavili „honů jako pětmecítma nebo třidceti“, asi 5 km, když ho uviděli, a že když byl vzat na loď, „hned přiběhla k zemi, do kteréž se plavili“. Jen Matouš vypráví o Petrovi, jak k němu kráčel a bořil se. Bouře, kterou Ježíš utišil slovy „Umlkni a upokoj se“, je jiná noc, při přeplavbě do země Gadarských na východním břehu."
    - "Větry jsou skutečné: jezero leží asi 210 m pod hladinou moře v příkopové propadlině a na něj padají větry z okolních výšin, z galilejských hor na západě a občas z Golanu na východě, a vyvolávají náhlé krátké vlny, proti nimž veslice nepostoupí. Rybářská loď z 1. století, 8,2 m dlouhá, nalezená v bahně severozápadního břehu u Ginosaru roku 1986, když sucho snížilo hladinu jezera, ukazuje druh plavidla, které učedníci veslovali. Genezaret, kde přistáli, je úrodná rovina mezi Magdalou a Kafarnaem, kterou chválí Josephus Flavius; nemocní byli k Ježíšovi přinášeni ráno. Mapa galilejského putování ukazuje etapy v Markově pořadí."
  sv:
    - "På Galileiska sjön, natten efter att de fem tusen mättats, mellan den nordöstra stranden och Gennesarets slätt i nordväst: lärjungarna gav sig av i båt mot Betsaida, enligt Markus, eller Kafarnaum, enligt Johannes, fick motvind ”mitt på sjön” och landade till sist ”i Gennesarets land”. Kartpunkten står på sjön; dess punkter Betsaida och Gennesaret ligger omkring 13 km från varandra fågelvägen, Kafarnaum och Gennesaret omkring 7 km. Sjön är omkring 21 km lång och 13 km bred, så ”mitt på sjön” var några kilometer från varje strand, och ingen plats på vattnet kan märkas ut."
    - "Matteus berättar: ”Båten var då redan många stadier från land och hårt ansatt av vågorna, ty vinden låg emot. Men under fjärde nattväkten kom Jesus till dem, gående fram över sjön.” Den fjärde nattväkten låg mellan tre och sex på morgonen. Markus tillägger att han ”skulle just gå förbi dem”; Johannes att de ”hade rott vid pass tjugufem eller trettio stadier”, omkring 5 km, när de fick se honom, och att när han togs upp ”strax var båten framme vid landet dit de foro”. Bara Matteus berättar om Petrus som gick mot honom och sjönk. Stormen som Jesus stillade med ”Tig, var stilla” är en annan natt, på överfarten till gadarenernas land vid östra stranden."
    - "Vindarna är verkliga: sjön ligger omkring 210 m under havsytan i gravsänkan, och vindar faller ned över den från höjderna runt omkring, från Galileens berg i väster och ibland från Golan i öster, och reser plötsligt korta sjöar mot vilka en roddbåt inte kommer fram. En fiskebåt från första århundradet, 8,2 m lång, funnen i leran på nordvästra stranden nära Ginosar 1986, när en torka sänkte sjön, visar vilket slags farkost lärjungarna rodde. Gennesaret, där de gick i land, är den bördiga slätten mellan Magdala och Kafarnaum som Josefus prisar; de sjuka fördes till Jesus där på morgonen. Kartans Galileentur visar etapperna i Markus ordning."
  nb:
    - "På Galileasjøen, natten etter bespisningen av de fem tusen, mellom nordøstkysten og Gennesaret-sletten i nordvest: disiplene la ut i båt mot Betsaida, hos Markus, eller Kapernaum, hos Johannes, ble fanget av motvind «midt på sjøen» og kom til slutt i land «til Gennesarets land». Kartpunktet står på innsjøen; dens Betsaida- og Gennesaret-punkter ligger omtrent 13 km fra hverandre i luftlinje, Kapernaum og Gennesaret omtrent 7 km. Innsjøen er omtrent 21 km lang og 13 km bred, så «midt på sjøen» var noen få kilometer fra enhver strand, og ingen plass på vannet kan markeres."
    - "Matteus forteller: «Men båten var alt midt ute på sjøen og arbeidet hårdt mot bølgene, for vinden var imot. Men i den fjerde nattevakt kom han til dem, vandrende på sjøen.» Den fjerde nattevakt var mellom tre og seks om morgenen. Markus tilføyer at han «vilde gå forbi dem»; Johannes, at de «hadde rodd en fem og tyve eller tretti stadier», omtrent 5 km, da de så ham, og at da han var tatt inn, «straks kom båten til landet som de fór til». Bare Matteus forteller om Peter som gikk mot ham og begynte å synke. Stormen som Jesus stilnet med «Ti, vær stille!», er en annen natt, på overfarten til gadarenernes land på østkysten."
    - "Vindene er virkelige: innsjøen ligger omtrent 210 m under havets overflate i riftdalen, og vinder faller ned over den fra høydene omkring, fra Galileas åser i vest og til tider fra Golan i øst, og reiser plutselig korte bølger som en robåt ikke kommer fram mot. En fiskebåt fra det første århundre, 8,2 m lang, funnet i leiren på nordvestkysten nær Ginosar i 1986, da tørke senket innsjøen, viser hva slags fartøy disiplene rodde. Gennesaret, der de gikk i land, er den fruktbare sletten mellom Magdala og Kapernaum som Josefus priser; de syke ble brakt til Jesus der om morgenen. Kartets Galilea-tur viser etappene i Markus' rekkefølge."
  tl:
    - "Sa Dagat ng Galilea, sa gabi pagkatapos pakainin ang limang libo, sa pagitan ng hilagang-silangang baybayin at ng kapatagan ng Genezaret sa hilagang-kanluran: lumayag ang mga alagad sa daong patungong Betsaida ayon kay Marcos, o Capernaum ayon kay Juan, nasalubong ng salungat na hangin “sa gitna ng dagat”, at sa wakas ay narating “ang lupa ng Genezaret”. Ang tuldok sa mapa ay nasa lawa; ang mga tuldok nito ng Bethsaida at Genezaret ay mga 13 km ang pagitan sa tuwid na guhit, ang Capernaum at Genezaret mga 7 km. Ang lawa ay mga 21 km ang haba at 13 km ang luwang, kaya ang “gitna ng dagat” ay ilang kilometro mula sa alinmang baybayin, at walang lugar sa tubig na maitatanda."
    - "Isinasalaysay ni Mateo: “ang daong ay nasa gitna na ng dagat, na hinahampas ng mga alon; sapagka't pasalungat sa hangin. At sa ikaapat na pagpupuyat ng gabi ay naparoon siya sa kanila, na lumalakad sa ibabaw ng dagat.” Ang ikaapat na pagpupuyat ay sa pagitan ng tatlo at anim ng umaga. Idinaragdag ni Marcos na “ibig silang lagpasan”; ni Juan, na sila ay “mangakagaod na ng may dalawangpu't lima o tatlongpung estadio”, mga 5 km, nang makita nila siya, at nang tanggapin siya, “pagdaka'y dumating ang daong sa lupang kanilang tinutumpa”. Si Mateo lamang ang nagsasalaysay ng paglakad ni Pedro patungo sa kaniya at paglubog. Ang bagyong pinatahimik ni Jesus ng “Pumayapa, tumahimik ka” ay ibang gabi, sa pagtawid patungo sa lupain ng mga Gadareno sa silangang baybayin."
    - "Totoo ang mga hangin: ang lawa ay nasa mga 210 m sa ibaba ng antas ng dagat sa libis ng biyak, at bumabagsak sa ibabaw nito ang mga hangin mula sa mga taluktok sa palibot, mula sa mga burol ng Galilea sa kanluran at kung minsan mula sa Golan sa silangan, na nagbubunsod ng biglaang maiikling alon na hindi malalagpasan ng bangkang may sagwan. Ipinakikita ng isang bangkang pangisda noong unang siglo, 8.2 m ang haba, na natagpuan sa putik ng hilagang-kanlurang baybayin malapit sa Ginosar noong 1986, nang ibaba ng tagtuyot ang lawa, ang uri ng sasakyang ginamit ng mga alagad. Ang Genezaret, kung saan sila dumaong, ay ang mayamang kapatagan sa pagitan ng Magdala at Capernaum na pinupuri ni Josephus; doon dinala ang mga maysakit kay Jesus kinaumagahan. Ipinakikita ng paglilibot ng mapa sa Galilea ang mga yugto sa ayos ni Marcos."
