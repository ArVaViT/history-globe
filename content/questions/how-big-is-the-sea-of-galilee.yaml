id: how-big-is-the-sea-of-galilee
question:
  en: "How big is the Sea of Galilee?"
  ru: "Насколько велико Галилейское море?"
  uk: "Якого розміру Галілейське море?"
  es: "¿Qué tamaño tiene el mar de Galilea?"
  pt: "Qual é o tamanho do mar da Galileia?"
  de: "Wie groß ist der See Genezareth?"
  fr: "Quelle est la taille de la mer de Galilée ?"
  pl: "Jak duże jest Jezioro Galilejskie?"
  it: "Quanto è grande il lago di Tiberiade?"
  nl: "Hoe groot is het Meer van Galilea?"
  cs: "Jak velké je Galilejské jezero?"
  sv: "Hur stor är Galileiska sjön?"
  nb: "Hvor stor er Galileasjøen?"
answer:
  en:
    - "The Sea of Galilee is a freshwater lake about 21 km long from north to south and up to 13 km wide, with an area of about 166 square kilometres and a greatest depth of about 43 m; its surface lies between about 209 and 215 m below the level of the Mediterranean, depending on the year, which makes it the lowest freshwater lake on earth. The map point stands in the middle of it, about 120 km north of Jerusalem in a straight line; Capernaum on the northern shore and Tiberias on the western are 12 km apart."
    - "The Bible calls it by several names: “the sea of Chinnereth” in the Law and Joshua, “the lake of Gennesaret” in Luke, and “the sea of Galilee, which is the sea of Tiberias” in John, after the city Herod Antipas built on its shore about AD 20. Jesus called his first disciples here, “walking by the sea of Galilee”, taught from a boat, crossed it many times, and was caught on it in a storm when “the waves beat into the ship, so that it was now full”. Such storms are real: the lake lies in a deep trench, and winds pouring down the gorges from the heights on either side can raise it in minutes."
    - "Josephus, who commanded Galilee in the war of AD 66, says the lake is 140 stadia long and 40 broad, about 26 by 7 km, its water sweet and good to drink; a fishing boat of his time, found in the mud of the western shore in 1986 when the water fell low, is 8.2 m long and was built for a crew of five, four rowers and a helmsman; its excavator reckoned it could carry about fifteen men in all. The lake's level has dropped in recent decades as Israel pumped it for water, so that the shore of the Gospels now often lies some way back from the water."
  ru:
    - "Галилейское море — пресное озеро длиной около 21 км с севера на юг и шириной до 13 км, площадью около 166 квадратных километров и наибольшей глубиной около 43 м; его поверхность лежит примерно на 209–215 м ниже уровня Средиземного моря, смотря по году, что делает его самым низким пресным озером на земле. Точка карты стоит посреди него, примерно в 120 км к северу от Иерусалима по прямой; Капернаум на северном берегу и Тивериада на западном отстоят друг от друга на 12 км."
    - "Библия называет его по-разному: море Киннереф в Законе и у Иисуса Навина, озеро Геннисаретское у Луки, а у Иоанна Иисус идёт «на ту сторону моря Галилейского, в окрестности Тивериады» — по городу, который Ирод Антипа построил на его берегу около 20 года. Здесь Иисус призвал первых учеников — «Проходя же близ моря Галилейского, Он увидел двух братьев», — учил из лодки, много раз переправлялся и попал на нём в бурю, когда «волны били в лодку, так что она уже наполнялась водою». Такие бури настоящие: озеро лежит в глубокой впадине, и ветры, скатывающиеся по ущельям с высот по обе стороны, за минуты поднимают его."
    - "Иосиф Флавий, командовавший Галилеей в войне 66 года, пишет, что озеро имеет 140 стадий в длину и 40 в ширину, примерно 26 на 7 км, что вода его сладкая и годная для питья; рыбацкая лодка его времени, найденная в иле западного берега в 1986 году, когда вода спала, имеет 8,2 м в длину и строилась на команду из пяти человек — четверо гребцов и кормчий; по расчёту исследователя, всего она могла взять около пятнадцати человек. В последние десятилетия уровень озера падал, потому что Израиль брал из него воду, так что берег Евангелий теперь нередко лежит в стороне от воды."
  uk:
    - "Галілейське море — прісноводне озеро завдовжки близько 21 км з півночі на південь і завширшки до 13 км, площею близько 166 квадратних кілометрів і найбільшою глибиною близько 43 м; його поверхня лежить приблизно на 209–215 м нижче рівня Середземного моря, залежно від року, що робить його найнижчим прісноводним озером на землі. Точка на мапі стоїть посередині озера, приблизно за 120 км на північ від Єрусалиму по прямій; Капернаум на північному березі та Тіверіада на західному розташовані на відстані 12 км одне від одного."
    - "Біблія називає його кількома іменами: озеро Кіннерет у Законі та в книзі Ісуса Навина, «озеро Генисарецьке» у Луки, а в Івана — «море Галилейське, Тивериядське», на ім'я міста, яке Ірод Антипа збудував на його березі близько 20 р. н. е. Тут Ісус покликав перших учнів, «йдучи… попри море Галилейське», навчав із човна, багато разів перепливав його й був застигнутий на ньому бурею, коли «филї заливали човен, так що вже тонув». Такі бурі справжні: озеро лежить у глибокому рові, і вітри, що линуть ущелинами з висот по обидва боки, можуть розбурхати його за лічені хвилини."
    - "Йосиф Флавій, який командував Галілеєю у війні 66 р., пише, що озеро має 140 стадіїв завдовжки й 40 завширшки, тобто близько 26 на 7 км, а його вода солодка й придатна для пиття; рибальський човен його часу, знайдений в мулі західного берега 1986 року, коли вода спала, має 8,2 м завдовжки й був збудований для екіпажу з п'яти осіб — чотирьох веслярів і стернового; за підрахунком його дослідника, він міг узяти загалом близько п'ятнадцяти чоловік. Рівень озера впродовж останніх десятиліть знизився, відколи Ізраїль качає з нього воду, тож берег із Євангелій нині часто лежить на деякій відстані від води."
  es:
    - "El mar de Galilea es un lago de agua dulce de unos 21 km de largo de norte a sur y hasta 13 km de ancho, con una superficie de unos 166 kilómetros cuadrados y una profundidad máxima de unos 43 m; su superficie se halla entre unos 209 y 215 m por debajo del nivel del Mediterráneo, según el año, lo que lo convierte en el lago de agua dulce más bajo de la tierra. El punto del mapa está en medio del lago, a unos 120 km al norte de Jerusalén en línea recta; Cafarnaúm, en la orilla norte, y Tiberias, en la occidental, distan 12 km entre sí."
    - "La Biblia lo llama con varios nombres: «la mar de Cinnereth» en la Ley y en Josué, «el lago de Genezaret» en Lucas, y «la mar de Galilea, que es de Tiberias» en Juan, por la ciudad que Herodes Antipas edificó en su orilla hacia el año 20 d. C. Aquí Jesús llamó a sus primeros discípulos, «andando... junto á la mar de Galilea», enseñó desde una barca, lo cruzó muchas veces y fue sorprendido en él por una tempestad cuando «echaba las olas en el barco, de tal manera que ya se henchía». Tales tempestades son reales: el lago yace en una fosa profunda, y los vientos que descienden por las gargantas de las alturas de ambos lados pueden agitarlo en minutos."
    - "Josefo, que mandó en Galilea en la guerra del año 66 d. C., dice que el lago tiene 140 estadios de largo y 40 de ancho, unos 26 por 7 km, y que su agua es dulce y buena para beber; una barca de pesca de su tiempo, hallada en el barro de la orilla occidental en 1986 cuando el agua bajó, mide 8,2 m de largo y estaba construida para una tripulación de cinco, cuatro remeros y un timonel; su excavador calculó que podía llevar en total unos quince hombres. El nivel del lago ha descendido en las últimas décadas porque Israel bombea su agua, de modo que la orilla de los Evangelios queda ahora a menudo algo lejos del agua."
  pt:
    - "O mar da Galileia é um lago de água doce com cerca de 21 km de comprimento de norte a sul e até 13 km de largura, com área de cerca de 166 quilômetros quadrados e profundidade máxima de cerca de 43 m; sua superfície fica entre cerca de 209 e 215 m abaixo do nível do Mediterrâneo, conforme o ano, o que faz dele o lago de água doce mais baixo da terra. O ponto do mapa fica no meio dele, a cerca de 120 km ao norte de Jerusalém em linha reta; Cafarnaum, na margem norte, e Tiberíades, na ocidental, distam 12 km uma da outra."
    - "A Bíblia o chama por vários nomes: “mar de Quinerete” na Lei e em Josué, “lago de Genesaré” em Lucas e “mar da Galileia, que também é chamado de mar de Tiberíades” em João, por causa da cidade que Herodes Antipas construiu em sua margem por volta de 20 d.C. Jesus chamou aqui os primeiros discípulos, “andando à beira do mar da Galileia”, ensinou de um barco, atravessou-o muitas vezes e foi surpreendido nele por uma tempestade, quando “as ondas batiam no barco, de modo que o barco já estava se enchendo de água”. Tais tempestades são reais: o lago fica numa fossa profunda, e os ventos que descem pelas gargantas das alturas de ambos os lados podem agitá-lo em minutos."
    - "Josefo, que comandou a Galileia na guerra de 66 d.C., diz que o lago tem 140 estádios de comprimento e 40 de largura, cerca de 26 por 7 km, com água doce e boa de beber; um barco de pesca do seu tempo, encontrado na lama da margem ocidental em 1986, quando o nível da água baixou, tem 8,2 m de comprimento e foi feito para uma tripulação de cinco, quatro remadores e um timoneiro; seu escavador calculou que podia levar cerca de quinze homens no total. O nível do lago baixou nas últimas décadas, porque Israel bombeia sua água, de modo que a margem dos Evangelhos hoje costuma ficar um pouco afastada da água."
  de:
    - "Der See Genezareth ist ein Süßwassersee von etwa 21 km Länge von Nord nach Süd und bis zu 13 km Breite, mit einer Fläche von etwa 166 Quadratkilometern und einer größten Tiefe von etwa 43 m; sein Spiegel liegt je nach Jahr etwa 209 bis 215 m unter dem Meeresspiegel des Mittelmeers, was ihn zum tiefstgelegenen Süßwassersee der Erde macht. Der Kartenpunkt liegt in seiner Mitte, etwa 120 km nördlich von Jerusalem in der Luftlinie; Kapernaum am Nordufer und Tiberias am Westufer liegen 12 km auseinander."
    - "Die Bibel nennt ihn mit mehreren Namen: Meer Kinneret im Gesetz und bei Josua, „See Genezareth“ bei Lukas und „Meer an der Stadt Tiberias in Galiläa“ bei Johannes, nach der Stadt, die Herodes Antipas um 20 n. Chr. an seinem Ufer erbaute. Hier berief Jesus seine ersten Jünger, als er „an dem Galiläischen Meer ging“, lehrte vom Boot aus, überquerte ihn viele Male und geriet auf ihm in einen Sturm: „Und es erhob sich ein großer Windwirbel und warf Wellen in das Schiff, also daß das Schiff voll ward.“ Solche Stürme sind wirklich: Der See liegt in einem tiefen Graben, und Winde, die von den Höhen zu beiden Seiten durch die Schluchten herabstürzen, können ihn binnen Minuten aufwühlen."
    - "Josephus, der im Krieg des Jahres 66 n. Chr. Galiläa befehligte, nennt den See 140 Stadien lang und 40 breit, etwa 26 mal 7 km, sein Wasser süß und trinkbar; ein Fischerboot aus seiner Zeit, das 1986 bei Niedrigwasser im Schlamm des Westufers gefunden wurde, ist 8,2 m lang und war für eine Besatzung von fünf gebaut, vier Ruderer und ein Steuermann; sein Ausgräber schätzte, es habe insgesamt etwa fünfzehn Mann tragen können. Der Wasserstand des Sees ist in den letzten Jahrzehnten gesunken, weil Israel ihm Wasser entnahm, sodass das Ufer der Evangelien heute oft ein Stück vom Wasser zurückliegt."
  fr:
    - "La mer de Galilée est un lac d’eau douce long d’environ 21 km du nord au sud et large de 13 km au plus, d’une superficie d’environ 166 kilomètres carrés et d’une profondeur maximale d’environ 43 m ; sa surface se trouve, selon les années, entre 209 et 215 m environ sous le niveau de la Méditerranée, ce qui en fait le lac d’eau douce le plus bas de la terre. Le point de la carte est en son milieu, à environ 120 km au nord de Jérusalem en ligne droite ; Capernaüm, sur la rive nord, et Tibériade, sur la rive ouest, sont distantes de 12 km."
    - "La Bible lui donne plusieurs noms : « la mer de Kinnéreth » dans la Loi et chez Josué, « lac de Génésareth » chez Luc, et « la mer de Galilée, de Tibériade » chez Jean, d’après la ville qu’Hérode Antipas bâtit sur sa rive vers 20 apr. J.-C. Jésus y appela ses premiers disciples, alors qu’« il marchait le long de la mer de Galilée », enseigna depuis une barque, la traversa bien des fois, et y fut surpris par une tempête où « les flots se jetaient dans la barque, au point qu’elle se remplissait déjà ». Ces tempêtes sont réelles : le lac occupe une profonde dépression, et les vents qui s’engouffrent dans les gorges des hauteurs de part et d’autre peuvent le soulever en quelques minutes."
    - "Josèphe, qui commandait la Galilée lors de la guerre de 66 apr. J.-C., dit que le lac mesure 140 stades de long et 40 de large, soit environ 26 sur 7 km, et que son eau est douce et bonne à boire ; une barque de pêche de son temps, découverte en 1986 dans la vase de la rive ouest quand les eaux avaient baissé, mesure 8,2 m de long et avait été construite pour cinq hommes d’équipage, quatre rameurs et un barreur ; son fouilleur estimait qu’elle pouvait porter une quinzaine d’hommes en tout. Le niveau du lac a baissé ces dernières décennies, Israël y pompant de l’eau, si bien que la rive des Évangiles se trouve souvent aujourd’hui à quelque distance de l’eau."
  pl:
    - "Jezioro Galilejskie to jezioro słodkowodne, długie na około 21 km z północy na południe i szerokie do 13 km, o powierzchni około 166 km² i największej głębokości około 43 m; jego lustro wody leży, zależnie od roku, od około 209 do 215 m poniżej poziomu Morza Śródziemnego, co czyni je najniżej położonym jeziorem słodkowodnym na Ziemi. Punkt na mapie znajduje się pośrodku jeziora, około 120 km na północ od Jerozolimy w linii prostej; Kafarnaum na brzegu północnym i Tyberiadę na zachodnim dzieli 12 km."
    - "Biblia zna kilka jego nazw: w Prawie i w Księdze Jozuego „morza Cyneret”, u Łukasza „jeziora Gienezaretskiego”, a u Jana „morze Galilejskie, które jest Tyberyjadzkie”, od miasta, które Herod Antypas zbudował na jego brzegu około 20 n.e. Tu Jezus powołał pierwszych uczniów, gdy „chodził nad morzem Galilejskiem”, nauczał z łodzi, wiele razy się przez nie przeprawiał i zastała go na nim burza, gdy „wały biły na łódź, tak że się już napełniała”. Takie burze są prawdziwe: jezioro leży w głębokim rowie, a wiatry spadające wąwozami z wyżyn po obu stronach potrafią je wzburzyć w ciągu minut."
    - "Józef Flawiusz, który w wojnie w 66 n.e. dowodził w Galilei, podaje, że jezioro ma 140 stadiów długości i 40 szerokości, czyli około 26 na 7 km, a jego woda jest słodka i dobra do picia; łódź rybacka z jego czasów, znaleziona w mule zachodniego brzegu w 1986 roku, gdy woda opadła, ma 8,2 m długości i zbudowano ją dla załogi pięciu osób, czterech wioślarzy i sternika; jej odkrywca szacował, że mogła zabrać w sumie około piętnastu ludzi. Poziom jeziora obniżył się w ostatnich dziesięcioleciach, gdy Izrael czerpał z niego wodę, tak że brzeg z Ewangelii leży dziś często w pewnej odległości od wody."
  it:
    - "Il lago di Tiberiade è un lago d’acqua dolce lungo circa 21 km da nord a sud e largo fino a 13 km, con una superficie di circa 166 chilometri quadrati e una profondità massima di circa 43 m; il suo specchio d’acqua si trova tra circa 209 e 215 m sotto il livello del Mediterraneo, a seconda dell’anno, il che ne fa il lago d’acqua dolce più basso della Terra. Il punto sulla mappa si trova al centro, a circa 120 km a nord di Gerusalemme in linea retta; Cafarnao sulla riva settentrionale e Tiberiade su quella occidentale distano 12 km."
    - "La Bibbia lo chiama con vari nomi: «mare di Kinnereth» nella Legge e in Giosuè, «lago di Gennesaret» in Luca, e «mar di Galilea, ch’è il mar di Tiberiade» in Giovanni, dal nome della città che Erode Antipa costruì sulla sua riva intorno al 20 d.C. Qui Gesù chiamò i suoi primi discepoli, «passeggiando lungo il mare della Galilea», insegnò da una barca, lo attraversò molte volte e vi fu colto da una tempesta, quando «un gran turbine di vento … cacciava le onde nella barca, talché ella già si riempiva». Tali tempeste sono reali: il lago giace in una profonda fossa, e i venti che si riversano lungo le gole dalle alture su entrambi i lati possono sollevarlo in pochi minuti."
    - "Giuseppe Flavio, che comandò la Galilea nella guerra del 66 d.C., dice che il lago è lungo 140 stadi e largo 40, circa 26 per 7 km, con acqua dolce e buona da bere; una barca da pesca della sua epoca, trovata nel fango della riva occidentale nel 1986 quando il livello dell’acqua scese, è lunga 8,2 m e fu costruita per un equipaggio di cinque persone, quattro rematori e un timoniere; chi la scavò calcolò che potesse portare in tutto circa quindici uomini. Negli ultimi decenni il livello del lago è calato perché Israele ne ha attinto l’acqua, cosicché la riva dei Vangeli oggi si trova spesso a una certa distanza dall’acqua."
  nl:
    - "Het Meer van Galilea is een zoetwatermeer van ongeveer 21 km lang van noord naar zuid en tot 13 km breed, met een oppervlakte van ongeveer 166 vierkante kilometer en een grootste diepte van ongeveer 43 m; de waterspiegel ligt, naargelang het jaar, op ongeveer 209 tot 215 m onder het niveau van de Middellandse Zee, waardoor het het laagstgelegen zoetwatermeer ter wereld is. Het punt op de kaart ligt midden in het meer, hemelsbreed ongeveer 120 km ten noorden van Jeruzalem; Kafarnaüm aan de noordoever en Tiberias aan de westoever liggen 12 km van elkaar."
    - "De Bijbel noemt het met verschillende namen: “de zee Cinnereth” in de Wet en in Jozua, “het meer Gennesareth” bij Lukas, en “de zee van Galilea, welke is de zee van Tiberias” bij Johannes, naar de stad die Herodes Antipas omstreeks 20 n.Chr. aan zijn oever bouwde. Jezus riep hier zijn eerste leerlingen, “wandelende aan de zee van Galilea”, onderwees vanuit een boot, stak het vele malen over en werd erop door een storm overvallen: “de baren sloegen over in het schip, alzo dat het nu vol werd”. Zulke stormen zijn echt: het meer ligt in een diepe slenk, en winden die door de kloven van de hoogten aan weerszijden naar beneden razen, kunnen het in enkele minuten doen opwoelen."
    - "Josephus, die in de oorlog van 66 n.Chr. het bevel over Galilea voerde, zegt dat het meer 140 stadiën lang en 40 breed is, ongeveer 26 bij 7 km, met zoet water dat goed te drinken is; een vissersboot uit zijn tijd, in 1986 in het slijk van de westoever gevonden toen het water laag stond, is 8,2 m lang en was gebouwd voor een bemanning van vijf, vier roeiers en een stuurman; volgens de opgraver kon hij in totaal ongeveer vijftien man dragen. De waterstand van het meer is de laatste decennia gedaald doordat Israël er water uit oppompte, zodat de oever uit de Evangeliën nu vaak een eind van het water af ligt."
  cs:
    - "Galilejské jezero je sladkovodní jezero dlouhé asi 21 km od severu k jihu a široké až 13 km, o rozloze asi 166 km² a největší hloubce asi 43 m; jeho hladina leží podle roku zhruba 209 až 215 m pod úrovní Středozemního moře, takže je nejníže položeným sladkovodním jezerem na světě. Bod na mapě stojí uprostřed jezera, asi 120 km vzdušnou čarou severně od Jeruzaléma; Kafarnaum na severním břehu a Tiberias na západním jsou od sebe vzdáleny 12 km."
    - "Bible je nazývá několika jmény: „moře Ceneret“ v Zákoně a u Jozue, „jezera Genezaretského“ u Lukáše a „moře Galilejské, jenž jest Tiberiadské“ u Jana, podle města, které Herodes Antipas postavil na jeho břehu kolem roku 20 n. l. Ježíš tu povolal své první učedníky, „chodě podle moře Galilejského“, učil z lodi, mnohokrát je přeplul a zastihla ho na něm bouře, kdy se „vlny na lodí valily, takže se již naplňovala lodí“. Takové bouře jsou skutečné: jezero leží v hluboké prohlubni a větry, které se řítí roklemi z výšin po obou stranách, je dokážou rozbouřit během několika minut."
    - "Josephus Flavius, který ve válce roku 66 n. l. velel v Galileji, píše, že jezero je dlouhé 140 stadií a široké 40, asi 26 krát 7 km, s vodou sladkou a dobrou k pití; rybářská loď z jeho doby, nalezená roku 1986 v bahně západního břehu, když hladina klesla, je dlouhá 8,2 m a byla stavěna pro pětičlennou posádku, čtyři veslaře a kormidelníka; podle jejího vykopavače mohla pobrat celkem asi patnáct mužů. Hladina jezera v posledních desetiletích klesla, protože z něj Izrael čerpal vodu, takže břeh z evangelií dnes často leží kus od vody."
  sv:
    - "Galileiska sjön är en insjö med sötvatten, omkring 21 km lång från norr till söder och upp till 13 km bred, med en yta på omkring 166 kvadratkilometer och ett största djup på omkring 43 m; dess yta ligger mellan omkring 209 och 215 m under Medelhavets nivå, beroende på år, vilket gör den till den lägst belägna sötvattensjön på jorden. Kartpunkten står mitt i sjön, omkring 120 km norr om Jerusalem fågelvägen; Kafarnaum vid norra stranden och Tiberias vid den västra ligger 12 km från varandra."
    - "Bibeln kallar den med flera namn: ”Kinneretsjön” i lagen och hos Josua, ”Gennesarets sjö” hos Lukas och ”Galileiska sjön, Tiberias’ sjö” hos Johannes, efter staden som Herodes Antipas lät bygga vid dess strand omkring år 20 e.Kr. Här kallade Jesus sina första lärjungar, då han ”vandrade utmed Galileiska sjön”, undervisade från en båt, tog sig över sjön många gånger och drabbades av storm på den, när ”vågorna slogo in i båten, så att båten redan begynte fyllas”. Sådana stormar är verkliga: sjön ligger i en djup dalgång, och vindar som störtar ned genom raviner från höjderna på båda sidor kan på några minuter få den att gå höga vågor."
    - "Josefus, som befälhade i Galileen i kriget år 66 e.Kr., säger att sjön är 140 stadier lång och 40 bred, omkring 26 gånger 7 km, med sött vatten som är gott att dricka; en fiskebåt från hans tid, funnen i leran vid västra stranden 1986 när vattnet sjönk, är 8,2 m lång och byggdes för en besättning på fem, fyra roddare och en rorsman; dess utgrävare räknade med att den kunde bära omkring femton män sammanlagt. Sjöns nivå har sjunkit under de senaste decennierna eftersom Israel har pumpat vatten ur den, så att evangeliernas strand nu ofta ligger en bit från vattnet."
  nb:
    - "Galileasjøen er en ferskvannsinnsjø på omtrent 21 km i lengde fra nord til sør og opptil 13 km i bredde, med et areal på omtrent 166 kvadratkilometer og en største dybde på omtrent 43 m; vannflaten ligger mellom omtrent 209 og 215 m under Middelhavets nivå, avhengig av året, noe som gjør den til den laveste ferskvannsinnsjøen på jorden. Kartpunktet står midt i den, omtrent 120 km nord for Jerusalem i luftlinje; Kapernaum på nordkysten og Tiberias på vestkysten ligger 12 km fra hverandre."
    - "Bibelen kaller den flere navn: «Kinnerets sjø» i loven og hos Josva, «Gennesaret-sjøen» hos Lukas og «den Galileiske Sjø, Tiberias-sjøen» hos Johannes, etter byen som Herodes Antipas bygde ved bredden omkring 20 e.Kr. Jesus kalte her sine første disipler, da han «vandret ved den Galileiske Sjø», underviste fra en båt, krysset den mange ganger og ble overrasket av storm på den, da «bølgene slo inn i båten, så at den holdt på å fylles». Slike stormer er virkelige: innsjøen ligger i en dyp forsenkning, og vinder som styrter ned gjennom kløftene fra høydene på begge sider, kan piske den opp i løpet av få minutter."
    - "Josefus, som var sjef for Galilea i krigen i 66 e.Kr., sier at innsjøen er 140 stadier lang og 40 bred, omtrent 26 ganger 7 km, med vann som er søtt og godt å drikke; en fiskebåt fra hans tid, funnet i leren ved vestkysten i 1986 da vannstanden var lav, er 8,2 m lang og ble bygget for en besetning på fem, fire roere og en rormann; utgraveren mente at den kunne bære omtrent femten mann til sammen. Innsjøens nivå har sunket de siste tiårene da Israel pumpet vann fra den, slik at evangeliets strand nå ofte ligger et stykke fra vannet."
