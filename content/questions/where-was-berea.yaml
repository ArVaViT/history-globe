id: where-was-berea
question:
  en: "Where was Berea, whose Jews searched the scriptures daily?"
  ru: "Где находилась Верия, где иудеи ежедневно разбирали Писания?"
  uk: "Де була Верія, чиї євреї щодня досліджували Писання?"
  es: "¿Dónde estaba Berea, cuyos judíos escudriñaban cada día las Escrituras?"
  pt: "Onde ficava Bereia, cujos judeus examinavam as Escrituras diariamente?"
  de: "Wo lag Beröa, dessen Juden täglich in der Schrift forschten?"
  fr: "Où était Bérée, dont les Juifs examinaient chaque jour les Écritures ?"
  pl: "Gdzie leżała Berea, której Żydzi codziennie badali Pisma?"
  it: "Dov’era Berea, i cui Giudei esaminavano le Scritture ogni giorno?"
  nl: "Waar lag Berea, wiens Joden dagelijks de Schriften onderzochten?"
  cs: "Kde byla Beroia, jejíž Židé denně zkoumali Písma?"
  sv: "Var låg Beroia, vars judar rannsakade skrifterna varje dag?"
  nb: "Hvor lå Berøa, hvis jøder gransket skriftene daglig?"
  tl: "Saan ang Berea, na ang mga Judio ay nagsiyasat ng mga kasulatan araw-araw?"
  da: "Hvor lå Berøa, hvis jøder ransagede skrifterne daglig?"
  sr: "Где је била Верија, чији су Јевреји сваки дан истраживали Писмо?"
answer:
  en:
    - "Berea, ancient Beroea, is the town of Veria in Greek Macedonia, on the eastern slope of Mount Vermio above the plain west of Thessalonica; the map point stands on it. It lay about 64 km west-south-west of Thessalonica in a straight line, off the main road, the Via Egnatia, and about 312 km north-north-west of Athens. Under Rome it was one of the leading towns of Macedonia and later the seat of the league of the Macedonian cities."
    - "Paul and Silas came here about AD 50, when after the riot in Thessalonica “the brethren immediately sent away Paul and Silas by night unto Berea”. Acts praises their hearers: “These were more noble than those in Thessalonica, in that they received the word with all readiness of mind, and searched the scriptures daily, whether those things were so.” Many believed, with Greek women of standing and not a few men. When Jews from Thessalonica came to stir up the people, the brethren “sent away Paul to go as it were to the sea”, and he went on to Athens, while Silas and Timothy stayed. Later Sopater of Berea went with Paul to Asia."
    - "Whether Paul then sailed to Athens from a port on the coast, such as Pydna or Dium, or went by land is disputed: many manuscripts read “as far as the sea”, while the reading behind the King James and the Synodal texts, “as it were to the sea”, has been taken for a feint to put off pursuers. Paved Roman streets and stretches of a late Roman wall rebuilt with reused inscribed stones lie under modern Veria, and a modern monument in the town, the Bema of the Apostle Paul, marks the place where tradition says he preached."
  ru:
    - "Древняя Верия — это нынешний город Верия в греческой Македонии, на восточном склоне горы Вермион над равниной к западу от Фессалоники; точка карты стоит на нём. Она лежала примерно в 64 км к западо-юго-западу от Фессалоники по прямой, в стороне от главной дороги — Эгнатиевой, и примерно в 312 км к северо-северо-западу от Афин. При римлянах это был один из главных городов Македонии, а позже — центр союза македонских городов."
    - "Павел и Сила пришли сюда около 50 г., когда после смуты в Фессалонике братия «немедленно ночью отправили Павла и Силу в Верию». Деяния хвалят их слушателей: «Здешние были благомысленнее Фессалоникских: они приняли слово со всем усердием, ежедневно разбирая Писания, точно ли это так». Многие уверовали, а с ними почётные еллинские женщины и немало мужчин. Когда иудеи из Фессалоники пришли возмущать народ, братия «отпустили Павла, как будто идущего к морю», и он ушёл в Афины, а Сила и Тимофей остались. Позже Сосипатр Пирров, Вериянин, сопровождал Павла до Асии."
    - "Отплыл ли тогда Павел в Афины из приморской гавани, например Пидны или Диона, или пошёл сушей, — спорно: многие рукописи читают «до моря», а чтение, на котором стоят Синодальный перевод и Библия короля Якова, — «как будто к морю» — понимают как уловку, чтобы сбить с толку преследователей. Под нынешней Верией лежат мощёные римские улицы и участки позднеримской стены, перестроенной из старых надписанных камней, а современный памятник в городе, Вима апостола Павла, отмечает место, где, по преданию, он проповедовал."
  uk:
    - "Верія, давня Берея, — це місто Верія в грецькій Македонії, на східному схилі гори Вермій над рівниною на захід від Солуня; точка мапи стоїть на ній. Вона лежала приблизно за 64 км на захід-південний захід від Солуня по прямій, осторонь головної дороги, Егнатієвої дороги, і приблизно за 312 км на північ-північний захід від Афін. За Рима вона була одним з провідних міст Македонії, а згодом осередком союзу македонських міст."
    - "Павло й Сила прийшли сюди близько 50 р. н. е., коли після заколоту в Солуні «Брати ж зараз уночі вислали Павла та Силу у Верию». Дії хвалять їхніх слухачів: «Сї ж були благороднїщі від тих, що в Солунї; вони прийняли слово з великою охотою, що-дня розбираючи писаннє, чи так воно є». Багато хто увірував, з грецьких жінок поважних і чоловіків чимало. Коли євреї з Солуня прийшли бунтувати народ, брати вислали Павла, «щоб йшов нїби над море», і він пішов до Афін, тоді як Сила й Тимофій залишилися. Пізніше Сосипатр з Верії пішов із Павлом до Азії."
    - "Чи Павло тоді відплив до Афін з порту на узбережжі, як-от Пидна чи Діон, чи пішов суходолом, спірно: багато рукописів читають «аж до моря», тоді як прочитання, що лежить в основі Біблії короля Якова й Синодального тексту, «нїби над море», вважали за хитрощі, щоб збити переслідувачів. Бруковані римські вулиці та відтинки пізньоримського муру, перебудованого з повторно використаних написаних каменів, лежать під сучасною Верією, а сучасний пам'ятник у місті, Бема апостола Павла, позначає місце, де, за традицією, він проповідував."
  es:
    - "Berea, la antigua Beroea, es la población de Veria, en la Macedonia griega, en la ladera oriental del monte Vermio, sobre la llanura al oeste de Tesalónica; allí está el punto del mapa. Quedaba a unos 64 km al oeste-suroeste de Tesalónica en línea recta, apartada de la vía principal, la vía Egnatia, y a unos 312 km al nor-noroeste de Atenas. Bajo Roma fue una de las principales ciudades de Macedonia y más tarde la sede de la liga de las ciudades macedonias."
    - "Pablo y Silas llegaron aquí hacia el 50 d. C., cuando tras el tumulto de Tesalónica «los hermanos, luego de noche, enviaron á Pablo y á Silas á Berea». Hechos elogia a sus oyentes: «Y fueron éstos más nobles que los que estaban en Tesalónica, pues recibieron la palabra con toda solicitud, escudriñando cada día las Escrituras, si estas cosas eran así». Creyeron muchos, con mujeres griegas de distinción y no pocos hombres. Cuando llegaron judíos de Tesalónica para agitar al pueblo, los hermanos «enviaron á Pablo que fuese como á la mar», y él siguió hacia Atenas, mientras Silas y Timoteo se quedaron. Más tarde Sópater de Berea acompañó a Pablo hasta Asia."
    - "Si Pablo zarpó entonces hacia Atenas desde un puerto de la costa, como Pidna o Dio, o fue por tierra es discutido: muchos manuscritos leen «hasta el mar», mientras que la lectura que está detrás de la Biblia del Rey Jacobo y del texto sinodal, «como á la mar», se ha tomado por una estratagema para despistar a los perseguidores. Calles romanas pavimentadas y tramos de una muralla romana tardía reconstruida con piedras inscritas reutilizadas yacen bajo la Veria moderna, y un monumento moderno de la ciudad, el Bema del Apóstol Pablo, señala el lugar donde la tradición dice que predicó."
  pt:
    - "Bereia, a antiga Beroia, é a cidade de Véria, na Macedônia grega, na encosta oriental do monte Vermio, acima da planície a oeste de Tessalônica; o ponto do mapa está nela. Ficava a cerca de 64 km a oés-sudoeste de Tessalônica em linha reta, fora da estrada principal, a via Egnácia, e a cerca de 312 km a nor-noroeste de Atenas. Sob Roma foi uma das principais cidades da Macedônia e depois sede da liga das cidades macedônicas."
    - "Paulo e Silas vieram aqui por volta de 50 d.C., quando, depois do tumulto em Tessalônica, “os irmãos enviaram imediatamente Paulo e Silas de noite para Bereia”. Atos elogia seus ouvintes: “Ora, estes foram mais nobres do que os de Tessalônica, pois receberam a palavra com toda a disposição, examinando as Escrituras diariamente para ver se estas coisas eram assim.” Muitos creram, com mulheres gregas de destaque e não poucos homens. Quando judeus de Tessalônica vieram agitar o povo, os irmãos enviaram Paulo “para ir até o mar”, e ele seguiu para Atenas, enquanto Silas e Timóteo ficaram. Mais tarde Sópatro de Bereia acompanhou Paulo até a Ásia."
    - "Se Paulo navegou então para Atenas de um porto da costa, como Pidna ou Dião, ou foi por terra é disputado: muitos manuscritos leem “até o mar”, enquanto a leitura por trás da Bíblia do rei Tiago e dos textos sinodais, “como que para o mar”, foi tomada por um ardil para despistar perseguidores. Ruas romanas pavimentadas e trechos de uma muralha romana tardia reconstruída com pedras inscritas reaproveitadas jazem sob a Véria moderna, e um monumento moderno na cidade, o Bema do Apóstolo Paulo, marca o lugar onde a tradição diz que ele pregou."
  de:
    - "Beröa, das antike Beroia, ist die Stadt Veria im griechischen Makedonien, am Osthang des Vermion über der Ebene westlich von Thessalonich; der Kartenpunkt liegt darauf. Es lag in der Luftlinie etwa 64 km westsüdwestlich von Thessalonich, abseits der Hauptstraße, der Via Egnatia, und etwa 312 km nordnordwestlich von Athen. Unter Rom war es eine der führenden Städte Makedoniens und später Sitz des Bundes der makedonischen Städte."
    - "Paulus und Silas kamen um 50 n. Chr. hierher, als nach dem Aufruhr in Thessalonich „Die Brüder aber fertigten alsobald ab bei der Nacht Paulus und Silas gen Beröa“. Die Apostelgeschichte lobt ihre Hörer: „Diese aber waren edler denn die zu Thessalonich; die nahmen das Wort auf ganz willig und forschten täglich in der Schrift, ob sich's also verhielte.“ Viele glaubten, mit angesehenen griechischen Frauen und nicht wenigen Männern. Als Juden aus Thessalonich kamen, um das Volk aufzuwiegeln, „fertigten die Brüder Paulus alsobald ab, daß er ginge bis an das Meer“, und er zog weiter nach Athen, während Silas und Timotheus blieben. Später zog Sopater aus Beröa mit Paulus nach Asien."
    - "Ob Paulus dann von einem Hafen an der Küste wie Pydna oder Dion nach Athen segelte oder zu Land ging, ist umstritten: Viele Handschriften lesen „bis an das Meer“, während die Lesart hinter der King-James- und der Synodalbibel, „wie zum Meer“, als Finte zur Täuschung der Verfolger gedeutet wurde. Gepflasterte römische Straßen und Abschnitte einer spätrömischen Mauer, mit wiederverwendeten Inschriftensteinen neu gebaut, liegen unter dem heutigen Veria, und ein modernes Denkmal in der Stadt, das Bema des Apostels Paulus, bezeichnet die Stelle, wo er nach der Überlieferung predigte."
  fr:
    - "Bérée, l’ancienne Béroia, est la ville de Véria en Macédoine grecque, sur le versant est du mont Vermion au-dessus de la plaine à l’ouest de Thessalonique ; le point de la carte s’y trouve. Elle était à environ 64 km à l’ouest-sud-ouest de Thessalonique en ligne droite, à l’écart de la grande route, la Via Egnatia, et à environ 312 km au nord-nord-ouest d’Athènes. Sous Rome, elle fut l’une des villes principales de Macédoine et plus tard le siège de la ligue des cités macédoniennes."
    - "Paul et Silas y vinrent vers 50 apr. J.-C., quand, après l’émeute de Thessalonique, « les frères firent partir de nuit Paul et Silas pour Bérée ». Les Actes louent leurs auditeurs : « Ces Juifs avaient des sentiments plus nobles que ceux de Thessalonique ; ils reçurent la parole avec beaucoup d’empressement, et ils examinaient chaque jour les Écritures, pour voir si ce qu’on leur disait était exact. » Plusieurs crurent, ainsi que de nobles femmes grecques et beaucoup d’hommes. Quand des Juifs de Thessalonique vinrent agiter la foule, les frères « firent aussitôt partir Paul du côté de la mer », et il gagna Athènes, tandis que Silas et Timothée restaient. Plus tard, Sopater de Bérée accompagna Paul en Asie."
    - "Que Paul ait alors embarqué pour Athènes depuis un port de la côte, comme Pydna ou Dion, ou ait voyagé par terre est discuté : beaucoup de manuscrits portent « jusqu’à la mer », tandis que la leçon derrière la King James et les textes synodaux, « comme vers la mer », a été prise pour une feinte destinée à dérouter les poursuivants. Des rues romaines pavées et des tronçons d’un mur romain tardif rebâti avec des pierres inscrites réemployées gisent sous la Véria moderne, et un monument moderne de la ville, le Bêma de l’apôtre Paul, marque le lieu où, selon la tradition, il prêcha."
  pl:
    - "Berea, starożytna Beroia, to miasto Weria w greckiej Macedonii, na wschodnim zboczu góry Wermion nad równiną na zachód od Tesaloniki; punkt na mapie stoi na niej. Leżała około 64 km na zachód-południowy zachód od Tesaloniki w linii prostej, z dala od głównej drogi, Via Egnatia, i około 312 km na północ-północny zachód od Aten. Pod Rzymem była jednym z czołowych miast Macedonii, a później siedzibą związku miast macedońskich."
    - "Paweł i Sylas przybyli tu około 50 n.e., gdy po zamieszkach w Tesalonice „bracia wnet w nocy wysłali i Pawła, i Sylę do Berei”. Dzieje chwalą ich słuchaczy: „A cić byli zacniejsi nad one, co byli w Tesalonice, którzy przyjęli słowo Boże ze wszystką ochotą, na każdy dzień rozsądzając Pisma, jeźliby się tak miało.” Wielu uwierzyło, w tym greckie kobiety z szanowanych rodzin i niemało mężczyzn. Gdy Żydzi z Tesaloniki przyszli podburzać lud, bracia „wysłali Pawła, aby szedł jakoby do morza”, a on poszedł do Aten, podczas gdy Sylas i Tymoteusz zostali. Później Sopater z Berei towarzyszył Pawłowi do Azji."
    - "Czy Paweł popłynął potem do Aten z portu na wybrzeżu, takiego jak Pydna lub Dion, czy poszedł lądem, jest sporne: wiele rękopisów czyta „aż do morza”, a odczytanie stojące za przekładem Króla Jakuba i tekstami synodalnymi, „jakoby do morza”, uznawano za podstęp, by zmylić ścigających. Brukowane ulice rzymskie i odcinki późnorzymskiego muru odbudowanego z ponownie użytych kamieni z napisami leżą pod współczesną Werią, a współczesny pomnik w mieście, Bema Apostoła Pawła, wskazuje miejsce, gdzie według tradycji nauczał."
  it:
    - "Berea, l’antica Beroea, è la città di Veria nella Macedonia greca, sul versante orientale del Monte Vermio sopra la pianura a ovest di Tessalonica; il punto della mappa vi sta sopra. Dista circa 64 km a ovest-sud-ovest da Tessalonica in linea retta, fuori dalla strada principale, la Via Egnazia, e circa 312 km a nord-nord-ovest di Atene. Sotto Roma fu una delle principali città della Macedonia e poi sede della lega delle città macedoni."
    - "Paolo e Sila giunsero qui verso il 50 d.C., quando dopo il tumulto di Tessalonica «i fratelli, subito, di notte, fecero partire Paolo e Sila per Berea». Gli Atti lodano chi li ascoltava: «questi furono più generosi di quelli di Tessalonica, in quanto che ricevettero la Parola con ogni premura, esaminando tutti i giorni le Scritture per vedere se le cose stavan così». Molti credettero, con nobildonne greche e non pochi uomini. Quando i Giudei di Tessalonica vennero ad agitare il popolo, i fratelli «fecero partire immediatamente Paolo, conducendolo fino al mare», ed egli proseguì per Atene, mentre Sila e Timoteo rimasero. Più tardi Sopatro di Berea accompagnò Paolo in Asia."
    - "Se Paolo poi salpò per Atene da un porto della costa, come Pidna o Dio, o andò per terra è discusso: molti manoscritti leggono «fino al mare», mentre la lettura che sta dietro al testo della King James e a quello sinodale, «come per andare al mare», è stata presa per un diversivo per sviare gli inseguitori. Strade romane lastricate e tratti di un muro tardo-romano ricostruito con iscrizioni reimpiegate giacciono sotto la moderna Veria, e un monumento moderno nella città, il Bema dell’apostolo Paolo, segna il luogo dove la tradizione dice che predicò."
  nl:
    - "Berea, het oude Beroea, is de stad Veria in Grieks Macedonië, op de oosthelling van de Vermio boven de vlakte ten westen van Tessalonica; het punt op de kaart staat erop. Het lag hemelsbreed ongeveer 64 km west-zuidwestelijk van Tessalonica, buiten de hoofdweg, de Via Egnatia, en ongeveer 312 km noord-noordwestelijk van Athene. Onder Rome was het een van de voornaamste steden van Macedonië en later de zetel van de bond van de Macedonische steden."
    - "Paulus en Silas kwamen hier omstreeks 50 n.Chr., toen na de rel in Tessalonica “de broeders zonden terstond des nachts Paulus en Silas weg naar Berea”. Handelingen prijst hun hoorders: “En dezen waren edeler, dan die te Thessalonica waren, als die het woord ontvingen met alle toegenegenheid, onderzoekende dagelijks de Schriften, of deze dingen alzo waren.” Velen geloofden, met Griekse vrouwen van aanzien en niet weinige mannen. Toen Joden uit Tessalonica kwamen om het volk op te ruien, “de broeders zonden toen van stonde aan Paulus weg, dat hij ging als naar de zee”, en hij ging verder naar Athene, terwijl Silas en Timoteüs bleven. Later ging Sopater van Berea met Paulus naar Asia."
    - "Of Paulus toen vanuit een kusthaven zoals Pydna of Dion naar Athene voer of over land ging, is omstreden: veel handschriften lezen “tot aan de zee”, terwijl de lezing achter de King James- en de Synodale tekst, “als naar de zee”, is opgevat als een schijnbeweging om achtervolgers af te schudden. Bestrate Romeinse straten en stukken van een laat-Romeinse muur, herbouwd met hergebruikte inscriptiestenen, liggen onder het moderne Veria, en een modern monument in de stad, het Bema van de apostel Paulus, markeert de plaats waar hij volgens de overlevering predikte."
  cs:
    - "Beroia, starověká Beroea, je dnešní město Veria v řecké Makedonii, na východním svahu pohoří Vermio nad rovinou západně od Tesalonik; bod na mapě stojí na něm. Ležela asi 64 km západojihozápadně od Tesalonik vzdušnou čarou, stranou hlavní silnice, Via Egnatia, a asi 312 km severoseverozápadně od Atén. Pod Římem byla jedním z předních měst Makedonie a později sídlem svazu makedonských měst."
    - "Pavel a Silas sem přišli asi roku 50 n. l., když po nepokojích v Tesalonice „bratří pak hned v noci vypustili i Pavla i Sílu do Berie“. Skutky chválí jejich posluchače: „A ti byli udatnější nežli Tessalonitští, kteřížto přijali slovo Boží se vší chtivostí, na každý den rozvažujíce Písma, tak-li by ty věci byly, jakž kázal Pavel.“ Mnozí uvěřili, i řecké ženy poctivé a mužů nemálo. Když Židé z Tesalonik přišli bouřit zástupy, „hned bratří vypustili Pavla, aby šel jako k moři“ a on šel dál do Atén, zatímco Silas a Timoteus zůstali. Později šel Sopatros z Beroie s Pavlem do Asie."
    - "Zda Pavel poté plul do Atén z přístavu na pobřeží, například z Pydny nebo Dia, nebo šel po souši, se diskutuje: mnohé rukopisy čtou „až k moři“, zatímco čtení za King Jamesovou biblí a synodálním textem, „jako k moři“, bylo pokládáno za lest k zmatení pronásledovatelů. Dlážděné římské ulice a úseky pozdně římské hradby přestavěné z druhotně užitých nápisových kamenů leží pod dnešní Verií a moderní památník ve městě, Bema apoštola Pavla, označuje místo, kde podle tradice kázal."
  sv:
    - "Beroia är staden Veria i grekiska Makedonien, på östra sluttningen av berget Vermio ovanför slätten väster om Tessalonike; kartpunkten står på den. Den låg omkring 64 km väst-sydväst om Tessalonike fågelvägen, vid sidan av huvudvägen Via Egnatia, och omkring 312 km nord-nordväst om Aten. Under Rom var den en av Makedoniens ledande städer och senare säte för de makedoniska städernas förbund."
    - "Paulus och Silas kom hit omkring 50 e.Kr., då efter upploppet i Tessalonike ”strax om natten blevo Paulus och Silas av bröderna sända åstad till Berea”. Apostlagärningarna prisar deras åhörare: ”Dessa voro ädlare till sinnes än judarna i Tessalonika; de togo emot ordet med all villighet och rannsakade var dag skrifterna, för att se om det förhölle sig såsom nu sades.” Många kom till tro, ”likaså ganska många ansedda grekiska kvinnor och jämväl män”. När judar från Tessalonike kom för att uppvigla folket sände ”bröderna Paulus åstad ända ned till havet”, och han gick vidare till Aten, medan Silas och Timoteus stannade kvar. Senare följde Sopatros från Beroia med Paulus till Asien."
    - "Om Paulus då seglade till Aten från en hamn vid kusten, såsom Pydna eller Dion, eller gick landvägen är omstritt: många handskrifter har ”ända ned till havet”, medan läsningen bakom King James-bibeln och Synodalbibeln, ”liksom till havet”, har tagits för en list för att avleda förföljare. Stenlagda romerska gator och sträckor av en senromersk mur, ombyggd med återanvända inskrivna stenar, ligger under dagens Veria, och ett modernt monument i staden, aposteln Paulus bema, markerar platsen där traditionen säger att han predikade."
  nb:
    - "Berøa, det antikke Beroia, er byen Veria i gresk Makedonia, på østskråningen av Vermio-fjellet over sletten vest for Tessalonika; kartpunktet står på den. Den lå omtrent 64 km vest-sørvest for Tessalonika i luftlinje, utenfor hovedveien, Via Egnatia, og omtrent 312 km nord-nordvest for Aten. Under Roma var den en av Makedonias ledende byer og senere sete for de makedonske byenes forbund."
    - "Paulus og Silas kom hit omkring 50 e.Kr., da «straks samme natt sendte brødrene både Paulus og Silas avsted til Berøa» etter opptøyet i Tessalonika. Apostlenes gjerninger roser tilhørerne: «Men disse var av et edlere sinn enn de i Tessalonika; de tok imot ordet med all godvilje, og gransket daglig i skriftene om det var således som det blev sagt dem.» Mange kom til troen, med greske kvinner av stand og ikke få menn. Da jøder fra Tessalonika kom for å egge opp folket, sendte «brødrene Paulus avsted på veien til havet», og han dro videre til Aten, mens Silas og Timoteus ble igjen. Senere fulgte Sopater fra Berøa Paulus til Asia."
    - "Om Paulus da seilte til Aten fra en havn på kysten, som Pydna eller Dion, eller dro over land, er omstridt: mange håndskrifter har «helt til havet», mens lesemåten bak King James- og synodaltekstene, «som om han skulle til havet», er blitt tatt for en finte for å kaste forfølgerne av sporet. Brolagte romerske gater og strekninger av en senromersk mur, gjenreist med gjenbrukte innskrevne steiner, ligger under dagens Veria, og et moderne monument i byen, apostelen Paulus' Bema, markerer stedet der tradisjonen sier at han forkynte."
  tl:
    - "Ang Berea, sinaunang Beroea, ay ang bayan ng Veria sa Macedonia ng Grecia, sa silangang dalisdis ng Bundok Vermio sa itaas ng kapatagan sa kanluran ng Tesalonica; doon nakatayo ang tuldok sa mapa. Ito ay mga 64 km sa kanluran-timog-kanluran ng Tesalonica sa tuwid na guhit, malayo sa pangunahing daan, ang Via Egnatia, at mga 312 km sa hilaga-hilagang-kanluran ng Atenas. Sa ilalim ng Roma, isa ito sa mga nangungunang bayan ng Macedonia at kalaunan ang luklukan ng liga ng mga lungsod ng Macedonia."
    - "Dumating dito sina Pablo at Silas mga 50 AD, nang pagkatapos ng gulo sa Tesalonica ay “pagdaka'y pinayaon sa gabi ng mga kapatid si Pablo at si Silas sa Berea”. Pinupuri ng Mga Gawa ang mga nakinig: “Ngayon lalong naging mararangal ang mga ito kay sa mga taga Tesalonica, sapagka't tinanggap nila ang salita ng buong pagsisikap, at sinisiyasat sa araw-araw ang mga kasulatan, kung tunay nga ang mga bagay na ito.” Marami ang sumampalataya, kasama ang mga babaing Griyego na may katayuan at hindi kakaunting lalaki. Nang dumating ang mga Judio mula sa Tesalonica upang pukawin ang bayan, “pinayaon ng mga kapatid si Pablo na pumaroon hanggang sa dagat”, at nagpatuloy siya sa Atenas, samantalang nanatili sina Silas at Timoteo. Kalaunan, sumama si Sopatro ng Berea kay Pablo sa Asia."
    - "Pinagtatalunan kung naglayag si Pablo patungong Atenas mula sa daungan sa baybayin, gaya ng Pydna o Dium, o dumaan sa lupa: maraming manuskrito ang bumabasa ng “hanggang sa dagat”, samantalang ang pagbasang nasa likod ng King James at ng mga tekstong Sinodal, “waring patungo sa dagat”, ay itinuring na panlilinlang upang iligaw ang mga humahabol. Nasa ilalim ng makabagong Veria ang mga pinaved na kalyeng Romano at mga bahagi ng huling pader na Romano na muling itinayo gamit ang muling ginamit na batong may inskripsiyon, at isang makabagong monumento sa bayan, ang Bema ng Apostol Pablo, ay nagmamarka sa lugar kung saan sinasabi ng tradisyon na nangaral siya."
  da:
    - "Berøa, antikkens Beroea, er byen Veria i græsk Makedonien, på østskråningen af Vermio-bjerget over sletten vest for Thessalonika; kortets punkt står på den. Den lå omkring 64 km vestsydvest for Thessalonika i luftlinje, væk fra hovedvejen, Via Egnatia, og omkring 312 km nordnordvest for Athen. Under Rom var den en af Makedoniens førende byer og senere sæde for forbundet af de makedonske byer."
    - "Paulus og Silas kom hertil omkring 50 e.Kr., da efter optøjet i Thessalonika »Brødrene sendte straks om Natten baade Paulus og Silas bort til Berøa«. Apostlenes Gerninger roser deres tilhørere: »disse vare mere velsindede end de i Thessalonika, de modtoge Ordet med al Redebonhed og ransagede daglig Skrifterne, om disse Ting forholdt sig saaledes.« Mange troede, med græske kvinder af anseelse og ikke få mænd. Da jøder fra Thessalonika kom for at ophidse folket, »sendte Brødrene straks Paulus bort, for at han skulde drage til Havet«, og han gik videre til Athen, mens Silas og Timotheus blev. Senere fulgte Sopater fra Berøa Paulus til Asien."
    - "Om Paulus så sejlede til Athen fra en havn ved kysten, som Pydna eller Dion, eller gik til lands, er omstridt: mange håndskrifter har »lige til havet«, mens læsningen bag King James- og de synodale tekster, »som til havet«, er blevet taget for en list for at afvise forfølgerne. Brolagte romerske gader og strækninger af en sen romersk mur, genopbygget med genbrugte indskrevne sten, ligger under det moderne Veria, og et moderne monument i byen, Apostlen Paulus' Bema, markerer det sted, hvor traditionen siger, at han prædikede."
  sr:
    - "Верија, античка Бероја, јесте град Верија у грчкој Македонији, на источној падини планине Вермион изнад равнице западно од Солуна; тачка на карти стоји на њој. Лежала је око 64 км западно-југозападно од Солуна правом линијом, ван главног пута, Егнатијевог пута, и око 312 км северо-северозападно од Атине. Под Римом била је један од водећих градова Македоније, а касније седиште савеза македонских градова."
    - "Павле и Сила дошли су овамо око 50. н. е., кад су после немира у Солуну: „А браћа одмах ноћу оправише Павла и Силу у Верију“. Дела хвале њихове слушаоце: „Ови пак беху племенитији од оних што живе у Солуну; они примише реч са свим срцем, и сваки дан истраживаху по писму је ли то тако.“ Многи су поверовали, међу њима грчке жене угледа и не мало мушкараца: „од поштених грчких жена и од људи не мало“. Кад су Јевреји из Солуна дошли да подигну народ, „браћа онда одмах отправише Павла да иде у приморје“, и он је отишао даље у Атину, док су Сила и Тимотије остали. Касније је Сосипатар из Верије пошао с Павлом у Азију."
    - "Да ли је Павле тада запловио у Атину из луке на обали, као Пидна или Дион, или је ишао копном, спорно је: многи рукописи читају „све до мора“, док читање иза Краља Џејмса и синодалног текста, „као да иде ка мору“, неки узимају за лажно кретање да се збуне прогонитељи. Поплочане римске улице и делови касноримског зида обновљеног од поново употребљених уклесаних камења леже испод савремене Верије, а савремени споменик у граду, Вима апостола Павла, означава место на коме је, по предању, проповедао."
