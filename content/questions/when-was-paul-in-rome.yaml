# Draft question (the years; "how-far-jerusalem-to-rome" takes the route, and the article "Rome" the city).
id: when-was-paul-in-rome
question:
  en: "When was Paul in Rome?"
  ru: "Когда Павел был в Риме?"
answer:
  en:
    - "From the spring of AD 60 to about 62, on the usual chronology: he arrived as a prisoner after the winter's shipwreck, “dwelt two whole years in his own hired house”, and there Acts ends. Early tradition adds that he was released, travelled again, was arrested a second time and put to death in Rome under Nero, between the fire of 64 and the emperor's fall in 68. Scholars who date the procurator Festus earlier put the arrival in 56 or 57; the map uses AD 60."
    - "Paul had long meant to see Rome: “After I have been there, I must also see Rome”, he said at Ephesus, and he wrote to the Romans of going on to Spain. Arrested in Jerusalem, he was kept two years at Caesarea under Felix; when Festus succeeded him Paul said, “I appeal unto Caesar”, and was sent by sea in the autumn, after “the fast” of the Day of Atonement. In Rome “Paul was suffered to dwell by himself with a soldier that kept him”, and he preached “with all confidence, no man forbidding him”. The letters to the Philippians, the Colossians, Philemon and the Ephesians are by old tradition the letters of these years, written by “Paul the aged, and now also a prisoner”, whose “bonds in Christ are manifest in all the palace” and who sends the greetings of the saints, “chiefly they that are of Caesar's household”; some scholars place one or more of them at Caesarea or Ephesus instead."
    - "The year hangs on Festus. A few scholars, reading Josephus on the recall of Felix, put it in 55 or 56; most put Festus's arrival in 59, so that Paul sailed that autumn, wintered on Malta and reached Rome in the spring of 60. What came after the two years Luke does not say. Clement of Rome, about AD 96, writes that Paul taught “the whole world” righteousness and reached “the limit of the west”, and the Muratorian fragment speaks of his departure from Rome for Spain; Eusebius reports the tradition that after defending himself he went out to preach again and, coming to Rome a second time, was martyred under Nero; the second letter to Timothy has him on trial again, when at his “first answer no man stood with me”, and “the time of my departure is at hand”. Jerome gives the fourteenth year of Nero, AD 67–68, and his tomb is shown on the Ostian Way."
  ru:
    - "С весны 60 г. н. э. примерно по 62-й, по обычной хронологии: он прибыл узником после зимнего кораблекрушения, «жил… целых два года на своем иждивении», и на этом книга Деяний кончается. Раннее предание добавляет, что его отпустили, он снова путешествовал, был взят во второй раз и казнён в Риме при Нероне — между пожаром 64 г. и падением императора в 68-м. Учёные, датирующие прокуратора Феста раньше, относят прибытие к 56 или 57 г.; карта показывает 60 г. н. э."
    - "Павел давно собирался увидеть Рим: «побывав там, я должен видеть и Рим», сказал он в Ефесе, а римлянам писал, что пойдёт дальше в Испанию. Схваченный в Иерусалиме, он два года содержался в Кесарии при Феликсе; когда на его место пришёл Фест, Павел сказал: «Требую суда кесарева», и его отправили морем осенью, когда «и пост уже прошел» — пост Дня очищения. В Риме «Павлу позволено жить особо с воином, стерегущим его», и проповедовал «со всяким дерзновением невозбранно». Послания к Филиппийцам, Колоссянам, Филимону и Ефесянам по древнему преданию написаны в эти годы — тем, кто называет себя «Павел старец, а теперь и узник», чьи «узы… о Христе сделались известными всей претории» и кто передаёт приветы от святых, «а наипаче из кесарева дома»; некоторые учёные относят одно или несколько из них к Кесарии или Ефесу."
    - "Год зависит от Феста. Немногие учёные, читая у Иосифа Флавия об отзыве Феликса, относят это к 55 или 56 г.; большинство относит приход Феста к 59 г., так что Павел отплыл той же осенью, перезимовал на Мелите и достиг Рима весной 60-го. Что было после двух лет, Лука не говорит. Климент Римский около 96 г. пишет, что Павел научил праведности «весь мир» и дошёл «до предела запада», а канон Муратори говорит о его отбытии из Рима в Испанию; Евсевий передаёт предание, что, оправдавшись, он снова пошёл проповедовать и, придя в Рим во второй раз, принял мученическую смерть при Нероне; во Втором послании к Тимофею он снова под судом — «при первом моем ответе никого не было со мною» — и «время моего отшествия настало». Иероним называет четырнадцатый год Нерона, 67–68 гг. н. э., а его гробницу показывают на Остийской дороге."
