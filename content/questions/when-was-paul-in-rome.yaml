# Draft question (the years; "how-far-jerusalem-to-rome" takes the route, and the article "Rome" the city).
id: when-was-paul-in-rome
question:
  en: "When was Paul in Rome?"
  ru: "Когда Павел был в Риме?"
  uk: "Коли Павло був у Римі?"
  es: "¿Cuándo estuvo Pablo en Roma?"
  pt: "Quando Paulo esteve em Roma?"
  de: "Wann war Paulus in Rom?"
  fr: "Quand Paul était-il à Rome ?"
  pl: "Kiedy Paweł był w Rzymie?"
  it: "Quando fu Paolo a Roma?"
  nl: "Wanneer was Paulus in Rome?"
  cs: "Kdy byl Pavel v Římě?"
  sv: "När var Paulus i Rom?"
  nb: "Når var Paulus i Roma?"
  tl: "Kailan nasa Roma si Pablo?"
  da: "Hvornår var Paulus i Rom?"
  sr: "Када је Павле био у Риму?"
  hu: "Mikor volt Pál Rómában?"
  fi: "Milloin Paavali oli Roomassa?"
  vi: "Phao-lô ở Rô-ma khi nào?"
  ro: "Când a fost Pavel la Roma?"
  bg: "Кога Павел е бил в Рим?"
answer:
  en:
    - "From the spring of AD 60 to about 62, on the usual chronology: he arrived as a prisoner after the winter's shipwreck, “dwelt two whole years in his own hired house”, and there Acts ends. Early tradition adds that he was released, travelled again, was arrested a second time and put to death in Rome under Nero, between the fire of 64 and the emperor's fall in 68. Scholars who date the procurator Festus earlier put the arrival in 56 or 57; the map uses AD 60."
    - "Paul had long meant to see Rome: “After I have been there, I must also see Rome”, he said at Ephesus, and he wrote to the Romans of going on to Spain. Arrested in Jerusalem, he was kept two years at Caesarea under Felix; when Festus succeeded him Paul said, “I appeal unto Caesar”, and was sent by sea in the autumn, after “the fast” of the Day of Atonement. In Rome “Paul was suffered to dwell by himself with a soldier that kept him”, and he preached “with all confidence, no man forbidding him”. The letters to the Philippians, the Colossians, Philemon and the Ephesians are by old tradition the letters of these years, written by “Paul the aged, and now also a prisoner”, whose “bonds in Christ are manifest in all the palace” and who sends the greetings of the saints, “chiefly they that are of Caesar's household”; some scholars place one or more of them at Caesarea or Ephesus instead."
    - "The year hangs on Festus. A few scholars, reading Josephus on the recall of Felix, put it in 55 or 56; most put Festus's arrival in 59, so that Paul sailed that autumn, wintered on Malta and reached Rome in the spring of 60. What came after the two years Luke does not say. Clement of Rome, about AD 96, writes that Paul taught “the whole world” righteousness and reached “the limit of the west”, and the Muratorian fragment speaks of his departure from Rome for Spain; Eusebius reports the tradition that after defending himself he went out to preach again and, coming to Rome a second time, was martyred under Nero; the second letter to Timothy has him on trial again, when at his “first answer no man stood with me”, and “the time of my departure is at hand”. Jerome gives the fourteenth year of Nero, AD 67–68, and his tomb is shown on the Ostian Way."
  ru:
    - "С весны 60 г. н. э. примерно по 62-й, по обычной хронологии: он прибыл узником после зимнего кораблекрушения, «жил… целых два года на своем иждивении», и на этом книга Деяний кончается. Раннее предание добавляет, что его отпустили, он снова путешествовал, был взят во второй раз и казнён в Риме при Нероне — между пожаром 64 г. и падением императора в 68-м. Учёные, датирующие прокуратора Феста раньше, относят прибытие к 56 или 57 г.; карта показывает 60 г. н. э."
    - "Павел давно собирался увидеть Рим: «побывав там, я должен видеть и Рим», сказал он в Ефесе, а римлянам писал, что пойдёт дальше в Испанию. Схваченный в Иерусалиме, он два года содержался в Кесарии при Феликсе; когда на его место пришёл Фест, Павел сказал: «Требую суда кесарева», и его отправили морем осенью, когда «и пост уже прошел» — пост Дня очищения. В Риме «Павлу позволено жить особо с воином, стерегущим его», и проповедовал «со всяким дерзновением невозбранно». Послания к Филиппийцам, Колоссянам, Филимону и Ефесянам по древнему преданию написаны в эти годы — тем, кто называет себя «Павел старец, а теперь и узник», чьи «узы… о Христе сделались известными всей претории» и кто передаёт приветы от святых, «а наипаче из кесарева дома»; некоторые учёные относят одно или несколько из них к Кесарии или Ефесу."
    - "Год зависит от Феста. Немногие учёные, читая у Иосифа Флавия об отзыве Феликса, относят это к 55 или 56 г.; большинство относит приход Феста к 59 г., так что Павел отплыл той же осенью, перезимовал на Мелите и достиг Рима весной 60-го. Что было после двух лет, Лука не говорит. Климент Римский около 96 г. пишет, что Павел научил праведности «весь мир» и дошёл «до предела запада», а канон Муратори говорит о его отбытии из Рима в Испанию; Евсевий передаёт предание, что, оправдавшись, он снова пошёл проповедовать и, придя в Рим во второй раз, принял мученическую смерть при Нероне; во Втором послании к Тимофею он снова под судом — «при первом моем ответе никого не было со мною» — и «время моего отшествия настало». Иероним называет четырнадцатый год Нерона, 67–68 гг. н. э., а его гробницу показывают на Остийской дороге."
  uk:
    - "Від весни 60 р. н. е. до близько 62 р. за звичною хронологією: він прибув як в'язень після зимової корабельної аварії, «пробував же … цїлих два роки в найнятій хатї своїй», і на цьому закінчуються Дії. Рання традиція додає, що його було звільнено, він знову мандрував, був заарештований удруге й страчений у Римі за Нерона між пожежею 64 р. і падінням імператора 68 р. Учені, що датують прокуратора Феста раніше, відносять прибуття до 56 або 57 р.; мапа використовує 60 р. н. е."
    - "Павло давно мав намір побачити Рим: «побувши там, мушу й Рим побачити», сказав він в Ефесі, і писав римлянам про поїздку далі в Іспанію. Заарештований у Єрусалимі, він два роки сидів у Кесарії за Феликса; коли Фест змінив його, Павло сказав: «Покликуюсь до кесаря», — і був відісланий морем восени, після «посту» Дня очищення. У Римі «Павлу ж дозволено жити окроме з воїном, що стеріг його», і він проповідував «з усією сьміливостю, без заборони». Послання до филип'ян, колосян, Филимона й ефесян за давньою традицією є посланнями цих років, написаними «Павел, старець, тепер же і вязник Ісуса Христа», чиї «кайдани мої в Христї обявились у всьому судищі» і який передає вітання святих, «найбільш которі з кесаревого дому»; деякі вчені відносять одне чи кілька з них натомість до Кесарії або Ефеса."
    - "Рік залежить від Феста. Деякі вчені, читаючи Йосифа Флавія про відкликання Феликса, відносять це до 55 або 56 р.; більшість відносить прибуття Феста до 59 р., тож Павло відплив тієї осені, перезимував на Мальті й дістався Рима навесні 60 р. Що було після двох років, Лука не каже. Климент Римський близько 96 р. н. е. пише, що Павло навчав «весь світ» праведності й дійшов «до межі заходу», а Мураторієв фрагмент говорить про його від'їзд з Рима до Іспанії; Євсевій передає традицію, що, виправдавшись, він знову вирушив проповідувати і, прийшовши до Рима вдруге, прийняв мученицьку смерть за Нерона; друге послання до Тимофія зображає його знову на суді, коли «у перве моє одвітуваннє нїкого не було зо мною», і «час мого відходу настав». Єронім називає чотирнадцятий рік Нерона, 67–68 рр. н. е., а його гробницю показують на Остійській дорозі."
  es:
    - "Desde la primavera del 60 d. C. hasta hacia el 62, según la cronología habitual: llegó como preso tras el naufragio del invierno, «quedó dos años enteros en su casa de alquiler», y allí termina Hechos. La tradición antigua añade que fue liberado, viajó de nuevo, fue arrestado por segunda vez y ejecutado en Roma bajo Nerón, entre el incendio del 64 y la caída del emperador en el 68. Los estudiosos que fechan antes al procurador Festo sitúan la llegada en el 56 o 57; el mapa usa el 60 d. C."
    - "Pablo quería ver Roma desde hacía tiempo: «Después que hubiere estado allá, me será menester ver también á Roma», dijo en Éfeso, y escribió a los romanos de seguir adelante hasta España. Arrestado en Jerusalén, estuvo dos años en Cesarea bajo Félix; cuando Festo lo sucedió, Pablo dijo: «A César apelo», y fue enviado por mar en otoño, después de «el ayuno» del Día de la Expiación. En Roma, «á Pablo fué permitido estar por sí, con un soldado que le guardase», y predicó «con toda libertad, sin impedimento». Las cartas a los filipenses, colosenses, Filemón y efesios son, por antigua tradición, de estos años, escritas por «Pablo viejo, y aun ahora prisionero de Jesucristo», cuyas «prisiones han sido célebres en Cristo en todo el pretorio» y envía los saludos de los santos, «mayormente los que son de casa de César»; algunos estudiosos sitúan una o más en Cesarea o Éfeso."
    - "El año depende de Festo. Unos pocos estudiosos, leyendo a Josefo sobre la destitución de Félix, lo sitúan en el 55 o 56; la mayoría pone la llegada de Festo en el 59, de modo que Pablo zarpó ese otoño, invernó en Malta y llegó a Roma en la primavera del 60. Lo que vino después de los dos años, Lucas no lo dice. Clemente de Roma, hacia el 96 d. C., escribe que Pablo enseñó la justicia a «todo el mundo» y llegó al «límite del occidente», y el fragmento muratoriano habla de su partida de Roma hacia España; Eusebio refiere la tradición de que, tras defenderse, salió a predicar de nuevo y, llegando a Roma por segunda vez, fue martirizado bajo Nerón; la segunda carta a Timoteo lo muestra otra vez en juicio, cuando «en mi primera defensa ninguno me ayudó», y «el tiempo de mi partida está cercano». Jerónimo da el año catorce de Nerón, 67–68 d. C., y su tumba se muestra en la vía Ostiense."
  pt:
    - "Da primavera de 60 d.C. até cerca de 62, pela cronologia usual: chegou como prisioneiro depois do naufrágio do inverno, “permaneceu dois anos inteiros em sua própria casa alugada”, e aí termina Atos. A tradição antiga acrescenta que foi solto, viajou de novo, foi preso uma segunda vez e morto em Roma sob Nero, entre o incêndio de 64 e a queda do imperador em 68. Os estudiosos que datam o procurador Festo mais cedo situam a chegada em 56 ou 57; o mapa usa 60 d.C."
    - "Paulo desejava havia muito ver Roma: “Depois de ter estado lá, devo ver também Roma”, disse em Éfeso, e escreveu aos romanos que iria à Espanha. Preso em Jerusalém, ficou dois anos em Cesareia sob Félix; quando Festo o sucedeu, Paulo disse: “Apelo para César!”, e foi enviado por mar no outono, depois do “Jejum” do Dia da Expiação. Em Roma “Paulo recebeu permissão para morar por conta própria, com o soldado que o guardava”, e pregou “com toda a ousadia, sem impedimento”. As cartas aos Filipenses, Colossenses, a Filemom e aos Efésios são, por antiga tradição, desses anos, escritas por “Paulo, já idoso e agora também prisioneiro”, cuja prisão por Cristo, diz ele, “se tornou evidente a toda a guarda do palácio”, e que envia as saudações dos santos, “especialmente aqueles que são da casa de César”; alguns situam uma ou mais delas em Cesareia ou Éfeso."
    - "O ano depende de Festo. Alguns estudiosos, lendo Josefo sobre a convocação de Félix, o põem em 55 ou 56; a maioria situa a chegada de Festo em 59, de modo que Paulo navegou naquele outono, invernou em Malta e chegou a Roma na primavera de 60. O que veio depois dos dois anos Lucas não diz. Clemente de Roma, por volta de 96 d.C., escreve que Paulo ensinou “o mundo inteiro” a justiça e chegou ao “limite do Ocidente”, e o fragmento muratoriano fala de sua partida de Roma para a Espanha; Eusébio relata a tradição de que, depois de se defender, ele saiu a pregar de novo e, voltando a Roma, foi martirizado sob Nero; a segunda carta a Timóteo o mostra de novo em julgamento, quando “na minha primeira defesa, ninguém veio me ajudar”, e “o tempo da minha partida chegou”. Jerônimo dá o décimo quarto ano de Nero, 67–68 d.C., e seu túmulo é mostrado na via Ostiense."
  de:
    - "Vom Frühjahr 60 n. Chr. bis etwa 62, nach der üblichen Chronologie: Er kam nach dem Schiffbruch des Winters als Gefangener an, „blieb zwei Jahre in seinem eigenen Gedinge“, und dort endet die Apostelgeschichte. Die frühe Überlieferung fügt hinzu, er sei freigelassen worden, wieder gereist, ein zweites Mal verhaftet und unter Nero in Rom hingerichtet worden, zwischen dem Brand von 64 und dem Sturz des Kaisers 68. Gelehrte, die den Statthalter Festus früher datieren, setzen die Ankunft auf 56 oder 57; die Karte verwendet 60 n. Chr."
    - "Paulus wollte Rom lange sehen: „muß ich auch nach Rom sehen“, sagte er in Ephesus, und den Römern schrieb er von der Weiterreise nach Spanien. In Jerusalem verhaftet, saß er zwei Jahre in Caesarea unter Felix; als Festus ihm folgte, sagte Paulus: „Ich berufe mich auf den Kaiser!“ und wurde im Herbst, nachdem „das Fasten“ des Versöhnungstags vorüber war, verschifft. In Rom „ward erlaubt zu bleiben, wo er wollte, mit einem Kriegsknechte“, und er predigte „mit aller Freudigkeit unverboten“. Philipper-, Kolosser-, Philemon- und Epheserbrief gelten nach alter Überlieferung als Briefe dieser Jahre, geschrieben von Paulus, „ein alter Paulus, nun aber auch ein Gebundener Jesu Christi“, dessen Bande „offenbar geworden sind in Christo in dem ganzen Richthause“ und der Grüße sendet, „sonderlich aber die von des Kaisers Hause“; manche verlegen einen oder mehrere nach Caesarea oder Ephesus."
    - "Das Jahr hängt an Festus. Wenige Gelehrte, die Josephus zur Abberufung des Felix lesen, setzen es auf 55 oder 56; die meisten datieren Festus' Ankunft auf 59, sodass Paulus in jenem Herbst segelte, auf Malta überwinterte und im Frühjahr 60 Rom erreichte. Was danach kam, sagt Lukas nicht. Clemens von Rom schreibt um 96, Paulus habe „die ganze Welt“ Gerechtigkeit gelehrt und „die Grenze des Westens“ erreicht, und das Muratorische Fragment spricht von seiner Abreise nach Spanien; Eusebius überliefert, er sei nach seiner Verteidigung wieder predigen gegangen und, ein zweites Mal in Rom, unter Nero Märtyrer geworden; 2. Timotheus zeigt ihn erneut vor Gericht: „In meiner ersten Verantwortung stand mir niemand bei“, und „die Zeit meines Abscheidens ist vorhanden“. Hieronymus nennt das vierzehnte Jahr Neros, 67–68, und sein Grab wird an der Via Ostiensis gezeigt."
  fr:
    - "Du printemps de 60 apr. J.-C. à 62 environ, selon la chronologie habituelle : il y arriva prisonnier après le naufrage de l’hiver, « demeura deux ans entiers dans une maison qu’il avait louée », et là s’achèvent les Actes. La tradition ancienne ajoute qu’il fut libéré, voyagea de nouveau, fut arrêté une seconde fois et mis à mort à Rome sous Néron, entre l’incendie de 64 et la chute de l’empereur en 68. Les savants qui datent plus tôt le procurateur Festus placent l’arrivée en 56 ou 57 ; la carte retient 60 apr. J.-C."
    - "Paul voulait depuis longtemps voir Rome : « Quand j’aurai été là, … il faut aussi que je voie Rome », dit-il à Éphèse, et il écrivit aux Romains qu’il irait en Espagne. Arrêté à Jérusalem, gardé deux ans à Césarée sous Félix, il dit à Festus, son successeur : « J’en appelle à César », et fut envoyé par mer à l’automne, après « le jeûne » des Expiations. À Rome, « on permit à Paul de demeurer en son particulier, avec un soldat qui le gardait » ; il prêcha « en toute liberté et sans obstacle ». Selon la tradition, les lettres aux Philippiens, aux Colossiens, à Philémon et aux Éphésiens sont de ces années, écrites par « Paul, vieillard, et de plus maintenant prisonnier de Jésus-Christ », dont les liens pour Christ sont connus « dans tout le prétoire » et qui transmet les saluts des saints, « principalement ceux de la maison de César » ; certains placent l’une d’elles à Césarée ou Éphèse."
    - "L’année dépend de Festus. Quelques savants, lisant Josèphe sur le rappel de Félix, la placent en 55 ou 56 ; la plupart situent l’arrivée de Festus en 59, Paul embarquant cet automne-là, il hiverna à Malte et atteignit Rome au printemps de 60. Luc ne dit rien de la suite. Clément de Rome, vers 96 apr. J.-C., écrit que Paul enseigna la justice au « monde entier » et atteignit « la limite de l’Occident », et le fragment de Muratori parle de son départ de Rome pour l’Espagne ; Eusèbe rapporte qu’après s’être défendu, il repartit prêcher et, venu à Rome une seconde fois, fut martyrisé sous Néron ; la seconde lettre à Timothée le montre de nouveau en procès, quand « dans ma première défense, personne ne m’a assisté », et « le moment de mon départ approche ». Jérôme donne la quatorzième année de Néron, 67–68 apr. J.-C., et son tombeau est montré sur la voie d’Ostie."
  pl:
    - "Od wiosny 60 n.e. do około 62, według zwykłej chronologii: przybył jako więzień po zimowym rozbiciu, „mieszkał Paweł przez całe dwa lata w najemnej gospodzie swojej”, i na tym kończą się Dzieje Apostolskie. Wczesna tradycja dodaje, że został uwolniony, znów podróżował, po raz drugi aresztowany i stracony w Rzymie za Nerona, między pożarem w 64 a upadkiem cesarza w 68. Uczeni, którzy datują prokuratora Festusa wcześniej, umieszczają przybycie w 56 lub 57; mapa używa 60 n.e."
    - "Paweł od dawna chciał zobaczyć Rzym: „gdy tam będę, muszę i Rzym widzieć”, powiedział w Efezie, a Rzymianom pisał o drodze do Hiszpanii. Aresztowany w Jerozolimie, dwa lata przebywał w Cezarei za Feliksa; gdy następcą został Festus, Paweł rzekł: „apeluję do cesarza”, i wysłano go morzem jesienią, po „poście” Dnia Pojednania. W Rzymie „Pawłowi dopuszczono, mieszkać osobno z żołnierzem, który go strzegł”, a nauczał „ze wszystkiem bezpieczeństwem bez przeszkody”. Listy do Filipian, Kolosan, Filemona i Efezjan to według tradycji listy z tych lat, pisane przez tego, który o sobie mówi: „Paweł stary, a teraz i więzień Jezusa Chrystusa”, którego „związki moje dla Chrystusa rozgłoszone są po wszystkim pałacu cesarskim” i który przekazuje pozdrowienia świętych, „osobliwie, którzy są z cesarskiego domu”; niektórzy uczeni umieszczają jeden lub więcej z nich w Cezarei lub Efezie."
    - "Rok zależy od Festusa. Nieliczni uczeni, czytając Józefa Flawiusza o odwołaniu Feliksa, umieszczają go w 55 lub 56; większość datuje przybycie Festusa na 59, tak że Paweł popłynął tej jesieni, zimował na Malcie i dotarł do Rzymu wiosną 60. Co nastąpiło po dwóch latach, Łukasz nie mówi. Klemens Rzymski, około 96 n.e., pisze, że Paweł nauczał „cały świat” sprawiedliwości i dotarł do „kresu zachodu”, a fragment muratoriański mówi o jego wyjeździe z Rzymu do Hiszpanii; Euzebiusz przekazuje tradycję, że po obronie wyszedł znów nauczać i, przybywszy do Rzymu po raz drugi, poniósł śmierć męczeńską za Nerona; drugi list do Tymoteusza pokazuje go znów w procesie, gdy „w pierwszej obronie mojej żaden przy mnie nie stał”, i „czas rozwiązania mego nadchodzi”. Hieronim podaje czternasty rok Nerona, 67–68 n.e., a jego grób pokazują przy Drodze Ostyjskiej."
  it:
    - "Dalla primavera del 60 d.C. a circa il 62, secondo la cronologia abituale: vi giunse prigioniero dopo il naufragio dell’inverno, «dimorò due anni interi in una casa da lui presa a fitto», e qui finiscono gli Atti. La prima tradizione aggiunge che fu rilasciato, viaggiò ancora, fu arrestato una seconda volta e messo a morte a Roma sotto Nerone, tra l’incendio del 64 e la caduta dell’imperatore nel 68. Gli studiosi che datano il procuratore Festo più presto pongono l’arrivo nel 56 o 57; la mappa usa il 60 d.C."
    - "Paolo voleva da tempo vedere Roma: a Efeso disse: «Dopo che sarò stato là … bisogna ch’io veda anche Roma», e scrisse ai Romani di proseguire verso la Spagna. Arrestato a Gerusalemme, rimase due anni a Cesarea sotto Felice; con Festo disse: «Io mi appello a Cesare», e fu mandato per mare in autunno, dopo «il Digiuno» del Giorno dell’Espiazione. A Roma «a Paolo fu concesso d’abitar da sé col soldato che lo custodiva», e predicava «con tutta franchezza e senza che alcuno glielo impedisse». Le lettere ai Filippesi, ai Colossesi, a Filemone e agli Efesini sono per antica tradizione di questi anni, scritte da «Paolo, vecchio, e adesso anche prigione di Cristo Gesù», le cui catene sono note «a tutta la guardia pretoriana e a tutti gli altri» e che manda i saluti dei santi, «specialmente quelli della casa di Cesare»; alcuni ne collocano una o più a Cesarea o a Efeso."
    - "L’anno dipende da Festo. Alcuni, leggendo Giuseppe Flavio sul richiamo di Felice, lo pongono nel 55 o 56; i più pongono l’arrivo di Festo nel 59, e Paolo salpò quell’autunno, svernò a Malta e giunse a Roma nella primavera del 60. Luca tace su ciò che seguì ai due anni. Clemente di Roma, verso il 96 d.C., scrive che Paolo insegnò la giustizia a «tutto il mondo» e giunse al «limite dell’occidente», e il frammento muratoriano parla della sua partenza da Roma per la Spagna; Eusebio riferisce la tradizione che, dopo essersi difeso, andò a predicare di nuovo e, giunto a Roma una seconda volta, fu martirizzato sotto Nerone; 2 Timoteo lo mostra di nuovo sotto processo, quando «nella mia prima difesa nessuno s’è trovato al mio fianco», e «il tempo della mia dipartenza è giunto». Girolamo dà il quattordicesimo anno di Nerone, 67–68 d.C.; la sua tomba è mostrata sulla via Ostiense."
  nl:
    - "Van het voorjaar van 60 n.Chr. tot ongeveer 62, volgens de gebruikelijke chronologie: hij kwam als gevangene aan na de schipbreuk van de winter en “bleef twee gehele jaren in zijn eigen gehuurde woning”, en daar eindigt Handelingen. De vroege overlevering voegt eraan toe dat hij werd vrijgelaten, opnieuw reisde, een tweede keer werd gearresteerd en in Rome onder Nero werd gedood, tussen de brand van 64 en de val van de keizer in 68. Geleerden die de procurator Festus eerder dateren, plaatsen de aankomst in 56 of 57; de kaart gebruikt 60 n.Chr."
    - "Paulus wilde Rome al lang zien: “Nadat ik aldaar zal geweest zijn, moet ik ook Rome zien”, zei hij in Efeze, en schreef de Romeinen over een verdere reis naar Spanje. Gearresteerd in Jeruzalem zat hij twee jaar onder Felix in Caesarea; onder Festus zei hij: “Ik beroep mij op den keizer”, en in het najaar werd hij, na “de vasten” van de Grote Verzoendag, over zee gezonden. Van zijn verblijf in Rome staat: “aan Paulus werd toegelaten op zichzelven te wonen met den krijgsknecht, die hem bewaarde”, en hij predikte “met alle vrijmoedigheid, onverhinderd”. Volgens oude overlevering zijn Filippenzen, Kolossenzen, Filemon en Efeziërs van deze jaren, door “Paulus, een oud man, en nu ook een gevangene”, wiens “banden in Christus openbaar geworden zijn in het ganse rechthuis” met groeten van de heiligen, “meest die van het huis des keizers zijn”; sommigen plaatsen er enkele in Caesarea of Efeze."
    - "Het jaar hangt aan Festus. Enkele geleerden plaatsen zijn komst, uitgaande van Josephus over Felix’ terugroeping, in 55 of 56; de meesten in 59, zodat Paulus dat najaar uitvoer, op Malta overwinterde en in het voorjaar van 60 Rome bereikte. Wat na de twee jaar kwam, zegt Lukas niet. Clemens van Rome schrijft omstreeks 96 n.Chr. dat Paulus “de hele wereld” gerechtigheid leerde en “de grens van het westen” bereikte, en het Muratoriaanse fragment spreekt van zijn vertrek uit Rome naar Spanje; Eusebius meldt de overlevering dat hij na zijn verdediging weer ging prediken en, voor de tweede keer in Rome, onder Nero stierf; 2 Timoteüs laat hem opnieuw terechtstaan, toen bij zijn “eerste verantwoording is niemand bij mij geweest”, en “de tijd mijner ontbinding is aanstaande”. Hiëronymus noemt Nero’s veertiende jaar, 67–68 n.Chr.; zijn graf wordt getoond aan de Via Ostiensis."
  cs:
    - "Od jara 60 n. l. do asi 62, podle obvyklé chronologie: přišel jako vězeň po zimním ztroskotání, „trval za celé dvě létě v hospodě své“ a tam Skutky končí. Raná tradice dodává, že byl propuštěn, znovu cestoval, byl podruhé zatčen a popraven v Římě za Nerona, mezi požárem roku 64 a císařovým pádem roku 68. Badatelé, kteří kladou prokurátora Festa dříve, kladou příchod do let 56 nebo 57; mapa užívá rok 60 n. l."
    - "Pavel dávno chtěl Řím vidět: „Když pobudu tam, musímť také i na Řím pohleděti“, řekl v Efezu, a Římanům psal o cestě dál do Španělska. Zatčen v Jeruzalémě byl dva roky držen v Cesareji za Felixe; když ho vystřídal Festus, Pavel řekl: „K císaři se odvolávám“, a byl poslán po moři na podzim, když „již byl i půst pominul“, totiž Den smíření. V Římě „Pavlovi dopuštěno, aby sám bydlil s žoldnéřem, kterýž ho ostříhal“ a kázal „se vší doufanlivostí bez překážky“. Listy Filipským, Koloským, Filemonovi a Efezským jsou podle staré tradice listy těchto let, psané tím, kdo je „Pavel starý, a nyní i vězeň Ježíše Krista“, jehož „vězení mé pro Krista rozhlášeno jest po všem císařském dvoře“ a který posílá pozdravy svatých, „zvláště pak ti, kteříž jsou z domu císařova“; někteří badatelé kladou jeden či více z nich raději do Cesareje nebo Efezu."
    - "Rok závisí na Festovi. Několik badatelů, kteří čtou Josepha o odvolání Felixe, jej klade do 55 nebo 56; většina klade Festův příchod do 59, takže Pavel vyplul na podzim, přezimoval na Maltě a na jaře 60 dorazil do Říma. Co následovalo po dvou letech, Lukáš neříká. Klement Římský kolem roku 96 n. l. píše, že Pavel učil „celý svět“ spravedlnosti a došel „na hranice západu“, a Muratoriho zlomek mluví o jeho odchodu z Říma do Španělska; Eusebios podává tradici, že se po obhajobě vydal znovu kázat a při druhém příchodu do Říma byl za Nerona umučen; Druhý list Timoteovi ho ukazuje znovu před soudem, kdy „při prvním mém odpovídání žádný se mnou nebyl“, a „čas rozdělení mého nastává“. Jeroným uvádí čtrnáctý rok Neronův, 67–68 n. l., a jeho hrob se ukazuje při Ostijské cestě."
  sv:
    - "Från våren 60 e.Kr. till omkring 62, enligt den vanliga kronologin: han kom som fånge efter vinterns skeppsbrott; om honom heter det: ”I två hela år bodde han sedan kvar i en bostad som han själv hade hyrt”, och där slutar Apostlagärningarna. Den tidiga traditionen tillägger att han frigavs, reste igen, greps en andra gång och avrättades i Rom under Nero, mellan branden år 64 och kejsarens fall år 68. Forskare som daterar ståthållaren Festus tidigare förlägger ankomsten till 56 eller 57; kartan använder 60 e.Kr."
    - "Paulus ville länge se Rom: ”Sedan jag har varit där, måste jag ock se Rom”, sade han i Efesos, och skrev till romarna om färden vidare till Spanien. Gripen i Jerusalem hölls han två år i Caesarea under Felix; när Festus tog över sade Paulus: ”Jag vädjar till kejsaren”, och sändes sjövägen på hösten, efter ”fastedagen”, försoningsdagen. I Rom ”tillstaddes det Paulus att bo för sig själv, med den krigsman som skulle bevaka honom”, och predikade ”med all frimodighet, utan att någon hindrade honom däri”. Filipper-, Kolosser-, Filemon- och Efesierbreven hör enligt gammal tradition till dessa år, skrivna av ”den gamle Paulus, han som därtill nu är en Kristi Jesu fånge”, vars bojor ”i Kristus” blivit kända ”för alla i pretoriet”, och som hälsar från de heliga, ”först och främst de som höra till kejsarens hus”; vissa förlägger ett eller flera till Caesarea eller Efesos."
    - "Året hänger på Festus. Några forskare, som läser Josefus om Felix återkallelse, förlägger det till 55 eller 56; de flesta placerar Festus ankomst 59, så att Paulus seglade den hösten, övervintrade på Malta och kom till Rom våren 60. Vad som kom efter de två åren säger Lukas inte. Clemens av Rom skriver omkring 96 e.Kr. att Paulus lärde ”hela världen” rättfärdighet och nådde ”västerns gräns”, och Muratoriska fragmentet talar om hans avresa från Rom till Spanien; Eusebios återger traditionen att han efter sitt försvar gav sig ut för att predika igen och, då han kom till Rom en andra gång, led martyrdöden under Nero; Andra Timoteusbrevet har honom inför rätta på nytt, då ”vid mitt första försvar inför rätta kom ingen mig till hjälp”, och ”tiden är inne, då jag skall bryta upp”. Hieronymus anger Neros fjortonde år, 67–68 e.Kr., och hans grav visas vid Ostiavägen."
  nb:
    - "Fra våren 60 e.Kr. til omkring 62, etter den vanlige kronologien: han kom som fange etter vinterens skipbrudd, «blev da to fulle år i sitt leide herberge», og der slutter Apostlenes gjerninger. Tidlig tradisjon tilføyer at han ble løslatt, reiste igjen, ble arrestert en annen gang og henrettet i Roma under Nero, mellom brannen i 64 og keiserens fall i 68. Forskere som daterer prokuratoren Festus tidligere, setter ankomsten til 56 eller 57; kartet bruker 60 e.Kr."
    - "Paulus hadde lenge ment å se Roma: «Når jeg har vært der, må jeg også se Rom», sa han i Efesos, og han skrev til romerne om å reise videre til Spania. Arrestert i Jerusalem ble han holdt i to år i Cæsarea under Feliks; da Festus etterfulgte ham, sa Paulus: «jeg innanker min sak for keiseren», og ble sendt sjøveien om høsten, etter «fasten» på Forsoningsdagen. I Roma «fikk lov til å bo for sig selv sammen med den stridsmann som holdt vakt over ham», og han forkynte «med all frimodighet, uten hindring». Brevene til filipperne, kolosserne, Filemon og efeserne er etter gammel tradisjon fra disse årene, skrevet av «den gamle Paulus, men nu også Kristi Jesu fange», hvis lenker er «blitt vitterlig for hele livvakten», og som sender hilsener fra de hellige, «især de som hører til keiserens hus»; noen forskere plasserer ett eller flere av dem i Cæsarea eller Efesos i stedet."
    - "Året henger på Festus. Noen få forskere, som leser Josefus om Feliks' tilbakekalling, setter det til 55 eller 56; de fleste setter Festus' ankomst til 59, slik at Paulus seilte den høsten, overvintret på Malta og nådde Roma våren 60. Hva som kom etter de to årene, sier ikke Lukas. Klemens av Roma skriver omkring 96 e.Kr. at Paulus lærte «hele verden» rettferdighet og nådde «Vestens grense», og Muratori-fragmentet taler om hans avreise fra Roma til Spania; Eusebius gjengir tradisjonen om at han etter å ha forsvart seg dro ut for å forkynne igjen og, da han kom til Roma en annen gang, led martyrdøden under Nero; 2 Timoteusbrev har ham for retten igjen, da «Ved mitt første forsvar møtte ingen med mig», og «tiden for min bortgang er forhånden». Hieronymus oppgir Neros fjortende år, 67–68 e.Kr., og hans grav vises ved Via Ostiensis."
  tl:
    - "Mula tagsibol ng 60 AD hanggang mga 62, ayon sa karaniwang kronolohiya: dumating siyang bilanggo pagkatapos ng pagkawasak ng barko sa taglamig, “tumahan si Pablo na dalawang taong ganap sa kaniyang tahanang inuupahan”, at doon nagwawakas ang Mga Gawa. Idinaragdag ng sinaunang tradisyon na pinalaya siya, naglakbay muli, inaresto sa ikalawang pagkakataon at pinatay sa Roma sa ilalim ni Nero, sa pagitan ng sunog noong 64 at pagbagsak ng emperador noong 68. Ang mga iskolar na nagtatakda nang mas maaga sa prokurador na si Festo ay naglalagay ng pagdating sa 56 o 57; ginagamit ng mapa ang 60 AD."
    - "Matagal nang balak ni Pablo ang Roma: “Pagkapanggaling ko roon, ay kinakailangang makita ko naman ang Roma”, sabi niya sa Efeso, at isinulat sa mga taga-Roma na tutuloy sa Espana. Inaresto sa Jerusalem, dalawang taon siyang nakapiit sa Cesarea sa ilalim ni Felix; nang humalili si Festo, aniya, “Maghahabol ako kay Cesar”, at ipinadala sa dagat nang taglagas, pagkaraan ng “Pagaayuno” (Araw ng Pagbabayad-sala). Sa Roma, “si Pablo ay pinahintulutang mamahay na magisa …”, may kawal na bantay, at nangaral “ng buong katapangan, wala sinomang nagbabawal sa kaniya”. Sa sinaunang tradisyon, mula rito ang mga liham sa Filipos, Colosas, kay Filemon at sa Efeso, ni Pablo, “matanda na, at ngayon nama'y bilanggo…”, na ang “mga tanikala kay Cristo ay nahayag …” at bati ng mga banal, “lalong lalo na ng mga kasangbahay ni Cesar”; inilalagay ng ilang iskolar ang ilan sa Cesarea o Efeso."
    - "Nakasalalay kay Festo ang taon. Sa ilang iskolar, batay kay Josephus sa pagpapabalik kay Felix, 55 o 56; sa karamihan, 59 ang pagdating ni Festo: naglayag si Pablo nang taglagas, nagtaglamig sa Malta, dumating sa Roma sa tagsibol ng 60. Di sinabi ni Lucas ang sumunod sa dalawang taon. Ayon kay Clemente ng Roma (mga 96 AD), tinuruan ni Pablo ng katuwiran ang “buong sanlibutan” at narating ang “hangganan ng kanluran”; sa Pragmentong Muratoriano, umalis siya sa Roma patungong Espana; sa tradisyon ni Eusebio, nangaral muli pagkatapos ipagtanggol ang sarili at namartir sa ilalim ni Nero sa ikalawang pagdating sa Roma; sa 2 Timoteo, nilitis muli, nang sa “unang pagsasanggalang sinoman ay walang kumampi sa akin”, at “ang panahon ng aking pagpanaw ay dumating na”. Ika-14 na taon ni Nero (67–68 AD) ang kay Jeronimo, at ipinakikita ang libingan niya sa Daang Ostia."
  da:
    - "Fra foråret 60 e.Kr. til omkring 62 efter den sædvanlige kronologi: han ankom som fange efter vinterens skibbrud, »blev hele to Aar i sit lejede Herberge«, og dér slutter Apostlenes Gerninger. Den tidlige tradition tilføjer, at han blev løsladt, rejste igen, blev arresteret anden gang og henrettet i Rom under Nero, mellem branden i 64 og kejserens fald i 68. Forskere, der dater prokuratoren Festus tidligere, placerer ankomsten i 56 eller 57; kortet bruger 60 e.Kr."
    - "Paulus havde længe villet se Rom: »Efter at jeg har været der, bør jeg ogsaa se Rom«, sagde han i Efesos, og skrev til romerne om at rejse videre til Spanien. Arresteret i Jerusalem sad han to år i Cæsarea under Felix; da Festus afløste ham, sagde Paulus: »Jeg skyder mig ind under Kejseren«, og blev sendt til søs om efteråret, efter »Fasten«, Forsoningsdagens faste. I Rom »blev det tilstedt Paulus at bo for sig selv sammen med den Stridsmand, der bevogtede ham«, og han prædikede »med al Frimodighed, uhindret«. Brevene til filipperne, kolossenserne, Filemon og efeserne er efter gammel tradition fra disse år, skrevet af »den gamle Paulus, og nu tilmed Kristi Jesu Fange«, hvis lænker »bæres for Kristi Skyld«, så det er kendt »for hele Livvagten«, og som sender hilsner fra de hellige, »mest de af Kejserens Hus«; nogle forskere placerer et eller flere af dem i stedet i Cæsarea eller Efesos."
    - "Året afhænger af Festus. Nogle få forskere, der læser Josefus om Felix' tilbagekaldelse, placerer det i 55 eller 56; de fleste placerer Festus' ankomst i 59, så Paulus sejlede det efterår, overvintrede på Malta og nåede Rom i foråret 60. Hvad der kom efter de to år, siger Lukas ikke. Klemens af Rom skriver omkring 96 e.Kr., at Paulus lærte »hele verden« retfærdighed og nåede »Vestens yderste grænse«, og det muratoriske fragment taler om hans afrejse fra Rom til Spanien; Eusebios refererer traditionen om, at han efter at have forsvaret sig drog ud for at prædike igen og, da han kom til Rom anden gang, blev martyr under Nero; Andet Timotheusbrev har ham for retten igen, da »Ved mit første Forsvar kom ingen mig til Hjælp«, og »Tiden til mit Opbrud er for Haanden«. Hieronymus angiver Neros fjortende år, 67–68 e.Kr., og hans grav vises på Via Ostiensis."
  sr:
    - "Од пролећа 60. н. е. до око 62, по уобичајеној хронологији: стигао је као затвореник после зимског бродолома, па: „А Павле остаде пуне две године о свом трошку“, и ту се Дела завршавају. Рано предање додаје да је пуштен, поново путовао, други пут ухапшен и погубљен у Риму под Нероном, између пожара 64. и царевог пада 68. Научници који раније датирају прокуратора Фиста стављају долазак у 56. или 57; карта користи 60. н. е."
    - "Павле је дуго намеравао да види Рим: у Ефесу је рекао: „Пошто будем тамо, ваља ми и Рим видети“, а Римљанима је писао о одласку даље у Шпанију. Ухапшен у Јерусалиму, две године је држан у Цезареји под Филиксом; кад је Фист наследио Филикса, Павле је рекао: „Ћесару идем“, и послан је морем у јесен, кад „и пост већ беше прошао“, то јест пост Дана помирења. У Риму „Али се Павлу допусти да живи где хоће с војником који га чуваше“, и проповедао је „слободно, и нико му не брањаше“. Посланице Филипљанима, Колошанима, Филимону и Ефесцима по старом предању су посланице ових година, писане од Павла који за себе каже: „као старац Павле, а сад сужањ Исуса Христа“, који пише да се „разгласи у свој судници и код свих осталих да су моји окови за Христа“ и шаље поздраве светих, „особито који су из дома Ћесаревог“; неки научници једну или више њих радије смештају у Цезареју или Ефес."
    - "Година зависи од Фиста. Неколицина научника, читајући Јосифа Флавија о опозиву Филикса, ставља је у 55. или 56; већина ставља Фистов долазак у 59, па је Павле запловио те јесени, презимио на Мелити и стигао у Рим у пролеће 60. Шта је дошло после две године, Лука не каже. Климент Римски, око 96. н. е., пише да је Павле учио „цео свет“ правди и стигао до „граница запада“, а Мураторијев фрагмент говори о његовом одласку из Рима у Шпанију; Јевсевије преноси предање да је после одбране изашао да поново проповеда и, дошавши други пут у Рим, мученички страдао под Нероном; Друга посланица Тимотију приказује га поново на суђењу, где стоји: „У први мој одговор нико не оста са мном“ и „време мог одласка наста“. Јероним даје четрнаесту годину Неронову, 67–68. н. е., а његова гробница показује се на Остијском путу."
  hu:
    - "A szokásos kronológia szerint Kr. u. 60 tavaszától mintegy 62-ig: a téli hajótörés után fogolyként érkezett, „két egész esztendeig az ő tulajdon bérelt szállásán” maradt, és itt végződik az Apostolok cselekedetei. A korai hagyomány hozzáteszi, hogy szabadon bocsátották, újra utazott, másodszor is letartóztatták, és Rómában Néró alatt kivégezték, a 64-es tűzvész és a császár 68-as bukása között. Azok a kutatók, akik Fesztusz helytartót korábbra keltezik, az érkezést 56-ra vagy 57-re teszik; a térkép Kr. u. 60-at használ."
    - "Pál régóta Rómát akarta látni: „Ott létem után Rómát is meg kell nékem látnom”, mondta Efezusban, és a rómaiaknak Hispániába tervezett útjáról írt. Jeruzsálemben letartóztatták, két évig Félix fogta Cézáreában; amikor Fesztusz követte, így szólt: „A császárra appellálok!”, és ősszel tengeren küldték, miután az Engesztelés napjának „bőjtje” elmúlt. Rómában „Pálnak azonban megengedteték, hogy külön lakjék az őt őriző vitézzel”, és „teljes bátorsággal, minden tiltás nélkül” prédikált. A Filippi-, Kolossé-, Efézus- és Filemon-levelet régi hagyomány e évekhez köti: írójuk „Pál, a megvénhedett, most pedig foglya is a Jézus Krisztusnak”, akinek „a Krisztusban híressé lett az én fogságom a testőrség egész házában”, és aki a szentek üdvözletét küldi, „mindeneknek felette pedig a császár udvarából valók”; egyes kutatók egyet vagy többet inkább Cézáreába vagy Efezusba tesznek."
    - "Az év Fesztuszon múlik. Néhány kutató, Josephust olvasva Félix visszahívásáról, 55-re vagy 56-ra teszi; a legtöbb Fesztusz érkezését 59-re, így Pál azon ősszel hajózott, Máltán telelt, és 60 tavaszán ért Rómába. Hogy a két év után mi következett, Lukács nem mondja. Római Kelemen mintegy Kr. u. 96-ban azt írja, hogy Pál az egész világot tanította igazságra, és „a nyugat határáig” jutott, a Muratori-töredék pedig Pál Rómából Hispániába távozásáról szól; Eusebius közli a hagyományt, hogy védekezése után újra prédikálni indult, és másodszor Rómába jutva Néró alatt vértanúhalált halt; a Timóteushoz írt második levél szerint újra perben áll, amikor „Első védekezésem alkalmával senki sem volt mellettem”, és „az én elköltözésem ideje beállott”. Hieronymus Néró tizennegyedik évét, Kr. u. 67–68-at adja, sírját pedig az Ostiai úton mutatják."
  fi:
    - "Keväästä 60 jaa. noin vuoteen 62 tavanomaisen kronologian mukaan: hän saapui vankina talvisen haaksirikon jälkeen ja ”asui omassa vuokra-asunnossaan kaksi täyttä vuotta”, ja siihen Apostolien teot päättyvät. Varhainen perimätieto lisää, että hänet vapautettiin, hän matkusti jälleen, pidätettiin toisen kerran ja surmattiin Roomassa Neron aikana, vuoden 64 palon ja keisarin kukistumisen vuonna 68 välillä. Tutkijat, jotka ajoittavat käskynhaltija Festuksen aiemmaksi, sijoittavat saapumisen vuoteen 56 tai 57; kartta käyttää vuotta 60 jaa."
    - "Paavali aikoi kauan nähdä Rooman: ”Käytyäni siellä minun pitää nähdä myös Rooma”, hän sanoi Efesoksessa, ja kirjoitti roomalaisille Espanjaan jatkamisesta. Jerusalemissa pidätettynä hän oli kaksi vuotta Kesareassa Felixin alaisena; Festuksen tultua tilalle hän sanoi: ”Minä vetoan keisariin”, ja hänet lähetettiin meritse syksyllä, sovituspäivän ”paastonaikakin” jälkeen. Roomassa ”sallittiin Paavalin asua erikseen häntä vartioivan sotamiehen kanssa”, ja hän julisti ”kaikella rohkeudella, kenenkään estämättä”. Filippiläis-, Kolossalais-, Efesolais- ja Filemonin kirje ovat perimätiedon mukaan näiden vuosien kirjeitä: ”vanha Paavali, ja nyt myös Kristuksen Jeesuksen vanki”, jonka kahleet ovat tulleet ”koko henkivartioston … tietoon”, lähettää pyhien terveiset, ”varsinkin ne, jotka ovat keisarin huoneväkeä”; jotkut sijoittavat yhden tai useamman niistä Kesareaan tai Efesokseen."
    - "Vuosi riippuu Festuksesta. Muutamat sijoittavat sen Josephuksen Felixin kutsumista koskevan kohdan perusteella vuoteen 55 tai 56; useimmat Festuksen saapumisen vuoteen 59, jolloin Paavali purjehti sinä syksynä, talvehti Maltalla ja tuli Roomaan keväällä 60. Mitä sitten tapahtui, Luukas ei kerro. Klemens Roomalainen kirjoittaa noin vuonna 96 Paavalin opettaneen ”koko maailmalle” vanhurskautta ja saavuttaneen ”lännen rajan”, ja Muratorin katkelma mainitsee hänen lähtönsä Roomasta Espanjaan; Eusebios kertoo perimätiedon, että puolustauduttuaan hän lähti saarnaamaan uudelleen ja kuoli marttyyrina toisella Rooman-matkallaan Neron aikana; toisessa Timoteuskirjeessä hän on taas oikeudessa: ”Ensi kertaa puolustautuessani ei kukaan tullut avukseni” ja ”minun lähtöni aika on jo tullut”. Hieronymus antaa Neron 14. vuoden, 67–68 jaa., ja hänen hautansa näytetään Ostian tiellä."
  vi:
    - "Từ mùa xuân năm 60 đến khoảng năm 62, theo niên đại thông thường: ông đến với tư cách tù nhân sau vụ đắm tàu mùa đông, “ở trọn hai năm tại một nhà trọ đã thuê”, và sách Công vụ kết thúc ở đó. Truyền thống sơ khai thêm rằng ông được thả, lại đi các nơi, bị bắt lần thứ hai và bị xử tử tại Rô-ma dưới thời Nero, giữa trận hỏa hoạn năm 64 và sự sụp đổ của hoàng đế năm 68. Các học giả định niên đại tổng đốc Phê-tu sớm hơn đặt ngày đến vào năm 56 hoặc 57; bản đồ dùng năm 60."
    - "Phao-lô từ lâu định thăm Rô-ma: “Khi ta đã thăm thành đó rồi, cũng phải thăm thành Rô-ma nữa”, ông nói ở Ê-phê-sô; thư Rô-ma nói việc đi tiếp đến Y-pha-nho. Bị bắt ở Giê-ru-sa-lem, ông bị giam hai năm tại Sê-sa-rê dưới Phê-lít; khi Phê-tu kế nhiệm, Phao-lô nói: “Tôi kêu nài sự đó đến Sê-sa”, và bị chở đi đường biển vào mùa thu, sau “kỳ Kiêng ăn” (Ngày Chuộc Tội). Ở Rô-ma, “Phao-lô được phép ở riêng với một người lính canh giữ”, và rao giảng “cách tự do trọn vẹn, chẳng ai ngăn cấm người hết”. Các thư Phi-líp, Cô-lô-se, Phi-lê-môn và Ê-phê-sô theo truyền thống cổ là của những năm này, trong đó ông tự xưng “Tôi, Phao-lô, đã già rồi, hiện nay lại vì Đức Chúa Jêsus Christ chịu tù nữa”, nói rằng “chốn công đường và các nơi khác đều rõ tôi vì Đấng Christ mà chịu xiềng xích”, và gởi lời chào của các thánh đồ, “nhất là về người nhà Sê-sa”; vài học giả đặt một số thư ở Sê-sa-rê hoặc Ê-phê-sô."
    - "Năm này tùy thuộc vào Phê-tu. Một vài học giả, đọc Giô-sê-phu về việc triệu hồi Phê-lít, đặt vào năm 55 hoặc 56; đa số đặt việc Phê-tu đến vào năm 59, nên Phao-lô dong buồm mùa thu năm ấy, trú đông trên Man-tơ và đến Rô-ma vào mùa xuân năm 60. Điều xảy ra sau hai năm, Lu-ca không nói. Cơ-lê-măn ở Rô-ma, khoảng năm 96, viết rằng Phao-lô dạy sự công bình cho “cả thế gian” và đến “tận cùng phương tây”, và Đoạn văn Muratori nói về việc ông rời Rô-ma đi Y-pha-nho; Eusebius thuật truyền thống rằng sau khi tự biện hộ ông lại ra đi rao giảng và, đến Rô-ma lần thứ hai, bị tử đạo dưới thời Nero; thư thứ hai gởi Ti-mô-thê cho thấy ông bị xét xử lần nữa: “Khi ta binh vực mình lần thứ nhất, chẳng có ai giúp đỡ”, và “kỳ qua đời của ta gần rồi”. Jerome cho là năm thứ mười bốn đời Nero, năm 67–68, và mộ ông được chỉ ra trên Đường Ostia."
  ro:
    - "Din primăvara anului 60 d.Hr. până pe la 62, după cronologia obișnuită: a sosit ca prizonier după naufragiul din timpul iernii, „a petrecut Pavel doi ani deplin cu a sa cheltuială”, și aici se încheie Faptele Apostolilor. Tradiția veche adaugă că a fost eliberat, a călătorit din nou, a fost arestat a doua oară și omorât la Roma sub Nero, între incendiul din 64 și căderea împăratului în 68. Cercetătorii care îl datează mai devreme pe procuratorul Festus pun sosirea în 56 sau 57; harta folosește 60 d.Hr."
    - "Pavel voia de mult să vadă Roma: „după ce voiu fi acolo, trebue și Roma să o văz”, a spus el la Efes, iar romanilor le-a scris că va merge mai departe în Spania. Arestat la Ierusalim, a fost ținut doi ani la Cezareea sub Felix; când Festus i-a urmat, Pavel a spus: „Pre Chesarul chem”, și a fost trimis pe mare toamna, după „postul” Zilei Ispășirii. La Roma, „lui Pavel i s’a dat voie să petreacă deosebi cu ostașul cel ce îl păzeà pre el”, și a propovăduit „cu toată îndrăzneala, fără opreală”. Epistolele către Filipeni, Coloseni, Filimon și Efeseni sunt, după tradiție, ale acestor ani, scrise de „Pavel bătrânul, iar acum și legatul lui Iisus Hristos”, ale cărui legături, spune el, „s’au făcut arătate întru Hristos în tot divanul”; el trimite salutul sfinților, „mai ales cei din casa Chesarului”. Unii cercetători pun una sau mai multe dintre ele la Cezareea sau la Efes."
    - "Anul atârnă de Festus. Câțiva cercetători, citindu-l pe Iosif Flaviu despre rechemarea lui Felix, îl pun în 55 sau 56; cei mai mulți pun sosirea lui Festus în 59, așa că Pavel a pornit pe mare în acea toamnă, a iernat în Malta și a ajuns la Roma în primăvara lui 60. Ce a urmat după cei doi ani, Luca nu spune. Clement Romanul, pe la 96 d.Hr., scrie că Pavel a învățat dreptatea „lumea întreagă” și a ajuns la „hotarul apusului”, iar Fragmentul muratorian vorbește despre plecarea lui din Roma în Spania; Eusebiu relatează tradiția că, după ce s-a apărat, a propovăduit din nou și, venind a doua oară la Roma, a fost martirizat sub Nero; 2 Timotei îl arată din nou la judecată, când „La răspunsul meu cel dintâiu nimeni n’a mers cu mine”, iar „vremea despărțirei mele s’a apropiat”. Ieronim dă anul al 14-lea al lui Nero, 67–68 d.Hr.; mormântul se arată pe Calea Ostiei."
  bg:
    - "От пролетта на 60 г. н.е. до около 62 г. според обичайната хронология: той пристигнал като затворник след зимното корабокрушение, „остана цели две години в особна под наем къща“ и тук Деяния завършват. Ранното предание добавя, че бил освободен, пътувал отново, бил арестуван втори път и умъртвен в Рим при Нерон, между пожара от 64 г. и падането на императора през 68 г. Учените, които датират прокуратора Фест по-рано, поставят пристигането през 56 или 57 г.; картата използва 60 г. н.е."
    - "Павел отдавна възнамерявал да види Рим: „Като ида там, требва да видя и Рим“, казал той в Ефес, и писал на римляните, че ще продължи до Испания. Арестуван в Йерусалим, той бил държан две години в Кесария при Феликс; когато Фест го наследил, Павел казал: „Отнасям се до Кесаря“, и бил изпратен по море през есента, след като „постът“ на Деня на умилостивението „беше се вече минал“. В Рим „на Павла се дозволи да живее особно с война който го вардеше“ и той проповядвал „невъзбранно с всеко дързновение“. Посланията към филипяните, колосяните, Филимон и ефесяните по стара традиция са писма от тези години, писани от „Павел старец, а сега и узник Исус Христов“, чиито окови „станаха известни на всичката претория“ и който праща поздрави от светиите, „най-паче които са от Кесаревия дом“; някои учени поставят едно или повече от тях в Кесария или Ефес."
    - "Годината зависи от Фест. Малцина учени, тълкувайки Йосиф Флавий за отзоваването на Феликс, я поставят през 55 или 56 г.; повечето датират пристигането на Фест през 59 г., така че Павел отплавал онази есен, зимувал на Малта и стигнал Рим през пролетта на 60 г. Какво станало след двете години, Лука не казва. Климент Римски около 96 г. н.е. пише, че Павел учил на правда „целия свят“ и стигнал „до края на запада“, а Мураториевият фрагмент говори за заминаването му от Рим за Испания; Евсевий предава преданието, че след защитата си той отново тръгнал да проповядва и, дошъл втори път в Рим, пострадал мъченически при Нерон; Второто послание към Тимотей го показва отново на съд: „В първия ми ответ никой не предстана с мене“, и „времето на отхождането ми настана“. Йероним дава четиринадесетата година на Нерон, 67–68 г., а гробът му се показва на Остийския път."
