id: who-were-the-samaritans
question:
  en: "Who were the Samaritans, and where is Mount Gerizim?"
  ru: "Кто такие самаряне и где находится гора Гаризим?"
  uk: "Хто були самаряни і де гора Гарізім?"
  es: "¿Quiénes eran los samaritanos y dónde está el monte Gerizim?"
  pt: "Quem eram os samaritanos, e onde fica o monte Gerizim?"
  de: "Wer waren die Samaritaner, und wo liegt der Garizim?"
  fr: "Qui étaient les Samaritains, et où se trouve le mont Garizim ?"
  pl: "Kim byli Samarytanie i gdzie jest Góra Garizim?"
  it: "Chi erano i Samaritani, e dov’è il Monte Garizim?"
  cs: "Kdo byli Samaritáni a kde je hora Gerizim?"
  nl: "Wie waren de Samaritanen, en waar ligt de berg Gerizim?"
answer:
  en:
    - "The Samaritans were the people of the hill country between Judea and Galilee who kept the law of Moses but worshipped not in Jerusalem but on Mount Gerizim, the mountain 881 m above sea level that rises over Shechem, today's Nablus in the West Bank; the map point stands on its summit, about 47 km north of Jerusalem in a straight line. Moses had ordered the blessing to be read from Gerizim and the curse from the facing Mount Ebal."
    - "Their origin was told two ways. Kings says that after Samaria fell in 722 BC the king of Assyria “brought men from Babylon, and from Cuthah, and from Ava, and from Hamath, and from Sepharvaim, and placed them in the cities of Samaria”, and that they mixed the worship of the Lord with their own gods; the Jews called them Cutheans. The Samaritans themselves claim descent from the tribes of Ephraim and Manasseh, keep the Pentateuch alone as scripture, and hold that it was Judah that strayed by moving the sanctuary from Shechem. When the returned exiles were building the Temple, the people of the land offered to help, “for we seek your God, as ye do”, and were refused; from then on the quarrel was about the one true place of worship. The woman at the well put it to Jesus: “Our fathers worshipped in this mountain; and ye say, that in Jerusalem is the place where men ought to worship.”"
    - "Excavations on Gerizim from 1983 to 2006 uncovered a walled sacred precinct of the Persian period, about the fifth century BC, enlarged into a great temple city in the second; Josephus tells its building under Alexander and its destruction by the Hasmonean John Hyrcanus, which the coins and pottery date to about 110 BC. The Samaritans never rebuilt it, but still sacrifice the Passover lambs on the mountain each spring. About 900 remain, roughly half in Kiryat Luza on Gerizim and half in Holon near Tel Aviv."
  ru:
    - "Самаряне — жители горной страны между Иудеей и Галилеей, которые держались закона Моисеева, но поклонялись не в Иерусалиме, а на горе Гаризим высотой 881 м над уровнем моря, поднимающейся над Сихемом, нынешним Наблусом на Западном берегу; точка карты стоит на её вершине, примерно в 47 км к северу от Иерусалима по прямой. Моисей велел читать благословение с Гаризима, а проклятие — с горы Гевал напротив."
    - "Их происхождение рассказывали двояко. Книга Царств говорит, что после падения Самарии в 722 г. до н. э. царь Ассирийский «перевел… людей из Вавилона, и из Куты, и из Аввы, и из Емафа, и из Сепарваима, и поселил их в городах Самарийских» и что те смешали почитание Господа со своими богами; отсюда иудеи звали их кутийцами. Сами самаряне ведут род от колен Ефрема и Манассии, признают Писанием одно Пятикнижие и считают, что это Иуда уклонился, перенеся святилище из Сихема. Когда вернувшиеся переселенцы строили Храм, народ земли предложил помощь — «мы, как и вы, прибегаем к Богу вашему» — и получил отказ; с тех пор спор шёл об одном истинном месте поклонения. Женщина у колодца сказала Иисусу: «Отцы наши поклонялись на этой горе, а вы говорите, что место, где должно поклоняться, находится в Иерусалиме»."
    - "Раскопки на Гаризиме в 1983–2006 годах открыли обнесённый стеной священный участок персидского времени, около V века до н. э., расширенный во II веке в большой храмовый город; Иосиф Флавий рассказывает о его постройке при Александре и о разрушении хасмонеем Иоанном Гирканом, которое монеты и керамика относят примерно к 110 г. до н. э. Самаряне его не восстановили, но до сих пор каждую весну приносят на горе пасхальных агнцев. Их осталось около 900 человек — примерно поровну в Кирьят-Лузе на Гаризиме и в Холоне под Тель-Авивом."
  uk:
    - "Самаряни були народом гірського краю між Юдеєю та Галілеєю, які дотримувалися закону Мойсея, але вклонялися не в Єрусалимі, а на горі Гарізім, горі заввишки 881 м над рівнем моря, що здіймається над Сихемом, нинішнім Наблусом на Західному березі Йордану; точка на мапі стоїть на її вершині, приблизно за 47 км на північ від Єрусалима по прямій. Мойсей наказав читати благословення з Гарізіма, а прокляття — з протилежної гори Гевал."
    - "Їхнє походження розповідали двома способами. Книга Царів каже, що після падіння Самарії 722 р. до н. е. цар Ассирії «попереводив царь Ассирийський людей з Вавилону, з Кути, з Ави, з Емату й Сефарваїму та й оселив намість синів Ізрайлевих по городах Самарийських», і що вони змішали поклоніння Господеві з власними богами; юдеї називали їх кутеями. Самі самаряни стверджують, що походять від колін Ефраїма й Манасії, тримають лише П'ятикнижжя як Писання й вважають, що збилася з дороги Юда, перенісши святилище з Сихема. Коли повернені вигнанці будували Храм, жителі краю запропонували допомогти, «бо, як ви, так і ми звертаємось до Бога вашого», і їм відмовили; відтоді суперечка точилася про єдине істинне місце поклоніння. Жінка біля колодязя сказала про це Ісусові: «Батьки наші на сїй горі покланялись; а ви кажете, що в Єрусалимі місце, де треба покланяти ся.»"
    - "Розкопки на Гарізімі з 1983 до 2006 р. виявили обмурований священний округ перської доби, близько V ст. до н. е., розширений у II ст. до великого храмового міста; Йосиф Флавій розповідає про його будівництво за Александра та його руйнування хасмонеєм Іваном Гірканом, яке монети й кераміка датують близько 110 р. до н. е. Самаряни ніколи не відбудували його, але досі щовесни приносять пасхальних ягнят у жертву на горі. Їх залишилося близько 900, приблизно половина в Кір'ят-Лозі на Гарізімі й половина в Холоні поблизу Тель-Авіва."
  es:
    - "Los samaritanos eran el pueblo de la región montañosa entre Judea y Galilea que guardaba la ley de Moisés pero adoraba no en Jerusalén, sino en el monte Gerizim, la montaña de 881 m sobre el nivel del mar que se alza sobre Siquem, la actual Nablus, en Cisjordania; el punto del mapa está en su cima, a unos 47 km al norte de Jerusalén en línea recta. Moisés había ordenado que la bendición se leyera desde el Gerizim y la maldición desde el monte Ebal, frente a él."
    - "Su origen se contaba de dos maneras. Reyes dice que, tras la caída de Samaria en 722 a. C., el rey de Asiria «trajo… gente de Babilonia, y de Cutha, y de Ava, y de Hamath, y de Sepharvaim, y púsolos en las ciudades de Samaria», y que mezclaron el culto al Señor con el de sus dioses; los judíos los llamaban cuteos. Los samaritanos afirman descender de Efraín y Manasés, guardan solo el Pentateuco como Escritura y sostienen que Judá se extravió al trasladar el santuario de Siquem. Cuando los desterrados vueltos construían el Templo, la gente de la tierra se ofreció a ayudar, «porque como vosotros buscaremos á vuestro Dios», y fue rechazada; desde entonces la disputa fue sobre el único lugar verdadero de culto. La mujer del pozo se lo planteó a Jesús: «Nuestros padres adoraron en este monte, y vosotros decís que en Jerusalem es el lugar donde es necesario adorar»."
    - "Las excavaciones en el Gerizim de 1983 a 2006 sacaron a la luz un recinto sagrado amurallado de época persa, hacia el siglo V a. C., ampliado en el II hasta formar una gran ciudad-templo; Josefo cuenta su construcción bajo Alejandro y su destrucción por el asmoneo Juan Hircano, que las monedas y la cerámica fechan hacia 110 a. C. Los samaritanos nunca lo reconstruyeron, pero aún sacrifican los corderos de la Pascua en la montaña cada primavera. Quedan unos 900, aproximadamente la mitad en Kiryat Luza, en el Gerizim, y la otra mitad en Holón, cerca de Tel Aviv."
  pt:
    - "Os samaritanos eram o povo da região montanhosa entre a Judeia e a Galileia que guardava a lei de Moisés, mas adorava não em Jerusalém e sim no monte Gerizim, a montanha de 881 m acima do nível do mar que se ergue sobre Siquém, a atual Nablus, na Cisjordânia; o ponto do mapa fica em seu cume, a cerca de 47 km ao norte de Jerusalém em linha reta. Moisés ordenara que a bênção fosse lida do Gerizim e a maldição do monte Ebal, defronte."
    - "Sua origem era contada de duas maneiras. Reis diz que, depois da queda de Samaria em 722 a.C., o rei da Assíria “trouxe pessoas da Babilônia, de Cuta, de Ava, de Hamate e de Sefarvaim, e as colocou nas cidades de Samaria”, e que elas misturaram o culto ao SENHOR com seus próprios deuses; os judeus os chamavam cuteus. Os próprios samaritanos afirmam descender das tribos de Efraim e Manassés, guardam somente o Pentateuco como Escritura e sustentam que foi Judá quem se desviou ao mudar o santuário de Siquém. Quando os exilados que voltaram construíam o Templo, o povo da terra ofereceu ajuda, “pois nós buscamos o seu Deus assim como vocês”, e foi recusado; desde então a disputa foi sobre o único lugar verdadeiro de culto. A mulher junto ao poço o disse a Jesus: “Nossos pais adoraram neste monte, e vocês, judeus, dizem que em Jerusalém é o lugar onde se deve adorar.”"
    - "As escavações no Gerizim, de 1983 a 2006, trouxeram à luz um recinto sagrado murado do período persa, cerca do século V a.C., ampliado numa grande cidade-templo no século II; Josefo conta sua construção sob Alexandre e sua destruição pelo asmoneu João Hircano, que as moedas e a cerâmica datam de cerca de 110 a.C. Os samaritanos nunca a reconstruíram, mas ainda sacrificam os cordeiros da Páscoa no monte a cada primavera. Restam cerca de 900, aproximadamente metade em Kiryat Luza, no Gerizim, e metade em Holon, perto de Tel Aviv."
  de:
    - "Die Samaritaner waren das Volk des Berglands zwischen Judäa und Galiläa, das das Gesetz des Mose hielt, aber nicht in Jerusalem, sondern auf dem Garizim anbetete, dem 881 m hohen Berg über Sichem, dem heutigen Nablus im Westjordanland; der Kartenpunkt steht auf seinem Gipfel, in der Luftlinie etwa 47 km nördlich von Jerusalem. Mose hatte befohlen, den Segen vom Garizim und den Fluch vom gegenüberliegenden Ebal zu sprechen."
    - "Ihr Ursprung wird auf zwei Weisen erzählt. Nach dem Königsbuch ließ der König von Assyrien nach dem Fall Samarias 722 v. Chr. „Leute von Babel, von Kutha, von Avva, von Hamath und Sepharvaim“ kommen und sie „in die Städte in Samaria“ setzen, und sie vermischten den Dienst des HERRN mit ihren Göttern; die Juden nannten sie Kuthäer. Die Samaritaner selbst führen sich auf die Stämme Ephraim und Manasse zurück, halten nur den Pentateuch für Schrift und meinen, Juda sei abgeirrt, als es das Heiligtum aus Sichem verlegte. Als die Heimkehrer den Tempel bauten, boten die Leute des Landes Hilfe an, „denn wir suchen euren Gott gleichwie ihr“, und wurden abgewiesen; seither ging der Streit um den einen wahren Ort der Anbetung. Die Frau am Brunnen sagte Jesus: „Unsere Väter haben auf diesem Berge angebetet, und ihr sagt, zu Jerusalem sei die Stätte, da man anbeten solle.“"
    - "Grabungen auf dem Garizim von 1983 bis 2006 legten einen ummauerten heiligen Bezirk der Perserzeit frei, etwa aus dem 5. Jahrhundert v. Chr., im 2. zu einer großen Tempelstadt erweitert; Josephus erzählt ihren Bau unter Alexander und ihre Zerstörung durch den Hasmonäer Johannes Hyrkanos, die Münzen und Keramik auf etwa 110 v. Chr. datieren. Die Samaritaner haben ihn nie wieder aufgebaut, opfern aber noch jedes Frühjahr die Passalämmer auf dem Berg. Etwa 900 bleiben, ungefähr die Hälfte in Kiryat Luza auf dem Garizim und die Hälfte in Holon bei Tel Aviv."
  fr:
    - "Les Samaritains étaient le peuple de la région montagneuse entre la Judée et la Galilée qui observait la loi de Moïse, mais adorait sur le mont Garizim plutôt qu’à Jérusalem, la montagne de 881 m d’altitude qui domine Sichem, l’actuelle Naplouse, en Cisjordanie ; le point de la carte se trouve à son sommet, à environ 47 km au nord de Jérusalem à vol d’oiseau. Moïse avait ordonné que la bénédiction soit prononcée depuis le Garizim et la malédiction depuis le mont Ébal qui lui fait face."
    - "Leur origine est racontée de deux façons. Le livre des Rois dit qu’après la chute de Samarie en 722 av. J.-C., le roi d’Assyrie « fit venir des gens de Babylone, de Cutha, d’Avva, de Hamath et de Sepharvaïm, et les établit dans les villes de Samarie », et qu’ils mêlèrent le culte de l’Éternel à celui de leurs dieux ; les Juifs les appelaient Cuthéens. Les Samaritains se disent descendants d’Éphraïm et de Manassé, ne tiennent que le Pentateuque pour Écriture, et tiennent Juda pour égaré d’avoir déplacé le sanctuaire de Sichem. Quand les exilés revenus bâtissaient le Temple, les gens du pays offrirent leur aide, « car, comme vous, nous invoquons votre Dieu », et furent refusés ; la querelle portait dès lors sur le seul vrai lieu de culte. La femme au puits dit à Jésus : « Nos pères ont adoré sur cette montagne ; et vous dites, vous, que le lieu où il faut adorer est à Jérusalem. »"
    - "Les fouilles menées sur le Garizim de 1983 à 2006 ont mis au jour une enceinte sacrée fortifiée de l’époque perse, vers le Ve siècle av. J.-C., agrandie en grande ville-temple au IIe ; Flavius Josèphe raconte sa construction sous Alexandre et sa destruction par le Hasmonéen Jean Hyrcan, que les monnaies et la poterie datent d’environ 110 av. J.-C. Les Samaritains ne l’ont jamais rebâti, mais sacrifient encore chaque printemps les agneaux de la Pâque sur la montagne. Il en reste environ 900, à peu près la moitié à Kiryat Luza sur le Garizim et l’autre moitié à Holon, près de Tel Aviv."
  pl:
    - "Samarytanie byli ludem krainy górskiej między Judeą a Galileą, który przestrzegał prawa Mojżesza, lecz czcił Boga nie w Jerozolimie, ale na Górze Garizim, górze wznoszącej się 881 m n.p.m. nad Sychem, dzisiejszym Nablusem na Zachodnim Brzegu; punkt na mapie stoi na jej szczycie, około 47 km na północ od Jerozolimy w linii prostej. Mojżesz nakazał odczytywać błogosławieństwo z Garizim, a przekleństwo z naprzeciwległej Góry Ebal."
    - "Ich pochodzenie opowiadano na dwa sposoby. Księga Królewska mówi, że po upadku Samarii w 722 p.n.e. „przyprowadził król Assyryjski lud z Babilonu, i z Kuta, i z Awa, i z Emat, i z Sefarwaim, a osadził je w miastach Samaryi”, i że mieszali oni cześć Pana z własnymi bogami; Żydzi nazywali ich Kutejczykami. Sami Samarytanie twierdzą, że pochodzą z pokoleń Efraima i Manassesa, uznają za Pismo wyłącznie Pięcioksiąg i głoszą, że to Juda zbłądził, przenosząc sanktuarium z Sychem. Gdy powracający z wygnania budowali Świątynię, ludzie z ziemi zaoferowali pomoc, „jako i wy będziemy szukać Boga waszego”, i spotkali się z odmową; odtąd spór dotyczył jedynego prawdziwego miejsca kultu. Kobieta przy studni powiedziała Jezusowi: „Ojcowie nasi na tej górze chwalili Boga, a wy powiadacie, że w Jeruzalemie jest miejsce, kędy przyzwoita chwalić”."
    - "Wykopaliska na Garizim w latach 1983–2006 odsłoniły otoczony murem święty obszar z okresu perskiego, około V wieku p.n.e., rozbudowany w II wieku w wielkie miasto świątynne; Józef Flawiusz opowiada o jego budowie za Aleksandra i zniszczeniu przez Hasmoneusza Jana Hirkana, które monety i ceramika datują na około 110 p.n.e. Samarytanie nigdy go nie odbudowali, ale co wiosnę wciąż składają na górze w ofierze baranki paschalne. Pozostało ich około 900, mniej więcej połowa w Kiryat Luza na Garizim i połowa w Cholon koło Tel Awiwu."
  it:
    - "I Samaritani erano il popolo della regione collinare tra la Giudea e la Galilea che osservava la legge di Mosè ma adorava non a Gerusalemme bensì sul Monte Garizim, il monte alto 881 m sul livello del mare che si leva sopra Sichem, l’odierna Nablus in Cisgiordania; il punto della mappa si trova sulla sua vetta, a circa 47 km a nord di Gerusalemme in linea d’aria. Mosè aveva ordinato che la benedizione fosse letta dal Garizim e la maledizione dal Monte Ebal di fronte."
    - "La loro origine fu raccontata in due modi. I Re dicono che dopo la caduta di Samaria nel 722 a.C. il re d’Assiria «fece venir genti da Babilonia, da Cutha, da Avva, da Hamath e da Sefarvaim, e le stabilì nelle città della Samaria», e che esse mescolarono il culto del Signore con i propri dèi; i Giudei li chiamavano Cutei. I Samaritani stessi rivendicano la discendenza dalle tribù di Efraim e di Manasse, conservano il solo Pentateuco come Scrittura e sostengono che fu Giuda a deviare spostando il santuario da Sichem. Quando gli esuli tornati costruivano il Tempio, la gente del paese si offrì di aiutare, «giacché, come voi, noi cerchiamo il vostro Dio», e fu respinta; da allora la contesa riguardò l’unico vero luogo di culto. La donna al pozzo lo disse a Gesù: «I nostri padri hanno adorato su questo monte, e voi dite che a Gerusalemme è il luogo dove bisogna adorare»."
    - "Gli scavi sul Garizim dal 1983 al 2006 portarono alla luce un recinto sacro murato del periodo persiano, verso il V secolo a.C., ampliato in una grande città-tempio nel II; Giuseppe Flavio racconta la sua costruzione sotto Alessandro e la sua distruzione da parte dell’asmoneo Giovanni Ircano, che le monete e la ceramica datano al 110 a.C. circa. I Samaritani non lo ricostruirono mai, ma ogni primavera sacrificano ancora gli agnelli pasquali sul monte. Ne restano circa 900, grosso modo la metà a Kiryat Luza sul Garizim e la metà a Colon presso Tel Aviv."
  cs:
    - "Samaritáni byli lid horské země mezi Judskem a Galilejí, který zachovával Mojžíšův zákon, ale neuctíval Boha v Jeruzalémě, nýbrž na hoře Gerizim, hoře 881 m nad mořem, která se zvedá nad Šekemem, dnešním Nábulusem na Západním břehu; bod na mapě stojí na jejím vrcholu, vzdušnou čarou asi 47 km severně od Jeruzaléma. Mojžíš nařídil, aby se požehnání četlo z Gerizimu a prokletí z protilehlé hory Ébal."
    - "Jejich původ se vypráví dvojím způsobem. Knihy Královské praví, že po pádu Samaří roku 722 př. n. l. král Asýrie „přivedl lidi z Babylona, a z Kut a z Ava, a z Emat a z Sefarvaim, a osadil je v městech Samařských“ a že smísili uctívání Hospodina s vlastními bohy; Židé jim říkali Kutejci. Samaritáni sami tvrdí původ z kmenů Efrajimova a Manasesova, za Písmo mají jen Pentateuch a drží, že to byl Juda, kdo zbloudil přesunem svatyně ze Šekemu. Když navrátilci z vyhnanství stavěli chrám, nabídli pomoc lidé země: „Budeme s vámi stavěti; nebo jako i vy hledati budeme Boha vašeho“, a byli odmítnuti; od té doby byl spor o jediné pravé místo uctívání. Žena u studny to předložila Ježíšovi: „Otcové naši na této hoře modlívali se, a vy pravíte, že v Jeruzalémě jest místo, kdežto náleží se modliti.“"
    - "Vykopávky na Gerizimu v letech 1983 až 2006 odkryly opevněný posvátný okrsek z perské doby, asi 5. století př. n. l., rozšířený ve 2. století na velké chrámové město; Josephus vypráví o jeho stavbě za Alexandra a o jeho zničení hasmoneovským Janem Hyrkánem, které mince a keramika datují kolem roku 110 př. n. l. Samaritáni jej nikdy neobnovili, ale dosud obětují velikonoční beránky na hoře každé jaro. Zbývá jich asi 900, zhruba polovina v Kirjat Luza na Gerizimu a polovina v Cholonu u Tel Avivu."
  nl:
    - "De Samaritanen waren het volk van het bergland tussen Judea en Galilea dat de wet van Mozes hield maar niet in Jeruzalem aanbad, maar op de berg Gerizim, de berg van 881 m boven zeeniveau die boven Sichem uitrijst, het huidige Nabloes in de Westelijke Jordaanoever; het punt op de kaart staat op de top, hemelsbreed ongeveer 47 km ten noorden van Jeruzalem. Mozes had bevolen de zegen vanaf de Gerizim uit te spreken en de vloek vanaf de tegenoverliggende berg Ebal."
    - "Hun oorsprong wordt op twee manieren verteld. Koningen zegt dat de koning van Assyrië na de val van Samaria in 722 v.Chr. “bracht volk van Babel, en van Chuta, en van Avva, en van Hamath, en Sefarvaim, en deed hen wonen in de steden van Samaria”, en dat zij de HEER met eigen goden dienden; de joden noemden hen Cuteeërs. De Samaritanen stammen volgens zichzelf af van Efraïm en Manasse, erkennen alleen de Pentateuch als Schrift en menen dat Juda afdwaalde door het heiligdom van Sichem te verplaatsen. Toen de terugkerende ballingen de tempel bouwden, boden de landbewoners hulp aan, “want wij zullen uw God zoeken, gelijk gijlieden”, en werden geweigerd; voortaan ging het geschil om de ene ware plaats van aanbidding. De vrouw bij de put zei tot Jezus: “Onze vaders hebben op dezen berg aangebeden; en gijlieden zegt, dat te Jeruzalem de plaats is, waar men moet aanbidden.”"
    - "Opgravingen op de Gerizim van 1983 tot 2006 legden een ommuurd heilig terrein uit de Perzische tijd bloot, omstreeks de vijfde eeuw v.Chr., in de tweede eeuw uitgebreid tot een grote tempelstad; Josephus vertelt over de bouw ervan onder Alexander en de verwoesting door de Hasmoneeër Johannes Hyrcanus, die volgens munten en aardewerk omstreeks 110 v.Chr. valt. De Samaritanen herbouwden haar nooit, maar slachten nog elke lente de paaslammeren op de berg. Er zijn er nog ongeveer 900, grofweg de helft in Kiryat Luza op de Gerizim en de helft in Cholon bij Tel Aviv."
