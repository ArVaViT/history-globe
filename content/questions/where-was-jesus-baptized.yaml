id: where-was-jesus-baptized
question:
  en: "Where was Jesus baptized?"
  ru: "Где крестился Иисус?"
  uk: "Де охрестився Ісус?"
  es: "¿Dónde fue bautizado Jesús?"
  pt: "Onde Jesus foi batizado?"
  de: "Wo wurde Jesus getauft?"
  fr: "Où Jésus fut-il baptisé ?"
answer:
  en:
    - "In the Jordan, but the exact place is disputed. John's Gospel names it “Bethany beyond Jordan” in most manuscripts, “Bethabara” in others; the traditional site is the ford opposite Jericho, about 11 km from the city and 31 km from Jerusalem in a straight line, where the map point stands at al-Maghtas on the Jordanian bank. Qasr al-Yahud on the Israeli bank faces it across the river."
    - "Mark says that “Jesus came from Nazareth of Galilee, and was baptized of John in Jordan”, and John adds: “These things were done in Bethabara beyond Jordan, where John was baptizing”. Origen, in the third century, found Bethany in almost all the copies but no Bethany by the Jordan, so he preferred Bethabara, which he took to mean “house of preparation”; the name is more often read as “place of the ford”. The pilgrim of Bordeaux in 333 was shown the place of the baptism five miles above the Dead Sea, and the Madaba map of the sixth century marks Bethabara there, on the western bank. Byzantine churches and a monastery of John the Baptist stood on both banks, and the eastern ones, excavated in the late 1990s at Wadi al-Kharrar, were inscribed as a World Heritage site in 2015."
    - "Other readings put the baptism elsewhere. John also baptized “in Ænon near to Salim, because there was much water there”, in the Jordan valley south of Scythopolis, about 61 km north of the ford; and some scholars read “Bethany beyond Jordan” as Batanaea, the region north-east of the Sea of Galilee, where, in John's account, Jesus gathered his first disciples. Luke dates John's preaching to the fifteenth year of Tiberius, AD 28 or 29, which is the year the map uses."
  ru:
    - "В Иордане, но точное место спорно. Евангелие от Иоанна в большинстве рукописей называет его «Вифания за Иорданом», в других — «Вифавара»; традиционное место — брод напротив Иерихона, примерно в 11 км от города и в 31 км от Иерусалима по прямой, где точка на карте стоит у Эль-Магтаса на иорданском берегу. Напротив, на израильском берегу, — Каср-эль-Яхуд."
    - "Марк говорит, что «пришел Иисус из Назарета Галилейского и крестился от Иоанна в Иордане», а Иоанн добавляет: «Это происходило в Вифаваре при Иордане, где крестил Иоанн». Ориген в III веке видел Вифанию почти во всех списках, но не нашёл никакой Вифании у Иордана и предпочёл Вифавару, имя которой толковал как «дом приготовления»; чаще его понимают как «место брода». Бордоскому паломнику в 333 году показали место крещения в пяти милях выше Мёртвого моря, а Мадабская карта VI века отмечает там Вифавару — на западном берегу. Византийские церкви и монастырь Иоанна Крестителя стояли на обоих берегах; восточные, раскопанные в конце 1990-х годов в Вади-эль-Харрар, в 2015 году внесены в список Всемирного наследия."
    - "Другие чтения помещают крещение в иное место. Иоанн крестил и «в Еноне, близ Салима, потому что там было много воды», в долине Иордана к югу от Скифополя, примерно в 61 км к северу от брода; а некоторые учёные читают «Вифанию за Иорданом» как Батанею — область к северо-востоку от Галилейского моря, где, по Иоанну, Иисус собрал первых учеников. Лука относит проповедь Иоанна к пятнадцатому году Тиверия, 28 или 29 г. н. э., и этот год показывает карта."
  uk:
    - "В Йордані, але точне місце спірне. Євангеліє від Івана називає його «Віфанія за Йорданом» у більшості рукописів і «Віфавара» в інших; традиційне місце — брід навпроти Єрихону, приблизно за 11 км від міста і за 31 км від Єрусалима по прямій, де на йорданському березі в аль-Магтасі стоїть точка на мапі. Каср-ель-Яхуд на ізраїльському березі лежить навпроти нього, через річку."
    - "Марк пише, що «Прийшов Ісус із Назарету Галилейського, й охрестивсь у Йоана в Йорданї», а Іван додає: «Се в Витаварі стало ся, за Йорданом, де Йоан хрестив». Оріген у III ст. знайшов Віфанію майже в усіх списках, але не знайшов Віфанії над Йорданом, тому віддав перевагу Віфаварі, яку розумів як «дім приготування»; частіше назву тлумачать як «місце броду». Бордоському паломникові 333 р. показали місце хрещення за п'ять миль вище Мертвого моря, а мозаїчна мапа з Мадаби VI ст. позначає там Віфавару, на західному березі. Візантійські церкви й монастир Івана Хрестителя стояли на обох берегах, а східні, розкопані наприкінці 1990-х у Ваді-ель-Харрар, 2015 року внесено до Списку всесвітньої спадщини."
    - "Інші тлумачення поміщають хрещення деінде. Іван також хрестив «у Єнонї поблизу Салима, бо води було там багато» — у долині Йордану на південь від Скитополя, приблизно за 61 км на північ від броду; а деякі вчені розуміють «Віфанію за Йорданом» як Батанею — область на північний схід від Галілейського моря, де, за оповіддю Івана, Ісус зібрав перших учнів. Лука датує проповідь Івана п'ятнадцятим роком Тиверія, 28 або 29 р. н. е., і саме цей рік використовує мапа."
  es:
    - "En el Jordán, pero el lugar exacto se discute. El Evangelio de Juan lo llama Betania al otro lado del Jordán en la mayoría de los manuscritos, Betábara en otros; el sitio tradicional es el vado frente a Jericó, a unos 11 km de la ciudad y a 31 km de Jerusalén en línea recta, donde está el punto del mapa, en al-Maghtas, en la orilla jordana. Qasr al-Yahud, en la orilla israelí, le queda enfrente al otro lado del río."
    - "Marcos dice que «Jesús vino de Nazaret de Galilea, y fué bautizado por Juan en el Jordán», y Juan añade: «Estas cosas acontecieron en Betábara, de la otra parte del Jordán, donde Juan bautizaba». Orígenes, en el siglo III, halló Betania en casi todas las copias, pero ninguna Betania junto al Jordán, por lo que prefirió Betábara, que entendió como «casa de preparación»; el nombre se lee más a menudo como «lugar del vado». Al peregrino de Burdeos le mostraron en 333 el lugar del bautismo a cinco millas por encima del mar Muerto, y el mapa de Madaba, del siglo VI, marca allí Betábara, en la orilla occidental. En ambas orillas se alzaron iglesias bizantinas y un monasterio de Juan el Bautista, y las orientales, excavadas a finales de la década de 1990 en Wadi al-Kharrar, fueron inscritas como Patrimonio de la Humanidad en 2015."
    - "Otras lecturas sitúan el bautismo en otra parte. Juan también bautizaba «en Enón junto á Salim, porque había allí muchas aguas», en el valle del Jordán al sur de Escitópolis, a unos 61 km al norte del vado; y algunos estudiosos leen Betania al otro lado del Jordán como Batanea, la región al noreste del mar de Galilea, donde, en el relato de Juan, Jesús reunió a sus primeros discípulos. Lucas fecha la predicación de Juan en el año quince de Tiberio, 28 o 29 d. C., que es el año que usa el mapa."
  pt:
    - "No Jordão, mas o lugar exato é disputado. O Evangelho de João o chama “Betânia, do outro lado do Jordão” na maioria dos manuscritos, “Betabara” em outros; o sítio tradicional é o vau em frente a Jericó, a cerca de 11 km da cidade e 31 km de Jerusalém em linha reta, onde o ponto do mapa fica em al-Maghtas, na margem jordaniana. Qasr al-Yahud, na margem israelense, fica em frente a ele, do outro lado do rio."
    - "Marcos diz que “Jesus veio de Nazaré da Galileia e foi batizado por João no Jordão”, e João acrescenta que essas coisas aconteceram em Betabara, do outro lado do Jordão, onde João batizava. Orígenes, no século III, encontrou Betânia em quase todas as cópias, mas nenhuma Betânia junto ao Jordão, e por isso preferiu Betabara, que entendeu como “casa de preparação”; o nome é lido com mais frequência como “lugar do vau”. O peregrino de Bordeaux, em 333, foi levado ao lugar do batismo, a cinco milhas acima do mar Morto, e o mapa de Madaba, do século VI, marca ali Betabara, na margem ocidental. Igrejas bizantinas e um mosteiro de João Batista ficavam nas duas margens, e as orientais, escavadas no final da década de 1990 em Wadi al-Kharrar, foram inscritas como Patrimônio Mundial em 2015."
    - "Outras leituras situam o batismo em outro lugar. João também batizou “em Enom, perto de Salim, porque havia muita água ali”, no vale do Jordão, ao sul de Citópolis, a cerca de 61 km ao norte do vau; e alguns estudiosos leem “Betânia, do outro lado do Jordão” como Batanaia, a região a nordeste do mar da Galileia, onde, no relato de João, Jesus reuniu os seus primeiros discípulos. Lucas data a pregação de João no décimo quinto ano de Tibério, 28 ou 29 d.C., que é o ano usado pelo mapa."
  de:
    - "Im Jordan, doch der genaue Ort ist umstritten. Das Johannesevangelium nennt ihn in den meisten Handschriften „Bethanien jenseits des Jordans“, in anderen „Bethabara“; die traditionelle Stätte ist die Furt gegenüber von Jericho, etwa 11 km von der Stadt und in der Luftlinie 31 km von Jerusalem entfernt, wo der Kartenpunkt bei al-Maghtas am jordanischen Ufer steht. Qasr al-Yahud am israelischen Ufer liegt ihm über den Fluss gegenüber."
    - "Markus sagt, „Jesus aus Galiläa von Nazareth kam und ließ sich taufen von Johannes im Jordan“, und Johannes fügt hinzu: „Dies geschah zu Bethabara jenseit des Jordans, wo Johannes taufte.“ Origenes fand im 3. Jahrhundert in fast allen Abschriften Bethanien, aber kein Bethanien am Jordan, und zog daher Bethabara vor, das er als „Haus der Zubereitung“ verstand; häufiger wird der Name als „Ort der Furt“ gelesen. Dem Pilger von Bordeaux zeigte man 333 die Taufstelle fünf Meilen oberhalb des Toten Meeres, und die Madaba-Karte des 6. Jahrhunderts verzeichnet dort, am Westufer, Bethabara. Byzantinische Kirchen und ein Kloster Johannes des Täufers standen an beiden Ufern; die östlichen, in den späten 1990er-Jahren in Wadi al-Charrar ausgegraben, wurden 2015 als Welterbestätte eingetragen."
    - "Andere Lesarten verlegen die Taufe anderswohin. Johannes taufte auch „zu Enon, nahe bei Salim, denn es war viel Wasser daselbst“, im Jordantal südlich von Skythopolis, etwa 61 km nördlich der Furt; und manche Gelehrte lesen „Bethanien jenseits des Jordans“ als Batanäa, die Region nordöstlich des Sees Genezareth, wo Jesus nach dem Bericht des Johannes seine ersten Jünger sammelte. Lukas datiert die Predigt des Johannes in das fünfzehnte Jahr des Tiberius, 28 oder 29 n. Chr., das Jahr, das die Karte verwendet."
  fr:
    - "Dans le Jourdain, mais le lieu exact est discuté. L’Évangile de Jean le nomme « Béthanie, au-delà du Jourdain » dans la plupart des manuscrits, Béthabara dans d’autres ; le site traditionnel est le gué en face de Jéricho, à environ 11 km de la ville et à 31 km de Jérusalem à vol d’oiseau, où le point de la carte se trouve à al-Maghtas, sur la rive jordanienne. Qasr al-Yahud, sur la rive israélienne, lui fait face de l’autre côté du fleuve."
    - "Marc dit que « Jésus vint de Nazareth en Galilée, et il fut baptisé par Jean dans le Jourdain », et Jean ajoute que cela se passa à Béthabara, au-delà du Jourdain, où Jean baptisait. Origène, au IIIe siècle, trouva Béthanie dans presque tous les exemplaires mais aucune Béthanie près du Jourdain, et préféra donc Béthabara, qu’il comprenait comme « maison de préparation » ; le nom se lit plus souvent comme « lieu du gué ». Le pèlerin de Bordeaux, en 333, se fit montrer le lieu du baptême à cinq milles au nord de la mer Morte, et la carte de Madaba, au VIe siècle, y marque Béthabara, sur la rive occidentale. Des églises byzantines et un monastère de Jean-Baptiste se dressaient sur les deux rives, et celles de la rive orientale, fouillées à la fin des années 1990 à Wadi al-Kharrar, ont été inscrites au patrimoine mondial en 2015."
    - "D’autres lectures situent le baptême ailleurs. Jean baptisait aussi « à Énon, près de Salim, parce qu’il y avait là beaucoup d’eau », dans la vallée du Jourdain, au sud de Scythopolis, à environ 61 km au nord du gué ; et certains spécialistes lisent « Béthanie, au-delà du Jourdain » comme la Batanée, la région au nord-est de la mer de Galilée, où, dans le récit de Jean, Jésus réunit ses premiers disciples. Luc date la prédication de Jean de « la quinzième année du règne de Tibère César », soit 28 ou 29 apr. J.-C., année que retient la carte."
