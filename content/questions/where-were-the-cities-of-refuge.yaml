id: where-were-the-cities-of-refuge
question:
  en: "Where were the six cities of refuge?"
  ru: "Где находились шесть городов убежища?"
  uk: "Де були шість міст-захистків?"
  es: "¿Dónde estaban las seis ciudades de refugio?"
  pt: "Onde ficavam as seis cidades de refúgio?"
  de: "Wo lagen die sechs Freistädte?"
  fr: "Où se trouvaient les six villes de refuge ?"
answer:
  en:
    - "The six cities of refuge were spread over the whole land, three on each side of the Jordan, so that no part of it was far from one. West of the river stood Kedesh in Galilee in the hills of Naphtali, Shechem in the hill country of Ephraim and Hebron in the hills of Judah; east of it, Golan in Bashan, Ramoth in Gilead and Bezer on the plateau of Reuben. Kedesh, the northernmost, lies about 180 km north of Hebron in a straight line, with Shechem between them, about 100 km from Kedesh and 78 km from Hebron; across the river Golan, Ramoth and Bezer make a matching line from north to south, and Bezer is about 63 km east of Jerusalem. The map opens on the chapter of Joshua that names all six."
    - "They were a refuge for a man who had killed without intent: “that the slayer may flee thither, which killeth any person at unawares”. The city sheltered him from the avenger of blood, the dead man's next of kin, “until he stand before the congregation in judgment”; if the killing proved unintended, he lived in the city “unto the death of the high priest” and then went home. At the gate he was to “declare his cause in the ears of the elders of that city”. Deuteronomy tells Israel: “Thou shalt prepare thee a way, and divide the coasts of thy land… into three parts”. Moses set apart the three eastern cities and Joshua the three western; all six were among the forty-eight cities of the Levites, and Hebron was given to the sons of Aaron “to be a city of refuge for the slayer”. A wilful murderer had no refuge: “thou shalt take him from mine altar, that he may die.”"
    - "Shechem is Tell Balata at the edge of Nablus, Hebron the mound of Tel Rumeida, and Kedesh the large tell of Tel Kedesh west of the Hula valley; these are certain. Ramoth-gilead is usually placed at Tell er-Rumeith near the Jordanian border with Syria, though other sites are proposed; Golan is sought at Sahem el-Jolan east of the Sea of Galilee, and Bezer, which Mesha of Moab says he rebuilt, at Umm el-Amad on the plateau east of the Dead Sea, and both of these are guesses. When the law arose is debated: many critics since Wellhausen take the cities as a later answer to Josiah's closing of the local altars, where a killer had once fled, while others hold the asylum to be old and the lists to reflect real towns of the monarchy. The rabbis said the roads to the cities were kept wide and marked “Refuge” at every crossroads."
  ru:
    - "Шесть городов убежища были разбросаны по всей земле, по три с каждой стороны Иордана, чтобы ни одна её часть не была далеко от них. К западу от реки стояли Кедес в Галилее, на горе Неффалимовой, Сихем на горе Ефремовой и Хеврон на горе Иудиной; к востоку — Голан в Васане, Рамоф в Галааде и Бецер на равнине Рувима. Самый северный, Кедес, лежит примерно в 180 км к северу от Хеврона по прямой, а Сихем — между ними, примерно в 100 км от Кедеса и в 78 км от Хеврона; за рекой Голан, Рамоф и Бецер образуют такую же цепь с севера на юг, и Бецер находится примерно в 63 км к востоку от Иерусалима. Карта открывается на главе книги Иисуса Навина, где названы все шесть."
    - "Это было убежище для того, кто убил без умысла: «куда мог бы убежать убийца, убивший человека неумышленно». Город укрывал его от мстителя за кровь, ближайшего родственника убитого, «прежде нежели он предстанет пред общество на суд»; если убийство оказывалось неумышленным, он жил в городе «до смерти великого священника» и потом возвращался домой. У ворот он должен был рассказать «вслух старейшин города сего дело свое». Второзаконие велит: «устрой себе дорогу и раздели на три части всю землю твою». Моисей отделил три восточных города, Иисус Навин — три западных; все шесть входили в число сорока восьми левитских городов, а Хеврон отдан сынам Аарона как «город убежища для убийцы». Для намеренного убийцы убежища не было: «и от жертвенника Моего бери его на смерть»."
    - "Сихем — это Телль-Балата на окраине Наблуса, Хеврон — холм Тель-Румейда, Кедес — большой холм Тель-Кедеш к западу от долины Хулы; эти места известны твёрдо. Рамоф Галаадский обычно помещают на Телль-эр-Румейт у границы Иордании с Сирией, хотя предлагают и другие места; Голан ищут в Сахем-эль-Джолане к востоку от Галилейского моря, а Бецер, который, по словам моавитского царя Меши, он отстроил, — в Умм-эль-Амаде на плато к востоку от Мёртвого моря, и оба эти отождествления — догадки. Когда возник этот закон, спорят: многие критики вслед за Вельхаузеном видят в городах позднюю замену местных жертвенников, у которых прежде искал защиты убийца и которые закрыл Иосия, а другие считают право убежища древним, а списки — отражением настоящих городов царского времени. Раввины говорили, что дороги к этим городам держали широкими и на каждом перекрёстке ставили знак «Убежище»."
  uk:
    - "Шість міст-захистків були розташовані по всій землі, по три з кожного боку Йордану, щоб жодна її частина не була далеко від котрогось. На захід від річки стояли Кедес у Галілеї в пагорбах Нефталима, Сихем у гірському краї Ефраїма і Хеврон у пагорбах Юди; на схід від неї — Голан у Башані, Рамот у Гілеаді та Бецер на плато Рувима. Кедес, найпівнічніший, лежить приблизно за 180 км на північ від Хеврона по прямій, а Сихем між ними — приблизно за 100 км від Кедеса і за 78 км від Хеврона; через річку Голан, Рамот і Бецер складають відповідну лінію з півночі на південь, і Бецер лежить приблизно за 63 км на схід від Єрусалима. Мапа відкривається на розділі Книги Ісуса Навина, що називає всі шість."
    - "Вони були прибіжищем для людини, яка вбила ненавмисно: «щоб можна було втїчи туди убийцеві, що ненароком убив людину». Місто захищало його від месника за кров, найближчого родича вбитого, «перше, нїм стане на суд перед громадою»; якщо вбивство виявлялося ненавмисним, він жив у місті «аж до смерти великого сьвященника», а потім повертався додому. Біля брами, як сказано, «нехай стане у входу до міста, і принесе справу свою перед мужів громадських сего города». Книга Повторення Закону каже Ізраїлю: «Проведи туди дорогу, і роздїли країну землї твоєї на три частї». Мойсей виділив три східні міста, а Ісус Навин — три західні; усі шість були серед сорока восьми міст левітів, а Хеврон було віддано нащадкам Аарона як «охоронний город для убийця». Навмисний убивця не мав захистку: «і від жертівника мого мусиш узяти його, щоб скарати смертю»."
    - "Сихем — це Телль-Балата на краю Наблуса, Хеврон — пагорб Тель-Румейда, а Кедес — великий тель Тель-Кедеш на захід від долини Хула; це певне. Рамот Гілеадський зазвичай розміщують у Телль-ер-Румейті біля йорданського кордону з Сирією, хоча пропонують інші місця; Голан шукають у Сахем-ель-Джолані на схід від Галілейського моря, а Бецер, який, за Мешею Моавським, він відбудував, — в Умм-ель-Амаді на плато на схід від Мертвого моря, і обидва ці місця — здогади. Коли виник закон — обговорюють: багато критиків від Велльгаузена вважають міста пізнішою відповіддю на закриття місцевих жертовників Йосією, куди колись тікав убивця, тоді як інші вважають право притулку давнім, а списки — відображенням справжніх міст монархії. Рабини казали, що дороги до міст утримували широкими і позначали «Притулок» на кожному перехресті."
  es:
    - "Las seis ciudades de refugio estaban repartidas por toda la tierra, tres a cada lado del Jordán, de modo que ninguna parte quedaba lejos de una. Al oeste del río estaban Cedes, en Galilea, en las colinas de Neftalí, Siquem, en la región montañosa de Efraín, y Hebrón, en las colinas de Judá; al este, Golán, en Basán, Ramot, en Galaad, y Beser, en la meseta de Rubén. Cedes, la más septentrional, queda a unos 180 km al norte de Hebrón en línea recta, con Siquem entre ellas, a unos 100 km de Cedes y a 78 km de Hebrón; al otro lado del río, Golán, Ramot y Beser forman una línea paralela de norte a sur, y Beser está a unos 63 km al este de Jerusalén. El mapa se abre en el capítulo de Josué que nombra las seis."
    - "Eran refugio del que había matado sin querer: «donde huya el homicida que hiriere á alguno de muerte por yerro». La ciudad lo protegía del vengador de la sangre, el pariente más cercano del muerto, «hasta que esté á juicio delante de la congregación»; si se probaba que la muerte no fue intencionada, vivía en la ciudad «hasta que muera el gran sacerdote» y luego volvía a casa. A la puerta debía presentarse y «dirá sus causas, oyéndolo los ancianos de aquella ciudad». Deuteronomio dice a Israel: «Arreglarte has el camino, y dividirás en tres partes el término de tu tierra». Moisés separó las tres orientales y Josué las tres occidentales; las seis estaban entre las cuarenta y ocho ciudades levíticas, y Hebrón fue dada a los hijos de Aarón como «la ciudad de refugio para los homicidas». El homicida voluntario no tenía refugio: «de mi altar lo quitarás para que muera»."
    - "Siquem es Tell Balata, en el borde de Nablus, Hebrón el montículo de Tel Rumeida, y Cedes el gran tell de Tel Cedes, al oeste del valle del Hula; son seguras. Ramot de Galaad se sitúa por lo común en Tell er-Rumeith, cerca de la frontera de Jordania con Siria, aunque se proponen otros; Golán se busca en Sahem el-Jolan, al este del mar de Galilea, y Beser, que Mesa de Moab dice haber reconstruido, en Umm el-Amad, en la meseta al este del mar Muerto; ambas son conjeturas. Cuándo surgió la ley se discute: muchos críticos desde Wellhausen toman las ciudades como respuesta tardía a la clausura de los altares locales por Josías, adonde antes huía el homicida, y otros sostienen que el asilo es antiguo y las listas reflejan ciudades reales de la monarquía. Los rabinos decían que los caminos a las ciudades se mantenían anchos y con la señal «Refugio» en cada encrucijada."
  pt:
    - "As seis cidades de refúgio estavam espalhadas por toda a terra, três de cada lado do Jordão, de modo que nenhuma parte dela ficava longe de uma. A oeste do rio ficavam Quedes, na Galileia, nas colinas de Naftali, Siquém, na região montanhosa de Efraim, e Hebrom, nas colinas de Judá; a leste, Golã, em Basã, Ramote, em Gileade, e Bezer, no planalto de Rúben. Quedes, a mais setentrional, fica a cerca de 180 km ao norte de Hebrom em linha reta, com Siquém entre elas, a 100 km de Quedes e 78 km de Hebrom; do outro lado do rio, Golã, Ramote e Bezer formam uma linha correspondente de norte a sul, e Bezer fica a cerca de 63 km a leste de Jerusalém. O mapa abre no capítulo de Josué que nomeia as seis."
    - "Eram refúgio para o homem que matara sem intenção: “para que o homicida que matar qualquer pessoa sem intenção possa fugir para lá”. A cidade o abrigava do vingador do sangue, o parente mais próximo do morto, “até que compareça perante a congregação para julgamento”; se a morte se provasse involuntária, ele vivia na cidade “até a morte do sumo sacerdote” e depois voltava para casa. À porta ele “declarará o seu caso aos ouvidos dos anciãos daquela cidade”. O Deuteronômio diz a Israel: “Você preparará o caminho, e dividirá o território da sua terra… em três partes”. Moisés separou as três orientais e Josué as três ocidentais; as seis estavam entre as quarenta e oito cidades dos levitas, e Hebrom foi dada aos filhos de Arão como “a cidade de refúgio para o homicida”. O assassino deliberado não tinha refúgio: “você o tirará até mesmo do meu altar, para que morra.”"
    - "Siquém é Tell Balata, na orla de Nablus, Hebrom o monte de Tel Rumeida, e Quedes o grande tell de Tel Kedesh, a oeste do vale de Hula; essas são certas. Ramote-Gileade é geralmente situada em Tell er-Rumeith, perto da fronteira da Jordânia com a Síria, embora se proponham outros sítios; Golã é procurada em Sahem el-Jolan, a leste do mar da Galileia, e Bezer, que Mesa de Moabe diz ter reconstruído, em Umm el-Amad, no planalto a leste do mar Morto, e ambas são conjeturas. Quando surgiu a lei é debatido: muitos críticos desde Wellhausen tomam as cidades como resposta posterior ao fechamento dos altares locais por Josias, onde o homicida antes se refugiava, enquanto outros tomam o asilo por antigo e as listas por reflexo de cidades reais da monarquia. Os rabinos diziam que as estradas para as cidades eram mantidas largas e marcadas com “Refúgio” em cada encruzilhada."
  de:
    - "Die sechs Freistädte lagen über das ganze Land verteilt, drei auf jeder Seite des Jordans, sodass kein Teil des Landes weit von einer entfernt war. Westlich des Flusses standen Kedesch in Galiläa im Bergland Naftali, Sichem im Bergland Ephraim und Hebron im Bergland Juda; östlich davon Golan in Baschan, Ramot in Gilead und Bezer auf der Hochebene Rubens. Kedesch, die nördlichste, liegt in der Luftlinie etwa 180 km nördlich von Hebron, dazwischen Sichem, etwa 100 km von Kedesch und 78 km von Hebron; jenseits des Flusses bilden Golan, Ramot und Bezer eine entsprechende Linie von Nord nach Süd, und Bezer liegt etwa 63 km östlich von Jerusalem. Die Karte öffnet sich auf dem Kapitel bei Josua, das alle sechs nennt."
    - "Sie waren Zuflucht für einen unabsichtlichen Totschläger: „wohin fliehe, wer einen Totschlag unversehens tut“. Die Stadt schützte ihn vor dem Bluträcher, dem nächsten Verwandten des Toten, „bis daß er vor der Gemeinde vor Gericht gestanden sei“; erwies sich die Tat als unbeabsichtigt, lebte er in der Stadt „bis an den Tod des Hohenpriesters“ und ging dann heim. Am Tor sollte er „vor den Ältesten der Stadt seine Sache ansagen“. Das Deuteronomium sagt zu Israel: „Und sollst den Weg dahin zurichten und das Gebiet deines Landes … in drei Kreise scheiden“. Mose sonderte die drei östlichen Städte aus und Josua die drei westlichen; alle sechs zählten zu den achtundvierzig Levitenstädten, und Hebron ging an die Söhne Aarons als „die Freistadt der Totschläger, Hebron“. Ein vorsätzlicher Mörder hatte keine Zuflucht: „so sollst du denselben von meinem Altar nehmen, daß man ihn töte.“"
    - "Sichem ist Tell Balata am Rand von Nablus, Hebron der Hügel Tel Rumeida und Kedesch der große Tel Kedesch westlich des Hulatals; das ist sicher. Ramot in Gilead wird meist bei Tell er-Rumeith nahe der jordanisch-syrischen Grenze angesetzt, doch andere Orte werden vorgeschlagen; Golan sucht man bei Sahem el-Dschaulan östlich des Sees Genezareth und Bezer, das nach eigener Angabe Mesa von Moab wiederaufbaute, bei Umm el-Amad östlich des Toten Meeres, beides Vermutungen. Wann das Gesetz entstand, ist umstritten: Viele Kritiker seit Wellhausen sehen die Städte als spätere Antwort auf Josias Schließung der örtlichen Altäre, wohin einst ein Totschläger geflohen war, andere halten das Asyl für alt und die Listen für Abbilder wirklicher Städte der Königszeit. Die Rabbinen sagten, die Wege zu den Städten seien breit gehalten und an jeder Kreuzung mit „Zuflucht“ gekennzeichnet gewesen."
  fr:
    - "Les six villes de refuge étaient réparties dans tout le pays, trois de chaque côté du Jourdain, si bien qu’aucune partie n’en était éloignée. À l’ouest du fleuve se trouvaient Kédesch en Galilée, dans les collines de Nephthali, Sichem dans la région montagneuse d’Éphraïm et Hébron dans les collines de Juda ; à l’est, Golan en Basan, Ramoth en Galaad et Betser sur le plateau de Ruben. Kédesch, la plus septentrionale, est à environ 180 km au nord d’Hébron à vol d’oiseau, Sichem se trouvant entre elles, à environ 100 km de Kédesch et à 78 km d’Hébron ; de l’autre côté du fleuve, Golan, Ramoth et Betser forment une ligne correspondante du nord au sud, et Betser est à environ 63 km à l’est de Jérusalem. La carte s’ouvre sur le chapitre de Josué qui nomme les six."
    - "Elles étaient un refuge pour l’homme qui avait tué sans intention : « où pourra s’enfuir le meurtrier qui aura tué quelqu’un involontairement ». La ville le gardait du vengeur du sang, proche parent du mort, « avant d’avoir comparu devant l’assemblée pour être jugé » ; si le meurtre était involontaire, il y demeurait « jusqu’à la mort du souverain sacrificateur », puis rentrait chez lui. À la porte, il devait « exposer son cas aux anciens de cette ville ». Le Deutéronome dit à Israël : « Tu établiras des routes, et tu diviseras en trois parties le territoire du pays ». Moïse mit à part les trois de l’est, Josué les trois de l’ouest ; les six étaient parmi les quarante-huit villes des lévites, Hébron étant donnée aux fils d’Aaron comme « la ville de refuge pour les meurtriers ». Le meurtrier volontaire n’avait pas de refuge : « tu l’arracheras même de mon autel, pour le faire mourir »."
    - "Sichem est Tell Balata, près de Naplouse, Hébron le tertre de Tel Rumeida, Kédesch le grand tell de Tel Kedesh, à l’ouest de la vallée de la Houla : c’est certain. Ramoth en Galaad se place d’ordinaire à Tell er-Rumeith, près de la frontière syrienne de la Jordanie, mais d’autres sites sont proposés ; Golan est cherchée à Sahem el-Jolan, à l’est de la mer de Galilée, et Betser, que Méscha de Moab dit avoir rebâtie, à Umm el-Amad, sur le plateau à l’est de la mer Morte : deux conjectures. L’origine de la loi est débattue : depuis Wellhausen, nombre de critiques y voient une réponse tardive à la fermeture des autels locaux par Josias, où le meurtrier s’était autrefois réfugié, d’autres tenant l’asile pour ancien et les listes pour le reflet de villes réelles de la monarchie. Les rabbins disaient que les routes restaient larges et marquées « Refuge » à chaque carrefour."
