id: where-were-the-cities-of-refuge
question:
  en: "Where were the six cities of refuge?"
  ru: "Где находились шесть городов убежища?"
  uk: "Де були шість міст-захистків?"
  es: "¿Dónde estaban las seis ciudades de refugio?"
  pt: "Onde ficavam as seis cidades de refúgio?"
  de: "Wo lagen die sechs Freistädte?"
  fr: "Où se trouvaient les six villes de refuge ?"
  pl: "Gdzie leżało sześć miast ucieczki?"
  it: "Dove si trovavano le sei città di rifugio?"
  cs: "Kde bylo šest útočištných měst?"
  nl: "Waar lagen de zes vrijsteden?"
  sv: "Var låg de sex fristäderna?"
  nb: "Hvor lå de seks tilfluktsbyene?"
  tl: "Nasaan ang anim na bayang ampunan?"
  da: "Hvor lå de seks tilflugtsbyer?"
  sr: "Где је било шест градова уточишта?"
  hu: "Hol voltak a hat menedékváros?"
  fi: "Missä kuusi turvakaupunkia sijaitsi?"
  vi: "Sáu thành ẩn náu ở đâu?"
  ro: "Unde se aflau cele șase cetăți de scăpare?"
  bg: "Къде са се намирали шестте града-убежища?"
answer:
  en:
    - "The six cities of refuge were spread over the whole land, three on each side of the Jordan, so that no part of it was far from one. West of the river stood Kedesh in Galilee in the hills of Naphtali, Shechem in the hill country of Ephraim and Hebron in the hills of Judah; east of it, Golan in Bashan, Ramoth in Gilead and Bezer on the plateau of Reuben. Kedesh, the northernmost, lies about 180 km north of Hebron in a straight line, with Shechem between them, about 100 km from Kedesh and 78 km from Hebron; across the river Golan, Ramoth and Bezer make a matching line from north to south, and Bezer is about 63 km east of Jerusalem. The map opens on the chapter of Joshua that names all six."
    - "They were a refuge for a man who had killed without intent: “that the slayer may flee thither, which killeth any person at unawares”. The city sheltered him from the avenger of blood, the dead man's next of kin, “until he stand before the congregation in judgment”; if the killing proved unintended, he lived in the city “unto the death of the high priest” and then went home. At the gate he was to “declare his cause in the ears of the elders of that city”. Deuteronomy tells Israel: “Thou shalt prepare thee a way, and divide the coasts of thy land… into three parts”. Moses set apart the three eastern cities and Joshua the three western; all six were among the forty-eight cities of the Levites, and Hebron was given to the sons of Aaron “to be a city of refuge for the slayer”. A wilful murderer had no refuge: “thou shalt take him from mine altar, that he may die.”"
    - "Shechem is Tell Balata at the edge of Nablus, Hebron the mound of Tel Rumeida, and Kedesh the large tell of Tel Kedesh west of the Hula valley; these are certain. Ramoth-gilead is usually placed at Tell er-Rumeith near the Jordanian border with Syria, though other sites are proposed; Golan is sought at Sahem el-Jolan east of the Sea of Galilee, and Bezer, which Mesha of Moab says he rebuilt, at Umm el-Amad on the plateau east of the Dead Sea, and both of these are guesses. When the law arose is debated: many critics since Wellhausen take the cities as a later answer to Josiah's closing of the local altars, where a killer had once fled, while others hold the asylum to be old and the lists to reflect real towns of the monarchy. The rabbis said the roads to the cities were kept wide and marked “Refuge” at every crossroads."
  ru:
    - "Шесть городов убежища были разбросаны по всей земле, по три с каждой стороны Иордана, чтобы ни одна её часть не была далеко от них. К западу от реки стояли Кедес в Галилее, на горе Неффалимовой, Сихем на горе Ефремовой и Хеврон на горе Иудиной; к востоку — Голан в Васане, Рамоф в Галааде и Бецер на равнине Рувима. Самый северный, Кедес, лежит примерно в 180 км к северу от Хеврона по прямой, а Сихем — между ними, примерно в 100 км от Кедеса и в 78 км от Хеврона; за рекой Голан, Рамоф и Бецер образуют такую же цепь с севера на юг, и Бецер находится примерно в 63 км к востоку от Иерусалима. Карта открывается на главе книги Иисуса Навина, где названы все шесть."
    - "Это было убежище для того, кто убил без умысла: «куда мог бы убежать убийца, убивший человека неумышленно». Город укрывал его от мстителя за кровь, ближайшего родственника убитого, «прежде нежели он предстанет пред общество на суд»; если убийство оказывалось неумышленным, он жил в городе «до смерти великого священника» и потом возвращался домой. У ворот он должен был рассказать «вслух старейшин города сего дело свое». Второзаконие велит: «устрой себе дорогу и раздели на три части всю землю твою». Моисей отделил три восточных города, Иисус Навин — три западных; все шесть входили в число сорока восьми левитских городов, а Хеврон отдан сынам Аарона как «город убежища для убийцы». Для намеренного убийцы убежища не было: «и от жертвенника Моего бери его на смерть»."
    - "Сихем — это Телль-Балата на окраине Наблуса, Хеврон — холм Тель-Румейда, Кедес — большой холм Тель-Кедеш к западу от долины Хулы; эти места известны твёрдо. Рамоф Галаадский обычно помещают на Телль-эр-Румейт у границы Иордании с Сирией, хотя предлагают и другие места; Голан ищут в Сахем-эль-Джолане к востоку от Галилейского моря, а Бецер, который, по словам моавитского царя Меши, он отстроил, — в Умм-эль-Амаде на плато к востоку от Мёртвого моря, и оба эти отождествления — догадки. Когда возник этот закон, спорят: многие критики вслед за Вельхаузеном видят в городах позднюю замену местных жертвенников, у которых прежде искал защиты убийца и которые закрыл Иосия, а другие считают право убежища древним, а списки — отражением настоящих городов царского времени. Раввины говорили, что дороги к этим городам держали широкими и на каждом перекрёстке ставили знак «Убежище»."
  uk:
    - "Шість міст-захистків були розташовані по всій землі, по три з кожного боку Йордану, щоб жодна її частина не була далеко від котрогось. На захід від річки стояли Кедес у Галілеї в пагорбах Нефталима, Сихем у гірському краї Ефраїма і Хеврон у пагорбах Юди; на схід від неї — Голан у Башані, Рамот у Гілеаді та Бецер на плато Рувима. Кедес, найпівнічніший, лежить приблизно за 180 км на північ від Хеврона по прямій, а Сихем між ними — приблизно за 100 км від Кедеса і за 78 км від Хеврона; через річку Голан, Рамот і Бецер складають відповідну лінію з півночі на південь, і Бецер лежить приблизно за 63 км на схід від Єрусалима. Мапа відкривається на розділі Книги Ісуса Навина, що називає всі шість."
    - "Вони були прибіжищем для людини, яка вбила ненавмисно: «щоб можна було втїчи туди убийцеві, що ненароком убив людину». Місто захищало його від месника за кров, найближчого родича вбитого, «перше, нїм стане на суд перед громадою»; якщо вбивство виявлялося ненавмисним, він жив у місті «аж до смерти великого сьвященника», а потім повертався додому. Біля брами, як сказано, «нехай стане у входу до міста, і принесе справу свою перед мужів громадських сего города». Книга Повторення Закону каже Ізраїлю: «Проведи туди дорогу, і роздїли країну землї твоєї на три частї». Мойсей виділив три східні міста, а Ісус Навин — три західні; усі шість були серед сорока восьми міст левітів, а Хеврон було віддано нащадкам Аарона як «охоронний город для убийця». Навмисний убивця не мав захистку: «і від жертівника мого мусиш узяти його, щоб скарати смертю»."
    - "Сихем — це Телль-Балата на краю Наблуса, Хеврон — пагорб Тель-Румейда, а Кедес — великий тель Тель-Кедеш на захід від долини Хула; це певне. Рамот Гілеадський зазвичай розміщують у Телль-ер-Румейті біля йорданського кордону з Сирією, хоча пропонують інші місця; Голан шукають у Сахем-ель-Джолані на схід від Галілейського моря, а Бецер, який, за Мешею Моавським, він відбудував, — в Умм-ель-Амаді на плато на схід від Мертвого моря, і обидва ці місця — здогади. Коли виник закон — обговорюють: багато критиків від Велльгаузена вважають міста пізнішою відповіддю на закриття місцевих жертовників Йосією, куди колись тікав убивця, тоді як інші вважають право притулку давнім, а списки — відображенням справжніх міст монархії. Рабини казали, що дороги до міст утримували широкими і позначали «Притулок» на кожному перехресті."
  es:
    - "Las seis ciudades de refugio estaban repartidas por toda la tierra, tres a cada lado del Jordán, de modo que ninguna parte quedaba lejos de una. Al oeste del río estaban Cedes, en Galilea, en las colinas de Neftalí, Siquem, en la región montañosa de Efraín, y Hebrón, en las colinas de Judá; al este, Golán, en Basán, Ramot, en Galaad, y Beser, en la meseta de Rubén. Cedes, la más septentrional, queda a unos 180 km al norte de Hebrón en línea recta, con Siquem entre ellas, a unos 100 km de Cedes y a 78 km de Hebrón; al otro lado del río, Golán, Ramot y Beser forman una línea paralela de norte a sur, y Beser está a unos 63 km al este de Jerusalén. El mapa se abre en el capítulo de Josué que nombra las seis."
    - "Eran refugio del que había matado sin querer: «donde huya el homicida que hiriere á alguno de muerte por yerro». La ciudad lo protegía del vengador de la sangre, el pariente más cercano del muerto, «hasta que esté á juicio delante de la congregación»; si se probaba que la muerte no fue intencionada, vivía en la ciudad «hasta que muera el gran sacerdote» y luego volvía a casa. A la puerta debía presentarse y «dirá sus causas, oyéndolo los ancianos de aquella ciudad». Deuteronomio dice a Israel: «Arreglarte has el camino, y dividirás en tres partes el término de tu tierra». Moisés separó las tres orientales y Josué las tres occidentales; las seis estaban entre las cuarenta y ocho ciudades levíticas, y Hebrón fue dada a los hijos de Aarón como «la ciudad de refugio para los homicidas». El homicida voluntario no tenía refugio: «de mi altar lo quitarás para que muera»."
    - "Siquem es Tell Balata, en el borde de Nablus, Hebrón el montículo de Tel Rumeida, y Cedes el gran tell de Tel Cedes, al oeste del valle del Hula; son seguras. Ramot de Galaad se sitúa por lo común en Tell er-Rumeith, cerca de la frontera de Jordania con Siria, aunque se proponen otros; Golán se busca en Sahem el-Jolan, al este del mar de Galilea, y Beser, que Mesa de Moab dice haber reconstruido, en Umm el-Amad, en la meseta al este del mar Muerto; ambas son conjeturas. Cuándo surgió la ley se discute: muchos críticos desde Wellhausen toman las ciudades como respuesta tardía a la clausura de los altares locales por Josías, adonde antes huía el homicida, y otros sostienen que el asilo es antiguo y las listas reflejan ciudades reales de la monarquía. Los rabinos decían que los caminos a las ciudades se mantenían anchos y con la señal «Refugio» en cada encrucijada."
  pt:
    - "As seis cidades de refúgio estavam espalhadas por toda a terra, três de cada lado do Jordão, de modo que nenhuma parte dela ficava longe de uma. A oeste do rio ficavam Quedes, na Galileia, nas colinas de Naftali, Siquém, na região montanhosa de Efraim, e Hebrom, nas colinas de Judá; a leste, Golã, em Basã, Ramote, em Gileade, e Bezer, no planalto de Rúben. Quedes, a mais setentrional, fica a cerca de 180 km ao norte de Hebrom em linha reta, com Siquém entre elas, a 100 km de Quedes e 78 km de Hebrom; do outro lado do rio, Golã, Ramote e Bezer formam uma linha correspondente de norte a sul, e Bezer fica a cerca de 63 km a leste de Jerusalém. O mapa abre no capítulo de Josué que nomeia as seis."
    - "Eram refúgio para o homem que matara sem intenção: “para que o homicida que matar qualquer pessoa sem intenção possa fugir para lá”. A cidade o abrigava do vingador do sangue, o parente mais próximo do morto, “até que compareça perante a congregação para julgamento”; se a morte se provasse involuntária, ele vivia na cidade “até a morte do sumo sacerdote” e depois voltava para casa. À porta ele “declarará o seu caso aos ouvidos dos anciãos daquela cidade”. O Deuteronômio diz a Israel: “Você preparará o caminho, e dividirá o território da sua terra… em três partes”. Moisés separou as três orientais e Josué as três ocidentais; as seis estavam entre as quarenta e oito cidades dos levitas, e Hebrom foi dada aos filhos de Arão como “a cidade de refúgio para o homicida”. O assassino deliberado não tinha refúgio: “você o tirará até mesmo do meu altar, para que morra.”"
    - "Siquém é Tell Balata, na orla de Nablus, Hebrom o monte de Tel Rumeida, e Quedes o grande tell de Tel Kedesh, a oeste do vale de Hula; essas são certas. Ramote-Gileade é geralmente situada em Tell er-Rumeith, perto da fronteira da Jordânia com a Síria, embora se proponham outros sítios; Golã é procurada em Sahem el-Jolan, a leste do mar da Galileia, e Bezer, que Mesa de Moabe diz ter reconstruído, em Umm el-Amad, no planalto a leste do mar Morto, e ambas são conjeturas. Quando surgiu a lei é debatido: muitos críticos desde Wellhausen tomam as cidades como resposta posterior ao fechamento dos altares locais por Josias, onde o homicida antes se refugiava, enquanto outros tomam o asilo por antigo e as listas por reflexo de cidades reais da monarquia. Os rabinos diziam que as estradas para as cidades eram mantidas largas e marcadas com “Refúgio” em cada encruzilhada."
  de:
    - "Die sechs Freistädte lagen über das ganze Land verteilt, drei auf jeder Seite des Jordans, sodass kein Teil des Landes weit von einer entfernt war. Westlich des Flusses standen Kedesch in Galiläa im Bergland Naftali, Sichem im Bergland Ephraim und Hebron im Bergland Juda; östlich davon Golan in Baschan, Ramot in Gilead und Bezer auf der Hochebene Rubens. Kedesch, die nördlichste, liegt in der Luftlinie etwa 180 km nördlich von Hebron, dazwischen Sichem, etwa 100 km von Kedesch und 78 km von Hebron; jenseits des Flusses bilden Golan, Ramot und Bezer eine entsprechende Linie von Nord nach Süd, und Bezer liegt etwa 63 km östlich von Jerusalem. Die Karte öffnet sich auf dem Kapitel bei Josua, das alle sechs nennt."
    - "Sie waren Zuflucht für einen unabsichtlichen Totschläger: „wohin fliehe, wer einen Totschlag unversehens tut“. Die Stadt schützte ihn vor dem Bluträcher, dem nächsten Verwandten des Toten, „bis daß er vor der Gemeinde vor Gericht gestanden sei“; erwies sich die Tat als unbeabsichtigt, lebte er in der Stadt „bis an den Tod des Hohenpriesters“ und ging dann heim. Am Tor sollte er „vor den Ältesten der Stadt seine Sache ansagen“. Das Deuteronomium sagt zu Israel: „Und sollst den Weg dahin zurichten und das Gebiet deines Landes … in drei Kreise scheiden“. Mose sonderte die drei östlichen Städte aus und Josua die drei westlichen; alle sechs zählten zu den achtundvierzig Levitenstädten, und Hebron ging an die Söhne Aarons als „die Freistadt der Totschläger, Hebron“. Ein vorsätzlicher Mörder hatte keine Zuflucht: „so sollst du denselben von meinem Altar nehmen, daß man ihn töte.“"
    - "Sichem ist Tell Balata am Rand von Nablus, Hebron der Hügel Tel Rumeida und Kedesch der große Tel Kedesch westlich des Hulatals; das ist sicher. Ramot in Gilead wird meist bei Tell er-Rumeith nahe der jordanisch-syrischen Grenze angesetzt, doch andere Orte werden vorgeschlagen; Golan sucht man bei Sahem el-Dschaulan östlich des Sees Genezareth und Bezer, das nach eigener Angabe Mesa von Moab wiederaufbaute, bei Umm el-Amad östlich des Toten Meeres, beides Vermutungen. Wann das Gesetz entstand, ist umstritten: Viele Kritiker seit Wellhausen sehen die Städte als spätere Antwort auf Josias Schließung der örtlichen Altäre, wohin einst ein Totschläger geflohen war, andere halten das Asyl für alt und die Listen für Abbilder wirklicher Städte der Königszeit. Die Rabbinen sagten, die Wege zu den Städten seien breit gehalten und an jeder Kreuzung mit „Zuflucht“ gekennzeichnet gewesen."
  fr:
    - "Les six villes de refuge étaient réparties dans tout le pays, trois de chaque côté du Jourdain, si bien qu’aucune partie n’en était éloignée. À l’ouest du fleuve se trouvaient Kédesch en Galilée, dans les collines de Nephthali, Sichem dans la région montagneuse d’Éphraïm et Hébron dans les collines de Juda ; à l’est, Golan en Basan, Ramoth en Galaad et Betser sur le plateau de Ruben. Kédesch, la plus septentrionale, est à environ 180 km au nord d’Hébron à vol d’oiseau, Sichem se trouvant entre elles, à environ 100 km de Kédesch et à 78 km d’Hébron ; de l’autre côté du fleuve, Golan, Ramoth et Betser forment une ligne correspondante du nord au sud, et Betser est à environ 63 km à l’est de Jérusalem. La carte s’ouvre sur le chapitre de Josué qui nomme les six."
    - "Elles étaient un refuge pour l’homme qui avait tué sans intention : « où pourra s’enfuir le meurtrier qui aura tué quelqu’un involontairement ». La ville le gardait du vengeur du sang, proche parent du mort, « avant d’avoir comparu devant l’assemblée pour être jugé » ; si le meurtre était involontaire, il y demeurait « jusqu’à la mort du souverain sacrificateur », puis rentrait chez lui. À la porte, il devait « exposer son cas aux anciens de cette ville ». Le Deutéronome dit à Israël : « Tu établiras des routes, et tu diviseras en trois parties le territoire du pays ». Moïse mit à part les trois de l’est, Josué les trois de l’ouest ; les six étaient parmi les quarante-huit villes des lévites, Hébron étant donnée aux fils d’Aaron comme « la ville de refuge pour les meurtriers ». Le meurtrier volontaire n’avait pas de refuge : « tu l’arracheras même de mon autel, pour le faire mourir »."
    - "Sichem est Tell Balata, près de Naplouse, Hébron le tertre de Tel Rumeida, Kédesch le grand tell de Tel Kedesh, à l’ouest de la vallée de la Houla : c’est certain. Ramoth en Galaad se place d’ordinaire à Tell er-Rumeith, près de la frontière syrienne de la Jordanie, mais d’autres sites sont proposés ; Golan est cherchée à Sahem el-Jolan, à l’est de la mer de Galilée, et Betser, que Méscha de Moab dit avoir rebâtie, à Umm el-Amad, sur le plateau à l’est de la mer Morte : deux conjectures. L’origine de la loi est débattue : depuis Wellhausen, nombre de critiques y voient une réponse tardive à la fermeture des autels locaux par Josias, où le meurtrier s’était autrefois réfugié, d’autres tenant l’asile pour ancien et les listes pour le reflet de villes réelles de la monarchie. Les rabbins disaient que les routes restaient larges et marquées « Refuge » à chaque carrefour."
  pl:
    - "Sześć miast ucieczki rozmieszczono w całym kraju, po trzy po każdej stronie Jordanu, tak by żadna jego część nie była daleko od któregoś z nich. Na zachód od rzeki leżały Kedesz w Galilei w górach Neftalego, Sychem w krainie górskiej Efraima i Hebron we wzgórzach Judy; na wschód od niej Golan w Baszanie, Ramot w Gileadzie i Beser na płaskowyżu Rubena. Kedesz, najbardziej na północ wysunięte, leży około 180 km na północ od Hebronu w linii prostej, a Sychem między nimi, około 100 km od Kedesz i 78 km od Hebronu; za rzeką Golan, Ramot i Beser tworzą odpowiadającą linię z północy na południe, a Beser leży około 63 km na wschód od Jerozolimy. Mapa otwiera się na rozdziale Księgi Jozuego, który wymienia wszystkie sześć."
    - "Były schronieniem dla człowieka, który zabił bez zamiaru: „aby tam uciekał mężobójca, któryby zabił kogo z nieobaczenia”. Miasto chroniło go przed mścicielem krwi, najbliższym krewnym zabitego, „póki by nie stanął przed zgromadzeniem na sąd”; jeśli zabójstwo okazało się nieumyślne, mieszkał w mieście „aż do śmierci kapłana najwyższego”, a potem wracał do domu. U bramy, jak czytamy, „opowie starszym miasta onego sprawę swoję”. Księga Powtórzonego Prawa mówi Izraelowi: „Wyprostujesz sobie drogę, i rozdzielisz na trzy części granice ziemi twojej”. Mojżesz wydzielił trzy miasta wschodnie, a Jozue trzy zachodnie; wszystkie sześć należało do czterdziestu ośmiu miast Lewitów, a Hebron dano synom Aarona jako „miasto dla ucieczki mężobójcy”. Zabójca z premedytacją nie miał schronienia: „i od ołtarza mego weźmiesz go, aby umarł”."
    - "Sychem to Tell Balata na skraju Nablusu, Hebron to wzgórze Tel Rumeida, a Kedesz to duży tel Tel Kedesh na zachód od doliny Chula; to jest pewne. Ramot w Gileadzie umieszcza się zwykle w Tell er-Rumeith blisko jordańskiej granicy z Syrią, choć proponuje się inne miejsca; Golan szuka się w Sahem el-Jolan na wschód od Jeziora Galilejskiego, a Beser, który według Mesza z Moabu odbudował, w Umm el-Amad na płaskowyżu na wschód od Morza Martwego, i oba te są domysłami. Kiedy powstało prawo, jest dyskutowane: wielu krytyków od Wellhausena uważa miasta za późniejszą odpowiedź na zamknięcie lokalnych ołtarzy przez Jozjasza, gdzie niegdyś uciekał zabójca, inni zaś sądzą, że azyl jest stary, a listy odzwierciedlają prawdziwe miasta monarchii. Rabini mówili, że drogi do miast utrzymywano szerokie i oznaczano na każdym skrzyżowaniu napisem „Schronienie”."
  it:
    - "Le sei città di rifugio erano distribuite su tutto il paese, tre per ciascun lato del Giordano, così che nessuna parte di esso era lontana da una di esse. A ovest del fiume sorgevano Kedes in Galilea sulle colline di Neftali, Sichem nella regione collinare di Efraim ed Ebron sulle colline di Giuda; a est, Golan in Basan, Ramot in Galaad e Beser sull’altopiano di Ruben. Kedes, la più settentrionale, dista circa 180 km a nord di Ebron in linea d’aria, con Sichem in mezzo, a circa 100 km da Kedes e 78 km da Ebron; al di là del fiume Golan, Ramot e Beser formano una linea corrispondente da nord a sud, e Beser è a circa 63 km a est di Gerusalemme. La mappa si apre sul capitolo di Giosuè che nomina tutte e sei."
    - "Erano rifugio per chi aveva ucciso senza intenzione: «dove possa ricoverarsi l’omicida che avrà ucciso qualcuno involontariamente». La città lo proteggeva dal vendicatore del sangue, parente prossimo del morto, «prima d’esser comparso in giudizio dinanzi alla raunanza»; se l’uccisione risultava involontaria, egli viveva nella città «fino alla morte del sommo sacerdote» e poi tornava a casa. Alla porta egli «esporrà il suo caso agli anziani di quella città». Il Deuteronomio dice a Israele: «Preparerai delle strade, e dividerai in tre parti il territorio del paese». Mosè mise da parte le tre città orientali e Giosuè le tre occidentali; tutte e sei erano tra le quarantotto città dei Leviti, ed Ebron fu data ai figli di Aronne come «la città di rifugio per l’omicida». L’assassino volontario non aveva rifugio: «tu lo strapperai anche dal mio altare, per farlo morire»."
    - "Sichem è Tell Balata al margine di Nablus, Ebron il tell di Tel Rumeida, e Kedes il grande tell di Tel Kedesh a ovest della valle di Hula; sono certe. Ramot di Galaad è di solito collocata a Tell er-Rumeith presso il confine giordano con la Siria, benché siano proposti altri siti; Golan si cerca a Sahem el-Jolan a est del Lago di Tiberiade, e Beser, che Mesa di Moab dice di aver ricostruito, a Umm el-Amad sull’altopiano a est del Mar Morto, e queste due sono congetture. Quando sorse la legge è discusso: molti critici da Wellhausen in poi considerano le città come una risposta posteriore alla chiusura degli altari locali da parte di Giosia, dove un omicida un tempo si rifugiava, mentre altri ritengono antico l’asilo e le liste il riflesso di città reali della monarchia. I rabbini dicevano che le strade per le città erano larghe e segnate «Rifugio» a ogni incrocio."
  cs:
    - "Šest útočištných měst bylo rozloženo po celé zemi, po třech na každé straně Jordánu, aby žádná část nebyla od některého daleko. Západně od řeky stál Kedeš v Galileji v neftalíských horách, Šekem v horské zemi Efrajimově a Hebron v judských horách; východně od ní Golán v Bášanu, Rámot v Gileadu a Beser na náhorní rovině Rúbenově. Kedeš, nejsevernější, leží vzdušnou čarou asi 180 km severně od Hebronu, mezi nimi Šekem, asi 100 km od Kedeše a 78 km od Hebronu; za řekou tvoří Golán, Rámot a Beser odpovídající řadu od severu k jihu a Beser je asi 63 km východně od Jeruzaléma. Mapa se otevírá na kapitole Jozue, která jmenuje všech šest."
    - "Byla útočištěm pro člověka, který zabil bez úmyslu: „aby tam utekl ten, kterýž by někoho zabil z nedopatření“. Město ho chránilo před mstitelem krve, nejbližším příbuzným zabitého, „dokudž by se nepostavil před shromážděním k soudu“; ukázalo-li se, že zabití bylo neúmyslné, žil ve městě, „dokudž neumře kněz nejvyšší“, a pak se vrátil domů. U brány pak, jak se praví, „oznámí starším města toho při svou“. Deuteronomium říká Izraeli: „Spravíš sobě cesty, a rozdělíš na tři díly všecku krajinu země své“. Mojžíš vyčlenil tři východní města a Jozue tři západní; všech šest patřilo mezi čtyřicet osm měst Levitů a Hebron byl dán synům Áronovým jako „město útočišťné vražedlníku“. Úmyslný vrah útočiště neměl: „od oltáře mého odtrhneš jej, aby umřel.“"
    - "Šekem je Tell Balata na okraji Nábulusu, Hebron pahorek Tel Rumejda a Kedeš velký tell Tel Kedeš západně od údolí Chúla; to jsou jistá místa. Rámot v Gileadu se obvykle klade do Tell er-Rumejt u jordánsko-syrské hranice, ačkoli se navrhují i jiná místa; Golán se hledá v Sahem el-Džolán východně od Galilejského jezera a Beser, který podle Meši Moábského znovu vystavěl, v Umm el-Amad na náhorní rovině východně od Mrtvého moře, a oboje jsou dohady. Kdy zákon vznikl, je sporné: mnozí kritikové od Wellhausena berou tato města jako pozdější odpověď na Jošijášovo zrušení místních oltářů, kam kdysi zabiják utíkal, zatímco jiní soudí, že útočiště je staré a seznamy odrážejí skutečná města monarchie. Rabíni říkali, že cesty k městům byly udržovány široké a na každé křižovatce označeny „Útočiště“."
  nl:
    - "De zes vrijsteden lagen verspreid over het hele land, drie aan elke kant van de Jordaan, zodat geen enkel deel er ver van een verwijderd was. Ten westen van de rivier lagen Kedes in Galilea in het bergland van Naftali, Sichem in het bergland van Efraïm en Hebron in het bergland van Juda; ten oosten ervan Golan in Basan, Ramot in Gilead en Bezer op het plateau van Ruben. Kedes, het noordelijkste, ligt hemelsbreed ongeveer 180 km ten noorden van Hebron, met Sichem ertussen, ongeveer 100 km van Kedes en 78 km van Hebron; aan de overkant van de rivier vormen Golan, Ramot en Bezer een overeenkomstige lijn van noord naar zuid, en Bezer ligt ongeveer 63 km ten oosten van Jeruzalem. De kaart opent bij het hoofdstuk van Jozua dat alle zes noemt."
    - "Ze waren een toevlucht voor wie zonder opzet had gedood: “opdat de doodslager daarheen vliede, die een ziel onwetend geslagen heeft”. De stad beschermde hem tegen de bloedwreker, de naaste verwant van de dode, “totdat hij voor de vergadering aan het gericht gestaan hebbe”; bleek de doodslag onopzettelijk, dan woonde hij in de stad “tot den dood des hogepriesters” en ging daarna naar huis. Bij de poort moest hij “zijn woorden spreken voor de oren van de oudsten derzelver stad”. Deuteronomium: “Gij zult u den weg bereiden, en de pale uws lands… in drieen delen”. Mozes scheidde de drie oostelijke steden af, Jozua de westelijke; alle zes behoorden tot de achtenveertig levietensteden, en Hebron kwam aan de zonen van Aäron als “de vrijstad des doodslagers”. Een moedwillige moordenaar had geen toevlucht: “zo zult gij denzelven van voor Mijn altaar nemen, dat hij sterve.”"
    - "Sichem is Tell Balata aan de rand van Nabloes, Hebron de heuvel Tel Rumeida en Kedes de grote tell Tel Kedesh ten westen van de Hulavallei; deze zijn zeker. Ramot in Gilead wordt gewoonlijk geplaatst bij Tell er-Rumeith bij de Jordaanse grens met Syrië, hoewel andere plaatsen zijn voorgesteld; Golan wordt gezocht bij Sahem el-Jolan ten oosten van het Meer van Galilea en Bezer, dat volgens Mesa van Moab door hem werd herbouwd, bij Umm el-Amad op het plateau ten oosten van de Dode Zee, beide gissingen. Wanneer de wet ontstond, is omstreden: veel critici sinds Wellhausen zien de steden als een latere reactie op Josia's sluiting van de lokale altaren, waarheen een doodslager ooit vluchtte, anderen achten het asiel oud en de lijsten echt voor de monarchie. De rabbijnen zeiden dat de wegen naar de steden breed werden gehouden en bij elk kruispunt met “Toevlucht” gemarkeerd."
  sv:
    - "De sex fristäderna var spridda över hela landet, tre på var sida om Jordan, så att ingen del av det låg långt från någon. Väster om floden låg Kedesh i Galileen i Naftali bergsbygd, Shekem i Efraims bergsbygd och Hebron i Judas bergsbygd; öster om den Golan i Bashan, Ramot i Gilead och Beser på Rubens högslätt. Kedesh, den nordligaste, ligger omkring 180 km norr om Hebron i fågelvägen, med Shekem emellan, omkring 100 km från Kedesh och 78 km från Hebron; på andra sidan floden bildar Golan, Ramot och Beser en motsvarande linje från norr till söder, och Beser ligger omkring 63 km öster om Jerusalem. Kartan öppnas vid kapitlet i Josua som nämner alla sex."
    - "De var en tillflykt för den som dödat utan uppsåt: städer ”till vilka en dråpare som ouppsåtligen har dödat någon må kunna fly”. Staden skyddade honom mot blodshämnaren, den dödes närmaste frände, ”förrän han har stått till rätta inför menigheten”; om dråpet var oavsiktligt, bodde han i staden ”till dess … översteprästen dör” och gick sedan hem. Vid porten skulle han ”omtala sin sak för de äldste i den staden”. Femte Moseboken säger: ”Du skall försätta vägarna till dem i gott skick åt dig; och du skall dela i tre delar det landområde som HERREN, din Gud, giver dig till arvedel.” Mose avskilde de tre östra och Josua de tre västra; alla sex ingick i leviternas fyrtioåtta städer, och Hebron gavs åt Arons söner som ”dråparfristaden Hebron med dess utmarker”. Ingen uppsåtlig mördare fick skydd: ”så skall du gripa honom, vore han ock invid mitt altare, och han måste dö.”"
    - "Shekem är Tell Balata i utkanten av Nablus, Hebron kullen Tel Rumeida och Kedesh den stora kullen Tel Kedesh väster om Hulaslätten; dessa är säkra. Ramot-Gilead förläggs vanligen till Tell er-Rumeith nära den jordanska gränsen mot Syrien, fastän andra platser föreslås; Golan söks vid Sahem el-Jolan öster om Galileiska sjön, och Beser, som Mesha av Moab säger sig ha byggt upp, vid Umm el-Amad på platån öster om Döda havet, och båda dessa är gissningar. När lagen uppstod är omdiskuterat: många kritiker sedan Wellhausen tar städerna som ett senare svar på Josias stängning av de lokala altarna, där en dråpare förr hade flytt, medan andra menar att asylrätten är gammal och att listorna speglar verkliga städer under monarkin. Rabbinerna sade att vägarna till städerna hölls breda och vid varje korsning märktes ”Tillflykt”."
  nb:
    - "De seks tilfluktsbyene var spredt over hele landet, tre på hver side av Jordan, slik at ingen del av det lå langt fra en. Vest for elven lå Kedesj i Galilea i Naftali-fjellene, Sikem i Efraims fjellland og Hebron i Judas fjell; øst for den lå Golan i Basan, Ramot i Gilead og Beser på Rubens høyslette. Kedesj, den nordligste, ligger omtrent 180 km nord for Hebron i luftlinje, med Sikem mellom dem, omtrent 100 km fra Kedesj og 78 km fra Hebron; på den andre siden av elven danner Golan, Ramot og Beser en tilsvarende linje fra nord til sør, og Beser ligger omtrent 63 km øst for Jerusalem. Kartet åpner på kapitlet i Josva som nevner alle seks."
    - "De var et tilfluktssted for en mann som hadde drept uten forsett: «forat en manndraper som av vanvare slår nogen ihjel, kan fly dit». Byen vernet ham mot blodhevneren, den drepte manns nærmeste slektning, «før han har stått til doms for menigheten»; hvis drapet viste seg å være utilsiktet, bodde han i byen «til ypperstepresten er død» og dro så hjem. Ved porten skulle han «legge sin sak frem for de eldste i byen». Femte Mosebok sier til Israel: «Du skal gjøre veien til dem i stand og skifte hele det land som Herren din Gud gir dig til arv, i tre deler». Moses utskilte de tre østlige byene og Josva de tre vestlige; alle seks var blant levittenes åtte og førti byer, og Hebron ble gitt til Arons sønner, «som var tilfluktsstad for manndrapere». En overlagt morder hadde intet tilfluktssted: «da skal du ta ham om det så var fra mitt alter: han skal dø.»"
    - "Sikem er Tell Balata ved kanten av Nablus, Hebron haugen Tel Rumeida, og Kedesj den store tellen Tel Kedesh vest for Hula-dalen; disse er sikre. Ramot-Gilead plasseres vanligvis ved Tell er-Rumeith nær den jordanske grensen mot Syria, selv om andre steder er foreslått; Golan søkes ved Sahem el-Jolan øst for Galileasjøen, og Beser, som Mesa av Moab sier at han gjenoppbygde, ved Umm el-Amad på høysletten øst for Dødehavet, og begge disse er gjetninger. Når loven oppsto, er omdiskutert: mange kritikere siden Wellhausen tar byene som et senere svar på Josjias nedleggelse av de lokale alterne, hvor en drapsmann tidligere kunne flykte, mens andre mener at asylet er gammelt og at listene gjenspeiler virkelige byer fra kongetiden. Rabbinerne sa at veiene til byene ble holdt brede og merket «Tilflukt» ved hvert veikryss."
  tl:
    - "Ang anim na bayang ampunan ay nakalatag sa buong lupain, tatlo sa bawat panig ng Jordan, upang walang bahagi nito na malayo sa isa. Sa kanluran ng ilog ay ang Cedes sa Galilea sa mga burol ng Nephtali, ang Sichem sa maburol na lupain ng Ephraim at ang Hebron sa mga burol ng Juda; sa silangan nito, ang Golan sa Basan, ang Ramoth sa Galaad at ang Beser sa talampas ng Ruben. Ang Cedes, ang pinakahilaga, ay mga 180 km sa hilaga ng Hebron sa tuwid na guhit, na ang Sichem ay nasa pagitan nila, mga 100 km mula sa Cedes at 78 km mula sa Hebron; sa kabila ng ilog, ang Golan, Ramoth at Beser ay bumubuo ng katumbas na guhit mula hilaga hanggang timog, at ang Beser ay mga 63 km sa silangan ng Jerusalem. Bumubukas ang mapa sa kabanata ng Josue na nagpapangalan sa anim."
    - "Kanlungan ang mga ito para sa taong pumatay nang walang balak: “Upang matakasan ng nakamatay, na nakapatay sa sinoman na hindi sinasadya at hindi kusa”. Iniingatan siya ng bayan laban sa manghihiganti sa dugo, kamag-anak ng namatay, “hanggang sa maitayo sa kapisanan na hatulan”; kung hindi sinadya, nakatira siya roon “hanggang sa pagkamatay ng dakilang saserdote” at saka umuuwi. Sa pintuan, “magsasaysay sa mga pakinig ng mga matanda sa bayang yaon”. Ayon sa Deuteronomio: “Ikaw ay maghahanda sa iyo ng daan, at pagtatluhin mong bahagi ang mga hangganan ng iyong lupain”. Itinalaga ni Moises ang tatlong silangan at ni Josue ang tatlong kanluran; kabilang ang anim sa 48 bayan ng mga Levita, at ang Hebron ay sa mga anak ni Aaron, “ang bayang ampunan na ukol sa nakamatay”. Walang kanlungan ang sadyang pumatay: “alisin mo siya sa aking dambana, upang patayin.”"
    - "Ang Sichem ay Tell Balata sa gilid ng Nablus, ang Hebron ay Tel Rumeida, at ang Cedes ay Tel Kedesh sa kanluran ng lambak ng Hula; tiyak ang mga ito. Ang Ramoth-galaad ay karaniwang Tell er-Rumeith malapit sa hangganan ng Jordan at Siria, bagaman may iba pang mungkahi; ang Golan ay hinahanap sa Sahem el-Jolan sa silangan ng Dagat ng Galilea, at ang Beser, na sabi ni Mesa ng Moab ay muli niyang itinayo, sa Umm el-Amad sa silangan ng Dagat na Patay; hula ang dalawa. Pinagtatalunan kung kailan lumitaw ang batas: maraming kritiko mula kay Wellhausen ang nagsasabing kalaunang sagot ito sa pagsasara ni Josias sa mga lokal na dambana, na dating kanlungan ng mamamatay-tao, ngunit para sa iba, matanda ang asilo at totoong bayan ng monarkiya ang nasa mga talaan. Sabi ng mga rabbi, malapad ang mga daan patungo sa mga bayan at may marka na “Ampunan” sa bawat sangandaan."
  da:
    - "De seks tilflugtsbyer var spredt over hele landet, tre på hver side af Jordan, så ingen del af det lå langt fra én. Vest for floden lå Kedesj i Galilæa i Naftalis bjerge, Sikem i Efraims bjerge og Hebron i Judas bjerge; øst for den Golan i Basan, Ramot i Gilead og Beser på Rubens højslette. Kedesj, den nordligste, ligger ca. 180 km nord for Hebron i fugleflugt, med Sikem imellem, ca. 100 km fra Kedesj og 78 km fra Hebron; på den anden side af floden danner Golan, Ramot og Beser en tilsvarende linje fra nord til syd, og Beser ligger ca. 63 km øst for Jerusalem. Kortet åbner på Josvas kapitel, der nævner alle seks."
    - "De var en tilflugt for en mand, der havde dræbt uden forsæt: »at en Manddraber, som slaar en Person ihjel af en Forseelse, kan fly derhen«. Byen beskyttede ham mod blodhævneren, den dræbtes nærmeste slægtning, »førend han har staaet for Menighedens Ansigt, for Dommen«; viste drabet sig utilsigtet, boede han i byen »indtil Ypperstepræsten … dør« og vendte så hjem. Ved porten skulle han »tale sine Ord for de Ældstes Øren af samme Stad«. Femte Mosebog siger til Israel: »Du skal berede dig Vej til dem, og i tre Dele skal du dele dit Landemærke«. Moses udskilte de tre østlige byer og Josva de tre vestlige; alle seks var blandt leviternes otteogfyrre byer, og Hebron blev givet til Arons sønner som »Tilflugtsstaden for Manddrabere«. En forsætlig morder havde ingen tilflugt: »da skal du tage ham endog fra mit Alter til at dø.«"
    - "Sikem er Tell Balata ved udkanten af Nablus, Hebron tellen Tel Rumeida og Kedesj den store tell Tel Kedesh vest for Hula-dalen; disse er sikre. Ramot i Gilead placeres sædvanligvis ved Tell er-Rumeith nær den jordanske grænse til Syrien, selv om andre steder foreslås; Golan søges ved Sahem el-Jolan øst for Genesaret Sø, og Beser, som Mesja af Moab siger, han genopbyggede, ved Umm el-Amad på højsletten øst for Det Døde Hav, og begge disse er gæt. Hvornår loven opstod, er omdiskuteret: Mange kritikere siden Wellhausen tager byerne som et senere svar på Josias’ lukning af de lokale altre, hvor en drabsmand engang havde søgt tilflugt, mens andre holder asylretten for gammel og listerne for at afspejle virkelige byer fra kongetiden. Rabbinerne sagde, at vejene til byerne blev holdt brede og ved hvert vejkryds mærket »Tilflugt«."
  sr:
    - "Шест градова уточишта било је распоређено по целој земљи, по три са сваке стране Јордана, тако да ниједан њен део није био далеко од неког. Западно од реке стајали су Кедес у Галилеји у брдима Нефталимовим, Сихем у горју Јефремовом и Хеврон у брдима Јудиним; источно од ње, Голан у Васану, Рамот Галадски у Галаду и Восор на висоравни Рувимовој. Кедес, најсевернији, лежи око 180 км северно од Хеврона ваздушном линијом, са Сихемом између њих, око 100 км од Кедеса и 78 км од Хеврона; преко реке Голан, Рамот и Восор чине одговарајућу линију од севера ка југу, а Восор је око 63 км источно од Јерусалима. Карта се отвара на поглављу Књиге о Исусу Навину које именује свих шест."
    - "Били су уточиште човеку који је убио ненамерно: „да у њих утече крвник који убије кога нехотице“. Град га је штитио од осветника крви, најближег сродника погинулог, „докле не стане на суд пред збор“; ако се убиство покаже ненамерним, живео је у граду „докле не умре поглавар свештенички“ и затим се враћао кући. На капији је требало да „каже старешинама оног града ствар своју“. Поновљени закон говори Израелу: „начини пут, и раздели на троје крајеве земље своје“. Мојсије је издвојио три источна града, а Исус Навин три западна; свих шест било је међу четрдесет осам градова Левита, а Хеврон је дат синовима Арона као „град за уточиште крвнику“. Намерни убица није имао уточишта: „одвуци га и од олтара мог да се погуби.“"
    - "Сихем је Тел Балата на ободу Набулуса, Хеврон хумка Тел Румеида, а Кедес велика хумка Тел Кедес западно од долине Хуле; то је сигурно. Рамот Галадски обично се смешта у Тел ер-Румејт близу јорданске границе са Сиријом, мада се предлажу и друга места; Голан се тражи у Сахем ел-Џолану источно од Галилејског мора, а Восор, који Миса Моавски каже да је обновио, у Ум ел-Амаду на висоравни источно од Мртвог мора, и оба су нагађања. Када је закон настао, спорно је: многи критичари од Велхаузена узимају градове као каснији одговор на Јосијино затварање месних олтара, где је убица некад бежао, док други држе да је уточиште старо и да спискови одражавају стварне градове монархије. Рабини су говорили да су путеви до градова држани широки и да је на сваком раскршћу писало „Уточиште“."
  hu:
    - "A hat menedékváros az egész országban szétszórva feküdt, a Jordán mindkét oldalán három, hogy az ország egyik része se legyen messze egytől sem. A folyótól nyugatra állt Kedes Galileában Naftáli hegyén, Sikem Efraim hegyvidékén és Hebron Júda hegyein; tőle keletre Gólán Básánban, Rámót Gileádban és Bécer Rúben fennsíkján. Kedes, a legészakibb, Hebrontól légvonalban mintegy 180 km-re északra fekszik, köztük Sikem, Kedestől mintegy 100 km-re és Hebrontól 78 km-re; a folyón túl Gólán, Rámót és Bécer megfelelő vonalat alkot északról délre, Bécer pedig Jeruzsálemtől mintegy 63 km-re keletre van. A térkép Józsué könyvének azon fejezetére nyílik, amely mind a hatot megnevezi."
    - "Menedék volt annak, aki szándék nélkül ölt: „hogy oda szaladjon a gyilkos, a ki történetből öl meg valakit”. A város védte a vérbosszulótól, a megölt legközelebbi rokonától, „míg ítéletre nem áll a gyülekezet elé”; ha a gyilkosság szándékolatlannak bizonyult, a városban lakott „a főpap haláláig”, azután hazatért. A kapuban „beszélje el az ő dolgait a város véneinek hallatára”. A Mózes ötödik könyve ezt mondja Izráelnek: „Készítsd meg magadnak az utat azokhoz, és oszszad három részre a te országod határát”. Mózes kijelölte a három keleti várost, Józsué a három nyugatit; mind a hat a léviták negyvennyolc városa közé tartozott, Hebront pedig Áron fiainak adták, „a gyilkosok menekülésének városát”. A szándékos gyilkosnak nem volt menedéke: „oltáromtól is elvidd azt a halálra.”"
    - "Sikem a Nablus szélén lévő Tell Balata, Hebron a Tel Rumeida halma, Kedes pedig a Hula-völgytől nyugatra fekvő nagy Tel Kedes; ezek biztosak. Rámót-Gileádot általában a szíriai határ közelében, a jordániai oldalon fekvő Tell er-Rumeithnél keresik, bár más helyeket is javasolnak; Gólánt a Galileai-tengertől keletre fekvő Sahem el-Jolannál, Bécert, amelyet a moábi Mésa állítása szerint újjáépített, a Holt-tengertől keletre fekvő fennsíkon az Umm el-Amadnál, és ez a kettő találgatás. Hogy mikor keletkezett a törvény, vitatott: sok bíráló Wellhausen óta a városokat Jósiás helyi oltárok bezárására adott későbbi válasznak tartja, ahová a gyilkos egykor menekült, mások szerint a menedékjog régi, és a jegyzékek a monarchia valódi városait tükrözik. A rabbik szerint a városokhoz vezető utakat szélesen tartották, és minden keresztútnál „Menedék” jelzéssel látták el."
  fi:
    - "Kuusi turvakaupunkia oli sijoitettu koko maahan, kolme kummallekin puolelle Jordania, jotta mikään osa sitä ei ollut kaukana yhdestäkään. Joen länsipuolella olivat Kedes Galileassa Naftalin kukkuloilla, Sikem Efraimin vuoristossa ja Hebron Juudan kukkuloilla; sen itäpuolella Golan Basanissa, Ramot Gileadissa ja Beser Ruubenin ylätasangolla. Pohjoisin, Kedes, on linnuntietä noin 180 km Hebronista pohjoiseen, ja Sikem niiden välissä on noin 100 km Kedeksestä ja 78 km Hebronista; joen toisella puolella Golan, Ramot ja Beser muodostavat vastaavan jonon pohjoisesta etelään, ja Beser on noin 63 km Jerusalemista itään. Kartta avautuu Joosuan kirjan lukuun, joka nimeää kaikki kuusi."
    - "Ne suojasivat miestä, joka oli tappanut tahtomattaan: ”Niihin paetkoon tappaja, joka tapaturmaisesti on jonkun surmannut.” Kaupunki suojasi häntä verenkostajalta, kuolleen lähimmältä omaiselta, ”ennenkuin hän on ollut seurakunnan tuomittavana”; jos teko oli tahaton, hän asui kaupungissa ”ylimmäisen papin kuolemaan asti” ja palasi sitten kotiin. Portilla säädettiin: ”kertokoon asiansa sen kaupungin vanhimmille”. 5. Mooseksen kirja sanoo Israelille: ”Mittaa matkat ja jaa kolmeen osaan sen maan alue, jonka Herra, sinun Jumalasi, antaa sinulle perinnöksi”. Mooses erotti kolme itäistä kaupunkia ja Joosua kolme läntistä; kaikki kuusi kuuluivat leeviläisten 48 kaupunkiin, ja Hebron annettiin Aaronin jälkeläisille: ”tappajan turvakaupunki Hebron”. Tahallisella murhaajalla ei ollut turvaa: ”on sinun otettava hänet minun alttarinikin luota surmattavaksi.”"
    - "Sikem on Tell Balata Nablusin reunalla, Hebron Tel Rumeidan kumpu ja Kedes Tel Kedeksen suuri kumpu Hulan laakson länsipuolella; nämä ovat varmoja. Ramot-Gilead sijoitetaan yleensä Tell er-Rumeithiin Jordanian ja Syyrian rajan lähellä, vaikka muitakin paikkoja ehdotetaan; Golania etsitään Sahem el-Jolanista Galileanjärven itäpuolelta ja Beseria, jonka Moabin Mesa sanoo rakentaneensa uudelleen, Umm el-Amadista Kuolleenmeren itäpuolella; nämä kaksi ovat arvauksia. Lain ajoituksesta kiistellään: monet kriitikot Wellhausenista lähtien pitävät kaupunkeja myöhäisenä vastauksena Josian paikallisten alttarien sulkemiseen, joihin tappaja oli ennen paennut, toiset katsovat turvapaikan vanhaksi ja luetteloiden heijastavan kuningaskunnan ajan todellisia kaupunkeja. Rabbit sanoivat teiden turvakaupunkeihin pidetyn leveinä ja merkityn ”Turva” jokaisessa risteyksessä."
  vi:
    - "Sáu thành ẩn náu được rải khắp xứ, ba thành mỗi bên sông Giô-đanh, để không nơi nào xa một thành. Phía tây sông có Kê-đe ở Ga-li-lê trong vùng đồi Nép-ta-li, Si-chem trong vùng đồi Ép-ra-im và Hếp-rôn trong vùng đồi Giu-đa; phía đông, Gô-lan ở Ba-san, Ra-mốt ở Ga-la-át và Bết-se trên cao nguyên Ru-bên. Kê-đe, ở cực bắc, cách Hếp-rôn khoảng 180 km về phía bắc theo đường thẳng, với Si-chem ở giữa, cách Kê-đe khoảng 100 km và cách Hếp-rôn 78 km; bên kia sông, Gô-lan, Ra-mốt và Bết-se tạo thành một đường tương ứng từ bắc xuống nam, và Bết-se cách Giê-ru-sa-lem khoảng 63 km về phía đông. Bản đồ mở ra trên chương sách Giô-suê nêu tên cả sáu."
    - "Đó là nơi ẩn náu cho người đã giết người không cố ý: “kẻ sát nhân, vì vô ý đánh chết ai, chạy ẩn náu mình được”. Thành che chở người ấy khỏi kẻ báo thù huyết, thân nhân gần nhất của người chết, “cho đến chừng nào ứng hầu trước mặt hội chúng đặng chịu xét đoán”; nếu việc giết người được chứng minh là vô ý, người ở trong thành “cho đến chừng nào thầy tế lễ thượng phẩm đã được xức dầu thánh qua đời” rồi về nhà. Ở cổng thành, người phải “thuật sự tình cho các trưởng lão của thành ấy nghe”. Sách Phục truyền dặn: “Ngươi phải dọn đường, chia ra làm ba phần địa phận của xứ”. Môi-se biệt riêng ba thành phía đông và Giô-suê ba thành phía tây; cả sáu nằm trong bốn mươi tám thành của người Lê-vi, và Hếp-rôn được cấp cho con cháu A-rôn “là thành ẩn náu cho kẻ sát nhân”. Kẻ cố ý giết người không có nơi ẩn náu: “dẫu rằng nó núp nơi bàn thờ ta, ngươi cũng bắt mà giết đi.”"
    - "Si-chem là Tell Balata ở rìa Nablus, Hếp-rôn là gò Tel Rumeida, và Kê-đe là gò lớn Tel Kedesh phía tây thung lũng Hula; những nơi này chắc chắn. Ra-mốt Ga-la-át thường được đặt ở Tell er-Rumeith gần biên giới Jordan với Syria, dù các địa điểm khác cũng được đề xuất; Gô-lan được tìm ở Sahem el-Jolan phía đông Biển Ga-li-lê, và Bết-se, mà Mê-sa của Mô-áp nói ông đã xây lại, ở Umm el-Amad trên cao nguyên phía đông Biển Chết, và cả hai nơi này đều là phỏng đoán. Luật ra đời khi nào còn tranh luận: nhiều nhà phê bình từ Wellhausen coi các thành là câu trả lời về sau cho việc Giô-si-a đóng các bàn thờ địa phương, nơi một kẻ giết người từng chạy đến, trong khi người khác cho rằng quyền ẩn náu là cổ và các danh sách phản ánh những thị trấn có thật của thời quân chủ. Các ra-bi nói các con đường đến các thành được giữ rộng và đánh dấu “Ẩn náu” ở mọi ngã tư."
  ro:
    - "Cele șase cetăți de scăpare erau răspândite în toată țara, câte trei de fiecare parte a Iordanului, astfel încât nicio parte a ei să nu fie departe de una. La vest de râu erau Chedeșul din Galileea, în dealurile lui Neftali, Sihemul în ținutul deluros al lui Efraim și Hebronul în dealurile lui Iuda; la est de el, Golan în Basan, Ramot în Galaad și Bețer pe podișul lui Ruben. Chedeșul, cel mai nordic, se află la circa 180 km nord de Hebron în linie dreaptă, cu Sihemul între ele, la circa 100 km de Chedeș și la 78 km de Hebron; dincolo de râu, Golan, Ramot și Bețer formează o linie corespunzătoare de la nord la sud, iar Bețer se află la circa 63 km est de Ierusalim. Harta se deschide la capitolul din Iosua care le numește pe toate șase."
    - "Erau un adăpost pentru omul care ucisese fără voie: ca ucigașul să poată fugi acolo, cel care omoară o persoană pe nepusă masă. Cetatea îl adăpostea de răzbunătorul sângelui, cea mai apropiată rudă a celui mort, „până când va sta înaintea adunării la judecată”; dacă uciderea se dovedea neintenționată, el locuia în cetate „până ce va murì preotul cel mare” și apoi se întorcea acasă. La poartă trebuia să-și spună pricina în auzul bătrânilor cetății. Deuteronomul îi spune lui Israel: „Socotește-ți calea și împarte în trei părți hotarele pământului tău”. Moise le-a pus deoparte pe cele trei din est, iar Iosua pe cele trei din vest; toate șase se numărau printre cele patruzeci și opt de cetăți ale leviților, iar Hebronul a fost dat fiilor lui Aaron drept cetate de scăpare pentru ucigaș. Ucigașul cu voie nu avea scăpare: „dela altarul meu să-l iei să-l omori.”"
    - "Sihemul este Tell Balata, la marginea Nablusului, Hebronul movila Tel Rumeida, iar Chedeșul marele tell Tel Kedesh, la vest de valea Hula; acestea sunt sigure. Ramot din Galaad este plasat de obicei la Tell er-Rumeith, lângă granița iordaniană cu Siria, deși se propun și alte locuri; Golan este căutat la Sahem el-Jolan, la est de Marea Galileii, iar Bețer, pe care Meșa al Moabului spune că l-a reconstruit, la Umm el-Amad, pe podișul de la est de Marea Moartă, și ambele sunt presupuneri. Când a apărut legea este disputat: mulți critici de la Wellhausen socot cetățile un răspuns mai târziu la închiderea altarelor locale de către Iosia, unde fugise cândva ucigașul, în timp ce alții susțin că dreptul de azil este vechi și că listele reflectă orașe reale ale monarhiei. Rabinii spuneau că drumurile spre cetăți erau largi și însemnate cu „Scăpare” la fiecare răscruce."
  bg:
    - "Шестте града-убежища бяха разпръснати из цялата земя, по три от двете страни на Йордан, така че никоя част от нея да не е далеч от някой от тях. Западно от реката стояха Кедес в Галилея в Нефталимовите планини, Сихем в планинската страна на Ефрем и Хеврон в Юдейските планини; източно от нея — Голан във Васан, Рамот в Галаад и Бецер на платото на Рувим. Кедес, най-северният, е на около 180 км северно от Хеврон по права линия, а между тях е Сихем — на около 100 км от Кедес и на 78 км от Хеврон; отвъд реката Голан, Рамот и Бецер образуват съответна линия от север на юг, а Бецер е на около 63 км източно от Йерусалим. Картата се отваря на главата от книга Иисус Навин, която назовава и шестте."
    - "Те бяха убежище за човек, убил без умисъл: „за да може да побегне там убийцата който убие человека по погрешка“. Градът го пазеше от отмъстителя за кръвта, най-близкия роднина на убития, „доде се представи на съд пред събранието“; ако убийството се окажеше неумишлено, той живееше в града „до смъртта на великия свещеник“ и после се връщаше у дома. При портата той трябваше да „си каже работата в слушане на старейшините от онзи град“. Второзаконие казва: „Да си приготвиш пътя; и да разделиш на три части пределите на земята си“. Мойсей отдели трите източни града, Иисус Навин — трите западни; и шестте бяха сред 48-те левитски града, а Хеврон беше даден на синовете на Аарон като „града на прибежище на убийца“. Умишленият убиец нямаше убежище: „и из олтаря ми ще го извадиш за да се умъртви.“"
    - "Сихем е Тел Балата в края на Наблус, Хеврон — хълмът Тел Румейда, Кедес — големият Тел Кедеш западно от долината Хула; те са сигурни. Рамот Галаадски обикновено се поставя при Тел ер-Румейт близо до границата на Йордания със Сирия, макар да се предлагат и други места; Голан се търси при Сахем ел-Джолан източно от Галилейско езеро, а Бецер, който Меша Моавски казва, че е възстановил, — при Ум ел-Амад на платото източно от Мъртво море; и двете са догадки. Кога е възникнал законът, е спорно: много критици след Велхаузен виждат в градовете по-късен отговор на закриването на местните олтари от Йосия, където убиецът преди е намирал убежище, а други смятат убежището за старо, а списъците — за отражение на истински градове от царската епоха. Равините казват, че пътищата към градовете били широки и на всеки кръстопът имало надпис „Убежище“."
