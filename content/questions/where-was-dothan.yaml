id: where-was-dothan
question:
  en: "Where was Dothan, where Joseph was sold?"
  ru: "Где находился Дофан, где продали Иосифа?"
  uk: "Де був Дофан, де продали Йосипа?"
  es: "¿Dónde estaba Dotán, donde fue vendido José?"
  pt: "Onde ficava Dotã, onde José foi vendido?"
  de: "Wo lag Dotan, wo Josef verkauft wurde?"
  fr: "Où se trouvait Dothan, où Joseph fut vendu ?"
answer:
  en:
    - "Dothan was Tell Dothan, a large mound south-west of Jenin in the northern West Bank, in a broad valley on the road between the coastal plain and the valley of Jezreel. The map's point stands on it, about 23 km north of Shechem, 16 km north of Samaria and 71 km north of Jerusalem in a straight line. The name has survived at the mound, and the identification is not seriously disputed. History Globe has an article on Dothan; this answer keeps to where it was and why the stories happen there."
    - "Jacob sent Joseph “out of the vale of Hebron, and he came to Shechem”, about 78 km in a straight line; his brothers had moved on, and a man told him, “I heard them say, Let us go to Dothan. And Joseph went after his brethren, and found them in Dothan.” From Hebron that is about 100 km. While they ate, “a company of Ishmeelites came from Gilead with their camels bearing spicery and balm and myrrh, going to carry it down to Egypt”: the caravan road from the Jordan crossings to the coast ran through this valley, which is why a buyer for Joseph passed by. The map places the story at its conventional year of 1700 BC; the age of the patriarchs is disputed."
    - "Dothan is named once more, in the days of Elisha. The king of Syria heard “he is in Dothan” and sent “horses, and chariots, and a great host: and they came by night, and compassed the city about”; Elisha's servant saw that “the mountain was full of horses and chariots of fire round about Elisha”, and Elisha led the blinded Syrians to Samaria, 16 km to the south. Joseph P. Free excavated the mound from 1953 to 1964 and found towns from the Early Bronze Age to the Iron Age; Eusebius knew Dothaim about twelve miles north of Sebaste, the old Samaria."
  ru:
    - "Дофан — это Телль-Дотан, большой холм к юго-западу от Дженина на севере Западного берега, в широкой долине на дороге между прибрежной равниной и Изреельской долиной. Точка карты стоит на нём, примерно в 23 км к северу от Сихема, в 16 км к северу от Самарии и в 71 км к северу от Иерусалима по прямой. Имя сохранилось у холма, и отождествление серьёзно не оспаривается. В History Globe есть статья о Дофане; здесь ответ о том, где он был и почему рассказы происходят именно там."
    - "Иаков послал Иосифа «из долины Хевронской; и он пришел в Сихем» — примерно 78 км по прямой; братья ушли дальше, и встречный сказал ему: «я слышал, как они говорили: пойдем в Дофан. И пошел Иосиф за братьями своими и нашел их в Дофане». От Хеврона это около 100 км. Пока они ели, «идет из Галаада караван Измаильтян, и верблюды их несут стираксу, бальзам и ладан: идут они отвезти это в Египет»: караванная дорога от переправ через Иордан к морю шла этой долиной, поэтому покупатель для Иосифа и оказался рядом. Карта ставит рассказ в условный 1700 г. до н. э.; время патриархов спорно."
    - "Дофан назван ещё раз, во дни Елисея. Царь Сирийский услышал: «вот, он в Дофаиме» — и послал «коней и колесницы и много войска. И пришли ночью и окружили город»; слуга Елисея увидел, что «вся гора наполнена конями и колесницами огненными кругом Елисея», а Елисей отвёл ослеплённых сирийцев в Самарию, в 16 км к югу. Джозеф П. Фри раскапывал холм с 1953 по 1964 год и нашёл поселения от раннего бронзового века до железного; Евсевий знал Дофаим примерно в двенадцати милях к северу от Севасты, древней Самарии."
  uk:
    - "Дофан — це Тель-Дофан, великий пагорб на південний захід від Дженіна на півночі Західного берега, у широкій долині на дорозі між прибережною рівниною та Ізреельською долиною. Точка мапи стоїть на ньому, приблизно за 23 км на північ від Сихему, 16 км на північ від Самарії і 71 км на північ від Єрусалиму по прямій. Назва збереглася на пагорбі, і ототожнення серйозно не оскаржується. History Globe має статтю про Дофан; ця відповідь тримається того, де він був і чому історії відбуваються саме там."
    - "Яків послав Йосипа «з Геброн долини, і прийшов у Сихем», приблизно 78 км по прямій; брати вже пішли далі, і чоловік сказав йому: «чув бо, як мовляли: Поженимось у Дотан. І пійшов Йосиф слїдом за браттєм своїм, і зустьрів їх у Дотанї». Від Хеврона це приблизно 100 км. Поки вони їли, «ідуть подорожні Ізмайлитяне від Галааду з верблюдами своїми, везучи бурштин, бальзам та ладан в Египет»: караванна дорога від йорданських переправ до узбережжя проходила крізь цю долину, тому покупець для Йосипа й опинився поруч. Мапа відносить історію до умовного 1700 р. до н. е.; час патріархів спірний."
    - "Дофан названий ще раз, за днів Єлисея. Цар Сирії почув: «Він у Дотаїмі» — і послав «конї й колесницї й потужню купу військову. Пійшли вони в ночі та й обняли город»; слуга Єлисея побачив, що «гора навкруги Елисея була заповнена кіньми й поломяними колесницями», а Єлисей повів осліплених сирійців до Самарії, за 16 км на південь. Джозеф П. Фрі розкопував пагорб з 1953 до 1964 р. і знайшов міста від ранньої бронзової до залізної доби; Євсевій знав Дотаїм приблизно за дванадцять миль на північ від Севасте, давньої Самарії."
  es:
    - "Dotán era Tell Dotán, un gran tell al suroeste de Yenín, en el norte de Cisjordania, en un amplio valle en el camino entre la llanura costera y el valle de Jezreel. El punto del mapa está sobre él, a unos 23 km al norte de Siquem, 16 km al norte de Samaria y 71 km al norte de Jerusalén en línea recta. El nombre ha sobrevivido en el tell, y la identificación no se discute seriamente. History Globe tiene un artículo sobre Dotán; esta respuesta se limita a dónde estaba y por qué los relatos ocurren allí."
    - "Jacob envió a José desde «el valle de Hebrón, y llegó á Sichêm», a unos 78 km en línea recta; sus hermanos se habían ido más lejos, y un hombre le dijo: «yo les oí decir: Vamos á Dothán. Entonces José fué tras de sus hermanos, y hallólos en Dothán». Desde Hebrón son unos 100 km. Mientras comían, «una compañía de Ismaelitas que venía de Galaad, y sus camellos traían aromas y bálsamo y mirra, é iban á llevarlo á Egipto»: el camino de caravanas desde los pasos del Jordán hasta la costa atravesaba este valle, por lo cual pasó un comprador para José. El mapa sitúa el relato en su año convencional del 1700 a. C.; la época de los patriarcas es discutida."
    - "Dotán se nombra una vez más, en tiempos de Eliseo. El rey de Siria oyó «He aquí él está en Dothán» y envió «gente de á caballo, y carros, y un grande ejército, los cuales vinieron de noche, y cercaron la ciudad»; el criado de Eliseo vio que «el monte estaba lleno de gente de á caballo, y de carros de fuego alrededor de Eliseo», y Eliseo condujo a los sirios cegados a Samaria, a 16 km al sur. Joseph P. Free excavó el tell de 1953 a 1964 y halló ciudades desde la Edad del Bronce Antiguo hasta la Edad del Hierro; Eusebio conocía Dotaim a unas doce millas al norte de Sebaste, la antigua Samaria."
  pt:
    - "Dotã era Tell Dotã, um grande montículo a sudoeste de Jenin, no norte da Cisjordânia, num amplo vale na estrada entre a planície costeira e o vale de Jezreel. O ponto do mapa está nele, a cerca de 23 km ao norte de Siquém, 16 km ao norte de Samaria e 71 km ao norte de Jerusalém em linha reta. O nome sobreviveu no montículo, e a identificação não é seriamente disputada. O History Globe tem um artigo sobre Dotã; esta resposta se limita a onde ficava e por que as histórias ocorrem ali."
    - "Jacó enviou José “do vale de Hebrom, e ele chegou a Siquém”, cerca de 78 km em linha reta; seus irmãos tinham seguido adiante, e um homem lhe disse: “Eles partiram daqui, pois os ouvi dizer: ‘Vamos para Dotã’.” E “José foi atrás de seus irmãos e os encontrou em Dotã”. De Hebrom são cerca de 100 km. Enquanto comiam, viram “uma caravana de ismaelitas vindo de Gileade, com seus camelos carregando especiarias, bálsamo e mirra, descendo para levá-los ao Egito”: a estrada de caravanas dos vaus do Jordão à costa passava por este vale, e por isso passou por ali um comprador para José. O mapa situa a história em seu ano convencional de 1700 a.C.; a época dos patriarcas é disputada."
    - "Dotã é nomeada mais uma vez, nos dias de Eliseu. O rei da Síria soube: “Eis que ele está em Dotã”, e enviou “cavalos, carros e um grande exército… Eles chegaram de noite e cercaram a cidade”; o servo de Eliseu viu que “o monte estava cheio de cavalos e carros de fogo ao redor de Eliseu”, e Eliseu levou os sírios cegados a Samaria, 16 km ao sul. Joseph P. Free escavou o montículo de 1953 a 1964 e achou cidades da Idade do Bronze Antigo à Idade do Ferro; Eusébio conhecia Dotaim a cerca de doze milhas ao norte de Sebaste, a antiga Samaria."
  de:
    - "Dotan ist Tel Dotan, ein großer Hügel südwestlich von Dschenin im nördlichen Westjordanland, in einem breiten Tal an der Straße zwischen der Küstenebene und der Jesreel-Ebene. Der Kartenpunkt liegt darauf, in der Luftlinie etwa 23 km nördlich von Sichem, 16 km nördlich von Samaria und 71 km nördlich von Jerusalem. Der Name hat sich am Hügel erhalten, und die Gleichsetzung ist nicht ernsthaft umstritten. History Globe hat einen Artikel über Dotan; diese Antwort beschränkt sich darauf, wo es lag und warum die Geschichten dort spielen."
    - "Jakob sandte Josef „aus dem Tal Hebron, daß er gen Sichem ginge“, in der Luftlinie etwa 78 km; seine Brüder waren weitergezogen, und ein Mann sagte ihm: „denn ich hörte, daß sie sagten: Laßt uns gen Dothan gehen. Da folgte Joseph seinen Brüdern nach und fand sie zu Dothan.“ Von Hebron sind das etwa 100 km. Während sie aßen, hoben sie „ihre Augen auf und sahen einen Haufen Ismaeliter kommen von Gilead mit ihren Kamelen; die trugen Würze, Balsam und Myrrhe und zogen hinab nach Ägypten“: Die Karawanenstraße von den Jordanübergängen zur Küste führte durch dieses Tal, weshalb ein Käufer für Josef vorbeikam. Die Karte setzt die Geschichte in ihr herkömmliches Jahr 1700 v. Chr.; die Zeit der Erzväter ist umstritten."
    - "Dotan wird noch einmal genannt, zu Elisas Zeit. Der König von Syrien hörte: „Siehe, er ist zu Dothan“, und sandte „Rosse und Wagen und eine große Macht. Und da sie bei der Nacht hinkamen, umgaben sie die Stadt“; Elisas Diener sah, dass „der Berg voll feuriger Rosse und Wagen um Elisa her“ war, und Elisa führte die geblendeten Syrer nach Samaria, 16 km südlich. Joseph P. Free grub den Hügel von 1953 bis 1964 aus und fand Städte von der Frühbronzezeit bis zur Eisenzeit; Eusebius kannte Dothaim etwa zwölf Meilen nördlich von Sebaste, dem alten Samaria."
  fr:
    - "Dothan était Tell Dothan, grand tertre au sud-ouest de Jénine, dans le nord de la Cisjordanie, dans une large vallée sur la route entre la plaine côtière et la vallée de Jizreel. Le point de la carte y est, à environ 23 km au nord de Sichem, 16 km au nord de Samarie et 71 km au nord de Jérusalem en ligne droite. Le nom a survécu au tertre, et l’identification n’est pas sérieusement discutée. History Globe a un article sur Dothan ; cette réponse s’en tient à l’emplacement et à la raison pour laquelle les récits s’y déroulent."
    - "Jacob envoya Joseph « de la vallée d’Hébron ; et Joseph alla à Sichem », à environ 78 km en ligne droite ; ses frères étaient partis plus loin, et un homme lui dit : « Ils sont partis d’ici ; car je les ai entendus dire : Allons à Dothan. Joseph alla après ses frères, et il les trouva à Dothan. » D’Hébron, cela fait environ 100 km. Pendant leur repas, ils virent « une caravane d’Ismaélites venant de Galaad ; leurs chameaux étaient chargés d’aromates, de baume et de myrrhe, qu’ils transportaient en Égypte » : la route des caravanes, des passages du Jourdain à la côte, traversait cette vallée, ce qui explique qu’un acheteur pour Joseph soit passé par là. La carte place le récit à son année conventionnelle, 1700 av. J.-C. ; l’âge des patriarches est discuté."
    - "Dothan est nommée une fois encore, au temps d’Élisée. Le roi de Syrie apprit : « il est à Dothan », et y envoya « des chevaux, des chars et une forte troupe, qui arrivèrent de nuit et qui enveloppèrent la ville » ; le serviteur d’Élisée vit « la montagne pleine de chevaux et de chars de feu autour d’Élisée », et Élisée mena les Syriens frappés d’aveuglement à Samarie, à 16 km au sud. Joseph P. Free fouilla le tertre de 1953 à 1964 et trouva des villes de l’âge du Bronze ancien à l’âge du Fer ; Eusèbe connaissait Dothaïm à environ douze milles au nord de Sébaste, l’ancienne Samarie."
