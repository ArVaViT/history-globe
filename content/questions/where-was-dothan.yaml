id: where-was-dothan
question:
  en: "Where was Dothan, where Joseph was sold?"
  ru: "Где находился Дофан, где продали Иосифа?"
  uk: "Де був Дофан, де продали Йосипа?"
  es: "¿Dónde estaba Dotán, donde fue vendido José?"
  pt: "Onde ficava Dotã, onde José foi vendido?"
  de: "Wo lag Dotan, wo Josef verkauft wurde?"
  fr: "Où se trouvait Dothan, où Joseph fut vendu ?"
  pl: "Gdzie leżał Dotan, gdzie sprzedano Józefa?"
  it: "Dov’era Dotan, dove Giuseppe fu venduto?"
  nl: "Waar lag Dotan, waar Jozef werd verkocht?"
  cs: "Kde byl Dótan, kde byl prodán Josef?"
  sv: "Var låg Dotan, där Josef såldes?"
  nb: "Hvor lå Dotan, der Josef ble solgt?"
  tl: "Saan ang Dotan, kung saan ipinagbili si Jose?"
  da: "Hvor lå Dotan, hvor Josef blev solgt?"
  sr: "Где је био Дотаим, где је Јосиф продан?"
  hu: "Hol volt Dótán, ahol Józsefet eladták?"
  fi: "Missä Dotan oli, jossa Joosef myytiin?"
  vi: "Đô-than, nơi Giô-sép bị bán, ở đâu?"
  ro: "Unde se afla Dotan, unde a fost vândut Iosif?"
  bg: "Къде се е намирал Дотан, където бил продаден Йосиф?"
answer:
  en:
    - "Dothan was Tell Dothan, a large mound south-west of Jenin in the northern West Bank, in a broad valley on the road between the coastal plain and the valley of Jezreel. The map's point stands on it, about 23 km north of Shechem, 16 km north of Samaria and 71 km north of Jerusalem in a straight line. The name has survived at the mound, and the identification is not seriously disputed. History Globe has an article on Dothan; this answer keeps to where it was and why the stories happen there."
    - "Jacob sent Joseph “out of the vale of Hebron, and he came to Shechem”, about 78 km in a straight line; his brothers had moved on, and a man told him, “I heard them say, Let us go to Dothan. And Joseph went after his brethren, and found them in Dothan.” From Hebron that is about 100 km. While they ate, “a company of Ishmeelites came from Gilead with their camels bearing spicery and balm and myrrh, going to carry it down to Egypt”: the caravan road from the Jordan crossings to the coast ran through this valley, which is why a buyer for Joseph passed by. The map places the story at its conventional year of 1700 BC; the age of the patriarchs is disputed."
    - "Dothan is named once more, in the days of Elisha. The king of Syria heard “he is in Dothan” and sent “horses, and chariots, and a great host: and they came by night, and compassed the city about”; Elisha's servant saw that “the mountain was full of horses and chariots of fire round about Elisha”, and Elisha led the blinded Syrians to Samaria, 16 km to the south. Joseph P. Free excavated the mound from 1953 to 1964 and found towns from the Early Bronze Age to the Iron Age; Eusebius knew Dothaim about twelve miles north of Sebaste, the old Samaria."
  ru:
    - "Дофан — это Телль-Дотан, большой холм к юго-западу от Дженина на севере Западного берега, в широкой долине на дороге между прибрежной равниной и Изреельской долиной. Точка карты стоит на нём, примерно в 23 км к северу от Сихема, в 16 км к северу от Самарии и в 71 км к северу от Иерусалима по прямой. Имя сохранилось у холма, и отождествление серьёзно не оспаривается. В History Globe есть статья о Дофане; здесь ответ о том, где он был и почему рассказы происходят именно там."
    - "Иаков послал Иосифа «из долины Хевронской; и он пришел в Сихем» — примерно 78 км по прямой; братья ушли дальше, и встречный сказал ему: «я слышал, как они говорили: пойдем в Дофан. И пошел Иосиф за братьями своими и нашел их в Дофане». От Хеврона это около 100 км. Пока они ели, «идет из Галаада караван Измаильтян, и верблюды их несут стираксу, бальзам и ладан: идут они отвезти это в Египет»: караванная дорога от переправ через Иордан к морю шла этой долиной, поэтому покупатель для Иосифа и оказался рядом. Карта ставит рассказ в условный 1700 г. до н. э.; время патриархов спорно."
    - "Дофан назван ещё раз, во дни Елисея. Царь Сирийский услышал: «вот, он в Дофаиме» — и послал «коней и колесницы и много войска. И пришли ночью и окружили город»; слуга Елисея увидел, что «вся гора наполнена конями и колесницами огненными кругом Елисея», а Елисей отвёл ослеплённых сирийцев в Самарию, в 16 км к югу. Джозеф П. Фри раскапывал холм с 1953 по 1964 год и нашёл поселения от раннего бронзового века до железного; Евсевий знал Дофаим примерно в двенадцати милях к северу от Севасты, древней Самарии."
  uk:
    - "Дофан — це Тель-Дофан, великий пагорб на південний захід від Дженіна на півночі Західного берега, у широкій долині на дорозі між прибережною рівниною та Ізреельською долиною. Точка мапи стоїть на ньому, приблизно за 23 км на північ від Сихему, 16 км на північ від Самарії і 71 км на північ від Єрусалиму по прямій. Назва збереглася на пагорбі, і ототожнення серйозно не оскаржується. History Globe має статтю про Дофан; ця відповідь тримається того, де він був і чому історії відбуваються саме там."
    - "Яків послав Йосипа «з Геброн долини, і прийшов у Сихем», приблизно 78 км по прямій; брати вже пішли далі, і чоловік сказав йому: «чув бо, як мовляли: Поженимось у Дотан. І пійшов Йосиф слїдом за браттєм своїм, і зустьрів їх у Дотанї». Від Хеврона це приблизно 100 км. Поки вони їли, «ідуть подорожні Ізмайлитяне від Галааду з верблюдами своїми, везучи бурштин, бальзам та ладан в Египет»: караванна дорога від йорданських переправ до узбережжя проходила крізь цю долину, тому покупець для Йосипа й опинився поруч. Мапа відносить історію до умовного 1700 р. до н. е.; час патріархів спірний."
    - "Дофан названий ще раз, за днів Єлисея. Цар Сирії почув: «Він у Дотаїмі» — і послав «конї й колесницї й потужню купу військову. Пійшли вони в ночі та й обняли город»; слуга Єлисея побачив, що «гора навкруги Елисея була заповнена кіньми й поломяними колесницями», а Єлисей повів осліплених сирійців до Самарії, за 16 км на південь. Джозеф П. Фрі розкопував пагорб з 1953 до 1964 р. і знайшов міста від ранньої бронзової до залізної доби; Євсевій знав Дотаїм приблизно за дванадцять миль на північ від Севасте, давньої Самарії."
  es:
    - "Dotán era Tell Dotán, un gran tell al suroeste de Yenín, en el norte de Cisjordania, en un amplio valle en el camino entre la llanura costera y el valle de Jezreel. El punto del mapa está sobre él, a unos 23 km al norte de Siquem, 16 km al norte de Samaria y 71 km al norte de Jerusalén en línea recta. El nombre ha sobrevivido en el tell, y la identificación no se discute seriamente. History Globe tiene un artículo sobre Dotán; esta respuesta se limita a dónde estaba y por qué los relatos ocurren allí."
    - "Jacob envió a José desde «el valle de Hebrón, y llegó á Sichêm», a unos 78 km en línea recta; sus hermanos se habían ido más lejos, y un hombre le dijo: «yo les oí decir: Vamos á Dothán. Entonces José fué tras de sus hermanos, y hallólos en Dothán». Desde Hebrón son unos 100 km. Mientras comían, «una compañía de Ismaelitas que venía de Galaad, y sus camellos traían aromas y bálsamo y mirra, é iban á llevarlo á Egipto»: el camino de caravanas desde los pasos del Jordán hasta la costa atravesaba este valle, por lo cual pasó un comprador para José. El mapa sitúa el relato en su año convencional del 1700 a. C.; la época de los patriarcas es discutida."
    - "Dotán se nombra una vez más, en tiempos de Eliseo. El rey de Siria oyó «He aquí él está en Dothán» y envió «gente de á caballo, y carros, y un grande ejército, los cuales vinieron de noche, y cercaron la ciudad»; el criado de Eliseo vio que «el monte estaba lleno de gente de á caballo, y de carros de fuego alrededor de Eliseo», y Eliseo condujo a los sirios cegados a Samaria, a 16 km al sur. Joseph P. Free excavó el tell de 1953 a 1964 y halló ciudades desde la Edad del Bronce Antiguo hasta la Edad del Hierro; Eusebio conocía Dotaim a unas doce millas al norte de Sebaste, la antigua Samaria."
  pt:
    - "Dotã era Tell Dotã, um grande montículo a sudoeste de Jenin, no norte da Cisjordânia, num amplo vale na estrada entre a planície costeira e o vale de Jezreel. O ponto do mapa está nele, a cerca de 23 km ao norte de Siquém, 16 km ao norte de Samaria e 71 km ao norte de Jerusalém em linha reta. O nome sobreviveu no montículo, e a identificação não é seriamente disputada. O History Globe tem um artigo sobre Dotã; esta resposta se limita a onde ficava e por que as histórias ocorrem ali."
    - "Jacó enviou José “do vale de Hebrom, e ele chegou a Siquém”, cerca de 78 km em linha reta; seus irmãos tinham seguido adiante, e um homem lhe disse: “Eles partiram daqui, pois os ouvi dizer: ‘Vamos para Dotã’.” E “José foi atrás de seus irmãos e os encontrou em Dotã”. De Hebrom são cerca de 100 km. Enquanto comiam, viram “uma caravana de ismaelitas vindo de Gileade, com seus camelos carregando especiarias, bálsamo e mirra, descendo para levá-los ao Egito”: a estrada de caravanas dos vaus do Jordão à costa passava por este vale, e por isso passou por ali um comprador para José. O mapa situa a história em seu ano convencional de 1700 a.C.; a época dos patriarcas é disputada."
    - "Dotã é nomeada mais uma vez, nos dias de Eliseu. O rei da Síria soube: “Eis que ele está em Dotã”, e enviou “cavalos, carros e um grande exército… Eles chegaram de noite e cercaram a cidade”; o servo de Eliseu viu que “o monte estava cheio de cavalos e carros de fogo ao redor de Eliseu”, e Eliseu levou os sírios cegados a Samaria, 16 km ao sul. Joseph P. Free escavou o montículo de 1953 a 1964 e achou cidades da Idade do Bronze Antigo à Idade do Ferro; Eusébio conhecia Dotaim a cerca de doze milhas ao norte de Sebaste, a antiga Samaria."
  de:
    - "Dotan ist Tel Dotan, ein großer Hügel südwestlich von Dschenin im nördlichen Westjordanland, in einem breiten Tal an der Straße zwischen der Küstenebene und der Jesreel-Ebene. Der Kartenpunkt liegt darauf, in der Luftlinie etwa 23 km nördlich von Sichem, 16 km nördlich von Samaria und 71 km nördlich von Jerusalem. Der Name hat sich am Hügel erhalten, und die Gleichsetzung ist nicht ernsthaft umstritten. History Globe hat einen Artikel über Dotan; diese Antwort beschränkt sich darauf, wo es lag und warum die Geschichten dort spielen."
    - "Jakob sandte Josef „aus dem Tal Hebron, daß er gen Sichem ginge“, in der Luftlinie etwa 78 km; seine Brüder waren weitergezogen, und ein Mann sagte ihm: „denn ich hörte, daß sie sagten: Laßt uns gen Dothan gehen. Da folgte Joseph seinen Brüdern nach und fand sie zu Dothan.“ Von Hebron sind das etwa 100 km. Während sie aßen, hoben sie „ihre Augen auf und sahen einen Haufen Ismaeliter kommen von Gilead mit ihren Kamelen; die trugen Würze, Balsam und Myrrhe und zogen hinab nach Ägypten“: Die Karawanenstraße von den Jordanübergängen zur Küste führte durch dieses Tal, weshalb ein Käufer für Josef vorbeikam. Die Karte setzt die Geschichte in ihr herkömmliches Jahr 1700 v. Chr.; die Zeit der Erzväter ist umstritten."
    - "Dotan wird noch einmal genannt, zu Elisas Zeit. Der König von Syrien hörte: „Siehe, er ist zu Dothan“, und sandte „Rosse und Wagen und eine große Macht. Und da sie bei der Nacht hinkamen, umgaben sie die Stadt“; Elisas Diener sah, dass „der Berg voll feuriger Rosse und Wagen um Elisa her“ war, und Elisa führte die geblendeten Syrer nach Samaria, 16 km südlich. Joseph P. Free grub den Hügel von 1953 bis 1964 aus und fand Städte von der Frühbronzezeit bis zur Eisenzeit; Eusebius kannte Dothaim etwa zwölf Meilen nördlich von Sebaste, dem alten Samaria."
  fr:
    - "Dothan était Tell Dothan, grand tertre au sud-ouest de Jénine, dans le nord de la Cisjordanie, dans une large vallée sur la route entre la plaine côtière et la vallée de Jizreel. Le point de la carte y est, à environ 23 km au nord de Sichem, 16 km au nord de Samarie et 71 km au nord de Jérusalem en ligne droite. Le nom a survécu au tertre, et l’identification n’est pas sérieusement discutée. History Globe a un article sur Dothan ; cette réponse s’en tient à l’emplacement et à la raison pour laquelle les récits s’y déroulent."
    - "Jacob envoya Joseph « de la vallée d’Hébron ; et Joseph alla à Sichem », à environ 78 km en ligne droite ; ses frères étaient partis plus loin, et un homme lui dit : « Ils sont partis d’ici ; car je les ai entendus dire : Allons à Dothan. Joseph alla après ses frères, et il les trouva à Dothan. » D’Hébron, cela fait environ 100 km. Pendant leur repas, ils virent « une caravane d’Ismaélites venant de Galaad ; leurs chameaux étaient chargés d’aromates, de baume et de myrrhe, qu’ils transportaient en Égypte » : la route des caravanes, des passages du Jourdain à la côte, traversait cette vallée, ce qui explique qu’un acheteur pour Joseph soit passé par là. La carte place le récit à son année conventionnelle, 1700 av. J.-C. ; l’âge des patriarches est discuté."
    - "Dothan est nommée une fois encore, au temps d’Élisée. Le roi de Syrie apprit : « il est à Dothan », et y envoya « des chevaux, des chars et une forte troupe, qui arrivèrent de nuit et qui enveloppèrent la ville » ; le serviteur d’Élisée vit « la montagne pleine de chevaux et de chars de feu autour d’Élisée », et Élisée mena les Syriens frappés d’aveuglement à Samarie, à 16 km au sud. Joseph P. Free fouilla le tertre de 1953 à 1964 et trouva des villes de l’âge du Bronze ancien à l’âge du Fer ; Eusèbe connaissait Dothaïm à environ douze milles au nord de Sébaste, l’ancienne Samarie."
  pl:
    - "Dotan to Tell Dotan, duży kopiec na południowy zachód od Dżeninu w północnej części Zachodniego Brzegu, w szerokiej dolinie przy drodze między równiną nadbrzeżną a doliną Jizreel. Punkt na mapie stoi na nim, około 23 km na północ od Sychem, 16 km na północ od Samarii i 71 km na północ od Jerozolimy w linii prostej. Nazwa przetrwała przy kopcu, a utożsamienie nie jest poważnie kwestionowane. History Globe ma artykuł o Dotanie; ta odpowiedź ogranicza się do tego, gdzie leżał i dlaczego historie rozgrywają się właśnie tam."
    - "Jakub wysłał Józefa „z doliny Hebron, i przyszedł do Sychem”, około 78 km w linii prostej; bracia ruszyli dalej, a pewien człowiek powiedział mu: „bom słyszał, gdy mówili: Pójdźmy do Dotain. I szedł Józef za bracią swoją, a znalazł je w Dotain.” Z Hebronu to około 100 km. Gdy jedli chleb, ujrzeli „poczet Ismaelitów, idących z Galaad; a wielbłądy ich niosły korzenie, i kadzidło, i myrrę, a szły, aby to zaniosły do Egiptu”: szlak karawan od brodów Jordanu do wybrzeża biegł przez tę dolinę, dlatego kupiec na Józefa przechodził obok. Mapa umieszcza opowieść w umownym roku 1700 p.n.e.; czas patriarchów jest sporny."
    - "Dotan wymieniono jeszcze raz, za dni Elizeusza. Król Syrii usłyszał: „Oto jest w Dotanie” i posłał „konie i wozy z wielkiem wojskiem, którzy przyciągnąwszy w nocy, oblegli miasto”; sługa Elizeusza ujrzał, że „góra pełna koni, i wozy ogniste około Elizeusza”, a Elizeusz zawiódł oślepionych Syryjczyków do Samarii, 16 km na południe. Joseph P. Free wykopywał kopiec w latach 1953–1964 i znalazł miasta od wczesnej epoki brązu po epokę żelaza; Euzebiusz znał Dotaim około dwunastu mil na północ od Sebaste, dawnej Samarii."
  it:
    - "Dotan era Tell Dotan, un grande tumulo a sud-ovest di Jenin nella Cisgiordania settentrionale, in un’ampia valle sulla strada tra la pianura costiera e la valle di Izreel. Il punto della mappa vi sta sopra, a circa 23 km a nord di Sichem, 16 km a nord di Samaria e 71 km a nord di Gerusalemme in linea retta. Il nome è sopravvissuto presso il tumulo, e l’identificazione non è seriamente contestata. History Globe ha un articolo su Dotan; questa risposta si limita a dove si trovava e al perché le storie accadono là."
    - "Giacobbe mandò Giuseppe «dalla valle di Hebron, e Giuseppe arrivò a Sichem», a circa 78 km in linea retta; i suoi fratelli erano andati oltre, e un uomo gli disse: «Son partiti di qui, perché li ho uditi che dicevano: Andiamocene a Dotan». E «Giuseppe andò quindi in traccia de’ suoi fratelli, e li trovò a Dotan». Da Ebron sono circa 100 km. Mentre mangiavano, «una carovana d’Ismaeliti, che veniva da Galaad, coi suoi cammelli carichi di aromi, di balsamo e di mirra, che portava in Egitto»: la strada carovaniera dai guadi del Giordano alla costa passava per questa valle, ed è per questo che un compratore per Giuseppe passò di lì. La mappa colloca la storia nell’anno convenzionale 1700 a.C.; l’età dei patriarchi è discussa."
    - "Dotan è nominata ancora una volta, ai giorni di Eliseo. Il re di Siria fu informato: «ch’era a Dothan» e vi mandò «cavalli, carri e gran numero di soldati, i quali giunsero di nottetempo, e circondarono la città»; il servo di Eliseo vide «il monte pieno di cavalli e di carri di fuoco intorno ad Eliseo», ed Eliseo condusse i Siri accecati a Samaria, 16 km a sud. Joseph P. Free scavò il tumulo dal 1953 al 1964 e trovò città dall’età del Bronzo Antico all’età del Ferro; Eusebio conosceva Dothaim a circa dodici miglia a nord di Sebaste, l’antica Samaria."
  nl:
    - "Dotan is Tell Dotan, een grote heuvel ten zuidwesten van Jenin op de noordelijke Westelijke Jordaanoever, in een breed dal aan de weg tussen de kustvlakte en de vallei van Jizreël. Het punt op de kaart staat erop, hemelsbreed ongeveer 23 km ten noorden van Sichem, 16 km ten noorden van Samaria en 71 km ten noorden van Jeruzalem. De naam is op de heuvel bewaard gebleven, en de identificatie wordt niet serieus betwist. History Globe heeft een artikel over Dotan; dit antwoord beperkt zich tot waar het lag en waarom de verhalen daar spelen."
    - "Jakob zond Jozef “uit het dal Hebron, en hij kwam te Sichem”, hemelsbreed ongeveer 78 km; zijn broers waren verder getrokken, en een man zei hem: “Zij zijn van hier gereisd; want ik hoorde hen zeggen: Laat ons naar Dothan gaan. Jozef dan ging zijn broederen na, en vond hen te Dothan.” Vanaf Hebron is dat ongeveer 100 km. Terwijl zij aten, “ziet, een reisgezelschap van Ismaelieten kwam uit Gilead; en hun kemelen droegen specerijen en balsem, en mirre, reizende, om dat af te brengen naar Egypte”: de karavaanroute van de Jordaanovergangen naar de kust liep door dit dal, en daarom kwam er een koper voor Jozef voorbij. De kaart plaatst het verhaal in het conventionele jaar 1700 v.Chr.; de tijd van de aartsvaders is omstreden."
    - "Dotan wordt nog één keer genoemd, in de dagen van Elisa. De koning van Syrië hoorde: “Zie, hij is te Dothan”, en zond daarheen “paarden, en wagenen, en een zwaar heir; welke des nachts kwamen, en omsingelden de stad”; Elisa’s dienaar zag: “de berg was vol vurige paarden en wagenen rondom Elisa”, en Elisa leidde de verblinde Syriërs naar Samaria, 16 km naar het zuiden. Joseph P. Free groef de heuvel op van 1953 tot 1964 en vond steden van de Vroege Bronstijd tot de IJzertijd; Eusebius kende Dothaim ongeveer twaalf mijl ten noorden van Sebaste, het oude Samaria."
  cs:
    - "Dótan je Tell Dótan, velký pahorek jihozápadně od Džanínu na severním Západním břehu, v širokém údolí na cestě mezi pobřežní pláni a Jizreelským údolím. Bod na mapě na něm stojí, asi 23 km severně od Šekemu, 16 km severně od Samaří a 71 km severně od Jeruzaléma vzdušnou čarou. Jméno se na pahorku zachovalo a ztotožnění se vážně nezpochybňuje. History Globe má o Dótanu článek; tato odpověď se drží toho, kde ležel a proč se příběhy odehrávají tam."
    - "Jákob poslal Josefa „z údolí Hebron, a on přišel do Sichem“, asi 78 km vzdušnou čarou; jeho bratři šli dál a muž mu řekl: „Odešli odsud; nebo slyšel jsem je, ani praví: Poďme do Dothain. Tedy šel Jozef za bratřími svými, a našel je v Dothain.“ Od Hebronu je to asi 100 km. Zatímco jedli, uzřeli „množství Izmaelitských přicházejících z Galád, kteřížto na velbloudích svých nesli vonné věci a kadidlo a mirru do Egypta“: karavanní cesta od jordánských přechodů k pobřeží vedla tímto údolím, a proto kolem prošel kupec pro Josefa. Mapa klade příběh na smluvní rok 1700 př. n. l.; doba patriarchů je sporná."
    - "Dótan je jmenován ještě jednou, za dnů Elíšových. Syrský král uslyšel: „jest v Dotain“ a poslal „koně a vozy a vojsko veliké. Kteříž přitáhše v noci, oblehli město“; Elíšův sluha uviděl, že „hora ta plná koňů, a vozové ohniví okolo Elizea“, a Elíša zavedl oslepené Syřany do Samaří, 16 km na jih. Joseph P. Free pahorek vykopával v letech 1953 až 1964 a nalezl města od rané doby bronzové po dobu železnou; Eusebios znal Dothaim asi dvanáct mil severně od Sebasty, starého Samaří."
  sv:
    - "Dotan var Tell Dothan, en stor kulle sydväst om Jenin i norra Västbanken, i en bred dal vid vägen mellan kustslätten och Jisreeldalen. Kartans punkt står på den, omkring 23 km norr om Shekem, 16 km norr om Samaria och 71 km norr om Jerusalem fågelvägen. Namnet har överlevt vid kullen, och identifieringen är inte på allvar omstridd. History Globe har en artikel om Dotan; det här svaret håller sig till var det låg och varför berättelserna utspelar sig där."
    - "Jakob sände Josef ”från Hebrons dal, och han kom till Sikem”, omkring 78 km fågelvägen; hans bröder hade brutit upp, och en man sade till honom: ”jag hörde dem säga: Låt oss gå till Dotain. Då gick Josef vidare efter sina bröder och fann dem i Dotan.” Från Hebron är det omkring 100 km. Medan de åt, ”fingo de se ett tåg av ismaeliter komma från Gilead, och deras kameler voro lastade med dragantgummi, balsam och ladanum; de voro på väg med detta ned till Egypten”: karavanvägen från Jordans övergångar till kusten gick genom denna dal, och därför kom en köpare till Josef förbi. Kartan placerar berättelsen vid dess konventionella år 1700 f.Kr.; patriarkernas tid är omstridd."
    - "Dotan nämns en gång till, på Elishas tid. Syriens kung hörde att han var i Dotan och sände dit ”hästar och vagnar och en stor här; och de kommo dit om natten och omringade staden”; Elishas tjänare såg att ”berget var fullt med hästar och vagnar av eld, runt omkring Elisa”, och Elisha ledde de blindade syrierna till Samaria, 16 km åt söder. Joseph P. Free grävde ut kullen 1953–1964 och fann städer från tidig bronsålder till järnålder; Eusebios kände Dothaim omkring tolv romerska mil norr om Sebaste, det gamla Samaria."
  nb:
    - "Dotan var Tell Dotan, en stor haug sørvest for Jenin på den nordlige Vestbredden, i en bred dal på veien mellom kystsletten og Jisreeldalen. Kartets punkt står på den, omtrent 23 km nord for Sikem, 16 km nord for Samaria og 71 km nord for Jerusalem i luftlinje. Navnet har overlevd ved haugen, og identifikasjonen er ikke alvorlig omstridt. History Globe har en artikkel om Dotan; dette svaret holder seg til hvor det lå og hvorfor fortellingene skjer der."
    - "Jakob sendte Josef «avsted fra Hebron-dalen, og han kom til Sikem», omtrent 78 km i luftlinje; brødrene hadde dratt videre, og en mann sa til ham: «jeg hørte dem si: La oss gå til Dotan! Så gikk Josef efter sine brødre og fant dem i Dotan.» Fra Hebron er det omtrent 100 km. Mens de spiste, fikk de se «et reisefølge av ismaelitter som kom fra Gilead, og deres kameler bar krydderier og balsam og ladanum; de var på vei med dette ned til Egypten»: karavaneveien fra Jordan-overgangene til kysten gikk gjennom denne dalen, og derfor kom det en kjøper forbi for Josef. Kartet legger fortellingen til dens konvensjonelle år, 1700 f.Kr.; patriarkenes tid er omstridt."
    - "Dotan nevnes én gang til, på Elisjas tid. Kongen av Syria fikk melding om at «han var i Dotan» og sendte «hester og vogner og en stor hær dit; de kom der om natten og omringet byen»; Elisjas tjener så at «fjellet var fullt av gloende hester og vogner rundt omkring Elisa», og Elisja førte de blindede syrerne til Samaria, 16 km mot sør. Joseph P. Free gravde ut haugen fra 1953 til 1964 og fant byer fra eldre bronsealder til jernalder; Eusebius kjente Dothaim omtrent tolv romerske mil nord for Sebaste, det gamle Samaria."
  tl:
    - "Ang Dotan ay ang Tell Dothan, malaking burol sa timog-kanluran ng Jenin sa hilagang Kanlurang Pampang, sa malawak na libis sa daan sa pagitan ng kapatagan sa baybayin at ng libis ng Jezreel. Ang tuldok ng mapa ay nasa ibabaw nito, mga 23 km sa hilaga ng Sichem, 16 km sa hilaga ng Samaria at 71 km sa hilaga ng Jerusalem sa tuwid na guhit. Nanatili ang pangalan sa burol, at hindi seryosong pinagtatalunan ang pagkakakilanlan. May artikulo ang History Globe tungkol sa Dotan; nananatili ang sagot na ito sa kung saan ito at bakit doon nangyari ang mga kuwento."
    - "Isinugo ni Jacob si Jose “mula sa libis ng Hebron, at siya'y naparoon sa Sichem”, mga 78 km sa tuwid na guhit; lumipat na ang kaniyang mga kapatid, at sinabi sa kaniya ng isang tao, “narinig kong kanilang sinabi, Tayo na sa Dotan. At sinundan ni Jose ang kaniyang mga kapatid, at nasumpungan niya sila sa Dotan.” Mula sa Hebron iyon ay mga 100 km. Habang kumakain sila, “ang isang pulutong na mga Ismaelita na nagsisipanggaling sa Gilead sangpu ng kanilang mga kamelyo at may dalang mga pabango, at mga balsamo, at mga mirra, na kanilang dadalhin sa Egipto”: dumaan sa libis na ito ang daan ng karabana mula sa mga tawiran ng Jordan hanggang sa baybayin, kaya may bumiling dumaan para kay Jose. Inilalagay ng mapa ang kuwento sa karaniwang taon na 1700 BK; pinagtatalunan ang panahon ng mga patriyarka."
    - "Isa pang beses na pinangalanan ang Dotan, noong mga araw ni Eliseo. Narinig ng hari ng Siria na “siya'y nasa Dothan” at nagsugo roon “ng mga kabayo at mga karo, at ng isang malaking hukbo: at sila'y naparoon sa gabi, at kinubkob ang bayan sa palibot”; nakita ng lingkod ni Eliseo na “ang bundok ay puno ng mga kabayo at ng mga karo ng apoy sa palibot ni Eliseo”, at inakay ni Eliseo ang mga binulag na Siryano sa Samaria, 16 km sa timog. Hinukay ni Joseph P. Free ang burol mula 1953 hanggang 1964 at natagpuan ang mga bayan mula sa Maagang Panahon ng Tanso hanggang sa Panahon ng Bakal; kilala ni Eusebio ang Dothaim na mga labindalawang milya sa hilaga ng Sebaste, ang lumang Samaria."
  da:
    - "Dotan var Tell Dotan, en stor høj sydvest for Jenin i den nordlige del af Vestbredden, i en bred dal på vejen mellem kystsletten og Jizre'el-dalen. Kortets punkt står på den, omkring 23 km nord for Sikem, 16 km nord for Samaria og 71 km nord for Jerusalem i luftlinje. Navnet har overlevet ved højen, og identifikationen er ikke alvorligt omstridt. History Globe har en artikel om Dotan; dette svar holder sig til, hvor det lå, og hvorfor historierne udspiller sig dér."
    - "Jakob sendte Josef »fra Hebrons Dal, og han kom til Sikem«, omkring 78 km i luftlinje; hans brødre var draget videre, og en mand sagde til ham: »jeg hørte dem sige: Lader os gaa til Dothan; saa gik Josef efter sine Brødre og fandt dem i Dothan.« Fra Hebron er det omkring 100 km. Mens de spiste, »se, en rejsende Hob Ismaeliter kom fra Gilead, og deres Kameler bare Urter og Balsam og Ladanum, og de gik for at drage ned til Ægypten«: karavanevejen fra Jordans overgange til kysten løb gennem denne dal, hvorfor der kom en køber til Josef forbi. Kortet placerer historien i dens konventionelle år 1700 f.Kr.; patriarkernes tidsalder er omstridt."
    - "Dotan nævnes endnu en gang, i Elisas dage. Kongen af Syrien hørte: »Se, han er i Dothan« og sendte »Heste og Vogne og en stor Hær, og der de kom om Natten, da omringede de Staden«; Elisas dreng så, at »da var Bjerget fuldt af gloende Heste og Vogne trindt omkring Elisa«, og Elisa førte de blindede syrere til Samaria, 16 km mod syd. Joseph P. Free udgravede højen fra 1953 til 1964 og fandt byer fra tidlig bronzealder til jernalder; Eusebios kendte Dothaim omkring tolv romerske mil nord for Sebaste, det gamle Samaria."
  sr:
    - "Дотаим је био Тел Дотаим, велика хумка југозападно од Џенина на северу Западне обале, у широкој долини на путу између приобалне равнице и долине Језраел. Тачка на карти стоји на њој, око 23 км северно од Сихема, 16 км северно од Самарије и 71 км северно од Јерусалима правом линијом. Име се сачувало на хумци, а поистовећење се озбиљно не оспорава. History Globe има чланак о Дотаиму; овај одговор држи се тога где је био и зашто се приче тамо одигравају."
    - "Јаков је послао Јосифа: „И оправи га из долине хевронске, и он отиде пут Сихема“, око 78 км правом линијом; његова браћа су отишла даље, а један човек му је рекао: „јер чух где рекоше: Хајдемо у Дотаим. И отиде Јосиф за браћом својом, и нађе их у Дотаиму.“ Од Хеврона је то око 100 км. Док су јели, „гомила Исмаиљаца иђаше од Галада с камилама натовареним мирисавог корења и тамјана и смирне, те ношаху у Мисир“: каравански пут од јорданских прелаза до обале ишао је кроз ову долину, зато је купац за Јосифа прошао. Карта смешта причу у њену условну 1700. п. н. е.; доба праотаца је спорно."
    - "Дотаим се још једном именује, у дане Јелисијеве. Краљу Сирије јављено је: „Ено га у Дотану“, па је послао „коње и кола с великом војском; и они дошавши ноћу опколише град“; кад су се Јелисијевом слузи отвориле очи, угледао је: „а то гора пуна коња и кола огњених око Јелисија“, а Јелисије је ослепљене Сирце одвео у Самарију, 16 км јужно. Џозеф П. Фри ископавао је хумку од 1953. до 1964. и нашао градове од раног бронзаног до гвозденог доба; Јевсевије је знао Дотаим око дванаест миља северно од Себасте, старе Самарије."
  hu:
    - "Dótán a Tell Dótán, a Dzseninétől délnyugatra, az északi Ciszjordániában fekvő nagy halom, széles völgyben, a parti síkság és a Jezréel völgye közötti úton. A térkép pontja rajta áll, Sikemtől mintegy 23 km-re északra, Szamáriától 16 km-re északra és Jeruzsálemtől 71 km-re északra egyenes vonalban. A név a halomnál fennmaradt, és az azonosítás nem komolyan vitatott. A History Globe cikket közöl Dótánról; ez a válasz arra szorítkozik, hol volt, és miért ott játszódnak a történetek."
    - "Jákób Józsefet elküldte „Hebron völgyéből, és méne Sikhembe”, egyenes vonalban mintegy 78 km-re; testvérei tovább álltak, és egy férfi azt mondta neki: „hallám, hogy mondák: Menjünk Dóthánba. Elméne azért József az ő bátyjai után, és megtalálá őket Dóthánban.” Hebrontól ez mintegy 100 km. Míg ettek, „egy Ismáelita karaván jő vala Gileádból, és azoknak tevéi visznek vala fűszerszámot, balzsamot és mirhát, menvén, hogy alávigyék Égyiptomba”: a Jordán átkelőitől a partig vezető karavánút ezen a völgyön haladt át, ezért haladt el Józsefnek vevő. A térkép a történetet a szokásos Kr. e. 1700-as évhez teszi; az ősatyák korát vitatják."
    - "Dótánt még egyszer megnevezik, Elizeus napjaiban. A szíriai király meghallotta: „Ímé Dótánban van”, és „lovakat, szekereket és nagy sereget külde oda, a kik elmenének éjjel, és körülvevék a várost”; Elizeus szolgája látta, hogy „a hegy rakva volt tüzes lovagokkal és szekerekkel Elizeus körül”, Elizeus pedig a megvakított szíreket Szamáriába vezette, 16 km-re délre. Joseph P. Free 1953-tól 1964-ig ásta a halmot, és a korai bronzkortól a vaskorig településeket talált; Eusebius Dothaimot a Szebasztétól, a régi Szamáriától mintegy tizenkét mérföldre északra ismerte."
  fi:
    - "Dotan on Tell Dotan, suuri kumpu Jeninistä lounaaseen Länsirannan pohjoisosassa, leveässä laaksossa rannikkotasangon ja Jisreelin laakson välisellä tiellä. Kartan piste on sen päällä, noin 23 km Sikemistä pohjoiseen, 16 km Samariasta pohjoiseen ja 71 km Jerusalemista pohjoiseen linnuntietä. Nimi on säilynyt kummussa, eikä tunnistuksesta kiistellä vakavasti. History Globe sisältää artikkelin Dotanista; tämä vastaus pysyy siinä, missä se oli ja miksi tarinat tapahtuvat siellä."
    - "Jaakob lähetti Joosefin ”matkalle Hebronin laaksosta, ja hän tuli Sikemiin”, noin 78 km linnuntietä; hänen veljensä olivat siirtyneet edemmäs, ja eräs mies sanoi hänelle: ”minä kuulin heidän sanovan: Menkäämme Dootaniin. Niin Joosef meni veljiensä jäljissä ja löysi heidät Dootanista.” Hebronista sinne on noin 100 km. Heidän aterioidessaan he ”näkivät ismaelilaismatkueen tulevan Gileadista; heidän kamelinsa kuljettivat kumihartsia, balsamia ja hajupihkaa, ja he olivat viemässä niitä Egyptiin”: Jordanin ylityspaikoilta rannikolle kulkenut karavaanitie kulki tämän laakson kautta, minkä vuoksi Joosefille löytyi ostaja. Kartta sijoittaa tarinan sovinnaiseen vuoteensa 1700 eaa.; patriarkkojen aikakaudesta kiistellään."
    - "Dotan mainitaan vielä kerran, Elisan päivinä. Syyrian kuningas sai kuulla ”hän on Dootanissa” ja lähetti ”hevosia ja sotavaunuja ja suuren sotajoukon. He tulivat sinne yöllä ja ympäröivät kaupungin”; Elisan palvelija näki, että ”vuori oli täynnä tulisia hevosia ja tulisia vaunuja Elisan ympärillä”, ja Elisa vei sokaistut syyrialaiset Samariaan, 16 km etelään. Joseph P. Free kaivoi kumpua vuosina 1953–1964 ja löysi kaupunkeja varhaispronssikaudelta rautakaudelle; Eusebios tunsi Dothaimin noin kaksitoista mailia Sebastesta, vanhasta Samariasta, pohjoiseen."
  vi:
    - "Đô-than là Tell Dothan, một gò lớn phía tây nam Jenin ở bắc Bờ Tây, trong một thung lũng rộng trên đường giữa đồng bằng ven biển và thung lũng Gít-rê-ên. Điểm bản đồ đứng trên đó, cách Si-chem khoảng 23 km về phía bắc, cách Sa-ma-ri 16 km và cách Giê-ru-sa-lem 71 km về phía bắc theo đường thẳng. Tên còn lại ở gò, và sự đồng nhất không bị tranh cãi nghiêm túc. History Globe có một bài viết về Đô-than; câu trả lời này giữ ở chỗ nó nằm đâu và vì sao các câu chuyện diễn ra ở đó."
    - "Gia-cốp “từ trũng Hếp-rôn, người sai Giô-sép đi đến Si-chem”, khoảng 78 km theo đường thẳng; các anh ông đã đi tiếp, và một người nói với ông: “tôi có nghe họ nói rằng: Ta hãy đi đến Đô-ta-in. Vậy, Giô-sép, đi tìm các anh mình, gặp được tại Đô-ta-in.” Từ Hếp-rôn là khoảng 100 km. Trong khi họ ăn, họ thấy “một đoàn dân Ích-ma-ên ở phía Ga-la-át đi đến, trên lưng lạc đà họ chở đầy thuốc thơm, nhũ hương và một dược đang đem đi đến xứ Ê-díp-tô”: đường lữ hành từ các bến lội Giô-đanh ra bờ biển chạy qua thung lũng này, vì thế có người mua Giô-sép đi ngang. Bản đồ đặt câu chuyện ở năm quy ước 1700 TCN; thời đại các tổ phụ còn tranh luận."
    - "Đô-than được nêu thêm một lần, thời Ê-li-sê. Vua Sy-ri nghe “Kìa, người ở tại Đô-than” và sai “ngựa, xe, và một đạo binh rất đông đến Đô-than; họ tới nơi lúc ban đêm, và vây thành”; đầy tớ của Ê-li-sê thấy “núi đầy những ngựa và xe bằng lửa ở chung quanh Ê-li-sê”, và Ê-li-sê dẫn những người Sy-ri bị mù đến Sa-ma-ri, cách 16 km về phía nam. Joseph P. Free khai quật gò từ 1953 đến 1964 và tìm thấy các thị trấn từ thời đồ đồng sớm đến thời đồ sắt; Eusebius biết Dothaim cách Sebaste, Sa-ma-ri xưa, khoảng mười hai dặm La Mã về phía bắc."
  ro:
    - "Dotan era Tell Dothan, o movilă mare la sud-vest de Jenin, în nordul Cisiordaniei, într-o vale largă pe drumul dintre câmpia de coastă și valea Izreel. Punctul de pe hartă stă pe ea, la circa 23 km nord de Sihem, 16 km nord de Samaria și 71 km nord de Ierusalim în linie dreaptă. Numele a supraviețuit la movilă, iar identificarea nu este serios contestată. History Globe are un articol despre Dotan; acest răspuns se ține de locul unde se afla și de motivul pentru care povestirile se petrec acolo."
    - "Iacov l-a trimis pe Iosif „din valea Hevronului, și a venit în Sihem”, la circa 78 km în linie dreaptă; frații lui plecaseră mai departe, iar un om i-a spus: „i-am auzit pre ei zicând: să mergem în Dotaim, și s’a dus Iosif după frații săi, și i-a aflat în Dotaim.” De la Hebron sunt circa 100 km. În timp ce mâncau, „călători Ismailteni veneau din Galaad, și cămilele lor încărcate de tămâie și de rășină și de smirnă, și mergeau să se pogoare în Eghipet”: drumul caravanelor de la trecerile Iordanului spre coastă trecea prin această vale, de aceea a trecut pe acolo un cumpărător pentru Iosif. Harta așază povestea la anul ei convențional, 1700 î.Hr.; epoca patriarhilor este disputată."
    - "Dotan este numit încă o dată, în zilele lui Elisei. Regele Siriei a aflat „iată în Dotaim” și a trimis „călăreți și care și putere grea, și au venit noaptea, și au încunjurat cetatea”; sluga lui Elisei a văzut că „muntele erà plin de cai și de care de foc împrejurul lui Eliseiu”, iar Elisei i-a dus pe sirienii orbiți la Samaria, la 16 km spre sud. Joseph P. Free a săpat movila între 1953 și 1964 și a găsit orașe din Epoca Bronzului Timpuriu până în Epoca Fierului; Eusebiu cunoștea Dothaim la circa douăsprezece mile la nord de Sebaste, vechea Samaria."
  bg:
    - "Дотан е Тел Дотан, голяма могила югозападно от Дженин в северната част на Западния бряг, в широка долина на пътя между крайбрежната равнина и Изреелската долина. Точката на картата стои на нея, на около 23 км северно от Сихем, на 16 км северно от Самария и на 71 км северно от Йерусалим по права линия. Името е оцеляло при могилата и отъждествяването не е сериозно оспорвано. History Globe има статия за Дотан; този отговор се ограничава до това къде е бил и защо разказите стават там."
    - "Яков пратил Йосиф „от Хевронския дол, и дойде в Сихем“, на около 78 км по права линия; братята му се били преместили и един човек му казал: „чух да говорят: Да идем в Дотан. И отиде Йосиф подир братята си, и намери ги в Дотан.“ От Хеврон това са около 100 км. Докато се хранели, „една дружина от Исмаиляни идеха от Галаад с камилите си натоварени с аромати, балсама и смирна, и отхождаха да ги носят долу в Египет“: керванният път от бродовете на Йордан до брега минавал през тази долина — затова покрай тях минал купувач за Йосиф. Картата поставя разказа в условната му година, 1700 г. пр.н.е.; епохата на патриарсите е спорна."
    - "Дотан е назован още веднъж, в дните на Елисей. Сирийският цар чул: „Ето, в Дотан е“, и пратил „коне, и колесници, и велико воинство които дойдоха през нощ та обиколиха града“; слугата на Елисей видял, че „гората бе пълна с коне и колесници огнени около Елисея“, а Елисей отвел ослепените сирийци в Самария, на 16 км на юг. Джоузеф П. Фрий разкопавал могилата от 1953 до 1964 г. и открил градове от ранната бронзова до желязната епоха; Евсевий познава Дотаим на около дванадесет мили северно от Себастия, старата Самария."
