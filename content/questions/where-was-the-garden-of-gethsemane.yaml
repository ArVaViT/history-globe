id: where-was-the-garden-of-gethsemane
question:
  en: "Where was the Garden of Gethsemane?"
  ru: "Где находился Гефсиманский сад?"
  uk: "Де був Гетсиманський сад?"
  es: "¿Dónde estaba el huerto de Getsemaní?"
  pt: "Onde ficava o jardim do Getsêmani?"
  de: "Wo lag der Garten Gethsemane?"
  fr: "Où se trouvait le jardin de Gethsémané ?"
  pl: "Gdzie był Ogród Getsemani?"
  it: "Dov’era il giardino del Getsemani?"
  cs: "Kde byla zahrada Getsemane?"
  nl: "Waar lag de hof van Getsemane?"
answer:
  en:
    - "Gethsemane lay at the foot of the Mount of Olives, across the Kidron valley east of the Temple Mount of Jerusalem; the map point stands at the garden beside the Church of All Nations, about 600 m from the Jerusalem point and about 900 m from the traditional Golgotha in a straight line. The name is Aramaic, gat shemanim, “oil press”: it was an olive grove with a press on the slope where the road from the city climbs towards Bethany. Its general position is secure, its exact bounds are not; the page on Golgotha names the rival spots, and this one follows the garden itself."
    - "Matthew and Mark call it a place, a plot of ground: “Then cometh Jesus with them unto a place called Gethsemane, and saith unto the disciples, Sit ye here, while I go and pray yonder.” John calls it a garden: Jesus “went forth with his disciples over the brook Cedron, where was a garden”, and adds that Judas “knew the place: for Jesus ofttimes resorted thither with his disciples”. Luke names no garden, only the mount: Jesus “went, as he was wont, to the mount of Olives”, and withdrew from the disciples “about a stone's cast”. Put together, the place was an enclosed olive orchard at the bottom of the mount, a short walk from the city after the supper, where Jesus prayed three times and was arrested."
    - "Pilgrims were shown the place from the fourth century. Eusebius' Onomasticon sets Gethsemane at the foot of the Mount of Olives, where the faithful came to pray, and Jerome's Latin version adds that a church had been built there; Egeria, about 384, describes the vigil of Holy Thursday night that ended at Gethsemane before dawn. That Byzantine church was in ruins by the Middle Ages, the Crusaders built another, and in 1919–1924 the Franciscans raised the Church of All Nations on the foundations of both, over the rock venerated as the place of the agony. The garden beside it keeps eight ancient olives; a dating study published in 2015 put the trunks of three of them in the twelfth century, so they are not the trees of the Gospels, though their roots may be older. The Grotto of Gethsemane to the north, the Russian garden up the slope and the Greek Orthodox plot are claimed as well."
  ru:
    - "Гефсимания лежала у подножия горы Елеонской, за Кедронской долиной к востоку от Храмовой горы Иерусалима; точка карты стоит в саду рядом с церковью Всех Наций, примерно в 600 м от точки Иерусалима и в 900 м от традиционной Голгофы по прямой. Имя арамейское, гат шемани́м — «масличный пресс»: это была оливковая роща с давильней на склоне, где дорога из города поднимается к Вифании. Общее положение сада надёжно, точные границы — нет; страница о Голгофе называет соперничающие места, а эта говорит о самом саде."
    - "Матфей и Марк называют его местом, участком земли: «Потом приходит с ними Иисус на место, называемое Гефсимания, и говорит ученикам: посидите тут, пока Я пойду помолюсь там». Иоанн называет его садом: Иисус «вышел с учениками Своими за поток Кедрон, где был сад», и добавляет, что Иуда знал «это место… потому что Иисус часто собирался там с учениками Своими». Лука не называет сада, только гору: Иисус «пошел по обыкновению на гору Елеонскую» и отошёл от учеников «на вержение камня». Вместе это огороженная оливковая роща у подножия горы, в нескольких минутах ходьбы от города после вечери, где Иисус трижды молился и был взят под стражу."
    - "Паломникам показывали это место с IV века. «Ономастикон» Евсевия помещает Гефсиманию у подножия горы Елеонской, где верные приходят молиться, а латинский перевод Иеронима добавляет, что там построена церковь; Эгерия около 384 года описывает бдение в ночь Великого четверга, которое заканчивалось в Гефсимании перед рассветом. Та византийская церковь к Средним векам лежала в руинах, крестоносцы построили другую, а в 1919–1924 годах францисканцы возвели на фундаментах обеих церковь Всех Наций — над скалой, почитаемой как место моления о чаше. В саду рядом растут восемь древних олив; радиоуглеродное исследование, опубликованное в 2015 году, отнесло стволы трёх из них к XII веку, так что это не деревья евангельских времён, хотя корни могут быть старше. На то же звание претендуют Гефсиманский грот чуть севернее, русский сад выше по склону и греческий православный участок."
  uk:
    - "Гетсиманія лежала біля підніжжя Оливкової гори, через долину Кедрону на схід від Храмової гори Єрусалима; точка на мапі стоїть у саду біля Церкви всіх націй, приблизно за 600 м від точки Єрусалима і приблизно за 900 м від традиційної Голгофи по прямій. Назва арамейська, gat shemanim, «олійний прес»: це був оливковий гай із пресом на схилі, де дорога з міста піднімається до Віфанії. Загальне розташування певне, точні межі — ні; сторінка про Голгофу називає суперницькі місця, а ця стосується самого саду."
    - "Матвій і Марк називають його місцем, ділянкою землі: «Тодї приходить з ними Ісус на врочище Гетсиман, і рече до учеників: Сидїть тут, поки, пійшовши, помолюсь оттам.» Іван називає його садом: Ісус «вийшов з учениками своїми за потік Кедрон, де був сад», і додає, що Юда «Знав ... се місце, бо почасту збирались там Ісус і ученики Його». Лука не називає сад, лише гору: Ісус «пійшов по звичаю на гору Оливну» і відійшов від учнів, «так як кинути каменем». Якщо скласти докупи, місце було огородженим оливковим садом при підніжжі гори, недалеко від міста після вечері, де Ісус молився тричі й був заарештований."
    - "Паломникам показували це місце від IV ст. Ономастикон Євсевія розміщує Гетсиманію біля підніжжя Оливкової гори, де вірні приходили молитися, а латинський переклад Єроніма додає, що там збудовано церкву; Егерія близько 384 р. описує нічне бдіння Великого четверга, що закінчувалося в Гетсиманії перед світанком. Та візантійська церква лежала в руїнах уже в Середньовіччі, хрестоносці збудували іншу, а 1919–1924 рр. францисканці звели Церкву всіх націй на фундаментах обох, над скелею, яку шанують як місце передсмертної туги. Сад біля неї зберігає вісім давніх олив; дослідження датування, опубліковане 2015 р., віднесло стовбури трьох із них до XII ст., тож це не дерева Євангелій, хоча їхнє коріння може бути давнішим. Ґрот Гетсиманії на півночі, російський сад вище по схилу та грецька православна ділянка також заявляються як це місце."
  es:
    - "Getsemaní estaba al pie del monte de los Olivos, al otro lado del valle del Cedrón, al este del Monte del Templo de Jerusalén; el punto del mapa está en el huerto junto a la iglesia de Todas las Naciones, a unos 600 m del punto de Jerusalén y a unos 900 m del Gólgota tradicional en línea recta. El nombre es arameo, gat shemanim, «lagar de aceite»: era un olivar con un lagar en la ladera por donde el camino de la ciudad sube hacia Betania. Su posición general es segura, sus límites exactos no; la página sobre el Gólgota nombra los lugares rivales, y esta sigue el propio huerto."
    - "Mateo y Marcos lo llaman un lugar, un terreno: «Y vienen al lugar que se llama Gethsemaní, y dice á sus discípulos: Sentaos aquí, entre tanto que yo oro». Juan lo llama un huerto: Jesús «salióse con sus discípulos tras el arroyo de Cedrón, donde estaba un huerto», y añade que Judas «sabía aquel lugar; porque muchas veces Jesús se juntaba allí con sus discípulos». Lucas no nombra ningún huerto, solo el monte: Jesús «se fué, como solía, al monte de las Olivas», y se apartó de los discípulos «como un tiro de piedra». Reunidos los datos, el lugar era un olivar cercado al pie del monte, a corta distancia a pie de la ciudad tras la cena, donde Jesús oró tres veces y fue arrestado."
    - "Se mostraba a los peregrinos desde el siglo IV. El Onomasticon de Eusebio sitúa Getsemaní al pie del monte de los Olivos, donde los fieles iban a orar, y la versión latina de Jerónimo añade una iglesia allí construida; Egeria, hacia el 384, cuenta la vigilia nocturna del Jueves Santo, que terminaba en Getsemaní antes del amanecer. La iglesia bizantina estaba en ruinas en la Edad Media, los cruzados otra, y en 1919–1924 los franciscanos levantaron la iglesia de Todas las Naciones sobre los cimientos de ambas y la roca venerada como lugar de la agonía. El huerto conserva ocho olivos viejos; un estudio de 2015 fechó los troncos de tres en el siglo XII, así que no son los árboles de los Evangelios, aunque sus raíces pueden ser más antiguas. Se reclaman también la Gruta de Getsemaní, al norte, el huerto ruso, ladera arriba, y la parcela greco-ortodoxa."
  pt:
    - "O Getsêmani ficava ao pé do monte das Oliveiras, do outro lado do vale do Cedrom, a leste do monte do Templo de Jerusalém; o ponto do mapa fica no jardim junto à Igreja de Todas as Nações, a cerca de 600 m do ponto de Jerusalém e a cerca de 900 m do Gólgota tradicional em linha reta. O nome é aramaico, gat shemanim, “lagar de azeite”: era um olival com um lagar na encosta onde a estrada da cidade sobe para Betânia. Sua posição geral é segura, seus limites exatos não; a página sobre o Gólgota nomeia os pontos rivais, e esta segue o próprio jardim."
    - "Mateus e Marcos o chamam de lugar, um terreno: “Então Jesus foi com eles a um lugar chamado Getsêmani, e disse aos seus discípulos: Sentem-se aqui, enquanto eu vou ali orar.” João o chama de jardim: Jesus “saiu com os seus discípulos para o outro lado do ribeiro de Cedrom, onde havia um jardim”, e acrescenta que Judas “conhecia o lugar, porque Jesus frequentemente se reunia ali com os seus discípulos”. Lucas não nomeia nenhum jardim, apenas o monte: Jesus “saiu e foi, como era o seu costume, para o Monte das Oliveiras”, e se afastou dos discípulos “cerca de um arremesso de pedra”. Juntando tudo, o lugar era um pomar de oliveiras cercado, ao pé do monte, a uma curta caminhada da cidade depois da ceia, onde Jesus orou três vezes e foi preso."
    - "Mostra-se o lugar aos peregrinos desde o século IV. O Onomástico de Eusébio situa o Getsêmani ao pé do monte das Oliveiras, onde os fiéis oravam, e a versão latina de Jerônimo acrescenta que ali se construíra uma igreja; Egéria, por volta de 384, descreve a vigília da Quinta-feira Santa, que terminava no Getsêmani antes do amanhecer. Essa igreja bizantina ruiu na Idade Média; os cruzados construíram outra, e em 1919–1924 os franciscanos ergueram a Igreja de Todas as Nações sobre os alicerces de ambas, sobre a rocha venerada como o lugar da agonia. O jardim ao lado guarda oito oliveiras antigas; um estudo de datação de 2015 situou os troncos de três delas no século XII, portanto não são as árvores dos Evangelhos, embora as raízes talvez sejam mais antigas. A Gruta do Getsêmani, ao norte, o jardim russo acima e o terreno ortodoxo grego também são reivindicados."
  de:
    - "Gethsemane lag am Fuß des Ölbergs, jenseits des Kidrontals östlich des Tempelbergs von Jerusalem; der Kartenpunkt steht am Garten neben der Kirche aller Nationen, in der Luftlinie etwa 600 m vom Jerusalem-Punkt und etwa 900 m vom traditionellen Golgatha. Der Name ist aramäisch, gat schemanim, „Ölkelter“: Es war ein Ölbaumhain mit einer Kelter an dem Hang, wo die Straße von der Stadt nach Bethanien ansteigt. Seine ungefähre Lage ist gesichert, seine genauen Grenzen nicht; die Seite über Golgatha nennt die rivalisierenden Stellen, und diese hier folgt dem Garten selbst."
    - "Matthäus und Markus nennen es einen Ort, ein Stück Land: „Da kam Jesus mit ihnen zu einem Hofe, der hieß Gethsemane, und sprach zu seinen Jüngern: Setzet euch hier, bis daß ich dorthin gehe und bete.“ Johannes nennt es einen Garten: „Da Jesus solches geredet hatte, ging er hinaus mit seinen Jüngern über den Bach Kidron; da war ein Garten“, und fügt hinzu, Judas „wußte den Ort auch; denn Jesus versammelte sich oft daselbst mit seinen Jüngern“. Lukas nennt keinen Garten, nur den Berg: Jesus „ging hinaus nach seiner Gewohnheit an den Ölberg“ und riss sich von den Jüngern los „einen Steinwurf weit“. Zusammengenommen war der Ort ein umfriedeter Ölhain am Fuß des Berges, nach dem Mahl einen kurzen Fußweg von der Stadt entfernt, wo Jesus dreimal betete und verhaftet wurde."
    - "Pilgern wurde der Ort seit dem 4. Jahrhundert gezeigt. Das Onomastikon des Eusebius setzt Gethsemane an den Fuß des Ölbergs, wo die Gläubigen beteten, und die lateinische Fassung des Hieronymus fügt eine dort gebaute Kirche hinzu; Egeria beschreibt um 384 die Wache der Gründonnerstagsnacht, die vor Tagesanbruch in Gethsemane endete. Die byzantinische Kirche verfiel im Mittelalter, die Kreuzfahrer bauten eine neue, und 1919–1924 errichteten die Franziskaner die Kirche aller Nationen auf beiden Fundamenten, über dem als Ort der Todesangst verehrten Felsen. Der Garten daneben hat acht uralte Ölbäume; eine Datierung von 2015 setzte die Stämme von dreien ins 12. Jahrhundert, es sind nicht die Bäume der Evangelien, doch die Wurzeln mögen älter sein. Beansprucht werden auch die Grotte im Norden, der russische Garten am Hang und das griechisch-orthodoxe Grundstück."
  fr:
    - "Gethsémané se trouvait au pied du mont des Oliviers, de l’autre côté de la vallée du Cédron, à l’est du mont du Temple de Jérusalem ; le point de la carte se trouve au jardin voisin de l’église de Toutes les Nations, à environ 600 m du point de Jérusalem et à environ 900 m du Golgotha traditionnel à vol d’oiseau. Le nom est araméen, gat shemanim, « pressoir à huile » : c’était une oliveraie avec un pressoir, sur la pente où la route qui part de la ville monte vers Béthanie. Sa position générale est sûre, ses limites exactes ne le sont pas ; la page sur le Golgotha nomme les lieux concurrents, et celle-ci suit le jardin lui-même."
    - "Matthieu et Marc l’appellent un lieu, une parcelle de terrain : « Jésus alla avec eux dans un lieu appelé Gethsémané, et il dit aux disciples : Asseyez-vous ici, pendant que je m’éloignerai pour prier. » Jean l’appelle un jardin : Jésus « alla avec ses disciples de l’autre côté du torrent du Cédron, où se trouvait un jardin », et ajoute que Judas « connaissait ce lieu, parce que Jésus et ses disciples s’y étaient souvent réunis ». Luc ne nomme aucun jardin, seulement la montagne : Jésus « alla, selon sa coutume, à la montagne des oliviers », et s’éloigna des disciples « à la distance d’environ un jet de pierre ». Mis ensemble, ces témoignages font du lieu une oliveraie close au pied de la montagne, à courte distance de la ville après le repas, où Jésus pria trois fois et fut arrêté."
    - "On montrait le lieu aux pèlerins dès le IVe siècle. L’Onomasticon d’Eusèbe place Gethsémané au pied du mont des Oliviers, où les fidèles venaient prier, et la version latine de Jérôme ajoute qu’une église y avait été bâtie ; Égérie, vers 384, décrit la veillée du Jeudi saint, achevée à Gethsémané avant l’aube. Cette église byzantine était en ruine au Moyen Âge, les croisés en bâtirent une autre, et en 1919-1924 les franciscains élevèrent l’église de Toutes les Nations sur les deux fondations, au-dessus du rocher vénéré comme lieu de l’agonie. Le jardin voisin garde huit vieux oliviers ; une étude publiée en 2015 a daté du XIIe siècle les troncs de trois d’entre eux, qui ne sont donc pas ceux des Évangiles, mais leurs racines peuvent être plus anciennes. La grotte de Gethsémané au nord, le jardin russe plus haut et la parcelle grecque orthodoxe sont aussi revendiqués."
  pl:
    - "Getsemani leżało u stóp Góry Oliwnej, za doliną Cedronu na wschód od Wzgórza Świątynnego w Jerozolimie; punkt na mapie stoi w ogrodzie obok Kościoła Wszystkich Narodów, około 600 m od punktu Jerozolimy i około 900 m od tradycyjnej Golgoty w linii prostej. Nazwa jest aramejska, gat szemanim, „tłocznia oliwy”: był to gaj oliwny z tłocznią na stoku, gdzie droga z miasta wspina się ku Betanii. Jego ogólne położenie jest pewne, dokładne granice nie; strona o Golgocie wymienia konkurencyjne miejsca, a ta śledzi sam ogród."
    - "Mateusz i Marek nazywają je miejscem, kawałkiem ziemi: „Tedy przyszedł Jezus z nimi na miejsce, które zwano Gietsemane, i rzekł uczniom: Siądźcież tu, aż odszedłszy, będę się tam modlił”. Jan nazywa je ogrodem: Jezus „wyszedł z uczniami swoimi przez potok Cedron, gdzie był ogród”, i dodaje, że Judasz „wiedział… ono miejsce; bo się tam często schadzał Jezus z uczniami swoimi”. Łukasz nie wymienia ogrodu, tylko górę: Jezus „szedł według zwyczaju na górę Oliwną” i oddalił się od uczniów „jakoby na ciśnienie kamieniem”. Złożone razem: miejsce było ogrodzonym sadem oliwnym u stóp góry, krótki spacer od miasta po wieczerzy, gdzie Jezus modlił się trzy razy i został pojmany."
    - "Pielgrzymom pokazywano to miejsce od IV wieku. Onomastikon Euzebiusza umieszcza Getsemani u stóp Góry Oliwnej, gdzie wierni przychodzili się modlić, a łacińska wersja Hieronima dodaje, że zbudowano tam kościół; Egeria, około 384, opisuje czuwanie nocy Wielkiego Czwartku, które kończyło się w Getsemani przed świtem. Ten bizantyjski kościół leżał w ruinie w średniowieczu, krzyżowcy zbudowali kolejny, a w latach 1919–1924 franciszkanie wznieśli Kościół Wszystkich Narodów na fundamentach obu, nad skałą czczoną jako miejsce konania. Ogród obok zachowuje osiem starożytnych oliwek; badanie datowania opublikowane w 2015 roku umieściło pnie trzech z nich w XII wieku, więc nie są to drzewa z Ewangelii, choć ich korzenie mogą być starsze. Grota Getsemani na północy, rosyjski ogród wyżej na stoku i grecko-prawosławna parcela również są uznawane."
  it:
    - "Il Getsemani si trovava ai piedi del Monte degli Ulivi, al di là della valle del Cedron a est del Monte del Tempio di Gerusalemme; il punto della mappa si trova nel giardino accanto alla Chiesa di Tutte le Nazioni, a circa 600 m dal punto di Gerusalemme e a circa 900 m dal Golgota tradizionale in linea d’aria. Il nome è aramaico, gat shemanim, «frantoio»: era un oliveto con un frantoio sul pendio dove la strada dalla città sale verso Betania. La sua posizione generale è sicura, i suoi confini esatti no; la pagina sul Golgota nomina i luoghi rivali, e questa segue il giardino stesso."
    - "Matteo e Marco lo chiamano un luogo, un podere: «Allora Gesù venne con loro in un podere detto Getsemani, e disse ai discepoli: Sedete qui finché io sia andato là ed abbia orato». Giovanni lo chiama un orto: Gesù «uscì coi suoi discepoli di là dal torrente Chedron, dov’era un orto», e aggiunge che Giuda «conosceva anch’egli quel luogo, perché Gesù s’era molte volte ritrovato là coi suoi discepoli». Luca non nomina alcun giardino, solo il monte: Gesù «andò, secondo il suo solito, al monte degli Ulivi», e si staccò dai discepoli «circa un tiro di sasso». Messo insieme, il luogo era un oliveto recintato ai piedi del monte, a breve distanza dalla città dopo la cena, dove Gesù pregò tre volte e fu arrestato."
    - "Ai pellegrini il luogo veniva mostrato dal IV secolo. L’Onomasticon di Eusebio pone il Getsemani ai piedi del Monte degli Ulivi, dove i fedeli pregavano, e la versione latina di Girolamo aggiunge che vi sorgeva una chiesa; Egeria, verso il 384, descrive la veglia del Giovedì Santo che si concludeva al Getsemani prima dell’alba. Quella chiesa bizantina era in rovina nel Medioevo, i Crociati ne costruirono un’altra, e nel 1919–1924 i Francescani innalzarono la Chiesa di Tutte le Nazioni sulle fondamenta di entrambe, sopra la roccia venerata come luogo dell’agonia. Il giardino accanto ha otto olivi antichi; uno studio del 2015 data al XII secolo i tronchi di tre di essi, perciò non sono gli alberi dei Vangeli, benché le radici possano essere più antiche. Sono rivendicati anche la Grotta del Getsemani a nord, il giardino russo più in alto e il terreno greco-ortodosso."
  cs:
    - "Getsemane leželo na úpatí Olivové hory, za údolím Kidronu východně od Chrámové hory v Jeruzalémě; bod na mapě stojí v zahradě vedle Chrámu všech národů, asi 600 m od bodu Jeruzaléma a asi 900 m od tradiční Golgoty vzdušnou čarou. Jméno je aramejské, gat šemanim, „lis na olej“: byl to olivový háj s lisem na svahu, kde cesta z města stoupá k Betanii. Jeho obecná poloha je jistá, jeho přesné hranice ne; stránka o Golgotě uvádí soupeřící místa a tato sleduje samotnou zahradu."
    - "Matouš a Marek je nazývají místem, pozemkem: „Tedy přišel s nimi Ježíš na místo, kteréž sloulo Getsemany. I dí učedlníkům: Poseďtež tuto, ažť odejda, pomodlím se tamto.“ Jan je nazývá zahradou: Ježíš „vyšel s učedlníky svými přes potok Cedron, kdež byla zahrada“, a dodává: „Věděl pak i Jidáš, zrádce jeho, to místo; nebo často chodíval tam Ježíš s učedlníky svými.“ Lukáš nejmenuje zahradu, jen horu: Ježíš „vyšed podle obyčeje svého, šel na horu Olivovou“ a vzdálil se od učedníků, „jako by mohl kamenem dohoditi“. Dohromady bylo místo oploceným olivovým sadem na úpatí hory, kousek cesty z města po večeři, kde se Ježíš třikrát modlil a byl zatčen."
    - "Poutníkům se místo ukazovalo od 4. století. Eusebiův Onomasticon klade Getsemane na úpatí Olivové hory, kam věřící přicházeli se modlit, a Jeronýmova latinská verze dodává, že tam byl postaven kostel; Egerie kolem roku 384 popisuje bdění noci na Zelený čtvrtek, které končilo v Getsemane před svítáním. Tento byzantský kostel byl ve středověku v troskách, křižáci postavili další a v letech 1919–1924 františkáni vztyčili Chrám všech národů na základech obou, nad skálou uctívanou jako místo agónie. Zahrada vedle něj uchovává osm starověkých oliv; studie datování zveřejněná roku 2015 zařadila kmeny tří z nich do 12. století, takže nejsou stromy z evangelií, ačkoli jejich kořeny mohou být starší. Getsemanská jeskyně na severu, ruská zahrada výše na svahu a řecký pravoslavný pozemek si také nárokují."
  nl:
    - "Getsemane lag aan de voet van de Olijfberg, aan de overkant van het Kidrondal ten oosten van de Tempelberg van Jeruzalem; het punt op de kaart staat bij de tuin naast de Kerk van Alle Naties, hemelsbreed ongeveer 600 m van het punt van Jeruzalem en ongeveer 900 m van het traditionele Golgota. De naam is Aramees, gat shemanim, “oliepers”: het was een olijfgaard met een pers op de helling waar de weg uit de stad omhoog loopt naar Bethanië. De ligging in grote lijnen staat vast, de exacte grenzen niet; de pagina over Golgota noemt de rivaliserende plekken, en deze volgt de tuin zelf."
    - "Mattheüs en Marcus noemen het een plaats, een stuk grond: “Toen ging Jezus met hen in een plaats genaamd Gethsemane, en zeide tot de discipelen: Zit hier neder, totdat Ik heenga, en aldaar zal gebeden hebben.” Johannes noemt het een hof: Jezus “ging uit met Zijn discipelen over de beek Kedron, waar een hof was”, en voegt toe dat Judas “wist ook die plaats, dewijl Jezus aldaar dikwijls vergaderd was geweest met Zijn discipelen”. Lukas noemt geen hof, alleen de berg: Jezus vertrok, “gelijk Hij gewoon was, naar den Olijfberg”, en scheidde Zich van de leerlingen af “omtrent een steenworp”. Samengenomen was de plaats een omheinde olijfgaard aan de voet van de berg, na de maaltijd een korte wandeling van de stad, waar Jezus driemaal bad en gevangen werd genomen."
    - "Pelgrims zagen de plaats al sinds de vierde eeuw. Eusebius' Onomasticon plaatst Getsemane aan de voet van de Olijfberg, waar gelovigen kwamen bidden, en Hieronymus' Latijnse versie voegt toe dat er een kerk stond; Egeria beschrijft rond 384 de nachtwake van Witte Donderdag die voor het ochtendgloren eindigde bij Getsemane. Die Byzantijnse kerk lag in de middeleeuwen in puin, kruisvaarders bouwden een andere, en in 1919–1924 bouwden de franciscanen de Kerk van Alle Naties op de funderingen van beide, boven de als doodsstrijdplaats vereerde rots. De tuin ernaast heeft acht oude olijven; een dateringsstudie uit 2015 plaatste de stammen van drie ervan in de twaalfde eeuw, dus het zijn niet de bomen uit de evangeliën, al kunnen de wortels ouder zijn. De Getsemanegrot ten noorden, de Russische tuin hoger op de helling en het Grieks-orthodoxe perceel worden ook opgeëist."
