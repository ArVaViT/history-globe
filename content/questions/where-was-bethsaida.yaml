id: where-was-bethsaida
question:
  en: "Where was Bethsaida?"
  ru: "Где находилась Вифсаида?"
  uk: "Де була Віфсаїда?"
  es: "¿Dónde estaba Betsaida?"
  pt: "Onde ficava Betsaida?"
  de: "Wo lag Betsaida?"
  fr: "Où se trouvait Bethsaïda ?"
  pl: "Gdzie leżała Betsaida?"
  it: "Dov’era Betsaida?"
  nl: "Waar lag Bethsaïda?"
  cs: "Kde byla Betsaida?"
  sv: "Var låg Betsaida?"
  nb: "Hvor lå Betsaida?"
answer:
  en:
    - "Bethsaida, “house of fishing”, lay at the north end of the Sea of Galilee near where the Jordan enters the lake, east of the river, about 6 km north-east of Capernaum in a straight line. Its exact site is disputed between two ruins: et-Tell, a mound about 2 km from today's shore, excavated since 1987 under Rami Arav, where the map's point stands, and el-Araj, on the shore by the river mouth, excavated in recent years by Mordechai Aviam and R. Steven Notley. The map marks the point as disputed and lists the candidate sites."
    - 'Bethsaida was the home town of three apostles: "Now Philip was of Bethsaida, the city of Andrew and Peter." Near it Jesus withdrew with the apostles "into a desert place belonging to the city called Bethsaida", where the crowds followed and were fed; once he sent the disciples ahead by boat "unto Bethsaida"; and there "they bring a blind man unto him", whom he led out of the town and healed in two stages. With Chorazin it was reproached: "Woe unto thee, Chorazin! woe unto thee, Bethsaida!" John calls it "Bethsaida of Galilee", although it lay east of the Jordan in the tetrarchy of Philip, which has led some to suppose two Bethsaidas; the map keeps one site for all the verses.'
    - "At et-Tell lies a fortified city of the Iron Age with a massive gate, which its excavators take for a capital of the kingdom of Geshur, a widely held but unproven view; it was destroyed in the late eighth century BC, probably by Tiglath-pileser III about 732 BC. Josephus says that Philip the tetrarch raised the village of Bethsaida to a city named Julias and died there about AD 34; Pliny places Julias on the eastern shore, and Eusebius knew Bethsaida as the city of Andrew, Peter and Philip by the lake. At el-Araj the excavators have found Roman remains, which they take for Julias, and a Byzantine basilica whose inscriptions invoke Saint Peter, which they see as the church Byzantine tradition built over the apostles' home."
  ru:
    - "Вифсаида, «дом рыбной ловли», лежала у северного конца Галилейского моря близ впадения Иордана в озеро, к востоку от реки, примерно в 6 км к северо-востоку от Капернаума по прямой. Точное место спорно между двумя городищами: Эт-Телль, холм примерно в 2 км от нынешнего берега, где с 1987 года копают под руководством Рами Арава и где стоит точка карты, и Эль-Арадж на берегу у устья реки, который в последние годы раскапывают Мордехай Авиам и Р. Стивен Нотли. Карта помечает точку как спорную и перечисляет предлагаемые места."
    - "Из Вифсаиды были родом три апостола: «Филипп же был из Вифсаиды, из одного города с Андреем и Петром». Близ неё Иисус удалился с апостолами «в пустое место, близ города, называемого Вифсаидою», куда пришёл народ и был накормлен; однажды Он отправил учеников на лодке вперёд «к Вифсаиде»; и здесь «приводят к Нему слепого», которого Он вывел из селения и исцелил в два приёма. Вместе с Хоразином она услышала укор: «горе тебе, Хоразин! горе тебе, Вифсаида!» Иоанн говорит о Филиппе «из Вифсаиды Галилейской», хотя она лежала к востоку от Иордана, во владениях Филиппа, и это навело некоторых на мысль о двух Вифсаидах; карта держит одно место для всех стихов."
    - "В Эт-Телле лежит укреплённый город железного века с массивными воротами, в котором раскопщики видят столицу царства Гессур, — мнение распространённое, но не доказанное; город был разрушен в конце VIII века до н. э., вероятно, Тиглатпаласаром III около 732 г. до н. э. Иосиф Флавий пишет, что четвертовластник Филипп возвёл селение Вифсаиду в ранг города, назвав его Юлиадой, и умер там около 34 г. н. э.; Плиний помещает Юлиаду на восточном берегу, а Евсевий знал Вифсаиду как город Андрея, Петра и Филиппа у озера. В Эль-Арадже раскопщики нашли остатки римского времени, которые считают Юлиадой, и византийскую базилику с надписями, призывающими святого Петра, в которой видят церковь, построенную византийским преданием над домом апостолов."
  uk:
    - "Віфсаїда, «дім рибальства», лежала на північному кінці Галілейського моря біля місця, де Йордан впадає в озеро, на схід від річки, приблизно за 6 км на північний схід від Капернауму по прямій. Її точне місце спірне між двома руїнами: ет-Телл, пагорб приблизно за 2 км від нинішнього берега, розкопуваний з 1987 р. під керівництвом Рамі Арава, де стоїть точка мапи, та ель-Арадж, на березі біля гирла річки, розкопуваний останніми роками Мордехаєм Авіамом і Р. Стівеном Нотлі. Мапа позначає точку як спірну й перелічує місця-кандидати."
    - "Віфсаїда була рідним містом трьох апостолів: «Був же Филип із Витсаїди, з города Андреєвого та Петрового». Біля неї Ісус відійшов з апостолами «у місце пусте города, званого Витсаїда», куди пішли юрби й були нагодовані; одного разу Він послав учнів уперед човном «на той бік попереду ʼд Витсаїдї»; і там «приводять Йому слїпого», якого Він вивів із села й зцілив у два етапи. Разом із Хоразином її було докорено: «Горе тобі, Хоразине! горе тобі, Витсаїдо!» Іван називає її «Витсаїди Галилейської», хоча вона лежала на схід від Йордану в тетрархії Пилипа, що спонукало деяких припустити дві Віфсаїди; мапа лишає одне місце для всіх віршів."
    - "В ет-Телл лежить укріплене місто залізної доби з масивною брамою, яке його археологи вважають столицею царства Гешур, — широко поширений, але недоведений погляд; воно було зруйноване наприкінці VIII ст. до н. е., імовірно Тіглатпаласаром III близько 732 р. до н. е. Йосиф Флавій каже, що тетрарх Пилип піднісся село Віфсаїду до міста, названого Юлією, і помер там близько 34 р. н. е.; Пліній ставить Юлію на східному березі, а Євсевій знав Віфсаїду як місто Андрія, Петра й Пилипа біля озера. В ель-Араджі археологи знайшли римські рештки, які вважають Юлією, і візантійську базиліку, написи якої закликають святого Петра, яку вони бачать як церкву, що її візантійська традиція збудувала над домом апостолів."
  es:
    - "Betsaida, «casa de la pesca», se hallaba en el extremo norte del mar de Galilea, cerca de donde el Jordán entra en el lago, al este del río, a unos 6 km al noreste de Cafarnaúm en línea recta. Su emplazamiento exacto se discute entre dos ruinas: et-Tell, un tell a unos 2 km de la orilla actual, excavado desde 1987 bajo Rami Arav, donde está el punto del mapa, y el-Araj, en la orilla junto a la desembocadura del río, excavado en los últimos años por Mordechai Aviam y R. Steven Notley. El mapa marca el punto como discutido y enumera los lugares candidatos."
    - "Betsaida fue la ciudad natal de tres apóstoles: «Y era Felipe de Bethsaida, la ciudad de Andrés y de Pedro». Cerca de ella Jesús se retiró con los apóstoles «aparte á un lugar desierto de la ciudad que se llama Bethsaida», adonde la multitud lo siguió y fue alimentada; una vez envió por delante a los discípulos en barca «á Bethsaida»; y allí «le traen un ciego», al que sacó de la aldea y sanó en dos etapas. Junto con Corazín fue reprendida: «¡Ay de ti, Corazín! ¡Ay de ti, Bethsaida!». Juan la llama «Bethsaida de Galilea», aunque quedaba al este del Jordán, en la tetrarquía de Felipe, lo que ha llevado a algunos a suponer dos Betsaidas; el mapa mantiene un solo lugar para todos los versículos."
    - "En et-Tell yace una ciudad fortificada de la Edad del Hierro con una puerta monumental, que sus excavadores toman por una capital del reino de Gesur, opinión muy extendida pero no demostrada; fue destruida a finales del siglo VIII a. C., probablemente por Tiglat-pileser III hacia el 732 a. C. Josefo dice que Felipe el tetrarca elevó la aldea de Betsaida a ciudad con el nombre de Julias y murió allí hacia el 34 d. C.; Plinio sitúa Julias en la orilla oriental, y Eusebio conocía Betsaida como la ciudad de Andrés, Pedro y Felipe junto al lago. En el-Araj los excavadores han hallado restos romanos, que toman por Julias, y una basílica bizantina cuyas inscripciones invocan a san Pedro, en la que ven la iglesia que la tradición bizantina construyó sobre la casa de los apóstoles."
  pt:
    - "Betsaida, “casa da pesca”, ficava na ponta norte do mar da Galileia, perto de onde o Jordão entra no lago, a leste do rio, a cerca de 6 km a nordeste de Cafarnaum em linha reta. Seu local exato é disputado entre duas ruínas: et-Tell, um montículo a cerca de 2 km da margem de hoje, escavado desde 1987 sob Rami Arav, onde está o ponto do mapa, e el-Araj, na margem junto à foz do rio, escavado nos últimos anos por Mordechai Aviam e R. Steven Notley. O mapa marca o ponto como disputado e lista os locais candidatos."
    - "Betsaida era a cidade natal de três apóstolos: “Filipe era de Betsaida, a cidade de André e Pedro.” Perto dela Jesus se retirou com os apóstolos “para uma região deserta de uma cidade chamada Betsaida”, onde as multidões o seguiram e foram alimentadas; certa vez mandou os discípulos adiante de barco “para Betsaida”; e ali “trouxeram-lhe um cego”, que ele levou para fora da aldeia e curou em duas etapas. Com Corazim foi repreendida: “Ai de você, Corazim! Ai de você, Betsaida!” João a chama “Betsaida da Galileia”, embora ficasse a leste do Jordão, na tetrarquia de Filipe, o que levou alguns a supor duas Betsaidas; o mapa mantém um só local para todos os versículos."
    - "Em et-Tell jaz uma cidade fortificada da Idade do Ferro com uma porta maciça, que seus escavadores tomam por capital do reino de Gesur, opinião muito difundida mas não provada; foi destruída no fim do século VIII a.C., provavelmente por Tiglate-Pileser III, por volta de 732 a.C. Josefo diz que Filipe, o tetrarca, elevou a aldeia de Betsaida a cidade chamada Júlias e morreu ali por volta de 34 d.C.; Plínio situa Júlias na margem oriental, e Eusébio conhecia Betsaida como a cidade de André, Pedro e Filipe junto ao lago. Em el-Araj os escavadores acharam restos romanos, que tomam por Júlias, e uma basílica bizantina cujas inscrições invocam São Pedro, que veem como a igreja que a tradição bizantina ergueu sobre a casa dos apóstolos."
  de:
    - "Betsaida, „Haus des Fischfangs“, lag am Nordende des Sees Genezareth nahe der Mündung des Jordan, östlich des Flusses, in der Luftlinie etwa 6 km nordöstlich von Kapernaum. Seine genaue Lage ist zwischen zwei Ruinen umstritten: et-Tell, ein Hügel etwa 2 km vom heutigen Ufer, seit 1987 unter Rami Arav ausgegraben, wo der Kartenpunkt steht, und el-Araj, am Ufer bei der Flussmündung, in den letzten Jahren von Mordechai Aviam und R. Steven Notley ausgegraben. Die Karte kennzeichnet den Punkt als umstritten und führt die infrage kommenden Stätten auf."
    - "Betsaida war die Heimatstadt dreier Apostel: „Philippus aber war von Bethsaida, aus der Stadt des Andreas und Petrus.“ In seiner Nähe zog sich Jesus mit den Aposteln „besonders in eine Wüste bei der Stadt, die da heißt Bethsaida“ zurück, wo die Menge folgte und gespeist wurde; einmal schickte er die Jünger im Boot voraus, „gen Bethsaida“; und dort „sie brachten zu ihm einen Blinden“, den er vor das Dorf führte und in zwei Schritten heilte. Mit Chorazin wurde es gescholten: „Wehe dir Chorazin! Weh dir, Bethsaida!“ Johannes nennt es „Bethsaida aus Galiläa“, obwohl es östlich des Jordan im Gebiet des Vierfürsten Philippus lag, was manche auf zwei Betsaidas schließen ließ; die Karte behält für alle Verse eine Stätte."
    - "In et-Tell liegt eine befestigte Stadt der Eisenzeit mit einem mächtigen Tor, die ihre Ausgräber für eine Hauptstadt des Königreichs Geschur halten, eine weit verbreitete, aber unbewiesene Ansicht; sie wurde im späten 8. Jahrhundert v. Chr. zerstört, wohl von Tiglat-Pileser III. um 732 v. Chr. Josephus sagt, der Vierfürst Philippus habe das Dorf Betsaida zur Stadt Julias erhoben und sei dort um 34 n. Chr. gestorben; Plinius legt Julias ans Ostufer, und Eusebius kannte Betsaida als Stadt des Andreas, Petrus und Philippus am See. In el-Araj haben die Ausgräber römische Reste gefunden, die sie für Julias halten, und eine byzantinische Basilika, deren Inschriften den heiligen Petrus anrufen, was sie als die Kirche sehen, die die byzantinische Überlieferung über dem Haus der Apostel baute."
  fr:
    - "Bethsaïda, « maison de pêche », se trouvait à l’extrémité nord de la mer de Galilée, près de l’entrée du Jourdain dans le lac, à l’est du fleuve, à environ 6 km au nord-est de Capernaüm en ligne droite. Son site exact se dispute entre deux ruines : et-Tell, un tertre à environ 2 km du rivage actuel, fouillé depuis 1987 sous Rami Arav, où se trouve le point de la carte, et el-Araj, sur la rive près de l’embouchure du fleuve, fouillé ces dernières années par Mordechai Aviam et R. Steven Notley. La carte marque le point comme discuté et énumère les sites candidats."
    - "Bethsaïda était la ville natale de trois apôtres : « Philippe était de Bethsaïda, de la ville d’André et de Pierre. » Près d’elle Jésus se retira avec les apôtres « à l’écart, du côté d’une ville appelée Bethsaïda », où les foules le suivirent et furent nourries ; une fois, il envoya les disciples en avant en barque « vers Bethsaïda » ; et là « on amena vers Jésus un aveugle », qu’il conduisit hors du village et guérit en deux temps. Avec Chorazin elle fut réprimandée : « Malheur à toi, Chorazin ! Malheur à toi, Bethsaïda ! » Jean l’appelle « Bethsaïda en Galilée », bien qu’elle se trouvât à l’est du Jourdain, dans la tétrarchie de Philippe, ce qui a conduit certains à supposer deux Bethsaïda ; la carte garde un seul site pour tous les versets."
    - "À et-Tell se trouve une ville fortifiée de l’âge du Fer avec une porte massive, que ses fouilleurs prennent pour une capitale du royaume de Gueschur, thèse largement répandue mais non prouvée ; elle fut détruite à la fin du VIIIe siècle av. J.-C., probablement par Tiglath-Piléser III vers 732 av. J.-C. Josèphe dit que le tétrarque Philippe éleva le village de Bethsaïda au rang de ville nommée Julias et y mourut vers 34 apr. J.-C. ; Pline place Julias sur la rive orientale, et Eusèbe connaissait Bethsaïda comme la ville d’André, de Pierre et de Philippe près du lac. À el-Araj, les fouilleurs ont trouvé des vestiges romains, qu’ils prennent pour Julias, et une basilique byzantine dont les inscriptions invoquent saint Pierre, qu’ils voient comme l’église que la tradition byzantine bâtit sur la maison des apôtres."
  pl:
    - "Betsaida, „dom rybołówstwa”, leżała na północnym krańcu Jeziora Galilejskiego, tam gdzie Jordan wpada do jeziora, na wschód od rzeki, około 6 km na północny wschód od Kafarnaum w linii prostej. Jej dokładne położenie jest sporne między dwoma ruinami: et-Tell, kopcem około 2 km od dzisiejszego brzegu, wykopywanym od 1987 pod kierunkiem Rami Arava, gdzie stoi punkt na mapie, i el-Araj, na brzegu przy ujściu rzeki, wykopywanym w ostatnich latach przez Mordechaja Aviama i R. Stevena Notleya. Mapa oznacza punkt jako sporny i wymienia kandydujące miejsca."
    - "Betsaida była rodzinnym miastem trzech apostołów: „A Filip był z Betsaidy, z miasta Andrzejowego i Piotrowego.” W jej pobliżu Jezus ustąpił z apostołami „osobno na miejsce puste przy mieście, które zowią Betsaida”, gdzie poszły za nim tłumy i zostały nakarmione; raz posłał uczniów przodem łodzią „ku Betsaidzie”; i tam „przywiedli do niego ślepego”, którego wyprowadził z miasteczka i uzdrowił w dwóch etapach. Wraz z Korozain została zganiona: „Biada tobie Chorazynie! biada tobie Betsaido!” Jan wiąże z nią Filipa, który „był z Betsaidy Galilejskiej”, choć leżała na wschód od Jordanu w tetrarchii Filipa, co skłoniło niektórych do przypuszczenia dwóch Betsaid; mapa zachowuje jedno miejsce dla wszystkich wersetów."
    - "W et-Tell leży ufortyfikowane miasto z epoki żelaza z masywną bramą, które jego odkrywcy biorą za stolicę królestwa Geszuru, pogląd szeroko przyjmowany, lecz nieudowodniony; zniszczono je pod koniec VIII wieku p.n.e., prawdopodobnie przez Tiglat-Pilesera III około 732 p.n.e. Józef Flawiusz mówi, że tetrarcha Filip podniósł wieś Betsaida do rangi miasta zwanego Julias i zmarł tam około 34 n.e.; Pliniusz umieszcza Julias na wschodnim brzegu, a Euzebiusz znał Betsaidę jako miasto Andrzeja, Piotra i Filipa nad jeziorem. W el-Araj odkrywcy znaleźli pozostałości rzymskie, które biorą za Julias, i bizantyjską bazylikę, której napisy wzywają świętego Piotra, w której widzą kościół, jaki tradycja bizantyjska zbudowała nad domem apostołów."
  it:
    - "Betsaida, «casa della pesca», sorgeva all’estremità nord del lago di Tiberiade vicino a dove il Giordano entra nel lago, a est del fiume, a circa 6 km a nord-est di Cafarnao in linea retta. Il suo sito esatto è discusso tra due rovine: et-Tell, un tumulo a circa 2 km dalla riva odierna, scavato dal 1987 sotto Rami Arav, dove sta il punto della mappa, ed el-Araj, sulla riva presso la foce del fiume, scavata negli ultimi anni da Mordechai Aviam e R. Steven Notley. La mappa segna il punto come discusso ed elenca i siti candidati."
    - "Betsaida era la città natale di tre apostoli: «Or Filippo era di Betsaida, della città d’Andrea e di Pietro». Presso di essa Gesù si ritirò con gli apostoli «in disparte verso una città chiamata Betsaida», dove le folle lo seguirono e furono sfamate; una volta mandò avanti i discepoli in barca «verso Betsaida»; e là «gli fu menato un cieco», che condusse fuori dal villaggio e guarì in due tempi. Con Corazin fu rimproverata: «Guai a te, Corazin! Guai a te, Betsaida!» Giovanni la chiama «Betsaida di Galilea», benché giacesse a est del Giordano nella tetrarchia di Filippo, il che ha indotto alcuni a supporre due Betsaide; la mappa mantiene un solo sito per tutti i versetti."
    - "A et-Tell giace una città fortificata dell’età del Ferro con una massiccia porta, che i suoi scavatori ritengono la capitale del regno di Ghesur, opinione diffusa ma non provata; fu distrutta alla fine dell’VIII secolo a.C., probabilmente da Tiglat-Pilèser III intorno al 732 a.C. Giuseppe Flavio dice che Filippo il tetrarca elevò il villaggio di Betsaida a città col nome di Giulia e vi morì intorno al 34 d.C.; Plinio pone Giulia sulla riva orientale, ed Eusebio conosceva Betsaida come la città di Andrea, Pietro e Filippo presso il lago. A el-Araj gli scavatori hanno trovato resti romani, che ritengono Giulia, e una basilica bizantina le cui iscrizioni invocano san Pietro, che vedono come la chiesa che la tradizione bizantina costruì sulla casa degli apostoli."
  nl:
    - "Bethsaïda, “huis van de visvangst”, lag aan het noordeinde van het Meer van Galilea, bij de plaats waar de Jordaan het meer instroomt, ten oosten van de rivier, hemelsbreed ongeveer 6 km ten noordoosten van Kafarnaüm. De exacte plek is omstreden tussen twee ruïnes: et-Tell, een heuvel ongeveer 2 km van de huidige oever, sinds 1987 opgegraven onder Rami Arav, waar het punt op de kaart staat, en el-Araj, aan de oever bij de riviermonding, de laatste jaren opgegraven door Mordechai Aviam en R. Steven Notley. De kaart markeert het punt als omstreden en noemt de kandidaatplaatsen."
    - "Bethsaïda was de geboortestad van drie apostelen: “Filippus nu was van Bethsaida, uit de stad van Andreas en Petrus.” Daar in de buurt trok Jezus zich met de apostelen terug “in een woeste plaats der stad, genaamd Bethsaida”, waar de menigten volgden en gevoed werden; eens zond Hij de discipelen per boot vooruit “tegen over Bethsaida”; en daar “zij brachten tot Hem een blinde”, die Hij de stad uitleidde en in twee fasen genas. Samen met Chorazin werd het bestraft: “Wee u, Chorazin! wee u Bethsaida!” Johannes noemt het “Bethsaida in Galilea”, hoewel het ten oosten van de Jordaan lag in de tetrarchie van Filippus, wat sommigen tot de veronderstelling van twee Bethsaïda’s heeft geleid; de kaart houdt voor alle verzen één plaats aan."
    - "Te et-Tell ligt een versterkte stad uit de IJzertijd met een massieve poort, die de opgravers houden voor een hoofdstad van het koninkrijk Gesur, een wijdverbreide maar onbewezen opvatting; zij werd aan het eind van de achtste eeuw v.Chr. verwoest, waarschijnlijk door Tiglat-Pileser III omstreeks 732 v.Chr. Josephus zegt dat Filippus de viervorst het dorp Bethsaïda tot een stad verhief die Julias heette en er omstreeks 34 n.Chr. stierf; Plinius plaatst Julias aan de oostoever, en Eusebius kende Bethsaïda als de stad van Andreas, Petrus en Filippus aan het meer. Te el-Araj hebben de opgravers Romeinse resten gevonden, die zij houden voor Julias, en een Byzantijnse basiliek met inscripties die Sint-Petrus aanroepen, die zij zien als de kerk die de Byzantijnse overlevering boven het huis van de apostelen bouwde."
  cs:
    - "Betsaida, „dům rybolovu“, ležela na severním konci Galilejského jezera poblíž místa, kde se do jezera vlévá Jordán, východně od řeky, asi 6 km severovýchodně od Kafarnaa vzdušnou čarou. Její přesné místo je sporné mezi dvěma zříceninami: at-Tell, pahorek asi 2 km od dnešního břehu, zkoumaný od roku 1987 pod vedením Ramiho Arava, kde stojí bod na mapě, a al-Araj, na břehu u ústí řeky, zkoumaný v posledních letech Mordechajem Aviamem a R. Stevenem Notleyem. Mapa označuje bod jako sporný a uvádí kandidátská místa."
    - "Betsaida byla rodným městem tří apoštolů: „A byl Filip z Betsaidy, města Ondřejova a Petrova.“ V její blízkosti se Ježíš s apoštoly stáhl „na místo pusté města řečeného Betsaida“, kam zástupy šly za ním a byly nasyceny; jednou poslal učedníky napřed lodí „do Betsaidy“; a tam „přivedli k němu slepého“, kterého vyvedl z městečka a uzdravil ve dvou fázích. S Korozaim byla vytýkána: „Běda tobě Korozaim, běda tobě Betsaido.“ Jan o Filipovi říká, že byl „od Betsaidy Galilejské“, ačkoli ležela východně od Jordánu v tetrarchii Filipově, což vedlo některé k domněnce dvou Betsaid; mapa ponechává pro všechny verše jedno místo."
    - "Na at-Tell leží opevněné město doby železné s mohutnou bránou, které vykopavači pokládají za hlavní město království Gešur, názor široce přijímaný, ale nedokázaný; bylo zničeno koncem 8. století př. n. l., pravděpodobně Tiglatpilesarem III. kolem roku 732 př. n. l. Josephus Flavius říká, že tetrarcha Filip povýšil vesnici Betsaidu na město nazvané Julias a zemřel tam kolem roku 34 n. l.; Plinius klade Julias na východní břeh a Eusebios znal Betsaidu jako město Ondřeje, Petra a Filipa u jezera. V al-Aradž vykopavači našli římské pozůstatky, které pokládají za Julias, a byzantskou baziliku, jejíž nápisy vzývají svatého Petra, v níž vidí kostel, který byzantská tradice postavila nad domovem apoštolů."
  sv:
    - "Betsaida, ”fiskets hus”, låg vid Galileiska sjöns norra ände nära där Jordan rinner in i sjön, öster om floden, omkring 6 km nordost om Kafarnaum fågelvägen. Dess exakta läge är omstritt mellan två ruiner: et-Tell, en kulle omkring 2 km från dagens strand, utgrävd sedan 1987 under Rami Arav, där kartans punkt står, och el-Araj, vid stranden nära flodmynningen, utgrävd de senaste åren av Mordechai Aviam och R. Steven Notley. Kartan markerar punkten som omstridd och förtecknar kandidatplatserna."
    - "Betsaida var hemstad för tre apostlar: ”Och Filippus var från Betsaida, Andreas’ och Petrus’ stad.” Nära den drog sig Jesus undan med apostlarna ”till en stad som hette Betsaida, där de kunde vara allena”, där folkmassorna följde och mättades; en gång sände han lärjungarna i förväg i båt ”till Betsaida”; och där ”kommo de till Betsaida. Och man förde till honom en som var blind”, som han ledde ut ur byn och botade i två steg. Tillsammans med Korasin fick den en förebråelse: ”Ve dig, Korasin! Ve dig, Betsaida!” Johannes kallar den ”Betsaida i Galileen”, fastän den låg öster om Jordan i Filippos tetrarki, vilket har fått några att anta två Betsaida; kartan behåller en plats för alla verserna."
    - "Vid et-Tell ligger en befäst stad från järnåldern med en massiv port, som dess utgrävare håller för en huvudstad i kungariket Geshur, en vitt hållen men obevisad uppfattning; den förstördes i slutet av 700-talet f.Kr., sannolikt av Tiglat-Pileser III omkring 732 f.Kr. Josefus säger att tetrarken Filippos upphöjde byn Betsaida till en stad som fick namnet Julias och dog där omkring 34 e.Kr.; Plinius placerar Julias på östra stranden, och Eusebios kände Betsaida som Andreas’, Petrus’ och Filippos’ stad vid sjön. Vid el-Araj har utgrävarna funnit romerska lämningar, som de håller för Julias, och en bysantinsk basilika vars inskriptioner åkallar Sankt Petrus, vilken de ser som kyrkan som bysantinsk tradition byggde över apostlarnas hem."
  nb:
    - "Betsaida, «fiskehuset», lå ved nordenden av Galileasjøen, nær der Jordan løper ut i innsjøen, øst for elven, omtrent 6 km nordøst for Kapernaum i luftlinje. Dets nøyaktige sted er omstridt mellom to ruiner: et-Tell, en haug omtrent 2 km fra dagens strand, utgravd siden 1987 under Rami Arav, der kartets punkt står, og el-Araj, på stranden ved elvemunningen, utgravd de siste årene av Mordechai Aviam og R. Steven Notley. Kartet markerer punktet som omstridt og lister kandidatstedene."
    - "Betsaida var hjembyen til tre apostler: «Men Filip var fra Betsaida, Andreas' og Peters by.» Nær den trakk Jesus seg tilbake med apostlene «avsides til en by som heter Betsaida», der folkemengdene fulgte etter og ble mettet; en gang sendte han disiplene i forveien i båt «til Betsaida»; og der førte de «en blind til ham», som han førte ut av byen og helbredet i to trinn. Sammen med Korasin ble den refset: «Ve dig, Korasin! ve dig, Betsaida!» Johannes kaller den «Betsaida i Galilea», selv om den lå øst for Jordan i Filips tetrarki, noe som har fått noen til å anta to Betsaida; kartet beholder ett sted for alle versene."
    - "Ved et-Tell ligger en befestet by fra jernalderen med en massiv port, som utgraverne regner for en hovedstad i kongeriket Gesjur, et utbredt, men ubevist syn; den ble ødelagt seint på 700-tallet f.Kr., trolig av Tiglat-Pileser III omkring 732 f.Kr. Josefus sier at tetrarken Filip løftet landsbyen Betsaida til en by med navnet Julias og døde der omkring 34 e.Kr.; Plinius plasserer Julias på østkysten, og Eusebius kjente Betsaida som Andreas', Peters og Filips by ved innsjøen. Ved el-Araj har utgraverne funnet romerske rester, som de regner for Julias, og en bysantinsk basilika hvis innskrifter påkaller den hellige Peter, som de ser som kirken bysantinsk tradisjon bygget over apostlenes hjem."
