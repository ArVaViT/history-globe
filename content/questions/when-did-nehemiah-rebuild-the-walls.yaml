id: when-did-nehemiah-rebuild-the-walls
question:
  en: "When did Nehemiah rebuild the walls of Jerusalem?"
  ru: "Когда Неемия восстановил стены Иерусалима?"
  uk: "Коли Неемія відбудував мури Єрусалиму?"
  es: "¿Cuándo reconstruyó Nehemías las murallas de Jerusalén?"
  pt: "Quando Neemias reconstruiu as muralhas de Jerusalém?"
  de: "Wann baute Nehemia die Mauern Jerusalems wieder auf?"
  fr: "Quand Néhémie a-t-il rebâti les murailles de Jérusalem ?"
  pl: "Kiedy Nehemiasz odbudował mury Jerozolimy?"
  it: "Quando Neemia ricostruì le mura di Gerusalemme?"
  nl: "Wanneer herbouwde Nehemia de muren van Jeruzalem?"
  cs: "Kdy Nehemjáš vystavěl hradby Jeruzaléma?"
  sv: "När byggde Nehemja upp Jerusalems murar?"
  nb: "Når gjenreiste Nehemja murene i Jerusalem?"
  tl: "Kailan muling itinayo ni Nehemias ang mga pader ng Jerusalem?"
  da: "Hvornår genopbyggede Nehemias Jerusalems mure?"
  sr: "Када је Немија обновио јерусалимске зидове?"
answer:
  en:
    - "In 445 BC, the twentieth year of Artaxerxes I of Persia, who had come to the throne in 465. Nehemiah heard of the ruin of the walls in the month Chislev, in the winter, at Susa, 1,230 km from Jerusalem in a straight line; he asked leave in Nisan, in the spring, and the wall was finished on the twenty-fifth of Elul, at the start of autumn, after fifty-two days of work. Josephus, telling the story, allows two years and four months instead. Nehemiah governed Judah for twelve years, went back to the king in 433 and returned again. The walls had lain broken since the Babylonians razed them in 587 or 586 BC, nearly a century and a half before, though an attempt to rebuild them earlier in Artaxerxes' reign had been stopped."
    - "The book opens “in the month Chisleu, in the twentieth year, as I was in Shushan the palace”, with the news that “the wall of Jerusalem also is broken down, and the gates thereof are burned with fire”. It was “in the month Nisan, in the twentieth year of Artaxerxes the king” that Nehemiah won his leave. In Jerusalem he rode out by night “by the gate of the valley, even before the dragon well, and to the dung port, and viewed the walls”, and told the rulers, “come, and let us build up the wall of Jerusalem, that we be no more a reproach”. The high priest Eliashib and the priests “builded the sheep gate”, and the work went round the city gate by gate, until “the wall was finished in the twenty and fifth day of the month Elul, in fifty and two days”. Yet “the city was large and great: but the people were few therein, and the houses were not builded”."
    - "The year is firmer than most in the Old Testament: a letter from the Jews of Elephantine in Egypt, written in 407 BC, names the sons of Sanballat, Nehemiah's enemy, as grown men, so Nehemiah's Artaxerxes is the first of that name, not the second. The course of the wall is read from the gates of Nehemiah 3 and from Kathleen Kenyon's digs of 1961–1967, which found a wall on the crest of the eastern ridge above the ruined slope and gave it to Nehemiah: the Persian city was confined to the City of David and the Temple Mount, far smaller than before the exile, with a few hundred to a few thousand people. Israel Finkelstein has doubted that any wall of Nehemiah's can be found; others keep Kenyon's."
  ru:
    - "В 445 г. до н. э., в двадцатый год Артаксеркса I Персидского, вступившего на престол в 465 году. О разрушении стен Неемия услышал в месяце Кислеве, зимой, в Сузах, за 1230 км от Иерусалима по прямой; отпуска он попросил в Нисане, весной, а стена была завершена двадцать пятого Елула, в начале осени, после пятидесяти двух дней работы. Иосиф Флавий, пересказывая историю, отводит на неё два года и четыре месяца. Неемия правил Иудеей двенадцать лет, в 433 году вернулся к царю и приехал снова. Стены лежали в развалинах с тех пор, как вавилоняне срыли их в 587 или 586 г. до н. э., почти полтора века, хотя попытку восстановить их раньше при том же Артаксерксе пресекли."
    - "Книга начинается словами «В месяце Кислеве, в двадцатом году, я находился в Сузах, престольном городе» и вестью о том, что «стена Иерусалима разрушена, и ворота его сожжены огнем». «В месяце Нисане, в двадцатый год царя Артаксеркса» Неемия получил отпуск. В Иерусалиме он ночью проехал «через ворота Долины перед источником Драконовым к воротам Навозным, и осмотрел я стены Иерусалима разрушенные» и сказал начальникам: «пойдем, построим стену Иерусалима, и не будем впредь в таком уничижении». Великий священник Елияшив и священники «построили Овечьи ворота», и работа обошла город от ворот к воротам, пока не пришёл день, о котором сказано: «Стена была совершена в двадцать пятый день месяца Елула, в пятьдесят два дня». И всё же «город был пространен и велик, а народа в нем было немного, и домы не были построены»."
    - "Этот год надёжнее большинства ветхозаветных: письмо иудеев Элефантины в Египте, написанное в 407 г. до н. э., называет сыновей Санаваллата, врага Неемии, взрослыми людьми, так что Артаксеркс Неемии — первый с этим именем, а не второй. Ход стены читают по воротам третьей главы и по раскопкам Кэтлин Кеньон 1961–1967 годов, которая нашла стену на гребне восточного холма над разрушенным склоном и приписала её Неемии: персидский город ограничивался Городом Давидовым и Храмовой горой, был куда меньше, чем до плена, и насчитывал от нескольких сотен до нескольких тысяч жителей. Израэль Финкельштейн сомневается, что стену Неемии вообще можно найти; другие держатся вывода Кеньон."
  uk:
    - "445 р. до н. е., у двадцятому році Артаксеркса I Перського, який зійшов на престол 465 р. Неемія почув про руїну мурів у місяці кислеві, взимку, в Сузах, за 1230 км від Єрусалиму по прямій; він випросив дозвіл у нісані, навесні, а мур було закінчено двадцять п'ятого елула, на початку осені, після п'ятдесяти двох днів роботи. Йосиф Флавій, розповідаючи цю історію, дозволяє натомість два роки й чотири місяці. Неемія правив Юдеєю дванадцять років, 433 р. повернувся до царя й знову повернувся. Мури лежали зруйновані з часу, як вавилоняни розвалили їх 587 або 586 р. до н. е., майже півтора століття тому, хоча спробу відбудувати їх раніше за правління Артаксеркса було зупинено."
    - "Книга починається: «В місяцї Кислеві, двайцятого року, був я в Сузах, столичному містї», з вісткою, що «мур Ерусалимський розвалений, й ворота його попалені огнем». Це було «в місяцї Нисанї, на двайцятім року царя Артаксеркса», коли Неемія здобув дозвіл. В Єрусалимі він виїхав уночі «через Долинні ворота перед Драконовою криницею до воріт Гнояних, і оглядїв я розвалені мури», і сказав правителям: «ходїм, побудуймо мури Ерусалимські й не будьмо довше в пониженнї». Первосвященник Еліашів і священики «збудували Овечі ворота», і робота пішла навколо міста від брами до брами, аж «мур був скінчений двайцять пятого дня місяця Елула, за пятьдесять два днї». Але «місто було просторне й велике, а народа в йому було небагато, й доми не були побудовані»."
    - "Рік певніший за більшість у Старому Заповіті: лист юдеїв з Елефантини в Єгипті, написаний 407 р. до н. е., називає синів Санаваллата, ворога Неемії, дорослими чоловіками, тож Нееміїн Артаксеркс — перший з цього імені, а не другий. Перебіг муру читають із брам Неемії 3 і з розкопок Кетлін Кеньйон 1961–1967 рр., які знайшли мур на гребені східного хребта над зруйнованим схилом і віднесли його до Неемії: перське місто обмежувалося Містом Давида й Храмовою горою, було набагато меншим, ніж до вигнання, із кількома сотнями або кількома тисячами людей. Ізраель Фінкельштейн сумнівається, що можна знайти бодай якийсь мур Неемії; інші тримаються Кеньйон."
  es:
    - "En el 445 a. C., el año veinte de Artajerjes I de Persia, que había subido al trono en el 465. Nehemías supo de la ruina de las murallas en el mes de Quisleu, en invierno, en Susa, a 1230 km de Jerusalén en línea recta; pidió licencia en Nisán, en primavera, y el muro se terminó el día veinticinco de Elul, al comienzo del otoño, tras cincuenta y dos días de trabajo. Josefo, al contar la historia, concede en cambio dos años y cuatro meses. Nehemías gobernó Judá doce años, volvió al rey en el 433 y regresó de nuevo. Las murallas yacían rotas desde que los babilonios las arrasaron en el 587 o 586 a. C., casi siglo y medio antes, aunque un intento de reconstruirlas antes, en el reinado de Artajerjes, había sido detenido."
    - "El libro comienza «en el mes de Chisleu, en el año veinte, estando yo en Susán, capital del reino», con la noticia de que «el muro de Jerusalem derribado, y sus puertas quemadas á fuego». Fue «en el mes de Nisán, en el año veinte del rey Artajerjes» cuando Nehemías obtuvo su licencia. En Jerusalén salió a caballo de noche «por la puerta del Valle hacia la fuente del Dragón y á la puerta del Muladar; y consideré los muros de Jerusalem», y dijo a los gobernantes: «venid, y edifiquemos el muro de Jerusalem, y no seamos más en oprobio». El sumo sacerdote Eliasib y los sacerdotes «edificaron la puerta de las Ovejas», y la obra fue rodeando la ciudad puerta por puerta, hasta que «acabóse pues el muro el veinticinco del mes de Elul, en cincuenta y dos días». Y sin embargo «la ciudad era espaciosa y grande, pero poco pueblo dentro de ella, y no había casas reedificadas»."
    - "El año es más firme que la mayoría en el Antiguo Testamento: una carta de los judíos de Elefantina, en Egipto, escrita en el 407 a. C., nombra como adultos a los hijos de Sanbalat, el enemigo de Nehemías, de modo que el Artajerjes de Nehemías es el primero de ese nombre, no el segundo. El trazado del muro se lee a partir de las puertas de Nehemías 3 y de las excavaciones de Kathleen Kenyon de 1961–1967, que hallaron un muro en la cresta de la loma oriental sobre la ladera arruinada y se lo atribuyeron a Nehemías: la ciudad persa se limitaba a la Ciudad de David y al monte del Templo, mucho más pequeña que antes del exilio, con unos pocos cientos a unos pocos miles de habitantes. Israel Finkelstein ha dudado de que pueda hallarse ningún muro de Nehemías; otros mantienen la tesis de Kenyon."
  pt:
    - "Em 445 a.C., o vigésimo ano de Artaxerxes I da Pérsia, que subira ao trono em 465. Neemias soube da ruína dos muros no mês de quisleu, no inverno, em Susã, a 1.230 km de Jerusalém em linha reta; pediu licença em nisã, na primavera, e o muro ficou pronto no dia 25 de elul, no início do outono, após cinquenta e dois dias de obra. Josefo, ao contar a história, admite dois anos e quatro meses. Neemias governou Judá doze anos, voltou ao rei em 433 e retornou de novo. Os muros estavam derrubados desde que os babilônios os arrasaram em 587 ou 586 a.C., quase século e meio antes, embora uma tentativa anterior de reconstruí-los, no reinado de Artaxerxes, tenha sido interrompida."
    - "O livro começa “no mês de quisleu, no vigésimo ano, enquanto eu estava no palácio de Susã”, com a notícia de que “o muro de Jerusalém também está derrubado, e as suas portas foram queimadas pelo fogo”. Foi “no mês de nisã, no vigésimo ano do rei Artaxerxes” que Neemias obteve a licença. Em Jerusalém saiu de noite “pela Porta do Vale, em direção à Fonte do Chacal, e depois para a Porta do Esterco; e inspecionei as muralhas”, e disse aos chefes: “Venham, vamos reconstruir a muralha de Jerusalém, para que não sejamos mais desonrados”. O sumo sacerdote Eliasibe e os sacerdotes “edificaram a Porta das Ovelhas”, e a obra seguiu em volta da cidade, porta a porta, até que “o muro foi concluído no vigésimo quinto dia do mês de elul, em cinquenta e dois dias”. Contudo “a cidade era espaçosa e grande; mas o povo era pouco nela, e as casas não estavam construídas”."
    - "O ano é mais firme que a maioria no Antigo Testamento: uma carta dos judeus de Elefantina, no Egito, escrita em 407 a.C., cita os filhos de Sambalá, inimigo de Neemias, como adultos, de modo que o Artaxerxes de Neemias é o primeiro com esse nome, não o segundo. O traçado do muro se lê nas portas de Neemias 3 e nas escavações de Kathleen Kenyon, de 1961–1967, que acharam um muro na crista da colina oriental acima da encosta em ruínas e o atribuíram a Neemias: a cidade persa se limitava à Cidade de Davi e ao monte do Templo, bem menor que antes do exílio, com algumas centenas a alguns milhares de pessoas. Israel Finkelstein duvidou de que se possa achar algum muro de Neemias; outros mantêm Kenyon."
  de:
    - "Im Jahr 445 v. Chr., dem zwanzigsten Jahr des Artaxerxes I. von Persien, der 465 den Thron bestiegen hatte. Nehemia hörte in Susa, 1230 km Luftlinie von Jerusalem, im Monat Kislew, im Winter, vom Verfall der Mauern; er erbat im Nisan, im Frühling, Urlaub, und die Mauer war am fünfundzwanzigsten Elul, zu Herbstbeginn, nach zweiundfünfzig Arbeitstagen fertig. Josephus erzählt die Geschichte mit zwei Jahren und vier Monaten. Nehemia verwaltete Juda zwölf Jahre, kehrte 433 zum König zurück und kam wieder. Die Mauern lagen zerbrochen, seit die Babylonier sie 587 oder 586 v. Chr. geschleift hatten, fast anderthalb Jahrhunderte, obwohl ein früherer Versuch, sie wiederaufzubauen, unter Artaxerxes gestoppt worden war."
    - "Das Buch beginnt: „Es geschah im Monat Chislev des zwanzigsten Jahres, da ich war zu Susan auf dem Schloß“, mit der Nachricht: „die Mauern Jerusalems sind zerbrochen und seine Tore mit Feuer verbrannt“. „Im Monat Nisan des zwanzigsten Jahres des Königs Arthahsastha“ erlangte Nehemia seinen Urlaub. In Jerusalem ritt er bei Nacht aus: „Und ich ritt zum Taltor aus bei der Nacht und gegen den Drachenbrunnen und an das Misttor“, und sagte den Vorstehern: „Kommt, laßt uns die Mauern Jerusalems bauen, daß wir nicht mehr eine Schmach seien!“ Der Hohepriester Eljaschib und die Priester „bauten das Schaftor“, und die Arbeit ging Tor für Tor um die Stadt, bis „die Mauer ward fertig am fünfundzwanzigsten Tage des Monats Elul in zweiundfünfzig Tagen“. Doch „die Stadt aber war weit von Raum und groß, aber wenig Volk darin, und die Häuser wurden nicht gebaut“."
    - "Das Jahr steht fester als die meisten im Alten Testament: Ein Brief der Juden von Elephantine in Ägypten von 407 v. Chr. nennt die Söhne Sanballats, des Feindes Nehemias, als erwachsene Männer, sodass Nehemias Artaxerxes der erste dieses Namens ist, nicht der zweite. Den Mauerverlauf liest man aus den Toren von Nehemia 3 und aus Kathleen Kenyons Grabungen von 1961–1967, die auf dem Kamm des Osthügels über dem verfallenen Hang eine Mauer fanden und sie Nehemia zuschrieben: Die persische Stadt beschränkte sich auf die Stadt Davids und den Tempelberg, weit kleiner als vor dem Exil, mit einigen hundert bis einigen tausend Einwohnern. Israel Finkelstein bezweifelt, dass sich eine Mauer Nehemias finden lässt; andere halten an Kenyon fest."
  fr:
    - "En 445 av. J.-C., la vingtième année d’Artaxerxès Ier de Perse, monté sur le trône en 465. Néhémie apprit la ruine des murailles au mois de Kisleu, en hiver, à Suse, à 1 230 km de Jérusalem en ligne droite ; il demanda congé en Nisan, au printemps, et la muraille fut achevée le vingt-cinq d’Élul, au début de l’automne, après cinquante-deux jours de travail. Josèphe, qui raconte l’histoire, compte plutôt deux ans et quatre mois. Néhémie gouverna Juda douze ans, retourna auprès du roi en 433 et revint de nouveau. Les murailles étaient rompues depuis que les Babyloniens les avaient rasées en 587 ou 586 av. J.-C., près d’un siècle et demi plus tôt, bien qu’une tentative de les rebâtir plus tôt sous le règne d’Artaxerxès ait été arrêtée."
    - "Il s’ouvre « au mois de Kisleu, la vingtième année, comme j’étais à Suse, dans la capitale », annonçant que « les murailles de Jérusalem sont en ruines, et ses portes sont consumées par le feu ». Néhémie obtint congé « au mois de Nisan, la vingtième année du roi Artaxerxès ». À Jérusalem : « Je sortis de nuit par la porte de la vallée, et je me dirigeai contre la source du dragon et vers la porte du fumier, considérant les murailles », puis aux chefs : « Venez, rebâtissons la muraille de Jérusalem, et nous ne serons plus dans l’opprobre. » Le grand prêtre Éliaschib et les prêtres « bâtirent la porte des brebis », et l’ouvrage fit le tour de la ville porte par porte, jusqu’à ce que « la muraille fut achevée le vingt-cinquième jour du mois d’Élul, en cinquante-deux jours ». Pourtant, « la ville était spacieuse et grande, mais peu peuplée, et les maisons n’étaient pas bâties »."
    - "L’année est plus ferme que la plupart dans l’Ancien Testament : une lettre des Juifs d’Éléphantine, en Égypte, écrite en 407 av. J.-C., nomme comme adultes les fils de Sanballat, l’ennemi de Néhémie, si bien que l’Artaxerxès de Néhémie est le premier du nom, non le second. Le tracé de la muraille se lit dans les portes de Néhémie 3 et dans les fouilles de Kathleen Kenyon, en 1961–1967, qui trouvèrent un mur sur la crête de la colline orientale, au-dessus de la pente en ruines, et l’attribuèrent à Néhémie : la ville perse se limitait à la Cité de David et au mont du Temple, bien plus petite qu’avant l’exil, avec quelques centaines à quelques milliers d’habitants. Israel Finkelstein a mis en doute qu’on puisse trouver une muraille de Néhémie ; d’autres gardent celle de Kenyon."
  pl:
    - "W 445 p.n.e., w dwudziestym roku Artakserksesa I z Persji, który wstąpił na tron w 465. Nehemiasz usłyszał o ruinie murów w miesiącu Kislew, zimą, w Suzie, 1230 km od Jerozolimy w linii prostej; prosił o zgodę w Nisan, wiosną, a mur ukończono dwudziestego piątego dnia Elul, na początku jesieni, po pięćdziesięciu dwóch dniach pracy. Józef Flawiusz, opowiadając tę historię, podaje zamiast tego dwa lata i cztery miesiące. Nehemiasz rządził Judą dwanaście lat, wrócił do króla w 433 i znów powrócił. Mury leżały zburzone od czasu, gdy Babilończycy zrównali je z ziemią w 587 lub 586 p.n.e., blisko półtora wieku wcześniej, choć wcześniejszą próbę ich odbudowy za panowania Artakserksesa powstrzymano."
    - "Księga zaczyna się od słów „miesiąca Chyslew, roku dwudziestego … gdym był na zamku w Susan” i od wieści, że „mur Jeruzalemski rozwalony jest, i bramy jego spalone są ogniem”. „Miesiąca Nisan roku dwudziestego Artakserksesa króla” Nehemiasz uzyskał zgodę. W Jerozolimie wyjechał nocą „bramą nad doliną w nocy, ku żródłu smoczemu, i ku bramie gnojowej, i oglądałem mury Jeruzalemskie” i rzekł do przełożonych: „Pójdżcież, a budujmy mury Jeruzalemskie, abyśmy nie byli więcej na hańbę”. Arcykapłan Eliaszyb i kapłani „budowali bramę owczą”, a praca szła wokół miasta od bramy do bramy, aż „dokonany jest on mur dwudziestego i piątego dnia miesiąca Elul, pięćdziesiątego i drugiego dnia”. A jednak „miasto było szerokie i wielkie, ale ludu mało w murach jego, a jeszcze nie były domy pobudowane”."
    - "Rok jest pewniejszy niż większość w Starym Testamencie: list Żydów z Elefantyny w Egipcie, napisany w 407 p.n.e., wymienia synów Sanballata, wroga Nehemiasza, jako dorosłych mężczyzn, więc Artakserkses Nehemiasza to pierwszy o tym imieniu, nie drugi. Przebieg muru odczytuje się z bram wymienionych w Ne 3 i z wykopalisk Kathleen Kenyon z lat 1961–1967, które odkryły mur na grzbiecie wschodniego wzgórza nad zrujnowanym stokiem i przypisały go Nehemiaszowi: perskie miasto ograniczało się do Miasta Dawida i Wzgórza Świątynnego, było znacznie mniejsze niż przed wygnaniem i liczyło od kilkuset do kilku tysięcy ludzi. Israel Finkelstein powątpiewał, czy można znaleźć jakikolwiek mur Nehemiasza; inni trzymają się Kenyon."
  it:
    - "Nel 445 a.C., il ventesimo anno di Artaserse I di Persia, salito al trono nel 465. Neemia seppe della rovina delle mura nel mese di Chislev, in inverno, a Susa, a 1.230 km da Gerusalemme in linea retta; chiese il permesso in Nisan, in primavera, e il muro fu finito il venticinque di Elul, all’inizio dell’autunno, dopo cinquantadue giorni di lavoro. Giuseppe Flavio, raccontando la storia, indica invece due anni e quattro mesi. Neemia governò Giuda per dodici anni, tornò dal re nel 433 e ripartì di nuovo. Le mura giacevano rotte da quando i Babilonesi le rasero al suolo nel 587 o 586 a.C., quasi un secolo e mezzo prima, benché un tentativo di ricostruirle prima, nel regno di Artaserse, fosse stato fermato."
    - "Il libro si apre «nel mese di Kisleu dell’anno ventesimo, mentr’io mi trovavo nel castello di Susan», con la notizia che «le mura di Gerusalemme restano rotte, e le sue porte, consumate dal fuoco». Fu «l’anno ventesimo del re Artaserse, nel mese di Nisan» che Neemia ottenne il permesso. A Gerusalemme «uscii di notte per la porta della Valle, e mi diressi verso la sorgente del Dragone e la porta del Letame, considerando le mura di Gerusalemme», e ai capi: «Venite, riedifichiamo le mura di Gerusalemme, e non sarem più nell’obbrobrio!» Il sommo sacerdote Eliasib e i sacerdoti «costruirono la porta delle Pecore», e il lavoro proseguì attorno alla città porta per porta, finché «le mura furon condotte a fine il venticinquesimo giorno di Elul, in cinquantadue giorni». Eppure «la città era spaziosa e grande; ma dentro v’era poca gente, e non vi s’eran fabbricate case»."
    - "L’anno è più sicuro di quasi tutti nell’Antico Testamento: una lettera dei Giudei di Elefantina in Egitto, scritta nel 407 a.C., nomina i figli di Sanballàt, il nemico di Neemia, come uomini adulti, così l’Artaserse di Neemia è il primo di questo nome, non il secondo. Il tracciato del muro si ricava dalle porte di Neemia 3 e dagli scavi di Kathleen Kenyon del 1961–1967, che trovarono un muro sul culmine del crinale orientale sopra il pendio in rovina e lo attribuirono a Neemia: la città persiana era limitata alla Città di Davide e al Monte del Tempio, molto più piccola che prima dell’esilio, con da poche centinaia a qualche migliaio di persone. Israel Finkelstein ha dubitato che si possa trovare un muro di Neemia; altri mantengono quello di Kenyon."
  nl:
    - "In 445 v.Chr., het twintigste jaar van Artaxerxes I van Perzië, die in 465 de troon had bestegen. Nehemia hoorde in de maand Kislew, in de winter, te Susa, hemelsbreed 1.230 km van Jeruzalem, van het verval van de muren; hij vroeg verlof in Nisan, in de lente, en de muur werd voltooid op de vijfentwintigste van Elul, bij het begin van de herfst, na tweeënvijftig dagen werk. Josephus, die het verhaal vertelt, rekent twee jaar en vier maanden. Nehemia bestuurde Juda twaalf jaar, ging in 433 terug naar de koning en keerde opnieuw terug. De muren lagen kapot sinds de Babyloniërs ze in 587 of 586 v.Chr. hadden geslecht, bijna anderhalve eeuw eerder, hoewel een poging om ze eerder in de regering van Artaxerxes te herbouwen was stopgezet."
    - "Het boek opent “in de maand Chisleu, in het twintigste jaar, als ik te Susan in het paleis was”, met het bericht dat “Jeruzalems muur is verscheurd, en haar poorten zijn met vuur verbrand”. Het was “in de maand Nisan, in het twintigste jaar van den koning Arthahsasta” dat Nehemia zijn verlof kreeg. In Jeruzalem reed hij bij nacht uit “door de Dalpoort, en voorbij de Drakenfontein, en naar de Mistpoort” en bezichtigde de muren, en hij zei tot de leiders: “komt, en laat ons Jeruzalems muur opbouwen; opdat wij niet meer een versmaadheid zijn”. De hogepriester Eljasib en de priesters “bouwden de Schaapspoort”, en het werk ging poort na poort rond de stad, totdat “de muur nu werd volbracht, op den vijf en twintigsten van Elul, in twee en vijftig dagen”. Toch: “De stad nu was wijd van ruimte en groot; doch des volks was weinig daarbinnen; en de huizen waren niet gebouwd”."
    - "Het jaar staat vaster dan de meeste in het Oude Testament: een brief van de Joden van Elefantine in Egypte, in 407 v.Chr. geschreven, noemt de zonen van Sanballat, de vijand van Nehemia, als volwassen mannen, dus de Artaxerxes van Nehemia is de eerste van die naam, niet de tweede. Het verloop van de muur wordt afgelezen uit de poorten van Nehemia 3 en uit de opgravingen van Kathleen Kenyon in 1961–1967, die op de kam van de oostelijke bergrug boven de verwoeste helling een muur vonden en die aan Nehemia toeschreven: de Perzische stad beperkte zich tot de Stad van David en de Tempelberg, veel kleiner dan vóór de ballingschap, met enkele honderden tot enkele duizenden mensen. Israel Finkelstein betwijfelt of er enige muur van Nehemia te vinden is; anderen houden vast aan Kenyon."
  cs:
    - "Roku 445 př. n. l., ve dvacátém roce perského Artaxerxa I., který nastoupil na trůn roku 465. Nehemjáš se dozvěděl o zboření hradeb v měsíci kislevu, v zimě, v Susách, 1 230 km od Jeruzaléma vzdušnou čarou; o dovolení požádal v nisanu, na jaře, a hradba byla dokončena pětadvacátého elulu, na začátku podzimu, po padesáti dvou dnech práce. Josephus Flavius, který příběh vypráví, počítá místo toho dva roky a čtyři měsíce. Nehemjáš spravoval Judsko dvanáct let, roku 433 se vrátil ke králi a poté znovu. Hradby ležely v troskách od chvíle, kdy je Babyloňané srovnali v roce 587 nebo 586 př. n. l., téměř století a půl předtím, ačkoli pokus o jejich obnovu dříve za Artaxerxovy vlády byl zastaven."
    - "Kniha začíná „měsíce Kislev léta dvadcátého, když jsem byl na hradě Susan“, zprávou, že „zed Jeruzalémská rozbořena jest, a brány jeho ohněm zkaženy“. Bylo to „měsíce Nísan léta dvadcátého Artaxerxa krále“, kdy Nehemjáš dovolení získal. V Jeruzalémě podle jeho vyprávění „vyjel jsem branou při údolí v noci k studnici drakové a k bráně hnojné, a ohledoval jsem zdí Jeruzalémských“ a řekl představeným: „Poďtež, a stavějme zed Jeruzalémskou, abychom nebyli více v pohanění.“ Velekněz Eljašíb a kněží „stavěli bránu bravnou“ a dílo šlo kolem města od brány k bráně, až „dodělána jest zed ta pětmecítmého dne měsíce Elul v padesáti a dvou dnech“. Přesto „město pak to bylo široké a veliké, ale lidu málo v ohradě jeho, a domové nebyli vystaveni“."
    - "Rok je pevnější než většina ve Starém zákoně: dopis Židů z Elefantiny v Egyptě, psaný roku 407 př. n. l., jmenuje syny Sanbalata, Nehemjášova nepřítele, jako dospělé muže, takže Nehemjášův Artaxerxes je první tohoto jména, nikoli druhý. Průběh hradby se čte z bran v Neh 3 a z vykopávek Kathleen Kenyonové z let 1961–1967, které našly hradbu na hřebeni východního návrší nad zřícenými svahy a připsaly ji Nehemjášovi: perské město se omezovalo na Město Davidovo a Chrámovou horu, mnohem menší než před vyhnanstvím, s několika sty až několika tisíci obyvatel. Israel Finkelstein pochyboval, že lze nalézt jakoukoli Nehemjášovu hradbu; jiní u Kenyonové zůstávají."
  sv:
    - "År 445 f.Kr., det tjugonde året av Artaxerxes I av Persien, som hade kommit till tronen 465. Nehemja hörde om murarnas förfall i månaden kislev, på vintern, i Susa, 1 230 km från Jerusalem fågelvägen; han bad om ledighet i nisan, på våren, och muren stod färdig den tjugofemte elul, vid höstens början, efter femtiotvå dagars arbete. Josefus, som berättar historien, räknar i stället med två år och fyra månader. Nehemja styrde Juda i tolv år, återvände till kungen 433 och kom tillbaka igen. Murarna hade legat nedbrutna sedan babylonierna jämnade dem med marken 587 eller 586 f.Kr., nästan ett och ett halvt sekel tidigare, även om ett försök att bygga upp dem tidigare under Artaxerxes' regering hade stoppats."
    - "Boken öppnar ”I månaden Kisleu, i det tjugonde året, när jag var i Susans borg”, med nyheten att ”Jerusalems mur är nedbruten, och dess portar äro uppbrända i eld”. Det var ”i månaden Nisan, i Artasastas tjugonde regeringsår” som Nehemja fick sin ledighet. I Jerusalem red han ut om natten ”genom Dalporten fram emot Drakkällan och Dyngporten och besåg Jerusalems murar”, och sade till de styrande: ”Välan då, låt oss bygga upp Jerusalems mur, för att vi icke längre må vara till smälek.” Översteprästen Eljashiv och prästerna ”byggde Fårporten”, och arbetet gick runt staden port för port, tills ”muren blev färdig på tjugufemte dagen i månaden Elul, efter femtiotvå dagar”. Ändå var staden ”vidsträckt och stor, men där fanns icke mycket folk, och husen voro icke uppbyggda”."
    - "Året är säkrare än de flesta i Gamla testamentet: ett brev från judarna på Elefantine i Egypten, skrivet 407 f.Kr., nämner Sanballats söner, Nehemjas fiende, som vuxna män, så Nehemjas Artaxerxes är den förste med det namnet, inte den andre. Murens sträckning läses ur portarna i Nehemja 3 och ur Kathleen Kenyons grävningar 1961–1967, som fann en mur på kammen av östra åsen ovanför den förfallna sluttningen och tillskrev den Nehemja: den persiska staden var begränsad till Davids stad och Tempelberget, långt mindre än före exilen, med några hundra till några tusen människor. Israel Finkelstein har betvivlat att någon mur av Nehemja kan hittas; andra håller fast vid Kenyons."
  nb:
    - "I 445 f.Kr., Artaxerxes Is tyvende år som konge av Persia, som hadde besteget tronen i 465. Nehemja hørte om murenes ruiner i måneden kislev, om vinteren, i Susa, 1 230 km fra Jerusalem i luftlinje; han ba om tillatelse i nisan, om våren, og muren ble ferdig den tjuefemte elul, ved begynnelsen av høsten, etter femtito dagers arbeid. Josefus, som forteller historien, regner med to år og fire måneder i stedet. Nehemja styrte Juda i tolv år, dro tilbake til kongen i 433 og vendte igjen tilbake. Murene hadde ligget i ruiner siden babylonerne jevnet dem med jorden i 587 eller 586 f.Kr., nesten halvannet århundre før, selv om et forsøk på å gjenreise dem tidligere under Artaxerxes' regjering var blitt stanset."
    - "Boken åpner «I måneden kislev, i det tyvende år, da jeg var i borgen Susan», med nyheten om at «Jerusalems mur er nedrevet og portene opbrent». Det var «I måneden nisan i kong Artaxerxes' tyvende år» at Nehemja fikk sin tillatelse. I Jerusalem red han ut om natten «gjennem Dalporten og bortimot Dragekilden og kom til Møkkporten» og så på murene, og sa til lederne: «kom og la oss bygge op igjen Jerusalems mur, så vi ikke mere skal være til spott». Øverstepresten Eljasjib og prestene «bygget Fåreporten», og arbeidet gikk rundt byen port for port, til «Muren blev ferdig på to og femti dager - den fem og tyvende dag i måneden elul». Likevel: «Byen var vid og stor, men folket i den var fåtallig, og ingen nye hus var bygget»."
    - "Året er sikrere enn de fleste i Det gamle testamente: et brev fra jødene i Elefantine i Egypt, skrevet i 407 f.Kr., nevner Sanballats sønner, Nehemjas fiende, som voksne menn, så Nehemjas Artaxerxes er den første med det navnet, ikke den andre. Murens forløp leses ut fra portene i Neh 3 og fra Kathleen Kenyons utgravinger i 1961–1967, som fant en mur på toppen av den østlige ryggen over den ødelagte skråningen og tilskrev den Nehemja: den persiske byen var begrenset til Davidsbyen og Tempelhøyden, langt mindre enn før eksilet, med noen hundre til noen tusen mennesker. Israel Finkelstein har tvilt på at noen mur fra Nehemjas tid kan finnes; andre holder fast ved Kenyon."
  tl:
    - "Noong 445 BK, ang ikadalawampung taon ni Artajerjes I ng Persia, na umakyat sa trono noong 465. Nabalitaan ni Nehemias ang pagkasira ng mga pader sa buwan ng Chislu, sa taglamig, sa Susan, 1,230 km mula sa Jerusalem sa tuwid na guhit; humingi siya ng pahintulot sa Nisan, sa tagsibol, at natapos ang pader noong ika-25 ng Elul, sa simula ng taglagas, pagkatapos ng limampu't dalawang araw na paggawa. Pinapayagan naman ni Josephus, sa pagsasalaysay, ang dalawang taon at apat na buwan. Namahala si Nehemias sa Juda nang labindalawang taon, bumalik sa hari noong 433 at bumalik muli. Nakagiba ang mga pader mula nang gibain ng mga Babilonio noong 587 o 586 BK, halos isa't kalahating siglo bago nito, bagaman napigil ang isang naunang pagtatangkang muling itayo ang mga ito sa paghahari ni Artajerjes."
    - "Bumubukas ang aklat sa “buwan ng Chislu, sa ikadalawang pung taon…” at balitang “ang kuta naman sa Jerusalem ay nabagsak, at ang mga pintuang-bayan ay nangasunog sa apoy”. “Sa buwan ng Nisan, sa ikadalawang pung taon ni Artajerjes na hari” nakuha ni Nehemias ang pahintulot. Sa Jerusalem, lumabas siya sa gabi “sa pintuang-bayan ng libis… sa dako ng balon ng dragon, at sa pintuang-bayan ng tapunan ng dumi…” minasdan ang mga kuta, at sinabi sa mga pinuno, “kayo'y parito, at ating itayo ang kuta ng Jerusalem, upang tayo'y huwag nang maging kadustaan”. Itinayo ng pangulong saserdoteng si Eliasib at mga saserdote ang “pintuang-bayan ng mga tupa” at umikot ang gawain hanggang “natapos ang kuta sa ikadalawang pu't limang araw ng buwan ng Elul, sa limang pu't dalawang araw”. Ngunit “ang bayan nga ay maluwang at malaki: nguni't ang mga tao ay kakaunti roon, at ang mga bahay ay hindi naitatayo pa”"
    - "Mas matibay ang taon kaysa sa karamihan sa Matandang Tipan: pinangalanan ng isang liham ng mga Judio ng Elephantine sa Egipto, na isinulat noong 407 BK, ang mga anak ni Sanballat, ang kaaway ni Nehemias, bilang mga nasa hustong gulang, kaya ang Artajerjes ni Nehemias ay ang una ng pangalang iyon, hindi ang ikalawa. Ang takbo ng pader ay binabasa mula sa mga pintuan ng Nehemias 3 at sa mga paghuhukay ni Kathleen Kenyon noong 1961–1967, na nakakita ng pader sa tuktok ng silangang tagaytay sa itaas ng sirang dalisdis at iniugnay ito kay Nehemias: nakakulong ang lungsod na Persiano sa Bayan ni David at sa Bundok ng Templo, mas maliit nang malaki kaysa bago ang pagkatapon, na may ilang daan hanggang ilang libong tao. Pinagdudahan ni Israel Finkelstein na may matatagpuang pader ni Nehemias; pinananatili ng iba ang kay Kenyon."
  da:
    - "I 445 f.Kr., Artaxerxes I's tyvende år; han var kommet på tronen i 465. Nehemias hørte om murenes ruin i måneden Kislev, om vinteren, i Susa, 1.230 km fra Jerusalem i luftlinje; han bad om orlov i Nisan, om foråret, og muren stod færdig den femogtyvende Elul, ved efterårets begyndelse, efter tooghalvtreds dages arbejde. Josefus regner i sin fortælling i stedet med to år og fire måneder. Nehemias var statholder i Juda i tolv år, vendte tilbage til kongen i 433 og kom igen tilbage. Murene havde ligget nedbrudte, siden babylonierne jævnede dem i 587 eller 586 f.Kr., næsten halvandet århundrede før, skønt et forsøg på at genopbygge dem tidligere i Artaxerxes' regeringstid var blevet standset."
    - "Bogen åbner »udi Kislev Maaned, i det tyvende Aar, da jeg var i Susan paa Slottet«, med nyheden om, at »Jerusalems Mur er nedreven, og dens Porte ere opbrændte med Ild«. Det var »i Nisan Maaned i Kong Artakserkses's tyvende Aar«, at Nehemias fik sin orlov. I Jerusalem, fortæller han, »jeg drog ud ad Dalporten om Natten og hen imod Dragekilden og hen til Møgporten, og jeg undersøgte Jerusalems Mure«, og sagde til lederne: »Kommer og lader os opbygge Jerusalems Mure, at vi ikke ydermere skulle være til Spot«. Ypperstepræsten Eljasjib og præsterne »byggede Faareporten«, og arbejdet gik rundt om byen port for port, indtil »Muren blev færdig paa den fem og tyvende Dag i Elul Maaned, udi to og halvtredsindstyve Dage«. Dog: »Staden var vid og bred og stor, men der var lidet Folk midt i den, og Husene vare ikke byggede«."
    - "Året er fastere end de fleste i Det Gamle Testamente: et brev fra jøderne i Elefantine i Egypten, skrevet i 407 f.Kr., nævner sønnerne af Sanballat, Nehemias' fjende, som voksne mænd, så Nehemias' Artaxerxes er den første af dette navn, ikke den anden. Murens forløb læses ud af portene i Nehemias 3 og af Kathleen Kenyons udgravninger 1961–1967, som fandt en mur på toppen af den østlige højderyg over den ødelagte skråning og tilskrev den Nehemias: den persiske by var begrænset til Davidsbyen og Tempelbjerget, langt mindre end før eksilet, med nogle hundrede til nogle tusinde indbyggere. Israel Finkelstein har betvivlet, at nogen mur fra Nehemias' tid kan findes; andre fastholder Kenyons."
  sr:
    - "Године 445. п. н. е., у двадесетој години Артаксеркса I Персијског, који је ступио на престо 465. Немија је чуо за порушене зидове у месецу Хислеву, зими, у Суси, 1.230 км од Јерусалима правом линијом; дозволу је затражио у Нисану, у пролеће, а зид је довршен двадесет петог Елула, на почетку јесени, после педесет два дана рада. Јосиф Флавије у свом причању допушта две године и четири месеца. Немија је управљао Јудом дванаест година, вратио се краљу 433. и поново се вратио. Зидови су лежали разваљени откад су их Вавилонци сравнили 587. или 586. п. н. е., скоро век и по раније, мада је покушај да се раније обнове у Артаксерксовој владавини био заустављен."
    - "Књига почиње: „Месеца Хислева године двадесете кад бејах у Сусану граду“, с вешћу: „зид је јерусалимски разваљен и врата су му огњем попаљена“. „А месеца Нисана године двадесете Артаксеркса цара“ Немија је добио допуст. У Јерусалиму је ноћу изашао: „изиђох ноћу на врата од долине, на извор змајевски, и на врата гнојна, и разгледах зидове јерусалимске“, и рекао поглаварима: „дајте да зидамо зидове јерусалимске, да више не будемо руг“. Првосвештеник Елијасив и свештеници „зидаше врата овчија“, а рад је ишао око града од капије до капије: „И тако доврши се зид двадесет петог дана месеца Елула за педесет и два дана.“ Па ипак: „А град беше широк и велик, али народа беше мало у њему и куће не беху пограђене.“"
    - "Година је чвршћа од већине у Старом завету: писмо Јевреја из Елефантине у Египту, писано 407. п. н. е., помиње синове Санавалата, Немијиног непријатеља, као одрасле људе, па је Немијин Артаксеркс први тог имена, а не други. Ток зида чита се из капија у Немији 3 и из ископавања Кетлин Кенјон 1961–1967, која су пронашла зид на врху источног гребена изнад порушене падине и приписала га Немији: персијски град био је ограничен на Давидов град и Храмовну гору, далеко мањи него пре изгнанства, с неколико стотина до неколико хиљада људи. Израел Финкелштајн је посумњао да се може наћи иједан Немијин зид; други задржавају Кенјонино мишљење."
