id: how-far-jerusalem-to-damascus
question:
  en: "How far is Damascus from Jerusalem?"
  ru: "Как далеко от Иерусалима до Дамаска?"
  uk: "Як далеко Дамаск від Єрусалиму?"
  es: "¿A qué distancia está Damasco de Jerusalén?"
  pt: "Qual é a distância de Jerusalém a Damasco?"
  de: "Wie weit ist Damaskus von Jerusalem entfernt?"
  fr: "À quelle distance de Jérusalem se trouve Damas ?"
  pl: "Jak daleko od Jerozolimy leży Damaszek?"
  it: "Quanto dista Damasco da Gerusalemme?"
  nl: "Hoe ver ligt Damascus van Jeruzalem?"
  cs: "Jak daleko je Damašek od Jeruzaléma?"
  sv: "Hur långt är Damaskus från Jerusalem?"
answer:
  en:
    - "Damascus lies about 217 km north-north-east of Jerusalem in a straight line, about 7 days on foot at 30 km a day; by the Roman road on the map the way measures about 251 km, roughly eight days."
    - 'This is the road of Saul''s conversion: "And as he journeyed, he came near Damascus: and suddenly there shined round about him a light from heaven." In his own account the light came "about noon". The road ran north through Samaria and Galilee, past the Sea of Galilee and across the Jordan, then north-east over the plateau to the oasis of Damascus at the edge of the Syrian desert. In the city, in "the street which is called Straight", Ananias baptised him, and later he escaped over the wall in a basket.'
    - "Damascus is the capital of Syria today and one of the oldest continuously inhabited cities of the world: its name appears in Egyptian lists of the fifteenth century BC, it was the capital of the Aramean kingdom that fought Israel in the days of Ahab and Elisha, it fell to Tiglath-pileser III of Assyria in 732 BC, and Pompey brought it under Rome in 64 BC. The map's tour of Saul uses AD 34 as a conventional year for the conversion, usually dated c. AD 33–36."
  ru:
    - "Дамаск лежит примерно в 217 км к северо-северо-востоку от Иерусалима по прямой — около 7 дней пешего пути по 30 км в день; по римской дороге на карте путь составляет около 251 км, примерно восемь дней."
    - "Это дорога обращения Савла: «Когда же он шел и приближался к Дамаску, внезапно осиял его свет с неба». По его собственному рассказу свет явился «около полудня». Дорога шла на север через Самарию и Галилею, мимо Галилейского моря и через Иордан, затем на северо-восток по плоскогорью к оазису Дамаска на краю Сирийской пустыни. В городе, на «улице, называемой Прямою», Анания крестил его, а позже он бежал через стену в корзине."
    - "Сегодня Дамаск — столица Сирии и один из древнейших непрерывно населённых городов мира: его имя есть в египетских списках XV века до н. э., он был столицей арамейского царства, воевавшего с Израилем во дни Ахава и Елисея, в 732 г. до н. э. его взял Феглаффелласар (Тиглатпаласар III) Ассирийский, а в 64 г. до н. э. Помпей подчинил его Риму. Тур Савла на карте показывает обращение в условном 34 г. н. э.; обычно его датируют ок. 33–36 гг."
  uk:
    - "Дамаск лежить приблизно за 217 км на північ-північний схід від Єрусалиму по прямій, близько 7 днів пішки за 30 км на день; римською дорогою на мапі шлях становить близько 251 км, приблизно вісім днів."
    - "Це дорога навернення Савла: «Ідучи ж був близько Дамаску, аж ось осияло його сьвітло з неба». У його власній розповіді світло з'явилося «о полуднї». Дорога йшла на північ через Самарію та Галілею, повз Галілейське море і через Йордан, потім на північний схід через плато до оази Дамаска на краю Сирійської пустелі. У місті, на вулиці, яка «зветь ся Простою», Ананія охрестив його, а згодом він утік через мур у кошику."
    - "Дамаск — нині столиця Сирії та одне з найдавніших безперервно заселених міст світу: його назва є в єгипетських списках XV ст. до н. е., він був столицею арамейського царства, що воювало з Ізраїлем за днів Ахава та Єлисея, 732 р. до н. е. він упав перед Тіглатпаласаром III Ассирійським, а 64 р. до н. е. Помпей підкорив його Римові. Тур Савла на мапі бере 34 р. н. е. як умовний рік навернення, яке зазвичай датують близько 33–36 рр. н. е."
  es:
    - "Damasco se encuentra a unos 217 km al nor-noreste de Jerusalén en línea recta, unos 7 días a pie a 30 km diarios; por la calzada romana del mapa el camino mide unos 251 km, aproximadamente ocho días."
    - "Este es el camino de la conversión de Saulo: «yendo por el camino, aconteció que llegando cerca de Damasco, súbitamente le cercó un resplandor de luz del cielo». En su propio relato la luz vino «como á medio día». El camino iba hacia el norte por Samaria y Galilea, pasaba junto al mar de Galilea y cruzaba el Jordán, y luego giraba al nordeste por la meseta hasta el oasis de Damasco, en el borde del desierto sirio. En la ciudad, en «la calle que se llama la Derecha», Ananías lo bautizó, y más tarde escapó por el muro en una espuerta."
    - "Damasco es hoy la capital de Siria y una de las ciudades habitadas de forma continua más antiguas del mundo: su nombre aparece en listas egipcias del siglo XV a. C., fue la capital del reino arameo que combatió a Israel en tiempos de Acab y Eliseo, cayó ante Tiglat-pileser III de Asiria en 732 a. C. y Pompeyo la sometió a Roma en 64 a. C. El recorrido de Saulo en el mapa usa el año 34 d. C. como fecha convencional de la conversión, que suele fecharse hacia 33–36 d. C."
  pt:
    - "Damasco fica a cerca de 217 km a nor-nordeste de Jerusalém em linha reta, uns 7 dias a pé a 30 km por dia; pela estrada romana do mapa o caminho mede cerca de 251 km, aproximadamente oito dias."
    - "Esta é a estrada da conversão de Saulo: “quando se aproximava de Damasco, de repente uma luz do céu brilhou ao seu redor”. No seu próprio relato, a luz veio “por volta do meio-dia”. A estrada seguia para o norte por Samaria e pela Galileia, passava pelo mar da Galileia e atravessava o Jordão, depois ia para nordeste pelo planalto até o oásis de Damasco, na orla do deserto sírio. Na cidade, na “rua chamada Direita”, Ananias o batizou, e mais tarde ele escapou pelo muro num cesto."
    - "Damasco é hoje a capital da Síria e uma das cidades continuamente habitadas mais antigas do mundo: seu nome aparece em listas egípcias do século XV a.C., foi a capital do reino arameu que combateu Israel nos dias de Acabe e Eliseu, caiu diante de Tiglate-Pileser III da Assíria em 732 a.C., e Pompeu a submeteu a Roma em 64 a.C. O roteiro de Saulo no mapa usa 34 d.C. como ano convencional da conversão, geralmente datada de cerca de 33–36 d.C."
  de:
    - "Damaskus liegt etwa 217 km nordnordöstlich von Jerusalem in der Luftlinie, bei 30 km am Tag etwa 7 Tage zu Fuß; auf der römischen Straße der Karte misst der Weg etwa 251 km, ungefähr acht Tage."
    - "Das ist die Straße der Bekehrung des Saulus: „Und da er auf dem Wege war und nahe an Damaskus kam, umleuchtete ihn plötzlich ein Licht vom Himmel.“ In seinem eigenen Bericht kam das Licht „um den Mittag“. Die Straße führte nordwärts durch Samaria und Galiläa, am See Genezareth vorbei und über den Jordan, dann nordöstlich über das Hochland zur Oase von Damaskus am Rand der syrischen Wüste. In der Stadt, in der „Gasse, die da heißt ‚die gerade‘“, taufte ihn Hananias, und später entkam er über die Mauer in einem Korb."
    - "Damaskus ist heute die Hauptstadt Syriens und eine der ältesten ununterbrochen bewohnten Städte der Welt: Sein Name erscheint in ägyptischen Listen des 15. Jahrhunderts v. Chr., es war die Hauptstadt des aramäischen Königreichs, das in den Tagen Ahabs und Elisas gegen Israel kämpfte, es fiel 732 v. Chr. an Tiglat-Pileser III. von Assyrien, und Pompeius brachte es 64 v. Chr. unter Rom. Die Saulus-Tour der Karte verwendet 34 n. Chr. als herkömmliches Jahr der Bekehrung, die meist auf etwa 33–36 n. Chr. datiert wird."
  fr:
    - "Damas est à environ 217 km au nord-nord-est de Jérusalem en ligne droite, soit environ 7 jours de marche à 30 km par jour ; par la route romaine de la carte, le trajet mesure environ 251 km, soit huit jours environ."
    - "C’est la route de la conversion de Saul : « Comme il était en chemin, et qu’il approchait de Damas, tout à coup une lumière venant du ciel resplendit autour de lui. » Dans son propre récit, la lumière vint « vers midi ». La route montait vers le nord par la Samarie et la Galilée, longeait la mer de Galilée et traversait le Jourdain, puis gagnait au nord-est, par le plateau, l’oasis de Damas, en lisière du désert de Syrie. Dans la ville, dans « la rue qu’on appelle la droite », Ananias le baptisa, et plus tard il s’échappa par la muraille, dans une corbeille."
    - "Damas est aujourd’hui la capitale de la Syrie et l’une des plus anciennes villes continûment habitées du monde : son nom figure dans des listes égyptiennes du XVe siècle av. J.-C., elle fut la capitale du royaume araméen qui combattit Israël au temps d’Achab et d’Élisée, elle tomba aux mains de Tiglath-Piléser III d’Assyrie en 732 av. J.-C., et Pompée la plaça sous la domination de Rome en 64 av. J.-C. Le parcours de Saul sur la carte retient 34 apr. J.-C. comme année conventionnelle de la conversion, habituellement datée vers 33–36 apr. J.-C."
  pl:
    - "Damaszek leży około 217 km na północ-północny wschód od Jerozolimy w linii prostej, czyli około 7 dni drogi pieszo przy 30 km dziennie; rzymską drogą z mapy ma to około 251 km, mniej więcej osiem dni."
    - "To droga nawrócenia Szawła: „A gdy jechał, stało się, gdy się przybliżał do Damaszku, że z prędka oświeciła go światłość z nieba.” W jego własnej relacji światło przyszło „o południu”. Droga wiodła na północ przez Samarię i Galileę, obok Jeziora Galilejskiego i przez Jordan, a potem na północny wschód przez płaskowyż do oazy Damaszku na skraju pustyni syryjskiej. W mieście, na „ulicy, którą zowią prostą”, Ananiasz go ochrzcił, a później uciekł przez mur w koszu."
    - "Damaszek jest dziś stolicą Syrii i jednym z najstarszych nieprzerwanie zamieszkanych miast świata: jego nazwa pojawia się w egipskich spisach z XV wieku p.n.e., był stolicą królestwa aramejskiego, które walczyło z Izraelem za dni Achaba i Elizeusza, w 732 p.n.e. wpadł w ręce Tiglat-Pilesera III z Asyrii, a Pompejusz podporządkował go Rzymowi w 64 p.n.e. Trasa Szawła na mapie przyjmuje rok 34 n.e. jako umowny rok nawrócenia, zwykle datowanego na około 33–36 n.e."
  it:
    - "Damasco si trova a circa 217 km a nord-nord-est di Gerusalemme in linea retta, circa 7 giorni a piedi a 30 km al giorno; per la strada romana della mappa il percorso misura circa 251 km, grosso modo otto giorni."
    - "Questa è la strada della conversione di Saul: «mentre era in cammino, avvenne che, avvicinandosi a Damasco, di subito una luce dal cielo gli sfolgorò d’intorno». Nel suo stesso racconto la luce venne «sul mezzogiorno». La strada correva a nord attraverso la Samaria e la Galilea, oltre il lago di Tiberiade e attraverso il Giordano, poi a nord-est sull’altopiano fino all’oasi di Damasco, al margine del deserto siriano. In città, nella «strada detta Diritta», Anania lo battezzò, e più tardi egli fuggì oltre il muro in una cesta."
    - "Damasco è oggi la capitale della Siria e una delle città più antiche del mondo abitate senza interruzione: il suo nome compare in elenchi egizi del XV secolo a.C., fu la capitale del regno aramaico che combatté Israele ai giorni di Acab ed Eliseo, cadde in mano a Tiglat-Pilèser III d’Assiria nel 732 a.C., e Pompeo la portò sotto Roma nel 64 a.C. Il percorso di Saul sulla mappa usa il 34 d.C. come anno convenzionale della conversione, di solito datata al 33–36 d.C. circa."
  nl:
    - "Damascus ligt hemelsbreed ongeveer 217 km noord-noordoostelijk van Jeruzalem, bij 30 km per dag ongeveer 7 dagen te voet; langs de Romeinse weg op de kaart meet de weg ongeveer 251 km, grofweg acht dagen."
    - "Dit is de weg van de bekering van Saul: “als hij reisde, is het geschied, dat hij nabij Damaskus kwam, en hem omscheen snellijk een licht van den hemel”. In zijn eigen verslag kwam het licht “omtrent den middag”. De weg liep naar het noorden door Samaria en Galilea, langs het Meer van Galilea en over de Jordaan, en vervolgens noordoostwaarts over het plateau naar de oase van Damascus aan de rand van de Syrische woestijn. In de stad, in “de straat, genaamd de Rechte”, doopte Ananias hem, en later ontkwam hij in een mand over de muur."
    - "Damascus is tegenwoordig de hoofdstad van Syrië en een van de oudste onafgebroken bewoonde steden ter wereld: haar naam komt voor in Egyptische lijsten uit de vijftiende eeuw v.Chr., zij was de hoofdstad van het Aramese koninkrijk dat in de dagen van Achab en Elisa tegen Israël streed, zij viel in 732 v.Chr. aan Tiglat-Pileser III van Assyrië en Pompeius bracht haar in 64 v.Chr. onder Rome. De tocht van Saul op de kaart gebruikt 34 n.Chr. als conventioneel jaar voor de bekering, die gewoonlijk wordt gedateerd rond 33–36 n.Chr."
  cs:
    - "Damašek leží asi 217 km severoseverovýchodně od Jeruzaléma vzdušnou čarou, což je asi 7 dní pěšky při 30 km denně; po římské silnici na mapě měří cesta asi 251 km, zhruba osm dní."
    - "Toto je cesta Saulova obrácení: „A když byl na cestě, stalo se, že již přibližoval se k Damašku. Tedy pojednou rychle obklíčilo jej světlo s nebe.“ Podle jeho vlastního vyprávění přišlo světlo „okolo poledne“. Cesta vedla na sever přes Samaří a Galileu, kolem Galilejského jezera a přes Jordán, pak na severovýchod přes náhorní plošinu k oáze Damašku na okraji syrské pouště. Ve městě, v ulici zvané Přímá, jej pokřtil Ananiáš a později utekl přes hradby v koši."
    - "Damašek je dnes hlavním městem Sýrie a jedním z nejstarších nepřetržitě obydlených měst světa: jeho jméno se objevuje v egyptských seznamech z 15. století př. n. l., byl hlavním městem aramejského království, které za dnů Achaba a Elíši bojovalo s Izraelem, roku 732 př. n. l. padl asyrskému králi Tiglatpilesarovi III. a roku 64 př. n. l. jej Pompeius připojil k Římu. Mapa Saulova putování užívá rok 34 n. l. jako smluvní rok obrácení, obvykle datovaného asi do let 33–36 n. l."
  sv:
    - "Damaskus ligger omkring 217 km nord-nordost om Jerusalem fågelvägen, omkring 7 dagar till fots med 30 km om dagen; via den romerska vägen på kartan mäter vägen omkring 251 km, ungefär åtta dagar."
    - "Detta är vägen för Sauls omvändelse: ”Men när han på sin färd nalkades Damaskus, hände sig att ett sken från himmelen plötsligt kringstrålade honom.” I hans egen berättelse kom skenet ”vid middagstiden”. Vägen gick norrut genom Samaria och Galileen, förbi Galileiska sjön och över Jordan, och sedan nordost över högplatån till oasen Damaskus vid kanten av den syriska öknen. I staden, i ”den gata som kallas Raka gatan”, döpte Ananias honom, och senare räddade han sig över muren i en korg."
    - "Damaskus är i dag Syriens huvudstad och en av världens äldsta kontinuerligt bebodda städer: dess namn förekommer i egyptiska listor från 1400-talet f.Kr., det var huvudstad i det arameiska kungarike som krigade mot Israel på Achavs och Elishas tid, det föll för Tiglat-Pileser III av Assyrien 732 f.Kr., och Pompejus lade det under Rom 64 f.Kr. Kartans Saulstur använder år 34 e.Kr. som konventionellt år för omvändelsen, vanligen daterad till omkring 33–36 e.Kr."
