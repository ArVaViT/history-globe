id: where-was-megiddo
question:
  en: "Where was Megiddo, the Armageddon of Revelation?"
  ru: "Где находился Мегиддон — Армагеддон Откровения?"
  uk: "Де був Мегіддо, Армагеддон Одкровення?"
  es: "¿Dónde estaba Meguido, el Armagedón del Apocalipsis?"
  pt: "Onde ficava Megido, o Armagedom do Apocalipse?"
  de: "Wo lag Megiddo, das Harmagedon der Offenbarung?"
  fr: "Où se trouvait Meguiddo, l’Harmaguédon de l’Apocalypse ?"
  pl: "Gdzie leżało Megiddo, Armagedon z Apokalipsy?"
  it: "Dov’era Meghiddo, l’Armaghedon dell’Apocalisse?"
  cs: "Kde ležel Megido, Armagedon ze Zjevení?"
  nl: "Waar lag Megiddo, het Armageddon van de Openbaring?"
  sv: "Var låg Megiddo, Uppenbarelsebokens Harmagedon?"
  nb: "Hvor lå Megiddo, Harmageddon i Åpenbaringen?"
  tl: "Nasaan ang Megiddo, ang Armagedon ng Apocalipsis?"
  da: "Hvor lå Megiddo, Harmagedon i Johannes’ Åbenbaring?"
  sr: "Где је био Мегидо, Армагедон из Откривења?"
  hu: "Hol volt Megiddó, a Jelenések könyvének Harmageddonja?"
  fi: "Missä oli Megiddo, Ilmestyskirjan Harmageddon?"
  vi: "Mê-ghi-đô, Ha-ma-ghê-đôn của sách Khải Huyền, ở đâu?"
  ro: "Unde se afla Meghido, Armaghedonul din Apocalipsă?"
  bg: "Къде се е намирал Мегидо — Армагедон от Откровение?"
answer:
  en:
    - "Megiddo is the mound of Tel Megiddo in northern Israel, at the western edge of the Jezreel Valley, where the pass of Wadi Ara comes through the Carmel ridge; it is about 90 km north of Jerusalem in a straight line."
    - 'The mound guarded the main road between Egypt and Syria, and armies met here for three thousand years: Thutmose III of Egypt routed a coalition of Canaanite kings before its walls in the fifteenth century BC, the Song of Deborah tells of the kings of Canaan fighting "by the waters of Megiddo", and in 609 BC Pharaoh Necho slew King Josiah at Megiddo. Iron Age Megiddo had palaces, a six-chambered gate and a tunnel to its spring; whether these belong to Solomon''s tenth century or to the ninth century of Ahab''s dynasty is one of the main disputes of biblical archaeology. The mound was abandoned about the fourth century BC.'
    - 'Revelation names the place where the kings are gathered "in the Hebrew tongue Armageddon", and the name is usually explained as "mount of Megiddo", though the mound is low and the reading is not certain; the place card on the map lists the other proposals, among them Mount Carmel and the Jezreel Valley itself.'
  ru:
    - "Мегиддон — это холм Тель-Мегиддо на севере Израиля, на западном краю Изреельской долины, там, где проход Вади-Ара прорезает Кармильский хребет; от Иерусалима сюда около 90 км по прямой."
    - "Холм сторожил главную дорогу из Египта в Сирию, и войска сходились здесь три тысячи лет: Тутмос III в XV веке до н. э. разбил под его стенами союз ханаанских царей, песнь Деворы говорит о царях ханаанских, сражавшихся «у вод Мегиддонских», а в 609 г. до н. э. фараон Нехао поразил при Мегиддоне царя Иосию. В Мегиддоне железного века были дворцы, шестикамерные ворота и туннель к источнику; принадлежат ли они X веку Соломона или IX веку династии Ахава — один из главных споров библейской археологии. Около IV века до н. э. холм был покинут."
    - "Откровение называет место, куда собраны цари, «по-еврейски Армагеддон»; имя обычно объясняют как «гора Мегиддо», хотя холм невысок и чтение не бесспорно; карточка места на карте перечисляет другие предложения, среди них гору Кармил и саму Изреельскую долину."
  uk:
    - "Мегіддо — це пагорб Тель-Мегіддо на півночі Ізраїлю, на західному краю Єзреельської долини, де перевал Ваді-Ара проходить крізь пасмо Кармелю; він лежить приблизно за 90 км на північ від Єрусалима по прямій."
    - "Пагорб охороняв головну дорогу між Єгиптом і Сирією, і армії зустрічалися тут три тисячі років: Тутмос III Єгипетський розбив коаліцію ханаанських царів перед його мурами в XV ст. до н. е., Пісня Дебори розповідає про царів Ханаану, що билися «в Танаах у вод Мегидонських», а 609 р. до н. е. фараон Нехо вбив царя Йосію в Мегіддо. Мегіддо залізного віку мав палаци, браму з шістьма камерами й тунель до свого джерела; чи належать вони X ст. Соломона, чи IX ст. династії Ахава — одна з головних суперечок біблійної археології. Пагорб покинули близько IV ст. до н. е."
    - "Одкровення називає місце, де збираються царі, «що зоветь ся по єврейськи Армагедон», і назву зазвичай пояснюють як «гора Мегіддо», хоч пагорб низький, а прочитання не є певним; у картці місця на мапі перелічено інші пропозиції, серед них гору Кармель і саму Єзреельську долину."
  es:
    - "Meguido es el montículo de Tel Meguido, en el norte de Israel, en el borde occidental del valle de Jezreel, donde el paso del Wadi Ara atraviesa la cordillera del Carmelo; queda a unos 90 km al norte de Jerusalén en línea recta."
    - "El montículo guardaba el camino principal entre Egipto y Siria, y aquí se encontraron ejércitos durante tres mil años: Tutmosis III de Egipto derrotó ante sus murallas a una coalición de reyes cananeos en el siglo XV a. C., el Cántico de Débora habla de los reyes de Canaán combatiendo «junto á las aguas de Megiddo», y en 609 a. C. el faraón Necao mató al rey Josías en Meguido. Meguido, en la Edad del Hierro, tuvo palacios, una puerta de seis cámaras y un túnel hasta su manantial; si estos pertenecen al siglo X de Salomón o al siglo IX de la dinastía de Acab es una de las principales disputas de la arqueología bíblica. El montículo fue abandonado hacia el siglo IV a. C."
    - "El Apocalipsis nombra el lugar donde se congregan los reyes: «el lugar que en hebreo se llama Armagedón», y el nombre se explica por lo común como «monte de Meguido», aunque el montículo es bajo y la lectura no es segura; la ficha del lugar en el mapa enumera las demás propuestas, entre ellas el monte Carmelo y el propio valle de Jezreel."
  pt:
    - "Megido é o monte de Tel Megiddo, no norte de Israel, na borda ocidental do vale de Jezreel, onde o desfiladeiro de Wadi Ara atravessa a cordilheira do Carmelo; fica a cerca de 90 km ao norte de Jerusalém em linha reta."
    - "O monte guardava a principal estrada entre o Egito e a Síria, e exércitos se encontraram aqui por três mil anos: Tutmés III do Egito derrotou diante de suas muralhas uma coalizão de reis cananeus no século XV a.C., o Cântico de Débora fala dos reis de Canaã lutando “junto às águas de Megido”, e em 609 a.C. o faraó Neco matou o rei Josias em Megido. A Megido da Idade do Ferro tinha palácios, uma porta de seis câmaras e um túnel até a sua fonte; se estes pertencem ao século X de Salomão ou ao século IX da dinastia de Acabe é uma das principais disputas da arqueologia bíblica. O monte foi abandonado por volta do século IV a.C."
    - "O Apocalipse nomeia o lugar onde os reis são reunidos “que em hebraico se chama ‘Armagedom’”, e o nome costuma ser explicado como “monte de Megido”, embora o monte seja baixo e a leitura não seja certa; a ficha do lugar no mapa relaciona as outras propostas, entre elas o monte Carmelo e o próprio vale de Jezreel."
  de:
    - "Megiddo ist der Hügel Tel Megiddo im Norden Israels, am Westrand der Jesreel-Ebene, wo der Pass des Wadi Ara durch den Karmelrücken führt; er liegt in der Luftlinie etwa 90 km nördlich von Jerusalem."
    - "Der Hügel bewachte die Hauptstraße zwischen Ägypten und Syrien, und dreitausend Jahre lang trafen hier Heere aufeinander: Thutmosis III. von Ägypten schlug im 15. Jahrhundert v. Chr. vor seinen Mauern eine Koalition kanaanäischer Könige, das Lied der Debora erzählt von den Königen Kanaans, die kämpften „am Wasser Megiddos“, und 609 v. Chr. erschlug Pharao Necho bei Megiddo König Josia. Das eisenzeitliche Megiddo hatte Paläste, ein Sechskammertor und einen Tunnel zu seiner Quelle; ob diese ins 10. Jahrhundert Salomos oder ins 9. Jahrhundert der Dynastie Ahabs gehören, ist einer der Hauptstreitpunkte der biblischen Archäologie. Der Hügel wurde etwa im 4. Jahrhundert v. Chr. verlassen."
    - "Die Offenbarung nennt den Ort, an dem die Könige versammelt werden, „auf hebräisch Harmagedon“, und der Name wird meist als „Berg von Megiddo“ erklärt, obwohl der Hügel niedrig ist und die Lesung nicht sicher; die Ortskarte nennt die anderen Vorschläge, darunter den Karmel und die Jesreel-Ebene selbst."
  fr:
    - "Meguiddo est le tertre de Tel Megiddo, dans le nord d’Israël, à la lisière occidentale de la vallée de Jizreel, là où le passage du Wadi Ara traverse la chaîne du Carmel ; il est à environ 90 km au nord de Jérusalem à vol d’oiseau."
    - "Le tertre gardait la grande route entre l’Égypte et la Syrie, et des armées s’y affrontèrent pendant trois mille ans : Thoutmosis III d’Égypte mit en déroute une coalition de rois cananéens devant ses murs au XVe siècle av. J.-C., le Cantique de Débora raconte que les rois de Canaan combattirent « aux eaux de Meguiddo », et en 609 av. J.-C. le pharaon Néco y tua le roi Josias. Meguiddo, à l’âge du Fer, avait des palais, une porte à six chambres et un tunnel menant à sa source ; savoir si ces ouvrages appartiennent au Xe siècle de Salomon ou au IXe siècle de la dynastie d’Achab est l’une des principales controverses de l’archéologie biblique. Le tertre fut abandonné vers le IVe siècle av. J.-C."
    - "L’Apocalypse nomme le lieu où les rois sont rassemblés « le lieu appelé en hébreu Harmaguédon », et le nom s’explique d’ordinaire par « mont de Meguiddo », bien que le tertre soit bas et que la lecture ne soit pas certaine ; la fiche du lieu sur la carte énumère les autres propositions, parmi lesquelles le mont Carmel et la vallée de Jizreel elle-même."
  pl:
    - "Megiddo to wzgórze Tel Megiddo w północnym Izraelu, na zachodnim skraju doliny Jizreel, gdzie przełęcz Wadi Ara przechodzi przez grzbiet Karmelu; leży około 90 km na północ od Jerozolimy w linii prostej."
    - "Wzgórze strzegło głównej drogi między Egiptem a Syrią i przez trzy tysiące lat spotykały się tu armie: Totmes III z Egiptu rozgromił pod jego murami koalicję kananejskich królów w XV wieku p.n.e., Pieśń Debory mówi o królach Kanaanu walczących „u wód Magieddo”, a w 609 p.n.e. faraon Neko zabił w Megiddo króla Jozjasza. Megiddo epoki żelaza miało pałace, bramę o sześciu komorach i tunel do źródła; czy należą one do X wieku Salomona, czy do IX wieku dynastii Achaba, jest jednym z głównych sporów archeologii biblijnej. Wzgórze opuszczono około IV wieku p.n.e."
    - "Apokalipsa wymienia miejsce, gdzie gromadzą się królowie, „po żydowsku Armagieddon”, a nazwę wyjaśnia się zwykle jako „góra Megiddo”, choć wzgórze jest niskie, a odczytanie nie jest pewne; karta miejsca na mapie wymienia inne propozycje, wśród nich Karmel i samą dolinę Jizreel."
  it:
    - "Meghiddo è il tell di Tel Megiddo nel nord di Israele, al margine occidentale della valle di Izreel, dove il passo di Wadi Ara attraversa la catena del Carmelo; dista circa 90 km a nord di Gerusalemme in linea d’aria."
    - "Il tell sorvegliava la strada principale tra l’Egitto e la Siria, e per tremila anni vi si scontrarono eserciti: Tutmosi III d’Egitto sbaragliò davanti alle sue mura una coalizione di re cananei nel XV secolo a.C., il Cantico di Debora narra dei re di Canaan che combattevano «presso le acque di Meghiddo», e nel 609 a.C. il faraone Neco uccise a Meghiddo il re Giosia. Meghiddo dell’età del Ferro aveva palazzi, una porta a sei camere e un tunnel verso la sua sorgente; se questi appartengano al X secolo di Salomone o al IX secolo della dinastia di Acab è una delle principali dispute dell’archeologia biblica. Il tell fu abbandonato verso il IV secolo a.C."
    - "L’Apocalisse nomina il luogo in cui si radunano i re: «nel luogo che si chiama in ebraico Harmaghedon», e il nome è di solito spiegato come «monte di Meghiddo», benché il tell sia basso e la lettura non sia certa; la scheda del luogo sulla mappa elenca le altre proposte, tra cui il Monte Carmelo e la stessa valle di Izreel."
  cs:
    - "Megido je pahorek Tel Megido v severním Izraeli, na západním okraji Jizreelského údolí, kde průsmyk Wádí Ara prochází karmelským hřbetem; leží vzdušnou čarou asi 90 km severně od Jeruzaléma."
    - "Pahorek střežil hlavní cestu mezi Egyptem a Sýrií a armády se tu střetávaly tři tisíce let: egyptský Thutmose III. rozprášil před jeho hradbami koalici kananejských králů v 15. století př. n. l., Píseň Debořina vypráví, jak králové Kanaánu bojovali „při vodách Mageddo“, a roku 609 př. n. l. zabil faraon Néko v Megidu krále Jošijáše. Megido doby železné mělo paláce, šestikomorovou bránu a tunel k prameni; zda patří do Šalomounova 10. století, nebo do 9. století Achabovy dynastie, je jedním z hlavních sporů biblické archeologie. Pahorek byl opuštěn kolem 4. století př. n. l."
    - "Zjevení jmenuje místo, kde jsou králové shromážděni, „kteréž slove Židovsky Armageddon“, a jméno se obvykle vykládá jako „hora Megida“, ačkoli pahorek je nízký a čtení není jisté; karta místa na mapě uvádí další návrhy, mezi nimi horu Karmel a samo Jizreelské údolí."
  nl:
    - "Megiddo is de heuvel Tel Megiddo in het noorden van Israël, aan de westrand van de vallei van Jizreël, waar de pas van de Wadi Ara door de Karmelrug komt; het ligt hemelsbreed ongeveer 90 km ten noorden van Jeruzalem."
    - "De heuvel bewaakte de hoofdweg tussen Egypte en Syrië, en drieduizend jaar lang troffen hier legers op elkaar: Thoetmosis III van Egypte versloeg vóór zijn muren in de vijftiende eeuw v.Chr. een coalitie van Kanaänitische koningen, het Lied van Debora vertelt van de koningen van Kanaän die streden “aan de wateren van Megiddo”, en in 609 v.Chr. doodde Farao Necho koning Josia bij Megiddo. Megiddo in de ijzertijd had paleizen, een poort met zes kamers en een tunnel naar zijn bron; of die bij de tiende eeuw van Salomo horen of bij de negende eeuw van de dynastie van Achab is een van de grote twistpunten van de bijbelse archeologie. De heuvel werd rond de vierde eeuw v.Chr. verlaten."
    - "De Openbaring noemt de plaats waar de koningen worden verzameld, die “in het Hebreeuws genaamd wordt Armageddon”, en de naam wordt gewoonlijk verklaard als “berg van Megiddo”, hoewel de heuvel laag is en de lezing niet zeker is; de plaatskaart bij de kaart noemt de andere voorstellen, onder meer de Karmel en de vallei van Jizreël zelf."
  sv:
    - "Megiddo är kullen Tel Megiddo i norra Israel, vid Jisreeldalens västra kant, där passet Wadi Ara går fram genom Karmelåsen; den ligger omkring 90 km norr om Jerusalem i fågelvägen."
    - "Kullen vaktade huvudvägen mellan Egypten och Syrien, och arméer möttes här i tre tusen år: Thutmosis III av Egypten slog en koalition av kananeiska kungar framför dess murar på 1400-talet f.Kr., Deboras sång berättar om Kanaans kungar som stred ”invid Megiddos vatten”, och år 609 f.Kr. dräpte farao Neko kung Josia vid Megiddo. Järnålderns Megiddo hade palats, en port med sex kammare och en tunnel till sin källa; huruvida dessa hör till Salomos 900-tal eller till 800-talet under Achavs dynasti är en av den bibliska arkeologins främsta tvistefrågor. Kullen övergavs omkring 300-talet f.Kr."
    - "Uppenbarelseboken nämner platsen där kungarna församlas som ”den plats som på hebreiska heter Harmagedon”, och namnet förklaras vanligen som ”Megiddos berg”, fastän kullen är låg och läsningen inte är säker; platskortet på kartan förtecknar de andra förslagen, bland dem berget Karmel och själva Jisreeldalen."
  nb:
    - "Megiddo er haugen Tel Megiddo i Nord-Israel, ved den vestre kanten av Jisreel-dalen, der passet Wadi Ara går gjennom Karmel-ryggen; den ligger omtrent 90 km nord for Jerusalem i luftlinje."
    - "Haugen voktet hovedveien mellom Egypt og Syria, og hærer møttes her i tre tusen år: Tutmosis III av Egypt slo en koalisjon av kanaaneiske konger foran murene på 1400-tallet f.Kr., Deboras sang forteller om Kanaans konger som kjempet «ved Megiddos vann», og i 609 f.Kr. drepte Farao Neko kong Josjia ved Megiddo. Megiddo i jernalderen hadde palasser, en port med seks kamre og en tunnel til kilden; om disse hører til Salomos 900-tall eller til 800-tallet under Ahabs dynasti, er en av de viktigste stridene i bibelsk arkeologi. Haugen ble forlatt omkring 300-tallet f.Kr."
    - "Åpenbaringen kaller stedet der kongene samles, «det sted som på hebraisk heter Harmageddon», og navnet forklares vanligvis som «Megiddos fjell», selv om haugen er lav og lesningen ikke er sikker; stedskortet på kartet oppfører de andre forslagene, blant dem Karmel-fjellet og selve Jisreel-dalen."
  tl:
    - "Ang Megiddo ay ang burol ng Tel Megiddo sa hilagang Israel, sa kanlurang gilid ng Lambak ng Jezreel, kung saan dumaraan ang daanan ng Wadi Ara sa tagaytay ng Carmel; mga 90 km ito sa hilaga ng Jerusalem sa tuwid na guhit."
    - "Binantayan ng burol ang pangunahing daan sa pagitan ng Egipto at Siria, at nagtagpo rito ang mga hukbo sa loob ng tatlong libong taon: tinalo ni Thutmose III ng Egipto ang isang koalisyon ng mga haring Cananeo sa harap ng mga pader nito noong ika-15 siglo BK, isinasalaysay ng Awit ni Debora na naglaban ang mga hari ng Canaan “sa Taanach na nasa tabi ng tubig sa Megiddo”, at noong 609 BK ay pinatay ni Faraon Necho si Haring Josias sa Megiddo. Ang Megiddo ng Panahong Bakal ay may mga palasyo, pintuang may anim na silid at isang lagusan patungo sa bukal nito; kung ang mga ito ay kay Salomon noong ika-10 siglo o sa ika-9 na siglo ng dinastiya ni Achab ay isa sa pangunahing pagtatalo ng arkeolohiya ng Biblia. Iniwan ang burol noong mga ika-4 na siglo BK."
    - "Pinangalanan ng Apocalipsis ang dako kung saan tinipon ang mga hari: “sa dako na sa Hebreo ay tinatawag na Armagedon”, at ang pangalan ay karaniwang ipinaliliwanag na “bundok ng Megiddo”, bagaman mababa ang burol at hindi tiyak ang pagbasa; inililista ng kard ng lugar sa mapa ang iba pang mungkahi, kabilang ang Bundok Carmelo at ang Lambak ng Jezreel mismo."
  da:
    - "Megiddo er tellen Tel Megiddo i det nordlige Israel, ved den vestlige kant af Jizre’el-dalen, hvor passet Wadi Ara kommer gennem Karmel-højdedraget; den ligger ca. 90 km nord for Jerusalem i fugleflugt."
    - "Tellen bevogtede hovedvejen mellem Egypten og Syrien, og hære mødtes her i tre tusind år: Thutmosis 3. af Egypten slog en koalition af kana’anæiske konger foran dens mure i 1400-tallet f.Kr., Deboras sang fortæller om Kana’ans konger, der kæmpede »ved Megiddo Vand«, og i 609 f.Kr. dræbte farao Neko kong Josias ved Megiddo. Megiddo i jernalderen havde paladser, en port med seks kamre og en tunnel til sin kilde; om disse hører til Salomos 900-tallet eller til 800-tallet under Akabs dynasti, er en af bibelarkæologiens hovedstridigheder. Tellen blev forladt omkring 300-tallet f.Kr."
    - "Johannes’ Åbenbaring nævner stedet, hvor kongerne samles, »paa Hebraisk Harmagedon«, og navnet forklares sædvanligvis som »Megiddo-bjerget«, selv om tellen er lav, og læsningen ikke er sikker; stedets kort opregner de øvrige forslag, blandt dem Karmel-bjerget og selve Jizre’el-dalen."
  sr:
    - "Мегидо је хумка Тел Мегидо у северном Израелу, на западном ободу Језраелске долине, где кроз гребен Кармила излази пролаз Вади Ара; налази се око 90 км северно од Јерусалима ваздушном линијом."
    - "Хумка је чувала главни пут између Египта и Сирије, и војске су се овде сретале три хиљаде година: Тутмес III од Египта разбио је пред њеним зидинама коалицију хананских краљева у петнаестом веку п. н. е., Деворина песма говори о хананским краљевима који се боре „на води мегидској“, а 609. п. н. е. фараон Нехао убио је краља Јосију код Мегида. Мегидо гвозденог доба имао је палате, капију са шест одаја и тунел до свог извора; да ли они припадају Соломуновом десетом веку или деветом веку Ахавове династије, једно је од главних спорова библијске археологије. Хумка је напуштена око четвртог века п. н. е."
    - "Откривење именује место на којем се цареви сабирају, „које се јеврејски зове Армагедон“, а име се обично тумачи као „гора Мегидо“, мада је хумка ниска и читање није извесно; картица места на карти наводи остале предлоге, међу њима Кармил и саму Језраелску долину."
  hu:
    - "Megiddó Tel Megiddo halma Észak-Izraelben, a Jezréel-völgy nyugati szélén, ahol a Wadi Ara-szoros áttör a Kármel-hegyláncon; Jeruzsálemtől légvonalban mintegy 90 km-re északra van."
    - "A halom az Egyiptom és Szíria közötti főutat őrizte, és hadseregek találkoztak itt háromezer éven át: az egyiptomi III. Thotmesz Kr. e. 15. században falai előtt megfutamította a kánaáni királyok szövetségét, Debóra éneke a kánaáni királyok harcáról beszél „Megiddó vizénél”, Kr. e. 609-ben pedig Nékó fáraó Megiddónál megölte Jósiás királyt. A vaskori Megiddónak paloták, hatkamrás kapuja és forrásához vezető alagútja volt; hogy ezek Salamon Kr. e. 10. századához vagy Aháb dinasztiájának 9. századához tartoznak-e, a bibliai régészet egyik fő vitája. A halmot Kr. e. a 4. század táján hagyták el."
    - "A Jelenések könyve szerint a királyokat arra a helyre gyűjtik, „a melyet zsidóul Armageddonnak neveznek”; a nevet általában „Megiddó hegyeként” magyarázzák, bár a halom alacsony, és az olvasat nem biztos; a térkép helykártyája felsorolja a többi javaslatot, köztük a Kármel-hegyet és magát a Jezréel-völgyet."
  fi:
    - "Megiddo on Tel Megiddon kumpu Pohjois-Israelissa Jisreelin laakson länsireunalla, siinä, missä Wadi Aran solatie läpäisee Karmelin harjanteen; se on linnuntietä noin 90 km Jerusalemista pohjoiseen."
    - "Kumpu vartioi Egyptin ja Syyrian välistä valtatietä, ja armeijat kohtasivat täällä kolmentuhannen vuoden ajan: Egyptin Thutmosis III voitti kanaanilaisten kuninkaiden liittouman sen muurien edessä 1400-luvulla eaa., Deboran laulu kertoo Kanaanin kuninkaiden taistelleen ”Megiddon vesien varsilla”, ja vuonna 609 eaa. farao Neko surmasi kuningas Josian Megiddossa. Rautakautisessa Megiddossa oli palatseja, kuusikammioinen portti ja tunneli lähteelle; kuuluvatko ne Salomon 900-luvulle eaa. vai Ahabin dynastian 800-luvulle, on yksi Raamatun arkeologian pääkiistoista. Kumpu hylättiin noin 300-luvulla eaa."
    - "Ilmestyskirja nimeää paikan, johon kuninkaat kootaan, sanoilla ”jonka nimi hebreaksi on Harmagedon”, ja nimi selitetään yleensä merkitsevän ”Megiddon vuorta”, vaikka kumpu on matala eikä lukutapa ole varma; kartan paikkakortti luettelee muut ehdotukset, muun muassa Karmelvuoren ja itse Jisreelin laakson."
  vi:
    - "Mê-ghi-đô là gò Tel Megiddo ở miền bắc Israel, tại rìa phía tây của Thung lũng Gít-rê-ên, nơi đèo Wadi Ara xuyên qua dãy Cạt-mên; nó cách Giê-ru-sa-lem khoảng 90 km về phía bắc theo đường thẳng."
    - "Gò này canh giữ con đường chính giữa Ê-díp-tô và Sy-ri, và các đạo quân gặp nhau tại đây suốt ba nghìn năm: Thutmose III của Ai Cập đánh tan một liên minh các vua Ca-na-an trước tường thành vào thế kỷ 15 TCN, Bài ca Đê-bô-ra kể các vua Ca-na-an giao chiến “tại nước Mê-ghi-đô”, và năm 609 TCN Pha-ra-ôn Nê-cô giết vua Giô-si-a tại Mê-ghi-đô. Mê-ghi-đô thời Đồ Sắt có các cung điện, một cổng sáu phòng và một đường hầm dẫn đến suối; những công trình này thuộc thế kỷ 10 của Sa-lô-môn hay thế kỷ 9 của triều đại A-háp là một trong những tranh luận chính của khảo cổ học Kinh Thánh. Gò bị bỏ hoang vào khoảng thế kỷ 4 TCN."
    - "Sách Khải Huyền gọi nơi các vua được nhóm lại là nơi “theo tiếng Hê-bơ-rơ gọi là Ha-ma-ghê-đôn”, và tên này thường được giải thích là “núi Mê-ghi-đô”, dù gò thấp và cách đọc này không chắc chắn; thẻ địa điểm trên bản đồ liệt kê các đề xuất khác, trong đó có Núi Cạt-mên và chính Thung lũng Gít-rê-ên."
  ro:
    - "Meghido este movila Tel Megiddo din nordul Israelului, la marginea de vest a Văii Izreel, unde trecătoarea Wadi Ara străbate creasta Carmelului; se află la circa 90 km nord de Ierusalim în linie dreaptă."
    - "Movila păzea drumul principal dintre Egipt și Siria, iar armatele s-au întâlnit aici timp de trei mii de ani: Tutmes al III-lea al Egiptului a zdrobit o coaliție de regi canaaniți înaintea zidurilor ei în secolul al XV-lea î.Hr., Cântarea Deborei vorbește despre regii Canaanului care se luptau lângă apele Meghidoului, iar în 609 î.Hr. Faraonul Neco l-a ucis pe regele Iosia la Meghido. Meghidoul din epoca fierului avea palate, o poartă cu șase camere și un tunel spre izvorul său; dacă acestea țin de secolul al X-lea al lui Solomon sau de secolul al IX-lea al dinastiei lui Ahab este una dintre principalele dispute ale arheologiei biblice. Movila a fost părăsită în jurul secolului al IV-lea î.Hr."
    - "Apocalipsa numește locul unde sunt strânși regii „evreește Armagheddon”, iar numele este explicat de obicei ca „muntele Meghidoului”, deși movila este joasă și lectura nu este sigură; fișa locului de pe hartă enumeră celelalte propuneri, între ele Muntele Carmel și chiar Valea Izreel."
  bg:
    - "Мегидо е хълмът Тел Мегидо в Северен Израел, в западния край на Изреелската долина, там, където проходът Уади Ара минава през хребета Кармил; той е на около 90 км северно от Йерусалим по права линия."
    - "Хълмът пазеше главния път между Египет и Сирия и армии се срещаха тук в продължение на три хиляди години: Тутмос III Египетски разгроми коалиция от ханаански царе пред стените му през XV в. пр.н.е., Песента на Девора разказва за ханаанските царе, които воюваха „близу при водите на Магедон“, а през 609 г. пр.н.е. фараон Нехао уби цар Йосия при Мегидо. Мегидо от желязната епоха имаше дворци, порта с шест помещения и тунел до извора си; дали те принадлежат на Соломоновия X в. или на IX в. на династията на Ахав, е един от главните спорове на библейската археология. Хълмът е изоставен около IV в. пр.н.е."
    - "Откровение назовава мястото, където се събират царете, „по Еврейски Армагедон“, а името обикновено се обяснява като „планината Мегидо“, макар хълмът да е нисък и четенето да не е сигурно; картичката на мястото на картата изброява другите предположения, сред тях планината Кармил и самата Изреелска долина."
