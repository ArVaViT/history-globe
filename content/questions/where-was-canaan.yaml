id: where-was-canaan
question:
  en: "Where was Canaan, the promised land?"
  ru: "Где находился Ханаан, земля обетованная?"
  uk: "Де був Ханаан, обітована земля?"
  es: "¿Dónde estaba Canaán, la tierra prometida?"
  pt: "Onde ficava Canaã, a terra prometida?"
  de: "Wo lag Kanaan, das Verheißene Land?"
  fr: "Où se trouvait Canaan, la terre promise ?"
  pl: "Gdzie leżał Kanaan, ziemia obiecana?"
  it: "Dov’era Canaan, la terra promessa?"
  nl: "Waar lag Kanaän, het beloofde land?"
  cs: "Kde byl Kanaán, zaslíbená země?"
  sv: "Var låg Kanaan, det utlovade landet?"
  nb: "Hvor lå Kanaan, det lovede land?"
  tl: "Saan ang Canaan, ang lupang pangako?"
  da: "Hvor lå Kana'an, det forjættede land?"
  sr: "Где је био Ханан, обећана земља?"
  hu: "Hol volt Kánaán, az ígéret földje?"
  fi: "Missä Kanaan, luvattu maa, oli?"
  vi: "Ca-na-an, đất hứa, ở đâu?"
  ro: "Unde se afla Canaanul, țara făgăduinței?"
  bg: "Къде се е намирал Ханаан, обетованата земя?"
answer:
  en:
    - "Canaan is the land between the Mediterranean and the Jordan, from the Lebanon in the north to the desert south of Beersheba: today's Israel and the Palestinian territories, with Lebanon and the edge of south-western Syria. The map point for the region stands in Lower Galilee, about 110 km north of Jerusalem in a straight line. The name is older than Israel: Egyptian and cuneiform texts of the second millennium BC use it for Egypt's province in the Levant, and the Bible uses it for the land before Israel took it, and for the land promised to Abraham's seed."
    - "Genesis draws the Canaanites' bounds “from Sidon, as thou comest to Gerar, unto Gaza; as thou goest, unto Sodom, and Gomorrah”, the coast from Lebanon to Philistia and inland to the Dead Sea, about 200 km from Sidon to Jerusalem in a straight line. Numbers gives the inheritance its formal borders: on the south from the wilderness of Zin by Edom and the Salt Sea to the brook of Egypt; “the great sea” on the west; on the north from the sea by a mount Hor to “the entrance of Hamath” and Zedad; on the east down past the sea of Chinnereth to the Jordan and “the salt sea”. The land east of the Jordan lay outside: the two and a half tribes “received their inheritance on this side Jordan near Jericho eastward”, and Joshua's men go out of Shiloh, “which is in the land of Canaan”, to Gilead. Deuteronomy's “from the river, the river Euphrates, even unto the uttermost sea” is a wider ideal."
    - "Outside the Bible the name appears perhaps in a letter from Mari of the eighteenth century BC, on the statue of Idrimi of Alalakh, in the Amarna letters of the fourteenth century, where the pharaoh's province is Kinahhi, and on Merneptah's victory stele of about 1208 BC beside the first mention of Israel; the Egyptian texts take Canaan to run from Gaza to the Lebanon, much as Numbers does. The Greeks called the coast Phoenicia and the Romans the whole land Syria Palaestina; in the Bible the name gives way to the land of Israel and Judah, so that in the New Testament it survives only in Matthew's “woman of Canaan” from the coasts of Tyre and Sidon and in the retellings of the old history by Stephen and Paul. The article on Canaan tells of its peoples, its gods and the models of Israel's settlement; the questions on the journey from Ur and on Dan and Beersheba measure the land."
  ru:
    - "Ханаан — земля между Средиземным морем и Иорданом, от Ливана на севере до пустыни южнее Вирсавии: нынешние Израиль и палестинские территории с Ливаном и краем юго-западной Сирии. Точка карты для этой области стоит в Нижней Галилее, примерно в 110 км к северу от Иерусалима по прямой. Имя старше Израиля: египетские и клинописные тексты II тысячелетия до н. э. называют так египетскую провинцию в Леванте, а Библия — землю до того, как её взял Израиль, и землю, обещанную потомству Авраама."
    - "Книга Бытия проводит пределы Хананеев «от Сидона к Герару до Газы, отсюда к Содому, Гоморре» — побережье от Ливана до Филистии и вглубь до Мёртвого моря, примерно 200 км от Сидона до Иерусалима по прямой. Книга Чисел даёт уделу формальные границы: на юге от пустыни Син подле Едома и Солёного моря до потока Египетского; «великое море» на западе; на севере от моря через гору Ор к Емафу и Цедаду; на востоке вниз мимо моря Киннереф к Иордану и «к Соленому морю». Земля за Иорданом осталась вне: два с половиной колена «получили удел свой за Иорданом, против Иерихона, к востоку», и люди Иисуса Навина выходят из Силома, «который в земле Ханаанской», в Галаад. Слова Второзакония «от реки, реки Евфрата, даже до моря западного» — более широкий идеал."
    - "Вне Библии имя встречается, возможно, в письме из Мари XVIII века до н. э., на статуе Идрими из Алалаха, в амарнских письмах XIV века, где провинция фараона зовётся Кинаххи, и на победной стеле Мернептаха около 1208 г. до н. э. рядом с первым упоминанием Израиля; египетские тексты протягивают Ханаан от Газы до Ливана, почти как книга Чисел. Греки называли побережье Финикией, а римляне всю землю — Сирией Палестинской; в Библии имя уступает место земле Израилевой и Иудее, так что в Новом Завете оно остаётся лишь у Матфея, где из пределов Тира и Сидона выходит «женщина Хананеянка», и в пересказах старой истории у Стефана и Павла. Статья о Ханаане рассказывает о его народах, богах и моделях расселения Израиля; вопросы о пути из Ура и о Дане и Вирсавии измеряют землю."
  uk:
    - "Ханаан — земля між Середземним морем і Йорданом, від Лівану на півночі до пустелі на південь від Беер-Шеви: нинішній Ізраїль і палестинські території, з Ліваном і краєм південно-західної Сирії. Точка мапи для регіону стоїть у Нижній Галілеї, приблизно за 110 км на північ від Єрусалиму по прямій. Назва давніша за Ізраїль: єгипетські та клинописні тексти другого тисячоліття до н. е. вживають її для єгипетської провінції на Леванті, а Біблія — для землі до того, як її взяв Ізраїль, і для землі, обіцяної насінню Авраама."
    - "Книга Буття проводить межі ханаанеїв «від Сидону до Герару, до Гази, до Содому і Гоморри», узбережжям від Лівану до Филистії й углиб до Мертвого моря, приблизно 200 км від Сідону до Єрусалиму по прямій. Книга Чисел дає спадщині формальні межі: на півдні від пустелі Сін уздовж Едому і Солоного моря до потоку Єгипетського; «Велике море» на заході; на півночі від моря до гори Гор, до входу в Хамат і Цедад; на сході вниз повз озеро Кіннерет до Йордану, а виступи межі — «при морю Соляному». Земля на схід від Йордану лежала поза нею: два з половиною коліна «дістали наслїддє своє на сїм боцї Йорданї, проти Єрихону, на схід соньця», а люди Ісуса Навина виходять із Шіло, «що лежить у Канаан землї», до Гілеаду. Слова Повторення Закону «від ріки, ріки Евфрату та аж до західнього моря» — ширший ідеал."
    - "Поза Біблією назва з'являється, можливо, в листі з Марі XVIII ст. до н. е., на статуї Ідрімі з Алалаха, в амарнських листах XIV ст., де провінція фараона — Кінахі, і на переможній стелі Мернептаха близько 1208 р. до н. е. поряд з першою згадкою про Ізраїль; єгипетські тексти розуміють Ханаан як простягнутий від Гази до Лівану, подібно до Книги Чисел. Греки називали узбережжя Фінікією, а римляни всю землю — Сирією Палестиною; у Біблії назва поступається землі Ізраїлю та Юди, тож у Новому Заповіті вона залишилася лише в Матвієвій «жінці Канаанці» з країн Тіру й Сідону та в переказах старої історії Стефаном і Павлом. Стаття про Ханаан розповідає про його народи, його богів і моделі ізраїльського поселення; питання про подорож з Ура та про Дан і Беер-Шеву вимірюють землю."
  es:
    - "Canaán es la tierra entre el Mediterráneo y el Jordán, desde el Líbano en el norte hasta el desierto al sur de Beerseba: el actual Israel y los territorios palestinos, con el Líbano y el borde del suroeste de Siria. El punto del mapa para la región está en la Baja Galilea, a unos 110 km al norte de Jerusalén en línea recta. El nombre es más antiguo que Israel: textos egipcios y cuneiformes del segundo milenio a. C. lo usan para la provincia de Egipto en el Levante, y la Biblia lo usa para la tierra antes de que Israel la tomara y para la tierra prometida a la descendencia de Abraham."
    - "Génesis traza los límites de los cananeos «desde Sidón, viniendo á Gerar hasta Gaza, hasta entrar en Sodoma y Gomorra», la costa del Líbano a Filistea y tierra adentro hasta el mar Muerto, unos 200 km de Sidón a Jerusalén en línea recta. Números da a la herencia sus fronteras formales: al sur, desde el desierto de Zin por Edom y el mar Salado hasta el torrente de Egipto; «la gran mar» al oeste; al norte, desde el mar por un monte Hor hasta «la entrada de Hamath» y Sedad; al este, bajando por el mar de Cineret hasta el Jordán y «el mar Salado». La tierra al este del Jordán quedaba fuera: las dos tribus y media «tomaron su heredad de esta parte del Jordán de Jericó al oriente», y los hombres de Josué salen de Silo, «que está en la tierra de Canaán», hacia Galaad. El «desde el río, el río Eufrates, hasta la mar postrera» de Deuteronomio es un ideal más amplio."
    - "Fuera de la Biblia el nombre aparece quizá en una carta de Mari del siglo XVIII a. C., en la estatua de Idrimi de Alalaj, en las cartas de Amarna del siglo XIV, donde la provincia del faraón es Kinahhi, y en la estela de victoria de Merneptah, hacia el 1208 a. C., junto a la primera mención de Israel; los textos egipcios hacen correr Canaán de Gaza al Líbano, más o menos como Números. Los griegos llamaron Fenicia a la costa y los romanos Siria Palestina a toda la tierra; en la Biblia el nombre cede ante la tierra de Israel y Judá, de modo que en el Nuevo Testamento sobrevive solo en la «mujer Cananea» de Mateo, de las regiones de Tiro y Sidón, y en los relatos de la antigua historia de Esteban y Pablo. El artículo sobre Canaán trata de sus pueblos, sus dioses y los modelos del asentamiento de Israel; las preguntas sobre el viaje desde Ur y sobre Dan y Beerseba miden la tierra."
  pt:
    - "Canaã é a terra entre o Mediterrâneo e o Jordão, do Líbano ao norte até o deserto ao sul de Berseba: o Israel e os territórios palestinos de hoje, com o Líbano e a orla do sudoeste da Síria. O ponto do mapa para a região está na Baixa Galileia, a cerca de 110 km ao norte de Jerusalém em linha reta. O nome é mais antigo que Israel: textos egípcios e cuneiformes do segundo milênio a.C. o usam para a província do Egito no Levante, e a Bíblia o usa para a terra antes de Israel a tomar e para a terra prometida à descendência de Abraão."
    - "Gênesis traça os limites dos cananeus “desde Sidom — indo na direção de Gerar — até Gaza — indo na direção de Sodoma, Gomorra”, a costa do Líbano à Filístia e para o interior até o mar Morto, cerca de 200 km de Sidom a Jerusalém em linha reta. Números dá à herança suas fronteiras formais: ao sul, do deserto de Zim por Edom e o mar Morto até o ribeiro do Egito; “o mar Grande” a oeste; ao norte, do mar por um monte Hor até “a entrada de Hamate” e Zedade; a leste, descendo pelo mar de Quinerete até o Jordão e o “Mar Salgado”. A terra a leste do Jordão ficava fora: as duas tribos e meia “receberam a sua herança do outro lado do Jordão, na altura de Jericó, para o leste”, e em Josué os homens saem de Siló, “que está na terra de Canaã”, para Gileade. O “desde o rio, o rio Eufrates, até o mar ocidental” de Deuteronômio é um ideal mais amplo."
    - "Fora da Bíblia o nome aparece talvez numa carta de Mari do século XVIII a.C., na estátua de Idrimi de Alalakh, nas cartas de Amarna do século XIV, onde a província do faraó é Kinahhi, e na estela de vitória de Merneptá, de cerca de 1208 a.C., ao lado da primeira menção de Israel; os textos egípcios fazem Canaã ir de Gaza ao Líbano, tal como Números. Os gregos chamaram a costa de Fenícia e os romanos toda a terra de Síria Palestina; na Bíblia o nome cede à terra de Israel e Judá, de modo que no Novo Testamento só sobrevive na “mulher cananeia” de Mateus, das costas de Tiro e Sidom, e nos relatos da velha história por Estêvão e Paulo. O artigo sobre Canaã trata de seus povos, seus deuses e os modelos do povoamento de Israel; as perguntas sobre a viagem de Ur e sobre Dã e Berseba medem a terra."
  de:
    - "Kanaan ist das Land zwischen dem Mittelmeer und dem Jordan, vom Libanon im Norden bis zur Wüste südlich von Beerscheba: das heutige Israel und die palästinensischen Gebiete, mit dem Libanon und dem Rand des südwestlichen Syrien. Der Kartenpunkt für die Region liegt in Untergaliläa, in der Luftlinie etwa 110 km nördlich von Jerusalem. Der Name ist älter als Israel: Ägyptische und Keilschrifttexte des 2. Jahrtausends v. Chr. gebrauchen ihn für Ägyptens Provinz im Levante-Raum, und die Bibel gebraucht ihn für das Land, ehe Israel es nahm, und für das Abrahams Samen verheißene Land."
    - "Die Genesis zieht die Grenzen der Kanaaniter „von Sidon an durch Gerar bis gen Gaza, bis man kommt gen Sodom, Gomorra“, die Küste vom Libanon bis Philistäa und landeinwärts bis zum Toten Meer, etwa 200 km Luftlinie von Sidon nach Jerusalem. Das 4. Buch Mose gibt dem Erbteil seine förmlichen Grenzen: im Süden von der Wüste Zin bei Edom und dem Salzmeer bis zum Bach Ägyptens; „das große Meer“ im Westen; im Norden vom Meer bis zum Berg Hor, bis man „kommt gen Hamath“ und Zedad; im Osten hinab am Meer Kinneret vorbei zum Jordan, bis „das Salzmeer“. Das Land östlich des Jordan lag außerhalb: zwei Stämme und der halbe Stamm hatten ihr Erbteil „diesseit des Jordans gegenüber Jericho gegen Morgen“, und Josuas Männer gehen aus Silo, „das im Lande Kanaan liegt“, nach Gilead. Das „von dem Wasser Euphrat bis ans Meer gegen Abend“ des 5. Buches Mose ist ein weiteres Ideal."
    - "Außerhalb der Bibel erscheint der Name vielleicht in einem Brief aus Mari des 18. Jahrhunderts v. Chr., auf der Statue des Idrimi von Alalach, in den Amarna-Briefen des 14. Jahrhunderts, wo die Provinz des Pharao Kinahhi heißt, und auf Merenptahs Siegesstele von etwa 1208 v. Chr. neben der ersten Erwähnung Israels; die ägyptischen Texte lassen Kanaan von Gaza bis zum Libanon reichen, ähnlich wie das 4. Buch Mose. Die Griechen nannten die Küste Phönizien und die Römer das ganze Land Syria Palaestina; in der Bibel weicht der Name dem Land Israel und Juda, sodass er im Neuen Testament nur im „kanaanäischen Weib“ des Matthäus von den Küsten von Tyrus und Sidon und in Stephanus' und Pauli Nacherzählungen überlebt. Der Artikel über Kanaan behandelt Völker, Götter und Modelle der Landnahme Israels; die Fragen zur Reise von Ur und zu Dan und Beerscheba messen das Land."
  fr:
    - "Canaan est le pays entre la Méditerranée et le Jourdain, du Liban au nord jusqu’au désert au sud de Beer-Schéba : l’actuel Israël et les territoires palestiniens, avec le Liban et la lisière du sud-ouest de la Syrie. Le point de la carte pour la région est en Basse Galilée, à environ 110 km au nord de Jérusalem en ligne droite. Le nom est plus ancien qu’Israël : des textes égyptiens et cunéiformes du IIe millénaire av. J.-C. l’emploient pour la province de l’Égypte au Levant, et la Bible l’emploie pour le pays avant qu’Israël ne le prenne, et pour le pays promis à la postérité d’Abraham."
    - "La Genèse borne les Cananéens « depuis Sidon, du côté de Guérar, jusqu’à Gaza, et du côté de Sodome, de Gomorrhe », la côte de la Philistie au Liban et l’intérieur jusqu’à la mer Morte, environ 200 km de Sidon à Jérusalem en ligne droite. Les Nombres fixent ses frontières : au sud, du désert de Tsin par Édom et la mer Salée au torrent d’Égypte ; « la grande mer » à l’ouest ; au nord, de la mer par une montagne de Hor jusqu’à Hamath et Tsedad ; à l’est, en descendant le long de la mer de Kinnéreth jusqu’au Jourdain et à « la mer Salée ». L’est du Jourdain restait dehors : les deux tribus et demie « ont pris leur héritage en deçà du Jourdain, vis-à-vis de Jéricho, du côté de l’orient », et les hommes de Josué partent de Silo, « dans le pays de Canaan », pour Galaad. Le « du fleuve de l’Euphrate jusqu’à la mer occidentale » du Deutéronome est un idéal plus large."
    - "Hors de la Bible, le nom apparaît peut-être dans une lettre de Mari du XVIIIe siècle av. J.-C., sur la statue d’Idrimi d’Alalakh, dans les lettres d’Amarna du XIVe siècle, où la province du pharaon est Kinahhi, et sur la stèle de Mérenptah vers 1208 av. J.-C., à côté de la première mention d’Israël ; les textes égyptiens font courir Canaan de Gaza au Liban, comme les Nombres. Les Grecs nommaient la côte Phénicie, les Romains tout le pays Syrie-Palestine ; dans la Bible, le nom cède la place au pays d’Israël et de Juda, si bien que dans le Nouveau Testament il ne survit que dans la « femme cananéenne » de Matthieu, venue des régions de Tyr et de Sidon, et dans les récits d’Étienne et de Paul sur le passé. L’article sur Canaan traite de ses peuples, de ses dieux et des modèles de l’installation d’Israël ; les questions sur le voyage depuis Ur et sur Dan et Beer-Schéba mesurent le pays."
  pl:
    - "Kanaan to ziemia między Morzem Śródziemnym a Jordanem, od Libanu na północy do pustyni na południe od Beer-Szeby: dzisiejszy Izrael i terytoria palestyńskie, wraz z Libanem i skrajem południowo-zachodniej Syrii. Punkt na mapie dla regionu stoi w Dolnej Galilei, około 110 km na północ od Jerozolimy w linii prostej. Nazwa jest starsza niż Izrael: teksty egipskie i klinowe z drugiego tysiąclecia p.n.e. używają jej dla egipskiej prowincji w Lewancie, a Biblia używa jej dla ziemi przed jej zajęciem przez Izraela i dla ziemi obiecanej potomstwu Abrahama."
    - "Księga Rodzaju kreśli granice Kananejczyków „od Sydonu idąc do Gerary, aż do Gazy, aż wnijdziesz do Sodomy i Gomorry”, wybrzeże od Libanu po Filisteę i w głąb lądu do Morza Martwego, około 200 km od Sydonu do Jerozolimy w linii prostej. Księga Liczb nadaje dziedzictwu formalne granice: na południu od pustyni Sin przez Edom i Morze Słone do Potoku Egipskiego; „morze wielkie” na zachodzie; na północy od morza przez górę Hor do miejsca, „gdzie wchodzą do Hemat”, i do Sedadu; na wschodzie w dół obok morza Kinneret do Jordanu i „morza słonego”. Ziemia na wschód od Jordanu leżała poza nią: dwa i pół plemienia „wzięły dziedzictwo swoje z tej strony Jordanu przeciw Jerychu, ku stronie na wschód słońca”, ludzie Jozuego wychodzą z Szilo, „które jest w ziemi Chananejskiej”, do Gileadu. Księga Powtórzonego Prawa „od rzeki, rzeki Eufrates, aż do morza ostatniego” to szerszy ideał."
    - "Poza Biblią nazwa pojawia się być może w liście z Mari z XVIII wieku p.n.e., na posągu Idrimiego z Alalach, w listach z Amarna z XIV wieku, w których prowincja faraona to Kinahhi, i na steli zwycięstwa Merneptaha z około 1208 p.n.e. obok pierwszej wzmianki o Izraelu; teksty egipskie każą Kanaanowi biec od Gazy do Libanu, mniej więcej jak Księga Liczb. Grecy nazywali wybrzeże Fenicją, a Rzymianie całą ziemię Syria Palaestina; w Biblii nazwa ustępuje ziemi Izraela i Judy, tak że w Nowym Testamencie przetrwała tylko w Mateuszowej opowieści o kobiecie z okolic Tyru i Sydonu, „niewiasta Chananejska”, oraz w przypomnieniach dawnej historii przez Szczepana i Pawła. Artykuł o Kanaanie opowiada o jego ludach, bogach i modelach osadnictwa Izraela; pytania o podróż z Ur oraz o Dan i Beer-Szebę mierzą ziemię."
  it:
    - "Canaan è la terra tra il Mediterraneo e il Giordano, dal Libano a nord al deserto a sud di Bersabea: l’odierno Israele e i territori palestinesi, con il Libano e il margine della Siria sud-occidentale. Il punto della mappa per la regione sta nella Bassa Galilea, a circa 110 km a nord di Gerusalemme in linea retta. Il nome è più antico di Israele: testi egizi e cuneiformi del II millennio a.C. lo usano per la provincia egizia nel Levante, e la Bibbia lo usa per la terra prima che Israele la prendesse, e per la terra promessa alla progenie di Abramo."
    - "La Genesi traccia i confini dei Cananei «da Sidon, in direzione di Gherar, fino a Gaza; e in direzione di Sodoma, Gomorra», la costa dal Libano alla Filistea e verso l’interno fino al Mar Morto, circa 200 km da Sidone a Gerusalemme in linea retta. I Numeri danno all’eredità i suoi confini formali: a sud dal deserto di Zin lungo Edom e il Mar Morto fino al torrente d’Egitto; «il mar grande» a ovest; a nord dal mare per un monte Hor fino a «dove s’entra in Hamath» e a Zedad; a est giù oltre il mare di Chinnerèt fino al Giordano e al «mar Salato». La terra a est del Giordano restava fuori: le due tribù e mezzo «hanno ricevuto la loro porzione di qua dal Giordano di Gerico, dal lato d’oriente», e gli uomini di Giosuè lasciano Silo, «nel paese di Canaan», per andare in Galaad. Il «dal fiume, il fiume Eufrate, al mare occidentale» del Deuteronomio è un ideale più ampio."
    - "Fuori dalla Bibbia il nome compare forse in una lettera di Mari del XVIII secolo a.C., sulla statua di Idrimi di Alalakh, nelle lettere di Amarna del XIV secolo, dove la provincia del faraone è Kinahhi, e sulla stele della vittoria di Merenptah intorno al 1208 a.C. accanto alla prima menzione di Israele; i testi egizi fanno correre Canaan da Gaza al Libano, un po’ come i Numeri. I Greci chiamarono la costa Fenicia e i Romani l’intero paese Syria Palaestina; nella Bibbia il nome cede il posto alla terra di Israele e di Giuda, così che nel Nuovo Testamento sopravvive solo nella «donna cananea» di Matteo dalle coste di Tiro e Sidone e nei racconti della vecchia storia di Stefano e Paolo. L’articolo su Canaan narra i suoi popoli, i suoi dèi e i modelli dell’insediamento di Israele; le domande sul viaggio da Ur e su Dan e Bersabea misurano la terra."
  nl:
    - "Kanaän is het land tussen de Middellandse Zee en de Jordaan, van de Libanon in het noorden tot de woestijn ten zuiden van Berseba: het huidige Israël en de Palestijnse gebieden, met Libanon en de rand van Zuidwest-Syrië. Het punt op de kaart voor de regio staat in Neder-Galilea, hemelsbreed ongeveer 110 km ten noorden van Jeruzalem. De naam is ouder dan Israël: Egyptische en spijkerschriftteksten uit het tweede millennium v.Chr. gebruiken hem voor Egypte’s provincie in de Levant, en de Bijbel gebruikt hem voor het land vóór Israël het innam en voor het land dat aan Abrahams zaad was beloofd."
    - "Genesis laat de Kanaänitische grens lopen “van Sidon, daar gij gaat naar Gerar tot Gaza toe; daar gij gaat naar Sodom en Gomorra”, van de Libanon-kust tot Filistea en landinwaarts tot de Dode Zee, hemelsbreed ongeveer 200 km van Sidon naar Jeruzalem. Numeri geeft de formele grenzen: zuid vanaf de woestijn Zin langs Edom en de Zoutzee tot de rivier van Egypte; “de grote zee” in het westen; noord van de zee langs de berg Hor “tot daar men komt te Hamath” en Zedad; oost langs “den oever van de zee Cinnereth” naar de Jordaan en de Zoutzee. Het oosten van de Jordaan lag erbuiten: twee en een halve stam “hebben hun erfenis ontvangen aan deze zijde van de Jordaan, van Jericho oostwaarts”, en Jozua’s mannen gaan van Silo, “dat in het land Kanaan is”, naar Gilead. Deuteronomiums “van de rivier, de rivier Frath, tot aan de achterste zee” is een ruimer ideaal."
    - "Buiten de Bijbel komt de naam misschien voor in een brief uit Mari (18e eeuw v.Chr.), op Idrimi’s standbeeld uit Alalach, in de Amarnabrieven (14e eeuw), waar de farao’s provincie Kinahhi heet, en op Merneptahs overwinningsstèle van omstreeks 1208 v.Chr. naast de eerste vermelding van Israël; Egyptische teksten laten Kanaän van Gaza tot de Libanon lopen, ongeveer als Numeri. De Grieken noemden de kust Fenicië en de Romeinen het hele land Syria Palaestina; in de Bijbel maakt de naam plaats voor het land van Israël en Juda, zodat hij in het Nieuwe Testament alleen voortleeft in Mattheüs’ “Kananese vrouw” van de kusten van Tyrus en Sidon en in de navertellingen van de oude geschiedenis door Stefanus en Paulus. Het artikel over Kanaän vertelt over zijn volken, goden en modellen van Israëls vestiging; de vragen over de reis vanuit Ur en over Dan en Berseba meten het land."
  cs:
    - "Kanaán je země mezi Středozemním mořem a Jordánem, od Libanonu na severu k poušti jižně od Beer-šeby: dnešní Izrael a palestinská území, s Libanonem a okrajem jihozápadní Sýrie. Bod na mapě pro oblast stojí v Dolní Galileji, asi 110 km severně od Jeruzaléma vzdušnou čarou. Jméno je starší než Izrael: egyptské a klínopisné texty 2. tisíciletí př. n. l. je užívají pro egyptskou provincii v Levantě a Bible je užívá pro zemi před jejím dobytím Izraelem a pro zemi zaslíbenou Abrahamovu semeni."
    - "Genesis vykresluje hranice Kananejských „od Sidonu, když jdeš k Gerar až do Gázy; a odtud když jdeš k Sodomě a Gomoře“, pobřeží od Libanonu k Pelištii a do vnitrozemí k Mrtvému moři, asi 200 km ze Sidónu do Jeruzaléma vzdušnou čarou. Čísla dávají dědictví formální hranice: na jihu od pouště Sín podél Edómu a Slaného moře k Egyptskému potoku; na západě „moře veliké“; na severu od moře k hoře Hor, „až kde se vchází do Emat“, a k Sedadu; na východě dolů kolem moře Kineret k Jordánu, až „u slaného moře“. Země východně od Jordánu ležela mimo: půl třetího pokolení „vzali dědictví své před Jordánem proti Jerichu, k straně na východ slunce“ a Jozueho muži odcházejí ze Šíla, „jenž jest v zemi Kananejské“, do Gileadu. Deuteronomiovo „od řeky Eufraten až k moři nejdalšímu“ je širší ideál."
    - "Mimo Bibli se jméno objevuje snad v dopise z Mari z 18. století př. n. l., na soše Idrimiho z Alalachu, v amarnských dopisech ze 14. století, kde je faraonovou provincií Kinahhi, a na Merneptahově vítězné stéle z asi 1208 př. n. l. vedle první zmínky o Izraeli; egyptské texty chápou Kanaán jako rozkládající se od Gazy k Libanonu, zhruba jako Čísla. Řekové nazývali pobřeží Fénicií a Římané celou zemi Syria Palaestina; v Bibli jméno ustupuje zemi Izraele a Judy, takže v Novém zákoně přežívá jen v Matoušově vyprávění: „žena Kananejská“ z krajin Týru a Sidónu a ve vyprávěních staré historie Štěpánem a Pavlem. Článek o Kanaánu vypráví o jeho národech, bozích a modelech izraelského osídlení; otázky o cestě z Uru a o Danu a Beer-šebě zemi měří."
  sv:
    - "Kanaan är landet mellan Medelhavet och Jordan, från Libanon i norr till öknen söder om Beer Sheva: dagens Israel och de palestinska områdena, med Libanon och kanten av sydvästra Syrien. Kartpunkten för regionen står i Nedre Galileen, omkring 110 km norr om Jerusalem fågelvägen. Namnet är äldre än Israel: egyptiska och kilskriftstexter från andra årtusendet f.Kr. använder det för Egyptens provins i Levanten, och Bibeln använder det för landet innan Israel tog det, och för landet som utlovades åt Abrahams säd."
    - "1 Mosebok drar kananéernas gränser ”från Sidon fram emot Gerar ända till Gasa, och fram emot Sodom, Gomorra ...”, kusten från Libanon till Filisteen och inåt landet till Döda havet, omkring 200 km från Sidon till Jerusalem fågelvägen. 4 Mosebok ger arvedelen dess formella gränser: på södra sidan från öknen Sin längs Edom och Döda havet till Egyptens bäck; ”Stora havet” i väster; i norr från havet vid berget Hor till ”dit där vägen går till Hamat” och Sedad; i öster ned förbi Kinneretsjön till Jordan och Döda havet. Landet öster om Jordan låg utanför: de två och en halv stammarna ”hava fått sin arvedel på andra sidan Jordan mitt emot Jeriko, österut mot solens uppgång”, och Josuas män går ut från ”Silo i Kanaans land” till Gilead. 5 Moseboks ”ifrån floden – floden Frat – ända till Västra havet” är ett vidare ideal."
    - "Utanför Bibeln förekommer namnet kanske i ett brev från Mari från 1700-talet f.Kr., på statyn av Idrimi av Alalakh, i Amarnabreven från 1300-talet, där faraos provins är Kinahhi, och på Merneptahs segerstele från omkring 1208 f.Kr. bredvid den första omnämningen av Israel; de egyptiska texterna låter Kanaan sträcka sig från Gaza till Libanon, ungefär som 4 Mosebok gör. Grekerna kallade kusten Fenicien och romarna hela landet Syria Palaestina; i Bibeln viker namnet för Israels och Judas land, så att det i Nya testamentet bara överlever i Matteus berättelse om ”en kananeisk kvinna” från trakten av Tyros och Sidon och i Stefanos’ och Paulus’ återberättelser av den gamla historien. Artikeln om Kanaan berättar om dess folk, dess gudar och modellerna för Israels bosättning; frågorna om resan från Ur och om Dan och Beer Sheva mäter landet."
  nb:
    - "Kanaan er landet mellom Middelhavet og Jordan, fra Libanon i nord til ørkenen sør for Beer-Sjeba: dagens Israel og de palestinske områdene, med Libanon og kanten av det sørvestlige Syria. Kartpunktet for regionen står i Nedre Galilea, omtrent 110 km nord for Jerusalem i luftlinje. Navnet er eldre enn Israel: egyptiske tekster og tekster i kileskrift fra det andre årtusen f.Kr. bruker det om Egypts provins i Levanten, og Bibelen bruker det om landet før Israel tok det, og om landet som var lovet Abrahams ætt."
    - "1 Mosebok trekker kanaanittenes grenser «fra Sidon bortimot Gerar like til Gasa, og bortimot Sodoma og Gomorra», kysten fra Libanon til Filistea og innover til Dødehavet, omtrent 200 km fra Sidon til Jerusalem i luftlinje. 4 Mosebok gir arven dens formelle grenser: i sør fra Sin-ørkenen langs Edom og Saltsjøen til Egypts bekk; «det store hav» i vest; i nord fra havet til «fjellet Hor» til «dit hvor veien går til Hamat» og Sedad; i øst ned forbi Kinneret-sjøen til Jordan og «Salthavet». Landet øst for Jordan lå utenfor: de to og en halv stamme «har fått sin arv på denne side av Jordan midt imot Jeriko - mot øst», og Josvas menn drar fra Sjilo, «som ligger i Kana'ans land», til Gilead. 5 Mosebok «fra den store elv, elven Frat, og til havet i vest» er et videre ideal."
    - "Utenfor Bibelen dukker navnet kanskje opp i et brev fra Mari fra 1700-tallet f.Kr., på statuen av Idrimi av Alalakh, i Amarna-brevene fra 1300-tallet, der faraos provins er Kinahhi, og på Merenptahs seiersstele fra omkring 1208 f.Kr. ved siden av den første omtalen av Israel; de egyptiske tekstene lar Kanaan løpe fra Gasa til Libanon, omtrent som 4 Mosebok. Grekerne kalte kysten Fønikia og romerne hele landet Syria Palaestina; i Bibelen viker navnet for Israels og Judas land, så i Det nye testamente overlever det bare i Matteus' «kananeisk kvinne» fra Tyros' og Sidons områder og i Stefanus' og Paulus' gjenfortellinger av den gamle historien. Artikkelen om Kanaan forteller om folkene, gudene og modellene for Israels bosetting; spørsmålene om reisen fra Ur og om Dan og Beer-Sjeba måler landet."
  tl:
    - "Ang Canaan ay ang lupain sa pagitan ng Mediteraneo at ng Jordan, mula sa Libano sa hilaga hanggang sa disyerto sa timog ng Beer-seba: ang Israel ngayon at ang mga teritoryong Palestino, kasama ang Libano at gilid ng timog-kanlurang Siria. Ang tuldok sa mapa para sa rehiyon ay nasa Mababang Galilea, mga 110 km sa hilaga ng Jerusalem sa tuwid na guhit. Mas matanda ang pangalan kaysa sa Israel: ginagamit ito ng mga tekstong Egipcio at cuneiform ng ikalawang milenyo BK para sa lalawigan ng Egipto sa Levante, at ginagamit ito ng Biblia para sa lupain bago ito kunin ng Israel, at para sa lupaing ipinangako sa binhi ni Abraham."
    - "Hangganan ng Cananeo sa Genesis “mula sa Sidon, kung patungo sa Gerar, hanggang sa Gaza; kung patungo sa Sodoma at Gomorra”: baybayin mula Libano hanggang Filistia, papasok hanggang Dagat na Patay, mga 200 km mula Sidon hanggang Jerusalem (tuwid na guhit). Pormal na hangganan ng mana sa Mga Bilang: timog, mula ilang ng Zin sa Edom at Dagat na Alat hanggang batis ng Egipto; kanluran, “ang malaking dagat”; hilaga, mula sa dagat sa isang bundok ng Hor hanggang “ang pasukan ng Hamath” at Sedad; silangan, pababa sa dagat ng Cinereth hanggang Jordan at “Dagat na Alat”. Labas ang silangan ng Jordan: ang 2½ lipi ay “nagsitanggap na ng kanilang mana sa dako roon ng Jordan sa dakong silanganan ng Jerico”, at umalis sa Shiloh ang tauhan ni Josue, “na nasa lupain ng Canaan”, patungong Gilead. Ang “mula sa ilog, sa ilog Eufrates, hanggang sa dagat kalunuran” ng Deuteronomio ay mas malawak na huwaran."
    - "Sa labas ng Biblia, lumilitaw marahil ang pangalan sa liham mula sa Mari noong ika-18 siglo BK, sa estatwa ni Idrimi ng Alalakh, sa mga liham ng Amarna (ika-14 na siglo), kung saan Kinahhi ang lalawigan ng paraon, at sa estela ng tagumpay ni Merneptah (mga 1208 BK) katabi ng unang pagbanggit sa Israel; ang Canaan sa tekstong Egipcio ay mula Gaza hanggang Libano, tulad sa Mga Bilang. Fenicia ang tawag ng Griyego sa baybayin, Syria Palaestina ng Romano sa buong lupain; sa Biblia, nagbibigay-daan ang pangalan sa lupain ng Israel at Juda, kaya sa Bagong Tipan, nananatili lang sa “babaing Cananea” ni Mateo mula sa Tiro at Sidon at sa pagsasalaysay muli ng lumang kasaysayan nina Esteban at Pablo. Nasa artikulo tungkol sa Canaan ang mga bayan, diyos at mga modelo ng pananahan ng Israel; sinusukat ang lupain sa mga tanong tungkol sa paglalakbay mula Ur at sa Dan at Beer-seba."
  da:
    - "Kana'an er landet mellem Middelhavet og Jordan, fra Libanon i nord til ørkenen syd for Beersheba: nutidens Israel og de palæstinensiske områder, med Libanon og kanten af det sydvestlige Syrien. Kortets punkt for regionen står i Nedre Galilæa, omkring 110 km nord for Jerusalem i luftlinje. Navnet er ældre end Israel: egyptiske og kileskrifttekster fra andet årtusinde f.Kr. bruger det om Egyptens provins i Levanten, og Bibelen bruger det om landet, før Israel tog det, og om det land, der blev lovet Abrahams afkom."
    - "Første Mosebog drager kana'anæernes grænser »fra Zidon henimod Gerar indtil Gaza, henimod Sodoma og Gomorra«, kysten fra Libanon til Filistæa og ind i landet til Det Døde Hav, omkring 200 km fra Sidon til Jerusalem i luftlinje. Fjerde Mosebog giver arven dens formelle grænser: mod syd fra Zins ørken forbi Edom og Salthavet til Egyptens Bæk; »det store Hav« mod vest; mod nord fra havet til et bjerg Hor til Hamats indgang og Sedad; mod øst ned forbi Kinnerets hav til Jordan og »Salthavet«. Landet øst for Jordan lå uden for: de to og en halv stamme har »faaet deres Arv paa denne Side Jordanen lige for Jeriko, foran mod Østen«, og Josvas mænd går fra Silo, »som er i Kanaans Land«, til Gilead. Femte Mosebogs »fra Floden, den Flod Frat, og indtil det yderste Hav« er et videre ideal."
    - "Uden for Bibelen optræder navnet muligvis i et brev fra Mari fra 1700-tallet f.Kr., på Idrimis statue fra Alalakh, i Amarna-brevene fra 1300-tallet, hvor faraos provins er Kinahhi, og på Merneptahs sejrsstele fra omkring 1208 f.Kr. ved siden af den første omtale af Israel; de egyptiske tekster lader Kana'an løbe fra Gaza til Libanon, nogenlunde som Fjerde Mosebog. Grækerne kaldte kysten Fønikien og romerne hele landet Syria Palaestina; i Bibelen viger navnet for Israels og Judas land, så det i Det Nye Testamente kun overlever i Mattæus' »kananæisk Kvinde« fra Tyrus' og Sidons egne og i Stefanus' og Paulus' genfortællinger af den gamle historie. Artiklen om Kana'an fortæller om dets folk, dets guder og modellerne for Israels bosættelse; spørgsmålene om rejsen fra Ur og om Dan og Beersheba måler landet."
  sr:
    - "Ханан је земља између Средоземног мора и Јордана, од Ливана на северу до пустиње јужно од Вирсавеје: данашњи Израел и палестинске територије, са Либаном и ивицом југозападне Сирије. Тачка на карти за област стоји у Доњој Галилеји, око 110 км северно од Јерусалима правом линијом. Име је старије од Израела: египатски и клинописни текстови другог миленијума п. н. е. користе га за египатску провинцију у Леванту, а Библија га користи за земљу пре него што ју је Израиљ узео, и за земљу обећану Аврамовом семену."
    - "Постање црта међе Хананеја „од Сидона идући на Герар па до Газе, и идући на Содом и Гомор“, обала од Ливана до Филистеје и у унутрашњости до Мртвог мора, око 200 км од Сидона до Јерусалима правом линијом. Бројеви дају наследству формалне границе: на југу од пустиње Син поред Едома и Сланог мора до потока египатског; „велико море“ на западу; на северу од мора преко горе Ор до места „како се иде у Емат“ и Седада; на истоку доле поред мора Кинерета до Јордана и сланог мора. Земља источно од Јордана лежала је изван: два и по племена „примише наследство своје с ову страну Јордана према Јерихону с источне стране“, а људи Исуса Навина полазе из „Силома, који је у земљи хананској“ у Галад. „Од реке, реке Ефрата, до мора западног“ из Поновљених закона шири је идеал."
    - "Изван Библије име се јавља можда у једном писму из Марија из 18. века п. н. е., на кипу Идримија од Алалаха, у амарнским писмима из 14. века, где је фараонова провинција Кинахи, и на Мернептаховој победничкој стели око 1208. п. н. е. поред првог помена Израиља; египатски текстови узимају да Ханан иде од Газе до Ливана, слично као Бројеви. Грци су обалу звали Феникија, а Римљани целу земљу Сирија Палестина; у Библији име уступа место земљи Израиља и Јуде, па у Новом завету преживљава само код Матеја, у речима „жена Хананејка“ из крајева Тира и Сидона и у препричавањима старе историје код Стефана и Павла. Чланак о Ханану прича о његовим народима, боговима и моделима израиљског насељавања; питања о путовању из Ура и о Дану и Вирсавеји мере земљу."
  hu:
    - "Kánaán a Földközi-tenger és a Jordán közötti föld, északon a Libanontól a Beérsebától délre fekvő sivatagig: a mai Izrael és a palesztin területek, Libanonnal és Délnyugat-Szíria szélével. A régió térképi pontja Alsó-Galileában áll, Jeruzsálemtől egyenes vonalban mintegy 110 km-re északra. A név régebbi Izráelnél: a Kr. e. 2. évezredi egyiptomi és ékírásos szövegek Egyiptom levantei provinciájára használják, a Biblia pedig arra a földre, mielőtt Izráel elfoglalta, és az Ábrahám magvának ígért földre."
    - "A Mózes első könyve a kánaániak határait így vonja meg: „Czídonból Gérár felé menve Gázáig; Sodoma, Gomora […]”, vagyis a partot a Libanontól a Filiszteusok földjéig és befelé a Holt-tengerig, Szidóntól Jeruzsálemig egyenes vonalban mintegy 200 km. A 4Móz formális határokat ad az örökségnek: délen a Cin pusztájától Edomon és a Sós-tengeren át Egyiptom patakjáig; nyugaton „a nagy tenger”; északon a tengertől a Hór-hegyen át „a Hamáthba való bejárásig” és Cedádig; keleten lefelé a Kinneret tengere mellett a Jordánig és a Sós-tengerig. A Jordánon túli föld kívül esett: a két és fél törzs „megkapta az ő örökségét a Jordánon túl, Jérikhó ellenében napkelet felől”, Józsué emberei pedig „Silóból, a mely Kanaán földén van” mennek Gileádba. Az 5Móz „a folyóvíztől, az Eufrátes folyóvizétől a nyugoti tengerig” kijelölt határa tágabb eszmény."
    - "A Biblián kívül a név talán egy mári levélben szerepel a Kr. e. 18. századból, az alalahi Idrimi szobrán, a Kr. e. 14. századi amarnai levelekben, ahol a fáraó provinciája Kinahhi, és Merenptah Kr. e. 1208 körüli győzelmi sztéléjén, Izráel első említése mellett; az egyiptomi szövegek Kánaánt Gázától a Libanonig terjesztik, nagyjából mint a 4Móz. A görögök a partot Föníciának, a rómaiak az egész földet Syria Palaestinának nevezték; a Bibliában a név helyét átveszi Izráel és Júda földje, így az Újszövetségben csak Máté „kananeus asszonyában” él tovább, Tírusz és Szidón vidékéről, valamint István és Pál történelmi összefoglalóiban. A Kánaánról szóló cikk népeiről, isteneiről és Izráel megtelepedésének modelljeiről szól; az Urból induló útról, valamint Dánról és Beérsebáról szóló kérdések a földet mérik."
  fi:
    - "Kanaan on Välimeren ja Jordanin välinen maa, Libanonista pohjoisessa Beerseban eteläpuoliselle autiomaalle: nykyinen Israel ja palestiinalaisalueet, Libanon ja Lounais-Syyrian reuna. Alueen karttapiste on Ala-Galileassa, noin 110 km Jerusalemista pohjoiseen linnuntietä. Nimi on Israelia vanhempi: egyptiläiset ja nuolenpääkirjoitustekstit toiselta vuosituhannelta eaa. käyttävät sitä Egyptin Levantin provinssista, ja Raamattu käyttää sitä maasta ennen kuin Israel sen valtasi ja Abrahamin siemenelle luvatusta maasta."
    - "1. Mooseksen kirja vetää kanaanilaisten rajat ”Siidonista Gerariin päin aina Gassaan asti sekä Sodomaan, Gomorraan”, rannikko Libanonista Filisteaan ja sisämaassa Kuolleelle merelle, noin 200 km Sidonista Jerusalemiin linnuntietä. 4. Mooseksen kirja antaa perintömaalle muodolliset rajat: etelässä Zinin erämaasta Edomia pitkin ja Suolamereltä Egyptin purolle; lännessä ”Suuri meri”; pohjoisessa merestä Hoorin vuoreen, ”siihen, mistä mennään Hamatiin”, ja Sedadiin; idässä alas ”Kinneretin järven” ohi Jordaniin ja ”Suolamereen”. Jordanin itäpuoli jäi ulkopuolelle: kaksi ja puoli sukukuntaa ”ovat jo saaneet perintöosansa tällä puolella Jordania Jerikon kohdalla, itään päin”, ja Joosuan miehet lähtevät Silosta, ”joka on Kanaanin maassa”, Gileadiin. 5. Mooseksen kirjan ”virrasta, Eufrat-virrasta, aina Länsimereen saakka” on laajempi ihanne."
    - "Raamatun ulkopuolella nimi esiintyy ehkä Marin kirjeessä 1700-luvulta eaa., Alalakhin Idrimin patsaalla, 1300-luvun Amarna-kirjeissä, joissa faraon provinssi on Kinahhi, ja Merneptahin voitonstelellä noin 1208 eaa. Israelin ensimmäisen maininnan vieressä; egyptiläiset tekstit antavat Kanaanin ulottua Gazasta Libanoniin, suunnilleen kuten 4. Mooseksen kirja. Kreikkalaiset kutsuivat rannikkoa Foinikiaksi ja roomalaiset koko maata nimellä Syria Palaestina; Raamatussa nimi väistyy Israelin ja Juudan maan tieltä, joten Uudessa testamentissa se säilyy vain Matteuksen ”kanaanilaisessa vaimossa” Tyroksen ja Sidonin seudulta sekä Stefanoksen ja Paavalin vanhan historian kertauksissa. Kanaania koskeva artikkeli kertoo sen kansoista, jumalista ja Israelin asutusmalleista; kysymykset matkasta Urista sekä Daanista ja Beersebasta mittaavat maata."
  vi:
    - "Ca-na-an là xứ giữa Địa Trung Hải và sông Giô-đanh, từ Li-ban ở phía bắc đến sa mạc phía nam Bê-e-Sê-ba: Israel và các lãnh thổ Palestine ngày nay, cùng Li-ban và rìa tây nam Sy-ri. Điểm bản đồ của vùng đứng ở Hạ Ga-li-lê, cách Giê-ru-sa-lem khoảng 110 km về phía bắc theo đường thẳng. Tên này cổ hơn Y-sơ-ra-ên: các văn bản Ê-díp-tô và chữ hình nêm thiên niên kỷ 2 TCN dùng nó cho tỉnh của Ê-díp-tô ở Levant, và Kinh Thánh dùng nó cho xứ trước khi Y-sơ-ra-ên chiếm, và cho xứ hứa cho dòng dõi Áp-ra-ham."
    - "Sáng thế ký vạch ranh giới người Ca-na-an: “về hướng Ghê-ra, chạy từ Si-đôn tới Ga-xa; về hướng Sô-đôm, Gô-mô-rơ, Át-ma và Sê-bô-im, chạy đến Lê-sa”, tức bờ biển từ Li-ban đến đất Phi-li-tin và vào nội địa đến Biển Chết, khoảng 200 km từ Si-đôn đến Giê-ru-sa-lem theo đường thẳng. Dân số ký cho phần cơ nghiệp các biên giới chính thức: phía nam từ đồng vắng Xin dọc Ê-đôm và Biển Muối đến Khe Ê-díp-tô; “biển lớn” ở phía tây; phía bắc từ biển qua núi Hô-rơ đến “đầu Ha-mát” và Xê-đát; phía đông xuống qua biển Ki-nê-rết đến Giô-đanh và “Biển-mặn”. Đất phía đông Giô-đanh nằm ngoài: hai chi phái rưỡi “đã nhận lãnh sản nghiệp mình ở phía bên kia sông Giô-đanh, đối ngang Giê-ri-cô về hướng đông”, và người của Giô-suê rời Si-lô “ở xứ Ca-na-an” đến Ga-la-át. Giới hạn “từ sông Ơ-phơ-rát đến biển tây” của sách Phục truyền là một lý tưởng rộng hơn."
    - "Ngoài Kinh Thánh, tên này có lẽ xuất hiện trong một lá thư từ Mari thế kỷ 18 TCN, trên tượng Idrimi của Alalakh, trong các thư Amarna thế kỷ 14, nơi tỉnh của pharaoh là Kinahhi, và trên bia chiến thắng của Merneptah khoảng 1208 TCN cạnh lần nhắc đầu tiên đến Y-sơ-ra-ên; các văn bản Ê-díp-tô coi Ca-na-an chạy từ Ga-xa đến Li-ban, khá giống Dân số ký. Người Hy Lạp gọi bờ biển là Phê-ni-xi và người La Mã gọi cả xứ là Syria Palaestina; trong Kinh Thánh, tên nhường chỗ cho xứ Y-sơ-ra-ên và Giu-đa, nên trong Tân Ước nó chỉ còn trong “người đàn bà xứ Ca-na-an” của Ma-thi-ơ từ vùng Ty-rơ và Si-đôn và trong lời kể lại lịch sử cũ của Ê-tiên và Phao-lô. Bài viết về Ca-na-an kể về các dân, các thần và các mô hình định cư của Y-sơ-ra-ên; các câu hỏi về hành trình từ U-rơ và về Đan và Bê-e-Sê-ba đo xứ này."
  ro:
    - "Canaanul este țara dintre Mediterana și Iordan, de la Liban la nord până la deșertul de la sud de Beer-Șeba: Israelul de azi și teritoriile palestiniene, cu Libanul și marginea de sud-vest a Siriei. Punctul de pe hartă pentru regiune stă în Galileea de Jos, la circa 110 km nord de Ierusalim în linie dreaptă. Numele este mai vechi decât Israelul: textele egiptene și cuneiforme din mileniul al II-lea î.Hr. îl folosesc pentru provincia Egiptului din Levant, iar Biblia îl folosește pentru țara dinainte ca Israel s-o ia și pentru țara făgăduită urmașilor lui Avraam."
    - "Facerea trasează hotarele canaaniților „dela Sidon până la Gherara și Gaza, până la Sodoma și Gomora”, coasta de la Liban până la Filistia și spre interior până la Marea Moartă, circa 200 km de la Sidon la Ierusalim în linie dreaptă. Numeri dă moștenirii hotarele ei formale: la sud, de la pustia Țin pe lângă Edom și Marea Sărată până la Pârâul Egiptului; „Marea cea mare” la vest; la nord, de la mare printr-un munte Hor până la „unde intră la Emat” și Țedad; la est, în jos pe lângă marea Chineret până la Iordan și „Marea cea sărată”. Țara de la est de Iordan rămânea în afară: cele două seminții și jumătate „au luat moșiile sale dincolo de Iordan de către Ierihon”, iar oamenii lui Iosua pleacă din Silo, „care este în pământul Hanaan”, spre Galaad. Un ideal mai larg dă Deuteronomul: „de la rîul cel mare al Eufratului și până la marea cea de către apus”."
    - "În afara Bibliei, numele apare poate într-o scrisoare de la Mari din secolul al XVIII-lea î.Hr., pe statuia lui Idrimi din Alalah, în scrisorile de la Amarna din secolul al XIV-lea, unde provincia faraonului este Kinahhi, și pe stela de victorie a lui Merneptah din circa 1208 î.Hr., alături de prima pomenire a Israelului; textele egiptene socotesc Canaanul de la Gaza până la Liban, cam ca Numeri. Grecii au numit coasta Fenicia, iar romanii întreaga țară Syria Palaestina; în Biblie, numele face loc țării lui Israel și Iuda, așa că în Noul Testament supraviețuiește doar în „o muiere Hananiancă” a lui Matei, din ținutul Tirului și Sidonului, și în povestirile istoriei vechi ale lui Ștefan și Pavel. Articolul despre Canaan vorbește despre popoarele, zeii lui și modelele așezării Israelului; întrebările despre călătoria din Ur și despre Dan și Beer-Șeba măsoară țara."
  bg:
    - "Ханаан е земята между Средиземно море и Йордан, от Ливан на север до пустинята южно от Вирсавия: днешен Израел и палестинските територии, с Ливан и края на Югозападна Сирия. Точката на картата за областта стои в Долна Галилея, на около 110 км северно от Йерусалим по права линия. Името е по-старо от Израил: египетски и клинописни текстове от II хил. пр.н.е. го използват за провинцията на Египет в Леванта, а Библията — за земята, преди Израил да я завладее, и за земята, обещана на потомството на Авраам."
    - "Битие очертава пределите на ханаанците „от Сидон като отхожда някой на Герар до Газа, и като отхожда някой в Содом, и Гомор“ — брега от Ливан до Филистия и навътре до Мъртво море, около 200 км от Сидон до Йерусалим по права линия. Числа дава на наследството официални граници: на юг от пустинята Цин покрай Едом и Солено море до Египетския поток; „голямото море“ на запад; на север от морето през една планина Ор до входа на Емат и Цедад; на изток надолу покрай морето Кинерет до Йордан и „Солено Море“. Земята отвъд Йордан оставала извън тях: двете и половина племена „взеха наследието си отсам Иордан, срещу Иерихон, към изток“, а хората на Иисус Навин тръгват „от Сило, което е в земята Ханаан“, към Галаад. „От реката, реката Евфрат, и дори до западното море“ на Второзаконие е по-широк идеал."
    - "Извън Библията името се появява може би в писмо от Мари от XVIII в. пр.н.е., на статуята на Идрими от Алалах, в писмата от Амарна от XIV в., където провинцията на фараона е Кинаххи, и на победната стела на Мернептах от около 1208 г. пр.н.е. до първото споменаване на Израил; египетските текстове смятат, че Ханаан се простира от Газа до Ливан, горе-долу както Числа. Гърците наричали брега Финикия, а римляните цялата земя — Сирия Палестина; в Библията името отстъпва пред земята на Израил и Юда, така че в Новия завет то оцелява само в „жена Хананейка“ при Матей от пределите на Тир и Сидон и в преразказите на старата история от Стефан и Павел. Статията за Ханаан разказва за народите, боговете и моделите на заселването на Израил; въпросите за пътя от Ур и за Дан и Вирсавия измерват земята."
