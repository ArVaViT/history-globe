id: where-was-tiberias
question:
  en: "Where was Tiberias?"
  ru: "Где находилась Тивериада?"
  uk: "Де була Тіверіада?"
  es: "¿Dónde estaba Tiberíades?"
  pt: "Onde ficava Tiberíades?"
  de: "Wo lag Tiberias?"
  fr: "Où se trouvait Tibériade ?"
  pl: "Gdzie leżała Tyberiada?"
  it: "Dov’era Tiberiade?"
  cs: "Kde ležela Tiberias?"
  nl: "Waar lag Tiberias?"
  sv: "Var låg Tiberias?"
  nb: "Hvor lå Tiberias?"
  tl: "Nasaan ang Tiberias?"
  da: "Hvor lå Tiberias?"
  sr: "Где је била Тиверијада?"
  hu: "Hol volt Tiberias?"
  fi: "Missä Tiberias sijaitsi?"
  vi: "Ti-bê-ri-át ở đâu?"
  ro: "Unde se afla Tiberiada?"
  bg: "Къде се е намирала Тивериада?"
answer:
  en:
    - "Tiberias stood where the city of Tiberias in Israel stands today, on the western shore of the Sea of Galilee below steep hills, with the hot springs of Hammath just to the south; the map point stands on the old town. It is about 115 km north of Jerusalem in a straight line, 12 km south-south-west of Capernaum and 24 km east-north-east of Nazareth. Herod Antipas, tetrarch of Galilee, founded it and named it after the emperor Tiberius; the founding is usually dated to about AD 19 or 20, though scholars differ by a year or two."
    - "The New Testament names the city only once, in John: after the feeding of the five thousand “there came other boats from Tiberias nigh unto the place where they did eat bread”. John also calls the lake “the sea of Galilee, which is the sea of Tiberias”, and it is “at the sea of Tiberias” that the risen Jesus shows himself to the disciples. The Gospels never say that Jesus entered Tiberias, though it lay a short walk from Capernaum. Josephus tells why many Jews kept away: the town was built over tombs, so that settlers had to be compelled to live there; it was also the seat of Antipas, whom Jesus called “that fox”."
    - "In the revolt of AD 66 a party in the city burned Antipas' palace for its images of living creatures, and in 67 Tiberias opened its gates to Vespasian. After the war it grew into a chief centre of Jewish learning: the Talmud names it as the last seat of the Sanhedrin, and the Jerusalem Talmud took shape largely in its schools by about AD 400. At Hammath, the walled town of Naphtali named in Joshua, excavators in the 1960s uncovered a synagogue whose fourth-century mosaic shows the zodiac around the sun god Helios."
  ru:
    - "Тивериада стояла там же, где и нынешний израильский город Тверия, на западном берегу моря Галилейского под крутыми холмами; сразу к югу от неё бьют горячие источники Хаммата. Точка карты стоит на старом городе. Отсюда примерно 115 км до Иерусалима к югу по прямой, 12 км до Капернаума к северу-северо-востоку и 24 км до Назарета к западу-юго-западу. Ирод Антипа, четвертовластник Галилеи, основал город и назвал в честь императора Тиверия; основание обычно относят примерно к 19 или 20 г. н. э., хотя учёные расходятся на год-два."
    - "Новый Завет называет город лишь однажды, у Иоанна: после насыщения пяти тысяч «пришли из Тивериады другие лодки близко к тому месту, где ели хлеб». Озеро Иоанн тоже называет по городу: Иисус пошёл «на ту сторону моря Галилейского, в окрестности Тивериады», а воскресший Господь «опять явился ученикам Своим при море Тивериадском». Евангелия нигде не говорят, что Иисус входил в Тивериаду, хотя от Капернаума до неё недалеко. Иосиф Флавий объясняет, почему многие иудеи её сторонились: город построили на месте гробниц, и поселенцев приходилось принуждать; к тому же здесь сидел Антипа, о котором Иисус сказал: «скажите этой лисице»."
    - "Во время восстания 66 г. н. э. горожане сожгли дворец Антипы за изображения живых существ, а в 67 г. Тивериада открыла ворота Веспасиану. После войны она стала одним из главных средоточий иудейской учёности: Талмуд называет её последним местопребыванием синедриона, а Иерусалимский Талмуд сложился в основном в её школах к 400 г. н. э. В Хаммате, укреплённом городе Неффалимовом из книги Иисуса Навина, в 1960-х годах раскопали синагогу, мозаика которой, IV века, изображает зодиак вокруг бога солнца Гелиоса."
  uk:
    - "Тіверіада стояла там, де нині стоїть місто Тверія в Ізраїлі, на західному березі Галілейського моря під крутими пагорбами, з гарячими джерелами Хамата просто на південь; точка на мапі стоїть на старому місті. Вона лежить приблизно за 115 км на північ від Єрусалима по прямій, за 12 км на південь-південний захід від Капернаума і за 24 км на схід-північний схід від Назарета. Ірод Антипа, тетрарх Галілеї, заснував її й назвав на честь імператора Тиверія; заснування зазвичай датують близько 19 або 20 р. н. е., хоча вчені розходяться на рік-два."
    - "Новий Заповіт називає місто лише раз, в Івана: після нагодування п'яти тисяч «инші ж човни поприходили з Тиверияди поблизу місця, де їли хлїб». Іван також називає озеро «моря Галилейського, Тивериядського», і саме «на морі Тивериядському» воскреслий Ісус з'являється учням. Євангелія ніколи не кажуть, що Ісус заходив до Тіверіади, хоч вона лежала недалеко від Капернаума. Йосиф Флавій розповідає, чому багато юдеїв трималися осторонь: місто було збудоване над гробницями, так що поселенців доводилося примушувати жити там; воно було також осідком Антипи, про якого Ісус сказав: «скажіть лисицї тій»."
    - "Під час повстання 66 р. н. е. одна партія в місті спалила палац Антипи за зображення живих істот, а 67 р. Тіверіада відчинила ворота Веспасіанові. Після війни вона виросла в головний центр юдейської науки: Талмуд називає її останнім осідком синедріону, а Єрусалимський Талмуд сформувався значною мірою в її школах до 400 р. н. е. У Хаматі, обмуроване місто Нефталимове, назване в Книзі Ісуса Навина, розкопники 1960-х рр. відкрили синагогу, чия мозаїка IV ст. показує зодіак навколо бога сонця Геліоса."
  es:
    - "Tiberíades se alzaba donde se alza hoy la ciudad de Tiberíades, en Israel, en la orilla occidental del mar de Galilea, bajo colinas empinadas, con las aguas termales de Hamat justo al sur; el punto del mapa está sobre la ciudad vieja. Queda a unos 115 km al norte de Jerusalén en línea recta, a 12 km al sudsudoeste de Cafarnaúm y a 24 km al estenordeste de Nazaret. Herodes Antipas, tetrarca de Galilea, la fundó y le dio el nombre del emperador Tiberio; la fundación se fecha por lo común hacia el 19 o 20 d. C., aunque los estudiosos difieren en un año o dos."
    - "El Nuevo Testamento nombra la ciudad una sola vez, en Juan: tras la multiplicación de los cinco mil, «otras navecillas habían arribado de Tiberias junto al lugar donde habían comido el pan». Juan llama también al lago «la mar de Galilea, que es de Tiberias», y es «en la mar de Tiberias» donde Jesús resucitado se manifiesta a los discípulos. Los Evangelios nunca dicen que Jesús entrara en Tiberíades, aunque estaba a corta distancia a pie de Cafarnaúm. Josefo cuenta por qué muchos judíos se mantenían lejos: la ciudad estaba construida sobre tumbas, de modo que hubo que obligar a los colonos a vivir allí; era además la sede de Antipas, a quien Jesús llamó «aquella zorra»."
    - "En la revuelta del 66 d. C., un grupo de la ciudad quemó el palacio de Antipas por sus imágenes de seres vivos, y en 67 Tiberíades abrió sus puertas a Vespasiano. Tras la guerra se convirtió en uno de los principales centros del saber judío: el Talmud la nombra como la última sede del Sanedrín, y el Talmud de Jerusalén tomó forma en gran parte en sus escuelas hacia el 400 d. C. En Hamat, la ciudad fortificada de Neftalí que nombra Josué, los excavadores descubrieron en la década de 1960 una sinagoga cuyo mosaico del siglo IV muestra el zodiaco en torno al dios solar Helios."
  pt:
    - "Tiberíades ficava onde hoje está a cidade de Tiberíades, em Israel, na margem ocidental do mar da Galileia, abaixo de colinas íngremes, com as fontes termais de Hamate logo ao sul; o ponto do mapa fica na cidade antiga. Fica a cerca de 115 km ao norte de Jerusalém em linha reta, 12 km a su-sudoeste de Cafarnaum e 24 km a lés-nordeste de Nazaré. Herodes Antipas, tetrarca da Galileia, a fundou e lhe deu o nome do imperador Tibério; a fundação costuma ser datada de cerca de 19 ou 20 d.C., embora os estudiosos divirjam por um ano ou dois."
    - "O Novo Testamento nomeia a cidade apenas uma vez, em João: depois da alimentação dos cinco mil, “barcos de Tiberíades chegaram perto do lugar onde comeram o pão”. João também chama o lago de “o mar da Galileia, que também é chamado de mar de Tiberíades”, e é “junto ao mar de Tiberíades” que o Jesus ressuscitado se manifesta aos discípulos. Os Evangelhos nunca dizem que Jesus entrou em Tiberíades, embora ficasse a uma curta caminhada de Cafarnaum. Josefo conta por que muitos judeus se mantinham afastados: a cidade foi construída sobre túmulos, de modo que os colonos tiveram de ser obrigados a morar ali; era também a sede de Antipas, a quem Jesus chamou “àquela raposa”."
    - "Na revolta de 66 d.C., um grupo na cidade queimou o palácio de Antipas por suas imagens de seres vivos, e em 67 Tiberíades abriu as portas a Vespasiano. Depois da guerra tornou-se um dos principais centros do saber judaico: o Talmude a nomeia como a última sede do Sinédrio, e o Talmude de Jerusalém tomou forma em grande parte em suas escolas por volta de 400 d.C. Em Hamate, a cidade murada de Naftali mencionada em Josué, os escavadores revelaram na década de 1960 uma sinagoga cujo mosaico do século IV mostra o zodíaco em torno do deus-sol Hélio."
  de:
    - "Tiberias stand dort, wo heute die Stadt Tiberias in Israel steht, am Westufer des Sees Genezareth unterhalb steiler Hügel, mit den heißen Quellen von Hammat unmittelbar im Süden; der Kartenpunkt steht auf der Altstadt. Es liegt in der Luftlinie etwa 115 km nördlich von Jerusalem, 12 km südsüdwestlich von Kapernaum und 24 km ostnordöstlich von Nazareth. Herodes Antipas, Tetrarch von Galiläa, gründete es und benannte es nach dem Kaiser Tiberius; die Gründung wird meist auf etwa 19 oder 20 n. Chr. datiert, doch die Forscher weichen um ein bis zwei Jahre ab."
    - "Das Neue Testament nennt die Stadt nur einmal, bei Johannes: Nach der Speisung der Fünftausend: „Es kamen aber andere Schiffe von Tiberias nahe zur Stätte, da sie das Brot gegessen hatten“. Johannes spricht auch vom Meer „an der Stadt Tiberias in Galiläa“, und am See von Tiberias zeigt sich der auferstandene Jesus den Jüngern. Die Evangelien sagen nie, dass Jesus Tiberias betrat, obwohl es einen kurzen Fußweg von Kapernaum entfernt lag. Josephus erzählt, warum viele Juden fernblieben: Die Stadt war über Gräbern gebaut, sodass Siedler zum Wohnen gezwungen werden mussten; sie war auch der Sitz des Antipas, dem Jesus ausrichten ließ: „Gehet hin und saget diesem Fuchs“."
    - "Im Aufstand von 66 n. Chr. verbrannte eine Gruppe in der Stadt den Palast des Antipas wegen seiner Bilder lebender Wesen, und 67 öffnete Tiberias Vespasian die Tore. Nach dem Krieg wuchs es zu einem Hauptzentrum jüdischer Gelehrsamkeit: Der Talmud nennt es als letzten Sitz des Sanhedrin, und der Jerusalemer Talmud entstand bis etwa 400 n. Chr. großenteils in seinen Schulen. In Hammat, der in Josua genannten ummauerten Stadt Naftalis, legten Ausgräber in den 1960er-Jahren eine Synagoge frei, deren Mosaik aus dem 4. Jahrhundert den Tierkreis um den Sonnengott Helios zeigt."
  fr:
    - "Tibériade se dressait là où se trouve aujourd’hui la ville de Tibériade, en Israël, sur la rive occidentale de la mer de Galilée, au pied de collines escarpées, avec les sources chaudes de Hammath juste au sud ; le point de la carte se trouve sur la vieille ville. Elle est à environ 115 km au nord de Jérusalem à vol d’oiseau, à 12 km au sud-sud-ouest de Capernaüm et à 24 km à l’est-nord-est de Nazareth. Hérode Antipas, tétrarque de Galilée, la fonda et lui donna le nom de l’empereur Tibère ; la fondation est généralement datée d’environ 19 ou 20 apr. J.-C., bien que les spécialistes diffèrent d’un an ou deux."
    - "Le Nouveau Testament ne nomme la ville qu’une fois, chez Jean : après le repas donné aux cinq mille, « d’autres barques étaient arrivées de Tibériade près du lieu où ils avaient mangé le pain ». Jean appelle aussi le lac « la mer de Galilée, de Tibériade », et c’est « sur les bords de la mer de Tibériade » que Jésus ressuscité se montre aux disciples. Les Évangiles ne disent jamais que Jésus soit entré dans Tibériade, bien qu’elle fût à courte distance de marche de Capernaüm. Flavius Josèphe explique pourquoi beaucoup de Juifs s’en tenaient à l’écart : la ville était bâtie sur des tombes, si bien qu’il fallut contraindre des colons à y habiter ; c’était aussi le siège d’Antipas, que Jésus appela « ce renard »."
    - "Lors de la révolte de 66 apr. J.-C., un parti de la ville incendia le palais d’Antipas à cause de ses images d’êtres vivants, et en 67 Tibériade ouvrit ses portes à Vespasien. Après la guerre, elle devint un grand centre de l’étude juive : le Talmud la nomme comme dernier siège du Sanhédrin, et le Talmud de Jérusalem prit forme en grande partie dans ses écoles vers 400 apr. J.-C. À Hammath, la ville fortifiée de Nephthali nommée dans Josué, les fouilleurs ont mis au jour dans les années 1960 une synagogue dont la mosaïque du IVe siècle montre le zodiaque autour du dieu solaire Hélios."
  pl:
    - "Tyberiada stała tam, gdzie dziś stoi miasto Tyberiada w Izraelu, na zachodnim brzegu Jeziora Galilejskiego pod stromymi wzgórzami, z gorącymi źródłami Chammat tuż na południe; punkt na mapie stoi na starym mieście. Leży około 115 km na północ od Jerozolimy w linii prostej, 12 km na południe-południowy zachód od Kafarnaum i 24 km na wschód-północny wschód od Nazaretu. Herod Antypas, tetrarcha Galilei, założył ją i nazwał od cesarza Tyberiusza; założenie datuje się zwykle na około 19 lub 20 n.e., choć uczeni różnią się o rok czy dwa."
    - "Nowy Testament wymienia miasto tylko raz, u Jana: po nakarmieniu pięciu tysięcy „Przyszły też były drugie łodzie z Tyberyjady, blisko do onego miejsca, gdzie jedli chleb”. Jan nazywa też jezioro „morze Galilejskie, które jest Tyberyjadzkie”, i „u morza Tyberyjadzkiego” zmartwychwstały Jezus ukazuje się uczniom. Ewangelie nigdy nie mówią, że Jezus wszedł do Tyberiady, choć leżała w krótkiej odległości pieszo od Kafarnaum. Józef Flawiusz wyjaśnia, dlaczego wielu Żydów trzymało się z daleka: miasto zbudowano na grobach, tak że osadników trzeba było zmuszać do zamieszkania; było też siedzibą Antypasa, którego Jezus nazwał lisem: „Idźcie, a powiedzcie temu lisowi”."
    - "W powstaniu 66 n.e. stronnictwo w mieście spaliło pałac Antypasa za wizerunki żywych istot, a w 67 Tyberiada otworzyła bramy przed Wespazjanem. Po wojnie rozwinęła się w główny ośrodek żydowskiej nauki: Talmud wymienia ją jako ostatnią siedzibę Sanhedrynu, a Talmud jerozolimski kształtował się głównie w jej szkołach do około 400 n.e. W Chammat, obwarowanym mieście Neftalego wymienionym u Jozuego, archeolodzy odkryli w latach 60. synagogę, której mozaika z IV wieku przedstawia zodiak wokół boga słońca Heliosa."
  it:
    - "Tiberiade sorgeva dove sorge oggi la città di Tiberiade in Israele, sulla riva occidentale del Lago di Tiberiade sotto ripide colline, con le sorgenti calde di Cammat subito a sud; il punto della mappa si trova sulla città vecchia. Dista circa 115 km a nord di Gerusalemme in linea d’aria, 12 km a sud-sud-ovest di Cafarnao e 24 km a est-nord-est di Nazaret. Erode Antipa, tetrarca di Galilea, la fondò e le diede il nome dell’imperatore Tiberio; la fondazione si data di solito al 19 o 20 d.C. circa, benché gli studiosi differiscano di un anno o due."
    - "Il Nuovo Testamento nomina la città una sola volta, in Giovanni: dopo il pasto dei cinquemila «altre barche eran giunte da Tiberiade, presso al luogo dove avean mangiato il pane». Giovanni chiama anche il lago «mar di Galilea, ch’è il mar di Tiberiade», ed è «presso il mar di Tiberiade» che Gesù risorto si mostra ai discepoli. I Vangeli non dicono mai che Gesù entrasse a Tiberiade, benché fosse a breve distanza da Cafarnao. Giuseppe Flavio racconta perché molti Ebrei la evitavano: la città era costruita sopra tombe, così che i coloni dovettero essere costretti ad abitarvi; era anche la sede di Antipa, che Gesù chiamò «quella volpe»."
    - "Nella rivolta del 66 d.C. un partito della città bruciò il palazzo di Antipa per le sue immagini di esseri viventi, e nel 67 Tiberiade aprì le porte a Vespasiano. Dopo la guerra divenne un centro principale dell’apprendimento ebraico: il Talmud la nomina come ultima sede del Sinedrio, e il Talmud di Gerusalemme prese forma in gran parte nelle sue scuole verso il 400 d.C. A Cammat, la città fortificata di Neftali nominata in Giosuè, gli scavatori negli anni 1960 portarono alla luce una sinagoga il cui mosaico del IV secolo mostra lo zodiaco attorno al dio sole Elio."
  cs:
    - "Tiberias stála tam, kde stojí dnešní město Tiberias v Izraeli, na západním břehu Galilejského jezera pod strmými pahorky, s horkými prameny Chamat těsně na jihu; bod na mapě stojí na starém městě. Leží vzdušnou čarou asi 115 km severně od Jeruzaléma, 12 km jihojihozápadně od Kafarnaum a 24 km východoseverovýchodně od Nazareta. Založil ji Herodes Antipas, tetrarcha Galileje, a pojmenoval po císaři Tiberiovi; založení se obvykle datuje zhruba do let 19 nebo 20 n. l., ačkoli se badatelé liší o rok či dva."
    - "Nový zákon jmenuje město jen jednou, u Jana: po nasycení pěti tisíc „jiné pak lodí byly připlouly od Tiberiady k tomu místu blízko, kdežto byli jedli chléb“. Jan také nazývá jezero „moře Galilejské, jenž jest Tiberiadské“ a „u moře Tiberiadského“ se vzkříšený Ježíš ukazuje učedníkům. Evangelia nikdy neříkají, že Ježíš do Tiberiady vešel, ačkoli ležela kousek cesty od Kafarnaum. Josephus vypráví, proč se mnozí Židé drželi stranou: město bylo postaveno nad hroby, takže osadníci byli do něj nuceni; bylo také sídlem Antipy, o němž Ježíš řekl: „povězte lišce té“."
    - "Při povstání roku 66 n. l. strana ve městě vypálila Antipův palác pro jeho zobrazení živých tvorů a roku 67 Tiberias otevřela brány Vespasianovi. Po válce vyrostla v jedno z hlavních středisek židovské učenosti: Talmud ji jmenuje jako poslední sídlo Sanhedrinu a Jeruzalémský talmud vznikl z velké části v jejích školách do roku 400 n. l. V Chamatu, opevněném městě Neftalí zmíněném u Jozua, odkryli vykopávači v 60. letech synagogu, jejíž mozaika ze 4. století ukazuje zvěrokruh kolem boha slunce Hélia."
  nl:
    - "Tiberias lag waar de stad Tiberias in Israël vandaag ligt, aan de westoever van het Meer van Galilea onder steile heuvels, met de warme bronnen van Chammat net ten zuiden; het punt op de kaart staat op de oude stad. Het ligt hemelsbreed ongeveer 115 km ten noorden van Jeruzalem, 12 km ten zuid-zuidwesten van Kafarnaüm en 24 km ten oost-noordoosten van Nazareth. Herodes Antipas, tetrarch van Galilea, stichtte het en noemde het naar keizer Tiberius; de stichting wordt gewoonlijk gedateerd op omstreeks 19 of 20 n.Chr., hoewel geleerden een jaar of twee uiteenlopen."
    - "Het Nieuwe Testament noemt de stad slechts eenmaal, bij Johannes: na de spijziging van de vijfduizend staat: “er kwamen andere scheepjes van Tiberias, nabij de plaats, waar zij het brood gegeten hadden”. Johannes noemt het meer ook “de zee van Galilea, welke is de zee van Tiberias”, en het is “aan de zee van Tiberias” dat de opgestane Jezus zich aan de leerlingen openbaart. De evangeliën zeggen nooit dat Jezus Tiberias binnenging, hoewel het een korte wandeling van Kafarnaüm lag. Josephus vertelt waarom veel joden wegbleven: de stad was op graven gebouwd, zodat kolonisten gedwongen moesten worden er te wonen; het was ook de zetel van Antipas, die Jezus “dien vos” noemde."
    - "Bij de opstand van 66 n.Chr. verbrandde een partij in de stad het paleis van Antipas vanwege zijn afbeeldingen van levende wezens, en in 67 opende Tiberias zijn poorten voor Vespasianus. Na de oorlog groeide het uit tot een voornaam centrum van joodse geleerdheid: de Talmoed noemt het als de laatste zetel van het Sanhedrin, en de Jeruzalemse Talmoed kreeg rond 400 n.Chr. grotendeels in zijn scholen vorm. Bij Chammat, de ommuurde stad van Naftali die in Jozua wordt genoemd, legden opgravers in de jaren zestig een synagoge bloot waarvan het mozaïek uit de vierde eeuw de dierenriem rond de zonnegod Helios toont."
  sv:
    - "Tiberias låg där staden Tiberias i Israel ligger i dag, på Galileiska sjöns västra strand under branta höjder, med Hammats varma källor strax söderut; kartpunkten står på den gamla staden. Det är omkring 115 km norr om Jerusalem i fågelvägen, 12 km sydsydväst om Kafarnaum och 24 km ostnordost om Nasaret. Herodes Antipas, tetrark av Galileen, grundade den och uppkallade den efter kejsar Tiberius; grundandet dateras vanligen till omkring 19 eller 20 e.Kr., fastän forskare skiljer sig åt med ett eller två år."
    - "Nya testamentet nämner staden bara en gång, hos Johannes: efter mättandet av de fem tusen hade andra båtar ”kommit från Tiberias och lagt till nära det ställe där folket bespisades”. Johannes kallar också sjön ”Galileiska sjön, ’Tiberias’ sjö’”, och det är ”vid Tiberias’ sjö” som den uppståndne Jesus visar sig för lärjungarna. Evangelierna säger aldrig att Jesus gick in i Tiberias, fastän den låg en kort promenad från Kafarnaum. Josefus berättar varför många judar höll sig borta: staden var byggd över gravar, så att nybyggare måste tvingas bo där; den var också säte för Antipas, som Jesus kallade ”den räven”."
    - "Vid upproret år 66 e.Kr. brände en grupp i staden Antipas’ palats på grund av dess bilder av levande varelser, och 67 öppnade Tiberias sina portar för Vespasianus. Efter kriget växte den till ett av de främsta centrumen för judisk lärdom: Talmud nämner den som Sanhedrins sista säte, och Jerusalemtalmud tog form till stor del i dess skolor omkring år 400 e.Kr. Vid Hammat, den befästa staden i Naftali som nämns hos Josua, avtäckte utgrävare på 1960-talet en synagoga vars mosaik från 300-talet visar zodiaken kring solguden Helios."
  nb:
    - "Tiberias lå der byen Tiberias i Israel ligger i dag, på vestbredden av Galileasjøen under bratte høyder, med de varme kildene i Hammat like sør; kartpunktet står på den gamle byen. Den ligger omtrent 115 km nord for Jerusalem i luftlinje, 12 km sør-sørvest for Kapernaum og 24 km øst-nordøst for Nasaret. Herodes Antipas, tetrark av Galilea, grunnla den og oppkalte den etter keiser Tiberius; grunnleggelsen dateres vanligvis til omkring 19 eller 20 e.Kr., selv om forskere avviker med ett eller to år."
    - "Det nye testamentet nevner byen bare én gang, hos Johannes: etter mettingen av de fem tusen «kom det andre båter fra Tiberias nær til det sted hvor de hadde fått mat efter Herrens takkebønn». Johannes kaller også innsjøen «den Galileiske Sjø, Tiberias-sjøen», og det er «ved Tiberias-sjøen» at den oppstandne Jesus viser seg for disiplene. Evangeliene sier aldri at Jesus gikk inn i Tiberias, selv om den lå en kort gange fra Kapernaum. Josefus forteller hvorfor mange jøder holdt seg unna: byen var bygd over graver, så bosetterne måtte tvinges til å bo der; den var også Antipas’ sete, som Jesus kalte «den rev»."
    - "Under opprøret i 66 e.Kr. brant en gruppe i byen Antipas’ palass på grunn av bildene av levende skapninger, og i 67 åpnet Tiberias portene for Vespasian. Etter krigen vokste den til et hovedsenter for jødisk lærdom: Talmud nevner den som Sanhedrinets siste sete, og Jerusalem-talmud hadde for det meste tatt form i dens skoler innen omkring 400 e.Kr. Ved Hammat, den befestede byen i Naftali som nevnes hos Josva, avdekket utgraverne på 1960-tallet en synagoge hvis mosaikk fra 300-tallet viser dyrekretsen rundt solguden Helios."
  tl:
    - "Ang Tiberias ay nakatayo kung saan nakatayo ngayon ang lungsod ng Tiberias sa Israel, sa kanlurang pampang ng Dagat ng Galilea sa ibaba ng matatarik na burol, na ang mga mainit na bukal ng Hamath ay nasa timog lamang; nasa lumang bayan ang punto sa mapa. Mga 115 km ito sa hilaga ng Jerusalem sa tuwid na guhit, 12 km sa timog-timog-kanluran ng Capernaum at 24 km sa silangan-hilagang-silangan ng Nazaret. Itinatag ito ni Herodes Antipas, tetrarka ng Galilea, at pinangalanan sa emperador na si Tiberio; karaniwang ipinepetsa ang pagtatatag sa mga 19 o 20 AD, bagaman nagkakaiba ng isa o dalawang taon ang mga iskolar."
    - "Minsan lamang pinangalanan ng Bagong Tipan ang lungsod, kay Juan: pagkatapos pakainin ang limang libo, “may mga daong na nagsidating na mula sa Tiberias malapit sa dako na kanilang kinainan ng tinapay”. Tinatawag din ni Juan ang lawa na “dagat ng Galilea, na siyang dagat ng Tiberias”, at “sa tabi ng dagat ng Tiberias” nagpakita ang nabuhay na si Jesus sa mga alagad. Hindi sinasabi ng mga Ebanghelyo na pumasok si Jesus sa Tiberias, bagaman maikling lakad ito mula sa Capernaum. Sinasabi ni Josephus kung bakit lumayo ang maraming Judio: itinayo ang bayan sa ibabaw ng mga libingan, kaya kinailangang pilitin ang mga magsisipanirahan; luklukan din ito ni Antipas, na tinawag ni Jesus na “sorrang yaon”."
    - "Sa paghihimagsik noong 66 AD, sinunog ng isang pangkat sa lungsod ang palasyo ni Antipas dahil sa mga larawan nito ng mga nabubuhay na nilalang, at noong 67 binuksan ng Tiberias ang mga tarangkahan nito kay Vespasiano. Pagkatapos ng digmaan, lumaki ito bilang pangunahing sentro ng karunungang Judio: pinangalanan ito ng Talmud na huling luklukan ng Sanedrin, at ang Talmud ng Jerusalem ay nabuo higit sa lahat sa mga paaralan nito noong mga 400 AD. Sa Hamath, ang bayang may pader ng Nephtali na binanggit sa Josue, natuklasan ng mga naghukay noong dekada 1960 ang isang sinagoga na ang mosaiko noong ika-4 na siglo ay nagpapakita ng sodyak sa palibot ng diyos ng araw na si Helios."
  da:
    - "Tiberias lå, hvor byen Tiberias i Israel ligger i dag, på Genesaret Søs vestbred neden for stejle bjerge, med Hammats varme kilder lige mod syd; kortets punkt står på den gamle by. Den ligger ca. 115 km nord for Jerusalem i fugleflugt, 12 km syd-sydvest for Kapernaum og 24 km øst-nordøst for Nazaret. Herodes Antipas, Galilæas fjerdingsfyrste, grundlagde den og opkaldte den efter kejser Tiberius; grundlæggelsen dateres sædvanligvis til omkring 19 eller 20 e.Kr., selv om forskere afviger med et år eller to."
    - "Det Nye Testamente nævner byen kun én gang, hos Johannes: Efter mætningen af de fem tusind var der »kommet Skibe fra Tiberias nær til det Sted, hvor de spiste Brødet«. Johannes kalder også søen »Galilæas Sø, Tiberias-Søen«, og det er »ved Tiberias-Søen«, at den opstandne Jesus åbenbarer sig for disciplene. Evangelierne siger aldrig, at Jesus gik ind i Tiberias, selv om den lå en kort gåtur fra Kapernaum. Josefus fortæller, hvorfor mange jøder holdt sig væk: Byen var bygget over grave, så bosættere måtte tvinges til at bo der; det var også Antipas’ sæde, som Jesus kaldte »denne Ræv«."
    - "I oprøret i 66 e.Kr. brændte en gruppe i byen Antipas’ palads på grund af dets billeder af levende væsener, og i 67 åbnede Tiberias sine porte for Vespasian. Efter krigen voksede den til et hovedcenter for jødisk lærdom: Talmud nævner den som Sanhedrinets sidste sæde, og Jerusalem-talmud tog form for en stor del i dens skoler omkring 400 e.Kr. Ved Hammat, den befæstede by i Naftali nævnt hos Josva, afdækkede udgravere i 1960’erne en synagoge, hvis mosaik fra 300-tallet viser dyrekredsen omkring solguden Helios."
  sr:
    - "Тиверијада је стајала тамо где данас стоји град Тиверијада у Израелу, на западној обали Галилејског мора испод стрмих брда, са врелим изворима Хамата одмах јужно; тачка на карти стоји на старом граду. Удаљена је око 115 км северно од Јерусалима ваздушном линијом, 12 км јужно-југозападно од Капернаума и 24 км источно-североисточно од Назарета. Ирод Антипа, четворовласник Галилеје, основао ју је и назвао по цару Тиверију; оснивање се обично датира у око 19. или 20. н. е., мада се научници разилазе за годину или две."
    - "Нови завет град помиње само једном, код Јована: пошто је Исус нахранио пет хиљада „друге лађе из Тиверијаде дођоше близу оног места где једоше хлеб“. Јован језеро назива и морем галилејским код Тиверијаде, а „на мору тиверијадском“ васкрсли Исус се јавља ученицима. Јеванђеља никад не кажу да је Исус ушао у Тиверијаду, мада је лежала на кратком ходу од Капернаума. Јосиф Флавије каже зашто су многи Јевреји избегавали тај град: град је саграђен над гробовима, па су досељеници морали бити приморавани да ту живе; била је и седиште Антипе, о коме је Исус рекао: „Идите те кажите оној лисици“."
    - "У устанку 66. н. е. једна група у граду спалила је Антипину палату због слика живих створења, а 67. Тиверијада је отворила капије Веспазијану. После рата израсла је у главно средиште јеврејске науке: Талмуд је именује као последње седиште синедриона, а Јерусалимски талмуд обликовао се углавном у њеним школама до око 400. н. е. У Хамату, утврђеном граду Нефталимовом који помиње Исус Навин, ископавачи су 1960-их открили синагогу чији мозаик из четвртог века приказује зодијак око бога сунца Хелиоса."
  hu:
    - "Tiberias ott állt, ahol ma az izraeli Tiberias város áll, a Galileai-tenger nyugati partján, meredek dombok alatt, közvetlenül délre Hammát forró forrásaival; a térkép pontja az óvároson áll. Jeruzsálemtől légvonalban mintegy 115 km-re északra, Kapernaumtól 12 km-re dél-délnyugatra és Názárettől 24 km-re kelet-északkeletre van. Heródes Antipász, Galilea tetrarchája alapította, és Tiberius császárról nevezte el; az alapítást általában Kr. u. 19-re vagy 20-ra keltezik, bár a tudósok egy-két évvel eltérnek."
    - "Az Újszövetség a várost csak egyszer nevezi meg, Jánosnál: az ötezer megvendégelése után „jöttek más hajók Tiberiásból közel ahhoz a helyhez, a hol a kenyeret ették”. János a tavat Galileai-tengernek és Tiberias tengerének is nevezi, és a Tiberias tengerénél mutatja meg magát a feltámadt Jézus a tanítványoknak. Az evangéliumok sosem mondják, hogy Jézus belépett Tiberiasba, noha rövid sétára feküdt Kapernaumtól. Josephus elmondja, miért kerülte sok zsidó: a város sírok fölé épült, ezért a telepeseket kényszeríteni kellett a letelepedésre; Antipász székhelye is volt, akit Jézus „annak a rókának” nevezett."
    - "A Kr. u. 66-os felkelésben a város egyik pártja felégette Antipász palotáját az élőlények ábrázolásai miatt, 67-ben pedig Tiberias megnyitotta kapuit Vespasianus előtt. A háború után a zsidó tudomány egyik fő központjává nőtt: a Talmud a Szanhedrin utolsó székhelyeként nevezi meg, a Jeruzsálemi Talmud pedig Kr. u. 400 körül nagyrészt iskoláiban alakult ki. Hammátnál, a Józsué által említett Naftáli falakkal övezett városánál az ásatók az 1960-as években zsinagógát tártak fel, amelynek 4. századi mozaikja az állatövet mutatja Héliosz napisten körül."
  fi:
    - "Tiberias sijaitsi siinä, missä Israelin Tiberiaan kaupunki nykyisin on, Galileanjärven länsirannalla jyrkkien kukkuloiden alla, Hammatin kuumine lähteineen aivan etelässä; kartan piste on vanhassa kaupungissa. Se on linnuntietä noin 115 km Jerusalemista pohjoiseen, 12 km Kapernaumista etelä-lounaaseen ja 24 km Nasaretista itä-koilliseen. Galilean tetrarkki Herodes Antipas perusti sen ja nimesi sen keisari Tiberiuksen mukaan; perustaminen ajoitetaan yleensä noin 19 tai 20 jaa., vaikka tutkijat eroavat vuodella tai kahdella."
    - "Uusi testamentti nimeää kaupungin vain kerran, Johanneksessa: viidentuhannen ruokkimisen jälkeen ”oli muita venheitä tullut Tiberiaasta lähelle sitä paikkaa, jossa he olivat syöneet leipää”. Johannes kutsuu myös järveä: ”Jeesus meni Galileaan, se on Tiberiaan, järven tuolle puolelle”, ja ”Tiberiaan järven rannalla” ylösnoussut Jeesus ilmestyy opetuslapsille. Evankeliumit eivät koskaan sano, että Jeesus olisi mennyt Tiberiaaseen, vaikka se oli lyhyen kävelymatkan päässä Kapernaumista. Josefus kertoo, miksi monet juutalaiset pysyivät loitolla: kaupunki oli rakennettu hautojen päälle, joten asukkaat piti pakottaa asettumaan sinne; se oli myös Antipaan, josta Jeesus sanoi: ”Menkää ja sanokaa sille ketulle”, istuin."
    - "Vuoden 66 kapinassa kaupungin eräs ryhmä poltti Antipaan palatsin sen elävien olentojen kuvien vuoksi, ja vuonna 67 Tiberias avasi porttinsa Vespasianukselle. Sodan jälkeen se kasvoi juutalaisen oppineisuuden keskukseksi: Talmud nimeää sen synedrionin viimeiseksi istuimeksi, ja Jerusalemin Talmud muotoutui suurelta osin sen kouluissa noin vuoteen 400 jaa. mennessä. Hammatissa, Joosuan kirjassa mainitussa Naftalin muurein ympäröidyssä kaupungissa, kaivajat paljastivat 1960-luvulla synagogan, jonka 300-luvun mosaiikki esittää eläinradan auringonjumala Helioksen ympärillä."
  vi:
    - "Ti-bê-ri-át nằm ở nơi thành phố Tiberias ở Israel nay đứng, trên bờ tây Biển Ga-li-lê dưới những ngọn đồi dốc, với suối nước nóng Ha-mát ngay phía nam; điểm trên bản đồ nằm trên khu phố cổ. Nó cách Giê-ru-sa-lem khoảng 115 km về phía bắc theo đường thẳng, cách Ca-bê-na-um 12 km về phía nam tây nam và cách Na-xa-rét 24 km về phía đông đông bắc. Hê-rốt An-ti-ba, vua chư hầu Ga-li-lê, lập thành và đặt tên theo hoàng đế Ti-be-rơ; việc lập thành thường được xác định vào khoảng năm 19 hoặc 20, dù các học giả chênh nhau một hai năm."
    - "Tân Ước chỉ nêu tên thành một lần, trong Phúc Âm Giăng: sau khi nuôi năm ngàn người, “có mấy chiếc thuyền khác từ thành Ti-bê-ri-át lại gần nơi chúng đã ăn bánh”. Giăng cũng gọi hồ là “biển Ga-li-lê, là biển Ti-bê-ri-át”, và chính “nơi gần biển Ti-bê-ri-át” Giê-su sống lại tỏ mình cho các môn đồ. Các sách Phúc Âm không bao giờ nói Giê-su vào Ti-bê-ri-át, dù nó chỉ cách Ca-bê-na-um một quãng đi bộ ngắn. Josephus cho biết vì sao nhiều người Do Thái tránh xa: thị trấn xây trên các ngôi mộ, nên những người định cư phải bị ép đến ở; nó cũng là thủ phủ của An-ti-ba, người mà Giê-su gọi là “con chồn cáo ấy”."
    - "Trong cuộc nổi dậy năm 66, một phe trong thành đốt cung điện An-ti-ba vì những hình thú vật sống, và năm 67 Ti-bê-ri-át mở cổng cho Vespasianus. Sau chiến tranh, nó phát triển thành một trung tâm chính của học thuật Do Thái: Talmud nêu nó là trụ sở cuối cùng của Sanhedrin, và Talmud Giê-ru-sa-lem hình thành phần lớn trong các trường của nó vào khoảng năm 400. Tại Ha-mát, thành có tường của Nép-ta-li được nêu trong sách Giô-suê, các nhà khai quật vào thập niên 1960 phát lộ một nhà hội có tranh khảm thế kỷ 4 vẽ hoàng đạo quanh thần mặt trời Helios."
  ro:
    - "Tiberiada se afla unde se află și azi orașul Tiberiada din Israel, pe malul de vest al Mării Galileii, sub dealuri abrupte, cu izvoarele calde de la Hamat chiar la sud; punctul de pe hartă se află pe orașul vechi. Se află la circa 115 km nord de Ierusalim în linie dreaptă, la 12 km sud-sud-vest de Capernaum și la 24 km est-nord-est de Nazaret. Irod Antipa, tetrarhul Galileii, a întemeiat-o și a numit-o după împăratul Tiberiu; întemeierea este datată de obicei în jurul anului 19 sau 20 d.Hr., deși cercetătorii diferă cu un an sau doi."
    - "Noul Testament numește orașul o singură dată, la Ioan: după hrănirea celor cinci mii, „alte corăbii au venit dela Tiveriada aproape de locul unde au mâncat pâinea”. Ioan numește lacul și „marea Galileei, care este a Tiveriadei”, iar „la marea Tiveriadei” li se arată Isus cel înviat ucenicilor. Evangheliile nu spun niciodată că Isus ar fi intrat în Tiberiada, deși se afla la o scurtă plimbare de Capernaum. Iosif Flaviu spune de ce mulți iudei se țineau departe: orașul fusese construit peste morminte, așa că coloniștii au trebuit siliți să locuiască acolo; era și sediul lui Antipa, pe care Isus l-a numit vulpe: „spuneți vulpei aceștia”."
    - "În răscoala din anul 66 d.Hr., un grup din oraș a ars palatul lui Antipa pentru chipurile de ființe vii, iar în 67 Tiberiada a deschis porțile lui Vespasian. După război a crescut într-un centru de seamă al învățăturii iudaice: Talmudul o numește ultimul sediu al Sinedriului, iar Talmudul de Ierusalim a luat formă în mare parte în școlile ei până în jurul anului 400 d.Hr. La Hamat, orașul întărit al lui Neftali numit în Iosua, arheologii au dezgropat în anii 1960 o sinagogă al cărei mozaic din secolul al IV-lea arată zodiacul în jurul zeului-soare Helios."
  bg:
    - "Тивериада се намираше там, където и днес стои едноименният град в Израел, на западния бряг на Галилейско езеро под стръмни хълмове, с горещите извори на Хамат точно на юг; точката на картата стои на стария град. Тя е на около 115 км северно от Йерусалим по права линия, на 12 км юг-югозападно от Капернаум и на 24 км изток-североизточно от Назарет. Ирод Антипа, четвъртовластник на Галилея, я основа и я нарече на император Тиберий; основаването обикновено се датира около 19 или 20 г. н.е., макар учените да се разминават с година-две."
    - "Новият завет назовава града само веднъж, у Йоан: след нахранването на петте хиляди „други ладии дойдоха от Тивериада близо до местото дето ядоха хлеба“. Йоан нарича езерото и „Галилейското море, сиреч, Тивериадско“, а „на Тивериадското море“ възкръсналият Исус се явява на учениците. Евангелията никъде не казват, че Исус е влизал в Тивериада, макар тя да е била на кратко разстояние пеша от Капернаум. Йосиф Флавий обяснява защо много юдеи я отбягвали: градът бил построен върху гробове, така че заселниците трябвало да бъдат принуждавани да живеят там; освен това той беше седалище на Антипа, когото Исус нарече „тази лисица“."
    - "При въстанието от 66 г. н.е. група в града изгори двореца на Антипа заради изображенията на живи същества в него, а през 67 г. Тивериада отвори портите си пред Веспасиан. След войната тя се превърна в главно средище на юдейската ученост: Талмудът я назовава като последното седалище на Синедриона, а Йерусалимският Талмуд се оформя до около 400 г. н.е. главно в нейните училища. В Хамат — укрепения град на Нефталим, споменат в книга Иисус Навин, археолозите през 60-те години на XX в. разкриха синагога, чиято мозайка от IV в. изобразява зодиака около бога на слънцето Хелиос."
