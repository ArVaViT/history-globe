id: where-was-tiberias
question:
  en: "Where was Tiberias?"
  ru: "Где находилась Тивериада?"
  uk: "Де була Тіверіада?"
  es: "¿Dónde estaba Tiberíades?"
  pt: "Onde ficava Tiberíades?"
  de: "Wo lag Tiberias?"
  fr: "Où se trouvait Tibériade ?"
answer:
  en:
    - "Tiberias stood where the city of Tiberias in Israel stands today, on the western shore of the Sea of Galilee below steep hills, with the hot springs of Hammath just to the south; the map point stands on the old town. It is about 115 km north of Jerusalem in a straight line, 12 km south-south-west of Capernaum and 24 km east-north-east of Nazareth. Herod Antipas, tetrarch of Galilee, founded it and named it after the emperor Tiberius; the founding is usually dated to about AD 19 or 20, though scholars differ by a year or two."
    - "The New Testament names the city only once, in John: after the feeding of the five thousand “there came other boats from Tiberias nigh unto the place where they did eat bread”. John also calls the lake “the sea of Galilee, which is the sea of Tiberias”, and it is “at the sea of Tiberias” that the risen Jesus shows himself to the disciples. The Gospels never say that Jesus entered Tiberias, though it lay a short walk from Capernaum. Josephus tells why many Jews kept away: the town was built over tombs, so that settlers had to be compelled to live there; it was also the seat of Antipas, whom Jesus called “that fox”."
    - "In the revolt of AD 66 a party in the city burned Antipas' palace for its images of living creatures, and in 67 Tiberias opened its gates to Vespasian. After the war it grew into a chief centre of Jewish learning: the Talmud names it as the last seat of the Sanhedrin, and the Jerusalem Talmud took shape largely in its schools by about AD 400. At Hammath, the walled town of Naphtali named in Joshua, excavators in the 1960s uncovered a synagogue whose fourth-century mosaic shows the zodiac around the sun god Helios."
  ru:
    - "Тивериада стояла там же, где и нынешний израильский город Тверия, на западном берегу моря Галилейского под крутыми холмами; сразу к югу от неё бьют горячие источники Хаммата. Точка карты стоит на старом городе. Отсюда примерно 115 км до Иерусалима к югу по прямой, 12 км до Капернаума к северу-северо-востоку и 24 км до Назарета к западу-юго-западу. Ирод Антипа, четвертовластник Галилеи, основал город и назвал в честь императора Тиверия; основание обычно относят примерно к 19 или 20 г. н. э., хотя учёные расходятся на год-два."
    - "Новый Завет называет город лишь однажды, у Иоанна: после насыщения пяти тысяч «пришли из Тивериады другие лодки близко к тому месту, где ели хлеб». Озеро Иоанн тоже называет по городу: Иисус пошёл «на ту сторону моря Галилейского, в окрестности Тивериады», а воскресший Господь «опять явился ученикам Своим при море Тивериадском». Евангелия нигде не говорят, что Иисус входил в Тивериаду, хотя от Капернаума до неё недалеко. Иосиф Флавий объясняет, почему многие иудеи её сторонились: город построили на месте гробниц, и поселенцев приходилось принуждать; к тому же здесь сидел Антипа, о котором Иисус сказал: «скажите этой лисице»."
    - "Во время восстания 66 г. н. э. горожане сожгли дворец Антипы за изображения живых существ, а в 67 г. Тивериада открыла ворота Веспасиану. После войны она стала одним из главных средоточий иудейской учёности: Талмуд называет её последним местопребыванием синедриона, а Иерусалимский Талмуд сложился в основном в её школах к 400 г. н. э. В Хаммате, укреплённом городе Неффалимовом из книги Иисуса Навина, в 1960-х годах раскопали синагогу, мозаика которой, IV века, изображает зодиак вокруг бога солнца Гелиоса."
  uk:
    - "Тіверіада стояла там, де нині стоїть місто Тверія в Ізраїлі, на західному березі Галілейського моря під крутими пагорбами, з гарячими джерелами Хамата просто на південь; точка на мапі стоїть на старому місті. Вона лежить приблизно за 115 км на північ від Єрусалима по прямій, за 12 км на південь-південний захід від Капернаума і за 24 км на схід-північний схід від Назарета. Ірод Антипа, тетрарх Галілеї, заснував її й назвав на честь імператора Тиверія; заснування зазвичай датують близько 19 або 20 р. н. е., хоча вчені розходяться на рік-два."
    - "Новий Заповіт називає місто лише раз, в Івана: після нагодування п'яти тисяч «инші ж човни поприходили з Тиверияди поблизу місця, де їли хлїб». Іван також називає озеро «моря Галилейського, Тивериядського», і саме «на морі Тивериядському» воскреслий Ісус з'являється учням. Євангелія ніколи не кажуть, що Ісус заходив до Тіверіади, хоч вона лежала недалеко від Капернаума. Йосиф Флавій розповідає, чому багато юдеїв трималися осторонь: місто було збудоване над гробницями, так що поселенців доводилося примушувати жити там; воно було також осідком Антипи, про якого Ісус сказав: «скажіть лисицї тій»."
    - "Під час повстання 66 р. н. е. одна партія в місті спалила палац Антипи за зображення живих істот, а 67 р. Тіверіада відчинила ворота Веспасіанові. Після війни вона виросла в головний центр юдейської науки: Талмуд називає її останнім осідком синедріону, а Єрусалимський Талмуд сформувався значною мірою в її школах до 400 р. н. е. У Хаматі, обмуроване місто Нефталимове, назване в Книзі Ісуса Навина, розкопники 1960-х рр. відкрили синагогу, чия мозаїка IV ст. показує зодіак навколо бога сонця Геліоса."
  es:
    - "Tiberíades se alzaba donde se alza hoy la ciudad de Tiberíades, en Israel, en la orilla occidental del mar de Galilea, bajo colinas empinadas, con las aguas termales de Hamat justo al sur; el punto del mapa está sobre la ciudad vieja. Queda a unos 115 km al norte de Jerusalén en línea recta, a 12 km al sudsudoeste de Cafarnaúm y a 24 km al estenordeste de Nazaret. Herodes Antipas, tetrarca de Galilea, la fundó y le dio el nombre del emperador Tiberio; la fundación se fecha por lo común hacia el 19 o 20 d. C., aunque los estudiosos difieren en un año o dos."
    - "El Nuevo Testamento nombra la ciudad una sola vez, en Juan: tras la multiplicación de los cinco mil, «otras navecillas habían arribado de Tiberias junto al lugar donde habían comido el pan». Juan llama también al lago «la mar de Galilea, que es de Tiberias», y es «en la mar de Tiberias» donde Jesús resucitado se manifiesta a los discípulos. Los Evangelios nunca dicen que Jesús entrara en Tiberíades, aunque estaba a corta distancia a pie de Cafarnaúm. Josefo cuenta por qué muchos judíos se mantenían lejos: la ciudad estaba construida sobre tumbas, de modo que hubo que obligar a los colonos a vivir allí; era además la sede de Antipas, a quien Jesús llamó «aquella zorra»."
    - "En la revuelta del 66 d. C., un grupo de la ciudad quemó el palacio de Antipas por sus imágenes de seres vivos, y en 67 Tiberíades abrió sus puertas a Vespasiano. Tras la guerra se convirtió en uno de los principales centros del saber judío: el Talmud la nombra como la última sede del Sanedrín, y el Talmud de Jerusalén tomó forma en gran parte en sus escuelas hacia el 400 d. C. En Hamat, la ciudad fortificada de Neftalí que nombra Josué, los excavadores descubrieron en la década de 1960 una sinagoga cuyo mosaico del siglo IV muestra el zodiaco en torno al dios solar Helios."
  pt:
    - "Tiberíades ficava onde hoje está a cidade de Tiberíades, em Israel, na margem ocidental do mar da Galileia, abaixo de colinas íngremes, com as fontes termais de Hamate logo ao sul; o ponto do mapa fica na cidade antiga. Fica a cerca de 115 km ao norte de Jerusalém em linha reta, 12 km a su-sudoeste de Cafarnaum e 24 km a lés-nordeste de Nazaré. Herodes Antipas, tetrarca da Galileia, a fundou e lhe deu o nome do imperador Tibério; a fundação costuma ser datada de cerca de 19 ou 20 d.C., embora os estudiosos divirjam por um ano ou dois."
    - "O Novo Testamento nomeia a cidade apenas uma vez, em João: depois da alimentação dos cinco mil, “barcos de Tiberíades chegaram perto do lugar onde comeram o pão”. João também chama o lago de “o mar da Galileia, que também é chamado de mar de Tiberíades”, e é “junto ao mar de Tiberíades” que o Jesus ressuscitado se manifesta aos discípulos. Os Evangelhos nunca dizem que Jesus entrou em Tiberíades, embora ficasse a uma curta caminhada de Cafarnaum. Josefo conta por que muitos judeus se mantinham afastados: a cidade foi construída sobre túmulos, de modo que os colonos tiveram de ser obrigados a morar ali; era também a sede de Antipas, a quem Jesus chamou “àquela raposa”."
    - "Na revolta de 66 d.C., um grupo na cidade queimou o palácio de Antipas por suas imagens de seres vivos, e em 67 Tiberíades abriu as portas a Vespasiano. Depois da guerra tornou-se um dos principais centros do saber judaico: o Talmude a nomeia como a última sede do Sinédrio, e o Talmude de Jerusalém tomou forma em grande parte em suas escolas por volta de 400 d.C. Em Hamate, a cidade murada de Naftali mencionada em Josué, os escavadores revelaram na década de 1960 uma sinagoga cujo mosaico do século IV mostra o zodíaco em torno do deus-sol Hélio."
  de:
    - "Tiberias stand dort, wo heute die Stadt Tiberias in Israel steht, am Westufer des Sees Genezareth unterhalb steiler Hügel, mit den heißen Quellen von Hammat unmittelbar im Süden; der Kartenpunkt steht auf der Altstadt. Es liegt in der Luftlinie etwa 115 km nördlich von Jerusalem, 12 km südsüdwestlich von Kapernaum und 24 km ostnordöstlich von Nazareth. Herodes Antipas, Tetrarch von Galiläa, gründete es und benannte es nach dem Kaiser Tiberius; die Gründung wird meist auf etwa 19 oder 20 n. Chr. datiert, doch die Forscher weichen um ein bis zwei Jahre ab."
    - "Das Neue Testament nennt die Stadt nur einmal, bei Johannes: Nach der Speisung der Fünftausend: „Es kamen aber andere Schiffe von Tiberias nahe zur Stätte, da sie das Brot gegessen hatten“. Johannes spricht auch vom Meer „an der Stadt Tiberias in Galiläa“, und am See von Tiberias zeigt sich der auferstandene Jesus den Jüngern. Die Evangelien sagen nie, dass Jesus Tiberias betrat, obwohl es einen kurzen Fußweg von Kapernaum entfernt lag. Josephus erzählt, warum viele Juden fernblieben: Die Stadt war über Gräbern gebaut, sodass Siedler zum Wohnen gezwungen werden mussten; sie war auch der Sitz des Antipas, dem Jesus ausrichten ließ: „Gehet hin und saget diesem Fuchs“."
    - "Im Aufstand von 66 n. Chr. verbrannte eine Gruppe in der Stadt den Palast des Antipas wegen seiner Bilder lebender Wesen, und 67 öffnete Tiberias Vespasian die Tore. Nach dem Krieg wuchs es zu einem Hauptzentrum jüdischer Gelehrsamkeit: Der Talmud nennt es als letzten Sitz des Sanhedrin, und der Jerusalemer Talmud entstand bis etwa 400 n. Chr. großenteils in seinen Schulen. In Hammat, der in Josua genannten ummauerten Stadt Naftalis, legten Ausgräber in den 1960er-Jahren eine Synagoge frei, deren Mosaik aus dem 4. Jahrhundert den Tierkreis um den Sonnengott Helios zeigt."
  fr:
    - "Tibériade se dressait là où se trouve aujourd’hui la ville de Tibériade, en Israël, sur la rive occidentale de la mer de Galilée, au pied de collines escarpées, avec les sources chaudes de Hammath juste au sud ; le point de la carte se trouve sur la vieille ville. Elle est à environ 115 km au nord de Jérusalem à vol d’oiseau, à 12 km au sud-sud-ouest de Capernaüm et à 24 km à l’est-nord-est de Nazareth. Hérode Antipas, tétrarque de Galilée, la fonda et lui donna le nom de l’empereur Tibère ; la fondation est généralement datée d’environ 19 ou 20 apr. J.-C., bien que les spécialistes diffèrent d’un an ou deux."
    - "Le Nouveau Testament ne nomme la ville qu’une fois, chez Jean : après le repas donné aux cinq mille, « d’autres barques étaient arrivées de Tibériade près du lieu où ils avaient mangé le pain ». Jean appelle aussi le lac « la mer de Galilée, de Tibériade », et c’est « sur les bords de la mer de Tibériade » que Jésus ressuscité se montre aux disciples. Les Évangiles ne disent jamais que Jésus soit entré dans Tibériade, bien qu’elle fût à courte distance de marche de Capernaüm. Flavius Josèphe explique pourquoi beaucoup de Juifs s’en tenaient à l’écart : la ville était bâtie sur des tombes, si bien qu’il fallut contraindre des colons à y habiter ; c’était aussi le siège d’Antipas, que Jésus appela « ce renard »."
    - "Lors de la révolte de 66 apr. J.-C., un parti de la ville incendia le palais d’Antipas à cause de ses images d’êtres vivants, et en 67 Tibériade ouvrit ses portes à Vespasien. Après la guerre, elle devint un grand centre de l’étude juive : le Talmud la nomme comme dernier siège du Sanhédrin, et le Talmud de Jérusalem prit forme en grande partie dans ses écoles vers 400 apr. J.-C. À Hammath, la ville fortifiée de Nephthali nommée dans Josué, les fouilleurs ont mis au jour dans les années 1960 une synagogue dont la mosaïque du IVe siècle montre le zodiaque autour du dieu solaire Hélios."
