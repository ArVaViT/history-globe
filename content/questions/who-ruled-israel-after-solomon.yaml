id: who-ruled-israel-after-solomon
question:
  en: "Who ruled Israel after Solomon?"
  ru: "Кто правил Израилем после Соломона?"
  uk: "Хто правив Ізраїлем після Соломона?"
  es: "¿Quién gobernó Israel después de Salomón?"
  pt: "Quem governou Israel depois de Salomão?"
  de: "Wer herrschte nach Salomo über Israel?"
  fr: "Qui régna sur Israël après Salomon ?"
  pl: "Kto rządził Izraelem po Salomonie?"
  it: "Chi governò Israele dopo Salomone?"
  cs: "Kdo vládl Izraeli po Šalomounovi?"
  nl: "Wie regeerde over Israël na Salomo?"
answer:
  en:
    - "Two kings at once. Solomon's son Rehoboam kept Judah and Benjamin and the throne in Jerusalem, and Jeroboam the son of Nebat, a former officer of Solomon who had fled to Egypt, was made king by the ten northern tribes at Shechem, where the map point stands, about 49 km north of Jerusalem in a straight line. The usual date is 931 BC, on Thiele's chronology; 930, 928 and 922 are also held. Thereafter there were two kingdoms: Israel in the north, until Assyria took Samaria in 722 BC, and Judah in the south, until Babylon destroyed Jerusalem in 586."
    - "The split had been foretold. For Solomon's idolatry the Lord said, “I will surely rend the kingdom from thee, and will give it to thy servant”, keeping one tribe for David's sake; the prophet Ahijah of Shiloh tore a new garment into twelve pieces and gave Jeroboam ten. Solomon tried to kill him, and he fled to Shishak of Egypt. When Rehoboam came to Shechem to be made king, the people asked him to lighten “the grievous service of thy father”; he answered on the advice of the young men, “my father also chastised you with whips, but I will chastise you with scorpions”, and Israel cried, “What portion have we in David?… to your tents, O Israel: now see to thine own house, David.”"
    - "Rehoboam gathered 180,000 men to win them back, but the prophet Shemaiah stopped him: “this thing is from me.” Jeroboam fortified Shechem and Penuel and set golden calves at Bethel and Dan so that his people need not go up to Jerusalem; “there was war between Rehoboam and Jeroboam all their days”, and in Rehoboam's fifth year Shishak came up against Jerusalem and took the Temple treasures, a campaign his relief at Karnak records."
    - "Judah had twenty rulers, all of David's line but Athaliah, until Zedekiah was blinded and carried to Babylon. Israel had nineteen kings of nine houses: Jeroboam's son was murdered by Baasha, who ruled from Tirzah; Omri bought the hill of Samaria about 880 BC and built the capital that stood until the end, and his house is named on the Mesha Stele and in Assyrian records; Jehu's line lasted a century; Hoshea was the last. “For he rent Israel from the house of David”, Kings sums up, “and they made Jeroboam the son of Nebat king”. Outside the Bible, the Tel Dan stele found in 1993 names “the house of David” in the words of a ninth-century Aramean king. The chronology rests on Thiele's reconciling of the two kingdoms' regnal years, with co-regencies and two calendars; others, such as Galil, shift some reigns by a year or more."
  ru:
    - "Сразу два царя. Сын Соломона Ровоам сохранил Иуду и Вениамина и престол в Иерусалиме, а Иеровоама, сына Наватова, бывшего приставника Соломона, бежавшего в Египет, десять северных колен поставили царём в Сихеме, где и стоит точка карты, примерно в 49 км к северу от Иерусалима по прямой. Обычная дата — 931 г. до н. э. по хронологии Тиле; называют также 930, 928 и 922 гг. С тех пор было два царства: Израиль на севере, пока Ассирия не взяла Самарию в 722 г. до н. э., и Иудея на юге, пока Вавилон не разрушил Иерусалим в 586-м."
    - "Раскол был предсказан. За идолопоклонство Соломона Господь сказал: «Я отторгну от тебя царство и отдам его рабу твоему», оставив одно колено ради Давида; пророк Ахия Силомлянин разодрал новую одежду на двенадцать частей и дал Иеровоаму десять. Соломон хотел его убить, и тот бежал к Сусакиму в Египет. Когда Ровоам пришёл в Сихем, чтобы его воцарили, народ просил облегчить «жестокую работу отца твоего»; он ответил по совету молодых людей: «отец мой наказывал вас бичами, а я буду наказывать вас скорпионами», и Израиль воскликнул: «какая нам часть в Давиде?.. по шатрам своим, Израиль! теперь знай свой дом, Давид!»"
    - "Ровоам собрал сто восемьдесят тысяч воинов, чтобы вернуть их, но пророк Самей остановил его: «ибо от Меня это было». Иеровоам укрепил Сихем и Пенуэл и поставил золотых тельцов в Вефиле и Дане, чтобы народ не ходил в Иерусалим; «между Ровоамом и Иеровоамом была война во все дни жизни их», а на пятом году Ровоама Сусаким вышел на Иерусалим и забрал сокровища Храма — этот поход запечатлён на его рельефе в Карнаке."
    - "В Иудее было двадцать правителей, все из рода Давида, кроме Гофолии, пока Седекию не ослепили и не увели в Вавилон. В Израиле было девятнадцать царей девяти домов: сына Иеровоама убил Вааса, правивший из Фирцы; Амврий около 880 г. до н. э. купил гору Самарию и построил столицу, стоявшую до конца, и его дом назван на стеле Меши и в ассирийских записях; род Ииуя продержался век; Осия был последним. «Израильтяне отторглись от дома Давидова и воцарили Иеровоама, сына Наватова», — подводит итог книга Царств. Вне Библии стела из Тель-Дана, найденная в 1993 году, называет «дом Давида» словами арамейского царя IX века. Хронология опирается на согласование Тиле годов правления двух царств, с соправлениями и двумя календарями; другие, как Галиль, сдвигают некоторые царствования на год и больше."
  uk:
    - "Два царі одночасно. Син Соломона Ровоам зберіг Юду й Веніямина та престол в Єрусалимі, а Єровоам, син Навата, колишній урядовець Соломона, що втік до Єгипту, був поставлений царем десятьма північними племенами в Сихемі, де стоїть точка на мапі, приблизно за 49 км на північ від Єрусалима по прямій. Зазвичай датою називають 931 р. до н. е. за хронологією Тіле; тримаються також 930, 928 і 922 рр. Відтоді було два царства: Ізраїль на півночі, доки Ассирія не взяла Самарію 722 р. до н. е., і Юда на півдні, доки Вавилон не зруйнував Єрусалим 586 р."
    - "Розкол було передбачено. За ідолопоклонство Соломона Господь сказав: «я роздїлю на частї царство твоє й надїлю його слузї твойму», зберігши одне коліно заради Давида; пророк Ахія з Шіло розірвав нову одежу на дванадцять шматків і дав Єровоамові десять. Соломон намагався його вбити, і він утік до Сусакіма в Єгипет. Коли Ровоам прийшов до Сихема, щоб його поставили царем, народ просив його полегшити «тяжку службу»; він відповів за порадою молодих: «коли мій батько карав вас бичами, то я карати му скорпіонами», і Ізраїль вигукнув: «Що за часть нам у Давидї? ... Гей, Ізраїлю, додому! Дивись на свій дом, Давиде!»"
    - "Ровоам зібрав 180 000 чоловік, щоб повернути їх, але пророк Шемаїя зупинив його: «від мене бо так сталося». Єровоам укріпив Сихем і Пенуел і поставив золоті тельці у Бет-Елі й Дані, щоб його народ не мусив ходити до Єрусалима; «По всяк же час була війна між Робоамом і Еробоамом», а на п'ятий рік Ровоама Сусакім рушив на Єрусалим і забрав храмові скарби — похід, який записує його рельєф у Карнаку."
    - "Юда мала двадцятьох правителів, усіх із роду Давида, крім Аталії, доки Седекію не осліпили й не відвели до Вавилона. Ізраїль мав дев'ятнадцять царів дев'яти домів: сина Єровоама вбив Вааса, що правив із Тірци; Омрі купив пагорб Самарії близько 880 р. до н. е. й збудував столицю, що стояла до кінця, і його дім названо на Стелі Меші та в ассирійських записах; рід Єгу тривав століття; Осія був останнім. Книга Царів підсумовує: «Ізрайлитяне одорвались від дому Давидового й зробили царем Еробоама Набатенка». Поза Біблією стела з Тель-Дана, знайдена 1993 р., називає «дім Давида» словами арамейського царя IX ст. Хронологія спирається на узгодження Тіле років правління обох царств, із співправліннями та двома календарями; інші, як-от Галіль, зсувають деякі правління на рік чи більше."
  es:
    - "Dos reyes a la vez. Roboam, hijo de Salomón, conservó Judá y Benjamín y el trono en Jerusalén, y Jeroboam, hijo de Nabat, antiguo oficial de Salomón que había huido a Egipto, fue hecho rey por las diez tribus del norte en Siquem, donde está el punto del mapa, a unos 49 km al norte de Jerusalén en línea recta. La fecha habitual es 931 a. C., según la cronología de Thiele; también se sostienen 930, 928 y 922. Desde entonces hubo dos reinos: Israel, en el norte, hasta que Asiria tomó Samaria en 722 a. C., y Judá, en el sur, hasta que Babilonia destruyó Jerusalén en 586."
    - "La división había sido anunciada. Por la idolatría de Salomón, el Señor dijo: «romperé el reino de ti, y lo entregaré á tu siervo», conservando una tribu por amor de David; el profeta Ahías de Silo rompió una capa nueva en doce pedazos y dio diez a Jeroboam. Salomón intentó matarlo, y él huyó a Sisac de Egipto. Cuando Roboam fue a Siquem para ser hecho rey, el pueblo le pidió que aliviara «la dura servidumbre de tu padre»; él respondió siguiendo el consejo de los jóvenes: «mi padre os hirió con azotes, mas yo os heriré con escorpiones», e Israel clamó: «¿Qué parte tenemos nosotros con David? … ¡Israel, á tus estancias! ¡Provee ahora en tu casa, David!»."
    - "Roboam reunió a 180 000 hombres para recuperarlos, pero el profeta Semaías lo detuvo: «este negocio yo lo he hecho». Jeroboam fortificó Siquem y Peniel y puso becerros de oro en Betel y Dan para que su pueblo no tuviera que subir a Jerusalén; «hubo guerra entre Roboam y Jeroboam todos los días», y en el quinto año de Roboam Sisac subió contra Jerusalén y se llevó los tesoros del Templo, una campaña que registra su relieve de Karnak."
    - "Judá tuvo veinte gobernantes, todos de la línea de David salvo Atalía, hasta que Sedequías fue cegado y llevado a Babilonia. Israel tuvo diecinueve reyes de nueve casas: el hijo de Jeroboam fue asesinado por Baasa, que reinó desde Tirsa; Omri compró el monte de Samaria hacia el 880 a. C. y construyó la capital que duró hasta el final, y su casa se nombra en la estela de Mesa y en los registros asirios; la línea de Jehú duró un siglo; Oseas fue el último. «Cortó á Israel de la casa de David», resume Reyes, «y ellos se hicieron rey á Jeroboam hijo de Nabat». Fuera de la Biblia, la estela de Tel Dan, hallada en 1993, nombra «la casa de David» en palabras de un rey arameo del siglo IX. La cronología se apoya en la armonización de Thiele de los años de reinado de los dos reinos, con corregencias y dos calendarios; otros, como Galil, desplazan algunos reinados un año o más."
  pt:
    - "Dois reis ao mesmo tempo. Roboão, filho de Salomão, manteve Judá e Benjamim e o trono em Jerusalém, e Jeroboão, filho de Nebate, antigo oficial de Salomão que fugira para o Egito, foi feito rei pelas dez tribos do norte em Siquém, onde está o ponto do mapa, a cerca de 49 km ao norte de Jerusalém em linha reta. A data usual é 931 a.C., segundo a cronologia de Thiele; também se defendem 930, 928 e 922. Daí em diante houve dois reinos: Israel, no norte, até que a Assíria tomou Samaria em 722 a.C., e Judá, no sul, até que a Babilônia destruiu Jerusalém em 586."
    - "A divisão fora predita. Pela idolatria de Salomão, o SENHOR disse: “certamente arrancarei o reino de você, e o darei ao seu servo”, conservando uma tribo por amor a Davi; o profeta Aías de Siló rasgou uma veste nova em doze pedaços e deu dez a Jeroboão. Salomão tentou matá-lo, e ele fugiu para Sisaque do Egito. Quando Roboão foi a Siquém para ser feito rei, o povo lhe pediu que aliviasse “a dura servidão de seu pai”; ele respondeu, aconselhado pelos jovens: “Meu pai os castigou com chicotes, mas eu os castigarei com escorpiões”, e Israel clamou: “Que porção temos nós em Davi? … Às suas tendas, ó Israel! Agora cuide da sua própria casa, Davi.”"
    - "Roboão reuniu 180.000 homens para reconquistá-los, mas o profeta Semaías o deteve: “isso vem de mim.” Jeroboão fortificou Siquém e Peniel e pôs bezerros de ouro em Betel e Dã, para que seu povo não precisasse subir a Jerusalém; “Havia guerra contínua entre Roboão e Jeroboão”, e no quinto ano de Roboão Sisaque subiu contra Jerusalém e levou os tesouros do Templo, campanha que o seu relevo em Carnaque registra."
    - "Judá teve vinte governantes, todos da linhagem de Davi exceto Atalia, até que Zedequias foi cegado e levado para a Babilônia. Israel teve dezenove reis de nove casas: o filho de Jeroboão foi assassinado por Baasa, que reinou a partir de Tirza; Onri comprou a colina de Samaria por volta de 880 a.C. e construiu a capital que durou até o fim, e sua casa é nomeada na Estela de Mesa e em registros assírios; a linhagem de Jeú durou um século; Oseias foi o último. “Pois ele rasgou Israel da casa de Davi; e eles fizeram rei a Jeroboão, filho de Nebate”, resume Reis. Fora da Bíblia, a estela de Tel Dan, encontrada em 1993, nomeia “a casa de Davi” nas palavras de um rei arameu do século IX. A cronologia se apoia na conciliação de Thiele dos anos de reinado dos dois reinos, com corregências e dois calendários; outros, como Galil, deslocam alguns reinados em um ano ou mais."
  de:
    - "Zwei Könige zugleich. Salomos Sohn Rehabeam behielt Juda und Benjamin und den Thron in Jerusalem, und Jerobeam, der Sohn Nebats, ein früherer Beamter Salomos, der nach Ägypten geflohen war, wurde von den zehn nördlichen Stämmen in Sichem zum König gemacht, wo der Kartenpunkt steht, in der Luftlinie etwa 49 km nördlich von Jerusalem. Das übliche Datum ist 931 v. Chr. nach Thieles Chronologie; auch 930, 928 und 922 werden vertreten. Danach gab es zwei Königreiche: Israel im Norden, bis Assyrien 722 v. Chr. Samaria einnahm, und Juda im Süden, bis Babylon 586 Jerusalem zerstörte."
    - "Die Teilung war vorhergesagt. Wegen Salomos Götzendienst sprach der HERR: „so will ich auch das Königreich von dir reißen und deinem Knecht geben“, behielt aber um Davids willen einen Stamm; der Prophet Ahija von Silo riss einen neuen Mantel in zwölf Stücke und gab Jerobeam zehn. Salomo versuchte ihn zu töten, und er floh zu Schischak von Ägypten. Als Rehabeam nach Sichem kam, um zum König gemacht zu werden, baten ihn die Leute, „den harten Dienst und das schwere Joch leichter“ zu machen; er antwortete nach dem Rat der Jungen: „Mein Vater hat euch mit Peitschen gezüchtigt; ich aber will euch mit Skorpionen züchtigen“, und Israel rief: „Was haben wir für Teil an David oder Erbe am Sohn Isais? Israel, hebe dich zu deinen Hütten! So, siehe nun du zu deinem Hause, David!“"
    - "Rehabeam sammelte 180000 Mann, um sie zurückzugewinnen, doch der Prophet Schemaja hielt ihn auf: „denn solches ist von mir geschehen“. Jerobeam befestigte Sichem und Penuel und stellte goldene Kälber in Bethel und Dan auf, damit sein Volk nicht nach Jerusalem hinaufziehen musste; „Es war aber Krieg zwischen Rehabeam und Jerobeam ihr Leben lang“, und in Rehabeams fünftem Jahr zog Schischak gegen Jerusalem und nahm die Tempelschätze, ein Feldzug, den sein Relief in Karnak verzeichnet."
    - "Juda hatte zwanzig Herrscher, alle aus Davids Linie außer Atalja, bis Zedekia geblendet nach Babylon geführt wurde. Israel hatte neunzehn Könige aus neun Häusern: Jerobeams Sohn wurde von Baesa ermordet, der von Tirza aus regierte; Omri kaufte um 880 v. Chr. den Hügel von Samaria und baute die Hauptstadt, die bis zum Ende bestand, sein Haus nennen die Mesa-Stele und assyrische Quellen; Jehus Linie dauerte ein Jahrhundert; Hosea war der letzte. „Denn Israel ward gerissen vom Hause Davids; und sie machten zum König Jerobeam, den Sohn Nebats“, so das Königsbuch. Außerhalb der Bibel nennt die 1993 gefundene Tel-Dan-Stele eines aramäischen Königs des 9. Jahrhunderts „das Haus David“. Die Chronologie beruht auf Thieles Abgleich der Regierungsjahre beider Reiche mit Mitregentschaften und zwei Kalendern; andere wie Galil verschieben manche um ein Jahr oder mehr."
  fr:
    - "Deux rois à la fois. Roboam, fils de Salomon, garda Juda et Benjamin et le trône de Jérusalem, et Jéroboam, fils de Nebath, ancien officier de Salomon qui s’était enfui en Égypte, fut fait roi par les dix tribus du nord à Sichem, où se trouve le point de la carte, à environ 49 km au nord de Jérusalem à vol d’oiseau. La date habituelle est 931 av. J.-C., selon la chronologie de Thiele ; 930, 928 et 922 sont aussi retenues. Il y eut dès lors deux royaumes : Israël au nord, jusqu’à ce que l’Assyrie prenne Samarie en 722 av. J.-C., et Juda au sud, jusqu’à ce que Babylone détruise Jérusalem en 586."
    - "La division avait été annoncée. À cause de l’idolâtrie de Salomon, l’Éternel dit : « je déchirerai le royaume de dessus toi et je le donnerai à ton serviteur », gardant une tribu à cause de David ; le prophète Achija de Silo déchira un manteau neuf en douze morceaux et en donna dix à Jéroboam. Salomon chercha à le faire mourir, et il s’enfuit auprès de Schischak d’Égypte. Quand Roboam vint à Sichem pour être fait roi, le peuple lui demanda d’alléger « cette rude servitude et le joug pesant que nous a imposé ton père » ; il répondit selon le conseil des jeunes gens : « mon père vous a châtiés avec des fouets, et moi je vous châtierai avec des scorpions », et Israël s’écria : « Quelle part avons-nous avec David ? … À tes tentes, Israël ! Maintenant, pourvois à ta maison, David ! »"
    - "Roboam rassembla cent quatre-vingt mille hommes pour les reconquérir, mais le prophète Schemaeja l’arrêta : « c’est de par moi que cette chose est arrivée ». Jéroboam fortifia Sichem et Peniel et plaça des veaux d’or à Béthel et à Dan afin que son peuple n’ait pas à monter à Jérusalem ; « Il y eut toujours guerre entre Roboam et Jéroboam », et la cinquième année de Roboam, Schischak monta contre Jérusalem et prit les trésors du Temple, campagne que son relief de Karnak consigne."
    - "Juda eut vingt souverains, tous de la lignée de David sauf Athalie, jusqu’à Sédécias, aveuglé et emmené à Babylone. Israël eut dix-neuf rois de neuf maisons : le fils de Jéroboam fut tué par Baescha, qui régna à Thirtsa ; Omri acheta la colline de Samarie vers 880 av. J.-C. et bâtit la capitale qui dura jusqu’à la fin, et sa maison figure sur la stèle de Méscha et dans les annales assyriennes ; la lignée de Jéhu dura un siècle ; Osée fut le dernier. « Car Israël s’était détaché de la maison de David, et ils avaient fait roi Jéroboam, fils de Nebath », dit le livre des Rois. Hors de la Bible, la stèle de Tel Dan (1993) nomme « la maison de David » dans les mots d’un roi araméen du IXe siècle. La chronologie repose sur l’accord des années de règne établi par Thiele, avec corégences et deux calendriers ; d’autres, comme Galil, décalent certains règnes d’un an ou plus."
  pl:
    - "Dwaj królowie naraz. Syn Salomona Roboam zachował Judę i Beniamina oraz tron w Jerozolimie, a Jeroboam, syn Nebata, dawny urzędnik Salomona, który uciekł do Egiptu, został ogłoszony królem przez dziesięć pokoleń północnych w Sychem, gdzie stoi punkt na mapie, około 49 km na północ od Jerozolimy w linii prostej. Zwykła data to 931 p.n.e. według chronologii Thielego; podaje się także 930, 928 i 922. Odtąd były dwa królestwa: Izrael na północy, aż Asyria zdobyła Samarię w 722 p.n.e., i Juda na południu, aż Babilon zniszczył Jerozolimę w 586."
    - "Podział został zapowiedziany. Za bałwochwalstwo Salomona Pan rzekł: „pewnie oderwę królestwo od ciebie, a dam je słudze twojemu”, zachowując jedno pokolenie ze względu na Dawida; prorok Achiasz z Szilo rozdarł nowy płaszcz na dwanaście sztuk i dał Jeroboamowi dziesięć. Salomon próbował go zabić, a on uciekł do Sziszaka w Egipcie. Gdy Roboam przyszedł do Sychem, by zostać ogłoszony królem, lud poprosił go o ulżenie „niewoli srogiej ojca twego”; odpowiedział za radą młodzieńców: „ojciec mój karał was biczykami, ale ja was będę karał korbaczami”, a Izrael zawołał: „Cóż my mamy za dział w Dawidzie?… Idź do namiotów swych, o Izraelu, a ty Dawidzie opatrz teraz dom twój”."
    - "Roboam zebrał 180 000 ludzi, by ich odzyskać, lecz prorok Szemajasz go powstrzymał: „odemnie się ta rzecz stała”. Jeroboam ufortyfikował Sychem i Penuel i postawił złote cielce w Betel i Dan, by jego lud nie musiał chodzić do Jerozolimy; „była wojna między Roboamem i między Jeroboamem po wszystkie dni”, a w piątym roku Roboama Sziszak wyruszył na Jerozolimę i zabrał skarby Świątyni, co odnotowuje jego relief w Karnaku."
    - "Juda miała dwudziestu władców, wszystkich z linii Dawida oprócz Atalii, aż Sedekiasz został oślepiony i uprowadzony do Babilonu. Izrael miał dziewiętnastu królów z dziewięciu rodów: syn Jeroboama został zamordowany przez Baaszę, który rządził z Tirsy; Omri kupił wzgórze Samarii około 880 p.n.e. i zbudował stolicę, która stała do końca, a jego ród jest wymieniony na Steli Mesza i w zapisach asyryjskich; linia Jehu trwała wiek; Ozeasz był ostatni. Księgi Królewskie podsumowują: „oderwał się Izrael od domu Dawidowego, a postanowili królem Jeroboama, syna Nabatowego”. Poza Biblią stela z Tel Dan, znaleziona w 1993, wymienia „dom Dawida” w słowach aramejskiego króla z IX wieku. Chronologia opiera się na uzgodnieniu przez Thielego lat panowania obu królestw, z koregencjami i dwoma kalendarzami; inni, jak Galil, przesuwają niektóre panowania o rok lub więcej."
  it:
    - "Due re contemporaneamente. Roboamo, figlio di Salomone, mantenne Giuda e Beniamino e il trono a Gerusalemme, e Geroboamo figlio di Nebat, un ex ufficiale di Salomone fuggito in Egitto, fu fatto re dalle dieci tribù settentrionali a Sichem, dove si trova il punto della mappa, a circa 49 km a nord di Gerusalemme in linea d’aria. La data abituale è il 931 a.C., secondo la cronologia di Thiele; sono sostenute anche il 930, il 928 e il 922. Da allora vi furono due regni: Israele a nord, finché l’Assiria prese Samaria nel 722 a.C., e Giuda a sud, finché Babilonia distrusse Gerusalemme nel 586."
    - "La divisione era stata predetta. Per l’idolatria di Salomone il Signore disse: «io ti strapperò di dosso il reame, e lo darò al tuo servo», conservando una tribù per amore di Davide; il profeta Achia di Silo strappò un mantello nuovo in dodici pezzi e ne diede dieci a Geroboamo. Salomone cercò di ucciderlo, ed egli fuggì presso Sisak d’Egitto. Quando Roboamo andò a Sichem per essere fatto re, il popolo gli chiese di alleggerire «la dura servitù e il giogo pesante che tuo padre ci ha imposti»; egli rispose seguendo il consiglio dei giovani, «mio padre vi ha castigati con la frusta, e io vi castigherò coi flagelli a punte», e Israele gridò: «Che abbiam noi da fare con Davide?… Alle tue tende, o Israele! Provvedi ora tu alla tua casa, o Davide!»."
    - "Roboamo radunò 180.000 uomini per riconquistarli, ma il profeta Semaia lo fermò: «questo è avvenuto per voler mio». Geroboamo fortificò Sichem e Penuel e pose vitelli d’oro a Betel e a Dan perché il suo popolo non dovesse salire a Gerusalemme; «vi fu guerra continua fra Roboamo e Geroboamo», e nel quinto anno di Roboamo Sisak salì contro Gerusalemme e prese i tesori del Tempio, una campagna che il suo rilievo a Karnak registra."
    - "Giuda ebbe venti sovrani, tutti della linea di Davide tranne Atalia, finché Sedecia fu accecato e portato a Babilonia. Israele ebbe diciannove re di nove casate: il figlio di Geroboamo fu assassinato da Baasa, che regnò da Tirza; Omri comprò il colle di Samaria verso l’880 a.C. e costruì la capitale rimasta fino alla fine, e la sua casata è nominata nella Stele di Mesa e nei testi assiri; la linea di Ieu durò un secolo; Osea fu l’ultimo. «Quand’egli ebbe strappato Israele dalla casa di Davide e quelli ebbero proclamato re Geroboamo, figliuolo di Nebat», riassumono i Re. Fuori della Bibbia, la stele di Tel Dan trovata nel 1993 nomina «la casa di Davide» nelle parole di un re arameo del IX secolo. La cronologia poggia sulla conciliazione di Thiele degli anni di regno dei due regni, con coreggenze e due calendari; altri, come Galil, spostano certi regni di un anno o più."
  cs:
    - "Dva králové současně. Šalomounův syn Rechabeám podržel Judu a Benjamína a trůn v Jeruzalémě a Jarobeáma, syna Nebatova, bývalého Šalomounova úředníka, který uprchl do Egypta, ustanovilo za krále deset severních kmenů v Šekemu, kde stojí bod na mapě, vzdušnou čarou asi 49 km severně od Jeruzaléma. Obvyklé datum je rok 931 př. n. l. podle Thieleovy chronologie; hájí se i 930, 928 a 922. Poté byla dvě království: Izrael na severu, dokud Asýrie roku 722 př. n. l. nedobyla Samaří, a Juda na jihu, dokud Babylón roku 586 nezničil Jeruzalém."
    - "Rozdělení bylo předpověděno. Pro Šalomounovo modlářství řekl Hospodin: „odtrhnu království toto od tebe, a dám je služebníku tvému“ a jeden kmen ponechal kvůli Davidovi; prorok Achijáš Šílonský roztrhl nový plášť na dvanáct kusů a deset dal Jarobeámovi. Šalomoun se ho snažil zabít a on uprchl k Šíšakovi do Egypta. Když Rechabeám přišel do Šekemu, aby byl ustanoven králem, lid ho požádal: „polehč služby otce svého tvrdé“; odpověděl podle rady mládenců: „otec můj trestal vás bičíky, ale já trestati vás budu biči uzlovatými“, a Izrael zvolal: „Jakýž máme díl v Davidovi?… K stanům svým, ó Izraeli! Nyní opatř dům svůj, Davide.“"
    - "Rechabeám shromáždil 180 000 mužů, aby je získal zpět, ale prorok Šemajáš ho zastavil: „ode mne stala se věc tato.“ Jarobeám opevnil Šekem a Penuel a postavil zlatá telata v Bét-elu a v Danu, aby jeho lid nemusel vystupovat do Jeruzaléma; byla „válka, kteráž byla mezi Roboámem a Jeroboámem po všecky dny“ a v Rechabeámově pátém roce vytáhl Šíšak proti Jeruzalému a vzal chrámové poklady, tažení, které zaznamenává jeho reliéf v Karnaku."
    - "Juda měl dvacet vládců, všechny z Davidova rodu kromě Atalji, až do chvíle, kdy byl Sidkijáš oslepen a odveden do Babylóna. Izrael měl devatenáct králů devíti rodů: Jarobeámova syna zavraždil Baeša, který vládl z Tirsy; Omrí koupil pahorek Samaří kolem roku 880 př. n. l. a vystavěl hlavní město, které stálo až do konce, a jeho dům je jmenován na Mešově stéle a v asyrských záznamech; Jehúova linie trvala století; Hóšea byl poslední. „Nebo odtrhl Izraele od domu Davidova“, shrnují Knihy Královské, „a krále ustanovili Jeroboáma syna Nebatova“. Mimo Bibli jmenuje stéla z Tel Danu nalezená roku 1993 „dům Davidův“ slovy aramejského krále 9. století. Chronologie se opírá o Thieleovo sladění vládních let obou království, se spoluvládami a dvěma kalendáři; jiní, například Galil, posouvají některé vlády o rok i více."
  nl:
    - "Twee koningen tegelijk. Salomo's zoon Rehabeam hield Juda en Benjamin en de troon in Jeruzalem, en Jerobeam, de zoon van Nebat, een voormalig ambtenaar van Salomo die naar Egypte was gevlucht, werd door de tien noordelijke stammen tot koning gemaakt te Sichem, waar het punt op de kaart staat, hemelsbreed ongeveer 49 km ten noorden van Jeruzalem. De gebruikelijke datum is 931 v.Chr., volgens de chronologie van Thiele; ook 930, 928 en 922 worden aangehouden. Daarna waren er twee koninkrijken: Israël in het noorden, tot Assyrië Samaria in 722 v.Chr. innam, en Juda in het zuiden, tot Babylon Jeruzalem in 586 verwoestte."
    - "De splitsing was voorzegd. Vanwege Salomo's afgoderij zei de HEER: “Ik zal gewisselijk dit koninkrijk van u scheuren, en datzelve uw knecht geven”, waarbij Hij één stam bewaarde om Davids wil; de profeet Achia van Silo scheurde een nieuw kleed in twaalf stukken en gaf Jerobeam er tien. Salomo probeerde hem te doden, en hij vluchtte naar Sisak van Egypte. Toen Rehabeam naar Sichem kwam om koning te worden gemaakt, vroeg het volk hem “uws vaders harden dienst” te verlichten; hij antwoordde op raad van de jongemannen: “mijn vader heeft u met geselen gekastijd, maar ik zal u met schorpioenen kastijden”, en Israël riep: “Wat deel hebben wij aan David?… naar uw tenten, o Israel! Voorzie nu uw huis, o David!”"
    - "Rehabeam verzamelde 180.000 man om hen terug te winnen, maar de profeet Semaja hield hem tegen: “deze zaak is van Mij geschied.” Jerobeam versterkte Sichem en Peniël en plaatste gouden kalveren te Bethel en Dan opdat zijn volk niet naar Jeruzalem hoefde op te gaan; “er was krijg tussen Rehabeam en tussen Jerobeam, al hun dagen”, en in Rehabeams vijfde jaar trok Sisak tegen Jeruzalem op en nam de tempelschatten, een veldtocht die zijn reliëf in Karnak vastlegt."
    - "Juda had twintig heersers, allen uit Davids huis behalve Atalia, tot Zedekia werd verblind en naar Babylon gevoerd. Israël had negentien koningen van negen huizen: Baësa vermoordde Jerobeams zoon en regeerde vanuit Tirza; Omri kocht omstreeks 880 v.Chr. de heuvel van Samaria en bouwde de hoofdstad die tot het einde bleef, en zijn huis staat op de Mesa-stèle en in Assyrische bronnen; het huis van Jehu een eeuw; Hosea was de laatste. “Hij scheurde Israel van het huis van David af”, vat Koningen samen, “en zij maakten Jerobeam, den zoon van Nebat, koning”. Buiten de Bijbel noemt de Tel Dan-stèle (1993) “het huis van David”, in de woorden van een Aramese koning (negende eeuw). De chronologie berust op Thiele's afstemming van de regeringsjaren van beide koninkrijken (co-regentschappen, twee kalenders); anderen, zoals Galil, verschuiven sommige regeringen een jaar of meer."
