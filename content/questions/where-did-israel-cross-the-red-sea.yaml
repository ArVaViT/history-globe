id: where-did-israel-cross-the-red-sea
question:
  en: "Where did Israel cross the Red Sea?"
  ru: "Где Израиль перешёл Чермное море?"
  uk: "Де Ізраїль перейшов Червоне море?"
  es: "¿Dónde cruzó Israel el mar Rojo?"
  pt: "Onde Israel atravessou o mar Vermelho?"
  de: "Wo überquerte Israel das Rote Meer?"
  fr: "Où Israël a-t-il traversé la mer Rouge ?"
answer:
  en:
    - "The place of the crossing is disputed, and the sea itself is in question: the Hebrew name is yam suph, usually taken to mean “sea of reeds”, and the Old Testament uses it both for the Gulf of Suez and for the Gulf of Aqaba. Four answers are given: the northern end of the Gulf of Suez, where the map point stands; the Bitter Lakes or Lake Timsah on the isthmus, where the Suez Canal now runs; the lagoons of the northern isthmus, Lake Ballah or Lake Menzaleh; and the Gulf of Aqaba."
    - "Exodus says that Israel left Rameses for Succoth and Etham “in the edge of the wilderness”, then turned back to camp “before Pi-hahiroth, between Migdol and the sea, over against Baal-zephon”; there “the LORD caused the sea to go back by a strong east wind all that night”. Of these camps only Succoth is placed with some confidence, at Tell el-Maskhuta in the Wadi Tumilat, about 37 km from Rameses in a straight line. The map puts Baal-zephon and Migdol at Tell Defenneh and Tell el-Herr in the north-eastern Delta, following one reading of the Egyptian frontier forts, but the names could belong to the lakes region further south."
    - "The Gulf of Suez is the traditional site: Josephus leads Israel there by way of Letopolis near today's Cairo, and the later pilgrims followed; the lakes of the isthmus suit the wilderness of Shur that follows and the three days to Marah; the northern lagoons rest on the Baal-zephon cult known at the Mediterranean coast, though Exodus says God did not lead the people by the way of the Philistines. The Gulf of Aqaba, reached by a march across the whole Sinai Peninsula, is argued from 1 Kings 9:26, which places Ezion-geber on the yam suph, but few scholars accept it. The map shows the traditional sea and lists the alternatives on the place card."
  ru:
    - "Место перехода спорно, и само море под вопросом: по-еврейски оно зовётся «ям суф», что обычно понимают как «море тростника», и Ветхий Завет называет так и Суэцкий залив, и залив Акаба. Дают четыре ответа: северный конец Суэцкого залива, где стоит точка на карте; Горькие озёра или озеро Тимсах на перешейке, где теперь проходит Суэцкий канал; лагуны северного перешейка — озеро Балла или Мензала; и залив Акаба."
    - "Исход говорит, что Израиль вышел из Раамсеса в Сокхоф и Ефам, «в конце пустыни», а затем повернул и стал станом «пред Пи-Гахирофом, между Мигдолом и между морем, пред Ваал-Цефоном»; там «гнал Господь море сильным восточным ветром всю ночь». Из этих стоянок с некоторой уверенностью привязан только Сокхоф — Телль-эль-Масхута в Вади-Тумилат, примерно в 37 км от Раамсеса по прямой. Карта ставит Ваал-Цефон и Мигдол у Телль-Дефенне и Телль-эль-Херра на северо-востоке дельты, следуя одному из чтений египетских пограничных крепостей, но эти названия могли относиться и к области озёр южнее."
    - "Суэцкий залив — традиционное место: Иосиф Флавий ведёт туда Израиль через Летополь у нынешнего Каира, и позднейшие паломники шли за ним; озёра перешейка согласуются с пустыней Сур, которая идёт дальше, и с тремя днями пути до Мерры; северные лагуны опираются на культ Ваал-Цефона, известный на средиземноморском берегу, хотя Исход говорит, что Бог не повёл народ дорогой земли Филистимской. Залив Акаба, до которого нужно пройти весь Синайский полуостров, выводят из 3 Царств 9:26, где Ецион-Гавер стоит на «ям суф», но немногие учёные это принимают. Карта показывает традиционное море, а остальные варианты перечисляет в карточке."
  uk:
    - "Місце переходу спірне, і саме море під питанням: єврейська назва — ям суф, яку зазвичай розуміють як «море очерету», і Старий Заповіт вживає її і для Суецької затоки, і для затоки Акаба. Дають чотири відповіді: північний кінець Суецької затоки, де стоїть точка мапи; Гіркі озера чи озеро Тімсах на перешийку, де нині проходить Суецький канал; лагуни північного перешийку, озеро Баллах чи озеро Мензала; і затока Акаба."
    - "Книга Вихід каже, що Ізраїль вирушив із Раамсеса до Сокхоту й Етаму «уз край степу», потім повернув назад, щоб отаборитися «перед Пі-Гахиротом, між Микдолом і морем; перед Бааль-Цефоном отаборитесь навпроти його, при морі»; там «одганяв Господь море геть потужним восточнім вітром у сю ніч». З цих таборів лише Сокхот розміщено з певною впевненістю, у Тель-ель-Мескхуті у Ваді-Тумілаті, приблизно за 37 км від Раамсеса по прямій. Мапа ставить Ваал-Цефон і Мігдол у Тель-Дефенне й Тель-ель-Герр на північному сході дельти, за одним прочитанням єгипетських прикордонних фортець, але ці назви могли б належати району озер далі на південь."
    - "Суецька затока — традиційне місце: Йосиф Флавій веде Ізраїль туди через Летополіс поблизу нинішнього Каїра, і пізніші прочани йшли за ним; озера перешийку пасують до Сурської пустелі, що йде далі, і трьох днів до Мерри; північні лагуни спираються на культ Ваал-Цефона, відомий на середземноморському узбережжі, хоча Книга Вихід каже, що Бог не повів народ дорогою филистимською. Затоку Акаба, до якої треба пройти через увесь Синайський півострів, обстоюють із 1 Цар 9:26, що ставить Еціон-Гевер на ям суф, але мало вчених це приймає. Мапа показує традиційне море й перелічує альтернативи на картці місця."
  es:
    - "El lugar del cruce es discutido, y el propio mar está en cuestión: el nombre hebreo es yam suph, que suele entenderse como «mar de los juncos», y el Antiguo Testamento lo usa tanto para el golfo de Suez como para el golfo de Aqaba. Se dan cuatro respuestas: el extremo norte del golfo de Suez, donde está el punto del mapa; los Lagos Amargos o el lago Timsah, en el istmo, por donde discurre ahora el canal de Suez; las lagunas del istmo septentrional, el lago Ballah o el lago Menzaleh; y el golfo de Aqaba."
    - "Éxodo dice que Israel salió de Ramesés hacia Sucot y Etam, «á la entrada del desierto», y luego dio la vuelta para acampar «delante de Pihahiroth, entre Migdol y la mar hacia Baalzephón»; allí «hizo Jehová que la mar se retirase por recio viento oriental toda aquella noche». De estos campamentos solo Sucot se sitúa con alguna seguridad, en Tell el-Maskhuta, en el uadi Tumilat, a unos 37 km de Ramesés en línea recta. El mapa sitúa Baal-zefón y Migdol en Tell Defenneh y Tell el-Herr, en el noreste del delta, según una lectura de las fortalezas fronterizas egipcias, pero los nombres podrían pertenecer a la región de los lagos, más al sur."
    - "El golfo de Suez es el emplazamiento tradicional: Josefo lleva allí a Israel por Letópolis, cerca del actual El Cairo, y los peregrinos posteriores lo siguieron; los lagos del istmo concuerdan con el desierto de Shur que sigue y los tres días hasta Mara; las lagunas del norte se apoyan en el culto de Baal-zefón conocido en la costa mediterránea, aunque Éxodo dice que Dios no condujo al pueblo por el camino de los filisteos. El golfo de Aqaba, al que se llegaría tras una marcha por toda la península del Sinaí, se argumenta a partir de 1 Reyes 9:26, que sitúa Ezión-geber en el yam suph, pero pocos estudiosos lo aceptan. El mapa muestra el mar tradicional y enumera las alternativas en la ficha del lugar."
  pt:
    - "O lugar da travessia é disputado, e o próprio mar está em questão: o nome hebraico é yam suph, geralmente entendido como “mar de juncos”, e o Antigo Testamento o usa tanto para o golfo de Suez quanto para o golfo de Aqaba. Dão-se quatro respostas: a extremidade norte do golfo de Suez, onde está o ponto do mapa; os Lagos Amargos ou o lago Timsah, no istmo, por onde corre hoje o canal de Suez; as lagunas do istmo norte, o lago Ballah ou o lago Manzala; e o golfo de Aqaba."
    - "Êxodo diz que Israel partiu de Ramessés para Sucote e Etã, “na beira do deserto”, depois voltou para acampar “diante de Pi-Hairote, entre Migdol e o mar, diante de Baal-Zefom”; ali “o SENHOR fez o mar recuar por um forte vento oriental durante toda a noite”. Desses acampamentos só Sucote é situado com alguma segurança, em Tell el-Maskhuta, no uádi Tumilat, a cerca de 37 km de Ramessés em linha reta. O mapa põe Baal-Zefom e Migdol em Tell Defenneh e Tell el-Herr, no nordeste do Delta, seguindo uma leitura dos fortes de fronteira egípcios, mas os nomes poderiam pertencer à região dos lagos, mais ao sul."
    - "O golfo de Suez é o local tradicional: Josefo leva Israel até lá por Letópolis, perto do Cairo de hoje, e os peregrinos posteriores o seguiram; os lagos do istmo combinam com o deserto de Sur que se segue e os três dias até Mara; as lagunas do norte se apoiam no culto de Baal-Zefom conhecido na costa mediterrânea, embora Êxodo diga que Deus não levou o povo pelo caminho dos filisteus. O golfo de Aqaba, alcançado por uma marcha através de toda a península do Sinai, é defendido a partir de 1 Reis 9:26, que situa Eziom-Geber no yam suph, mas poucos estudiosos o aceitam. O mapa mostra o mar tradicional e lista as alternativas na ficha do lugar."
  de:
    - "Die Stelle des Durchzugs ist umstritten, und schon das Meer selbst ist fraglich: Der hebräische Name ist jam suf, meist als „Schilfmeer“ gedeutet, und das Alte Testament gebraucht ihn sowohl für den Golf von Suez als auch für den Golf von Akaba. Vier Antworten werden gegeben: das Nordende des Golfs von Suez, wo der Kartenpunkt steht; die Bitterseen oder der Timsah-See auf der Landenge, wo heute der Suezkanal verläuft; die Lagunen der nördlichen Landenge, der Ballah-See oder der Menzaleh-See; und der Golf von Akaba."
    - "Im 2. Buch Mose zog Israel von Ramses nach Sukkot und Etam „vorn an der Wüste“, wandte sich dann zurück und lagerte „bei Pihachiroth, zwischen Migdol und dem Meer, gegen Baal-Zephon“; dort „ließ es der HERR hinwegfahren durch einen starken Ostwind die ganze Nacht“. Von diesen Lagern ist nur Sukkot einigermaßen sicher verortet, bei Tell el-Maschuta im Wadi Tumilat, etwa 37 km Luftlinie von Ramses. Die Karte setzt Baal-Zefon und Migdol nach einer Lesart der ägyptischen Grenzfestungen bei Tell Defenne und Tell el-Herr im nordöstlichen Delta an, doch die Namen könnten zur Seenregion weiter südlich gehören."
    - "Der Golf von Suez ist die überlieferte Stätte: Josephus führt Israel über Letopolis nahe dem heutigen Kairo dorthin, und die späteren Pilger folgten ihm; die Seen der Landenge passen zur folgenden Wüste Schur und den drei Tagen nach Mara; die nördlichen Lagunen stützen sich auf den an der Mittelmeerküste bekannten Baal-Zefon-Kult, obwohl Gott nach dem 2. Buch Mose das Volk nicht auf dem Weg der Philister führte. Der Golf von Akaba, nach einem Marsch durch die ganze Sinai-Halbinsel erreicht, wird aus 1. Könige 9,26 begründet, das Ezjon-Geber an das jam suf legt, doch wenige Gelehrte folgen dem. Die Karte zeigt das überlieferte Meer und führt die Alternativen auf der Ortskarte auf."
  fr:
    - "Le lieu de la traversée est discuté, et la mer elle-même est en question : le nom hébreu est yam souph, d’ordinaire compris comme « mer des Roseaux », et l’Ancien Testament l’emploie à la fois pour le golfe de Suez et pour le golfe d’Aqaba. Quatre réponses sont données : l’extrémité nord du golfe de Suez, où se trouve le point de la carte ; les Lacs Amers ou le lac Timsah sur l’isthme, où passe aujourd’hui le canal de Suez ; les lagunes de l’isthme nord, le lac Ballah ou le lac Menzaleh ; et le golfe d’Aqaba."
    - "L’Exode dit qu’Israël quitta Ramsès pour Succoth et Étham, « à l’extrémité du désert », puis fit demi-tour pour camper « devant Pi-Hahiroth, entre Migdol et la mer, vis-à-vis de Baal-Tsephon » ; là « l’Éternel refoula la mer par un vent d’orient, qui souffla avec impétuosité toute la nuit ». De ces campements, seul Succoth est placé avec quelque assurance, à Tell el-Maskhouta, dans le Ouadi Toumilat, à environ 37 km de Ramsès en ligne droite. La carte place Baal-Tsephon et Migdol à Tell Defenneh et Tell el-Herr, dans le nord-est du Delta, suivant une lecture des forts frontières égyptiens, mais les noms pourraient appartenir à la région des lacs, plus au sud."
    - "Le golfe de Suez est le site traditionnel : Josèphe y mène Israël par Létopolis, près du Caire actuel, et les pèlerins postérieurs l’ont suivi ; les lacs de l’isthme conviennent au désert de Schur qui suit et aux trois jours jusqu’à Mara ; les lagunes du nord reposent sur le culte de Baal-Tsephon connu sur la côte méditerranéenne, bien que l’Exode dise que Dieu ne conduisit pas le peuple par le chemin des Philistins. Le golfe d’Aqaba, atteint par une marche à travers toute la péninsule du Sinaï, s’appuie sur 1 Rois 9:26, qui place Étsjon-Guéber sur le yam souph, mais peu de savants l’acceptent. La carte montre la mer traditionnelle et énumère les autres hypothèses sur la fiche du lieu."
