id: where-did-israel-cross-the-red-sea
question:
  en: "Where did Israel cross the Red Sea?"
  ru: "Где Израиль перешёл Чермное море?"
  uk: "Де Ізраїль перейшов Червоне море?"
  es: "¿Dónde cruzó Israel el mar Rojo?"
  pt: "Onde Israel atravessou o mar Vermelho?"
  de: "Wo überquerte Israel das Rote Meer?"
  fr: "Où Israël a-t-il traversé la mer Rouge ?"
  pl: "Gdzie Izrael przeszedł Morze Czerwone?"
  it: "Dove Israele attraversò il Mar Rosso?"
  nl: "Waar stak Israël de Rode Zee over?"
  cs: "Kde Izrael přešel Rudé moře?"
  sv: "Var gick Israel över Sävhavet?"
  nb: "Hvor krysset Israel Rødehavet?"
  tl: "Saan tumawid ang Israel sa Dagat na Pula?"
  da: "Hvor krydsede Israel Det Røde Hav?"
  sr: "Где је Израиљ прешао Црвено море?"
answer:
  en:
    - "The place of the crossing is disputed, and the sea itself is in question: the Hebrew name is yam suph, usually taken to mean “sea of reeds”, and the Old Testament uses it both for the Gulf of Suez and for the Gulf of Aqaba. Four answers are given: the northern end of the Gulf of Suez, where the map point stands; the Bitter Lakes or Lake Timsah on the isthmus, where the Suez Canal now runs; the lagoons of the northern isthmus, Lake Ballah or Lake Menzaleh; and the Gulf of Aqaba."
    - "Exodus says that Israel left Rameses for Succoth and Etham “in the edge of the wilderness”, then turned back to camp “before Pi-hahiroth, between Migdol and the sea, over against Baal-zephon”; there “the LORD caused the sea to go back by a strong east wind all that night”. Of these camps only Succoth is placed with some confidence, at Tell el-Maskhuta in the Wadi Tumilat, about 37 km from Rameses in a straight line. The map puts Baal-zephon and Migdol at Tell Defenneh and Tell el-Herr in the north-eastern Delta, following one reading of the Egyptian frontier forts, but the names could belong to the lakes region further south."
    - "The Gulf of Suez is the traditional site: Josephus leads Israel there by way of Letopolis near today's Cairo, and the later pilgrims followed; the lakes of the isthmus suit the wilderness of Shur that follows and the three days to Marah; the northern lagoons rest on the Baal-zephon cult known at the Mediterranean coast, though Exodus says God did not lead the people by the way of the Philistines. The Gulf of Aqaba, reached by a march across the whole Sinai Peninsula, is argued from 1 Kings 9:26, which places Ezion-geber on the yam suph, but few scholars accept it. The map shows the traditional sea and lists the alternatives on the place card."
  ru:
    - "Место перехода спорно, и само море под вопросом: по-еврейски оно зовётся «ям суф», что обычно понимают как «море тростника», и Ветхий Завет называет так и Суэцкий залив, и залив Акаба. Дают четыре ответа: северный конец Суэцкого залива, где стоит точка на карте; Горькие озёра или озеро Тимсах на перешейке, где теперь проходит Суэцкий канал; лагуны северного перешейка — озеро Балла или Мензала; и залив Акаба."
    - "Исход говорит, что Израиль вышел из Раамсеса в Сокхоф и Ефам, «в конце пустыни», а затем повернул и стал станом «пред Пи-Гахирофом, между Мигдолом и между морем, пред Ваал-Цефоном»; там «гнал Господь море сильным восточным ветром всю ночь». Из этих стоянок с некоторой уверенностью привязан только Сокхоф — Телль-эль-Масхута в Вади-Тумилат, примерно в 37 км от Раамсеса по прямой. Карта ставит Ваал-Цефон и Мигдол у Телль-Дефенне и Телль-эль-Херра на северо-востоке дельты, следуя одному из чтений египетских пограничных крепостей, но эти названия могли относиться и к области озёр южнее."
    - "Суэцкий залив — традиционное место: Иосиф Флавий ведёт туда Израиль через Летополь у нынешнего Каира, и позднейшие паломники шли за ним; озёра перешейка согласуются с пустыней Сур, которая идёт дальше, и с тремя днями пути до Мерры; северные лагуны опираются на культ Ваал-Цефона, известный на средиземноморском берегу, хотя Исход говорит, что Бог не повёл народ дорогой земли Филистимской. Залив Акаба, до которого нужно пройти весь Синайский полуостров, выводят из 3 Царств 9:26, где Ецион-Гавер стоит на «ям суф», но немногие учёные это принимают. Карта показывает традиционное море, а остальные варианты перечисляет в карточке."
  uk:
    - "Місце переходу спірне, і саме море під питанням: єврейська назва — ям суф, яку зазвичай розуміють як «море очерету», і Старий Заповіт вживає її і для Суецької затоки, і для затоки Акаба. Дають чотири відповіді: північний кінець Суецької затоки, де стоїть точка мапи; Гіркі озера чи озеро Тімсах на перешийку, де нині проходить Суецький канал; лагуни північного перешийку, озеро Баллах чи озеро Мензала; і затока Акаба."
    - "Книга Вихід каже, що Ізраїль вирушив із Раамсеса до Сокхоту й Етаму «уз край степу», потім повернув назад, щоб отаборитися «перед Пі-Гахиротом, між Микдолом і морем; перед Бааль-Цефоном отаборитесь навпроти його, при морі»; там «одганяв Господь море геть потужним восточнім вітром у сю ніч». З цих таборів лише Сокхот розміщено з певною впевненістю, у Тель-ель-Мескхуті у Ваді-Тумілаті, приблизно за 37 км від Раамсеса по прямій. Мапа ставить Ваал-Цефон і Мігдол у Тель-Дефенне й Тель-ель-Герр на північному сході дельти, за одним прочитанням єгипетських прикордонних фортець, але ці назви могли б належати району озер далі на південь."
    - "Суецька затока — традиційне місце: Йосиф Флавій веде Ізраїль туди через Летополіс поблизу нинішнього Каїра, і пізніші прочани йшли за ним; озера перешийку пасують до Сурської пустелі, що йде далі, і трьох днів до Мерри; північні лагуни спираються на культ Ваал-Цефона, відомий на середземноморському узбережжі, хоча Книга Вихід каже, що Бог не повів народ дорогою филистимською. Затоку Акаба, до якої треба пройти через увесь Синайський півострів, обстоюють із 1 Цар 9:26, що ставить Еціон-Гевер на ям суф, але мало вчених це приймає. Мапа показує традиційне море й перелічує альтернативи на картці місця."
  es:
    - "El lugar del cruce es discutido, y el propio mar está en cuestión: el nombre hebreo es yam suph, que suele entenderse como «mar de los juncos», y el Antiguo Testamento lo usa tanto para el golfo de Suez como para el golfo de Aqaba. Se dan cuatro respuestas: el extremo norte del golfo de Suez, donde está el punto del mapa; los Lagos Amargos o el lago Timsah, en el istmo, por donde discurre ahora el canal de Suez; las lagunas del istmo septentrional, el lago Ballah o el lago Menzaleh; y el golfo de Aqaba."
    - "Éxodo dice que Israel salió de Ramesés hacia Sucot y Etam, «á la entrada del desierto», y luego dio la vuelta para acampar «delante de Pihahiroth, entre Migdol y la mar hacia Baalzephón»; allí «hizo Jehová que la mar se retirase por recio viento oriental toda aquella noche». De estos campamentos solo Sucot se sitúa con alguna seguridad, en Tell el-Maskhuta, en el uadi Tumilat, a unos 37 km de Ramesés en línea recta. El mapa sitúa Baal-zefón y Migdol en Tell Defenneh y Tell el-Herr, en el noreste del delta, según una lectura de las fortalezas fronterizas egipcias, pero los nombres podrían pertenecer a la región de los lagos, más al sur."
    - "El golfo de Suez es el emplazamiento tradicional: Josefo lleva allí a Israel por Letópolis, cerca del actual El Cairo, y los peregrinos posteriores lo siguieron; los lagos del istmo concuerdan con el desierto de Shur que sigue y los tres días hasta Mara; las lagunas del norte se apoyan en el culto de Baal-zefón conocido en la costa mediterránea, aunque Éxodo dice que Dios no condujo al pueblo por el camino de los filisteos. El golfo de Aqaba, al que se llegaría tras una marcha por toda la península del Sinaí, se argumenta a partir de 1 Reyes 9:26, que sitúa Ezión-geber en el yam suph, pero pocos estudiosos lo aceptan. El mapa muestra el mar tradicional y enumera las alternativas en la ficha del lugar."
  pt:
    - "O lugar da travessia é disputado, e o próprio mar está em questão: o nome hebraico é yam suph, geralmente entendido como “mar de juncos”, e o Antigo Testamento o usa tanto para o golfo de Suez quanto para o golfo de Aqaba. Dão-se quatro respostas: a extremidade norte do golfo de Suez, onde está o ponto do mapa; os Lagos Amargos ou o lago Timsah, no istmo, por onde corre hoje o canal de Suez; as lagunas do istmo norte, o lago Ballah ou o lago Manzala; e o golfo de Aqaba."
    - "Êxodo diz que Israel partiu de Ramessés para Sucote e Etã, “na beira do deserto”, depois voltou para acampar “diante de Pi-Hairote, entre Migdol e o mar, diante de Baal-Zefom”; ali “o SENHOR fez o mar recuar por um forte vento oriental durante toda a noite”. Desses acampamentos só Sucote é situado com alguma segurança, em Tell el-Maskhuta, no uádi Tumilat, a cerca de 37 km de Ramessés em linha reta. O mapa põe Baal-Zefom e Migdol em Tell Defenneh e Tell el-Herr, no nordeste do Delta, seguindo uma leitura dos fortes de fronteira egípcios, mas os nomes poderiam pertencer à região dos lagos, mais ao sul."
    - "O golfo de Suez é o local tradicional: Josefo leva Israel até lá por Letópolis, perto do Cairo de hoje, e os peregrinos posteriores o seguiram; os lagos do istmo combinam com o deserto de Sur que se segue e os três dias até Mara; as lagunas do norte se apoiam no culto de Baal-Zefom conhecido na costa mediterrânea, embora Êxodo diga que Deus não levou o povo pelo caminho dos filisteus. O golfo de Aqaba, alcançado por uma marcha através de toda a península do Sinai, é defendido a partir de 1 Reis 9:26, que situa Eziom-Geber no yam suph, mas poucos estudiosos o aceitam. O mapa mostra o mar tradicional e lista as alternativas na ficha do lugar."
  de:
    - "Die Stelle des Durchzugs ist umstritten, und schon das Meer selbst ist fraglich: Der hebräische Name ist jam suf, meist als „Schilfmeer“ gedeutet, und das Alte Testament gebraucht ihn sowohl für den Golf von Suez als auch für den Golf von Akaba. Vier Antworten werden gegeben: das Nordende des Golfs von Suez, wo der Kartenpunkt steht; die Bitterseen oder der Timsah-See auf der Landenge, wo heute der Suezkanal verläuft; die Lagunen der nördlichen Landenge, der Ballah-See oder der Menzaleh-See; und der Golf von Akaba."
    - "Im 2. Buch Mose zog Israel von Ramses nach Sukkot und Etam „vorn an der Wüste“, wandte sich dann zurück und lagerte „bei Pihachiroth, zwischen Migdol und dem Meer, gegen Baal-Zephon“; dort „ließ es der HERR hinwegfahren durch einen starken Ostwind die ganze Nacht“. Von diesen Lagern ist nur Sukkot einigermaßen sicher verortet, bei Tell el-Maschuta im Wadi Tumilat, etwa 37 km Luftlinie von Ramses. Die Karte setzt Baal-Zefon und Migdol nach einer Lesart der ägyptischen Grenzfestungen bei Tell Defenne und Tell el-Herr im nordöstlichen Delta an, doch die Namen könnten zur Seenregion weiter südlich gehören."
    - "Der Golf von Suez ist die überlieferte Stätte: Josephus führt Israel über Letopolis nahe dem heutigen Kairo dorthin, und die späteren Pilger folgten ihm; die Seen der Landenge passen zur folgenden Wüste Schur und den drei Tagen nach Mara; die nördlichen Lagunen stützen sich auf den an der Mittelmeerküste bekannten Baal-Zefon-Kult, obwohl Gott nach dem 2. Buch Mose das Volk nicht auf dem Weg der Philister führte. Der Golf von Akaba, nach einem Marsch durch die ganze Sinai-Halbinsel erreicht, wird aus 1. Könige 9,26 begründet, das Ezjon-Geber an das jam suf legt, doch wenige Gelehrte folgen dem. Die Karte zeigt das überlieferte Meer und führt die Alternativen auf der Ortskarte auf."
  fr:
    - "Le lieu de la traversée est discuté, et la mer elle-même est en question : le nom hébreu est yam souph, d’ordinaire compris comme « mer des Roseaux », et l’Ancien Testament l’emploie à la fois pour le golfe de Suez et pour le golfe d’Aqaba. Quatre réponses sont données : l’extrémité nord du golfe de Suez, où se trouve le point de la carte ; les Lacs Amers ou le lac Timsah sur l’isthme, où passe aujourd’hui le canal de Suez ; les lagunes de l’isthme nord, le lac Ballah ou le lac Menzaleh ; et le golfe d’Aqaba."
    - "L’Exode dit qu’Israël quitta Ramsès pour Succoth et Étham, « à l’extrémité du désert », puis fit demi-tour pour camper « devant Pi-Hahiroth, entre Migdol et la mer, vis-à-vis de Baal-Tsephon » ; là « l’Éternel refoula la mer par un vent d’orient, qui souffla avec impétuosité toute la nuit ». De ces campements, seul Succoth est placé avec quelque assurance, à Tell el-Maskhouta, dans le Ouadi Toumilat, à environ 37 km de Ramsès en ligne droite. La carte place Baal-Tsephon et Migdol à Tell Defenneh et Tell el-Herr, dans le nord-est du Delta, suivant une lecture des forts frontières égyptiens, mais les noms pourraient appartenir à la région des lacs, plus au sud."
    - "Le golfe de Suez est le site traditionnel : Josèphe y mène Israël par Létopolis, près du Caire actuel, et les pèlerins postérieurs l’ont suivi ; les lacs de l’isthme conviennent au désert de Schur qui suit et aux trois jours jusqu’à Mara ; les lagunes du nord reposent sur le culte de Baal-Tsephon connu sur la côte méditerranéenne, bien que l’Exode dise que Dieu ne conduisit pas le peuple par le chemin des Philistins. Le golfe d’Aqaba, atteint par une marche à travers toute la péninsule du Sinaï, s’appuie sur 1 Rois 9:26, qui place Étsjon-Guéber sur le yam souph, mais peu de savants l’acceptent. La carte montre la mer traditionnelle et énumère les autres hypothèses sur la fiche du lieu."
  pl:
    - "Miejsce przeprawy jest sporne i sporne jest samo morze: hebrajska nazwa to jam suf, zwykle rozumiana jako „morze trzcin”, a Stary Testament używa jej zarówno dla Zatoki Sueskiej, jak i Zatoki Akaba. Podaje się cztery odpowiedzi: północny kraniec Zatoki Sueskiej, gdzie stoi punkt na mapie; Jeziora Gorzkie lub jezioro Timsah na przesmyku, gdzie dziś biegnie Kanał Sueski; laguny północnego przesmyku, jezioro Ballah lub Manzala; i Zatokę Akaba."
    - "Księga Wyjścia mówi, że Izrael wyszedł z Ramses do Sukkot i Etam, „na końcu puszczy”, potem zawrócił i rozłożył się obozem „przed Fihahirot między Migdoł, i między morzem, przeciw Baalsefon”; tam „Pan rozpędził morze wiatrem wschodnim gwałtownie wiejącym przez całą noc”. Z tych obozów tylko Sukkot umieszcza się z dość dużą pewnością, w Tell el-Maskhuta w Wadi Tumilat, około 37 km od Ramses w linii prostej. Mapa umieszcza Baal-Sefon i Migdol w Tell Defenneh i Tell el-Herr w północno-wschodniej Delcie, idąc za jednym odczytaniem egipskich fortów granicznych, ale nazwy mogą należeć do rejonu jezior dalej na południu."
    - "Zatoka Sueska jest miejscem tradycyjnym: Józef Flawiusz prowadzi tam Izraela przez Letopolis koło dzisiejszego Kairu, a późniejsi pielgrzymi szli za nim; jeziora przesmyku pasują do następującej potem pustyni Szur i trzech dni do Mara; laguny północne opierają się na kulcie Baal-Sefona znanym na wybrzeżu Morza Śródziemnego, choć Księga Wyjścia mówi, że Bóg nie poprowadził ludu drogą filistyńską. Zatoka Akaba, do której dochodzi się marszem przez cały Półwysep Synaj, jest uzasadniana 1 Księgą Królewską 9,26, która umieszcza Esjon-Geber nad jam suf, ale niewielu uczonych to przyjmuje. Mapa pokazuje morze tradycyjne i wymienia alternatywy na karcie miejsca."
  it:
    - "Il luogo dell’attraversamento è discusso, e lo è lo stesso mare: il nome ebraico è yam suf, di solito inteso «mare delle canne», e l’Antico Testamento lo usa sia per il golfo di Suez sia per il golfo di Aqaba. Si danno quattro risposte: l’estremità settentrionale del golfo di Suez, dove si trova il punto della mappa; i Laghi Amari o il lago Timsah sull’istmo, dove ora corre il canale di Suez; le lagune dell’istmo settentrionale, il lago Ballah o il lago Manzala; e il golfo di Aqaba."
    - "L’Esodo dice che Israele lasciò Ramses per Succot ed Etam «all’estremità del deserto», poi tornò indietro per accamparsi «di rimpetto a Pi-Hahiroth, fra Migdol e il mare, di fronte a Baal-Tsefon»; là «l’Eterno fece ritirare il mare mediante un gagliardo vento orientale durato tutta la notte». Di questi accampamenti solo Succot è collocato con una certa sicurezza, a Tell el-Maskhuta nel Wadi Tumilat, a circa 37 km da Ramses in linea retta. La mappa pone Baal-Zefon e Migdol a Tell Defenneh e Tell el-Herr nel Delta nord-orientale, seguendo una lettura delle fortezze di frontiera egizie, ma i nomi potrebbero appartenere alla regione dei laghi più a sud."
    - "Il golfo di Suez è il luogo tradizionale: Giuseppe Flavio vi conduce Israele passando per Letopoli, vicino all’odierno Cairo, e i pellegrini successivi lo seguirono; i laghi dell’istmo si accordano con il deserto di Sur che segue e con i tre giorni fino a Mara; le lagune settentrionali poggiano sul culto di Baal-Zefon noto sulla costa mediterranea, benché l’Esodo dica che Dio non condusse il popolo per la via dei Filistei. Il golfo di Aqaba, raggiunto con una marcia attraverso l’intera penisola del Sinai, si sostiene da 1 Re 9,26, che pone Ezion-Gheber sullo yam suf, ma pochi studiosi lo accettano. La mappa mostra il mare tradizionale ed elenca le alternative sulla scheda del luogo."
  nl:
    - "De plaats van de doortocht is omstreden, en de zee zelf staat ter discussie: de Hebreeuwse naam is jam soef, gewoonlijk opgevat als “Rietzee”, en het Oude Testament gebruikt hem zowel voor de Golf van Suez als voor de Golf van Aqaba. Vier antwoorden worden gegeven: het noordelijke einde van de Golf van Suez, waar het punt op de kaart staat; de Bittermeren of het Timsahmeer op de landengte, waar nu het Suezkanaal loopt; de lagunes van de noordelijke landengte, het Ballahmeer of het Menzalehmeer; en de Golf van Aqaba."
    - "Exodus zegt dat Israël uit Raämses naar Sukkot en Etam vertrok, “aan het einde der woestijn”, en toen terugkeerde om te kamperen “voor Pi-Hachiroth, tussen Migdol en tussen de zee, voor Baal-Zefon”; daar “deed de HEERE de zee weggaan, door een sterken oostenwind, dien gansen nacht”. Van deze kampen wordt alleen Sukkot met enige zekerheid geplaatst, bij Tell el-Maskhuta in de Wadi Tumilat, hemelsbreed ongeveer 37 km van Raämses. De kaart plaatst Baäl-Zefon en Migdol bij Tell Defenneh en Tell el-Herr in de noordoostelijke Delta, volgens één lezing van de Egyptische grensforten, maar de namen kunnen horen bij het merengebied verder naar het zuiden."
    - "De Golf van Suez is de traditionele plek: Josephus voert Israël er heen via Letopolis nabij het huidige Caïro, en de latere pelgrims volgden hem; de meren van de landengte passen bij de woestijn Sur die volgt en de drie dagen naar Mara; de noordelijke lagunes steunen op de cultus van Baäl-Zefon die aan de Middellandse Zeekust bekend is, al zegt Exodus dat God het volk niet leidde langs de weg van de Filistijnen. De Golf van Aqaba, bereikt na een tocht over het hele Sinaï-schiereiland, wordt verdedigd vanuit 1 Koningen 9:26, dat Ezeon-Geber aan de jam soef plaatst, maar weinig geleerden aanvaarden dat. De kaart toont de traditionele zee en noemt de alternatieven op de plaatskaart."
  cs:
    - "Místo přechodu je sporné a sporné je i samo moře: hebrejský název je jam súf, obvykle chápaný jako „rákosové moře“, a Starý zákon jej užívá pro Suezský záliv i pro Akabský záliv. Podávají se čtyři odpovědi: severní konec Suezského zálivu, kde stojí bod na mapě; Hořká jezera nebo jezero Timsáh na šíji, kudy dnes vede Suezský kanál; laguny severní šíje, jezero Balláh či Manzala; a Akabský záliv."
    - "Exodus říká, že Izrael vyšel z Ramesse do Sukotu a Etamu „při kraji pouště“, pak se obrátil zpět a utábořil „před Fiarot, mezi Magdalem a mořem, proti Belsefon“; tam „Hospodin rozdělil moře větrem východním prudce vějícím přes celou noc“. Z těchto táborů je s jistou důvěrou umístěn jen Sukot, v Tell al-Maskhúta ve Wádí Tumílát, asi 37 km od Ramesse vzdušnou čarou. Mapa klade Báal-cefón a Migdol do Tell Defenne a Tell al-Herr v severovýchodní deltě podle jednoho čtení egyptských pohraničních pevností, ale jména by mohla patřit oblasti jezer dále na jih."
    - "Suezský záliv je tradiční místo: Josephus Flavius tam vede Izrael přes Letopolis poblíž dnešní Káhiry a pozdější poutníci ho následovali; jezera šíje odpovídají následující poušti Šur a třem dnům do Máry; severní laguny stojí na kultu Báal-cefóna známém na středomořském pobřeží, ač Exodus říká, že Bůh lid nevedl cestou Pelištejců. Akabský záliv, dosažený pochodem přes celý Sinajský poloostrov, se hájí z 1Kr 9,26, který klade Ecjon-geber na jam súf, ale málokterý badatel jej přijímá. Mapa ukazuje tradiční moře a alternativy uvádí na kartě místa."
  sv:
    - "Platsen för övergången är omstridd, och själva havet är ifrågasatt: det hebreiska namnet är yam suph, vanligen tolkat som ”Sävhavet”, och Gamla testamentet använder det både för Suezviken och för Aqabaviken. Fyra svar ges: norra änden av Suezviken, där kartpunkten står; Bittersjöarna eller Timsahsjön på näset, där Suezkanalen nu går; lagunerna på norra näset, Ballahsjön eller Menzalehsjön; och Aqabaviken."
    - "2 Mosebok säger att Israel bröt upp från Rameses till Suckot och Etam, ”där öknen begynte”, och sedan vände om för att lägra sig ”framför Pi-Hahirot, mellan Migdol och havet; mitt framför Baal-Sefon”; där ”drev HERREN undan havet genom en stark östanvind som blåste hela natten”. Av dessa läger är bara Suckot placerat med viss säkerhet, vid Tell el-Maskhuta i Wadi Tumilat, omkring 37 km från Rameses fågelvägen. Kartan placerar Baal-Sefon och Migdol vid Tell Defenneh och Tell el-Herr i nordöstra deltat, efter en läsning av de egyptiska gränsfästningarna, men namnen kan höra till sjöområdet längre söderut."
    - "Suezviken är den traditionella platsen: Josefus leder Israel dit via Letopolis nära dagens Kairo, och senare pilgrimer följde honom; sjöarna på näset passar den därpå följande Shurs öken och de tre dagarna till Mara; de norra lagunerna vilar på Baal-Sefon-kulten som är känd vid Medelhavskusten, fast 2 Mosebok säger att Gud inte förde folket vägen genom filistéernas land. Aqabaviken, nådd genom en marsch över hela Sinaihalvön, argumenteras utifrån 1 Kung 9:26, som förlägger Esjon-Geber vid yam suph, men få forskare godtar det. Kartan visar det traditionella havet och förtecknar alternativen på platskortet."
  nb:
    - "Stedet for kryssingen er omstridt, og selve havet er i tvil: det hebraiske navnet er yam suph, vanligvis forstått som «sivhavet», og Det gamle testamente bruker det både om Suezbukta og om Akababukta. Fire svar gis: den nordlige enden av Suezbukta, der kartpunktet står; Bitre sjøer eller Timsah-sjøen på landtangen, der Suezkanalen nå går; lagunene på den nordlige landtangen, Ballah-sjøen eller Menzaleh-sjøen; og Akababukta."
    - "2 Mosebok sier at Israel forlot Ramses for Sukkot og Etam «ved grensen av ørkenen», og så vendte om og slo leir «foran Pi-Hakirot, mellem Migdol og havet; midt imot Ba'al-Sefon»; der heter det at «Herren drev havet bort med en sterk østenvind, som blåste hele natten». Av disse leirplassene er bare Sukkot plassert med noen sikkerhet, ved Tell el-Maskhuta i Wadi Tumilat, omtrent 37 km fra Ramses i luftlinje. Kartet plasserer Baal-Sefon og Migdol ved Tell Defenneh og Tell el-Herr i det nordøstlige deltaet, etter én lesning av de egyptiske grensefestningene, men navnene kan høre til sjøregionen lenger sør."
    - "Suezbukta er det tradisjonelle stedet: Josefus fører Israel dit via Letopolis nær dagens Kairo, og de senere pilegrimene fulgte etter; sjøene på landtangen passer med Sjur-ørkenen som følger og de tre dagene til Mara; de nordlige lagunene hviler på Baal-Sefon-kulten kjent fra Middelhavskysten, selv om 2 Mosebok sier at Gud ikke førte folket veien om filisterne. Akababukta, nådd ved en marsj tvers over hele Sinai-halvøya, argumenteres for ut fra 1 Kong 9,26, som plasserer Esjon-Geber ved yam suph, men få forskere godtar det. Kartet viser det tradisjonelle havet og lister alternativene på stedskortet."
  tl:
    - "Pinagtatalunan ang lugar ng pagtawid, at pinag-aalinlanganan ang dagat mismo: ang pangalang Hebreo ay yam suph, na karaniwang kinukuhang “dagat ng mga tambo”, at ginagamit ito ng Matandang Tipan para sa Golpo ng Suez at para sa Golpo ng Aqaba. Apat ang ibinibigay na sagot: ang hilagang dulo ng Golpo ng Suez, kung saan nakatayo ang tuldok sa mapa; ang Mapait na mga Lawa o Lawa ng Timsah sa isthmus, kung saan dumaraan ngayon ang Kanal ng Suez; ang mga lagoon ng hilagang isthmus, Lawa ng Ballah o Lawa ng Menzaleh; at ang Golpo ng Aqaba."
    - "Sinasabi ng Exodo na umalis ang Israel sa Rameses patungong Succoth at Etham “sa hangganan ng ilang”, pagkatapos ay bumalik at nagkampo “sa tapat ng Pi-hahiroth, sa pagitan ng Migdol at ng dagat, sa tapat ng Baalzephon”; doon “pinaghiwalay ng Panginoon ang dagat sa pamamagitan ng isang malakas na hanging silanganan ng buong magdamag”. Sa mga kampong ito, ang Succoth lamang ang nailalagay nang may kaunting katiyakan, sa Tell el-Maskhuta sa Wadi Tumilat, mga 37 km mula sa Rameses sa tuwid na guhit. Inilalagay ng mapa ang Baalzephon at Migdol sa Tell Defenneh at Tell el-Herr sa hilagang-silangang Delta, ayon sa isang pagbasa ng mga kuta sa hangganan ng Egipto, ngunit maaaring nabibilang ang mga pangalan sa rehiyon ng mga lawa sa mas timog."
    - "Ang Golpo ng Suez ang tradisyonal na lugar: inaakay ni Josephus ang Israel doon sa pamamagitan ng Letopolis malapit sa Cairo ngayon, at sinundan ito ng mga huling peregrino; angkop ang mga lawa ng isthmus sa ilang ng Shur na sumusunod at sa tatlong araw hanggang sa Mara; nakasalalay ang mga lagoon sa hilaga sa kultong Baalzephon na kilala sa baybayin ng Mediteraneo, bagaman sinasabi ng Exodo na hindi inakay ng Dios ang bayan sa daan ng mga Filisteo. Ang Golpo ng Aqaba, na naaabot sa pagmartsa sa buong Tangway ng Sinai, ay ipinagtatanggol mula sa 1 Mga Hari 9:26, na naglalagay ng Esion-geber sa yam suph, ngunit kakaunting iskolar ang tumatanggap dito. Ipinakikita ng mapa ang tradisyonal na dagat at inililista ang mga alternatibo sa kard ng lugar."
  da:
    - "Stedet for overgangen er omstridt, og selve havet er i tvivl: det hebraiske navn er yam suph, sædvanligvis taget til at betyde »Sivhavet«, og Det Gamle Testamente bruger det både om Suezbugten og om Aqababugten. Fire svar gives: den nordlige ende af Suezbugten, hvor kortets punkt står; Bittersøerne eller Timsah-søen på næsset, hvor Suezkanalen nu løber; lagunerne på det nordlige næs, Ballah-søen eller Menzala-søen; og Aqababugten."
    - "Anden Mosebog siger, at Israel forlod Ramses til Sukkot og Etam »paa Grænsen af Ørken«, derefter vendte om og slog lejr »for Pi-Hakiroth, imellem Migdol og Havet, tvært over for Baal-Zefon«; dér »Herren lod Havet fare bort ved et stærkt Østenvejr den ganske Nat«. Af disse lejre er kun Sukkot placeret med nogen sikkerhed, ved Tell el-Maskhuta i Wadi Tumilat, omkring 37 km fra Ramses i luftlinje. Kortet placerer Ba'al-Sefon og Migdol ved Tell Defenneh og Tell el-Herr i det nordøstlige Delta, efter én læsning af de egyptiske grænsefæstninger, men navnene kan høre til søområdet længere mod syd."
    - "Suezbugten er det traditionelle sted: Josefus fører Israel dertil via Letopolis nær nutidens Kairo, og de senere pilgrimme fulgte efter; næssets søer passer til Sjurs ørken, der følger, og de tre dage til Mara; de nordlige laguner hviler på Ba'al-Sefon-kulten, kendt ved Middelhavskysten, selv om Anden Mosebog siger, at Gud ikke førte folket ad filisternes vej. Aqababugten, nået ved en march over hele Sinaihalvøen, argumenteres ud fra 1 Kong 9,26, som placerer Esjon-Geber ved yam suph, men få forskere accepterer det. Kortet viser det traditionelle hav og opregner alternativerne på stedets kort."
  sr:
    - "Место прелаза је спорно, а спорно је и само море: хебрејско име јам суф обично се узима као „трстиково море“, а Стари завет га користи и за Суецки и за Акапски залив. Дају се четири одговора: северни крај Суецког залива, где стоји тачка на карти; Горка језера или језеро Тимсах на превлаци, где сада тече Суецки канал; лагуне северне превлаке, језеро Бала или језеро Мензала; и Акапски залив."
    - "Излазак каже да је Израиљ кренуо из Рамесе у Сокот и Етам, „накрај пустиње“, затим се вратио да се улогори „пред Пи-Аирот између Мигдола и мора према Вел-Сефону“; тамо „Господ узби море ветром источним, који јако дуваше целу ноћ“. Од ових логора само је Сокот са неком сигурношћу смештен, у Тел ел Маскути у Вади Тумилату, око 37 км од Рамесе правом линијом. Карта поставља Вел-Сефон и Мигдол у Тел Дефену и Тел ел Хер у североисточној делти, следећи једно читање египатских пограничних тврђава, али имена могу припадати подручју језера даље на југу."
    - "Суецки залив је традиционално место: Јосиф Флавије води Израиљ тамо преко Летополиса близу данашњег Каира, а касније су га следили ходочасници; језера превлаке одговарају пустињи Сур која следи и три дана до Мере; северне лагуне почивају на култу Вел-Сефона познатом на медитеранској обали, мада Излазак каже да Бог није водио народ путем Филистеја. Акапски залив, до кога се стиже маршем преко целог Синајског полуострва, заступа се на основу Прве књиге о царевима 9,26, која Есион-Гавер смешта на јам суф, али то мало научника прихвата. Карта приказује традиционално море, а алтернативе наводи на картици места."
