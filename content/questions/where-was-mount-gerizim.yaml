id: where-was-mount-gerizim
question:
  en: "Where is Mount Gerizim, the mountain of blessing?"
  ru: "Где находится гора Гаризим, гора благословения?"
  uk: "Де міститься гора Гарізім, гора благословення?"
  es: "¿Dónde está el monte Gerizim, el monte de la bendición?"
  pt: "Onde fica o monte Gerizim, o monte da bênção?"
  de: "Wo liegt der Garizim, der Berg des Segens?"
  fr: "Où se trouve le mont Garizim, la montagne de la bénédiction ?"
  pl: "Gdzie leży Góra Garizim, góra błogosławieństwa?"
  it: "Dov’è il Monte Garizim, il monte della benedizione?"
  cs: "Kde je hora Gerizim, hora požehnání?"
  nl: "Waar ligt de berg Gerizim, de berg van de zegen?"
  sv: "Var ligger berget Gerisim, välsignelsens berg?"
  nb: "Hvor ligger Garisim, velsignelsens fjell?"
  tl: "Nasaan ang Bundok Gerizim, ang bundok ng pagpapala?"
  da: "Hvor ligger Garizim, velsignelsens bjerg?"
  sr: "Где је гора Гаризим, гора благослова?"
answer:
  en:
    - "Mount Gerizim is the mountain on the south side of the pass of Shechem, above the city of Nablus in the West Bank, about 47 km north of Jerusalem in a straight line; Mount Ebal faces it across the narrow valley on the north. The map's points for the two summits are about 3.8 km apart, and the mound of ancient Shechem lies at Gerizim's north-eastern foot, about 1.8 km from its summit. History Globe already answers who the Samaritans were, whose holy mountain it is, and has an article on Gerizim; this answer is about the place and the ceremony of blessing and curse."
    - "Moses tied the two mountains to the entry into the land: “thou shalt put the blessing upon mount Gerizim, and the curse upon mount Ebal”, and he located them “beside the plains of Moreh”, the oak of Moreh at Shechem where Abraham had camped. Six tribes were to “stand upon mount Gerizim to bless the people”, Simeon, Levi, Judah, Issachar, Joseph and Benjamin, and six on Ebal to curse. Joshua carried it out with “half of them over against mount Gerizim, and half of them over against mount Ebal”, the ark and the Levites in the valley between. Later Jotham “stood in the top of mount Gerizim, and lifted up his voice, and cried” his fable of the trees to the men of Shechem below."
    - "Askar, usually taken for Sychar, lies at the same foot, about 2.5 km from the summit in a straight line, with Jacob's well nearby, where the Samaritan woman could point up at the mountain: “Our fathers worshipped in this mountain”. Where Joshua's ceremony stood is not marked; the map's year follows the early date for the conquest, about 1406 BC, while many scholars place it in the thirteenth century BC or doubt that it can be dated. In the Samaritan Pentateuch Gerizim, not Ebal, is the mountain of the altar in Deuteronomy 27:4. Today the summit, Jebel et-Tur, rises to 881 m, with the Samaritan village of Kiryat Luza on its slope and the ruins of the Samaritan temple and of Zeno's church at the top."
  ru:
    - "Гора Гаризим — гора на южной стороне Сихемского перевала, над городом Наблусом на Западном берегу, примерно в 47 км к северу от Иерусалима по прямой; напротив неё, через узкую долину к северу, стоит гора Гевал. Точки карты для двух вершин отстоят друг от друга примерно на 3,8 км, а холм древнего Сихема лежит у северо-восточного подножия Гаризима, примерно в 1,8 км от вершины. В History Globe уже есть ответ о самарянах, для которых это святая гора, и статья о Гаризиме; здесь ответ о самом месте и об обряде благословения и проклятия."
    - "Моисей связал обе горы со вступлением в землю: «произнеси благословение на горе Гаризим, а проклятие на горе Гевал», и указал их место — «близ дубравы Море», у Сихема, где когда-то стоял Аврам. Шесть колен — Симеон, Левий, Иуда, Иссахар, Иосиф и Вениамин — «должны стать на горе Гаризим, чтобы благословлять народ», а шесть — на Гевале, чтобы произносить проклятие. Иисус Навин исполнил это: «одна половина их у горы Гаризим, а другая половина у горы Гевал», а ковчег и левиты — в долине между ними. Позднее Иофам «стал на вершине горы Гаризима и, возвысив голос свой, кричал» жителям Сихема внизу свою притчу о деревьях."
    - "У того же подножия, примерно в 2,5 км от вершины по прямой, лежит Аскар, который обычно считают Сихарем, а рядом — колодец Иакова; там самарянка могла указать на гору: «Отцы наши поклонялись на этой горе». Место обряда Иисуса Навина не отмечено; год карты следует ранней датировке завоевания, около 1406 г. до н. э., тогда как многие учёные относят его к XIII веку до н. э. или считают, что датировать его нельзя. В самарянском Пятикнижии гора жертвенника во Второзаконии 27:4 — Гаризим, а не Гевал. Сегодня вершина, Джебель-эт-Тур, поднимается на 881 м; на склоне — самарянское селение Кирьят-Луза, на вершине — развалины самарянского храма и церкви Зенона."
  uk:
    - "Гора Гарізім — гора на південному боці Сихемського перевалу, над містом Наблус на Західному березі Йордану, приблизно за 47 км на північ від Єрусалима по прямій; гора Гевал стоїть навпроти неї через вузьку долину на півночі. Точки двох вершин на мапі розташовані приблизно за 3,8 км одна від одної, а пагорб давнього Сихема лежить біля північно-східного підніжжя Гарізіма, приблизно за 1,8 км від його вершини. «Історичний глобус» уже відповідає, хто такі самаряни, чия це свята гора, і має статтю про Гарізім; ця відповідь — про місце й обряд благословення та прокляття."
    - "Мойсей пов'язав дві гори зі вступом у землю: «принеси благословеннє на Геризім горі а прокляттє на Ебаль горі», і він розмістив їх «коло дубрави Море», біля мореського дуба в Сихемі, де отаборився Авраам. Шість колін мали «стати на Геризим горі, щоб людей благословити»: Симеон, Левій, Юда, Іссахар, Йосиф і Веніямин, а шість на Гевалі — проклинати. Ісус Навин виконав це, і «одна половина їх навпроти Гарисим гори, а друга половина навпроти Гебал гори», а ковчег і левіти — в долині між ними. Пізніше Йотам «взійшов ... на верх гори Гарисим, і покликнув голосно» свою байку про дерева до сихемців унизу."
    - "Аскар, який зазвичай вважають Сихаром, лежить біля того самого підніжжя, приблизно за 2,5 км від вершини по прямій, а поруч — колодязь Якова, звідки самарянка могла вказати на гору: «Батьки наші на сїй горі покланялись». Де стояв обряд Ісуса Навина — не позначено; рік на мапі відповідає ранній даті завоювання, близько 1406 р. до н. е., тоді як багато вчених відносять його до XIII ст. до н. е. або сумніваються, що його можна датувати. У Самаритянському П'ятикнижжі Гарізім, а не Гевал, — гора жертовника в Повторенні Закону 27:4. Нині вершина, Джебель-ет-Тур, здіймається до 881 м, із самаритянським селом Кір'ят-Лоза на схилі та руїнами самаритянського храму й церкви Зенона нагорі."
  es:
    - "El monte Gerizim es la montaña del lado sur del paso de Siquem, sobre la ciudad de Nablus, en Cisjordania, a unos 47 km al norte de Jerusalén en línea recta; el monte Ebal le queda enfrente, al otro lado del estrecho valle, al norte. Los puntos del mapa para las dos cumbres distan unos 3,8 km, y el montículo de la antigua Siquem se halla en la falda nororiental del Gerizim, a unos 1,8 km de su cima. History Globe ya responde quiénes eran los samaritanos y de quiénes es la montaña santa, y tiene un artículo sobre el Gerizim; esta respuesta trata del lugar y de la ceremonia de la bendición y la maldición."
    - "Moisés vinculó las dos montañas con la entrada en la tierra: «pondrás la bendición sobre el monte Gerizim, y la maldición sobre el monte Ebal», y las situó «junto á los llanos de Moreh», la encina de Moré, en Siquem, donde Abraham había acampado. Seis tribus, dijo Moisés, «estarán sobre el monte de Gerizim para bendecir al pueblo»: Simeón, Leví, Judá, Isacar, José y Benjamín; y seis sobre el Ebal para maldecir. Josué lo cumplió con «la mitad de ellos estaba hacia el monte de Gerizim, y la otra mitad hacia el monte de Ebal», y el arca y los levitas en el valle de en medio. Más tarde Jotam «púsose en la cumbre del monte de Gerizim, y alzando su voz clamó» su fábula de los árboles a los hombres de Siquem, abajo."
    - "Askar, que por lo común se toma por Sicar, está al pie del mismo monte, a unos 2,5 km de la cima en línea recta, con el pozo de Jacob cerca, desde donde la samaritana podía señalar hacia la montaña: «Nuestros padres adoraron en este monte». No se marca dónde tuvo lugar la ceremonia de Josué; el año del mapa sigue la fecha temprana de la conquista, hacia 1406 a. C., mientras que muchos estudiosos la sitúan en el siglo XIII a. C. o dudan de que pueda fecharse. En el Pentateuco samaritano, el Gerizim, y no el Ebal, es el monte del altar en Deuteronomio 27:4. Hoy la cima, Jebel et-Tur, se eleva a 881 m, con la aldea samaritana de Kiryat Luza en su ladera y las ruinas del templo samaritano y de la iglesia de Zenón en lo alto."
  pt:
    - "O monte Gerizim é a montanha no lado sul da passagem de Siquém, acima da cidade de Nablus, na Cisjordânia, a cerca de 47 km ao norte de Jerusalém em linha reta; o monte Ebal fica defronte dele, do outro lado do estreito vale, ao norte. Os pontos do mapa para os dois cumes distam cerca de 3,8 km um do outro, e o monte da antiga Siquém fica no sopé nordeste do Gerizim, a cerca de 1,8 km do seu cume. O History Globe já responde quem eram os samaritanos, de quem é o monte sagrado, e tem um artigo sobre o Gerizim; esta resposta trata do lugar e da cerimônia da bênção e da maldição."
    - "Moisés ligou os dois montes à entrada na terra: “vocês colocarão a bênção sobre o monte Gerizim, e a maldição sobre o monte Ebal”, e os situou “junto aos carvalhos de Moré”, o carvalho de Moré em Siquém, onde Abraão havia acampado. Seis tribos deviam ficar “no monte Gerizim para abençoar o povo”, Simeão, Levi, Judá, Issacar, José e Benjamim, e seis no Ebal para amaldiçoar. Josué a executou com “metade deles em frente ao monte Gerizim, e a outra metade em frente ao monte Ebal”, a arca e os levitas no vale entre eles. Mais tarde, Jotão “ficou no topo do monte Gerizim e, levantando a voz, clamou” a sua fábula das árvores aos homens de Siquém, lá embaixo."
    - "Askar, geralmente tomada por Sicar, fica no mesmo sopé, a cerca de 2,5 km do cume em linha reta, com o poço de Jacó nas proximidades, de onde a mulher samaritana podia apontar para o monte: “Nossos pais adoraram neste monte”. O lugar onde se realizou a cerimônia de Josué não está assinalado; o ano do mapa segue a data alta da conquista, por volta de 1406 a.C., enquanto muitos estudiosos a situam no século XIII a.C. ou duvidam de que possa ser datada. No Pentateuco Samaritano, o Gerizim, e não o Ebal, é o monte do altar em Deuteronômio 27:4. Hoje o cume, Jebel et-Tur, ergue-se a 881 m, com a aldeia samaritana de Kiryat Luza em sua encosta e, no alto, as ruínas do templo samaritano e da igreja de Zenão."
  de:
    - "Der Garizim ist der Berg auf der Südseite des Passes von Sichem, über der Stadt Nablus im Westjordanland, in der Luftlinie etwa 47 km nördlich von Jerusalem; der Ebal liegt ihm jenseits des schmalen Tals im Norden gegenüber. Die Kartenpunkte der beiden Gipfel sind etwa 3,8 km voneinander entfernt, und der Hügel des antiken Sichem liegt am nordöstlichen Fuß des Garizim, etwa 1,8 km von dessen Gipfel. History Globe beantwortet bereits, wer die Samaritaner waren, deren heiliger Berg er ist, und hat einen Artikel über den Garizim; diese Antwort handelt vom Ort und von der Zeremonie von Segen und Fluch."
    - "Mose band die beiden Berge an den Einzug ins Land: „so sollst du den Segen sprechen lassen auf dem Berge Garizim und den Fluch auf dem Berge Ebal“, und er verortete sie „bei dem Hain More“, der Eiche More bei Sichem, wo Abraham gelagert hatte. Sechs Stämme sollten „stehen auf dem Berge Garizim, zu segnen das Volk“: Simeon, Levi, Juda, Issachar, Josef und Benjamin, und sechs auf dem Ebal, um zu fluchen. Josua führte es aus, „eine Hälfte neben dem Berge Garizim und die andere Hälfte neben dem Berge Ebal“, mit der Lade und den Leviten im Tal dazwischen. Später trat Jotam, wie es heißt, „auf die Höhe des Berges Garizim und hob auf seine Stimme, rief“, um den Männern von Sichem unten seine Baumfabel zu verkünden."
    - "Askar, meist für Sychar gehalten, liegt am selben Fuß, in der Luftlinie etwa 2,5 km vom Gipfel, mit dem Jakobsbrunnen in der Nähe, wo die samaritanische Frau auf den Berg hinaufzeigen konnte: „Unsere Väter haben auf diesem Berge angebetet“. Wo Josuas Zeremonie stattfand, ist nicht markiert; das Jahr der Karte folgt dem frühen Ansatz der Landnahme, etwa 1406 v. Chr., während viele Gelehrte sie ins 13. Jahrhundert v. Chr. setzen oder bezweifeln, dass sie sich datieren lässt. Im Samaritanischen Pentateuch ist der Garizim, nicht der Ebal, der Berg des Altars in 5. Mose 27,4. Heute erhebt sich der Gipfel, Dschebel et-Tur, auf 881 m, mit dem samaritanischen Dorf Kiryat Luza an seinem Hang und den Ruinen des samaritanischen Tempels und der Zenon-Kirche auf der Höhe."
  fr:
    - "Le mont Garizim est la montagne qui borde au sud le défilé de Sichem, au-dessus de la ville de Naplouse, en Cisjordanie, à environ 47 km au nord de Jérusalem à vol d’oiseau ; le mont Ébal lui fait face au nord, de l’autre côté de l’étroite vallée. Les points de la carte pour les deux sommets sont distants d’environ 3,8 km, et le tertre de l’antique Sichem se trouve au pied nord-est du Garizim, à environ 1,8 km de son sommet. History Globe répond déjà à la question de savoir qui étaient les Samaritains, dont c’est la montagne sainte, et consacre un article au Garizim ; cette réponse porte sur le lieu et sur la cérémonie de bénédiction et de malédiction."
    - "Moïse lia les deux montagnes à l’entrée dans le pays : « tu prononceras la bénédiction sur la montagne de Garizim, et la malédiction sur la montagne d’Ébal », et il les situa « près des chênes de Moré », le chêne de Moré à Sichem où Abraham avait dressé ses tentes. Six tribus devaient se tenir « sur le mont Garizim, pour bénir le peuple » : Siméon, Lévi, Juda, Issacar, Joseph et Benjamin, et six sur l’Ébal pour maudire. Josué l’exécuta, le peuple étant « moitié du côté du mont Garizim, moitié du côté du mont Ébal », l’arche et les lévites dans la vallée entre les deux. Plus tard, Jotham « alla se placer sur le sommet de la montagne de Garizim, et voici ce qu’il leur cria à haute voix » : sa fable des arbres, adressée aux gens de Sichem en contrebas."
    - "Askar, généralement prise pour Sychar, se trouve au même pied, à environ 2,5 km du sommet à vol d’oiseau, avec le puits de Jacob tout près, d’où la Samaritaine pouvait désigner la montagne : « Nos pères ont adoré sur cette montagne ». L’endroit où se tint la cérémonie de Josué n’est pas marqué ; l’année de la carte suit la date haute de la conquête, vers 1406 av. J.-C., alors que de nombreux spécialistes la placent au XIIIe siècle av. J.-C. ou doutent qu’on puisse la dater. Dans le Pentateuque samaritain, c’est le Garizim, et non l’Ébal, qui est la montagne de l’autel en Deutéronome 27.4. Aujourd’hui, le sommet, le Jebel et-Tur, s’élève à 881 m, avec le village samaritain de Kiryat Luza sur son flanc et les ruines du temple samaritain et de l’église de Zénon au sommet."
  pl:
    - "Góra Garizim to góra po południowej stronie przełęczy Sychem, nad miastem Nablus na Zachodnim Brzegu, około 47 km na północ od Jerozolimy w linii prostej; Góra Ebal stoi naprzeciw niej po drugiej stronie wąskiej doliny na północy. Punkty szczytów obu gór na mapie dzieli około 3,8 km, a wzgórze dawnego Sychem leży u północno-wschodniego podnóża Garizim, około 1,8 km od jego szczytu. History Globe odpowiada już, kim byli Samarytanie, czyją świętą górą jest Garizim, i ma artykuł o Garizim; ta odpowiedź dotyczy miejsca i ceremonii błogosławieństwa i przekleństwa."
    - "Mojżesz związał obie góry z wejściem do ziemi: „dasz błogosławieństwo to na górze Garyzym, a przeklęstwo na górze Hebal”, i wskazał ich położenie „przy równinie Morech”, dębu More w Sychem, gdzie obozował Abraham. Sześć pokoleń miało stanąć, „aby błogosławili ludowi na górze Garyzym”: Symeon, Lewi, Juda, Issachar, Józef i Beniamin, a sześć na Ebal, by przeklinać. Jozue wykonał to tak, że stała „połowa ich przeciw górze Garyzym, a połowa ich przeciw górze Hebal”, z arką i Lewitami w dolinie pomiędzy. Później Jotam „stanął na wierzchu góry Garyzym, a podniósłszy głos swój wołał” swą bajkę o drzewach do mężów Sychem w dole."
    - "Askar, uważane zwykle za Sychar, leży u tego samego podnóża, około 2,5 km od szczytu w linii prostej, z pobliską studnią Jakuba, gdzie Samarytanka mogła wskazać górę: „Ojcowie nasi na tej górze chwalili Boga”. Miejsce ceremonii Jozuego nie jest oznaczone; rok na mapie idzie za wczesną datą podboju, około 1406 p.n.e., podczas gdy wielu uczonych umieszcza go w XIII wieku p.n.e. albo wątpi, czy można go datować. W Pięcioksięgu Samarytańskim to Garizim, nie Ebal, jest górą ołtarza w Pwt 27,4. Dziś szczyt, Jebel et-Tur, wznosi się na 881 m, a na jego stoku leży samarytańska wieś Kiryat Luza, na szczycie zaś ruiny samarytańskiej świątyni i kościoła Zenona."
  it:
    - "Il Monte Garizim è il monte sul lato meridionale del passo di Sichem, sopra la città di Nablus in Cisgiordania, a circa 47 km a nord di Gerusalemme in linea d’aria; il Monte Ebal gli sta di fronte, al di là della stretta valle, a nord. I punti della mappa per le due cime distano circa 3,8 km, e il tell dell’antica Sichem si trova ai piedi nord-orientali del Garizim, a circa 1,8 km dalla sua vetta. History Globe risponde già a chi fossero i Samaritani, di cui è il monte santo, e ha un articolo sul Garizim; questa risposta riguarda il luogo e la cerimonia della benedizione e della maledizione."
    - "Mosè collegò i due monti all’ingresso nel paese: «tu pronunzierai la benedizione sul monte Gherizim, e la maledizione sul monte Ebal», e li situò «presso la querce di Moreh», la quercia di Moreh a Sichem dove Abramo aveva posto il campo. Sei tribù dovevano stare «sul monte Gherizim per benedire il popolo», Simeone, Levi, Giuda, Issacar, Giuseppe e Beniamino, e sei sull’Ebal per maledire. Giosuè lo eseguì con il popolo disposto «metà dal lato del monte Garizim, metà dal lato del monte Ebal», l’arca e i leviti nella valle tra i due. Più tardi Iotam «andò a porsi sulla sommità del monte Garizim, e alzando la voce gridò» la sua favola degli alberi agli uomini di Sichem che stavano sotto."
    - "Askar, di solito identificata con Sicar, si trova allo stesso piede del monte, a circa 2,5 km dalla vetta in linea d’aria, con il pozzo di Giacobbe nei pressi, dove la donna samaritana poteva indicare il monte: «I nostri padri hanno adorato su questo monte». Dove stesse la cerimonia di Giosuè non è indicato; l’anno della mappa segue la data alta della conquista, circa il 1406 a.C., mentre molti studiosi la collocano nel XIII secolo a.C. o dubitano che possa essere datata. Nel Pentateuco samaritano è il Garizim, non l’Ebal, il monte dell’altare in Dt 27,4. Oggi la vetta, Jebel et-Tur, si leva a 881 m, con il villaggio samaritano di Kiryat Luza sul pendio e le rovine del tempio samaritano e della chiesa di Zenone sulla cima."
  cs:
    - "Hora Gerizim je hora na jižní straně průsmyku Šekemu, nad městem Nábulus na Západním břehu, vzdušnou čarou asi 47 km severně od Jeruzaléma; hora Ébal jí čelí přes úzké údolí na severu. Body obou vrcholů na mapě jsou od sebe vzdáleny asi 3,8 km a pahorek starověkého Šekemu leží na severovýchodním úpatí Gerizimu, asi 1,8 km od jeho vrcholu. History Globe už odpovídá, kdo byli Samaritáni, jejichž svatou horou je, a má o Gerizimu článek; tato odpověď se týká místa a obřadu požehnání a prokletí."
    - "Mojžíš svázal obě hory se vstupem do země: „dáš požehnání toto na hoře Garizim, a zlořečení na hoře Hébal“, a umístil je „blízko rovin More“, k dubu Móre u Šekemu, kde Abraham tábořil. O šesti pokoleních se praví: „Tito stanou, aby dobrořečili lidu na hoře Garizim, když byste přešli Jordán: Simeon, Léví, Juda, Izachar, Jozef a Beniamin“, a šest mělo stát na Ébalu k zlořečení. Jozue to vykonal tak, že lid stál, „polovice jich proti hoře Garizim, a polovice proti hoře Hébal“, truhla a Levité v údolí mezi nimi. Později Jotam „postavil se na vrchu hory Garizim, a pozdvihna hlasu svého, volal“ svou bajku o stromech k mužům Šekemu dole."
    - "Askar, obvykle pokládaný za Sychar, leží na témže úpatí, vzdušnou čarou asi 2,5 km od vrcholu, s Jákobovou studnou nedaleko, odkud mohla Samaritánka ukázat na horu: „Otcové naši na této hoře modlívali se“. Kde stál Jozuův obřad, není vyznačeno; rok na mapě sleduje časné datování dobytí, asi 1406 př. n. l., zatímco mnozí badatelé je kladou do 13. století př. n. l. nebo pochybují, že je lze datovat. V Samaritánském pentateuchu je Gerizim, nikoli Ébal, horou oltáře v Dt 27,4. Dnes vrchol, Džabal at-Túr, dosahuje 881 m, se samaritánskou vsí Kirjat Luza na svahu a zříceninami samaritánského chrámu a Zenónova kostela na vrcholu."
  nl:
    - "De berg Gerizim is de berg aan de zuidzijde van de pas van Sichem, boven de stad Nabloes in de Westelijke Jordaanoever, hemelsbreed ongeveer 47 km ten noorden van Jeruzalem; de berg Ebal ligt er aan de noordzijde tegenover, over het smalle dal. De punten van de twee toppen op de kaart liggen ongeveer 3,8 km van elkaar, en de heuvel van het oude Sichem ligt aan de noordoostelijke voet van de Gerizim, ongeveer 1,8 km van de top. History Globe beantwoordt al wie de Samaritanen waren, wier heilige berg het is, en heeft een artikel over de Gerizim; dit antwoord gaat over de plaats en de plechtigheid van zegen en vloek."
    - "Mozes verbond de twee bergen met de intocht in het land: “zult gij den zegen uitspreken op den berg Gerizim, en den vloek op den berg Ebal”, en hij situeerde ze “bij de eikenbossen van More”, het eikenbos van More bij Sichem waar Abraham had gekampeerd. Zes stammen zouden “staan, om het volk te zegenen op den berg Gerizim”, Simeon, Levi, Juda, Issachar, Jozef en Benjamin, en zes op de Ebal om te vervloeken. Jozua voerde het uit met “een helft daarvan tegenover den berg Gerizim, en een helft daarvan tegenover den berg Ebal”, de ark en de Levieten in het dal ertussen. Later ging Jotam heen en “stond op de hoogte des bergs Gerizim, en verhief zijn stem, en riep”, en droeg zijn fabel van de bomen voor aan de mannen van Sichem beneden."
    - "Askar, gewoonlijk voor Sichar gehouden, ligt aan dezelfde voet, ongeveer 2,5 km van de top, met in de buurt de put van Jakob, vanwaar de Samaritaanse vrouw naar de berg kon wijzen: “Onze vaders hebben op dezen berg aangebeden”. Waar Jozua's plechtigheid plaatsvond, is niet aangegeven; het jaar op de kaart volgt de vroege datering van de verovering, ongeveer 1406 v.Chr., terwijl veel geleerden haar in de dertiende eeuw v.Chr. plaatsen of betwijfelen dat ze te dateren valt. In de Samaritaanse Pentateuch is de Gerizim, niet de Ebal, de berg van het altaar in Deut. 27:4. Tegenwoordig rijst de top, de Jebel et-Tur, tot 881 m, met het Samaritaanse dorp Kiryat Luza op de helling en de ruïnes van de Samaritaanse tempel en van de kerk van Zeno bovenop."
  sv:
    - "Berget Gerisim är berget på södra sidan av passet vid Shekem, ovanför staden Nablus på Västbanken, omkring 47 km norr om Jerusalem i fågelvägen; berget Ebal står mitt emot det över den smala dalen i norr. Kartans punkter för de två topparna ligger omkring 3,8 km från varandra, och det antika Shekems kulle ligger vid Gerisims nordöstra fot, omkring 1,8 km från toppen. History Globe besvarar redan vilka samariterna var, vars heliga berg det är, och har en artikel om Gerisim; det här svaret handlar om platsen och ceremonin med välsignelse och förbannelse."
    - "Mose band de två bergen till intåget i landet: ”skall du låta berget Gerissim bliva platsen för välsignelsen och berget Ebal platsen för förbannelsen”, och han förlade dem ”bredvid Mores terebintlund”, terebinten vid More i Shekem där Abraham hade slagit läger. Sex stammar skulle ”stå och välsigna folket på berget Gerissim”, Simeon, Levi, Juda, Isaskar, Josef och Benjamin, och sex på Ebal för att uttala förbannelsen. Josua genomförde det med ”den ena hälften vänd mot berget Gerissim och den andra hälften mot berget Ebal”, arken och leviterna i dalen emellan. Senare ”gick” Jotam ”åstad och ställde sig på toppen av berget Gerissim och hov upp sin röst och ropade” sin fabel om träden till männen i Shekem nedanför."
    - "Askar, vanligen ansedd som Sykar, ligger vid samma fot, omkring 2,5 km från toppen i fågelvägen, med Jakobs brunn i närheten, varifrån den samaritiska kvinnan kunde peka upp mot berget: ”Våra fäder hava tillbett på detta berg”. Var Josuas ceremoni ägde rum är inte utmärkt; kartans år följer den tidiga dateringen av erövringen, omkring 1406 f.Kr., medan många forskare förlägger den till 1200-talet f.Kr. eller betvivlar att den kan dateras. I den samaritiska Pentateuken är Gerisim, inte Ebal, altarets berg i 5 Mos 27:4. I dag reser sig toppen, Jebel et-Tur, till 881 m, med den samaritiska byn Kiryat Luza på sluttningen och ruinerna av det samaritiska templet och av Zenons kyrka på toppen."
  nb:
    - "Garisim er fjellet på sørsiden av passet ved Sikem, over byen Nablus på Vestbredden, omtrent 47 km nord for Jerusalem i luftlinje; Ebal står overfor det på tvers av den smale dalen i nord. Kartets punkter for de to toppene ligger omtrent 3,8 km fra hverandre, og haugen til det gamle Sikem ligger ved Garisims nordøstre fot, omtrent 1,8 km fra toppen. History Globe svarer allerede på hvem samaritanene var, hvis hellige fjell det er, og har en artikkel om Garisim; dette svaret handler om stedet og seremonien med velsignelse og forbannelse."
    - "Moses knyttet de to fjellene til inntoget i landet: «da skal du lyse velsignelsen på fjellet Garisim og forbannelsen på fjellet Ebal», og han plasserte dem «ved Mores terebintelund», More-eika ved Sikem der Abraham hadde slått leir. Seks stammer skulle «stå på fjellet Garisim og velsigne folket»: Simeon, Levi, Juda, Issakar, Josef og Benjamin, og seks på Ebal for å lyse forbannelse. Josva utførte det med «den ene halvdel av dem mot Garisim-fjellet, og den andre halvdel mot Ebal-fjellet», arken og levittene i dalen imellom. Senere heter det om Jotam: «gikk han op på toppen av Gerisim-fjellet; der stod han og ropte høit», og han fremsa sin fabel om trærne for mennene i Sikem nedenfor."
    - "Askar, vanligvis regnet for Sykar, ligger ved samme fot, omtrent 2,5 km fra toppen i luftlinje, med Jakobs brønn i nærheten, der den samaritanske kvinnen kunne peke opp mot fjellet: «Våre fedre tilbad på dette fjell». Hvor Josvas seremoni fant sted, er ikke markert; kartets år følger den tidlige dateringen av erobringen, omkring 1406 f.Kr., mens mange forskere plasserer den på 1200-tallet f.Kr. eller tviler på at den kan dateres. I den samaritanske Pentateuk er Garisim, ikke Ebal, alterets fjell i 5 Mos 27,4. I dag stiger toppen, Jebel et-Tur, til 881 m, med den samaritanske landsbyen Kiryat Luza i skråningen og ruinene av det samaritanske tempelet og av Zenons kirke på toppen."
  tl:
    - "Ang Bundok Gerizim ay ang bundok sa timog na bahagi ng daanan ng Sichem, sa ibabaw ng lungsod ng Nablus sa West Bank, mga 47 km sa hilaga ng Jerusalem sa tuwid na guhit; ang Bundok Ebal ay nakaharap dito sa kabila ng makitid na lambak sa hilaga. Ang mga punto ng mapa para sa dalawang tuktok ay mga 3.8 km ang pagitan, at ang burol ng sinaunang Sichem ay nasa hilagang-silangang paanan ng Gerizim, mga 1.8 km mula sa tuktok nito. Sinasagot na ng History Globe kung sino ang mga Samaritano, na ang banal na bundok ito, at may artikulo tungkol sa Gerizim; ang sagot na ito ay tungkol sa lugar at sa seremonya ng pagpapala at sumpa."
    - "Iniugnay ni Moises ang dalawang bundok sa pagpasok sa lupain: “iyong ilalagay ang pagpapala sa bundok ng Gerizim, at ang sumpa sa bundok ng Ebal”, at inilagay niya ang mga ito “kasiping ng mga encina sa More”, ang encina ng Moreh sa Sichem kung saan nagkampo si Abraham. Anim na lipi ang “tatayo sa ibabaw ng bundok ng Gerizim, upang basbasan ang bayan”, ang Simeon, Levi, Juda, Issachar, Jose at Benjamin, at anim sa Ebal upang sumumpa. Isinagawa ito ni Josue: “kalahati nila ay sa harap ng bundok ng Gerizim at kalahati nila ay sa harap ng bundok ng Ebal”, ang kaban at ang mga Levita sa lambak sa pagitan. Nang maglaon, si Jotham ay “tumayo sa taluktok ng bundok Gerizim, at inilakas ang kaniyang tinig, at sumigaw” ng kaniyang pabula ng mga puno sa mga lalaki ng Sichem sa ibaba."
    - "Ang Askar, na karaniwang itinuturing na Sicar, ay nasa gayunding paanan, mga 2.5 km mula sa tuktok sa tuwid na guhit, at malapit ang balon ni Jacob, kung saan maituturo ng babaing Samaritana ang bundok: “Nagsisamba ang aming mga magulang sa bundok na ito”. Hindi tiyak kung saan nakatayo ang seremonya ni Josue; ang taon sa mapa ay sumusunod sa maagang petsa ng pananakop, mga 1406 BK, samantalang maraming iskolar ang naglalagay nito sa ika-13 siglo BK o nag-aalinlangang mapepetsahan ito. Sa Samaritanong Pentateuko, ang Gerizim, hindi ang Ebal, ang bundok ng dambana sa Deuteronomio 27:4. Ngayon, ang tuktok, ang Jebel et-Tur, ay umaabot sa 881 m, na may nayong Samaritano ng Kiryat Luza sa dalisdis nito at ang mga guho ng templo ng mga Samaritano at ng simbahan ni Zeno sa tuktok."
  da:
    - "Garizim er bjerget på sydsiden af passet ved Sikem, over byen Nablus på Vestbredden, ca. 47 km nord for Jerusalem i fugleflugt; Ebal står over for det på tværs af den smalle dal mod nord. Kortets punkter for de to tinder ligger ca. 3,8 km fra hinanden, og den antikke Sikems tell ligger ved Garizims nordøstlige fod, ca. 1,8 km fra toppen. History Globe besvarer allerede, hvem samaritanerne var, hvis hellige bjerg det er, og har en artikel om Garizim; dette svar handler om stedet og ceremonien med velsignelse og forbandelse."
    - "Moses knyttede de to bjerge til indtrædelsen i landet: du skal »lyse Velsignelsen paa det Bjerg Garizim og Forbandelsen paa det Bjerg Ebal«, og han stedfæstede dem »ved More Lund«, Mores eg ved Sikem, hvor Abraham havde slået lejr. Seks stammer skulle »staa og velsigne Folket paa Garizims Bjerg«, Simeon, Levi, Juda, Issakar, Josef og Benjamin, og seks på Ebal for at forbande. Josva udførte det med »Halvdelen deraf hen imod Garizims Bjerg, og Halvdelen deraf hen imod Ebals Bjerg«, arken og leviterne i dalen imellem. Senere gik Jotam hen og »stod paa Garizims Bjergs Top« og forkyndte sin fabel om træerne for mændene i Sikem nedenfor."
    - "Askar, sædvanligvis taget for Sykar, ligger ved samme fod, ca. 2,5 km fra toppen i fugleflugt, med Jakobs brønd i nærheden, hvor den samaritanske kvinde kunne pege op på bjerget: »Vore Fædre have tilbedet paa dette Bjerg«. Hvor Josvas ceremoni stod, er ikke markeret; kortets år følger den tidlige datering af erobringen, ca. 1406 f.Kr., mens mange forskere placerer den i 1200-tallet f.Kr. eller tvivler på, at den kan dateres. I den samaritanske Pentateuk er Garizim, ikke Ebal, alterbjerget i 5 Mos 27,4. I dag hæver toppen, Jebel et-Tur, sig til 881 m, med den samaritanske landsby Kiryat Luza på skråningen og ruinerne af det samaritanske tempel og af Zenons kirke øverst."
  sr:
    - "Гора Гаризим је планина на јужној страни сихемског превоја, изнад града Набулуса на Западној обали, око 47 км северно од Јерусалима ваздушном линијом; гора Евал стоји наспрам ње преко уске долине на северу. Тачке врхова обе горе на карти удаљене су око 3,8 км, а хумка древног Сихема лежи у североисточном подножју Гаризима, око 1,8 км од његовог врха. History Globe већ одговара ко су били Самарјани, чија је то света гора, и има чланак о Гаризиму; овај одговор говори о месту и о обреду благослова и проклетства."
    - "Мојсије је обе горе везао за улазак у земљу: „тада изреци благослов онај на гори Гаризину, а проклетство на гори Евалу“, а смештао их је „код равнице морешке“, код храста Море у Сихему где је Аврам логоровао. Шест племена је требало да „стану да благосиљају народ на гори Гаризину“, Симеун, Левије, Јуда, Исахар, Јосиф и Венијамин, а шест на Евалу да проклињу. Исус Навин је то извршио: „половина према гори Гаризину а половина према гори Евалу“, са ковчегом и Левитима у долини између. Касније Јотам „стаде наврх горе Гаризина, и подигавши глас свој повика“ своју басну о дрвећу Сихемљанима доле."
    - "Аскар, који се обично узима за Сихар, лежи у истом подножју, око 2,5 км од врха ваздушном линијом, а у близини је Јаковљев бунар, где је Самарјанка могла да покаже горе на планину: „Оци наши молише се Богу на овој гори“. Где је стајао обред Исуса Навина, није означено; година на карти прати рани датум освајања, око 1406. п. н. е., док га многи научници стављају у тринаести век п. н. е. или сумњају да се може датирати. У Самарјанском петокњижју Гаризим, а не Евал, гора је олтара у Понз 27,4. Данас врх, Џебел ет-Тур, достиже 881 м, са самарјанским селом Кирјат Луза на падини и рушевинама самарјанског храма и Зенонове цркве на врху."
