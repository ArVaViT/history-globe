id: where-was-mount-gerizim
question:
  en: "Where is Mount Gerizim, the mountain of blessing?"
  ru: "Где находится гора Гаризим, гора благословения?"
answer:
  en:
    - "Mount Gerizim is the mountain on the south side of the pass of Shechem, above the city of Nablus in the West Bank, about 47 km north of Jerusalem in a straight line; Mount Ebal faces it across the narrow valley on the north. The map's points for the two summits are about 3.8 km apart, and the mound of ancient Shechem lies at Gerizim's north-eastern foot, about 1.8 km from its summit. History Globe already answers who the Samaritans were, whose holy mountain it is, and has an article on Gerizim; this answer is about the place and the ceremony of blessing and curse."
    - "Moses tied the two mountains to the entry into the land: “thou shalt put the blessing upon mount Gerizim, and the curse upon mount Ebal”, and he located them “beside the plains of Moreh”, the oak of Moreh at Shechem where Abraham had camped. Six tribes were to “stand upon mount Gerizim to bless the people”, Simeon, Levi, Judah, Issachar, Joseph and Benjamin, and six on Ebal to curse. Joshua carried it out with “half of them over against mount Gerizim, and half of them over against mount Ebal”, the ark and the Levites in the valley between. Later Jotham “stood in the top of mount Gerizim, and lifted up his voice, and cried” his fable of the trees to the men of Shechem below."
    - "Askar, usually taken for Sychar, lies at the same foot, about 2.5 km from the summit in a straight line, with Jacob's well nearby, where the Samaritan woman could point up at the mountain: “Our fathers worshipped in this mountain”. Where Joshua's ceremony stood is not marked; the map's year follows the early date for the conquest, about 1406 BC, while many scholars place it in the thirteenth century BC or doubt that it can be dated. In the Samaritan Pentateuch Gerizim, not Ebal, is the mountain of the altar in Deuteronomy 27:4. Today the summit, Jebel et-Tur, rises to 881 m, with the Samaritan village of Kiryat Luza on its slope and the ruins of the Samaritan temple and of Zeno's church at the top."
  ru:
    - "Гора Гаризим — гора на южной стороне Сихемского перевала, над городом Наблусом на Западном берегу, примерно в 47 км к северу от Иерусалима по прямой; напротив неё, через узкую долину к северу, стоит гора Гевал. Точки карты для двух вершин отстоят друг от друга примерно на 3,8 км, а холм древнего Сихема лежит у северо-восточного подножия Гаризима, примерно в 1,8 км от вершины. В History Globe уже есть ответ о самарянах, для которых это святая гора, и статья о Гаризиме; здесь ответ о самом месте и об обряде благословения и проклятия."
    - "Моисей связал обе горы со вступлением в землю: «произнеси благословение на горе Гаризим, а проклятие на горе Гевал», и указал их место — «близ дубравы Море», у Сихема, где когда-то стоял Аврам. Шесть колен — Симеон, Левий, Иуда, Иссахар, Иосиф и Вениамин — «должны стать на горе Гаризим, чтобы благословлять народ», а шесть — на Гевале, чтобы произносить проклятие. Иисус Навин исполнил это: «одна половина их у горы Гаризим, а другая половина у горы Гевал», а ковчег и левиты — в долине между ними. Позднее Иофам «стал на вершине горы Гаризима и, возвысив голос свой, кричал» жителям Сихема внизу свою притчу о деревьях."
    - "У того же подножия, примерно в 2,5 км от вершины по прямой, лежит Аскар, который обычно считают Сихарем, а рядом — колодец Иакова; там самарянка могла указать на гору: «Отцы наши поклонялись на этой горе». Место обряда Иисуса Навина не отмечено; год карты следует ранней датировке завоевания, около 1406 г. до н. э., тогда как многие учёные относят его к XIII веку до н. э. или считают, что датировать его нельзя. В самарянском Пятикнижии гора жертвенника во Второзаконии 27:4 — Гаризим, а не Гевал. Сегодня вершина, Джебель-эт-Тур, поднимается на 881 м; на склоне — самарянское селение Кирьят-Луза, на вершине — развалины самарянского храма и церкви Зенона."
