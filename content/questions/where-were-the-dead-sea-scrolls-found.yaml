id: where-were-the-dead-sea-scrolls-found
question:
  en: "Where were the Dead Sea Scrolls found?"
  ru: "Где нашли свитки Мёртвого моря?"
  uk: "Де знайдено сувої Мертвого моря?"
  es: "¿Dónde se hallaron los manuscritos del mar Muerto?"
  pt: "Onde foram encontrados os Manuscritos do mar Morto?"
  de: "Wo wurden die Schriftrollen vom Toten Meer gefunden?"
  fr: "Où furent trouvés les manuscrits de la mer Morte ?"
  pl: "Gdzie znaleziono Zwoje znad Morza Martwego?"
  it: "Dove furono trovati i Rotoli del Mar Morto?"
  cs: "Kde byly nalezeny svitky od Mrtvého moře?"
  nl: "Waar werden de Dode-Zeerollen gevonden?"
  sv: "Var hittades Dödahavsrullarna?"
  nb: "Hvor ble Dødehavsrullene funnet?"
  tl: "Saan natagpuan ang Mga Balumbon sa Dagat na Patay?"
  da: "Hvor blev Dødehavsrullerne fundet?"
  sr: "Где су пронађени Рукописи са Мртвог мора?"
answer:
  en:
    - "In caves in the cliffs above the north-western shore of the Dead Sea, around the ruin of Khirbet Qumran, in today's West Bank: about 15 km south of Old Testament Jericho, 22 km east of Jerusalem in a straight line and 33 km north of En-gedi. Bedouin of the Ta'amireh found the first seven scrolls in 1946–47 in what is now called Cave 1; by 1956 eleven caves had yielded the remains of nearly a thousand manuscripts in Hebrew, Aramaic and Greek, written between about 250 BC and AD 68, among them copies of every book of the Hebrew Bible but Esther, the complete Great Isaiah Scroll and the writings of the community itself. The map's point is the “city of Salt” of Joshua, which some identify with Qumran."
    - "The scrolls are a thousand years older than the oldest Hebrew Bibles known before them, and they show how the text was read in the time of Jesus. The community's own rule applies to itself Isaiah's call, “The voice of him that crieth in the wilderness, Prepare ye the way of the LORD, make straight in the desert a highway for our God”, as a command to go out into the desert; a commentary on Habakkuk applies “the just shall live by his faith” to those who keep the Law and are faithful to its own Teacher. Joshua lists among the towns of Judah “in the wilderness” Beth-arabah, Middin, Secacah, “Nibshan, and the city of Salt, and En-gedi; six cities with their villages”, and Secacah, named in the Copper Scroll, is sought in the Buqeia valley above Qumran or at Qumran itself."
    - "Roland de Vaux excavated Khirbet Qumran in 1951–1956: a settlement he dated from the late second century BC to AD 68 (Jodi Magness starts it in the first century BC), with cisterns, a long room he called a scriptorium, pottery like that of the caves and a cemetery of more than a thousand graves. He and most scholars since take it for the home of the Essenes, whom Pliny places on the west shore above En-gedi, and whom Josephus describes; by the usual dating, from coins of the revolt, the Romans destroyed it in 68. Others disagree: Norman Golb argued that the scrolls were libraries brought from Jerusalem and hidden before the siege, and Yizhar Hirschfeld that the ruin was a manor. Most scrolls are kept in the Shrine of the Book of the Israel Museum and by the Israel Antiquities Authority; the Copper Scroll is in the Jordan Museum in Amman."
  ru:
    - "В пещерах в скалах над северо-западным берегом Мёртвого моря, вокруг руин Хирбет-Кумран, на нынешнем Западном берегу: примерно в 15 км к югу от ветхозаветного Иерихона, в 22 км к востоку от Иерусалима по прямой и в 33 км к северу от Ен-Геди. Бедуины племени таамире нашли первые семь свитков в 1946–1947 годах в пещере, которую теперь зовут Пещерой 1; к 1956 году одиннадцать пещер дали остатки почти тысячи рукописей на еврейском, арамейском и греческом, написанных примерно между 250 г. до н. э. и 68 г. н. э., среди них списки всех книг еврейской Библии, кроме Есфири, полный Большой свиток Исаии и сочинения самой общины. Точка на карте — «Ир-Мелах», город Соли из книги Иисуса Навина, который некоторые отождествляют с Кумраном."
    - "Свитки на тысячу лет старше древнейших еврейских Библий, известных до них, и показывают, как читали текст во времена Иисуса. Устав общины прилагает к ней самой призыв Исаии — «Глас вопиющего в пустыне: приготовьте путь Господу, прямыми сделайте в степи стези Богу нашему» — как повеление уйти в пустыню; толкование на Аввакума относит слова «праведный своею верою жив будет» к исполняющим Закон и верным её Учителю. Иисус Навин перечисляет среди городов Иуды «в пустыне» Беф-Араву, Миддин, Секаху, «Нившан, Ир-Мелах и Ен-Геди: шесть городов с их селами», а Секаху, названную в Медном свитке, ищут в долине Букейа над Кумраном или в самом Кумране."
    - "Ролан де Во раскапывал Хирбет-Кумран в 1951–1956 годах: поселение, которое он датировал концом II века до н. э. — 68 г. н. э. (Джоди Магнесс начинает его в I веке до н. э.), с цистернами, длинной комнатой, которую он назвал скрипторием, керамикой, как в пещерах, и кладбищем более чем в тысячу могил. Он и большинство учёных после него считают его домом ессеев, которых Плиний помещает на западном берегу выше Ен-Геди и которых описывает Иосиф Флавий; по обычной датировке, по монетам восстания, римляне разрушили его в 68 году. Другие не согласны: Норман Голб доказывал, что свитки — библиотеки, вывезенные из Иерусалима и спрятанные перед осадой, а Изхар Хиршфельд — что руины были усадьбой. Большая часть свитков хранится в Храме Книги Музея Израиля и в Управлении древностей Израиля; Медный свиток — в Иорданском музее в Аммане."
  uk:
    - "У печерах у скелях над північно-західним берегом Мертвого моря, навколо руїни Хірбет-Кумран, нині на Західному березі Йордану: приблизно за 15 км на південь від староз'вітного Єрихону, за 22 км на схід від Єрусалима по прямій і за 33 км на північ від Ен-Геді. Бедуїни племені таамире знайшли перші сім сувоїв 1946–1947 рр. у тому, що нині зветься Печерою 1; до 1956 р. одинадцять печер дали рештки майже тисячі рукописів єврейською, арамейською та грецькою мовами, написаних між приблизно 250 р. до н. е. і 68 р. н. е., серед них примірники кожної книги Єврейської Біблії, крім Естер, повний Великий сувій Ісаї та писання самої громади. Точка на мапі — це «Солоний город» з Книги Ісуса Навина, який дехто ототожнює з Кумраном."
    - "Сувої на тисячу років давніші за найдавніші єврейські Біблії, відомі до них, і вони показують, як читали текст за часів Ісуса. Власний статут громади застосовує до себе Ісаїн заклик: «голос покликуючого в пустинї: Стелїть дорогу Господеві, рівняйте в степу стежки Богу нашому» — як наказ іти в пустелю; коментар на Авакума застосовує «праведний буде вірою своєю жити» до тих, хто дотримується Закону і вірний власному Вчителеві громади. Книга Ісуса Навина перелічує серед міст Юди «У степу»: Бет-Арава, Миддин, Секаха, «Нибсан та Солоний город та Енгеди — шість хородів з їх селами», а Секаху, названу в Мідному сувої, шукають у долині Букея над Кумраном або в самому Кумрані."
    - "Ролан де Во розкопував Хірбет-Кумран у 1951–1956 рр.: поселення, яке він датував від кінця II ст. до н. е. до 68 р. н. е. (Джоді Меґнесс починає його в I ст. до н. е.), з цистернами, довгою кімнатою, яку він назвав скрипторієм, керамікою, як у печерах, і цвинтарем з понад тисячею могил. Він і більшість учених відтоді вважають його домівкою ессеїв, яких Пліній поміщає на західному березі над Ен-Геді і яких описує Йосиф Флавій; за звичайною датою, за монетами повстання, римляни зруйнували його 68 р. Інші не погоджуються: Норман Голб доводив, що сувої були бібліотеками, привезеними з Єрусалима й захованими перед облогою, а Їцхар Гіршфельд — що руїна була садибою. Більшість сувоїв зберігається в Храмі книги Музею Ізраїлю та в Управлінні старожитностей Ізраїлю; Мідний сувій — в Йорданському музеї в Аммані."
  es:
    - "En cuevas de los acantilados sobre la orilla noroeste del mar Muerto, en torno a la ruina de Khirbet Qumrán, en la actual Cisjordania: a unos 15 km al sur de la Jericó del Antiguo Testamento, a 22 km al este de Jerusalén en línea recta y a 33 km al norte de En-gadi. Beduinos de los Ta'amireh hallaron los primeros siete rollos en 1946–47 en lo que hoy se llama la Cueva 1; hacia 1956 once cuevas habían dado los restos de casi un millar de manuscritos en hebreo, arameo y griego, escritos aproximadamente entre el 250 a. C. y el 68 d. C., entre ellos copias de todos los libros de la Biblia hebrea salvo Ester, el Gran Rollo de Isaías completo y los escritos de la propia comunidad. El punto del mapa es la «ciudad de la sal» de Josué, que algunos identifican con Qumrán."
    - "Los rollos son mil años más antiguos que las Biblias hebreas más antiguas conocidas antes de ellos, y muestran cómo se leía el texto en tiempos de Jesús. La regla de la propia comunidad aplica a sí misma el llamamiento de Isaías, «Voz que clama en el desierto: Barred camino á Jehová: enderezad calzada en la soledad á nuestro Dios», como mandato de salir al desierto; un comentario a Habacuc aplica «el justo en su fe vivirá» a quienes guardan la Ley y son fieles a su propio Maestro. Josué enumera entre las ciudades de Judá «en el desierto» Bet-araba, Medín, Secaca, «Y Nibsan, y la ciudad de la sal, y Engedi; seis ciudades con sus aldeas», y Secaca, nombrada en el Rollo de Cobre, se busca en el valle de Buqeia, sobre Qumrán, o en la propia Qumrán."
    - "Roland de Vaux excavó Khirbet Qumrán en 1951–1956: un asentamiento fechado desde fines del siglo II a. C. hasta el 68 d. C. (Jodi Magness lo hace comenzar en el siglo I a. C.), con cisternas, una sala larga llamada scriptorium, cerámica como la de las cuevas y un cementerio de más de mil tumbas. Él y la mayoría desde entonces lo toman por hogar de los esenios, que Plinio sitúa en la orilla occidental sobre En-gadi y describe Josefo; según la datación habitual, por monedas de la revuelta, los romanos lo destruyeron en el 68. Otros discrepan: Norman Golb sostuvo que los rollos eran bibliotecas traídas de Jerusalén y ocultadas antes del asedio, y Yizhar Hirschfeld que la ruina era una casa señorial. La mayoría de los rollos está en el Santuario del Libro del Museo de Israel y en la Autoridad de Antigüedades de Israel; el Rollo de Cobre, en el Museo de Jordania, en Amán."
  pt:
    - "Em cavernas nos penhascos acima da margem noroeste do mar Morto, em torno da ruína de Khirbet Qumran, na atual Cisjordânia: a cerca de 15 km ao sul da Jericó do Antigo Testamento, 22 km a leste de Jerusalém em linha reta e 33 km ao norte de En-Gedi. Beduínos da tribo Ta'amireh encontraram os primeiros sete rolos em 1946–47 no que hoje se chama Caverna 1; em 1956, onze cavernas haviam fornecido os restos de quase mil manuscritos em hebraico, aramaico e grego, escritos entre cerca de 250 a.C. e 68 d.C., entre eles cópias de todos os livros da Bíblia hebraica exceto Ester, o Grande Rolo de Isaías completo e os escritos da própria comunidade. O ponto do mapa é a “Cidade do Sal” de Josué, que alguns identificam com Qumran."
    - "Os rolos são mil anos mais antigos do que as mais antigas Bíblias hebraicas conhecidas antes deles, e mostram como o texto era lido no tempo de Jesus. A própria regra da comunidade aplica a si o chamado de Isaías, “A voz do que clama: Preparem o caminho do SENHOR no deserto! Façam uma estrada reta no ermo para o nosso Deus”, como ordem de sair para o deserto; um comentário a Habacuque aplica “o justo viverá pela sua fé” aos que guardam a Lei e são fiéis ao seu Mestre. Josué relaciona entre as cidades de Judá “No deserto: Bete-Arabá, Midim, Secaca, Nibsã, a Cidade do Sal e En-Gedi; seis cidades com as suas aldeias”, e Secacá, nomeada no Rolo de Cobre, é procurada no vale de Buqeia, acima de Qumran, ou no próprio Qumran."
    - "Roland de Vaux escavou Khirbet Qumran em 1951–1956: um povoado que datou do fim do século II a.C. a 68 d.C. (Jodi Magness o faz começar no século I a.C.), com cisternas, uma sala comprida que chamou de scriptorium, cerâmica igual à das cavernas e um cemitério com mais de mil sepulturas. Ele e a maioria dos estudiosos desde então o tomam pela morada dos essênios, que Plínio situa na margem oeste acima de En-Gedi e que Josefo descreve; pela datação usual, a partir de moedas da revolta, os romanos o destruíram em 68. Outros discordam: Norman Golb sustentou que os rolos eram bibliotecas trazidas de Jerusalém e escondidas antes do cerco, e Yizhar Hirschfeld que a ruína era uma casa de campo. A maioria dos rolos é guardada no Santuário do Livro do Museu de Israel e pela Autoridade de Antiguidades de Israel; o Rolo de Cobre está no Museu da Jordânia, em Amã."
  de:
    - "In Höhlen in den Felsen über dem Nordwestufer des Toten Meeres, rund um die Ruine Khirbet Qumran im heutigen Westjordanland: in der Luftlinie etwa 15 km südlich des alttestamentlichen Jericho, 22 km östlich von Jerusalem und 33 km nördlich von En-Gedi. Beduinen der Ta’amireh fanden 1946–47 in der heute Höhle 1 genannten Höhle die ersten sieben Rollen; bis 1956 hatten elf Höhlen die Reste von fast tausend Handschriften auf Hebräisch, Aramäisch und Griechisch geliefert, geschrieben zwischen etwa 250 v. Chr. und 68 n. Chr., darunter Abschriften jedes Buches der Hebräischen Bibel außer Ester, die vollständige Große Jesajarolle und die Schriften der Gemeinschaft selbst. Der Kartenpunkt ist die „Salzstadt“ bei Josua, die manche mit Qumran gleichsetzen."
    - "Die Rollen sind tausend Jahre älter als die ältesten zuvor bekannten hebräischen Bibeln und zeigen, wie der Text zur Zeit Jesu gelesen wurde. Die Regel der Gemeinschaft bezieht Jesajas Ruf „Es ist eine Stimme eines Predigers in der Wüste: Bereitet dem HERRN den Weg, macht auf dem Gefilde eine ebene Bahn unserm Gott!“ auf sich selbst, als Befehl, in die Wüste zu ziehen; ein Habakuk-Kommentar bezieht „der Gerechte aber wird seines Glaubens leben“ auf die, die das Gesetz halten und ihrem Lehrer treu sind. Josua führt unter den Städten Judas auf: „In der Wüste aber war Beth-Araba, Middin, Sechacha, Nibsan und die Salzstadt und Engedi. Das sind sechs Städte und ihre Dörfer.“ Sechacha, in der Kupferrolle genannt, wird im Tal Bukea über Qumran oder in Qumran selbst gesucht."
    - "Roland de Vaux grub Khirbet Qumran 1951–1956 aus: eine Siedlung, die er vom späten 2. Jahrhundert v. Chr. bis 68 n. Chr. datierte (Jodi Magness beginnt sie im 1. Jahrhundert v. Chr.), mit Zisternen, einem langen Raum, den er Skriptorium nannte, Keramik wie in den Höhlen und einem Friedhof mit mehr als tausend Gräbern. Er und die meisten seither halten sie für die Heimat der Essener, die Plinius am Westufer über En-Gedi ansiedelt und die Josephus beschreibt; nach der üblichen Datierung, aus Münzen des Aufstands, zerstörten die Römer sie 68. Andere widersprechen: Norman Golb meinte, die Rollen seien aus Jerusalem gebrachte und vor der Belagerung versteckte Bibliotheken gewesen, Yizhar Hirschfeld, die Ruine sei ein Gutshof. Die meisten Rollen liegen im Schrein des Buches im Israel-Museum und bei der Altertumsbehörde; die Kupferrolle ist im Jordan-Museum in Amman."
  fr:
    - "Dans des grottes des falaises au-dessus de la rive nord-ouest de la mer Morte, autour de la ruine de Khirbet Qumrân, dans l’actuelle Cisjordanie : à environ 15 km au sud de la Jéricho de l’Ancien Testament, à 22 km à l’est de Jérusalem à vol d’oiseau et à 33 km au nord d’En-Guédi. Des Bédouins Ta‘amireh trouvèrent les sept premiers rouleaux en 1946-1947 dans ce qu’on appelle aujourd’hui la grotte 1 ; en 1956, onze grottes avaient livré les restes de près de mille manuscrits en hébreu, en araméen et en grec, écrits entre environ 250 av. J.-C. et 68 apr. J.-C., parmi lesquels des copies de tous les livres de la Bible hébraïque sauf Esther, le Grand Rouleau d’Ésaïe complet et les écrits de la communauté elle-même. Le point de la carte est Ir-Hammélach, la « ville du Sel » de Josué, que certains identifient à Qumrân."
    - "Les rouleaux sont plus anciens de mille ans que les plus anciennes Bibles hébraïques connues avant eux, et ils montrent comment le texte était lu au temps de Jésus. La règle de la communauté applique à elle-même l’appel d’Ésaïe, « Une voix crie : Préparez au désert le chemin de l’Éternel, aplanissez dans les lieux arides une route pour notre Dieu », comme un ordre d’aller au désert ; un commentaire d’Habacuc applique « le juste vivra par sa foi » à ceux qui observent la Loi et sont fidèles à son propre Maître. Josué énumère parmi les villes de Juda « Dans le désert : Beth-Araba, Middin, Secaca, Nibschan, Ir-Hammélach, et En-Guédi ; six villes, et leurs villages », et Secaca, nommée dans le Rouleau de cuivre, est cherchée dans la vallée de Buqeia au-dessus de Qumrân ou à Qumrân même."
    - "R. de Vaux fouilla Khirbet Qumrân en 1951-1956 : un établissement qu’il data de la fin du IIe siècle av. J.-C. à 68 apr. J.-C. (Jodi Magness le fait commencer au Ier siècle av. J.-C.), avec citernes, une longue salle dite scriptorium, une poterie semblable à celle des grottes et un cimetière de plus de mille tombes. Lui et la plupart des spécialistes y voient la demeure des esséniens, que Pline place sur la rive occidentale au-dessus d’En-Guédi et que décrit Flavius Josèphe ; d’après les monnaies de la révolte, les Romains le détruisirent en 68. D’autres divergent : pour Norman Golb, les rouleaux sont des bibliothèques de Jérusalem cachées avant le siège, pour Yizhar Hirschfeld, la ruine un domaine rural. La plupart des rouleaux sont au Sanctuaire du Livre (Musée d’Israël) et à l’Autorité des antiquités d’Israël ; le Rouleau de cuivre, au Musée de Jordanie, à Amman."
  pl:
    - "W jaskiniach w klifach nad północno-zachodnim brzegiem Morza Martwego, wokół ruin Khirbet Qumran, na dzisiejszym Zachodnim Brzegu: około 15 km na południe od starotestamentowego Jerycha, 22 km na wschód od Jerozolimy w linii prostej i 33 km na północ od En-Gedi. Beduini z plemienia Ta'amireh znaleźli pierwsze siedem zwojów w latach 1946–47 w jaskini zwanej dziś Jaskinią 1; do 1956 jedenaście jaskiń dało szczątki prawie tysiąca rękopisów po hebrajsku, aramejsku i grecku, spisanych między około 250 p.n.e. a 68 n.e., wśród nich odpisy każdej księgi Biblii hebrajskiej oprócz Estery, kompletny Wielki Zwój Izajasza i pisma samej wspólnoty. Punkt na mapie to „miasto Soli” z Księgi Jozuego, które niektórzy utożsamiają z Qumran."
    - "Zwoje są o tysiąc lat starsze niż najstarsze znane przed nimi Biblie hebrajskie i pokazują, jak czytano tekst w czasach Jezusa. Reguła samej wspólnoty odnosi do siebie wezwanie Izajasza: „Głos wołającego na puszczy: Gotujcie drogę Pańską, prostą czyńcie na pustyni ścieszkę Boga naszego”, jako nakaz wyjścia na pustynię; komentarz do Habakuka odnosi „sprawiedliwy z wiary swej żyć będzie” do tych, którzy zachowują Prawo i są wierni swojemu Nauczycielowi. Jozue wymienia wśród miast Judy „na puszczy” Bet-Araba, Middin, Sekaka, „Nebsan, i miasto Soli, i Engaddy, miast sześć, i wsi ich”, a Sekakę, wymienioną w Zwoju Miedzianym, szuka się w dolinie Buqeia nad Qumran albo w samym Qumran."
    - "Roland de Vaux prowadził wykopaliska w Khirbet Qumran w latach 1951–1956: osada, którą datował od końca II wieku p.n.e. do 68 n.e. (Jodi Magness zaczyna ją w I wieku p.n.e.), z cysternami, długą salą, którą nazwał skryptorium, ceramiką taką jak w jaskiniach i cmentarzem z ponad tysiącem grobów. On i większość uczonych od tamtej pory uważają ją za siedzibę esseńczyków, których Pliniusz umieszcza na zachodnim brzegu nad En-Gedi i których opisuje Józef Flawiusz; według zwykłego datowania, z monet powstania, Rzymianie zniszczyli ją w 68. Inni się nie zgadzają: Norman Golb dowodził, że zwoje były bibliotekami przywiezionymi z Jerozolimy i ukrytymi przed oblężeniem, a Yizhar Hirschfeld, że ruina była dworem. Większość zwojów przechowuje się w Sanktuarium Księgi Muzeum Izraela i w Izraelskim Urzędzie Starożytności; Zwój Miedziany jest w Muzeum Jordańskim w Ammanie."
  it:
    - "In grotte nelle rupi sopra la riva nord-occidentale del Mar Morto, attorno alla rovina di Khirbet Qumran, nell’odierna Cisgiordania: a circa 15 km a sud della Gerico dell’Antico Testamento, 22 km a est di Gerusalemme in linea d’aria e 33 km a nord di En-Gedi. I beduini Ta‘amireh trovarono i primi sette rotoli nel 1946–47 in quella che oggi si chiama Grotta 1; entro il 1956 undici grotte avevano restituito i resti di quasi un migliaio di manoscritti in ebraico, aramaico e greco, scritti tra il 250 a.C. circa e il 68 d.C., tra cui copie di ogni libro della Bibbia ebraica tranne Ester, il Grande Rotolo di Isaia completo e gli scritti della comunità stessa. Il punto della mappa è Ir-Hammelah, la «città del Sale» di Giosuè, che alcuni identificano con Qumran."
    - "I rotoli sono più antichi di mille anni delle più antiche Bibbie ebraiche note prima di essi, e mostrano come il testo veniva letto ai tempi di Gesù. La regola della comunità applica a se stessa l’appello di Isaia, «La voce d’uno grida: Preparate nel deserto la via dell’Eterno, appianate ne’ luoghi aridi una strada per il nostro Dio!», come un comando di uscire nel deserto; un commento ad Abacuc applica «il giusto vivrà per la sua fede» a coloro che osservano la Legge e sono fedeli al proprio Maestro. Giosuè elenca tra le città di Giuda «Nel deserto: Beth-Araba, Middin, Secacah, Nibshan, Ir-Hammelah e Enghedi: sei città e i loro villaggi», e Secacà, nominata nel Rotolo di Rame, si cerca nella valle di Buqeia sopra Qumran o a Qumran stessa."
    - "Roland de Vaux scavò Khirbet Qumran nel 1951–1956: un insediamento che datò dalla fine del II secolo a.C. al 68 d.C. (per Jodi Magness dal I secolo a.C.), con cisterne, una lunga sala detta scriptorium, ceramica simile a quella delle grotte e un cimitero di oltre mille tombe. Egli e quasi tutti gli studiosi lo ritengono la dimora degli Esseni, che Plinio colloca sulla riva occidentale sopra En-Gedi e che Giuseppe Flavio descrive; secondo la datazione abituale, dalle monete della rivolta, i Romani lo distrussero nel 68. Altri dissentono: per Norman Golb i rotoli erano biblioteche portate da Gerusalemme e nascoste prima dell’assedio, per Yizhar Hirschfeld la rovina era una villa signorile. La maggior parte dei rotoli è nel Santuario del Libro del Museo di Israele e presso l’Autorità israeliana per le Antichità; il Rotolo di Rame è nel Museo della Giordania ad Amman."
  cs:
    - "V jeskyních ve skalách nad severozápadním břehem Mrtvého moře, kolem zříceniny Chirbet Qumrán, na dnešním Západním břehu: asi 15 km jižně od starozákonního Jericha, 22 km východně od Jeruzaléma vzdušnou čarou a 33 km severně od En-gedi. Beduíni z kmene Ta‘amira našli prvních sedm svitků v letech 1946–47 v jeskyni, které se dnes říká jeskyně 1; do roku 1956 poskytlo jedenáct jeskyní zbytky téměř tisíce rukopisů v hebrejštině, aramejštině a řečtině, psaných zhruba mezi lety 250 př. n. l. a 68 n. l., mezi nimi opisy každé knihy hebrejské Bible kromě Ester, úplný Velký svitek Izajášův a spisy samotné obce. Bod na mapě je „město solné“ z Jozua, které někteří ztotožňují s Qumránem."
    - "Svitky jsou o tisíc let starší než nejstarší hebrejské Bible známé před nimi a ukazují, jak se text četl v době Ježíšově. Vlastní řád obce vztahuje na sebe Izajášovo volání, „Hlas volajícího: Připravtež na poušti cestu Hospodinovu, přímou učiňte na pustině stezku Boha našeho“, jako příkaz jít na poušť; komentář k Abakukovi vztahuje „spravedlivý z víry své živ bude“ na ty, kdo zachovávají Zákon a jsou věrní jeho vlastnímu Učiteli. Jozue uvádí mezi městy Judy „Na poušti: Betaraba, Middin a Sechacha“, „A Nibsam, a město solné, a Engadi, měst šest i vsi jejich“ a Sekaka, jmenovaná v Měděném svitku, se hledá v údolí Buqeia nad Qumránem nebo v samotném Qumránu."
    - "Roland de Vaux vykopával Chirbet Qumrán v letech 1951–1956: osídlení, které datoval od konce 2. století př. n. l. do roku 68 n. l. (Jodi Magness je začíná v 1. století př. n. l.), s cisternami, dlouhou místností, kterou nazval skriptoriem, keramikou podobnou té z jeskyní a pohřebištěm s více než tisícem hrobů. On i většina badatelů od té doby pokládají osadu za domov Esejců, které Plinius klade na západní břeh nad En-gedi a které popisuje Josephus; podle obvyklého datování, z mincí povstání, ji Římané zničili roku 68. Jiní nesouhlasí: Norman Golb tvrdil, že svitky byly knihovny přivezené z Jeruzaléma a ukryté před obléháním, a Yizhar Hirschfeld, že zřícenina byla statek. Většina svitků je uložena ve Svatyni knihy Izraelského muzea a u Izraelského úřadu pro starožitnosti; Měděný svitek je v Jordánském muzeu v Ammánu."
  nl:
    - "In grotten in de kliffen boven de noordwestelijke oever van de Dode Zee, rond de ruïne Khirbet Qumran, in de huidige Westelijke Jordaanoever: ongeveer 15 km ten zuiden van het Jericho van het Oude Testament, hemelsbreed 22 km ten oosten van Jeruzalem en 33 km ten noorden van En-Gedi. Bedoeïenen van de Ta'amireh vonden de eerste zeven rollen in 1946–47 in wat nu Grot 1 heet; in 1956 hadden elf grotten de resten van bijna duizend handschriften opgeleverd in het Hebreeuws, Aramees en Grieks, geschreven tussen ongeveer 250 v.Chr. en 68 n.Chr., onder meer afschriften van elk boek van de Hebreeuwse Bijbel behalve Ester, de complete Grote Jesajarol en de geschriften van de gemeenschap zelf. Het punt op de kaart is de “Zoutstad” van Jozua, die sommigen met Qumran identificeren."
    - "De rollen zijn duizend jaar ouder dan de oudste Hebreeuwse bijbels die ervoor bekend waren, en tonen hoe de tekst in de tijd van Jezus werd gelezen. De eigen regel van de gemeenschap past Jesaja's roep, “Een stem des roependen in de woestijn: Bereidt den weg des HEEREN, maakt recht in de wildernis een baan voor onzen God!”, op zichzelf toe als een bevel de woestijn in te gaan; een commentaar op Habakuk past “de rechtvaardige zal door zijn geloof leven” toe op wie de Wet houden en trouw zijn aan zijn eigen Leraar. Jozua noemt onder de steden van Juda: “In de woestijn: Beth-araba, Middin en Sechacha, En Nibsan, en de Zoutstad, en Engedi; zes steden en haar dorpen”, en Sekaka, genoemd in de Koperen Rol, wordt gezocht in het Buqeiadal boven Qumran of bij Qumran zelf."
    - "Roland de Vaux groef Khirbet Qumran op in 1951–1956: een nederzetting die hij dateerde van het eind van de tweede eeuw v.Chr. tot 68 n.Chr. (Jodi Magness: vanaf de eerste eeuw v.Chr.), met cisternes, een lange zaal die hij scriptorium noemde, aardewerk als in de grotten en een begraafplaats van meer dan duizend graven. Hij en de meeste geleerden zien er de Essenen in, die Plinius aan de westoever boven En-Gedi plaatst en Josephus beschrijft; volgens de gebruikelijke datering, naar munten van de opstand, vernietigden de Romeinen het in 68. Anderen denken er anders over: Norman Golb zag in de rollen bibliotheken uit Jeruzalem, voor het beleg verborgen, en Yizhar Hirschfeld in de ruïne een landhuis. De meeste rollen liggen in het Heiligdom van het Boek van het Israëlmuseum en bij de Israëlische Oudheidendienst; de Koperen Rol in het Jordan Museum in Amman."
  sv:
    - "I grottor i klipporna ovanför Döda havets nordvästra strand, kring ruinen Khirbet Qumran, på dagens Västbanken: omkring 15 km söder om Gamla testamentets Jeriko, 22 km öster om Jerusalem i fågelvägen och 33 km norr om En-Gedi. Beduiner av Ta'amirehstammen fann de sju första rullarna 1946–47 i det som nu kallas grotta 1; 1956 hade elva grottor givit resterna av nästan tusen handskrifter på hebreiska, arameiska och grekiska, skrivna mellan omkring 250 f.Kr. och 68 e.Kr., bland dem avskrifter av varje bok i den hebreiska bibeln utom Ester, den fullständiga Stora Jesajarullen och gemenskapens egna skrifter. Kartans punkt är Josuas Ir-Hammelach, Saltstaden, som vissa identifierar med Qumran."
    - "Rullarna är tusen år äldre än de äldsta hebreiska biblar som var kända före dem, och de visar hur texten lästes på Jesu tid. Gemenskapens egen regel tillämpar Jesajas rop, ”Bereden väg för HERREN i öknen, banen på hedmarken en jämn väg för vår Gud”, på sig själv som en befallning att gå ut i öknen; en kommentar till Habackuk tillämpar ”den rättfärdige skall leva genom sin tro” på dem som håller lagen och är trogna sin Lärare. Josua räknar upp bland Judas städer: ”I Öknen: Bet-Haaraba, Middin, Sekaka, Nibsan, Ir-Hammela och En-Gedi – sex städer med sina byar”, och Sekaka, nämnd i Kopparrullen, söks i Buqeiadalen ovanför Qumran eller i Qumran självt."
    - "Roland de Vaux grävde ut Khirbet Qumran 1951–1956: en bosättning som han daterade från slutet av 100-talet f.Kr. till 68 e.Kr. (Jodi Magness: första århundradet f.Kr.), med cisterner, ett långt rum som han kallade ett skriptorium, keramik lik den i grottorna och en begravningsplats med mer än tusen gravar. Han och de flesta sedan dess tar den för essenernas hem, som Plinius placerar på västra stranden ovanför En-Gedi, och som Josefus beskriver; enligt den vanliga dateringen, efter mynt från upproret, förstörde romarna den år 68. Andra är oeniga: Norman Golb hävdade att rullarna var bibliotek som fördes från Jerusalem och gömdes före belägringen, och Yizhar Hirschfeld att ruinen var en herrgård. De flesta rullar förvaras i Bokens helgedom (Shrine of the Book) i Israelmuseet och av Israels fornminnesmyndighet; Kopparrullen finns på Jordan Museum i Amman."
  nb:
    - "I huler i klippene over nordvestbredden av Dødehavet, rundt ruinen Khirbet Qumran, i dagens Vestbredden: omtrent 15 km sør for Jeriko i Det gamle testamentet, 22 km øst for Jerusalem i luftlinje og 33 km nord for En-Gedi. Beduiner fra Ta‘amireh fant de første sju rullene i 1946–47 i det som nå kalles Hule 1; innen 1956 hadde elleve huler gitt restene av nesten tusen håndskrifter på hebraisk, arameisk og gresk, skrevet mellom omkring 250 f.Kr. og 68 e.Kr., blant dem avskrifter av hver bok i den hebraiske bibelen unntatt Ester, den fullstendige Store Jesaja-rullen og samfunnets egne skrifter. Kartets punkt er «Saltbyen» hos Josva, som noen identifiserer med Qumran."
    - "Rullene er tusen år eldre enn de eldste hebraiske bibler som var kjent før dem, og de viser hvordan teksten ble lest på Jesu tid. Samfunnets egen regel anvender Jesajas rop, «Hør! Det er en som roper: Rydd i ørkenen vei for Herren! Gjør i ødemarken en jevn vei for vår Gud!», på seg selv som en befaling om å gå ut i ørkenen; en kommentar til Habakkuk anvender «den rettferdige skal leve ved sin tro» på dem som holder loven og er trofaste mot samfunnets egen lærer. Josva oppregner blant Judas byer «I ørkenen: Bet-Ha’araba, Middin og Sekaka og Hannibsan og Ir-Hammelah og En-Gedi - seks byer med tilhørende landsbyer», og Sekaka, nevnt i Kobberrullen, søkes i Buqeia-dalen over Qumran eller i Qumran selv."
    - "Roland de Vaux gravde ut Khirbet Qumran i 1951–1956: en bosetting han daterte fra slutten av 100-tallet f.Kr. til 68 e.Kr. (Jodi Magness lar den begynne på 1. århundre f.Kr.), med sisterner, et langt rom han kalte et skriptorium, keramikk som den i hulene og en gravplass med mer enn tusen graver. Han og de fleste forskere siden tar det for essenernes hjem, som Plinius plasserer på vestbredden over En-Gedi, og som Josefus beskriver; etter den vanlige dateringen, fra mynter fra opprøret, ødela romerne det i 68. Andre er uenige: Norman Golb hevdet at rullene var biblioteker brakt fra Jerusalem og skjult før beleiringen, og Yizhar Hirschfeld at ruinen var en herregård. De fleste rullene oppbevares i Bokens helligdom i Israel-museet og hos Israels antikvitetsmyndighet; Kobberrullen er i Jordan-museet i Amman."
  tl:
    - "Sa mga yungib sa mga bangin sa itaas ng hilagang-kanlurang pampang ng Dagat na Patay, sa paligid ng guho ng Khirbet Qumran, sa West Bank ngayon: mga 15 km sa timog ng Jerico ng Matandang Tipan, 22 km sa silangan ng Jerusalem sa tuwid na guhit at 33 km sa hilaga ng En-gedi. Natagpuan ng mga Bedouin ng Ta'amireh ang unang pitong balumbon noong 1946–47 sa tinatawag ngayong Yungib 1; pagsapit ng 1956, labing-isang yungib ang nagbigay ng labi ng halos isang libong manuskrito sa Hebreo, Aramaiko at Griyego, na isinulat sa pagitan ng mga 250 BK at 68 AD, kabilang ang mga kopya ng bawat aklat ng Biblia ng Hebreo maliban kay Esther, ang kumpletong Dakilang Balumbon ng Isaias at ang mga sulat ng komunidad mismo. Ang punto ng mapa ay ang “Bayan ng Asin” ng Josue, na itinuturing ng ilan na Qumran."
    - "Mas matanda nang isang libong taon ang mga balumbon kaysa sa pinakamatandang Biblia ng Hebreo na kilala noon, at ipinapakita nila kung paano binasa ang teksto noong panahon ni Jesus. Ikinakapit ng patakaran ng komunidad sa sarili ang panawagan ni Isaias, “Ang tinig ng isang sumisigaw, Ihanda ninyo sa ilang ang daan ng Panginoon pantayin ninyo sa ilang ang lansangan para sa ating Dios”, bilang utos na lumabas sa disyerto; ikinakapit ng isang komentaryo sa Habacuc ang “ang ganap ay mabubuhay sa pamamagitan ng kaniyang pananampalataya” sa mga tumutupad sa Kautusan at tapat sa Guro nito. Itinala ni Josue sa mga bayan ng Juda “Sa ilang; Beth-araba, Middin, at Sechacha… Nibsan, at ang Bayan ng Asin, at En-gedi: anim na bayan pati ng mga nayon ng mga yaon”, at ang Sechacha, na nasa Balumbon na Tanso, ay hinahanap sa lambak ng Buqeia sa itaas ng Qumran o sa Qumran."
    - "Hinukay ni Roland de Vaux ang Khirbet Qumran (1951–1956): pamayanang ipinetsa niya mula huling ika-2 siglo BK hanggang 68 AD (ika-1 siglo BK ayon kay Jodi Magness), na may imbakan ng tubig, mahabang silid na tinawag niyang scriptorium, palayok na gaya ng sa mga yungib at 1,000+ libingan. Siya at karamihan ng mga iskolar ay itinuturing itong tahanan ng mga Essene, na inilalagay ni Plinio sa kanlurang baybayin sa itaas ng En-gedi at inilalarawan ni Josephus; winasak ito ng mga Romano noong 68, batay sa mga barya ng paghihimagsik. Hindi sang-ayon ang iba: para kay Norman Golb, mga aklatang dinala mula sa Jerusalem at itinago bago ang pagkubkob ang mga balumbon, at para kay Yizhar Hirschfeld, maharlikang tahanan ang guho. Nasa Shrine of the Book ng Israel Museum at sa Israel Antiquities Authority ang karamihan; nasa Jordan Museum sa Amman ang Balumbon na Tanso."
  da:
    - "I huler i klipperne over Det Døde Havs nordvestlige bred, omkring ruinen Khirbet Qumran, i dagens Vestbred: ca. 15 km syd for Det Gamle Testamentes Jeriko, 22 km øst for Jerusalem i fugleflugt og 33 km nord for En-Gedi. Beduiner af Ta’amireh-stammen fandt de første syv ruller i 1946-47 i det, der nu kaldes hule 1; i 1956 havde elleve huler givet resterne af næsten tusind håndskrifter på hebraisk, aramæisk og græsk, skrevet mellem ca. 250 f.Kr. og 68 e.Kr., blandt dem afskrifter af alle bøger i den hebraiske bibel undtagen Ester, den fuldstændige store Esajasrulle og samfundets egne skrifter. Kortets punkt er Josvas Ir-Melak (»Saltbyen«), som nogle identificerer med Qumran."
    - "Rullerne er tusind år ældre end de ældste hebraiske bibler kendt før dem, og de viser, hvordan teksten blev læst i Jesu tid. Samfundets egen regel anvender Esajas’ kald, »Der er en Røst af en, som raaber i Ørken: Bereder Herrens Vej, jævner vor Guds banede Vej paa den slette Mark!«, som en befaling om at gå ud i ørkenen; en kommentar til Habakkuk anvender »den retfærdige skal leve ved sin Tro« på dem, der holder loven og er trofaste mod dens egen Lærer. Josva opregner blandt Judas byer »i Ørken« Bet-Araba, Middin og Sekaka, »og Nibsan og Ir-Melak og En-Gedi; seks Stæder og deres Landsbyer«, og Sekaka, nævnt i Kobberrullen, søges i Buqeia-dalen over Qumran eller ved Qumran selv."
    - "Roland de Vaux udgravede Khirbet Qumran i 1951-1956: en bebyggelse, han daterede fra sidst i 100-tallet f.Kr. til 68 e.Kr. (Jodi Magness lader den begynde i 1. århundrede f.Kr.), med cisterner, et langt rum, han kaldte et skriptorium, keramik som i hulerne og en kirkegård med mere end tusind grave. Han og de fleste forskere siden tager den for essæernes hjem, som Plinius placerer på vestkysten over En-Gedi, og som Josefus beskriver; efter den sædvanlige datering, fra oprørets mønter, ødelagde romerne den i 68. Andre er uenige: Norman Golb hævdede, at rullerne var biblioteker bragt fra Jerusalem og skjult før belejringen, og Yizhar Hirschfeld at ruinen var en herregård. De fleste ruller opbevares i Bogens Helligdom på Israel-museet og af Israels Oldsagsmyndighed; Kobberrullen er i Jordan-museet i Amman."
  sr:
    - "У пећинама у литицама изнад северозападне обале Мртвог мора, око рушевине Хирбет Кумран, у данашњој Западној обали: око 15 км јужно од старозаветног Јерихона, 22 км источно од Јерусалима ваздушном линијом и 33 км северно од Енгада. Бедуини из племена Таамире пронашли су првих седам свитака 1946–47 у ономе што се данас зове Пећина 1; до 1956. једанаест пећина дало је остатке скоро хиљаду рукописа на хебрејском, арамејском и грчком, написаних између око 250. п. н. е. и 68. н. е., међу њима преписе сваке књиге хебрејске Библије осим Јестире, потпуни Велики свитак Исаије и списе саме заједнице. Тачка на карти је „град соли“ из Књиге о Исусу Навину, који неки поистовећују са Кумраном."
    - "Свици су хиљаду година старији од најстаријих хебрејских Библија познатих пре њих и показују како се текст читао у Исусово време. Правило саме заједнице примењује на себе Исаијин позив, „Глас је некога који виче: Приправите у пустињи пут Господњи, поравните у пустоши стазу Богу нашем“, као заповест да се изађе у пустињу; коментар Авакума примењује „праведник ће од вере своје жив бити“ на оне који држе Закон и верни су свом Учитељу. Исус Навин набраја међу градове Јуде „У пустињи: Вет-Арава, Мидин и Сехаха, и Нивсан, и град соли, и Енгадија; шест градова са селима својим“, а Сехаха, поменута у Бакарном свитку, тражи се у долини Букеја изнад Кумрана или у самом Кумрану."
    - "Роланд де Во ископавао је Хирбет Кумран 1951–1956: насеље које је датирао од краја другог века п. н. е. до 68. н. е. (Џоди Магнис га почиње у првом веку п. н. е.), са цистернама, дугом просторијом коју је назвао скрипторијум, грнчаријом као у пећинама и гробљем са више од хиљаду гробова. Он и већина научника од тада узимају га за дом Есена, које Плиније смешта на западну обалу изнад Енгада и које описује Јосиф Флавије; по уобичајеном датирању, по новцу из устанка, Римљани су га разорили 68. Други се не слажу: Норман Голб тврдио је да су свици библиотеке донесене из Јерусалима и скривене пред опсаду, а Изхар Хиршфелд да је рушевина била властелинство. Већина свитака чува се у Светињи књиге Музеја Израела и код Израелске управе за старине; Бакарни свитак је у Музеју Јордана у Аману."
