id: where-was-antioch
question:
  en: "Where was Antioch? (both Antiochs of Acts)"
  ru: "Где находилась Антиохия? (обе Антиохии книги Деяний)"
  uk: "Де була Антіохія? (обидві Антіохії Дій)"
  es: "¿Dónde estaba Antioquía? (las dos Antioquías de Hechos)"
  pt: "Onde ficava Antioquia? (as duas Antioquias de Atos)"
  de: "Wo lag Antiochia? (beide Antiochien der Apostelgeschichte)"
  fr: "Où se trouvait Antioche ? (les deux Antioche des Actes)"
answer:
  en:
    - "Acts names two Antiochs. Antioch on the Orontes, the capital of Syria, lay about 25 km from the sea between the river and Mount Silpius; today it is Antakya in southern Turkey, about 500 km north of Jerusalem in a straight line and 611 km by the roads on the map, with Seleucia as its port. Antioch of Pisidia stood on a hill near modern Yalvaç in central Turkey, about 500 km north-west of the Syrian city in a straight line and about 815 km from Jerusalem, also in a straight line."
    - 'Seleucus I founded the Syrian Antioch in 300 BC, and Josephus counts it the third city of the Roman world after Rome and Alexandria. There believers scattered after Stephen''s death preached to Greeks, Barnabas brought Saul from Tarsus, and "the disciples were called Christians first in Antioch". Its church sent relief to Judea in the famine and, at the word of the Holy Spirit, set apart Barnabas and Saul; all three of Paul''s journeys on the map set out from it, and he withstood Peter there.'
    - 'Antioch of Pisidia was a Seleucid foundation that Augustus made a Roman colony after 25 BC; William Ramsay found fragments of a Latin copy of Augustus'' Res Gestae there in 1914. On the first journey Paul and Barnabas "came to Antioch in Pisidia, and went into the synagogue on the sabbath day, and sat down", and there Paul gave the first of his sermons that Acts reports at length; when the Jews opposed them they turned to the Gentiles and were expelled, and went on to Iconium. Many scholars think the Letter to the Galatians was written to these churches of the south of the province; others hold that it went to the north.'
  ru:
    - "Деяния называют две Антиохии. Антиохия на Оронте, столица Сирии, стояла примерно в 25 км от моря между рекой и горой Сильпий; сегодня это Антакья на юге Турции, около 500 км к северу от Иерусалима по прямой и 611 км по дорогам на карте; гаванью ей служила Селевкия. Антиохия Писидийская стояла на холме близ нынешнего Ялвача в центральной Турции, примерно в 500 км к северо-западу от сирийской по прямой и примерно в 815 км от Иерусалима, тоже по прямой."
    - "Сирийскую Антиохию основал Селевк I в 300 г. до н. э., и Иосиф Флавий называет её третьим городом римского мира после Рима и Александрии. Здесь верующие, рассеянные после гибели Стефана, проповедовали Еллинам, Варнава привёл из Тарса Савла, и «ученики в Антиохии в первый раз стали называться Христианами». Её церковь послала помощь в Иудею во время голода и по слову Духа Святого отделила Варнаву и Савла; все три путешествия Павла на карте начинаются отсюда, и здесь он противостал Петру."
    - "Антиохия Писидийская была основана Селевкидами, а после 25 г. до н. э. Август сделал её римской колонией; в 1914 году Уильям Рамзай нашёл здесь фрагменты латинской копии «Деяний Августа». В первом путешествии Павел и Варнава «прибыли в Антиохию Писидийскую и, войдя в синагогу в день субботний, сели»; здесь Павел произнёс первую из своих проповедей, которые Деяния передают подробно, а когда Иудеи воспротивились, апостолы обратились к язычникам, были изгнаны и пошли в Иконию. Многие учёные считают, что Послание к Галатам написано этим церквам юга провинции; другие относят его к северу."
  uk:
    - "Дії називають дві Антіохії. Антіохія на Оронті, столиця Сирії, лежала приблизно за 25 км від моря між річкою і горою Сільпій; нині це Антак'я на півдні Туреччини, приблизно за 500 км на північ від Єрусалиму по прямій і за 611 км дорогами на мапі, з Селевкією як портом. Антіохія Пісідійська стояла на пагорбі поблизу сучасного Ялвача в центральній Туреччині, приблизно за 500 км на північний захід від сирійського міста по прямій і приблизно за 815 км від Єрусалиму, також по прямій."
    - "Селевк I заснував сирійську Антіохію 300 р. до н. е., і Йосиф Флавій вважає її третім містом римського світу після Рима й Александрії. Там віруючі, розсіяні після смерті Стефана, проповідували еллінам, Варнава привів Савла з Тарса, і «ученики в Антиохиї стали найперш звати ся Християнами». Її церква послала допомогу до Юдеї під час голоду і, за словом Святого Духа, відокремила Варнаву й Савла; усі три подорожі Павла на мапі вирушають звідти, і там він протистояв Петрові."
    - "Антіохія Пісідійська була селевкідським заснуванням, яке Август зробив римською колонією після 25 р. до н. е.; Вільям Рамсей знайшов там 1914 р. уламки латинської копії «Діянь божественного Августа» (Res Gestae). Під час першої подорожі Павло й Варнава «прибули в Антиохию Писидийську, і ввійшовши в школу субітнього дня, посїдали», і там Павло виголосив першу з проповідей, які Дії докладно переказують; коли євреї виступили проти них, вони звернулися до язичників, були вигнані й пішли до Іконії. Багато вчених вважають, що Послання до галатів було написане цим церквам півдня провінції; інші стверджують, що воно призначалося півночі."
  es:
    - "Hechos nombra dos Antioquías. Antioquía del Orontes, la capital de Siria, se alzaba a unos 25 km del mar, entre el río y el monte Silpio; hoy es Antakya, en el sur de Turquía, a unos 500 km al norte de Jerusalén en línea recta y a 611 km por los caminos del mapa, con Seleucia como puerto. Antioquía de Pisidia estaba sobre una colina cerca de la actual Yalvaç, en el centro de Turquía, a unos 500 km al noroeste de la ciudad siria en línea recta y a unos 815 km de Jerusalén, también en línea recta."
    - "Seleuco I fundó la Antioquía de Siria en el 300 a. C., y Josefo la cuenta como la tercera ciudad del mundo romano después de Roma y Alejandría. Allí los creyentes dispersados tras la muerte de Esteban predicaron a los griegos, Bernabé trajo a Saulo desde Tarso, y «los discípulos fueron llamados Cristianos primeramente en Antioquía». Su iglesia envió socorro a Judea en la hambruna y, por palabra del Espíritu Santo, apartó a Bernabé y Saulo; los tres viajes de Pablo en el mapa parten de ella, y allí resistió a Pedro."
    - "Antioquía de Pisidia fue una fundación seléucida que Augusto hizo colonia romana después del 25 a. C.; William Ramsay halló allí en 1914 fragmentos de una copia latina de las Res Gestae de Augusto. En el primer viaje Pablo y Bernabé «llegaron á Antioquía de Pisidia, y entrando en la sinagoga un día de sábado, sentáronse», y allí Pablo pronunció el primero de sus sermones que Hechos refiere con detalle; cuando los judíos se opusieron a ellos se volvieron a los gentiles y fueron expulsados, y siguieron hacia Iconio. Muchos estudiosos piensan que la carta a los Gálatas fue escrita a estas iglesias del sur de la provincia; otros sostienen que fue al norte."
  pt:
    - "Atos nomeia duas Antioquias. Antioquia do Orontes, capital da Síria, ficava a cerca de 25 km do mar, entre o rio e o monte Silpio; hoje é Antakya, no sul da Turquia, a cerca de 500 km ao norte de Jerusalém em linha reta e 611 km pelas estradas do mapa, com Selêucia por porto. Antioquia da Pisídia ficava numa colina perto da atual Yalvaç, na Turquia central, a cerca de 500 km a noroeste da cidade síria em linha reta e a cerca de 815 km de Jerusalém, também em linha reta."
    - "Seleuco I fundou a Antioquia síria em 300 a.C., e Josefo a conta como a terceira cidade do mundo romano depois de Roma e Alexandria. Ali os crentes dispersos depois da morte de Estêvão pregaram aos gregos, Barnabé trouxe Saulo de Tarso, e “os discípulos foram chamados cristãos pela primeira vez”. Sua igreja enviou socorro à Judeia na fome e, à palavra do Espírito Santo, separou Barnabé e Saulo; as três viagens de Paulo no mapa partem dela, e ali ele resistiu a Pedro."
    - "Antioquia da Pisídia foi fundação selêucida que Augusto fez colônia romana depois de 25 a.C.; William Ramsay achou ali, em 1914, fragmentos de uma cópia latina das Res Gestae de Augusto. Na primeira viagem Paulo e Barnabé, “passando de Perge, chegaram a Antioquia da Pisídia. Eles entraram na sinagoga no dia de sábado e se assentaram”, e ali Paulo fez o primeiro dos sermões que Atos relata por extenso; quando os judeus se opuseram, voltaram-se para os gentios e foram expulsos, e seguiram para Icônio. Muitos estudiosos pensam que a Carta aos Gálatas foi escrita a essas igrejas do sul da província; outros sustentam que foi ao norte."
  de:
    - "Die Apostelgeschichte nennt zwei Antiochien. Antiochia am Orontes, die Hauptstadt Syriens, lag etwa 25 km vom Meer zwischen dem Fluss und dem Berg Silpios; heute ist es Antakya in der Südtürkei, in der Luftlinie etwa 500 km nördlich von Jerusalem und 611 km auf den Straßen der Karte, mit Seleukia als Hafen. Antiochia in Pisidien lag auf einem Hügel nahe dem heutigen Yalvaç in der Zentraltürkei, in der Luftlinie etwa 500 km nordwestlich der syrischen Stadt und etwa 815 km von Jerusalem, ebenfalls in der Luftlinie."
    - "Seleukos I. gründete das syrische Antiochia 300 v. Chr., und Josephus zählt es als dritte Stadt der römischen Welt nach Rom und Alexandria. Dort predigten die nach Stephanus' Tod zerstreuten Gläubigen den Griechen, Barnabas holte Saulus aus Tarsus, und „daher die Jünger am ersten zu Antiochien Christen genannt wurden“. Ihre Gemeinde schickte Hilfe nach Judäa in der Hungersnot und sonderte auf das Wort des Heiligen Geistes Barnabas und Saulus aus; alle drei Reisen des Paulus auf der Karte brechen von dort auf, und er widerstand dort Petrus."
    - "Antiochia in Pisidien war eine seleukidische Gründung, die Augustus nach 25 v. Chr. zur römischen Kolonie machte; William Ramsay fand dort 1914 Bruchstücke einer lateinischen Kopie der Res Gestae des Augustus. Auf der ersten Reise zogen Paulus und Barnabas von Perge weiter und „kamen gen Antiochien im Lande Pisidien und gingen in die Schule am Sabbattage und setzten sich“, und dort hielt Paulus die erste seiner von der Apostelgeschichte ausführlich berichteten Predigten; als die Juden ihnen widerstanden, wandten sie sich den Heiden zu, wurden vertrieben und zogen nach Ikonion weiter. Viele Gelehrte meinen, der Galaterbrief sei an diese Gemeinden im Süden der Provinz geschrieben worden; andere halten dafür, er sei in den Norden gegangen."
  fr:
    - "Les Actes nomment deux Antioche. Antioche sur l’Oronte, la capitale de la Syrie, se trouvait à environ 25 km de la mer, entre le fleuve et le mont Silpius ; c’est aujourd’hui Antakya, dans le sud de la Turquie, à environ 500 km au nord de Jérusalem en ligne droite et 611 km par les routes de la carte, avec Séleucie pour port. Antioche de Pisidie se dressait sur une colline près de l’actuelle Yalvaç, dans le centre de la Turquie, à environ 500 km au nord-ouest de la ville syrienne en ligne droite et à environ 815 km de Jérusalem, également en ligne droite."
    - "Séleucos Ier fonda l’Antioche de Syrie en 300 av. J.-C., et Josèphe la compte pour la troisième ville du monde romain après Rome et Alexandrie. Là, les croyants dispersés après la mort d’Étienne prêchèrent aux Grecs, Barnabas amena Saul de Tarse, et « Ce fut à Antioche que, pour la première fois, les disciples furent appelés chrétiens ». Son Église envoya des secours en Judée lors de la famine et, sur la parole du Saint-Esprit, mit à part Barnabas et Saul ; les trois voyages de Paul sur la carte en partent, et c’est là qu’il résista à Pierre."
    - "Antioche de Pisidie était une fondation séleucide qu’Auguste fit colonie romaine après 25 av. J.-C. ; William Ramsay y trouva en 1914 des fragments d’une copie latine des Res Gestae d’Auguste. Lors du premier voyage, Paul et Barnabas « arrivèrent à Antioche de Pisidie. Étant entrés dans la synagogue le jour du sabbat, ils s’assirent », et c’est là que Paul prononça le premier de ses discours que les Actes rapportent longuement ; les Juifs s’étant opposés à eux, ils se tournèrent vers les païens, furent chassés, et gagnèrent Icone. Beaucoup de savants pensent que l’épître aux Galates fut écrite à ces Églises du sud de la province ; d’autres tiennent qu’elle alla au nord."
