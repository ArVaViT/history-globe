id: where-was-antioch
question:
  en: "Where was Antioch? (both Antiochs of Acts)"
  ru: "Где находилась Антиохия? (обе Антиохии книги Деяний)"
  uk: "Де була Антіохія? (обидві Антіохії Дій)"
  es: "¿Dónde estaba Antioquía? (las dos Antioquías de Hechos)"
  pt: "Onde ficava Antioquia? (as duas Antioquias de Atos)"
  de: "Wo lag Antiochia? (beide Antiochien der Apostelgeschichte)"
  fr: "Où se trouvait Antioche ? (les deux Antioche des Actes)"
  pl: "Gdzie leżała Antiochia? (obie Antiochie z Dziejów)"
  it: "Dov’era Antiochia? (le due Antiochie degli Atti)"
  nl: "Waar lag Antiochië? (beide Antiochiëen van Handelingen)"
  cs: "Kde byla Antiochie? (obě Antiochie ze Skutků)"
  sv: "Var låg Antiochia? (båda Antiochia i Apostlagärningarna)"
  nb: "Hvor lå Antiokia? (begge Antiokia i Apostlenes gjerninger)"
  tl: "Saan ang Antioquia? (ang dalawang Antioquia ng Mga Gawa)"
  da: "Hvor lå Antiokia? (begge Antiokier i Apostlenes Gerninger)"
  sr: "Где је била Антиохија? (обе Антиохије из Дела)"
answer:
  en:
    - "Acts names two Antiochs. Antioch on the Orontes, the capital of Syria, lay about 25 km from the sea between the river and Mount Silpius; today it is Antakya in southern Turkey, about 500 km north of Jerusalem in a straight line and 611 km by the roads on the map, with Seleucia as its port. Antioch of Pisidia stood on a hill near modern Yalvaç in central Turkey, about 500 km north-west of the Syrian city in a straight line and about 815 km from Jerusalem, also in a straight line."
    - 'Seleucus I founded the Syrian Antioch in 300 BC, and Josephus counts it the third city of the Roman world after Rome and Alexandria. There believers scattered after Stephen''s death preached to Greeks, Barnabas brought Saul from Tarsus, and "the disciples were called Christians first in Antioch". Its church sent relief to Judea in the famine and, at the word of the Holy Spirit, set apart Barnabas and Saul; all three of Paul''s journeys on the map set out from it, and he withstood Peter there.'
    - 'Antioch of Pisidia was a Seleucid foundation that Augustus made a Roman colony after 25 BC; William Ramsay found fragments of a Latin copy of Augustus'' Res Gestae there in 1914. On the first journey Paul and Barnabas "came to Antioch in Pisidia, and went into the synagogue on the sabbath day, and sat down", and there Paul gave the first of his sermons that Acts reports at length; when the Jews opposed them they turned to the Gentiles and were expelled, and went on to Iconium. Many scholars think the Letter to the Galatians was written to these churches of the south of the province; others hold that it went to the north.'
  ru:
    - "Деяния называют две Антиохии. Антиохия на Оронте, столица Сирии, стояла примерно в 25 км от моря между рекой и горой Сильпий; сегодня это Антакья на юге Турции, около 500 км к северу от Иерусалима по прямой и 611 км по дорогам на карте; гаванью ей служила Селевкия. Антиохия Писидийская стояла на холме близ нынешнего Ялвача в центральной Турции, примерно в 500 км к северо-западу от сирийской по прямой и примерно в 815 км от Иерусалима, тоже по прямой."
    - "Сирийскую Антиохию основал Селевк I в 300 г. до н. э., и Иосиф Флавий называет её третьим городом римского мира после Рима и Александрии. Здесь верующие, рассеянные после гибели Стефана, проповедовали Еллинам, Варнава привёл из Тарса Савла, и «ученики в Антиохии в первый раз стали называться Христианами». Её церковь послала помощь в Иудею во время голода и по слову Духа Святого отделила Варнаву и Савла; все три путешествия Павла на карте начинаются отсюда, и здесь он противостал Петру."
    - "Антиохия Писидийская была основана Селевкидами, а после 25 г. до н. э. Август сделал её римской колонией; в 1914 году Уильям Рамзай нашёл здесь фрагменты латинской копии «Деяний Августа». В первом путешествии Павел и Варнава «прибыли в Антиохию Писидийскую и, войдя в синагогу в день субботний, сели»; здесь Павел произнёс первую из своих проповедей, которые Деяния передают подробно, а когда Иудеи воспротивились, апостолы обратились к язычникам, были изгнаны и пошли в Иконию. Многие учёные считают, что Послание к Галатам написано этим церквам юга провинции; другие относят его к северу."
  uk:
    - "Дії називають дві Антіохії. Антіохія на Оронті, столиця Сирії, лежала приблизно за 25 км від моря між річкою і горою Сільпій; нині це Антак'я на півдні Туреччини, приблизно за 500 км на північ від Єрусалиму по прямій і за 611 км дорогами на мапі, з Селевкією як портом. Антіохія Пісідійська стояла на пагорбі поблизу сучасного Ялвача в центральній Туреччині, приблизно за 500 км на північний захід від сирійського міста по прямій і приблизно за 815 км від Єрусалиму, також по прямій."
    - "Селевк I заснував сирійську Антіохію 300 р. до н. е., і Йосиф Флавій вважає її третім містом римського світу після Рима й Александрії. Там віруючі, розсіяні після смерті Стефана, проповідували еллінам, Варнава привів Савла з Тарса, і «ученики в Антиохиї стали найперш звати ся Християнами». Її церква послала допомогу до Юдеї під час голоду і, за словом Святого Духа, відокремила Варнаву й Савла; усі три подорожі Павла на мапі вирушають звідти, і там він протистояв Петрові."
    - "Антіохія Пісідійська була селевкідським заснуванням, яке Август зробив римською колонією після 25 р. до н. е.; Вільям Рамсей знайшов там 1914 р. уламки латинської копії «Діянь божественного Августа» (Res Gestae). Під час першої подорожі Павло й Варнава «прибули в Антиохию Писидийську, і ввійшовши в школу субітнього дня, посїдали», і там Павло виголосив першу з проповідей, які Дії докладно переказують; коли євреї виступили проти них, вони звернулися до язичників, були вигнані й пішли до Іконії. Багато вчених вважають, що Послання до галатів було написане цим церквам півдня провінції; інші стверджують, що воно призначалося півночі."
  es:
    - "Hechos nombra dos Antioquías. Antioquía del Orontes, la capital de Siria, se alzaba a unos 25 km del mar, entre el río y el monte Silpio; hoy es Antakya, en el sur de Turquía, a unos 500 km al norte de Jerusalén en línea recta y a 611 km por los caminos del mapa, con Seleucia como puerto. Antioquía de Pisidia estaba sobre una colina cerca de la actual Yalvaç, en el centro de Turquía, a unos 500 km al noroeste de la ciudad siria en línea recta y a unos 815 km de Jerusalén, también en línea recta."
    - "Seleuco I fundó la Antioquía de Siria en el 300 a. C., y Josefo la cuenta como la tercera ciudad del mundo romano después de Roma y Alejandría. Allí los creyentes dispersados tras la muerte de Esteban predicaron a los griegos, Bernabé trajo a Saulo desde Tarso, y «los discípulos fueron llamados Cristianos primeramente en Antioquía». Su iglesia envió socorro a Judea en la hambruna y, por palabra del Espíritu Santo, apartó a Bernabé y Saulo; los tres viajes de Pablo en el mapa parten de ella, y allí resistió a Pedro."
    - "Antioquía de Pisidia fue una fundación seléucida que Augusto hizo colonia romana después del 25 a. C.; William Ramsay halló allí en 1914 fragmentos de una copia latina de las Res Gestae de Augusto. En el primer viaje Pablo y Bernabé «llegaron á Antioquía de Pisidia, y entrando en la sinagoga un día de sábado, sentáronse», y allí Pablo pronunció el primero de sus sermones que Hechos refiere con detalle; cuando los judíos se opusieron a ellos se volvieron a los gentiles y fueron expulsados, y siguieron hacia Iconio. Muchos estudiosos piensan que la carta a los Gálatas fue escrita a estas iglesias del sur de la provincia; otros sostienen que fue al norte."
  pt:
    - "Atos nomeia duas Antioquias. Antioquia do Orontes, capital da Síria, ficava a cerca de 25 km do mar, entre o rio e o monte Silpio; hoje é Antakya, no sul da Turquia, a cerca de 500 km ao norte de Jerusalém em linha reta e 611 km pelas estradas do mapa, com Selêucia por porto. Antioquia da Pisídia ficava numa colina perto da atual Yalvaç, na Turquia central, a cerca de 500 km a noroeste da cidade síria em linha reta e a cerca de 815 km de Jerusalém, também em linha reta."
    - "Seleuco I fundou a Antioquia síria em 300 a.C., e Josefo a conta como a terceira cidade do mundo romano depois de Roma e Alexandria. Ali os crentes dispersos depois da morte de Estêvão pregaram aos gregos, Barnabé trouxe Saulo de Tarso, e “os discípulos foram chamados cristãos pela primeira vez”. Sua igreja enviou socorro à Judeia na fome e, à palavra do Espírito Santo, separou Barnabé e Saulo; as três viagens de Paulo no mapa partem dela, e ali ele resistiu a Pedro."
    - "Antioquia da Pisídia foi fundação selêucida que Augusto fez colônia romana depois de 25 a.C.; William Ramsay achou ali, em 1914, fragmentos de uma cópia latina das Res Gestae de Augusto. Na primeira viagem Paulo e Barnabé, “passando de Perge, chegaram a Antioquia da Pisídia. Eles entraram na sinagoga no dia de sábado e se assentaram”, e ali Paulo fez o primeiro dos sermões que Atos relata por extenso; quando os judeus se opuseram, voltaram-se para os gentios e foram expulsos, e seguiram para Icônio. Muitos estudiosos pensam que a Carta aos Gálatas foi escrita a essas igrejas do sul da província; outros sustentam que foi ao norte."
  de:
    - "Die Apostelgeschichte nennt zwei Antiochien. Antiochia am Orontes, die Hauptstadt Syriens, lag etwa 25 km vom Meer zwischen dem Fluss und dem Berg Silpios; heute ist es Antakya in der Südtürkei, in der Luftlinie etwa 500 km nördlich von Jerusalem und 611 km auf den Straßen der Karte, mit Seleukia als Hafen. Antiochia in Pisidien lag auf einem Hügel nahe dem heutigen Yalvaç in der Zentraltürkei, in der Luftlinie etwa 500 km nordwestlich der syrischen Stadt und etwa 815 km von Jerusalem, ebenfalls in der Luftlinie."
    - "Seleukos I. gründete das syrische Antiochia 300 v. Chr., und Josephus zählt es als dritte Stadt der römischen Welt nach Rom und Alexandria. Dort predigten die nach Stephanus' Tod zerstreuten Gläubigen den Griechen, Barnabas holte Saulus aus Tarsus, und „daher die Jünger am ersten zu Antiochien Christen genannt wurden“. Ihre Gemeinde schickte Hilfe nach Judäa in der Hungersnot und sonderte auf das Wort des Heiligen Geistes Barnabas und Saulus aus; alle drei Reisen des Paulus auf der Karte brechen von dort auf, und er widerstand dort Petrus."
    - "Antiochia in Pisidien war eine seleukidische Gründung, die Augustus nach 25 v. Chr. zur römischen Kolonie machte; William Ramsay fand dort 1914 Bruchstücke einer lateinischen Kopie der Res Gestae des Augustus. Auf der ersten Reise zogen Paulus und Barnabas von Perge weiter und „kamen gen Antiochien im Lande Pisidien und gingen in die Schule am Sabbattage und setzten sich“, und dort hielt Paulus die erste seiner von der Apostelgeschichte ausführlich berichteten Predigten; als die Juden ihnen widerstanden, wandten sie sich den Heiden zu, wurden vertrieben und zogen nach Ikonion weiter. Viele Gelehrte meinen, der Galaterbrief sei an diese Gemeinden im Süden der Provinz geschrieben worden; andere halten dafür, er sei in den Norden gegangen."
  fr:
    - "Les Actes nomment deux Antioche. Antioche sur l’Oronte, la capitale de la Syrie, se trouvait à environ 25 km de la mer, entre le fleuve et le mont Silpius ; c’est aujourd’hui Antakya, dans le sud de la Turquie, à environ 500 km au nord de Jérusalem en ligne droite et 611 km par les routes de la carte, avec Séleucie pour port. Antioche de Pisidie se dressait sur une colline près de l’actuelle Yalvaç, dans le centre de la Turquie, à environ 500 km au nord-ouest de la ville syrienne en ligne droite et à environ 815 km de Jérusalem, également en ligne droite."
    - "Séleucos Ier fonda l’Antioche de Syrie en 300 av. J.-C., et Josèphe la compte pour la troisième ville du monde romain après Rome et Alexandrie. Là, les croyants dispersés après la mort d’Étienne prêchèrent aux Grecs, Barnabas amena Saul de Tarse, et « Ce fut à Antioche que, pour la première fois, les disciples furent appelés chrétiens ». Son Église envoya des secours en Judée lors de la famine et, sur la parole du Saint-Esprit, mit à part Barnabas et Saul ; les trois voyages de Paul sur la carte en partent, et c’est là qu’il résista à Pierre."
    - "Antioche de Pisidie était une fondation séleucide qu’Auguste fit colonie romaine après 25 av. J.-C. ; William Ramsay y trouva en 1914 des fragments d’une copie latine des Res Gestae d’Auguste. Lors du premier voyage, Paul et Barnabas « arrivèrent à Antioche de Pisidie. Étant entrés dans la synagogue le jour du sabbat, ils s’assirent », et c’est là que Paul prononça le premier de ses discours que les Actes rapportent longuement ; les Juifs s’étant opposés à eux, ils se tournèrent vers les païens, furent chassés, et gagnèrent Icone. Beaucoup de savants pensent que l’épître aux Galates fut écrite à ces Églises du sud de la province ; d’autres tiennent qu’elle alla au nord."
  pl:
    - "Dzieje wymieniają dwie Antiochie. Antiochia nad Orontesem, stolica Syrii, leżała około 25 km od morza między rzeką a górą Silpios; dziś to Antakya w południowej Turcji, około 500 km na północ od Jerozolimy w linii prostej i 611 km drogami z mapy, z Seleucją jako portem. Antiochia Pizydyjska stała na wzgórzu koło dzisiejszego Yalvaç w środkowej Turcji, około 500 km na północny zachód od miasta syryjskiego w linii prostej i około 815 km od Jerozolimy, również w linii prostej."
    - "Seleukos I założył Antiochię syryjską w 300 p.n.e., a Józef Flawiusz uważa ją za trzecie miasto świata rzymskiego po Rzymie i Aleksandrii. Tam wierzący rozproszeni po śmierci Szczepana głosili Grekom, Barnaba sprowadził Szawła z Tarsu i „najpierwej w Antyjochii uczniowie nazwani są Chrześcijanami”. Jej Kościół wysłał pomoc do Judei w czasie głodu i, na słowo Ducha Świętego, odłączył Barnabę i Szawła; wszystkie trzy podróże Pawła na mapie wyruszają stąd, i tu sprzeciwił się Piotrowi."
    - "Antiochia Pizydyjska była założeniem Seleucydów, które August uczynił rzymską kolonią po 25 p.n.e.; William Ramsay znalazł tam w 1914 fragmenty łacińskiej kopii Res Gestae Augusta. W pierwszej podróży Paweł i Barnaba „przyszli do Antyjochii Pisydejskiej, a wszedłszy do bóżnicy w dzień sobotni, usiedli”, i tam Paweł wygłosił pierwsze z kazań, które Dzieje przekazują obszernie; gdy Żydzi im się sprzeciwili, zwrócili się do pogan i zostali wygnani, i poszli dalej do Ikonium. Wielu uczonych sądzi, że List do Galatów napisano do tych Kościołów na południu prowincji; inni uważają, że poszedł na północ."
  it:
    - "Gli Atti nominano due Antiochie. Antiochia sull’Oronte, capitale della Siria, sorgeva a circa 25 km dal mare tra il fiume e il Monte Silpio; oggi è Antakya nella Turchia meridionale, a circa 500 km a nord di Gerusalemme in linea retta e 611 km lungo le strade della mappa, con Seleucia come porto. Antiochia di Pisidia sorgeva su un colle vicino all’odierna Yalvaç nella Turchia centrale, a circa 500 km a nord-ovest della città siriana in linea retta e a circa 815 km da Gerusalemme, anch’essi in linea retta."
    - "Seleuco I fondò l’Antiochia siriana nel 300 a.C., e Giuseppe Flavio la conta come terza città del mondo romano dopo Roma e Alessandria. Là i credenti dispersi dopo la morte di Stefano predicarono ai Greci, Barnaba portò Saulo da Tarso, e «fu in Antiochia che per la prima volta i discepoli furon chiamati Cristiani». La sua chiesa inviò aiuti alla Giudea durante la carestia e, per parola dello Spirito Santo, mise da parte Barnaba e Saulo; tutti e tre i viaggi di Paolo sulla mappa partono da essa, ed egli vi si oppose a Pietro."
    - "Antiochia di Pisidia era una fondazione seleucide che Augusto fece colonia romana dopo il 25 a.C.; William Ramsay vi trovò nel 1914 frammenti di una copia latina delle Res Gestae di Augusto. Nel primo viaggio Paolo e Barnaba «giunsero ad Antiochia di Pisidia; e recatisi il sabato nella sinagoga, si posero a sedere», e là Paolo tenne il primo dei suoi discorsi che gli Atti riportano a lungo; quando i Giudei si opposero a loro, si volsero ai Gentili e furono scacciati, e proseguirono per Icònio. Molti studiosi pensano che la Lettera ai Galati fosse scritta a queste chiese del sud della provincia; altri ritengono che andasse al nord."
  nl:
    - "Handelingen noemt twee Antiochiëen. Antiochië aan de Orontes, de hoofdstad van Syrië, lag ongeveer 25 km van de zee tussen de rivier en de berg Silpius; nu is het Antakya in Zuid-Turkije, hemelsbreed ongeveer 500 km ten noorden van Jeruzalem en 611 km langs de wegen op de kaart, met Seleucië als haven. Antiochië in Pisidië lag op een heuvel bij het huidige Yalvaç in Midden-Turkije, hemelsbreed ongeveer 500 km ten noordwesten van de Syrische stad en ongeveer 815 km van Jeruzalem, eveneens hemelsbreed."
    - "Seleucus I stichtte het Syrische Antiochië in 300 v.Chr., en Josephus rekent het de derde stad van de Romeinse wereld na Rome en Alexandrië. Daar predikten de gelovigen die na de dood van Stefanus verstrooid waren tot de Grieken, haalde Barnabas Saulus uit Tarsus, en “de discipelen eerst te Antiochië Christenen genaamd werden”. Zijn gemeente zond hulp naar Judea bij de hongersnood en zonderde op het woord van de Heilige Geest Barnabas en Saulus af; alle drie de reizen van Paulus op de kaart vertrekken er vandaan, en hij weerstond er Petrus."
    - "Antiochië in Pisidië was een Seleucidische stichting die Augustus na 25 v.Chr. tot Romeinse kolonie maakte; William Ramsay vond er in 1914 fragmenten van een Latijnse kopie van Augustus’ Res Gestae. Op de eerste reis kwamen Paulus en Barnabas “te Antiochië, een stad in Pisidië; en gegaan zijnde in de synagoge op den dag des sabbats, zaten zij neder”, en daar hield Paulus de eerste van zijn preken die Handelingen uitvoerig weergeeft; toen de Joden zich tegen hen verzetten, keerden zij zich tot de heidenen, werden uitgewezen en gingen verder naar Ikonium. Veel geleerden menen dat de Brief aan de Galaten aan deze gemeenten in het zuiden van de provincie was gericht; anderen dat hij naar het noorden ging."
  cs:
    - "Skutky jmenují dvě Antiochie. Antiochie na Orontu, hlavní město Sýrie, ležela asi 25 km od moře mezi řekou a horou Silpios; dnes je to Antakya v jižním Turecku, asi 500 km severně od Jeruzaléma vzdušnou čarou a 611 km po silnicích na mapě, se Seleukeií jako přístavem. Antiochie Pisidská stála na pahorku poblíž dnešního Yalvaçe ve středním Turecku, asi 500 km severozápadně od syrského města vzdušnou čarou a asi 815 km od Jeruzaléma, rovněž vzdušnou čarou."
    - "Seleukos I. založil syrskou Antiochii roku 300 př. n. l. a Josephus Flavius ji počítá za třetí město římského světa po Římě a Alexandrii. Tam věřící rozptýlení po Štěpánově smrti kázali Řekům, Barnabáš přivedl Saula z Tarsu a „nejprv tu v Antiochii učedlníci nazváni jsou křesťané“. Její církev poslala pomoc do Judska při hladu a na slovo Ducha svatého oddělila Barnabáše a Saula; všechny tři Pavlovy cesty na mapě z ní vycházejí a tam se postavil Petrovi."
    - "Antiochie Pisidská byla seleukovskou osadou, kterou Augustus učinil římskou kolonií po roce 25 př. n. l.; William Ramsay tam roku 1914 našel úlomky latinské kopie Augustových Res Gestae. Na první cestě Pavel a Barnabáš „přišli do Antiochie Pisidické, a všedše do školy v den sobotní, posadili se“, a tam Pavel pronesl první ze svých kázání, která Skutky uvádějí obšírně; když jim Židé odporovali, obrátili se k pohanům a byli vyhnáni a šli dál do Ikonia. Mnozí badatelé soudí, že List Galatským byl psán těmto církvím na jihu provincie; jiní míní, že šel na sever."
  sv:
    - "Apostlagärningarna nämner två Antiochia. Antiochia vid Orontes, Syriens huvudstad, låg omkring 25 km från havet mellan floden och berget Silpios; i dag är det Antakya i södra Turkiet, omkring 500 km norr om Jerusalem fågelvägen och 611 km via vägarna på kartan, med Seleukia som hamn. Antiochia i Pisidien låg på en kulle nära dagens Yalvaç i centrala Turkiet, omkring 500 km nordväst om den syriska staden fågelvägen och omkring 815 km från Jerusalem, också fågelvägen."
    - "Seleukos I grundade det syriska Antiochia 300 f.Kr., och Josefus räknar det som den tredje staden i den romerska världen efter Rom och Alexandria. Där förkunnade de troende som skingrats efter Stefanos död för greker, Barnabas hämtade Saul från Tarsos, och ”det var i Antiokia som lärjungarna först begynte kallas ’kristna’”. Dess församling sände hjälp till Judeen under hungersnöden och avskilde, på den helige Andes ord, Barnabas och Saul; alla tre av Paulus resor på kartan utgår därifrån, och där stod han emot Petrus."
    - "Antiochia i Pisidien var en seleukidisk grundläggning som Augustus gjorde till romersk koloni efter 25 f.Kr.; William Ramsay fann där 1914 fragment av en latinsk kopia av Augustus’ Res Gestae. På den första resan ”kommo [Paulus och Barnabas] till Antiokia i Pisidien. Och på sabbatsdagen gingo de in i synagogan och satte sig där”, och där höll Paulus den första av de predikningar som Apostlagärningarna återger utförligt; när judarna motsatte sig dem vände de sig till hedningarna och drevs bort, och gick vidare till Ikonion. Många forskare menar att Galaterbrevet skrevs till dessa församlingar i provinsens södra del; andra hävdar att det gick till norr."
  nb:
    - "Apostlenes gjerninger nevner to Antiokia. Antiokia ved Orontes, Syrias hovedstad, lå omtrent 25 km fra havet mellom elven og Silpius-fjellet; i dag er det Antakya i Sør-Tyrkia, omtrent 500 km nord for Jerusalem i luftlinje og 611 km langs veiene på kartet, med Seleukia som havn. Antiokia i Pisidia lå på en høyde nær dagens Yalvaç i Sentral-Tyrkia, omtrent 500 km nordvest for den syriske byen i luftlinje og omtrent 815 km fra Jerusalem, også i luftlinje."
    - "Seleukos I grunnla det syriske Antiokia i 300 f.Kr., og Josefus regner det som den tredje byen i den romerske verden etter Roma og Aleksandria. Der forkynte de troende som ble spredt etter Stefanus' død, for grekerne, Barnabas hentet Saul fra Tarsos, og «i Antiokia fikk disiplene først navnet kristne». Menigheten sendte hjelp til Judea under hungersnøden og skilte, etter Den hellige ånds ord, ut Barnabas og Saul; alle Paulus' tre reiser på kartet drar ut derfra, og han stod Peter imot der."
    - "Antiokia i Pisidia var en seleukidisk grunnleggelse som Augustus gjorde til romersk koloni etter 25 f.Kr.; William Ramsay fant fragmenter av en latinsk kopi av Augustus' Res Gestae der i 1914. På den første reisen drog Paulus og Barnabas videre fra Perge og «kom til Antiokia i Pisidia, og gikk inn i synagogen på sabbatsdagen og satte sig der», og der holdt Paulus den første av sine prekener som Apostlenes gjerninger gjengir utførlig; da jødene motsatte seg dem, vendte de seg til hedningene og ble utvist, og dro videre til Ikonium. Mange forskere mener at Galaterbrevet ble skrevet til disse menighetene i den sørlige delen av provinsen; andre mener at det gikk til nord."
  tl:
    - "Dalawang Antioquia ang pinangalanan ng Mga Gawa. Ang Antioquia sa Orontes, kabisera ng Siria, ay nasa mga 25 km mula sa dagat sa pagitan ng ilog at ng Bundok Silpius; ngayon ay Antakya ito sa timog Turkiya, mga 500 km sa hilaga ng Jerusalem sa tuwid na guhit at 611 km sa mga daan sa mapa, na ang Seleucia ang daungan nito. Ang Antioquia ng Pisidia ay nakatayo sa burol malapit sa makabagong Yalvaç sa gitnang Turkiya, mga 500 km sa hilagang-kanluran ng lungsod na Siryano sa tuwid na guhit at mga 815 km mula sa Jerusalem, sa tuwid ding guhit."
    - "Itinatag ni Seleuco I ang Antioquia ng Siria noong 300 BK, at itinuturing ito ni Josephus na ikatlong lungsod ng daigdig na Romano pagkatapos ng Roma at Alejandria. Doon, ang mga mananampalatayang nagkalat pagkamatay ni Esteban ay nangaral sa mga Griyego, dinala ni Bernabe si Saul mula sa Tarso, at “ang mga alagad ay pinasimulang tawaging mga Cristiano, sa Antioquia”. Nagpadala ang iglesia nito ng saklolo sa Judea sa taggutom at, sa salita ng Espiritu Santo, itinalaga sina Bernabe at Saul; lahat ng tatlong paglalakbay ni Pablo sa mapa ay nagsimula rito, at sinalungat niya si Pedro roon."
    - "Ang Antioquia ng Pisidia ay itinatag ng mga Seleucida at ginawa ni Augusto na kolonyang Romano pagkatapos ng 25 BK; natagpuan ni William Ramsay doon noong 1914 ang mga piraso ng kopyang Latin ng Res Gestae ni Augusto. Sa unang paglalakbay, sina Pablo at Bernabe ay “nagsidating sa Antioquia ng Pisidia; at sila'y nagsipasok sa sinagoga nang araw ng sabbath, at nagsiupo”, at doon ibinigay ni Pablo ang una sa mga sermon niyang iniulat nang mahaba ng Mga Gawa; nang salungatin sila ng mga Judio ay bumaling sila sa mga Gentil at pinaalis, at nagpatuloy sa Iconio. Iniisip ng maraming iskolar na isinulat ang Liham sa mga taga-Galacia sa mga iglesiang ito sa timog ng lalawigan; ang iba ay sa hilaga."
  da:
    - "Apostlenes Gerninger nævner to Antiokier. Antiokia ved Orontes, Syriens hovedstad, lå omkring 25 km fra havet mellem floden og Silpius-bjerget; i dag er det Antakya i det sydlige Tyrkiet, omkring 500 km nord for Jerusalem i luftlinje og 611 km ad vejene på kortet, med Seleukia som havn. Antiokia i Pisidien lå på en høj nær nutidens Yalvaç i det centrale Tyrkiet, omkring 500 km nordvest for den syriske by i luftlinje og omkring 815 km fra Jerusalem, også i luftlinje."
    - "Seleukos I grundlagde det syriske Antiokia i 300 f.Kr., og Josefus regner det for den tredje by i den romerske verden efter Rom og Alexandria. Dér prædikede de troende, der var spredt efter Stefanus' død, for grækere, Barnabas hentede Saul fra Tarsus, og »Disciplene først i Antiokia bleve kaldte Kristne«. Dets menighed sendte hjælp til Judæa under hungersnøden og afsonderede på Helligåndens ord Barnabas og Saul; alle Paulus' tre rejser på kortet udgår fra det, og han stod Peter imod dér."
    - "Antiokia i Pisidien var en seleukidisk grundlæggelse, som Augustus gjorde til romersk koloni efter 25 f.Kr.; William Ramsay fandt dér i 1914 fragmenter af en latinsk kopi af Augustus' Res Gestae. På den første rejse »kom« Paulus og Barnabas »til Antiokia i Pisidien og gik ind i Synagogen paa Sabbatsdagen og satte sig«, og dér holdt Paulus den første af de prædikener, som Apostlenes Gerninger gengiver udførligt; da jøderne modsatte sig dem, vendte de sig til hedningerne og blev udvist og gik videre til Ikonion. Mange forskere mener, at Galaterbrevet blev skrevet til disse menigheder i provinsens sydlige del; andre hævder, at det gik til de nordlige."
  sr:
    - "Дела именују две Антиохије. Антиохија на Оронту, престоница Сирије, лежала је око 25 км од мора између реке и горе Силпије; данас је то Антакија у јужној Турској, око 500 км северно од Јерусалима правом линијом и 611 км путевима на карти, са Селеукијом као луком. Антиохија Писидијска стајала је на брду близу савременог Јалвача у централној Турској, око 500 км северозападно од сиријског града правом линијом и око 815 км од Јерусалима, такође правом линијом."
    - "Селеук I основао је сиријску Антиохију 300. п. н. е., а Јосиф Флавије је броји трећим градом римског света после Рима и Александрије. Тамо су верници разбијени после Стефанове смрти проповедали Грцима, Варнава је довео Саула из Тарса, и тамо је, како стоји, „и најпре у Антиохији назваше ученике хришћанима“. Њена црква послала је помоћ Јудеји у глади и, по речи Светог Духа, одвојила Варнаву и Саула; сва три Павлова путовања на карти полазе из ње, а он је ту пружио отпор Петру."
    - "Антиохија Писидијска била је селеукидско оснивање које је Август после 25. п. н. е. учинио римском колонијом; Вилијам Ремзи је тамо 1914. пронашао одломке латинске копије Августових „Рес гесте“. На првом путовању Павле и Варнава „дођоше у Антиохију писидијску, и ушавши у зборницу у дан суботни седоше“, и тамо је Павле одржао прву од својих беседа које Дела подробно преносе; кад су им Јевреји пружили отпор, окренули су се незнабошцима и били су протерани, и отишли даље у Икониј. Многи научници мисле да је Посланица Галатима писана овим црквама на југу провинције; други држе да је послата северу."
