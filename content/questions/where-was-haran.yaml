id: where-was-haran
question:
  en: "Where was Haran, where Abraham stopped?"
  ru: "Где находился Харран, где остановился Авраам?"
  uk: "Де був Харан, де зупинився Авраам?"
  es: "¿Dónde estaba Harán, donde se detuvo Abraham?"
  pt: "Onde ficava Harã, onde Abraão parou?"
  de: "Wo lag Haran, wo Abraham haltmachte?"
  fr: "Où se trouvait Charan, où Abraham s’arrêta ?"
  pl: "Gdzie leżał Charan, gdzie zatrzymał się Abraham?"
  it: "Dov’era Carran, dove Abramo si fermò?"
  cs: "Kde ležel Cháran, kde se Abraham zastavil?"
  nl: "Waar lag Haran, waar Abraham halt hield?"
  sv: "Var låg Harran, där Abraham stannade?"
  nb: "Hvor lå Harran, der Abraham gjorde opphold?"
  tl: "Nasaan ang Haran, kung saan huminto si Abraham?"
  da: "Hvor lå Karan, hvor Abraham gjorde ophold?"
  sr: "Где је био Харан, где се Аврам задржао?"
answer:
  en:
    - "Haran is Harran, a town in south-eastern Turkey near the Syrian border, in the valley of the Balikh, a tributary of the Euphrates, about 40 km south-east of Şanlıurfa; the map point stands on its mound, about 665 km north-east of Jerusalem and about 620 km from Shechem in a straight line, and about 925 km from Ur if Ur is Tell el-Muqayyar in southern Iraq. Its name, Harranu, means “road” in Akkadian: it lay where the routes from Nineveh and Babylonia to Syria and Anatolia crossed, about 90 km east of the Euphrates ford at Carchemish, and it was the city of the moon god Sin."
    - "Here Terah stopped on the way from Ur to Canaan, “and they came unto Haran, and dwelt there”, and here he died; from Haran Abram set out at seventy-five with Sarai and Lot, and Stephen recalls that God “removed him into this land” from Charran after his father's death. Two generations later Rebekah sent Jacob back “to Laban my brother to Haran”, where he served fourteen years for Leah and Rachel and where eleven of his sons were born; the well where he met Rachel lay outside the town, among shepherds who told him: “Of Haran are we.” The Haran of the city is not the Haran of the family: Abram's brother Haran, the father of Lot, who died in Ur, is spelt with a different first letter in Hebrew, and the Synodal Bible keeps them apart as Харран and Аран."
    - "The region fits the patriarchs' kin: Abraham's servant went to “the city of Nahor” nearby to find Rebekah, and the names of Abraham's forebears Serug, Nahor and Terah recur as place names around Haran in cuneiform records. The mound of Harran has been dug since the 1950s, but the great temple of Sin known from the texts of Nabonidus has not been securely located, and the standing ruins, the citadel, walls and Umayyad mosque, are of Islamic date. The debate is less about Haran than about Ur: a minority put Ur of the Chaldees in the north near Haran, which would make Terah's journey short. The article on Haran tells the city's later history, from the last king of Assyria to Crassus and Julian."
  ru:
    - "Харран — это Харран, городок на юго-востоке Турции у сирийской границы, в долине реки Белих, притока Евфрата, примерно в 40 км к юго-востоку от Шанлыурфы; точка карты стоит на его холме, примерно в 665 км к северо-востоку от Иерусалима и в 620 км от Сихема по прямой, а от Ура — в 925 км, если Ур — это Телль-эль-Мукайяр на юге Ирака. Его имя, Харрану, по-аккадски означает «дорога»: здесь скрещивались пути из Ниневии и Вавилонии в Сирию и Анатолию, примерно в 90 км к востоку от переправы через Евфрат у Кархемиса, и это был город бога луны Сина."
    - "Здесь Фарра остановился на пути из Ура в Ханаан — «дойдя до Харрана, они остановились там» — и здесь умер; из Харрана Аврам вышел семидесяти пяти лет с Сарой и Лотом, а Стефан вспоминает, что по смерти отца Бог «переселил его… в сию землю». Два поколения спустя Ревекка отослала Иакова «к Лавану, брату моему, в Харран», где он четырнадцать лет служил за Лию и Рахиль и где родились одиннадцать его сыновей; колодец, у которого он встретил Рахиль, лежал за городом, среди пастухов, сказавших ему: «мы из Харрана». Харран-город — не то, что Аран из семьи: брат Аврама Аран, отец Лота, умерший в Уре, пишется по-еврейски с другой первой буквы, и Синодальный перевод разводит их как Харран и Аран."
    - "Край подходит родне патриархов: раб Авраама пошёл за Ревеккой «в город Нахора» неподалёку, а имена предков Авраама — Серух, Нахор и Фарра — встречаются в клинописных текстах как названия мест в округе Харрана. Холм Харрана копают с 1950-х годов, но большой храм Сина, известный по текстам Набонида, до сих пор надёжно не найден, а стоящие руины — цитадель, стены и омейядская мечеть — исламского времени. Спор идёт не столько о Харране, сколько об Уре: меньшинство помещает Ур Халдейский на севере, близ Харрана, и тогда путь Фарры был коротким. Статья о Харране рассказывает позднейшую историю города — от последнего царя Ассирии до Красса и Юлиана."
  uk:
    - "Харан — це Харран, місто на південному сході Туреччини поблизу сирійського кордону, у долині Баліху, притоки Євфрату, приблизно за 40 км на південний схід від Шанлиурфи; точка на мапі стоїть на його пагорбі, приблизно за 665 км на північний схід від Єрусалима і приблизно за 620 км від Сихему по прямій, а від Ура — приблизно за 925 км, якщо Ур — це Телль-ель-Мукаяр на півдні Іраку. Його назва, Харрану, означає по-аккадськи «дорога»: він лежав там, де перетиналися шляхи з Ніневії та Вавилонії до Сирії й Анатолії, приблизно за 90 км на схід від броду через Євфрат у Каркемиші, і був містом місячного бога Сіна."
    - "Тут зупинився Тарах дорогою з Ура до Ханаану: «і прийшли в Гаран та й осїлись там», і тут він помер; з Харана Аврам вирушив у сімдесят п'ять років із Сарою та Лотом, а Стефан згадує, що після смерті батька Авраама з Харану «переселив його (Бог) у сю землю». Через два покоління Ревека відправила Якова назад «до Лабана, брата мого, в Гаран», де він служив чотирнадцять років за Лію та Рахіль і де народилося одинадцятеро його синів; колодязь, біля якого він зустрів Рахіль, лежав за містом, серед пастухів, які сказали йому: «Ми з Гарану». Місто Харан — не те саме, що Харан із родини: брат Аврама Харан, батько Лота, який помер в Урі, пишеться в єврейській мові з іншою першою літерою, і російська Синодальна Біблія розрізняє їх як «Харран» і «Аран»."
    - "Цей край пасує родичам патріархів: слуга Авраама пішов до «Нахорів город» неподалік, щоб знайти Ревеку, а імена предків Авраама — Серуха, Нахора й Тараха — повторюються як топоніми навколо Харана в клинописних записах. Пагорб Харрана розкопують із 1950-х років, але великий храм Сіна, відомий із текстів Набоніда, достеменно не знайдено, а стоячі руїни — цитадель, мури та мечеть Омейядів — мають ісламську дату. Суперечка стосується не так Харана, як Ура: меншість поміщає Ур Халдейський на півночі біля Харана, і тоді дорога Тараха була б короткою. Стаття про Харан розповідає про подальшу історію міста, від останнього царя Ассирії до Красса та Юліана."
  es:
    - "Harán es Harrán, una población del sureste de Turquía, cerca de la frontera siria, en el valle del Balikh, afluente del Éufrates, a unos 40 km al sureste de Şanlıurfa; el punto del mapa está sobre su montículo, a unos 665 km al noreste de Jerusalén y a unos 620 km de Siquem en línea recta, y a unos 925 km de Ur si Ur es Tell el-Muqayyar, en el sur de Irak. Su nombre, Harranu, significa «camino» en acadio: se alzaba donde se cruzaban las rutas de Nínive y Babilonia hacia Siria y Anatolia, a unos 90 km al este del vado del Éufrates en Carquemis, y era la ciudad del dios lunar Sin."
    - "Aquí se detuvo Taré en el camino de Ur a Canaán, «y vinieron hasta Harán, y asentaron allí», y aquí murió; de Harán partió Abram, a los setenta y cinco años, con Sarai y Lot, y Esteban recuerda que Dios «le traspasó á esta tierra» desde Chârán tras la muerte de su padre. Dos generaciones después, Rebeca envió de nuevo a Jacob «á Labán mi hermano, á Harán», donde sirvió catorce años por Lea y Raquel y donde nacieron once de sus hijos; el pozo donde conoció a Raquel estaba fuera de la ciudad, entre pastores que le dijeron: «De Harán somos». El Harán de la ciudad no es el Harán de la familia: el hermano de Abram, Harán, padre de Lot, que murió en Ur, se escribe en hebreo con otra letra inicial, y la Biblia sinodal los mantiene separados como Харран y Аран."
    - "La región encaja con la parentela de los patriarcas: el criado de Abraham fue a «la ciudad de Nachôr», cercana, para buscar a Rebeca, y los nombres de los antepasados de Abraham Serug, Nacor y Taré se repiten como topónimos en torno a Harán en los registros cuneiformes. El montículo de Harrán se excava desde la década de 1950, pero el gran templo de Sin conocido por los textos de Nabonido no se ha localizado con seguridad, y las ruinas en pie, la ciudadela, las murallas y la mezquita omeya, son de época islámica. El debate versa menos sobre Harán que sobre Ur: una minoría sitúa Ur de los caldeos en el norte, cerca de Harán, lo que acortaría el viaje de Taré. El artículo sobre Harán narra la historia posterior de la ciudad, desde el último rey de Asiria hasta Craso y Juliano."
  pt:
    - "Harã é Harran, uma cidade no sudeste da Turquia, perto da fronteira síria, no vale do Balikh, afluente do Eufrates, a cerca de 40 km a sudeste de Şanlıurfa; o ponto do mapa fica sobre o seu monte, a cerca de 665 km a nordeste de Jerusalém, a cerca de 620 km de Siquém em linha reta e a cerca de 925 km de Ur, se Ur for Tell el-Muqayyar, no sul do Iraque. O seu nome, Harranu, significa “estrada” em acádico: ficava onde se cruzavam as rotas de Nínive e da Babilônia para a Síria e a Anatólia, a cerca de 90 km a leste do vau do Eufrates em Carquemis, e era a cidade do deus-lua Sin."
    - "Aqui Terá parou no caminho de Ur para Canaã, “chegaram a Harã e habitaram ali”, e aqui morreu; de Harã Abrão partiu aos setenta e cinco anos com Sarai e Ló, e Estêvão recorda que Deus “o trouxe para esta terra” de Harã depois da morte do pai. Duas gerações depois, Rebeca mandou Jacó de volta “para Labão, meu irmão, em Harã”, onde serviu catorze anos por Lia e Raquel e onde nasceram onze de seus filhos; o poço onde encontrou Raquel ficava fora da cidade, entre pastores que lhe disseram: “Nós somos de Harã.” A Harã da cidade não é a Harã da família: o irmão de Abrão, Harã, pai de Ló, que morreu em Ur, escreve-se em hebraico com uma primeira letra diferente, e a Bíblia Sinodal russa os distingue como Харран e Аран."
    - "A região combina com os parentes dos patriarcas: o servo de Abraão foi “para a cidade de Naor”, perto dali, buscar Rebeca, e os nomes dos antepassados de Abraão, Serugue, Naor e Terá, reaparecem como nomes de lugares em torno de Harã nos registros cuneiformes. O monte de Harran é escavado desde a década de 1950, mas o grande templo de Sin conhecido pelos textos de Nabonido não foi localizado com segurança, e as ruínas de pé, a cidadela, as muralhas e a mesquita omíada, são de data islâmica. O debate é menos sobre Harã do que sobre Ur: uma minoria situa Ur dos Caldeus no norte, perto de Harã, o que tornaria curta a viagem de Terá. O artigo sobre Harã conta a história posterior da cidade, do último rei da Assíria a Crasso e Juliano."
  de:
    - "Haran ist Harran, eine Stadt im Südosten der Türkei nahe der syrischen Grenze, im Tal des Balikh, eines Nebenflusses des Euphrat, etwa 40 km südöstlich von Şanlıurfa; der Kartenpunkt steht auf ihrem Hügel, in der Luftlinie etwa 665 km nordöstlich von Jerusalem und etwa 620 km von Sichem sowie etwa 925 km von Ur, falls Ur Tell el-Muqayyar im Süden des Irak ist. Ihr Name Harranu bedeutet auf Akkadisch „Straße“: Sie lag dort, wo sich die Wege von Ninive und Babylonien nach Syrien und Anatolien kreuzten, etwa 90 km östlich der Euphratfurt bei Karkemisch, und war die Stadt des Mondgottes Sin."
    - "Hier machte Tarach auf dem Weg von Ur nach Kanaan halt, „und sie kamen gen Haran und wohnten daselbst“, und hier starb er; von Haran brach Abram mit fünfundsiebzig Jahren mit Sarai und Lot auf, und Stephanus erinnert, Gott habe ihn von dort, „da sein Vater gestorben war“, „herüber in dies Land“ gebracht. Zwei Generationen später schickte Rebekka Jakob zurück „zu meinem Bruder Laban gen Haran“, wo er vierzehn Jahre um Lea und Rahel diente und elf seiner Söhne geboren wurden; der Brunnen, an dem er Rahel traf, lag vor der Stadt, unter Hirten, die ihm sagten: „Wir sind von Haran.“ Das Haran der Stadt ist nicht das Haran der Familie: Abrams Bruder Haran, der Vater Lots, der in Ur starb, wird im Hebräischen mit einem anderen Anfangsbuchstaben geschrieben, und die Synodalbibel hält sie als Харран und Аран auseinander."
    - "Die Gegend passt zur Sippe der Erzväter: Abrahams Knecht ging zur nahen „Stadt Nahors“, um Rebekka zu finden, und die Namen von Abrahams Vorfahren Serug, Nahor und Tarach kehren in Keilschrifttexten als Ortsnamen um Haran wieder. Der Hügel von Harran wird seit den 1950er-Jahren ausgegraben, doch der große Sin-Tempel, den die Texte des Nabonid kennen, ist nicht sicher lokalisiert, und die stehenden Ruinen, Zitadelle, Mauern und Omajjaden-Moschee, sind islamisch. Die Debatte betrifft weniger Haran als Ur: Eine Minderheit sucht Ur in Chaldäa im Norden nahe Haran, was Tarachs Reise kurz machen würde. Der Artikel über Haran erzählt die spätere Geschichte der Stadt, vom letzten König von Assyrien bis zu Crassus und Julian."
  fr:
    - "Charan est Harran, ville du sud-est de la Turquie, près de la frontière syrienne, dans la vallée du Balikh, affluent de l’Euphrate, à environ 40 km au sud-est de Şanlıurfa ; le point de la carte se trouve sur son tertre, à environ 665 km au nord-est de Jérusalem, à environ 620 km de Sichem à vol d’oiseau, et à environ 925 km d’Ur si Ur est Tell el-Muqayyar, dans le sud de l’Irak. Son nom, Harranu, signifie « route » en akkadien : elle se trouvait au croisement des routes qui menaient de Ninive et de la Babylonie vers la Syrie et l’Anatolie, à environ 90 km à l’est du gué de l’Euphrate à Carkemisch, et c’était la ville du dieu-lune Sin."
    - "Térach s’y arrêta en chemin d’Ur à Canaan, « Ils vinrent jusqu’à Charan, et ils y habitèrent », et il y mourut ; c’est de Charan qu’Abram partit, à soixante-quinze ans, avec Saraï et Lot, et Étienne rappelle qu’après la mort de son père, « Dieu le fit passer dans ce pays » depuis Charran. Deux générations plus tard, Rebecca envoya Jacob « chez Laban, mon frère, à Charan », où il servit quatorze ans pour Léa et Rachel et où naquirent onze de ses fils ; le puits où il rencontra Rachel se trouvait hors de la ville, parmi des bergers qui lui dirent : « Nous sommes de Charan. » Le Charan de la ville n’est pas le Haran de la famille : le frère d’Abram, Haran, père de Lot, mort à Ur, s’écrit en hébreu avec une autre première lettre, et la Bible synodale russe les distingue sous les formes Харран et Аран."
    - "La région convient à la parenté des patriarches : le serviteur d’Abraham alla à proximité « à la ville de Nachor » chercher Rebecca, et les noms des ancêtres d’Abraham, Sérug, Nachor et Térach, reviennent comme noms de lieux autour de Charan dans les textes cunéiformes. Le tertre de Harran est fouillé depuis les années 1950, mais le grand temple de Sin connu par les textes de Nabonide n’a pas été localisé avec certitude, et les ruines encore debout, la citadelle, les remparts et la mosquée omeyyade, sont d’époque islamique. Le débat porte moins sur Charan que sur Ur : une minorité place Ur en Chaldée au nord, près de Charan, ce qui raccourcirait le voyage de Térach. L’article sur Charan raconte l’histoire plus tardive de la ville, du dernier roi d’Assyrie à Crassus et à Julien."
  pl:
    - "Charan to Harran, miasto w południowo-wschodniej Turcji, blisko granicy syryjskiej, w dolinie Balikh, dopływu Eufratu, około 40 km na południowy wschód od Şanlıurfy; punkt na mapie stoi na jego wzgórzu, około 665 km na północny wschód od Jerozolimy i około 620 km od Sychem w linii prostej oraz około 925 km od Ur, jeśli Ur to Tell el-Muqayyar w południowym Iraku. Jego nazwa, Harranu, oznacza w akadyjskim „drogę”: leżało tam, gdzie krzyżowały się szlaki z Niniwy i Babilonii do Syrii i Anatolii, około 90 km na wschód od brodu na Eufracie w Karkemisz, i było miastem boga księżyca Sina."
    - "Tutaj Terach zatrzymał się w drodze z Ur do Kanaanu, „a przyszli aż do Haranu, i mieszkali tam”, i tu umarł; z Charanu wyruszył Abram w wieku siedemdziesięciu pięciu lat z Saraj i Lotem, a Szczepan przypomina, że z Charanu po śmierci jego ojca „przeniósł go Bóg do ziemi tej”. Dwa pokolenia później Rebeka odesłała Jakuba „do Labana, brata mego, do Haranu”, gdzie służył czternaście lat za Leę i Rachelę i gdzie urodziło się jedenastu jego synów; studnia, przy której spotkał Rachelę, leżała poza miastem, wśród pasterzy, którzy powiedzieli mu: „Z Haranu jesteśmy”. Miasto Charan to nie ten sam Haran co w rodzinie: brat Abrama Haran, ojciec Lota, który umarł w Ur, pisze się po hebrajsku inną pierwszą literą, a Biblia synodalna rozróżnia ich jako Харран i Аран."
    - "Region pasuje do rodziny patriarchów: sługa Abrahama udał się do pobliskiego „miasta Nachorowego”, by znaleźć Rebekę, a imiona przodków Abrahama, Serug, Nachor i Terach, powracają jako nazwy miejscowości wokół Charanu w zapisach klinowych. Wzgórze Harran bada się od lat 50. XX wieku, ale wielka świątynia Sina znana z tekstów Nabonida nie została pewnie zlokalizowana, a stojące ruiny, cytadela, mury i meczet Umajjadów, pochodzą z okresu islamskiego. Spór dotyczy mniej Charanu niż Ur: mniejszość umieszcza Ur Chaldejskie na północy, blisko Charanu, co skróciłoby podróż Teracha. Artykuł o Charanie opowiada dalsze dzieje miasta, od ostatniego króla Asyrii po Krassusa i Juliana."
  it:
    - "Carran è Harran, una città della Turchia sud-orientale presso il confine siriano, nella valle del Balikh, un affluente dell’Eufrate, a circa 40 km a sud-est di Şanlıurfa; il punto della mappa si trova sul suo tell, a circa 665 km a nord-est di Gerusalemme e a circa 620 km da Sichem in linea d’aria, e a circa 925 km da Ur se Ur è Tell el-Muqayyar nell’Iraq meridionale. Il suo nome, Harranu, significa «strada» in accadico: sorgeva dove si incrociavano le vie da Ninive e dalla Babilonia verso la Siria e l’Anatolia, a circa 90 km a est del guado dell’Eufrate a Carchemis, ed era la città del dio lunare Sin."
    - "Qui Tarach si fermò durante il viaggio da Ur a Canaan, «e, giunti a Charan, dimorarono quivi», e qui morì; da Carran Abram partì a settantacinque anni con Sarai e Lot, e Stefano ricorda che Dio, dopo la morte del padre di lui, «lo fece venire in questo paese» da Carran. Due generazioni dopo Rebecca rimandò Giacobbe: «fuggi a Charan da Labano mio fratello», dove egli servì quattordici anni per Lia e Rachele e dove nacquero undici dei suoi figli; il pozzo presso cui incontrò Rachele si trovava fuori della città, tra pastori che gli dissero: «Siamo di Charan». Il Carran della città non è l’Aran della famiglia: il fratello di Abram, Aran, padre di Lot, che morì a Ur, si scrive in ebraico con una lettera iniziale diversa, e la Bibbia sinodale li distingue come Харран e Аран."
    - "La regione si accorda con la parentela dei patriarchi: il servo di Abramo andò «alla città di Nahor» nei pressi per trovare Rebecca, e i nomi degli antenati di Abramo, Serug, Nacor e Tarach, ricorrono come toponimi attorno a Carran nei documenti cuneiformi. Il tell di Harran è scavato dagli anni 1950, ma il grande tempio di Sin noto dai testi di Nabonedo non è stato localizzato con sicurezza, e le rovine in piedi, la cittadella, le mura e la moschea omayyade, sono di epoca islamica. Il dibattito riguarda meno Carran che Ur: una minoranza colloca Ur dei Caldei a nord, presso Carran, il che renderebbe breve il viaggio di Tarach. L’articolo su Carran racconta la storia successiva della città, dall’ultimo re d’Assiria a Crasso e a Giuliano."
  cs:
    - "Cháran je Harran, město v jihovýchodním Turecku poblíž syrské hranice, v údolí Balíchu, přítoku Eufratu, asi 40 km jihovýchodně od Şanlıurfy; bod na mapě stojí na jeho pahorku, vzdušnou čarou asi 665 km severovýchodně od Jeruzaléma, asi 620 km od Šekemu a asi 925 km od Uru, je-li Ur Tell el-Muqajjar v jižním Iráku. Jeho jméno, Harranu, znamená akkadsky „cesta“: ležel tam, kde se křížily cesty z Ninive a Babylonie do Sýrie a Anatolie, asi 90 km východně od eufratského brodu u Karkemíše, a byl městem boha měsíce Sína."
    - "Zde se Tarach zastavil na cestě z Uru do Kanaánu, „a přišli až do Cháran, a bydlili tam“, a zde zemřel; z Cháranu se Abram vydal v pětasedmdesáti letech se Sarai a Lotem a Štěpán připomíná, že po smrti jeho otce z Cháran Bůh „přestěhoval jej do země této“. O dvě pokolení později poslala Rebeka Jákoba zpět „k Lábanovi, bratru mému do Cháran“, kde sloužil čtrnáct let za Leu a Ráchel a kde se narodilo jedenáct jeho synů; studna, u níž potkal Ráchel, ležela za městem mezi pastýři, kteří mu řekli: „Jsme z Cháran.“ Cháran města není Háran rodiny: Abramův bratr Háran, otec Lotův, který zemřel v Uru, se v hebrejštině píše jiným prvním písmenem a synodální Bible je rozlišuje jako Харран a Аран."
    - "Kraj odpovídá příbuzenstvu patriarchů: Abrahamův služebník šel nedaleko do „města Náchor“ hledat Rebeku a jména Abrahamových předků Serúg, Nachor a Tarach se v klínopisných záznamech opakují jako místní jména kolem Cháranu. Pahorek Harran se vykopává od 50. let, ale velký chrám Sínův známý z textů Nabonida nebyl bezpečně lokalizován a dochované zříceniny, citadela, hradby a umajjovská mešita, jsou islámského data. Spor se nevede tolik o Cháran jako o Ur: menšina klade Ur Kaldejských na sever poblíž Cháranu, čímž by Tarachova cesta byla krátká. Článek o Cháranu vypráví pozdější dějiny města, od posledního krále Asýrie po Crassa a Juliána."
  nl:
    - "Haran is Harran, een stadje in het zuidoosten van Turkije nabij de Syrische grens, in het dal van de Balikh, een zijrivier van de Eufraat, ongeveer 40 km ten zuidoosten van Şanlıurfa; het punt op de kaart staat op de heuvel van de stad, hemelsbreed ongeveer 665 km ten noordoosten van Jeruzalem, ongeveer 620 km van Sichem en ongeveer 925 km van Ur, als Ur Tell el-Muqayyar in Zuid-Irak is. De naam, Harranu, betekent in het Akkadisch “weg”: het lag waar de routes van Nineve en Babylonië naar Syrië en Anatolië elkaar kruisten, ongeveer 90 km ten oosten van de Eufraatvoorde bij Karkemis, en het was de stad van de maangod Sin."
    - "Hier hield Tarach halt op weg van Ur naar Kanaän, “en zij kwamen tot Haran, en woonden aldaar”, en hier stierf hij; uit Haran vertrok Abram op vijfenzeventigjarige leeftijd met Sarai en Lot, en Stefanus zegt van Charran: “En van daar, nadat zijn vader gestorven was, bracht Hij hem over in dit land”. Twee generaties later stuurde Rebekka Jakob terug met de woorden “vlied gij naar Haran, tot Laban, mijn broeder”; daar diende hij veertien jaar voor Lea en Rachel en daar werden elf van zijn zonen geboren; de put waar hij Rachel ontmoette lag buiten de stad, bij herders die hem zeiden: “Wij zijn van Haran.” Het Haran van de stad is niet het Haran van de familie: Abrams broer Haran, de vader van Lot, die in Ur stierf, wordt in het Hebreeuws met een andere beginletter geschreven, en de Synodale Bijbel houdt ze uit elkaar als Харран en Аран."
    - "De streek past bij de verwanten van de aartsvaders: Abrahams knecht ging naar “de stad van Nahor” in de buurt om Rebekka te vinden, en de namen van Abrahams voorvaderen Serug, Nahor en Tarach keren in spijkerschriftteksten terug als plaatsnamen rond Haran. De heuvel van Harran wordt sinds de jaren vijftig opgegraven, maar de grote tempel van Sin die uit de teksten van Nabonidus bekend is, is niet met zekerheid gelokaliseerd, en de nog staande ruïnes, de citadel, de muren en de Omajjadenmoskee, zijn van islamitische datering. Het debat gaat minder over Haran dan over Ur: een minderheid plaatst Ur der Chaldeeën in het noorden bij Haran, waardoor de reis van Tarach kort zou zijn. Het artikel over Haran vertelt de latere geschiedenis van de stad, van de laatste koning van Assyrië tot Crassus en Julianus."
  sv:
    - "Harran är en stad i sydöstra Turkiet nära den syriska gränsen, i Balikh-dalen, en biflod till Eufrat, omkring 40 km sydost om Şanlıurfa; kartpunkten står på dess kulle, omkring 665 km nordost om Jerusalem och omkring 620 km från Shekem i fågelvägen, och omkring 925 km från Ur om Ur är Tell el-Muqayyar i södra Irak. Dess namn, Harranu, betyder ”väg” på akkadiska: den låg där vägarna från Nineve och Babylonien till Syrien och Anatolien korsades, omkring 90 km öster om vadstället över Eufrat vid Karkemish, och den var månguden Sins stad."
    - "Här stannade Tera på vägen från Ur till Kanaan, ”men när de kommo till Haran, bosatte de sig där”, och här dog han; från Harran bröt Abram upp vid sjuttiofem års ålder med Sarai och Lot, och Stefanos erinrar om att Gud efter faderns död ”bjöd honom att flytta därifrån till detta land”, bort från Karran. Två generationer senare sände Rebecka tillbaka Jakob: ”fly till min broder Laban i Haran”, där han tjänade fjorton år för Lea och Rakel och där elva av hans söner föddes; brunnen där han mötte Rakel låg utanför staden, bland herdar som sade till honom: ”Vi äro från Haran.” Stadens Harran är inte släktens Haran: Abrams bror Haran, Lots fader, som dog i Ur, stavas med en annan första bokstav på hebreiska, och den synodala bibeln håller dem isär som Харран och Аран."
    - "Trakten passar patriarkernas släkt: Abrahams tjänare for till ”Nahors stad” i närheten för att finna Rebecka, och namnen på Abrahams förfäder Serug, Nachor och Tera återkommer som ortnamn kring Harran i kilskriftstexter. Harrans kulle har grävts sedan 1950-talet, men det stora Sin-templet som är känt från Nabonids texter har inte kunnat lokaliseras med säkerhet, och de stående ruinerna, citadellet, murarna och umayyadmoskén, är från islamisk tid. Debatten gäller mindre Harran än Ur: en minoritet förlägger kaldeernas Ur i norr nära Harran, vilket skulle göra Teras resa kort. Artikeln om Harran berättar stadens senare historia, från Assyriens siste kung till Crassus och Julianus."
  nb:
    - "Harran er dagens Harran, en by i Sørøst-Tyrkia nær den syriske grensen, i dalen til Balikh, en sideelv til Eufrat, omtrent 40 km sørøst for Şanlıurfa; kartpunktet står på haugen, omtrent 665 km nordøst for Jerusalem og omtrent 620 km fra Sikem i luftlinje, og omtrent 925 km fra Ur hvis Ur er Tell el-Muqayyar i Sør-Irak. Navnet, Harranu, betyr «vei» på akkadisk: byen lå der veiene fra Ninive og Babylonia til Syria og Anatolia krysset hverandre, omtrent 90 km øst for Eufrat-vadestedet ved Karkemisj, og den var månegudens, Sins, by."
    - "Her gjorde Tarah opphold på veien fra Ur til Kanaan, «og de kom til Karan og bosatte sig der», og her døde han; fra Harran drog Abram av sted, 75 år gammel, med Sarai og Lot, og Stefanus sier om Karan: «derfra lot Gud ham efter farens død flytte til dette land». To slektsledd senere sendte Rebekka Jakob tilbake «til min bror Laban i Karan», der han tjente fjorten år for Lea og Rakel og der elleve av hans sønner ble født; brønnen der han møtte Rakel, lå utenfor byen, blant gjetere som sa til ham: «Vi er fra Karan.» Byen Harran er ikke den samme som slektningen Haran: Abrams bror Haran, Lots far, som døde i Ur, skrives med en annen første bokstav på hebraisk, og den synodale bibelen holder dem fra hverandre som Харран og Аран."
    - "Området passer med patriarkenes slekt: Abrahams tjener dro til «Nakors by» i nærheten for å finne Rebekka, og navnene på Abrahams forfedre Serug, Nahor og Tarah går igjen som stedsnavn rundt Harran i kileskriftkilder. Haugen i Harran har vært gravd siden 1950-årene, men det store Sin-tempelet kjent fra Nabonidos’ tekster er ikke sikkert lokalisert, og de stående ruinene, citadellet, murene og umayyadmoskeen, er fra islamsk tid. Striden gjelder mindre Harran enn Ur: et mindretall plasserer Ur i Kaldea i nord nær Harran, noe som ville gjøre Tarahs reise kort. Artikkelen om Harran forteller byens senere historie, fra Assyrias siste konge til Crassus og Julian."
  tl:
    - "Ang Haran ay ang Harran, isang bayan sa timog-silangang Turkey malapit sa hangganan ng Siria, sa lambak ng Balikh, isang sanga ng Eufrates, mga 40 km sa timog-silangan ng Şanlıurfa; nasa burol nito ang punto sa mapa, mga 665 km sa hilagang-silangan ng Jerusalem at mga 620 km mula sa Sichem sa tuwid na guhit, at mga 925 km mula sa Ur kung ang Ur ay ang Tell el-Muqayyar sa timog Iraq. Ang pangalan nito, Harranu, ay nangangahulugang “daan” sa Akkadian: nasa pook ito kung saan nagkrus ang mga ruta mula sa Ninive at Babilonia patungong Siria at Anatolia, mga 90 km sa silangan ng tawiran ng Eufrates sa Carchemis, at ito ang lungsod ng diyos ng buwan na si Sin."
    - "Dito huminto si Tara patungong Canaan mula sa Ur, “at nagsidating sila sa Haran, at nagsitahan doon”, at dito siya namatay; mula sa Haran umalis si Abram sa edad na 75 kasama sina Sarai at Lot, at ginugunita ni Esteban na “inilipat siya ng Dios sa lupaing ito” mula sa Haran pagkamatay ng kaniyang ama. Pagkaraan ng dalawang salinlahi, ibinalik ni Rebeca si Jacob “kay Laban na aking kapatid, sa Haran”, kung saan siya naglingkod nang labing-apat na taon para kina Lea at Raquel at isinilang ang labing-isa sa kaniyang mga anak; ang balon kung saan niya nakilala si Raquel ay nasa labas ng bayan, sa mga pastol na nagsabi sa kaniya: “Taga Haran kami.” Ang Haran ng lungsod ay hindi ang Haran ng pamilya: ang kapatid ni Abram na si Haran, ang ama ni Lot na namatay sa Ur, ay may ibang unang titik sa Hebreo, at pinag-iiba ng Bibliyang Synodal ang dalawa bilang Харран at Аран."
    - "Akma ang rehiyon sa mga kamag-anak ng mga patriyarka: pumunta ang lingkod ni Abraham sa “bayan ni Nachor” na malapit upang hanapin si Rebeca, at ang mga pangalan ng mga ninuno ni Abraham na sina Serug, Nachor at Tara ay umuulit bilang mga pangalan ng pook sa paligid ng Haran sa mga talaan sa cuneiform. Hinuhukay ang burol ng Harran mula pa noong dekada 1950, ngunit hindi pa tiyak na natutukoy ang malaking templo ni Sin na kilala sa mga teksto ni Nabonidus, at ang mga nakatayong guho, ang kuta, mga pader at moske ng mga Umayyad, ay Islamiko ang petsa. Ang pagtatalo ay mas tungkol sa Ur kaysa sa Haran: may kaunting nagpapalagay na ang Ur ng mga Caldeo ay nasa hilaga malapit sa Haran, na magpapaikli sa paglalakbay ni Tara. Isinasalaysay ng artikulo tungkol sa Haran ang kalaunang kasaysayan ng lungsod, mula sa huling hari ng Asiria hanggang kina Crassus at Juliano."
  da:
    - "Karan er Harran, en by i det sydøstlige Tyrkiet nær den syriske grænse, i dalen ved Balikh, en biflod til Eufrat, ca. 40 km sydøst for Şanlıurfa; kortets punkt står på dens tell, ca. 665 km nordøst for Jerusalem og ca. 620 km fra Sikem i fugleflugt og ca. 925 km fra Ur, hvis Ur er Tell el-Muqayyar i det sydlige Irak. Dens navn, Harranu, betyder »vej« på akkadisk: Den lå, hvor vejene fra Nineve og Babylonien til Syrien og Anatolien krydsede hinanden, ca. 90 km øst for Eufrats vadested ved Karkemisj, og den var månegudens, Sins, by."
    - "Her gjorde Tera holdt på vejen fra Ur til Kana’an, »og de kom til Haran og boede der«, og her døde han; fra Karan drog Abram af sted som 75 år gammel med Saraj og Lot, og Stefanus minder om, at »efter hans Faders Død lod Gud ham flytte derfra hen i dette Land«. To slægtled senere sendte Rebekka Jakob tilbage til »Laban, min Broder, i Karan«, hvor han tjente fjorten år for Lea og Rakel, og hvor elleve af hans sønner blev født; brønden, hvor han mødte Rakel, lå uden for byen, blandt hyrder, der sagde til ham: »Fra Karan ere vi.« Byen Karan er ikke slægtens Haran: Abrams bror Haran, Lots far, som døde i Ur, staves med et andet begyndelsesbogstav på hebraisk, og den synodale bibel holder dem adskilt som Харран og Аран."
    - "Egnen passer til patriarkernes slægt: Abrahams tjener drog til »Nakors Stad« i nærheden for at finde Rebekka, og navnene på Abrahams forfædre Serug, Nahor og Tera går igen som stednavne omkring Karan i kileskriftsoptegnelser. Harrans tell har været udgravet siden 1950’erne, men Sins store tempel, kendt fra Nabonids tekster, er ikke sikkert lokaliseret, og de stående ruiner, citadellet, murene og den umayyadiske moské, er fra islamisk tid. Debatten handler mindre om Karan end om Ur: Et mindretal placerer Ur i Kaldæa i nord nær Karan, hvilket ville gøre Teras rejse kort. Artiklen om Karan fortæller byens senere historie, fra Assyriens sidste konge til Crassus og Julian."
  sr:
    - "Харан је данашњи Харран, градић у југоисточној Турској близу сиријске границе, у долини Балиха, притоке Еуфрата, око 40 км југоисточно од Шанлиурфе; тачка на карти стоји на његовој хумци, око 665 км североисточно од Јерусалима и око 620 км од Сихема ваздушном линијом, и око 925 км од Ура ако је Ур Тел ел-Мукајјар у јужном Ираку. Његово име, Харану, на акадском значи „пут“: лежао је тамо где су се укрштали путеви из Ниниве и Вавилоније ка Сирији и Анадолији, око 90 км источно од газа на Еуфрату код Хархемиса, и био је град бога месеца Сина."
    - "Овде се Тара зауставио на путу из Ура у Ханан, „и дођоше до Харана, и онде се настанише“, и овде је умро; из Харана је Аврам кренуо са седамдесет пет година са Саром и Лотом, а Стефан подсећа да га је Бог из Харана „по смрти оца његовог“ преселио „у ову земљу“. Две генерације касније Ревека је послала Јакова натраг „к Лавану брату мом у Харан“, где је служио четрнаест година за Лију и Рахиљу и где му се родило једанаест синова; бунар на којем је срео Рахиљу лежао је изван града, међу пастирима који су му рекли: „Из Харана смо.“ Харан града није Харан породице: Аврамов брат Харан, Лотов отац, који је умро у Уру, пише се на хебрејском другим почетним словом, а Синодални превод их разликује као Харран и Аран."
    - "Област одговара родбини патријарха: Аврамов слуга отишао је „до града Нахоровог“ у близини да пронађе Ревеку, а имена Аврамових предака Серуха, Нахора и Таре понављају се као називи места око Харана у клинописним записима. Хумка Харана копа се од 1950-их, али велики храм Сина познат из Набонидових текстова није поуздано пронађен, а рушевине које стоје, тврђава, зидови и омајадска џамија, потичу из исламског доба. Спор није толико о Харану колико о Уру: мањина смешта Ур халдејски на север, близу Харана, чиме би Тарино путовање било кратко. Чланак о Харану прича каснију историју града, од последњег краља Асирије до Краса и Јулијана."
