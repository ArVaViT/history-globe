id: where-were-the-seven-churches
question:
  en: "Where were the seven churches of Revelation?"
  ru: "Где находились семь церквей Откровения?"
  uk: "Де були сім церков Одкровення?"
  es: "¿Dónde estaban las siete iglesias del Apocalipsis?"
  pt: "Onde ficavam as sete igrejas do Apocalipse?"
  de: "Wo lagen die sieben Gemeinden der Offenbarung?"
  fr: "Où se trouvaient les sept Églises de l’Apocalypse ?"
  pl: "Gdzie leżało siedem zborów z Apokalipsy?"
  it: "Dove si trovavano le sette chiese dell’Apocalisse?"
  cs: "Kde bylo sedm církví Zjevení?"
  nl: "Waar lagen de zeven gemeenten van de Openbaring?"
  sv: "Var låg Uppenbarelsebokens sju församlingar?"
  nb: "Hvor lå Åpenbaringens sju menigheter?"
  tl: "Nasaan ang pitong iglesia ng Apocalipsis?"
  da: "Hvor lå Johannes’ Åbenbarings syv menigheder?"
  sr: "Где је било седам цркава из Откривења?"
  hu: "Hol voltak a Jelenések könyvének hét gyülekezete?"
  fi: "Missä Ilmestyskirjan seitsemän seurakuntaa sijaitsivat?"
  vi: "Bảy Hội thánh trong sách Khải Huyền ở đâu?"
  ro: "Unde se aflau cele șapte biserici din Apocalipsă?"
  bg: "Къде са се намирали седемте църкви от Откровение?"
answer:
  en:
    - "All seven churches were in the Roman province of Asia, in the west of today's Turkey: Ephesus (by Selçuk), Smyrna (İzmir), Pergamum (Bergama), Thyatira (Akhisar), Sardis (by the village of Sart), Philadelphia (Alaşehir) and Laodicea (near Denizli)."
    - 'John on Patmos is told: "What thou seest, write in a book, and send it unto the seven churches which are in Asia; unto Ephesus, and unto Smyrna, and unto Pergamos, and unto Thyatira, and unto Sardis, and unto Philadelphia, and unto Laodicea." The order is a round by road: north from Ephesus along the coast to Smyrna and Pergamum, then inland and south-east through Thyatira, Sardis and Philadelphia to Laodicea in the Lycus valley. By the Roman roads on the map the legs measure 77, 110, 76, 56, 47 and 94 km, about 460 km in all.'
    - "Ephesus was the seat of the proconsul and one of the largest cities of the East; Smyrna and Pergamum had temples of Rome and the emperors; Sardis had been the capital of Lydia; Thyatira was a market town of trade guilds, Philadelphia a city often shaken by earthquakes, and Laodicea a wealthy city that rebuilt itself after the earthquake of AD 60 without help from Rome. The letters were written, by the usual dating, about AD 95 under Domitian; some place them about AD 68. Of the seven, only İzmir is a large city today; the others are ruins or small towns beside them."
  ru:
    - "Все семь церквей находились в римской провинции Асия, на западе нынешней Турции: Ефес (у Сельчука), Смирна (Измир), Пергам (Бергама), Фиатира (Акхисар), Сардис (у деревни Сарт), Филадельфия (Алашехир) и Лаодикия (близ Денизли)."
    - "Иоанну на Патмосе сказано: «то, что видишь, напиши в книгу и пошли церквам, находящимся в Асии: в Ефес, и в Смирну, и в Пергам, и в Фиатиру, и в Сардис, и в Филадельфию, и в Лаодикию». Порядок — круг по дорогам: от Ефеса на север вдоль берега в Смирну и Пергам, затем вглубь страны и на юго-восток через Фиатиру, Сардис и Филадельфию в Лаодикию в долине Лика. По римским дорогам на карте отрезки составляют 77, 110, 76, 56, 47 и 94 км, всего около 460 км."
    - "Ефес был резиденцией проконсула и одним из крупнейших городов Востока; в Смирне и Пергаме стояли храмы Рима и императоров; Сардис был столицей Лидии; Фиатира — торговым городом ремесленных союзов, Филадельфия — городом частых землетрясений, а Лаодикия — богатым городом, который после землетрясения 60 г. н. э. отстроился без помощи Рима. Послания написаны, по обычной датировке, около 95 г. при Домициане; некоторые относят их к 68 г. Из семи городов только Измир сегодня большой город; остальные — руины или небольшие города рядом с ними."
  uk:
    - "Усі сім церков були в римській провінції Азія, на заході нинішньої Туреччини: Ефес (біля Сельчука), Смирна (Ізмір), Пергам (Бергама), Тіатира (Ахісар), Сарди (біля села Сарт), Філадельфія (Алашехір) і Лаодікея (біля Денізлі)."
    - "Іванові на Патмосі сказано: «що бачиш, напиши в книгу; і пішли церквам, що в Азиї: в Ефез, і в Смирну, і в Пергам, і в Тиятир, і в Сарди, і в Филадельфию, і в Лаодикию.» Порядок — це обхід дорогами: на північ від Ефеса вздовж узбережжя до Смирни та Пергама, потім углиб країни й на південний схід через Тіатиру, Сарди та Філадельфію до Лаодікеї в долині Ліка. За римськими дорогами на мапі відрізки становлять 77, 110, 76, 56, 47 і 94 км, разом близько 460 км."
    - "Ефес був осідком проконсула і одним із найбільших міст Сходу; Смирна й Пергам мали храми Роми та імператорів; Сарди були столицею Лідії; Тіатира — торговим містом цехів, Філадельфія — містом, яке часто трусили землетруси, а Лаодікея — багатим містом, що відбудувалося після землетрусу 60 р. н. е. без допомоги Риму. Листи було написано, за звичайною датою, близько 95 р. н. е. за Доміціана; дехто відносить їх до близько 68 р. н. е. З семи лише Ізмір нині велике місто; решта — руїни чи малі містечка біля них."
  es:
    - "Las siete iglesias estaban en la provincia romana de Asia, en el oeste de la actual Turquía: Éfeso (junto a Selçuk), Esmirna (İzmir), Pérgamo (Bergama), Tiatira (Akhisar), Sardis (junto a la aldea de Sart), Filadelfia (Alaşehir) y Laodicea (cerca de Denizli)."
    - "A Juan en Patmos se le dice: «Escribe en un libro lo que ves… á las siete iglesias que están en Asia; á Efeso, y á Smirna, y á Pérgamo, y á Tiatira, y á Sardis, y á Filadelfia, y á Laodicea». El orden es un recorrido por calzada: al norte desde Éfeso por la costa hasta Esmirna y Pérgamo, y luego tierra adentro y al sureste por Tiatira, Sardis y Filadelfia hasta Laodicea, en el valle del Lico. Por las calzadas romanas del mapa, los tramos miden 77, 110, 76, 56, 47 y 94 km, unos 460 km en total."
    - "Éfeso era la sede del procónsul y una de las mayores ciudades de Oriente; Esmirna y Pérgamo tenían templos de Roma y de los emperadores; Sardis había sido la capital de Lidia; Tiatira era una ciudad comercial de gremios, Filadelfia una ciudad a menudo sacudida por terremotos, y Laodicea una ciudad rica que se reconstruyó tras el terremoto del 60 d. C. sin ayuda de Roma. Las cartas se escribieron, según la datación habitual, hacia el 95 d. C. bajo Domiciano; algunos las sitúan hacia el 68 d. C. De las siete, solo İzmir es hoy una gran ciudad; las demás son ruinas o pequeñas poblaciones junto a ellas."
  pt:
    - "As sete igrejas ficavam todas na província romana da Ásia, no oeste da atual Turquia: Éfeso (junto a Selçuk), Esmirna (İzmir), Pérgamo (Bergama), Tiatira (Akhisar), Sardes (junto à aldeia de Sart), Filadélfia (Alaşehir) e Laodiceia (perto de Denizli)."
    - "A João, em Patmos, é dito: “O que você vê, escreva em um livro e envie às sete igrejas: a Éfeso, a Esmirna, a Pérgamo, a Tiatira, a Sardes, a Filadélfia e a Laodiceia.” A ordem é um circuito por estrada: ao norte, de Éfeso ao longo da costa até Esmirna e Pérgamo, depois para o interior e para o sudeste, por Tiatira, Sardes e Filadélfia até Laodiceia, no vale do Lico. Pelas estradas romanas do mapa, os trechos medem 77, 110, 76, 56, 47 e 94 km, cerca de 460 km ao todo."
    - "Éfeso era a sede do procônsul e uma das maiores cidades do Oriente; Esmirna e Pérgamo tinham templos de Roma e dos imperadores; Sardes fora a capital da Lídia; Tiatira era uma cidade comercial de corporações de ofício, Filadélfia uma cidade frequentemente abalada por terremotos, e Laodiceia uma cidade rica que se reconstruiu depois do terremoto de 60 d.C. sem ajuda de Roma. As cartas foram escritas, pela datação usual, por volta de 95 d.C., sob Domiciano; alguns as situam por volta de 68 d.C. Das sete, apenas İzmir é hoje uma grande cidade; as outras são ruínas ou pequenas cidades ao lado delas."
  de:
    - "Alle sieben Gemeinden lagen in der römischen Provinz Asia, im Westen der heutigen Türkei: Ephesus (bei Selçuk), Smyrna (İzmir), Pergamon (Bergama), Thyatira (Akhisar), Sardes (beim Dorf Sart), Philadelphia (Alaşehir) und Laodizea (bei Denizli)."
    - "Johannes auf Patmos wird gesagt: „was du siehst, das schreibe in ein Buch und sende es zu den Gemeinden in Asien: gen Ephesus und gen Smyrna und gen Pergamus und gen Thyatira und gen Sardes und gen Philadelphia und gen Laodizea.“ Die Reihenfolge ist eine Rundreise auf der Straße: von Ephesus die Küste entlang nach Norden nach Smyrna und Pergamon, dann landeinwärts nach Südosten durch Thyatira, Sardes und Philadelphia nach Laodizea im Lykostal. Auf den Römerstraßen der Karte messen die Abschnitte 77, 110, 76, 56, 47 und 94 km, insgesamt etwa 460 km."
    - "Ephesus war Sitz des Prokonsuls und eine der größten Städte des Ostens; Smyrna und Pergamon hatten Tempel für Roma und die Kaiser; Sardes war die Hauptstadt Lydiens gewesen; Thyatira war eine Marktstadt der Handwerkszünfte, Philadelphia eine oft von Erdbeben erschütterte Stadt und Laodizea eine reiche Stadt, die sich nach dem Erdbeben von 60 n. Chr. ohne Hilfe Roms wieder aufbaute. Die Sendschreiben wurden nach der üblichen Datierung um 95 n. Chr. unter Domitian geschrieben; manche setzen sie um 68 n. Chr. an. Von den sieben ist heute nur İzmir eine Großstadt; die anderen sind Ruinen oder kleine Städte daneben."
  fr:
    - "Les sept Églises se trouvaient toutes dans la province romaine d’Asie, dans l’ouest de la Turquie actuelle : Éphèse (près de Selçuk), Smyrne (Izmir), Pergame (Bergama), Thyatire (Akhisar), Sardes (près du village de Sart), Philadelphie (Alaşehir) et Laodicée (près de Denizli)."
    - "Jean, à Patmos, reçoit cet ordre : « Ce que tu vois, écris-le dans un livre, et envoie-le aux sept Églises, à Éphèse, à Smyrne, à Pergame, à Thyatire, à Sardes, à Philadelphie, et à Laodicée. » L’ordre est une tournée par la route : vers le nord depuis Éphèse le long de la côte jusqu’à Smyrne et Pergame, puis vers l’intérieur et le sud-est par Thyatire, Sardes et Philadelphie jusqu’à Laodicée dans la vallée du Lycos. Par les voies romaines de la carte, les étapes mesurent 77, 110, 76, 56, 47 et 94 km, environ 460 km en tout."
    - "Éphèse était le siège du proconsul et l’une des plus grandes villes de l’Orient ; Smyrne et Pergame avaient des temples de Rome et des empereurs ; Sardes avait été la capitale de la Lydie ; Thyatire était une ville de marché aux corporations de métiers, Philadelphie une ville souvent secouée par les tremblements de terre, et Laodicée une ville riche qui se reconstruisit après le tremblement de terre de 60 apr. J.-C. sans l’aide de Rome. Les lettres furent écrites, selon la datation habituelle, vers 95 apr. J.-C. sous Domitien ; certains les placent vers 68 apr. J.-C. Des sept, seule Izmir est aujourd’hui une grande ville ; les autres sont des ruines ou de petites villes à côté."
  pl:
    - "Wszystkie siedem zborów leżało w rzymskiej prowincji Azja, na zachodzie dzisiejszej Turcji: Efez (koło Selçuk), Smyrna (Izmir), Pergamon (Bergama), Tiatyra (Akhisar), Sardes (koło wsi Sart), Filadelfia (Alaşehir) i Laodycea (koło Denizli)."
    - "Janowi na Patmos powiedziano: „a co widzisz, napisz w księgi i poślij siedmiu zborom, które są w Azyi, do Efezu i do Smyrny, i do Pergamu, i do Tyjatyru, i do Sardów, i do Filadelfii, i do Laodycei”. Kolejność jest obiegiem po drogach: na północ od Efezu wzdłuż wybrzeża do Smyrny i Pergamonu, potem w głąb lądu i na południowy wschód przez Tiatyrę, Sardes i Filadelfię do Laodycei w dolinie Likosu. Rzymskimi drogami z mapy odcinki mierzą 77, 110, 76, 56, 47 i 94 km, w sumie około 460 km."
    - "Efez był siedzibą prokonsula i jednym z największych miast Wschodu; Smyrna i Pergamon miały świątynie Romy i cesarzy; Sardes było stolicą Lidii; Tiatyra była miastem targowym cechów, Filadelfia miastem często wstrząsanym trzęsieniami ziemi, a Laodycea bogatym miastem, które odbudowało się po trzęsieniu ziemi w 60 n.e. bez pomocy Rzymu. Listy napisano, według zwykłego datowania, około 95 n.e. za Domicjana; niektórzy umieszczają je około 68 n.e. Z siedmiu tylko Izmir jest dziś dużym miastem; pozostałe to ruiny lub małe miasta obok nich."
  it:
    - "Tutte e sette le chiese si trovavano nella provincia romana d’Asia, nella Turchia occidentale odierna: Efeso (presso Selçuk), Smirne (İzmir), Pergamo (Bergama), Tiatira (Akhisar), Sardi (presso il villaggio di Sart), Filadelfia (Alaşehir) e Laodicea (presso Denizli)."
    - "A Giovanni a Patmos è detto: «Quel che tu vedi, scrivilo in un libro e mandalo alle sette chiese: a Efeso, a Smirne, a Pergamo, a Tiatiri, a Sardi, a Filadelfia e a Laodicea». L’ordine è un giro per strada: a nord da Efeso lungo la costa fino a Smirne e Pergamo, poi nell’entroterra e a sud-est attraverso Tiatira, Sardi e Filadelfia fino a Laodicea nella valle del Lico. Lungo le strade romane della mappa le tappe misurano 77, 110, 76, 56, 47 e 94 km, circa 460 km in tutto."
    - "Efeso era la sede del proconsole e una delle più grandi città dell’Oriente; Smirne e Pergamo avevano templi di Roma e degli imperatori; Sardi era stata la capitale della Lidia; Tiatira era una cittadina di mercato di corporazioni di mestiere, Filadelfia una città spesso scossa dai terremoti, e Laodicea una città ricca che si ricostruì dopo il terremoto del 60 d.C. senza aiuto da Roma. Le lettere furono scritte, secondo la datazione abituale, verso il 95 d.C. sotto Domiziano; alcuni le collocano verso il 68 d.C. Delle sette, solo İzmir è oggi una grande città; le altre sono rovine o piccole città accanto ad esse."
  cs:
    - "Všech sedm církví leželo v římské provincii Asii, na západě dnešního Turecka: Efez (u Selçuku), Smyrna (İzmir), Pergamon (Bergama), Tyatira (Akhisar), Sardy (u vsi Sart), Filadelfie (Alaşehir) a Laodikeia (poblíž Denizli)."
    - "Jan na Patmu slyší: „Co vidíš, piš do knihy, a pošli sborům, kteříž jsou v Azii, do Efezu, a do Smyrny, a do Pergamu, a do Tyatiru, a do Sardy, a do Filadelfie, i do Laodicie.“ Pořadí je okruh po silnicích: na sever od Efezu podél pobřeží do Smyrny a Pergamonu, pak do vnitrozemí a na jihovýchod přes Tyatiru, Sardy a Filadelfii do Laodikeie v údolí Lykosu. Podle římských silnic na mapě měří jednotlivé úseky 77, 110, 76, 56, 47 a 94 km, dohromady asi 460 km."
    - "Efez byl sídlem prokonzula a jedním z největších měst Východu; Smyrna a Pergamon měly chrámy Říma a císařů; Sardy byly hlavním městem Lýdie; Tyatira byla tržním městem obchodních cechů, Filadelfie městem často otřásaným zemětřeseními a Laodikeia bohatým městem, které se po zemětřesení roku 60 n. l. obnovilo bez pomoci Říma. Listy byly podle obvyklého datování napsány kolem roku 95 n. l. za Domitiana; někteří je kladou kolem roku 68 n. l. Ze sedmi je dnes velkým městem jen İzmir; ostatní jsou zříceniny nebo malá města vedle nich."
  nl:
    - "Alle zeven gemeenten lagen in de Romeinse provincie Asia, in het westen van het huidige Turkije: Efeze (bij Selçuk), Smyrna (İzmir), Pergamum (Bergama), Thyatira (Akhisar), Sardes (bij het dorp Sart), Filadelfia (Alaşehir) en Laodicea (nabij Denizli)."
    - "Johannes op Patmos krijgt te horen: “hetgeen gij ziet, schrijf dat in een boek, en zend het aan de zeven Gemeenten, die in Azië zijn, namelijk naar Efeze, en naar Smyrna, en naar Pergamus, en naar Thyatire, en naar Sardis, en naar Filadelfia, en naar Laodicea.” De volgorde is een rondgang langs de weg: noordwaarts vanuit Efeze langs de kust naar Smyrna en Pergamum, daarna landinwaarts en zuidoostwaarts via Thyatira, Sardes en Filadelfia naar Laodicea in het Lycusdal. Via de Romeinse wegen op de kaart meten de etappes 77, 110, 76, 56, 47 en 94 km, samen ongeveer 460 km."
    - "Efeze was de zetel van de proconsul en een van de grootste steden van het Oosten; Smyrna en Pergamum hadden tempels van Rome en de keizers; Sardes was de hoofdstad van Lydië geweest; Thyatira was een marktstad van handelsgilden, Filadelfia een stad die vaak door aardbevingen werd getroffen, en Laodicea een rijke stad die zich na de aardbeving van 60 n.Chr. zonder hulp van Rome herbouwde. De brieven zijn volgens de gebruikelijke datering omstreeks 95 n.Chr. geschreven onder Domitianus; sommigen plaatsen ze omstreeks 68. Van de zeven is alleen İzmir nu een grote stad; de andere zijn ruïnes of kleine steden ernaast."
  sv:
    - "Alla sju församlingar låg i den romerska provinsen Asien, i västra Turkiet: Efesos (vid Selçuk), Smyrna (İzmir), Pergamon (Bergama), Tyatira (Akhisar), Sardes (vid byn Sart), Filadelfia (Alaşehir) och Laodikeia (nära Denizli)."
    - "Johannes på Patmos får höra: ”Skriv upp i en bok vad du får se, och sänd den till de sju församlingarna i Efesus och Smyrna och Pergamus och Tyatira och Sardes och Filadelfia och Laodicea.” Ordningen är en runda längs vägarna: norrut från Efesos längs kusten till Smyrna och Pergamon, sedan inåt landet och sydost genom Tyatira, Sardes och Filadelfia till Laodikeia i Lykosdalen. Längs de romerska vägarna på kartan mäter sträckorna 77, 110, 76, 56, 47 och 94 km, omkring 460 km sammanlagt."
    - "Efesos var prokonsulns säte och en av Österlandets största städer; Smyrna och Pergamon hade tempel för Rom och kejsarna; Sardes hade varit Lydiens huvudstad; Tyatira var en handelsstad med skrån, Filadelfia en stad som ofta skakades av jordbävningar och Laodikeia en rik stad som byggde upp sig själv efter jordbävningen år 60 e.Kr. utan hjälp från Rom. Breven skrevs, enligt den vanliga dateringen, omkring år 95 e.Kr. under Domitianus; vissa förlägger dem till omkring år 68. Av de sju är bara İzmir en stor stad i dag; de andra är ruiner eller små städer bredvid dem."
  nb:
    - "Alle de sju menighetene lå i den romerske provinsen Asia, i vestlige Tyrkia i dag: Efesos (ved Selçuk), Smyrna (İzmir), Pergamon (Bergama), Tyatira (Akhisar), Sardes (ved landsbyen Sart), Filadelfia (Alaşehir) og Laodikea (nær Denizli)."
    - "Johannes på Patmos får beskjed: «Det du ser, skriv det i en bok og send det til de syv menigheter, til Efesus og til Smyrna og til Pergamum og til Tyatira og til Sardes og til Filadelfia og til Laodikea.» Rekkefølgen er en runde langs veien: nordover fra Efesos langs kysten til Smyrna og Pergamon, så innover i landet og sørøstover gjennom Tyatira, Sardes og Filadelfia til Laodikea i Lykos-dalen. Langs de romerske veiene på kartet måler etappene 77, 110, 76, 56, 47 og 94 km, omtrent 460 km til sammen."
    - "Efesos var setet for prokonsulen og en av Østens største byer; Smyrna og Pergamon hadde templer for Roma og keiserne; Sardes hadde vært hovedstad i Lydia; Tyatira var en handelsby med laug, Filadelfia en by ofte rystet av jordskjelv, og Laodikea en rik by som gjenreiste seg etter jordskjelvet i 60 e.Kr. uten hjelp fra Roma. Brevene ble skrevet, etter den vanlige dateringen, omkring 95 e.Kr. under Domitian; noen legger dem til omkring 68 e.Kr. Av de sju er det bare İzmir som er en stor by i dag; de andre er ruiner eller små byer ved siden av dem."
  tl:
    - "Ang pitong iglesia ay pawang nasa lalawigang Romano ng Asia, sa kanluran ng Turkey ngayon: Efeso (malapit sa Selçuk), Smirna (İzmir), Pergamo (Bergama), Tiatira (Akhisar), Sardis (malapit sa nayon ng Sart), Filadelfia (Alaşehir) at Laodicea (malapit sa Denizli)."
    - "Sinabi kay Juan sa Patmos: “Ang iyong nakikita, ay isulat mo sa isang aklat at iyong ipadala sa pitong iglesia: sa Efeso, at sa Smirna, at sa Pergamo, at sa Tiatira, at sa Sardis, at sa Filadelfia, at sa Laodicea.” Ang pagkakasunod ay isang paikot na ruta: hilaga mula Efeso sa baybayin patungong Smirna at Pergamo, pagkatapos ay papasok sa lupain at timog-silangan sa Tiatira, Sardis at Filadelfia hanggang Laodicea sa lambak ng Lycus. Sa mga daang Romano sa mapa, ang mga hati ay 77, 110, 76, 56, 47 at 94 km, mga 460 km sa kabuuan."
    - "Ang Efeso ay luklukan ng prokonsul at isa sa pinakamalalaking lungsod ng Silangan; ang Smirna at Pergamo ay may mga templo ng Roma at ng mga emperador; ang Sardis ay naging kabisera ng Lidia; ang Tiatira ay bayang pamilihan ng mga samahan ng kalakalan, ang Filadelfia ay lungsod na madalas niyayanig ng lindol, at ang Laodicea ay mayamang lungsod na nagtayong muli ng sarili pagkatapos ng lindol noong 60 AD nang walang tulong mula sa Roma. Isinulat ang mga liham, sa karaniwang pagpepetsa, mga 95 AD sa ilalim ni Domiciano; inilalagay ng ilan ang mga ito mga 68 AD. Sa pito, İzmir lamang ang malaking lungsod ngayon; mga guho o maliliit na bayan sa tabi ng mga ito ang iba."
  da:
    - "Alle syv menigheder lå i den romerske provins Asia, i det vestlige Tyrkiet: Efesos (ved Selçuk), Smyrna (İzmir), Pergamon (Bergama), Thyatira (Akhisar), Sardes (ved landsbyen Sart), Filadelfia (Alaşehir) og Laodikea (nær Denizli)."
    - "Johannes på Patmos får besked: »Hvad du ser, skriv det i en Bog, og send det til de syv Menigheder, til Efesus og til Smyrna og til Pergamus og til Thyatira og til Sardes og til Filadelfia og til Laodikea.« Rækkefølgen er en rundtur ad vej: nordpå fra Efesos langs kysten til Smyrna og Pergamon, derefter ind i landet og mod sydøst gennem Thyatira, Sardes og Filadelfia til Laodikea i Lykos-dalen. Ad de romerske veje på kortet måler etaperne 77, 110, 76, 56, 47 og 94 km, i alt ca. 460 km."
    - "Efesos var prokonsulens sæde og en af Østens største byer; Smyrna og Pergamon havde templer for Rom og kejserne; Sardes havde været Lydiens hovedstad; Thyatira var en købstad med håndværkslav, Filadelfia en by ofte rystet af jordskælv, og Laodikea en rig by, som genopbyggede sig selv efter jordskælvet i 60 e.Kr. uden hjælp fra Rom. Brevene blev skrevet, efter den sædvanlige datering, omkring 95 e.Kr. under Domitian; nogle placerer dem omkring 68 e.Kr. Af de syv er kun İzmir en stor by i dag; de andre er ruiner eller små byer ved siden af dem."
  sr:
    - "Свих седам цркава било је у римској провинцији Азији, на западу данашње Турске: Ефес (код Сељука), Смирна (Измир), Пергам (Бергама), Тијатира (Акхисар), Сард (код села Сарт), Филаделфија (Алашехир) и Лаодикија (близу Денизлија)."
    - "Јовану на Патаму речено је: „шта видиш напиши у књигу, и пошљи црквама које су у Азији: у Ефес, и у Смирну, и у Пергам, и у Тијатир, и у Сард, и у Филаделфију, и у Лаодикију.“ Редослед је обилазак путем: на север од Ефеса дуж обале до Смирне и Пергама, затим у унутрашњост и југоисточно преко Тијатире, Сарда и Филаделфије до Лаодикије у долини Лика. Римским путевима на карти деонице мере 77, 110, 76, 56, 47 и 94 км, укупно око 460 км."
    - "Ефес је био седиште проконзула и један од највећих градова Истока; Смирна и Пергам имали су храмове Роме и царева; Сард је био престоница Лидије; Тијатира је била трговачки град еснафа, Филаделфија град који су често потресали земљотреси, а Лаодикија богат град који се обновио после земљотреса 60. н. е. без помоћи Рима. Писма су написана, по уобичајеном датирању, око 95. н. е. под Домицијаном; неки их стављају око 68. н. е. Од седам, данас је велик град само Измир; остали су рушевине или мали градови поред њих."
  hu:
    - "Mind a hét gyülekezet Ázsia római provinciájában volt, a mai Törökország nyugati részén: Efezus (Selçuk mellett), Szmürna (İzmir), Pergamon (Bergama), Thiatira (Akhisar), Szárdisz (Sart falu mellett), Filadelfia (Alaşehir) és Laodicea (Denizli közelében)."
    - "A Pátmoszon lévő Jánosnak ezt mondják: „A mit látsz, írd meg könyvben, és küldd el a hét gyülekezetnek, a mely Ázsiában van, Efézusban, Smirnában, Pergámumban, Thiatirában, Sárdisban, Filadelfiában és Laodiczeában.” A sorrend útvonal: Efezusból északra a parton Szmürnáig és Pergamonig, majd a szárazföld belsejébe és délkeletre Thiatirán, Szárdiszon és Filadelfián át a Lükosz-völgyi Laodiceáig. A térképen jelölt római utakon a szakaszok 77, 110, 76, 56, 47 és 94 km hosszúak, összesen mintegy 460 km."
    - "Efezus a prokonzul székhelye és Kelet egyik legnagyobb városa volt; Szmürnában és Pergamonban Róma és a császárok templomai álltak; Szárdisz Lüdia fővárosa volt; Thiatira kereskedelmi céhek vásárhelye, Filadelfia gyakran földrengések rázta város, Laodicea pedig gazdag város, amely a Kr. u. 60-as földrengés után Róma segítsége nélkül építette újjá magát. A leveleket a szokásos keltezés szerint Kr. u. 95 körül írták Domitianus alatt; egyesek 68 körülre teszik. A hétből ma csak İzmir nagyváros; a többi rom vagy mellettük fekvő kisváros."
  fi:
    - "Kaikki seitsemän seurakuntaa olivat Rooman Aasian provinssissa, nykyisen Turkin länsiosassa: Efesos (Selçukin luona), Smyrna (İzmir), Pergamon (Bergama), Tyatira (Akhisar), Sardes (Sartin kylän luona), Filadelfia (Alaşehir) ja Laodikea (Denizlin lähellä)."
    - "Patmoksella oleva Johannes saa käskyn: ”Kirjoita kirjaan, mitä näet, ja lähetä niille seitsemälle seurakunnalle, Efesoon ja Smyrnaan ja Pergamoon ja Tyatiraan ja Sardeeseen ja Filadelfiaan ja Laodikeaan.” Järjestys on kierros tietä pitkin: Efesoksesta pohjoiseen rannikkoa pitkin Smyrnaan ja Pergamoniin, sitten sisämaahan ja kaakkoon Tyatiran, Sardeen ja Filadelfian kautta Laodikeaan Lykoksen laaksossa. Kartan roomalaisia teitä pitkin osuudet ovat 77, 110, 76, 56, 47 ja 94 km, yhteensä noin 460 km."
    - "Efesos oli prokonsulin istuin ja yksi idän suurimmista kaupungeista; Smyrnassa ja Pergamonissa oli Rooman ja keisarien temppeleitä; Sardes oli ollut Lyydian pääkaupunki; Tyatira oli ammattikuntien kauppakaupunki, Filadelfia usein maanjäristysten ravistelema kaupunki ja Laodikea varakas kaupunki, joka rakensi itsensä uudelleen vuoden 60 jaa. maanjäristyksen jälkeen ilman Rooman apua. Kirjeet kirjoitettiin tavanomaisen ajoituksen mukaan noin 95 jaa. Domitianuksen aikana; jotkut sijoittavat ne noin vuoteen 68 jaa. Seitsemästä vain İzmir on nykyisin suuri kaupunki; muut ovat raunioita tai pieniä kaupunkeja niiden vieressä."
  vi:
    - "Cả bảy Hội thánh đều nằm trong tỉnh A-si của La Mã, ở phía tây Thổ Nhĩ Kỳ ngày nay: Ê-phê-sô (cạnh Selçuk), Si-miệc-nơ (İzmir), Bẹt-găm (Bergama), Thi-a-ti-rơ (Akhisar), Sạt-đe (cạnh làng Sart), Phi-la-đen-phi (Alaşehir) và Lao-đi-xê (gần Denizli)."
    - "Giăng ở Bát-mô được bảo: “Điều ngươi thấy, hãy chép vào một quyển sách mà gởi cho bảy Hội Thánh tại Ê-phê-sô, Si-miệc-nơ, Bẹt-găm, Thi-a-ti-rơ, Sạt-đe, Phi-la-đen-phi và Lao-đi-xê.” Thứ tự là một vòng đi bằng đường bộ: từ Ê-phê-sô lên phía bắc dọc bờ biển đến Si-miệc-nơ và Bẹt-găm, rồi vào nội địa và đi về đông nam qua Thi-a-ti-rơ, Sạt-đe và Phi-la-đen-phi đến Lao-đi-xê trong thung lũng Lycus. Theo các con đường La Mã trên bản đồ, các chặng dài 77, 110, 76, 56, 47 và 94 km, tổng cộng khoảng 460 km."
    - "Ê-phê-sô là thủ phủ của quan tổng đốc và là một trong những thành lớn nhất phương Đông; Si-miệc-nơ và Bẹt-găm có đền thờ Rô-ma và các hoàng đế; Sạt-đe từng là kinh đô của Ly-đi; Thi-a-ti-rơ là thị trấn chợ với các phường hội thương mại, Phi-la-đen-phi là thành thường bị động đất rung chuyển, và Lao-đi-xê là thành giàu có đã tự xây lại sau trận động đất năm 60 mà không nhờ Rô-ma giúp. Các thư được viết, theo niên đại thông thường, khoảng năm 95 dưới thời Domitianus; một số người đặt chúng khoảng năm 68. Trong bảy thành, ngày nay chỉ İzmir là thành phố lớn; các nơi khác là tàn tích hoặc thị trấn nhỏ bên cạnh."
  ro:
    - "Toate cele șapte biserici se aflau în provincia romană Asia, în vestul Turciei de azi: Efes (lângă Selçuk), Smirna (İzmir), Pergam (Bergama), Tiatira (Akhisar), Sardes (lângă satul Sart), Filadelfia (Alaşehir) și Laodiceea (lângă Denizli)."
    - "Ioan, pe Patmos, primește porunca: „ce vezi, scrie în carte, și o trimite celor șapte biserici ce sunt în Asia: la Efes și la Smirna și la Pergam și la Tiatira și la Sardes, și la Filadelfia și la Laodichia.” Ordinea este un circuit pe drum: spre nord de la Efes de-a lungul coastei până la Smirna și Pergam, apoi spre interior și sud-est prin Tiatira, Sardes și Filadelfia până la Laodiceea, în valea Lycusului. Pe drumurile romane de pe hartă, etapele măsoară 77, 110, 76, 56, 47 și 94 km, circa 460 km în total."
    - "Efesul era sediul proconsulului și unul dintre cele mai mari orașe ale Orientului; Smirna și Pergamul aveau temple ale Romei și ale împăraților; Sardes fusese capitala Lidiei; Tiatira era un oraș de târg cu bresle comerciale, Filadelfia un oraș adesea zguduit de cutremure, iar Laodiceea un oraș bogat care s-a reconstruit după cutremurul din 60 d.Hr. fără ajutor din partea Romei. Scrisorile au fost scrise, după datarea obișnuită, în jurul anului 95 d.Hr., sub Domițian; unii le plasează în jurul anului 68 d.Hr. Dintre cele șapte, doar İzmir este azi un oraș mare; celelalte sunt ruine sau orașe mici alături de ele."
  bg:
    - "И седемте църкви се намираха в римската провинция Азия, в западната част на днешна Турция: Ефес (до Селчук), Смирна (Измир), Пергам (Бергама), Тиатира (Акхисар), Сарди (до село Сарт), Филаделфия (Алашехир) и Лаодикия (близо до Денизли)."
    - "На Йоан на Патмос е казано: „каквото виждаш напиши в книга и проводи на седемте църкви които са в Азия… в Ефес, и в Смирна, и в Пергам, и в Тиатир, и в Сардис, и във Филаделфия, и в Лаодикия“. Редът е обиколка по пътищата: на север от Ефес по брега до Смирна и Пергам, после навътре и на югоизток през Тиатира, Сарди и Филаделфия до Лаодикия в долината на Лик. По римските пътища на картата отсечките са 77, 110, 76, 56, 47 и 94 км, общо около 460 км."
    - "Ефес беше седалище на проконсула и един от най-големите градове на Изтока; Смирна и Пергам имаха храмове на Рома и императорите; Сарди беше столица на Лидия; Тиатира беше търговски град с гилдии, Филаделфия — град, често разтърсван от земетресения, а Лаодикия — богат град, който се възстанови след земетресението от 60 г. н.е. без помощ от Рим. Писмата са написани според обичайната датировка около 95 г. н.е., при Домициан; някои ги поставят около 68 г. н.е. От седемте само Измир днес е голям град; другите са руини или малки градчета до тях."
