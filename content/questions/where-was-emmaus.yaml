id: where-was-emmaus
question:
  en: "Where was Emmaus?"
  ru: "Где находился Эммаус?"
  uk: "Де був Еммаус?"
  es: "¿Dónde estaba Emaús?"
  pt: "Onde ficava Emaús?"
  de: "Wo lag Emmaus?"
  fr: "Où se trouvait Emmaüs ?"
  pl: "Gdzie leżało Emaus?"
  it: "Dov’era Emmaus?"
  cs: "Kde ležely Emauzy?"
  nl: "Waar lag Emmaüs?"
  sv: "Var låg Emmaus?"
  nb: "Hvor lå Emmaus?"
  tl: "Nasaan ang Emaus?"
  da: "Hvor lå Emmaus?"
  sr: "Где се налазио Емаус?"
answer:
  en:
    - 'The site of Emmaus is disputed. Luke places it "about threescore furlongs" (sixty stadia, about 11 km) from Jerusalem, and four places are most often named: Emmaus-Nicopolis (Imwas) near Latrun, Abu Ghosh, el-Qubeibeh and Motza (Qalunya), where the map point stands.'
    - "Most manuscripts of Luke give sixty stadia; some, among them Codex Sinaiticus, give 160, about 30 km. Emmaus-Nicopolis, about 25 km west of Jerusalem in a straight line, was the Emmaus of the Maccabean and Roman wars and the Emmaus of the ancient church: Eusebius took it for the home of Cleopas, and the remains of a Byzantine church still stand there, but it fits only the longer reading. Abu Ghosh, about 12 km west on the road to the coast, was held to be Emmaus from the twelfth century, and el-Qubeibeh, about 12 km north-west, from the later Middle Ages."
    - "Motza, west of Jerusalem, is about 8 km away by the Roman road on the map. Josephus says that after the war Vespasian settled 800 veterans at a place called Ammaus, thirty stadia from Jerusalem in the standard text (some manuscripts read sixty); many identify it with Motza, the Mozah of Joshua's list, whose later name Qalunya is thought to recall the Latin colonia. The map point stands at Motza, and the place card lists the other sites; none can be called certain."
  ru:
    - "Местоположение Эммауса спорно. Лука помещает его «стадий на шестьдесят от Иерусалима» (около 11 км), и чаще всего называют четыре места: Эммаус-Никополь (Имвас) близ Латруна, Абу-Гош, Эль-Кубейбу и Моцу (Калунию), где стоит точка на карте."
    - "В большинстве рукописей Луки — шестьдесят стадий; в некоторых, в том числе в Синайском кодексе, — сто шестьдесят, около 30 км. Эммаус-Никополь, примерно в 25 км к западу от Иерусалима по прямой, был Эммаусом Маккавейских и римских войн и Эммаусом древней Церкви: Евсевий считал его родиной Клеопы, и там до сих пор стоят остатки византийской церкви; но он подходит лишь при длинном чтении. Абу-Гош, примерно в 12 км к западу, на дороге к побережью, считали Эммаусом с XII века, а Эль-Кубейбу, примерно в 12 км к северо-западу, — с позднего Средневековья."
    - "До Моцы к западу от Иерусалима около 8 км по римской дороге на карте. Иосиф Флавий пишет, что после войны Веспасиан поселил 800 ветеранов в месте, называемом Аммаус, в тридцати стадиях от Иерусалима по стандартному тексту (в некоторых рукописях — шестьдесят); многие отождествляют его с Моцой из списка книги Иисуса Навина, чьё позднейшее имя Калуния, как полагают, хранит латинское colonia. Точка на карте стоит у Моцы, остальные места перечислены в карточке; ни одно нельзя назвать достоверным."
  uk:
    - "Місце розташування Еммауса спірне. Лука зазначає, що він лежав «гоней з шістьдесять» від Єрусалима (шістдесят стадій, близько 11 км), і найчастіше називають чотири місця: Еммаус-Нікополь (Імвас) поблизу Латруна, Абу-Гош, Ель-Кубейба та Моца (Калунія), де стоїть точка на мапі."
    - "У більшості рукописів Луки подано шістдесят стадій; в окремих, зокрема в Синайському кодексі, — сто шістдесят, близько 30 км. Еммаус-Нікополь, приблизно за 25 км на захід від Єрусалима по прямій, був Еммаусом маккавейських і римських воєн та Еммаусом давньої Церкви: Євсевій вважав його батьківщиною Клеопи, і там досі стоять рештки візантійської церкви, проте він відповідає лише довшому прочитанню. Абу-Гош, приблизно за 12 км на захід, на дорозі до узбережжя, вважали Еммаусом з XII ст., а Ель-Кубейбу, приблизно за 12 км на північний захід, — з пізнього Середньовіччя."
    - "До Моци на захід від Єрусалима близько 8 км римською дорогою на мапі. Йосиф Флавій пише, що після війни Веспасіан оселив 800 ветеранів у місці, яке називалося Амаус, за тридцять стадій від Єрусалима за стандартним текстом (у деяких рукописах — шістдесят); багато хто ототожнює його з Моцою зі списку книги Ісуса Навина, чия пізніша назва Калунія, як вважають, зберігає латинське colonia. Точка на мапі стоїть біля Моци, а інші місця перелічено в картці місця; жодне з них не можна назвати достовірним."
  es:
    - "El emplazamiento de Emaús es discutido. Lucas lo sitúa a «sesenta estadios» (unos 11 km) de Jerusalén, y los cuatro lugares que se nombran con más frecuencia son Emaús-Nicópolis (Imwas), cerca de Latrún, Abu Ghosh, el-Qubeibeh y Motza (Qalunya), donde está el punto del mapa."
    - "La mayoría de los manuscritos de Lucas dan sesenta estadios; algunos, entre ellos el Códice Sinaítico, dan 160, unos 30 km. Emaús-Nicópolis, a unos 25 km al oeste de Jerusalén en línea recta, fue el Emaús de las guerras macabeas y romanas y el Emaús de la Iglesia antigua: Eusebio la tuvo por la patria de Cleofas, y aún se conservan allí los restos de una iglesia bizantina, pero solo concuerda con la lectura más larga. Abu Ghosh, a unos 12 km al oeste, en el camino de la costa, se tuvo por Emaús desde el siglo XII, y el-Qubeibeh, a unos 12 km al noroeste, desde la baja Edad Media."
    - "Motza, al oeste de Jerusalén, queda a unos 8 km por la calzada romana del mapa. Josefo dice que, tras la guerra, Vespasiano asentó a 800 veteranos en un lugar llamado Ammaús, a treinta estadios de Jerusalén según el texto estándar (algunos manuscritos leen sesenta); muchos lo identifican con Motza, la Mosa de la lista de Josué, cuyo nombre posterior, Qalunya, se piensa que recuerda el latín colonia. El punto del mapa está en Motza, y la ficha del lugar enumera los demás emplazamientos; ninguno puede darse por cierto."
  pt:
    - "A localização de Emaús é discutida. Lucas a situa “a sessenta estádios” de Jerusalém (cerca de 11 km), e quatro lugares são os mais citados: Emaús-Nicópolis (Imwas), perto de Latrun, Abu Ghosh, el-Qubeibeh e Motza (Qalunya), onde está o ponto do mapa."
    - "A maioria dos manuscritos de Lucas traz sessenta estádios; alguns, entre eles o Códice Sinaítico, trazem 160, cerca de 30 km. Emaús-Nicópolis, a cerca de 25 km a oeste de Jerusalém em linha reta, foi o Emaús das guerras macabaicas e romanas e o Emaús da Igreja antiga: Eusébio a tinha por terra de Cléopas, e ali ainda restam ruínas de uma igreja bizantina, mas ela só se ajusta à leitura mais longa. Abu Ghosh, a cerca de 12 km a oeste, no caminho da costa, foi tida por Emaús desde o século XII, e el-Qubeibeh, a cerca de 12 km a noroeste, desde o fim da Idade Média."
    - "Motza, a oeste de Jerusalém, fica a cerca de 8 km pela estrada romana do mapa. Josefo diz que, depois da guerra, Vespasiano estabeleceu 800 veteranos num lugar chamado Ammaus, a trinta estádios de Jerusalém no texto padrão (alguns manuscritos leem sessenta); muitos o identificam com Motza, a Mozá da lista de Josué, cujo nome posterior, Qalunya, se pensa recordar o latim colonia. O ponto do mapa fica em Motza, e a ficha do lugar relaciona os demais sítios; nenhum pode ser tido por certo."
  de:
    - "Die Lage von Emmaus ist umstritten. Lukas setzt es „sechzig Feld Wegs“ (sechzig Stadien, etwa 11 km) von Jerusalem entfernt an; am häufigsten werden vier Orte genannt: Emmaus-Nikopolis (Imwas) bei Latrun, Abu Ghosch, el-Qubeibeh und Motza (Qalunya), wo der Kartenpunkt steht."
    - "Die meisten Handschriften des Lukas nennen sechzig Stadien; einige, darunter der Codex Sinaiticus, nennen 160, etwa 30 km. Emmaus-Nikopolis, in der Luftlinie rund 25 km westlich von Jerusalem, war das Emmaus der makkabäischen und römischen Kriege und das Emmaus der alten Kirche: Eusebius hielt es für die Heimat des Kleopas, und die Reste einer byzantinischen Kirche stehen dort noch heute, doch passt es nur zur längeren Lesart. Abu Ghosch, rund 12 km westlich an der Straße zur Küste, galt seit dem 12. Jahrhundert als Emmaus, el-Qubeibeh, rund 12 km nordwestlich, seit dem späteren Mittelalter."
    - "Motza westlich von Jerusalem liegt auf der Römerstraße der Karte etwa 8 km entfernt. Josephus berichtet, Vespasian habe nach dem Krieg 800 Veteranen an einem Ort namens Ammaus angesiedelt, im Standardtext dreißig Stadien von Jerusalem entfernt (einige Handschriften lesen sechzig); viele setzen ihn mit Motza gleich, dem Moza der Liste im Buch Josua, dessen späterer Name Qalunya an das lateinische colonia erinnern soll. Der Kartenpunkt steht bei Motza, die Ortskarte führt die übrigen Orte auf; keiner lässt sich als sicher bezeichnen."
  fr:
    - "L’emplacement d’Emmaüs est discuté. Luc le situe à « soixante stades » de Jérusalem (environ 11 km), et quatre lieux sont le plus souvent proposés : Emmaüs-Nicopolis (Imwas), près de Latroun, Abu Ghosh, el-Qubeibeh et Motza (Qalunya), où se trouve le point de la carte."
    - "La plupart des manuscrits de Luc donnent soixante stades ; certains, dont le Codex Sinaiticus, en donnent cent soixante, soit environ 30 km. Emmaüs-Nicopolis, à environ 25 km à l’ouest de Jérusalem à vol d’oiseau, était l’Emmaüs des guerres maccabéennes et romaines et celui de l’Église ancienne : Eusèbe y voyait la patrie de Cléopas, et les restes d’une église byzantine y subsistent, mais elle ne convient qu’à la leçon longue. Abu Ghosh, à environ 12 km à l’ouest, sur la route de la côte, passa pour Emmaüs à partir du XIIe siècle, et el-Qubeibeh, à environ 12 km au nord-ouest, à partir de la fin du Moyen Âge."
    - "Motza, à l’ouest de Jérusalem, se trouve à environ 8 km par la voie romaine de la carte. Flavius Josèphe rapporte qu’après la guerre Vespasien installa 800 vétérans en un lieu appelé Ammaous, à trente stades de Jérusalem dans le texte courant (certains manuscrits portent soixante) ; beaucoup l’identifient à Motza, la Motsa de la liste de Josué, dont le nom ultérieur, Qalunya, rappellerait le latin colonia. Le point de la carte est placé à Motza, et la fiche du lieu énumère les autres sites ; aucun ne peut être tenu pour certain."
  pl:
    - "Położenie Emaus jest sporne. Łukasz umieszcza je „na sześćdziesiąt stajan” (sześćdziesiąt stadiów, około 11 km) od Jerozolimy, a najczęściej wymienia się cztery miejsca: Emaus-Nikopolis (Imwas) koło Latrun, Abu Ghosh, el-Qubeibeh oraz Motza (Qalunya), gdzie stoi punkt na mapie."
    - "Większość rękopisów Łukasza podaje sześćdziesiąt stadiów; niektóre, w tym Kodeks synajski, podają 160, czyli około 30 km. Emaus-Nikopolis, oddalone o około 25 km na zachód od Jerozolimy w linii prostej, było Emaus wojen machabejskich i rzymskich oraz Emaus starożytnego Kościoła: Euzebiusz uważał je za rodzinne miasto Kleofasa, do dziś stoją tam szczątki bizantyjskiego kościoła, lecz pasuje ono tylko do dłuższej lekcji. Abu Ghosh, około 12 km na zachód, przy drodze na wybrzeże, uważano za Emaus od XII wieku, a el-Qubeibeh, około 12 km na północny zachód — od późnego średniowiecza."
    - "Motza, na zachód od Jerozolimy, leży około 8 km od Jerozolimy rzymską drogą z mapy. Józef Flawiusz pisze, że po wojnie Wespazjan osiedlił 800 weteranów w miejscu zwanym Ammaus, w standardowym tekście o trzydzieści stadiów od Jerozolimy (niektóre rękopisy mają sześćdziesiąt); wielu utożsamia je z Motzą, czyli Mocą z listy Jozuego, której późniejsza nazwa Qalunya ma przypominać łacińskie colonia. Punkt na mapie stoi w Motzy, a karta miejsca wylicza pozostałe lokalizacje; żadnej nie można uznać za pewną."
  it:
    - "L’ubicazione di Emmaus è discussa. Luca la pone a «sessanta stadi» (circa 11 km) da Gerusalemme, e i luoghi più spesso indicati sono quattro: Emmaus-Nicopoli (Imwas) presso Latrun, Abu Ghosh, el-Qubeibeh e Motza (Qalunya), dove si trova il punto sulla mappa."
    - "La maggior parte dei manoscritti di Luca riporta sessanta stadi; alcuni, tra cui il Codex Sinaiticus, ne riportano 160, circa 30 km. Emmaus-Nicopoli, a circa 25 km a ovest di Gerusalemme in linea d’aria, fu l’Emmaus delle guerre maccabaiche e romane e l’Emmaus della Chiesa antica: Eusebio la ritenne la patria di Cleopa, e vi sorgono ancora i resti di una chiesa bizantina, ma concorda solo con la lettura più lunga. Abu Ghosh, a circa 12 km a ovest sulla strada verso la costa, fu considerata Emmaus dal XII secolo, ed el-Qubeibeh, a circa 12 km a nord-ovest, dal tardo Medioevo."
    - "Motza, a ovest di Gerusalemme, dista circa 8 km lungo la strada romana della mappa. Giuseppe Flavio racconta che dopo la guerra Vespasiano stabilì 800 veterani in un luogo chiamato Ammaus, a trenta stadi da Gerusalemme nel testo standard (alcuni manoscritti leggono sessanta); molti lo identificano con Motza, la Mosa dell’elenco di Giosuè, il cui nome successivo, Qalunya, si ritiene richiami il latino colonia. Il punto sulla mappa si trova a Motza, e la scheda del luogo elenca gli altri siti; nessuno può dirsi certo."
  cs:
    - "Poloha Emauz je sporná. Lukáš je klade „honů šedesáte“ od Jeruzaléma (šedesát stadií, asi 11 km) a nejčastěji se uvádějí čtyři místa: Emauzy-Nikopolis (Imwás) u Latrúnu, Abú Goš, el-Kubejba a Moca (Kalúnja), kde stojí bod na mapě."
    - "Většina rukopisů Lukáše uvádí šedesát stadií; některé, mezi nimi Kodex Sinajský, mají 160, asi 30 km. Emauzy-Nikopolis, vzdušnou čarou asi 25 km západně od Jeruzaléma, byly Emauzy makabejských a římských válek i Emauzy staré církve: Eusebios je pokládal za domov Kleopase a zbytky byzantského kostela tam stojí dodnes, ale hodí se jen k delšímu čtení. Abú Goš, asi 12 km na západ při cestě k pobřeží, byl za Emauzy pokládán od 12. století a el-Kubejba, asi 12 km na severozápad, od pozdějšího středověku."
    - "Moca, na západ od Jeruzaléma, je podle římské silnice na mapě vzdálena asi 8 km. Josephus uvádí, že po válce Vespasianus usadil 800 veteránů v místě zvaném Ammaus, podle běžného textu třicet stadií od Jeruzaléma (některé rukopisy mají šedesát); mnozí je ztotožňují s Mocou, Moca z Jozuova seznamu, jejíž pozdější jméno Kalúnja prý připomíná latinské colonia. Bod na mapě stojí v Moce a karta místa uvádí ostatní lokality; žádnou nelze označit za jistou."
  nl:
    - "De ligging van Emmaüs is omstreden. Lukas plaatst het op “zestig stadiën” (ongeveer 11 km) van Jeruzalem, en vier plaatsen worden het vaakst genoemd: Emmaüs-Nicopolis (Imwas) bij Latrun, Abu Ghosh, el-Qubeibeh en Motza (Qalunya), waar het punt op de kaart staat."
    - "De meeste handschriften van Lukas geven zestig stadiën; sommige, onder andere de Codex Sinaiticus, geven er 160, ongeveer 30 km. Emmaüs-Nicopolis, hemelsbreed ongeveer 25 km ten westen van Jeruzalem, was het Emmaüs van de Makkabeeënoorlogen en de Romeinse oorlogen en het Emmaüs van de oude kerk: Eusebius hield het voor de woonplaats van Kleopas, en de resten van een Byzantijnse kerk staan er nog, maar het past alleen bij de langere lezing. Abu Ghosh, ongeveer 12 km naar het westen aan de weg naar de kust, gold sinds de twaalfde eeuw als Emmaüs, en el-Qubeibeh, ongeveer 12 km naar het noordwesten, sinds de late middeleeuwen."
    - "Motza, ten westen van Jeruzalem, ligt via de Romeinse weg op de kaart ongeveer 8 km verderop. Josephus zegt dat Vespasianus na de oorlog 800 veteranen vestigde in een plaats genaamd Ammaus, in de standaardtekst dertig stadiën van Jeruzalem (enkele handschriften hebben zestig); velen vereenzelvigen die met Motza, het Moza uit de lijst van Jozua, waarvan de latere naam Qalunya waarschijnlijk herinnert aan het Latijnse colonia. Het punt op de kaart staat bij Motza, en de plaatskaart noemt de andere locaties; geen daarvan kan zeker heten."
  sv:
    - "Platsen för Emmaus är omstridd. Lukas placerar den ”sextio stadiers väg från Jerusalem” (sextio stadier, omkring 11 km), och fyra platser nämns oftast: Emmaus-Nikopolis (Imwas) nära Latrun, Abu Ghosh, el-Qubeibeh och Motza (Qalunya), där kartpunkten står."
    - "De flesta handskrifter av Lukas ger sextio stadier; några, bland dem Codex Sinaiticus, ger 160, omkring 30 km. Emmaus-Nikopolis, omkring 25 km väster om Jerusalem i fågelvägen, var Emmaus under mackabeerkrigen och de romerska krigen och den gamla kyrkans Emmaus: Eusebios höll det för Kleopas hemort, och resterna av en bysantinsk kyrka står kvar där, men det passar bara med den längre läsarten. Abu Ghosh, omkring 12 km västerut på vägen mot kusten, ansågs vara Emmaus från 1100-talet, och el-Qubeibeh, omkring 12 km nordväst, från senare delen av medeltiden."
    - "Motza, väster om Jerusalem, ligger omkring 8 km bort längs den romerska vägen på kartan. Josefus säger att Vespasianus efter kriget lät bosätta 800 veteraner på en plats som hette Ammaus, trettio stadier från Jerusalem enligt standardtexten (några handskrifter har sextio); många identifierar den med Motza, Mosa i Josuas lista, vars senare namn Qalunya tros påminna om latinets colonia. Kartpunkten står vid Motza, och platskortet förtecknar de andra platserna; ingen av dem kan sägas vara säker."
  nb:
    - "Hvor Emmaus lå, er omstridt. Lukas plasserer byen «seksti stadier fra Jerusalem» (omtrent 11 km), og fire steder nevnes oftest: Emmaus-Nikopolis (Imwas) ved Latrun, Abu Ghosh, el-Qubeibeh og Motza (Qalunya), der kartpunktet står."
    - "De fleste håndskrifter av Lukas har seksti stadier; noen, blant dem Codex Sinaiticus, har 160, omtrent 30 km. Emmaus-Nikopolis, omtrent 25 km vest for Jerusalem i luftlinje, var Emmaus under makkabeerkrigene og de romerske krigene og Emmaus i oldkirken: Eusebius mente det var Kleopas’ hjemsted, og restene av en bysantinsk kirke står der ennå, men stedet passer bare med den lengre lesemåten. Abu Ghosh, omtrent 12 km mot vest på veien til kysten, ble regnet som Emmaus fra 1100-tallet, og el-Qubeibeh, omtrent 12 km mot nordvest, fra senmiddelalderen."
    - "Motza, vest for Jerusalem, ligger omtrent 8 km unna langs den romerske veien på kartet. Josefus sier at Vespasian etter krigen bosatte 800 veteraner på et sted som het Ammaus, tretti stadier fra Jerusalem i standardteksten (noen håndskrifter har seksti); mange identifiserer det med Motza, Mosa i Josvas liste, hvis senere navn Qalunya antas å minne om det latinske colonia. Kartpunktet står ved Motza, og stedskortet oppfører de andre stedene; ingen av dem kan kalles sikker."
  tl:
    - "Pinagtatalunan ang kinaroroonan ng Emaus. Inilalagay ito ni Lucas na “may anim na pung estadio ang layo sa Jerusalem” (animnapung estadio, mga 11 km), at apat na lugar ang pinakamadalas banggitin: ang Emaus-Nicopolis (Imwas) malapit sa Latrun, ang Abu Ghosh, ang el-Qubeibeh at ang Motza (Qalunya), kung saan nakatayo ang punto sa mapa."
    - "Karamihan ng mga manuskrito ni Lucas ay may animnapung estadio; may ilan, kabilang ang Codex Sinaiticus, na may 160, mga 30 km. Ang Emaus-Nicopolis, mga 25 km sa kanluran ng Jerusalem sa tuwid na guhit, ay ang Emaus ng mga digmaang Macabeo at Romano at ang Emaus ng sinaunang iglesia: itinuring ito ni Eusebio na tahanan ni Cleopas, at nakatayo pa roon ang mga labi ng isang simbahang Bizantino, ngunit ang mas mahabang pagbasa lamang ang angkop dito. Ang Abu Ghosh, mga 12 km sa kanluran sa daang patungong baybayin, ay itinuring na Emaus mula pa noong ika-12 siglo, at ang el-Qubeibeh, mga 12 km sa hilagang-kanluran, mula pa sa huling bahagi ng Gitnang Panahon."
    - "Ang Motza, sa kanluran ng Jerusalem, ay mga 8 km ang layo sa daang Romano na nasa mapa. Ayon kay Josephus, pagkatapos ng digmaan ay pinatira ni Vespasiano ang 800 beterano sa isang lugar na tinatawag na Ammaus, tatlumpung estadio mula sa Jerusalem sa karaniwang teksto (animnapu ang nasa ilang manuskrito); marami ang nagkikilala rito sa Motza, ang Moza sa talaan ni Josue, na ang huling pangalan nitong Qalunya ay inaakalang nagpapaalala sa Latin na colonia. Nasa Motza ang punto sa mapa, at inililista ng kard ng lugar ang iba pang pook; wala sa mga ito ang masasabing tiyak."
  da:
    - "Emmaus’ beliggenhed er omstridt. Lukas placerer byen »tresindstyve Stadier fra Jerusalem« (tres stadier, ca. 11 km), og fire steder nævnes oftest: Emmaus-Nikopolis (Imwas) nær Latrun, Abu Ghosh, el-Qubeibeh og Motza (Qalunya), hvor punktet på kortet står."
    - "De fleste håndskrifter af Lukasevangeliet har tres stadier; nogle, blandt dem Codex Sinaiticus, har 160, ca. 30 km. Emmaus-Nikopolis, ca. 25 km vest for Jerusalem i fugleflugt, var Emmaus under de makkabæiske og romerske krige og i oldkirken: Eusebius regnede det for Kleopas’ hjemby, og resterne af en byzantinsk kirke står der stadig, men det passer kun med den længere læsemåde. Abu Ghosh, ca. 12 km mod vest på vejen til kysten, blev regnet for Emmaus fra 1100-tallet, og el-Qubeibeh, ca. 12 km mod nordvest, fra senmiddelalderen."
    - "Motza, vest for Jerusalem, ligger ca. 8 km væk ad den romerske vej på kortet. Josefus fortæller, at Vespasian efter krigen bosatte 800 veteraner på et sted kaldet Ammaus, tredive stadier fra Jerusalem i den gængse tekst (nogle håndskrifter har tres); mange sætter det lig med Motza, Mosa på Josvas liste, hvis senere navn Qalunya menes at minde om latinsk colonia. Punktet på kortet står ved Motza, og stedets kort opregner de øvrige steder; ingen af dem kan kaldes sikker."
  sr:
    - "Положај Емауса је спорен. Лука га смешта на „шездесет потркалишта“ од Јерусалима (шездесет стадија, око 11 км), а најчешће се наводе четири места: Емаус-Никопољ (Имвас) код Латруна, Абу Гош, ел-Кубејба и Моца (Калуња), где стоји тачка на карти."
    - "Већина рукописа Лукиног јеванђеља има шездесет стадија; неки, међу њима Синајски кодекс, имају 160, око 30 км. Емаус-Никопољ, око 25 км западно од Јерусалима ваздушном линијом, био је Емаус макавејских и римских ратова и Емаус древне цркве: Јевсевије га је сматрао Клеопиним завичајем, а остаци византијске цркве и данас тамо стоје, али он одговара само дужем читању. Абу Гош, око 12 км западно на путу ка обали, сматран је Емаусом од дванаестог века, а ел-Кубејба, око 12 км северозападно, од позног средњег века."
    - "Моца, западно од Јерусалима, удаљена је око 8 км римским путем на карти. Јосиф Флавије каже да је Веспазијан после рата населио 800 ветерана на месту званом Амаус, тридесет стадија од Јерусалима у уобичајеном тексту (неки рукописи имају шездесет); многи га поистовећују са Моцом, Мосом из списка у Књизи Исуса Навина, чије се потоње име Калуња сматра сећањем на латинску реч колонија. Тачка на карти стоји код Моце, а картица места наводи остала места; ниједно се не може назвати извесним."
