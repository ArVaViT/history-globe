id: where-was-emmaus
question:
  en: "Where was Emmaus?"
  ru: "Где находился Эммаус?"
  uk: "Де був Еммаус?"
  es: "¿Dónde estaba Emaús?"
  pt: "Onde ficava Emaús?"
  de: "Wo lag Emmaus?"
  fr: "Où se trouvait Emmaüs ?"
answer:
  en:
    - 'The site of Emmaus is disputed. Luke places it "about threescore furlongs" (sixty stadia, about 11 km) from Jerusalem, and four places are most often named: Emmaus-Nicopolis (Imwas) near Latrun, Abu Ghosh, el-Qubeibeh and Motza (Qalunya), where the map point stands.'
    - "Most manuscripts of Luke give sixty stadia; some, among them Codex Sinaiticus, give 160, about 30 km. Emmaus-Nicopolis, about 25 km west of Jerusalem in a straight line, was the Emmaus of the Maccabean and Roman wars and the Emmaus of the ancient church: Eusebius took it for the home of Cleopas, and the remains of a Byzantine church still stand there, but it fits only the longer reading. Abu Ghosh, about 12 km west on the road to the coast, was held to be Emmaus from the twelfth century, and el-Qubeibeh, about 12 km north-west, from the later Middle Ages."
    - "Motza, west of Jerusalem, is about 8 km away by the Roman road on the map. Josephus says that after the war Vespasian settled 800 veterans at a place called Ammaus, thirty stadia from Jerusalem in the standard text (some manuscripts read sixty); many identify it with Motza, the Mozah of Joshua's list, whose later name Qalunya is thought to recall the Latin colonia. The map point stands at Motza, and the place card lists the other sites; none can be called certain."
  ru:
    - "Местоположение Эммауса спорно. Лука помещает его «стадий на шестьдесят от Иерусалима» (около 11 км), и чаще всего называют четыре места: Эммаус-Никополь (Имвас) близ Латруна, Абу-Гош, Эль-Кубейбу и Моцу (Калунию), где стоит точка на карте."
    - "В большинстве рукописей Луки — шестьдесят стадий; в некоторых, в том числе в Синайском кодексе, — сто шестьдесят, около 30 км. Эммаус-Никополь, примерно в 25 км к западу от Иерусалима по прямой, был Эммаусом Маккавейских и римских войн и Эммаусом древней Церкви: Евсевий считал его родиной Клеопы, и там до сих пор стоят остатки византийской церкви; но он подходит лишь при длинном чтении. Абу-Гош, примерно в 12 км к западу, на дороге к побережью, считали Эммаусом с XII века, а Эль-Кубейбу, примерно в 12 км к северо-западу, — с позднего Средневековья."
    - "До Моцы к западу от Иерусалима около 8 км по римской дороге на карте. Иосиф Флавий пишет, что после войны Веспасиан поселил 800 ветеранов в месте, называемом Аммаус, в тридцати стадиях от Иерусалима по стандартному тексту (в некоторых рукописях — шестьдесят); многие отождествляют его с Моцой из списка книги Иисуса Навина, чьё позднейшее имя Калуния, как полагают, хранит латинское colonia. Точка на карте стоит у Моцы, остальные места перечислены в карточке; ни одно нельзя назвать достоверным."
  uk:
    - "Місце розташування Еммауса спірне. Лука зазначає, що він лежав «гоней з шістьдесять» від Єрусалима (шістдесят стадій, близько 11 км), і найчастіше називають чотири місця: Еммаус-Нікополь (Імвас) поблизу Латруна, Абу-Гош, Ель-Кубейба та Моца (Калунія), де стоїть точка на мапі."
    - "У більшості рукописів Луки подано шістдесят стадій; в окремих, зокрема в Синайському кодексі, — сто шістдесят, близько 30 км. Еммаус-Нікополь, приблизно за 25 км на захід від Єрусалима по прямій, був Еммаусом маккавейських і римських воєн та Еммаусом давньої Церкви: Євсевій вважав його батьківщиною Клеопи, і там досі стоять рештки візантійської церкви, проте він відповідає лише довшому прочитанню. Абу-Гош, приблизно за 12 км на захід, на дорозі до узбережжя, вважали Еммаусом з XII ст., а Ель-Кубейбу, приблизно за 12 км на північний захід, — з пізнього Середньовіччя."
    - "До Моци на захід від Єрусалима близько 8 км римською дорогою на мапі. Йосиф Флавій пише, що після війни Веспасіан оселив 800 ветеранів у місці, яке називалося Амаус, за тридцять стадій від Єрусалима за стандартним текстом (у деяких рукописах — шістдесят); багато хто ототожнює його з Моцою зі списку книги Ісуса Навина, чия пізніша назва Калунія, як вважають, зберігає латинське colonia. Точка на мапі стоїть біля Моци, а інші місця перелічено в картці місця; жодне з них не можна назвати достовірним."
  es:
    - "El emplazamiento de Emaús es discutido. Lucas lo sitúa a «sesenta estadios» (unos 11 km) de Jerusalén, y los cuatro lugares que se nombran con más frecuencia son Emaús-Nicópolis (Imwas), cerca de Latrún, Abu Ghosh, el-Qubeibeh y Motza (Qalunya), donde está el punto del mapa."
    - "La mayoría de los manuscritos de Lucas dan sesenta estadios; algunos, entre ellos el Códice Sinaítico, dan 160, unos 30 km. Emaús-Nicópolis, a unos 25 km al oeste de Jerusalén en línea recta, fue el Emaús de las guerras macabeas y romanas y el Emaús de la Iglesia antigua: Eusebio la tuvo por la patria de Cleofas, y aún se conservan allí los restos de una iglesia bizantina, pero solo concuerda con la lectura más larga. Abu Ghosh, a unos 12 km al oeste, en el camino de la costa, se tuvo por Emaús desde el siglo XII, y el-Qubeibeh, a unos 12 km al noroeste, desde la baja Edad Media."
    - "Motza, al oeste de Jerusalén, queda a unos 8 km por la calzada romana del mapa. Josefo dice que, tras la guerra, Vespasiano asentó a 800 veteranos en un lugar llamado Ammaús, a treinta estadios de Jerusalén según el texto estándar (algunos manuscritos leen sesenta); muchos lo identifican con Motza, la Mosa de la lista de Josué, cuyo nombre posterior, Qalunya, se piensa que recuerda el latín colonia. El punto del mapa está en Motza, y la ficha del lugar enumera los demás emplazamientos; ninguno puede darse por cierto."
  pt:
    - "A localização de Emaús é discutida. Lucas a situa “a sessenta estádios” de Jerusalém (cerca de 11 km), e quatro lugares são os mais citados: Emaús-Nicópolis (Imwas), perto de Latrun, Abu Ghosh, el-Qubeibeh e Motza (Qalunya), onde está o ponto do mapa."
    - "A maioria dos manuscritos de Lucas traz sessenta estádios; alguns, entre eles o Códice Sinaítico, trazem 160, cerca de 30 km. Emaús-Nicópolis, a cerca de 25 km a oeste de Jerusalém em linha reta, foi o Emaús das guerras macabaicas e romanas e o Emaús da Igreja antiga: Eusébio a tinha por terra de Cléopas, e ali ainda restam ruínas de uma igreja bizantina, mas ela só se ajusta à leitura mais longa. Abu Ghosh, a cerca de 12 km a oeste, no caminho da costa, foi tida por Emaús desde o século XII, e el-Qubeibeh, a cerca de 12 km a noroeste, desde o fim da Idade Média."
    - "Motza, a oeste de Jerusalém, fica a cerca de 8 km pela estrada romana do mapa. Josefo diz que, depois da guerra, Vespasiano estabeleceu 800 veteranos num lugar chamado Ammaus, a trinta estádios de Jerusalém no texto padrão (alguns manuscritos leem sessenta); muitos o identificam com Motza, a Mozá da lista de Josué, cujo nome posterior, Qalunya, se pensa recordar o latim colonia. O ponto do mapa fica em Motza, e a ficha do lugar relaciona os demais sítios; nenhum pode ser tido por certo."
  de:
    - "Die Lage von Emmaus ist umstritten. Lukas setzt es „sechzig Feld Wegs“ (sechzig Stadien, etwa 11 km) von Jerusalem entfernt an; am häufigsten werden vier Orte genannt: Emmaus-Nikopolis (Imwas) bei Latrun, Abu Ghosch, el-Qubeibeh und Motza (Qalunya), wo der Kartenpunkt steht."
    - "Die meisten Handschriften des Lukas nennen sechzig Stadien; einige, darunter der Codex Sinaiticus, nennen 160, etwa 30 km. Emmaus-Nikopolis, in der Luftlinie rund 25 km westlich von Jerusalem, war das Emmaus der makkabäischen und römischen Kriege und das Emmaus der alten Kirche: Eusebius hielt es für die Heimat des Kleopas, und die Reste einer byzantinischen Kirche stehen dort noch heute, doch passt es nur zur längeren Lesart. Abu Ghosch, rund 12 km westlich an der Straße zur Küste, galt seit dem 12. Jahrhundert als Emmaus, el-Qubeibeh, rund 12 km nordwestlich, seit dem späteren Mittelalter."
    - "Motza westlich von Jerusalem liegt auf der Römerstraße der Karte etwa 8 km entfernt. Josephus berichtet, Vespasian habe nach dem Krieg 800 Veteranen an einem Ort namens Ammaus angesiedelt, im Standardtext dreißig Stadien von Jerusalem entfernt (einige Handschriften lesen sechzig); viele setzen ihn mit Motza gleich, dem Moza der Liste im Buch Josua, dessen späterer Name Qalunya an das lateinische colonia erinnern soll. Der Kartenpunkt steht bei Motza, die Ortskarte führt die übrigen Orte auf; keiner lässt sich als sicher bezeichnen."
  fr:
    - "L’emplacement d’Emmaüs est discuté. Luc le situe à « soixante stades » de Jérusalem (environ 11 km), et quatre lieux sont le plus souvent proposés : Emmaüs-Nicopolis (Imwas), près de Latroun, Abu Ghosh, el-Qubeibeh et Motza (Qalunya), où se trouve le point de la carte."
    - "La plupart des manuscrits de Luc donnent soixante stades ; certains, dont le Codex Sinaiticus, en donnent cent soixante, soit environ 30 km. Emmaüs-Nicopolis, à environ 25 km à l’ouest de Jérusalem à vol d’oiseau, était l’Emmaüs des guerres maccabéennes et romaines et celui de l’Église ancienne : Eusèbe y voyait la patrie de Cléopas, et les restes d’une église byzantine y subsistent, mais elle ne convient qu’à la leçon longue. Abu Ghosh, à environ 12 km à l’ouest, sur la route de la côte, passa pour Emmaüs à partir du XIIe siècle, et el-Qubeibeh, à environ 12 km au nord-ouest, à partir de la fin du Moyen Âge."
    - "Motza, à l’ouest de Jérusalem, se trouve à environ 8 km par la voie romaine de la carte. Flavius Josèphe rapporte qu’après la guerre Vespasien installa 800 vétérans en un lieu appelé Ammaous, à trente stades de Jérusalem dans le texte courant (certains manuscrits portent soixante) ; beaucoup l’identifient à Motza, la Motsa de la liste de Josué, dont le nom ultérieur, Qalunya, rappellerait le latin colonia. Le point de la carte est placé à Motza, et la fiche du lieu énumère les autres sites ; aucun ne peut être tenu pour certain."
