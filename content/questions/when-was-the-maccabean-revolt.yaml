# Draft question (the years of the revolt; "where-did-the-hasmoneans-rule" takes the dynasty that followed).
id: when-was-the-maccabean-revolt
question:
  en: "When was the Maccabean revolt?"
  ru: "Когда было восстание Маккавеев?"
  uk: "Коли було Макавейське повстання?"
  es: "¿Cuándo fue la revuelta de los macabeos?"
  pt: "Quando foi a revolta dos macabeus?"
  de: "Wann war der Makkabäeraufstand?"
  fr: "Quand a eu lieu la révolte des Maccabées ?"
  pl: "Kiedy wybuchło powstanie machabejskie?"
  it: "Quando avvenne la rivolta dei Maccabei?"
  nl: "Wanneer was de Makkabeese opstand?"
  cs: "Kdy bylo makabejské povstání?"
  sv: "När var mackabéerupproret?"
  nb: "Når var makkabeeropprøret?"
  tl: "Kailan ang paghihimagsik ng mga Macabeo?"
  da: "Hvornår var makkabæeropstanden?"
  sr: "Када је био Макабејски устанак?"
  hu: "Mikor volt a makkabeus felkelés?"
  fi: "Milloin makkabilaiskapina oli?"
  vi: "Cuộc khởi nghĩa Ma-ca-bê diễn ra khi nào?"
  ro: "Când a fost răscoala Macabeilor?"
  bg: "Кога е било Макавейското въстание?"
answer:
  en:
    - "From 167 to 160 BC. Antiochus IV Epiphanes forbade the Jewish law and defiled the Temple in Jerusalem in December 167 BC; the priest Mattathias raised the revolt at Modein the same year; his son Judas Maccabeus won the battles of 166–164 and cleansed the Temple in December 164, the event kept as Hanukkah; Judas fell in 160. His brothers carried the struggle on until Simon won freedom from Seleucid tribute in 142 BC. The map stands at Jerusalem in 167 BC; a few scholars put the desecration a year earlier, in 168."
    - "Antiochus had become king in 175 BC; he plundered the Temple in 169, and after Rome turned him out of Egypt in 168 he ordered, in 167, pagan sacrifice throughout Judea. On the fifteenth of Kislev of the Seleucid year 145 the “abomination of desolation” was set on the altar, in the words Daniel uses of the king whose forces would “pollute the sanctuary of strength, and shall take away the daily sacrifice”. At Modein, north-west of Jerusalem, Mattathias killed the king's officer and the Jew who came to sacrifice, and fled to the hills with his five sons. Judas, called Maccabeus, probably “the hammer”, beat the Seleucid generals: Seron at Beth-horon about 166, Gorgias at Emmaus in 165, Lysias at Beth-zur in 164, and on 25 Kislev 164 the Temple was rededicated for eight days, the “feast of the dedication” at which John shows Jesus walking in Solomon's porch."
    - "The dates rest on the years of the Seleucid era in 1 Maccabees, which began in autumn 312 BC by the Macedonian count and in spring 311 by the Babylonian; the book seems to use both, so a few scholars read 15 Kislev of year 145 as December 168 rather than 167. Antiochus died on campaign in Persia late in 164, about the time of the dedication. Judas defeated Nicanor at Adasa on 13 Adar 161 and made a treaty with Rome, but in 160 he fell at Elasa fighting Bacchides. Daniel's “two thousand and three hundred days” until “the sanctuary be cleansed”, and his “thousand two hundred and ninety days” from the taking away of the daily sacrifice, were read of Antiochus's persecution already in antiquity, as Jerome's commentary records; the books of Maccabees that tell the story are in the Greek and Slavonic Bibles but not in the Hebrew canon."
  ru:
    - "С 167 по 160 г. до н. э. Антиох IV Епифан запретил иудейский закон и осквернил Храм в Иерусалиме в декабре 167 г. до н. э.; в том же году священник Маттафия поднял восстание в Модине; его сын Иуда Маккавей выиграл сражения 166–164 гг. и очистил Храм в декабре 164-го — это событие вспоминают в Хануку; Иуда погиб в 160 г. Его братья продолжали борьбу, пока Симон в 142 г. до н. э. не добился свободы от дани Селевкидам. Карта стоит на Иерусалиме в 167 г. до н. э.; немногие учёные относят осквернение на год раньше, к 168-му."
    - "Антиох стал царём в 175 г. до н. э.; в 169 г. он разграбил Храм, а после того как в 168 г. Рим заставил его уйти из Египта, в 167-м повелел приносить языческие жертвы по всей Иудее. Пятнадцатого кислева 145 года селевкидской эры на жертвеннике поставили «мерзость запустения» — словами Даниила о царе, чьё войско «осквернит святилище могущества, и прекратит ежедневную жертву». В Модине, селении к северо-западу от Иерусалима, Маттафия убил царского чиновника и иудея, подошедшего к жертве, и бежал в горы с пятью сыновьями. Иуда, прозванный Маккавеем — вероятно, «молотом», — разбил селевкидских военачальников: Сирона при Беф-Ороне около 166 г., Горгия при Эммаусе в 165-м, Лисия при Беф-Цуре в 164-м, а 25 кислева 164 г. Храм восемь дней заново освящали — это «праздник обновления», на котором Иоанн показывает Иисуса ходящим в притворе Соломоновом."
    - "Даты опираются на годы селевкидской эры в 1-й книге Маккавейской; эра начиналась осенью 312 г. до н. э. по македонскому счёту и весной 311-го по вавилонскому, а книга, по-видимому, пользуется обоими, поэтому немногие учёные читают 15 кислева 145 года как декабрь 168-го, а не 167-го. Антиох умер в походе в Персии в конце 164 г., примерно тогда же, когда освятили Храм. Иуда разбил Никанора при Адасе 13 адара 161 г. и заключил договор с Римом, но в 160-м пал при Елеасе в бою с Вакхидом. Данииловы «две тысячи триста вечеров и утр», после которых «святилище очистится», и «тысяча двести девяносто дней» от прекращения ежедневной жертвы относили к гонению Антиоха ещё в древности, как свидетельствует толкование Иеронима; книги Маккавейские, рассказывающие эту историю, есть в греческой и славянской Библии, но не в еврейском каноне."
  uk:
    - "Від 167 до 160 р. до н. е. Антіох IV Епіфан заборонив єврейський закон і осквернив Храм в Єрусалимі в грудні 167 р. до н. е.; священик Маттафій підняв повстання в Модіні того ж року; його син Юда Макавей виграв битви 166–164 рр. і очистив Храм у грудні 164 р., подія, що її відзначають як Хануку; Юда впав 160 р. Його брати продовжували боротьбу, доки Симон не здобув свободу від селевкідської данини 142 р. до н. е. Мапа стоїть в Єрусалимі 167 р. до н. е.; декілька вчених ставить осквернення на рік раніше, 168 р."
    - "Антіох став царем 175 р. до н. е.; він пограбував Храм 169 р., а після того, як Рим вигнав його з Єгипту 168 р., наказав 167 р. язичницькі жертви по всій Юдеї. П'ятнадцятого кислева селевкідського 145 року на жертовнику було поставлено гидоту спустошення — словами Даниїла про царя, чиє військо «опоганить сьвятиню могутностї і спинить щоденну жертву». У Модіні, на північний захід від Єрусалиму, Маттафій убив царського урядника і єврея, що прийшов жертвувати, і втік у гори з п'ятьма синами. Юда, званий Макавеєм, імовірно «молот», побив селевкідських воєвод: Серона при Бет-Хороні близько 166 р., Горгія при Еммаусі 165 р., Лісія при Бет-Цурі 164 р., і 25 кислева 164 р. Храм було заново освячено на вісім днів — «поновини», на яких Іван показує Ісуса, що «ходив … по церкві у Соломоновім ходнику»."
    - "Дати спираються на роки селевкідської ери в 1 Книзі Макавеїв, що почалася восени 312 р. до н. е. за македонським відліком і навесні 311 р. за вавилонським; книга, схоже, вживає обидва, тож деякі вчені читають 15 кислева 145 року як грудень 168, а не 167 р. Антіох помер у поході в Персії наприкінці 164 р., приблизно в час освячення. Юда переміг Ніканора при Адасі 13 адара 161 р. і уклав договір із Римом, але 160 р. упав при Еласі, воюючи з Бакхідом. Данилові «дві тисячі триста вечорів та ранків; аж тодї буде сьвятиня знов очищена» і його «тисяча двістї девятьдесять днїв» від припинення щоденної жертви читали про переслідування Антіоха вже в давнину, як записує коментар Єроніма; книги Макавеїв, що розповідають цю історію, є в грецьких і слов'янських Бібліях, але не в єврейському каноні."
  es:
    - "Del 167 al 160 a. C. Antíoco IV Epífanes prohibió la ley judía y profanó el Templo de Jerusalén en diciembre del 167 a. C.; el sacerdote Matatías levantó la revuelta en Modín ese mismo año; su hijo Judas Macabeo ganó las batallas de 166–164 y purificó el Templo en diciembre del 164, hecho que se conmemora como Janucá; Judas cayó en el 160. Sus hermanos continuaron la lucha hasta que Simón obtuvo la libertad del tributo seléucida en el 142 a. C. El mapa se sitúa en Jerusalén en el 167 a. C.; unos pocos estudiosos sitúan la profanación un año antes, en el 168."
    - "Antíoco reinaba desde el 175 a. C.; saqueó el Templo en el 169, y tras ser expulsado de Egipto por Roma en el 168 ordenó, en el 167, el sacrificio pagano en toda Judea. El día quince de Quislev del año 145 seléucida se colocó sobre el altar la «abominación espantosa», en las palabras que Daniel usa del rey cuyas fuerzas «contaminarán el santuario de fortaleza, y quitarán el continuo sacrificio». En Modín, al noroeste de Jerusalén, Matatías mató al oficial del rey y al judío que se acercó a sacrificar, y huyó a las colinas con sus cinco hijos. Judas, llamado Macabeo, probablemente «el martillo», derrotó a generales seléucidas: Serón en Bet-horón hacia el 166, Gorgias en Emaús en el 165, Lisias en Bet-sur en el 164, y el 25 de Quislev del 164 el Templo fue rededicado durante ocho días, la «fiesta de la dedicación» en la que Juan muestra a Jesús en el pórtico de Salomón."
    - "Las fechas se apoyan en la era seléucida de 1 Macabeos, que comenzó en otoño del 312 a. C. según el cómputo macedonio y en primavera del 311 según el babilonio; el libro parece usar ambos, y unos pocos estudiosos leen el 15 de Quislev del año 145 como diciembre del 168 y no del 167. Antíoco murió en campaña en Persia a fines del 164, hacia la dedicación. Judas derrotó a Nicanor en Adasa el 13 de Adar del 161 e hizo un tratado con Roma, pero en el 160 cayó en Elasa combatiendo a Báquides. Los «dos mil y trescientos días» de Daniel hasta que «el santuario será purificado», y sus «mil doscientos y noventa días» desde que fuere quitado el continuo sacrificio, se leyeron ya en la Antigüedad sobre la persecución de Antíoco, como registra el comentario de Jerónimo; los libros de los Macabeos que la cuentan están en las Biblias griega y eslava, no en el canon hebreo."
  pt:
    - "De 167 a 160 a.C. Antíoco IV Epifânio proibiu a lei judaica e profanou o Templo de Jerusalém em dezembro de 167 a.C.; o sacerdote Matatias levantou a revolta em Modin no mesmo ano; seu filho Judas Macabeu venceu as batalhas de 166–164 e purificou o Templo em dezembro de 164, fato lembrado no Hanucá; Judas tombou em 160. Seus irmãos prosseguiram a luta até que Simão obteve a liberdade do tributo selêucida em 142 a.C. O mapa está em Jerusalém em 167 a.C.; alguns estudiosos situam a profanação um ano antes, em 168."
    - "Antíoco se tornara rei em 175 a.C.; saqueou o Templo em 169 e, depois que Roma o expulsou do Egito em 168, ordenou em 167 o sacrifício pagão em toda a Judeia. No dia 15 de quisleu do ano selêucida 145 foi posta sobre o altar a “abominação que causa desolação”, nas palavras que Daniel usa do rei cujas forças “profanarão o santuário, a própria fortaleza, e removerão o holocausto contínuo”. Em Modin, a noroeste de Jerusalém, Matatias matou o oficial do rei e o judeu que veio sacrificar, e fugiu para os montes com seus cinco filhos. Judas, chamado Macabeu, provavelmente “o martelo”, derrotou os generais selêucidas: Seron em Bete-Horom por volta de 166, Górgias em Emaús em 165, Lísias em Bete-Zur em 164, e em 25 de quisleu de 164 o Templo foi rededicado por oito dias, a “Festa da Dedicação” em que João mostra Jesus caminhando no pórtico de Salomão."
    - "As datas se apoiam nos anos da era selêucida em 1 Macabeus, que começou no outono de 312 a.C. pela contagem macedônia e na primavera de 311 pela babilônica; o livro parece usar ambas, e por isso alguns estudiosos leem 15 de quisleu do ano 145 como dezembro de 168 e não de 167. Antíoco morreu em campanha na Pérsia no fim de 164, perto da época da dedicação. Judas derrotou Nicanor em Adasa em 13 de adar de 161 e fez um tratado com Roma, mas em 160 tombou em Elasa lutando contra Báquides. As “duas mil e trezentas tardes e manhãs” de Daniel, após as quais “o santuário será purificado”, e seus “mil duzentos e noventa dias” desde a retirada do holocausto contínuo, já eram lidas na Antiguidade a respeito da perseguição de Antíoco, como registra o comentário de Jerônimo; os livros dos Macabeus que contam a história estão nas Bíblias grega e eslava, mas não no cânon hebraico."
  de:
    - "Von 167 bis 160 v. Chr. Antiochos IV. Epiphanes verbot das jüdische Gesetz und entweihte den Tempel in Jerusalem im Dezember 167 v. Chr.; der Priester Mattatias entfachte im selben Jahr in Modein den Aufstand; sein Sohn Judas Makkabäus gewann die Schlachten von 166–164 und reinigte den Tempel im Dezember 164, was als Chanukka begangen wird; Judas fiel 160. Seine Brüder führten den Kampf fort, bis Simon 142 v. Chr. die Freiheit vom seleukidischen Tribut errang. Die Karte steht 167 v. Chr. bei Jerusalem; wenige Gelehrte setzen die Entweihung ein Jahr früher, 168."
    - "Antiochos war 175 v. Chr. König geworden; er plünderte 169 den Tempel, und nachdem Rom ihn 168 aus Ägypten vertrieben hatte, ordnete er 167 heidnische Opfer in ganz Judäa an. Am fünfzehnten Kislew des seleukidischen Jahres 145 wurde der „Greuel der Verwüstung“ auf dem Altar errichtet, mit Daniels Worten für den König, dessen Heere „das Heiligtum in der Feste entweihen und das tägliche Opfer abtun“ würden. In Modein, nordwestlich von Jerusalem, tötete Mattatias den Beamten des Königs und den Juden, der opfern wollte, und floh mit seinen fünf Söhnen in die Berge. Judas, genannt Makkabäus, wohl „der Hammer“, schlug die seleukidischen Feldherren: Seron bei Bet-Horon um 166, Gorgias bei Emmaus 165, Lysias bei Bet-Zur 164, und am 25. Kislew 164 wurde der Tempel acht Tage lang neu geweiht, die „Kirchweihe“, bei der Johannes Jesus in der Halle Salomos wandeln lässt."
    - "Die Daten beruhen auf den Jahren der seleukidischen Ära im 1. Makkabäerbuch, die nach makedonischer Zählung im Herbst 312 v. Chr. begann, nach babylonischer im Frühjahr 311; das Buch scheint beide zu verwenden, sodass wenige den 15. Kislew 145 als Dezember 168 statt 167 lesen. Antiochos starb Ende 164 auf einem Feldzug in Persien, etwa zur Zeit der Weihe. Judas besiegte Nikanor bei Adasa am 13. Adar 161 und schloss einen Vertrag mit Rom, fiel aber 160 bei Elasa im Kampf gegen Bakchides. Daniels „zweitausend dreihundert Abende und Morgen“, bis „das Heiligtum wieder geweiht werden“ wird, und seine „tausend zweihundertundneunzig Tage“ seit der Abschaffung des täglichen Opfers bezog man schon in der Antike auf Antiochos' Verfolgung, wie Hieronymus' Kommentar festhält; die Makkabäerbücher stehen in der griechischen und slawischen Bibel, nicht im hebräischen Kanon."
  fr:
    - "De 167 à 160 av. J.-C. Antiochus IV Épiphane interdit la loi juive et profana le Temple de Jérusalem en décembre 167 av. J.-C. ; le prêtre Mattathias leva la révolte à Modin la même année ; son fils Judas Maccabée remporta les batailles de 166–164 et purifia le Temple en décembre 164, événement conservé comme Hanoucca ; Judas tomba en 160. Ses frères poursuivirent la lutte jusqu’à ce que Simon obtienne en 142 av. J.-C. l’affranchissement du tribut séleucide. La carte se place à Jérusalem en 167 av. J.-C. ; quelques savants placent la profanation un an plus tôt, en 168."
    - "Antiochus était devenu roi en 175 av. J.-C. ; il pilla le Temple en 169, et, après que Rome l’eut chassé d’Égypte en 168, il ordonna en 167 un sacrifice païen dans toute la Judée. Le 15 Kisleu de l’année séleucide 145, l’« abomination du dévastateur » fut dressée sur l’autel, selon les termes que Daniel emploie du roi dont les troupes « profaneront le sanctuaire, la forteresse, … feront cesser le sacrifice perpétuel ». À Modin, au nord-ouest de Jérusalem, Mattathias tua l’officier du roi et le Juif venu sacrifier, et s’enfuit dans les collines avec ses cinq fils. Judas, dit Maccabée, probablement « le marteau », battit les généraux séleucides : Séron à Beth-Horon vers 166, Gorgias à Emmaüs en 165, Lysias à Beth-Tsur en 164, et le 25 Kisleu 164 le Temple fut redédié pour huit jours, la « fête de la Dédicace » où Jean montre Jésus sous le portique de Salomon."
    - "Les dates reposent sur les années de l’ère séleucide dans 1 Maccabées, qui commença à l’automne 312 av. J.-C. selon le comput macédonien et au printemps 311 selon le babylonien ; le livre semble employer les deux, d’où quelques lectures du 15 Kisleu de l’an 145 comme décembre 168 plutôt que 167. Antiochus mourut en campagne en Perse fin 164, vers la dédicace. Judas vainquit Nicanor à Adasa le 13 Adar 161 et conclut un traité avec Rome, mais tomba en 160 à Élasa face à Bacchidès. Les « deux mille trois cents soirs et matins » de Daniel, après quoi « le sanctuaire sera purifié », et ses « mille deux cent quatre-vingt-dix jours » depuis la suppression du sacrifice perpétuel furent lus dès l’Antiquité de la persécution d’Antiochus, comme le relève Jérôme ; les livres des Maccabées sont dans les Bibles grecque et slavonne, non dans le canon hébreu."
  pl:
    - "Od 167 do 160 p.n.e. Antioch IV Epifanes zakazał prawa żydowskiego i zbezcześcił Świątynię w Jerozolimie w grudniu 167 p.n.e.; kapłan Mattatiasz wzniecił powstanie w Modin w tym samym roku; jego syn Juda Machabeusz wygrał bitwy z lat 166–164 i oczyścił Świątynię w grudniu 164, co obchodzi się jako Chanukę; Juda poległ w 160. Jego bracia prowadzili walkę dalej, aż Szymon wywalczył wolność od seleukidzkiej daniny w 142 p.n.e. Mapa stoi w Jerozolimie w 167 p.n.e.; nieliczni uczeni umieszczają zbezczeszczenie rok wcześniej, w 168."
    - "Antioch został królem w 175 p.n.e.; złupił Świątynię w 169, a gdy Rzym wyparł go z Egiptu w 168, nakazał w 167 pogańskie ofiary w całej Judei. Piętnastego Kislew roku seleukidzkiego 145 na ołtarzu postawiono „obrzydliwość spustoszenia”, słowami, których Daniel używa o królu, którego wojska „splugawią świątnicę, i twierdze zniosą; odejmą też ustawiczną ofiarę”. W Modin, na północny zachód od Jerozolimy, Mattatiasz zabił królewskiego urzędnika i Żyda, który przyszedł ofiarować, i uciekł w góry z pięcioma synami. Juda, zwany Machabeuszem, prawdopodobnie „młotem”, pokonał seleukidzkich wodzów: Serona pod Bet-Choron około 166, Gorgiasza pod Emaus w 165, Lizjasza pod Bet-Sur w 164, a 25 Kislew 164 Świątynię poświęcono na nowo na osiem dni, w owo „poświęcanie kościoła”, podczas którego Jan ukazuje Jezusa przechadzającego się w przysionku Salomona."
    - "Daty opierają się na latach ery seleukidzkiej w 1 Księdze Machabejskiej, która zaczęła się jesienią 312 p.n.e. według rachuby macedońskiej, a wiosną 311 według babilońskiej; księga zdaje się używać obu, więc nieliczni odczytują 15 Kislew roku 145 jako grudzień 168, nie 167. Antioch zmarł na wyprawie w Persji pod koniec 164, mniej więcej w czasie poświęcenia. Juda pokonał Nikanora pod Adasa 13 Adar 161 i zawarł układ z Rzymem, ale w 160 poległ pod Elasa, walcząc z Bakchidesem. Słowa Daniela „Aż do dwóch tysięcy i trzech set wieczorów i poranków; tedy przyjdą do odnowienia swego usługi święte” oraz „będzie dni tysiąc, dwieście i dziewięćdziesiąt” od odjęcia ofiary ustawicznej odczytywano o prześladowaniu Antiocha już w starożytności, jak notuje komentarz Hieronima; księgi Machabejskie, które opowiadają tę historię, są w Biblii greckiej i słowiańskiej, ale nie w kanonie hebrajskim."
  it:
    - "Dal 167 al 160 a.C. Antioco IV Epifane vietò la legge giudaica e profanò il Tempio di Gerusalemme nel dicembre del 167 a.C.; il sacerdote Mattatia diede inizio alla rivolta a Modin nello stesso anno; suo figlio Giuda Maccabeo vinse le battaglie del 166–164 e purificò il Tempio nel dicembre del 164, evento ricordato come Hanukkah; Giuda cadde nel 160. I suoi fratelli proseguirono la lotta finché Simone ottenne la libertà dal tributo seleucide nel 142 a.C. La mappa si trova a Gerusalemme nel 167 a.C.; pochi studiosi pongono la profanazione un anno prima, nel 168."
    - "Antioco era divenuto re nel 175 a.C.; saccheggiò il Tempio nel 169, e dopo che Roma lo cacciò dall’Egitto nel 168 ordinò nel 167 il sacrificio pagano in tutta la Giudea. Il quindici di Kislev dell’anno seleucide 145 l’«abominazione, che cagiona la desolazione» fu posta sull’altare, nelle parole di Daniele sul re le cui forze «profaneranno il santuario, la fortezza, sopprimeranno il sacrifizio continuo». A Modin, a nord-ovest di Gerusalemme, Mattatia uccise l’ufficiale del re e il Giudeo venuto a sacrificare, e fuggì sui monti coi cinque figli. Giuda, detto Maccabeo, probabilmente «il martello», sconfisse i generali seleucidi: Seron a Bet-Oron intorno al 166, Gorgia a Emmaus nel 165, Lisia a Bet-Zur nel 164, e il 25 di Kislev del 164 il Tempio fu ridedicato per otto giorni, la «festa della Dedicazione» in cui Giovanni mostra Gesù che passeggia nel portico di Salomone."
    - "Le date poggiano sugli anni dell’era seleucide in 1 Maccabei, che cominciò nell’autunno del 312 a.C. secondo il computo macedone e nella primavera del 311 secondo quello babilonese; il libro sembra usare entrambi, e alcuni leggono il 15 di Kislev dell’anno 145 come dicembre 168 anziché 167. Antioco morì in campagna in Persia a fine 164, circa al tempo della dedicazione. Giuda sconfisse Nicanore ad Adasa il 13 di Adar del 161 e stipulò un trattato con Roma, ma nel 160 cadde a Elasa combattendo contro Bacchide. I «duemila trecento sere e mattine; poi il santuario sarà purificato» di Daniele e i suoi «milleduecento novanta giorni» dalla soppressione del sacrificio continuo furono riferiti alla persecuzione di Antioco già in antico, come nota il commento di Girolamo; i libri dei Maccabei che raccontano la storia sono nelle Bibbie greca e slava ma non nel canone ebraico."
  nl:
    - "Van 167 tot 160 v.Chr. Antiochus IV Epifanes verbood de Joodse wet en ontheiligde de tempel in Jeruzalem in december 167 v.Chr.; de priester Mattathias startte datzelfde jaar de opstand te Modein; zijn zoon Judas Makkabeüs won de veldslagen van 166–164 en reinigde de tempel in december 164, de gebeurtenis die als Chanoeka wordt gevierd; Judas sneuvelde in 160. Zijn broers zetten de strijd voort tot Simon in 142 v.Chr. vrijheid van Seleucidische schatting verwierf. De kaart staat bij Jeruzalem in 167 v.Chr.; enkele geleerden plaatsen de ontheiliging een jaar eerder, in 168."
    - "Antiochus, koning sinds 175 v.Chr., plunderde de tempel in 169 en beval in 167, nadat Rome hem in 168 uit Egypte had verdreven, heidense offers in heel Judea. Op 15 Kislew van het Seleucidische jaar 145 werd “een verwoestenden gruwel” op het altaar gesteld, in Daniëls woorden over de koning wiens legers “het heiligdom ontheiligen, en de sterkte, en zij zullen het gedurige offer wegnemen”. Te Modein, ten noordwesten van Jeruzalem, doodde Mattathias de koninklijke officier en een offerende Jood en vluchtte met zijn vijf zonen de bergen in. Judas, Makkabeüs genoemd, wellicht “de hamer”, versloeg de Seleucidische veldheren: Seron bij Beth-Horon omstreeks 166, Gorgias bij Emmaüs in 165, Lysias bij Beth-Zur in 164, en op 25 Kislew 164 werd de tempel acht dagen opnieuw gewijd, het “feest der vernieuwing des tempels” waarop Johannes Jezus in Salomo’s zuilengang laat wandelen."
    - "De data rusten op de Seleucidische jaartelling in 1 Makkabeeën, die in de herfst van 312 v.Chr. begon volgens de Macedonische telling en in de lente van 311 volgens de Babylonische; het boek lijkt beide te gebruiken, dus enkelen lezen 15 Kislew van jaar 145 als december 168 in plaats van 167. Antiochus stierf eind 164 op veldtocht in Perzië, omstreeks de inwijding. Judas versloeg Nicanor bij Adasa op 13 Adar 161 en sloot een verdrag met Rome, maar sneuvelde in 160 bij Elasa tegen Bacchides. Daniëls “twee duizend en driehonderd avonden en morgens” tot “het heiligdom gerechtvaardigd worden” en zijn “duizend tweehonderd en negentig dagen” vanaf het wegnemen van het gedurige offer werden al in de oudheid op Antiochus’ vervolging betrokken, zoals Hiëronymus vermeldt; de Makkabeeënboeken staan in de Griekse en Slavische bijbels, niet in de Hebreeuwse canon."
  cs:
    - "Od roku 167 do 160 př. n. l. Antiochos IV. Epifanés zakázal židovský zákon a znesvětil chrám v Jeruzalémě v prosinci 167 př. n. l.; kněz Matatiáš vyvolal téhož roku povstání v Modeínu; jeho syn Juda Makabejský vyhrál bitvy let 166–164 a očistil chrám v prosinci 164, událost připomínanou jako Chanuka; Juda padl roku 160. Jeho bratři pokračovali v boji, dokud Šimon roku 142 př. n. l. nevybojoval svobodu od seleukovského tributu. Mapa stojí v Jeruzalémě v roce 167 př. n. l.; někteří badatelé kladou znesvěcení o rok dříve, do roku 168."
    - "Antiochos se stal králem roku 175 př. n. l.; chrám vyloupil roku 169 a poté, co jej Řím roku 168 vyhnal z Egypta, nařídil roku 167 pohanské oběti po celém Judsku. Patnáctého kislevu seleukovského roku 145 byla na oltář postavena „ohavnost zpuštění“, slovy, jimiž Daniel mluví o králi, jehož vojska „poškvrní svatyně a pevnosti; odejmou také obět ustavičnou“. V Modeínu, severozápadně od Jeruzaléma, Matatiáš zabil králova důstojníka a Žida, který přišel obětovat, a utekl s pěti syny do hor. Juda, zvaný Makabejský, pravděpodobně „kladivo“, porazil seleukovské vojevůdce: Serona u Bét-choronu asi roku 166, Gorgiase u Emauz roku 165, Lysiáše u Bét-cúru roku 164, a 25. kislevu 164 byl chrám osm dní znovu zasvěcován, na „posvícení“, o němž Jan ukazuje Ježíše, jak se „procházel … v chrámě po síňci Šalomounově“."
    - "Data spočívají na letech seleukovské éry v První knize Makabejské, která začala na podzim 312 př. n. l. podle makedonského počtu a na jaře 311 podle babylonského; kniha zřejmě užívá obojí, takže někteří badatelé čtou 15. kislev roku 145 jako prosinec 168, nikoli 167. Antiochos zemřel na výpravě v Persii koncem 164, kolem doby znovuzasvěcení. Juda porazil Nikanóra u Adasy 13. adaru 161 a uzavřel smlouvu s Římem, ale roku 160 padl u Elasy v boji proti Bakchidovi. Danielovy dny „do dvou tisíc a tří set večerů a jiter“, než „přijdou k obnovení svému svaté služby“, a jeho „dnů tisíc, dvě stě a devadesát“ od odejmutí ustavičné oběti se vykládaly o Antiochově pronásledování již ve starověku, jak zaznamenává Jeronýmův komentář; knihy Makabejské, které příběh vyprávějí, jsou v řecké a slovanské Bibli, ale nejsou v hebrejském kánonu."
  sv:
    - "Från 167 till 160 f.Kr. Antiochos IV Epifanes förbjöd den judiska lagen och vanhelgade templet i Jerusalem i december 167 f.Kr.; prästen Mattatias startade upproret i Modin samma år; hans son Judas Mackabaios vann striderna 166–164 och renade templet i december 164, händelsen som firas som Hanukka; Judas stupade 160. Hans bröder förde kampen vidare tills Simon vann frihet från seleukidisk tribut 142 f.Kr. Kartan står vid Jerusalem år 167 f.Kr.; några forskare förlägger vanhelgandet ett år tidigare, 168."
    - "Antiochos hade blivit kung 175 f.Kr.; han plundrade templet 169, och efter att Rom drivit ut honom ur Egypten 168 befallde han 167 hednisk offerritual i hela Judeen. Den femtonde kislev i det seleukidiska året 145 sattes ”förödelsens styggelse” upp på altaret, med de ord Daniel använder om den kung vars härar skulle ”oskära helgedomens fäste och avskaffa det dagliga offret”. I Modin, nordväst om Jerusalem, dräpte Mattatias kungens ämbetsman och juden som kom för att offra, och flydde till bergen med sina fem söner. Judas, kallad Mackabaios, sannolikt ”hammaren”, besegrade de seleukidiska härförarna: Seron vid Bet-Horon omkring 166, Gorgias vid Emmaus 165, Lysias vid Bet-Sur 164, och den 25 kislev 164 återinvigdes templet i åtta dagar, ”tempelinvigningens högtid” då Johannes låter Jesus gå i Salomos pelargång."
    - "Dateringarna vilar på åren i den seleukidiska eran i Första Mackabeerboken, som började hösten 312 f.Kr. enligt den makedoniska räkningen och våren 311 enligt den babyloniska; boken tycks använda båda, så några forskare läser 15 kislev år 145 som december 168 snarare än 167. Antiochos dog under ett fälttåg i Persien sent 164, ungefär vid tiden för invigningen. Judas besegrade Nikanor vid Adasa den 13 adar 161 och slöt ett fördrag med Rom, men 160 stupade han vid Elasa i strid mot Bacchides. Daniels ”Två tusen tre hundra aftnar och morgnar; därefter skall helgedomen komma till sin rätt igen” och hans ”ett tusen två hundra nittio dagar” från det dagliga offrets avskaffande lästes redan i antiken om Antiochos förföljelse, som Hieronymus kommentar uppger; Mackabeerböckerna som berättar historien finns i de grekiska och slaviska biblarna men inte i den hebreiska kanonen."
  nb:
    - "Fra 167 til 160 f.Kr. Antiokhos IV Epifanes forbød den jødiske loven og vanhelliget tempelet i Jerusalem i desember 167 f.Kr.; presten Mattatias reiste opprøret i Modin samme år; hans sønn Judas Makkabeus vant slagene i 166–164 og renset tempelet i desember 164, hendelsen som minnes som hanukka; Judas falt i 160. Brødrene hans førte kampen videre til Simon vant frihet fra seleukidenes tributt i 142 f.Kr. Kartet står ved Jerusalem i 167 f.Kr.; noen få forskere setter vanhelligelsen ett år tidligere, i 168."
    - "Antiokhos var blitt konge i 175 f.Kr.; han plyndret tempelet i 169, og etter at Roma drev ham ut av Egypt i 168 påbød han i 167 hedensk ofring i hele Judea. Den femtende kislev i det seleukidiske året 145 ble «den ødeleggende vederstyggelighet» satt på alteret, med Daniels ord om kongen hvis hærer skulle «vanhellige helligdommen, den faste borg, og avskaffe det stadige offer». I Modin, nordvest for Jerusalem, drepte Mattatias kongens offiser og jøden som kom for å ofre, og flyktet til fjells med sine fem sønner. Judas, kalt Makkabeus, trolig «hammeren», slo de seleukidiske generalene: Seron ved Bet-Horon omkring 166, Gorgias ved Emmaus i 165, Lysias ved Bet-Sur i 164, og 25. kislev 164 ble tempelet innviet på nytt i åtte dager, «tempelvielsens fest» der Johannes viser Jesus gå omkring i Salomos søylegang."
    - "Datoene hviler på årene i den seleukidiske tidsregningen i 1 Makkabeerbok, som begynte høsten 312 f.Kr. etter den makedonske regningen og våren 311 etter den babylonske; boken ser ut til å bruke begge, så noen få forskere leser 15. kislev i år 145 som desember 168 i stedet for 167. Antiokhos døde på felttog i Persia seint i 164, omtrent samtidig med innvielsen. Judas beseiret Nikanor ved Adasa 13. adar 161 og sluttet en traktat med Roma, men i 160 falt han ved Elasa i kamp mot Bakkides. Daniels «To tusen og tre hundre aftener og morgener» til «helligdommen komme til sin rett igjen», og hans «tusen, to hundre og nitti dager» fra det stadige offer blir avskaffet, ble lest om Antiokhos' forfølgelse allerede i oldtiden, slik Hieronymus' kommentar viser; makkabeerbøkene som forteller historien, står i de greske og slaviske biblene, men ikke i den hebraiske kanon."
  tl:
    - "Mula 167 hanggang 160 BK. Ipinagbawal ni Antioco IV Epifanes ang kautusang Judio at nilapastangan ang Templo sa Jerusalem noong Disyembre 167 BK; itinaas ng saserdoteng si Matatias ang paghihimagsik sa Modin sa parehong taon; ang anak niyang si Judas Macabeo ay nanalo sa mga labanan ng 166–164 at nilinis ang Templo noong Disyembre 164, ang pangyayaring ipinagdiriwang bilang Hanukkah; nabuwal si Judas noong 160. Ipinagpatuloy ng kaniyang mga kapatid ang pakikibaka hanggang makamit ni Simon ang kalayaan mula sa tributong Seleucida noong 142 BK. Ang mapa ay nasa Jerusalem noong 167 BK; itinatakda ng ilang iskolar ang paglapastangan nang isang taon na mas maaga, sa 168."
    - "Naging hari si Antioco noong 175 BK, sinamsam ang Templo noong 169, at matapos itaboy ng Roma sa Egipto noong 168, nag-utos noong 167 ng paganong paghahandog sa buong Judea. Sa 15 Kislev ng taong Seleucida 145, inilagay sa dambana ang “kasuklamsuklam na naninira”, ayon kay Daniel sa haring ang pulutong ay “lalapastanganin ang santuario, sa makatuwid baga'y ang kuta, at aalisin ang palaging handog na susunugin”. Sa Modin, hilagang-kanluran ng Jerusalem, pinatay ni Matatias ang opisyal ng hari at ang Judiong maghahandog, at tumakas sa burol kasama ang limang anak. Tinalo ni Judas na Macabeo, marahil “ang pamukpok”, ang mga heneral na Seleucida: si Seron sa Beth-horon mga 166, si Gorgias sa Emaus noong 165, si Lisias sa Beth-zur noong 164; noong 25 Kislev 164, muling inilaan ang Templo nang 8 araw, ang “kapistahan ng pagtatalaga” na pinaglakaran ni Jesus sa portiko ni Salomon ayon kay Juan."
    - "Batay ang petsa sa taon ng panahong Seleucida sa 1 Macabeo, na nagsimula sa taglagas ng 312 BK sa Macedonio at tagsibol ng 311 sa Babilonio; tila gamit ng aklat ang pareho, kaya Disyembre 168, hindi 167, ang 15 Kislev ng taon 145 sa ilang iskolar. Namatay si Antioco sa kampanya sa Persia huling bahagi ng 164, halos kasabay ng paglalaan. Tinalo ni Judas si Nicanor sa Adasa noong 13 Adar 161 at nakipagkasundo sa Roma, ngunit nabuwal siya sa Elasa noong 160 laban kay Baquides. Ang “dalawang libo at tatlong daan na hapon at umaga” ni Daniel hanggang “malilinis ang santuario”, at ang “isang libo't dalawang daan at siyam na pung araw” mula sa pag-aalis ng palaging handog, ay binasa na noong sinaunang panahon tungkol sa pag-uusig ni Antioco, ayon sa komentaryo ni Jeronimo; ang mga aklat ng Macabeo ay nasa Biblia sa Griyego at Eslabo ngunit wala sa kanon ng Hebreo."
  da:
    - "Fra 167 til 160 f.Kr. Antiochus IV Epifanes forbød den jødiske lov og vanhelligede Templet i Jerusalem i december 167 f.Kr.; præsten Mattatias rejste opstanden i Modin samme år; hans søn Judas Makkabæus vandt slagene 166–164 og rensede Templet i december 164, begivenheden, der fejres som Hanukka; Judas faldt i 160. Hans brødre førte kampen videre, indtil Simon i 142 f.Kr. vandt frihed fra seleukidisk tribut. Kortet står ved Jerusalem i 167 f.Kr.; nogle få forskere placerer vanhelligelsen et år tidligere, i 168."
    - "Antiochus var blevet konge i 175 f.Kr.; han plyndrede Templet i 169, og efter at Rom havde vist ham ud af Egypten i 168, befalede han i 167 hedensk ofring i hele Judæa. Den femtende Kislev i det seleukidiske år 145 blev »den ødelæggende Vederstyggelighed« sat op på alteret, med de ord Daniel bruger om kongen, hvis styrke skulle »vanhellige Helligdommen, den faste Borg, og den skal borttage den stadige Tjeneste«. I Modin, nordvest for Jerusalem, dræbte Mattatias kongens officer og den jøde, der kom for at ofre, og flygtede op i bjergene med sine fem sønner. Judas, kaldet Makkabæus, sandsynligvis »hammeren«, slog de seleukidiske generaler: Seron ved Bet-Horon omkring 166, Gorgias ved Emmaus i 165, Lysias ved Bet-Sur i 164, og den 25. Kislev 164 blev Templet genindviet i otte dage, »Tempelvielsens Fest«, hvor Johannes viser Jesus gående i Salomons søjlegang."
    - "Datoerne hviler på den seleukidiske æra i 1 Makkabæerbog, som begyndte i efteråret 312 f.Kr. efter den makedoniske tælling og i foråret 311 efter den babyloniske; bogen synes at bruge begge, så nogle få forskere læser 15. Kislev i år 145 som december 168 frem for 167. Antiochus døde på felttog i Persien sent i 164, omkring genindvielsen. Judas besejrede Nikanor ved Adasa den 13. Adar 161 og sluttede en traktat med Rom, men i 160 faldt han ved Elasa i kamp mod Bakkides. Daniels »to Tusinde og tre Hundrede Aftener og Morgener, saa skal Helligdommen faa sin Ret igen« og hans »Tusinde to Hundrede og halvfemsindstyve Dage« fra borttagelsen af den stadige tjeneste blev allerede i oldtiden læst om Antiochus' forfølgelse, som Hieronymus' kommentar beretter; Makkabæerbøgerne, der fortæller historien, findes i de græske og slaviske bibler, men ikke i den hebraiske kanon."
  sr:
    - "Од 167. до 160. п. н. е. Антиох IV Епифан забранио је јеврејски закон и оскврнио Храм у Јерусалиму у децембру 167. п. н. е.; свештеник Мататија подигао је устанак у Модину исте године; његов син Јуда Макабејац добио је битке 166–164. и очистио Храм у децембру 164, догађај који се обележава као Ханука; Јуда је пао 160. Његова браћа наставила су борбу док Симон није 142. п. н. е. извојевао слободу од селеукидског данка. Карта стоји на Јерусалиму у 167. п. н. е.; неколицина научника ставља оскрнављење годину раније, у 168."
    - "Антиох је постао краљ 175. п. н. е.; опљачкао је Храм 169, а пошто га је Рим 168. истерао из Египта, наредио је 167. незнабожачку жртву по целој Јудеји. Петнаестог кислева селеукидске године 145. на жртвеник је постављена „гнусоба пустошна“, речима које Данило употребљава за краља чија војска „оскврниће светињу у граду, и укинути жртву свагдашњу“. У Модину, северозападно од Јерусалима, Мататија је убио краљевог чиновника и Јеврејина који је дошао да принесе жртву, и побегао у брда са својих пет синова. Јуда, зван Макабејац, вероватно „чекић“, потукао је селеукидске војсковође: Серона код Вет-Орона око 166, Горгију код Емауса 165, Лисију код Вет-Сура 164, а 25. кислева 164. Храм је поново посвећен осам дана, „празник обновљења“ на коме Јован приказује Исуса како хода по Соломуновом трему."
    - "Датуми почивају на годинама селеукидске ере у Првој књизи о Макабејцима, која је почела у јесен 312. п. н. е. по македонском рачуну, а у пролеће 311. по вавилонском; чини се да књига користи оба, па неколицина научника 15. кислев године 145. чита као децембар 168. пре него 167. Антиох је умро у походу у Персији крајем 164, отприлике у време посвећења. Јуда је победио Никанора код Адасе 13. адара 161. и склопио уговор с Римом, али је 160. пао код Еласе борећи се против Бакхида. Данилових „две хиљаде и три стотине дана и ноћи“, после којих „онда ће се светиња очистити“, и његових „хиљаду и двеста и деведесет дана“ од укидања свагдашње жртве тумачено је као Антиохов прогон већ у антици, како бележи Јеронимов коментар; књиге о Макабејцима које причају ту причу налазе се у грчкој и словенској Библији, али не и у хебрејском канону."
  hu:
    - "Kr. e. 167-től 160-ig. IV. Antiokhosz Epifanész megtiltotta a zsidó törvényt, és Kr. e. 167 decemberében megszentségtelenítette a jeruzsálemi Templomot; Mattatiás pap ugyanabban az évben szította fel a felkelést Módeinben; fia, Júdás Makkabeus megnyerte a Kr. e. 166–164-es csatákat, és Kr. e. 164 decemberében megtisztította a Templomot, amit Hanuka ünnepeként tartanak számon; Júdás Kr. e. 160-ban elesett. Testvérei folytatták a küzdelmet, míg Simon Kr. e. 142-ben ki nem harcolta a szabadságot a szeleukida adó alól. A térkép Jeruzsálemnél áll, Kr. e. 167-ben; néhány kutató egy évvel korábbra, 168-ra teszi a megszentségtelenítést."
    - "Antiokhosz Kr. e. 175-ben lett király; Kr. e. 169-ben kifosztotta a Templomot, és miután Kr. e. 168-ban Róma kiűzte Egyiptomból, Kr. e. 167-ben pogány áldozatot rendelt el egész Júdeában. A szeleukida 145. év Kiszlév 15-én az oltárra állították a „pusztító utálatosságot”, ahogy Dániel a király erőiről mondja: „megfertéztetik a szenthelyet, az erősséget, és megszüntetik a mindennapi áldozatot”. Módeinben, Jeruzsálemtől északnyugatra, Mattatiás megölte a király tisztjét és az áldozni induló zsidót, és öt fiával a hegyekbe futott. Júdás, a valószínűleg „kalapácsot” jelentő Makkabeus, legyőzte a szeleukida hadvezéreket: Szeront Bét-Hóronnál Kr. e. 166 körül, Gorgiászt Emmausnál 165-ben, Lüsziászt Bét-Cúrnál 164-ben, és Kr. e. 164 Kiszlév 25-én nyolc napra újra felszentelték a Templomot: ez a „templomszentelés ünnepe”, amelyen János szerint Jézus a Salamon tornácában járt."
    - "A dátumok az 1Makk szeleukida éveire épülnek, amelyek a makedón számítás szerint Kr. e. 312 őszén, a babiloni szerint Kr. e. 311 tavaszán kezdődtek; a könyv úgy tűnik, mindkettőt használja, ezért néhány kutató a 145. év Kiszlév 15-ét Kr. e. 167 helyett Kr. e. 168 decemberének olvassa. Antiokhosz Perzsiában, hadjáratban halt meg Kr. e. 164 végén, a felszentelés táján. Júdás Kr. e. 161 Adár 13-án legyőzte Nikánort Adasánál és szerződést kötött Rómával, de Kr. e. 160-ban Elasánál elesett Bacchides ellen. Dániel „Kétezer és háromszáz estvéig és reggelig” szóló jövendölését a szentély megtisztulásáig, és az „ezerkétszáz és kilenczven nap” jövendölését a mindennapi áldozat elvételétől Antiokhosz üldözésére már az ókorban értették, ahogy Hieronymus kommentárja írja; a történetet elbeszélő Makkabeusok könyvei a görög és szláv Bibliában találhatók, a héber kánonban nem."
  fi:
    - "Vuosina 167–160 eaa. Antiokhos IV Epifanes kielsi juutalaisen lain ja häpäisi temppelin Jerusalemissa joulukuussa 167 eaa.; pappi Mattatias nosti kapinan Modeinissa samana vuonna; hänen poikansa Juudas Makkabeus voitti taistelut vuosina 166–164 ja puhdisti temppelin joulukuussa 164, tapahtuma, jota vietetään hanukkana; Juudas kaatui vuonna 160. Hänen veljensä jatkoivat taistelua, kunnes Simon voitti vapauden seleukidien verosta vuonna 142 eaa. Kartta on Jerusalemissa vuonna 167 eaa.; muutamat tutkijat sijoittavat häpäisyn vuotta aiemmaksi, vuoteen 168."
    - "Antiokhos tuli kuninkaaksi 175 eaa.; hän ryösti temppelin vuonna 169, ja kun Rooma karkotti hänet Egyptistä vuonna 168, hän määräsi 167 pakanauhrin koko Juudeaan. Seleukidivuoden 145 kislevin 15. päivänä alttarille asetettiin ”hävityksen kauhistus”, Danielin kuninkaasta käyttämin sanoin, jonka joukot ”häväisevät pyhäkön linnoituksineen, poistavat jokapäiväisen uhrin”. Modeinissa, Jerusalemista luoteeseen, Mattatias surmasi kuninkaan virkamiehen ja uhraamaan tulleen juutalaisen ja pakeni vuorille viiden poikansa kanssa. Juudas, nimeltään Makkabeus, luultavasti ”vasara”, voitti seleukidien kenraalit: Seronin Bet-Horonissa noin 166, Gorgiaksen Emmauksessa 165, Lysiaksen Bet-Surissa 164, ja 25. kislev 164 temppeli vihittiin uudelleen kahdeksaksi päiväksi, ”temppelin vihkimisen muistojuhla”, jolloin Johanneksen mukaan Jeesus käyskeli Salomon pylväskäytävässä."
    - "Ajoitukset nojaavat 1. Makkabeusten kirjan seleukidien ajanlaskuun (alku syksyllä 312 eaa. makedonialaisen, keväällä 311 babylonialaisen laskutavan mukaan); kirja näyttää käyttävän molempia, joten muutamat lukevat vuoden 145 kislevin 15. päivän joulukuuksi 168 eikä 167. Antiokhos kuoli sotaretkellä Persiassa myöhään vuonna 164, noin vihkimisen aikaan. Juudas voitti Nikanorin Adasassa 13. adar 161 ja teki sopimuksen Rooman kanssa, mutta kaatui vuonna 160 Elasassa Bakkidesta vastaan. Danielin ”Kahtatuhatta kolmeasataa iltaa ja aamua” siihen, kun ”pyhäkkö asetetaan jälleen oikeuteensa”, ja ”tuhat kaksisataa yhdeksänkymmentä päivää” jokapäiväisen uhrin poistosta luettiin jo antiikissa Antiokhoksen vainosta, kuten Hieronymuksen kommentaari kertoo; Makkabeusten kirjat ovat kreikkalaisissa ja slaavilaisissa Raamatuissa mutta eivät heprealaisessa kaanonissa."
  vi:
    - "Từ năm 167 đến 160 TCN. Antiochus IV Epiphanes cấm luật Do Thái và làm ô uế Đền Thờ ở Giê-ru-sa-lem vào tháng 12 năm 167 TCN; thầy tế lễ Ma-ta-thia dấy nghĩa tại Modein cùng năm; con ông Giu-đa Maccabaeus thắng các trận năm 166–164 và thanh tẩy Đền Thờ vào tháng 12 năm 164, biến cố được giữ làm lễ Hanukkah; Giu-đa tử trận năm 160. Các em ông tiếp tục cuộc đấu tranh cho đến khi Si-môn giành tự do khỏi cống nạp cho nhà Seleucus năm 142 TCN. Bản đồ đặt tại Giê-ru-sa-lem năm 167 TCN; một số học giả đặt việc phạm thánh sớm một năm, năm 168."
    - "Antiochus lên ngôi năm 175 TCN; ông cướp Đền Thờ năm 169, và sau khi Rô-ma đuổi ông khỏi Ê-díp-tô năm 168, ông ra lệnh năm 167 phải tế lễ ngoại giáo khắp Giu-đê. Ngày mười lăm tháng Kít-lơ năm 145 theo lịch Seleucus, “sự gớm ghiếc làm ra sự hoang vu” được đặt trên bàn thờ, theo lời Đa-ni-ên nói về vua mà quân lính sẽ “làm ô uế nơi thánh cùng đồn lũy, cất của lễ thiêu hằng dâng”. Tại Modein, phía tây bắc Giê-ru-sa-lem, Ma-ta-thia giết sĩ quan của vua và người Do Thái đến tế lễ, rồi chạy lên đồi cùng năm con trai. Giu-đa, gọi là Maccabaeus, có lẽ nghĩa là “cái búa”, đánh bại các tướng Seleucus: Seron ở Bết-Hô-rôn khoảng 166, Gorgias ở Em-ma-út năm 165, Ly-sia ở Bết-Xu-rơ năm 164, và ngày 25 tháng Kít-lơ năm 164, Đền Thờ được cung hiến lại trong tám ngày, “lễ Khánh Thành đền thờ”, dịp mà Giăng cho thấy Giê-su đi dạo dưới hiên cửa Sa-lô-môn."
    - "Các niên đại dựa vào năm của kỷ nguyên Seleucus trong 1 Ma-ca-bê, bắt đầu mùa thu 312 TCN theo cách tính Macedonia và mùa xuân 311 theo cách tính Ba-by-lôn; sách dường như dùng cả hai, nên một số học giả đọc ngày 15 tháng Kít-lơ năm 145 là tháng 12 năm 168 thay vì 167. Antiochus chết trong chiến dịch ở Phe-rơ-sơ cuối năm 164, khoảng lúc cung hiến. Giu-đa đánh bại Ni-ca-no tại Adasa ngày 13 tháng A-đa năm 161 và ký hiệp ước với Rô-ma, nhưng năm 160 tử trận tại Elasa khi giao chiến với Bacchides. “Hai ngàn ba trăm buổi chiều và buổi mai” của Đa-ni-ên cho đến khi “nơi thánh sẽ được thanh sạch”, và “một ngàn hai trăm chín mươi ngày” từ lúc trừ bỏ của lễ thiêu hằng dâng, đã được đọc về cuộc bách hại của Antiochus từ thời cổ, như chú giải của Jerome ghi; các sách Ma-ca-bê kể chuyện này có trong Kinh Thánh Hy Lạp và Slav nhưng không có trong quy điển Hê-bơ-rơ."
  ro:
    - "Între 167 și 160 î.Hr. Antioh al IV-lea Epifanes a interzis Legea iudaică și a pângărit Templul din Ierusalim în decembrie 167 î.Hr.; preotul Matatia a ridicat răscoala la Modin în același an; fiul său Iuda Macabeul a câștigat bătăliile din 166–164 și a curățit Templul în decembrie 164, eveniment păstrat ca Hanuka; Iuda a căzut în 160. Frații lui au continuat lupta până când Simon a obținut libertatea față de tributul seleucid, în 142 î.Hr. Harta stă la Ierusalim, în 167 î.Hr.; câțiva cercetători pun profanarea cu un an mai devreme, în 168."
    - "Antioh devenise rege în 175 î.Hr.; a jefuit Templul în 169, iar după ce Roma l-a scos din Egipt în 168, a poruncit în 167 jertfe păgâne în toată Iudeea. La 15 Chislev din anul seleucid 145, urâciunea pustiirii a fost așezată pe altar, în cuvintele pe care Daniel le folosește despre regele ale cărui oști „vor spurcà sfințirea puterniciei, și vor mutà neîncetarea”. La Modin, la nord-vest de Ierusalim, Matatia l-a ucis pe slujbașul regelui și pe iudeul venit să jertfească și a fugit la munți cu cei cinci fii ai săi. Iuda, numit Macabeul, probabil „ciocanul”, i-a bătut pe generalii seleucizi: Seron la Bet-Horon circa 166, Gorgias la Emaus în 165, Lisias la Bet-Țur în 164, iar la 25 Chislev 164 Templul a fost sfințit din nou, timp de opt zile, sărbătoarea pe care Ioan o numește „înoirile”, când Isus umblă „în pridvorul lui Solomon”."
    - "Datele se sprijină pe anii erei seleucide din 1 Macabei, care a început în toamna lui 312 î.Hr. după numărătoarea macedoneană și în primăvara lui 311 după cea babiloniană; cartea pare să le folosească pe amândouă, așa că unii cercetători citesc 15 Chislev din anul 145 ca decembrie 168, nu 167. Antioh a murit într-o campanie în Persia, la sfârșitul lui 164, cam în vremea sfințirii. Iuda l-a învins pe Nicanor la Adasa, la 13 Adar 161, și a făcut un tratat cu Roma, dar în 160 a căzut la Elasa luptând cu Bacchide. Cele două mii trei sute de zile ale lui Daniel până la curățirea sanctuarului și cele o mie două sute nouăzeci de zile de la luarea jertfei necontenite au fost citite despre persecuția lui Antioh încă din vechime, după cum consemnează comentariul lui Ieronim; cărțile Macabeilor care spun povestea se află în Bibliile greacă și slavonă, dar nu în canonul ebraic."
  bg:
    - "От 167 до 160 г. пр.н.е. Антиох IV Епифан забранил юдейския закон и осквернил Храма в Йерусалим през декември 167 г. пр.н.е.; свещеникът Мататия вдигнал въстанието в Модиин същата година; синът му Юда Макавей спечелил битките от 166–164 г. и очистил Храма през декември 164 г. — събитието, което се чества като Ханука; Юда паднал през 160 г. Братята му продължили борбата, докато Симон извоювал освобождаване от селевкидския данък през 142 г. пр.н.е. Картата стои на Йерусалим през 167 г. пр.н.е.; някои учени поставят оскверняването година по-рано, през 168 г."
    - "Антиох станал цар през 175 г. пр.н.е.; той ограбил Храма през 169 г., а след като Рим го изгонил от Египет през 168 г., заповядал през 167 г. езически жертвоприношения из цяла Юдея. На петнадесети кислев на селевкидската 145 година „мерзостта на запустението“ била поставена на олтара — по думите на Даниил за царя, чиито сили „ще омърсят светилището на силата, и ще отнемат всегдашната жъртва“. В Модиин, северозападно от Йерусалим, Мататия убил царския служител и юдея, дошъл да принесе жертва, и избягал в планините с петимата си синове. Юда, наречен Макавей, вероятно „чука“, разбил селевкидските пълководци: Серон при Бет-Орон около 166 г., Горгий при Емаус през 165 г., Лисий при Бет-Цур през 164 г., а на 25 кислев 164 г. Храмът бил осветен отново за осем дни — „праздникът на освещението на храма“, на който Йоан показва Исус да ходи в Соломоновия притвор."
    - "Датите почиват на годините на селевкидската ера в 1 Макавейска, която започвала през есента на 312 г. пр.н.е. по македонското броене и през пролетта на 311 г. по вавилонското; книгата като че ли използва и двете, затова някои учени четат 15 кислев на 145 година като декември 168 г., а не 167 г. Антиох умрял по време на поход в Персия в края на 164 г., горе-долу по времето на освещаването. Юда разбил Никанор при Адаса на 13 адар 161 г. и сключил договор с Рим, но през 160 г. паднал при Еласа в битка с Вакхид. „До две тисящи и триста денонощия: тогаз светилището ще се очисти“ и „тисяща и двесте и деветдесет“ дни от отнемането на всегдашната жертва при Даниил се тълкували за гоненията на Антиох още в древността, както свидетелства коментарът на Йероним; книгите Макавейски, които разказват историята, са в гръцката и славянската Библия, но не и в еврейския канон."
