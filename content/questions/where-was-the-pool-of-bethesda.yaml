id: where-was-the-pool-of-bethesda
question:
  en: "Where was the Pool of Bethesda?"
  ru: "Где находилась купальня Вифезда?"
  uk: "Де був басейн Віфезда?"
  es: "¿Dónde estaba el estanque de Betesda?"
  pt: "Onde ficava o tanque de Betesda?"
  de: "Wo lag der Teich Betesda?"
  fr: "Où se trouvait la piscine de Béthesda ?"
answer:
  en:
    - "The Pool of Bethesda lay just north of the Temple in Jerusalem, inside today's Old City near St Stephen's Gate, in the grounds of the Crusader church of St Anne; its two great basins, cut into the rock and partly filled in, were excavated from the late nineteenth century onwards and can be visited. The map point stands there, just north of the Temple Mount."
    - "John says: “Now there is at Jerusalem by the sheep market a pool, which is called in the Hebrew tongue Bethesda, having five porches”, and that a man who had been ill for thirty-eight years was healed there on the sabbath. The Sheep Gate of Nehemiah stood in the northern wall near the Temple, and the name of the pool varies in the manuscripts, Bethesda, Bethzatha or Bethsaida; the Copper Scroll from Qumran seems to call the place Beth Eshdatayin, “house of the twin outflows”, in the dual, which fits a double pool."
    - "The excavations found two rectangular reservoirs side by side, separated by a rock dam; on the usual reconstruction a portico on each of the four sides and one across the dam make the five porches. The northern basin began as a reservoir behind the dam, perhaps as early as the eighth century BC, and the southern one was added around 200 BC; small baths east of them became a healing shrine, which in the second century AD, when Jerusalem had become Aelia Capitolina, was a sanctuary of Asclepius and Serapis, and in the fifth century a Byzantine church was raised over the dam to mark the miracle. In 333 the pilgrim of Bordeaux was shown “twin pools with five porticoes”, and Eusebius wrote that one of them was filled by the rains and the other had water strangely reddened."
  ru:
    - "Купальня Вифезда лежала сразу к северу от Храма в Иерусалиме, внутри нынешнего Старого города у Львиных ворот, на участке крестоносной церкви святой Анны; два её больших водоёма, вырубленных в скале и частично засыпанных, раскапывают с конца XIX века, и их можно осмотреть. Точка на карте стоит там, сразу к северу от Храмовой горы."
    - "Иоанн говорит: «Есть же в Иерусалиме у Овечьих ворот купальня, называемая по-еврейски Вифезда, при которой было пять крытых ходов», и рассказывает, что там в субботу был исцелён человек, болевший тридцать восемь лет. Овечьи ворота у Неемии стояли в северной стене близ Храма, а имя купальни в рукописях разнится: Вифезда, Вифзафа или Вифсаида; Медный свиток из Кумрана, по-видимому, называет это место Бет-Эшдатаин, «дом двух истоков», в двойственном числе, что подходит двойному водоёму."
    - "Раскопки нашли два прямоугольных водохранилища рядом, разделённых скальной перемычкой; по обычной реконструкции портик с каждой из четырёх сторон и ещё один поперёк перемычки и дают пять крытых ходов. Северный водоём возник как водохранилище за плотиной, возможно, ещё в VIII веке до н. э., а южный добавили около 200 г. до н. э.; малые купели к востоку от них стали целебным святилищем, которое во II веке н. э., когда Иерусалим стал Элией Капитолиной, было храмом Асклепия и Сераписа, а в V веке над перемычкой поставили византийскую церковь в память о чуде. В 333 году Бордоскому паломнику показывали «двойные купели с пятью портиками», а Евсевий писал, что одну из них наполняют дожди, а в другой вода странно красна."
  uk:
    - "Басейн Віфезда лежав одразу на північ від Храму в Єрусалимі, всередині нинішнього Старого міста біля Воріт святого Стефана, на території церкви святої Анни доби хрестоносців; два його великі водойми, вирізані в скелі й частково засипані, розкопували від кінця XIX ст., і їх можна відвідати. Точка на мапі стоїть там, одразу на північ від Храмової гори."
    - "Іван каже: «У Єрусалимі ж коло Овечих воріт є купіль, що зветь ся по єврейськи Ветезда, з пятьма ходниками», і що чоловіка, який хворів тридцять вісім років, було зцілено там у суботу. Овечі ворота Неемії стояли в північному мурі біля Храму, а назва басейну різниться в рукописах: Віфезда, Бетзата чи Віфсаїда; Мідний сувій із Кумрану, схоже, називає це місце Бет-Ешдатаїн, «дім подвійних витоків», у двоїні, що пасує до подвійного басейну."
    - "Розкопки виявили два прямокутні резервуари поруч, розділені скельною дамбою; за звичайною реконструкцією, портик з кожного з чотирьох боків і один поперек дамби дають п'ять ходників. Північний басейн починався як резервуар за дамбою, можливо, ще у VIII ст. до н. е., а південний додано близько 200 р. до н. е.; невеликі купальні на схід від них стали святинею зцілення, яка у II ст. н. е., коли Єрусалим став Елією Капітоліною, була святилищем Асклепія й Серапіса, а в V ст. над дамбою звели візантійську церкву на згадку про чудо. 333 р. Бордоському паломникові показали «близнюкові басейни з п'ятьма портиками», а Євсевій писав, що один із них наповнювався дощами, а в другому вода була дивно почервонілою."
  es:
    - "El estanque de Betesda estaba justo al norte del Templo de Jerusalén, dentro de la actual Ciudad Vieja, cerca de la puerta de San Esteban, en los terrenos de la iglesia cruzada de Santa Ana; sus dos grandes cuencas, excavadas en la roca y en parte rellenadas, se excavaron desde finales del siglo XIX y se pueden visitar. El punto del mapa está allí, justo al norte del Monte del Templo."
    - "Juan dice: «hay en Jerusalem á la puerta del ganado un estanque, que en hebraico es llamado Bethesda, el cual tiene cinco portales», y que allí fue sanado en sábado un hombre que llevaba treinta y ocho años enfermo. La puerta de las Ovejas de Nehemías estaba en el muro norte cerca del Templo, y el nombre del estanque varía en los manuscritos, Betesda, Betzatá o Betsaida; el Rollo de Cobre de Qumrán parece llamar al lugar Bet Eshdatayin, «casa de los dos desagües», en dual, lo que concuerda con un estanque doble."
    - "Las excavaciones hallaron dos depósitos rectangulares contiguos, separados por un dique de roca; en la reconstrucción habitual, un pórtico en cada uno de los cuatro lados y otro sobre el dique forman los cinco portales. La cuenca norte nació como depósito detrás del dique, quizá ya en el siglo VIII a. C., y la sur se añadió hacia el 200 a. C.; unos pequeños baños al este de ellas se convirtieron en un santuario de curación, que en el siglo II d. C., cuando Jerusalén se había convertido en Aelia Capitolina, era un santuario de Asclepio y Serapis, y en el siglo V se levantó una iglesia bizantina sobre el dique para señalar el milagro. En 333 al peregrino de Burdeos le mostraron «dos estanques gemelos con cinco pórticos», y Eusebio escribió que uno de ellos se llenaba con las lluvias y el otro tenía agua extrañamente enrojecida."
  pt:
    - "O tanque de Betesda ficava logo ao norte do Templo, em Jerusalém, dentro da atual Cidade Velha, perto da Porta de Santo Estêvão, no terreno da igreja cruzada de Santa Ana; suas duas grandes bacias, escavadas na rocha e parcialmente aterradas, foram escavadas a partir do final do século XIX e podem ser visitadas. O ponto do mapa fica ali, logo ao norte do monte do Templo."
    - "João diz: “Ora, em Jerusalém, próximo à porta das ovelhas, há um tanque, chamado em hebraico Betesda, o qual tem cinco pórticos”, e que um homem doente havia trinta e oito anos foi curado ali no sábado. A Porta das Ovelhas de Neemias ficava na muralha norte, perto do Templo, e o nome do tanque varia nos manuscritos, Betesda, Betzatá ou Betsaida; o Rolo de Cobre de Qumran parece chamar o lugar Beth Eshdatayin, “casa dos fluxos gêmeos”, no dual, o que combina com um tanque duplo."
    - "As escavações encontraram dois reservatórios retangulares lado a lado, separados por um dique de rocha; na reconstrução usual, um pórtico em cada um dos quatro lados e outro atravessando o dique formam os cinco pórticos. A bacia norte começou como um reservatório atrás do dique, talvez já no século VIII a.C., e a sul foi acrescentada por volta de 200 a.C.; pequenos banhos a leste delas tornaram-se um santuário de cura, que no século II d.C., quando Jerusalém já era Aelia Capitolina, era um santuário de Asclépio e Serápis, e no século V uma igreja bizantina foi erguida sobre o dique para assinalar o milagre. Em 333, o peregrino de Bordeaux viu “piscinas gêmeas com cinco pórticos”, e Eusébio escreveu que uma delas se enchia com as chuvas e a outra tinha água estranhamente avermelhada."
  de:
    - "Der Teich Betesda lag unmittelbar nördlich des Tempels in Jerusalem, innerhalb der heutigen Altstadt beim Stephanstor, auf dem Gelände der Kreuzfahrerkirche St. Anna; seine beiden großen, in den Fels gehauenen und teilweise verfüllten Becken wurden seit dem späten 19. Jahrhundert ausgegraben und können besichtigt werden. Der Kartenpunkt steht dort, unmittelbar nördlich des Tempelbergs."
    - "Johannes sagt: „Es ist aber zu Jerusalem bei dem Schaftor ein Teich, der heißt auf hebräisch Bethesda und hat fünf Hallen“, und dass dort ein Mann, der achtunddreißig Jahre krank gewesen war, am Sabbat geheilt wurde. Das Schaftor des Nehemia stand in der Nordmauer nahe dem Tempel, und der Name des Teiches schwankt in den Handschriften, Bethesda, Bethzatha oder Bethsaida; die Kupferrolle von Qumran scheint den Ort Beth Eschdatajin zu nennen, „Haus der Zwillingsausflüsse“, im Dual, was zu einem Doppelteich passt."
    - "Die Grabungen fanden zwei rechteckige Becken nebeneinander, durch einen Felsdamm getrennt; nach der üblichen Rekonstruktion ergeben eine Säulenhalle auf jeder der vier Seiten und eine über dem Damm die fünf Hallen. Das nördliche Becken begann als Staubecken hinter dem Damm, vielleicht schon im 8. Jahrhundert v. Chr., und das südliche kam um 200 v. Chr. hinzu; kleine Bäder östlich davon wurden zu einem Heilschrein, der im 2. Jahrhundert n. Chr., als Jerusalem zu Aelia Capitolina geworden war, ein Heiligtum des Asklepios und des Serapis war, und im 5. Jahrhundert wurde über dem Damm eine byzantinische Kirche errichtet, um das Wunder zu bezeichnen. 333 zeigte man dem Pilger von Bordeaux „Zwillingsteiche mit fünf Säulenhallen“, und Eusebius schrieb, der eine sei vom Regen gefüllt worden und der andere habe seltsam gerötetes Wasser."
  fr:
    - "La piscine de Béthesda se trouvait juste au nord du Temple à Jérusalem, dans la vieille ville actuelle, près de la porte Saint-Étienne, dans l’enceinte de l’église croisée Sainte-Anne ; ses deux grands bassins, creusés dans le roc et en partie comblés, ont été fouillés à partir de la fin du XIXe siècle et se visitent. Le point de la carte s’y trouve, juste au nord du mont du Temple."
    - "Jean dit : « Or, à Jérusalem, près de la porte des brebis, il y a une piscine qui s’appelle en hébreu Béthesda, et qui a cinq portiques », et raconte qu’un homme malade depuis trente-huit ans y fut guéri un jour de sabbat. La porte des Brebis de Néhémie se trouvait dans le mur nord, près du Temple, et le nom de la piscine varie selon les manuscrits, Béthesda, Bethzatha ou Bethsaïda ; le Rouleau de cuivre de Qumrân semble nommer le lieu Beth Eshdatayin, « maison des deux écoulements », au duel, ce qui convient à une piscine double."
    - "Les fouilles ont trouvé deux réservoirs rectangulaires côte à côte, séparés par une digue de roc ; selon la reconstitution habituelle, un portique sur chacun des quatre côtés et un autre en travers de la digue font les cinq portiques. Le bassin nord commença comme un réservoir derrière la digue, peut-être dès le VIIIe siècle av. J.-C., et le bassin sud fut ajouté vers 200 av. J.-C. ; de petits bains à l’est devinrent un sanctuaire de guérison qui, au IIe siècle apr. J.-C., quand Jérusalem était devenue Aelia Capitolina, était un sanctuaire d’Asclépios et de Sérapis, et au Ve siècle une église byzantine fut élevée sur la digue pour marquer le miracle. En 333, le pèlerin de Bordeaux se fit montrer des « piscines jumelles à cinq portiques », et Eusèbe écrivit que l’une était remplie par les pluies et que l’autre avait une eau étrangement rougie."
