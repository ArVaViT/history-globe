id: where-was-sodom
question:
  en: "Where was Sodom?"
  ru: "Где находился Содом?"
  uk: "Де був Содом?"
  es: "¿Dónde estaba Sodoma?"
  pt: "Onde ficava Sodoma?"
  de: "Wo lag Sodom?"
  fr: "Où se trouvait Sodome ?"
  pl: "Gdzie leżała Sodoma?"
  it: "Dov’era Sodoma?"
  cs: "Kde ležela Sodoma?"
  nl: "Waar lag Sodom?"
  sv: "Var låg Sodom?"
answer:
  en:
    - "The site of Sodom is unknown. Genesis puts it among the cities of the plain by the Dead Sea, and three answers are given today: beneath or beside the shallow southern basin of the sea, at the Early Bronze Age towns on its south-eastern shore, or at Tall el-Hammam in the Jordan valley north of the sea. The map point stands in the valley of Siddim south of the Lisan peninsula, with the other cities of the plain beside it."
    - "The southern view is the old one. Genesis says the kings fought “in the vale of Siddim, which is the salt sea”, and Zoar, to which Lot fled, was a known town in Roman and Byzantine times at the south-eastern corner of the sea, today's es-Safi. The salt ridge on the south-western shore is still called Jebel Usdum, Mount Sodom; Josephus and Strabo both say that traces of the burnt cities could be seen by the sea. The excavations of Bab edh-Dhra and Numeira on the south-eastern shore, Early Bronze Age towns destroyed by fire in the third millennium BC, gave this view material, but they are much older than the conventional date of Abraham."
    - "The northern view rests on Genesis 13: Lot, standing near Bethel, “beheld all the plain of Jordan, that it was well watered every where”, and the word for the plain, kikkar, is used elsewhere of the Jordan valley around Jericho. Its advocates point to Tall el-Hammam, a large Middle Bronze city east of the Jordan which its excavators date to destruction around 1650 BC; a 2021 paper in Scientific Reports claiming that a cosmic airburst destroyed it was retracted by the journal in April 2025. Deuteronomy remembers only that the land of Sodom, Gomorrah, Admah and Zeboiim became “brimstone, and salt, and burning”, and none of the sites can be called certain."
  ru:
    - "Местоположение Содома неизвестно. Бытие ставит его среди городов окрестности у Мёртвого моря, и сегодня дают три ответа: под мелководной южной частью моря или рядом с ней, в городах ранней бронзы на его юго-восточном берегу, или в Талль-эль-Хаммаме в долине Иордана к северу от моря. Точка на карте стоит в долине Сиддим к югу от полуострова Лисан, рядом с другими городами окрестности."
    - "Южный ответ — старый. Бытие говорит, что цари сошлись «в долине Сиддим, где ныне море Соленое», а Сигор, куда бежал Лот, был известным городком римского и византийского времени на юго-восточном углу моря — нынешний Эс-Сафи. Соляная гряда на юго-западном берегу до сих пор зовётся Джебель-Усдум, гора Содом; Иосиф Флавий и Страбон оба пишут, что следы сожжённых городов видны у моря. Раскопки Баб-эд-Дра и Нумейры на юго-восточном берегу — городов ранней бронзы, погибших в огне в третьем тысячелетии до н. э., — дали этому взгляду вещественную опору, но они много старше условной даты Авраама."
    - "Северный ответ опирается на Бытие 13: Лот, стоя близ Вефиля, «увидел всю окрестность Иорданскую», а слово киккар («окрестность») в других местах означает долину Иордана у Иерихона. Его сторонники указывают на Талль-эль-Хаммам, большой город средней бронзы к востоку от Иордана, гибель которого раскопщики относят примерно к 1650 г. до н. э.; статья 2021 года в Scientific Reports о том, что его уничтожил воздушный взрыв космического тела, была отозвана журналом в апреле 2025 года. Второзаконие помнит лишь, что земля Содома, Гоморры, Адмы и Севоима стала «сера и соль, пожарище», и ни одно из мест нельзя назвать достоверным."
  uk:
    - "Місце Содома невідоме. Книга Буття ставить його серед міст рівнини біля Мертвого моря, і сьогодні дають три відповіді: під мілким південним басейном моря або біля нього, біля міст раннього бронзового віку на його південно-східному березі, або в Телль-ель-Хаммамі в долині Йордану на північ від моря. Точка на мапі стоїть у долині Сиддім на південь від півострова Лісан, поруч з іншими містами рівнини."
    - "Південний погляд — давній. Книга Буття каже, що царі билися «на Сиддим-долинї, се єсть теперенькі Море Солоне», а Сігор, куди втік Лот, був відомим містом у римську й візантійську добу на південно-східному куті моря, нині ес-Сафі. Соляне пасмо на південно-західному березі досі зветься Джебель-Усдум, гора Содому; Йосиф Флавій і Страбон обидва кажуть, що сліди спалених міст можна було бачити біля моря. Розкопки Баб-ед-Дри та Нумейри на південно-східному березі, міст раннього бронзового віку, знищених пожежею в III тис. до н. е., дали цьому поглядові матеріал, але вони набагато давніші за умовну дату Авраама."
    - "Північний погляд спирається на Книгу Буття 13: Лот, стоячи біля Бет-Ела, «побачив усю околицю Йорданську ... вся до Сигора наповнена була водою», а слово для рівнини, кіккар, в інших місцях ужито про долину Йордану навколо Єрихону. Його прихильники вказують на Телль-ель-Хаммам, велике місто середнього бронзового віку на схід від Йордану, яке його розкопники датують руйнуванням близько 1650 р. до н. е.; стаття 2021 р. у Scientific Reports, що стверджувала, нібито його зруйнував космічний повітряний вибух, була відкликана журналом у квітні 2025 р. Повторення Закону пам'ятає лише, що земля Содома, Гоморри, Адми й Цевоїма стала «пожарище, сїрка і сіль», і жодне з місць не можна назвати певним."
  es:
    - "Se desconoce el emplazamiento de Sodoma. El Génesis la sitúa entre las ciudades de la llanura junto al mar Muerto, y hoy se dan tres respuestas: bajo o junto a la poco profunda cuenca meridional del mar, en las ciudades del Bronce Antiguo de su orilla sudoriental, o en Tall el-Hammam, en el valle del Jordán, al norte del mar. El punto del mapa está en el valle de Siddim, al sur de la península de Lisán, con las demás ciudades de la llanura a su lado."
    - "La opinión meridional es la antigua. El Génesis dice que los reyes se juntaron «en el valle de Siddim, que es el mar salado», y Zoar, adonde huyó Lot, era una población conocida en época romana y bizantina en la esquina sudoriental del mar, la actual es-Safi. La cresta de sal de la orilla suroccidental se sigue llamando Jebel Usdum, monte Sodoma; Josefo y Estrabón dicen ambos que junto al mar se veían restos de las ciudades quemadas. Las excavaciones de Bab edh-Dhra y Numeira, en la orilla sudoriental, ciudades del Bronce Antiguo destruidas por el fuego en el tercer milenio a. C., dieron material a esta opinión, pero son mucho más antiguas que la fecha convencional de Abraham."
    - "La opinión septentrional se apoya en Génesis 13: Lot, de pie cerca de Betel, «vió toda la llanura del Jordán, que toda ella era de riego», y la palabra para la llanura, kikkar, se usa en otros lugares para el valle del Jordán en torno a Jericó. Sus defensores señalan Tall el-Hammam, una gran ciudad del Bronce Medio al este del Jordán que sus excavadores fechan en una destrucción hacia 1650 a. C.; un artículo de 2021 en Scientific Reports que afirmaba que una explosión cósmica en el aire la destruyó fue retractado por la revista en abril de 2025. El Deuteronomio recuerda solo que la tierra de Sodoma, Gomorra, Adma y Zeboim quedó en «azufre y sal, abrasada toda su tierra», y ninguno de los lugares puede darse por cierto."
  pt:
    - "O sítio de Sodoma é desconhecido. O Gênesis a situa entre as cidades da planície junto ao mar Morto, e hoje se dão três respostas: sob ou ao lado da bacia meridional rasa do mar, nas cidades da Idade do Bronze Antiga em sua margem sudeste, ou em Tall el-Hammam, no vale do Jordão, ao norte do mar. O ponto do mapa fica no vale de Sidim, ao sul da península de Lisan, com as outras cidades da planície ao lado."
    - "A visão meridional é a antiga. O Gênesis diz que os reis lutaram “no vale de Sidim (também chamado de Mar Salgado)”, e Zoar, para onde Ló fugiu, era uma cidade conhecida nos tempos romano e bizantino no canto sudeste do mar, hoje es-Safi. A crista de sal na margem sudoeste ainda se chama Jebel Usdum, monte Sodoma; Josefo e Estrabão dizem ambos que se viam junto ao mar vestígios das cidades queimadas. As escavações de Bab edh-Dhra e Numeira, na margem sudeste, cidades da Idade do Bronze Antiga destruídas pelo fogo no terceiro milênio a.C., deram material a essa visão, mas são muito mais antigas do que a data convencional de Abraão."
    - "A visão setentrional se apoia em Gênesis 13: Ló, de pé perto de Betel, “viu toda a planície do Jordão, que era bem regada em toda parte”, e a palavra para planície, kikkar, é usada em outros lugares para o vale do Jordão em torno de Jericó. Seus defensores apontam Tall el-Hammam, uma grande cidade da Idade do Bronze Média a leste do Jordão, cuja destruição os escavadores datam de cerca de 1650 a.C.; um artigo de 2021 na Scientific Reports, que afirmava que uma explosão cósmica no ar a destruíra, foi retratado pela revista em abril de 2025. O Deuteronômio recorda apenas que a terra de Sodoma, Gomorra, Admá e Zeboim se tornou “enxofre, sal e terra queimada”, e nenhum dos sítios pode ser dado por certo."
  de:
    - "Die Lage Sodoms ist unbekannt. Die Genesis setzt es unter die Städte der Ebene am Toten Meer, und heute werden drei Antworten gegeben: unter oder neben dem flachen südlichen Becken des Meeres, bei den frühbronzezeitlichen Siedlungen am Südostufer oder bei Tall el-Hammam im Jordantal nördlich des Meeres. Der Kartenpunkt steht im Tal Siddim südlich der Lisan-Halbinsel, mit den anderen Städten der Ebene daneben."
    - "Die südliche Ansicht ist die alte. Die Genesis sagt von den Königen: „Diese kamen alle zusammen in das Tal Siddim, wo nun das Salzmeer ist.“ Und Zoar, wohin Lot floh, war in römischer und byzantinischer Zeit eine bekannte Stadt an der Südostecke des Meeres, heute es-Safi. Der Salzrücken am Südwestufer heißt noch immer Dschebel Usdum, Berg Sodom; Josephus und Strabon sagen beide, am Meer seien Spuren der verbrannten Städte zu sehen gewesen. Die Grabungen von Bab edh-Dhra und Numeira am Südostufer, frühbronzezeitliche Städte, die im 3. Jahrtausend v. Chr. durch Feuer zerstört wurden, gaben dieser Ansicht Stoff, doch sie sind viel älter als das konventionelle Datum Abrahams."
    - "Die nördliche Ansicht stützt sich auf 1. Mose 13: Lot, nahe Bethel stehend, „besah die ganze Gegend am Jordan“, die „wasserreich“ war, und das Wort für die Ebene, kikkar, wird anderswo für das Jordantal um Jericho gebraucht. Ihre Anhänger verweisen auf Tall el-Hammam, eine große mittelbronzezeitliche Stadt östlich des Jordans, deren Ausgräber eine Zerstörung um 1650 v. Chr. datieren; ein Aufsatz in Scientific Reports von 2021, der behauptete, ein kosmischer Luftsprengkörper habe sie zerstört, wurde von der Zeitschrift im April 2025 zurückgezogen. Das Deuteronomium erinnert nur, dass das Land Sodoms, Gomorras, Admas und Zeboims „mit Schwefel und Salz verbrannt“ wurde, und keine der Stätten lässt sich als sicher bezeichnen."
  fr:
    - "L’emplacement de Sodome est inconnu. La Genèse la met parmi les villes de la plaine, près de la mer Morte, et trois réponses sont données aujourd’hui : sous le bassin méridional peu profond de la mer ou à côté, aux villes de l’âge du Bronze ancien sur sa rive sud-est, ou à Tall el-Hammam, dans la vallée du Jourdain au nord de la mer. Le point de la carte se trouve dans la vallée de Siddim, au sud de la péninsule de la Lisan, avec les autres villes de la plaine à côté."
    - "La thèse méridionale est la plus ancienne. La Genèse place la bataille des rois « dans la vallée de Siddim, qui est la mer Salée », et Tsoar, où Lot s’enfuit, était une ville connue aux époques romaine et byzantine, à l’angle sud-est de la mer, l’actuelle es-Safi. La crête de sel de la rive sud-ouest s’appelle encore Jebel Usdum, mont Sodome ; Flavius Josèphe et Strabon disent tous deux qu’on pouvait voir au bord de la mer les traces des villes brûlées. Les fouilles de Bab edh-Dhra et de Numeira, sur la rive sud-est, villes de l’âge du Bronze ancien détruites par le feu au IIIe millénaire av. J.-C., ont donné matière à cette thèse, mais elles sont bien plus anciennes que la date conventionnelle d’Abraham."
    - "La thèse septentrionale repose sur Genèse 13 : Lot, se tenant près de Béthel, « vit toute la plaine du Jourdain, qui était entièrement arrosée », et le mot désignant la plaine, kikkar, est employé ailleurs pour la vallée du Jourdain autour de Jéricho. Ses partisans invoquent Tall el-Hammam, grande ville du Bronze moyen à l’est du Jourdain, que ses fouilleurs datent d’une destruction vers 1650 av. J.-C. ; un article de 2021 dans Scientific Reports, affirmant qu’une explosion cosmique l’avait détruite, a été rétracté par la revue en avril 2025. Le Deutéronome ne garde que le souvenir « du soufre, du sel, de l’embrasement de toute la contrée », « comme au bouleversement de Sodome, de Gomorrhe, d’Adma et de Tseboïm », et aucun des sites ne peut être tenu pour certain."
  pl:
    - "Miejsce Sodomy jest nieznane. Księga Rodzaju umieszcza ją wśród miast równiny nad Morzem Martwym, a dziś podaje się trzy odpowiedzi: pod płytkim południowym basenem morza lub obok niego, w miastach epoki wczesnego brązu na jego południowo-wschodnim brzegu albo w Tall el-Hammam w dolinie Jordanu na północ od morza. Punkt na mapie stoi w dolinie Siddim na południe od półwyspu Lisan, wraz z innymi miastami równiny obok niego."
    - "Pogląd południowy jest dawny. Księga Rodzaju mówi, że królowie „zaciągnęli się w dolinę Syddym, ta jest teraz morzem słonem”, a Soar, dokąd uciekł Lot, było znanym miastem w czasach rzymskich i bizantyjskich w południowo-wschodnim narożniku morza, dzisiejsze es-Safi. Solny grzbiet na południowo-zachodnim brzegu wciąż nazywa się Jebel Usdum, Góra Sodomy; Józef Flawiusz i Strabon mówią obaj, że ślady spalonych miast widać było nad morzem. Wykopaliska w Bab edh-Dhra i Numeira na południowo-wschodnim brzegu, miastach epoki wczesnego brązu zniszczonych przez ogień w III tysiącleciu p.n.e., dały temu poglądowi materiał, ale są znacznie starsze niż umowna data Abrahama."
    - "Pogląd północny opiera się na Rdz 13: Lot, stojąc blisko Betel, „obaczył wszystkę równinę nad Jordanem, iż wszystka wilgotna była”, a słowo oznaczające równinę, kikkar, używane jest gdzie indziej dla doliny Jordanu wokół Jerycha. Jego zwolennicy wskazują Tall el-Hammam, duże miasto średniego brązu na wschód od Jordanu, którego odkrywcy datują zniszczenie na około 1650 p.n.e.; artykuł z 2021 roku w Scientific Reports, twierdzący, że zniszczyła je kosmiczna eksplozja w powietrzu, został wycofany przez czasopismo w kwietniu 2025. Księga Powtórzonego Prawa pamięta tylko, że ziemia Sodomy, Gomory, Adma i Seboim została spalona: „siarka i sól wypali tę wszystkę ziemię”, i żadnego z miejsc nie można nazwać pewnym."
  it:
    - "L’ubicazione di Sodoma è sconosciuta. La Genesi la pone tra le città della pianura presso il Mar Morto, e oggi si danno tre risposte: sotto o accanto al bacino meridionale poco profondo del mare, presso le città del Bronzo Antico sulla sua riva sud-orientale, o a Tall el-Hammam nella valle del Giordano a nord del mare. Il punto della mappa si trova nella valle di Siddim a sud della penisola di Lisan, con le altre città della pianura accanto ad esso."
    - "La tesi meridionale è la più antica. La Genesi dice che i re combatterono «nella valle di Siddim, ch’è il Mar salato», e Soar, dove fuggì Lot, era una città nota in epoca romana e bizantina all’angolo sud-orientale del mare, l’odierna es-Safi. La dorsale di sale sulla riva sud-occidentale si chiama ancora Jebel Usdum, Monte Sodoma; Giuseppe Flavio e Strabone dicono entrambi che presso il mare si potevano vedere le tracce delle città bruciate. Gli scavi di Bab edh-Dhra e Numeira sulla riva sud-orientale, città del Bronzo Antico distrutte dal fuoco nel III millennio a.C., hanno fornito materiale a questa tesi, ma sono molto più antichi della data convenzionale di Abramo."
    - "La tesi settentrionale poggia su Gen 13: Lot, che stava presso Betel, «vide l’intera pianura del Giordano… essa era tutta quanta irrigata fino a Tsoar», e la parola per pianura, kikkar, è usata altrove per la valle del Giordano attorno a Gerico. I suoi sostenitori indicano Tall el-Hammam, una grande città del Medio Bronzo a est del Giordano che i suoi scavatori datano a una distruzione verso il 1650 a.C.; un articolo del 2021 su Scientific Reports che sosteneva che un’esplosione cosmica in aria l’avesse distrutta è stato ritirato dalla rivista nell’aprile 2025. Il Deuteronomio ricorda soltanto che la terra di Sodoma, Gomorra, Adma e Zeboim divenne «zolfo, sale, arsura», e nessuno dei siti può dirsi certo."
  cs:
    - "Poloha Sodomy není známa. Genesis ji klade mezi města v rovině u Mrtvého moře a dnes se uvádějí tři odpovědi: pod mělkou jižní pánví moře nebo vedle ní, v městech rané doby bronzové na jeho jihovýchodním břehu, nebo v Tall el-Hammamu v údolí Jordánu severně od moře. Bod na mapě stojí v údolí Siddim jižně od poloostrova Lisán, s ostatními městy roviny vedle něj."
    - "Jižní názor je starý. Genesis říká, že se králové střetli „v údolí Siddim, to jest již moře solné“, a Soar, kam utekl Lot, byl známým městem v římské a byzantské době na jihovýchodním rohu moře, dnešní es-Safi. Solný hřbet na jihozápadním břehu se dosud jmenuje Džabal Usdum, hora Sodomy; Josephus i Strabón říkají, že u moře bylo možno vidět stopy spálených měst. Vykopávky Bab edh-Dhra a Numejry na jihovýchodním břehu, měst rané doby bronzové zničených požárem ve 3. tisíciletí př. n. l., dodaly tomuto názoru materiál, ale jsou mnohem starší než obvyklé datum Abrahama."
    - "Severní názor se opírá o Genesis 13: Lot, stojící poblíž Bét-elu, „spatřil všecku rovinu vůkol Jordánu… všecka až k Ségor svlažována byla“ a slovo pro rovinu, kikkar, se jinde užívá o údolí Jordánu kolem Jericha. Jeho zastánci poukazují na Tall el-Hammam, velké město střední doby bronzové východně od Jordánu, které jeho vykopávači datují ke zničení kolem roku 1650 př. n. l.; studie z roku 2021 ve Scientific Reports tvrdící, že je zničil kosmický výbuch ve vzduchu, byla časopisem v dubnu 2025 stažena. Deuteronomium připomíná jen, že země Sodomy, Gomory, Admy a Cebóím se stala „sirou a solí vypálenou“, a žádné z míst nelze označit za jisté."
  nl:
    - "De plaats van Sodom is onbekend. Genesis plaatst het onder de steden van de vlakte bij de Dode Zee, en er worden tegenwoordig drie antwoorden gegeven: onder of naast het ondiepe zuidelijke bekken van de zee, bij de steden uit de Vroege Bronstijd aan de zuidoostelijke oever, of bij Tall el-Hammam in het Jordaandal ten noorden van de zee. Het punt op de kaart staat in het dal van Siddim ten zuiden van het schiereiland Lisan, met de andere steden van de vlakte ernaast."
    - "Het zuidelijke standpunt is het oude. Genesis zegt dat de koningen streden “in het dal Siddim, dat is de Zoutzee”, en Zoar, waarheen Lot vluchtte, was in de Romeinse en Byzantijnse tijd een bekende stad aan de zuidoostelijke hoek van de zee, het huidige es-Safi. De zoutrug aan de zuidwestelijke oever heet nog steeds Jebel Usdum, de berg Sodom; Josephus en Strabo zeggen beiden dat sporen van de verbrande steden bij de zee te zien waren. De opgravingen van Bab edh-Dhra en Numeira aan de zuidoostelijke oever, steden uit de Vroege Bronstijd die in het derde millennium v.Chr. door brand werden verwoest, gaven dit standpunt materiaal, maar zij zijn veel ouder dan de conventionele datering van Abraham."
    - "Het noordelijke standpunt berust op Gen. 13: Lot, staande bij Bethel, “zag de ganse vlakte der Jordaan, dat zij die geheel bevochtigde”, en het woord voor de vlakte, kikkar, wordt elders gebruikt voor het Jordaandal rond Jericho. De pleitbezorgers wijzen op Tall el-Hammam, een grote stad uit de Midden-Bronstijd ten oosten van de Jordaan die volgens de opgravers rond 1650 v.Chr. werd verwoest; een artikel uit 2021 in Scientific Reports dat beweerde dat een kosmische luchtexplosie haar verwoestte, werd in april 2025 door het tijdschrift ingetrokken. Deuteronomium herinnert er alleen aan dat het land van Sodom, Gomorra, Adma en Zeboïm “zwavel en zout der verbranding” werd, en geen van de plaatsen kan als zeker gelden."
  sv:
    - "Platsen för Sodom är okänd. Första Moseboken placerar den bland städerna på slätten vid Döda havet, och tre svar ges i dag: under eller intill havets grunda södra bassäng, vid bronsåldersstäderna på dess sydöstra strand, eller vid Tall el-Hammam i Jordandalen norr om havet. Kartpunkten står i Siddimsdalen söder om Lisanhalvön, med de andra städerna på slätten bredvid."
    - "Den södra uppfattningen är den gamla. Första Moseboken säger att kungarna stred i ”Siddimsdalen, där Salthavet nu är”, och Soar, dit Lot flydde, var en känd stad under romersk och bysantinsk tid i havets sydöstra hörn, dagens es-Safi. Saltåsen på sydvästra stranden kallas fortfarande Jebel Usdum, Sodomberget; Josefus och Strabon säger båda att spår av de brända städerna kunde ses vid havet. Utgrävningarna av Bab edh-Dhra och Numeira på sydöstra stranden, städer från tidig bronsålder som förstördes av eld under tredje årtusendet f.Kr., gav denna uppfattning material, men de är mycket äldre än den konventionella dateringen av Abraham."
    - "Den norra uppfattningen vilar på 1 Mos 13: Lot, som stod nära Betel, ”lyfte upp sina ögon och såg att hela Jordanslätten överallt var vattenrik”, och ordet för slätten, kikkar, används på andra ställen om Jordandalen kring Jeriko. Dess förespråkare pekar på Tall el-Hammam, en stor stad från mellersta bronsåldern öster om Jordan som dess utgrävare daterar till en förstörelse omkring 1650 f.Kr.; en artikel från 2021 i Scientific Reports som hävdade att en kosmisk luftexplosion förstörde den drogs tillbaka av tidskriften i april 2025. Femte Moseboken minns bara hur ”all jord där är förbränd och förvandlad till svavel och salt”, när Sodom, Gomorra, Adma och Sevojim omstörtades, och ingen av platserna kan sägas vara säker."
