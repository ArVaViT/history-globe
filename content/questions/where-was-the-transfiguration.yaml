id: where-was-the-transfiguration
question:
  en: "Where was the Transfiguration?"
  ru: "Где было Преображение?"
  uk: "Де відбулося Преображення?"
  es: "¿Dónde fue la Transfiguración?"
  pt: "Onde foi a Transfiguração?"
  de: "Wo fand die Verklärung statt?"
  fr: "Où eut lieu la Transfiguration ?"
  pl: "Gdzie nastąpiło Przemienienie?"
  it: "Dove avvenne la Trasfigurazione?"
  cs: "Kde došlo k proměnění na hoře?"
  nl: "Waar vond de gedaanteverandering van Jezus plaats?"
  sv: "Var ägde Kristi förklaring rum?"
  nb: "Hvor fant forklarelsen sted?"
  tl: "Saan naganap ang Pagbabagong-anyo?"
answer:
  en:
    - "The Gospels do not name the mountain. Two have been proposed: Mount Tabor, the rounded hill that rises alone from the plain of Jezreel about 9 km east of Nazareth, the traditional site, named by Origen in the third century and by Cyril of Jerusalem and Jerome in the fourth, and the one the map shows, and Mount Hermon, the great snow-capped mountain north of Galilee, which many modern scholars prefer; Mount Meron in Upper Galilee has also been suggested."
    - "Matthew says that “after six days Jesus taketh Peter, James, and John his brother, and bringeth them up into an high mountain apart”, and there he “was transfigured before them”. The six days follow the confession of Peter “into the coasts of Caesarea Philippi”, at the foot of Hermon: the Hermon point on the map is about 22 km from Caesarea Philippi, Tabor about 68 km. Hermon's advocates add that it is by far the higher and best answers to “an high mountain”. Second Peter speaks only of “the holy mount”."
    - "Tabor's case is tradition. Origen is the first known to name it; Cyril of Jerusalem and Jerome follow in the fourth century, and Byzantine churches were built on the summit; Jerome's friend Paula climbed it. Against it, Josephus says that in the first century people lived on the summit and that he himself walled it against the Romans, which some find hard to square with a retreat “apart”, and no first-century witness ties the Transfiguration to any mountain by name. Neither mountain can be called certain, so the map shows the traditional one and notes the other."
  ru:
    - "Евангелия не называют гору. Предлагают две: Фавор, округлый холм, одиноко встающий над Изреельской долиной примерно в 9 км к востоку от Назарета, — традиционное место: его называют Ориген в III веке, Кирилл Иерусалимский и Иероним в IV, и карта показывает его; и Ермон, большую снежную гору к северу от Галилеи, которую предпочитают многие современные учёные; называют и Мерон в Верхней Галилее."
    - "Матфей говорит: «По прошествии дней шести взял Иисус Петра, Иакова и Иоанна, брата его, и возвел их на гору высокую одних», и там Он «преобразился пред ними». Шесть дней отсчитываются от исповедания Петра по приходе «в страны Кесарии Филипповой», у подножия Ермона: точка Ермона на карте отстоит от Кесарии Филипповой примерно на 22 км, Фавор — на 68 км. Сторонники Ермона добавляют, что он намного выше и лучше отвечает словам «гора высокая». Второе послание Петра говорит лишь о «святой горе»."
    - "За Фавор — предание. Первым его называет Ориген; в IV веке — Кирилл Иерусалимский и Иероним, и на вершине построили византийские церкви; на него поднималась Павла, подруга Иеронима. Против — Иосиф Флавий: в I веке на вершине жили люди, и он сам обнёс её стеной против римлян, что некоторым трудно совместить с уединением «одних»; а ни одно свидетельство I века не называет гору Преображения по имени. Ни одну из гор нельзя назвать достоверной, поэтому карта показывает традиционную и упоминает другую."
  uk:
    - "Євангелія не називають гору. Пропонують дві: гору Фавор, округлий пагорб, що здіймається самотньо з Єзреельської рівнини приблизно за 9 км на схід від Назарета, традиційне місце, яке називали Оріген у III ст. та Кирило Єрусалимський і Єронім у IV ст. і яке показує мапа, та гору Гермон, велику засніжену гору на північ від Галілеї, якій багато сучасних учених віддають перевагу; пропонували також гору Мерон у Верхній Галілеї."
    - "Матвій каже, що «через шість день бере Ісус Петра, Якова, та Йоана брата його, й веде їх на гору високу окроме», і там Він «переобразивсь перед ними». Шість днів ідуть услід за визнанням Петра «у сторони Кесариї Филипової», біля підніжжя Гермона: точка Гермона на мапі лежить приблизно за 22 км від Кесарії Пилипової, Фавор — приблизно за 68 км. Прихильники Гермона додають, що він набагато вищий і найкраще відповідає «горі високій». Друге послання Петра говорить лише про те, що вони були з Ним «на горі сьвятій»."
    - "Доказ на користь Фавору — переказ. Оріген — перший відомий, хто його назвав; Кирило Єрусалимський і Єронім слідують у IV ст., а на вершині збудували візантійські церкви; друг Єроніма Паула піднімалася на неї. Проти цього: Йосиф Флавій каже, що в I ст. на вершині жили люди і що він сам оточив її муром проти римлян, що дехто вважає важко узгодити з відходом «окроме», і жодне свідчення I ст. не пов'язує Преображення з якоюсь горою на ім'я. Жодну з гір не можна назвати певною, тож мапа показує традиційну і зазначає іншу."
  es:
    - "Los Evangelios no nombran el monte. Se han propuesto dos: el monte Tabor, la colina redondeada que se alza solitaria sobre la llanura de Jezreel, a unos 9 km al este de Nazaret, el sitio tradicional, nombrado por Orígenes en el siglo III y por Cirilo de Jerusalén y Jerónimo en el IV, y el que muestra el mapa, y el monte Hermón, la gran montaña nevada al norte de Galilea, que muchos estudiosos modernos prefieren; también se ha sugerido el monte Merón, en la Alta Galilea."
    - "Mateo dice que «después de seis días, Jesús toma á Pedro, y á Jacobo, y á Juan su hermano, y los lleva aparte á un monte alto», y allí «se transfiguró delante de ellos». Los seis días siguen a la confesión de Pedro «á las partes de Cesarea de Filipo», al pie del Hermón: el punto del Hermón en el mapa está a unos 22 km de Cesarea de Filipo, el Tabor a unos 68 km. Los defensores del Hermón añaden que es con mucho el más alto y el que mejor responde a «un monte alto». La segunda carta de Pedro habla solo de «el monte santo»."
    - "El argumento del Tabor es la tradición. Orígenes es el primero conocido que lo nombra; Cirilo de Jerusalén y Jerónimo lo siguen en el siglo IV, y se construyeron iglesias bizantinas en la cima; Paula, amiga de Jerónimo, lo escaló. En contra, Josefo dice que en el siglo I había gente viviendo en la cima y que él mismo la amuralló contra los romanos, lo que algunos encuentran difícil de conciliar con un retiro «aparte», y ningún testigo del siglo I vincula la Transfiguración con ningún monte por su nombre. Ninguno de los dos montes puede darse por cierto, de modo que el mapa muestra el tradicional y anota el otro."
  pt:
    - "Os Evangelhos não nomeiam o monte. Dois foram propostos: o monte Tabor, a colina arredondada que se ergue isolada da planície de Jezreel, a cerca de 9 km a leste de Nazaré, o sítio tradicional, nomeado por Orígenes no século III e por Cirilo de Jerusalém e Jerônimo no século IV, e o que o mapa mostra, e o monte Hermom, a grande montanha coberta de neve ao norte da Galileia, que muitos estudiosos modernos preferem; sugeriu-se também o monte Meron, na Alta Galileia."
    - "Mateus diz que “Seis dias depois, Jesus tomou consigo Pedro, Tiago e João, seu irmão, e os levou em particular a um alto monte”, e ali “foi transformado diante deles”. Os seis dias seguem a confissão de Pedro “à região de Cesareia de Filipe”, ao pé do Hermom: o ponto do Hermom no mapa fica a cerca de 22 km de Cesareia de Filipe, o Tabor a cerca de 68 km. Os defensores do Hermom acrescentam que ele é de longe o mais alto e responde melhor a “um alto monte”. 2 Pedro fala apenas do “monte santo”."
    - "O argumento do Tabor é a tradição. Orígenes é o primeiro que se sabe tê-lo nomeado; Cirilo de Jerusalém e Jerônimo seguem no século IV, e igrejas bizantinas foram construídas no cume; a amiga de Jerônimo, Paula, subiu a ele. Contra isso, Josefo diz que no século I havia gente vivendo no cume e que ele próprio o cercou de muralhas contra os romanos, o que alguns acham difícil de conciliar com um retiro “em particular”, e nenhuma testemunha do século I liga a Transfiguração a algum monte pelo nome. Nenhum dos montes pode ser dado por certo, por isso o mapa mostra o tradicional e anota o outro."
  de:
    - "Die Evangelien nennen den Berg nicht. Zwei wurden vorgeschlagen: der Tabor, der rundliche Hügel, der allein aus der Jesreel-Ebene etwa 9 km östlich von Nazareth aufragt, die traditionelle Stätte, im 3. Jahrhundert von Origenes und im 4. von Kyrill von Jerusalem und Hieronymus genannt und der, den die Karte zeigt, und der Hermon, der große schneebedeckte Berg nördlich von Galiläa, den viele moderne Gelehrte bevorzugen; auch der Meron in Obergaliläa wurde vorgeschlagen."
    - "Matthäus sagt: „Und nach sechs Tagen nahm Jesus zu sich Petrus und Jakobus und Johannes, seinen Bruder, und führte sie beiseits auf einen hohen Berg“, und dort: „Und er ward verklärt vor ihnen.“ Die sechs Tage folgen auf das Bekenntnis des Petrus „in die Gegend der Stadt Cäsarea Philippi“ am Fuß des Hermon: Der Hermon-Punkt der Karte ist etwa 22 km von Caesarea Philippi entfernt, der Tabor etwa 68 km. Die Befürworter des Hermon fügen hinzu, er sei bei weitem der höhere und entspreche am besten dem „hohen Berg“. Der Zweite Petrusbrief spricht nur von „dem heiligen Berge“."
    - "Für den Tabor spricht die Überlieferung. Origenes ist der erste, der ihn nennt; Kyrill von Jerusalem und Hieronymus folgen im 4. Jahrhundert, und auf dem Gipfel wurden byzantinische Kirchen gebaut; Hieronymus’ Freundin Paula bestieg ihn. Dagegen sagt Josephus, im 1. Jahrhundert hätten Menschen auf dem Gipfel gelebt und er selbst habe ihn gegen die Römer befestigt, was manche schwer mit einem Rückzug „beiseits“ vereinbaren, und kein Zeuge des 1. Jahrhunderts verbindet die Verklärung namentlich mit einem Berg. Keiner der beiden Berge lässt sich als sicher bezeichnen, daher zeigt die Karte den traditionellen und vermerkt den anderen."
  fr:
    - "Les Évangiles ne nomment pas la montagne. Deux ont été proposées : le mont Thabor, la colline arrondie qui s’élève seule de la plaine de Jizreel, à environ 9 km à l’est de Nazareth, site traditionnel, nommé par Origène au IIIe siècle et par Cyrille de Jérusalem et Jérôme au IVe, et celui que montre la carte, et le mont Hermon, la grande montagne enneigée au nord de la Galilée, que préfèrent de nombreux spécialistes modernes ; le mont Méron, en Haute Galilée, a aussi été suggéré."
    - "Matthieu dit : « Six jours après, Jésus prit avec lui Pierre, Jacques, et Jean, son frère, et il les conduisit à l’écart sur une haute montagne », et là « Il fut transfiguré devant eux ». Les six jours suivent la confession de Pierre « dans le territoire de Césarée de Philippe », au pied de l’Hermon : le point de l’Hermon sur la carte est à environ 22 km de Césarée de Philippe, le Thabor à environ 68 km. Les partisans de l’Hermon ajoutent qu’il est de beaucoup le plus élevé et répond le mieux à « une haute montagne ». La seconde épître de Pierre parle seulement de « la sainte montagne »."
    - "L’argument en faveur du Thabor est la tradition. Origène est le premier connu à le nommer ; Cyrille de Jérusalem et Jérôme suivent au IVe siècle, et des églises byzantines furent bâties au sommet ; l’amie de Jérôme, Paule, l’escalada. Contre cela, Flavius Josèphe dit qu’au Ier siècle des gens vivaient au sommet et qu’il l’entoura lui-même de murs contre les Romains, ce que certains jugent difficile à concilier avec une retraite « à l’écart », et aucun témoin du Ier siècle ne rattache la Transfiguration à une montagne nommée. Aucune des deux montagnes ne peut être tenue pour certaine ; la carte montre donc la traditionnelle et note l’autre."
  pl:
    - "Ewangelie nie wymieniają góry. Proponowano dwie: Górę Tabor, zaokrąglone wzgórze wznoszące się samotnie z równiny Jizreel około 9 km na wschód od Nazaretu, tradycyjne miejsce, nazwane przez Orygenesa w III wieku oraz przez Cyryla Jerozolimskiego i Hieronima w IV, i to, które pokazuje mapa, oraz Hermon, wielką ośnieżoną górę na północ od Galilei, którą woli wielu współczesnych uczonych; sugerowano też górę Meron w Górnej Galilei."
    - "Mateusz mówi, że „po sześciu dniach wziął Jezus Piotra i Jakóba i Jana, brata jego, i wprowadził je na górę wysoką osobno”, i tam „przemieniony jest przed nimi”. Sześć dni następuje po wyznaniu Piotra „w strony Cezaryi Filippowej”, u stóp Hermonu: punkt Hermonu na mapie jest oddalony od Cezarei Filipowej o około 22 km, Tabor o około 68 km. Zwolennicy Hermonu dodają, że jest znacznie wyższy i najlepiej odpowiada wysokiej górze z opowieści. Drugi List Piotra mówi tylko o „onej górze świętej”."
    - "Za Taborem przemawia tradycja. Orygenes jest pierwszym znanym, który go nazwał; Cyryl Jerozolimski i Hieronim idą za nim w IV wieku, a na szczycie zbudowano bizantyjskie kościoły; przyjaciółka Hieronima Paula weszła na niego. Przeciw temu Józef Flawiusz mówi, że w I wieku ludzie mieszkali na szczycie i że sam obwarował go murem przeciw Rzymianom, co niektórzy uważają za trudne do pogodzenia z odosobnieniem „osobno”, a żaden świadek z I wieku nie wiąże Przemienienia z żadną górą z nazwy. Żadnej z gór nie można nazwać pewną, więc mapa pokazuje tradycyjną i odnotowuje drugą."
  it:
    - "I Vangeli non nominano il monte. Ne sono stati proposti due: il Monte Tabor, la collina arrotondata che si leva solitaria dalla pianura di Izreel a circa 9 km a est di Nazaret, il luogo tradizionale, nominato da Origene nel III secolo e da Cirillo di Gerusalemme e Girolamo nel IV, e quello che la mappa mostra, e il Monte Ermon, la grande montagna innevata a nord della Galilea, che molti studiosi moderni preferiscono; è stato suggerito anche il Monte Meron nell’Alta Galilea."
    - "Matteo dice che «Sei giorni dopo, Gesù prese seco Pietro, Giacomo e Giovanni suo fratello, e li condusse sopra un alto monte, in disparte», e lì «fu trasfigurato dinanzi a loro». I sei giorni seguono la confessione di Pietro «nelle parti di Cesarea di Filippo», ai piedi dell’Ermon: il punto dell’Ermon sulla mappa dista circa 22 km da Cesarea di Filippo, il Tabor circa 68 km. I sostenitori dell’Ermon aggiungono che esso è di gran lunga il più alto e risponde meglio a «un alto monte». La seconda lettera di Pietro parla soltanto del «monte santo»."
    - "La tesi del Tabor è la tradizione. Origene è il primo noto a nominarlo; Cirillo di Gerusalemme e Girolamo seguono nel IV secolo, e sulla vetta furono costruite chiese bizantine; l’amica di Girolamo, Paola, vi salì. Contro di esso, Giuseppe Flavio dice che nel I secolo la gente abitava sulla vetta e che egli stesso la cinse di mura contro i Romani, il che alcuni trovano difficile da conciliare con un ritiro «in disparte», e nessun testimone del I secolo lega la Trasfigurazione a un monte per nome. Nessuno dei due monti può dirsi certo, così la mappa mostra quello tradizionale e annota l’altro."
  cs:
    - "Evangelia horu nejmenují. Navrhovány byly dvě: Tábor, zaoblený pahorek, který se osamoceně zvedá z Jizreelské roviny asi 9 km východně od Nazareta, tradiční místo, které jmenoval Órigenés ve 3. století a Cyril Jeruzalémský a Jeroným ve 4., a které ukazuje mapa, a Hermon, velká zasněžená hora na sever od Galileje, které dává přednost mnoho moderních badatelů; navrhována byla také hora Meron v Horní Galileji."
    - "Matouš praví, že „po šesti dnech pojal Ježíš Petra a Jakuba a Jana bratra jeho, i uvedl je na horu vysokou soukromí“, a tam „proměnil se před nimi“. Šest dní následuje po Petrově vyznání „do krajin Cesaree Filipovy“, na úpatí Hermonu: bod Hermonu na mapě je asi 22 km od Cesareje Filipovy, Tábor asi 68 km. Zastánci Hermonu dodávají, že je daleko vyšší a nejlépe odpovídá „hoře vysoké“. Druhý Petrův list mluví jen o „oné hoře svaté“."
    - "Pro Tábor mluví tradice. Órigenés je první známý, kdo jej jmenuje; Cyril Jeruzalémský a Jeroným následují ve 4. století a na vrcholu byly postaveny byzantské kostely; Jeronýmova přítelkyně Paula na něj vystoupila. Proti tomu Josephus říká, že v 1. století lidé na vrcholu bydleli a že jej sám opevnil proti Římanům, což někteří těžko slučují s ústraním „soukromí“, a žádný svědek z 1. století nespojuje proměnění s žádnou horou jménem. Žádnou horu nelze označit za jistou, a proto mapa ukazuje tradiční a druhou poznamenává."
  nl:
    - "De evangeliën noemen de berg niet. Er zijn er twee voorgesteld: de Tabor, de ronde heuvel die alleen uit de vlakte van Jizreël oprijst ongeveer 9 km ten oosten van Nazareth, de traditionele plaats, door Origenes in de derde eeuw genoemd en door Cyrillus van Jeruzalem en Hieronymus in de vierde, en degene die de kaart toont, en de Hermon, de grote besneeuwde berg ten noorden van Galilea, die veel moderne geleerden verkiezen; ook de Meron in Boven-Galilea is geopperd."
    - "Mattheüs vertelt: “En na zes dagen nam Jezus met Zich Petrus, en Jakobus, en Johannes, zijn broeder, en bracht hen op een hogen berg alleen. En Hij werd voor hen veranderd van gedaante.” De zes dagen volgen op de belijdenis van Petrus “in de delen van Cesarea Filippi”, aan de voet van de Hermon: het punt van de Hermon op de kaart ligt ongeveer 22 km van Caesarea Filippi, de Tabor ongeveer 68 km. De pleitbezorgers van de Hermon voegen toe dat die verreweg de hogere is en het best past bij “een hogen berg”. 2 Petrus spreekt alleen van “den heiligen berg”."
    - "De zaak van de Tabor is overlevering. Origenes is de eerste die haar noemt; Cyrillus van Jeruzalem en Hieronymus volgen in de vierde eeuw, en op de top werden Byzantijnse kerken gebouwd; Hieronymus' vriendin Paula beklom hem. Daartegen zegt Josephus dat er in de eerste eeuw mensen op de top woonden en dat hij hem zelf tegen de Romeinen ommuurde, wat sommigen moeilijk te rijmen vinden met een terugtocht “alleen”, en geen getuige uit de eerste eeuw verbindt de gedaanteverandering bij name met een berg. Geen van beide bergen kan als zeker gelden, dus de kaart toont de traditionele en vermeldt de andere."
  sv:
    - "Evangelierna nämner inte berget. Två har föreslagits: Tabor, den rundade kullen som reser sig ensam från Jisreelslätten omkring 9 km öster om Nasaret, den traditionella platsen, nämnd av Origenes på 200-talet och av Kyrillos av Jerusalem och Hieronymus på 300-talet, och den som kartan visar, och Hermon, det stora snötäckta berget norr om Galileen, som många moderna forskare föredrar; berget Meron i Övre Galileen har också föreslagits."
    - "Matteus säger: ”Sex dagar därefter tog Jesus med sig Petrus och Jakob och Johannes, Jakobs broder, och förde dem upp på ett högt berg, där de voro allena. Och hans utseende förvandlades inför dem”. De sex dagarna följer på Petrus’ bekännelse i ”trakten av Cesarea Filippi”, vid Hermons fot: Hermonpunkten på kartan ligger omkring 22 km från Caesarea Filippi, Tabor omkring 68 km. Hermons förespråkare tillägger att det i särklass är det högsta och bäst svarar mot ”ett högt berg”. Andra Petrusbrevet talar bara om ”det heliga berget”."
    - "Tabors argument är traditionen. Origenes är den förste som är känd för att nämna det; Kyrillos av Jerusalem och Hieronymus följer på 300-talet, och bysantinska kyrkor byggdes på toppen; Hieronymus’ vän Paula besteg det. Mot det talar att Josefus säger att människor bodde på toppen under första århundradet och att han själv murade in det mot romarna, vilket vissa har svårt att förena med en tillflykt ”allena”, och inget vittne från första århundradet knyter Kristi förklaring till något berg vid namn. Inget av bergen kan kallas säkert, så kartan visar det traditionella och noterar det andra."
  nb:
    - "Evangeliene nevner ikke fjellet. To er foreslått: Tabor, den avrundede høyden som reiser seg alene fra Jisreel-sletten omtrent 9 km øst for Nasaret, det tradisjonelle stedet, nevnt av Origenes på 200-tallet og av Kyrillos av Jerusalem og Hieronymus på 300-tallet, og det kartet viser, og Hermon, det store snødekte fjellet nord for Galilea, som mange moderne forskere foretrekker; Meron-fjellet i Øvre Galilea er også foreslått."
    - "Matteus sier at «seks dager derefter tok Jesus med sig Peter, Jakob og hans bror Johannes og førte dem avsides op på et høit fjell», og der «blev forklaret for deres øine». De seks dagene følger Peters bekjennelse «til landet ved Cesarea Filippi», ved foten av Hermon: Hermon-punktet på kartet ligger omtrent 22 km fra Cæsarea Filippi, Tabor omtrent 68 km. Hermons talsmenn tilføyer at det er langt det høyeste og best svarer til «et høit fjell». Andre Petersbrev taler bare om «det hellige berg»."
    - "Tabors sak er tradisjonen. Origenes er den første som er kjent for å nevne det; Kyrillos av Jerusalem og Hieronymus følger på 300-tallet, og bysantinske kirker ble bygd på toppen; Hieronymus’ venninne Paula besteg det. Mot det taler at Josefus sier at det på 1. århundre bodde folk på toppen og at han selv murte den inn mot romerne, noe noen har vanskelig for å forene med en tilbaketrekning «avsides», og at intet vitne fra 1. århundre knytter forklarelsen til noe fjell ved navn. Ingen av fjellene kan kalles sikre, så kartet viser det tradisjonelle og nevner det andre."
  tl:
    - "Hindi pinangalanan ng mga Ebanghelyo ang bundok. Dalawa ang iminungkahi: ang Bundok Tabor, ang bilugang burol na nag-iisang umaangat mula sa kapatagan ng Jezreel mga 9 km sa silangan ng Nazaret, ang tradisyonal na pook, na pinangalanan ni Origenes noong ika-3 siglo at nina Cirilo ng Jerusalem at Jeronimo noong ika-4, at ang ipinapakita ng mapa; at ang Bundok Hermon, ang dakilang bundok na may niyebe sa hilaga ng Galilea, na mas pinipili ng maraming makabagong iskolar; iminungkahi rin ang Bundok Meron sa Itaas na Galilea."
    - "Sinasabi ni Mateo na “pagkaraan ng anim na araw, ay isinama ni Jesus si Pedro, at si Santiago, at si Juan na kapatid niya, at sila'y dinalang bukod sa isang mataas na bundok”, at doon “nagbagong-anyo siya sa harap nila”. Sumusunod ang anim na araw sa pagpapahayag ni Pedro sa “mga sakop ng Cesarea ni Filipo”, sa paanan ng Hermon: ang punto ng Hermon sa mapa ay mga 22 km mula sa Cesarea ni Filipo, ang Thabor ay mga 68 km. Idinaragdag ng mga tagapagtanggol ng Hermon na ito ang higit na mataas nang malayo at pinakaangkop sa “isang mataas na bundok”. Ang Ikalawang Pedro ay nagsasalita lamang tungkol sa “banal na bundok”."
    - "Ang katwiran para sa Thabor ay tradisyon. Si Origenes ang unang kilalang nagpangalan dito; sumusunod sina Cirilo ng Jerusalem at Jeronimo noong ika-4 na siglo, at itinayo ang mga simbahang Bizantino sa tuktok; inakyat ito ni Paula, kaibigan ni Jeronimo. Laban dito, sinasabi ni Josephus na noong unang siglo ay may nakatira sa tuktok at siya mismo ang nagkutang may pader doon laban sa mga Romano, na itinuturing ng ilan na mahirap iakma sa isang pag-urong na “bukod”, at walang saksi noong unang siglo na nag-uugnay sa Pagbabagong-anyo sa anumang bundok sa pangalan. Walang bundok na matatawag na tiyak, kaya ipinapakita ng mapa ang tradisyonal at binabanggit ang isa."
