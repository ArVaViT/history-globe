id: where-was-the-transfiguration
question:
  en: "Where was the Transfiguration?"
  ru: "Где было Преображение?"
  uk: "Де відбулося Преображення?"
  es: "¿Dónde fue la Transfiguración?"
  pt: "Onde foi a Transfiguração?"
  de: "Wo fand die Verklärung statt?"
  fr: "Où eut lieu la Transfiguration ?"
answer:
  en:
    - "The Gospels do not name the mountain. Two have been proposed: Mount Tabor, the rounded hill that rises alone from the plain of Jezreel about 9 km east of Nazareth, the traditional site, named by Origen in the third century and by Cyril of Jerusalem and Jerome in the fourth, and the one the map shows, and Mount Hermon, the great snow-capped mountain north of Galilee, which many modern scholars prefer; Mount Meron in Upper Galilee has also been suggested."
    - "Matthew says that “after six days Jesus taketh Peter, James, and John his brother, and bringeth them up into an high mountain apart”, and there he “was transfigured before them”. The six days follow the confession of Peter “into the coasts of Caesarea Philippi”, at the foot of Hermon: the Hermon point on the map is about 22 km from Caesarea Philippi, Tabor about 68 km. Hermon's advocates add that it is by far the higher and best answers to “an high mountain”. Second Peter speaks only of “the holy mount”."
    - "Tabor's case is tradition. Origen is the first known to name it; Cyril of Jerusalem and Jerome follow in the fourth century, and Byzantine churches were built on the summit; Jerome's friend Paula climbed it. Against it, Josephus says that in the first century people lived on the summit and that he himself walled it against the Romans, which some find hard to square with a retreat “apart”, and no first-century witness ties the Transfiguration to any mountain by name. Neither mountain can be called certain, so the map shows the traditional one and notes the other."
  ru:
    - "Евангелия не называют гору. Предлагают две: Фавор, округлый холм, одиноко встающий над Изреельской долиной примерно в 9 км к востоку от Назарета, — традиционное место: его называют Ориген в III веке, Кирилл Иерусалимский и Иероним в IV, и карта показывает его; и Ермон, большую снежную гору к северу от Галилеи, которую предпочитают многие современные учёные; называют и Мерон в Верхней Галилее."
    - "Матфей говорит: «По прошествии дней шести взял Иисус Петра, Иакова и Иоанна, брата его, и возвел их на гору высокую одних», и там Он «преобразился пред ними». Шесть дней отсчитываются от исповедания Петра по приходе «в страны Кесарии Филипповой», у подножия Ермона: точка Ермона на карте отстоит от Кесарии Филипповой примерно на 22 км, Фавор — на 68 км. Сторонники Ермона добавляют, что он намного выше и лучше отвечает словам «гора высокая». Второе послание Петра говорит лишь о «святой горе»."
    - "За Фавор — предание. Первым его называет Ориген; в IV веке — Кирилл Иерусалимский и Иероним, и на вершине построили византийские церкви; на него поднималась Павла, подруга Иеронима. Против — Иосиф Флавий: в I веке на вершине жили люди, и он сам обнёс её стеной против римлян, что некоторым трудно совместить с уединением «одних»; а ни одно свидетельство I века не называет гору Преображения по имени. Ни одну из гор нельзя назвать достоверной, поэтому карта показывает традиционную и упоминает другую."
  uk:
    - "Євангелія не називають гору. Пропонують дві: гору Фавор, округлий пагорб, що здіймається самотньо з Єзреельської рівнини приблизно за 9 км на схід від Назарета, традиційне місце, яке називали Оріген у III ст. та Кирило Єрусалимський і Єронім у IV ст. і яке показує мапа, та гору Гермон, велику засніжену гору на північ від Галілеї, якій багато сучасних учених віддають перевагу; пропонували також гору Мерон у Верхній Галілеї."
    - "Матвій каже, що «через шість день бере Ісус Петра, Якова, та Йоана брата його, й веде їх на гору високу окроме», і там Він «переобразивсь перед ними». Шість днів ідуть услід за визнанням Петра «у сторони Кесариї Филипової», біля підніжжя Гермона: точка Гермона на мапі лежить приблизно за 22 км від Кесарії Пилипової, Фавор — приблизно за 68 км. Прихильники Гермона додають, що він набагато вищий і найкраще відповідає «горі високій». Друге послання Петра говорить лише про те, що вони були з Ним «на горі сьвятій»."
    - "Доказ на користь Фавору — переказ. Оріген — перший відомий, хто його назвав; Кирило Єрусалимський і Єронім слідують у IV ст., а на вершині збудували візантійські церкви; друг Єроніма Паула піднімалася на неї. Проти цього: Йосиф Флавій каже, що в I ст. на вершині жили люди і що він сам оточив її муром проти римлян, що дехто вважає важко узгодити з відходом «окроме», і жодне свідчення I ст. не пов'язує Преображення з якоюсь горою на ім'я. Жодну з гір не можна назвати певною, тож мапа показує традиційну і зазначає іншу."
  es:
    - "Los Evangelios no nombran el monte. Se han propuesto dos: el monte Tabor, la colina redondeada que se alza solitaria sobre la llanura de Jezreel, a unos 9 km al este de Nazaret, el sitio tradicional, nombrado por Orígenes en el siglo III y por Cirilo de Jerusalén y Jerónimo en el IV, y el que muestra el mapa, y el monte Hermón, la gran montaña nevada al norte de Galilea, que muchos estudiosos modernos prefieren; también se ha sugerido el monte Merón, en la Alta Galilea."
    - "Mateo dice que «después de seis días, Jesús toma á Pedro, y á Jacobo, y á Juan su hermano, y los lleva aparte á un monte alto», y allí «se transfiguró delante de ellos». Los seis días siguen a la confesión de Pedro «á las partes de Cesarea de Filipo», al pie del Hermón: el punto del Hermón en el mapa está a unos 22 km de Cesarea de Filipo, el Tabor a unos 68 km. Los defensores del Hermón añaden que es con mucho el más alto y el que mejor responde a «un monte alto». La segunda carta de Pedro habla solo de «el monte santo»."
    - "El argumento del Tabor es la tradición. Orígenes es el primero conocido que lo nombra; Cirilo de Jerusalén y Jerónimo lo siguen en el siglo IV, y se construyeron iglesias bizantinas en la cima; Paula, amiga de Jerónimo, lo escaló. En contra, Josefo dice que en el siglo I había gente viviendo en la cima y que él mismo la amuralló contra los romanos, lo que algunos encuentran difícil de conciliar con un retiro «aparte», y ningún testigo del siglo I vincula la Transfiguración con ningún monte por su nombre. Ninguno de los dos montes puede darse por cierto, de modo que el mapa muestra el tradicional y anota el otro."
  pt:
    - "Os Evangelhos não nomeiam o monte. Dois foram propostos: o monte Tabor, a colina arredondada que se ergue isolada da planície de Jezreel, a cerca de 9 km a leste de Nazaré, o sítio tradicional, nomeado por Orígenes no século III e por Cirilo de Jerusalém e Jerônimo no século IV, e o que o mapa mostra, e o monte Hermom, a grande montanha coberta de neve ao norte da Galileia, que muitos estudiosos modernos preferem; sugeriu-se também o monte Meron, na Alta Galileia."
    - "Mateus diz que “Seis dias depois, Jesus tomou consigo Pedro, Tiago e João, seu irmão, e os levou em particular a um alto monte”, e ali “foi transformado diante deles”. Os seis dias seguem a confissão de Pedro “à região de Cesareia de Filipe”, ao pé do Hermom: o ponto do Hermom no mapa fica a cerca de 22 km de Cesareia de Filipe, o Tabor a cerca de 68 km. Os defensores do Hermom acrescentam que ele é de longe o mais alto e responde melhor a “um alto monte”. 2 Pedro fala apenas do “monte santo”."
    - "O argumento do Tabor é a tradição. Orígenes é o primeiro que se sabe tê-lo nomeado; Cirilo de Jerusalém e Jerônimo seguem no século IV, e igrejas bizantinas foram construídas no cume; a amiga de Jerônimo, Paula, subiu a ele. Contra isso, Josefo diz que no século I havia gente vivendo no cume e que ele próprio o cercou de muralhas contra os romanos, o que alguns acham difícil de conciliar com um retiro “em particular”, e nenhuma testemunha do século I liga a Transfiguração a algum monte pelo nome. Nenhum dos montes pode ser dado por certo, por isso o mapa mostra o tradicional e anota o outro."
  de:
    - "Die Evangelien nennen den Berg nicht. Zwei wurden vorgeschlagen: der Tabor, der rundliche Hügel, der allein aus der Jesreel-Ebene etwa 9 km östlich von Nazareth aufragt, die traditionelle Stätte, im 3. Jahrhundert von Origenes und im 4. von Kyrill von Jerusalem und Hieronymus genannt und der, den die Karte zeigt, und der Hermon, der große schneebedeckte Berg nördlich von Galiläa, den viele moderne Gelehrte bevorzugen; auch der Meron in Obergaliläa wurde vorgeschlagen."
    - "Matthäus sagt: „Und nach sechs Tagen nahm Jesus zu sich Petrus und Jakobus und Johannes, seinen Bruder, und führte sie beiseits auf einen hohen Berg“, und dort: „Und er ward verklärt vor ihnen.“ Die sechs Tage folgen auf das Bekenntnis des Petrus „in die Gegend der Stadt Cäsarea Philippi“ am Fuß des Hermon: Der Hermon-Punkt der Karte ist etwa 22 km von Caesarea Philippi entfernt, der Tabor etwa 68 km. Die Befürworter des Hermon fügen hinzu, er sei bei weitem der höhere und entspreche am besten dem „hohen Berg“. Der Zweite Petrusbrief spricht nur von „dem heiligen Berge“."
    - "Für den Tabor spricht die Überlieferung. Origenes ist der erste, der ihn nennt; Kyrill von Jerusalem und Hieronymus folgen im 4. Jahrhundert, und auf dem Gipfel wurden byzantinische Kirchen gebaut; Hieronymus’ Freundin Paula bestieg ihn. Dagegen sagt Josephus, im 1. Jahrhundert hätten Menschen auf dem Gipfel gelebt und er selbst habe ihn gegen die Römer befestigt, was manche schwer mit einem Rückzug „beiseits“ vereinbaren, und kein Zeuge des 1. Jahrhunderts verbindet die Verklärung namentlich mit einem Berg. Keiner der beiden Berge lässt sich als sicher bezeichnen, daher zeigt die Karte den traditionellen und vermerkt den anderen."
  fr:
    - "Les Évangiles ne nomment pas la montagne. Deux ont été proposées : le mont Thabor, la colline arrondie qui s’élève seule de la plaine de Jizreel, à environ 9 km à l’est de Nazareth, site traditionnel, nommé par Origène au IIIe siècle et par Cyrille de Jérusalem et Jérôme au IVe, et celui que montre la carte, et le mont Hermon, la grande montagne enneigée au nord de la Galilée, que préfèrent de nombreux spécialistes modernes ; le mont Méron, en Haute Galilée, a aussi été suggéré."
    - "Matthieu dit : « Six jours après, Jésus prit avec lui Pierre, Jacques, et Jean, son frère, et il les conduisit à l’écart sur une haute montagne », et là « Il fut transfiguré devant eux ». Les six jours suivent la confession de Pierre « dans le territoire de Césarée de Philippe », au pied de l’Hermon : le point de l’Hermon sur la carte est à environ 22 km de Césarée de Philippe, le Thabor à environ 68 km. Les partisans de l’Hermon ajoutent qu’il est de beaucoup le plus élevé et répond le mieux à « une haute montagne ». La seconde épître de Pierre parle seulement de « la sainte montagne »."
    - "L’argument en faveur du Thabor est la tradition. Origène est le premier connu à le nommer ; Cyrille de Jérusalem et Jérôme suivent au IVe siècle, et des églises byzantines furent bâties au sommet ; l’amie de Jérôme, Paule, l’escalada. Contre cela, Flavius Josèphe dit qu’au Ier siècle des gens vivaient au sommet et qu’il l’entoura lui-même de murs contre les Romains, ce que certains jugent difficile à concilier avec une retraite « à l’écart », et aucun témoin du Ier siècle ne rattache la Transfiguration à une montagne nommée. Aucune des deux montagnes ne peut être tenue pour certaine ; la carte montre donc la traditionnelle et note l’autre."
