id: where-did-paul-write-his-letters
question:
  en: "Where did Paul write his letters from?"
  ru: "Откуда Павел писал свои послания?"
  uk: "Звідки Павло писав свої послання?"
  es: "¿Desde dónde escribió Pablo sus cartas?"
  pt: "De onde Paulo escreveu suas cartas?"
  de: "Von wo schrieb Paulus seine Briefe?"
  fr: "D’où Paul a-t-il écrit ses lettres ?"
  pl: "Skąd Paweł pisał swoje listy?"
  it: "Da dove Paolo scrisse le sue lettere?"
  nl: "Vanwaar schreef Paulus zijn brieven?"
  cs: "Odkud Pavel psal své listy?"
  sv: "Varifrån skrev Paulus sina brev?"
  nb: "Hvor skrev Paulus brevene sine fra?"
  tl: "Saan isinulat ni Pablo ang kaniyang mga liham?"
  da: "Hvorfra skrev Paulus sine breve?"
  sr: "Одакле је Павле писао своје посланице?"
  hu: "Honnan írta Pál a leveleit?"
  fi: "Mistä Paavali kirjoitti kirjeensä?"
  vi: "Phao-lô viết các thư từ đâu?"
  ro: "De unde și-a scris Pavel epistolele?"
  bg: "Откъде Павел е писал посланията си?"
answer:
  en:
    - "From the cities where he stayed longest: Corinth, Ephesus and, at the end, Rome. The map point stands on Corinth, from which the earliest letter and the longest were sent. Only a few letters name their place of writing outright, and the rest are placed by matching their hints with the story in Acts, so some of the answers below are disputed."
    - "First Thessalonians was written at Corinth about AD 50, soon after Timothy had come back from Thessalonica: “when Silas and Timotheus were come from Macedonia”, as Acts says of Paul's stay there. First Corinthians came from Ephesus about 55: “I will tarry at Ephesus until Pentecost.” Second Corinthians followed from Macedonia later that year, after Paul had crossed from Troas and found Titus. Romans was written at Corinth about 57, during the three months Paul spent in Greece before his last journey to Jerusalem: he commends “Phebe our sister, which is a servant of the church which is at Cenchrea”, Corinth's eastern port 11 km away, and sends greetings from his host Gaius and from “Erastus the chamberlain of the city”, whose name appears on a paving inscription found at Corinth. Galatians is put either at Antioch about 48 or at Ephesus a few years later."
    - "The letters from prison, Philippians, Colossians, Philemon and Ephesians, speak of “my bonds”, of “all the palace” and of “they that are of Caesar's household”; the old view places them in Rome during the two years of Acts 28, about 60–62, and that is still the most common, but many scholars argue for Ephesus about 54–55 or for Caesarea, where Paul lay two years before his appeal, since Onesimus and the messengers travel so easily between the apostle and the Lycus valley. Second Timothy, if Paul's own, was written from a Roman prison near the end: “when he was in Rome, he sought me out very diligently.”"
  ru:
    - "Из городов, где он задерживался дольше всего: из Коринфа, Ефеса и, под конец, из Рима. Точка карты стоит на Коринфе, откуда ушли самое раннее послание и самое длинное. Лишь немногие послания прямо называют место написания, остальные помещают, сверяя намёки в них с рассказом Деяний, так что часть ответов ниже оспаривается."
    - "Первое послание к Фессалоникийцам написано в Коринфе около 50 года, вскоре после возвращения Тимофея из Фессалоники — «когда пришли из Македонии Сила и Тимофей», как говорят Деяния о пребывании Павла там. Первое к Коринфянам пришло из Ефеса около 55 года: «В Ефесе же я пробуду до Пятидесятницы». Второе к Коринфянам последовало из Македонии в том же году, когда Павел нашёл там Тита. Послание к Римлянам написано в Коринфе около 57 года, в три месяца, которые Павел провёл в Элладе перед последним путём в Иерусалим: он представляет «Фиву, сестру нашу, диакониссу церкви Кенхрейской» — Кенхреи, восточная гавань Коринфа, в 11 км от города — и передаёт приветы от хозяина дома Гаия и от Ераста: «Приветствует вас Ераст, городской казнохранитель» — его имя стоит на мостовой, найденной в Коринфе. Послание к Галатам относят либо к Антиохии около 48 года, либо к Ефесу несколькими годами позже."
    - "Послания из уз — к Филиппийцам, Колоссянам, Филимону и Ефесянам — говорят об «узах моих», о «всей претории» и о тех, кто «из кесарева дома»; старое мнение помещает их в Рим, в два года из 28-й главы Деяний, около 60–62 годов, и оно по-прежнему самое распространённое, но многие учёные доказывают Ефес около 54–55 годов или Кесарию, где Павел два года сидел до своей апелляции, — слишком легко ходят Онисим и посланцы между апостолом и долиной Лика. Второе к Тимофею, если оно принадлежит Павлу, написано из римской тюрьмы под конец: «быв в Риме, с великим тщанием искал меня и нашел»."
  uk:
    - "З міст, де він пробув найдовше: Коринта, Ефеса і, наприкінці, Рима. Точка мапи стоїть на Коринті, звідки було надіслано найраніше послання й найдовше. Лише кілька послань прямо називають місце написання, а решту розміщують, зіставляючи їхні натяки з розповіддю Дій, тож деякі з наведених нижче відповідей спірні."
    - "Перше послання до солунян було написане в Коринті близько 50 р. н. е., незабаром після того, як Тимофій повернувся з Солуня: «Як же прийшов з Македониї Сила та Тимотей», як кажуть Дії про Павла там. Перше послання до коринтян надійшло з Ефеса близько 55 р.: «Пробуду ж у Єфесї до пятидесятницї». Друге послання до коринтян — з Македонії того ж року, коли Павло переправився з Троади й знайшов Тита. Послання до римлян було написане в Коринті близько 57 р., за три місяці, які Павло провів у Греції перед останньою подорожжю до Єрусалиму: він рекомендує «Фиву, сестру нашу, служительку церкви, що в Кенхреях», східного порту Коринта за 11 км, і передає вітання від свого господаря Гая та від Ераста, «доморядник городський», чиє ім'я з'являється на брукованому написі, знайденому в Коринті. Послання до галатів відносять або до Антіохії близько 48 р., або до Ефеса кількома роками пізніше."
    - "Послання з в'язниці — до филип'ян, колосян, Филимона й ефесян — говорять про «кайдани мої в Христї обявились у всьому судищі» й про тих, «которі з кесаревого дому»; давній погляд ставить їх у Рим протягом двох років Дій 28, близько 60–62 рр., і він досі найпоширеніший, але багато вчених обстоює Ефес близько 54–55 р. або Кесарію, де Павло пролежав два роки до свого апеляційного звернення, оскільки Онисим і посланці так легко ходять між апостолом і долиною Лікуса. Друге послання до Тимофія, якщо воно Павлове, було написане з римської в'язниці наприкінці: «а бувши в Римі, дуже пильно шукав мене»."
  es:
    - "Desde las ciudades donde permaneció más tiempo: Corinto, Éfeso y, al final, Roma. El punto del mapa está en Corinto, desde donde se enviaron la carta más antigua y la más larga. Solo unas pocas cartas nombran expresamente su lugar de redacción, y las demás se sitúan cotejando sus indicios con el relato de Hechos, de modo que algunas de las respuestas siguientes son discutidas."
    - "Primera de Tesalonicenses se escribió en Corinto hacia el 50 d. C., poco después de que Timoteo volviera de Tesalónica: «Y cuando Silas y Timoteo vinieron de Macedonia», dice Hechos de la estancia de Pablo allí. Primera de Corintios vino de Éfeso hacia el 55: «Empero estaré en Efeso hasta Pentecostés». Segunda de Corintios siguió desde Macedonia más tarde ese año, tras cruzar Pablo desde Troas y hallar a Tito. Romanos se escribió en Corinto hacia el 57, en los tres meses de Pablo en Grecia antes de su último viaje a Jerusalén: recomienda a «Febe nuestra hermana, la cual es diaconisa de la iglesia que está en Cencreas», el puerto oriental de Corinto, a 11 km, y envía saludos de su anfitrión Gayo y de «Erasto, tesorero de la ciudad», cuyo nombre aparece en una inscripción de pavimento de Corinto. Gálatas va en Antioquía hacia el 48 o en Éfeso unos años después."
    - "Las cartas desde la cárcel, Filipenses, Colosenses, Filemón y Efesios, hablan de «mis prisiones», de «todo el pretorio» y de «los que son de casa de César»; la opinión antigua las sitúa en Roma durante los dos años de Hechos 28, hacia 60–62, y sigue siendo la más común, pero muchos estudiosos defienden Éfeso hacia 54–55 o Cesarea, donde Pablo estuvo dos años antes de su apelación, pues Onésimo y los mensajeros viajan con tanta facilidad entre el apóstol y el valle del Licos. Segunda de Timoteo, si es de Pablo, se escribió desde una cárcel romana hacia el final: «estando él en Roma, me buscó solícitamente»."
  pt:
    - "Das cidades onde ficou mais tempo: Corinto, Éfeso e, no fim, Roma. O ponto do mapa está em Corinto, de onde foram enviadas a carta mais antiga e a mais longa. Só poucas cartas nomeiam abertamente o lugar de onde foram escritas, e as demais são situadas combinando suas pistas com a história de Atos, de modo que algumas respostas abaixo são disputadas."
    - "Primeira Tessalonicenses foi escrita em Corinto por volta de 50 d.C., logo depois de Timóteo voltar de Tessalônica: “Quando Silas e Timóteo desceram da Macedônia”, como diz Atos da estada de Paulo ali. Primeira Coríntios veio de Éfeso por volta de 55: “ficarei em Éfeso até o Pentecostes”. Segunda Coríntios seguiu da Macedônia, no mesmo ano, depois que Paulo atravessou de Trôade e encontrou Tito. Romanos foi escrita em Corinto por volta de 57, nos três meses que Paulo passou na Grécia antes de sua última viagem a Jerusalém: recomenda “Febe, nossa irmã, que é serva da igreja que está em Cencreia”, o porto oriental de Corinto, a 11 km, e envia saudações de seu anfitrião Gaio e de “Erasto, o tesoureiro da cidade”, cujo nome aparece numa inscrição de calçamento achada em Corinto. Gálatas é situada em Antioquia por volta de 48 ou em Éfeso alguns anos depois."
    - "As cartas do cativeiro, Filipenses, Colossenses, Filemom e Efésios, falam de suas prisões, de “toda a guarda do palácio” e de “aqueles que são da casa de César”; a visão antiga as põe em Roma durante os dois anos de Atos 28, por volta de 60–62, e essa ainda é a mais comum, mas muitos estudiosos defendem Éfeso por volta de 54–55 ou Cesareia, onde Paulo ficou dois anos antes de seu apelo, pois Onésimo e os mensageiros viajam com tanta facilidade entre o apóstolo e o vale do Lico. Segunda Timóteo, se é de Paulo, foi escrita numa prisão romana perto do fim: “quando esteve em Roma, ele me procurou diligentemente”."
  de:
    - "Aus den Städten, in denen er am längsten blieb: Korinth, Ephesus und am Ende Rom. Der Kartenpunkt liegt auf Korinth, von wo der früheste Brief und der längste gesandt wurden. Nur wenige Briefe nennen ihren Abfassungsort ausdrücklich, die übrigen werden verortet, indem man ihre Andeutungen mit der Erzählung der Apostelgeschichte abgleicht, sodass manche der folgenden Antworten umstritten sind."
    - "Der 1. Thessalonicherbrief entstand um 50 n. Chr. in Korinth, bald nachdem Timotheus aus Thessalonich zurück war: „Da aber Silas und Timotheus aus Mazedonien kamen“, sagt die Apostelgeschichte. Der 1. Korintherbrief kam um 55 aus Ephesus: „Ich werde aber zu Ephesus bleiben bis Pfingsten.“ Der 2. Korintherbrief folgte später in jenem Jahr aus Mazedonien, nachdem Paulus von Troas übergesetzt war und Titus fand. Der Römerbrief entstand um 57 in Korinth, in den drei Monaten in Griechenland vor seiner letzten Jerusalemreise: Er empfiehlt „unsere Schwester Phöbe, welche ist im Dienste der Gemeinde zu Kenchreä“, Korinths Osthafen, 11 km entfernt, und grüßt von seinem Gastgeber Gajus und von „Erastus, der Stadt Rentmeister“, dessen Name auf einer Pflasterinschrift aus Korinth steht. Der Galaterbrief wird nach Antiochia um 48 oder nach Ephesus einige Jahre später gesetzt."
    - "Die Gefangenschaftsbriefe, Philipper, Kolosser, Philemon und Epheser, sprechen von den „Banden“ des Apostels, vom „ganzen Richthause“ und von denen, „die von des Kaisers Hause“ sind; die alte Ansicht setzt sie während der zwei Jahre von Apg 28 nach Rom, um 60–62, und das ist noch immer die häufigste, doch viele Gelehrte plädieren für Ephesus um 54–55 oder für Caesarea, wo Paulus vor seiner Berufung zwei Jahre lag, da Onesimus und die Boten so leicht zwischen dem Apostel und dem Lykostal reisen. Der 2. Timotheusbrief wurde, falls von Paulus selbst, gegen Ende aus einem römischen Gefängnis geschrieben: „da er zu Rom war, suchte er mich aufs fleißigste und fand mich.“"
  fr:
    - "Des villes où il séjourna le plus longtemps : Corinthe, Éphèse et, à la fin, Rome. Le point de la carte est sur Corinthe, d’où partirent la plus ancienne lettre et la plus longue. Peu de lettres nomment expressément leur lieu d’écriture, et les autres se situent en rapprochant leurs indices du récit des Actes, de sorte que certaines des réponses ci-dessous sont discutées."
    - "1 Thessaloniciens fut écrite à Corinthe vers 50 apr. J.-C., peu après le retour de Timothée : « quand Silas et Timothée furent arrivés de la Macédoine », disent les Actes. 1 Corinthiens vint d’Éphèse vers 55 : « Je resterai néanmoins à Éphèse jusqu’à la Pentecôte. » 2 Corinthiens suivit de Macédoine la même année, après que Paul eut quitté Troas et retrouvé Tite. Romains fut écrite à Corinthe vers 57, pendant les trois mois que Paul passa en Grèce avant son dernier voyage à Jérusalem : il recommande « Phœbé, notre sœur, qui est diaconesse de l’Église de Cenchrées », port oriental de Corinthe à 11 km, et transmet les salutations de son hôte Gaïus et d’« Éraste, le trésorier de la ville », dont le nom figure sur une inscription de pavement trouvée à Corinthe. Galates : soit Antioche vers 48, soit Éphèse quelques années plus tard."
    - "Les lettres de prison, aux Philippiens, aux Colossiens, à Philémon et aux Éphésiens, parlent d’être « dans les liens », de « tout le prétoire » et de « ceux de la maison de César » ; la vieille opinion les place à Rome pendant les deux ans d’Actes 28, vers 60–62, et c’est encore la plus courante, mais beaucoup de savants plaident pour Éphèse vers 54–55 ou pour Césarée, où Paul resta deux ans avant son appel, puisqu’Onésime et les messagers voyagent si aisément entre l’apôtre et la vallée du Lycos. La seconde lettre à Timothée, si elle est de Paul, fut écrite d’une prison romaine vers la fin : « lorsqu’il est venu à Rome, il m’a cherché avec beaucoup d’empressement »."
  pl:
    - "Z miast, w których przebywał najdłużej: Koryntu, Efezu i, na końcu, Rzymu. Punkt na mapie stoi w Koryncie, skąd wysłano najwcześniejszy list i najdłuższy. Tylko nieliczne listy wprost podają miejsce napisania, a resztę umieszcza się, dopasowując ich wskazówki do opowieści Dziejów, więc niektóre z poniższych odpowiedzi są sporne."
    - "Pierwszy List do Tesaloniczan napisano w Koryncie około 50 n.e., wkrótce po powrocie Tymoteusza z Tesaloniki: „A gdy przyszli z Macedonii Sylas i Tymoteusz”, jak mówią Dzieje. Pierwszy List do Koryntian pochodzi z Efezu około 55: „A zostanę w Efezie aż do Świątek.” Drugi List do Koryntian poszedł z Macedonii w tym samym roku, gdy Paweł przeprawił się z Troady i znalazł Tytusa. List do Rzymian napisano w Koryncie około 57, podczas trzech miesięcy, które Paweł spędził w Grecji przed ostatnią podróżą do Jerozolimy: poleca „Febę, siostrę naszę, która jest służebnicą zboru Kienchreeńskiego”, wschodniego portu Koryntu, 11 km dalej, i przekazuje pozdrowienia od swego gospodarza Gajusa i od „Erastus, szafarz miejski”, którego imię widnieje na napisie na bruku znalezionym w Koryncie. List do Galatów umieszcza się albo w Antiochii około 48, albo w Efezie kilka lat później."
    - "Listy z więzienia, do Filipian, Kolosan, Filemona i Efezjan, mówią: „związki moje dla Chrystusa rozgłoszone są po wszystkim pałacu cesarskim” i o tych, „którzy są z cesarskiego domu”; dawny pogląd umieszcza je w Rzymie w czasie dwóch lat z Dz 28, około 60–62, i jest to wciąż pogląd najczęstszy, ale wielu uczonych opowiada się za Efezem około 54–55 albo za Cezareą, gdzie Paweł przebywał dwa lata przed swoim odwołaniem się do cesarza, ponieważ Onezym i posłańcy tak łatwo podróżują między apostołem a doliną Likosu. Drugi List do Tymoteusza, jeśli jest Pawłowy, napisano z rzymskiego więzienia pod koniec: „Ale będąc w Rzymie, bardzo mię pilno szukał i znalazł.”"
  it:
    - "Dalle città dove si fermò più a lungo: Corinto, Efeso e, alla fine, Roma. Il punto della mappa sta a Corinto, da cui furono inviate la lettera più antica e la più lunga. Solo poche lettere nominano apertamente il luogo di scrittura, e le altre sono collocate confrontando i loro indizi con il racconto degli Atti, così alcune delle risposte seguenti sono discusse."
    - "La prima ai Tessalonicesi fu scritta a Corinto verso il 50 d.C., poco dopo il ritorno di Timoteo da Tessalonica: «quando Sila e Timoteo furon venuti dalla Macedonia», come dicono gli Atti di quel soggiorno. La prima ai Corinzi venne da Efeso verso il 55: «mi fermerò in Efeso fino alla Pentecoste». La seconda ai Corinzi seguì dalla Macedonia nello stesso anno, dopo che Paolo ebbe lasciato Troade e trovato Tito. Romani fu scritta a Corinto verso il 57, nei tre mesi trascorsi da Paolo in Grecia prima dell’ultimo viaggio a Gerusalemme: raccomanda «Febe, nostra sorella, che è diaconessa della chiesa di Cencrea», il porto orientale di Corinto, a 11 km, e manda i saluti del suo ospite Gaio e di «Erasto, il tesoriere della città», il cui nome compare su un’iscrizione di pavimentazione trovata a Corinto. Galati è posta o ad Antiochia verso il 48 o a Efeso pochi anni dopo."
    - "Le lettere dalla prigionia, Filippesi, Colossesi, Filemone ed Efesini, parlano di essere «in catene», di «tutta la guardia pretoriana» e di «quelli della casa di Cesare»; la vecchia opinione le colloca a Roma durante i due anni di Atti 28, verso il 60–62, ed è ancora la più comune, ma molti studiosi sostengono Efeso verso il 54–55 o Cesarea, dove Paolo restò due anni prima del suo appello, poiché Onesimo e i messaggeri viaggiano così facilmente tra l’apostolo e la valle del Lico. La seconda a Timoteo, se è di Paolo stesso, fu scritta da una prigione romana verso la fine: «quando è venuto a Roma, mi ha cercato premurosamente e m’ha trovato»."
  nl:
    - "Uit de steden waar hij het langst verbleef: Korinthe, Efeze en, aan het eind, Rome. Het punt op de kaart staat op Korinthe, vanwaar de vroegste en de langste brief werden gezonden. Slechts enkele brieven noemen hun schrijfplaats met zoveel woorden, en de rest wordt geplaatst door hun aanwijzingen te leggen naast het verhaal in Handelingen, dus sommige van de antwoorden hieronder zijn omstreden."
    - "1 Tessalonicenzen werd omstreeks 50 n.Chr. in Korinthe geschreven, kort na Timoteüs’ terugkeer uit Tessalonica: “als Silas en Timotheus van Macedonië afgekomen waren”, zegt Handelingen over Paulus’ verblijf daar. 1 Korinthiërs kwam omstreeks 55 uit Efeze: “ik zal te Efeze blijven tot den pinkster dag.” 2 Korinthiërs volgde later dat jaar uit Macedonië, nadat Paulus uit Troas was overgestoken en Titus vond. Romeinen werd omstreeks 57 in Korinthe geschreven, in de drie maanden in Griekenland vóór Paulus’ laatste reis naar Jeruzalem: hij beveelt “Febe, onze zuster, die een dienares is der Gemeente, die te Kenchreen is”, Korinthes oosthaven op 11 km, en brengt groeten van gastheer Gajus en van “Erastus, de rentmeester der stad”, wiens naam op een in Korinthe gevonden straatinscriptie staat. Galaten wordt in Antiochië (ca. 48) of in Efeze enkele jaren later geplaatst."
    - "De gevangenisbrieven, Filippenzen, Kolossenzen, Filemon en Efeziërs, spreken van “mijn banden”, van “het ganse rechthuis” en van “die van het huis des keizers”; de oude opvatting plaatst ze in Rome tijdens de twee jaar van Handelingen 28, omstreeks 60–62, en dat is nog steeds de gangbaarste, maar veel geleerden pleiten voor Efeze omstreeks 54–55 of voor Caesarea, waar Paulus twee jaar lag vóór zijn beroep, omdat Onesimus en de boodschappers zo gemakkelijk tussen de apostel en het Lycusdal reizen. 2 Timoteüs, indien van Paulus zelf, werd tegen het einde uit een Romeinse gevangenis geschreven: “als hij te Rome gekomen was, heeft hij mij zeer naarstiglijk gezocht, en heeft mij gevonden.”"
  cs:
    - "Z měst, kde pobýval nejdéle: z Korintu, Efezu a nakonec z Říma. Bod na mapě stojí na Korintu, odkud byl odeslán nejstarší list i nejdelší. Jen několik listů jmenuje místo napsání přímo a ostatní se umisťují srovnáním jejich narážek s příběhem ve Skutcích, takže některé z níže uvedených odpovědí jsou sporné."
    - "První list Tesalonickým byl napsán v Korintu asi 50 n. l., brzy poté, co se Timoteus vrátil z Tesalonik: „když přišli z Macedonie Sílas a Timoteus“, jak Skutky říkají o Pavlově pobytu tam. První list Korintským přišel z Efezu asi 55: „Zůstanuť pak v Efezu až do letnic.“ Druhý list Korintským následoval z Makedonie později téhož roku, poté, co Pavel přeplul z Troady a našel Tita. List Římanům byl psán v Korintu asi 57, během tří měsíců, které Pavel strávil v Řecku před poslední cestou do Jeruzaléma: doporučuje „Fében, sestru naši, služebnici církve Cenchrenské“, východní přístav Korintu vzdálený 11 km, a sděluje pozdravy od svého hostitele Gaia a od Erasta, „důchodního písaře městského“, jehož jméno se objevuje na dlažebním nápisu nalezeném v Korintu. List Galatským se klade buď do Antiochie asi 48, nebo do Efezu o několik let později."
    - "Listy z vězení, Filipským, Koloským, Filemonovi a Efezským, mluví o svých poutech („vězení mé“), o tom, že jsou známa „po všem císařském dvoře“, a o těch, „kteříž jsou z domu císařova“; starý názor je klade do Říma během dvou let ze Sk 28, asi 60–62, a to je stále nejběžnější, ale mnozí badatelé hájí Efez asi 54–55 nebo Cesareu, kde Pavel ležel dva roky před odvoláním, protože Onésimos a poslové tak snadno cestují mezi apoštolem a údolím Lykos. Druhý list Timoteovi, je-li Pavlův, byl napsán z římského vězení na konci: „přišed do Říma, pilně mne hledal, a nalezl.“"
  sv:
    - "Från de städer där han stannade längst: Korinth, Efesos och, mot slutet, Rom. Kartpunkten står på Korinth, varifrån det tidigaste brevet och det längsta skickades. Bara några brev nämner själva sin skrivplats, och de övriga placeras genom att deras antydningar jämförs med berättelsen i Apostlagärningarna, så några av svaren nedan är omstridda."
    - "Första Tessalonikerbrevet skrevs i Korinth ca 50 e.Kr., strax efter att Timoteus kommit tillbaka från Tessalonike: ”När sedan Silas och Timoteus kommo ditned från Macedonien”, som Apostlagärningarna säger om vistelsen där. Första Korinthierbrevet kom från Efesos ca 55: ”Men i Efesus vill jag stanna ända till pingst.” Andra Korinthierbrevet följde från Makedonien senare samma år, efter att Paulus gått över från Troas och träffat Titus. Romarbrevet skrevs i Korinth ca 57, under de tre månader Paulus tillbringade i Grekland före sista resan till Jerusalem: han anbefaller ”vår syster Febe, som är församlingstjänarinna i Kenkrea”, Korinths östra hamn 11 km bort, och framför hälsningar från sin värd Gaius och från ”Erastus, stadens kamrerare”, vars namn står på en stenläggningsinskription i Korinth. Galaterbrevet placeras i Antiochia ca 48 eller i Efesos några år senare."
    - "Fängelsebreven, Filipperbrevet, Kolosserbrevet, Filemonbrevet och Efesierbrevet, talar om ”mina bojor”, om ”alla i pretoriet” och om ”de som höra till kejsarens hus”; den gamla uppfattningen förlägger dem till Rom under de två åren i Apg 28, omkring 60–62, och den är fortfarande den vanligaste, men många forskare argumenterar för Efesos omkring 54–55 eller för Caesarea, där Paulus låg i två år före sin appell, eftersom Onesimos och budbärarna reser så lätt mellan aposteln och Lykosdalen. Andra Timoteusbrevet, om det är Paulus eget, skrevs från ett romerskt fängelse nära slutet: ”när han kom till Rom, sökte han efter mig med all iver, till dess han fann mig.”"
  nb:
    - "Fra byene der han ble lengst: Korint, Efesos og til slutt Roma. Kartpunktet står på Korint, hvorfra det tidligste brevet og det lengste ble sendt. Bare noen få brev oppgir uttrykkelig skrivestedet, og resten plasseres ved å sammenholde hintene med fortellingen i Apostlenes gjerninger, så noen av svarene nedenfor er omstridt."
    - "1 Tessalonikerbrev ble skrevet i Korint omkring 50 e.Kr., like etter at Timoteus var kommet tilbake fra Tessalonika: «Da nu Silas og Timoteus kom ned fra Makedonia», som Apostlenes gjerninger sier om Paulus' opphold der. 1 Korinterbrev kom fra Efesos omkring 55: «I Efesus blir jeg inntil pinsen.» 2 Korinterbrev fulgte fra Makedonia samme år, etter at Paulus hadde krysset fra Troas og funnet Titus. Romerbrevet ble skrevet i Korint omkring 57, i de tre månedene Paulus tilbrakte i Hellas før sin siste reise til Jerusalem: han anbefaler «Føbe, vår søster, som er menighets-tjenerinne i Kenkreæ», Korints østlige havn 11 km unna, og sender hilsener fra sin vert Gaius og fra «Erastus, byens regnskapsfører», hvis navn står på en innskrift i brolegningen funnet i Korint. Galaterbrevet settes enten til Antiokia omkring 48 eller til Efesos noen år senere."
    - "Brevene fra fengselet, Filipperbrevet, Kolosserbrevet, Filemon og Efeserbrevet, taler om å være «i lenker», om «hele livvakten» og om «de som hører til keiserens hus»; det gamle synet plasserer dem i Roma i de to årene i Apg 28, omkring 60–62, og det er fortsatt det vanligste, men mange forskere argumenterer for Efesos omkring 54–55 eller for Cæsarea, der Paulus satt to år før sin appell, siden Onesimos og budbringerne reiser så lett mellom apostelen og Lykosdalen. 2 Timoteusbrev, hvis det er Paulus' eget, ble skrevet fra et romersk fengsel nær slutten: «da han var kommet til Rom, søkte han med stor iver efter mig og fant mig.»"
  tl:
    - "Mula sa mga lungsod na pinakamatagal niyang tinirhan: Corinto, Efeso at, sa wakas, Roma. Ang tuldok sa mapa ay nasa Corinto, kung saan ipinadala ang pinakamaagang liham at ang pinakamahaba. Kakaunting liham lamang ang tahasang nagpapangalan ng lugar ng pagsulat, at ang iba ay inilalagay sa pamamagitan ng pagtutugma ng kanilang mga pahiwatig sa salaysay ng Mga Gawa, kaya pinagtatalunan ang ilan sa mga sagot sa ibaba."
    - "Isinulat ang 1 Tesalonica sa Corinto noong mga 50 AD, di-nagtagal pagkabalik ni Timoteo mula sa Tesalonica: “nang si Silas at si Timoteo ay magsilusong mula sa Macedonia”, gaya sa Mga Gawa. Ang 1 Corinto: Efeso, mga 55: “ako'y titigil sa Efeso hanggang sa Pentecostes.” Ang 2 Corinto: Macedonia, nang taon ding iyon, pagkatawid ni Pablo mula sa Troas at pagkakita kay Tito. Ang Mga Taga-Roma: Corinto, mga 57, sa tatlong buwan niya sa Grecia bago ang huling paglalakbay sa Jerusalem; ipinagtatagubilin niya si “Febe na ating kapatid na babae, na lingkod sa iglesia na nasa Cencrea”, daungan ng Corinto sa silangan, 11 km ang layo, at mga bati mula sa punong-abala niyang si Gayo at mula kay “Erasto na ingat-yaman ng bayan”, na ang pangalan ay nasa inskripsiyon sa sahig na bato na natagpuan sa Corinto. Ang Mga Taga-Galacia: Antioquia, mga 48, o Efeso pagkaraan ng ilang taon."
    - "Ang mga liham mula sa bilangguan, Mga Taga-Filipos, Mga Taga-Colosas, kay Filemon at Mga Taga-Efeso, ay nagsasalita ng “aking mga tanikala”, ng “lahat ng mga bantay ng pretorio” at ng “mga kasangbahay ni Cesar”; inilalagay sila ng lumang pananaw sa Roma sa dalawang taon ng Mga Gawa 28, mga 60–62, at iyon pa rin ang pinakakaraniwan, ngunit maraming iskolar ang nangangatwiran para sa Efeso noong mga 54–55 o para sa Cesarea, kung saan nakabilanggo si Pablo nang dalawang taon bago ang kaniyang paghahabol, yamang madaling naglalakbay sina Onesimo at ang mga sugo sa pagitan ng apostol at ng libis ng Lyco. Ang 2 Timoteo, kung kay Pablo mismo, ay isinulat mula sa bilangguang Romano malapit sa wakas: “nang siya'y nasa Roma, ay hinanap niya ako ng buong sikap.”"
  da:
    - "Fra de byer, hvor han blev længst: Korinth, Efesos og til sidst Rom. Kortets punkt står på Korinth, hvorfra det tidligste brev og det længste blev sendt. Kun få breve nævner direkte deres skrivested, og resten placeres ved at sammenholde deres antydninger med beretningen i Apostlenes Gerninger, så nogle af svarene nedenfor er omstridte."
    - "Første Thessalonikerbrev blev skrevet i Korinth omkring 50 e.Kr., kort efter at Timotheus var vendt tilbage fra Thessalonika: »da Silas og Timotheus kom ned fra Makedonien«, som Apostlenes Gerninger siger om Paulus' ophold dér. Første Korinterbrev kom fra Efesos omkring 55: »i Efesus vil jeg forblive indtil Pinsen«. Andet Korinterbrev fulgte fra Makedonien samme år, efter at Paulus var kommet over fra Troas og havde fundet Titus. Romerbrevet blev skrevet i Korinth omkring 57, i de tre måneder, Paulus var i Grækenland før sin sidste rejse til Jerusalem: han anbefaler »Føbe, vor Søster, som er Tjenerinde ved Menigheden i Kenkreæ«, Korinths østhavn 11 km væk, og sender hilsner fra værten Gajus og fra »Erastus, Stadens Rentemester«, hvis navn står på en brolægningsindskrift fra Korinth. Galaterbrevet placeres enten i Antiokia omkring 48 eller i Efesos nogle år senere."
    - "Fængselsbrevene, Filipperbrevet, Kolossenserbrevet, Filemon og Efeserbrevet, taler om »mine Lænker«, om »hele Livvagten« og om »de af Kejserens Hus«; det gamle synspunkt placerer dem i Rom under de to år i ApG 28, omkring 60–62, og det er stadig det mest almindelige, men mange forskere argumenterer for Efesos omkring 54–55 eller for Cæsarea, hvor Paulus lå to år før sin appel, da Onesimus og budbringerne rejser så let mellem apostlen og Lykos-dalen. Andet Timotheusbrev, hvis det er Paulus' eget, blev skrevet fra et romersk fængsel nær enden: »da han kom til Rom, søgte han ivrigt efter mig og fandt mig.«"
  sr:
    - "Из градова у којима се најдуже задржао: Коринта, Ефеса и, на крају, Рима. Тачка на карти стоји на Коринту, одакле су послате најранија и најдужа посланица. Само неколико посланица изричито именује место писања, а остале се смештају упоређивањем њихових наговештаја с причом у Делима, па су неки од одговора испод спорни."
    - "Прва посланица Солуњанима писана је у Коринту око 50. н. е., убрзо пошто се Тимотије вратио из Солуна: „И кад сиђоше из Македоније Сила и Тимотије“, као што Дела кажу о Павловом боравку тамо. Прва посланица Коринћанима стигла је из Ефеса око 55: „А у Ефесу ћу остати до Тројичина дне“. Друга посланица Коринћанима уследила је из Македоније касније те године, пошто је Павле прешао из Троаде и нашао Тита. Посланица Римљанима писана је у Коринту око 57, током три месеца која је Павле провео у Грчкој пре последњег путовања у Јерусалим: препоручује „Фиву сестру нашу, која је слушкиња код цркве у Кенхреји“, источној луци Коринта удаљеној 11 км, и шаље поздраве од свог домаћина Гаја и од Ераста, градског благајника, чије се име појављује на плочнику са натписом пронађеном у Коринту. Посланица Галатима смешта се или у Антиохију око 48. или у Ефес неколико година касније."
    - "Посланице из затвора, Филипљанима, Колошанима, Филимону и Ефесцима, говоре о оковима („да су моји окови за Христа“), о „свој судници“ и о онима „који су из дома Ћесаревог“; старо гледиште смешта их у Рим током две године из Дела 28, око 60–62, и то је и даље најчешће, али многи научници заступају Ефес око 54–55 или Цезареју, где је Павле лежао две године пре жалбе, пошто Онисим и гласници тако лако путују између апостола и долине Лика. Друга посланица Тимотију, ако је Павлова, писана је из римског затвора при крају: „дошавши у Рим потражи ме још с већим старањем и нађе“."
  hu:
    - "Azokból a városokból, ahol a legtovább tartózkodott: Korinthusból, Efezusból és a végén Rómából. A térképi pont Korinthuson áll, ahonnan a legkorábbi és a leghosszabb levelet küldték. Csak kevés levél nevezi meg kifejezetten az írás helyét, a többit az utalások és az ApCsel története egybevetésével helyezik el, így az alábbi válaszok egy része vitatott."
    - "Az 1Thessz Korinthusban íródott Kr. u. 50 körül, nem sokkal azután, hogy Timóteus visszatért Thesszalonikából: „Mikor pedig megérkeztek Maczedóniából Silás és Timótheus”, ahogy az ApCsel mondja Pál ottani tartózkodásáról. Az 1Kor Efezusból jött 55 körül: „Efézusban pedig pünkösdig maradok.” A 2Kor még abban az évben követte Makedóniából, miután Pál átkelt Troászból és megtalálta Titust. A Róm Korinthusban íródott 57 körül, abban a három hónapban, amelyet Pál Görögországban töltött utolsó jeruzsálemi útja előtt: ajánlja „Fébét, a mi nénénket, ki a Kenkhréabeli gyülekezetnek szolgálója”, Korinthus 11 km-re lévő keleti kikötőjéből, és köszönti vendéglátója, Gájusz, és „Erástus a városnak kincstartója”, akinek neve a Korinthusban talált kövezetfeliraton szerepel. A Gal vagy Antiókhiába teszik 48 körül, vagy Efezusba néhány évvel később."
    - "A börtönlevelek, a Filippi, a Kolossé, Filemon és az Efézus levele Pál fogságáról szólnak: „a Krisztusban híressé lett az én fogságom a testőrség egész házában”, és a szentek üdvözletéről, „mindeneknek felette pedig a császár udvarából valók”; a régi nézet Rómába teszi őket az ApCsel 28 két évére, mintegy 60–62-re, és ez ma is a leggyakoribb, de sok kutató Efezus mellett érvel, mintegy 54–55-re, vagy Cézárea mellett, ahol Pál két évig feküdt a fellebbezése előtt, mivel Onézimusz és a hírvivők olyan könnyen járnak az apostol és a Lükosz völgye között. A 2Tim, ha Pálé, egy római börtönből íródott a vége felé: „mikor Rómában volt, buzgón keresett engem, meg is talált.”"
  fi:
    - "Niistä kaupungeista, joissa hän viipyi pisimpään: Korintista, Efesoksesta ja lopuksi Roomasta. Kartan piste on Korintissa, josta lähetettiin varhaisin kirje ja pisin. Vain muutama kirje nimeää kirjoituspaikkansa suoraan, ja loput sijoitetaan vertaamalla niiden vihjeitä Apostolien tekojen kertomukseen, joten jotkin alla olevista vastauksista ovat kiistanalaisia."
    - "1. Tessalonikalaiskirje kirjoitettiin Korintissa noin 50 jaa., pian Timoteuksen palattua Tessalonikasta: ”Ja kun Silas ja Timoteus tulivat Makedoniasta”, sanoo Apostolien teot Paavalin oleskelusta siellä. 1. Korinttolaiskirje tuli Efesoksesta noin 55: ”Efesossa minä viivyn helluntaihin saakka.” 2. Korinttolaiskirje seurasi Makedoniasta samana vuonna, Paavalin ylitettyä Troaksesta ja löydettyä Tituksen. Roomalaiskirje kirjoitettiin Korintissa noin 57 Paavalin kolmen Kreikan-kuukauden aikana ennen viimeistä Jerusalemin-matkaa: hän suosittelee ”sisaremme Foiben, joka on Kenkrean seurakunnan palvelija”, Korintin itäisen sataman 11 km:n päässä, ja tervehtivät isäntä Gaius ja ”Erastus, kaupungin rahainhoitaja”, jonka nimi on Korintista löydetyssä katukiveyksen kirjoituksessa. Galatalaiskirje sijoitetaan joko Antiokiaan noin 48 tai Efesokseen muutamaa vuotta myöhemmin."
    - "Vankilakirjeet, Filippiläis-, Kolossalais-, Filemonin ja Efesolaiskirje, puhuvat Paavalin kahleista, jotka ovat tulleet ”koko henkivartioston … tietoon”, ja tervehdyksistä, ”varsinkin ne, jotka ovat keisarin huoneväkeä”; vanha näkemys sijoittaa ne Roomaan Ap. t. 28:n kahden vuoden ajalle, noin 60–62, ja se on yhä yleisin, mutta monet tutkijat puolustavat Efesosta noin 54–55 tai Kesareaa, jossa Paavali oli kaksi vuotta ennen vetoomustaan, koska Onesimos ja sanansaattajat kulkevat niin helposti apostolin ja Lykoksen laakson välillä. 2. Timoteuskirje, jos se on Paavalin oma, kirjoitettiin roomalaisesta vankilasta lähellä loppua: ”kun hän tuli Roomaan, etsi hän minua innokkaasti”."
  vi:
    - "Từ những thành ông ở lâu nhất: Cô-rinh-tô, Ê-phê-sô và, cuối cùng, Rô-ma. Điểm bản đồ đứng tại Cô-rinh-tô, nơi gửi đi bức thư sớm nhất và bức dài nhất. Chỉ một vài thư nêu thẳng nơi viết, còn lại được xác định bằng cách khớp các gợi ý với câu chuyện trong Công vụ, nên một số đáp án dưới đây còn tranh luận."
    - "1 Tê-sa-lô-ni-ca được viết tại Cô-rinh-tô khoảng năm 50, ngay sau khi Ti-mô-thê từ Tê-sa-lô-ni-ca trở lại: “Khi Si-la và Ti-mô-thê từ xứ Ma-xê-đoan đến”, như Công vụ nói về thời gian Phao-lô ở đó. 1 Cô-rinh-tô đến từ Ê-phê-sô khoảng năm 55: “Nhưng tôi sẽ ở lại thành Ê-phê-sô cho đến lễ Ngũ tuần.” 2 Cô-rinh-tô tiếp theo từ Ma-xê-đoan cuối năm ấy, sau khi Phao-lô từ Trô-ách sang và gặp Tít. Rô-ma được viết tại Cô-rinh-tô khoảng năm 57, trong ba tháng Phao-lô ở Hy Lạp trước chuyến đi cuối cùng đến Giê-ru-sa-lem: ông gởi gắm “Phê-bê, người chị em chúng ta … người làm nữ chấp sự của Hội thánh Xen-cơ-rê”, cảng đông của Cô-rinh-tô cách 11 km, và gởi lời chào của chủ nhà Gai-út và của “Ê-rát, quan kho bạc thành phố”, tên ông xuất hiện trên một bia lát đường tìm thấy tại Cô-rinh-tô. Ga-la-ti được đặt hoặc tại An-ti-ốt khoảng năm 48 hoặc tại Ê-phê-sô vài năm sau."
    - "Các thư từ nhà tù, Phi-líp, Cô-lô-se, Phi-lê-môn và Ê-phê-sô, nói về “xiềng xích”, về “chốn công đường” và về “người nhà Sê-sa”; quan điểm cổ đặt chúng ở Rô-ma trong hai năm của Công vụ 28, khoảng năm 60–62, và đó vẫn là quan điểm phổ biến nhất, nhưng nhiều học giả lập luận cho Ê-phê-sô khoảng năm 54–55 hoặc cho Sê-sa-rê, nơi Phao-lô bị giam hai năm trước khi kháng cáo, vì Ô-nê-sim và các sứ giả đi lại dễ dàng giữa sứ đồ và thung lũng Lycus. 2 Ti-mô-thê, nếu là của chính Phao-lô, được viết từ nhà tù ở Rô-ma gần cuối đời: “khi người vừa đến thành Rô-ma, đã vội vả kiếm ta, và kiếm được.”"
  ro:
    - "Din orașele unde a stat cel mai mult: Corint, Efes și, la sfârșit, Roma. Punctul de pe hartă stă pe Corint, de unde au fost trimise cea mai veche epistolă și cea mai lungă. Doar câteva epistole își numesc direct locul scrierii, iar celelalte sunt așezate potrivind indiciile lor cu povestirea din Faptele Apostolilor, așa că unele dintre răspunsurile de mai jos sunt disputate."
    - "Prima către Tesaloniceni a fost scrisă la Corint, circa 50 d.Hr., curând după ce Timotei se întorsese din Tesalonic: „dacă s’au pogorît dela Machedonia Sila și Timotei”, spun Faptele. Prima către Corinteni a venit de la Efes, circa 55: „Și voiu rămâneà în Efes până la praznicul a cincizeci de zile.” A doua către Corinteni a urmat din Macedonia, în același an, după ce Pavel trecuse din Troa și îl găsise pe Tit. Romanilor le-a scris la Corint, circa 57, în cele trei luni din Grecia dinainte de ultima călătorie la Ierusalim: o recomandă pe „Fivi sora noastră, care este slujitoare bisericei din Cheghrees”, portul de est al Corintului, la 11 km, și trimite salutări de la gazda sa Gaiu și de la „Erast dregătorul cetăței”, al cărui nume apare pe o inscripție de pavaj de la Corint. Epistola către Galateni este pusă fie la Antiohia, circa 48, fie la Efes, câțiva ani mai târziu."
    - "Epistolele din închisoare, către Filipeni, Coloseni, Filimon și Efeseni, vorbesc despre „legăturile mele”, despre „tot divanul” și despre „cei din casa Chesarului”; vechea părere le așază la Roma, în cei doi ani din Faptele 28, circa 60–62, și rămâne cea mai răspândită, dar mulți cercetători susțin Efesul, circa 54–55, sau Cezareea, unde Pavel a stat doi ani înainte de apelul său, fiindcă Onesim și mesagerii călătoresc atât de ușor între apostol și valea Lycus. A doua către Timotei, dacă este a lui Pavel, a fost scrisă dintr-o închisoare romană, aproape de sfârșit: „venind în Roma, mai cu osârdie m’a căutat și m’a aflat.”"
  bg:
    - "От градовете, където оставал най-дълго: Коринт, Ефес и накрая Рим. Точката на картата стои на Коринт, откъдето били изпратени най-ранното и най-дългото послание. Само няколко послания назовават направо мястото си на писане, а останалите се локализират, като намеците в тях се съпоставят с разказа в Деяния, така че някои от отговорите по-долу са спорни."
    - "1 Солунци е писано в Коринт около 50 г. н.е., скоро след като Тимотей се върнал от Солун: „когато слезоха от Македония Сила и Тимотей“, както казват Деяния за престоя на Павел там. 1 Коринтяни дошло от Ефес около 55 г.: „в Ефес ще се бавя до Петдесетницата“. 2 Коринтяни последвало от Македония по-късно същата година, след като Павел преминал от Троада и намерил Тит. Римляни е писано в Коринт около 57 г., през трите месеца, които Павел прекарал в Гърция преди последното си пътуване до Йерусалим: той препоръчва „Фива сестрата наша, която е служителница на църквата в Кенхрея“, източното пристанище на Коринт на 11 км, и праща поздрави от домакина си Гай и от „Ераст строителът градски“, чието име се появява в надпис върху настилка, открит в Коринт. Галатяни се поставя или в Антиохия около 48 г., или в Ефес няколко години по-късно."
    - "Посланията от затвора — Филипяни, Колосяни, Филимон и Ефесяни — говорят за „моите за Христа окови“, за „всичката претория“ и за онези, „които са от Кесаревия дом“; старото мнение ги поставя в Рим през двете години от Деян. 28, около 60–62 г., и то още е най-разпространено, но много учени защитават Ефес около 54–55 г. или Кесария, където Павел лежал две години преди обжалването си, понеже Онисим и пратениците пътуват така лесно между апостола и долината на Лик. Второто послание към Тимотей, ако е на самия Павел, е писано от римски затвор към края: „когато дойде в Рим потърси ме с по-големо старание и намери ме.“"
