id: where-did-ruth-come-from
question:
  en: "Where did Ruth come from?"
  ru: "Откуда была родом Руфь?"
  uk: "Звідки була Рут?"
  es: "¿De dónde venía Rut?"
  pt: "De onde veio Rute?"
  de: "Woher stammte Rut?"
  fr: "D’où venait Ruth ?"
answer:
  en:
    - "Ruth was a Moabite, from the country of Moab: the high tableland east of the Dead Sea in today's Jordan, between the gorge of the Arnon and the brook Zered, with the plain to the north, up to Heshbon, held by Moab in some periods. The map point for Moab stands at Kerak, the old Kir-hareseth, about 75 km south-east of Bethlehem in a straight line; on foot the way went round the north end of the Dead Sea, by Jericho and the fords of the Jordan, and up onto the plateau. The book never names Ruth's town, only “the country of Moab”, which the Russian Synodal translation renders as the fields of Moab."
    - "In a famine “a certain man of Beth-lehem-judah went to sojourn in the country of Moab”, with his wife Naomi and two sons, who “took them wives of the women of Moab; the name of the one was Orpah, and the name of the other Ruth”. When all three men had died, Ruth would not go home: “whither thou goest, I will go; and where thou lodgest, I will lodge: thy people shall be my people, and thy God my God”. She came to Bethlehem as “Ruth the Moabitess”, gleaned in the field of Boaz and married him, and her son Obed “is the father of Jesse, the father of David”. Later David, hunted by Saul, brought his father and mother to the king of Moab, perhaps trusting this kinship; Matthew names Ruth among the four women in the genealogy of Jesus."
    - "Her origin was a question in itself, for the law said: “An Ammonite or Moabite shall not enter into the congregation of the LORD”. The rabbis answered that the ban meant Moabite men, not women, and made Ruth a descendant of Eglon, king of Moab. When the book was written is debated: many date it to the monarchy, for its interest in David's line, while others read it as a gentle answer, after the exile, to Ezra and Nehemiah's dismissal of foreign wives. The story is set “in the days when the judges ruled”, whose dates are themselves disputed; the map uses 1100 BC as a conventional point."
  ru:
    - "Руфь была моавитянка, из земли Моава: высокого плато к востоку от Мёртвого моря, в нынешней Иордании, между ущельем Арнона и долиной Заред, а равнина к северу, до Есевона, в иные времена тоже принадлежала Моаву. Точка карты для Моава стоит в Кераке, древнем Кирхарешете, примерно в 75 км к юго-востоку от Вифлеема по прямой; пешком путь шёл вокруг северного края Мёртвого моря, через Иерихон и броды Иордана, и вверх на плато. Город Руфи книга не называет — только «поля Моавитские», как передаёт Синодальный перевод; в английской Библии это страна Моава."
    - "Во время голода «пошел один человек из Вифлеема Иудейского со своею женою и двумя сыновьями своими жить на полях Моавитских», и сыновья «взяли себе жен из Моавитянок, имя одной Орфа, а имя другой Руфь». Когда все трое мужчин умерли, Руфь не вернулась домой: «куда ты пойдешь, туда и я пойду, и где ты жить будешь, там и я буду жить; народ твой будет моим народом, и твой Бог — моим Богом». В Вифлеем она пришла как «Руфь Моавитянка», подбирала колосья на поле Вооза и вышла за него замуж, а её сын Овид — «отец Иессея, отца Давидова». Позже Давид, спасаясь от Саула, привёл отца и мать к царю Моавитскому — быть может, полагаясь на это родство; Матфей называет Руфь среди четырёх женщин в родословии Иисуса."
    - "Само её происхождение было вопросом, ведь закон говорил: «Аммонитянин и Моавитянин не может войти в общество Господне». Раввины отвечали, что запрет касался мужчин-моавитян, а не женщин, и считали Руфь потомком Еглона, царя Моавитского. Когда написана книга, спорят: многие относят её ко времени царей, раз она занята родом Давида, другие читают её как мягкий ответ послепленного времени на то, что Ездра и Неемия отсылали чужеземных жён. Действие происходит «в те дни, когда управляли судьи», даты которых тоже спорны; карта берёт условный 1100 г. до н. э."
  uk:
    - "Рут була моавитянкою, з країни Моав: високого плоскогір'я на схід від Мертвого моря в нинішній Йорданії, між ущелиною Арнон і потоком Заред, з рівниною на півночі, аж до Гесбона, яку Моав тримав у деякі періоди. Точка мапи для Моаву стоїть у Кераку, давньому Кір-Харешеті, приблизно за 75 км на південний схід від Вифлеєму по прямій; пішки дорога йшла в обхід північного краю Мертвого моря, через Єрихон і броди Йордану, і вгору на плато. Книга ніколи не називає міста Рут, лише «край Моабіїв», який російський Синодальний переклад віддає як поля Моава."
    - "Під час голоду «один чоловік з Юдейського Вефлеєма пійшов … жити в край Моабіїв» зі своєю дружиною Ноемі й двома синами, які «одружились … з Моабитянками: одна на ймя Орфа, а другу звали Рут». Коли троє чоловіків померли, Рут не схотіла повертатися додому: «куди підеш ти, туди й я піду, і де жити меш ти, там і я жити му; твій народ буде моїм народом, і твій Бог моїм Богом». Вона прийшла до Вифлеєму як «Рут, Моабитянка», збирала колосся на полі Вооза й вийшла за нього, а її син Овед — «батько Ессея, батька Давидового». Пізніше Давид, переслідуваний Саулом, привів свого батька й матір до царя Моаву, можливо, довіряючи цій спорідненості; Матвій називає Рут серед чотирьох жінок у родоводі Ісуса."
    - "Її походження було питанням саме по собі, бо закон казав: «Не ввійде Амонїй і Моабій у громаду Господню». Рабини відповіли, що заборона стосувалася моавитян-чоловіків, а не жінок, і зробили Рут нащадком Еглона, царя Моаву. Коли було написано книгу, обговорюється: багато хто датує її монархією, через її інтерес до роду Давида, інші читають її як лагідну відповідь, після вигнання, на відсилання іноземних дружин Ездрою та Неемією. Історія відбувається «За тих часів, як правували суддї», чиї дати самі спірні; мапа використовує 1100 р. до н. е. як умовну точку."
  es:
    - "Rut era moabita, del país de Moab: la alta meseta al este del mar Muerto, en la actual Jordania, entre el cañón del Arnón y el arroyo de Zered, con la llanura al norte, hasta Hesbón, que Moab dominó en algunos períodos. El punto del mapa para Moab está en Kerak, la antigua Kir-hareset, a unos 75 km al sureste de Belén en línea recta; a pie, el camino rodeaba el extremo norte del mar Muerto, por Jericó y los vados del Jordán, y subía a la meseta. El libro nunca nombra la ciudad de Rut, solo «los campos de Moab», que es también como lo vierte la traducción sinodal rusa."
    - "En una hambruna «un varón de Beth-lehem de Judá, fué á peregrinar en los campos de Moab», con su mujer Noemí y dos hijos, que «tomaron para sí mujeres de Moab, el nombre de la una Orpha, y el nombre de la otra Ruth». Cuando murieron los tres hombres, Rut no quiso volver a casa: «donde quiera que tú fueres, iré yo; y donde quiera que vivieres, viviré. Tu pueblo será mi pueblo, y tu Dios mi Dios». Llegó a Belén como «Ruth Moabita», espigó en el campo de Booz y se casó con él, y su hijo Obed «es padre de Isaí, padre de David». Más tarde David, perseguido por Saúl, llevó a su padre y a su madre al rey de Moab, quizá confiando en este parentesco; Mateo nombra a Rut entre las cuatro mujeres de la genealogía de Jesús."
    - "Su origen era una cuestión en sí misma, pues la ley decía: «No entrará Ammonita ni Moabita en la congregación de Jehová». Los rabinos respondieron que la prohibición se refería a los moabitas varones, no a las mujeres, e hicieron de Rut una descendiente de Eglón, rey de Moab. Cuándo se escribió el libro es debatido: muchos lo fechan en la monarquía, por su interés en el linaje de David, mientras que otros lo leen como una respuesta suave, después del exilio, a la expulsión de las mujeres extranjeras por Esdras y Nehemías. La historia se sitúa «en los días que gobernaban los jueces», cuyas fechas son a su vez discutidas; el mapa usa el 1100 a. C. como punto convencional."
  pt:
    - "Rute era moabita, do país de Moabe: o alto planalto a leste do mar Morto, na Jordânia de hoje, entre a garganta do Arnom e o ribeiro de Zerede, com a planície ao norte, até Hesbom, que Moabe controlou em alguns períodos. O ponto do mapa para Moabe está em Kerak, a antiga Quir-Haresete, a cerca de 75 km a sudeste de Belém em linha reta; a pé o caminho contornava a ponta norte do mar Morto, por Jericó e os vaus do Jordão, e subia ao planalto. O livro nunca nomeia a cidade de Rute, só “as terras de Moabe”, que a tradução sinodal russa verte por campos de Moabe."
    - "Numa fome, “um certo homem de Belém de Judá foi viver nas terras de Moabe”, com sua mulher Noemi e dois filhos, que “tomaram para si mulheres moabitas. O nome de uma era Orfa, e o nome da outra era Rute”. Quando os três homens morreram, Rute não quis voltar para casa: “aonde quer que você for, eu irei; e onde quer que você ficar, eu ficarei. O seu povo será o meu povo, e o seu Deus o meu Deus”. Chegou a Belém como “Rute, a moabita”, respigou no campo de Boaz e casou com ele, e seu filho Obede “é o pai de Jessé, o pai de Davi”. Mais tarde Davi, perseguido por Saul, levou o pai e a mãe ao rei de Moabe, talvez confiando nesse parentesco; Mateus nomeia Rute entre as quatro mulheres da genealogia de Jesus."
    - "Sua origem era um problema em si, pois a lei dizia: “Um amonita ou um moabita não entrará na assembleia do SENHOR”. Os rabinos responderam que a proibição valia para os moabitas homens, não para as mulheres, e fizeram de Rute descendente de Eglom, rei de Moabe. Quando o livro foi escrito é debatido: muitos o datam da monarquia, pelo interesse na linhagem de Davi, enquanto outros o leem como resposta suave, após o exílio, à expulsão das esposas estrangeiras por Esdras e Neemias. A história se passa “nos dias em que os juízes julgavam”, cujas datas são elas mesmas disputadas; o mapa usa 1100 a.C. como ponto convencional."
  de:
    - "Rut war Moabiterin, aus dem Land Moab: dem hohen Tafelland östlich des Toten Meeres im heutigen Jordanien, zwischen der Schlucht des Arnon und dem Bach Sered, mit der Ebene im Norden bis Heschbon, die Moab zeitweise hielt. Der Kartenpunkt für Moab liegt bei Kerak, dem alten Kir-Heres, in der Luftlinie etwa 75 km südöstlich von Bethlehem; zu Fuß führte der Weg um das Nordende des Toten Meeres, über Jericho und die Jordanfurten und hinauf auf das Plateau. Das Buch nennt nie Ruts Stadt, nur „der Moabiter Land“, was die russische Synodalübersetzung mit den Gefilden Moabs wiedergibt."
    - "In einer Hungersnot „ein Mann von Bethlehem-Juda zog wallen in der Moabiter Land“ mit seiner Frau Naemi und zwei Söhnen, die „moabitische Weiber“ nahmen: „eine hieß Orpa, die andere Ruth“. Als alle drei Männer gestorben waren, wollte Rut nicht heimkehren: „Wo du hin gehst, da will ich auch hin gehen; wo du bleibst, da bleibe ich auch. Dein Volk ist mein Volk, und dein Gott ist mein Gott.“ Sie kam als „Ruth, der Moabitin“ nach Bethlehem, las auf dem Feld des Boas Ähren und heiratete ihn, und ihr Sohn Obed „ist der Vater Isais, welcher ist Davids Vater“. Später brachte David auf der Flucht vor Saul seinen Vater und seine Mutter zum König von Moab, vielleicht im Vertrauen auf diese Verwandtschaft; Matthäus nennt Rut unter den vier Frauen im Stammbaum Jesu."
    - "Ihre Herkunft war eine eigene Frage, denn das Gesetz sagte: „Die Ammoniter und Moabiter sollen nicht in die Gemeinde des HERRN kommen“. Die Rabbinen antworteten, das Verbot gelte moabitischen Männern, nicht Frauen, und machten Rut zur Nachfahrin Eglons, des Königs von Moab. Wann das Buch entstand, ist umstritten: Viele datieren es in die Königszeit wegen seines Interesses an Davids Linie, andere lesen es als sanfte Antwort der Zeit nach dem Exil auf die Entlassung der fremden Frauen durch Esra und Nehemia. Die Geschichte spielt „zu der Zeit, da die Richter regierten“, deren Daten selbst umstritten sind; die Karte verwendet 1100 v. Chr. als herkömmlichen Punkt."
  fr:
    - "Ruth était moabite, du pays de Moab : le haut plateau à l’est de la mer Morte, dans la Jordanie actuelle, entre la gorge de l’Arnon et le torrent de Zéred, la plaine du nord, jusqu’à Hesbon, étant tenue par Moab à certaines périodes. Le point de la carte pour Moab est à Kérak, l’ancienne Kir-Haréseth, à environ 75 km au sud-est de Bethléem en ligne droite ; à pied, la route contournait l’extrémité nord de la mer Morte, par Jéricho et les gués du Jourdain, puis montait sur le plateau. Le livre ne nomme jamais la ville de Ruth, seulement « le pays de Moab », que la traduction synodale russe rend par les champs de Moab."
    - "Pendant une famine, « un homme de Bethléhem de Juda partit, avec sa femme et ses deux fils, pour faire un séjour dans le pays de Moab » ; la femme était Naomi, et les fils « prirent des femmes Moabites, dont l’une se nommait Orpa, et l’autre Ruth ». Quand les trois hommes furent morts, Ruth ne voulut pas rentrer chez elle : « Où tu iras j’irai, où tu demeureras je demeurerai ; ton peuple sera mon peuple, et ton Dieu sera mon Dieu. » Elle vint à Bethléhem comme « Ruth la Moabite », glana dans le champ de Boaz et l’épousa, et son fils Obed « fut le père d’Isaï père de David ». Plus tard David, traqué par Saül, mit son père et sa mère sous la protection du roi de Moab, peut-être par confiance en cette parenté ; Matthieu nomme Ruth parmi les quatre femmes de la généalogie de Jésus."
    - "Son origine était une question en soi, car la loi disait : « L’Ammonite et le Moabite n’entreront point dans l’assemblée de l’Éternel ». Les rabbins répondaient que l’interdit visait les hommes moabites, non les femmes, et firent de Ruth une descendante d’Églon, roi de Moab. L’époque de rédaction du livre est débattue : beaucoup le datent de la monarchie, pour son intérêt pour la lignée de David, tandis que d’autres y lisent une douce réponse, après l’exil, au renvoi des femmes étrangères par Esdras et Néhémie. L’histoire se situe « du temps des juges », dont les dates sont elles-mêmes discutées ; la carte retient 1100 av. J.-C. comme repère conventionnel."
