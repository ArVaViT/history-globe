id: where-did-ruth-come-from
question:
  en: "Where did Ruth come from?"
  ru: "Откуда была родом Руфь?"
  uk: "Звідки була Рут?"
  es: "¿De dónde venía Rut?"
  pt: "De onde veio Rute?"
  de: "Woher stammte Rut?"
  fr: "D’où venait Ruth ?"
  pl: "Skąd pochodziła Rut?"
  it: "Da dove veniva Rut?"
  nl: "Waar kwam Ruth vandaan?"
  cs: "Odkud pocházela Rut?"
  sv: "Varifrån kom Rut?"
  nb: "Hvor kom Rut fra?"
  tl: "Saan nagmula si Ruth?"
  da: "Hvor kom Ruth fra?"
answer:
  en:
    - "Ruth was a Moabite, from the country of Moab: the high tableland east of the Dead Sea in today's Jordan, between the gorge of the Arnon and the brook Zered, with the plain to the north, up to Heshbon, held by Moab in some periods. The map point for Moab stands at Kerak, the old Kir-hareseth, about 75 km south-east of Bethlehem in a straight line; on foot the way went round the north end of the Dead Sea, by Jericho and the fords of the Jordan, and up onto the plateau. The book never names Ruth's town, only “the country of Moab”, which the Russian Synodal translation renders as the fields of Moab."
    - "In a famine “a certain man of Beth-lehem-judah went to sojourn in the country of Moab”, with his wife Naomi and two sons, who “took them wives of the women of Moab; the name of the one was Orpah, and the name of the other Ruth”. When all three men had died, Ruth would not go home: “whither thou goest, I will go; and where thou lodgest, I will lodge: thy people shall be my people, and thy God my God”. She came to Bethlehem as “Ruth the Moabitess”, gleaned in the field of Boaz and married him, and her son Obed “is the father of Jesse, the father of David”. Later David, hunted by Saul, brought his father and mother to the king of Moab, perhaps trusting this kinship; Matthew names Ruth among the four women in the genealogy of Jesus."
    - "Her origin was a question in itself, for the law said: “An Ammonite or Moabite shall not enter into the congregation of the LORD”. The rabbis answered that the ban meant Moabite men, not women, and made Ruth a descendant of Eglon, king of Moab. When the book was written is debated: many date it to the monarchy, for its interest in David's line, while others read it as a gentle answer, after the exile, to Ezra and Nehemiah's dismissal of foreign wives. The story is set “in the days when the judges ruled”, whose dates are themselves disputed; the map uses 1100 BC as a conventional point."
  ru:
    - "Руфь была моавитянка, из земли Моава: высокого плато к востоку от Мёртвого моря, в нынешней Иордании, между ущельем Арнона и долиной Заред, а равнина к северу, до Есевона, в иные времена тоже принадлежала Моаву. Точка карты для Моава стоит в Кераке, древнем Кирхарешете, примерно в 75 км к юго-востоку от Вифлеема по прямой; пешком путь шёл вокруг северного края Мёртвого моря, через Иерихон и броды Иордана, и вверх на плато. Город Руфи книга не называет — только «поля Моавитские», как передаёт Синодальный перевод; в английской Библии это страна Моава."
    - "Во время голода «пошел один человек из Вифлеема Иудейского со своею женою и двумя сыновьями своими жить на полях Моавитских», и сыновья «взяли себе жен из Моавитянок, имя одной Орфа, а имя другой Руфь». Когда все трое мужчин умерли, Руфь не вернулась домой: «куда ты пойдешь, туда и я пойду, и где ты жить будешь, там и я буду жить; народ твой будет моим народом, и твой Бог — моим Богом». В Вифлеем она пришла как «Руфь Моавитянка», подбирала колосья на поле Вооза и вышла за него замуж, а её сын Овид — «отец Иессея, отца Давидова». Позже Давид, спасаясь от Саула, привёл отца и мать к царю Моавитскому — быть может, полагаясь на это родство; Матфей называет Руфь среди четырёх женщин в родословии Иисуса."
    - "Само её происхождение было вопросом, ведь закон говорил: «Аммонитянин и Моавитянин не может войти в общество Господне». Раввины отвечали, что запрет касался мужчин-моавитян, а не женщин, и считали Руфь потомком Еглона, царя Моавитского. Когда написана книга, спорят: многие относят её ко времени царей, раз она занята родом Давида, другие читают её как мягкий ответ послепленного времени на то, что Ездра и Неемия отсылали чужеземных жён. Действие происходит «в те дни, когда управляли судьи», даты которых тоже спорны; карта берёт условный 1100 г. до н. э."
  uk:
    - "Рут була моавитянкою, з країни Моав: високого плоскогір'я на схід від Мертвого моря в нинішній Йорданії, між ущелиною Арнон і потоком Заред, з рівниною на півночі, аж до Гесбона, яку Моав тримав у деякі періоди. Точка мапи для Моаву стоїть у Кераку, давньому Кір-Харешеті, приблизно за 75 км на південний схід від Вифлеєму по прямій; пішки дорога йшла в обхід північного краю Мертвого моря, через Єрихон і броди Йордану, і вгору на плато. Книга ніколи не називає міста Рут, лише «край Моабіїв», який російський Синодальний переклад віддає як поля Моава."
    - "Під час голоду «один чоловік з Юдейського Вефлеєма пійшов … жити в край Моабіїв» зі своєю дружиною Ноемі й двома синами, які «одружились … з Моабитянками: одна на ймя Орфа, а другу звали Рут». Коли троє чоловіків померли, Рут не схотіла повертатися додому: «куди підеш ти, туди й я піду, і де жити меш ти, там і я жити му; твій народ буде моїм народом, і твій Бог моїм Богом». Вона прийшла до Вифлеєму як «Рут, Моабитянка», збирала колосся на полі Вооза й вийшла за нього, а її син Овед — «батько Ессея, батька Давидового». Пізніше Давид, переслідуваний Саулом, привів свого батька й матір до царя Моаву, можливо, довіряючи цій спорідненості; Матвій називає Рут серед чотирьох жінок у родоводі Ісуса."
    - "Її походження було питанням саме по собі, бо закон казав: «Не ввійде Амонїй і Моабій у громаду Господню». Рабини відповіли, що заборона стосувалася моавитян-чоловіків, а не жінок, і зробили Рут нащадком Еглона, царя Моаву. Коли було написано книгу, обговорюється: багато хто датує її монархією, через її інтерес до роду Давида, інші читають її як лагідну відповідь, після вигнання, на відсилання іноземних дружин Ездрою та Неемією. Історія відбувається «За тих часів, як правували суддї», чиї дати самі спірні; мапа використовує 1100 р. до н. е. як умовну точку."
  es:
    - "Rut era moabita, del país de Moab: la alta meseta al este del mar Muerto, en la actual Jordania, entre el cañón del Arnón y el arroyo de Zered, con la llanura al norte, hasta Hesbón, que Moab dominó en algunos períodos. El punto del mapa para Moab está en Kerak, la antigua Kir-hareset, a unos 75 km al sureste de Belén en línea recta; a pie, el camino rodeaba el extremo norte del mar Muerto, por Jericó y los vados del Jordán, y subía a la meseta. El libro nunca nombra la ciudad de Rut, solo «los campos de Moab», que es también como lo vierte la traducción sinodal rusa."
    - "En una hambruna «un varón de Beth-lehem de Judá, fué á peregrinar en los campos de Moab», con su mujer Noemí y dos hijos, que «tomaron para sí mujeres de Moab, el nombre de la una Orpha, y el nombre de la otra Ruth». Cuando murieron los tres hombres, Rut no quiso volver a casa: «donde quiera que tú fueres, iré yo; y donde quiera que vivieres, viviré. Tu pueblo será mi pueblo, y tu Dios mi Dios». Llegó a Belén como «Ruth Moabita», espigó en el campo de Booz y se casó con él, y su hijo Obed «es padre de Isaí, padre de David». Más tarde David, perseguido por Saúl, llevó a su padre y a su madre al rey de Moab, quizá confiando en este parentesco; Mateo nombra a Rut entre las cuatro mujeres de la genealogía de Jesús."
    - "Su origen era una cuestión en sí misma, pues la ley decía: «No entrará Ammonita ni Moabita en la congregación de Jehová». Los rabinos respondieron que la prohibición se refería a los moabitas varones, no a las mujeres, e hicieron de Rut una descendiente de Eglón, rey de Moab. Cuándo se escribió el libro es debatido: muchos lo fechan en la monarquía, por su interés en el linaje de David, mientras que otros lo leen como una respuesta suave, después del exilio, a la expulsión de las mujeres extranjeras por Esdras y Nehemías. La historia se sitúa «en los días que gobernaban los jueces», cuyas fechas son a su vez discutidas; el mapa usa el 1100 a. C. como punto convencional."
  pt:
    - "Rute era moabita, do país de Moabe: o alto planalto a leste do mar Morto, na Jordânia de hoje, entre a garganta do Arnom e o ribeiro de Zerede, com a planície ao norte, até Hesbom, que Moabe controlou em alguns períodos. O ponto do mapa para Moabe está em Kerak, a antiga Quir-Haresete, a cerca de 75 km a sudeste de Belém em linha reta; a pé o caminho contornava a ponta norte do mar Morto, por Jericó e os vaus do Jordão, e subia ao planalto. O livro nunca nomeia a cidade de Rute, só “as terras de Moabe”, que a tradução sinodal russa verte por campos de Moabe."
    - "Numa fome, “um certo homem de Belém de Judá foi viver nas terras de Moabe”, com sua mulher Noemi e dois filhos, que “tomaram para si mulheres moabitas. O nome de uma era Orfa, e o nome da outra era Rute”. Quando os três homens morreram, Rute não quis voltar para casa: “aonde quer que você for, eu irei; e onde quer que você ficar, eu ficarei. O seu povo será o meu povo, e o seu Deus o meu Deus”. Chegou a Belém como “Rute, a moabita”, respigou no campo de Boaz e casou com ele, e seu filho Obede “é o pai de Jessé, o pai de Davi”. Mais tarde Davi, perseguido por Saul, levou o pai e a mãe ao rei de Moabe, talvez confiando nesse parentesco; Mateus nomeia Rute entre as quatro mulheres da genealogia de Jesus."
    - "Sua origem era um problema em si, pois a lei dizia: “Um amonita ou um moabita não entrará na assembleia do SENHOR”. Os rabinos responderam que a proibição valia para os moabitas homens, não para as mulheres, e fizeram de Rute descendente de Eglom, rei de Moabe. Quando o livro foi escrito é debatido: muitos o datam da monarquia, pelo interesse na linhagem de Davi, enquanto outros o leem como resposta suave, após o exílio, à expulsão das esposas estrangeiras por Esdras e Neemias. A história se passa “nos dias em que os juízes julgavam”, cujas datas são elas mesmas disputadas; o mapa usa 1100 a.C. como ponto convencional."
  de:
    - "Rut war Moabiterin, aus dem Land Moab: dem hohen Tafelland östlich des Toten Meeres im heutigen Jordanien, zwischen der Schlucht des Arnon und dem Bach Sered, mit der Ebene im Norden bis Heschbon, die Moab zeitweise hielt. Der Kartenpunkt für Moab liegt bei Kerak, dem alten Kir-Heres, in der Luftlinie etwa 75 km südöstlich von Bethlehem; zu Fuß führte der Weg um das Nordende des Toten Meeres, über Jericho und die Jordanfurten und hinauf auf das Plateau. Das Buch nennt nie Ruts Stadt, nur „der Moabiter Land“, was die russische Synodalübersetzung mit den Gefilden Moabs wiedergibt."
    - "In einer Hungersnot „ein Mann von Bethlehem-Juda zog wallen in der Moabiter Land“ mit seiner Frau Naemi und zwei Söhnen, die „moabitische Weiber“ nahmen: „eine hieß Orpa, die andere Ruth“. Als alle drei Männer gestorben waren, wollte Rut nicht heimkehren: „Wo du hin gehst, da will ich auch hin gehen; wo du bleibst, da bleibe ich auch. Dein Volk ist mein Volk, und dein Gott ist mein Gott.“ Sie kam als „Ruth, der Moabitin“ nach Bethlehem, las auf dem Feld des Boas Ähren und heiratete ihn, und ihr Sohn Obed „ist der Vater Isais, welcher ist Davids Vater“. Später brachte David auf der Flucht vor Saul seinen Vater und seine Mutter zum König von Moab, vielleicht im Vertrauen auf diese Verwandtschaft; Matthäus nennt Rut unter den vier Frauen im Stammbaum Jesu."
    - "Ihre Herkunft war eine eigene Frage, denn das Gesetz sagte: „Die Ammoniter und Moabiter sollen nicht in die Gemeinde des HERRN kommen“. Die Rabbinen antworteten, das Verbot gelte moabitischen Männern, nicht Frauen, und machten Rut zur Nachfahrin Eglons, des Königs von Moab. Wann das Buch entstand, ist umstritten: Viele datieren es in die Königszeit wegen seines Interesses an Davids Linie, andere lesen es als sanfte Antwort der Zeit nach dem Exil auf die Entlassung der fremden Frauen durch Esra und Nehemia. Die Geschichte spielt „zu der Zeit, da die Richter regierten“, deren Daten selbst umstritten sind; die Karte verwendet 1100 v. Chr. als herkömmlichen Punkt."
  fr:
    - "Ruth était moabite, du pays de Moab : le haut plateau à l’est de la mer Morte, dans la Jordanie actuelle, entre la gorge de l’Arnon et le torrent de Zéred, la plaine du nord, jusqu’à Hesbon, étant tenue par Moab à certaines périodes. Le point de la carte pour Moab est à Kérak, l’ancienne Kir-Haréseth, à environ 75 km au sud-est de Bethléem en ligne droite ; à pied, la route contournait l’extrémité nord de la mer Morte, par Jéricho et les gués du Jourdain, puis montait sur le plateau. Le livre ne nomme jamais la ville de Ruth, seulement « le pays de Moab », que la traduction synodale russe rend par les champs de Moab."
    - "Pendant une famine, « un homme de Bethléhem de Juda partit, avec sa femme et ses deux fils, pour faire un séjour dans le pays de Moab » ; la femme était Naomi, et les fils « prirent des femmes Moabites, dont l’une se nommait Orpa, et l’autre Ruth ». Quand les trois hommes furent morts, Ruth ne voulut pas rentrer chez elle : « Où tu iras j’irai, où tu demeureras je demeurerai ; ton peuple sera mon peuple, et ton Dieu sera mon Dieu. » Elle vint à Bethléhem comme « Ruth la Moabite », glana dans le champ de Boaz et l’épousa, et son fils Obed « fut le père d’Isaï père de David ». Plus tard David, traqué par Saül, mit son père et sa mère sous la protection du roi de Moab, peut-être par confiance en cette parenté ; Matthieu nomme Ruth parmi les quatre femmes de la généalogie de Jésus."
    - "Son origine était une question en soi, car la loi disait : « L’Ammonite et le Moabite n’entreront point dans l’assemblée de l’Éternel ». Les rabbins répondaient que l’interdit visait les hommes moabites, non les femmes, et firent de Ruth une descendante d’Églon, roi de Moab. L’époque de rédaction du livre est débattue : beaucoup le datent de la monarchie, pour son intérêt pour la lignée de David, tandis que d’autres y lisent une douce réponse, après l’exil, au renvoi des femmes étrangères par Esdras et Néhémie. L’histoire se situe « du temps des juges », dont les dates sont elles-mêmes discutées ; la carte retient 1100 av. J.-C. comme repère conventionnel."
  pl:
    - "Rut była Moabitką, z kraju Moab: wysokiego płaskowyżu na wschód od Morza Martwego w dzisiejszej Jordanii, między wąwozem Arnonu a potokiem Zared, z równiną na północy, aż do Cheszbonu, którą Moab w niektórych okresach zajmował. Punkt na mapie dla Moabu stoi w Karak, dawnym Kir-Chareszet, około 75 km na południowy wschód od Betlejem w linii prostej; pieszo droga wiodła naokoło północnego krańca Morza Martwego, przez Jerycho i brody Jordanu, i na płaskowyż. Księga nigdy nie nazywa miasta Rut, wspomina tylko o powrocie „z krainy Moabskiej”, którą rosyjski przekład synodalny oddaje jako pola Moabu."
    - "W czasie głodu „poszedł niektóry mąż z Betlehem Juda na mieszkanie do ziemi Moabskiej”, z żoną Noemi i dwoma synami, a synowie „pojęli sobie żony Moabskie; imię jednej Orfa, a drugiej imię Rut”. Gdy zmarli wszyscy trzej mężczyźni, Rut nie chciała wrócić do domu: „gdziekolwiek pójdziesz, z tobą pójdę, a gdziekolwiek mieszkać będziesz, z tobą mieszkać będę; lud twój lud mój, a Bóg twój Bóg mój”. Przyszła do Betlejem jako „Rut Moabitka”, zbierała kłosy na polu Booza i wyszła za niego, a jej syn Obed, „tenci jest ojciec Isajego ojca Dawidowego”. Później Dawid, ścigany przez Saula, przywiódł ojca i matkę do króla Moabu, może ufając temu pokrewieństwu; Mateusz wymienia Rut wśród czterech kobiet w rodowodzie Jezusa."
    - "Jej pochodzenie samo było problemem, bo prawo mówiło: „Nie wnijdzie też Ammonita, i Moabczyk do zgromadzenia Pańskiego”. Rabini odpowiadali, że zakaz dotyczył mężczyzn Moabu, nie kobiet, i uczynili Rut potomkinią Eglona, króla Moabu. Kiedy napisano księgę, jest przedmiotem sporu: wielu datuje ją na czas monarchii, ze względu na zainteresowanie linią Dawida, inni czytają ją jako łagodną odpowiedź, po wygnaniu, na odprawienie przez Ezdrasza i Nehemiasza cudzoziemskich żon. Opowieść rozgrywa się „za onych czasów, kiedy sędziowie sądzili”, których daty same są sporne; mapa używa 1100 p.n.e. jako punktu umownego."
  it:
    - "Rut era una Moabita, dal paese di Moab: l’alto tavolato a est del Mar Morto nell’odierna Giordania, tra la gola dell’Arnon e il torrente Zered, con la pianura a nord, fino a Chesbon, tenuta da Moab in alcuni periodi. Il punto della mappa per Moab sta a Kerak, l’antica Kir-Cheres, a circa 75 km a sud-est di Betlemme in linea retta; a piedi la strada girava attorno all’estremità settentrionale del Mar Morto, per Gerico e i guadi del Giordano, e saliva sull’altopiano. Il libro non nomina mai la città di Rut, soltanto il paese di Moab, che la traduzione sinodale russa rende come i campi di Moab."
    - "In una carestia «un uomo di Bethlehem di Giuda andò a stare nelle campagne di Moab», con la moglie Noemi e due figli, i quali «sposarono delle Moabite, delle quali una si chiamava Orpa, e l’altra Ruth». Morti tutti e tre gli uomini, Rut non volle tornare a casa: «dove andrai tu, andrò anch’io; e dove starai tu, io pure starò; il tuo popolo sarà il mio popolo, e il tuo Dio sarà il mio Dio». Giunse a Betlemme come «Ruth, la Moabita», spigolò nel campo di Booz e lo sposò, e suo figlio Obed «fu padre d’Isai, padre di Davide». Più tardi Davide, braccato da Saul, condusse suo padre e sua madre dal re di Moab, forse confidando in questa parentela; Matteo nomina Rut tra le quattro donne della genealogia di Gesù."
    - "La sua origine era un problema in sé, perché la legge diceva: «L’Ammonita e il Moabita non entreranno nella raunanza dell’Eterno». I rabbini risposero che il divieto riguardava gli uomini moabiti, non le donne, e fecero di Rut una discendente di Eglon, re di Moab. Quando il libro fu scritto è dibattuto: molti lo datano alla monarchia, per l’interesse per la linea di Davide, mentre altri lo leggono come una dolce risposta, dopo l’esilio, al congedo delle mogli straniere imposto da Esdra e Neemia. La storia è ambientata «Al tempo dei giudici», le cui date sono a loro volta discusse; la mappa usa il 1100 a.C. come punto convenzionale."
  nl:
    - "Ruth was een Moabietische, uit het land Moab: het hoge plateau ten oosten van de Dode Zee in het huidige Jordanië, tussen de kloof van de Arnon en de beek Zered, waarbij de vlakte in het noorden tot Chesbon in sommige perioden door Moab werd bezet. Het punt op de kaart voor Moab staat bij Kerak, het oude Kir-Hareset, hemelsbreed ongeveer 75 km ten zuidoosten van Bethlehem; te voet liep de weg om het noordeinde van de Dode Zee, via Jericho en de Jordaanfurten, het plateau op. Het boek noemt Ruths stad nooit, alleen het land Moab, in de Statenvertaling “de velden Moabs”, zoals ook de Russische Synodale vertaling heeft: de velden van Moab."
    - "Bij een hongersnood “toog een man van Bethlehem-Juda, om als vreemdeling te verkeren in de velden Moabs”, met zijn vrouw Naomi en twee zonen. “Die namen zich Moabietische vrouwen; de naam der ene was Orpa, en de naam der andere Ruth”. Toen alle drie de mannen gestorven waren, wilde Ruth niet naar huis: “waar gij zult heengaan, zal ik ook heengaan, en waar gij zult vernachten, zal ik vernachten; uw volk is mijn volk, en uw God mijn God”. Zij kwam in Bethlehem als “Ruth, de Moabietische”, raapte aren op het veld van Boaz en trouwde met hem, en haar zoon Obed “is de vader van Isai, Davids vader”. Later bracht David, door Saul opgejaagd, zijn vader en moeder naar de koning van Moab, misschien vertrouwend op deze verwantschap; Mattheüs noemt Ruth onder de vier vrouwen in het geslachtsregister van Jezus."
    - "Haar afkomst was een vraag op zich, want de wet zei: “Geen Ammoniet, noch Moabiet zal in de vergadering des HEEREN komen”. De rabbijnen antwoordden dat het verbod Moabitische mannen gold, niet vrouwen, en maakten Ruth een afstammelinge van Eglon, koning van Moab. Wanneer het boek is geschreven, wordt betwist: velen dateren het in het koningstijdperk, vanwege de belangstelling voor Davids geslacht, terwijl anderen het lezen als een milde reactie, na de ballingschap, op de verwerping van vreemde vrouwen door Ezra en Nehemia. Het verhaal speelt “in de dagen, als de richters richtten”, waarvan de data zelf omstreden zijn; de kaart gebruikt 1100 v.Chr. als conventioneel punt."
  cs:
    - "Rut byla Moábka ze země Moáb: vysoké planiny východně od Mrtvého moře v dnešním Jordánsku, mezi roklí Arnonu a potokem Zered, s pláněmi na sever až po Chešbón, které Moáb v některých obdobích držel. Bod na mapě pro Moáb stojí v Keraku, starém Kír-charesetu, asi 75 km jihovýchodně od Betléma vzdušnou čarou; pěšky vedla cesta kolem severního konce Mrtvého moře, přes Jericho a brody Jordánu a vzhůru na planinu. Kniha nikdy nejmenuje Rutino město, jen „v krajině Moábské“, což ruský synodální překlad vykládá jako pole Moábská."
    - "Za hladu „odšel člověk z Betléma Judova, a bydlil pohostinu v krajině Moábské“ s manželkou Noemi a dvěma syny, kteří „pojali sobě ženy Moábské; jméno jedné bylo Orfa a jméno druhé Rut“. Když všichni tři muži zemřeli, Rut nechtěla jít domů: „kamž se koli obrátíš, půjdu, a kdekoli bydliti budeš, i já bydliti budu; lid tvůj lid můj, a Bůh tvůj Bůh můj“. Přišla do Betléma jako Rut Moábka, sbírala klasy na poli Bóazově a vdala se za něj a její syn Obéd je „otec Izai, otce Davidova“. Později David, pronásledovaný Saulem, přivedl otce a matku ke králi Moábskému, snad v důvěře v toto příbuzenství; Matouš jmenuje Rut mezi čtyřmi ženami v rodokmenu Ježíšově."
    - "Její původ byl sám o sobě otázkou, neboť zákon říkal: „Ammonitský tolikéž ani Moábský nevejde do shromáždění Hospodinova“. Rabíni odpověděli, že zákaz se týkal moábských mužů, nikoli žen, a učinili z Rut potomka Eglona, krále Moábu. Kdy byla kniha napsána, se diskutuje: mnozí ji datují do doby království pro její zájem o Davidův rod, jiní ji čtou jako mírnou odpověď po vyhnanství na Ezdrášovo a Nehemjášovo propuštění cizích žen. Příběh se odehrává „za času soudců“, jejichž data jsou sama sporná; mapa užívá rok 1100 př. n. l. jako smluvní bod."
  sv:
    - "Rut var en moabitisk kvinna, från landet Moab: högplatån öster om Döda havet i dagens Jordanien, mellan Arnons ravin och bäcken Sered, med slätten i norr, upp till Heshbon, som Moab höll under vissa perioder. Kartpunkten för Moab står vid Kerak, det gamla Kir-Hareset, omkring 75 km sydost om Betlehem fågelvägen; till fots gick vägen runt Döda havets norra ände, via Jeriko och Jordans vadställen, och upp på platån. Boken nämner aldrig Ruts stad, bara ”Moabs land”, som den ryska Synodalbibeln återger som Moabs fält."
    - "Under en hungersnöd ”drog en man från Bet-Lehem i Juda åstad med sin hustru och sina båda söner för att bosätta sig i Moabs land under någon tid”, Noomi och två söner, som ”skaffade sig moabitiska hustrur; den ena hette Orpa och den andra Rut”. När alla tre männen hade dött ville Rut inte vända hem: ”dit du går vill ock jag gå, och där du stannar vill ock jag stanna. Ditt folk är mitt folk, och din Gud är min Gud.” Hon kom till Betlehem som ”moabitiskan Rut”, plockade ax på Boas åker och gifte sig med honom, och hennes son Oved ”blev fader till Isai, Davids fader”. Senare förde David, jagad av Saul, sin far och mor till Moabs kung, kanske i förtröstan på denna släktskap; Matteus nämner Rut bland de fyra kvinnorna i Jesu släktregister."
    - "Hennes ursprung var en fråga i sig, ty lagen sade: ”Ingen ammonit eller moabit skall komma in i HERRENS församling”. Rabbinerna svarade att förbudet gällde moabitiska män, inte kvinnor, och gjorde Rut till en ättling till Eglon, Moabs kung. När boken skrevs är omdiskuterat: många daterar den till kungatiden, för dess intresse för Davids släkt, medan andra läser den som ett milt svar, efter exilen, på Esras och Nehemjas bortvisning av främmande hustrur. Berättelsen utspelar sig ”på den tid då domarna regerade”, vars datering själv är omstridd; kartan använder 1100 f.Kr. som en konventionell punkt."
  nb:
    - "Rut var moabitt, fra landet Moab: det høye platået øst for Dødehavet i dagens Jordan, mellom Arnon-kløften og bekken Sered, med sletten i nord, opp til Hesjbon, som Moab holdt i enkelte perioder. Kartpunktet for Moab står ved Kerak, det gamle Kir-Hareset, omtrent 75 km sørøst for Betlehem i luftlinje; til fots gikk veien rundt nordenden av Dødehavet, forbi Jeriko og vadestedene over Jordan, og opp på platået. Boken nevner aldri Ruts by, bare «Moabs land», som den russiske synodaloversettelsen gjengir som Moabs marker."
    - "I en hungersnød «drog en mann med sin hustru og sine to sønner avsted fra Betlehem i Juda for å opholde sig nogen tid i Moabs land»; hustruen var Noomi, og sønnene «tok sig moabittiske hustruer, den ene hette Orpa og den andre Rut». Da alle tre mennene var døde, ville ikke Rut reise hjem: «dit du går, vil jeg gå, og hvor du blir, vil jeg bli; ditt folk er mitt folk, og din Gud er min Gud». Hun kom til Betlehem som «moabittinnen Rut», sanket aks på Boas' mark og giftet seg med ham, og sønnen Obed «blev far til Isai, Davids far». Senere førte David, jaget av Saul, sin far og mor til Moabs konge, kanskje i tillit til dette slektskapet; Matteus nevner Rut blant de fire kvinnene i Jesu slektsregister."
    - "Hennes opprinnelse var et spørsmål i seg selv, for loven sa: «Ingen ammonitt eller moabitt skal være med i Herrens menighet». Rabbinerne svarte at forbudet gjaldt moabittiske menn, ikke kvinner, og gjorde Rut til etterkommer av Eglon, Moabs konge. Når boken ble skrevet, er omdiskutert: mange daterer den til kongetiden, for dens interesse for Davids ætt, mens andre leser den som et mildt svar, etter eksilet, på Esras og Nehemjas bortvisning av fremmede hustruer. Fortellingen er satt «I de dager da dommerne styrte», hvis datoer selv er omstridt; kartet bruker 1100 f.Kr. som et konvensjonelt punkt."
  tl:
    - "Si Ruth ay Moabita, mula sa bansang Moab: ang mataas na talampas sa silangan ng Dagat na Patay sa Jordan ngayon, sa pagitan ng bangin ng Arnon at ng batis ng Zered, kasama ang kapatagan sa hilaga, hanggang Hesbon, na hawak ng Moab sa ilang panahon. Ang tuldok sa mapa para sa Moab ay nasa Kerak, ang lumang Cir-hareseth, mga 75 km sa timog-silangan ng Bethlehem sa tuwid na guhit; sa paa, ang daan ay paikot sa hilagang dulo ng Dagat na Patay, sa Jerico at mga tawiran ng Jordan, at paakyat sa talampas. Hindi pinangalanan ng aklat ang bayan ni Ruth, kundi “lupain ng Moab” lamang, na isinasalin ng salin Sinodal na Ruso bilang mga bukid ng Moab."
    - "Sa taggutom, “isang lalaking taga Bethlehem-juda ay yumaong nakipamayan sa lupain ng Moab”, kasama ang asawang si Noemi at dalawang anak, na “nagsipagasawa sa mga babae sa Moab; ang pangalan ng isa'y Orpha, at ang pangalan ng isa'y Ruth”. Nang mamatay ang tatlong lalaki, ayaw umuwi ni Ruth: “kung saan ka pumaroon, ay paroroon ako: at kung saan ka tumigil, ay titigil ako: ang iyong bayan ay magiging aking bayan, at ang iyong Dios ay aking Dios”. Dumating siya sa Bethlehem bilang “Ruth na Moabita”, nag-ulit-ani sa bukid ni Booz at napangasawa siya, at ang anak niyang si Obed ay “siya ang ama ni Isai, na ama ni David”. Kalaunan, dinala ni David, na hinahabol ni Saul, ang kaniyang ama at ina sa hari ng Moab, marahil nagtitiwala sa pagkakamag-anak na ito; pinangalanan ni Mateo si Ruth sa apat na babae sa talaangkanan ni Jesus."
    - "Isang tanong ang kaniyang pinagmulan, sapagkat sinabi ng kautusan: “Huwag papasok ang isang Ammonita o Moabita sa kapulungan ng Panginoon”. Sumagot ang mga rabbi na ang pagbabawal ay para sa mga lalaking Moabita, hindi sa mga babae, at ginawa si Ruth na inapo ni Eglon, hari ng Moab. Pinagtatalunan kung kailan isinulat ang aklat: itinatakda ito ng marami sa panahon ng monarkiya, dahil sa interes nito sa lahi ni David, samantalang binabasa ito ng iba bilang mahinahong sagot, pagkatapos ng pagkatapon, sa pagpapaalis nina Ezra at Nehemias sa mga dayuhang asawa. Itinatakda ang kuwento “nang mga kaarawan nang humatol ang mga hukom”, na pinagtatalunan din ang mga petsa; ginagamit ng mapa ang 1100 BK bilang kombensiyonal na punto."
  da:
    - "Ruth var moabitisk, fra Moabs land: det høje tableland øst for Det Døde Hav i nutidens Jordan, mellem Arnon-kløften og Sered-bækken, med sletten mod nord, op til Hesjbon, som Moab holdt i nogle perioder. Kortets punkt for Moab står ved Kerak, det gamle Kir-Hareset, omkring 75 km sydøst for Betlehem i luftlinje; til fods gik vejen rundt om Det Døde Havs nordende, forbi Jeriko og Jordans vadesteder og op på plateauet. Bogen nævner aldrig Ruths by, kun »Moabiternes Land«, som den russiske synodale oversættelse gengiver som Moabs marker."
    - "I en hungersnød »gik« en mand fra Betlehem i Juda »hen at opholde sig i Moabiternes Land«, med sin hustru Noomi og to sønner, som »toge sig moabitiske Hustruer, den enes Navn var Orpa, og den andens Navn Ruth«. Da alle tre mænd var døde, ville Ruth ikke vende hjem: »hvor du gaar hen, der vil jeg gaa hen, og hvor du bliver om Natten, der vil jeg blive om Natten; dit Folk er mit Folk, og din Gud er min Gud«. Hun kom til Betlehem som »Ruth den moabitiske«, sankede aks på Boaz' mark og giftede sig med ham, og hendes søn Obed, »han var Fader til Isai, Davids Fader«. Senere bragte David, forfulgt af Saul, sin far og mor til Moabs konge, måske i tillid til dette slægtskab; Mattæus nævner Ruth blandt de fire kvinder i Jesu slægtsregister."
    - "Hendes oprindelse var et spørgsmål i sig selv, for loven sagde: »En Ammonit og en Moabit maa ikke komme i Herrens Forsamling«. Rabbinerne svarede, at forbuddet gjaldt moabitiske mænd, ikke kvinder, og gjorde Ruth til efterkommer af Eglon, Moabs konge. Hvornår bogen blev skrevet, er omdiskuteret: mange dater den til kongetiden på grund af dens interesse for Davids slægt, mens andre læser den som et mildt svar, efter eksilet, på Ezras og Nehemias' bortvisning af fremmede hustruer. Historien er sat »i de Dage, da Dommerne dømte«, hvis datoer selv er omstridte; kortet bruger 1100 f.Kr. som et konventionelt punkt."
