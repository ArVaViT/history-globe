id: where-did-deborah-defeat-sisera
question:
  en: "Where did Deborah and Barak defeat Sisera?"
  ru: "Где Девора и Варак разбили Сисару?"
  uk: "Де Дебора і Варак розбили Сісару?"
  es: "¿Dónde derrotaron Débora y Barac a Sísara?"
  pt: "Onde Débora e Baraque derrotaram Sísera?"
  de: "Wo besiegten Debora und Barak Sisera?"
  fr: "Où Débora et Barak ont-ils battu Sisera ?"
  pl: "Gdzie Debora i Barak pokonali Sisarę?"
  it: "Dove Debora e Barak sconfissero Sisara?"
  nl: "Waar versloegen Debora en Barak Sisera?"
  cs: "Kde Debora a Bárak porazili Siseru?"
answer:
  en:
    - "In the Jezreel valley, between Mount Tabor and the river Kishon, in the north of today's Israel. Barak gathered ten thousand men on Tabor, the round hill of 575 m that rises alone at the valley's north-eastern edge, 9 km east of Nazareth; Sisera's nine hundred chariots came to the Kishon, the stream that drains the valley westward to the sea at Haifa. The Song of Deborah places the fighting “in Taanach by the waters of Megiddo”, some 24 km south-west of Tabor on the valley's southern rim. Deborah herself judged far to the south, under her palm between Ramah and Bethel in the hills of Ephraim, about 90 km from Tabor."
    - "Deborah's order to Barak was: “Go and draw toward mount Tabor, and take with thee ten thousand men of the children of Naphtali and of the children of Zebulun? And I will draw unto thee to the river Kishon Sisera, the captain of Jabin's army, with his chariots and his multitude; and I will deliver him into thine hand.” Sisera gathered “nine hundred chariots of iron, and all the people that were with him, from Harosheth of the Gentiles unto the river of Kishon”; “So Barak went down from mount Tabor, and ten thousand men after him”, and the Lord “discomfited Sisera, and all his chariots”. The Song: “They fought from heaven; the stars in their courses fought against Sisera. The river of Kishon swept them away, that ancient river, the river Kishon.” Most read this as a storm that flooded the Kishon and mired the chariots; Josephus speaks of hail and rain in the enemy's faces."
    - "Jabin reigned at Hazor, 40 km to the north; Harosheth of the Gentiles, Sisera's base, has not been found: Tell el-Ahwat and el-Harithiyeh by the Kishon have been proposed, and it may be a district rather than a town. Barak's home, Kedesh-naphtali, is placed on the map at Khirbet Qedish above the Sea of Galilee, 16 km from Tabor, by those who think the great Kedesh of Upper Galilee too far; the identification is disputed. The date is uncertain, in the twelfth century BC on most reckonings, and the Song of Deborah is counted among the oldest Hebrew poems; the map's conventional year for the judges is about 1150 BC. Tabor later became the traditional mount of the Transfiguration, which is a question of its own."
  ru:
    - "В Изреельской долине, между горой Фавор и потоком Киссон, на севере нынешнего Израиля. Варак собрал десять тысяч человек на Фаворе — круглой горе высотой 575 м, что стоит особняком у северо-восточного края долины, в 9 км к востоку от Назарета; девятьсот колесниц Сисары вышли к Киссону, потоку, уносящему воды долины на запад к морю у Хайфы. Песнь Деворы помещает сражение «в Фанаахе у вод Мегиддонских», примерно в 24 км к юго-западу от Фавора на южной кромке долины. Сама Девора судила далеко на юге, под своей пальмой между Рамою и Вефилем на горе Ефремовой, примерно в 90 км от Фавора."
    - "Девора велела Вараку: «пойди, взойди на гору Фавор и возьми с собою десять тысяч человек из сынов Неффалимовых и сынов Завулоновых; а Я приведу к тебе, к потоку Киссону, Сисару, военачальника Иавинова, и колесницы его и многолюдное войско его, и предам его в руки твои». Сисара созвал «девятьсот железных колесниц, и весь народ, который у него, из Харошеф-Гоима к потоку Киссону»; «И сошел Варак с горы Фавора, и за ним десять тысяч человек», и Господь «привел в замешательство Сисару и все колесницы его». Песнь: «С неба сражались, звезды с путей своих сражались с Сисарою. Поток Киссон увлек их, поток Кедумим, поток Киссон». Обычно это понимают как ливень: Киссон разлился, и колесницы увязли в грязи; Иосиф Флавий говорит о граде и дожде в лицо врагу."
    - "Иавин царствовал в Асоре, в 40 км к северу; Харошеф-Гоим, стан Сисары, не найден: предлагали Телль-эль-Ахуат и эль-Харитию у Киссона, а возможно, это была область, а не город. Родину Варака, Кедес Неффалимов, карта ставит в Хирбет-Кедиш над Галилейским морем, в 16 км от Фавора, вслед за теми, кто считает большой Кедес Верхней Галилеи слишком далёким; отождествление спорно. Дата неясна — по большинству подсчётов XII век до н. э., а Песнь Деворы относят к древнейшим еврейским поэмам; условный год карты для судей — около 1150 г. до н. э. Позже Фавор стал традиционной горой Преображения — это отдельный вопрос."
  uk:
    - "В Ізреельській долині, між горою Фавор і річкою Кішон, на півночі нинішнього Ізраїлю. Варак зібрав десять тисяч чоловік на Фаворі, круглому пагорбі заввишки 575 м, що самотньо здіймається на північно-східному краю долини, за 9 км на схід від Назарета; дев'ятсот колісниць Сісари прийшли до Кішону, потоку, що відводить воду з долини на захід до моря біля Хайфи. Пісня Дебори розміщує бій «в Танаах у вод Мегидонських», приблизно за 24 км на південний захід від Фавору на південному краї долини. Сама Дебора судила далеко на півдні, під своєю пальмою між Рамою й Бет-Елем у горах Єфрема, приблизно за 90 км від Фавору."
    - "Наказ Дебори Вараку був: «Лаштуйсь у дорогу, виступай на Табор-гору і возьми з собою десять тисяч чоловіка із Нефталиміїв та з Зебулонїїв; Я ж приведу до тебе Сизару, гетьмана Явинового вкупі з його колесницями й його військом до потока Кисон, і подам його тобі на поталу». Сісара зібрав «девятьсот залїзних колесниць, і ввесь військовий люд, що мав при собі, із поганського Гаросета на Кисон-бурчак»; «спустивсь Барак з Табор-гори, і десять тисяч чоловіка йшло за ним», і Господь «привів у безлад Сизару, і всї колесницї його і все військо його». Пісня: «Воювали з неба зорі, били на Сизару, (із доріг своїх на його) виступили боєм. Той Кисон, бурчак (потужний), різко рвав і нїс їх. Поток Кедумим, потік Кисон». Більшість читає це як бурю, що розлила Кішон і загнала колісниці в багнюку; Йосиф Флавій говорить про град і дощ ворогам в обличчя."
    - "Явін царював у Гацорі, за 40 км на північ; Харошет-Гоїм, база Сісари, не знайдений: пропонували Тель-ель-Ахват і ель-Харітію біля Кішону, і це може бути округа, а не місто. Батьківщину Варака, Кедес-Нефталимів, мапа розміщує в Хірбет-Кедіші над Галілейським морем, за 16 км від Фавору, за тими, хто вважає великий Кедес Верхньої Галілеї надто далеким; ототожнення спірне. Дата непевна, за більшістю підрахунків — XII ст. до н. е., а Пісню Дебори зараховують до найдавніших єврейських поезій; умовний рік мапи для суддів — близько 1150 р. до н. е. Фавор згодом став традиційною горою Преображення, що є окремим питанням."
  es:
    - "En el valle de Jezreel, entre el monte Tabor y el río Cisón, en el norte del Israel actual. Barac reunió diez mil hombres en el Tabor, la colina redonda de 575 m que se alza aislada en el extremo noreste del valle, a 9 km al este de Nazaret; los novecientos carros de Sísara llegaron al Cisón, el arroyo que drena el valle hacia el oeste hasta el mar en Haifa. El Cántico de Débora sitúa el combate «en Taanac, junto á las aguas de Megiddo», a unos 24 km al suroeste del Tabor, en el borde meridional del valle. La propia Débora juzgaba muy al sur, bajo su palmera entre Ramá y Betel, en los montes de Efraín, a unos 90 km del Tabor."
    - "La orden de Débora a Barac fue: «Ve, y haz gente en el monte de Tabor, y toma contigo diez mil hombres de los hijos de Nephtalí, y de los hijos de Zabulón... Y yo atraeré á ti al arroyo de Cisón á Sísara, capitán del ejército de Jabín, con sus carros y su ejército, y entregarélo en tus manos». Sísara reunió «nuevecientos carros herrados, con todo el pueblo que con él estaba, desde Haroseth de las Gentes hasta el arroyo de Cisón»; «Barac descendió del monte de Tabor, y diez mil hombres en pos de él», y el Señor «desbarató á Sísara, y á todos sus carros». El Cántico: «De los cielos pelearon: las estrellas desde sus órbitas pelearon contra Sísara. Barriólos el torrente de Cisón, el antiguo torrente, el torrente de Cisón». La mayoría lo lee como una tormenta que desbordó el Cisón y atascó los carros; Josefo habla de granizo y lluvia en la cara de los enemigos."
    - "Jabín reinaba en Hazor, a 40 km al norte; Haroset de las Gentes, la base de Sísara, no ha sido hallada: se han propuesto Tell el-Ahwat y el-Harithiyeh, junto al Cisón, y puede ser un distrito más que una población. La patria de Barac, Cedes de Neftalí, se sitúa en el mapa en Khirbet Qedish, sobre el mar de Galilea, a 16 km del Tabor, por quienes juzgan demasiado lejana la gran Cedes de la Alta Galilea; la identificación es discutida. La fecha es incierta, en el siglo XII a. C. según la mayoría de los cómputos, y el Cántico de Débora se cuenta entre los poemas hebreos más antiguos; el año convencional del mapa para los jueces es hacia el 1150 a. C. El Tabor llegó a ser después el monte tradicional de la Transfiguración, que es una cuestión aparte."
  pt:
    - "No vale de Jezreel, entre o monte Tabor e o rio Quisom, no norte do Israel de hoje. Baraque reuniu dez mil homens no Tabor, a colina redonda de 575 m que se ergue isolada na borda nordeste do vale, 9 km a leste de Nazaré; os novecentos carros de Sísera vieram ao Quisom, o curso que escoa o vale para oeste até o mar, em Haifa. O Cântico de Débora situa a luta “em Taanaque, junto às águas de Megido”, uns 24 km a sudoeste do Tabor, na borda sul do vale. A própria Débora julgava bem ao sul, debaixo de sua palmeira entre Ramá e Betel, nos montes de Efraim, a cerca de 90 km do Tabor."
    - "A ordem de Débora a Baraque foi: “Vá e marche para o monte Tabor, e leve com você dez mil homens dos filhos de Naftali e dos filhos de Zebulom? Eu atrairei a você, para o ribeiro de Quisom, Sísera, o comandante do exército de Jabim, com os seus carros e a sua multidão; e eu o entregarei em sua mão.” Sísera reuniu “novecentos carros de ferro, e todo o povo que estava com ele, de Harosete dos Gentios até o ribeiro de Quisom”; “Baraque desceu do monte Tabor, e dez mil homens atrás dele”, e o Senhor “confundiu Sísera, todos os seus carros”. O Cântico: “Desde os céus lutaram as estrelas. Desde as suas órbitas, lutaram contra Sísera. O ribeiro de Quisom os arrastou, aquele antigo ribeiro, o ribeiro de Quisom.” A maioria vê nisso uma tempestade que inundou o Quisom e atolou os carros; Josefo fala de granizo e chuva no rosto dos inimigos."
    - "Jabim reinava em Hazor, 40 km ao norte; Harosete dos Gentios, a base de Sísera, não foi achada: propuseram-se Tell el-Ahwat e el-Harithiyeh, junto ao Quisom, e pode ser um distrito, não uma cidade. A terra de Baraque, Quedes-Naftali, é situada no mapa em Khirbet Qedish, acima do mar da Galileia, a 16 km do Tabor, por quem acha longe demais a grande Quedes da Alta Galileia; a identificação é disputada. A data é incerta, no século XII a.C. na maioria dos cálculos, e o Cântico de Débora está entre os mais antigos poemas hebraicos; o ano convencional dos juízes no mapa é cerca de 1150 a.C. O Tabor tornou-se depois o monte tradicional da Transfiguração, o que é questão à parte."
  de:
    - "In der Jesreel-Ebene, zwischen dem Tabor und dem Fluss Kischon, im Norden des heutigen Israel. Barak sammelte zehntausend Mann auf dem Tabor, dem runden, 575 m hohen Berg, der allein am nordöstlichen Rand der Ebene aufragt, 9 km östlich von Nazareth; Siseras neunhundert Wagen kamen an den Kischon, den Bach, der die Ebene nach Westen zum Meer bei Haifa entwässert. Das Lied der Debora legt den Kampf „zu Thaanach am Wasser Megiddos“, etwa 24 km südwestlich des Tabor am südlichen Rand der Ebene. Debora selbst richtete weit im Süden, unter ihrer Palme zwischen Rama und Bethel im Bergland Ephraim, etwa 90 km vom Tabor."
    - "Deboras Auftrag an Barak lautete: „Gehe hin und zieh auf den Berg Thabor und nimm zehntausend Mann mit dir von den Kindern Naphthali und Sebulon? Denn ich will Sisera, den Feldhauptmann Jabins, zu dir ziehen an das Wasser Kison mit seinen Wagen und mit seiner Menge und will ihn in deine Hände geben.“ Sisera rief „neunhundert eiserne Wagen, und alles Volk, das mit ihm war, von Haroseth der Heiden an das Wasser Kison“; „Also zog Barak von dem Berge Thabor herab und die zehntausend Mann ihm nach“, und der Herr „erschreckte den Sisera samt allen seinen Wagen“. Das Lied: „Vom Himmel ward wider sie gestritten; die Sterne in ihren Bahnen stritten wider Sisera. Der Bach Kison wälzte sie, der Bach Kedumin, der Bach Kison.“ Die meisten lesen darin ein Unwetter, das den Kischon überflutete und die Wagen festsetzte; Josephus spricht von Hagel und Regen ins Gesicht der Feinde."
    - "Jabin herrschte in Hazor, 40 km nördlich; Haroscheth-Gojim, Siseras Standort, ist nicht gefunden: Tell el-Ahwat und el-Haritije am Kischon sind vorgeschlagen worden, und es kann ein Bezirk statt einer Stadt gewesen sein. Baraks Heimat, Kedesch in Naftali, setzen diejenigen, denen das große Kedesch in Obergaliläa zu weit entfernt scheint, auf der Karte bei Chirbet Kedisch über dem See Genezareth an, 16 km vom Tabor; die Gleichsetzung ist umstritten. Das Datum ist unsicher, nach den meisten Berechnungen im 12. Jahrhundert v. Chr., und das Lied der Debora zählt zu den ältesten hebräischen Gedichten; das herkömmliche Jahr der Karte für die Richter ist etwa 1150 v. Chr. Der Tabor wurde später der überlieferte Berg der Verklärung, was eine eigene Frage ist."
  fr:
    - "Dans la plaine de Jizreel, entre le mont Thabor et le torrent de Kison, dans le nord de l’Israël actuel. Barak rassembla dix mille hommes sur le Thabor, colline ronde de 575 m qui se dresse isolée au bord nord-est de la vallée, à 9 km à l’est de Nazareth ; les neuf cents chars de Sisera vinrent au Kison, le cours d’eau qui draine la vallée vers l’ouest jusqu’à la mer, à Haïfa. Le Cantique de Débora place le combat « à Thaanac, aux eaux de Meguiddo », à quelque 24 km au sud-ouest du Thabor, sur le bord sud de la vallée. Débora elle-même jugeait loin au sud, sous son palmier entre Rama et Béthel, dans les collines d’Éphraïm, à environ 90 km du Thabor."
    - "Débora ordonna à Barak : « Va, dirige-toi sur le mont Thabor, et prends avec toi dix mille hommes des enfants de Nephthali et des enfants de Zabulon ; j’attirerai vers toi, au torrent de Kison, Sisera, chef de l’armée de Jabin, avec ses chars et ses troupes, et je le livrerai entre tes mains. » Sisera rassembla « neuf cents chars de fer, et tout le peuple qui était avec lui, depuis Haroscheth-Goïm jusqu’au torrent de Kison » ; « Barak descendit du mont Thabor, ayant dix mille hommes à sa suite », et l’Éternel « mit en déroute … Sisera, tous ses chars et tout le camp ». Le Cantique : « Des cieux on combattit, de leurs sentiers les étoiles combattirent contre Sisera. Le torrent de Kison les a entraînés, le torrent des anciens temps, le torrent de Kison. » La plupart y lisent un orage qui fit déborder le Kison et enlisa les chars ; Josèphe parle de grêle et de pluie au visage des ennemis."
    - "Jabin régnait à Hatsor, à 40 km au nord ; Haroscheth-Goïm, la base de Sisera, n’a pas été retrouvée : Tell el-Ahwat et el-Harithiyeh, près du Kison, ont été proposés, et ce peut être un district plutôt qu’une ville. La patrie de Barak, Kédesch-Nephthali, est placée sur la carte à Khirbet Qedish, au-dessus de la mer de Galilée, à 16 km du Thabor, par ceux qui jugent le grand Kédesch de Haute Galilée trop éloigné ; l’identification est discutée. La date est incertaine, au XIIe siècle av. J.-C. dans la plupart des calculs, et le Cantique de Débora compte parmi les plus anciens poèmes hébreux ; l’année conventionnelle de la carte pour les juges est vers 1150 av. J.-C. Le Thabor devint plus tard la montagne traditionnelle de la Transfiguration, ce qui est une question à part."
  pl:
    - "W Dolinie Jizreel, między Górą Tabor a rzeką Kiszon, na północy dzisiejszego Izraela. Barak zebrał dziesięć tysięcy ludzi na Taborze, okrągłym wzgórzu o wysokości 575 m, które wznosi się samotnie na północno-wschodnim skraju doliny, 9 km na wschód od Nazaretu; dziewięćset rydwanów Sisery dotarło nad Kiszon, potok odwadniający dolinę na zachód do morza w Hajfie. Pieśń Debory umieszcza walkę „w Tanach u wód Magieddo”, około 24 km na południowy zachód od Taboru na południowym skraju doliny. Sama Debora sądziła daleko na południu, pod swoją palmą między Ramą a Betel w górach Efraima, około 90 km od Taboru."
    - "Debora kazała Barakowi: „Izali nie rozkazał Pan, Bóg Izraelski: idź, a zbierz lud na górze Tabor, a weźmij z sobą dziesięć tysięcy mężów z synów Neftalimowych, i z synów Zabulonowych? I przywiodę do ciebie ku rzece Cyson Sysarę, hetmana wojska Jabinowego, i wozy jego, i mnóstwo jego, a podam go w ręce twoje.” Sisera zebrał „dziewięć set wozów żelaznych, i wszystek lud, który miał ze sobą od Haroset pogańskiego aż do rzeki Cyson”; „A tak zszedł Barak z góry Tabor, a dziesięć tysięcy mężów za nim”, a „poraził Pan Sysarę, i wszystkie wozy”. Pieśń: „Z nieba walczono: gwiazdy z miejsc swoich walczyły z Sysarą. Potok Cyson porwał je, potok Kiedumim, potok Cyson.” Większość czyta to jako burzę, która zalała Kiszon i uwięziła rydwany w błocie; Józef Flawiusz mówi o gradzie i deszczu w twarze wrogów."
    - "Jabin panował w Chasorze, 40 km na północ; Charoszet Hagojim, baza Sisery, nie został odnaleziony: proponowano Tell el-Ahwat i el-Harithiyeh nad Kiszonem, a może to raczej okręg niż miasto. Dom Baraka, Kedesz Neftalego, umieszczają na mapie w Chirbet Kedisz nad Jeziorem Galilejskim, 16 km od Taboru, ci, którzy uważają wielki Kedesz w Górnej Galilei za zbyt odległy; utożsamienie jest sporne. Data jest niepewna, w XII wieku p.n.e. według większości rachub, a Pieśń Debory zalicza się do najstarszych poematów hebrajskich; umowny rok sędziów na mapie to około 1150 p.n.e. Tabor stał się później tradycyjną górą Przemienienia, co jest osobnym pytaniem."
  it:
    - "Nella valle di Izreel, tra il Monte Tabor e il fiume Kison, nel nord dell’Israele odierno. Barak radunò diecimila uomini sul Tabor, il colle rotondo di 575 m che si leva isolato al margine nord-orientale della valle, a 9 km a est di Nazaret; i novecento carri di Sisara giunsero al Kison, il torrente che drena la valle verso ovest fino al mare a Haifa. Il Cantico di Debora colloca il combattimento «a Taanac, presso le acque di Meghiddo», a circa 24 km a sud-ovest del Tabor sul bordo meridionale della valle. Debora stessa giudicava molto più a sud, sotto la sua palma tra Rama e Betel sui monti di Efraim, a circa 90 km dal Tabor."
    - "L’ordine di Debora a Barak fu: «Va’, raduna sul monte Tabor e prendi teco diecimila uomini de’ figliuoli di Neftali e de’ figliuoli di Zabulon. E io attirerò verso te, al torrente Kison, Sisera, capo dell’esercito di Iabin, coi suoi carri e la sua numerosa gente, e io lo darò nelle tue mani». Sisara radunò «novecento carri di ferro, e tutta la gente ch’era seco, da Harosceth-Goim fino al torrente Kison»; Barak «scese dal monte Tabor, seguito da diecimila uomini», e l’Eterno «mise in rotta, davanti a Barak, Sisera con tutti i suoi carri». Il Cantico: «Dai cieli si combatté: gli astri, nel loro corso, combatteron contro Sisera. Il torrente di Kison li travolse, l’antico torrente, il torrente di Kison». I più vi leggono una tempesta che fece straripare il Kison e impantanò i carri; Giuseppe Flavio parla di grandine e pioggia in faccia al nemico."
    - "Iabin regnava a Asor, a 40 km a nord; Harosceth-Goim, la base di Sisara, non è stata trovata: sono stati proposti Tell el-Ahwat e el-Harithiyeh presso il Kison, e potrebbe essere un distretto più che una città. La patria di Barak, Kedes di Neftali, è collocata sulla mappa a Khirbet Qedish sopra il lago di Tiberiade, a 16 km dal Tabor, da chi ritiene la grande Kedes dell’Alta Galilea troppo lontana; l’identificazione è discussa. La data è incerta, XII secolo a.C. secondo la maggior parte dei computi, e il Cantico di Debora è contato tra le più antiche poesie ebraiche; l’anno convenzionale della mappa per i giudici è circa il 1150 a.C. Il Tabor divenne poi il monte tradizionale della Trasfigurazione, che è una questione a parte."
  nl:
    - "In de vallei van Jizreël, tussen de berg Tabor en de rivier Kison, in het noorden van het huidige Israël. Barak verzamelde tienduizend man op de Tabor, de ronde heuvel van 575 m die alleen oprijst aan de noordoostrand van de vallei, 9 km ten oosten van Nazareth; Sisera’s negenhonderd strijdwagens kwamen naar de Kison, de beek die de vallei naar het westen afwatert op zee bij Haifa. Het lied van Debora plaatst de strijd “te Thaanach aan de wateren van Megiddo”, zo’n 24 km ten zuidwesten van de Tabor aan de zuidrand van de vallei. Debora zelf sprak recht ver naar het zuiden, onder haar palmboom tussen Rama en Bethel in het gebergte van Efraïm, ongeveer 90 km van de Tabor."
    - "Deboras bevel aan Barak: “Ga heen en trek op den berg Thabor, en neem met u tien duizend man, van de kinderen van Nafthali, en van de kinderen van Zebulon? En Ik zal aan de beek Kison tot u trekken Sisera, den krijgsoverste van Jabin, met zijn wagenen en zijn menigte; en Ik zal hem in uw hand geven?” Sisera riep “negenhonderd ijzeren wagenen, en al het volk, dat met hem was, van Haroseth der heidenen tot de beek Kison” bijeen; “Zo trok Barak van den berg Thabor af, en tien duizend man achter hem”, en de HEER “versloeg Sisera, met al zijn wagenen”. Het lied: “Van den hemel streden zij, de sterren uit haar loopplaatsen streden tegen Sisera. De beek Kison wentelde hen weg, de beek Kedumin, de beek Kison.” De meesten lezen een storm die de Kison deed overstromen en de wagens vastliep in het slijk; Josephus noemt hagel en regen in het gezicht van de vijand."
    - "Jabin regeerde te Hazor, 40 km naar het noorden; Haroset-Haggojim, Sisera’s basis, is niet gevonden: Tell el-Ahwat en el-Harithiyeh aan de Kison zijn voorgesteld, en het kan een streek zijn geweest in plaats van een stad. Baraks thuisstad, Kedes in Naftali, wordt op de kaart geplaatst bij Khirbet Qedish boven het Meer van Galilea, 16 km van de Tabor, door wie het grote Kedes van Boven-Galilea te ver vinden; de identificatie is omstreden. De datum is onzeker, op de meeste berekeningen in de 12e eeuw v.Chr., en het lied van Debora geldt als een van de oudste Hebreeuwse gedichten; het conventionele jaar van de kaart voor de richters is omstreeks 1150 v.Chr. De Tabor werd later de traditionele berg van de verheerlijking, wat een vraag op zich is."
  cs:
    - "V Jizreelském údolí, mezi horou Tábor a řekou Kíšon, na severu dnešního Izraele. Bárak shromáždil na Táboru deset tisíc mužů, na kulatém pahorku vysokém 575 m, který se osaměle zdvíhá na severovýchodním okraji údolí, 9 km východně od Nazareta; Siserových devět set vozů přijelo ke Kíšonu, potoku, který odvádí údolí na západ k moři u Haify. Píseň Deboriny klade boj „v Tanach při vodách Mageddo“, asi 24 km jihozápadně od Táboru na jižním okraji údolí. Sama Debora soudila daleko na jihu, pod svou palmou mezi Rámou a Bét-elem v horách Efrajim, asi 90 km od Táboru."
    - "Deborin příkaz Bárakovi zněl: „Jdi, a shromáždě lid na horu Tábor, vezmi s sebou deset tisíc mužů z synů Neftalím a z synů Zabulon. Nebo přitáhnu k tobě ku potoku Císon Zizaru kníže vojska Jabínova, a vozy jeho i množství jeho, a dám jej v ruku tvou.“ Sisera shromáždil „devět set vozů železných, a všecken lid, kterýž měl s sebou z Haroset pohanského, ku potoku Císon“; „I sstoupil Barák s hory Tábor, a deset tisíc mužů za ním“ a „porazil Hospodin Zizaru a všecky ty vozy“. Píseň: „S nebe bojováno, hvězdy z míst svých bojovaly proti Zizarovi. Potok Císon smetl je, potok Kedumim, potok Císon.“ Většina to čte jako bouři, která zaplavila Kíšon a uvázila vozy v bahně; Josephus Flavius mluví o krupobití a dešti do tváří nepřátel."
    - "Jabín vládl v Chacoru, 40 km na sever; Charošet pohanů, Siserova základna, nebyl nalezen: navrhovány byly Tell al-Ahvat a al-Charitíja u Kíšonu a může jít spíše o oblast než o město. Bárakův domov, Kedeš v Neftalí, je na mapě umístěn do Chirbet Qedíš nad Galilejským jezerem, 16 km od Táboru, těmi, kdo soudí, že velký Kedeš v Horní Galileji je příliš daleko; ztotožnění je sporné. Datum je nejisté, podle většiny výpočtů 12. století př. n. l., a Píseň Deboriny patří k nejstarším hebrejským básním; smluvní rok soudců na mapě je asi 1150 př. n. l. Tábor se později stal tradiční horou Proměnění, což je samostatná otázka."
