id: where-was-ur-of-the-chaldees
question:
  en: "Where was Ur of the Chaldees?"
  ru: "Где находился Ур Халдейский?"
  uk: "Де був Ур Халдейський?"
  es: "¿Dónde estaba Ur de los caldeos?"
  pt: "Onde ficava Ur dos Caldeus?"
  de: "Wo lag Ur in Chaldäa?"
  fr: "Où se trouvait Ur en Chaldée ?"
  pl: "Gdzie leżało Ur Chaldejskie?"
  it: "Dov’era Ur dei Caldei?"
  cs: "Kde ležel Ur Kaldejských?"
  nl: "Waar lag Ur der Chaldeeën?"
answer:
  en:
    - "Ur of the Chaldees, the city Abraham's family left for Canaan, is usually identified with Tell el-Muqayyar in the far south of Iraq, 16 km south-west of Nasiriyah, where the lower stages of the ziggurat of Ur-Nammu still stand; the identification is debated."
    - 'Genesis says: "And Terah took Abram his son … and they went forth with them from Ur of the Chaldees, to go into the land of Canaan; and they came unto Haran, and dwelt there." In antiquity Ur stood on the Euphrates near the head of the Gulf; the river and the coast have since moved away. It was one of the great Sumerian cities, sacred to the moon god, and the seat of the Third Dynasty of Ur (c. 2112–2004 BC in the middle chronology). Leonard Woolley''s excavations of 1922–1934 uncovered its Royal Cemetery and the ziggurat.'
    - "Most scholars take this southern Ur to be the biblical one, but an old tradition points to Urfa (Şanlıurfa) in south-eastern Turkey, and some scholars have argued for an Ur in northern Mesopotamia, nearer Haran. The map shows the southern site. From there to Haran is about 925 km in a straight line."
  ru:
    - "Ур Халдейский, из которого семья Авраама вышла в Ханаан, обычно отождествляют с Телль-эль-Мукайяром на крайнем юге Ирака, в 16 км к юго-западу от Насирии, где до сих пор стоят нижние ярусы зиккурата Ур-Намму; отождествление оспаривается."
    - "Книга Бытия говорит: «И взял Фарра Аврама, сына своего… и вышел с ними из Ура Халдейского, чтобы идти в землю Ханаанскую; но, дойдя до Харрана, они остановились там». В древности Ур стоял на Евфрате недалеко от Персидского залива; с тех пор и река, и берег отодвинулись. Это был один из великих шумерских городов, посвящённый богу луны, столица III династии Ура (ок. 2112–2004 гг. до н. э. по средней хронологии). Раскопки Леонарда Вулли 1922–1934 годов открыли Царское кладбище и зиккурат."
    - "Большинство учёных считают библейским именно этот южный Ур, но старинное предание указывает на Урфу (Шанлыурфа) на юго-востоке Турции, а некоторые исследователи помещают Ур на севере Месопотамии, ближе к Харрану. Карта показывает южный Ур. Оттуда до Харрана около 925 км по прямой."
  uk:
    - "Ур Халдейський, місто, яке покинула родина Авраама, прямуючи до Ханаану, зазвичай ототожнюють із Телль-ель-Мукаяром на крайньому півдні Іраку, за 16 км на південний захід від Насирії, де нижні яруси зіґурата Ур-Намму досі стоять; ототожнення обговорюють."
    - "Книга Буття каже: «І взяв Тара Аврама ... та й вивів їх із Ура Халдейського, щоб ійти в землю Канаанську, і прийшли в Гаран та й осїлись там.» У давнину Ур стояв на Євфраті біля вершини затоки; річка й узбережжя відтоді відійшли. Це було одне з великих шумерських міст, присвячене богові місяця, і осідок Третьої династії Ура (бл. 2112–2004 рр. до н. е. за середньою хронологією). Розкопки Леонарда Вуллі 1922–1934 рр. відкрили його Царський цвинтар і зіґурат."
    - "Більшість учених вважають цей південний Ур біблійним, але давній переказ вказує на Урфу (Шанлиурфу) на південному сході Туреччини, і дехто з учених обстоював Ур у північній Месопотамії, ближче до Харана. Мапа показує південне місце. Звідти до Харана приблизно 925 км по прямій."
  es:
    - "Ur de los caldeos, la ciudad que la familia de Abraham dejó para ir a Canaán, se identifica por lo común con Tell el-Muqayyar, en el extremo sur de Irak, a 16 km al suroeste de Nasiriya, donde aún se alzan los cuerpos inferiores del zigurat de Ur-Nammu; la identificación se discute."
    - "El Génesis dice: «Y tomó Thare á Abram su hijo… y salió con ellos de Ur de los Caldeos, para ir á la tierra de Canaán: y vinieron hasta Harán, y asentaron allí». En la Antigüedad Ur se alzaba junto al Éufrates, cerca de la cabecera del golfo; el río y la costa se han alejado desde entonces. Fue una de las grandes ciudades sumerias, consagrada al dios lunar, y la sede de la Tercera dinastía de Ur (h. 2112–2004 a. C. en la cronología media). Las excavaciones de Leonard Woolley de 1922–1934 sacaron a la luz su Cementerio Real y el zigurat."
    - "La mayoría de los estudiosos toman esta Ur meridional por la bíblica, pero una antigua tradición señala Urfa (Şanlıurfa), en el sureste de Turquía, y algunos estudiosos han defendido una Ur en el norte de Mesopotamia, más cerca de Harán. El mapa muestra el sitio meridional. De allí a Harán hay unos 925 km en línea recta."
  pt:
    - "Ur dos Caldeus, a cidade que a família de Abraão deixou rumo a Canaã, é geralmente identificada com Tell el-Muqayyar, no extremo sul do Iraque, a 16 km a sudoeste de Nassíria, onde ainda estão de pé os andares inferiores do zigurate de Ur-Nammu; a identificação é debatida."
    - "O Gênesis diz: “Terá tomou seu filho Abrão… Eles saíram de Ur dos Caldeus para ir à terra de Canaã. Chegaram a Harã e habitaram ali.” Na Antiguidade, Ur ficava no Eufrates, perto da cabeceira do Golfo; o rio e a costa se afastaram desde então. Era uma das grandes cidades sumérias, consagrada ao deus-lua, e a sede da Terceira Dinastia de Ur (c. 2112–2004 a.C. na cronologia média). As escavações de Leonard Woolley, em 1922–1934, trouxeram à luz seu Cemitério Real e o zigurate."
    - "A maioria dos estudiosos toma este Ur meridional pelo bíblico, mas uma antiga tradição aponta Urfa (Şanlıurfa), no sudeste da Turquia, e alguns estudiosos defenderam um Ur no norte da Mesopotâmia, mais perto de Harã. O mapa mostra o sítio meridional. De lá até Harã são cerca de 925 km em linha reta."
  de:
    - "Ur in Chaldäa, die Stadt, die Abrahams Familie Richtung Kanaan verließ, wird meist mit Tell el-Muqayyar im äußersten Süden des Irak gleichgesetzt, 16 km südwestlich von Nasiriyya, wo die unteren Stufen der Zikkurat des Ur-Nammu noch stehen; die Gleichsetzung ist umstritten."
    - "Die Genesis sagt: „Da nahm Tharah seinen Sohn Abram … und führte sie aus Ur in Chaldäa, daß er ins Land Kanaan zöge; und sie kamen gen Haran und wohnten daselbst.“ In der Antike lag Ur am Euphrat nahe dem Kopfende des Golfs; Fluss und Küste sind seither weggewandert. Es war eine der großen sumerischen Städte, dem Mondgott heilig, und Sitz der Dritten Dynastie von Ur (etwa 2112–2004 v. Chr. nach der mittleren Chronologie). Leonard Woolleys Grabungen von 1922–1934 legten seinen Königsfriedhof und die Zikkurat frei."
    - "Die meisten Gelehrten halten dieses südliche Ur für das biblische, doch eine alte Überlieferung weist auf Urfa (Şanlıurfa) im Südosten der Türkei, und einige Forscher haben für ein Ur im nördlichen Mesopotamien nahe Haran argumentiert. Die Karte zeigt die südliche Stätte. Von dort bis Haran sind es in der Luftlinie etwa 925 km."
  fr:
    - "Ur en Chaldée, la ville que la famille d’Abraham quitta pour Canaan, est généralement identifiée à Tell el-Muqayyar, tout au sud de l’Irak, à 16 km au sud-ouest de Nassiriya, où se dressent encore les étages inférieurs de la ziggourat d’Ur-Nammu ; l’identification est discutée."
    - "La Genèse dit : « Térach prit Abram, son fils, … Ils sortirent ensemble d’Ur en Chaldée, pour aller au pays de Canaan. Ils vinrent jusqu’à Charan, et ils y habitèrent. » Dans l’Antiquité, Ur se trouvait sur l’Euphrate, près du fond du Golfe ; le fleuve et la côte se sont éloignés depuis. C’était l’une des grandes cités sumériennes, consacrée au dieu-lune, et le siège de la troisième dynastie d’Ur (vers 2112-2004 av. J.-C. dans la chronologie moyenne). Les fouilles de Leonard Woolley en 1922-1934 ont mis au jour son Cimetière royal et la ziggourat."
    - "La plupart des spécialistes tiennent cet Ur méridional pour l’Ur biblique, mais une ancienne tradition désigne Urfa (Şanlıurfa), dans le sud-est de la Turquie, et certains ont plaidé pour un Ur du nord de la Mésopotamie, plus proche de Charan. La carte montre le site méridional. De là à Charan, il y a environ 925 km à vol d’oiseau."
  pl:
    - "Ur Chaldejskie, miasto, które rodzina Abrahama opuściła w drodze do Kanaanu, utożsamia się zwykle z Tell el-Muqayyar na dalekim południu Iraku, 16 km na południowy zachód od Nasirijji, gdzie wciąż stoją dolne stopnie zikkuratu Ur-Nammu; utożsamienie jest dyskutowane."
    - "Księga Rodzaju mówi: „Wziął tedy Tare Abrama syna swego… i wyszli społu z Ur Chaldejskiego, aby szli do ziemi Chananejskiej; a przyszli aż do Haranu, i mieszkali tam”. W starożytności Ur stało nad Eufratem blisko wierzchołka Zatoki; rzeka i wybrzeże odsunęły się od niego od tamtej pory. Było jednym z wielkich miast sumeryjskich, poświęconym bogu księżyca, i siedzibą III dynastii z Ur (ok. 2112–2004 p.n.e. w chronologii średniej). Wykopaliska Leonarda Woolleya z lat 1922–1934 odsłoniły jego Cmentarz Królewski i zikkurat."
    - "Większość uczonych uważa to południowe Ur za biblijne, lecz stara tradycja wskazuje Urfę (Şanlıurfa) w południowo-wschodniej Turcji, a niektórzy uczeni dowodzili, że Ur leżało w północnej Mezopotamii, bliżej Charanu. Mapa pokazuje stanowisko południowe. Stamtąd do Charanu jest około 925 km w linii prostej."
  it:
    - "Ur dei Caldei, la città che la famiglia di Abramo lasciò per Canaan, si identifica di solito con Tell el-Muqayyar nell’estremo sud dell’Iraq, a 16 km a sud-ovest di Nasiriyah, dove sorgono ancora i piani inferiori della ziggurat di Ur-Nammu; l’identificazione è discussa."
    - "La Genesi dice: «E Terah prese Abramo, suo figliuolo… e uscirono insieme da Ur de’ Caldei per andare nel paese di Canaan; e, giunti a Charan, dimorarono quivi». Nell’antichità Ur sorgeva sull’Eufrate vicino alla testata del Golfo; il fiume e la costa si sono da allora allontanati. Era una delle grandi città sumere, sacra al dio lunare, e la sede della Terza dinastia di Ur (2112–2004 a.C. circa nella cronologia media). Gli scavi di Leonard Woolley del 1922–1934 portarono alla luce il suo Cimitero Reale e la ziggurat."
    - "La maggior parte degli studiosi ritiene che questa Ur meridionale sia quella biblica, ma un’antica tradizione indica Urfa (Şanlıurfa) nella Turchia sud-orientale, e alcuni studiosi hanno sostenuto un’Ur nella Mesopotamia settentrionale, più vicina a Carran. La mappa mostra il sito meridionale. Da lì a Carran ci sono circa 925 km in linea d’aria."
  cs:
    - "Ur Kaldejských, město, které Abrahamova rodina opustila směrem do Kanaánu, se obvykle ztotožňuje s Tell el-Muqayyar na dalekém jihu Iráku, 16 km jihozápadně od Násiríje, kde dosud stojí dolní stupně zikkuratu Ur-Nammua; ztotožnění je sporné."
    - "Genesis praví: „I vzal Táre Abrama syna svého… a vyšli spolu z Ur Kaldejských, aby se brali do země Kananejské, a přišli až do Cháran, a bydlili tam.“ Ve starověku stál Ur na Eufratu poblíž čela zálivu; řeka i pobřeží se od té doby vzdálily. Byl jedním z velkých sumerských měst, zasvěceným bohu měsíce, a sídlem Třetí dynastie z Uru (asi 2112–2004 př. n. l. podle střední chronologie). Vykopávky Leonarda Woolleyho v letech 1922–1934 odkryly jeho královské pohřebiště a zikkurat."
    - "Většina badatelů pokládá tento jižní Ur za biblický, ale stará tradice ukazuje na Urfu (Şanlıurfa) v jihovýchodním Turecku a někteří badatelé hájili Ur v severní Mezopotámii, blíže Cháranu. Mapa ukazuje jižní místo. Odtud do Cháranu je to vzdušnou čarou asi 925 km."
  nl:
    - "Ur der Chaldeeën, de stad die Abrahams familie verliet voor Kanaän, wordt gewoonlijk geïdentificeerd met Tell el-Muqayyar in het uiterste zuiden van Irak, 16 km ten zuidwesten van Nasiriyah, waar de onderste niveaus van de ziggoerat van Ur-Nammu nog staan; de identificatie wordt betwist."
    - "Genesis zegt: “En Terah nam Abram, zijn zoon, … en zij togen met hen uit Ur der Chaldeeën, om te gaan naar het land Kanaan; en zij kwamen tot Haran, en woonden aldaar.” In de oudheid lag Ur aan de Eufraat nabij het noordelijke uiteinde van de Golf; de rivier en de kust zijn sindsdien weggeschoven. Het was een van de grote Sumerische steden, gewijd aan de maangod, en de zetel van de Derde dynastie van Ur (ca. 2112–2004 v.Chr. in de middenchronologie). De opgravingen van Leonard Woolley in 1922–1934 legden de Koninklijke Begraafplaats en de ziggoerat bloot."
    - "De meeste geleerden houden dit zuidelijke Ur voor het bijbelse, maar een oude overlevering wijst naar Urfa (Şanlıurfa) in het zuidoosten van Turkije, en enkele geleerden hebben gepleit voor een Ur in Noord-Mesopotamië, dichter bij Haran. De kaart toont de zuidelijke plaats. Van daar naar Haran is het hemelsbreed ongeveer 925 km."
