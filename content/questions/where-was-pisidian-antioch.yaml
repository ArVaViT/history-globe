id: where-was-pisidian-antioch
question:
  en: "Where was Pisidian Antioch?"
  ru: "Где находилась Антиохия Писидийская?"
  uk: "Де була Пісідійська Антіохія?"
  es: "¿Dónde estaba Antioquía de Pisidia?"
  pt: "Onde ficava Antioquia da Pisídia?"
  de: "Wo lag Antiochia in Pisidien?"
  fr: "Où se trouvait Antioche de Pisidie ?"
  pl: "Gdzie leżała Antiochia Pizydyjska?"
  it: "Dov’era Antiochia di Pisidia?"
  cs: "Kde ležela Antiochie Pisidská?"
  nl: "Waar lag Antiochië in Pisidië?"
  sv: "Var låg Antiochia i Pisidien?"
  nb: "Hvor lå Antiokia i Pisidia?"
  tl: "Nasaan ang Antioquia ng Pisidia?"
  da: "Hvor lå Antiokia i Pisidien?"
  sr: "Где је била Антиохија Писидијска?"
  hu: "Hol volt a piszídiai Antiókhia?"
  fi: "Missä Pisidian Antiokia sijaitsi?"
  vi: "An-ti-ốt xứ Bi-si-đi ở đâu?"
  ro: "Unde se afla Antiohia Pisidiei?"
  bg: "Къде се е намирала Писидийска Антиохия?"
answer:
  en:
    - "Pisidian Antioch stood on a hill about a kilometre north-east of the town of Yalvaç in the lake district of west-central Turkey, where its ruins can be visited; the map point stands on them. It lay about 153 km north of Perga, from which Paul climbed to it over the Taurus, about 124 km west-north-west of Iconium and about 815 km from Jerusalem, all in a straight line. Strictly it was a city of Phrygia on the border of Pisidia, “Antioch near Pisidia” in Strabo's phrase; it is not the Syrian Antioch on the Orontes, about 500 km away, from which the journey set out."
    - "Paul and Barnabas came here on their first journey: “when they departed from Perga, they came to Antioch in Pisidia, and went into the synagogue on the sabbath day, and sat down.” Invited to speak after the reading of the law and the prophets, Paul gave the first of his sermons that Acts reports in full, telling Israel's story from Egypt to David and on to Jesus. “The next sabbath day came almost the whole city together to hear the word of God”; when the Jews opposed them, Paul and Barnabas said, “lo, we turn to the Gentiles”, and after they were expelled they “shook off the dust of their feet against them, and came unto Iconium.”"
    - "Augustus made the city a Roman colony of veterans, Colonia Caesarea, after 25 BC, and excavations have uncovered its temple of Augustus, a colonnaded square named after Tiberius, a monumental gate by which fragments of a Latin copy of Augustus' Res Gestae were found in 1914, an aqueduct and a great basilica of the fourth century. Inscriptions of the city name members of a senatorial family, the Sergii Paulli, and William Ramsay linked them with Sergius Paulus, the proconsul of Cyprus who had just believed; some take this as the reason Paul went on to Antioch, others find the link too slight to bear the weight."
  ru:
    - "Антиохия Писидийская стояла на холме примерно в километре к северо-востоку от городка Ялвач в Озёрном крае на западе центральной Турции; её развалины открыты для посещения, и точка карты стоит на них. Она лежала примерно в 153 км к северу от Пергии, откуда Павел поднялся к ней через Тавр, примерно в 124 км к западу-северо-западу от Иконии и примерно в 815 км от Иерусалима — всё по прямой. Строго говоря, это был город Фригии на границе с Писидией, «Антиохия близ Писидии», как пишет Страбон; не путать с сирийской Антиохией на Оронте, примерно в 500 км отсюда, откуда путешествие началось."
    - "Павел и Варнава пришли сюда в первом путешествии: «проходя от Пергии, прибыли в Антиохию Писидийскую и, войдя в синагогу в день субботний, сели». Приглашённый сказать слово после чтения закона и пророков, Павел произнёс первую из своих проповедей, которые Деяния передают целиком, — рассказ об Израиле от Египта до Давида и дальше до Иисуса. «В следующую субботу почти весь город собрался слушать слово Божие»; когда Иудеи воспротивились, Павел и Варнава сказали: «вот, мы обращаемся к язычникам», а изгнанные, «отрясши на них прах от ног своих, пошли в Иконию»."
    - "После 25 г. до н. э. Август сделал город римской колонией ветеранов, Colonia Caesarea, и раскопки открыли его храм Августа, площадь с колоннадой, названную в честь Тиверия, парадные ворота, у которых в 1914 г. нашли фрагменты латинской копии «Деяний Августа», акведук и большую базилику IV века. Надписи города называют членов сенаторского рода Сергиев Павлов, и Уильям Рамзай связал их с Сергием Павлом, только что уверовавшим проконсулом Кипра; одни видят в этом причину, по которой Павел пошёл в Антиохию, другие считают эту связь слишком зыбкой."
  uk:
    - "Пісідійська Антіохія стояла на пагорбі приблизно за кілометр на північний схід від міста Ялвач в озерному краї на захід від центру Туреччини, де її руїни можна відвідати; точка на мапі стоїть на них. Вона лежала приблизно за 153 км на північ від Перге, звідки Павло піднявся до неї через Тавр, приблизно за 124 км на захід-північний захід від Іконії і приблизно за 815 км від Єрусалима — усе по прямій. Строго кажучи, це було місто Фрігії на кордоні Пісідії, «Антіохія біля Пісідії» за висловом Страбона; це не сирійська Антіохія на Оронті, приблизно за 500 км звідти, з якої почалася подорож."
    - "Павло й Варнава прийшли сюди під час першої подорожі: «Вони ж, перейшовши з Пергиї, прибули в Антиохию Писидийську, і ввійшовши в школу субітнього дня, посїдали.» Запрошений говорити після читання Закону й Пророків, Павло виголосив першу зі своїх проповідей, яку Дії наводять повністю, розповівши історію Ізраїлю від Єгипту до Давида й далі до Ісуса. «А другої суботи мало не ввесь город зібрав ся слухати слово Боже»; коли юдеї виступили проти них, Павло й Варнава сказали: «ось обертаємось до поган», а після того як їх вигнали, вони, «обтрусивши порох од ніг своїх на них, пійшли в Іконию»."
    - "Август зробив місто римською колонією ветеранів, Colonia Caesarea, після 25 р. до н. е., і розкопки відкрили його храм Августа, площу з колонадами, названу на честь Тиверія, монументальну браму, біля якої 1914 р. знайшли уламки латинського примірника «Діянь божественного Августа», акведук і велику базиліку IV ст. Написи міста називають членів сенаторського роду Сергіїв Павлів, і Вільям Рамзай пов'язав їх із Сергієм Павлом, проконсулом Кіпру, який щойно увірував; дехто бачить у цьому причину, чому Павло пішов до Антіохії, інші вважають зв'язок надто слабким, щоб витримати таку вагу."
  es:
    - "Antioquía de Pisidia se alzaba sobre una colina a un kilómetro al noreste de la población de Yalvaç, en la región de los lagos del centro-oeste de Turquía, donde se pueden visitar sus ruinas; el punto del mapa está sobre ellas. Quedaba a unos 153 km al norte de Perge, desde donde Pablo subió hasta ella por el Tauro, a unos 124 km al oesnoroeste de Iconio y a unos 815 km de Jerusalén, todo en línea recta. En rigor era una ciudad de Frigia en la frontera de Pisidia, «Antioquía junto a Pisidia» en la expresión de Estrabón; no es la Antioquía de Siria, junto al Orontes, a unos 500 km, desde la cual partió el viaje."
    - "Pablo y Bernabé llegaron aquí en su primer viaje: «pasando de Perge, llegaron á Antioquía de Pisidia, y entrando en la sinagoga un día de sábado, sentáronse». Invitado a hablar tras la lectura de la ley y los profetas, Pablo pronunció el primero de sus sermones que los Hechos refieren por entero, narrando la historia de Israel desde Egipto hasta David y hasta Jesús. «El sábado siguiente se juntó casi toda la ciudad á oir la palabra de Dios»; cuando los judíos se opusieron, Pablo y Bernabé dijeron: «he aquí, nos volvemos á los Gentiles», y tras ser expulsados, «sacudiendo en ellos el polvo de sus pies, vinieron á Iconio»."
    - "Augusto hizo de la ciudad una colonia romana de veteranos, Colonia Caesarea, después del 25 a. C., y las excavaciones han sacado a la luz su templo de Augusto, una plaza con columnata que lleva el nombre de Tiberio, una puerta monumental junto a la cual se hallaron en 1914 fragmentos de una copia latina de las Res Gestae de Augusto, un acueducto y una gran basílica del siglo IV. Inscripciones de la ciudad nombran a miembros de una familia senatorial, los Sergii Paulli, y William Ramsay los vinculó con Sergio Paulo, el procónsul de Chipre que acababa de creer; unos lo toman como la razón por la que Pablo siguió hasta Antioquía, otros hallan el vínculo demasiado débil para sostener ese peso."
  pt:
    - "Antioquia da Pisídia ficava numa colina cerca de um quilômetro a nordeste da cidade de Yalvaç, na região dos lagos do centro-oeste da Turquia, onde suas ruínas podem ser visitadas; o ponto do mapa fica sobre elas. Ficava a cerca de 153 km ao norte de Perge, de onde Paulo subiu até ela pelo Tauro, a cerca de 124 km a oés-noroeste de Icônio e a cerca de 815 km de Jerusalém, tudo em linha reta. Em rigor, era uma cidade da Frígia na fronteira da Pisídia, “Antioquia junto à Pisídia” na expressão de Estrabão; não é a Antioquia da Síria, no Orontes, a cerca de 500 km de distância, de onde a viagem partiu."
    - "Paulo e Barnabé chegaram aqui em sua primeira viagem: “passando de Perge, chegaram a Antioquia da Pisídia. Eles entraram na sinagoga no dia de sábado e se assentaram.” Convidado a falar depois da leitura da lei e dos profetas, Paulo proferiu o primeiro dos seus sermões que Atos relata por inteiro, contando a história de Israel desde o Egito até Davi e daí a Jesus. “No sábado seguinte, quase toda a cidade se reuniu para ouvir a palavra de Deus”; quando os judeus se opuseram, Paulo e Barnabé disseram: “eis que nos voltamos para os gentios”, e depois de expulsos “sacudiram o pó dos seus pés contra eles, e foram para Icônio”."
    - "Augusto fez da cidade uma colônia romana de veteranos, Colonia Caesarea, depois de 25 a.C., e as escavações trouxeram à luz seu templo de Augusto, uma praça com colunatas chamada em honra de Tibério, um portão monumental junto ao qual foram encontrados em 1914 fragmentos de uma cópia latina das Res Gestae de Augusto, um aqueduto e uma grande basílica do século IV. Inscrições da cidade nomeiam membros de uma família senatorial, os Sergii Paulli, e William Ramsay os ligou a Sérgio Paulo, o procônsul de Chipre que acabara de crer; alguns tomam isso como a razão de Paulo ter seguido para Antioquia, outros acham a ligação tênue demais para sustentar tal peso."
  de:
    - "Antiochia in Pisidien stand auf einem Hügel etwa einen Kilometer nordöstlich der Stadt Yalvaç im Seengebiet der west-zentralen Türkei, wo seine Ruinen besichtigt werden können; der Kartenpunkt steht auf ihnen. Es lag in der Luftlinie etwa 153 km nördlich von Perge, von wo Paulus über den Taurus zu ihm hinaufstieg, etwa 124 km westnordwestlich von Ikonion und etwa 815 km von Jerusalem. Streng genommen war es eine Stadt Phrygiens an der Grenze zu Pisidien, „Antiochia bei Pisidien“ in Strabons Wendung; es ist nicht das syrische Antiochia am Orontes, etwa 500 km entfernt, von dem die Reise ausgegangen war."
    - "Paulus und Barnabas kamen auf ihrer ersten Reise hierher: „Sie aber zogen weiter von Perge und kamen gen Antiochien im Lande Pisidien und gingen in die Schule am Sabbattage und setzten sich.“ Nach der Lesung von Gesetz und Propheten zum Reden aufgefordert, hielt Paulus die erste seiner Predigten, die die Apostelgeschichte vollständig wiedergibt, und erzählte Israels Geschichte von Ägypten bis David und weiter bis Jesus. „Am folgenden Sabbat aber kam zusammen fast die ganze Stadt, das Wort Gottes zu hören“; als die Juden widersprachen, sagten Paulus und Barnabas: „so wenden wir uns zu den Heiden“, und nach ihrer Vertreibung „schüttelten den Staub von ihren Füßen über sie und kamen gen Ikonion“."
    - "Augustus machte die Stadt nach 25 v. Chr. zur römischen Veteranenkolonie Colonia Caesarea, und Grabungen haben ihren Augustustempel, einen nach Tiberius benannten Säulenplatz, ein monumentales Tor, bei dem 1914 Fragmente einer lateinischen Abschrift der Res Gestae des Augustus gefunden wurden, einen Aquädukt und eine große Basilika des 4. Jahrhunderts freigelegt. Inschriften der Stadt nennen Mitglieder einer senatorischen Familie, der Sergii Paulli, und William Ramsay brachte sie mit Sergius Paulus in Verbindung, dem Prokonsul von Zypern, der eben gläubig geworden war; manche sehen darin den Grund, warum Paulus weiter nach Antiochia zog, andere halten die Verbindung für zu schwach, um das Gewicht zu tragen."
  fr:
    - "Antioche de Pisidie s’élevait sur une colline à environ un kilomètre au nord-est de la ville de Yalvaç, dans la région des lacs du centre-ouest de la Turquie, où l’on peut visiter ses ruines ; le point de la carte s’y trouve. Elle était à environ 153 km au nord de Perge, d’où Paul y monta en franchissant le Taurus, à environ 124 km à l’ouest-nord-ouest d’Icone et à environ 815 km de Jérusalem, le tout à vol d’oiseau. À proprement parler, c’était une ville de Phrygie, à la frontière de la Pisidie, « Antioche près de la Pisidie » selon l’expression de Strabon ; ce n’est pas l’Antioche de Syrie sur l’Oronte, à environ 500 km de là, d’où le voyage était parti."
    - "Paul et Barnabas y vinrent lors de leur premier voyage : « De Perge ils poursuivirent leur route, et arrivèrent à Antioche de Pisidie. Étant entrés dans la synagogue le jour du sabbat, ils s’assirent. » Invité à parler après la lecture de la loi et des prophètes, Paul prononça le premier de ses sermons que les Actes rapportent en entier, racontant l’histoire d’Israël depuis l’Égypte jusqu’à David et jusqu’à Jésus. « Le sabbat suivant, presque toute la ville se rassembla pour entendre la parole de Dieu » ; quand les Juifs leur firent opposition, Paul et Barnabas dirent : « voici, nous nous tournons vers les païens », et, chassés, ils « secouèrent contre eux la poussière de leurs pieds, et allèrent à Icone »."
    - "Auguste fit de la ville une colonie romaine de vétérans, la Colonia Caesarea, après 25 av. J.-C., et les fouilles ont mis au jour son temple d’Auguste, une place à colonnades portant le nom de Tibère, une porte monumentale près de laquelle furent trouvés en 1914 des fragments d’une copie latine des Res Gestae d’Auguste, un aqueduc et une grande basilique du IVe siècle. Des inscriptions de la ville nomment les membres d’une famille sénatoriale, les Sergii Paulli, et William Ramsay les rattacha à Sergius Paulus, le proconsul de Chypre qui venait de croire ; certains y voient la raison pour laquelle Paul poursuivit jusqu’à Antioche, d’autres jugent le lien trop mince pour porter un tel poids."
  pl:
    - "Antiochia Pizydyjska stała na wzgórzu około kilometra na północny wschód od miasta Yalvaç w regionie jezior w zachodnio-środkowej Turcji, gdzie można zwiedzać jej ruiny; punkt na mapie stoi na nich. Leżała około 153 km na północ od Perge, skąd Paweł wspiął się do niej przez Taurus, około 124 km na zachód-północny zachód od Ikonium i około 815 km od Jerozolimy, wszystko w linii prostej. Ściśle było to miasto Frygii na granicy Pizydii, „Antiochia koło Pizydii” w określeniu Strabona; nie jest to syryjska Antiochia nad Orontesem, oddalona o około 500 km, skąd wyruszyła podróż."
    - "Paweł i Barnaba przybyli tu w pierwszej podróży: „A oni odszedłszy z Pergi, przyszli do Antyjochii Pisydejskiej, a wszedłszy do bóżnicy w dzień sobotni, usiedli”. Zaproszony do przemówienia po czytaniu zakonu i proroków, Paweł wygłosił pierwsze ze swoich kazań, które Dzieje podają w całości, opowiadając dzieje Izraela od Egiptu do Dawida i do Jezusa. „A w drugi sabat niemal wszystko miasto się zgromadziło na słuchanie słowa Bożego”; gdy Żydzi im się sprzeciwili, Paweł i Barnaba rzekli: „oto się obracamy do pogan”, a po wygnaniu „otrząsnąwszy proch z nóg swoich na nie, przyszli do Ikonii”."
    - "August uczynił miasto rzymską kolonią weteranów, Colonia Caesarea, po 25 p.n.e., a wykopaliska odsłoniły jego świątynię Augusta, plac z kolumnadami nazwany od Tyberiusza, monumentalną bramę, przy której w 1914 roku znaleziono fragmenty łacińskiej kopii Res Gestae Augusta, akwedukt i wielką bazylikę z IV wieku. Napisy miasta wymieniają członków rodziny senatorskiej, Sergii Paulli, a William Ramsay powiązał ich z Sergiuszem Pawłem, prokonsulem Cypru, który właśnie uwierzył; niektórzy uważają to za powód, dla którego Paweł udał się dalej do Antiochii, inni sądzą, że związek jest zbyt słaby, by udźwignąć taki ciężar."
  it:
    - "Antiochia di Pisidia sorgeva su una collina a circa un chilometro a nord-est della città di Yalvaç nella regione dei laghi della Turchia centro-occidentale, dove le sue rovine possono essere visitate; il punto della mappa si trova su di esse. Distava circa 153 km a nord da Perge, da cui Paolo vi salì attraverso il Tauro, circa 124 km a ovest-nord-ovest da Icònio e circa 815 km da Gerusalemme, sempre in linea d’aria. A rigore era una città della Frigia al confine con la Pisidia, «Antiochia presso la Pisidia» nell’espressione di Strabone; non è l’Antiochia siriana sull’Oronte, a circa 500 km di distanza, da cui il viaggio era partito."
    - "Paolo e Barnaba vi giunsero nel loro primo viaggio: «passando oltre Perga, giunsero ad Antiochia di Pisidia; e recatisi il sabato nella sinagoga, si posero a sedere». Invitato a parlare dopo la lettura della legge e dei profeti, Paolo tenne il primo dei suoi discorsi che gli Atti riportano per intero, raccontando la storia d’Israele dall’Egitto a Davide e fino a Gesù. «Il sabato seguente, quasi tutta la città si radunò per udir la parola di Dio»; quando i Giudei si opposero, Paolo e Barnaba dissero: «ecco, noi ci volgiamo ai Gentili», e dopo essere stati scacciati, «scossa la polvere de’ lor piedi contro loro, se ne vennero ad Iconio»."
    - "Augusto fece della città una colonia romana di veterani, Colonia Caesarea, dopo il 25 a.C., e gli scavi hanno portato alla luce il suo tempio di Augusto, una piazza porticata intitolata a Tiberio, una porta monumentale presso la quale nel 1914 furono trovati frammenti di una copia latina delle Res Gestae di Augusto, un acquedotto e una grande basilica del IV secolo. Iscrizioni della città nominano i membri di una famiglia senatoria, i Sergii Paulli, e William Ramsay li collegò con Sergio Paolo, il proconsole di Cipro che aveva appena creduto; alcuni vi vedono la ragione per cui Paolo proseguì per Antiochia, altri trovano il legame troppo debole per reggere il peso."
  cs:
    - "Antiochie Pisidská stála na pahorku asi kilometr severovýchodně od města Yalvaç v jezerní oblasti západostředního Turecka, kde lze navštívit její zříceniny; bod na mapě stojí na nich. Ležela asi 153 km severně od Perge, odkud k ní Pavel stoupal přes Taurus, asi 124 km západoseverozápadně od Ikonia a asi 815 km od Jeruzaléma, vše vzdušnou čarou. Přísně vzato byla městem Frygie na hranici Pisidie, „Antiochií u Pisidie“ podle Strabónových slov; není to syrská Antiochie na Orontu, asi 500 km daleko, z níž cesta vyšla."
    - "Pavel a Barnabáš sem přišli na první cestě: „Oni pak šedše z Pergen, přišli do Antiochie Pisidické, a všedše do školy v den sobotní, posadili se.“ Vyzván promluvit po čtení zákona a proroků, pronesl Pavel první z kázání, která Skutky uvádějí celá, a vyprávěl příběh Izraele od Egypta po Davida a až k Ježíši. „V druhou pak sobotu téměř všecko město sešlo se k slyšení slova Božího“; když se Židé postavili proti nim, řekli Pavel a Barnabáš: „aj, obracíme se ku pohanům“, a když byli vyhnáni, „vyrazivše prach z noh svých na ně, přišli do Ikonie“."
    - "Augustus učinil město římskou kolonií veteránů, Colonia Caesarea, po roce 25 př. n. l. a vykopávky odkryly jeho chrám Augustův, sloupořadím obklopené náměstí pojmenované po Tiberiovi, monumentální bránu, u níž byly roku 1914 nalezeny zlomky latinského opisu Augustových Res Gestae, akvadukt a velkou baziliku ze 4. století. Nápisy města jmenují členy senátorského rodu Sergii Paulli a William Ramsay je spojil se Sergiem Paulem, kyperským prokonzulem, který právě uvěřil; někteří to berou jako důvod, proč Pavel pokračoval do Antiochie, jiní pokládají spojení za příliš slabé, než aby uneslo takovou váhu."
  nl:
    - "Antiochië in Pisidië lag op een heuvel ongeveer een kilometer ten noordoosten van de stad Yalvaç in het merengebied van west-centraal Turkije, waar de ruïnes te bezoeken zijn; het punt op de kaart staat erop. Het lag hemelsbreed ongeveer 153 km ten noorden van Perge, vanwaar Paulus er over de Taurus naartoe klom, ongeveer 124 km west-noordwestelijk van Ikonium en ongeveer 815 km van Jeruzalem. Strikt genomen was het een stad van Frygië op de grens van Pisidië, “Antiochië bij Pisidië” in de woorden van Strabo; het is niet het Syrische Antiochië aan de Orontes, ongeveer 500 km verderop, vanwaar de reis begon."
    - "Paulus en Barnabas kwamen hier op hun eerste reis: “zij, van Perge het land doorgaande, kwamen te Antiochië, een stad in Pisidië; en gegaan zijnde in de synagoge op den dag des sabbats, zaten zij neder.” Uitgenodigd om te spreken na de lezing van de wet en de profeten, hield Paulus de eerste van zijn preken die Handelingen volledig weergeeft, waarin hij Israëls geschiedenis vertelt van Egypte tot David en verder tot Jezus. “Op den volgenden sabbat kwam bijna de gehele stad samen, om het Woord Gods te horen”; toen de joden zich verzetten, zeiden Paulus en Barnabas: “ziet, wij keren ons tot de heidenen”, en nadat zij waren verdreven, “zij schudden het stof van hun voeten af tegen dezelve, en kwamen te Ikonium.”"
    - "Augustus maakte de stad na 25 v.Chr. tot een Romeinse veteranenkolonie, Colonia Caesarea, en opgravingen hebben haar tempel van Augustus blootgelegd, een zuilenplein genoemd naar Tiberius, een monumentale poort waarbij in 1914 fragmenten van een Latijns exemplaar van de Res Gestae van Augustus werden gevonden, een aquaduct en een grote basiliek uit de vierde eeuw. Opschriften van de stad noemen leden van een senatorisch geslacht, de Sergii Paulli, en William Ramsay bracht hen in verband met Sergius Paulus, de proconsul van Cyprus die net gelovig was geworden; sommigen zien dit als de reden dat Paulus verder ging naar Antiochië, anderen vinden het verband te gering om dat gewicht te dragen."
  sv:
    - "Antiochia i Pisidien låg på en kulle omkring en kilometer nordost om staden Yalvaç i sjödistriktet i västra centrala Turkiet, där dess ruiner kan besökas; kartpunkten står på dem. Den låg omkring 153 km norr om Perge, varifrån Paulus steg upp till den över Taurus, omkring 124 km väst-nordväst om Ikonion och omkring 815 km från Jerusalem, allt i fågelvägen. Strängt taget var den en stad i Frygien vid gränsen mot Pisidien, ”Antiochia nära Pisidien” med Strabons formulering; den är inte det syriska Antiochia vid Orontes, omkring 500 km bort, varifrån resan utgick."
    - "Paulus och Barnabas kom hit på sin första resa: ”Men själva foro de vidare från Perge och kommo till Antiokia i Pisidien. Och på sabbatsdagen gingo de in i synagogan och satte sig där.” Inbjuden att tala efter uppläsningen ur lagen och profeterna höll Paulus den första av sina predikningar som Apostlagärningarna återger i sin helhet, där han berättar Israels historia från Egypten till David och vidare till Jesus. ”Följande sabbat kom nästan hela staden tillsammans för att höra Guds ord”; när judarna motsatte sig dem sade Paulus och Barnabas: ”så vända vi oss nu till hedningarna”, och efter att de hade fördrivits skuddade de ”stoftet av sina fötter mot dem och begåvo sig till Ikonium”."
    - "Augustus gjorde staden till en romersk veterankoloni, Colonia Caesarea, efter 25 f.Kr., och utgrävningar har avtäckt dess tempel för Augustus, ett kolonnadomgärdat torg uppkallat efter Tiberius, en monumental port vid vilken fragment av en latinsk kopia av Augustus’ Res Gestae hittades 1914, en akvedukt och en stor basilika från 300-talet. Inskrifter i staden nämner medlemmar av en senatorisk släkt, Sergii Paulli, och William Ramsay förband dem med Sergius Paulus, prokonsuln på Cypern som just hade kommit till tro; vissa tar detta som anledningen till att Paulus fortsatte till Antiochia, andra finner kopplingen för svag för att bära så stor vikt."
  nb:
    - "Antiokia i Pisidia lå på en høyde omtrent en kilometer nordøst for byen Yalvaç i innsjødistriktet i det vest-sentrale Tyrkia, der ruinene kan besøkes; kartpunktet står på dem. Den lå omtrent 153 km nord for Perge, hvorfra Paulus steg opp til den over Taurus, omtrent 124 km vest-nordvest for Ikonium og omtrent 815 km fra Jerusalem, alt i luftlinje. Strengt tatt var den en by i Frygia på grensen til Pisidia, «Antiokia ved Pisidia» med Strabons uttrykk; den er ikke det syriske Antiokia ved Orontes, omtrent 500 km unna, hvorfra reisen startet."
    - "Paulus og Barnabas kom hit på sin første reise: de «drog videre fra Perge og kom til Antiokia i Pisidia, og gikk inn i synagogen på sabbatsdagen og satte sig der.» Innbudt til å tale etter opplesningen av loven og profetene holdt Paulus den første av sine prekener som Apostlenes gjerninger gjengir fullt ut, og fortalte Israels historie fra Egypt til David og videre til Jesus. «På den næste sabbat samlet da næsten hele byen sig for å høre Herrens ord»; da jødene motsatte seg dem, sa Paulus og Barnabas: «så vender vi oss nu til hedningene», og etter at de var drevet bort, «De rystet da støvet av sine føtter mot dem, og kom til Ikonium.»"
    - "Augustus gjorde byen til en romersk veterankoloni, Colonia Caesarea, etter 25 f.Kr., og utgravninger har avdekket Augustus-tempelet, en søylebelagt plass oppkalt etter Tiberius, en monumental port der fragmenter av en latinsk kopi av Augustus’ Res Gestae ble funnet i 1914, en akvedukt og en stor basilika fra 300-tallet. Innskrifter fra byen nevner medlemmer av en senatorslekt, Sergii Paulli, og William Ramsay knyttet dem til Sergius Paulus, prokonsulen på Kypros som nettopp hadde kommet til tro; noen tar dette som grunnen til at Paulus dro videre til Antiokia, andre finner forbindelsen for svak til å bære så mye."
  tl:
    - "Ang Antioquia ng Pisidia ay nakatayo sa isang burol na mga isang kilometro sa hilagang-silangan ng bayan ng Yalvaç sa rehiyon ng mga lawa ng kanluran-gitnang Turkey, kung saan mabibisita ang mga guho nito; naroon ang punto sa mapa. Mga 153 km ito sa hilaga ng Perga, na pinanggalingan ni Pablo paakyat dito sa ibabaw ng Taurus, mga 124 km sa kanluran-hilagang-kanluran ng Iconio at mga 815 km mula sa Jerusalem, lahat sa tuwid na guhit. Sa mahigpit na pagkakasabi, isa itong lungsod ng Frigia sa hangganan ng Pisidia, “Antioquia malapit sa Pisidia” sa pananalita ni Strabo; hindi ito ang Antioquia ng Siria sa Orontes, mga 500 km ang layo, na pinagsimulan ng paglalakbay."
    - "Dumating dito sina Pablo at Bernabe sa kanilang unang paglalakbay: “sila, pagkatahak sa Perga, ay nagsidating sa Antioquia ng Pisidia; at sila'y nagsipasok sa sinagoga nang araw ng sabbath, at nagsiupo.” Inanyayahang magsalita pagkatapos ng pagbasa ng kautusan at ng mga propeta, ibinigay ni Pablo ang una sa kaniyang mga sermong iniulat nang buo ng Mga Gawa, na isinasalaysay ang kuwento ng Israel mula sa Egipto hanggang kay David at kay Jesus. “Nang sumunod na sabbath ay nagkatipon halos ang buong bayan upang pakinggan ang salita ng Dios”; nang tumutol ang mga Judio, sinabi nina Pablo at Bernabe, “narito, kami ay pasasa mga Gentil”, at pagkatapos silang palayasin ay “ipinagpag nila ang alabok ng kanilang mga paa laban sa kanila, at nagsiparoon sa Iconio.”"
    - "Ginawang kolonyang Romano ng mga beterano ni Augusto ang lungsod, ang Colonia Caesarea, pagkatapos ng 25 BK, at ang mga paghuhukay ay nakatuklas ng templo ni Augusto, isang parisukat na may hanay ng haligi na ipinangalan kay Tiberio, isang monumental na tarangkahan, na sa tabi nito ay natagpuan noong 1914 ang mga piraso ng kopyang Latin ng Res Gestae ni Augusto, isang aqueduct at isang malaking basilika ng ika-4 na siglo. Ang mga inskripsiyon ng lungsod ay nagpapangalan ng mga kasapi ng isang pamilyang senatoryal, ang Sergii Paulli, at iniugnay sila ni William Ramsay kay Sergio Paulo, ang prokonsul ng Chipre na kapapaniwala lamang; itinuturing ito ng ilan na dahilan kung bakit nagpatuloy si Pablo sa Antioquia, ang iba ay nakikitang masyadong manipis ang kaugnayan upang pasanin ang bigat."
  da:
    - "Antiokia i Pisidien lå på en bakke ca. en kilometer nordøst for byen Yalvaç i søområdet i det vestcentrale Tyrkiet, hvor dens ruiner kan besøges; kortets punkt står på dem. Den lå ca. 153 km nord for Perge, hvorfra Paulus steg op til den over Taurus, ca. 124 km vest-nordvest for Ikonion og ca. 815 km fra Jerusalem, alt i fugleflugt. Strengt taget var den en by i Frygien ved grænsen til Pisidien, »Antiokia nær ved Pisidien« i Strabons formulering; den er ikke det syriske Antiokia ved Orontes, ca. 500 km væk, hvorfra rejsen udgik."
    - "Paulus og Barnabas kom hertil på deres første rejse: »de droge videre fra Perge og kom til Antiokia i Pisidien og gik ind i Synagogen paa Sabbatsdagen og satte sig.« Inviteret til at tale efter oplæsningen af loven og profeterne holdt Paulus den første af sine prædikener, som Apostlenes Gerninger gengiver fuldt ud, og fortalte Israels historie fra Egypten til David og videre til Jesus. »Paa den følgende Sabbat forsamledes næsten hele Byen for at høre Guds Ord«; da jøderne modsatte sig dem, sagde Paulus og Barnabas: »se, saa vende vi os til Hedningerne«, og efter at de var blevet jaget bort, »de rystede Støvet af deres Fødder imod dem og droge til Ikonium«."
    - "Augustus gjorde byen til en romersk veterankoloni, Colonia Caesarea, efter 25 f.Kr., og udgravninger har blotlagt dens Augustus-tempel, en søjlebelagt plads opkaldt efter Tiberius, en monumental port, ved hvilken brudstykker af en latinsk afskrift af Augustus’ Res Gestae blev fundet i 1914, et akvædukt og en stor basilika fra 300-tallet. Byens indskrifter nævner medlemmer af en senatorisk slægt, Sergii Paulli, og William Ramsay knyttede dem til Sergius Paulus, statholderen på Cypern, som netop var kommet til tro; nogle tager dette som grunden til, at Paulus drog videre til Antiokia, andre finder forbindelsen for svag til at bære vægten."
  sr:
    - "Антиохија Писидијска стајала је на брду око километар североисточно од града Јалвач у језерском крају западно-централне Турске, где се њене рушевине могу посетити; тачка на карти стоји на њима. Лежала је око 153 км северно од Перге, из које се Павле пењао до ње преко планине Таурус, око 124 км западно-северозападно од Иконија и око 815 км од Јерусалима, све ваздушном линијом. Строго узев, била је град Фригије на граници Писидије, „Антиохија код Писидије“ по Страбоновом изразу; није сиријска Антиохија на Оронту, удаљена око 500 км, из које је путовање кренуло."
    - "Павле и Варнава дошли су овамо на свом првом путовању: „А они отишавши из Перге дођоше у Антиохију писидијску, и ушавши у зборницу у дан суботни седоше.“ Позван да говори после читања закона и пророка, Павле је одржао прву од својих беседа које Дела преносе у целини, причајући историју Израела од Египта до Давида и до Исуса. „У другу суботу сабра се готово сав град да чују речи Божје“; кад су им се Јевреји супротставили, Павле и Варнава рекоше: „ево се обрћемо к незнабошцима“, а пошто су били протерани, „отресавши на њих прах са својих ногу дођоше у Иконију“."
    - "Август је град учинио римском колонијом ветерана, Колонијом Цезаријом, после 25. п. н. е., а ископавања су открила његов храм Августов, трг са стубовима названи по Тиверију, монументалну капију поред које су 1914. нађени одломци латинског примерка Августових Рес гесте, аквадукт и велику базилику из четвртог века. Натписи града именују чланове сенаторске породице, Сергије Паули, а Вилијам Рамзи повезао их је са Сергијем Павлом, проконзулом Кипра који је управо поверовао; неки то узимају као разлог зашто је Павле отишао у Антиохију, други налазе везу сувише слабом да носи тај терет."
  hu:
    - "A piszídiai Antiókhia egy dombon állt Yalvaç városától mintegy egy kilométerre északkeletre, Közép-Nyugat-Törökország tóvidékén, ahol romjai meglátogathatók; a térkép pontja rajtuk áll. Pergétől, ahonnan Pál a Taurusz hegységen át felment, mintegy 153 km-re északra, Ikóniumtól mintegy 124 km-re nyugat-északnyugatra és Jeruzsálemtől mintegy 815 km-re feküdt, mind légvonalban. Szigorúan véve Frígia városa volt Piszídia határán, Sztrabón szavával „Antiókhia Piszídia mellett”; nem azonos az Orontész menti szíriai Antiókhiával, mely mintegy 500 km-re van, és ahonnan az utazás elindult."
    - "Pál és Barnabás első útján érkezett ide: „Ők pedig Pergából tovább menve, eljutának Antiókhiába, Pisidiának városába, és bemenvén szombatnapon a zsinagógába; leülének.” A törvény és a próféták felolvasása után felkérték, hogy szóljon, és Pál elmondta az ApCsel által teljes terjedelmében közölt első beszédét, melyben elbeszéli Izráel történetét Egyiptomtól Dávidig és Jézusig. „A következő szombaton aztán majdnem az egész város egybegyűle az Isten ígéjének hallgatására”; mikor a zsidók ellenük szegültek, Pál és Barnabás azt mondták: „ímé a pogányokhoz fordulunk”, és kiűzetésük után „lábuknak porát lerázván ellenük, elmenének Ikóniumba”."
    - "Augusztus a várost Kr. e. 25 után veteránok római gyarmatává, Colonia Caesareává tette, és az ásatások feltárták Augusztus templomát, a Tiberiusról elnevezett oszlopsoros teret, egy monumentális kaput, amelynél 1914-ben Augusztus Res Gestae-jének latin másolatából töredékeket találtak, egy vízvezetéket és egy nagy 4. századi bazilikát. A város feliratai egy szenátori család, a Sergii Paulli tagjait nevezik meg, és William Ramsay őket kapcsolta Szergiusz Paulusszal, Ciprus prokonzuljával, aki éppen hitre jutott; egyesek ezt tartják annak az okának, hogy Pál Antiókhiába ment tovább, mások szerint a kapcsolat túl gyenge ahhoz, hogy megtartsa a súlyt."
  fi:
    - "Pisidian Antiokia sijaitsi kukkulalla noin kilometrin Yalvaçin kaupungista koilliseen Länsi-Keski-Turkin järviseudulla, jossa sen rauniot ovat vierailtavissa; kartan piste on niillä. Se oli linnuntietä noin 153 km Pergestä pohjoiseen, mistä Paavali nousi sinne Tauruksen yli, noin 124 km Ikonionista länsi-luoteeseen ja noin 815 km Jerusalemista. Tarkasti ottaen se oli Fryygian kaupunki Pisidian rajalla, Strabonin sanoin ”Antiokia Pisidian lähellä”; se ei ole Syyrian Antiokia Orontes-joen varrella, noin 500 km päässä, josta matka lähti."
    - "Paavali ja Barnabas tulivat tänne ensimmäisellä matkallaan: ”Mutta he vaelsivat Pergestä eteenpäin ja saapuivat Pisidian Antiokiaan; ja he menivät synagoogaan sapatinpäivänä ja istuutuivat.” Lain ja profeettojen lukemisen jälkeen puhumaan kutsuttuna Paavali piti ensimmäisen saarnansa, jonka Apostolien teot esittää kokonaisuudessaan, kertoen Israelin historian Egyptistä Daavidiin ja edelleen Jeesukseen. ”Seuraavana sapattina kokoontui lähes koko kaupunki kuulemaan Jumalan sanaa”; kun juutalaiset vastustivat, Paavali ja Barnabas sanoivat: ”niin katso, me käännymme pakanain puoleen”, ja karkotettuina he ”pudistivat tomun jaloistansa heitä vastaan ja menivät Ikonioniin”."
    - "Augustus teki kaupungista veteraanien roomalaisen siirtokunnan, Colonia Caesarean, vuoden 25 eaa. jälkeen, ja kaivaukset ovat paljastaneet sen Augustuksen temppelin, Tiberiuksen mukaan nimetyn pylväsaukion, monumentaalisen portin, jonka luota löydettiin vuonna 1914 katkelmia Augustuksen Res Gestae -tekstin latinankielisestä jäljennöksestä, vesijohdon ja suuren 300-luvun basilikan. Kaupungin kirjoitukset mainitsevat senaattoriperheen jäseniä, Sergii Paullit, ja William Ramsay yhdisti heidät Sergius Paulukseen, Kyproksen käskynhaltijaan, joka oli juuri uskonut; jotkut pitävät tätä syynä siihen, miksi Paavali jatkoi Antiokiaan, toiset katsovat yhteyden liian heikoksi kantamaan painoa."
  vi:
    - "An-ti-ốt xứ Bi-si-đi nằm trên một ngọn đồi cách thị trấn Yalvaç khoảng một kilômét về phía đông bắc, trong vùng hồ ở tây trung Thổ Nhĩ Kỳ, nơi có thể tham quan tàn tích; điểm trên bản đồ nằm trên đó. Nó cách Bẹt-giê khoảng 153 km về phía bắc, từ đó Phao-lô vượt dãy Taurus để lên thành này, cách Y-cô-ni khoảng 124 km về phía tây tây bắc và cách Giê-ru-sa-lem khoảng 815 km, tất cả theo đường thẳng. Nói chính xác, nó là một thành của Phi-ri-gi ở biên giới Bi-si-đi, “An-ti-ốt gần Bi-si-đi” theo cách nói của Strabo; nó không phải An-ti-ốt ở Syria trên sông Orontes, cách khoảng 500 km, nơi chuyến hành trình khởi đầu."
    - "Phao-lô và Ba-na-ba đến đây trong chuyến hành trình thứ nhất: “lìa thành Bẹt-giê, cứ đi đường đến thành An-ti-ốt xứ Bi-si-đi; rồi nhằm ngày Sa-bát, vào trong nhà hội mà ngồi.” Được mời nói sau khi đọc luật pháp và các sách tiên tri, Phao-lô giảng bài giảng đầu tiên trong số các bài mà sách Công vụ chép đầy đủ, kể lịch sử Y-sơ-ra-ên từ Ê-díp-tô đến Đa-vít rồi đến Giê-su. “Ngày Sa-bát sau, gần hết cả thành đều nhóm lại để nghe đạo Chúa”; khi người Do Thái chống đối, Phao-lô và Ba-na-ba nói: “chúng ta mới xây qua người ngoại”, và sau khi bị đuổi, hai ông “phủi bụi nơi chân mình, rồi đi đến thành Y-cô-ni”."
    - "Au-gút-tơ biến thành phố này thành một thuộc địa La Mã của cựu binh, Colonia Caesarea, sau năm 25 TCN, và các cuộc khai quật đã phát lộ đền thờ Au-gút-tơ, một quảng trường có hàng cột đặt tên theo Ti-be-rơ, một cổng đồ sộ nơi tìm thấy những mảnh bản sao tiếng Latin của Res Gestae của Au-gút-tơ năm 1914, một cống dẫn nước và một nhà thờ lớn của thế kỷ 4. Các bản khắc của thành nêu tên các thành viên của một gia đình nguyên lão, Sergii Paulli, và William Ramsay liên hệ họ với Sê-giúp Phau-lút, quan tổng đốc Chíp-rơ vừa tin Chúa; một số người coi đây là lý do Phao-lô đi tiếp đến An-ti-ốt, người khác thấy mối liên hệ quá mỏng để chịu sức nặng ấy."
  ro:
    - "Antiohia Pisidiei se afla pe un deal la circa un kilometru nord-est de orașul Yalvaç, în ținutul lacurilor din centru-vestul Turciei, unde ruinele ei pot fi vizitate; punctul de pe hartă se află pe ele. Se afla la circa 153 km nord de Perga, de unde Pavel a urcat spre ea peste Taur, la circa 124 km vest-nord-vest de Iconia și la circa 815 km de Ierusalim, toate în linie dreaptă. Strict vorbind, era un oraș al Frigiei, la granița Pisidiei, „Antiohia de lângă Pisidia” în formularea lui Strabon; nu este Antiohia siriană de pe Orontes, aflată la circa 500 km depărtare, de unde a pornit călătoria."
    - "Pavel și Barnaba au venit aici în prima lor călătorie: „Iar ei trecând din Perghia, au venit în Antiohia Pisidiei, și intrând în sinagogă în ziua sâmbetei, au șezut.” Invitat să vorbească după citirea Legii și a prorocilor, Pavel a ținut prima dintre predicile sale pe care Faptele le relatează integral, povestind istoria lui Israel de la Egipt până la David și la Isus. „În cealaltă sâmbătă, mai toată cetatea s’a adunat să auză cuvântul lui Dumnezeu”; când iudeii li s-au împotrivit, Pavel și Barnaba au zis: „iată ne întoarcem la neamuri”, iar după ce au fost izgoniți, „scuturând praful picioarelor sale asupra lor, au venit în Iconia.”"
    - "Augustus a făcut din oraș o colonie romană de veterani, Colonia Caesarea, după 25 î.Hr., iar săpăturile au scos la iveală templul lui Augustus, o piață cu colonade numită după Tiberiu, o poartă monumentală lângă care au fost găsite în 1914 fragmente ale unei copii latine a Res Gestae ale lui Augustus, un apeduct și o mare bazilică din secolul al IV-lea. Inscripții ale orașului numesc membri ai unei familii senatoriale, Sergii Paulli, iar William Ramsay i-a legat de Sergiu Paul, proconsulul Ciprului, care tocmai crezuse; unii văd în aceasta motivul pentru care Pavel a mers mai departe la Antiohia, alții găsesc legătura prea slabă pentru a susține o asemenea greutate."
  bg:
    - "Писидийска Антиохия стоеше на хълм на около километър североизточно от град Ялвач в Езерната област на Западна Централна Турция, където руините ѝ могат да се посетят; точката на картата стои на тях. Тя се намираше на около 153 км северно от Перга, откъдето Павел се изкачи до нея през Таврос, на около 124 км запад-северозападно от Икония и на около 815 км от Йерусалим — всичко по права линия. Строго погледнато, тя беше град на Фригия на границата с Писидия — „Антиохия до Писидия“, по израза на Страбон; това не е Сирийската Антиохия на Оронт, на около 500 км, откъдето започна пътуването."
    - "Павел и Варнава дойдоха тук при първото си пътуване: „А те заминаха от Перга и стигнаха в Антиохия Писидийска, и съботния ден влезоха в съборището и седнаха.“ Поканен да говори след четенето на закона и пророците, Павел произнесе първата от проповедите си, които Деянията предават изцяло, като разказа историята на Израил от Египет до Давид и нататък до Исус. „И в идещата събота събра се току речи всичкият град да чуят словото Божие“; когато юдеите им се противопоставиха, Павел и Варнава казаха: „ето, обръщаме се към езичниците“, а след като бяха изгонени, „отърсиха на тех и праха от нозете си, и дойдоха в Икония.“"
    - "Август направи града римска колония на ветерани, Colonia Caesarea, след 25 г. пр.н.е., а разкопките разкриха храма му на Август, площад с колонади, наречен на Тиберий, монументална порта, при която през 1914 г. бяха намерени фрагменти от латинско копие на Res Gestae на Август, акведукт и голяма базилика от IV в. Надписи от града назовават членове на сенаторския род Sergii Paulli и Уилям Рамзи ги свързва със Сергий Павел — проконсула на Кипър, който току-що беше повярвал; някои виждат в това причината Павел да продължи към Антиохия, други смятат връзката за твърде слаба, за да носи такава тежест."
