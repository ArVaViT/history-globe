id: where-was-pisidian-antioch
question:
  en: "Where was Pisidian Antioch?"
  ru: "Где находилась Антиохия Писидийская?"
  uk: "Де була Пісідійська Антіохія?"
  es: "¿Dónde estaba Antioquía de Pisidia?"
  pt: "Onde ficava Antioquia da Pisídia?"
  de: "Wo lag Antiochia in Pisidien?"
  fr: "Où se trouvait Antioche de Pisidie ?"
answer:
  en:
    - "Pisidian Antioch stood on a hill about a kilometre north-east of the town of Yalvaç in the lake district of west-central Turkey, where its ruins can be visited; the map point stands on them. It lay about 153 km north of Perga, from which Paul climbed to it over the Taurus, about 124 km west-north-west of Iconium and about 815 km from Jerusalem, all in a straight line. Strictly it was a city of Phrygia on the border of Pisidia, “Antioch near Pisidia” in Strabo's phrase; it is not the Syrian Antioch on the Orontes, about 500 km away, from which the journey set out."
    - "Paul and Barnabas came here on their first journey: “when they departed from Perga, they came to Antioch in Pisidia, and went into the synagogue on the sabbath day, and sat down.” Invited to speak after the reading of the law and the prophets, Paul gave the first of his sermons that Acts reports in full, telling Israel's story from Egypt to David and on to Jesus. “The next sabbath day came almost the whole city together to hear the word of God”; when the Jews opposed them, Paul and Barnabas said, “lo, we turn to the Gentiles”, and after they were expelled they “shook off the dust of their feet against them, and came unto Iconium.”"
    - "Augustus made the city a Roman colony of veterans, Colonia Caesarea, after 25 BC, and excavations have uncovered its temple of Augustus, a colonnaded square named after Tiberius, a monumental gate by which fragments of a Latin copy of Augustus' Res Gestae were found in 1914, an aqueduct and a great basilica of the fourth century. Inscriptions of the city name members of a senatorial family, the Sergii Paulli, and William Ramsay linked them with Sergius Paulus, the proconsul of Cyprus who had just believed; some take this as the reason Paul went on to Antioch, others find the link too slight to bear the weight."
  ru:
    - "Антиохия Писидийская стояла на холме примерно в километре к северо-востоку от городка Ялвач в Озёрном крае на западе центральной Турции; её развалины открыты для посещения, и точка карты стоит на них. Она лежала примерно в 153 км к северу от Пергии, откуда Павел поднялся к ней через Тавр, примерно в 124 км к западу-северо-западу от Иконии и примерно в 815 км от Иерусалима — всё по прямой. Строго говоря, это был город Фригии на границе с Писидией, «Антиохия близ Писидии», как пишет Страбон; не путать с сирийской Антиохией на Оронте, примерно в 500 км отсюда, откуда путешествие началось."
    - "Павел и Варнава пришли сюда в первом путешествии: «проходя от Пергии, прибыли в Антиохию Писидийскую и, войдя в синагогу в день субботний, сели». Приглашённый сказать слово после чтения закона и пророков, Павел произнёс первую из своих проповедей, которые Деяния передают целиком, — рассказ об Израиле от Египта до Давида и дальше до Иисуса. «В следующую субботу почти весь город собрался слушать слово Божие»; когда Иудеи воспротивились, Павел и Варнава сказали: «вот, мы обращаемся к язычникам», а изгнанные, «отрясши на них прах от ног своих, пошли в Иконию»."
    - "После 25 г. до н. э. Август сделал город римской колонией ветеранов, Colonia Caesarea, и раскопки открыли его храм Августа, площадь с колоннадой, названную в честь Тиверия, парадные ворота, у которых в 1914 г. нашли фрагменты латинской копии «Деяний Августа», акведук и большую базилику IV века. Надписи города называют членов сенаторского рода Сергиев Павлов, и Уильям Рамзай связал их с Сергием Павлом, только что уверовавшим проконсулом Кипра; одни видят в этом причину, по которой Павел пошёл в Антиохию, другие считают эту связь слишком зыбкой."
  uk:
    - "Пісідійська Антіохія стояла на пагорбі приблизно за кілометр на північний схід від міста Ялвач в озерному краї на захід від центру Туреччини, де її руїни можна відвідати; точка на мапі стоїть на них. Вона лежала приблизно за 153 км на північ від Перге, звідки Павло піднявся до неї через Тавр, приблизно за 124 км на захід-північний захід від Іконії і приблизно за 815 км від Єрусалима — усе по прямій. Строго кажучи, це було місто Фрігії на кордоні Пісідії, «Антіохія біля Пісідії» за висловом Страбона; це не сирійська Антіохія на Оронті, приблизно за 500 км звідти, з якої почалася подорож."
    - "Павло й Варнава прийшли сюди під час першої подорожі: «Вони ж, перейшовши з Пергиї, прибули в Антиохию Писидийську, і ввійшовши в школу субітнього дня, посїдали.» Запрошений говорити після читання Закону й Пророків, Павло виголосив першу зі своїх проповідей, яку Дії наводять повністю, розповівши історію Ізраїлю від Єгипту до Давида й далі до Ісуса. «А другої суботи мало не ввесь город зібрав ся слухати слово Боже»; коли юдеї виступили проти них, Павло й Варнава сказали: «ось обертаємось до поган», а після того як їх вигнали, вони, «обтрусивши порох од ніг своїх на них, пійшли в Іконию»."
    - "Август зробив місто римською колонією ветеранів, Colonia Caesarea, після 25 р. до н. е., і розкопки відкрили його храм Августа, площу з колонадами, названу на честь Тиверія, монументальну браму, біля якої 1914 р. знайшли уламки латинського примірника «Діянь божественного Августа», акведук і велику базиліку IV ст. Написи міста називають членів сенаторського роду Сергіїв Павлів, і Вільям Рамзай пов'язав їх із Сергієм Павлом, проконсулом Кіпру, який щойно увірував; дехто бачить у цьому причину, чому Павло пішов до Антіохії, інші вважають зв'язок надто слабким, щоб витримати таку вагу."
  es:
    - "Antioquía de Pisidia se alzaba sobre una colina a un kilómetro al noreste de la población de Yalvaç, en la región de los lagos del centro-oeste de Turquía, donde se pueden visitar sus ruinas; el punto del mapa está sobre ellas. Quedaba a unos 153 km al norte de Perge, desde donde Pablo subió hasta ella por el Tauro, a unos 124 km al oesnoroeste de Iconio y a unos 815 km de Jerusalén, todo en línea recta. En rigor era una ciudad de Frigia en la frontera de Pisidia, «Antioquía junto a Pisidia» en la expresión de Estrabón; no es la Antioquía de Siria, junto al Orontes, a unos 500 km, desde la cual partió el viaje."
    - "Pablo y Bernabé llegaron aquí en su primer viaje: «pasando de Perge, llegaron á Antioquía de Pisidia, y entrando en la sinagoga un día de sábado, sentáronse». Invitado a hablar tras la lectura de la ley y los profetas, Pablo pronunció el primero de sus sermones que los Hechos refieren por entero, narrando la historia de Israel desde Egipto hasta David y hasta Jesús. «El sábado siguiente se juntó casi toda la ciudad á oir la palabra de Dios»; cuando los judíos se opusieron, Pablo y Bernabé dijeron: «he aquí, nos volvemos á los Gentiles», y tras ser expulsados, «sacudiendo en ellos el polvo de sus pies, vinieron á Iconio»."
    - "Augusto hizo de la ciudad una colonia romana de veteranos, Colonia Caesarea, después del 25 a. C., y las excavaciones han sacado a la luz su templo de Augusto, una plaza con columnata que lleva el nombre de Tiberio, una puerta monumental junto a la cual se hallaron en 1914 fragmentos de una copia latina de las Res Gestae de Augusto, un acueducto y una gran basílica del siglo IV. Inscripciones de la ciudad nombran a miembros de una familia senatorial, los Sergii Paulli, y William Ramsay los vinculó con Sergio Paulo, el procónsul de Chipre que acababa de creer; unos lo toman como la razón por la que Pablo siguió hasta Antioquía, otros hallan el vínculo demasiado débil para sostener ese peso."
  pt:
    - "Antioquia da Pisídia ficava numa colina cerca de um quilômetro a nordeste da cidade de Yalvaç, na região dos lagos do centro-oeste da Turquia, onde suas ruínas podem ser visitadas; o ponto do mapa fica sobre elas. Ficava a cerca de 153 km ao norte de Perge, de onde Paulo subiu até ela pelo Tauro, a cerca de 124 km a oés-noroeste de Icônio e a cerca de 815 km de Jerusalém, tudo em linha reta. Em rigor, era uma cidade da Frígia na fronteira da Pisídia, “Antioquia junto à Pisídia” na expressão de Estrabão; não é a Antioquia da Síria, no Orontes, a cerca de 500 km de distância, de onde a viagem partiu."
    - "Paulo e Barnabé chegaram aqui em sua primeira viagem: “passando de Perge, chegaram a Antioquia da Pisídia. Eles entraram na sinagoga no dia de sábado e se assentaram.” Convidado a falar depois da leitura da lei e dos profetas, Paulo proferiu o primeiro dos seus sermões que Atos relata por inteiro, contando a história de Israel desde o Egito até Davi e daí a Jesus. “No sábado seguinte, quase toda a cidade se reuniu para ouvir a palavra de Deus”; quando os judeus se opuseram, Paulo e Barnabé disseram: “eis que nos voltamos para os gentios”, e depois de expulsos “sacudiram o pó dos seus pés contra eles, e foram para Icônio”."
    - "Augusto fez da cidade uma colônia romana de veteranos, Colonia Caesarea, depois de 25 a.C., e as escavações trouxeram à luz seu templo de Augusto, uma praça com colunatas chamada em honra de Tibério, um portão monumental junto ao qual foram encontrados em 1914 fragmentos de uma cópia latina das Res Gestae de Augusto, um aqueduto e uma grande basílica do século IV. Inscrições da cidade nomeiam membros de uma família senatorial, os Sergii Paulli, e William Ramsay os ligou a Sérgio Paulo, o procônsul de Chipre que acabara de crer; alguns tomam isso como a razão de Paulo ter seguido para Antioquia, outros acham a ligação tênue demais para sustentar tal peso."
  de:
    - "Antiochia in Pisidien stand auf einem Hügel etwa einen Kilometer nordöstlich der Stadt Yalvaç im Seengebiet der west-zentralen Türkei, wo seine Ruinen besichtigt werden können; der Kartenpunkt steht auf ihnen. Es lag in der Luftlinie etwa 153 km nördlich von Perge, von wo Paulus über den Taurus zu ihm hinaufstieg, etwa 124 km westnordwestlich von Ikonion und etwa 815 km von Jerusalem. Streng genommen war es eine Stadt Phrygiens an der Grenze zu Pisidien, „Antiochia bei Pisidien“ in Strabons Wendung; es ist nicht das syrische Antiochia am Orontes, etwa 500 km entfernt, von dem die Reise ausgegangen war."
    - "Paulus und Barnabas kamen auf ihrer ersten Reise hierher: „Sie aber zogen weiter von Perge und kamen gen Antiochien im Lande Pisidien und gingen in die Schule am Sabbattage und setzten sich.“ Nach der Lesung von Gesetz und Propheten zum Reden aufgefordert, hielt Paulus die erste seiner Predigten, die die Apostelgeschichte vollständig wiedergibt, und erzählte Israels Geschichte von Ägypten bis David und weiter bis Jesus. „Am folgenden Sabbat aber kam zusammen fast die ganze Stadt, das Wort Gottes zu hören“; als die Juden widersprachen, sagten Paulus und Barnabas: „so wenden wir uns zu den Heiden“, und nach ihrer Vertreibung „schüttelten den Staub von ihren Füßen über sie und kamen gen Ikonion“."
    - "Augustus machte die Stadt nach 25 v. Chr. zur römischen Veteranenkolonie Colonia Caesarea, und Grabungen haben ihren Augustustempel, einen nach Tiberius benannten Säulenplatz, ein monumentales Tor, bei dem 1914 Fragmente einer lateinischen Abschrift der Res Gestae des Augustus gefunden wurden, einen Aquädukt und eine große Basilika des 4. Jahrhunderts freigelegt. Inschriften der Stadt nennen Mitglieder einer senatorischen Familie, der Sergii Paulli, und William Ramsay brachte sie mit Sergius Paulus in Verbindung, dem Prokonsul von Zypern, der eben gläubig geworden war; manche sehen darin den Grund, warum Paulus weiter nach Antiochia zog, andere halten die Verbindung für zu schwach, um das Gewicht zu tragen."
  fr:
    - "Antioche de Pisidie s’élevait sur une colline à environ un kilomètre au nord-est de la ville de Yalvaç, dans la région des lacs du centre-ouest de la Turquie, où l’on peut visiter ses ruines ; le point de la carte s’y trouve. Elle était à environ 153 km au nord de Perge, d’où Paul y monta en franchissant le Taurus, à environ 124 km à l’ouest-nord-ouest d’Icone et à environ 815 km de Jérusalem, le tout à vol d’oiseau. À proprement parler, c’était une ville de Phrygie, à la frontière de la Pisidie, « Antioche près de la Pisidie » selon l’expression de Strabon ; ce n’est pas l’Antioche de Syrie sur l’Oronte, à environ 500 km de là, d’où le voyage était parti."
    - "Paul et Barnabas y vinrent lors de leur premier voyage : « De Perge ils poursuivirent leur route, et arrivèrent à Antioche de Pisidie. Étant entrés dans la synagogue le jour du sabbat, ils s’assirent. » Invité à parler après la lecture de la loi et des prophètes, Paul prononça le premier de ses sermons que les Actes rapportent en entier, racontant l’histoire d’Israël depuis l’Égypte jusqu’à David et jusqu’à Jésus. « Le sabbat suivant, presque toute la ville se rassembla pour entendre la parole de Dieu » ; quand les Juifs leur firent opposition, Paul et Barnabas dirent : « voici, nous nous tournons vers les païens », et, chassés, ils « secouèrent contre eux la poussière de leurs pieds, et allèrent à Icone »."
    - "Auguste fit de la ville une colonie romaine de vétérans, la Colonia Caesarea, après 25 av. J.-C., et les fouilles ont mis au jour son temple d’Auguste, une place à colonnades portant le nom de Tibère, une porte monumentale près de laquelle furent trouvés en 1914 des fragments d’une copie latine des Res Gestae d’Auguste, un aqueduc et une grande basilique du IVe siècle. Des inscriptions de la ville nomment les membres d’une famille sénatoriale, les Sergii Paulli, et William Ramsay les rattacha à Sergius Paulus, le proconsul de Chypre qui venait de croire ; certains y voient la raison pour laquelle Paul poursuivit jusqu’à Antioche, d’autres jugent le lien trop mince pour porter un tel poids."
