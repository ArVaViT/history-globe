id: where-did-joshua-make-the-sun-stand-still
question:
  en: "Where did Joshua make the sun stand still?"
  ru: "Где Иисус Навин остановил солнце?"
  uk: "Де Ісус Навин зупинив сонце?"
  es: "¿Dónde detuvo Josué el sol?"
  pt: "Onde Josué fez o sol parar?"
  de: "Wo ließ Josua die Sonne stillstehen?"
  fr: "Où Josué arrêta-t-il le soleil ?"
  pl: "Gdzie Jozue zatrzymał słońce?"
  it: "Dove Giosuè fermò il sole?"
  nl: "Waar liet Jozua de zon stilstaan?"
  cs: "Kde Jozue zastavil slunce?"
answer:
  en:
    - "Over Gibeon and the valley of Aijalon, in the hills north-west of Jerusalem: “Sun, stand thou still upon Gibeon; and thou, Moon, in the valley of Ajalon.” Gibeon is el-Jib, about 9 km north-west of Jerusalem in a straight line; the valley of Aijalon, where the map point stands, opens about 21 km further west, below the pass of Beth-horon. Joshua spoke in the battle to save Gibeon, as he drove five Amorite kings down from the hills towards the plain."
    - "The Gibeonites had made peace with Israel, and the kings of Jerusalem, Hebron, Jarmuth, Lachish and Eglon besieged them. Joshua “came unto them suddenly, and went up from Gilgal all night”, a climb of about 26 km in a straight line from the Jordan valley, routed them at Gibeon and chased them “along the way that goeth up to Beth-horon”, about 8 km to the west, while hailstones fell on them as far as Azekah, about 29 km to the south-west. The kings hid in a cave at Makkedah, about 40 km from Gibeon. “And the sun stood still, and the moon stayed, until the people had avenged themselves upon their enemies.”"
    - "Readers explain the words in several ways. Many take them as a miracle in which the day was lengthened, as Josephus did; others as poetry, since the text says it is “written in the book of Jasher”, a lost collection of songs. The Hebrew verb can mean “be silent” or “cease”, and some read a darkening rather than a longer day: C. J. Humphreys and G. Waddington linked it with the annular eclipse of 30 October 1207 BC, while J. H. Walton read sun and moon standing opposite each other as an omen against the enemy. In the fourth century Eusebius placed the valley three miles east of Bethel; Jerome added that the Jews put Aijalon two miles from Nicopolis, which fits Yalo, the village above the valley the map shows."
  ru:
    - "Над Гаваоном и долиной Аиалонской, в горах к северо-западу от Иерусалима: «стой, солнце, над Гаваоном, и луна, над долиною Аиалонскою!» Гаваон — это Эль-Джиб примерно в 9 км к северо-западу от Иерусалима по прямой; Аиалонская долина, где стоит точка карты, открывается примерно в 21 км западнее, под перевалом Беф-Орон. Иисус сказал эти слова в битве за Гаваон, когда гнал пять аморрейских царей с гор к равнине."
    - "Гаваонитяне заключили мир с Израилем, и цари Иерусалима, Хеврона, Иармуфа, Лахиса и Еглона осадили их. «И пришел на них Иисус внезапно, потому что всю ночь шел он из Галгала» — подъём примерно в 26 км по прямой из долины Иордана, — разбил их у Гаваона и преследовал «по дороге к возвышенности Вефорона», примерно в 8 км к западу, а град побивал их до самого Азека, примерно в 29 км к юго-западу. Цари «скрылись в пещере в Македе», примерно в 40 км от Гаваона. «И остановилось солнце, и луна стояла, доколе народ мстил врагам своим»."
    - "Эти слова объясняют по-разному. Многие видят в них чудо, при котором день продлился, как понимал и Иосиф Флавий; другие — поэзию: текст говорит, что это «написано в книге Праведного», утраченном сборнике песен. Еврейский глагол может значить «умолкнуть» или «перестать», и некоторые читают здесь затмение, а не долгий день: К. Хамфрис и Г. Уоддингтон связали его с кольцеобразным затмением 30 октября 1207 г. до н. э., а Дж. Уолтон увидел в стоянии солнца и луны друг против друга знамение против врага. В IV веке Евсевий поместил долину в трёх милях к востоку от Вефиля; Иероним добавил, что иудеи помещают Аиалон в двух милях от Никополя, — это подходит к деревне Яло над долиной, которую показывает карта."
  uk:
    - "Над Гаваоном і долиною Аялон, у пагорбах на північний захід від Єрусалиму: «Сонце, стій над Габаоном; місяцю, над Аялоном!» Гаваон — це ель-Джіб, приблизно за 9 км на північний захід від Єрусалиму по прямій; долина Аялон, де стоїть точка мапи, відкривається ще приблизно за 21 км на захід, під перевалом Бет-Хорон. Ісус Навин промовив у битві, що рятувала Гаваон, коли він гнав п'ятьох аморейських царів з пагорбів до рівнини."
    - "Гаваонці уклали мир з Ізраїлем, і царі Єрусалиму, Хеврона, Ярмуту, Лахіша та Еглону обложили їх. Ісус Навин «наступив на них несподївано, йшов бо з Галгала всю ніч» — підйом приблизно на 26 км по прямій від Йорданської долини, розбив їх під Гаваоном і гнав їх «по дорозї, що йде в гору до Беторона», приблизно за 8 км на захід, а на них падав град аж до Азеки, приблизно за 29 км на південний захід. Царі сховалися в печері в Македі, приблизно за 40 км від Гаваона. «І зупинилось тодї сонце, і не йшов по небу місяць, докіль Божий люд помстився над своїми ворогами!»"
    - "Слова пояснюють по-різному. Багато хто вважає їх дивом, у якому день було подовжено, як і Йосиф Флавій; інші — поезією, оскільки текст каже, що це «написане в книзї Праведнього», втраченому збірнику пісень. Єврейське дієслово може означати «мовчати» або «припинитися», і дехто читає затемнення, а не довший день: К. Дж. Гемфріс і Г. Вейддінгтон пов'язали його з кільцеподібним затемненням 30 жовтня 1207 р. до н. е., а Дж. Г. Волтон прочитав сонце й місяць, що стоять один навпроти одного, як знамення проти ворога. У IV ст. Євсевій розмістив долину за три милі на схід від Бет-Ела; Єронім додав, що євреї ставили Аялон за дві милі від Нікополя, що відповідає Ялу, селу над долиною, яку показує мапа."
  es:
    - "Sobre Gabaón y el valle de Ajalón, en las colinas al noroeste de Jerusalén: «Sol, detente en Gabaón; y tú, Luna, en el valle de Ajalón». Gabaón es el-Jib, a unos 9 km al noroeste de Jerusalén en línea recta; el valle de Ajalón, donde está el punto del mapa, se abre unos 21 km más al oeste, bajo el paso de Bet-horón. Josué habló en la batalla para salvar Gabaón, cuando hacía bajar de las colinas hacia la llanura a cinco reyes amorreos."
    - "Los gabaonitas habían hecho paz con Israel, y los reyes de Jerusalén, Hebrón, Jarmut, Laquis y Eglón los sitiaron. Josué «vino á ellos de repente, toda la noche subió desde Gilgal», una subida de unos 26 km en línea recta desde el valle del Jordán, los derrotó en Gabaón y los persiguió «por el camino que sube á Beth-oron», a unos 8 km al oeste, mientras caían sobre ellos piedras de granizo hasta Azeca, a unos 29 km al suroeste. Los reyes se escondieron en una cueva en Maceda, a unos 40 km de Gabaón. «Y el sol se detuvo y la luna se paró, hasta tanto que la gente se hubo vengado de sus enemigos»."
    - "Los lectores explican las palabras de varias maneras. Muchos las toman como un milagro en el que se alargó el día, como hizo Josefo; otros como poesía, pues el texto dice que está «escrito en el libro de Jasher», una colección perdida de cantos. El verbo hebreo puede significar «callar» o «cesar», y algunos leen un oscurecimiento más que un día más largo: C. J. Humphreys y G. Waddington lo vincularon con el eclipse anular del 30 de octubre del 1207 a. C., mientras que J. H. Walton leyó el sol y la luna colocados frente a frente como un presagio contra el enemigo. En el siglo IV, Eusebio situó el valle a tres millas al este de Betel; Jerónimo añadió que los judíos ponían Ajalón a dos millas de Nicópolis, lo que concuerda con Yalo, la aldea sobre el valle que muestra el mapa."
  pt:
    - "Sobre Gibeão e o vale de Aijalom, nos montes a noroeste de Jerusalém: “Sol, pare sobre Gibeom! E você, lua, pare no vale de Aijalom!” Gibeão é el-Jib, a cerca de 9 km a noroeste de Jerusalém em linha reta; o vale de Aijalom, onde está o ponto do mapa, se abre cerca de 21 km mais a oeste, abaixo da passagem de Bete-Horom. Josué falou na batalha para salvar Gibeão, quando expulsava cinco reis amorreus dos montes rumo à planície."
    - "Os gibeonitas tinham feito paz com Israel, e os reis de Jerusalém, Hebrom, Jarmute, Laquis e Eglom os sitiaram. Josué “chegou até eles de repente. Ele marchou de Gilgal a noite toda”, uma subida de cerca de 26 km em linha reta desde o vale do Jordão, derrotou-os em Gibeão e os perseguiu “pelo caminho da subida de Bete-Horom”, uns 8 km a oeste, enquanto pedras de granizo caíam sobre eles até Azeca, a cerca de 29 km a sudoeste. Os reis se esconderam numa caverna em Maquedá, a cerca de 40 km de Gibeão. “O sol parou, e a lua se deteve, até que a nação se vingasse dos seus inimigos.”"
    - "Os leitores explicam as palavras de vários modos. Muitos as tomam por milagre em que o dia se alongou, como fez Josefo; outros por poesia, já que o texto diz que está “escrito no livro de Jasar”, coletânea perdida de cantos. O verbo hebraico pode significar “calar-se” ou “cessar”, e alguns leem um escurecimento, não um dia mais longo: C. J. Humphreys e G. Waddington o ligaram ao eclipse anular de 30 de outubro de 1207 a.C., enquanto J. H. Walton leu sol e lua opostos um ao outro como presságio contra o inimigo. No século IV Eusébio situou o vale a três milhas a leste de Betel; Jerônimo acrescentou que os judeus punham Aijalom a duas milhas de Nicópolis, o que combina com Yalo, a aldeia acima do vale que o mapa mostra."
  de:
    - "Über Gibeon und dem Tal Ajalon, im Bergland nordwestlich von Jerusalem: „Sonne, stehe still zu Gibeon, und Mond, im Tal Ajalon!“ Gibeon ist el-Dschib, in der Luftlinie etwa 9 km nordwestlich von Jerusalem; das Tal Ajalon, wo der Kartenpunkt liegt, öffnet sich etwa 21 km weiter westlich, unterhalb des Passes von Bet-Horon. Josua sprach in der Schlacht zur Rettung Gibeons, als er fünf amoritische Könige von den Bergen hinab zur Ebene trieb."
    - "Die Gibeoniter hatten mit Israel Frieden geschlossen, und die Könige von Jerusalem, Hebron, Jarmut, Lachisch und Eglon belagerten sie. Also „kam Josua plötzlich über sie; denn die ganze Nacht zog er herauf von Gilgal“, ein Aufstieg von etwa 26 km Luftlinie aus dem Jordantal. Der HERR „schreckte sie vor Israel, daß sie eine große Schlacht schlugen zu Gibeon und jagten ihnen nach den Weg hinan zu Beth-Horon“, etwa 8 km westlich, während Hagelsteine bis Aseka auf sie fielen, etwa 29 km südwestlich. Die Könige versteckten sich in einer Höhle bei Makkeda, etwa 40 km von Gibeon. Und: „da stand die Sonne und der Mond still, bis daß sich das Volk an ihren Feinden rächte.“"
    - "Die Leser erklären die Worte auf verschiedene Weise. Viele nehmen sie als Wunder, bei dem der Tag verlängert wurde, wie Josephus; andere als Dichtung, da der Text sagt, es sei „im Buch des Frommen“ geschrieben, einer verlorenen Liedersammlung. Das hebräische Verb kann „schweigen“ oder „aufhören“ heißen, und manche lesen eine Verdunkelung statt eines längeren Tages: C. J. Humphreys und G. Waddington brachten sie mit der ringförmigen Sonnenfinsternis vom 30. Oktober 1207 v. Chr. in Verbindung, J. H. Walton las Sonne und Mond einander gegenüberstehend als Vorzeichen gegen den Feind. Im 4. Jahrhundert setzte Eusebius das Tal drei Meilen östlich von Bethel an; Hieronymus fügte hinzu, die Juden legten Ajalon zwei Meilen von Nikopolis, was zu Jalo passt, dem Dorf über dem Tal, das die Karte zeigt."
  fr:
    - "Au-dessus de Gabaon et de la vallée d’Ajalon, dans les collines au nord-ouest de Jérusalem : « Soleil, arrête-toi sur Gabaon, et toi, lune, sur la vallée d’Ajalon ! » Gabaon est el-Jib, à environ 9 km au nord-ouest de Jérusalem en ligne droite ; la vallée d’Ajalon, où se trouve le point de la carte, s’ouvre à environ 21 km plus à l’ouest, au-dessous du col de Beth-Horon. Josué parla durant la bataille livrée pour sauver Gabaon, tandis qu’il chassait cinq rois amoréens des collines vers la plaine."
    - "Les Gabaonites avaient fait la paix avec Israël, et les rois de Jérusalem, d’Hébron, de Jarmuth, de Lakis et d’Églon les assiégèrent. Josué « arriva subitement sur eux, après avoir marché toute la nuit depuis Guilgal », une montée d’environ 26 km en ligne droite depuis la vallée du Jourdain, les mit en déroute à Gabaon et les poursuivit « sur le chemin qui monte à Beth-Horon », à environ 8 km à l’ouest, tandis que des pierres de grêle tombaient sur eux jusqu’à Azéka, à environ 29 km au sud-ouest. Les rois se cachèrent dans une caverne à Makkéda, à environ 40 km de Gabaon. « Et le soleil s’arrêta, et la lune suspendit sa course, jusqu’à ce que la nation eût tiré vengeance de ses ennemis. »"
    - "Les lecteurs expliquent ces mots de plusieurs façons. Beaucoup y voient un miracle où le jour fut allongé, comme Josèphe ; d’autres, de la poésie, puisque le texte dit que cela est « écrit dans le livre du Juste », recueil de chants perdu. Le verbe hébreu peut signifier « se taire » ou « cesser », et certains y lisent un assombrissement plutôt qu’un jour plus long : C. J. Humphreys et G. Waddington l’ont rapproché de l’éclipse annulaire du 30 octobre 1207 av. J.-C., tandis que J. H. Walton a lu le soleil et la lune se faisant face comme un présage contre l’ennemi. Au IVe siècle, Eusèbe plaçait la vallée à trois milles à l’est de Béthel ; Jérôme ajoutait que les Juifs mettaient Ajalon à deux milles de Nicopolis, ce qui correspond à Yalo, le village au-dessus de la vallée que montre la carte."
  pl:
    - "Nad Gibeonem i doliną Ajjalon, w górach na północny zachód od Jerozolimy: „Słońce w Gabaon zastanów się, a miesiącu w dolinie Ajalon!” Gibeon to el-Dżib, około 9 km na północny zachód od Jerozolimy w linii prostej; dolina Ajjalon, gdzie stoi punkt na mapie, otwiera się około 21 km dalej na zachód, poniżej przełęczy Bet-Choron. Jozue przemówił w bitwie o ocalenie Gibeonu, gdy spędzał pięciu królów amorejskich ze wzgórz ku równinie."
    - "Gibeonici zawarli pokój z Izraelem, a królowie Jerozolimy, Hebronu, Jarmutu, Lakisz i Eglonu oblegli ich. „I przypadł na nie Jozue nagle; bo całą noc ciągnął z Galgal”, wspinaczka około 26 km w linii prostej z doliny Jordanu; rozgromił ich pod Gibeonem i gonił „drogą, którą chodzą ku Betoron”, około 8 km na zachód, a grad padał na nich aż do Azeki, około 29 km na południowy zachód. Królowie ukryli się w jaskini w Makkeda, około 40 km od Gibeonu. „I zastanowiło się słońce, a miesiąc stanął, aż się lud pomścił nad nieprzyjacioły swymi.”"
    - "Czytelnicy tłumaczą te słowa na kilka sposobów. Wielu uważa je za cud, w którym dzień został przedłużony, jak Józef Flawiusz; inni za poezję, skoro tekst powołuje się na to, co „napisano w księgach sprawiedliwego”, zaginiony zbiór pieśni. Hebrajski czasownik może znaczyć „milczeć” lub „ustać”, a niektórzy czytają zaciemnienie raczej niż dłuższy dzień: C. J. Humphreys i G. Waddington powiązali to z obrączkowym zaćmieniem Słońca z 30 października 1207 p.n.e., a J. H. Walton odczytał słońce i księżyc stojące naprzeciw siebie jako omen przeciw wrogowi. W IV wieku Euzebiusz umieścił dolinę trzy mile na wschód od Betel; Hieronim dodał, że Żydzi umieszczali Ajjalon dwie mile od Nikopolis, co pasuje do Jalo, wsi nad doliną, którą pokazuje mapa."
  it:
    - "Su Gabaon e sulla valle di Aialon, nelle colline a nord-ovest di Gerusalemme: «Sole, fermati su Gabaon, e tu, luna, sulla valle d’Aialon!» Gabaon è el-Jib, a circa 9 km a nord-ovest di Gerusalemme in linea retta; la valle di Aialon, dove si trova il punto della mappa, si apre circa 21 km più a ovest, sotto il passo di Bet-Oron. Giosuè parlò nella battaglia per salvare Gabaon, mentre cacciava cinque re amorrei dalle colline verso la pianura."
    - "I Gabaoniti avevano fatto pace con Israele, e i re di Gerusalemme, Ebron, Iarmut, Lachis ed Eglon li assediarono. Giosuè «piombò loro addosso all’improvviso: avea marciato tutta la notte da Ghilgal», una salita di circa 26 km in linea retta dalla valle del Giordano, li mise in rotta a Gabaon e li inseguì «per la via che sale a Beth-Horon», a circa 8 km a ovest, mentre grosse pietre di grandine cadevano su di loro fino ad Azeka, a circa 29 km a sud-ovest. I re si nascosero in una grotta a Makkeda, a circa 40 km da Gabaon. «E il sole si fermò, e la luna rimase al suo luogo, finché la nazione si fosse vendicata de’ suoi nemici»."
    - "I lettori spiegano le parole in vari modi. Molti le prendono come un miracolo in cui il giorno si allungò, come fece Giuseppe Flavio; altri come poesia, poiché il testo dice che è «scritto nel libro del Giusto», una raccolta perduta di canti. Il verbo ebraico può significare «tacere» o «cessare», e alcuni leggono un oscuramento più che un giorno più lungo: C. J. Humphreys e G. Waddington lo collegarono all’eclissi anulare del 30 ottobre 1207 a.C., mentre J. H. Walton lesse sole e luna uno di fronte all’altra come presagio contro il nemico. Nel IV secolo Eusebio collocava la valle a tre miglia a est di Betel; Girolamo aggiunse che gli Ebrei ponevano Aialon a due miglia da Nicopoli, il che si accorda con Yalo, il villaggio sopra la valle che la mappa mostra."
  nl:
    - "Boven Gibeon en het dal van Ajalon, in de heuvels ten noordwesten van Jeruzalem: “Zon, sta stil te Gibeon, en gij, maan, in het dal van Ajalon!” Gibeon is el-Jib, hemelsbreed ongeveer 9 km ten noordwesten van Jeruzalem; het dal van Ajalon, waar het punt op de kaart staat, opent zich ongeveer 21 km verder naar het westen, onder de pas van Beth-Horon. Jozua sprak tijdens de slag om Gibeon te redden, toen hij vijf Amorietische koningen van de heuvels naar de vlakte joeg."
    - "De Gibeonieten hadden vrede gesloten met Israël, en de koningen van Jeruzalem, Hebron, Jarmut, Lachis en Eglon belegerden hen. “Alzo kwam Jozua snellijk tot hen; den gansen nacht over was hij van Gilgal opgetrokken”, een klim van hemelsbreed ongeveer 26 km vanuit de Jordaanvallei; hij versloeg hen bij Gibeon en vervolgde hen “op den weg, waar men naar Beth-horon opgaat”, ongeveer 8 km naar het westen, terwijl hagelstenen op hen neervielen tot Azeka toe, ongeveer 29 km naar het zuidwesten. De koningen verborgen zich in een spelonk bij Makkeda, ongeveer 40 km van Gibeon. “En de zon stond stil, en de maan bleef staan, totdat zich het volk aan zijn vijanden gewroken had.”"
    - "Lezers verklaren de woorden op verschillende manieren. Velen nemen ze als een wonder waarbij de dag werd verlengd, zoals Josephus; anderen als poëzie, aangezien de tekst zegt dat het geschreven staat “in het boek des oprechten”, een verloren verzameling liederen. Het Hebreeuwse werkwoord kan “zwijgen” of “ophouden” betekenen, en sommigen lezen een verduistering in plaats van een langere dag: C. J. Humphreys en G. Waddington verbonden haar met de ringvormige zonsverduistering van 30 oktober 1207 v.Chr., terwijl J. H. Walton zon en maan die tegenover elkaar staan las als een voorteken tegen de vijand. In de vierde eeuw plaatste Eusebius het dal drie mijl ten oosten van Bethel; Hiëronymus voegde toe dat de Joden Ajalon twee mijl van Nicopolis plaatsten, wat past bij Yalo, het dorp boven het dal dat de kaart toont."
  cs:
    - "Nad Gibeonem a údolím Ajalon, v horách severozápadně od Jeruzaléma: „Slunce v Gabaon zastav se, a měsíc v údolí Aialon.“ Gibeon je al-Džíb, asi 9 km severozápadně od Jeruzaléma vzdušnou čarou; údolí Ajalon, kde stojí bod na mapě, se otevírá asi o 21 km dále na západ, pod průsmykem Bét-choron. Jozue promluvil v bitvě o záchranu Gibeonu, když hnal pět emorejských králů z hor dolů k pláni."
    - "Gibeonští uzavřeli s Izraelem mír a králové Jeruzaléma, Hebronu, Jarmutu, Lachiše a Eglonu je oblehli. Jozue na ně „připadl … v náhle, nebo celou noc táhl z Galgala“, výstup asi 26 km vzdušnou čarou z Jordánského údolí, porazil je u Gibeonu a honil je „cestou, kudy se jde k Betoron“, asi 8 km na západ, zatímco na ně padaly kroupy až k Azeku, asi 29 km jihozápadně. Králové se ukryli v jeskyni v Makedě, asi 40 km od Gibeonu. „I zastavilo se slunce, a stál měsíc, dokudž nepomstil se lid nad nepřátely svými.“"
    - "Čtenáři slova vykládají různě. Mnozí je berou jako zázrak, při němž se den prodloužil, jako Josephus Flavius; jiní jako poezii, neboť text praví, že je to „napsáno v knize Upřímého“, ztracené sbírce písní. Hebrejské sloveso může znamenat „mlčet“ nebo „přestat“ a někteří čtou spíše ztemnění než delší den: C. J. Humphreys a G. Waddington to spojili s prstencovým zatměním z 30. října 1207 př. n. l., zatímco J. H. Walton četl slunce a měsíc stojící proti sobě jako znamení proti nepříteli. Ve 4. století Eusebios umístil údolí tři míle východně od Bét-elu; Jeroným dodal, že Židé kladou Ajalon dvě míle od Nikopole, což odpovídá Jálú, vesnici nad údolím, kterou mapa ukazuje."
