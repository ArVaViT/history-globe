id: where-was-goshen
question:
  en: "Where was Goshen?"
  ru: "Где находилась земля Гесем?"
  uk: "Де був Гошен?"
  es: "¿Dónde estaba Gosén?"
  pt: "Onde ficava Gósen?"
  de: "Wo lag Goschen?"
  fr: "Où se trouvait Gosen ?"
answer:
  en:
    - "Goshen was the part of the eastern Nile Delta where Jacob's family settled and where Israel lived until the Exodus: the region around today's Faqus and Qantir and the Wadi Tumilat, which runs east from the Delta towards the Bitter Lakes. The map point stands there, about 321 km from Hebron in a straight line."
    - "Joseph told his brothers: “thou shalt dwell in the land of Goshen, and thou shalt be near unto me”, and when Pharaoh agreed, Joseph gave them “a possession in the land of Egypt, in the best of the land, in the land of Rameses”. So Goshen and the land of Rameses are the same district, and Rameses is the store city of Exodus 1:11, Pi-Ramesses, the Delta capital of Ramesses II at Qantir. The Greek translators of Genesis, who knew Egypt, rendered Goshen as “Gesem of Arabia” and placed Joseph's meeting with Jacob at Heroonpolis, a town in the Wadi Tumilat, now Tell el-Maskhuta."
    - "The region was grazing land on the edge of the Delta, fit for the shepherds whom Egyptians disliked, and it was separate enough for the plagues of flies and hail to spare it. Excavations at Tell el-Dab'a, beside Qantir, have uncovered Avaris, a city settled by Canaanites from the Middle Kingdom onwards and the capital of the Hyksos kings; whatever the date of Israel's stay, this is the Egypt in which the story is set. In the fourth century the pilgrim Egeria, coming back from Sinai, travelled for two days through the land of Goshen towards Tanis and called it the finest country she had ever seen."
  ru:
    - "Гесем — часть восточной дельты Нила, где поселилась семья Иакова и где Израиль жил до Исхода: область вокруг нынешних Факуса и Кантира и Вади-Тумилат, идущая от дельты на восток к Горьким озёрам. Точка на карте стоит там, примерно в 321 км от Хеврона по прямой."
    - "Иосиф сказал братьям: «ты будешь жить в земле Гесем; и будешь близ меня», а когда фараон согласился, дал им «владение в земле Египетской, в лучшей части земли, в земле Раамсес». Значит, Гесем и земля Раамсес — одна и та же область, а Раамсес — город для запасов из Исхода 1:11, Пер-Рамсес, столица Рамсеса II в дельте, у Кантира. Греческие переводчики Бытия, знавшие Египет, передали Гесем как «Гесем Аравийский» и поместили встречу Иосифа с Иаковом у Героонполя — городка в Вади-Тумилат, нынешнего Телль-эль-Масхуты."
    - "Это были пастбища на краю дельты, пригодные для пастухов, которых египтяне не любили, и достаточно обособленные, чтобы казни песьих мух и града обошли их стороной. Раскопки Телль-эль-Дабы рядом с Кантиром открыли Аварис — город, заселённый ханаанеями с эпохи Среднего царства и ставший столицей царей-гиксосов; какой бы ни была дата пребывания Израиля, это тот Египет, в котором разворачивается рассказ. В IV веке паломница Эгерия, возвращаясь с Синая, два дня шла через землю Гесем к Танису и писала, что прекраснее края не видела."
  uk:
    - "Гошен був частиною східної дельти Нілу, де оселилася родина Якова і де жив Ізраїль до Виходу: область навколо нинішніх Факуса й Кантіра та Ваді-Тумілат, що тягнеться на схід від дельти до Гірких озер. Точка на мапі стоїть там, приблизно за 321 км від Хеврона по прямій."
    - "Йосип сказав братам: «осядешся в Гозен землї, і будеш поблизу в мене», а коли фараон погодився, Йосип дав їм «державу в землї Египецькій, на луччій землї, в Раємзес землї». Отже, Гошен і земля Раамсес — той самий округ, а Раамсес — місто-комора з Книги Виходу 1:11, Пі-Рамсес, столиця дельти Рамсеса II у Кантірі. Грецькі перекладачі Книги Буття, які знали Єгипет, передали Гошен як «Гесем Аравійський» і місце зустрічі Йосипа з Яковом розмістили в Героонполі, місті у Ваді-Тумілат, нині Телль-ель-Машхута."
    - "Цей край був пасовищем на межі дельти, придатним для пастухів, яких єгиптяни не любили, і достатньо відокремленим, щоб кари мух і граду його оминули. Розкопки в Телль-ед-Дабі, поруч із Кантіром, виявили Аваріс — місто, заселене ханаанеями від часів Середнього царства і столицю царів-гіксосів; яка б не була дата перебування Ізраїлю, саме цей Єгипет є тлом оповіді. У IV ст. паломниця Егерія, повертаючись із Синаю, дві доби їхала землею Гошен до Танісу і назвала її найкращим краєм, який вона коли-небудь бачила."
  es:
    - "Gosén era la parte del delta oriental del Nilo donde se asentó la familia de Jacob y donde vivió Israel hasta el Éxodo: la región en torno a las actuales Faqus y Qantir y el Wadi Tumilat, que corre hacia el este desde el Delta en dirección a los Lagos Amargos. El punto del mapa está allí, a unos 321 km de Hebrón en línea recta."
    - "José dijo a sus hermanos: «habitarás en la tierra de Gosén, y estarás cerca de mí», y cuando el faraón estuvo de acuerdo, José les dio «posesión en la tierra de Egipto, en lo mejor de la tierra, en la tierra de Rameses». Así, Gosén y la tierra de Rameses son el mismo distrito, y Rameses es la ciudad de almacenaje de Éxodo 1:11, Pi-Ramsés, la capital de Ramsés II en el Delta, en Qantir. Los traductores griegos del Génesis, que conocían Egipto, vertieron Gosén como «Gesem de Arabia» y situaron el encuentro de José con Jacob en Heroónpolis, una ciudad del Wadi Tumilat, hoy Tell el-Maskhuta."
    - "La región era tierra de pastos en el borde del Delta, apta para los pastores a quienes los egipcios aborrecían, y estaba lo bastante apartada como para que las plagas de moscas y de granizo la respetaran. Las excavaciones en Tell el-Dab'a, junto a Qantir, han sacado a la luz Avaris, una ciudad poblada por cananeos desde el Reino Medio y capital de los reyes hicsos; sea cual sea la fecha de la estancia de Israel, este es el Egipto en que se sitúa el relato. En el siglo IV, la peregrina Egeria, de regreso del Sinaí, viajó dos días por la tierra de Gosén en dirección a Tanis y la llamó la mejor tierra que había visto jamás."
  pt:
    - "Gósen era a parte do leste do delta do Nilo onde se estabeleceu a família de Jacó e onde Israel viveu até o Êxodo: a região em torno dos atuais Faqus e Qantir e do Wadi Tumilat, que corre para o leste, do Delta em direção aos Lagos Amargos. O ponto do mapa fica ali, a cerca de 321 km de Hebrom em linha reta."
    - "José disse a seus irmãos: “Você habitará na terra de Gósen e estará perto de mim”, e quando o Faraó concordou, José lhes deu “propriedade na terra do Egito, no melhor da terra, na terra de Ramessés”. Assim Gósen e a terra de Ramessés são o mesmo distrito, e Ramessés é a cidade-armazém de Êxodo 1:11, Pi-Ramessés, a capital de Ramsés II no Delta, em Qantir. Os tradutores gregos do Gênesis, que conheciam o Egito, verteram Gósen como “Gesém da Arábia” e situaram o encontro de José com Jacó em Heroópolis, uma cidade do Wadi Tumilat, hoje Tell el-Maskhuta."
    - "A região era terra de pastagem na orla do Delta, adequada aos pastores de quem os egípcios não gostavam, e era separada o bastante para que as pragas das moscas e do granizo a poupassem. As escavações em Tell el-Dab'a, junto a Qantir, trouxeram à luz Avaris, cidade povoada por cananeus desde o Reino Médio e capital dos reis hicsos; qualquer que seja a data da estada de Israel, este é o Egito em que a história se passa. No século IV, a peregrina Egéria, ao voltar do Sinai, viajou dois dias pela terra de Gósen em direção a Tânis e a chamou a mais bela região que jamais vira."
  de:
    - "Goschen war der Teil des östlichen Nildeltas, in dem sich Jakobs Familie niederließ und Israel bis zum Exodus lebte: die Gegend um das heutige Faqus und Qantir und das Wadi Tumilat, das vom Delta nach Osten zu den Bitterseen verläuft. Dort steht der Kartenpunkt, in der Luftlinie etwa 321 km von Hebron entfernt."
    - "Josef sagte zu seinen Brüdern: „du sollst im Lande Gosen wohnen und nahe bei mir sein“, und als der Pharao zustimmte, gab Josef ihnen „Besitz in Ägyptenland, am besten Ort des Landes, im Lande Raemses“. Goschen und das Land Ramses sind also derselbe Bezirk, und Ramses ist die Vorratsstadt von 2. Mose 1,11, Pi-Ramesse, die Deltahauptstadt Ramses’ II. bei Qantir. Die griechischen Übersetzer der Genesis, die Ägypten kannten, gaben Goschen als „Gesem in Arabien“ wieder und verlegten die Begegnung Josefs mit Jakob nach Heroonpolis, einer Stadt im Wadi Tumilat, dem heutigen Tell el-Maskhuta."
    - "Die Gegend war Weideland am Rand des Deltas, geeignet für die Hirten, die die Ägypter nicht mochten, und abgelegen genug, dass die Plagen der Fliegen und des Hagels sie verschonten. Grabungen in Tell el-Daba neben Qantir haben Avaris freigelegt, eine Stadt, die seit dem Mittleren Reich von Kanaanäern besiedelt war und Hauptstadt der Hyksos-Könige; wie auch immer der Aufenthalt Israels zu datieren ist, dies ist das Ägypten, in dem die Erzählung spielt. Im 4. Jahrhundert reiste die Pilgerin Egeria auf der Rückkehr vom Sinai zwei Tage lang durch das Land Goschen in Richtung Tanis und nannte es das schönste Land, das sie je gesehen hatte."
  fr:
    - "Gosen était la partie orientale du delta du Nil où la famille de Jacob s’établit et où Israël vécut jusqu’à l’Exode : la région autour de Faqous et de Qantir actuelles et le Wadi Tumilat, qui s’étend vers l’est depuis le Delta en direction des lacs Amers. Le point de la carte s’y trouve, à environ 321 km d’Hébron à vol d’oiseau."
    - "Joseph dit à ses frères : « Tu habiteras dans le pays de Gosen, et tu seras près de moi », et quand Pharaon y consentit, Joseph leur donna « une propriété dans le pays d’Égypte, dans la meilleure partie du pays, dans la contrée de Ramsès ». Gosen et le pays de Ramsès sont donc le même district, et Ramsès est la ville-entrepôt d’Exode 1.11, Pi-Ramsès, la capitale de Ramsès II dans le Delta, à Qantir. Les traducteurs grecs de la Genèse, qui connaissaient l’Égypte, rendirent Gosen par « Gesem d’Arabie » et placèrent la rencontre de Joseph et de Jacob à Héroônpolis, ville du Wadi Tumilat, aujourd’hui Tell el-Maskhuta."
    - "La région était une terre de pâturage en bordure du Delta, propre aux bergers que les Égyptiens n’aimaient pas, et assez à part pour que les plaies des mouches et de la grêle l’épargnent. Les fouilles de Tell el-Dab’a, près de Qantir, ont mis au jour Avaris, ville peuplée de Cananéens dès le Moyen Empire et capitale des rois hyksôs ; quelle que soit la date du séjour d’Israël, c’est l’Égypte où se situe le récit. Au IVe siècle, la pèlerine Égérie, revenant du Sinaï, traversa pendant deux jours le pays de Gosen en direction de Tanis et le qualifia de plus beau pays qu’elle eût jamais vu."
