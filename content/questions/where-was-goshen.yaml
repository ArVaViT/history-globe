id: where-was-goshen
question:
  en: "Where was Goshen?"
  ru: "Где находилась земля Гесем?"
  uk: "Де був Гошен?"
  es: "¿Dónde estaba Gosén?"
  pt: "Onde ficava Gósen?"
  de: "Wo lag Goschen?"
  fr: "Où se trouvait Gosen ?"
  pl: "Gdzie leżał Goszen?"
  it: "Dov’era Gosen?"
  cs: "Kde ležel Gošen?"
  nl: "Waar lag Gosen?"
  sv: "Var låg Goshen?"
  nb: "Hvor lå Gosen?"
  tl: "Nasaan ang Gosen?"
  da: "Hvor lå Gosjen?"
  sr: "Где је био Гесем?"
  hu: "Hol volt Gósen?"
  fi: "Missä Gosen sijaitsi?"
  vi: "Gô-sen ở đâu?"
  ro: "Unde se afla Gosen?"
  bg: "Къде се е намирала земята Гесем?"
answer:
  en:
    - "Goshen was the part of the eastern Nile Delta where Jacob's family settled and where Israel lived until the Exodus: the region around today's Faqus and Qantir and the Wadi Tumilat, which runs east from the Delta towards the Bitter Lakes. The map point stands there, about 321 km from Hebron in a straight line."
    - "Joseph told his brothers: “thou shalt dwell in the land of Goshen, and thou shalt be near unto me”, and when Pharaoh agreed, Joseph gave them “a possession in the land of Egypt, in the best of the land, in the land of Rameses”. So Goshen and the land of Rameses are the same district, and Rameses is the store city of Exodus 1:11, Pi-Ramesses, the Delta capital of Ramesses II at Qantir. The Greek translators of Genesis, who knew Egypt, rendered Goshen as “Gesem of Arabia” and placed Joseph's meeting with Jacob at Heroonpolis, a town in the Wadi Tumilat, now Tell el-Maskhuta."
    - "The region was grazing land on the edge of the Delta, fit for the shepherds whom Egyptians disliked, and it was separate enough for the plagues of flies and hail to spare it. Excavations at Tell el-Dab'a, beside Qantir, have uncovered Avaris, a city settled by Canaanites from the Middle Kingdom onwards and the capital of the Hyksos kings; whatever the date of Israel's stay, this is the Egypt in which the story is set. In the fourth century the pilgrim Egeria, coming back from Sinai, travelled for two days through the land of Goshen towards Tanis and called it the finest country she had ever seen."
  ru:
    - "Гесем — часть восточной дельты Нила, где поселилась семья Иакова и где Израиль жил до Исхода: область вокруг нынешних Факуса и Кантира и Вади-Тумилат, идущая от дельты на восток к Горьким озёрам. Точка на карте стоит там, примерно в 321 км от Хеврона по прямой."
    - "Иосиф сказал братьям: «ты будешь жить в земле Гесем; и будешь близ меня», а когда фараон согласился, дал им «владение в земле Египетской, в лучшей части земли, в земле Раамсес». Значит, Гесем и земля Раамсес — одна и та же область, а Раамсес — город для запасов из Исхода 1:11, Пер-Рамсес, столица Рамсеса II в дельте, у Кантира. Греческие переводчики Бытия, знавшие Египет, передали Гесем как «Гесем Аравийский» и поместили встречу Иосифа с Иаковом у Героонполя — городка в Вади-Тумилат, нынешнего Телль-эль-Масхуты."
    - "Это были пастбища на краю дельты, пригодные для пастухов, которых египтяне не любили, и достаточно обособленные, чтобы казни песьих мух и града обошли их стороной. Раскопки Телль-эль-Дабы рядом с Кантиром открыли Аварис — город, заселённый ханаанеями с эпохи Среднего царства и ставший столицей царей-гиксосов; какой бы ни была дата пребывания Израиля, это тот Египет, в котором разворачивается рассказ. В IV веке паломница Эгерия, возвращаясь с Синая, два дня шла через землю Гесем к Танису и писала, что прекраснее края не видела."
  uk:
    - "Гошен був частиною східної дельти Нілу, де оселилася родина Якова і де жив Ізраїль до Виходу: область навколо нинішніх Факуса й Кантіра та Ваді-Тумілат, що тягнеться на схід від дельти до Гірких озер. Точка на мапі стоїть там, приблизно за 321 км від Хеврона по прямій."
    - "Йосип сказав братам: «осядешся в Гозен землї, і будеш поблизу в мене», а коли фараон погодився, Йосип дав їм «державу в землї Египецькій, на луччій землї, в Раємзес землї». Отже, Гошен і земля Раамсес — той самий округ, а Раамсес — місто-комора з Книги Виходу 1:11, Пі-Рамсес, столиця дельти Рамсеса II у Кантірі. Грецькі перекладачі Книги Буття, які знали Єгипет, передали Гошен як «Гесем Аравійський» і місце зустрічі Йосипа з Яковом розмістили в Героонполі, місті у Ваді-Тумілат, нині Телль-ель-Машхута."
    - "Цей край був пасовищем на межі дельти, придатним для пастухів, яких єгиптяни не любили, і достатньо відокремленим, щоб кари мух і граду його оминули. Розкопки в Телль-ед-Дабі, поруч із Кантіром, виявили Аваріс — місто, заселене ханаанеями від часів Середнього царства і столицю царів-гіксосів; яка б не була дата перебування Ізраїлю, саме цей Єгипет є тлом оповіді. У IV ст. паломниця Егерія, повертаючись із Синаю, дві доби їхала землею Гошен до Танісу і назвала її найкращим краєм, який вона коли-небудь бачила."
  es:
    - "Gosén era la parte del delta oriental del Nilo donde se asentó la familia de Jacob y donde vivió Israel hasta el Éxodo: la región en torno a las actuales Faqus y Qantir y el Wadi Tumilat, que corre hacia el este desde el Delta en dirección a los Lagos Amargos. El punto del mapa está allí, a unos 321 km de Hebrón en línea recta."
    - "José dijo a sus hermanos: «habitarás en la tierra de Gosén, y estarás cerca de mí», y cuando el faraón estuvo de acuerdo, José les dio «posesión en la tierra de Egipto, en lo mejor de la tierra, en la tierra de Rameses». Así, Gosén y la tierra de Rameses son el mismo distrito, y Rameses es la ciudad de almacenaje de Éxodo 1:11, Pi-Ramsés, la capital de Ramsés II en el Delta, en Qantir. Los traductores griegos del Génesis, que conocían Egipto, vertieron Gosén como «Gesem de Arabia» y situaron el encuentro de José con Jacob en Heroónpolis, una ciudad del Wadi Tumilat, hoy Tell el-Maskhuta."
    - "La región era tierra de pastos en el borde del Delta, apta para los pastores a quienes los egipcios aborrecían, y estaba lo bastante apartada como para que las plagas de moscas y de granizo la respetaran. Las excavaciones en Tell el-Dab'a, junto a Qantir, han sacado a la luz Avaris, una ciudad poblada por cananeos desde el Reino Medio y capital de los reyes hicsos; sea cual sea la fecha de la estancia de Israel, este es el Egipto en que se sitúa el relato. En el siglo IV, la peregrina Egeria, de regreso del Sinaí, viajó dos días por la tierra de Gosén en dirección a Tanis y la llamó la mejor tierra que había visto jamás."
  pt:
    - "Gósen era a parte do leste do delta do Nilo onde se estabeleceu a família de Jacó e onde Israel viveu até o Êxodo: a região em torno dos atuais Faqus e Qantir e do Wadi Tumilat, que corre para o leste, do Delta em direção aos Lagos Amargos. O ponto do mapa fica ali, a cerca de 321 km de Hebrom em linha reta."
    - "José disse a seus irmãos: “Você habitará na terra de Gósen e estará perto de mim”, e quando o Faraó concordou, José lhes deu “propriedade na terra do Egito, no melhor da terra, na terra de Ramessés”. Assim Gósen e a terra de Ramessés são o mesmo distrito, e Ramessés é a cidade-armazém de Êxodo 1:11, Pi-Ramessés, a capital de Ramsés II no Delta, em Qantir. Os tradutores gregos do Gênesis, que conheciam o Egito, verteram Gósen como “Gesém da Arábia” e situaram o encontro de José com Jacó em Heroópolis, uma cidade do Wadi Tumilat, hoje Tell el-Maskhuta."
    - "A região era terra de pastagem na orla do Delta, adequada aos pastores de quem os egípcios não gostavam, e era separada o bastante para que as pragas das moscas e do granizo a poupassem. As escavações em Tell el-Dab'a, junto a Qantir, trouxeram à luz Avaris, cidade povoada por cananeus desde o Reino Médio e capital dos reis hicsos; qualquer que seja a data da estada de Israel, este é o Egito em que a história se passa. No século IV, a peregrina Egéria, ao voltar do Sinai, viajou dois dias pela terra de Gósen em direção a Tânis e a chamou a mais bela região que jamais vira."
  de:
    - "Goschen war der Teil des östlichen Nildeltas, in dem sich Jakobs Familie niederließ und Israel bis zum Exodus lebte: die Gegend um das heutige Faqus und Qantir und das Wadi Tumilat, das vom Delta nach Osten zu den Bitterseen verläuft. Dort steht der Kartenpunkt, in der Luftlinie etwa 321 km von Hebron entfernt."
    - "Josef sagte zu seinen Brüdern: „du sollst im Lande Gosen wohnen und nahe bei mir sein“, und als der Pharao zustimmte, gab Josef ihnen „Besitz in Ägyptenland, am besten Ort des Landes, im Lande Raemses“. Goschen und das Land Ramses sind also derselbe Bezirk, und Ramses ist die Vorratsstadt von 2. Mose 1,11, Pi-Ramesse, die Deltahauptstadt Ramses’ II. bei Qantir. Die griechischen Übersetzer der Genesis, die Ägypten kannten, gaben Goschen als „Gesem in Arabien“ wieder und verlegten die Begegnung Josefs mit Jakob nach Heroonpolis, einer Stadt im Wadi Tumilat, dem heutigen Tell el-Maskhuta."
    - "Die Gegend war Weideland am Rand des Deltas, geeignet für die Hirten, die die Ägypter nicht mochten, und abgelegen genug, dass die Plagen der Fliegen und des Hagels sie verschonten. Grabungen in Tell el-Daba neben Qantir haben Avaris freigelegt, eine Stadt, die seit dem Mittleren Reich von Kanaanäern besiedelt war und Hauptstadt der Hyksos-Könige; wie auch immer der Aufenthalt Israels zu datieren ist, dies ist das Ägypten, in dem die Erzählung spielt. Im 4. Jahrhundert reiste die Pilgerin Egeria auf der Rückkehr vom Sinai zwei Tage lang durch das Land Goschen in Richtung Tanis und nannte es das schönste Land, das sie je gesehen hatte."
  fr:
    - "Gosen était la partie orientale du delta du Nil où la famille de Jacob s’établit et où Israël vécut jusqu’à l’Exode : la région autour de Faqous et de Qantir actuelles et le Wadi Tumilat, qui s’étend vers l’est depuis le Delta en direction des lacs Amers. Le point de la carte s’y trouve, à environ 321 km d’Hébron à vol d’oiseau."
    - "Joseph dit à ses frères : « Tu habiteras dans le pays de Gosen, et tu seras près de moi », et quand Pharaon y consentit, Joseph leur donna « une propriété dans le pays d’Égypte, dans la meilleure partie du pays, dans la contrée de Ramsès ». Gosen et le pays de Ramsès sont donc le même district, et Ramsès est la ville-entrepôt d’Exode 1.11, Pi-Ramsès, la capitale de Ramsès II dans le Delta, à Qantir. Les traducteurs grecs de la Genèse, qui connaissaient l’Égypte, rendirent Gosen par « Gesem d’Arabie » et placèrent la rencontre de Joseph et de Jacob à Héroônpolis, ville du Wadi Tumilat, aujourd’hui Tell el-Maskhuta."
    - "La région était une terre de pâturage en bordure du Delta, propre aux bergers que les Égyptiens n’aimaient pas, et assez à part pour que les plaies des mouches et de la grêle l’épargnent. Les fouilles de Tell el-Dab’a, près de Qantir, ont mis au jour Avaris, ville peuplée de Cananéens dès le Moyen Empire et capitale des rois hyksôs ; quelle que soit la date du séjour d’Israël, c’est l’Égypte où se situe le récit. Au IVe siècle, la pèlerine Égérie, revenant du Sinaï, traversa pendant deux jours le pays de Gosen en direction de Tanis et le qualifia de plus beau pays qu’elle eût jamais vu."
  pl:
    - "Goszen było częścią wschodniej Delty Nilu, gdzie osiedliła się rodzina Jakuba i gdzie Izrael mieszkał aż do Wyjścia: regionem wokół dzisiejszych Faqus i Qantir oraz Wadi Tumilat, które biegnie na wschód od Delty ku Jeziorom Gorzkim. Punkt na mapie stoi tam, około 321 km od Hebronu w linii prostej."
    - "Józef powiedział braciom: „I będziesz mieszkał w ziemi Gosen; a będziesz blisko mnie”, a gdy faraon się zgodził, Józef dał im „osiadłość w ziemi Egipskiej, w najlepszem miejscu onej krainy, w ziemi Rameses”. Goszen i ziemia Ramses to więc ten sam okręg, a Ramses to miasto składowe z Wj 1,11, Pi-Ramzes, stolica Delty Ramzesa II w Qantir. Greccy tłumacze Księgi Rodzaju, którzy znali Egipt, oddali Goszen jako „Gesem Arabii” i umieścili spotkanie Józefa z Jakubem w Heroonpolis, mieście w Wadi Tumilat, dziś Tell el-Maskhuta."
    - "Region był terenem pastwisk na skraju Delty, nadającym się dla pasterzy, których Egipcjanie nie lubili, i dość odrębnym, by plagi much i gradu go oszczędziły. Wykopaliska w Tell el-Dab'a, obok Qantir, odsłoniły Awaris, miasto zasiedlone przez Kananejczyków od czasów Państwa Środkowego i stolicę królów Hyksosów; niezależnie od daty pobytu Izraela, jest to Egipt, w którym toczy się opowieść. W IV wieku pątniczka Egeria, wracając z Synaju, podróżowała dwa dni przez ziemię Goszen ku Tanis i nazwała ją najpiękniejszym krajem, jaki kiedykolwiek widziała."
  it:
    - "Gosen era la parte del Delta orientale del Nilo in cui si stabilì la famiglia di Giacobbe e dove Israele visse fino all’Esodo: la regione attorno all’odierna Faqus e a Qantir e allo Wadi Tumilat, che corre verso est dal Delta in direzione dei Laghi Amari. Il punto della mappa si trova lì, a circa 321 km da Ebron in linea d’aria."
    - "Giuseppe disse ai suoi fratelli: «dimorerai nel paese di Goscen, e sarai vicino a me», e quando il faraone acconsentì, Giuseppe diede loro «un possesso nel paese d’Egitto, nella parte migliore del paese, nella contrada di Ramses». Dunque Gosen e la terra di Ramses sono lo stesso distretto, e Ramses è la città-magazzino di Es 1,11, Pi-Ramses, la capitale di Ramses II nel Delta a Qantir. I traduttori greci della Genesi, che conoscevano l’Egitto, resero Gosen con «Gesem d’Arabia» e collocarono a Heroonpolis, una città dello Wadi Tumilat, oggi Tell el-Maskhuta, l’incontro di Giuseppe con Giacobbe."
    - "La regione era una terra di pascolo al margine del Delta, adatta ai pastori che gli Egiziani non amavano, e abbastanza separata perché le piaghe delle mosche e della grandine la risparmiassero. Gli scavi di Tell el-Dab’a, accanto a Qantir, hanno portato alla luce Avaris, una città abitata da Cananei dal Medio Regno in poi e capitale dei re Hyksos; qualunque sia la data del soggiorno di Israele, questo è l’Egitto in cui è ambientata la storia. Nel IV secolo la pellegrina Egeria, tornando dal Sinai, viaggiò per due giorni attraverso la terra di Gosen in direzione di Tanis e la definì il più bel paese che avesse mai visto."
  cs:
    - "Gošen byla část východní delty Nilu, kde se usadila Jákobova rodina a kde Izrael žil až do exodu: oblast kolem dnešního Faqúsu a Qantíru a Wádí Tumílát, které vede od delty na východ k Hořkým jezerům. Bod na mapě stojí tam, vzdušnou čarou asi 321 km od Hebronu."
    - "Josef řekl bratrům: „bydliti budeš v zemi Gesen; a budeš blízko mne“, a když Farao souhlasil, Josef jim dal „vládařství v zemi Egyptské v kraji výborném, v zemi Ramesses“. Gošen a země Ramesse jsou tedy tentýž kraj a Ramesse je skladištní město z Exodu 1,11, Pi-Ramesse, deltská metropole Ramesse II. v Qantíru. Řečtí překladatelé Genese, kteří znali Egypt, převedli Gošen jako „Gesem Arábie“ a Josefovo setkání s Jákobem umístili do Héróonpole, města ve Wádí Tumílát, dnes Tell el-Maskhúta."
    - "Kraj byl pastvinou na okraji delty, vhodnou pro pastýře, jimiž Egypťané pohrdali, a byl dost oddělený, aby ho rány much a krupobití ušetřily. Vykopávky v Tell el-Dab‘a vedle Qantíru odkryly Avaris, město osídlené Kananejci od Střední říše a hlavní město hyksóských králů; ať už je datování pobytu Izraele jakékoli, je to Egypt, v němž se příběh odehrává. Ve 4. století poutnice Egerie, vracejíc se ze Sinaje, putovala dva dny zemí Gošen k Tanidě a nazvala ji nejkrásnější zemí, jakou kdy viděla."
  nl:
    - "Gosen was het deel van de oostelijke Nijldelta waar het gezin van Jakob zich vestigde en waar Israël woonde tot de uittocht: het gebied rond het huidige Faqus en Qantir en de Wadi Tumilat, die vanaf de Delta naar het oosten loopt in de richting van de Bittermeren. Het punt op de kaart staat daar, hemelsbreed ongeveer 321 km van Hebron."
    - "Jozef zei tegen zijn broers: “gij zult in het land Gosen wonen, en nabij mij wezen”, en toen Farao instemde, gaf Jozef hun “een bezitting in Egypteland, in het beste van het land, in het land Rameses”. Gosen en het land Raämses zijn dus hetzelfde district, en Raämses is de voorraadstad van Ex. 1:11, Pi-Ramses, de hoofdstad van Ramses II in de Delta bij Qantir. De Griekse vertalers van Genesis, die Egypte kenden, gaven Gosen weer als “Gesem van Arabië” en plaatsten de ontmoeting van Jozef met Jakob in Heroönpolis, een stad in de Wadi Tumilat, nu Tell el-Maskhuta."
    - "De streek was weideland aan de rand van de Delta, geschikt voor de herders die de Egyptenaren verafschuwden, en lag afgezonderd genoeg om door de plagen van de vliegen en de hagel te worden gespaard. Opgravingen bij Tell el-Dab'a, naast Qantir, hebben Avaris blootgelegd, een stad die vanaf het Middenrijk door Kanaänieten werd bewoond en de hoofdstad van de Hyksoskoningen was; wat de datering van Israëls verblijf ook is, dit is het Egypte waarin het verhaal zich afspeelt. In de vierde eeuw reisde de pelgrim Egeria, terugkerend van de Sinaï, twee dagen door het land Gosen naar Tanis en noemde het het mooiste land dat zij ooit had gezien."
  sv:
    - "Goshen var den del av östra Nildeltat där Jakobs familj bosatte sig och där Israel bodde fram till uttåget: trakten kring dagens Faqus och Qantir och Wadi Tumilat, som löper österut från deltat mot Bittersjöarna. Kartpunkten står där, omkring 321 km från Hebron i fågelvägen."
    - "Josef sade till sina bröder: ”Du skall få bo i landet Gosen och vara mig nära”, och när Farao gick med på det, ”gav” Josef dem ”besittning där, i den bästa delen av landet, i landet Rameses”. Goshen och Rameses land är alltså samma trakt, och Rameses är förrådsstaden i 2 Mos 1:11, Pi-Ramses, Ramses II:s huvudstad i deltat vid Qantir. De grekiska översättarna av Första Moseboken, som kände till Egypten, återgav Goshen som ”Gesem i Arabien” och förlade Josefs möte med Jakob till Heroonpolis, en stad i Wadi Tumilat, nu Tell el-Maskhuta."
    - "Trakten var betesmark i utkanten av deltat, lämplig för de herdar som egyptierna ogillade, och tillräckligt avskild för att flugplågan och haglet skulle skona den. Utgrävningar vid Tell el-Dab’a, bredvid Qantir, har avtäckt Avaris, en stad som bosattes av kananéer från Mellersta riket och framåt och som var hyksoskungarnas huvudstad; vilket år Israels vistelse än ska dateras till är detta det Egypten där berättelsen utspelar sig. På 300-talet reste pilgrimen Egeria, på väg tillbaka från Sinai, i två dagar genom Goshens land mot Tanis och kallade det det vackraste land hon någonsin hade sett."
  nb:
    - "Gosen var den delen av det østlige Nildeltaet der Jakobs familie slo seg ned og der Israel bodde til utvandringen: området rundt dagens Faqus og Qantir og Wadi Tumilat, som løper østover fra deltaet mot Bittersjøene. Kartpunktet står der, omtrent 321 km fra Hebron i luftlinje."
    - "Josef sa til sine brødre: «Du skal få bo i landet Gosen og være mig nær», og da Farao samtykket, ga Josef dem «eiendom i Egyptens land, i den beste del av landet, i landet Ra’amses». Gosen og Ramses-landet er altså det samme distriktet, og Ramses er forrådsbyen i 2 Mos 1,11, Pi-Ramesse, Ramses II’ hovedstad i deltaet ved Qantir. De greske oversetterne av Første Mosebok, som kjente Egypt, gjengav Gosen som «Gesem i Arabia» og plasserte Josefs møte med Jakob i Heroonpolis, en by i Wadi Tumilat, nå Tell el-Maskhuta."
    - "Området var beiteland i utkanten av deltaet, egnet for gjetere, som egypterne mislikte, og det lå så avsides at plagene med fluer og hagl skånet det. Utgravninger ved Tell el-Dab’a, ved siden av Qantir, har avdekket Avaris, en by bosatt av kanaanittene fra Midtre rike og utover og hovedstaden for hyksoskongene; uansett når Israels opphold ble datert, er dette Egypt slik fortellingen er satt. På 300-tallet reiste pilegrimen Egeria, på vei tilbake fra Sinai, i to dager gjennom landet Gosen mot Tanis og kalte det det fineste landet hun noen gang hadde sett."
  tl:
    - "Ang Gosen ay ang bahagi ng silangang Delta ng Nilo kung saan nanirahan ang pamilya ni Jacob at kung saan tumira ang Israel hanggang sa Exodo: ang rehiyon sa paligid ng kasalukuyang Faqus at Qantir at ng Wadi Tumilat, na umaabot sa silangan mula sa Delta patungo sa Mapait na mga Lawa. Naroon ang punto sa mapa, mga 321 km mula sa Hebron sa tuwid na guhit."
    - "Sinabi ni Jose sa kaniyang mga kapatid: “At ikaw ay tatahan sa lupain ng Gosen, at malalapit ka sa akin”, at nang sumang-ayon si Faraon, “sila'y binigyan ng pag-aari sa lupain ng Egipto, sa pinakamabuti sa lupain, sa lupain ng Rameses”. Kaya ang Gosen at ang lupain ng Rameses ay iisang distrito, at ang Rameses ay ang bayang kamaligan ng Exodo 1:11, ang Pi-Ramesses, ang kabisera sa Delta ni Ramesses II sa Qantir. Ang mga tagapagsalin na Griyego ng Genesis, na may kaalaman sa Egipto, ay isinalin ang Gosen bilang “Gesem ng Arabia” at inilagay ang pagtatagpo nina Jose at Jacob sa Heroonpolis, isang bayan sa Wadi Tumilat, ngayon ay Tell el-Maskhuta."
    - "Ang rehiyon ay lupang pastulan sa gilid ng Delta, angkop sa mga pastol na kinasusuklaman ng mga Egipcio, at sapat ang pagkakahiwalay nito upang iligtas ito ng mga salot ng langaw at graniso. Ang mga paghuhukay sa Tell el-Dab'a, sa tabi ng Qantir, ay nakatuklas sa Avaris, isang lungsod na tinirhan ng mga Cananeo mula pa sa Gitnang Kaharian at ang kabisera ng mga haring Hyksos; anuman ang petsa ng pananatili ng Israel, ito ang Egipto na pinagganapan ng kuwento. Noong ika-4 na siglo, ang peregrinong si Egeria, pabalik mula sa Sinai, ay naglakbay nang dalawang araw sa lupain ng Gosen patungong Tanis at tinawag itong pinakamagandang bansa na nakita niya kailanman."
  da:
    - "Gosjen var den del af det østlige Nildelta, hvor Jakobs familie bosatte sig, og hvor Israel boede indtil udtoget: egnen omkring nutidens Faqus og Qantir og Wadi Tumilat, som løber øst fra deltaet mod Bittersøerne. Kortets punkt står der, ca. 321 km fra Hebron i fugleflugt."
    - "Josef sagde til sine brødre: »Du skal bo i Gosen Land og være nær hos mig«, og da Farao gik med til det, gav Josef dem »Ejendom i Ægyptens Land, paa det bedste Sted i Landet, i det Land Raamses«. Gosjen og Ramses’ land er altså den samme egn, og Ramses er forrådsbyen i 2 Mos 1,11, Pi-Ramses, Ramses 2.’s deltahovedstad ved Qantir. De græske oversættere af Første Mosebog, som kendte Egypten, gengav Gosjen som »Gesem i Arabien« og placerede Josefs møde med Jakob ved Heroonpolis, en by i Wadi Tumilat, nu Tell el-Maskhuta."
    - "Egnen var græsland i udkanten af deltaet, egnet for de hyrder, som egypterne ikke brød sig om, og den lå afsides nok til, at plagerne med fluer og hagl skånede den. Udgravninger ved Tell el-Dab’a ved siden af Qantir har blotlagt Avaris, en by bosat af kana’anæere fra Middelriget og fremefter og hyksoskongernes hovedstad; uanset hvornår Israels ophold skal dateres, er dette det Egypten, som beretningen foregår i. I 300-tallet rejste pilgrimmen Egeria, på vej tilbage fra Sinai, i to dage gennem Gosjens land mod Tanis og kaldte det det dejligste land, hun nogensinde havde set."
  sr:
    - "Гесем је био део источне делте Нила где се настанила Јаковљева породица и где је Израел живео до Изласка: област око данашњих Факуса и Кантира и Вади Тумилата, који се од Делте пружа на исток ка Горким језерима. Тачка на карти стоји ту, око 321 км од Хеврона ваздушном линијом."
    - "Јосиф је поручио браћи: „Седећеш у земљи гесемској и бићеш близу мене“, а кад се Фараон сложио, Јосиф им даде „добро у земљи мисирској на најбољем месту те земље, у земљи рамеској“. Дакле, Гесем и земља Рамеса исти су крај, а Рамеса је град-складиште из Изл 1,11, Пи-Рамзес, престоница Рамзеса II у Делти, у Кантиру. Грчки преводиоци Постања, који су познавали Египат, превели су Гесем као „Гесем Арабије“ и сусрет Јосифа са Јаковом сместили су у Героонполис, град у Вади Тумилату, данас Тел ел-Маскхута."
    - "Област је била пашњак на ободу Делте, погодна за пастире које Египћани нису волели, и довољно одвојена да су је пошасти мува и града поштеделе. Ископавања у Тел ел-Дабји, поред Кантира, открила су Аварис, град који су Хананци насељавали од Средњег краљевства па надаље и престоницу хиксошких краљева; без обзира на датум боравка Израела, то је Египат у који је прича смештена. У четвртом веку ходочасница Егерија, враћајући се са Синаја, путовала је два дана кроз земљу Гесем ка Танису и назвала је најлепшом земљом коју је икад видела."
  hu:
    - "Gósen a keleti Nílus-delta azon része volt, ahol Jákób családja letelepedett, és ahol Izráel a kivonulásig élt: a mai Faqus és Qantir környéke és a Wadi Tumilat, mely a Deltától keletre a Keserű-tavak felé húzódik. A térkép pontja ott áll, Hebrontól légvonalban mintegy 321 km-re."
    - "József ezt mondta testvéreinek: „Gósen földén lakozol, és én hozzám közel leszesz”, és mikor a fáraó beleegyezett, József adott nekik „birtokot Égyiptom földén, annak a földnek legjobb részében a Rameszesz földén”. Gósen és Rameszesz földje tehát ugyanaz a vidék, Ramszesz pedig a 2Móz 1,11 raktárvárosa, Pi-Ramszesz, II. Ramszesz deltai fővárosa Qantirnál. Mózes első könyvének görög fordítói, akik ismerték Egyiptomot, Gósent „Arábiai Gesemnek” fordították, és József találkozását Jákóbbal Héroónpoliszba helyezték, a Wadi Tumilat egy városába, a mai Tell el-Maskhutába."
    - "A vidék legelő volt a Delta szélén, alkalmas a pásztoroknak, akiket az egyiptomiak nem szerettek, és eléggé elkülönült ahhoz, hogy a légy- és jégcsapás megkímélje. A Qantir melletti Tell el-Dab'a ásatásai feltárták Avariszt, a Középbirodalom óta kánaániak lakta várost, a hükszosz királyok fővárosát; bármikor volt is Izráel tartózkodása, ez az az Egyiptom, amelyben a történet játszódik. A 4. században Egeria zarándok, a Sínairól visszatérve, két napig utazott Gósen földjén Tanisz felé, és úgy nevezte, hogy ez a legszebb ország, amelyet valaha látott."
  fi:
    - "Gosen oli Niilin suiston itäosa, jonne Jaakobin perhe asettui ja jossa Israel asui Egyptistä lähtöön asti: nykyisen Faqusin ja Qantirin ympäristö sekä Wadi Tumilat, joka kulkee itään suistosta kohti Katkeria järviä. Kartan piste on siellä, linnuntietä noin 321 km Hebronista."
    - "Joosef sanoi veljilleen: ”Sinä saat asettua Goosenin maakuntaan ja olla minun läheisyydessäni”, ja kun farao suostui, Joosef antoi heille ”maaomaisuutta maan parhaasta osasta, Ramseksen maakunnasta”. Gosen ja Ramseksen maa ovat siis sama alue, ja Ramses on 2. Moos. 1:11:n varastokaupunki Pi-Ramses, Ramses II:n suiston pääkaupunki Qantirissa. Mooseksen ensimmäisen kirjan kreikkalaiset kääntäjät, jotka tunsivat Egyptin, kääntivät Gosenin muotoon ”Arabian Gesem” ja sijoittivat Joosefin ja Jaakobin tapaamisen Heroonpolikseen, Wadi Tumilatin kaupunkiin, nykyiseen Tell el-Maskhutaan."
    - "Alue oli suiston reunalla sijaitsevaa laidunmaata, sopivaa paimenille, joita egyptiläiset inhosivat, ja se oli riittävän erillinen, jotta paarmojen ja rakeiden vitsaukset säästivät sen. Tell el-Dab'an kaivaukset Qantirin vieressä ovat paljastaneet Avariksen, keskivaltakunnan ajoista asti kanaanilaisten asuttaman kaupungin ja hyksoskuninkaiden pääkaupungin; Israelin oleskelun ajoituksesta riippumatta tämä on se Egypti, jossa kertomus tapahtuu. 300-luvulla pyhiinvaeltaja Egeria, palatessaan Siinailta, kulki kaksi päivää Gosenin maan halki kohti Taniksia ja kutsui sitä hienoimmaksi maaksi, jonka oli koskaan nähnyt."
  vi:
    - "Gô-sen là phần phía đông của châu thổ sông Ni-lơ, nơi gia đình Gia-cốp định cư và nơi Y-sơ-ra-ên sống cho đến cuộc Xuất hành: vùng quanh Faqus và Qantir ngày nay và Wadi Tumilat, chạy về phía đông từ châu thổ hướng đến các Hồ Đắng. Điểm trên bản đồ nằm ở đó, cách Hếp-rôn khoảng 321 km theo đường thẳng."
    - "Giô-sép nói với các anh em: “ở tại xứ Gô-sen gần tôi đây”, và khi Pha-ra-ôn đồng ý, Giô-sép cho họ “một sở đất tốt nhất trong xứ Ê-díp-tô… tại miền Ram-se”. Vậy Gô-sen và xứ Ram-se-sơ là cùng một vùng, và Ram-se-sơ là thành kho của Xuất Ê-díp-tô Ký 1:11, Pi-Ramesses, kinh đô vùng châu thổ của Ram-se-sơ II tại Qantir. Các dịch giả Hy Lạp của sách Sáng thế, những người biết Ê-díp-tô, dịch Gô-sen là “Gesem xứ A-ra-bi” và đặt cuộc gặp của Giô-sép với Gia-cốp tại Heroonpolis, một thị trấn ở Wadi Tumilat, nay là Tell el-Maskhuta."
    - "Vùng này là đất chăn thả ở rìa châu thổ, thích hợp cho những người chăn chiên mà người Ê-díp-tô không ưa, và đủ tách biệt để các tai vạ ruồi và mưa đá không đụng đến. Các cuộc khai quật tại Tell el-Dab’a, bên cạnh Qantir, đã phát lộ Avaris, một thành do người Ca-na-an định cư từ thời Trung Vương quốc trở đi và là kinh đô của các vua Hyksos; dù niên đại cuộc lưu trú của Y-sơ-ra-ên là khi nào, đây là Ê-díp-tô mà câu chuyện lấy làm bối cảnh. Vào thế kỷ 4, nữ hành hương Egeria, trên đường từ Sinai trở về, đã đi hai ngày xuyên qua xứ Gô-sen hướng đến Tanis và gọi đó là miền đất đẹp nhất bà từng thấy."
  ro:
    - "Gosen era partea de est a Deltei Nilului unde s-a așezat familia lui Iacov și unde a locuit Israel până la Exod: regiunea din jurul actualelor Faqus și Qantir și Wadi Tumilat, care se întinde spre est dinspre Deltă către Lacurile Amare. Punctul de pe hartă se află acolo, la circa 321 km de Hebron în linie dreaptă."
    - "Iosif le-a spus fraților săi: „Vei lăcuì în pământul Ghesem al Araviei, și vei fi aproape de mine”, iar când Faraon a încuviințat, Iosif „le-a dat lor moșie în pământul Eghipetului, în pământul cel mai bun, în pământul Rames”. Așadar Gosen și ținutul Ramses sunt același district, iar Ramses este cetatea de aprovizionare din Ieșirea 1:11, Pi-Ramses, capitala Deltei a lui Ramses al II-lea, la Qantir. Traducătorii greci ai Genezei, care cunoșteau Egiptul, au redat Gosen prin „Ghesem al Araviei” și au așezat întâlnirea lui Iosif cu Iacov la Heroonpolis, un oraș din Wadi Tumilat, azi Tell el-Maskhuta."
    - "Regiunea era un ținut de pășune la marginea Deltei, potrivit păstorilor pe care egiptenii îi disprețuiau, și destul de separat încât plăgile muștelor și ale grindinei să-l cruțe. Săpăturile de la Tell el-Dab’a, lângă Qantir, au scos la lumină Avaris, un oraș locuit de canaaniți începând din Regatul Mijlociu și capitala regilor hicsoși; oricare ar fi data șederii lui Israel, acesta este Egiptul în care se petrece povestea. În secolul al IV-lea pelerina Egeria, întorcându-se de la Sinai, a călătorit două zile prin ținutul Gosen către Tanis și l-a numit cea mai frumoasă țară pe care o văzuse vreodată."
  bg:
    - "Гесем е частта от източната делта на Нил, където се засели семейството на Яков и където Израил живя до Изхода: областта около днешните Факус и Кантир и Уади Тумилат, която се простира на изток от делтата към Горчивите езера. Точката на картата стои там, на около 321 км от Хеврон по права линия."
    - "Йосиф каза на братята си: „ще се населиш в земята Гесен, и ще бъдеш близу при мене“, а когато фараонът се съгласи, Йосиф им даде „притежание в Египетската земя, на най-доброто място на земята, в Рамесийската земя“. Така Гесем и земята Раамсес са една и съща област, а Раамсес е градът-склад от Изход 1:11 — Пи-Рамзес, столицата на Рамзес II в делтата, при Кантир. Гръцките преводачи на Битие, които познаваха Египет, предадоха Гесем като „Гесем Арабска“ и поставиха срещата на Йосиф с Яков при Хероонпол — град в Уади Тумилат, днес Тел ел-Масхута."
    - "Областта беше пасищна земя на края на делтата, подходяща за пастирите, които египтяните не обичаха, и достатъчно отделена, за да я пощадят язвите с мухите и градушката. Разкопките в Тел ел-Даба, до Кантир, разкриха Аварис — град, заселен от ханаанци от Средното царство нататък и столица на царете хиксоси; каквато и да е датата на престоя на Израил, това е Египет, в който се развива разказът. През IV в. поклонничката Егерия, връщайки се от Синай, пътува два дни през земята Гесем към Танис и я нарече най-хубавата страна, която някога е виждала."
