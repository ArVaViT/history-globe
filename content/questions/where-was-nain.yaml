id: where-was-nain
question:
  en: "Where was Nain, where Jesus raised the widow's son?"
  ru: "Где находился Наин, где Иисус воскресил сына вдовы?"
  uk: "Де був Наїн, де Ісус воскресив сина вдови?"
  es: "¿Dónde estaba Naín, donde Jesús resucitó al hijo de la viuda?"
  pt: "Onde ficava Naim, onde Jesus ressuscitou o filho da viúva?"
  de: "Wo lag Nain, wo Jesus den Sohn der Witwe auferweckte?"
  fr: "Où se trouvait Naïn, où Jésus ressuscita le fils de la veuve ?"
answer:
  en:
    - "Nain is the Arab village of Nein in Lower Galilee, in today's Israel, on the northern slope of the hill of Moreh, looking across the Jezreel valley to Mount Tabor; the map point stands on it. It lies about 9 km south-east of Nazareth and 7 km south-west of Tabor in a straight line, and about 96 km north of Jerusalem. The old name has survived, and the identification is generally accepted."
    - "Luke alone tells the story. As Jesus “came nigh to the gate of the city, behold, there was a dead man carried out, the only son of his mother, and she was a widow”. He touched the bier and said, “Young man, I say unto thee, Arise. And he that was dead sat up, and began to speak. And he delivered him to his mother.” The crowd cried, “That a great prophet is risen up among us”. The King James text says he came there “the day after” healing the centurion's servant in Capernaum, some 35 km away in a straight line, a long day's walk; other manuscripts say only that it was soon afterwards, as the Synodal translation has it."
    - "The words “delivered him to his mother” repeat what Elijah did for the widow of Zarephath, and the place recalls Elisha: Shunem, where he raised the Shunammite's son, lies only about 3 km away on the other side of the same hill. Eusebius placed Nain near Endor south of Tabor, and Jerome writes that in the 380s it was pointed out to Paula from the mountain. Small excavations in the village have found a hiding complex of the Roman period, Byzantine winepresses and later houses, but nothing of a walled town; Luke's “gate” may mean simply the way out of the village."
  ru:
    - "Наин — это арабское селение Нейн в Нижней Галилее, на территории нынешнего Израиля, на северном склоне холма Море, откуда через Изреельскую долину видна гора Фавор; точка карты стоит на нём. Оно лежит примерно в 9 км к юго-востоку от Назарета и в 7 км к юго-западу от Фавора по прямой и примерно в 96 км к северу от Иерусалима. Древнее имя сохранилось, и отождествление общепринято."
    - "Рассказ есть только у Луки. Когда Иисус «приблизился к городским воротам, тут выносили умершего, единственного сына у матери, а она была вдова». Он прикоснулся к одру и сказал: «юноша! тебе говорю, встань! Мертвый, поднявшись, сел и стал говорить; и отдал его Иисус матери его». Народ восклицал: «великий пророк восстал между нами». Синодальный перевод начинает рассказ словами «После сего»; в других рукописях, как в английской Библии короля Якова, сказано, что это было на следующий день после исцеления слуги сотника в Капернауме, а это около 35 км по прямой — долгий дневной переход."
    - "Слова «отдал его… матери его» повторяют то, что Илия сделал для вдовы из Сарепты, а само место напоминает об Елисее: Сонам, где он воскресил сына сонамитянки, лежит всего примерно в 3 км отсюда, по другую сторону того же холма. Евсевий помещал Наин близ Аэндора к югу от Фавора, а Иероним пишет, что в 380-х годах его показали Павле с горы. Небольшие раскопки в селении нашли подземное убежище римского времени, византийские винодавильни и более поздние дома, но ничего от обнесённого стеной города; «ворота» у Луки могут означать просто выход из селения."
  uk:
    - "Наїн — це арабське село Нейн у Нижній Галілеї, нині в Ізраїлі, на північному схилі пагорба Море, звідки видно Єзреельську долину й гору Фавор; точка на мапі стоїть на ньому. Він лежить приблизно за 9 км на південний схід від Назарета і за 7 км на південний захід від Фавору по прямій, і приблизно за 96 км на північ від Єрусалима. Стара назва збереглася, і це ототожнення загальноприйняте."
    - "Цю оповідь має лише Лука. Коли Ісус «наближив ся до городських воріт, аж ось винесено мертвого, сина єдиного в матері своєї, вона ж була вдова». Він торкнувся мар і сказав: «Молодче, тобі глаголю: встань. І сїв мерлець, і почав говорити. І оддав його матері його.» Натовп вигукнув: «Що пророк великий устав між нами». У тексті Біблії короля Якова сказано, що він прибув туди «наступного дня» після зцілення слуги сотника в Капернаумі, приблизно за 35 км по прямій, — довгий день ходу; в інших рукописах сказано лише, що це було невдовзі потому, як у синодальному перекладі."
    - "Слова «оддав його матері його» повторюють те, що Ілля зробив для вдови із Сарепти, а місце нагадує Єлисея: Сунем, де він воскресив сина сунамітянки, лежить лише приблизно за 3 км по інший бік того самого пагорба. Євсевій розмістив Наїн біля Ендора на південь від Фавору, а Єронім пише, що в 380-х рр. його показували Паулі з гори. Невеликі розкопки в селі виявили сховище римської доби, візантійські винні преси й пізніші будинки, але нічого від міста з мурами; «ворота» в Луки можуть означати просто вихід із села."
  es:
    - "Naín es la aldea árabe de Nein, en la Baja Galilea, en el actual Israel, en la ladera norte del collado de Moré, mirando a través del valle de Jezreel hacia el monte Tabor; el punto del mapa está sobre ella. Queda a unos 9 km al sureste de Nazaret y a 7 km al suroeste del Tabor en línea recta, y a unos 96 km al norte de Jerusalén. El antiguo nombre ha sobrevivido, y la identificación se acepta en general."
    - "Solo Lucas cuenta la historia. Cuando Jesús «llegó cerca de la puerta de la ciudad, he aquí que sacaban fuera á un difunto, unigénito de su madre, la cual también era viuda». Tocó el féretro y dijo: «Mancebo, á ti digo, levántate. Entonces se incorporó el que había muerto, y comenzó á hablar. Y dióle á su madre». La multitud exclamó: «Que un gran profeta se ha levantado entre nosotros». El texto de la King James dice que llegó allí el día siguiente de sanar al siervo del centurión en Cafarnaúm, a unos 35 km en línea recta, una larga jornada a pie; otros manuscritos dicen solo que fue poco después, como en la traducción sinodal."
    - "Las palabras «dióle á su madre» repiten lo que hizo Elías por la viuda de Sarepta, y el lugar recuerda a Eliseo: Sunem, donde resucitó al hijo de la sunamita, queda a solo unos 3 km, al otro lado de la misma colina. Eusebio situó Naín cerca de Endor, al sur del Tabor, y Jerónimo escribe que en la década del 380 se la señalaron a Paula desde el monte. Pequeñas excavaciones en la aldea han hallado un complejo de escondites de época romana, lagares bizantinos y casas posteriores, pero nada de una ciudad amurallada; la «puerta» de Lucas puede significar simplemente la salida de la aldea."
  pt:
    - "Naim é a aldeia árabe de Nein, na Baixa Galileia, no atual Israel, na encosta norte da colina de Moré, de frente, do outro lado do vale de Jezreel, para o monte Tabor; o ponto do mapa fica sobre ela. Fica a cerca de 9 km a sudeste de Nazaré e 7 km a sudoeste do Tabor em linha reta, e a cerca de 96 km ao norte de Jerusalém. O antigo nome sobreviveu, e a identificação é geralmente aceita."
    - "Somente Lucas conta a história. Quando Jesus “chegou perto da porta da cidade, eis que estava sendo levado para fora um morto, o filho unigênito de sua mãe, e ela era viúva”. Ele tocou o caixão e disse: “Jovem, eu lhe digo, levante-se… Aquele que estava morto sentou-se e começou a falar. Então ele o entregou à sua mãe.” A multidão exclamou: “Um grande profeta se levantou entre nós!” O texto da King James diz que ele chegou ali no dia seguinte à cura do servo do centurião em Cafarnaum, a cerca de 35 km em linha reta, uma longa jornada de um dia; outros manuscritos dizem apenas que foi logo depois, como na tradução Sinodal."
    - "As palavras “o entregou à sua mãe” repetem o que Elias fez pela viúva de Sarepta, e o lugar lembra Eliseu: Suném, onde ele ressuscitou o filho da sunamita, fica a apenas cerca de 3 km, do outro lado da mesma colina. Eusébio situou Naim perto de En-Dor, ao sul do Tabor, e Jerônimo escreve que na década de 380 ela foi mostrada a Paula do alto do monte. Pequenas escavações na aldeia encontraram um complexo de esconderijos do período romano, lagares bizantinos e casas posteriores, mas nada de uma cidade murada; a “porta” de Lucas pode significar simplesmente a saída da aldeia."
  de:
    - "Nain ist das arabische Dorf Nein in Untergaliläa, im heutigen Israel, am Nordhang des Hügels More mit Blick über die Jesreel-Ebene zum Tabor; der Kartenpunkt steht darauf. Es liegt in der Luftlinie etwa 9 km südöstlich von Nazareth und 7 km südwestlich des Tabor sowie etwa 96 km nördlich von Jerusalem. Der alte Name hat sich erhalten, und die Gleichsetzung ist allgemein anerkannt."
    - "Nur Lukas erzählt die Geschichte. Als Jesus „nahe an das Stadttor kam, siehe, da trug man einen Toten heraus, der ein einziger Sohn war seiner Mutter, und sie war eine Witwe“. Er rührte die Bahre an und sprach: „Jüngling, ich sage dir, stehe auf! Und der Tote richtete sich auf und fing an zu reden; und er gab ihn seiner Mutter.“ Die Menge rief: „Es ist ein großer Prophet unter uns aufgestanden“. Der Text der King-James-Bibel sagt, er sei am folgenden Tag dorthin gekommen, nachdem er in Kapernaum den Knecht des Hauptmanns geheilt hatte, in der Luftlinie rund 35 km entfernt, ein langer Tagesmarsch; andere Handschriften sagen nur, es sei bald danach gewesen, wie es die synodale Übersetzung hat."
    - "Die Worte „er gab ihn seiner Mutter“ wiederholen, was Elia für die Witwe von Sarepta tat, und der Ort erinnert an Elisa: Schunem, wo er den Sohn der Sunamiterin auferweckte, liegt nur etwa 3 km entfernt auf der anderen Seite desselben Hügels. Eusebius setzte Nain bei Endor südlich des Tabor an, und Hieronymus schreibt, in den 380er-Jahren sei es Paula vom Berg aus gezeigt worden. Kleine Grabungen im Dorf haben ein Verstecksystem der römischen Zeit, byzantinische Keltern und spätere Häuser gefunden, aber nichts von einer ummauerten Stadt; das „Tor“ des Lukas kann einfach den Ausgang aus dem Dorf meinen."
  fr:
    - "Naïn est le village arabe de Nein, en Basse Galilée, dans l’Israël actuel, sur le versant nord de la colline de Moré, face à la vallée de Jizreel et au mont Thabor ; le point de la carte s’y trouve. Il est à environ 9 km au sud-est de Nazareth et à 7 km au sud-ouest du Thabor à vol d’oiseau, et à environ 96 km au nord de Jérusalem. L’ancien nom a survécu, et l’identification est généralement admise."
    - "Seul Luc raconte l’histoire. Quand Jésus « fut près de la porte de la ville, voici, on portait en terre un mort, fils unique de sa mère, qui était veuve ». Il toucha le cercueil et dit : « Jeune homme, je te le dis, lève-toi ! Et le mort s’assit, et se mit à parler. Jésus le rendit à sa mère. » La foule s’écria : « Un grand prophète a paru parmi nous ». Le texte de la King James Version dit qu’il y vint « le jour suivant », après avoir guéri à Capernaüm le serviteur du centenier, à quelque 35 km à vol d’oiseau, une longue journée de marche ; d’autres manuscrits disent seulement que ce fut peu après, comme le rend la Bible synodale russe."
    - "Les mots « le rendit à sa mère » reprennent ce que fit Élie pour la veuve de Sarepta, et le lieu rappelle Élisée : Sunem, où il ressuscita le fils de la Sunamite, n’est qu’à environ 3 km, de l’autre côté de la même colline. Eusèbe plaçait Naïn près d’En-Dor, au sud du Thabor, et Jérôme écrit que, dans les années 380, on la montra à Paule depuis la montagne. De petites fouilles dans le village ont mis au jour un complexe de cachettes de l’époque romaine, des pressoirs byzantins et des maisons plus tardives, mais rien qui évoque une ville fortifiée ; la « porte » de Luc peut désigner simplement la sortie du village."
