id: where-was-cyprus-in-the-bible
question:
  en: "Where is Cyprus in the Bible?"
  ru: "Где Кипр в Библии?"
  uk: "Де Кіпр у Біблії?"
  es: "¿Dónde está Chipre en la Biblia?"
  pt: "Onde fica Chipre na Bíblia?"
  de: "Wo liegt Zypern in der Bibel?"
  fr: "Où est Chypre dans la Bible ?"
  pl: "Gdzie jest Cypr w Biblii?"
  it: "Dov’è Cipro nella Bibbia?"
  nl: "Waar ligt Cyprus in de Bijbel?"
  cs: "Kde je Kypr v Bibli?"
  sv: "Var ligger Cypern i Bibeln?"
  nb: "Hvor ligger Kypros i Bibelen?"
  tl: "Nasaan ang Chipre sa Biblia?"
  da: "Hvor er Cypern i Bibelen?"
  sr: "Где је Кипар у Библији?"
  hu: "Hol van Ciprus a Bibliában?"
  fi: "Missä Kypros on Raamatussa?"
  vi: "Chíp-rơ ở đâu trong Kinh Thánh?"
  ro: "Unde este Ciprul în Biblie?"
  bg: "Къде е Кипър в Библията?"
answer:
  en:
    - "Cyprus is the island in the north-eastern corner of the Mediterranean, the same island as today, about 75 km off the coast of Asia Minor and 100 km off Syria. The Old Testament calls it Kittim or Chittim, after the city of Kition at modern Larnaca; the New Testament calls it Cyprus and sets three scenes there: Barnabas's homeland, Paul's first mission, and the ships of Paul's later voyages sailing past it. Salamis, its chief port on the east coast, is about 210 km from Seleucia, the port of Antioch, and about 400 km from Jerusalem in a straight line."
    - "In the prophets Kittim is a land of ships and the far west: Balaam foresees that “ships shall come from the coast of Chittim, and shall afflict Asshur”; Jeremiah says “pass over the isles of Chittim, and see”; Ezekiel's Tyre has benches of ivory “brought out of the isles of Chittim”. In time the name came to mean any western seafarers, and Daniel's “ships of Chittim” are the Romans who turned back Antiochus IV from Egypt in 168 BC. Josephus already explains that Kittim was Cyprus, and that the Hebrews called all islands and coasts by that name."
    - "Joseph Barnabas was “a Levite, and of the country of Cyprus”. Believers scattered after the death of Stephen “travelled as far as Phenice, and Cyprus, and Antioch”. About AD 47 Barnabas and Saul “departed unto Seleucia; and from thence they sailed to Cyprus”, preached in the synagogues of Salamis and went “through the isle unto Paphos”, the Roman capital on the west coast, 145 km further, where the proconsul Sergius Paulus “believed, being astonished at the doctrine of the Lord”. Later Barnabas “took Mark, and sailed unto Cyprus” on his own. Paul's ship to Jerusalem “discovered Cyprus” and left it “on the left hand”; on the way to Rome “we sailed under Cyprus, because the winds were contrary”. The island is treated more fully in its article."
  ru:
    - "Кипр — остров в северо-восточном углу Средиземного моря, тот же, что и сегодня, примерно в 75 км от берега Малой Азии и в 100 км от Сирии. Ветхий Завет называет его Киттимом, по городу Китион на месте нынешней Ларнаки; Новый Завет зовёт Кипром и помещает там три сюжета: родину Варнавы, первую миссию Павла и корабли последующих путешествий Павла, проходившие мимо. Саламин, его главная гавань на восточном берегу, лежит примерно в 210 км от Селевкии, гавани Антиохии, и в 400 км от Иерусалима по прямой."
    - "У пророков Киттим — страна кораблей и дальнего запада: Валаам предвидит, что «придут корабли от Киттима, и смирят Ассура»; Иеремия говорит: «пойдите на острова Хиттимские и посмотрите»; у Иезекииля скамьи Тира сделаны «с оправою из слоновой кости с островов Киттимских». Со временем имя стало означать вообще западных мореходов, и «корабли Киттимские» у Даниила — это римляне, которые в 168 г. до н. э. повернули Антиоха IV назад из Египта. Уже Иосиф Флавий объясняет, что Киттим — это Кипр и что евреи называли так все острова и побережья."
    - "Иосия Варнава был «левит, родом Кипрянин». Верующие, рассеявшиеся после смерти Стефана, «прошли до Финикии, и Кипра, и Антиохии». Около 47 г. н. э. Варнава и Савл «пришли в Селевкию, а оттуда отплыли в Кипр», проповедовали в синагогах Саламина и, «пройдя весь остров до Пафа», римской столицы на западном берегу, ещё в 145 км, обратили проконсула Сергия Павла, который «уверовал, дивясь учению Господню». Позже Варнава, «взяв Марка, отплыл в Кипр» уже без Павла. Корабль Павла по пути в Иерусалим был «в виду Кипра» и оставил его «слева»; по пути в Рим «мы приплыли в Кипр, по причине противных ветров». Подробнее об острове — в статье о нём."
  uk:
    - "Кіпр — острів у північно-східному куті Середземного моря, той самий острів, що й нині, приблизно за 75 км від узбережжя Малої Азії і за 100 км від Сирії. Старий Заповіт називає його Кіттім, за містом Кітіон біля сучасної Ларнаки; Новий Заповіт називає його Кіпр і розміщує там три сцени: батьківщина Варнави, перша місія Павла та кораблі пізніших подорожей Павла, що пропливали повз нього. Саламін, його головний порт на східному узбережжі, лежить приблизно за 210 км від Селевкії, порту Антіохії, і приблизно за 400 км від Єрусалиму по прямій."
    - "У пророків Кіттім — земля кораблів і далекого заходу: Валаам передбачає, що «Припливуть з Киттиму судна аж у тую землю, та й Ассурове звоюють»; Єремія каже: «пійдїте лиш на острови Хиттимські та придивітесь»; у Єзекіїлевого Тіру лави з «бучини Киттимських островів», «обклавши їх кістю слоновою». З часом ця назва стала означати будь-яких західних мореплавців, і Данилові «кораблї Киттимські» — це римляни, які завернули Антіоха IV з Єгипту 168 р. до н. е. Йосиф Флавій уже пояснює, що Кіттім — це Кіпр, а євреї називали цим іменем усі острови та узбережжя."
    - "Йосія Варнава був «левит, родом Кипрянин». Віруючі, розсіяні після смерті Стефана, «пійшли аж у Финикию, Кипр і Антиохию». Близько 47 р. н. е. Варнава й Савл прийшли в Селевкію, «а звідтіля відплили в Кипр», проповідували в синагогах Саламіна і «Пройшовши ж остров аж до Пафи», римської столиці на західному узбережжі, ще 145 км, де проконсул Сергій Павло «увірував, дивуючись наукою Господньою». Пізніше Варнава, «взявши Марка, поплив у Кипр» сам. Дорогою до Єрусалиму, «Зуздрівши Кипр і минувши його лїворуч», поплили в Сирію; а по дорозі до Рима «поплили до Кипра; бо вітри були противні». Докладніше острів розглянуто у його статті."
  es:
    - "Chipre es la isla del extremo nororiental del Mediterráneo, la misma isla de hoy, a unos 75 km de la costa de Asia Menor y 100 km de Siria. El Antiguo Testamento la llama Quitim o Cittim, por la ciudad de Kition, en la actual Larnaca; el Nuevo Testamento la llama Cipro y sitúa allí tres escenas: la patria de Bernabé, la primera misión de Pablo y los barcos de los viajes posteriores de Pablo que pasaron junto a ella. Salamina, su principal puerto de la costa oriental, queda a unos 210 km de Seleucia, el puerto de Antioquía, y a unos 400 km de Jerusalén en línea recta."
    - "En los profetas, Quitim es una tierra de barcos y del lejano oeste: Balaam prevé que «vendrán navíos de la costa de Cittim, y afligirán á Assur»; Jeremías dice «pasad á las islas de Chîttim y mirad»; la Tiro de Ezequiel tiene bancos de marfil «de las islas de Chittim». Con el tiempo el nombre pasó a significar cualquier pueblo marinero del oeste, y las «naves de Chîttim» de Daniel son los romanos que hicieron volver a Antíoco IV de Egipto en el 168 a. C. Josefo ya explica que Quitim era Chipre y que los hebreos llamaban con ese nombre a todas las islas y costas."
    - "José Bernabé era «Levita, natural de Cipro». Los creyentes dispersados tras la muerte de Esteban «anduvieron hasta Fenicia, y Cipro, y Antioquía». Hacia el 47 d. C. Bernabé y Saulo «descendieron á Seleucia; y de allí navegaron á Cipro», predicaron en las sinagogas de Salamina y recorrieron «toda la isla hasta Papho», la capital romana de la costa occidental, 145 km más allá, donde el procónsul Sergio Paulo «creyó, maravillado de la doctrina del Señor». Más tarde Bernabé, «tomando á Marcos, navegó á Cipro» por su cuenta. En el viaje de Pablo hacia Jerusalén, «avistamos á Cipro, dejándola á mano izquierda»; de camino a Roma, «navegamos bajo de Cipro, porque los vientos eran contrarios». La isla se trata con más detalle en su artículo."
  pt:
    - "Chipre é a ilha no canto nordeste do Mediterrâneo, a mesma de hoje, a cerca de 75 km da costa da Ásia Menor e 100 km da Síria. O Antigo Testamento a chama Quitim, da cidade de Kition, na atual Lárnaca; o Novo Testamento a chama Chipre e põe ali três cenas: a terra de Barnabé, a primeira missão de Paulo e os navios das viagens posteriores de Paulo passando por ela. Salamina, seu principal porto na costa leste, fica a cerca de 210 km de Selêucia, o porto de Antioquia, e a cerca de 400 km de Jerusalém em linha reta."
    - "Nos profetas Quitim é uma terra de navios e do extremo oeste: Balaão prevê que “navios virão da costa de Quitim. Eles afligirão Assur”; Jeremias diz “passem para as ilhas de Quitim, e vejam”; a Tiro de Ezequiel tem “bancos de marfim incrustado em madeira de cipreste das ilhas de Quitim”. Com o tempo o nome passou a designar quaisquer navegantes do oeste, e os “navios de Quitim” de Daniel são os romanos que fizeram Antíoco IV voltar do Egito em 168 a.C. Josefo já explica que Quitim era Chipre, e que os hebreus davam esse nome a todas as ilhas e costas."
    - "José Barnabé era “um levita, natural de Chipre”. Os crentes dispersos depois da morte de Estêvão “viajaram até a Fenícia, Chipre e Antioquia”. Por volta de 47 d.C. Barnabé e Saulo “desceram a Selêucia. De lá, navegaram para Chipre”, pregaram nas sinagogas de Salamina e “atravessaram a ilha até Pafos”, a capital romana na costa oeste, 145 km adiante, onde o procônsul Sérgio Paulo, “quando viu o que havia acontecido, creu, maravilhado com o ensino do Senhor”. Mais tarde Barnabé “levou Marcos consigo e navegou para Chipre” por conta própria. Na viagem de Paulo a Jerusalém, “avistamos Chipre, deixando-a à esquerda”; a caminho de Roma “navegamos sob o abrigo de Chipre, porque os ventos eram contrários”. A ilha é tratada mais por inteiro em seu artigo."
  de:
    - "Zypern ist die Insel im nordöstlichen Winkel des Mittelmeers, dieselbe wie heute, etwa 75 km vor der Küste Kleinasiens und 100 km vor Syrien. Das Alte Testament nennt sie Kittim oder Chittim, nach der Stadt Kition beim heutigen Larnaka; das Neue Testament nennt sie Zypern und setzt dort drei Szenen: die Heimat des Barnabas, Pauli erste Mission und die Schiffe von Pauli späteren Reisen, die an ihr vorbeisegeln. Salamis, ihr Haupthafen an der Ostküste, ist etwa 210 km von Seleukia, dem Hafen von Antiochia, und in der Luftlinie etwa 400 km von Jerusalem entfernt."
    - "Bei den Propheten ist Kittim ein Land der Schiffe und des fernen Westens: Bileam sieht voraus: „Und Schiffe aus Chittim werden verderben den Assur und Eber“; Jeremia sagt: „Gehet hin in die Inseln Chittim und schauet“; Tyrus bei Hesekiel hat Bänke von Elfenbein „gefaßt in Buchsbaumholz aus den Inseln der Chittiter“. Mit der Zeit bedeutete der Name beliebige westliche Seefahrer, und Daniels „Schiffe aus Chittim“ sind die Römer, die Antiochos IV. 168 v. Chr. aus Ägypten zurückwiesen. Josephus erklärt bereits, Kittim sei Zypern, und die Hebräer nannten alle Inseln und Küsten so."
    - "Joseph Barnabas war „von Geschlecht ein Levit aus Zypern“. Die nach Stephanus' Tod zerstreuten Gläubigen „gingen umher bis gen Phönizien und Zypern und Antiochien“. Um 47 n. Chr. kamen Barnabas und Saulus „gen Seleucia, und von da schifften sie gen Zypern“, verkündigten in den Synagogen von Salamis und „da sie die Insel durchzogen bis zu der Stadt Paphos“, der römischen Hauptstadt an der Westküste, 145 km weiter, wo es vom Prokonsul Sergius Paulus heißt: „glaubte er und verwunderte sich der Lehre des HERRN“. Später „schiffte“ Barnabas mit Markus „nach Zypern“. Auf Pauli Schiff nach Jerusalem hieß es: „Als wir aber Zypern ansichtig wurden, ließen wir es zur linken Hand“; auf der Fahrt nach Rom „stießen wir ab und schifften unter Zypern hin, darum daß uns die Winde entgegen waren“. Die Insel wird in ihrem Artikel ausführlicher behandelt."
  fr:
    - "Chypre est l’île du coin nord-est de la Méditerranée, la même qu’aujourd’hui, à environ 75 km des côtes d’Asie Mineure et à 100 km de la Syrie. L’Ancien Testament l’appelle Kittim ou Chittim, d’après la ville de Kition, sur l’actuelle Larnaca ; le Nouveau Testament l’appelle Chypre et y situe trois scènes : la patrie de Barnabas, la première mission de Paul, et les navires des voyages ultérieurs de Paul passant devant elle. Salamine, son principal port de la côte est, est à environ 210 km de Séleucie, le port d’Antioche, et à environ 400 km de Jérusalem en ligne droite."
    - "Chez les prophètes, Kittim est un pays de navires et de l’extrême ouest : Balaam prévoit que « des navires viendront de Kittim, ils humilieront l’Assyrien » ; Jérémie dit « Passez aux îles de Kittim, et regardez ! » ; le Tyr d’Ézéchiel a des bancs d’ivoire « apporté des îles de Kittim ». Avec le temps, le nom en vint à désigner tous les navigateurs de l’ouest, et les « navires de Kittim » de Daniel sont les Romains qui firent reculer Antiochus IV d’Égypte en 168 av. J.-C. Josèphe explique déjà que Kittim était Chypre, et que les Hébreux appelaient ainsi toutes les îles et côtes."
    - "Joseph Barnabas était « Lévite, originaire de Chypre ». Les croyants dispersés après la mort d’Étienne « allèrent jusqu’en Phénicie, dans l’île de Chypre, et à Antioche ». Vers 47 apr. J.-C., Barnabas et Saul « descendirent à Séleucie, et de là ils s’embarquèrent pour l’île de Chypre », prêchèrent dans les synagogues de Salamine et gagnèrent, en traversant « toute l’île jusqu’à Paphos », la capitale romaine de la côte ouest, 145 km plus loin, où le proconsul Sergius Paulus « crut, étant frappé de la doctrine du Seigneur ». Plus tard Barnabas, « prenant Marc avec lui, s’embarqua pour l’île de Chypre » de son côté. Le navire de Paul vers Jérusalem fut « en vue de l’île de Chypre » et la laissa « à gauche » ; en route pour Rome, « nous longeâmes l’île de Chypre, parce que les vents étaient contraires ». L’île est traitée plus complètement dans son article."
  pl:
    - "Cypr to wyspa w północno-wschodnim kącie Morza Śródziemnego, ta sama wyspa co dziś, około 75 km od wybrzeża Azji Mniejszej i 100 km od Syrii. Stary Testament nazywa go Kittim lub Chittim, od miasta Kition w dzisiejszej Larnace; Nowy Testament nazywa go Cyprem i umieszcza tam trzy sceny: ojczyznę Barnaby, pierwszą misję Pawła i okręty późniejszych podróży Pawła, które go mijają. Salamina, jego główny port na wschodnim wybrzeżu, jest około 210 km od Seleucji, portu Antiochii, i około 400 km od Jerozolimy w linii prostej."
    - "U proroków Kittim to kraina okrętów i dalekiego zachodu: Balaam przewiduje, że „okręty przypłyną od brzegów Chyttymskich, i utrapią Assyryjany”; Jeremiasz mówi: „Przejdźcie przynajmniej wyspy Cytym, a obaczcie”; Tyr u Ezechiela ma ławy z kości słoniowej „z wysep Cytymskich”. Z czasem nazwa zaczęła oznaczać wszelkich zachodnich żeglarzy, a „okręty z Cytym” u Daniela to Rzymianie, którzy zawrócili Antiocha IV z Egiptu w 168 p.n.e. Józef Flawiusz już objaśnia, że Kittim to Cypr i że Hebrajczycy tą nazwą nazywali wszystkie wyspy i wybrzeża."
    - "Józef Barnaba był „Lewita, z Cypru rodem”. Wierzący rozproszeni po śmierci Szczepana „przeszli aż do Fenicyi i Cypru, i do Antyjochii”. Około 47 n.e. Barnaba i Szaweł „przyszli do Seleucyi, a stamtąd płynęli do Cypru”, głosili w synagogach Salaminy i „przeszedłszy onę wyspę aż do Pafu”, rzymskiej stolicy na zachodnim wybrzeżu, 145 km dalej, gdzie prokonsul Sergiusz Paweł „uwierzył, zdumiewając się nad nauką Pańską”. Później „Barnabasz wziąwszy z sobą Marka, płynął do Cypru” na własną rękę. Okręt Pawła do Jerozolimy: „A gdy się nam ukazał Cypr, tedy zostawiwszy go po lewej stronie”; w drodze do Rzymu: „przypłynęliśmy pod Cypr, dlatego że były wiatry przeciwne”. Wyspa jest omówiona szerzej w swoim artykule."
  it:
    - "Cipro è l’isola nell’angolo nord-orientale del Mediterraneo, la stessa isola di oggi, a circa 75 km dalla costa dell’Asia Minore e 100 km dalla Siria. L’Antico Testamento la chiama Kittim o Chittim, dalla città di Kition presso l’odierna Larnaca; il Nuovo Testamento la chiama Cipro e vi ambienta tre scene: la patria di Barnaba, la prima missione di Paolo e le navi dei viaggi successivi di Paolo che le passano accanto. Salamina, il suo porto principale sulla costa orientale, dista circa 210 km da Seleucia, il porto di Antiochia, e circa 400 km da Gerusalemme in linea retta."
    - "Nei profeti Kittim è una terra di navi e dell’estremo ovest: Balaam prevede che «delle navi verranno dalle parti di Kittim e umilieranno Assur»; Geremia dice «Passate dunque nelle isole di Kittim, e guardate!»; la Tiro di Ezechiele ha ponti d’avorio «portato dalle isole di Kittim». Col tempo il nome venne a significare qualunque navigante occidentale, e le «navi di Kittim» di Daniele sono i Romani che respinsero Antioco IV dall’Egitto nel 168 a.C. Giuseppe Flavio spiega già che Kittim era Cipro, e che gli Ebrei chiamavano con quel nome tutte le isole e le coste."
    - "Giuseppe Barnaba era «levita, cipriota di nascita». I credenti dispersi dopo la morte di Stefano «passarono fino in Fenicia, in Cipro e in Antiochia». Verso il 47 d.C. Barnaba e Saulo «scesero a Seleucia, e di là navigarono verso Cipro», predicarono nelle sinagoghe di Salamina e, «traversata tutta l’isola fino a Pafo», la capitale romana sulla costa occidentale, a 145 km, il proconsole Sergio Paolo «credette, essendo stupito della dottrina del Signore». Più tardi Barnaba, «preso seco Marco, navigò verso Cipro» per conto suo. Sulla via di Gerusalemme, «giunti in vista di Cipro, e lasciatala a sinistra», Paolo e i suoi navigarono oltre; verso Roma «navigammo sotto Cipro, perché i venti eran contrari». L’isola è trattata più ampiamente nel suo articolo."
  nl:
    - "Cyprus is het eiland in de noordoosthoek van de Middellandse Zee, hetzelfde eiland als nu, ongeveer 75 km voor de kust van Klein-Azië en 100 km voor die van Syrië. Het Oude Testament noemt het Kittim of Chittim, naar de stad Kition bij het huidige Larnaka; het Nieuwe Testament noemt het Cyprus en plaatst er drie taferelen: het vaderland van Barnabas, de eerste zending van Paulus, en de schepen van Paulus’ latere reizen die er voorbijvaren. Salamis, de voornaamste haven aan de oostkust, ligt ongeveer 210 km van Seleucië, de haven van Antiochië, en hemelsbreed ongeveer 400 km van Jeruzalem."
    - "Bij de profeten is Kittim een land van schepen en het verre westen: Bileam ziet vooruit dat “de schepen van den oever der Chitteers, die zullen Assur plagen”; Jeremia zegt “gaat over in de eilanden der Chitteers, en ziet toe”; Ezechiëls Tyrus heeft banken van ivoor “uit de eilanden der Chittieten”. In de loop van de tijd ging de naam elke westerse zeevarende aanduiden, en Daniëls “schepen van Chittim” zijn de Romeinen die Antiochus IV in 168 v.Chr. uit Egypte terugdreven. Josephus legt al uit dat Kittim Cyprus was en dat de Hebreeën alle eilanden en kusten met die naam noemden."
    - "Jozef Barnabas was “een Leviet, van geboorte uit Cyprus”. Gelovigen die na de dood van Stefanus verstrooid waren, “gingen het land door tot Fenicie toe, en Cyprus, en Antiochië”. Omstreeks 47 n.Chr. kwamen Barnabas en Saulus “af tot Seleucië, en van daar scheepten zij af naar Cyprus”, predikten in de synagogen van Salamis en toen “zij het eiland doorgegaan waren tot Pafos toe”, de Romeinse hoofdstad aan de westkust, 145 km verder, geloofde daar de stadhouder Sergius Paulus, “verslagen zijnde over de leer des Heeren”. Later gebeurde het “dat Barnabas Markus medenam, en naar Cyprus afscheepte”, op eigen houtje. Paulus’ schip naar Jeruzalem had “Cyprus in het gezicht gekregen, en dat aan de linker hand gelaten”; op weg naar Rome “voeren wij onder Cyprus heen, omdat de winden ons tegen waren”. Het eiland wordt uitvoeriger behandeld in zijn artikel."
  cs:
    - "Kypr je ostrov v severovýchodním rohu Středozemního moře, tentýž jako dnes, asi 75 km od pobřeží Malé Asie a 100 km od Sýrie. Starý zákon jej nazývá Kitim či Chitim podle města Kition v dnešní Larnace; Nový zákon jej nazývá Kypr a klade tam tři scény: domovinu Barnabáše, Pavlovu první misii a lodě Pavlových pozdějších plaveb, které kolem něj plují. Salamis, jeho hlavní přístav na východním pobřeží, je asi 210 km od Seleukeie, přístavu Antiochie, a asi 400 km od Jeruzaléma vzdušnou čarou."
    - "U proroků je Kitim země lodí a dalekého západu: Bileám předvídá, že „bárky z země Citim připlynou a ssouží Assyrské“; Jeremjáš říká: „Projděte ale ostrovy Citim, a pohleďte“; Týr Ezechielův má lavičky z kostí slonových „z ostrovů Citejských“. Časem jméno znamenalo všechny západní námořníky a Danielovy „lodí Citejské“ jsou Římané, kteří roku 168 př. n. l. zastavili Antiocha IV. v Egyptě. Josephus Flavius už vysvětluje, že Kitim byl Kypr a že Hebrejci tímto jménem nazývali všechny ostrovy a pobřeží."
    - "Josef Barnabáš byl „z pokolení Levítského, z Cypru rodem“. Věřící rozptýlení po Štěpánově smrti „přišli až do Fenicen a Cypru a do Antiochie“. Asi roku 47 n. l. Barnabáš a Saul „přišli do Seleucie, a odtud plavili se do Cypru“, kázali v židovských školách Salaminy a prošli ostrov „až do Páfu“, římské hlavní město na západním pobřeží, dalších 145 km, kde prokonzul Sergius Paulus „uvěřil, divě se učení Páně“. Později Barnabáš „pojav s sebou Marka, plavil se do Cypru“ sám. Pavlova loď do Jeruzaléma, když se „počal ukazovati Cyprus“, nechala jej „na levé straně“; na cestě do Říma „plavili jsme se podle Cypru, protože byl vítr odporný nám“. Ostrov je podrobněji probrán ve svém článku."
  sv:
    - "Cypern är ön i nordöstra hörnet av Medelhavet, samma ö som i dag, omkring 75 km från Mindre Asiens kust och 100 km från Syrien. Gamla testamentet kallar den Kittim, efter staden Kition vid dagens Larnaka; Nya testamentet kallar den Cypern och förlägger tre scener dit: Barnabas hemland, Paulus första mission och fartygen på Paulus senare resor som seglade förbi. Salamis, dess främsta hamn på östkusten, ligger omkring 210 km från Seleukia, Antiochias hamn, och omkring 400 km från Jerusalem fågelvägen."
    - "Hos profeterna är Kittim ett skeppens land och det yttersta västern: Bileam förutser att ”skepp skola komma från kittéernas kust, de skola tukta Assur”; Jeremia säger: ”Dragen bort till kittéernas öländer och sen efter”; Hesekiels Tyros har bänkar av elfenben ”från kittéernas öländer”. Med tiden kom namnet att beteckna alla västliga sjöfarare, och Daniels ”skepp från Kittim” är romarna som vände om Antiochos IV från Egypten 168 f.Kr. Josefus förklarar redan att Kittim var Cypern, och att hebréerna kallade alla öar och kuster med det namnet."
    - "Josef Barnabas var ”en levit som var bördig från Cypern”. De troende som skingrades efter Stefanos död drog omkring ”ända till Fenicien och Cypern och Antiokia”. Omkring 47 e.Kr. for Barnabas och Saulus nu ned ”till Seleucia och seglade därifrån till Cypern”, förkunnade i synagogorna i Salamis och färdades ”över hela ön ända till Pafos”, den romerska huvudstaden på västkusten, 145 km längre, där prokonsuln Sergius Paulus häpnade ”över Herrens lära och kom till tro”. Senare tog Barnabas ”med sig Markus och avseglade till Cypern” på egen hand. Paulus skepp till Jerusalem fick ”Cypern i sikte” och lämnade det ”på vänster hand”; på vägen till Rom ”seglade vi under Cypern, eftersom vinden låg emot”. Ön behandlas fylligare i sin artikel."
  nb:
    - "Kypros er øya i nordøstre hjørne av Middelhavet, den samme øya som i dag, omtrent 75 km fra kysten av Lilleasia og 100 km fra Syria. Det gamle testamente kaller den Kittim, etter byen Kition ved dagens Larnaka; Det nye testamente kaller den Kypros og legger tre scener dit: Barnabas' hjemland, Paulus' første misjon, og skipene på Paulus' senere reiser som seilte forbi. Salamis, dens viktigste havn på østkysten, ligger omtrent 210 km fra Seleukia, Antiokias havn, og omtrent 400 km fra Jerusalem i luftlinje."
    - "Hos profetene er Kittim et land av skip og det ytterste vesten: Bileam ser for seg at «Skiber kommer fra Kittims kyst, de kuer Assur»; Jeremia sier «Dra over til kitteernes øer og se»; Esekiels Tyros har rorbenker av «elfenben innlagt i buksbom fra Kittims øer». Med tiden kom navnet til å bety alle sjøfarere fra vest, og Daniels «skib fra Kittim» er romerne som sendte Antiokhos IV tilbake fra Egypt i 168 f.Kr. Josefus forklarer allerede at Kittim var Kypros, og at hebreerne kalte alle øyer og kyster med det navnet."
    - "Josef Barnabas var «en levitt, født på Kypern». De troende som ble spredt etter Stefanus' død, «drog omkring like til Fønikia og Kypern og Antiokia». Omkring 47 e.Kr. «drog de ned til Seleukia og seilte derfra til Kypern», Barnabas og Saul, forkynte i synagogene i Salamis og vandret gjennom «hele øen like til Pafus», den romerske hovedstaden på vestkysten, 145 km lenger, der landshøvdingen Sergius Paulus «kom … til troen» og «undret sig storlig over Herrens lære». Senere tok Barnabas «Markus med sig og seilte avsted til Kypern» på egen hånd. Paulus' skip til Jerusalem «hadde fått Kypern i sikte og latt den efter oss på venstre hånd»; på veien til Roma «seilte inn under Kypern, fordi vinden var imot». Øya behandles fyldigere i sin egen artikkel."
  tl:
    - "Ang Chipre ay ang pulo sa hilagang-silangang sulok ng Mediteraneo, ang parehong pulo ngayon, mga 75 km mula sa baybayin ng Asia Menor at 100 km mula sa Siria. Tinatawag ito ng Matandang Tipan na Cittim o Chittim, ayon sa lungsod ng Kition sa makabagong Larnaca; tinatawag ito ng Bagong Tipan na Chipre at naglalagay ng tatlong tagpo roon: ang tinubuang lupa ni Bernabe, ang unang misyon ni Pablo, at ang mga barko ng huling paglalakbay ni Pablo na lumalampas dito. Ang Salamina, ang pangunahing daungan nito sa silangang baybayin, ay mga 210 km mula sa Seleucia, ang daungan ng Antioquia, at mga 400 km mula sa Jerusalem sa tuwid na guhit."
    - "Sa mga propeta, ang Cittim ay lupain ng mga barko at ng malayong kanluran: hinuhulaan ni Balaam na “ang mga sasakyan ay manggagaling sa baybayin ng Cittim. At kanilang pagdadalamhatiin ang Assur”; sabi ni Jeremias, “mangagdaan kayo sa mga pulo ng Chittim, at tingnan”; ang Tiro ni Ezekiel ay may mga bangkong garing “mula sa mga pulo ng Chittim”. Sa paglipas ng panahon, ang pangalan ay naging tawag sa sinumang mandaragat sa kanluran, at ang “mga sasakyan sa Chittim” ni Daniel ay ang mga Romanong nagpabalik kay Antioco IV mula sa Egipto noong 168 BK. Ipinaliliwanag na ni Josephus na ang Kittim ay Chipre, at tinawag ng mga Hebreo na gayon ang lahat ng pulo at baybayin."
    - "Si Jose Bernabe ay “isang Levita, tubo sa Chipre”. Ang mga mananampalatayang nagkalat pagkamatay ni Esteban ay “nangaglakbay hanggang sa Fenicia, at sa Chipre, at sa Antioquia”. Mga 47 AD, sina Bernabe at Saul ay “nagsilusong sa Seleucia; at buhat doo'y nangaglayag hanggang sa Chipre”, nangaral sa mga sinagoga ng Salamina at “matahak na ang buong pulo hanggang sa Pafos”, ang kabisera ng Romano sa kanlurang baybayin, 145 km pa, kung saan ang prokonsul na si Sergio Paulo ay “nanampalataya, na nanggigilalas sa aral ng Panginoon”. Kalaunan “isinama ni Bernabe si Marcos, at lumayag sa Chipre” nang mag-isa. Sa paglalayag ni Pablo patungong Jerusalem: “matanaw namin ang Chipre, na maiiwan namin sa dakong kaliwa”; patungong Roma: “nagsilayag kami na nagsipanganlong sa Chipre, sapagka't pasalunga ang hangin”. Mas buong tinatalakay ang pulo sa artikulo nito."
  da:
    - "Cypern er øen i det nordøstlige hjørne af Middelhavet, samme ø som i dag, omkring 75 km fra Lilleasiens kyst og 100 km fra Syrien. Det Gamle Testamente kalder den Kittim eller Kitim, efter byen Kition ved nutidens Larnaca; Det Nye Testamente kalder den Cypern og placerer tre scener dér: Barnabas' hjemland, Paulus' første mission og skibene på Paulus' senere rejser, der sejlede forbi den. Salamis, dens hovedhavn på østkysten, ligger omkring 210 km fra Seleukia, Antiokias havn, og omkring 400 km fra Jerusalem i luftlinje."
    - "I profeterne er Kittim et land af skibe og det fjerne vest: Bileam forudser, at »Skibe fra Kithims Egn skulle komme, og de skulle undertrykke Assur«; Jeremias siger: »drager over til Kithims Øer, og ser til«; Ezekiels Tyrus har bænke af elfenben »fra Kithims Øer«. Med tiden kom navnet til at betyde alle vestlige sejlere, og Daniels »Skibe fra Kithim« er romerne, der afviste Antiochus IV fra Egypten i 168 f.Kr. Josefus forklarer allerede, at Kittim var Cypern, og at hebræerne kaldte alle øer og kyster ved det navn."
    - "Josef Barnabas var »en Levit, født paa Kypern«. De troende, der var adspredt efter Stefanus' død, »vandrede om lige til Fønikien og Kypern og Antiokia«. Omkring 47 e.Kr. »droge de ned til Seleukia og sejlede derfra til Kypern«, Barnabas og Saul, prædikede i Salamis' synagoger og var »dragne igennem hele Øen indtil Pafus«, den romerske hovedstad på vestkysten, 145 km længere, hvor prokonsul Sergius Paulus, »slagen af Forundring over Herrens Lære«, troede. Senere skiltes de, og »Barnabas tog Markus med sig og sejlede til Kypern« på egen hånd. Paulus' skib til Jerusalem fik »Kypern i Sigte« og lod den »til venstre for os«; på vej til Rom »sejlede ind under Kypern, fordi Vinden var imod«. Øen behandles mere udførligt i sin artikel."
  sr:
    - "Кипар је острво у североисточном углу Средоземног мора, исто острво као данас, око 75 км од обале Мале Азије и 100 км од Сирије. Стари завет га зове Китим, по граду Китиону код савремене Ларнаке; Нови завет га зове Кипар и ту смешта три сцене: Варнавину домовину, Павлову прву мисију и бродове Павлових каснијих путовања који плове поред њега. Саламина, његова главна лука на источној обали, удаљена је око 210 км од Селеукије, луке Антиохије, и око 400 км од Јерусалима правом линијом."
    - "Код пророка Китим је земља бродова и далеког запада: Валам предвиђа: „лађе из земље Китимске допловиће и досадиће Асирцима“; Јеремија каже „прођите острва китимска и видите“; Језекиљ о Тиру: „седишта ти градише од слонове кости и од шимшира с острва китејских“. Временом је име почело да значи било које западне поморце, а Данилове „лађе китејске“ су Римљани који су 168. п. н. е. вратили Антиоха IV из Египта. Јосиф Флавије већ објашњава да је Китим био Кипар и да су Јевреји тим именом звали сва острва и обале."
    - "Јосиф Варнава био је „Левит родом из Кипра“. Верници расејани после Стефанове смрти „прођоше тја до Финикије и Кипра и Антиохије“. Око 47. н. е. Варнава и Саул „сиђоше у Селеукију, и оданде отпловише у Кипар“, проповедали у синагогама Саламине и „прођоше острво тја до Пафа“, римске престонице на западној обали, 145 км даље, где је проконзул Сергије Павле „верова, дивећи се науци Господњој“. Касније је Варнава, како стоји, „узевши Марка отплови у Кипар“ на своју руку. Павлова лађа за Јерусалим: „А кад нам се указа Кипар, остависмо га налево“; на путу за Рим: „допловисмо у Кипар, јер ветрови беху противни“. Острво је опширније обрађено у свом чланку."
  hu:
    - "Ciprus a Földközi-tenger északkeleti sarkában fekvő sziget, ugyanaz, mint ma, a kis-ázsiai parttól mintegy 75 km-re és Szíriától 100 km-re. Az Ószövetség Kittimnek nevezi, a mai Larnaka mellett fekvő Kitión városról; az Újszövetség Ciprusnak hívja, és három jelenetet helyez oda: Barnabás hazáját, Pál első küldetését, és Pál későbbi útjainak hajóit, amelyek elhaladtak mellette. Szalamisz, keleti partjának fő kikötője, Antiókhia kikötőjétől, Szeleukiától mintegy 210 km-re, Jeruzsálemtől egyenes vonalban mintegy 400 km-re van."
    - "A prófétáknál Kittim a hajók és a távoli nyugat földje: Bálám előre látja, hogy „Kittim partjairól hajók jőnek, és nyomorgatják Assúrt”; Jeremiás mondja: „Menjetek csak át a Kittim szigeteire, és lássátok meg”; Ezékiel Tíruszának evezőpadjait „a cziprusiak szigeteiről való sudar czédrusba foglalt elefántcsontból” csinálták. Idővel a név bármely nyugati tengerészt jelentett, és Dániel „kitteus hajói” a rómaiak, akik Kr. e. 168-ban visszafordították IV. Antiokhoszt Egyiptomból. Josephus már megmagyarázza, hogy Kittim Ciprus, és hogy a héberek minden szigetet és partot így neveztek."
    - "József Barnabás „Lévita, származása szerint ciprusi” volt. István halála után szétszóródott hívők „eljutának Fenicziáig, Cziprusig és Antiókhiáig”. Kr. u. 47 körül Barnabás és Saul „lemenének Szeleucziába; és onnét elevezének Cziprusba”, prédikáltak Szalamisz zsinagógáiban, és „eljárván a szigetet mind Páfusig” mentek, a nyugati parti római fővárosig, további 145 km, ahol Szergiusz Paulusz prokonzul „hűn, elálmélkodván az Úrnak tudományán”. Később Barnabás „maga mellé véve Márkot, elhajózék Cziprusba” saját útra. Pál jeruzsálemi útján, „miután megláttuk Cziprust és elhagytuk azt balkézre”, tovább hajóztak; Róma felé „Ciprus alatt evezénk el, mivelhogy a szelek ellenkezők valának”. A szigetet a róla szóló cikk tárgyalja részletesebben."
  fi:
    - "Kypros on Välimeren koillisnurkan saari, sama saari kuin nykyään, noin 75 km Vähän-Aasian rannikon edustalla ja 100 km Syyrian edustalla. Vanha testamentti kutsuu sitä nimellä Kittim tai Chittim, nykyisen Larnakan kohdalla olleen Kitionin kaupungin mukaan; Uusi testamentti kutsuu sitä Kyprokseksi ja sijoittaa sinne kolme kohtausta: Barnabaan kotimaa, Paavalin ensimmäinen lähetysmatka ja Paavalin myöhempien matkojen laivojen purjehtiminen sen ohi. Salamis, sen tärkein satama itärannikolla, on noin 210 km Seleukiasta, Antiokian satamasta, ja noin 400 km Jerusalemista linnuntietä."
    - "Profeetoilla Kittim on laivojen ja kaukaisen lännen maa: Bileam ennustaa, että ”laivoja saapuu kittiläisten suunnalta, ja ne kurittavat Assurin”; Jeremia sanoo: ”Menkää kittiläisten saarille katsomaan”; Hesekielin Tyroksella on norsunluusta tehdyt penkit ja ”Kittiläis-saarten hopeakuusesta”. Ajan mittaan nimi alkoi tarkoittaa mitä tahansa läntisiä merenkulkijoita, ja Danielin ”kittiläisten laivat” ovat roomalaisia, jotka käänsivät Antiokhos IV:n takaisin Egyptistä vuonna 168 eaa. Josephus selittää jo, että Kittim oli Kypros ja että heprealaiset kutsuivat kaikkia saaria ja rannikoita sillä nimellä."
    - "Joosef Barnabas oli ”leeviläinen, syntyisin Kyprosta”. Stefanoksen kuoleman jälkeen hajaantuneet uskovat ”vaelsivat ympäri hamaan Foinikiaan ja Kyproon ja Antiokiaan saakka”. Noin 47 jaa. Barnabas ja Saul ”menivät Seleukiaan ja purjehtivat sieltä Kyproon”, saarnasivat Salamiin synagoogissa ja kulkivat ”kautta koko saaren Pafoon asti”, Rooman pääkaupunkiin länsirannikolla, 145 km kauemmas, missä prokonsuli Sergius Paulus ”uskoi, ihmetellen Herran oppia”. Myöhemmin ”Barnabas otti mukaansa Markuksen ja purjehti Kyproon” omin päin. Paavalin Jerusalemiin matkaava laiva näki Kyproksen, joka ”oli jäänyt meistä vasemmalle”; Roomaan matkalla ”purjehdimme Kypron suojaan, koska tuulet olivat vastaiset”. Saarta käsitellään tarkemmin sitä koskevassa artikkelissa."
  vi:
    - "Chíp-rơ là hòn đảo ở góc đông bắc Địa Trung Hải, cùng một đảo như ngày nay, cách bờ Tiểu Á khoảng 75 km và bờ Sy-ri 100 km. Cựu Ước gọi nó là Kít-tim, theo thành Kition ở Larnaca hiện đại; Tân Ước gọi là Chíp-rơ và đặt ba cảnh ở đó: quê của Ba-na-ba, chuyến truyền giáo đầu của Phao-lô, và các tàu của những chuyến đi sau của Phao-lô đi qua. Sa-la-min, cảng chính ở bờ đông, cách Sê-lơ-xi, cảng của An-ti-ốt, khoảng 210 km và cách Giê-ru-sa-lem khoảng 400 km theo đường thẳng."
    - "Trong các tiên tri, Kít-tim là xứ của tàu bè và của viễn tây: Ba-la-am thấy trước “những tàu từ gành Kít-tim đến, hà khắc A-su”; Giê-rê-mi nói “Hãy qua các cù lao Kít-tim mà xem!”; Ty-rơ của Ê-xê-chi-ên có băng ghế ngà voi “lấy cây hoàng dương của đảo Kít-tim làm ván lợp, và cẩn bằng ngà voi”. Theo thời gian, tên này chỉ mọi người đi biển phương tây, và “những tàu ở Kít-tim” của Đa-ni-ên là người La Mã đã đẩy Antiochus IV khỏi Ê-díp-tô năm 168 TCN. Giô-sê-phu đã giải thích rằng Kít-tim là Chíp-rơ, và người Hê-bơ-rơ gọi mọi đảo và bờ biển bằng tên ấy."
    - "Giô-sép Ba-na-ba “về họ Lê-vi, quê hương tại Chíp-rơ”. Các tín hữu bị tản lạc sau cái chết của Ê-tiên “đi đến xứ Phê-ni-xi, đảo Chíp-rơ và thành An-ti-ốt”. Khoảng năm 47, Ba-na-ba và Sau-lơ “bèn xuống thành Sê-lơ-xi, rồi từ đó đi thuyền đến đảo Chíp-rơ”, giảng trong các nhà hội Sa-la-min và “Trải qua cả đảo cho đến thành Ba-phô”, thủ phủ La Mã ở bờ tây, xa hơn 145 km, nơi quan trấn thủ Sê-giúp Phau-lút “bèn tin, lấy làm lạ về đạo Chúa”. Về sau “Ba-na-ba đem Mác cùng xuống thuyền vượt qua đảo Chíp-rơ”, tách khỏi Phao-lô. Con tàu chở Phao-lô trên đường về Giê-ru-sa-lem thấy đảo Chíp-rơ và để nó ở bên tay trái; trên đường đến Rô-ma “chúng ta theo mé bờ đảo Chíp-rơ, vì bấy giờ ngược gió”. Hòn đảo được bàn đầy đủ hơn trong bài viết của nó."
  ro:
    - "Ciprul este insula din colțul de nord-est al Mediteranei, aceeași insulă ca azi, la circa 75 km de coasta Asiei Mici și 100 km de Siria. Vechiul Testament îl numește Chitim, după orașul Kition, la Larnaka de azi; Noul Testament îl numește Cipru și așază acolo trei scene: patria lui Barnaba, prima misiune a lui Pavel și corăbiile din călătoriile ulterioare ale lui Pavel care trec pe lângă el. Salamina, portul lui principal de pe coasta de est, este la circa 210 km de Seleucia, portul Antiohiei, și la circa 400 km de Ierusalim în linie dreaptă."
    - "La proroci, Chitim este o țară a corăbiilor și a îndepărtatului vest: Balaam prevede că vor veni corăbii de pe coasta Chitimului și îl vor asupri pe Așur; Ieremia spune „Treceți în ostroavele Hetimului și vedeți”; Tirul lui Ezechiel are bănci de fildeș aduse „din ostroavele Hetimilor”. Cu timpul, numele a ajuns să însemne orice navigatori occidentali, iar corăbiile Chitimului din Daniel sunt romanii care l-au întors pe Antioh al IV-lea din Egipt în 168 î.Hr. Iosif Flaviu explică deja că Chitim era Ciprul și că evreii numeau astfel toate insulele și coastele."
    - "Iosif Barnaba era levit, de neam cipriot. Credincioșii risipiți după moartea lui Ștefan „au trecut până la Finichia, și la Chipru și la Antiohia”. Circa 47 d.Hr., Barnaba și Saul „s’au pogorît în Selevchia, și de acolo au mers cu corabiea la Chipru”, au propovăduit în sinagogile Salaminei și, „străbătând ostrovul până la Paf”, au ajuns la capitala romană de pe coasta de vest, la 145 km mai departe, unde proconsulul Sergiu Paul „a crezut, mirându-se de învățătura Domnului”. Mai târziu, Barnaba, „luând pre Marcu, a mers cu corabiea în Chipru”, pe cont propriu. Corabia lui Pavel spre Ierusalim a zărit Ciprul și l-a lăsat „în stânga”; în drum spre Roma, „am venit supt Chipru, pentrucă vânturile erau împrotivă”. Insula este tratată mai pe larg în articolul ei."
  bg:
    - "Кипър е островът в североизточния ъгъл на Средиземно море, същият остров като днес, на около 75 км от брега на Мала Азия и на 100 км от Сирия. Старият завет го нарича Китим, по град Китион при днешна Ларнака; Новият завет го нарича Кипър и поставя там три сцени: родината на Варнава, първата мисия на Павел и корабите от по-късните пътувания на Павел, които минават покрай него. Саламин, главното му пристанище на източния бряг, е на около 210 км от Селевкия, пристанището на Антиохия, и на около 400 км от Йерусалим по права линия."
    - "При пророците Китим е земя на кораби и на далечния запад: Валаам предвижда, че „кораби ще дойдат от приморията на Китим, И ще смирят Асура“; Йеремия казва: „минете в Китимските острови та вижте“; Тир при Йезекиил има седалища от слонова кост „от Китийските острови“. С времето името започнало да означава всякакви западни мореплаватели и „корабите на Китийците“ при Даниил са римляните, които върнали Антиох IV от Египет през 168 г. пр.н.е. Йосиф Флавий вече обяснява, че Китим е Кипър и че евреите наричали с това име всички острови и брегове."
    - "Йосиф Варнава бил „Левит, родом Киприянин“. Вярващите, разпръснати след смъртта на Стефан, „преминаха до Финикия и Кипър и Антиохия“. Около 47 г. н.е. Варнава и Савел „слезоха в Селевкия, и от там отплуваха в Кипър“, проповядвали в синагогите на Саламин и „преминаха всичкия остров до Пафа“ — римската столица на западния бряг, на още 145 км, — където проконсулът Сергий Павел „смая се на учението Господне и поверва“. По-късно Варнава „взе Марка та отплува в Кипър“ сам. На кораба на Павел за Йерусалим „съзрехме от далеч Кипър и го оставихме отлево“; на път за Рим „провезохме се под Кипър, защото ветровете беха противни“. Островът е разгледан по-подробно в статията си."
