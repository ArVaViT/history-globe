id: where-was-the-sermon-on-the-mount
question:
  en: "Where was the Sermon on the Mount?"
  ru: "Где была Нагорная проповедь?"
  uk: "Де була Нагірна проповідь?"
  es: "¿Dónde fue el Sermón del Monte?"
  pt: "Onde foi o Sermão do Monte?"
  de: "Wo wurde die Bergpredigt gehalten?"
  fr: "Où eut lieu le Sermon sur la montagne ?"
  pl: "Gdzie wygłoszono Kazanie na Górze?"
  it: "Dove fu pronunciato il Discorso della Montagna?"
  cs: "Kde zaznělo Kázání na hoře?"
  nl: "Waar werd de Bergrede gehouden?"
answer:
  en:
    - "Matthew does not name the mountain: “seeing the multitudes, he went up into a mountain”, and when he came down he “entered into Capernaum”. The traditional site is the Mount of Beatitudes, the hill above Tabgha on the north-west shore of the Sea of Galilee, a little west of Capernaum, where the Church of the Beatitudes was built in 1938; the map point stands at Capernaum, about 33 km north-east of Nazareth and 127 km north of Jerusalem in a straight line. No one can say which hill it was: any of the slopes above the lake fits the Gospel's words, and the tradition is a pilgrims' choice, not a memory."
    - "Luke tells the same sermon on level ground: Jesus “went out into a mountain to pray”, chose the twelve in the morning and “came down with them, and stood in the plain”, before a crowd “out of all Judaea and Jerusalem, and from the sea coast of Tyre and Sidon”. Readers have long reconciled the two by a flat shelf on the hillside, and the slopes above Tabgha have such terraces; many scholars hold rather that Matthew's mountain is a setting with meaning, a new Sinai where the new law is given, and that Luke's plain makes room for the crowds, so the question of a spot does not arise. Both Gospels set the sermon early in the Galilean ministry, when Jesus was based at Capernaum."
    - "The tradition at Tabgha is old. A note from Egeria's travels, preserved by Peter the Deacon, says that near the seven springs rises the mountain with the cave to which the Saviour climbed and spoke the Beatitudes; a small Byzantine chapel found in 1935, dated by its excavator Bagatti to the fourth century and by others to the sixth, stood on the slope just above the road at Tabgha, and the Franciscan church of 1938, by Antonio Barluzzi, eight-sided for the eight Beatitudes, stands higher up the hill with the lake spread below. In the Middle Ages pilgrims were shown instead the Horns of Hattin, the twin-peaked hill west of Tiberias, a tradition of the Crusader period, since left behind."
  ru:
    - "Матфей не называет горы: «Увидев народ, Он взошел на гору», а сойдя с неё, «вошел Иисус в Капернаум». Традиционное место — гора Блаженств, холм над Табхой на северо-западном берегу Галилейского моря, чуть западнее Капернаума, где в 1938 году построена церковь Блаженств; точка карты стоит в Капернауме, примерно в 33 км к северо-востоку от Назарета и в 127 км к северу от Иерусалима по прямой. Какой это был холм, сказать нельзя: словам Евангелия отвечает любой склон над озером, и предание — выбор паломников, а не память."
    - "Лука рассказывает ту же проповедь на ровном месте: Иисус «взошел… на гору помолиться», утром избрал двенадцать и, «сойдя с ними, стал Он на ровном месте» перед множеством народа «из всей Иудеи и Иерусалима и приморских мест Тирских и Сидонских». Читатели издавна примиряли оба рассказа плоским уступом на склоне, и склоны над Табхой такие террасы имеют; многие учёные считают скорее, что гора Матфея — место со смыслом, новый Синай, где даётся новый закон, а равнина Луки даёт простор толпам, так что вопрос о точке не возникает. Оба Евангелия ставят проповедь в начало галилейского служения, когда Иисус жил в Капернауме."
    - "Предание в Табхе старое. Заметка из путешествия Эгерии, сохранённая Петром Диаконом, говорит, что близ семи источников поднимается гора с пещерой, на которую взошёл Спаситель и произнёс блаженства; маленькая византийская часовня, найденная в 1935 году и датированная раскопавшим её Багатти IV веком, а другими — VI, стояла на склоне сразу над дорогой в Табхе, а францисканская церковь 1938 года, построенная Антонио Барлуцци восьмигранной — по числу блаженств, — стоит выше по холму, и под ней расстилается озеро. В Средние века паломникам показывали вместо неё Рога Хаттина, двуглавый холм к западу от Тивериады: это предание времён крестоносцев, с тех пор оставленное."
  uk:
    - "Матвій не називає гору: «Побачивши ж народ, зійшов на гору», а коли зійшов, то «увійшов Ісус у Капернаум». Традиційне місце — гора Блаженств, пагорб над Табхою на північно-західному березі Галілейського моря, трохи на захід від Капернаума, де 1938 р. збудовано церкву Блаженств; точка на мапі стоїть у Капернаумі, приблизно за 33 км на північний схід від Назарета і за 127 км на північ від Єрусалима по прямій. Ніхто не може сказати, який це був пагорб: слова Євангелія пасують будь-якому зі схилів над озером, а переказ — це вибір паломників, а не пам'ять."
    - "Лука розповідає ту саму проповідь на рівному місці: Ісус «вийшов Він на гору молитись», вранці вибрав дванадцятьох і «зійшовши з ними, став на місцї рівному» перед натовпом «з усієї Юдеї і Єрусалиму, й з побережжя Тирського та Сидонського». Читачі здавна узгоджували ці два тексти плоским уступом на схилі, і схили над Табхою мають такі тераси; багато вчених вважають радше, що гора Матвія — значуща декорація, новий Синай, де дається новий закон, а рівнина Луки дає місце натовпам, тож питання про точне місце не постає. Обидва Євангелія ставлять проповідь на початку галілейського служіння, коли Ісус перебував у Капернаумі."
    - "Переказ у Табхі давній. Записка з подорожей Егерії, збережена Петром Дияконом, каже, що біля семи джерел здіймається гора з печерою, на яку піднявся Спаситель і виголосив Блаженства; невелика візантійська капличка, знайдена 1935 р. і датована її розкопником Баґатті IV ст., а іншими — VI ст., стояла на схилі просто над дорогою в Табхі, а францисканська церква 1938 р. роботи Антоніо Барлуцці, восьмикутна на честь восьми Блаженств, стоїть вище на пагорбі, з озером унизу. У Середньовіччі паломникам показували натомість Роги Хаттіна, двовершинний пагорб на захід від Тіверіади, переказ доби хрестоносців, відтоді залишений."
  es:
    - "Mateo no nombra el monte: «viendo las gentes, subió al monte», y cuando bajó, «entrando Jesús en Capernaum». El sitio tradicional es el monte de las Bienaventuranzas, la colina sobre Tabgha en la orilla noroeste del mar de Galilea, un poco al oeste de Cafarnaúm, donde en 1938 se construyó la iglesia de las Bienaventuranzas; el punto del mapa está en Cafarnaúm, a unos 33 km al noreste de Nazaret y a 127 km al norte de Jerusalén en línea recta. Nadie puede decir qué colina fue: cualquiera de las laderas sobre el lago encaja con las palabras del Evangelio, y la tradición es una elección de peregrinos, no un recuerdo."
    - "Lucas cuenta el mismo sermón en un lugar llano: Jesús «fué al monte á orar», eligió a los doce por la mañana y «descendió con ellos, y se paró en un lugar llano», ante una multitud «de toda Judea y de Jerusalem, y de la costa de Tiro y de Sidón». Los lectores han conciliado desde antiguo los dos relatos con una plataforma plana en la ladera, y las laderas sobre Tabgha tienen tales terrazas; muchos estudiosos sostienen más bien que el monte de Mateo es un escenario con sentido, un nuevo Sinaí donde se da la nueva ley, y que la llanura de Lucas deja sitio a las multitudes, de modo que la cuestión de un lugar no se plantea. Ambos Evangelios sitúan el sermón al comienzo del ministerio en Galilea, cuando Jesús residía en Cafarnaúm."
    - "La tradición en Tabgha es antigua. Una nota de los viajes de Egeria, conservada por Pedro Diácono, dice que cerca de las siete fuentes se alza el monte con la cueva a la que subió el Salvador y pronunció las Bienaventuranzas; una pequeña capilla bizantina hallada en 1935, fechada por su excavador Bagatti en el siglo IV y por otros en el VI, estaba en la ladera justo encima del camino de Tabgha, y la iglesia franciscana de 1938, obra de Antonio Barluzzi, octogonal por las ocho Bienaventuranzas, se alza más arriba de la colina con el lago extendido abajo. En la Edad Media se mostraban a los peregrinos, en cambio, los Cuernos de Hattin, la colina de dos picos al oeste de Tiberíades, una tradición de la época de los cruzados, abandonada desde entonces."
  pt:
    - "Mateus não nomeia o monte: “Vendo as multidões, ele subiu ao monte”, e quando desceu “entrou em Cafarnaum”. O sítio tradicional é o monte das Bem-aventuranças, a colina acima de Tabgha, na margem noroeste do mar da Galileia, um pouco a oeste de Cafarnaum, onde a Igreja das Bem-aventuranças foi construída em 1938; o ponto do mapa fica em Cafarnaum, a cerca de 33 km a nordeste de Nazaré e 127 km ao norte de Jerusalém em linha reta. Ninguém pode dizer qual era a colina: qualquer das encostas acima do lago se ajusta às palavras do Evangelho, e a tradição é uma escolha de peregrinos, não uma memória."
    - "Lucas conta o mesmo sermão num terreno plano: Jesus “retirou-se para o monte a fim de orar”, escolheu os doze pela manhã e “desceu com eles e parou num lugar plano”, diante de uma multidão “de toda a Judeia e Jerusalém, e do litoral de Tiro e Sidom”. Os leitores há muito conciliam os dois relatos por meio de um terraço plano na encosta, e as encostas acima de Tabgha têm tais terraços; muitos estudiosos sustentam antes que o monte de Mateus é um cenário com significado, um novo Sinai onde se dá a nova lei, e que a planície de Lucas dá lugar às multidões, de modo que a questão de um ponto não se coloca. Ambos os Evangelhos situam o sermão no início do ministério na Galileia, quando Jesus se baseava em Cafarnaum."
    - "A tradição em Tabgha é antiga. Uma nota das viagens de Egéria, preservada por Pedro Diácono, diz que perto das sete fontes se ergue o monte com a gruta à qual o Salvador subiu e onde falou as Bem-aventuranças; uma pequena capela bizantina encontrada em 1935, datada pelo escavador Bagatti do século IV e por outros do século VI, ficava na encosta logo acima da estrada em Tabgha, e a igreja franciscana de 1938, de Antonio Barluzzi, octogonal pelas oito Bem-aventuranças, fica mais acima na colina, com o lago estendido abaixo. Na Idade Média, mostravam-se aos peregrinos, em vez disso, os Chifres de Hattin, a colina de dois picos a oeste de Tiberíades, uma tradição do período das Cruzadas, desde então abandonada."
  de:
    - "Matthäus nennt den Berg nicht: „Da er aber das Volk sah, ging er auf einen Berg“, und nach dem Abstieg: „Da aber Jesus einging zu Kapernaum“. Die traditionelle Stätte ist der Berg der Seligpreisungen, der Hügel über Tabgha am Nordwestufer des Sees Genezareth, ein wenig westlich von Kapernaum, wo 1938 die Kirche der Seligpreisungen gebaut wurde; der Kartenpunkt steht bei Kapernaum, in der Luftlinie etwa 33 km nordöstlich von Nazareth und 127 km nördlich von Jerusalem. Niemand kann sagen, welcher Hügel es war: Jeder der Hänge über dem See passt zu den Worten des Evangeliums, und die Tradition ist eine Wahl der Pilger, keine Erinnerung."
    - "Lukas erzählt dieselbe Predigt auf ebener Fläche: Jesus „ging auf einen Berg zu beten“, wählte am Morgen die Zwölf und „ging hernieder mit ihnen und trat auf einen Platz im Felde“, vor einer Menge „von allem jüdischen Lande und Jerusalem und Tyrus und Sidon, am Meer gelegen“. Leser haben beides längst durch eine flache Stufe am Hang ausgeglichen, und die Hänge über Tabgha haben solche Terrassen; viele Gelehrte meinen eher, der Berg des Matthäus sei ein Schauplatz mit Bedeutung, ein neuer Sinai, wo das neue Gesetz gegeben wird, und die Ebene des Lukas schaffe Raum für die Menge, sodass sich die Frage nach einem Ort nicht stellt. Beide Evangelien setzen die Predigt früh in das galiläische Wirken, als Jesus in Kapernaum seinen Sitz hatte."
    - "Die Überlieferung in Tabgha ist alt. Eine Notiz aus Egerias Reisen, bei Petrus Diaconus erhalten, sagt, nahe den sieben Quellen erhebe sich der Berg mit der Höhle, auf die der Heiland gestiegen sei und die Seligpreisungen gesprochen habe; eine kleine byzantinische Kapelle, 1935 gefunden, von ihrem Ausgräber Bagatti ins 4. Jahrhundert datiert, von anderen ins 6., stand am Hang knapp über der Straße bei Tabgha, und die Franziskanerkirche von 1938 von Antonio Barluzzi, achteckig für die acht Seligpreisungen, steht höher am Hügel, mit dem See darunter. Im Mittelalter zeigte man Pilgern stattdessen die Hörner von Hattin, den doppelgipfeligen Hügel westlich von Tiberias, eine Überlieferung der Kreuzfahrerzeit, die inzwischen verlassen ist."
  fr:
    - "Matthieu ne nomme pas la montagne : « Voyant la foule, Jésus monta sur la montagne », et, après sa descente, « Jésus entrait dans Capernaüm ». Le site traditionnel est le mont des Béatitudes, la colline au-dessus de Tabgha, sur la rive nord-ouest de la mer de Galilée, un peu à l’ouest de Capernaüm, où l’église des Béatitudes fut bâtie en 1938 ; le point de la carte se trouve à Capernaüm, à environ 33 km au nord-est de Nazareth et à 127 km au nord de Jérusalem à vol d’oiseau. Nul ne peut dire de quelle colline il s’agit : n’importe laquelle des pentes au-dessus du lac convient aux paroles de l’Évangile, et la tradition est un choix de pèlerins, non un souvenir."
    - "Luc raconte le même sermon en terrain plat : Jésus « se rendit sur la montagne pour prier », choisit les douze au matin, puis « descendit avec eux, et s’arrêta sur un plateau », devant « une multitude de peuple de toute la Judée, de Jérusalem, et de la contrée maritime de Tyr et de Sidon ». Les lecteurs ont longtemps concilié les deux récits par une terrasse plate à flanc de colline, et les pentes au-dessus de Tabgha ont de telles terrasses ; beaucoup de spécialistes tiennent plutôt que la montagne de Matthieu est un décor chargé de sens, un nouveau Sinaï où est donnée la nouvelle loi, et que le plateau de Luc fait place aux foules, de sorte que la question d’un emplacement ne se pose pas. Les deux Évangiles placent le sermon au début du ministère en Galilée, quand Jésus avait son point d’attache à Capernaüm."
    - "La tradition de Tabgha est ancienne. Une note tirée des voyages d’Égérie, conservée par Pierre Diacre, dit qu’auprès des sept sources s’élève la montagne avec la grotte où le Sauveur monta et prononça les Béatitudes ; une petite chapelle byzantine découverte en 1935, datée par son fouilleur Bagatti du IVe siècle et par d’autres du VIe, se dressait sur la pente juste au-dessus de la route à Tabgha, et l’église franciscaine de 1938, œuvre d’Antonio Barluzzi, de forme octogonale pour les huit Béatitudes, se dresse plus haut sur la colline, avec le lac étalé en contrebas. Au Moyen Âge, on montrait aux pèlerins à la place les Cornes de Hattin, la colline à deux sommets à l’ouest de Tibériade, tradition de l’époque des croisés, abandonnée depuis."
  pl:
    - "Mateusz nie wymienia góry: „widząc lud, wstąpił na górę”, a gdy zszedł, „wszedł do Kapernaum”. Tradycyjnym miejscem jest Góra Błogosławieństw, wzgórze nad Tabgha na północno-zachodnim brzegu Jeziora Galilejskiego, nieco na zachód od Kafarnaum, gdzie w 1938 zbudowano Kościół Błogosławieństw; punkt na mapie stoi w Kafarnaum, około 33 km na północny wschód od Nazaretu i 127 km na północ od Jerozolimy w linii prostej. Nikt nie potrafi powiedzieć, które to było wzgórze: pasuje do słów Ewangelii każdy ze stoków nad jeziorem, a tradycja jest wyborem pielgrzymów, nie wspomnieniem."
    - "Łukasz opowiada to samo kazanie na równinie: Jezus „odszedł na górę, aby się modlił”, rano wybrał dwunastu i „zstąpiwszy z nimi stanął na miejscu pola równego”, przed tłumem „ze wszystkiej Judzkiej ziemi, i z Jeruzalemu, i z kraju pomorskiego, leżącego przy Tyrze i Sydonie”. Czytelnicy od dawna godzili oba opisy płaskim występem na zboczu, a stoki nad Tabgha mają takie tarasy; wielu uczonych uważa raczej, że góra Mateusza jest sceną o znaczeniu, nowym Synajem, gdzie dane jest nowe prawo, a równina Łukasza robi miejsce tłumom, więc pytanie o miejsce nie powstaje. Obie Ewangelie umieszczają kazanie na początku galilejskiej działalności, gdy Jezus miał siedzibę w Kafarnaum."
    - "Tradycja w Tabgha jest stara. Zapis z podróży Egerii, zachowany przez Piotra Diakona, mówi, że blisko siedmiu źródeł wznosi się góra z jaskinią, na którą wspiął się Zbawiciel i wygłosił Błogosławieństwa; mała bizantyjska kaplica odkryta w 1935, datowana przez odkrywcę Bagattiego na IV wiek, a przez innych na VI, stała na stoku tuż nad drogą w Tabgha, a franciszkański kościół z 1938, dzieło Antonia Barluzziego, ośmioboczny dla ośmiu Błogosławieństw, stoi wyżej na wzgórzu z jeziorem rozpostartym poniżej. W średniowieczu pielgrzymom pokazywano zamiast tego Rogi Hittin, dwuszczytowe wzgórze na zachód od Tyberiady, tradycję okresu krzyżowców, od tamtej pory porzuconą."
  it:
    - "Matteo non nomina il monte: Gesù, «vedendo le folle, salì sul monte», e dopo la discesa entrò in Cafarnao. Il luogo tradizionale è il Monte delle Beatitudini, la collina sopra Tabgha sulla riva nord-occidentale del Lago di Tiberiade, un po’ a ovest di Cafarnao, dove nel 1938 fu costruita la Chiesa delle Beatitudini; il punto della mappa si trova a Cafarnao, a circa 33 km a nord-est di Nazaret e 127 km a nord di Gerusalemme in linea d’aria. Nessuno può dire quale colle fosse: qualunque dei pendii sopra il lago si adatta alle parole del Vangelo, e la tradizione è una scelta dei pellegrini, non un ricordo."
    - "Luca racconta lo stesso discorso in un luogo pianeggiante: Gesù «se ne andò sul monte a pregare», scelse i dodici al mattino e «sceso con loro, si fermò sopra un ripiano», davanti a una folla «da tutta la Giudea e da Gerusalemme e dalla marina di Tiro e di Sidone». I lettori hanno da tempo conciliato i due racconti con un ripiano sul fianco della collina, e i pendii sopra Tabgha hanno tali terrazze; molti studiosi ritengono piuttosto che il monte di Matteo sia uno scenario carico di significato, un nuovo Sinai dove viene data la nuova legge, e che il luogo pianeggiante di Luca faccia posto alle folle, così che la questione di un luogo preciso non si pone. Entrambi i Vangeli collocano il discorso all’inizio del ministero galileo, quando Gesù aveva base a Cafarnao."
    - "La tradizione di Tabgha è antica. Una nota dei viaggi di Egeria, conservata da Pietro Diacono, dice che presso le sette sorgenti si leva il monte con la grotta in cui il Salvatore salì e pronunciò le Beatitudini; una piccola cappella bizantina trovata nel 1935, datata dal suo scavatore Bagatti al IV secolo e da altri al VI, sorgeva sul pendio subito sopra la strada a Tabgha, e la chiesa francescana del 1938, di Antonio Barluzzi, ottagonale per le otto Beatitudini, sorge più in alto sulla collina con il lago disteso sotto. Nel Medioevo ai pellegrini venivano mostrati invece i Corni di Hattin, la collina a due cime a ovest di Tiberiade, una tradizione del periodo crociato, poi abbandonata."
  cs:
    - "Matouš horu nejmenuje: „Vida pak Ježíš zástupy, vstoupil na horu“ a když sestoupil, „vcházel Ježíš do Kafarnaum“. Tradiční místo je Hora blahoslavenství, pahorek nad Tabghou na severozápadním břehu Galilejského jezera, kousek západně od Kafarnaum, kde byl roku 1938 postaven kostel Blahoslavenství; bod na mapě stojí v Kafarnaum, asi 33 km severovýchodně od Nazareta a vzdušnou čarou 127 km severně od Jeruzaléma. Nikdo neumí říci, který pahorek to byl: kterýkoli ze svahů nad jezerem odpovídá slovům evangelia a tradice je volbou poutníků, ne vzpomínkou."
    - "Lukáš vypráví tutéž řeč na rovině: „vyšel Ježíš na horu k modlení“, ráno vybral dvanáct a „sstoupiv s nimi s hory, stál na místě polním“ před množstvím lidu „ze všeho Judstva i z Jeruzaléma, i z Týru i z Sidonu, jenž při moři jsou“. Čtenáři obojí dávno sladili rovnou terasou na úbočí a svahy nad Tabghou takové terasy mají; mnozí badatelé však soudí, že Matoušova hora je významově nabité dějiště, nový Sinaj, kde se dává nový zákon, a že Lukášova rovina dává místo zástupům, takže otázka místa nevzniká. Obě evangelia kladou řeč na počátek galilejského působení, kdy sídlil Ježíš v Kafarnaum."
    - "Tradice v Tabghe je stará. Poznámka z Egeriiných cest, zachovaná Petrem Jáhnem, říká, že u sedmi pramenů se zvedá hora s jeskyní, na kterou vystoupil Spasitel a pronesl blahoslavenství; malá byzantská kaple nalezená roku 1935, datovaná jejím vykopávačem Bagattim do 4. století a jinými do 6., stála na svahu těsně nad cestou v Tabghe, a františkánský kostel z roku 1938 od Antonia Barluzziho, osmiboký pro osm blahoslavenství, stojí výše na pahorku s jezerem rozprostřeným pod ním. Ve středověku se poutníkům ukazovaly místo toho Hattínské rohy, dvouvrcholový pahorek západně od Tiberiady, tradice z doby křižáků, od té doby opuštěná."
  nl:
    - "Mattheüs noemt de berg niet: Jezus, “de schare ziende, is geklommen op een berg”, en na de afdaling “te Kapernaum ingegaan”. De traditionele plaats is de Berg van de Zaligsprekingen, de heuvel boven Tabgha aan de noordwestelijke oever van het Meer van Galilea, iets ten westen van Kafarnaüm, waar de Kerk van de Zaligsprekingen in 1938 werd gebouwd; het punt op de kaart staat bij Kafarnaüm, ongeveer 33 km ten noordoosten van Nazareth en hemelsbreed 127 km ten noorden van Jeruzalem. Niemand kan zeggen welke heuvel het was: elke helling boven het meer past bij de woorden van het evangelie, en de overlevering is een keuze van pelgrims, geen herinnering."
    - "Lukas vertelt dezelfde rede op vlak terrein: toen Jezus “uitging naar den berg, om te bidden”, koos Hij 's morgens de twaalf en, “met hen afgekomen zijnde, stond Hij op een vlakke plaats”, voor “een grote menigte des volks van geheel Judea en Jeruzalem, en van den zeekant van Tyrus en Sidon”. Lezers hebben beide al lang verzoend door een vlakke bank op de berghelling, en de hellingen boven Tabgha hebben zulke terrassen; veel geleerden menen eerder dat de berg van Mattheüs een betekenisvolle setting is, een nieuwe Sinaï waar de nieuwe wet wordt gegeven, en dat de vlakte van Lukas ruimte maakt voor de menigten, zodat de vraag naar een plek niet opkomt. Beide evangeliën plaatsen de rede vroeg in de Galilese bediening, toen Jezus in Kafarnaüm was gevestigd."
    - "De overlevering bij Tabgha is oud. Een aantekening uit de reizen van Egeria, bewaard door Petrus de Diaken, zegt dat bij de zeven bronnen de berg oprijst met de grot waarheen de Heiland klom en de zaligsprekingen uitsprak; een kleine Byzantijnse kapel, in 1935 gevonden, door de opgraver Bagatti gedateerd in de vierde eeuw en door anderen in de zesde, stond op de helling net boven de weg bij Tabgha, en de franciscaanse kerk van 1938, van Antonio Barluzzi, achthoekig voor de acht zaligsprekingen, staat hoger op de heuvel met het meer eronder uitgespreid. In de middeleeuwen kregen pelgrims in plaats daarvan de Hoornen van Hattin te zien, de tweetoppige heuvel ten westen van Tiberias, een overlevering uit de kruisvaardersperiode, sindsdien verlaten."
