id: who-were-the-chaldeans
question:
  en: "Who were the Chaldeans?"
  ru: "Кто такие халдеи?"
  uk: "Хто були халдеї?"
  es: "¿Quiénes eran los caldeos?"
  pt: "Quem eram os caldeus?"
  de: "Wer waren die Chaldäer?"
  fr: "Qui étaient les Chaldéens ?"
  pl: "Kim byli Chaldejczycy?"
  it: "Chi erano i Caldei?"
  cs: "Kdo byli Chaldejci?"
  nl: "Wie waren de Chaldeeën?"
answer:
  en:
    - "The Chaldeans were tribes settled from about the ninth century BC in the marshes and river country of southern Babylonia, near the head of the Persian Gulf; Assyrian records call their land Kaldu. The Bible uses the name in three senses: the people, the dynasty of Nabopolassar and Nebuchadnezzar that ruled Babylon from 626 to 539 BC, and the learned men of its court. The map's point for Chaldea stands at Ur, about 235 km south-east of Babylon in a straight line and 1,035 km from Jerusalem."
    - "Isaiah, in the eighth century, could still call them new: “this people was not, till the Assyrian founded it for them that dwell in the wilderness”; Job's camels are carried off by three bands of Chaldeans. From 626 BC, when Nabopolassar took the throne of Babylon, they are the power that ends Judah. Habakkuk sees God raise up “the Chaldeans, that bitter and hasty nation”; “bands of the Chaldees” harry Jehoiakim; the Chaldeans besieging Jerusalem withdraw before Pharaoh's army, and Jeremiah warns, “Deceive not yourselves, saying, The Chaldeans shall surely depart from us”; in 586 BC “the army of the Chaldees pursued after the king, and overtook him in the plains of Jericho”, and they broke up the bronze pillars of the Temple and carried the bronze to Babylon."
    - "Ezekiel is called “in the land of the Chaldeans by the river Chebar”. In Daniel, Chaldeans are a class of wise men beside the magicians and astrologers, who answer the king “in Syriack”, that is, in Aramaic; Belshazzar is “the king of the Chaldeans”; the exiles are told, “Go ye forth of Babylon, flee ye from the Chaldeans”."
    - "Greek writers took the third sense: Herodotus calls the Chaldeans the priests of Bel at Babylon, and Diodorus describes them as a caste, like the priests of Egypt, who read the future in the stars, so that in Latin and all through the Middle Ages “Chaldean” meant astrologer. “Ur of the Chaldees”, the home Abraham left, is the puzzle: a thousand years divide him from the first Chaldean in any record. Most scholars take the phrase as a later writer's name for Ur as his readers knew it, the Sumerian city at Tell el-Muqayyar that Leonard Woolley dug from 1922 to 1934, with its royal tombs and ziggurat; a minority, after Cyrus Gordon, looks for Abraham's Ur in the north, near Haran, at a place called Ura or at Urfa. Whether Nabopolassar himself was of Chaldean stock is also debated. Of the exiles' life among them the cuneiform tablets of al-Yahudu, “Judah-town”, now tell."
  ru:
    - "Халдеи — племена, осевшие примерно с IX века до н. э. в болотах и речных землях южной Вавилонии, у вершины Персидского залива; ассирийские записи называют их землю Калду. Библия употребляет имя в трёх смыслах: народ, династия Набопаласара и Навуходоносора, правившая Вавилоном с 626 по 539 г. до н. э., и учёные мужи при её дворе. Точка карты для Халдеи стоит в Уре, примерно в 235 км к юго-востоку от Вавилона по прямой и в 1035 км от Иерусалима."
    - "Исаия в VIII веке ещё мог назвать их новым народом: «Этого народа прежде не было; Ассур положил ему начало из обитателей пустынь»; верблюдов Иова угоняют три отряда халдеев. С 626 г. до н. э., когда Набопаласар занял престол Вавилона, они — та сила, что кладёт конец Иудее. Аввакум видит, как Бог поднимает «Халдеев, народ жестокий и необузданный»; «полчища Халдеев» тревожат Иоакима; халдеи, осаждавшие Иерусалим, отступают перед войском фараона, и Иеремия предостерегает: «не обманывайте себя, говоря: “непременно отойдут от нас Халдеи”»; в 586 г. до н. э. «погналось войско Халдейское за царем, и настигли его на равнинах Иерихонских», а медные столбы Храма они изломали и медь увезли в Вавилон."
    - "Иезекииль призван «в земле Халдейской, при реке Ховаре». У Даниила халдеи — разряд мудрецов рядом с тайноведцами и гадателями, которые отвечают царю «по-Арамейски»; Валтасар — «царь Халдейский»; изгнанникам сказано: «Выходите из Вавилона, бегите от Халдеев»."
    - "Греческие писатели взяли третий смысл: Геродот называет халдеями жрецов Бела в Вавилоне, а Диодор описывает их как сословие, подобное египетским жрецам, читающее будущее по звёздам, так что по-латыни и всё Средневековье «халдей» значило «звездочёт». Ур Халдейский, откуда вышел Авраам, — загадка: от него до первого халдея в любой записи тысяча лет. Большинство учёных считают это выражение именем, которым позднейший автор назвал Ур так, как знали его читатели, — шумерский город на Телль-эль-Мукайяре, который Леонард Вулли раскапывал в 1922–1934 годах, с царскими гробницами и зиккуратом; меньшинство вслед за Сайрусом Гордоном ищет Ур Авраама на севере, близ Харрана, в месте под названием Ура или в Урфе. Был ли сам Набопаласар халдейского рода, тоже спорно. О жизни изгнанников среди халдеев теперь рассказывают клинописные таблички из Аль-Яхуду — «города иудеев»."
  uk:
    - "Халдеї були племенами, осілими приблизно від IX ст. до н. е. в болотах і річковому краї південної Вавилонії, біля вершини Перської затоки; ассирійські записи називають їхню землю Калду. Біблія вживає назву у трьох значеннях: народ, династія Набопаласара й Навуходоносора, що правила Вавилоном з 626 до 539 р. до н. е., і вчені мужі її двору. Точка Халдеї на мапі стоїть в Урі, приблизно за 235 км на південний схід від Вавилона по прямій і за 1035 км від Єрусалима."
    - "Ісая у VIII ст. ще міг називати їх новими: «давно того народу не було; се Ассур дав до його почин, заложив його з тих, що жили в пустинях»; верблюдів Йова забирають три ватаги халдеїв: «Халдеї зложили три ватаги». Від 626 р. до н. е., коли Набопаласар зійшов на престол Вавилона, вони — сила, що кладе край Юді. Авакум бачить, як Бог піднімає «Халдеїв, нарід жорстокий, та бутний»; «ватаги Халдеїв» грабують Йоакима; халдеї, що облягали Єрусалим, відходять перед військом фараона, і Єремія застерігає: «Не зводїте самі себе, думаючи: Халдеї конче відійдуть од нас»; 586 р. до н. е. «Військо ж Халдейське погналось за царем, та й наздогнали вони його в Ерихонському степу», і вони розбили бронзові стовпи Храму й повезли бронзу до Вавилона."
    - "Езекиїла покликано «в Халдейській землї, при Ховар-річцї». У Даниїлі халдеї — клас мудреців поряд із чарівниками й астрологами, що відповідають цареві «по арамейськи»; Валтасар — «царя Халдейського»; вигнанцям кажуть: «Рушайте ж із Вавилону, втїкайте від Халдеїв»."
    - "Грецькі автори взяли третє значення: Геродот називає халдеїв жерцями Бела у Вавилоні, а Діодор описує їх як касту, подібну до жерців Єгипту, що читає майбутнє в зорях, так що по-латині та впродовж усього Середньовіччя «халдей» означало астролога. «Ур Халдейський», домівка, яку покинув Авраам, — загадка: тисяча років відділяє його від першого халдея в будь-якому записі. Більшість учених розуміють цей вираз як назву пізнішого письменника для Ура, яким його знали його читачі, шумерського міста в Телль-ель-Мукаярі, яке Леонард Вуллі розкопував з 1922 до 1934 р., із царськими гробницями та зіґуратом; меншість, услід за Сайрусом Гордоном, шукає Ур Авраама на півночі, біля Харана, у місці під назвою Ура або в Урфі. Чи сам Набопаласар походив із халдейського роду — також обговорюють. Про життя вигнанців серед них нині розповідають клинописні таблички з Аль-Яхуду, «міста Юди»."
  es:
    - "Los caldeos eran tribus asentadas desde aproximadamente el siglo IX a. C. en las marismas y el país fluvial del sur de Babilonia, cerca de la cabecera del golfo Pérsico; los registros asirios llaman a su tierra Kaldu. La Biblia usa el nombre en tres sentidos: el pueblo, la dinastía de Nabopolasar y Nabucodonosor que gobernó Babilonia del 626 al 539 a. C., y los sabios de su corte. El punto del mapa para Caldea está en Ur, a unos 235 km al sureste de Babilonia en línea recta y a 1035 km de Jerusalén."
    - "Isaías, en el siglo VIII, aún podía llamarlos nuevos: «este pueblo no era; Assur la fundó para los que habitaban en el desierto»; los camellos de Job son arrebatados por tres bandas de caldeos. Desde el 626 a. C., cuando Nabopolasar tomó el trono de Babilonia, son la potencia que acaba con Judá. Habacuc ve a Dios levantar «los Caldeos, gente amarga y presurosa»; «tropas de Caldeos» hostigan a Joacim; los caldeos que sitiaban Jerusalén se retiran ante el ejército del faraón, y Jeremías advierte: «No engañéis vuestras almas, diciendo: Sin duda los Caldeos se han ido de nosotros»; en 586 a. C. «el ejército de los Caldeos siguió al rey, y tomólo en las llanuras de Jericó», y rompieron las columnas de bronce del Templo y llevaron el bronce a Babilonia."
    - "A Ezequiel se lo llama «en la tierra de los Caldeos, junto al río de Chebar». En Daniel, los caldeos son una clase de sabios junto a los magos y los astrólogos, que responden al rey «en lengua aramea», es decir, en arameo; Belsasar es «rey de los Caldeos»; a los desterrados se les dice: «Salid de Babilonia, huid de entre los Caldeos»."
    - "Los griegos tomaron el tercer sentido: Heródoto llama caldeos a los sacerdotes de Bel en Babilonia, y Diodoro los describe como casta, como los sacerdotes de Egipto, que leían el futuro en los astros, así que en latín y toda la Edad Media «caldeo» significó astrólogo. «Ur de los caldeos», la patria que dejó Abraham, es el enigma: mil años separan a Abraham del primer caldeo registrado. La mayoría toma la frase por el nombre que un escritor posterior dio a Ur como la conocían sus lectores, la ciudad sumeria de Tell el-Muqayyar que Leonard Woolley excavó en 1922–1934, con sus tumbas reales y su zigurat; una minoría, tras Cyrus Gordon, busca la Ur de Abraham en el norte, cerca de Harán, en Ura o en Urfa. También se discute si Nabopolasar era de estirpe caldea. De la vida de los desterrados entre ellos hablan las tablillas cuneiformes de al-Yahudu, «la ciudad de Judá»."
  pt:
    - "Os caldeus eram tribos estabelecidas, desde cerca do século IX a.C., nos pântanos e nas terras ribeirinhas do sul da Babilônia, perto da cabeceira do golfo Pérsico; os registros assírios chamam a sua terra Kaldu. A Bíblia usa o nome em três sentidos: o povo, a dinastia de Nabopolassar e Nabucodonosor que governou Babilônia de 626 a 539 a.C. e os sábios de sua corte. O ponto do mapa para a Caldeia fica em Ur, a cerca de 235 km a sudeste de Babilônia em linha reta e 1.035 km de Jerusalém."
    - "Isaías, no século VIII, ainda podia chamá-los de novos: “Este povo não existia. Os assírios a fundaram para os que habitam no deserto”; os camelos de Jó são levados por três bandos de caldeus. Desde 626 a.C., quando Nabopolassar tomou o trono de Babilônia, são o poder que acaba com Judá. Habacuque vê Deus levantar “os caldeus, aquela nação amarga e impetuosa”; “bandos de caldeus” assolam Jeoaquim; os caldeus que sitiavam Jerusalém recuam diante do exército do faraó, e Jeremias adverte: “Não enganem a si mesmos, dizendo: Os caldeus certamente se retirarão de nós”; em 586 a.C. “o exército dos caldeus perseguiu o rei e o alcançou nas planícies de Jericó”, e quebraram as colunas de bronze do Templo e levaram o bronze para Babilônia."
    - "Ezequiel é chamado “na terra dos caldeus, junto ao rio Quebar”. Em Daniel, os caldeus são uma classe de sábios ao lado dos magos e astrólogos, que respondem ao rei “na língua aramaica”; Belsazar é “o rei caldeu”; aos exilados se diz: “Saiam da Babilônia! Fujam dos caldeus!”"
    - "Os escritores gregos tomaram o terceiro sentido: Heródoto chama os caldeus de sacerdotes de Bel em Babilônia, e Diodoro os descreve como uma casta, como os do Egito, que liam o futuro nas estrelas, de modo que em latim e na Idade Média “caldeu” significava astrólogo. “Ur dos Caldeus”, a terra que Abraão deixou, é o enigma: mil anos separam-no do primeiro caldeu em qualquer registro. A maioria dos estudiosos toma a expressão como o nome que um escritor posterior dava a Ur como seus leitores a conheciam, a cidade suméria em Tell el-Muqayyar que Leonard Woolley escavou de 1922 a 1934, com seus túmulos reais e zigurate; uma minoria, com Cyrus Gordon, procura o Ur de Abraão no norte, perto de Harã, em Ura ou em Urfa. Também se debate se o próprio Nabopolassar era caldeu. Da vida dos exilados entre eles falam hoje as tabuinhas cuneiformes de Al-Yahudu, “cidade de Judá”."
  de:
    - "Die Chaldäer waren Stämme, die sich ab etwa dem 9. Jahrhundert v. Chr. in den Sümpfen und im Flussland Südbabyloniens nahe dem Kopfende des Persischen Golfs niederließen; assyrische Quellen nennen ihr Land Kaldu. Die Bibel gebraucht den Namen in drei Bedeutungen: das Volk, die Dynastie Nabopolassars und Nebukadnezars, die Babylon von 626 bis 539 v. Chr. beherrschte, und die Gelehrten ihres Hofes. Der Kartenpunkt für Chaldäa steht bei Ur, etwa 235 km südöstlich von Babylon in der Luftlinie und 1035 km von Jerusalem."
    - "Jesaja konnte sie im 8. Jahrhundert noch neu nennen: „der Chaldäer Land, das nicht ein Volk war, sondern Assur hat es angerichtet“; Hiobs Kamele werden von drei Banden Chaldäer weggeführt: „Die Chaldäer machte drei Rotten und überfielen die Kamele“. Ab 626 v. Chr., als Nabopolassar den Thron Babylons bestieg, sind sie die Macht, die Juda beendet. Habakuk sieht Gott „die Chaldäer erwecken, ein bitteres und schnelles Volk“; der HERR „ließ auf ihn Kriegsknechte kommen aus Chaldäa“ gegen Jojakim; die Chaldäer, die Jerusalem belagerten, zogen vor dem Heer des Pharao ab, und Jeremia warnt: „Betrügt eure Seelen nicht, daß ihr denkt, die Chaldäer werden von uns abziehen“; 586 v. Chr. „Aber die Macht der Chaldäer jagte dem König nach, und sie ergriffen ihn im blachen Felde zu Jericho“, und sie zerbrachen die Bronzesäulen des Tempels und „führten das Erz gen Babel“."
    - "Hesekiel wird berufen „im Lande der Chaldäer, am Wasser Chebar“. Bei Daniel sind die Chaldäer eine Klasse von Weisen neben Zauberern und Sehern, die dem König „auf chaldäisch“ antworten, das heißt auf Aramäisch; Belsazar ist „der Chaldäer König“; den Verbannten wird gesagt: „Gehet aus von Babel, fliehet von den Chaldäern“."
    - "Griechische Autoren nahmen die dritte Bedeutung auf: Herodot nennt die Chaldäer Priester des Bel in Babylon, Diodor eine Kaste wie die Priester Ägyptens, die die Zukunft in den Sternen lasen, sodass „Chaldäer“ im Lateinischen und im ganzen Mittelalter Astrologe hieß. „Ur in Chaldäa“, Abrahams Heimat, ist das Rätsel: Tausend Jahre trennen ihn vom ersten Chaldäer in einer Quelle. Die meisten halten die Wendung für den Namen eines späteren Verfassers für Ur, wie seine Leser es kannten, die sumerische Stadt bei Tell el-Muqayyar, die Leonard Woolley 1922–1934 mit Königsgräbern und Zikkurat ausgrub; eine Minderheit sucht nach Cyrus Gordon Abrahams Ur im Norden nahe Haran, in Ura oder Urfa. Ob Nabopolassar selbst Chaldäer war, ist ebenfalls umstritten. Vom Leben der Verbannten erzählen die Keilschrifttafeln von al-Yahudu, „Stadt Judas“."
  fr:
    - "Les Chaldéens étaient des tribus installées à partir d’environ le IXe siècle av. J.-C. dans les marais et le pays fluvial du sud de la Babylonie, près du fond du golfe Persique ; les annales assyriennes appellent leur pays Kaldu. La Bible emploie le nom en trois sens : le peuple, la dynastie de Nabopolassar et de Nebucadnetsar qui gouverna Babylone de 626 à 539 av. J.-C., et les lettrés de sa cour. Le point de la carte pour la Chaldée se trouve à Ur, à environ 235 km au sud-est de Babylone à vol d’oiseau et à 1 035 km de Jérusalem."
    - "Ésaïe, au VIIIe siècle, pouvait encore les dire nouveaux : « les Chaldéens, qui n’étaient pas un peuple, ces habitants du désert, pour qui l’Assyrien a fondé un pays » ; les chameaux de Job sont enlevés par « Des Chaldéens, formés en trois bandes ». À partir de 626 av. J.-C., quand Nabopolassar monta sur le trône de Babylone, ils sont la puissance qui met fin à Juda. Habacuc voit Dieu susciter « les Chaldéens, peuple furibond et impétueux » ; des « troupes de Chaldéens » harcèlent Jojakim ; les Chaldéens qui assiégeaient Jérusalem se retirent devant l’armée de Pharaon, et Jérémie avertit : « Ne vous faites pas d’illusion, en disant : Les Chaldéens s’en iront loin de nous ! » ; en 586 av. J.-C., « l’armée des Chaldéens poursuivit le roi et l’atteignit dans les plaines de Jéricho », et ils brisèrent les colonnes d’airain du Temple et emportèrent l’airain à Babylone."
    - "Ézéchiel est appelé « dans le pays des Chaldéens, près du fleuve du Kebar ». Dans Daniel, les Chaldéens sont une classe de sages à côté des magiciens et des astrologues, qui répondent au roi « en langue araméenne » ; Belschatsar est « roi des Chaldéens » ; il est dit aux exilés : « Sortez de Babylone, fuyez du milieu des Chaldéens ! »"
    - "Les Grecs retinrent le troisième sens : Hérodote appelle les Chaldéens les prêtres de Bel à Babylone, et Diodore les décrit en caste, comme les prêtres d’Égypte, qui lisait l’avenir dans les astres, d’où, en latin et durant tout le Moyen Âge, « Chaldéen » pour astrologue. « Ur en Chaldée », la patrie qu’Abraham quitta, fait énigme : mille ans séparent Abraham du premier Chaldéen attesté. La plupart des spécialistes y voient le nom que donna un auteur tardif à Ur telle que ses lecteurs la connaissaient, la ville sumérienne de Tell el-Muqayyar fouillée par Leonard Woolley en 1922-1934, avec ses tombes royales, sa ziggourat ; une minorité, avec Cyrus Gordon, cherche l’Ur d’Abraham au nord, près de Charan, à Oura ou à Urfa. Que Nabopolassar fût de souche chaldéenne est aussi débattu. Les tablettes cunéiformes d’al-Yahudu, la « Ville de Juda », disent aujourd’hui la vie des exilés parmi eux."
  pl:
    - "Chaldejczycy byli plemionami osiadłymi od około IX wieku p.n.e. na bagnach i w krainie rzecznej południowej Babilonii, blisko wierzchołka Zatoki Perskiej; asyryjskie zapisy nazywają ich kraj Kaldu. Biblia używa tej nazwy w trzech znaczeniach: lud, dynastia Nabopolasara i Nabuchodonozora, która rządziła Babilonem od 626 do 539 p.n.e., i uczeni jej dworu. Punkt na mapie dla Chaldei stoi w Ur, około 235 km na południowy wschód od Babilonu w linii prostej i 1035 km od Jerozolimy."
    - "Izajasz w VIII wieku mógł jeszcze nazywać ich nowymi: „ten lud nie był ludem. Assyryjczyk założył ją dla obywateli pustyń”; wielbłądy Hioba zabierają trzy hufce Chaldejczyków. Od 626 p.n.e., gdy Nabopolasar objął tron Babilonu, są mocarstwem, które kładzie kres Judzie. Habakuk widzi, jak Bóg wzbudza „Chaldejczyków, naród srogi i prędki”; Pan posyła przeciw Jojakimowi „wojska Chaldejskie”; Chaldejczycy oblegający Jerozolimę odstępują przed armią faraona, a Jeremiasz ostrzega: „Nie zwodźcie dusz waszych, mówiąc: Zapewne odciągną od nas Chaldejczycy”; w 586 p.n.e. „goniło wojsko Chaldejskie króla, i pojmało go na polach Jerycho”, a oni potłukli miedziane słupy Świątyni i zabrali miedź do Babilonu."
    - "Ezechiel otrzymuje słowo „w ziemi Chaldejskiej u rzeki Chebar”. U Daniela Chaldejczycy są klasą mędrców obok magów i astrologów, którzy odpowiadają królowi „po syryjsku”, czyli po aramejsku; Belszassar to „król Chaldejski”; wygnańcom mówi się: „Wynijdźcie z Babilonu, ucieczcie od Chaldejczyków”."
    - "Pisarze greccy przyjęli trzecie znaczenie: Herodot nazywa Chaldejczyków kapłanami Bela w Babilonie, a Diodor opisuje ich jako kastę, jak kapłani Egiptu, czytającą przyszłość w gwiazdach, tak że po łacinie i w średniowieczu „Chaldejczyk” znaczył astrolog. „Ur Chaldejskie”, dom, który opuścił Abraham, jest zagadką: tysiąc lat dzieli go od pierwszego Chaldejczyka w jakimkolwiek zapisie. Większość uczonych uważa je za nazwę późniejszego autora dla Ur, jak znali je jego czytelnicy, sumeryjskiego miasta w Tell el-Muqayyar, które Leonard Woolley kopał w latach 1922–1934, z jego grobami królewskimi i zikkuratem; mniejszość, za Cyrusem Gordonem, szuka Ur Abrahama na północy, blisko Charanu, w miejscu zwanym Ura lub w Urfie. Czy sam Nabopolasar był Chaldejczykiem, też jest dyskutowane. O wygnańcach wśród nich mówią dziś klinowe tabliczki z Al-Jahudu, „miasta Judy”."
  it:
    - "I Caldei erano tribù stanziate dal IX secolo a.C. circa nelle paludi e nella regione fluviale della Babilonia meridionale, presso la testata del Golfo Persico; i documenti assiri chiamano la loro terra Kaldu. La Bibbia usa il nome in tre sensi: il popolo, la dinastia di Nabopolassar e Nabucodonosor che governò Babilonia dal 626 al 539 a.C., e i dotti della sua corte. Il punto della mappa per la Caldea si trova a Ur, a circa 235 km a sud-est di Babilonia in linea d’aria e a 1.035 km da Gerusalemme."
    - "Isaia, nell’VIII secolo, poteva ancora chiamarli nuovi: «questo popolo che già non esisteva, il paese che l’Assiro assegnò a questi abitatori del deserto»; i cammelli di Giobbe sono portati via da tre bande di Caldei. Dal 626 a.C., quando Nabopolassar salì al trono di Babilonia, sono la potenza che pone fine a Giuda. Abacuc vede Dio suscitare «i Caldei, questa nazione aspra e impetuosa»; «schiere di Caldei» tormentano Ioiakim; i Caldei che assediano Gerusalemme si ritirano davanti all’esercito del faraone, e Geremia ammonisce: «Non ingannate voi stessi dicendo: Certo, i Caldei se n’andranno da noi»; nel 586 a.C., quando il re fuggì, «l’esercito dei Caldei lo inseguì, lo raggiunse nelle pianure di Gerico», ed essi spezzarono le colonne di bronzo del Tempio e portarono il bronzo a Babilonia."
    - "Ezechiele riceve la parola «nel paese dei Caldei, presso al fiume Kebar». In Daniele i Caldei sono una classe di sapienti accanto ai magi e agli astrologi, che rispondono al re «in aramaico»; Baldassarre è «re de’ Caldei»; agli esuli è detto: «Uscite da Babilonia, fuggitevene lungi dai Caldei!»."
    - "Gli scrittori greci presero il terzo senso: Erodoto chiama i Caldei i sacerdoti di Bel a Babilonia, e Diodoro li descrive come una casta, simile ai sacerdoti d’Egitto, che leggeva il futuro nelle stelle, così che in latino e nel Medioevo «caldeo» significò astrologo. «Ur de’ Caldei», la patria che Abramo lasciò, è l’enigma: mille anni lo separano dal primo Caldeo di ogni documento. La maggior parte degli studiosi vi vede il nome che uno scrittore posteriore dava a Ur come la conoscevano i lettori, la città sumera di Tell el-Muqayyar scavata da Leonard Woolley nel 1922–1934, con le tombe reali e la ziggurat; una minoranza, dopo Cyrus Gordon, cerca l’Ur di Abramo a nord, presso Carran, in un luogo chiamato Ura o a Urfa. Se lo stesso Nabopolassar fosse di stirpe caldea è discusso. Della vita degli esuli tra loro parlano le tavolette cuneiformi di al-Yahudu, «la città di Giuda»."
  cs:
    - "Chaldejci byly kmeny usazené od zhruba 9. století př. n. l. v močálech a říčním kraji jižní Babylonie, poblíž čela Perského zálivu; asyrské záznamy nazývají jejich zemi Kaldu. Bible užívá jména ve třech významech: lid, dynastie Nabopolassara a Nebukadnesara, která vládla v Babylóně v letech 626 až 539 př. n. l., a učení muži jeho dvora. Bod Chaldeje na mapě stojí v Uru, vzdušnou čarou asi 235 km jihovýchodně od Babylónu a 1 035 km od Jeruzaléma."
    - "Izajáš v 8. století je mohl ještě nazvat novými: „ten lid nebyl lidem. Assur vzdělal ji pro obyvatele pustin“; Jobovy velbloudy odvedly tři houfy Chaldejců: „Kaldejští sšikovavše tři houfy“. Od roku 626 př. n. l., kdy Nabopolassar nastoupil na babylónský trůn, jsou mocí, která ukončí Judu. Abakuk vidí, jak Bůh vzbuzuje „Kaldejské, národ lítý a rychlý“; „lotříky Kaldejské“ sužují Jójakima; Chaldejci obléhající Jeruzalém odtáhnou před faraonovým vojskem a Jeremjáš varuje: „Nesvoďte sami sebe, říkajíce: Konečně odtrhnou od nás Kaldejští“; roku 586 př. n. l. „honilo vojsko Kaldejské krále, a postihli ho na rovinách Jerišských“ a rozlámali bronzové sloupy chrámu a odvezli bronz do Babylóna."
    - "Ezechiel je povolán „v zemi Kaldejské u řeky Chebar“. V Danielovi jsou Chaldejci třídou mudrců vedle kouzelníků a hvězdopravců, kteří odpovídají králi „Syrsky“, tedy aramejsky; Belšasar je „král Kaldejský“; vyhnancům se říká: „Vyjděte z Babylona, utecte od Kaldejských.“"
    - "Řečtí spisovatelé převzali třetí význam: Hérodotos nazývá Chaldejce kněžími Bélovými v Babylóně a Diodóros je popisuje jako kastu, jako egyptské kněze, kteří čtou budoucnost z hvězd, takže latinsky a po celý středověk znamenal „Chaldejec“ hvězdáře. „Ur Kaldejských“, domov, který Abraham opustil, je hádanka: tisíc let dělí jeho dobu od prvního Chaldejce v jakémkoli záznamu. Většina badatelů bere ta slova jako jméno pozdějšího pisatele pro Ur, jak jej znali jeho čtenáři, sumerské město v Tell el-Muqayyar, které Leonard Woolley vykopával v letech 1922 až 1934, s jeho královskými hroby a zikkuratem; menšina, po Cyrusi Gordonovi, hledá Abrahamův Ur na severu, poblíž Cháranu, na místě zvaném Ura nebo v Urfě. Zda byl sám Nabopolassar chaldejského původu, je také sporné. O životě vyhnanců mezi nimi vypovídají nyní klínopisné tabulky z al-Jahúdu, „Judova města“."
  nl:
    - "De Chaldeeën waren stammen die zich vanaf ongeveer de negende eeuw v.Chr. vestigden in de moerassen en het rivierland van zuidelijk Babylonië, nabij het noordelijke uiteinde van de Perzische Golf; Assyrische bronnen noemen hun land Kaldu. De Bijbel gebruikt de naam in drie betekenissen: het volk, de dynastie van Nabopolassar en Nebukadnessar die Babylon van 626 tot 539 v.Chr. regeerde, en de geleerde mannen aan haar hof. Het punt op de kaart voor Chaldea staat bij Ur, hemelsbreed ongeveer 235 km ten zuidoosten van Babylon en 1035 km van Jeruzalem."
    - "Jesaja kon hen in de achtste eeuw nog nieuw noemen: “dit volk was er niet; Assur heeft het gefondeerd voor degenen, die in de wildernissen woonden”; Jobs kamelen worden door drie benden Chaldeeën weggevoerd. Vanaf 626 v.Chr., toen Nabopolassar de troon van Babylon besteeg, zijn zij de macht die een einde maakt aan Juda. Habakuk ziet God: “Ik verwek de Chaldeen, een bitter en snel volk”; “de benden der Chaldeen” teisteren Jojakim; de Chaldeeën die Jeruzalem belegeren trekken zich terug voor het leger van Farao, en Jeremia waarschuwt: “Bedriegt uw zielen niet, zeggende: De Chaldeen zullen zekerlijk van ons wegtrekken”; in 586 v.Chr. “het heir der Chaldeen jaagde den koning na, en zij achterhaalden hem in de vlakke velden van Jericho”, en zij braken de koperen pilaren van de tempel en voerden het koper naar Babylon."
    - "Ezechiël wordt geroepen “in het land der Chaldeen, bij de rivier Chebar”. In Daniël zijn Chaldeeën een klasse van wijzen naast de magiërs en sterrenkijkers, die de koning antwoorden “in het Syrisch”, dat wil zeggen in het Aramees; Belsazar is “der Chaldeen koning”; de ballingen krijgen te horen: “Gaat uit van Babel, vliedt van de Chaldeen”."
    - "Grieken namen de derde betekenis over: Herodotus noemt de Chaldeeën de priesters van Bel te Babylon, en Diodorus beschrijft hen als een kaste, net als de priesters van Egypte, die de toekomst in de sterren lazen, zodat “Chaldeeër” in het Latijn en de middeleeuwen sterrenwichelaar betekende. “Ur der Chaldeeën”, de woonplaats van Abraham, is het raadsel: duizend jaar scheiden hem van de eerste Chaldeeër in de bronnen. De meeste geleerden zien er de naam van een latere schrijver in voor Ur zoals zijn lezers het kenden, de Sumerische stad Tell el-Muqayyar, door Leonard Woolley in 1922–1934 opgegraven, met koninklijke graven en ziggoerat; een minderheid zoekt met Cyrus Gordon Abrahams Ur in het noorden, bij Haran: bij Ura of Urfa. Of Nabopolassar zelf Chaldeeër was, is ook betwist. Over de ballingen onder hen vertellen nu de tabletten van al-Yahudu, “Judastad”."
