id: who-were-the-chaldeans
question:
  en: "Who were the Chaldeans?"
  ru: "Кто такие халдеи?"
answer:
  en:
    - "The Chaldeans were tribes settled from about the ninth century BC in the marshes and river country of southern Babylonia, near the head of the Persian Gulf; Assyrian records call their land Kaldu. The Bible uses the name in three senses: the people, the dynasty of Nabopolassar and Nebuchadnezzar that ruled Babylon from 626 to 539 BC, and the learned men of its court. The map's point for Chaldea stands at Ur, about 235 km south-east of Babylon in a straight line and 1,035 km from Jerusalem."
    - "Isaiah, in the eighth century, could still call them new: “this people was not, till the Assyrian founded it for them that dwell in the wilderness”; Job's camels are carried off by three bands of Chaldeans. From 626 BC, when Nabopolassar took the throne of Babylon, they are the power that ends Judah. Habakkuk sees God raise up “the Chaldeans, that bitter and hasty nation”; “bands of the Chaldees” harry Jehoiakim; the Chaldeans besieging Jerusalem withdraw before Pharaoh's army, and Jeremiah warns, “Deceive not yourselves, saying, The Chaldeans shall surely depart from us”; in 586 BC “the army of the Chaldees pursued after the king, and overtook him in the plains of Jericho”, and they broke up the bronze pillars of the Temple and carried the bronze to Babylon."
    - "Ezekiel is called “in the land of the Chaldeans by the river Chebar”. In Daniel, Chaldeans are a class of wise men beside the magicians and astrologers, who answer the king “in Syriack”, that is, in Aramaic; Belshazzar is “the king of the Chaldeans”; the exiles are told, “Go ye forth of Babylon, flee ye from the Chaldeans”."
    - "Greek writers took the third sense: Herodotus calls the Chaldeans the priests of Bel at Babylon, and Diodorus describes them as a caste, like the priests of Egypt, who read the future in the stars, so that in Latin and all through the Middle Ages “Chaldean” meant astrologer. “Ur of the Chaldees”, the home Abraham left, is the puzzle: a thousand years divide him from the first Chaldean in any record. Most scholars take the phrase as a later writer's name for Ur as his readers knew it, the Sumerian city at Tell el-Muqayyar that Leonard Woolley dug from 1922 to 1934, with its royal tombs and ziggurat; a minority, after Cyrus Gordon, looks for Abraham's Ur in the north, near Haran, at a place called Ura or at Urfa. Whether Nabopolassar himself was of Chaldean stock is also debated. Of the exiles' life among them the cuneiform tablets of al-Yahudu, “Judah-town”, now tell."
  ru:
    - "Халдеи — племена, осевшие примерно с IX века до н. э. в болотах и речных землях южной Вавилонии, у вершины Персидского залива; ассирийские записи называют их землю Калду. Библия употребляет имя в трёх смыслах: народ, династия Набопаласара и Навуходоносора, правившая Вавилоном с 626 по 539 г. до н. э., и учёные мужи при её дворе. Точка карты для Халдеи стоит в Уре, примерно в 235 км к юго-востоку от Вавилона по прямой и в 1035 км от Иерусалима."
    - "Исаия в VIII веке ещё мог назвать их новым народом: «Этого народа прежде не было; Ассур положил ему начало из обитателей пустынь»; верблюдов Иова угоняют три отряда халдеев. С 626 г. до н. э., когда Набопаласар занял престол Вавилона, они — та сила, что кладёт конец Иудее. Аввакум видит, как Бог поднимает «Халдеев, народ жестокий и необузданный»; «полчища Халдеев» тревожат Иоакима; халдеи, осаждавшие Иерусалим, отступают перед войском фараона, и Иеремия предостерегает: «не обманывайте себя, говоря: “непременно отойдут от нас Халдеи”»; в 586 г. до н. э. «погналось войско Халдейское за царем, и настигли его на равнинах Иерихонских», а медные столбы Храма они изломали и медь увезли в Вавилон."
    - "Иезекииль призван «в земле Халдейской, при реке Ховаре». У Даниила халдеи — разряд мудрецов рядом с тайноведцами и гадателями, которые отвечают царю «по-Арамейски»; Валтасар — «царь Халдейский»; изгнанникам сказано: «Выходите из Вавилона, бегите от Халдеев»."
    - "Греческие писатели взяли третий смысл: Геродот называет халдеями жрецов Бела в Вавилоне, а Диодор описывает их как сословие, подобное египетским жрецам, читающее будущее по звёздам, так что по-латыни и всё Средневековье «халдей» значило «звездочёт». Ур Халдейский, откуда вышел Авраам, — загадка: от него до первого халдея в любой записи тысяча лет. Большинство учёных считают это выражение именем, которым позднейший автор назвал Ур так, как знали его читатели, — шумерский город на Телль-эль-Мукайяре, который Леонард Вулли раскапывал в 1922–1934 годах, с царскими гробницами и зиккуратом; меньшинство вслед за Сайрусом Гордоном ищет Ур Авраама на севере, близ Харрана, в месте под названием Ура или в Урфе. Был ли сам Набопаласар халдейского рода, тоже спорно. О жизни изгнанников среди халдеев теперь рассказывают клинописные таблички из Аль-Яхуду — «города иудеев»."
