id: where-is-mount-carmel
question:
  en: "Where is Mount Carmel?"
  ru: "Где находится гора Кармил?"
  uk: "Де гора Кармель?"
  es: "¿Dónde está el monte Carmelo?"
  pt: "Onde fica o monte Carmelo?"
  de: "Wo liegt der Berg Karmel?"
  fr: "Où se trouve le mont Carmel ?"
answer:
  en:
    - "Mount Carmel is the wooded ridge in the north of today's Israel that runs south-east from the Mediterranean at Haifa, where its headland drops into the sea, towards the plain of Jezreel; the map point stands on the ridge, about 31 km from Jezreel and 102 km from Jerusalem in a straight line."
    - "Elijah's contest with the prophets of Baal took place here: “send, and gather to me all Israel unto mount Carmel, and the prophets of Baal four hundred and fifty”, Elijah told Ahab, and after the fire fell “Elijah went up to the top of Carmel” to pray for rain. The traditional place is el-Muhraqa, “the place of burning”, at the south-eastern end of the ridge above the Kishon, the brook where the prophets of Baal were killed; a Carmelite monastery stands there. Elisha stayed on Carmel too, and the Shunammite woman went to find him there."
    - "Carmel was a holy mountain long before and after Elijah. A fourth-century BC Greek sailing guide calls it a mountain sacred to Zeus; Tacitus says that the god there was also called Carmel and had an altar but no temple or image, and that in AD 69 Vespasian sacrificed on the mountain and the priest Basilides foretold him greatness; Iamblichus writes that Pythagoras lived for a time in solitude at its sanctuary, which sailors held the holiest of mountains. The Carmelite order took its name from the hermits who lived on the mountain in the twelfth century. The name itself means garden land, and the prophets use the mountain's green as an image of plenty and its withering as an image of judgement."
  ru:
    - "Кармил — лесистая гряда на севере нынешнего Израиля, идущая от Средиземного моря у Хайфы, где её мыс обрывается в воду, на юго-восток к Изреельской долине; точка на карте стоит на гряде, примерно в 31 км от Изрееля и в 102 км от Иерусалима по прямой."
    - "Здесь было состязание Илии с пророками Ваала: «пошли и собери ко мне всего Израиля на гору Кармил, и четыреста пятьдесят пророков Вааловых», — сказал Илия Ахаву, а когда сошёл огонь, «Илия взошел на верх Кармила» молиться о дожде. Традиционное место — Эль-Мухрака, «место сожжения», на юго-восточном конце гряды над Киссоном, потоком, у которого убили пророков Ваала; там стоит монастырь кармелитов. На Кармиле бывал и Елисей, и сонамитянка отправилась искать его туда."
    - "Кармил был святой горой задолго до Илии и долго после него. Греческий перипл IV века до н. э. называет его горой, посвящённой Зевсу; Тацит пишет, что бог горы тоже звался Кармилом и имел жертвенник, но ни храма, ни изображения, а в 69 году Веспасиан принёс там жертву, и жрец Василид предсказал ему величие; Ямвлих сообщает, что Пифагор одно время жил в уединении при её святилище, а моряки считали эту гору священнее всех прочих. Орден кармелитов получил имя от отшельников, живших на горе в XII веке. Само название значит «сад, плодородная земля», и пророки берут зелень горы как образ изобилия, а её увядание — как образ суда."
  uk:
    - "Гора Кармель — залісений хребет на півночі нинішнього Ізраїлю, що йде на південний схід від Середземного моря біля Хайфи, де його мис обривається в море, до Ізреельської долини; точка мапи стоїть на хребті, приблизно за 31 км від Їзреелю і за 102 км від Єрусалиму по прямій."
    - "Тут відбулося змагання Іллі з пророками Ваала: «посилай та поскликай до мене всього Ізраїля на Кармель-гору та й тих чотириста й пятьдесять пророків Баалових», — сказав Ілля Ахавові, а коли впав вогонь, «Ілия ж вийшов на верх Кармеля» молитися про дощ. Традиційне місце — ель-Мухрака, «місце спалення», на південно-східному краю хребта над Кішоном, потоком, де було вбито пророків Ваала; там стоїть кармелітський монастир. Єлисей також перебував на Кармелі, і сунамітянка пішла шукати його там."
    - "Кармель був святою горою задовго до Іллі й після нього. Грецький лоцман IV ст. до н. е. називає його горою, священною для Зевса; Тацит каже, що бог там звався також Кармелем і мав жертовник, але не мав ні храму, ні зображення, і що 69 р. н. е. Веспасіан приніс жертву на горі, а жрець Василид провістив йому велич; Ямвліх пише, що Піфагор якийсь час жив на самоті в її святилищі, яке моряки вважали найсвятішою з гір. Орден кармелітів дістав своє ім'я від відлюдників, які жили на горі в XII ст. Сама назва означає садову землю, і пророки вживають зелень гори як образ достатку, а її в'янення як образ суду."
  es:
    - "El monte Carmelo es la cresta boscosa del norte del Israel actual que corre hacia el sureste desde el Mediterráneo, en Haifa, donde su promontorio cae al mar, hacia la llanura de Jezreel; el punto del mapa está sobre la cresta, a unos 31 km de Jezreel y 102 km de Jerusalén en línea recta."
    - "Aquí tuvo lugar el desafío de Elías con los profetas de Baal: «Envía pues ahora y júntame á todo Israel en el monte de Carmelo, y los cuatrocientos y cincuenta profetas de Baal», dijo Elías a Acab, y tras caer el fuego «Elías subió á la cumbre del Carmelo» para orar por lluvia. El lugar tradicional es el-Muhraqa, «el lugar de la quema», en el extremo sureste de la cresta, sobre el Cisón, el arroyo donde fueron muertos los profetas de Baal; allí se alza un monasterio carmelita. Eliseo también residió en el Carmelo, y la sunamita fue a buscarlo allí."
    - "El Carmelo fue un monte santo mucho antes y después de Elías. Una guía griega de navegación del siglo IV a. C. lo llama un monte consagrado a Zeus; Tácito dice que el dios de allí se llamaba también Carmel y tenía un altar pero ni templo ni imagen, y que en el 69 d. C. Vespasiano sacrificó en el monte y el sacerdote Basílides le predijo grandeza; Jámblico escribe que Pitágoras vivió un tiempo en soledad en su santuario, que los marineros tenían por el más santo de los montes. La orden carmelita tomó su nombre de los ermitaños que vivieron en el monte en el siglo XII. El nombre mismo significa tierra de jardín, y los profetas usan el verdor del monte como imagen de abundancia y su marchitarse como imagen de juicio."
  pt:
    - "O monte Carmelo é a crista arborizada do norte do Israel de hoje que corre para sudeste a partir do Mediterrâneo, em Haifa, onde seu promontório mergulha no mar, rumo à planície de Jezreel; o ponto do mapa está na crista, a cerca de 31 km de Jezreel e 102 km de Jerusalém em linha reta."
    - "A disputa de Elias com os profetas de Baal ocorreu aqui: “mande reunir todo o Israel a mim no monte Carmelo, e os quatrocentos e cinquenta profetas de Baal”, disse Elias a Acabe, e depois que o fogo caiu, “Elias subiu ao topo do Carmelo” para orar por chuva. O lugar tradicional é el-Muhraqa, “o lugar da queima”, na extremidade sudeste da crista, acima do Quisom, o riacho onde os profetas de Baal foram mortos; ali se ergue um mosteiro carmelita. Eliseu também ficou no Carmelo, e a sunamita foi procurá-lo ali."
    - "O Carmelo era monte sagrado muito antes e depois de Elias. Um roteiro náutico grego do século IV a.C. o chama de monte sagrado de Zeus; Tácito diz que o deus ali se chamava também Carmelo e tinha um altar, mas nenhum templo ou imagem, e que em 69 d.C. Vespasiano sacrificou no monte e o sacerdote Basílides lhe predisse grandeza; Jâmblico escreve que Pitágoras viveu algum tempo em solidão no seu santuário, que os marinheiros tinham pelo mais santo dos montes. A ordem carmelita tomou o nome dos eremitas que viveram no monte no século XII. O próprio nome significa terra de jardins, e os profetas usam o verde do monte como imagem de abundância e seu murchar como imagem de juízo."
  de:
    - "Der Karmel ist der bewaldete Höhenzug im Norden des heutigen Israel, der vom Mittelmeer bei Haifa, wo sein Vorgebirge ins Meer abfällt, nach Südosten zur Ebene Jesreel verläuft; der Kartenpunkt liegt auf dem Rücken, in der Luftlinie etwa 31 km von Jesreel und 102 km von Jerusalem."
    - "Elias Wettstreit mit den Propheten Baals fand hier statt: „so sende nun hin und versammle zu mir das ganze Israel auf den Berg Karmel und die vierhundertfünfzig Propheten Baals“, sagte Elia zu Ahab, und nachdem das Feuer gefallen war, „ging Elia auf des Karmels Spitze“, um um Regen zu beten. Der überlieferte Ort ist el-Muhraka, „der Ort des Brennens“, am südöstlichen Ende des Höhenzugs über dem Kischon, dem Bach, an dem die Propheten Baals erschlagen wurden; dort steht ein Karmelitenkloster. Auch Elisa hielt sich auf dem Karmel auf, und die Sunamiterin ging dorthin, um ihn zu finden."
    - "Der Karmel war lange vor und nach Elia ein heiliger Berg. Ein griechisches Segelhandbuch des 4. Jahrhunderts v. Chr. nennt ihn einen dem Zeus heiligen Berg; Tacitus sagt, der Gott dort werde auch Karmel genannt und habe einen Altar, aber keinen Tempel und kein Bild, und Vespasian habe 69 n. Chr. auf dem Berg geopfert, und der Priester Basilides habe ihm Größe vorausgesagt; Iamblichos schreibt, Pythagoras habe eine Zeit in Einsamkeit an seinem Heiligtum gelebt, das die Seeleute für den heiligsten der Berge hielten. Der Karmeliterorden hat seinen Namen von den Einsiedlern, die im 12. Jahrhundert auf dem Berg lebten. Der Name selbst bedeutet Gartenland, und die Propheten gebrauchen das Grün des Berges als Bild der Fülle und sein Verdorren als Bild des Gerichts."
  fr:
    - "Le mont Carmel est la crête boisée du nord de l’Israël actuel qui court vers le sud-est depuis la Méditerranée, à Haïfa, où son promontoire plonge dans la mer, en direction de la plaine de Jizreel ; le point de la carte est sur la crête, à environ 31 km de Jizreel et 102 km de Jérusalem en ligne droite."
    - "Le combat d’Élie contre les prophètes de Baal eut lieu ici : « Fais maintenant rassembler tout Israël auprès de moi, à la montagne du Carmel, et aussi les quatre cent cinquante prophètes de Baal », dit Élie à Achab, et après la chute du feu « Élie monta au sommet du Carmel » pour prier pour la pluie. Le lieu traditionnel est el-Muhraqa, « le lieu de l’embrasement », à l’extrémité sud-est de la crête, au-dessus du Kison, le torrent où les prophètes de Baal furent égorgés ; un monastère carme s’y trouve. Élisée séjourna aussi au Carmel, et la Sunamite alla l’y chercher."
    - "Le Carmel fut une montagne sainte bien avant et bien après Élie. Un périple grec du IVe siècle av. J.-C. l’appelle montagne consacrée à Zeus ; Tacite dit que le dieu qu’on y adorait s’appelait aussi Carmel et avait un autel mais ni temple ni image, qu’en 69 apr. J.-C. Vespasien y sacrifia et que le prêtre Basilidès lui prédit la grandeur ; Jamblique écrit que Pythagore vécut quelque temps dans la solitude à son sanctuaire, que les marins tenaient pour la plus sainte des montagnes. L’ordre des carmes tire son nom des ermites qui vécurent sur la montagne au XIIe siècle. Le nom lui-même signifie terre-jardin, et les prophètes se servent du vert de la montagne comme image d’abondance et de son dessèchement comme image de jugement."
