# Draft question. The usual date (4 BC) and the minority date (1 BC) are both given; the map keeps c. 4 BC.
id: when-did-herod-the-great-die
question:
  en: "When did Herod the Great die?"
  ru: "Когда умер Ирод Великий?"
  uk: "Коли помер Ірод Великий?"
  es: "¿Cuándo murió Herodes el Grande?"
  pt: "Quando morreu Herodes, o Grande?"
  de: "Wann starb Herodes der Große?"
  fr: "Quand Hérode le Grand est-il mort ?"
  pl: "Kiedy zmarł Herod Wielki?"
  it: "Quando morì Erode il Grande?"
  nl: "Wanneer stierf Herodes de Grote?"
  cs: "Kdy zemřel Herodes Veliký?"
  sv: "När dog Herodes den store?"
  nb: "Når døde Herodes den store?"
  tl: "Kailan namatay si Herodes na Dakila?"
  da: "Hvornår døde Herodes den Store?"
answer:
  en:
    - "In the spring of 4 BC, on the usual dating: Josephus says Herod died at his winter palace at Jericho after a lunar eclipse and shortly before Passover, about seventy years old, in the thirty-fourth year since he took Jerusalem and the thirty-seventh since Rome named him king. A minority of scholars put his death in 1 BC. The map stands at the Jericho of the Gospels, where his palaces lay, about 21 km from Jerusalem in a straight line, in c. 4 BC."
    - "Matthew's story turns on the date: Joseph took the child to Egypt and “was there until the death of Herod”; then “when Herod was dead, behold, an angel of the Lord appeareth in a dream to Joseph in Egypt”, and hearing “that Archelaus did reign in Judaea in the room of his father Herod” he settled in Galilee instead. Josephus tells the end in detail: Herod had the teachers who pulled down the golden eagle from the Temple gate burned alive, and that night the moon was eclipsed; he bathed in the warm springs of Callirrhoe beyond the Jordan, came back to Jericho, changed his will, had his son Antipater executed five days before his own death, and was carried in state to the fortress of Herodium, which he had built for his tomb. In 2007 Ehud Netzer found on the slope of Herodium a mausoleum and a smashed sarcophagus that he identified as Herod's, a claim some have questioned."
    - "The eclipse is the hinge. One on 13 March 4 BC was partial and fell a month before Passover, which suits the usual date; Filmer in 1966 and Steinmann in 2009 preferred the total eclipse of 10 January 1 BC, arguing that Josephus's months of events hardly fit between March and April. Most historians keep 4 BC, because Herod's sons counted their reigns from it: Archelaus was deposed in his tenth year in AD 6, Philip died in the twentieth year of Tiberius after thirty-seven years, and the coins of Antipas run to his forty-third year, AD 39. On the usual date Jesus, born “in the days of Herod the king”, was born about 6–4 BC, since Herod had the children of Bethlehem killed “from two years old and under”; on the other, in 3–2 BC."
  ru:
    - "Весной 4 г. до н. э. по обычной датировке: Иосиф Флавий сообщает, что Ирод умер в своём зимнем дворце в Иерихоне после лунного затмения и незадолго до Пасхи, лет семидесяти, на тридцать четвёртом году после взятия Иерусалима и на тридцать седьмом с тех пор, как Рим назвал его царём. Меньшинство учёных относит его смерть к 1 г. до н. э. Карта стоит на евангельском Иерихоне, где лежали его дворцы, примерно в 21 км от Иерусалима по прямой, в условном 4 г. до н. э."
    - "Рассказ Матфея держится на этой дате: Иосиф унёс Младенца в Египет и «там был до смерти Ирода»; затем «по смерти же Ирода, — се, Ангел Господень во сне является Иосифу в Египте», а услышав, «что Архелай царствует в Иудее вместо Ирода, отца своего», он поселился в Галилее. Иосиф Флавий рассказывает конец подробно: больной и измученный, Ирод велел сжечь заживо учителей, сорвавших золотого орла с ворот Храма, и в ту ночь случилось лунное затмение; он лечился в тёплых источниках Каллирои за Иорданом, вернулся в Иерихон, переменил завещание, за пять дней до собственной смерти казнил сына Антипатра и был с царской пышностью перенесён в крепость Иродион, которую построил себе для гробницы. В 2007 году Эхуд Нецер нашёл на склоне Иродиона мавзолей и разбитый саркофаг, которые счёл Иродовыми; некоторые эту догадку оспаривают."
    - "Затмение — ключ ко всему. Затмение 13 марта 4 г. до н. э. было частным и случилось за месяц до Пасхи, что подходит к обычной дате; Филмер в 1966 году и Стайнманн в 2009-м предпочли полное затмение 10 января 1 г. до н. э., доказывая, что месяцы событий у Иосифа едва умещаются между мартом и апрелем. Большинство историков держатся 4 г., потому что сыновья Ирода считали своё правление от него: Архелай был смещён на десятом году, в 6 г. н. э., Филипп умер в двадцатый год Тиверия после тридцати семи лет правления, а монеты Антипы доходят до его сорок третьего года, 39 г. н. э. По обычной дате Иисус, родившийся «во дни царя Ирода», родился около 6–4 гг. до н. э., ведь Ирод велел избить младенцев в Вифлееме «от двух лет и ниже»; по другой — в 3–2 гг. до н. э."
  uk:
    - "Навесні 4 р. до н. е. за звичною датою: Йосиф Флавій каже, що Ірод помер у своєму зимовому палаці в Єрихоні після місячного затемнення і незадовго до Пасхи, приблизно сімдесяти років, на тридцять четвертому році від узяття ним Єрусалиму й тридцять сьомому від того, як Рим назвав його царем. Меншість учених відносить його смерть до 1 р. до н. е. Мапа стоїть в Єрихоні Євангелій, де лежали його палаци, приблизно за 21 км від Єрусалиму по прямій, близько 4 р. до н. е."
    - "Розповідь Матвія залежить від дати: Йосип відвів дитя в Єгипет, і Ісус «пробував там аж до смерти Іродової»; потім «як же вмер Ірод, ось являєть ся ангел Господень уві снї Йосифу в Єгиптї», а почувши, що «Архелай царює в Юдеї замість батька свого Ірода», Йосип натомість оселився в Галілеї. Йосиф Флавій докладно розповідає про кінець: Ірод звелів спалити живцем учителів, що зірвали золотого орла з брами Храму, і тієї ночі місяць затьмарився; він купався в теплих джерелах Каллірої за Йорданом, повернувся до Єрихону, змінив заповіт, звелів стратити свого сина Антипатра за п'ять днів до власної смерті й був урочисто перевезений до фортеці Іродіон, яку звів для своєї гробниці. 2007 року Егуд Нецер знайшов на схилі Іродіона мавзолей і розбитий саркофаг, які він визнав за Іродові, — твердження, яке дехто піддавав сумніву."
    - "Затемнення — вісь питання. Затемнення 13 березня 4 р. до н. е. було частковим і припало на місяць до Пасхи, що відповідає звичній даті; Філмер 1966 р. і Штайнман 2009 р. віддали перевагу повному затемненню 10 січня 1 р. до н. е., стверджуючи, що місяці подій у Йосифа Флавія навряд чи вміщаються між березнем і квітнем. Більшість істориків лишає 4 р. до н. е., бо сини Ірода рахували свої правління від нього: Архелая було скинуто на десятому році 6 р. н. е., Пилип помер на двадцятому році Тиверія після тридцяти семи років, а монети Антипи тягнуться до його сорок третього року, 39 р. н. е. За звичною датою Ісус, народжений «за царя Ірода», народився близько 6–4 рр. до н. е., бо Ірод звелів убити дітей Вифлеєму «од двох років і меньше»; за іншою — у 3–2 рр. до н. е."
  es:
    - "En la primavera del 4 a. C., según la datación habitual: Josefo dice que Herodes murió en su palacio de invierno en Jericó después de un eclipse lunar y poco antes de la Pascua, con unos setenta años, en el año treinta y cuatro desde que tomó Jerusalén y el treinta y siete desde que Roma lo nombró rey. Una minoría de estudiosos sitúa su muerte en el 1 a. C. El mapa se sitúa en la Jericó de los Evangelios, donde estaban sus palacios, a unos 21 km de Jerusalén en línea recta, hacia el 4 a. C."
    - "El relato de Mateo gira sobre la fecha: José llevó al niño a Egipto, y «estuvo allá hasta la muerte de Herodes»; luego, «muerto Herodes, he aquí el ángel del Señor aparece en sueños á José en Egipto», y al oír que «Archelao reinaba en Judea en lugar de Herodes su padre» se estableció en Galilea. Josefo cuenta el final con detalle: Herodes hizo quemar vivos a los maestros que derribaron el águila de oro de la puerta del Templo, y esa noche la luna se eclipsó; se bañó en las aguas termales de Calírroe, más allá del Jordán, volvió a Jericó, cambió su testamento, hizo ejecutar a su hijo Antípatro cinco días antes de morir y fue llevado con pompa a la fortaleza de Herodión, que había construido para su tumba. En 2007 Ehud Netzer halló en la ladera de Herodión un mausoleo y un sarcófago destrozado que identificó como los de Herodes, afirmación que algunos dudan."
    - "El eclipse es el punto clave. Uno del 13 de marzo del 4 a. C. fue parcial y cayó un mes antes de la Pascua, lo que concuerda con la fecha habitual; Filmer en 1966 y Steinmann en 2009 prefirieron el eclipse total del 10 de enero del 1 a. C., argumentando que los meses de acontecimientos de Josefo apenas caben entre marzo y abril. La mayoría de los historiadores mantiene el 4 a. C., porque los hijos de Herodes contaron sus reinados a partir de entonces: Arquelao fue depuesto en su décimo año, en el 6 d. C., Felipe murió en el año veinte de Tiberio tras treinta y siete años, y las monedas de Antipas llegan a su año cuarenta y tres, el 39 d. C. Según la fecha habitual, Jesús, nacido «en días del rey Herodes», nació hacia el 6–4 a. C., pues Herodes mandó matar a los niños de Belén «de edad de dos años abajo»; según la otra, en el 3–2 a. C."
  pt:
    - "Na primavera de 4 a.C., pela datação usual: Josefo diz que Herodes morreu em seu palácio de inverno em Jericó, depois de um eclipse lunar e pouco antes da Páscoa, com cerca de setenta anos, no trigésimo quarto ano desde que tomou Jerusalém e no trigésimo sétimo desde que Roma o nomeou rei. Uma minoria de estudiosos situa sua morte em 1 a.C. O mapa está na Jericó dos Evangelhos, onde ficavam seus palácios, a cerca de 21 km de Jerusalém em linha reta, em c. 4 a.C."
    - "A narrativa de Mateus depende da data: José levou o menino ao Egito e “lá ficou até a morte de Herodes”; então, “tendo Herodes morrido, eis que um anjo do Senhor apareceu em um sonho a José, no Egito”, e ao saber que “Arquelau reinava na Judeia em lugar de seu pai, Herodes”, ele se fixou na Galileia. Josefo conta o fim em detalhe: Herodes mandou queimar vivos os mestres que derrubaram a águia de ouro da porta do Templo, e naquela noite a lua se eclipsou; banhou-se nas águas quentes de Calírroe, além do Jordão, voltou a Jericó, mudou o testamento, mandou executar o filho Antípatro cinco dias antes da própria morte e foi levado em cortejo à fortaleza de Herodium, que construíra para seu túmulo. Em 2007 Ehud Netzer achou na encosta de Herodium um mausoléu e um sarcófago despedaçado que identificou como de Herodes, afirmação que alguns contestam."
    - "O eclipse é o eixo. Um de 13 de março de 4 a.C. foi parcial e ocorreu um mês antes da Páscoa, o que combina com a data usual; Filmer, em 1966, e Steinmann, em 2009, preferiram o eclipse total de 10 de janeiro de 1 a.C., alegando que os meses de acontecimentos de Josefo mal cabem entre março e abril. A maioria dos historiadores mantém 4 a.C., porque os filhos de Herodes contaram seus reinados a partir daí: Arquelau foi deposto no décimo ano, em 6 d.C., Filipe morreu no vigésimo ano de Tibério depois de trinta e sete anos, e as moedas de Antipas vão até o quadragésimo terceiro ano, 39 d.C. Pela data usual Jesus, nascido “nos dias do rei Herodes”, nasceu por volta de 6–4 a.C., pois Herodes mandou matar os meninos de Belém “de dois anos para baixo”; pela outra, em 3–2 a.C."
  de:
    - "Im Frühjahr 4 v. Chr. nach der üblichen Datierung: Josephus sagt, Herodes sei in seinem Winterpalast in Jericho nach einer Mondfinsternis und kurz vor dem Passafest gestorben, etwa siebzig Jahre alt, im vierunddreißigsten Jahr seit der Einnahme Jerusalems und im siebenunddreißigsten seit seiner Ernennung zum König durch Rom. Eine Minderheit der Gelehrten setzt seinen Tod auf 1 v. Chr. Die Karte steht um 4 v. Chr. beim Jericho der Evangelien, wo seine Paläste lagen, etwa 21 km Luftlinie von Jerusalem."
    - "Bei Matthäus hängt es am Datum: Josef brachte das Kind nach Ägypten und „blieb allda bis nach dem Tod des Herodes“; dann: „Da aber Herodes gestorben war, siehe, da erschien der Engel des HERRN dem Joseph im Traum in Ägyptenland“, und als er hörte, „daß Archelaus im jüdischen Lande König war anstatt seines Vaters Herodes“, zog er stattdessen nach Galiläa. Josephus erzählt das Ende: Herodes ließ die Lehrer, die den goldenen Adler vom Tempeltor rissen, lebendig verbrennen, und in jener Nacht war Mondfinsternis; er badete in den Quellen von Kallirrhoë jenseits des Jordan, kehrte nach Jericho zurück, änderte sein Testament, ließ Antipater fünf Tage vor dem eigenen Tod hinrichten und wurde zur Festung Herodeion getragen, die er als Grab erbaut hatte. 2007 fand Ehud Netzer am Hang des Herodeion ein Mausoleum und einen zertrümmerten Sarkophag, die er Herodes zuschrieb – was manche bezweifeln."
    - "Die Finsternis ist der Angelpunkt. Eine am 13. März 4 v. Chr. war partiell und fiel einen Monat vor das Passafest, was zur üblichen Datierung passt; Filmer 1966 und Steinmann 2009 zogen die totale Finsternis vom 10. Januar 1 v. Chr. vor, da die Ereignisse bei Josephus kaum zwischen März und April passten. Die meisten Historiker bleiben bei 4 v. Chr., weil die Söhne des Herodes ihre Regierungen davon zählten: Archelaos wurde im zehnten Jahr 6 n. Chr. abgesetzt, Philippus starb im zwanzigsten Jahr des Tiberius nach siebenunddreißig Jahren, und die Münzen des Antipas reichen bis in sein dreiundvierzigstes Jahr, 39 n. Chr. Nach dem üblichen Datum wurde Jesus, geboren „zur Zeit des Königs Herodes“, etwa 6–4 v. Chr. geboren, da Herodes die Kinder von Bethlehem töten ließ, „die da zweijährig und darunter waren“; nach dem anderen 3–2 v. Chr."
  fr:
    - "Au printemps 4 av. J.-C. selon la datation habituelle : Josèphe dit qu’Hérode mourut dans son palais d’hiver de Jéricho après une éclipse de lune et peu avant la Pâque, âgé d’environ soixante-dix ans, la trente-quatrième année depuis qu’il avait pris Jérusalem et la trente-septième depuis que Rome l’avait nommé roi. Une minorité de savants placent sa mort en 1 av. J.-C. La carte se place au Jéricho des Évangiles, où se trouvaient ses palais, à environ 21 km de Jérusalem en ligne droite, vers 4 av. J.-C."
    - "Le récit de Matthieu dépend de la date : Joseph emmena l’enfant en Égypte ; « Il y resta jusqu’à la mort d’Hérode » ; puis « Quand Hérode fut mort, voici, un ange du Seigneur apparut en songe à Joseph, en Égypte », et, apprenant qu’« Archélaüs régnait sur la Judée à la place d’Hérode, son père », il s’établit plutôt en Galilée. Josèphe détaille la fin : Hérode fit brûler vifs les maîtres qui avaient abattu l’aigle d’or de la porte du Temple, et cette nuit-là la lune s’éclipsa ; il se baigna aux eaux chaudes de Callirrhoé au-delà du Jourdain, revint à Jéricho, changea son testament, fit exécuter son fils Antipater cinq jours avant sa propre mort et fut porté en cortège à l’Hérodion, forteresse bâtie pour son tombeau. En 2007, Éhud Netzer trouva sur le flanc de l’Hérodion un mausolée et un sarcophage brisé qu’il identifia comme ceux d’Hérode, ce que certains contestent."
    - "L’éclipse est le pivot. Celle du 13 mars 4 av. J.-C. fut partielle et eut lieu un mois avant la Pâque, ce qui convient à la date habituelle ; Filmer en 1966 et Steinmann en 2009 ont préféré l’éclipse totale du 10 janvier 1 av. J.-C., arguant que les mois d’événements rapportés par Josèphe tiennent mal entre mars et avril. La plupart des historiens gardent 4 av. J.-C., parce que les fils d’Hérode comptaient leurs règnes à partir de cette date : Archélaüs fut déposé dans sa dixième année en 6 apr. J.-C., Philippe mourut la vingtième année de Tibère après trente-sept ans, et les monnaies d’Antipas vont jusqu’à sa quarante-troisième année, 39 apr. J.-C. Selon la date habituelle, Jésus, né « au temps du roi Hérode », naquit vers 6–4 av. J.-C., puisqu’Hérode fit tuer les enfants de Bethléem « de deux ans et au-dessous » ; selon l’autre, en 3–2 av. J.-C."
  pl:
    - "Wiosną 4 p.n.e. według zwykłego datowania: Józef Flawiusz mówi, że Herod zmarł w swoim zimowym pałacu w Jerychu po zaćmieniu Księżyca i krótko przed Paschą, mając około siedemdziesięciu lat, w trzydziestym czwartym roku od zdobycia Jerozolimy i trzydziestym siódmym od mianowania go królem przez Rzym. Mniejszość uczonych umieszcza jego śmierć w 1 p.n.e. Mapa stoi w Jerychu z Ewangelii, gdzie leżały jego pałace, około 21 km od Jerozolimy w linii prostej, około 4 p.n.e."
    - "Opowieść Mateusza zależy od tej daty: Józef zabrał dziecko do Egiptu i „był tam aż do śmierci Herodowej”; potem „A gdy umarł Herod, oto Anioł Pański ukazał się we śnie Józefowi w Egipcie”, a usłyszawszy, „iż Archelaus królował w Judzkiej ziemi na miejscu Heroda, ojca swego”, osiadł zamiast tego w Galilei. Józef Flawiusz opowiada koniec szczegółowo: Herod kazał spalić żywcem nauczycieli, którzy zrzucili złotego orła z bramy Świątyni, i tej nocy zaćmił się księżyc; kąpał się w ciepłych źródłach Kallirhoe za Jordanem, wrócił do Jerycha, zmienił testament, kazał stracić syna Antypatra pięć dni przed własną śmiercią i został uroczyście przewieziony do twierdzy Herodion, którą zbudował na swój grobowiec. W 2007 Ehud Netzer znalazł na stoku Herodionu mauzoleum i rozbity sarkofag, które zidentyfikował jako Heroda, co niektórzy zakwestionowali."
    - "Zaćmienie jest zawiasem. To z 13 marca 4 p.n.e. było częściowe i przypadało na miesiąc przed Paschą, co pasuje do zwykłej daty; Filmer w 1966 i Steinmann w 2009 woleli całkowite zaćmienie z 10 stycznia 1 p.n.e., argumentując, że miesiące wydarzeń u Flawiusza ledwo mieszczą się między marcem a kwietniem. Większość historyków trzyma się 4 p.n.e., ponieważ synowie Heroda liczyli od niej swoje panowania: Archelaos został złożony z urzędu w dziesiątym roku, w 6 n.e., Filip zmarł w dwudziestym roku Tyberiusza po trzydziestu siedmiu latach, a monety Antypasa sięgają jego czterdziestego trzeciego roku, 39 n.e. Według zwykłej daty Jezus, urodzony „za dnia Heroda króla”, urodził się około 6–4 p.n.e., ponieważ Herod kazał zabić dzieci z Betlejem „od dwóch lat i niżej”; według drugiej — w 3–2 p.n.e."
  it:
    - "Nella primavera del 4 a.C., secondo la datazione abituale: Giuseppe Flavio dice che Erode morì nel suo palazzo invernale di Gerico dopo un’eclissi di luna e poco prima della Pasqua, a circa settant’anni, nel trentaquattresimo anno da quando prese Gerusalemme e nel trentasettesimo da quando Roma lo nominò re. Una minoranza di studiosi pone la sua morte nell’1 a.C. La mappa si trova nella Gerico dei Vangeli, dove sorgevano i suoi palazzi, a circa 21 km da Gerusalemme in linea retta, intorno al 4 a.C."
    - "Il racconto di Matteo dipende dalla data: Giuseppe portò il bambino in Egitto e «ivi stette fino alla morte di Erode»; poi «dopo che Erode fu morto, ecco un angelo del Signore apparve in sogno a Giuseppe in Egitto», e, udito «che in Giudea regnava Archelao invece d’Erode, suo padre», si stabilì in Galilea. Giuseppe Flavio ne racconta la fine nei particolari: Erode fece bruciare vivi i maestri che avevano abbattuto l’aquila d’oro dalla porta del Tempio, e quella notte la luna fu eclissata; si bagnò nelle sorgenti calde di Calliroe oltre il Giordano, tornò a Gerico, cambiò il testamento, fece giustiziare il figlio Antipatro cinque giorni prima di morire e fu portato in corteo alla fortezza dell’Erodion, costruita per la sua tomba. Nel 2007 Ehud Netzer trovò sul pendio dell’Erodion un mausoleo e un sarcofago frantumato, che identificò come di Erode; alcuni lo contestano."
    - "L’eclissi è il perno. Quella del 13 marzo del 4 a.C. fu parziale e cadde un mese prima della Pasqua, il che si accorda con la data abituale; Filmer nel 1966 e Steinmann nel 2009 preferirono l’eclissi totale del 10 gennaio dell’1 a.C., sostenendo che i mesi di eventi di Giuseppe Flavio si adattano a stento tra marzo e aprile. La maggior parte degli storici mantiene il 4 a.C., perché i figli di Erode contarono i loro regni da quella data: Archelao fu deposto nel suo decimo anno nel 6 d.C., Filippo morì nel ventesimo anno di Tiberio dopo trentasette anni, e le monete di Antipa arrivano al suo quarantatreesimo anno, il 39 d.C. Secondo la data abituale Gesù, nato «ai dì del re Erode», nacque intorno al 6–4 a.C., poiché Erode fece uccidere i bambini di Betlemme «dall’età di due anni in giù»; secondo l’altra, nel 3–2 a.C."
  nl:
    - "In het voorjaar van 4 v.Chr. volgens de gebruikelijke datering: Josephus zegt dat Herodes stierf in zijn winterpaleis bij Jericho na een maansverduistering en kort voor het Pesachfeest, ongeveer zeventig jaar oud, in het vierendertigste jaar sinds hij Jeruzalem had ingenomen en het zevenendertigste sinds Rome hem koning had genoemd. Een minderheid van de geleerden plaatst zijn dood in 1 v.Chr. De kaart staat bij het Jericho van de Evangeliën, waar zijn paleizen lagen, hemelsbreed ongeveer 21 km van Jeruzalem, in ca. 4 v.Chr."
    - "Mattheüs’ verhaal draait om de datum: Jozef bracht het kind naar Egypte en “was aldaar tot den dood van Herodes”; daarna “toen Herodes nu gestorven was, ziet, de engel des Heeren verschijnt Jozef in den droom, in Egypte”, en toen hij hoorde “dat Archelaus in Judea koning was, in de plaats van zijn vader Herodes”, vestigde hij zich in Galilea. Josephus vertelt het einde uitvoerig: Herodes liet de leraren die de gouden adelaar van de tempelpoort hadden gehaald levend verbranden, en die nacht werd de maan verduisterd; hij baadde in de warme bronnen van Kallirhoë, keerde naar Jericho terug, veranderde zijn testament, liet zijn zoon Antipater vijf dagen vóór zijn dood terechtstellen en werd in staatsie naar Herodion gebracht, dat hij voor zijn graf had gebouwd. In 2007 vond Ehud Netzer daar een mausoleum en een verbrijzelde sarcofaag, volgens hem van Herodes, wat sommigen betwijfelen."
    - "De verduistering is het scharnierpunt. Die van 13 maart 4 v.Chr. was gedeeltelijk en viel een maand vóór Pesach, wat bij de gebruikelijke datum past; Filmer (1966) en Steinmann (2009) verkozen de totale verduistering van 10 januari 1 v.Chr., omdat de maanden aan gebeurtenissen bij Josephus nauwelijks tussen maart en april passen. De meeste historici houden 4 v.Chr. aan, omdat Herodes’ zonen hun regering daarvandaan telden: Archelaüs werd in zijn tiende jaar, 6 n.Chr., afgezet, Filippus stierf in het twintigste jaar van Tiberius na zevenendertig jaar, en Antipas’ munten lopen tot zijn drieënveertigste jaar, 39 n.Chr. Volgens de gebruikelijke datum werd Jezus, geboren “in de dagen van den koning Herodes”, omstreeks 6–4 v.Chr. geboren, daar Herodes de kinderen van Bethlehem liet doden “van twee jaren oud en daaronder”; volgens de andere in 3–2 v.Chr."
  cs:
    - "Na jaře roku 4 př. n. l. podle obvyklého datování: Josephus Flavius praví, že Herodes zemřel ve svém zimním paláci v Jerichu po zatmění měsíce a krátce před Pesachem, ve věku asi sedmdesáti let, ve čtyřiatřicátém roce od dobytí Jeruzaléma a třicátém sedmém od jmenování králem Římem. Menšina badatelů klade jeho smrt do roku 1 př. n. l. Mapa stojí v Jerichu evangelií, kde měl paláce, asi 21 km od Jeruzaléma vzdušnou čarou, v roce asi 4 př. n. l."
    - "Matoušův příběh závisí na datu: Josef vzal dítě do Egypta a „byl tam až do smrti Herodesovy“; „Když pak umřel Herodes, aj, anděl Páně ukázal se Jozefovi ve snách v Egyptě“, a když uslyšel, „že by Archelaus kraloval v Judstvu místo Herodesa otce svého“, usadil se místo toho v Galileji. Josephus Flavius vypráví konec podrobně: Herodes nechal zaživa upálit učitele, kteří strhli zlatého orla z chrámové brány, a té noci došlo k zatmění měsíce; koupal se v teplých pramenech Kallirhoe za Jordánem, vrátil se do Jericha, změnil závěť, nechal popravit syna Antipatra pět dní před vlastní smrtí a byl slavnostně převezen do pevnosti Herodeion, kterou si postavil jako hrob. Roku 2007 Ehud Netzer nalezl na svahu Herodeia mauzoleum a rozbitý sarkofág, v nichž poznal Herodovy, což někteří zpochybnili."
    - "Zatmění je kloubem věci. To z 13. března 4 př. n. l. bylo částečné a připadlo měsíc před Pesachem, což odpovídá obvyklému datu; Filmer roku 1966 a Steinmann roku 2009 dali přednost úplnému zatmění z 10. ledna 1 př. n. l. s tím, že Josephovy měsíce událostí sotva zapadají mezi březen a duben. Většina historiků ponechává rok 4 př. n. l., protože od něj Herodovi synové počítali své vlády: Archelaos byl sesazen roku 6 n. l. v desátém roce vlády, Filip zemřel ve dvacátém roce Tiberiově po třiceti sedmi letech a mince Antipovy sahají do jeho čtyřicátého třetího roku, 39 n. l. Při obvyklém datu se Ježíš, narozený „za dnů Herodesa krále“, narodil asi 6–4 př. n. l., neboť Herodes dal zabít děti v Betlémě „od dvouletých a níže“; při druhém ve 3–2 př. n. l."
  sv:
    - "Våren 4 f.Kr., enligt den vanliga dateringen: Josefus säger att Herodes dog i sitt vinterpalats i Jeriko efter en månförmörkelse och kort före påsk, omkring sjuttio år gammal, i det trettiofjärde året sedan han intog Jerusalem och det trettiosjunde sedan Rom utsett honom till kung. En minoritet av forskarna förlägger hans död till 1 f.Kr. Kartan står vid evangeliernas Jeriko, där hans palats låg, omkring 21 km från Jerusalem fågelvägen, omkring 4 f.Kr."
    - "Matteus berättelse hänger på dateringen: Josef förde barnet till Egypten och ”blev kvar intill Herodes’ död”; sedan ”när Herodes var död, se, då visade sig i drömmen en Herrens ängel för Josef, i Egypten”, och när han hörde ”att Arkelaus regerade över Judeen efter sin fader Herodes” bosatte han sig i stället i Galileen. Josefus berättar slutet i detalj: Herodes lät bränna levande de lärare som rev ned den gyllene örnen från tempelporten, och den natten var månen förmörkad; han badade i de varma källorna i Kallirhoe bortom Jordan, återvände till Jeriko, ändrade sitt testamente, lät avrätta sin son Antipater fem dagar före sin död och bars i procession till fästningen Herodion, byggd till hans grav. År 2007 fann Ehud Netzer på sluttningen av Herodion ett mausoleum och en sönderslagen sarkofag som han identifierade som Herodes', ett påstående som somliga ifrågasatt."
    - "Förmörkelsen är vändpunkten. En den 13 mars 4 f.Kr. var partiell och inföll en månad före påsk, vilket passar den vanliga dateringen; Filmer 1966 och Steinmann 2009 föredrog den totala förmörkelsen den 10 januari 1 f.Kr. och hävdade att de händelser som Josefus redogör för, och som sträcker sig över månader, knappast ryms mellan mars och april. De flesta historiker behåller 4 f.Kr., eftersom Herodes söner räknade sina regeringar från det: Archelaos avsattes i sitt tionde år, år 6 e.Kr., Filippos dog i Tiberius tjugonde år efter trettiosju år, och Antipas mynt går fram till hans fyrtiotredje år, 39 e.Kr. Enligt den vanliga dateringen föddes Jesus ”på konung Herodes’ tid” omkring 6–4 f.Kr., eftersom Herodes lät döda barnen i Betlehem, ”som voro två år gamla och därunder”; enligt den andra, 3–2 f.Kr."
  nb:
    - "Våren 4 f.Kr., etter den vanlige dateringen: Josefus sier at Herodes døde i vinterpalasset sitt i Jeriko etter en måneformørkelse og kort før påske, omtrent sytti år gammel, i det trettifjerde året siden han inntok Jerusalem og det trettisjuende siden Roma gjorde ham til konge. Et mindretall av forskerne setter hans død til 1 f.Kr. Kartet står ved evangeliets Jeriko, der palassene hans lå, omtrent 21 km fra Jerusalem i luftlinje, ca. 4 f.Kr."
    - "Matteus' fortelling hviler på datoen: Josef tok barnet med til Egypt, og «han blev der til Herodes' død»; så «da Herodes var død, se, da åpenbarer Herrens engel sig i en drøm for Josef i Egypten», og da han hørte «at Arkelaus var konge i Judea efter sin far Herodes», slo han seg i stedet ned i Galilea. Josefus forteller slutten i detalj: Herodes lot lærerne som rev ned den gylne ørnen fra tempelporten, brenne levende, og samme natt ble månen formørket; han badet i de varme kildene i Kallirhoe hinsides Jordan, kom tilbake til Jeriko, endret testamentet sitt, lot sønnen Antipater henrette fem dager før sin egen død, og ble ført i høytidelig tog til festningen Herodion, som han hadde bygget til sin grav. I 2007 fant Ehud Netzer i skråningen ved Herodion et mausoleum og en knust sarkofag som han identifiserte som Herodes', en påstand noen har stilt spørsmål ved."
    - "Formørkelsen er det avgjørende punktet. En 13. mars 4 f.Kr. var delvis og falt en måned før påske, noe som passer med den vanlige datoen; Filmer i 1966 og Steinmann i 2009 foretrakk den totale formørkelsen 10. januar 1 f.Kr., og argumenterte for at Josefus' måneders hendelser knapt passer mellom mars og april. De fleste historikere beholder 4 f.Kr., fordi Herodes' sønner regnet sine regjeringer fra det: Arkelaus ble avsatt i sitt tiende år i 6 e.Kr., Filip døde i Tiberius' tyvende år etter trettisju år, og Antipas' mynter går til hans førtitredje år, 39 e.Kr. Etter den vanlige datoen ble Jesus, født «i kong Herodes' dager», født omkring 6–4 f.Kr., siden Herodes lot barna i Betlehem drepe «fra to år og derunder»; etter den andre, i 3–2 f.Kr."
  tl:
    - "Sa tagsibol ng 4 BK, ayon sa karaniwang pagtatakda: sinasabi ni Josephus na namatay si Herodes sa kaniyang palasyong pantaglamig sa Jerico pagkatapos ng eklipse ng buwan at ilang sandali bago ang Paskua, mga pitumpung taong gulang, sa ikatatlumpu't apat na taon mula nang kunin niya ang Jerusalem at ikatatlumpu't pito mula nang pangalanan siyang hari ng Roma. Inilalagay ng isang minorya ng mga iskolar ang kaniyang kamatayan sa 1 BK. Ang mapa ay nasa Jerico ng mga Ebanghelyo, kung saan nakatayo ang kaniyang mga palasyo, mga 21 km mula sa Jerusalem sa tuwid na guhit, noong c. 4 BK."
    - "Nakasalalay sa petsa si Mateo: dinala ni Jose ang bata sa Egipto at “dumoon hanggang sa pagkamatay ni Herodes”; “pagkamatay ni Herodes, narito, ang isang anghel ng Panginoon ay napakita sa panaginip kay Jose sa Egipto”, at nabalitaan niyang “si Arquelao ang naghahari sa Judea na kahalili ng kaniyang amang si Herodes”, kaya tumira siya sa Galilea. Kay Josephus ang wakas: ipinasunog ni Herodes nang buháy ang mga gurong nagbagsak ng gintong agila sa pintuan ng Templo; eklipse ng buwan nang gabing iyon; naligo sa maiinit na bukal ng Callirrhoe sa kabila ng Jordan, bumalik sa Jerico, binago ang habilin, ipinapatay ang anak na si Antipater 5 araw bago mamatay, at dinala nang may parangal sa Herodium, kutang itinayo niya para sa libingan. Noong 2007, kinilala ni Ehud Netzer na kay Herodes ang mausoleo at nabasag na sarkopago sa dalisdis ng Herodium, na pinagdududahan ng ilan."
    - "Ang eklipse ang susi. Ang isa noong 13 Marso 4 BK ay bahagya at isang buwan bago ang Paskua, na angkop sa karaniwang petsa; mas pinili nina Filmer (1966) at Steinmann (2009) ang ganap na eklipse ng 10 Enero 1 BK, na iginigiit na halos hindi magkasya sa pagitan ng Marso at Abril ang mga pangyayaring isinalaysay ni Josephus. Karamihan ng mananalaysay ay nananatili sa 4 BK, dahil mula roon binilang ng mga anak ni Herodes ang paghahari: pinatalsik si Arquelao sa ika-10 taon niya noong 6 AD, namatay si Felipe sa ika-20 taon ni Tiberio pagkatapos ng 37 taon, at umaabot ang mga barya ni Antipas sa ika-43 taon niya, 39 AD. Sa karaniwang petsa, ipinanganak si Jesus “sa mga kaarawan ng haring si Herodes” noong mga 6–4 BK, yamang ipinapatay ni Herodes ang mga bata sa Bethlehem “mula sa gulang na dalawang taon hanggang sa pababa”; sa kabilang petsa, noong 3–2 BK."
  da:
    - "I foråret 4 f.Kr. efter den sædvanlige datering: Josefus siger, at Herodes døde i sit vinterpalads ved Jeriko efter en måneformørkelse og kort før påske, omkring halvfjerds år gammel, i det fireogtredivte år, siden han indtog Jerusalem, og det syvogtredivte, siden Rom udnævnte ham til konge. Et mindretal af forskere placerer hans død i 1 f.Kr. Kortet står ved evangeliernes Jeriko, hvor hans paladser lå, omkring 21 km fra Jerusalem i luftlinje, i ca. 4 f.Kr."
    - "Mattæus' beretning hviler på datoen: Josef tog barnet med til Ægypten og »var der indtil Herodes's Død«; derefter »da Herodes var død, se, da viser en Herrens Engel sig i en Drøm for Josef i Ægypten«, og da han hørte, »at Arkelaus var Konge over Judæa i sin Fader Herodes's Sted«, bosatte han sig i stedet i Galilæa. Josefus fortæller slutningen nøje: Herodes lod lærerne, der rev den gyldne ørn ned fra Tempelporten, brænde levende, og den nat blev månen formørket; han badede i de varme kilder ved Kallirhoe hinsides Jordan, vendte tilbage til Jeriko, ændrede sit testamente, lod sin søn Antipater henrette fem dage før sin egen død og blev ført i procession til fæstningen Herodion, som han havde bygget til sin grav. I 2007 fandt Ehud Netzer på Herodions skråning et mausoleum og en knust sarkofag, som han identificerede som Herodes', en påstand, nogle har draget i tvivl."
    - "Den er omdrejningspunktet. Formørkelsen den 13. marts 4 f.Kr. var delvis og faldt en måned før påske, hvilket passer med den sædvanlige dato; Filmer i 1966 og Steinmann i 2009 foretrak den totale formørkelse den 10. januar 1 f.Kr. og hævdede, at Josefus' måneder af begivenheder næppe passer ind mellem marts og april. De fleste historikere beholder 4 f.Kr., fordi Herodes' sønner tællede deres regeringstid fra den: Arkelaus blev afsat i sit tiende år i 6 e.Kr., Filip døde i Tiberius' tyvende år efter syvogtredive år, og Antipas' mønter går til hans treogfyrretyvende år, 39 e.Kr. Efter den sædvanlige dato blev Jesus, født »i Kong Herodes's Dage«, født omkring 6–4 f.Kr., da Herodes lod børnene i Betlehem dræbe »fra to Aar og derunder«; efter den anden i 3–2 f.Kr."
