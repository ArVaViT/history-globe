# Draft question. The usual date (4 BC) and the minority date (1 BC) are both given; the map keeps c. 4 BC.
id: when-did-herod-the-great-die
question:
  en: "When did Herod the Great die?"
  ru: "Когда умер Ирод Великий?"
  uk: "Коли помер Ірод Великий?"
  es: "¿Cuándo murió Herodes el Grande?"
  pt: "Quando morreu Herodes, o Grande?"
  de: "Wann starb Herodes der Große?"
  fr: "Quand Hérode le Grand est-il mort ?"
answer:
  en:
    - "In the spring of 4 BC, on the usual dating: Josephus says Herod died at his winter palace at Jericho after a lunar eclipse and shortly before Passover, about seventy years old, in the thirty-fourth year since he took Jerusalem and the thirty-seventh since Rome named him king. A minority of scholars put his death in 1 BC. The map stands at the Jericho of the Gospels, where his palaces lay, about 21 km from Jerusalem in a straight line, in c. 4 BC."
    - "Matthew's story turns on the date: Joseph took the child to Egypt and “was there until the death of Herod”; then “when Herod was dead, behold, an angel of the Lord appeareth in a dream to Joseph in Egypt”, and hearing “that Archelaus did reign in Judaea in the room of his father Herod” he settled in Galilee instead. Josephus tells the end in detail: Herod had the teachers who pulled down the golden eagle from the Temple gate burned alive, and that night the moon was eclipsed; he bathed in the warm springs of Callirrhoe beyond the Jordan, came back to Jericho, changed his will, had his son Antipater executed five days before his own death, and was carried in state to the fortress of Herodium, which he had built for his tomb. In 2007 Ehud Netzer found on the slope of Herodium a mausoleum and a smashed sarcophagus that he identified as Herod's, a claim some have questioned."
    - "The eclipse is the hinge. One on 13 March 4 BC was partial and fell a month before Passover, which suits the usual date; Filmer in 1966 and Steinmann in 2009 preferred the total eclipse of 10 January 1 BC, arguing that Josephus's months of events hardly fit between March and April. Most historians keep 4 BC, because Herod's sons counted their reigns from it: Archelaus was deposed in his tenth year in AD 6, Philip died in the twentieth year of Tiberius after thirty-seven years, and the coins of Antipas run to his forty-third year, AD 39. On the usual date Jesus, born “in the days of Herod the king”, was born about 6–4 BC, since Herod had the children of Bethlehem killed “from two years old and under”; on the other, in 3–2 BC."
  ru:
    - "Весной 4 г. до н. э. по обычной датировке: Иосиф Флавий сообщает, что Ирод умер в своём зимнем дворце в Иерихоне после лунного затмения и незадолго до Пасхи, лет семидесяти, на тридцать четвёртом году после взятия Иерусалима и на тридцать седьмом с тех пор, как Рим назвал его царём. Меньшинство учёных относит его смерть к 1 г. до н. э. Карта стоит на евангельском Иерихоне, где лежали его дворцы, примерно в 21 км от Иерусалима по прямой, в условном 4 г. до н. э."
    - "Рассказ Матфея держится на этой дате: Иосиф унёс Младенца в Египет и «там был до смерти Ирода»; затем «по смерти же Ирода, — се, Ангел Господень во сне является Иосифу в Египте», а услышав, «что Архелай царствует в Иудее вместо Ирода, отца своего», он поселился в Галилее. Иосиф Флавий рассказывает конец подробно: больной и измученный, Ирод велел сжечь заживо учителей, сорвавших золотого орла с ворот Храма, и в ту ночь случилось лунное затмение; он лечился в тёплых источниках Каллирои за Иорданом, вернулся в Иерихон, переменил завещание, за пять дней до собственной смерти казнил сына Антипатра и был с царской пышностью перенесён в крепость Иродион, которую построил себе для гробницы. В 2007 году Эхуд Нецер нашёл на склоне Иродиона мавзолей и разбитый саркофаг, которые счёл Иродовыми; некоторые эту догадку оспаривают."
    - "Затмение — ключ ко всему. Затмение 13 марта 4 г. до н. э. было частным и случилось за месяц до Пасхи, что подходит к обычной дате; Филмер в 1966 году и Стайнманн в 2009-м предпочли полное затмение 10 января 1 г. до н. э., доказывая, что месяцы событий у Иосифа едва умещаются между мартом и апрелем. Большинство историков держатся 4 г., потому что сыновья Ирода считали своё правление от него: Архелай был смещён на десятом году, в 6 г. н. э., Филипп умер в двадцатый год Тиверия после тридцати семи лет правления, а монеты Антипы доходят до его сорок третьего года, 39 г. н. э. По обычной дате Иисус, родившийся «во дни царя Ирода», родился около 6–4 гг. до н. э., ведь Ирод велел избить младенцев в Вифлееме «от двух лет и ниже»; по другой — в 3–2 гг. до н. э."
  uk:
    - "Навесні 4 р. до н. е. за звичною датою: Йосиф Флавій каже, що Ірод помер у своєму зимовому палаці в Єрихоні після місячного затемнення і незадовго до Пасхи, приблизно сімдесяти років, на тридцять четвертому році від узяття ним Єрусалиму й тридцять сьомому від того, як Рим назвав його царем. Меншість учених відносить його смерть до 1 р. до н. е. Мапа стоїть в Єрихоні Євангелій, де лежали його палаци, приблизно за 21 км від Єрусалиму по прямій, близько 4 р. до н. е."
    - "Розповідь Матвія залежить від дати: Йосип відвів дитя в Єгипет, і Ісус «пробував там аж до смерти Іродової»; потім «як же вмер Ірод, ось являєть ся ангел Господень уві снї Йосифу в Єгиптї», а почувши, що «Архелай царює в Юдеї замість батька свого Ірода», Йосип натомість оселився в Галілеї. Йосиф Флавій докладно розповідає про кінець: Ірод звелів спалити живцем учителів, що зірвали золотого орла з брами Храму, і тієї ночі місяць затьмарився; він купався в теплих джерелах Каллірої за Йорданом, повернувся до Єрихону, змінив заповіт, звелів стратити свого сина Антипатра за п'ять днів до власної смерті й був урочисто перевезений до фортеці Іродіон, яку звів для своєї гробниці. 2007 року Егуд Нецер знайшов на схилі Іродіона мавзолей і розбитий саркофаг, які він визнав за Іродові, — твердження, яке дехто піддавав сумніву."
    - "Затемнення — вісь питання. Затемнення 13 березня 4 р. до н. е. було частковим і припало на місяць до Пасхи, що відповідає звичній даті; Філмер 1966 р. і Штайнман 2009 р. віддали перевагу повному затемненню 10 січня 1 р. до н. е., стверджуючи, що місяці подій у Йосифа Флавія навряд чи вміщаються між березнем і квітнем. Більшість істориків лишає 4 р. до н. е., бо сини Ірода рахували свої правління від нього: Архелая було скинуто на десятому році 6 р. н. е., Пилип помер на двадцятому році Тиверія після тридцяти семи років, а монети Антипи тягнуться до його сорок третього року, 39 р. н. е. За звичною датою Ісус, народжений «за царя Ірода», народився близько 6–4 рр. до н. е., бо Ірод звелів убити дітей Вифлеєму «од двох років і меньше»; за іншою — у 3–2 рр. до н. е."
  es:
    - "En la primavera del 4 a. C., según la datación habitual: Josefo dice que Herodes murió en su palacio de invierno en Jericó después de un eclipse lunar y poco antes de la Pascua, con unos setenta años, en el año treinta y cuatro desde que tomó Jerusalén y el treinta y siete desde que Roma lo nombró rey. Una minoría de estudiosos sitúa su muerte en el 1 a. C. El mapa se sitúa en la Jericó de los Evangelios, donde estaban sus palacios, a unos 21 km de Jerusalén en línea recta, hacia el 4 a. C."
    - "El relato de Mateo gira sobre la fecha: José llevó al niño a Egipto, y «estuvo allá hasta la muerte de Herodes»; luego, «muerto Herodes, he aquí el ángel del Señor aparece en sueños á José en Egipto», y al oír que «Archelao reinaba en Judea en lugar de Herodes su padre» se estableció en Galilea. Josefo cuenta el final con detalle: Herodes hizo quemar vivos a los maestros que derribaron el águila de oro de la puerta del Templo, y esa noche la luna se eclipsó; se bañó en las aguas termales de Calírroe, más allá del Jordán, volvió a Jericó, cambió su testamento, hizo ejecutar a su hijo Antípatro cinco días antes de morir y fue llevado con pompa a la fortaleza de Herodión, que había construido para su tumba. En 2007 Ehud Netzer halló en la ladera de Herodión un mausoleo y un sarcófago destrozado que identificó como los de Herodes, afirmación que algunos dudan."
    - "El eclipse es el punto clave. Uno del 13 de marzo del 4 a. C. fue parcial y cayó un mes antes de la Pascua, lo que concuerda con la fecha habitual; Filmer en 1966 y Steinmann en 2009 prefirieron el eclipse total del 10 de enero del 1 a. C., argumentando que los meses de acontecimientos de Josefo apenas caben entre marzo y abril. La mayoría de los historiadores mantiene el 4 a. C., porque los hijos de Herodes contaron sus reinados a partir de entonces: Arquelao fue depuesto en su décimo año, en el 6 d. C., Felipe murió en el año veinte de Tiberio tras treinta y siete años, y las monedas de Antipas llegan a su año cuarenta y tres, el 39 d. C. Según la fecha habitual, Jesús, nacido «en días del rey Herodes», nació hacia el 6–4 a. C., pues Herodes mandó matar a los niños de Belén «de edad de dos años abajo»; según la otra, en el 3–2 a. C."
  pt:
    - "Na primavera de 4 a.C., pela datação usual: Josefo diz que Herodes morreu em seu palácio de inverno em Jericó, depois de um eclipse lunar e pouco antes da Páscoa, com cerca de setenta anos, no trigésimo quarto ano desde que tomou Jerusalém e no trigésimo sétimo desde que Roma o nomeou rei. Uma minoria de estudiosos situa sua morte em 1 a.C. O mapa está na Jericó dos Evangelhos, onde ficavam seus palácios, a cerca de 21 km de Jerusalém em linha reta, em c. 4 a.C."
    - "A narrativa de Mateus depende da data: José levou o menino ao Egito e “lá ficou até a morte de Herodes”; então, “tendo Herodes morrido, eis que um anjo do Senhor apareceu em um sonho a José, no Egito”, e ao saber que “Arquelau reinava na Judeia em lugar de seu pai, Herodes”, ele se fixou na Galileia. Josefo conta o fim em detalhe: Herodes mandou queimar vivos os mestres que derrubaram a águia de ouro da porta do Templo, e naquela noite a lua se eclipsou; banhou-se nas águas quentes de Calírroe, além do Jordão, voltou a Jericó, mudou o testamento, mandou executar o filho Antípatro cinco dias antes da própria morte e foi levado em cortejo à fortaleza de Herodium, que construíra para seu túmulo. Em 2007 Ehud Netzer achou na encosta de Herodium um mausoléu e um sarcófago despedaçado que identificou como de Herodes, afirmação que alguns contestam."
    - "O eclipse é o eixo. Um de 13 de março de 4 a.C. foi parcial e ocorreu um mês antes da Páscoa, o que combina com a data usual; Filmer, em 1966, e Steinmann, em 2009, preferiram o eclipse total de 10 de janeiro de 1 a.C., alegando que os meses de acontecimentos de Josefo mal cabem entre março e abril. A maioria dos historiadores mantém 4 a.C., porque os filhos de Herodes contaram seus reinados a partir daí: Arquelau foi deposto no décimo ano, em 6 d.C., Filipe morreu no vigésimo ano de Tibério depois de trinta e sete anos, e as moedas de Antipas vão até o quadragésimo terceiro ano, 39 d.C. Pela data usual Jesus, nascido “nos dias do rei Herodes”, nasceu por volta de 6–4 a.C., pois Herodes mandou matar os meninos de Belém “de dois anos para baixo”; pela outra, em 3–2 a.C."
  de:
    - "Im Frühjahr 4 v. Chr. nach der üblichen Datierung: Josephus sagt, Herodes sei in seinem Winterpalast in Jericho nach einer Mondfinsternis und kurz vor dem Passafest gestorben, etwa siebzig Jahre alt, im vierunddreißigsten Jahr seit der Einnahme Jerusalems und im siebenunddreißigsten seit seiner Ernennung zum König durch Rom. Eine Minderheit der Gelehrten setzt seinen Tod auf 1 v. Chr. Die Karte steht um 4 v. Chr. beim Jericho der Evangelien, wo seine Paläste lagen, etwa 21 km Luftlinie von Jerusalem."
    - "Bei Matthäus hängt es am Datum: Josef brachte das Kind nach Ägypten und „blieb allda bis nach dem Tod des Herodes“; dann: „Da aber Herodes gestorben war, siehe, da erschien der Engel des HERRN dem Joseph im Traum in Ägyptenland“, und als er hörte, „daß Archelaus im jüdischen Lande König war anstatt seines Vaters Herodes“, zog er stattdessen nach Galiläa. Josephus erzählt das Ende: Herodes ließ die Lehrer, die den goldenen Adler vom Tempeltor rissen, lebendig verbrennen, und in jener Nacht war Mondfinsternis; er badete in den Quellen von Kallirrhoë jenseits des Jordan, kehrte nach Jericho zurück, änderte sein Testament, ließ Antipater fünf Tage vor dem eigenen Tod hinrichten und wurde zur Festung Herodeion getragen, die er als Grab erbaut hatte. 2007 fand Ehud Netzer am Hang des Herodeion ein Mausoleum und einen zertrümmerten Sarkophag, die er Herodes zuschrieb – was manche bezweifeln."
    - "Die Finsternis ist der Angelpunkt. Eine am 13. März 4 v. Chr. war partiell und fiel einen Monat vor das Passafest, was zur üblichen Datierung passt; Filmer 1966 und Steinmann 2009 zogen die totale Finsternis vom 10. Januar 1 v. Chr. vor, da die Ereignisse bei Josephus kaum zwischen März und April passten. Die meisten Historiker bleiben bei 4 v. Chr., weil die Söhne des Herodes ihre Regierungen davon zählten: Archelaos wurde im zehnten Jahr 6 n. Chr. abgesetzt, Philippus starb im zwanzigsten Jahr des Tiberius nach siebenunddreißig Jahren, und die Münzen des Antipas reichen bis in sein dreiundvierzigstes Jahr, 39 n. Chr. Nach dem üblichen Datum wurde Jesus, geboren „zur Zeit des Königs Herodes“, etwa 6–4 v. Chr. geboren, da Herodes die Kinder von Bethlehem töten ließ, „die da zweijährig und darunter waren“; nach dem anderen 3–2 v. Chr."
  fr:
    - "Au printemps 4 av. J.-C. selon la datation habituelle : Josèphe dit qu’Hérode mourut dans son palais d’hiver de Jéricho après une éclipse de lune et peu avant la Pâque, âgé d’environ soixante-dix ans, la trente-quatrième année depuis qu’il avait pris Jérusalem et la trente-septième depuis que Rome l’avait nommé roi. Une minorité de savants placent sa mort en 1 av. J.-C. La carte se place au Jéricho des Évangiles, où se trouvaient ses palais, à environ 21 km de Jérusalem en ligne droite, vers 4 av. J.-C."
    - "Le récit de Matthieu dépend de la date : Joseph emmena l’enfant en Égypte ; « Il y resta jusqu’à la mort d’Hérode » ; puis « Quand Hérode fut mort, voici, un ange du Seigneur apparut en songe à Joseph, en Égypte », et, apprenant qu’« Archélaüs régnait sur la Judée à la place d’Hérode, son père », il s’établit plutôt en Galilée. Josèphe détaille la fin : Hérode fit brûler vifs les maîtres qui avaient abattu l’aigle d’or de la porte du Temple, et cette nuit-là la lune s’éclipsa ; il se baigna aux eaux chaudes de Callirrhoé au-delà du Jourdain, revint à Jéricho, changea son testament, fit exécuter son fils Antipater cinq jours avant sa propre mort et fut porté en cortège à l’Hérodion, forteresse bâtie pour son tombeau. En 2007, Éhud Netzer trouva sur le flanc de l’Hérodion un mausolée et un sarcophage brisé qu’il identifia comme ceux d’Hérode, ce que certains contestent."
    - "L’éclipse est le pivot. Celle du 13 mars 4 av. J.-C. fut partielle et eut lieu un mois avant la Pâque, ce qui convient à la date habituelle ; Filmer en 1966 et Steinmann en 2009 ont préféré l’éclipse totale du 10 janvier 1 av. J.-C., arguant que les mois d’événements rapportés par Josèphe tiennent mal entre mars et avril. La plupart des historiens gardent 4 av. J.-C., parce que les fils d’Hérode comptaient leurs règnes à partir de cette date : Archélaüs fut déposé dans sa dixième année en 6 apr. J.-C., Philippe mourut la vingtième année de Tibère après trente-sept ans, et les monnaies d’Antipas vont jusqu’à sa quarante-troisième année, 39 apr. J.-C. Selon la date habituelle, Jésus, né « au temps du roi Hérode », naquit vers 6–4 av. J.-C., puisqu’Hérode fit tuer les enfants de Bethléem « de deux ans et au-dessous » ; selon l’autre, en 3–2 av. J.-C."
