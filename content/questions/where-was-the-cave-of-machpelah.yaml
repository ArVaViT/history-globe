id: where-was-the-cave-of-machpelah
question:
  en: "Where is the cave of Machpelah, the tomb of the patriarchs?"
  ru: "Где находится пещера Махпела, гробница патриархов?"
  uk: "Де міститься печера Махпела, гробниця патріархів?"
  es: "¿Dónde está la cueva de Macpela, la tumba de los patriarcas?"
  pt: "Onde fica a caverna de Macpela, o túmulo dos patriarcas?"
  de: "Wo liegt die Höhle Machpela, das Grab der Patriarchen?"
  fr: "Où se trouve la caverne de Macpéla, le tombeau des patriarches ?"
  pl: "Gdzie jest jaskinia Makpela, grobowiec patriarchów?"
  it: "Dov’è la grotta di Macpela, la tomba dei patriarchi?"
  cs: "Kde je jeskyně Makpela, hrob patriarchů?"
  nl: "Waar ligt de grot van Machpela, het graf van de aartsvaders?"
  sv: "Var ligger Makpelagrottan, patriarkernas grav?"
  nb: "Hvor ligger Makpela-hulen, patriarkenes grav?"
  tl: "Nasaan ang yungib ng Macpela, ang libingan ng mga patriyarka?"
  da: "Hvor ligger Makpela-hulen, patriarkernes grav?"
answer:
  en:
    - "In Hebron, in the hills of Judah about 30 km south of Jerusalem in a straight line, under the great stone enclosure known as the Cave of the Patriarchs or the Haram al-Khalil. The map point stands on it, less than a kilometre from Tel Rumeida, the mound of ancient Hebron, and about 4 km from Mamre, which Genesis names beside it. The identification goes back at least to the Herodian period, when the enclosure was built, and is not seriously disputed, though the cave itself has not been excavated."
    - "Genesis gives the place in detail: “the field of Ephron, which was in Machpelah, which was before Mamre, the field, and the cave which was therein”. Abraham bought it to bury Sarah, “in the cave of the field of Machpelah before Mamre: the same is Hebron in the land of Canaan”, and Isaac and Ishmael buried Abraham there. Dying in Egypt, Jacob listed those who lay in it: “There they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah”; his sons carried him up and buried him there too."
    - "The enclosure, about 59 by 34 m, is attributed to Herod the Great for its likeness to the walls of the Temple Mount. A church inside it became a mosque after the Arab conquest, a church again under the Crusaders and a mosque under Saladin. The cave below the floor is closed; visitors see cenotaphs above it. Since 1994 the building has been divided between a mosque and a synagogue, and in 2017 UNESCO inscribed the old town of Hebron with the sanctuary."
  ru:
    - "В Хевроне, в Иудейских горах примерно в 30 км к югу от Иерусалима по прямой, под огромной каменной оградой, известной как Пещера патриархов или Харам-эль-Халиль. Точка карты стоит на ней, меньше чем в километре от Тель-Румейды, холма древнего Хеврона, и примерно в 4 км от Мамре, которое Бытие называет рядом с ней. Отождествление восходит по меньшей мере ко временам Ирода, когда построили ограду, и всерьёз не оспаривается, хотя саму пещеру не раскапывали."
    - "Бытие описывает место подробно: «поле Ефроново, которое при Махпеле, против Мамре, поле и пещера, которая на нем». Авраам купил его, чтобы похоронить Сарру «в пещере поля в Махпеле, против Мамре, что ныне Хеврон, в земле Ханаанской», и там Исаак и Измаил погребли самого Авраама. Умирая в Египте, Иаков перечислил тех, кто там лежит: «там похоронили Авраама и Сарру, жену его; там похоронили Исаака и Ревекку, жену его; и там похоронил я Лию»; сыновья отнесли его туда и похоронили и его."
    - "Ограду, около 59 на 34 м, приписывают Ироду Великому за сходство со стенами Храмовой горы. Церковь внутри неё после арабского завоевания стала мечетью, при крестоносцах снова церковью, а при Саладине — опять мечетью. Пещера под полом закрыта; посетители видят над ней кенотафы. С 1994 года здание разделено между мечетью и синагогой, а в 2017 году ЮНЕСКО внесла старый город Хеврона со святилищем в список Всемирного наследия."
  uk:
    - "У Хевроні, в пагорбах Юди приблизно за 30 км на південь від Єрусалима по прямій, під великою кам'яною огорожею, відомою як Печера патріархів, або Харам аль-Халіль. Точка на мапі стоїть на ній, менш ніж за кілометр від Тель-Румейди, пагорба давнього Хеврона, і приблизно за 4 км від Мамре, яке Книга Буття називає поруч із нею. Ототожнення сягає щонайменше іродіанської доби, коли було збудовано огорожу, і серйозно не оспорюється, хоча саму печеру не розкопували."
    - "Книга Буття подає місце докладно: «поле Ефронове в Махпелщинї, що навпроти Мамрійщини, поле й печера на йому». Авраам купив його, щоб поховати Сарру, «в печері Махпелевого поля, навпроти Мамрійщини. Се Геброн у Канаан землї», і Ісаак та Ізмаїл поховали там Авраама. Помираючи в Єгипті, Яків перелічив тих, хто лежить у ній: «Там поховано Авраама й Сарру, жону його; там поховано Ізаака й Ребеку, жену його, і там поховав я Лею»; його сини віднесли його й поховали там теж."
    - "Огорожу, близько 59 на 34 м, приписують Іродові Великому за подібність до мурів Храмової гори. Церква всередині неї стала мечеттю після арабського завоювання, знову церквою за хрестоносців і мечеттю за Салах ад-Діна. Печера під підлогою закрита; відвідувачі бачать кенотафи над нею. З 1994 р. будівлю розділено між мечеттю та синагогою, а 2017 р. ЮНЕСКО внесла старе місто Хеврона зі святинею до Списку."
  es:
    - "En Hebrón, en las colinas de Judá, a unos 30 km al sur de Jerusalén en línea recta, bajo el gran recinto de piedra conocido como la Cueva de los Patriarcas o el Haram al-Khalil. El punto del mapa está sobre él, a menos de un kilómetro de Tel Rumeida, el montículo de la antigua Hebrón, y a unos 4 km de Mamre, que el Génesis nombra junto a ella. La identificación se remonta al menos a la época herodiana, cuando se construyó el recinto, y no se discute seriamente, aunque la cueva en sí no ha sido excavada."
    - "El Génesis da el lugar con detalle: «la heredad de Ephrón que estaba en Macpela enfrente de Mamre, la heredad y la cueva que estaba en ella». Abraham la compró para sepultar a Sara «en la cueva de la heredad de Macpela enfrente de Mamre, que es Hebrón en la tierra de Canaán», e Isaac e Ismael sepultaron allí a Abraham. Al morir en Egipto, Jacob enumeró a quienes yacían en ella: «Allí sepultaron á Abraham y á Sara su mujer; allí sepultaron á Isaac y á Rebeca su mujer; allí también sepulté yo á Lea»; sus hijos lo llevaron hasta allí y también lo sepultaron."
    - "El recinto, de unos 59 por 34 m, se atribuye a Herodes el Grande por su semejanza con los muros del Monte del Templo. Una iglesia en su interior se convirtió en mezquita tras la conquista árabe, de nuevo en iglesia con los cruzados y en mezquita bajo Saladino. La cueva bajo el suelo está cerrada; los visitantes ven cenotafios sobre ella. Desde 1994 el edificio está dividido entre una mezquita y una sinagoga, y en 2017 la UNESCO inscribió la ciudad vieja de Hebrón con el santuario."
  pt:
    - "Em Hebrom, nas colinas de Judá, a cerca de 30 km ao sul de Jerusalém em linha reta, sob o grande recinto de pedra conhecido como Caverna dos Patriarcas ou Haram al-Khalil. O ponto do mapa fica sobre ele, a menos de um quilômetro de Tel Rumeida, o monte da antiga Hebrom, e a cerca de 4 km de Manre, que o Gênesis nomeia ao lado dela. A identificação remonta pelo menos ao período herodiano, quando o recinto foi construído, e não é seriamente contestada, embora a própria caverna não tenha sido escavada."
    - "O Gênesis dá o lugar em detalhe: “o campo de Efrom, que estava em Macpela, que ficava em frente a Manre, o campo, a caverna que nele estava”. Abraão o comprou para sepultar Sara, “na caverna do campo de Macpela, em frente a Manre (isto é, Hebrom), na terra de Canaã”, e Isaque e Ismael sepultaram Abraão ali. Morrendo no Egito, Jacó enumerou os que jaziam nela: “Lá sepultaram Abraão e Sara, sua mulher. Lá sepultaram Isaque e Rebeca, sua mulher, e lá eu sepultei Lia”; seus filhos o levaram e também o sepultaram ali."
    - "O recinto, de cerca de 59 por 34 m, é atribuído a Herodes, o Grande, por sua semelhança com as muralhas do monte do Templo. Uma igreja no interior tornou-se mesquita depois da conquista árabe, de novo igreja sob os cruzados e mesquita sob Saladino. A caverna abaixo do piso é fechada; os visitantes veem cenotáfios acima dela. Desde 1994 o edifício é dividido entre uma mesquita e uma sinagoga, e em 2017 a UNESCO inscreveu a cidade velha de Hebrom com o santuário."
  de:
    - "In Hebron, im Bergland von Juda, in der Luftlinie etwa 30 km südlich von Jerusalem, unter der großen Steinumfassung, die als Höhle der Patriarchen oder Haram al-Khalil bekannt ist. Der Kartenpunkt steht darauf, weniger als einen Kilometer von Tel Rumeida, dem Hügel des antiken Hebron, und etwa 4 km von Mamre, das die Genesis daneben nennt. Die Gleichsetzung reicht mindestens bis in die herodianische Zeit zurück, als die Umfassung gebaut wurde, und ist nicht ernsthaft umstritten, obwohl die Höhle selbst nicht ausgegraben ist."
    - "Die Genesis gibt den Ort genau an: „Ephrons Acker, darin die zwiefache Höhle ist, Mamre gegenüber“. Abraham kaufte ihn, um Sara zu begraben, „in der Höhle des Ackers, die zwiefach ist, Mamre gegenüber, das ist Hebron, im Lande Kanaan“, und Isaak und Ismael begruben Abraham dort. Jakob nannte in Ägypten sterbend, wer in ihr lag: „Daselbst haben sie Abraham begraben und Sara, sein Weib. Daselbst haben sie auch Isaak begraben und Rebekka, sein Weib. Daselbst habe ich auch Lea begraben“; seine Söhne brachten ihn hinauf und begruben auch ihn dort."
    - "Die Umfassung, etwa 59 mal 34 m, wird Herodes dem Großen zugeschrieben wegen ihrer Ähnlichkeit mit den Mauern des Tempelbergs. Eine Kirche darin wurde nach der arabischen Eroberung zur Moschee, unter den Kreuzfahrern wieder zur Kirche und unter Saladin wieder zur Moschee. Die Höhle unter dem Boden ist verschlossen; Besucher sehen Kenotaphe darüber. Seit 1994 ist das Gebäude zwischen einer Moschee und einer Synagoge geteilt, und 2017 nahm die UNESCO die Altstadt von Hebron mit dem Heiligtum in die Welterbeliste auf."
  fr:
    - "À Hébron, dans les collines de Juda, à environ 30 km au sud de Jérusalem à vol d’oiseau, sous la grande enceinte de pierre connue sous le nom de Caveau des Patriarches ou de Haram al-Khalil. Le point de la carte s’y trouve, à moins d’un kilomètre de Tel Rumeida, le tertre de l’antique Hébron, et à environ 4 km de Mamré, que la Genèse nomme à côté. L’identification remonte au moins à l’époque hérodienne, où l’enceinte fut bâtie, et n’est pas sérieusement contestée, bien que la caverne elle-même n’ait pas été fouillée."
    - "La Genèse donne le lieu en détail : « Le champ d’Éphron à Macpéla, vis-à-vis de Mamré, le champ et la caverne qui y est ». Abraham l’acheta pour enterrer Sara, « dans la caverne du champ de Macpéla, vis-à-vis de Mamré, qui est Hébron, dans le pays de Canaan », et Isaac et Ismaël y enterrèrent Abraham. Mourant en Égypte, Jacob énuméra ceux qui y reposaient : « Là on a enterré Abraham et Sara, sa femme ; là on a enterré Isaac et Rebecca, sa femme ; et là j’ai enterré Léa » ; ses fils le transportèrent et l’y enterrèrent lui aussi."
    - "L’enceinte, d’environ 59 sur 34 m, est attribuée à Hérode le Grand à cause de sa ressemblance avec les murs du mont du Temple. Une église à l’intérieur devint mosquée après la conquête arabe, de nouveau église sous les croisés et mosquée sous Saladin. La caverne sous le sol est fermée ; les visiteurs voient des cénotaphes au-dessus. Depuis 1994, le bâtiment est partagé entre une mosquée et une synagogue, et en 2017 l’UNESCO a inscrit la vieille ville d’Hébron avec le sanctuaire."
  pl:
    - "W Hebronie, we wzgórzach Judy około 30 km na południe od Jerozolimy w linii prostej, pod wielkim kamiennym ogrodzeniem znanym jako Grota Patriarchów lub Haram al-Khalil. Punkt na mapie stoi na nim, mniej niż kilometr od Tel Rumeida, wzgórza starożytnego Hebronu, i około 4 km od Mamre, które Księga Rodzaju wymienia obok niego. Utożsamienie sięga co najmniej okresu herodiańskiego, gdy zbudowano ogrodzenie, i nie jest poważnie kwestionowane, choć sama jaskinia nie była badana wykopaliskowo."
    - "Księga Rodzaju podaje to miejsce szczegółowo: „pole Efronowe (które jest w Machpelu przeciwko Mamre, pole i jaskinia, która jest na niem)”. Abraham kupił je, by pochować Sarę, „w jaskini pola w Machpelu przeciwko Mamre, to jest Hebron, w ziemi Chananejskiej”, a Izaak i Izmael pochowali tam Abrahama. Umierając w Egipcie, Jakub wymienił tych, którzy w niej leżą: „Tam pogrzebiono Abrahama, i Sarę, żonę jego; tam pogrzebiono Izaaka, i Rebekę żonę jego; tamem też pogrzebał Liję”; jego synowie przewieźli go i pochowali tam również."
    - "Ogrodzenie, o wymiarach około 59 na 34 m, przypisuje się Herodowi Wielkiemu ze względu na podobieństwo do murów Wzgórza Świątynnego. Kościół w jego wnętrzu stał się meczetem po arabskim podboju, znów kościołem za krzyżowców i meczetem za Saladyna. Jaskinia pod podłogą jest zamknięta; zwiedzający widzą nad nią kenotafy. Od 1994 roku budynek jest podzielony między meczet i synagogę, a w 2017 UNESCO wpisało stare miasto Hebronu wraz z sanktuarium na Listę światowego dziedzictwa."
  it:
    - "A Ebron, sulle colline di Giuda a circa 30 km a sud di Gerusalemme in linea d’aria, sotto il grande recinto di pietra noto come Grotta dei Patriarchi o Haram al-Khalil. Il punto della mappa si trova su di esso, a meno di un chilometro da Tel Rumeida, il tell dell’antica Ebron, e a circa 4 km da Mamre, che la Genesi nomina accanto ad essa. L’identificazione risale almeno al periodo erodiano, quando il recinto fu costruito, e non è seriamente messa in discussione, benché la grotta stessa non sia stata scavata."
    - "La Genesi dà il luogo nei particolari: «il campo di Efron ch’era a Macpela dirimpetto a Mamre, il campo con la caverna che v’era». Abramo lo comprò per seppellirvi Sara, «nella spelonca del campo di Macpela dirimpetto a Mamre, che è Hebron, nel paese di Canaan», e Isacco e Ismaele vi seppellirono Abramo. Morendo in Egitto, Giacobbe elencò quelli che vi giacevano: «Quivi furon sepolti Abrahamo e Sara sua moglie; quivi furon sepolti Isacco e Rebecca sua moglie, e quivi io seppellii Lea»; i suoi figli lo portarono su e lo seppellirono anch’essi lì."
    - "Il recinto, di circa 59 per 34 m, è attribuito a Erode il Grande per la somiglianza con le mura del Monte del Tempio. Una chiesa al suo interno divenne moschea dopo la conquista araba, di nuovo chiesa sotto i Crociati e moschea sotto Saladino. La grotta sotto il pavimento è chiusa; i visitatori vedono cenotafi sopra di essa. Dal 1994 l’edificio è diviso tra una moschea e una sinagoga, e nel 2017 l’UNESCO ha iscritto la città vecchia di Ebron con il santuario."
  cs:
    - "V Hebronu, v judských horách asi 30 km vzdušnou čarou jižně od Jeruzaléma, pod velkým kamenným ohrazením známým jako Jeskyně patriarchů neboli Haram al-Chalíl. Bod na mapě stojí na něm, necelý kilometr od Tel Rumejdy, pahorku starověkého Hebronu, a asi 4 km od Mamre, které Genesis jmenuje vedle ní. Ztotožnění sahá nejméně do herodovské doby, kdy bylo ohrazení vystavěno, a není vážně sporné, ačkoli samotná jeskyně nebyla vykopána."
    - "Genesis uvádí místo podrobně: „pole Efronovo, kteréž bylo v Machpelah, proti Mamre, pole a jeskyně na něm“. Abraham je koupil, aby pochoval Sáru, „v jeskyni pole Machpelah, proti Mamre, (to slove Hebron), v zemi Kananejské“, a Izák a Jišmael tam pochovali Abrahama. Umíraje v Egyptě, Jákob vyjmenoval ty, kdo v ní leží: „Tam pochovali Abrahama a Sáru ženu jeho; tam pochovali Izáka a Rebeku ženu jeho; tam také pochovali Líu“; jeho synové ho tam také odnesli a pochovali."
    - "Ohrazení, asi 59 na 34 m, se připisuje Herodovi Velikému pro podobnost se zdmi Chrámové hory. Kostel uvnitř se po arabském dobytí stal mešitou, za křižáků opět kostelem a za Saladina mešitou. Jeskyně pod podlahou je uzavřena; návštěvníci vidí kenotafy nad ní. Od roku 1994 je budova rozdělena mezi mešitu a synagogu a roku 2017 UNESCO zapsalo staré město Hebronu se svatyní na seznam světového dědictví."
  nl:
    - "In Hebron, in het bergland van Juda hemelsbreed ongeveer 30 km ten zuiden van Jeruzalem, onder de grote stenen omheining die bekendstaat als de Grot van de Aartsvaders of de Haram al-Khalil. Het punt op de kaart staat erop, minder dan een kilometer van Tel Rumeida, de heuvel van het oude Hebron, en ongeveer 4 km van Mamre, dat Genesis ernaast noemt. De identificatie gaat terug tot ten minste de Herodiaanse tijd, toen de omheining werd gebouwd, en wordt niet serieus betwist, hoewel de grot zelf niet is opgegraven."
    - "Genesis geeft de plaats in detail: “de akker van Efron, die in Machpela was, dat tegenover Mamre lag, de akker en de spelonk, die daarin was”. Abraham kocht haar om Sara te begraven, “in de spelonk des akkers van Machpela, tegenover Mamre, hetwelk is Hebron, in het land Kanaan”, en Isaak en Ismaël begroeven Abraham daar. Stervend in Egypte noemde Jakob wie erin lagen: “Aldaar hebben zij Abraham begraven, en Sara, zijn huisvrouw; daar hebben zij Izak begraven, en Rebekka, zijn huisvrouw; en daar heb ik Lea begraven”; zijn zonen brachten hem op en begroeven hem daar ook."
    - "De omheining, ongeveer 59 bij 34 m, wordt aan Herodes de Grote toegeschreven vanwege haar gelijkenis met de muren van de Tempelberg. Een kerk erin werd na de Arabische verovering een moskee, onder de kruisvaarders weer een kerk en onder Saladin een moskee. De grot onder de vloer is gesloten; bezoekers zien cenotafen erboven. Sinds 1994 is het gebouw verdeeld tussen een moskee en een synagoge, en in 2017 schreef UNESCO de oude stad van Hebron met het heiligdom in."
  sv:
    - "I Hebron, i Judas berg omkring 30 km söder om Jerusalem i fågelvägen, under den stora stenhägnaden som kallas Patriarkernas grotta eller Haram al-Khalil. Kartpunkten står på den, mindre än en kilometer från Tel Rumeida, den antika Hebrons kulle, och omkring 4 km från Mamre, som Första Moseboken nämner bredvid den. Identifieringen går tillbaka åtminstone till den herodianska tiden, då hägnaden byggdes, och ifrågasätts inte på allvar, fastän själva grottan inte har grävts ut."
    - "Första Moseboken anger platsen i detalj: ”Efrons åker i Makpela, gent emot Mamre, själva åkern med grottan som fanns där”. Abraham köpte den för att begrava Sara, ”i grottan på åkern i Makpela, gent emot Mamre, det är Hebron, i Kanaans land”, och Isak och Ismael begrov Abraham där. Jakob, döende i Egypten, räknade upp dem som låg i den: ”där de hava begravit Abraham och hans hustru Sara, där de ock hava begravit Isak och hans hustru Rebecka, och där jag själv har begravit Lea”; hans söner förde upp honom och begrov honom också där."
    - "Hägnaden, omkring 59 gånger 34 m, tillskrivs Herodes den store på grund av dess likhet med Tempelbergets murar. En kyrka inuti den blev en moské efter den arabiska erövringen, åter en kyrka under korsfararna och en moské under Saladin. Grottan under golvet är stängd; besökare ser kenotafer ovanför den. Sedan 1994 är byggnaden delad mellan en moské och en synagoga, och 2017 upptog Unesco Hebrons gamla stad med helgedomen på världsarvslistan."
  nb:
    - "I Hebron, i Judas fjellland omtrent 30 km sør for Jerusalem i luftlinje, under den store steinomgjerdingen som kalles Patriarkenes hule eller Haram al-Khalil. Kartpunktet står på den, mindre enn en kilometer fra Tel Rumeida, haugen til det gamle Hebron, og omtrent 4 km fra Mamre, som Første Mosebok nevner ved siden av. Identifiseringen går tilbake til minst den herodiske tiden, da omgjerdingen ble bygd, og er ikke alvorlig omstridt, selv om selve hulen ikke er utgravd."
    - "Første Mosebok gir stedet i detalj: «Efrons mark i Makpela, som ligger østenfor Mamre, både marken og hulen som er på den». Abraham kjøpte den for å begrave Sara, «i hulen på Makpelamarken østenfor Mamre, det er Hebron, i Kana’ans land», og Isak og Ismael begravde Abraham der. Da Jakob lå døende i Egypt, regnet han opp dem som lå i den: «Der begravde de Abraham og Sara, hans hustru, der begravde de Isak og Rebekka, hans hustru, og der begravde jeg Lea»; hans sønner førte ham opp og begravde ham også der."
    - "Omgjerdingen, omtrent 59 ganger 34 m, tilskrives Herodes den store på grunn av likheten med murene rundt Tempelplassen. En kirke inne i den ble moské etter den arabiske erobringen, igjen kirke under korsfarerne og moské under Saladin. Hulen under gulvet er stengt; besøkende ser kenotafer over den. Siden 1994 har bygningen vært delt mellom en moské og en synagoge, og i 2017 oppførte UNESCO Hebrons gamleby med helligdommen på verdensarvlisten."
  tl:
    - "Sa Hebron, sa mga burol ng Juda na mga 30 km sa timog ng Jerusalem sa tuwid na guhit, sa ilalim ng malaking batong bakuran na kilala bilang Yungib ng mga Patriyarka o Haram al-Khalil. Nasa ibabaw nito ang punto sa mapa, wala pang isang kilometro mula sa Tel Rumeida, ang burol ng sinaunang Hebron, at mga 4 km mula sa Mamre, na pinangalanan ng Genesis sa tabi nito. Ang pagkakakilanlan ay umaabot man lamang sa panahong Herodiano, nang itayo ang bakuran, at hindi seryosong pinagtatalunan, bagaman hindi pa nahuhukay ang yungib mismo."
    - "Ibinibigay ng Genesis ang lugar nang detalyado: “ang parang ni Ephron na nasa Macpela, na nasa tapat ng Mamre, ang parang at ang yungib na nandoon”. Binili ito ni Abraham upang ilibing si Sara, “sa yungib ng parang sa Macpela sa tapat ng Mamre (na siyang Hebron) sa lupain ng Canaan”, at inilibing doon nina Isaac at Ismael si Abraham. Sa kaniyang pagkamatay sa Egipto, itinala ni Jacob ang mga nakahimlay doon: “Na doon nila inilibing si Abraham at si Sara na kaniyang asawa; na doon nila inilibing si Isaac at si Rebeca na kaniyang asawa; at doon ko inilibing si Lea”; iniahon din siya ng kaniyang mga anak at inilibing doon."
    - "Ang bakuran, na mga 59 sa 34 m, ay iniuugnay kay Herodes na Dakila dahil sa pagkakahawig sa mga pader ng Bundok ng Templo. Ang isang simbahan sa loob nito ay naging moske pagkatapos ng pananakop ng mga Arabe, muling simbahan sa ilalim ng mga Krusado at moske sa ilalim ni Saladin. Sarado ang yungib sa ilalim ng sahig; mga cenotaph sa itaas nito ang nakikita ng mga bisita. Mula 1994, nahati ang gusali sa pagitan ng isang moske at isang sinagoga, at noong 2017 itinala ng UNESCO ang lumang bayan ng Hebron kasama ang santuwaryo."
  da:
    - "I Hebron, i Judas bjerge ca. 30 km syd for Jerusalem i fugleflugt, under den store stenindhegning kendt som Patriarkernes Hule eller Haram al-Khalil. Kortets punkt står på den, mindre end en kilometer fra Tel Rumeida, det antikke Hebrons tell, og ca. 4 km fra Mamre, som Første Mosebog nævner ved siden af den. Identifikationen går tilbage til mindst den herodianske periode, da indhegningen blev bygget, og er ikke seriøst omstridt, selv om selve hulen ikke er udgravet."
    - "Første Mosebog angiver stedet nøje: »Efrons Ager, som er ved Makpela, som er tværs over for Mamre, Ageren og Hulen, som er paa den«. Abraham købte den for at begrave Sara, »i Hulen paa Ageren, i Makpela tværs over for Mamre, det er Hebron i Kanaans Land«, og Isak og Ismael begravede Abraham dér. Døende i Egypten opregnede Jakob dem, der lå i den: »Der have de begravet Abraham og Sara, hans Hustru; der have de begravet Isak og Rebekka, hans Hustru; og der har jeg begravet Lea«; hans sønner førte ham op og begravede ham også dér."
    - "Indhegningen, ca. 59 gange 34 m, tilskrives Herodes den Store på grund af dens lighed med Tempelbjergets mure. En kirke inde i den blev til en moske efter den arabiske erobring, igen en kirke under korsfarerne og en moske under Saladin. Hulen under gulvet er lukket; besøgende ser kenotafer over den. Siden 1994 har bygningen været delt mellem en moske og en synagoge, og i 2017 optog UNESCO Hebrons gamle bydel med helligdommen på verdensarvslisten."
