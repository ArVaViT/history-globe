id: where-was-the-cave-of-machpelah
question:
  en: "Where is the cave of Machpelah, the tomb of the patriarchs?"
  ru: "Где находится пещера Махпела, гробница патриархов?"
  uk: "Де міститься печера Махпела, гробниця патріархів?"
  es: "¿Dónde está la cueva de Macpela, la tumba de los patriarcas?"
  pt: "Onde fica a caverna de Macpela, o túmulo dos patriarcas?"
  de: "Wo liegt die Höhle Machpela, das Grab der Patriarchen?"
  fr: "Où se trouve la caverne de Macpéla, le tombeau des patriarches ?"
answer:
  en:
    - "In Hebron, in the hills of Judah about 30 km south of Jerusalem in a straight line, under the great stone enclosure known as the Cave of the Patriarchs or the Haram al-Khalil. The map point stands on it, less than a kilometre from Tel Rumeida, the mound of ancient Hebron, and about 4 km from Mamre, which Genesis names beside it. The identification goes back at least to the Herodian period, when the enclosure was built, and is not seriously disputed, though the cave itself has not been excavated."
    - "Genesis gives the place in detail: “the field of Ephron, which was in Machpelah, which was before Mamre, the field, and the cave which was therein”. Abraham bought it to bury Sarah, “in the cave of the field of Machpelah before Mamre: the same is Hebron in the land of Canaan”, and Isaac and Ishmael buried Abraham there. Dying in Egypt, Jacob listed those who lay in it: “There they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah”; his sons carried him up and buried him there too."
    - "The enclosure, about 59 by 34 m, is attributed to Herod the Great for its likeness to the walls of the Temple Mount. A church inside it became a mosque after the Arab conquest, a church again under the Crusaders and a mosque under Saladin. The cave below the floor is closed; visitors see cenotaphs above it. Since 1994 the building has been divided between a mosque and a synagogue, and in 2017 UNESCO inscribed the old town of Hebron with the sanctuary."
  ru:
    - "В Хевроне, в Иудейских горах примерно в 30 км к югу от Иерусалима по прямой, под огромной каменной оградой, известной как Пещера патриархов или Харам-эль-Халиль. Точка карты стоит на ней, меньше чем в километре от Тель-Румейды, холма древнего Хеврона, и примерно в 4 км от Мамре, которое Бытие называет рядом с ней. Отождествление восходит по меньшей мере ко временам Ирода, когда построили ограду, и всерьёз не оспаривается, хотя саму пещеру не раскапывали."
    - "Бытие описывает место подробно: «поле Ефроново, которое при Махпеле, против Мамре, поле и пещера, которая на нем». Авраам купил его, чтобы похоронить Сарру «в пещере поля в Махпеле, против Мамре, что ныне Хеврон, в земле Ханаанской», и там Исаак и Измаил погребли самого Авраама. Умирая в Египте, Иаков перечислил тех, кто там лежит: «там похоронили Авраама и Сарру, жену его; там похоронили Исаака и Ревекку, жену его; и там похоронил я Лию»; сыновья отнесли его туда и похоронили и его."
    - "Ограду, около 59 на 34 м, приписывают Ироду Великому за сходство со стенами Храмовой горы. Церковь внутри неё после арабского завоевания стала мечетью, при крестоносцах снова церковью, а при Саладине — опять мечетью. Пещера под полом закрыта; посетители видят над ней кенотафы. С 1994 года здание разделено между мечетью и синагогой, а в 2017 году ЮНЕСКО внесла старый город Хеврона со святилищем в список Всемирного наследия."
  uk:
    - "У Хевроні, в пагорбах Юди приблизно за 30 км на південь від Єрусалима по прямій, під великою кам'яною огорожею, відомою як Печера патріархів, або Харам аль-Халіль. Точка на мапі стоїть на ній, менш ніж за кілометр від Тель-Румейди, пагорба давнього Хеврона, і приблизно за 4 км від Мамре, яке Книга Буття називає поруч із нею. Ототожнення сягає щонайменше іродіанської доби, коли було збудовано огорожу, і серйозно не оспорюється, хоча саму печеру не розкопували."
    - "Книга Буття подає місце докладно: «поле Ефронове в Махпелщинї, що навпроти Мамрійщини, поле й печера на йому». Авраам купив його, щоб поховати Сарру, «в печері Махпелевого поля, навпроти Мамрійщини. Се Геброн у Канаан землї», і Ісаак та Ізмаїл поховали там Авраама. Помираючи в Єгипті, Яків перелічив тих, хто лежить у ній: «Там поховано Авраама й Сарру, жону його; там поховано Ізаака й Ребеку, жену його, і там поховав я Лею»; його сини віднесли його й поховали там теж."
    - "Огорожу, близько 59 на 34 м, приписують Іродові Великому за подібність до мурів Храмової гори. Церква всередині неї стала мечеттю після арабського завоювання, знову церквою за хрестоносців і мечеттю за Салах ад-Діна. Печера під підлогою закрита; відвідувачі бачать кенотафи над нею. З 1994 р. будівлю розділено між мечеттю та синагогою, а 2017 р. ЮНЕСКО внесла старе місто Хеврона зі святинею до Списку."
  es:
    - "En Hebrón, en las colinas de Judá, a unos 30 km al sur de Jerusalén en línea recta, bajo el gran recinto de piedra conocido como la Cueva de los Patriarcas o el Haram al-Khalil. El punto del mapa está sobre él, a menos de un kilómetro de Tel Rumeida, el montículo de la antigua Hebrón, y a unos 4 km de Mamre, que el Génesis nombra junto a ella. La identificación se remonta al menos a la época herodiana, cuando se construyó el recinto, y no se discute seriamente, aunque la cueva en sí no ha sido excavada."
    - "El Génesis da el lugar con detalle: «la heredad de Ephrón que estaba en Macpela enfrente de Mamre, la heredad y la cueva que estaba en ella». Abraham la compró para sepultar a Sara «en la cueva de la heredad de Macpela enfrente de Mamre, que es Hebrón en la tierra de Canaán», e Isaac e Ismael sepultaron allí a Abraham. Al morir en Egipto, Jacob enumeró a quienes yacían en ella: «Allí sepultaron á Abraham y á Sara su mujer; allí sepultaron á Isaac y á Rebeca su mujer; allí también sepulté yo á Lea»; sus hijos lo llevaron hasta allí y también lo sepultaron."
    - "El recinto, de unos 59 por 34 m, se atribuye a Herodes el Grande por su semejanza con los muros del Monte del Templo. Una iglesia en su interior se convirtió en mezquita tras la conquista árabe, de nuevo en iglesia con los cruzados y en mezquita bajo Saladino. La cueva bajo el suelo está cerrada; los visitantes ven cenotafios sobre ella. Desde 1994 el edificio está dividido entre una mezquita y una sinagoga, y en 2017 la UNESCO inscribió la ciudad vieja de Hebrón con el santuario."
  pt:
    - "Em Hebrom, nas colinas de Judá, a cerca de 30 km ao sul de Jerusalém em linha reta, sob o grande recinto de pedra conhecido como Caverna dos Patriarcas ou Haram al-Khalil. O ponto do mapa fica sobre ele, a menos de um quilômetro de Tel Rumeida, o monte da antiga Hebrom, e a cerca de 4 km de Manre, que o Gênesis nomeia ao lado dela. A identificação remonta pelo menos ao período herodiano, quando o recinto foi construído, e não é seriamente contestada, embora a própria caverna não tenha sido escavada."
    - "O Gênesis dá o lugar em detalhe: “o campo de Efrom, que estava em Macpela, que ficava em frente a Manre, o campo, a caverna que nele estava”. Abraão o comprou para sepultar Sara, “na caverna do campo de Macpela, em frente a Manre (isto é, Hebrom), na terra de Canaã”, e Isaque e Ismael sepultaram Abraão ali. Morrendo no Egito, Jacó enumerou os que jaziam nela: “Lá sepultaram Abraão e Sara, sua mulher. Lá sepultaram Isaque e Rebeca, sua mulher, e lá eu sepultei Lia”; seus filhos o levaram e também o sepultaram ali."
    - "O recinto, de cerca de 59 por 34 m, é atribuído a Herodes, o Grande, por sua semelhança com as muralhas do monte do Templo. Uma igreja no interior tornou-se mesquita depois da conquista árabe, de novo igreja sob os cruzados e mesquita sob Saladino. A caverna abaixo do piso é fechada; os visitantes veem cenotáfios acima dela. Desde 1994 o edifício é dividido entre uma mesquita e uma sinagoga, e em 2017 a UNESCO inscreveu a cidade velha de Hebrom com o santuário."
  de:
    - "In Hebron, im Bergland von Juda, in der Luftlinie etwa 30 km südlich von Jerusalem, unter der großen Steinumfassung, die als Höhle der Patriarchen oder Haram al-Khalil bekannt ist. Der Kartenpunkt steht darauf, weniger als einen Kilometer von Tel Rumeida, dem Hügel des antiken Hebron, und etwa 4 km von Mamre, das die Genesis daneben nennt. Die Gleichsetzung reicht mindestens bis in die herodianische Zeit zurück, als die Umfassung gebaut wurde, und ist nicht ernsthaft umstritten, obwohl die Höhle selbst nicht ausgegraben ist."
    - "Die Genesis gibt den Ort genau an: „Ephrons Acker, darin die zwiefache Höhle ist, Mamre gegenüber“. Abraham kaufte ihn, um Sara zu begraben, „in der Höhle des Ackers, die zwiefach ist, Mamre gegenüber, das ist Hebron, im Lande Kanaan“, und Isaak und Ismael begruben Abraham dort. Jakob nannte in Ägypten sterbend, wer in ihr lag: „Daselbst haben sie Abraham begraben und Sara, sein Weib. Daselbst haben sie auch Isaak begraben und Rebekka, sein Weib. Daselbst habe ich auch Lea begraben“; seine Söhne brachten ihn hinauf und begruben auch ihn dort."
    - "Die Umfassung, etwa 59 mal 34 m, wird Herodes dem Großen zugeschrieben wegen ihrer Ähnlichkeit mit den Mauern des Tempelbergs. Eine Kirche darin wurde nach der arabischen Eroberung zur Moschee, unter den Kreuzfahrern wieder zur Kirche und unter Saladin wieder zur Moschee. Die Höhle unter dem Boden ist verschlossen; Besucher sehen Kenotaphe darüber. Seit 1994 ist das Gebäude zwischen einer Moschee und einer Synagoge geteilt, und 2017 nahm die UNESCO die Altstadt von Hebron mit dem Heiligtum in die Welterbeliste auf."
  fr:
    - "À Hébron, dans les collines de Juda, à environ 30 km au sud de Jérusalem à vol d’oiseau, sous la grande enceinte de pierre connue sous le nom de Caveau des Patriarches ou de Haram al-Khalil. Le point de la carte s’y trouve, à moins d’un kilomètre de Tel Rumeida, le tertre de l’antique Hébron, et à environ 4 km de Mamré, que la Genèse nomme à côté. L’identification remonte au moins à l’époque hérodienne, où l’enceinte fut bâtie, et n’est pas sérieusement contestée, bien que la caverne elle-même n’ait pas été fouillée."
    - "La Genèse donne le lieu en détail : « Le champ d’Éphron à Macpéla, vis-à-vis de Mamré, le champ et la caverne qui y est ». Abraham l’acheta pour enterrer Sara, « dans la caverne du champ de Macpéla, vis-à-vis de Mamré, qui est Hébron, dans le pays de Canaan », et Isaac et Ismaël y enterrèrent Abraham. Mourant en Égypte, Jacob énuméra ceux qui y reposaient : « Là on a enterré Abraham et Sara, sa femme ; là on a enterré Isaac et Rebecca, sa femme ; et là j’ai enterré Léa » ; ses fils le transportèrent et l’y enterrèrent lui aussi."
    - "L’enceinte, d’environ 59 sur 34 m, est attribuée à Hérode le Grand à cause de sa ressemblance avec les murs du mont du Temple. Une église à l’intérieur devint mosquée après la conquête arabe, de nouveau église sous les croisés et mosquée sous Saladin. La caverne sous le sol est fermée ; les visiteurs voient des cénotaphes au-dessus. Depuis 1994, le bâtiment est partagé entre une mosquée et une synagogue, et en 2017 l’UNESCO a inscrit la vieille ville d’Hébron avec le sanctuaire."
