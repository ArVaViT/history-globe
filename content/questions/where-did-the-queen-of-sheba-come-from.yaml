id: where-did-the-queen-of-sheba-come-from
question:
  en: "Where did the Queen of Sheba come from?"
  ru: "Откуда пришла царица Савская?"
  uk: "Звідки була цариця Шеви?"
  es: "¿De dónde venía la reina de Seba?"
  pt: "De onde veio a rainha de Sabá?"
  de: "Woher kam die Königin von Scheba?"
  fr: "D’où venait la reine de Séba ?"
  pl: "Skąd pochodziła królowa Szeby?"
  it: "Da dove veniva la regina di Saba?"
  nl: "Waar kwam de koningin van Scheba vandaan?"
  cs: "Odkud pocházela královna ze Šeby?"
  sv: "Varifrån kom drottningen av Saba?"
  nb: "Hvor kom dronningen av Sjeba fra?"
  tl: "Saan nagmula ang Reina ng Seba?"
  da: "Hvor kom dronningen af Sjeba fra?"
answer:
  en:
    - "Most scholars place Sheba in south-western Arabia, the kingdom of Saba in today's Yemen, with its capital at Marib; the map point for Sheba stands in Yemen about 2,040 km south-south-east of Jerusalem in a straight line. From there the incense road ran north through the oases of the Hejaz to Dedan, some 1,400 km on, and on through Edom to Gaza and Jerusalem, a journey of months by camel. Ethiopia claims her too: its tradition names her Makeda and makes her the mother, by Solomon, of Menelik, the first of its kings. Josephus called her the queen of Egypt and Ethiopia. The Bible gives her no name and no city, and in the Gospels she is “The queen of the south”."
    - "Kings tells the visit: “And when the queen of Sheba heard of the fame of Solomon concerning the name of the LORD, she came to prove him with hard questions. And she came to Jerusalem with a very great train, with camels that bare spices, and very much gold, and precious stones”. She gave “an hundred and twenty talents of gold, and of spices very great store, and precious stones: there came no more such abundance of spices as these which the queen of Sheba gave to king Solomon”, and “she turned and went to her own country, she and her servants”. Jesus says that she “came from the uttermost parts of the earth to hear the wisdom of Solomon”. Sheba is elsewhere the land of gold and incense: Ezekiel's “merchants of Sheba and Raamah” traded “with chief of all spices, and with all precious stones, and gold”, and Isaiah's camels from Sheba “bring gold and incense”."
    - "Saba is well known from the great dam at Marib and from its inscriptions, but the inscriptions begin in the eighth century BC, two centuries after Solomon, and no Sabaean queen is recorded. In the eighth and seventh centuries Assyrian kings did receive tribute from Sabaeans and fought queens who ruled Arab tribes in the north, Zabibe and Samsi; some scholars think the story reflects such northern queens or a later age of Sabaean trade, others that Sabaean caravans were already reaching the north in the tenth century. The Ethiopian Kebra Nagast, compiled in the fourteenth century, carries her to Aksum with the ark. Genesis's table of nations lists Sheba twice, among the sons of Cush through Raamah and among the sons of Joktan in Arabia, which has fed both claims."
  ru:
    - "Большинство учёных помещает Саву в юго-западной Аравии — царство Саба в нынешнем Йемене со столицей в Марибе; точка Савы на карте стоит в Йемене примерно в 2040 км к юго-юго-востоку от Иерусалима по прямой. Оттуда дорога благовоний шла на север через оазисы Хиджаза к Дедану, ещё примерно 1400 км, и дальше через Едом к Газе и Иерусалиму — месяцы пути на верблюдах. На неё притязает и Эфиопия: тамошнее предание зовёт её Македой и делает матерью Менелика, рождённого от Соломона, первого из её царей. Иосиф Флавий называл её царицей Египта и Эфиопии. Библия не даёт ей ни имени, ни города, а в Евангелии она — «Царица южная»."
    - "Книга Царств рассказывает о визите: «Царица Савская, услышав о славе Соломона во имя Господа, пришла испытать его загадками. И пришла она в Иерусалим с весьма большим богатством: верблюды навьючены были благовониями и великим множеством золота и драгоценными камнями». Она подарила «сто двадцать талантов золота и великое множество благовоний и драгоценные камни; никогда еще не приходило такого множества благовоний, какое подарила царица Савская царю Соломону», и «отправилась она обратно в свою землю, она и все слуги ее». Иисус говорит, что «она приходила от пределов земли послушать мудрости Соломоновой». В других местах Сава — страна золота и благовоний: «Купцы из Савы и Раемы торговали с тобою всякими лучшими благовониями и всякими дорогими камнями, и золотом», говорит Иезекииль, а у Исаии верблюды «из Савы придут, принесут золото и ладан»."
    - "Саба хорошо известна по великой плотине в Марибе и по своим надписям, но надписи начинаются в VIII веке до н. э., через два столетия после Соломона, и ни одной сабейской царицы в них нет. В VIII–VII веках ассирийские цари получали дань от сабеев и воевали с царицами арабских племён на севере — Забибой и Самси; одни учёные думают, что рассказ отражает таких северных цариц или позднейшую пору сабейской торговли, другие — что сабейские караваны доходили до севера уже в X веке. Эфиопская «Кебра Нагаст», составленная в XIV веке, уводит её в Аксум вместе с ковчегом. Родословие народов в Бытии называет Шеву дважды — среди сынов Хуша через Рааму и среди сынов Иоктана в Аравии, — что питает оба притязания."
  uk:
    - "Більшість учених розміщує Шеву в південно-західній Аравії, царство Саба в нинішньому Ємені зі столицею в Марібі; точка мапи для Шеви стоїть у Ємені приблизно за 2040 км на південь-південний схід від Єрусалиму по прямій. Звідти дорога ладану йшла на північ через оази Хіджазу до Дедану, ще приблизно 1400 км, і далі через Едом до Гази й Єрусалиму — подорож на місяці верхи на верблюдах. На неї претендує й Ефіопія: її традиція називає її Македа і робить її матір'ю, від Соломона, Менеліка, першого з її царів. Йосиф Флавій називав її царицею Єгипту й Ефіопії. Біблія не дає їй ні імені, ні міста, а в Євангеліях вона — «Полуденна цариця»."
    - "Книга Царів розповідає про візит: «Як же перечула цариця Сабська чутку про славу Соломонову в імя Господнє, прибула вона випробувати його загадками. Прибула ж вона в Ерусалим з вельми великим двором, а верблюди несли пахощі й премного золота й дорогоцїнного каміння». Вона подарувала «цареві сто й двайцять талантів золота й велике множество пахощів і благородного каміння. Нїколи ще не приходило стільки пахощів, як подарувала цариця Сабська цареві Соломонові», і «пустилась вона в дорогу додому, вона й вся прислуга її». Ісус каже, що вона «прийшла з найдальших країн землї слухати премудростї Соломонової». Шева в інших місцях — земля золота й ладану: у Єзекіїля «Купцї Сабайські й Раемські торгували з тобою всякими найлучшими пахощами й усяким дорогим каміннєм, а золотом платили вони за товари твої», а Ісаїні верблюди з Шеви «привезуть золото й ладан»."
    - "Саба добре відома з великої греблі в Марібі та зі своїх написів, але написи починаються в VIII ст. до н. е., через два століття після Соломона, і жодної сабейської цариці не зафіксовано. У VIII і VII ст. ассирійські царі справді отримували данину від сабейців і воювали з царицями, що правили арабськими племенами на півночі, Забібе та Самсі; одні вчені вважають, що розповідь відбиває таких північних цариць або пізнішу добу сабейської торгівлі, інші — що сабейські каравани вже доходили на північ у X ст. Ефіопська Кебра Нагаст, укладена в XIV ст., несе її в Аксум із ковчегом. Таблиця народів у Книзі Буття перелічує Шеву двічі, серед синів Куша через Раему й серед синів Йоктана в Аравії, що живило обидві претензії."
  es:
    - "La mayoría de los estudiosos sitúa Seba en el suroeste de Arabia, el reino de Saba, en el actual Yemen, con su capital en Marib; el punto del mapa para Seba está en Yemen, a unos 2040 km al sur-sureste de Jerusalén en línea recta. Desde allí el camino del incienso iba hacia el norte por los oasis del Hiyaz hasta Dedán, a unos 1400 km, y seguía por Edom hasta Gaza y Jerusalén, un viaje de meses en camello. Etiopía también la reclama: su tradición la llama Makeda y la hace madre de Menelik, hijo de Salomón y primero de sus reyes. Josefo la llamó reina de Egipto y Etiopía. La Biblia no le da nombre ni ciudad, y en los Evangelios es «La reina del Austro»."
    - "Reyes cuenta la visita: «Y oyendo la reina de Seba la fama de Salomón en el nombre de Jehová, vino á probarle con preguntas. Y vino á Jerusalem con muy grande comitiva, con camellos cargados de especias, y oro en grande abundancia, y piedras preciosas». Dio «ciento y veinte talentos de oro, y muy mucha especiería, y piedras preciosas: nunca vino tan grande copia de especias, como la reina de Seba dió al rey Salomón», y «ella se volvió, y se fué á su tierra con sus criados». Jesús dice que «vino de los fines de la tierra para oir la sabiduría de Salomón». Seba es en otros lugares la tierra del oro y del incienso: «Los mercaderes de Seba y de Raama» de Ezequiel comerciaban «con lo principal de toda especiería, y toda piedra preciosa, y oro», y los camellos de Seba de Isaías «traerán oro é incienso»."
    - "Saba es bien conocida por la gran presa de Marib y por sus inscripciones, pero las inscripciones comienzan en el siglo VIII a. C., dos siglos después de Salomón, y no se registra ninguna reina sabea. En los siglos VIII y VII los reyes asirios recibieron en efecto tributo de sabeos y combatieron a reinas que gobernaban tribus árabes en el norte, Zabibe y Samsi; algunos estudiosos piensan que el relato refleja tales reinas del norte o una época posterior del comercio sabeo, otros que las caravanas sabeas ya llegaban al norte en el siglo X. El Kebra Nagast etíope, compilado en el siglo XIV, la lleva a Aksum con el arca. La tabla de las naciones de Génesis menciona Seba dos veces, entre los hijos de Cus por Raama y entre los hijos de Joctán en Arabia, lo que ha alimentado ambas pretensiones."
  pt:
    - "A maioria dos estudiosos situa Sabá no sudoeste da Arábia, o reino de Saba no Iêmen de hoje, com capital em Marib; o ponto do mapa para Sabá está no Iêmen, a cerca de 2.040 km a sul-sudeste de Jerusalém em linha reta. De lá a rota do incenso seguia ao norte pelos oásis do Hejaz até Dedã, uns 1.400 km adiante, e por Edom até Gaza e Jerusalém, viagem de meses de camelo. A Etiópia também a reivindica: sua tradição a chama Makeda e a faz mãe, por Salomão, de Menelik, o primeiro de seus reis. Josefo a chamou de rainha do Egito e da Etiópia. A Bíblia não lhe dá nome nem cidade, e nos Evangelhos ela é “a Rainha do Sul”."
    - "Reis conta a visita: “Quando a rainha de Sabá ouviu falar da fama de Salomão, por causa do nome do SENHOR, ela veio testá-lo com perguntas difíceis. Ela veio a Jerusalém com uma caravana muito grande, com camelos que carregavam especiarias, muitíssimo ouro e pedras preciosas”. Deu “cento e vinte talentos de ouro, e uma quantidade muito grande de especiarias, e pedras preciosas. Nunca mais houve tal abundância de especiarias como estas que a rainha de Sabá deu ao rei Salomão”, e “ela se virou e foi para a sua própria terra, ela e os seus servos”. Jesus diz que ela “veio dos confins da terra para ouvir a sabedoria de Salomão”. Sabá é noutros lugares a terra do ouro e do incenso: os “comerciantes de Sabá e Raamá” de Ezequiel trocavam “a melhor de todas as especiarias, todas as pedras preciosas e ouro”, e os camelos de Sabá em Isaías “trarão ouro e incenso”."
    - "Saba é bem conhecida pela grande represa de Marib e por suas inscrições, mas as inscrições começam no século VIII a.C., dois séculos depois de Salomão, e nenhuma rainha sabeia é registrada. Nos séculos VIII e VII reis assírios receberam de fato tributo de sabeus e combateram rainhas que governavam tribos árabes no norte, Zabibe e Samsi; alguns estudiosos acham que a história reflete tais rainhas do norte ou uma época posterior do comércio sabeu, outros que caravanas sabeias já chegavam ao norte no século X. O Kebra Nagast etíope, compilado no século XIV, a leva a Aksum com a arca. A tabela das nações de Gênesis lista Sabá duas vezes, entre os filhos de Cuxe por Raamá e entre os filhos de Joctã na Arábia, o que alimentou as duas reivindicações."
  de:
    - "Die meisten Gelehrten verorten Scheba im Südwesten Arabiens, im Königreich Saba im heutigen Jemen mit der Hauptstadt Marib; der Kartenpunkt für Scheba liegt im Jemen, in der Luftlinie etwa 2040 km südsüdöstlich von Jerusalem. Von dort verlief die Weihrauchstraße nordwärts durch die Oasen des Hedschas nach Dedan, etwa 1400 km weiter, und durch Edom nach Gaza und Jerusalem, eine Reise von Monaten per Kamel. Auch Äthiopien beansprucht sie: Seine Überlieferung nennt sie Makeda und macht sie zur Mutter Meneliks von Salomo, des ersten seiner Könige. Josephus nannte sie die Königin von Ägypten und Äthiopien. Die Bibel gibt ihr keinen Namen und keine Stadt, und in den Evangelien ist sie „Die Königin von Mittag“."
    - "Die Könige erzählen den Besuch: „Und da das Gerücht von Salomo und von dem Namen des HERRN kam vor die Königin von Reicharabien, kam sie, Salomo zu versuchen mit Rätseln. Und sie kam gen Jerusalem mit sehr vielem Volk, mit Kamelen, die Spezerei trugen und viel Gold und Edelsteine.“ Sie gab „hundertzwanzig Zentner Gold und sehr viel Spezerei und Edelgestein. Es kam nicht mehr so viel Spezerei, als die Königin von Reicharabien dem König Salomo gab“, und „sie wandte sich und zog in ihr Land samt ihren Knechten“. Jesus sagt, sie „kam vom Ende der Erde, Salomons Weisheit zu hören“. Scheba ist anderswo das Land von Gold und Weihrauch: Hesekiels „Kaufleute aus Saba und Ragma“ handelten „allerlei köstliche Spezerei und Edelsteine und Gold“, und Jesajas Kamele aus Saba „Gold und Weihrauch bringen“."
    - "Saba ist durch den großen Damm von Marib und seine Inschriften wohlbekannt, doch die Inschriften beginnen im 8. Jahrhundert v. Chr., zwei Jahrhunderte nach Salomo, und keine sabäische Königin ist bezeugt. Im 8. und 7. Jahrhundert erhielten assyrische Könige tatsächlich Tribut von Sabäern und bekämpften Königinnen, die über arabische Stämme im Norden herrschten, Zabibe und Samsi; manche Gelehrte denken, die Erzählung spiegle solche nördlichen Königinnen oder eine spätere Zeit des sabäischen Handels, andere, dass sabäische Karawanen schon im 10. Jahrhundert den Norden erreichten. Der äthiopische Kebra Nagast, im 14. Jahrhundert zusammengestellt, trägt sie mit der Lade nach Aksum. Die Völkertafel der Genesis führt Scheba zweimal auf, unter den Söhnen von Kusch über Ragma und unter den Söhnen Joktans in Arabien, was beide Ansprüche genährt hat."
  fr:
    - "La plupart des savants placent Séba dans le sud-ouest de l’Arabie, le royaume de Saba dans l’actuel Yémen, avec sa capitale à Marib ; le point de la carte pour Séba est au Yémen, à environ 2 040 km au sud-sud-est de Jérusalem en ligne droite. De là, la route de l’encens montait vers le nord par les oasis du Hedjaz jusqu’à Dedan, quelque 1 400 km plus loin, puis par Édom jusqu’à Gaza et Jérusalem, voyage de plusieurs mois à dos de chameau. L’Éthiopie la revendique aussi : sa tradition la nomme Makeda et en fait la mère, par Salomon, de Ménélik, le premier de ses rois. Josèphe l’appelait la reine d’Égypte et d’Éthiopie. La Bible ne lui donne ni nom ni ville, et dans les Évangiles elle est « la reine du Midi »."
    - "Selon les Rois, « la reine de Séba apprit la renommée que possédait Salomon, à la gloire de l’Éternel, et elle vint pour l’éprouver par des énigmes. Elle arriva à Jérusalem avec une suite fort nombreuse, et avec des chameaux portant des aromates, de l’or en très grande quantité, et des pierres précieuses. » Elle donna « cent vingt talents d’or, une très grande quantité d’aromates, et des pierres précieuses. Il ne vint plus autant d’aromates que la reine de Séba en donna au roi Salomon », et « elle s’en retourna et alla dans son pays, elle et ses serviteurs ». Jésus : « elle vint des extrémités de la terre pour entendre la sagesse de Salomon ». Séba, c’est aussi l’or et l’encens : les « marchands de Séba et de Raema » d’Ézéchiel trafiquaient « de tous les meilleurs aromates, de toute espèce de pierres précieuses et d’or », les chameaux de Séba d’Ésaïe « porteront de l’or et de l’encens »."
    - "Saba est bien connue par le grand barrage de Marib et par ses inscriptions, mais celles-ci commencent au VIIIe siècle av. J.-C., deux siècles après Salomon, et aucune reine sabéenne n’est attestée. Aux VIIIe et VIIe siècles, des rois assyriens reçurent bien un tribut de Sabéens et combattirent des reines qui gouvernaient des tribus arabes au nord, Zabibé et Samsi ; certains savants pensent que le récit reflète de telles reines du nord ou une époque postérieure du commerce sabéen, d’autres que des caravanes sabéennes atteignaient déjà le nord au Xe siècle. Le Kebra Nagast éthiopien, compilé au XIVe siècle, la mène à Aksoum avec l’arche. Le tableau des nations de la Genèse mentionne Séba deux fois, parmi les fils de Cusch par Raema et parmi les fils de Joktan en Arabie, ce qui a nourri les deux thèses."
  pl:
    - "Większość uczonych umieszcza Szebę w południowo-zachodniej Arabii, królestwo Saba w dzisiejszym Jemenie, ze stolicą w Marib; punkt na mapie dla Szeby stoi w Jemenie około 2040 km na południe-południowy wschód od Jerozolimy w linii prostej. Stamtąd szlak kadzidlany biegł na północ przez oazy Hidżazu do Dedanu, jakieś 1400 km dalej, i dalej przez Edom do Gazy i Jerozolimy, w podróży trwającej miesiące na wielbłądach. Etiopia też o nią zabiega: jej tradycja nazywa ją Makeda i czyni ją matką, z Salomonem, Menelika, pierwszego z jej królów. Józef Flawiusz nazywał ją królową Egiptu i Etiopii. Biblia nie podaje jej imienia ani miasta, a w Ewangeliach jest „Królową z południa”."
    - "Księgi Królewskie opowiadają wizytę: „A królowa z Saby usłyszawszy sławę o Salomonie i o imieniu Pańskiem przyjechała, aby go doświadczyła w zagadkach. I wjechała do Jeruzalemu z wielkim bardzo pocztem, z wielbłądami niosącemi rzeczy wonne, i złota bardzo wiele, i kamienia drogiego”. Dała „sto i dwadzieścia talentów złota, i rzeczy wonnych bardzo wiele, i kamienia drogiego. Nie przyszło nigdy potem tak wiele wonnych rzeczy, jako dała królowa z Saby królowi Salomonowi”, a potem „odjechawszy, wróciła się do ziemi swojej, ona i słudzy jej”. Jezus mówi, że „przyszła od krajów ziemi, aby słuchała mądrości Salomonowej”. Szeba jest gdzie indziej krainą złota i kadzidła: u Ezechiela „kupcy Sabejscy i z Ramy” handlowali „wszelakiemi przedniejszemi wonnemi rzeczami, i wszelakim kamieniem drogim i złotem”, a wielbłądy Izajasza z Saby „złoto i kadzidło przyniosą”."
    - "Saba jest dobrze znana z wielkiej tamy w Marib i z napisów, ale napisy zaczynają się w VIII wieku p.n.e., dwa wieki po Salomonie, i nie odnotowano żadnej sabejskiej królowej. W VIII i VII wieku królowie asyryjscy przyjmowali daninę od Sabejczyków i walczyli z królowymi, które rządziły plemionami arabskimi na północy, Zabibe i Samsi; niektórzy uczeni sądzą, że opowieść odbija takie północne królowe albo późniejszą epokę handlu sabejskiego, inni, że karawany sabejskie docierały na północ już w X wieku. Etiopski Kebra Nagast, spisany w XIV wieku, zanosi ją do Aksum z arką. Tablica narodów w Księdze Rodzaju wymienia Szebę dwukrotnie, wśród synów Kusza przez Raamę i wśród synów Joktana w Arabii, co podsyciło obie tezy."
  it:
    - "La maggior parte degli studiosi colloca Saba nell’Arabia sud-occidentale, il regno di Saba nell’odierno Yemen, con capitale a Marib; il punto della mappa per Saba sta nello Yemen a circa 2.040 km a sud-sud-est di Gerusalemme in linea retta. Di lì la via dell’incenso saliva a nord attraverso le oasi dell’Hegiaz fino a Dedan, circa 1.400 km oltre, e poi per Edom fino a Gaza e Gerusalemme, un viaggio di mesi a dorso di cammello. Anche l’Etiopia la rivendica: la sua tradizione la chiama Makeda e ne fa la madre, da Salomone, di Menelik, il primo dei suoi re. Giuseppe Flavio la chiamò regina d’Egitto e d’Etiopia. La Bibbia non le dà né nome né città, e nei Vangeli è «La regina del Mezzodì»."
    - "I Re raccontano la visita: «la regina di Sceba avendo udito la fama che circondava Salomone a motivo del nome dell’Eterno, venne a metterlo alla prova con degli enimmi. Essa giunse a Gerusalemme con un numerosissimo séguito, con cammelli carichi di aromi, d’oro in gran quantità, e di pietre preziose». Ella donò «centoventi talenti d’oro, grandissima quantità di aromi, e delle pietre preziose. Non furon mai più portati tanti aromi quanti ne diede la regina di Sceba al re Salomone», e «coi suoi servi se ne tornò al suo paese». Gesù dice che «venne dalle estremità della terra per udir la sapienza di Salomone». Saba è altrove la terra dell’oro e dell’incenso: «I mercanti di Sceba e di Raama» di Ezechiele trafficavano «di tutti i migliori aromi, d’ogni sorta di pietre preziose, e d’oro», e i cammelli di Sceba in Isaia vengono «portando oro ed incenso»."
    - "Saba è ben nota per la grande diga di Marib e per le sue iscrizioni, ma le iscrizioni cominciano nell’VIII secolo a.C., due secoli dopo Salomone, e non è registrata alcuna regina sabea. Nell’VIII e VII secolo i re assiri ricevettero davvero tributi dai Sabei e combatterono regine che governavano tribù arabe nel nord, Zabibe e Samsi; alcuni studiosi pensano che la storia rifletta tali regine settentrionali o un’epoca più tarda del commercio sabeo, altri che le carovane sabee raggiungessero già il nord nel X secolo. Il Kebra Nagast etiope, compilato nel XIV secolo, la porta ad Aksum con l’arca. La tavola dei popoli della Genesi elenca Saba due volte, tra i figli di Cus per Raama e tra i figli di Ioktan in Arabia, il che ha alimentato entrambe le rivendicazioni."
  nl:
    - "De meeste geleerden plaatsen Scheba in Zuidwest-Arabië, het koninkrijk Saba in het huidige Jemen met Marib als hoofdstad; het punt op de kaart voor Scheba staat in Jemen, hemelsbreed ongeveer 2.040 km zuid-zuidoostelijk van Jeruzalem. Van daar liep de wierookroute naar het noorden door de oases van de Hidzjaz naar Dedan, zo’n 1.400 km verder, en door Edom naar Gaza en Jeruzalem, een reis van maanden per kameel. Ook Ethiopië claimt haar: zijn overlevering noemt haar Makeda en maakt haar de moeder, bij Salomo, van Menelik, de eerste van zijn koningen. Josephus noemde haar de koningin van Egypte en Ethiopië. De Bijbel geeft haar geen naam en geen stad, en in de Evangeliën is zij “De koningin van het zuiden”."
    - "Koningen vertelt het bezoek: “En toen de koningin van Scheba het gerucht van Salomo hoorde, aangaande den Naam des HEEREN, kwam zij, om hem met raadselen te verzoeken. En zij kwam te Jeruzalem, met een zeer zwaar heir, met kemelen, dragende specerijen, en zeer veel gouds, en kostelijk gesteente”. Zij gaf “honderd en twintig talenten gouds, en zeer veel specerijen, en kostelijk gesteente; als deze specerij, die de koningin van Scheba den koning Salomo gaf, is er nooit meer in menigte gekomen”, en “zo keerde zij en toog in haar land, zij en haar knechten”. Jezus zegt dat zij “is gekomen van het einde der aarde, om te horen, de wijsheid van Salomo”. Scheba is elders het land van goud en wierook: Ezechiëls “kooplieden van Scheba en Raema” handelden “met alle hoofdspecerij, en met alle kostelijk gesteente en goud”, en Jesaja’s kemelen uit Scheba brengen “goud en wierook”."
    - "Saba is bekend van de grote dam bij Marib en van zijn inscripties, maar die beginnen in de achtste eeuw v.Chr., twee eeuwen na Salomo, en er is geen Sabese koningin vermeld. In de achtste en zevende eeuw ontvingen Assyrische koningen wel schatting van Sabaeërs en bestreden zij koninginnen die Arabische stammen in het noorden bestuurden, Zabibe en Samsi; sommige geleerden denken dat het verhaal zulke noordelijke koninginnen of een latere tijd van Sabese handel weerspiegelt, anderen dat Sabese karavanen al in de 10e eeuw het noorden bereikten. De Ethiopische Kebra Nagast, in de 14e eeuw samengesteld, voert haar met de ark naar Aksum. Genesis’ volkerentafel noemt Scheba tweemaal, onder de zonen van Kus via Raäma en onder de zonen van Joktan in Arabië, wat beide claims heeft gevoed."
  cs:
    - "Většina badatelů klade Šebu do jihozápadní Arábie, království Saba v dnešním Jemenu s hlavním městem Maribem; bod na mapě pro Šebu stojí v Jemenu asi 2 040 km jihojihovýchodně od Jeruzaléma vzdušnou čarou. Odtud vedla kadidlová stezka na sever oázami Hidžázu do Dedanu, dalších asi 1 400 km, a dál přes Edóm do Gazy a Jeruzaléma, cesta na měsíce na velbloudu. Nárokuje si ji i Etiopie: její tradice ji nazývá Makeda a činí ji matkou Menelika, prvního z jejích králů, se Šalomounem. Josephus Flavius ji nazval královnou Egypta a Etiopie. Bible jí nedává žádné jméno ani město a v evangeliích je „Královna od poledne“."
    - "První kniha Královská vypráví návštěvu: „Uslyševši pak královna z Sáby pověst o Šalomounovi a jménu Hospodinovu, přijela, aby zkusila jeho v pohádkách. A přijevši do Jeruzaléma s počtem velmi velikým, s velbloudy nesoucími vonné věci a zlata velmi mnoho i kamení drahého, přišla k Šalomounovi“. Dala králi „sto a dvadceti centnéřů zlata, a vonných věcí velmi mnoho, i kamení drahého, aniž bylo kdy více přivezeno takových vonných věcí tak mnoho, jako darovala královna z Sáby králi Šalomounovi“ a „se navrátila do země své ona i služebníci její“. Ježíš praví, že „přijela od končin země, aby slyšela moudrost Šalomounovu“. Šeba je jinde zemí zlata a kadidla: Ezechielovi „Kupci Sabejští i Ragmejští“ obchodovali „ve všelijakých nejpřednějších vonných věcech, i ve všelijakém kamení drahém i zlatě“ a Izajášovi velbloudi ze Sáby „zlato a kadidlo přinesou“."
    - "Saba je dobře známa z velké přehrady v Maribu a z nápisů, ale nápisy začínají v 8. století př. n. l., dvě století po Šalomounovi, a žádná sabejská královna není zaznamenána. V 8. a 7. století asyrští králové skutečně přijímali tribut od Sabejských a bojovali s královnami vládnoucími arabským kmenům na severu, Zabibe a Samsi; někteří badatelé soudí, že příběh odráží takové severní královny nebo pozdější dobu sabejského obchodu, jiní, že sabejské karavany dosahovaly severu už v 10. století. Etiopská Kebra Nagast, sestavená ve 14. století, ji přenáší do Aksúmu s truhlou. Genesis v tabulce národů uvádí Šebu dvakrát, mezi syny Kúše přes Raemu a mezi syny Joktana v Arábii, což živilo oba nároky."
  sv:
    - "De flesta forskare förlägger Saba till sydvästra Arabien, kungariket Saba i dagens Jemen med huvudstad i Marib; kartpunkten för Saba står i Jemen omkring 2 040 km syd-sydost om Jerusalem fågelvägen. Därifrån gick rökelsevägen norrut genom Hijaz oaser till Dedan, omkring 1 400 km vidare, och vidare genom Edom till Gaza och Jerusalem, en färd på månader med kamel. Etiopien gör anspråk på henne också: dess tradition kallar henne Makeda och gör henne till mor, med Salomo, till Menelik, den förste av dess kungar. Josefus kallade henne drottning av Egypten och Etiopien. Bibeln ger henne inget namn och ingen stad, och i evangelierna är hon ”drottningen av Söderlandet”."
    - "Kungaböckerna: ”När drottningen av Saba fick höra ryktet om Salomo och vad han hade gjort för HERRENS namn, kom hon för att sätta honom på prov med svåra frågor. Hon kom till Jerusalem med ett mycket stort följe, med kameler, som buro välluktande kryddor och guld i stor myckenhet, så ock ädla stenar.” Hon gav ”åt konungen ett hundra tjugu talenter guld, så ock välluktande kryddor i stor myckenhet, därtill ädla stenar; en så stor myckenhet av välluktande kryddor ... har aldrig mer blivit införd”, och ”sedan vände hon om och for till sitt land igen med sina tjänare”. Jesus säger att hon ”kom från jordens ända för att höra Salomos visdom”. Saba är guld- och rökelseland: Hesekiels ”Sabas och Raemas köpmän” handlade med ”kryddor av allra yppersta slag och alla slags ädla stenar och guld”, och Jesajas kameler: ”från Saba skola de alla komma, guld och rökelse skola de bära”."
    - "Saba är väl känt från den stora dammen i Marib och från sina inskriptioner, men inskriptionerna börjar på 700-talet f.Kr., två århundraden efter Salomo, och ingen sabeisk drottning är känd. På 700- och 600-talen tog assyriska kungar emot tribut från sabeer och bekämpade drottningar som styrde arabiska stammar i norr, Zabibe och Samsi; vissa forskare tror att berättelsen speglar sådana nordliga drottningar eller en senare tid av sabeisk handel, andra att sabeiska karavaner redan nådde norrut på 900-talet. Den etiopiska Kebra Nagast, sammanställd på 1300-talet, för henne till Aksum med arken. Folkslagstabellen i 1 Mosebok nämner Saba två gånger, bland Kushs söner genom Raama och bland Joktans söner i Arabien, vilket har närt båda anspråken."
  nb:
    - "De fleste forskere plasserer Sjeba i det sørvestlige Arabia, kongeriket Saba i dagens Jemen, med hovedstaden Marib; kartpunktet for Sjeba står i Jemen omtrent 2 040 km sør-sørøst for Jerusalem i luftlinje. Derfra gikk røkelsesveien nordover gjennom oasene i Hejaz til Dedan, omtrent 1 400 km videre, og så gjennom Edom til Gasa og Jerusalem, en reise på måneder med kamel. Etiopia gjør også krav på henne: tradisjonen der kaller henne Makeda og gjør henne til mor, ved Salomo, til Menelik, den første av rikets konger. Josefus kalte henne dronning av Egypt og Etiopia. Bibelen gir henne verken navn eller by, og i evangeliene er hun «Dronningen fra Syden»."
    - "Kongebøkene forteller besøket: «Da dronningen av Saba hørte Salomos ry, som skyldtes Herrens navn, kom hun for å sette ham på prøve med gåter. Hun kom til Jerusalem med et stort følge, med kameler som bar krydderier og en stor mengde gull og dyre stener». Hun ga «hundre og tyve talenter gull og krydderier i stor mengde og dyre stener; aldri er det mere kommet en sådan mengde krydderier til landet som det dronningen av Saba gav kong Salomo», og «Så tok hun avsted og drog hjem til sitt land med sine tjenere». Jesus sier at hun «kom fra jordens ytterste ende for å høre Salomos visdom». Sjeba er ellers gullets og røkelsens land: Esekiels «Sjebas og Ramas kremmere» handlet «med beste slag av allehånde velluktende urter og med allehånde kostbare stener og gull», og Jesajas kameler fra Sjeba skal føre «gull og virak»."
    - "Saba er velkjent fra den store demningen i Marib og fra innskriftene, men innskriftene begynner på 700-tallet f.Kr., to århundrer etter Salomo, og ingen sabeisk dronning er opptegnet. På 700- og 600-tallet mottok assyriske konger riktignok tributt fra sabeere og kjempet mot dronninger som styrte arabiske stammer i nord, Zabibe og Samsi; noen forskere mener at fortellingen gjenspeiler slike nordlige dronninger eller en senere tid med sabeisk handel, andre at sabeiske karavaner allerede nådde nord på 900-tallet. Den etiopiske Kebra Nagast, samlet på 1300-tallet, fører henne til Aksum med arken. Folketavlen i 1 Mosebok lister Sjeba to ganger, blant Kusjs sønner gjennom Raema og blant Joktans sønner i Arabia, noe som har næret begge påstandene."
  tl:
    - "Inilalagay ng karamihan ng iskolar ang Seba sa timog-kanlurang Arabia, ang kaharian ng Saba sa Yemen ngayon, na may kabisera sa Marib; ang tuldok sa mapa para sa Seba ay nasa Yemen mga 2,040 km sa timog-timog-silangan ng Jerusalem sa tuwid na guhit. Mula roon, ang daan ng kamangyan ay pahilaga sa mga oasis ng Hejaz hanggang sa Dedan, mga 1,400 km pa, at sa Edom hanggang Gaza at Jerusalem, paglalakbay ng mga buwan sa kamelyo. Inaangkin din siya ng Etiopia: pinangalanan siyang Makeda ng tradisyon nito at ginawang ina, kay Salomon, ni Menelik, ang una sa mga hari nito. Tinawag siya ni Josephus na reina ng Egipto at Etiopia. Walang pangalan o lungsod na ibinibigay ang Biblia sa kaniya, at sa mga Ebanghelyo siya ang “reina ng timugan”."
    - "Sa Mga Hari: “At nang mabalitaan ng reina sa Seba ang kabantugan ni Salomon… ay naparoon siya upang subukin niya siya ng mga mahirap na tanong. At siya'y naparoon sa Jerusalem na may maraming kaakbay, may mga kamelyo na may pasang mga espesia at totoong maraming ginto, at mga mahalagang bato”. Nagbigay siya ng “isang daan at dalawang pung talentong ginto, at mga espesia na totoong sagana, at mga mahalagang bato…”, at “bumalik siya, at umuwi sa kaniyang sariling lupain, siya, at ang kaniyang mga lingkod”. Sabi ni Jesus, “nanggaling sa mga wakas ng lupa upang pakinggan ang karunungan ni Salomon”. Lupain din ng ginto at kamangyan ang Seba: ang “mga mangangalakal sa Seba at sa Raama” ni Ezekiel ay nagkalakal ng “mga pinakamainam na especia, at lahat na mahalagang bato, at ang ginto”, at ang kamelyo ni Isaias mula sa Seba ay “mangagdadala ng ginto at kamangyan”."
    - "Kilala ang Saba mula sa malaking dike sa Marib at sa mga inskripsiyon nito, ngunit nagsisimula ang mga inskripsiyon noong ikawalong siglo BK, dalawang siglo pagkatapos ni Salomon, at walang naitalang reinang Sabeo. Noong ikawalo at ikapitong siglo, tumanggap ng tributo ang mga haring Asirio mula sa mga Sabeo at nilabanan ang mga reinang namuno sa mga tribong Arabe sa hilaga, sina Zabibe at Samsi; iniisip ng ilan na sinasalamin ng kuwento ang gayong mga hilagang reina o ang mas huling kalakalang Sabeo, ng iba na naabot na ng mga karabanang Sabeo ang hilaga noong ikasampung siglo. Dinadala siya ng Kebra Nagast ng Etiopia, na pinagsama noong ika-14 na siglo, sa Aksum kasama ang kaban. Dalawang beses inililista ng talaan ng mga bansa sa Genesis ang Seba, sa mga anak ni Cush sa pamamagitan ni Raama at sa mga anak ni Joctan sa Arabia, na nagpakain sa parehong pag-aangkin."
  da:
    - "De fleste forskere placerer Sjeba i det sydvestlige Arabien, kongeriget Saba i nutidens Yemen med hovedstad i Marib; kortets punkt for Sjeba står i Yemen omkring 2.040 km sydsydøst for Jerusalem i luftlinje. Derfra løb røgelsesvejen nordpå gennem Hejaz' oaser til Dedan, omkring 1.400 km videre, og videre gennem Edom til Gaza og Jerusalem, en rejse på måneder med kamel. Etiopien gør også krav på hende: dens tradition kalder hende Makeda og gør hende, med Salomo, til moder til Menelik, den første af dens konger. Josefus kaldte hende dronning af Egypten og Etiopien. Bibelen giver hende intet navn og ingen by, og i evangelierne er hun »Sydens Dronning«."
    - "Kongebøgerne fortæller besøget: »Og Dronningen af Seba hørte Salomos Rygte i Herrens Navn og kom for at prøve ham med mørke Taler. Og hun kom til Jerusalem med en saare stor Skare, med Kameler, som bare vellugtende Urter og saare meget Guld og kostbare Stene.« Hun gav »Hundrede og tyve Centner Guld og saare mange vellugtende Urter og kostbare Stene, der kom ikke ydermere saadanne Urter i Mangfoldighed som disse, hvilke Dronningen af Seba gav Kong Salomo«, og »hun vendte om og drog til sit Land, hun og hendes Tjenere«. Jesus siger, at hun »kom fra Jordens Grænser for at høre Salomons Visdom«. Sjeba er andetsteds guldets og røgelsens land: Ezekiels »Kræmmere fra Seba og Raema« betalte for varerne »med det ypperste af alle Haande Urter« og med »kostbare Stene og Guld«, og Esajas' kameler fra Skeba »skulle bringe Guld og Røgelse«."
    - "Saba er velkendt fra den store dæmning ved Marib og fra sine indskrifter, men indskrifterne begynder i 700-tallet f.Kr., to århundreder efter Salomo, og ingen sabæisk dronning er optegnet. I 700- og 600-tallet modtog assyriske konger rigtignok tribut fra sabæere og kæmpede mod dronninger, der herskede over arabiske stammer i nord, Zabibe og Samsi; nogle forskere mener, at fortællingen afspejler sådanne nordlige dronninger eller en senere tid med sabæisk handel, andre at sabæiske karavaner allerede nåede nordpå i 900-tallet. Den etiopiske Kebra Nagast, samlet i 1300-tallet, fører hende til Aksum med arken. Første Mosebogs folketavle opregner Sjeba to gange, blandt Kusjs sønner gennem Raama og blandt Joktans sønner i Arabien, hvilket har næret begge krav."
