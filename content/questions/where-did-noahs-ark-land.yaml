id: where-did-noahs-ark-land
question:
  en: "Where did Noah's ark land?"
  ru: "Где остановился Ноев ковчег?"
  uk: "Де зупинився Ноїв ковчег?"
  es: "¿Dónde se posó el arca de Noé?"
  pt: "Onde pousou a arca de Noé?"
  de: "Wo landete die Arche Noahs?"
  fr: "Où l’arche de Noé s’est-elle posée ?"
  pl: "Gdzie osiadła arka Noego?"
  it: "Dove approdò l’arca di Noè?"
  nl: "Waar landde de ark van Noach?"
  cs: "Kde přistála Noemova archa?"
  sv: "Var landade Noas ark?"
  nb: "Hvor landet Noahs ark?"
  tl: "Saan dumaong ang daong ni Noe?"
  da: "Hvor landede Noas ark?"
  sr: "Где је пристао Нојев ковчег?"
  hu: "Hol akadt meg Noé bárkája?"
  fi: "Minne Nooan arkki pysähtyi?"
  vi: "Tàu Nô-ê cập bến ở đâu?"
  ro: "Unde a poposit corabia lui Noe?"
  bg: "Къде е спрял Ноевият ковчег?"
answer:
  en:
    - "Genesis says only that “the ark rested … upon the mountains of Ararat”, and Ararat is not a mountain but a country: the Hebrew name of Urartu, the kingdom around Lake Van in the highlands of eastern Turkey, Armenia and north-western Iran, which the Assyrians fought from the ninth to the seventh century BC. The map point for the region stands on the peak now called Mount Ararat, about 1,200 km north-east of Jerusalem in a straight line. Which peak the ark rested on the Bible does not say, and the traditions differ: that volcanic cone, 5,137 m, is the usual answer since the Middle Ages, while the older sources point to Mount Judi (Cudi Dağı), far to the south near the Tigris."
    - "The name recurs: Sennacherib's sons, having killed him, “escaped into the land of Armenia”, which the Hebrew calls Ararat, and Jeremiah summons against Babylon “the kingdoms of Ararat, Minni, and Ashchenaz”, Urartu and its neighbours. The flood story of Mesopotamia, on the eleventh tablet of the Epic of Gilgamesh, lands the boat of Uta-napishti on Mount Nimush, which Assyrian annals place in the Zagros east of the Tigris; the Mesopotamian tradition, too, looked to the northern mountains in general. Josephus says that the Armenians called the place the Landing and still showed remains of the ark; he cites Berossus, who puts them at the mountain of the Cordyaeans, the Gordyaean hills by the upper Tigris where Judi stands, and Nicolaus of Damascus, who names a great mountain Baris in Armenia."
    - "Mount Judi, above Cizre in south-eastern Turkey, is the ark's mountain in the Qur'an, al-Judi, and in the Syriac and early Armenian writers, whose mountains of Qardu are the Gordyaean mountains of the Greeks; Jacob of Nisibis was said to have climbed it for a plank of the ark. Mount Ararat itself, Masis to the Armenians and Ağrı Dağı to the Turks, is first tied to Noah in the eleventh and twelfth centuries, and western travellers, William of Rubruck in 1254 and then Marco Polo, carried the identification to Europe. Modern searches for the ark on both mountains have found nothing that archaeology accepts. The map point marks the region, as Genesis names it, and takes neither peak as certain."
  ru:
    - "Книга Бытия говорит лишь, что «остановился ковчег… на горах Араратских», а Арарат — не гора, а страна: еврейское имя Урарту, царства вокруг озера Ван в нагорьях восточной Турции, Армении и северо-западного Ирана, с которым ассирийцы воевали с IX по VII век до н. э. Точка карты для этой области стоит на вершине, которую ныне называют горой Арарат, примерно в 1200 км к северо-востоку от Иерусалима по прямой. На какой вершине остановился ковчег, Библия не говорит, и предания расходятся: этот вулканический конус, 5137 м, — обычный ответ со Средних веков, а более древние источники указывают на гору Джуди (Джуди-Даг) далеко к югу, у Тигра."
    - "Имя встречается ещё: сыновья Сеннахирима, убив его, «убежали в землю Араратскую», а Иеремия созывает на Вавилон «царства Араратские, Мидийские и Аскеназские» — по еврейскому тексту — Арарат, Маннея и Аскеназ, Урарту и его соседей. Месопотамский рассказ о потопе на одиннадцатой табличке эпоса о Гильгамеше сажает корабль Утнапишти на гору Нимуш, которую ассирийские анналы помещают в горах Загроса к востоку от Тигра; и месопотамское предание смотрело на северные горы вообще. Иосиф Флавий пишет, что армяне звали это место Пристанищем и ещё показывали остатки ковчега; он приводит Бероса, который помещает их на горе кордиеев — Кордуенских горах у верхнего Тигра, где стоит Джуди, — и Николая Дамасского, называющего большую гору Барис в Армении."
    - "Гора Джуди над Джизре на юго-востоке Турции — гора ковчега в Коране, аль-Джуди, и у сирийских и ранних армянских писателей, чьи горы Карду — Кордуенские горы греков; об Иакове Низибийском рассказывали, что он поднимался на неё за доской от ковчега. Сам Арарат, Масис у армян и Агры-Даг у турок, впервые связывают с Ноем в XI–XII веках, а в Европу это отождествление принесли путешественники — Гильом де Рубрук в 1254 году, затем Марко Поло. Современные поиски ковчега на обеих горах не нашли ничего, что признала бы археология. Точка карты обозначает область, как её называет Бытие, и ни одну из вершин не считает достоверной."
  uk:
    - "Книга Буття каже лише, що «зупинився ковчег … на горі Арарацькій», а Арарат — не гора, а країна: єврейська назва Урарту, царства довкола озера Ван у височинах східної Туреччини, Вірменії та північно-західного Ірану, з яким ассирійці воювали з IX по VII ст. до н. е. Точка мапи для регіону стоїть на піку, що нині зветься гора Арарат, приблизно за 1200 км на північний схід від Єрусалиму по прямій. На якому піку зупинився ковчег, Біблія не каже, і традиції розходяться: цей вулканічний конус заввишки 5137 м — звичайна відповідь від середньовіччя, тоді як давніші джерела вказують на гору Джуді (Джуді-даг), далеко на півдні біля Тигру."
    - "Назва повторюється: сини Сінаххеріба, убивши його, «повтїкали в Арарат-землю», що англійські переклади віддають як Вірменію, а Єремія скликає проти Вавилона «царства: Арарацькі, Минїйські, Аскеназькі» — Урарту та його сусідів. Месопотамська історія потопу, на одинадцятій табличці Епосу про Гільгамеша, зупиняє човен Утнапіштіма на горі Німуш, яку ассирійські аннали розміщують у Загросі на схід від Тигру; месопотамська традиція також дивилася на північні гори загалом. Йосиф Флавій каже, що вірмени називали це місце Висадкою й досі показували рештки ковчега; він посилається на Беросса, який ставить їх на гору кордуенів, гордієнські пагорби біля верхнього Тигру, де стоїть Джуді, і на Миколая Дамаскіна, який називає велику гору Барис у Вірменії."
    - "Гора Джуді, над Джизре на південному сході Туреччини, — гора ковчега в Корані, аль-Джуді, і в сирійських та ранніх вірменських письменників, чиї гори Кардуї — це Гордієнські гори греків; про Якова Нісібійського розповідали, що він піднявся на неї по дошку ковчега. Сама гора Арарат, Масіс для вірмен і Аґри-даг для турків, уперше пов'язана з Ноєм в XI–XII ст., і західні мандрівники, Вільгельм Рубрук 1254 р., а потім Марко Поло, донесли ототожнення до Європи. Сучасні пошуки ковчега на обох горах не знайшли нічого, що приймає археологія. Точка мапи позначає регіон, як його називає Книга Буття, і не вважає жоден з піків певним."
  es:
    - "Génesis dice solo que «reposó el arca... sobre los montes de Armenia» (en hebreo, Ararat), y Ararat no es un monte sino un país: el nombre hebreo de Urartu, el reino en torno al lago Van, en las tierras altas del este de Turquía, Armenia y el noroeste de Irán, que los asirios combatieron del siglo IX al VII a. C. El punto del mapa para la región está en la cumbre que hoy se llama monte Ararat, a unos 1200 km al noreste de Jerusalén en línea recta. En qué cumbre se posó el arca, la Biblia no lo dice, y las tradiciones difieren: ese cono volcánico, de 5137 m, es la respuesta habitual desde la Edad Media, mientras que las fuentes más antiguas apuntan al monte Judi (Cudi Dağı), muy al sur, cerca del Tigris."
    - "El nombre se repite: los hijos de Senaquerib, tras matarlo, escaparon a la tierra de Armenia, que el hebreo llama Ararat, y Jeremías convoca contra Babilonia «los reinos de Ararat, de Minni, y de Aschênaz», es decir, Urartu y sus vecinos. El relato del diluvio de Mesopotamia, en la tablilla undécima de la Epopeya de Gilgamesh, hace posarse la barca de Uta-napishti en el monte Nimush, que los anales asirios sitúan en los Zagros, al este del Tigris; también la tradición mesopotámica miraba en general a las montañas del norte. Josefo dice que los armenios llamaban al lugar el Desembarcadero y mostraban aún restos del arca; cita a Beroso, que los sitúa en el monte de los cordieos, las colinas gordienas junto al alto Tigris donde se alza el Judi, y a Nicolás de Damasco, que nombra un gran monte Baris en Armenia."
    - "El monte Judi, sobre Cizre, en el sureste de Turquía, es el monte del arca en el Corán, al-Judi, y en los escritores sirios y armenios antiguos, cuyos montes de Qardu son los montes gordienos de los griegos; se decía que Jacobo de Nisibis lo había escalado en busca de una tabla del arca. El propio monte Ararat, Masis para los armenios y Ağrı Dağı para los turcos, se vincula por primera vez a Noé en los siglos XI y XII, y los viajeros occidentales, Guillermo de Rubruck en 1254 y luego Marco Polo, llevaron la identificación a Europa. Las búsquedas modernas del arca en ambos montes no han hallado nada que la arqueología acepte. El punto del mapa señala la región, tal como la nombra Génesis, y no toma ninguna de las dos cumbres por segura."
  pt:
    - "Gênesis diz apenas que “a arca repousou… sobre os montes de Ararate”, e Ararate não é uma montanha, mas um país: o nome hebraico de Urartu, o reino em torno do lago Van, nas terras altas do leste da Turquia, da Armênia e do noroeste do Irã, que os assírios combateram do século IX ao VII a.C. O ponto do mapa para a região está no pico hoje chamado monte Ararate, a cerca de 1.200 km a nordeste de Jerusalém em linha reta. Em que pico a arca repousou a Bíblia não diz, e as tradições diferem: esse cone vulcânico, de 5.137 m, é a resposta usual desde a Idade Média, enquanto as fontes mais antigas apontam o monte Judi (Cudi Dağı), bem ao sul, perto do Tigre."
    - "O nome reaparece: os filhos de Senaqueribe, depois de matá-lo, “escaparam para a terra de Ararate” (a Armênia de outras traduções), e Jeremias convoca contra Babilônia “os reinos de Ararate, Mini e Asquenaz”, Urartu e seus vizinhos. A história do dilúvio da Mesopotâmia, na décima primeira tabuinha da Epopeia de Gilgámesh, pousa o barco de Utanapíshti no monte Nimush, que os anais assírios situam nos Zagros, a leste do Tigre; a tradição mesopotâmica também olhava para as montanhas do norte em geral. Josefo diz que os armênios chamavam o lugar de Desembarque e ainda mostravam restos da arca; cita Beroso, que os põe na montanha dos cordieus, os montes gordieus junto ao alto Tigre onde está o Judi, e Nicolau de Damasco, que nomeia um grande monte Baris na Armênia."
    - "O monte Judi, acima de Cizre, no sudeste da Turquia, é a montanha da arca no Alcorão, al-Judi, e nos escritores siríacos e armênios antigos, cujos montes de Qardu são os montes gordieus dos gregos; dizia-se que Jacó de Nísibis o escalou em busca de uma tábua da arca. O próprio monte Ararate, Masis para os armênios e Ağrı Dağı para os turcos, só é ligado a Noé nos séculos XI e XII, e viajantes ocidentais, Guilherme de Rubruck em 1254 e depois Marco Polo, levaram a identificação à Europa. As buscas modernas da arca nas duas montanhas nada acharam que a arqueologia aceite. O ponto do mapa marca a região, como Gênesis a nomeia, e não toma nenhum dos picos por certo."
  de:
    - "Die Genesis sagt nur: „Am siebzehnten Tage des siebenten Monats ließ sich der Kasten nieder auf das Gebirge Ararat“, und Ararat ist kein Berg, sondern ein Land: der hebräische Name von Urartu, dem Königreich um den Vansee im Hochland der Osttürkei, Armeniens und des nordwestlichen Iran, das die Assyrer vom 9. bis zum 7. Jahrhundert v. Chr. bekämpften. Der Kartenpunkt für die Region liegt auf dem Gipfel, der heute Berg Ararat heißt, in der Luftlinie etwa 1200 km nordöstlich von Jerusalem. Auf welchem Gipfel die Arche ruhte, sagt die Bibel nicht, und die Überlieferungen weichen ab: Der vulkanische Kegel von 5137 m ist seit dem Mittelalter die übliche Antwort, während die älteren Quellen auf den Dschudi Dağı weit im Süden nahe dem Tigris weisen."
    - "Der Name kehrt wieder: Sanheribs Söhne, die ihn erschlugen, „entrannen ins Land Ararat“, und Jeremia ruft gegen Babylon „die Königreiche Ararat, Minni und Askenas“, Urartu und seine Nachbarn. Die mesopotamische Sintflutgeschichte auf der elften Tafel des Gilgamesch-Epos lässt das Boot des Utnapischti auf dem Berg Nimusch landen, den assyrische Annalen im Zagros östlich des Tigris verorten; auch die mesopotamische Überlieferung blickte allgemein in die nördlichen Berge. Josephus sagt, die Armenier nannten den Ort die Landestelle und zeigten noch Reste der Arche; er beruft sich auf Berossos, der sie am Berg der Kordyäer ansetzt, den gordyäischen Bergen am oberen Tigris, wo der Dschudi steht, und auf Nikolaus von Damaskus, der einen großen Berg Baris in Armenien nennt."
    - "Der Dschudi Dağı über Cizre im Südosten der Türkei ist der Berg der Arche im Koran, al-Dschudi, und bei den syrischen und frühen armenischen Schriftstellern, deren Berge von Qardu die gordyäischen Berge der Griechen sind; Jakob von Nisibis soll ihn für ein Brett der Arche bestiegen haben. Der Berg Ararat selbst, bei den Armeniern Masis, bei den Türken Ağrı Dağı, wird erst im 11. und 12. Jahrhundert mit Noah verbunden, und westliche Reisende, Wilhelm von Rubruk 1254 und dann Marco Polo, trugen die Gleichsetzung nach Europa. Neuzeitliche Suchen nach der Arche auf beiden Bergen haben nichts erbracht, was die Archäologie anerkennt. Der Kartenpunkt kennzeichnet die Region, wie die Genesis sie nennt, und hält keinen der beiden Gipfel für sicher."
  fr:
    - "La Genèse dit seulement que « l’arche s’arrêta sur les montagnes d’Ararat », et l’Ararat n’est pas une montagne mais un pays : le nom hébreu de l’Urartu, le royaume autour du lac de Van, dans les hautes terres de l’est de la Turquie, de l’Arménie et du nord-ouest de l’Iran, que les Assyriens combattirent du IXe au VIIe siècle av. J.-C. Le point de la carte pour la région est sur le sommet appelé aujourd’hui mont Ararat, à environ 1 200 km au nord-est de Jérusalem en ligne droite. Sur quel sommet l’arche s’arrêta, la Bible ne le dit pas, et les traditions diffèrent : ce cône volcanique de 5 137 m est la réponse habituelle depuis le Moyen Âge, tandis que les sources plus anciennes désignent le mont Judi (Cudi Dağı), bien plus au sud, près du Tigre."
    - "Le nom revient : les fils de Sanchérib, l’ayant tué, « s’enfuirent au pays d’Ararat », qui est l’Arménie, et Jérémie convoque contre Babylone « les royaumes d’Ararat, de Minni et d’Aschkenaz », l’Urartu et ses voisins. Le récit du déluge de Mésopotamie, sur la onzième tablette de l’épopée de Gilgamesh, pose la barque d’Outa-napishti sur le mont Nimush, que les annales assyriennes placent dans le Zagros, à l’est du Tigre ; la tradition mésopotamienne regardait elle aussi vers les montagnes du nord en général. Josèphe dit que les Arméniens appelaient le lieu le Débarcadère et montraient encore des restes de l’arche ; il cite Bérose, qui les situe à la montagne des Cordyéens, les collines gordyéennes du haut Tigre où se trouve le Judi, et Nicolas de Damas, qui nomme une grande montagne, Baris, en Arménie."
    - "Le mont Judi, au-dessus de Cizre, dans le sud-est de la Turquie, est la montagne de l’arche dans le Coran, al-Judi, et chez les auteurs syriaques et arméniens anciens, dont les montagnes de Qardu sont les monts gordyéens des Grecs ; Jacques de Nisibe aurait gravi la montagne pour y prendre une planche de l’arche. Le mont Ararat lui-même, Masis pour les Arméniens et Ağrı Dağı pour les Turcs, n’est lié à Noé qu’aux XIe et XIIe siècles, et des voyageurs occidentaux, Guillaume de Rubrouck en 1254 puis Marco Polo, portèrent l’identification en Europe. Les recherches modernes de l’arche sur les deux montagnes n’ont rien trouvé que l’archéologie accepte. Le point de la carte marque la région, comme la Genèse la nomme, et ne tient aucun des deux sommets pour certain."
  pl:
    - "Księga Rodzaju mówi tylko, że „odpoczął korab … na górach Ararad”, a Ararat to nie góra, lecz kraj: hebrajska nazwa Urartu, królestwa wokół jeziora Wan na wyżynach wschodniej Turcji, Armenii i północno-zachodniego Iranu, z którym Asyryjczycy walczyli od IX do VII wieku p.n.e. Punkt na mapie dla regionu stoi na szczycie zwanym dziś górą Ararat, około 1200 km na północny wschód od Jerozolimy w linii prostej. Na którym szczycie spoczęła arka, Biblia nie mówi, a tradycje się różnią: ten stożek wulkaniczny, 5137 m, jest zwykłą odpowiedzią od średniowiecza, podczas gdy starsze źródła wskazują na górę Dżudi (Cudi Dağı), daleko na południu, nad Tygrysem."
    - "Nazwa wraca: synowie Sennacheryba, zabiwszy go, „uciekli do ziemi Ararat”, czyli Armenii, a Jeremiasz wzywa przeciw Babilonowi „królestwa Ararad, Minny, i Aschenas”, Urartu i jego sąsiadów. Mezopotamska opowieść o potopie, na jedenastej tabliczce Eposu o Gilgameszu, osadza łódź Utnapisztima na górze Nimusz, którą asyryjskie roczniki umieszczają w Zagrosie na wschód od Tygrysu; i tradycja mezopotamska patrzyła ogólnie ku górom północnym. Józef Flawiusz mówi, że Ormianie nazywali to miejsce Lądowiskiem i wciąż pokazywali szczątki arki; powołuje się na Berossosa, który umieszcza je na górze Kordyajczyków, we wzgórzach gordyjskich nad górnym Tygrysem, gdzie stoi Dżudi, i na Mikołaja z Damaszku, który wymienia wielką górę Baris w Armenii."
    - "Góra Dżudi, nad Cizre w południowo-wschodniej Turcji, jest górą arki w Koranie, al-Dżudi, i u pisarzy syryjskich i wczesnoormiańskich, których góry Qardu to góry gordyjskie Greków; mówiono, że Jakub z Nisibis wspiął się na nią po deskę arki. Sama góra Ararat, Masis dla Ormian i Ağrı Dağı dla Turków, jest po raz pierwszy łączona z Noem w XI i XII wieku, a zachodni podróżnicy, Wilhelm z Rubruk w 1254, a potem Marco Polo, zanieśli to utożsamienie do Europy. Współczesne poszukiwania arki na obu górach nie znalazły niczego, co przyjmuje archeologia. Punkt na mapie oznacza region, tak jak nazywa go Księga Rodzaju, i nie uznaje żadnego szczytu za pewny."
  it:
    - "La Genesi dice soltanto che «l’arca si fermò sulle montagne di Ararat», e Ararat non è un monte ma un paese: il nome ebraico di Urartu, il regno attorno al lago di Van negli altopiani della Turchia orientale, dell’Armenia e dell’Iran nord-occidentale, che gli Assiri combatterono dal IX al VII secolo a.C. Il punto della mappa per la regione sta sulla vetta oggi detta Monte Ararat, a circa 1.200 km a nord-est di Gerusalemme in linea retta. Su quale vetta si posò l’arca la Bibbia non dice, e le tradizioni differiscono: quel cono vulcanico, 5.137 m, è la risposta abituale dal Medioevo, mentre le fonti più antiche indicano il Monte Giudi (Cudi Dağı), molto più a sud presso il Tigri."
    - "Il nome ricorre: i figli di Sennacherib, dopo averlo ucciso, «si rifugiarono nel paese di Ararat», cioè l’Armenia, e Geremia convoca contro Babilonia «i regni d’Ararat, di Minni e d’Ashkenaz», Urartu e i suoi vicini. Il racconto del diluvio della Mesopotamia, sull’undicesima tavoletta dell’Epopea di Gilgamesh, posa la barca di Uta-napishti sul Monte Nimush, che gli annali assiri pongono nello Zagros a est del Tigri; anche la tradizione mesopotamica guardava in generale ai monti settentrionali. Giuseppe Flavio dice che gli Armeni chiamavano il luogo lo Sbarco e mostravano ancora resti dell’arca; cita Beroso, che li pone sul monte dei Cordiei, i colli di Gordiene presso l’alto Tigri dove sorge il Giudi, e Nicola di Damasco, che nomina un grande monte Baris in Armenia."
    - "Il Monte Giudi, sopra Cizre nella Turchia sud-orientale, è il monte dell’arca nel Corano, al-Judi, e negli scrittori siriaci e armeni antichi, i cui monti di Qardu sono i monti di Gordiene dei Greci; si diceva che Giacomo di Nisibi vi fosse salito per una tavola dell’arca. Lo stesso Monte Ararat, Masis per gli Armeni e Ağrı Dağı per i Turchi, è legato a Noè per la prima volta nell’XI e XII secolo, e viaggiatori occidentali, Guglielmo di Rubruck nel 1254 e poi Marco Polo, portarono l’identificazione in Europa. Le ricerche moderne dell’arca su entrambi i monti non hanno trovato nulla che l’archeologia accetti. Il punto della mappa segna la regione, come la nomina la Genesi, e non assume nessuna delle due vette come certa."
  nl:
    - "Genesis zegt alleen dat “de ark rustte … op de bergen van Ararat”, en Ararat is geen berg maar een land: de Hebreeuwse naam van Urartu, het koninkrijk rond het Vanmeer in het hoogland van Oost-Turkije, Armenië en Noordwest-Iran, waartegen de Assyriërs streden van de 9e tot de 7e eeuw v.Chr. Het punt op de kaart voor het gebied staat op de piek die nu Ararat heet, hemelsbreed ongeveer 1.200 km ten noordoosten van Jeruzalem. Op welke piek de ark rustte, zegt de Bijbel niet, en de overleveringen verschillen: die vulkanische kegel, 5.137 m, is sinds de middeleeuwen het gebruikelijke antwoord, terwijl de oudere bronnen wijzen op de Judi Dağı (Cudi Dağı), ver naar het zuiden bij de Tigris."
    - "De naam keert terug: Sanheribs zonen, die hem hadden gedood, “ontkwamen in het land van Ararat”, Armenië, en Jeremia roept tegen Babylon “de koninkrijken van Ararat, Minni en Askenaz” op, Urartu en zijn buren. Het Mesopotamische vloedverhaal, op de elfde tablet van het Gilgamesj-epos, laat de boot van Oet-napisjti landen op de berg Nimoesj, die Assyrische annalen in de Zagros ten oosten van de Tigris plaatsen; ook de Mesopotamische overlevering zocht in het algemeen in de noordelijke bergen. Josephus zegt dat de Armeniërs de plaats de Landingsplaats noemden en nog resten van de ark toonden; hij beroept zich op Berossus, die ze plaatst op de berg van de Kordyeeërs, de Gordyeïsche heuvels bij de bovenloop van de Tigris waar de Judi ligt, en op Nicolaüs van Damascus, die een grote berg Baris in Armenië noemt."
    - "De Judi, boven Cizre in Zuidoost-Turkije, is de berg van de ark in de Koran, al-Judi, en bij de Syrische en vroege Armeense schrijvers, wier bergen van Qardu de Gordyeïsche bergen van de Grieken zijn; Jakob van Nisibis zou hem hebben beklommen om een plank van de ark te halen. De Ararat zelf, Masis voor de Armeniërs en Ağrı Dağı voor de Turken, wordt pas in de 11e en 12e eeuw aan Noach verbonden, en westerse reizigers, Willem van Rubroeck in 1254 en daarna Marco Polo, brachten de identificatie naar Europa. Moderne zoektochten naar de ark op beide bergen hebben niets opgeleverd wat de archeologie aanvaardt. Het punt op de kaart markeert het gebied, zoals Genesis het noemt, en neemt geen van beide pieken als zeker."
  cs:
    - "Genesis říká jen, že „odpočinul koráb … na horách Ararat“, a Ararat není hora, ale země: hebrejské jméno Urartu, království kolem jezera Van na vysočině východního Turecka, Arménie a severozápadního Íránu, s nímž Asyřané bojovali od 9. do 7. století př. n. l. Bod na mapě pro tuto oblast stojí na vrcholu dnes zvaném hora Ararat, asi 1 200 km severovýchodně od Jeruzaléma vzdušnou čarou. Na kterém vrcholu archa spočinula, Bible neříká a tradice se liší: tato sopečná kuželovitá hora, 5 137 m, je obvyklou odpovědí od středověku, zatímco starší prameny ukazují na horu Džúdí (Cudi Dağı), daleko na jihu u Tigridu."
    - "Jméno se opakuje: synové Senacheribovi, když ho zabili, „utekli do země Ararat“, v anglické Bibli „do země Arménie“, a Jeremjáš svolává proti Babylónu „království Ararat, Minni, Ascenez“, Urartu a jeho sousedy. Mezopotámský příběh potopy, na jedenácté tabulce Eposu o Gilgamešovi, přistává s lodí Utnapištiho na hoře Nimuš, kterou asyrské letopisy kladou do Zagrosu východně od Tigridu; také mezopotámská tradice hleděla obecně k severním horám. Josephus Flavius praví, že Arméni to místo nazývali Přístaviště a dosud ukazovali zbytky archy; odvolává se na Bérósa, který je klade na horu Kordyajců, gordyajské hory u horního Tigridu, kde stojí Džúdí, a na Nikolaa Damašského, který jmenuje velkou horu Baris v Arménii."
    - "Hora Džúdí, nad Cizre v jihovýchodním Turecku, je horou archy v koránu, al-Džúdí, a u syrských a raných arménských spisovatelů, jejichž hory Qardu jsou gordyajské hory Řeků; Jakub z Nisibis prý na ni vystoupil pro prkno archy. Samotná hora Ararat, Masis pro Armény a Ağrı Dağı pro Turky, je s Noem spojena poprvé v 11. a 12. století a západní cestovatelé, Vilém z Rubrucku roku 1254 a pak Marco Polo, přenesli ztotožnění do Evropy. Novodobé pátrání po arše na obou horách nenašlo nic, co by archeologie přijímala. Bod na mapě značí oblast, jak ji Genesis jmenuje, a žádný vrchol nepovažuje za jistý."
  sv:
    - "1 Mosebok säger bara att arken stannade ”på Ararats berg”, och Ararat är inte ett berg utan ett land: det hebreiska namnet på Urartu, kungariket kring Vansjön i östra Turkiets högland, Armenien och nordvästra Iran, som assyrierna bekämpade från 800-talet till 600-talet f.Kr. Kartpunkten för regionen står på toppen som nu kallas Ararat, omkring 1 200 km nordost om Jerusalem fågelvägen. Vilken topp arken vilade på säger Bibeln inte, och traditionerna skiljer sig: den vulkaniska konen, 5 137 m, är det vanliga svaret sedan medeltiden, medan de äldre källorna pekar på berget Judi (Cudi Dağı), långt i söder nära Tigris."
    - "Namnet återkommer: Sanheribs söner flydde, sedan de dödat honom, ”undan till Ararats land” (Armenien i vissa översättningar), och Jeremia manar mot Babylon fram ”riken, både Ararats, Minnis och Askenas’”, Urartu och dess grannar. Mesopotamiens syndaflodsberättelse, på den elfte tavlan i Gilgamesheposet, låter Utnapishtims båt landa på berget Nimush, som assyriska annaler förlägger till Zagros öster om Tigris; också den mesopotamiska traditionen såg mot de norra bergen i allmänhet. Josefus säger att armenierna kallade platsen Landningsplatsen och ännu visade rester av arken; han hänvisar till Berossos, som förlägger dem till kordyéernas berg, de gordyeiska kullarna vid övre Tigris där Judi ligger, och till Nikolaos av Damaskus, som nämner ett stort berg Baris i Armenien."
    - "Berget Judi, ovanför Cizre i sydöstra Turkiet, är arkens berg i Koranen, al-Judi, och hos de syriska och tidiga armeniska skribenterna, vars Qardu-berg är grekernas gordyeiska berg; Jakob av Nisibis sades ha besteget det för att hämta en planka av arken. Själva berget Ararat, Masis för armenierna och Ağrı Dağı för turkarna, knyts först till Noa på 1000- och 1100-talen, och västerländska resenärer, Vilhelm av Rubruck 1254 och sedan Marco Polo, förde identifieringen till Europa. Moderna sökningar efter arken på båda bergen har inte funnit något som arkeologin godtar. Kartpunkten markerar regionen, som 1 Mosebok nämner den, och tar ingen av topparna som säker."
  nb:
    - "1 Mosebok sier bare at «blev arken stående på Ararat-fjellene», og Ararat er ikke et fjell, men et land: det hebraiske navnet på Urartu, kongeriket rundt Vansjøen i høylandet i Øst-Tyrkia, Armenia og nordvest i Iran, som assyrerne kjempet mot fra 800- til 600-tallet f.Kr. Kartpunktet for regionen står på toppen som nå kalles Ararat, omtrent 1 200 km nordøst for Jerusalem i luftlinje. Hvilken topp arken hvilte på, sier ikke Bibelen, og tradisjonene er ulike: den vulkanske kjeglen, 5 137 m, er det vanlige svaret siden middelalderen, mens de eldre kildene peker på Judi-fjellet (Cudi Dağı), langt mot sør nær Tigris."
    - "Navnet går igjen: Sankeribs sønner, etter å ha drept ham, «flyktet til Ararats land», som engelske bibler gjengir som Armenia, og Jeremia kaller mot Babylon «Ararats, Minnis og Askenas' riker», Urartu og dets naboer. Flomfortellingen i Mesopotamia, på den ellevte tavlen i Gilgamesj-eposet, lar Utnapisjtims båt lande på Nimush-fjellet, som assyriske annaler plasserer i Zagros øst for Tigris; også den mesopotamiske tradisjonen så mot de nordlige fjellene i alminnelighet. Josefus sier at armenerne kalte stedet Avstigningsstedet og ennå viste rester av arken; han viser til Berossos, som setter dem på kordyaiernes fjell, Gordyene-åsene ved øvre Tigris, der Judi ligger, og til Nikolaus av Damaskus, som nevner et stort fjell Baris i Armenia."
    - "Judi-fjellet, over Cizre i Sørøst-Tyrkia, er arkens fjell i Koranen, al-Judi, og hos de syriske og tidlige armenske forfatterne, hvis Qardu-fjell er grekernes Gordyene-fjell; Jakob av Nisibis skal ha klatret opp for å hente en planke fra arken. Selve Ararat, Masis for armenerne og Ağrı Dağı for tyrkerne, knyttes først til Noah på 1000- og 1100-tallet, og vestlige reisende, Vilhelm av Rubruck i 1254 og så Marco Polo, førte identifikasjonen til Europa. Moderne søk etter arken på begge fjellene har ikke funnet noe arkeologien godtar. Kartpunktet markerer regionen, slik 1 Mosebok nevner den, og tar ingen av toppene som sikre."
  tl:
    - "Sinasabi lamang ng Genesis na “sumadsad ang sasakyan … sa ibabaw ng mga bundok ng Ararat”, at ang Ararat ay hindi bundok kundi isang bansa: ang pangalang Hebreo ng Urartu, ang kahariang nasa palibot ng Lawa ng Van sa kabundukan ng silangang Turkiya, Armenia at hilagang-kanlurang Iran, na nilabanan ng mga Asirio mula ikasiyam hanggang ikapitong siglo BK. Ang tuldok sa mapa para sa rehiyon ay nasa tuktok na tinatawag ngayong Bundok Ararat, mga 1,200 km sa hilagang-silangan ng Jerusalem sa tuwid na guhit. Hindi sinasabi ng Biblia kung aling tuktok ang pinagpahingahan ng daong, at magkakaiba ang mga tradisyon: ang bulkang kono na iyon, 5,137 m, ang karaniwang sagot mula sa Gitnang Panahon, samantalang ang mas sinaunang mga pinagkunan ay tumuturo sa Bundok Judi (Cudi Dağı), malayo sa timog malapit sa Tigris."
    - "Umuulit ang pangalan: ang mga anak ni Sennacherib, pagkatapos siyang patayin, “sila'y nagsitanan na patungo sa lupain ng Ararat”, na Armenia sa ilang bersiyon, at tinatawag ni Jeremias laban sa Babilonia “ang mga kaharian ng Ararat, ng Minmi, at ng Aschenaz”, ang Urartu at mga karatig nito. Sa kuwento ng baha sa Mesopotamia (ika-11 tapyas ng Epiko ni Gilgamesh), lumapag ang bangka ni Uta-napishti sa Bundok Nimush, na nasa Zagros sa silangan ng Tigris ayon sa talaan ng Asiria; sa hilagang kabundukan din tumingin ang tradisyong Mesopotamiko. Ayon kay Josephus, tinawag ng mga Armenio ang lugar na ang Paglapag at ipinakikita pa ang mga labi ng daong; binabanggit niya si Berosso, na naglalagay ng mga ito sa bundok ng mga Cordyaeo (mga burol ng Gordyaeo sa itaas na Tigris, kinatatayuan ng Judi), at si Nicolas ng Damasco, na pinangalanang Baris ang isang malaking bundok sa Armenia."
    - "Ang Bundok Judi, sa itaas ng Cizre sa timog-silangang Turkiya, ay bundok ng daong sa Quran, al-Judi, at sa mga manunulat na Siriako at sinaunang Armenio, na ang mga bundok ng Qardu ay ang mga bundok ng Gordyaeo ng mga Griyego; sinasabing inakyat ito ni Jacob ng Nisibis para sa isang tabla ng daong. Ang Bundok Ararat mismo, Masis sa mga Armenio at Ağrı Dağı sa mga Turko, ay unang iniugnay kay Noe noong ikalabing-isa at ikalabindalawang siglo, at dinala ng mga manlalakbay na taga-kanluran, si William ng Rubruck noong 1254 at pagkatapos si Marco Polo, ang pagkakakilanlan sa Europa. Walang natagpuan ang makabagong paghahanap sa daong sa parehong bundok na tinatanggap ng arkeolohiya. Minamarkahan ng tuldok sa mapa ang rehiyon, gaya ng pagpangalan ng Genesis, at hindi itinuturing na tiyak ang alinmang tuktok."
  da:
    - "Første Mosebog siger blot, at »Arken hvilede … paa Ararats Bjerge«, og Ararat er ikke et bjerg, men et land: det hebraiske navn for Urartu, kongeriget omkring Van-søen i højlandet i det østlige Tyrkiet, Armenien og det nordvestlige Iran, som assyrerne kæmpede mod fra 800- til 600-tallet f.Kr. Kortets punkt for regionen står på toppen, der nu kaldes Ararat, omkring 1.200 km nordøst for Jerusalem i luftlinje. Hvilken top arken hvilede på, siger Bibelen ikke, og traditionerne er forskellige: den vulkanske kegle på 5.137 m er det sædvanlige svar siden middelalderen, mens de ældre kilder peger på Judi-bjerget (Cudi Dağı), langt mod syd nær Tigris."
    - "Navnet går igen: Sankeribs sønner, efter at have dræbt ham, »undkom til Ararats Land«, som i engelske bibler hedder Armenien, og Jeremias kalder mod Babylon »Ararats, Minnis og Askenas's Riger« frem, Urartu og dets naboer. Mesopotamiens syndflodsberetning, på tavle 11 i Gilgamesh-eposet, lader Uta-napishtis båd lande på Nimush-bjerget, som assyriske annaler placerer i Zagros øst for Tigris; også den mesopotamiske tradition så generelt mod de nordlige bjerge. Josefus siger, at armenierne kaldte stedet Landingsstedet og stadig viste rester af arken; han citerer Berossos, der placerer dem på kordyæernes bjerg, de gordyæiske bakker ved øvre Tigris, hvor Judi ligger, og Nikolaos af Damaskus, der nævner et stort bjerg Baris i Armenien."
    - "Judi-bjerget, over Cizre i det sydøstlige Tyrkiet, er arkens bjerg i Koranen, al-Judi, og hos de syriske og tidlige armenske forfattere, hvis Qardu-bjerge er grækernes gordyæiske bjerge; Jakob af Nisibis skulle have besteget det for at hente en planke fra arken. Selve Ararat, Masis for armenierne og Ağrı Dağı for tyrkerne, knyttes første gang til Noa i 1000- og 1100-tallet, og vestlige rejsende, Vilhelm af Rubruck i 1254 og derefter Marco Polo, bragte identifikationen til Europa. Moderne eftersøgninger af arken på begge bjerge har ikke fundet noget, som arkæologien accepterer. Kortets punkt markerer regionen, som Første Mosebog nævner den, og tager ingen af topperne for sikker."
  sr:
    - "Постање каже само: „те се устави ковчег … на планини Арарату“, а Арарат није планина него земља: хебрејско име за Урарту, краљевство око Ванског језера у висоравнима источне Турске, Јерменије и северозападног Ирана, с којим су се Асирци борили од 9. до 7. века п. н. е. Тачка на карти за област стоји на врху који се сада зове гора Арарат, око 1.200 км североисточно од Јерусалима правом линијом. На ком се врху ковчег зауставио, Библија не каже, а предања се разликују: тај вулкански чуњ висок 5.137 м уобичајен је одговор од средњег века, док старији извори упућују на гору Џуди (Џуди даг), далеко на југу близу Тигра."
    - "Име се понавља: Сенахиримови синови, пошто су га убили, „побегоше у земљу араратску“, коју хебрејски зове Арарат, а неки преводи Јерменија, а Јеремија против Вавилона сазива „царство араратско, минијско и асханаско“, Урарту и његове суседе. Месопотамска прича о потопу, на једанаестој таблици Епа о Гилгамешу, спушта лађу Утнапиштима на гору Нимуш, коју асирски анали смештају у Загрос источно од Тигра; и месопотамско предање гледало је уопште ка северним планинама. Јосиф Флавије каже да су Јермени то место звали Место силаска и да су још показивали остатке ковчега; позива се на Бероса, који их ставља на гору Кордијаца, гордијска брда поред горњег Тигра где стоји Џуди, и на Николу Дамашчанског, који именује велику гору Барис у Јерменији."
    - "Гора Џуди, изнад Џизреа у југоисточној Турској, јесте гора ковчега у Курану, ал Џуди, и код сиријских и раних јерменских писаца, чије су горе Кардуа гордијске горе Грка; за Јакова Нисибијског причало се да се попео на њу по даску ковчега. Сама гора Арарат, Масис за Јермене и Агри Даг за Турке, први пут се везује за Ноја у 11. и 12. веку, а западни путници, Вилхем од Рубрука 1254. и затим Марко Поло, пренели су поистовећење у Европу. Савремена трагања за ковчегом на обе горе нису нашла ништа што археологија прихвата. Тачка на карти означава област, како је Постање именује, и ниједан врх не узима као сигуран."
  hu:
    - "A Mózes első könyve csak annyit mond, hogy a bárka „megfeneklett az Ararát hegyén”, az Ararát pedig nem hegy, hanem ország: Urartu héber neve, a Van-tó körüli királyságé Kelet-Törökország, Örményország és Északnyugat-Irán felföldjein, amellyel az asszírok harcoltak a Kr. e. 9. századtól a 7.-ig. A térképi pont a régióra a ma Ararát-hegynek nevezett csúcson áll, Jeruzsálemtől egyenes vonalban mintegy 1200 km-re északkeletre. Hogy melyik csúcson akadt meg a bárka, a Biblia nem mondja, és a hagyományok eltérnek: a vulkáni, 5137 m magas kúp a szokásos válasz a középkor óta, míg a régebbi források a messze délen, a Tigris közelében lévő Dzsúdi-hegyet (Cudi Dağı) jelölik."
    - "A név visszatér: Szanhérib fiai, miután megölték, „elszaladtak az Ararát földébe”, amelyet az angol Biblia Örményországnak fordít, Jeremiás pedig Babilon ellen felszólítja „az Ararátnak, Menninek és Askenáznak országait”, vagyis Urartut és szomszédait. Mezopotámia özönvíz-elbeszélése, a Gilgames-eposz tizenegyedik táblája, Utnapistim bárkáját a Nimus hegyére teszi, amelyet az asszír évkönyvek a Tigristől keletre, a Zagroszban helyeznek el; a mezopotámiai hagyomány is általában az északi hegyek felé nézett. Josephus szerint az örmények a helyet Leszállóhelynek nevezték, és még mutatták a bárka maradványait; hivatkozik Bérószoszra, aki a kordüaiak hegyére teszi, a Tigris felső folyása mentén a gordüéni dombokra, ahol a Dzsúdi áll, és a damaszkuszi Nikolaoszra, aki Örményországban egy Baris nevű nagy hegyet említ."
    - "A délkelet-törökországi Dzsizre fölötti Dzsúdi-hegy a Koránban al-Dzsúdi, a bárka hegye, valamint a szír és korai örmény írók szerint, akiknek Qardu hegyei a görögök gordüéni hegyei; Nisibisi Jakabról azt mondták, hogy megmászta egy bárkadeszkáért. Magát az Ararát-hegyet, az örményeknek Masziszt, a töröknek Ağrı Dağıt, a 11–12. században kötik először Noéhoz, és nyugati utazók, Rubruk Vilmos 1254-ben, majd Marco Polo vitték Európába az azonosítást. A bárka modern keresései mindkét hegyen semmit sem találtak, amit a régészet elfogadna. A térképi pont a régiót jelöli, ahogy a Mózes első könyve megnevezi, és egyik csúcsot sem tekinti bizonyosnak."
  fi:
    - "1. Mooseksen kirja sanoo vain, että ”arkki pysähtyi … Araratin vuorille”, ja Ararat ei ole vuori vaan maa: Urartun, Vanjärven ympärillä Itä-Turkin, Armenian ja Luoteis-Iranin ylängöillä sijainneen kuningaskunnan, heprealainen nimi; assyrialaiset taistelivat sitä vastaan 800-luvulta 600-luvulle eaa. Alueen karttapiste on nykyisen Araratvuoren huipulla, noin 1 200 km Jerusalemista koilliseen linnuntietä. Mille vuorelle arkki pysähtyi, Raamattu ei sano, ja perimätiedot eroavat: tuo tulivuorikartio, 5 137 m, on ollut tavallinen vastaus keskiajalta lähtien, kun taas vanhemmat lähteet osoittavat Judi-vuorelle (Cudi Dağı), kauas etelään Tigrisin lähelle."
    - "Nimi toistuu: Sanheribin pojat tapettuaan hänet ”pakenivat Araratin maahan”, jota englantilaiset Raamatut kutsuvat Armeniaksi, ja Jeremia kutsuu Babylonia vastaan ”Araratin, Minnin ja Askenaan valtakunnat”, Urartun ja sen naapurit. Mesopotamian vedenpaisumustarina, Gilgameš-eepoksen yhdennellätoista taululla, laskee Utnapištimin veneen Nimush-vuorelle, jonka assyrialaiset annaalit sijoittavat Tigrisin itäpuoliseen Zagrosiin; Mesopotamian perimätietokin katsoi yleensä pohjoisille vuorille. Josephus sanoo armenialaisten kutsuneen paikkaa Laskeutumispaikaksi ja yhä näyttäneen arkin jäännöksiä; hän siteeraa Berossosta, joka sijoittaa ne kordyalaisten vuorelle, Gordyaian kukkuloille Tigrisin yläjuoksulla, missä Judi seisoo, ja Damaskoksen Nikolaosta, joka mainitsee Armeniassa suuren vuoren Bariksen."
    - "Judi-vuori, Cizren yläpuolella Kaakkois-Turkissa, on arkin vuori Koraanissa, al-Judi, ja syyrialaisissa ja varhaisissa armenialaisissa kirjoittajissa, joiden Qardun vuoret ovat kreikkalaisten Gordyaian vuoret; Nisibiin Jaakobin kerrottiin kiivenneen sille arkin laudan perässä. Itse Araratvuori, armenialaisille Masis ja turkkilaisille Ağrı Dağı, liitetään Nooaan ensi kertaa 1000- ja 1100-luvuilla, ja länsimaiset matkailijat, Wilhelm Rubruckilainen 1254 ja sitten Marco Polo, veivät tunnistuksen Eurooppaan. Nykyaikaiset arkin etsinnät molemmilta vuorilta eivät ole löytäneet mitään, minkä arkeologia hyväksyisi. Karttapiste merkitsee aluetta, kuten 1. Mooseksen kirja sen nimeää, eikä pidä kumpaakaan huippua varmana."
  vi:
    - "Sáng thế ký chỉ nói “chiếc tàu tấp trên núi A-ra-rát”, và A-ra-rát không phải một ngọn núi mà là một xứ: tên Hê-bơ-rơ của Urartu, vương quốc quanh Hồ Van trên cao nguyên đông Thổ Nhĩ Kỳ, Armenia và tây bắc Iran, mà người Assyria giao chiến từ thế kỷ 9 đến thế kỷ 7 TCN. Điểm bản đồ của vùng đứng trên đỉnh nay gọi là núi Ararat, cách Giê-ru-sa-lem khoảng 1.200 km về phía đông bắc theo đường thẳng. Tàu đậu trên ngọn nào thì Kinh Thánh không nói, và các truyền thống khác nhau: ngọn núi lửa ấy, cao 5.137 m, là đáp án thông thường từ thời Trung Cổ, trong khi các nguồn cổ hơn chỉ núi Judi (Cudi Dağı), xa về phía nam gần sông Hi-đê-ke."
    - "Cái tên lặp lại: các con trai San-chê-ríp, sau khi giết ông, “trốn trong xứ A-ra-rát”, xứ mà bản tiếng Anh gọi là Armenia, và Giê-rê-mi triệu tập nghịch cùng Ba-by-lôn “những nước A-ra-rát, Min-ni, Ách-kê-na”, Urartu và các lân bang. Truyện hồng thủy của Mê-sô-bô-ta-mi, trên bảng thứ mười một của Sử thi Gilgamesh, đưa thuyền của Uta-napishti cập núi Nimush, mà biên niên Assyria đặt trong dãy Zagros phía đông sông Hi-đê-ke; truyền thống Mê-sô-bô-ta-mi cũng nhìn chung về các núi phía bắc. Giô-sê-phu nói người Armenia gọi nơi ấy là Nơi Cập Bến và còn chỉ cho thấy tàn tích của tàu; ông trích Berossus, người đặt chúng ở núi của người Cordyaea, các đồi Gordyaea bên thượng nguồn sông Hi-đê-ke nơi Judi đứng, và Ni-cô-la ở Đa-mách, người nêu tên một ngọn núi lớn Baris ở Armenia."
    - "Núi Judi, phía trên Cizre ở đông nam Thổ Nhĩ Kỳ, là ngọn núi của tàu trong Kinh Qur'an, al-Judi, và trong các tác giả Syriac và Armenia sơ khai, những người có núi Qardu là các núi Gordyaea của người Hy Lạp; Gia-cốp ở Nisibis được kể là đã leo lên để lấy một tấm ván của tàu. Chính núi Ararat, Masis đối với người Armenia và Ağrı Dağı đối với người Turk, lần đầu được gắn với Nô-ê vào thế kỷ 11 và 12, và các du khách phương Tây, William of Rubruck năm 1254 rồi Marco Polo, đem cách đồng nhất ấy sang châu Âu. Các cuộc tìm tàu thời hiện đại trên cả hai ngọn núi không tìm thấy gì mà khảo cổ học chấp nhận. Điểm bản đồ đánh dấu vùng, như Sáng thế ký nêu tên, và không coi ngọn nào là chắc chắn."
  ro:
    - "Facerea spune doar că arca s-a oprit pe munții Araratului, iar Araratul nu este un munte, ci o țară: numele ebraic al Urartu, regatul din jurul lacului Van, în podișul din estul Turciei, Armenia și nord-vestul Iranului, cu care s-a războit Asiria din secolul al IX-lea până în al VII-lea î.Hr. Punctul de pe hartă pentru regiune stă pe vârful numit azi Muntele Ararat, la circa 1200 km nord-est de Ierusalim în linie dreaptă. Pe ce vârf s-a oprit arca nu spune Biblia, iar tradițiile diferă: acel con vulcanic, de 5137 m, este răspunsul obișnuit din Evul Mediu, în timp ce izvoarele mai vechi arată spre Muntele Judi (Cudi Dağı), departe spre sud, lângă Tigru."
    - "Numele revine: fiii lui Senaherib, după ce l-au ucis, „au fugit în Armenia”, pe care ebraica o numește Ararat, iar Ieremia cheamă împotriva Babilonului împărățiile Ararat, Mini și Așchenaz, adică Urartu și vecinii ei. Povestea potopului din Mesopotamia, pe a unsprezecea tăbliță a Epopeei lui Ghilgameș, așază corabia lui Uta-napiști pe Muntele Nimuș, pe care analele asiriene îl pun în Zagros, la est de Tigru; și tradiția mesopotamiană privea, în general, spre munții de nord. Iosif Flaviu spune că armenii numeau locul Coborârea și arătau încă rămășițe ale arcei; el îl citează pe Berossos, care le pune pe muntele cordienilor, dealurile gordiene de lângă Tigrul superior, unde se află Judi, și pe Nicolae din Damasc, care numește un munte mare Baris în Armenia."
    - "Muntele Judi, deasupra orașului Cizre din sud-estul Turciei, este muntele arcei în Coran, al-Judi, și la scriitorii sirieni și armeni timpurii, ai căror munți Qardu sunt munții gordieni ai grecilor; se spunea că Iacob din Nisibis s-ar fi urcat pe el după o scândură din arcă. Muntele Ararat însuși, Masis la armeni și Ağrı Dağı la turci, este legat întâia oară de Noe în secolele al XI-lea și al XII-lea, iar călătorii occidentali, Guillaume de Rubruck în 1254 și apoi Marco Polo, au dus identificarea în Europa. Căutările moderne ale arcei pe ambii munți nu au găsit nimic ce arheologia să accepte. Punctul de pe hartă marchează regiunea, așa cum o numește Facerea, și nu socotește sigur niciunul dintre vârfuri."
  bg:
    - "Битие казва само, че „седна ковчегът върху планините Арарат“, а Арарат не е планина, а страна: еврейското име на Урарту, царството около езерото Ван в планините на Източна Турция, Армения и Северозападен Иран, срещу което асирийците воювали от IX до VII в. пр.н.е. Точката на картата за областта стои на върха, наричан днес планината Арарат, на около 1200 км североизточно от Йерусалим по права линия. На кой връх спрял ковчегът, Библията не казва, а традициите се различават: този вулканичен конус, 5137 м, е обичайният отговор от Средновековието насам, докато по-старите източници сочат планината Джуди (Джуди Даг), далеч на юг близо до Тигър."
    - "Името се появява отново: синовете на Сенахирим, след като го убили, „побегнаха в Араратската земя“ — английският превод казва Армения, еврейският текст има Арарат, — а Йеремия свиква срещу Вавилон „царствата На Арарат, на Мини, и на Асханаз“, Урарту и съседите му. Месопотамският разказ за потопа, на единадесетата плочка от Епоса за Гилгамеш, спира лодката на Ута-напищи на планината Нимуш, която асирийските анали поставят в Загрос, източно от Тигър; и месопотамската традиция гледала към северните планини изобщо. Йосиф Флавий казва, че арменците наричали мястото Слизането и още показвали останки от ковчега; той цитира Берос, който ги поставя на планината на кордиейците — Гордиейските хълмове при горния Тигър, където е Джуди, — и Николай Дамаскин, който назовава голяма планина Барис в Армения."
    - "Планината Джуди, над Джизре в Югоизточна Турция, е планината на ковчега в Корана, ал-Джуди, и при сирийските и ранните арменски автори, чиито планини Карду са Гордиейските планини на гърците; за Яков Низибийски се разказвало, че се изкачил на нея за дъска от ковчега. Самата планина Арарат, Масис за арменците и Агръ Даг за турците, за пръв път се свързва с Ной през XI и XII в., а западни пътешественици — Гийом дьо Рубрук през 1254 г. и после Марко Поло — пренесли отъждествяването в Европа. Съвременните търсения на ковчега на двете планини не са открили нищо, което археологията да приеме. Точката на картата отбелязва областта, както я назовава Битие, и не приема нито един от върховете за сигурен."
