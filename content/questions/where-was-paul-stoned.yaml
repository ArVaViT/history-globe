id: where-was-paul-stoned
question:
  en: "Where was Paul stoned?"
  ru: "Где Павла побили камнями?"
  uk: "Де побили камінням Павла?"
  es: "¿Dónde fue apedreado Pablo?"
  pt: "Onde Paulo foi apedrejado?"
  de: "Wo wurde Paulus gesteinigt?"
  fr: "Où Paul fut-il lapidé ?"
  pl: "Gdzie ukamienowano Pawła?"
  it: "Dove fu lapidato Paolo?"
  cs: "Kde byl Pavel ukamenován?"
  nl: "Waar werd Paulus gestenigd?"
  sv: "Var blev Paulus stenad?"
  nb: "Hvor ble Paulus steinet?"
  tl: "Saan binato si Pablo?"
  da: "Hvor blev Paulus stenet?"
  sr: "Где је Павле био каменован?"
  hu: "Hol kövezték meg Pált?"
  fi: "Missä Paavali kivitettiin?"
  vi: "Phao-lô bị ném đá ở đâu?"
  ro: "Unde a fost lapidat Pavel?"
  bg: "Къде е бил пребит с камъни Павел?"
answer:
  en:
    - "Paul was stoned at Lystra, a small Roman colony in Lycaonia, the high plain of central Asia Minor, about 33 km south-west of Iconium (today's Konya) in a straight line; the map point stands on the mound by the village of Hatunsaray in Turkey. Derbe, where he went the next day, was about 95 km further east, and Pisidian Antioch, from which his enemies followed him, about 128 km to the north-west."
    - "Paul and Barnabas had fled there from Iconium. When Paul healed a man lame from birth, the crowd “lifted up their voices, saying in the speech of Lycaonia, The gods are come down to us in the likeness of men”, took Barnabas for Zeus and Paul for Hermes, and the priest of Zeus brought oxen to sacrifice. Then “there came thither certain Jews from Antioch and Iconium, who persuaded the people, and, having stoned Paul, drew him out of the city, supposing he had been dead. Howbeit, as the disciples stood round about him, he rose up, and came into the city: and the next day he departed with Barnabas to Derbe.” Paul came back to Lystra on the same journey and again on the next, when he took Timothy, a native of the town, as his companion; years later he reminded Timothy of the persecutions “at Antioch, at Iconium, at Lystra”."
    - "Lystra was found in 1885, when the American J. R. S. Sterrett read a Latin inscription on the mound naming the colony Lustra; Augustus had settled veterans there about 25 BC. Inscriptions from the district record priests of Zeus and a statue of Hermes dedicated to Zeus, so Luke's pair of gods matches the local cult, and Ovid's tale of Zeus and Hermes visiting Baucis and Philemon in the guise of men is set in neighbouring Phrygia. Systematic excavation of the mound began only in 2024, by a team from Necmettin Erbakan University in Konya."
  ru:
    - "Павла побили камнями в Листре, небольшой римской колонии в Ликаонии, на высоком плато в центре Малой Азии, примерно в 33 км к юго-западу от Иконии (нынешней Коньи) по прямой; точка карты стоит на холме у турецкой деревни Хатунсарай. Дервия, куда он ушёл на следующий день, лежала примерно в 95 км дальше на восток, а Антиохия Писидийская, откуда за ним пришли враги, — примерно в 128 км к северо-западу."
    - "Павел и Варнава бежали сюда из Иконии. Когда Павел исцелил хромого от рождения, народ «возвысил свой голос, говоря по-ликаонски: боги в образе человеческом сошли к нам», Варнаву приняли за Зевса, Павла — за Гермеса, и жрец Зевса привёл волов для жертвы. Затем «из Антиохии и Иконии пришли некоторые Иудеи… И, возбудив народ, побили Павла камнями и вытащили за город, почитая его умершим. Когда же ученики собрались около него, он встал и пошел в город, а на другой день удалился с Варнавою в Дервию». Павел вернулся в Листру в то же путешествие и снова в следующее, когда взял в спутники Тимофея, уроженца этого города; годы спустя он напоминал Тимофею о гонениях «в Антиохии, Иконии, Листрах»."
    - "Листру нашли в 1885 году, когда американец Дж. Р. С. Стеррет прочёл на холме латинскую надпись с именем колонии — Лустра; Август поселил здесь ветеранов около 25 г. до н. э. Надписи округи упоминают жрецов Зевса и статую Гермеса, посвящённую Зевсу, так что пара богов у Луки совпадает с местным культом, а рассказ Овидия о том, как Зевс и Гермес в образе людей пришли к Филемону и Бавкиде, разворачивается в соседней Фригии. Систематические раскопки холма начались лишь в 2024 году — их ведёт Университет Неджметтина Эрбакана в Конье."
  uk:
    - "Павла побили камінням у Лістрі, невеликій римській колонії в Лікаонії, високій рівнині центральної Малої Азії, приблизно за 33 км на південний захід від Іконії (нинішньої Коні) по прямій; точка на мапі стоїть на пагорбі біля села Хатунсарай у Туреччині. Дервія, куди він пішов наступного дня, лежала приблизно на 95 км далі на схід, а Пісідійська Антіохія, звідки за ним пішли вороги, — приблизно за 128 км на північний захід."
    - "Павло й Варнава втекли туди з Іконії. Коли Павло зцілив чоловіка, кульгавого від народження, натовп «підняв голос свій, говорячи по ликаонськи: Боги, уподобившись людям, зійшли до нас», уважав Варнаву за Зевса, а Павла за Гермеса, і жрець Зевса привів волів для жертви. Потім «Прийшли ж з Антиохиї та Ікониї Жиди, і наустивши народ, і вкаменувавши Павла, виволїкли геть з города, думаючи, що він умер. Як же обступили його ученики, уставши ввійшов у город, а назавтра вийшов з Варнавою в Дервию.» Павло повернувся до Лістри під час тієї самої подорожі й знову під час наступної, коли взяв Тимофія, уродженця міста, за супутника; через роки він нагадав Тимофієві про гоніння «в Антиохиї, в Ікониї, в Листрі»."
    - "Лістру було знайдено 1885 р., коли американець Дж. Р. С. Стерретт прочитав на пагорбі латинський напис, що називав колонію Lustra; Август оселив там ветеранів близько 25 р. до н. е. Написи з околиці засвідчують жерців Зевса й статую Гермеса, присвячену Зевсові, тож пара богів у Луки відповідає місцевому культу, а Овідієва оповідь про Зевса й Гермеса, які відвідали Бавкіду та Філемона в подобі людей, розгортається в сусідній Фрігії. Систематичні розкопки пагорба розпочалися лише 2024 р., силами команди Університету Неджметтіна Ербакана в Коні."
  es:
    - "Pablo fue apedreado en Listra, una pequeña colonia romana en Licaonia, la alta llanura del centro de Asia Menor, a unos 33 km al suroeste de Iconio (la actual Konya) en línea recta; el punto del mapa está sobre el montículo junto a la aldea de Hatunsaray, en Turquía. Derbe, adonde fue al día siguiente, quedaba unos 95 km más al este, y Antioquía de Pisidia, de donde lo siguieron sus enemigos, a unos 128 km al noroeste."
    - "Pablo y Bernabé habían huido allí desde Iconio. Cuando Pablo sanó a un hombre cojo de nacimiento, las gentes «alzaron la voz, diciendo en lengua licaónica: Dioses semejantes á hombres han descendido á nosotros»; tomaron a Bernabé por Zeus y a Pablo por Hermes, y el sacerdote de Zeus trajo toros para sacrificar. Entonces «sobrevinieron unos Judíos de Antioquía y de Iconio, que persuadieron á la multitud, y habiendo apedreado á Pablo, le sacaron fuera de la ciudad, pensando que estaba muerto. Mas rodeándole los discípulos, se levantó y entró en la ciudad; y un día después, partió con Bernabé á Derbe». Pablo volvió a Listra en el mismo viaje y de nuevo en el siguiente, cuando tomó como compañero a Timoteo, natural de la ciudad; años después recordó a Timoteo las persecuciones «en Antioquía, en Iconio, en Listra»."
    - "Listra fue hallada en 1885, cuando el estadounidense J. R. S. Sterrett leyó en el montículo una inscripción latina que nombraba la colonia como Lustra; Augusto había establecido allí veteranos hacia el 25 a. C. Inscripciones de la comarca registran sacerdotes de Zeus y una estatua de Hermes dedicada a Zeus, de modo que la pareja de dioses de Lucas concuerda con el culto local, y el relato de Ovidio sobre Zeus y Hermes visitando bajo apariencia humana a Baucis y Filemón se sitúa en la vecina Frigia. La excavación sistemática del montículo no comenzó hasta 2024, a cargo de un equipo de la Universidad Necmettin Erbakan, de Konya."
  pt:
    - "Paulo foi apedrejado em Listra, uma pequena colônia romana na Licaônia, a alta planície do centro da Ásia Menor, a cerca de 33 km a sudoeste de Icônio (a atual Konya) em linha reta; o ponto do mapa fica no monte junto à aldeia de Hatunsaray, na Turquia. Derbe, para onde ele foi no dia seguinte, ficava a cerca de 95 km mais a leste, e Antioquia da Pisídia, de onde seus inimigos o seguiram, a cerca de 128 km a noroeste."
    - "Paulo e Barnabé haviam fugido para lá, vindos de Icônio. Quando Paulo curou um homem coxo de nascença, a multidão “gritou em língua licaônica: Os deuses desceram até nós em semelhança de homens!”, tomou Barnabé por Zeus e Paulo por Hermes, e o sacerdote de Zeus trouxe bois para o sacrifício. Então “alguns judeus de Antioquia e de Icônio chegaram ali e, tendo persuadido as multidões, apedrejaram Paulo e o arrastaram para fora da cidade, supondo que ele estivesse morto. Mas, enquanto os discípulos estavam ao redor dele, ele se levantou e entrou na cidade. No dia seguinte, ele partiu com Barnabé para Derbe.” Paulo voltou a Listra na mesma viagem e de novo na seguinte, quando tomou Timóteo, natural da cidade, como companheiro; anos depois, recordou a Timóteo as perseguições “em Antioquia, Icônio e Listra”."
    - "Listra foi encontrada em 1885, quando o americano J. R. S. Sterrett leu no monte uma inscrição latina que nomeava a colônia Lustra; Augusto ali havia estabelecido veteranos por volta de 25 a.C. Inscrições da região registram sacerdotes de Zeus e uma estátua de Hermes dedicada a Zeus, de modo que o par de deuses de Lucas corresponde ao culto local, e o relato de Ovídio sobre Zeus e Hermes que visitam Báucis e Filemom sob a aparência de homens se passa na vizinha Frígia. A escavação sistemática do monte só começou em 2024, por uma equipe da Universidade Necmettin Erbakan, de Konya."
  de:
    - "Paulus wurde in Lystra gesteinigt, einer kleinen römischen Kolonie in Lykaonien, der Hochebene im Inneren Kleinasiens, in der Luftlinie etwa 33 km südwestlich von Ikonion (dem heutigen Konya); der Kartenpunkt steht auf dem Hügel beim Dorf Hatunsaray in der Türkei. Derbe, wohin er am nächsten Tag ging, lag etwa 95 km weiter östlich, und Antiochia in Pisidien, von wo seine Gegner ihm folgten, etwa 128 km nordwestlich."
    - "Paulus und Barnabas waren aus Ikonion dorthin geflohen. Als Paulus einen von Geburt an Lahmen heilte, „hoben sie ihre Stimme auf und sprachen auf lykaonisch: Die Götter sind den Menschen gleich geworden und zu uns herniedergekommen“, hielten Barnabas für Zeus und Paulus für Hermes, und der Priester des Zeus brachte Ochsen zum Opfer. Dann „kamen aber dahin Juden von Antiochien und Ikonion und überredeten das Volk und steinigten Paulus und schleiften ihn zur Stadt hinaus, meinten, er wäre gestorben. Da ihn aber die Jünger umringten, stand er auf und ging in die Stadt. Und den andern Tag ging er aus mit Barnabas gen Derbe“. Paulus kehrte auf derselben Reise und wieder auf der nächsten nach Lystra zurück, als er Timotheus, einen Sohn der Stadt, zum Gefährten nahm; Jahre später erinnerte er Timotheus an die Verfolgungen „zu Antiochien, zu Ikonien, zu Lystra“."
    - "Lystra wurde 1885 gefunden, als der Amerikaner J. R. S. Sterrett auf dem Hügel eine lateinische Inschrift las, die die Kolonie Lustra nennt; Augustus hatte dort um 25 v. Chr. Veteranen angesiedelt. Inschriften aus der Gegend verzeichnen Priester des Zeus und eine dem Zeus geweihte Hermesstatue, das Götterpaar des Lukas passt also zum örtlichen Kult, und Ovids Erzählung von Zeus und Hermes, die in Menschengestalt Baucis und Philemon besuchen, spielt im benachbarten Phrygien. Systematische Grabungen auf dem Hügel begannen erst 2024 durch ein Team der Necmettin-Erbakan-Universität in Konya."
  fr:
    - "Paul fut lapidé à Lystre, petite colonie romaine de Lycaonie, la haute plaine du centre de l’Asie Mineure, à environ 33 km au sud-ouest d’Icone (l’actuelle Konya) à vol d’oiseau ; le point de la carte se trouve sur le tertre près du village de Hatunsaray, en Turquie. Derbé, où il alla le lendemain, était à environ 95 km plus à l’est, et Antioche de Pisidie, d’où ses ennemis l’avaient suivi, à environ 128 km au nord-ouest."
    - "Paul et Barnabas s’y étaient réfugiés en fuyant Icone. Quand Paul guérit un homme boiteux de naissance, la foule « éleva la voix, et dit en langue lycaonienne : Les dieux sous une forme humaine sont descendus vers nous », prit Barnabas pour Zeus et Paul pour Hermès, et le prêtre de Zeus amena des taureaux pour offrir un sacrifice. Puis « survinrent d’Antioche et d’Icone des Juifs qui gagnèrent la foule, et qui, après avoir lapidé Paul, le traînèrent hors de la ville, pensant qu’il était mort. Mais, les disciples l’ayant entouré, il se leva, et entra dans la ville. Le lendemain, il partit pour Derbe avec Barnabas. » Paul revint à Lystre au cours du même voyage, puis lors du suivant, quand il prit pour compagnon Timothée, natif de la ville ; des années plus tard, il rappela à Timothée les persécutions subies « à Antioche, à Icone, à Lystre »."
    - "Lystre fut retrouvée en 1885, quand l’Américain J. R. S. Sterrett lut sur le tertre une inscription latine nommant la colonie Lustra ; Auguste y avait installé des vétérans vers 25 av. J.-C. Des inscriptions de la région mentionnent des prêtres de Zeus et une statue d’Hermès dédiée à Zeus, de sorte que le couple de dieux de Luc correspond au culte local, et le récit d’Ovide où Zeus et Hermès rendent visite sous forme d’hommes à Baucis et Philémon se situe dans la Phrygie voisine. Les fouilles systématiques du tertre n’ont commencé qu’en 2024, menées par une équipe de l’université Necmettin Erbakan de Konya."
  pl:
    - "Paweł został ukamienowany w Listrze, małej rzymskiej kolonii w Likaonii, na wysokiej równinie środkowej Azji Mniejszej, około 33 km na południowy zachód od Ikonium (dzisiejszej Konyi) w linii prostej; punkt na mapie stoi na wzgórzu przy wsi Hatunsaray w Turcji. Derbe, dokąd udał się następnego dnia, leżało około 95 km dalej na wschód, a Antiochia Pizydyjska, skąd podążyli za nim jego wrogowie, około 128 km na północny zachód."
    - "Paweł i Barnaba uciekli tu z Ikonium. Gdy Paweł uzdrowił człowieka chromego od urodzenia, ludzie w tłumie „podnieśli głos swój, mówiąc po likaońsku: Bogowie stawszy się podobni ludziom, zstąpili do nas”, uznali Barnabę za Zeusa, a Pawła za Hermesa, a kapłan Zeusa przywiódł woły na ofiarę. Potem „A nadeszli z Antyjochyi i z Ikonii Żydowie, którzy namówiwszy lud i ukamionowawszy Pawła, wywlekli za miasto, mniemając żeby umarł. Lecz gdy go uczniowie obstąpili, wstawszy wszedł do miasta, a nazajutrz odszedł z Barnabaszem do Derby”. Paweł wrócił do Listry w tej samej podróży i znów w następnej, gdy wziął na towarzysza Tymoteusza, rodaka z tego miasta; po latach przypomniał Tymoteuszowi prześladowania „w Antyjochii, w Ikonii i w Listrze”."
    - "Listrę odnaleziono w 1885 roku, gdy Amerykanin J. R. S. Sterrett odczytał na wzgórzu łaciński napis nazywający kolonię Lustra; August osiedlił tam weteranów około 25 p.n.e. Napisy z okolicy zapisują kapłanów Zeusa i posąg Hermesa poświęcony Zeusowi, więc para bogów u Łukasza zgadza się z miejscowym kultem, a opowieść Owidiusza o Zeusie i Hermesie odwiedzających Baucis i Filemona pod postacią ludzi rozgrywa się w sąsiedniej Frygii. Systematyczne wykopaliska na wzgórzu rozpoczęły się dopiero w 2024 roku, prowadzone przez zespół Uniwersytetu Necmettina Erbakana w Konyi."
  it:
    - "Paolo fu lapidato a Listra, una piccola colonia romana in Licaonia, l’alta pianura dell’Asia Minore centrale, a circa 33 km a sud-ovest di Icònio (l’odierna Konya) in linea d’aria; il punto della mappa si trova sul tell presso il villaggio di Hatunsaray in Turchia. Derbe, dove si recò il giorno dopo, distava circa 95 km più a est, e Antiochia di Pisidia, da cui i suoi nemici lo seguirono, circa 128 km a nord-ovest."
    - "Paolo e Barnaba vi erano fuggiti da Icònio. Quando Paolo guarì un uomo zoppo dalla nascita, le turbe «alzarono la voce, dicendo in lingua licaonica: Gli dèi hanno preso forma umana, e sono discesi fino a noi», presero Barnaba per Zeus e Paolo per Erme, e il sacerdote di Zeus portò dei buoi per sacrificare. Poi «sopraggiunsero quivi de’ Giudei da Antiochia e da Iconio; i quali, avendo persuaso le turbe, lapidarono Paolo e lo trascinaron fuori della città, credendolo morto. Ma essendosi i discepoli raunati intorno a lui, egli si rialzò, ed entrò nella città; e il giorno seguente, partì con Barnaba per Derba». Paolo tornò a Listra nello stesso viaggio e di nuovo in quello successivo, quando prese con sé come compagno Timoteo, nativo della città; anni dopo ricordò a Timoteo le persecuzioni «ad Antiochia, ad Iconio ed a Listra»."
    - "Listra fu ritrovata nel 1885, quando l’americano J. R. S. Sterrett lesse sul tell un’iscrizione latina che nominava la colonia Lustra; Augusto vi aveva insediato dei veterani verso il 25 a.C. Iscrizioni della regione ricordano sacerdoti di Zeus e una statua di Erme dedicata a Zeus, così che la coppia di dèi di Luca corrisponde al culto locale, e il racconto di Ovidio di Zeus ed Erme che visitano Filemone e Bauci in sembianze umane è ambientato nella vicina Frigia. Lo scavo sistematico del tell iniziò solo nel 2024, a opera di una squadra dell’Università Necmettin Erbakan di Konya."
  cs:
    - "Pavel byl ukamenován v Lystře, malé římské kolonii v Lykaonii, na vysoké planině střední Malé Asie, vzdušnou čarou asi 33 km jihozápadně od Ikonia (dnešní Konye); bod na mapě stojí na pahorku u vsi Hatunsaray v Turecku. Derbe, kam odešel příštího dne, bylo asi o 95 km dále na východ a Antiochie Pisidská, odkud ho jeho nepřátelé sledovali, asi 128 km na severozápad."
    - "Pavel a Barnabáš sem uprchli z Ikonia. Když Pavel uzdravil muže chromého od narození, lidé „pozdvihli hlasu svého, Lykaonitsky řkouce: Bohové připodobnivše se lidem, sstoupili k nám“, pokládali Barnabáše za Dia a Pavla za Herma a kněz Diův přivedl voly k obětování. Potom „přišli od Antiochie a Ikonie nějací Židé, kteřížto navedše zástupy, a ukamenovavše Pavla, vytáhli jej před město, domnívajíce se, že umřel. A když jej obstoupili učedlníci, vstal a všel do města, a nazejtří odšel s Barnabášem do Derben.“ Pavel se do Lystry vrátil na téže cestě a znovu na příští, kdy si za společníka vzal Timotea, rodáka z města; po letech Timoteovi připomněl pronásledování „v Antiochii, v Ikonii, a v Lystře“."
    - "Lystra byla nalezena roku 1885, kdy Američan J. R. S. Sterrett přečetl na pahorku latinský nápis jmenující kolonii Lustra; Augustus tam usadil veterány kolem roku 25 př. n. l. Nápisy z okolí zaznamenávají kněze Dia a sochu Herma zasvěcenou Diovi, takže Lukášova dvojice bohů odpovídá místnímu kultu, a Ovidiův příběh o Diovi a Hermovi, kteří v podobě lidí navštívili Baukis a Filemona, se odehrává v sousední Frygii. Systematické vykopávky pahorku začaly až roku 2024, týmem z univerzity Necmettina Erbakana v Konyi."
  nl:
    - "Paulus werd gestenigd te Lystra, een kleine Romeinse kolonie in Lykaonië, de hoogvlakte van Midden-Klein-Azië, hemelsbreed ongeveer 33 km ten zuidwesten van Ikonium (het huidige Konya); het punt op de kaart staat op de heuvel bij het dorp Hatunsaray in Turkije. Derbe, waarheen hij de volgende dag ging, lag ongeveer 95 km verder naar het oosten, en Antiochië in Pisidië, vanwaar zijn vijanden hem volgden, ongeveer 128 km naar het noordwesten."
    - "Paulus en Barnabas waren daarheen gevlucht uit Ikonium. Toen Paulus een man genas die van zijn geboorte lam was, verhieven de scharen hun stem, en zij “zeiden in het Lycaonisch: De goden zijn den mensen gelijk geworden, en tot ons nedergekomen”; zij hielden Barnabas voor Zeus en Paulus voor Hermes, en de priester van Zeus bracht ossen om te offeren. Daarna “kwamen Joden van Antiochië en Ikonium, en overreedden de scharen, en stenigden Paulus, en sleepten hem buiten de stad, menende, dat hij dood was. Doch als hem de discipelen omringd hadden, stond hij op, en kwam in de stad; en des anderen daags ging hij met Barnabas uit naar Derbe.” Paulus keerde op dezelfde reis naar Lystra terug en weer op de volgende, toen hij Timoteüs, een inwoner van de stad, als metgezel meenam; jaren later herinnerde hij Timoteüs aan de vervolgingen “in Antiochië, in Ikonium en in Lystre”."
    - "Lystra werd in 1885 teruggevonden, toen de Amerikaan J. R. S. Sterrett op de heuvel een Latijns opschrift las dat de kolonie Lustra noemt; Augustus had daar rond 25 v.Chr. veteranen gevestigd. Opschriften uit de streek vermelden priesters van Zeus en een standbeeld van Hermes dat aan Zeus was gewijd, zodat het paar goden bij Lukas overeenkomt met de plaatselijke cultus, en Ovidius' verhaal van Zeus en Hermes die als mensen Baucis en Filemon bezochten speelt in het naburige Frygië. Systematische opgraving van de heuvel begon pas in 2024, door een team van de Necmettin Erbakan-universiteit in Konya."
  sv:
    - "Paulus blev stenad i Lystra, en liten romersk koloni i Lykaonien, högslätten i centrala Mindre Asien, omkring 33 km sydväst om Ikonion (dagens Konya) i fågelvägen; kartpunkten står på kullen vid byn Hatunsaray i Turkiet. Derbe, dit han gick dagen därpå, låg omkring 95 km längre österut, och Antiochia i Pisidien, varifrån hans fiender följde efter honom, omkring 128 km åt nordväst."
    - "Paulus och Barnabas hade flytt dit från Ikonion. När Paulus botade en man som var lam från födseln, ”hovo de upp sin röst och ropade på lykaoniskt tungomål: ’Gudarna hava stigit ned till oss i människogestalt’”, och folket tog Barnabas för Zeus och Paulus för Hermes, och Zeus’ präst förde fram tjurar för att offra. Därefter heter det: ”Men några judar kommo dit från Antiokia och Ikonium. Dessa drogo folket över på sin sida och stenade Paulus och släpade honom ut ur staden, i tanke att han var död. Men sedan lärjungarna hade samlat sig omkring honom, reste han sig upp och gick in i staden. Dagen därefter begav han sig med Barnabas åstad därifrån till Derbe.” Paulus kom tillbaka till Lystra på samma resa och igen på nästa, då han tog Timoteus, som var född i staden, till följeslagare; år senare påminde han Timoteus om förföljelserna ”i Antiokia, Ikonium och Lystra”."
    - "Lystra återfanns 1885, då amerikanen J. R. S. Sterrett läste en latinsk inskrift på kullen som nämnde kolonin Lustra; Augustus hade bosatt veteraner där omkring 25 f.Kr. Inskrifter från trakten uppger präster för Zeus och en staty av Hermes tillägnad Zeus, så Lukas par av gudar stämmer med den lokala kulten, och Ovidius berättelse om Zeus och Hermes som besöker Baukis och Filemon i människogestalt är förlagd till grannlandet Frygien. Systematiska utgrävningar av kullen började först 2024, av ett team från Necmettin Erbakan-universitetet i Konya."
  nb:
    - "Paulus ble steinet i Lystra, en liten romersk koloni i Lykaonia, den høye sletten i det sentrale Lilleasia, omtrent 33 km sørvest for Ikonium (dagens Konya) i luftlinje; kartpunktet står på haugen ved landsbyen Hatunsaray i Tyrkia. Derbe, dit han dro neste dag, lå omtrent 95 km lenger øst, og Antiokia i Pisidia, hvorfra hans fiender fulgte etter, omtrent 128 km mot nordvest."
    - "Paulus og Barnabas hadde flyktet dit fra Ikonium. Da Paulus helbredet en mann som var vanfør fra fødselen, «ropte de med høi røst på lykaonisk og sa: Gudene er blitt mennesker lik og er kommet ned til oss», og de holdt Barnabas for Zevs og Paulus for Hermes, og Zevs’ prest brakte okser for å ofre. Så heter det: «Men det kom jøder til fra Antiokia og Ikonium og overtalte folket, og de stenet Paulus og slepte ham utenfor byen, da de trodde at han var død; men mens disiplene flokket sig omkring ham, stod han op og gikk inn i byen. Den næste dag drog han med Barnabas avsted til Derbe.» Paulus kom tilbake til Lystra på samme reise og igjen på den neste, da han tok Timoteus, en innfødt fra byen, med som følgesvenn; år senere minnet han Timoteus om forfølgelsene «i Antiokia, i Ikonium, i Lystra»."
    - "Lystra ble gjenfunnet i 1885, da amerikaneren J. R. S. Sterrett leste en latinsk innskrift på haugen som kalte kolonien Lustra; Augustus hadde bosatt veteraner der omkring 25 f.Kr. Innskrifter fra distriktet nevner Zevs-prester og en Hermes-statue viet til Zevs, så Lukas’ gudepar svarer til den lokale kulten, og Ovids fortelling om Zevs og Hermes som besøkte Baucis og Filemon i menneskers skikkelse, er satt i nabolandet Frygia. Systematisk utgraving av haugen begynte først i 2024, ved et team fra Necmettin Erbakan-universitetet i Konya."
  tl:
    - "Si Pablo ay binato sa Listra, isang maliit na kolonyang Romano sa Licaonia, ang mataas na kapatagan ng gitnang Asia Minor, mga 33 km sa timog-kanluran ng Iconio (ang Konya ngayon) sa tuwid na guhit; nakatayo ang punto sa mapa sa burol sa tabi ng nayon ng Hatunsaray sa Turkey. Ang Derbe, na pinuntahan niya kinabukasan, ay mga 95 km pa sa silangan, at ang Antioquia ng Pisidia, kung saan sumunod ang kaniyang mga kaaway, mga 128 km sa hilagang-kanluran."
    - "Doon tumakas mula Iconio sina Pablo at Bernabe. Nang pagalingin ni Pablo ang isang lumpo mula pagsilang, sumigaw ang madla sa wikang Licaonia: “Ang mga dios ay nagsibaba sa atin sa anyo ng mga tao”; itinuring si Bernabe na Zeus at si Pablo na Hermes, at nagdala ng torong ihahain ang saserdote ni Zeus. Noon, “nagsirating ang mga Judiong buhat sa Antioquia at Iconio: at nang mahikayat nila ang mga karamihan, ay kanilang pinagbabato si Pablo, at kinaladkad nila siya sa labas ng bayan, na inaakalang siya'y patay na. Datapuwa't samantalang ang mga alagad ay nangakatayo sa paligid niya, ay nagtindig siya, at pumasok sa bayan: at nang kinabukasa'y umalis siya na kasama ni Bernabe napasa Derbe.” Bumalik siya roon sa paglalakbay ding iyon at sa sumunod, nang isama niya ang taga-roong si Timoteo; ipinaalala niya rito kalaunan ang pag-uusig “sa Antioquia, sa Iconio, sa Listra”."
    - "Natagpuan ang Listra noong 1885, nang basahin ng Amerikanong si J. R. S. Sterrett ang isang inskripsiyong Latin sa burol na nagpapangalan sa kolonya na Lustra; pinatira roon ni Augusto ang mga beterano noong mga 25 BK. Itinatala ng mga inskripsiyon mula sa distrito ang mga saserdote ni Zeus at isang rebulto ni Hermes na inialay kay Zeus, kaya tumutugma ang pares ng mga diyos ni Lucas sa lokal na kulto, at ang kuwento ni Ovid tungkol kina Zeus at Hermes na dumalaw kina Baucis at Filemon na nagkukunwaring tao ay itinakda sa kalapit na Frigia. Nagsimula lamang ang sistematikong paghuhukay sa burol noong 2024, ng isang pangkat mula sa Pamantasang Necmettin Erbakan sa Konya."
  da:
    - "Paulus blev stenet i Lystra, en lille romersk koloni i Lykaonien, den høje slette i det centrale Lilleasien, ca. 33 km sydvest for Ikonion (nutidens Konya) i fugleflugt; kortets punkt står på tellen ved landsbyen Hatunsaray i Tyrkiet. Derbe, hvor han drog hen næste dag, lå ca. 95 km længere mod øst, og Antiokia i Pisidien, hvorfra hans fjender fulgte ham, ca. 128 km mod nordvest."
    - "Paulus og Barnabas var flygtet dertil fra Ikonion. Da Paulus helbredte en mand, der var lam fra fødslen, »opløftede de deres Røst og sagde paa Lykaonisk: Guderne ere i menneskelig Skikkelse stegne ned til os«, tog Barnabas for Zeus og Paulus for Hermes, og Zeus’ præst bragte tyre for at ofre. Så »der kom Jøder til fra Antiokia og Ikonium, og de overtalte Skarerne og stenede Paulus og slæbte ham uden for Byen i den Tro, at han var død. Men da Disciplene omringede ham, stod han op og gik ind i Byen. Og den næste Dag gik han med Barnabas bort til Derbe.« Paulus kom tilbage til Lystra på den samme rejse og igen på den næste, da han tog Timotheus, en indfødt af byen, med som ledsager; år senere mindede han Timotheus om forfølgelserne »i Antiokia, i Ikonium, i Lystra«."
    - "Lystra blev fundet i 1885, da amerikaneren J. R. S. Sterrett læste en latinsk indskrift på tellen, der nævnte kolonien Lustra; Augustus havde bosat veteraner der omkring 25 f.Kr. Indskrifter fra området optegner Zeus-præster og en Hermes-statue viet til Zeus, så Lukas’ gudepar svarer til den lokale kult, og Ovids fortælling om Zeus og Hermes, der besøger Baucis og Filemon i menneskeskikkelse, er henlagt til nabolandet Frygien. Systematisk udgravning af tellen begyndte først i 2024, ved et hold fra Necmettin Erbakan Universitet i Konya."
  sr:
    - "Павле је био каменован у Листри, малој римској колонији у Ликаонији, високој равници централне Мале Азије, око 33 км југозападно од Иконија (данашње Коње) ваздушном линијом; тачка на карти стоји на хумци поред села Хатунсарај у Турској. Дерва, куда је отишао следећег дана, била је око 95 км даље на исток, а Антиохија Писидијска, одакле су га непријатељи пратили, око 128 км северозападно."
    - "Павле и Варнава су ту побегли из Иконија. Кад је Павле исцелио човека хромог од рођења, мноштво је ликаонски повикало: „Богови начинише се као људи, и сиђоше к нама“, узело је Варнаву за Зевса, а Павла за Ерма, и Зевсов свештеник довео је јунце за жртву. Затим „дођоше из Антиохије и из Иконије некакви Јевреји… И подговоривши народ засуше Павла камењем и извукоше га из града мислећи да је мртав. А кад га опколише ученици његови, устаде и уђе у град, и сутрадан изиђе с Варнавом у Дерву.“ Павле се у Листру вратио на истом путовању и поново на следећем, кад је за пратиоца узео Тимотија, домородца из тог града; годинама касније подсетио је Тимотија на прогоне „у Антиохији, и у Иконији, и у Листри“."
    - "Листра је пронађена 1885, кад је Американац Ј. Р. С. Стерет на хумци прочитао латински натпис који колонију назива Лустра; Август је ту населио ветеране око 25. п. н. е. Натписи из околине бележе свештенике Зевса и кип Ерма посвећен Зевсу, па Лукин пар богова одговара месном култу, а Овидијева прича о Зевсу и Ерму који у људском обличју посећују Бавкиду и Филемона смештена је у суседну Фригију. Систематска ископавања хумке започела су тек 2024, а води их тим са Универзитета Нечметин Ербакан у Коњи."
  hu:
    - "Pált Lisztrában kövezték meg, Likaónia kis római gyarmatában, Kisázsia közép-fennsíkján, légvonalban mintegy 33 km-re délnyugatra Ikóniumtól (a mai Konyától); a térkép pontja a törökországi Hatunsaray falu melletti halmon áll. Derbe, ahová másnap ment, mintegy 95 km-rel keletebbre, a piszídiai Antiókhia pedig, ahonnan ellenségei követték, mintegy 128 km-re északnyugatra volt."
    - "Pál és Barnabás Ikóniumból menekültek oda. Mikor Pál meggyógyított egy született sánta embert, a sokaság „felkiálta, likaóniai nyelven mondván: Az istenek jöttek le mihozzánk emberi ábrázatban!”, Barnabást Zeusznak, Pált Hermésznek tartotta, és Zeusz papja ökröket hozott áldozatra. Azután „Jövének azonban Antiókhiából és Ikóniumból zsidók, és a sokaságot eláltatván, megkövezék Pált, és kivonszolák a városból, azt gondolván, hogy meghalt. De mikor körülvették őt a tanítványok, felkelvén, beméne a városba; és másnap Barnabással elméne Derbébe.” Pál ugyanazon az úton, majd a következőn is visszatért Lisztrába, amikor Timóteust, a város szülöttét vette társául; évekkel később emlékeztette Timóteust az üldöztetésekre „Antiókhiában, Ikóniumban, Listrában”."
    - "Lisztrát 1885-ben találták meg, amikor az amerikai J. R. S. Sterrett a halmon egy latin feliratot olvasott, amely a gyarmatot Lustraként nevezi meg; Augusztus Kr. e. 25 körül telepített ide veteránokat. A vidék feliratai Zeusz papjait és egy Zeusznak szentelt Hermész-szobrot említenek, így Lukács isteneinek párja megfelel a helyi kultusznak, Ovidius meséje pedig arról, hogy Zeusz és Hermész emberek alakjában látogatták meg Baucist és Philémónt, a szomszédos Frígiában játszódik. A halom szisztematikus ásatása csak 2024-ben kezdődött a konyai Necmettin Erbakan Egyetem csapatával."
  fi:
    - "Paavali kivitettiin Lystrassa, pienessä roomalaisessa siirtokunnassa Lykaoniassa, Vähän-Aasian keskiosan ylätasangolla, linnuntietä noin 33 km Ikonionista (nykyisestä Konyasta) lounaaseen; kartan piste on Hatunsarayn kylän vieressä Turkissa olevalla kummulla. Derbe, jonne hän meni seuraavana päivänä, oli noin 95 km kauempana idässä, ja Pisidian Antiokia, josta hänen vihollisensa seurasivat häntä, noin 128 km luoteeseen."
    - "Paavali ja Barnabas pakenivat sinne Ikonionista. Kun Paavali oli parantanut syntymästään rammaksi tulleen miehen, kansa korotti äänensä ja puhui ”lykaoniankielellä: ’Jumalat ovat ihmishahmossa astuneet alas meidän luoksemme’”. He pitivät Barnabasta Zeuksena ja Paavalia Hermeksenä, ja Zeuksen pappi toi härkiä uhrattaviksi. Sitten ”sinne tuli Antiokiasta ja Ikonionista juutalaisia, ja he suostuttivat kansan puolellensa ja kivittivät Paavalia ja raastoivat hänet kaupungin ulkopuolelle, luullen hänet kuolleeksi. Mutta kun opetuslapset olivat kokoontuneet hänen ympärilleen, nousi hän ja meni kaupunkiin. Ja seuraavana päivänä hän lähti Barnabaan kanssa Derbeen.” Paavali palasi Lystraan samalla ja seuraavalla matkalla, jolloin hän otti seuralaisekseen kaupungista kotoisin olevan Timoteuksen; myöhemmin hän muistutti tätä vainoista ”Antiokiassa, Ikonionissa ja Lystrassa”."
    - "Lystra löydettiin vuonna 1885, kun amerikkalainen J. R. S. Sterrett luki kummulla latinankielisen kirjoituksen, joka nimesi siirtokunnan Lustraksi; Augustus oli asettanut sinne veteraaneja noin 25 eaa. Seudun kirjoitukset mainitsevat Zeuksen pappeja ja Zeukselle omistetun Hermeksen patsaan, joten Luukkaan jumalapari vastaa paikallista kulttia, ja Ovidiuksen tarina siitä, kuinka Zeus ja Hermes vierailivat ihmisen hahmossa Baukiin ja Filemonin luona, sijoittuu naapurimaakunta Fryygiaan. Kummun järjestelmälliset kaivaukset alkoivat vasta vuonna 2024, ja ne aloitti Konyan Necmettin Erbakanin yliopiston ryhmä."
  vi:
    - "Phao-lô bị ném đá tại Lít-trơ, một thuộc địa La Mã nhỏ ở Ly-cao-ni, đồng bằng cao của miền trung Tiểu Á, cách Y-cô-ni (nay là Konya) khoảng 33 km về phía tây nam theo đường thẳng; điểm trên bản đồ nằm trên gò cạnh làng Hatunsaray ở Thổ Nhĩ Kỳ. Đẹt-bơ, nơi ông đến vào ngày hôm sau, cách xa hơn khoảng 95 km về phía đông, và An-ti-ốt xứ Bi-si-đi, nơi những kẻ thù của ông đã theo ông, cách khoảng 128 km về phía tây bắc."
    - "Phao-lô và Ba-na-ba đã chạy trốn đến đó từ Y-cô-ni. Khi Phao-lô chữa lành một người què từ lúc mới sinh, đám đông “kêu lên bằng tiếng Li-cao-ni rằng: Các thần đã lấy hình loài người mà xuống cùng chúng ta”, coi Ba-na-ba là Zeus và Phao-lô là Hermes, và thầy tế lễ của Zeus đem bò đến để cúng tế. Rồi “có mấy người Giu-đa từ thành An-ti-ốt và thành Y-cô-ni đến dỗ dành dân chúng; chúng ném đá Phao-lô, tưởng người đã chết, nên kéo ra ngoài thành. Nhưng các môn đồ đang nhóm chung quanh người, thì người vùng đứng dậy và vào trong thành. Bữa sau, người đi với Ba-na-ba đến thành Đẹt-bơ.” Phao-lô trở lại Lít-trơ trong cùng chuyến đi và lần nữa trong chuyến kế tiếp, khi ông đem Ti-mô-thê, người gốc thị trấn, làm bạn đồng hành; nhiều năm sau, ông nhắc Ti-mô-thê về những sự bắt bớ “tại thành An-ti-ốt, Y-cô-ni và Lít-trơ”."
    - "Lít-trơ được tìm ra năm 1885, khi J. R. S. Sterrett người Mỹ đọc một bản khắc tiếng Latin trên gò nêu tên thuộc địa là Lustra; Au-gút-tơ đã cho các cựu binh định cư ở đó khoảng năm 25 TCN. Các bản khắc trong vùng ghi các thầy tế lễ của Zeus và một bức tượng Hermes dâng cho Zeus, nên cặp thần của Lu-ca khớp với tín ngưỡng địa phương, và truyện của Ovid về Zeus và Hermes viếng Baucis và Philemon trong hình dạng người phàm lấy bối cảnh ở Phi-ri-gi láng giềng. Cuộc khai quật có hệ thống trên gò chỉ bắt đầu năm 2024, do một nhóm của Đại học Necmettin Erbakan ở Konya."
  ro:
    - "Pavel a fost lapidat la Listra, o mică colonie romană din Licaonia, câmpia înaltă din centrul Asiei Mici, la circa 33 km sud-vest de Iconia (azi Konya) în linie dreaptă; punctul de pe hartă se află pe movila de lângă satul Hatunsaray din Turcia. Derba, unde a mers a doua zi, se afla la circa 95 km mai spre est, iar Antiohia Pisidiei, de unde l-au urmat dușmanii lui, la circa 128 km spre nord-vest."
    - "Pavel și Barnaba fugiseră acolo din Iconia. Când Pavel a vindecat un om olog din naștere, mulțimea „au ridicat glasul lor, licaonește zicând: dumnezeii, asemănându-se oamenilor, s’au pogorît către noi”, l-a luat pe Barnaba drept Zeus și pe Pavel drept Hermes, iar preotul lui Zeus a adus boi pentru jertfă. Apoi: „Și au venit dela Antiohia și Iconia Iudei, și îndemnând pre noroade, și cu pietre lovind pre Pavel, l-au tras afară din cetate gândind că a murit. Iar încunjurându’l pre el ucenicii, sculându-se a intrat în cetate, și a doua zi a ieșit împreună cu Varnava în Dervi.” Pavel s-a întors la Listra în aceeași călătorie și din nou în următoarea, când l-a luat drept însoțitor pe Timotei, originar din oraș; ani mai târziu i-a amintit lui Timotei persecuțiile pătimite „în Antiohia, în Iconia, în Listra”."
    - "Listra a fost găsită în 1885, când americanul J. R. S. Sterrett a citit pe movilă o inscripție latină care numea colonia Lustra; Augustus așezase acolo veterani în jurul anului 25 î.Hr. Inscripții din district consemnează preoți ai lui Zeus și o statuie a lui Hermes închinată lui Zeus, așa că perechea de zei a lui Luca se potrivește cu cultul local, iar povestea lui Ovidiu despre Zeus și Hermes care i-au vizitat pe Baucis și Filimon în chip de oameni este plasată în Frigia vecină. Săpăturile sistematice ale movilei au început abia în 2024, de către o echipă de la Universitatea Necmettin Erbakan din Konya."
  bg:
    - "Павел беше пребит с камъни в Листра — малка римска колония в Ликаония, високата равнина в Централна Мала Азия, на около 33 км югозападно от Икония (днешна Коня) по права линия; точката на картата стои на хълма до село Хатунсарай в Турция. Дервия, където той отиде на следващия ден, беше на около 95 км по на изток, а Писидийска Антиохия, откъдето го последваха враговете му — на около 128 км на северозапад."
    - "Павел и Варнава бяха избягали там от Икония. Когато Павел изцели един куц по рождение, народът „възвисиха гласа си и казваха по Ликаонски: Боговете уподобени на человеци слезоха при нас“, взеха Варнава за Зевс, а Павел — за Ермий, и жрецът на Зевс доведе волове за жертва. Тогава „дойдоха Юдеи от Антиохия и Икония които убедиха народа та биха Павла с камене, и го извлекоха вън из града като го възмнеха че е умрел. А когато го обиколиха учениците стана та влезе в града; и на утринта отиде с Варнава в Дервия.“ Павел се върна в Листра през същото пътуване и отново през следващото, когато взе за спътник Тимотей, родом от този град; години по-късно той напомни на Тимотей за гоненията „в Антиохия, в Икония, в Листра“."
    - "Листра е открита през 1885 г., когато американецът Дж. Р. С. Стерет разчете на хълма латински надпис, който назовава колонията Lustra; Август беше заселил там ветерани около 25 г. пр.н.е. Надписи от областта споменават жреци на Зевс и статуя на Ермий, посветена на Зевс, така че двойката богове при Лука отговаря на местния култ, а разказът на Овидий за Зевс и Ермий, които в човешки образ посещават Бавкида и Филимон, се развива в съседна Фригия. Системните разкопки на хълма започнаха едва през 2024 г., от екип на университета „Неджметин Ербакан“ в Коня."
