id: where-was-susa
question:
  en: "Where was Susa, the Shushan of Esther?"
  ru: "Где находились Сузы, престольный город Есфири?"
  uk: "Де були Сузи, Шушан Книги Естер?"
  es: "¿Dónde estaba Susa, la Susán de Ester?"
  pt: "Onde ficava Susã, a cidade de Ester?"
  de: "Wo lag Susa, das Susan des Buches Ester?"
  fr: "Où se trouvait Suse, la Suse d’Esther ?"
  pl: "Gdzie leżała Suza, Susan z Księgi Estery?"
  it: "Dov’era Susa (Susan), la città di Ester?"
  cs: "Kde ležely Susy, Šúšan z knihy Ester?"
  nl: "Waar lag Susa, het Susan van Ester?"
  sv: "Var låg Susa, Esters Susan?"
  nb: "Hvor lå Susa, Esters Susan?"
answer:
  en:
    - "Susa is the mound of Shush in Khuzestan, in south-western Iran, on the plain below the Zagros mountains; the map point stands on it. It lay about 360 km east of Babylon in a straight line and about 1,230 km from Jerusalem, and it had long been a chief city of Elam before the Persians made it one of their royal cities."
    - "Three books of the Bible are set there. Daniel sees his vision of the ram and the goat “at Shushan in the palace, which is in the province of Elam… by the river of Ulai”; Nehemiah is cupbearer “in Shushan the palace” when the news from Jerusalem reaches him in the twentieth year of Artaxerxes, 445 BC; and the whole Book of Esther plays out in the palace and city of Susa in the reign of Ahasuerus, who is Xerxes (486–465 BC): “the king and Haman sat down to drink; but the city Shushan was perplexed.” Darius I had built the palace at the end of the sixth century; his foundation inscription lists cedar from Lebanon, gold from Lydia and Bactria, lapis lazuli from Sogdiana and ivory from Kush, India and Arachosia, brought together by craftsmen from every part of the empire."
    - "Herodotus describes the Royal Road from Sardis to Susa, 111 stations and about ninety days on foot, nearly 2,000 km in a straight line; the king's couriers rode it in relays, as the posts of Ahasuerus “went out, being hastened by the king's commandment”. French excavators dug Susa from 1884 onward: the palace of Darius with its glazed-brick archers, now in the Louvre, and in 1901 the stele of Hammurabi's laws, which an Elamite king had carried off from Babylonia. A shrine beside the mound is venerated as the tomb of Daniel."
  ru:
    - "Сузы — это холм Шуш в Хузестане, на юго-западе Ирана, на равнине под горами Загроса; точка карты стоит на нём. Город лежал примерно в 360 км к востоку от Вавилона по прямой и в 1230 км от Иерусалима и долго был одним из главных городов Елама, прежде чем персы сделали его одним из своих царских городов."
    - "Три книги Библии разворачиваются здесь. Даниил видит видение об овне и козле «в Сузах, престольном городе в области Еламской… у реки Улая»; Неемия — виночерпий «в Сузах, престольном городе», когда в двадцатый год Артаксеркса, в 445 г. до н. э., к нему приходят вести из Иерусалима; а вся книга Есфири происходит во дворце и городе Сузы при Артаксерксе Синодального перевода, то есть Ксерксе (486–465 гг. до н. э.): «царь и Аман сидели и пили, а город Сузы был в смятении». Дворец построил Дарий I в конце VI века; его закладная надпись перечисляет кедр с Ливана, золото из Лидии и Бактрии, лазурит из Согдианы, слоновую кость из Куша, Индии и Арахосии — всё, что свезли мастера со всех концов империи."
    - "Геродот описывает Царскую дорогу из Сардиса в Сузы: 111 станций и около девяноста дней пешего пути, почти 2000 км по прямой; царские гонцы скакали по ней эстафетой, как гонцы Артаксеркса в книге Есфирь, что «отправились быстро с царским повелением». Французские археологи копали Сузы с 1884 года: дворец Дария с его лучниками из глазурованного кирпича, ныне в Лувре, а в 1901 году — стелу с законами Хаммурапи, которую эламский царь увёз из Вавилонии. Святилище рядом с холмом почитают как гробницу Даниила."
  uk:
    - "Сузи — це пагорб Шуш у Хузестані, на південному заході Ірану, на рівнині під горами Загрос; точка на мапі стоїть на ньому. Вони лежали приблизно за 360 км на схід від Вавилона по прямій і приблизно за 1230 км від Єрусалима, і довго були головним містом Еламу, перш ніж перси зробили їх одним зі своїх царських міст."
    - "Тут відбуваються три книги Біблії. Даниїл бачить своє видіння барана й козла: «був я в Сузах, престольному містї в краю Еламськім ... коло ріки Улая»; Неемія — виночерпій «в Сузах, столичному містї», коли вістка з Єрусалима доходить до нього двадцятого року Артаксеркса, 445 р. до н. е.; а вся Книга Естер розгортається в палаці й місті Суз за правління Ахашвероша, тобто Ксеркса (486–465 рр. до н. е.): «седїли царь та Аман і пили, а місто Сузи було зворушене». Дарій I збудував палац наприкінці VI ст. до н. е.; його засновницький напис перелічує кедр із Лівану, золото з Лідії та Бактрії, лазурит із Согдіани й слонову кістку з Куша, Індії та Арахозії, зібрані майстрами з усіх частин імперії."
    - "Геродот описує Царську дорогу від Сард до Суз, 111 станцій і близько дев'яноста днів пішки, майже 2000 км по прямій; царські гінці їхали нею естафетою, як і гінці Ахашвероша, що «одійшли зараз з царським приказом». Французькі розкопники копали Сузи від 1884 р.: палац Дарія з його глазурованими цегляними лучниками, нині в Луврі, а 1901 р. — стелу законів Хаммурапі, яку еламський цар вивіз із Вавилонії. Святиню поруч із пагорбом шанують як гробницю Даниїла."
  es:
    - "Susa es el montículo de Shush, en Juzestán, en el suroeste de Irán, en la llanura bajo los montes Zagros; el punto del mapa está sobre él. Quedaba a unos 360 km al este de Babilonia en línea recta y a unos 1230 km de Jerusalén, y había sido durante mucho tiempo una de las principales ciudades de Elam antes de que los persas la hicieran una de sus ciudades reales."
    - "Tres libros de la Biblia se sitúan allí. Daniel tiene su visión del carnero y del macho cabrío en Susán, en el palacio, en la provincia de Elam, junto al río Ulai; Nehemías es copero «en Susán, capital del reino» cuando le llega la noticia de Jerusalén, en el año veinte de Artajerjes, 445 a. C.; y todo el libro de Ester transcurre en el palacio y la ciudad de Susa durante el reinado de Asuero, que es Jerjes (486–465 a. C.): «Y el rey y Amán estaban sentados á beber, y la ciudad de Susán estaba conmovida». Darío I había construido el palacio a finales del siglo VI a. C.; su inscripción de fundación enumera cedro del Líbano, oro de Lidia y Bactriana, lapislázuli de Sogdiana y marfil de Kush, la India y Aracosia, reunidos por artesanos de todas las partes del imperio."
    - "Heródoto describe el Camino Real de Sardis a Susa, 111 estaciones y unos noventa días a pie, casi 2000 km en línea recta; los correos del rey lo recorrían en relevos, como los correos de Asuero, que «salieron… de priesa por mandato del rey». Arqueólogos franceses excavaron Susa desde 1884: el palacio de Darío con sus arqueros de ladrillo vidriado, hoy en el Louvre, y en 1901 la estela con las leyes de Hammurabi, que un rey elamita se había llevado de Babilonia. Un santuario junto al montículo se venera como tumba de Daniel."
  pt:
    - "Susã é o monte de Shush, no Cuzistão, no sudoeste do Irã, na planície abaixo dos montes Zagros; o ponto do mapa fica sobre ele. Ficava a cerca de 360 km a leste da Babilônia em linha reta e a cerca de 1.230 km de Jerusalém, e fora por muito tempo uma das principais cidades de Elão antes de os persas fazerem dela uma de suas cidades reais."
    - "Três livros da Bíblia se passam ali. Daniel tem a sua visão do carneiro e do bode “na cidadela de Susã, que fica na província de Elão… junto ao rio Ulai”; Neemias é copeiro “no palácio de Susã” quando lhe chega a notícia de Jerusalém, no vigésimo ano de Artaxerxes, 445 a.C.; e todo o livro de Ester se desenrola no palácio e na cidade de Susã, no reinado de Assuero, que é Xerxes (486–465 a.C.): “O rei e Hamã se assentaram para beber; mas a cidade de Susã estava perplexa.” Dario I construíra o palácio no fim do século VI a.C.; sua inscrição de fundação enumera cedro do Líbano, ouro da Lídia e da Báctria, lápis-lazúli da Sogdiana e marfim de Cuxe, da Índia e da Aracósia, reunidos por artesãos de todas as partes do império."
    - "Heródoto descreve a Estrada Real de Sardes a Susã, 111 estações e cerca de noventa dias a pé, quase 2.000 km em linha reta; os correios do rei a percorriam em revezamento, como os mensageiros de Assuero que saíram “apressados e impulsionados pela ordem do rei”. Os escavadores franceses cavaram Susã a partir de 1884: o palácio de Dario, com seus arqueiros de tijolo esmaltado, hoje no Louvre, e, em 1901, a estela das leis de Hamurabi, que um rei elamita havia levado da Babilônia. Um santuário junto ao monte é venerado como o túmulo de Daniel."
  de:
    - "Susa ist der Hügel von Schusch in Chuzestan, im Südwesten Irans, auf der Ebene unterhalb des Zagros-Gebirges; der Kartenpunkt steht darauf. Es lag in der Luftlinie etwa 360 km östlich von Babylon und etwa 1230 km von Jerusalem, und es war lange eine Hauptstadt Elams gewesen, bevor die Perser es zu einer ihrer Königsstädte machten."
    - "Drei Bücher der Bibel spielen dort. Daniel sieht seine Vision von Widder und Bock „zu Schloß Susan im Lande Elam, am Wasser Ulai“; Nehemia ist Mundschenk „zu Susan auf dem Schloß“, als ihn im zwanzigsten Jahr des Artaxerxes, 445 v. Chr., die Nachricht aus Jerusalem erreicht; und das ganze Buch Ester spielt im Palast und in der Stadt Susa unter der Herrschaft des Ahasveros, der Xerxes ist (486–465 v. Chr.): „Und der König und Haman saßen und tranken; aber die Stadt Susan ward bestürzt.“ Darius I. hatte den Palast Ende des 6. Jahrhunderts erbaut; seine Gründungsinschrift nennt Zedernholz aus dem Libanon, Gold aus Lydien und Baktrien, Lapislazuli aus Sogdien und Elfenbein aus Kusch, Indien und Arachosien, zusammengebracht von Handwerkern aus allen Teilen des Reiches."
    - "Herodot beschreibt die Königsstraße von Sardes nach Susa, 111 Stationen und etwa neunzig Tage zu Fuß, in der Luftlinie fast 2000 km; die Boten des Königs ritten sie in Staffeln, wie die Läufer des Ahasveros „gingen aus eilend nach des Königs Wort“. Französische Ausgräber gruben Susa ab 1884: den Palast des Darius mit seinen Bogenschützen aus glasierten Ziegeln, heute im Louvre, und 1901 die Stele mit den Gesetzen Hammurabis, die ein elamitischer König aus Babylonien verschleppt hatte. Ein Schrein neben dem Hügel wird als Grab Daniels verehrt."
  fr:
    - "Suse est le tertre de Chouch, dans le Khouzestan, dans le sud-ouest de l’Iran, sur la plaine au pied des monts Zagros ; le point de la carte s’y trouve. Elle était à environ 360 km à l’est de Babylone à vol d’oiseau et à environ 1 230 km de Jérusalem, et elle avait longtemps été une ville principale d’Élam avant que les Perses n’en fassent l’une de leurs villes royales."
    - "Trois livres de la Bible s’y déroulent. Daniel a sa vision du bélier et du bouc « à Suse, la capitale, dans la province d’Élam ; et pendant ma vision, je me trouvais près du fleuve d’Ulaï » ; Néhémie est échanson « à Suse, dans la capitale » quand lui parvient la nouvelle de Jérusalem, la vingtième année d’Artaxerxès, en 445 av. J.-C. ; et tout le livre d’Esther se joue dans le palais et la ville de Suse sous le règne d’Assuérus, qui est Xerxès (486-465 av. J.-C.) : « tandis que le roi et Haman étaient à boire, la ville de Suse était dans la consternation ». Darius Ier avait bâti le palais à la fin du VIe siècle ; son inscription de fondation énumère le cèdre du Liban, l’or de Lydie et de Bactriane, le lapis-lazuli de Sogdiane et l’ivoire de Kouch, d’Inde et d’Arachosie, rassemblés par des artisans de toutes les parties de l’empire."
    - "Hérodote décrit la Route royale de Sardes à Suse, 111 relais et environ quatre-vingt-dix jours à pied, près de 2 000 km à vol d’oiseau ; les courriers du roi la parcouraient par relais, comme ceux d’Assuérus : « Les courriers partirent en toute hâte, d’après l’ordre du roi ». Des fouilleurs français fouillèrent Suse à partir de 1884 : le palais de Darius avec ses archers en briques émaillées, aujourd’hui au Louvre, et, en 1901, la stèle des lois de Hammourabi, qu’un roi élamite avait emportée de Babylonie. Un sanctuaire voisin du tertre est vénéré comme le tombeau de Daniel."
  pl:
    - "Suza to wzgórze Szusz w Chuzestanie, w południowo-zachodnim Iranie, na równinie u stóp gór Zagros; stoi na nim punkt na mapie. Leżała około 360 km na wschód od Babilonu w linii prostej i około 1230 km od Jerozolimy, a od dawna była jednym z głównych miast Elamu, zanim Persowie uczynili ją jednym ze swoich królewskich miast."
    - "Trzy księgi Biblii rozgrywają się tutaj. Daniel opisuje wizję barana i kozła, którą ujrzał, gdy „byłem w Susan, mieście głównem, które było w krainie Elam… gdym był u potoku Ulaj”; Nehemiasz jest podczaszym „na zamku w Susan”, gdy dociera do niego wieść z Jerozolimy w dwudziestym roku Artakserksesa, 445 p.n.e.; a cała Księga Estery rozgrywa się w pałacu i mieście Suza za panowania Aswerusa, czyli Kserksesa (486–465 p.n.e.): „król i Haman siedzieli pijąc; ale miasto Susan było zatrwożone”. Dariusz I zbudował pałac pod koniec VI wieku; jego napis fundacyjny wymienia cedr z Libanu, złoto z Lidii i Baktrii, lazuryt z Sogdiany oraz kość słoniową z Kusz, Indii i Arachozji, zwiezione przez rzemieślników z każdej części imperium."
    - "Herodot opisuje Drogę Królewską z Sardes do Suz, 111 stacji i około dziewięćdziesięciu dni pieszo, prawie 2000 km w linii prostej; królewscy kurierzy jechali nią w sztafecie, jak posłańcy Aswerusa, o których czytamy: „wyjechali posłowie spieszno z rozkazaniem królewskiem”. Francuscy archeolodzy kopali w Suzie od 1884: pałac Dariusza z łucznikami z glazurowanych cegieł, dziś w Luwrze, a w 1901 stelę z prawami Hammurabiego, którą elamicki król wywiózł z Babilonii. Sanktuarium obok wzgórza jest czczone jako grób Daniela."
  it:
    - "Susa è il tell di Shush nel Khuzestan, nell’Iran sud-occidentale, sulla pianura ai piedi dei monti Zagros; il punto della mappa si trova su di esso. Distava circa 360 km a est di Babilonia in linea d’aria e circa 1.230 km da Gerusalemme, ed era stata a lungo una delle principali città dell’Elam prima che i Persiani ne facessero una delle loro città regali."
    - "Tre libri della Bibbia vi sono ambientati. Daniele ha la sua visione del montone e del capro «a Susan, la residenza reale, che è nella provincia di Elam; e, nella visione, mi trovavo presso il fiume Ulai»; Neemia è coppiere «nel castello di Susan» quando gli giunge la notizia da Gerusalemme nel ventesimo anno di Artaserse, il 445 a.C.; e l’intero libro di Ester si svolge nel palazzo e nella città di Susa durante il regno di Assuero, che è Serse (486–465 a.C.): «il re e Haman se ne stavano a sedere bevendo, la città di Susa era costernata». Dario I aveva costruito il palazzo alla fine del VI secolo a.C.; la sua iscrizione di fondazione elenca cedro del Libano, oro di Lidia e della Battriana, lapislazzuli della Sogdiana e avorio di Kush, dell’India e dell’Aracosia, radunati da artigiani di ogni parte dell’impero."
    - "Erodoto descrive la Via Regia da Sardi a Susa, 111 stazioni e circa novanta giorni a piedi, quasi 2.000 km in linea d’aria; i corrieri del re la percorrevano a staffetta, come i corrieri di Assuero «partirono in tutta fretta per ordine del re». Archeologi francesi scavarono Susa dal 1884 in poi: il palazzo di Dario con i suoi arcieri di mattoni smaltati, oggi al Louvre, e nel 1901 la stele delle leggi di Hammurabi, che un re elamita aveva portato via dalla Babilonia. Un santuario accanto al tell è venerato come la tomba di Daniele."
  cs:
    - "Susy jsou pahorek Šúš v Chúzistánu v jihozápadním Íránu, na rovině pod pohořím Zagros; bod na mapě stojí na něm. Ležely vzdušnou čarou asi 360 km východně od Babylónu a asi 1 230 km od Jeruzaléma a dlouho byly jedním z hlavních měst Élamu, než z nich Peršané udělali jedno ze svých královských měst."
    - "Odehrávají se tam tři biblické knihy. Daniel vidí své vidění berana a kozla „v Susan, na hradě, kterýž jest v krajině Elam… u potoka Ulai“; Nehemjáš je číšníkem, „když jsem byl na hradě Susan“, když k němu ve dvacátém roce Artaxerxa, roku 445 př. n. l., dojde zpráva z Jeruzaléma; a celá kniha Ester se odehrává v paláci a městě Susách za vlády Achašveroše, jímž je Xerxes (486–465 př. n. l.): „Král pak a Aman seděli, kvasíce, ale měšťané Susan zkormouceni byli.“ Dareios I. dal palác vystavět koncem 6. století; jeho zakládací nápis uvádí cedr z Libanonu, zlato z Lýdie a Baktrie, lazurit ze Sogdiany a slonovinu z Kuše, Indie a Arachósie, shromážděné řemeslníky ze všech částí říše."
    - "Hérodotos popisuje Královskou cestu ze Sard do Sus, 111 stanic a asi devadesát dní pěšky, vzdušnou čarou téměř 2 000 km; královští poslové po ní jezdili ve štafetách, jako poslové Achašverošovi, kteří „vyjeli… stěží s poručením královským“. Francouzští vykopávači Susy zkoumali od roku 1884: palác Dareiův s lučištníky z glazovaných cihel, nyní v Louvru, a roku 1901 stélu Chammurapiho zákonů, kterou elamský král odvezl z Babylonie. Svatyně vedle pahorku je uctívána jako hrob Danielův."
  nl:
    - "Susa is de heuvel Shush in Chuzestan, in het zuidwesten van Iran, op de vlakte onder het Zagrosgebergte; het punt op de kaart staat erop. Het lag hemelsbreed ongeveer 360 km ten oosten van Babylon en ongeveer 1230 km van Jeruzalem, en het was lang een hoofdstad van Elam geweest voordat de Perzen er een van hun koninklijke steden van maakten."
    - "Drie bijbelboeken spelen er. Daniël ziet zijn visioen van de ram en de bok toen hij “in den burg Susan was, welke in het landschap Elam is… aan den vloed Ulai was”; Nehemia is schenker “te Susan in het paleis” wanneer het nieuws uit Jeruzalem hem bereikt in het twintigste jaar van Artaxerxes, 445 v.Chr.; en het hele boek Ester speelt zich af in het paleis en de stad Susa onder de regering van Ahasveros, die Xerxes is (486–465 v.Chr.): “de koning en Haman zaten en dronken, doch de stad Susan was verward.” Darius I had het paleis aan het eind van de zesde eeuw gebouwd; zijn stichtingsinscriptie noemt cederhout uit Libanon, goud uit Lydië en Bactrië, lapis lazuli uit Sogdiana en ivoor uit Kush, Indië en Arachosië, bijeengebracht door ambachtslieden uit elk deel van het rijk."
    - "Herodotus beschrijft de Koninklijke Weg van Sardes naar Susa, 111 stations en ongeveer negentig dagen te voet, bijna 2000 km hemelsbreed; de koeriers van de koning reden hem in estafette, zoals de lopers van Ahasveros “gingen uit, voortgedrongen zijnde door het woord des konings”. Franse opgravers groeven Susa vanaf 1884 op: het paleis van Darius met zijn boogschutters van geglazuurde tegels, nu in het Louvre, en in 1901 de stèle met de wetten van Hammoerabi, die een Elamitische koning uit Babylonië had weggevoerd. Een heiligdom naast de heuvel wordt vereerd als het graf van Daniël."
  sv:
    - "Susa är kullen Shush i Khuzestan, i sydvästra Iran, på slätten nedanför Zagrosbergen; kartpunkten står på den. Den låg omkring 360 km öster om Babylon i fågelvägen och omkring 1 230 km från Jerusalem, och den hade länge varit en huvudstad i Elam innan perserna gjorde den till en av sina kungastäder."
    - "Tre böcker i Bibeln utspelar sig där. Daniel ser sin syn om väduren och bocken ”i Susans borg i hövdingdömet Elam … vid floden Ulai”; Nehemja är munskänk ”i det tjugonde året, när jag var i Susans borg” då beskedet från Jerusalem når honom under Artaxerxes’ tjugonde år, 445 f.Kr.; och hela Esters bok utspelar sig i palatset och staden Susa under Ahasveros regering, som är Xerxes (486–465 f.Kr.): ”konungen och Haman satte sig ned till att dricka, under det att bestörtning rådde i staden Susan.” Dareios I hade byggt palatset i slutet av 500-talet f.Kr.; hans grundinskription räknar upp cederträ från Libanon, guld från Lydien och Baktrien, lapis lazuli från Sogdiana och elfenben från Kush, Indien och Arakosien, hopförda av hantverkare från alla delar av riket."
    - "Herodotos beskriver Kungsvägen från Sardes till Susa, 111 stationer och omkring nittio dagar till fots, nästan 2 000 km i fågelvägen; kungens kurirer red den i stafett, liksom Ahasveros’ ilbud som ”på grund av konungens befallning drogo ilbuden med hast åstad”. Franska utgrävare grävde Susa från 1884 och framåt: Dareios’ palats med dess bågskyttar av glaserat tegel, nu i Louvren, och 1901 stelen med Hammurabis lagar, som en elamitisk kung hade fört bort från Babylonien. En helgedom intill kullen vördas som Daniels grav."
  nb:
    - "Susa er haugen Shush i Khuzestan, i Sørvest-Iran, på sletten under Zagros-fjellene; kartpunktet står på den. Den lå omtrent 360 km øst for Babylon i luftlinje og omtrent 1230 km fra Jerusalem, og den hadde lenge vært en hovedby i Elam før perserne gjorde den til en av sine kongebyer."
    - "Tre av Bibelens bøker er satt der. Daniel ser sitt syn av væren og bukken «i borgen Susan i landskapet Elam, … ved elven Ulai»; Nehemja er munnskjenk «i borgen Susan» da nyheten fra Jerusalem når ham i Artaxerxes’ tyvende år, 445 f.Kr.; og hele Esters bok utspiller seg i palasset og byen Susa i Ahasverus’ regjeringstid, som er Xerxes (486–465 f.Kr.): «Så satte kongen og Haman sig til å drikke, men byen Susan var forferdet.» Dareios I hadde bygget palasset mot slutten av 500-tallet; hans grunnleggingsinnskrift oppregner sedertre fra Libanon, gull fra Lydia og Baktria, lapis lazuli fra Sogdiana og elfenben fra Kush, India og Arakosia, brakt sammen av håndverkere fra alle deler av riket."
    - "Herodot beskriver Kongeveien fra Sardes til Susa, 111 stasjoner og omtrent nitti dager på fot, nesten 2000 km i luftlinje; kongens kurerer red den i stafett, slik Ahasverus’ ilbud, heter det, «drog … avsted i største hast». Franske utgravere gravde ut Susa fra 1884: Dareios’ palass med de glaserte teglstein-bueskyttere, nå i Louvre, og i 1901 stelen med Hammurabis lover, som en elamittisk konge hadde ført bort fra Babylonia. En helligdom ved haugen æres som Daniels grav."
