id: where-was-kadesh-barnea
question:
  en: "Where was Kadesh-barnea?"
  ru: "Где находился Кадес-Варни?"
  uk: "Де був Кадес-Барнеа?"
  es: "¿Dónde estaba Cades-barnea?"
  pt: "Onde ficava Cades-Barneia?"
  de: "Wo lag Kadesch-Barnea?"
  fr: "Où se trouvait Kadès-Barnéa ?"
  pl: "Gdzie leżało Kadesz-Barnea?"
  it: "Dov’era Kades-Barnea?"
  cs: "Kde ležela Kádeš-barnea?"
  nl: "Waar lag Kades-Barnea?"
  sv: "Var låg Kadesh-Barnea?"
  nb: "Hvor lå Kadesj-Barnea?"
  tl: "Nasaan ang Cades-barnea?"
  da: "Hvor lå Kadesj-Barnea?"
  sr: "Где је био Кадис-Варнија?"
  hu: "Hol volt Kádes-Barnea?"
  fi: "Missä Kades-Barnea sijaitsi?"
  vi: "Ca-đe-Ba-nê-a ở đâu?"
  ro: "Unde se afla Cades-Barnea?"
  bg: "Къде се е намирал Кадес-Варни?"
answer:
  en:
    - "Kadesh-barnea was an oasis on the southern edge of Canaan, where the Negev meets the desert of north-eastern Sinai. Most scholars place it at Ain el-Qudeirat, the richest spring of the region, and the mound beside it, Tell el-Qudeirat, in today's Egypt close to the border with Israel; the map point stands there, about 77 km south-west of Beersheba, 115 km from Hebron and 145 km from Jerusalem in a straight line. That fits the Bible's own description: the messengers to Edom say “we are in Kadesh, a city in the uttermost of thy border”, and the southern border of the land runs “from the south to Kadesh-barnea”."
    - "The site is not certain. The old name survives at Ain Qedeis, a smaller spring a few kilometres to the south-east, which nineteenth-century travellers such as H. C. Trumbull took for Kadesh; Qudeirat, with more water and a fort, won most scholars in the twentieth century after Woolley and Lawrence surveyed the area in 1914. Many now think “Kadesh” covered the whole group of springs. Ancient writers looked further east: Josephus buries Miriam on a mountain before Israel reaches Petra, and Eusebius set Kadesh in the desert that reaches to Petra. The text joins it to two wildernesses, Paran when the spies return and Zin when Miriam dies, and Genesis calls it “En-mishpat, which is Kadesh”. Deuteronomy gives the distance from Sinai as “eleven days' journey from Horeb by the way of mount Seir unto Kadesh-barnea”."
    - "From Kadesh Moses sent the spies, and here Israel refused to go up, so that the people stayed “in Kadesh many days”; Deuteronomy counts thirty-eight years from Kadesh-barnea to the brook Zered. Miriam died and was buried here, and the waters of Meribah flowed here. At Tell el-Qudeirat the excavators found Iron Age forts of about the tenth to the early sixth century BC, but nothing from the fifteenth or the thirteenth century BC, the dates held for the wilderness years. Some take this against the identification or the story; others answer that a camp in the desert leaves no ruins. The site has its own article on History Globe; this answer keeps to where it was."
  ru:
    - "Кадес-Варни — оазис на южном краю Ханаана, там, где Негев переходит в пустыню северо-восточного Синая. Большинство учёных помещают его у Айн-эль-Кудейрата, самого обильного источника этих мест, и холма рядом с ним, Телль-эль-Кудейрата, на территории нынешнего Египта у самой границы с Израилем; там и стоит точка карты, примерно в 77 км к юго-западу от Вирсавии, в 115 км от Хеврона и в 145 км от Иерусалима по прямой. Это согласуется с описанием самой Библии: послы к Едому говорят: «вот, мы в Кадесе, городе у самого предела твоего», а южная граница земли идёт так, что «будут выступы ее на юг к Кадес-Варни»."
    - "Отождествление не бесспорно. Древнее имя сохранилось у Айн-Кдейса, источника поменьше в нескольких километрах к юго-востоку, который путешественники XIX века, как Г. К. Трамбулл, принимали за Кадес; Кудейрат, где больше воды и есть крепость, убедил большинство учёных в XX веке, после того как в 1914 г. эти места обследовали Вулли и Лоуренс. Многие теперь думают, что Кадесом называлась вся группа источников. Древние авторы искали восточнее: у Иосифа Флавия Мариам погребена на горе, прежде чем Израиль подходит к Петре, а Евсевий помещал Кадес в пустыне, простирающейся до Петры. Текст связывает его с двумя пустынями — Фаран, когда возвращаются соглядатаи, и Син, когда умирает Мариам, — а в Бытии цари приходят «к источнику Мишпат, который есть Кадес». Второзаконие указывает расстояние от Синая: «одиннадцати дней пути от Хорива, по дороге от горы Сеир к Кадес-Варни»."
    - "Из Кадеса Моисей посылал соглядатаев, и здесь Израиль отказался идти в землю, так что народ пробыл «в Кадесе много времени»; Второзаконие насчитывает тридцать восемь лет от Кадес-Варни до долины Заред. Здесь умерла и погребена Мариам, здесь текли воды Меривы. На Телль-эль-Кудейрате раскопки нашли крепости железного века, примерно с X до начала VI века до н. э., но ничего от XV или XIII века до н. э., к которым относят странствие в пустыне. Одни видят в этом довод против отождествления или против рассказа, другие отвечают, что стан в пустыне не оставляет развалин. Этому месту в History Globe посвящена отдельная статья; здесь ответ только о том, где оно было."
  uk:
    - "Кадес-Барнеа був оазою на південному краю Ханаану, де Негев сходиться з пустелею північного сходу Синаю. Більшість учених розміщують його в Айн-ель-Кудейраті, найбагатшому джерелі краю, і на пагорбі поруч, Телль-ель-Кудейраті, у нинішньому Єгипті поблизу кордону з Ізраїлем; точка на мапі стоїть там, приблизно за 77 км на південний захід від Беер-Шеви, за 115 км від Хеврона і за 145 км від Єрусалима по прямій. Це відповідає й власному опису Біблії: посланці до Едому кажуть: «се ми в Кадесї містї, що на краю займища твого», а південна межа краю йде «на полуднє до Кадес-Барне»."
    - "Місце не є певним. Стара назва збереглася в Айн-Кедейсі, меншому джерелі за кілька кілометрів на південний схід, який мандрівники XIX ст., як-от Г. К. Трамбулл, вважали Кадесом; Кудейрат, де більше води й є фортеця, переконав більшість учених у XX ст., після того як Вуллі та Лоуренс обстежили край 1914 р. Багато хто нині вважає, що «Кадес» охоплював цілу групу джерел. Давні автори шукали далі на схід: Йосиф Флавій ховає Міріам на горі перед тим, як Ізраїль досягає Петри, а Євсевій розмістив Кадес у пустелі, що сягає Петри. Текст пов'язує його з двома пустелями — Фараном, коли розвідники повертаються, і Сіном, коли помирає Міріам, а Книга Буття називає його «Ен-Мишпата, се Кадес». Книга Повторення Закону дає відстань від Синаю: «Одинайцять день ходи від Гореба, по дорозї від Сеїр-гори до Кадес-Барнеї»."
    - "З Кадесу Мойсей послав розвідників, і тут Ізраїль відмовився йти вгору, так що народ перебував «в Кадесї довго»; Повторення Закону лічить тридцять вісім років від Кадес-Барнеа до потоку Заред. Тут померла й була похована Міріам, і тут потекли води Мериви. У Телль-ель-Кудейраті розкопники знайшли фортеці залізного віку приблизно від X до початку VI ст. до н. е., але нічого з XV чи XIII ст. до н. е., тобто дат, які вважають роками пустелі. Дехто бачить у цьому доказ проти ототожнення або проти оповіді; інші відповідають, що табір у пустелі не залишає руїн. Це місце має власну статтю в «Історичному глобусі»; ця відповідь стосується лише того, де воно було."
  es:
    - "Cades-barnea era un oasis en el borde meridional de Canaán, donde el Négueb se encuentra con el desierto del noreste del Sinaí. La mayoría de los estudiosos la sitúan en Ain el-Qudeirat, el manantial más rico de la región, y en el montículo junto a él, Tell el-Qudeirat, en el actual Egipto, cerca de la frontera con Israel; el punto del mapa está allí, a unos 77 km al suroeste de Beerseba, a 115 km de Hebrón y a 145 km de Jerusalén en línea recta. Eso concuerda con la propia descripción de la Biblia: los mensajeros enviados a Edom dicen «estamos en Cades, ciudad al extremo de tus confines», y la frontera meridional de la tierra va «del mediodía á Cades-barnea»."
    - "El sitio no es seguro. El antiguo nombre sobrevive en Ain Qedeis, un manantial menor a unos pocos kilómetros al sureste, que viajeros del siglo XIX como H. C. Trumbull tomaron por Cades; Qudeirat, con más agua y una fortaleza, ganó a la mayoría de los estudiosos en el siglo XX después de que Woolley y Lawrence reconocieran la zona en 1914. Muchos piensan ahora que «Cades» abarcaba todo el grupo de manantiales. Los autores antiguos miraron más al este: Josefo sepulta a Miriam en un monte antes de que Israel llegue a Petra, y Eusebio situó Cades en el desierto que llega hasta Petra. El texto la une a dos desiertos, el de Parán cuando vuelven los espías y el de Zin cuando muere Miriam, y el Génesis la llama «Emmisphat, que es Cades». El Deuteronomio da la distancia desde el Sinaí: «Once jornadas hay desde Horeb, camino del monte de Seir, hasta Cades-barnea»."
    - "Desde Cades envió Moisés a los espías, y aquí se negó Israel a subir, de modo que el pueblo estuvo «en Cades por muchos días»; el Deuteronomio cuenta treinta y ocho años desde Cades-barnea hasta el arroyo de Zered. Aquí murió y fue sepultada Miriam, y aquí fluyeron las aguas de Meriba. En Tell el-Qudeirat los excavadores hallaron fortalezas de la Edad del Hierro desde el siglo X hasta principios del VI a. C., pero nada del siglo XV ni del XIII a. C., las fechas que se atribuyen a los años del desierto. Unos lo toman como argumento contra la identificación o contra el relato; otros responden que un campamento en el desierto no deja ruinas. El sitio tiene su propio artículo en History Globe; esta respuesta se ciñe a dónde estaba."
  pt:
    - "Cades-Barneia era um oásis na borda meridional de Canaã, onde o Neguebe encontra o deserto do nordeste do Sinai. A maioria dos estudiosos a situa em Ain el-Qudeirat, a fonte mais rica da região, e no monte ao lado dela, Tell el-Qudeirat, no atual Egito, perto da fronteira com Israel; o ponto do mapa fica ali, a cerca de 77 km a sudoeste de Berseba, 115 km de Hebrom e 145 km de Jerusalém em linha reta. Isso concorda com a própria descrição da Bíblia: os mensageiros a Edom dizem “estamos em Cades, uma cidade na extremidade da sua fronteira”, e a fronteira meridional da terra “passará ao sul de Cades-Barneia”."
    - "O sítio não é certo. O antigo nome sobrevive em Ain Qedeis, uma fonte menor a alguns quilômetros a sudeste, que viajantes do século XIX, como H. C. Trumbull, tomaram por Cades; Qudeirat, com mais água e uma fortaleza, conquistou a maioria dos estudiosos no século XX, depois que Woolley e Lawrence fizeram o levantamento da área em 1914. Muitos pensam hoje que “Cades” abrangia todo o grupo de fontes. Escritores antigos olhavam mais para o leste: Josefo sepulta Miriã num monte antes de Israel chegar a Petra, e Eusébio situou Cades no deserto que chega até Petra. O texto a liga a dois desertos, Parã quando os espias voltam e Zim quando Miriã morre, e o Gênesis chama-a “En-Mispate (também chamada Cades)”. O Deuteronômio dá a distância desde o Sinai: “São onze dias de jornada desde Horebe, pelo caminho do monte Seir, até Cades-Barneia.”"
    - "De Cades Moisés enviou os espias, e aqui Israel recusou-se a subir, de modo que o povo permaneceu “em Cades por muitos dias”; o Deuteronômio conta trinta e oito anos de Cades-Barneia até o ribeiro de Zerede. Miriã morreu e foi sepultada aqui, e aqui correram as águas de Meribá. Em Tell el-Qudeirat os escavadores encontraram fortalezas da Idade do Ferro, de cerca do século X ao início do século VI a.C., mas nada do século XV ou do século XIII a.C., as datas tidas para os anos no deserto. Alguns tomam isso como argumento contra a identificação ou contra a narrativa; outros respondem que um acampamento no deserto não deixa ruínas. O sítio tem um artigo próprio no History Globe; esta resposta trata apenas de onde ficava."
  de:
    - "Kadesch-Barnea war eine Oase am Südrand Kanaans, wo der Negev auf die Wüste im Nordosten des Sinai trifft. Die meisten Gelehrten setzen es bei Ain el-Qudeirat an, der ergiebigsten Quelle der Gegend, und dem Hügel daneben, Tell el-Qudeirat, im heutigen Ägypten nahe der Grenze zu Israel; dort steht der Kartenpunkt, in der Luftlinie etwa 77 km südwestlich von Beerscheba, 115 km von Hebron und 145 km von Jerusalem. Das passt zur Beschreibung der Bibel selbst: Die Boten an Edom sagen: „wir sind zu Kades, in der Stadt an deinen Grenzen“, und die Südgrenze des Landes verläuft „mittagwärts von Kades-Barnea“."
    - "Die Lage ist nicht sicher. Der alte Name hat sich bei Ain Qedeis erhalten, einer kleineren Quelle einige Kilometer südöstlich, die Reisende des 19. Jahrhunderts wie H. C. Trumbull für Kadesch hielten; Qudeirat mit mehr Wasser und einer Festung gewann im 20. Jahrhundert die meisten Gelehrten, nach der Vermessung durch Woolley und Lawrence 1914. Viele denken heute, „Kadesch“ habe die ganze Quellgruppe umfasst. Antike Autoren suchten weiter östlich: Josephus begräbt Mirjam auf einem Berg, ehe Israel Petra erreicht, und Eusebius setzte Kadesch in die Wüste, die bis Petra reicht. Der Text verbindet es mit zwei Wüsten, Paran bei der Rückkehr der Kundschafter und Zin bei Mirjams Tod, und die Genesis nennt es „Born Mispat, das ist Kades“. Die Entfernung vom Sinai nennt das Deuteronomium: „Elf Tagereisen von Horeb, durch den Weg des Gebirges Seir, bis gen Kades-Barnea.“"
    - "Von Kadesch sandte Mose die Kundschafter, und hier weigerte sich Israel hinaufzuziehen, sodass das Volk „in Kades eine lange Zeit“ blieb; das Deuteronomium zählt von Kadesch-Barnea bis zum Bach Sered achtunddreißig Jahre. Mirjam starb und wurde hier begraben, und hier flossen die Wasser von Meriba. In Tell el-Qudeirat fanden die Ausgräber eisenzeitliche Festungen etwa vom 10. bis zum frühen 6. Jahrhundert v. Chr., aber nichts aus dem 15. oder dem 13. Jahrhundert v. Chr., den für die Wüstenjahre angenommenen Zeiten. Manche werten das gegen die Gleichsetzung oder gegen die Erzählung; andere erwidern, ein Lager in der Wüste hinterlasse keine Ruinen. Der Ort hat bei History Globe einen eigenen Artikel; diese Antwort beschränkt sich auf seine Lage."
  fr:
    - "Kadès-Barnéa était une oasis au bord méridional de Canaan, là où le Négev rejoint le désert du nord-est du Sinaï. La plupart des spécialistes la placent à Aïn el-Qudeirat, la source la plus abondante de la région, et sur le tertre voisin, Tell el-Qudeirat, dans l’Égypte actuelle, près de la frontière avec Israël ; le point de la carte s’y trouve, à environ 77 km au sud-ouest de Beer-Schéba, à 115 km d’Hébron et à 145 km de Jérusalem à vol d’oiseau. Cela s’accorde avec la description de la Bible elle-même : les messagers envoyés à Édom disent « nous sommes à Kadès, ville à l’extrémité de ton territoire », et la frontière méridionale du pays « s’étendra jusqu’au midi de Kadès-Barnéa »."
    - "Le site n’est pas certain. L’ancien nom subsiste à Aïn Qedeis, source plus petite à quelques kilomètres au sud-est, que des voyageurs du XIXe siècle comme H. C. Trumbull prirent pour Kadès ; Qudeirat, plus riche en eau et dotée d’un fort, a conquis la plupart des spécialistes au XXe siècle, après les relevés de Woolley et Lawrence en 1914. Beaucoup pensent que « Kadès » recouvrait l’ensemble des sources. Les auteurs anciens regardaient plus à l’est : Flavius Josèphe enterre Miriam sur une montagne avant que l’on atteigne Pétra, et Eusèbe plaçait Kadès dans le désert qui va à Pétra. Le texte la lie à deux déserts, Paran au retour des espions et Tsin à la mort de Miriam, et la Genèse cite « En-Mischpath, qui est Kadès ». Le Deutéronome donne la distance depuis le Sinaï : « Il y a onze journées depuis Horeb, par le chemin de la montagne de Séir, jusqu’à Kadès-Barnéa. »"
    - "De Kadès, Moïse envoya les espions, et c’est là qu’Israël refusa de monter, si bien que le Deutéronome rappelle au peuple : « Vous restâtes à Kadès, où le temps que vous y avez passé fut de longue durée » ; le Deutéronome compte trente-huit ans de Kadès-Barnéa au torrent de Zéred. Miriam y mourut et y fut enterrée, et les eaux de Meriba y jaillirent. À Tell el-Qudeirat, les fouilleurs ont trouvé des forts de l’âge du Fer, d’environ le Xe au début du VIe siècle av. J.-C., mais rien des XVe ou XIIIe siècles av. J.-C., les dates retenues pour les années au désert. Certains y voient un argument contre l’identification ou contre le récit ; d’autres répondent qu’un campement dans le désert ne laisse pas de ruines. Le site a son propre article sur History Globe ; cette réponse se limite à son emplacement."
  pl:
    - "Kadesz-Barnea było oazą na południowym skraju Kanaanu, gdzie Negew styka się z pustynią północno-wschodniego Synaju. Większość uczonych umieszcza je w Ain el-Qudeirat, najobfitszym źródle regionu, i na sąsiednim wzgórzu Tell el-Qudeirat, w dzisiejszym Egipcie tuż przy granicy z Izraelem; tam stoi punkt na mapie, około 77 km na południowy zachód od Beer-Szeby, 115 km od Hebronu i 145 km od Jerozolimy w linii prostej. Zgadza się to z opisem samej Biblii: posłańcy do Edomu mówią: „otośmy już w Kades, mieście przy granicy twojej”, a południowa granica kraju biegnie „od południa do Kades Barne”."
    - "Miejsce nie jest pewne. Dawna nazwa przetrwała w Ain Qedeis, mniejszym źródle kilka kilometrów na południowy wschód, które podróżnicy XIX wieku, jak H. C. Trumbull, uznawali za Kadesz; Qudeirat, z większą ilością wody i fortem, zdobyło większość uczonych w XX wieku po badaniach terenowych Woolleya i Lawrence'a w 1914 roku. Wielu uważa teraz, że „Kadesz” obejmowało całą grupę źródeł. Pisarze starożytni szukali dalej na wschód: Józef Flawiusz grzebie Miriam na górze, zanim Izrael dotrze do Petry, a Euzebiusz umieścił Kadesz na pustyni sięgającej Petry. Tekst łączy je z dwiema pustyniami, Paran, gdy wracają zwiadowcy, i Sin, gdy umiera Miriam, a Księga Rodzaju nazywa je „En Myspat, która jest Kades”. Księga Powtórzonego Prawa podaje odległość od Synaju: „jedenaście dni drogi od Horebu przez górę Seir aż do Kades Barne”."
    - "Z Kadesz Mojżesz wysłał zwiadowców i tu Izrael odmówił wejścia, tak że lud pozostał „w Kades przez wiele dni”; Księga Powtórzonego Prawa liczy trzydzieści osiem lat od Kadesz-Barnea do potoku Zared. Tu umarła i została pochowana Miriam, i tu popłynęły wody Meriby. W Tell el-Qudeirat archeolodzy znaleźli forty z epoki żelaza z około X do początku VI wieku p.n.e., ale nic z XV ani XIII wieku p.n.e., dat uznawanych dla lat na pustyni. Niektórzy przeciwstawiają to utożsamieniu lub opowieści; inni odpowiadają, że obóz na pustyni nie zostawia ruin. Miejsce ma własny artykuł w History Globe; ta odpowiedź ogranicza się do jego położenia."
  it:
    - "Kades-Barnea era un’oasi al margine meridionale di Canaan, dove il Negheb incontra il deserto del Sinai nord-orientale. La maggior parte degli studiosi la colloca ad Ain el-Qudeirat, la più ricca sorgente della regione, e sul tell accanto ad essa, Tell el-Qudeirat, nell’odierno Egitto vicino al confine con Israele; il punto della mappa si trova lì, a circa 77 km a sud-ovest di Bersabea, a 115 km da Ebron e a 145 km da Gerusalemme in linea d’aria. Ciò si accorda con la descrizione della stessa Bibbia: i messaggeri a Edom dicono «ed eccoci ora in Kades, che è città agli estremi tuoi confini», e il confine meridionale del paese «si estenderà a mezzogiorno di Kades-Barnea»."
    - "Il sito non è certo. L’antico nome sopravvive ad Ain Qedeis, una sorgente più piccola a qualche chilometro a sud-est, che viaggiatori dell’Ottocento come H. C. Trumbull ritennero Kades; Qudeirat, con più acqua e una fortezza, conquistò la maggior parte degli studiosi nel Novecento dopo che Woolley e Lawrence esplorarono la zona nel 1914. Molti ritengono ora che «Kades» comprendesse l’intero gruppo di sorgenti. Gli autori antichi guardavano più a est: Giuseppe Flavio seppellisce Maria su un monte prima che Israele raggiunga Petra, ed Eusebio collocò Kades nel deserto che arriva fino a Petra. Il testo la collega a due deserti: Paran quando tornano gli esploratori, Zin quando muore Maria, e la Genesi la chiama «En-Mishpat, che è Kades». Il Deuteronomio dà la distanza dal Sinai: «undici giornate dallo Horeb, per la via del monte Seir, fino a Kades-Barnea»."
    - "Da Kades Mosè mandò gli esploratori, e qui Israele rifiutò di salire, così che il popolo rimase «in Kades molti giorni»; il Deuteronomio conta trentotto anni da Kades-Barnea al torrente Zered. Qui Maria morì e fu sepolta, e qui scorsero le acque di Meriba. A Tell el-Qudeirat gli archeologi trovarono fortezze dell’età del Ferro dal X all’inizio del VI secolo a.C. circa, ma nulla del XV o del XIII secolo a.C., le date ritenute per gli anni nel deserto. Alcuni ne traggono un argomento contro l’identificazione o contro il racconto; altri rispondono che un accampamento nel deserto non lascia rovine. Il sito ha un suo articolo su History Globe; questa risposta si limita a dove si trovava."
  cs:
    - "Kádeš-barnea byla oáza na jižním okraji Kanaánu, kde Negev přechází v poušť severovýchodního Sinaje. Většina badatelů ji klade do Ain el-Qudeirat, nejbohatšího pramene oblasti, a na pahorek vedle něj, Tell el-Qudeirat, v dnešním Egyptě blízko hranice s Izraelem; bod na mapě stojí tam, vzdušnou čarou asi 77 km jihozápadně od Beer-šeby, 115 km od Hebronu a 145 km od Jeruzaléma. To odpovídá vlastnímu biblickému popisu: poslové k Edómu říkají „již jsme v Kádes městě, při pomezí tvém“ a jižní hranice země vede „od poledne přes Kádesbarne“."
    - "Místo není jisté. Staré jméno se zachovalo v Ain Qedeis, menším prameni několik kilometrů na jihovýchod, který cestovatelé 19. století jako H. C. Trumbull pokládali za Kádeš; Qudeirat, s více vodou a pevností, získalo většinu badatelů ve 20. století poté, co oblast roku 1914 zmapovali Woolley a Lawrence. Mnozí dnes soudí, že „Kádeš“ zahrnoval celou skupinu pramenů. Starověcí pisatelé hledali dál na východ: Josephus pohřbívá Mirjam na hoře dříve, než Izrael dorazí do Petry, a Eusebios kladl Kádeš do pouště sahající k Petře. Text jej spojuje se dvěma pouštěmi, Páranem, když se vracejí zvědové, a Sínem, když Mirjam umírá, a Genesis ho nazývá „En Misfat, kteráž již jest Kádes“. Deuteronomium udává vzdálenost od Sinaje: „Jedenácte dní cesty jest od Oréb přes hory Seir až do Kádesbarne.“"
    - "Z Kádeše poslal Mojžíš zvědy a zde Izrael odmítl vytáhnout, takže lid zůstal „v Kádes za mnohé dny“; Deuteronomium počítá třicet osm let od Kádeš-barnea k potoku Zered. Zde zemřela a byla pohřbena Mirjam a zde vytryskly vody Meriby. V Tell el-Qudeirat vykopávači nalezli pevnosti z doby železné zhruba z 10. až počátku 6. století př. n. l., ale nic z 15. nebo 13. století př. n. l., dat držených pro léta na poušti. Někteří to berou jako argument proti ztotožnění nebo proti příběhu; jiní odpovídají, že tábor na poušti žádné zříceniny nezanechává. Místo má na History Globe vlastní článek; tato odpověď se drží jen toho, kde leželo."
  nl:
    - "Kades-Barnea was een oase aan de zuidrand van Kanaän, waar de Negev overgaat in de woestijn van het noordoosten van de Sinaï. De meeste geleerden plaatsen het bij Ain el-Qudeirat, de rijkste bron van de streek, en de heuvel ernaast, Tell el-Qudeirat, in het huidige Egypte dicht bij de grens met Israël; daar staat het punt op de kaart, hemelsbreed ongeveer 77 km ten zuidwesten van Berseba, 115 km van Hebron en 145 km van Jeruzalem. Dat past bij de beschrijving van de Bijbel zelf: de boden aan Edom zeggen “wij zijn te Kades, een stad aan het uiterste uwer landpale”, en de zuidgrens van het land loopt “van het zuiden naar Kades-Barnea”."
    - "De plaats is niet zeker. De oude naam leeft voort bij Ain Qedeis, een kleinere bron enkele kilometers ten zuidoosten, die negentiende-eeuwse reizigers als H. C. Trumbull voor Kades hielden; Qudeirat, met meer water en een fort, overtuigde in de twintigste eeuw de meeste geleerden, nadat Woolley en Lawrence het gebied in 1914 hadden onderzocht. Velen menen nu dat “Kades” de hele groep bronnen omvatte. Oude schrijvers zochten verder oostelijk: Josephus begraaft Mirjam op een berg voordat Israël Petra bereikt, en Eusebius plaatste Kades in de woestijn die tot Petra reikt. De tekst verbindt het met twee woestijnen, Paran wanneer de verspieders terugkeren en Zin wanneer Mirjam sterft, en Genesis noemt het “En-Mispat, dat is Kades”. Deuteronomium geeft de afstand van de Sinaï: “Elf dag reizen zijn het van Horeb, door den weg van het gebergte Seïr, tot aan Kades-Barnea”."
    - "Vanuit Kades zond Mozes de verspieders, en hier weigerde Israël op te trekken, zodat het volk “in Kades vele dagen” bleef; Deuteronomium telt achtendertig jaar van Kades-Barnea tot de beek Zered. Mirjam stierf hier en werd hier begraven, en hier stroomden de wateren van Meriba. Bij Tell el-Qudeirat vonden de opgravers vestingen uit de ijzertijd van ongeveer de tiende tot het begin van de zesde eeuw v.Chr., maar niets uit de vijftiende of de dertiende eeuw v.Chr., de data die voor de woestijnjaren worden aangehouden. Sommigen zien dit als argument tegen de identificatie of tegen het verhaal; anderen antwoorden dat een kamp in de woestijn geen ruïnes achterlaat. De plaats heeft op History Globe een eigen artikel; dit antwoord beperkt zich tot de ligging."
  sv:
    - "Kadesh-Barnea var en oas i södra utkanten av Kanaan, där Negev möter öknen i nordöstra Sinai. De flesta forskare förlägger den till Ain el-Qudeirat, regionens rikaste källa, och kullen intill den, Tell el-Qudeirat, i dagens Egypten nära gränsen mot Israel; kartpunkten står där, omkring 77 km sydväst om Beer Sheva, 115 km från Hebron och 145 km från Jerusalem i fågelvägen. Det stämmer med Bibelns egen beskrivning: sändebuden till Edom säger ”vi äro nu i Kades, staden som ligger vid gränsen till ditt område”, och landets södra gräns skall ”gå ut söder om Kades-Barnea”."
    - "Platsen är inte säker. Det gamla namnet lever kvar vid Ain Qedeis, en mindre källa några kilometer åt sydost, som 1800-talets resenärer som H. C. Trumbull tog för Kadesh; Qudeirat, med mer vatten och en fästning, vann de flesta forskare på 1900-talet sedan Woolley och Lawrence kartlagt området 1914. Många menar nu att ”Kadesh” omfattade hela gruppen av källor. Antika författare sökte längre österut: Josefus begraver Mirjam på ett berg innan Israel når Petra, och Eusebios förlade Kadesh i öknen som sträcker sig till Petra. Texten förbinder den med två öknar, Paran när spejarna återvänder och Sin när Mirjam dör, och Första Moseboken kallar den ”En-Mispat, det är Kades”. Femte Moseboken anger avståndet från Sinai som ”elva dagsresor från Horeb, åt Seirs bergsbygd till, fram till Kades-Barnea”."
    - "Från Kadesh sände Mose ut spejarna, och här vägrade Israel att dra upp, så att det heter: ”I stannaden länge i Kades, så länge det nu var.” Femte Moseboken räknar trettioåtta år från Kadesh-Barnea till bäcken Sered. Mirjam dog och begrovs här, och Merivas vatten flödade här. Vid Tell el-Qudeirat fann utgrävarna fästningar från järnåldern från omkring 900-talet till början av 500-talet f.Kr., men inget från 1400- eller 1200-talet f.Kr., de tider som anses gälla ökenåren. Vissa tar detta som ett argument mot identifieringen eller berättelsen; andra svarar att ett läger i öknen inte lämnar några ruiner. Platsen har en egen artikel på History Globe; det här svaret håller sig till var den låg."
  nb:
    - "Kadesj-Barnea var en oase i den sørlige utkanten av Kanaan, der Negev møter ørkenen i nordøstlige Sinai. De fleste forskere plasserer den ved Ain el-Qudeirat, regionens rikeste kilde, og haugen ved siden av, Tell el-Qudeirat, i dagens Egypt nær grensen til Israel; kartpunktet står der, omtrent 77 km sørvest for Beer-Sjeba, 115 km fra Hebron og 145 km fra Jerusalem i luftlinje. Det stemmer med Bibelens egen beskrivelse: budbringerne til Edom sier «Og nu er vi her i byen Kades like ved grensen av ditt land», og landets sørgrense går «ut i syd for Kades-Barnea»."
    - "Stedet er ikke sikkert. Det gamle navnet overlever ved Ain Qedeis, en mindre kilde noen kilometer mot sørøst, som reisende på 1800-tallet som H. C. Trumbull holdt for Kadesj; Qudeirat, med mer vann og en festning, vant de fleste forskere på 1900-tallet etter at Woolley og Lawrence kartla området i 1914. Mange mener nå at «Kadesj» dekket hele gruppen av kilder. Antikke forfattere så lenger østover: Josefus lar Mirjam bli gravlagt på et fjell før Israel når Petra, og Eusebius plasserte Kadesj i ørkenen som strekker seg til Petra. Teksten knytter den til to ørkener, Paran da speiderne vender tilbake og Sin da Mirjam dør, og Første Mosebok kaller den «En-Mispat, det er Kades». Femte Mosebok oppgir avstanden fra Sinai som «elleve dagsreiser fra Horeb efter den vei som fører til Se’ir-fjellene, til Kades-Barnea»."
    - "Fra Kadesj sendte Moses speiderne, og her nektet Israel å dra opp, slik at folket «måtte bli i Kades i lang tid»; Femte Mosebok regner åtte og tretti år fra Kadesj-Barnea til Sered-bekken. Mirjam døde og ble gravlagt her, og Meribas vann rant her. Ved Tell el-Qudeirat fant utgraverne festninger fra jernalderen fra omtrent 900-tallet til tidlig på 500-tallet f.Kr., men ingenting fra 1400- eller 1200-tallet f.Kr., tidene som regnes for ørkenårene. Noen tar dette som argument mot identifiseringen eller fortellingen; andre svarer at en leir i ørkenen ikke etterlater ruiner. Stedet har sin egen artikkel på History Globe; dette svaret holder seg til hvor det lå."
  tl:
    - "Ang Cades-barnea ay isang oasis sa katimugang gilid ng Canaan, kung saan nagtatagpo ang Negev at ang disyerto ng hilagang-silangang Sinai. Karamihan ng mga iskolar ay naglalagay nito sa Ain el-Qudeirat, ang pinakamayamang bukal ng rehiyon, at sa burol sa tabi nito, ang Tell el-Qudeirat, sa kasalukuyang Egipto malapit sa hangganan ng Israel; naroon ang punto sa mapa, mga 77 km sa timog-kanluran ng Beer-seba, 115 km mula sa Hebron at 145 km mula sa Jerusalem sa tuwid na guhit. Umaakma iyon sa sariling paglalarawan ng Biblia: sinasabi ng mga sugo sa Edom, “kami ay nasa Cades, na isang bayan na nasa dulo ng iyong hangganan”, at ang katimugang hangganan ng lupain ay lumalabas “sa dakong timugan ng Cades-barnea”."
    - "Hindi tiyak ang pook. Nasa Ain Qedeis ang lumang pangalan, mas maliit na bukal, ilang km sa timog-silangan, na inakalang Cades ng mga manlalakbay noong ika-19 na siglo, gaya ni H. C. Trumbull; ang Qudeirat, na may mas maraming tubig at kuta, ang pinili ng karamihan noong ika-20 siglo, nang suriin nina Woolley at Lawrence noong 1914. Para sa marami ngayon, buong pangkat ng mga bukal ang “Cades”. Sa silangan tumingin ang mga sinaunang manunulat: inilibing ni Josephus si Miriam sa isang bundok bago marating ng Israel ang Petra, at inilagay ni Eusebio ang Cades sa disyertong hanggang Petra. Iniuugnay ito ng teksto sa dalawang ilang, sa Paran nang bumalik ang mga tiktik at sa Zin nang mamatay si Miriam, at tinatawag ito ng Genesis na “Enmispat (na siyang Cades)”. Ayon sa Deuteronomio, mula sa Sinai: “Labing isang araw na lakbayin mula sa Horeb … hanggang sa Cades-barnea”."
    - "Mula sa Cades isinugo ni Moises ang mga tiktik, at dito tumangging umahon ang Israel, kaya sinabi sa bayan: “natira kayong malaon sa Cades”; ibinibilang ng Deuteronomio ang tatlumpu't walong taon mula sa Cades-barnea hanggang sa batis ng Zered. Dito namatay at inilibing si Miriam, at dito umagos ang tubig ng Meribah. Sa Tell el-Qudeirat ay nakatagpo ang mga naghukay ng mga kuta ng Panahong Bakal mula mga ika-10 hanggang unang bahagi ng ika-6 na siglo BK, ngunit wala mula sa ika-15 o ika-13 siglo BK, ang mga petsang itinuturing para sa mga taon sa ilang. Ginagamit ito ng ilan laban sa pagkakakilanlan o sa salaysay; sagot ng iba na ang kampo sa disyerto ay hindi nag-iiwan ng mga guho. May sariling artikulo ang pook sa History Globe; ang sagot na ito ay nakatuon sa kung nasaan ito."
  da:
    - "Kadesj-Barnea var en oase i den sydlige udkant af Kana’an, hvor Negev møder ørkenen i det nordøstlige Sinai. De fleste forskere placerer den ved Ain el-Qudeirat, egnens rigeste kilde, og højen ved siden af den, Tell el-Qudeirat, i nutidens Egypten tæt på grænsen til Israel; kortets punkt står der, ca. 77 km sydvest for Beersheba, 115 km fra Hebron og 145 km fra Jerusalem i fugleflugt. Det passer til Bibelens egen beskrivelse: Budene til Edom siger: »vi ere i Kades, Staden ved det yderste af dit Landemærke«, og landets sydgrænse løber »Sønden for Kades-Barnea«."
    - "Stedet er ikke sikkert. Det gamle navn lever videre ved Ain Qedeis, en mindre kilde nogle få kilometer mod sydøst, som rejsende i 1800-tallet som H. C. Trumbull tog for Kadesj; Qudeirat, med mere vand og et fort, vandt de fleste forskere i 1900-tallet, efter at Woolley og Lawrence opmålte området i 1914. Mange mener nu, at »Kadesj« dækkede hele gruppen af kilder. Antikke forfattere så længere mod øst: Josefus begraver Miriam på et bjerg, før Israel når Petra, og Eusebios placerede Kadesj i ørkenen, der strækker sig til Petra. Teksten forbinder stedet med to ørkener, Paran, da spionerne vender tilbage, og Zin, da Miriam dør, og Første Mosebog kalder det »den Kilde Mispat, det er Kades«. Femte Mosebog angiver afstanden fra Sinai som »elleve Dages Rejse fra Horeb til Seirs Bjerge, indtil Kades-Barnea«."
    - "Fra Kadesj sendte Moses spionerne, og her nægtede Israel at drage op, så folket blev »i Kades mange Dage«; Femte Mosebog regner otteogtredive år fra Kadesj-Barnea til Zered-bækken. Miriam døde og blev begravet her, og Meribas vande flød her. Ved Tell el-Qudeirat fandt udgraverne fæstninger fra jernalderen fra ca. 900-tallet til begyndelsen af 500-tallet f.Kr., men intet fra 1400-tallet eller 1200-tallet f.Kr., de datoer der regnes for årene i ørkenen. Nogle tager dette som argument imod identifikationen eller beretningen; andre svarer, at en lejr i ørkenen ikke efterlader ruiner. Stedet har sin egen artikel på History Globe; dette svar holder sig til, hvor det lå."
  sr:
    - "Кадис-Варнија била је оаза на јужном ободу Ханана, где се Негев среће са пустињом североисточног Синаја. Већина научника смешта је у Аин ел-Кудејрат, најбогатији извор тог краја, и хумку поред њега, Тел ел-Кудејрат, у данашњем Египту близу границе са Израелом; тачка на карти стоји ту, око 77 км југозападно од Вирсавеје, 115 км од Хеврона и 145 км од Јерусалима ваздушном линијом. То одговара самом библијском опису: гласници Едому кажу „ево смо у Кадису, граду на твојој међи“, а јужна међа земље иде „од југа преко Кадис-Варније“."
    - "Место није извесно. Старо име је сачувано у Аин Кедејсу, мањем извору неколико километара југоисточно, који су путници из деветнаестог века, као Х. К. Трамбул, сматрали Кадисом; Кудејрат, са више воде и тврђавом, придобио је већину научника у двадесетом веку пошто су Вули и Лоренс 1914. премерили област. Многи сада мисле да је „Кадис“ обухватао целу групу извора. Антички писци гледали су даље на исток: Јосиф Флавије сахрањује Марију на једној гори пре него што Израел стигне до Петре, а Јевсевије је Кадис сместио у пустињу која допире до Петре. Текст га везује за две пустиње, Фаран кад се уходе враћају и Син кад Марија умире, а Постање га зове „Ен-Миспат, који је сада Кадис“. Поновљени закон даје удаљеност од Синаја: „једанаест дана хода од Хорива преко горе Сира до Кадис-Варније“."
    - "Из Кадиса је Мојсије слао уходе, и овде је Израел одбио да изиђе, па је народ остао „у Кадису дуго времена“; Поновљени закон рачуна тридесет осам година од Кадис-Варније до потока Заред. Марија је овде умрла и била сахрањена, и овде су потекле воде Мериве. У Тел ел-Кудејрату ископавачи су нашли тврђаве из гвозденог доба од око десетог до почетка шестог века п. н. е., али ништа из петнаестог или тринаестог века п. н. е., година које се држе за године у пустињи. Неки то узимају против поистовећења или приче; други одговарају да логор у пустињи не оставља рушевине. Ово место има свој чланак на History Globe; овај одговор говори само о томе где се налазило."
  hu:
    - "Kádes-Barnea oázis volt Kánaán déli szélén, ahol a Negev találkozik az északkeleti Sínai sivatagával. A legtöbb tudós Ain el-Qudeiratra helyezi, a vidék leggazdagabb forrására, és a mellette lévő halomra, Tell el-Qudeiratra, a mai Egyiptomban, Izrael határa közelében; a térkép pontja ott áll, Beérsebától légvonalban mintegy 77 km-re délnyugatra, Hebrontól 115 km-re és Jeruzsálemtől 145 km-re. Ez megfelel a Biblia saját leírásának: az Edomhoz küldött követek ezt mondják: „Kádesben vagyunk a te határodnak végvárosában”, az ország déli határa pedig „Kádes-Barneától délre” húzódik."
    - "A hely nem biztos. A régi név Ain Qedeisben él tovább, egy kisebb forrásnál néhány kilométerre délkeletre, amelyet a 19. századi utazók, például H. C. Trumbull, Kádesnek tartottak; Qudeirat, több vízzel és erőddel, a legtöbb tudóst a 20. században nyerte meg, Woolley és Lawrence 1914-es felmérése után. Sokan ma úgy gondolják, hogy „Kádes” a források egész csoportját jelentette. Az ókori írók keletebbre néztek: Josephus Mirjámot egy hegyen temeti el, mielőtt Izráel Petrához érne, Eusebius pedig Kádest a Petráig érő sivatagba helyezte. A szöveg két pusztához köti: Páránhoz a kémek visszatérésekor, Cinhez Mirjám halálakor, a Mózes első könyve pedig „Hén Mispátba, azaz Kádesbe” szavakkal említi. A Mózes ötödik könyve a távolságot a Sínaitól így adja meg: „Tizenegy napi járóföldön Hórebtől fogva, a Szeir hegyének menve, Kádes-Barneáig”."
    - "Kádesből küldte Mózes a kémeket, és itt tagadta meg Izráel a felvonulást, úgyhogy a nép Mózes szavai szerint „sok időn át lakozátok Kádesben”; a Mózes ötödik könyve harmincnyolc évet számol Kádes-Barneától a Zéred patakig. Mirjám itt halt meg és itt temették el, és itt folytak Meriba vizei. A Tell el-Qudeiratnál az ásatók a Kr. e. mintegy 10. századtól a 6. század elejéig terjedő vaskori erődöket találtak, de semmit a Kr. e. 15. vagy 13. századból, a pusztai évekre tartott időpontokból. Egyesek ezt az azonosítás vagy a történet ellen érvnek veszik; mások úgy felelnek, hogy a sivatagi tábor nem hagy romokat. A helynek külön cikke van a History Globe-on; ez a válasz arra szorítkozik, hol volt."
  fi:
    - "Kades-Barnea oli keidas Kanaanin eteläreunalla, siinä, missä Negev kohtaa Koillis-Siinain autiomaan. Useimmat tutkijat sijoittavat sen Ain el-Qudeiratiin, alueen runsaimpaan lähteeseen, ja sen vieressä olevaan kumpuun Tell el-Qudeiratiin nykyisessä Egyptissä lähellä Israelin rajaa; kartan piste on siellä, linnuntietä noin 77 km Beersebasta lounaaseen, 115 km Hebronista ja 145 km Jerusalemista. Se sopii Raamatun omaan kuvaukseen: Edomiin lähetetyt sanansaattajat sanovat ”me olemme nyt Kaadeksessa, kaupungissa, joka on sinun maasi rajalla”, ja maan eteläraja kulkee ”Kaades-Barneasta etelään”."
    - "Paikka ei ole varma. Vanha nimi säilyy Ain Qedeisissä, pienemmässä lähteessä muutaman kilometrin päässä kaakkoon, jonka 1800-luvun matkailijat, kuten H. C. Trumbull, katsoivat Kadekseksi; Qudeirat, jossa oli enemmän vettä ja linnake, voitti useimmat tutkijat 1900-luvulla Woolleyn ja Lawrencen kartoitettua seudun vuonna 1914. Monet katsovat nyt, että ”Kades” kattoi koko lähderyhmän. Antiikin kirjoittajat katsoivat kauemmas itään: Josefus hautaa Mirjamin vuorelle ennen Petraa, ja Eusebios sijoitti Kadeksen Petraan ulottuvaan autiomaahan. Teksti yhdistää sen Paaranin erämaahan vakoojien palatessa ja Zinin erämaahan Mirjamin kuollessa, ja Ensimmäinen Mooseksen kirja liittää sen Mispatin lähteeseen: ”Mispatin lähteelle, se on Kaadekseen”. Viides Mooseksen kirja antaa etäisyyden Siinailta: ”Hoorebista on yksitoista päivänmatkaa, Seirin vuoriston tietä, Kaades-Barneaan”."
    - "Kadeksesta Mooses lähetti vakoojat, ja täällä Israel kieltäytyi nousemasta, niin että kansa viipyi Kadeksessa pitkän aikaa; Viides Mooseksen kirja laskee Kades-Barneasta Seredin puroon kolmekymmentä kahdeksan vuotta. Mirjam kuoli ja haudattiin tänne, ja Meriban vedet vuotivat täällä. Tell el-Qudeiratilla kaivaukset paljastivat rautakautisia linnakkeita noin 900-luvulta 500-luvun alkuun eaa., mutta ei mitään 1400- tai 1200-luvulta eaa., jotka ovat erämaavuosien ajoitukset. Jotkut katsovat tämän puhuvan tunnistusta tai kertomusta vastaan; toiset vastaavat, että leiri autiomaassa ei jätä raunioita. Paikalla on oma artikkelinsa History Globessa; tämä vastaus keskittyy siihen, missä se oli."
  vi:
    - "Ca-đe-Ba-nê-a là một ốc đảo ở rìa phía nam của Ca-na-an, nơi Negev gặp sa mạc đông bắc Sinai. Hầu hết học giả đặt nó tại Ain el-Qudeirat, mạch nước dồi dào nhất vùng, và gò bên cạnh, Tell el-Qudeirat, thuộc Ai Cập ngày nay gần biên giới với Israel; điểm trên bản đồ nằm ở đó, cách Bê-e-Sê-ba khoảng 77 km về phía tây nam, cách Hếp-rôn 115 km và cách Giê-ru-sa-lem 145 km theo đường thẳng. Điều đó khớp với mô tả của chính Kinh Thánh: các sứ giả gửi đến Ê-đôm nói “chúng tôi hiện ở tại Ca-đe, là thành ở nơi đầu bờ cõi của vua”, và biên giới phía nam của xứ chạy “giáp phía nam Ca-đe-Ba-nê-a”."
    - "Địa điểm này không chắc chắn. Tên cổ còn lại ở Ain Qedeis, một mạch nước nhỏ hơn cách vài kilômét về phía đông nam, mà các du khách thế kỷ 19 như H. C. Trumbull cho là Ca-đe; Qudeirat, có nhiều nước hơn và một pháo đài, thuyết phục phần lớn học giả trong thế kỷ 20 sau khi Woolley và Lawrence khảo sát khu vực năm 1914. Nhiều người nay nghĩ “Ca-đe” bao gồm cả nhóm mạch nước. Các tác giả cổ đại tìm xa hơn về phía đông: Josephus chôn Mi-ri-am trên một ngọn núi trước khi Y-sơ-ra-ên đến Petra, và Eusebius đặt Ca-đe trong sa mạc kéo dài đến Petra. Bản văn nối nó với hai đồng vắng, Pha-ran khi các thám tử trở về và Xin khi Mi-ri-am qua đời, và sách Sáng thế gọi nó là “Suối Xử đoán, tức Ca-đe”. Sách Phục truyền cho biết khoảng cách từ Sinai: “Từ Hô-rếp tới Ca-đe-Ba-nê-a, bởi đường núi Sê-i-rơ, đi mười một ngày đường”."
    - "Từ Ca-đe, Môi-se sai các thám tử, và tại đây Y-sơ-ra-ên không chịu đi lên, nên dân ở lại: “các ngươi ở tại Ca-đe lâu ngày”; sách Phục truyền tính ba mươi tám năm từ Ca-đe-Ba-nê-a đến khe Xê-rết. Mi-ri-am qua đời và được chôn tại đây, và nước Mê-ri-ba chảy ra tại đây. Ở Tell el-Qudeirat, các nhà khai quật tìm thấy những pháo đài thời Đồ Sắt từ khoảng thế kỷ 10 đến đầu thế kỷ 6 TCN, nhưng không có gì từ thế kỷ 15 hay 13 TCN, những niên đại được giữ cho các năm trong đồng vắng. Có người lấy điều này chống lại sự đồng nhất hoặc câu chuyện; người khác đáp rằng một doanh trại trong sa mạc không để lại tàn tích. Địa điểm này có bài riêng trên History Globe; câu trả lời này chỉ bàn về nơi nó ở."
  ro:
    - "Cades-Barnea era o oază la marginea de sud a Canaanului, unde Neghevul întâlnește deșertul din nord-estul Sinaiului. Cei mai mulți cercetători o plasează la Ain el-Qudeirat, cel mai bogat izvor al regiunii, și la movila de lângă el, Tell el-Qudeirat, în Egiptul de azi, aproape de granița cu Israelul; punctul de pe hartă se află acolo, la circa 77 km sud-vest de Beer-Șeba, la 115 km de Hebron și la 145 km de Ierusalim în linie dreaptă. Aceasta se potrivește cu descrierea din Biblie: solii către Edom spun „suntem în Cadis cetatea de lângă hotarele tale”, iar granița de sud a țării merge „către miazăzi Kadisul lui Varni”."
    - "Locul nu este sigur. Vechiul nume se păstrează la Ain Qedeis, un izvor mai mic, la câțiva kilometri spre sud-est, pe care călători din secolul al XIX-lea, precum H. C. Trumbull, l-au luat drept Cades; Qudeirat, cu mai multă apă și o fortăreață, a câștigat majoritatea cercetătorilor în secolul al XX-lea, după ce Woolley și Lawrence au cercetat zona în 1914. Mulți cred acum că „Cades” cuprindea întregul grup de izvoare. Scriitorii antici priveau mai spre est: Iosif Flaviu o îngroapă pe Maria pe un munte înainte ca Israel să ajungă la Petra, iar Eusebiu așeza Cadesul în deșertul care se întinde până la Petra. Textul îl leagă de două pustii, Paran, când se întorc iscoadele, și Țin, când moare Maria, iar Geneza spune: „fântâna judecății: aceasta este Kadis”. Deuteronomul dă distanța de la Sinai: „Unsprezece zile din Horiv cale pre muntele Siir până la Kadisul Varni”."
    - "De la Cades Moise a trimis iscoadele și tot aici Israel a refuzat să se suie, așa că poporul a rămas „în Kadis zile multe”; Deuteronomul numără treizeci și opt de ani de la Cades-Barnea până la pârâul Zered. Maria a murit și a fost îngropată aici, și tot aici au curs apele Meribei. La Tell el-Qudeirat arheologii au găsit fortărețe din epoca fierului, din jurul secolului al X-lea până la începutul secolului al VI-lea î.Hr., dar nimic din secolul al XV-lea sau al XIII-lea î.Hr., datele socotite pentru anii din pustie. Unii văd în aceasta un argument împotriva identificării sau a poveștii; alții răspund că o tabără în deșert nu lasă ruine. Locul are un articol propriu pe History Globe; răspunsul de față se ține de locul unde se afla."
  bg:
    - "Кадес-Варни е оазис на южния край на Ханаан, където Негев се среща с пустинята на Североизточен Синай. Повечето учени го поставят при Айн ел-Кудейрат — най-богатия извор в областта, и при хълма до него, Тел ел-Кудейрат, в днешен Египет близо до границата с Израел; точката на картата стои там, на около 77 км югозападно от Вирсавия, на 115 км от Хеврон и на 145 км от Йерусалим по права линия. Това отговаря на собственото описание на Библията: пратениците до Едом казват „ето, сме в Кадис, град в края на твоите предели“, а южната граница на земята минава „от южната страна до Кадис-варни“."
    - "Мястото не е сигурно. Старото име е оцеляло в Айн Кдейс, по-малък извор на няколко километра на югоизток, който пътешественици от XIX в. като Х. К. Тръмбъл смятаха за Кадес; Кудейрат, с повече вода и с крепост, спечели повечето учени през XX в., след като Уули и Лорънс проучиха областта през 1914 г. Мнозина днес смятат, че „Кадес“ е обхващал цялата група извори. Древните автори търсеха по на изток: Йосиф Флавий погребва Мириам на планина, преди Израил да стигне Петра, а Евсевий поставя Кадес в пустинята, която стига до Петра. Текстът го свързва с две пустини — Фаран, когато се връщат съгледвачите, и Цин, когато умира Мириам, а Битие го нарича „Енмишнат, който е Кадис“. Второзаконие дава разстоянието от Синай: „Единадесет дни са от Хорив през пътя на гората Сиир до Кадис-варни“."
    - "От Кадес Мойсей изпрати съгледвачите и тук Израил отказа да възлезе, така че народът остана „в Кадис много дни“; Второзаконие брои тридесет и осем години от Кадес-Варни до потока Заред. Мириам умря и беше погребана тук и тук потекоха водите на Мерива. На Тел ел-Кудейрат археолозите намериха крепости от желязната епоха от около X до началото на VI в. пр.н.е., но нищо от XV или XIII в. пр.н.е. — датите, приемани за годините в пустинята. Някои виждат в това довод срещу отъждествяването или срещу разказа; други отговарят, че стан в пустинята не оставя руини. Мястото има собствена статия в History Globe; този отговор се ограничава с това къде се е намирало."
