id: how-far-nazareth-to-bethlehem
question:
  en: "How far is Nazareth from Bethlehem?"
  ru: "Как далеко от Назарета до Вифлеема?"
  uk: "Як далеко Назарет від Вифлеєму?"
  es: "¿A qué distancia está Nazaret de Belén?"
  pt: "Qual é a distância de Nazaré a Belém?"
  de: "Wie weit ist Nazareth von Bethlehem entfernt?"
  fr: "Quelle distance y a-t-il de Nazareth à Bethléem ?"
answer:
  en:
    - "Nazareth is about 110 km from Bethlehem in a straight line, about 4 days on foot at 30 km a day; by the Roman roads on the map the way measures about 156 km, roughly five days."
    - 'Luke says: "And Joseph also went up from Galilee, out of the city of Nazareth, into Judaea, unto the city of David, which is called Bethlehem." Nazareth lies in a basin in the hills of Lower Galilee; Bethlehem on a ridge in the hills of Judah, about 10 km south of Jerusalem by road. The Gospel does not say which road the family took or how long the journey lasted; travellers from Galilee went either down through the Jordan valley by Jericho or along the ridge through Samaria, and Jerusalem lay on both routes before the last short stage to Bethlehem.'
    - 'The journey from Galilee to Judea was a familiar one: Luke adds that Jesus'' parents "went to Jerusalem every year at the feast of the passover", and Nazareth to Jerusalem is about 103 km in a straight line, 146 km by the roads on the map.'
  ru:
    - "От Назарета до Вифлеема около 110 км по прямой — примерно 4 дня пешего пути по 30 км в день; по римским дорогам на карте путь составляет около 156 км, примерно пять дней."
    - "Лука пишет: «Пошел также и Иосиф из Галилеи, из города Назарета, в Иудею, в город Давидов, называемый Вифлеем». Назарет лежит в котловине среди холмов Нижней Галилеи, Вифлеем — на гребне в горах Иудеи, примерно в 10 км к югу от Иерусалима по дороге. Евангелие не говорит, какой дорогой шла семья и сколько длился путь; из Галилеи шли либо вниз по долине Иордана через Иерихон, либо по хребту через Самарию, и Иерусалим лежал на обоих путях перед последним коротким переходом до Вифлеема."
    - "Путь из Галилеи в Иудею был привычным: Лука добавляет, что родители Иисуса «каждый год… ходили в Иерусалим на праздник Пасхи», а от Назарета до Иерусалима около 103 км по прямой и 146 км по дорогам на карте."
  uk:
    - "Назарет лежить приблизно за 110 км від Вифлеєму по прямій, близько 4 днів пішки за 30 км на день; римськими дорогами на мапі шлях становить близько 156 км, приблизно п'ять днів."
    - "Лука каже: «Пійшов же й Йосиф із Галилеї, з города Назарета, в Юдею, в город Давидів, що зветь ся Витлеєм». Назарет лежить у котловині в пагорбах Нижньої Галілеї; Вифлеєм — на хребті в пагорбах Юдеї, приблизно за 10 км на південь від Єрусалиму дорогою. Євангеліє не каже, якою дорогою пішла родина і скільки тривала подорож; мандрівники з Галілеї спускалися або Йорданською долиною повз Єрихон, або йшли хребтом через Самарію, і Єрусалим лежав на обох шляхах перед останнім коротким відтинком до Вифлеєму."
    - "Подорож із Галілеї до Юдеї була звичною: Лука додає, що батьки Ісуса «ходили … щороку в Єрусалим у сьвято пасхи», а від Назарета до Єрусалиму приблизно 103 км по прямій, 146 км дорогами на мапі."
  es:
    - "Nazaret está a unos 110 km de Belén en línea recta, unos 4 días a pie a 30 km diarios; por las calzadas romanas del mapa el camino mide unos 156 km, aproximadamente cinco días."
    - "Lucas dice: «Y subió José de Galilea, de la ciudad de Nazaret, á Judea, á la ciudad de David, que se llama Bethlehem». Nazaret se halla en una cuenca de las colinas de la Baja Galilea; Belén, en una cresta de las colinas de Judá, a unos 10 km al sur de Jerusalén por el camino. El Evangelio no dice qué camino tomó la familia ni cuánto duró el viaje; los viajeros de Galilea bajaban por el valle del Jordán pasando por Jericó o seguían la cresta por Samaria, y Jerusalén quedaba en ambas rutas antes del último breve tramo hasta Belén."
    - "El viaje de Galilea a Judea era conocido: Lucas añade que los padres de Jesús «iban... todos los años á Jerusalem en la fiesta de la Pascua», y de Nazaret a Jerusalén hay unos 103 km en línea recta, 146 km por los caminos del mapa."
  pt:
    - "Nazaré fica a cerca de 110 km de Belém em linha reta, uns 4 dias a pé a 30 km por dia; pelas estradas romanas do mapa o caminho mede cerca de 156 km, aproximadamente cinco dias."
    - "Lucas diz: “José também subiu da Galileia, da cidade de Nazaré, para a Judeia, à cidade de Davi, chamada Belém”. Nazaré fica numa bacia nos montes da Baixa Galileia; Belém, numa crista dos montes de Judá, a cerca de 10 km ao sul de Jerusalém por estrada. O Evangelho não diz qual caminho a família tomou nem quanto durou a viagem; os viajantes da Galileia desciam pelo vale do Jordão passando por Jericó ou seguiam pela crista através de Samaria, e Jerusalém ficava nos dois percursos, antes do curto último trecho até Belém."
    - "A viagem da Galileia à Judeia era conhecida: Lucas acrescenta que os pais de Jesus “iam todos os anos a Jerusalém, na festa da Páscoa”, e de Nazaré a Jerusalém são cerca de 103 km em linha reta, 146 km pelas estradas do mapa."
  de:
    - "Nazareth ist von Bethlehem in der Luftlinie etwa 110 km entfernt, bei 30 km am Tag etwa 4 Tage zu Fuß; auf den römischen Straßen der Karte misst der Weg etwa 156 km, ungefähr fünf Tage."
    - "Lukas sagt: „Da machte sich auch auf Joseph aus Galiläa, aus der Stadt Nazareth, in das jüdische Land zur Stadt Davids, die da heißt Bethlehem.“ Nazareth liegt in einem Becken in den Bergen von Untergaliläa, Bethlehem auf einem Rücken im Bergland Judas, etwa 10 km südlich von Jerusalem auf der Straße. Das Evangelium sagt nicht, welche Straße die Familie nahm oder wie lange die Reise dauerte; die Reisenden aus Galiläa gingen entweder durch das Jordantal über Jericho hinab oder auf dem Höhenrücken durch Samaria, und Jerusalem lag vor der letzten kurzen Etappe nach Bethlehem auf beiden Wegen."
    - "Die Reise von Galiläa nach Judäa war vertraut: Lukas fügt hinzu, dass die Eltern Jesu „alle Jahre gen Jerusalem auf das Osterfest“ gingen, und von Nazareth nach Jerusalem sind es in der Luftlinie etwa 103 km, auf den Straßen der Karte 146 km."
  fr:
    - "Nazareth est à environ 110 km de Bethléem en ligne droite, soit environ 4 jours de marche à 30 km par jour ; par les routes romaines de la carte, le trajet mesure environ 156 km, soit cinq jours environ."
    - "Luc dit : « Joseph aussi monta de la Galilée, de la ville de Nazareth, pour se rendre en Judée, dans la ville de David, appelée Bethléhem. » Nazareth se trouve dans une cuvette des collines de la Basse Galilée ; Bethléem, sur une crête des collines de Juda, à environ 10 km au sud de Jérusalem par la route. L’Évangile ne dit ni quelle route prit la famille ni combien dura le voyage ; les voyageurs de Galilée descendaient soit par la vallée du Jourdain et Jéricho, soit par la crête à travers la Samarie, et Jérusalem se trouvait sur les deux itinéraires avant le dernier court trajet jusqu’à Bethléem."
    - "Le voyage de Galilée en Judée était familier : Luc ajoute que les parents de Jésus « allaient chaque année à Jérusalem, à la fête de Pâque », et de Nazareth à Jérusalem il y a environ 103 km en ligne droite, 146 km par les routes de la carte."
