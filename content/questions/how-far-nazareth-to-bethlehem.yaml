id: how-far-nazareth-to-bethlehem
question:
  en: "How far is Nazareth from Bethlehem?"
  ru: "Как далеко от Назарета до Вифлеема?"
  uk: "Як далеко Назарет від Вифлеєму?"
  es: "¿A qué distancia está Nazaret de Belén?"
  pt: "Qual é a distância de Nazaré a Belém?"
  de: "Wie weit ist Nazareth von Bethlehem entfernt?"
  fr: "Quelle distance y a-t-il de Nazareth à Bethléem ?"
  pl: "Jak daleko od Betlejem jest Nazaret?"
  it: "Quanto dista Nazaret da Betlemme?"
  nl: "Hoe ver ligt Nazareth van Bethlehem?"
  cs: "Jak daleko je Nazaret od Betléma?"
  sv: "Hur långt är Nasaret från Betlehem?"
  nb: "Hvor langt er Nasaret fra Betlehem?"
  tl: "Gaano kalayo ang Nazaret mula sa Bethlehem?"
  da: "Hvor langt er Nazaret fra Betlehem?"
  sr: "Колико је Назарет удаљен од Витлејема?"
answer:
  en:
    - "Nazareth is about 110 km from Bethlehem in a straight line, about 4 days on foot at 30 km a day; by the Roman roads on the map the way measures about 156 km, roughly five days."
    - 'Luke says: "And Joseph also went up from Galilee, out of the city of Nazareth, into Judaea, unto the city of David, which is called Bethlehem." Nazareth lies in a basin in the hills of Lower Galilee; Bethlehem on a ridge in the hills of Judah, about 10 km south of Jerusalem by road. The Gospel does not say which road the family took or how long the journey lasted; travellers from Galilee went either down through the Jordan valley by Jericho or along the ridge through Samaria, and Jerusalem lay on both routes before the last short stage to Bethlehem.'
    - 'The journey from Galilee to Judea was a familiar one: Luke adds that Jesus'' parents "went to Jerusalem every year at the feast of the passover", and Nazareth to Jerusalem is about 103 km in a straight line, 146 km by the roads on the map.'
  ru:
    - "От Назарета до Вифлеема около 110 км по прямой — примерно 4 дня пешего пути по 30 км в день; по римским дорогам на карте путь составляет около 156 км, примерно пять дней."
    - "Лука пишет: «Пошел также и Иосиф из Галилеи, из города Назарета, в Иудею, в город Давидов, называемый Вифлеем». Назарет лежит в котловине среди холмов Нижней Галилеи, Вифлеем — на гребне в горах Иудеи, примерно в 10 км к югу от Иерусалима по дороге. Евангелие не говорит, какой дорогой шла семья и сколько длился путь; из Галилеи шли либо вниз по долине Иордана через Иерихон, либо по хребту через Самарию, и Иерусалим лежал на обоих путях перед последним коротким переходом до Вифлеема."
    - "Путь из Галилеи в Иудею был привычным: Лука добавляет, что родители Иисуса «каждый год… ходили в Иерусалим на праздник Пасхи», а от Назарета до Иерусалима около 103 км по прямой и 146 км по дорогам на карте."
  uk:
    - "Назарет лежить приблизно за 110 км від Вифлеєму по прямій, близько 4 днів пішки за 30 км на день; римськими дорогами на мапі шлях становить близько 156 км, приблизно п'ять днів."
    - "Лука каже: «Пійшов же й Йосиф із Галилеї, з города Назарета, в Юдею, в город Давидів, що зветь ся Витлеєм». Назарет лежить у котловині в пагорбах Нижньої Галілеї; Вифлеєм — на хребті в пагорбах Юдеї, приблизно за 10 км на південь від Єрусалиму дорогою. Євангеліє не каже, якою дорогою пішла родина і скільки тривала подорож; мандрівники з Галілеї спускалися або Йорданською долиною повз Єрихон, або йшли хребтом через Самарію, і Єрусалим лежав на обох шляхах перед останнім коротким відтинком до Вифлеєму."
    - "Подорож із Галілеї до Юдеї була звичною: Лука додає, що батьки Ісуса «ходили … щороку в Єрусалим у сьвято пасхи», а від Назарета до Єрусалиму приблизно 103 км по прямій, 146 км дорогами на мапі."
  es:
    - "Nazaret está a unos 110 km de Belén en línea recta, unos 4 días a pie a 30 km diarios; por las calzadas romanas del mapa el camino mide unos 156 km, aproximadamente cinco días."
    - "Lucas dice: «Y subió José de Galilea, de la ciudad de Nazaret, á Judea, á la ciudad de David, que se llama Bethlehem». Nazaret se halla en una cuenca de las colinas de la Baja Galilea; Belén, en una cresta de las colinas de Judá, a unos 10 km al sur de Jerusalén por el camino. El Evangelio no dice qué camino tomó la familia ni cuánto duró el viaje; los viajeros de Galilea bajaban por el valle del Jordán pasando por Jericó o seguían la cresta por Samaria, y Jerusalén quedaba en ambas rutas antes del último breve tramo hasta Belén."
    - "El viaje de Galilea a Judea era conocido: Lucas añade que los padres de Jesús «iban... todos los años á Jerusalem en la fiesta de la Pascua», y de Nazaret a Jerusalén hay unos 103 km en línea recta, 146 km por los caminos del mapa."
  pt:
    - "Nazaré fica a cerca de 110 km de Belém em linha reta, uns 4 dias a pé a 30 km por dia; pelas estradas romanas do mapa o caminho mede cerca de 156 km, aproximadamente cinco dias."
    - "Lucas diz: “José também subiu da Galileia, da cidade de Nazaré, para a Judeia, à cidade de Davi, chamada Belém”. Nazaré fica numa bacia nos montes da Baixa Galileia; Belém, numa crista dos montes de Judá, a cerca de 10 km ao sul de Jerusalém por estrada. O Evangelho não diz qual caminho a família tomou nem quanto durou a viagem; os viajantes da Galileia desciam pelo vale do Jordão passando por Jericó ou seguiam pela crista através de Samaria, e Jerusalém ficava nos dois percursos, antes do curto último trecho até Belém."
    - "A viagem da Galileia à Judeia era conhecida: Lucas acrescenta que os pais de Jesus “iam todos os anos a Jerusalém, na festa da Páscoa”, e de Nazaré a Jerusalém são cerca de 103 km em linha reta, 146 km pelas estradas do mapa."
  de:
    - "Nazareth ist von Bethlehem in der Luftlinie etwa 110 km entfernt, bei 30 km am Tag etwa 4 Tage zu Fuß; auf den römischen Straßen der Karte misst der Weg etwa 156 km, ungefähr fünf Tage."
    - "Lukas sagt: „Da machte sich auch auf Joseph aus Galiläa, aus der Stadt Nazareth, in das jüdische Land zur Stadt Davids, die da heißt Bethlehem.“ Nazareth liegt in einem Becken in den Bergen von Untergaliläa, Bethlehem auf einem Rücken im Bergland Judas, etwa 10 km südlich von Jerusalem auf der Straße. Das Evangelium sagt nicht, welche Straße die Familie nahm oder wie lange die Reise dauerte; die Reisenden aus Galiläa gingen entweder durch das Jordantal über Jericho hinab oder auf dem Höhenrücken durch Samaria, und Jerusalem lag vor der letzten kurzen Etappe nach Bethlehem auf beiden Wegen."
    - "Die Reise von Galiläa nach Judäa war vertraut: Lukas fügt hinzu, dass die Eltern Jesu „alle Jahre gen Jerusalem auf das Osterfest“ gingen, und von Nazareth nach Jerusalem sind es in der Luftlinie etwa 103 km, auf den Straßen der Karte 146 km."
  fr:
    - "Nazareth est à environ 110 km de Bethléem en ligne droite, soit environ 4 jours de marche à 30 km par jour ; par les routes romaines de la carte, le trajet mesure environ 156 km, soit cinq jours environ."
    - "Luc dit : « Joseph aussi monta de la Galilée, de la ville de Nazareth, pour se rendre en Judée, dans la ville de David, appelée Bethléhem. » Nazareth se trouve dans une cuvette des collines de la Basse Galilée ; Bethléem, sur une crête des collines de Juda, à environ 10 km au sud de Jérusalem par la route. L’Évangile ne dit ni quelle route prit la famille ni combien dura le voyage ; les voyageurs de Galilée descendaient soit par la vallée du Jourdain et Jéricho, soit par la crête à travers la Samarie, et Jérusalem se trouvait sur les deux itinéraires avant le dernier court trajet jusqu’à Bethléem."
    - "Le voyage de Galilée en Judée était familier : Luc ajoute que les parents de Jésus « allaient chaque année à Jérusalem, à la fête de Pâque », et de Nazareth à Jérusalem il y a environ 103 km en ligne droite, 146 km par les routes de la carte."
  pl:
    - "Nazaret leży około 110 km od Betlejem w linii prostej, około 4 dni drogi pieszo przy 30 km dziennie; rzymskimi drogami z mapy ma to około 156 km, mniej więcej pięć dni."
    - "Łukasz mówi: „Wstąpił też i Józef z Galilei z miasta Nazaretu do ziemi Judzkiej, do miasta Dawidowego, które zowią Betlehem.” Nazaret leży w kotlinie we wzgórzach Dolnej Galilei, Betlejem na grzbiecie w górach Judy, około 10 km na południe od Jerozolimy drogą. Ewangelia nie mówi, którą drogą poszła rodzina ani jak długo trwała podróż; podróżni z Galilei schodzili albo doliną Jordanu przez Jerycho, albo szli grzbietem przez Samarię, a Jerozolima leżała na obu trasach przed ostatnim krótkim odcinkiem do Betlejem."
    - "Droga z Galilei do Judei była dobrze znana: Łukasz dodaje, że rodzice Jezusa „chadzali na każdy rok do Jeruzalemu na święto wielkanocne”, a z Nazaretu do Jerozolimy jest około 103 km w linii prostej, 146 km drogami z mapy."
  it:
    - "Nazaret dista circa 110 km da Betlemme in linea retta, circa 4 giorni a piedi a 30 km al giorno; per le strade romane della mappa il percorso misura circa 156 km, all’incirca cinque giorni."
    - "Luca dice: «Or anche Giuseppe salì di Galilea, dalla città di Nazaret, in Giudea, alla città di Davide, chiamata Betleem». Nazaret giace in una conca nelle colline della Bassa Galilea; Betlemme su un crinale nelle colline di Giuda, a circa 10 km a sud di Gerusalemme per strada. Il Vangelo non dice quale strada seguì la famiglia né quanto durò il viaggio; i viaggiatori dalla Galilea scendevano o per la valle del Giordano passando da Gerico o lungo il crinale attraverso la Samaria, e Gerusalemme si trovava su entrambi i percorsi prima dell’ultima breve tappa fino a Betlemme."
    - "Il viaggio dalla Galilea alla Giudea era ben noto: Luca aggiunge che i genitori di Gesù «andavano ogni anno a Gerusalemme per la festa di Pasqua», e da Nazaret a Gerusalemme ci sono circa 103 km in linea retta, 146 km lungo le strade della mappa."
  nl:
    - "Nazareth ligt hemelsbreed ongeveer 110 km van Bethlehem, bij 30 km per dag ongeveer 4 dagen te voet; langs de Romeinse wegen op de kaart meet de weg ongeveer 156 km, grofweg vijf dagen."
    - "Lukas zegt: “En Jozef ging ook op van Galilea, uit de stad Nazareth, naar Judea, tot de stad Davids, die Bethlehem genaamd wordt.” Nazareth ligt in een kom in het heuvelland van Neder-Galilea; Bethlehem op een bergrug in het bergland van Juda, ongeveer 10 km ten zuiden van Jeruzalem langs de weg. Het Evangelie zegt niet welke weg het gezin nam of hoe lang de reis duurde; reizigers uit Galilea gingen ofwel door de Jordaanvallei langs Jericho naar beneden, ofwel langs de bergkam door Samaria, en Jeruzalem lag op beide routes vóór het laatste korte stuk naar Bethlehem."
    - "De reis van Galilea naar Judea was een vertrouwde: Lukas voegt eraan toe dat de ouders van Jezus “reisden alle jaar naar Jeruzalem, op het feest van pascha”, en van Nazareth naar Jeruzalem is het hemelsbreed ongeveer 103 km, 146 km langs de wegen op de kaart."
  cs:
    - "Nazaret je od Betléma vzdálen asi 110 km vzdušnou čarou, asi 4 dny pěšky při 30 km denně; po římských silnicích na mapě měří cesta asi 156 km, zhruba pět dní."
    - "Lukáš praví: „Vstoupil pak i Jozef od Galilee z města Nazarétu do Judstva, do města Davidova, kteréž slove Betlém.“ Nazaret leží v kotlině v kopcích Dolní Galileje; Betlém na hřebeni v judských horách, asi 10 km jižně od Jeruzaléma po silnici. Evangelium neříká, kterou cestou rodina šla ani jak dlouho cesta trvala; cestující z Galileje šli buď dolů Jordánským údolím přes Jericho, nebo po hřebeni přes Samaří, a Jeruzalém ležel na obou trasách před posledním krátkým úsekem do Betléma."
    - "Cesta z Galileje do Judska byla známá: Lukáš dodává: „chodívali rodičové jeho každého roku do Jeruzaléma na den slavný velikonoční“, a z Nazareta do Jeruzaléma je to asi 103 km vzdušnou čarou, 146 km po silnicích na mapě."
  sv:
    - "Nasaret ligger omkring 110 km från Betlehem fågelvägen, omkring 4 dagar till fots med 30 km om dagen; via de romerska vägarna på kartan mäter vägen omkring 156 km, ungefär fem dagar."
    - "Lukas säger: ”Så gjorde ock Josef; och eftersom han var av Davids hus och släkt, for han från staden Nasaret i Galileen upp till Davids stad, som heter Betlehem, i Judeen.” Nasaret ligger i en dalsänka i bergen i Nedre Galileen; Betlehem på en ås i Judas berg, omkring 10 km söder om Jerusalem på väg. Evangeliet säger inte vilken väg familjen tog eller hur lång tid resan varade; resenärer från Galileen gick antingen ned genom Jordandalen via Jeriko eller längs åsen genom Samaria, och Jerusalem låg på båda vägarna före den sista korta etappen till Betlehem."
    - "Resan från Galileen till Judeen var välbekant: Lukas tillägger att Jesu föräldrar ”plägade årligen vid påskhögtiden begiva sig till Jerusalem”, och Nasaret till Jerusalem är omkring 103 km fågelvägen, 146 km via vägarna på kartan."
  nb:
    - "Nasaret ligger omtrent 110 km fra Betlehem i luftlinje, omtrent 4 dager til fots med 30 km om dagen; langs romerveiene på kartet er veien omtrent 156 km, ca. fem dager."
    - "Lukas sier: «Men også Josef drog op fra Galilea, fra byen Nasaret, til Judea, til Davids stad, som heter Betlehem.» Nasaret ligger i en forsenkning i åsene i Nedre Galilea; Betlehem på en rygg i Judas høyland, omtrent 10 km sør for Jerusalem langs veien. Evangeliet sier ikke hvilken vei familien tok eller hvor lenge reisen varte; reisende fra Galilea gikk enten ned gjennom Jordandalen forbi Jeriko eller langs ryggen gjennom Samaria, og Jerusalem lå på begge rutene før den siste korte etappen til Betlehem."
    - "Reisen fra Galilea til Judea var kjent: Lukas legger til at Jesu foreldre «drog hvert år til Jerusalem til påskefesten», og Nasaret til Jerusalem er omtrent 103 km i luftlinje, 146 km langs veiene på kartet."
  tl:
    - "Ang Nazaret ay nasa mga 110 km mula sa Bethlehem sa tuwid na guhit, mga 4 na araw na lakad sa 30 km kada araw; sa mga daang Romano sa mapa ay sumusukat ang daan ng mga 156 km, humigit-kumulang limang araw."
    - "Sinasabi ni Lucas: “Si Jose naman ay umahon mula sa Galilea, mula sa bayan ng Nazaret, hanggang sa Judea, sa bayan ni David, na kung tawagi'y Bet-lehem.” Ang Nazaret ay nasa isang palanggana sa mga burol ng Mababang Galilea; ang Bethlehem ay nasa isang tagaytay sa mga burol ng Juda, mga 10 km sa timog ng Jerusalem sa daan. Hindi sinasabi ng Ebanghelyo kung aling daan ang tinahak ng pamilya o gaano katagal ang paglalakbay; ang mga manlalakbay mula sa Galilea ay bumaba sa libis ng Jordan sa Jerico o dumaan sa tagaytay sa Samaria, at ang Jerusalem ay nasa dalawang ruta bago ang huling maikling yugto patungong Bethlehem."
    - "Pamilyar ang paglalakbay mula sa Galilea hanggang sa Judea: idinaragdag ni Lucas na ang mga magulang ni Jesus ay “nagsisiparoon taon-taon … sa Jerusalem sa kapistahan ng paskua”, at ang Nazaret hanggang sa Jerusalem ay mga 103 km sa tuwid na guhit, 146 km sa mga daan sa mapa."
  da:
    - "Nazaret ligger omkring 110 km fra Betlehem i luftlinje, omkring 4 dage til fods med 30 km om dagen; ad de romerske veje på kortet måler vejen omkring 156 km, cirka fem dage."
    - "Lukas siger: »Og ogsaa Josef gik op fra Galilæa, fra Byen Nazareth til Judæa til Davids By, som kaldes Bethlehem«. Nazaret ligger i et bassin i Nedre Galilæas bjerge; Betlehem på en højderyg i Judas bjerge, omkring 10 km syd for Jerusalem ad vejen. Evangeliet siger ikke, hvilken vej familien tog, eller hvor længe rejsen varede; rejsende fra Galilæa gik enten ned gennem Jordandalen forbi Jeriko eller langs højderyggen gennem Samaria, og Jerusalem lå på begge ruter før den sidste korte etape til Betlehem."
    - "Rejsen fra Galilæa til Judæa var velkendt: Lukas tilføjer, at Jesu forældre »droge hvert Aar op til Jerusalem paa Paaskehøjtiden«, og Nazaret til Jerusalem er omkring 103 km i luftlinje, 146 km ad vejene på kortet."
  sr:
    - "Назарет је око 110 км од Витлејема ваздушном линијом, око 4 дана пешке уз 30 км дневно; римским путевима на карти пут износи око 156 км, отприлике пет дана."
    - "Лука каже: „Тада пође и Јосиф из Галилеје, из града Назарета у Јудеју у град Давидов који се зваше Витлејем.“ Назарет лежи у котлини у брдима Доње Галилеје, а Витлејем на гребену у брдима Јуде, око 10 км јужно од Јерусалима путем. Јеванђеље не каже којим се путем породица кретала ни колико је путовање трајало; путници из Галилеје силазили су или долином Јордана преко Јерихона или гребеном кроз Самарију, а Јерусалим је лежао на оба пута пре последње кратке етапе до Витлејема."
    - "Пут из Галилеје у Јудеју био је добро познат: Лука додаје: „родитељи Његови иђаху сваке године у Јерусалим о празнику пасхе“, а од Назарета до Јерусалима има око 103 км ваздушном линијом, 146 км путевима на карти."
