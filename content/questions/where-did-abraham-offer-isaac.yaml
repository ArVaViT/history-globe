id: where-did-abraham-offer-isaac
question:
  en: "Where did Abraham offer Isaac?"
  ru: "Где Авраам приносил в жертву Исаака?"
  uk: "Де Авраам приніс у жертву Ісаака?"
  es: "¿Dónde ofreció Abraham a Isaac?"
  pt: "Onde Abraão ofereceu Isaque?"
  de: "Wo opferte Abraham Isaak?"
  fr: "Où Abraham offrit-il Isaac ?"
  pl: "Gdzie Abraham ofiarował Izaaka?"
  it: "Dove Abramo offrì Isacco?"
  nl: "Waar offerde Abraham Isaak?"
  cs: "Kde Abraham obětoval Izáka?"
  sv: "Var offrade Abraham Isak?"
  nb: "Hvor ofret Abraham Isak?"
  tl: "Saan inihandog ni Abraham si Isaac?"
  da: "Hvor ofrede Abraham Isak?"
answer:
  en:
    - "Genesis says only “the land of Moriah” and “one of the mountains which I will tell thee of”; Jewish tradition from at least the time of the Chronicler has placed it on the hill of the Temple in Jerusalem, where the map point stands, marked as disputed. Abraham went back to Beersheba afterwards, about 70 km to the south-west in a straight line, and is usually thought to have set out from there; “on the third day Abraham lifted up his eyes, and saw the place afar off”, a pace that suits the hill country of Judah."
    - "The link to Jerusalem is made in Chronicles: “Then Solomon began to build the house of the LORD at Jerusalem in mount Moriah, where the Lord appeared unto David his father, in the place that David had prepared in the threshingfloor of Ornan the Jebusite.” The Book of Jubilees calls Abraham's mountain Mount Zion, and Josephus says plainly that it was the hill on which David later built the Temple. Jewish tradition fixes the place at the rock now under the Dome of the Rock; the Quran tells the story of Abraham's son too, though there the son is unnamed and later Muslim tradition mostly makes him Ishmael."
    - "The Samaritans read the name differently and claim Mount Gerizim above Shechem, their own holy mountain, and the Samaritan Pentateuch is often read as “the land of Moreh”, the oak of Moreh at Shechem being Abraham's first halt in Canaan. The Syriac Bible has “the land of the Amorites”, and the Septuagint translators gave up on the name and wrote “the high land”. No archaeology can settle it; the name Moriah occurs nowhere else but in these two verses."
  ru:
    - "Книга Бытия говорит только о «земле Мориа» и «одной из гор, о которой Я скажу тебе»; иудейское предание по меньшей мере со времён Летописца помещает жертвоприношение на холм Храма в Иерусалиме, где и стоит точка карты, помеченная как спорная. Потом Авраам вернулся в Вирсавию, примерно в 70 км к юго-западу по прямой, и обычно считают, что вышел он оттуда же; «На третий день Авраам возвел очи свои, и увидел то место издалека» — шаг, подходящий горам Иудеи."
    - "Связь с Иерусалимом проводит книга Паралипоменон: «И начал Соломон строить дом Господень в Иерусалиме на горе Мориа, которая указана была Давиду, отцу его, на месте, которое приготовил Давид, на гумне Орны Иевусеянина». Книга Юбилеев называет гору Авраама Сионом, а Иосиф Флавий прямо говорит, что это холм, на котором Давид позже построил Храм. Иудейское предание указывает это место на скале, над которой ныне стоит Купол Скалы; Коран тоже рассказывает о сыне Авраама, хотя сын там не назван, и позднейшее мусульманское предание чаще видит в нём Измаила."
    - "Самаряне читают имя иначе и указывают на гору Гаризим над Сихемом, свою святую гору: Самаритянское Пятикнижие часто читают как «земля Море» — дубрава Море у Сихема была первой стоянкой Авраама в Ханаане. Сирийская Библия даёт «землю Аморреев», а переводчики Септуагинты отказались от имени и написали «высокая земля». Археология тут бессильна: имя Мориа не встречается нигде, кроме этих двух стихов."
  uk:
    - "Книга Буття каже лише «Морія землю» і «на одній горі, що тобі речу»; єврейська традиція, принаймні від часів автора Хронік, розміщує це на пагорбі Храму в Єрусалимі, де стоїть точка мапи, позначена як спірна. Авраам після цього повернувся до Беер-Шеви, приблизно за 70 км на південний захід по прямій, і зазвичай вважають, що вирушив він звідти; «На третїй же день позирнув Авраам очима своїми, та й побачив те врочище здалеку» — темп, що пасує до гірської країни Юдеї."
    - "Зв'язок з Єрусалимом проводять Хроніки: «І почав Соломон будувати дом Господнїй в Ерусалимі на горі Моріа, що була вказана Давидові, його батькові, на місцї, що зготував Давид на току Орни Евузія». Книга Ювілеїв називає гору Авраама горою Сіон, а Йосиф Флавій прямо каже, що це був пагорб, на якому Давид згодом збудував Храм. Єврейська традиція визначає місце на скелі, що нині під Куполом Скелі; Коран також розповідає історію сина Авраама, хоч там син не названий, а пізніша мусульманська традиція здебільшого робить його Ізмаїлом."
    - "Самаряни читають назву інакше й претендують на гору Геризим над Сихемом, свою власну святу гору, а Самарянське П'ятикнижжя часто читають як «земля Море», бо дуб Море в Сихемі був першою зупинкою Авраама в Ханаані. Сирійська Біблія має «земля аморіїв», а перекладачі Септуагінти махнули рукою на назву й написали «висока земля». Жодна археологія цього не вирішить; назва Морія трапляється лише в цих двох віршах і ніде більше."
  es:
    - "Génesis dice solo «tierra de Moriah» y «uno de los montes que yo te diré»; la tradición judía, desde al menos la época del cronista, lo ha situado en la colina del Templo de Jerusalén, donde está el punto del mapa, marcado como discutido. Abraham volvió después a Beerseba, a unos 70 km al suroeste en línea recta, y suele pensarse que partió de allí; «al tercer día alzó Abraham sus ojos, y vió el lugar de lejos», un ritmo que conviene a la región montañosa de Judá."
    - "El vínculo con Jerusalén se establece en Crónicas: «Y comenzó Salomón á edificar la casa en Jerusalem, en el monte Moria que había sido mostrado á David su padre, en el lugar que David había preparado en la era de Ornán Jebuseo». El Libro de los Jubileos llama monte Sion al monte de Abraham, y Josefo dice claramente que era la colina en la que David edificó después el Templo. La tradición judía fija el lugar en la roca que hoy está bajo la Cúpula de la Roca; el Corán cuenta también la historia del hijo de Abraham, aunque allí el hijo no tiene nombre y la tradición musulmana posterior lo hace en su mayoría Ismael."
    - "Los samaritanos leen el nombre de otro modo y reclaman el monte Gerizim, sobre Siquem, su propia montaña santa, y el Pentateuco samaritano suele leerse como «la tierra de Moré», siendo la encina de Moré en Siquem la primera parada de Abraham en Canaán. La Biblia siríaca tiene «la tierra de los amorreos», y los traductores de la Septuaginta renunciaron al nombre y escribieron «la tierra alta». Ninguna arqueología puede zanjarlo; el nombre Moriah no aparece en ningún otro lugar salvo en estos dos versículos."
  pt:
    - "Gênesis diz apenas “a terra de Moriá” e “um dos montes que eu lhe disser”; a tradição judaica, desde pelo menos o tempo do Cronista, o situa na colina do Templo em Jerusalém, onde está o ponto do mapa, marcado como disputado. Depois Abraão voltou a Berseba, a cerca de 70 km a sudoeste em linha reta, e em geral se pensa que dali partiu; “no terceiro dia, Abraão levantou os olhos e viu o lugar de longe”, um ritmo que convém aos montes de Judá."
    - "A ligação com Jerusalém é feita em Crônicas: “Então Salomão começou a construir a casa do SENHOR em Jerusalém, no monte Moriá, onde o SENHOR havia aparecido a Davi, seu pai, no lugar que Davi tinha preparado na eira de Ornã, o jebuseu.” O livro dos Jubileus chama o monte de Abraão de monte Sião, e Josefo diz claramente que era a colina onde Davi construiu depois o Templo. A tradição judaica fixa o lugar na rocha hoje sob o Domo da Rocha; o Alcorão também conta a história do filho de Abraão, embora ali o filho não seja nomeado e a tradição muçulmana posterior o faça, em sua maioria, Ismael."
    - "Os samaritanos leem o nome de outro modo e reivindicam o monte Gerizim, acima de Siquém, sua própria montanha santa, e o Pentateuco Samaritano costuma ser lido como “a terra de Moré”, sendo o carvalho de Moré, em Siquém, a primeira parada de Abraão em Canaã. A Bíblia siríaca tem “a terra dos amorreus”, e os tradutores da Septuaginta desistiram do nome e escreveram “a terra alta”. Nenhuma arqueologia pode decidir; o nome Moriá não aparece em nenhum outro lugar além desses dois versículos."
  de:
    - "Die Genesis sagt nur „das Land Morija“ und „auf einem Berge, den ich dir sagen werde“; die jüdische Überlieferung hat es seit mindestens der Zeit des Chronisten auf den Tempelhügel in Jerusalem gelegt, wo der Kartenpunkt steht, als umstritten gekennzeichnet. Abraham kehrte danach nach Beerscheba zurück, in der Luftlinie etwa 70 km südwestlich, und ist wohl von dort aufgebrochen; „am dritten Tage hob Abraham seine Augen auf und sah die Stätte von ferne“, ein Tempo, das zum Bergland Judas passt."
    - "Die Verbindung zu Jerusalem stellt die Chronik her: „Und Salomo fing an zu bauen das Haus des HERRN zu Jerusalem auf dem Berge Morija, der David, seinem Vater, gezeigt war, welchen David zubereitet hatte zum Raum auf der Tenne Ornans, des Jebusiters.“ Das Jubiläenbuch nennt Abrahams Berg den Berg Zion, und Josephus sagt deutlich, es sei der Hügel gewesen, auf dem David später den Tempel baute. Die jüdische Überlieferung legt die Stätte auf den Felsen unter dem heutigen Felsendom; der Koran erzählt die Geschichte auch von Abrahams Sohn, doch dort bleibt der Sohn ungenannt, und die spätere muslimische Überlieferung macht ihn meist zu Ismael."
    - "Die Samaritaner lesen den Namen anders und beanspruchen den Berg Garizim über Sichem, ihren eigenen heiligen Berg, und der samaritanische Pentateuch wird oft als „das Land More“ gelesen, wobei die Eiche More bei Sichem Abrahams erste Station in Kanaan war. Die syrische Bibel hat „das Land der Amoriter“, und die Übersetzer der Septuaginta gaben den Namen auf und schrieben „das hohe Land“. Keine Archäologie kann es entscheiden; der Name Morija kommt nirgends sonst vor als in diesen beiden Versen."
  fr:
    - "La Genèse dit seulement « au pays de Morija » et « l’une des montagnes que je te dirai » ; la tradition juive, depuis au moins le temps du Chroniqueur, la place sur la colline du Temple à Jérusalem, où se trouve le point de la carte, marqué comme discuté. Abraham retourna ensuite à Beer-Schéba, à environ 70 km au sud-ouest en ligne droite, et l’on pense d’ordinaire qu’il en était parti ; « le troisième jour, Abraham, levant les yeux, vit le lieu de loin », une allure qui convient à la région montagneuse de Juda."
    - "Le lien avec Jérusalem est établi dans les Chroniques : « Salomon commença à bâtir la maison de l’Éternel à Jérusalem, sur la montagne de Morija, qui avait été indiquée à David, son père, dans le lieu préparé par David sur l’aire d’Ornan, le Jébusien. » Le livre des Jubilés appelle la montagne d’Abraham mont Sion, et Josèphe dit nettement que c’était la colline où David bâtit plus tard le Temple. La tradition juive fixe le lieu au rocher qui se trouve aujourd’hui sous le Dôme du Rocher ; le Coran raconte aussi l’histoire du fils d’Abraham, mais le fils n’y est pas nommé et la tradition musulmane postérieure en fait le plus souvent Ismaël."
    - "Les Samaritains lisent le nom autrement et revendiquent le mont Garizim, au-dessus de Sichem, leur propre montagne sainte, et le Pentateuque samaritain se lit souvent « le pays de Moré », le chêne de Moré à Sichem étant la première halte d’Abraham en Canaan. La Bible syriaque a « le pays des Amorites », et les traducteurs de la Septante renoncèrent au nom et écrivirent « le haut pays ». Aucune archéologie ne peut trancher ; le nom de Morija ne se rencontre ailleurs que dans ces deux versets."
  pl:
    - "Księga Rodzaju mówi tylko „do ziemi Moryja” i „na jednej górze, o którejć powiem”; tradycja żydowska co najmniej od czasów Kronikarza umieszcza to na wzgórzu Świątyni w Jerozolimie, gdzie stoi punkt na mapie, oznaczony jako sporny. Abraham wrócił potem do Beer-Szeby, około 70 km na południowy zachód w linii prostej, i zwykle uważa się, że stamtąd wyruszył; „A dnia trzeciego, podniósłszy Abraham oczy swe, ujrzał ono miejsce z daleka”, w tempie, które pasuje do górzystej krainy Judy."
    - "Związek z Jerozolimą ustanawia Księga Kronik: „Począł tedy Salomon budować dom Pański w Jeruzalemie na górze Moryja, która była ukazana Dawidowi, ojcu jego, na miejscu, które zgotował Dawid na bojewisku Ornana Jebuzejczyka.” Księga Jubileuszów nazywa górę Abrahama górą Syjon, a Józef Flawiusz mówi wprost, że było to wzgórze, na którym Dawid zbudował później Świątynię. Tradycja żydowska umiejscawia to miejsce na skale, która jest dziś pod Kopułą na Skale; Koran też opowiada historię syna Abrahama, choć tam syn jest bezimienny, a późniejsza tradycja muzułmańska w większości czyni nim Izmaela."
    - "Samarytanie czytają nazwę inaczej i wskazują Górę Garizim nad Sychem, swoją świętą górę, a Pięcioksiąg Samarytański czyta się często jako „ziemia More”, przy czym dąb More w Sychem był pierwszym postojem Abrahama w Kanaanie. Biblia syryjska ma „ziemię Amorytów”, a tłumacze Septuaginty zrezygnowali z nazwy i napisali „wysoka ziemia”. Żadna archeologia nie rozstrzygnie sprawy; nazwa Moria występuje gdzie indziej tylko w tych dwóch wersetach."
  it:
    - "La Genesi dice soltanto «nel paese di Moriah» e «sopra uno dei monti che ti dirò»; la tradizione ebraica, almeno dal tempo del Cronista, lo colloca sul colle del Tempio di Gerusalemme, dove si trova il punto della mappa, segnato come discusso. Abramo tornò poi a Bersabea, a circa 70 km a sud-ovest in linea retta, e si pensa di solito che sia partito da lì; «Il terzo giorno, Abrahamo alzò gli occhi e vide da lontano il luogo», un passo che si addice alla regione collinare di Giuda."
    - "Il legame con Gerusalemme è fatto nelle Cronache: «Salomone cominciò a costruire la casa dell’Eterno a Gerusalemme, sul monte Moriah, dove l’Eterno era apparso a Davide suo padre, nel luogo che Davide aveva preparato, nell’aia di Ornan, il Gebuseo». Il Libro dei Giubilei chiama il monte di Abramo Monte Sion, e Giuseppe Flavio dice chiaramente che era il colle su cui Davide costruì poi il Tempio. La tradizione ebraica fissa il luogo sulla roccia che ora sta sotto la Cupola della Roccia; anche il Corano racconta la storia del figlio di Abramo, benché là il figlio non sia nominato e la successiva tradizione musulmana lo identifichi per lo più con Ismaele."
    - "I Samaritani leggono il nome in modo diverso e rivendicano il Monte Garizim sopra Sichem, il loro monte santo, e il Pentateuco samaritano è spesso letto come «il paese di Moreh», la quercia di Moreh a Sichem essendo la prima sosta di Abramo in Canaan. La Bibbia siriaca ha «il paese degli Amorrei», e i traduttori della Settanta rinunciarono al nome e scrissero «l’alto paese». Nessuna archeologia può risolverlo; il nome Moria non ricorre altrove che in questi due versetti."
  nl:
    - "Genesis zegt alleen “het land Moria” en “een van de bergen, dien Ik u zeggen zal”; de Joodse overlevering heeft het sinds ten minste de tijd van de kroniekschrijver geplaatst op de tempelheuvel in Jeruzalem, waar het punt op de kaart staat, gemarkeerd als omstreden. Abraham ging daarna terug naar Berseba, hemelsbreed ongeveer 70 km naar het zuidwesten, en men neemt gewoonlijk aan dat hij daar was vertrokken; “aan den derden dag, toen hief Abraham zijn ogen op, en zag die plaats van verre”, een tempo dat bij het bergland van Juda past."
    - "De band met Jeruzalem wordt gelegd in Kronieken: “Salomo begon het huis des HEEREN te bouwen te Jeruzalem, op den berg Moria, die zijn vader David gewezen was, in de plaats, die David toebereid had, op den dorsvloer van Ornan, den Jebusiet.” Het Jubileeënboek noemt Abrahams berg de berg Sion, en Josephus zegt zonder omwegen dat het de heuvel was waarop David later de tempel bouwde. De Joodse overlevering legt de plaats vast bij de rots die nu onder de Rotskoepel ligt; ook de Koran vertelt het verhaal van Abrahams zoon, al blijft de zoon daar ongenoemd en maakt de latere islamitische overlevering hem meestal tot Ismaël."
    - "De Samaritanen lazen de naam anders en claimen de berg Gerizim boven Sichem, hun eigen heilige berg, en de Samaritaanse Pentateuch wordt vaak gelezen als “het land More”, waarbij de eik van More te Sichem Abrahams eerste halte in Kanaän was. De Syrische bijbel heeft “het land van de Amorieten”, en de vertalers van de Septuaginta gaven de naam op en schreven “het hoge land”. Geen enkele archeologie kan het beslissen; de naam Moria komt nergens anders voor dan in deze twee verzen."
  cs:
    - "Genesis říká jen „do země Moria“ a „na jedné hoře, o níž povím tobě“; židovská tradice nejméně od doby Letopisce klade místo na chrámový pahorek v Jeruzalémě, kde stojí bod na mapě, označený jako sporný. Abraham se potom vrátil do Beer-šeby, asi 70 km jihozápadně vzdušnou čarou, a obvykle se soudí, že odtud vyšel; „třetího pak dne pozdvihl Abraham očí svých, a uzřel to místo zdaleka“, což odpovídá tempu v judské vrchovině."
    - "Spojení s Jeruzalémem vytváří Letopisy: „I začal stavěti Šalomoun domu Hospodinova v Jeruzalémě na hoře Moria, kteráž byla ukázána Davidovi otci jeho, na místě, kteréž byl připravil David, na humně Ornana Jebuzejského.“ Kniha jubileí nazývá Abrahamovu horu horou Sijón a Josephus Flavius říká jasně, že to byl pahorek, na němž David později postavil chrám. Židovská tradice klade místo na skálu nyní pod Skalním dómem; korán vypráví příběh Abrahamova syna také, ač tam syn zůstává nejmenován a pozdější muslimská tradice z něj většinou činí Jišmaele."
    - "Samaritáni čtou jméno jinak a hlásí se ke Gerizimu nad Šekemem, své vlastní svaté hoře, a Samaritánský Pentateuch se často čte jako „země Móre“, přičemž dub Móre u Šekemu byl první Abrahamovou zastávkou v Kanaánu. Syrská Bible má „zemi Emorejských“ a překladatelé Septuaginty se jména vzdali a napsali „vysoká země“. Archeologie to nerozhodne; jméno Moria se jinde než v těchto dvou verších nevyskytuje."
  sv:
    - "1 Mosebok säger bara ”Moria land” och ”ett berg som jag skall säga dig”; judisk tradition har sedan åtminstone Krönikeförfattarens tid förlagt det till tempelberget i Jerusalem, där kartpunkten står, markerad som omstridd. Abraham vände därefter tillbaka till Beer Sheva, omkring 70 km åt sydväst fågelvägen, och anses vanligen ha utgått därifrån; ”När nu Abraham på tredje dagen lyfte upp sina ögon och fick se platsen på avstånd”, en takt som passar Judas bergsbygd."
    - "Kopplingen till Jerusalem görs i Krönikeböckerna: ”Och Salomo begynte att bygga HERRENS hus i Jerusalem, på berget Moria, där hans fader David hade fått sin uppenbarelse, och där han nu själv hade berett rum, på det ställe som David hade utsett, nämligen på jebuséen Ornans tröskplats.” Jubileerboken kallar Abrahams berg Sions berg, och Josefus säger rakt ut att det var kullen där David senare byggde templet. Judisk tradition fastställer platsen till klippan som nu ligger under Klippdomen; Koranen berättar också historien om Abrahams son, fast sonen där är onämnd och senare muslimsk tradition oftast gör honom till Ismael."
    - "Samariterna läser namnet annorlunda och gör anspråk på berget Gerisim ovanför Shekem, sitt eget heliga berg, och den samaritiska Pentateuken läses ofta som ”Mores land”, eftersom Mores terebint vid Shekem var Abrahams första rastplats i Kanaan. Den syriska bibeln har ”amoréernas land”, och Septuagintas översättare gav upp namnet och skrev ”det höga landet”. Ingen arkeologi kan avgöra saken; namnet Moria förekommer ingen annanstans än i dessa två verser."
  nb:
    - "1 Mosebok sier bare «Moria land» og «et av fjellene, som jeg skal si dig»; jødisk tradisjon fra minst Krønikeskriverens tid har plassert det på tempelhøyden i Jerusalem, der kartpunktet står, markert som omstridt. Abraham dro tilbake til Beer-Sjeba etterpå, omtrent 70 km mot sørvest i luftlinje, og antas vanligvis å ha startet derfra; «På den tredje dag, da Abraham så sig omkring, fikk han øie på stedet langt borte», et tempo som passer for Judas høyland."
    - "Koblingen til Jerusalem gjøres i Krønikebøkene: «Så begynte Salomo å bygge Herrens hus i Jerusalem, på Moriafjellet, der hvor Herren hadde åpenbaret sig for hans far David, på den plass hvor David hadde samlet forråd, på jebusitten Ornans treskeplass.» Jubileenes bok kaller Abrahams fjell Sionfjellet, og Josefus sier uttrykkelig at det var høyden der David senere bygget tempelet. Jødisk tradisjon fester stedet til klippen som nå står under Klippedomen; Koranen forteller også om Abrahams sønn, selv om sønnen der er uten navn og senere muslimsk tradisjon for det meste gjør ham til Ismael."
    - "Samaritanerne leser navnet annerledes og hevder Garisim ved Sikem, deres eget hellige fjell, og den samaritanske Pentateuk leses ofte som «More land», der Mores terebintlund ved Sikem var Abrahams første rast i Kanaan. Den syriske bibelen har «amorittenes land», og Septuaginta-oversetterne ga opp navnet og skrev «det høye land». Ingen arkeologi kan avgjøre det; navnet Moria forekommer ingen andre steder enn i disse to versene."
  tl:
    - "Sinasabi lamang ng Genesis ang “lupain ng Moria” at “isa sa mga bundok na aking sasabihin sa iyo”; inilagay ito ng tradisyong Judio, mula man lamang sa panahon ng Cronista, sa burol ng Templo sa Jerusalem, kung saan nakatayo ang tuldok sa mapa, na minarkahang pinagtatalunan. Bumalik pagkatapos si Abraham sa Beer-seba, mga 70 km sa timog-kanluran sa tuwid na guhit, at karaniwang inaakalang doon siya nagsimula; “nang ikatlong araw ay itiningin ni Abraham ang kaniyang mga mata at natanaw niya ang dakong yaon sa malayo”, bilis na angkop sa kabundukan ng Juda."
    - "Ginawa ang ugnayan sa Jerusalem sa Mga Cronica: “Nang magkagayo'y pinasimulan ni Salomon na itayo ang bahay ng Panginoon, sa Jerusalem sa bundok ng Moria, na pinagkakitaan ng Panginoon kay David na kaniyang ama, sa dakong kaniyang pinaghandaan na pinagtakdaan ni David sa giikan ni Ornan na Jebuseo.” Tinatawag ng Aklat ng mga Jubileo na Bundok Sion ang bundok ni Abraham, at tahasang sinasabi ni Josephus na ito ang burol kung saan itinayo ni David kalaunan ang Templo. Itinatakda ng tradisyong Judio ang lugar sa batong nasa ilalim ngayon ng Simboryo ng Bato; isinasalaysay din ng Quran ang kuwento ng anak ni Abraham, bagaman hindi pinangalanan doon ang anak at ginagawa siyang Ismael ng karamihan ng huling tradisyong Muslim."
    - "Iba ang pagbasa ng mga Samaritano sa pangalan at inaangkin ang Bundok Gerizim sa itaas ng Sichem, ang sarili nilang banal na bundok, at madalas basahin ang Samaritanong Pentateuko bilang “lupain ng Moreh”, ang ensina ng Moreh sa Sichem ang unang hinto ni Abraham sa Canaan. May “lupain ng mga Amorrheo” ang Biblia sa Syriac, at sumuko ang mga tagasalin ng Septuagint sa pangalan at isinulat ang “mataas na lupain”. Walang arkeolohiyang makalulutas dito; walang ibang lugar na lumilitaw ang pangalang Moria kundi sa dalawang talatang ito."
  da:
    - "Første Mosebog siger blot »Moria Land« og »et af Bjergene, som jeg vil sige dig«; jødisk tradition har siden mindst Krønikeskriverens tid placeret det på Tempelbjerget i Jerusalem, hvor kortets punkt står, markeret som omstridt. Abraham vendte bagefter tilbage til Beersheba, omkring 70 km mod sydvest i luftlinje, og menes sædvanligvis at være draget ud derfra; »Paa den tredje Dag, da opløftede Abraham sine Øjne og saa Stedet langt borte«, et tempo, der passer til Judas bjergland."
    - "Forbindelsen til Jerusalem skabes i Krønikebøgerne: »Og Salomo begyndte at bygge Herrens Hus i Jerusalem paa Moria Bjerg, hvor han havde aabenbaret sig for David, hans Fader, paa det Sted, som David havde beredt paa Ornans, Jebusitens, Tærskeplads.« Jubilæernes Bog kalder Abrahams bjerg Zions bjerg, og Josefus siger tydeligt, at det var den høj, hvorpå David senere byggede Templet. Jødisk tradition fastlægger stedet ved klippen, som nu ligger under Klippedomen; Koranen fortæller også historien om Abrahams søn, men dér er sønnen unavngiven, og senere muslimsk tradition gør ham for det meste til Ismael."
    - "Samaritanerne læser navnet anderledes og gør krav på Garizim over Sikem, deres eget hellige bjerg, og den samaritanske Pentateuk læses ofte som »Mores land«, idet Mores eg ved Sikem var Abrahams første holdested i Kana'an. Den syriske bibel har »amoritternes land«, og Septuaginta-oversætterne opgav navnet og skrev »det høje land«. Ingen arkæologi kan afgøre det; navnet Morija forekommer ingen andre steder end i disse to vers."
