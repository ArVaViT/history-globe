id: where-did-moses-die
question:
  en: "Where did Moses die?"
  ru: "Где умер Моисей?"
  uk: "Де помер Мойсей?"
  es: "¿Dónde murió Moisés?"
  pt: "Onde morreu Moisés?"
  de: "Wo starb Mose?"
  fr: "Où Moïse est-il mort ?"
  pl: "Gdzie umarł Mojżesz?"
  it: "Dove morì Mosè?"
  nl: "Waar stierf Mozes?"
  cs: "Kde zemřel Mojžíš?"
  sv: "Var dog Mose?"
  nb: "Hvor døde Moses?"
  tl: "Saan namatay si Moises?"
answer:
  en:
    - "On Mount Nebo in the land of Moab, east of the Jordan, opposite Jericho. The traditional summit is Siyagha, about 700 m high, in today's Jordan about 9 km north-west of Madaba; it lies about 29 km east of Jericho and 46 km from Jerusalem in a straight line, and the northern end of the Dead Sea is about 15 km to the west, more than a kilometre below. The map puts Mount Nebo and the top of Pisgah at this point; a second peak, Khirbet al-Mukhayyat, 3 km to the south-east, is usually taken for the town of Nebo of Numbers and of the Mesha Stele. Where Moses was buried is a different question, and the Bible says that no one knows."
    - "Deuteronomy tells it in a few lines: “And Moses went up from the plains of Moab unto the mountain of Nebo, to the top of Pisgah, that is over against Jericho. And the LORD shewed him all the land of Gilead, unto Dan”; “So Moses the servant of the LORD died there in the land of Moab, according to the word of the LORD. And he buried him in a valley in the land of Moab, over against Beth-peor: but no man knoweth of his sepulchre unto this day.” God had told him: “Get thee up into this mountain Abarim, unto mount Nebo, which is in the land of Moab, that is over against Jericho; and behold the land of Canaan”. Beth-peor is placed on the map at Khirbet Ayun Musa, the springs of Moses in the valley north-east of the summit. From Siyagha one sees the Jordan valley, Jericho, the Dead Sea and the hills of Judah, though not the Mediterranean that Deuteronomy names."
    - "Josephus says that a cloud came over Moses as he spoke with Eleazar and Joshua, and he vanished from sight, lest anyone should say that he had gone to God. The pilgrim Egeria climbed Nebo in the early 380s and was shown the place by the monks who lived there; a church of the fourth century grew into a Byzantine basilica with mosaic floors, one of them dated 530/531. The Franciscans excavated the site from 1933 under Sylvester Saller, and Michele Piccirillo continued the work; the Franciscan Custody of the Holy Land keeps the Memorial of Moses there today; Pope John Paul II prayed there in March 2000, and the basilica, restored under a new roof, reopened in 2016. In 2 Maccabees, Mount Nebo is the mountain where Jeremiah hid the ark."
  ru:
    - "На горе Нево в земле Моавитской, к востоку от Иордана, напротив Иерихона. Традиционная вершина — Сияга, высотой около 700 м, в нынешней Иордании примерно в 9 км к северо-западу от Мадабы; она лежит примерно в 29 км к востоку от Иерихона и в 46 км от Иерусалима по прямой, а северный край Мёртвого моря — в 15 км к западу, больше чем на километр ниже. Карта ставит гору Нево и вершину Фасги в этой точке; вторая вершина, Хирбет-эль-Мухайят в 3 км к юго-востоку, обычно считается городом Нево из книги Чисел и стелы Меши. Где Моисей погребён — другой вопрос, и Библия говорит, что этого не знает никто."
    - "Второзаконие рассказывает это в нескольких строках: «И взошел Моисей с равнин Моавитских на гору Нево, на вершину Фасги, что против Иерихона, и показал ему Господь всю землю Галаад до самого Дана»; «И умер там Моисей, раб Господень, в земле Моавитской, по слову Господню; и погребен на долине в земле Моавитской против Беф-Фегора, и никто не знает места погребения его даже до сего дня». Бог сказал ему: «взойди на сию гору Аварим, на гору Нево, которая в земле Моавитской, против Иерихона, и посмотри на землю Ханаанскую». Беф-Фегор карта помещает в Хирбет-Аюн-Муса — у источников Моисея в долине к северо-востоку от вершины. С Сияги видны долина Иордана, Иерихон, Мёртвое море и горы Иудеи, но не Средиземное море, которое называет Второзаконие."
    - "Иосиф Флавий пишет, что, пока Моисей говорил с Елеазаром и Иисусом Навином, его окутало облако, и он скрылся из глаз, — чтобы никто не сказал, будто он ушёл к Богу. Паломница Эгерия поднялась на Нево в начале 380-х годов, и жившие там монахи показали ей это место; церковь IV века выросла в византийскую базилику с мозаичными полами, один из них датирован 530/531 годом. Францисканцы раскапывали место с 1933 года под началом Сильвестра Саллера, работу продолжил Микеле Пиччирилло; сегодня здесь стоит Мемориал Моисея, которым ведает францисканская Кустодия Святой Земли; в марте 2000 года здесь молился папа Иоанн Павел II, а базилика под новой кровлей после реставрации вновь открылась в 2016 году. Во Второй книге Маккавейской гора Нево названа местом, где Иеремия спрятал ковчег."
  uk:
    - "На горі Нево в землі Моав, на схід від Йордану, навпроти Єрихону. Традиційна вершина — Сіяга, заввишки близько 700 м, у нинішній Йорданії приблизно за 9 км на північний захід від Мадаби; вона лежить приблизно за 29 км на схід від Єрихону і за 46 км від Єрусалиму по прямій, а північний кінець Мертвого моря — приблизно за 15 км на захід, понад кілометр нижче. Мапа ставить гору Нево і верх Фасги в цю точку; другу вершину, Хірбет-ель-Мухайят, за 3 км на південний схід, зазвичай вважають містом Нево з Книги Чисел і зі стели Меші. Де похований Мойсей — інше питання, і Біблія каже, що ніхто не знає."
    - "Повторення Закону розповідає це кількома рядками: «І зійшов Мойсей з Моабового поділля на Небо гору, на верх Пизги, що проти Єрихону. І показав йому Господь усю Гілеад землю до Дану»; «І вмер там Мойсей, Господень раб, у Моаб землї, по слову Господньому. І він поховав його в долинї, в Моаб землї, проти Бет-Пеору; і по сей день нїхто не знає гробища його». Бог сказав йому: «Вийди на сї гори Абарим, на гору Небо, що в землї Моабській, проти Єрихону, і подивись на Канаан землю». Бет-Пеор мапа ставить у Хірбет-Айюн-Муса, джерелах Мойсея в долині на північний схід від вершини. З Сіяги видно Йорданську долину, Єрихон, Мертве море і пагорби Юдеї, хоч не Середземне море, яке називає Повторення Закону."
    - "Йосиф Флавій каже, що хмара покрила Мойсея, коли він розмовляв з Елеазаром та Ісусом Навином, і він зник з очей, щоб ніхто не сказав, що він пішов до Бога. Прочанка Егерія піднялася на Нево на початку 380-х рр. і їй показали це місце ченці, які там жили; церква IV ст. виросла у візантійську базиліку з мозаїчними підлогами, одна з яких датована 530/531 р. Францисканці розкопували місце від 1933 р. під проводом Сильвестра Саллера, і Мікеле Пікчірілло продовжив працю; францисканська Кустодія Святої Землі зберігає там Меморіал Мойсея; папа Іван Павло II молився там у березні 2000 р., а базиліку, відновлену під новим дахом, відкрито знову 2016 р. У 2 Макавеїв гора Нево — це гора, де Єремія сховав ковчег."
  es:
    - "En el monte Nebo, en la tierra de Moab, al este del Jordán, frente a Jericó. La cumbre tradicional es Siyagha, de unos 700 m de altura, en la actual Jordania, a unos 9 km al noroeste de Madaba; queda a unos 29 km al este de Jericó y a 46 km de Jerusalén en línea recta, y el extremo norte del mar Muerto está a unos 15 km al oeste, más de un kilómetro por debajo. El mapa sitúa en este punto el monte Nebo y la cima de Pisga; una segunda cumbre, Khirbet al-Mukhayyat, a 3 km al sureste, suele tomarse por la ciudad de Nebo de Números y de la estela de Mesa. Dónde fue sepultado Moisés es otra cuestión, y la Biblia dice que nadie lo sabe."
    - "Deuteronomio lo cuenta en pocas líneas: «Y subió Moisés de los campos de Moab al monte de Nebo, á la cumbre de Pisga, que está enfrente de Jericó: y mostróle Jehová toda la tierra de Galaad hasta Dan»; «Y murió allí Moisés siervo de Jehová, en la tierra de Moab, conforme al dicho de Jehová. Y enterrólo en el valle, en tierra de Moab, enfrente de Bethpeor; y ninguno sabe su sepulcro hasta hoy». Dios le había dicho: «Sube á este monte de Abarim, al monte Nebo, que está en la tierra de Moab, que está en derecho de Jericó, y mira la tierra de Canaán». Bet-peor se sitúa en el mapa en Khirbet Ayun Musa, las fuentes de Moisés, en el valle al noreste de la cumbre. Desde Siyagha se ven el valle del Jordán, Jericó, el mar Muerto y las colinas de Judá, pero no el Mediterráneo que nombra Deuteronomio."
    - "Josefo dice que una nube cubrió a Moisés mientras hablaba con Eleazar y Josué, y desapareció de la vista, para que nadie dijera que se había ido a Dios. La peregrina Egeria subió al Nebo a comienzos de los años 380 y los monjes que vivían allí le mostraron el lugar; una iglesia del siglo IV se convirtió en una basílica bizantina con suelos de mosaico, uno de ellos fechado en 530/531. Los franciscanos excavaron el sitio desde 1933 bajo Sylvester Saller, y Michele Piccirillo continuó la obra; la Custodia Franciscana de Tierra Santa conserva allí hoy el Memorial de Moisés; el papa Juan Pablo II oró allí en marzo de 2000, y la basílica, restaurada bajo un techo nuevo, reabrió en 2016. En 2 Macabeos, el monte Nebo es el monte donde Jeremías escondió el arca."
  pt:
    - "No monte Nebo, na terra de Moabe, a leste do Jordão, em frente a Jericó. O cume tradicional é Siyagha, com cerca de 700 m, na Jordânia de hoje, a cerca de 9 km a noroeste de Madaba; fica a cerca de 29 km a leste de Jericó e a 46 km de Jerusalém em linha reta, e a ponta norte do mar Morto está a cerca de 15 km a oeste, mais de um quilômetro abaixo. O mapa põe o monte Nebo e o topo de Pisga neste ponto; um segundo pico, Khirbet al-Mukhayyat, a 3 km a sudeste, costuma ser tomado pela cidade de Nebo de Números e da Estela de Mesa. Onde Moisés foi sepultado é outra questão, e a Bíblia diz que ninguém sabe."
    - "Deuteronômio conta em poucas linhas: “Moisés subiu das campinas de Moabe ao monte Nebo, ao topo de Pisga, que fica em frente a Jericó. O SENHOR lhe mostrou toda a terra de Gileade até Dã”; “Assim Moisés, o servo do SENHOR, morreu ali na terra de Moabe, de acordo com a palavra do SENHOR. Ele o sepultou no vale, na terra de Moabe, em frente a Bete-Peor, mas ninguém sabe onde fica o seu túmulo até o dia de hoje.” Deus lhe dissera: “Suba a esta montanha de Abarim, ao Monte Nebo, que está na terra de Moabe, em frente a Jericó; e veja a terra de Canaã”. Bete-Peor é situada no mapa em Khirbet Ayun Musa, as fontes de Moisés no vale a nordeste do cume. De Siyagha se vê o vale do Jordão, Jericó, o mar Morto e os montes de Judá, mas não o Mediterrâneo que Deuteronômio menciona."
    - "Josefo diz que uma nuvem cobriu Moisés enquanto falava com Eleazar e Josué, e ele desapareceu da vista, para que ninguém dissesse que fora para Deus. A peregrina Egéria subiu o Nebo no início dos anos 380 e os monges que ali viviam lhe mostraram o lugar; uma igreja do século IV cresceu até virar uma basílica bizantina com pisos de mosaico, um deles datado de 530/531. Os franciscanos escavaram o sítio desde 1933 sob Silvestre Saller, e Michele Piccirillo continuou o trabalho; a Custódia Franciscana da Terra Santa mantém ali hoje o Memorial de Moisés; o papa João Paulo II orou ali em março de 2000, e a basílica, restaurada sob novo teto, foi reaberta em 2016. Em 2 Macabeus, o monte Nebo é a montanha onde Jeremias escondeu a arca."
  de:
    - "Auf dem Berg Nebo im Land Moab, östlich des Jordan, gegenüber von Jericho. Der überlieferte Gipfel ist Sijagha, etwa 700 m hoch, im heutigen Jordanien etwa 9 km nordwestlich von Madaba; er liegt in der Luftlinie etwa 29 km östlich von Jericho und 46 km von Jerusalem, und das Nordende des Toten Meeres ist etwa 15 km westlich, mehr als einen Kilometer tiefer. Die Karte setzt Berg Nebo und den Gipfel des Pisga an diesen Punkt; ein zweiter Gipfel, Chirbet al-Mukhayyat, 3 km südöstlich, gilt meist als die Stadt Nebo des 4. Buches Mose und der Mesa-Stele. Wo Mose begraben wurde, ist eine andere Frage, und die Bibel sagt, dass es niemand weiß."
    - "Das 5. Buch Mose erzählt es in wenigen Zeilen: „Und Mose ging von dem Gefilde der Moabiter auf den Berg Nebo, auf die Spitze des Gebirges Pisga, gegenüber Jericho. Und der HERR zeigte ihm das ganze Land Gilead bis gen Dan“; „Also starb Mose, der Knecht des HERRN, daselbst im Lande der Moabiter nach dem Wort des HERRN. Und er begrub ihn im Tal im Lande der Moabiter gegenüber Beth-Peor. Und niemand hat sein Grab erfahren bis auf diesen heutigen Tag.“ Gott hatte ihm gesagt: „Gehe auf das Gebirge Abarim, auf den Berg Nebo, der da liegt im Moabiterland, gegenüber Jericho, und schaue das Land Kanaan“. Bet-Peor setzt die Karte bei Chirbet Ajun Musa an, den Mosequellen im Tal nordöstlich des Gipfels. Von Sijagha sieht man das Jordantal, Jericho, das Tote Meer und die Berge Judas, nicht aber das Mittelmeer, das das 5. Buch Mose nennt."
    - "Josephus sagt, eine Wolke habe sich über Mose gesenkt, als er mit Eleasar und Josua sprach, und er sei den Blicken entschwunden, damit niemand sage, er sei zu Gott gegangen. Die Pilgerin Egeria bestieg den Nebo Anfang der 380er Jahre und wurde von den dort lebenden Mönchen zur Stelle geführt; eine Kirche des 4. Jahrhunderts wuchs zu einer byzantinischen Basilika mit Mosaikböden, einer davon auf 530/531 datiert. Die Franziskaner gruben die Stätte ab 1933 unter Sylvester Saller aus, Michele Piccirillo setzte die Arbeit fort; die Kustodie des Heiligen Landes unterhält dort heute die Gedenkstätte des Mose; Papst Johannes Paul II. betete dort im März 2000, und die Basilika, unter neuem Dach restauriert, wurde 2016 wiedereröffnet. Im 2. Makkabäerbuch ist der Berg Nebo der Berg, wo Jeremia die Lade verbarg."
  fr:
    - "Sur le mont Nebo, au pays de Moab, à l’est du Jourdain, en face de Jéricho. Le sommet traditionnel est Siyagha, haut d’environ 700 m, dans la Jordanie actuelle, à environ 9 km au nord-ouest de Madaba ; il se trouve à environ 29 km à l’est de Jéricho et à 46 km de Jérusalem en ligne droite, et l’extrémité nord de la mer Morte est à environ 15 km à l’ouest, plus d’un kilomètre plus bas. La carte met le mont Nebo et le sommet du Pisga à ce point ; un second sommet, Khirbet al-Mukhayyat, à 3 km au sud-est, est d’ordinaire tenu pour la ville de Nebo des Nombres et de la stèle de Mescha. Où Moïse fut enterré est une autre question, et la Bible dit que nul ne le sait."
    - "Le Deutéronome le raconte en quelques lignes : « Moïse monta des plaines de Moab sur le mont Nebo, au sommet du Pisga, vis-à-vis de Jéricho. Et l’Éternel lui fit voir tout le pays : Galaad jusqu’à Dan » ; « Moïse, serviteur de l’Éternel, mourut là, dans le pays de Moab, selon l’ordre de l’Éternel. Et l’Éternel l’enterra dans la vallée, au pays de Moab, vis-à-vis de Beth-Peor. Personne n’a connu son sépulcre jusqu’à ce jour. » Dieu lui avait dit : « Monte sur cette montagne d’Abarim, sur le mont Nebo, au pays de Moab, vis-à-vis de Jéricho ; et regarde le pays de Canaan ». Beth-Peor est placée sur la carte à Khirbet Ayun Musa, les sources de Moïse dans la vallée au nord-est du sommet. De Siyagha on voit la vallée du Jourdain, Jéricho, la mer Morte et les collines de Juda, mais non la Méditerranée que nomme le Deutéronome."
    - "Josèphe dit qu’une nuée enveloppa Moïse tandis qu’il parlait avec Éléazar et Josué, et qu’il disparut à la vue, de peur qu’on ne dise qu’il était allé à Dieu. La pèlerine Égérie gravit le Nebo au début des années 380 et se fit montrer le lieu par les moines qui y vivaient ; une église du IVe siècle devint une basilique byzantine aux sols en mosaïque, dont l’un est daté de 530/531. Les franciscains fouillèrent le site à partir de 1933 sous Sylvester Saller, et Michele Piccirillo poursuivit l’œuvre ; la Custodie franciscaine de Terre sainte y garde aujourd’hui le Mémorial de Moïse ; le pape Jean-Paul II y pria en mars 2000, et la basilique, restaurée sous un nouveau toit, rouvrit en 2016. Dans 2 Maccabées, le mont Nebo est la montagne où Jérémie cacha l’arche."
  pl:
    - "Na górze Nebo w ziemi Moabu, na wschód od Jordanu, naprzeciw Jerycha. Tradycyjnym szczytem jest Sijaga, wysoka na około 700 m, w dzisiejszej Jordanii około 9 km na północny zachód od Madaby; leży około 29 km na wschód od Jerycha i 46 km od Jerozolimy w linii prostej, a północny kraniec Morza Martwego jest około 15 km na zachód, ponad kilometr niżej. Mapa umieszcza Górę Nebo i szczyt Pisgi w tym punkcie; drugi szczyt, Chirbet al-Mukajjat, 3 km na południowy wschód, uważa się zwykle za miasto Nebo z Księgi Liczb i ze Steli Meszy. Gdzie pochowano Mojżesza, to inne pytanie, a Biblia mówi, że nikt tego nie wie."
    - "Księga Powtórzonego Prawa opowiada to w kilku wierszach: „Tedy wstąpił Mojżesz z onych równin Moabskich na górę Nebo, na wierzch pagórka, który jest na przeciwko Jerychu; a ukazał mu Pan wszystkę ziemię od Galaad aż do Dan”; „I umarł tam Mojżesz, sługa Pański, w ziemi Moabskiej, według słowa Pańskiego. I pogrzebł go Pan w dolinie w ziemi Moabskiej, przeciw Betfegorowi, a nie dowiedział się nikt o grobie jego aż do dnia tego.” Bóg powiedział mu: „Wstąp na tę górę Abarym, na górę Nebo, która jest w ziemi Moabskiej przeciw Jerychu, a oglądaj ziemię Chananejską”. Bet-Peor umieszcza mapa w Chirbet Ajun Musa, przy źródłach Mojżesza w dolinie na północny wschód od szczytu. Z Sijagi widać dolinę Jordanu, Jerycho, Morze Martwe i wzgórza Judy, choć nie Morze Śródziemne, które wymienia Księga Powtórzonego Prawa."
    - "Józef Flawiusz mówi, że obłok okrył Mojżesza, gdy rozmawiał z Eleazarem i Jozuem, i zniknął z oczu, by nikt nie mówił, że poszedł do Boga. Pątniczka Egeria wspięła się na Nebo na początku lat 80. IV wieku i mnisi, którzy tam mieszkali, pokazali jej to miejsce; kościół z IV wieku przerodził się w bizantyjską bazylikę z posadzkami mozaikowymi, z których jedna jest datowana na 530/531. Franciszkanie wykopywali stanowisko od 1933 pod kierunkiem Sylwestra Sallera, a pracę kontynuował Michele Piccirillo; Kustodia Ziemi Świętej strzeże tam dziś Pomnika Mojżesza; papież Jan Paweł II modlił się tam w marcu 2000, a bazylika, odnowiona pod nowym dachem, została ponownie otwarta w 2016. W 2 Księdze Machabejskiej Góra Nebo jest górą, na której Jeremiasz ukrył arkę."
  it:
    - "Sul Monte Nebo nel paese di Moab, a est del Giordano, di fronte a Gerico. La cima tradizionale è Siyagha, alta circa 700 m, nell’odierna Giordania a circa 9 km a nord-ovest di Madaba; dista circa 29 km a est di Gerico e 46 km da Gerusalemme in linea retta, e l’estremità settentrionale del Mar Morto è a circa 15 km a ovest, più di un chilometro più in basso. La mappa pone qui il Monte Nebo e la cima del Pisga; una seconda vetta, Khirbet al-Mukhayyat, a 3 km a sud-est, è di solito ritenuta la città di Nebo dei Numeri e della Stele di Mesa. Dove Mosè fu sepolto è un’altra questione, e la Bibbia dice che nessuno lo sa."
    - "Il Deuteronomio lo racconta in poche righe: «Poi Mosè salì dalle pianure di Moab sul Monte Nebo, in vetta al Pisga, che è difaccia a Gerico. E l’Eterno gli fece vedere tutto il paese: Galaad fino a Dan»; «Mosè, servo dell’Eterno, morì quivi, nel paese di Moab, come l’Eterno avea comandato. E l’Eterno lo seppellì nella valle, nel paese di Moab, dirimpetto a Beth-Peor; e nessuno fino a questo giorno ha mai saputo dove fosse la sua tomba». Dio gli aveva detto: «Sali su questo monte di Abarim, sul monte Nebo, ch’è nel paese di Moab, di faccia a Gerico, e mira il paese di Canaan». Bet-Peor è posta sulla mappa a Khirbet Ayun Musa, le sorgenti di Mosè nella valle a nord-est della vetta. Da Siyagha si vedono la valle del Giordano, Gerico, il Mar Morto e le colline di Giuda, ma non il Mediterraneo che nomina il Deuteronomio."
    - "Giuseppe Flavio dice che una nube venne su Mosè mentre parlava con Eleazaro e Giosuè, ed egli scomparve alla vista, perché nessuno dicesse che era andato a Dio. La pellegrina Egeria salì il Nebo all’inizio degli anni 380 e le fu mostrato il luogo dai monaci che vi vivevano; una chiesa del IV secolo divenne una basilica bizantina con pavimenti a mosaico, uno datato 530/531. I Francescani scavarono il sito dal 1933 sotto Sylvester Saller, e Michele Piccirillo continuò il lavoro; la Custodia francescana di Terra Santa vi conserva oggi il Memoriale di Mosè; papa Giovanni Paolo II vi pregò nel marzo 2000, e la basilica, restaurata sotto un nuovo tetto, riaprì nel 2016. In 2 Maccabei il Monte Nebo è il monte dove Geremia nascose l’arca."
  nl:
    - "Op de berg Nebo in het land Moab, ten oosten van de Jordaan, tegenover Jericho. De traditionele top is Siyagha, ongeveer 700 m hoog, in het huidige Jordanië ongeveer 9 km ten noordwesten van Madaba; hij ligt hemelsbreed ongeveer 29 km ten oosten van Jericho en 46 km van Jeruzalem, en het noordeinde van de Dode Zee ligt ongeveer 15 km naar het westen, ruim een kilometer lager. De kaart plaatst de berg Nebo en de top van Pisga op dit punt; een tweede top, Khirbet al-Mukhayyat, 3 km naar het zuidoosten, geldt gewoonlijk als de stad Nebo van Numeri en van de Mesa-stèle. Waar Mozes werd begraven is een andere vraag, en de Bijbel zegt dat niemand het weet."
    - "Deuteronomium vertelt het in enkele regels: “Toen ging Mozes op uit de vlakke velden van Moab, naar den berg Nebo, op de hoogten van Pisga, welke recht tegenover Jericho is; en de HEERE wees hem dat ganse land, Gilead tot Dan toe”; “Alzo stierf Mozes, de knecht des HEEREN, aldaar in het land van Moab, naar des HEEREN mond. En Hij begroef hem in een dal, in het land van Moab, tegenover Beth-Peor; en niemand heeft zijn graf geweten, tot op dezen dag.” God had hem gezegd: “Klim op den berg Abarim (deze is de berg Nebo, die in het land van Moab is, die tegenover Jericho is), en zie het land Kanaan”. Beth-Peor wordt op de kaart geplaatst bij Khirbet Ayun Musa, de bronnen van Mozes in het dal ten noordoosten van de top. Vanaf Siyagha ziet men de Jordaanvallei, Jericho, de Dode Zee en de heuvels van Juda, maar niet de Middellandse Zee die Deuteronomium noemt."
    - "Josephus zegt dat een wolk over Mozes kwam terwijl hij sprak met Eleazar en Jozua, en hij uit het zicht verdween, opdat niemand zou zeggen dat hij naar God was gegaan. De pelgrim Egeria beklom de Nebo in de vroege jaren 380 en kreeg de plek getoond door de monniken die er woonden; een kerk uit de vierde eeuw groeide uit tot een Byzantijnse basiliek met mozaïekvloeren, waarvan één gedateerd is 530/531. De franciscanen groeven de plek op vanaf 1933 onder Sylvester Saller, en Michele Piccirillo zette het werk voort; de Franciscaanse Custodie van het Heilige Land beheert er nu het Gedenkteken van Mozes; paus Johannes Paulus II bad er in maart 2000, en de basiliek, hersteld onder een nieuw dak, heropende in 2016. In 2 Makkabeeën is de berg Nebo de berg waar Jeremia de ark verborg."
  cs:
    - "Na hoře Nebo v zemi Moáb, východně od Jordánu, naproti Jerichu. Tradiční vrchol je Sijágha, vysoký asi 700 m, v dnešním Jordánsku asi 9 km severozápadně od Madaby; leží asi 29 km východně od Jericha a 46 km od Jeruzaléma vzdušnou čarou a severní konec Mrtvého moře je asi 15 km na západě, o více než kilometr níže. Mapa klade horu Nebo a vrchol Pisgy na toto místo; druhý vrchol, Chirbet al-Mucchajját, 3 km jihovýchodně, se obvykle pokládá za město Nebo z Knihy Čísel a z Mešovy stély. Kde byl Mojžíš pohřben, je jiná otázka a Bible říká, že to nikdo neví."
    - "Deuteronomium to vypráví několika řádky: „Tedy vstoupil Mojžíš z rovin Moábských na horu Nébo, na vrch hory, kteráž jest proti Jerichu, a ukázal jemu Hospodin všecku zemi Galád až do Dan“; „I umřel tam Mojžíš, služebník Hospodinův, v zemi Moábské, vedlé řeči Hospodinovy. A pochoval jej v Gai, v zemi Moábské naproti Betfegor, a žádný nezvěděl o jeho hrobu až do tohoto dne.“ Bůh mu řekl: „Vstup na horu tuto Abarim, na vrch Nébo, kteráž jest v zemi Moábské naproti Jerichu, a spatř zemi Kananejskou“. Bét-peór je na mapě umístěn v Chirbet Ajún Músá, u pramenů Mojžíšových v údolí severovýchodně od vrcholu. Ze Sijághy je vidět Jordánské údolí, Jericho, Mrtvé moře a judské hory, ač ne Středozemní moře, které Deuteronomium jmenuje."
    - "Josephus Flavius praví, že se nad Mojžíšem, když mluvil s Eleazarem a Jozuem, objevil oblak a Mojžíš zmizel z očí, aby nikdo neřekl, že odešel k Bohu. Poutnice Egerie vystoupila na Nebo na počátku 380. let a mniši, kteří tam žili, jí místo ukázali; kostel ze 4. století vyrostl v byzantskou baziliku s mozaikovými podlahami, z nichž jedna je datována 530/531. Františkáni místo zkoumali od roku 1933 pod vedením Sylvestra Sallera a Michele Piccirillo v práci pokračoval; františkánská Kustodie Svaté země tam dnes uchovává Památník Mojžíšův; papež Jan Pavel II. se tam modlil v březnu 2000 a bazilika, obnovená pod novou střechou, byla znovu otevřena roku 2016. Ve 2. knize Makabejské je hora Nebo horou, kde Jeremjáš ukryl truhlu."
  sv:
    - "På berget Nebo i Moabs land, öster om Jordan, mitt emot Jeriko. Den traditionella toppen är Siyagha, omkring 700 m hög, i dagens Jordanien omkring 9 km nordväst om Madaba; den ligger omkring 29 km öster om Jeriko och 46 km från Jerusalem fågelvägen, och Döda havets norra ände ligger omkring 15 km åt väster, mer än en kilometer lägre. Kartan placerar berget Nebo och toppen av Pisga vid denna punkt; en andra topp, Khirbet al-Mukhayyat, 3 km åt sydost, anses vanligen vara staden Nebo i 4 Mosebok och på Mesastelen. Var Mose begravdes är en annan fråga, och Bibeln säger att ingen vet det."
    - "5 Mosebok berättar det i några rader: ”Och Mose gick från Moabs hedar upp på berget Nebo, på toppen av Pisga, gent emot Jeriko. Och HERREN lät honom se hela landet: Gilead ända till Dan”; ”Och HERRENS tjänare Mose dog där i Moabs land, såsom HERREN hade sagt. Och han begrov honom i dalen i Moabs land, mitt emot Bet-Peor; men ännu intill denna dag har ingen fått veta var hans grav är.” Gud hade sagt till honom: ”Stig upp här på Abarimberget, på berget Nebo i Moabs land, gent emot Jeriko, så skall du få se Kanaans land”. Bet-Peor placeras på kartan vid Khirbet Ayun Musa, Moses källor i dalen nordost om toppen. Från Siyagha ser man Jordandalen, Jeriko, Döda havet och Judas berg, men inte Medelhavet som 5 Mosebok nämner."
    - "Josefus säger att ett moln kom över Mose medan han talade med Eleasar och Josua, och han försvann ur sikte, för att ingen skulle kunna säga att han hade gått till Gud. Pilgrimen Egeria besteg Nebo i början av 380-talet och fick platsen visad av munkarna som bodde där; en kyrka från 300-talet växte till en bysantinsk basilika med mosaikgolv, ett av dem daterat 530/531. Franciskanerna grävde ut platsen från 1933 under Sylvester Saller, och Michele Piccirillo fortsatte arbetet; Franciskanernas Heliga landets kustodi förvaltar där i dag Moses minnesmärke; påve Johannes Paulus II bad där i mars 2000, och basilikan, restaurerad under ett nytt tak, öppnade på nytt 2016. I 2 Mackabeerboken är berget Nebo berget där Jeremia gömde arken."
  nb:
    - "På Nebo-fjellet i Moabs land, øst for Jordan, midt imot Jeriko. Den tradisjonelle toppen er Siyagha, omtrent 700 m høy, i dagens Jordan omtrent 9 km nordvest for Madaba; den ligger omtrent 29 km øst for Jeriko og 46 km fra Jerusalem i luftlinje, og den nordlige enden av Dødehavet ligger omtrent 15 km mot vest, mer enn en kilometer lavere. Kartet plasserer Nebo og Pisgas topp på dette punktet; en annen topp, Khirbet al-Mukhayyat, 3 km mot sørøst, regnes vanligvis for byen Nebo i 4 Mosebok og på Mesa-steinen. Hvor Moses ble gravlagt, er et annet spørsmål, og Bibelen sier at ingen vet det."
    - "5 Mosebok forteller det i noen få linjer: «Så gikk Moses fra Moabs ødemarker op på Nebo-fjellet, på Pisgas topp, som ligger midt imot Jeriko; og Herren lot ham se ut over hele landet: Gilead like til Dan»; «Så døde Moses, Herrens tjener, der i Moabs land efter Herrens ord. Og han begravde ham i dalen i Moabs land midt imot Bet-Peor, og ingen kjenner til denne dag hans grav.» Gud hadde sagt til ham: «Gå op på Abarim-fjellet her, på Nebo-fjellet i Moabs land midt imot Jeriko, og se ut over Kana'ans land». Bet-Peor er på kartet plassert ved Khirbet Ayun Musa, Moses' kilder i dalen nordøst for toppen. Fra Siyagha ser man Jordandalen, Jeriko, Dødehavet og Judas åser, men ikke Middelhavet som 5 Mosebok nevner."
    - "Josefus sier at en sky kom over Moses mens han talte med Eleasar og Josva, og han forsvant av syne, for at ingen skulle si at han var gått til Gud. Pilegrimen Egeria besteg Nebo tidlig i 380-årene og ble vist stedet av munkene som bodde der; en kirke fra 300-tallet vokste til en bysantinsk basilika med mosaikkgulv, ett av dem datert 530/531. Fransiskanerne gravde ut stedet fra 1933 under Sylvester Saller, og Michele Piccirillo fortsatte arbeidet; Fransiskanernes Custodia i Det hellige land har Moses-minnesmerket der i dag; pave Johannes Paul II ba der i mars 2000, og basilikaen, restaurert under et nytt tak, åpnet igjen i 2016. I 2 Makkabeerbok er Nebo fjellet der Jeremia skjulte arken."
  tl:
    - "Sa Bundok Nebo sa lupain ng Moab, silangan ng Jordan, sa tapat ng Jerico. Ang tradisyonal na taluktok ay ang Siyagha, mga 700 m ang taas, sa Jordan ngayon mga 9 km sa hilagang-kanluran ng Madaba; ito ay mga 29 km sa silangan ng Jerico at 46 km mula sa Jerusalem sa tuwid na guhit, at ang hilagang dulo ng Dagat na Patay ay mga 15 km sa kanluran, mahigit isang kilometro sa ibaba. Inilalagay ng mapa ang Bundok Nebo at ang tuktok ng Pisga sa puntong ito; ang ikalawang tuktok, ang Khirbet al-Mukhayyat, 3 km sa timog-silangan, ay karaniwang kinukuha para sa bayan ng Nebo ng Mga Bilang at ng Estela ni Mesa. Ibang tanong kung saan inilibing si Moises, at sinasabi ng Biblia na walang nakaaalam."
    - "Sa ilang linya ito sa Deuteronomio: “Sumampa si Moises mula sa mga kapatagan ng Moab sa bundok ng Nebo, sa taluktok ng Pisga, na nasa tapat ng Jerico. At itinuro ng Panginoon ang buong lupain ng Galaad hanggang sa Dan”; “si Moises na lingkod ng Panginoon ay namatay roon sa lupain ng Moab ayon sa salita ng Panginoon. At kaniyang inilibing siya sa libis sa lupain ng Moab na nasa tapat ng Beth-peor; nguni't sinomang tao ay hindi nakaaalam ng libingan niya hanggang sa araw na ito.” Sabi ng Dios: “Sumampa ka sa bundok na ito ng Abarim, sa bundok ng Nebo na nasa lupain ng Moab, na nasa tapat ng Jerico; at masdan mo ang lupain ng Canaan”. Nasa mapa ang Beth-peor sa Khirbet Ayun Musa, mga bukal ni Moises sa libis sa hilagang-silangan ng tuktok. Mula sa Siyagha, nakikita ang libis ng Jordan, Jerico, Dagat na Patay at mga burol ng Juda, ngunit hindi ang Mediteraneo na pinangalanan ng Deuteronomio."
    - "Sinasabi ni Josephus na may ulap na dumating kay Moises habang nakikipag-usap kina Eleazar at Josue, at nawala siya sa paningin, upang walang makapagsabing pumunta siya sa Dios. Inakyat ng peregrinang si Egeria ang Nebo noong maagang dekada 380 at ipinakita sa kaniya ng mga monghe roon ang lugar; ang simbahan noong ikaapat na siglo ay lumaki bilang basilikang Bizantino na may mga sahig na mosaiko, ang isa ay may petsang 530/531. Hinukay ng mga Pransiskano ang pook mula 1933 sa ilalim ni Sylvester Saller, at ipinagpatuloy ni Michele Piccirillo; iniingatan doon ngayon ng Kustodiya ng Pransiskano ng Banal na Lupain ang Alaala ni Moises; nanalangin doon si Papa Juan Pablo II noong Marso 2000, at ang basilika, na naibalik sa ilalim ng bagong bubong, ay muling nagbukas noong 2016. Sa 2 Macabeo, ang Bundok Nebo ang bundok kung saan itinago ni Jeremias ang kaban."
