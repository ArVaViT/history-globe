id: where-was-sardis
question:
  en: "Where was Sardis?"
  ru: "Где находился Сардис?"
  uk: "Де були Сарди?"
  es: "¿Dónde estaba Sardis?"
  pt: "Onde ficava Sardes?"
  de: "Wo lag Sardes?"
  fr: "Où se trouvait Sardes ?"
  pl: "Gdzie leżały Sardes?"
  it: "Dov’era Sardi?"
  cs: "Kde ležely Sardy?"
  nl: "Waar lag Sardes?"
  sv: "Var låg Sardes?"
  nb: "Hvor lå Sardes?"
  tl: "Nasaan ang Sardis?"
  da: "Hvor lå Sardes?"
  sr: "Где је био Сард?"
answer:
  en:
    - "Sardis lay in western Turkey by the village of Sart, in the province of Manisa, where the Pactolus stream comes down from Mount Tmolus into the valley of the Hermus; the map point stands on the site. It was about 44 km from Philadelphia, 51 km from Thyatira and 79 km east of Smyrna in a straight line. A steep citadel rose above the lower city, which had been the royal city of Lydia under Gyges and Croesus and then the seat of a Persian satrap at the western end of the Royal Road to Susa."
    - "Revelation, about AD 95, gives Sardis the fifth of the seven letters, one of the sternest: “I know thy works, that thou hast a name that thou livest, and art dead.” It warns, “If therefore thou shalt not watch, I will come on thee as a thief”, yet a few “have not defiled their garments; and they shall walk with me in white”. Ramsay and Hemer read the warning against the city's past: its citadel, thought impregnable, fell twice by surprise, to Cyrus about 547 BC and to Antiochus III about 214 BC, when soldiers climbed an unguarded cliff. Some also identify Sepharad, where Obadiah places exiles of Jerusalem, with Sardis; others doubt it."
    - "In AD 17 an earthquake struck twelve cities of Asia, Sardis worst of all, and Tiberius remitted its tribute for five years. The Harvard-Cornell excavations, from 1958, uncovered the great bath-gymnasium, part of which the Jews of the late Roman city used as a synagogue over 50 m long, one of the largest known from antiquity, and the temple of Artemis below the citadel. About 170 Melito, bishop of Sardis, wrote his sermon On the Passover."
  ru:
    - "Сардис лежал на западе Турции у деревни Сарт в провинции Маниса, там, где ручей Пактол спускается с горы Тмол в долину Герма; точка карты стоит на этом месте. Отсюда около 44 км до Филадельфии, 51 км до Фиатиры и 79 км на восток от Смирны по прямой. Над нижним городом поднимался крутой акрополь; Сардис был царским городом Лидии при Гигесе и Крезе, а затем резиденцией персидского сатрапа на западном конце Царской дороги в Сузы."
    - "Откровение около 95 г. посылает Сардису пятое из семи посланий — одно из самых суровых: «знаю твои дела; ты носишь имя, будто жив, но ты мертв». Оно предостерегает: «Если же не будешь бодрствовать, то Я найду на тебя, как тать», — и всё же несколько человек «не осквернили одежд своих и будут ходить со Мною в белых одеждах». Рамзей и Хемер толковали предостережение по истории города: его акрополь, считавшийся неприступным, дважды взяли врасплох — Кир около 547 г. до н. э. и Антиох III около 214 г. до н. э., когда воины взобрались по неохраняемому обрыву. Некоторые также отождествляют с Сардисом Сефарад, где, по Авдию, жили пленники из Иерусалима; другие в этом сомневаются."
    - "В 17 г. н. э. землетрясение поразило двенадцать городов Асии, а сильнее всех Сардис, и Тиберий освободил его от податей на пять лет. Раскопки Гарвардского и Корнеллского университетов, начатые в 1958 году, открыли большой комплекс бань и гимнасия, часть которого иудеи позднеримского города превратили в синагогу длиной более 50 м — одну из крупнейших известных в древности, — и храм Артемиды под акрополем. Около 170 г. Мелитон, епископ Сардийский, написал здесь проповедь «О Пасхе»."
  uk:
    - "Сарди лежали на заході Туреччини біля села Сарт, у провінції Маніса, де потік Пактол спускається з гори Тмол у долину Герма; точка на мапі стоїть на цьому місці. Вони були приблизно за 44 км від Філадельфії, за 51 км від Тіатири і за 79 км на схід від Смирни по прямій. Крута цитадель здіймалася над нижнім містом, яке було царським містом Лідії за Гігеса й Креза, а потім осідком перського сатрапа на західному кінці Царської дороги до Суз."
    - "Одкровення, близько 95 р. н. е., дає Сардам п'ятий із семи листів, один із найсуворіших: «Знаю твої дїла, що маєш імя, що живеш, а мертвий єси.» Воно попереджає: «коли ж не чувати меш, прийду на тебе, як злодїй», але декілька осіб «не опоганили одеж своїх; вони ходити муть зо мною у білих». Рамзай і Гемер читають це застереження на тлі минулого міста: його цитадель, яку вважали неприступною, двічі впала несподівано — перед Кіром близько 547 р. до н. е. та перед Антіохом III близько 214 р. до н. е., коли воїни піднялися непильнованою скелею. Дехто також ототожнює Сефарад, куди Овадія поміщає єрусалимських вигнанців, із Сардами; інші сумніваються."
    - "17 р. н. е. землетрус вразив дванадцять міст Азії, найбільше Сарди, і Тиверій на п'ять років скасував їхню данину. Гарвардсько-Корнелльські розкопки від 1958 р. відкрили великий лазневий гімнасій, частину якого юдеї пізньоримського міста використовували як синагогу завдовжки понад 50 м, одну з найбільших відомих з давнини, та храм Артеміди під цитаделлю. Близько 170 р. Мелітон, єпископ Сард, написав свою проповідь «Про Пасху»."
  es:
    - "Sardis se hallaba en el oeste de Turquía, junto a la aldea de Sart, en la provincia de Manisa, donde el arroyo Pactolo baja del monte Tmolo al valle del Hermo; el punto del mapa está sobre el yacimiento. Quedaba a unos 44 km de Filadelfia, a 51 km de Tiatira y a 79 km al este de Esmirna en línea recta. Una empinada ciudadela se alzaba sobre la ciudad baja, que había sido la ciudad real de Lidia bajo Giges y Creso y luego la sede de un sátrapa persa en el extremo occidental del Camino Real a Susa."
    - "El Apocalipsis, hacia el 95 d. C., da a Sardis la quinta de las siete cartas, una de las más severas: «Yo conozco tus obras, que tienes nombre que vives, y estás muerto». Advierte: «Y si no velares, vendré á ti como ladrón», pero unos pocos «no han ensuciado sus vestiduras: y andarán conmigo en vestiduras blancas». Ramsay y Hemer leen la advertencia a la luz del pasado de la ciudad: su ciudadela, tenida por inexpugnable, cayó dos veces por sorpresa, ante Ciro hacia el 547 a. C. y ante Antíoco III hacia el 214 a. C., cuando unos soldados escalaron un risco sin guardia. Algunos identifican también con Sardis a Sefarad, donde Abdías sitúa a desterrados de Jerusalén; otros lo dudan."
    - "En el 17 d. C. un terremoto sacudió doce ciudades de Asia, Sardis la peor de todas, y Tiberio le condonó el tributo durante cinco años. Las excavaciones de Harvard y Cornell, desde 1958, sacaron a la luz el gran baño-gimnasio, parte del cual usaron los judíos de la ciudad del Bajo Imperio como sinagoga de más de 50 m de largo, una de las mayores conocidas de la Antigüedad, y el templo de Artemisa bajo la ciudadela. Hacia el 170, Melitón, obispo de Sardis, escribió su homilía Sobre la Pascua."
  pt:
    - "Sardes ficava no oeste da Turquia, junto à aldeia de Sart, na província de Manisa, onde o riacho Pactolo desce do monte Tmolo para o vale do Hermo; o ponto do mapa fica no sítio. Ficava a cerca de 44 km de Filadélfia, 51 km de Tiatira e 79 km a leste de Esmirna em linha reta. Uma cidadela escarpada se erguia acima da cidade baixa, que fora a cidade real da Lídia sob Giges e Creso e depois a sede de um sátrapa persa na extremidade ocidental da Estrada Real para Susã."
    - "O Apocalipse, por volta de 95 d.C., dá a Sardes a quinta das sete cartas, uma das mais severas: “Conheço as suas obras, sei que você tem a reputação de estar vivo, mas está morto.” Adverte: “Se, portanto, você não vigiar, virei como um ladrão”, mas alguns “não contaminaram as suas vestes. Elas andarão comigo vestidas de branco”. Ramsay e Hemer leem a advertência à luz do passado da cidade: sua cidadela, tida por inexpugnável, caiu duas vezes de surpresa, diante de Ciro por volta de 547 a.C. e de Antíoco III por volta de 214 a.C., quando soldados escalaram um penhasco sem guarda. Alguns também identificam Sefarade, onde Obadias situa exilados de Jerusalém, com Sardes; outros duvidam."
    - "No ano 17 d.C., um terremoto atingiu doze cidades da Ásia, e Sardes foi a mais atingida; Tibério lhe perdoou o tributo por cinco anos. As escavações Harvard-Cornell, a partir de 1958, trouxeram à luz o grande complexo de banho e ginásio, parte do qual os judeus da cidade romana tardia usaram como sinagoga de mais de 50 m de comprimento, uma das maiores conhecidas da Antiguidade, e o templo de Ártemis abaixo da cidadela. Por volta de 170, Melito, bispo de Sardes, escreveu seu sermão Sobre a Páscoa."
  de:
    - "Sardes lag im Westen der Türkei beim Dorf Sart, in der Provinz Manisa, wo der Bach Paktolos vom Tmolos in das Tal des Hermos herabkommt; der Kartenpunkt steht auf dem Ort. Es lag in der Luftlinie etwa 44 km von Philadelphia, 51 km von Thyatira und 79 km östlich von Smyrna. Eine steile Burg erhob sich über der Unterstadt, die unter Gyges und Krösus die Königsstadt Lydiens und dann Sitz eines persischen Satrapen am Westende der Königsstraße nach Susa gewesen war."
    - "Die Offenbarung gibt Sardes um 95 n. Chr. das fünfte der sieben Sendschreiben, eines der strengsten: „Ich weiß deine Werke; denn du hast den Namen, daß du lebest, und bist tot.“ Es warnt: „So du nicht wirst wachen, werde ich über dich kommen wie ein Dieb“, doch es gibt einige, „die nicht ihre Kleider besudelt haben; und sie werden mit mir wandeln in weißen Kleidern“. Ramsay und Hemer lesen die Warnung vor dem Hintergrund der Vergangenheit der Stadt: Ihre für uneinnehmbar gehaltene Burg fiel zweimal durch Überraschung, an Kyrus um 547 v. Chr. und an Antiochos III. um 214 v. Chr., als Soldaten eine unbewachte Felswand erkletterten. Manche setzen auch Sefarad, wo Obadja Verbannte aus Jerusalem ansiedelt, mit Sardes gleich; andere zweifeln daran."
    - "Im Jahr 17 n. Chr. traf ein Erdbeben zwölf Städte Asiens, Sardes am schlimmsten, und Tiberius erließ ihm den Tribut für fünf Jahre. Die Grabungen von Harvard und Cornell seit 1958 legten das große Badgymnasium frei, dessen einen Teil die Juden der spätrömischen Stadt als über 50 m lange Synagoge nutzten, eine der größten aus der Antike bekannten, und den Artemistempel unterhalb der Burg. Um 170 schrieb Melito, Bischof von Sardes, seine Predigt Über das Passa."
  fr:
    - "Sardes se trouvait dans l’ouest de la Turquie, près du village de Sart, dans la province de Manisa, là où le ruisseau du Pactole descend du mont Tmolos dans la vallée de l’Hermos ; le point de la carte se trouve sur le site. Elle était à environ 44 km de Philadelphie, à 51 km de Thyatire et à 79 km à l’est de Smyrne à vol d’oiseau. Une citadelle escarpée dominait la ville basse, qui avait été la ville royale de Lydie sous Gygès et Crésus, puis le siège d’un satrape perse à l’extrémité occidentale de la Route royale de Suse."
    - "L’Apocalypse, vers 95 apr. J.-C., donne à Sardes la cinquième des sept lettres, l’une des plus sévères : « Je connais tes œuvres. Je sais que tu passes pour être vivant, et tu es mort. » Elle avertit : « Si tu ne veilles pas, je viendrai comme un voleur », mais quelques-uns « n’ont pas souillé leurs vêtements ; ils marcheront avec moi en vêtements blancs ». Ramsay et Hemer lisent l’avertissement à la lumière du passé de la ville : sa citadelle, tenue pour imprenable, tomba deux fois par surprise, devant Cyrus vers 547 av. J.-C. et devant Antiochos III vers 214 av. J.-C., quand des soldats escaladèrent une falaise non gardée. Certains identifient aussi Sepharad, où Abdias place des exilés de Jérusalem, avec Sardes ; d’autres en doutent."
    - "En 17 apr. J.-C., un tremblement de terre frappa douze villes d’Asie, Sardes plus que toute autre, et Tibère la dispensa de tribut pendant cinq ans. Les fouilles de Harvard et de Cornell, à partir de 1958, ont mis au jour le grand ensemble de bains et de gymnase, dont une partie fut utilisée par les Juifs de la ville de la fin de l’époque romaine comme synagogue, longue de plus de 50 m, l’une des plus grandes connues de l’Antiquité, ainsi que le temple d’Artémis au pied de la citadelle. Vers 170, Méliton, évêque de Sardes, écrivit son homélie Sur la Pâque."
  pl:
    - "Sardes leżały w zachodniej Turcji przy wsi Sart, w prowincji Manisa, gdzie strumień Paktolos spływa z góry Tmolos do doliny Hermosu; punkt na mapie stoi na stanowisku. Było oddalone o około 44 km od Filadelfii, 51 km od Tiatyry i 79 km na wschód od Smyrny w linii prostej. Stroma cytadela wznosiła się nad dolnym miastem, które było królewskim miastem Lidii za Gygesa i Krezusa, a potem siedzibą perskiego satrapy na zachodnim końcu Drogi Królewskiej do Suz."
    - "Apokalipsa, około 95 n.e., daje Sardes piąty z siedmiu listów, jeden z najsurowszych: „Znam uczynki twoje, i masz imię, że żyjesz; aleś jest umarły”. Ostrzega: „Jeźli tedy czuć nie będziesz, przyjdę na cię jako złodziej”, lecz kilka osób, „które nie pokalały szat swoich; przetoż chodzić będą ze mną w szatach białych”. Ramsay i Hemer odczytują ostrzeżenie na tle przeszłości miasta: jego cytadela, uważana za niezdobytą, padła dwukrotnie przez zaskoczenie, przed Cyrusem około 547 p.n.e. i przed Antiochem III około 214 p.n.e., gdy żołnierze weszli na niestrzeżoną skałę. Niektórzy utożsamiają też Sefarad, gdzie Abdiasz umieszcza wygnańców jerozolimskich, z Sardes; inni w to wątpią."
    - "W 17 n.e. trzęsienie ziemi nawiedziło dwanaście miast Azji, Sardes najbardziej, a Tyberiusz darował mu daninę na pięć lat. Wykopaliska Harvard–Cornell, od 1958, odsłoniły wielkie łaźnie z gimnazjonem, których część Żydzi późnorzymskiego miasta wykorzystywali jako synagogę długą na ponad 50 m, jedną z największych znanych ze starożytności, oraz świątynię Artemidy pod cytadelą. Około 170 Melito, biskup Sardes, napisał swoje kazanie O Pasze."
  it:
    - "Sardi sorgeva nella Turchia occidentale presso il villaggio di Sart, nella provincia di Manisa, dove il torrente Pattolo scende dal Monte Tmolo nella valle dell’Ermo; il punto della mappa si trova sul sito. Distava circa 44 km da Filadelfia, 51 km da Tiatira e 79 km a est di Smirne in linea d’aria. Una ripida cittadella sorgeva sopra la città bassa, che era stata la città regale della Lidia sotto Gige e Creso e poi la sede di un satrapo persiano all’estremità occidentale della Via Regia per Susa."
    - "L’Apocalisse, intorno al 95 d.C., dà a Sardi la quinta delle sette lettere, una delle più severe: «Io conosco le tue opere: tu hai nome di vivere e sei morto». Ammonisce: «Che se tu non vegli, io verrò come un ladro», eppure pochi «non hanno contaminato le loro vesti; essi cammineranno meco in vesti bianche». Ramsay e Hemer leggono l’ammonimento alla luce del passato della città: la sua cittadella, ritenuta inespugnabile, cadde due volte di sorpresa, davanti a Ciro verso il 547 a.C. e ad Antioco III verso il 214 a.C., quando dei soldati scalarono una rupe incustodita. Alcuni identificano anche Sefarad, dove Abdia pone gli esuli di Gerusalemme, con Sardi; altri ne dubitano."
    - "Nel 17 d.C. un terremoto colpì dodici città dell’Asia, Sardi più di tutte, e Tiberio le condonò il tributo per cinque anni. Gli scavi Harvard-Cornell, dal 1958, hanno portato alla luce il grande complesso di bagno e ginnasio, parte del quale gli Ebrei della città tardo-romana usarono come sinagoga lunga oltre 50 m, una delle più grandi note dell’antichità, e il tempio di Artemide sotto la cittadella. Verso il 170 Melitone, vescovo di Sardi, scrisse la sua omelia Sulla Pasqua."
  cs:
    - "Sardy ležely v západním Turecku u vsi Sart v provincii Manisa, kde potok Paktólos stéká z hory Tmólos do údolí Herma; bod na mapě stojí na místě. Byly vzdušnou čarou asi 44 km od Filadelfie, 51 km od Tyatiry a 79 km východně od Smyrny. Strmá akropole se zvedala nad dolním městem, které bylo královským městem Lýdie za Gygése a Kroisa a poté sídlem perského satrapy na západním konci Královské cesty do Sus."
    - "Zjevení, asi roku 95 n. l., dává Sardám pátý ze sedmi listů, jeden z nejpřísnějších: „Vím skutky tvé: máš jméno, že jsi živ, ale jsi mrtvý.“ Varuje: „Pakli bdíti nebudeš, přijduť na tě jako zloděj“, a přece někteří „neposkvrnily roucha svého, protož budouť se procházeti se mnou v bílém rouše“. Ramsay a Hemer čtou varování proti minulosti města: jeho akropole, pokládaná za nedobytnou, padla dvakrát překvapením, Kýrovi kolem roku 547 př. n. l. a Antiochovi III. kolem roku 214 př. n. l., kdy vojáci vylezli na nehlídaný útes. Někteří také ztotožňují se Sardami Sefarad, kam Obadjáš klade vyhnance z Jeruzaléma; jiní o tom pochybují."
    - "Roku 17 n. l. zasáhlo zemětřesení dvanáct měst Asie, Sardy nejhůře, a Tiberius jim na pět let prominul daň. Harvardsko-cornellské vykopávky od roku 1958 odkryly velkou lázeňskou tělocvičnu, jejíž část využívali Židé pozdně římského města jako synagogu dlouhou přes 50 m, jednu z největších známých ze starověku, a chrám Artemidin pod akropolí. Kolem roku 170 napsal Melitón, biskup sardský, své kázání O velikonocích."
  nl:
    - "Sardes lag in het westen van Turkije bij het dorp Sart, in de provincie Manisa, waar de beek Pactolus van de Tmolus afdaalt in het dal van de Hermus; het punt op de kaart staat op de plek. Het lag hemelsbreed ongeveer 44 km van Filadelfia, 51 km van Thyatira en 79 km ten oosten van Smyrna. Een steile burcht rees boven de benedenstad uit, die onder Gyges en Croesus de koninklijke stad van Lydië was geweest en daarna de zetel van een Perzische satraap aan het westelijke einde van de Koninklijke Weg naar Susa."
    - "De Openbaring geeft Sardes omstreeks 95 n.Chr. de vijfde van de zeven brieven, een van de strengste: “Ik weet uw werken, dat gij den naam hebt, dat gij leeft, en gij zijt dood.” Zij waarschuwt: “Indien gij dan niet waakt, zo zal Ik over u komen als een dief”, maar er zijn enkelen “die hun klederen niet bevlekt hebben, en zij zullen met Mij wandelen in witte klederen”. Ramsay en Hemer lezen de waarschuwing tegen het verleden van de stad: haar burcht, onneembaar geacht, viel tweemaal door verrassing, aan Cyrus omstreeks 547 v.Chr. en aan Antiochus III omstreeks 214 v.Chr., toen soldaten een onbewaakte klif beklommen. Sommigen identificeren ook Sefarad, waar Obadja ballingen uit Jeruzalem plaatst, met Sardes; anderen betwijfelen dat."
    - "In 17 n.Chr. trof een aardbeving twaalf steden van Asia, Sardes het zwaarst van allemaal, en Tiberius schold de belasting voor vijf jaar kwijt. De opgravingen van Harvard en Cornell, vanaf 1958, brachten het grote badhuis-gymnasium aan het licht, waarvan een deel door de joden van de laat-Romeinse stad als synagoge van meer dan 50 m lengte werd gebruikt, een van de grootste uit de oudheid, en de tempel van Artemis onder de burcht. Omstreeks 170 schreef Melito, bisschop van Sardes, zijn preek Over het Pascha."
  sv:
    - "Sardes låg i västra Turkiet vid byn Sart, i provinsen Manisa, där Paktolosbäcken kommer ned från berget Tmolos in i Hermosdalen; kartpunkten står på platsen. Den låg omkring 44 km från Filadelfia, 51 km från Tyatira och 79 km öster om Smyrna i fågelvägen. En brant akropolis reste sig över nedre staden, som hade varit Lydiens kungastad under Gyges och Kroisos och sedan säte för en persisk satrap i västra änden av Kungsvägen till Susa."
    - "Uppenbarelseboken, omkring år 95 e.Kr., ger Sardes det femte av de sju breven, ett av de strängaste: ”Jag känner dina gärningar; du har det namnet om dig, att du lever, men du är död.” Det varnar: ”Om du icke håller dig vaken, så skall jag komma såsom en tjuv”, men några få ”som icke hava fläckat sina kläder; och dessa skola vandra med mig i vita kläder”. Ramsay och Hemer läser varningen mot stadens förflutna: dess akropolis, som ansågs ointaglig, föll två gånger genom överraskning, för Kyros omkring 547 f.Kr. och för Antiochos III omkring 214 f.Kr., då soldater klättrade upp för en obevakad klippa. Vissa identifierar också Sefarad, där Obadja förlägger landsflyktiga från Jerusalem, med Sardes; andra tvivlar."
    - "År 17 e.Kr. drabbade en jordbävning tolv städer i Asien, Sardes värst av alla, och Tiberius eftergav dess skatt i fem år. Harvard–Cornell-utgrävningarna, från 1958, avtäckte det stora badgymnasiet, vars en del den sena romerska stadens judar använde som synagoga, över 50 m lång, en av de största kända från antiken, och Artemistemplet nedanför akropolis. Omkring år 170 skrev Melito, biskop av Sardes, sin predikan Om påsken."
  nb:
    - "Sardes lå i Vest-Tyrkia ved landsbyen Sart, i provinsen Manisa, der bekken Paktolos kommer ned fra Tmolos-fjellet inn i Hermos-dalen; kartpunktet står på stedet. Det var omtrent 44 km fra Filadelfia, 51 km fra Tyatira og 79 km øst for Smyrna i luftlinje. Et bratt citadell reiste seg over underbyen, som hadde vært Lydias kongeby under Gyges og Kroisos og deretter sete for en persisk satrap i den vestre enden av Kongeveien til Susa."
    - "Johannes’ Åpenbaring, omkring 95 e.Kr., gir Sardes det femte av de syv brevene, ett av de strengeste: «Jeg vet om dine gjerninger, at du har navn av at du lever, og du er død.» Det advarer: «Dersom du da ikke våker, skal jeg komme som en tyv», men noen få er det som «ikke har smittet sine klær, og de skal gå med mig i hvite klær». Ramsay og Hemer leser advarselen mot byens fortid: citadellet, regnet som uinntagelig, falt to ganger ved overraskelse, til Kyros omkring 547 f.Kr. og til Antiokhos III omkring 214 f.Kr., da soldater klatret opp en uvoktet klippe. Noen identifiserer også Sefarad, der Obadja plasserer landflyktige fra Jerusalem, med Sardes; andre tviler på det."
    - "I 17 e.Kr. rammet et jordskjelv tolv byer i Asia, Sardes verst av alle, og Tiberius ettergav dens skatt i fem år. Harvard–Cornell-utgravningene, fra 1958, avdekket det store badegymnasiet, hvor jødene i den sene romerske byen brukte en del som synagoge på over 50 m, en av de største kjent fra antikken, og Artemis-tempelet under citadellet. Omkring 170 skrev Melito, biskop av Sardes, sin preken Om påsken."
  tl:
    - "Ang Sardis ay nasa kanlurang Turkey sa tabi ng nayon ng Sart, sa lalawigan ng Manisa, kung saan bumababa ang batis ng Pactolus mula sa Bundok Tmolus patungo sa lambak ng Hermus; nasa pook ang punto sa mapa. Mga 44 km ito mula sa Filadelfia, 51 km mula sa Tiatira at 79 km sa silangan ng Smirna sa tuwid na guhit. Isang matarik na kuta ang tumaas sa itaas ng ibabang lungsod, na naging maharlikang lungsod ng Lidia sa ilalim nina Gyges at Croesus at pagkatapos ay luklukan ng isang satrapa ng Persia sa kanlurang dulo ng Daang Maharlika patungong Susan."
    - "Ang Apocalipsis, mga 95 AD, ay nagbibigay sa Sardis ng ikalima sa pitong liham, isa sa pinakamahigpit: “Nalalaman ko ang iyong mga gawa, na ikaw ay may pangalang ikaw ay nabubuhay, at ikaw ay patay.” Nagbababala ito, “kung hindi ka magpupuyat ay paririyan akong gaya ng magnanakaw”, ngunit may ilang “hindi nangagdumi ng kanilang mga damit: at sila'y kasama kong magsisilakad na may mga damit na maputi”. Binabasa nina Ramsay at Hemer ang babala ayon sa nakaraan ng lungsod: ang kuta nito, na itinuring na hindi malulupig, ay bumagsak nang dalawang beses sa sorpresa, kay Ciro noong mga 547 BK at kay Antiochus III noong mga 214 BK, nang umakyat ang mga kawal sa isang bangin na walang bantay. Kinikilala rin ng ilan ang Sepharad, kung saan inilalagay ni Obadias ang mga destiyero ng Jerusalem, sa Sardis; nag-aalinlangan ang iba."
    - "Noong 17 AD, tinamaan ng lindol ang labindalawang lungsod ng Asia, pinakamalala ang Sardis, at pinatawad ni Tiberio ang buwis nito sa loob ng limang taon. Ang mga paghuhukay ng Harvard-Cornell, mula 1958, ay nakatuklas ng dakilang paliguang-gymnasium, na ang bahagi ay ginamit ng mga Judio ng huling lungsod na Romano bilang sinagoga na mahigit 50 m ang haba, isa sa pinakamalaking kilala mula sa sinaunang panahon, at ang templo ni Artemis sa ibaba ng kuta. Noong mga 170, isinulat ni Melito, obispo ng Sardis, ang kaniyang sermon na Tungkol sa Paskua."
  da:
    - "Sardes lå i det vestlige Tyrkiet ved landsbyen Sart, i provinsen Manisa, hvor Paktolos-floden kommer ned fra Tmolos-bjerget ind i Hermos-dalen; kortets punkt står på stedet. Den lå ca. 44 km fra Filadelfia, 51 km fra Thyatira og 79 km øst for Smyrna i fugleflugt. En stejl borg rejste sig over underbyen, som havde været Lydiens kongeby under Gyges og Kroisos og derefter sæde for en persisk satrap i den vestlige ende af Kongevejen til Susa."
    - "Johannes’ Åbenbaring, omkring 95 e.Kr., giver Sardes det femte af de syv breve, et af de strengeste: »Jeg kender dine Gerninger … har Ord for at leve og er dog død.« Det advarer: »Dersom du altsaa ikke vaager, skal jeg komme som en Tyv«, og dog har nogle få »som ikke have besmittet deres Klæder; de skulle vandre med mig i hvide Klæder«. Ramsay og Hemer læser advarslen op imod byens fortid: Dens borg, anset for uindtagelig, faldt to gange ved overraskelse, til Kyros omkring 547 f.Kr. og til Antiochos 3. omkring 214 f.Kr., da soldater klatrede op ad en ubevogtet klippe. Nogle identificerer også Sefarad, hvor Obadja placerer landflygtige fra Jerusalem, med Sardes; andre tvivler på det."
    - "I 17 e.Kr. ramte et jordskælv tolv byer i Asia, Sardes værst af alle, og Tiberius eftergav dens skat i fem år. Harvard-Cornell-udgravningerne, fra 1958, afdækkede det store badegymnasium, hvoraf en del blev brugt af jøderne i den sene romerske by som en synagoge på over 50 m, en af de største kendte fra antikken, og Artemistemplet under borgen. Omkring 170 skrev Melito, biskop af Sardes, sin prædiken Om Påsken."
  sr:
    - "Сард је лежао у западној Турској код села Сарт, у провинцији Маниса, где поток Пактол силази са планине Тмол у долину Херма; тачка на карти стоји на налазишту. Био је око 44 км од Филаделфије, 51 км од Тијатире и 79 км источно од Смирне ваздушном линијом. Стрма цитадела уздизала се изнад доњег града, који је био краљевски град Лидије под Гигом и Крезом, а затим седиште персијског сатрапа на западном крају Краљевског пута до Сусе."
    - "Откривење, око 95. н. е., даје Сарду пето од седам писама, једно од најстрожих: „Знам твоја дела, да имаш име да си жив, а мртав си.“ Упозорава: „Ако ли не узастражиш, доћи ћу на тебе као лупеж“, а ипак неколицина „који не опоганише својих хаљина, и ходиће са мном у белима“. Рамзи и Хемер читају упозорење према прошлости града: његова цитадела, сматрана неосвојивом, пала је два пута изненађењем, Киру око 547. п. н. е. и Антиоху III око 214. п. н. е., кад су се војници успели уз нечувану литицу. Неки и Сефарад, где Овадија смешта прогнанике Јерусалима, поистовећују са Сардом; други сумњају."
    - "Године 17. н. е. земљотрес је погодио дванаест градова Азије, Сард најгоре од свих, а Тиверије му је опростио данак на пет година. Харвард-Корнелова ископавања, од 1958, открила су велику купатилско-гимнастичку зграду, чији су део Јевреји позног римског града користили као синагогу дугу преко 50 м, једну од највећих познатих из старог века, и храм Артемидин испод цитаделе. Око 170. Мелитон, епископ сардски, написао је своју беседу О пасхи."
