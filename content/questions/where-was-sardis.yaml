id: where-was-sardis
question:
  en: "Where was Sardis?"
  ru: "Где находился Сардис?"
  uk: "Де були Сарди?"
  es: "¿Dónde estaba Sardis?"
  pt: "Onde ficava Sardes?"
  de: "Wo lag Sardes?"
  fr: "Où se trouvait Sardes ?"
answer:
  en:
    - "Sardis lay in western Turkey by the village of Sart, in the province of Manisa, where the Pactolus stream comes down from Mount Tmolus into the valley of the Hermus; the map point stands on the site. It was about 44 km from Philadelphia, 51 km from Thyatira and 79 km east of Smyrna in a straight line. A steep citadel rose above the lower city, which had been the royal city of Lydia under Gyges and Croesus and then the seat of a Persian satrap at the western end of the Royal Road to Susa."
    - "Revelation, about AD 95, gives Sardis the fifth of the seven letters, one of the sternest: “I know thy works, that thou hast a name that thou livest, and art dead.” It warns, “If therefore thou shalt not watch, I will come on thee as a thief”, yet a few “have not defiled their garments; and they shall walk with me in white”. Ramsay and Hemer read the warning against the city's past: its citadel, thought impregnable, fell twice by surprise, to Cyrus about 547 BC and to Antiochus III about 214 BC, when soldiers climbed an unguarded cliff. Some also identify Sepharad, where Obadiah places exiles of Jerusalem, with Sardis; others doubt it."
    - "In AD 17 an earthquake struck twelve cities of Asia, Sardis worst of all, and Tiberius remitted its tribute for five years. The Harvard-Cornell excavations, from 1958, uncovered the great bath-gymnasium, part of which the Jews of the late Roman city used as a synagogue over 50 m long, one of the largest known from antiquity, and the temple of Artemis below the citadel. About 170 Melito, bishop of Sardis, wrote his sermon On the Passover."
  ru:
    - "Сардис лежал на западе Турции у деревни Сарт в провинции Маниса, там, где ручей Пактол спускается с горы Тмол в долину Герма; точка карты стоит на этом месте. Отсюда около 44 км до Филадельфии, 51 км до Фиатиры и 79 км на восток от Смирны по прямой. Над нижним городом поднимался крутой акрополь; Сардис был царским городом Лидии при Гигесе и Крезе, а затем резиденцией персидского сатрапа на западном конце Царской дороги в Сузы."
    - "Откровение около 95 г. посылает Сардису пятое из семи посланий — одно из самых суровых: «знаю твои дела; ты носишь имя, будто жив, но ты мертв». Оно предостерегает: «Если же не будешь бодрствовать, то Я найду на тебя, как тать», — и всё же несколько человек «не осквернили одежд своих и будут ходить со Мною в белых одеждах». Рамзей и Хемер толковали предостережение по истории города: его акрополь, считавшийся неприступным, дважды взяли врасплох — Кир около 547 г. до н. э. и Антиох III около 214 г. до н. э., когда воины взобрались по неохраняемому обрыву. Некоторые также отождествляют с Сардисом Сефарад, где, по Авдию, жили пленники из Иерусалима; другие в этом сомневаются."
    - "В 17 г. н. э. землетрясение поразило двенадцать городов Асии, а сильнее всех Сардис, и Тиберий освободил его от податей на пять лет. Раскопки Гарвардского и Корнеллского университетов, начатые в 1958 году, открыли большой комплекс бань и гимнасия, часть которого иудеи позднеримского города превратили в синагогу длиной более 50 м — одну из крупнейших известных в древности, — и храм Артемиды под акрополем. Около 170 г. Мелитон, епископ Сардийский, написал здесь проповедь «О Пасхе»."
  uk:
    - "Сарди лежали на заході Туреччини біля села Сарт, у провінції Маніса, де потік Пактол спускається з гори Тмол у долину Герма; точка на мапі стоїть на цьому місці. Вони були приблизно за 44 км від Філадельфії, за 51 км від Тіатири і за 79 км на схід від Смирни по прямій. Крута цитадель здіймалася над нижнім містом, яке було царським містом Лідії за Гігеса й Креза, а потім осідком перського сатрапа на західному кінці Царської дороги до Суз."
    - "Одкровення, близько 95 р. н. е., дає Сардам п'ятий із семи листів, один із найсуворіших: «Знаю твої дїла, що маєш імя, що живеш, а мертвий єси.» Воно попереджає: «коли ж не чувати меш, прийду на тебе, як злодїй», але декілька осіб «не опоганили одеж своїх; вони ходити муть зо мною у білих». Рамзай і Гемер читають це застереження на тлі минулого міста: його цитадель, яку вважали неприступною, двічі впала несподівано — перед Кіром близько 547 р. до н. е. та перед Антіохом III близько 214 р. до н. е., коли воїни піднялися непильнованою скелею. Дехто також ототожнює Сефарад, куди Овадія поміщає єрусалимських вигнанців, із Сардами; інші сумніваються."
    - "17 р. н. е. землетрус вразив дванадцять міст Азії, найбільше Сарди, і Тиверій на п'ять років скасував їхню данину. Гарвардсько-Корнелльські розкопки від 1958 р. відкрили великий лазневий гімнасій, частину якого юдеї пізньоримського міста використовували як синагогу завдовжки понад 50 м, одну з найбільших відомих з давнини, та храм Артеміди під цитаделлю. Близько 170 р. Мелітон, єпископ Сард, написав свою проповідь «Про Пасху»."
  es:
    - "Sardis se hallaba en el oeste de Turquía, junto a la aldea de Sart, en la provincia de Manisa, donde el arroyo Pactolo baja del monte Tmolo al valle del Hermo; el punto del mapa está sobre el yacimiento. Quedaba a unos 44 km de Filadelfia, a 51 km de Tiatira y a 79 km al este de Esmirna en línea recta. Una empinada ciudadela se alzaba sobre la ciudad baja, que había sido la ciudad real de Lidia bajo Giges y Creso y luego la sede de un sátrapa persa en el extremo occidental del Camino Real a Susa."
    - "El Apocalipsis, hacia el 95 d. C., da a Sardis la quinta de las siete cartas, una de las más severas: «Yo conozco tus obras, que tienes nombre que vives, y estás muerto». Advierte: «Y si no velares, vendré á ti como ladrón», pero unos pocos «no han ensuciado sus vestiduras: y andarán conmigo en vestiduras blancas». Ramsay y Hemer leen la advertencia a la luz del pasado de la ciudad: su ciudadela, tenida por inexpugnable, cayó dos veces por sorpresa, ante Ciro hacia el 547 a. C. y ante Antíoco III hacia el 214 a. C., cuando unos soldados escalaron un risco sin guardia. Algunos identifican también con Sardis a Sefarad, donde Abdías sitúa a desterrados de Jerusalén; otros lo dudan."
    - "En el 17 d. C. un terremoto sacudió doce ciudades de Asia, Sardis la peor de todas, y Tiberio le condonó el tributo durante cinco años. Las excavaciones de Harvard y Cornell, desde 1958, sacaron a la luz el gran baño-gimnasio, parte del cual usaron los judíos de la ciudad del Bajo Imperio como sinagoga de más de 50 m de largo, una de las mayores conocidas de la Antigüedad, y el templo de Artemisa bajo la ciudadela. Hacia el 170, Melitón, obispo de Sardis, escribió su homilía Sobre la Pascua."
  pt:
    - "Sardes ficava no oeste da Turquia, junto à aldeia de Sart, na província de Manisa, onde o riacho Pactolo desce do monte Tmolo para o vale do Hermo; o ponto do mapa fica no sítio. Ficava a cerca de 44 km de Filadélfia, 51 km de Tiatira e 79 km a leste de Esmirna em linha reta. Uma cidadela escarpada se erguia acima da cidade baixa, que fora a cidade real da Lídia sob Giges e Creso e depois a sede de um sátrapa persa na extremidade ocidental da Estrada Real para Susã."
    - "O Apocalipse, por volta de 95 d.C., dá a Sardes a quinta das sete cartas, uma das mais severas: “Conheço as suas obras, sei que você tem a reputação de estar vivo, mas está morto.” Adverte: “Se, portanto, você não vigiar, virei como um ladrão”, mas alguns “não contaminaram as suas vestes. Elas andarão comigo vestidas de branco”. Ramsay e Hemer leem a advertência à luz do passado da cidade: sua cidadela, tida por inexpugnável, caiu duas vezes de surpresa, diante de Ciro por volta de 547 a.C. e de Antíoco III por volta de 214 a.C., quando soldados escalaram um penhasco sem guarda. Alguns também identificam Sefarade, onde Obadias situa exilados de Jerusalém, com Sardes; outros duvidam."
    - "No ano 17 d.C., um terremoto atingiu doze cidades da Ásia, e Sardes foi a mais atingida; Tibério lhe perdoou o tributo por cinco anos. As escavações Harvard-Cornell, a partir de 1958, trouxeram à luz o grande complexo de banho e ginásio, parte do qual os judeus da cidade romana tardia usaram como sinagoga de mais de 50 m de comprimento, uma das maiores conhecidas da Antiguidade, e o templo de Ártemis abaixo da cidadela. Por volta de 170, Melito, bispo de Sardes, escreveu seu sermão Sobre a Páscoa."
  de:
    - "Sardes lag im Westen der Türkei beim Dorf Sart, in der Provinz Manisa, wo der Bach Paktolos vom Tmolos in das Tal des Hermos herabkommt; der Kartenpunkt steht auf dem Ort. Es lag in der Luftlinie etwa 44 km von Philadelphia, 51 km von Thyatira und 79 km östlich von Smyrna. Eine steile Burg erhob sich über der Unterstadt, die unter Gyges und Krösus die Königsstadt Lydiens und dann Sitz eines persischen Satrapen am Westende der Königsstraße nach Susa gewesen war."
    - "Die Offenbarung gibt Sardes um 95 n. Chr. das fünfte der sieben Sendschreiben, eines der strengsten: „Ich weiß deine Werke; denn du hast den Namen, daß du lebest, und bist tot.“ Es warnt: „So du nicht wirst wachen, werde ich über dich kommen wie ein Dieb“, doch es gibt einige, „die nicht ihre Kleider besudelt haben; und sie werden mit mir wandeln in weißen Kleidern“. Ramsay und Hemer lesen die Warnung vor dem Hintergrund der Vergangenheit der Stadt: Ihre für uneinnehmbar gehaltene Burg fiel zweimal durch Überraschung, an Kyrus um 547 v. Chr. und an Antiochos III. um 214 v. Chr., als Soldaten eine unbewachte Felswand erkletterten. Manche setzen auch Sefarad, wo Obadja Verbannte aus Jerusalem ansiedelt, mit Sardes gleich; andere zweifeln daran."
    - "Im Jahr 17 n. Chr. traf ein Erdbeben zwölf Städte Asiens, Sardes am schlimmsten, und Tiberius erließ ihm den Tribut für fünf Jahre. Die Grabungen von Harvard und Cornell seit 1958 legten das große Badgymnasium frei, dessen einen Teil die Juden der spätrömischen Stadt als über 50 m lange Synagoge nutzten, eine der größten aus der Antike bekannten, und den Artemistempel unterhalb der Burg. Um 170 schrieb Melito, Bischof von Sardes, seine Predigt Über das Passa."
  fr:
    - "Sardes se trouvait dans l’ouest de la Turquie, près du village de Sart, dans la province de Manisa, là où le ruisseau du Pactole descend du mont Tmolos dans la vallée de l’Hermos ; le point de la carte se trouve sur le site. Elle était à environ 44 km de Philadelphie, à 51 km de Thyatire et à 79 km à l’est de Smyrne à vol d’oiseau. Une citadelle escarpée dominait la ville basse, qui avait été la ville royale de Lydie sous Gygès et Crésus, puis le siège d’un satrape perse à l’extrémité occidentale de la Route royale de Suse."
    - "L’Apocalypse, vers 95 apr. J.-C., donne à Sardes la cinquième des sept lettres, l’une des plus sévères : « Je connais tes œuvres. Je sais que tu passes pour être vivant, et tu es mort. » Elle avertit : « Si tu ne veilles pas, je viendrai comme un voleur », mais quelques-uns « n’ont pas souillé leurs vêtements ; ils marcheront avec moi en vêtements blancs ». Ramsay et Hemer lisent l’avertissement à la lumière du passé de la ville : sa citadelle, tenue pour imprenable, tomba deux fois par surprise, devant Cyrus vers 547 av. J.-C. et devant Antiochos III vers 214 av. J.-C., quand des soldats escaladèrent une falaise non gardée. Certains identifient aussi Sepharad, où Abdias place des exilés de Jérusalem, avec Sardes ; d’autres en doutent."
    - "En 17 apr. J.-C., un tremblement de terre frappa douze villes d’Asie, Sardes plus que toute autre, et Tibère la dispensa de tribut pendant cinq ans. Les fouilles de Harvard et de Cornell, à partir de 1958, ont mis au jour le grand ensemble de bains et de gymnase, dont une partie fut utilisée par les Juifs de la ville de la fin de l’époque romaine comme synagogue, longue de plus de 50 m, l’une des plus grandes connues de l’Antiquité, ainsi que le temple d’Artémis au pied de la citadelle. Vers 170, Méliton, évêque de Sardes, écrivit son homélie Sur la Pâque."
