id: where-was-the-city-of-david
question:
  en: "Where was the City of David?"
  ru: "Где находился Город Давидов?"
  uk: "Де було Місто Давида?"
  es: "¿Dónde estaba la Ciudad de David?"
  pt: "Onde ficava a Cidade de Davi?"
  de: "Wo lag die Stadt Davids?"
  fr: "Où se trouvait la Cité de David ?"
  pl: "Gdzie było Miasto Dawida?"
  it: "Dov’era la Città di Davide?"
  cs: "Kde leželo Město Davidovo?"
  nl: "Waar lag de Stad van David?"
  sv: "Var låg Davids stad?"
  nb: "Hvor lå Davidsbyen?"
  tl: "Nasaan ang Bayan ni David?"
  da: "Hvor lå Davidsbyen?"
  sr: "Где је био Давидов град?"
answer:
  en:
    - "The City of David was the narrow ridge that runs south from the Temple Mount in Jerusalem, between the Kidron valley on the east and the central valley, the Tyropoeon, on the west; today it lies in Silwan, just outside the southern wall of the Old City. It was the oldest Jerusalem, the Jebusite town that David took about 1003 BC. The map's point stands on the ridge above the Gihon spring, about 0.5 km south of the map's point for Mount Moriah and about 0.7 km east of today's Mount Zion in a straight line. History Globe has an article on the City of David and a question on when David took Jerusalem; this answer keeps to where it was."
    - "The name begins with the conquest: “David took the strong hold of Zion: the same is the city of David”, and “David dwelt in the fort, and called it the city of David. And David built round about from Millo and inward.” David was buried there, and Solomon brought the ark up “out of the city of David, which is Zion” to the Temple on the hill to the north, which shows that the two were different places. After the exile Nehemiah's builders repaired the wall by the pool of Siloah “unto the stairs that go down from the city of David”, at the southern foot of the ridge."
    - "Josephus already took the higher western hill for David's stronghold, and for centuries tradition placed the City of David there, on the hill now called Mount Zion, where David's tomb is still shown. Excavators from Charles Warren in 1867 to Raymond Weill in 1913 returned it to the eastern ridge: it is the only hill beside a perennial spring, the Gihon, and the Bible's own topography, from the spring to the stairs and the Siloam pool, fits it. The ridge was small, about 5 ha; most scholars accept this placing, while the age of the great stone structures on its summit, whether of David's time or later, is disputed."
  ru:
    - "Город Давидов — это узкий хребет, идущий к югу от Храмовой горы в Иерусалиме, между долиной Кедрона на востоке и средней, Тиропеонской, долиной на западе; сегодня он лежит в Сильване, сразу за южной стеной Старого города. Это древнейший Иерусалим — город иевусеев, который Давид взял около 1003 г. до н. э. Точка карты стоит на хребте над источником Гион, примерно в 0,5 км к югу от точки горы Мориа и в 0,7 км к востоку от нынешней горы Сион по прямой. В History Globe есть статья о Городе Давидовом и вопрос о том, когда Давид взял Иерусалим; здесь ответ о том, где он был."
    - "Имя начинается с завоевания: «Но Давид взял крепость Сион: это — город Давидов», и «поселился Давид в крепости, и назвал ее городом Давидовым, и обстроил кругом от Милло и внутри». Там Давид был погребён, а Соломон перенёс ковчег «из города Давидова, то есть Сиона» в Храм на холме к северу — значит, это были разные места. После плена строители Неемии чинили стену у водоёма Селах «до ступеней, спускающихся из города Давидова», у южного подножия хребта."
    - "Уже Иосиф Флавий принимал за крепость Давида более высокий западный холм, и веками предание помещало Город Давидов там, на холме, который теперь зовётся горой Сион и где до сих пор показывают гробницу Давида. Археологи — от Чарльза Уоррена в 1867 году до Раймона Вейля в 1913-м — вернули его восточному хребту: только этот холм стоит у постоянного источника, Гиона, и с ним сходится топография самой Библии — от источника до ступеней и Силоамского пруда. Хребет был невелик, около 5 га; большинство учёных принимает это положение, а возраст больших каменных сооружений на его вершине — времён Давида или позднее — спорен."
  uk:
    - "Місто Давида — вузьке пасмо, що йде на південь від Храмової гори в Єрусалимі, між долиною Кедрону на сході та центральною долиною, Тіропеоном, на заході; нині воно лежить у Сільвані, одразу за південним муром Старого міста. Це був найдавніший Єрусалим, євусейське місто, яке Давид узяв близько 1003 р. до н. е. Точка на мапі стоїть на пасмі над джерелом Гіхон, приблизно за 0,5 км на південь від точки на мапі для гори Морія і приблизно за 0,7 км на схід від нинішньої гори Сіон по прямій. В «Історичному глобусі» є стаття про Місто Давида і питання про те, коли Давид узяв Єрусалим; ця відповідь стосується лише того, де воно було."
    - "Назва починається із завоювання: «Давид же зайняв приступом замок Сион, — се Давидове місто» і «осївся Давид на замку та й назвав його городом Давидовим. І утвердив його Давид навкруги, почавши від долини Милло, і з середини». Давида було поховано там, а Соломон вивів ковчег «з Давидового города, се є з Сиону» до Храму на пагорбі на півночі, що показує: це були різні місця. Після вигнання будівники Неемії лагодили мур коло ставка Селаха «до сходів, що вели вниз із міста Давидового», біля південного підніжжя пасма."
    - "Йосиф Флавій уже вважав замком Давида вищий західний пагорб, і століттями переказ поміщав Місто Давида там, на пагорбі, який нині зветься гора Сіон, де досі показують гробницю Давида. Розкопники від Чарльза Воррена 1867 р. до Раймонда Вейля 1913 р. повернули його на східне пасмо: це єдиний пагорб біля вічного джерела, Гіхону, і власна топографія Біблії, від джерела до сходів і ставу Силоам, відповідає йому. Пасмо було малим, близько 5 га; більшість учених приймають таке розміщення, тоді як вік великих кам'яних споруд на його вершині, чи то часів Давида, чи пізніших, оспорюють."
  es:
    - "La Ciudad de David era la estrecha loma que corre hacia el sur desde el Monte del Templo en Jerusalén, entre el valle del Cedrón, al este, y el valle central, el Tiropeón, al oeste; hoy se halla en Silwan, justo fuera de la muralla meridional de la Ciudad Vieja. Era la Jerusalén más antigua, la ciudad jebusea que David tomó hacia el 1003 a. C. El punto del mapa está en la loma sobre la fuente de Gihón, a unos 0,5 km al sur del punto del mapa para el monte Moria y a unos 0,7 km al este del actual monte Sion en línea recta. History Globe tiene un artículo sobre la Ciudad de David y una pregunta sobre cuándo tomó David Jerusalén; esta respuesta se ciñe a dónde estaba."
    - "El nombre empieza con la conquista: «David tomó la fortaleza de Sión, la cual es la ciudad de David», y «David moró en la fortaleza, y púsole por nombre la Ciudad de David: y edificó alrededor, desde Millo para adentro». David fue sepultado allí, y Salomón subió el arca «de la ciudad de David, que es Sión» al Templo, en la colina del norte, lo que muestra que los dos eran lugares distintos. Tras el destierro, los constructores de Nehemías repararon el muro junto al estanque de Siloé «hasta las gradas que descienden de la ciudad de David», al pie meridional de la loma."
    - "Josefo ya tomó la colina occidental, más alta, por la fortaleza de David, y durante siglos la tradición situó allí la Ciudad de David, en la colina hoy llamada monte Sion, donde aún se muestra la tumba de David. Los excavadores, desde Charles Warren en 1867 hasta Raymond Weill en 1913, la devolvieron a la loma oriental: es la única colina junto a una fuente perenne, la Gihón, y la propia topografía de la Biblia, de la fuente a las gradas y al estanque de Siloé, concuerda con ella. La loma era pequeña, de unas 5 ha; la mayoría de los estudiosos aceptan esta ubicación, mientras que se discute la antigüedad de las grandes estructuras de piedra de su cima, si son de tiempos de David o posteriores."
  pt:
    - "A Cidade de Davi era a estreita crista que corre para o sul a partir do monte do Templo, em Jerusalém, entre o vale do Cedrom, a leste, e o vale central, o Tiropeão, a oeste; hoje fica em Silwan, logo fora da muralha sul da Cidade Velha. Era a Jerusalém mais antiga, a cidade jebuseia que Davi tomou por volta de 1003 a.C. O ponto do mapa fica na crista, acima da fonte de Giom, a cerca de 0,5 km ao sul do ponto do mapa para o monte Moriá e a cerca de 0,7 km a leste do atual monte Sião em linha reta. O History Globe tem um artigo sobre a Cidade de Davi e uma pergunta sobre quando Davi tomou Jerusalém; esta resposta trata apenas de onde ficava."
    - "O nome começa com a conquista: “Davi tomou a fortaleza de Sião. Esta é a cidade de Davi”, e “Davi morou na fortaleza e a chamou de cidade de Davi. Davi construiu em redor, desde o Milo e para dentro.” Davi foi sepultado ali, e Salomão trouxe a arca “da cidade de Davi, que é Sião” para o Templo na colina ao norte, o que mostra que os dois eram lugares diferentes. Depois do exílio, os construtores de Neemias repararam a muralha junto ao tanque de Siloé “até os degraus que descem da Cidade de Davi”, ao pé sul da crista."
    - "Josefo já tomava a colina ocidental, mais alta, pela fortaleza de Davi, e por séculos a tradição situou a Cidade de Davi ali, na colina hoje chamada monte Sião, onde ainda se mostra o túmulo de Davi. Os escavadores, de Charles Warren em 1867 a Raymond Weill em 1913, a devolveram à crista oriental: é a única colina junto a uma fonte perene, a Giom, e a própria topografia da Bíblia, da fonte aos degraus e ao tanque de Siloé, se ajusta a ela. A crista era pequena, de cerca de 5 ha; a maioria dos estudiosos aceita essa localização, enquanto a idade das grandes estruturas de pedra em seu cume, se do tempo de Davi ou posteriores, é disputada."
  de:
    - "Die Stadt Davids war der schmale Höhenrücken, der südlich vom Tempelberg in Jerusalem zwischen dem Kidrontal im Osten und dem Zentraltal, dem Tyropoiontal, im Westen verläuft; heute liegt er in Silwan, unmittelbar außerhalb der Südmauer der Altstadt. Es war das älteste Jerusalem, die jebusitische Stadt, die David um 1003 v. Chr. einnahm. Der Kartenpunkt steht auf dem Rücken über der Gihon-Quelle, in der Luftlinie etwa 0,5 km südlich des Kartenpunkts für den Berg Morija und etwa 0,7 km östlich des heutigen Bergs Zion. History Globe hat einen Artikel über die Stadt Davids und eine Frage dazu, wann David Jerusalem einnahm; diese Antwort beschränkt sich darauf, wo sie lag."
    - "Der Name beginnt mit der Eroberung: „David aber gewann die Burg Zion, das ist Davids Stadt“, und „Also wohnte David auf der Burg und hieß sie Davids Stadt. Und David baute ringsumher von Millo an einwärts.“ David wurde dort begraben, und Salomo brachte die Lade „aus der Stadt Davids, das ist Zion“ hinauf zum Tempel auf dem Hügel im Norden, was zeigt, dass beide verschiedene Orte waren. Nach dem Exil besserten Nehemias Bauleute die Mauer am Teich Siloah aus „bis an die Stufen, die von der Stadt Davids herabgehen“, am Südfuß des Rückens."
    - "Schon Josephus hielt den höheren Westhügel für Davids Burg, und jahrhundertelang setzte die Überlieferung die Stadt Davids dorthin, auf den Hügel, der heute Berg Zion heißt, wo noch immer Davids Grab gezeigt wird. Ausgräber von Charles Warren 1867 bis Raymond Weill 1913 brachten sie auf den Ostrücken zurück: Er ist der einzige Hügel neben einer ganzjährigen Quelle, dem Gihon, und die Topografie der Bibel selbst, von der Quelle bis zu den Stufen und zum Siloah-Teich, passt zu ihm. Der Rücken war klein, etwa 5 ha; die meisten Gelehrten akzeptieren diese Verortung, während das Alter der großen Steinbauten auf seinem Gipfel, ob aus Davids Zeit oder später, umstritten ist."
  fr:
    - "La Cité de David était l’étroite crête qui court vers le sud depuis le mont du Temple à Jérusalem, entre la vallée du Cédron à l’est et la vallée centrale, le Tyropéon, à l’ouest ; elle se trouve aujourd’hui à Silwan, juste hors du rempart sud de la vieille ville. C’était la plus ancienne Jérusalem, la ville jébusienne que David prit vers 1003 av. J.-C. Le point de la carte se trouve sur la crête, au-dessus de la source de Guihon, à environ 0,5 km au sud du point de la carte pour le mont Morija et à environ 0,7 km à l’est de l’actuel mont Sion à vol d’oiseau. History Globe consacre un article à la Cité de David et une question à la date à laquelle David prit Jérusalem ; cette réponse se limite à son emplacement."
    - "Le nom commence avec la conquête : « David s’empara de la forteresse de Sion : c’est la cité de David », et « David s’établit dans la forteresse, qu’il appela cité de David. Il fit de tous côtés des constructions, en dehors et en dedans de Millo. » David y fut enterré, et Salomon fit monter l’arche « de la cité de David, qui est Sion » vers le Temple, sur la colline au nord, ce qui montre que les deux étaient des lieux différents. Après l’exil, les bâtisseurs de Néhémie réparèrent le mur de l’étang de Siloé « jusqu’aux degrés qui descendent de la cité de David », au pied sud de la crête."
    - "Flavius Josèphe prenait déjà la colline occidentale, plus haute, pour la forteresse de David, et pendant des siècles la tradition plaça la Cité de David à cet endroit, sur la colline appelée aujourd’hui mont Sion, où l’on montre encore le tombeau de David. Les fouilleurs, de Charles Warren en 1867 à Raymond Weill en 1913, l’ont rendue à la crête orientale : c’est la seule colline à côté d’une source pérenne, le Guihon, et la topographie de la Bible elle-même, de la source aux degrés et au bassin de Siloé, s’y accorde. La crête était petite, environ 5 ha ; la plupart des spécialistes admettent cet emplacement, tandis que l’âge des grandes structures de pierre à son sommet, du temps de David ou plus tardives, est discuté."
  pl:
    - "Miasto Dawida było wąskim grzbietem biegnącym na południe od Wzgórza Świątynnego w Jerozolimie, między doliną Cedronu na wschodzie a doliną centralną, Tyropoeon, na zachodzie; dziś leży w Silwanie, tuż za południowym murem Starego Miasta. Była to najstarsza Jerozolima, jebusyckie miasto, które Dawid zdobył około 1003 p.n.e. Punkt na mapie stoi na grzbiecie nad źródłem Gichon, około 0,5 km na południe od punktu na mapie dla Góry Moria i około 0,7 km na wschód od dzisiejszej góry Syjon w linii prostej. History Globe ma artykuł o Mieście Dawida i pytanie o to, kiedy Dawid zdobył Jerozolimę; ta odpowiedź ogranicza się do jego położenia."
    - "Nazwa zaczyna się od podboju: „Wszakże wziął Dawid zamek Syoński, a toć jest miasto Dawidowe”, i „mieszkał Dawid na onym zamku a przezwał go miastem Dawidowem, a pobudował je Dawid wszędy w koło od Mello, i wewnątrz”. Dawid został tam pochowany, a Salomon sprowadził arkę „z miasta Dawidowego, które jest Syon” do Świątyni na wzgórzu na północy, co pokazuje, że były to różne miejsca. Po wygnaniu budowniczowie Nehemiasza naprawili mur przy sadzawce Siloe „aż do schodu, po którym schodzą z miasta Dawidowego”, u południowego podnóża grzbietu."
    - "Józef Flawiusz już uważał wyższe zachodnie wzgórze za twierdzę Dawida i przez wieki tradycja umieszczała tam Miasto Dawida, na wzgórzu zwanym dziś Syjon, gdzie wciąż pokazuje się grób Dawida. Archeolodzy od Charlesa Warrena w 1867 do Raymonda Weilla w 1913 przywrócili je wschodniemu grzbietowi: jest to jedyne wzgórze obok stałego źródła, Gichon, i pasuje do niego własna topografia Biblii, od źródła do schodów i sadzawki Siloe. Grzbiet był mały, około 5 ha; większość uczonych przyjmuje to umiejscowienie, natomiast wiek wielkich kamiennych budowli na jego szczycie, czy z czasów Dawida, czy późniejszych, jest sporny."
  it:
    - "La Città di Davide era lo stretto crinale che corre a sud dal Monte del Tempio a Gerusalemme, tra la valle del Cedron a est e la valle centrale, il Tiropeo, a ovest; oggi si trova a Silwan, subito fuori dalle mura meridionali della Città Vecchia. Era la Gerusalemme più antica, la città gebusea che Davide prese verso il 1003 a.C. Il punto della mappa si trova sul crinale sopra la sorgente di Ghicon, a circa 0,5 km a sud del punto della mappa per il Monte Moria e a circa 0,7 km a est dell’odierno Monte Sion in linea d’aria. History Globe ha un articolo sulla Città di Davide e una domanda su quando Davide prese Gerusalemme; questa risposta si limita a dove si trovava."
    - "Il nome inizia con la conquista: «Davide prese la fortezza di Sion, che è la città di Davide», e «Davide abitò nella fortezza e la chiamò la città di Davide; e vi fece attorno delle costruzioni cominciando da Millo, e nell’interno». Davide vi fu sepolto, e Salomone portò su l’arca «dalla città di Davide, cioè da Sion» al Tempio sul colle a nord, il che mostra che i due erano luoghi diversi. Dopo l’esilio i costruttori di Neemia riparavano il muro presso la piscina di Siloe «fino alla scalinata per cui si scende dalla città di Davide», ai piedi meridionali del crinale."
    - "Già Giuseppe Flavio considerava il colle occidentale più alto come la roccaforte di Davide, e per secoli la tradizione collocò lì la Città di Davide, sul colle oggi chiamato Monte Sion, dove la tomba di Davide è ancora mostrata. Gli scavatori da Charles Warren nel 1867 a Raymond Weill nel 1913 la riportarono sul crinale orientale: è l’unico colle accanto a una sorgente perenne, il Ghicon, e la stessa topografia della Bibbia, dalla sorgente alla scalinata e alla piscina di Siloe, vi si adatta. Il crinale era piccolo, circa 5 ha; la maggior parte degli studiosi accetta questa collocazione, mentre l’età delle grandi strutture in pietra sulla sua sommità, se dei tempi di Davide o posteriori, è discussa."
  cs:
    - "Město Davidovo byl úzký hřeben, který vede na jih od Chrámové hory v Jeruzalémě, mezi údolím Kidronu na východě a středním údolím, Tyropoionem, na západě; dnes leží v Silwánu, hned za jižní hradbou Starého města. Byl to nejstarší Jeruzalém, jebúsejské město, které David dobyl kolem roku 1003 př. n. l. Bod na mapě stojí na hřebeni nad pramenem Gichón, asi 0,5 km jižně od bodu hory Moria a asi 0,7 km východně od dnešní Hory Sijón vzdušnou čarou. History Globe má o Městě Davidově článek a otázku o tom, kdy David dobyl Jeruzalém; tato odpověď se drží jen toho, kde leželo."
    - "Jméno začíná dobytím: „A však vzal David hrad Sion, toť jest město Davidovo“ a „I bydlil David na tom hradě, a nazval jej městem Davidovým; nebo vystavěl je David vůkol od Mello až do vnitřku.“ David tam byl pohřben a Šalomoun přenesl truhlu „z města Davidova, jenž jest Sion“ do chrámu na pahorku na severu, což ukazuje, že šlo o dvě různá místa. Po vyhnanství Nehemjášovi stavitelé opravovali hradbu u rybníka Siloe „od zahrady královské až k stupňům sstoupajícím z města Davidova“, na jižním úpatí hřebene."
    - "Josephus už pokládal vyšší západní pahorek za Davidovu pevnost a po staletí tradice kladla Město Davidovo tam, na pahorek dnes zvaný Hora Sijón, kde se dosud ukazuje Davidův hrob. Vykopávači od Charlese Warrena roku 1867 po Raymonda Weilla roku 1913 je vrátili na východní hřeben: je to jediný pahorek vedle trvalého pramene, Gichónu, a vlastní topografie Bible, od pramene ke schodům a k rybníku Siloe, mu odpovídá. Hřeben byl malý, asi 5 ha; většina badatelů toto umístění přijímá, zatímco stáří velkých kamenných staveb na jeho vrcholu, zda z Davidovy doby, nebo pozdější, je sporné."
  nl:
    - "De Stad van David was de smalle heuvelrug die vanaf de Tempelberg in Jeruzalem naar het zuiden loopt, tussen het Kidrondal in het oosten en het centrale dal, de Tyropoeon, in het westen; tegenwoordig ligt zij in Silwan, net buiten de zuidmuur van de Oude Stad. Het was het oudste Jeruzalem, de Jebusitische stad die David omstreeks 1003 v.Chr. innam. Het punt op de kaart staat op de rug boven de bron Gihon, ongeveer 0,5 km ten zuiden van het punt op de kaart voor de berg Moria en hemelsbreed ongeveer 0,7 km ten oosten van de huidige berg Sion. History Globe heeft een artikel over de Stad van David en een vraag over wanneer David Jeruzalem innam; dit antwoord beperkt zich tot de ligging."
    - "De naam begint met de verovering: “David nam den burg Sion in; dezelve is de stad Davids”, en “Alzo woonde David in den burg en noemde dien Davids stad. En David bouwde rondom van Millo af en binnenwaarts.” David werd daar begraven, en Salomo bracht de ark op “uit de stad Davids, dewelke is Sion” naar de tempel op de heuvel in het noorden, wat laat zien dat de twee verschillende plaatsen waren. Na de ballingschap herstelden de bouwers van Nehemia de muur bij de vijver van Siloam “tot aan de trappen, die afgaan van Davids stad”, aan de zuidelijke voet van de rug."
    - "Josephus hield al de hogere westelijke heuvel voor Davids burcht, en eeuwenlang plaatste de overlevering de Stad van David daar, op de heuvel die nu berg Sion heet, waar het graf van David nog wordt getoond. Opgravers van Charles Warren in 1867 tot Raymond Weill in 1913 brachten haar terug naar de oostelijke rug: het is de enige heuvel naast een bron die jaarrond water geeft, de Gihon, en de eigen topografie van de Bijbel, van de bron tot de trappen en de vijver van Siloam, past erbij. De rug was klein, ongeveer 5 ha; de meeste geleerden aanvaarden deze plaatsbepaling, terwijl de ouderdom van de grote stenen constructies op de top, uit de tijd van David of later, wordt betwist."
  sv:
    - "Davids stad var den smala åsen som löper söderut från Tempelberget i Jerusalem, mellan Kidrondalen i öster och den centrala dalen, Tyropoion, i väster; i dag ligger den i Silwan, strax utanför Gamla stadens södra mur. Den var det äldsta Jerusalem, den jebusitiska staden som David intog omkring 1003 f.Kr. Kartans punkt står på åsen ovanför Gihonkällan, omkring 0,5 km söder om kartans punkt för berget Moria och omkring 0,7 km öster om dagens Sions berg i fågelvägen. History Globe har en artikel om Davids stad och en fråga om när David intog Jerusalem; det här svaret håller sig till var den låg."
    - "Namnet börjar med erövringen: ”David intog likväl Sions borg, det är Davids stad”, och ”Sedan tog David sin boning på borgen och kallade den Davids stad. Där uppförde David byggnader runt omkring, från Millo och vidare inåt.” David blev begraven där, och Salomo förde arken upp ”från Davids stad, det är Sion” till templet på kullen i norr, vilket visar att de två var olika platser. Efter landsflykten reparerade Nehemjas byggare muren vid Siloadammen ”ända fram till trapporna som föra ned från Davids stad”, vid åsens södra fot."
    - "Josefus ansåg redan den högre västra kullen vara Davids fäste, och i århundraden förlade traditionen Davids stad dit, på kullen som nu kallas Sions berg, där Davids grav fortfarande visas. Utgrävare från Charles Warren 1867 till Raymond Weill 1913 återförde den till östra åsen: det är den enda kullen vid en ständigt flödande källa, Gihon, och Bibelns egen topografi, från källan till trapporna och Siloadammen, passar den. Åsen var liten, omkring 5 ha; de flesta forskare godtar denna placering, medan åldern på de stora stenkonstruktionerna på dess topp, om de är från Davids tid eller senare, är omstridd."
  nb:
    - "Davidsbyen var den smale åsryggen som løper sørover fra Tempelplassen i Jerusalem, mellom Kedron-dalen i øst og den sentrale dalen, Tyropoion, i vest; i dag ligger den i Silwan, like utenfor gamlebyens sørmur. Det var det eldste Jerusalem, jebusittbyen som David inntok omkring 1003 f.Kr. Kartets punkt står på åsryggen over Gihon-kilden, omtrent 0,5 km sør for kartets punkt for Moriafjellet og omtrent 0,7 km øst for dagens Sionfjellet i luftlinje. History Globe har en artikkel om Davidsbyen og et spørsmål om når David inntok Jerusalem; dette svaret holder seg til hvor den lå."
    - "Navnet begynner med erobringen: «David inntok allikevel Sions borg, det er Davids stad», og «David tok sin bolig i borgen og kalte den Davids stad; og David bygget rundt omkring fra Milo og innover.» David ble begravd der, og Salomo førte arken opp «fra Davids stad, det er Sion» til tempelet på høyden mot nord, noe som viser at de to var forskjellige steder. Etter eksilet satte Nehemjas byggere muren i stand ved Selah-dammen «helt frem til de trapper som går ned fra Davids stad», ved åsryggens sørlige fot."
    - "Josefus tok allerede den høyere vestre høyden for Davids borg, og i århundrer plasserte tradisjonen Davidsbyen der, på høyden som nå kalles Sionfjellet, der Davids grav fortsatt vises. Utgravere fra Charles Warren i 1867 til Raymond Weill i 1913 førte den tilbake til den østre åsryggen: den er den eneste høyden ved siden av en evigstrømmende kilde, Gihon, og Bibelens egen topografi, fra kilden til trappene og Siloa-dammen, passer. Åsryggen var liten, omtrent 5 ha; de fleste forskere godtar denne plasseringen, mens alderen på de store steinkonstruksjonene på toppen, enten fra Davids tid eller senere, er omstridt."
  tl:
    - "Ang Bayan ni David ay ang makitid na tagaytay na tumatakbo sa timog mula sa Bundok ng Templo sa Jerusalem, sa pagitan ng lambak ng Cedron sa silangan at ng gitnang lambak, ang Tyropoeon, sa kanluran; nasa Silwan ito ngayon, sa labas lamang ng katimugang pader ng Lumang Lungsod. Ito ang pinakamatandang Jerusalem, ang bayang Jebuseo na sinakop ni David noong mga 1003 BK. Nasa tagaytay sa itaas ng bukal ng Gihon ang punto ng mapa, mga 0.5 km sa timog ng punto ng mapa para sa Bundok Moria at mga 0.7 km sa silangan ng Bundok Sion ngayon sa tuwid na guhit. May artikulo ang History Globe tungkol sa Bayan ni David at isang tanong tungkol sa kung kailan sinakop ni David ang Jerusalem; ang sagot na ito ay nakatuon sa kung nasaan ito."
    - "Nagsisimula ang pangalan sa pananakop: “sinakop ni David ang katibayan sa Sion; na siyang bayan ni David”, at “tumahan si David sa katibayan at tinawag na bayan ni David. At itinayo ni David ang kuta sa palibot mula sa Millo, at sa loob.” Doon inilibing si David, at iniahon ni Salomon ang kaban “mula sa bayan ni David na siyang Sion” patungo sa Templo sa burol sa hilaga, na nagpapakitang magkaibang lugar ang dalawa. Pagkatapos ng pagkatapon, ang mga tagapagtayo ni Nehemias ay nag-ayos ng pader sa tabi ng tangke ng Siloe “hanggang sa mga baytang na paibaba mula sa bayan ni David”, sa katimugang paanan ng tagaytay."
    - "Itinuring na ni Josephus na ang mas mataas na kanlurang burol ang kuta ni David, at sa loob ng mga siglo ay inilagay ng tradisyon ang Bayan ni David doon, sa burol na tinatawag ngayong Bundok Sion, kung saan ipinakikita pa rin ang libingan ni David. Ibinalik ito ng mga naghukay, mula kay Charles Warren noong 1867 hanggang kay Raymond Weill noong 1913, sa silangang tagaytay: ito ang tanging burol sa tabi ng bukal na hindi natutuyo, ang Gihon, at umaakma rito ang sariling topograpiya ng Biblia, mula sa bukal hanggang sa mga baytang at sa tangke ng Siloe. Maliit ang tagaytay, mga 5 ha; tinatanggap ng karamihan ng mga iskolar ang paglalagay na ito, samantalang pinagtatalunan ang edad ng malalaking istrukturang bato sa tuktok nito, kung noong panahon ni David o mas huli."
  da:
    - "Davidsbyen var det smalle højdedrag, der løber sydpå fra Tempelbjerget i Jerusalem, mellem Kedron-dalen mod øst og den centrale dal, Tyropoion, mod vest; i dag ligger det i Silwan, lige uden for den gamle bydels sydmur. Det var det ældste Jerusalem, jebusitternes by, som David indtog omkring 1003 f.Kr. Kortets punkt står på højdedraget over Gihon-kilden, ca. 0,5 km syd for kortets punkt for Morija-bjerget og ca. 0,7 km øst for nutidens Zions Bjerg i fugleflugt. History Globe har en artikel om Davidsbyen og et spørgsmål om, hvornår David indtog Jerusalem; dette svar holder sig til, hvor den lå."
    - "Navnet begynder med erobringen: »David indtog Zions Befæstning, det er Davids Stad«, og David boede »i Befæstningen og kaldte den Davids Stad, og David byggede trindt omkring fra Millo af og indadtil.« David blev begravet dér, og Salomo førte arken op »fra Davids Stad, det er Zion« til templet på højen mod nord, hvilket viser, at de to var forskellige steder. Efter eksilet istandsatte Nehemias’ bygmestre muren ved »Sela Dam« indtil »Trapperne, som gaa ned fra Davids Stad«, ved højdedragets sydlige fod."
    - "Josefus tog allerede den højere vestlige høj for Davids borg, og i århundreder placerede traditionen Davidsbyen dér, på bakken, der nu kaldes Zions Bjerg, hvor Davids grav stadig vises. Udgravere fra Charles Warren i 1867 til Raymond Weill i 1913 førte den tilbage til den østlige ryg: Det er den eneste høj ved siden af en evig kilde, Gihon, og Bibelens egen topografi, fra kilden til trapperne og Siloam-dammen, passer til den. Højdedraget var lille, ca. 5 ha; de fleste forskere accepterer denne placering, mens alderen på de store stenkonstruktioner på dens top, om de er fra Davids tid eller senere, er omstridt."
  sr:
    - "Давидов град био је уски гребен који се пружа јужно од Храмовне горе у Јерусалиму, између долине Кедрона на истоку и средишње долине, Тиропеона, на западу; данас лежи у Силвану, одмах изван јужног зида Старог града. Био је најстарији Јерусалим, јебусејски град који је Давид заузео око 1003. п. н. е. Тачка на карти стоји на гребену изнад извора Гион, око 0,5 км јужно од тачке на карти за гору Морију и око 0,7 км источно од данашње горе Сион ваздушном линијом. History Globe има чланак о Давидовом граду и питање о томе када је Давид заузео Јерусалим; овај одговор говори само о томе где се налазио."
    - "Име почиње освајањем: „Давид узе кулу Сион, то је град Давидов“, и „И седе Давид у кули, и назва је градом Давидовим: и погради је Давид унаоколо од Милона и унутра“. Давид је ту сахрањен, а Соломун је пренео ковчег „из града Давидовог, а то је Сион“ у Храм на брду на северу, што показује да су то била два различита места. После прогонства Немијини градитељи поправљали су зид код Силоамског језера „до басамака који силазе из града Давидовог“, у јужном подножју гребена."
    - "Јосиф Флавије већ је узимао западно, више брдо за Давидово упориште, и вековима је предање смештало Давидов град тамо, на брдо које се сада зове Сион, где се Давидов гроб још показује. Ископавачи од Чарлса Ворена 1867. до Рејмона Веја 1913. вратили су га на источни гребен: он је једино брдо поред стално текућег извора, Гиона, а библијска топографија, од извора до степеница и Силоамског језера, одговара му. Гребен је био мали, око 5 ха; већина научника прихвата ово смештање, док је старост великих каменитих грађевина на његовом врху, да ли из Давидовог времена или каснија, спорна."
