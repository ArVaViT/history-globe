id: where-was-caesarea-philippi
question:
  en: "Where was Caesarea Philippi?"
  ru: "Где находилась Кесария Филиппова?"
  uk: "Де була Кесарія Пилипова?"
  es: "¿Dónde estaba Cesarea de Filipo?"
  pt: "Onde ficava Cesareia de Filipe?"
  de: "Wo lag Caesarea Philippi?"
  fr: "Où se trouvait Césarée de Philippe ?"
  pl: "Gdzie leżała Cezarea Filipowa?"
  it: "Dov’era Cesarea di Filippo?"
  nl: "Waar lag Caesarea Filippi?"
  cs: "Kde byla Cesarea Filipova?"
  sv: "Var låg Caesarea Filippi?"
  nb: "Hvor lå Cæsarea Filippi?"
  tl: "Saan ang Cesarea ni Filipo?"
  da: "Hvor lå Cæsarea Filippi?"
  sr: "Где је била Цезареја Филипова?"
  hu: "Hol volt Fülöp Cézáreája?"
  fi: "Missä Filippoksen Kesarea oli?"
  vi: "Sê-sa-rê Phi-líp ở đâu?"
  ro: "Unde se afla Cezareea lui Filip?"
  bg: "Къде се е намирала Кесария Филипова?"
answer:
  en:
    - "Caesarea Philippi lay at the southern foot of Mount Hermon, where one of the main springs of the Jordan flows out from below a cliff and a large cave; the site is today's Banias in the Golan Heights. It is about 40 km north of Capernaum and Bethsaida in a straight line (40 km by the road on the map from Bethsaida) and about 170 km north of Jerusalem; with the district of Tyre and Sidon it is the farthest north that Jesus' journeys reach on the map. It is a different place from Caesarea on the coast, the seat of the Roman governors."
    - '"When Jesus came into the coasts of Caesarea Philippi, he asked his disciples, saying, Whom do men say that I the Son of man am?" Peter answered: "Thou art the Christ, the Son of the living God." In Matthew, Jesus then says to him, "thou art Peter, and upon this rock I will build my church"; Mark places the same exchange on the way to the towns of Caesarea Philippi.'
    - "In the Hellenistic age the cave was sacred to Pan, and the place was called the Panium or Paneas; about 200 BC Antiochus III defeated the Ptolemaic army there. In 20 BC Augustus gave the district to Herod the Great, who built a temple of white stone to the emperor near the cave; where it stood is disputed, in front of the cave or at Omrit a few kilometres away. About 3 BC Herod's son Philip the tetrarch built his capital at the springs and named it Caesarea, called Caesarea Philippi to tell it from the other. Agrippa II later renamed it Neronias, and in AD 70 Titus held games there after the fall of Jerusalem."
  ru:
    - "Кесария Филиппова лежала у южного подножия горы Ермон, там, где из-под скалы и большой пещеры выходит один из главных истоков Иордана; сегодня это Баниас на Голанских высотах. От Капернаума и Вифсаиды до неё около 40 км на север по прямой (40 км по дороге на карте от Вифсаиды), от Иерусалима — около 170 км; вместе с пределами Тира и Сидона это самый дальний север, куда доходят пути Иисуса на карте. Это не та Кесария, что на побережье, где жили римские наместники."
    - "«Придя же в страны Кесарии Филипповой, Иисус спрашивал учеников Своих: за кого люди почитают Меня, Сына Человеческого?» Петр ответил: «Ты — Христос, Сын Бога Живаго». У Матфея Иисус затем говорит ему: «ты — Петр, и на сем камне Я создам Церковь мою»; Марк передаёт тот же разговор по дороге в селения Кесарии Филипповой."
    - "В эллинистическую эпоху пещера была посвящена Пану, а место называлось Панион, или Панеада; около 200 г. до н. э. Антиох III разбил здесь войско Птолемеев. В 20 г. до н. э. Август отдал эту область Ироду Великому, и тот построил у пещеры храм императору из белого камня; где он стоял, спорят — перед пещерой или в Омрите в нескольких километрах оттуда. Около 3 г. до н. э. сын Ирода, четвертовластник Филипп, построил у истоков свою столицу и назвал её Кесарией; её звали Кесарией Филипповой, чтобы отличать от другой. Агриппа II позже переименовал её в Нерониаду, а в 70 г. н. э. Тит устроил здесь зрелища после падения Иерусалима."
  uk:
    - "Кесарія Пилипова лежала біля південного підніжжя гори Гермон, де одне з головних джерел Йордану витікає з-під скелі й великої печери; це місце — нинішній Баніас на Голанських висотах. Вона лежить приблизно за 40 км на північ від Капернауму і Віфсаїди по прямій (40 км дорогою на мапі від Віфсаїди) і приблизно за 170 км на північ від Єрусалиму; разом з округою Тіру й Сідону це найдалі на північ, куди сягають подорожі Ісуса на мапі. Це інше місце, ніж Кесарія на узбережжі, резиденція римських правителів."
    - "«Як же прийшов Ісус у сторони Кесариї Филипової, то питав учеників своїх, глаголючи: За кого мають люде мене, Сина чоловічого?» Петро відповів: «Ти єси Христос, Син Бога живого». У Матвія Ісус тоді каже йому: «ти єси Петр, і на сьому каменї збудую церкву мою»; Марко ставить ту саму розмову на шляху до сіл Кесарії Пилипової."
    - "В елліністичну добу печера була присвячена Пану, а місце називали Паніон або Панеас; близько 200 р. до н. е. Антіох III розбив там птолемеївське військо. 20 р. до н. е. Август віддав округу Іроду Великому, який збудував біля печери храм імператорові з білого каменя; де він стояв, спірно: перед печерою чи в Омриті за кілька кілометрів. Близько 3 р. до н. е. син Ірода, тетрарх Пилип, збудував свою столицю біля джерел і назвав її Кесарією, званою Кесарією Пилиповою, щоб відрізнити від іншої. Агриппа II згодом перейменував її на Неронію, а 70 р. н. е. Тит влаштував там ігри після падіння Єрусалиму."
  es:
    - "Cesarea de Filipo se hallaba al pie sur del monte Hermón, donde una de las fuentes principales del Jordán brota bajo un acantilado y una gran cueva; el lugar es hoy Banias, en los Altos del Golán. Está a unos 40 km al norte de Cafarnaúm y Betsaida en línea recta (40 km por el camino del mapa desde Betsaida) y a unos 170 km al norte de Jerusalén; junto con la región de Tiro y Sidón, es el punto más septentrional que alcanzan los viajes de Jesús en el mapa. Es un lugar distinto de Cesarea de la costa, sede de los gobernadores romanos."
    - "«Y viniendo Jesús á las partes de Cesarea de Filipo, preguntó á sus discípulos, diciendo: ¿Quién dicen los hombres que es el Hijo del hombre?». Pedro respondió: «Tú eres el Cristo, el Hijo del Dios viviente». En Mateo, Jesús le dice entonces: «tú eres Pedro, y sobre esta piedra edificaré mi iglesia»; Marcos sitúa el mismo diálogo cuando salió «por las aldeas de Cesarea de Filipo»."
    - "En la época helenística la cueva estaba consagrada a Pan, y el lugar se llamaba el Panio o Paneas; hacia el 200 a. C. Antíoco III derrotó allí al ejército ptolemaico. En el 20 a. C. Augusto dio la región a Herodes el Grande, que construyó un templo de piedra blanca al emperador cerca de la cueva; dónde se alzaba es discutido, delante de la cueva o en Omrit, a unos pocos kilómetros. Hacia el 3 a. C. Filipo el tetrarca, hijo de Herodes, construyó su capital junto a las fuentes y la llamó Cesarea, llamada Cesarea de Filipo para distinguirla de la otra. Agripa II la renombró más tarde Neronias, y en el 70 d. C. Tito celebró allí juegos tras la caída de Jerusalén."
  pt:
    - "Cesareia de Filipe ficava ao pé sul do monte Hermom, onde uma das principais nascentes do Jordão brota de baixo de um penhasco e de uma grande gruta; o local é hoje Banias, nas colinas de Golã. Fica a cerca de 40 km ao norte de Cafarnaum e Betsaida em linha reta (40 km pela estrada do mapa a partir de Betsaida) e a cerca de 170 km ao norte de Jerusalém; com o distrito de Tiro e Sidom, é o ponto mais ao norte que as viagens de Jesus alcançam no mapa. É um lugar diferente de Cesareia, na costa, sede dos governadores romanos."
    - "“Quando Jesus chegou à região de Cesareia de Filipe, perguntou aos seus discípulos, dizendo: ‘Quem os homens dizem que eu, o Filho do Homem, sou?’” Pedro respondeu: “Tu és o Cristo, o Filho do Deus vivo.” Em Mateus, Jesus lhe diz então: “você é Pedro, e sobre esta pedra edificarei a minha igreja”; Marcos situa o mesmo diálogo no caminho “para as aldeias de Cesareia de Filipe”."
    - "Na época helenística a gruta era consagrada a Pã, e o lugar se chamava Panion ou Paneas; por volta de 200 a.C. Antíoco III derrotou ali o exército ptolomaico. Em 20 a.C. Augusto deu o distrito a Herodes, o Grande, que construiu perto da gruta um templo de pedra branca ao imperador; onde ficava é disputado, diante da gruta ou em Omrit, a poucos quilômetros. Por volta de 3 a.C. o filho de Herodes, Filipe, o tetrarca, construiu sua capital junto às nascentes e a chamou Cesareia, dita de Filipe para distingui-la da outra. Agripa II a rebatizou mais tarde de Neronias, e em 70 d.C. Tito realizou ali jogos depois da queda de Jerusalém."
  de:
    - "Caesarea Philippi lag am Südfuß des Hermon, wo eine der Hauptquellen des Jordan unter einer Felswand und einer großen Höhle hervorfließt; die Stätte ist das heutige Banias auf den Golanhöhen. Es liegt in der Luftlinie etwa 40 km nördlich von Kapernaum und Betsaida (40 km auf der Straße der Karte von Betsaida) und etwa 170 km nördlich von Jerusalem; mit dem Gebiet von Tyrus und Sidon ist es der nördlichste Punkt, den Jesu Reisen auf der Karte erreichen. Es ist ein anderer Ort als Caesarea an der Küste, der Sitz der römischen Statthalter."
    - "„Da kam Jesus in die Gegend der Stadt Cäsarea Philippi und fragte seine Jünger und sprach: Wer sagen die Leute, daß des Menschen Sohn sei?“ Petrus antwortete: „Du bist Christus, des lebendigen Gottes Sohn!“ Bei Matthäus sagt Jesus dann zu ihm: „Du bist Petrus, und auf diesen Felsen will ich bauen meine Gemeinde“; Markus legt dasselbe Gespräch auf den Weg „in die Märkte der Stadt Cäsarea Philippi“."
    - "In hellenistischer Zeit war die Höhle dem Pan geheiligt, und der Ort hieß Panion oder Paneas; um 200 v. Chr. besiegte dort Antiochos III. das ptolemäische Heer. 20 v. Chr. gab Augustus den Bezirk Herodes dem Großen, der nahe der Höhle dem Kaiser einen Tempel aus weißem Stein baute; wo er stand, ist umstritten, vor der Höhle oder in Omrit einige Kilometer entfernt. Um 3 v. Chr. baute Herodes' Sohn Philippus der Vierfürst an den Quellen seine Hauptstadt und nannte sie Caesarea, Caesarea Philippi zur Unterscheidung vom anderen. Agrippa II. benannte sie später in Neronias um, und 70 n. Chr. hielt Titus dort nach dem Fall Jerusalems Spiele ab."
  fr:
    - "Césarée de Philippe se trouvait au pied sud du mont Hermon, là où l’une des principales sources du Jourdain jaillit sous une falaise et une grande grotte ; le site est l’actuel Banias, sur le plateau du Golan. Elle est à environ 40 km au nord de Capernaüm et de Bethsaïda en ligne droite (40 km par la route de la carte depuis Bethsaïda) et à environ 170 km au nord de Jérusalem ; avec la région de Tyr et de Sidon, c’est le point le plus au nord qu’atteignent les voyages de Jésus sur la carte. C’est un autre lieu que Césarée de la côte, siège des gouverneurs romains."
    - "« Jésus, étant arrivé dans le territoire de Césarée de Philippe, demanda à ses disciples : Qui dit-on que je suis, moi, le Fils de l’homme ? » Pierre répondit : « Tu es le Christ, le Fils du Dieu vivant. » Chez Matthieu, Jésus lui dit alors : « je te dis que tu es Pierre, et que sur cette pierre je bâtirai mon Église » ; Marc place le même échange sur le chemin vers les villages de Césarée de Philippe."
    - "À l’époque hellénistique, la grotte était consacrée à Pan, et le lieu s’appelait le Panion ou Panéas ; vers 200 av. J.-C., Antiochus III y vainquit l’armée ptolémaïque. En 20 av. J.-C., Auguste donna la région à Hérode le Grand, qui bâtit près de la grotte un temple de pierre blanche à l’empereur ; son emplacement est discuté, devant la grotte ou à Omrit, à quelques kilomètres. Vers 3 av. J.-C., Philippe le tétrarque, fils d’Hérode, bâtit sa capitale aux sources et la nomma Césarée, dite Césarée de Philippe pour la distinguer de l’autre. Agrippa II la rebaptisa plus tard Néronias, et en 70 apr. J.-C. Titus y donna des jeux après la chute de Jérusalem."
  pl:
    - "Cezarea Filipowa leżała u południowego podnóża Hermonu, gdzie jedno z głównych źródeł Jordanu wypływa spod skały i wielkiej jaskini; miejsce to dzisiejszy Banias na Wzgórzach Golan. Leży około 40 km na północ od Kafarnaum i Betsaidy w linii prostej (40 km drogą z mapy od Betsaidy) i około 170 km na północ od Jerozolimy; wraz z okręgiem Tyru i Sydonu jest najdalej na północ, dokąd sięgają podróże Jezusa na mapie. To inne miejsce niż Cezarea na wybrzeżu, siedziba rzymskich namiestników."
    - "„A gdy przyszedł Jezus w strony Cezaryi Filippowej, pytał uczniów swoich, mówiąc: Kimże mię powiadają być ludzie Syna człowieczego?” Piotr odpowiedział: „Tyś jest Chrystus, on Syn Boga żywego.” U Mateusza Jezus mówi mu potem: „żeś ty jest Piotr; a na tej opoce zbuduję kościół mój”; Marek umieszcza tę samą rozmowę w drodze do miasteczek Cezarei Filipowej."
    - "W epoce hellenistycznej jaskinia była poświęcona Panowi, a miejsce zwano Panion lub Paneas; około 200 p.n.e. Antioch III pokonał tam armię Ptolemeuszy. W 20 p.n.e. August oddał okręg Herodowi Wielkiemu, który zbudował cesarzowi świątynię z białego kamienia przy jaskini; gdzie stała, jest sporne, przed jaskinią czy w Omrit kilka kilometrów dalej. Około 3 p.n.e. syn Heroda, tetrarcha Filip, zbudował swoją stolicę przy źródłach i nazwał ją Cezareą, zwaną Cezareą Filipową dla odróżnienia od drugiej. Agryppa II przemianował ją później na Neronias, a w 70 n.e. Tytus urządził tam igrzyska po upadku Jerozolimy."
  it:
    - "Cesarea di Filippo sorgeva ai piedi meridionali del Monte Ermon, dove una delle principali sorgenti del Giordano sgorga da sotto una rupe e una grande grotta; il sito è oggi Banias, sulle alture del Golan. Dista circa 40 km a nord di Cafarnao e Betsaida in linea retta (40 km lungo la strada della mappa da Betsaida) e circa 170 km a nord di Gerusalemme; con il distretto di Tiro e Sidone è il punto più settentrionale raggiunto dai viaggi di Gesù sulla mappa. È un luogo diverso da Cesarea sulla costa, sede dei governatori romani."
    - "«Gesù, venuto nelle parti di Cesarea di Filippo, domandò ai suoi discepoli: Chi dice la gente che sia il Figliuol dell’uomo?» Pietro rispose: «Tu sei il Cristo, il Figliuol dell’Iddio vivente». In Matteo Gesù gli dice poi: «Tu sei Pietro, e su questa pietra edificherò la mia Chiesa»; Marco colloca lo stesso scambio sulla via verso i villaggi di Cesarea di Filippo."
    - "In epoca ellenistica la grotta era sacra a Pan, e il luogo si chiamava Panio o Paneas; intorno al 200 a.C. Antioco III vi sconfisse l’esercito tolemaico. Nel 20 a.C. Augusto diede il distretto a Erode il Grande, che costruì un tempio di pietra bianca all’imperatore presso la grotta; dove sorgesse è discusso, davanti alla grotta o a Omrit, a pochi chilometri. Verso il 3 a.C. il figlio di Erode, Filippo il tetrarca, costruì presso le sorgenti la sua capitale e la chiamò Cesarea, detta Cesarea di Filippo per distinguerla dall’altra. Agrippa II la ribattezzò poi Neronia, e nel 70 d.C. Tito vi tenne giochi dopo la caduta di Gerusalemme."
  nl:
    - "Caesarea Filippi lag aan de zuidvoet van de Hermon, waar een van de belangrijkste bronnen van de Jordaan onder een rotswand en een grote grot uitstroomt; de plaats is het huidige Banias op de Golanhoogten. Het ligt hemelsbreed ongeveer 40 km ten noorden van Kafarnaüm en Bethsaïda (40 km langs de weg op de kaart vanaf Bethsaïda) en ongeveer 170 km ten noorden van Jeruzalem; samen met het gebied van Tyrus en Sidon is het het noordelijkste punt dat Jezus’ reizen op de kaart bereiken. Het is een andere plaats dan Caesarea aan de kust, de zetel van de Romeinse gouverneurs."
    - "“Als nu Jezus gekomen was in de delen van Cesarea Filippi, vraagde Hij Zijn discipelen, zeggende: Wie zeggen de mensen, dat Ik, de Zoon des mensen, ben?” Petrus antwoordde: “Gij zijt de Christus, de Zoon des levenden Gods.” Bij Mattheüs zegt Jezus daarop tot hem: “dat gij zijt Petrus, en op deze petra zal Ik Mijn gemeente bouwen”; Marcus plaatst hetzelfde gesprek op de weg naar de dorpen van Caesarea Filippi."
    - "In de hellenistische tijd was de grot aan Pan gewijd en heette de plaats het Panium of Paneas; omstreeks 200 v.Chr. versloeg Antiochus III daar het Ptolemaeïsche leger. In 20 v.Chr. gaf Augustus het gebied aan Herodes de Grote, die bij de grot een tempel van witte steen voor de keizer bouwde; waar die stond, is omstreden, voor de grot of bij Omrit enkele kilometers verderop. Omstreeks 3 v.Chr. bouwde Herodes’ zoon Filippus de viervorst zijn hoofdstad bij de bronnen en noemde haar Caesarea, Caesarea Filippi genoemd om haar van de andere te onderscheiden. Agrippa II noemde haar later Neronias, en in 70 n.Chr. hield Titus er spelen na de val van Jeruzalem."
  cs:
    - "Cesarea Filipova ležela na jižním úpatí Hermonu, kde jeden z hlavních pramenů Jordánu vytéká zpod skály a velké jeskyně; místo je dnešní Baníás na Golanských výšinách. Je asi 40 km severně od Kafarnaa a Betsaidy vzdušnou čarou (40 km po silnici na mapě z Betsaidy) a asi 170 km severně od Jeruzaléma; spolu s krajem Týru a Sidónu je to nejsevernější bod, kam Ježíšovy cesty na mapě sahají. Je to jiné místo než Cesarea na pobřeží, sídlo římských místodržících."
    - "„Přišed pak Ježíš do krajin Cesaree Filipovy, otázal se učedlníků svých, řka: Kým mne praví lidé býti, mne Syna člověka?“ Petr odpověděl: „Ty jsi Kristus, Syn Boha živého.“ U Matouše mu Ježíš říká: „jsi ty Petr, a na téť skále vzdělám církev svou“; Marek klade tutéž rozmluvu na cestu do městeček Cesaree Filipovy."
    - "V helénistické době byla jeskyně zasvěcena Panovi a místo se jmenovalo Panium či Paneas; asi roku 200 př. n. l. tam Antiochos III. porazil ptolemaiovské vojsko. Roku 20 př. n. l. dal Augustus kraj Herodovi Velikému, který u jeskyně postavil císaři chrám z bílého kamene; kde stál, je sporné, před jeskyní nebo v Omritu několik kilometrů dál. Asi roku 3 př. n. l. postavil Herodův syn Filip, tetrarcha, u pramenů své hlavní město a nazval je Cesarea, zvanou Cesarea Filipova, aby se odlišila od druhé. Agrippa II. je později přejmenoval na Neronias a roku 70 n. l. tam Titus po pádu Jeruzaléma pořádal hry."
  sv:
    - "Caesarea Filippi låg vid södra foten av Hermon, där en av Jordans huvudkällor rinner ut under en klippvägg och en stor grotta; platsen är dagens Banias i Golanhöjderna. Den ligger omkring 40 km norr om Kafarnaum och Betsaida fågelvägen (40 km via vägen på kartan från Betsaida) och omkring 170 km norr om Jerusalem; tillsammans med distriktet Tyros och Sidon är det längst norrut som Jesu färder når på kartan. Det är en annan plats än Caesarea vid kusten, de romerska ståthållarnas säte."
    - "”Men när Jesus kom till trakten av Cesarea Filippi, frågade han sina lärjungar och sade: Vem säger folket Människosonen vara?” Petrus svarade: ”Du är Messias, den levande Gudens Son.” Hos Matteus säger Jesus sedan till honom: ”du är Petrus; och på denna klippa skall jag bygga min församling”; Markus förlägger samma samtal på vägen till byarna vid Caesarea Filippi."
    - "Under den hellenistiska tiden var grottan helgad åt Pan, och platsen kallades Panion eller Paneas; omkring 200 f.Kr. besegrade Antiochos III den ptolemaiska hären där. År 20 f.Kr. gav Augustus distriktet till Herodes den store, som byggde ett tempel av vit sten åt kejsaren nära grottan; var det stod är omstritt, framför grottan eller vid Omrit några kilometer bort. Omkring 3 f.Kr. byggde Herodes son, tetrarken Filippos, sin huvudstad vid källorna och gav den namnet Caesarea, kallad Caesarea Filippi för att skilja den från den andra. Agrippa II döpte senare om den till Neronias, och år 70 e.Kr. höll Titus spel där efter Jerusalems fall."
  nb:
    - "Cæsarea Filippi lå ved den sørlige foten av Hermon, der en av Jordans hovedkilder renner ut under en klippevegg og en stor hule; stedet er i dag Banias i Golan. Det ligger omtrent 40 km nord for Kapernaum og Betsaida i luftlinje (40 km langs veien på kartet fra Betsaida) og omtrent 170 km nord for Jerusalem; sammen med distriktet Tyros og Sidon er det det nordligste Jesu reiser når på kartet. Det er et annet sted enn Cæsarea ved kysten, de romerske landshøvdingenes sete."
    - "«Men da Jesus var kommet til landet ved Cesarea Filippi, spurte han sine disipler og sa: Hvem sier folk at Menneskesønnen er?» Peter svarte: «Du er Messias, den levende Guds Sønn.» Hos Matteus sier Jesus så til ham: «du er Peter; og på denne klippe vil jeg bygge min menighet»; Markus legger den samme samtalen til veien til byene omkring Cæsarea Filippi."
    - "I den hellenistiske tiden var hulen viet til Pan, og stedet ble kalt Panion eller Paneas; omkring 200 f.Kr. beseiret Antiokhos III den ptolemeiske hæren der. I 20 f.Kr. ga Augustus distriktet til Herodes den store, som bygget et tempel av hvit stein for keiseren nær hulen; hvor det sto, er omstridt, foran hulen eller ved Omrit noen kilometer unna. Omkring 3 f.Kr. bygget Herodes' sønn tetrarken Filip sin hovedstad ved kildene og kalte den Cæsarea, kalt Cæsarea Filippi for å skille den fra den andre. Agrippa II omdøpte den senere til Neronias, og i 70 e.Kr. holdt Titus leker der etter Jerusalems fall."
  tl:
    - "Nasa timog na paanan ng Bundok Hermon ang Cesarea ni Filipo, kung saan umaagos ang isa sa mga pangunahing bukal ng Jordan mula sa ilalim ng bangin at malaking yungib; ang pook ay ang Banias sa Kataasan ng Golan ngayon. Ito ay mga 40 km sa hilaga ng Capernaum at Bethsaida sa tuwid na guhit (40 km sa daan sa mapa mula Bethsaida) at mga 170 km sa hilaga ng Jerusalem; kasama ang distrito ng Tiro at Sidon, ito ang pinakamalayong hilaga na naaabot ng mga paglalakbay ni Jesus sa mapa. Ibang lugar ito mula sa Cesarea sa baybayin, ang luklukan ng mga gobernador na Romano."
    - "“Nang dumating nga si Jesus sa mga sakop ng Cesarea ni Filipo, ay itinanong niya sa kaniyang mga alagad, na sinasabi, Ano baga ang sabi ng mga tao kung sino ang Anak ng tao?” Sumagot si Pedro: “Ikaw ang Cristo, Ang anak ng Dios na buhay.” Sa Mateo, sinabi pagkatapos ni Jesus sa kaniya, “ikaw ay Pedro, at sa ibabaw ng batong ito ay itatayo ko ang aking iglesia”; inilalagay ni Marcos ang parehong palitan sa daan patungo sa mga bayan ng Cesarea ni Filipo."
    - "Sa panahong Helenistiko, sagrado kay Pan ang yungib, at tinawag ang lugar na Panium o Paneas; mga 200 BK ay tinalo roon ni Antioco III ang hukbong Ptolemeo. Noong 20 BK, ibinigay ni Augusto ang distrito kay Herodes na Dakila, na nagtayo ng templong batong puti para sa emperador malapit sa yungib; pinagtatalunan kung saan ito nakatayo, sa harap ng yungib o sa Omrit ilang kilometro ang layo. Mga 3 BK, itinayo ni Felipe na tetrarka, anak ni Herodes, ang kaniyang kabisera sa mga bukal at pinangalanang Cesarea, na tinawag na Cesarea ni Filipo upang makilala sa isa pa. Kalaunan ay pinalitan ito ni Agripa II ng pangalang Neronias, at noong 70 AD ay nagdaos si Tito roon ng mga laro pagkabagsak ng Jerusalem."
  da:
    - "Cæsarea Filippi lå ved den sydlige fod af Hermon, hvor en af Jordans hovedkilder strømmer ud fra neden af en klippevæg og en stor hule; stedet er nutidens Banias på Golanhøjderne. Det ligger omkring 40 km nord for Kapernaum og Betsajda i luftlinje (40 km ad vejen på kortet fra Betsajda) og omkring 170 km nord for Jerusalem; sammen med distriktet Tyrus og Sidon er det det nordligste, Jesu rejser når på kortet. Det er et andet sted end Cæsarea ved kysten, de romerske landshøvdingers sæde."
    - "»Men da Jesus var kommen til Egnen ved Kæsarea Filippi, spurgte han sine Disciple og sagde: ›Hvem sige Folk, at Menneskesønnen er?‹« Peter svarede: »Du er Kristus, den levende Guds Søn.« Hos Mattæus siger Jesus derefter til ham: »du er Petrus, og paa denne Klippe vil jeg bygge min Menighed«; Markus placerer den samme samtale på vejen til Cæsarea Filippis landsbyer."
    - "I den hellenistiske tid var hulen helliget Pan, og stedet blev kaldt Panion eller Paneas; omkring 200 f.Kr. besejrede Antiochus III den ptolemæiske hær dér. I 20 f.Kr. gav Augustus distriktet til Herodes den Store, som byggede et tempel af hvid sten for kejseren nær hulen; hvor det stod, er omstridt, foran hulen eller ved Omrit nogle få kilometer væk. Omkring 3 f.Kr. byggede Herodes' søn, tetrarken Filip, sin hovedstad ved kilderne og kaldte den Cæsarea, kaldet Cæsarea Filippi for at skelne den fra den anden. Agrippa II omdøbte den senere Neronias, og i 70 e.Kr. holdt Titus lege dér efter Jerusalems fald."
  sr:
    - "Цезареја Филипова лежала је у јужном подножју Хермона, где један од главних извора Јордана истиче испод литице и велике пећине; налазиште је данашњи Банијас на Голанској висоравни. Налази се око 40 км северно од Капернаума и Витсаиде правом линијом (40 км путем на карти од Витсаиде) и око 170 км северно од Јерусалима; заједно са крајем Тира и Сидона то је најсевернија тачка до које досежу Исусова путовања на карти. То није иста Цезареја као она на обали, седишта римских намесника."
    - "„А кад дође Исус у околине Ћесарије Филипове, питаше ученике своје говорећи: Ко говоре људи да је Син човечији?“ Петар је одговорио: „Ти си Христос, Син Бога Живога.“ Код Матеја му Исус затим каже: „ти си Петар, и на овом камену сазидаћу цркву своју“; Марко исти разговор смешта на пут у „села Ћесарије Филипове“."
    - "У хеленистичко доба пећина је била посвећена Пану, а место се звало Паниј или Панеас; око 200. п. н. е. Антиох III је тамо поразио птолемејску војску. Године 20. п. н. е. Август је област дао Ироду Великом, који је крај пећине подигао храм од белог камена цару; где је стајао, спорно је, испред пећине или у Омриту неколико километара даље. Око 3. п. н. е. Иродов син Филип тетрарх подигао је на изворима своју престоницу и назвао је Цезарејом, која се звала Цезареја Филипова да се разликује од друге. Агрипа II ју је касније преименовао у Неронијаду, а 70. н. е. Тит је ту приредио игре после пада Јерусалима."
  hu:
    - "Fülöp Cézáreája a Hermon déli lábánál feküdt, ahol a Jordán egyik fő forrása egy szikla és egy nagy barlang alól tör elő; a hely a mai Baniász a Gólán-fennsíkon. Kapernaumtól és Betszaidától egyenes vonalban mintegy 40 km-re északra van (Betszaidától a térképen látható úton 40 km), Jeruzsálemtől pedig mintegy 170 km-re északra; Tírusszal és Szidónnal együtt a legészakibb pont, amelyet Jézus útjai a térképen elérnek. Különbözik a parti Cézáreától, a római helytartók székhelyétől."
    - "„Mikor pedig Jézus Czézárea Filippi környékére méne, megkérdé tanítványait, mondván: Engemet, embernek Fiát, kinek mondanak az emberek?” Péter így felelt: „Te vagy a Krisztus, az élő Istennek Fia.” Máténál Jézus ezután azt mondja neki: „te Péter vagy, és ezen a kősziklán építem fel az én anyaszentegyházamat”; Márk ugyanezt a párbeszédet Fülöp Cézáreája falvai felé vezető útra teszi."
    - "A hellénisztikus korban a barlang Pán szent helye volt, a helyet Panionnak vagy Paneásznak hívták; Kr. e. 200 körül III. Antiokhosz itt győzte le a Ptolemaiosz-sereget. Kr. e. 20-ban Augusztus a kerületet Nagy Heródesnek adta, aki fehér kőből templomot épített a császárnak a barlang közelében; hogy hol állt, vitatott, a barlang előtt vagy a néhány kilométerre lévő Omritnál. Kr. e. 3 körül Heródes fia, Fülöp negyedes fejedelem a forrásoknál építette fővárosát és Cézáreának nevezte, a másiktól való megkülönböztetésül Fülöp Cézáreájának hívták. II. Agrippa később Neronias névre keresztelte át, és Kr. u. 70-ben Titusz játékokat tartott itt Jeruzsálem eleste után."
  fi:
    - "Filippoksen Kesarea sijaitsi Hermonvuoren eteläjuurella, missä yksi Jordanin päälähteistä virtaa ulos kallion ja suuren luolan alta; paikka on nykyinen Banias Golanin kukkuloilla. Se on noin 40 km Kapernaumista ja Betsaidasta pohjoiseen linnuntietä (40 km kartan tietä pitkin Betsaidasta) ja noin 170 km Jerusalemista pohjoiseen; Tyroksen ja Sidonin alueen ohella se on pohjoisin paikka, johon Jeesuksen matkat kartalla ulottuvat. Se on eri paikka kuin rannikon Kesarea, Rooman käskynhaltijoiden asuinpaikka."
    - "”Kun Jeesus tuli Filippuksen Kesarean tienoille, kysyi hän opetuslapsiltaan sanoen: Kenen ihmiset sanovat Ihmisen Pojan olevan?” Pietari vastasi: ”Sinä olet Kristus, elävän Jumalan Poika.” Matteuksen mukaan Jeesus sanoo sitten hänelle: ”sinä olet Pietari, ja tälle kalliolle minä rakennan seurakuntani”; Markus sijoittaa saman keskustelun matkalle Filippuksen Kesarean kyliin."
    - "Hellenistisellä ajalla luola oli omistettu Panille, ja paikkaa kutsuttiin Panioniksi tai Paneasiksi; noin 200 eaa. Antiokhos III voitti siellä Ptolemaiosten armeijan. Vuonna 20 eaa. Augustus antoi alueen Herodes Suurelle, joka rakensi keisarille valkoisesta kivestä temppelin luolan lähelle; missä se seisoi, on kiistanalaista, luolan edessä vai Omritissa muutaman kilometrin päässä. Noin 3 eaa. Herodeksen poika, tetrarkka Filippos, rakensi pääkaupunkinsa lähteille ja nimesi sen Kesareaksi, jota kutsuttiin Filippoksen Kesareaksi erotukseksi toisesta. Agrippa II nimesi sen myöhemmin Neroniaksi, ja vuonna 70 jaa. Titus piti siellä kisoja Jerusalemin kukistumisen jälkeen."
  vi:
    - "Sê-sa-rê Phi-líp nằm ở chân nam núi Hẹt-môn, nơi một trong các nguồn chính của sông Giô-đanh chảy ra từ dưới một vách đá và một hang lớn; địa điểm là Banias ngày nay trên Cao nguyên Gô-lan. Nó cách Ca-bê-na-um và Bết-sai-đa khoảng 40 km về phía bắc theo đường thẳng (40 km theo đường trên bản đồ từ Bết-sai-đa) và cách Giê-ru-sa-lem khoảng 170 km về phía bắc; cùng với vùng Ty-rơ và Si-đôn, đó là nơi xa nhất về phía bắc mà các chuyến đi của Giê-su đạt tới trên bản đồ. Nó là nơi khác với Sê-sa-rê trên bờ biển, trụ sở các tổng đốc La Mã."
    - "“Khi Đức Chúa Jêsus đã vào địa phận thành Sê-sa-rê Phi-líp, bèn hỏi môn đồ, mà rằng: Theo lời người ta nói thì Con người là ai?” Phi-e-rơ thưa: “Chúa là Đấng Christ, con Đức Chúa Trời hằng sống.” Trong Ma-thi-ơ, Giê-su rồi nói với ông: “Ngươi là Phi-e-rơ, ta sẽ lập Hội thánh ta trên đá nầy”; Mác đặt cùng cuộc đối thoại trên đường “đến trong các làng gần thành Sê-sa-rê Phi-líp”."
    - "Trong thời Hy Lạp hóa, hang thiêng liêng đối với Pan, và nơi này gọi là Panium hay Paneas; khoảng 200 TCN, Antiochus III đánh bại quân Ptolemy tại đó. Năm 20 TCN, Au-gút-tơ ban vùng này cho Hê-rốt Đại đế, người xây một đền bằng đá trắng cho hoàng đế gần hang; nó đứng ở đâu còn tranh luận, trước hang hay tại Omrit cách vài kilômét. Khoảng 3 TCN, con trai Hê-rốt là Phi-líp, vua chư hầu, xây kinh đô của mình tại các suối và đặt tên Sê-sa-rê, gọi là Sê-sa-rê Phi-líp để phân biệt với thành kia. Ạc-ríp-ba II về sau đổi tên là Neronias, và năm 70 Tít tổ chức các cuộc thi đấu ở đó sau khi Giê-ru-sa-lem thất thủ."
  ro:
    - "Cezareea lui Filip se afla la poalele de sud ale Muntelui Hermon, unde unul dintre principalele izvoare ale Iordanului țâșnește de sub o stâncă și o peșteră mare; locul este Banias de azi, în Înălțimile Golan. Se află la circa 40 km nord de Capernaum și Betsaida în linie dreaptă (40 km pe drumul de pe hartă de la Betsaida) și la circa 170 km nord de Ierusalim; împreună cu ținutul Tirului și al Sidonului, este cel mai nordic punct la care ajung călătoriile lui Isus pe hartă. Este alt loc decât Cezareea de pe coastă, reședința guvernatorilor romani."
    - "„Iar venind Iisus în părțile Chesariei lui Filip, au întrebat pre ucenicii săi zicând: cine’mi zic oamenii că sunt eu, Fiul Omului?” Petru a răspuns: „tu ești Hristosul, Fiul lui Dumnezeu celui viu.” La Matei, Isus îi spune atunci: „tu ești Petru, și pre această piatră voiu zidì Biserica mea”; Marcu așază același schimb pe drumul spre satele Cezareei lui Filip."
    - "În epoca elenistică, peștera era închinată lui Pan, iar locul se numea Panion sau Paneas; circa 200 î.Hr., Antioh al III-lea a învins acolo armata ptolemaică. În 20 î.Hr., Augustus a dat ținutul lui Irod cel Mare, care a zidit lângă peșteră un templu de piatră albă închinat împăratului; unde a stat este disputat, în fața peșterii sau la Omrit, la câțiva kilometri. Circa 3 î.Hr., fiul lui Irod, tetrarhul Filip, și-a zidit capitala la izvoare și a numit-o Cezareea, numită Cezareea lui Filip ca să fie deosebită de cealaltă. Agripa al II-lea a redenumit-o mai târziu Neroniada, iar în 70 d.Hr. Tit a ținut acolo jocuri după căderea Ierusalimului."
  bg:
    - "Кесария Филипова лежала в южното подножие на Ермон, където един от главните извори на Йордан излиза изпод скала и голяма пещера; мястото е днешният Банияс на Голанските възвишения. То е на около 40 км северно от Капернаум и Витсаида по права линия (40 км по пътя на картата от Витсаида) и на около 170 км северно от Йерусалим; заедно с областта на Тир и Сидон това е най-северният край, до който стигат пътуванията на Исус на картата. Това е различно място от Кесария на брега, седалището на римските управители."
    - "„Когато дойде Исус в страната на Кесария Филипова, питаше учениците си, и казваше: Мене, Сина человеческаго, кого ме казват человеците че съм?“ Петър отговорил: „Ти си Христос, Син на Бога живаго.“ При Матей Исус тогава му казва: „ти си Петър, и на този камик ще съзида моята църква“; Марко поставя същия разговор по пътя към селата на Кесария Филипова."
    - "В елинистическата епоха пещерата била посветена на Пан, а мястото се наричало Панион или Панеас; около 200 г. пр.н.е. Антиох III разбил там птолемеевата войска. През 20 г. пр.н.е. Август дал областта на Ирод Велики, който построил храм от бял камък в чест на императора близо до пещерата; къде е стоял, е спорно — пред пещерата или при Омрит, на няколко километра. Около 3 г. пр.н.е. синът на Ирод, тетрархът Филип, построил столицата си при изворите и я нарекъл Кесария, наричана Кесария Филипова, за да се различава от другата. По-късно Агрипа II я преименувал на Нерониада, а през 70 г. н.е. Тит устроил там игри след падането на Йерусалим."
