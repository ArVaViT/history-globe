id: where-was-sychar
question:
  en: "Where was Sychar, the Samaritan town of John 4?"
  ru: "Где находился Сихарь, самарийский город из 4-й главы Иоанна?"
  uk: "Де був Сихар, самарійське місто з 4-го розділу Євангелія від Івана?"
  es: "¿Dónde estaba Sicar, la ciudad samaritana de Juan 4?"
  pt: "Onde ficava Sicar, a cidade samaritana de João 4?"
  de: "Wo lag Sychar, die samaritische Stadt aus Johannes 4?"
  fr: "Où se trouvait Sychar, la ville samaritaine de Jean 4 ?"
  pl: "Gdzie leżał Sychar, samarytańskie miasto z J 4?"
  it: "Dov’era Sicar, la città samaritana di Gv 4?"
  cs: "Kde ležel Sychar, samaritánské město z Janova evangelia 4?"
  nl: "Waar lag Sichar, de Samaritaanse stad van Johannes 4?"
  sv: "Var låg Sykar, den samaritiska staden i Johannes 4?"
  nb: "Hvor lå Sykar, den samaritanske byen i Johannes 4?"
  tl: "Nasaan ang Sicar, ang bayang Samaritano sa Juan 4?"
  da: "Hvor lå Sykar, den samaritanske by i Johannes 4?"
  sr: "Где је био Сихар, самарјански град из Јована 4?"
  hu: "Hol volt Szükár, a samáriai város János 4-ben?"
  fi: "Missä oli Sykar, Johanneksen 4. luvun samarialaiskaupunki?"
  vi: "Si-kha, thị trấn của người Sa-ma-ri trong Giăng 4, ở đâu?"
  ro: "Unde se afla Sihar, orașul samaritean din Ioan 4?"
  bg: "Къде се е намирал Сихар — самарийският град от Йоан 4?"
answer:
  en:
    - "Sychar was most probably the village of Askar on the lower slope of Mount Ebal, on the eastern edge of today's Nablus in the West Bank, about a kilometre north of Jacob's well; the map point stands there, about 49 km north of Jerusalem in a straight line. Many scholars, however, hold that John meant Shechem itself, the mound of Tell Balata, which lies under a kilometre from Askar and only a few hundred metres from the well. The well is not in doubt; the question is which town the woman came from."
    - "The case for Askar is that early witnesses keep the two places apart. Eusebius lists Sychar separately from Shechem, and the Pilgrim of Bordeaux in 333 was shown Sichem with Joseph's tomb and, a mile away, a place called Sechar, from which the Samaritan woman came down to draw water. The case for Shechem is its nearness to the well and the word of Jerome, who took Sychar for a mistaken reading of Shechem. Against it, the old city on Tell Balata had been destroyed by John Hyrcanus about 107 BC, and it is not clear that anyone lived there in Jesus' day."
    - "For John the town matters as much as the well. The woman “left her waterpot, and went her way into the city”; while its people came out, Jesus told the disciples, “Lift up your eyes, and look on the fields; for they are white already to harvest”, perhaps pointing to the plain below Askar. The Samaritans “besought him that he would tarry with them: and he abode there two days”, and said at the end: “we have heard him ourselves, and know that this is indeed the Christ, the Saviour of the world.” The site of the well itself is treated in a separate question."
  ru:
    - "Сихарь — вероятнее всего, селение Аскар на нижнем склоне горы Гевал, на восточной окраине нынешнего Наблуса на Западном берегу, примерно в километре к северу от колодца Иакова; там стоит точка карты, примерно в 49 км к северу от Иерусалима по прямой. Многие учёные, однако, считают, что Иоанн имел в виду сам Сихем — холм Телль-Балата, который лежит менее чем в километре от Аскара и всего в нескольких сотнях метров от колодца. О колодце не спорят; вопрос в том, из какого города пришла женщина."
    - "В пользу Аскара говорит то, что ранние свидетели различают эти места. Евсевий называет Сихарь отдельно от Сихема, а Бордоскому паломнику в 333 г. показали Сихем с гробницей Иосифа и в миле от него место под названием Сехар, откуда самарянка спускалась за водой. В пользу Сихема говорят его близость к колодцу и слово Иеронима, считавшего «Сихарь» ошибочным чтением вместо «Сихем». Против — то, что старый город на Телль-Балате был разрушен Иоанном Гирканом около 107 г. до н. э., и неясно, жил ли там кто-нибудь во дни Иисуса."
    - "Для Иоанна город важен не меньше колодца. Женщина «оставила водонос свой, и пошла в город»; пока его жители шли к Нему, Иисус сказал ученикам: «возведите очи ваши и посмотрите на нивы, как они побелели и поспели к жатве», — возможно, указывая на равнину под Аскаром. Самаряне «просили Его побыть у них; и Он пробыл там два дня», а под конец сказали: «сами слышали и узнали, что Он истинно Спаситель мира, Христос». О месте самого колодца — отдельный вопрос."
  uk:
    - "Сихар, найімовірніше, було село Аскар на нижньому схилі гори Гевал, на східній околиці нинішнього Наблуса на Західному березі Йордану, приблизно за кілометр на північ від колодязя Якова; точка на мапі стоїть там, приблизно за 49 км на північ від Єрусалима по прямій. Проте багато вчених вважають, що Іван мав на увазі сам Сихем, пагорб Телль-Балата, який лежить менш ніж за кілометр від Аскару і лише за кілька сотень метрів від колодязя. Колодязь не викликає сумнівів; питання в тому, з якого міста була жінка."
    - "Доказ на користь Аскару в тому, що ранні свідки розрізняють два місця. Євсевій перелічує Сихар окремо від Сихема, а Бордоському паломникові 333 р. показали Сихем із гробницею Йосипа і за милю звідти місце під назвою Сехар, з якого самарянка приходила по воду. Доказ на користь Сихема — його близькість до колодязя та слово Єроніма, який вважав Сихар помилковим прочитанням Сихема. Проти цього: старе місто на Телль-Балаті було зруйноване Іваном Гірканом близько 107 р. до н. е., і незрозуміло, чи жив там хтось за часів Ісуса."
    - "Для Івана місто важить не менше, ніж колодязь. Жінка «Покинула тодї відро своє ... й пійшла в город»; поки його жителі виходили, Ісус сказав учням: «Здійміть очі ваші, та погляньте на ниви, що вже пополовіли на жнива», можливо, вказуючи на рівнину під Аскаром. Самаряни «просили Його зістатись у них; і зіставсь там два днї», а наприкінці сказали: «самі бо чули, й знаємо, що се справдї Спас сьвіту Христос.» Місце самого колодязя розглянуто в окремому питанні."
  es:
    - "Sicar era con la mayor probabilidad la aldea de Askar, en la ladera baja del monte Ebal, en el borde oriental de la actual Nablus, en Cisjordania, a un kilómetro al norte del pozo de Jacob; el punto del mapa está allí, a unos 49 km al norte de Jerusalén en línea recta. Muchos estudiosos sostienen, sin embargo, que Juan se refería a la propia Siquem, el montículo de Tell Balata, que queda a menos de un kilómetro de Askar y a solo unos cientos de metros del pozo. El pozo no está en duda; la cuestión es de qué ciudad venía la mujer."
    - "El argumento a favor de Askar es que los testigos antiguos mantienen separados los dos lugares. Eusebio enumera Sicar aparte de Siquem, y al Peregrino de Burdeos le mostraron en 333 Sichem con la tumba de José y, a una milla, un lugar llamado Sechar, de donde bajaba la samaritana a sacar agua. El argumento a favor de Siquem es su cercanía al pozo y la palabra de Jerónimo, que tomó Sicar por una lectura equivocada de Siquem. En contra, la vieja ciudad de Tell Balata había sido destruida por Juan Hircano hacia el 107 a. C., y no está claro que viviera alguien allí en tiempos de Jesús."
    - "Para Juan, la ciudad importa tanto como el pozo. La mujer «dejó su cántaro, y fué á la ciudad»; mientras salía su gente, Jesús dijo a los discípulos: «Alzad vuestros ojos, y mirad las regiones, porque ya están blancas para la siega», quizá señalando la llanura bajo Askar. Los samaritanos «rogáronle que se quedase allí: y se quedó allí dos días», y dijeron al final: «nosotros mismos hemos oído, y sabemos que verdaderamente éste es el Salvador del mundo, el Cristo». El emplazamiento del propio pozo se trata en otra pregunta."
  pt:
    - "Sicar era muito provavelmente a aldeia de Askar, na encosta inferior do monte Ebal, na orla oriental da atual Nablus, na Cisjordânia, a cerca de um quilômetro ao norte do poço de Jacó; o ponto do mapa fica ali, a cerca de 49 km ao norte de Jerusalém em linha reta. Muitos estudiosos, porém, sustentam que João se referia à própria Siquém, o monte de Tell Balata, que fica a menos de um quilômetro de Askar e a apenas algumas centenas de metros do poço. O poço não está em dúvida; a questão é de qual cidade a mulher veio."
    - "O argumento a favor de Askar é que as testemunhas antigas mantêm os dois lugares distintos. Eusébio relaciona Sicar separadamente de Siquém, e ao Peregrino de Bordeaux, em 333, mostraram Sichem com o túmulo de José e, a uma milha de distância, um lugar chamado Sechar, de onde a mulher samaritana descia para tirar água. O argumento a favor de Siquém é sua proximidade do poço e a palavra de Jerônimo, que tomou Sicar por uma leitura equivocada de Siquém. Contra isso, a antiga cidade em Tell Balata fora destruída por João Hircano por volta de 107 a.C., e não é claro que alguém morasse ali no tempo de Jesus."
    - "Para João, a cidade importa tanto quanto o poço. A mulher “deixou o seu cântaro, foi à cidade”; enquanto o povo saía, Jesus disse aos discípulos: “levantem os olhos e vejam os campos, pois já estão brancos para a colheita”, talvez apontando para a planície abaixo de Askar. Os samaritanos “pediram-lhe que ficasse com eles. E ele ficou ali dois dias”, e disseram no fim: “nós mesmos o ouvimos, e sabemos que este é verdadeiramente o Cristo, o Salvador do mundo.” O local do próprio poço é tratado em uma pergunta à parte."
  de:
    - "Sychar war höchstwahrscheinlich das Dorf Askar am unteren Hang des Ebal, am Ostrand des heutigen Nablus im Westjordanland, etwa einen Kilometer nördlich des Jakobsbrunnens; dort steht der Kartenpunkt, in der Luftlinie etwa 49 km nördlich von Jerusalem. Viele Gelehrte halten jedoch dafür, dass Johannes Sichem selbst meinte, den Hügel Tell Balata, der weniger als einen Kilometer von Askar und nur einige hundert Meter vom Brunnen entfernt liegt. Am Brunnen besteht kein Zweifel; die Frage ist, aus welcher Stadt die Frau kam."
    - "Für Askar spricht, dass frühe Zeugen die beiden Orte auseinanderhalten. Eusebius führt Sychar getrennt von Sichem auf, und dem Pilger von Bordeaux zeigte man 333 Sichem mit Josefs Grab und, eine Meile entfernt, einen Ort namens Sechar, von dem die samaritische Frau herabkam, um Wasser zu schöpfen. Für Sichem spricht seine Nähe zum Brunnen und das Wort des Hieronymus, der Sychar für eine Fehllesung von Sichem hielt. Dagegen war die alte Stadt auf dem Tell Balata um 107 v. Chr. von Johannes Hyrkanos zerstört worden, und es ist nicht klar, ob zu Jesu Zeit dort jemand lebte."
    - "Für Johannes ist die Stadt so wichtig wie der Brunnen. Von der Frau heißt es: „Da ließ das Weib ihren Krug stehen und ging hin in die Stadt“; als ihre Leute herauskamen, sagte Jesus den Jüngern: „Hebet eure Augen auf und sehet in das Feld; denn es ist schon weiß zur Ernte“, vielleicht auf die Ebene unterhalb von Askar weisend. Als die Samariter zu ihm kamen, „baten sie ihn, daß er bei ihnen bliebe; und er blieb zwei Tage da“, und am Ende sagten sie: „wir haben selber gehört und erkannt, daß dieser ist wahrlich Christus, der Welt Heiland.“ Die Lage des Brunnens selbst wird in einer eigenen Frage behandelt."
  fr:
    - "Sychar était très probablement le village d’Askar, sur la pente inférieure du mont Ébal, à la lisière orientale de l’actuelle Naplouse, en Cisjordanie, à environ un kilomètre au nord du puits de Jacob ; le point de la carte s’y trouve, à environ 49 km au nord de Jérusalem à vol d’oiseau. Beaucoup de spécialistes soutiennent toutefois que Jean visait Sichem elle-même, le tertre de Tell Balata, qui se trouve à moins d’un kilomètre d’Askar et à quelques centaines de mètres seulement du puits. Le puits ne fait pas de doute ; la question est de savoir de quelle ville venait la femme."
    - "L’argument en faveur d’Askar est que les premiers témoins distinguent les deux lieux. Eusèbe cite Sychar séparément de Sichem, et le pèlerin de Bordeaux, en 333, se fit montrer Sichem avec le tombeau de Joseph et, à un mille de là, un lieu appelé Sechar, d’où la Samaritaine descendait puiser de l’eau. L’argument en faveur de Sichem est sa proximité du puits et la parole de Jérôme, qui tenait Sychar pour une mauvaise lecture de Sichem. Contre cela, l’ancienne ville de Tell Balata avait été détruite par Jean Hyrcan vers 107 av. J.-C., et il n’est pas certain que quelqu’un y ait habité au temps de Jésus."
    - "Pour Jean, la ville compte autant que le puits. La femme, « ayant laissé sa cruche, s’en alla dans la ville » ; tandis que ses habitants sortaient, Jésus dit aux disciples : « levez les yeux, et regardez les champs qui déjà blanchissent pour la moisson », peut-être en désignant la plaine en contrebas d’Askar. Les Samaritains « le prièrent de rester auprès d’eux. Et il resta là deux jours », et dirent à la fin : « nous l’avons entendu nous-mêmes, et nous savons qu’il est vraiment le Sauveur du monde. » L’emplacement du puits lui-même est traité dans une question distincte."
  pl:
    - "Sychar to najprawdopodobniej wieś Askar na dolnym stoku Góry Ebal, na wschodnim skraju dzisiejszego Nablusu na Zachodnim Brzegu, około kilometra na północ od studni Jakuba; tam stoi punkt na mapie, około 49 km na północ od Jerozolimy w linii prostej. Wielu uczonych utrzymuje jednak, że Jan miał na myśli samo Sychem, wzgórze Tell Balata, które leży mniej niż kilometr od Askar i tylko kilkaset metrów od studni. Studnia nie budzi wątpliwości; pytanie brzmi, z którego miasta przyszła kobieta."
    - "Za Askar przemawia to, że wcześni świadkowie rozróżniają te dwa miejsca. Euzebiusz wymienia Sychar osobno od Sychem, a Pielgrzymowi z Bordeaux w 333 pokazano Sichem z grobem Józefa i, o milę dalej, miejsce zwane Sechar, skąd Samarytanka schodziła czerpać wodę. Za Sychem przemawia bliskość studni i słowo Hieronima, który uważał Sychar za błędne odczytanie Sychem. Przeciw temu stoi to, że stare miasto na Tell Balata zostało zniszczone przez Jana Hirkana około 107 p.n.e. i nie jest jasne, czy ktokolwiek mieszkał tam za czasów Jezusa."
    - "Dla Jana miasto znaczy tyle co studnia. Kobieta „zostawiła ona niewiasta wiadro swoje, a szła do miasta”; gdy jego mieszkańcy wychodzili, Jezus powiedział uczniom: „Podnieście oczy wasze, a przypatrzcie się krainom, żeć już białe są ku żniwu”, może wskazując na równinę pod Askar. Samarytanie „prosili go, aby u nich został; i został tam przez dwa dni”, a na koniec powiedzieli: „albowiemeśmy sami słyszeli i wiemy, że ten jest prawdziwie zbawiciel świata, Chrystus”. Położenie samej studni omawia osobne pytanie."
  it:
    - "Sicar era con ogni probabilità il villaggio di Askar sul basso pendio del Monte Ebal, al margine orientale dell’odierna Nablus in Cisgiordania, a circa un chilometro a nord del pozzo di Giacobbe; il punto della mappa si trova lì, a circa 49 km a nord di Gerusalemme in linea d’aria. Molti studiosi, tuttavia, ritengono che Giovanni intendesse la stessa Sichem, il tell di Tell Balata, che si trova a meno di un chilometro da Askar e a poche centinaia di metri dal pozzo. Il pozzo non è in dubbio; la questione è da quale città venisse la donna."
    - "La tesi a favore di Askar è che i primi testimoni tengono distinti i due luoghi. Eusebio elenca Sicar separatamente da Sichem, e al Pellegrino di Bordeaux nel 333 furono mostrati Sichem con la tomba di Giuseppe e, a un miglio di distanza, un luogo chiamato Sechar, da cui la donna samaritana scendeva ad attingere acqua. La tesi a favore di Sichem è la sua vicinanza al pozzo e la parola di Girolamo, che considerò Sicar una lettura errata di Sichem. Contro di essa, l’antica città su Tell Balata era stata distrutta da Giovanni Ircano verso il 107 a.C., e non è chiaro che vi abitasse qualcuno ai tempi di Gesù."
    - "Per Giovanni la città conta quanto il pozzo. La donna «lasciò dunque la sua secchia, se ne andò in città»; mentre la gente ne usciva, Gesù disse ai discepoli: «Levate gli occhi e mirate le campagne come già son bianche da mietere», forse indicando la pianura sotto Askar. I Samaritani «lo pregarono di trattenersi da loro; ed egli si trattenne quivi due giorni», e alla fine dissero: «abbiamo udito da noi, e sappiamo che questi è veramente il Salvator del mondo». Il sito del pozzo stesso è trattato in una domanda a parte."
  cs:
    - "Sychar byl nejspíš vesnice Askar na dolním svahu hory Ébal, na východním okraji dnešního Nábulusu na Západním břehu, asi kilometr severně od Jákobovy studny; bod na mapě stojí tam, vzdušnou čarou asi 49 km severně od Jeruzaléma. Mnozí badatelé však soudí, že Jan měl na mysli samotný Šekem, pahorek Tell Balata, který leží méně než kilometr od Askaru a jen několik set metrů od studny. Studna není pochybná; otázka je, z jakého města žena přišla."
    - "Argument pro Askar je, že rané prameny obě místa odlišují. Eusebios uvádí Sychar zvlášť od Šekemu a Poutníku z Bordeaux roku 333 ukázali Sichem s Josefovým hrobem a o míli dál místo zvané Sechar, odkud Samaritánka scházela načerpat vodu. Argument pro Šekem je jeho blízkost ke studni a slovo Jeronýma, který pokládal Sychar za chybné čtení Šekemu. Proti tomu staré město na Tell Balata zničil Jan Hyrkán kolem roku 107 př. n. l. a není jasné, že tam v době Ježíšově někdo bydlel."
    - "Pro Jana je město stejně důležité jako studna. „I nechala tu žena vědra svého, a šla do města“; zatímco jeho obyvatelé vycházeli, Ježíš řekl učedníkům: „Pozdvihněte očí vašich, a patřte na krajiny, žeť se již bělejí ke žni“, snad poukazuje na rovinu pod Askarem. Samaritáni „prosili ho, aby s nimi zůstal. I pobyl tu za dva dni“ a na konci řekli: „sami jsme slyšeli, a víme, že tento jest právě Spasitel světa, Kristus.“ Poloha samotné studny se rozebírá v samostatné otázce."
  nl:
    - "Sichar was zeer waarschijnlijk het dorp Askar aan de onderste helling van de berg Ebal, aan de oostrand van het huidige Nabloes in de Westelijke Jordaanoever, ongeveer een kilometer ten noorden van de put van Jakob; het punt op de kaart staat daar, hemelsbreed ongeveer 49 km ten noorden van Jeruzalem. Veel geleerden menen echter dat Johannes Sichem zelf bedoelde, de heuvel Tell Balata, die minder dan een kilometer van Askar ligt en slechts enkele honderden meters van de put. Aan de put wordt niet getwijfeld; de vraag is uit welke stad de vrouw kwam."
    - "Het argument voor Askar is dat vroege getuigen de twee plaatsen uit elkaar houden. Eusebius noemt Sichar apart van Sichem, en de pelgrim van Bordeaux kreeg in 333 Sichem te zien met het graf van Jozef en, een mijl verder, een plaats genaamd Sechar, vanwaar de Samaritaanse vrouw naar beneden kwam om water te putten. Het argument voor Sichem is de nabijheid van de put en het woord van Hieronymus, die Sichar hield voor een foutieve lezing van Sichem. Daartegen was de oude stad op Tell Balata omstreeks 107 v.Chr. door Johannes Hyrcanus verwoest, en het is niet duidelijk dat er in de tijd van Jezus nog iemand woonde."
    - "Voor Johannes is de stad even belangrijk als de put. “Zo verliet de vrouw dan haar watervat, en ging heen in de stad”; terwijl de inwoners naar buiten kwamen, zei Jezus tegen de leerlingen: “Heft uw ogen op en aanschouwt de landen; want zij zijn alrede wit om te oogsten”, misschien wijzend op de vlakte onder Askar. “Als dan de Samaritanen tot Hem gekomen waren, baden zij Hem, dat Hij bij hen bleef; en Hij bleef aldaar twee dagen”, en aan het slot zeiden zij: “wij zelven hebben Hem gehoord, en weten, dat Deze waarlijk is de Christus, de Zaligmaker der wereld.” De plaats van de put zelf wordt in een aparte vraag behandeld."
  sv:
    - "Sykar var med största sannolikhet byn Askar på Ebals nedre sluttning, vid östra kanten av dagens Nablus på Västbanken, omkring en kilometer norr om Jakobs brunn; kartpunkten står där, omkring 49 km norr om Jerusalem i fågelvägen. Många forskare menar dock att Johannes avsåg själva Shekem, kullen Tell Balata, som ligger mindre än en kilometer från Askar och bara några hundra meter från brunnen. Brunnen är inte ifrågasatt; frågan är vilken stad kvinnan kom från."
    - "Argumentet för Askar är att tidiga vittnen håller de två platserna isär. Eusebios förtecknar Sykar för sig från Shekem, och pilgrimen från Bordeaux fick år 333 se Sichem med Josefs grav och, en romersk mil bort, en plats kallad Sechar, varifrån den samaritiska kvinnan kom ned för att hämta vatten. Argumentet för Shekem är dess närhet till brunnen och Hieronymus’ ord, som tog Sykar för en felläsning av Shekem. Mot det talar att den gamla staden på Tell Balata hade förstörts av Johannes Hyrkanos omkring 107 f.Kr., och det är inte klart att någon bodde där på Jesu tid."
    - "För Johannes betyder staden lika mycket som brunnen. Kvinnan ”lät sin kruka stå och gick in i staden”; medan dess folk kom ut sade Jesus till lärjungarna: ”Lyften upp edra ögon, och sen på fälten, huru de hava vitnat till skörd”, kanske med en gest mot slätten nedanför Askar. Samariterna bad honom stanna kvar hos dem, och ”så stannade han där i två dagar”, och de sade till sist: ”vi hava nu själva hört honom, och vi veta nu att han i sanning är världens Frälsare.” Själva brunnens plats behandlas i en separat fråga."
  nb:
    - "Sykar var mest sannsynlig landsbyen Askar i den nedre skråningen av Ebal, i den østre kanten av dagens Nablus på Vestbredden, omtrent en kilometer nord for Jakobs brønn; kartpunktet står der, omtrent 49 km nord for Jerusalem i luftlinje. Mange forskere mener imidlertid at Johannes mente selve Sikem, haugen Tell Balata, som ligger under en kilometer fra Askar og bare noen hundre meter fra brønnen. Brønnen er det ingen tvil om; spørsmålet er hvilken by kvinnen kom fra."
    - "Argumentet for Askar er at tidlige vitner holder de to stedene fra hverandre. Eusebius oppfører Sykar atskilt fra Sikem, og pilegrimen fra Bordeaux ble i 333 vist Sichem med Josefs grav og, en romersk mil unna, et sted kalt Sechar, hvorfra den samaritanske kvinnen kom ned for å hente vann. Argumentet for Sikem er nærheten til brønnen og Hieronymus, som holdt Sykar for en feillesning av Sikem. Mot dette taler at den gamle byen på Tell Balata var ødelagt av Johannes Hyrkanos omkring 107 f.Kr., og det er ikke klart at noen bodde der på Jesu tid."
    - "For Johannes betyr byen like mye som brønnen. Kvinnen «lot da sin vannkrukke stå og gikk bort til byen»; mens folket kom ut, sa Jesus til disiplene: «Løft eders øine og se markene, de er alt hvite til høsten!», kanskje med henblikk på sletten under Askar. Da samaritanene kom, «bad de ham bli hos dem; og han blev der to dager», og til slutt sa de: «vi har selv hørt, og vi vet nu at han sannelig er verdens frelser.» Selve brønnens beliggenhet behandles i et eget spørsmål."
  tl:
    - "Ang Sicar ay malamang na ang nayon ng Askar sa ibabang dalisdis ng Bundok Ebal, sa silangang gilid ng Nablus ngayon sa West Bank, mga isang kilometro sa hilaga ng balon ni Jacob; naroon ang punto sa mapa, mga 49 km sa hilaga ng Jerusalem sa tuwid na guhit. Gayunman, maraming iskolar ang naniniwalang ang tinutukoy ni Juan ay ang Sichem mismo, ang burol ng Tell Balata, na wala pang isang kilometro mula sa Askar at ilang daang metro lamang mula sa balon. Hindi pinag-aalinlanganan ang balon; ang tanong ay kung aling bayan nanggaling ang babae."
    - "Ang katuwiran para sa Askar: pinaghihiwalay ng mga maagang saksi ang dalawang lugar. Inilista ni Eusebio ang Sicar nang hiwalay sa Sichem, at ipinakita sa peregrino ng Bordeaux noong 333 ang Sichem na may libingan ni Jose at, isang milya ang layo, isang lugar na tinatawag na Sechar, na pinanggalingan ng babaeng Samaritana upang umigib ng tubig. Ang katuwiran para sa Sichem ay ang lapit nito sa balon at ang salita ni Jeronimo, na itinuring ang Sicar na maling pagbasa ng Sichem. Laban dito, ang lumang lungsod sa Tell Balata ay winasak ni Juan Hircano noong mga 107 BK, at hindi malinaw kung may nanirahan doon noong panahon ni Jesus."
    - "Para kay Juan, kasinghalaga ng balon ang bayan. “Iniwan ng babae ang kaniyang banga ng tubig, at napasa bayan”; habang lumalabas ang mga tao nito, sinabi ni Jesus sa mga alagad, “Itanaw ninyo ang inyong mga mata, at inyong tingnan ang mga bukid, na mapuputi na upang anihin”, marahil na tumuturo sa kapatagan sa ibaba ng Askar. Ipinamanhik ng mga Samaritano sa kaniya na “matira sa kanila: at siya'y natira roong dalawang araw”, at sa katapusan ay sinabi nila: “kami rin ang nakarinig, at nalalaman naming ito nga ang Tagapagligtas ng sanglibutan.” Ang pook mismo ng balon ay tinatalakay sa hiwalay na tanong."
  da:
    - "Sykar var højst sandsynligt landsbyen Askar på den nedre skråning af Ebal, ved den østlige udkant af nutidens Nablus på Vestbredden, ca. en kilometer nord for Jakobs brønd; kortets punkt står der, ca. 49 km nord for Jerusalem i fugleflugt. Mange forskere hævder dog, at Johannes mente selve Sikem, tellen Tell Balata, som ligger under en kilometer fra Askar og kun nogle få hundrede meter fra brønden. Brønden er ikke i tvivl; spørgsmålet er, hvilken by kvinden kom fra."
    - "Argumentet for Askar er, at tidlige vidner holder de to steder adskilt. Eusebios opregner Sykar særskilt fra Sikem, og pilgrimmen fra Bordeaux fik i 333 vist Sichem med Josefs grav og, en romersk mil derfra, et sted kaldet Sechar, hvorfra den samaritanske kvinde kom ned for at øse vand. Argumentet for Sikem er dens nærhed til brønden og Hieronymus’ ord, som tog Sykar for en fejllæsning af Sikem. Imod det taler, at den gamle by på Tell Balata var blevet ødelagt af Johannes Hyrkan omkring 107 f.Kr., og det er ikke klart, at nogen boede der i Jesu dage."
    - "For Johannes betyder byen lige så meget som brønden. Det hedder: »Da lod Kvinden sin Vandkrukke staa og gik bort til Byen«; mens dens folk kom ud, sagde Jesus til disciplene: »opløfter eders Øjne og ser Markerne; de ere allerede hvide til Høsten«, måske pegende på sletten neden for Askar. Samaritanerne bad ham »om at blive hos dem; og han blev der to Dage«, og sagde til sidst: »vi have selv hørt, og vi vide, at denne er sandelig Verdens Frelser.« Selve brøndens beliggenhed behandles i et selvstændigt spørgsmål."
  sr:
    - "Сихар је највероватније био село Аскар на доњој падини горе Евал, на источном ободу данашњег Набулуса на Западној обали, око километар северно од Јаковљевог бунара; тачка на карти стоји ту, око 49 км северно од Јерусалима ваздушном линијом. Многи научници, међутим, држе да је Јован мислио на сам Сихем, хумку Тел Балата, која је удаљена мање од километра од Аскара и само неколико стотина метара од бунара. Бунар није у сумњи; питање је из ког је града жена дошла."
    - "Аргумент за Аскар је да рани сведоци та два места држе одвојено. Јевсевије наводи Сихар одвојено од Сихема, а ходочаснику из Бордоа 333. показан је Сихем са Јосифовим гробом и, миљу даље, место звано Сехар, из којег је Самарјанка силазила да захвати воду. Аргумент за Сихем је његова близина бунару и реч Јеронима, који је Сихар узео за погрешно читање Сихема. Против тога, стари град на Тел Балати разорио је Јован Хиркан око 107. п. н. е., и није јасно да ли је ико тамо живео у Исусово време."
    - "За Јована град је важан колико и бунар. Жена „остави судове своје и отиде у град“; док су његови људи излазили, Исус је рекао ученицима: „подигните очи своје и видите њиве како су већ жуте за жетву“, можда показујући на равницу испод Аскара. Самарјани „мољаху Га да би остао код њих; и онде оста два дана“, а на крају су рекли: „сами чусмо и познасмо да је Овај заиста спас свету, Христос.“ Место самог бунара обрађено је у посебном питању."
  hu:
    - "Szükár legvalószínűbben Askar falu volt az Ébál-hegy alsó lejtőjén, a mai Nablus keleti szélén Ciszjordániában, Jákób kútjától mintegy egy kilométerre északra; a térkép pontja ott áll, Jeruzsálemtől légvonalban mintegy 49 km-re északra. Sok tudós azonban úgy tartja, hogy János magát Sikemet értette, a Tell Balata halmát, amely Askartól egy kilométernél kisebb távolságra van, a kúttól pedig csak néhány száz méterre. A kút nem kétséges; a kérdés az, melyik városból jött az asszony."
    - "Askar mellett szól, hogy a korai tanúk szétválasztják a két helyet. Eusebius Szükárt külön sorolja fel Sikemtől, a bordeaux-i zarándoknak pedig 333-ban megmutatták Sichemet József sírjával és egy mérföldre tőle egy Sechar nevű helyet, ahonnan a samáriai asszony lejött vizet meríteni. Sikem mellett szól a kúthoz való közelsége és Hieronymus szava, aki Szükárt Sikem téves olvasatának tartotta. Ellene szól, hogy a Tell Balata régi városát Hürkánosz János Kr. e. 107 körül lerombolta, és nem világos, hogy Jézus idejében lakott-e ott bárki."
    - "Jánosnak a város éppúgy számít, mint a kút. „Ott hagyá azért az asszony a vedrét, és elméne a városba”; míg a város lakói kijöttek, Jézus ezt mondta a tanítványoknak: „Emeljétek fel szemeiteket, és lássátok meg a tájékokat, hogy már fehérek az aratásra”, talán az Askar alatti síkságra mutatva. A szamaritánusok „kérék őt, hogy maradjon náluk; és ott marada két napig”, és a végén így szóltak: „magunk hallottuk, és tudjuk, hogy bizonnyal ez a világ idvezítője, a Krisztus.” A kút helyét külön kérdés tárgyalja."
  fi:
    - "Sykar oli todennäköisimmin Askarin kylä Ebalvuoren alarinteellä, nykyisen Nablusin itäreunalla Länsirannalla, noin kilometrin Jaakobin kaivosta pohjoiseen; kartan piste on siinä, linnuntietä noin 49 km Jerusalemista pohjoiseen. Monet tutkijat kuitenkin katsovat, että Johannes tarkoitti itse Sikemiä, Tell Balatan kumpua, joka on alle kilometrin päässä Askarista ja vain muutaman sadan metrin päässä kaivosta. Kaivosta ei ole epäilystä; kysymys on, mistä kaupungista nainen tuli."
    - "Askarin puolesta puhuu se, että varhaiset todistajat pitävät kaksi paikkaa erillään. Eusebios luettelee Sykarin erikseen Sikemistä, ja Bordeaux'n pyhiinvaeltajalle näytettiin vuonna 333 Sichem Joosefin haudan kanssa ja mailin päässä paikka nimeltä Sechar, josta samarialaisnainen tuli alas ammentamaan vettä. Sikemin puolesta puhuvat sen läheisyys kaivoon ja Hieronymuksen sana, joka piti Sykaria Sikemin virheellisenä lukutapana. Sitä vastaan puhuu, että Tell Balatan vanhan kaupungin oli Johannes Hyrkanos tuhonnut noin 107 eaa., eikä ole selvää, asuiko siellä kukaan Jeesuksen aikana."
    - "Johannekselle kaupunki on yhtä tärkeä kuin kaivo. Nainen ”jätti vesiastiansa ja meni kaupunkiin”; kun sen asukkaat tulivat ulos, Jeesus sanoi opetuslapsille: ”nostakaa silmänne ja katselkaa vainioita, kuinka ne ovat valjenneet leikattaviksi”, mahdollisesti viitaten Askarin alapuolella olevaan tasankoon. Kun samarialaiset tulivat hänen luokseen, ”pyysivät he häntä viipymään heidän luonaan; ja hän viipyi siellä kaksi päivää”, ja he sanoivat lopuksi: ”me itse olemme kuulleet ja tiedämme, että tämä totisesti on maailman Vapahtaja”. Itse kaivon paikkaa käsitellään erillisessä kysymyksessä."
  vi:
    - "Si-kha nhiều khả năng là làng Askar ở sườn dưới của Núi Ê-banh, ở rìa đông Nablus ngày nay thuộc Bờ Tây, cách giếng Gia-cốp khoảng một kilômét về phía bắc; điểm trên bản đồ nằm ở đó, cách Giê-ru-sa-lem khoảng 49 km về phía bắc theo đường thẳng. Tuy nhiên, nhiều học giả cho rằng Giăng muốn nói chính Si-chem, tức gò Tell Balata, cách Askar chưa đến một kilômét và chỉ vài trăm mét từ giếng. Giếng thì không còn nghi ngờ; câu hỏi là người đàn bà đến từ thị trấn nào."
    - "Lập luận cho Askar là các chứng nhân thời đầu giữ hai nơi tách biệt. Eusebius liệt kê Si-kha riêng với Si-chem, và Người hành hương từ Bordeaux năm 333 được chỉ cho Sichem với mộ Giô-sép và, cách một dặm, một nơi gọi là Sechar, từ đó người đàn bà Sa-ma-ri đi xuống múc nước. Lập luận cho Si-chem là sự gần giếng và lời của Jerome, người cho Si-kha là một cách đọc sai của Si-chem. Chống lại điều đó, thành cổ trên Tell Balata đã bị John Hyrcanus phá hủy khoảng năm 107 TCN, và không rõ có ai sống ở đó vào thời Giê-su hay không."
    - "Đối với Giăng, thị trấn quan trọng không kém giếng. Người đàn bà “bỏ cái vò của mình lại và vào thành”; trong khi dân thành kéo ra, Giê-su nói với các môn đồ: “Hãy nhướng mắt lên và xem đồng ruộng, đã vàng sẵn cho mùa gặt”, có lẽ chỉ vào đồng bằng bên dưới Askar. Người Sa-ma-ri “xin Ngài vào trọ nơi mình; Ngài bèn ở lại đó hai ngày”, và cuối cùng nói: “chính chúng ta đã nghe Ngài, và biết rằng chính Ngài thật là Cứu Chúa của thế gian.” Địa điểm của chính giếng được bàn trong một câu hỏi riêng."
  ro:
    - "Sihar a fost foarte probabil satul Askar de pe panta inferioară a Muntelui Ebal, la marginea de est a orașului Nablus de azi din Cisiordania, la circa un kilometru nord de fântâna lui Iacov; punctul de pe hartă se află acolo, la circa 49 km nord de Ierusalim în linie dreaptă. Mulți cercetători susțin însă că Ioan se referea la Sihem însuși, movila Tell Balata, aflată la mai puțin de un kilometru de Askar și la doar câteva sute de metri de fântână. Fântâna nu este pusă la îndoială; întrebarea este din ce oraș venea femeia."
    - "Argumentul pentru Askar este că martorii timpurii țin cele două locuri deosebite. Eusebiu enumeră Sihar separat de Sihem, iar Pelerinului din Bordeaux i s-a arătat în 333 Sichem cu mormântul lui Iosif și, la o milă distanță, un loc numit Sechar, de unde venea femeia samariteană să scoată apă. Argumentul pentru Sihem este apropierea lui de fântână și cuvântul lui Ieronim, care a socotit Sihar o citire greșită a Sihemului. Împotriva lui stă faptul că vechiul oraș de pe Tell Balata fusese distrus de Ioan Hircan în jurul anului 107 î.Hr., și nu este limpede că ar fi locuit cineva acolo pe vremea lui Isus."
    - "Pentru Ioan, orașul contează tot atât cât fântâna. Femeia „a lăsat ciutura sa, și a mers în cetate”; în timp ce locuitorii ieșeau, Isus le-a spus ucenicilor: „ridicați ochii voștri, și vedeți holdele, că sunt albe spre seceriș acum”, poate arătând spre câmpia de sub Askar. Samaritenii „îl rugau pre el ca să rămâe la dânșii; și au rămas acolo două zile”, și au spus la sfârșit: „înși-ne am auzit, și știm, că acesta este cu adevărat Hristos, mântuitorul lumei.” Locul fântânii însăși este tratat într-o întrebare separată."
  bg:
    - "Сихар най-вероятно е село Аскар на долния склон на планината Гевал, в източния край на днешния Наблус в Западния бряг, на около километър северно от Якововия кладенец; точката на картата стои там, на около 49 км северно от Йерусалим по права линия. Много учени обаче смятат, че Йоан е имал предвид самия Сихем — хълма Тел Балата, който е на по-малко от километър от Аскар и само на няколкостотин метра от кладенеца. Кладенецът не е под съмнение; въпросът е от кой град е дошла жената."
    - "В полза на Аскар е, че ранните свидетели разграничават двете места. Евсевий изброява Сихар отделно от Сихем, а на поклонника от Бордо през 333 г. показали Сихем с гроба на Йосиф и на една миля оттам място, наречено Сехар, откъдето самарянката слизала да вади вода. В полза на Сихем са близостта му до кладенеца и думите на Йероним, който смята Сихар за погрешно четене на Сихем. Против него говори това, че старият град на Тел Балата е бил разрушен от Йоан Хиркан около 107 г. пр.н.е. и не е ясно дали някой е живял там по времето на Исус."
    - "За Йоан градът е толкова важен, колкото и кладенецът. Жената „остави кърчага си и отиде в града“; докато жителите му излизаха, Исус каза на учениците: „подигнете очите си, и вижте нивята че са вече бели за жетва“, може би сочейки равнината под Аскар. Самаряните „молеха му се да остане при тех; и преседе там два дни“, а накрая казаха: „сами чухме, и знаем че този е наистина Спасител мира, Христос.“ Мястото на самия кладенец е разгледано в отделен въпрос."
