id: where-was-hezekiahs-tunnel
question:
  en: "Where was Hezekiah's tunnel?"
  ru: "Где проходил тоннель Езекии?"
  uk: "Де був тунель Єзекії?"
  es: "¿Dónde estaba el túnel de Ezequías?"
  pt: "Onde ficava o túnel de Ezequias?"
  de: "Wo verlief der Hiskia-Tunnel?"
  fr: "Où se trouvait le tunnel d’Ézéchias ?"
  pl: "Gdzie przebiegał tunel Ezechiasza?"
  it: "Dov’era il tunnel di Ezechia?"
  cs: "Kde ležel Chizkijášův tunel?"
  nl: "Waar lag de tunnel van Chizkia?"
  sv: "Var låg Hiskias tunnel?"
  nb: "Hvor lå Hiskias tunnel?"
  tl: "Nasaan ang lagusan ni Ezechias?"
  da: "Hvor lå Hizkijas tunnel?"
  sr: "Где је био Језекијин тунел?"
  hu: "Hol volt Ezékiás alagútja?"
  fi: "Missä Hiskian tunneli kulki?"
  vi: "Đường hầm của Ê-xê-chia ở đâu?"
  ro: "Pe unde trecea tunelul lui Ezechia?"
  bg: "Къде се е намирал тунелът на Езекия?"
answer:
  en:
    - "Hezekiah's tunnel runs through the rock under the City of David, the ridge south of the Temple Mount in Jerusalem, from the Gihon spring in the Kidron valley on the east side to the Pool of Siloam at the southern tip of the ridge. It winds for about 533 m, though the map's points for the spring and the pool are only about 300 m apart in a straight line. It still carries the spring's water, and visitors wade through it in the City of David park in Silwan, East Jerusalem. History Globe's articles on the City of David, Gihon and Siloam tell more; this answer keeps to where the tunnel ran."
    - "Chronicles says exactly where it went: “This same Hezekiah also stopped the upper watercourse of Gihon, and brought it straight down to the west side of the city of David.” Before Sennacherib came, Hezekiah and his princes resolved “to stop the waters of the fountains which were without the city”, so that the kings of Assyria should not “come, and find much water”; Kings sums it up, “how he made a pool, and a conduit, and brought water into the city”. Isaiah speaks of the same works: “ye gathered together the waters of the lower pool… Ye made also a ditch between the two walls for the water of the old pool.” The map dates the tunnel to about 700 BC, just before the siege of 701."
    - "In 1880 an inscription was found cut in the wall near the tunnel's lower end. It tells how two gangs of hewers worked towards each other, heard each other's voices through the rock and met, and how the water then flowed 1,200 cubits from the spring to the pool; it is now in the Istanbul Archaeological Museums. Radiocarbon dating of plant matter in the plaster, published in 2003, fits Hezekiah's reign; Ronny Reich and Eli Shukron have argued that the tunnel was begun earlier, about 800 BC, so the attribution to Hezekiah is disputed. Why the tunnel winds is also argued: the hewers may have followed a natural fissure in the karst."
  ru:
    - "Тоннель Езекии проходит в скале под Городом Давидовым — хребтом к югу от Храмовой горы в Иерусалиме — от источника Гион в долине Кедрона, на восточной стороне, до Силоамского пруда на южной оконечности хребта. Он вьётся на протяжении около 533 м, хотя точки карты для источника и пруда отстоят друг от друга всего примерно на 300 м по прямой. По нему и сейчас течёт вода источника, и посетители проходят его вброд в парке Города Давидова в Сильване, в Восточном Иерусалиме. Подробнее рассказывают статьи History Globe о Городе Давидовом, Гионе и Силоаме; здесь ответ о том, где шёл тоннель."
    - "Паралипоменон точно указывает его путь: «Он же, Езекия, запер верхний проток вод Геона и провел их вниз к западной стороне города Давидова». Перед приходом Сеннахирима Езекия с князьями решил «засыпать источники воды, которые вне города», говоря: «да не найдут цари Ассирийские, придя сюда, много воды»; книга Царств подытоживает: «он сделал пруд и водопровод и провел воду в город». О тех же работах говорит Исаия: «собираете воды в нижнем пруде… и устрояете между двумя стенами хранилище для вод старого пруда». Карта относит тоннель примерно к 700 г. до н. э., незадолго до осады 701 года."
    - "В 1880 году у нижнего конца тоннеля нашли надпись, высеченную в стене. Она рассказывает, как две артели каменотёсов шли навстречу друг другу, услышали сквозь скалу голоса друг друга и сошлись и как потом вода потекла от источника к пруду на 1200 локтей; теперь надпись хранится в Археологических музеях Стамбула. Радиоуглеродная датировка растительных остатков в штукатурке, опубликованная в 2003 году, согласуется с царствованием Езекии; Рони Райх и Эли Шукрон доказывали, что тоннель начали раньше, около 800 г. до н. э., так что приписывание его Езекии спорно. Спорят и о том, почему тоннель извилист: возможно, каменотёсы шли по природной трещине в карсте."
  uk:
    - "Тунель Єзекії проходить крізь скелю під Містом Давида — пасмом на південь від Храмової гори в Єрусалимі, — від джерела Гіхон у долині Кедрону на східному боці до Силоамського ставу на південному кінці пасма. Він звивається на близько 533 м, хоча точки джерела й ставу на мапі лежать лише приблизно за 300 м одна від одної по прямій. Він досі несе воду джерела, і відвідувачі бредуть крізь нього в парку Міста Давида в Сільвані, у Східному Єрусалимі. Більше розповідають статті «Історичного глобуса» про Місто Давида, Гіхон і Силоам; ця відповідь стосується лише того, де пролягав тунель."
    - "Книга Хроніки каже достеменно, куди він вів: «Він же, Езекія, загатив верхню течію води Геона й провів її на низ до західнього боку міста Давидового». Перш ніж прийшов Сінаххеріб, Єзекія з князями постановив «позасипати водні джерела, що за містом», щоб царі Ассирії не знайшли «багато води»; Книга Царів підсумовує: «як він зробив став і водопровід, і провів у город воду». Ісая говорить про ті самі роботи: «спускаєте докупи води до нижнього ставу ... І копаєте на воду знов став запасний між двома мурами». Мапа датує тунель приблизно 700 р. до н. е., незадовго до облоги 701 р."
    - "1880 року поблизу нижнього кінця тунелю знайшли напис, вирізаний у стіні. Він розповідає, як дві бригади каменярів працювали назустріч одна одній, чули голоси одна одної крізь скелю й зустрілися, і як потім вода потекла на 1200 ліктів від джерела до ставу; нині він зберігається в Археологічних музеях Стамбула. Радіовуглецеве датування рослинних решток у штукатурці, опубліковане 2003 року, відповідає часові правління Єзекії; Ронні Райх та Елі Шукрон доводили, що тунель почали копати раніше, близько 800 р. до н. е., тож приписування його Єзекії оскаржують. Сперечаються й про те, чому тунель звивається: каменярі могли йти за природною тріщиною в карсті."
  es:
    - "El túnel de Ezequías discurre por la roca bajo la Ciudad de David, la loma al sur del Monte del Templo en Jerusalén, desde la fuente de Gihón, en el valle del Cedrón, en el lado este, hasta el estanque de Siloé, en el extremo sur de la loma. Serpentea a lo largo de unos 533 m, aunque los puntos del mapa para la fuente y el estanque distan solo unos 300 m en línea recta. Aún lleva el agua de la fuente, y los visitantes lo recorren vadeándolo en el parque de la Ciudad de David, en Silwan, Jerusalén Este. Los artículos de History Globe sobre la Ciudad de David, Gihón y Siloé cuentan más; esta respuesta se ciñe a por dónde discurría el túnel."
    - "Crónicas dice exactamente por dónde iba: «Este Ezechîas tapó los manaderos de las aguas de Gihón la de arriba, y encaminólas abajo al occidente de la ciudad de David». Antes de que llegara Senaquerib, Ezequías y sus príncipes resolvieron «cegar las fuentes de las aguas que estaban fuera de la ciudad», para que los reyes de Asiria no hallaran «muchas aguas cuando vinieren»; el libro de los Reyes lo resume: «cómo hizo el estanque, y el conducto, y metió las aguas en la ciudad». Isaías habla de las mismas obras: «recogisteis las aguas de la pesquera de abajo… E hicisteis foso entre los dos muros con las aguas de la pesquera vieja». El mapa fecha el túnel hacia el 700 a. C., justo antes del asedio del 701."
    - "En 1880 se halló una inscripción grabada en la pared cerca del extremo inferior del túnel. Cuenta cómo dos cuadrillas de picapedreros trabajaron una hacia la otra, oyeron sus voces a través de la roca y se encontraron, y cómo el agua fluyó luego 1200 codos desde la fuente hasta el estanque; se conserva hoy en los Museos Arqueológicos de Estambul. La datación por radiocarbono de materia vegetal en el enlucido, publicada en 2003, concuerda con el reinado de Ezequías; Ronny Reich y Eli Shukron han sostenido que el túnel se empezó antes, hacia el 800 a. C., de modo que la atribución a Ezequías se discute. También se discute por qué serpentea el túnel: los picapedreros pudieron seguir una fisura natural en el karst."
  pt:
    - "O túnel de Ezequias atravessa a rocha sob a Cidade de Davi, a crista ao sul do monte do Templo em Jerusalém, da fonte de Giom, no vale do Cedrom, no lado leste, até o Tanque de Siloé, na ponta sul da crista. Serpenteia por cerca de 533 m, embora os pontos do mapa para a fonte e para o tanque estejam a apenas cerca de 300 m um do outro em linha reta. Ainda conduz a água da fonte, e os visitantes o atravessam a vau no parque da Cidade de Davi, em Silwan, Jerusalém Oriental. Os artigos do History Globe sobre a Cidade de Davi, Giom e Siloé dizem mais; esta resposta trata apenas de por onde corria o túnel."
    - "Crônicas diz exatamente por onde ia: “Este mesmo Ezequias também tapou a fonte superior das águas de Giom, e as trouxe diretamente para o lado oeste da cidade de Davi.” Antes da chegada de Senaqueribe, Ezequias e seus príncipes resolveram “tapar as águas das fontes que ficavam fora da cidade”, e o povo perguntou: “Por que os reis da Assíria deveriam vir e encontrar água abundante?”; Reis resume: “como ele fez o tanque e o aqueduto, e trouxe água para a cidade”. Isaías fala das mesmas obras: “juntaram as águas do tanque inferior… Vocês também fizeram um reservatório entre os dois muros para a água do tanque velho.” O mapa data o túnel de cerca de 700 a.C., pouco antes do cerco de 701."
    - "Em 1880 foi encontrada uma inscrição gravada na parede perto da extremidade inferior do túnel. Ela conta como dois grupos de escavadores trabalharam um em direção ao outro, ouviram as vozes um do outro através da rocha e se encontraram, e como a água correu então 1.200 côvados da fonte ao tanque; hoje está nos Museus Arqueológicos de Istambul. A datação por radiocarbono de matéria vegetal no reboco, publicada em 2003, concorda com o reinado de Ezequias; Ronny Reich e Eli Shukron sustentaram que o túnel foi iniciado antes, por volta de 800 a.C., de modo que a atribuição a Ezequias é disputada. Também se discute por que o túnel serpenteia: os escavadores talvez tenham seguido uma fissura natural no carste."
  de:
    - "Der Hiskia-Tunnel verläuft durch den Fels unter der Stadt Davids, dem Höhenrücken südlich des Tempelbergs in Jerusalem, von der Gihon-Quelle im Kidrontal auf der Ostseite zum Teich Siloah an der Südspitze des Rückens. Er windet sich über etwa 533 m, obwohl die Kartenpunkte für Quelle und Teich in der Luftlinie nur etwa 300 m auseinanderliegen. Er führt noch immer das Wasser der Quelle, und Besucher waten im Park der Stadt Davids in Silwan, Ostjerusalem, hindurch. Die Artikel von History Globe über die Stadt Davids, den Gihon und Siloah erzählen mehr; diese Antwort beschränkt sich auf den Verlauf des Tunnels."
    - "Die Chronik sagt genau, wohin er führte: „Er ist der Hiskia, der die obere Wasserquelle in Gihon zudeckte und leitete sie hinunter abendwärts von der Stadt Davids.“ Bevor Sanherib kam, beschloss Hiskia mit seinen Obersten, „zuzudecken die Wasser der Brunnen, die draußen vor der Stadt waren“, damit die Könige von Assyrien nicht „viel Wasser finden, wenn sie kommen“; die Königsbücher fassen zusammen: „der Teich und die Wasserleitung, durch die er Wasser in die Stadt geleitet hat“. Jesaja spricht von denselben Arbeiten: „werdet das Wasser des untern Teiches sammeln … und werdet einen Graben machen zwischen beiden Mauern vom Wasser des alten Teiches.“ Die Karte datiert den Tunnel auf etwa 700 v. Chr., kurz vor die Belagerung von 701."
    - "1880 fand man nahe dem unteren Ende des Tunnels eine in die Wand gehauene Inschrift. Sie erzählt, wie zwei Trupps von Steinhauern einander entgegenarbeiteten, durch den Fels die Stimmen des anderen hörten und sich trafen und wie das Wasser dann 1200 Ellen von der Quelle zum Teich floss; sie befindet sich heute in den Istanbuler Archäologischen Museen. Eine 2003 veröffentlichte Radiokarbondatierung von Pflanzenresten im Putz passt zur Regierungszeit Hiskias; Ronny Reich und Eli Shukron haben vertreten, der Tunnel sei früher begonnen worden, um 800 v. Chr., sodass die Zuschreibung an Hiskia umstritten ist. Auch warum der Tunnel Windungen macht, ist umstritten: Die Steinhauer könnten einer natürlichen Karstspalte gefolgt sein."
  fr:
    - "Le tunnel d’Ézéchias traverse le roc sous la Cité de David, la crête située au sud du mont du Temple à Jérusalem, depuis la source de Guihon, dans la vallée du Cédron, du côté est, jusqu’au bassin de Siloé, à la pointe sud de la crête. Il serpente sur environ 533 m, alors que les points de la carte pour la source et le bassin ne sont distants que d’environ 300 m à vol d’oiseau. Il porte toujours l’eau de la source, et les visiteurs le parcourent à gué dans le parc de la Cité de David, à Silwan, à Jérusalem-Est. Les articles de History Globe sur la Cité de David, Guihon et Siloé en disent davantage ; cette réponse se limite à l’emplacement du tunnel."
    - "Les Chroniques disent exactement où il passait : « Ce fut aussi lui, Ézéchias, qui boucha l’issue supérieure des eaux de Guihon, et les conduisit en bas vers l’occident de la cité de David. » Avant l’arrivée de Sanchérib, Ézéchias et ses chefs décidèrent « de boucher les sources d’eau qui étaient hors de la ville », afin que les rois d’Assyrie ne trouvent pas « à leur arrivée des eaux en abondance » ; le livre des Rois résume : « comment il fit l’étang et l’aqueduc, et amena les eaux dans la ville ». Ésaïe parle des mêmes travaux : « vous retenez les eaux de l’étang inférieur… Vous faites un réservoir entre les deux murs, pour les eaux de l’ancien étang. » La carte date le tunnel d’environ 700 av. J.-C., juste avant le siège de 701."
    - "En 1880 fut découverte une inscription gravée dans la paroi près de l’extrémité inférieure du tunnel. Elle raconte comment deux équipes de tailleurs de pierre travaillèrent l’une vers l’autre, s’entendirent à travers le roc et se rejoignirent, et comment l’eau coula ensuite sur 1 200 coudées, de la source au bassin ; elle se trouve aujourd’hui aux musées archéologiques d’Istanbul. La datation au radiocarbone de matières végétales prises dans l’enduit, publiée en 2003, s’accorde avec le règne d’Ézéchias ; Ronny Reich et Eli Shukron ont soutenu que le tunnel avait été commencé plus tôt, vers 800 av. J.-C., si bien que l’attribution à Ézéchias est discutée. Le tracé sinueux du tunnel est lui aussi débattu : les tailleurs ont pu suivre une fissure naturelle du karst."
  pl:
    - "Tunel Ezechiasza biegnie przez skałę pod Miastem Dawida, grzbietem na południe od Wzgórza Świątynnego w Jerozolimie, od źródła Gichon w dolinie Cedronu po wschodniej stronie do sadzawki Siloe na południowym krańcu grzbietu. Wije się na długości około 533 m, choć punkty źródła i sadzawki na mapie dzieli w linii prostej tylko około 300 m. Wciąż niesie wodę ze źródła, a zwiedzający brodzą w nim w parku Miasta Dawida w Silwanie, we Wschodniej Jerozolimie. Artykuły History Globe o Mieście Dawida, Gichonie i Siloe mówią więcej; ta odpowiedź ogranicza się do tego, którędy biegł tunel."
    - "Księga Kronik mówi dokładnie, którędy poprowadzono wodę: „Ten też Ezechyjasz zatkał źródło wód w Gichonie wyższe, a przywiódł je dołem na zachód słońca ku miastu Dawidowemu”. Zanim przybył Sennacheryb, Ezechiasz i jego książęta postanowili, „aby zatkali źródła wód, które były za miastem”, a lud pytał: „Czemużby przyszedłszy królowie Assyryjscy mieli znaleść tak wiele wód?”; Księga Królewska podsumowuje: „i jako uczynił sadzawkę, i rury, którymi przywiódł wodę do miasta”. Izajasz mówi o tych samych robotach: „zgromadziły się wody sadzawki dolnej… Uczyniliście też przekop między dwoma murami, dla wód stawu starego”. Mapa datuje tunel na około 700 p.n.e., tuż przed oblężeniem w 701."
    - "W 1880 roku znaleziono inskrypcję wykutą w ścianie blisko dolnego końca tunelu. Opowiada ona, jak dwie grupy kamieniarzy pracowały ku sobie, usłyszały swoje głosy przez skałę i spotkały się, i jak woda popłynęła potem 1200 łokci od źródła do sadzawki; jest dziś w Muzeach Archeologicznych w Stambule. Datowanie radiowęglowe materiału roślinnego w tynku, opublikowane w 2003 roku, pasuje do panowania Ezechiasza; Ronny Reich i Eli Shukron twierdzili, że tunel zaczęto wcześniej, około 800 p.n.e., więc przypisanie go Ezechiaszowi jest sporne. Spór dotyczy też tego, dlaczego tunel się wije: kamieniarze mogli podążać za naturalną szczeliną w skale krasowej."
  it:
    - "Il tunnel di Ezechia attraversa la roccia sotto la Città di Davide, il crinale a sud del Monte del Tempio a Gerusalemme, dalla sorgente di Ghicon nella valle del Cedron, sul lato orientale, fino alla Piscina di Siloe, all’estremità meridionale del crinale. Serpeggia per circa 533 m, benché i punti della mappa per la sorgente e la piscina distino solo circa 300 m in linea d’aria. Porta ancora l’acqua della sorgente, e i visitatori lo percorrono a guado nel parco della Città di Davide a Silwan, Gerusalemme Est. Gli articoli di History Globe sulla Città di Davide, su Ghicon e su Siloe dicono di più; questa risposta si limita a dove correva il tunnel."
    - "Le Cronache dicono esattamente dove andava: «Ezechia fu quegli che turò la sorgente superiore delle acque di Ghihon, che condusse giù direttamente, dal lato occidentale della città di Davide». Prima che Sennacherib venisse, Ezechia e i suoi capi deliberarono di «turar le sorgenti d’acqua ch’eran fuori della città», perché, dicevano, «i re d’Assiria, venendo, troverebbero essi abbondanza d’acqua?»; i Re lo riassumono: «com’egli fece il serbatoio e l’acquedotto e condusse le acque nella città». Isaia parla delle stesse opere: «raccogliete le acque dal serbatoio disotto… fate un bacino fra le due mura per le acque del serbatoio antico». La mappa data il tunnel al 700 a.C. circa, poco prima dell’assedio del 701."
    - "Nel 1880 fu trovata un’iscrizione incisa nella parete presso l’estremità inferiore del tunnel. Racconta come due squadre di scalpellini lavorassero l’una verso l’altra, si sentissero attraverso la roccia e si incontrassero, e come l’acqua scorresse poi per 1.200 cubiti dalla sorgente alla piscina; si trova ora nei Musei Archeologici di Istanbul. La datazione al radiocarbonio di materia vegetale nell’intonaco, pubblicata nel 2003, concorda con il regno di Ezechia; Ronny Reich ed Eli Shukron hanno sostenuto che il tunnel fu iniziato prima, intorno all’800 a.C., così che l’attribuzione a Ezechia è discussa. Anche il perché il tunnel serpeggi è oggetto di discussione: gli scalpellini possono aver seguito una fessura naturale nella roccia carsica."
  cs:
    - "Chizkijášův tunel vede skálou pod Městem Davidovým, hřebenem jižně od Chrámové hory v Jeruzalémě, od pramene Gichón v údolí Kidronu na východní straně k rybníku Siloe na jižním cípu hřebenu. Klikatí se na délce asi 533 m, ačkoli body pramene a rybníka na mapě jsou vzdušnou čarou vzdáleny jen asi 300 m. Stále vede vodu z pramene a návštěvníci jím brodí v parku Města Davidova v Silwánu ve východním Jeruzalémě. Více říkají články History Globe o Městě Davidově, Gichónu a Siloe; tato odpověď se drží jen toho, kudy tunel vedl."
    - "Kroniky říkají přesně, kudy šel: „Tentýž Ezechiáš zasypal tok vody Gihonu hořejší, a přímo vedl jej dolů k západní straně města Davidova.“ Než přitáhl Senacherib, Chizkijáš a jeho knížata se usnesli, „aby zasypali vody studnic, kteréž byly vně za městem“, aby králové Assyrští, až přitáhnou, nenašli „vody tak mnoho“. Knihy Královské to shrnují: „kterak udělal rybník, a vodu po trubách uvedl do města“. Izajáš mluví o týchž dílech: „shromáždili jste vody rybníka dolního… Udělali jste také stav mezi dvěma zdmi pro vody rybníka starého.“ Mapa datuje tunel zhruba do roku 700 př. n. l., těsně před obléháním roku 701."
    - "Roku 1880 byl nalezen nápis vytesaný do stěny poblíž dolního konce tunelu. Vypráví, jak dvě skupiny kameníků pracovaly proti sobě, slyšely navzájem své hlasy skrze skálu a setkaly se, a jak voda poté tekla 1 200 loket z pramene do rybníka; nyní je v Istanbulských archeologických muzeích. Radiokarbonové datování rostlinných zbytků v omítce, zveřejněné roku 2003, odpovídá Chizkijášově vládě; Ronny Reich a Eli Shukron tvrdili, že tunel byl započat dříve, kolem roku 800 př. n. l., takže připsání Chizkijášovi je sporné. Spor je i o to, proč tunel kličkuje: kameníci mohli sledovat přirozenou puklinu v krasu."
  nl:
    - "De tunnel van Chizkia loopt door de rots onder de Stad van David, de heuvelrug ten zuiden van de Tempelberg in Jeruzalem, van de bron Gihon in het Kidrondal aan de oostzijde naar de vijver van Siloam aan de zuidpunt van de heuvelrug. Hij kronkelt over ongeveer 533 m, hoewel de punten van de bron en de vijver op de kaart hemelsbreed maar ongeveer 300 m uit elkaar liggen. Hij voert nog steeds het water van de bron, en bezoekers waden er doorheen in het park van de Stad van David in Silwan, Oost-Jeruzalem. De artikelen van History Globe over de Stad van David, de Gihon en Siloam vertellen meer; dit antwoord beperkt zich tot de plaats waar de tunnel liep."
    - "Kronieken zegt precies waar hij liep: “Jehizkia stopte ook den opperuitgang der wateren van Gihon, en leidde ze recht af beneden naar het westen der stad Davids.” Voordat Sanherib kwam, besloten Chizkia en zijn vorsten “om de fonteinwateren te stoppen, die buiten de stad waren”, opdat de koningen van Assyrië niet zouden “komen, en veel waters vinden”; Koningen vat het samen: “hoe hij den vijver en den watergang gemaakt heeft, en water in de stad gebracht heeft”. Jesaja spreekt van dezelfde werken: “gij zult de wateren des ondersten vijvers vergaderen… Ook zult gij een gracht maken tussen beide de muren, voor de wateren des ouden vijvers.” De kaart dateert de tunnel op ongeveer 700 v.Chr., vlak vóór het beleg van 701."
    - "In 1880 werd een inscriptie gevonden, in de wand uitgehouwen nabij het onderste uiteinde van de tunnel. Zij vertelt hoe twee ploegen houwers naar elkaar toe werkten, elkaars stemmen door de rots hoorden en elkaar ontmoetten, en hoe het water daarna 1200 el van de bron naar de vijver stroomde; zij bevindt zich nu in de Archeologische Musea van Istanbul. Radiokoolstofdatering van plantenresten in het pleisterwerk, in 2003 gepubliceerd, past bij de regering van Chizkia; Ronny Reich en Eli Shukron hebben betoogd dat de tunnel eerder, rond 800 v.Chr., is begonnen, zodat de toeschrijving aan Chizkia omstreden is. Waarom de tunnel kronkelt wordt eveneens betwist: de houwers kunnen een natuurlijke spleet in de karst hebben gevolgd."
  sv:
    - "Hiskias tunnel går genom berget under Davids stad, åsen söder om Tempelberget i Jerusalem, från Gihonkällan i Kidrondalen på östra sidan till Siloadammen vid åsens södra spets. Den slingrar sig omkring 533 m, fastän kartans punkter för källan och dammen bara ligger omkring 300 m från varandra i fågelvägen. Den för fortfarande källans vatten, och besökare vadar genom den i parken Davids stad i Silwan, Östjerusalem. History Globes artiklar om Davids stad, Gihon och Siloa berättar mer; det här svaret håller sig till var tunneln gick."
    - "Krönikeböckerna anger exakt vart den ledde: ”Det var ock Hiskia som täppte till Gihonsvattnets övre källa och ledde vattnet nedåt, väster om Davids stad.” Innan Sanherib kom beslöt Hiskia och hans furstar ”att täppa för vattnet i de källor som lågo utom staden”, ty de sade: ”När de assyriska konungarna komma, böra de icke finna vatten i sådan myckenhet.” Kungaböckerna sammanfattar det som ”huru han anlade dammen och vattenledningen och ledde vatten in i staden”. Jesaja talar om samma arbeten: ”I samladen upp vattnet i Nedre dammen … Och mellan de båda murarna gjorden I en behållare för vattnet från Gamla dammen.” Kartan daterar tunneln till omkring 700 f.Kr., strax före belägringen 701."
    - "År 1880 hittades en inskription huggen i väggen nära tunnelns nedre ände. Den berättar hur två arbetslag av stenhuggare arbetade mot varandra, hörde varandras röster genom berget och möttes, och hur vattnet sedan rann 1 200 alnar från källan till dammen; den finns nu på Istanbuls arkeologiska museer. Radiokoldatering av växtmaterial i putsen, publicerad 2003, stämmer med Hiskias regering; Ronny Reich och Eli Shukron har hävdat att tunneln påbörjades tidigare, omkring 800 f.Kr., så tillskrivningen till Hiskia är omstridd. Varför tunneln slingrar sig diskuteras också: stenhuggarna kan ha följt en naturlig spricka i karstberget."
  nb:
    - "Hiskias tunnel går gjennom fjellet under Davidsbyen, åsryggen sør for Tempelplassen i Jerusalem, fra Gihon-kilden i Kedron-dalen på østsiden til Siloa-dammen på åsryggens sørspiss. Den slynger seg omtrent 533 m, selv om kartets punkter for kilden og dammen bare ligger omtrent 300 m fra hverandre i luftlinje. Den fører fortsatt kildens vann, og besøkende vader gjennom den i Davidsbyen-parken i Silwan, Øst-Jerusalem. History Globes artikler om Davidsbyen, Gihon og Siloa forteller mer; dette svaret holder seg til hvor tunnelen gikk."
    - "Krønikebøkene sier nøyaktig hvor den gikk: «Det var også Esekias som tilstoppet det øvre utløp av Gihonvannet og ledet det ned vestenfor Davids stad.» Før Sankerib kom, rådslo Hiskia med sine høvdinger om «å tilstoppe vannet i kildene utenfor byen», for at assyrerkongene ikke skulle «komme og finne rikelig vann»; Kongebøkene oppsummerer: «hvorledes han gjorde dammen og vannledningen og førte vannet inn i byen». Jesaja taler om de samme arbeidene: «I samler vannet i den nedre dam, … og I gjør en grav mellem begge murene for vannet fra den gamle dam». Kartet daterer tunnelen til omkring 700 f.Kr., like før beleiringen i 701."
    - "I 1880 ble det funnet en innskrift hugget inn i veggen nær tunnelens nedre ende. Den forteller hvordan to lag av steinhoggere arbeidet mot hverandre, hørte hverandres stemmer gjennom fjellet og møttes, og hvordan vannet så rant 1200 alen fra kilden til dammen; den er nå i Istanbuls arkeologiske museer. Radiokarbondatering av plantemateriale i pussen, publisert i 2003, passer med Hiskias regjeringstid; Ronny Reich og Eli Shukron har hevdet at tunnelen ble påbegynt tidligere, omkring 800 f.Kr., så tilskrivningen til Hiskia er omstridt. Hvorfor tunnelen slynger seg, er også omdiskutert: steinhoggerne kan ha fulgt en naturlig sprekk i karstfjellet."
  tl:
    - "Ang lagusan ni Ezechias ay dumaraan sa bato sa ilalim ng Bayan ni David, ang tagaytay sa timog ng Bundok ng Templo sa Jerusalem, mula sa bukal ng Gihon sa lambak ng Cedron sa silangang panig hanggang sa Tangke ng Siloe sa katimugang dulo ng tagaytay. Paliko-liko ito nang mga 533 m, bagaman ang mga punto ng bukal at ng tangke sa mapa ay mga 300 m lamang ang pagitan sa tuwid na guhit. Dinadala pa rin nito ang tubig ng bukal, at lumulusong dito ang mga bisita sa parke ng Bayan ni David sa Silwan, Silangang Jerusalem. Mas marami pang sinasabi ang mga artikulo ng History Globe tungkol sa Bayan ni David, Gihon at Siloe; ang sagot na ito ay nakatuon sa kung saan dumaan ang lagusan."
    - "Sinasabi ng Mga Cronica nang eksakto kung saan ito dumaan: “Ang Ezechias ding ito ang nagpatigil ng pinakamataas na bukal ng tubig sa Gihon, at ibinabang tuloy sa dakong kalunuran ng bayan ni David.” Bago dumating si Sennacherib, nagpasya si Ezechias at ang kaniyang mga prinsipe “upang patigilin ang tubig sa mga bukal na nangasa labas ng bayan”, sa katwirang: “Bakit paririto ang mga hari sa Asiria, at makakasumpong ng maraming tubig?” Ibinubuod ito ng Mga Hari: “kung paano niyang ginawa ang tipunan ng tubig, at ang padaluyan, at nagdala ng tubig sa bayan”. Nagsasalita si Isaias tungkol sa gayunding mga gawa: “inyong pinisan ang tubig ng mababang tangke… Kayo'y nagsigawa naman ng tipunang tubig sa pagitan ng dalawang kuta para sa tubig ng dating tangke.” Itinatakda ng mapa ang lagusan sa mga 700 BK, bago lamang ang pagkubkob noong 701."
    - "Noong 1880 ay natagpuan ang isang inskripsiyon na nakaukit sa pader malapit sa ibabang dulo ng lagusan. Isinasalaysay nito kung paano nagtrabaho nang magkaharap ang dalawang pangkat ng mga tagatabas, narinig ang tinig ng isa't isa sa bato at nagtagpo, at kung paano pagkatapos ay umagos ang tubig nang 1,200 siko mula sa bukal hanggang sa tangke; nasa Mga Museo ng Arkeolohiya ng Istanbul ito ngayon. Ang radiocarbon na pagpepetsa ng materyal ng halaman sa plaster, na nailathala noong 2003, ay umaayon sa paghahari ni Ezechias; ipinagtanggol nina Ronny Reich at Eli Shukron na mas maaga ang pagsisimula ng lagusan, mga 800 BK, kaya pinagtatalunan ang pag-uugnay kay Ezechias. Pinagtatalunan din kung bakit paliko-liko ang lagusan: maaaring sinundan ng mga tagatabas ang isang natural na biyak sa karst."
  da:
    - "Hizkijas tunnel løber gennem klippen under Davidsbyen, højdedraget syd for Tempelbjerget i Jerusalem, fra Gihon-kilden i Kedron-dalen på østsiden til Siloam-dammen ved højdedragets sydspids. Den snor sig over ca. 533 m, selv om kortets punkter for kilden og dammen kun ligger ca. 300 m fra hinanden i fugleflugt. Den fører stadig kildens vand, og besøgende vader gennem den i Davidsbyens park i Silwan, Østjerusalem. History Globes artikler om Davidsbyen, Gihon og Siloam fortæller mere; dette svar holder sig til, hvor tunnelen løb."
    - "Krønikebøgerne siger præcis, hvor den gik: »denne Ezekias tilstoppede ogsaa det øverste Vandløb fra Gihon og ledede det ned, Vest for Davids Stad«. Før Sankerib kom, rådførte Hizkija sig med sine øverster om »at tilstoppe Vandet fra Kilderne, som vare uden for Staden«, så Assyriens konger ikke skulle »komme og finde meget Vand«; Kongebøgerne opsummerer det, han gjorde: »Dammen og Vandledningen, hvorved han førte Vandet ind i Staden«. Esajas taler om de samme arbejder: »I samlede den nederste Dams Vand … I gjorde en Grav imellem de tvende Mure for Vandet af den gamle Dam.« Kortet dateres tunnelen til ca. 700 f.Kr., lige før belejringen i 701."
    - "I 1880 blev der fundet en indskrift hugget i væggen nær tunnelens nedre ende. Den fortæller, hvordan to hold stenhuggere arbejdede mod hinanden, hørte hinandens stemmer gennem klippen og mødtes, og hvordan vandet derefter løb 1.200 alen fra kilden til dammen; den findes nu på Istanbuls arkæologiske museer. Kulstof-14-datering af plantemateriale i kalkpudsen, offentliggjort i 2003, passer med Hizkijas regeringstid; Ronny Reich og Eli Shukron har argumenteret for, at tunnelen blev påbegyndt tidligere, omkring 800 f.Kr., så tilskrivningen til Hizkija er omstridt. Hvorfor tunnelen snor sig, er også omdiskuteret: Stenhuggerne kan have fulgt en naturlig sprække i karstklippen."
  sr:
    - "Језекијин тунел пролази кроз стену испод Давидовог града, гребена јужно од Храмовне горе у Јерусалиму, од извора Гион у долини Кедрона на источној страни до Силоамског језера на јужном врху гребена. Вијуга око 533 м, мада су тачке извора и језера на карти удаљене само око 300 м ваздушном линијом. И данас носи воду из извора, а посетиоци њиме газе у парку Давидовог града у Силвану, у Источном Јерусалиму. History Globe има чланке о Давидовом граду, Гиону и Силоаму, а овај одговор говори само о томе где је тунел пролазио."
    - "Летописи казују тачно куда је ишао: „Исти Језекија загради горњи извор воде Гиона, и право је сведе доле на западну страну града Давидовог.“ Пре него што је дошао Сенахирим, Језекија и његови кнезови решили су „да зарони изворе водене, који беху иза града“, јер су се питали: „Зашто кад дођу цареви асирски да нађу толико воде?“; Књига о царевима сажима: „како је начинио језеро, и воду довео у град“. Исаија говори о истим радовима: „сабрасте воду у доњем језеру… И начинисте јаз међу два зида за воду из старог језера.“ Карта датира тунел у око 700. п. н. е., непосредно пред опсаду 701."
    - "Године 1880. пронађен је натпис уклесан у зид близу доњег краја тунела. Он прича како су две групе клесара радиле једна ка другој, чуле једна другу кроз стену и сусреле се, и како је вода затим потекла 1.200 лаката од извора до језера; данас се налази у Истанбулским археолошким музејима. Радиокарбонско датирање биљних остатака у малтеру, објављено 2003, одговара Језекијиној владавини; Рони Рајх и Ели Шукрон тврдили су да је тунел започет раније, око 800. п. н. е., па је приписивање Језекији спорно. Спори се и зашто тунел вијуга: клесари су можда пратили природну пукотину у кршу."
  hu:
    - "Ezékiás alagútja a sziklán át vezet Dávid városa alatt, a Templomhegytől délre fekvő gerincen Jeruzsálemben, a keleti oldalon, a Kidron-völgyben lévő Gihon-forrástól a gerinc déli csücskén lévő Siloám-tóhoz. Mintegy 533 m hosszan kanyarog, noha a térképen a forrás és a tó pontja légvonalban csak mintegy 300 m-re van egymástól. Ma is a forrás vizét vezeti, és a látogatók átgázolnak rajta a Dávid városa parkban, Silwanban, Kelet-Jeruzsálemben. A History Globe Dávid városáról, Gihonról és Siloámról szóló cikkei többet mondanak; ez a válasz arra szorítkozik, hol húzódott az alagút."
    - "A Krónikák könyve pontosan megmondja, merre ment: „Ezékiás volt az, a ki betömé a Gihon vizeinek felső forrását, és Dávid városának napnyugat felől való részén vezeté lefelé.” Mielőtt Szanhérib eljött, Ezékiás tanácsot tartott vezéreivel, „hogy a városon kivül való forrásokat betöltsék”, és azt mondták: „Miért találjanak az assiriai királyok elegendő vizet, ha eljőnek?!” A Királyok könyve így foglalja össze: „hogy miképen csinálta a tavat és a vízcsöveket, a melyekkel a vizet a városba vezette”. Ézsaiás ugyanezekről a munkákról beszél: „összegyűjtitek az alsó tó vizét… És árkot csináltok a két kőfal között a régi tó vizének.” A térkép az alagutat Kr. e. 700 tájára keltezi, közvetlenül a Kr. e. 701-es ostrom előttre."
    - "1880-ban feliratot találtak az alagút alsó végénél a falba vésve. Elmondja, hogyan dolgozott két vájárcsoport egymás felé, hogyan hallották a sziklán át egymás hangját és találkoztak, és hogyan folyt azután a víz 1200 könyöknyire a forrástól a tóig; ma az Isztambuli Régészeti Múzeumokban van. A vakolatban talált növényi maradványok 2003-ban közölt radiokarbon-keltezése Ezékiás uralkodásához illik; Ronny Reich és Eli Shukron azonban amellett érvelt, hogy az alagút építését korábban, Kr. e. 800 tájt kezdték, így az Ezékiásnak tulajdonítás vitatott. Az is vitatott, miért kanyarog az alagút: a vájárok követhettek egy természetes karsztrepedést."
  fi:
    - "Hiskian tunneli kulkee kalliossa Daavidin kaupungin, Jerusalemin Temppelivuoren eteläpuolisen harjanteen, alla itäpuolella Kidronin laaksossa sijaitsevalta Gihonin lähteeltä harjanteen eteläkärjessä olevalle Siloan altaalle. Se mutkittelee noin 533 m, vaikka kartan pisteet lähteelle ja altaalle ovat linnuntietä vain noin 300 m:n päässä toisistaan. Se johtaa yhä lähteen vettä, ja vierailijat kahlaavat sen läpi Daavidin kaupungin puistossa Silwanissa, Itä-Jerusalemissa. History Globen artikkelit Daavidin kaupungista, Gihonista ja Siloasta kertovat lisää; tämä vastaus keskittyy siihen, missä tunneli kulki."
    - "Aikakirjat kertovat tarkasti, minne se johti: ”Hiskia myös tukki Giihonin veden yläjuoksun ja johti veden alas, länteenpäin, Daavidin kaupunkiin.” Ennen Sanheribin tuloa Hiskia ja hänen päämiehensä päättivät ”tukkiaksensa vesilähteet, jotka olivat kaupungin ulkopuolella”, ja he kysyivät: ”Miksi Assurin kuninkaat tultuansa löytäisivät vettä viljalti?” Kuninkaiden kirja tiivistää: ”kuinka hän rakensi lammikon ja vesijohdon ja johti veden kaupunkiin”. Jesaja puhuu samoista töistä: ”kokositte vedet Alalammikkoon… te teitte molempien muurien välille paikan, johon Vanhan lammikon vedet koottiin”. Kartta ajoittaa tunnelin noin vuoteen 700 eaa., vähän ennen vuoden 701 piiritystä."
    - "Vuonna 1880 tunnelin alapään lähellä seinään löytyi kaiverrettu kirjoitus. Se kertoo, kuinka kaksi louhijaryhmää työskenteli toisiaan kohti, kuuli toistensa äänet kallion läpi ja kohtasi, ja kuinka vesi virtasi sitten 1 200 kyynärää lähteestä altaaseen; se on nyt Istanbulin arkeologisissa museoissa. Rappauksen kasviaineksen radiohiiliajoitus, joka julkaistiin vuonna 2003, sopii Hiskian hallituskauteen; Ronny Reich ja Eli Shukron ovat esittäneet, että tunnelin rakentaminen aloitettiin aiemmin, noin 800 eaa., joten sen liittäminen Hiskiaan on kiistanalaista. Myös tunnelin mutkittelusta kiistellään: louhijat ovat saattaneet seurata luonnollista rakoa karstissa."
  vi:
    - "Đường hầm của Ê-xê-chia chạy xuyên qua đá bên dưới Thành Đa-vít, sườn đồi phía nam Núi Đền ở Giê-ru-sa-lem, từ suối Ghi-hôn trong thung lũng Xết-rôn ở phía đông đến Hồ Si-lô-ê ở mũi cực nam của sườn đồi. Nó uốn lượn dài khoảng 533 m, dù các điểm của suối và hồ trên bản đồ chỉ cách nhau khoảng 300 m theo đường thẳng. Nó vẫn dẫn nước của suối, và du khách lội qua đó trong công viên Thành Đa-vít ở Silwan, Đông Giê-ru-sa-lem. Các bài của History Globe về Thành Đa-vít, Ghi-hôn và Si-lô-ê nói thêm; câu trả lời này chỉ bàn về nơi đường hầm chạy qua."
    - "Sách Sử Ký nói chính xác nó đi đâu: Ê-xê-chia này “lấp nguồn trên của nước Ghi-hôn, và dẫn nó chảy ngầm dưới đất qua phía tây của thành Đa-vít”. Trước khi San-chê-ríp đến, Ê-xê-chia và các quan trưởng quyết định “ngăn nước suối ở ngoài thành”, để vua A-si-ri không “đến, thấy có nước nhiều”; sách Các Vua tóm lại: “cuộc xây hồ chứa nước, và kinh dẫn nước vào trong thành”. Ê-sai nói về cùng những công trình ấy: “thâu chứa nước ao dưới lại… đào hồ giữa khoảng hai tường thành đặng chứa nước ao cũ”. Bản đồ xác định niên đại đường hầm vào khoảng năm 700 TCN, ngay trước cuộc vây hãm năm 701."
    - "Năm 1880, người ta tìm thấy một bản khắc đục trên vách gần đầu dưới của đường hầm. Bản khắc kể hai nhóm thợ đục làm việc hướng về nhau, nghe tiếng nhau qua đá và gặp nhau, rồi nước chảy 1.200 cubit từ suối đến hồ; hiện nó được lưu giữ tại Bảo tàng Khảo cổ Istanbul. Việc định niên đại bằng carbon phóng xạ chất thực vật trong lớp vữa, công bố năm 2003, khớp với triều Ê-xê-chia; Ronny Reich và Eli Shukron đã lập luận rằng đường hầm được khởi công sớm hơn, vào khoảng năm 800 TCN, nên việc gán cho Ê-xê-chia còn tranh luận. Vì sao đường hầm uốn lượn cũng còn bàn cãi: những người thợ đục có thể đã đi theo một khe nứt tự nhiên trong địa hình karst."
  ro:
    - "Tunelul lui Ezechia trece prin stâncă sub Cetatea lui David, creasta de la sud de Muntele Templului din Ierusalim, de la izvorul Ghihon din valea Chedronului, pe latura de est, până la Scăldătoarea Siloamului, la vârful sudic al crestei. Șerpuiește pe circa 533 m, deși punctele izvorului și ale scăldătorii de pe hartă sunt la doar circa 300 m unul de altul în linie dreaptă. Duce și azi apa izvorului, iar vizitatorii îl străbat prin apă în parcul Cetății lui David din Silwan, Ierusalimul de Est. Articolele History Globe despre Cetatea lui David, Ghihon și Siloam spun mai multe; răspunsul de față se ține de traseul tunelului."
    - "Cronicile spun precis încotro a mers: Ezechia a astupat ieșirea de sus a apelor Ghihonului și a îndreptat-o drept în jos, în partea de apus a Cetății lui David. Înainte de venirea lui Senaherib, Ezechia și mai-marii lui au hotărât „să astupe apele izvoarelor, care erau afară de cetate”, ca regii Asiriei să nu vină și „să afle apă multă”; cartea Regilor rezumă: „fântâna și drumul apei, prin care a băgat apă în cetate”. Isaia vorbește despre aceleași lucrări: locuitorii au adunat apele scăldătorii de jos, iar „v’ați făcut vouă apă între două ziduri mai înlăuntru de scăldătoarea cea veche”. Harta datează tunelul în jurul anului 700 î.Hr., chiar înainte de asediul din 701."
    - "În 1880 s-a găsit o inscripție săpată în perete, aproape de capătul de jos al tunelului. Ea povestește cum două echipe de tăietori au lucrat una spre cealaltă, și-au auzit glasurile prin stâncă și s-au întâlnit, și cum apa a curs apoi 1.200 de coți de la izvor la scăldătoare; se află acum la Muzeele Arheologice din Istanbul. Datarea cu radiocarbon a unor resturi vegetale din tencuială, publicată în 2003, se potrivește cu domnia lui Ezechia; Ronny Reich și Eli Shukron au susținut că tunelul a fost început mai devreme, în jurul anului 800 î.Hr., așa că atribuirea către Ezechia este disputată. Se discută și de ce șerpuiește tunelul: tăietorii pot să fi urmat o fisură naturală din carst."
  bg:
    - "Тунелът на Езекия минава през скалата под Давидовия град — хребета южно от Храмовия хълм в Йерусалим, от извора Гион в долината Кедрон на източната страна до къпалнята Силоам в южния край на хребета. Той криволичи на около 533 м, макар че точките на картата за извора и къпалнята са само на около 300 м една от друга по права линия. Тунелът все още провежда водата на извора и посетителите газят през него в парка „Давидовият град“ в Силуан, Източен Йерусалим. Статиите на History Globe за Давидовия град, Гион и Силоам разказват повече; този отговор се ограничава с това откъде е минавал тунелът."
    - "Летописите казват точно накъде е водел: „Този Езекия затикна още и горния извор на водата на Гион, и управи я долу към запад на Давидовия град.“ Преди да дойде Сенахирим, Езекия и князете му решиха „да затикне водите на източниците които са вън от града“, за да не би асирийските царе да дойдат и да „намерят много вода“; Царе обобщава: „как направи водоема и водовода та доведе водата в града“. Исаия говори за същите съоръжения: „събрахте водите на долния водоем… Направихте още между двете стени ров За водата на стария водоем“. Картата датира тунела около 700 г. пр.н.е., малко преди обсадата от 701 г."
    - "През 1880 г. близо до долния край на тунела е открит надпис, изсечен в стената. Той разказва как две групи каменоделци работели една срещу друга, чули гласовете си през скалата и се срещнали и как след това водата потекла 1200 лакти от извора до къпалнята; днес надписът е в Истанбулските археологически музеи. Радиовъглеродното датиране на растителни остатъци в мазилката, публикувано през 2003 г., отговаря на царуването на Езекия; Рони Райх и Ели Шукрон твърдят, че тунелът е започнат по-рано, около 800 г. пр.н.е., така че приписването му на Езекия е спорно. Спори се и защо тунелът криволичи: каменоделците може да са следвали естествена пукнатина в карста."
