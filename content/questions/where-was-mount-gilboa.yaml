id: where-was-mount-gilboa
question:
  en: "Where is Mount Gilboa, where Saul died?"
  ru: "Где находится гора Гелвуй, где погиб Саул?"
  uk: "Де міститься гора Гільбоа, де загинув Саул?"
  es: "¿Dónde está el monte Gilboa, donde murió Saúl?"
  pt: "Onde fica o monte Gilboa, onde Saul morreu?"
  de: "Wo liegt das Gilboa-Gebirge, wo Saul starb?"
  fr: "Où se trouve le mont Guilboa, où mourut Saül ?"
  pl: "Gdzie leży Góra Gilboa, gdzie zginął Saul?"
  it: "Dov’è il Monte Gelboe, dove morì Saul?"
  cs: "Kde je hora Gilboa, kde zemřel Saul?"
  nl: "Waar ligt de berg Gilboa, waar Saul stierf?"
  sv: "Var ligger berget Gilboa, där Saul dog?"
  nb: "Hvor ligger Gilboa, der Saul døde?"
  tl: "Nasaan ang Bundok Gilboa, kung saan namatay si Saul?"
answer:
  en:
    - "Mount Gilboa is the ridge of hills on the south-eastern side of the valley of Jezreel, in northern Israel with its southern slopes in the West Bank, running from near Jezreel south-eastward and then south into the hills of Samaria, and falling steeply towards Beth-shan and the Jordan valley. The map's point stands on the southern part of the ridge, about 11 km south-west of Beth-shan, 16 km south-east of Jezreel and 75 km north of Jerusalem in a straight line. History Globe has an article on Mount Gilboa; this answer keeps to where it is and where Saul's last battle was fought."
    - "The armies faced each other across the eastern valley: “the Philistines gathered themselves together, and came and pitched in Shunem: and Saul gathered all Israel together, and they pitched in Gilboa”, and Israel camped “by a fountain which is in Jezreel”, probably the spring of Harod at the ridge's north-western foot. In the battle “the men of Israel fled from before the Philistines, and fell down slain in mount Gilboa”; Saul's three sons were killed and Saul fell on his sword. The next day the Philistines “found Saul and his three sons fallen in mount Gilboa” and fastened his body to the wall of Beth-shan, from which the men of Jabesh-gilead, about 20 km away across the Jordan, “went all night” to take it down. The map's year is about 1010 BC, a conventional point."
    - "David's lament for Saul and Jonathan curses the place: “Ye mountains of Gilboa, let there be no dew, neither let there be rain, upon you, nor fields of offerings: for there the shield of the mighty is vilely cast away.” The plural fits the ridge, a line of summits rather than one peak. Its Arabic name, Jebel Fuqu'a, is shared with the village of Faqqua on its southern slopes, and Eusebius knew a village Gelbus six miles from Scythopolis, as Beth-shan was then called. Where on the ridge the battle ended is not known: the text says only that Israel fled and fell on the mountain."
  ru:
    - "Гора Гелвуй — гряда холмов на юго-восточной стороне Изреельской долины, на севере Израиля, южными склонами уходящая на Западный берег; она тянется от окрестностей Изрееля на юго-восток, затем на юг, к горам Самарии, и круто обрывается к Беф-Сану и долине Иордана. Точка карты стоит на южной части гряды, примерно в 11 км к юго-западу от Беф-Сана, в 16 км к юго-востоку от Изрееля и в 75 км к северу от Иерусалима по прямой. В History Globe есть статья о горе Гелвуй; здесь ответ о том, где она находится и где шла последняя битва Саула."
    - "Войска стояли друг против друга через восточную часть долины: «собрались Филистимляне и пошли и стали станом в Сонаме; собрал и Саул весь народ Израильский, и стали станом на Гелвуе», а Израиль расположился «у источника, что в Изрееле», вероятно у источника Харода у северо-западного подножия гряды. В битве «побежали мужи Израильские от Филистимлян и пали пораженные на горе Гелвуе»; три сына Саула были убиты, а сам он бросился на меч. На другой день филистимляне «нашли Саула и трех сыновей его, павших на горе Гелвуйской», и повесили его тело на стене Беф-Сана, откуда люди Иависа Галаадского, примерно в 20 км за Иорданом, «шли всю ночь», чтобы снять его. Год карты — около 1010 г. до н. э., условная точка."
    - "Плач Давида о Сауле и Ионафане проклинает это место: «Горы Гелвуйские! да не сойдет ни роса, ни дождь на вас, и да не будет на вас полей с плодами, ибо там повержен щит сильных». Множественное число подходит к гряде — ряду вершин, а не одной горе. Её арабское имя, Джебель-Фукуа, носит и деревня Факкуа на южных склонах, а Евсевий знал селение Гелвус в шести милях от Скифополя, как тогда назывался Беф-Сан. Где на гряде кончилась битва, неизвестно: текст говорит лишь, что Израиль бежал и пал на горе."
  uk:
    - "Гора Гільбоа — пасмо пагорбів на південно-східному боці Єзреельської долини, на півночі Ізраїлю, з південними схилами на Західному березі Йордану, що тягнеться від околиць Єзреелю на південний схід, а потім на південь у пагорби Самарії й круто спадає до Бет-Шеана та долини Йордану. Точка на мапі стоїть на південній частині пасма, приблизно за 11 км на південний захід від Бет-Шеана, за 16 км на південний схід від Єзреелю і за 75 км на північ від Єрусалима по прямій. В «Історичному глобусі» є стаття про гору Гільбоа; ця відповідь стосується лише того, де вона розташована і де відбулася остання битва Саула."
    - "Війська стояли одне проти одного через східну долину: «зібрались Филистії до купи і пійшли та й отаборились в Сонамі. Скликав же і Саул усього Ізраїля та й став табором на Гелбуї», а Ізраїль отаборився «коло криницї під Езреелем», імовірно біля джерела Харод біля північно-західного підніжжя пасма. У битві «повтїкали мужі Ізраїльські перед Филистіями й полягли побиті на горі Гелбуї»; троє синів Саула було вбито, і Саул упав на свій меч. Наступного дня філістимляни «ізнайшли Саула з його трома синами полягшими на горі Гелбуї» і прикріпили його тіло до муру Бет-Шеана, з якого мужі Явісу Гілеадського, приблизно за 20 км звідти через Йордан, «йшли всю ніч», щоб зняти його. Рік на мапі — близько 1010 р. до н. е., умовна точка."
    - "Плач Давида за Саулом і Йонатаном проклинає це місце: «Ви ж гори, Гелвуйські, щоб на вас не впало нї дощу на ваші ниви, нї роси на поле, бо там покинений щит сильних». Множина пасує пасму — ряду вершин, а не одному піку. Його арабська назва, Джебель-Фукуа, збігається з назвою села Факуа на його південних схилах, а Євсевій знав село Гелбус за шість миль від Скитополя, як тоді називали Бет-Шеан. Де на пасмі завершилася битва — невідомо: текст каже лише, що Ізраїль утік і полягли на горі."
  es:
    - "El monte Gilboa es la cordillera de colinas del lado sureste del valle de Jezreel, en el norte de Israel, con sus laderas meridionales en Cisjordania, que va desde las cercanías de Jezreel hacia el sureste y luego hacia el sur, hasta las colinas de Samaria, y cae abruptamente hacia Bet-seán y el valle del Jordán. El punto del mapa está en la parte sur de la cordillera, a unos 11 km al suroeste de Bet-seán, a 16 km al sureste de Jezreel y a 75 km al norte de Jerusalén en línea recta. History Globe tiene un artículo sobre el monte Gilboa; esta respuesta se ciñe a dónde está y a dónde se libró la última batalla de Saúl."
    - "Los ejércitos se enfrentaron a través del valle oriental: «los Filisteos se juntaron, vinieron y asentaron campo en Sunam: y Saúl juntó á todo Israel, y asentaron campo en Gilboa», e Israel acampó «junto á la fuente que está en Jezreel», probablemente el manantial de Harod, al pie noroccidental de la cordillera. En la batalla, «los de Israel huyeron delante de los Filisteos, y cayeron muertos en el monte de Gilboa»; los tres hijos de Saúl murieron y Saúl se echó sobre su espada. Al día siguiente los filisteos «hallaron á Saúl y á sus tres hijos tendidos en el monte de Gilboa» y colgaron su cuerpo del muro de Bet-seán, de donde los hombres de Jabes de Galaad, a unos 20 km de distancia al otro lado del Jordán, «anduvieron toda aquella noche» para bajarlo. El año del mapa es hacia 1010 a. C., un punto convencional."
    - "El lamento de David por Saúl y Jonatán maldice el lugar: «Montes de Gilboa, ni rocío ni lluvia caiga sobre vosotros, ni seáis tierras de ofrendas; porque allí fué desechado el escudo de los valientes». El plural conviene a la cordillera, una línea de cumbres más que un solo pico. Su nombre árabe, Jebel Fuqu'a, lo comparte con la aldea de Faqqua, en sus laderas meridionales, y Eusebio conocía una aldea Gelbús a seis millas de Escitópolis, como se llamaba entonces Bet-seán. No se sabe en qué lugar de la cordillera acabó la batalla: el texto dice solo que Israel huyó y cayó en el monte."
  pt:
    - "O monte Gilboa é a cadeia de colinas no lado sudeste do vale de Jezreel, no norte de Israel, com suas encostas meridionais na Cisjordânia, que vai de perto de Jezreel para o sudeste e depois para o sul, até as colinas de Samaria, e desce íngreme em direção a Bete-Seã e ao vale do Jordão. O ponto do mapa fica na parte sul da cadeia, a cerca de 11 km a sudoeste de Bete-Seã, 16 km a sudeste de Jezreel e 75 km ao norte de Jerusalém em linha reta. O History Globe tem um artigo sobre o monte Gilboa; esta resposta trata apenas de onde ele fica e de onde se travou a última batalha de Saul."
    - "Os exércitos se defrontaram através do vale oriental: “os filisteus se reuniram, vieram e acamparam em Suném. Saul reuniu todo o Israel, e eles acamparam em Gilboa”, e Israel acampou “junto à fonte que fica em Jezreel”, provavelmente a fonte de Harode, no sopé noroeste da cadeia. Na batalha, “os homens de Israel fugiram diante deles e caíram mortos no monte Gilboa”; os três filhos de Saul foram mortos e Saul se lançou sobre a sua espada. No dia seguinte, os filisteus “encontraram Saul e seus três filhos caídos no monte Gilboa” e fixaram o seu corpo no muro de Bete-Seã, de onde os homens de Jabes-Gileade, a cerca de 20 km de distância, do outro lado do Jordão, “caminharam a noite inteira” para retirá-lo. O ano do mapa é cerca de 1010 a.C., um ponto convencional."
    - "O lamento de Davi por Saul e Jônatas amaldiçoa o lugar: “Ó montes de Gilboa, que não haja orvalho nem chuva sobre vocês, nem campos de ofertas; pois ali o escudo dos valentes foi profanado e jogado fora.” O plural convém à cadeia, uma linha de cumes e não um único pico. Seu nome árabe, Jebel Fuqu'a, é compartilhado com a aldeia de Faqqua em suas encostas meridionais, e Eusébio conhecia uma aldeia Gelbus a seis milhas de Citópolis, como então se chamava Bete-Seã. Em que ponto da cadeia terminou a batalha não se sabe: o texto diz apenas que Israel fugiu e caiu no monte."
  de:
    - "Das Gilboa-Gebirge ist der Höhenzug auf der Südostseite der Jesreel-Ebene, im Norden Israels, mit seinen Südhängen im Westjordanland; er verläuft von der Nähe von Jesreel südostwärts und dann südwärts in die Berge Samarias und fällt steil zum Jordantal und nach Bet-Schean ab. Der Kartenpunkt steht auf dem südlichen Teil des Rückens, in der Luftlinie etwa 11 km südwestlich von Bet-Schean, 16 km südöstlich von Jesreel und 75 km nördlich von Jerusalem. History Globe hat einen Artikel über das Gilboa-Gebirge; diese Antwort beschränkt sich darauf, wo es liegt und wo Sauls letzte Schlacht geschlagen wurde."
    - "Die Heere standen sich über die östliche Ebene hinweg gegenüber: „Da nun die Philister sich versammelten und kamen und lagerten sich zu Sunem, versammelte Saul auch das ganze Israel, und sie lagerten sich zu Gilboa“, und Israel lagerte „zu Ain in Jesreel“, wohl bei der Harod-Quelle am nordwestlichen Fuß des Rückens. In der Schlacht: „die Männer Israels flohen vor den Philistern und fielen erschlagen auf dem Gebirge Gilboa“; Sauls drei Söhne fielen, und Saul fiel in sein Schwert. Am nächsten Tag „kamen die Philister, die Erschlagenen auszuziehen, und fanden Saul und seine drei Söhne liegen auf dem Gebirge Gilboa“ und hefteten seinen Leichnam an die Mauer von Bet-Schean, von wo ihn die Männer von Jabesch in Gilead, etwa 20 km entfernt jenseits des Jordans, abnahmen: Sie „gingen die ganze Nacht“. Das Jahr der Karte ist etwa 1010 v. Chr., ein konventioneller Ansatz."
    - "Davids Klage um Saul und Jonatan verflucht den Ort: „Ihr Berge zu Gilboa, es müsse weder tauen noch regnen auf euch noch Äcker sein, davon Hebopfer kommen; denn daselbst ist den Helden ihr Schild abgeschlagen“. Der Plural passt zum Höhenzug, einer Kette von Gipfeln statt eines einzelnen Bergs. Sein arabischer Name, Dschebel Fuqu‘a, teilt er mit dem Dorf Faqqu‘a an seinen Südhängen, und Eusebius kannte ein Dorf Gelbus sechs Meilen von Skythopolis, wie Bet-Schean damals hieß. Wo auf dem Rücken die Schlacht endete, ist nicht bekannt: Der Text sagt nur, dass Israel floh und auf dem Berg fiel."
  fr:
    - "Le mont Guilboa est la chaîne de collines du côté sud-est de la vallée de Jizreel, dans le nord d’Israël, ses pentes méridionales se trouvant en Cisjordanie ; elle court depuis les abords de Jizreel vers le sud-est, puis vers le sud dans les collines de Samarie, et tombe à pic vers Beth-Schean et la vallée du Jourdain. Le point de la carte se trouve sur la partie sud de la chaîne, à environ 11 km au sud-ouest de Beth-Schean, à 16 km au sud-est de Jizreel et à 75 km au nord de Jérusalem à vol d’oiseau. History Globe consacre un article au mont Guilboa ; cette réponse se limite à son emplacement et au lieu de la dernière bataille de Saül."
    - "Les armées se faisaient face de part et d’autre de la vallée orientale : « Les Philistins se rassemblèrent, et vinrent camper à Sunem ; Saül rassembla tout Israël, et ils campèrent à Guilboa », et Israël campa « près de la source de Jizreel », probablement la source de Harod, au pied nord-ouest de la chaîne. Dans la bataille, « les hommes d’Israël prirent la fuite devant les Philistins et tombèrent morts sur la montagne de Guilboa » ; les trois fils de Saül furent tués et Saül se jeta sur son épée. Le lendemain, les Philistins « trouvèrent Saül et ses trois fils tombés sur la montagne de Guilboa » et attachèrent son cadavre aux murs de Beth-Schean, d’où les hommes de Jabès en Galaad, à environ 20 km de là, de l’autre côté du Jourdain, après avoir « marché toute la nuit », vinrent le détacher. L’année de la carte est vers 1010 av. J.-C., point conventionnel."
    - "La lamentation de David sur Saül et Jonathan maudit le lieu : « Montagnes de Guilboa ! Qu’il n’y ait sur vous ni rosée ni pluie, ni champs qui donnent des prémices pour les offrandes ! Car là ont été jetés les boucliers des héros ». Le pluriel convient à la chaîne, une ligne de sommets plutôt qu’un pic unique. Son nom arabe, Jebel Fuqu‘a, est partagé par le village de Faqqua, sur ses pentes méridionales, et Eusèbe connaissait un village de Gelbus à six milles de Scythopolis, nom que portait alors Beth-Schean. On ne sait pas où, sur la chaîne, s’acheva la bataille : le texte dit seulement qu’Israël s’enfuit et tomba sur la montagne."
  pl:
    - "Góra Gilboa to pasmo wzgórz po południowo-wschodniej stronie doliny Jizreel, w północnym Izraelu, a jego południowe stoki leżą na Zachodnim Brzegu; biegnie od okolic Jizreel na południowy wschód, a potem na południe w góry Samarii, i opada stromo ku Bet-Szean i dolinie Jordanu. Punkt na mapie stoi na południowej części grzbietu, około 11 km na południowy zachód od Bet-Szean, 16 km na południowy wschód od Jizreel i 75 km na północ od Jerozolimy w linii prostej. History Globe ma artykuł o Górze Gilboa; ta odpowiedź ogranicza się do jej położenia i miejsca ostatniej bitwy Saula."
    - "Armie stały naprzeciw siebie po obu stronach wschodniej doliny: „zebrawszy się tedy Filistynowie, przyciągnęli, a położyli się obozem u Sunam; zebrał też Saul wszystkiego Izraela, a położył się obozem w Gielboe”, a Izrael obozował „nad źródłem, które było w Jezreelu”, zapewne przy źródle Charod u północno-zachodniego podnóża grzbietu. W bitwie „uciekli mężowie Izraelscy przed Filistynami, a polegli zranieni na górze Gielboe”; trzej synowie Saula zginęli, a Saul rzucił się na swój miecz. Nazajutrz Filistyni „znaleźli Saula, i trzech synów jego leżących na górze Gielboe” i przybili jego ciało do muru Bet-Szean, skąd mieszkańcy Jabesz-Gilead, oddalonego o około 20 km za Jordanem, „szli przez onę całą noc”, aby je zdjąć. Rok na mapie to około 1010 p.n.e., punkt umowny."
    - "Lament Dawida nad Saulem i Jonatanem przeklina to miejsce: „O góry Gielboe! ani rosa, ani deszcz niech nie upada na was, i niech tam nie będą pola urodzajne; albowiem tam porzucona jest tarcz mocarzów”. Liczba mnoga pasuje do grzbietu, szeregu szczytów, a nie jednej góry. Jego arabska nazwa, Jebel Fuqu'a, jest wspólna z wsią Faqqua na jego południowych stokach, a Euzebiusz znał wieś Gelbus sześć mil od Scytopolis, jak wówczas nazywano Bet-Szean. Gdzie na grzbiecie zakończyła się bitwa, nie wiadomo: tekst mówi tylko, że Izrael uciekł i padł na górze."
  it:
    - "Il Monte Gelboe è la catena di colline sul lato sud-orientale della valle di Izreel, nel nord di Israele con i pendii meridionali in Cisgiordania, che corre da presso Izreel verso sud-est e poi a sud nelle colline della Samaria, e scende ripida verso Beth-Shean e la valle del Giordano. Il punto della mappa si trova sulla parte meridionale della catena, a circa 11 km a sud-ovest di Beth-Shean, 16 km a sud-est di Izreel e 75 km a nord di Gerusalemme in linea d’aria. History Globe ha un articolo sul Monte Gelboe; questa risposta si limita a dove si trova e a dove fu combattuta l’ultima battaglia di Saul."
    - "Gli eserciti si fronteggiavano al di là della valle orientale: «i Filistei si radunarono e vennero ad accamparsi a Sunem. Saul parimente radunò tutto Israele, e si accamparono a Ghilboa», e Israele si accampò «presso la sorgente di Izreel», probabilmente la sorgente di Carod ai piedi nord-occidentali della catena. Nella battaglia «gl’Israeliti fuggirono dinanzi ai Filistei, e caddero morti in gran numero sul monte Ghilboa»; i tre figli di Saul furono uccisi e Saul si gettò sulla sua spada. Il giorno dopo i Filistei «trovarono Saul e i suoi tre figliuoli caduti sul monte Ghilboa» e appesero il suo corpo alle mura di Beth-Shean, da dove gli uomini di Iabes di Galaad, a circa 20 km di distanza al di là del Giordano, «camminarono tutta la notte» per toglierlo. L’anno della mappa è circa il 1010 a.C., un punto convenzionale."
    - "Il lamento di Davide per Saul e Gionata maledice il luogo: «O monti di Ghilboa, su voi non cada più né rugiada né pioggia, né più vi siano campi da offerte; poiché là fu gettato via lo scudo de’ prodi». Il plurale si adatta alla catena, una linea di cime più che un solo picco. Il suo nome arabo, Jebel Fuqu‘a, è condiviso con il villaggio di Faqqua sui suoi pendii meridionali, ed Eusebio conosceva un villaggio Gelbus a sei miglia da Scitopoli, come allora si chiamava Beth-Shean. Dove sulla catena finì la battaglia non si sa: il testo dice solo che Israele fuggì e cadde sul monte."
  cs:
    - "Hora Gilboa je hřeben pahorků na jihovýchodní straně Jizreelského údolí, v severním Izraeli, s jižními svahy na Západním břehu, probíhající od okolí Jizreelu jihovýchodně a pak jižně do samařských hor a strmě klesající k Bét-šeanu a údolí Jordánu. Bod na mapě stojí na jižní části hřebene, asi 11 km jihozápadně od Bét-šeanu, 16 km jihovýchodně od Jizreelu a 75 km severně od Jeruzaléma vzdušnou čarou. History Globe má o hoře Gilboa článek; tato odpověď se drží jen toho, kde leží a kde se svedla Saulova poslední bitva."
    - "Armády stály proti sobě přes východní údolí: „shromáždivše se Filistinští, přitáhli a položili se u Sunem. Shromáždil i Saul všeho Izraele, a položili se v Gelboe“, a Izrael se položil „u studnice, kteráž byla v Jezreel“, pravděpodobně u pramene Charod na severozápadním úpatí hřebene. V bitvě „muži Izraelští utíkali před Filistinskými a padli, zbiti jsouce na hoře Gelboe“; Saulovi tři synové byli zabiti a Saul padl na svůj meč. Druhého dne Pelištejci „nalezli Saule a tři syny jeho ležící na hoře Gelboe“ a připevnili jeho tělo na hradbu Bét-šeanu, odkud je muži z Jabeše gileadského, asi 20 km daleko za Jordánem, „jdouce celou noc“ sňali. Mapa uvádí rok asi 1010 př. n. l., což je smluvní bod."
    - "Davidův nářek nad Saulem a Jonatanem místo proklíná: „Ó hory Gelboe, ani rosa, ani déšť nespadej na vás, ani tu buď pole úrodné; nebo tam jest povržen štít udatných.“ Množné číslo odpovídá hřebenu, řadě vrcholů, nikoli jedné hoře. Jeho arabský název, Džabal Fuqú‘a, sdílí vesnice Faqqúa na jeho jižních svazích a Eusebios znal vesnici Gelbus šest mil od Skytopole, jak se tehdy Bét-šean jmenoval. Kde na hřebeni bitva skončila, není známo: text říká jen, že Izrael utekl a padl na hoře."
  nl:
    - "De berg Gilboa is de heuvelrug aan de zuidoostzijde van de vallei van Jizreël, in het noorden van Israël met zijn zuidhellingen in de Westelijke Jordaanoever, die vanaf Jizreël naar het zuidoosten en daarna naar het zuiden de heuvels van Samaria in loopt en steil afvalt naar Beth-Sean en het Jordaandal. Het punt op de kaart staat op het zuidelijke deel van de rug, hemelsbreed ongeveer 11 km ten zuidwesten van Beth-Sean, 16 km ten zuidoosten van Jizreël en 75 km ten noorden van Jeruzalem. History Globe heeft een artikel over de berg Gilboa; dit antwoord beperkt zich tot de ligging en de plaats waar Sauls laatste slag werd geleverd."
    - "De legers stonden tegenover elkaar over het oostelijke dal: “de Filistijnen kwamen en vergaderden zich, en zij legerden zich te Sunem; en Saul vergaderde gans Israël, en zij legerden zich op Gilboa”, en Israël legerde zich “bij de fontein, die bij Jizreel is”, waarschijnlijk de bron van Charod aan de noordwestelijke voet van de rug. In de slag was het zo dat “de mannen Israels vloden voor het aangezicht der Filistijnen, en vielen verslagen op het gebergte Gilboa”; Sauls drie zonen werden gedood en Saul viel in zijn zwaard. De volgende dag “vonden zij Saul en zijn drie zonen, liggende op het gebergte Gilboa”, en zij hechtten zijn lichaam aan de muur van Beth-Sean, vanwaar de mannen van Jabes in Gilead, ongeveer 20 km verderop over de Jordaan, “den gehelen nacht” gingen om het af te halen. Het jaar op de kaart is ongeveer 1010 v.Chr., een conventioneel punt."
    - "Davids klaaglied over Saul en Jonatan vervloekt de plaats: “Gij, bergen van Gilboa, noch dauw noch regen moet zijn op u, noch velden der hefofferen; want aldaar is der helden schild smadelijk weggeworpen.” Het meervoud past bij de rug, een reeks toppen eerder dan één piek. De Arabische naam, Jebel Fuqu'a, delen ze met het dorp Faqqua op de zuidhellingen, en Eusebius kende een dorp Gelbus zes mijl van Scythopolis, zoals Beth-Sean toen heette. Waar op de rug de slag eindigde, is niet bekend: de tekst zegt alleen dat Israël vluchtte en op de berg viel."
  sv:
    - "Berget Gilboa är bergskedjan på sydöstra sidan av Jisreeldalen, i norra Israel med sina södra sluttningar på Västbanken, som löper från närheten av Jisreel åt sydost och sedan söderut in i Samarias berg och faller brant mot Bet-Shean och Jordandalen. Kartans punkt står på åsens södra del, omkring 11 km sydväst om Bet-Shean, 16 km sydost om Jisreel och 75 km norr om Jerusalem i fågelvägen. History Globe har en artikel om berget Gilboa; det här svaret håller sig till var det ligger och var Sauls sista strid stod."
    - "Härarna stod mot varandra över den östra dalen: ”Så församlade sig nu filistéerna och kommo och lägrade sig vid Sunem. Då församlade ock Saul hela Israel, och de lägrade sig vid Gilboa”, och Israel stod lägrat ”vid källan i Jisreel”, sannolikt Harods källa vid åsens nordvästra fot. I striden ”flydde Israels män för filistéerna och föllo slagna på berget Gilboa”; Sauls tre söner dödades och Saul störtade sig på sitt svärd. Dagen därefter kom filistéerna för att plundra de slagna och ”funno då Saul och hans tre söner, där de lågo fallna på berget Gilboa”, och fäste hans kropp vid Bet-Sheans mur, varifrån männen i Javesh-Gilead, omkring 20 km bort på andra sidan Jordan, ”gingo hela natten” för att ta ned den. Kartans år är omkring 1010 f.Kr., en konventionell tidpunkt."
    - "Davids klagan över Saul och Jonatan förbannar platsen: ”I Gilboa berg, på eder må ej falla dagg eller regn, ej ses offergärdsskördar. Ty hjältarnas sköld blev där till smälek, Sauls sköld, ej sedan smord med olja.” Pluralen passar åsen, en rad toppar snarare än en enda topp. Dess arabiska namn, Jebel Fuqu'a, delas med byn Faqqua på dess södra sluttningar, och Eusebios kände en by Gelbus sex romerska mil från Skythopolis, som Bet-Shean då kallades. Var på åsen striden tog slut är inte känt: texten säger bara att Israel flydde och föll på berget."
  nb:
    - "Gilboa er åsryggen på sørøstsiden av Jisreel-dalen, i Nord-Israel med de sørlige skråningene på Vestbredden, som løper fra nær Jisreel mot sørøst og så sørover inn i Samarias åser og faller bratt ned mot Bet-Sjean og Jordan-dalen. Kartets punkt står på den sørlige delen av ryggen, omtrent 11 km sørvest for Bet-Sjean, 16 km sørøst for Jisreel og 75 km nord for Jerusalem i luftlinje. History Globe har en artikkel om Gilboa; dette svaret holder seg til hvor det ligger og hvor Sauls siste slag sto."
    - "Hærene sto overfor hverandre på tvers av den østre dalen: «Da filistrene nu hadde samlet sig, trengte de frem til Sunem og leiret sig der. Da samlet Saul hele Israel, og de leiret sig på Gilboa», og Israel leiret seg «ved kilden i Jisre’el», sannsynligvis Harod-kilden ved ryggens nordvestlige fot. I slaget heter det: «Israels menn flyktet for filistrene, og det lå mange falne på Gilboa-fjellet»; Sauls tre sønner ble drept og Saul falt på sitt sverd. Dagen etter «fant de Saul og hans tre sønner liggende på Gilboafjellet», og festet hans kropp til muren i Bet-Sjean, hvorfra mennene i Jabesj-Gilead, omtrent 20 km unna på den andre siden av Jordan, «gikk hele natten» for å ta den ned. Kartets år er omkring 1010 f.Kr., et konvensjonelt punkt."
    - "Davids klagesang over Saul og Jonatan forbanner stedet: «I Gilboa-fjell! Ikke falle det dugg eller regn på eder, ei heller være der marker som bærer offergaver! For der blev heltes skjold plettet med blod, Sauls skjold, ei salvet med olje.» Flertallet passer til ryggen, en rekke topper snarere enn én enkelt. Det arabiske navnet, Jebel Fuqu‘a, deles med landsbyen Faqqua på de sørlige skråningene, og Eusebius kjente en landsby Gelbus seks romerske mil fra Skytopolis, som Bet-Sjean da ble kalt. Hvor på ryggen slaget endte, er ikke kjent: teksten sier bare at Israel flyktet og falt på fjellet."
  tl:
    - "Ang Bundok Gilboa ay ang tagaytay ng mga burol sa timog-silangang bahagi ng lambak ng Jezreel, sa hilagang Israel na ang mga timog na dalisdis ay nasa West Bank, na umaabot mula malapit sa Jezreel patungong timog-silangan at pagkatapos ay timog sa mga burol ng Samaria, at matarik na bumababa patungo sa Beth-san at sa lambak ng Jordan. Nasa timog na bahagi ng tagaytay ang punto sa mapa, mga 11 km sa timog-kanluran ng Beth-san, 16 km sa timog-silangan ng Jezreel at 75 km sa hilaga ng Jerusalem sa tuwid na guhit. May artikulo ang History Globe tungkol sa Bundok Gilboa; ang sagot na ito ay nakatuon sa kung nasaan ito at kung saan ginanap ang huling labanan ni Saul."
    - "Nagharap ang mga hukbo sa kabila ng silangang lambak: “nagpipisan ang mga Filisteo, at naparoon at humantong sa Sunam: at pinisan ni Saul ang buong Israel, at sila'y humantong sa Gilboa”, at ang Israel ay “humantong sa bukal na nasa Jezreel”, marahil ang bukal ng Harod sa hilagang-kanlurang paanan ng tagaytay. Sa labanan, “ang mga lalake sa Israel ay tumakas sa harap ng mga Filisteo, at nangabuwal na patay sa bundok ng Gilboa”; napatay ang tatlong anak ni Saul at nabuwal si Saul sa kaniyang tabak. Kinabukasan, “kanilang nasumpungan si Saul at ang kaniyang tatlong anak na nabuwal sa bundok ng Gilboa”; ikinabit ng mga Filisteo ang kaniyang bangkay sa pader ng Beth-san, kung saan ang mga lalaki ng Jabes-galaad, mga 20 km ang layo sa kabila ng Jordan, ay “nagsilakad sa buong gabi” upang ibaba ito. Ang taon sa mapa ay mga 1010 BK, isang kumbensiyonal na punto."
    - "Sinusumpa ng panaghoy ni David para kay Saul at Jonathan ang pook: “Kayong mga bundok ng Gilboa, Huwag magkaroon ng hamog, o ulan man sa inyo, kahit mga bukid na mga handog: Sapagka't diyan ang kalasag ng makapangyarihan ay nahagis ng kahalayhalay.” Akma ang pangmaramihan sa tagaytay, isang hanay ng mga tuktok sa halip na isang rurok. Ang pangalan nitong Arabe, Jebel Fuqu'a, ay ibinabahagi sa nayon ng Faqqua sa mga timog na dalisdis nito, at may nakilalang nayong Gelbus si Eusebio, anim na milya mula sa Scythopolis, na siyang tawag noon sa Beth-san. Hindi alam kung saan sa tagaytay natapos ang labanan: sinasabi lamang ng teksto na tumakas ang Israel at nabuwal sa bundok."
