body:
  en:
    - "Mozah was a town of Benjamin in the hills just west of Jerusalem, listed with its neighbours: “And Mizpeh, and Chephirah, and Mozah”. The name survives at Motza, by the old road from Jerusalem to the coast, where the Arab village of Qalunya stood until 1948; Tel Motza is identified with the biblical town. Today Motza lies on the western edge of Jerusalem."
    - "Rescue excavations by the Israel Antiquities Authority before the widening of Highway 1 uncovered at Tel Motza a town of the Judahite monarchy with a public building, storehouses and silos, and in 2012, under Anna Eirikh, Hamoudi Khalaily and Shua Kisilevitz, a temple of the tenth–ninth century BC (Iron IIA) with cult vessels and small pottery figurines of men and animals in its courtyard; Kisilevitz has called it the first Iron Age temple excavated in the heart of Judah."
    - "The Mishnah says that at the feast of Tabernacles willow branches were gathered at “a place below Jerusalem, and it was called Motza” and set up around the altar; the Talmud explains that it was a colonia, exempt from the royal tax. Josephus records that after the war Vespasian gave land to 800 discharged soldiers at a place called Ammaus near Jerusalem; many identify it with Motza, whose later name Qalunya is thought to recall the Latin colonia, and some see in it the Emmaus of Luke."
  ru:
    - "Моца — город Вениамина в горах сразу к западу от Иерусалима, названный вместе с соседями: «Мицфе, Кефира и Моца». Имя сохранилось в Моце, у старой дороги из Иерусалима к побережью, где до 1948 г. стояла арабская деревня Калуния; с библейским городом отождествляют Тель-Моцу. Сегодня Моца лежит на западной окраине Иерусалима."
    - "Спасательные раскопки Управления древностей Израиля перед расширением шоссе № 1 открыли на Тель-Моце город времён Иудейского царства с общественным зданием, кладовыми и зернохранилищами, а в 2012 г. под руководством Анны Эйрих, Хамуди Халаили и Шуа Кисилевиц — храм X–IX вв. до н. э. (железный век IIA) с культовыми сосудами и маленькими глиняными фигурками людей и животных во дворе; Кисилевиц назвала его первым храмом железного века, раскопанным в самом сердце Иудеи."
    - "Мишна говорит, что в праздник Кущей ветви ивы собирали в «месте ниже Иерусалима, и называлось оно Моца», и ставили вокруг жертвенника; Талмуд поясняет, что это была колония, освобождённая от царской подати. Иосиф Флавий пишет, что после войны Веспасиан дал землю 800 отпущенным воинам в месте под названием Аммаус близ Иерусалима; многие отождествляют его с Моцей, чьё позднее имя Калуния, как считают, восходит к латинскому colonia, а некоторые видят в нём Эммаус Луки."
  de:
    - "Moza war eine Stadt Benjamins im Bergland unmittelbar westlich von Jerusalem, mit ihren Nachbarn aufgeführt: „Mizpe, Kaphira, Moza“. Der Name überlebt in Motza an der alten Straße von Jerusalem zur Küste, wo das arabische Dorf Qalunja bis 1948 stand; Tel Motza wird mit der biblischen Stadt gleichgesetzt. Heute liegt Motza am westlichen Rand von Jerusalem."
    - "Rettungsgrabungen der israelischen Altertümerbehörde vor dem Ausbau der Autobahn 1 legten in Tel Motza eine Stadt der judäischen Monarchie mit einem öffentlichen Gebäude, Vorratsräumen und Silos frei, und 2012 unter Anna Eirikh, Hamoudi Khalaily und Shua Kisilevitz einen Tempel des zehnten bis neunten Jahrhunderts v. Chr. (Eisen IIA) mit Kultgefäßen und kleinen Tonfiguren von Menschen und Tieren in seinem Hof; Kisilevitz hat ihn den ersten im Herzen Judas ausgegrabenen Tempel der Eisenzeit genannt."
    - "Die Mischna sagt, am Laubhüttenfest seien Weidenzweige an „einem Ort unterhalb Jerusalems, und er hieß Motza“ gesammelt und rings um den Altar aufgestellt worden; der Talmud erklärt, es sei eine Colonia gewesen, von der königlichen Steuer befreit. Josephus berichtet, Vespasian habe nach dem Krieg 800 entlassenen Soldaten an einem Ort namens Ammaus nahe Jerusalem Land gegeben; viele setzen ihn mit Motza gleich, dessen späterer Name Qalunja an das lateinische colonia erinnern soll, und manche sehen darin das Emmaus des Lukas."
  fr:
    - "Motsa était une ville de Benjamin dans les collines juste à l’ouest de Jérusalem, citée avec ses voisines : « Mitspé, Kephira, Motsa ». Le nom survit à Motza, près de l’ancienne route de Jérusalem à la côte, où se dressait jusqu’en 1948 le village arabe de Qalunya ; Tel Motza est identifié avec la ville biblique. Aujourd’hui, Motza se trouve à la lisière ouest de Jérusalem."
    - "Des fouilles de sauvetage de l’Autorité des antiquités d’Israël avant l’élargissement de la route 1 ont mis au jour à Tel Motza une ville de la monarchie judéenne avec un édifice public, des magasins et des silos, et en 2012, sous Anna Eirikh, Hamoudi Khalaily et Shua Kisilevitz, un temple des Xe–IXe siècles av. J.-C. (Fer IIA) avec des vases cultuels et de petites figurines de terre cuite d’hommes et d’animaux dans sa cour ; Kisilevitz l’a appelé le premier temple de l’âge du Fer fouillé au cœur de Juda."
    - "La Mishna dit qu’à la fête des Tabernacles, on cueillait des branches de saule dans « un lieu au-dessous de Jérusalem, nommé Motsa », et qu’on les dressait autour de l’autel ; le Talmud explique que c’était une colonia, exemptée de l’impôt royal. Josèphe rapporte qu’après la guerre Vespasien donna des terres à 800 soldats libérés en un lieu appelé Ammaous près de Jérusalem ; bien des savants l’identifient avec Motsa, dont le nom plus tardif de Qalunya passe pour rappeler le latin colonia, et certains y voient l’Emmaüs de Luc."
  pt:
    - "Mozá era uma cidade de Benjamim nas colinas logo a oeste de Jerusalém, listada com suas vizinhas: “Mispá, Quefira, Mosa”. O nome sobrevive em Motza, junto à antiga estrada de Jerusalém para o litoral, onde ficava até 1948 a aldeia árabe de Qalunya; Tel Motza é identificada com a cidade bíblica. Hoje Motza fica na borda ocidental de Jerusalém."
    - "Escavações de resgate da Autoridade de Antiguidades de Israel antes do alargamento da Rodovia 1 revelaram em Tel Motza uma cidade da monarquia judaíta com um edifício público, depósitos e silos, e em 2012, sob Anna Eirikh, Hamoudi Khalaily e Shua Kisilevitz, um templo do século X–IX a.C. (Ferro IIA) com vasos de culto e pequenas figuras de cerâmica de homens e animais em seu pátio; Kisilevitz o chamou de o primeiro templo da Idade do Ferro escavado no coração de Judá."
    - "A Mishná diz que, na festa das Cabanas, ramos de salgueiro eram colhidos em “um lugar abaixo de Jerusalém, e se chamava Motza” e erguidos ao redor do altar; o Talmude explica que era uma colonia, isenta do imposto real. Josefo registra que, depois da guerra, Vespasiano deu terras a 800 soldados dispensados em um lugar chamado Ammaus, perto de Jerusalém; muitos o identificam com Motza, cujo nome posterior Qalunya se pensa recordar o latim colonia, e alguns veem nela o Emaús de Lucas."
  it:
    - "Mosa era una città di Beniamino sulle colline subito a ovest di Gerusalemme, elencata con le sue vicine: «Mitspe, Kefira, Motsa». Il nome sopravvive a Motza, lungo l’antica strada da Gerusalemme alla costa, dove sorgeva fino al 1948 il villaggio arabo di Qalunya; Tel Motza è identificato con la città biblica. Oggi Motza si trova al margine occidentale di Gerusalemme."
    - "Scavi di salvataggio dell’Israel Antiquities Authority prima dell’allargamento della strada n. 1 portarono alla luce a Tel Motza una città della monarchia di Giuda con un edificio pubblico, magazzini e silos, e nel 2012, sotto la guida di Anna Eirikh, Hamoudi Khalaily e Shua Kisilevitz, un tempio del X–IX secolo a.C. (Ferro IIA) con vasi cultuali e piccole figurine di terracotta di uomini e animali nel cortile; Kisilevitz lo ha definito il primo tempio dell’età del Ferro scavato nel cuore di Giuda."
    - "La Mishnah dice che nella festa delle Capanne si raccoglievano rami di salice in «un luogo sotto Gerusalemme, e si chiamava Motza» e li si piantava attorno all’altare; il Talmud spiega che era una colonia, esente dall’imposta del re. Giuseppe Flavio riferisce che dopo la guerra Vespasiano diede terra a 800 soldati congedati in un luogo chiamato Ammaus vicino a Gerusalemme; molti lo identificano con Motza, il cui nome più tardo Qalunya si ritiene ricordi il latino colonia, e alcuni vi vedono l’Emmaus di Luca."
  nl:
    - "Moza was een stad van Benjamin in de heuvels net ten westen van Jeruzalem, vermeld met haar buren: “En Mizpe, en Chefira, en Moza”. De naam leeft voort in Motza, aan de oude weg van Jeruzalem naar de kust, waar tot 1948 het Arabische dorp Qalunya stond; Tel Motza wordt met de bijbelse stad vereenzelvigd. Tegenwoordig ligt Motza aan de westrand van Jeruzalem."
    - "Reddingsopgravingen van de Israel Antiquities Authority vóór de verbreding van Highway 1 brachten bij Tel Motza een stad uit de tijd van de koningen van Juda aan het licht met een openbaar gebouw, voorraadkamers en silo's, en in 2012, onder Anna Eirikh, Hamoudi Khalaily en Shua Kisilevitz, een tempel uit de tiende–negende eeuw v.Chr. (ijzertijd IIA) met cultusvoorwerpen en kleine aardewerken beeldjes van mensen en dieren op het voorhof; Kisilevitz noemde het de eerste tempel uit de ijzertijd die in het hart van Juda is opgegraven."
    - "De Misjna zegt dat bij het Loofhuttenfeest wilgentakken werden verzameld op “een plaats onder Jeruzalem, en zij heette Motza” en rond het altaar werden geplaatst; de Talmoed legt uit dat het een colonia was, vrijgesteld van de koninklijke belasting. Josephus vermeldt dat Vespasianus na de oorlog land gaf aan 800 afgezwaaide soldaten op een plaats Ammaus genaamd bij Jeruzalem; velen vereenzelvigen die met Motza, wier latere naam Qalunya naar men denkt aan het Latijnse colonia herinnert, en sommigen zien erin het Emmaüs van Lukas."
  pl:
    - "Moca było miastem Beniamina na wzgórzach tuż na zachód od Jerozolimy, wymienionym wraz z sąsiadami: „I Misfe, i Kafara, i Mosa”. Nazwa przetrwała w Motza, przy starej drodze z Jerozolimy do wybrzeża, gdzie do 1948 roku stała arabska wieś Kalunija; Tel Motza utożsamia się z biblijnym miastem. Dziś Motza leży na zachodnim skraju Jerozolimy."
    - "Ratownicze wykopaliska Izraelskiej Służby Starożytności przed poszerzeniem autostrady nr 1 odsłoniły w Tel Motza miasto z czasów monarchii judzkiej z budynkiem publicznym, magazynami i silosami, a w 2012 roku, pod kierunkiem Anny Eirikh, Hamoudiego Khalailyego i Szui Kisilevitz, świątynię z X-IX w. p.n.e. (żelazo IIA) z naczyniami kultowymi i małymi glinianymi figurkami ludzi i zwierząt na dziedzińcu; Kisilevitz nazwała ją pierwszą świątynią z epoki żelaza odkopaną w sercu Judy."
    - "Miszna mówi, że w Święto Namiotów zbierano gałęzie wierzby w „miejscu poniżej Jerozolimy, które nazywało się Motza”, i ustawiano je wokół ołtarza; Talmud wyjaśnia, że była to colonia, zwolniona z podatku królewskiego. Józef Flawiusz zapisuje, że po wojnie Wespazjan dał ziemię 800 zwolnionym żołnierzom w miejscu zwanym Ammaus koło Jerozolimy; wielu utożsamia je z Motza, której późniejsza nazwa Kalunija ma przypominać łacińskie colonia, a niektórzy widzą w niej Emaus Łukasza."
  uk:
    - "Моца була містом Веніяміна в горах просто на захід від Єрусалима, згаданим разом із сусідами: «Мицфе, Кефира, Моза». Назва збереглася в Моці, біля старої дороги з Єрусалима до узбережжя, де до 1948 р. стояло арабське село Калунія; Тель-Моца ототожнюють із біблійним містом. Нині Моца лежить на західному краю Єрусалима."
    - "Рятівні розкопки Управління старожитностей Ізраїлю перед розширенням шосе № 1 виявили в Тель-Моці місто юдейської монархії із громадською будівлею, коморами й силосами, а 2012 р. під керівництвом Анни Ейріх, Хамуді Халайлі та Шуа Кісілевіц — храм X–IX ст. до н. е. (залізна доба IIA) із культовим посудом і маленькими керамічними фігурками людей і тварин у дворі; Кісілевіц назвала його першим храмом залізної доби, розкопаним у серці Юдеї."
    - "Мишна каже, що на свято Кучок вербові гілки збирали в «місці нижче Єрусалима, і воно називалося Моца» й ставили навколо жертовника; Талмуд пояснює, що це була колонія, звільнена від царського податку. Йосиф Флавій повідомляє, що по війні Веспасіан дав землю 800 звільненим воїнам у місці під назвою Аммаус поблизу Єрусалима; багато хто ототожнює його з Моцею, пізня назва якої, Калунія, як вважають, нагадує латинське colonia, а дехто вбачає в ній Еммаус Луки."
  cs:
    - "Moca bylo město Benjamínovo v kopcích těsně západně od Jeruzaléma, uvedené se svými sousedy: „Masfa, Kafira a Mosa“. Jméno se zachovalo v Moce, u staré cesty z Jeruzaléma k pobřeží, kde do roku 1948 stála arabská vesnice Kalúnija; Tel Moca se ztotožňuje s biblickým městem. Dnes leží Moca na západním okraji Jeruzaléma."
    - "Záchranné vykopávky Izraelského úřadu pro starožitnosti před rozšířením dálnice č. 1 odkryly v Tel Moca město z doby judské monarchie s veřejnou budovou, sklady a zásobními jámami a roku 2012 pod vedením Anny Eirikh, Hamúdího Chalílího a Shua Kisilevitz chrám z desátého až devátého století př. n. l. (železná doba IIA) s kultovními nádobami a malými keramickými figurkami mužů a zvířat na nádvoří; Kisilevitz jej nazvala prvním chrámem z doby železné vykopaným v srdci Judska."
    - "Mišna říká, že na svátek stánků se vrbové ratolesti sbíraly na „místě pod Jeruzalémem, které se jmenovalo Moca“, a stavěly kolem oltáře; Talmud vysvětluje, že šlo o colonii osvobozenou od královské daně. Josephus Flavius zaznamenává, že po válce dal Vespasianus půdu 800 propuštěným vojákům na místě zvaném Ammaus poblíž Jeruzaléma; mnozí je ztotožňují s Mocou, jejíž pozdější jméno Kalúnija má připomínat latinské colonia, a někteří v ní vidí Lukášovy Emauzy."
  es:
    - "Mosa era una ciudad de Benjamín en las colinas justo al oeste de Jerusalén, enumerada con sus vecinas: «Y Mizpa, Chephira, y Moza». El nombre pervive en Motza, junto al antiguo camino de Jerusalén a la costa, donde se alzó hasta 1948 la aldea árabe de Qalunya; Tel Motza se identifica con la ciudad bíblica. Hoy Motza se halla en el borde occidental de Jerusalén."
    - "Las excavaciones de rescate de la Autoridad de Antigüedades de Israel antes del ensanche de la Autopista 1 sacaron a la luz en Tel Motza una ciudad de la monarquía de Judá con un edificio público, almacenes y silos, y en 2012, bajo Anna Eirikh, Hamoudi Khalaily y Shua Kisilevitz, un templo de los siglos X–IX a. C. (Hierro IIA) con vasijas de culto y pequeñas figurillas de cerámica de hombres y animales en su patio; Kisilevitz lo ha llamado el primer templo de la edad del Hierro excavado en el corazón de Judá."
    - "La Misná dice que en la fiesta de los Tabernáculos se recogían ramas de sauce en «un lugar debajo de Jerusalén, y se llamaba Motza» y se colocaban alrededor del altar; el Talmud explica que era una colonia, exenta del impuesto real. Josefo refiere que, tras la guerra, Vespasiano dio tierras a 800 soldados licenciados en un lugar llamado Ammaus, cerca de Jerusalén; muchos lo identifican con Motza, cuyo nombre posterior Qalunya se piensa que recuerda el latín colonia, y algunos ven en él el Emaús de Lucas."
  sv:
    - "Mosa var en stad i Benjamin i bergen strax väster om Jerusalem och nämns tillsammans med sina grannar: ”Mispe, Kefira, Mosa”. Namnet lever kvar i Motza vid den gamla vägen från Jerusalem till kusten, där den arabiska byn Qalunya låg fram till 1948; Tel Motza identifieras med den bibliska staden. I dag ligger Motza i Jerusalems västra utkant."
    - "Räddningsgrävningar av Israels antikvitetsmyndighet inför breddningen av Väg 1 avtäckte vid Tel Motza en stad från Judas monarki med en offentlig byggnad, magasin och silor, och 2012, under ledning av Anna Eirikh, Hamoudi Khalaily och Shua Kisilevitz, ett tempel från 900- och 800-talen f.Kr. (järnålder IIA) med kultkärl och små lerfigurer föreställande män och djur på gården; Kisilevitz har kallat det det första templet från järnåldern som grävts ut i hjärtat av Juda."
    - "Mishna säger att man vid lövhyddofesten samlade pilgrenar på ”en plats nedanför Jerusalem, och den kallades Motza” och ställde upp dem runt altaret; Talmud förklarar att det var en kolonia, befriad från den kungliga skatten. Josefus berättar att Vespasianus efter kriget gav mark åt 800 avskedade soldater på en plats vid namn Ammaus nära Jerusalem; många identifierar den med Motza, vars senare namn Qalunya antas påminna om latinets colonia, och somliga ser i den Lukas Emmaus."
  nb:
    - "Mosa var en by i Benjamin i åsene like vest for Jerusalem, oppført sammen med nabobyene: «og Mispe og Hakkefira og Hammosa». Navnet lever videre i Motza, ved den gamle veien fra Jerusalem til kysten, der den arabiske landsbyen Qalunya lå til 1948; Tel Motza er identifisert med den bibelske byen. I dag ligger Motza ved den vestlige kanten av Jerusalem."
    - "Redningsutgravninger ved Israel Antiquities Authority før utvidelsen av Highway 1 avdekket ved Tel Motza en by fra det judeiske kongedømmet med en offentlig bygning, forrådshus og siloer, og i 2012, under Anna Eirikh, Hamoudi Khalaily og Shua Kisilevitz, et tempel fra 900- til 800-tallet f.Kr. (jernalder IIA) med kultkar og små leirfigurer av mennesker og dyr i forgården; Kisilevitz har kalt det det første templet fra jernalderen som er gravd ut i hjertet av Juda."
    - "Mishna sier at man ved løvhyttefesten samlet pilegrener på «et sted nedenfor Jerusalem, og det ble kalt Motza» og reiste dem rundt alteret; Talmud forklarer at det var en colonia, fritatt for kongeskatten. Josefus forteller at Vespasian etter krigen ga land til 800 utskrevne soldater på et sted som het Ammaus nær Jerusalem; mange identifiserer det med Motza, hvis senere navn Qalunya antas å minne om det latinske colonia, og noen ser i det Emmaus hos Lukas."
  tl:
    - "Ang Moza ay isang bayan ng Benjamin sa mga burol sa kanluran lamang ng Jerusalem, na nakalista kasama ng mga kapitbahay nito: “At Mizpe, at Chephira, at Moza”. Nananatili ang pangalan sa Motza, sa tabi ng lumang daan mula Jerusalem patungo sa baybayin, kung saan nakatayo ang nayong Arabe ng Qalunya hanggang 1948; ang Tel Motza ay kinikilala sa bayan sa Bibliya. Sa ngayon, ang Motza ay nasa kanlurang gilid ng Jerusalem."
    - "Ang mga paghuhukay ng pagsagip ng Israel Antiquities Authority bago ang pagpapalapad ng Highway 1 ay naglantad sa Tel Motza ng isang bayan ng monarkiya ng Juda na may pampublikong gusali, mga imbakan at mga silo, at noong 2012, sa ilalim nina Anna Eirikh, Hamoudi Khalaily at Shua Kisilevitz, isang templo noong ika-10–ika-9 na siglo BK (Panahong Bakal IIA) na may mga sisidlang pangrelihiyon at maliliit na pigurinang luwad ng mga tao at hayop sa bakuran nito; tinawag ito ni Kisilevitz na kauna-unahang templo ng Panahong Bakal na nahukay sa puso ng Juda."
    - "Sinasabi ng Mishnah na sa Pista ng mga Tabernakulo ay tinitipon ang mga sanga ng wilow sa “isang lugar sa ibaba ng Jerusalem, at tinawag itong Motza” at itinatayo sa palibot ng dambana; ipinaliliwanag ng Talmud na ito ay isang colonia, hindi sakop ng buwis ng hari. Itinatala ni Josephus na pagkatapos ng digmaan ay nagbigay si Vespasiano ng lupa sa 800 pinalayang sundalo sa isang lugar na tinatawag na Ammaus malapit sa Jerusalem; marami ang kumikilala rito sa Motza, na ang kalaunang pangalang Qalunya ay inaakalang nagpapaalala sa Latin na colonia, at nakikita ng ilan dito ang Emaus ni Lucas."
  da:
    - "Mosa var en by i Benjamin i bjergene lige vest for Jerusalem, opregnet sammen med sine naboer: »Og Mizpe og Kefira og Moza«. Navnet lever i Motza ved den gamle vej fra Jerusalem til kysten, hvor den arabiske landsby Qalunya lå indtil 1948; Tel Motza identificeres med den bibelske by. I dag ligger Motza i Jerusalems vestlige udkant."
    - "Redningsudgravninger foretaget af Israels Oldsagsmyndighed før udvidelsen af Rute 1 afdækkede ved Tel Motza en by fra Judas kongetid med en offentlig bygning, forrådshuse og siloer, og i 2012, under Anna Eirikh, Hamoudi Khalaily og Shua Kisilevitz, et tempel fra 900- og 800-tallet f.Kr. (jernalder IIA) med kultkar og små lerfigurer af mænd og dyr i forgården; Kisilevitz har kaldt det det første jernalderstempel, der er udgravet i hjertet af Juda."
    - "Mishnaen siger, at man på løvhyttefesten indsamlede pilegrene på »et sted under Jerusalem, og det blev kaldt Motza« og stillede dem op omkring alteret; Talmud forklarer, at det var en colonia, fritaget for kongens skat. Josefus beretter, at Vespasian efter krigen gav jord til 800 afskedigede soldater på et sted kaldet Ammaus nær Jerusalem; mange identificerer det med Motza, hvis senere navn Qalunya menes at minde om latinsk colonia, og nogle ser i det Lukas' Emmaus."
  sr:
    - "Моса је био град Венијаминов у брдима одмах западно од Јерусалима, наведен са суседима: „И Миспа и Хефира и Моса“. Име се сачувало у Моци, поред старог пута од Јерусалима ка обали, где је до 1948. стајало арапско село Калуња; Тел Моца поистовећује се са библијским градом. Данас Моца лежи на западном ободу Јерусалима."
    - "Спасилачка ископавања Управе за старине Израела пред проширење пута 1 открила су на Тел Моци град из доба јудејске монархије са јавном зградом, складиштима и силосима, а 2012, под вођством Ане Ејрих, Хамудија Халаилија и Шуе Кисилевиц, храм из 10–9. века п. н. е. (гвоздено доба IIA) са култним посудама и малим глиненим фигурицама људи и животиња у дворишту; Кисилевиц га је назвала првим храмом из гвозденог доба откопаним у срцу Јуде."
    - "Мишна каже да су о празнику сеница врбове гране скупљане на „месту испод Јерусалима, које се звало Моца“ и постављане око жртвеника; Талмуд објашњава да је то била колонија, ослобођена краљевског пореза. Јосиф Флавије бележи да је после рата Веспазијан дао земљу осам стотина отпуштених војника на месту званом Амаус код Јерусалима; многи га поистовећују с Моцом, чије се доцније име Калуња сматра подсетником на латинску реч колонија, а неки у њему виде Лукин Емаус."
