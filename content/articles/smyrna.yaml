# Overview article (ADR 0007). Mainstream facts only; disputed datings are named as such. The place is the Hellenistic and Roman city on Mount Pagus (New Smyrna).
id: smyrna
place: a2e65fb
title:
  en: "Smyrna"
  ru: "Смирна"
  uk: "Смирна"
  es: "Esmirna"
  pt: "Esmirna"
  de: "Smyrna"
  fr: "Smyrne"
body:
  en:
    - "Smyrna, today's İzmir, lies at the head of a long gulf on the Aegean coast of Asia Minor. The older city stood across the bay at Bayraklı, a mound settled since the third millennium BC and excavated by J. M. Cook after 1948. Herodotus says that Smyrna was first Aeolian until exiles from Colophon seized it, making it Ionian, and that the Lydian king Alyattes took it, about 600 BC. For some four hundred years afterwards, Strabo says, its people lived in villages."
    - "The new city rose about 300 BC on the slopes of Mount Pagus: Strabo credits Antigonus and Lysimachus, while Pausanias tells that Alexander was bidden in a dream to found it. Strabo praises its straight paved streets, its porticoes, its library and its shrine of Homer, whom the Smyrnaeans claimed as their own. A loyal ally of Rome, Smyrna built a temple to the City of Rome in 195 BC, the first, as its envoys later told the Senate; in AD 26 the Senate chose it over ten rivals as the site of a temple of Tiberius."
    - 'Revelation names Smyrna second among the seven churches of Asia. Its letter speaks of tribulation and poverty, of slander from those who say they are Jews and are not, "but are the synagogue of Satan", and of prison to come, and it promises: "be thou faithful unto death, and I will give thee a crown of life." Early in the second century, by the usual dating, Ignatius of Antioch, taken under guard to Rome, stopped at Smyrna and later wrote to its church and to its bishop Polycarp, who, Irenaeus says, had been appointed by apostles.'
    - "Polycarp was burned in the stadium of Smyrna; asked to revile Christ, he answered that he had served him eighty-six years. The letter of the church of Smyrna telling of his death is generally held to be the oldest Christian account of a martyrdom after the New Testament; his death is dated by some to about 155–156 and by others to later years. About 178 an earthquake destroyed much of the city, and Marcus Aurelius gave money and appointed a senator to rebuild it."
  ru:
    - "Смирна, нынешний Измир, лежит в глубине длинного залива на эгейском побережье Малой Азии. Прежний город стоял на другой стороне залива, у Байраклы, на холме, заселённом с III тысячелетия до н. э.; его раскапывал Дж. М. Кук после 1948 г. Геродот сообщает, что Смирна сначала была эолийской, пока её не захватили изгнанники из Колофона и она не стала ионийской, и что её взял лидийский царь Алиатт — около 600 г. до н. э. После этого, по словам Страбона, около четырёхсот лет её жители жили в деревнях."
    - "Новый город вырос около 300 г. до н. э. на склонах горы Пагос: Страбон приписывает его основание Антигону и Лисимаху, а Павсаний рассказывает, что Александру во сне было велено основать его. Страбон хвалит его прямые мощёные улицы, портики, библиотеку и святилище Гомера, которого смирнцы считали своим земляком. Верная союзница Рима, Смирна в 195 г. до н. э. построила храм городу Риму — первой, как позже напомнили сенату её послы; в 26 г. н. э. сенат предпочёл её десяти соперницам как место для храма Тиберия."
    - "Откровение называет Смирну второй из семи церквей Асии. Послание к ней говорит о скорби и нищете, о злословии от тех, кто говорит о себе, что они Иудеи, а они не таковы, «но сборище сатанинское», и о грядущей темнице, и обещает: «Будь верен до смерти, и дам тебе венец жизни». В начале II века, по обычной датировке, Игнатий Антиохийский, которого под стражей везли в Рим, остановился в Смирне, а позже писал её церкви и её епископу Поликарпу, который, по словам Иринея, был поставлен апостолами."
    - "Поликарпа сожгли на стадионе Смирны; когда от него потребовали хулить Христа, он ответил, что служит Ему восемьдесят шесть лет. Послание смирнской церкви о его кончине обычно считают древнейшим христианским рассказом о мученичестве после Нового Завета; одни датируют его смерть около 155–156 гг., другие — более поздними годами. Около 178 г. землетрясение разрушило большую часть города, и Марк Аврелий дал денег и поручил одному из сенаторов отстроить его."
  uk:
    - "Смирна, нинішній Ізмір, лежить у верхів’ї довгої затоки на егейському узбережжі Малої Азії. Старіше місто стояло навпроти, через затоку, у Байраклі — на пагорбі, заселеному ще з III тис. до н. е. і розкопаному Дж. М. Куком після 1948 року. Геродот каже, що Смирна спершу була еолійською, доки вигнанці з Колофона не захопили її й не зробили іонійською, і що лідійський цар Аліатт узяв її близько 600 р. до н. е. Приблизно чотириста років по тому, за Страбоном, її мешканці жили по селах."
    - "Нове місто постало близько 300 р. до н. е. на схилах гори Паг: Страбон приписує це Антигону й Лісімаху, а Павсаній розповідає, що Александрові уві сні було веліно його заснувати. Страбон хвалить його прямі вимощені вулиці, портики, бібліотеку та святилище Гомера, якого смирнянці вважали своїм. Вірний союзник Риму, Смирна збудувала храм Місту Рим у 195 р. до н. е. — перший, як її посли потім казали Сенатові; у 26 р. н. е. Сенат віддав їй перевагу перед десятьма суперниками як місцю храму Тиверія."
    - "Одкровення називає Смирну другою з семи церков Азії. Її лист говорить про скорботу й убозтво, про наклеп тих, хто називає себе юдеями, а не є ними, «та ними не є, а зборище сатани», і про в’язницю, що чекає, і обіцяє: «Будь вірний аж до смерти, і дам тобі вінець життя». На початку II століття за звичайним датуванням Ігнатій Антіохійський, якого під вартою везли до Риму, зупинився в Смирні й потім написав її церкві та її єпископові Полікарпові, якого, за словами Іренея, призначили апостоли."
    - "Полікарпа спалили на стадіоні Смирни; коли від нього вимагали зненавидіти Христа, він відповів, що служить Йому вісімдесят шість років. Лист церкви Смирни про його смерть загальновизнано найдавнішим християнським описом мучеництва після Нового Заповіту; його смерть одні датують приблизно 155–156 роками, а інші — пізнішими роками. Близько 178 року землетрус зруйнував значну частину міста, і Марк Аврелій дав гроші та призначив сенатора для його відбудови."
  es:
    - "Esmirna, la actual İzmir, se encuentra en el fondo de un largo golfo de la costa egea de Asia Menor. La ciudad más antigua se alzaba al otro lado de la bahía, en Bayraklı, un montículo habitado desde el tercer milenio a. C. y excavado por J. M. Cook a partir de 1948. Heródoto dice que Esmirna fue primero eolia hasta que unos desterrados de Colofón se apoderaron de ella y la hicieron jonia, y que el rey lidio Aliates la tomó hacia 600 a. C. Durante unos cuatrocientos años después, dice Estrabón, sus habitantes vivieron en aldeas."
    - "La nueva ciudad se levantó hacia 300 a. C. en las laderas del monte Pagos: Estrabón se la atribuye a Antígono y Lisímaco, mientras que Pausanias cuenta que a Alejandro se le ordenó en un sueño fundarla. Estrabón elogia sus calles rectas y pavimentadas, sus pórticos, su biblioteca y su santuario de Homero, a quien los esmirniotas reclamaban como suyo. Aliada leal de Roma, Esmirna erigió en 195 a. C. un templo a la Ciudad de Roma, el primero, como dijeron más tarde sus enviados al Senado; en el año 26 d. C. el Senado la eligió, frente a otras diez rivales, como sede de un templo de Tiberio."
    - "El Apocalipsis nombra a Esmirna en segundo lugar entre las siete iglesias de Asia. Su carta habla de tribulación y pobreza, de la blasfemia de los que se dicen judíos y no lo son, «mas son sinagoga de Satanás», y de la cárcel que ha de venir, y promete: «Sé fiel hasta la muerte, y yo te daré la corona de la vida». A comienzos del siglo II, según la datación habitual, Ignacio de Antioquía, llevado bajo custodia a Roma, se detuvo en Esmirna y más tarde escribió a su iglesia y a su obispo Policarpo, quien, según dice Ireneo, había sido designado por apóstoles."
    - "Policarpo fue quemado en el estadio de Esmirna; cuando se le pidió que injuriase a Cristo, respondió que le había servido ochenta y seis años. La carta de la iglesia de Esmirna que relata su muerte se considera generalmente el relato cristiano más antiguo de un martirio después del Nuevo Testamento; unos fechan su muerte hacia 155–156 y otros en años posteriores. Hacia 178 un terremoto destruyó gran parte de la ciudad, y Marco Aurelio dio dinero y nombró a un senador para reconstruirla."
  pt:
    - "Esmirna, a atual İzmir, fica na cabeceira de um longo golfo da costa do Egeu, na Ásia Menor. A cidade mais antiga erguia-se do outro lado da baía, em Bayraklı, um monte habitado desde o terceiro milênio a.C. e escavado por J. M. Cook depois de 1948. Heródoto diz que Esmirna foi primeiro eólia, até que exilados de Colofão a tomaram, tornando-a jônica, e que o rei lídio Aliates a conquistou por volta de 600 a.C. Por cerca de quatrocentos anos depois, diz Estrabão, seu povo viveu em aldeias."
    - "A nova cidade surgiu por volta de 300 a.C. nas encostas do monte Pagos: Estrabão a atribui a Antígono e Lisímaco, enquanto Pausânias conta que Alexandre foi instado em sonho a fundá-la. Estrabão elogia suas ruas retas e pavimentadas, seus pórticos, sua biblioteca e seu santuário de Homero, a quem os esmirniotas reivindicavam como seu. Aliada fiel de Roma, Esmirna construiu em 195 a.C. um templo à Cidade de Roma, o primeiro, como seus enviados disseram depois ao Senado; em 26 d.C. o Senado a escolheu, entre dez rivais, como sede de um templo a Tibério."
    - "O Apocalipse nomeia Esmirna em segundo lugar entre as sete igrejas da Ásia. Sua carta fala de tribulação e pobreza, da blasfêmia daqueles que dizem ser judeus e não são, “mas são sinagoga de Satanás”, e de prisão por vir, e promete: “Seja fiel até a morte, e eu lhe darei a coroa da vida.” No início do século II, pela datação usual, Inácio de Antioquia, levado sob escolta a Roma, parou em Esmirna e depois escreveu à sua igreja e a seu bispo Policarpo, que, segundo Ireneu, havia sido nomeado por apóstolos."
    - "Policarpo foi queimado no estádio de Esmirna; instado a blasfemar contra Cristo, respondeu que o servia havia oitenta e seis anos. A carta da igreja de Esmirna que narra sua morte é geralmente considerada o mais antigo relato cristão de um martírio depois do Novo Testamento; alguns datam sua morte por volta de 155–156, outros em anos posteriores. Por volta de 178, um terremoto destruiu grande parte da cidade, e Marco Aurélio deu dinheiro e designou um senador para reconstruí-la."
  de:
    - "Smyrna, das heutige İzmir, liegt am Kopf eines langen Golfs an der ägäischen Küste Kleinasiens. Die ältere Stadt stand auf der anderen Seite der Bucht bei Bayraklı, einem seit dem dritten Jahrtausend v. Chr. besiedelten Hügel, den J. M. Cook nach 1948 ausgrub. Nach Herodot war Smyrna zuerst äolisch, bis Flüchtlinge aus Kolophon es einnahmen und ionisch machten, und der lydische König Alyattes eroberte es um 600 v. Chr. Rund vierhundert Jahre lang lebten seine Einwohner danach, sagt Strabon, in Dörfern."
    - "Die neue Stadt entstand um 300 v. Chr. an den Hängen des Berges Pagos: Strabon schreibt es Antigonos und Lysimachos zu, während Pausanias erzählt, Alexander sei im Traum zur Gründung aufgefordert worden. Strabon lobt die geraden gepflasterten Straßen, die Säulenhallen, die Bibliothek und das Heiligtum Homers, den die Smyrnäer für sich beanspruchten. Als treue Verbündete Roms errichtete Smyrna 195 v. Chr. der Stadt Rom einen Tempel, den ersten, wie seine Gesandten später dem Senat sagten; im Jahr 26 n. Chr. wählte der Senat es unter zehn Mitbewerbern als Ort eines Tiberius-Tempels."
    - "Die Offenbarung nennt Smyrna an zweiter Stelle unter den sieben Gemeinden Asiens. Ihr Brief spricht von Trübsal und Armut, von der Lästerung derer, die sagen, sie seien Juden, und sind's nicht, „sondern sind des Satans Schule“, und von kommendem Gefängnis, und er verheißt: „Sei getreu bis an den Tod, so will ich dir die Krone des Lebens geben.“ Anfang des zweiten Jahrhunderts, nach der üblichen Datierung, hielt Ignatius von Antiochia, unter Bewachung nach Rom gebracht, in Smyrna an und schrieb später an dessen Gemeinde und an ihren Bischof Polykarp, der, wie Irenäus sagt, von Aposteln eingesetzt worden war."
    - "Polykarp wurde im Stadion von Smyrna verbrannt; aufgefordert, Christus zu schmähen, antwortete er, er diene ihm seit sechsundachtzig Jahren. Der Brief der Gemeinde von Smyrna über seinen Tod gilt allgemein als der älteste christliche Bericht über ein Martyrium nach dem Neuen Testament; sein Tod wird von manchen auf etwa 155–156, von anderen auf spätere Jahre datiert. Um 178 zerstörte ein Erdbeben große Teile der Stadt, und Mark Aurel gab Geld und ernannte einen Senator für den Wiederaufbau."
  fr:
    - "Smyrne, l’actuelle İzmir, se trouve au fond d’un long golfe de la côte égéenne de l’Asie Mineure. La ville ancienne s’élevait de l’autre côté de la baie, à Bayraklı, un tertre habité depuis le IIIe millénaire av. J.-C. et fouillé par J. M. Cook après 1948. Hérodote dit que Smyrne fut d’abord éolienne, jusqu’à ce que des exilés de Colophon s’en emparent et la rendent ionienne, puis que le roi lydien Alyatte la prit, vers 600 av. J.-C. Pendant environ quatre cents ans ensuite, dit Strabon, ses habitants vécurent dans des villages."
    - "La ville nouvelle s’éleva vers 300 av. J.-C. sur les pentes du mont Pagos : Strabon l’attribue à Antigone et à Lysimaque, tandis que Pausanias raconte qu’Alexandre reçut en songe l’ordre de la fonder. Strabon loue ses rues droites et pavées, ses portiques, sa bibliothèque et son sanctuaire d’Homère, que les Smyrniotes revendiquaient. Alliée fidèle de Rome, Smyrne bâtit en 195 av. J.-C. un temple à la Ville de Rome, le premier, dirent plus tard ses envoyés au Sénat ; en 26 apr. J.-C., le Sénat la préféra à dix rivales pour un temple de Tibère."
    - "L’Apocalypse nomme Smyrne en deuxième parmi les sept Églises d’Asie. Sa lettre parle de tribulation et de pauvreté, de calomnies de ceux qui se disent Juifs et ne le sont pas, « mais qui sont une synagogue de Satan », et d’une prison à venir, et promet : « Sois fidèle jusqu’à la mort, et je te donnerai la couronne de vie. » Au début du IIe siècle, selon la datation usuelle, Ignace d’Antioche, conduit sous escorte à Rome, fit étape à Smyrne et écrivit ensuite à son Église et à son évêque Polycarpe, que, selon Irénée, des apôtres avaient établi."
    - "Polycarpe fut brûlé dans le stade de Smyrne ; invité à injurier le Christ, il répondit qu’il le servait depuis quatre-vingt-six ans. La lettre de l’Église de Smyrne racontant sa mort passe généralement pour le plus ancien récit chrétien de martyre après le Nouveau Testament ; sa mort est datée par certains d’environ 155-156, par d’autres d’années plus tardives. Vers 178, un tremblement de terre détruisit une grande partie de la ville, et Marc Aurèle donna de l’argent et nomma un sénateur pour la reconstruire."
