body:
  en:
    - "Smyrna, today's İzmir, lies at the head of a long gulf on the Aegean coast of Asia Minor. The older city stood across the bay at Bayraklı, a mound settled since the third millennium BC and excavated by J. M. Cook after 1948. Herodotus says that Smyrna was first Aeolian until exiles from Colophon seized it, making it Ionian, and that the Lydian king Alyattes took it, about 600 BC. For some four hundred years afterwards, Strabo says, its people lived in villages."
    - "The new city rose about 300 BC on the slopes of Mount Pagus: Strabo credits Antigonus and Lysimachus, while Pausanias tells that Alexander was bidden in a dream to found it. Strabo praises its straight paved streets, its porticoes, its library and its shrine of Homer, whom the Smyrnaeans claimed as their own. A loyal ally of Rome, Smyrna built a temple to the City of Rome in 195 BC, the first, as its envoys later told the Senate; in AD 26 the Senate chose it over ten rivals as the site of a temple of Tiberius."
    - 'Revelation names Smyrna second among the seven churches of Asia. Its letter speaks of tribulation and poverty, of slander from those who say they are Jews and are not, "but are the synagogue of Satan", and of prison to come, and it promises: "be thou faithful unto death, and I will give thee a crown of life." Early in the second century, by the usual dating, Ignatius of Antioch, taken under guard to Rome, stopped at Smyrna and later wrote to its church and to its bishop Polycarp, who, Irenaeus says, had been appointed by apostles.'
    - "Polycarp was put to death in the stadium of Smyrna; asked to revile Christ, he answered that he had served him eighty-six years. The letter of the church of Smyrna telling of his death is generally held to be the oldest Christian account of a martyrdom after the New Testament; his death is dated by some to about 155–156 and by others to later years. About 178 an earthquake destroyed much of the city, and Marcus Aurelius gave money and appointed a senator to rebuild it."
  ru:
    - "Смирна, нынешний Измир, лежит в глубине длинного залива на эгейском побережье Малой Азии. Прежний город стоял на другой стороне залива, у Байраклы, на холме, заселённом с III тысячелетия до н. э.; его раскапывал Дж. М. Кук после 1948 г. Геродот сообщает, что Смирна сначала была эолийской, пока её не захватили изгнанники из Колофона и она не стала ионийской, и что её взял лидийский царь Алиатт — около 600 г. до н. э. После этого, по словам Страбона, около четырёхсот лет её жители жили в деревнях."
    - "Новый город вырос около 300 г. до н. э. на склонах горы Пагос: Страбон приписывает его основание Антигону и Лисимаху, а Павсаний рассказывает, что Александру во сне было велено основать его. Страбон хвалит его прямые мощёные улицы, портики, библиотеку и святилище Гомера, которого смирнцы считали своим земляком. Верная союзница Рима, Смирна в 195 г. до н. э. построила храм городу Риму — первой, как позже напомнили сенату её послы; в 26 г. н. э. сенат предпочёл её десяти соперницам как место для храма Тиберия."
    - "Откровение называет Смирну второй из семи церквей Асии. Послание к ней говорит о скорби и нищете, о злословии от тех, кто говорит о себе, что они Иудеи, а они не таковы, «но сборище сатанинское», и о грядущей темнице, и обещает: «Будь верен до смерти, и дам тебе венец жизни». В начале II века, по обычной датировке, Игнатий Антиохийский, которого под стражей везли в Рим, остановился в Смирне, а позже писал её церкви и её епископу Поликарпу, который, по словам Иринея, был поставлен апостолами."
    - "Поликарпа казнили на стадионе Смирны; когда от него потребовали хулить Христа, он ответил, что служит Ему восемьдесят шесть лет. Послание смирнской церкви о его кончине обычно считают древнейшим христианским рассказом о мученичестве после Нового Завета; одни датируют его смерть около 155–156 гг., другие — более поздними годами. Около 178 г. землетрясение разрушило большую часть города, и Марк Аврелий дал денег и поручил одному из сенаторов отстроить его."
  uk:
    - "Смирна, нинішній Ізмір, лежить у верхів’ї довгої затоки на егейському узбережжі Малої Азії. Старіше місто стояло навпроти, через затоку, у Байраклі — на пагорбі, заселеному ще з III тис. до н. е. і розкопаному Дж. М. Куком після 1948 року. Геродот каже, що Смирна спершу була еолійською, доки вигнанці з Колофона не захопили її й не зробили іонійською, і що лідійський цар Аліатт узяв її близько 600 р. до н. е. Приблизно чотириста років по тому, за Страбоном, її мешканці жили по селах."
    - "Нове місто постало близько 300 р. до н. е. на схилах гори Паг: Страбон приписує це Антигону й Лісімаху, а Павсаній розповідає, що Александрові уві сні було веліно його заснувати. Страбон хвалить його прямі вимощені вулиці, портики, бібліотеку та святилище Гомера, якого смирнянці вважали своїм. Вірний союзник Риму, Смирна збудувала храм Місту Рим у 195 р. до н. е. — перший, як її посли потім казали Сенатові; у 26 р. н. е. Сенат віддав їй перевагу перед десятьма суперниками як місцю храму Тиверія."
    - "Одкровення називає Смирну другою з семи церков Азії. Її лист говорить про скорботу й убозтво, про наклеп тих, хто називає себе юдеями, а не є ними, «та ними не є, а зборище сатани», і про в’язницю, що чекає, і обіцяє: «Будь вірний аж до смерти, і дам тобі вінець життя». На початку II століття за звичайним датуванням Ігнатій Антіохійський, якого під вартою везли до Риму, зупинився в Смирні й потім написав її церкві та її єпископові Полікарпові, якого, за словами Іренея, призначили апостоли."
    - "Полікарпа стратили на стадіоні Смирни; коли від нього вимагали зненавидіти Христа, він відповів, що служить Йому вісімдесят шість років. Лист церкви Смирни про його смерть загальновизнано найдавнішим християнським описом мучеництва після Нового Заповіту; його смерть одні датують приблизно 155–156 роками, а інші — пізнішими роками. Близько 178 року землетрус зруйнував значну частину міста, і Марк Аврелій дав гроші та призначив сенатора для його відбудови."
  es:
    - "Esmirna, la actual İzmir, se encuentra en el fondo de un largo golfo de la costa egea de Asia Menor. La ciudad más antigua se alzaba al otro lado de la bahía, en Bayraklı, un montículo habitado desde el tercer milenio a. C. y excavado por J. M. Cook a partir de 1948. Heródoto dice que Esmirna fue primero eolia hasta que unos desterrados de Colofón se apoderaron de ella y la hicieron jonia, y que el rey lidio Aliates la tomó hacia 600 a. C. Durante unos cuatrocientos años después, dice Estrabón, sus habitantes vivieron en aldeas."
    - "La nueva ciudad se levantó hacia 300 a. C. en las laderas del monte Pagos: Estrabón se la atribuye a Antígono y Lisímaco, mientras que Pausanias cuenta que a Alejandro se le ordenó en un sueño fundarla. Estrabón elogia sus calles rectas y pavimentadas, sus pórticos, su biblioteca y su santuario de Homero, a quien los esmirniotas reclamaban como suyo. Aliada leal de Roma, Esmirna erigió en 195 a. C. un templo a la Ciudad de Roma, el primero, como dijeron más tarde sus enviados al Senado; en el año 26 d. C. el Senado la eligió, frente a otras diez rivales, como sede de un templo de Tiberio."
    - "El Apocalipsis nombra a Esmirna en segundo lugar entre las siete iglesias de Asia. Su carta habla de tribulación y pobreza, de la blasfemia de los que se dicen judíos y no lo son, «mas son sinagoga de Satanás», y de la cárcel que ha de venir, y promete: «Sé fiel hasta la muerte, y yo te daré la corona de la vida». A comienzos del siglo II, según la datación habitual, Ignacio de Antioquía, llevado bajo custodia a Roma, se detuvo en Esmirna y más tarde escribió a su iglesia y a su obispo Policarpo, quien, según dice Ireneo, había sido designado por apóstoles."
    - "Policarpo fue ejecutado en el estadio de Esmirna; cuando se le pidió que injuriase a Cristo, respondió que le había servido ochenta y seis años. La carta de la iglesia de Esmirna que relata su muerte se considera generalmente el relato cristiano más antiguo de un martirio después del Nuevo Testamento; unos fechan su muerte hacia 155–156 y otros en años posteriores. Hacia 178 un terremoto destruyó gran parte de la ciudad, y Marco Aurelio dio dinero y nombró a un senador para reconstruirla."
  pt:
    - "Esmirna, a atual İzmir, fica na cabeceira de um longo golfo da costa do Egeu, na Ásia Menor. A cidade mais antiga erguia-se do outro lado da baía, em Bayraklı, um monte habitado desde o terceiro milênio a.C. e escavado por J. M. Cook depois de 1948. Heródoto diz que Esmirna foi primeiro eólia, até que exilados de Colofão a tomaram, tornando-a jônica, e que o rei lídio Aliates a conquistou por volta de 600 a.C. Por cerca de quatrocentos anos depois, diz Estrabão, seu povo viveu em aldeias."
    - "A nova cidade surgiu por volta de 300 a.C. nas encostas do monte Pagos: Estrabão a atribui a Antígono e Lisímaco, enquanto Pausânias conta que Alexandre foi instado em sonho a fundá-la. Estrabão elogia suas ruas retas e pavimentadas, seus pórticos, sua biblioteca e seu santuário de Homero, a quem os esmirniotas reivindicavam como seu. Aliada fiel de Roma, Esmirna construiu em 195 a.C. um templo à Cidade de Roma, o primeiro, como seus enviados disseram depois ao Senado; em 26 d.C. o Senado a escolheu, entre dez rivais, como sede de um templo a Tibério."
    - "O Apocalipse nomeia Esmirna em segundo lugar entre as sete igrejas da Ásia. Sua carta fala de tribulação e pobreza, da blasfêmia daqueles que dizem ser judeus e não são, “mas são sinagoga de Satanás”, e de prisão por vir, e promete: “Seja fiel até a morte, e eu lhe darei a coroa da vida.” No início do século II, pela datação usual, Inácio de Antioquia, levado sob escolta a Roma, parou em Esmirna e depois escreveu à sua igreja e a seu bispo Policarpo, que, segundo Ireneu, havia sido nomeado por apóstolos."
    - "Policarpo foi executado no estádio de Esmirna; instado a blasfemar contra Cristo, respondeu que o servia havia oitenta e seis anos. A carta da igreja de Esmirna que narra sua morte é geralmente considerada o mais antigo relato cristão de um martírio depois do Novo Testamento; alguns datam sua morte por volta de 155–156, outros em anos posteriores. Por volta de 178, um terremoto destruiu grande parte da cidade, e Marco Aurélio deu dinheiro e designou um senador para reconstruí-la."
  de:
    - "Smyrna, das heutige İzmir, liegt am Kopf eines langen Golfs an der ägäischen Küste Kleinasiens. Die ältere Stadt stand auf der anderen Seite der Bucht bei Bayraklı, einem seit dem dritten Jahrtausend v. Chr. besiedelten Hügel, den J. M. Cook nach 1948 ausgrub. Nach Herodot war Smyrna zuerst äolisch, bis Flüchtlinge aus Kolophon es einnahmen und ionisch machten, und der lydische König Alyattes eroberte es um 600 v. Chr. Rund vierhundert Jahre lang lebten seine Einwohner danach, sagt Strabon, in Dörfern."
    - "Die neue Stadt entstand um 300 v. Chr. an den Hängen des Berges Pagos: Strabon schreibt es Antigonos und Lysimachos zu, während Pausanias erzählt, Alexander sei im Traum zur Gründung aufgefordert worden. Strabon lobt die geraden gepflasterten Straßen, die Säulenhallen, die Bibliothek und das Heiligtum Homers, den die Smyrnäer für sich beanspruchten. Als treue Verbündete Roms errichtete Smyrna 195 v. Chr. der Stadt Rom einen Tempel, den ersten, wie seine Gesandten später dem Senat sagten; im Jahr 26 n. Chr. wählte der Senat es unter zehn Mitbewerbern als Ort eines Tiberius-Tempels."
    - "Die Offenbarung nennt Smyrna an zweiter Stelle unter den sieben Gemeinden Asiens. Ihr Brief spricht von Trübsal und Armut, von der Lästerung derer, die sagen, sie seien Juden, und sind's nicht, „sondern sind des Satans Schule“, und von kommendem Gefängnis, und er verheißt: „Sei getreu bis an den Tod, so will ich dir die Krone des Lebens geben.“ Anfang des zweiten Jahrhunderts, nach der üblichen Datierung, hielt Ignatius von Antiochia, unter Bewachung nach Rom gebracht, in Smyrna an und schrieb später an dessen Gemeinde und an ihren Bischof Polykarp, der, wie Irenäus sagt, von Aposteln eingesetzt worden war."
    - "Polykarp wurde im Stadion von Smyrna hingerichtet; aufgefordert, Christus zu schmähen, antwortete er, er diene ihm seit sechsundachtzig Jahren. Der Brief der Gemeinde von Smyrna über seinen Tod gilt allgemein als der älteste christliche Bericht über ein Martyrium nach dem Neuen Testament; sein Tod wird von manchen auf etwa 155–156, von anderen auf spätere Jahre datiert. Um 178 zerstörte ein Erdbeben große Teile der Stadt, und Mark Aurel gab Geld und ernannte einen Senator für den Wiederaufbau."
  fr:
    - "Smyrne, l’actuelle İzmir, se trouve au fond d’un long golfe de la côte égéenne de l’Asie Mineure. La ville ancienne s’élevait de l’autre côté de la baie, à Bayraklı, un tertre habité depuis le IIIe millénaire av. J.-C. et fouillé par J. M. Cook après 1948. Hérodote dit que Smyrne fut d’abord éolienne, jusqu’à ce que des exilés de Colophon s’en emparent et la rendent ionienne, puis que le roi lydien Alyatte la prit, vers 600 av. J.-C. Pendant environ quatre cents ans ensuite, dit Strabon, ses habitants vécurent dans des villages."
    - "La ville nouvelle s’éleva vers 300 av. J.-C. sur les pentes du mont Pagos : Strabon l’attribue à Antigone et à Lysimaque, tandis que Pausanias raconte qu’Alexandre reçut en songe l’ordre de la fonder. Strabon loue ses rues droites et pavées, ses portiques, sa bibliothèque et son sanctuaire d’Homère, que les Smyrniotes revendiquaient. Alliée fidèle de Rome, Smyrne bâtit en 195 av. J.-C. un temple à la Ville de Rome, le premier, dirent plus tard ses envoyés au Sénat ; en 26 apr. J.-C., le Sénat la préféra à dix rivales pour un temple de Tibère."
    - "L’Apocalypse nomme Smyrne en deuxième parmi les sept Églises d’Asie. Sa lettre parle de tribulation et de pauvreté, de calomnies de ceux qui se disent Juifs et ne le sont pas, « mais qui sont une synagogue de Satan », et d’une prison à venir, et promet : « Sois fidèle jusqu’à la mort, et je te donnerai la couronne de vie. » Au début du IIe siècle, selon la datation usuelle, Ignace d’Antioche, conduit sous escorte à Rome, fit étape à Smyrne et écrivit ensuite à son Église et à son évêque Polycarpe, que, selon Irénée, des apôtres avaient établi."
    - "Polycarpe fut mis à mort dans le stade de Smyrne ; invité à injurier le Christ, il répondit qu’il le servait depuis quatre-vingt-six ans. La lettre de l’Église de Smyrne racontant sa mort passe généralement pour le plus ancien récit chrétien de martyre après le Nouveau Testament ; sa mort est datée par certains d’environ 155-156, par d’autres d’années plus tardives. Vers 178, un tremblement de terre détruisit une grande partie de la ville, et Marc Aurèle donna de l’argent et nomma un sénateur pour la reconstruire."
  pl:
    - "Smyrna, dzisiejszy Izmir, leży w głębi długiej zatoki na egejskim wybrzeżu Azji Mniejszej. Starsze miasto stało po drugiej stronie zatoki w Bayraklı, na kopcu zasiedlonym od III tysiąclecia p.n.e. i badanym przez J. M. Cooka po 1948 roku. Herodot pisze, że Smyrna była najpierw eolska, aż zajęli ją wygnańcy z Kolofonu, czyniąc ją jońską, i że lidyjski król Alyattes zdobył ją około 600 roku p.n.e. Przez następne mniej więcej czterysta lat, jak mówi Strabon, jej mieszkańcy żyli we wsiach."
    - "Nowe miasto powstało około 300 roku p.n.e. na stokach Góry Pagos: Strabon przypisuje to Antygonowi i Lizymachowi, a Pauzaniasz opowiada, że Aleksander został we śnie wezwany do jego założenia. Strabon chwali jego proste brukowane ulice, portyki, bibliotekę i świątynię Homera, którego Smyrnejczycy uważali za swego. Jako wierny sojusznik Rzymu Smyrna wzniosła w 195 roku p.n.e. świątynię Miasta Rzymu, pierwszą, jak jej posłowie mówili później Senatowi; w 26 roku n.e. Senat wybrał ją spośród dziesięciu rywali na miejsce świątyni Tyberiusza."
    - "Apokalipsa wymienia Smyrnę na drugim miejscu wśród siedmiu zborów Azji. Jej list mówi o ucisku i ubóstwie, o bluźnierstwie tych, którzy mówią, że są Żydami, a nie są, „ale są bóżnicą szatańską”, i o zbliżającym się więzieniu, a obiecuje: „Bądź wierny aż do śmierci, a dam ci koronę żywota.” Na początku II wieku, według zwykłego datowania, Ignacy z Antiochii, prowadzony pod strażą do Rzymu, zatrzymał się w Smyrnie, a później napisał do jej kościoła i do jej biskupa Polikarpa, który, jak mówi Ireneusz, został ustanowiony przez apostołów."
    - "Polikarp został stracony na stadionie w Smyrnie; poproszony o zhańbienie Chrystusa, odpowiedział, że służy mu od osiemdziesięciu sześciu lat. List kościoła smyrneńskiego opowiadający o jego śmierci uchodzi powszechnie za najstarszy chrześcijański opis męczeństwa po Nowym Testamencie; jego śmierć jedni datują na około 155–156 rok, inni na lata późniejsze. Około 178 roku trzęsienie ziemi zniszczyło znaczną część miasta, a Marek Aureliusz dał pieniądze i wyznaczył senatora do jego odbudowy."
  it:
    - "Smirne, l’odierna İzmir, sorge in fondo a un lungo golfo sulla costa egea dell’Asia Minore. La città più antica si trovava dall’altra parte della baia, a Bayraklı, un tell abitato dal III millennio a.C. e scavato da J. M. Cook dopo il 1948. Erodoto dice che Smirne fu dapprima eolica, finché gli esuli di Colofone se ne impadronirono rendendola ionica, e che il re lidio Aliatte la prese verso il 600 a.C. Per circa quattrocento anni dopo, dice Strabone, i suoi abitanti vissero in villaggi."
    - "La nuova città sorse verso il 300 a.C. sulle pendici del monte Pago: Strabone ne attribuisce il merito ad Antigono e Lisimaco, mentre Pausania racconta che Alessandro fu esortato in sogno a fondarla. Strabone ne loda le vie dritte e lastricate, i portici, la biblioteca e il santuario di Omero, che gli Smirnei rivendicavano come proprio. Fedele alleata di Roma, Smirne costruì un tempio alla Città di Roma nel 195 a.C., il primo, come i suoi ambasciatori dissero poi al Senato; nel 26 d.C. il Senato la scelse, fra dieci rivali, come sede di un tempio di Tiberio."
    - "L’Apocalisse nomina Smirne al secondo posto fra le sette chiese d’Asia. La sua lettera parla di tribolazione e povertà, di calunnie da parte di quelli che dicono d’esser Giudei e non lo sono, «ma sono una sinagoga di Satana», e di prigione imminente, e promette: «Sii fedele fino alla morte, e io ti darò la corona della vita». All’inizio del II secolo, secondo la datazione abituale, Ignazio di Antiochia, condotto sotto scorta a Roma, si fermò a Smirne e scrisse poi alla sua chiesa e al suo vescovo Policarpo, che, dice Ireneo, era stato posto dagli apostoli."
    - "Policarpo fu messo a morte nello stadio di Smirne; invitato a insultare Cristo, rispose di averlo servito per ottantasei anni. La lettera della chiesa di Smirne che racconta la sua morte è ritenuta in genere il più antico resoconto cristiano di un martirio dopo il Nuovo Testamento; la sua morte è datata da alcuni al 155–156 circa e da altri agli anni successivi. Verso il 178 un terremoto distrusse gran parte della città, e Marco Aurelio diede denaro e nominò un senatore per ricostruirla."
  nl:
    - "Smyrna, het huidige İzmir, ligt aan het binnenste uiteinde van een lange golf aan de Egeïsche kust van Klein-Azië. De oudere stad lag aan de overkant van de baai bij Bayraklı, een heuvel die sinds het derde millennium v.Chr. bewoond was en na 1948 door J.M. Cook werd opgegraven. Herodotus zegt dat Smyrna eerst Aeolisch was totdat ballingen uit Colophon het innamen en het Ionisch maakten, en dat de Lydische koning Alyattes het omstreeks 600 v.Chr. veroverde. Daarna woonden de bewoners, zegt Strabo, ongeveer vierhonderd jaar in dorpen."
    - "De nieuwe stad verrees omstreeks 300 v.Chr. op de hellingen van de berg Pagus: Strabo schrijft dit toe aan Antigonus en Lysimachus, terwijl Pausanias vertelt dat Alexander in een droom werd opgedragen haar te stichten. Strabo prijst haar rechte bestrate straten, haar zuilengangen, haar bibliotheek en haar heiligdom van Homerus, die de Smyrnanen als de hunne opeisten. Als trouwe bondgenoot van Rome bouwde Smyrna in 195 v.Chr. een tempel voor de Stad Rome, de eerste, zoals zijn gezanten later de Senaat vertelden; in 26 n.Chr. koos de Senaat het boven tien rivalen als plaats voor een tempel van Tiberius."
    - "De Openbaring noemt Smyrna als tweede van de zeven gemeenten van Asia. De brief spreekt van verdrukking en armoede, van de lastering door hen die zeggen dat zij Joden zijn en het niet zijn, “maar zijn een synagoge des satans”, en van de gevangenis die komen zal, en belooft: “Zijt getrouw tot den dood, en Ik zal u geven de kroon des levens.” Vroeg in de tweede eeuw, volgens de gebruikelijke datering, bleef Ignatius van Antiochië, onder bewaking naar Rome gebracht, in Smyrna, en schreef later aan haar gemeente en aan haar bisschop Polycarpus, die volgens Irenaeus door apostelen was aangesteld."
    - "Polycarpus werd in het stadion van Smyrna ter dood gebracht; toen hem werd gevraagd Christus te lasteren, antwoordde hij dat hij Hem zesentachtig jaar had gediend. De brief van de gemeente van Smyrna over zijn dood geldt algemeen als het oudste christelijke verslag van een martelaarschap na het Nieuwe Testament; zijn dood wordt door sommigen omstreeks 155–156 gedateerd en door anderen in latere jaren. Omstreeks 178 verwoestte een aardbeving een groot deel van de stad, en Marcus Aurelius gaf geld en stelde een senator aan om haar te herbouwen."
  cs:
    - "Smyrna, dnešní Izmir, leží na konci dlouhého zálivu na egejském pobřeží Malé Asie. Starší město stálo přes záliv v Bayraklı, na pahorku osídleném od 3. tisíciletí př. n. l. a zkoumaném J. M. Cookem po roce 1948. Hérodotos říká, že Smyrna byla nejprve aiolská, dokud ji nezabrali vyhnanci z Kolofónu a neučinili ji iónskou, a že ji dobyl lýdský král Alyattés kolem roku 600 př. n. l. Po zhruba čtyři sta let poté, říká Strabón, žili její obyvatelé ve vesnicích."
    - "Nové město vzniklo kolem roku 300 př. n. l. na svazích hory Pagos: Strabón to připisuje Antigonovi a Lysimachovi, zatímco Pausaniás vypráví, že Alexandrovi bylo ve snu přikázáno je založit. Strabón chválí jeho rovné dlážděné ulice, sloupořadí, knihovnu a svatyni Homéra, kterého Smyrňané pokládali za svého. Věrná spojenkyně Říma, Smyrna, vystavěla roku 195 př. n. l. chrám Městu Řím, první, jak její vyslanci později řekli senátu; v roce 26 n. l. ji senát vybral před deseti soupeřkami jako místo chrámu Tiberiova."
    - "Zjevení jmenuje Smyrnu na druhém místě mezi sedmi církvemi v Asii. Její list mluví o soužení a chudobě, o pomluvě těch, kdo se prohlašují za Židy a nejsou, „ale jsou sběř satanova“, a o vězení, které přijde, a slibuje: „Budiž věrný až do smrti, a dámť korunu života.“ Na počátku 2. století podle obvyklého datování se ve Smyrně zastavil Ignatius Antiochijský, vezený pod stráží do Říma, a později napsal její církvi i jejímu biskupovi Polykarpovi, který byl podle Irenaia ustanoven apoštoly."
    - "Polykarp byl popraven na stadionu ve Smyrně; když byl vyzván, aby zlořečil Kristu, odpověděl, že mu slouží osmdesát šest let. List církve ve Smyrně o jeho smrti je všeobecně pokládán za nejstarší křesťanské vylíčení mučednictví po Novém zákoně; jeho smrt datují někteří zhruba do let 155–156 a jiní do pozdějších let. Kolem roku 178 zničilo zemětřesení velkou část města a Marcus Aurelius poskytl peníze a ustanovil senátora, aby je obnovil."
  sv:
    - "Smyrna, i dag İzmir, ligger vid inre änden av en lång vik på Mindre Asiens kust mot Egeiska havet. Den äldre staden låg på andra sidan viken vid Bayraklı, en kulle som varit bebodd sedan tredje årtusendet f.Kr. och som grävdes ut av J. M. Cook efter 1948. Herodotos säger att Smyrna först var aiolisk tills landsflyktiga från Kolofon intog den och gjorde den jonisk, och att den lydiske kungen Alyattes intog den omkring 600 f.Kr. Under de följande ungefär fyrahundra åren bodde dess folk, enligt Strabon, i byar."
    - "Den nya staden reste sig omkring 300 f.Kr. på Pagosberget: Strabon tillskriver detta Antigonos och Lysimachos, medan Pausanias berättar att Alexander i en dröm fick befallning att grunda den. Strabon prisar dess raka stenlagda gator, dess pelargångar, dess bibliotek och dess helgedom åt Homeros, som smyrnierna gjorde anspråk på som sin egen. Smyrna, en trogen bundsförvant till Rom, byggde 195 f.Kr. ett tempel åt staden Rom, det första, som dess sändebud senare sade till senaten; år 26 e.Kr. valde senaten den framför tio rivaler som plats för ett tempel åt Tiberius."
    - "Uppenbarelseboken nämner Smyrna som den andra av de sju församlingarna i Asien. Dess brev talar om bedrövelse och fattigdom, om förtal från dem som säger sig vara judar och inte är det, ”utan äro en Satans synagoga”, och om ett fängelse som ska komma, och det lovar: ”Var trogen intill döden, så skall jag giva dig livets krona”. Tidigt på 100-talet, enligt den vanliga dateringen, gjorde Ignatios av Antiochia, förd under bevakning till Rom, uppehåll i Smyrna och skrev senare till dess församling och till dess biskop Polykarpos, som enligt Irenaeus hade blivit insatt av apostlar."
    - "Polykarpos avrättades i Smyrnas stadion; ombedd att häda Kristus svarade han att han hade tjänat honom i åttiosex år. Brevet från församlingen i Smyrna som berättar om hans död anses allmänt vara den äldsta kristna skildringen av ett martyrium efter Nya testamentet; hans död dateras av några till omkring 155–156 och av andra till senare år. Omkring 178 förstörde en jordbävning stora delar av staden, och Marcus Aurelius gav pengar och utsåg en senator att bygga upp den."
  nb:
    - "Smyrna, dagens İzmir, ligger innerst i en lang bukt på Egeerhavskysten av Lilleasia. Den eldre byen sto på den andre siden av bukten ved Bayraklı, en haug bebodd siden 3. årtusen f.Kr. og utgravd av J. M. Cook etter 1948. Herodot sier at Smyrna først var aiolisk til landflyktige fra Kolofon grep den og gjorde den jonisk, og at den lydiske kongen Alyattes inntok den omkring 600 f.Kr. I omkring fire hundre år deretter bodde innbyggerne i landsbyer, sier Strabon."
    - "Den nye byen reiste seg omkring 300 f.Kr. på skråningene av Pagos-fjellet: Strabon tilskriver Antigonos og Lysimakhos æren, mens Pausanias forteller at Aleksander ble befalt i en drøm å grunnlegge den. Strabon priser de rette, brolagte gatene, søylehallene, biblioteket og Homers helligdom, som smyrnerne gjorde krav på som sin egen. Som en lojal alliert av Roma bygde Smyrna et tempel for byen Roma i 195 f.Kr., det første, som utsendingene dens senere fortalte Senatet; i 26 e.Kr. valgte Senatet den framfor ti rivaler som sted for et tempel for Tiberius."
    - "Åpenbaringen nevner Smyrna som nummer to blant de sju menighetene i Asia. Brevet taler om trengsel og fattigdom, om spott fra dem som sier at de er jøder og ikke er det, «men er Satans synagoge», og om fengsel som skal komme, og det lover: «Vær tro inntil døden, så vil jeg gi dig livsens krone!» Tidlig på 100-tallet, etter vanlig datering, gjorde Ignatius av Antiokia, ført under bevoktning til Roma, opphold i Smyrna og skrev senere til menigheten der og til biskopen Polykarp, som ifølge Irenaeus var innsatt av apostler."
    - "Polykarp ble henrettet i stadion i Smyrna; oppfordret til å spotte Kristus svarte han at han hadde tjent ham i åttiseks år. Brevet fra menigheten i Smyrna som forteller om hans død, regnes alminnelig som den eldste kristne beretningen om et martyrium etter Det nye testamente; hans død dateres av noen til omkring 155–156 og av andre til senere år. Omkring 178 ødela et jordskjelv store deler av byen, og Marcus Aurelius ga penger og utnevnte en senator til å gjenreise den."
  tl:
    - "Ang Smirna, ang İzmir ngayon, ay nasa dulo ng isang mahabang golpo sa baybayin ng Dagat Aegeo ng Asia Minor. Ang mas matandang lunsod ay nakatayo sa kabila ng look sa Bayraklı, isang burol na tinirhan mula pa noong ikatlong milenyo BK at hinukay ni J. M. Cook pagkatapos ng 1948. Sinasabi ni Herodoto na ang Smirna ay unang Aeolio hanggang sa agawin ito ng mga pinatapon mula sa Colophon at gawing Ionio, at na sinakop ito ng haring Lidio na si Alyattes, noong mga 600 BK. Sa loob ng humigit-kumulang apat na raang taon pagkatapos, ayon kay Estrabon, ang mga tao nito ay nanirahan sa mga nayon."
    - "Ang bagong lunsod ay lumitaw noong mga 300 BK sa mga dalisdis ng Bundok Pagus: iniuugnay ito ni Estrabon kina Antigono at Lysimachus, samantalang isinasalaysay ni Pausanias na sinabihan si Alejandro sa panaginip na itatag ito. Pinupuri ni Estrabon ang mga tuwid at sementadong lansangan nito, ang mga portiko, ang aklatan at ang dambana ni Homero, na inangkin ng mga taga-Smirna bilang kanila. Bilang tapat na kakampi ng Roma, nagtayo ang Smirna ng templo para sa Lunsod ng Roma noong 195 BK, ang una, ayon sa sinabi ng mga sugo nito sa Senado pagkaraan; noong 26 AD, pinili ito ng Senado kaysa sa sampung katunggali bilang pook ng templo ni Tiberio."
    - "Pinangalanan ng Apocalipsis ang Smirna na pangalawa sa pitong iglesia ng Asia. Ang liham nito ay nagsasalita ng kapighatian at kadukhaan, ng paninirang-puri ng mga nagsasabing sila'y mga Judio at hindi naman, “kundi isang sinagoga ni Satanas”, at ng pagkabilanggong darating, at nangangako: “Magtapat ka hanggang sa kamatayan, at bibigyan kita ng putong ng buhay.” Sa simula ng ikalawang siglo, ayon sa karaniwang pagpetsa, si Ignacio ng Antioquia, na dinala sa Roma sa ilalim ng bantay, ay tumigil sa Smirna at nang maglaon ay sumulat sa iglesia nito at sa obispo nitong si Policarpo, na ayon kay Ireneo ay itinalaga ng mga apostol."
    - "Si Policarpo ay pinatay sa istadyum ng Smirna; nang hilingang lait-laitin si Kristo, sumagot siyang naglingkod siya sa kaniya nang walumpu't anim na taon. Ang liham ng iglesia ng Smirna na nagsasalaysay ng kaniyang kamatayan ay karaniwang itinuturing na pinakamatandang salaysay ng Kristiyano tungkol sa isang pagkamartir pagkatapos ng Bagong Tipan; ang kaniyang kamatayan ay itinatala ng ilan sa mga 155–156 at ng iba sa mga huling taon. Noong mga 178, winasak ng lindol ang malaking bahagi ng lunsod, at nagbigay si Marcus Aurelio ng salapi at humirang ng isang senador upang muling itayo ito."
  da:
    - "Smyrna, nutidens İzmir, ligger i bunden af en lang bugt på Lilleasiens ægæiske kyst. Den ældre by lå på den anden side af bugten ved Bayraklı, en tell, der har været beboet siden 3. årtusinde f.Kr., og som J. M. Cook udgravede efter 1948. Herodot siger, at Smyrna først var æolisk, indtil landflygtige fra Kolofon indtog den og gjorde den ionisk, og at den lydiske konge Alyattes erobrede den omkring 600 f.Kr. I omkring fire hundrede år derefter boede dens folk ifølge Strabon i landsbyer."
    - "Den nye by rejste sig omkring 300 f.Kr. på skråningerne af Pagos-bjerget: Strabon tilskriver Antigonos og Lysimachos æren, mens Pausanias fortæller, at Alexander i en drøm blev opfordret til at grundlægge den. Strabon roser dens lige, brolagte gader, dens søjlegange, dens bibliotek og dens helligdom for Homer, som smyrnæerne gjorde krav på som deres egen. Som loyal allieret af Rom byggede Smyrna i 195 f.Kr. et tempel for byen Rom, det første, som dens udsendinge senere fortalte Senatet; i 26 e.Kr. valgte Senatet den frem for ti rivaler som sted for et tempel for Tiberius."
    - "Johannes' Åbenbaring nævner Smyrna som nummer to blandt de syv menigheder i Asien. Dens brev taler om trængsel og fattigdom, om bespottelse fra dem, der siger, at de er jøder, og ikke er det, »men ere Satans Synagoge«, og om fængsel, der kommer, og det lover: »Vær tro indtil Døden, saa vil jeg give dig Livets Krone.« Tidligt i 100-tallet e.Kr., efter den sædvanlige datering, gjorde Ignatius af Antiokia, ført under bevogtning til Rom, ophold i Smyrna og skrev senere til dens menighed og til dens biskop Polykarp, som ifølge Irenæus var indsat af apostle."
    - "Polykarp blev henrettet i Smyrnas stadion; opfordret til at forhåne Kristus svarede han, at han havde tjent ham i seksogfirs år. Brevet fra menigheden i Smyrna, der beretter om hans død, regnes almindeligvis for den ældste kristne beretning om et martyrium efter Det Nye Testamente; hans død dateres af nogle til omkring 155–156 og af andre til senere år. Omkring 178 ødelagde et jordskælv en stor del af byen, og Marcus Aurelius gav penge og udnævnte en senator til at genopbygge den."
