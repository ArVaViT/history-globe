# Overview article (ADR 0007). Mainstream facts only; the location is disputed and the map's candidates are given without choosing one; the mountain Peor has its own article.
id: beth-peor
place: af3ce34
title:
  en: "Beth-peor"
  ru: "Беф-Фегор"
  uk: "Бет-Пеор"
  es: "Bet-peor"
  pt: "Bete-Peor"
  de: "Bet-Peor"
