body:
  en:
    - "Beth-peor, “house of Peor”, was a town below Mount Peor in the hills of Moab north of Mount Nebo, where the plateau breaks down towards the Jordan plain opposite Jericho; its name, like Baal-peor, comes from Peor, the mountain above it, whose Baal Israel worshipped. Joshua gives it to Reuben with “Ashdoth-pisgah, and Beth-jeshimoth”, and Eusebius knew Bethphogor as a place opposite Jericho, six miles above Livias on the road up to Heshbon. Which ruin it is remains disputed, and the map keeps the candidates: Khirbet Ayun Musa, by the springs of Moses in the gorge north of Nebo, Khirbet el-Muhatta on the slope above, and Tall Iktanu lower down. None has been excavated as Beth-peor."
    - "The valley in front of it is the setting of Deuteronomy. After the conquest of Sihon and Og, Moses says, “we abode in the valley over against Beth-peor”, and there, “on this side Jordan, in the valley over against Beth-peor”, he set the law before Israel in his final addresses. It was also the valley of Israel's sin with the daughters of Moab, when “Israel joined himself unto Baal-peor”. And it is the valley of Moses' grave: he died on Nebo, “and he buried him in a valley in the land of Moab, over against Beth-peor: but no man knoweth of his sepulchre unto this day”."
    - "The ground today is the Jordanian hill country between Madaba and the Dead Sea: the Franciscan church on Mount Nebo with its view over the Jordan valley, the springs of Ayun Musa in the gorge below, and small ruins on the slopes that only a survey has recorded."
  ru:
    - "Беф-Фегор, «дом Фегора», — город под горой Фегор в горах Моава к северу от горы Нево, где плоскогорье обрывается к долине Иордана против Иерихона; его имя, как и Ваал-Фегор, — от Фегора, горы над ним, Ваалу которой поклонялся Израиль. Иисус Навин отдаёт Рувиму «Беф-Фегор и места при подошве Фасги и Беф-Иешимоф», а Евсевий знал Беффогор как место против Иерихона, в шести милях выше Ливиады по дороге в Есевон. Какие это руины, остаётся спорным, и карта хранит кандидатов: Хирбет-Аюн-Муса у источников Моисея в ущелье к северу от Нево, Хирбет-эль-Мухатта на склоне выше и Телль-Иктану ниже. Ни одно из них не раскопано как Беф-Фегор."
    - "Долина перед ним — место действия Второзакония. После победы над Сигоном и Огом, говорит Моисей, «остановились мы на долине, напротив Беф-Фегора», и там, «за Иорданом, на долине против Беф-Фегора», он изложил закон Израилю в своих последних речах. Это и долина греха Израиля с дочерями Моава, когда «прилепился Израиль к Ваал-Фегору». И это долина могилы Моисея: он умер на Нево «и погребен на долине в земле Моавитской против Беф-Фегора, и никто не знает места погребения его даже до сего дня»."
    - "Эта земля сегодня — иорданское нагорье между Мадабой и Мёртвым морем: францисканская церковь на горе Нево с видом на долину Иордана, источники Аюн-Муса в ущелье под ней и небольшие руины на склонах, которые записала только разведка."
  uk:
    - "Бет-Пеор, «дім Пеору», було містом під горою Пеор у моавських пагорбах на північ від гори Нево, де плато спадає до Йорданської рівнини навпроти Єрихону; його назва, як і Ваал-Пеор, походить від Пеору, гори над ним, Ваалові якої поклонявся Ізраїль. Ісус Навин дає його Рувимові разом із «Азедот, Фасга, і Бет-Есимот», а Євсевій знав Бетфогор як місце навпроти Єрихону, за шість миль над Лівіадою на дорозі вгору до Гесбону. Яка це руїна, лишається спірним, і мапа зберігає кандидатів: Хірбет-Айюн-Муса біля джерел Мойсея в ущелині на північ від Нево, Хірбет-ель-Мухатта на схилі над ним і Талль-Іктану нижче. Жодну не розкопували як Бет-Пеор."
    - "Долина перед ним — місце дії Второзаконня. Після перемоги над Сігоном та Огом, каже Мойсей, «пробували ми в долинї проти Бет-Пеора», і там, «По сїм боцї Йорданї, в долинї, проти Бет-Пеору», він виклав закон Ізраїлю в своїх прощальних промовах. Це також долина гріха Ізраїлю з моавськими дочками, коли «прихиливсь Ізраїль до Бааль-Пеора». І це долина гробу Мойсея: він помер на Нево, «І він поховав його в долинї, в Моаб землї, проти Бет-Пеору; і по сей день нїхто не знає гробища його»."
    - "Нині ця місцевість — йорданське нагір'я між Мадабою і Мертвим морем: францисканська церква на горі Нево з видом на Йорданську долину, джерела Айюн-Муса в ущелині внизу та невеликі руїни на схилах, які зафіксувала лише розвідка."
  es:
    - "Bet-peor, «casa de Peor», era una ciudad bajo el monte Peor en las colinas de Moab, al norte del monte Nebo, donde la meseta se quiebra hacia la llanura del Jordán frente a Jericó; su nombre, como Baal-peor, procede de Peor, el monte que se alza sobre ella, cuyo Baal adoró Israel. Josué la da a Rubén con «Asdoth-pisga, y Beth-jesimoth», y Eusebio conocía Bethphogor como un lugar frente a Jericó, a seis millas por encima de Livias en el camino que sube a Hesbón. Qué ruina es sigue siendo objeto de discusión, y el mapa conserva los candidatos: Khirbet Ayun Musa, junto a los manantiales de Moisés en la garganta al norte del Nebo, Khirbet el-Muhatta en la ladera de arriba, y Tall Iktanu, más abajo. Ninguno ha sido excavado como Bet-peor."
    - "El valle que tiene delante es el escenario del Deuteronomio. Tras la conquista de Sehón y de Og, dice Moisés, «paramos en el valle delante de Beth-peor», y allí, «De esta parte del Jordán, en el valle delante de Beth-peor», expuso la ley ante Israel en sus discursos finales. Fue también el valle del pecado de Israel con las hijas de Moab, cuando «allegóse el pueblo á Baal-peor». Y es el valle de la tumba de Moisés: murió en el Nebo, «Y enterrólo en el valle, en tierra de Moab, enfrente de Bethpeor; y ninguno sabe su sepulcro hasta hoy»."
    - "El terreno es hoy la región montañosa jordana entre Madaba y el mar Muerto: la iglesia franciscana del monte Nebo con su vista sobre el valle del Jordán, los manantiales de Ayun Musa en la garganta de abajo y pequeñas ruinas en las laderas que solo una prospección ha registrado."
  pt:
    - "Bete-Peor, “casa de Peor”, era uma cidade abaixo do monte Peor, nas colinas de Moabe ao norte do monte Nebo, onde o planalto desce para a planície do Jordão defronte de Jericó; seu nome, como o de Baal-Peor, vem de Peor, a montanha acima dela, cujo Baal Israel adorou. Josué a dá a Rúben com “as encostas de Pisga, Bete-Jesimote”, e Eusébio conhecia Bethphogor como um lugar defronte de Jericó, a seis milhas acima de Lívias, na estrada que sobe a Hesbom. Qual ruína seja continua discutido, e o mapa guarda os candidatos: Khirbet Ayun Musa, junto às fontes de Moisés na garganta ao norte do Nebo, Khirbet el-Muhatta, na encosta acima, e Tall Iktanu, mais abaixo. Nenhuma foi escavada como Bete-Peor."
    - "O vale diante dela é o cenário de Deuteronômio. Depois da conquista de Seom e de Ogue, diz Moisés, “Então ficamos no vale perto de Bete-Peor”, e ali, “do outro lado do Jordão, no vale em frente a Bete-Peor”, expôs a lei a Israel em seus discursos finais. Foi também o vale do pecado de Israel com as filhas de Moabe, quando “Israel juntou-se a Baal-Peor”. E é o vale do túmulo de Moisés: ele morreu no Nebo, “Ele o sepultou no vale, na terra de Moabe, em frente a Bete-Peor, mas ninguém sabe onde fica o seu túmulo até o dia de hoje”."
    - "O terreno é hoje a região montanhosa jordaniana entre Madaba e o mar Morto: a igreja franciscana no monte Nebo com sua vista sobre o vale do Jordão, as fontes de Ayun Musa na garganta abaixo e pequenas ruínas nas encostas que só um levantamento registrou."
  de:
    - "Bet-Peor, „Haus des Peor“, war eine Stadt unterhalb des Berges Peor in den Bergen Moabs nördlich des Berges Nebo, wo das Plateau zur Jordanebene gegenüber von Jericho abbricht; sein Name stammt wie der von Baal-Peor vom Peor, dem Berg darüber, dessen Baal Israel verehrte. Josua gibt es Ruben mit „die Abhänge am Pisga und Beth-Jesimoth“, und Eusebius kannte Bethphogor als Ort gegenüber von Jericho, sechs Meilen oberhalb von Livias an der Straße hinauf nach Heschbon. Welche Ruine es ist, bleibt umstritten, und die Karte hält die Kandidaten fest: Chirbet Ajun Musa, bei den Mosequellen in der Schlucht nördlich des Nebo, Chirbet el-Muhatta am Hang darüber und Tall Iktanu weiter unten. Keines wurde als Bet-Peor ausgegraben."
    - "Das Tal davor ist der Schauplatz des Fünften Buches Mose. Nach der Eroberung von Sihon und Og, sagt Mose: „Also blieben wir im Tal gegenüber Beth-Peor“, und dort, „jenseit des Jordans, im Tal gegenüber Beth-Peor“, legte er Israel in seinen Schlussreden das Gesetz vor. Es war auch das Tal von Israels Sünde mit den Töchtern Moabs, als es hieß: „Und Israel hängte sich an den Baal-Peor“. Und es ist das Tal des Grabes Moses: Er starb auf dem Nebo, „und er begrub ihn im Tal im Lande der Moabiter gegenüber Beth-Peor. Und niemand hat sein Grab erfahren bis auf diesen heutigen Tag“."
    - "Das Gelände ist heute das jordanische Bergland zwischen Madaba und dem Toten Meer: die Franziskanerkirche auf dem Berg Nebo mit ihrem Blick über das Jordantal, die Quellen von Ajun Musa in der Schlucht darunter und kleine Ruinen an den Hängen, die nur ein Survey verzeichnet hat."
  fr:
    - "Beth-Peor, « maison de Peor », était une ville au pied du mont Peor dans les collines de Moab au nord du mont Nebo, là où le plateau s’effondre vers la plaine du Jourdain en face de Jéricho ; son nom, comme Baal-Peor, vient de Peor, la montagne au-dessus, dont Israël adora le Baal. Josué la donne à Ruben avec « les coteaux du Pisga, Beth-Jeschimoth », et Eusèbe connaissait Bethphogor comme un lieu en face de Jéricho, à six milles au-dessus de Livias sur la route montant à Hesbon. Quelle ruine c’est demeure discuté, et la carte garde les candidats : Khirbet Ayun Musa, près des sources de Moïse dans la gorge au nord du Nebo, Khirbet el-Muhatta sur la pente au-dessus, et Tall Iktanu plus bas. Aucun n’a été fouillé comme Beth-Peor."
    - "La vallée devant elle est le cadre du Deutéronome. Après la conquête de Sihon et d’Og, Moïse dit : « Nous demeurâmes dans la vallée, vis-à-vis de Beth-Peor », et c’est là, « de l’autre côté du Jourdain, dans la vallée, vis-à-vis de Beth-Peor », qu’il exposa la loi à Israël dans ses derniers discours. C’était aussi la vallée du péché d’Israël avec les filles de Moab, quand « Israël s’attacha à Baal-Peor ». Et c’est la vallée de la tombe de Moïse : il mourut sur le Nebo, et l’Éternel « l’enterra dans la vallée, au pays de Moab, vis-à-vis de Beth-Peor. Personne n’a connu son sépulcre jusqu’à ce jour »."
    - "Le terrain est aujourd’hui la montagne jordanienne entre Madaba et la mer Morte : l’église franciscaine du mont Nebo avec sa vue sur la vallée du Jourdain, les sources d’Ayun Musa dans la gorge au-dessous, et de petites ruines sur les pentes que seule une prospection a consignées."
  it:
    - "Bet-Peor, «casa di Peor», era una città sotto il monte Peor sulle colline di Moab a nord del monte Nebo, dove l’altopiano scende verso la piana del Giordano di fronte a Gerico; il suo nome, come Baal-Peor, viene da Peor, il monte sopra di essa, il cui Baal Israele adorò. Giosuè la dà a Ruben con «le pendici del Pisga e Beth-Iescimoth», ed Eusebio conosceva Bethphogor come un luogo di fronte a Gerico, sei miglia sopra Livias sulla strada che sale a Chesbon. Quale rovina sia resta discusso, e la carta conserva i candidati: Khirbet Ayun Musa, presso le sorgenti di Mosè nella gola a nord del Nebo, Khirbet el-Muhatta sul pendio sopra, e Tall Iktanu più in basso. Nessuno è stato scavato come Bet-Peor."
    - "La valle davanti ad essa è lo scenario del Deuteronomio. Dopo la conquista di Sicon e di Og, dice Mosè, «Così ci fermammo nella valle dirimpetto a Beth-Peor», e là, «di là dal Giordano, nella valle, dirimpetto Beth-Peor», pose la legge davanti a Israele nei suoi discorsi finali. Fu anche la valle del peccato d’Israele con le figlie di Moab, quando «Israele si unì a Baal-Peor». Ed è la valle della tomba di Mosè: morì sul Nebo, «E l’Eterno lo seppellì nella valle, nel paese di Moab, dirimpetto a Beth-Peor; e nessuno fino a questo giorno ha mai saputo dove fosse la sua tomba»."
    - "Il terreno è oggi la regione collinosa giordana tra Madaba e il Mar Morto: la chiesa francescana sul monte Nebo con la sua vista sulla valle del Giordano, le sorgenti di Ayun Musa nella gola sottostante, e piccole rovine sui pendii che solo una ricognizione ha registrato."
  pl:
    - "Bet-Peor, „dom Peoru”, było miastem pod górą Peor we wzgórzach Moabu na północ od góry Nebo, gdzie wyżyna opada ku równinie Jordanu naprzeciw Jerycha; jego nazwa, jak Baal-Peor, pochodzi od Peoru, góry nad nim, której Baalowi oddawał cześć Izrael. Jozue daje je Rubenowi z „Asdod, Fazga, i Betyjesymot”, a Euzebiusz znał Bethphogor jako miejsce naprzeciw Jerycha, sześć mil nad Livias przy drodze w górę do Cheszbonu. Która to ruina, pozostaje sporne, a mapa zachowuje kandydatów: Chirbet Ayun Musa, przy źródłach Mojżesza w wąwozie na północ od Nebo, Chirbet el-Muhatta na stoku powyżej i Tall Iktanu niżej. Żaden nie był wykopywany jako Bet-Peor."
    - "Dolina przed nim jest sceną Księgi Powtórzonego Prawa. Po podboju Sychona i Oga, mówi Mojżesz, „mieszkaliśmy w dolinie przeciw Betfegor”, i tam, „z tej strony Jordanu, w dolinie przeciw Betfegor”, przedłożył Izraelowi prawo w swych ostatnich przemówieniach. Była to także dolina grzechu Izraela z córkami Moabu, gdy „przyłączył się Izrael do służby Baal Fegora”. I jest to dolina grobu Mojżesza: umarł na Nebo, a „pogrzebł go Pan w dolinie w ziemi Moabskiej, przeciw Betfegorowi, a nie dowiedział się nikt o grobie jego aż do dnia tego”."
    - "Dziś teren to jordańskie wzgórza między Madabą a Morzem Martwym: franciszkański kościół na górze Nebo z widokiem na Dolinę Jordanu, źródła Ayun Musa w wąwozie poniżej i małe ruiny na stokach, które zarejestrowano tylko w badaniu powierzchniowym."
  nl:
    - "Beth-Peor, “huis van Peor”, was een stad onder de berg Peor in de heuvels van Moab ten noorden van de Nebo, waar het plateau afbreekt naar de Jordaanvlakte tegenover Jericho; haar naam komt, evenals Baäl-Peor, van Peor, de berg erboven, wiens Baäl Israël vereerde. Jozua geeft haar aan Ruben met “Asdoth-Pisga, en Beth-Jesimoth”, en Eusebius kende Bethphogor als een plaats tegenover Jericho, zes mijl boven Livias aan de weg omhoog naar Chesbon. Welke ruïne het is, blijft omstreden, en de kaart bewaart de kandidaten: Khirbet Ayun Musa, bij de bronnen van Mozes in de kloof ten noorden van de Nebo, Khirbet el-Muhatta op de helling erboven, en Tall Iktanu lager. Geen is als Beth-Peor opgegraven."
    - "Het dal ervoor is het toneel van Deuteronomium. Na de verovering van Sihon en Og zegt Mozes: “Alzo bleven wij in dit dal tegenover Beth-Peor”, en daar, “Aan deze zijde van de Jordaan, in het dal tegenover Beth-Peor”, legde hij in zijn slotredes de wet voor Israël neer. Het was ook het dal van Israëls zonde met de dochters van Moab, toen “Israel zich koppelde aan Baal-Peor”. En het is het dal van Mozes’ graf: hij stierf op de Nebo, “En Hij begroef hem in een dal, in het land van Moab, tegenover Beth-Peor; en niemand heeft zijn graf geweten, tot op dezen dag”."
    - "Het terrein is nu het Jordaanse heuvelland tussen Madaba en de Dode Zee: de franciscaanse kerk op de berg Nebo met haar uitzicht over de Jordaanvallei, de bronnen van Ayun Musa in de kloof eronder, en kleine ruïnes op de hellingen die alleen een verkenning heeft vastgelegd."
  cs:
    - "Bét-peór, „dům Peóru“, bylo město pod horou Peór v pahorcích Moábu severně od hory Nebo, kde planina klesá k Jordánské pláni naproti Jerichu; jeho jméno, stejně jako Báal-peór, pochází od Peóru, hory nad ním, jejímuž Báalovi se Izrael klaněl. Jozue je přiděluje Rúbenovi s „Assedot, Fazga a Betsimot“ a Eusebios znal Bethphogor jako místo naproti Jerichu, šest mil nad Livias na cestě vzhůru do Chešbónu. Která zřícenina to je, zůstává sporné a mapa uchovává kandidáty: Chirbet Ayun Musa, u Mojžíšových pramenů v soutěsce severně od Nebo, Chirbet el-Muhatta na svahu nad ním a Tall Iktanu níže. Žádné nebylo vykopáno jako Bét-peór."
    - "Údolí před ním je dějištěm Deuteronomia. Po dobytí Sichona a Oga, praví Mojžíš, „I zůstali jsme v údolí naproti Betfegor“ a tam, „Před Jordánem v údolí naproti Betfegor“, předložil Izraeli zákon ve svých závěrečných řečech. Bylo to také údolí hříchu Izraele s dcerami Moábu, kdy „I připojil se lid Izraelský k modle Belfegor“. A je to údolí Mojžíšova hrobu: zemřel na Nebo a „A pochoval jej v Gai, v zemi Moábské naproti Betfegor, a žádný nezvěděl o jeho hrobu až do tohoto dne“."
    - "Země je dnes jordánská pahorkatina mezi Madabou a Mrtvým mořem: františkánský kostel na hoře Nebo s výhledem na Jordánské údolí, prameny Ayun Musa v soutěsce pod ním a drobné zříceniny na svazích, které zaznamenal jen průzkum."
