# Overview article (ADR 0007). Mainstream facts only; the location is disputed and the map's candidates are given without choosing one; the mountain Peor has its own article.
id: beth-peor
place: af3ce34
title:
  en: "Beth-peor"
  ru: "Беф-Фегор"
body:
  en:
    - "Beth-peor, “house of Peor”, was a town below Mount Peor in the hills of Moab north-west of Mount Nebo, where the plateau breaks down towards the Jordan plain opposite Jericho; its name, like Baal-peor, comes from the god worshipped on the mountain above it. Joshua gives it to Reuben with “Ashdoth-pisgah, and Beth-jeshimoth”, and Eusebius knew Bethphogor as a place opposite Jericho, six miles above Livias on the road up to Heshbon. Which ruin it is remains disputed, and the map keeps the candidates: Khirbet Ayun Musa, by the springs of Moses in the gorge north of Nebo, Khirbet el-Muhatta on the slope above, and Tall Iktanu lower down. None has been excavated as Beth-peor."
    - "The valley in front of it is the setting of Deuteronomy. After the conquest of Sihon and Og, Moses says, “we abode in the valley over against Beth-peor”, and there, “on this side Jordan, in the valley over against Beth-peor”, he set the law before Israel in his final addresses. It was also the valley of Israel's sin with the daughters of Moab, when “Israel joined himself unto Baal-peor”. And it is the valley of Moses' grave: he died on Nebo, “and he buried him in a valley in the land of Moab, over against Beth-peor: but no man knoweth of his sepulchre unto this day”."
    - "The ground today is the Jordanian hill country between Madaba and the Dead Sea: the Franciscan church on Mount Nebo with its view over the Jordan valley, the springs of Ayun Musa in the gorge below, and small ruins on the slopes that only a survey has recorded."
  ru:
    - "Беф-Фегор, «дом Фегора», — город под горой Фегор в горах Моава к северо-западу от горы Нево, где плоскогорье обрывается к долине Иордана против Иерихона; его имя, как и Ваал-Фегор, — от бога, которого чтили на горе над ним. Иисус Навин отдаёт Рувиму «Беф-Фегор и места при подошве Фасги и Беф-Иешимоф», а Евсевий знал Беффогор как место против Иерихона, в шести милях выше Ливиады по дороге в Есевон. Какие это руины, остаётся спорным, и карта хранит кандидатов: Хирбет-Аюн-Муса у источников Моисея в ущелье к северу от Нево, Хирбет-эль-Мухатта на склоне выше и Телль-Иктану ниже. Ни одно из них не раскопано как Беф-Фегор."
    - "Долина перед ним — место действия Второзакония. После победы над Сигоном и Огом, говорит Моисей, «остановились мы на долине, напротив Беф-Фегора», и там, «за Иорданом, на долине против Беф-Фегора», он изложил закон Израилю в своих последних речах. Это и долина греха Израиля с дочерями Моава, когда «прилепился Израиль к Ваал-Фегору». И это долина могилы Моисея: он умер на Нево «и погребен на долине в земле Моавитской против Беф-Фегора, и никто не знает места погребения его даже до сего дня»."
    - "Эта земля сегодня — иорданское нагорье между Мадабой и Мёртвым морем: францисканская церковь на горе Нево с видом на долину Иордана, источники Аюн-Муса в ущелье под ней и небольшие руины на склонах, которые записала только разведка."
