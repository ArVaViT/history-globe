body:
  en:
    - "Ophrah was the home of Gideon, “Ophrah of the Abi-ezrites”, a village of the clan of Abiezer in the tribe of Manasseh, west of the Jordan. It is not the Ophrah of Benjamin near Bethel. Where it stood is unknown: Judges puts it within reach of Midianite raiders in the Jezreel valley and of Shechem, where Abimelech later made himself king. Proposals run from Afula in the middle of the valley, to Khirbet Taiyibeh and Silat adh-Dhahr in the hills of Samaria, to Fer'ata west of Shechem; none has yielded any trace of the name, and the map shows them all without choosing."
    - "Everything the Bible tells of Ophrah belongs to one family. The angel of the Lord “sat under an oak which was in Ophrah, that pertained unto Joash the Abi-ezrite”, where Gideon “threshed wheat by the winepress, to hide it from the Midianites”, and called him to deliver Israel. Gideon built an altar there and called it Jehovah-shalom, “unto this day it is yet in Ophrah of the Abi-ezrites”; by night he pulled down his father's altar of Baal. After his victory he made an ephod of the Midianites' gold and “put it in his city, even in Ophrah”, which became a snare to him and his house. He died in old age and “was buried in the sepulchre of Joash his father, in Ophrah”; there his son Abimelech slew his seventy brothers “upon one stone”, and only Jotham escaped."
    - "Nothing is heard of the place afterwards. For an archaeologist it does not yet exist; for the reader of Judges it is the oak, the winepress and the one stone."
  ru:
    - "Офра — родина Гедеона, Офра Авиезерова, селение рода Авиезера из колена Манассии к западу от Иордана. Это не Офра Вениаминова близ Вефиля. Где она стояла, неизвестно: книга Судей помещает её в досягаемости мадиамских набегов на Изреельскую долину и недалеко от Сихема, где Авимелех потом сделал себя царём. Предлагали Афулу посреди долины, Хирбет-Тайибе и Силат-эз-Захр в горах Самарии, Фарату к западу от Сихема; ни одно из этих мест не сохранило следов имени, и на карте показаны все они, без выбора."
    - "Всё, что Библия говорит об Офре, принадлежит одной семье. Ангел Господень «сел в Офре под дубом, принадлежащим Иоасу, потомку Авиезерову», где Гедеон «выколачивал тогда пшеницу в точиле, чтобы скрыться от Мадианитян», и призвал его спасти Израиль. Гедеон устроил там жертвенник и назвал его Иегова Шалом: «Он еще до сего дня в Офре Авиезеровой»; ночью он разрушил отцовский жертвенник Ваала. После победы он сделал из золота Мадианитян ефод и положил его «в своем городе, в Офре», и тот стал сетью ему и всему его дому. Он умер в глубокой старости «и погребен во гробе отца своего Иоаса, в Офре Авиезеровой»; там его сын Авимелех убил семьдесят своих братьев «на одном камне», и спасся один Иофам."
    - "Больше об этом месте ничего не слышно. Для археолога его пока нет; для читателя книги Судей это дуб, точило и один камень."
  uk:
    - "Офра була домівкою Гедеона, «в Офрі Авіезеровій», селом роду Авіезера в коліні Манасії, на захід від Йордану. Це не Офра Веніямина поблизу Бет-Елу. Де вона стояла — невідомо: книга Суддів ставить її в межах досяжності для мадіанітських нападників у Їзреельській долині та для Шехема, де згодом Авімелех оголосив себе царем. Пропозиції тягнуться від Афули посеред долини, через Хірбет-Тайїбе й Сілат-ед-Дагр у горах Самарії, до Фер’ати на захід від Шехема; жодна не дала сліду назви, і мапа показує їх усі, не обираючи."
    - "Усе, що Біблія розповідає про Офру, стосується однієї родини. Ангел Господній «сїв під дубом ув Офрі, що належав до Йоаса, потомка Авіезерового», де Гедеон «молотив пшеницю в печері, щоб сховати її від Мадиянїїв», і покликав його визволити Ізраїль. Гедеон збудував там жертовник і назвав його «Господень мир»: «і досї він стоїть в Авіезеровій Офрі»; уночі він зруйнував батьків жертовник Ваалу. Після перемоги він виготовив ефод із золота мадіанітян і «поставив його в отецькому городї свойму Офрі», що став пасткою для нього й його дому. Він помер у глибокій старості, і «поховано його в гробовищі батьківському Йоасовому в Офрі Авіезеровій»; там його син Авімелех повбивав сімдесят своїх братів «на одному каменї», і лише Йотам урятувався."
    - "Про це місце потім нічого не чути. Для археолога його ще не існує; для читача Суддів це дуб, давильня й один камінь."
  es:
    - "Ofra fue la patria de Gedeón, «Ophra de los Abiezeritas», una aldea del clan de Abiezer en la tribu de Manasés, al oeste del Jordán. No es la Ofra de Benjamín cerca de Betel. Se desconoce dónde estaba: Jueces la sitúa al alcance de los merodeadores madianitas en el valle de Jezreel y de Siquem, donde más tarde Abimelec se hizo rey. Las propuestas van de Afula, en medio del valle, a Khirbet Taiyibeh y Silat adh-Dhahr, en las colinas de Samaria, y a Fer'ata, al oeste de Siquem; ninguna ha dado rastro alguno del nombre, y el mapa las muestra todas sin elegir."
    - "Todo lo que la Biblia cuenta de Ofra pertenece a una sola familia. El ángel del Señor «sentóse debajo del alcornoque que está en Ophra, el cual era de Joas Abiezerita», donde Gedeón «estaba sacudiendo el trigo en el lagar, para hacerlo esconder de los Madianitas», y lo llamó a librar a Israel. Gedeón edificó allí un altar y lo llamó Jehová-salom: «está hasta hoy en Ophra de los Abiezeritas»; de noche derribó el altar de Baal de su padre. Tras su victoria hizo un efod con el oro de los madianitas y «hizo guardar en su ciudad de Ophra», lo que fue un tropiezo para él y para su casa. Murió en buena vejez y «fué sepultado en el sepulcro de su padre Joas, en Ophra»; allí su hijo Abimelec mató a sus setenta hermanos «sobre una piedra», y solo escapó Jotam."
    - "Después no se vuelve a oír nada del lugar. Para un arqueólogo todavía no existe; para el lector de Jueces es el alcornoque, el lagar y la única piedra."
  pt:
    - "Ofra era a terra de Gideão, “Ofra dos abiezritas”, aldeia do clã de Abiezer na tribo de Manassés, a oeste do Jordão. Não é a Ofra de Benjamim, perto de Betel. Onde ficava é desconhecido: Juízes a põe ao alcance dos saqueadores midianitas no vale de Jezreel e de Siquém, onde Abimeleque mais tarde se fez rei. As propostas vão de Afula, no meio do vale, a Khirbet Taiyibeh e Silat adh-Dhahr, nas colinas de Samaria, e a Fer'ata, a oeste de Siquém; nenhuma deu qualquer vestígio do nome, e o mapa mostra todas sem escolher."
    - "Tudo o que a Bíblia conta de Ofra pertence a uma só família. O anjo do SENHOR “sentou-se debaixo do carvalho que estava em Ofra, que pertencia a Joás, o abiezrita”, onde Gideão “estava malhando o trigo no lagar, para escondê-lo dos midianitas”, e o chamou para libertar Israel. Gideão construiu ali um altar e o chamou “O SENHOR é Paz”: “Até o dia de hoje ainda está em Ofra dos abiezritas”; de noite derrubou o altar de Baal de seu pai. Depois da vitória fez um éfode com o ouro dos midianitas e “o colocou em Ofra, a sua cidade”, o que se tornou um laço para ele e sua casa. Morreu em boa velhice e “foi sepultado no túmulo de Joás, o seu pai, em Ofra dos abiezritas”; ali seu filho Abimeleque matou os setenta irmãos “sobre uma mesma pedra”, e só Jotão escapou."
    - "Nada mais se ouve do lugar. Para o arqueólogo ele ainda não existe; para o leitor de Juízes é o carvalho, o lagar e a pedra única."
  de:
    - "Ofra war die Heimat Gideons, „Ophra, der Stadt der Abiesriter“, ein Dorf der Sippe Abiëser im Stamm Manasse westlich des Jordan. Es ist nicht das Ofra Benjamins bei Bethel. Wo es stand, ist unbekannt: Die Richter rücken es in Reichweite der midianitischen Plünderer in der Jesreel-Ebene und Sichems, wo Abimelech sich später zum König machte. Die Vorschläge reichen von Afula mitten in der Ebene über Chirbet Taijibe und Silat ad-Dahr im Bergland Samarias bis Fer'ata westlich von Sichem; keiner hat eine Spur des Namens erbracht, und die Karte zeigt alle, ohne zu wählen."
    - "Alles, was die Bibel von Ofra erzählt, gehört zu einer Familie. Der Engel des HERRN „setzte sich unter eine Eiche zu Ophra, die war des Joas, des Abiesriters“, wo Gideon „drosch Weizen in der Kelter, daß er ihn bärge vor den Midianitern“, und berief ihn, Israel zu retten. Gideon baute dort einen Altar und nannte ihn „Der HERR ist der Friede“, der „steht noch bis auf diesen heutigen Tag zu Ophra, der Stadt der Abiesriter“; bei Nacht riss er den Baalsaltar seines Vaters nieder. Nach seinem Sieg machte er aus dem Gold der Midianiter einen Efod und „setzte ihn in seine Stadt zu Ophra“, was ihm und seinem Haus zum Fall wurde. Er starb in gutem Alter und „ward begraben in seines Vaters Joas Grab zu Ophra“; dort erwürgte sein Sohn Abimelech seine siebzig Brüder „auf einem Stein“, und nur Jotam entkam."
    - "Danach hört man nichts mehr von dem Ort. Für einen Archäologen existiert er noch nicht; für den Leser der Richter ist er die Eiche, die Kelter und der eine Stein."
  fr:
    - "Ophra fut la patrie de Gédéon, « Ophra, qui appartenait à la famille d’Abiézer », village du clan d’Abiézer dans la tribu de Manassé, à l’ouest du Jourdain. Ce n’est pas l’Ophra de Benjamin près de Béthel. On ignore où elle s’élevait : les Juges la placent à portée des pillards madianites de la vallée de Jizreel et de Sichem, où Abimélec se fit plus tard roi. Les propositions vont d’Afula, au milieu de la vallée, à Khirbet Taiyibeh et Silat adh-Dhahr dans les collines de Samarie, et à Fer‘ata, à l’ouest de Sichem ; aucune n’a livré la moindre trace du nom, et la carte les montre toutes sans choisir."
    - "Tout ce que la Bible dit d’Ophra concerne une seule famille. L’ange de l’Éternel « s’assit sous le térébinthe d’Ophra, qui appartenait à Joas, de la famille d’Abiézer », là où Gédéon « battait du froment au pressoir, pour le mettre à l’abri de Madian », et l’appela à délivrer Israël. Gédéon y bâtit un autel qu’il nomma « l’Éternel paix » : « il existe encore aujourd’hui à Ophra, qui appartenait à la famille d’Abiézer » ; de nuit, il renversa l’autel de Baal de son père. Après sa victoire, il fit un éphod avec l’or des Madianites et « le plaça dans sa ville, à Ophra », ce qui devint un piège pour lui et sa maison. Il mourut âgé et « fut enterré dans le sépulcre de Joas, son père, à Ophra » ; là son fils Abimélec tua ses soixante-dix frères « sur une même pierre », et seul Jotham échappa."
    - "On n’entend plus parler du lieu ensuite. Pour l’archéologue, il n’existe pas encore ; pour le lecteur des Juges, c’est le chêne, le pressoir et la pierre unique."
