body:
  en:
    - "Beth-millo, “the house of the fill”, was a quarter or stronghold of Shechem in the days of Abimelech, the son of Gideon. After he had killed his brothers, “all the men of Shechem gathered together, and all the house of Millo, and went, and made Abimelech king, by the plain of the pillar that was in Shechem”. Jotham, the brother who escaped, ended his fable of the trees with a curse: if they had not dealt truly, “let fire come out from Abimelech, and devour the men of Shechem, and the house of Millo; and let fire come out from the men of Shechem, and from the house of Millo, and devour Abimelech”. So it came about: Abimelech destroyed Shechem, and when “all the men of the tower of Shechem” shut themselves in “an hold of the house of the god Berith”, he burned it over them. The house of Millo and the tower of Shechem are probably the same fortified quarter; the map offers both readings."
    - "Shechem is Tell Balata at Nablus, dug by Ernst Sellin from 1913 and by G. Ernest Wright's expedition in 1956–1964. Its dominant building was a fortress-temple of the Middle Bronze Age, about 1650 BC, with walls more than five metres thick, raised on an artificial fill above the city. Wright identified a later, smaller phase of it with the temple of Baal-berith of Judges 9; Lawrence Stager has argued that the great temple itself was still in use in the time of the judges, and it has been suggested that the “fill” of Beth-millo is its platform. A second “house of Millo”, where the servants of Joash murdered him, lay in Jerusalem and is a different place."
    - "Today the foundations of the fortress-temple, with a standing stone re-erected before them, are the centrepiece of the Tell Balata archaeological park on the eastern edge of Nablus."
  ru:
    - "Дом Милло, «дом насыпи», — квартал или крепость Сихема во дни Авимелеха, сына Гедеона. После того как он убил своих братьев, «собрались все жители Сихемские и весь дом Милло, и пошли и поставили царем Авимелеха у дуба, что близ Сихема». Иофам, уцелевший брат, закончил свою притчу о деревьях проклятием: если они поступили не по правде, «то да изыдет огонь от Авимелеха и да пожжет жителей Сихемских и весь дом Милло и да изыдет огонь от жителей Сихемских и от дома Милло, и да пожжет Авимелеха». Так и случилось: Авимелех разрушил Сихем, а когда «все бывшие в башне Сихемской ушли в башню капища Ваал-Верифа», он сжёг её вместе с ними. Дом Милло и башня Сихемская — вероятно, один и тот же укреплённый квартал; на карте даны оба прочтения."
    - "Сихем — это Телль-Балата в Наблусе, который копали Эрнст Зеллин с 1913 года и экспедиция Дж. Эрнеста Райта в 1956–1964 годах. Главным его зданием был храм-крепость среднего бронзового века, около 1650 г. до н. э., со стенами толще пяти метров, поднятый на искусственной насыпи над городом. Райт отождествил его позднейшую, меньшую фазу с капищем Ваал-Верифа из 9-й главы Судей; Лоренс Стейджер доказывал, что сам большой храм ещё служил во времена судей, и высказывалась мысль, что «насыпь» дома Милло — его площадка. Второй «дом Милло», где слуги убили Иоаса, лежал в Иерусалиме и является другим местом."
    - "Сегодня основания храма-крепости с заново поставленным перед ними священным камнем — сердцевина археологического парка Телль-Балата на восточной окраине Наблуса."
  uk:
    - "Бет-Мілло, «дім насипу», було кварталом чи твердинею Сихема за днів Авімелеха, сина Гедеона. Коли він убив своїх братів, «зібрались до купи всї городяне Сихемські вкупі з родинами (містечка) Мілло, зійшлись і обрали собі Абимелеха за царя під дубом, що стоїть під Сихемом». Йотам, брат, який уцілів, закінчив свою байку про дерева прокляттям: якщо вони не вчинили щиро, «нехай запалає поломє від Абимелеха та й пожере городян Сихемських й осадників Миллоських, і нехай запалає поломє від городян Сихемських й осадників Миллоських, та й жере Абимелеха!» Так і сталося: Авімелех зруйнував Сихем, і коли «осадники замку Сихемського» сховалися «в храмову твердиню Баалверита», він спалив її над ними. Дім Мілло і вежа Сихема, імовірно, той самий укріплений квартал; мапа пропонує обидва прочитання."
    - "Сихем — це Телль-Балата в Наблусі, який розкопували Ернст Селлін від 1913 року та експедиція Дж. Ернеста Райта в 1956–1964 рр. Його головною спорудою була фортеця-храм середньої бронзової доби, близько 1650 р. до н. е., зі стінами завтовшки понад п'ять метрів, зведена на штучному насипу над містом. Райт ототожнив пізнішу, меншу фазу її з храмом Ваал-Беріта з Суддів 9; Лоренс Стейджер стверджував, що сам великий храм ще використовувався за часів суддів, і було висловлено припущення, що «насип» Бет-Мілло — це його платформа. Другий «дім Мілло», де слуги вбили Йоаса, лежав в Єрусалимі і є іншим місцем."
    - "Нині фундаменти фортеці-храму, з відновленим перед ними стоячим каменем, — осередок археологічного парку Телль-Балата на східному краї Наблуса."
  es:
    - "Bet-milo, «la casa del relleno», era un barrio o fortaleza de Siquem en los días de Abimelec, el hijo de Gedeón. Después de matar a sus hermanos, «reunidos todos los de Sichêm con toda la casa de Millo, fueron y eligieron á Abimelech por rey, cerca de la llanura del pilar que estaba en Sichêm». Jotam, el hermano que escapó, terminó su fábula de los árboles con una maldición: si no habían obrado con verdad, «fuego salga de Abimelech, que consuma á los de Sichêm y á la casa de Millo; y fuego salga de los de Sichêm y de la casa de Millo, que consuma á Abimelech». Así sucedió: Abimelec destruyó Siquem, y cuando «todos los de la torre de Sichêm» se encerraron en «la fortaleza del templo del dios Berith», la incendió sobre ellos. La casa de Milo y la torre de Siquem son probablemente el mismo barrio fortificado; el mapa ofrece ambas lecturas."
    - "Siquem es Tell Balata, en Nablus, excavada por Ernst Sellin desde 1913 y por la expedición de G. Ernest Wright en 1956–1964. Su edificio dominante era un templo-fortaleza de la Edad del Bronce Medio, hacia 1650 a. C., con muros de más de cinco metros de espesor, levantado sobre un relleno artificial por encima de la ciudad. Wright identificó una fase posterior y más pequeña de él con el templo de Baal-berit de Jueces 9; Lawrence Stager ha sostenido que el gran templo mismo seguía en uso en tiempos de los jueces, y se ha sugerido que el «relleno» de Bet-milo es su plataforma. Una segunda «casa de Millo», donde los siervos de Joás lo asesinaron, estaba en Jerusalén y es un lugar distinto."
    - "Hoy los cimientos del templo-fortaleza, con una piedra erguida reerigida ante ellos, son la pieza central del parque arqueológico de Tell Balata, en el borde oriental de Nablus."
  pt:
    - "Bete-Milo, “a casa do aterro”, era um bairro ou fortaleza de Siquém nos dias de Abimeleque, filho de Gideão. Depois que ele matou os irmãos, “Todos os líderes de Siquém se reuniram com toda a casa de Milo, e foram e fizeram de Abimeleque rei, junto ao carvalho do pilar que estava em Siquém”. Jotão, o irmão que escapou, terminou sua fábula das árvores com uma maldição: “que saia fogo de Abimeleque e devore os líderes de Siquém e a casa de Milo; e que saia fogo dos líderes de Siquém e da casa de Milo e devore Abimeleque”. Assim sucedeu: Abimeleque destruiu Siquém, e quando todos os líderes da torre de Siquém “entraram na fortaleza do templo de El-Berite”, queimou-a sobre eles. A casa de Milo e a torre de Siquém são provavelmente o mesmo bairro fortificado; o mapa oferece as duas leituras."
    - "Siquém é Tell Balata, em Nablus, escavada por Ernst Sellin a partir de 1913 e pela expedição de G. Ernest Wright em 1956–1964. Seu edifício dominante era um templo-fortaleza do Bronze Médio, de cerca de 1650 a.C., com muros de mais de cinco metros de espessura, erguido sobre um aterro artificial acima da cidade. Wright identificou uma fase posterior e menor dele com o templo de Baal-Berite de Juízes 9; Lawrence Stager sustentou que o grande templo ainda estava em uso no tempo dos juízes, e sugeriu-se que o “aterro” de Bete-Milo seja a sua plataforma. Uma segunda “casa de Milo”, onde os servos de Joás o assassinaram, ficava em Jerusalém e é outro lugar."
    - "Hoje os alicerces do templo-fortaleza, com uma pedra erguida reposta diante deles, são o centro do parque arqueológico de Tell Balata, na borda oriental de Nablus."
  de:
    - "Bet-Millo, „das Haus der Aufschüttung“, war ein Viertel oder eine Feste Sichems zur Zeit Abimelechs, des Sohnes Gideons. Nachdem er seine Brüder getötet hatte, „versammelten sich alle Männer von Sichem und das ganze Haus Millo, gingen hin und machten Abimelech zum König bei der hohen Eiche, die zu Sichem steht“. Jotam, der entkommene Bruder, schloss seine Baumfabel mit einem Fluch: „so gehe Feuer aus von Abimelech und verzehre die Männer zu Sichem und das Haus Millo, und gehe auch Feuer aus von den Männern zu Sichem und vom Haus Millo und verzehre Abimelech“. So geschah es: Abimelech zerstörte Sichem, und als sich „alle Männer des Turms zu Sichem“ „in die Festung des Hauses des Gottes Berith“ einschlossen, verbrannte er sie darin. Das Haus Millo und der Turm von Sichem sind wohl dasselbe befestigte Viertel; die Karte bietet beide Lesungen."
    - "Sichem ist Tell Balata bei Nablus, von Ernst Sellin ab 1913 und von G. Ernest Wrights Expedition 1956–1964 ausgegraben. Sein beherrschendes Gebäude war ein Festungstempel der Mittelbronzezeit, um 1650 v. Chr., mit über fünf Meter dicken Mauern, auf einer künstlichen Aufschüttung über der Stadt errichtet. Wright setzte eine spätere, kleinere Phase mit dem Tempel des Baal-Berit aus Richter 9 gleich; Lawrence Stager hat vertreten, dass der große Tempel selbst zur Richterzeit noch in Gebrauch war, und man hat vermutet, die „Aufschüttung“ von Bet-Millo sei seine Plattform. Ein zweites „Haus Millo“, wo die Knechte des Joas ihn ermordeten, lag in Jerusalem und ist ein anderer Ort."
    - "Heute sind die Fundamente des Festungstempels, mit einem davor wiedererrichteten Standstein, der Mittelpunkt des archäologischen Parks Tell Balata am Ostrand von Nablus."
  fr:
    - "Beth-Millo, « la maison du remblai », était un quartier ou une forteresse de Sichem au temps d’Abimélec, fils de Gédéon. Après qu’il eut tué ses frères, « Tous les habitants de Sichem et toute la maison de Millo se rassemblèrent ; ils vinrent, et proclamèrent roi Abimélec, près du chêne planté dans Sichem ». Jotham, le frère qui échappa, termina sa fable des arbres par une malédiction : « Sinon, qu’un feu sorte d’Abimélec et dévore les habitants de Sichem et la maison de Millo, et qu’un feu sorte des habitants de Sichem et de la maison de Millo et dévore Abimélec ! » Ainsi advint-il : Abimélec détruisit Sichem, et quand « tous les habitants de la tour de Sichem » s’enfermèrent dans « la forteresse de la maison du dieu Berith », il l’incendia sur eux. Maison de Millo et tour de Sichem sont probablement le même quartier fortifié ; la carte offre les deux lectures."
    - "Sichem est Tell Balata à Naplouse, fouillé par Ernst Sellin à partir de 1913 et par l’expédition de G. Ernest Wright en 1956-1964. Son bâtiment dominant était une forteresse-temple de l’âge du Bronze moyen, vers 1650 av. J.-C., aux murs de plus de cinq mètres d’épaisseur, élevée sur un remblai artificiel au-dessus de la ville. Wright identifia une phase ultérieure plus petite au temple de Baal-Berith de Juges 9 ; Lawrence Stager a soutenu que le grand temple lui-même servait encore au temps des juges, et l’on a suggéré que le « remblai » de Beth-Millo en est la plateforme. Une seconde « maison de Millo », où les serviteurs de Joas l’assassinèrent, se trouvait à Jérusalem et est un autre lieu."
    - "Aujourd’hui les fondations de la forteresse-temple, avec une pierre dressée relevée devant elles, sont le centre du parc archéologique de Tell Balata, à la lisière est de Naplouse."
  it:
    - "Bet-Millo, «la casa del terrapieno», era un quartiere o roccaforte di Sichem ai giorni di Abimelech, figlio di Gedeone. Dopo che egli ebbe ucciso i suoi fratelli, «tutti i Sichemiti e tutta la casa di Millo si radunarono e andarono a proclamar re Abimelec, presso la quercia del monumento che si trova a Sichem». Iotam, il fratello scampato, concluse la sua favola degli alberi con una maledizione: «esca da Abimelec un fuoco, che divori i Sichemiti e la casa di Millo, ed esca dai Sichemiti e dalla casa di Millo un fuoco, che divori Abimelec!» Così avvenne: Abimelech distrusse Sichem, e quando «tutti gli abitanti della torre di Sichem» si chiusero «nel torrione del tempio di El-Berith», egli lo bruciò sopra di loro. La casa di Millo e la torre di Sichem sono probabilmente lo stesso quartiere fortificato; la carta offre entrambe le letture."
    - "Sichem è Tell Balata a Nablus, scavata da Ernst Sellin dal 1913 e dalla spedizione di G. Ernest Wright nel 1956–1964. Il suo edificio dominante era un tempio-fortezza del Bronzo Medio, intorno al 1650 a.C., con mura spesse più di cinque metri, innalzato su un terrapieno artificiale sopra la città. Wright identificò una fase posteriore e più piccola di esso con il tempio di Baal-Berit di Giudici 9; Lawrence Stager ha sostenuto che il grande tempio stesso fosse ancora in uso ai tempi dei giudici, ed è stato suggerito che il «terrapieno» di Bet-Millo sia la sua piattaforma. Una seconda «casa di Millo», dove i servi di Ioas lo assassinarono, sorgeva a Gerusalemme ed è un luogo diverso."
    - "Oggi le fondamenta del tempio-fortezza, con una pietra eretta rialzata davanti, sono il fulcro del parco archeologico di Tell Balata al margine orientale di Nablus."
  pl:
    - "Bet-Millo, „dom nasypu”, było dzielnicą lub twierdzą Sychem za dni Abimeleka, syna Gedeona. Gdy zabił swych braci, „zebrali się wszyscy mężowie Sychem, i wszystek dom Mello, a szedłszy obrali Abimelecha królem na równinie, kędy stał słup w Sychem”. Jotam, brat, który uszedł, zakończył swą bajkę o drzewach klątwą: jeśli nie postąpili uczciwie, „niechajże wynijdzie ogień z Abimelecha, a pożre męże Sychem, i dom Mello; niechajże też wynijdzie ogień od mężów Sychem, i z domu Mello, a pożre Abimelecha”. Tak się stało: Abimelek zniszczył Sychem, a gdy „wszyscy mężowie wieży Sychem” zamknęli się w „twierdzy domu boga Beryt”, spalił ją nad nimi. Dom Mello i wieża Sychem to prawdopodobnie ta sama obwarowana dzielnica; mapa podaje oba odczytania."
    - "Sychem to Tell Balata w Nablusie, kopany przez Ernsta Sellina od 1913 roku i przez wyprawę G. Ernesta Wrighta w latach 1956–1964. Jego dominującą budowlą była twierdza-świątynia ze średniej epoki brązu, z około 1650 r. p.n.e., z murami grubszymi niż pięć metrów, wzniesiona na sztucznym nasypie nad miastem. Wright utożsamił późniejszą, mniejszą jej fazę ze świątynią Baal-Beryt z Sdz 9; Lawrence Stager dowodził, że sama wielka świątynia była jeszcze w użyciu za czasów sędziów, i sugerowano, że „nasyp” Bet-Millo to jej platforma. Drugi „Betmello”, gdzie słudzy Joasza go zamordowali, leżał w Jerozolimie i jest innym miejscem."
    - "Dziś fundamenty twierdzy-świątyni, z postawionym przed nimi na nowo kamieniem stojącym, są głównym punktem parku archeologicznego Tell Balata na wschodnim skraju Nablusu."
  nl:
    - "Beth-Millo, “het huis van de vulling”, was een wijk of burcht van Sichem ten tijde van Gideons zoon Abimelech. Nadat hij zijn broers had gedood, “vergaderden zich alle burgeren van Sichem, en het ganse huis van Millo, en gingen heen en maakten Abimelech ten koning, bij den hogen eik, die bij Sichem is”. Jotam, de broer die ontkwam, besloot zijn boomfabel met een vloek bij onoprechtheid: “zo ga vuur uit van Abimelech, en vertere de burgers van Sichem, en het huis van Millo; en vuur ga uit van de burgers van Sichem, en van het huis van Millo, en vertere Abimelech!” Zo geschiedde het: Abimelech verwoestte Sichem, en toen “alle burgers des torens van Sichem” zich opsloten in “de sterkte, in het huis van den god Berith”, verbrandde hij die boven hen. Het huis van Millo en de toren van Sichem zijn waarschijnlijk dezelfde versterkte wijk; de kaart biedt beide lezingen."
    - "Sichem is Tell Balata bij Nablus, opgegraven door Ernst Sellin vanaf 1913 en door G. Ernest Wrights expeditie in 1956–1964. Zijn overheersende gebouw was een vesting-tempel uit de middenbronstijd, omstreeks 1650 v.Chr., met muren van meer dan vijf meter dik, opgetrokken op een kunstmatige vulling boven de stad. Wright identificeerde een latere, kleinere fase ervan met de tempel van Baäl-Berith uit Richteren 9; Lawrence Stager heeft betoogd dat de grote tempel zelf nog in gebruik was in de tijd van de richters, en er is geopperd dat de “vulling” van Beth-Millo zijn platform is. Een tweede “huis van Millo”, waar de dienaren van Joas hem vermoordden, lag in Jeruzalem en is een andere plaats."
    - "Tegenwoordig vormen de funderingen van de vesting-tempel, met een daarvoor opnieuw opgerichte staande steen, het middelpunt van het archeologisch park Tell Balata aan de oostrand van Nablus."
  cs:
    - "Bét-milo, „dům výplně“, byla čtvrť nebo pevnost Šekemu ve dnech Abimeleka, syna Gedeonova. Poté, co zabil své bratry, „shromáždili se všickni muži Sichemští i všecken dům Mello, i šli, a ustanovili sobě Abimelecha za krále na rovinách u sloupu, kterýž jest u Sichem“. Jotam, bratr, který unikl, zakončil svou báji o stromech kletbou: „Pakli nic, nechť vyjde oheň z Abimelecha a sžíře muže Sichemské i dům Mello, nechť vyjde také oheň od mužů Sichemských a z domu Mello a sžíře Abimelecha.“ Tak se stalo: Abimelek zničil Šekem, a když se „všickni muži věže Sichemské“ zavřeli do „hradu svého, chrámu boha Berit“, spálil jej nad nimi. Dům Milo a věž Šekemu jsou pravděpodobně táž opevněná čtvrť; mapa nabízí obě čtení."
    - "Šekem je Tell Balata u Nábulusu, vykopávaný Ernstem Sellinem od roku 1913 a výpravou G. Ernesta Wrighta v letech 1956–1964. Jeho převládající stavbou byla pevnost-chrám ze střední doby bronzové, asi z roku 1650 př. n. l., se zdmi tlustými přes pět metrů, vztyčená na umělé výplni nad městem. Wright ztotožnil její pozdější, menší fázi s chrámem Baal-beríta ze Soudců 9; Lawrence Stager tvrdil, že velký chrám byl ještě v době soudců používán, a bylo navrženo, že „výplň“ Bét-mila je jeho plošina. Druhý „dům Milo“, kde zabili Joaše jeho služebníci, ležel v Jeruzalémě a je jiným místem."
    - "Dnes jsou základy pevnosti-chrámu, s před nimi znovu vztyčeným stojícím kamenem, středobodem archeologického parku Tell Balata na východním okraji Nábulusu."
  sv:
    - "Bet-Millo, ”fyllningens hus”, var ett kvarter eller fäste i Shekem på Avimeleks, Gideons sons, tid. Sedan han hade dräpt sina bröder, ”församlade sig alla Sikems borgare och alla som bodde i Millo och gingo åstad och gjorde Abimelek till konung vid Vård-terebinten invid Sikem”. Jotam, brodern som slapp undan, avslutade sin fabel om träden med en förbannelse: om de inte hade handlat rätt, ”så må eld gå ut från Abimelek och förtära Sikems borgare och dem som bo i Millo, och från Sikems borgare och från dem som bo i Millo må eld gå ut och förtära Abimelek”. Så skedde: Avimelek förstörde Shekem, och när ”besättningen i Sikems torn” stängde in sig i ”det fasta valvet i El-Berits tempelbyggnad” brände han det över dem. Millos hus och Shekems torn är sannolikt samma befästa kvarter; kartan erbjuder båda läsningarna."
    - "Shekem är Tell Balata vid Nablus, utgrävd av Ernst Sellin från 1913 och av G. Ernest Wrights expedition 1956–1964. Dess dominerande byggnad var ett fästningstempel från mellersta bronsåldern, omkring 1650 f.Kr., med murar mer än fem meter tjocka, rest på en konstgjord fyllning ovanför staden. Wright identifierade en senare, mindre fas av den med Baal-Berits tempel i Domarboken 9; Lawrence Stager har hävdat att själva det stora templet ännu var i bruk på domarnas tid, och det har föreslagits att Bet-Millos ”fyllning” är dess plattform. Ett andra ”Millos hus”, där Joashs tjänare mördade honom, låg i Jerusalem och är en annan plats."
    - "I dag är fästningstemplets grundvalar, med en stående sten återrest framför, medelpunkten i den arkeologiska parken Tell Balata vid Nablus östra kant."
  nb:
    - "Bet-Millo, «fyllets hus», var et kvarter eller en festning i Sikem i dagene til Abimelek, Gideons sønn. Etter at han hadde drept brødrene sine, «samlet alle Sikems menn sig og alle de som bodde i Millo, og de gikk avsted og gjorde Abimelek til konge ved minnesmerkets ek i Sikem». Jotam, broren som slapp unna, avsluttet fabelen sin om trærne med en forbannelse: hvis de ikke hadde handlet oppriktig, «gå det ut ild fra Abimelek og fortære Sikems borgere og dem som bor i Millo, og ild fra Sikems menn og fra dem som bor i Millo, og fortære Abimelek». Slik gikk det: Abimelek ødela Sikem, og da «mennene i Sikems borg» gikk inn i «tårnet som hørte til El-Berits tempel», brente han det over dem. Millo-huset og Sikems tårn er trolig det samme befestede kvarteret; kartet tilbyr begge lesningene."
    - "Sikem er Tell Balata ved Nablus, gravd ut av Ernst Sellin fra 1913 og av G. Ernest Wrights ekspedisjon i 1956–1964. Dens dominerende bygning var et festningstempel fra mellombronsealder, omkring 1650 f.Kr., med murer på over fem meters tykkelse, reist på en kunstig fylling over byen. Wright identifiserte en senere, mindre fase av det med Baal-Berits tempel i Dommerboken 9; Lawrence Stager har hevdet at selve det store tempelet fortsatt var i bruk i dommertiden, og det er blitt antydet at «fyllet» i Bet-Millo er plattformen. Et annet «Millo-hus», der Joasjs tjenere myrdet ham, lå i Jerusalem og er et annet sted."
    - "I dag er grunnmurene til festningstempelet, med en stående stein reist foran dem, midtpunktet i den arkeologiske parken Tell Balata i østkanten av Nablus."
  tl:
    - "Ang Beth-millo, “bahay ng pagpuno”, ay distrito o kuta ng Sichem sa panahon ni Abimelech, anak ni Gedeon. Matapos niyang patayin ang kaniyang mga kapatid, “lahat ng mga lalake sa Sichem ay nagpupulong at ang buong sangbahayan ni Millo, at yumaon at ginawang hari si Abimelech sa tabi ng encina ng haliging nasa Sichem”. Tinapos ni Jotham, ang nakatakas na kapatid, ang pabula ng mga puno sa sumpa: kung hindi sila naging tapat, “labasan ng apoy si Abimelech, at pugnawin ang mga lalake sa Sichem, at ang sangbahayan ni Millo; at labasan ng apoy ang mga lalake sa Sichem… at pugnawin si Abimelech”. Gayon nga: winasak ni Abimelech ang Sichem, at nang magkulong “lahat ng mga lalake sa moog ng Sichem” sa “kuta ng bahay ng El-berith”, sinunog niya ito sa ibabaw nila. Marahil iisang kutang distrito ang bahay ni Millo at moog ng Sichem; parehong basa ang inaalok ng mapa."
    - "Ang Sichem ay ang Tell Balata sa Nablus, na hinukay ni Ernst Sellin mula 1913 at ng ekspedisyon ni G. Ernest Wright noong 1956–1964. Ang pangunahing gusali nito ay kutang-templo ng Gitnang Panahon ng Tanso, mga 1650 BK, na may pader na mahigit limang metro ang kapal, na itinayo sa artipisyal na tambak sa itaas ng lungsod. Kinilala ni Wright ang kalaunan, mas maliit na yugto nito bilang templo ni Baal-berith sa Mga Hukom 9; ipinagtanggol ni Lawrence Stager na ginagamit pa rin ang dakilang templo noong panahon ng mga hukom, at iminungkahing ang “tambak” ng Beth-millo ay ang plataporma nito. Ang ikalawang “bahay ni Millo”, kung saan pinaslang ng mga lingkod si Joas, ay nasa Jerusalem at ibang lugar."
    - "Ang mga saligan ng kutang-templo, na may batong nakatayo na muling itinayo sa harap nito, ang sentro ng liwasang arkeolohikal ng Tell Balata sa silangang gilid ng Nablus ngayon."
  da:
    - "Bet-Millo, »opfyldningens hus«, var et kvarter eller en borg i Sikem i Abimeleks, Gideons søns, dage. Efter at han havde dræbt sine brødre, »Og alle Mændene i Sikem og det ganske Millo Hus forsamledes og gik hen og gjorde Abimelek til Konge ved den Lund, som staar ved Sikem«. Jotam, broderen der slap bort, sluttede sin fabel om træerne med en forbandelse: hvis de ikke havde handlet troligt, »da udkomme Ild fra Abimelek og fortære Mændene i Sikem og Millo Hus; der udkomme og Ild fra Mændene i Sikem og af Millo Hus og fortære Abimelek!« Det gik således: Abimelek ødelagde Sikem, og da »alle Mændene i Taarnet i Sikem« lukkede sig inde i »Beriths Gudshuses Taarn«, brændte han det over dem. Millos hus og Sikems tårn er sandsynligvis det samme befæstede kvarter; kortet tilbyder begge læsninger."
    - "Sikem er Tell Balata ved Nablus, udgravet af Ernst Sellin fra 1913 og af G. Ernest Wrights ekspedition 1956–1964. Dens dominerende bygning var et fæstningstempel fra mellembronzealderen, omkring 1650 f.Kr., med mure på mere end fem meters tykkelse, rejst på en kunstig opfyldning over byen. Wright identificerede en senere, mindre fase af det med Ba'al-Berits tempel i Dommerbogen 9; Lawrence Stager har hævdet, at selve det store tempel stadig var i brug i dommernes tid, og det er blevet foreslået, at Bet-Millos »opfyldning« er dets platform. Et andet »Millos hus«, hvor Joas' tjenere myrdede ham, lå i Jerusalem og er et andet sted."
    - "I dag er fundamenterne af fæstningstemplet, med en stående sten genrejst foran, midtpunktet i den arkæologiske park Tell Balata i Nablus' østlige kant."
  sr:
    - "Вет-Мило, „дом насипа“, био је четврт или упориште Сихема у доба Авимелеха, сина Гедеоновог. Пошто је побио своју браћу, „Тада се скупише сви Сихемљани и сав дом Милов, и отидоше и поставише Авимелеха царем код храста који стоји у Сихему“. Јотам, брат који је побегао, завршио је своју басну о дрвећу клетвом: ако нису поступали право, „нека изиђе огањ од Авимелеха и спали Сихемљане и дом Милов, и нека изиђе огањ од Сихемљана и од дома Миловог и спали Авимелеха“. Тако се и догодило: Авимелех је разорио Сихем, а када су се „сви који беху у кули сихемској“ затворили у „кулу куће бога Верита“, спалио је кулу над њима. Дом Милов и кула сихемска вероватно су иста утврђена четврт; карта нуди оба читања."
    - "Сихем је Тел Балата код Наблуса, ископаван од Ернста Зелина од 1913. и експедиције Џ. Ернеста Рајта 1956–1964. Његова доминантна зграда била је тврђава-храм средњег бронзаног доба, око 1650. п. н. е., са зидовима дебљим од пет метара, подигнута на вештачком насипу изнад града. Рајт је каснију, мању фазу поистоветио с храмом Вал-Верита из Судија 9; Лоренс Стејџер је тврдио да је сам велики храм још био у употреби у доба судија, а предложено је да је „насип“ Вет-Мила његова платформа. Други „дом Милов“, где су слуге убиле Јоаса, лежао је у Јерусалиму и друго је место."
    - "Данас су темељи тврђаве-храма, са усправним каменом поново подигнутим пред њима, средишњи део археолошког парка Тел Балата на источном ободу Наблуса."
