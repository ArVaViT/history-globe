body:
  en:
    - "Abana is one of the two rivers of Damascus named by Naaman, and is generally identified with the Barada, the river that rises in the Anti-Lebanon north-west of the city, is fed by the great spring of Ain al-Fijeh, runs down the Barada gorge and then divides into channels that water the Ghouta, the oasis of Damascus. The Hebrew text writes Abana, but the reading tradition (the qere) has Amana, the name of a mountain of the Anti-Lebanon near the river's source. Greek writers called it the Chrysorrhoas, “gold-flowing”, and Strabo noted that it begins at the city and country of the Damascenes and is almost wholly used up in the conduits that irrigate the land around them."
    - "Naaman, commander of the army of the king of Syria, came to Elisha to be cured of leprosy and was told to wash seven times in the Jordan. Offended, he asked: “Are not Abana and Pharpar, rivers of Damascus, better than all the waters of Israel? may I not wash in them, and be clean? So he turned and went away in a rage.” His servants persuaded him, and he dipped himself seven times in the Jordan, “and his flesh came again like unto the flesh of a little child, and he was clean”. The Barada still flows through Damascus in Syria, but drought, the growth of the city and pollution have left it with little water for much of the year."
  ru:
    - "Авана — одна из двух рек Дамаска, названных Нееманом; её обычно отождествляют с Барадой, рекой, которая начинается в Антиливане к северо-западу от города, питается большим источником Эйн-эль-Фиджа, спускается ущельем Барады и затем расходится на каналы, орошающие Гуту, оазис Дамаска. Еврейский текст пишет Авана, но традиция чтения (кре) даёт Амана — имя горы Антиливана у истоков реки. Греческие авторы называли её Хрисорроа, «златоструйная», а Страбон отмечал, что она начинается у города и в земле дамаскинцев и почти целиком расходится по каналам, орошающим их землю."
    - "Нееман, военачальник царя Сирийского, пришёл к Елисею, чтобы исцелиться от проказы, и получил повеление омыться семь раз в Иордане. Оскорблённый, он спросил: «разве Авана и Фарфар, реки Дамасские, не лучше всех вод Израильских? разве я не мог бы омыться в них и очиститься? И оборотился и удалился в гневе». Слуги уговорили его, и он окунулся в Иордане семь раз, «и обновилось тело его, как тело малого ребенка, и очистился». Барада и сегодня течёт через Дамаск в Сирии, но засухи, рост города и загрязнение оставляют её почти без воды бо́льшую часть года."
  uk:
    - "Авана — одна з двох дамаських річок, названих Нааманом; її зазвичай ототожнюють із Барадою, що бере початок в Антилібані на північний захід від міста, живиться великим джерелом Айн-ель-Фіджа, збігає ущелиною Баради, а далі розходиться на рукави, які зрошують Гуту, оазу Дамаска. Єврейський текст пише «Авана», але традиція читання (кере) має «Амана» — назву гори в Антилібані біля витоку річки. Грецькі автори називали її Хрисорроас, «золототечна», а Страбон зауважив, що вона починається від міста й країни дамаскинців і майже вся йде в канали, якими зрошують землю навколо них."
    - "Нааман, воєначальник війська сирійського царя, прийшов до Єлисея, щоб той вилікував його від прокази, і почув, що має сім разів обмитися в Йордані. Скривджений, він спитав: «Чи то ж ріки Дамаські, Абана та Фарфар не лучші, нїж води в Йорданї? Хиба ж менї не можна було б викупатись у них та й очиститись? От і одвернувся й відойшов в гнїві.» Слуги вмовили його, і він сім разів занурився в Йордані, «й осьвіжіло тїло його, як у молодого хлопця, і він очистивсь». Барада й досі тече крізь Дамаск у Сирії, але посуха, ріст міста й забруднення лишили їй мало води на більшу частину року."
  es:
    - "Abana es uno de los dos ríos de Damasco que nombra Naamán, y se identifica por lo general con el Barada, río que nace en el Antilíbano, al noroeste de la ciudad, se alimenta del gran manantial de Ain al-Fijeh, desciende por la garganta del Barada y luego se divide en canales que riegan la Guta, el oasis de Damasco. El texto hebreo escribe Abana, pero la tradición de lectura (el qere) tiene Amana, nombre de una montaña del Antilíbano cercana a las fuentes del río. Los autores griegos lo llamaban Crisórroas, «el de corrientes de oro», y Estrabón observó que empieza en la ciudad y el país de los damascenos y se agota casi por completo en los canales que riegan la tierra de alrededor."
    - "Naamán, jefe del ejército del rey de Siria, acudió a Eliseo para curarse de la lepra y se le dijo que se lavase siete veces en el Jordán. Ofendido, preguntó: «Abana y Pharphar, ríos de Damasco, ¿no son mejores que todas las aguas de Israel? Si me lavare en ellos, ¿no seré también limpio? Y volvióse, y fuése enojado». Sus siervos lo persuadieron, y se zambulló siete veces en el Jordán, «y su carne se volvió como la carne de un niño, y fué limpio». El Barada sigue corriendo por Damasco, en Siria, pero la sequía, el crecimiento de la ciudad y la contaminación lo dejan con poca agua durante buena parte del año."
  pt:
    - "Abana é um dos dois rios de Damasco mencionados por Naamã e é geralmente identificado com o Barada, que nasce no Antilíbano, a noroeste da cidade, é alimentado pela grande nascente de Ain al-Fijeh, desce pela garganta do Barada e então se divide em canais que irrigam o Ghouta, o oásis de Damasco. O texto hebraico escreve Abana, mas a tradição de leitura (o qere) traz Amana, nome de um monte do Antilíbano perto da nascente do rio. Os autores gregos o chamavam Crisórroas, “que corre ouro”, e Estrabão observou que ele começa na cidade e no território dos damascenos e é quase todo consumido nos canais que irrigam a terra ao redor."
    - "Naamã, comandante do exército do rei da Síria, foi a Eliseu para ser curado da lepra e recebeu a ordem de lavar-se sete vezes no Jordão. Ofendido, perguntou: “Não são Abana e Farfar, os rios de Damasco, melhores do que todas as águas de Israel? Não poderia eu me lavar neles e ficar limpo?” Então se virou e foi embora enfurecido. Seus servos o persuadiram, e ele mergulhou sete vezes no Jordão, “e a sua carne foi restaurada como a carne de uma criança pequena, e ele ficou limpo”. O Barada ainda corre por Damasco, na Síria, mas a seca, o crescimento da cidade e a poluição deixaram-no com pouca água durante boa parte do ano."
  de:
    - "Abana ist einer der beiden Flüsse von Damaskus, die Naaman nennt, und wird gewöhnlich mit dem Barada gleichgesetzt, der im Antilibanon nordwestlich der Stadt entspringt, von der großen Quelle Ain al-Fidscheh gespeist wird, durch die Baradaschlucht hinabfließt und sich dann in Kanäle teilt, die die Ghuta, die Oase von Damaskus, bewässern. Der hebräische Text schreibt Abana, die Lesetradition (das Qere) aber Amana, den Namen eines Berges im Antilibanon nahe der Quelle des Flusses. Griechische Autoren nannten ihn Chrysorrhoas, „Goldstrom“, und Strabon bemerkte, dass er bei der Stadt und dem Land der Damaszener beginnt und fast ganz in den Kanälen aufgebraucht wird, die das umliegende Land bewässern."
    - "Naaman, der Heerführer des Königs von Syrien, kam zu Elisa, um vom Aussatz geheilt zu werden, und sollte siebenmal im Jordan baden. Gekränkt fragte er: „Sind nicht die Wasser Amana und Pharphar zu Damaskus besser denn alle Wasser in Israel, daß ich mich darin wüsche und rein würde? Und wandte sich und zog weg mit Zorn.“ Seine Knechte überredeten ihn, und er tauchte siebenmal in den Jordan, „und sein Fleisch ward wieder erstattet wie das Fleisch eines jungen Knaben, und er ward rein“. Der Barada fließt noch heute durch Damaskus in Syrien, doch Dürre, das Wachstum der Stadt und Verschmutzung lassen ihm den größten Teil des Jahres über nur wenig Wasser."
  fr:
    - "L’Abana est l’un des deux fleuves de Damas cités par Naaman ; on l’identifie généralement avec le Barada, qui naît dans l’Anti-Liban, au nord-ouest de la ville, est alimenté par la grande source d’Aïn al-Fijeh, descend les gorges du Barada puis se divise en canaux qui arrosent la Ghouta, l’oasis de Damas. Le texte hébreu écrit Abana, mais la tradition de lecture (le qéré) porte Amana, nom d’une montagne de l’Anti-Liban près de la source du fleuve. Les auteurs grecs l’appelaient Chrysorrhoas, « qui coule en or », et Strabon notait qu’il naît à la ville et au pays des Damascènes et qu’il est presque entièrement absorbé par les canaux qui irriguent leurs terres."
    - "Naaman, chef de l’armée du roi de Syrie, vint trouver Élisée pour être guéri de la lèpre et reçut l’ordre de se laver sept fois dans le Jourdain. Offensé, il dit : « Les fleuves de Damas, l’Abana et le Parpar, ne valent-ils pas mieux que toutes les eaux d’Israël ? Ne pourrais-je pas m’y laver et devenir pur ? Et il s’en retournait et partait avec fureur. » Ses serviteurs le persuadèrent, et il se plongea sept fois dans le Jourdain, « et sa chair redevint comme la chair d’un jeune enfant, et il fut pur ». Le Barada traverse encore Damas, en Syrie, mais la sécheresse, la croissance de la ville et la pollution l’ont laissé presque à sec pendant une bonne partie de l’année."
  it:
    - "L’Abana è uno dei due fiumi di Damasco nominati da Naaman e si identifica in genere con il Barada, il fiume che nasce nell’Antilibano a nord-ovest della città, è alimentato dalla grande sorgente di Ain al-Fijeh, scende per la gola del Barada e poi si divide in canali che irrigano la Ghuta, l’oasi di Damasco. Il testo ebraico scrive Abana, ma la tradizione di lettura (il qere) ha Amana, nome di un monte dell’Antilibano presso la sorgente del fiume. Gli autori greci lo chiamavano Crisorroa, «che scorre oro», e Strabone osservava che nasce presso la città e il territorio dei Damasceni e viene quasi tutto consumato dai canali che irrigano la terra intorno."
    - "Naaman, comandante dell’esercito del re di Siria, andò da Eliseo per essere guarito dalla lebbra e si sentì dire di lavarsi sette volte nel Giordano. Offeso, domandò: «I fiumi di Damasco, l’Abanah e il Farpar, non son essi migliori di tutte le acque d’Israele? Non posso io lavarmi in quelli ed esser mondato?» E, voltatosi, «se n’andava infuriato». I suoi servi lo persuasero e si tuffò sette volte nel Giordano, e «la sua carne tornò come la carne d’un piccolo fanciullo, e rimase puro». Il Barada scorre ancora attraverso Damasco, in Siria, ma siccità, crescita della città e inquinamento lo lasciano con poca acqua per gran parte dell’anno."
  nl:
    - "Abana is een van de twee rivieren van Damascus die Naäman noemt, en wordt algemeen vereenzelvigd met de Barada, de rivier die ten noordwesten van de stad in de Anti-Libanon ontspringt, gevoed wordt door de grote bron van Ain al-Fijeh, door de kloof van de Barada stroomt en zich daarna in kanalen verdeelt die de Ghouta, de oase van Damascus, bewateren. De Hebreeuwse tekst schrijft Abana, maar de leestraditie (de qere) heeft Amana, de naam van een berg van de Anti-Libanon bij de bron van de rivier. Griekse schrijvers noemden haar de Chrysorrhoas, ‘goudstromend’, en Strabo merkte op dat zij begint bij de stad en het land van de Damascenen en bijna geheel opgaat in de kanalen die het land rondom hen bevloeien."
    - "Naäman, de bevelhebber van het leger van de koning van Syrië, kwam bij Elisa om van melaatsheid genezen te worden en kreeg de opdracht zich zevenmaal in de Jordaan te wassen. Gekrenkt vroeg hij: “Zijn niet Abana en Farpar, de rivieren van Damaskus, beter dan alle wateren van Israel; zou ik mij in die niet kunnen wassen en rein worden? Zo wendde hij zich, en toog weg met grimmigheid.” Zijn knechten haalden hem over, en hij doopte zich zevenmaal in de Jordaan, “en zijn vlees kwam weder, gelijk het vlees van een kleinen jongen; en hij werd rein”. De Barada stroomt nog steeds door Damascus in Syrië, maar droogte, de groei van de stad en vervuiling hebben haar het grootste deel van het jaar met weinig water achtergelaten."
  pl:
    - "Abana to jedna z dwóch rzek Damaszku wymienionych przez Naamana; zwykle utożsamia się ją z Baradą, rzeką, która wypływa na północny zachód od miasta w Antylibanie, zasila ją wielkie źródło Ajn al-Fidża, płynie wąwozem Barady, po czym rozdziela się na kanały nawadniające Ghutę, oazę Damaszku. Tekst hebrajski ma Abana, lecz tradycja czytania (qere) podaje Amana, nazwę góry w Antylibanie w pobliżu źródeł rzeki. Pisarze greccy nazywali ją Chrysorroas, „złotopłynną”, a Strabon zauważył, że zaczyna się ona w mieście i kraju Damasceńczyków i prawie cała zużywana jest w kanałach nawadniających okoliczne ziemie."
    - "Naaman, wódz wojska króla Syrii, przyszedł do Elizeusza, by uzdrowić się z trądu, i usłyszał, że ma siedem razy obmyć się w Jordanie. Obrażony zapytał: „Azaż nie lepsze są rzeki Abana i Farfar w Damaszku nad wszystkie wody Izraelskie? izalibym się niemógł w nich omyć, abym się oczyścił! A tak obróciwszy się, odjeżdżał z gniewem”. Słudzy go przekonali i zanurzył się siedem razy w Jordanie, „i stało się ciało jego, jako ciało dziecięcia małego, i oczyszczony jest”. Barada nadal płynie przez Damaszek w Syrii, lecz susza, rozrost miasta i zanieczyszczenie sprawiają, że przez znaczną część roku niesie niewiele wody."
  cs:
    - "Abana je jedna ze dvou damašských řek, které jmenuje Námán, a obvykle se ztotožňuje s Baradou, řekou pramenící v Antilibanonu severozápadně od města; napájí ji velký pramen Ajn al-Fídža, protéká soutěskou Barada a pak se větví do kanálů zavlažujících Gútu, damašskou oázu. Hebrejský text píše Abana, ale tradice čtení (qere) má Amana, jméno hory v Antilibanonu u pramene řeky. Řečtí autoři ji nazývali Chrysorrhoás, „zlatotoká“, a Strabón poznamenal, že začíná u města a země Damašských a téměř celá se spotřebuje v kanálech, jimiž se zavlažuje okolní země."
    - "Námán, velitel vojska syrského krále, přišel k Elíšovi, aby byl uzdraven z malomocenství, a bylo mu řečeno, aby se sedmkrát umyl v Jordánu. Uražen se zeptal: „Zdali nejsou lepší Abana a Farfar, řeky Damašské, nad všecky vody Izraelské? Zdaliž bych se nemohl v nich zmýti, abych čist byl? A obrátiv se, jel s hněvem.“ Jeho služebníci ho přemluvili a on se v Jordánu sedmkrát ponořil a „učiněno jest tělo jeho jako tělo dítěte malého, a očištěn jest“. Barada protéká Damaškem v Sýrii dodnes, ale sucho, růst města a znečištění jí na velkou část roku nechávají jen málo vody."
  sv:
    - "Avana är en av de två floderna i Damaskus som Naaman nämner, och identifieras vanligen med Barada, floden som har sitt ursprung i Antilibanon nordväst om staden, matas av den stora källan Ajin al-Fijeh, rinner genom Baradaravinen och sedan delar sig i kanaler som vattnar Ghouta, Damaskus oas. Den hebreiska texten skriver Avana, men läsetraditionen (qere) har Amana, namnet på ett berg i Antilibanon nära flodens källa. Grekiska författare kallade den Chrysorrhoas, ”guldflödande”, och Strabon antecknade att den börjar vid damaskenernas stad och land och nästan helt förbrukas i de kanaler som bevattnar landet runt dem."
    - "Naaman, härhövitsman för Syriens kung, kom till Elisha för att botas från spetälska och fick veta att han skulle bada sju gånger i Jordan. Förolämpad frågade han: ”Äro icke Damaskus’ floder, Abana och Parpar, bättre än alla vatten Israel? Då kunde jag ju lika gärna bada mig i dem för att bliva ren. Så vände han om och for sin väg i vrede.” Hans tjänare övertalade honom, och han doppade sig sju gånger i Jordan, ”och hans kött blev då åter sig likt, friskt såsom en ung gosses kött, och han blev ren”. Barada rinner ännu genom Damaskus i Syrien, men torka, stadens tillväxt och föroreningar har lämnat den med lite vatten under stora delar av året."
  nb:
    - "Abana er en av de to elvene i Damaskus som Naaman nevner, og den identifiseres vanligvis med Barada, elven som har sitt utspring i Anti-Libanon nordvest for byen, mates av den store kilden Ajin al-Fidsje, renner ned gjennom Baradakløften og deler seg så i kanaler som vanner Ghuta, oasen ved Damaskus. Den hebraiske teksten skriver Abana, men lesetradisjonen (qere) har Amana, navnet på et fjell i Anti-Libanon nær elvens kilde. Greske forfattere kalte den Krysorroas, «gullstrømmende», og Strabon bemerket at den begynner ved byen og landet til damaskenerne og nesten helt går med i kanalene som vanner jorden rundt dem."
    - "Naaman, sjef for hæren til kongen av Syria, kom til Elisja for å bli helbredet for spedalskhet og fikk beskjed om å bade syv ganger i Jordan. Fornærmet spurte han: «Er ikke elvene ved Damaskus, Abana og Parpar, bedre enn alle Israels vann? Kunde jeg ikke bade mig i dem og bli ren? Og han vendte om og drog bort i vrede.» Tjenerne overtalte ham, og han dukket seg syv ganger i Jordan, «og hans kjøtt blev friskt som på en liten gutt, og han blev ren». Barada renner fortsatt gjennom Damaskus i Syria, men tørke, byens vekst og forurensning har gitt den lite vann store deler av året."
  tl:
    - "Ang Abana ay isa sa dalawang ilog ng Damasco na binanggit ni Naaman, at karaniwang itinutumbas sa Barada, ang ilog na bumubukal sa Anti-Libano sa hilagang-kanluran ng lungsod, pinapakain ng malaking bukal ng Ain al-Fijeh, bumababa sa bangin ng Barada, at saka nahahati sa mga daluyan na nagdidilig sa Ghouta, ang oasis ng Damasco. Abana ang nakasulat sa tekstong Hebreo, ngunit Amana ang basa ng tradisyon ng pagbasa (ang qere), ang pangalan ng isang bundok ng Anti-Libano malapit sa pinagmulan ng ilog. Tinawag ito ng mga manunulat na Griyego na Chrysorrhoas, “umaagos na ginto”, at binanggit ni Strabo na nagsisimula ito sa lungsod at lupain ng mga taga-Damasco at halos lubusang nauubos sa mga padaluyang nagpapatubig sa nakapaligid na lupain."
    - "Si Naaman, punong kawal ng hukbo ng hari sa Siria, ay lumapit kay Eliseo upang gumaling sa ketong at pinaligo siya sa Jordan nang pitong ulit. Nagalit siya at nagtanong: “Hindi ba ang Abana at ang Pharphar, na mga ilog ng Damasco, ay mainam kay sa lahat ng tubig sa Israel? hindi ba ako makapaliligo sa mga yaon, at maging malinis? Sa gayo'y pumihit siya at umalis sa paginit.” Hinikayat siya ng kaniyang mga lingkod, at sumugbo siya nang pitong ulit sa Jordan, “at ang kaniyang laman ay nagsauling gaya ng laman ng isang munting bata, at siya'y naging malinis”. Dumadaloy pa rin ang Barada sa Damasco sa Siria, ngunit dahil sa tagtuyot, paglaki ng lungsod at polusyon, kakaunti na lamang ang tubig nito sa halos buong taon."
  da:
    - "Abana er en af de to floder i Damaskus, som Na'aman nævner, og identificeres almindeligvis med Barada, floden, der udspringer i Anti-Libanon nordvest for byen, fødes af den store kilde Ain al-Fijeh, løber ned gennem Baradas slugt og derefter deler sig i kanaler, der vander Ghuta, Damaskus' oase. Den hebraiske tekst skriver Abana, men læsetraditionen (qere) har Amana, navnet på et bjerg i Anti-Libanon nær flodens udspring. Græske forfattere kaldte den Chrysorrhoas, »den guldstrømmende«, og Strabon bemærkede, at den begynder ved damaskenernes by og land og næsten helt opbruges i de render, der vander jorden omkring dem."
    - "Na'aman, den syriske konges hærfører, kom til Elisa for at blive helbredt for spedalskhed og fik besked om at bade syv gange i Jordan. Fornærmet spurgte han: »Ere ikke Floderne Abana og Farfar i Damaskus bedre, end alle Vandene i Israel? kunde jeg ikke to mig i dem og blive ren? Og han vendte sig og drog bort med Vrede.« Hans tjenere fik overtalt ham, og han dyppede sig syv gange i Jordan, »og hans Kød blev igen ligesom en liden Drengs Kød, og han blev ren«. Barada løber stadig gennem Damaskus i Syrien, men tørke, byens vækst og forurening har gjort den næsten vandløs store dele af året."
  sr:
    - "Авана је једна од две реке Дамаска које помиње Наман; обично се поистовећује са Барадом, реком која извире у Антиливану северозападно од града, храни се великим извором Ајн ал-Фиџе, тече кроз клисуру Бараде и затим се дели на токове који натапају Гуту, оазу Дамаска. Хебрејски текст пише Авана, али традиција читања (кере) има Амана, име једне планине у Антиливану код извора реке. Грчки писци звали су је Хрисороа, „златотока“, а Страбон је забележио да почиње код града и у земљи Дамашћана и да се готово сва троши у каналима који натапају околну земљу."
    - "Наман, заповедник војске цара сиријског, дошао је Јелисију да се излечи од губе и речено му је да се седам пута окупа у Јордану. Увређен, упитао је: „Нису ли Авана и Фарфар воде у Дамаску боље од свих вода израиљских? Не бих ли се могао у њима окупати и очистити? И окренувши се отиде гневан.“ Слуге су га придобиле и он је седам пута зарони у Јордан, „и тело његово поста као у малог детета, и очисти се“. Барада и данас протиче кроз Дамаск у Сирији, али суша, раст града и загађење остављају је без много воде већим делом године."
