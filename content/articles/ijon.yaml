# Overview article (ADR 0007). Mainstream facts only; Tell Dibbin is given as the usual identification, resting on the name of the plain; the Assyrian date follows the eponym chronology; the three Synodal spellings are noted.
id: ijon
place: a062b95
title:
  en: "Ijon"
  ru: "Ион"
  uk: "Іййон"
  es: "Ijón"
  pt: "Ijom"
  de: "Ijon"
  fr: "Ijjon"
