body:
  en:
    - "Ijon was the northernmost town of Israel, in the small upland plain north of the Hula valley between the Litani and the Hasbani, which still bears its name as Marj Ayun, “the meadow of springs”. It guarded the road from Dan north toward the Beqaa and Damascus, and it is named only when invaders came down that road. Early in the ninth century BC Ben-hadad of Damascus, hired by Asa of Judah against Baasha of Israel, sent his captains “and smote Ijon, and Dan, and Abel-beth-maachah, and all Cinneroth, with all the land of Naphtali”; the Chronicler repeats the story with Abel-maim for Abel-beth-maacah. In 733–732 BC “came Tiglath-pileser king of Assyria, and took Ijon, and Abel-beth-maachah, and Janoah, and Kedesh, and Hazor, and Gilead, and Galilee, all the land of Naphtali, and carried them captive to Assyria”. The Synodal Bible spells the name three ways, Ain, Ion and Iyon."
    - "The Assyrian king's own annals list the towns of Galilee he took, but the passage is broken and Ijon is not preserved in it. The site is usually taken to be Tell Dibbin, a mound in the plain near the town of Marjayoun whose surroundings keep the ancient name; nothing found there names it, and the identification rests on the name of the plain and the lie of the road. Apart from Josephus, who repeats the story of Ben-hadad's raid and names Ijon among the towns burned or plundered (Jewish Antiquities 8.305), no later writer names it."
    - "The plain is today in the Nabatieh governorate of southern Lebanon, a few kilometres from the Israeli border, with the largely Christian town of Marjayoun and the villages of Dibbine and Khiam; the mound stands among its fields."
  ru:
    - "Ион был самым северным городом Израиля, на небольшой нагорной равнине к северу от долины Хула между Литани и Хасбани, которая до сих пор носит его имя — Мардж-Аюн, «луг источников». Он стерёг дорогу от Дана и Авел-Беф-Маахи на север к Бекаа и Дамаску, и назван он только тогда, когда по этой дороге приходили захватчики. В начале IX века до н. э. Венадад Дамасский, нанятый Асой Иудейским против Ваасы Израильского, послал военачальников, «и поразил Аин и Дан и Авел-Беф-Мааху и весь Киннероф, по всей земле Неффалима»; летописец повторяет рассказ с Авелмаимом вместо Авел-Беф-Маахи. В 733–732 гг. до н. э. «пришел Феглаффелласар, царь Ассирийский, и взял Ион, Авел-Беф-Мааху, и Ианох, и Кедес, и Асор, и Галаад, и Галилею, всю землю Неффалимову, и переселил их в Ассирию». Синодальный перевод пишет имя тремя способами: Аин, Ион и Ийон."
    - "Собственные анналы ассирийского царя перечисляют взятые им города Галилеи, но место повреждено, и Ион в нём не сохранился. Местом обычно считают Телль-Диббине, холм на равнине близ города Марджаюн, чьи окрестности сохраняют древнее имя; ничто найденное там не называет его имени, и отождествление держится на имени равнины и на ходе дороги. Кроме Иосифа Флавия, который пересказывает историю набега Венадада и называет Ион среди сожжённых или разграбленных городов («Иудейские древности» 8.305), никто из позднейших писателей его не называет."
    - "Равнина сегодня лежит в провинции Набатия на юге Ливана, в нескольких километрах от израильской границы, с преимущественно христианским городом Марджаюн и деревнями Диббине и Хиям; холм стоит среди их полей."
  uk:
    - "Іййон був найпівнічнішим містом Ізраїлю, у малій височинній рівнині на північ від долини Хула між Літані та Хасбані, яка досі носить його назву як Мардж-Аюн, «лука джерел». Він сторожував дорогу від Дана на північ до Бекаа і Дамаска, і його називають лише тоді, коли загарбники спускалися цією дорогою. На початку IX ст. до н. е. Бен-Гадад Дамаський, найнятий Асою Юдейським проти Вааси Ізраїльського, послав своїх начальників проти ізраїльських міст, і тоді «звоював Анн і Дан і Абел-Бет-Мааху й увесь Киннерот, — всю землю Нефталїєву»; літописець повторює історію з Авелмаїмом замість Авел-Бет-Мааху. 733–732 рр. до н. е. «прийшов Теглатфелласар, царь Ассирийський, і звоював Йон, Абел-бет-Мааху, Янох, Кедес і Асор, Галаад і Галилею, усю землю Нефталїєву, та й одвів їх в Ассирию». Синодальна Біблія пише цю назву трьома способами: Аїн, Іон та Ійон."
    - "Власні аннали ассирійського царя перелічують галілейські міста, які він узяв, але уривок пошкоджений, і Іййон у ньому не зберігся. Місце зазвичай ототожнюють з Телль-Діббіном, городищем на рівнині поблизу міста Мардж-Аюн, околиці якого зберігають давню назву; ніщо знайдене там не називає його, і ототожнення спирається на назву рівнини та розташування дороги. Крім Йосифа Флавія, який переказує історію набігу Бен-Гадада й називає Іййон серед спалених або пограбованих міст («Юдейські старожитності» 8.305), жоден пізніший автор його не називає."
    - "Рівнина нині лежить у провінції Набатія на півдні Лівану, за кілька кілометрів від ізраїльського кордону, з переважно християнським містом Мардж-Аюн і селами Діббіне та Хіям; городище стоїть серед його полів."
  es:
    - "Ijón era la población más septentrional de Israel, en la pequeña llanura alta al norte del Huleh, entre el Litani y el Hasbani, que aún se llama Marj Ayun, «la pradera de las fuentes». Guardaba el camino de Dan hacia el norte, a la Becá y Damasco, y se nombra solo cuando por él bajaban invasores. A comienzos del siglo IX a. C. Ben-adad de Damasco, contratado por Asa de Judá contra Baasa de Israel, envió a sus capitanes contra ciudades de Israel, y «hirió á Ahión, y á Dan, y á Abel-beth-maachâ, y á toda Cinneroth, con toda la tierra de Nephtalí»; el Cronista la repite con Abel-maim en vez de Abel-bet-maaca. En 733–732 a. C. «vino Tiglath-pileser rey de los Asirios, y tomó á Ahión, Abel-beth-maachâ, y Janoa, y Cedes, y Asor, y Galaad, y Galilea, y toda la tierra de Nephtalí; y trasportólos á Asiria». La Biblia sinodal lo escribe de tres maneras, Ain, Ion e Iyon."
    - "Los propios anales del rey asirio enumeran las ciudades de Galilea que tomó, pero el pasaje está roto y Ijón no se conserva en él. El sitio suele tomarse por Tell Dibbin, un montículo en la llanura cerca de la ciudad de Marjayoun, cuyos alrededores conservan el nombre antiguo; nada de lo hallado allí lo nombra, y la identificación se apoya en el nombre de la llanura y en el trazado del camino. Aparte de Josefo, que repite la historia de la incursión de Ben-adad y nombra Ijón entre las ciudades quemadas o saqueadas (Antigüedades judías 8.305), ningún escritor posterior la nombra."
    - "La llanura se halla hoy en la gobernación de Nabatieh, en el sur del Líbano, a pocos kilómetros de la frontera israelí, con la ciudad de mayoría cristiana de Marjayoun y las aldeas de Dibbine y Khiam; el montículo se alza entre sus campos."
  pt:
    - "Ijom era a cidade mais setentrional de Israel, na pequena planície alta ao norte do vale do Hula, entre o Litani e o Hasbani, que ainda guarda o seu nome como Marj Ayun, “o prado das fontes”. Guardava a estrada de Dã para o norte, rumo a Beca e Damasco, e só é nomeada quando invasores desciam por ela. No início do século IX a.C., Ben-Hadade de Damasco, contratado por Asa de Judá contra Baasa de Israel, enviou seus comandantes contra as cidades de Israel, e “atacou Ijom, Dã, Abel-Bete-Maaca, e toda Quinerete, com toda a terra de Naftali”; o cronista repete a história com Abel-Maim em lugar de Abel-Bete-Maacá. Em 733–732 a.C., “Tiglate-Pileser, rei da Assíria, veio e tomou Ijom, Abel-Bete-Maaca, Janoa, Quedes, Hazor, Gileade e a Galileia, toda a terra de Naftali; e os levou cativos para a Assíria”. A Bíblia Sinodal escreve o nome de três modos, Ain, Ion e Iyon."
    - "Os próprios anais do rei assírio listam as cidades da Galileia que tomou, mas a passagem está quebrada e Ijom não se conservou nela. O sítio é usualmente tomado como Tell Dibbin, um monte na planície perto da cidade de Marjayoun, cujos arredores guardam o antigo nome; nada achado ali o nomeia, e a identificação repousa no nome da planície e no traçado da estrada. Além de Josefo, que repete a história da incursão de Ben-Hadade e nomeia Ijom entre as cidades queimadas ou saqueadas (Antiguidades Judaicas 8.305), nenhum escritor posterior a nomeia."
    - "A planície fica hoje na província de Nabatieh, no sul do Líbano, a poucos quilômetros da fronteira com Israel, com a cidade em grande parte cristã de Marjayoun e as aldeias de Dibbine e Khiam; o monte se ergue entre os seus campos."
  de:
    - "Ijon war die nördlichste Stadt Israels, in der kleinen Hochebene nördlich des Hulatals zwischen Litani und Hasbani, die als Mardsch Ujun, „Wiese der Quellen“, den Namen bewahrt. Es sicherte die Straße von Dan nordwärts Richtung Bekaa und Damaskus und wird nur genannt, wenn Eindringlinge sie herabkamen. Im frühen 9. Jahrhundert v. Chr. sandte Ben-Hadad von Damaskus, von Asa von Juda gegen Baesa gedungen, seine Hauptleute, und er „schlug Ijon und Dan und Abel-Beth-Maacha, das ganze Kinneroth samt dem Lande Naphthali“; der Chronist erzählt es mit Abel-Maim statt Abel-Bet-Maacha. 733–732 v. Chr. „kam Thiglath-Pileser, der König von Assyrien, und nahm Ijon, Abel-Beth-Maacha, Janoah, Kedes, Hazor, Gilead und Galiläa, das ganze Land Naphthali, und führte sie weg nach Assyrien“. Die Synodalübersetzung schreibt den Namen dreifach: Ain, Ion, Iyon."
    - "Die eigenen Annalen des assyrischen Königs verzeichnen die galiläischen Städte, die er nahm, doch die Stelle ist abgebrochen, und Ijon ist darin nicht erhalten. Die Stätte wird meist mit Tell Dibbin gleichgesetzt, einem Hügel in der Ebene bei der Stadt Mardschajun, deren Umgebung den antiken Namen bewahrt; nichts dort Gefundenes nennt ihn, und die Gleichsetzung beruht auf dem Namen der Ebene und dem Verlauf der Straße. Außer Josephus, der die Geschichte von Ben-Hadads Raubzug wiederholt und Ijon unter den verbrannten oder geplünderten Städten nennt (Jüdische Altertümer 8.305), nennt es kein späterer Schriftsteller."
    - "Die Ebene liegt heute im Gouvernement Nabatija im Südlibanon, wenige Kilometer von der israelischen Grenze, mit der überwiegend christlichen Stadt Mardschajun und den Dörfern Dibbine und Chiam; der Hügel steht zwischen ihren Feldern."
  fr:
    - "Ijjon était la ville la plus au nord d’Israël, dans la petite plaine d’altitude au nord de la Houla, entre le Litani et le Hasbani, qui le garde sous la forme Marj Ayun, « le pré des sources ». Elle gardait la route de Dan vers le nord, en direction de la Bekaa et de Damas, et n’est nommée que lorsque des envahisseurs la descendirent. Au début du IXe siècle av. J.-C., Ben-Hadad de Damas, loué par Asa de Juda contre Baescha d’Israël, envoya ses chefs, et « il battit Ijjon, Dan, Abel-Beth-Maaca, tout Kinneroth, et tout le pays de Nephthali » ; le Chroniqueur la répète avec Abel-Maïm pour Abel-Beth-Maaca. En 733–732 av. J.-C., « Tiglath-Piléser, roi d’Assyrie, vint et prit Ijjon, Abel-Beth-Maaca, Janoach, Kédesch, Hatsor, Galaad et la Galilée, tout le pays de Nephthali, et il emmena captifs les habitants en Assyrie ». La synodale écrit le nom Ain, Ion et Iyon."
    - "Les annales du roi assyrien lui-même énumèrent les villes de Galilée qu’il prit, mais le passage est brisé et Ijjon n’y est pas conservée. On tient d’ordinaire le site pour Tell Dibbin, un tertre dans la plaine près de la ville de Marjayoun dont les environs gardent le nom antique ; rien de ce qu’on y a trouvé ne le nomme, et l’identification repose sur le nom de la plaine et sur le tracé de la route. Hormis Josèphe, qui reprend le récit du raid de Ben-Hadad et nomme Ijjon parmi les villes incendiées ou pillées (Antiquités judaïques 8.305), aucun écrivain postérieur ne la nomme."
    - "La plaine est aujourd’hui dans le gouvernorat de Nabatieh, dans le sud du Liban, à quelques kilomètres de la frontière israélienne, avec la ville en grande partie chrétienne de Marjayoun et les villages de Dibbine et de Khiam ; le tertre se dresse parmi ses champs."
  pl:
    - "Ijjon było najbardziej na północ wysuniętym miastem Izraela, w małej górskiej równinie na północ od doliny Huli między Litani a Hasbani, która nadal nosi jego nazwę jako Mardż Ujun, „łąka źródeł”. Strzegło drogi z Dan na północ ku Bekaa i Damaszkowi i jest wymieniane tylko wtedy, gdy ta droga prowadziła najeźdźców. Na początku IX w. p.n.e. Ben-Hadad z Damaszku, wynajęty przez Asę z Judy przeciw Baaszy z Izraela, posłał swoich dowódców i „zburzył Hijon i Dan i Abelbetmaachę, i wszystko Cynnerot, i wszystkę ziemię Neftalim”; Kronikarz powtarza opowieść z Abel-Majim zamiast Abel-Bet-Maaka. W latach 733–732 p.n.e. „przyciągnął Teglet Falaser, król Assyryjski, i wziął Ajon i Abelbetmaacha, i Jonoe, i Kiedes, i Azor, i Galaad, i Galileę, wszystkę ziemię Neftali, a przeniósł obywatele jej do Assyryi”. Biblia synodalna pisze nazwę na trzy sposoby: Ain, Ion i Ijon."
    - "Własne roczniki króla asyryjskiego wymieniają zdobyte przez niego miasta Galilei, lecz fragment jest uszkodzony i Ijjon się w nim nie zachował. Miejsce uważa się zwykle za Tell Dibbin, pagórek na równinie koło miasta Marjajun, którego okolice zachowują starożytną nazwę; nic tam znalezionego jej nie wymienia, a utożsamienie opiera się na nazwie równiny i układzie drogi. Poza Józefem Flawiuszem, który powtarza opowieść o najeździe Ben-Hadada i wymienia Ijjon wśród spalonych lub złupionych miast (Dawne dzieje Izraela 8.305), żaden późniejszy pisarz go nie wymienia."
    - "Równina leży dziś w prowincji Nabatija w południowym Libanie, kilka kilometrów od granicy izraelskiej, z miastem Marjajun, w większości chrześcijańskim, i wsiami Dibbine i Chijam; pagórek stoi wśród jej pól."
  it:
    - "Ion era la città più settentrionale d’Israele, nella piccola pianura a nord della Hula fra il Litani e l’Hasbani, che porta ancora il suo nome come Marj Ayun, «il prato delle sorgenti». Custodiva la strada da Dan verso la Beqa e Damasco, ed è nominata solo quando gli invasori la scendevano. All’inizio del IX secolo a.C. Ben-Adad di Damasco, assoldato da Asa di Giuda contro Baasa d’Israele, mandò i capi del suo esercito, ed egli «espugnò Ijon, Dan, Abel-Beth-Maaca, tutta la contrada di Kinneroth con tutto il paese di Neftali»; il Cronista ripete la storia con Abel-Maim per Abel-Bet-Maaca. Nel 733–732 a.C. «venne Tiglath-Pileser, re di Assiria, e prese Ijon, Abel-Beth-Maaca, Janoah, Kedesh, Hatsor, Galaad, la Galilea, tutto il paese di Neftali, e ne menò gli abitanti in cattività in Assiria». La Bibbia sinodale scrive il nome in tre modi, Ain, Ion e Iyon."
    - "Gli annali del re assiro elencano le città della Galilea da lui prese, ma il passo è rotto e Ion non vi si è conservata. Il sito è di solito identificato con Tell Dibbin, un tell nella pianura presso la città di Marjayoun i cui dintorni conservano il nome antico; nulla di quanto vi è stato trovato lo nomina, e l’identificazione poggia sul nome della pianura e sull’andamento della strada. A parte Giuseppe Flavio, che ripete la storia della scorreria di Ben-Adad e nomina Ion fra le città incendiate o saccheggiate (Antichità giudaiche 8.305), nessuno scrittore posteriore la nomina."
    - "La pianura si trova oggi nel governatorato di Nabatieh nel Libano meridionale, a pochi chilometri dal confine israeliano, con la città in gran parte cristiana di Marjayoun e i villaggi di Dibbine e Khiam; il tell sorge fra i suoi campi."
  nl:
    - "Ijon was Israëls noordelijkste stad, in de kleine hoogvlakte ten noorden van de Hoelavallei tussen Litani en Hasbani, die als Marj Ayun, “de weide van bronnen”, nog haar naam draagt. Het bewaakte de weg van Dan naar het noorden richting de Bekaa en Damascus, en wordt alleen genoemd wanneer indringers die weg afdaalden. Vroeg in de 9e eeuw v.Chr. stuurde Ben-Hadad van Damascus, door Asa van Juda gehuurd tegen Baësa, zijn oversten, “en sloeg Ijon, en Dan, en Abel Beth-Maacha, en het ganse Cinneroth, met het ganse land Nafthali”; Kronieken heeft Abel-Maim voor Abel-Beth-Maächa. In 733–732 v.Chr. “kwam Tiglath-Pilezer, de koning van Assyrie, en nam Ijon in, en Abel-Beth-maacha, en Janoah, en Kedes, en Hazor, en Gilead, en Galilea, het ganse land van Nafthali; en hij voerde hen weg naar Assyrie”. De Synodale Bijbel schrijft de naam op drie manieren, Ain, Ion en Iyon."
    - "De eigen annalen van de Assyrische koning noemen de steden van Galilea die hij innam, maar de passage is gebroken en Ijon is erin niet bewaard. De plaats wordt gewoonlijk gehouden voor Tell Dibbin, een heuvel in de vlakte bij de stad Marjayoun, wier omgeving de oude naam bewaart; niets wat daar is gevonden noemt hem, en de identificatie berust op de naam van de vlakte en de ligging van de weg. Behalve Flavius Josephus, die het verhaal van Ben-Hadads strooptocht herhaalt en Ijon noemt onder de verbrande of geplunderde steden (Joodse Oudheden 8.305), noemt geen latere schrijver het."
    - "De vlakte ligt nu in het gouvernement Nabatieh in Zuid-Libanon, enkele kilometers van de Israëlische grens, met de grotendeels christelijke stad Marjayoun en de dorpen Dibbine en Khiam; de heuvel staat tussen de akkers."
  cs:
    - "Ijón bylo nejsevernější město Izraele, v malé vysoké rovině severně od údolí Chuly mezi Litání a Hasbání, která dosud nese jeho jméno jako Marj Ajún, „louka pramenů“. Střežilo cestu z Danu na sever k Bikáa a Damašku a jmenuje se jen tehdy, když po ní sestupovali útočníci. Počátkem 9. stol. př. n. l. Ben-hadad Damašský, najatý Asou Judským proti Baešovi Izraelskému, poslal své velitele a „dobyl Jon a Dan, též Abelbetmaachy, i všeho Ceneretu, a vší země Neftalím“; kronikář příběh opakuje s Ábel-majim místo Ábel-bét-maaky. V letech 733–732 př. n. l. „přitáhl Tiglatfalazar král Assyrský, a vzal Jon a Abel, dům Maacha a Janoe, Kedes a Azor, i Galád a Galilei, i všecku zemi Neftalím, a přenesl obyvatele jejich do Assyrie“. Synodální Bible píše jméno třemi způsoby, Ain, Ion a Iyon."
    - "Vlastní anály asyrského krále uvádějí galilejská města, která dobyl, ale pasáž je poškozená a Ijón se v ní nezachoval. Místo se obvykle pokládá za Tell Dibbin, pahorek v rovině u města Marjajún, jehož okolí zachovává starověké jméno; nic tam nalezeného jej nejmenuje a ztotožnění se opírá o jméno roviny a polohu cesty. Kromě Josepha, který opakuje příběh o nájezdu Ben-hadada a jmenuje Ijón mezi spálenými nebo vypleněnými městy (Židovské starožitnosti 8.305), žádný pozdější pisatel jej nejmenuje."
    - "Rovina je dnes v gubernii Nabatíja v jižním Libanonu, několik kilometrů od izraelské hranice, s převážně křesťanským městem Marjajún a vesnicemi Dibbine a Chijám; pahorek stojí mezi jejími poli."
  sv:
    - "Ijon var Israels nordligaste stad, i den lilla högslätten norr om Huladalen mellan Litani och Hasbani, som fortfarande bär dess namn som Marj Ayun, ”källornas äng”. Den vaktade vägen från Dan norrut mot Bekaa och Damaskus, och den nämns bara när inkräktare kom ned längs den vägen. Tidigt på 800-talet f.Kr. sände Ben-Hadad av Damaskus, lejd av Asa av Juda mot Basha av Israel, sina hövitsmän och de ”förhärjade Ijon, Dan, Abel-Bet-Maaka och hela Kinarot jämte hela Naftali land”; krönikeskrivaren upprepar berättelsen med Avel-Majim i stället för Avel-Bet-Maaka. Åren 733–732 f.Kr. ”kom Tiglat-Pileser, konungen i Assyrien, och intog Ijon, Abel-Bet-Maaka, Janoa, Kedes, Hasor, Gilead och Galileen, hela Naftali land, och förde folket bort till Assyrien”. Den ryska synodalbibeln stavar namnet på tre sätt, Ain, Ion och Iyon."
    - "Den assyriske kungens egna annaler förtecknar de galileiska städer han intog, men passagen är bruten och Ijon är inte bevarat i den. Platsen tas vanligen för Tell Dibbin, en kulle på slätten nära staden Marjayoun vars omgivning bevarar det antika namnet; inget som hittats där nämner det, och identifieringen vilar på slättens namn och vägens läge. Förutom Josefus, som upprepar berättelsen om Ben-Hadads räd och nämner Ijon bland de städer som brändes eller plundrades (Judiska fornminnen 8.305), nämner ingen senare författare den."
    - "Slätten ligger i dag i guvernementet Nabatieh i södra Libanon, några kilometer från den israeliska gränsen, med den till stor del kristna staden Marjayoun och byarna Dibbine och Khiam; kullen står bland dess åkrar."
  nb:
    - "Ijon var Israels nordligste by, i den lille høylandssletten nord for Hula-dalen mellom Litani og Hasbani, som fortsatt bærer navnet som Marj Ayun, «kildenes eng». Den voktet veien fra Dan nordover mot Bekaa og Damaskus, og den nevnes bare når inntrengere kom nedover den veien. Tidlig på 800-tallet f.Kr. sendte Ben-Hadad av Damaskus, leid av Asa av Juda mot Basja av Israel, sine hærførere, og de «inntok Ijon og Dan og Abel-Bet-Ma'aka og hele Kinneret med hele Naftalis land»; kronikeren gjentar historien med Abel-Maim i stedet for Abel-Bet-Maaka. I 733–732 f.Kr. «kom kongen i Assyria Tiglat-Pileser og tok Ijon og Abel-Bet-Ma'aka og Janoah og Kedes og Hasor og Gilead og Galilea, hele Naftalis land; og han bortførte innbyggerne til Assyria». Den synodale bibelen staver navnet på tre måter, Ain, Ion og Iyon."
    - "Den assyriske kongens egne annaler oppfører byene i Galilea han tok, men avsnittet er brutt og Ijon er ikke bevart i det. Stedet tas vanligvis for å være Tell Dibbin, en haug i sletten nær byen Marjayoun hvis omgivelser bevarer det gamle navnet; ingenting funnet der nevner det, og identifikasjonen hviler på slettens navn og veiens forløp. Utenom Josefus, som gjentar historien om Ben-Hadads raid og nevner Ijon blant byene som ble brent eller plyndret (Jødenes historie 8.305), nevner ingen senere forfatter den."
    - "Sletten ligger i dag i guvernementet Nabatieh i Sør-Libanon, noen få kilometer fra den israelske grensen, med den for det meste kristne byen Marjayoun og landsbyene Dibbine og Khiam; haugen ligger blant åkrene."
  tl:
    - "Ang Ihion ang pinakahilagang bayan ng Israel, sa munting kapatagan sa hilaga ng libis ng Hula, sa pagitan ng Litani at Hasbani, na tinatawag pang Marj Ayun, “ang parang ng mga bukal”. Bantay ito ng daan mula Dan patungong Beqaa at Damasco, at nababanggit lang kapag dumaan doon ang mga mananakop. Maaga sa ika-9 na siglo BK, si Ben-adad ng Damasco, na inupahan ni Asa ng Juda laban kay Baasa ng Israel, ay nagsugo ng mga puno at “sinaktan ang Ahion at ang Dan, at ang Abel-bethmaacha at ang buong Cinneroth, sangpu ng buong lupain ng Nephtali”; sa Mga Cronica, Abel-maim ang kapalit ng Abel-bethmaacha. Noong 733–732 BK, si Tiglathpileser na hari sa Asiria ay “sinakop ang Ihion, at ang Abel-bethmaacha … at ang Galaad, at ang Galilea, ang buong lupain ng Nephtali; at kaniyang dinalang bihag sila sa Asiria”. Tatlo ang baybay ng Bibliyang Synodal sa pangalan: Ain, Ion at Iyon."
    - "Ang sariling mga talaan ng paghahari ng haring Asirio ay naglilista ng mga bayan ng Galilea na kaniyang sinakop, ngunit putol ang bahagi at hindi nanatili rito ang Ihion. Karaniwang itinuturing na ang lugar ay ang Tell Dibbin, isang burol sa kapatagan malapit sa bayan ng Marjayoun na ang paligid ay nagtataglay ng sinaunang pangalan; walang natagpuan doon na nagbibigay ng pangalan nito, at nakasalig ang pagkakakilanlan sa pangalan ng kapatagan at sa hugis ng daan. Maliban kay Josefo, na inuulit ang kuwento ng paglusob ni Ben-adad at isinasama ang Ihion sa mga bayang sinunog o ninakawan (Mga Antigüedades ng mga Judio 8.305), walang manunulat sa mga sumunod na panahon na nagbanggit nito."
    - "Ang kapatagan ay nasa gobernadorado ng Nabatieh sa timog Libano ngayon, ilang kilometro mula sa hangganan ng Israel, kasama ang bayang halos Kristiyano ng Marjayoun at ang mga nayon ng Dibbine at Khiam; ang burol ay nakatayo sa gitna ng mga bukid nito."
  da:
    - "Ijjon var Israels nordligste by, i den lille højslette nord for Hula-dalen mellem Litani og Hasbani, som stadig bærer dens navn som Marj Ayun, »kildernes eng«. Den vogtede vejen fra Dan mod nord mod Beqaa og Damaskus, og den nævnes kun, når angribere kom ned ad den vej. Tidligt i 800-tallet f.Kr. sendte Ben-Hadad af Damaskus, hyret af Asa af Juda mod Basja af Israel, sine hærførere, og de »slog Ijon og Dan og Abel-Beth-Maaka og hele Kinneroth, tillige med alt Nafthalis Land«; Krønikeskriveren gentager historien med Abel-Maim for Abel-Bet-Maaka. I 733–732 f.Kr. »kom Thiglath-Pileser, Kongen af Assyrien, og tog Ijon og Abel-Beth-Maaka og Ianoa og Kedes og Hasor og Gilead og Galilæa, alt Nafthalis Land, og han bortførte dem til Assyrien«. Den russiske synodalbibel staver navnet på tre måder, Ain, Ion og Iyon."
    - "Den assyriske konges egne annaler opregner de byer i Galilæa, han tog, men passagen er brudt, og Ijjon er ikke bevaret i den. Stedet antages sædvanligvis at være Tell Dibbin, en høj i sletten nær byen Marjayoun, hvis omgivelser bevarer det gamle navn; intet fundet der nævner det, og identifikationen hviler på slettens navn og vejens forløb. Bortset fra Josefus, som gentager historien om Ben-Hadads plyndringstog og nævner Ijjon blandt de byer, der blev brændt eller plyndret (Jødernes oldtid 8.305), nævner ingen senere forfatter den."
    - "Sletten ligger i dag i Nabatieh-guvernementet i det sydlige Libanon, få kilometer fra den israelske grænse, med den overvejende kristne by Marjayoun og landsbyerne Dibbine og Khiam; højen står blandt dens marker."
  sr:
    - "Ијон је био најсевернији град Израиља, у малој брдској равници северно од долине Хула између Литанија и Хасбанија, која још носи његово име као Мардж Ајун, „ливада извора“. Чувао је пут од Дана на север према Бекаи и Дамаску, и именује се само кад су освајачи силазили тим путем. Почетком деветог века п. н. е. Вен-Адад из Дамаска, најмљен од Асе Јудиног против Васе Израиљевог, послао је своје војводе да „покори Ијон и Дан и Авел Ветмаху и сав Хинерот и сву земљу Нефталимову“; Летописац понавља причу са Авел-Мајимом уместо Авел-Вет-Махе. Године 733–732. п. н. е. „дође Теглат-Феласар цар асирски, и узе Ијон и Авел-Ветмаху и Јанох и Кедес и Асор и Галад и Галилеју, сву земљу Нефталимову, и пресели народ оданде у Асирију“. Руски синодски превод пише име на три начина: Аин, Ион и Ијон."
    - "Асирски краљевски анали сами наводе градове Галилеје које је узео, али је одломак оштећен и Ијон у њему није сачуван. Налазиште се обично узима за Тел Дибин, хумку у равници близу града Мерџајуна чија околина чува древно име; ништа тамо пронађено га не именује и поистовећење почива на имену равнице и положају пута. Осим Јосифа Флавија, који понавља причу о Вен-Ададовом налету и именује Ијон међу спаљеним или опљачканим градовима („Јеврејске старине“ 8.305), ни један каснији писац га не именује."
    - "Равница је данас у гувернорату Набатија у јужном Либану, неколико километара од израелске границе, са претежно хришћанским градом Мерџајуном и селима Дибин и Хијам; хумка стоји међу њеним пољима."
  hu:
    - "Ijjón Izráel legészakibb városa volt, a Hula-völgytől északra fekvő felföldi síkságon, a Litani és a Hászbáni között, amely a nevet ma is Mardzs Ajún, „a források rétje” alakban őrzi. A Danból északra, a Beqaa és Damaszkusz felé vezető utat őrizte, és csak akkor említik, ha betolakodók jöttek azon az úton. Kr. e. 9. század elején Ben-Hadad damaszkuszi király, akit Ásza, Júda királya bérelt fel Baása, Izráel királya ellen, elküldte vezéreit, és „bevevé Hijont és Dánt, és Abel Beth-Maakát, és az egész Kinneróthot a Nafthali egész földével”; a Krónikák írója Ábel-Bét-Maaka helyett Ábel-Majimot említ. Kr. e. 733–732-ben „jött el Tiglát-Piléser, Assiria királya, és foglalta el Hijont, Abélt, Beth-Maakát, Jánoát, Kédest, Hásort, Gileádot, Galileát és a Nafthali egész földét, és hurczolta el őket, Assiriába”. A szinodális Biblia háromféleképpen írja a nevet: Ain, Ion és Ijon."
    - "Az asszír király saját évkönyvei felsorolják az általa elfoglalt galileai városokat, de a szakasz töredékes, és Ijjón nem maradt meg benne. A helyet rendszerint Tell Dibbinnel azonosítják, egy halommal a Mardzsajún város melletti síkságon, amelynek környéke megőrizte az ókori nevet; semmi, amit ott találtak, nem nevezi meg, és az azonosítás a síkság nevén és az út fekvésén alapul. Josephuson kívül, aki megismétli Ben-Hadad portyájának történetét, és Ijjónt a felégetett vagy kifosztott városok között említi (Zsidó régiségek 8.305), későbbi író nem nevezi meg."
    - "A síkság ma Dél-Libanon Nabatije kormányzóságában fekszik, néhány kilométerre az izraeli határtól, a többségében keresztény Mardzsajún városával és Dibbine és Hijám falvaival; a halom a mezői között áll."
  fi:
    - "Ijon oli Israelin pohjoisin kaupunki, pienellä ylängöllä Hulan laakson pohjoispuolella Litanin ja Hasbanin välissä, joka kantaa yhä sen nimeä muodossa Marj Ayun, ”lähteiden niitty”. Se vartioi tietä Danista pohjoiseen kohti Beqaata ja Damaskosta, ja se mainitaan vain hyökkääjien tullessa tuota tietä. 800-luvun alussa eaa. Damaskoksen Benhadad, jonka Juudan Asa oli palkannut Israelin Baesaa vastaan, lähetti päällikkönsä ja ”valtasi Iijonin, Daanin, Aabel-Beet-Maakan ja koko Kinnerotin ynnä koko Naftalin maan”; Aikakirjat toistavat kertomuksen, Abel-Beet-Maakan tilalla Abel-Majim. Vuosina 733–732 eaa. Tiglat-Pileser, Assurin kuningas, ”valloitti Iijonin, Aabel-Beet-Maakan, Jaanoahin, Kedeksen, Haasorin, Gileadin ja Galilean, koko Naftalin maan, ja vei asukkaat pakkosiirtolaisuuteen Assuriin”. Synodaalinen Raamattu kirjoittaa nimen kolmella tavalla: Ain, Ion ja Iyon."
    - "Assyrian kuninkaan omat annaalit luettelevat Galilean kaupungit, jotka hän valloitti, mutta kohta on rikkinäinen, eikä Ijon ole siinä säilynyt. Paikka katsotaan yleensä Tell Dibbiniksi, kummuksi tasangolla Marjayounin kaupungin lähellä, jonka ympäristö säilyttää muinaisen nimen; mikään siellä löydetty ei nimeä sitä, ja tunnistus perustuu tasangon nimeen ja tien kulkuun. Josephusta lukuun ottamatta, joka toistaa kertomuksen Benhadadin ryöstöretkestä ja nimeää Ijonin poltettujen tai ryöstettyjen kaupunkien joukossa (Juutalaisten muinaisuudet 8.305), mikään myöhempi kirjoittaja ei nimeä sitä."
    - "Tasanko on nykyään Etelä-Libanonin Nabatiehin kuvernementissa, muutaman kilometrin päässä Israelin rajasta, ja siellä sijaitsevat suurelta osin kristitty Marjayounin kaupunki sekä Dibbinen ja Khiamin kylät; kumpu seisoo niiden peltojen keskellä."
  vi:
    - "Y-giôn là thành cực bắc của Y-sơ-ra-ên, trong đồng bằng cao nhỏ phía bắc thung lũng Hula giữa sông Litani và Hasbani, vẫn mang tên là Marj Ayun, “đồng cỏ của các suối”. Thành canh giữ con đường từ Đan lên phía bắc hướng Beqaa và Đa-mách, và chỉ được nêu tên khi quân xâm lược xuống con đường ấy. Đầu thế kỷ 9 TCN, Bên-Ha-đát của Đa-mách, được A-sa của Giu-đa thuê đánh Ba-ê-sa của Y-sơ-ra-ên, sai các tướng mình “hãm đánh những thành của Y-sơ-ra-ên, chiếm lấy Y-giôn, Đan, A-bên-Bết-Ma-ca, và cả xứ Ki-nê-rốt với xứ Nép-ta-li”; sử gia sách Sử Ký lặp lại câu chuyện với A-bên-Ma-im thay cho A-bên-Bết-Ma-ca. Năm 733–732 TCN, “Tiếc-la-Phi-lê-se, vua A-si-ri, loán đến chiếm lấy Y-giôn, A-bên-Bết-Ma-ca, Gia-nô-ác, Kê-đe, Hát-so, miền Ga-la-át, miền Ga-li-lê, và cả địa phận Nép-ta-li; đoạn đem dân sự các xứ ấy sang A-si-ri”. Bản Synodal viết tên theo ba cách, Ain, Ion và Iyon."
    - "Biên niên của chính vua A-si-ri liệt kê các thành Ga-li-lê ông chiếm, nhưng đoạn văn bị đứt và Y-giôn không còn trong đó. Địa điểm thường được coi là Tell Dibbin, một gò trong đồng bằng gần thị trấn Marjayoun mà vùng xung quanh giữ tên cổ; không gì tìm thấy ở đó nêu tên thành, và việc đồng nhất dựa vào tên của đồng bằng và hướng của con đường. Ngoài Josephus, người lặp lại câu chuyện cuộc đột kích của Bên-Ha-đát và nêu Y-giôn trong các thành bị đốt hay cướp (Cổ sử Do Thái 8.305), không tác giả nào về sau nêu tên."
    - "Đồng bằng ngày nay thuộc tỉnh Nabatieh của nam Li-ban, cách biên giới Israel vài ki-lô-mét, với thị trấn phần lớn Cơ Đốc Marjayoun và các làng Dibbine và Khiam; gò đứng giữa các cánh đồng của nó."
  ro:
    - "Ion era cel mai nordic oraș al lui Israel, în mica câmpie de podiș la nord de valea Hula, între Litani și Hasbani, care îi poartă încă numele ca Marj Ayun, „pajiștea izvoarelor”. Păzea drumul de la Dan spre nord, către Bekaa și Damasc, și e numit doar când invadatorii coborau pe el. La începutul secolului al IX-lea î.Hr., Ben-Hadad din Damasc, tocmit de Asa al lui Iuda împotriva lui Baeșa al lui Israel, „a trimis pre căpeteniile oștilor sale în cetățile lui Israil, și a bătut pre Aiin și pre Dan și pre Avel al casei Maahei și tot Heneretul până la pământul Neftali”; cronicarul o repetă, cu Abel-Maim în loc de Abel-Bet-Maaca. În 733–732 î.Hr., Tiglat-Pileser al Asiriei „a luat Aia și Avel și Tamaaha și Anioh și Kenez și Asor și Galaad și Galilea tot pământul Netalimului, și i-au mutat pre ei în Asiriea”. Biblia sinodală scrie numele în trei feluri: Ain, Ion și Iyon."
    - "Analele regelui asirian enumeră ele însele orașele Galileii pe care le-a luat, dar pasajul este rupt, iar Ion nu s-a păstrat în el. Locul este socotit de obicei Tell Dibbin, o movilă în câmpie, lângă orașul Marjayoun, ale cărui împrejurimi păstrează numele antic; nimic găsit acolo nu-l numește, iar identificarea se sprijină pe numele câmpiei și pe poziția drumului. În afară de Iosif Flaviu, care repetă povestea incursiunii lui Ben-Hadad și numește Ion printre orașele arse sau jefuite (Antichități iudaice 8.305), niciun scriitor de mai târziu nu-l numește."
    - "Câmpia se află astăzi în guvernoratul Nabatieh din sudul Libanului, la câțiva kilometri de granița israeliană, cu orașul în mare parte creștin Marjayoun și satele Dibbine și Khiam; movila se află printre câmpurile lor."
  bg:
    - "Йон беше най-северният град на Израил, в малката планинска равнина северно от долината Хула между Литани и Хасбани, която и днес носи името му като Мардж Аюн, „ливадата на изворите“. Той пазеше пътя от Дан на север към Бекаа и Дамаск и се назовава само когато нашественици слизаха по този път. В началото на IX в. пр.н.е. Венадад от Дамаск, нает от Аса Юдейски срещу Вааса Израилев, изпрати военачалниците си „и порази Иион, и Дан, и Авел-вет-мааха, и всичкия Хинерот, с всичката Нефталимова земя“; Летописецът повтаря историята с Авел-Маим вместо Авел-Бет-Маха. През 733–732 г. пр.н.е. „дойде Теглат-феласар Асирийският цар та превзе Иион, Авел-вет-мааха, и Янох, и Кадес, и Асор, и Галаад, и Галилея, всичката Нефталимова земя, и заведе ги пленници в Асирия“. Синодалната Библия изписва името по три начина: Аин, Ион и Ийон."
    - "Собствените летописи на асирийския цар изброяват превзетите от него градове в Галилея, но пасажът е повреден и Йон не е запазен в него. Мястото обикновено се смята за Тел Дибин, могила в равнината близо до град Марджаюн, чиито околности пазят древното име; нищо намерено там не го назовава и отъждествяването почива на името на равнината и на трасето на пътя. Освен Йосиф Флавий, който повтаря историята за набега на Венадад и назовава Йон сред изгорените или ограбените градове („Юдейски древности“ 8.305), никой по-късен автор не го назовава."
    - "Равнината днес е в губернаторство Набатие в Южен Ливан, на няколко километра от израелската граница, с предимно християнския град Марджаюн и селата Дибин и Хиам; могилата стои сред нивите ѝ."
scripture:
  - 1Kgs.15.20
  - 2Kgs.15.29
  - 2Chr.16.4
