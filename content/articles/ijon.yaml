body:
  en:
    - "Ijon was the northernmost town of Israel, in the small upland plain north of the Hula valley between the Litani and the Hasbani, which still bears its name as Marj Ayun, “the meadow of springs”. It guarded the road from Dan north toward the Beqaa and Damascus, and it is named only when invaders came down that road. Early in the ninth century BC Ben-hadad of Damascus, hired by Asa of Judah against Baasha of Israel, sent his captains “and smote Ijon, and Dan, and Abel-beth-maachah, and all Cinneroth, with all the land of Naphtali”; the Chronicler repeats the story with Abel-maim for Abel-beth-maacah. In 733–732 BC “came Tiglath-pileser king of Assyria, and took Ijon, and Abel-beth-maachah, and Janoah, and Kedesh, and Hazor, and Gilead, and Galilee, all the land of Naphtali, and carried them captive to Assyria”. The Synodal Bible spells the name three ways, Ain, Ion and Iyon."
    - "The Assyrian king's own annals list the towns of Galilee he took, but the passage is broken and Ijon is not preserved in it. The site is usually taken to be Tell Dibbin, a mound in the plain near the town of Marjayoun whose surroundings keep the ancient name; nothing found there names it, and the identification rests on the name of the plain and the lie of the road. Apart from Josephus, who repeats the story of Ben-hadad's raid and names Ijon among the towns burned (Jewish Antiquities 8.305), no later writer names it."
    - "The plain is today in the Nabatieh governorate of southern Lebanon, a few kilometres from the Israeli border, with the largely Christian town of Marjayoun and the villages of Dibbine and Khiam; the mound stands among its fields."
  ru:
    - "Ион был самым северным городом Израиля, на небольшой нагорной равнине к северу от долины Хула между Литани и Хасбани, которая до сих пор носит его имя — Мардж-Аюн, «луг источников». Он стерёг дорогу от Дана и Авел-Беф-Маахи на север к Бекаа и Дамаску, и назван он только тогда, когда по этой дороге приходили захватчики. В начале IX века до н. э. Венадад Дамасский, нанятый Асой Иудейским против Ваасы Израильского, послал военачальников, «и поразил Аин и Дан и Авел-Беф-Мааху и весь Киннероф, по всей земле Неффалима»; летописец повторяет рассказ с Авелмаимом вместо Авел-Беф-Маахи. В 733–732 гг. до н. э. «пришел Феглаффелласар, царь Ассирийский, и взял Ион, Авел-Беф-Мааху, и Ианох, и Кедес, и Асор, и Галаад, и Галилею, всю землю Неффалимову, и переселил их в Ассирию». Синодальный перевод пишет имя тремя способами: Аин, Ион и Ийон."
    - "Собственные анналы ассирийского царя перечисляют взятые им города Галилеи, но место повреждено, и Ион в нём не сохранился. Местом обычно считают Телль-Диббине, холм на равнине близ города Марджаюн, чьи окрестности сохраняют древнее имя; ничто найденное там не называет его имени, и отождествление держится на имени равнины и на ходе дороги. Кроме Иосифа Флавия, который пересказывает историю набега Венадада и называет Ион среди сожжённых городов («Иудейские древности» 8.305), никто из позднейших писателей его не называет."
    - "Равнина сегодня лежит в провинции Набатия на юге Ливана, в нескольких километрах от израильской границы, с преимущественно христианским городом Марджаюн и деревнями Диббине и Хиям; холм стоит среди их полей."
  uk:
    - "Іййон був найпівнічнішим містом Ізраїлю, у малій височинній рівнині на північ від долини Хула між Літані та Хасбані, яка досі носить його назву як Мардж-Аюн, «лука джерел». Він сторожував дорогу від Дана на північ до Бекаа і Дамаска, і його називають лише тоді, коли загарбники спускалися цією дорогою. На початку IX ст. до н. е. Бен-Гадад Дамаський, найнятий Асою Юдейським проти Вааси Ізраїльського, послав своїх начальників проти ізраїльських міст, і тоді «звоював Анн і Дан і Абел-Бет-Мааху й увесь Киннерот, — всю землю Нефталїєву»; літописець повторює історію з Авелмаїмом замість Авел-Бет-Мааху. 733–732 рр. до н. е. «прийшов Теглатфелласар, царь Ассирийський, і звоював Йон, Абел-бет-Мааху, Янох, Кедес і Асор, Галаад і Галилею, усю землю Нефталїєву, та й одвів їх в Ассирию». Синодальна Біблія пише цю назву трьома способами: Аїн, Іон та Ійон."
    - "Власні аннали ассирійського царя перелічують галілейські міста, які він узяв, але уривок пошкоджений, і Іййон у ньому не зберігся. Місце зазвичай ототожнюють з Телль-Діббіном, городищем на рівнині поблизу міста Мардж-Аюн, околиці якого зберігають давню назву; ніщо знайдене там не називає його, і ототожнення спирається на назву рівнини та розташування дороги. Крім Йосифа Флавія, який переказує історію набігу Бен-Гадада й називає Іййон серед спалених міст («Юдейські старожитності» 8.305), жоден пізніший автор його не називає."
    - "Рівнина нині лежить у провінції Набатія на півдні Лівану, за кілька кілометрів від ізраїльського кордону, з переважно християнським містом Мардж-Аюн і селами Діббіне та Хіям; городище стоїть серед його полів."
  es:
    - "Ijón era la población más septentrional de Israel, en la pequeña llanura alta al norte del Huleh, entre el Litani y el Hasbani, que aún se llama Marj Ayun, «la pradera de las fuentes». Guardaba el camino de Dan hacia el norte, a la Becá y Damasco, y se nombra solo cuando por él bajaban invasores. A comienzos del siglo IX a. C. Ben-adad de Damasco, contratado por Asa de Judá contra Baasa de Israel, envió a sus capitanes contra ciudades de Israel, y «hirió á Ahión, y á Dan, y á Abel-beth-maachâ, y á toda Cinneroth, con toda la tierra de Nephtalí»; el Cronista la repite con Abel-maim en vez de Abel-bet-maaca. En 733–732 a. C. «vino Tiglath-pileser rey de los Asirios, y tomó á Ahión, Abel-beth-maachâ, y Janoa, y Cedes, y Asor, y Galaad, y Galilea, y toda la tierra de Nephtalí; y trasportólos á Asiria». La Biblia sinodal lo escribe de tres maneras, Ain, Ion e Iyon."
    - "Los propios anales del rey asirio enumeran las ciudades de Galilea que tomó, pero el pasaje está roto y Ijón no se conserva en él. El sitio suele tomarse por Tell Dibbin, un montículo en la llanura cerca de la ciudad de Marjayoun, cuyos alrededores conservan el nombre antiguo; nada de lo hallado allí lo nombra, y la identificación se apoya en el nombre de la llanura y en el trazado del camino. Aparte de Josefo, que repite la historia de la incursión de Ben-adad y nombra Ijón entre las ciudades quemadas (Antigüedades judías 8.305), ningún escritor posterior la nombra."
    - "La llanura se halla hoy en la gobernación de Nabatieh, en el sur del Líbano, a pocos kilómetros de la frontera israelí, con la ciudad de mayoría cristiana de Marjayoun y las aldeas de Dibbine y Khiam; el montículo se alza entre sus campos."
  pt:
    - "Ijom era a cidade mais setentrional de Israel, na pequena planície alta ao norte do vale do Hula, entre o Litani e o Hasbani, que ainda guarda o seu nome como Marj Ayun, “o prado das fontes”. Guardava a estrada de Dã para o norte, rumo a Beca e Damasco, e só é nomeada quando invasores desciam por ela. No início do século IX a.C., Ben-Hadade de Damasco, contratado por Asa de Judá contra Baasa de Israel, enviou seus comandantes contra as cidades de Israel, e “atacou Ijom, Dã, Abel-Bete-Maaca, e toda Quinerete, com toda a terra de Naftali”; o cronista repete a história com Abel-Maim em lugar de Abel-Bete-Maacá. Em 733–732 a.C., “Tiglate-Pileser, rei da Assíria, veio e tomou Ijom, Abel-Bete-Maaca, Janoa, Quedes, Hazor, Gileade e a Galileia, toda a terra de Naftali; e os levou cativos para a Assíria”. A Bíblia Sinodal escreve o nome de três modos, Ain, Ion e Iyon."
    - "Os próprios anais do rei assírio listam as cidades da Galileia que tomou, mas a passagem está quebrada e Ijom não se conservou nela. O sítio é usualmente tomado como Tell Dibbin, um monte na planície perto da cidade de Marjayoun, cujos arredores guardam o antigo nome; nada achado ali o nomeia, e a identificação repousa no nome da planície e no traçado da estrada. Além de Josefo, que repete a história da incursão de Ben-Hadade e nomeia Ijom entre as cidades queimadas (Antiguidades Judaicas 8.305), nenhum escritor posterior a nomeia."
    - "A planície fica hoje na província de Nabatieh, no sul do Líbano, a poucos quilômetros da fronteira com Israel, com a cidade em grande parte cristã de Marjayoun e as aldeias de Dibbine e Khiam; o monte se ergue entre os seus campos."
  de:
    - "Ijon war die nördlichste Stadt Israels, in der kleinen Hochebene nördlich des Hulatals zwischen Litani und Hasbani, die als Mardsch Ujun, „Wiese der Quellen“, den Namen bewahrt. Es sicherte die Straße von Dan nordwärts Richtung Bekaa und Damaskus und wird nur genannt, wenn Eindringlinge sie herabkamen. Im frühen 9. Jahrhundert v. Chr. sandte Ben-Hadad von Damaskus, von Asa von Juda gegen Baesa gedungen, seine Hauptleute, und er „schlug Ijon und Dan und Abel-Beth-Maacha, das ganze Kinneroth samt dem Lande Naphthali“; der Chronist erzählt es mit Abel-Maim statt Abel-Bet-Maacha. 733–732 v. Chr. „kam Thiglath-Pileser, der König von Assyrien, und nahm Ijon, Abel-Beth-Maacha, Janoah, Kedes, Hazor, Gilead und Galiläa, das ganze Land Naphthali, und führte sie weg nach Assyrien“. Die Synodalübersetzung schreibt den Namen dreifach: Ain, Ion, Iyon."
    - "Die eigenen Annalen des assyrischen Königs verzeichnen die galiläischen Städte, die er nahm, doch die Stelle ist abgebrochen, und Ijon ist darin nicht erhalten. Die Stätte wird meist mit Tell Dibbin gleichgesetzt, einem Hügel in der Ebene bei der Stadt Mardschajun, deren Umgebung den antiken Namen bewahrt; nichts dort Gefundenes nennt ihn, und die Gleichsetzung beruht auf dem Namen der Ebene und dem Verlauf der Straße. Außer Josephus, der die Geschichte von Ben-Hadads Raubzug wiederholt und Ijon unter den verbrannten Städten nennt (Jüdische Altertümer 8.305), nennt es kein späterer Schriftsteller."
    - "Die Ebene liegt heute im Gouvernement Nabatija im Südlibanon, wenige Kilometer von der israelischen Grenze, mit der überwiegend christlichen Stadt Mardschajun und den Dörfern Dibbine und Chiam; der Hügel steht zwischen ihren Feldern."
  fr:
    - "Ijjon était la ville la plus au nord d’Israël, dans la petite plaine d’altitude au nord de la Houla, entre le Litani et le Hasbani, qui le garde sous la forme Marj Ayun, « le pré des sources ». Elle gardait la route de Dan vers le nord, en direction de la Bekaa et de Damas, et n’est nommée que lorsque des envahisseurs la descendirent. Au début du IXe siècle av. J.-C., Ben-Hadad de Damas, loué par Asa de Juda contre Baescha d’Israël, envoya ses chefs, et « il battit Ijjon, Dan, Abel-Beth-Maaca, tout Kinneroth, et tout le pays de Nephthali » ; le Chroniqueur la répète avec Abel-Maïm pour Abel-Beth-Maaca. En 733–732 av. J.-C., « Tiglath-Piléser, roi d’Assyrie, vint et prit Ijjon, Abel-Beth-Maaca, Janoach, Kédesch, Hatsor, Galaad et la Galilée, tout le pays de Nephthali, et il emmena captifs les habitants en Assyrie ». La synodale écrit le nom Ain, Ion et Iyon."
    - "Les annales du roi assyrien lui-même énumèrent les villes de Galilée qu’il prit, mais le passage est brisé et Ijjon n’y est pas conservée. On tient d’ordinaire le site pour Tell Dibbin, un tertre dans la plaine près de la ville de Marjayoun dont les environs gardent le nom antique ; rien de ce qu’on y a trouvé ne le nomme, et l’identification repose sur le nom de la plaine et sur le tracé de la route. Hormis Josèphe, qui reprend le récit du raid de Ben-Hadad et nomme Ijjon parmi les villes incendiées (Antiquités judaïques 8.305), aucun écrivain postérieur ne la nomme."
    - "La plaine est aujourd’hui dans le gouvernorat de Nabatieh, dans le sud du Liban, à quelques kilomètres de la frontière israélienne, avec la ville en grande partie chrétienne de Marjayoun et les villages de Dibbine et de Khiam ; le tertre se dresse parmi ses champs."
  pl:
    - "Ijjon było najbardziej na północ wysuniętym miastem Izraela, w małej górskiej równinie na północ od doliny Huli między Litani a Hasbani, która nadal nosi jego nazwę jako Mardż Ujun, „łąka źródeł”. Strzegło drogi z Dan na północ ku Bekaa i Damaszkowi i jest wymieniane tylko wtedy, gdy ta droga prowadziła najeźdźców. Na początku IX w. p.n.e. Ben-Hadad z Damaszku, wynajęty przez Asę z Judy przeciw Baaszy z Izraela, posłał swoich dowódców i „zburzył Hijon i Dan i Abelbetmaachę, i wszystko Cynnerot, i wszystkę ziemię Neftalim”; Kronikarz powtarza opowieść z Abel-Majim zamiast Abel-Bet-Maaka. W latach 733–732 p.n.e. „przyciągnął Teglet Falaser, król Assyryjski, i wziął Ajon i Abelbetmaacha, i Jonoe, i Kiedes, i Azor, i Galaad, i Galileę, wszystkę ziemię Neftali, a przeniósł obywatele jej do Assyryi”. Biblia synodalna pisze nazwę na trzy sposoby: Ain, Ion i Ijon."
    - "Własne roczniki króla asyryjskiego wymieniają zdobyte przez niego miasta Galilei, lecz fragment jest uszkodzony i Ijjon się w nim nie zachował. Miejsce uważa się zwykle za Tell Dibbin, pagórek na równinie koło miasta Marjajun, którego okolice zachowują starożytną nazwę; nic tam znalezionego jej nie wymienia, a utożsamienie opiera się na nazwie równiny i układzie drogi. Poza Józefem Flawiuszem, który powtarza opowieść o najeździe Ben-Hadada i wymienia Ijjon wśród spalonych miast (Dawne dzieje Izraela 8.305), żaden późniejszy pisarz go nie wymienia."
    - "Równina leży dziś w prowincji Nabatija w południowym Libanie, kilka kilometrów od granicy izraelskiej, z miastem Marjajun, w większości chrześcijańskim, i wsiami Dibbine i Chijam; pagórek stoi wśród jej pól."
  it:
    - "Ion era la città più settentrionale d’Israele, nella piccola pianura a nord della Hula fra il Litani e l’Hasbani, che porta ancora il suo nome come Marj Ayun, «il prato delle sorgenti». Custodiva la strada da Dan verso la Beqa e Damasco, ed è nominata solo quando gli invasori la scendevano. All’inizio del IX secolo a.C. Ben-Adad di Damasco, assoldato da Asa di Giuda contro Baasa d’Israele, mandò i capi del suo esercito, ed egli «espugnò Ijon, Dan, Abel-Beth-Maaca, tutta la contrada di Kinneroth con tutto il paese di Neftali»; il Cronista ripete la storia con Abel-Maim per Abel-Bet-Maaca. Nel 733–732 a.C. «venne Tiglath-Pileser, re di Assiria, e prese Ijon, Abel-Beth-Maaca, Janoah, Kedesh, Hatsor, Galaad, la Galilea, tutto il paese di Neftali, e ne menò gli abitanti in cattività in Assiria». La Bibbia sinodale scrive il nome in tre modi, Ain, Ion e Iyon."
    - "Gli annali del re assiro elencano le città della Galilea da lui prese, ma il passo è rotto e Ion non vi si è conservata. Il sito è di solito identificato con Tell Dibbin, un tell nella pianura presso la città di Marjayoun i cui dintorni conservano il nome antico; nulla di quanto vi è stato trovato lo nomina, e l’identificazione poggia sul nome della pianura e sull’andamento della strada. A parte Giuseppe Flavio, che ripete la storia della scorreria di Ben-Adad e nomina Ion fra le città incendiate (Antichità giudaiche 8.305), nessuno scrittore posteriore la nomina."
    - "La pianura si trova oggi nel governatorato di Nabatieh nel Libano meridionale, a pochi chilometri dal confine israeliano, con la città in gran parte cristiana di Marjayoun e i villaggi di Dibbine e Khiam; il tell sorge fra i suoi campi."
  nl:
    - "Ijon was Israëls noordelijkste stad, in de kleine hoogvlakte ten noorden van de Hoelavallei tussen Litani en Hasbani, die als Marj Ayun, “de weide van bronnen”, nog haar naam draagt. Het bewaakte de weg van Dan naar het noorden richting de Bekaa en Damascus, en wordt alleen genoemd wanneer indringers die weg afdaalden. Vroeg in de 9e eeuw v.Chr. stuurde Ben-Hadad van Damascus, door Asa van Juda gehuurd tegen Baësa, zijn oversten, “en sloeg Ijon, en Dan, en Abel Beth-Maacha, en het ganse Cinneroth, met het ganse land Nafthali”; Kronieken heeft Abel-Maim voor Abel-Beth-Maächa. In 733–732 v.Chr. “kwam Tiglath-Pilezer, de koning van Assyrie, en nam Ijon in, en Abel-Beth-maacha, en Janoah, en Kedes, en Hazor, en Gilead, en Galilea, het ganse land van Nafthali; en hij voerde hen weg naar Assyrie”. De Synodale Bijbel schrijft de naam op drie manieren, Ain, Ion en Iyon."
    - "De eigen annalen van de Assyrische koning noemen de steden van Galilea die hij innam, maar de passage is gebroken en Ijon is erin niet bewaard. De plaats wordt gewoonlijk gehouden voor Tell Dibbin, een heuvel in de vlakte bij de stad Marjayoun, wier omgeving de oude naam bewaart; niets wat daar is gevonden noemt hem, en de identificatie berust op de naam van de vlakte en de ligging van de weg. Behalve Flavius Josephus, die het verhaal van Ben-Hadads strooptocht herhaalt en Ijon noemt onder de verbrande steden (Joodse Oudheden 8.305), noemt geen latere schrijver het."
    - "De vlakte ligt nu in het gouvernement Nabatieh in Zuid-Libanon, enkele kilometers van de Israëlische grens, met de grotendeels christelijke stad Marjayoun en de dorpen Dibbine en Khiam; de heuvel staat tussen de akkers."
  cs:
    - "Ijón bylo nejsevernější město Izraele, v malé vysoké rovině severně od údolí Chuly mezi Litání a Hasbání, která dosud nese jeho jméno jako Marj Ajún, „louka pramenů“. Střežilo cestu z Danu na sever k Bikáa a Damašku a jmenuje se jen tehdy, když po ní sestupovali útočníci. Počátkem 9. stol. př. n. l. Ben-hadad Damašský, najatý Asou Judským proti Baešovi Izraelskému, poslal své velitele a „dobyl Jon a Dan, též Abelbetmaachy, i všeho Ceneretu, a vší země Neftalím“; kronikář příběh opakuje s Ábel-majim místo Ábel-bét-maaky. V letech 733–732 př. n. l. „přitáhl Tiglatfalazar král Assyrský, a vzal Jon a Abel, dům Maacha a Janoe, Kedes a Azor, i Galád a Galilei, i všecku zemi Neftalím, a přenesl obyvatele jejich do Assyrie“. Synodální Bible píše jméno třemi způsoby, Ain, Ion a Iyon."
    - "Vlastní anály asyrského krále uvádějí galilejská města, která dobyl, ale pasáž je poškozená a Ijón se v ní nezachoval. Místo se obvykle pokládá za Tell Dibbin, pahorek v rovině u města Marjajún, jehož okolí zachovává starověké jméno; nic tam nalezeného jej nejmenuje a ztotožnění se opírá o jméno roviny a polohu cesty. Kromě Josepha, který opakuje příběh o nájezdu Ben-hadada a jmenuje Ijón mezi spálenými městy (Židovské starožitnosti 8.305), žádný pozdější pisatel jej nejmenuje."
    - "Rovina je dnes v gubernii Nabatíja v jižním Libanonu, několik kilometrů od izraelské hranice, s převážně křesťanským městem Marjajún a vesnicemi Dibbine a Chijám; pahorek stojí mezi jejími poli."
scripture:
