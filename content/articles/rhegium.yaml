body:
  en:
    - "Rhegium, today Reggio Calabria, stands on the Italian shore of the Strait of Messina, facing Sicily. It was a Greek colony founded by Chalcidians, joined by exiles from Messenia, whose families ruled it until the tyrant Anaxilas. Strabo explains the name by the old story, told by Aeschylus, that earthquakes had rent Sicily from the mainland here."
    - "On the last stage of Paul's voyage to Rome, after three days at Syracuse, his ship came up to the strait: “And from thence we fetched a compass, and came to Rhegium: and after one day the south wind blew, and we came the next day to Puteoli”. The ship waited a day at Rhegium for the south wind that carried it through the strait to Puteoli. The city is named only here in the Bible."
    - "Dionysius I of Syracuse destroyed the city, and his son rebuilt part of it; in the war with Pyrrhus its Campanian garrison broke faith and killed most of the citizens, and earthquakes ruined much of it shortly before the Marsic War. After Augustus drove Sextus Pompeius from Sicily he settled men from his fleet there, and Strabo calls the city fairly populous in his day. Its National Archaeological Museum of Magna Graecia now keeps the Riace bronzes, two Greek warriors of the fifth century BC found in the sea in 1972."
  ru:
    - "Ригия, ныне Реджо-ди-Калабрия, стоит на итальянском берегу Мессинского пролива напротив Сицилии. Это была греческая колония, основанная халкидянами, к которым присоединились изгнанники из Мессении; их роды правили городом до тирана Анаксилая. Страбон объясняет имя древним преданием, переданным Эсхилом, будто здесь землетрясения оторвали Сицилию от материка."
    - "На последнем отрезке пути Павла в Рим, простояв три дня в Сиракузах, корабль подошёл к проливу: «Оттуда отплыв, прибыли в Ригию; и как через день подул южный ветер, прибыли на второй день в Путеол». В Ригии корабль день ждал южного ветра, который пронёс его через пролив до Путеол. В Библии город назван только здесь."
    - "Дионисий I Сиракузский разрушил город, а его сын отстроил часть его; в войне с Пирром кампанский гарнизон нарушил договор и перебил большинство граждан, а незадолго до Марсийской войны землетрясения разрушили многое. Изгнав Секста Помпея из Сицилии, Август поселил здесь людей из своего флота, и Страбон называет город в своё время довольно многолюдным. В Национальном археологическом музее Великой Греции в Реджо хранятся бронзы из Риаче — две статуи греческих воинов V в. до н. э., найденные в море в 1972 г."
  uk:
    - "Регій, нині Реджо-ді-Калабрія, стоїть на італійському березі Мессінської протоки, навпроти Сицилії. Це була грецька колонія, заснована халкідянами, до яких приєдналися вигнанці з Мессенії, чиї роди правили нею аж до тирана Анаксіла. Страбон пояснює назву давньою історією, яку розповідав Есхіл, що землетруси відірвали тут Сицилію від материка."
    - "На останньому етапі плавання Павла до Рима, після трьох днів у Сиракузах, його корабель підійшов до протоки: «А звідтіля відпливши, прибули в Регию, і за один день, як настав полуденний вітер, прийшли другого дня в Путеоли». У Регії корабель вичікував день на південний вітер, який пронесе його крізь протоку до Путеол. Місто названо в Біблії лише тут."
    - "Діонісій I Сиракузький зруйнував місто, а його син частково відбудував; у війні з Пірром його кампанійський гарнізон порушив вірність і вбив більшість громадян, а землетруси сильно зруйнували його незадовго до Марсійської війни. Коли Август вигнав Секста Помпея з Сицилії, він оселив там людей зі свого флоту, і Страбон називає місто досить людним у його час. Його Національний археологічний музей Великої Греції нині зберігає бронзи з Ріаче, двох грецьких воїнів V ст. до н. е., знайдених у морі 1972 р."
  es:
    - "Regio, hoy Reggio Calabria, se alza en la orilla italiana del estrecho de Mesina, frente a Sicilia. Fue una colonia griega fundada por calcidios, a los que se unieron exiliados de Mesenia, cuyas familias la gobernaron hasta el tirano Anaxilas. Estrabón explica el nombre con la vieja historia, contada por Esquilo, de que los terremotos habían desgarrado aquí Sicilia del continente."
    - "En la última etapa del viaje de Pablo a Roma, tras tres días en Siracusa, su nave llegó al estrecho: «De allí, costeando alrededor, vinimos á Regio; y otro día después, soplando el austro, vinimos al segundo día á Puteolos». La nave esperó un día en Regio el viento del sur que la llevó por el estrecho hasta Puteoli. La ciudad solo se nombra aquí en la Biblia."
    - "Dionisio I de Siracusa destruyó la ciudad, y su hijo reconstruyó parte de ella; en la guerra con Pirro su guarnición campana rompió la fe y mató a la mayoría de los ciudadanos, y los terremotos la arruinaron en gran parte poco antes de la guerra Mársica. Después de que Augusto expulsara de Sicilia a Sexto Pompeyo, estableció allí a hombres de su flota, y Estrabón llama a la ciudad bastante populosa en su tiempo. Su Museo Arqueológico Nacional de la Magna Grecia custodia hoy los bronces de Riace, dos guerreros griegos del siglo V a. C. hallados en el mar en 1972."
  de:
    - "Rhegion, das heutige Reggio Calabria, liegt am italienischen Ufer der Straße von Messina, Sizilien gegenüber. Es war eine griechische Kolonie, von Chalkidiern gegründet und durch Verbannte aus Messenien verstärkt, deren Familien es bis zum Tyrannen Anaxilas beherrschten. Strabon erklärt den Namen mit der alten Geschichte, die Aischylos erzählt, dass Erdbeben hier Sizilien vom Festland gerissen hätten."
    - "Auf der letzten Etappe der Reise des Paulus nach Rom kam sein Schiff nach drei Tagen in Syrakus zur Meerenge: „Und da wir umschifften, kamen wir gen Rhegion; und nach einem Tage, da der Südwind sich erhob, kamen wir des andern Tages gen Puteoli.“ Das Schiff wartete in Rhegion einen Tag auf den Südwind, der es durch die Meerenge nach Puteoli trug. Die Stadt wird nur hier in der Bibel genannt."
    - "Dionysios I. von Syrakus zerstörte die Stadt, und sein Sohn baute einen Teil wieder auf; im Krieg mit Pyrrhos brach ihre kampanische Besatzung die Treue und tötete die meisten Bürger, und Erdbeben zerstörten einen großen Teil kurz vor dem Marsischen Krieg. Nachdem Augustus Sextus Pompeius aus Sizilien vertrieben hatte, siedelte er dort Männer seiner Flotte an, und Strabon nennt die Stadt zu seiner Zeit ziemlich bevölkert. Ihr Archäologisches Nationalmuseum der Magna Graecia bewahrt heute die Bronzen von Riace, zwei griechische Krieger des fünften Jahrhunderts v. Chr., die 1972 im Meer gefunden wurden."
  fr:
    - "Rhegium, aujourd’hui Reggio de Calabre, se dresse sur la rive italienne du détroit de Messine, face à la Sicile. C’était une colonie grecque fondée par des Chalcidiens, rejoints par des exilés de Messénie, dont les familles la gouvernèrent jusqu’au tyran Anaxilas. Strabon explique le nom par l’ancienne histoire, racontée par Eschyle, selon laquelle des séismes avaient arraché ici la Sicile au continent."
    - "Sur la dernière étape du voyage de Paul vers Rome, après trois jours à Syracuse, son navire parvint au détroit : « De là, en suivant la côte, nous atteignîmes Reggio ; et, le vent du midi s’étant levé le lendemain, nous fîmes en deux jours le trajet jusqu’à Pouzzoles ». Le navire attendit un jour à Rhegium le vent du sud qui le porta à travers le détroit jusqu’à Pouzzoles. La ville n’est nommée qu’ici dans la Bible."
    - "Denys Ier de Syracuse détruisit la ville, et son fils en rebâtit une partie ; dans la guerre contre Pyrrhus, sa garnison campanienne trahit la foi jurée et tua la plupart des citoyens, et des séismes la ruinèrent en grande partie peu avant la guerre sociale. Après qu’Auguste eut chassé Sextus Pompée de Sicile, il y établit des hommes de sa flotte, et Strabon appelle la ville assez peuplée de son temps. Son Musée archéologique national de la Grande Grèce conserve aujourd’hui les bronzes de Riace, deux guerriers grecs du Ve siècle av. J.-C. trouvés en mer en 1972."
  pt:
    - "Régio, hoje Reggio Calabria, fica na margem italiana do estreito de Messina, defronte da Sicília. Foi uma colônia grega fundada por calcídios, aos quais se juntaram exilados da Messênia, cujas famílias a governaram até o tirano Anaxilau. Estrabão explica o nome pela velha história, contada por Ésquilo, de que terremotos haviam separado a Sicília do continente ali."
    - "No último trecho da viagem de Paulo a Roma, depois de três dias em Siracusa, seu navio chegou ao estreito: “Dali, contornando a costa, chegamos a Régio. Depois de um dia, começou a soprar um vento sul, e no segundo dia chegamos a Putéoli”. O navio esperou um dia em Régio pelo vento sul que o levou pelo estreito até Putéoli. A cidade é mencionada somente aqui na Bíblia."
    - "Dionísio I de Siracusa destruiu a cidade, e seu filho reconstruiu parte dela; na guerra contra Pirro, sua guarnição campaniana traiu a confiança e matou a maioria dos cidadãos, e terremotos arruinaram grande parte dela pouco antes da Guerra Mársica. Depois que Augusto expulsou Sexto Pompeu da Sicília, estabeleceu ali homens de sua frota, e Estrabão chama a cidade de razoavelmente populosa em seu tempo. Seu Museu Arqueológico Nacional da Magna Grécia guarda hoje os bronzes de Riace, dois guerreiros gregos do século V a.C. encontrados no mar em 1972."
  it:
    - "Reggio, oggi Reggio Calabria, sorge sulla sponda italiana dello stretto di Messina, di fronte alla Sicilia. Fu una colonia greca fondata da Calcidesi, ai quali si unirono esuli della Messenia, le cui famiglie la governarono fino al tiranno Anassila. Strabone spiega il nome con l’antico racconto, narrato da Eschilo, secondo cui i terremoti avevano strappato qui la Sicilia dal continente."
    - "Nell’ultima tappa del viaggio di Paolo verso Roma, dopo tre giorni a Siracusa, la sua nave giunse allo stretto: «E di là, costeggiando, arrivammo a Reggio. E dopo un giorno, levatosi un vento di scirocco, in due giorni arrivammo a Pozzuoli». La nave attese un giorno a Reggio il vento di scirocco che la portò attraverso lo stretto fino a Pozzuoli. La città è nominata solo qui nella Bibbia."
    - "Dionisio I di Siracusa distrusse la città, e suo figlio ne ricostruì una parte; nella guerra con Pirro la sua guarnigione campana tradì la fede e uccise la maggior parte dei cittadini, e i terremoti la rovinarono in gran parte poco prima della guerra marsica. Dopo che Augusto ebbe scacciato Sesto Pompeo dalla Sicilia, vi stanziò uomini della sua flotta, e Strabone dice la città abbastanza popolosa ai suoi tempi. Il suo Museo archeologico nazionale della Magna Grecia conserva oggi i bronzi di Riace, due guerrieri greci del V secolo a.C. trovati in mare nel 1972."
  nl:
    - "Regium, tegenwoordig Reggio Calabria, ligt aan de Italiaanse oever van de Straat van Messina, tegenover Sicilië. Het was een Griekse kolonie gesticht door Chalcidiërs, vergezeld van ballingen uit Messenië, wier families er heersten tot de tiran Anaxilas. Strabo verklaart de naam met het oude verhaal, verteld door Aeschylus, dat aardbevingen hier Sicilië van het vasteland hadden losgescheurd."
    - "Op de laatste etappe van Paulus' reis naar Rome kwam zijn schip, na drie dagen te Syracuse, bij de zeestraat: “Van waar wij omvoeren, en kwamen aan te Regium; en alzo, na een dag, de wind zuid werd, kwamen wij den tweeden dag te Puteoli”. Het schip wachtte een dag te Regium op de zuidenwind die het door de zeestraat naar Puteoli bracht. De stad wordt in de Bijbel alleen hier genoemd."
    - "Dionysius I van Syracuse verwoestte de stad, en zijn zoon herbouwde een deel ervan; in de oorlog met Pyrrhus verbrak haar Campaanse garnizoen de trouw en doodde de meeste burgers, en aardbevingen richtten kort vóór de Bondgenotenoorlog veel schade aan. Nadat Augustus Sextus Pompeius uit Sicilië had verdreven, vestigde hij er mannen van zijn vloot, en Strabo noemt de stad in zijn tijd tamelijk dichtbevolkt. Het Nationaal Archeologisch Museum van Magna Graecia bewaart nu de bronzen van Riace, twee Griekse krijgers uit de vijfde eeuw v.Chr. die in 1972 in zee werden gevonden."
  pl:
    - "Regium, dziś Reggio Calabria, leży na włoskim brzegu Cieśniny Mesyńskiej, naprzeciw Sycylii. Była to kolonia grecka założona przez Chalcydyjczyków, do których dołączyli wygnańcy z Mesenii, a ich rody rządziły nią aż do tyrana Anaksilaosa. Strabon wyjaśnia nazwę dawną opowieścią, opowiadaną przez Ajschylosa, że trzęsienia ziemi oderwały tu Sycylię od lądu."
    - "W ostatnim etapie podróży Pawła do Rzymu, po trzech dniach w Syrakuzach, jego okręt dotarł do cieśniny: „A stamtąd płynąc kołem, przybyliśmy do Regijum, a po jednym dniu, gdy powstał wiatr południowy, wtórego dnia płynęliśmy do Puteolów”. Okręt czekał dzień w Regium na wiatr południowy, który poniósł go przez cieśninę do Puteoli. Miasto to jest wymienione w Biblii tylko tu."
    - "Dionizjusz I z Syrakuz zniszczył miasto, a jego syn odbudował jego część; w wojnie z Pyrrusem jego kampańska załoga złamała wierność i zabiła większość obywateli, a trzęsienia ziemi zrujnowały znaczną jego część krótko przed wojną marsyjską. Gdy August wypędził Sekstusa Pompejusza z Sycylii, osiedlił tam ludzi ze swej floty, a Strabon nazywa miasto dość ludnym w swoich czasach. Jego Narodowe Muzeum Archeologiczne Wielkiej Grecji przechowuje dziś brązy z Riace, dwóch greckich wojowników z V w. p.n.e. znalezionych w morzu w 1972 roku."
  cs:
    - "Regium, dnes Reggio di Calabria, stojí na italském břehu Messinského průlivu, naproti Sicílii. Byla to řecká kolonie založená Chalkiďany, k nimž se připojili vyhnanci z Messénie, jejichž rodiny jí vládly až do tyrana Anaxilá. Strabón vysvětluje jméno starým příběhem, který vypráví Aischylos, že zde zemětřesení odtrhla Sicílii od pevniny."
    - "Na poslední etapě Pavlovy plavby do Říma, po třech dnech v Syrakusách, připlula jeho loď k průlivu: „A odtud okolo plavíce se, přišli jsme do Regium; a po jednom dni, když vál vítr od poledne, druhý den přijeli jsme do Puteolos.“ Loď čekala v Regiu den na jižní vítr, který ji průlivem unesl do Puteol. Město je v Bibli jmenováno jen zde."
    - "Dionýsios I. Syrakuský město zničil a jeho syn část z něj znovu vystavěl; ve válce s Pyrrhem jeho kampánská posádka porušila věrnost a pobila většinu občanů a zemětřesení krátce před Marskou válkou město z velké části zničila. Poté, co Augustus vyhnal Sexta Pompeia ze Sicílie, usadil tam muže ze svého loďstva a Strabón nazývá město ve své době dosti lidnatým. Jeho Národní archeologické muzeum Magna Graecia dnes uchovává bronzy z Riace, dva řecké bojovníky z pátého století př. n. l., nalezené v moři roku 1972."
