# Overview article (ADR 0007). Mainstream facts only; the Egyptian mentions are given generally; the four candidate sites are listed without choosing, as the map does.
id: beth-anath
place: ae6cef8
title:
  en: "Beth-anath"
  ru: "Беф-Анаф"
  uk: "Бет-Анат"
  es: "Bet-anat"
  pt: "Bete-Anate"
  de: "Bet-Anat"
  fr: "Beth-Anath"
body:
  en:
    - "Beth-anath, “house of Anath”, was a Canaanite town of Upper Galilee named after the warrior goddess of the Ugaritic poems. Joshua counts it among the fortified cities of Naphtali, in the last group of his list: “Horem, and Beth-anath, and Beth-shemesh; nineteen cities with their villages”. Judges records that the tribe never took it: “Neither did Naphtali drive out the inhabitants of Beth-shemesh, nor the inhabitants of Beth-anath; but he dwelt among the Canaanites … nevertheless the inhabitants of Beth-shemesh and of Beth-anath became tributaries unto them”. A town of the same name stands in Egyptian lists of conquered places of the New Kingdom, among them one of Ramesses II in the thirteenth century BC, so it was a place of some note before Israel."
    - "Where it stood is disputed, and the Bible says nothing more about it. The name has been sought at Safed el-Battikh in southern Lebanon, north of the present border; at el-Bi'na (Bi'ina) in the Beit ha-Kerem valley of Galilee; at Aynata in Lebanon and at Hinah in Syria, on the sound of the name. None has been excavated with the question in mind, and the Baitanata of the Zenon papyri, where a Ptolemaic minister, Apollonius, had a vineyard estate in the third century BC, may or may not be the same place. The map's point is only the leading guess."
  ru:
    - "Беф-Анаф, «дом Анат», — ханаанский город Верхней Галилеи, названный по богине-воительнице угаритских поэм. Книга Иисуса Навина числит его среди укреплённых городов Неффалима, в последней группе списка: «Хорем, Беф-Анаф и Вефсамис: девятнадцать городов с их селами». Книга Судей сообщает, что колено так его и не взяло: «И Неффалим не изгнал жителей Вефсамиса и жителей Бефанафа и жил среди Хананеев, жителей земли той; жители же Вефсамиса и Бефанафа были его данниками». Город с тем же именем стоит в египетских списках покорённых мест Нового царства, среди них в списке Рамсеса II XIII века до н. э., так что ещё до Израиля это было заметное место."
    - "Где он стоял, спорно, и больше Библия о нём ничего не говорит. Имя искали в Сафад-эль-Баттихе на юге Ливана, к северу от нынешней границы; в Эль-Биине в долине Бейт-ха-Керем в Галилее; в Айнате в Ливане и в Хине в Сирии, по созвучию имени. Ни одно из этих мест не копали с этим вопросом, а Байтаната папирусов Зенона, где в III веке до н. э. было виноградное поместье птолемеевского министра Аполлония, может быть тем же местом, а может и не быть. Точка на карте — лишь ведущая догадка."
  uk:
    - "Бет-Анат, «дім Анат», було ханаанським містом Верхньої Галілеї, названим за богинею-воїтелькою угаритських поем. Ісус Навин зараховує його до укріплених міст Нефталима в останній групі свого переліку: «Горем, Бет-Аннат і Бетсамис — девятнайцять городів з їх селами». Книга Суддів записує, що плем'я ніколи його не взяло: «Нафталїй не повиганяв осадників Бет-Самиських й осадників Бет-Анама, і жив серед Канаанїїв, що державили землею; осадники ж Бет-Самиські зробились крепаками їх». Місто з тією самою назвою стоїть в єгипетських переліках підкорених місць Нового царства, серед них Рамсеса II у XIII столітті до н. е., тож це було місце певної ваги ще до Ізраїлю."
    - "Де воно стояло, спірне, і Біблія більше нічого про нього не каже. Назву шукали в Сафед-ель-Баттіху на півдні Лівану, на північ від нинішнього кордону; в ель-Бінні (Біїні) у долині Бейт-га-Керем у Галілеї; в Айнаті в Лівані і в Хіні в Сирії, за співзвучністю назви. Жодне не розкопували з огляду на це питання, і Байтанат з папірусів Зенона, де птолемеївський міністр Аполлоній мав виноградний маєток у III столітті до н. е., може бути або не бути тим самим місцем. Точка мапи — лише провідний здогад."
  es:
    - "Bet-anat, «casa de Anat», era una ciudad cananea de la Alta Galilea llamada así por la diosa guerrera de los poemas ugaríticos. Josué la cuenta entre las ciudades fortificadas de Neftalí, en el último grupo de su lista: «Horem, y Beth-anath, y Beth-semes: diez y nueve ciudades con sus aldeas». Jueces registra que la tribu nunca la tomó: «Tampoco Nephtalí echó á los que habitaban en Beth-semes, y á los que habitaban en Beth-anath, sino que moró entre los Cananeos que habitaban en la tierra ... mas fuéronle tributarios los moradores de Beth-semes, y los moradores de Beth-anath». Una ciudad del mismo nombre figura en listas egipcias de lugares conquistados del Reino Nuevo, entre ellas una de Ramsés II en el siglo XIII a. C., de modo que era un lugar de cierta importancia antes de Israel."
    - "Se discute dónde estuvo, y la Biblia no dice nada más sobre ella. El nombre se ha buscado en Safed el-Battikh, en el sur del Líbano, al norte de la actual frontera; en el-Bi'na (Bi'ina), en el valle de Beit ha-Kerem, en Galilea; en Aynata, en el Líbano, y en Hinah, en Siria, por el sonido del nombre. Ninguno ha sido excavado con esa cuestión en mente, y la Baitanata de los papiros de Zenón, donde un ministro ptolemaico, Apolonio, tenía una finca con viñedo en el siglo III a. C., puede ser o no el mismo lugar. El punto del mapa es solo la conjetura principal."
  pt:
    - "Bete-Anate, “casa de Anate”, era uma cidade cananeia da Alta Galileia, assim chamada pela deusa guerreira dos poemas de Ugarit. Josué a conta entre as cidades fortificadas de Naftali, no último grupo de sua lista: “Horém, Bete-Anate e Bete-Semes; dezenove cidades com as suas aldeias”. Juízes registra que a tribo nunca a tomou: “Naftali não expulsou os habitantes de Bete-Semes, nem os habitantes de Bete-Anate; mas viveu entre os cananeus … Contudo, os habitantes de Bete-Semes e de Bete-Anate foram sujeitos a trabalhos forçados”. Uma cidade do mesmo nome consta de listas egípcias de lugares conquistados do Novo Reino, entre elas uma de Ramsés II no século XIII a.C., de modo que era um lugar de certa nota antes de Israel."
    - "Onde ficava é discutido, e a Bíblia nada mais diz dela. O nome foi procurado em Safed el-Battikh, no sul do Líbano, ao norte da fronteira atual; em el-Bi'na (Bi'ina), no vale de Beit ha-Kerem, na Galileia; em Aynata, no Líbano, e em Hinah, na Síria, pelo som do nome. Nenhum foi escavado com a questão em mente, e a Baitanata dos papiros de Zenão, onde um ministro ptolemaico, Apolônio, tinha uma propriedade de vinhas no século III a.C., pode ou não ser o mesmo lugar. O ponto do mapa é apenas a conjetura principal."
  de:
    - "Bet-Anat, „Haus der Anat“, war eine kanaanäische Stadt in Obergaliläa, benannt nach der Kriegsgöttin der ugaritischen Dichtungen. Josua zählt sie zu den festen Städten Naftalis, in der letzten Gruppe seiner Liste: „Jereon, Migdal-El, Horem, Beth-Anath, Beth-Semes. Neunzehn Städte und ihre Dörfer“. Das Richterbuch verzeichnet, dass der Stamm sie nie einnahm: „Naphthali vertrieb die Einwohner nicht zu Beth-Semes noch zu Beth-Anath, sondern wohnte unter den Kanaanitern, die im Lande wohnten. Aber die zu Beth-Semes und zu Beth-Anath wurden zinsbar.“ Eine Stadt desselben Namens steht in ägyptischen Listen eroberter Orte des Neuen Reiches, darunter einer Ramses' II. im 13. Jahrhundert v. Chr., sie war also vor Israel ein Ort von einiger Bedeutung."
    - "Wo sie stand, ist umstritten, und die Bibel sagt nichts weiter über sie. Der Name wurde nach dem Klang in Safed el-Battich im Südlibanon gesucht, nördlich der heutigen Grenze; in el-Bi'na (Bi'ina) im Tal Bet ha-Kerem in Galiläa; in Aynata im Libanon und in Hinah in Syrien. Keiner wurde mit Blick auf die Frage ausgegraben, und das Baitanata der Zenon-Papyri, wo ein ptolemäischer Minister, Apollonios, im 3. Jahrhundert v. Chr. ein Weingut hatte, kann derselbe Ort sein oder nicht. Der Punkt auf der Karte ist nur die führende Vermutung."
  fr:
    - "Beth-Anath, « maison d’Anath », était une ville cananéenne de la Haute Galilée, nommée d’après la déesse guerrière des poèmes ougaritiques. Josué la compte parmi les villes fortes de Nephthali, dans le dernier groupe de sa liste : « Horem, Beth-Anath et Beth-Schémesch. Dix-neuf villes, et leurs villages ». Les Juges notent que la tribu ne la prit jamais : « Nephthali ne chassa point les habitants de Beth-Schémesch, ni les habitants de Beth-Anath, et il habita au milieu des Cananéens, habitants du pays, mais les habitants de Beth-Schémesch et de Beth-Anath furent assujettis à un tribut ». Une ville du même nom figure dans des listes égyptiennes de lieux conquis du Nouvel Empire, dont une de Ramsès II au XIIIe siècle av. J.-C. ; c’était donc un lieu de quelque renom avant Israël."
    - "Où elle se trouvait est discuté, et la Bible n’en dit rien de plus. Le nom a été cherché à Safed el-Battikh, dans le sud du Liban, au nord de la frontière actuelle ; à el-Bi’na (Bi’ina) dans la vallée de Beit ha-Kerem en Galilée ; à Aynata au Liban et à Hinah en Syrie, d’après la sonorité du nom. Aucun n’a été fouillé en vue de la question, et la Baitanata des papyrus de Zénon, où un ministre ptolémaïque, Apollonios, avait un domaine de vignes au IIIe siècle av. J.-C., peut être ou non le même lieu. Le point de la carte n’est que la principale conjecture."
scripture:
  - Josh.19.38
  - Judg.1.33
