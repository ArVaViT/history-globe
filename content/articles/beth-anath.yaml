body:
  en:
    - "Beth-anath, “house of Anath”, was a Canaanite town of Upper Galilee named after the warrior goddess of the Ugaritic poems. Joshua counts it among the fortified cities of Naphtali, in the last group of his list: “Horem, and Beth-anath, and Beth-shemesh; nineteen cities with their villages”. Judges records that the tribe never took it: “Neither did Naphtali drive out the inhabitants of Beth-shemesh, nor the inhabitants of Beth-anath; but he dwelt among the Canaanites … nevertheless the inhabitants of Beth-shemesh and of Beth-anath became tributaries unto them”. A town of the same name stands in Egyptian lists of conquered places of the New Kingdom, among them one of Ramesses II in the thirteenth century BC, so it was a place of some note before Israel."
    - "Where it stood is disputed, and the Bible says nothing more about it. The name has been sought at Safed el-Battikh in southern Lebanon, north of the present border; at el-Bi'na (Bi'ina) in the Beit ha-Kerem valley of Galilee; at Aynata in Lebanon, on the sound of the name; and at Hinah in Syria, below Mount Hermon. None has been excavated with the question in mind, and the Baitanata of the Zenon papyri, where a Ptolemaic minister, Apollonius, had a vineyard estate in the third century BC, may or may not be the same place. The map's point is only the leading guess."
  ru:
    - "Беф-Анаф, «дом Анат», — ханаанский город Верхней Галилеи, названный по богине-воительнице угаритских поэм. Книга Иисуса Навина числит его среди укреплённых городов Неффалима, в последней группе списка: «Хорем, Беф-Анаф и Вефсамис: девятнадцать городов с их селами». Книга Судей сообщает, что колено так его и не взяло: «И Неффалим не изгнал жителей Вефсамиса и жителей Бефанафа и жил среди Хананеев, жителей земли той; жители же Вефсамиса и Бефанафа были его данниками». Город с тем же именем стоит в египетских списках покорённых мест Нового царства, среди них в списке Рамсеса II XIII века до н. э., так что ещё до Израиля это было заметное место."
    - "Где он стоял, спорно, и больше Библия о нём ничего не говорит. Имя искали в Сафад-эль-Баттихе на юге Ливана, к северу от нынешней границы; в Эль-Биине в долине Бейт-ха-Керем в Галилее; в Айнате в Ливане, по созвучию имени; и в Хине в Сирии, под горой Ермон. Ни одно из этих мест не копали с этим вопросом, а Байтаната папирусов Зенона, где в III веке до н. э. было виноградное поместье птолемеевского министра Аполлония, может быть тем же местом, а может и не быть. Точка на карте — лишь ведущая догадка."
  uk:
    - "Бет-Анат, «дім Анат», було ханаанським містом Верхньої Галілеї, названим за богинею-воїтелькою угаритських поем. Ісус Навин зараховує його до укріплених міст Нефталима в останній групі свого переліку: «Горем, Бет-Аннат і Бетсамис — девятнайцять городів з їх селами». Книга Суддів записує, що плем'я ніколи його не взяло: «Нафталїй не повиганяв осадників Бет-Самиських й осадників Бет-Анама, і жив серед Канаанїїв, що державили землею; осадники ж Бет-Самиські зробились крепаками їх». Місто з тією самою назвою стоїть в єгипетських переліках підкорених місць Нового царства, серед них Рамсеса II у XIII столітті до н. е., тож це було місце певної ваги ще до Ізраїлю."
    - "Де воно стояло, спірне, і Біблія більше нічого про нього не каже. Назву шукали в Сафед-ель-Баттіху на півдні Лівану, на північ від нинішнього кордону; в ель-Бінні (Біїні) у долині Бейт-га-Керем у Галілеї; в Айнаті в Лівані, за співзвучністю назви; і в Хіні в Сирії, під горою Гермон. Жодне не розкопували з огляду на це питання, і Байтанат з папірусів Зенона, де птолемеївський міністр Аполлоній мав виноградний маєток у III столітті до н. е., може бути або не бути тим самим місцем. Точка мапи — лише провідний здогад."
  es:
    - "Bet-anat, «casa de Anat», era una ciudad cananea de la Alta Galilea llamada así por la diosa guerrera de los poemas ugaríticos. Josué la cuenta entre las ciudades fortificadas de Neftalí, en el último grupo de su lista: «Horem, y Beth-anath, y Beth-semes: diez y nueve ciudades con sus aldeas». Jueces registra que la tribu nunca la tomó: «Tampoco Nephtalí echó á los que habitaban en Beth-semes, y á los que habitaban en Beth-anath, sino que moró entre los Cananeos que habitaban en la tierra ... mas fuéronle tributarios los moradores de Beth-semes, y los moradores de Beth-anath». Una ciudad del mismo nombre figura en listas egipcias de lugares conquistados del Reino Nuevo, entre ellas una de Ramsés II en el siglo XIII a. C., de modo que era un lugar de cierta importancia antes de Israel."
    - "Se discute dónde estuvo, y la Biblia no dice nada más sobre ella. El nombre se ha buscado en Safed el-Battikh, en el sur del Líbano, al norte de la actual frontera; en el-Bi'na (Bi'ina), en el valle de Beit ha-Kerem, en Galilea; en Aynata, en el Líbano, por el sonido del nombre; y en Hinah, en Siria, al pie del monte Hermón. Ninguno ha sido excavado con esa cuestión en mente, y la Baitanata de los papiros de Zenón, donde un ministro ptolemaico, Apolonio, tenía una finca con viñedo en el siglo III a. C., puede ser o no el mismo lugar. El punto del mapa es solo la conjetura principal."
  pt:
    - "Bete-Anate, “casa de Anate”, era uma cidade cananeia da Alta Galileia, assim chamada pela deusa guerreira dos poemas de Ugarit. Josué a conta entre as cidades fortificadas de Naftali, no último grupo de sua lista: “Horém, Bete-Anate e Bete-Semes; dezenove cidades com as suas aldeias”. Juízes registra que a tribo nunca a tomou: “Naftali não expulsou os habitantes de Bete-Semes, nem os habitantes de Bete-Anate; mas viveu entre os cananeus … Contudo, os habitantes de Bete-Semes e de Bete-Anate foram sujeitos a trabalhos forçados”. Uma cidade do mesmo nome consta de listas egípcias de lugares conquistados do Novo Reino, entre elas uma de Ramsés II no século XIII a.C., de modo que era um lugar de certa nota antes de Israel."
    - "Onde ficava é discutido, e a Bíblia nada mais diz dela. O nome foi procurado em Safed el-Battikh, no sul do Líbano, ao norte da fronteira atual; em el-Bi'na (Bi'ina), no vale de Beit ha-Kerem, na Galileia; em Aynata, no Líbano, pelo som do nome; e em Hinah, na Síria, ao pé do monte Hermom. Nenhum foi escavado com a questão em mente, e a Baitanata dos papiros de Zenão, onde um ministro ptolemaico, Apolônio, tinha uma propriedade de vinhas no século III a.C., pode ou não ser o mesmo lugar. O ponto do mapa é apenas a conjetura principal."
  de:
    - "Bet-Anat, „Haus der Anat“, war eine kanaanäische Stadt in Obergaliläa, benannt nach der Kriegsgöttin der ugaritischen Dichtungen. Josua zählt sie zu den festen Städten Naftalis, in der letzten Gruppe seiner Liste: „Jereon, Migdal-El, Horem, Beth-Anath, Beth-Semes. Neunzehn Städte und ihre Dörfer“. Das Richterbuch verzeichnet, dass der Stamm sie nie einnahm: „Naphthali vertrieb die Einwohner nicht zu Beth-Semes noch zu Beth-Anath, sondern wohnte unter den Kanaanitern, die im Lande wohnten. Aber die zu Beth-Semes und zu Beth-Anath wurden zinsbar.“ Eine Stadt desselben Namens steht in ägyptischen Listen eroberter Orte des Neuen Reiches, darunter einer Ramses' II. im 13. Jahrhundert v. Chr., sie war also vor Israel ein Ort von einiger Bedeutung."
    - "Wo sie stand, ist umstritten, und die Bibel sagt nichts weiter über sie. Der Name wurde in Safed el-Battich im Südlibanon gesucht, nördlich der heutigen Grenze; in el-Bi'na (Bi'ina) im Tal Bet ha-Kerem in Galiläa; nach dem Klang in Aynata im Libanon; und in Hinah in Syrien, unterhalb des Hermon. Keiner wurde mit Blick auf die Frage ausgegraben, und das Baitanata der Zenon-Papyri, wo ein ptolemäischer Minister, Apollonios, im 3. Jahrhundert v. Chr. ein Weingut hatte, kann derselbe Ort sein oder nicht. Der Punkt auf der Karte ist nur die führende Vermutung."
  fr:
    - "Beth-Anath, « maison d’Anath », était une ville cananéenne de la Haute Galilée, nommée d’après la déesse guerrière des poèmes ougaritiques. Josué la compte parmi les villes fortes de Nephthali, dans le dernier groupe de sa liste : « Horem, Beth-Anath et Beth-Schémesch. Dix-neuf villes, et leurs villages ». Les Juges notent que la tribu ne la prit jamais : « Nephthali ne chassa point les habitants de Beth-Schémesch, ni les habitants de Beth-Anath, et il habita au milieu des Cananéens, habitants du pays, mais les habitants de Beth-Schémesch et de Beth-Anath furent assujettis à un tribut ». Une ville du même nom figure dans des listes égyptiennes de lieux conquis du Nouvel Empire, dont une de Ramsès II au XIIIe siècle av. J.-C. ; c’était donc un lieu de quelque renom avant Israël."
    - "Où elle se trouvait est discuté, et la Bible n’en dit rien de plus. Le nom a été cherché à Safed el-Battikh, dans le sud du Liban, au nord de la frontière actuelle ; à el-Bi’na (Bi’ina) dans la vallée de Beit ha-Kerem en Galilée ; à Aynata au Liban, d’après la sonorité du nom ; et à Hinah en Syrie, au pied du mont Hermon. Aucun n’a été fouillé en vue de la question, et la Baitanata des papyrus de Zénon, où un ministre ptolémaïque, Apollonios, avait un domaine de vignes au IIIe siècle av. J.-C., peut être ou non le même lieu. Le point de la carte n’est que la principale conjecture."
  it:
    - "Bet-Anat, «casa di Anat», era una città cananea dell’Alta Galilea che prendeva nome dalla dea guerriera dei poemi ugaritici. Giosuè la conta fra le città fortificate di Neftali, nell’ultimo gruppo del suo elenco: «Horem, Beth-Anath e Beth-Scemesh: diciannove città e i loro villaggi». I Giudici registrano che la tribù non la prese mai: «Neftali non cacciò gli abitanti di Beth-Scemesh, né gli abitanti di Beth-Anath, e si stabilì in mezzo ai Cananei che abitavano il paese; ma gli abitanti di Beth-Scemesh e di Beth-Anath furon da loro sottoposti a servitù». Una città dello stesso nome compare negli elenchi egizi di luoghi conquistati del Nuovo Regno, fra cui uno di Ramesse II nel XIII secolo a.C., così era un luogo di qualche rilievo prima di Israele."
    - "Dove sorgesse è discusso, e la Bibbia non ne dice altro. Il nome è stato cercato a Safed el-Battikh nel Libano meridionale, a nord dell’attuale confine; a el-Bi‘na (Bi‘ina) nella valle di Bet ha-Kerem in Galilea; ad Aynata in Libano, sul suono del nome; e a Hinah in Siria, ai piedi del monte Ermon. Nessuno è stato scavato con questa domanda in mente, e la Baitanata dei papiri di Zenone, dove un ministro tolemaico, Apollonio, aveva una tenuta con vigneto nel III secolo a.C., può essere o non essere lo stesso luogo. Il punto della carta è soltanto l’ipotesi principale."
  pl:
    - "Bet-Anat, „dom Anat”, było kananejskim miastem Górnej Galilei nazwanym od bogini wojny z poematów ugaryckich. Jozue zalicza je do miast obwarowanych Neftalego, w ostatniej grupie swego wykazu: „Horem, i Betanat, i Betsemes, miast dziewiętnaście, i wsi ich”. Księga Sędziów zapisuje, że pokolenie nigdy go nie zdobyło: „Neftalim też nie wypędził obywateli z Betsemes, ani obywateli z Betanat, i mieszkał między Chananejczykami mieszkającymi w onej ziemi; jednak obywatele Betsemes i Betanat byli hołdownikami ich”. Miasto o tej samej nazwie figuruje w egipskich wykazach zdobytych miejsc Nowego Państwa, wśród nich Ramzesa II w XIII wieku p.n.e., więc było miejscem pewnego znaczenia przed Izraelem."
    - "Gdzie stało, jest sporne, a Biblia nic więcej o nim nie mówi. Nazwy szukano w Safed el-Battikh w południowym Libanie, na północ od obecnej granicy; w el-Bi'na (Bi'ina) w dolinie Bejt ha-Kerem w Galilei; w Aynata w Libanie, na podstawie brzmienia nazwy; i w Hinah w Syrii, u stóp góry Hermon. Żadne nie było wykopywane z myślą o tym pytaniu, a Baitanata z papirusów Zenona, gdzie ptolemejski minister Apollonios miał w III wieku p.n.e. posiadłość z winnicą, może być lub nie tym samym miejscem. Punkt na mapie jest tylko wiodącym domysłem."
  nl:
    - "Beth-Anat, “huis van Anat”, was een Kanaänitische stad in Boven-Galilea, genoemd naar de krijgsgodin van de Ugaritische gedichten. Jozua rekent haar tot de versterkte steden van Naftali, in de laatste groep van zijn lijst: “Horem en Beth-Anath, en Beth-Semes; negentien steden en haar dorpen”. Richteren vermeldt dat de stam haar nooit innam: “Nafthali verdreef de inwoners van Beth-Semes niet, noch de inwoners van Beth-Anath, maar woonde in het midden der Kanaanieten, die in het land woonden; doch de inwoners van Beth-Semes en Beth-Anath werden hun cijnsbaar”. Een stad met dezelfde naam staat in Egyptische lijsten van veroverde plaatsen uit het Nieuwe Rijk, onder andere van Ramses II in de dertiende eeuw v.Chr., dus het was een plaats van enig aanzien vóór Israël."
    - "Waar het stond, is omstreden, en de Bijbel zegt er verder niets over. De naam is gezocht bij Safed el-Battikh in Zuid-Libanon, ten noorden van de huidige grens; bij el-Bi’na (Bi’ina) in de Beit ha-Kerem-vallei van Galilea; bij Aynata in Libanon, op grond van de klank van de naam; en bij Hinah in Syrië, aan de voet van de Hermon. Geen is opgegraven met de vraag in het achterhoofd, en het Baitanata van de Zenonpapyri, waar een Ptolemeïsche minister, Apollonius, in de derde eeuw v.Chr. een wijngaardlandgoed had, kan al dan niet dezelfde plaats zijn. Het punt op de kaart is slechts de voornaamste gissing."
  cs:
    - "Bét-anat, „dům Anat“, bylo kenaanské město v Horní Galileji pojmenované podle bojovné bohyně ugaritských básní. Jozue je počítá mezi opevněná města Neftalího, v poslední skupině svého seznamu: „Horem, Betanat a Betsemes, měst devatenácte i vsi jejich“. Kniha Soudců zaznamenává, že je kmen nikdy nedobyl: „Též Neftalím nevyhnal obyvatelů Betsemes, ani obyvatelů Betanat, protož bydlil mezi Kananajeskými přebývajícími v zemi té; a však obyvatelé Betsemes a Betanat dávali jim plat“. Město téhož jména stojí v egyptských seznamech dobytých míst Nové říše, mezi nimi v jednom seznamu Ramesse II. ve 13. století př. n. l., takže bylo místem jistého významu před Izraelem."
    - "Kde stálo, je sporné a Bible o něm neříká nic dalšího. Jméno se hledalo v Safed el-Battikh v jižním Libanonu, severně od dnešní hranice; v el-Bi'na (Bi'ina) v údolí Bet ha-Kerem v Galileji; v Aynata v Libanonu, podle znění jména; a v Hinah v Sýrii, pod horou Hermon. Žádné z nich nebylo vykopáno s touto otázkou na mysli a Baitanata ze Zenónových papyrů, kde měl ptolemaiovský ministr Apollónios ve 3. století př. n. l. vinařské panství, může a nemusí být týmž místem. Bod na mapě je jen předním dohadem."
  sv:
    - "Bet-Anat, ”Anats hus”, var en kananeisk stad i Övre Galileen uppkallad efter krigargudinnan i de ugaritiska dikterna. Josua räknar den bland Naftalis befästa städer, i förteckningens sista grupp: ”Horem, Bet-Anat och Bet-Semes -- nitton städer med deras byar”. Domarboken berättar att stammen aldrig intog den: ”Naftali fördrev icke invånarna i Bet-Semes, ej heller invånarna i Bet-Anat, utan bodde ibland kananéerna … men invånarna i Bet-Semes och Bet-Anat blevo arbetspliktiga åt dem”. En stad med samma namn står i egyptiska förteckningar över erövrade platser från Nya riket, bland dem en av Ramses II på 1200-talet f.Kr., så den var en plats av viss betydelse före Israel."
    - "Var den låg är omstritt, och Bibeln säger inget mer om den. Namnet har sökts vid Safed el-Battikh i södra Libanon, norr om den nuvarande gränsen; vid el-Bi'na (Bi'ina) i Beit HaKerem-dalen i Galileen; vid Aynata i Libanon, efter namnets ljud; och vid Hinah i Syrien, nedanför Hermon. Ingen har grävts ut med frågan i åtanke, och Baitanata i Zenonpapyrerna, där en ptolemaisk minister, Apollonios, hade ett vingårdsgods på 200-talet f.Kr., kan vara eller inte vara samma plats. Kartans punkt är bara den ledande gissningen."
  nb:
    - "Bet-Anat, «Anats hus», var en kana'anittisk by i Øvre Galilea oppkalt etter krigsgudinnen i de ugaritiske diktene. Josva regner den blant Naftalis befestede byer, i den siste gruppen i listen: «Horem og Bet-Anat og Bet-Semes, i alt nitten byer med tilhørende landsbyer». Dommerboken forteller at stammen aldri inntok den: «Naftali drev ikke bort innbyggerne i Bet-Semes og innbyggerne i Bet-Anat, men bosatte sig midt iblandt kana'anittene som bodde i landet, og innbyggerne i Bet-Semes og Bet-Anat blev arbeidspliktige under dem». En by med samme navn står i egyptiske lister over erobrede steder fra Det nye riket, blant dem en fra Ramesses II på 1200-tallet f.Kr., så den var et sted av en viss betydning før Israel."
    - "Hvor den lå, er omstridt, og Bibelen sier ikke mer om den. Navnet er søkt ved Safed el-Battikh i Sør-Libanon, nord for dagens grense; ved el-Bi'na (Bi'ina) i Beit ha-Kerem-dalen i Galilea; ved Aynata i Libanon, ut fra navnets klang; og ved Hinah i Syria, under Hermon. Ingen er gravd ut med spørsmålet for øye, og Baitanata i Zenon-papyrusene, der den ptolemeiske ministeren Apollonios hadde et vingårdsgods på 200-tallet f.Kr., kan eller kan ikke være det samme stedet. Kartets punkt er bare den ledende gjetningen."
  tl:
    - "Ang Beth-anath, “bahay ni Anat”, ay bayang Cananeo ng Itaas na Galilea na ipinangalan sa mandirigmang diyosa ng mga tulang Ugarit. Ibinibilang ito ni Josue sa mga nakukutaang lungsod ng Nephtali, sa huling pangkat ng kaniyang talaan: “Horem, at Beth-anath, at Beth-semes: labing siyam na bayan pati ng mga nayon ng mga yaon”. Itinatala ng Mga Hukom na hindi ito nasakop ng lipi: “Hindi pinalayas ng Nephtali ang mga nananahan sa Beth-semes, ni ang mga nananahan sa Beth-anath; kundi siya'y tumahan sa gitna ng mga Cananeo … gayon ma'y ang mga nananahan sa Beth-semes at nananahan sa Beth-anath ay naging mga tagapagpaatag sa kaniya”. Bayang may parehong pangalan ang nasa mga talaang Egipcio ng nasakop na lugar ng Bagong Kaharian, kabilang ang kay Ramesses II noong ika-13 siglo BK, kaya may kabantugan ito bago ang Israel."
    - "Pinagtatalunan kung saan ito nakatayo, at wala nang sinasabi ang Biblia tungkol dito. Hinanap ang pangalan sa Safed el-Battikh sa timog Libano, sa hilaga ng kasalukuyang hangganan; sa el-Bi'na (Bi'ina) sa libis ng Beit ha-Kerem sa Galilea; sa Aynata sa Libano, batay sa tunog ng pangalan; at sa Hinah sa Siria, sa ibaba ng Bundok Hermon. Wala sa mga ito ang hinukay na may tanong na ito sa isip, at ang Baitanata ng mga papirus ni Zenon, kung saan may ubasan ang ministrong Ptolomeo na si Apollonius noong ika-3 siglo BK, ay maaaring iisang lugar o hindi. Ang punto ng mapa ay ang nangungunang hula lamang."
scripture:
  - Josh.19.35
  - Josh.19.38
  - Judg.1.33
sources:
