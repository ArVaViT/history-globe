# Overview article (ADR 0007). Mainstream facts only; Succoth follows the usual but disputed identification with Tell Deir Alla; Iron Age dates follow the excavators' radiocarbon dates.
id: succoth
place: a0905b5
title:
  en: "Succoth"
  ru: "Сокхоф"
  uk: "Сокхот"
  es: "Sucot"
  pt: "Sucote"
  de: "Sukkot"
  fr: "Succoth"
  pl: "Sukkot"
  it: "Succot"
  nl: "Sukkot"
  cs: "Sukot"
body:
  en:
    - 'Succoth, whose name means "booths", is usually identified with Tell Deir Alla, a mound in the Jordan Valley about 8 km east of the river and 1 km north of the Jabbok. The Jerusalem Talmud says that Succoth is Tar''ala, a name that seems to live on in Deir Alla, and Nelson Glueck adopted the identification. No inscription found on the site names it, and Henk Franken, who began the excavations, accepted only that the district was the valley of Succoth, not that the mound was the town; the identification is therefore not certain.'
    - "Leiden University began digging the mound in 1960, later jointly with Jordan's Department of Antiquities and Yarmouk University. The excavated layers run from about 1700 BC. Through the Late Bronze Age a large sanctuary stood on an artificial platform, and Egyptian objects show ties with Egypt down to the days of Queen Tausret, about 1200 BC. In 1967 fragments of plaster written in ink were found in a village destroyed by an earthquake about 800 BC: a text about Balaam son of Beor, a seer of the gods, the same name as the prophet of Numbers. At nearby Tell el-Hammeh iron was already being smelted in the tenth century BC."
    - 'After parting from Esau, Jacob "journeyed to Succoth, and built him an house, and made booths for his cattle: therefore the name of the place is called Succoth." Joshua lists Succoth in the valley among the towns given to Gad, the rest of the kingdom of Sihon. When Gideon, pursuing the Midianite kings Zebah and Zalmunna, asked the men of Succoth for bread, its princes refused him; on his return he punished its elders with thorns of the wilderness. Solomon''s bronze vessels were cast in the clay ground of the Jordan plain between Succoth and Zarthan, and a psalm says, "I will divide Shechem, and mete out the valley of Succoth."'
    - "Settlement on the mound went on, with breaks, until about 400 BC, in the Persian period. Josephus wrote that the place where Jacob stopped was still called Tents in his day, and Jerome noted that a city of that name still stood beyond the Jordan in the region of Scythopolis. A Roman and Late Roman settlement, with columns and polished marble, lay about 300 m east of the tell."
  ru:
    - "Сокхоф, чьё имя значит «шалаши», обычно отождествляют с Телль-Дейр-Алла — холмом в долине Иордана примерно в 8 км к востоку от реки и в 1 км к северу от Иавока. Иерусалимский Талмуд говорит, что Сокхоф — это Тарала; это имя, по-видимому, сохранилось в названии Дейр-Алла, и Нельсон Глюк принял это отождествление. Ни одна найденная там надпись не называет это место, а Хенк Франкен, начавший раскопки, признавал лишь, что эта округа была долиной Сокхоф, но не что холм был самим городом; поэтому отождествление не бесспорно."
    - "Лейденский университет начал раскопки холма в 1960 г., позднее вместе с Департаментом древностей Иордании и Ярмукским университетом. Раскопанные слои начинаются около 1700 г. до н. э. На протяжении позднего бронзового века на искусственной платформе стояло большое святилище, а египетские предметы говорят о связях с Египтом вплоть до дней царицы Таусерт, около 1200 г. до н. э. В 1967 г. в селении, разрушенном землетрясением около 800 г. до н. э., нашли обломки штукатурки с надписью чернилами — текст о Валааме, сыне Веоровом, провидце богов; так же звали пророка из книги Чисел. На соседнем Телль-эль-Хамме уже в X веке до н. э. выплавляли железо."
    - "Расставшись с Исавом, «Иаков двинулся в Сокхоф, и построил себе дом, и для скота своего сделал шалаши. От сего он нарек имя месту: Сокхоф». Книга Иисуса Навина называет Сокхоф на долине среди городов, отданных колену Гадову, — остаток царства Сигона. Когда Гедеон, преследуя царей Мадиамских Зевея и Салмана, попросил у жителей Сокхофа хлеба, князья города отказали ему; возвратившись, он наказал старейшин терновником пустынным. Медные сосуды Соломона выливали в глинистой земле окрестности Иордана между Сокхофом и Цартаном, а псалом говорит: «разделю Сихем и долину Сокхоф размерю»."
    - "Жизнь на холме с перерывами продолжалась примерно до 400 г. до н. э., уже в персидское время. Иосиф Флавий писал, что место, где остановился Иаков, и в его дни называлось Шатрами, а Иероним отмечал, что город с таким именем всё ещё стоит за Иорданом, в области Скифополя. Римское и позднеримское поселение с колоннами и полированным мрамором лежало примерно в 300 м к востоку от холма."
  uk:
    - "Сокхот, чия назва означає «шатра», зазвичай ототожнюють із Телль-Дейр-Аллою, пагорбом у Йорданській долині приблизно за 8 км на схід від річки і за 1 км на північ від Яббока. Єрусалимський Талмуд каже, що Сокхот — це Тар’ала, назва, яка, здається, живе в Дейр-Аллі, і Нельсон Глюк прийняв це ототожнення. Жоден напис, знайдений на місці, не називає його, а Хенк Франкен, який почав розкопки, визнавав лише, що округа була долиною Сокхоту, а не що пагорб був містом; тому ототожнення не певне."
    - "Лейденський університет почав копати пагорб 1960 року, згодом спільно з Департаментом старожитностей Йорданії та Ярмукським університетом. Розкопані шари сягають приблизно 1700 р. до н. е. Протягом пізньої бронзової доби на штучній платформі стояло велике святилище, а єгипетські предмети свідчать про зв’язки з Єгиптом аж до днів цариці Таусерт, близько 1200 р. до н. е. У 1967 році в селищі, зруйнованому землетрусом близько 800 р. до н. е., знайшли уламки штукатурки з написом чорнилом: текст про Валаама, сина Веора, ясновидця богів — те саме ім’я, що й пророка з Книги Чисел. Поблизу, в Телль-ель-Хаммеху, залізо плавили вже в X ст. до н. е."
    - "Розлучившись з Ісавом, Яків «мандрував далїй у Суккот і побудовав собі домівку, а скотинї своїй поробив кущі. Тим і проложено прізвище врочищу тому Суккот». Ісус Навин зараховує Сокхот у долині до міст, даних Гадові, — до решти царства Сігона. Коли Гедеон, переслідуючи мадіамських царів Зевея й Салмана, попросив у людей Сокхоту хліба, його старшини відмовили йому; повернувшись, він покарав його старших терням пустелі. Мідні посудини Соломона відлили в глиняному ґрунті Йорданської рівнини між Сокхотом і Зартаном, а псалом каже: «роздїлю Сихему, і розміряю долину Сукот»."
    - "Поселення на пагорбі тривало, з перервами, до близько 400 р. до н. е., в перську добу. Йосиф Флавій писав, що місце, де зупинився Яків, у його дні ще називалося Шатра, а Ієронім зазначав, що місто з такою назвою ще стояло по той бік Йордану в околиці Скіфополя. Римське й пізньоримське поселення з колонами та поліруваним мармуром лежало приблизно за 300 м на схід від телю."
  es:
    - "Sucot, cuyo nombre significa «cabañas», se identifica habitualmente con Tell Deir Alla, un montículo del valle del Jordán a unos 8 km al este del río y 1 km al norte del Jaboc. El Talmud de Jerusalén dice que Sucot es Tar'ala, un nombre que parece pervivir en Deir Alla, y Nelson Glueck adoptó la identificación. Ninguna inscripción hallada en el sitio lo nombra, y Henk Franken, que inició las excavaciones, solo aceptó que el distrito era el valle de Sucot, no que el montículo fuera la ciudad; la identificación no es, por tanto, segura."
    - "La Universidad de Leiden empezó a excavar el montículo en 1960, más tarde junto con el Departamento de Antigüedades de Jordania y la Universidad de Yarmuk. Los estratos excavados se remontan hasta cerca de 1700 a. C. Durante el Bronce Final hubo un gran santuario sobre una plataforma artificial, y objetos egipcios muestran vínculos con Egipto hasta los días de la reina Tausert, hacia 1200 a. C. En 1967 se hallaron fragmentos de yeso escritos con tinta en una aldea destruida por un terremoto hacia 800 a. C.: un texto sobre Balaam hijo de Beor, vidente de los dioses, el mismo nombre que el del profeta de Números. En la cercana Tell el-Hammeh ya se fundía hierro en el siglo X a. C."
    - "Tras separarse de Esaú, Jacob «se partió á Succoth, y edificó allí casa para sí, é hizo cabañas para su ganado: por tanto llamó el nombre de aquel lugar Succoth». Josué enumera Sucot, en el valle, entre las ciudades dadas a Gad, resto del reino de Sehón. Cuando Gedeón, que perseguía a los reyes madianitas Zeba y Zalmuna, pidió pan a los hombres de Sucot, sus principales se lo negaron; a su vuelta castigó a sus ancianos con espinas del desierto. Los utensilios de bronce de Salomón se fundieron en el suelo arcilloso de la llanura del Jordán, entre Sucot y Sartán, y un salmo dice: «partiré á Sichêm, y mediré el valle de Succoth»."
    - "El asentamiento en el montículo continuó, con interrupciones, hasta hacia 400 a. C., en el período persa. Josefo escribió que el lugar donde se detuvo Jacob aún se llamaba Tiendas en su tiempo, y Jerónimo anotó que todavía existía al otro lado del Jordán, en la región de Escitópolis, una ciudad con ese nombre. Un asentamiento romano y tardorromano, con columnas y mármol pulido, se extendía a unos 300 m al este del tel."
  pt:
    - "Sucote, cujo nome significa “tendas”, costuma ser identificada com Tell Deir Alla, um monte no vale do Jordão, cerca de 8 km a leste do rio e 1 km ao norte do Jaboque. O Talmude de Jerusalém diz que Sucote é Tar'ala, nome que parece sobreviver em Deir Alla, e Nelson Glueck adotou a identificação. Nenhuma inscrição achada no sítio a nomeia, e Henk Franken, que iniciou as escavações, aceitou apenas que o distrito era o vale de Sucote, não que o monte fosse a cidade; a identificação, portanto, não é certa."
    - "A Universidade de Leiden começou a escavar o monte em 1960, depois em conjunto com o Departamento de Antiguidades da Jordânia e a Universidade de Yarmouk. As camadas escavadas vão de cerca de 1700 a.C. Durante o Bronze Final, um grande santuário ergueu-se sobre uma plataforma artificial, e objetos egípcios mostram laços com o Egito até os dias da rainha Tausret, por volta de 1200 a.C. Em 1967 foram achados fragmentos de reboco escritos a tinta numa aldeia destruída por um terremoto por volta de 800 a.C.: um texto sobre Balaão, filho de Beor, vidente dos deuses, o mesmo nome do profeta de Números. Em Tell el-Hammeh, ali perto, o ferro já era fundido no século X a.C."
    - "Depois de separar-se de Esaú, Jacó “viajou para Sucote, construiu uma casa para si, e fez abrigos para o seu gado. Por isso o nome do lugar é chamado Sucote”. Josué lista Sucote, no vale, entre as cidades dadas a Gade, o resto do reino de Seom. Quando Gideão, perseguindo os reis midianitas Zeba e Zalmuna, pediu pão aos homens de Sucote, seus príncipes o recusaram; na volta, ele castigou os anciãos com espinhos do deserto. Os utensílios de bronze de Salomão foram fundidos no solo argiloso da planície do Jordão entre Sucote e Zaretã, e um salmo diz: “Dividirei Siquém, e medirei o vale de Sucote”."
    - "O povoamento do monte continuou, com interrupções, até cerca de 400 a.C., no período persa. Josefo escreveu que o lugar onde Jacó parou ainda se chamava Tendas em seus dias, e Jerônimo notou que uma cidade com esse nome ainda existia além do Jordão, na região de Citópolis. Um povoado romano e romano tardio, com colunas e mármore polido, ficava a cerca de 300 m a leste do tel."
  de:
    - "Sukkot, dessen Name „Hütten“ bedeutet, wird meist mit Tell Deir Alla gleichgesetzt, einem Hügel im Jordantal etwa 8 km östlich des Flusses und 1 km nördlich des Jabbok. Der Jerusalemer Talmud sagt, Sukkot sei Tar'ala, ein Name, der in Deir Alla fortzuleben scheint, und Nelson Glueck übernahm die Gleichsetzung. Keine auf dem Platz gefundene Inschrift nennt ihn, und Henk Franken, der die Grabungen begann, räumte nur ein, dass die Gegend das Tal Sukkot war, nicht dass der Hügel die Stadt war; die Gleichsetzung ist daher nicht gesichert."
    - "Die Universität Leiden begann 1960 mit der Grabung, später gemeinsam mit der jordanischen Altertümerverwaltung und der Yarmouk-Universität. Die ausgegrabenen Schichten reichen bis etwa 1700 v. Chr. zurück. In der Spätbronzezeit stand auf einer künstlichen Plattform ein großes Heiligtum, und ägyptische Objekte zeigen Verbindungen nach Ägypten bis in die Zeit der Königin Tausret um 1200 v. Chr. 1967 fand man in einem um 800 v. Chr. durch ein Erdbeben zerstörten Dorf Putzfragmente mit Tintenschrift: einen Text über Bileam, Sohn Beors, einen Seher der Götter, denselben Namen wie der Prophet im Buch Numeri. Im nahen Tell el-Hammeh wurde schon im zehnten Jahrhundert v. Chr. Eisen verhüttet."
    - "Nach der Trennung von Esau heißt es: „Und Jakob zog gen Sukkoth und baute sich ein Haus und machte seinem Vieh Hütten; daher heißt die Stätte Sukkoth“. Josua führt Sukkot im Tal unter den Städten auf, die Gad gegeben wurden, dem Rest des Reiches Sihons. Als Gideon auf der Verfolgung der midianitischen Könige Sebach und Zalmunna die Leute von Sukkot um Brot bat, verweigerten ihre Obersten es ihm; bei seiner Rückkehr züchtigte er ihre Ältesten mit Dornen aus der Wüste. Salomos Bronzegefäße wurden in der tonigen Erde der Jordanebene zwischen Sukkot und Zaretan gegossen, und ein Psalm sagt: „und will teilen Sichem und abmessen das Tal Sukkoth“."
    - "Die Besiedlung des Hügels dauerte mit Unterbrechungen bis etwa 400 v. Chr., in die Perserzeit. Josephus schrieb, der Ort, wo Jakob haltmachte, heiße zu seiner Zeit noch Zelte, und Hieronymus vermerkte, dass jenseits des Jordans im Gebiet von Skythopolis noch eine Stadt dieses Namens stand. Eine römische und spätrömische Siedlung mit Säulen und poliertem Marmor lag etwa 300 m östlich des Tell."
  fr:
    - "Succoth, dont le nom signifie « cabanes », est d’ordinaire identifiée à Tell Deir Alla, un tertre de la vallée du Jourdain à environ 8 km à l’est du fleuve et à 1 km au nord du Jabbok. Le Talmud de Jérusalem dit que Succoth est Tar’ala, nom qui semble survivre dans Deir Alla, et Nelson Glueck adopta l’identification. Aucune inscription trouvée sur le site ne le nomme, et Henk Franken, qui ouvrit les fouilles, admit seulement que le district était la vallée de Succoth, non que le tertre fût la ville ; l’identification n’est donc pas certaine."
    - "L’université de Leyde commença à fouiller le tertre en 1960, plus tard conjointement avec le Département des Antiquités de Jordanie et l’université du Yarmouk. Les couches fouillées remontent à environ 1700 av. J.-C. Pendant le bronze récent, un grand sanctuaire se dressait sur une plate-forme artificielle, et des objets égyptiens montrent des liens avec l’Égypte jusqu’au temps de la reine Taousret, vers 1200 av. J.-C. En 1967, on trouva des fragments d’enduit écrits à l’encre dans un village détruit par un séisme vers 800 av. J.-C. : un texte sur Balaam fils de Beor, voyant des dieux, du même nom que le prophète des Nombres. À Tell el-Hammeh, tout près, on fondait déjà du fer au Xe siècle av. J.-C."
    - "Après s’être séparé d’Ésaü, Jacob « partit pour Succoth. Il bâtit une maison pour lui, et il fit des cabanes pour ses troupeaux. C’est pourquoi l’on a appelé ce lieu du nom de Succoth. » Josué range Succoth dans la vallée parmi les villes données à Gad, reste du royaume de Sihon. Quand Gédéon, poursuivant les rois madianites Zébach et Tsalmunna, demanda du pain aux gens de Succoth, ses chefs le lui refusèrent ; à son retour, il châtia ses anciens avec des épines du désert. Les ustensiles d’airain de Salomon furent fondus dans le sol argileux de la plaine du Jourdain entre Succoth et Tsarthan, et un psaume dit : « je partagerai Sichem, je mesurerai la vallée de Succoth »."
    - "L’occupation du tertre se poursuivit, avec des interruptions, jusque vers 400 av. J.-C., à l’époque perse. Josèphe écrivit que le lieu où Jacob s’était arrêté s’appelait encore Tentes de son temps, et Jérôme nota qu’une ville de ce nom subsistait au-delà du Jourdain, dans la région de Scythopolis. Un établissement romain et du Bas-Empire, avec colonnes et marbre poli, se trouvait à environ 300 m à l’est du tell."
  pl:
    - "Sukkot, którego nazwa znaczy „szałasy”, utożsamia się zwykle z Tell Deir Alla, kopcem w dolinie Jordanu, około 8 km na wschód od rzeki i 1 km na północ od Jabboku. Talmud jerozolimski mówi, że Sukkot to Tar'ala, nazwa, która zdaje się żyć dalej w Deir Alla, a Nelson Glueck przyjął to utożsamienie. Żadna inskrypcja znaleziona na stanowisku go nie wymienia, a Henk Franken, który zaczął wykopaliska, przyjął tylko, że okręg był doliną Sukkot, nie zaś że kopiec był miastem; utożsamienie nie jest więc pewne."
    - "Uniwersytet w Lejdzie zaczął kopać kopiec w 1960 roku, później wspólnie z jordańskim Departamentem Starożytności i Uniwersytetem Jarmuk. Odkryte warstwy sięgają około 1700 roku p.n.e. Przez późną epokę brązu stało tu wielkie sanktuarium na sztucznej platformie, a egipskie przedmioty świadczą o związkach z Egiptem aż do czasów królowej Tauseret, około 1200 roku p.n.e. W 1967 roku w wiosce zniszczonej przez trzęsienie ziemi około 800 roku p.n.e. znaleziono fragmenty tynku pisane atramentem: tekst o Balaamie, synu Beora, widzącym bogów, o tym samym imieniu co prorok z Księgi Liczb. W pobliskim Tell el-Hamme żelazo wytapiano już w X wieku p.n.e."
    - "Po rozstaniu z Ezawem Jakub „obrócił się do Suchot, i zbudował sobie dom, i dla stad swoich poczynił obory, a dla tego nazwał imię miejsca onego Suchot.” Jozue wymienia Sukkot w dolinie wśród miast danych Gadowi, resztę królestwa Sychona. Gdy Gedeon, ścigając królów madianickich Zebacha i Salmunnę, poprosił mieszkańców Sukkot o chleb, ich przedniejsi mu odmówili; po powrocie ukarał ich starszych cierniami z pustyni. Spiżowe naczynia Salomona odlewano w gliniastej ziemi równiny Jordanu między Sukkot a Sartanem, a psalm mówi: „rozdzielę Sychem, i dolinę Sukkotską pomierzę”."
    - "Osadnictwo na kopcu trwało, z przerwami, aż do około 400 roku p.n.e., w okresie perskim. Józef Flawiusz pisał, że miejsce, w którym zatrzymał się Jakub, w jego czasach nadal nazywano Namiotami, a Hieronim zaznaczył, że miasto o tej nazwie nadal stoi za Jordanem w okolicy Scytopolis. Osada rzymska i późnorzymska, z kolumnami i polerowanym marmurem, leżała około 300 m na wschód od telu."
  it:
    - "Succot, il cui nome significa «capanne», è di solito identificata con Tell Deir Alla, un tell nella valle del Giordano a circa 8 km a est del fiume e 1 km a nord dello Iabbok. Il Talmud di Gerusalemme dice che Succot è Tar’ala, nome che sembra sopravvivere in Deir Alla, e Nelson Glueck adottò l’identificazione. Nessuna iscrizione trovata nel sito la nomina, e Henk Franken, che iniziò gli scavi, ammise soltanto che il distretto fosse la valle di Succot, non che il tell fosse la città; l’identificazione non è dunque certa."
    - "L’Università di Leida iniziò a scavare il tell nel 1960, poi insieme al Dipartimento delle antichità di Giordania e all’Università dello Yarmouk. Gli strati scavati partono da circa il 1700 a.C. Per tutto il Bronzo Tardo un grande santuario sorgeva su una piattaforma artificiale, e oggetti egiziani mostrano legami con l’Egitto fino ai tempi della regina Tausret, verso il 1200 a.C. Nel 1967, in un villaggio distrutto da un terremoto verso l’800 a.C., furono trovati frammenti di intonaco scritti a inchiostro: un testo su Balaam figlio di Beor, veggente degli dèi, lo stesso nome del profeta dei Numeri. A Tell el-Hammeh vicino il ferro era già fuso nel X secolo a.C."
    - "Dopo essersi separato da Esaù, Giacobbe «partì alla volta di Succoth e edificò una casa per sé, e fece delle capanne per il suo bestiame; e per questo quel luogo fu chiamato Succoth». Giosuè elenca Succot nella valle fra le città date a Gad, resto del regno di Sicon. Quando Gedeone, inseguendo i re di Madian Zebach e Zalmunna, chiese pane agli uomini di Succot, i loro capi glielo rifiutarono; al ritorno egli punì i loro anziani con le spine del deserto. I vasi di bronzo di Salomone furono fusi nel suolo argilloso della pianura del Giordano fra Succot e Sartan, e un salmo dice: «spartirò Sichem e misurerò la valle di Succot»."
    - "L’insediamento sul tell continuò, con interruzioni, fino a circa il 400 a.C., in epoca persiana. Giuseppe Flavio scrisse che il luogo dove Giacobbe si fermò si chiamava ancora Tende ai suoi tempi, e Girolamo notò che oltre il Giordano, nella regione di Scitopoli, esisteva ancora una città con quel nome. Un insediamento romano e tardo-romano, con colonne e marmi levigati, giaceva a circa 300 m a est del tell."
  nl:
    - "Sukkot, waarvan de naam “hutten” betekent, wordt gewoonlijk vereenzelvigd met Tell Deir Alla, een heuvel in de Jordaanvallei, ongeveer 8 km ten oosten van de rivier en 1 km ten noorden van de Jabbok. De Jeruzalemse Talmoed zegt dat Sukkot Tar’ala is, een naam die in Deir Alla lijkt voort te leven, en Nelson Glueck nam de gelijkstelling over. Geen opschrift dat op de plek is gevonden noemt het, en Henk Franken, die de opgravingen begon, aanvaardde alleen dat het district het dal van Sukkot was, niet dat de heuvel de stad was; de gelijkstelling is dus niet zeker."
    - "De Universiteit Leiden begon in 1960 met het graven op de heuvel, later samen met het Jordaanse Departement van Oudheden en de Yarmouk-universiteit. De opgegraven lagen lopen vanaf omstreeks 1700 v.Chr. Gedurende de Late Bronstijd stond er een groot heiligdom op een kunstmatig platform, en Egyptische voorwerpen tonen banden met Egypte tot in de dagen van koningin Tausret, omstreeks 1200 v.Chr. In 1967 werden in een dorp dat omstreeks 800 v.Chr. door een aardbeving werd verwoest, stukken pleisterwerk met inkt beschreven gevonden: een tekst over Bileam, zoon van Beor, een ziener van de goden, dezelfde naam als die van de profeet in Numeri. Bij het nabijgelegen Tell el-Hammeh werd in de 10e eeuw v.Chr. al ijzer gesmolten."
    - "Na zijn afscheid van Ezau: “Jakob reisde naar Sukkoth, en bouwde een huis voor zich, en maakte hutten voor zijn vee; daarom noemde hij den naam dier plaats Sukkoth.” Jozua noemt Sukkot in het dal onder de steden die aan Gad werden gegeven, het overige van het koninkrijk van Sihon. Toen Gideon, die de Midianitische koningen Zebach en Zalmunna achtervolgde, de mannen van Sukkot om brood vroeg, weigerden hun oversten hem; bij zijn terugkeer strafte hij hun oudsten met doornen der woestijn. De bronzen voorwerpen van Salomo werden gegoten in de kleigrond van de Jordaanvlakte tussen Sukkot en Zarthan, en een psalm zegt: “ik zal Sichem delen, en het dal van Sukkoth zal ik afmeten.”"
    - "De bewoning van de heuvel ging, met onderbrekingen, door tot omstreeks 400 v.Chr., in de Perzische tijd. Flavius Josephus schreef dat de plaats waar Jakob halt hield in zijn tijd nog Tenten heette, en Hieronymus merkte op dat een stad met die naam nog bestond aan de overkant van de Jordaan, in het gebied van Scythopolis. Een Romeinse en laat-Romeinse nederzetting, met zuilen en gepolijst marmer, lag ongeveer 300 m ten oosten van de tel."
  cs:
    - "Sukot, jehož jméno znamená „boudy“, bývá ztotožňován s Tell Dér Alla, pahorkem v Jordánském údolí asi 8 km východně od řeky a 1 km severně od Jaboku. Jeruzalémský talmud říká, že Sukot je Tar'ala, jméno, které jako by žilo dál v Dér Alla, a Nelson Glueck toto ztotožnění přijal. Žádný nápis nalezený na lokalitě ji nejmenuje a Henk Franken, který vykopávky zahájil, připustil jen to, že oblast byla údolím Sukot, nikoli že pahorek byl městem; ztotožnění proto není jisté."
    - "Leidenská univerzita začala pahorek kopat v roce 1960, později společně s jordánským odborem starožitností a Jarmúckou univerzitou. Odkryté vrstvy sahají od zhruba roku 1700 př. n. l. Po celou pozdní dobu bronzovou stála na umělé plošině rozlehlá svatyně a egyptské předměty ukazují styky s Egyptem až do dob královny Tausret, kolem roku 1200 př. n. l. V roce 1967 byly ve vesnici zničené zemětřesením kolem roku 800 př. n. l. nalezeny úlomky omítky psané inkoustem: text o Bileámovi, synu Beórově, věštci bohů, tedy stejné jméno jako u proroka z Knihy Numeri. V nedalekém Tell el-Hammé se železo tavilo už v 10. stol. př. n. l."
    - "Po rozchodu s Ezauem Jákob „bral se do Sochot, a ustavěl sobě dům, a dobytku svému zdělal stáje; protož nazval jméno místa toho Sochot“. Jozue uvádí Sukot v údolí mezi městy daným Gádovi, ostatkem království Sichonova. Když Gedeon, pronásledující madiánské krále Zebacha a Calmunu, požádal muže ze Sukot o chléb, jejich knížata mu odepřela; při návratu potrestal jejich starší trním z pouště. Šalomounovy bronzové nádoby byly odlity v jílovité zemi Jordánské roviny mezi Sukot a Sartanem a žalm praví: „budu děliti Sichem, a údolí Sochot rozměřím“."
    - "Osídlení pahorku pokračovalo, s přestávkami, do zhruba roku 400 př. n. l., do perského období. Josephus psal, že místo, kde se Jákob zastavil, se ještě za jeho dnů nazývalo Stany, a Jeroným poznamenal, že město toho jména tam za Jordánem v oblasti Skythopole dosud stálo. Římské a pozdně římské osídlení se sloupy a leštěným mramorem leželo asi 300 m východně od telu."
