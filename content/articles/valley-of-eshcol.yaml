# Overview article (ADR 0007). Mainstream facts only; the valley is unlocated and the app's candidates near Hebron are named without choosing; the Synodal verse numbering of Numbers 13 is noted.
id: valley-of-eshcol
place: a38ecff
title:
  en: "Valley of Eshcol"
  ru: "Долина Есхол"
  uk: "Долина Есхол"
  es: "Valle de Escol"
  pt: "Vale de Escol"
  de: "Tal Eschkol"
  fr: "Vallée d’Eschcol"
body:
  en:
    - "The valley of Eshcol is the place near Hebron where the twelve spies cut the cluster of grapes that they carried back to the camp. Eshcol means cluster, and Numbers says the valley was named from that cluster; Genesis knows an Amorite Eshcol, brother of Mamre, among Abram's allies at Hebron, and the valley may rather have borne his name. The hills about Hebron are still Judah's vineyard country. Tradition and most scholars look just north and north-west of the city: the map marks the Hebron neighbourhood, the hill of Burj el-Haska, the spring of Ain Eshkali, whose name may be the old one, and the environs of Mamre; Eusebius, by contrast, reports that it was said to be at Gophna, north of Jerusalem. None of these can be proved."
    - "The spies “ascended by the south, and came unto Hebron” and then “came unto the brook of Eshcol, and cut down from thence a branch with one cluster of grapes, and they bare it between two upon a staff; and they brought of the pomegranates, and of the figs”. The Synodal Bible counts these verses as 23 and 24 of the chapter. They showed the fruit and said, “It is a good land which the LORD our God doth give us”, and then frightened the people with its giants and walled cities."
    - "Moses twice recalls the place: the spies “went up unto the valley of Eshcol, and saw the land” and “discouraged the heart of the children of Israel”, and in Deuteronomy, “they turned and went up into the mountain, and came unto the valley of Eshcol, and searched it out”. The two spies with their cluster on a pole became in modern Israel the emblem of its tourism ministry. The ground itself is the northern outskirts of Hebron in the West Bank, where the vineyards on the road to Halhul lie among the candidates."
  ru:
    - "Долина Есхол — место близ Хеврона, где двенадцать соглядатаев срезали виноградную кисть и понесли её в стан. Есхол значит «кисть», и книга Чисел говорит, что долину назвали по той кисти; Бытие знает Аморрея Есхола, брата Мамрия, среди союзников Аврама в Хевроне, и долина могла носить скорее его имя. Горы вокруг Хеврона и теперь — виноградный край Иудеи. Предание и большинство учёных смотрят чуть севернее и северо-западнее города: на карте отмечены окрестности Хеврона, холм Бурдж-эль-Хаска, источник Айн-Эшкали, чьё имя может быть древним, и окрестности Мамре; Евсевий же передаёт, что её указывали у Гофны, к северу от Иерусалима. Ни одно из этих мест нельзя доказать."
    - "Соглядатаи «пошли в южную страну, и дошли до Хеврона» и затем «пришли к долине Есхол, и осмотрели ее, и срезали там виноградную ветвь с одною кистью ягод, и понесли ее на шесте двое; взяли также гранатовых яблок и смокв». В Синодальном переводе это стихи 23 и 24 главы. Они показали плоды и сказали: «хороша земля, которую Господь, Бог наш, дает нам», а потом напугали народ её исполинами и укреплёнными городами."
    - "Моисей дважды вспоминает это место: соглядатаи «доходили до долины Есхол, и видели землю, и отвратили сердце сынов Израилевых», а во Второзаконии: «Они пошли, взошли на гору и дошли до долины Есхол, и обозрели ее». Двое соглядатаев с кистью на шесте стали в современном Израиле эмблемой его министерства туризма. Сама же земля — северные окраины Хеврона на Западном берегу, где среди кандидатов лежат виноградники по дороге в Халхуль."
  uk:
    - "Долина Есхол — місце поблизу Хеврона, де дванадцять розвідників зрізали гроно винограду, яке понесли назад до табору. Ешкол означає гроно, і Книга Чисел каже, що долину названо за це гроно; Книга Буття знає аморея Ешкола, брата Мамре, серед союзників Аврама в Хевроні, і долина могла носити радше його ім’я. Пагорби навколо Хеврона й досі — виноградний край Юди. Традиція і більшість учених шукають її просто на північ і північний захід від міста: мапа позначає околиці Хеврона, пагорб Бурдж-ель-Хаска, джерело Айн-Ешкалі, чия назва може бути давньою, та околиці Мамре; Євсевій, навпаки, повідомляє, що її розміщували в Гофні, на північ від Єрусалима. Жодного з цього довести не можна."
    - "Розвідники «повернули на полудне, і дійшли до Геброну», а потім «дійшли до Есколь долини, і зрізали там вітку з однією гроною ягод, та й несли її два на жердцї, також і гранати і смокви». У Синодальному перекладі ці вірші мають номери 23 і 24 розділу. Вони показали плоди й сказали: «Добра земля, що дає нам Господь, Бог наш», а потім налякали народ її велетнями й мурованими містами."
    - "Мойсей двічі згадує це місце: розвідники «добрались до долини Эсколя і розглянули землю» і «відхилили вони серце синів Ізраїля», а в Повторенні Закону: «рушили вони і знялись на гори, та й дійшли до Єколь-долини, та й розгледїли землю». Двоє розвідників з гроном на жердині стали в сучасному Ізраїлі емблемою його міністерства туризму. Сама місцевість — північні околиці Хеврона на Західному березі, де виноградники на дорозі до Халхула лежать серед кандидатів."
  es:
    - "El valle de Escol es el lugar cercano a Hebrón donde los doce espías cortaron el racimo de uvas que llevaron de vuelta al campamento. Escol significa racimo, y Números dice que el valle fue llamado así por aquel racimo; el Génesis conoce un Escol amorreo, hermano de Mamre, entre los aliados de Abram en Hebrón, y el valle puede más bien haber llevado su nombre. Las colinas en torno a Hebrón siguen siendo la tierra de viñedos de Judá. La tradición y la mayoría de los estudiosos miran justo al norte y noroeste de la ciudad: el mapa marca las inmediaciones de Hebrón, la colina de Burj el-Haska, la fuente de Ain Eshkali, cuyo nombre puede ser el antiguo, y los alrededores de Mamre; Eusebio, en cambio, informa de que se decía que estaba en Gofna, al norte de Jerusalén. Ninguno de estos puede demostrarse."
    - "Los espías «subieron por el mediodía, y vinieron hasta Hebrón» y luego «llegaron hasta el arroyo de Escol, y de allí cortaron un sarmiento con un racimo de uvas, el cual trajeron dos en un palo, y de las granadas y de los higos». La Biblia sinodal cuenta estos versículos como 23 y 24 del capítulo. Mostraron el fruto y dijeron: «Es buena la tierra que Jehová nuestro Dios nos da», y luego atemorizaron al pueblo con sus gigantes y ciudades amuralladas."
    - "Moisés recuerda el lugar dos veces: los espías «subieron hasta la arroyada de Escol, y después que vieron la tierra» y «preocuparon el ánimo de los hijos de Israel», y en el Deuteronomio, «Y se encaminaron, y subieron al monte, y llegaron hasta la arroyada de Escol, y reconocieron la tierra». Los dos espías con su racimo en un palo se convirtieron en el Israel moderno en el emblema de su ministerio de turismo. El terreno mismo son las afueras septentrionales de Hebrón, en Cisjordania, donde los viñedos del camino de Halhul figuran entre los candidatos."
  pt:
    - "O vale de Escol é o lugar perto de Hebrom onde os doze espias cortaram o cacho de uvas que levaram de volta ao acampamento. Escol significa cacho, e Números diz que o vale recebeu o nome desse cacho; Gênesis conhece um Escol amorreu, irmão de Manre, entre os aliados de Abrão em Hebrom, e o vale pode antes ter levado o nome dele. As colinas em torno de Hebrom ainda são terra de vinhedos de Judá. A tradição e a maioria dos estudiosos olham para logo ao norte e noroeste da cidade: o mapa marca as imediações de Hebrom, a colina de Burj el-Haska, a fonte de Ain Eshkali, cujo nome pode ser o antigo, e os arredores de Manre; Eusébio, ao contrário, relata que se dizia estar em Gofna, ao norte de Jerusalém. Nada disso pode ser provado."
    - "Os espias “subiram pelo Sul e chegaram a Hebrom” e depois “chegaram ao vale de Escol e cortaram dali um ramo com um único cacho de uvas, e o carregaram em uma vara entre dois homens. Eles também trouxeram algumas romãs e figos”. A Bíblia Sinodal numera esses versículos como 23 e 24 do capítulo. Mostraram o fruto e disseram: “É uma boa terra que o SENHOR, nosso Deus, nos dá”, e depois assustaram o povo com seus gigantes e cidades muradas."
    - "Moisés recorda o lugar duas vezes: os espias “subiram até o vale de Escol e viram a terra” e “desencorajaram o coração dos filhos de Israel”, e em Deuteronômio: “Eles partiram, subiram à região montanhosa, chegaram ao vale de Escol e o espiaram”. Os dois espias com seu cacho numa vara tornaram-se, no Israel moderno, o emblema de seu ministério do turismo. O terreno em si são os arredores setentrionais de Hebrom, na Cisjordânia, onde os vinhedos da estrada para Halul estão entre os candidatos."
  de:
    - "Das Tal Eschkol ist der Ort bei Hebron, wo die zwölf Kundschafter die Traube abschnitten, die sie ins Lager zurücktrugen. Eschkol bedeutet Traube, und das Buch Numeri sagt, das Tal sei nach dieser Traube benannt; die Genesis kennt einen Amoriter Eschkol, Bruder Mamres, unter Abrams Verbündeten bei Hebron, und das Tal könnte eher seinen Namen getragen haben. Die Hügel um Hebron sind noch immer Judas Weinland. Die Überlieferung und die meisten Forscher blicken knapp nördlich und nordwestlich der Stadt: Die Karte markiert die Umgebung Hebrons, den Hügel Burj el-Haska, die Quelle Ain Eshkali, deren Name der alte sein könnte, und die Umgebung von Mamre; Eusebius dagegen berichtet, es werde bei Gophna nördlich von Jerusalem gesagt. Nichts davon lässt sich beweisen."
    - "Die Kundschafter „gingen auch hinauf ins Mittagsland und kamen bis gen Hebron“ und dann: „Und sie kamen bis an den Bach Eskol und schnitten daselbst eine Rebe ab mit einer Weintraube und ließen sie zwei auf einem Stecken tragen, dazu auch Granatäpfel und Feigen.“ Die Synodalbibel zählt diese Verse als 23 und 24 des Kapitels. Sie zeigten die Früchte und sagten: „Das Land ist gut, das der HERR, unser Gott, uns gegeben hat“, und erschreckten dann das Volk mit seinen Riesen und festen Städten."
    - "Mose erinnert zweimal an den Ort: „da sie hinaufgekommen waren bis an den Bach Eskol und sahen das Land, machten sie das Herz der Kinder Israel abwendig“, und im Deuteronomium: „da diese weggingen und hinaufzogen auf das Gebirge und an den Bach Eskol kamen, da besahen sie es“. Die beiden Kundschafter mit ihrer Traube an einer Stange wurden im modernen Israel zum Emblem seines Tourismusministeriums. Das Gelände selbst sind die nördlichen Randgebiete Hebrons im Westjordanland, wo die Weinberge an der Straße nach Halhul zu den Kandidaten zählen."
  fr:
    - "La vallée d’Eschcol est le lieu près d’Hébron où les douze espions coupèrent la grappe de raisin qu’ils rapportèrent au camp. Eschcol signifie grappe, et les Nombres disent que la vallée fut nommée d’après cette grappe ; la Genèse connaît un Amoréen Eschcol, frère de Mamré, parmi les alliés d’Abram à Hébron, et la vallée a pu plutôt porter son nom. Les collines autour d’Hébron sont toujours le pays de vignobles de Juda. La tradition et la plupart des spécialistes regardent juste au nord et au nord-ouest de la ville : la carte marque les abords d’Hébron, la colline de Burj el-Haska, la source d’Aïn Eshkali, dont le nom peut être l’ancien, et les environs de Mamré ; Eusèbe, lui, rapporte qu’on la disait à Gophna, au nord de Jérusalem. Rien de cela ne peut être prouvé."
    - "Les espions « montèrent, par le midi, et ils allèrent jusqu’à Hébron », puis « arrivèrent jusqu’à la vallée d’Eschcol, où ils coupèrent une branche de vigne avec une grappe de raisin, qu’ils portèrent à deux au moyen d’une perche ; ils prirent aussi des grenades et des figues ». La Bible synodale compte ces versets comme 23 et 24 du chapitre. Ils montrèrent le fruit et dirent : « C’est un bon pays, que l’Éternel, notre Dieu, nous donne », puis effrayèrent le peuple avec ses géants et ses villes fortifiées."
    - "Moïse rappelle deux fois le lieu : les espions « montèrent jusqu’à la vallée d’Eschcol, et, après avoir examiné le pays, ils découragèrent les enfants d’Israël », et dans le Deutéronome, « ils partirent, traversèrent la montagne, et arrivèrent jusqu’à la vallée d’Eschcol, qu’ils explorèrent ». Les deux espions portant leur grappe sur une perche sont devenus dans l’Israël moderne l’emblème de son ministère du Tourisme. Le terrain lui-même est la périphérie nord d’Hébron, en Cisjordanie, où les vignobles de la route de Halhul figurent parmi les candidats."
