# Overview article (ADR 0007). Mainstream facts only; the valley is unlocated and the app's candidates near Hebron are named without choosing; the Synodal verse numbering of Numbers 13 is noted.
id: valley-of-eshcol
place: a38ecff
title:
  en: "Valley of Eshcol"
  ru: "Долина Есхол"
  uk: "Долина Есхол"
  es: "Valle de Escol"
  pt: "Vale de Escol"
  de: "Tal Eschkol"
  fr: "Vallée d’Eschcol"
  pl: "Dolina Eszkol"
  it: "Valle di Escol"
  nl: "Dal van Eskol"
  cs: "Eškolské údolí"
  sv: "Eshkoldalen"
  nb: "Esjkol-dalen"
  tl: "Libis ng Escol"
  da: "Esjkoldalen"
body:
  en:
    - "The valley of Eshcol is the place near Hebron where the twelve spies cut the cluster of grapes that they carried back to the camp. Eshcol means cluster, and Numbers says the valley was named from that cluster; Genesis knows an Amorite Eshcol, brother of Mamre, among Abram's allies at Hebron, and the valley may rather have borne his name. The hills about Hebron are still Judah's vineyard country. Tradition and most scholars look just north and north-west of the city: the map marks the Hebron neighbourhood, the hill of Burj el-Haska, the spring of Ain Eshkali, whose name may be the old one, and the environs of Mamre; Eusebius, by contrast, reports that it was said to be at Gophna, north of Jerusalem. None of these can be proved."
    - "The spies “ascended by the south, and came unto Hebron” and then “came unto the brook of Eshcol, and cut down from thence a branch with one cluster of grapes, and they bare it between two upon a staff; and they brought of the pomegranates, and of the figs”. The Synodal Bible counts these verses as 23 and 24 of the chapter. They showed the fruit and, as Deuteronomy recalls, said, “It is a good land which the LORD our God doth give us”, and then frightened the people with its giants and walled cities."
    - "Moses twice recalls the place: the spies “went up unto the valley of Eshcol, and saw the land” and “discouraged the heart of the children of Israel”, and in Deuteronomy, “they turned and went up into the mountain, and came unto the valley of Eshcol, and searched it out”. The two spies with their cluster on a pole became in modern Israel the emblem of its tourism ministry. The ground itself is the northern outskirts of Hebron in the West Bank, where the vineyards on the road to Halhul lie among the candidates."
  ru:
    - "Долина Есхол — место близ Хеврона, где двенадцать соглядатаев срезали виноградную кисть и понесли её в стан. Есхол значит «кисть», и книга Чисел говорит, что долину назвали по той кисти; Бытие знает Аморрея Есхола, брата Мамрия, среди союзников Аврама в Хевроне, и долина могла носить скорее его имя. Горы вокруг Хеврона и теперь — виноградный край Иудеи. Предание и большинство учёных смотрят чуть севернее и северо-западнее города: на карте отмечены окрестности Хеврона, холм Бурдж-эль-Хаска, источник Айн-Эшкали, чьё имя может быть древним, и окрестности Мамре; Евсевий же передаёт, что её указывали у Гофны, к северу от Иерусалима. Ни одно из этих мест нельзя доказать."
    - "Соглядатаи «пошли в южную страну, и дошли до Хеврона» и затем «пришли к долине Есхол, и осмотрели ее, и срезали там виноградную ветвь с одною кистью ягод, и понесли ее на шесте двое; взяли также гранатовых яблок и смокв». В Синодальном переводе это стихи 23 и 24 главы. Они показали плоды и, как вспоминает Второзаконие, сказали: «хороша земля, которую Господь, Бог наш, дает нам», а потом напугали народ её исполинами и укреплёнными городами."
    - "Моисей дважды вспоминает это место: соглядатаи «доходили до долины Есхол, и видели землю, и отвратили сердце сынов Израилевых», а во Второзаконии: «Они пошли, взошли на гору и дошли до долины Есхол, и обозрели ее». Двое соглядатаев с кистью на шесте стали в современном Израиле эмблемой его министерства туризма. Сама же земля — северные окраины Хеврона на Западном берегу, где среди кандидатов лежат виноградники по дороге в Халхуль."
  uk:
    - "Долина Есхол — місце поблизу Хеврона, де дванадцять розвідників зрізали гроно винограду, яке понесли назад до табору. Ешкол означає гроно, і Книга Чисел каже, що долину названо за це гроно; Книга Буття знає аморея Ешкола, брата Мамре, серед союзників Аврама в Хевроні, і долина могла носити радше його ім’я. Пагорби навколо Хеврона й досі — виноградний край Юди. Традиція і більшість учених шукають її просто на північ і північний захід від міста: мапа позначає околиці Хеврона, пагорб Бурдж-ель-Хаска, джерело Айн-Ешкалі, чия назва може бути давньою, та околиці Мамре; Євсевій, навпаки, повідомляє, що її розміщували в Гофні, на північ від Єрусалима. Жодного з цього довести не можна."
    - "Розвідники «повернули на полудне, і дійшли до Геброну», а потім «дійшли до Есколь долини, і зрізали там вітку з однією гроною ягод, та й несли її два на жердцї, також і гранати і смокви». У Синодальному перекладі ці вірші мають номери 23 і 24 розділу. Вони показали плоди і, як згадує Повторення Закону, сказали: «Добра земля, що дає нам Господь, Бог наш», а потім налякали народ її велетнями й мурованими містами."
    - "Мойсей двічі згадує це місце: розвідники «добрались до долини Эсколя і розглянули землю» і «відхилили вони серце синів Ізраїля», а в Повторенні Закону: «рушили вони і знялись на гори, та й дійшли до Єколь-долини, та й розгледїли землю». Двоє розвідників з гроном на жердині стали в сучасному Ізраїлі емблемою його міністерства туризму. Сама місцевість — північні околиці Хеврона на Західному березі, де виноградники на дорозі до Халхула лежать серед кандидатів."
  es:
    - "El valle de Escol es el lugar cercano a Hebrón donde los doce espías cortaron el racimo de uvas que llevaron de vuelta al campamento. Escol significa racimo, y Números dice que el valle fue llamado así por aquel racimo; el Génesis conoce un Escol amorreo, hermano de Mamre, entre los aliados de Abram en Hebrón, y el valle puede más bien haber llevado su nombre. Las colinas en torno a Hebrón siguen siendo la tierra de viñedos de Judá. La tradición y la mayoría de los estudiosos miran justo al norte y noroeste de la ciudad: el mapa marca las inmediaciones de Hebrón, la colina de Burj el-Haska, la fuente de Ain Eshkali, cuyo nombre puede ser el antiguo, y los alrededores de Mamre; Eusebio, en cambio, informa de que se decía que estaba en Gofna, al norte de Jerusalén. Ninguno de estos puede demostrarse."
    - "Los espías «subieron por el mediodía, y vinieron hasta Hebrón» y luego «llegaron hasta el arroyo de Escol, y de allí cortaron un sarmiento con un racimo de uvas, el cual trajeron dos en un palo, y de las granadas y de los higos». La Biblia sinodal cuenta estos versículos como 23 y 24 del capítulo. Mostraron el fruto y, como recuerda el Deuteronomio, dijeron: «Es buena la tierra que Jehová nuestro Dios nos da», y luego atemorizaron al pueblo con sus gigantes y ciudades amuralladas."
    - "Moisés recuerda el lugar dos veces: los espías «subieron hasta la arroyada de Escol, y después que vieron la tierra» y «preocuparon el ánimo de los hijos de Israel», y en el Deuteronomio, «Y se encaminaron, y subieron al monte, y llegaron hasta la arroyada de Escol, y reconocieron la tierra». Los dos espías con su racimo en un palo se convirtieron en el Israel moderno en el emblema de su ministerio de turismo. El terreno mismo son las afueras septentrionales de Hebrón, en Cisjordania, donde los viñedos del camino de Halhul figuran entre los candidatos."
  pt:
    - "O vale de Escol é o lugar perto de Hebrom onde os doze espias cortaram o cacho de uvas que levaram de volta ao acampamento. Escol significa cacho, e Números diz que o vale recebeu o nome desse cacho; Gênesis conhece um Escol amorreu, irmão de Manre, entre os aliados de Abrão em Hebrom, e o vale pode antes ter levado o nome dele. As colinas em torno de Hebrom ainda são terra de vinhedos de Judá. A tradição e a maioria dos estudiosos olham para logo ao norte e noroeste da cidade: o mapa marca as imediações de Hebrom, a colina de Burj el-Haska, a fonte de Ain Eshkali, cujo nome pode ser o antigo, e os arredores de Manre; Eusébio, ao contrário, relata que se dizia estar em Gofna, ao norte de Jerusalém. Nada disso pode ser provado."
    - "Os espias “subiram pelo Sul e chegaram a Hebrom” e depois “chegaram ao vale de Escol e cortaram dali um ramo com um único cacho de uvas, e o carregaram em uma vara entre dois homens. Eles também trouxeram algumas romãs e figos”. A Bíblia Sinodal numera esses versículos como 23 e 24 do capítulo. Mostraram o fruto e, como recorda o Deuteronômio, disseram: “É uma boa terra que o SENHOR, nosso Deus, nos dá”, e depois assustaram o povo com seus gigantes e cidades muradas."
    - "Moisés recorda o lugar duas vezes: os espias “subiram até o vale de Escol e viram a terra” e “desencorajaram o coração dos filhos de Israel”, e em Deuteronômio: “Eles partiram, subiram à região montanhosa, chegaram ao vale de Escol e o espiaram”. Os dois espias com seu cacho numa vara tornaram-se, no Israel moderno, o emblema de seu ministério do turismo. O terreno em si são os arredores setentrionais de Hebrom, na Cisjordânia, onde os vinhedos da estrada para Halul estão entre os candidatos."
  de:
    - "Das Tal Eschkol ist der Ort bei Hebron, wo die zwölf Kundschafter die Traube abschnitten, die sie ins Lager zurücktrugen. Eschkol bedeutet Traube, und das Buch Numeri sagt, das Tal sei nach dieser Traube benannt; die Genesis kennt einen Amoriter Eschkol, Bruder Mamres, unter Abrams Verbündeten bei Hebron, und das Tal könnte eher seinen Namen getragen haben. Die Hügel um Hebron sind noch immer Judas Weinland. Die Überlieferung und die meisten Forscher blicken knapp nördlich und nordwestlich der Stadt: Die Karte markiert die Umgebung Hebrons, den Hügel Burj el-Haska, die Quelle Ain Eshkali, deren Name der alte sein könnte, und die Umgebung von Mamre; Eusebius dagegen berichtet, es werde bei Gophna nördlich von Jerusalem gesagt. Nichts davon lässt sich beweisen."
    - "Die Kundschafter „gingen auch hinauf ins Mittagsland und kamen bis gen Hebron“ und dann: „Und sie kamen bis an den Bach Eskol und schnitten daselbst eine Rebe ab mit einer Weintraube und ließen sie zwei auf einem Stecken tragen, dazu auch Granatäpfel und Feigen.“ Die Synodalbibel zählt diese Verse als 23 und 24 des Kapitels. Sie zeigten die Früchte und sagten, wie das Deuteronomium berichtet: „Das Land ist gut, das der HERR, unser Gott, uns gegeben hat“, und erschreckten dann das Volk mit seinen Riesen und festen Städten."
    - "Mose erinnert zweimal an den Ort: „da sie hinaufgekommen waren bis an den Bach Eskol und sahen das Land, machten sie das Herz der Kinder Israel abwendig“, und im Deuteronomium: „da diese weggingen und hinaufzogen auf das Gebirge und an den Bach Eskol kamen, da besahen sie es“. Die beiden Kundschafter mit ihrer Traube an einer Stange wurden im modernen Israel zum Emblem seines Tourismusministeriums. Das Gelände selbst sind die nördlichen Randgebiete Hebrons im Westjordanland, wo die Weinberge an der Straße nach Halhul zu den Kandidaten zählen."
  fr:
    - "La vallée d’Eschcol est le lieu près d’Hébron où les douze espions coupèrent la grappe de raisin qu’ils rapportèrent au camp. Eschcol signifie grappe, et les Nombres disent que la vallée fut nommée d’après cette grappe ; la Genèse connaît un Amoréen Eschcol, frère de Mamré, parmi les alliés d’Abram à Hébron, et la vallée a pu plutôt porter son nom. Les collines autour d’Hébron sont toujours le pays de vignobles de Juda. La tradition et la plupart des spécialistes regardent juste au nord et au nord-ouest de la ville : la carte marque les abords d’Hébron, la colline de Burj el-Haska, la source d’Aïn Eshkali, dont le nom peut être l’ancien, et les environs de Mamré ; Eusèbe, lui, rapporte qu’on la disait à Gophna, au nord de Jérusalem. Rien de cela ne peut être prouvé."
    - "Les espions « montèrent, par le midi, et ils allèrent jusqu’à Hébron », puis « arrivèrent jusqu’à la vallée d’Eschcol, où ils coupèrent une branche de vigne avec une grappe de raisin, qu’ils portèrent à deux au moyen d’une perche ; ils prirent aussi des grenades et des figues ». La Bible synodale compte ces versets comme 23 et 24 du chapitre. Ils montrèrent le fruit et, comme le rappelle le Deutéronome, dirent : « C’est un bon pays, que l’Éternel, notre Dieu, nous donne », puis effrayèrent le peuple avec ses géants et ses villes fortifiées."
    - "Moïse rappelle deux fois le lieu : les espions « montèrent jusqu’à la vallée d’Eschcol, et, après avoir examiné le pays, ils découragèrent les enfants d’Israël », et dans le Deutéronome, « ils partirent, traversèrent la montagne, et arrivèrent jusqu’à la vallée d’Eschcol, qu’ils explorèrent ». Les deux espions portant leur grappe sur une perche sont devenus dans l’Israël moderne l’emblème de son ministère du Tourisme. Le terrain lui-même est la périphérie nord d’Hébron, en Cisjordanie, où les vignobles de la route de Halhul figurent parmi les candidats."
  pl:
    - "Dolina Eszkol to miejsce koło Hebronu, gdzie dwunastu szpiegów ucięło kiść winogron, którą zanieśli do obozu. Eszkol znaczy kiść, a Księga Liczb mówi, że dolinę nazwano od tej kiści; Księga Rodzaju zna Amorytę Eszkola, brata Mamre, wśród sprzymierzeńców Abrama w Hebronie, i dolina mogła raczej nosić jego imię. Wzgórza wokół Hebronu są nadal krajem winnic Judy. Tradycja i większość badaczy szukają tuż na północ i północny zachód od miasta: mapa zaznacza okolice Hebronu, wzgórze Burdż el-Haska, źródło Ajn Eszkali, którego nazwa może być starą, oraz okolice Mamre; Euzebiusz natomiast podaje, że miała być w Gofnie, na północ od Jerozolimy. Żadnego z tych nie da się udowodnić."
    - "Szpiedzy „idąc ku południowi przyszli aż do Hebron” i potem „Przyszli potem aż do rzeki Eschol, i urznęli tam gałąź z gronem jednem jagód winnych, i nieśli ją na drążku, dwa także granatowe jabłka i figi”. Biblia synodalna liczy te wersety jako 23 i 24 rozdziału. Pokazali owoc i, jak wspomina Księga Powtórzonego Prawa, powiedzieli: „Dobra jest ziemia, którą nam dawa Pan, Bóg nasz”, a potem przestraszyli lud jej olbrzymami i obwarowanymi miastami."
    - "Mojżesz dwukrotnie przywołuje to miejsce: szpiedzy „przyszli aż do doliny Eschol, obejrzawszy onę ziemię popsowali serce synom Izraelskim”, a w Księdze Powtórzonego Prawa „Którzy odszedłszy weszli na górę, a przyszli aż do doliny Eschol, i przeszpiegowali ziemię”. Dwaj szpiedzy z kiścią na drążku stali się we współczesnym Izraelu godłem jego ministerstwa turystyki. Sam teren to północne obrzeża Hebronu na Zachodnim Brzegu, gdzie winnice przy drodze do Chalchul należą do kandydatów."
  it:
    - "La valle di Escol è il luogo presso Ebron dove i dodici esploratori tagliarono il grappolo d’uva che portarono all’accampamento. Escol significa grappolo, e i Numeri dicono che la valle fu così chiamata da quel grappolo; la Genesi conosce un Escol amorreo, fratello di Mamre, fra gli alleati di Abram a Ebron, e la valle può invece aver portato il suo nome. Le colline attorno a Ebron sono ancora il paese delle vigne di Giuda. La tradizione e la maggior parte degli studiosi guardano appena a nord e a nord-ovest della città: la mappa segna i dintorni di Ebron, la collina di Burj el-Haska, la sorgente di Ain Eshkali, il cui nome può essere l’antico, e i dintorni di Mamre; Eusebio, invece, riferisce che si diceva fosse a Gofna, a nord di Gerusalemme. Nulla di ciò si può provare."
    - "Gli esploratori «salirono per il mezzogiorno e andarono fino a Hebron», poi «giunsero fino alla valle d’Eshcol, dove tagliarono un tralcio con un grappolo d’uva, che portarono in due con una stanga, e presero anche delle melagrane e dei fichi». La Bibbia sinodale conta questi versetti come 23 e 24 del capitolo. Mostrarono il frutto e, come ricorda il Deuteronomio, dissero: «Quello che l’Eterno, il nostro Dio, ci dà, è un buon paese», e poi spaventarono il popolo con i suoi giganti e le sue città murate."
    - "Mosè ricorda due volte il luogo: gli esploratori «salirono fino alla valle d’Eshcol; e dopo aver esplorato il paese, scoraggiarono i figliuoli d’Israele», e nel Deuteronomio, «s’incamminarono, salirono verso i monti, giunsero alla valle d’Eshcol, ed esplorarono il paese». I due esploratori con il loro grappolo su un palo divennero nell’Israele moderno l’emblema del suo ministero del Turismo. Il terreno stesso è la periferia settentrionale di Ebron in Cisgiordania, dove le vigne sulla strada per Calcul sono fra i candidati."
  nl:
    - "Het dal van Eskol is de plek bij Hebron waar de twaalf verspieders de tros druiven afsneden die zij naar het kamp terugdroegen. Eskol betekent tros, en Numeri zegt dat het dal naar die tros werd genoemd; Genesis kent een Amorietische Eskol, broer van Mamre, onder de bondgenoten van Abram bij Hebron, en het dal kan eerder zijn naam hebben gedragen. De heuvels rond Hebron zijn nog steeds het wijngaardenland van Juda. De overlevering en de meeste geleerden zoeken net ten noorden en noordwesten van de stad: de kaart markeert de omgeving van Hebron, de heuvel Burj el-Haska, de bron Ain Eshkali, waarvan de naam de oude kan zijn, en de omgeving van Mamre; Eusebius meldt daarentegen dat het bij Gophna, ten noorden van Jeruzalem, zou hebben gelegen. Geen van deze kan worden bewezen."
    - "De verspieders “trokken op in het zuiden, en kwamen tot Hebron toe” en “Daarna kwamen zij tot het dal Eskol, en sneden van daar een rank af met een tros wijndruiven, dien zij droegen met tweeen, op een draagstok; ook van de granaatappelen en van de vijgen”. De Synodale Bijbel telt deze verzen als 23 en 24 van het hoofdstuk. Zij toonden de vrucht en zeiden, zoals Deuteronomium vertelt: “Het land, dat de HEERE, onze God, ons geven zal, is goed”, en joegen toen het volk schrik aan met zijn reuzen en ommuurde steden."
    - "Mozes herinnert tweemaal aan de plaats: “Als zij opgekomen waren tot aan het dal Eskol, en dit land bezagen, zo braken zij het hart der kinderen Israels”, en in Deuteronomium: “Die keerden zich, en togen op naar het gebergte, en kwamen tot het dal Eskol, en verspiedden datzelve.” De twee verspieders met hun tros aan een stok werden in het moderne Israël het embleem van zijn ministerie van toerisme. De grond zelf is de noordelijke rand van Hebron op de Westelijke Jordaanoever, waar de wijngaarden aan de weg naar Chalchul onder de kandidaten vallen."
  cs:
    - "Eškolské údolí je místo poblíž Hebronu, kde dvanáct zvědů uřezalo hrozen, který donesli do tábora. Eškol znamená hrozen a Kniha Numeri praví, že údolí bylo pojmenováno podle onoho hroznu; Genesis zná Amorejce Eškola, bratra Mamreho, mezi spojenci Abramovými v Hebronu, a údolí mohlo spíše nést jeho jméno. Hory kolem Hebronu jsou dosud judskou vinařskou krajinou. Tradice i většina učenců hledají těsně na sever a severozápad od města: mapa vyznačuje okolí Hebronu, pahorek Burdž el-Haska, pramen Ajn Eškali, jehož jméno může být staré, a okolí Mamre; Eusebius naproti tomu uvádí, že prý bylo u Gofny, severně od Jeruzaléma. Nic z toho nelze prokázat."
    - "Zvědové „šli stranou polední, a přišli až do Hebronu“ a potom „přišli až do údolí Eškol, a tu uřezali ratolest s hroznem jedním jahodek plným, a nesli jej na sochoře dva; též i jablka zrnatá i fíky té země“. Synodální překlad počítá tyto verše jako 23 a 24 kapitoly. Ukázali ovoce a podle Deuteronomia řekli: „Dobráť jest země, kterouž Hospodin Bůh náš dává nám“, a pak lid vyděsili jejími obry a opevněnými městy."
    - "Mojžíš připomíná místo dvakrát: zvědové, „když přišli až k údolí Eškol a shlédli zemi“, „odvrátili mysl synů Izraelských“, a v Deuteronomiu „obrátivše se a vstoupivše na horu, přišli až k údolí Eškol a shlédli zemi“. Dva zvědové s hroznem na tyči se stali v moderním Izraeli znakem ministerstva cestovního ruchu. Samotná půda je severní předměstí Hebronu na Západním břehu, kde vinice při silnici do Chalchúlu patří mezi kandidáty."
  sv:
    - "Eshkoldalen är platsen nära Hebron där de tolv spejarna skar av druvklasen som de bar tillbaka till lägret. Eshkol betyder klase, och Fjärde Mosebok säger att dalen fick sitt namn av den klasen; Första Moseboken känner en amoriten Eshkol, bror till Mamre, bland Abrams bundsförvanter i Hebron, och dalen kan snarare ha burit hans namn. Bergen kring Hebron är fortfarande Judas vinodlingsbygd. Traditionen och de flesta forskare söker strax norr och nordväst om staden: kartan markerar trakten av Hebron, höjden Burj el-Haska, källan Ain Eshkali, vars namn kan vara det gamla, och Mamres omgivningar; Eusebios uppger däremot att den sades ligga vid Gophna, norr om Jerusalem. Inget av detta kan bevisas."
    - "Spejarna ”drogo upp till Sydlandet och kommo till Hebron” och därefter ”kommo till Druvdalen; där skuro de av en kvist med en ensam druvklase på, och denna bars sedan på en stång av två man. Därtill togo de granatäpplen och fikon”. Den synodala bibeln räknar dessa verser som 23 och 24 i kapitlet. De visade frukten och sade, som Femte Mosebok erinrar om: ”Det land som Herren, vår Gud, vill giva oss är gott”, och skrämde sedan folket med dess jättar och befästa städer."
    - "Mose erinrar två gånger om platsen: ”sedan de hade dragit upp till Druvdalen och besett landet, avvände de Israels barns hjärtan”, och i Femte Mosebok: ”drogo upp till Bergsbygden och kommo till Druvdalen och bespejade landet”. De två spejarna med sin klase på en stång blev i det moderna Israel symbol för dess turistministerium. Själva marken är Hebrons norra utkanter på Västbanken, där vingårdarna vid vägen till Halhul finns bland kandidaterna."
  nb:
    - "Esjkol-dalen er stedet nær Hebron der de tolv speiderne skar av drueklasen som de bar tilbake til leiren. Esjkol betyr klase, og Fjerde Mosebok sier at dalen ble oppkalt etter den klasen; Første Mosebok kjenner en amorittisk Esjkol, bror til Mamre, blant Abrams forbundsfeller i Hebron, og dalen kan heller ha båret hans navn. Åsene rundt Hebron er fortsatt Judas vinland. Tradisjonen og de fleste forskere ser like nord og nordvest for byen: kartet markerer området rundt Hebron, høyden Burj el-Haska, kilden Ain Eshkali, hvis navn kan være det gamle, og omegnen til Mamre; Eusebius melder derimot at den skulle ligge ved Gofna, nord for Jerusalem. Ingen av disse kan bevises."
    - "Speiderne «drog op til sydlandet og kom til Hebron» og deretter: «Så kom de til Eskol-dalen; der skar de av en vinranke med en drueklase, og den bar to mann mellem sig på en stang; likeledes tok de granatepler og fikener». Synodalbibelen teller disse versene som 23 og 24 i kapitlet. De viste fram frukten og sa, som Femte Mosebok minner om: «Det land som Herren vår Gud vil gi oss, er et godt land», og skremte så folket med kjempene og de befestede byene."
    - "Moses minnes stedet to ganger: «da de hadde draget op til Eskoldalen og hadde sett på landet, vendte de Israels barns hu bort», og i Femte Mosebok: «de tok avsted og drog op i fjellene og kom til Eskol-dalen; og de utspeidet landet». De to speiderne med klasen på en stang ble i det moderne Israel emblemet til turistdepartementet. Selve stedet er de nordlige utkantene av Hebron på Vestbredden, der vingårdene langs veien til Halhul er blant kandidatene."
  tl:
    - "Ang libis ng Escol ay ang lugar malapit sa Hebron kung saan pinutol ng labindalawang tiktik ang kumpol ng ubas na dinala nila pabalik sa kampamento. Ang Escol ay nangangahulugang kumpol, at sinasabi ng Bilang na ipinangalan ang libis sa kumpol na iyon; kilala ng Genesis ang isang Amoreong Eschol, kapatid ni Mamre, sa mga kakampi ni Abram sa Hebron, at maaaring ang pangalan niya ang taglay ng libis. Ang mga burol sa paligid ng Hebron ay lupain pa rin ng ubasan ng Juda. Tinitingnan ng tradisyon at ng karamihan ng iskolar ang hilaga at hilagang-kanluran lamang ng lunsod: minamarkahan ng mapa ang kapaligiran ng Hebron, ang burol ng Burj el-Haska, ang bukal ng Ain Eshkali, na ang pangalan ay maaaring ang luma, at ang paligid ng Mamre; samantala, iniuulat ni Eusebio na sinasabing nasa Gophna ito, hilaga ng Jerusalem. Walang mapapatunayan sa mga ito."
    - "Ang mga tiktik ay “umakyat sa dakong Timugan, at sila'y dumating sa Hebron” at pagkatapos ay “sila'y dumating sa libis ng Escol, at sila'y pumutol doon ng isang sangang may isang kumpol na ubas, at dinala sa isang pingga ng dalawa; sila'y nagdala rin ng mga granada, at mga igos”. Binibilang ng Bibliyang Synodal ang mga talatang ito bilang 23 at 24 ng kabanata. Ipinakita nila ang bunga at, gaya ng inaalala ng Deuteronomio, sinabi, “Mabuting lupain ang ibinibigay sa atin ng Panginoon nating Dios”, at pagkatapos ay tinakot ang bayan sa mga higante at mga lunsod na may pader."
    - "Dalawang beses inaalala ni Moises ang lugar: “nang sila'y makasampa sa libis ng Eskol at matiktikan ang lupain”, kanilang “pinapanghina ang loob ng mga anak ni Israel”, at sa Deuteronomio, “sumampa sa bundok, at dumating hanggang sa libis ng Escol, at kanilang tiniktikan”. Ang dalawang tiktik na may kumpol sa pingga ay naging sagisag sa makabagong Israel ng ministeryo nito ng turismo. Ang lupa mismo ay ang hilagang labas ng Hebron sa Kanlurang Pampang, kung saan kabilang sa mga kandidato ang mga ubasan sa daan patungong Halhul."
  da:
    - "Esjkoldalen er stedet nær Hebron, hvor de tolv spejdere skar vindrueklasen, som de bar tilbage til lejren. Eskol betyder klase, og Numeri siger, at dalen blev opkaldt efter den klase; Første Mosebog kender en amoritisk Eskol, Mamres bror, blandt Abrams forbundsfæller ved Hebron, og dalen kan snarere have båret hans navn. Bjergene omkring Hebron er stadig Judas vinland. Traditionen og de fleste forskere ser lige nord og nordvest for byen: kortet markerer Hebron-egnen, højen Burj el-Haska, kilden Ain Eshkali, hvis navn kan være det gamle, og omegnen af Mamre; Eusebius meddeler derimod, at den siges at være ved Gofna, nord for Jerusalem. Intet af dette kan bevises."
    - "Af spejderne siger Numeri: »gik de op i Sydlandet og kom til Hebron«, og de »kom indtil Eskols Bæk og afskare der en Vinkvist og en Vindrueklasse, og to bare den paa en Stang, og de toge af Granatæblerne og af Figenerne«. Synodalbibelen tæller disse vers som 23 og 24 i kapitlet. De viste frugten og sagde, som Femte Mosebog minder om: »Det er et godt Land, som Herren vor Gud har givet os«, og skræmte derpå folket med dets kæmper og befæstede byer."
    - "Moses minder to gange om stedet: spejderne »gik op til Eskols Bæk og besaa Landet« og »afvendte Israels Børns Hjerte«, og i Femte Mosebog: »vendte sig og droge op paa Bjerget og kom til Eskols Bæk, og de bespejdede det«. De to spejdere med deres klase på en stang blev i det moderne Israel emblem for dets turistministerium. Selve jorden er Hebrons nordlige udkant på Vestbredden, hvor vingårdene ved vejen til Halhul hører til kandidaterne."
