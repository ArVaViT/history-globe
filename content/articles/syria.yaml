body:
  en:
    - 'The Syria of the Old Testament is Aram, the land of the Aramaeans north and north-east of Israel, above all the kingdom of Damascus; the Greek name Syria, probably a shortening of Assyria, was attached to the whole country between the Taurus and Egypt by the time of Herodotus. The Aramaeans, speakers of a language close to Hebrew, appear in Assyrian records about 1100 BC and in the tenth and ninth centuries had kingdoms at Damascus, Zobah, Arpad and across the Euphrates, and from about 800 BC at Hamath. Aram-naharaim, Aram of the two rivers, was the Haran country from which Abraham''s family came, and Israel''s creed remembered that "A Syrian ready to perish was my father".'
    - 'David defeated Hadadezer of Zobah and "the Syrians of Damascus" and put garrisons in Damascus; under Solomon Rezon seized the city and "reigned over Syria". For two centuries Damascus was Israel''s chief enemy. Ben-hadad besieged Samaria, Ahab died fighting the Syrians at Ramoth-gilead, Naaman the Syrian came to Elisha, and Hazael, whom Elisha foretold as king over Syria, "smote them in all the coasts of Israel". The Tel Dan stele, set up by an Aramaean king, most probably Hazael, boasts of killing kings of Israel and of "the house of David". Amos threatened the house of Hazael; Rezin, allied with Pekah, marched on Jerusalem, and Ahaz called in Tiglath-pileser, who took Damascus in 732 BC and killed Rezin.'
    - "Aramaic outlived the Aramaean kingdoms to become the language of Assyrian, Babylonian and Persian administration, of parts of Ezra and Daniel, and of the Jews of Palestine in the time of Jesus. After Alexander the Seleucids ruled Syria from Antioch; Pompey made it a Roman province in 64 BC, governed by a legate who also kept watch over Judea. Luke dates the census to the time when Quirinius was governor of Syria."
    - 'Jesus'' fame "went throughout all Syria". Saul was converted on the road to Damascus, the first Gentile church grew at Antioch, and the apostles'' letter was sent "unto the brethren which are of the Gentiles in Antioch and Syria and Cilicia". Paul went through Syria and Cilicia confirming the churches. Christianity in Syriac flourished at Edessa and in the monasteries of the north. The Syrian Arab Republic, with Damascus as its capital, was torn by civil war from 2011, and the Assad government fell in December 2024; Aramaic is still spoken in Maaloula.'
  ru:
    - "Сирия Ветхого Завета — это Арам, страна Арамеев к северу и северо-востоку от Израиля, прежде всего царство Дамаска; греческое имя Сирия, вероятно сокращение от Ассирии, ко времени Геродота закрепилось за всей страной между Тавром и Египтом. Арамеи, говорившие на языке, близком к еврейскому, появляются в ассирийских записях около 1100 г. до н. э., а в X–IX веках имели царства в Дамаске, Суве, Арпаде и за Евфратом, а примерно с 800 г. до н. э. — и в Емафе. Месопотамия Синодального перевода, Арам-Нахараим, Арам двух рек, — это край Харрана, откуда вышла семья Авраама, и исповедание Израиля помнило: «отец мой был странствующий Арамеянин»."
    - "Давид разбил Адраазара, царя Сувского, и пришедших ему на помощь Сирийцев Дамасских и поставил охранные войска в Сирии Дамасской; при Соломоне Разон захватил город и «сделался царем Сирии». Два века Дамаск был главным врагом Израиля. Венадад осаждал Самарию, Ахав погиб в бою с Сирийцами при Рамофе Галаадском, Нееман Сириянин пришёл к Елисею, а об Азаиле, в котором Елисей указал царя Сирии, сказано: «и поражал их Азаил во всем пределе Израилевом». Стела из Тель-Дана, поставленная арамейским царём, скорее всего Азаилом, похваляется убийством царей Израиля и «дома Давидова». Амос грозил дому Азаила; Рецин в союзе с Факеем пошёл на Иерусалим, и Ахаз призвал Феглаффелласара, который в 732 г. до н. э. взял Дамаск и умертвил Рецина."
    - "Арамейский язык пережил арамейские царства и стал языком ассирийского, вавилонского и персидского управления, частей книг Ездры и Даниила и Иудеев Палестины во времена Иисуса. После Александра Сирией правили из Антиохии Селевкиды; Помпей в 64 г. до н. э. сделал её римской провинцией под началом легата, который присматривал и за Иудеей. Лука относит перепись ко времени, когда Сириею правил Квириний."
    - "Слух об Иисусе прошёл «по всей Сирии». Савл обратился на дороге в Дамаск, первая церковь из язычников выросла в Антиохии, а послание апостолов было отправлено «находящимся в Антиохии, Сирии и Киликии братиям из язычников». Павел проходил Сирию и Киликию, утверждая церкви. Христианство на сирийском языке процветало в Эдессе и в монастырях севера. Сирийская Арабская Республика со столицей в Дамаске с 2011 года была охвачена гражданской войной, а в декабре 2024 года правительство Асада пало; в Маалюле до сих пор говорят по-арамейски."
  uk:
    - "Сирія Старого Заповіту — це Арам, земля арамеїв на північ і північний схід від Ізраїлю, насамперед царство Дамаска; грецька назва Сирія, імовірно скорочення від Ассирії, за часів Геродота була прикладена до всієї країни між Тавром та Єгиптом. Арамеї, носії мови, близької до староєврейської, з’являються в ассірійських записах близько 1100 р. до н. е., а в X–IX ст. до н. е. мали царства в Дамаску, Сові, Арпаді й за Євфратом, а приблизно з 800 р. до н. е. — і в Хаматі. Арам-Нахараїм, Арам двох рік, був краєм Харана, звідки походила родина Авраама, і віросповідання Ізраїлю пам’ятало: «Блукаючий Арамій був батько мій»."
    - "Давид переміг Адраазара з Суви й «Сирийцїв Дамаських» та поставив гарнізони в Дамаску; за Соломона Разон захопив місто і «зробився царем в Сириї». Два століття Дамаск був головним ворогом Ізраїлю. Бен-Гадад облягав Самарію, Ахав загинув у бою з сирійцями під Рамотом Гілеадським, сирієць Нааман прийшов до Єлисея, а Азаїл, якого Єлисей провістив царем над Сирією, «побивав їх … у всїх гряницях займища Ізрайлевого». Стела з Телль-Дана, поставлена арамейським царем, імовірно Азаїлом, вихваляється вбивством царів Ізраїлю та «дому Давида». Амос погрожував дому Азаїла; Рецін, у союзі з Факеєм, рушив на Єрусалим, а Ахаз покликав Тіглатпаласара, який узяв Дамаск 732 р. до н. е. і вбив Реціна."
    - "Арамейська мова пережила арамейські царства й стала мовою ассірійської, вавилонської та перської адміністрації, частин Ездри й Даниїла та юдеїв Палестини за часів Ісуса. Після Александра Селевкіди правили Сирією з Антіохії; Помпей зробив її римською провінцією 64 р. до н. е., яку очолював легат, що наглядав також за Юдеєю. Лука датує перепис часом, коли Квириній був намісником Сирії."
    - "Слава Ісуса «розійшлась … по всїй Сирщинї». Савл навернувся на дорозі до Дамаска, перша церква з поган зросла в Антіохії, а лист апостолів було послано «братам з поган, що в Антиохиї, і Сириї і Киликиї». Павло проходив Сирією й Кілікією, утверджуючи церкви. Християнство сирійською мовою розквітало в Едесі й у монастирях півночі. Сирійську Арабську Республіку з Дамаском як столицею з 2011 року роздирала громадянська війна, а уряд Асада впав у грудні 2024 року; арамейською досі розмовляють у Маалулі."
  es:
    - "La Siria del Antiguo Testamento es Aram, la tierra de los arameos al norte y noreste de Israel, sobre todo el reino de Damasco; el nombre griego Siria, probablemente un acortamiento de Asiria, se aplicaba ya en tiempos de Heródoto a todo el país entre el Tauro y Egipto. Los arameos, hablantes de una lengua cercana al hebreo, aparecen en los registros asirios hacia 1100 a. C. y en los siglos X y IX a. C. tuvieron reinos en Damasco, Soba, Arfad y al otro lado del Éufrates, y desde hacia el 800 a. C. en Hamat. Aram-naharaim, Aram de los dos ríos, era la región de Harán de donde procedía la familia de Abraham, y el credo de Israel recordaba que «Un Siro á punto de perecer fué mi padre»."
    - "David derrotó a Hadad-ezer de Soba y a «los Siros de Damasco» y puso guarniciones en Damasco; bajo Salomón, Rezón se apoderó de la ciudad y «reinó sobre la Siria». Durante dos siglos Damasco fue el principal enemigo de Israel. Ben-adad sitió Samaria, Acab murió combatiendo a los sirios en Ramot de Galaad, Naamán el sirio fue a Eliseo, y Hazael, a quien Eliseo anunció como rey de Siria, «hiriólos … en todos los términos de Israel». La estela de Tel Dan, erigida por un rey arameo, muy probablemente Hazael, se jacta de haber matado reyes de Israel y de «la casa de David». Amós amenazó a la casa de Hazael; Rezín, aliado con Peka, marchó sobre Jerusalén, y Acaz llamó a Tiglat-pileser, que tomó Damasco en 732 a. C. y mató a Rezín."
    - "El arameo sobrevivió a los reinos arameos y llegó a ser la lengua de la administración asiria, babilonia y persa, de partes de Esdras y de Daniel, y de los judíos de Palestina en tiempos de Jesús. Después de Alejandro, los seléucidas gobernaron Siria desde Antioquía; Pompeyo la hizo provincia romana en 64 a. C., gobernada por un legado que vigilaba también Judea. Lucas fecha el censo en el tiempo en que Cirenio era gobernador de Siria."
    - "Respecto de Jesús, «corría su fama por toda la Siria». Saulo se convirtió en el camino de Damasco, la primera iglesia de los gentiles creció en Antioquía, y la carta de los apóstoles fue enviada «á los hermanos de los Gentiles que están en Antioquía, y en Siria, y en Cilicia». Pablo recorrió Siria y Cilicia confirmando a las iglesias. El cristianismo en siríaco floreció en Edesa y en los monasterios del norte. La República Árabe Siria, con Damasco como capital, fue desgarrada por la guerra civil desde 2011, y el gobierno de Asad cayó en diciembre de 2024; en Maalula todavía se habla arameo."
  pt:
    - "A Síria do Antigo Testamento é Arã, a terra dos arameus ao norte e nordeste de Israel, sobretudo o reino de Damasco; o nome grego Síria, provavelmente uma abreviação de Assíria, já se aplicava a todo o país entre o Tauro e o Egito no tempo de Heródoto. Os arameus, falantes de uma língua próxima do hebraico, aparecem em registros assírios por volta de 1100 a.C. e nos séculos X e IX tinham reinos em Damasco, Zobá, Arpade e além do Eufrates e, a partir de cerca de 800 a.C., em Hamate. Arã-Naaraim, Arã dos dois rios, era a região de Harã de onde veio a família de Abraão, e o credo de Israel recordava: “Meu pai era um arameu prestes a perecer”."
    - "Davi derrotou Hadadezer de Zobá e “os sírios de Damasco” e pôs guarnições em Damasco; sob Salomão, Rezom tomou a cidade e “reinou sobre a Síria”. Por dois séculos Damasco foi o principal inimigo de Israel. Ben-Hadade sitiou Samaria, Acabe morreu lutando contra os sírios em Ramote-Gileade, Naamã, o sírio, foi a Eliseu, e Hazael, que Eliseu predisse como rei sobre a Síria, “os feriu em todas as fronteiras de Israel”. A estela de Tel Dã, erigida por um rei arameu, muito provavelmente Hazael, gaba-se de ter matado reis de Israel e de “a casa de Davi”. Amós ameaçou a casa de Hazael; Rezim, aliado de Peca, marchou sobre Jerusalém, e Acaz chamou Tiglate-Pileser, que tomou Damasco em 732 a.C. e matou Rezim."
    - "O aramaico sobreviveu aos reinos arameus e tornou-se a língua da administração assíria, babilônica e persa, de partes de Esdras e Daniel e dos judeus da Palestina no tempo de Jesus. Depois de Alexandre, os selêucidas governaram a Síria a partir de Antioquia; Pompeu a fez província romana em 64 a.C., governada por um legado que também vigiava a Judeia. Lucas data o recenseamento do tempo em que Quirino era governador da Síria."
    - "As notícias sobre Jesus “se espalharam por toda a Síria”. Saul se converteu no caminho de Damasco, a primeira igreja de gentios cresceu em Antioquia, e a carta dos apóstolos foi enviada “aos irmãos dentre os gentios em Antioquia, na Síria e na Cilícia”. Paulo percorreu a Síria e a Cilícia confirmando as igrejas. O cristianismo em siríaco floresceu em Edessa e nos mosteiros do norte. A República Árabe Síria, com Damasco por capital, foi dilacerada pela guerra civil desde 2011, e o governo de Assad caiu em dezembro de 2024; o aramaico ainda é falado em Maalula."
  de:
    - "Das Syrien des Alten Testaments ist Aram, das Land der Aramäer nördlich und nordöstlich von Israel, vor allem das Königreich Damaskus; der griechische Name Syrien, wohl eine Kürzung von Assyrien, bezeichnete zur Zeit Herodots das ganze Land zwischen dem Taurus und Ägypten. Die Aramäer, Sprecher einer dem Hebräischen nahen Sprache, erscheinen um 1100 v. Chr. in assyrischen Quellen und hatten im zehnten und neunten Jahrhundert Königreiche in Damaskus, Zoba, Arpad und jenseits des Euphrat, ab etwa 800 v. Chr. auch in Hamat. Aram-Naharajim, Aram der zwei Flüsse, war das Land um Haran, aus dem Abrahams Familie kam, und Israels Bekenntnis erinnerte sich: „Mein Vater war ein Syrer und nahe dem Umkommen“."
    - "David besiegte Hadadeser von Zoba und „die Syrer von Damaskus“ und legte Besatzungen nach Damaskus; unter Salomo nahm Reson die Stadt und „ward König über Syrien“. Zwei Jahrhunderte lang war Damaskus Israels Hauptfeind. Ben-Hadad belagerte Samaria, Ahab fiel im Kampf gegen die Syrer bei Ramot in Gilead, der Syrer Naaman kam zu Elisa, und Hasaël, den Elisa als König über Syrien vorhergesagt hatte, „schlug sie in allen Grenzen Israels“. Die Tel-Dan-Stele, von einem aramäischen König errichtet, höchstwahrscheinlich Hasaël, rühmt sich der Tötung von Königen Israels und des „Hauses Davids“. Amos drohte dem Haus Hasaëls; Rezin zog im Bund mit Pekach gegen Jerusalem, und Ahas rief Tiglat-Pileser, der 732 v. Chr. Damaskus nahm und Rezin tötete."
    - "Das Aramäische überdauerte die aramäischen Königreiche und wurde zur Sprache der assyrischen, babylonischen und persischen Verwaltung, von Teilen Esras und Daniels und der Juden Palästinas zur Zeit Jesu. Nach Alexander herrschten die Seleukiden von Antiochia aus über Syrien; Pompeius machte es 64 v. Chr. zur römischen Provinz, von einem Legaten regiert, der auch Judäa im Auge behielt. Lukas datiert die Schätzung in die Zeit, als Quirinius Statthalter von Syrien war."
    - "Von Jesus heißt es: „sein Gerücht erscholl in das ganze Syrienland“. Saulus wurde auf dem Weg nach Damaskus bekehrt, die erste Heidengemeinde wuchs in Antiochia, und der Brief der Apostel ging „den Brüdern aus den Heiden, die zu Antiochien und Syrien und Zilizien sind“ zu. Paulus zog durch Syrien und Kilikien und stärkte die Gemeinden. Das syrische Christentum blühte in Edessa und in den Klöstern des Nordens. Die Arabische Republik Syrien mit der Hauptstadt Damaskus wurde ab 2011 von einem Bürgerkrieg zerrissen, und die Regierung Assad fiel im Dezember 2024; in Maaloula wird noch Aramäisch gesprochen."
  fr:
    - "La Syrie de l’Ancien Testament est Aram, le pays des Araméens au nord et au nord-est d’Israël, avant tout le royaume de Damas ; le nom grec Syrie, probablement une abréviation d’Assyrie, désignait tout le pays entre le Taurus et l’Égypte à l’époque d’Hérodote. Les Araméens, locuteurs d’une langue proche de l’hébreu, apparaissent dans les annales assyriennes vers 1100 av. J.-C. et eurent aux Xe et IXe siècles des royaumes à Damas, Tsoba, Arpad et au-delà de l’Euphrate, et, à partir de 800 av. J.-C. environ, à Hamath. Aram-Naharaïm, Aram des deux fleuves, était le pays de Haran d’où venait la famille d’Abraham, et le credo d’Israël rappelait : « Mon père était un Araméen nomade »."
    - "David battit Hadadézer de Tsoba et « les Syriens de Damas » et mit des garnisons à Damas ; sous Salomon, Rezon s’empara de la ville : « Il régna sur la Syrie ». Pendant deux siècles, Damas fut l’ennemi principal d’Israël. Ben-Hadad assiégea Samarie, Achab mourut en combattant les Syriens à Ramoth en Galaad, Naaman le Syrien vint chez Élisée, et Hazaël, qu’Élisée annonça comme roi de Syrie, « les battit sur toute la frontière d’Israël ». La stèle de Tel Dan, dressée par un roi araméen, très probablement Hazaël, se vante d’avoir tué des rois d’Israël et de « la maison de David ». Amos menaça la maison de Hazaël ; Retsin, allié à Péka, marcha sur Jérusalem, et Achaz appela Tiglath-Piléser, qui prit Damas en 732 av. J.-C. et tua Retsin."
    - "L’araméen survécut aux royaumes araméens et devint la langue de l’administration assyrienne, babylonienne et perse, de parties d’Esdras et de Daniel, et des Juifs de Palestine au temps de Jésus. Après Alexandre, les Séleucides gouvernèrent la Syrie depuis Antioche ; Pompée en fit une province romaine en 64 av. J.-C., gouvernée par un légat qui surveillait aussi la Judée. Luc date le recensement du temps où Quirinius était gouverneur de Syrie."
    - "La renommée de Jésus « se répandit dans toute la Syrie ». Saül fut converti sur la route de Damas, la première Église de païens naquit à Antioche, et la lettre des apôtres fut adressée « aux frères d’entre les païens, qui sont à Antioche, en Syrie, et en Cilicie ». Paul parcourut la Syrie et la Cilicie en fortifiant les Églises. Le christianisme de langue syriaque s’épanouit à Édesse et dans les monastères du nord. La République arabe syrienne, avec Damas pour capitale, fut déchirée par la guerre civile à partir de 2011, et le gouvernement Assad tomba en décembre 2024 ; l’araméen se parle toujours à Maaloula."
  pl:
    - "Syria Starego Testamentu to Aram, kraina Aramejczyków na północ i północny wschód od Izraela, przede wszystkim królestwo Damaszku; grecka nazwa Syria, prawdopodobnie skrócona Asyria, została za czasów Herodota przypisana całemu krajowi między Taurusem a Egiptem. Aramejczycy, mówiący językiem bliskim hebrajskiemu, pojawiają się w źródłach asyryjskich około 1100 roku p.n.e., a w X i IX wieku mieli królestwa w Damaszku, Sobie, Arpad i za Eufratem, a od około 800 r. p.n.e. także w Chamat. Aram Naharaim, Aram Dwurzecza, był krajem Charanu, skąd pochodziła rodzina Abrahama, a wyznanie wiary Izraela pamiętało: „Ojciec mój był ubogi Syryjczyk”."
    - "Dawid pokonał Hadadezera z Soby, a gdy „Przyciągnął tedy Syryjczyk z Damaszku na pomoc Hadadezerowi”, pokonał także Syryjczyków i osadził załogi w Damaszku; za Salomona Rezon zajął miasto i „królował w Syryi”. Przez dwa stulecia Damaszek był głównym wrogiem Izraela. Ben-Hadad oblegał Samarię, Achab zginął, walcząc z Syryjczykami pod Ramot w Gileadzie, Syryjczyk Naaman przyszedł do Elizeusza, a Chazael, którego Elizeusz zapowiedział jako króla nad Syrią, poraził Izraela „po wszystkich granicach Izraelskich”. Stela z Tel Dan, wzniesiona przez aramejskiego króla, najprawdopodobniej Chazaela, chlubi się zabiciem królów Izraela i „domu Dawida”. Amos groził domowi Chazaela; Resin, sprzymierzony z Pekachem, wyruszył na Jerozolimę, a Achaz wezwał Tiglat-Pilesera, który zdobył Damaszek w 732 roku p.n.e. i zabił Resina."
    - "Aramejski przeżył królestwa aramejskie, stając się językiem administracji asyryjskiej, babilońskiej i perskiej, części ksiąg Ezdrasza i Daniela oraz Żydów Palestyny w czasach Jezusa. Po Aleksandrze Seleucydzi władali Syrią z Antiochii; Pompejusz uczynił ją prowincją rzymską w 64 roku p.n.e., zarządzaną przez legata, który czuwał także nad Judeą. Łukasz datuje spis na czas, gdy Kwiryniusz był namiestnikiem Syrii."
    - "Sława Jezusa: „rozeszła się wieść o nim po wszystkiej Syryi”. Saul nawrócił się w drodze do Damaszku, pierwszy kościół pogan wyrósł w Antiochii, a list apostołów był adresowany: „tym, którzy są w Antyjochyi i w Syryi, i w Cylicyi, braciom którzy są z pogan”. Paweł przechodził Syrię i Cylicję, utwierdzając zbory. Chrześcijaństwo w języku syryjskim rozkwitało w Edessie i w klasztorach północy. Syryjska Republika Arabska ze stolicą w Damaszku była od 2011 roku rozdzierana wojną domową, a rząd Asada upadł w grudniu 2024 roku; w Maalula nadal mówi się po aramejsku."
  it:
    - "La Siria dell’Antico Testamento è Aram, la terra degli Aramei a nord e a nord-est di Israele, soprattutto il regno di Damasco; il nome greco Siria, probabilmente un’abbreviazione di Assiria, designava l’intero paese fra il Tauro e l’Egitto ai tempi di Erodoto. Gli Aramei, parlanti una lingua vicina all’ebraico, compaiono nelle fonti assire verso il 1100 a.C. e nel X e IX secolo ebbero regni a Damasco, Zoba, Arpad e oltre l’Eufrate, e dall’800 a.C. circa a Camat. Aram-Naharàim, l’Aram dei due fiumi, era il paese di Carran da cui veniva la famiglia di Abramo, e il credo d’Israele ricordava: «Mio padre era un Arameo errante»."
    - "Davide sconfisse Adadezer di Zoba e «i Siri di Damasco» e pose guarnigioni a Damasco; sotto Salomone Rezon prese la città e «regnò sulla Siria». Per due secoli Damasco fu il principale nemico d’Israele. Ben-Adad assediò Samaria, Acab morì combattendo i Siri a Ramot di Galaad, Naaman il Siro andò da Eliseo, e Cazaèl, che Eliseo predisse re di Siria, «sconfisse gl’Israeliti su tutta la loro frontiera». La stele di Tel Dan, eretta da un re aramaico, con ogni probabilità Cazaèl, si vanta di aver ucciso re d’Israele e della «casa di Davide». Amos minacciò la casa di Cazaèl; Resin, alleato di Pekach, marciò su Gerusalemme, e Acaz chiamò Tiglat-Pilèser, che prese Damasco nel 732 a.C. e uccise Resin."
    - "L’aramaico sopravvisse ai regni aramei e divenne la lingua dell’amministrazione assira, babilonese e persiana, di parti di Esdra e di Daniele, e dei Giudei di Palestina al tempo di Gesù. Dopo Alessandro i Seleucidi governarono la Siria da Antiochia; Pompeo ne fece una provincia romana nel 64 a.C., retta da un legato che vigilava anche sulla Giudea. Luca data il censimento al tempo in cui Quirinio governava la Siria."
    - "La fama di Gesù «si sparse per tutta la Siria». Saulo si convertì sulla via di Damasco, la prima chiesa gentile crebbe ad Antiochia, e la lettera degli apostoli fu inviata «ai fratelli di fra i Gentili che sono in Antiochia, in Siria ed in Cilicia». Paolo percorse la Siria e la Cilicia confermando le chiese. Il cristianesimo in siriaco fiorì a Edessa e nei monasteri del nord. La Repubblica Araba Siriana, con Damasco come capitale, fu dilaniata dalla guerra civile dal 2011, e il governo di Assad cadde nel dicembre 2024; l’aramaico si parla ancora a Maaloula."
  nl:
    - "Het Syrië van het Oude Testament is Aram, het land van de Arameeërs ten noorden en noordoosten van Israël, vooral het koninkrijk Damascus; de Griekse naam Syrië, waarschijnlijk een verkorting van Assyrië, was in de tijd van Herodotus aan het hele land tussen de Taurus en Egypte gehecht. De Arameeërs, sprekers van een taal die dicht bij het Hebreeuws staat, verschijnen omstreeks 1100 v.Chr. in Assyrische bronnen en hadden in de 10e en 9e eeuw v.Chr. koninkrijken in Damascus, Soba, Arpad en aan de overkant van de Eufraat, en vanaf omstreeks 800 v.Chr. in Hamat. Aram-Naharaïm, Aram van de twee rivieren, was het Haran-land waaruit de familie van Abraham kwam, en de geloofsbelijdenis van Israël herinnerde zich: “Mijn vader was een bedorven Syrier”."
    - "David versloeg Hadadezer van Soba en “de Syriers van Damaskus” en legde bezettingen in Damascus; onder Salomo greep Rezon de stad en “regeerde over Syrië”. Twee eeuwen lang was Damascus de voornaamste vijand van Israël. Ben-Hadad belegerde Samaria, Achab stierf strijdend tegen de Syriërs bij Ramot in Gilead, de Syriër Naäman kwam naar Elisa, en Hazaël, van wie Elisa voorspelde dat hij koning over Syrië zou zijn, “sloeg ze in alle landpalen van Israël”. De stèle van Tel Dan, opgericht door een Aramese koning, hoogstwaarschijnlijk Hazaël, roemt het doden van koningen van Israël en van “het huis van David”. Amos dreigde het huis van Hazaël; Rezin, verbonden met Pekach, trok tegen Jeruzalem op, en Achaz riep Tiglat-Pileser te hulp, die Damascus in 732 v.Chr. innam en Rezin doodde."
    - "Het Aramees overleefde de Arameese koninkrijken en werd de taal van het Assyrische, Babylonische en Perzische bestuur, van delen van Ezra en Daniël, en van de Joden van Palestina in de tijd van Jezus. Na Alexander regeerden de Seleuciden over Syrië vanuit Antiochië; Pompeius maakte het in 64 v.Chr. tot een Romeinse provincie, bestuurd door een legaat die ook over Judea waakte. Lukas dateert de volkstelling in de tijd dat Quirinius stadhouder van Syrië was."
    - "Jezus’ faam “ging van daar uit in geheel Syrië”. Saulus werd bekeerd op de weg naar Damascus, de eerste heidense gemeente groeide in Antiochië, en de brief van de apostelen werd gestuurd aan “den broederen uit de heidenen, die in Antiochië, en Syrië, en Cilicië zijn”. Paulus doorreisde Syrië en Cilicië en versterkte de gemeenten. Het christendom in het Syrisch bloeide in Edessa en in de kloosters van het noorden. De Arabische Republiek Syrië, met Damascus als hoofdstad, werd vanaf 2011 verscheurd door een burgeroorlog, en de regering-Assad viel in december 2024; in Maaloula wordt nog steeds Aramees gesproken."
  cs:
    - "Sýrie Starého zákona je Aram, země Aramejců severně a severovýchodně od Izraele, především království Damašku; řecké jméno Syria, pravděpodobně zkrácené z Assyria, se v době Hérodotově vztahovalo na celou zemi mezi Taurem a Egyptem. Aramejci, mluvčí jazyka blízkého hebrejštině, se objevují v asyrských záznamech kolem roku 1100 př. n. l. a v 10. a 9. stol. př. n. l. měli království v Damašku, Sóbě, Arpádu a za Eufratem a asi od roku 800 př. n. l. i v Chamatu. Aram-naharajim, Aram dvou řek, byl kraj Cháranu, odkud pocházela Abrahamova rodina, a vyznání Izraele to pamatovalo slovy: „Syrský chudý otec můj“."
    - "David porazil Hadadezera ze Sóby i Syrské od Damašku a osadil Damašek posádkami; za Šalomouna se Rezon zmocnil města a „kraloval v Syrii“. Po dvě století byl Damašek hlavním nepřítelem Izraele. Ben-hadad oblehl Samaří, Achab zahynul v boji se Syrskými u Rámot v Gileadu, Syrský Námán přišel k Elíšovi a Chazael, o němž Elíša předpověděl, že bude králem nad Sýrií, Izraelity „porazil … po všech končinách Izraelských“. Stéla z Tel Danu, postavená aramejským králem, nejspíše Chazaelem, se chlubí zabitím králů Izraele a „domu Davidova“. Amos pohrozil domu Chazaelovu; Resín, spojený s Pekachem, vytáhl na Jeruzalém a Achaz přivolal Tiglatpilesara, který roku 732 př. n. l. dobyl Damašek a Resína zabil."
    - "Aramejština přežila aramejská království a stala se jazykem asyrské, babylónské a perské správy, částí knih Ezdráš a Daniel a Židů v Palestině v době Ježíšově. Po Alexandrovi vládli Sýrii z Antiochie Seleukovci; Pompeius z ní roku 64 př. n. l. učinil římskou provincii, spravovanou legátem, který dohlížel i na Judsko. Lukáš datuje sčítání do doby, kdy byl Quirinius správcem Sýrie."
    - "O Ježíši platí, že „rozešla se o něm pověst po vší Syrii“. Saul se obrátil na cestě do Damašku, první církev z pohanů vyrostla v Antiochii a list apoštolů byl poslán „těm, kteříž jsou v Antiochii a v Syrii a v Cilicii bratřím, kteříž jsou z pohanů“. Pavel procházel Sýrií a Kilikií a utvrzoval církve. Křesťanství v syrštině vzkvétalo v Edesse a v klášterech na severu. Syrská arabská republika s hlavním městem Damaškem byla od roku 2011 zmítána občanskou válkou a Asadova vláda padla v prosinci 2024; v Maalúle se dosud mluví aramejsky."
  sv:
    - "Gamla testamentets Syrien är Aram, arameernas land norr och nordost om Israel, framför allt riket Damaskus; det grekiska namnet Syria, sannolikt en förkortning av Assyria, hade vid Herodotos' tid kommit att gälla hela landet mellan Taurus och Egypten. Arameerna, som talade ett språk nära hebreiskan, förekommer i assyriska källor omkring 1100 f.Kr. och hade på 900- och 800-talen f.Kr. riken i Damaskus, Sova, Arpad och på andra sidan Eufrat, och från omkring 800 f.Kr. i Hamat. Aram-Naharajim, de två flodernas Aram, var Harranlandet som Abrahams släkt kom från, och Israels trosbekännelse mindes att ”Min fader var en hemlös aramé”."
    - "David besegrade Hadadeser av Sova och ”araméerna från Damaskus” och lade garnisoner i Damaskus; under Salomo intog Reson staden och ”blev konung över Aram”. I två sekler var Damaskus Israels främsta fiende. Ben-Hadad belägrade Samaria, Achav dog i strid mot araméerna vid Ramot-Gilead, araméen Naaman kom till Elisha, och Hasael, som Elisha förutsade skulle bli konung över Aram, ”slog israeliterna utefter hela deras gräns”. Tel Dan-stelen, uppställd av en arameisk kung, med största sannolikhet Hasael, skryter med att ha dödat Israels kungar och ”Davids hus”. Amos hotade Hasaels hus; Resin, förbunden med Pekach, tågade mot Jerusalem, och Achas kallade in Tiglat-Pileser, som intog Damaskus 732 f.Kr. och dödade Resin."
    - "Arameiskan överlevde de arameiska rikena och blev språket för assyrisk, babylonisk och persisk förvaltning, för delar av Esra och Daniel och för judarna i Palestina på Jesu tid. Efter Alexander styrde seleukiderna Syrien från Antiochia; Pompeius gjorde det till romersk provins 64 f.Kr., styrd av en legat som också höll uppsikt över Judeen. Lukas daterar skattskrivningen till den tid då Quirinius var ståthållare i Syrien."
    - "Ryktet om Jesus ”gick ut över hela Syrien”. Saul omvändes på vägen till Damaskus, den första hednakyrkan växte upp i Antiochia, och apostlarnas brev sändes till de ”bröder av hednisk börd, som bon i Antiokia, Syrien och Cilicien”. Paulus drog genom Syrien och Kilikien och styrkte församlingarna. Den syriskspråkiga kristendomen blomstrade i Edessa och i klostren i norr. Syriska arabrepubliken, med Damaskus som huvudstad, slets sönder av inbördeskrig från 2011, och Assadregimen föll i december 2024; arameiska talas fortfarande i Maaloula."
