body:
  en:
    - 'Sodom was the chief of the five cities of the plain of the Jordan, with Gomorrah, Admah, Zeboiim and Bela, which is Zoar. Genesis describes the plain as well watered, like the garden of the Lord, before its destruction, and places the battle of the four kings with the five in the vale of Siddim, "which is the salt sea". Where Sodom stood is unknown. Ancient writers looked for it at the south end of the Dead Sea, near Zoar, and this map marks it in the south.'
    - "The southern candidates are Early Bronze Age towns on the plain east of the Dead Sea's southern basin. Bab edh-Dhra, found by W. F. Albright's survey in 1924, had a walled town and a vast cemetery; Paul Lapp excavated the cemetery in 1965–1967, and after Walter Rast and Thomas Schaub surveyed nearby Numeira, Safi, Feifa and Khanazir in 1973, these sites were compared with the cities of the plain. Others object that they are too small, too early and in the wrong place, and the dates of their ends are themselves disputed. A different proposal, made by Steven Collins, who has dug there since the mid-2000s, puts Sodom at Tall el-Hammam, north-east of the Dead Sea. In 2021 a paper claimed that an airburst destroyed that city about 1650 BC; it was corrected twice and retracted by its journal in 2025 after critics found errors in its methods and in its reading of the data."
    - 'In Genesis, Lot settles near Sodom, whose people are "wicked and sinners before the LORD exceedingly"; Abraham pleads for the city, and the Lord rains brimstone and fire on Sodom and Gomorrah, while Lot escapes to Zoar. Later the prophets and Jesus himself name Sodom as the byword for judgement: Isaiah calls the rulers of Jerusalem rulers of Sodom, Ezekiel names her sin as pride, fulness of bread, idleness and neglect of the poor, and Jude and 2 Peter hold it up as an example.'
    - "Strabo, about the turn of the era, heard from local people that thirteen cities had once stood near Masada, with Sodom as their capital, and that earthquakes, fire and hot waters full of asphalt and sulphur had destroyed them. Josephus wrote that the land of Sodom beside the lake was burnt up and that traces of five cities could still be seen. In the fourth century Eusebius placed Sodom near the Dead Sea and noted that Zoar, the one city spared, was still inhabited, with a Roman garrison."
  ru:
    - "Содом был главным из пяти городов окрестности Иорданской, вместе с Гоморрой, Адмой, Севоимом и Белой, которая есть Сигор. Книга Бытия описывает окрестность до истребления как орошаемую, «как сад Господень», и помещает битву четырёх царей с пятью в долине Сиддим, «где ныне море Соленое». Где стоял Содом, неизвестно. Древние авторы искали его у южного края Мёртвого моря, около Сигора, и на этой карте он отмечен на юге."
    - "Южные кандидаты — города раннего бронзового века на равнине к востоку от южной части Мёртвого моря. Баб-эд-Дра, найденный разведкой У. Ф. Олбрайта в 1924 г., имел обнесённый стеной город и огромный некрополь; Пол Лапп раскапывал некрополь в 1965–1967 гг., а после того как Уолтер Раст и Томас Шауб в 1973 г. обследовали соседние Нумейру, Эс-Сафи, Фейфу и Ханазир, эти поселения стали сравнивать с городами окрестности. Другие возражают, что они слишком малы, слишком ранние и лежат не там, а даты их гибели сами спорны. Другое предложение, выдвинутое Стивеном Коллинзом, который копает там с середины 2000-х гг., помещает Содом в Телль-эль-Хаммам к северо-востоку от Мёртвого моря. В 2021 г. вышла статья о том, что этот город около 1650 г. до н. э. уничтожил воздушный взрыв; её дважды исправляли, а в 2025 г. журнал отозвал её после того, как критики нашли ошибки в методике и толковании данных."
    - "В Книге Бытия Лот селится у Содома, жители которого «были злы и весьма грешны пред Господом»; Авраам молит за город, и Господь проливает на Содом и Гоморру серу и огонь, а Лот спасается в Сигоре. Позже пророки и сам Иисус называют Содом образцом суда: Исаия называет правителей Иерусалима князьями Содомскими, Иезекииль видит грех Содома в гордости, пресыщении, праздности и в том, что она не поддерживала руки бедного, а Иуда и Второе послание Петра ставят его в пример."
    - "Страбон на рубеже эр слышал от местных жителей, что близ Масады стояли когда-то тринадцать городов со столицей Содомом и что их погубили землетрясения, огонь и горячие воды с асфальтом и серой. Иосиф Флавий писал, что Содомская земля у озера выжжена и что следы пяти городов видны до сих пор. В IV веке Евсевий помещал Содом у Мёртвого моря и отмечал, что Сигор, единственный уцелевший город, всё ещё населён и в нём стоит римский гарнизон."
  uk:
    - "Содом був головним із п’яти міст долини Йордану, разом з Гоморрою, Адмою, Цевоїмом і Белою, тобто Сігором. Книга Буття описує долину як добре зрошену, подібну до саду Господнього, до її руйнування, і розміщує битву чотирьох царів з п’ятьма в долині Сиддім, «се єсть теперенькі Море Солоне». Де стояв Содом, невідомо. Давні автори шукали його на південному краю Мертвого моря, поблизу Сігору, і ця мапа позначає його на півдні."
    - "Південні кандидати — міста ранньої бронзової доби на рівнині на схід від південного басейну Мертвого моря. Баб-ед-Дра, відкритий розвідкою В. Ф. Олбрайта 1924 року, мав муроване місто й величезний цвинтар; Пол Лапп розкопував цвинтар у 1965–1967 роках, а після того як Волтер Раст і Томас Шауб 1973 року обстежили поблизу Нумейру, Сафі, Фейфу й Ханазір, ці місця порівнювали з містами долини. Інші заперечують, що вони замалі, зарані й не на тому місці, а дати їхнього кінця самі спірні. Інша пропозиція, висунута Стівеном Коллінзом, який веде там розкопки з середини 2000-х, розміщує Содом у Телль-ель-Хаммамі, на північний схід від Мертвого моря. У 2021 році стаття стверджувала, що повітряний вибух знищив це місто близько 1650 р. до н. е.; її двічі виправляли, а 2025 року журнал її відкликав, після того як критики виявили помилки в її методах і в прочитанні даних."
    - "У Книзі Буття Лот оселяється поблизу Содому, чиї мешканці «були злющі й грішні перед Господом вельми»; Авраам заступається за місто, і Господь посилає на Содом і Гоморру дощ сірки й вогню, а Лот рятується в Сігорі. Згодом пророки й сам Ісус називають Содом прикладом суду: Ісая називає правителів Єрусалима правителями Содому, Єзекіїль називає його гріхом гординю, ситість хліба, неробство і байдужість до бідних, а Юда та Друге послання Петра ставлять його за приклад."
    - "Страбон, на зламі нашої ери, чув від місцевих, що колись поблизу Масади стояло тринадцять міст з Содомом як столицею і що землетруси, вогонь і гарячі води, повні асфальту й сірки, їх знищили. Йосиф Флавій писав, що земля Содому біля озера була випалена і що сліди п’яти міст ще можна було бачити. У IV столітті Євсевій розмістив Содом біля Мертвого моря і зауважив, що Сігор, єдине вціліле місто, все ще залюднений і має римський гарнізон."
  es:
    - "Sodoma era la principal de las cinco ciudades de la llanura del Jordán, con Gomorra, Adma, Zeboim y Bela, que es Zoar. El Génesis describe la llanura como bien regada, como el huerto del Señor, antes de su destrucción, y sitúa la batalla de los cuatro reyes contra los cinco en el valle de Siddim, «que es el mar salado». Se ignora dónde estuvo Sodoma. Los autores antiguos la buscaban en el extremo sur del mar Muerto, cerca de Zoar, y este mapa la marca en el sur."
    - "Los candidatos del sur son poblaciones de la Edad del Bronce Antiguo al este de la cuenca meridional del mar Muerto. Bab edh-Dhra, hallada por la prospección de W. F. Albright en 1924, tenía una ciudad amurallada y un vasto cementerio; Paul Lapp lo excavó en 1965–1967, y tras la prospección de Walter Rast y Thomas Schaub en 1973 en las cercanas Numeira, Safi, Feifa y Khanazir, se compararon con las ciudades de la llanura. Otros objetan que son demasiado pequeños, antiguos y mal ubicados, y se discuten las fechas de su final. Steven Collins, que excava allí desde mediados de los 2000, propone Tall el-Hammam, al noreste del mar Muerto, como Sodoma. En 2021 un artículo sostuvo que una explosión aérea destruyó esa ciudad hacia 1650 a. C.; fue corregido dos veces y la revista lo retractó en 2025 tras hallar los críticos errores de método y de lectura de datos."
    - "En el Génesis, Lot se establece cerca de Sodoma, cuyos hombres eran «malos y pecadores para con Jehová en gran manera»; Abraham intercede por la ciudad, y el Señor hace llover azufre y fuego sobre Sodoma y Gomorra, mientras Lot se refugia en Zoar. Más tarde los profetas y el propio Jesús nombran a Sodoma como símbolo del juicio: Isaías llama a los gobernantes de Jerusalén gobernantes de Sodoma, Ezequiel señala su pecado como soberbia, hartura de pan, ociosidad y desprecio de los pobres, y Judas y 2 Pedro la ponen como ejemplo."
    - "Estrabón, hacia el cambio de era, oyó de la gente del lugar que trece ciudades habían existido cerca de Masada, con Sodoma como capital, y que terremotos, fuego y aguas calientes cargadas de asfalto y azufre las habían destruido. Josefo escribió que la tierra de Sodoma junto al lago fue abrasada y que aún se veían huellas de cinco ciudades. En el siglo IV, Eusebio situó Sodoma cerca del mar Muerto y anotó que Zoar, la única ciudad perdonada, seguía habitada y tenía una guarnición romana."
  pt:
    - "Sodoma era a principal das cinco cidades da planície do Jordão, com Gomorra, Admá, Zeboim e Belá, que é Zoar. Gênesis descreve a planície como bem regada, como o jardim do SENHOR, antes de sua destruição, e situa a batalha dos quatro reis contra os cinco no vale de Sidim, “também chamado de Mar Salgado”. Onde Sodoma ficava é desconhecido. Os escritores antigos a procuravam na extremidade sul do Mar Morto, perto de Zoar, e este mapa a marca no sul."
    - "Os candidatos do sul são cidades da Idade do Bronze Antigo na planície a leste da bacia meridional do Mar Morto. Bab edh-Dhra, achada por W. F. Albright em 1924, tinha cidade murada e vasto cemitério; Paul Lapp escavou o cemitério em 1965–1967 e, depois que Walter Rast e Thomas Schaub prospectaram em 1973 Numeira, Safi, Feifa e Khanazir, esses sítios foram comparados com as cidades da planície. Outros objetam que são pequenos, antigos e mal situados, e as datas de seu fim são discutidas. Uma proposta diferente, feita por Steven Collins, que escava lá desde meados dos anos 2000, situa Sodoma em Tall el-Hammam, a nordeste do Mar Morto. Em 2021, um artigo afirmou que uma explosão aérea destruiu essa cidade por volta de 1650 a.C.; foi corrigido duas vezes e retratado pela revista em 2025, depois que críticos acharam erros nos métodos e na leitura dos dados."
    - "Em Gênesis, Ló se estabelece perto de Sodoma, cujos homens eram “extremamente perversos e pecadores contra o SENHOR”; Abraão intercede pela cidade, e o SENHOR faz chover enxofre e fogo sobre Sodoma e Gomorra, enquanto Ló escapa para Zoar. Mais tarde, os profetas e o próprio Jesus citam Sodoma como símbolo de juízo: Isaías chama os governantes de Jerusalém de governantes de Sodoma, Ezequiel nomeia o seu pecado como orgulho, fartura de pão, ociosidade e descaso com os pobres, e Judas e 2 Pedro a apresentam como exemplo."
    - "Estrabão, por volta da virada da era, ouviu dos habitantes locais que treze cidades haviam existido perto de Massada, com Sodoma como capital, e que terremotos, fogo e águas quentes cheias de betume e enxofre as destruíram. Josefo escreveu que a terra de Sodoma, junto ao lago, foi queimada e que ainda se viam vestígios de cinco cidades. No século IV, Eusébio situou Sodoma perto do Mar Morto e observou que Zoar, a única cidade poupada, ainda era habitada, com uma guarnição romana."
  de:
    - "Sodom war die Hauptstadt der fünf Städte der Jordanebene, mit Gomorra, Adma, Zeboim und Bela, das ist Zoar. Die Genesis beschreibt die Ebene vor ihrer Zerstörung als wasserreich wie den Garten des Herrn und verlegt die Schlacht der vier Könige gegen die fünf in das Siddimtal, „wo nun das Salzmeer ist“. Wo Sodom lag, ist unbekannt. Antike Autoren suchten es am Südende des Toten Meeres, nahe Zoar, und diese Karte verzeichnet es im Süden."
    - "Die südlichen Kandidaten sind frühbronzezeitliche Städte in der Ebene östlich des südlichen Toten Meeres. Bab edh-Dhra, 1924 bei W. F. Albrights Survey entdeckt, hatte eine ummauerte Stadt und einen riesigen Friedhof; Paul Lapp grub den Friedhof 1965–1967 aus, und nachdem Walter Rast und Thomas Schaub 1973 die nahen Numeira, Safi, Feifa und Khanazir vermessen hatten, verglich man diese Stätten mit den Städten der Ebene. Andere halten sie für zu klein, zu früh und am falschen Ort; auch die Daten ihres Endes sind umstritten. Steven Collins, der dort seit Mitte der 2000er Jahre gräbt, setzt Sodom auf Tall el-Hammam nordöstlich des Toten Meeres. 2021 behauptete eine Studie, ein Airburst habe diese Stadt um 1650 v. Chr. zerstört; sie wurde zweimal korrigiert und 2025 von ihrer Zeitschrift zurückgezogen, nachdem Kritiker Fehler in Methodik und Datendeutung gefunden hatten."
    - "In der Genesis lässt sich Lot bei Sodom nieder: „Aber die Leute zu Sodom waren böse und sündigten sehr wider den HERRN“; Abraham legt Fürbitte für die Stadt ein, und der Herr lässt Schwefel und Feuer auf Sodom und Gomorra regnen, während Lot nach Zoar entkommt. Später nennen die Propheten und Jesus selbst Sodom als Inbegriff des Gerichts: Jesaja nennt die Fürsten Jerusalems Fürsten von Sodom, Hesekiel benennt ihre Sünde als Hoffart, Überfluss an Brot, Müßiggang und Gleichgültigkeit gegenüber den Armen, und der Judasbrief und der zweite Petrusbrief halten sie als Beispiel vor."
    - "Strabon hörte um die Zeitenwende von Einheimischen, nahe Masada hätten einst dreizehn Städte gestanden, mit Sodom als Hauptstadt, und Erdbeben, Feuer und heiße Wasser voller Asphalt und Schwefel hätten sie zerstört. Josephus schrieb, das Land Sodoms am See sei verbrannt, und Spuren von fünf Städten seien noch zu sehen. Im vierten Jahrhundert setzte Eusebius Sodom nahe dem Toten Meer an und vermerkte, dass Zoar, die einzige verschonte Stadt, noch bewohnt sei und eine römische Garnison habe."
  fr:
    - "Sodome était la principale des cinq villes de la plaine du Jourdain, avec Gomorrhe, Adma, Tseboïm et Béla, qui est Tsoar. La Genèse décrit la plaine, avant sa destruction, comme bien arrosée, « comme un jardin de l’Éternel », et place la bataille des quatre rois contre les cinq dans la vallée de Siddim, « qui est la mer Salée ». L’emplacement de Sodome est inconnu. Les auteurs anciens la cherchaient à l’extrémité sud de la mer Morte, près de Tsoar, et cette carte la marque au sud."
    - "Les candidats du sud sont des villes du bronze ancien dans la plaine à l’est du bassin méridional de la mer Morte. Bab edh-Dhra, repérée par la prospection de W. F. Albright en 1924, avait une ville fortifiée et une vaste nécropole ; Paul Lapp la fouilla en 1965-1967, et après la prospection par Walter Rast et Thomas Schaub de Numeira, Safi, Feifa et Khanazir en 1973, ces sites furent comparés aux villes de la plaine. D’autres les jugent trop petits, trop anciens et mal situés, et la date de leur fin est discutée. Steven Collins, qui fouille depuis le milieu des années 2000, propose Tall el-Hammam, au nord-est de la mer Morte. En 2021, un article affirma qu’une explosion aérienne avait détruit cette ville vers 1650 av. J.-C. ; corrigé deux fois, il fut rétracté par sa revue en 2025, des critiques y ayant relevé des erreurs dans sa méthode et dans sa lecture des données."
    - "Dans la Genèse, Lot s’établit près de Sodome, dont les gens sont « méchants, et de grands pécheurs contre l’Éternel » ; Abraham plaide pour la ville, et l’Éternel fait pleuvoir soufre et feu sur Sodome et Gomorrhe, tandis que Lot s’échappe à Tsoar. Plus tard, les prophètes et Jésus lui-même citent Sodome comme l’emblème du jugement : Ésaïe appelle les chefs de Jérusalem « chefs de Sodome », Ézéchiel nomme son crime orgueil, abondance, insouciante sécurité et refus de soutenir le malheureux, et Jude et 2 Pierre la donnent en exemple."
    - "Strabon, vers le tournant de l’ère, apprit des gens du pays que treize villes s’étaient élevées près de Masada, avec Sodome pour capitale, et que séismes, feu et eaux chaudes chargées d’asphalte et de soufre les avaient détruites. Josèphe écrivit que la terre de Sodome, près du lac, avait été brûlée et qu’on voyait encore les traces de cinq villes. Au IVe siècle, Eusèbe plaça Sodome près de la mer Morte et nota que Tsoar, la seule ville épargnée, était encore habitée, avec une garnison romaine."
  pl:
    - "Sodoma była głównym z pięciu miast równiny Jordanu, wraz z Gomorą, Admą, Seboim i Belą, czyli Soarem. Księga Rodzaju opisuje równinę jako dobrze nawodnioną, jak ogród Pański, przed jej zagładą, i umieszcza bitwę czterech królów z pięcioma w dolinie Syddym, „ta jest teraz morzem słonem”. Gdzie stała Sodoma, nie wiadomo. Pisarze starożytni szukali jej na południowym krańcu Morza Martwego, blisko Soaru, i ta mapa zaznacza ją na południu."
    - "Kandydatami z południa są miasta z wczesnej epoki brązu na równinie na wschód od południowego basenu Morza Martwego. Bab ed-Dra, odkryte przez W. F. Albrighta w 1924 roku, miało miasto otoczone murem i ogromną nekropolię; Paul Lapp wykopywał ją w latach 1965–1967, a gdy Walter Rast i Thomas Schaub przebadali w 1973 roku pobliskie Numajrę, Safi, Fejfę i Chanazir, porównano je z miastami równiny. Inni zarzucają im, że są zbyt małe, zbyt wczesne i w złym miejscu, a daty ich końca same są sporne. Inna propozycja, Stevena Collinsa, który kopie tam od połowy pierwszej dekady XXI wieku, umieszcza Sodomę w Tall el-Hammam, na północny wschód od Morza Martwego. W 2021 roku artykuł twierdził, że wybuch powietrzny zniszczył to miasto około 1650 roku p.n.e.; poprawiono go dwukrotnie, a w 2025 roku czasopismo go wycofało, gdy krytycy znaleźli błędy w metodach i odczycie danych."
    - "W Księdze Rodzaju Lot osiada w pobliżu Sodomy, której mieszkańcy byli „źli i wielcy grzesznicy przed Panem”; Abraham wstawia się za miastem, a Pan spuszcza na Sodomę i Gomorę siarkę i ogień, podczas gdy Lot ucieka do Soaru. Później prorocy i sam Jezus czynią z Sodomy przysłowie sądu: Izajasz nazywa władców Jerozolimy władcami Sodomy, Ezechiel nazywa jej grzech pychą, sytością chleba, bezczynnością i zaniedbaniem ubogich, a List Judy i Drugi List Piotra podają ją jako przykład."
    - "Strabon, około przełomu er, usłyszał od miejscowych, że w pobliżu Masady stało niegdyś trzynaście miast ze stolicą w Sodomie i że zniszczyły je trzęsienia ziemi, ogień i gorące wody pełne asfaltu i siarki. Józef Flawiusz pisał, że ziemia Sodomy nad jeziorem została spalona i że ślady pięciu miast można jeszcze zobaczyć. W IV wieku Euzebiusz umieszczał Sodomę w pobliżu Morza Martwego i zaznaczył, że Soar, jedyne oszczędzone miasto, było jeszcze zamieszkane i miało rzymski garnizon."
  it:
    - "Sodoma era la principale delle cinque città della piana del Giordano, con Gomorra, Adma, Zeboim e Bela, cioè Soar. La Genesi descrive la piana come ben irrigata, come il giardino del Signore, prima della distruzione, e colloca la battaglia dei quattro re contro i cinque nella valle di Siddim, «ch’è il Mar salato». Dove sorgesse Sodoma non si sa. Gli autori antichi la cercavano all’estremità meridionale del Mar Morto, presso Soar, e questa mappa la segna a sud."
    - "I candidati meridionali sono città del Bronzo Antico nella piana a est del bacino meridionale del Mar Morto. Bab edh-Dhra, trovata dalla ricognizione di W. F. Albright del 1924, aveva una città murata e una vasta necropoli; Paul Lapp scavò la necropoli nel 1965–1967, e dopo che Walter Rast e Thomas Schaub esplorarono nel 1973 Numeira, Safi, Feifa e Khanazir, questi siti furono confrontati con le città della piana. Altri obiettano che sono troppo piccoli, troppo antichi e nel luogo sbagliato, e le date della fine sono discusse. Steven Collins, che vi scava dalla metà degli anni 2000, pone invece Sodoma a Tall el-Hammam, a nord-est del Mar Morto. Nel 2021 un articolo sostenne che un’esplosione in aria distrusse quella città verso il 1650 a.C.; fu corretto due volte e ritirato dalla rivista nel 2025, dopo che i critici vi trovarono errori di metodo e di lettura dei dati."
    - "Nella Genesi, Lot si stabilisce presso Sodoma, la cui gente «era scellerata e oltremodo peccatrice contro l’Eterno»; Abramo intercede per la città, e il Signore fa piovere zolfo e fuoco su Sodoma e Gomorra, mentre Lot fugge a Soar. In seguito i profeti e Gesù stesso citano Sodoma come emblema del giudizio: Isaia chiama i governanti di Gerusalemme capi di Sodoma, Ezechiele indica il suo peccato nell’orgoglio, nell’abbondanza del pane, nell’ozio e nel trascurare il povero, e Giuda e 2 Pietro la additano come esempio."
    - "Strabone, verso il passaggio all’era volgare, sentì dire dagli abitanti che tredici città sorgevano un tempo vicino a Masada, con Sodoma come capitale, e che terremoti, fuoco e acque calde piene di asfalto e di zolfo le avevano distrutte. Giuseppe Flavio scrisse che la terra di Sodoma presso il lago era stata bruciata e che si potevano ancora vedere tracce di cinque città. Nel IV secolo Eusebio collocò Sodoma presso il Mar Morto e notò che Soar, l’unica città risparmiata, era ancora abitata, con una guarnigione romana."
  nl:
    - "Sodom was de belangrijkste van de vijf steden van de vlakte van de Jordaan, met Gomorra, Adma, Zeboïm en Bela, dat is Zoar. Genesis beschrijft de vlakte als goed bewaterd, als de hof van de HEER, vóór haar verwoesting, en plaatst de strijd van de vier koningen met de vijf in het dal Siddim, “dat is de Zoutzee”. Waar Sodom lag, is onbekend. Antieke schrijvers zochten het aan het zuidelijke einde van de Dode Zee, bij Zoar, en deze kaart markeert het in het zuiden."
    - "De zuidelijke kandidaten zijn steden uit de Vroege Bronstijd op de vlakte ten oosten van het zuidelijke Dode Zee-bekken. Bab edh-Dhra, door W.F. Albright in 1924 gevonden, had een ommuurde stad en een enorme begraafplaats, die Paul Lapp in 1965–1967 opgroef; nadat Walter Rast en Thomas Schaub in 1973 ook Numeira, Safi, Feifa en Khanazir hadden onderzocht, werden die plaatsen met de steden van de vlakte vergeleken. Anderen vinden ze te klein, te vroeg en op de verkeerde plek, en de data van hun einde zijn zelf omstreden. Steven Collins, die er sinds het midden van de jaren 2000 graaft, plaatst Sodom op Tall el-Hammam, ten noordoosten van de Dode Zee. In 2021 beweerde een artikel dat een luchtexplosie die stad omstreeks 1650 v.Chr. verwoestte; het werd tweemaal gecorrigeerd en in 2025 ingetrokken, nadat critici fouten in methode en gegevenslezing vonden."
    - "In Genesis vestigt Lot zich bij Sodom, waarvan de mannen “boos, en grote zondaars tegen den HEERE” waren; Abraham pleit voor de stad, en de HEER laat zwavel en vuur regenen op Sodom en Gomorra, terwijl Lot naar Zoar ontkomt. Later noemen de profeten en Jezus zelf Sodom als het spreekwoord voor het oordeel: Jesaja noemt de heersers van Jeruzalem heersers van Sodom, Ezechiël noemt haar zonde hoogmoed, overvloed van brood, ledigheid en verwaarlozing van de armen, en Judas en 2 Petrus houden haar als voorbeeld voor."
    - "Strabo hoorde omstreeks het begin van onze jaartelling van de bevolking dat dertien steden eens bij Masada hadden gestaan, met Sodom als hoofdstad, en dat aardbevingen, vuur en hete wateren vol asfalt en zwavel ze hadden verwoest. Flavius Josephus schreef dat het land van Sodom langs het meer was verbrand en dat de sporen van vijf steden nog te zien waren. In de vierde eeuw plaatste Eusebius Sodom bij de Dode Zee en merkte op dat Zoar, de enige gespaarde stad, nog bewoond was, met een Romeinse bezetting."
  cs:
    - "Sodoma byla hlavním z pěti měst roviny Jordánu spolu s Gomorou, Admou, Cebóímem a Belou, což je Soar. Genesis popisuje rovinu před jejím zničením jako dobře zavlažovanou, jako zahrada Hospodinova, a klade bitvu čtyř králů s pěti do údolí Siddim, „to jest již moře solné“. Kde Sodoma stála, není známo. Antičtí spisovatelé ji hledali na jižním konci Mrtvého moře poblíž Soaru a tato mapa ji vyznačuje na jihu."
    - "Jižními kandidáty jsou města z rané doby bronzové na rovině východně od jižní pánve Mrtvého moře. Báb edh-Dhrá, objevená průzkumem W. F. Albrighta v roce 1924, měla opevněné město a rozsáhlé pohřebiště; Paul Lapp pohřebiště vykopal v letech 1965–1967 a poté, co Walter Rast a Thomas Schaub v roce 1973 prozkoumali nedaleké Numejru, Safí, Fajfu a Chanazír, byly tyto lokality srovnávány s městy roviny. Jiní namítají, že jsou příliš malé, příliš staré a na nesprávném místě a že data jejich zániku jsou sama sporná. Jiný návrh, jehož autorem je Steven Collins, který tam kope od poloviny nultých let, klade Sodomu do Tall el-Hammámu, severovýchodně od Mrtvého moře. V roce 2021 studie tvrdila, že výbuch ve vzduchu zničil toto město kolem roku 1650 př. n. l.; byla dvakrát opravena a v roce 2025 ji časopis stáhl poté, co kritici našli chyby v jejích metodách a ve výkladu dat."
    - "V Genesis se Lot usazuje poblíž Sodomy, jejíž lidé jsou „zlí, a hříšníci před Hospodinem velicí“; Abraham se za město přimlouvá a Hospodin dává pršet na Sodomu a Gomoru sírou a ohněm, zatímco Lot uniká do Soaru. Později proroci i sám Ježíš jmenují Sodomu jako příklad soudu: Izajáš nazývá vládce Jeruzaléma vládci Sodomy, Ezechiel uvádí jako její hřích pýchu, sytost chleba, zahálku a nedbání o chudé a Judův list a 2. Petrův list ji uvádějí jako příklad."
    - "Strabón, kolem přelomu letopočtu, slyšel od místních, že u Masady kdysi stálo třináct měst se Sodomou jako hlavním městem a že je zničilo zemětřesení, oheň a horké vody plné asfaltu a síry. Josephus psal, že země Sodomská u jezera byla spálena a že stopy pěti měst jsou ještě vidět. Ve 4. století Eusebius umístil Sodomu k Mrtvému moři a poznamenal, že Soar, jediné ušetřené město, je dosud obydleno a má římskou posádku."
  sv:
    - "Sodom var den främsta av de fem städerna på Jordanslätten, tillsammans med Gomorra, Adma, Sevojim och Bela, som är Soar. Första Moseboken beskriver slätten som välbevattnad, lik HERRENS lustgård, före dess undergång, och förlägger striden mellan de fyra kungarna och de fem till Siddimsdalen, ”där Salthavet nu är”. Var Sodom låg är okänt. Antika författare sökte det vid Döda havets södra ände, nära Soar, och denna karta markerar det i söder."
    - "De södra kandidaterna är städer från tidiga bronsåldern på slätten öster om Döda havets södra bassäng. Bab edh-Dhra, som hittades vid W. F. Albrights undersökning 1924, hade en befäst stad och en väldig gravplats; Paul Lapp grävde ut gravplatsen 1965–1967, och sedan Walter Rast och Thomas Schaub 1973 undersökt närliggande Numeira, Safi, Feifa och Khanazir jämfördes platserna med slättstäderna. Andra invänder att de är för små, för tidiga och på fel plats, och dateringen av deras undergång är i sig omstridd. Ett annat förslag, av Steven Collins, som har grävt där sedan mitten av 2000-talet, förlägger Sodom till Tall el-Hammam, nordost om Döda havet. År 2021 hävdade en artikel att en luftexplosion förstörde den staden omkring 1650 f.Kr.; den korrigerades två gånger och drogs tillbaka av tidskriften 2025 sedan kritiker funnit fel i metoderna och tolkningen av data."
    - "I Första Moseboken bosätter sig Lot nära Sodom, vars folk var ”mycket ont och syndigt inför HERREN”; Abraham ber för staden, och HERREN låter svavel och eld regna över Sodom och Gomorra, medan Lot räddar sig till Soar. Senare nämner profeterna och Jesus själv Sodom som sinnebilden för dom: Jesaja kallar Jerusalems furstar för Sodoms furstar, Hesekiel anger dess synd som högmod, överflöd av bröd, sysslolöshet och försummelse av de fattiga, och Judas brev och Andra Petrusbrevet håller upp det som exempel."
    - "Strabon, omkring tideräkningens början, hörde av de lokala invånarna att tretton städer en gång hade stått nära Masada, med Sodom som huvudstad, och att jordbävningar, eld och heta vatten fulla av asfalt och svavel hade förstört dem. Josefus skrev att Sodoms land vid sjön var utbränt och att spår av fem städer ännu syntes. På 300-talet placerade Eusebios Sodom nära Döda havet och anmärkte att Soar, den enda stad som skonades, fortfarande var bebodd, med en romersk garnison."
  nb:
    - "Sodoma var den viktigste av de fem byene på Jordan-sletten, sammen med Gomorra, Adma, Sebojim og Bela, som er Soar. Første Mosebok beskriver sletten som rik på vann, som Herrens have, før ødeleggelsen, og plasserer slaget mellom de fire kongene og de fem i Siddim-dalen, «der hvor Salthavet nu er». Hvor Sodoma lå, er ukjent. Antikkens forfattere lette etter den i den sørlige enden av Dødehavet, nær Soar, og dette kartet markerer den i sør."
    - "De sørlige kandidatene er byer fra tidlig bronsealder på sletten øst for Dødehavets sørlige basseng. Bab edh-Dhra, funnet ved W. F. Albrights kartlegging i 1924, hadde en ummuret by og en stor gravplass; Paul Lapp utgravde gravplassen i 1965–1967, og etter at Walter Rast og Thomas Schaub kartla de nærliggende Numeira, Safi, Feifa og Khanazir i 1973, ble disse stedene sammenlignet med slettebyene. Andre innvender at de er for små, for tidlige og på feil sted, og dateringene av når de gikk under, er selv omstridt. Et annet forslag, framsatt av Steven Collins, som har gravd der siden midten av 2000-tallet, plasserer Sodoma ved Tall el-Hammam, nordøst for Dødehavet. I 2021 hevdet en artikkel at en luftsprengning ødela den byen omkring 1650 f.Kr.; den ble rettet to ganger og trukket tilbake av tidsskriftet i 2025 etter at kritikere fant feil i metoder og datatolkning."
    - "I Første Mosebok slår Lot seg ned nær Sodoma, hvis menn «var onde og syndet storlig mot Herren»; Abraham ber for byen, og Herren lar det regne svovel og ild over Sodoma og Gomorra, mens Lot slipper unna til Soar. Senere nevner profetene og Jesus selv Sodoma som sinnbildet på dom: Jesaja kaller Jerusalems herskere Sodomas herskere, Esekiel nevner hennes synd som overmot, overflod av brød, uvirksomhet og forsømmelse av de fattige, og Judasbrevet og Andre Petersbrev holder den fram som et eksempel."
    - "Strabon hørte omkring tidsskiftet fra folk på stedet at tretten byer en gang hadde stått nær Masada, med Sodoma som hovedstad, og at jordskjelv, ild og varme kilder fulle av asfalt og svovel hadde ødelagt dem. Josefus skrev at Sodomas land ved innsjøen var brent opp og at spor av fem byer fortsatt kunne ses. På 300-tallet plasserte Eusebius Sodoma nær Dødehavet og merket at Soar, den ene byen som ble spart, fortsatt var bebodd, med en romersk garnison."
  tl:
    - "Ang Sodoma ang pangunahin sa limang lunsod ng kapatagan ng Jordan, kasama ng Gomorra, Adma, Zeboim at Bela, na siyang Zoar. Inilalarawan ng Genesis ang kapatagan bilang may saganang tubig, gaya ng halamanan ng Panginoon, bago ito nawasak, at inilalagay ang labanan ng apat na hari at ng lima sa libis ng Siddim, “na siyang Dagat na Alat”. Hindi alam kung saan nakatayo ang Sodoma. Hinanap ito ng mga sinaunang manunulat sa timugang dulo ng Dagat na Patay, malapit sa Zoar, at minamarkahan ito ng mapang ito sa timog."
    - "Ang mga kandidato sa timog ay bayan ng Maagang Panahong Tanso sa kapatagan sa silangan ng timugang palanggana ng Dagat na Patay. Ang Bab edh-Dhra (sarbey ni W. F. Albright, 1924) ay may pader na bayan at malaking libingan; hinukay ni Paul Lapp ang libingan (1965–1967), at nang masarbey nina Walter Rast at Thomas Schaub ang Numeira, Safi, Feifa at Khanazir (1973), inihambing ang mga ito sa mga lunsod ng kapatagan. Tutol ang iba: masyadong maliit, maaga, at maling lugar sila, at pinagtatalunan din ang petsa ng pagwawakas nila. Iminungkahi ni Steven Collins, na naghuhukay roon mula gitna ng dekada 2000, ang Tall el-Hammam sa hilagang-silangan ng Dagat na Patay. Isang papel (2021) ang nag-angking winasak ng airburst ang lunsod na iyon noong mga 1650 BK; dalawang beses itong itinama at binawi ng journal noong 2025 nang makita ng mga kritiko ang mali sa pamamaraan at datos."
    - "Sa Genesis, si Lot ay tumira malapit sa Sodoma, na ang mga tao ay “masasama at mga makasalanan sa harap ng Panginoon”; namanhik si Abraham para sa lunsod, at pinaulanan ng Panginoon ng asupre at apoy ang Sodoma at Gomorra, samantalang si Lot ay tumakas patungong Zoar. Pagkaraan, pinangalanan ng mga propeta at ni Jesus mismo ang Sodoma bilang sagisag ng paghatol: tinawag ni Isaias ang mga pinuno ng Jerusalem na mga pinuno ng Sodoma, itinakda ni Ezekiel ang kasalanan nito bilang kapalaluan, kasaganaan ng tinapay, katamaran at pagpapabaya sa mahirap, at itinatanghal ito nina Judas at 2 Pedro bilang halimbawa."
    - "Si Estrabon, sa pagpihit ng panahon, ay nakarinig mula sa mga lokal na tao na labintatlong lunsod ang dating nakatayo malapit sa Masada, na ang Sodoma ang kabisera, at winasak sila ng mga lindol, apoy at maiinit na tubig na puno ng asphalt at asupre. Isinulat ni Josefo na ang lupain ng Sodoma sa tabi ng lawa ay nasunog at na ang mga bakas ng limang lunsod ay natatanaw pa. Noong ika-4 na siglo, inilagay ni Eusebio ang Sodoma malapit sa Dagat na Patay at binanggit na ang Zoar, ang nag-iisang lunsod na iniligtas, ay tinitirhan pa, na may garison na Romano."
