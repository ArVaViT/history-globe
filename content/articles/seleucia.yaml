body:
  en:
    - "Seleucia in Pieria, or Seleucia by the Sea, lay on the coast of northern Syria a little north of the mouth of the Orontes, on the lower slopes of Mount Coryphaeus; its ruins are at Çevlik, near Samandağ in Turkey. Seleucus I founded it about 300 BC and named it after himself. Strabo counts it among the four sister cities of the Syrian Tetrapolis, with Antioch, Apamea and Laodicea, and calls it a fortress too strong to be taken by force. It was the port of Antioch, which lay 120 stadia away."
    - "After Seleucus was murdered in 281 BC, his son Antiochus I laid his ashes at Seleucia in a sacred precinct called the Nicatoreum. In 246 BC Ptolemy III of Egypt seized the city, and it kept an Egyptian garrison until Antiochus III took it back in 219 BC; in Polybius a royal adviser calls it the capital seat and almost the sacred hearth of the empire. Pompey, after shutting Tigranes of Armenia off from it, declared Seleucia a free city."
    - 'In the church at Antioch the Holy Ghost said to set apart Barnabas and Saul for the work to which he had called them. Being sent forth, they "departed unto Seleucia; and from thence they sailed to Cyprus", and so began Paul''s first journey. Acts names no port when they sailed back from Attalia to Antioch, but as Antioch''s harbour Seleucia is the likely place where they landed.'
    - "Under Rome the harbour served the imperial fleet, but silt from the rivers kept threatening it. Under Vespasian and Titus soldiers began to cut a channel through the rock, partly as a tunnel, to carry floodwater around the town; the work went on into the second century. A bishop of Seleucia attended the Council of Nicaea in 325. In the fifth century the struggle against the silt was given up, and the port declined. Excavations by Princeton University in 1937–1939 uncovered houses with mosaics and a large church."
  ru:
    - "Селевкия Пиерийская, или Селевкия Приморская, лежала на побережье северной Сирии чуть севернее устья Оронта, на нижних склонах горы Корифей; её развалины находятся у Чевлика, близ Самандага в Турции. Селевк I основал её около 300 г. до н. э. и назвал своим именем. Страбон причисляет её к четырём городам-сёстрам Сирийского Четырёхградия — вместе с Антиохией, Апамеей и Лаодикией — и называет крепостью, которую невозможно взять силой. Это была гавань Антиохии, лежавшей в 120 стадиях от неё."
    - "Когда в 281 г. до н. э. Селевка убили, его сын Антиох I положил его прах в Селевкии, в священной ограде, названной Никаторейоном. В 246 г. до н. э. город захватил египетский царь Птолемей III, и египетский гарнизон стоял в нём, пока Антиох III не вернул его в 219 г. до н. э.; у Полибия царский советник называет её столицей и едва ли не священным очагом державы. Помпей, отрезав от неё армянского царя Тиграна, объявил Селевкию свободным городом."
    - "В Антиохийской церкви Дух Святый сказал отделить Варнаву и Савла на дело, к которому Он призвал их. Быв посланы, они «пришли в Селевкию, а оттуда отплыли в Кипр», и так началось первое путешествие Павла. Когда они плыли обратно из Атталии в Антиохию, книга Деяний не называет гавани, но, скорее всего, они пристали здесь, в гавани Антиохии."
    - "При римлянах гавань служила императорскому флоту, но речной ил постоянно угрожал ей. При Веспасиане и Тите воины начали прорубать в скале канал, частью в виде туннеля, чтобы отводить паводковые воды в обход города; работы продолжались и во II веке. Епископ Селевкии участвовал в Никейском соборе 325 г. В V веке борьбу с илом прекратили, и гавань пришла в упадок. Раскопки Принстонского университета в 1937–1939 гг. открыли дома с мозаиками и большую церковь."
  uk:
    - "Селевкія в Пієрії, або Селевкія Приморська, лежала на узбережжі північної Сирії, трохи на північ від гирла Оронта, на нижніх схилах гори Корифей; її руїни — у Чевліку поблизу Саманда в Туреччині. Селевк I заснував її близько 300 р. до н. е. і назвав на свою честь. Страбон зараховує її до чотирьох міст-сестер сирійського Тетраполіса, разом з Антіохією, Апамеєю та Лаодікеєю, і називає її фортецею, надто міцною, щоб узяти її силою. Вона була портом Антіохії, що лежала за 120 стадій від неї."
    - "Після того, як Селевка вбили в 281 р. до н. е., його син Антіох I поклав його прах у Селевкії в священній огорожі, званій Нікаторієм. У 246 р. до н. е. Птолемей III Єгипетський захопив місто, і воно мало єгипетський гарнізон, поки Антіох III не повернув його в 219 р. до н. е.; у Полібія царський радник називає його столичним осідком і майже священним вогнищем держави. Помпей, відрізавши від нього Тиграна Вірменського, оголосив Селевкію вільним містом."
    - "У церкві в Антіохії Дух Святий сказав відлучити Варнаву й Савла на діло, до якого він їх покликав. Послані, вони «прийшли у Селевкию, а звідтіля відплили в Кипр», і так почалася перша подорож Павла. Діяння не називають порту, коли вони пливли назад з Атталії до Антіохії, але як гавань Антіохії Селевкія — ймовірне місце, де вони висадилися."
    - "За Рима гавань служила імператорському флоту, але мул з річок раз у раз їй загрожував. За Веспасіана й Тита солдати почали прорубувати крізь скелю канал, частково як тунель, щоб відвести повеневі води повз місто; робота тривала до II ст. Єпископ Селевкії брав участь у Нікейському соборі 325 р. У V ст. боротьбу з мулом облишили, і порт занепав. Розкопки Прінстонського університету 1937–1939 рр. виявили будинки з мозаїками та велику церкву."
  es:
    - "Seleucia de Pieria, o Seleucia del Mar, estaba en la costa del norte de Siria, algo al norte de la desembocadura del Orontes, en las laderas bajas del monte Coripeo; sus ruinas están en Çevlik, cerca de Samandağ, en Turquía. Seleuco I la fundó hacia 300 a. C. y le puso su nombre. Estrabón la cuenta entre las cuatro ciudades hermanas de la Tetrápolis siria, con Antioquía, Apamea y Laodicea, y la llama una fortaleza demasiado fuerte para ser tomada por la fuerza. Era el puerto de Antioquía, que se hallaba a 120 estadios."
    - "Después de que Seleuco fuera asesinado en 281 a. C., su hijo Antíoco I depositó sus cenizas en Seleucia, en un recinto sagrado llamado el Nicatoreo. En 246 a. C. Tolomeo III de Egipto se apoderó de la ciudad, que conservó una guarnición egipcia hasta que Antíoco III la recobró en 219 a. C.; en Polibio un consejero real la llama la sede capital y casi el hogar sagrado del imperio. Pompeyo, tras aislarla de Tigranes de Armenia, declaró Seleucia ciudad libre."
    - "En la iglesia de Antioquía el Espíritu Santo dijo que se apartara a Bernabé y a Saulo para la obra a la que los había llamado. Enviados, «descendieron á Seleucia; y de allí navegaron á Cipro», y así comenzó el primer viaje de Pablo. Los Hechos no nombran ningún puerto cuando regresaron navegando de Atalia a Antioquía, pero como puerto de Antioquía Seleucia es el lugar probable donde desembarcaron."
    - "Bajo Roma el puerto sirvió a la flota imperial, pero el cieno de los ríos lo amenazaba continuamente. Bajo Vespasiano y Tito los soldados comenzaron a abrir un canal a través de la roca, en parte como túnel, para llevar las aguas de crecida alrededor de la ciudad; la obra continuó hasta el siglo II. Un obispo de Seleucia asistió al Concilio de Nicea en 325. En el siglo V se abandonó la lucha contra el cieno, y el puerto decayó. Las excavaciones de la Universidad de Princeton en 1937–1939 sacaron a la luz casas con mosaicos y una gran iglesia."
  pt:
    - "Selêucia da Piéria, ou Selêucia Marítima, ficava na costa do norte da Síria, um pouco ao norte da foz do Orontes, nas encostas baixas do Monte Corifeu; suas ruínas estão em Çevlik, perto de Samandağ, na Turquia. Seleuco I a fundou por volta de 300 a.C. e lhe deu o próprio nome. Estrabão a conta entre as quatro cidades irmãs da Tetrápole síria, com Antioquia, Apameia e Laodiceia, e a chama de fortaleza forte demais para ser tomada à força. Era o porto de Antioquia, que ficava a 120 estádios."
    - "Depois que Seleuco foi assassinado em 281 a.C., seu filho Antíoco I depositou suas cinzas em Selêucia, num recinto sagrado chamado Nicatóreo. Em 246 a.C. Ptolomeu III do Egito tomou a cidade, e ela manteve uma guarnição egípcia até que Antíoco III a retomou em 219 a.C.; em Políbio um conselheiro real a chama de sede da capital e quase lareira sagrada do império. Pompeu, depois de isolá-la de Tigranes da Armênia, declarou Selêucia cidade livre."
    - "Na igreja de Antioquia o Espírito Santo mandou separar Barnabé e Saulo para a obra a que os chamara. Enviados, “desceram a Selêucia. De lá, navegaram para Chipre”, e assim começou a primeira viagem de Paulo. Atos não nomeia porto quando navegaram de volta de Atália a Antioquia, mas, sendo o porto de Antioquia, Selêucia é o lugar provável do desembarque."
    - "Sob Roma o porto serviu à frota imperial, mas o lodo dos rios o ameaçava sempre. Sob Vespasiano e Tito, soldados começaram a abrir um canal na rocha, em parte como túnel, para desviar as cheias em torno da cidade; a obra continuou pelo século II. Um bispo de Selêucia participou do Concílio de Niceia em 325. No século V a luta contra o lodo foi abandonada, e o porto decaiu. Escavações da Universidade de Princeton em 1937–1939 trouxeram à luz casas com mosaicos e uma grande igreja."
  de:
    - "Seleukia in Pieria oder Seleukia am Meer lag an der Küste Nordsyriens, etwas nördlich der Mündung des Orontes, an den unteren Hängen des Berges Koryphaios; seine Ruinen liegen bei Çevlik nahe Samandağ in der Türkei. Seleukos I. gründete es um 300 v. Chr. und benannte es nach sich. Strabon zählt es zu den vier Schwesterstädten der syrischen Tetrapolis, mit Antiochia, Apameia und Laodizea, und nennt es eine Festung, zu stark, um mit Gewalt genommen zu werden. Es war der Hafen von Antiochia, das 120 Stadien entfernt lag."
    - "Nachdem Seleukos 281 v. Chr. ermordet worden war, bestattete sein Sohn Antiochos I. seine Asche in Seleukia in einem heiligen Bezirk namens Nikatoreion. Im Jahr 246 v. Chr. nahm Ptolemaios III. von Ägypten die Stadt, und sie behielt eine ägyptische Besatzung, bis Antiochos III. sie 219 v. Chr. zurückeroberte; bei Polybios nennt ein königlicher Berater sie den Hauptsitz und fast den heiligen Herd des Reiches. Pompeius erklärte Seleukia zur freien Stadt, nachdem er Tigranes von Armenien von ihr abgeschnitten hatte."
    - "In der Gemeinde in Antiochia sprach der Heilige Geist, Barnabas und Saulus für das Werk abzusondern, zu dem er sie berufen hatte. Ausgesandt, „kamen sie gen Seleucia, und von da schifften sie gen Zypern“, und so begann Paulus' erste Reise. Die Apostelgeschichte nennt keinen Hafen, als sie von Attalia nach Antiochia zurückfuhren, doch als Hafen Antiochias ist Seleukia der wahrscheinliche Landeplatz."
    - "Unter Rom diente der Hafen der kaiserlichen Flotte, doch der Schlamm der Flüsse bedrohte ihn ständig. Unter Vespasian und Titus begannen Soldaten, einen Kanal, teils als Tunnel, durch den Fels zu schlagen, um Hochwasser um die Stadt zu leiten; die Arbeit ging bis ins 2. Jahrhundert weiter. Ein Bischof von Seleukia nahm 325 am Konzil von Nizäa teil. Im 5. Jahrhundert gab man den Kampf gegen den Schlamm auf, und der Hafen verfiel. Grabungen der Princeton University 1937–1939 legten Häuser mit Mosaiken und eine große Kirche frei."
  fr:
    - "Séleucie de Piérie, ou Séleucie sur mer, se trouvait sur la côte du nord de la Syrie, un peu au nord de l’embouchure de l’Oronte, sur les basses pentes du mont Coryphée ; ses ruines sont à Çevlik, près de Samandağ, en Turquie. Séleucos Ier la fonda vers 300 av. J.-C. et lui donna son nom. Strabon la compte parmi les quatre villes sœurs de la Tétrapole syrienne, avec Antioche, Apamée et Laodicée, et l’appelle une forteresse trop forte pour être prise de force. Elle était le port d’Antioche, qui se trouvait à 120 stades."
    - "Après l’assassinat de Séleucos en 281 av. J.-C., son fils Antiochos Ier déposa ses cendres à Séleucie dans un enclos sacré appelé le Nicatoréion. En 246 av. J.-C., Ptolémée III d’Égypte s’empara de la ville, qui garda une garnison égyptienne jusqu’à ce qu’Antiochos III la reprenne en 219 av. J.-C. ; chez Polybe, un conseiller royal l’appelle le siège de la capitale et presque le foyer sacré de l’empire. Pompée, après en avoir coupé Tigrane d’Arménie, déclara Séleucie ville libre."
    - "Dans l’Église d’Antioche, le Saint-Esprit dit de mettre à part Barnabas et Saul pour l’œuvre à laquelle il les avait appelés. Envoyés, ils « descendirent à Séleucie, et de là ils s’embarquèrent pour l’île de Chypre », et commencèrent ainsi le premier voyage de Paul. Les Actes ne nomment aucun port quand ils revinrent d’Attalie à Antioche, mais, comme port d’Antioche, Séleucie est le lieu probable de leur débarquement."
    - "Sous Rome, le port servit la flotte impériale, mais le limon des rivières le menaçait sans cesse. Sous Vespasien et Titus, des soldats commencèrent à tailler dans le roc un canal, en partie en tunnel, pour détourner les crues autour de la ville ; le travail se poursuivit jusqu’au IIe siècle. Un évêque de Séleucie assista au concile de Nicée en 325. Au Ve siècle, la lutte contre le limon fut abandonnée et le port déclina. Les fouilles de l’université de Princeton en 1937–1939 ont mis au jour des maisons à mosaïques et une grande église."
  it:
    - "Seleucia di Pieria, o Seleucia sul Mare, sorgeva sulla costa della Siria settentrionale un po’ a nord della foce dell’Oronte, sui pendii inferiori del monte Corifeo; le sue rovine sono a Çevlik, presso Samandağ in Turchia. Seleuco I la fondò verso il 300 a.C. e le diede il proprio nome. Strabone la conta tra le quattro città sorelle della Tetrapoli siriaca, con Antiochia, Apamea e Laodicea, e la dice una fortezza troppo forte per essere presa con la forza. Era il porto di Antiochia, che si trovava a 120 stadi di distanza."
    - "Dopo l’assassinio di Seleuco nel 281 a.C., suo figlio Antioco I depose le sue ceneri a Seleucia in un recinto sacro chiamato Nicatoreo. Nel 246 a.C. Tolomeo III d’Egitto si impadronì della città, che ebbe una guarnigione egizia finché Antioco III non la riprese nel 219 a.C.; in Polibio un consigliere del re la chiama la sede della capitale e quasi il sacro focolare dell’impero. Pompeo, dopo averla preclusa a Tigrane d’Armenia, dichiarò Seleucia città libera."
    - "Nella chiesa di Antiochia lo Spirito Santo disse di mettere da parte Barnaba e Saulo per l’opera alla quale li aveva chiamati. Mandati via, «scesero a Seleucia, e di là navigarono verso Cipro», e così cominciò il primo viaggio di Paolo. Gli Atti non nominano alcun porto quando tornarono da Attalia ad Antiochia, ma come porto di Antiochia Seleucia è il luogo probabile del loro sbarco."
    - "Sotto Roma il porto servì la flotta imperiale, ma il limo dei fiumi continuava a minacciarlo. Sotto Vespasiano e Tito i soldati cominciarono a scavare un canale nella roccia, in parte come galleria, per portare le acque di piena attorno alla città; il lavoro proseguì nel II secolo. Un vescovo di Seleucia partecipò al Concilio di Nicea nel 325. Nel V secolo la lotta contro il limo fu abbandonata e il porto declinò. Gli scavi dell’Università di Princeton nel 1937–1939 portarono alla luce case con mosaici e una grande chiesa."
  pl:
    - "Seleucja Pierijska, czyli Seleucja Nadmorska, leżała na wybrzeżu północnej Syrii nieco na północ od ujścia Orontesu, na niższych zboczach góry Korifajos; jej ruiny są w Çevlik koło Samandağ w Turcji. Seleukos I założył ją około 300 roku p.n.e. i nazwał od siebie. Strabon zalicza ją do czterech miast-sióstr Tetrapolis syryjskiej, obok Antiochii, Apamei i Laodycei, i nazywa ją twierdzą zbyt silną, by dać się zdobyć siłą. Była portem Antiochii, oddalonej o 120 stadiów."
    - "Po zamordowaniu Seleukosa w 281 roku p.n.e. jego syn Antioch I złożył jego prochy w Seleucji w świętym obrębie zwanym Nikatorejon. W 246 roku p.n.e. Ptolemeusz III z Egiptu zajął miasto, które zachowało egipski garnizon, aż Antioch III odzyskał je w 219 roku p.n.e.; u Polibiusza królewski doradca nazywa je stolicą rządu i prawie świętym ogniskiem państwa. Pompejusz, odciąwszy od niej Tigranesa Armeńskiego, ogłosił Seleucję miastem wolnym."
    - "W kościele w Antiochii Duch Święty rzekł, by odłączyć Barnabę i Saula do dzieła, do którego ich powołał. Wysłani, „przyszli do Seleucyi, a stamtąd płynęli do Cypru”, i tak zaczęła się pierwsza podróż Pawła. Dzieje nie wymieniają żadnego portu, gdy odpływali z Attalii do Antiochii, lecz jako port Antiochii Seleucja jest prawdopodobnym miejscem, gdzie wylądowali."
    - "Pod władzą Rzymu port służył flocie cesarskiej, lecz muł z rzek stale mu zagrażał. Za Wespazjana i Tytusa żołnierze zaczęli wykuwać w skale kanał, częściowo jako tunel, by odprowadzić wody powodziowe wokół miasta; prace trwały do II wieku. Biskup Seleucji uczestniczył w soborze nicejskim w 325 roku. W V wieku zaniechano walki z mułem i port podupadł. Wykopaliska Uniwersytetu Princeton w latach 1937–1939 odsłoniły domy z mozaikami i wielki kościół."
  cs:
    - "Seleukeia v Pierii, neboli Seleukeia při moři, ležela na pobřeží severní Sýrie kousek severně od ústí Orontu, na dolních svazích hory Korýfaios; její zříceniny jsou v Čevliku, poblíž Samandağu v Turecku. Založil ji Seleukos I. asi roku 300 př. n. l. a pojmenoval ji po sobě. Strabón ji počítá mezi čtyři sesterská města syrské Tetrapole, s Antiochií, Apameiou a Laodikeiou, a nazývá ji pevností příliš silnou, než aby ji bylo možné dobýt silou. Byla přístavem Antiochie, vzdálené 120 stadií."
    - "Poté, co byl Seleukos roku 281 př. n. l. zavražděn, uložil jeho syn Antiochos I. jeho popel v Seleukeii do posvátného okrsku zvaného Nikatoreion. Roku 246 př. n. l. město zabral Ptolemaios III. Egyptský a drželo egyptskou posádku, dokud je Antiochos III. roku 219 př. n. l. nevzal zpět; u Polybia je královský rádce nazývá hlavním sídlem a téměř posvátným ohništěm říše. Pompeius, poté co od něj odřízl Tigrana Arménského, prohlásil Seleukeiu za svobodné město."
    - "V církvi v Antiochii řekl Duch svatý, aby byli Barnabáš a Saul vyčleněni pro dílo, k němuž je povolal. Vysláni, „přišli do Seleucie, a odtud plavili se do Cypru“, a tak začala Pavlova první cesta. Skutky nejmenují žádný přístav, když se plavili zpět z Attaleie do Antiochie, ale jakožto antiochijský přístav je Seleukeia pravděpodobným místem, kde přistáli."
    - "Pod Římem sloužil přístav císařskému loďstvu, ale nános z řek jej stále ohrožoval. Za Vespasiana a Tita začali vojáci vysekávat ve skále kanál, částečně jako tunel, aby odváděl povodňovou vodu kolem města; práce pokračovaly do 2. století. Biskup Seleukeie se zúčastnil koncilu v Nicaei roku 325. V 5. století byl boj s nánosem vzdán a přístav upadl. Vykopávky Princetonské univerzity v letech 1937–1939 odkryly domy s mozaikami a velký kostel."
  nl:
    - "Seleucië in Pieria, of Seleucië aan zee, lag aan de kust van Noord-Syrië iets ten noorden van de monding van de Orontes, op de benedenhellingen van de berg Korypheus; haar ruïnes liggen bij Çevlik, nabij Samandağ in Turkije. Seleucus I stichtte haar omstreeks 300 v.Chr. en noemde haar naar zichzelf. Strabo rekent haar onder de vier zustersteden van de Syrische Tetrapolis, met Antiochië, Apamea en Laodicea, en noemt haar een vesting te sterk om met geweld te worden ingenomen. Het was de haven van Antiochië, dat op 120 stadiën afstand lag."
    - "Nadat Seleucus in 281 v.Chr. was vermoord, legde zijn zoon Antiochus I zijn as in Seleucië neer in een gewijd gebied dat het Nicatoreum heette. In 246 v.Chr. nam Ptolemaeus III van Egypte de stad in, en ze behield een Egyptisch garnizoen tot Antiochus III haar in 219 v.Chr. terugnam; bij Polybius noemt een raadsman van de koning haar de hoofdzetel en bijna de heilige haard van het rijk. Pompeius, na Tigranes van Armenië ervan te hebben afgesneden, verklaarde Seleucië een vrije stad."
    - "In de gemeente te Antiochië zei de Heilige Geest Barnabas en Saulus af te zonderen voor het werk waartoe hij hen geroepen had. Uitgezonden “kwamen af tot Seleucië, en van daar scheepten zij af naar Cyprus”, en zo begon Paulus’ eerste reis. Handelingen noemt geen haven toen zij van Attalia terugvoeren naar Antiochië, maar als haven van Antiochië is Seleucië de waarschijnlijke plaats waar zij landden."
    - "Onder Rome diende de haven de keizerlijke vloot, maar slib van de rivieren bleef haar bedreigen. Onder Vespasianus en Titus begonnen soldaten een kanaal door de rots te hakken, deels als tunnel, om overstromingswater om de stad te leiden; het werk ging door tot in de 2e eeuw. Een bisschop van Seleucië woonde het Concilie van Nicea in 325 bij. In de 5e eeuw werd de strijd tegen het slib opgegeven en raakte de haven in verval. Opgravingen van de Princeton-universiteit in 1937–1939 legden huizen met mozaïeken en een grote kerk bloot."
  sv:
    - "Seleukia i Pieria, eller Seleukia vid havet, låg på kusten i norra Syrien något norr om Orontes mynning, på de nedre sluttningarna av berget Koryfaios; dess ruiner ligger vid Çevlik, nära Samandağ i Turkiet. Seleukos I grundade det omkring 300 f.Kr. och uppkallade det efter sig själv. Strabon räknar det bland de fyra systerstäderna i den syriska Tetrapolis, med Antiochia, Apameia och Laodikeia, och kallar det en fästning för stark för att intas med våld. Det var Antiochias hamn, som låg 120 stadier bort."
    - "Sedan Seleukos mördats 281 f.Kr. lade hans son Antiochos I hans aska i Seleukia i ett heligt område kallat Nikatoreion. År 246 f.Kr. grep Ptolemaios III av Egypten staden, och den behöll en egyptisk garnison tills Antiochos III tog tillbaka den 219 f.Kr.; hos Polybios kallar en kunglig rådgivare den rikets huvudsäte och nästan dess heliga härd. Pompejus förklarade Seleukia för en fri stad sedan han stängt Tigranes av Armenien ute från den."
    - "I församlingen i Antiochia sade den helige Ande: ”Avskiljen åt mig Barnabas och Saulus för det verk som jag har kallat dem till.” Barnabas och Saulus, som så hade blivit utsända, ”foro nu ned till Seleucia och seglade därifrån till Cypern”, och så började Paulus första resa. Apostlagärningarna nämner ingen hamn när de seglade tillbaka från Attalia till Antiochia, men eftersom Seleukia var Antiochias hamn är det den sannolika landstigningsplatsen."
    - "Under Rom tjänade hamnen kejsarflottan, men slam från floderna hotade den ständigt. Under Vespasianus och Titus började soldater hugga en kanal genom berget, delvis som tunnel, för att leda översvämningsvatten runt staden; arbetet pågick in på 100-talet. En biskop av Seleukia deltog i konciliet i Nicaea 325. På 400-talet gav man upp kampen mot slammet, och hamnen förföll. Utgrävningar av Princeton University 1937–1939 frilade hus med mosaiker och en stor kyrka."
  nb:
    - "Seleukia i Pieria, eller Seleukia ved havet, lå på kysten av nordlige Syria litt nord for munningen av Orontes, i de nedre skråningene av Koryfaios-fjellet; ruinene er ved Çevlik, nær Samandağ i Tyrkia. Seleukos I grunnla den omkring 300 f.Kr. og oppkalte den etter seg selv. Strabon regner den blant de fire søsterbyene i den syriske Tetrapolis, med Antiokia, Apameia og Laodikea, og kaller den en festning for sterk til å tas med makt. Den var havnen for Antiokia, som lå 120 stadier unna."
    - "Etter at Seleukos ble myrdet i 281 f.Kr., la hans sønn Antiokhos I asken hans i Seleukia i et helligdomsområde kalt Nikatoreion. I 246 f.Kr. tok Ptolemaios III av Egypt byen, og den beholdt en egyptisk garnison til Antiokhos III tok den tilbake i 219 f.Kr.; hos Polybios kaller en kongelig rådgiver den rikets hovedsete og nesten dets hellige ildsted. Pompeius, etter å ha stengt Tigranes av Armenia ute fra den, erklærte Seleukia for en fri by."
    - "I menigheten i Antiokia sa Den hellige ånd at Barnabas og Saulus skulle settes til side for den gjerningen han hadde kalt dem til. Utsendt «drog de ned til Seleukia og seilte derfra til Kypern», og slik begynte Paulus' første reise. Apostlenes gjerninger nevner ingen havn da de seilte tilbake fra Attalia til Antiokia, men som Antiokias havn er Seleukia det sannsynlige stedet de gikk i land."
    - "Under Roma tjente havnen den keiserlige flåten, men slam fra elvene truet den stadig. Under Vespasian og Titus begynte soldater å hogge en kanal gjennom fjellet, delvis som tunnel, for å lede flomvann utenom byen; arbeidet fortsatte inn på 100-tallet. En biskop av Seleukia deltok på konsilet i Nikea i 325. På 400-tallet ble kampen mot slammet oppgitt, og havnen forfalt. Utgravninger ved Princeton University i 1937–1939 avdekket hus med mosaikker og en stor kirke."
  tl:
    - "Ang Seleucia sa Pieria, o Seleucia sa Tabi ng Dagat, ay nasa baybayin ng hilagang Siria sa hilaga lamang ng bunganga ng Orontes, sa ibabang dalisdis ng Bundok Coryphaeus; ang mga guho nito ay nasa Çevlik, malapit sa Samandağ sa Turkey. Itinatag ito ni Seleuco I bandang 300 BK at pinangalanan sa kaniyang sarili. Binibilang ito ni Strabo sa apat na magkakapatid na lungsod ng Tetrapolis ng Siria, kasama ang Antioquia, Apamea at Laodicea, at tinatawag itong kutang napakatibay para kunin sa dahas. Ito ang daungan ng Antioquia, na 120 stadia ang layo."
    - "Matapos patayin si Seleuco noong 281 BK, inilagay ng kaniyang anak na si Antioco I ang kaniyang abo sa Seleucia sa isang sagradong looban na tinatawag na Nicatoreum. Noong 246 BK, sinakop ni Ptolemeo III ng Egipto ang lungsod, at nanatili itong may garison na Egipcio hanggang bawiin ito ni Antioco III noong 219 BK; sa Polibio, tinatawag ito ng isang tagapayo ng hari na luklukan ng kabisera at halos sagradong apuyan ng imperyo. Si Pompeyo, matapos harangin si Tigranes ng Armenia mula rito, ay nagpahayag na malayang lungsod ang Seleucia."
    - "Sa iglesia sa Antioquia, sinabi ng Espiritu Santo na ihiwalay sina Bernabe at Saulo para sa gawaing itinawag niya sa kanila. Isinugo, sila ay “nagsilusong sa Seleucia; at buhat doo'y nangaglayag hanggang sa Chipre”, at sa gayon nagsimula ang unang paglalakbay ni Pablo. Walang pinangalanang daungan ang Mga Gawa nang bumalik sila mula sa Atalia patungong Antioquia, ngunit bilang daungan ng Antioquia, ang Seleucia ang malamang na lugar ng kanilang pagdaong."
    - "Sa ilalim ng Roma, nagsilbi ang daungan sa hukbong-dagat ng imperyo, ngunit patuloy na pinagbabantaan ito ng banlik mula sa mga ilog. Sa ilalim nina Vespasiano at Tito, nagsimulang magputol ang mga sundalo ng daluyan sa bato, bahagyang tunel, upang ilihis ang baha sa palibot ng bayan; nagpatuloy ang gawain hanggang sa ika-2 siglo. Dumalo ang isang obispo ng Seleucia sa Konseho ng Nicea noong 325. Noong ika-5 siglo, itinigil ang pakikipaglaban sa banlik, at bumaba ang daungan. Ang mga paghuhukay ng Princeton University noong 1937–1939 ay naglantad ng mga bahay na may mosaiko at malaking simbahan."
  da:
    - "Seleukia i Pieria, eller Seleukia ved Havet, lå på det nordlige Syriens kyst lidt nord for Orontes' munding, på de nedre skråninger af Koryfaios-bjerget; dens ruiner ligger ved Çevlik, nær Samandağ i Tyrkiet. Seleukos 1. grundlagde den omkring 300 f.Kr. og opkaldte den efter sig selv. Strabon regner den blandt de fire søsterbyer i den syriske Tetrapolis, sammen med Antiokia, Apameia og Laodikeia, og kalder den en fæstning for stærk til at blive indtaget med magt. Det var Antiokias havn, som lå 120 stadier borte."
    - "Efter at Seleukos blev myrdet i 281 f.Kr., lagde hans søn Antiochos 1. hans aske i Seleukia i et helligt område kaldet Nikatoreion. I 246 f.Kr. greb Ptolemaios 3. af Egypten byen, og den beholdt en egyptisk garnison, indtil Antiochos 3. tog den tilbage i 219 f.Kr.; hos Polybios kalder en kongelig rådgiver den rigets hovedsæde og næsten dets hellige arnested. Pompejus erklærede, efter at have afskåret Tigranes af Armenien fra den, Seleukia for en fri by."
    - "I menigheden i Antiokia sagde Helligånden, at man skulle udtage Barnabas og Saulus til den gerning, han havde kaldet dem til. Udsendt »droge de ned til Seleukia og sejlede derfra til Kypern«, og således begyndte Paulus' første rejse. Apostlenes Gerninger nævner ingen havn, da de sejlede tilbage fra Attalia til Antiokia, men som Antiokias havn er Seleukia det sandsynlige sted, hvor de landede."
    - "Under Rom tjente havnen den kejserlige flåde, men aflejringer fra floderne truede den stadig. Under Vespasian og Titus begyndte soldater at hugge en kanal gennem klippen, delvis som tunnel, for at føre oversvømmelsesvand uden om byen; arbejdet fortsatte ind i 100-tallet. En biskop af Seleukia deltog i koncilet i Nikæa i 325. I 400-tallet opgav man kampen mod aflejringerne, og havnen forfaldt. Udgravninger ved Princeton University i 1937–1939 afdækkede huse med mosaikker og en stor kirke."
  sr:
    - "Селеукија у Пијерији, или Селеукија на мору, лежала је на обали северне Сирије нешто северно од ушћа Оронта, на доњим падинама планине Корифеј; њене рушевине су у Чевлику, близу Саманде у Турској. Основао ју је Селевк I око 300. п. н. е. и назвао по себи. Страбон је убраја међу четири сестринска града сиријског Тетраполиса, с Антиохијом, Апамејом и Лаодикијом, и назива је тврђавом исувише јаком да би била освојена силом. Била је лука Антиохије, која је лежала 120 стадија даље."
    - "Пошто је Селевк убијен 281. п. н. е., његов син Антиох I положио је његов пепео у Селеукији у светом заграђеном простору званом Никаторион. Године 246. п. н. е. Птолемеј III Египатски запосео је град, и он је држао египатску посаду све док га Антиох III није вратио 219. п. н. е.; код Полибија један царски саветник назива је главним седиштем и готово светим огњиштем царства. Помпеј је, пошто је од ње одсекао Тиграна Јерменског, огласио Селеукију слободним градом."
    - "У цркви у Антиохији Дух Свети је рекао да се одвоје Варнава и Саул за дело на које их је позвао. Послани, они „сиђоше у Селеукију, и оданде отпловише у Кипар“, и тако је почело Павлово прво путовање. Дела не именују луку кад су отпловили назад из Аталије у Антиохију, али као антиохијска лука Селеукија је вероватно место где су пристали."
    - "Под Римом је лука служила царској флоти, али муљ из река непрестано јој је претио. Под Веспазијаном и Титом војници су почели да секу канал кроз стену, делом као тунел, да одведе поплавне воде око града; рад је трајао у 2. век. Епископ Селеукије присуствовао је сабору у Никеји 325. У 5. веку борба против муља је напуштена и лука је опала. Ископавања Универзитета Принстон 1937–1939. открила су куће са мозаицима и велику цркву."
  hu:
    - "Szeleukia Pieriában, vagy a Tengerparti Szeleukia, Észak-Szíria partján feküdt, kissé északra az Orontész torkolatától, a Koruphaiosz-hegy alsó lejtőin; romjai Çevliknél vannak, Samandağ közelében Törökországban. I. Szeleukosz alapította Kr. e. 300 körül, és magáról nevezte el. Sztrabón a szíriai Tetrapolisz négy testvérvárosa közé sorolja, Antiókhiával, Apameiával és Laodiceával együtt, és olyan erődnek mondja, amelyet erővel nem lehet bevenni. Antiókhia kikötője volt, amely 120 stadionnyira feküdt."
    - "Miután Szeleukoszt Kr. e. 281-ben meggyilkolták, fia, I. Antiokhosz hamvait Szeleukiában helyezte el egy Nikatóreionnak nevezett szent körzetben. Kr. e. 246-ban az egyiptomi III. Ptolemaiosz elfoglalta a várost, és egyiptomi helyőrség volt benne, míg III. Antiokhosz Kr. e. 219-ben vissza nem vette; Polübiosznál egy királyi tanácsadó a birodalom székhelyének és szinte szent tűzhelyének nevezi. Pompeius, miután elvágta tőle az örmény Tigranészt, Szeleukiát szabad várossá nyilvánította."
    - "Az antiókhiai egyházban a Szentlélek azt mondta, hogy válasszák külön Barnabást és Sault arra a munkára, amelyre elhívta őket. Kibocsátva őket „lemenének Szeleucziába; és onnét elevezének Cziprusba”, és így kezdődött Pál első útja. Az ApCsel nem nevez meg kikötőt, amikor Attáliából visszahajóztak Antiókhiába, de Antiókhia kikötőjeként Szeleukia a valószínű hely, ahol partra szálltak."
    - "Róma alatt a kikötő a császári flottát szolgálta, de a folyók hordaléka folyton fenyegette. Vespasianus és Titusz alatt katonák csatornát kezdtek vágni a sziklán át, részben alagútként, hogy az árvizet a város körül elvezessék; a munka a 2. századig folytatódott. Szeleukia püspöke részt vett a Kr. u. 325-ös nikaiai zsinaton. Az 5. században feladták a hordalék elleni küzdelmet, és a kikötő hanyatlott. A Princeton Egyetem 1937–1939-es ásatásai mozaikos házakat és egy nagy templomot tártak fel."
  fi:
    - "Seleukia Pieriassa eli Meren Seleukia sijaitsi Pohjois-Syyrian rannikolla hieman Orontesin suun pohjoispuolella Koryphaios-vuoren alarinteillä; sen rauniot ovat Çevlikissä Samandağin lähellä Turkissa. Seleukos I perusti sen noin 300 eaa. ja nimesi sen itsensä mukaan. Strabon laskee sen Syyrian Tetrapoliksen neljän sisarkaupungin joukkoon Antiokian, Apamean ja Laodikean kanssa ja kutsuu sitä linnoitukseksi, joka on liian vahva väkisin vallattavaksi. Se oli Antiokian satama; Antiokia oli 120 stadionin päässä."
    - "Seleukoksen murhan jälkeen vuonna 281 eaa. hänen poikansa Antiokhos I laski hänen tuhkansa Seleukiaan pyhälle alueelle, jota kutsuttiin Nikatoreioniksi. Vuonna 246 eaa. Egyptin Ptolemaios III valtasi kaupungin, ja siellä oli egyptiläinen varusväki, kunnes Antiokhos III otti sen takaisin vuonna 219 eaa.; Polybioksella kuninkaan neuvonantaja kutsuu sitä valtakunnan pääistuimeksi ja lähes pyhäksi liedeksi. Pompeius, suljettuaan Armenian Tigraneen siitä, julisti Seleukian vapaaksi kaupungiksi."
    - "Antiokian seurakunnassa Pyhä Henki sanoi: ”Erottakaa minulle Barnabas ja Saulus siihen työhön, johon minä olen heidät kutsunut”. Lähetettyinä he ”menivät Seleukiaan ja purjehtivat sieltä Kyproon”, ja niin alkoi Paavalin ensimmäinen matka. Apostolien teot ei nimeä satamaa, kun he purjehtivat takaisin Attaliasta Antiokiaan, mutta Antiokian satamana Seleukia on todennäköinen laskeutumispaikka."
    - "Rooman alla satama palveli keisarillista laivastoa, mutta jokien liete uhkasi sitä jatkuvasti. Vespasianuksen ja Tituksen aikana sotilaat alkoivat hakata kallion läpi kanavaa, osittain tunnelina, johtamaan tulvavettä kaupungin ohi; työ jatkui 100-luvulle. Seleukian piispa osallistui Nikean kirkolliskokoukseen vuonna 325. 400-luvulla taistelu lietettä vastaan hylättiin, ja satama taantui. Princetonin yliopiston kaivaukset 1937–1939 paljastivat mosaiikkilattioin varustettuja taloja ja suuren kirkon."
  vi:
    - "Sê-lơ-xi ở Pieria, hay Sê-lơ-xi bên Biển, nằm trên bờ biển bắc Sy-ri hơi phía bắc cửa sông Orontes, trên sườn dưới núi Coryphaeus; tàn tích của nó ở Çevlik, gần Samandağ ở Thổ Nhĩ Kỳ. Seleucus I lập nó khoảng năm 300 TCN và đặt tên theo mình. Strabo kể nó trong bốn thành chị em của Tứ Thành Sy-ri, cùng An-ti-ốt, Apamea và Lao-đi-xê, và gọi đó là pháo đài quá vững để bị chiếm bằng vũ lực. Nó là cảng của An-ti-ốt, cách 120 stadia."
    - "Sau khi Seleucus bị ám sát năm 281 TCN, con trai ông là Antiochus I đặt tro của ông tại Sê-lơ-xi trong một khu thiêng gọi là Nicatoreum. Năm 246 TCN, Ptolemaios III của Ai Cập chiếm thành, và nó giữ đồn binh Ai Cập cho đến khi Antiochus III lấy lại năm 219 TCN; trong Polybius, một cố vấn của vua gọi nó là nơi đặt thủ phủ và gần như lò thiêng của đế quốc. Pompey, sau khi cắt Tigranes của Armenia khỏi nó, tuyên bố Sê-lơ-xi là thành tự do."
    - "Trong hội thánh ở An-ti-ốt, Đức Thánh Linh bảo biệt riêng Ba-na-ba và Sau-lơ cho công việc Ngài đã gọi họ. Được sai đi, họ “bèn xuống thành Sê-lơ-xi, rồi từ đó đi thuyền đến đảo Chíp-rơ”, và chuyến đi thứ nhất của Phao-lô bắt đầu như vậy. Sách Công Vụ không nêu cảng nào khi họ đi thuyền về từ Át-ta-li đến An-ti-ốt, nhưng vì là cảng của An-ti-ốt, Sê-lơ-xi có lẽ là nơi họ cập bến."
    - "Dưới La Mã, bến cảng phục vụ hạm đội đế quốc, nhưng phù sa từ các sông liên tục đe dọa nó. Dưới Vespasian và Titus, binh lính bắt đầu cắt một kênh qua đá, một phần là đường hầm, để dẫn nước lũ vòng quanh thành; công việc tiếp diễn đến thế kỷ 2. Một giám mục Sê-lơ-xi dự Công đồng Nicaea năm 325. Vào thế kỷ 5, cuộc chống phù sa bị bỏ, và cảng suy tàn. Các cuộc khai quật của Đại học Princeton năm 1937–1939 phát lộ những ngôi nhà có tranh khảm và một nhà thờ lớn."
  ro:
    - "Seleucia Pieriei, sau Seleucia de la Mare, se afla pe coasta Siriei de nord, puțin la nord de gura Orontelui, pe povârnișurile inferioare ale muntelui Coryphaeus; ruinele ei sunt la Çevlik, lângă Samandağ, în Turcia. Seleucos I a întemeiat-o în jurul anului 300 î.Hr. și i-a dat propriul nume. Strabon o numără printre cele patru cetăți surori ale Tetrapolei siriene, alături de Antiohia, Apamea și Laodiceea, și o numește o fortăreață prea puternică pentru a fi luată cu forța. Era portul Antiohiei, aflată la 120 de stadii depărtare."
    - "După ce Seleucos a fost ucis în 281 î.Hr., fiul său Antioh I i-a depus cenușa la Seleucia într-un loc sacru numit Nicatoreum. În 246 î.Hr., Ptolemeu al III-lea al Egiptului a pus mâna pe oraș, care a avut o garnizoană egipteană până când Antioh al III-lea l-a recucerit în 219 î.Hr.; la Polibiu, un sfetnic regal o numește sediul capitalei și aproape vatra sacră a imperiului. Pompei, după ce l-a izolat de ea pe Tigranes al Armeniei, a declarat Seleucia oraș liber."
    - "În biserica din Antiohia, Duhul Sfânt a spus să fie puși deoparte Barnaba și Saul pentru lucrarea la care îi chemase. Fiind trimiși, „s’au pogorît în Selevchia, și de acolo au mers cu corabiea la Chipru”, și astfel a început prima călătorie a lui Pavel. Faptele nu numesc niciun port când au navigat înapoi de la Atalia la Antiohia, dar, ca port al Antiohiei, Seleucia este locul probabil al debarcării lor."
    - "Sub Roma, portul a servit flota imperială, dar mâlul râurilor îl amenința mereu. Sub Vespasian și Tit, soldații au început să taie un canal prin stâncă, în parte ca tunel, pentru a duce apa viiturilor în jurul orașului; lucrarea a continuat în secolul al II-lea. Un episcop al Seleuciei a participat la Sinodul de la Niceea din 325. În secolul al V-lea, lupta împotriva mâlului a fost abandonată, iar portul a decăzut. Săpăturile Universității Princeton din 1937–1939 au scos la iveală case cu mozaicuri și o biserică mare."
  bg:
    - "Селевкия Пиерийска, или Селевкия при морето, се намирала на брега на Северна Сирия малко на север от устието на Оронт, по долните склонове на планината Корифей; руините ѝ са при Чевлик, близо до Самандаг в Турция. Селевк I я основал около 300 г. пр.н.е. и я нарекъл на себе си. Страбон я причислява към четирите сестрински града на Сирийската тетраполис, заедно с Антиохия, Апамея и Лаодикия, и я нарича крепост, твърде силна, за да бъде превзета със сила. Тя била пристанището на Антиохия, която се намирала на 120 стадия."
    - "След като Селевк бил убит през 281 г. пр.н.е., синът му Антиох I положил праха му в Селевкия в свещен участък, наречен Никаторейон. През 246 г. пр.н.е. египетският цар Птолемей III завзел града и той имал египетски гарнизон, докато Антиох III не си го върнал през 219 г. пр.н.е.; у Полибий един царски съветник го нарича столично седалище и почти свещено огнище на империята. Помпей, след като отрязал от него Тигран Арменски, обявил Селевкия за свободен град."
    - "В църквата в Антиохия Светият Дух казал да бъдат отделени Варнава и Савел за делото, за което ги бил призовал. Изпратени, те „слезоха в Селевкия, и от там отплуваха в Кипър“, и така започнало първото пътуване на Павел. Деяния не назовава пристанище, когато се връщали с кораб от Аталия в Антиохия, но като пристанище на Антиохия Селевкия е вероятното място, където слезли."
    - "При Рим пристанището обслужвало императорския флот, но наносите от реките постоянно го застрашавали. При Веспасиан и Тит войници започнали да изсичат в скалата канал, отчасти като тунел, който да отвежда придошлите води около града; работата продължила и през II в. Епископ на Селевкия присъствал на Никейския събор през 325 г. През V в. борбата с наносите била изоставена и пристанището западнало. Разкопките на Принстънския университет през 1937–1939 г. разкриха къщи с мозайки и голяма църква."
