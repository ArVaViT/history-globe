# Overview article (ADR 0007). Mainstream facts only; Seleucid dates follow the usual reckoning (foundation c. 300 BC, Ptolemaic capture 246 BC, recovery 219 BC).
id: seleucia
place: a6d306d
title:
  en: "Seleucia"
  ru: "Селевкия"
  uk: "Селевкія"
  es: "Seleucia"
  pt: "Selêucia"
  de: "Seleukia"
  fr: "Séleucie"
  it: "Seleucia"
