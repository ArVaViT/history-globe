# Overview article (ADR 0007). Mainstream facts only; a poetic name in two theophany texts; it may be Sinai itself or a height in the wilderness of Paran, and both are given.
id: mount-paran
place: af693b8
title:
  en: "Mount Paran"
  ru: "Гора Фаран"
  uk: "Фаран"
  es: "Monte Parán"
  pt: "Monte Parã"
  de: "Paran"
  fr: "Mont Paran"
  it: "Monte Paran"
  pl: "Góra Paran"
  nl: "Paran"
  cs: "Hora Páran"
body:
  en:
    - "Mount Paran is named only in two old poems that describe God coming from the south to his people. In the Blessing of Moses, “The LORD came from Sinai, and rose up from Seir unto them; he shined forth from mount Paran”; in the prayer of Habakkuk, “God came from Teman, and the Holy One from mount Paran”. Paran here stands in parallel with Sinai, Seir and Teman, the southern lands of Edom and the desert, and the mountain is not a place anyone in the story visits. The Song of Deborah uses the same picture of the Lord marching out of Seir and Edom."
    - "Where it was is not known. The map follows those who take it as another name for Sinai, the mountain of the law, and also marks the wilderness of Paran, the desert south of Kadesh and west of the Arabah, where others look for a range or height of the same name. Some think of the hills west of the Gulf of Aqaba, others of the plateau of the central Sinai; none has a site that could be excavated, and the name is better read as poetry of the south than as a point on the map."
  ru:
    - "Гора Фаран названа только в двух древних песнях, описывающих, как Бог приходит к Своему народу с юга. В благословении Моисея «Господь пришел от Синая, открылся им от Сеира, воссиял от горы Фарана»; в молитве Аввакума «Бог от Фемана грядет», а Святый — «от горы Фаран». Фаран стоит здесь в одном ряду с Синаем, Сеиром и Феманом, южными землями Едома и пустыни, и это не место, куда кто-либо приходит по ходу рассказа. Песнь Деворы рисует ту же картину: Господь выступает от Сеира и от полей Едомских."
    - "Где она находилась, неизвестно. На карте принято мнение тех, кто считает её другим именем Синая, горы закона, и отмечена также пустыня Фаран к югу от Кадеса и к западу от Аравы, где другие ищут хребет или вершину того же имени. Одни думают о горах к западу от залива Акаба, другие — о плато центрального Синая; ни у одного варианта нет места для раскопок, и имя скорее надо читать как поэтический образ юга, чем как точку на карте."
  uk:
    - "Гора Фаран названа лише в двох давніх поемах, що описують, як Бог приходить з півдня до свого народу. У Благословенні Мойсея: «Господь зійшов від Синая і явився із Сеїра; засіяв із Паран гори і прийшов із тьмами сьвятих»; у молитві Авакума: «Колись прийшов був Бог від Теману, Сьвятий — від Паран-гори». Фаран тут стоїть паралельно з Синаєм, Сеїром і Теманом, південними краями Едому й пустелі, і гора — не місце, яке хтось в оповіді відвідує. Пісня Дебори вживає ту саму картину Господа, що виходить із Сеїру й Едому."
    - "Де вона була, невідомо. Мапа слідує тим, хто вважає її іншим ім’ям Синаю, гори закону, і також позначає пустелю Фаран, пустелю на південь від Кадеса й на захід від Арави, де інші шукають хребет чи висоту з тією самою назвою. Одні думають про пагорби на захід від Акабської затоки, інші — про плато центрального Синаю; жодне не має місця, яке можна було б розкопати, і назву краще читати як поезію півдня, ніж як точку на мапі."
  es:
    - "El monte Parán se nombra solo en dos antiguos poemas que describen a Dios viniendo del sur hacia su pueblo. En la Bendición de Moisés: «Jehová vino de Sinaí, y de Seir les esclareció; resplandeció del monte de Parán»; en la oración de Habacuc: «Dios vendrá de Temán, y el Santo del monte de Parán». Parán está aquí en paralelo con Sinaí, Seir y Temán, las tierras meridionales de Edom y el desierto, y la montaña no es un lugar que nadie visite en el relato. El Cántico de Débora usa la misma imagen del Señor que sale de Seir y de Edom."
    - "Dónde estaba no se sabe. El mapa sigue a quienes la toman por otro nombre del Sinaí, la montaña de la ley, y marca también el desierto de Parán, el desierto al sur de Cades y al oeste del Arabá, donde otros buscan una cordillera o altura del mismo nombre. Algunos piensan en las colinas al oeste del golfo de Aqaba, otros en la meseta del Sinaí central; ninguna tiene un sitio que pueda excavarse, y el nombre se lee mejor como poesía del sur que como un punto en el mapa."
  pt:
    - "O monte Parã é nomeado apenas em dois poemas antigos que descrevem Deus vindo do sul ao seu povo. Na Bênção de Moisés: “O SENHOR veio do Sinai, e raiou de Seir sobre eles. Ele resplandeceu do monte Parã”; na oração de Habacuque: “Deus veio de Temã, o Santo, do monte Parã”. Parã está aqui em paralelo com Sinai, Seir e Temã, as terras do sul de Edom e do deserto, e a montanha não é um lugar que alguém na história visite. O Cântico de Débora usa o mesmo quadro do Senhor marchando de Seir e de Edom."
    - "Onde ficava não se sabe. O mapa segue os que a tomam por outro nome do Sinai, a montanha da lei, e marca também o deserto de Parã, o deserto ao sul de Cades e a oeste da Arabá, onde outros procuram uma cordilheira ou altura do mesmo nome. Alguns pensam nas colinas a oeste do golfo de Aqaba, outros no planalto do centro do Sinai; nenhum tem sítio que possa ser escavado, e o nome é melhor lido como poesia do sul do que como ponto no mapa."
  de:
    - "Der Berg Paran wird nur in zwei alten Gedichten genannt, die Gott beschreiben, der aus dem Süden zu seinem Volk kommt. Im Segen des Mose: „Der Herr ist vom Sinai gekommen und ist ihnen aufgegangen von Seir; er ist hervorgebrochen von dem Berge Pharan“; im Gebet Habakuks: „Gott kam vom Mittag und der Heilige vom Gebirge Pharan“. Paran steht hier parallel zu Sinai, Seir und Teman, den südlichen Ländern Edoms und der Wüste, und der Berg ist kein Ort, den jemand in der Erzählung besucht. Das Lied der Debora verwendet dasselbe Bild vom Herrn, der aus Seir und Edom auszieht."
    - "Wo er lag, ist nicht bekannt. Die Karte folgt denen, die ihn für einen anderen Namen des Sinai halten, des Berges des Gesetzes, und zeigt auch die Wüste Paran, die Wüste südlich von Kadesch und westlich der Araba, wo andere nach einem Gebirge oder einer Höhe gleichen Namens suchen. Manche denken an die Hügel westlich des Golfs von Akaba, andere an die Hochebene des mittleren Sinai; keiner hat einen Ort, der ausgegraben werden könnte, und der Name liest sich besser als Dichtung des Südens denn als Punkt auf der Karte."
  fr:
    - "Le mont Paran n’est nommé que dans deux anciens poèmes qui décrivent Dieu venant du sud vers son peuple. Dans la bénédiction de Moïse : « L’Éternel est venu du Sinaï, il s’est levé sur eux de Séir, il a resplendi de la montagne de Paran » ; dans la prière d’Habacuc : « Dieu vient de Théman, le Saint vient de la montagne de Paran ». Paran se tient ici en parallèle avec le Sinaï, Séir et Théman, les pays du sud, Édom et le désert, et la montagne n’est pas un lieu que visite quiconque dans le récit. Le Cantique de Débora emploie la même image du Seigneur sortant de Séir et d’Édom."
    - "On ne sait où elle était. La carte suit ceux qui y voient un autre nom du Sinaï, la montagne de la loi, et marque aussi le désert de Paran, le désert au sud de Qadesh et à l’ouest de l’Araba, où d’autres cherchent une chaîne ou une hauteur du même nom. Certains pensent aux collines à l’ouest du golfe d’Aqaba, d’autres au plateau du centre du Sinaï ; aucune n’a de site qui puisse être fouillé, et le nom se lit mieux comme une poésie du sud que comme un point de la carte."
  it:
    - "Il Monte Paran è nominato solo in due antichi poemi che descrivono Dio che viene da sud verso il suo popolo. Nella Benedizione di Mosè: «L’Eterno è venuto dal Sinai, e s’è levato su loro da Seir; ha fatto splendere la sua luce dal monte di Paran»; nella preghiera di Abacuc: «Iddio viene da Teman, e il santo viene dal monte di Paran». Paran sta qui in parallelo con Sinai, Seir e Teman, le terre meridionali di Edom e del deserto, e il monte non è un luogo che alcuno nel racconto visiti. Il Cantico di Debora usa la stessa immagine del Signore che esce da Seir e da Edom."
    - "Dove fosse non si sa. La mappa segue chi lo ritiene un altro nome del Sinai, il monte della legge, e segna anche il deserto di Paran, il deserto a sud di Kades e a ovest dell’Araba, dove altri cercano una catena o un’altura dello stesso nome. Alcuni pensano alle colline a ovest del Golfo di Aqaba, altri all’altopiano del Sinai centrale; nessuno ha un sito che si possa scavare, e il nome è meglio letto come poesia del sud che come un punto sulla mappa."
  pl:
    - "Góra Paran jest wymieniona tylko w dwóch starych poematach opisujących Boga idącego z południa do swego ludu. W Błogosławieństwie Mojżesza: „Pan z Synaj przyszedł, i pojawił się im z Seiru, objaśnił się z góry Faran”; w modlitwie Habakuka: „Bóg szedł od południa, a Święty z góry Faran”. Paran stoi tu równolegle z Synajem, Seirem i Temanem, południowymi krainami Edomu i pustyni, a góra nie jest miejscem, które ktokolwiek w opowieści odwiedza. Pieśń Debory używa tego samego obrazu Pana wychodzącego z Seiru i Edomu."
    - "Gdzie leżała, nie wiadomo. Mapa idzie za tymi, którzy biorą ją za inną nazwę Synaju, góry prawa, i zaznacza też pustynię Paran, pustynię na południe od Kadesz i na zachód od Araby, gdzie inni szukają pasma lub wzniesienia o tej samej nazwie. Niektórzy myślą o wzgórzach na zachód od Zatoki Akaba, inni o płaskowyżu środkowego Synaju; żadne nie ma stanowiska, które dałoby się wykopać, a nazwę lepiej czytać jako poezję południa niż jako punkt na mapie."
  nl:
    - "De berg Paran wordt alleen genoemd in twee oude gedichten die beschrijven hoe God uit het zuiden naar zijn volk komt. In de Zegen van Mozes: “De HEERE is van Sinai gekomen, en is hunlieden opgegaan van Seir; Hij is blinkende verschenen van het gebergte Paran”; in het gebed van Habakuk: “God kwam van Theman, en de Heilige van den berg Paran”. Paran staat hier in parallel met Sinaï, Seïr en Teman, de zuidelijke landen van Edom en de woestijn, en de berg is geen plaats die iemand in het verhaal bezoekt. Het Lied van Debora gebruikt hetzelfde beeld van de HEER die uit Seïr en Edom optrekt."
    - "Waar het lag, is niet bekend. De kaart volgt degenen die het als een andere naam voor de Sinaï opvatten, de berg van de wet, en toont ook de woestijn van Paran, de woestijn ten zuiden van Kades en ten westen van de Araba, waar anderen een gebergte of hoogte met dezelfde naam zoeken. Sommigen denken aan de heuvels ten westen van de Golf van Akaba, anderen aan het plateau van de centrale Sinaï; geen van hen heeft een plaats die kan worden opgegraven, en de naam is beter te lezen als poëzie van het zuiden dan als een punt op de kaart."
  cs:
    - "Hora Páran je jmenována jen ve dvou starých básních, které líčí Boha přicházejícího z jihu ke svému lidu. V Požehnání Mojžíšově „Hospodin z Sinai přišel, a vzešel jim z Seir, zastkvěl se s hory Fáran“; v Abakukově modlitbě „Když se Bůh bral od poledne, a Svatý s hory Fáran“. Páran tu stojí paralelně se Sinajem, Seírem a Témánem, jižními zeměmi Edómu a pouště, a hora není místem, které by kdokoli v příběhu navštívil. Píseň Debořina užívá téhož obrazu Pána vyrážejícího ze Seíru a Edómu."
    - "Kde byla, není známo. Mapa následuje ty, kdo ji pokládají za jiné jméno Sinaje, hory zákona, a označuje také poušť Páran, poušť jižně od Kádeše a západně od Araby, kde jiní hledají pohoří či výšinu téhož jména. Někteří myslí na pahorky západně od Akabského zálivu, jiní na plošinu středního Sinaje; žádný nemá místo, které by šlo vykopat, a jméno je lépe číst jako poezii jihu než jako bod na mapě."
scripture:
  - Deut.33.2
  - Hab.3.3
  - Judg.5.4
sources:
