# Overview article (ADR 0007). Mainstream facts only; the extent of the kingdom is given as the usual reconstruction; the Synodal rendering of 2 Samuel 10:6 is noted as the translation's own.
id: maacah
place: acae7cb
title:
  en: "Maacah"
  ru: "Мааха"
  uk: "Мааха"
  es: "Maaca"
  pt: "Maacá"
  de: "Maacha"
  fr: "Maaca"
  it: "Maaca"
  pl: "Maaka"
  nl: "Maächa"
  cs: "Maaka"
body:
  en:
    - "Maacah was a small Aramean kingdom at the southern foot of Mount Hermon, east of the upper Jordan and the Huleh basin, with Geshur as its neighbour to the south and the town of Abel-beth-maacah on its western edge. Genesis counts a Maachah among the children of Nahor, Abraham's brother, by his concubine Reumah, which fits a people of Aramean kin. Jair of Manasseh took Argob “unto the coasts of Geshuri and Maachathi”, Og's kingdom in Bashan ran “unto the border of the Geshurites and the Maachathites”, and Joshua's conquest stopped there: the Israelites “expelled not the Geshurites, nor the Maachathites: but the Geshurites and the Maachathites dwell among the Israelites until this day”."
    - "When Hanun of Ammon insulted David's envoys, the Ammonites hired Aramean troops, among them “of king Maacah a thousand men”; Chronicles speaks of chariots and horsemen “out of Mesopotamia, and out of Syria-maachah, and out of Zobah”, who camped before Medeba until Joab routed them. The Synodal Bible here makes Maacah's king an Amalekite, which is its own rendering. One of David's thirty, Eliphelet, was “the son of the Maachathite”. Sheba son of Bichri fled from David to Abel-beth-maacah, where a wise woman ended Joab's siege by throwing him the rebel's head; the town was taken again by Ben-hadad of Damascus under Asa and by Tiglath-pileser III in the days of Pekah, who “carried them captive to Assyria”. By then Maacah had long been absorbed by the kingdom of Damascus."
    - "Tel Abel Beth Maacah (Tell Abil el-Qameh), beside Metula on the Lebanese border, has been excavated since 2013: a walled town of the Iron Age with a hoard of silver and a small faience head of a bearded man of the ninth century BC, perhaps a king. The land of Maacah is today the north of the Hula valley and the foothills of the Golan, with Banias, the Caesarea Philippi of the Gospels, at the foot of Hermon."
  ru:
    - "Мааха — небольшое арамейское царство у южного подножия Ермона, к востоку от верхнего Иордана и котловины Хулы, с Гессуром соседом на юге и городом Авел-Беф-Мааха на западной окраине. Книга Бытия числит Мааху среди детей Нахора, брата Авраама, от наложницы Реумы, что подходит народу арамейского родства. Иаир из колена Манассии взял Аргов «до пределов Гесурских и Маахских», царство Ога в Васане простиралось «до предела Гессурского и Маахского», и завоевание Иисуса Навина остановилось там: «сыны Израилевы не выгнали жителей Гессура и Маахи и Хананеев, и живет Гессур и Мааха среди Израиля до сего дня»."
    - "Когда Аннон Аммонитский оскорбил послов Давида, Аммонитяне наняли арамейские войска, среди них «Маахи тысячу человек»; Паралипоменон говорит о колесницах и всадниках «из Сирии Месопотамской и из Сирии Мааха и из Сувы», стоявших перед Медевой, пока их не разбил Иоав. Синодальный перевод называет здесь царя Маахи Амаликитским — это особенность самого перевода. Один из тридцати храбрых Давида, Елифелет, был сыном «Ахасбая, сына Магахати». Савей, сын Бихри, бежал от Давида в Авел-Беф-Мааху, где мудрая женщина прекратила осаду Иоава, выбросив ему голову мятежника; город снова брали Венадад Дамасский при Асе и Феглаффелласар III во дни Факея, который «переселил их в Ассирию». К тому времени Мааху давно поглотило Дамасское царство."
    - "Тель-Авель-Бет-Мааха (Телль-Абиль-эль-Камех) у Метулы на ливанской границе раскапывают с 2013 года: обнесённый стеной город железного века с кладом серебра и маленькой фаянсовой головой бородатого мужчины IX века до н. э., возможно царя. Земля Маахи сегодня — север долины Хула и предгорья Голан, с Баниасом, евангельской Кесарией Филипповой, у подножия Ермона."
  uk:
    - "Мааха була малим арамейським царством біля південного підніжжя гори Гермон, на схід від верхнього Йордану й улоговини Хула, із Гешуром за сусіда на півдні та містом Авел-Бет-Мааха на її західному краю. Книга Буття зараховує Мааху серед дітей Нахора, брата Авраама, від його наложниці Реуми, що пасує до народу арамейської спорідненості. Яір Манасійський узяв Аргов «до границї Гезуріїв і Маакатіїв», царство Ога в Башані сягало «до гряницї Гессурійської і Маахійської», і завоювання Ісуса Навина зупинилося там: «сини Ізрайлеві не прогнали Гесуріїв нї Маахів; і зостались люде Гесурійські й Маахійські між Ізрайльом по сей день»."
    - "Коли Ханун Аммонський зневажив послів Давида, аммонійці найняли арамейські війська, серед них «у царя ж Мааха тисячу чоловіка»; Книга Хронік говорить про колесниці й вершників «із Сириї Месопотамської, і з Сириї Маахової та з Соби», які стали табором перед Мадабою, аж поки Йоав не розбив їх. Синодальний переклад тут робить царя Мааха амалекитянином, що є його власною передачею. Один із тридцяти Давида, Еліфелет, був «син Ахасбая Магахатового». Шева, син Бихрі, втік від Давида до Авел-Бет-Мааха, де мудра жінка припинила облогу Йоава, кинувши йому голову бунтівника; місто було взяте знову Бен-Гададом Дамаським за Аси й Тіглатпаласаром III за днів Факея, який «одвів їх в Ассирию». На той час Мааху давно поглинуло царство Дамаска."
    - "Тель-Авел-Бет-Мааха (Телль-Абіль-ель-Камх), поруч із Метулою на ліванському кордоні, розкопують від 2013 р.: мурове місто залізної доби зі скарбом срібла й малою фаянсовою голівкою бородатого чоловіка IX ст. до н. е., можливо, царя. Земля Мааха сьогодні — північ долини Хула й передгір’я Голанів, із Баніясом, Кесарією Пилиповою Євангелій, біля підніжжя Гермона."
  es:
    - "Maaca era un pequeño reino arameo al pie meridional del monte Hermón, al este del alto Jordán y de la cuenca del Hula, con Gesur como vecino por el sur y la ciudad de Abel-bet-maaca en su borde occidental. Génesis cuenta una Maachâ entre los hijos de Nacor, hermano de Abraham, y su concubina Reuma, lo que concuerda con un pueblo de parentesco arameo. Jair de Manasés tomó Argob «hasta el término de Gessuri y Machâti», el reino de Og en Basán llegaba «hasta los términos de Gessuri y de Maachâti», y la conquista de Josué se detuvo allí: «Mas á los de Gessuri y Maachâti no echaron los hijos de Israel; antes Gessur y Maachât habitaron entre los Israelitas hasta hoy»."
    - "Cuando Hanún de Amón insultó a los enviados de David, los amonitas contrataron tropas arameas, entre ellas «del rey de Maaca mil hombres»; Crónicas habla de carros y jinetes «de Siria de los ríos, y de la Siria de Maachâ, y de Soba», que acamparon delante de Medeba hasta que Joab los derrotó. La Biblia sinodal hace aquí del rey de Maaca un amalecita, lo cual es versión propia suya. Uno de los treinta de David, Elifelet, fue «hijo de Asbai hijo de Maachâti». Seba, hijo de Bicri, huyó de David a Abel-bet-maaca, donde una mujer sabia puso fin al asedio de Joab arrojándole la cabeza del rebelde; la ciudad fue tomada de nuevo por Ben-adad de Damasco bajo Asa y por Tiglat-pileser III en los días de Peka, quien «trasportólos á Asiria». Para entonces Maaca llevaba mucho tiempo absorbida por el reino de Damasco."
    - "Tel Abel Beth Maacah (Tell Abil el-Qameh), junto a Metula, en la frontera libanesa, se excava desde 2013: una ciudad amurallada de la Edad del Hierro con un tesoro de plata y una pequeña cabeza de fayenza de un hombre barbado del siglo IX a. C., quizá un rey. La tierra de Maaca es hoy el norte del valle del Hula y las estribaciones del Golán, con Banias, la Cesarea de Filipo de los Evangelios, al pie del Hermón."
  pt:
    - "Maacá era um pequeno reino arameu no sopé sul do monte Hermom, a leste do alto Jordão e da bacia de Hula, tendo Gesur por vizinha ao sul e a cidade de Abel-Bete-Maacá em sua borda ocidental. Gênesis conta uma Maaca entre os filhos de Naor, irmão de Abraão, por sua concubina Reumá, o que combina com um povo de parentesco arameu. Jair, de Manassés, tomou Argobe “até a fronteira dos gesuritas e dos maacatitas”, o reino de Ogue em Basã ia “até a fronteira dos gesuritas e dos maacatitas”, e a conquista de Josué parou ali: os israelitas “não expulsaram os gesuritas, nem os maacatitas; mas Gesur e Maaca habitam no meio de Israel até o dia de hoje”."
    - "Quando Hanum de Amom insultou os enviados de Davi, os amonitas contrataram tropas arameias, entre elas “o rei de Maaca com mil homens”; as Crônicas falam de carros e cavaleiros “da Mesopotâmia, de Arã-Maaca e de Zobá”, que acamparam diante de Medeba até que Joabe os derrotou. A Bíblia Sinodal faz aqui do rei de Maacá um amalequita, o que é versão sua. Um dos trinta de Davi, Elifelete, era “filho do maacatita”. Sabá, filho de Bicri, fugiu de Davi para Abel-Bete-Maacá, onde uma mulher sábia pôs fim ao cerco de Joabe lançando-lhe a cabeça do rebelde; a cidade foi tomada de novo por Ben-Hadade de Damasco sob Asa e por Tiglate-Pileser III nos dias de Peca, que “os levou cativos para a Assíria”. A essa altura, Maacá havia muito fora absorvida pelo reino de Damasco."
    - "Tel Abel Beth Maacah (Tell Abil el-Qameh), junto a Metula, na fronteira libanesa, é escavado desde 2013: uma cidade murada da Idade do Ferro, com um tesouro de prata e uma pequena cabeça de faiança de um homem barbado do século IX a.C., talvez um rei. A terra de Maacá é hoje o norte do vale de Hula e o sopé do Golã, com Banias, a Cesareia de Filipe dos Evangelhos, ao pé do Hermom."
  de:
    - "Maacha war ein kleines aramäisches Königreich am Südfuß des Hermon, östlich des oberen Jordan und des Hulabeckens, mit Geschur als Nachbar im Süden und der Stadt Abel-Bet-Maacha an seinem Westrand. Die Genesis zählt eine Maacha unter den Kindern Nahors, Abrahams Bruders, von seinem Kebsweib Reuma, was zu einem Volk aramäischer Verwandtschaft passt. Jaïr aus Manasse nahm Argob „bis an die Grenze der Gessuriter und Maachathiter“, Ogs Reich in Baschan reichte „bis an die Grenze der Gessuriter und Maachathiter“, und Josuas Eroberung hielt dort an: „Die Kinder Israel vertrieben aber die zu Gessur und zu Maacha nicht, sondern es wohnten beide, Gessur und Maacha, unter den Kindern Israel bis auf diesen Tag“."
    - "Als Hanun von Ammon Davids Gesandte beleidigte, dingten die Ammoniter aramäische Truppen, darunter „von dem König Maachas tausend Mann“; die Chronik spricht von Wagen und Reitern „aus Mesopotamien, aus dem Syrien von Maacha und aus Zoba“, die sich vor Medeba lagerten, bis Joab sie schlug. Die Synodalbibel macht hier den König von Maacha zu einem Amalekiter, was ihre eigene Wiedergabe ist. Einer von Davids Dreißig, Eliphelet, war „der Sohn Ahasbais, des Maachathiters“. Scheba, der Sohn Bichris, floh vor David nach Abel-Bet-Maacha, wo eine weise Frau Joabs Belagerung beendete, indem sie ihm den Kopf des Aufrührers zuwarf; die Stadt nahm Ben-Hadad von Damaskus unter Asa wieder ein und Tiglat-Pileser III. in den Tagen Pekachs; der Assyrerkönig „führte sie weg nach Assyrien“. Da war Maacha längst vom Königreich Damaskus aufgesogen."
    - "Tel Abel Beth Maacha (Tell Abil el-Qameh), bei Metula an der libanesischen Grenze, wird seit 2013 ausgegraben: eine ummauerte Stadt der Eisenzeit mit einem Silberhort und einem kleinen Fayenceköpfchen eines bärtigen Mannes aus dem 9. Jahrhundert v. Chr., vielleicht eines Königs. Das Land Maacha ist heute der Norden des Hulatals und das Vorland des Golan, mit Banias, dem Caesarea Philippi der Evangelien, am Fuß des Hermon."
  fr:
    - "Maaca était un petit royaume araméen au pied sud du mont Hermon, à l’est du haut Jourdain et du bassin de la Houla, avec Gueschur pour voisin au sud et la ville d’Abel-Beth-Maaca sur sa lisière occidentale. La Genèse compte une Maaca parmi les enfants de Nachor, frère d’Abraham, nés de sa concubine Reüma, ce qui convient à un peuple de parenté araméenne. Jaïr, de Manassé, prit l’Argob « jusqu’à la frontière des Gueschuriens et des Maacathiens », le royaume d’Og en Basan allait « jusqu’à la frontière des Gueschuriens et des Maacathiens », et la conquête de Josué s’arrêta là : les enfants d’Israël « ne chassèrent point les Gueschuriens et les Maacathiens, qui ont habité au milieu d’Israël jusqu’à ce jour »."
    - "Quand Hanun d’Ammon insulta les envoyés de David, les Ammonites engagèrent des troupes araméennes, dont « mille hommes chez le roi de Maaca » ; les Chroniques parlent de chars et de cavaliers pris à solde « chez les Syriens de Mésopotamie et chez les Syriens de Maaca et de Tsoba », qui campèrent devant Médeba jusqu’à ce que Joab les mît en déroute. La Bible synodale fait ici du roi de Maaca un Amalécite, c’est sa traduction. L’un des Trente de David, Éliphéleth, était « fils d’un Maacathien ». Schéba, fils de Bicri, s’enfuit devant David à Abel-Beth-Maaca, où une femme sage mit fin au siège de Joab en lui jetant la tête du rebelle ; la ville fut prise de nouveau par Ben-Hadad de Damas sous Asa, puis par Tiglath-Piléser III du temps de Péka, qui « emmena captifs les habitants en Assyrie ». Maaca était alors depuis longtemps absorbée par le royaume de Damas."
    - "Tel Abel Beth Maacah (Tell Abil el-Qameh), près de Métoula, sur la frontière libanaise, est fouillé depuis 2013 : une ville fortifiée de l’âge du Fer avec un trésor d’argent et une petite tête en faïence d’un homme barbu du IXe siècle av. J.-C., peut-être un roi. Le pays de Maaca est aujourd’hui le nord de la vallée de la Houla et les contreforts du Golan, avec Banias, la Césarée de Philippe des Évangiles, au pied de l’Hermon."
  it:
    - "Maaca era un piccolo regno arameo ai piedi meridionali del Monte Ermon, a est dell’alto Giordano e del bacino di Hula, con Ghesur come vicino a sud e la città di Abel-Bet-Maaca al suo margine occidentale. La Genesi annovera una Maaca tra i figli di Nacor, fratello di Abramo, avuta dalla concubina Reuma, il che si accorda con un popolo di parentela aramea. Iair di Manasse prese Argob «sino ai confini dei Gheshuriti, e dei Mahacathiti», il regno di Og in Basan giungeva «sino ai confini dei Ghesuriti e dei Maacatiti», e la conquista di Giosuè si fermò là: gli Israeliti «non cacciarono i Ghesuriti e i Maacatiti; e Ghesur e Maacath abitano in mezzo a Israele fino al dì d’oggi»."
    - "Quando Canun di Ammon insultò gli inviati di Davide, gli Ammoniti presero al loro soldo truppe aramee, tra cui «mille uomini del re di Maaca»; le Cronache parlano di carri e cavalieri «presso i Siri di Mesopotamia e presso i Siri di Maaca e di Tsoba», che si accamparono davanti a Màdaba finché Ioab li mise in rotta. La Bibbia sinodale qui fa del re di Maaca un Amalecita, resa che le è propria. Uno dei trenta di Davide, Elifelet, era «figliuolo di un Maacatheo». Saba figlio di Bicri fuggì da Davide ad Abel-Bet-Maaca, dove una donna saggia pose fine all’assedio di Ioab gettandogli la testa del ribelle; la città fu presa di nuovo da Ben-Adad di Damasco sotto Asa e da Tiglat-Pilèser III ai giorni di Pekach, che «ne menò gli abitanti in cattività in Assiria». A quel tempo Maaca era da tempo assorbita dal regno di Damasco."
    - "Tel Abel Beth Maacah (Tell Abil el-Qameh), presso Metula sul confine libanese, è scavato dal 2013: una città murata dell’età del Ferro con un tesoretto d’argento e una piccola testa di faience di un uomo barbuto del IX secolo a.C., forse un re. La terra di Maaca è oggi il nord della valle di Hula e le pendici del Golan, con Banias, la Cesarea di Filippo dei Vangeli, ai piedi dell’Ermon."
  pl:
    - "Maaka była małym aramejskim królestwem u południowego podnóża góry Hermon, na wschód od górnego Jordanu i kotliny Chula, z Geszurem jako sąsiadem na południu i miastem Abel-Bet-Maaka na zachodnim skraju. Księga Rodzaju wymienia Maakę wśród dzieci Nachora, brata Abrahama, z jego nałożnicy Reumy, co pasuje do ludu aramejskiego pokrewieństwa. Jair z Manassesa zajął Argob „aż do granicy Jessury i Machaty”, królestwo Oga w Baszanie sięgało „aż do granic Gessurytów, i Mahachatytów”, a podbój Jozuego zatrzymał się tam: „nie wygnali synowie Izraelscy Gessurytów i Machatytów; przetoż mieszkał Gessur i Machat w pośród Izraelczyków aż do dnia tego”."
    - "Gdy Chanun z Ammonu obraził posłów Dawida, Ammonici najęli aramejskie wojska, wśród nich „a od króla Maacha tysiąc mężów”; Księga Kronik mówi o rydwanach i jeźdźcach „z Mezopotamii i z Syryi Maacha, i z Soby”, którzy rozbili obóz przed Medebą, aż Joab ich rozgromił. Biblia synodalna czyni tu króla Maaki Amalekitą, co jest jej własnym odczytaniem. Jeden z trzydziestu Dawida, Elifelet, był „syn Achasbaja, syna Machatego”. Szeba, syn Bikriego, uciekł przed Dawidem do Abel-Bet-Maaka, gdzie mądra kobieta zakończyła oblężenie Joaba, rzucając mu głowę buntownika; miasto zdobył ponownie Ben-Hadad z Damaszku za Asy i Tiglat-Pileser III, który za dni Pekacha „przeniósł obywatele jej do Assyryi”. Do tego czasu Maaka dawno została wchłonięta przez królestwo Damaszku."
    - "Tel Abel Beth Maacah (Tell Abil el-Qameh), obok Metuli przy granicy libańskiej, jest badany od 2013 r.: obwarowane miasto z epoki żelaza ze skarbem srebra i małą fajansową głową brodatego mężczyzny z IX w. p.n.e., może króla. Ziemia Maaki to dziś północ doliny Chula i podgórze Golanu, z Banias, Cezareą Filipową z Ewangelii, u stóp Hermonu."
  nl:
    - "Maächa was een klein Arameeërs koninkrijk aan de zuidvoet van de berg Hermon, ten oosten van de bovenloop van de Jordaan en het Hulabekken, met Gesur als zuiderbuur en de stad Abel-Beth-Maächa aan de westrand. Genesis telt een Maächa onder de kinderen van Nahor, Abrahams broer, bij zijn bijvrouw Reüma, wat past bij een volk van Arameese verwantschap. Jaïr van Manasse nam Argob in “tot aan de landpale der Gezurieten en Maachathieten”, het koninkrijk van Og in Basan liep “tot aan de landpale der Gezurieten, en der Maachathieten”, en Jozua's verovering hield daar op: “Doch de kinderen Israels verdreven de Gezurieten en de Maachathieten niet; maar Gezur en Maachath woonden in het midden van Israel tot op dezen dag”."
    - "Toen Chanun van Ammon Davids gezanten beledigde, huurden de Ammonieten Arameese troepen, onder wie “van den koning van Maacha duizend man”; Kronieken spreekt van wagens en ruiters “uit Mesopotamië, en uit Syrië-Maacha, en uit Zoba”, die zich legerden voor Medeba tot Joab hen versloeg. De Synodale Bijbel maakt hier van Maächa's koning een Amalekiet, wat een eigen weergave is. Een van Davids dertig, Elifelet, was “de zoon van een Maachathiet”. Seba, de zoon van Bichri, vluchtte voor David naar Abel-Beth-Maächa, waar een wijze vrouw Joabs beleg beëindigde door hem het hoofd van de rebel toe te werpen; de stad werd opnieuw ingenomen door Ben-Hadad van Damascus onder Asa en door Tiglat-Pileser III in de dagen van Pekach: “hij voerde hen weg naar Assyrië”. Tegen die tijd was Maächa allang opgenomen in het koninkrijk Damascus."
    - "Tel Abel Beth Maacah (Tell Abil el-Qameh), naast Metula aan de Libanese grens, wordt sinds 2013 opgegraven: een ommuurde stad uit de ijzertijd met een zilverschat en een klein faience hoofd van een bebaarde man uit de negende eeuw v.Chr., misschien een koning. Het land van Maächa is tegenwoordig het noorden van de Hulavallei en de uitlopers van de Golan, met Banias, het Caesarea Filippi van de evangeliën, aan de voet van de Hermon."
  cs:
    - "Maaka bylo malé aramejské království při jižním úpatí hory Hermon, východně od horního Jordánu a pánve Chuly, s Gešurem jako sousedem na jihu a městem Ábel-bét-maaka na západním okraji. Genesis počítá Maachu mezi děti Nachora, Abrahamova bratra, s jeho vedlejší ženou Reúmou, což odpovídá lidu aramejského původu. Jaír Manasesův vzal Argob „až ku pomezí Gessuri a Machati“, království Ogovo v Bášanu sahalo „až ku pomezí Gessuri a Machati“ a Jozuovo dobývání se tam zastavilo: „Nevyhnali pak synové Izraelští Gessuri a Machati, protož bydlil Gessura a Machata u prostřed Izraele až do dnešního dne“."
    - "Když Chanún Amónský urazil Davidovy posly, najali Amónci aramejská vojska, mezi nimi „od krále Maacha tisíc mužů“; Kroniky mluví o vozech a jízdě „z Mezopotamie a z Syrie Maacha a z Soba“, kteří se utábořili před Medebou, dokud je Joáb nerozprášil. Synodální Bible zde činí z krále Maaky Amalečana, což je její vlastní překlad. Jeden z Davidových třiceti, Elifelet, byl „syn Achasbai Machatského“. Šeba, syn Bikrího, utekl před Davidem do Ábel-bét-maaky, kde moudrá žena ukončila Joábovo obléhání tím, že mu hodila hlavu vzbouřence; město dobyl znovu Ben-hadad Damašský za Asy a Tiglatpilesar III. za dnů Pekacha, který „přenesl obyvatele jejich do Assyrie“. Tou dobou byla Maaka už dávno pohlcena damašským královstvím."
    - "Tel Abel Beth Maacah (Tell Abil el-Qameh) u Metuly na libanonské hranici se vykopává od roku 2013: opevněné město z doby železné s pokladem stříbra a malou fajánsovou hlavou vousatého muže z 9. století př. n. l., snad krále. Země Maaka je dnes sever údolí Chuly a podhůří Golánu, s Baníasem, Cesareou Filipovou z evangelií, na úpatí Hermonu."
