# Overview article (ADR 0007). Mainstream facts only; the extent of the kingdom is given as the usual reconstruction; the Synodal rendering of 2 Samuel 10:6 is noted as the translation's own.
id: maacah
place: acae7cb
title:
  en: "Maacah"
  ru: "Мааха"
body:
  en:
    - "Maacah was a small Aramean kingdom at the southern foot of Mount Hermon, east of the upper Jordan and the Huleh basin, with Geshur as its neighbour to the south and the town of Abel-beth-maacah on its western edge. Genesis counts a Maachah among the children of Nahor, Abraham's brother, by his concubine Reumah, which fits a people of Aramean kin. Jair of Manasseh took Argob “unto the coasts of Geshuri and Maachathi”, Og's kingdom in Bashan ran “unto the border of the Geshurites and the Maachathites”, and Joshua's conquest stopped there: the Israelites “expelled not the Geshurites, nor the Maachathites: but the Geshurites and the Maachathites dwell among the Israelites until this day”."
    - "When Hanun of Ammon insulted David's envoys, the Ammonites hired Aramean troops, among them “of king Maacah a thousand men”; Chronicles speaks of chariots and horsemen “out of Mesopotamia, and out of Syria-maachah, and out of Zobah”, who camped before Medeba until Joab routed them. The Synodal Bible here makes Maacah's king an Amalekite, which is its own rendering. One of David's thirty, Eliphelet, was “the son of the Maachathite”. Sheba son of Bichri fled from David to Abel-beth-maacah, where a wise woman ended Joab's siege by throwing him the rebel's head; the town was taken again by Ben-hadad of Damascus under Asa and by Tiglath-pileser III in the days of Pekah, who “carried them captive to Assyria”. By then Maacah had long been absorbed by the kingdom of Damascus."
    - "Tel Abel Beth Maacah (Tell Abil el-Qameh), beside Metula on the Lebanese border, has been excavated since 2013: a walled town of the Iron Age with a hoard of silver and a small faience head of a bearded man of the ninth century BC, perhaps a king. The land of Maacah is today the north of the Hula valley and the foothills of the Golan, with Banias, the Caesarea Philippi of the Gospels, at the foot of Hermon."
  ru:
    - "Мааха — небольшое арамейское царство у южного подножия Ермона, к востоку от верхнего Иордана и котловины Хулы, с Гессуром соседом на юге и городом Авел-Беф-Мааха на западной окраине. Книга Бытия числит Мааху среди детей Нахора, брата Авраама, от наложницы Реумы, что подходит народу арамейского родства. Иаир из колена Манассии взял Аргов «до пределов Гесурских и Маахских», царство Ога в Васане простиралось «до предела Гессурского и Маахского», и завоевание Иисуса Навина остановилось там: «сыны Израилевы не выгнали жителей Гессура и Маахи и Хананеев, и живет Гессур и Мааха среди Израиля до сего дня»."
    - "Когда Аннон Аммонитский оскорбил послов Давида, Аммонитяне наняли арамейские войска, среди них «Маахи тысячу человек»; Паралипоменон говорит о колесницах и всадниках «из Сирии Месопотамской и из Сирии Мааха и из Сувы», стоявших перед Медевой, пока их не разбил Иоав. Синодальный перевод называет здесь царя Маахи Амаликитским — это особенность самого перевода. Один из тридцати храбрых Давида, Елифелет, был сыном «Ахасбая, сына Магахати». Савей, сын Бихри, бежал от Давида в Авел-Беф-Мааху, где мудрая женщина прекратила осаду Иоава, выбросив ему голову мятежника; город снова брали Венадад Дамасский при Асе и Феглаффелласар III во дни Факея, который «переселил их в Ассирию». К тому времени Мааху давно поглотило Дамасское царство."
    - "Тель-Авель-Бет-Мааха (Телль-Абиль-эль-Камех) у Метулы на ливанской границе раскапывают с 2013 года: обнесённый стеной город железного века с кладом серебра и маленькой фаянсовой головой бородатого мужчины IX века до н. э., возможно царя. Земля Маахи сегодня — север долины Хула и предгорья Голан, с Баниасом, евангельской Кесарией Филипповой, у подножия Ермона."
