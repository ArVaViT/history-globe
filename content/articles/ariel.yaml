body:
  en:
    - "Ariel is not a separate town but a poetic name for Jerusalem, used only in one oracle of Isaiah: “Woe to Ariel, to Ariel, the city where David dwelt! add ye year to year; let them kill sacrifices.” The meaning is debated. One reading is “lion of God”, as the King James margin has it. Another links it to the altar hearth of Ezekiel's temple, called by a near-identical word (Ezekiel 43:15–16), and a word of the same form appears on the Mesha Stele of about 840 BC; then the play is that the city of sacrifices will itself become an altar hearth: “I will distress Ariel, and there shall be heaviness and sorrow: and it shall be unto me as Ariel”."
    - "The oracle turns at once from threat to rescue: the nations besieging the city “shall be as a dream of a night vision”, like a hungry man who dreams he eats and wakes empty. Most commentators set it against the Assyrian threat of the late eighth century BC, perhaps Sennacherib's siege of 701 BC, which in the account of Kings ended without the city's fall; the exact date of the oracle is uncertain."
    - "Since Ariel is Jerusalem, the map places it on the city itself; there is nothing separate to find or visit. The name lives on as a Hebrew given name and in the town of Ariel in the West Bank."
  ru:
    - "Ариил — не отдельный город, а поэтическое имя Иерусалима, которое встречается лишь в одном пророчестве Исаии: «Горе Ариилу, Ариилу, городу, в котором жил Давид! приложите год к году; пусть заколают жертвы». Смысл имени спорен. Одно толкование — «лев Божий». Другое связывает его с очагом жертвенника в храме Иезекииля, названным почти тем же словом (Иез. 43:15–16); слово той же формы есть и на стеле Меши около 840 г. до н. э. Тогда игра слов в том, что город жертв сам станет жертвенным очагом: «Но Я стесню Ариил, и будет плач и сетование; и он останется у Меня, как Ариил»."
    - "Пророчество сразу переходит от угрозы к избавлению: народы, осаждающие город, будут «как сон, как ночное сновидение», подобно голодному, которому снится, что он ест, а проснувшись, он пуст. Большинство толкователей относят его к ассирийской угрозе конца VIII века до н. э., возможно к осаде Синаххериба 701 г. до н. э., которая, по книгам Царств, закончилась без падения города; точная дата пророчества неизвестна."
    - "Поскольку Ариил — это Иерусалим, на карте он стоит на самом городе; отдельно искать или посещать здесь нечего. Имя живёт как еврейское личное имя и в городе Ариэль на Западном берегу."
  uk:
    - "Аріїл — не окреме місто, а поетична назва Єрусалима, вжита лише в одному Ісаїному пророцтві: «Горе Аріїлу — Аріїлу, городові, що в йому жив Давид! додайте рік до року; тимчасом нехай собі заколюють жертви.» Значення спірне. Одне прочитання — «лев Божий», як подано на березі Біблії короля Якова. Інше пов'язує його з вівтарним вогнищем храму Єзекіїля, названим майже тотожним словом (Єзекіїль 43:15–16), і слово тієї самої форми є на стелі Меші близько 840 р. до н. е.; тоді гра така, що місто жертв саме стане вівтарним вогнищем: «я стїсню Аріїла, й настане плач та смуток, і буде він у мене, як аріїл»."
    - "Пророцтво одразу повертає від загрози до порятунку: народи, що облягають місто, будуть «як сонне видиво нічне», подібно до голодного, якому сниться, що він їсть, а прокинувшись, він порожній. Більшість коментаторів зіставляють його з ассирійською загрозою кінця VIII століття до н. е., можливо, облогою Сінаххеріба 701 р. до н. е., яка, за оповіддю книг Царів, закінчилася без падіння міста; точна дата пророцтва невпевнена."
    - "Оскільки Аріїл — це Єрусалим, мапа розміщує його на самому місті; немає нічого окремого, щоб знайти чи відвідати. Назва живе як єврейське ім'я та в місті Аріель на Західному березі."
  es:
    - "Ariel no es una ciudad aparte sino un nombre poético de Jerusalén, usado solo en un oráculo de Isaías: «¡Ay de Ariel, ciudad donde habitó David! Añadid un año á otro, mátense víctimas.» El significado se debate. Una lectura es «león de Dios», como lo tiene el margen de la versión del rey Jacobo. Otra lo vincula al hogar del altar del templo de Ezequiel, llamado con una palabra casi idéntica (Ezequiel 43:15–16), y una palabra de la misma forma aparece en la estela de Mesa, hacia 840 a. C.; entonces el juego es que la ciudad de los sacrificios se convertirá ella misma en hogar de altar: «Mas yo pondré á Ariel en apretura, y será desconsolada y triste; y será á mí como Ariel»."
    - "El oráculo pasa enseguida de la amenaza al rescate: la multitud de las naciones que asedian la ciudad «será como sueño de visión nocturna», como el hambriento que sueña que come y despierta vacío. La mayoría de los comentaristas lo sitúan frente a la amenaza asiria de finales del siglo VIII a. C., quizá el asedio de Senaquerib en 701 a. C., que según el relato de Reyes terminó sin que la ciudad cayera; la fecha exacta del oráculo es incierta."
    - "Como Ariel es Jerusalén, el mapa la sitúa en la propia ciudad; no hay nada aparte que encontrar ni visitar. El nombre pervive como nombre propio hebreo y en la ciudad de Ariel, en Cisjordania."
  pt:
    - "Ariel não é uma cidade à parte, mas um nome poético de Jerusalém, usado só num oráculo de Isaías: “Ai de Ariel! Ariel, a cidade onde Davi acampou! Acrescentem ano a ano; que as festas completem o seu ciclo”. O sentido é discutido. Uma leitura é “leão de Deus”, como na margem da King James. Outra o liga à lareira do altar do templo de Ezequiel, chamada por uma palavra quase idêntica (Ezequiel 43:15–16), e uma palavra da mesma forma aparece na Estela de Mesa, de cerca de 840 a.C.; então o jogo é que a cidade dos sacrifícios se tornará ela mesma uma lareira de altar: “eu trarei angústia sobre Ariel, e haverá pranto e lamentação. Ela será para mim como a fornalha do altar”."
    - "O oráculo passa de imediato da ameaça ao resgate: a multidão das nações que a cercam “será como um sonho, uma visão da noite”, como o faminto que sonha que come e acorda vazio. A maioria dos comentaristas o situa diante da ameaça assíria do fim do século VIII a.C., talvez o cerco de Senaqueribe em 701 a.C., que no relato de Reis terminou sem a queda da cidade; a data exata do oráculo é incerta."
    - "Como Ariel é Jerusalém, o mapa a situa na própria cidade; não há nada à parte para achar ou visitar. O nome sobrevive como nome próprio hebraico e na cidade de Ariel, na Cisjordânia."
  de:
    - "Ariel ist keine eigene Stadt, sondern ein poetischer Name für Jerusalem, nur in einem Spruch Jesajas gebraucht: „Weh Ariel, Ariel, du Stadt des Lagers Davids! Füget Jahr zu Jahr und feiert die Feste“. Die Bedeutung ist umstritten. Eine Lesung ist „Löwe Gottes“, wie es der Rand der King-James-Bibel hat. Eine andere verbindet ihn mit dem Altarherd von Hesekiels Tempel, der mit einem nahezu gleichen Wort benannt ist (Hesekiel 43,15–16), und ein Wort derselben Form steht auf der Mesa-Stele von etwa 840 v. Chr.; dann liegt das Spiel darin, dass die Stadt der Opfer selbst zum Altarherd wird: „dann will ich den Ariel ängsten, daß er traurig und voll Jammers sei; und er soll mir ein rechter Ariel sein“."
    - "Der Spruch wendet sich sogleich von der Drohung zur Rettung: Die Völker, die die Stadt belagern, werden sein „wie ein Nachtgesicht im Traum“, wie ein Hungriger, der träumt, er esse, und leer erwacht. Die meisten Ausleger beziehen ihn auf die assyrische Bedrohung des späten 8. Jahrhunderts v. Chr., vielleicht auf Sanheribs Belagerung 701 v. Chr., die nach dem Bericht der Königsbücher ohne den Fall der Stadt endete; die genaue Datierung des Spruchs ist ungewiss."
    - "Da Ariel Jerusalem ist, setzt die Karte es auf die Stadt selbst; es gibt nichts Eigenes zu finden oder zu besuchen. Der Name lebt als hebräischer Vorname fort und in der Stadt Ariel im Westjordanland."
  fr:
    - "Ariel n’est pas une ville distincte mais un nom poétique de Jérusalem, employé dans un seul oracle d’Ésaïe : « Malheur à Ariel, à Ariel, Cité dont David fit sa demeure ! Ajoutez année à année, laissez les fêtes accomplir leur cycle. » Le sens est discuté. Une lecture est « lion de Dieu », comme le porte la marge de la King James. Une autre le rattache au foyer de l’autel du temple d’Ézéchiel, appelé d’un mot presque identique (Ézéchiel 43, 15-16), et un mot de même forme figure sur la stèle de Mescha, vers 840 av. J.-C. ; le jeu est alors que la cité des sacrifices deviendra elle-même un foyer d’autel : « j’assiégerai Ariel ; il y aura des plaintes et des gémissements ; et la ville sera pour moi comme un Ariel »."
    - "L’oracle passe aussitôt de la menace à la délivrance : les nations qui assiègent la ville seront comme un affamé qui rêve qu’il mange et se réveille vide : « Comme il en est d’un songe, d’une vision nocturne, ainsi en sera-t-il de la multitude des nations qui combattront Ariel ». La plupart des commentateurs le rapportent à la menace assyrienne de la fin du VIIIe siècle av. J.-C., peut-être au siège de Jérusalem par Sanchérib en 701 av. J.-C., qui, selon le récit des Rois, s’acheva sans que la ville tombât ; la date exacte de l’oracle est incertaine."
    - "Ariel étant Jérusalem, la carte la place sur la ville même ; il n’y a rien de distinct à trouver ni à visiter. Le nom vit comme prénom hébreu et dans la ville d’Ariel, en Cisjordanie."
  it:
    - "Ariel non è una città a sé ma un nome poetico di Gerusalemme, usato soltanto in un oracolo di Isaia: «Guai ad Ariel, ad Ariel, città dove accampò Davide! Aggiungete anno ad anno, compiano le feste il loro ciclo!» Il significato è discusso. Una lettura è «leone di Dio», come ha il margine della King James. Un’altra lo collega al focolare dell’altare del tempio di Ezechiele, chiamato con una parola quasi identica (Ezechiele 43,15–16), e una parola della stessa forma compare nella stele di Mesa dell’840 a.C. circa; allora il gioco è che la città dei sacrifici diverrà essa stessa un focolare d’altare: «Poi stringerò Ariel da presso; vi saranno lamenti e gemiti, ed ella mi sarà come un Ariel»."
    - "L’oracolo passa subito dalla minaccia al soccorso: la folla delle nazioni che assediano la città «sarà come un sogno, come una visione notturna», come un affamato che sogna di mangiare e si sveglia a stomaco vuoto. La maggior parte dei commentatori lo collega alla minaccia assira della fine dell’VIII secolo a.C., forse all’assedio di Sennacherib del 701 a.C., che nel racconto dei Re terminò senza la caduta della città; la data esatta dell’oracolo è incerta."
    - "Poiché Ariel è Gerusalemme, la carta la pone sulla città stessa; non c’è nulla di separato da trovare o visitare. Il nome vive come nome ebraico di persona e nella città di Ariel in Cisgiordania."
  pl:
    - "Ariel nie jest osobnym miastem, lecz poetycką nazwą Jerozolimy, użytą tylko w jednej wyroczni Izajasza: „Biada Aryjelowi! Aryjelowi miastu, w którem mieszkał Dawid. Przydajcie rok do roku, niechaj rzeżą barany”. Znaczenie jest sporne. Jedno odczytanie to „lew Boży”, jak ma margines Biblii króla Jakuba. Inne łączy je z paleniskiem ołtarza w świątyni Ezechiela, nazwanym niemal identycznym słowem (Ez 43,15–16), a słowo tej samej formy pojawia się na Steli Meszy z około 840 r. p.n.e.; wtedy gra polega na tym, że miasto ofiar samo stanie się paleniskiem ołtarza: „Jednak ucisnę Aryjela, i będzie smutek i żałość, bo mi będzie jako Aryjel”."
    - "Wyrocznia natychmiast zwraca się od groźby do ocalenia: „jako sen widzenia nocnego, tak będzie zgraja wszystkich narodów walczących przeciwko Aryjelowi”, jak głodny, któremu śni się, że je, i budzi się z pustym żołądkiem. Większość komentatorów odnosi to do zagrożenia asyryjskiego z końca VIII wieku p.n.e., może do oblężenia Sennacheryba w 701 r. p.n.e., które według Ksiąg Królewskich skończyło się bez upadku miasta; dokładna data wyroczni jest niepewna."
    - "Ponieważ Ariel to Jerozolima, mapa umieszcza go na samym mieście; nie ma nic osobnego do znalezienia czy odwiedzenia. Nazwa żyje jako hebrajskie imię i w mieście Ariel na Zachodnim Brzegu."
  nl:
    - "Ariël is geen aparte stad maar een dichterlijke naam voor Jeruzalem, alleen gebruikt in één godsspraak van Jesaja: “Wee Ariel, Ariel! de stad, waarin David gelegerd heeft; doet jaar tot jaar; laat ze feestofferen slachten.” De betekenis is omstreden. Een lezing is “leeuw van God”, zoals de kantlijn van de King James Version heeft. Een andere verbindt haar met de altaarhaard van Ezechiëls tempel, met een bijna identiek woord genoemd (Ezechiël 43:15–16), en een woord van dezelfde vorm staat op de Mesa-stèle van omstreeks 840 v.Chr.; dan is het spel dat de stad der offers zelf een altaarhaard zal worden: “Evenwel zal Ik Ariel beangstigen, en er zal treuring en droefheid wezen, en die stad zal Mij gelijk Ariel zijn”."
    - "De godsspraak slaat meteen van dreiging om in redding: de volken die de stad belegeren zullen zijn “gelijk de droom van een nachtgezicht”, als een hongerige die droomt dat hij eet en leeg wakker wordt. De meeste uitleggers plaatsen haar tegen de Assyrische dreiging van de late achtste eeuw v.Chr., misschien Sanheribs beleg van 701 v.Chr., dat volgens het verslag in Koningen eindigde zonder de val van de stad; de precieze datering van de godsspraak is onzeker."
    - "Omdat Ariël Jeruzalem is, plaatst de kaart het op de stad zelf; er is niets afzonderlijks te vinden of te bezoeken. De naam leeft voort als Hebreeuwse voornaam en in de stad Ariel op de Westelijke Jordaanoever."
  cs:
    - "Ariel není samostatné město, ale básnické jméno Jeruzaléma, užité jen v jednom Izajášově proroctví: „Běda Arieli, Arieli městu, v kterémž bydlil David. Přidejte rok po roku, nechať zařezují beránky.“ Význam je sporný. Jedno čtení je „lev Boží“, jak má okraj Bible krále Jakuba. Jiné jej spojuje s oltářním ohništěm Ezechielova chrámu, nazývaným téměř shodným slovem (Ezechiel 43,15–16), a slovo téže podoby se objevuje na Mešově stéle z asi 840 př. n. l.; pak je hra v tom, že město obětí se samo stane oltářním ohništěm: „Však předce ssoužím Ariele. I nastane žalost a zámutek, nebo mi bude jako Ariel.“"
    - "Proroctví se hned obrací od hrozby k záchraně: národy obléhající město budou „jako zdání vidění nočního“, jako lačný, kterému se ve snu zdá, že jí, a procitne prázdný. Většina komentátorů je klade proti asyrské hrozbě konce 8. století př. n. l., snad proti Senacheribovu obležení roku 701 př. n. l., které podle Knih královských skončilo bez pádu města; přesné datum proroctví je nejisté."
    - "Protože Ariel je Jeruzalém, mapa jej klade na samo město; nic zvláštního k nalezení ani k návštěvě tu není. Jméno žije jako hebrejské osobní jméno a ve městě Ariel na Západním břehu."
  sv:
    - "Ariel är ingen särskild stad utan ett poetiskt namn på Jerusalem, använt bara i en enda av Jesajas utsagor: ”Ve dig, Ariel, Ariel, du stad, där David slog upp sitt läger! Läggen år till år och låten högtiderna fullborda sitt kretslopp”. Betydelsen är omdebatterad. En läsning är ”Guds lejon”, som King James-översättningens marginal har det. En annan knyter det till altarhärden i Hesekiels tempel, kallad med ett nästan identiskt ord (Hesekiel 43:15–16), och ett ord av samma form förekommer på Mesha-stelen från omkring 840 f.Kr.; då är ordleken att offrens stad själv ska bli en altarhärd: ”så skall jag bringa Ariel i trångmål; jämmer skall följa på jämmer, och då bliver det för mig ett verkligt Ariel”."
    - "Utsagan vänder genast från hot till räddning: folken som belägrar staden ”skola vara såsom en drömsyn om natten”, som en hungrig man som drömmer att han äter och vaknar tom. De flesta kommentatorer sätter den mot det assyriska hotet i slutet av 700-talet f.Kr., kanske Sanheribs belägring år 701 f.Kr., som i Konungabökernas berättelse slutade utan att staden föll; utsagans exakta tid är osäker."
    - "Eftersom Ariel är Jerusalem placerar kartan det på själva staden; det finns ingenting särskilt att finna eller besöka. Namnet lever kvar som hebreiskt förnamn och i staden Ariel på Västbanken."
  nb:
    - "Ariel er ikke en egen by, men et poetisk navn på Jerusalem, brukt bare i ett av Jesajas utsagn: «Ve Ariel, Ariel, du by hvor David slo leir! Legg år til år, la høitidene gå sin rundgang!» Betydningen er omdiskutert. En lesning er «Guds løve», slik King James-oversettelsens marginalnote har det. En annen knytter det til alterildstedet i Esekiels tempel, kalt med et nesten identisk ord (Esekiel 43,15–16), og et ord av samme form forekommer på Mesa-steleen fra omkring 840 f.Kr.; da er poenget at offerbyen selv skal bli et alterildsted: «Da vil jeg gjøre det trangt for Ariel, og der skal være sorg og jammer; men så skal det bli mig et virkelig Ariel»."
    - "Utsagnet vender straks fra trussel til redning: folkene som beleirer byen, «skal bli som en drøm, et syn om natten», som en sulten mann som drømmer at han spiser og våkner tom. De fleste kommentatorer setter det mot den assyriske trusselen sent på 700-tallet f.Kr., kanskje Sankeribs beleiring i 701 f.Kr., som i Kongebøkenes beretning endte uten at byen falt; den nøyaktige dateringen av utsagnet er usikker."
    - "Siden Ariel er Jerusalem, plasserer kartet det på selve byen; det er ingenting separat å finne eller besøke. Navnet lever videre som et hebraisk fornavn og i byen Ariel på Vestbredden."
scripture:
