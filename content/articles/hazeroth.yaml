body:
  en:
    - "Hazeroth, “enclosures” or “settlements”, was a camping place of Israel in the wilderness between Mount Sinai and Kadesh. Numbers lists it after Kibroth-hattaavah, the graves of lust, and before the wilderness of Paran, and Deuteronomy opens with the places between which Moses spoke, “between Paran, and Tophel, and Laban, and Hazeroth, and Dizahab”. The usual identification is the oasis of Ain Hudra, also written Ain el-Khadra, with its spring and palms in a wadi some 60 km north-east of Jebel Musa on the way towards the Gulf of Aqaba: the Arabic name resembles the Hebrew, and Johann Ludwig Burckhardt, who passed it in 1816, and Edward Robinson after him made the link. The record here follows it, with the caution that it depends on Mount Sinai being Jebel Musa and that nothing from Israel's time has been found there."
    - "One story is set at Hazeroth. “Miriam and Aaron spake against Moses because of the Ethiopian woman whom he had married”, and asked, “Hath the LORD indeed spoken only by Moses?” God called the three to the tabernacle, declared that with Moses he spoke “mouth to mouth”, and when the cloud departed “Miriam became leprous, white as snow”. Moses prayed for her; she was shut out of the camp seven days, “and the people journeyed not till Miriam was brought in again”, and then they left Hazeroth for the wilderness of Paran, from which the spies went out. In the Synodal Bible this last verse opens the next chapter."
    - "Other places bore the same name, and nothing more is known of this one. Eusebius placed Aseroth no more precisely than as the part of the desert where Miriam and Aaron spoke against Moses. Ain Hudra today is a small Bedouin oasis in the South Sinai governorate of Egypt, reached from Nuweiba by jeep or on foot through the sandstone canyons."
  ru:
    - "Асироф, «дворы» или «поселения», был стоянкой Израиля в пустыне между горой Синай и Кадесом. Книга Чисел называет его после Киброт-Гаттаавы, гробов прихоти, и перед пустынью Фаран, а Второзаконие открывается перечнем мест, между которыми говорил Моисей: «между Фараном и Тофелом, и Лаваном, и Асирофом, и Дизагавом». Обычное отождествление — оазис Айн-Худра, он же Айн-эль-Хадра, с источником и пальмами в вади примерно в 60 км к северо-востоку от Джебель-Муса по пути к заливу Акаба: арабское имя похоже на еврейское, и Иоганн Людвиг Буркхардт, прошедший здесь в 1816 г., а за ним Эдвард Робинсон связали их. Запись здесь следует этому, с оговоркой, что оно зависит от того, что гора Синай — Джебель-Муса, и что ничего от времён Израиля там не найдено."
    - "В Асирофе происходит одна история. «И упрекали Мариам и Аарон Моисея за жену Ефиоплянку, которую он взял», и спрашивали: «одному ли Моисею говорил Господь?» Бог призвал всех троих к скинии, объявил, что с Моисеем говорит «устами к устам», и, когда облако отошло, «Мариам покрылась проказою, как снегом». Моисей молился за неё; её держали вне стана семь дней, «и народ не отправлялся в путь, доколе не возвратилась Мариам», а затем они ушли из Асирофа в пустыню Фаран, откуда были посланы соглядатаи. В Синодальном переводе этот последний стих открывает следующую главу."
    - "То же имя носили и другие места, и больше об этом ничего не известно. Евсевий указывал Асироф не точнее, чем как ту часть пустыни, где Мариам и Аарон упрекали Моисея. Айн-Худра сегодня — маленький бедуинский оазис в провинции Южный Синай в Египте, куда добираются из Нувейбы на джипе или пешком через песчаниковые каньоны."
  uk:
    - "Хацерот, «огорожі» або «поселення», був станом Ізраїлю в пустелі між горою Синай і Кадешем. Книга Чисел перелічує його після Кіброт-Гаттаави, могил пожадливості, і перед пустелею Фаран, а Повторення Закону відкривається місцями, між якими промовляв Мойсей, «між Параном і Тофельом і Лабаном і Газеротом і Ди-Сагабом». Звичайне ототожнення — оаза Айн-Худра, пишуть також Айн-ель-Хадра, з її джерелом і пальмами у ваді приблизно за 60 км на північний схід від Джебель-Муси на шляху до Акабської затоки: арабська назва нагадує давньоєврейську, і зв’язок помітили Йоганн Людвіг Буркгардт, який проходив повз неї 1816 року, а за ним Едвард Робінсон. Запис тут йде за цим, з застереженням, що це залежить від того, чи гора Синай — Джебель-Муса, і що нічого з часів Ізраїлю там не знайдено."
    - "З Хацеротом пов’язана одна історія. «Миряма ж та Арон нарікали на Мойсея за молодицю Кушицьку, що взяв її» і питали: «Хиба ж тільки до Мойсея промовляв Господь?» Бог покликав трьох до намету, оголосив, що з Мойсеєм говорить «Устами до уст», а коли хмара відступила, «Миряма ж несподівано зробилась прокаженною, біла мов снїг». Мойсей молився за неї; її замкнули поза табором на сім днів, і «не рушав люд в дорогу, аж як прилучено Миряму», а тоді вони пішли з Хацерота до пустелі Фаран, звідки вирушили розвідники. У Синодальній Біблії цей останній вірш відкриває наступний розділ."
    - "Інші місця мали ту саму назву, і про це більше нічого невідомо. Євсевій визначав Асерот не точніше, ніж як ту частину пустелі, де Міріам та Аарон говорили проти Мойсея. Айн-Худра сьогодні — невелика бедуїнська оаза в губернаторстві Південний Синай у Єгипті, куди добираються від Нувейби на джипі або пішки крізь піщаникові каньйони."
  es:
    - "Haserot, «recintos» o «poblados», era un lugar de campamento de Israel en el desierto entre el monte Sinaí y Cades. Números la enumera después de Kibrot-hataava, las tumbas de la codicia, y antes del desierto de Parán, y el Deuteronomio comienza con los lugares entre los cuales habló Moisés, «entre Parán, y Thopel, y Labán, y Haseroth, y Dizahab». La identificación habitual es el oasis de Ain Hudra, escrito también Ain el-Khadra, con su fuente y sus palmeras en un wadi a unos 60 km al nordeste del Jebel Musa, en el camino hacia el golfo de Áqaba: el nombre árabe se parece al hebreo, y Johann Ludwig Burckhardt, que pasó por allí en 1816, y después Edward Robinson establecieron el vínculo. El registro de aquí la sigue, con la cautela de que depende de que el monte Sinaí sea el Jebel Musa y de que nada de la época de Israel se ha hallado allí."
    - "Un relato se sitúa en Haserot. «Y hablaron María y Aarón contra Moisés á causa de la mujer Ethiope que había tomado», y preguntaron: «¿Solamente por Moisés ha hablado Jehová?». Dios llamó a los tres al tabernáculo, declaró que con Moisés hablaba «Boca á boca», y cuando la nube se apartó «María era leprosa como la nieve». Moisés oró por ella; fue echada del real siete días, «y el pueblo no pasó adelante hasta que se le reunió María», y entonces dejaron Haserot rumbo al desierto de Parán, de donde salieron los espías. En la Biblia sinodal este último versículo abre el capítulo siguiente."
    - "Otros lugares llevaron el mismo nombre, y nada más se sabe de este. Eusebio no situó Aseroth con más precisión que como la parte del desierto donde María y Aarón hablaron contra Moisés. Ain Hudra es hoy un pequeño oasis beduino de la gobernación del Sinaí del Sur, en Egipto, al que se llega desde Nuweiba en todoterreno o a pie por los cañones de arenisca."
  pt:
    - "Hazerote, “recintos” ou “povoados”, foi um pouso de Israel no deserto entre o monte Sinai e Cades. Números a lista depois de Quibrote-Hataavá, os sepulcros da cobiça, e antes do deserto de Parã, e Deuteronômio abre com os lugares entre os quais Moisés falou, “entre Parã, Tofel, Labã, Hazerote e Di-Zaabe”. A identificação usual é o oásis de Ain Hudra, escrito também Ain el-Khadra, com sua fonte e palmeiras num uádi a cerca de 60 km a nordeste de Jebel Musa, a caminho do golfo de Aqaba: o nome árabe se assemelha ao hebraico, e Johann Ludwig Burckhardt, que passou por ali em 1816, e Edward Robinson depois dele fizeram a ligação. O registro aqui a segue, com a ressalva de que depende de o monte Sinai ser Jebel Musa e de que nada do tempo de Israel foi achado ali."
    - "Uma história se passa em Hazerote. “Miriã e Arão falaram contra Moisés por causa da mulher cuxita com quem ele havia se casado”, e perguntaram: “O SENHOR falou de fato apenas com Moisés?” Deus chamou os três à Tenda, declarou que com Moisés falava “boca a boca” e, quando a nuvem se retirou, “Miriã estava leprosa, branca como a neve”. Moisés orou por ela; ela ficou fora do acampamento sete dias, “e o povo não seguiu viagem até que Miriã fosse trazida de volta”, e então deixaram Hazerote rumo ao deserto de Parã, de onde saíram os espiões. Na Bíblia Sinodal este último versículo abre o capítulo seguinte."
    - "Outros lugares tiveram o mesmo nome, e nada mais se sabe deste. Eusébio não situou Aseroth com mais precisão do que como a parte do deserto onde Miriã e Arão falaram contra Moisés. Ain Hudra é hoje um pequeno oásis beduíno na província do Sinai do Sul, no Egito, alcançado de Nuweiba de jipe ou a pé pelos desfiladeiros de arenito."
  de:
    - "Hazerot, „Gehöfte“ oder „Siedlungen“, war ein Lagerplatz Israels in der Wüste zwischen dem Sinai und Kadesch. Das vierte Buch Mose führt es nach Kibrot-Taawa, den Lustgräbern, und vor der Wüste Paran auf, und das fünfte Buch Mose beginnt mit den Orten, zwischen denen Mose sprach, „zwischen Pharan und Tophel, Laban Hazeroth und Disahab“. Die übliche Gleichsetzung ist die Oase Ain Hudra, auch Ain el-Chadra geschrieben, mit Quelle und Palmen in einem Wadi etwa 60 km nordöstlich des Dschebel Musa auf dem Weg zum Golf von Akaba: Der arabische Name ähnelt dem hebräischen, und Johann Ludwig Burckhardt, der 1816 vorüberzog, und nach ihm Edward Robinson stellten die Verbindung her. Die Aufzeichnung hier folgt ihr, mit dem Vorbehalt, dass sie davon abhängt, dass der Sinai der Dschebel Musa ist, und dass dort nichts aus Israels Zeit gefunden wurde."
    - "Eine Geschichte spielt in Hazerot. „Mirjam und Aaron redeten wider Mose um seines Weibes willen, der Mohrin, die er genommen hatte“, und sprachen: „Redet denn der HERR allein durch Mose?“ Gott rief die drei zur Stiftshütte, erklärte, dass er mit Mose „mündlich“ rede, und als die Wolke wich, „war Mirjam aussätzig wie der Schnee“. Mose betete für sie; sie wurde sieben Tage außerhalb des Lagers verschlossen, „und das Volk zog nicht weiter, bis Mirjam aufgenommen ward“, und dann verließen sie Hazerot in die Wüste Paran, von wo die Kundschafter ausgesandt wurden. In der Synodalübersetzung eröffnet dieser letzte Vers das nächste Kapitel."
    - "Andere Orte trugen denselben Namen, und von diesem ist nichts weiter bekannt. Eusebius verortete Aseroth nicht genauer denn als den Teil der Wüste, wo Mirjam und Aaron gegen Mose redeten. Ain Hudra ist heute eine kleine Beduinenoase im ägyptischen Gouvernement Südsinai, von Nuweiba aus mit dem Jeep oder zu Fuß durch die Sandsteincanyons zu erreichen."
  fr:
    - "Hatséroth, « enclos » ou « établissements », était un lieu de campement d’Israël dans le désert entre le mont Sinaï et Qadesh. Les Nombres la citent après Kibroth-Hattaava, les tombeaux de la convoitise, et avant le désert de Paran, et le Deutéronome s’ouvre sur les lieux entre lesquels parla Moïse, « entre Paran, Tophel, Laban, Hatséroth et Di-Zahab ». L’identification habituelle est l’oasis d’Aïn Hudra, écrite aussi Aïn el-Khadra, avec sa source et ses palmiers dans un oued à quelque 60 km au nord-est du Jebel Musa sur la route du golfe d’Aqaba : le nom arabe ressemble à l’hébreu, et Johann Ludwig Burckhardt, qui y passa en 1816, puis Edward Robinson firent le rapprochement. La fiche la suit, avec la réserve qu’elle dépend de l’identification du mont Sinaï au Jebel Musa et que rien du temps d’Israël n’y a été trouvé."
    - "Un récit se déroule à Hatséroth. Miriam et Aaron « parlèrent contre Moïse au sujet de la femme éthiopienne qu’il avait prise », et demandèrent : « Est-ce seulement par Moïse que l’Éternel parle ? » Dieu appela les trois à la tente d’assignation, déclara qu’il parlait à Moïse « bouche à bouche », et quand la nuée se retira, Miriam fut « frappée d’une lèpre, blanche comme la neige ». Moïse pria pour elle ; elle fut enfermée sept jours hors du camp, et « le peuple ne partit point » avant qu’elle y fût rentrée, puis ils quittèrent Hatséroth pour le désert de Paran, d’où partirent les espions. Dans la Bible synodale, ce dernier verset ouvre le chapitre suivant."
    - "D’autres lieux ont porté le même nom, et l’on ne sait rien de plus de celui-ci. Eusèbe ne situait Aseroth pas plus précisément que comme la partie du désert où Miriam et Aaron parlèrent contre Moïse. Aïn Hudra est aujourd’hui une petite oasis bédouine du gouvernorat du Sinaï du Sud, en Égypte, que l’on atteint depuis Nuweiba en jeep ou à pied par les canyons de grès."
  pl:
    - "Chasserot, „zagrody” lub „osiedla”, było miejscem obozowania Izraela na pustyni między górą Synaj a Kadesz. Księga Liczb wymienia je po Kibrot-Hattaawa, grobach pożądliwości, i przed pustynią Paran, a Księga Powtórzonego Prawa zaczyna się od miejsc, między którymi mówił Mojżesz: „między Faran, i między Tofel, i Laban, i Haserot, i Dyzahab”. Zwykłe utożsamienie to oaza Ain Hudra, pisana też Ain el-Chadra, ze źródłem i palmami w wadi około 60 km na północny wschód od Dżebel Musa w drodze ku Zatoce Akaba: arabska nazwa przypomina hebrajską, a związek ten wskazali Johann Ludwig Burckhardt, który ją mijał w 1816 r., i po nim Edward Robinson. Zapis tutaj idzie za nim, z zastrzeżeniem, że zależy to od tego, czy górą Synaj jest Dżebel Musa, i że nic z czasów Izraela tam nie znaleziono."
    - "Z Chasserot wiąże się jedna opowieść: Miriam i Aaron mówili przeciw Mojżeszowi z powodu Etiopki, którą pojął, i pytali: „Izali tylko przez Mojżesza mówił Pan?”. Bóg wezwał całą trójkę do przybytku, oświadczył, że z Mojżeszem mówi: „Usty do ust mawiam z nim”, a gdy obłok odstąpił, „Maryja otrędowaciała, zbielawszy jako śnieg”. Mojżesz modlił się za nią; wyłączono ją z obozu na siedem dni, „a lud się nie ruszył, aż była Maryja przyjęta”, po czym opuścili Chasserot i ruszyli na pustynię Paran, skąd wysłano zwiadowców. W Biblii synodalnej ten ostatni werset otwiera następny rozdział."
    - "Inne miejsca nosiły tę samą nazwę, a o tym nie wiadomo nic więcej. Euzebiusz umiejscawiał Aseroth nie dokładniej niż jako tę część pustyni, gdzie Miriam i Aaron mówili przeciw Mojżeszowi. Ain Hudra to dziś mała beduińska oaza w muhafazie Synaj Południowy w Egipcie, do której dociera się z Nuwajby jeepem lub pieszo przez piaskowcowe kaniony."
  it:
    - "Cazerot, «recinti» o «insediamenti», era una tappa d’Israele nel deserto fra il Monte Sinai e Kades. I Numeri la elencano dopo Kibrot-Taava, le tombe della concupiscenza, e prima del deserto di Paran, e il Deuteronomio si apre con i luoghi fra i quali parlò Mosè, «fra Paran, Tofel, Laban, Hatseroth e Di-Zahab». L’identificazione consueta è l’oasi di Ain Hudra, scritta anche Ain el-Khadra, con la sua sorgente e le sue palme in un wadi circa 60 km a nord-est del Jebel Musa sulla via verso il Golfo di Aqaba: il nome arabo somiglia a quello ebraico, e Johann Ludwig Burckhardt, che vi passò nel 1816, e dopo di lui Edward Robinson stabilirono il legame. Il registro lo segue, con la cautela che dipende dall’essere il Monte Sinai il Jebel Musa e dal fatto che nulla del tempo d’Israele vi è stato trovato."
    - "A Cazerot è ambientato un racconto. «Maria ed Aaronne parlarono contro Mosè a cagione della moglie Cuscita che avea preso», e chiesero: «L’Eterno ha egli parlato soltanto per mezzo di Mosè?» Dio chiamò i tre alla tenda di convegno, dichiarò che con Mosè parlava «a tu per tu», e quando la nuvola si ritirò «Maria era lebbrosa, bianca come neve». Mosè pregò per lei; fu rinchiusa fuori del campo sette giorni, «e il popolo non si mise in cammino finché Maria non fu riammessa al campo», e poi lasciarono Cazerot per il deserto di Paran, da cui partirono gli esploratori. Nella Bibbia sinodale quest’ultimo versetto apre il capitolo successivo."
    - "Altri luoghi portarono lo stesso nome, e nulla di più si sa di questo. Eusebio non collocava Aseroth più precisamente che come la parte del deserto dove Maria e Aaronne parlarono contro Mosè. Ain Hudra è oggi una piccola oasi beduina nel governatorato egiziano del Sinai Meridionale, raggiunta da Nuweiba in jeep o a piedi attraverso i canyon di arenaria."
  nl:
    - "Hazerot, “omheiningen” of “nederzettingen”, was een legerplaats van Israël in de woestijn tussen de Sinaï en Kades. Numeri noemt het na Kibrot-Hattaäva, de graven van de begeerlijkheid, en vóór de woestijn van Paran, en Deuteronomium opent met de plaatsen waartussen Mozes sprak, “tussen Paran en tussen Tofel, en Laban, en Hazeroth, en Dizahab”. De gebruikelijke identificatie is de oase Ain Hudra, ook geschreven Ain el-Khadra, met bron en palmen in een wadi zo’n 60 km ten noordoosten van de Jebel Musa op weg naar de Golf van Aqaba: de Arabische naam lijkt op de Hebreeuwse, en Johann Ludwig Burckhardt, die er in 1816 voorbijkwam, en na hem Edward Robinson legden het verband. Het register hier volgt dit, met de kanttekening dat het afhangt van de Sinaï als Jebel Musa en dat er niets uit Israëls tijd is gevonden."
    - "Eén verhaal speelt zich af te Hazerot. “Mirjam nu sprak, en Aaron, tegen Mozes, ter oorzake der vrouw, der Cuschietische, die hij genomen had”, en zij vroegen: “Heeft dan de HEERE maar alleen door Mozes gesproken?” God riep de drie naar de tent, verklaarde dat Hij met Mozes sprak “van mond tot mond”, en toen de wolk week, “Mirjam was melaats, wit als de sneeuw”. Mozes bad voor haar; zij werd zeven dagen buiten het leger gesloten, “en het volk verreisde niet, totdat Mirjam aangenomen werd”, en daarna verlieten zij Hazerot naar de woestijn van Paran, vanwaar de verspieders uittrokken. In de Synodale Bijbel opent dit laatste vers het volgende hoofdstuk."
    - "Andere plaatsen droegen dezelfde naam, en van deze is verder niets bekend. Eusebius plaatste Aseroth niet nauwkeuriger dan als het deel van de woestijn waar Mirjam en Aaron tegen Mozes spraken. Ain Hudra is nu een kleine bedoeïenenoase in het Egyptische gouvernement Zuid-Sinaï, vanuit Nuweiba per jeep of te voet te bereiken door de zandsteenkloven."
  cs:
    - "Chacerót, „ohrady“ nebo „osady“, bylo tábořiště Izraele na poušti mezi horou Sinaj a Kádešem. Numeri je uvádějí po Kibrót-hataava, hrobech chtíče, a před pouští Páran, a Deuteronomium se otevírá místy, mezi nimiž Mojžíš mluvil, „mezi Fáran a Tofel a Lában a Hazerot a Dizahab“. Obvyklým ztotožněním je oáza Ajn Chudra, psaná též Ajn el-Chadra, s pramenem a palmami ve wádí asi 60 km severovýchodně od Džebel Músá na cestě k Akabskému zálivu: arabské jméno se podobá hebrejskému a spojení vytvořili Johann Ludwig Burckhardt, který tudy prošel roku 1816, a po něm Edward Robinson. Záznam je následuje s upozorněním, že závisí na tom, zda je hora Sinaj Džebel Músá, a že tam nebylo nalezeno nic z Izraelovy doby."
    - "U Chacerótu se odehrává jeden příběh. „A mluvila Maria i Aron proti Mojžíšovi příčinou manželky Madianky, kterouž sobě vzal“ a řekli: „Zdaliž jen toliko skrze Mojžíše mluvil Hospodin?“ Bůh svolal všechny tři ke stánku, prohlásil, že s Mojžíšem mluví „Ústy k ústům“, a když se oblak zdvihl, „Maria byla malomocná, bílá jako sníh“. Mojžíš se za ni modlil; byla vyloučena z tábora na sedm dní, „a lid nehnul se odtud, až zase uvedena jest Maria“, a pak odešli z Chacerótu na poušť Páran, odkud vyšli zvědové. V synodální Bibli tento poslední verš otevírá další kapitolu."
    - "Jiná místa nesla stejné jméno a o tomto se nic dalšího neví. Eusebios neurčil polohu Aseroth přesněji než jako tu část pouště, kde Mirjam a Áron mluvili proti Mojžíšovi. Ajn Chudra je dnes malá beduínská oáza v gubernii Jižní Sinaj v Egyptě, dostupná z Nuwejby džípem nebo pěšky pískovcovými kaňony."
  sv:
    - "Haserot, ”inhägnader” eller ”bosättningar”, var ett lägerställe för Israel i öknen mellan Sinaiberget och Kadesh. Fjärde Moseboken upptar det efter Kivrot-Hattaava, lustens gravar, och före Parans öken, och Femte Moseboken inleds med platserna mellan vilka Mose talade, ”mellan Paran och Tofel, Laban, Haserot och Di-Sahab”. Den vanliga identifieringen är oasen Ain Hudra, också skriven Ain el-Khadra, med sin källa och sina palmer i en wadi omkring 60 km nordost om Jebel Musa på vägen mot Akababukten: det arabiska namnet liknar det hebreiska, och Johann Ludwig Burckhardt, som passerade 1816, och Edward Robinson efter honom gjorde kopplingen. Uppgiften här följer den, med förbehållet att den beror på att Sinaiberget är Jebel Musa och att inget från Israels tid har hittats där."
    - "En berättelse är förlagd till Haserot. ”Mirjam jämte Aron talade illa om Mose för den etiopiska kvinnans skull som han hade tagit till hustru”, och de frågade: ”Är då Mose den ende som HERREN talar med?” Gud kallade de tre till uppenbarelsetältet, förklarade att han talade med Mose: ”Muntligen talar jag med honom, öppet och icke i förtäckta ord”, och när molnskyn drog sig tillbaka ”var Mirjam vit såsom snö av spetälska”. Mose bad för henne; hon hölls innestängd utanför lägret i sju dagar, och ”folket bröt icke upp, förrän Mirjam hade kommit tillbaka”, och därefter lämnade de Haserot för Parans öken, varifrån spejarna gick ut. I den ryska synodalbibeln inleder denna sista vers nästa kapitel."
    - "Andra platser bar samma namn, och inget mer är känt om denna. Eusebios förlade Aseroth inte närmare än till den del av öknen där Mirjam och Aron talade illa om Mose. Ain Hudra är i dag en liten beduinoas i Egyptens guvernement Sydsinai, nådd från Nuweiba med jeep eller till fots genom sandstenskanjoner."
  nb:
    - "Haserot, «innhegninger» eller «bosetninger», var en leirplass for Israel i ørkenen mellom Sinai og Kadesj. Fjerde Mosebok oppfører den etter Kibrot-Hattaava, lystens graver, og før ørkenen Paran, og Femte Mosebok åpner med stedene Moses talte imellom, «mellem Paran og Tofel og Laban og Haserot og Di-Sahab». Den vanlige identifikasjonen er oasen Ain Hudra, også skrevet Ain el-Khadra, med kilde og palmer i en wadi omtrent 60 km nordøst for Jebel Musa på veien mot Aqaba-bukta: det arabiske navnet ligner det hebraiske, og Johann Ludwig Burckhardt, som passerte den i 1816, og Edward Robinson etter ham gjorde koblingen. Oppføringen her følger den, med det forbeholdet at den avhenger av at Sinai er Jebel Musa og at ingenting fra Israels tid er funnet der."
    - "Én fortelling er lagt til Haserot. Mirjam og Aron talte «ille om Moses for den etiopiske kvinnes skyld som han hadde tatt til hustru», og spurte: «Er det bare Moses Herren har talt med, har han ikke talt med oss og?» Gud kalte de tre til sammenkomstens telt, erklærte at han talte med Moses «Munn til munn», og da skyen vek bort, «var Mirjam spedalsk, hvit som sne». Moses ba for henne; hun ble holdt utenfor leiren i syv dager, og «folket brøt ikke op før Mirjam var kommet tilbake igjen», og så forlot de Haserot for ørkenen Paran, hvorfra speiderne ble sendt ut. I den synodale bibelen åpner dette siste verset det neste kapitlet."
    - "Andre steder bar samme navn, og ingenting mer er kjent om dette. Eusebius plasserte Aseroth ikke mer nøyaktig enn som den delen av ørkenen der Mirjam og Aron talte mot Moses. Ain Hudra er i dag en liten beduinoase i guvernementet Sør-Sinai i Egypt, nådd fra Nuweiba med jeep eller til fots gjennom sandsteinskanjonene."
  tl:
    - "Ang Haseroth, “mga bakuran” o “mga paninirahan”, ay tigilan ng Israel sa ilang sa pagitan ng Bundok Sinai at Cades. Nakalista ito sa Mga Bilang pagkatapos ng Kibroth-hattaavah, mga libingan ng pagnanasa, at bago ang ilang ng Paran; bumubukas ang Deuteronomio sa mga lugar kung saan nagsalita si Moises, “sa pagitan ng Paran, at ng Thopel, at ng Laban, at ng Haseroth, at ng Di-zahab”. Ang karaniwang pagkakakilanlan ay ang oasis ng Ain Hudra, isinusulat ding Ain el-Khadra, na may bukal at palma sa wadi mga 60 km hilagang-silangan ng Jebel Musa patungong Look ng Aqaba: kahawig ng Hebreo ang pangalang Arabe, at ginawa nina Johann Ludwig Burckhardt, na dumaan noong 1816, at Edward Robinson pagkatapos niya ang ugnayan. Sinusunod ito ng tala, na may babalang nakasalalay ito sa pagiging Jebel Musa ng Bundok Sinai at walang natagpuan doon mula sa panahon ng Israel."
    - "Isang kuwento ang itinakda sa Haseroth. “Si Miriam at si Aaron ay nagsalitaan laban kay Moises tungkol sa pagkapagasawa niya sa isang babaing Cusita”, at nagtanong, “Ang Panginoon ba'y kay Moises lamang nakipagsalitaan?” Tinawag ng Dios ang tatlo sa tabernakulo, ipinahayag na kay Moises ay nakikipag-usap siya “ng bibig, sa bibig”, at nang lumayo ang ulap, “si Miriam ay nagkaketong, na pumuting gaya ng niebe”. Nanalangin si Moises para sa kaniya; kinulong siya sa labas ng kampamento nang pitong araw, “at ang bayan ay hindi naglakbay hanggang si Miriam ay nadalang muli sa loob”, at pagkatapos ay umalis sila sa Haseroth patungo sa ilang ng Paran, kung saan lumabas ang mga tiktik. Sa Bibliyang Synodal ang huling talatang ito ang nagbubukas sa susunod na kabanata."
    - "Ibang mga lugar ang may parehong pangalan, at wala nang higit na nalalaman tungkol dito. Inilagay ni Eusebio ang Aseroth nang hindi mas tiyak kaysa sa bahagi ng disyerto kung saan nagsalita sina Miriam at Aaron laban kay Moises. Ang Ain Hudra ngayon ay isang maliit na oasis ng mga Bedouin sa gobernadorado ng Timog Sinai ng Egipto, na inaabot mula sa Nuweiba sa pamamagitan ng jeep o lakad sa mga kanyon ng batong buhangin."
  da:
    - "Haserot, »indhegninger« eller »bosættelser«, var en lejrplads for Israel i ørkenen mellem Sinajbjerget og Kadesj. Fjerde Mosebog opregner den efter Kibrot-ha-Ta'ava, begærlighedens grave, og før Parans ørken, og Femte Mosebog åbner med de steder, mellem hvilke Moses talte, »imellem Paran og imellem Tofel og Laban og Hazeroth og Di-Sahab«. Den sædvanlige identifikation er oasen Ain Hudra, også skrevet Ain el-Khadra, med sin kilde og palmer i en wadi omkring 60 km nordøst for Jebel Musa på vejen mod Aqababugten: det arabiske navn ligner det hebraiske, og Johann Ludwig Burckhardt, der kom forbi i 1816, og Edward Robinson efter ham knyttede forbindelsen. Registreringen her følger den, med forbehold for, at den afhænger af, at Sinajbjerget er Jebel Musa, og at intet fra Israels tid er fundet der."
    - "Én fortælling er lagt til Haserot. »Maria og Aron talede imod Mose for den morlandske Hustrus Skyld, som han havde taget«, og spurgte: »Taler Herren ene og alene ved Mose?« Gud kaldte de tre til tabernaklet, erklærede, at han talte med Moses »mundtlig«, og da skyen veg bort, »se, Maria var spedalsk som Sne«. Moses bad for hende; hun blev udelukket fra lejren i syv dage, og »Folket rejste ikke, førend Maria blev optaget«, og så forlod de Haserot og drog til Parans ørken, hvorfra spejderne blev sendt ud. I den russiske synodalbibel åbner dette sidste vers næste kapitel."
    - "Andre steder bar samme navn, og mere vides ikke om dette. Eusebios placerede Aseroth ikke mere præcist end som den del af ørkenen, hvor Mirjam og Aron talte imod Moses. Ain Hudra er i dag en lille beduinoase i Sydsinaj-guvernementet i Egypten, som nås fra Nuweiba med jeep eller til fods gennem sandstenskløfterne."
