# Overview article (ADR 0007). Mainstream facts only; the identification with Ain Hudra is given as the usual one, resting on the name and on Sinai being Jebel Musa, and nothing from Israel's time is claimed there.
id: hazeroth
place: a1b6474
title:
  en: "Hazeroth"
  ru: "Асироф"
  uk: "Хацерот"
  es: "Haserot"
  pt: "Hazerote"
  de: "Hazerot"
  fr: "Hatséroth"
body:
  en:
    - "Hazeroth, “enclosures” or “settlements”, was a camping place of Israel in the wilderness between Mount Sinai and Kadesh. Numbers lists it after Kibroth-hattaavah, the graves of lust, and before the wilderness of Paran, and Deuteronomy opens with the places between which Moses spoke, “between Paran, and Tophel, and Laban, and Hazeroth, and Dizahab”. The usual identification is the oasis of Ain Hudra, also written Ain el-Khadra, with its spring and palms in a wadi some 60 km north-east of Jebel Musa on the way towards the Gulf of Aqaba: the Arabic name resembles the Hebrew, and Johann Ludwig Burckhardt, who passed it in 1816, and Edward Robinson after him made the link. The record here follows it, with the caution that it depends on Mount Sinai being Jebel Musa and that nothing from Israel's time has been found there."
    - "One story is set at Hazeroth. “Miriam and Aaron spake against Moses because of the Ethiopian woman whom he had married”, and asked, “Hath the LORD indeed spoken only by Moses?” God called the three to the tabernacle, declared that with Moses he spoke “mouth to mouth”, and when the cloud departed “Miriam became leprous, white as snow”. Moses prayed for her; she was shut out of the camp seven days, “and the people journeyed not till Miriam was brought in again”, and then they left Hazeroth for the wilderness of Paran, from which the spies went out. In the Synodal Bible this last verse opens the next chapter."
    - "Other places bore the same name, and nothing more is known of this one. Eusebius knew Aseroth only as the place in the desert where Miriam and Aaron spoke against Moses. Ain Hudra today is a small Bedouin oasis in the South Sinai governorate of Egypt, reached from Nuweiba by jeep or on foot through the sandstone canyons."
  ru:
    - "Асироф, «дворы» или «поселения», был стоянкой Израиля в пустыне между горой Синай и Кадесом. Книга Чисел называет его после Киброт-Гаттаавы, гробов прихоти, и перед пустынью Фаран, а Второзаконие открывается перечнем мест, между которыми говорил Моисей: «между Фараном и Тофелом, и Лаваном, и Асирофом, и Дизагавом». Обычное отождествление — оазис Айн-Худра, он же Айн-эль-Хадра, с источником и пальмами в вади примерно в 60 км к северо-востоку от Джебель-Муса по пути к заливу Акаба: арабское имя похоже на еврейское, и Иоганн Людвиг Буркхардт, прошедший здесь в 1816 г., а за ним Эдвард Робинсон связали их. Запись здесь следует этому, с оговоркой, что оно зависит от того, что гора Синай — Джебель-Муса, и что ничего от времён Израиля там не найдено."
    - "В Асирофе происходит одна история. «И упрекали Мариам и Аарон Моисея за жену Ефиоплянку, которую он взял», и спрашивали: «одному ли Моисею говорил Господь?» Бог призвал всех троих к скинии, объявил, что с Моисеем говорит «устами к устам», и, когда облако отошло, «Мариам покрылась проказою, как снегом». Моисей молился за неё; её держали вне стана семь дней, «и народ не отправлялся в путь, доколе не возвратилась Мариам», а затем они ушли из Асирофа в пустыню Фаран, откуда были посланы соглядатаи. В Синодальном переводе этот последний стих открывает следующую главу."
    - "То же имя носили и другие места, и больше об этом ничего не известно. Евсевий знал Асироф лишь как место в пустыне, где Мариам и Аарон упрекали Моисея. Айн-Худра сегодня — маленький бедуинский оазис в провинции Южный Синай в Египте, куда добираются из Нувейбы на джипе или пешком через песчаниковые каньоны."
  uk:
    - "Хацерот, «огорожі» або «поселення», був станом Ізраїлю в пустелі між горою Синай і Кадешем. Книга Чисел перелічує його після Кіброт-Гаттаави, могил пожадливості, і перед пустелею Фаран, а Повторення Закону відкривається місцями, між якими промовляв Мойсей, «між Параном і Тофельом і Лабаном і Газеротом і Ди-Сагабом». Звичайне ототожнення — оаза Айн-Худра, пишуть також Айн-ель-Хадра, з її джерелом і пальмами у ваді приблизно за 60 км на північний схід від Джебель-Муси на шляху до Акабської затоки: арабська назва нагадує давньоєврейську, і зв’язок помітили Йоганн Людвіг Буркгардт, який проходив повз неї 1816 року, а за ним Едвард Робінсон. Запис тут йде за цим, з застереженням, що це залежить від того, чи гора Синай — Джебель-Муса, і що нічого з часів Ізраїлю там не знайдено."
    - "З Хацеротом пов’язана одна історія. «Миряма ж та Арон нарікали на Мойсея за молодицю Кушицьку, що взяв її» і питали: «Хиба ж тільки до Мойсея промовляв Господь?» Бог покликав трьох до намету, оголосив, що з Мойсеєм говорить «Устами до уст», а коли хмара відступила, «Миряма ж несподівано зробилась прокаженною, біла мов снїг». Мойсей молився за неї; її замкнули поза табором на сім днів, і «не рушав люд в дорогу, аж як прилучено Миряму», а тоді вони пішли з Хацерота до пустелі Фаран, звідки вирушили розвідники. У Синодальній Біблії цей останній вірш відкриває наступний розділ."
    - "Інші місця мали ту саму назву, і про це більше нічого невідомо. Євсевій знав Асерот лише як місце в пустелі, де Міріам та Аарон говорили проти Мойсея. Айн-Худра сьогодні — невелика бедуїнська оаза в губернаторстві Південний Синай у Єгипті, куди добираються від Нувейби на джипі або пішки крізь піщаникові каньйони."
  es:
    - "Haserot, «recintos» o «poblados», era un lugar de campamento de Israel en el desierto entre el monte Sinaí y Cades. Números la enumera después de Kibrot-hataava, las tumbas de la codicia, y antes del desierto de Parán, y el Deuteronomio comienza con los lugares entre los cuales habló Moisés, «entre Parán, y Thopel, y Labán, y Haseroth, y Dizahab». La identificación habitual es el oasis de Ain Hudra, escrito también Ain el-Khadra, con su fuente y sus palmeras en un wadi a unos 60 km al nordeste del Jebel Musa, en el camino hacia el golfo de Áqaba: el nombre árabe se parece al hebreo, y Johann Ludwig Burckhardt, que pasó por allí en 1816, y después Edward Robinson establecieron el vínculo. El registro de aquí la sigue, con la cautela de que depende de que el monte Sinaí sea el Jebel Musa y de que nada de la época de Israel se ha hallado allí."
    - "Un relato se sitúa en Haserot. «Y hablaron María y Aarón contra Moisés á causa de la mujer Ethiope que había tomado», y preguntaron: «¿Solamente por Moisés ha hablado Jehová?». Dios llamó a los tres al tabernáculo, declaró que con Moisés hablaba «Boca á boca», y cuando la nube se apartó «María era leprosa como la nieve». Moisés oró por ella; fue echada del real siete días, «y el pueblo no pasó adelante hasta que se le reunió María», y entonces dejaron Haserot rumbo al desierto de Parán, de donde salieron los espías. En la Biblia sinodal este último versículo abre el capítulo siguiente."
    - "Otros lugares llevaron el mismo nombre, y nada más se sabe de este. Eusebio conoció Aseroth solo como el lugar del desierto donde María y Aarón hablaron contra Moisés. Ain Hudra es hoy un pequeño oasis beduino de la gobernación del Sinaí del Sur, en Egipto, al que se llega desde Nuweiba en todoterreno o a pie por los cañones de arenisca."
  pt:
    - "Hazerote, “recintos” ou “povoados”, foi um pouso de Israel no deserto entre o monte Sinai e Cades. Números a lista depois de Quibrote-Hataavá, os sepulcros da cobiça, e antes do deserto de Parã, e Deuteronômio abre com os lugares entre os quais Moisés falou, “entre Parã, Tofel, Labã, Hazerote e Di-Zaabe”. A identificação usual é o oásis de Ain Hudra, escrito também Ain el-Khadra, com sua fonte e palmeiras num uádi a cerca de 60 km a nordeste de Jebel Musa, a caminho do golfo de Aqaba: o nome árabe se assemelha ao hebraico, e Johann Ludwig Burckhardt, que passou por ali em 1816, e Edward Robinson depois dele fizeram a ligação. O registro aqui a segue, com a ressalva de que depende de o monte Sinai ser Jebel Musa e de que nada do tempo de Israel foi achado ali."
    - "Uma história se passa em Hazerote. “Miriã e Arão falaram contra Moisés por causa da mulher cuxita com quem ele havia se casado”, e perguntaram: “O SENHOR falou de fato apenas com Moisés?” Deus chamou os três à Tenda, declarou que com Moisés falava “boca a boca” e, quando a nuvem se retirou, “Miriã estava leprosa, branca como a neve”. Moisés orou por ela; ela ficou fora do acampamento sete dias, “e o povo não seguiu viagem até que Miriã fosse trazida de volta”, e então deixaram Hazerote rumo ao deserto de Parã, de onde saíram os espiões. Na Bíblia Sinodal este último versículo abre o capítulo seguinte."
    - "Outros lugares tiveram o mesmo nome, e nada mais se sabe deste. Eusébio conheceu Aseroth apenas como o lugar no deserto onde Miriã e Arão falaram contra Moisés. Ain Hudra é hoje um pequeno oásis beduíno na província do Sinai do Sul, no Egito, alcançado de Nuweiba de jipe ou a pé pelos desfiladeiros de arenito."
  de:
    - "Hazerot, „Gehöfte“ oder „Siedlungen“, war ein Lagerplatz Israels in der Wüste zwischen dem Sinai und Kadesch. Das vierte Buch Mose führt es nach Kibrot-Taawa, den Lustgräbern, und vor der Wüste Paran auf, und das fünfte Buch Mose beginnt mit den Orten, zwischen denen Mose sprach, „zwischen Pharan und Tophel, Laban Hazeroth und Disahab“. Die übliche Gleichsetzung ist die Oase Ain Hudra, auch Ain el-Chadra geschrieben, mit Quelle und Palmen in einem Wadi etwa 60 km nordöstlich des Dschebel Musa auf dem Weg zum Golf von Akaba: Der arabische Name ähnelt dem hebräischen, und Johann Ludwig Burckhardt, der 1816 vorüberzog, und nach ihm Edward Robinson stellten die Verbindung her. Die Aufzeichnung hier folgt ihr, mit dem Vorbehalt, dass sie davon abhängt, dass der Sinai der Dschebel Musa ist, und dass dort nichts aus Israels Zeit gefunden wurde."
    - "Eine Geschichte spielt in Hazerot. „Mirjam und Aaron redeten wider Mose um seines Weibes willen, der Mohrin, die er genommen hatte“, und sprachen: „Redet denn der HERR allein durch Mose?“ Gott rief die drei zur Stiftshütte, erklärte, dass er mit Mose „mündlich“ rede, und als die Wolke wich, „war Mirjam aussätzig wie der Schnee“. Mose betete für sie; sie wurde sieben Tage außerhalb des Lagers verschlossen, „und das Volk zog nicht weiter, bis Mirjam aufgenommen ward“, und dann verließen sie Hazerot in die Wüste Paran, von wo die Kundschafter ausgesandt wurden. In der Synodalübersetzung eröffnet dieser letzte Vers das nächste Kapitel."
    - "Andere Orte trugen denselben Namen, und von diesem ist nichts weiter bekannt. Eusebius kannte Aseroth nur als den Ort in der Wüste, wo Mirjam und Aaron gegen Mose redeten. Ain Hudra ist heute eine kleine Beduinenoase im ägyptischen Gouvernement Südsinai, von Nuweiba aus mit dem Jeep oder zu Fuß durch die Sandsteincanyons zu erreichen."
  fr:
    - "Hatséroth, « enclos » ou « établissements », était un lieu de campement d’Israël dans le désert entre le mont Sinaï et Qadesh. Les Nombres la citent après Kibroth-Hattaava, les tombeaux de la convoitise, et avant le désert de Paran, et le Deutéronome s’ouvre sur les lieux entre lesquels parla Moïse, « entre Paran, Tophel, Laban, Hatséroth et Di-Zahab ». L’identification habituelle est l’oasis d’Aïn Hudra, écrite aussi Aïn el-Khadra, avec sa source et ses palmiers dans un oued à quelque 60 km au nord-est du Jebel Musa sur la route du golfe d’Aqaba : le nom arabe ressemble à l’hébreu, et Johann Ludwig Burckhardt, qui y passa en 1816, puis Edward Robinson firent le rapprochement. La fiche la suit, avec la réserve qu’elle dépend de l’identification du mont Sinaï au Jebel Musa et que rien du temps d’Israël n’y a été trouvé."
    - "Un récit se déroule à Hatséroth. Miriam et Aaron « parlèrent contre Moïse au sujet de la femme éthiopienne qu’il avait prise », et demandèrent : « Est-ce seulement par Moïse que l’Éternel parle ? » Dieu appela les trois à la tente d’assignation, déclara qu’il parlait à Moïse « bouche à bouche », et quand la nuée se retira, Miriam fut « frappée d’une lèpre, blanche comme la neige ». Moïse pria pour elle ; elle fut enfermée sept jours hors du camp, et « le peuple ne partit point » avant qu’elle y fût rentrée, puis ils quittèrent Hatséroth pour le désert de Paran, d’où partirent les espions. Dans la Bible synodale, ce dernier verset ouvre le chapitre suivant."
    - "D’autres lieux ont porté le même nom, et l’on ne sait rien de plus de celui-ci. Eusèbe ne connaissait Aseroth que comme le lieu du désert où Miriam et Aaron parlèrent contre Moïse. Aïn Hudra est aujourd’hui une petite oasis bédouine du gouvernorat du Sinaï du Sud, en Égypte, que l’on atteint depuis Nuweiba en jeep ou à pied par les canyons de grès."
