# Overview article (ADR 0007). Mainstream facts only; Assyrian dates follow the standard chronology. Russian: the card name Екрон; the Synodal books of Kings read Аккарон. At 1 Sam 5:10 the Hebrew (and KJV) has Ekron, the Greek and the Synodal have Ascalon; the text says so.
id: ekron
place: a3fc47a
title:
  en: "Ekron"
  ru: "Екрон"
body:
  en:
    - "Ekron is Tel Miqne (Khirbet el-Muqanna), on the inner edge of the southern coastal plain, about 35 km west of Jerusalem and 9 km north of Gath. Trude Dothan and Seymour Gitin excavated it in fourteen seasons from 1981 to 1996. A Canaanite settlement preceded the city; in the twelfth century BC the Philistines founded a fortified city here, whose earliest layers are full of locally made pottery in the Mycenaean style of the Aegean."
    - "Joshua's lists place Ekron on Judah's northern border and also in the lot of Dan, and Judges says that Judah took it. When the captured ark brought plague on Gath, the Philistines sent it on to Ekron, and the Ekronites cried out that it had come to slay them (the Greek text, followed by the Russian Synodal, names Ashkelon here). After David killed Goliath, the Philistines fled to the gates of Ekron. King Ahaziah of Israel sent to ask Baal-zebub, the god of Ekron, whether he would recover from his fall, and Elijah met the messengers and turned them back. Amos, Zephaniah, Jeremiah and Zechariah all name Ekron among the Philistine cities under judgement."
    - "In 701 BC the nobles of Ekron put their king Padi in iron fetters and handed him over to Hezekiah of Judah. Sennacherib of Assyria defeated the Egyptian army that came to their aid, killed the rebel leaders and hung their bodies on towers round the city, brought Padi out of Jerusalem and set him back on his throne. Under Assyrian rule in the seventh century Ekron grew into the largest olive-oil production centre yet found in the ancient Near East, with over a hundred presses. In 1996 an inscription found in its temple recorded that Achish son of Padi, ruler of Ekron, built the house for his lady, a goddess named Ptgyh. It confirmed that Tel Miqne is Ekron, and Esarhaddon names the same king, Ikausu of Ekron, among the kings he summoned to bring building materials for his palace."
    - "The city was burned in Nebuchadnezzar's campaign to the Philistine coast, usually dated to 604 BC, and the great city was never rebuilt. In the second century BC the Seleucid king Alexander Balas gave Ekron and its district to Jonathan the Maccabee. In the fourth century AD Eusebius knew a large Jewish village called Accaron between Azotus and Jamnia."
  ru:
    - "Екрон — это Тель-Микне (Хирбет-эль-Муканна), на внутреннем краю южной прибрежной равнины, примерно в 35 км к западу от Иерусалима и в 9 км к северу от Гефа. Труде Дотан и Сеймур Гитин раскапывали его четырнадцать сезонов, с 1981 по 1996 г. Городу предшествовало ханаанское поселение; в XII веке до н. э. филистимляне основали здесь укреплённый город, в древнейших слоях которого много местной керамики в микенском стиле Эгейского мира."
    - "По спискам книги Иисуса Навина Екрон лежит на северной границе Иуды, а также в уделе Дана, а книга Судей говорит, что Иуда взял его. Когда захваченный ковчег навёл беду на Геф, его, по еврейскому тексту, отправили в Екрон, и екронитяне возопили, что его принесли умертвить их (в Синодальном переводе, вслед за греческим, здесь назван Аскалон). После того как Давид убил Голиафа, филистимляне бежали до ворот Екрона (в книгах Царств — Аккарон). Израильский царь Охозия, упав, послал спросить Веельзевула, божество Аккаронское, выздоровеет ли он, но Илия встретил послов и вернул их назад. Амос, Софония, Иеремия и Захария называют Екрон среди филистимских городов, которым грозит суд."
    - "В 701 г. до н. э. знать Екрона заковала своего царя Падию в железные оковы и выдала его Езекии, царю Иудейскому. Ассирийский царь Сеннахирим разбил пришедшее им на помощь египетское войско, казнил зачинщиков мятежа и развесил их тела на башнях вокруг города, вывел Падию из Иерусалима и вернул ему престол. Под властью Ассирии в VII веке Екрон стал крупнейшим из найденных на древнем Ближнем Востоке центров производства оливкового масла: здесь найдено больше сотни давилен. В 1996 г. в его храме нашли надпись о том, что Ахиш (Анхус), сын Падии, правитель Екрона, построил дом своей госпоже, богине по имени Птгйх. Она подтвердила, что Тель-Микне — это Екрон, а Асархаддон называет того же царя, Икаусу Екронского, среди царей, которых он призвал доставить строительные материалы для своего дворца."
    - "Город сгорел во время похода Навуходоносора на филистимское побережье, который обычно датируют 604 г. до н. э., и большой город так и не был отстроен. Во II веке до н. э. селевкидский царь Александр Балас отдал Екрон с его округой Ионафану Маккавею. В IV веке н. э. Евсевий знал большое иудейское селение Аккарон между Азотом и Иамнией."
