body:
  en:
    - "Ekron is Tel Miqne (Khirbet el-Muqanna), on the inner edge of the southern coastal plain, about 35 km west of Jerusalem and 9 km north of Gath. Trude Dothan and Seymour Gitin excavated it in fourteen seasons from 1981 to 1996. A Canaanite settlement preceded the city; in the twelfth century BC the Philistines founded a fortified city here, whose earliest layers are full of locally made pottery in the Mycenaean style of the Aegean."
    - "Joshua's lists place Ekron on Judah's northern border and also in the lot of Dan, and Judges says that Judah took it. When the captured ark brought plague on Gath, the Philistines sent it on to Ekron, and the Ekronites cried out that it had come to slay them (the Greek text, followed by the Russian Synodal, names Ashkelon here). After David killed Goliath, the Philistines fled to the gates of Ekron. King Ahaziah of Israel sent to ask Baal-zebub, the god of Ekron, whether he would recover from his fall, and Elijah met the messengers and turned them back. Amos, Zephaniah, Jeremiah and Zechariah all name Ekron among the Philistine cities under judgement."
    - "In 701 BC the nobles of Ekron put their king Padi in iron fetters and handed him over to Hezekiah of Judah. Sennacherib of Assyria defeated the Egyptian army that came to their aid, killed the rebel leaders and hung their bodies on towers round the city, brought Padi out of Jerusalem and set him back on his throne. Under Assyrian rule in the seventh century Ekron grew into the largest olive-oil production centre yet found in the ancient Near East, with over a hundred presses. In 1996 an inscription found in its temple recorded that Achish son of Padi, ruler of Ekron, built the house for his lady, a goddess named Ptgyh. It confirmed that Tel Miqne is Ekron, and Esarhaddon names the same king, Ikausu of Ekron, among the kings he summoned to bring building materials for his palace."
    - "The city was burned in Nebuchadnezzar's campaign to the Philistine coast, usually dated to 604 BC, and the great city was never rebuilt. In the second century BC the Seleucid king Alexander Balas gave Ekron and its district to Jonathan the Maccabee. In the fourth century AD Eusebius knew a large Jewish village called Accaron between Azotus and Jamnia."
  ru:
    - "Екрон — это Тель-Микне (Хирбет-эль-Муканна), на внутреннем краю южной прибрежной равнины, примерно в 35 км к западу от Иерусалима и в 9 км к северу от Гефа. Труде Дотан и Сеймур Гитин раскапывали его четырнадцать сезонов, с 1981 по 1996 г. Городу предшествовало ханаанское поселение; в XII веке до н. э. филистимляне основали здесь укреплённый город, в древнейших слоях которого много местной керамики в микенском стиле Эгейского мира."
    - "По спискам книги Иисуса Навина Екрон лежит на северной границе Иуды, а также в уделе Дана, а книга Судей говорит, что Иуда взял его. Когда захваченный ковчег навёл беду на Геф, его, по еврейскому тексту, отправили в Екрон, и екронитяне возопили, что его принесли умертвить их (в Синодальном переводе, вслед за греческим, здесь назван Аскалон). После того как Давид убил Голиафа, филистимляне бежали до ворот Екрона (в книгах Царств — Аккарон). Израильский царь Охозия, упав, послал спросить Веельзевула, божество Аккаронское, выздоровеет ли он, но Илия встретил послов и вернул их назад. Амос, Софония, Иеремия и Захария называют Екрон среди филистимских городов, которым грозит суд."
    - "В 701 г. до н. э. знать Екрона заковала своего царя Падию в железные оковы и выдала его Езекии, царю Иудейскому. Ассирийский царь Сеннахирим разбил пришедшее им на помощь египетское войско, казнил зачинщиков мятежа и развесил их тела на башнях вокруг города, вывел Падию из Иерусалима и вернул ему престол. Под властью Ассирии в VII веке Екрон стал крупнейшим из найденных на древнем Ближнем Востоке центров производства оливкового масла: здесь найдено больше сотни давилен. В 1996 г. в его храме нашли надпись о том, что Ахиш (Анхус), сын Падии, правитель Екрона, построил дом своей госпоже, богине по имени Птгйх. Она подтвердила, что Тель-Микне — это Екрон, а Асархаддон называет того же царя, Икаусу Екронского, среди царей, которых он призвал доставить строительные материалы для своего дворца."
    - "Город сгорел во время похода Навуходоносора на филистимское побережье, который обычно датируют 604 г. до н. э., и большой город так и не был отстроен. Во II веке до н. э. селевкидский царь Александр Балас отдал Екрон с его округой Ионафану Маккавею. В IV веке н. э. Евсевий знал большое иудейское селение Аккарон между Азотом и Иамнией."
  uk:
    - "Екрон — це Телль-Мікне (Хірбет-ель-Мукана), на внутрішньому краї південної прибережної рівнини, приблизно за 35 км на захід від Єрусалима та за 9 км на північ від Гата. Труде Дотан і Сеймур Гітін розкопували його чотирнадцять сезонів з 1981 до 1996 р. Ханаанське поселення передувало місту; у XII ст. до н. е. филистимляни заснували тут укріплене місто, найдавніші шари якого повні місцевої кераміки в мікенському стилі Егеїди."
    - "Списки Ісуса Навина ставлять Екрон на північній межі Юди, а також в уділі Дана, а Книга Суддів каже, що Юда взяв його. Коли захоплений ковчег приніс чуму на Гат, филистимляни послали його далі до Екрона, і екронці кричали, що він прийшов, аби вбити їх (грецький текст, за яким іде російський Синодальний, називає тут Ашкелон). Після того як Давид убив Голіята, филистимляни втекли до брам Екрона. Цар Охозія Ізраїльський послав спитати Веельзевула, бога Екрона, чи одужає він після падіння, а Елія зустрів посланців і завернув їх. Амос, Софонія, Єремія й Захарія називають Екрон серед филистимських міст під судом."
    - "У 701 р. до н. е. вельможі Екрона закували свого царя Паді в залізні кайдани і видали його Єзекії Юдейському. Сінаххеріб Ассирійський розбив єгипетське військо, що прийшло їм на допомогу, убив ватажків бунту і повісив їхні тіла на вежах навколо міста, вивів Паді з Єрусалима й повернув його на трон. Під ассирійською владою у VII ст. Екрон виріс у найбільший досі знайдений осередок виробництва оливкової олії в давньому Передньому Сході, з понад сотнею пресів. У 1996 р. напис, знайдений у його храмі, засвідчив, що Анхус, син Паді, правитель Екрона, збудував дім для своєї пані, богині на ім'я Птгйх. Він підтвердив, що Телль-Мікне — це Екрон, а Асархаддон називає того самого царя, Ікауссу з Екрона, серед царів, яких він викликав принести будівельні матеріали для свого палацу."
    - "Місто було спалене під час походу Навуходоносора на филистимське узбережжя, зазвичай датованого 604 р. до н. е., і велике місто так і не було відбудоване. У II ст. до н. е. селевкідський цар Александр Бала віддав Екрон та його округ Йонатану Макавею. У IV ст. н. е. Євсевій знав велике юдейське село Аккарон між Азотом і Ямнією."
  es:
    - "Ecrón es Tel Miqne (Khirbet el-Muqanna), en el borde interior de la llanura costera meridional, a unos 35 km al oeste de Jerusalén y a 9 km al norte de Gat. Trude Dothan y Seymour Gitin la excavaron en catorce campañas de 1981 a 1996. Un asentamiento cananeo precedió a la ciudad; en el siglo XII a. C. los filisteos fundaron aquí una ciudad fortificada, cuyos estratos más antiguos están llenos de cerámica de factura local en el estilo micénico del Egeo."
    - "Las listas de Josué sitúan Ecrón en la frontera norte de Judá y también en la suerte de Dan, y Jueces dice que Judá la tomó. Cuando el arca capturada trajo la peste a Gat, los filisteos la enviaron a Ecrón, y los ecronitas clamaron que había venido para matarlos (el texto griego, seguido por la Biblia sinodal rusa, nombra aquí a Ascalón). Después de que David matara a Goliat, los filisteos huyeron hasta las puertas de Ecrón. El rey Ocozías de Israel envió a consultar a Beelzebú, el dios de Ecrón, si se recuperaría de su caída, y Elías salió al paso de los mensajeros y los hizo volver. Amós, Sofonías, Jeremías y Zacarías nombran todos a Ecrón entre las ciudades filisteas bajo juicio."
    - "En el 701 a. C. los nobles de Ecrón pusieron grilletes de hierro a su rey Padi y lo entregaron a Ezequías de Judá. Senaquerib de Asiria derrotó al ejército egipcio que acudió en su ayuda, mató a los jefes rebeldes y colgó sus cuerpos de torres en torno a la ciudad, sacó a Padi de Jerusalén y lo repuso en su trono. Bajo dominio asirio, en el siglo VII, Ecrón se convirtió en el mayor centro de producción de aceite de oliva hallado hasta ahora en el antiguo Oriente Próximo, con más de cien almazaras. En 1996 una inscripción hallada en su templo registró que Aquis hijo de Padi, gobernante de Ecrón, construyó la casa para su señora, una diosa llamada Ptgyh. Confirmó que Tel Miqne es Ecrón, y Esar-hadón nombra al mismo rey, Ikausu de Ecrón, entre los reyes que convocó para que aportaran materiales de construcción para su palacio."
    - "La ciudad fue incendiada en la campaña de Nabucodonosor a la costa filistea, que suele fecharse en el 604 a. C., y la gran ciudad no volvió a ser reconstruida. En el siglo II a. C. el rey seléucida Alejandro Balas dio Ecrón y su distrito a Jonatán el Macabeo. En el siglo IV d. C. Eusebio conocía una gran aldea judía llamada Acarón entre Azoto y Jamnia."
  pt:
    - "Ecrom é Tel Miqne (Khirbet el-Muqanna), na borda interna da planície costeira meridional, a cerca de 35 km a oeste de Jerusalém e 9 km ao norte de Gate. Trude Dothan e Seymour Gitin a escavaram em catorze temporadas, de 1981 a 1996. Um povoado cananeu precedeu a cidade; no século XII a.C., os filisteus fundaram aqui uma cidade fortificada, cujas camadas mais antigas estão cheias de cerâmica feita localmente no estilo micênico do Egeu."
    - "As listas de Josué situam Ecrom na fronteira norte de Judá e também no lote de Dã, e Juízes diz que Judá a tomou. Quando a arca capturada trouxe peste a Gate, os filisteus a enviaram a Ecrom, e os ecronitas clamaram que ela viera para matá-los (o texto grego, seguido pelo Sinodal russo, nomeia aqui Ascalom). Depois que Davi matou Golias, os filisteus fugiram até as portas de Ecrom. O rei Acazias de Israel mandou perguntar a Baal-Zebube, o deus de Ecrom, se se recuperaria de sua queda, e Elias encontrou os mensageiros e os fez voltar. Amós, Sofonias, Jeremias e Zacarias nomeiam todos Ecrom entre as cidades filisteias sob juízo."
    - "Em 701 a.C., os nobres de Ecrom puseram seu rei Padi em grilhões de ferro e o entregaram a Ezequias de Judá. Senaqueribe da Assíria derrotou o exército egípcio que veio em seu auxílio, matou os chefes rebeldes e pendurou seus corpos em torres em volta da cidade, tirou Padi de Jerusalém e o restabeleceu no trono. Sob domínio assírio, no século VII, Ecrom tornou-se o maior centro de produção de azeite de oliva até agora achado no antigo Oriente Próximo, com mais de cem lagares. Em 1996, uma inscrição achada em seu templo registrou que Aquis, filho de Padi, governante de Ecrom, construiu a casa para a sua senhora, uma deusa chamada Ptgyh. Ela confirmou que Tel Miqne é Ecrom, e Esar-Hadom nomeia o mesmo rei, Ikausu de Ecrom, entre os reis que convocou para trazer materiais de construção para o seu palácio."
    - "A cidade foi queimada na campanha de Nabucodonosor à costa filisteia, geralmente datada de 604 a.C., e a grande cidade nunca foi reconstruída. No século II a.C., o rei selêucida Alexandre Balas deu Ecrom e seu distrito a Jônatas Macabeu. No século IV d.C., Eusébio conhecia uma grande aldeia judaica chamada Acaron entre Azoto e Jâmnia."
  de:
    - "Ekron ist Tel Miqne (Khirbet el-Muqanna), am Innenrand der südlichen Küstenebene, etwa 35 km westlich von Jerusalem und 9 km nördlich von Gat. Trude Dothan und Seymour Gitin gruben es in vierzehn Kampagnen von 1981 bis 1996 aus. Eine kanaanäische Siedlung ging der Stadt voraus; im 12. Jahrhundert v. Chr. gründeten die Philister hier eine befestigte Stadt, deren früheste Schichten voll sind von örtlich hergestellter Keramik im mykenischen Stil der Ägäis."
    - "Josuas Listen setzen Ekron an Judas Nordgrenze und auch in das Los Dans, und das Richterbuch sagt, Juda habe es eingenommen. Als die erbeutete Lade Gat Pest brachte, sandten die Philister sie nach Ekron weiter, und die Ekroniter schrien, sie sei gekommen, sie zu töten (der griechische Text, dem die russische Synodalbibel folgt, nennt hier Aschkelon). Nachdem David Goliat getötet hatte, flohen die Philister bis zu den Toren Ekrons. König Ahasja von Israel sandte, um Baal-Sebub, den Gott Ekrons, zu fragen, ob er von seinem Sturz genesen werde, und Elia begegnete den Boten und schickte sie zurück. Amos, Zefanja, Jeremia und Sacharja nennen alle Ekron unter den philistäischen Städten unter dem Gericht."
    - "Im Jahr 701 v. Chr. legten die Adligen Ekrons ihren König Padi in eiserne Fesseln und lieferten ihn Hiskia von Juda aus. Sanherib von Assyrien besiegte das ägyptische Heer, das ihnen zu Hilfe kam, tötete die Anführer der Rebellen und hängte ihre Leichen an Türme rund um die Stadt, führte Padi aus Jerusalem heraus und setzte ihn wieder auf seinen Thron. Unter assyrischer Herrschaft im 7. Jahrhundert wuchs Ekron zum größten bisher gefundenen Olivenölzentrum des antiken Vorderen Orients mit über hundert Pressen. Im Jahr 1996 verzeichnete eine in seinem Tempel gefundene Inschrift, dass Achis, Sohn des Padi, Herrscher von Ekron, das Haus für seine Herrin, eine Göttin namens Ptgyh, baute. Sie bestätigte, dass Tel Miqne Ekron ist, und Asarhaddon nennt denselben König, Ikausu von Ekron, unter den Königen, die er aufbot, Baumaterial für seinen Palast zu bringen."
    - "Die Stadt wurde in Nebukadnezars Feldzug an die philistäische Küste, gewöhnlich auf 604 v. Chr. datiert, niedergebrannt, und die große Stadt wurde nie wieder aufgebaut. Im 2. Jahrhundert v. Chr. gab der seleukidische König Alexander Balas Ekron und seinen Bezirk Jonatan dem Makkabäer. Im 4. Jahrhundert n. Chr. kannte Eusebius ein großes jüdisches Dorf namens Accaron zwischen Azotus und Jamnia."
  fr:
    - "Ékron est Tel Miqne (Khirbet el-Muqanna), au bord intérieur de la plaine côtière méridionale, à environ 35 km à l’ouest de Jérusalem et à 9 km au nord de Gath. Trude Dothan et Seymour Gitin la fouillèrent en quatorze campagnes de 1981 à 1996. Une agglomération cananéenne précéda la ville ; au XIIe siècle av. J.-C., les Philistins y fondèrent une ville fortifiée, dont les plus anciennes couches regorgent de poterie fabriquée localement dans le style mycénien de l’Égée."
    - "Les listes de Josué placent Ékron sur la frontière nord de Juda et aussi dans le lot de Dan, et les Juges disent que Juda la prit. Quand l’arche capturée apporta la peste à Gath, les Philistins l’envoyèrent à Ékron, et les Ékronites s’écrièrent qu’elle était venue pour les faire mourir (le texte grec, suivi par la Bible synodale russe, nomme ici Askalon). Après que David eut tué Goliath, les Philistins s’enfuirent jusqu’aux portes d’Ékron. Le roi Achazia d’Israël envoya consulter Baal-Zebub, dieu d’Ékron, pour savoir s’il guérirait de sa chute, et Élie rencontra les messagers et les fit rebrousser chemin. Amos, Sophonie, Jérémie et Zacharie nomment tous Ékron parmi les villes philistines sous le jugement."
    - "En 701 av. J.-C., les nobles d’Ékron mirent leur roi Padi aux fers et le livrèrent à Ézéchias de Juda. Sanchérib d’Assyrie battit l’armée égyptienne venue à leur secours, tua les chefs rebelles et pendit leurs corps aux tours autour de la ville, fit sortir Padi de Jérusalem et le rétablit sur son trône. Sous la domination assyrienne, au VIIe siècle, Ékron devint le plus grand centre de production d’huile d’olive jamais trouvé dans le Proche-Orient ancien, avec plus de cent pressoirs. En 1996, une inscription découverte dans son temple consigna qu’Akisch, fils de Padi, gouverneur d’Ékron, avait bâti la maison pour sa dame, une déesse nommée Ptgyh. Elle confirma que Tel Miqne est Ékron, et Esar-Haddon nomme le même roi, Ikausu d’Ékron, parmi les rois qu’il convoqua pour apporter des matériaux de construction à son palais."
    - "La ville fut incendiée lors de la campagne de Nebucadnetsar vers la côte philistine, habituellement datée de 604 av. J.-C., et la grande ville ne fut jamais rebâtie. Au IIe siècle av. J.-C., le roi séleucide Alexandre Balas donna Ékron et son district à Jonathan Maccabée. Au IVe siècle apr. J.-C., Eusèbe connaissait un grand village juif nommé Accaron entre Azotus et Jamnia."
  it:
    - "Ekron è Tel Miqne (Khirbet el-Muqanna), al margine interno della pianura costiera meridionale, a circa 35 km a ovest di Gerusalemme e a 9 km a nord di Gat. Trude Dothan e Seymour Gitin la scavarono in quattordici campagne dal 1981 al 1996. Un insediamento cananeo precedette la città; nel XII secolo a.C. i Filistei vi fondarono una città fortificata, i cui strati più antichi sono pieni di ceramica prodotta localmente nello stile miceneo dell’Egeo."
    - "Gli elenchi di Giosuè collocano Ekron sul confine settentrionale di Giuda e anche nella sorte di Dan, e i Giudici dicono che Giuda la prese. Quando l’arca catturata portò la peste a Gat, i Filistei la mandarono a Ekron, e gli Ekroniti gridarono che era venuta per ucciderli (il testo greco, seguito dal sinodale russo, nomina qui Ascalona). Dopo che Davide uccise Golia, i Filistei fuggirono fino alle porte di Ekron. Il re Acazia d’Israele mandò a chiedere a Baal-Zebub, il dio di Ekron, se si sarebbe ripreso dalla caduta, ed Elia incontrò i messaggeri e li rimandò indietro. Amos, Sofonia, Geremia e Zaccaria nominano tutti Ekron fra le città filistee sotto giudizio."
    - "Nel 701 a.C. i nobili di Ekron misero in ceppi di ferro il loro re Padi e lo consegnarono a Ezechia di Giuda. Sennacherib d’Assiria sconfisse l’esercito egizio venuto in loro aiuto, uccise i capi della rivolta e appese i loro corpi a torri attorno alla città, fece uscire Padi da Gerusalemme e lo rimise sul trono. Sotto il dominio assiro nel VII secolo Ekron divenne il più grande centro di produzione di olio d’oliva finora trovato nell’antico Vicino Oriente, con oltre cento frantoi. Nel 1996 un’iscrizione trovata nel suo tempio registrò che Achis figlio di Padi, governatore di Ekron, costruì la casa per la sua signora, una dea di nome Ptgyh. Confermò che Tel Miqne è Ekron, e Assaraddon nomina lo stesso re, Ikausu di Ekron, fra i re che convocò per portare materiali da costruzione per il suo palazzo."
    - "La città fu bruciata nella campagna di Nabucodonosor alla costa filistea, di solito datata al 604 a.C., e la grande città non fu mai ricostruita. Nel II secolo a.C. il re seleucide Alessandro Balas diede Ekron e il suo distretto a Gionata Maccabeo. Nel IV secolo d.C. Eusebio conosceva un grande villaggio ebraico chiamato Accaron fra Azoto e Iamnia."
  pl:
    - "Ekron to Tel Mikne (Chirbet el-Mukanna), na wewnętrznym skraju południowej równiny nadmorskiej, około 35 km na zachód od Jerozolimy i 9 km na północ od Gat. Trude Dothan i Seymour Gitin prowadzili tam wykopaliska w czternastu sezonach w latach 1981–1996. Miasto poprzedzała osada kananejska; w XII w. p.n.e. Filistyni założyli tu ufortyfikowane miasto, którego najwcześniejsze warstwy są pełne miejscowej ceramiki w mykeńskim stylu egejskim."
    - "Wykazy Jozuego umieszczają Ekron na północnej granicy Judy, a także w losie Dana, a Księga Sędziów mówi, że Juda go zdobyła. Gdy zdobyta arka sprowadziła zarazę na Gat, Filistyni posłali ją do Ekronu, a Ekrończycy wołali, że przyszła ich zabić (tekst grecki, za którym idzie rosyjski synodalny, ma tu Aszkelon). Po zabiciu Goliata przez Dawida Filistyni uciekli do bram Ekronu. Król Izraela Ochozjasz posłał zapytać Baal-Zebuba, boga Ekronu, czy wyzdrowieje po upadku, a Eliasz spotkał posłańców i zawrócił ich. Amos, Sofoniasz, Jeremiasz i Zachariasz wymieniają Ekron wśród miast filistyńskich pod sądem."
    - "W 701 r. p.n.e. możni Ekronu zakuli swego króla Padiego w żelazne kajdany i wydali go Ezechiaszowi z Judy. Sennacheryb Asyryjski rozgromił armię egipską, która przyszła im z pomocą, zabił przywódców buntu i powiesił ich ciała na wieżach wokół miasta, wyprowadził Padiego z Jerozolimy i przywrócił go na tron. Pod rządami asyryjskimi w VII w. Ekron wyrosło na największy dotychczas znaleziony ośrodek produkcji oliwy w starożytnym Bliskim Wschodzie, z ponad stoma prasami. W 1996 r. napis znaleziony w jego świątyni zapisał, że Achisz, syn Padiego, władca Ekronu, zbudował dom dla swej pani, bogini zwanej Ptgyh. Potwierdził on, że Tel Mikne to Ekron, a Asarhaddon wymienia tego samego króla, Ikausu z Ekronu, wśród królów, których wezwał, by dostarczyli materiałów budowlanych do jego pałacu."
    - "Miasto spalono podczas wyprawy Nabuchodonozora na wybrzeże filistyńskie, zwykle datowanej na 604 r. p.n.e., i wielkiego miasta nigdy nie odbudowano. W II w. p.n.e. seleucydzki król Aleksander Balas oddał Ekron wraz z okręgiem Jonatanowi Machabeuszowi. W IV w. n.e. Euzebiusz znał dużą żydowską wieś zwaną Akkaron między Azotem a Jamnią."
  nl:
    - "Ekron is Tel Miqne (Khirbet el-Muqanna), aan de binnenrand van de zuidelijke kustvlakte, zo'n 35 km ten westen van Jeruzalem en 9 km ten noorden van Gat. Trude Dothan en Seymour Gitin groeven het op in veertien seizoenen van 1981 tot 1996. Een Kanaänitische nederzetting ging aan de stad vooraf; in de twaalfde eeuw v.Chr. stichtten de Filistijnen hier een versterkte stad, waarvan de oudste lagen vol zitten met lokaal gemaakt aardewerk in de Myceense stijl van de Egeïsche Zee."
    - "Jozua's lijsten plaatsen Ekron op de noordgrens van Juda en ook in het lot van Dan, en Richteren zegt dat Juda het innam. Toen de buitgemaakte ark pest over Gat bracht, stuurden de Filistijnen haar door naar Ekron, en de Ekronieten riepen dat zij was gekomen om hen te doden (de Griekse tekst, gevolgd door de Russische Synodale, noemt hier Askelon). Nadat David Goliat had gedood, vluchtten de Filistijnen tot de poorten van Ekron. Koning Achazia van Israël liet Baäl-Zebub, de god van Ekron, vragen of hij van zijn val zou genezen, en Elia ontmoette de boodschappers en keerde hen terug. Amos, Zefanja, Jeremia en Zacharia noemen Ekron allen onder de Filistijnse steden die onder oordeel staan."
    - "In 701 v.Chr. legden de edelen van Ekron hun koning Padi in ijzeren boeien en leverden hem uit aan Chizkia van Juda. Sanherib van Assyrië versloeg het Egyptische leger dat hun te hulp kwam, doodde de opstandige leiders en hing hun lichamen aan torens rond de stad, haalde Padi uit Jeruzalem en zette hem weer op zijn troon. Onder Assyrisch gezag groeide Ekron in de zevende eeuw uit tot het grootste olijfoliecentrum dat tot nu toe in het oude Nabije Oosten is gevonden, met meer dan honderd persen. In 1996 vermeldde een inscriptie uit haar tempel dat Achis, zoon van Padi, heerser van Ekron, het huis bouwde voor zijn vrouwe, een godin genaamd Ptgyh. Het bevestigde dat Tel Miqne Ekron is, en Esarhaddon noemt dezelfde koning, Ikausu van Ekron, onder de koningen die hij opriep om bouwmateriaal voor zijn paleis te brengen."
    - "De stad werd verbrand bij Nebukadnessars veldtocht naar de Filistijnse kust, gewoonlijk gedateerd in 604 v.Chr., en de grote stad werd nooit herbouwd. In de tweede eeuw v.Chr. gaf de Seleucidische koning Alexander Balas Ekron en haar district aan Jonatan de Makkabeeër. In de 4e eeuw n.Chr. kende Eusebius een groot Joods dorp Accaron tussen Azotus en Jamnia."
  cs:
    - "Ekron je Tel Miqne (Khirbet el-Muqanna), na vnitřním okraji jižní pobřežní roviny, asi 35 km západně od Jeruzaléma a 9 km severně od Gatu. Trude Dothan a Seymour Gitin jej vykopávali ve čtrnácti sezónách od roku 1981 do 1996. Městu předcházelo kanaánské osídlení; ve 12. století př. n. l. tu Pelištejci založili opevněné město, jehož nejstarší vrstvy jsou plné místně vyráběné keramiky v mykénském stylu Egeidy."
    - "Jozuovy seznamy kladou Ekron na severní hranici Judy a také do losu Danova a Kniha soudců praví, že jej Juda dobyl. Když zajatá truhla způsobila mor v Gatu, poslali ji Pelištejci do Ekronu a Ekronští křičeli, že přišla, aby je zabila (řecký text, který následuje ruská synodální Bible, zde jmenuje Aškelon). Když David zabil Goliáše, Pelištejci utíkali k branám Ekronu. Král Achazjáš Izraelský poslal zeptat se Beelzebuba, boha Ekronu, zda se z pádu uzdraví, a Elijáš potkal posly a obrátil je zpět. Amos, Sofonjáš, Jeremjáš a Zacharjáš všichni jmenují Ekron mezi pelištejskými městy pod soudem."
    - "Roku 701 př. n. l. dali ekronští velmožové svého krále Padiho do železných pout a vydali jej Chizkijášovi Judskému. Senacherib Asyrský porazil egyptské vojsko, které jim přišlo na pomoc, zabil vůdce vzpoury a pověsil jejich těla na věže kolem města, přivedl Padiho z Jeruzaléma a vrátil jej na trůn. Pod asyrskou vládou se Ekron v 7. století stal největším dosud nalezeným střediskem výroby olivového oleje ve starověkém Předním východě, s více než sty lisy. Roku 1996 nápis nalezený v jeho chrámu zaznamenal, že Achiš, syn Padiho, vládce Ekronu, vystavěl dům pro svou paní, bohyni jménem Ptgyh. Potvrdil, že Tel Miqne je Ekron, a Asarhadón jmenuje téhož krále, Ikausua z Ekronu, mezi králi, které svolal, aby přinesli stavební materiál pro jeho palác."
    - "Město bylo vypáleno při Nebukadnesarově tažení na pelištejské pobřeží, obvykle datovaném do roku 604 př. n. l., a velké město nebylo nikdy obnoveno. Ve 2. století př. n. l. dal seleukovský král Alexandr Balas Ekron a jeho okres Jonatanovi Makabejskému. Ve 4. století n. l. znal Eusebios velkou židovskou vesnici zvanou Accaron mezi Azotem a Jamnií."
