  tl: "Beth-horon sa Itaas"
  da: "Øvre Bet-Horon"
body:
  en:
    - "Upper Beth-horon, Beth-horon the upper, was the higher of the two towns of Beth-horon on the ridge that climbs from the valley of Aijalon to the plateau of Gibeon. It is the village of Beit Ur al-Fauqa, “the upper Beit Ur”, about 600 m above the sea in the West Bank some 16 km north-west of Jerusalem; Lower Beth-horon, Beit Ur al-Tahta, lies 3 km down the road and about 200 m lower. The ascent of Beth-horon ends at the upper town, and from it the road runs along the ridge to Gibeon and Jerusalem, so that whoever held the upper town held the way up from the coast. Potsherds found in the village date from the Iron Age onward; the site has not been dug."
    - "The Bible names the upper town in borders and building. The border of Ephraim on the east ran from “Ataroth-addar, unto Beth-horon the upper”, and Beth-horon was given to the Levites of Kohath. The Chronicler says that Sherah, of the line of Ephraim, “built Beth-horon the nether, and the upper”. Of Solomon he says that “he built Beth-horon the upper, and Beth-horon the nether, fenced cities, with walls, gates, and bars”, where Kings names only the lower town: the two together closed the pass. The battles belong to the road between them, where Joshua chased the five kings “going down to Beth-horon”, a Philistine raiding party turned toward the way of Beth-horon in Saul's day, Judas Maccabeus broke Seron at the ascent, and the legion of Cestius Gallus was cut up in its retreat in AD 66."
    - "Eusebius knew two villages of Bethoron about twelve miles from Jerusalem on the road to Nicopolis. Beit Ur al-Fauqa is still a small village on its spur, and stretches of the old road, with steps cut in the rock, survive between the two Beit Urs."
  ru:
    - "Беф-Орон верхний, или Верхний Беф-Орон, был высшим из двух городов Беф-Орона на гребне, который поднимается из долины Аиалонской к плато Гаваона. Это деревня Бейт-Ур-эль-Фаука, «верхний Бейт-Ур», примерно в 600 м над морем на Западном берегу, километрах в 16 к северо-западу от Иерусалима; Нижний Беф-Орон, Бейт-Ур-эт-Тахта, лежит в 3 км ниже по дороге и метров на 200 ниже. Подъём Беф-Оронский кончается у верхнего города, и от него дорога идёт по гребню к Гаваону и Иерусалиму, так что кто держал верхний город, держал и путь с побережья наверх. Черепки, найденные в деревне, относятся к железному веку и позднее; раскопок здесь не было."
    - "Библия называет верхний город в пределах и в строительстве. У Ефрема с востока «пределом удела их был Атароф-Адар до Беф-Орона верхнего», а Беф-Орон отдали левитам из рода Каафа. Летописец говорит, что Шеера из потомков Ефрема «построила Беф-Орон нижний и верхний». О Соломоне он говорит: «Он обстроил Вефорон верхний и Вефорон нижний, города укрепленные, со стенами, воротами и запорами», тогда как книга Царств называет лишь нижний город: вдвоём они запирали проход. Битвы же принадлежат дороге между ними, где Иисус Навин гнал пятерых царей «по дороге к возвышенности Вефорона», куда во дни Саула повернул отряд филистимлян, где Иуда Маккавей разбил Сирона на подъёме, а в 66 году н. э. был истреблён при отступлении легион Цестия Галла."
    - "Евсевий знал два селения Бефорон милях в двенадцати от Иерусалима по дороге в Никополь. Бейт-Ур-эль-Фаука и сегодня небольшая деревня на своём отроге, а между двумя Бейт-Урами сохранились участки старой дороги со ступенями, высеченными в скале."
  uk:
    - "Верхній Бет-Хорон, Бет-Хорон верхній, був вищим із двох міст Бет-Хорон на гряді, що здіймається від долини Аялон до плато Гаваона. Це село Бейт-Ур-ель-Фока, «верхній Бейт-Ур», приблизно за 600 м над рівнем моря на Західному березі, за 16 км на північний захід від Єрусалима; Нижній Бет-Хорон, Бейт-Ур-ет-Тахта, лежить за 3 км униз дорогою і приблизно на 200 м нижче. Підйом Бет-Хорона закінчується біля верхнього міста, а звідти дорога йде гребенем до Гаваона й Єрусалима, тож хто тримав верхнє місто, тримав шлях угору від узбережжя. Черепки, знайдені в селі, датуються залізною добою й пізнішими; місце не розкопане."
    - "Біблія називає верхнє місто в межах і будівництві. Східна межа Єфрема йшла від «Атарот-Аддар аж до верхового Бет-Орону», а Бет-Хорон було віддано левітам Кааф. Літописець каже, що Шеера, з роду Єфрема, «відбудувала Бет-Орон низший і висший». Про Соломона він каже, що «Він забудував і Беторон Вижній та Беторон Нижній, міста утверджені, з мурами, брамами та засовами», тоді як Книга Царів називає лише нижнє місто: разом вони замикали прохід. Битви належать до дороги між ними, де Ісус Навин гнав п’ятьох царів, коли вони «спускались від Беторона», филистимський загін у дні Саула повернув на дорогу до Бет-Хорона, Юда Макавей розбив Серона на підйомі, а легіон Цестія Галла був розтятий під час відступу 66 року н. е."
    - "Євсевій знав два села Беторон приблизно за дванадцять миль від Єрусалима на дорозі до Нікополя. Бейт-Ур-ель-Фока досі є малим селом на своїй острозі, а ділянки давньої дороги з висіченими в скелі сходами лишаються між двома Бейт-Урами."
  es:
    - "Bet-horón de Arriba, Bet-horón la alta, era la más elevada de las dos ciudades de Bet-horón en la cresta que sube desde el valle de Ajalón hasta la meseta de Gabaón. Es la aldea de Beit Ur al-Fauqa, «la Beit Ur de arriba», a unos 600 m sobre el nivel del mar, en Cisjordania, a unos 16 km al noroeste de Jerusalén; Bet-horón de Abajo, Beit Ur al-Tahta, queda 3 km camino abajo y unos 200 m más baja. La subida de Bet-horón termina en la ciudad alta, y desde ella el camino sigue por la cresta hasta Gabaón y Jerusalén, de modo que quien tenía la ciudad alta tenía la subida desde la costa. Los tiestos hallados en la aldea datan de la Edad del Hierro en adelante; el sitio no ha sido excavado."
    - "La Biblia nombra la ciudad alta en fronteras y construcciones. La frontera de Efraín por el este iba «desde Ataroth-addar hasta Beth-oron la de arriba», y Bet-horón fue dada a los levitas de Coat. El cronista dice que Seera, del linaje de Efraín, «edificó á Beth-oron la baja y la alta». De Salomón dice que «reedificó á Beth-oron la de arriba, y á Beth-oron la de abajo, ciudades fortificadas, de muros, puertas, y barras», mientras que Reyes nombra solo la ciudad baja: las dos juntas cerraban el paso. Las batallas pertenecen al camino entre ellas, donde Josué persiguió a los cinco reyes «á la bajada de Beth-oron», una partida filistea de saqueo marchó hacia el camino de Bet-horón en tiempos de Saúl, Judas Macabeo derrotó a Serón en la subida, y la legión de Cestio Galo fue despedazada en su retirada en el 66 d. C."
    - "Eusebio conocía dos aldeas de Bethoron a unas doce millas de Jerusalén en el camino de Nicópolis. Beit Ur al-Fauqa sigue siendo una pequeña aldea sobre su espolón, y tramos del antiguo camino, con escalones tallados en la roca, subsisten entre las dos Beit Ur."
  pt:
    - "Bete-Horom de Cima, Bete-Horom a alta, era a mais elevada das duas cidades de Bete-Horom na serra que sobe do vale de Aijalom ao planalto de Gibeão. É a aldeia de Beit Ur al-Fauqa, “o Beit Ur de cima”, a cerca de 600 m acima do mar, na Cisjordânia, uns 16 km a noroeste de Jerusalém; Bete-Horom de Baixo, Beit Ur al-Tahta, fica 3 km estrada abaixo e uns 200 m mais baixa. A subida de Bete-Horom termina na cidade de cima, e dali a estrada corre pela serra até Gibeão e Jerusalém, de modo que quem a detinha controlava o caminho de subida da costa. Cacos de cerâmica achados na aldeia datam da Idade do Ferro em diante; o sítio não foi escavado."
    - "A Bíblia nomeia a cidade de cima em fronteiras e construções. A fronteira de Efraim a leste ia de “Atarote-Adar, até Bete-Horom superior”, e Bete-Horom foi dada aos levitas de Coate. O Cronista diz que Seerá, da linhagem de Efraim, “edificou Bete-Horom, a baixa e a alta”. De Salomão diz que “edificou Bete-Horom, a alta, e Bete-Horom, a baixa, cidades fortificadas com muros, portas e trancas”, onde Reis nomeia só a de baixo: as duas juntas fechavam a passagem. As batalhas pertencem à estrada entre elas, onde Josué perseguiu os cinco reis “na descida de Bete-Horom”, um bando filisteu de saque se voltou para o caminho de Bete-Horom nos dias de Saul, Judas Macabeu derrotou Seron na subida, e a legião de Céstio Galo foi despedaçada em sua retirada em 66 d.C."
    - "Eusébio conhecia duas aldeias de Bethoron a cerca de doze milhas de Jerusalém, na estrada para Nicópolis. Beit Ur al-Fauqa ainda é uma pequena aldeia em seu esporão, e trechos da antiga estrada, com degraus talhados na rocha, sobrevivem entre os dois Beit Ur."
  de:
    - "Oberes Bet-Horon war die höhere der beiden Städte Bet-Horon auf dem Höhenrücken, der vom Tal von Ajalon zur Hochebene von Gibeon ansteigt. Es ist das Dorf Beit Ur al-Fauqa, „das obere Beit Ur“, etwa 600 m über dem Meer im Westjordanland rund 16 km nordwestlich von Jerusalem; Unteres Bet-Horon, Beit Ur al-Tahta, liegt 3 km die Straße hinab und rund 200 m tiefer. Der Anstieg von Bet-Horon endet an der oberen Stadt, und von ihr führt die Straße am Höhenrücken entlang nach Gibeon und Jerusalem, sodass, wer die obere Stadt hielt, den Weg von der Küste herauf beherrschte. Im Dorf gefundene Scherben stammen aus der Eisenzeit und später; die Stätte wurde nicht ausgegraben."
    - "Die Bibel nennt die obere Stadt bei Grenzen und Bauten. Die Ostgrenze Ephraims verlief von „Ataroth-Adar bis zum obern Beth-Horon“, und Bet-Horon wurde den Leviten Kehats gegeben. Der Chronist sagt, Scheera aus dem Geschlecht Ephraims „baute das niedere und obere Beth-Horon“. Von Salomo sagt er: „er baute auch Ober- und Nieder-Beth-Horon, die feste Städte waren mit Mauern, Türen und Riegeln“, wo die Königsbücher nur die untere Stadt nennen: Beide zusammen verschlossen den Pass. Die Schlachten gehören zur Straße zwischen ihnen, wo Josua die fünf Könige „den Weg zu Beth-Horon“ jagte, eine philistäische Streifschar sich zu Sauls Zeit auf die Straße Bet-Horons wandte, Judas Makkabäus Seron am Anstieg schlug und die Legion des Cestius Gallus im Jahr 66 n. Chr. auf dem Rückzug aufgerieben wurde."
    - "Eusebius kannte zwei Dörfer Bethoron etwa zwölf Meilen von Jerusalem an der Straße nach Nikopolis. Beit Ur al-Fauqa ist noch immer ein kleines Dorf auf seinem Sporn, und Abschnitte der alten Straße mit in den Fels gehauenen Stufen sind zwischen den beiden Beit Ur erhalten."
  fr:
    - "Beth-Horon la haute était la plus élevée des deux villes de Beth-Horon sur la crête qui monte de la vallée d’Ajalon au plateau de Gabaon. C’est le village de Beit Ur al-Fauqa, « Beit Ur la haute », à environ 600 m d’altitude en Cisjordanie, à quelque 16 km au nord-ouest de Jérusalem ; Beth-Horon la basse, Beit Ur al-Tahta, est à 3 km plus bas sur la route et environ 200 m plus bas. La montée de Beth-Horon s’achève à la ville haute, d’où la route longe la crête jusqu’à Gabaon et Jérusalem, si bien que qui tenait la ville haute tenait le chemin montant depuis la côte. Des tessons trouvés au village datent de l’âge du fer et après ; le site n’a pas été fouillé."
    - "La Bible nomme la ville haute dans des frontières et des constructions. La frontière d’Éphraïm à l’est allait d’« Atharoth-Addar jusqu’à Beth-Horon la haute », et Beth-Horon fut donnée aux lévites de Kehath. Le Chroniqueur dit que Schééra, de la lignée d’Éphraïm, « bâtit Beth-Horon la basse et Beth-Horon la haute ». De Salomon, il dit : « Il bâtit Beth-Horon la haute et Beth-Horon la basse, villes fortes, ayant des murs, des portes et des barres », là où les Rois ne nomment que la ville basse : les deux ensemble fermaient le passage. Les batailles appartiennent à la route entre elles : Josué y poursuivit les cinq rois « à la descente de Beth-Horon », une troupe philistine de pillards prit le chemin de Beth-Horon du temps de Saül, Judas Maccabée y écrasa Séron à la montée, et la légion de Cestius Gallus fut taillée en pièces dans sa retraite en 66 apr. J.-C."
    - "Eusèbe connaissait deux villages de Béthoron à environ douze milles de Jérusalem sur la route de Nicopolis. Beit Ur al-Fauqa est toujours un petit village sur son éperon, et des tronçons de l’ancienne route, avec des marches taillées dans le roc, subsistent entre les deux Beit Ur."
  pl:
    - "Górny Bet-Choron, Bet-Choron wyższy, było wyżej położonym z dwóch miast Bet-Choron na grzbiecie wspinającym się od doliny Ajjalon na płaskowyż Gibeonu. To wieś Bajt Ur al-Fauka, „górny Bajt Ur”, położona około 600 m n.p.m. na Zachodnim Brzegu, około 16 km na północny zachód od Jerozolimy; Dolny Bet-Choron, Bajt Ur at-Tahta, leży 3 km dalej w dół drogi i około 200 m niżej. Podejście do Bet-Choron kończy się w górnym mieście, a od niego droga biegnie grzbietem do Gibeonu i Jerozolimy, tak że kto trzymał górne miasto, trzymał drogę w górę znad wybrzeża. Skorupy znalezione we wsi pochodzą z epoki żelaza i późniejszych; stanowiska nie kopano."
    - "Biblia wymienia górne miasto w granicach i w budowach. Granica Efraima na wschodzie biegła „od Attarot Adar aż do Bet Horon wyższego”, a Bet-Choron dano lewitom z rodu Kehata. Kronikarz mówi, że Seera, z linii Efraima, „pobudowała Betoron niższe i wyższe”. O Salomonie mówi, że „zbudował Betoron wyższe i Betoron niższe, miasta obronne w murach, z bramami i z zaworami”, tam gdzie Księgi Królewskie wymieniają tylko dolne miasto: oba razem zamykały przełęcz. Bitwy należą do drogi między nimi, gdzie Jozue gonił pięciu królów, „bieżąc z góry do Betoron”, oddział filistyński zwrócił się w dni Saula na drogę ku Bet-Choron, Juda Machabeusz rozgromił Serona na podejściu, a legion Cestiusza Gallusa został rozbity podczas odwrotu w 66 roku n.e."
    - "Euzebiusz znał dwie wsie Bethoron o około dwanaście mil od Jerozolimy przy drodze do Nikopolis. Bajt Ur al-Fauka jest nadal małą wsią na swej ostrodze, a odcinki starej drogi ze stopniami wykutymi w skale przetrwały między oboma Bajt Ur."
  it:
    - "Bet-Oron di sopra era la più alta delle due città di Bet-Oron sul crinale che sale dalla valle di Aialon all’altopiano di Gabaon. È il villaggio di Beit Ur al-Fauqa, «la Beit Ur superiore», a circa 600 m sul mare in Cisgiordania, circa 16 km a nord-ovest di Gerusalemme; Bet-Oron di sotto, Beit Ur al-Tahta, sta 3 km più in basso lungo la strada e circa 200 m più bassa. La salita di Bet-Oron termina alla città alta, e da essa la strada corre lungo il crinale verso Gabaon e Gerusalemme, per cui chi teneva la città alta teneva la via di salita dalla costa. Cocci trovati nel villaggio datano dall’età del Ferro in poi; il sito non è stato scavato."
    - "La Bibbia nomina la città alta in confini e costruzioni. Il confine di Efraim a oriente andava da «Atharoth-Addar, fino a Beth-Horon disopra», e Bet-Oron fu data ai leviti di Keat. Il Cronista dice che Seera, della linea di Efraim, «edifico Beth-Horon, la inferiore e la superiore». Di Salomone dice che «ricostruì pure Beth-Horon superiore e Beth-Horon inferiore, città forti, munite di mura, di porte e di sbarre», mentre i Re nominano solo la città bassa: insieme chiudevano il passo. Le battaglie appartengono alla strada fra le due, dove Giosuè inseguì i cinque re «alla scesa di Beth-Horon», una banda di predoni filistei prese la «via di Beth-Horon» ai giorni di Saul, Giuda Maccabeo sbaragliò Seron alla salita, e la legione di Cestio Gallo fu fatta a pezzi nella ritirata nel 66 d.C."
    - "Eusebio conosceva due villaggi di Bethoron a circa dodici miglia da Gerusalemme sulla strada per Nicopoli. Beit Ur al-Fauqa è ancora un piccolo villaggio sul suo sperone, e tratti dell’antica strada, con gradini scavati nella roccia, sopravvivono fra le due Beit Ur."
  nl:
    - "Boven-Beth-Horon, het bovenste Beth-Horon, was de hoogste van de twee steden Beth-Horon op de bergrug die uit de vallei van Ajalon naar het plateau van Gibeon klimt. Het is het dorp Beit Ur al-Fauqa, “het bovenste Beit Ur”, ongeveer 600 m boven de zeespiegel op de Westelijke Jordaanoever, zo’n 16 km ten noordwesten van Jeruzalem; Neder-Beth-Horon, Beit Ur al-Tahta, ligt 3 km verder langs de weg en ongeveer 200 m lager. De klim van Beth-Horon eindigt bij de bovenstad, en vandaar loopt de weg over de rug naar Gibeon en Jeruzalem, zodat wie de bovenstad hield de weg omhoog vanaf de kust in handen had. Potscherven die in het dorp zijn gevonden dateren van de IJzertijd af; de plek is niet opgegraven."
    - "De Bijbel noemt de bovenstad bij grenzen en bouwwerken. De grens van Efraïm in het oosten liep van “Atroth-Addar tot aan het bovenste Beth-Horon”, en Beth-Horon werd aan de Levieten van Kehat gegeven. De kroniekschrijver zegt dat Seëra, uit het geslacht van Efraïm, “bouwde het lage en het hoge Beth-horon”. Van Salomo zegt hij: “Ook bouwde hij het hoge Beth-horon en het neder Beth-horon, vaste steden met muren, deuren en grendelen”, waar Koningen alleen de benedenstad noemt: samen sloten de twee de pas af. De veldslagen horen bij de weg tussen beide, waar Jozua de vijf koningen achtervolgde, “zijnde in den afgang van Beth-horon”, een Filistijnse plunderbende zich in de dagen van Saul richtte naar de weg van Beth-horon, Judas Makkabeüs Seron bij de klim versloeg, en het legioen van Cestius Gallus in 66 n.Chr. op zijn terugtocht werd uiteengeslagen."
    - "Eusebius kende twee dorpen Bethoron op ongeveer twaalf mijl van Jeruzalem aan de weg naar Nicopolis. Beit Ur al-Fauqa is nog steeds een klein dorp op zijn uitloper, en stukken van de oude weg, met in de rots uitgehouwen treden, zijn bewaard gebleven tussen de twee Beit Urs."
  cs:
    - "Horní Bét-choron, Bét-choron horní, bylo vyšší ze dvou měst Bét-choron na hřebeni, který stoupá z údolí Ajalon na plošinu Gibeonu. Je to vesnice Bejt Úr al-Fauqa, „horní Bejt Úr“, asi 600 m nad mořem na Západním břehu asi 16 km severozápadně od Jeruzaléma; Dolní Bét-choron, Bejt Úr al-Tahta, leží o 3 km níže po silnici a asi o 200 m níž. Výstup do Bét-choronu končí u horního města a odtud vede silnice po hřebeni ke Gibeonu a Jeruzalému, takže kdo držel horní město, držel cestu nahoru od pobřeží. Střepy nalezené ve vesnici pocházejí z doby železné a mladší; lokalita nebyla vykopána."
    - "Bible jmenuje horní město v hranicích a stavbách. Hranice Efrajimova na východě šla „od Atarot Addar až do Betoron vrchního“ a Bét-choron byl dán levitům z Kehatu. Kronikář říká, že Šeera, z rodu Efrajimova, „vystavěla Betoron dolní i horní“. O Šalomounovi říká: „Vystavěl i Betoron hořejší, též i Betoron dolejší, města ohrazená zdmi, branami i závorami“, kde Královská jmenuje jen dolní město: obě společně uzavíraly průsmyk. Bitvy patří k cestě mezi nimi, kde Jozue honil pět králů, kteří utíkali „sstupujíce do Betoron“, pelištejská loupežná výprava se za Saula obrátila na cestu k Bét-choronu, Juda Makabejský rozdrtil Serona na výstupu a legie Cestia Galla byla roku 66 n. l. při ústupu rozsekána."
    - "Eusebius znal dvě vesnice Betoron asi dvanáct mil od Jeruzaléma na silnici do Nikopole. Bejt Úr al-Fauqa je dosud malá vesnice na svém výběžku a úseky staré silnice se schody vysekanými ve skále se dochovaly mezi oběma Bejt Úry."
  sv:
    - "Övre Bet-Horon var den högre av de två städerna Bet-Horon på åsen som stiger från Ajalons dal till Gibeons platå. Det är byn Beit Ur al-Fauqa, ”övre Beit Ur”, omkring 600 m över havet på Västbanken, omkring 16 km nordväst om Jerusalem; Nedre Bet-Horon, Beit Ur al-Tahta, ligger 3 km längre ner längs vägen och omkring 200 m lägre. Bet-Horons uppstigning slutar vid övre staden, och därifrån löper vägen längs åsen till Gibeon och Jerusalem, så att den som höll övre staden höll vägen upp från kusten. Krukskärvor som hittats i byn dateras från järnåldern och framåt; platsen har inte grävts ut."
    - "Bibeln nämner övre staden i gränser och byggnadsverk. Efraims gräns i öster gick ”från Atrot-Addar ända till Övre Bet-Horon”, och Bet-Horon gavs åt Kehats leviter. Krönikeboken säger att Sheera, av Efraims ätt, ”byggde Nedre och Övre Bet-Horon”. Om Salomo säger den: ”Vidare byggde han upp Övre Bet-Horon och Nedre Bet-Horon och gjorde dem till fasta städer med murar, portar och bommar”, där Kungaboken bara nämner den nedre staden: de två tillsammans stängde passet. Striderna hör till vägen mellan dem, där Josua jagade de fem kungarna till ”den sluttning som går ned från Bet-Horon”, ett filisteiskt plundringståg vände mot Bet-Horons väg på Sauls tid, Judas Mackabeus slog Seron vid uppstigningen, och Cestius Gallus' legion hackades sönder under sin reträtt år 66 e.Kr."
    - "Eusebios kände två byar Bethoron omkring tolv romerska mil från Jerusalem på vägen till Nikopolis. Beit Ur al-Fauqa är fortfarande en liten by på sin utlöpare, och sträckor av den gamla vägen, med trappsteg huggna i berget, finns kvar mellan de två Beit Ur."
  nb:
    - "Øvre Bet-Horon var den høyeste av de to byene Bet-Horon på ryggen som stiger fra Ajalon-dalen til Gibeon-platået. Det er landsbyen Beit Ur al-Fauqa, «øvre Beit Ur», omkring 600 m over havet på Vestbredden, omkring 16 km nordvest for Jerusalem; Nedre Bet-Horon, Beit Ur al-Tahta, ligger 3 km nedover veien og omkring 200 m lavere. Oppstigningen til Bet-Horon ender ved den øvre byen, og derfra løper veien langs ryggen til Gibeon og Jerusalem, slik at den som holdt den øvre byen, holdt veien opp fra kysten. Potteskår funnet i landsbyen dateres fra jernalderen og utover; stedet er ikke utgravd."
    - "Bibelen nevner den øvre byen i grenser og i byggearbeid. Efraims grense i øst gikk «over Atrot-Addar frem til Øvre-Bet-Horon», og Bet-Horon ble gitt til kehatittenes levitter. Kronikeren sier at Seera, av Efraims ætt, «bygget Nedre- og Øvre-Bet-Horon». Om Salomo heter det: «Likeledes bygget han op Øvre-Bet-Horon og Nedre-Bet-Horon og gjorde dem til faste byer med murer, dobbelte porter og bommer», der Kongebøkene bare nevner den nedre byen: de to sammen stengte passet. Slagene hører til veien mellom dem, der Josva forfulgte de fem kongene «på veien ned fra Bet-Horon», en filistersk plyndringsflokk tok veien mot Bet-Horon i Sauls dager, Judas Makkabeus slo Seron ved oppstigningen, og legionen til Cestius Gallus ble hogd ned på tilbaketoget i 66 e.Kr."
    - "Eusebius kjente to landsbyer Bethoron omkring tolv romerske mil fra Jerusalem på veien til Nikopolis. Beit Ur al-Fauqa er fortsatt en liten landsby på sin rygg, og strekninger av den gamle veien, med trinn hugget i fjellet, er bevart mellom de to Beit Ur."
  tl:
    - "Ang Beth-horon sa Itaas ang mas mataas sa dalawang bayan ng Beth-horon sa tagaytay na umaakyat mula sa libis ng Ajalon patungo sa talampas ng Gabaon. Ito ang nayon ng Beit Ur al-Fauqa, “ang itaas na Beit Ur”, mga 600 m sa ibabaw ng dagat sa Kanlurang Pampang, mga 16 km sa hilagang-kanluran ng Jerusalem; ang Beth-horon sa Ibaba, Beit Ur al-Tahta, ay 3 km pababa sa daan at mga 200 m na mas mababa. Ang pag-akyat ng Beth-horon ay nagtatapos sa itaas na bayan, at mula roon ang daan ay tumatakbo sa tagaytay patungong Gabaon at Jerusalem, kaya ang may hawak ng itaas na bayan ang may hawak ng daang paakyat mula sa baybayin. Ang mga piraso ng palayok na natagpuan sa nayon ay mula sa Panahong Bakal pasulong; hindi pa nahukay ang pook."
    - "Binabanggit ng Biblia ang itaas na bayan sa mga hangganan at pagtatayo. Ang silangang hangganan ng Ephraim: mula sa “Ataroth-addar, hanggang sa Beth-horon sa itaas”, at ibinigay ang Beth-horon sa mga Levita ni Coat. Sinasabi ng Tagapagtala na si Seera, ng angkan ni Ephraim, ay “nagtayo ng Bet-horon sa ibaba at sa itaas”. Kay Salomon: “Itinayo rin niya ang Bet-horon sa itaas, at ang Bet-horon sa ibaba, na mga bayang nakukutaan, na may mga kuta, mga pintuang-bayan, at mga halang”, ngunit ibaba lamang ang nasa Mga Hari: magkasamang sinara ng dalawa ang daanan. Nasa daan sa pagitan nila ang mga labanan: hinabol ni Josue ang limang hari na “nasa babaan sa Beth-horon”, lumiko sa daan ng Beth-horon ang pangkat ng mandarambong na Filisteo noong panahon ni Saul, tinalo ni Judas Macabeo si Seron sa pag-akyat, at nadurog ang lehiyon ni Cestius Gallus sa pag-urong noong 66 AD."
    - "Kilala ni Eusebio ang dalawang nayon ng Bethoron mga labindalawang milya mula sa Jerusalem sa daan patungong Nicopolis. Ang Beit Ur al-Fauqa ay maliit na nayon pa rin sa sanga nito, at nananatili ang mga bahagi ng lumang daan, na may mga baytang na inukit sa bato, sa pagitan ng dalawang Beit Ur."
  da:
    - "Øvre Bet-Horon, det øvre Bet-Horon, var den højere af de to byer Bet-Horon på højderyggen, der stiger fra Ajjalons dal til Gibeons højslette. Det er landsbyen Beit Ur al-Fauqa, »det øvre Beit Ur«, omkring 600 m over havet på Vestbredden, omkring 16 km nordvest for Jerusalem; Nedre Bet-Horon, Beit Ur al-Tahta, ligger 3 km nede ad vejen og omkring 200 m lavere. Opstigningen til Bet-Horon ender ved den øvre by, og derfra løber vejen langs højderyggen til Gibeon og Jerusalem, så den, der holdt den øvre by, holdt vejen op fra kysten. Potteskår fundet i landsbyen dateres fra jernalderen og frem; stedet er ikke udgravet."
    - "Bibelen nævner den øvre by i grænser og byggeri. Efraims grænse mod øst løb »fra Ataroth-Addar indtil det øvre Beth-Horon«, og Bet-Horon blev givet til Kehats leviter. Krønikeskriveren siger, at Sjeera, af Efraims slægt, »byggede det nedre og det øvre Beth-Horon«. Om Salomo siger han, at »han byggede det øvre Beth-Horon og det nedre Beth-Horon, faste Stæder med Mure og dobbelte Porte og Stænger«, hvor Kongebøgerne kun nævner den nedre by: de to sammen lukkede passet. Slagene hører til vejen mellem dem, hvor Josva jagede de fem konger, »hvor man gaar ned til Beth-Horon«, et filistæisk strejfparti vendte sig mod vejen til Bet-Horon i Sauls dage, Judas Makkabæus slog Seron ved opstigningen, og Cestius Gallus' legion blev hugget ned under sin tilbagetrækning i 66 e.Kr."
    - "Eusebius kendte to landsbyer Bethoron omkring tolv romerske mil fra Jerusalem på vejen til Nikopolis. Beit Ur al-Fauqa er stadig en lille landsby på sin udløber, og stykker af den gamle vej, med trin hugget i klippen, er bevaret mellem de to Beit Ur."
