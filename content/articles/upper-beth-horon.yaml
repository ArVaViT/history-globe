# Overview article (ADR 0007). Mainstream facts only; written for the upper town alone, the pass and its battles being in the Beth-horon article; the archaeology is from surveys only, and is said so.
id: upper-beth-horon
place: ab682e6
title:
  en: "Upper Beth-horon"
  ru: "Беф-Орон верхний"
  uk: "Верхній Бет-Хорон"
  es: "Bet-horón de Arriba"
  pt: "Bete-Horom de Cima"
  de: "Oberes Bet-Horon"
  fr: "Beth-Horon la haute"
  pl: "Górny Bet-Choron"
  it: "Bet-Oron di sopra"
  nl: "Boven-Beth-Horon"
  cs: "Horní Bét-choron"
