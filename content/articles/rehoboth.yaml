body:
  en:
    - "Rehoboth, “broad places”, was the third of the wells Isaac dug when the herdmen of Gerar quarrelled with his: “he removed from thence, and digged another well; and for that they strove not: and he called the name of it Rehoboth; and he said, For now the LORD hath made room for us, and we shall be fruitful in the land.” From there he went up to Beersheba. The two wells before it, Esek and Sitnah, were named for the quarrels over them."
    - "E. W. G. Masterman in the International Standard Bible Encyclopedia placed the well at Ruheibeh (Hebrew Rehovot ba-Negev), about 35 km south-west of Beersheba, where the name survives; the map follows this. Edward Robinson, who found the ruins in 1838, noted the name but thought Isaac's well lay farther north, and archaeologists reject the identification because nothing at the site is older than the Roman period. The town excavated there by Yoram Tsafrir of the Hebrew University in 1975–1979 and 1986 was a settlement on a branch of the Incense Road, occupied from the first to the seventh century AD, which became the second-largest Byzantine town of the Negev after Elusa, with four churches and many rock-cut cisterns. It lies today in southern Israel."
  ru:
    - "Реховоф, «пространные места», — третий из колодцев, выкопанных Исааком, когда пастухи Герара спорили с его пастухами: «он двинулся отсюда и выкопал иной колодезь, о котором уже не спорили, и нарек ему имя: Реховоф, ибо, сказал он, теперь Господь дал нам пространное место, и мы размножимся на земле». Оттуда он поднялся в Вирсавию. Два предыдущих колодца, Есек и Ситна, получили имена от споров о них."
    - "Э. У. Г. Мастерман в Международной стандартной библейской энциклопедии помещал колодец в Рухейбе (на иврите Реховот-ба-Негев), примерно в 35 км к юго-западу от Беэр-Шевы, где сохранилось имя; карта следует этому. Эдвард Робинсон, открывший эти развалины в 1838 г., отметил созвучие имени, но считал, что колодец Исаака лежал севернее, а археологи отвергают это отождествление, потому что на месте нет ничего древнее римского времени. Город, раскопанный там Йорамом Цафриром из Еврейского университета в 1975–1979 и 1986 гг., был поселением на ответвлении Пути благовоний, обитаемым с I по VII в. н. э.; он стал вторым по величине византийским городом Негева после Элусы, с четырьмя церквями и множеством высеченных в скале цистерн. Сегодня он находится на юге Израиля."
  uk:
    - "Реховот, «широкі місця», був третім із колодязів, які викопав Ісаак, коли пастухи Герара сварилися з його пастухами: «Відойшовши ж ізвідти, викопав ще колодязь, і не сварилися за сей; і проложив йому прізвище: Рехобот — просторонь, говорючи: Роспросторив Господь займище наше, щоб ми розмножились у сїй землї». Звідти він пішов до Беер-Шеви. Два колодязі перед ним, Есек і Ситна, були названі за суперечки навколо них."
    - "Е. В. Дж. Мастерман в International Standard Bible Encyclopedia розмістив колодязь у Рухейбі (єврейською Реховот-ба-Негев), приблизно за 35 км на південний захід від Беер-Шеви, де назва збереглася; мапа йде за цим. Едвард Робінсон, який знайшов руїни 1838 р., відзначив назву, але вважав, що колодязь Ісаака лежав північніше, а археологи відкидають ототожнення, бо на місці нічого немає давнішого за римський період. Місто, розкопане там Йорамом Цафріром з Єврейського університету в 1975–1979 і 1986 рр., було поселенням на відгалуженні Кадильного шляху, заселеним від I до VII ст. н. е., і стало другим за величиною візантійським містом Негева після Елуси, з чотирма церквами й багатьма висіченими в скелі цистернами. Нині воно лежить на півдні Ізраїлю."
  es:
    - "Rehobot, «lugares anchos», fue el tercero de los pozos que cavó Isaac cuando los pastores de Gerar riñeron con los suyos: «apartóse de allí, y abrió otro pozo, y no riñeron sobre él: y llamó su nombre Rehoboth, y dijo: Porque ahora nos ha hecho ensanchar Jehová, y fructificaremos en la tierra». Desde allí subió a Beerseba. Los dos pozos anteriores, Esec y Sitna, recibieron su nombre de las riñas por ellos."
    - "E. W. G. Masterman, en la International Standard Bible Encyclopedia, situó el pozo en Ruheibeh (en hebreo Rehovot ba-Negev), a unos 35 km al suroeste de Beerseba, donde pervive el nombre; el mapa lo sigue. Edward Robinson, que halló las ruinas en 1838, anotó el nombre pero pensó que el pozo de Isaac estaba más al norte, y los arqueólogos rechazan la identificación porque nada en el lugar es anterior al período romano. La ciudad que Yoram Tsafrir, de la Universidad Hebrea, excavó allí en 1975–1979 y 1986 era un asentamiento en un ramal de la Ruta del Incienso, ocupado del siglo I al VII d. C., que llegó a ser la segunda ciudad bizantina del Négueb después de Elusa, con cuatro iglesias y muchas cisternas excavadas en la roca. Hoy se encuentra en el sur de Israel."
  pt:
    - "Reobote, “lugares amplos”, foi o terceiro dos poços que Isaque cavou quando os pastores de Gerar discutiram com os dele: “Ele partiu daquele lugar e cavou outro poço. Não discutiram por causa desse. Por isso ele o chamou de Reobote. Ele disse: ‘Porque agora o SENHOR abriu espaço para nós, e seremos frutíferos na terra.’” Dali ele subiu a Berseba. Os dois poços anteriores, Eseque e Sitna, foram assim chamados por causa das discussões em torno deles."
    - "E. W. G. Masterman, na International Standard Bible Encyclopedia, situou o poço em Ruheibeh (em hebraico Rehovot ba-Neguev), cerca de 35 km a sudoeste de Berseba, onde o nome sobrevive; o mapa segue isso. Edward Robinson, que encontrou as ruínas em 1838, anotou o nome, mas pensou que o poço de Isaque ficava mais ao norte, e os arqueólogos rejeitam a identificação porque nada no sítio é anterior ao período romano. A cidade escavada ali por Yoram Tsafrir, da Universidade Hebraica, em 1975–1979 e 1986, era um povoado num ramal da Rota do Incenso, ocupado do século I ao VII d.C., que se tornou a segunda maior cidade bizantina do Neguebe depois de Elusa, com quatro igrejas e muitas cisternas escavadas na rocha. Fica hoje no sul de Israel."
  de:
    - "Rehobot, „weite Räume“, war der dritte der Brunnen, die Isaak grub, als die Hirten von Gerar mit den seinen stritten: „Da machte er sich von dannen und grub einen andern Brunnen. Darüber zankten sie sich nicht; darum hieß er ihn Rehoboth und sprach: Nun hat uns der HERR Raum gemacht und uns wachsen lassen im Lande.“ Von dort zog er nach Beerscheba hinauf. Die beiden Brunnen davor, Esek und Sitna, waren nach den Streitigkeiten um sie benannt."
    - "E. W. G. Masterman setzte den Brunnen in der International Standard Bible Encyclopedia bei Ruheibe (hebräisch Rehovot ba-Negev) an, etwa 35 km südwestlich von Beerscheba, wo der Name überlebt; die Karte folgt dem. Edward Robinson, der die Ruinen 1838 fand, vermerkte den Namen, hielt Isaaks Brunnen aber für weiter nördlich gelegen, und Archäologen lehnen die Gleichsetzung ab, weil an der Stätte nichts älter als die römische Zeit ist. Die dort von Yoram Tsafrir von der Hebräischen Universität 1975–1979 und 1986 ausgegrabene Stadt war eine Siedlung an einem Zweig der Weihrauchstraße, vom ersten bis zum siebten Jahrhundert n. Chr. bewohnt, die nach Elusa die zweitgrößte byzantinische Stadt des Negev wurde, mit vier Kirchen und vielen in den Fels gehauenen Zisternen. Sie liegt heute im Süden Israels."
  it:
    - "Recobot, «luoghi spaziosi», fu il terzo dei pozzi scavati da Isacco quando i mandriani di Gerar litigarono con i suoi: «scavò un altro pozzo per il quale quelli non altercarono. Ed egli lo chiamò Rehoboth “perché”, disse, “ora l’Eterno ci ha messi al largo, e noi prospereremo nel paese”». Di là salì a Bersabea. I due pozzi precedenti, Esek e Sitna, furono chiamati così per le liti che li riguardarono."
    - "E. W. G. Masterman, nella International Standard Bible Encyclopedia, collocò il pozzo a Ruheibeh (in ebraico Recovot nel Negev), a circa 35 km a sud-ovest di Bersabea, dove il nome sopravvive; la carta segue questa ipotesi. Edward Robinson, che trovò le rovine nel 1838, notò il nome ma pensò che il pozzo di Isacco fosse più a nord, e gli archeologi respingono l’identificazione perché nel sito nulla è anteriore all’epoca romana. La città scavata là da Yoram Tsafrir dell’Università Ebraica nel 1975–1979 e nel 1986 era un insediamento su un ramo della Via dell’Incenso, abitato dal I al VII secolo d.C., che divenne la seconda città bizantina del Negev dopo Elusa, con quattro chiese e molte cisterne scavate nella roccia. Oggi si trova nel sud di Israele."
  fr:
    - "Rehoboth, « lieux larges », fut le troisième des puits qu’Isaac creusa quand les bergers de Guérar querellèrent les siens : « Il se transporta de là, et creusa un autre puits, pour lequel on ne chercha pas querelle ; et il l’appela Rehoboth, car, dit-il, l’Éternel nous a maintenant mis au large, et nous prospérerons dans le pays. » De là il monta à Beer-Schéba. Les deux puits précédents, Ések et Sitna, furent nommés d’après les querelles qu’ils suscitèrent."
    - "E. W. G. Masterman, dans l’International Standard Bible Encyclopedia, plaça le puits à Ruheibeh (en hébreu Rehovot ba-Negev), à environ 35 km au sud-ouest de Beer-Schéba, où le nom survit ; la carte suit cet avis. Edward Robinson, qui trouva les ruines en 1838, nota le nom mais pensait que le puits d’Isaac se trouvait plus au nord, et les archéologues rejettent l’identification parce que rien sur le site n’est antérieur à l’époque romaine. La ville fouillée là par Yoram Tsafrir, de l’université hébraïque, en 1975–1979 et 1986, était un établissement sur un embranchement de la route de l’encens, occupé du Ier au VIIe siècle apr. J.-C., qui devint la deuxième ville byzantine du Néguev après Élusa, avec quatre églises et de nombreuses citernes taillées dans le roc. Elle se trouve aujourd’hui dans le sud d’Israël."
  nl:
    - "Rehobot, ‘brede plaatsen’, was de derde van de putten die Isaak groef toen de herders van Gerar met de zijne twistten: “En hij brak op van daar, en groef een anderen put, en zij twistten over dien niet; daarom noemde hij deszelfs naam Rehoboth, en zeide: Want nu heeft ons de HEERE ruimte gemaakt, en wij zijn gewassen in dit land.” Vandaar trok hij op naar Berseba. De twee putten ervoor, Esek en Sitna, werden genoemd naar de twisten erover."
    - "E. W. G. Masterman plaatste de put in de International Standard Bible Encyclopedia bij Ruheibeh (Hebreeuws Rehovot ba-Negev), ongeveer 35 km ten zuidwesten van Berseba, waar de naam voortleeft; de kaart volgt dit. Edward Robinson, die de ruïnes in 1838 vond, noteerde de naam maar meende dat Isaaks put verder noordelijk lag, en archeologen verwerpen de gelijkstelling omdat niets op de plaats ouder is dan de Romeinse tijd. De stad die Yoram Tsafrir van de Hebreeuwse Universiteit er in 1975–1979 en 1986 opgroef, was een nederzetting aan een tak van de Wierookroute, bewoond van de eerste tot de zevende eeuw n.Chr., die na Elusa de op een na grootste Byzantijnse stad van de Negev werd, met vier kerken en vele in de rots uitgehouwen cisternen. Zij ligt tegenwoordig in het zuiden van Israël."
  cs:
    - "Rechobót, „prostranství“, byla třetí ze studní, které Izák vykopal, když se pastýři z Gerary vadili s jeho: „I hnul se odtud, a kopal jinou studnici, o kterouž se nevadili; protož nazval jméno její Rehobot. Nebo řekl: Nyní uprostrannil nám Hospodin, a vzrostli jsme na zemi.“ Odtud vystoupil do Beer-šeby. Dvě studny před ní, Esek a Sitna, byly pojmenovány podle sporů o ně."
    - "E. W. G. Masterman v International Standard Bible Encyclopedia umístil studnu do Ruchejby (hebrejsky Rechovot ba-Negev), asi 35 km jihozápadně od Beer-šeby, kde se jméno zachovalo; mapa tento názor sleduje. Edward Robinson, který zříceniny roku 1838 nalezl, jméno zaznamenal, ale soudil, že Izákova studna ležela dále na sever, a archeologové ztotožnění odmítají, protože nic na místě není starší než římské období. Město, které tam v letech 1975–1979 a 1986 vykopal Yoram Tsafrir z Hebrejské univerzity, bylo sídlištěm na větvi Cesty kadidla, osídleným od prvního do sedmého století n. l., které se stalo druhým největším byzantským městem Negevu po Elúse, se čtyřmi kostely a mnoha cisternami vytesanými ve skále. Leží dnes v jižním Izraeli."
  pl:
    - "Rechobot, „szerokie miejsca”, była trzecią ze studni, które wykopał Izaak, gdy pasterze z Gerar kłócili się z jego pasterzami: „Zatem przeniósł się stamtąd, i wykopał drugą studnią o którą żadnego sporu nie było; i nazwał imię jej Rechobot, i mówił: Oto, teraz rozszerzył nas Pan, i urośliśmy na ziemi”. Stamtąd udał się do Beer-Szeby. Dwie wcześniejsze studnie, Esek i Sitna, nazwano od sporów o nie."
    - "E. W. G. Masterman w International Standard Bible Encyclopedia umieścił studnię w Ruhejbie (hebrajskie Rechowot ha-Negew), około 35 km na południowy zachód od Beer-Szeby, gdzie przetrwała nazwa; mapa idzie za tym. Edward Robinson, który odkrył ruiny w 1838 roku, zanotował nazwę, lecz sądził, że studnia Izaaka leżała dalej na północ, a archeolodzy odrzucają to utożsamienie, ponieważ nic na stanowisku nie jest starsze niż okres rzymski. Miasto odkopane tam przez Yorama Tsafrira z Uniwersytetu Hebrajskiego w latach 1975-1979 i 1986 było osadą na odnodze Szlaku Kadzidlanego, zamieszkaną od I do VII w. n.e., która stała się drugim co do wielkości miastem bizantyjskim Negewu po Elusie, z czterema kościołami i wieloma wykutymi w skale cysternami. Leży dziś w południowym Izraelu."
  sv:
    - "Rehovot, ”breda platser”, var den tredje av brunnarna Isak grävde när herdarna i Gerar kivades med hans: ”Sedan begav han sig därifrån till en annan plats och grävde åter en brunn; om den tvistade de icke. Därför gav han denna namnet Rehobot, i det han sade: ’Nu har ju HERREN givit oss utrymme, så att vi kunna föröka oss i landet.’” Därifrån gick han upp till Beer Sheva. De två brunnarna före den, Esek och Sitna, uppkallades efter tvisterna om dem."
    - "E. W. G. Masterman placerade i International Standard Bible Encyclopedia brunnen vid Ruheibeh (hebreiska Rehovot ba-Negev), cirka 35 km sydväst om Beer Sheva, där namnet lever kvar; kartan följer detta. Edward Robinson, som fann ruinerna 1838, noterade namnet men menade att Isaks brunn låg längre norrut, och arkeologer förkastar identifikationen eftersom ingenting på platsen är äldre än romersk tid. Staden som grävdes ut där av Yoram Tsafrir vid Hebreiska universitetet 1975–1979 och 1986 var en bosättning på en gren av Rökelsevägen, bebodd från första till sjunde århundradet e.Kr., som blev Negevs näst största bysantinska stad efter Elusa, med fyra kyrkor och många klipphuggna cisterner. Den ligger i dag i södra Israel."
  nb:
    - "Rehobot, «vide steder», var den tredje av brønnene Isak gravde da hyrdene fra Gerar kivet med hans egne: «Så brøt han op derfra og gravde ennu en brønn; den trettet de ikke om; og han kalte den Rehobot og sa: Nu har Herren gjort det rummelig for oss, så vi kan bli tallrike i landet.» Derfra dro han opp til Beer-Sjeba. De to brønnene før den, Esek og Sitna, ble oppkalt etter kivet om dem."
    - "E. W. G. Masterman plasserte i International Standard Bible Encyclopedia brønnen ved Ruheibeh (hebraisk Rehovot ba-Negev), omtrent 35 km sørvest for Beer-Sjeba, der navnet overlever; kartet følger dette. Edward Robinson, som fant ruinene i 1838, noterte navnet, men mente at Isaks brønn lå lenger nord, og arkeologer avviser identifikasjonen fordi ingenting på stedet er eldre enn romertiden. Byen som Yoram Tsafrir ved Det hebraiske universitet gravde ut der i 1975–1979 og 1986, var en bosetning på en gren av Virakveien, bebodd fra 1. til 7. århundre e.Kr., som ble den nest største bysantinske byen i Negev etter Elusa, med fire kirker og mange bergskårne sisterner. Den ligger i dag i det sørlige Israel."
  tl:
    - "Ang Rehoboth, “maluluwang na dako”, ay ang pangatlo sa mga balon na hinukay ni Isaac nang makipag-away ang mga pastol ng Gerar sa kaniyang mga pastol: “bumunot siya roon, at humukay ng ibang balon; at hindi nila pinagtalunan: at kaniyang tinawag ang pangalan na Rehoboth; at kaniyang sinabi, Sapagka't ngayo'y binigyan tayo ng Panginoon ng kaluwagan, at lalago tayo sa lupain.” Mula roon ay umahon siya sa Beer-seba. Ang dalawang balon bago nito, ang Esec at Sitnah, ay pinangalanan ayon sa mga away tungkol sa mga ito."
    - "Inilagay ni E. W. G. Masterman sa International Standard Bible Encyclopedia ang balon sa Ruheibeh (Hebreong Rehovot ba-Negev), mga 35 km sa timog-kanluran ng Beer-seba, kung saan nananatili ang pangalan; sinusunod ito ng mapa. Napansin ni Edward Robinson, na nakatuklas ng mga guho noong 1838, ang pangalan ngunit inakalang mas hilaga ang balon ni Isaac, at tinatanggihan ng mga arkeologo ang pagkilala dahil walang anuman sa lugar na mas matanda kaysa panahong Romano. Ang bayang hinukay roon ni Yoram Tsafrir ng Hebrew University noong 1975–1979 at 1986 ay isang paninirahan sa isang sangay ng Daan ng Insenso, tinirhan mula ika-1 hanggang ika-7 siglo AD, na naging pangalawang pinakamalaking bayang Bisantino ng Negev pagkatapos ng Elusa, na may apat na simbahan at maraming sisternang tinabas sa bato. Nasa timog Israel ito ngayon."
  da:
    - "Rehobot, »brede steder«, var den tredje af de brønde, Isak gravede, da Gerars hyrder kivedes med hans: »Da flyttede han derfra og grov en anden Brønd, og de kivedes ikke om den, og han kaldte dens Navn Rekoboth og sagde: thi nu har Herren gjort Rum for os, og vi ere voksede i Landet.« Derfra drog han op til Beersheba. De to brønde før den, Esek og Sitna, blev opkaldt efter kivet om dem."
    - "E. W. G. Masterman placerede i International Standard Bible Encyclopedia brønden ved Ruheibeh (hebraisk Rehovot ba-Negev), omkring 35 km sydvest for Beersheba, hvor navnet lever; kortet følger dette. Edward Robinson, der fandt ruinerne i 1838, noterede navnet, men mente, at Isaks brønd lå længere mod nord, og arkæologer afviser identifikationen, fordi intet på stedet er ældre end romertiden. Byen, som Yoram Tsafrir fra Det Hebraiske Universitet udgravede dér i 1975–1979 og 1986, var en bebyggelse ved en gren af Røgelsesvejen, beboet fra 1. til 7. århundrede e.Kr., som blev Negevs næststørste byzantinske by efter Elusa, med fire kirker og mange klippehuggede cisterner. Den ligger i dag i det sydlige Israel."
  sr:
    - "Реховот, „пространа места“, био је трећи од бунара које је Исак ископао кад су се герарски пастири свађали с његовима: „Тада се подиже оданде, и ископа други студенац, и око њега не би свађе; зато га назва Реховот, говорећи: Сад нам даде Господ простора да растемо у овој земљи.“ Одатле је отишао горе у Вирсавеју. Два бунара пред њим, Есек и Ситна, добила су име по свађама око њих."
    - "Е. В. Г. Мастерман у International Standard Bible Encyclopedia сместио је бунар у Рухејбу (хебрејски Реховот ба-Негев), око 35 км југозападно од Вирсавеје, где се име сачувало; карта следи то. Едвард Робинсон, који је рушевине нашао 1838, забележио је име, али је мислио да Исаков бунар лежи даље на север, а археолози одбацују поистовећење јер на налазишту ништа није старије од римског периода. Град који је ту ископао Јорам Цафрир са Хебрејског универзитета 1975–1979. и 1986. био је насеље на једном огранку Пута тамјана, насељен од 1. до 7. века н. е., који је постао други по величини византијски град Негева после Елусе, са четири цркве и многим у стени усеченим цистернама. Данас лежи у јужном Израелу."
  hu:
    - "Rehóbót, „tágas helyek”, a harmadik kút volt, amelyet Izsák ásott, amikor Gerár pásztorai az övéivel összevesztek: „tovább vonula onnan és ása más kútat, a mely miatt nem versengének; azért nevezé nevét Rehobóthnak, és monda: Immár tágas helyet szerzett az Úr minékünk, és szaporodhatunk a földon.” Onnan felment Beérsebába. A két korábbi kutat, Eszeket és Sitnát a rajtuk való viszályokról nevezték el."
    - "E. W. G. Masterman az International Standard Bible Encyclopediában a kutat Ruheibehnél helyezte el (héberül Rehovot ba-Negev), Beérsebától mintegy 35 km-re délnyugatra, ahol a név fennmaradt; a térkép ezt követi. Edward Robinson, aki 1838-ban megtalálta a romokat, megjegyezte a nevet, de úgy gondolta, hogy Izsák kútja északabbra feküdt, a régészek pedig elvetik az azonosítást, mert a lelőhelyen semmi sem régebbi a római kornál. A városka, amelyet Yoram Tsafrir, a Héber Egyetem munkatársa ásatott 1975–1979-ben és 1986-ban, a Tömjénút egyik ágának települése volt, Kr. u. az 1. századtól a 7. századig lakott, és Elúsza után a Negev második legnagyobb bizánci városa lett, négy templommal és sok sziklába vájt ciszternával. Ma Dél-Izraelben fekszik."
  fi:
    - "Rehobot, ”leveät paikat”, oli kolmas niistä kaivoista, jotka Iisak kaivoi Gerarin paimenten riidellessä hänen paimentensa kanssa: ”Sitten hän muutti sieltä pois ja kaivoi vielä yhden kaivon. Siitä ei syntynyt riitaa. Sentähden hän nimitti sen Rehobotiksi ja sanoi: ’Nyt Herra on antanut meille tilaa, niin että voimme lisääntyä maassa’.” Sieltä hän nousi Beersebaan. Kaksi sitä edeltävää kaivoa, Esek ja Sitna, nimettiin niistä käytyjen riitojen mukaan."
    - "E. W. G. Masterman International Standard Bible Encyclopediassa sijoitti kaivon Ruheibehiin (hepreaksi Rehovot ba-Negev), noin 35 km Beersebasta lounaaseen, missä nimi säilyy; kartta seuraa tätä. Edward Robinson, joka löysi rauniot vuonna 1838, huomasi nimen mutta ajatteli Iisakin kaivon olleen pohjoisempana, ja arkeologit hylkäävät tunnistuksen, koska paikalla mikään ei ole roomalaista aikaa vanhempaa. Kaupunki, jonka Heprealaisen yliopiston Yoram Tsafrir kaivoi vuosina 1975–1979 ja 1986, oli suitsuketien haaran varrella oleva asutus, jossa asuttiin 1. vuosisadalta 600-luvulle jaa. ja josta tuli Negevin toiseksi suurin bysanttilainen kaupunki Elusan jälkeen, neljine kirkkoineen ja monine kallioon hakattuine vesisäiliöineen. Se sijaitsee nykyään Etelä-Israelissa."
  vi:
    - "Rê-hô-bốt, “những nơi rộng”, là giếng thứ ba Y-sác đào khi bọn chăn chiên Ghê-ra tranh giành với bọn chăn chiên của ông: “Đoạn, người bỏ chỗ đó đi đào một giếng khác; về giếng nầy, họ không tranh giành nhau, nên người đặt tên là Rê-hô-bốt, mà rằng: Bây giờ Đức Giê-hô-va đã để cho chúng ta được ở rộng rãi, và ta sẽ đặng thịnh vượng trong xứ.” Từ đó ông đi lên Bê-e-Sê-ba. Hai giếng trước nó, Ê-sét và Sít-na, được đặt tên theo những cuộc tranh giành quanh chúng."
    - "E. W. G. Masterman trong International Standard Bible Encyclopedia đặt giếng tại Ruheibeh (tiếng Hê-bơ-rơ Rehovot ba-Negev), cách Bê-e-Sê-ba khoảng 35 km về phía tây nam, nơi tên còn lưu lại; bản đồ theo đó. Edward Robinson, người tìm thấy tàn tích năm 1838, ghi nhận tên nhưng nghĩ giếng của Y-sác nằm xa hơn về phía bắc, và các nhà khảo cổ bác bỏ sự đồng nhất này vì không có gì ở địa điểm cũ hơn thời La Mã. Thị trấn do Yoram Tsafrir của Đại học Hê-bơ-rơ khai quật ở đó năm 1975–1979 và 1986 là một khu định cư trên một nhánh của Con Đường Hương Liệu, có người ở từ thế kỷ 1 đến thế kỷ 7, trở thành thị trấn Byzantine lớn thứ nhì của Negev sau Elusa, với bốn nhà thờ và nhiều bể chứa nước đục trong đá. Ngày nay nó nằm ở miền nam Israel."
  ro:
    - "Rehobot, „locuri largi”, a fost a treia dintre fântânile săpate de Isaac când păstorii din Gherar s-au certat cu ai lui: „Și ridicându-se de acolo au săpat altă fântână și nu s’au bătut pentru aceea, și a numit numele ei lățime, zicând: că acum ne-au lățit pre noi Domnul și ne-au crescut pre pământ.” De acolo s-a suit la Beer-Șeba. Cele două fântâni dinaintea ei, Esec și Sitna, au fost numite după certurile pentru ele."
    - "E. W. G. Masterman, în International Standard Bible Encyclopedia, a așezat fântâna la Ruheibeh (în ebraică Rehovot ba-Negev), la circa 35 km sud-vest de Beer-Șeba, unde numele s-a păstrat; harta îl urmează. Edward Robinson, care a găsit ruinele în 1838, a notat numele, dar a socotit că fântâna lui Isaac se afla mai la nord, iar arheologii resping identificarea pentru că nimic din sit nu este mai vechi decât perioada romană. Orașul săpat acolo de Yoram Tsafrir de la Universitatea Ebraică în 1975–1979 și 1986 a fost o așezare pe o ramură a Drumului Tămâii, locuită din secolul I până în secolul al VII-lea d.Hr., care a devenit al doilea cel mai mare oraș bizantin din Neghev după Elusa, cu patru biserici și multe cisterne săpate în stâncă. Astăzi se află în sudul Israelului."
  bg:
    - "Реховот, „широки места“, бил третият от кладенците, които Исаак изкопал, когато герарските пастири се карали с неговите: „И премести се от там и изкопа друг кладенец, и за него не се препираха, и нарече го Роовот и думаше: Защото сега ни разпространи Господ, и ще се наплодим на тази земя.“ Оттам той се изкачил към Вирсавия. Двата кладенеца преди него, Есек и Ситна, били наречени по споровете за тях."
    - "Е. У. Г. Мастърман в International Standard Bible Encyclopedia поставя кладенеца при Рухейбе (на иврит Реховот ба-Негев), на около 35 км югозападно от Вирсавия, където името се е запазило; картата следва това. Едуард Робинсън, който открил руините през 1838 г., отбелязал името, но смятал, че кладенецът на Исаак е по-на север, а археолозите отхвърлят отъждествяването, тъй като нищо на мястото не е по-старо от римския период. Градът, разкопан там от Йорам Цафрир от Еврейския университет през 1975–1979 и 1986 г., бил селище на разклонение на Пътя на тамяна, обитавано от I до VII в. н.е., което станало вторият по големина византийски град в Негев след Елуса, с четири църкви и много изсечени в скалата водохранилища. Днес се намира в Южен Израел."
