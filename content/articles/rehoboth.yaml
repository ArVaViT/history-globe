# Overview article (ADR 0007). Isaac's well Rehoboth is placed by Masterman in the ISBE at Ruheibeh, the map's point; Robinson (who found the ruins) and modern archaeology (Negev & Gibson) reject this, since the town is Roman to Byzantine, which is stated. Not Rehoboth-by-the-river (rehoboth-by-the-river.yaml).
