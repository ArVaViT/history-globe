  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
  - "A. F. Rainey and R. S. Notley, The Sacred Bridge: Carta's Atlas of the Biblical World (2006)"
  - "F.-M. Abel, Géographie de la Palestine, vol. 2 (1938)"
