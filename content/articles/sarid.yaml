body:
  en:
    - "Sarid was the point from which the border of Zebulun was drawn in both directions: “the border of their inheritance was unto Sarid”, from there westward “toward the sea, and Maralah” and the brook “before Jokneam”, and from Sarid “eastward toward the sunrising unto the border of Chisloth-tabor”. It is named nowhere else. Some Greek manuscripts give the name as Sedoud, and most scholars accept that reading and place the town at Tel Shadud, a low mound at the northern edge of the Jezreel Valley about 8 km south-west of Nazareth, near the kibbutz that took the name Sarid in 1926."
    - "The mound has been surveyed and sampled, not fully excavated. A salvage dig at its foot in 2013–14 uncovered a burial of about the thirteenth century BC in an Egyptian-style clay coffin with a face modelled on its lid; inside lay a scarab with the name of Seti I in a gold mount, a sign of Egyptian presence in the valley. Of Sarid itself in Israelite times nothing is known beyond its place on the line of Joshua 19. Tel Shadud today lies amid the fields of the Jezreel Valley in northern Israel."
  ru:
    - "Сарид — точка, от которой граница Завулона проводилась в обе стороны: «простирался предел удела их до Сарида», оттуда на запад «к морю и Марале» и к потоку, «который пред Иокнеамом», а «от Сарида идет назад к восточной стороне, к востоку солнца, до предела Кислоф-Фавора». Больше это имя нигде не встречается. В некоторых греческих рукописях оно читается как Седуд, и большинство учёных принимают это чтение и помещают город на Тель-Шадуд — невысокий холм у северного края Изреельской долины, примерно в 8 км к юго-западу от Назарета, недалеко от кибуца, который в 1926 году взял имя Сарид."
    - "Холм обследован и опробован раскопами, но полностью не раскопан. Спасательные раскопки у его подножия в 2013–2014 годах открыли погребение примерно XIII века до н. э. в глиняном гробу египетского типа с вылепленным на крышке лицом; внутри лежал скарабей с именем Сети I в золотой оправе — след египетского присутствия в долине. О самом Сариде израильского времени не известно ничего, кроме его места на линии 19-й главы Иисуса Навина. Тель-Шадуд лежит сегодня среди полей Изреельской долины на севере Израиля."
  uk:
    - "Сарід був точкою, від якої проводили межу Завулона в обидва боки: «займище наслїдньої держави їх доходило до Сарида», звідти на захід «до моря і до Марела» і до річки, «що перед Йокнеамом», а від Сарида «На схід сонця же повертає від Сарида на займище Кислот-Таборське». Більше ніде він не згадується. Деякі грецькі рукописи подають назву як Седуд, і більшість учених приймають це прочитання та поміщають місто на Тель-Шадуді, низькому пагорбі на північному краї Їзреельської долини, приблизно за 8 км на південний захід від Назарета, поблизу кібуца, що в 1926 р. узяв назву Сарід."
    - "Пагорб обстежено й зроблено пробні зрізи, але повністю не розкопано. Рятувальні розкопки біля його підніжжя в 2013–2014 рр. виявили поховання близько XIII ст. до н. е. в глиняній труні єгипетського типу з обличчям, змодельованим на кришці; усередині лежав скарабей з ім'ям Сеті I в золотій оправі — ознака єгипетської присутності в долині. Про сам Сарід ізраїльських часів нічого не відомо, крім його місця на межі за Ісусом Навином, розділ 19. Тель-Шадуд нині лежить серед полів Їзреельської долини на півночі Ізраїля."
  es:
    - "Sarid era el punto desde el cual se trazaba la frontera de Zabulón en ambas direcciones: «el término de su heredad fué hasta Sarid», de allí hacia el oeste «hasta la mar y hasta Merala» y el arroyo «que está delante de Jocneam», y desde Sarid «hacia oriente, donde nace el sol al término de Chisiloth-tabor». No se nombra en ningún otro lugar. Algunos manuscritos griegos dan el nombre como Sedud, y la mayoría de los estudiosos acepta esa lectura y sitúa la ciudad en Tel Shadud, un montículo bajo en el borde norte del valle de Jezreel, a unos 8 km al suroeste de Nazaret, cerca del kibutz que tomó el nombre de Sarid en 1926."
    - "El montículo ha sido prospectado y muestreado, no excavado por completo. Una excavación de salvamento a su pie en 2013–2014 sacó a la luz un enterramiento de hacia el siglo XIII a. C. en un sarcófago de arcilla de estilo egipcio con un rostro modelado en la tapa; dentro había un escarabeo con el nombre de Seti I en una montura de oro, señal de presencia egipcia en el valle. De la propia Sarid en tiempos israelitas no se sabe nada más allá de su lugar en la línea de Josué 19. Tel Shadud se halla hoy entre los campos del valle de Jezreel, en el norte de Israel."
  pt:
    - "Sarid era o ponto a partir do qual a fronteira de Zebulom era traçada nos dois sentidos: “A fronteira da sua herança ia até Saride”, dali para o oeste “subia para o oeste, até Maralá”, e “chegava ao ribeiro que está em frente a Jocneão”, e de Sarid “virava para o leste, em direção ao nascente do sol, até a fronteira de Quislote-Tabor”. Não é citada em nenhum outro lugar. Alguns manuscritos gregos dão o nome como Sedoud, e a maioria dos estudiosos aceita essa leitura e situa a cidade em Tel Shadud, um monte baixo na orla norte do vale de Jezreel, a cerca de 8 km a sudoeste de Nazaré, perto do kibutz que tomou o nome Sarid em 1926."
    - "O monte foi prospectado e sondado, não plenamente escavado. Uma escavação de salvamento ao seu pé, em 2013–2014, revelou um sepultamento de cerca do século XIII a.C. num sarcófago de argila de estilo egípcio com um rosto modelado na tampa; dentro jazia um escaravelho com o nome de Seti I numa montagem de ouro, sinal de presença egípcia no vale. Da própria Sarid em tempos israelitas nada se sabe além de seu lugar na linha de Josué 19. Tel Shadud fica hoje entre os campos do vale de Jezreel, no norte de Israel."
  de:
    - "Sarid war der Punkt, von dem aus die Grenze Sebulons in beide Richtungen gezogen wurde: „die Grenze ihres Erbteils war bis gen Sarid“, von dort westwärts „hinauf abendwärts gen Mareala und stößt an Dabbeseth und stößt an den Bach, der vor Jokneam fließt“, und von Sarid „gegen der Sonne Aufgang bis an die Grenze Kisloth-Thabor“. Sonst wird es nirgends genannt. Einige griechische Handschriften geben den Namen als Sedoud, und die meisten Gelehrten akzeptieren diese Lesung und setzen die Stadt nach Tel Schadud, einen niedrigen Hügel am Nordrand der Jesreel-Ebene etwa 8 km südwestlich von Nazareth, nahe dem Kibbuz, der 1926 den Namen Sarid annahm."
    - "Der Hügel wurde vermessen und beprobt, aber nicht vollständig ausgegraben. Eine Notgrabung an seinem Fuß fand 2013/14 eine Bestattung aus etwa dem 13. Jahrhundert v. Chr. in einem Tonsarg ägyptischer Art mit einem auf dem Deckel modellierten Gesicht; darin lag ein Skarabäus mit dem Namen Sethos' I. in goldener Fassung, ein Zeichen ägyptischer Präsenz in der Ebene. Von Sarid selbst in israelitischer Zeit ist nichts bekannt außer seiner Stelle in der Linie von Josua 19. Tel Schadud liegt heute inmitten der Felder der Jesreel-Ebene im Norden Israels."
  fr:
    - "Sarid était le point d’où la frontière de Zabulon était tracée dans les deux sens : « La limite de leur héritage s’étendait jusqu’à Sarid », de là elle montait « à l’occident vers Mareala » et vers le torrent « qui coule devant Jokneam », et de Sarid elle « tournait à l’orient, vers le soleil levant, jusqu’à la frontière de Kisloth-Thabor ». Il n’est nommé nulle part ailleurs. Certains manuscrits grecs donnent le nom Sédoud, et la plupart des spécialistes acceptent cette lecture et placent la ville à Tel Shadud, tertre bas au bord nord de la vallée de Jizreel, à environ 8 km au sud-ouest de Nazareth, près du kibboutz qui prit le nom de Sarid en 1926."
    - "Le tertre a été prospecté et sondé, non pleinement fouillé. Une fouille de sauvetage à son pied en 2013–2014 a mis au jour une sépulture d’environ le XIIIe siècle av. J.-C. dans un cercueil d’argile de style égyptien au visage modelé sur le couvercle ; à l’intérieur reposait un scarabée au nom de Séthi Ier dans une monture d’or, signe d’une présence égyptienne dans la vallée. De Sarid elle-même à l’époque israélite, on ne sait rien au-delà de sa place sur la ligne de Josué 19. Tel Shadud se trouve aujourd’hui parmi les champs de la vallée de Jizreel, dans le nord d’Israël."
  it:
    - "Sarid era il punto da cui il confine di Zabulon era tracciato in entrambe le direzioni: «Il confine della loro eredità si estendeva fino a Sarid», da lì verso ovest «saliva a occidente verso Mareala» e giungeva al torrente «che scorre di faccia a Iokneam», e da Sarid «girava ad oriente, verso il sol levante, sino al confine di Kisloth-Tabor». Non è nominata altrove. Alcuni manoscritti greci danno il nome come Sedoud, e la maggior parte degli studiosi accetta questa lettura e colloca la città a Tel Shadud, un basso tell al margine settentrionale della valle di Izreel circa 8 km a sud-ovest di Nazaret, presso il kibbutz che nel 1926 prese il nome di Sarid."
    - "Il tell è stato oggetto di ricognizioni e sondaggi, non scavato per intero. Uno scavo di emergenza ai suoi piedi nel 2013–2014 portò alla luce una sepoltura del XIII secolo a.C. circa in un sarcofago d’argilla di stile egizio con un volto modellato sul coperchio; all’interno giaceva uno scarabeo con il nome di Sethi I in una montatura d’oro, segno di una presenza egizia nella valle. Della stessa Sarid in epoca israelita non si sa nulla oltre al suo posto sulla linea di Giosuè 19. Tel Shadud si trova oggi tra i campi della valle di Izreel, nel nord di Israele."
  pl:
    - "Sarid był punktem, od którego granicę Zabulona prowadzono w obu kierunkach: na zachód „idzie granica ich morza Marala, i przychodzi do Debbaset, ciągnąc się aż do potoku, który jest przeciw Jeknoam”, a „od Saryd na wschód słońca ku granicy Chasalek Tabor”. Nie jest wymieniony nigdzie indziej. Niektóre rękopisy greckie podają nazwę jako Sedud, a większość uczonych przyjmuje to odczytanie i umieszcza miasto w Tel Szadud, niskim kopcu na północnym skraju doliny Jizreel około 8 km na południowy zachód od Nazaretu, blisko kibucu, który w 1926 roku przyjął nazwę Sarid."
    - "Kopiec zbadano powierzchniowo i próbnie, lecz nie wykopano w pełni. Ratownicze wykopaliska u jego stóp w latach 2013–2014 odsłoniły pochówek z około XIII wieku p.n.e. w glinianej trumnie w stylu egipskim z modelowaną twarzą na wieku; w środku leżał skarabeusz z imieniem Setiego I w złotej oprawie, znak egipskiej obecności w dolinie. O samym Sarid w czasach izraelskich nic nie wiadomo poza jego miejscem na linii z Joz 19. Tel Szadud leży dziś wśród pól doliny Jizreel w północnym Izraelu."
  cs:
    - "Sarid byl bod, od něhož se hranice Zebulunova vedla oběma směry: „jest meze dědictví jejich až do Sarid“, odtud na západ „podlé moře k Merala“ a k potoku „proti Jekonam“, a od Sarid „nazpátek k východu slunce, ku pomezí Chazelet Tábor“. Nikde jinde se nejmenuje. Některé řecké rukopisy podávají jméno jako Sedoud a většina učenců toto čtení přijímá a klade město do Tel Šadud, nízkého pahorku na severním okraji Jizreelského údolí asi 8 km jihozápadně od Nazareta, poblíž kibucu, který roku 1926 přijal jméno Sarid."
    - "Pahorek byl prozkoumán a vzorkován, nikoli plně vykopán. Záchranný výzkum u jeho paty v letech 2013–2014 odkryl pohřeb z asi 13. století př. n. l. v hliněné rakvi egyptského typu s tváří vymodelovanou na víku; uvnitř ležel skarabeus se jménem Sethose I. ve zlaté obrubě, znamení egyptské přítomnosti v údolí. O Saridu samém v izraelské době není nic známo kromě jeho místa na linii Jozue 19. Tel Šadud dnes leží mezi poli Jizreelského údolí v severním Izraeli."
  nl:
    - "Sarid was het punt vanwaar de grens van Zebulon in beide richtingen werd getrokken: “de landpale van hun erfdeel was tot aan Sarid”, vandaar westwaarts “opwaarts naar het westen en Mar-ala” en de beek “die voor aan Jokneam is”, en van Sarid “oostwaarts tegen den opgang der zon, tot de landpale van Chisloth-Thabor”. Het wordt nergens anders genoemd. Sommige Griekse handschriften geven de naam als Sedoud, en de meeste geleerden aanvaarden die lezing en plaatsen de stad bij Tel Shadud, een lage heuvel aan de noordrand van de vallei van Jizreël zo’n 8 km ten zuidwesten van Nazareth, bij de kibboets die in 1926 de naam Sarid aannam."
    - "De heuvel is onderzocht en bemonsterd, niet volledig opgegraven. Een noodopgraving aan zijn voet in 2013–2014 legde een begraving van omstreeks de 13e eeuw v.Chr. bloot in een kleisarcofaag in Egyptische stijl met een gezicht gemodelleerd op het deksel; daarbinnen lag een scarabee met de naam van Seti I in een gouden montuur, een teken van Egyptische aanwezigheid in de vallei. Van Sarid zelf in de Israëlitische tijd is niets bekend buiten zijn plaats op de lijn van Jozua 19. Tel Shadud ligt tegenwoordig tussen de akkers van de vallei van Jizreël in het noorden van Israël."
  sv:
    - "Sarid var punkten varifrån Sebulons gräns drogs i båda riktningar: ”gränsen för deras arvedel gick ända till Sarid”, därifrån ”västerut uppåt till Mareala och träffade Dabbeset och träffade vidare dalen som ligger gent emot Jokneam”, och från Sarid ”österut mot solens uppgång, vände den sig åt Kislot-Tabors område”. Det nämns ingen annanstans. Vissa grekiska handskrifter anger namnet som Sedoud, och de flesta forskare godtar den läsningen och placerar staden vid Tel Shadud, en låg kulle i norra kanten av Jisreeldalen cirka 8 km sydväst om Nasaret, nära kibbutzen som tog namnet Sarid 1926."
    - "Kullen har undersökts och provgrävts, inte grävts ut fullständigt. En räddningsgrävning vid dess fot 2013–14 frilade en gravläggning från omkring 1200-talet f.Kr. i en egyptisk lerkista med ett ansikte modellerat på locket; inuti låg en skarabé med Sethos I:s namn i guldfattning, ett tecken på egyptisk närvaro i dalen. Om Sarid själv under israelitisk tid vet man ingenting utöver dess plats på linjen i Josua 19. Tel Shadud ligger i dag bland fälten i Jisreeldalen i norra Israel."
  nb:
    - "Sarid var punktet Sebulons grense ble trukket fra i begge retninger: «grensen for deres arvelodd gikk til Sarid», derfra mot vest «op til Marala, støtte til Dabbeset og nådde den bekk som løper østenfor Jokneam», og fra Sarid «mot øst, mot solens opgang, bøide den sig [...] bort til Kislot-Tabors enemerker». Det er ikke nevnt noe annet sted. Noen greske håndskrifter gir navnet som Sedoud, og de fleste forskere godtar den lesningen og plasserer byen ved Tel Shadud, en lav haug i den nordlige kanten av Jisreel-dalen omtrent 8 km sørvest for Nasaret, nær kibbutzen som tok navnet Sarid i 1926."
    - "Haugen er kartlagt og prøvegravd, ikke fullstendig utgravd. En redningsgraving ved foten i 2013–14 avdekket en gravlegging fra omkring 1200-tallet f.Kr. i en leirkiste i egyptisk stil med et ansikt formet på lokket; inni lå en skarabé med Seti I's navn i gullfatning, et tegn på egyptisk nærvær i dalen. Om selve Sarid i israelittisk tid er ingenting kjent utover plassen på linjen i Josva 19. Tel Shadud ligger i dag midt i åkrene i Jisreel-dalen i Nord-Israel."
  tl:
    - "Ang Sarid ang punto kung saan iginuhit ang hangganan ng Zabulon sa dalawang direksiyon: “ang hangganan ng kanilang mana ay hanggang sa Sarid”, mula roon pakanluran “pasampa sa dakong kalunuran sa Merala” at ang batis “sa harap ng Jocneam”, at mula sa Sarid “sa dakong silanganan na dakong sinisikatan ng araw hanggang sa hangganan ng Chisiloth-tabor”. Wala na itong pinangalanan saanman. Ang ilang manuskritong Griyego ay nagbibigay ng pangalang Sedoud, at tinatanggap ng karamihan sa mga iskolar ang pagbasang iyon at inilalagay ang bayan sa Tel Shadud, isang mababang burol sa hilagang gilid ng Libis ng Jezreel mga 8 km sa timog-kanluran ng Nazaret, malapit sa kibbutz na kumuha ng pangalang Sarid noong 1926."
    - "Sinuri at sinampolan ang burol, hindi lubos na hinukay. Isang paghuhukay ng pagsagip sa paanan nito noong 2013–14 ang nakatuklas ng isang libing mula bandang ika-13 siglo BK sa isang kabaong na luwad na istilong Egipcio na may mukhang hinulma sa takip; sa loob ay may scarab na may pangalan ni Seti I sa gintong balangkas, tanda ng presensiyang Egipcio sa libis. Tungkol sa mismong Sarid noong panahon ng Israel, wala nang nalalaman maliban sa lugar nito sa linya ng Josue 19. Ang Tel Shadud ay nasa gitna ng mga bukid ng Libis ng Jezreel sa hilagang Israel ngayon."
  da:
    - "Sarid var det punkt, hvorfra Zebulons grænse blev trukket i begge retninger: »Landemærket paa deres Arv var indtil Sarid«, derfra »mod Vest og til Marala« og bækken »lige for Jokneam«, og fra Sarid »mod Østen, mod Solens Opgang, ved Kisloth-Thabors Landemærke«. Det nævnes ingen andre steder. Nogle græske håndskrifter giver navnet som Sedoud, og de fleste forskere accepterer den læsning og placerer byen ved Tel Shadud, en lav høj i den nordlige kant af Jizre'el-dalen omkring 8 km sydvest for Nazaret, nær den kibbutz, der tog navnet Sarid i 1926."
    - "Højen er undersøgt og prøvegravet, ikke fuldt udgravet. En redningsudgravning ved dens fod i 2013–14 afdækkede en grav fra omkring 1200-tallet f.Kr. i en lerkiste i egyptisk stil med et ansigt modelleret på låget; indeni lå en skarabæ med Seti 1.'s navn i en guldfatning, et tegn på egyptisk tilstedeværelse i dalen. Om selve Sarid i israelitisk tid vides intet ud over dens plads på linjen i Josvabogens kapitel 19. Tel Shadud ligger i dag blandt markerne i Jizre'el-dalen i det nordlige Israel."
  sr:
    - "Сарид је била тачка од које је граница Завулонова вучена у оба смера: „међа наследству њиховом би до Сариде“, одатле на запад „покрај мора на Маралу“ и поток „који је према Јокнеаму“, а од Сариде „на исток до међе кислот-таворске“. Нигде се другде не именује. Неки грчки рукописи дају име као Седуд, и већина научника прихвата то читање и смешта град у Тел Шадуд, ниску хумку на северном ободу Језраелске долине око 8 км југозападно од Назарета, близу кибуца који је 1926. узео име Сарид."
    - "Хумка је прегледана и узорковање је вршено, али није потпуно ископана. Спасилачко ископавање у њеном подножју 2013–14. открило је гроб из око 13. века п. н. е. у глиненом ковчегу египатског стила са лицем моделираним на поклопцу; унутра је лежао скарабеј са именом Сетија I у златном оквиру, знак египатског присуства у долини. О самом Сариду у израиљско доба не зна се ништа осим његовог места на линији из Исуса Навина 19. Тел Шадуд данас лежи међу пољима Језраелске долине у северном Израелу."
scripture:
  - Josh.19.10-Josh.19.12
sources:
  - "E. C. M. van den Brink et al., 'A Late Bronze Age II Clay Coffin from Tel Shaddud in the Central Jezreel Valley, Israel: Context and Historical Implications', Levant 49 (2017)"
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
  - "A. F. Rainey and R. S. Notley, The Sacred Bridge: Carta's Atlas of the Biblical World (2006)"
  - "F.-M. Abel, Géographie de la Palestine, vol. 2 (1938)"
