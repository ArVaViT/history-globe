# Overview article (ADR 0007). Mainstream facts only; disputed datings and readings are named as such.
id: pergamum
place: a75d2c1
title:
  en: "Pergamum"
  ru: "Пергам"
  uk: "Пергам"
  es: "Pérgamo"
  pt: "Pérgamo"
  de: "Pergamon"
  fr: "Pergame"
body:
  en:
    - "Pergamum, by modern Bergama, stands on a steep hill above the fertile valley of the Caicus in north-western Asia Minor, some 25 km from the Aegean. Xenophon's Greek army came to it about 400 BC, but its rise came after Alexander. Lysimachus kept a treasure of nine thousand talents in its citadel under the eunuch Philetaerus, who broke with him about 282 BC and kept the city and the treasure; his heirs, the Attalids, made it a kingdom, and Attalus I took the title of king after a great victory over the Galatians."
    - "The Attalids sided with Rome. Eumenes II (197–159 BC) received from the Romans the lands of Asia Minor taken from Antiochus the Great, and Pergamum was adorned with temples, libraries and the great altar, usually dated to his reign. Pliny, following Varro, tells that parchment was invented here when the king of Egypt, jealous of Pergamum's library, stopped the export of papyrus. In 133 BC Attalus III died and left his kingdom to the Romans, who made it the province of Asia."
    - 'In 29 BC Augustus allowed the Greeks of Asia to build a temple to himself and Rome at Pergamum. The city was also famed for its sanctuary of Asclepius, the healing god, and the physician Galen was born here about AD 129. Revelation addresses the third of the seven churches to Pergamum, "where Satan''s seat is", and names Antipas, "my faithful martyr, who was slain among you". Whether Satan''s seat means the altar of Zeus, the worship of the emperor or the city''s place as a seat of Roman power is disputed. The letter also rebukes those who hold the teaching of Balaam and of the Nicolaitans.'
    - "Eusebius records that Carpus, Papylus and a woman named Agathonice were martyred at Pergamum; their death is dated by some to the reign of Marcus Aurelius and by others to that of Decius. In 262, the Historia Augusta says, an earthquake struck the cities of Asia hardest of all, and Gothic raiders then ravaged the province; it does not name Pergamum, but the city never regained its Attalid splendour. The Red Basilica, a huge second-century temple of Egyptian gods in the lower city, later had a church built inside it."
  ru:
    - "Пергам, у нынешней Бергамы, стоит на крутом холме над плодородной долиной Каика на северо-западе Малой Азии, примерно в 25 км от Эгейского моря. Греческое войско Ксенофонта приходило сюда около 400 г. до н. э., но возвышение пришло после Александра. Лисимах хранил в его крепости казну в девять тысяч талантов под надзором евнуха Филетера, который около 282 г. до н. э. отложился от него и удержал город и казну; его наследники, Атталиды, сделали Пергам царством, а Аттал I принял царский титул после большой победы над галатами."
    - "Атталиды держали сторону Рима. Евмен II (197–159 гг. до н. э.) получил от римлян земли Малой Азии, отнятые у Антиоха Великого, а Пергам украсился храмами, библиотеками и большим алтарём, который обычно относят к его царствованию. Плиний вслед за Варроном рассказывает, что пергамент изобрели здесь, когда египетский царь из ревности к пергамской библиотеке запретил вывоз папируса. В 133 г. до н. э. Аттал III умер и завещал своё царство римлянам, которые сделали его провинцией Асия."
    - "В 29 г. до н. э. Август позволил грекам Асии построить в Пергаме храм ему и Риму. Город славился и святилищем Асклепия, бога врачевания, а около 129 г. н. э. здесь родился врач Гален. Откровение обращает к Пергаму третье из посланий семи церквам: «ты живешь там, где престол сатаны», и напоминает, что у них был умерщвлен «верный свидетель Мой Антипа». Что означает престол сатаны — алтарь Зевса, поклонение императору или роль города как средоточия римской власти, — спорно. Послание обличает и держащихся учения Валаама и учения Николаитов."
    - "Евсевий сообщает, что в Пергаме приняли мученичество Карп, Папил и женщина по имени Агафоника; одни относят их смерть ко временам Марка Аврелия, другие — ко временам Декия. В 262 г., по словам «Истории Августов», землетрясение сильнее всего ударило по городам Асии, а затем провинцию опустошили готы; Пергам там не назван, но блеска времён Атталидов город уже не вернул. Внутри Красной базилики — огромного храма египетских богов II века в нижнем городе — позднее была построена церковь."
  uk:
    - "Пергам, нинішня Бергама, стоїть на крутому пагорбі над родючою долиною Каїка на північному заході Малої Азії, приблизно за 25 км від Егейського моря. Грецьке військо Ксенофонта дійшло до нього близько 400 р. до н. е., але справжнє піднесення міста почалося після Александра. Лісімах зберігав у його цитаделі скарб у дев’ять тисяч талантів під наглядом євнуха Філетера, який близько 282 р. до н. е. порвав з Лісімахом і залишив собі і місто, і скарб; його спадкоємці, Атталіди, зробили Пергам царством, а Аттал I прийняв титул царя після великої перемоги над галатами."
    - "Атталіди трималися Риму. Евмен II (197–159 рр. до н. е.) отримав від римлян землі Малої Азії, відібрані в Антіоха Великого, і Пергам прикрасився храмами, бібліотеками та великим вівтарем, який зазвичай датують його правлінням. Пліній за Варроном розповідає, що пергамент винайшли тут, коли єгипетський цар, заздрячи пергамській бібліотеці, заборонив вивозити папірус. У 133 р. до н. е. Аттал III помер і заповів своє царство римлянам, які зробили його провінцією Азія."
    - "У 29 р. до н. е. Август дозволив грекам Азії звести в Пергамі храм собі та Ріму. Місто славилося й святилищем Асклепія, бога-цілителя, а близько 129 р. н. е. тут народився лікар Гален. Одкровення звертається до Пергама як до третьої з семи церков, «де престол сатани», і називає Антипу: «сьвідок мій вірний, убитий у вас». Чи означає престол сатани вівтар Зевса, культ імператора, чи місце міста як осередку римської влади, — предмет суперечок. Лист докоряє й тим, хто тримається науки Валаама та ніколаїтів."
    - "Євсевій повідомляє, що в Пергамі прийняли мученицьку смерть Карп, Папіл і жінка на ім’я Агафоніка; одні відносять їхню смерть до правління Марка Аврелія, інші — до часів Декія. У 262 р., як сказано в «Історії Августів», землетрус вразив міста Азії найтяжче з усіх, а потім провінцію спустошили готські напасники; Пергам вона не називає, але місто так і не повернуло собі блиску часів Атталідів. Червона базиліка, величезний храм єгипетських богів II століття в нижньому місті, згодом мала всередині збудовану церкву."
  es:
    - "Pérgamo, junto a la actual Bergama, se alza sobre una colina escarpada por encima del fértil valle del Caico, en el noroeste de Asia Menor, a unos 25 km del Egeo. El ejército griego de Jenofonte llegó a ella hacia 400 a. C., pero su ascenso vino después de Alejandro. Lisímaco guardaba un tesoro de nueve mil talentos en su ciudadela bajo el eunuco Filetero, que rompió con él hacia 282 a. C. y conservó la ciudad y el tesoro; sus herederos, los Atálidas, la hicieron un reino, y Átalo I tomó el título de rey tras una gran victoria sobre los gálatas."
    - "Los Atálidas se pusieron del lado de Roma. Eumenes II (197–159 a. C.) recibió de los romanos las tierras de Asia Menor tomadas a Antíoco el Grande, y Pérgamo se adornó con templos, bibliotecas y el gran altar, que suele fecharse en su reinado. Plinio, siguiendo a Varrón, cuenta que el pergamino se inventó aquí cuando el rey de Egipto, celoso de la biblioteca de Pérgamo, detuvo la exportación de papiro. En 133 a. C. murió Átalo III y dejó su reino a los romanos, que hicieron de él la provincia de Asia."
    - "En 29 a. C. Augusto permitió a los griegos de Asia construir en Pérgamo un templo para él y para Roma. La ciudad era célebre también por su santuario de Asclepio, el dios sanador, y el médico Galeno nació aquí hacia el 129 d. C. El Apocalipsis dirige a Pérgamo la tercera de las siete cartas a las iglesias, «donde está la silla de Satanás», y nombra a Antipas, «mi testigo fiel, el cual ha sido muerto entre vosotros». Si la silla de Satanás significa el altar de Zeus, el culto al emperador o el lugar de la ciudad como sede del poder romano es discutido. La carta reprende también a los que tienen la doctrina de Balaam y de los nicolaítas."
    - "Eusebio registra que Carpo, Papilo y una mujer llamada Agatónice fueron martirizados en Pérgamo; algunos fechan su muerte en el reinado de Marco Aurelio y otros en el de Decio. En 262, dice la Historia Augusta, un terremoto golpeó con la mayor dureza las ciudades de Asia, y luego incursores godos devastaron la provincia; no nombra Pérgamo, pero la ciudad nunca recobró su esplendor atálida. La Basílica Roja, un enorme templo del siglo II a los dioses egipcios en la ciudad baja, tuvo más tarde una iglesia construida en su interior."
  pt:
    - "Pérgamo, a atual Bergama, ergue-se numa colina íngreme sobre o fértil vale do Caíco, no noroeste da Ásia Menor, a cerca de 25 km do Egeu. O exército grego de Xenofonte chegou a ela por volta de 400 a.C., mas sua ascensão veio depois de Alexandre. Lisímaco guardava um tesouro de nove mil talentos em sua cidadela, sob o eunuco Filetero, que rompeu com ele por volta de 282 a.C. e ficou com a cidade e o tesouro; seus herdeiros, os atálidas, fizeram dela um reino, e Átalo I tomou o título de rei depois de uma grande vitória sobre os gálatas."
    - "Os atálidas ficaram do lado de Roma. Êumenes II (197–159 a.C.) recebeu dos romanos as terras da Ásia Menor tomadas de Antíoco, o Grande, e Pérgamo foi adornada com templos, bibliotecas e o grande altar, geralmente datado de seu reinado. Plínio, seguindo Varrão, conta que o pergaminho foi inventado aqui quando o rei do Egito, com ciúme da biblioteca de Pérgamo, proibiu a exportação de papiro. Em 133 a.C. Átalo III morreu e deixou seu reino aos romanos, que fizeram dele a província da Ásia."
    - "Em 29 a.C., Augusto permitiu que os gregos da Ásia construíssem em Pérgamo um templo a ele e a Roma. A cidade era também famosa por seu santuário de Asclépio, o deus da cura, e o médico Galeno nasceu aqui por volta de 129 d.C. O Apocalipse dirige a Pérgamo a terceira das sete cartas às igrejas, “onde está o trono de Satanás”, e nomeia Antipas, “minha testemunha, meu servo fiel, que foi morto entre vocês”. Se o trono de Satanás significa o altar de Zeus, o culto ao imperador ou o lugar da cidade como sede do poder romano, é discutido. A carta também repreende os que se apegam ao ensino de Balaão e dos nicolaítas."
    - "Eusébio registra que Carpo, Papilo e uma mulher chamada Agatônice foram martirizados em Pérgamo; sua morte é datada por uns do reinado de Marco Aurélio e por outros do de Décio. Em 262, diz a História Augusta, um terremoto atingiu as cidades da Ásia mais que todas, e depois invasores godos devastaram a província; ela não nomeia Pérgamo, mas a cidade nunca recuperou o esplendor atálida. A Basílica Vermelha, enorme templo do século II dedicado a deuses egípcios na cidade baixa, teve depois uma igreja construída dentro dele."
  de:
    - "Pergamon, heute Bergama, liegt auf einem steilen Hügel über dem fruchtbaren Tal des Kaikos im Nordwesten Kleinasiens, etwa 25 km von der Ägäis. Xenophons griechisches Heer kam um 400 v. Chr. dorthin, doch sein Aufstieg begann nach Alexander. Lysimachos verwahrte in seiner Burg einen Schatz von neuntausend Talenten unter dem Eunuchen Philetairos, der um 282 v. Chr. mit ihm brach und Stadt und Schatz behielt; seine Erben, die Attaliden, machten sie zu einem Königreich, und Attalos I. nahm nach einem großen Sieg über die Galater den Königstitel an."
    - "Die Attaliden hielten zu Rom. Eumenes II. (197–159 v. Chr.) erhielt von den Römern die Länder Kleinasiens, die Antiochos dem Großen abgenommen worden waren, und Pergamon wurde mit Tempeln, Bibliotheken und dem großen Altar geschmückt, der meist in seine Regierungszeit datiert wird. Plinius berichtet nach Varro, hier sei das Pergament erfunden worden, als der König von Ägypten, neidisch auf Pergamons Bibliothek, die Papyrusausfuhr stoppte. Im Jahr 133 v. Chr. starb Attalos III. und vermachte sein Königreich den Römern, die daraus die Provinz Asia machten."
    - "Im Jahr 29 v. Chr. erlaubte Augustus den Griechen Asias, in Pergamon einen Tempel für ihn und Rom zu bauen. Die Stadt war auch berühmt für ihr Heiligtum des Asklepios, des Heilgottes, und der Arzt Galen wurde hier um 129 n. Chr. geboren. Die Offenbarung richtet den dritten der sieben Sendebriefe an Pergamon, „da des Satans Stuhl ist“, und nennt Antipas, „mein treuer Zeuge, bei euch getötet ist“. Ob des Satans Stuhl den Altar des Zeus, die Kaiserverehrung oder die Stellung der Stadt als Sitz römischer Macht meint, ist umstritten. Der Brief tadelt auch die, die an der Lehre Bileams und der Nikolaiten festhalten."
    - "Eusebius berichtet, dass Karpus, Papylos und eine Frau namens Agathonike in Pergamon als Märtyrer starben; ihr Tod wird von manchen in die Regierungszeit Mark Aurels, von anderen in die des Decius datiert. Im Jahr 262, so die Historia Augusta, traf ein Erdbeben die Städte Asias am schwersten, und gotische Plünderer verwüsteten dann die Provinz; Pergamon nennt sie nicht, doch die Stadt erlangte ihren attalidischen Glanz nie zurück. In die Rote Basilika, einen riesigen Tempel ägyptischer Götter des 2. Jahrhunderts in der Unterstadt, wurde später eine Kirche eingebaut."
  fr:
    - "Pergame, l’actuelle Bergama, se dresse sur une colline abrupte au-dessus de la fertile vallée du Caïque, dans le nord-ouest de l’Asie Mineure, à quelque 25 km de la mer Égée. L’armée grecque de Xénophon y vint vers 400 av. J.-C., mais son essor date d’Alexandre. Lysimaque gardait dans sa citadelle un trésor de neuf mille talents sous la garde de l’eunuque Philétaire, qui rompit avec lui vers 282 av. J.-C. et garda la ville et le trésor ; ses héritiers, les Attalides, en firent un royaume, et Attale Ier prit le titre de roi après une grande victoire sur les Galates."
    - "Les Attalides se rangèrent du côté de Rome. Eumène II (197–159 av. J.-C.) reçut des Romains les terres d’Asie Mineure enlevées à Antiochos le Grand, et Pergame fut ornée de temples, de bibliothèques et du grand autel, d’ordinaire daté de son règne. Pline, suivant Varron, raconte que le parchemin fut inventé ici quand le roi d’Égypte, jaloux de la bibliothèque de Pergame, arrêta l’exportation du papyrus. En 133 av. J.-C., Attale III mourut et légua son royaume aux Romains, qui en firent la province d’Asie."
    - "En 29 av. J.-C., Auguste permit aux Grecs d’Asie de bâtir à Pergame un temple pour lui et pour Rome. La ville était aussi célèbre par son sanctuaire d’Asclépios, le dieu guérisseur, et le médecin Galien y naquit vers 129 apr. J.-C. L’Apocalypse adresse à Pergame la troisième des sept Églises, « là est le trône de Satan », et nomme Antipas, « mon témoin fidèle, qui a été mis à mort chez vous ». Que le trône de Satan désigne l’autel de Zeus, le culte de l’empereur ou la place de la ville comme siège du pouvoir romain est disputé. La lettre blâme aussi ceux qui tiennent la doctrine de Balaam et des Nicolaïtes."
    - "Eusèbe rapporte que Carpus, Papylus et une femme nommée Agathonicé furent martyrisés à Pergame ; leur mort est datée par les uns du règne de Marc Aurèle, par d’autres de celui de Dèce. En 262, dit l’Histoire Auguste, un séisme frappa durement les villes d’Asie, puis des pillards goths ravagèrent la province ; elle ne nomme pas Pergame, mais la ville ne retrouva jamais sa splendeur attalide. La Basilique Rouge, immense temple du IIe siècle consacré à des dieux égyptiens dans la ville basse, reçut plus tard une église construite à l’intérieur."
