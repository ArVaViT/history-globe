body:
  en:
    - 'Philadelphia, today''s Alaşehir, lay in eastern Lydia at the foot of Mount Tmolus, above the valley of the Cogamis, a tributary of the Hermus, on the road from Sardis into Phrygia. It was founded in the second century BC by the Attalid kings of Pergamum and named after Attalus II Philadelphus, "the one who loves his brother"; some credit the founding to his brother Eumenes II, others to Attalus himself. With the rest of the Attalid kingdom it was bequeathed to Rome in 133 BC.'
    - "The city stood on the edge of the volcanic land the Greeks called the Burnt Country, and Strabo describes it as ever subject to earthquakes: its walls cracked day after day, so that few people lived in the city and most farmed the fertile countryside. The great earthquake of AD 17 struck Philadelphia among twelve cities of Asia, and Tiberius freed them from tribute for five years. For a time in the first century its coins call it Neocaesarea."
    - 'In Revelation the letter to Philadelphia, like that to Smyrna, has no rebuke. It opens: "These things saith he that is holy, he that is true, he that hath the key of David, he that openeth, and no man shutteth". The church is told: "I have set before thee an open door, and no man can shut it: for thou hast a little strength, and hast kept my word." To him that overcomes it promises: "Him that overcometh will I make a pillar in the temple of my God, and he shall go no more out".'
    - "Early in the second century, by the usual dating, Ignatius of Antioch passed through Philadelphia under guard on his way to Rome. Writing back from Troas, he reminded the church that while among them he had cried with a loud voice: give heed to the bishop, the presbyters and the deacons. The account of Polycarp's death calls him the twelfth martyr at Smyrna, counting those from Philadelphia, and an early writer against the Montanists, quoted by Eusebius, counts Ammia of Philadelphia among the true prophets of the new covenant."
  ru:
    - "Филадельфия, нынешний Алашехир, лежала на востоке Лидии у подножия горы Тмол, над долиной Когамиса, притока Герма, на дороге из Сардиса во Фригию. Её основали во II веке до н. э. пергамские цари Атталиды и назвали в честь Аттала II Филадельфа, «любящего брата»; одни приписывают основание его брату Евмену II, другие самому Атталу. Вместе со всем царством Атталидов она в 133 г. до н. э. была завещана Риму."
    - "Город стоял на краю вулканической земли, которую греки называли Выжженной страной, и Страбон пишет, что он всегда подвержен землетрясениям: стены его давали трещины день за днём, так что в самом городе жили немногие, а большинство обрабатывало плодородную округу. Великое землетрясение 17 г. н. э. поразило Филадельфию среди двенадцати городов Асии, и Тиберий на пять лет освободил их от податей. Какое-то время в I веке монеты города называют его Неокесарией."
    - "В Откровении послание к Филадельфии, как и к Смирне, не содержит обличения. Оно начинается словами: «так говорит Святый, Истинный, имеющий ключ Давидов, Который отворяет — и никто не затворит». Церкви сказано: «вот, Я отворил перед тобою дверь, и никто не может затворить ее; ты не много имеешь силы, и сохранил слово Мое». Побеждающему оно обещает: «Побеждающего сделаю столпом в храме Бога Моего, и он уже не выйдет вон»."
    - "В начале II века, по обычной датировке, Игнатий Антиохийский, которого под стражей везли в Рим, прошёл через Филадельфию. В письме из Троады он напомнил церкви, что, будучи у них, громко взывал: внимайте епископу, пресвитерам и диаконам. Рассказ о кончине Поликарпа называет его двенадцатым мучеником в Смирне, считая и тех, кто был из Филадельфии, а ранний противник монтанистов, которого приводит Евсевий, причисляет Аммию из Филадельфии к истинным пророкам Нового Завета."
  uk:
    - "Філадельфія, нинішній Алашехір, лежала на сході Лідії біля підніжжя гори Тмол, над долиною Когаміса, притоки Герма, на дорозі з Сард до Фрігії. Її заснували у II ст. до н. е. пергамські царі Атталіди й назвали на честь Аттала II Філадельфа, «того, хто любить брата»; одні приписують заснування його братові Евмену II, інші — самому Атталу. Разом з рештою царства Атталідів вона була заповідана Риму 133 р. до н. е."
    - "Місто стояло на краю вулканічної землі, яку греки називали Спаленим краєм, і Страбон описує його як таке, що постійно зазнає землетрусів: його мури щодня тріскалися, тому в місті жило мало людей, а більшість обробляла родючу округу. Великий землетрус 17 р. н. е. вразив Філадельфію серед дванадцяти міст Азії, і Тиверій звільнив їх від податків на п’ять років. Якийсь час у I ст. її монети називають її Неокесарією."
    - "В Одкровенні лист до Філадельфії, як і лист до Смирни, не містить докору. Він починається так: «Се глаголе Сьвятий, Правдивий, що має ключ Давидів, котрий відчиняє, і нїхто не зачинить». Церкві сказано: «ось дав я перед тобою незачинені двері, і нїхто не може зачинити їх; ти малу маєш силу, а схоронив моє слово». Тому, хто переможе, лист обіцяє: «Хто побідить, зроблю його стовпом в храмі Бога мого, і вже не вийде геть»."
    - "На початку II ст. за звичним датуванням Ігнатій Антіохійський проходив через Філадельфію під вартою на шляху до Риму. Пишучи до них із Троади, він нагадав церкві, що, перебуваючи серед них, кликав гучним голосом: дослухайтеся до єпископа, пресвітерів і дияконів. Розповідь про смерть Полікарпа називає його дванадцятим мучеником у Смирні, враховуючи тих, що з Філадельфії, а давній письменник проти монтаністів, якого цитує Євсевій, зараховує Аммію з Філадельфії до справжніх пророків нового завіту."
  es:
    - "Filadelfia, la actual Alaşehir, estaba en el este de Lidia, al pie del monte Tmolo, sobre el valle del Cogamis, afluente del Hermo, en el camino de Sardis a Frigia. Fue fundada en el siglo II a. C. por los reyes atálidas de Pérgamo y llamada así por Átalo II Filadelfo, «el que ama a su hermano»; unos atribuyen la fundación a su hermano Eumenes II, otros al propio Átalo. Con el resto del reino atálida fue legada a Roma en 133 a. C."
    - "La ciudad estaba en el borde de la tierra volcánica que los griegos llamaban el País Quemado, y Estrabón la describe como sujeta siempre a terremotos: sus muros se agrietaban día tras día, de modo que poca gente vivía en la ciudad y la mayoría cultivaba el fértil campo. El gran terremoto del 17 d. C. golpeó Filadelfia entre doce ciudades de Asia, y Tiberio las eximió de tributo durante cinco años. Durante un tiempo en el siglo I sus monedas la llaman Neocesarea."
    - "En el Apocalipsis la carta a Filadelfia, como la de Esmirna, no contiene reproche. Comienza: «Estas cosas dice el Santo, el Verdadero, el que tiene la llave de David, el que abre y ninguno cierra». A la iglesia se le dice: «he dado una puerta abierta delante de ti, la cual ninguno puede cerrar; porque tienes un poco de potencia, y has guardado mi palabra». Al que venza le promete: «Al que venciere, yo lo haré columna en el templo de mi Dios, y nunca más saldrá fuera»."
    - "A principios del siglo II, según la datación habitual, Ignacio de Antioquía pasó por Filadelfia bajo custodia camino de Roma. Escribiendo de vuelta desde Troas, recordó a la iglesia que, mientras estuvo entre ellos, había clamado en voz alta: prestad atención al obispo, a los presbíteros y a los diáconos. El relato de la muerte de Policarpo lo llama el duodécimo mártir de Esmirna, contando a los de Filadelfia, y un escritor antiguo contra los montanistas, citado por Eusebio, cuenta a Ammia de Filadelfia entre los verdaderos profetas del nuevo pacto."
  pt:
    - "Filadélfia, a atual Alaşehir, ficava no leste da Lídia, ao pé do Monte Tmolo, acima do vale do Cogamis, afluente do Hermo, na estrada de Sardes para a Frígia. Foi fundada no século II a.C. pelos reis atálidas de Pérgamo e recebeu o nome de Átalo II Filadelfo, “o que ama seu irmão”; alguns atribuem a fundação a seu irmão Êumenes II, outros ao próprio Átalo. Com o resto do reino atálida foi legada a Roma em 133 a.C."
    - "A cidade ficava na orla da terra vulcânica que os gregos chamavam País Queimado, e Estrabão a descreve como sempre sujeita a terremotos: suas muralhas rachavam dia após dia, de modo que poucas pessoas viviam na cidade e a maioria cultivava o fértil campo. O grande terremoto de 17 d.C. atingiu Filadélfia entre doze cidades da Ásia, e Tibério as isentou de tributo por cinco anos. Por algum tempo, no século I, suas moedas a chamam Neocesareia."
    - "No Apocalipse, a carta a Filadélfia, como a de Esmirna, não traz repreensão. Abre assim: “Aquele que é santo, aquele que é verdadeiro, aquele que tem a chave de Davi, aquele que abre e ninguém pode fechar”. À igreja se diz: “coloquei diante de você uma porta aberta, a qual ninguém pode fechar”, pois ela tem “pouca força, mas guardou a minha palavra”. Ao que vence, promete: “Àquele que vencer, eu o farei coluna no templo do meu Deus, e dali ele jamais sairá”."
    - "No início do século II, pela datação habitual, Inácio de Antioquia passou por Filadélfia sob guarda a caminho de Roma. Escrevendo de volta de Trôade, lembrou à igreja que, entre eles, havia clamado em alta voz: deem atenção ao bispo, aos presbíteros e aos diáconos. O relato da morte de Policarpo o chama de décimo segundo mártir em Esmirna, contando os de Filadélfia, e um escritor antigo contra os montanistas, citado por Eusébio, conta Âmia de Filadélfia entre os verdadeiros profetas da nova aliança."
  de:
    - "Philadelphia, das heutige Alaşehir, lag im östlichen Lydien am Fuß des Tmolos, über dem Tal des Kogamis, eines Nebenflusses des Hermos, an der Straße von Sardes nach Phrygien. Es wurde im 2. Jahrhundert v. Chr. von den Attaliden-Königen von Pergamon gegründet und nach Attalos II. Philadelphos, „dem, der seinen Bruder liebt“, benannt; manche schreiben die Gründung seinem Bruder Eumenes II. zu, andere Attalos selbst. Mit dem übrigen Attalidenreich wurde es 133 v. Chr. Rom vermacht."
    - "Die Stadt lag am Rand des vulkanischen Landes, das die Griechen das Verbrannte Land nannten, und Strabon beschreibt sie als ständig von Erdbeben heimgesucht: Ihre Mauern rissen Tag um Tag, sodass nur wenige Menschen in der Stadt wohnten und die meisten das fruchtbare Umland bestellten. Das große Erdbeben des Jahres 17 n. Chr. traf Philadelphia unter zwölf Städten Asias, und Tiberius befreite sie fünf Jahre von Abgaben. Eine Zeitlang im 1. Jahrhundert nennen ihre Münzen sie Neokaisareia."
    - "In der Offenbarung enthält der Brief an Philadelphia, wie der an Smyrna, keinen Tadel. Er beginnt: „Das sagt der Heilige, der Wahrhaftige, der da hat den Schlüssel Davids, der auftut, und niemand schließt zu“. Der Gemeinde wird gesagt: „Siehe, ich habe vor dir gegeben eine offene Tür, und niemand kann sie zuschließen; denn du hast eine kleine Kraft, und hast mein Wort behalten.“ Dem, der überwindet, verheißt er: „den will ich machen zum Pfeiler in dem Tempel meines Gottes, und er soll nicht mehr hinausgehen“."
    - "Im frühen 2. Jahrhundert, nach der üblichen Datierung, kam Ignatius von Antiochia unter Bewachung auf dem Weg nach Rom durch Philadelphia. Aus Troas zurückschreibend erinnerte er die Gemeinde daran, dass er bei ihnen mit lauter Stimme gerufen hatte: Haltet euch an den Bischof, die Presbyter und die Diakone. Der Bericht über Polykarps Tod nennt ihn den zwölften Märtyrer in Smyrna, die aus Philadelphia mitgezählt, und ein frühchristlicher Schriftsteller gegen die Montanisten, den Eusebius zitiert, zählt Ammia von Philadelphia zu den wahren Propheten des neuen Bundes."
  fr:
    - "Philadelphie, l’actuelle Alaşehir, se trouvait dans l’est de la Lydie au pied du mont Tmolos, au-dessus de la vallée du Cogamis, affluent de l’Hermos, sur la route de Sardes vers la Phrygie. Elle fut fondée au IIe siècle av. J.-C. par les rois attalides de Pergame et nommée d’après Attale II Philadelphe, « celui qui aime son frère » ; certains attribuent la fondation à son frère Eumène II, d’autres à Attale lui-même. Avec le reste du royaume attalide, elle fut léguée à Rome en 133 av. J.-C."
    - "La ville se dressait au bord de la terre volcanique que les Grecs appelaient le Pays brûlé, et Strabon la décrit comme sans cesse sujette aux séismes : ses murs se fissuraient jour après jour, si bien que peu de gens vivaient dans la ville et que la plupart cultivaient la campagne fertile. Le grand séisme de 17 apr. J.-C. frappa Philadelphie parmi douze villes d’Asie, et Tibère les exempta de tribut pendant cinq ans. Un temps, au Ier siècle, ses monnaies l’appellent Néocésarée."
    - "Dans l’Apocalypse, la lettre à Philadelphie, comme celle à Smyrne, ne contient aucun reproche. Elle s’ouvre ainsi : « Voici ce que dit le Saint, le Véritable, celui qui a la clef de David, celui qui ouvre, et personne ne fermera ». On dit à l’Église : « parce que tu as peu de puissance, et que tu as gardé ma parole … j’ai mis devant toi une porte ouverte, que personne ne peut fermer ». À qui vaincra, elle promet : « Celui qui vaincra, je ferai de lui une colonne dans le temple de mon Dieu, et il n’en sortira plus »."
    - "Au début du IIe siècle, selon la datation habituelle, Ignace d’Antioche traversa Philadelphie sous escorte en route vers Rome. Écrivant de Troas, il rappela à l’Église que, parmi eux, il avait crié à haute voix : soyez attentifs à l’évêque, aux presbytres et aux diacres. Le récit de la mort de Polycarpe l’appelle le douzième martyr de Smyrne, en comptant ceux de Philadelphie, et un ancien écrivain contre les montanistes, cité par Eusèbe, range Ammia de Philadelphie parmi les vrais prophètes de la nouvelle alliance."
  it:
    - "Filadelfia, l’odierna Alaşehir, sorgeva nella Lidia orientale ai piedi del monte Tmolo, sopra la valle del Cogamo, affluente dell’Ermo, sulla strada da Sardi verso la Frigia. Fu fondata nel II secolo a.C. dai re attalidi di Pergamo e prese il nome da Attalo II Filadelfo, «colui che ama il fratello»; alcuni attribuiscono la fondazione a suo fratello Eumene II, altri ad Attalo stesso. Con il resto del regno attalide fu lasciata in eredità a Roma nel 133 a.C."
    - "La città sorgeva ai margini della terra vulcanica che i Greci chiamavano la Terra Bruciata, e Strabone la descrive come sempre soggetta a terremoti: le sue mura si crepavano giorno dopo giorno, così che poche persone vivevano in città e la maggior parte coltivava la fertile campagna. Il grande terremoto del 17 d.C. colpì Filadelfia tra dodici città d’Asia, e Tiberio le esentò dai tributi per cinque anni. Per un certo tempo nel I secolo le sue monete la chiamano Neocesarea."
    - "Nell’Apocalisse la lettera a Filadelfia, come quella a Smirne, non ha rimproveri. Si apre così: «Queste cose dice il santo, il verace, colui che ha la chiave di Davide, colui che apre e nessuno chiude». Alla chiesa è detto: «Ecco, io ti ho posta dinanzi una porta aperta, che nessuno può chiudere, perché, pur avendo poca forza, hai serbata la mia parola». A chi vince promette: «Chi vince io lo farò una colonna nel tempio del mio Dio, ed egli non ne uscirà mai più»."
    - "All’inizio del II secolo, secondo la datazione abituale, Ignazio di Antiochia passò per Filadelfia sotto scorta diretto a Roma. Scrivendo da Troade, ricordò alla chiesa che mentre era tra loro aveva gridato a gran voce: state attenti al vescovo, ai presbiteri e ai diaconi. Il racconto della morte di Policarpo lo dice il dodicesimo martire a Smirne, contando quelli di Filadelfia, e un antico scrittore contro i Montanisti, citato da Eusebio, annovera Ammia di Filadelfia tra i veri profeti della nuova alleanza."
  pl:
    - "Filadelfia, dzisiejsze Alaşehir, leżała we wschodniej Lidii u stóp góry Tmolos, nad doliną Kogamisu, dopływu Hermosu, na drodze z Sardes do Frygii. Założyli ją w II wieku p.n.e. królowie attalidzcy z Pergamonu i nazwali na cześć Attalosa II Filadelfosa, „tego, który kocha swego brata”; niektórzy przypisują założenie jego bratu Eumenesowi II, inni samemu Attalosowi. Wraz z resztą królestwa Attalidów została zapisana Rzymowi w 133 roku p.n.e."
    - "Miasto leżało na skraju wulkanicznej krainy, którą Grecy nazywali Krainą Spaloną, a Strabon opisuje je jako stale narażone na trzęsienia ziemi: jego mury pękały dzień po dniu, tak że niewielu ludzi mieszkało w mieście, a większość uprawiała żyzną wieś. Wielkie trzęsienie ziemi w 17 roku n.e. dotknęło Filadelfię wśród dwunastu miast Azji, a Tyberiusz zwolnił je z trybutu na pięć lat. Przez pewien czas w I wieku jej monety nazywają ją Neocezareą."
    - "W Apokalipsie list do Filadelfii, podobnie jak do Smyrny, nie zawiera nagany. Zaczyna się: „To mówi on Święty i Prawdziwy, który ma klucz Dawidowy, który otwiera, a nikt nie zawiera”. Kościołowi powiedziano: „otom wystawił przed tobą drzwi otworzone, a żaden nie może ich zamknąć; bo acz masz niewielką moc, przecięś zachował słowo moje”. Zwycięzcy obiecuje filar w Świątyni: „Kto zwycięży, uczynię go filarem w kościele Boga mojego, a więcej z niego już nie wynijdzie”."
    - "Na początku II wieku, według zwykłego datowania, Ignacy Antiocheński przeszedł przez Filadelfię pod strażą w drodze do Rzymu. Pisząc stamtąd z Troady, przypomniał kościołowi, że będąc wśród nich wołał donośnym głosem: słuchajcie biskupa, prezbiterów i diakonów. Opis śmierci Polikarpa nazywa go dwunastym męczennikiem w Smyrnie, licząc tych z Filadelfii, a dawny pisarz przeciw montanistom, cytowany przez Euzebiusza, zalicza Ammię z Filadelfii do prawdziwych proroków nowego przymierza."
  cs:
    - "Filadelfie, dnešní Alašehir, ležela ve východní Lýdii na úpatí hory Tmólos, nad údolím Kogamis, přítoku Hermu, na cestě ze Sard do Frygie. Založili ji ve 2. století př. n. l. attalovští králové Pergamu a pojmenovali ji po Attalovi II. Filadelfovi, „tom, kdo miluje svého bratra“; někteří zakladatelství připisují jeho bratru Eumenovi II., jiní samotnému Attalovi. Spolu se zbytkem attalovského království byla roku 133 př. n. l. odkázána Římu."
    - "Město stálo na okraji sopečné země, kterou Řekové zvali Spálená země, a Strabón je popisuje jako stále vystavené zemětřesením: jeho hradby praskaly den za dnem, takže ve městě bydlelo málo lidí a většina obdělávala úrodné okolí. Velké zemětřesení roku 17 n. l. postihlo Filadelfii mezi dvanácti městy Asie a Tiberius je na pět let osvobodil od daní. Po nějaký čas v 1. století ji její mince nazývají Neokaisareia."
    - "Ve Zjevení nemá list do Filadelfie, stejně jako list do Smyrny, žádné kárání. Začíná: „Totoť praví ten svatý a pravý, jenž má klíč Davidův, kterýžto otvírá, a žádný nezavírá“. Církvi se říká: „postavil jsem před tebou dveře otevřené, a žádnýť jich nemůže zavříti. Nebo máš ač nevelikou moc, a ostříhal jsi slova mého.“ Vítězi slibuje: „Kdo zvítězí, učiním jej sloupem v chrámě Boha svého, a nevyjdeť již více ven“."
    - "Na počátku 2. století, podle obvyklého datování, procházel Filadelfií Ignatius Antiochijský pod stráží na cestě do Říma. Když psal zpět z Troady, připomněl církvi, že mezi nimi volal velkým hlasem: dbejte biskupa, presbyterů a jáhnů. Vyprávění o Polykarpově smrti jej nazývá dvanáctým mučedníkem ve Smyrně, počítajíc i ty z Filadelfie, a raný spisovatel proti montanistům, citovaný Eusebiem, počítá Ammii z Filadelfie mezi pravé proroky nové smlouvy."
  nl:
    - "Filadelfia, het huidige Alaşehir, lag in het oosten van Lydië aan de voet van de Tmolos, boven de vallei van de Kogamis, een zijrivier van de Hermos, aan de weg van Sardes naar Frygië. Het werd in de 2e eeuw v.Chr. gesticht door de Attalidische koningen van Pergamon en genoemd naar Attalus II Philadelphus, “hij die zijn broer liefheeft”; sommigen schrijven de stichting toe aan zijn broer Eumenes II, anderen aan Attalus zelf. Met de rest van het Attalidische koninkrijk werd het in 133 v.Chr. aan Rome nagelaten."
    - "De stad lag aan de rand van het vulkanische land dat de Grieken het Verbrande Land noemden, en Strabo beschrijft haar als voortdurend aan aardbevingen onderhevig: haar muren scheurden dag na dag, zodat weinig mensen in de stad woonden en de meesten het vruchtbare platteland bewerkten. De grote aardbeving van 17 n.Chr. trof Filadelfia onder twaalf steden van Asia, en Tiberius ontsloeg hen vijf jaar van belasting. Een tijd lang in de 1e eeuw noemen haar munten haar Neocaesarea."
    - "In Openbaring bevat de brief aan Filadelfia, net als die aan Smyrna, geen berisping. Hij opent: “Dit zegt de Heilige, de Waarachtige, Die den sleutel Davids heeft; Die opent, en niemand sluit”. Aan de gemeente wordt gezegd: “Ik heb een geopende deur voor u gegeven, en niemand kan die sluiten; want gij hebt kleine kracht, en gij hebt Mijn woord bewaard.” Wie overwint, belooft de brief: “Die overwint, Ik zal hem maken tot een pilaar in den tempel Mijns Gods, en hij zal niet meer daaruit gaan”."
    - "Begin 2e eeuw, volgens de gangbare datering, kwam Ignatius van Antiochië onder bewaking door Filadelfia op weg naar Rome. Vanuit Troas schreef hij terug dat hij onder hen met luide stem had geroepen: let op de bisschop, de presbyters en de diakenen. Het verslag van Polycarpus’ dood noemt hem de twaalfde martelaar te Smyrna, de Filadelfianen meegeteld, en een vroege schrijver tegen de Montanisten, door Eusebius aangehaald, rekent Ammia van Filadelfia onder de ware profeten van het nieuwe verbond."
  sv:
    - "Filadelfia, i dag Alaşehir, låg i östra Lydien vid foten av berget Tmolos, ovanför dalen kring Kogamis, en biflod till Hermos, på vägen från Sardes in i Frygien. Det grundades på 100-talet f.Kr. av attalidiska kungar av Pergamon och uppkallades efter Attalos II Filadelfos, ”den som älskar sin bror”; vissa tillskriver grundandet hans bror Eumenes II, andra Attalos själv. Med resten av det attalidiska riket testamenterades det till Rom 133 f.Kr."
    - "Staden låg i utkanten av det vulkaniska landet som grekerna kallade Brända landet, och Strabon beskriver den som ständigt utsatt för jordbävningar: dess murar sprack dag efter dag, så att få människor bodde i staden och de flesta brukade den bördiga landsbygden. Den stora jordbävningen år 17 e.Kr. drabbade Filadelfia bland tolv städer i Asien, och Tiberius befriade dem från skatt i fem år. En tid under första århundradet kallar dess mynt den Neokaisareia."
    - "I Uppenbarelseboken har brevet till Filadelfia, liksom det till Smyrna, ingen tillrättavisning. Det inleds: ”Så säger den Helige, den Sannfärdige, han som har ’Davids nyckel’, han som ’upplåter, och ingen kan tillsluta’”. Församlingen får höra: ”Se, jag har låtit dig finna en öppen dörr, som ingen kan tillsluta. Ty väl är din kraft ringa, men du har tagit vara på mitt ord.” Åt den som vinner seger lovas: ”Den som vinner seger, honom skall jag göra till en pelare i min Guds tempel, och han skall aldrig mer lämna det.”"
    - "Tidigt på 100-talet, enligt den vanliga dateringen, passerade Ignatios av Antiochia Filadelfia under bevakning på väg till Rom. I ett brev från Troas påminde han församlingen om att han bland dem hade ropat med hög röst: ge akt på biskopen, presbytrarna och diakonerna. Berättelsen om Polykarpos död kallar honom den tolfte martyren i Smyrna, de från Filadelfia inräknade, och en tidig skribent mot montanisterna, citerad av Eusebios, räknar Ammia från Filadelfia bland det nya förbundets sanna profeter."
  nb:
    - "Filadelfia, dagens Alaşehir, lå i østlige Lydia ved foten av Tmolos, over Kogamis-dalen, en sideelv til Hermos, på veien fra Sardes inn i Frygia. Den ble grunnlagt på 100-tallet f.Kr. av de attalidiske kongene av Pergamon og oppkalt etter Attalos II Filadelfos, «han som elsker sin bror»; noen tilskriver grunnleggelsen hans bror Eumenes II, andre Attalos selv. Sammen med resten av det attalidiske kongeriket ble den testamentert til Roma i 133 f.Kr."
    - "Byen lå ved kanten av det vulkanske landet grekerne kalte Det brente landet, og Strabon beskriver den som stadig utsatt for jordskjelv: murene slo sprekker dag etter dag, slik at få bodde i byen og de fleste drev jordbruk på det fruktbare landet omkring. Det store jordskjelvet i 17 e.Kr. rammet Filadelfia blant tolv byer i Asia, og Tiberius fritok dem for skatt i fem år. En tid i det første århundre kaller mynter den Neocæsarea."
    - "I Johannes' åpenbaring har brevet til Filadelfia, som brevet til Smyrna, ingen irettesettelse. Det åpner: «Dette sier den Hellige, den Sanndrue, han som har Davids nøkkel, han som lukker op, og ingen lukker til». Menigheten får høre: «jeg har satt foran dig en åpnet dør, og ingen kan lukke den til; for du har liten styrke, og har dog tatt vare på mitt ord». Til den som seirer lover det: «Den som seirer, ham vil jeg gjøre til en støtte i min Guds tempel, og han skal aldri mere gå ut derfra»."
    - "Tidlig på 100-tallet, etter den vanlige dateringen, kom Ignatius av Antiokia under bevoktning gjennom Filadelfia på vei til Roma. I et brev skrevet tilbake fra Troas minnet han menigheten om at han mens han var hos dem hadde ropt med høy røst: lyt til biskopen, presbyterne og diakonene. Beretningen om Polykarps død kaller ham den tolvte martyr i Smyrna, når de fra Filadelfia regnes med, og en tidlig forfatter mot montanistene, sitert av Eusebius, regner Ammia fra Filadelfia blant den nye pakts sanne profeter."
  tl:
    - "Ang Filadelfia, ang Alaşehir ngayon, ay nasa silangang Lidia sa paanan ng Bundok Tmolus, sa itaas ng libis ng Cogamis, isang sanga ng Hermus, sa daan mula Sardis patungong Frigia. Itinatag ito noong ika-2 siglo BK ng mga haring Atalida ng Pergamo at pinangalanan kay Atalo II Philadelphus, “ang umiibig sa kaniyang kapatid”; iniuugnay ng ilan ang pagtatatag sa kaniyang kapatid na si Eumenes II, ng iba naman kay Atalo mismo. Kasama ng iba pang bahagi ng kaharian ng mga Atalida, ipinamana ito sa Roma noong 133 BK."
    - "Nakatayo ang lungsod sa gilid ng lupaing bulkaniko na tinawag ng mga Griyego na Lupaing Sunog, at inilalarawan ito ni Strabo na laging napapailalim sa mga lindol: nagbibitak ang mga pader nito araw-araw, kaya kakaunti ang nakatira sa lungsod at karamihan ay nagsasaka sa matabang kanayunan. Tinamaan ng malaking lindol noong AD 17 ang Filadelfia sa labindalawang lungsod ng Asia, at pinalaya sila ni Tiberio sa tributo sa loob ng limang taon. Sa loob ng ilang panahon noong unang siglo, Neocesarea ang tawag dito ng mga barya nito."
    - "Sa Apocalipsis, ang liham sa Filadelfia, gaya ng sa Smirna, ay walang pagsaway. Nagsisimula ito: “Ang mga bagay na ito ay sinasabi ng banal, niyaong totoo, niyaong may susi ni David, niyaong nagbubukas at di mailalapat ng sinoman”. Sinasabi sa iglesia: “inilagay ko sa harapan mo ang isang pintuang bukas, na di mailalapat ng sinoman … na ikaw ay may kaunting kapangyarihan, at tinupad mo ang aking salita”. Sa magtatagumpay ay ipinangangako: “Ang magtagumpay, ay gagawin kong haligi sa templo ng aking Dios, at hindi na siya'y lalabas pa doon”."
    - "Sa unang bahagi ng ika-2 siglo, ayon sa karaniwang pagpepetsa, si Ignacio ng Antioquia ay dumaan sa Filadelfia sa ilalim ng bantay patungong Roma. Sa pagsulat pabalik mula sa Troas, ipinaalala niya sa iglesia na habang kasama nila ay sumigaw siya nang malakas: makinig sa obispo, sa mga presbitero at sa mga diakono. Tinatawag siya ng salaysay ng kamatayan ni Policarpo na ikalabindalawang martir sa Smirna, kasama ang mga mula sa Filadelfia, at isang sinaunang manunulat laban sa mga Montanista, na sinipi ni Eusebio, ay nagbibilang kay Ammia ng Filadelfia sa mga tunay na propeta ng bagong tipan."
  da:
    - "Filadelfia, nutidens Alaşehir, lå i det østlige Lydien ved foden af Tmolos, over Kogamis' dal, en biflod til Hermos, på vejen fra Sardes ind i Frygien. Den blev grundlagt i 100-tallet f.Kr. af attalidekongerne af Pergamon og opkaldt efter Attalos 2. Filadelfos, »den, der elsker sin broder«; nogle tilskriver grundlæggelsen hans bror Eumenes 2., andre Attalos selv. Sammen med resten af attalidernes rige blev den testamenteret til Rom i 133 f.Kr."
    - "Byen lå i udkanten af det vulkanske land, grækerne kaldte Den Brændte Egn, og Strabon beskriver den som stadig udsat for jordskælv: dens mure revnede dag efter dag, så få mennesker boede i byen og de fleste dyrkede det frugtbare opland. Det store jordskælv i 17 e.Kr. ramte Filadelfia blandt tolv af Asiens byer, og Tiberius fritog dem for skat i fem år. En tid i 1. århundrede kalder dens mønter den Neokaisareia."
    - "I Åbenbaringen har brevet til Filadelfia ligesom brevet til Smyrna ingen irettesættelse. Det begynder: »Dette siger den hellige, den sanddru, han, som har Davids Nøgle, han, som lukker op, saa ingen lukker i«. Menigheden får at vide: »der foran dig er en aabnet Dør, som ingen kan lukke; thi du har kun liden Kraft, og dog har du bevaret mit Ord«. Den, der sejrer, lover det: »ham vil jeg gøre til en Søjle i min Guds Tempel, og han skal ikke mere gaa ud derfra«."
    - "I begyndelsen af 100-tallet, efter den sædvanlige datering, passerede Ignatius af Antiokia Filadelfia under bevogtning på vej til Rom. I et brev fra Troas mindede han menigheden om, at han, mens han var blandt dem, havde råbt med høj røst: hold jer til biskoppen, presbyterne og diakonerne. Beretningen om Polykarps død kalder ham den tolvte martyr i Smyrna, når man regner dem fra Filadelfia med, og en tidlig forfatter imod montanisterne, citeret af Eusebios, regner Ammia fra Filadelfia blandt den nye pagts sande profeter."
  sr:
    - "Филаделфија, данашњи Алашехир, лежала је у источној Лидији у подножју планине Тмол, изнад долине Когамиса, притоке Херма, на путу из Сарда у Фригију. Основали су је у 2. веку п. н. е. аталидски цареви Пергама и назвали по Аталу II Филаделфу, „оном који воли брата“; неки оснивање приписују његовом брату Еумену II, други самом Аталу. С осталим аталидским краљевством оставили су је Риму у наслеђе 133. п. н. е."
    - "Град је стајао на ободу вулканске земље коју су Грци звали Спаљена земља, а Страбон га описује као вечито изложеног земљотресима: зидови су му пуцали из дана у дан, па је у граду живело мало људи, а већина је обрађивала плодну околину. Велики земљотрес 17. н. е. погодио је Филаделфију међу дванаест градова Азије, а Тиверије их је ослободио данка на пет година. Једно време у 1. веку њен новац је зове Неоцезареја."
    - "У Откривењу посланица Филаделфији, као и она Смирни, нема прекора. Започиње: „Тако говори Свети и Истинити, који има кључ Давидов, који отвори и нико не затвори, који затвори и нико не отвори.“ Цркви се каже: „гле, дадох пред тобом врата отворена, и нико их не може затворити; јер имаш мало силе, и држао си моју реч.“ Ономе који победи обећава: „Који победи учинићу га стубом у цркви Бога свог, и више неће изићи напоље.“"
    - "Почетком 2. века, по уобичајеном датирању, Игњатије Антиохијски је под стражом прошао кроз Филаделфију на путу у Рим. Пишући одатле из Троаде, подсетио је цркву да је међу њима вапио јаким гласом: пазите на епископа, презвитере и ђаконе. Извештај о Поликарповој смрти назива га дванаестим мучеником у Смирни, рачунајући и оне из Филаделфије, а рани писац против монтаниста, кога цитира Јевсевије, убраја Амију из Филаделфије међу праве пророке новог завета."
  hu:
    - "Filadelfia, a mai Alaşehir, Lüdia keleti részén feküdt a Tmólosz-hegy lábánál, a Hermosz mellékfolyója, a Kogamisz völgye fölött, a Szárdiszból Frígiába vezető úton. A pergamoni Attalida királyok alapították a Kr. e. 2. században, és II. Attalosz Philadelphoszról nevezték el, „aki testvérét szereti”; egyesek az alapítást testvérének, II. Eumenésznek, mások magának Attaloszának tulajdonítják. A többi Attalida királysággal együtt Kr. e. 133-ban Rómára hagyták."
    - "A város azon a vulkanikus földön állt, amelyet a görögök Égett országnak neveztek, és Sztrabón úgy írja le, mint amely folyton földrengéseknek van kitéve: falai napról napra repedeztek, így kevesen laktak a városban, és a többség a termékeny vidéken gazdálkodott. A Kr. u. 17-es nagy földrengés Filadelfiát Ázsia tizenkét városa között sújtotta, és Tiberius öt évre felmentette őket az adó alól. Az 1. században egy ideig érméin Neokaiszareiának nevezi magát."
    - "A Jelenések könyvében a filadelfiai levél, mint a szmürnai, nem tartalmaz feddést. Így kezdődik: „Ezt mondja a Szent, az Igaz, a kinél a Dávid kulcsa van, a ki megnyitja és senki be nem zárja”. Az egyháznak ezt mondják: „ímé adtam elődbe egy nyitott ajtót, a melyet senki be nem zárhat”, mert „kevés erőd van, és megtartottad az én beszédemet”. A győzőnek ezt ígéri: „A ki győz, oszloppá teszem azt az én Istenemnek templomában, és többé onnét ki nem jő”."
    - "A 2. század elején, a szokásos keltezés szerint, Antiochiai Ignác őrizet alatt, Róma felé tartva átment Filadelfián. Troászból visszaírva emlékeztette az egyházat, hogy amíg köztük volt, hangos szóval kiáltotta: ügyeljetek a püspökre, a presbiterekre és a diakónusokra. Polükarposz vértanúságának elbeszélése a tizenkettedik szmürnai vértanúnak nevezi, a filadelfiaiakat is beleszámítva, a montanisták ellen író korai szerző pedig, akit Euszebiosz idéz, a filadelfiai Ammiát az új szövetség igaz prófétái közé sorolja."
  fi:
    - "Filadelfia, nykyinen Alaşehir, sijaitsi Itä-Lyydiassa Tmolos-vuoren juurella Hermoksen sivujoen Kogamiksen laakson yläpuolella, Sardeksesta Fryygiaan johtavan tien varrella. Pergamonin attalidikuninkaat perustivat sen 100-luvulla eaa. ja nimesivät sen Attalos II Filadelfoksen, ”veljeään rakastavan”, mukaan; jotkut lukevat perustamisen hänen veljensä Eumenes II:n ansioksi, toiset Attalokselle itselleen. Muun attalidien valtakunnan mukana se testamentattiin Roomalle vuonna 133 eaa."
    - "Kaupunki sijaitsi kreikkalaisten Poltetuksi maaksi kutsuman tulivuorimaan reunalla, ja Strabon kuvaa sen olevan jatkuvasti alttiina maanjäristyksille: sen muurit halkesivat päivä päivältä, joten harvat asuivat kaupungissa ja useimmat viljelivät hedelmällistä maaseutua. Vuoden 17 jaa. suuri maanjäristys iski Filadelfiaan Aasian kahdentoista kaupungin joukossa, ja Tiberius vapautti ne verosta viideksi vuodeksi. Jonkin aikaa 1. vuosisadalla sen kolikot kutsuvat sitä Neokaisareiaksi."
    - "Ilmestyskirjassa Filadelfiaan osoitetussa kirjeessä, Smyrnan kirjeen tavoin, ei ole nuhdetta. Se alkaa: ”Näin sanoo Pyhä, Totinen, jolla on Daavidin avain, hän, joka avaa, eikä kukaan sulje”. Seurakunnalle sanotaan: ”minä olen avannut sinun eteesi oven, eikä kukaan voi sitä sulkea; sillä tosin on sinun voimasi vähäinen, mutta sinä olet ottanut vaarin minun sanastani”. Voittajalle kirje lupaa: ”Joka voittaa, sen minä teen pylvääksi Jumalani temppeliin, eikä hän koskaan enää lähde sieltä ulos”."
    - "Tavanomaisen ajoituksen mukaan 100-luvun alussa Antiokian Ignatios kulki Filadelfian läpi vartioituna matkalla Roomaan. Troasista takaisin kirjoittaessaan hän muistutti seurakuntaa, että oleskellessaan heidän parissaan hän oli huutanut kovalla äänellä: kuunnelkaa piispaa, presbyteereitä ja diakoneja. Polykarpoksen kuolemaa koskeva kertomus kutsuu häntä Smyrnan kahdennentoista marttyyriksi Filadelfiasta tulleet mukaan lukien, ja varhainen montanolaisia vastaan kirjoittanut, Eusebioksen lainaama kirjoittaja laskee Filadelfian Ammian uuden liiton todellisten profeettojen joukkoon."
  vi:
    - "Phi-la-đen-phi, nay là Alaşehir, nằm ở đông Lydia dưới chân núi Tmolus, phía trên thung lũng Cogamis, một nhánh của sông Hermus, trên đường từ Sạt-đe vào Phi-ri-gi. Thành được các vua triều Attalos của Bẹt-găm lập vào thế kỷ 2 TCN và đặt tên theo Attalus II Philadelphus, “người yêu anh em mình”; một số người cho công lập thành thuộc về anh ông là Eumenes II, số khác cho chính Attalus. Cùng phần còn lại của vương quốc Attalos, nó được để lại cho Rô-ma năm 133 TCN."
    - "Thành nằm ở rìa vùng đất núi lửa mà người Hy Lạp gọi là Xứ Cháy, và Strabo mô tả nó thường xuyên bị động đất: tường thành nứt hết ngày này sang ngày khác, nên ít người sống trong thành và đa số làm ruộng ở vùng quê phì nhiêu. Trận động đất lớn năm 17 đã giáng xuống Phi-la-đen-phi cùng mười một thành khác của A-si, và Ti-be-rơ miễn thuế cho họ năm năm. Một thời gian trong thế kỷ 1, tiền của thành gọi nó là Neocaesarea."
    - "Trong sách Khải Huyền, bức thư gửi Phi-la-đen-phi, như thư gửi Si-miệc-nơ, không có lời quở trách. Thư mở đầu: “Nầy là lời phán của Đấng thánh, chân thật, là Đấng có chìa khóa của Đa-vít, mở thì không ai đóng được”. Hội thánh được bảo: “ta đã mở trước mặt ngươi một cái cửa không ai đóng được; vì ngươi có ít năng lực, mà đã giữ đạo ta”. Với người thắng, thư hứa: “Kẻ nào thắng, ta sẽ cho làm trụ trong đền Đức Chúa Trời ta, và người sẽ không ra khỏi đó nữa”."
    - "Đầu thế kỷ 2, theo niên đại thông thường, Ignatius thành An-ti-ốt đi qua Phi-la-đen-phi dưới sự áp giải trên đường đến Rô-ma. Viết lại từ Trô-ách, ông nhắc hội thánh rằng khi ở giữa họ, ông đã kêu lớn tiếng: hãy chú ý đến giám mục, các trưởng lão và các chấp sự. Bản tường thuật về cái chết của Polycarp gọi ông là vị tử đạo thứ mười hai ở Si-miệc-nơ, kể cả những người từ Phi-la-đen-phi, và một tác giả thời đầu viết chống phái Montanus, được Eusebius trích dẫn, kể Ammia ở Phi-la-đen-phi trong số các nhà tiên tri thật của giao ước mới."
  ro:
    - "Filadelfia, actualul Alaşehir, se afla în estul Lidiei, la poalele muntelui Tmolos, deasupra văii Cogamis, afluent al Hermosului, pe drumul de la Sardes în Frigia. A fost întemeiată în secolul al II-lea î.Hr. de regii atalizi ai Pergamului și a primit numele după Attalos al II-lea Filadelf, „cel care își iubește fratele”; unii atribuie întemeierea fratelui său Eumenes al II-lea, alții lui Attalos însuși. Împreună cu restul regatului atalid, a fost lăsată prin testament Romei în 133 î.Hr."
    - "Orașul se afla la marginea ținutului vulcanic pe care grecii îl numeau Țara Arsă, iar Strabon îl descrie ca fiind mereu supus cutremurelor: zidurile lui se crăpau zi de zi, așa că puțini oameni trăiau în oraș, iar cei mai mulți lucrau pământul fertil din jur. Marele cutremur din 17 d.Hr. a lovit Filadelfia printre douăsprezece orașe ale Asiei, iar Tiberiu le-a scutit de tribut pentru cinci ani. O vreme, în secolul I, monedele ei îi spun Neocezareea."
    - "În Apocalipsă, scrisoarea către Filadelfia, ca cea către Smirna, nu conține nicio mustrare. Începe: „acestea zice cel sfânt, cel adevărat, carele are cheia lui David, cel ce deschide, și nimeni nu închide”. Bisericii i se spune: „am dat înaintea ta ușe deschisă, și nimeni nu poate să o închiză pre ea; că mică putere ai, și ai păzit cuvântul meu”. Celui ce biruiește i se făgăduiește: „Cel ce biruește, îi voiu face pre el stâlp în biserica Dumnezeului meu, și nu va ieși afară mai mult”."
    - "La începutul secolului al II-lea, după datarea obișnuită, Ignatie al Antiohiei a trecut prin Filadelfia sub pază, în drum spre Roma. Scriind de la Troa, i-a amintit bisericii că, în timpul șederii lui printre ei, strigase cu glas tare: luați aminte la episcop, la prezbiteri și la diaconi. Relatarea morții lui Policarp îl numește pe acesta al doisprezecelea martir la Smirna, numărându-i și pe cei din Filadelfia, iar un scriitor timpuriu împotriva montaniștilor, citat de Eusebiu, o numără pe Ammia din Filadelfia printre adevărații profeți ai noului legământ."
  bg:
    - "Филаделфия, днешният Алашехир, се намирала в Източна Лидия, в подножието на планината Тмол, над долината на Когамис, приток на Херм, по пътя от Сарди към Фригия. Основана била през II в. пр.н.е. от пергамските царе Аталиди и наречена на Атал II Филаделф, „който обича брат си“; някои приписват основаването на брат му Евмен II, други — на самия Атал. Заедно с останалата част от царството на Аталидите тя била завещана на Рим през 133 г. пр.н.е."
    - "Градът стоял на края на вулканичната земя, наричана от гърците Изгорената страна, и Страбон го описва като постоянно подложен на земетресения: стените му се пропуквали ден след ден, така че малцина живеели в града, а повечето обработвали плодородните околности. Голямото земетресение от 17 г. н.е. ударило Филаделфия сред дванадесет града на Азия и Тиберий ги освободил от данък за пет години. Известно време през I в. монетите ѝ я наричат Неокесария."
    - "В Откровението писмото до Филаделфия, както и това до Смирна, не съдържа укор. То започва: „Така казва светият, истинният, който има ключа Давидов; който отваря, и никой не затваря“. На църквата се казва: „поставих пред тебе врата отворени, и никой не може да ги затвори; защото имаш малко сила, и упазил си моето слово“. На побеждаващия то обещава: „Който победи ще го направя стълб в храма на Бога моего, и нема да излезе вече вън“."
    - "В началото на II в., според обичайната датировка, Игнатий Антиохийски минал под стража през Филаделфия на път за Рим. В писмо, изпратено обратно от Троада, той напомнил на църквата, че докато бил сред тях, извикал с висок глас: слушайте епископа, презвитерите и дяконите. Разказът за смъртта на Поликарп го нарича дванадесетия мъченик в Смирна, като брои и тези от Филаделфия, а един ранен автор срещу монтанистите, цитиран от Евсевий, причислява Амия от Филаделфия към истинските пророци на новия завет."
