# Overview article (ADR 0007). Mainstream facts only; the founder of the city and the dating of Ignatius' letters are named as disputed or conventional.
id: philadelphia
place: a1c7cc1
title:
  en: "Philadelphia"
  ru: "Филадельфия"
body:
  en:
    - 'Philadelphia, today''s Alaşehir, lay in eastern Lydia at the foot of Mount Tmolus, above the valley of the Cogamis, a tributary of the Hermus, on the road from Sardis into Phrygia. It was founded in the second century BC by the Attalid kings of Pergamum and named after Attalus II Philadelphus, "the one who loves his brother"; some credit the founding to his brother Eumenes II, others to Attalus himself. With the rest of the Attalid kingdom it passed to Rome in 133 BC.'
    - "The city stood on the edge of the volcanic land the Greeks called the Burnt Country, and Strabo describes it as ever subject to earthquakes: its walls cracked day after day, so that few people lived in the city and most farmed the fertile countryside. The great earthquake of AD 17 struck Philadelphia among twelve cities of Asia, and Tiberius freed them from tribute for five years. For a time in the first century its coins call it Neocaesarea."
    - 'In Revelation the letter to Philadelphia, like that to Smyrna, has no rebuke. It opens: "These things saith he that is holy, he that is true, he that hath the key of David, he that openeth, and no man shutteth". The church is told: "I have set before thee an open door, and no man can shut it: for thou hast a little strength, and hast kept my word." To him that overcomes it promises: "Him that overcometh will I make a pillar in the temple of my God, and he shall go no more out".'
    - "Early in the second century, by the usual dating, Ignatius of Antioch passed through Philadelphia under guard on his way to Rome. Writing back from Troas, he reminded the church that while among them he had cried with a loud voice: give heed to the bishop, the presbyters and the deacons. The account of Polycarp's death calls him the twelfth martyr at Smyrna, counting those from Philadelphia, and an early writer against the Montanists, quoted by Eusebius, counts Ammia of Philadelphia among the true prophets of the new covenant."
  ru:
    - "Филадельфия, нынешний Алашехир, лежала на востоке Лидии у подножия горы Тмол, над долиной Когамиса, притока Герма, на дороге из Сардиса во Фригию. Её основали во II веке до н. э. пергамские цари Атталиды и назвали в честь Аттала II Филадельфа, «любящего брата»; одни приписывают основание его брату Евмену II, другие самому Атталу. Вместе со всем царством Атталидов она в 133 г. до н. э. перешла к Риму."
    - "Город стоял на краю вулканической земли, которую греки называли Выжженной страной, и Страбон пишет, что он всегда подвержен землетрясениям: стены его давали трещины день за днём, так что в самом городе жили немногие, а большинство обрабатывало плодородную округу. Великое землетрясение 17 г. н. э. поразило Филадельфию среди двенадцати городов Асии, и Тиберий на пять лет освободил их от податей. Какое-то время в I веке монеты города называют его Неокесарией."
    - "В Откровении послание к Филадельфии, как и к Смирне, не содержит обличения. Оно начинается словами: «так говорит Святый, Истинный, имеющий ключ Давидов, Который отворяет — и никто не затворит». Церкви сказано: «вот, Я отворил перед тобою дверь, и никто не может затворить ее; ты не много имеешь силы, и сохранил слово Мое». Побеждающему оно обещает: «Побеждающего сделаю столпом в храме Бога Моего, и он уже не выйдет вон»."
    - "В начале II века, по обычной датировке, Игнатий Антиохийский, которого под стражей везли в Рим, прошёл через Филадельфию. В письме из Троады он напомнил церкви, что, будучи у них, громко взывал: внимайте епископу, пресвитерам и диаконам. Рассказ о кончине Поликарпа называет его двенадцатым мучеником в Смирне, считая и тех, кто был из Филадельфии, а ранний противник монтанистов, которого приводит Евсевий, причисляет Аммию из Филадельфии к истинным пророкам Нового Завета."
