body:
  en:
    - "Ephesus lies on the west coast of Asia Minor, near the mouth of the Cayster, by Selçuk in Turkey. Greek tradition held that Ionians led by Androclus, son of the Athenian king Codrus, founded it beside an older shrine. Its fame was the temple of Artemis: Croesus of Lydia, who took the city in the sixth century BC, gave many of its columns. In 356 BC Herostratus set the temple on fire; it was rebuilt and counted among the Seven Wonders."
    - "Alexander took the city from the Persians in 334 BC. About 290 BC Lysimachus moved the people to a new site between the hills, nearer the shifting harbour. In 133 BC Attalus III of Pergamum left his kingdom to Rome, and after the revolt of Aristonicus it became the province of Asia. Under the emperors Ephesus was the residence of the proconsul and one of the largest cities of the East, with a theatre on the slope of Mount Pion."
    - "Paul first stopped here briefly and left Aquila and Priscilla, who taught Apollos. Returning, he argued in the synagogue for three months and then for two years in the school of Tyrannus. The silversmith Demetrius, who made silver shrines of Artemis, stirred up a riot in the theatre until the town clerk calmed the crowd. From Ephesus Paul wrote to the Corinthians; later he called its elders to Miletus. Timothy stayed in the city, the letter to the Ephesians bears its name (some early manuscripts lack the words in Ephesus), and Revelation addresses the first of the seven churches to it."
    - "Early tradition holds that the apostle John lived and was buried at Ephesus, and Ignatius wrote to its church. In the 260s the Goths plundered the city and burned the temple of Artemis. In 431 a council met in the Church of Mary, condemned Nestorius and confirmed the title Theotokos, Mother of God, for Mary; a second council in 449 was overturned at Chalcedon in 451. The silting of the harbour slowly drained the city's trade."
  ru:
    - "Ефес лежит на западном побережье Малой Азии, у устья Каистра, близ турецкого Сельчука. Греческое предание говорит, что его основали ионийцы во главе с Андроклом, сыном афинского царя Кодра, рядом с более древним святилищем. Славу ему принёс храм Артемиды: лидийский царь Крёз, взявший город в VI веке до н. э., пожертвовал многие из его колонн. В 356 г. до н. э. Герострат поджёг храм; его отстроили заново, и он вошёл в число семи чудес света."
    - "В 334 г. до н. э. Александр отнял город у персов. Около 290 г. до н. э. Лисимах переселил жителей на новое место между холмами, ближе к смещавшейся гавани. В 133 г. до н. э. пергамский царь Аттал III завещал своё царство Риму, и после восстания Аристоника оно стало провинцией Асия. При императорах Ефес был резиденцией проконсула и одним из крупнейших городов Востока, с театром на склоне горы Пион."
    - "Павел сначала ненадолго остановился здесь и оставил Акилу и Прискиллу, которые наставили Аполлоса. Вернувшись, он три месяца проповедовал в синагоге, а потом два года в училище Тиранна. Серебряник Димитрий, делавший серебряные храмы Артемиды, поднял бунт в театре, пока блюститель порядка не утишил народ. Из Ефеса Павел писал коринфянам, а позже призвал его пресвитеров в Милит. В городе остался Тимофей, Послание к Ефесянам носит его имя (в некоторых ранних рукописях слов «в Ефесе» нет), а Откровение обращает к нему первое из посланий семи церквам."
    - "Раннее предание говорит, что апостол Иоанн жил и был погребён в Ефесе; Игнатий писал его церкви. В 260-х гг. готы разграбили город и сожгли храм Артемиды. В 431 г. собор в церкви Девы Марии осудил Нестория и утвердил за Марией именование Богородицы; решения второго собора 449 г. были отменены в Халкидоне в 451 г. Заиливание гавани медленно лишало город торговли."
  uk:
    - "Ефес лежить на західному узбережжі Малої Азії, поблизу гирла Кайстра, біля Сельчука в Туреччині. Грецька традиція стверджувала, що іонійці під проводом Андрокла, сина афінського царя Кодра, заснували його поряд із давнішим святилищем. Його славою був храм Артеміди: Крез Лідійський, який узяв місто в VI ст. до н. е., пожертвував багато його колон. У 356 р. до н. е. Герострат підпалив храм; його відбудували, і він рахувався серед Семи чудес світу."
    - "Александр узяв місто в персів у 334 р. до н. е. Близько 290 р. до н. е. Лісімах переселив людей на нове місце між пагорбами, ближче до гавані, що зміщувалася. У 133 р. до н. е. Аттал III Пергамський заповів своє царство Римові, і після повстання Арістоніка воно стало провінцією Азія. За імператорів Ефес був резиденцією проконсула й одним з найбільших міст Сходу, з театром на схилі гори Піон."
    - "Павло спершу зупинився тут ненадовго й залишив Акилу та Прискиллу, які навчали Аполлоса. Повернувшись, він три місяці сперечався в синагозі, а потім два роки в школі Тирана. Срібляр Димитрій, який виготовляв срібні храмики Артеміди, підняв заколот у театрі, доки міський писар не вгамував юрбу. З Ефеса Павло писав до коринфян; пізніше він покликав його старійшин до Мілета. Тимофій залишився в місті, послання до ефесян носить його ім'я (у деяких ранніх рукописах бракує слів «в Ефесі»), і Одкровення адресує йому першу з семи церков."
    - "Рання традиція стверджує, що апостол Іван жив і був похований в Ефесі, а Ігнатій писав його церкві. У 260-х рр. готи пограбували місто й спалили храм Артеміди. У 431 р. в церкві Марії зібрався собор, який засудив Несторія й підтвердив для Марії титул Феотокос, Богородиця; другий собор 449 р. було скасовано в Халкедоні в 451 р. Замулення гавані поступово виснажувало торгівлю міста."
  es:
    - "Éfeso se halla en la costa occidental de Asia Menor, cerca de la desembocadura del Caístro, junto a Selçuk, en Turquía. La tradición griega sostenía que la fundaron jonios dirigidos por Androclo, hijo del rey ateniense Codro, junto a un santuario más antiguo. Su fama era el templo de Artemisa: Creso de Lidia, que tomó la ciudad en el siglo VI a. C., regaló muchas de sus columnas. En el 356 a. C. Eróstrato incendió el templo; fue reconstruido y contado entre las Siete Maravillas."
    - "Alejandro tomó la ciudad a los persas en el 334 a. C. Hacia el 290 a. C. Lisímaco trasladó a la población a un nuevo emplazamiento entre las colinas, más cerca del puerto, que cambiaba de lugar. En el 133 a. C. Átalo III de Pérgamo legó su reino a Roma, y, tras la revuelta de Aristónico, este pasó a ser la provincia de Asia. Bajo los emperadores Éfeso fue residencia del procónsul y una de las mayores ciudades de Oriente, con un teatro en la ladera del monte Pion."
    - "Pablo se detuvo aquí primero brevemente y dejó a Aquila y Priscila, que instruyeron a Apolos. A su regreso, discutió en la sinagoga durante tres meses y luego durante dos años en la escuela de Tirano. El platero Demetrio, que fabricaba templetes de plata de Artemisa, provocó un tumulto en el teatro hasta que el escribano de la ciudad calmó a la multitud. Desde Éfeso Pablo escribió a los corintios; más tarde convocó a sus ancianos en Mileto. Timoteo se quedó en la ciudad, la carta a los Efesios lleva su nombre (algunos manuscritos antiguos carecen de las palabras «en Éfeso»), y el Apocalipsis se dirige a ella como la primera de las siete iglesias."
    - "La tradición antigua sostiene que el apóstol Juan vivió y fue sepultado en Éfeso, e Ignacio escribió a su iglesia. En la década del 260 los godos saquearon la ciudad e incendiaron el templo de Artemisa. En el 431 un concilio se reunió en la iglesia de María, condenó a Nestorio y confirmó el título de Theotokos, Madre de Dios, para María; un segundo concilio, en el 449, fue anulado en Calcedonia en el 451. La colmatación del puerto fue agotando poco a poco el comercio de la ciudad."
  pt:
    - "Éfeso fica na costa oeste da Ásia Menor, perto da foz do Caístro, junto a Selçuk, na Turquia. A tradição grega dizia que jônios liderados por Androclo, filho do rei ateniense Codro, a fundaram ao lado de um santuário mais antigo. Sua fama era o templo de Ártemis: Creso da Lídia, que tomou a cidade no século VI a.C., deu muitas de suas colunas. Em 356 a.C., Eróstrato incendiou o templo; ele foi reconstruído e contado entre as Sete Maravilhas."
    - "Alexandre tomou a cidade dos persas em 334 a.C. Por volta de 290 a.C., Lisímaco transferiu o povo para um novo local entre as colinas, mais perto do porto, que mudava de lugar. Em 133 a.C., Átalo III de Pérgamo legou seu reino a Roma, e, após a revolta de Aristônico, ele se tornou a província da Ásia. Sob os imperadores, Éfeso era a residência do procônsul e uma das maiores cidades do Oriente, com um teatro na encosta do monte Pion."
    - "Paulo primeiro parou aqui brevemente e deixou Áquila e Priscila, que instruíram Apolo. Ao voltar, argumentou na sinagoga por três meses e depois por dois anos na escola de Tirano. O ourives Demétrio, que fazia santuários de prata de Ártemis, provocou um tumulto no teatro até que o escrivão da cidade acalmou a multidão. De Éfeso Paulo escreveu aos coríntios; mais tarde chamou seus anciãos a Mileto. Timóteo ficou na cidade, a carta aos Efésios leva o seu nome (alguns manuscritos antigos não têm as palavras em Éfeso), e o Apocalipse dirige a ela a primeira das sete igrejas."
    - "A tradição antiga sustenta que o apóstolo João viveu e foi sepultado em Éfeso, e Inácio escreveu à sua igreja. Na década de 260, os godos saquearam a cidade e queimaram o templo de Ártemis. Em 431, um concílio reuniu-se na Igreja de Maria, condenou Nestório e confirmou o título Teótocos, Mãe de Deus, para Maria; um segundo concílio em 449 foi anulado em Calcedônia em 451. O assoreamento do porto drenou aos poucos o comércio da cidade."
  de:
    - "Ephesus liegt an der Westküste Kleinasiens, nahe der Mündung des Kaystros, bei Selçuk in der Türkei. Die griechische Überlieferung besagte, Ionier unter Androklos, dem Sohn des athenischen Königs Kodros, hätten es neben einem älteren Heiligtum gegründet. Sein Ruhm war der Tempel der Artemis: Krösus von Lydien, der die Stadt im 6. Jahrhundert v. Chr. einnahm, stiftete viele seiner Säulen. Im Jahr 356 v. Chr. setzte Herostratos den Tempel in Brand; er wurde wiederaufgebaut und zu den Sieben Weltwundern gezählt."
    - "Alexander nahm die Stadt 334 v. Chr. den Persern ab. Um 290 v. Chr. verlegte Lysimachos die Bevölkerung an einen neuen Ort zwischen den Hügeln, näher am sich verlagernden Hafen. Im Jahr 133 v. Chr. vermachte Attalos III. von Pergamon sein Königreich Rom, und nach dem Aufstand des Aristonikos wurde es die Provinz Asia. Unter den Kaisern war Ephesus Sitz des Prokonsuls und eine der größten Städte des Ostens, mit einem Theater am Hang des Berges Pion."
    - "Paulus hielt hier zuerst kurz an und ließ Aquila und Priscilla zurück, die Apollos unterwiesen. Nach seiner Rückkehr stritt er drei Monate in der Synagoge und dann zwei Jahre in der Schule des Tyrannus. Der Silberschmied Demetrius, der silberne Artemisschreine herstellte, erregte im Theater einen Aufruhr, bis der Stadtschreiber die Menge beruhigte. Von Ephesus schrieb Paulus an die Korinther; später rief er dessen Älteste nach Milet. Timotheus blieb in der Stadt, der Brief an die Epheser trägt ihren Namen (einigen frühen Handschriften fehlen die Worte in Ephesus), und die Offenbarung richtet sich an die erste der sieben Gemeinden dort."
    - "Die frühe Überlieferung besagt, der Apostel Johannes habe in Ephesus gelebt und sei dort begraben worden, und Ignatius schrieb an seine Gemeinde. In den 260er Jahren plünderten die Goten die Stadt und brannten den Artemistempel nieder. Im Jahr 431 tagte ein Konzil in der Marienkirche, verurteilte Nestorius und bestätigte den Titel Theotokos, Gottesgebärerin, für Maria; ein zweites Konzil 449 wurde 451 in Chalkedon aufgehoben. Die Verlandung des Hafens entzog der Stadt langsam den Handel."
  fr:
    - "Éphèse se trouve sur la côte ouest de l’Asie Mineure, près de l’embouchure du Caystre, à côté de Selçuk, en Turquie. La tradition grecque voulait que des Ioniens conduits par Androclos, fils du roi athénien Codros, l’aient fondée près d’un sanctuaire plus ancien. Sa gloire fut le temple d’Artémis : Crésus de Lydie, qui prit la ville au VIe siècle av. J.-C., en offrit beaucoup de colonnes. En 356 av. J.-C., Érostrate incendia le temple ; reconstruit, il compta parmi les Sept Merveilles."
    - "Alexandre prit la ville aux Perses en 334 av. J.-C. Vers 290 av. J.-C., Lysimaque déplaça la population vers un nouveau site entre les collines, plus près du port changeant. En 133 av. J.-C., Attale III de Pergame légua son royaume à Rome, qui, après la révolte d’Aristonicos, en fit la province d’Asie. Sous les empereurs, Éphèse fut la résidence du proconsul et l’une des plus grandes villes de l’Orient, avec un théâtre sur le flanc du mont Pion."
    - "Paul s’y arrêta d’abord brièvement et laissa Aquilas et Priscille, qui instruisirent Apollos. À son retour, il discuta trois mois dans la synagogue, puis deux ans dans l’école de Tyrannus. L’orfèvre Démétrius, qui faisait des sanctuaires d’argent d’Artémis, souleva une émeute dans le théâtre jusqu’à ce que le secrétaire de la ville calme la foule. D’Éphèse, Paul écrivit aux Corinthiens ; plus tard, il fit venir ses anciens à Milet. Timothée resta dans la ville, la lettre aux Éphésiens porte son nom (certains manuscrits anciens omettent les mots à Éphèse), et l’Apocalypse lui adresse la première des sept Églises."
    - "La tradition ancienne veut que l’apôtre Jean ait vécu et ait été enterré à Éphèse, et Ignace écrivit à son Église. Dans les années 260, les Goths pillèrent la ville et incendièrent le temple d’Artémis. En 431, un concile se réunit dans l’église de Marie, condamna Nestorius et confirma pour Marie le titre de Théotokos, Mère de Dieu ; un second concile en 449 fut annulé à Chalcédoine en 451. L’ensablement du port tarit peu à peu le commerce de la ville."
  it:
    - "Efeso sorge sulla costa occidentale dell’Asia Minore, presso la foce del Caistro, vicino a Selçuk in Turchia. La tradizione greca sosteneva che Ioni guidati da Androclo, figlio del re ateniese Codro, la fondarono accanto a un santuario più antico. La sua fama era il tempio di Artemide: Creso di Lidia, che prese la città nel VI secolo a.C., donò molte delle sue colonne. Nel 356 a.C. Erostrato diede fuoco al tempio; fu ricostruito e annoverato fra le Sette Meraviglie."
    - "Alessandro tolse la città ai Persiani nel 334 a.C. Intorno al 290 a.C. Lisimaco trasferì la popolazione in un nuovo sito fra le colline, più vicino al porto che si spostava. Nel 133 a.C. Attalo III di Pergamo lasciò il suo regno a Roma, e, dopo la rivolta di Aristonico, divenne la provincia d’Asia. Sotto gli imperatori Efeso fu la residenza del proconsole e una delle più grandi città dell’Oriente, con un teatro sul pendio del Monte Pione."
    - "Paolo vi sostò dapprima brevemente e lasciò Aquila e Priscilla, che istruirono Apollo. Tornato, discusse nella sinagoga per tre mesi e poi per due anni nella scuola di Tiranno. L’argentiere Demetrio, che faceva tempietti d’argento di Artemide, sollevò un tumulto nel teatro finché il cancelliere della città calmò la folla. Da Efeso Paolo scrisse ai Corinzi; più tardi ne chiamò gli anziani a Mileto. Timoteo rimase in città, la lettera agli Efesini ne porta il nome (alcuni manoscritti antichi non hanno le parole «in Efeso»), e l’Apocalisse indirizza ad essa la prima delle sette chiese."
    - "La tradizione antica sostiene che l’apostolo Giovanni visse e fu sepolto a Efeso, e Ignazio scrisse alla sua chiesa. Negli anni 260 i Goti saccheggiarono la città e bruciarono il tempio di Artemide. Nel 431 un concilio si riunì nella Chiesa di Maria, condannò Nestorio e confermò per Maria il titolo di Theotokos, Madre di Dio; un secondo concilio nel 449 fu annullato a Calcedonia nel 451. L’insabbiamento del porto prosciugò lentamente il commercio della città."
  pl:
    - "Efez leży na zachodnim wybrzeżu Azji Mniejszej, blisko ujścia Kajstru, koło Selçuk w Turcji. Tradycja grecka głosiła, że założyli go Jończycy pod wodzą Androklosa, syna ateńskiego króla Kodrosa, obok starszego sanktuarium. Jego sławą była świątynia Artemidy: Krezus Lidyjski, który zdobył miasto w VI w. p.n.e., ufundował wiele jej kolumn. W 356 r. p.n.e. Herostrates podpalił świątynię; odbudowano ją i zaliczono do siedmiu cudów świata."
    - "Aleksander wziął miasto Persom w 334 r. p.n.e. Około 290 r. p.n.e. Lizymach przeniósł mieszkańców w nowe miejsce między wzgórzami, bliżej przesuwającego się portu. W 133 r. p.n.e. Attalos III z Pergamonu zapisał swe królestwo Rzymowi i po powstaniu Aristonikosa stało się ono prowincją Azji. Za cesarzy Efez był rezydencją prokonsula i jednym z największych miast Wschodu, z teatrem na zboczu góry Pion."
    - "Paweł zatrzymał się tu najpierw krótko i zostawił Akwilę i Pryscyllę, którzy pouczyli Apollosa. Wróciwszy, rozprawiał w synagodze przez trzy miesiące, a potem przez dwa lata w szkole Tyrannusa. Złotnik Demetriusz, wytwarzający srebrne świątynki Artemidy, wzniecił zamieszki w teatrze, aż pisarz miejski uspokoił tłum. Z Efezu Paweł pisał do Koryntian; później wezwał jego starszych do Miletu. Tymoteusz pozostał w mieście, List do Efezjan nosi jego imię (w niektórych wczesnych rękopisach brak słów w Efezie), a Apokalipsa zwraca się do niego jako pierwszego z siedmiu Kościołów."
    - "Wczesna tradycja głosi, że apostoł Jan mieszkał i został pochowany w Efezie, a Ignacy pisał do jego Kościoła. W latach sześćdziesiątych III w. Goci złupili miasto i spalili świątynię Artemidy. W 431 r. w kościele Marii obradował sobór, który potępił Nestoriusza i potwierdził tytuł Theotokos, Matka Boża, dla Marii; drugi sobór w 449 r. został uchylony w Chalcedonie w 451 r. Zamulanie portu powoli wysysało handel miasta."
  nl:
    - "Efeze ligt aan de westkust van Klein-Azië, bij de monding van de Kaystros, bij Selçuk in Turkije. De Griekse overlevering hield dat Ioniërs onder Androklos, zoon van de Atheense koning Kodros, de stad stichtten naast een ouder heiligdom. Zijn faam was de tempel van Artemis: Croesus van Lydië, die de stad in de zesde eeuw v.Chr. innam, schonk veel van de zuilen. In 356 v.Chr. stak Herostratus de tempel in brand; hij werd herbouwd en gerekend tot de Zeven Wereldwonderen."
    - "Alexander nam de stad in 334 v.Chr. van de Perzen. Omstreeks 290 v.Chr. verplaatste Lysimachus de bevolking naar een nieuwe plaats tussen de heuvels, dichter bij de verschuivende haven. In 133 v.Chr. liet Attalus III van Pergamum zijn koninkrijk aan Rome na, en na de opstand van Aristonicus werd het de provincie Asia. Onder de keizers was Efeze de residentie van de proconsul en een van de grootste steden van het Oosten, met een theater op de helling van de Pion."
    - "Paulus stopte hier eerst kort en liet Aquila en Priscilla achter, die Apollos onderwezen. Teruggekeerd redetwistte hij drie maanden in de synagoge en daarna twee jaar in de school van Tyrannus. De zilversmid Demetrius, die zilveren Artemisschrijntjes maakte, wekte een oproer in het theater op tot de stadsschrijver de menigte kalmeerde. Vanuit Efeze schreef Paulus aan de Korinthiërs; later riep hij de oudsten naar Milete. Timoteüs bleef in de stad, de brief aan de Efeziërs draagt haar naam (sommige vroege handschriften missen de woorden in Efeze), en Openbaring richt zich tot de eerste van de zeven gemeenten."
    - "De vroege overlevering houdt dat de apostel Johannes in Efeze woonde en begraven werd, en Ignatius schreef aan de gemeente. In de jaren 260 plunderden de Goten de stad en verbrandden de tempel van Artemis. In 431 kwam in de Mariakerk een concilie bijeen, dat Nestorius veroordeelde en de titel Theotokos, Moeder van God, voor Maria bevestigde; een tweede concilie in 449 werd in 451 te Chalcedon ongedaan gemaakt. De verzanding van de haven putte de handel van de stad langzaam uit."
  cs:
    - "Efez leží na západním pobřeží Malé Asie, poblíž ústí Kaystru, u Selçuku v Turecku. Řecká tradice tvrdila, že jej Iónové vedení Androklem, synem athénského krále Kodra, založili vedle starší svatyně. Jeho slávou byl chrám Artemidin: Kroisos Lýdský, který město dobyl v 6. století př. n. l., daroval mnoho jeho sloupů. Roku 356 př. n. l. chrám zapálil Hérostratos; byl znovu vystavěn a počítán mezi sedm divů světa."
    - "Alexandr dobyl město od Peršanů roku 334 př. n. l. Kolem roku 290 př. n. l. přesídlil Lysimachos lid na nové místo mezi pahorky, blíže proměnlivému přístavu. Roku 133 př. n. l. odkázal Attalos III. Pergamský své království Římu a po povstání Aristonika se stalo provincií Asie. Za císařů byl Efez sídlem prokonzula a jedním z největších měst Východu s divadlem na svahu hory Pion."
    - "Pavel se tu poprvé krátce zastavil a zanechal Akvilu a Priscillu, kteří poučovali Apolla. Po návratu tři měsíce hovořil v synagoze a pak dva roky ve škole Tyrannově. Stříbrník Démétrios, který vyráběl stříbrné svatyňky Artemidy, vyvolal v divadle nepokoj, dokud městský písař dav neuklidnil. Z Efezu psal Pavel Korintským; později si zavolal jeho starší do Milétu. Timoteus zůstal ve městě, list Efezským nese jeho jméno (některým raným rukopisům slova v Efezu chybějí) a Zjevení k němu adresuje první ze sedmi církví."
    - "Rané podání praví, že apoštol Jan žil a byl pohřben v Efezu a Ignatios psal jeho církvi. V 60. letech 3. století Gótové město vyplenili a chrám Artemidin spálili. Roku 431 zasedl koncil v kostele Panny Marie, odsoudil Nestoria a potvrdil titul Theotokos, Matka Boží, pro Marii; druhý koncil roku 449 byl zvrácen v Chalkédónu roku 451. Zanášení přístavu pomalu odčerpávalo obchod města."
  sv:
    - "Efesos ligger på Mindre Asiens västkust, nära Kaystros mynning, vid Selçuk i Turkiet. Den grekiska traditionen hävdade att joner under Androklos, son till den atenske kungen Kodros, grundade staden vid en äldre helgedom. Dess berömmelse var Artemistemplet: Kroisos av Lydien, som intog staden på 500-talet f.Kr., skänkte många av dess kolonner. År 356 f.Kr. satte Herostratos eld på templet; det byggdes upp igen och räknades bland de sju underverken."
    - "Alexander tog staden från perserna 334 f.Kr. Omkring 290 f.Kr. flyttade Lysimachos folket till en ny plats mellan kullarna, närmare den skiftande hamnen. År 133 f.Kr. testamenterade Attalos III av Pergamon sitt rike till Rom, och efter Aristonikos uppror blev det provinsen Asien. Under kejsarna var Efesos prokonsulns residens och en av Österlandets största städer, med en teater på sluttningen av berget Pion."
    - "Paulus stannade först här en kort tid och lämnade kvar Aquila och Priscilla, som undervisade Apollos. När han återvände förde han samtal i synagogan i tre månader och sedan i två år i Tyrannos skola. Silversmeden Demetrios, som tillverkade silverhelgedomar åt Artemis, väckte ett upplopp i teatern tills stadsskrivaren lugnade folkhopen. Från Efesos skrev Paulus till korintierna; senare kallade han dess äldste till Miletos. Timoteus stannade i staden, brevet till efesierna bär dess namn (några tidiga handskrifter saknar orden i Efesos), och Uppenbarelseboken riktar sig till den första av de sju församlingarna där."
    - "Tidig tradition säger att aposteln Johannes bodde och begravdes i Efesos, och Ignatios skrev till dess församling. På 260-talet plundrade goterna staden och brände Artemistemplet. År 431 samlades ett koncilium i Marias kyrka, fördömde Nestorios och bekräftade titeln Theotokos, Guds moder, för Maria; ett andra koncilium 449 upphävdes i Chalkedon 451. Hamnens igenslamning dränerade långsamt stadens handel."
  nb:
    - "Efesos ligger på vestkysten av Lilleasia, nær munningen av Kaystros, ved Selçuk i Tyrkia. Gresk tradisjon mente at joniere ledet av Androklos, sønn av den athenske kongen Kodros, grunnla den ved siden av en eldre helligdom. Dens berømmelse var Artemis-tempelet: Kroisos av Lydia, som tok byen på 500-tallet f.Kr., gav mange av dets søyler. I 356 f.Kr. satte Herostratos fyr på tempelet; det ble gjenreist og regnet blant verdens sju underverker."
    - "Aleksander tok byen fra perserne i 334 f.Kr. Omkring 290 f.Kr. flyttet Lysimakhos folket til et nytt sted mellom åsene, nærmere den flyttende havnen. I 133 f.Kr. testamenterte Attalos III av Pergamon sitt rike til Roma, og etter Aristonikos' opprør ble det provinsen Asia. Under keiserne var Efesos prokonsulens residens og en av de største byene i Østen, med et teater på skråningen av Pion-fjellet."
    - "Paulus stoppet først her kort og lot Akvilas og Priskilla bli igjen, som underviste Apollos. Da han kom tilbake, drøftet han i synagogen i tre måneder og så i to år i Tyrannos' skole. Sølvsmeden Demetrios, som laget sølvhelligdommer for Artemis, vekket et opptøy i teatret til byskriveren fikk folkemengden til ro. Fra Efesos skrev Paulus til korintierne; senere kalte han dens eldste til Milet. Timoteus ble i byen, Efeserbrevet bærer dens navn (noen tidlige håndskrifter mangler ordene i Efesos), og Åpenbaringen retter den første av de sju menighetene til den."
    - "Tidlig tradisjon mener at apostelen Johannes bodde og ble gravlagt i Efesos, og Ignatios skrev til dens menighet. På 260-tallet plyndret goterne byen og brente Artemis-tempelet. I 431 møttes et konsil i Marias kirke, fordømte Nestorios og stadfestet tittelen Theotokos, Guds mor, for Maria; et andre konsil i 449 ble omstøtt i Kalkedon i 451. Havnens gjengroing tappet langsomt byens handel."
  tl:
    - "Ang Efeso ay nasa kanlurang baybayin ng Asia Menor, malapit sa bunganga ng Cayster, sa tabi ng Selçuk sa Turkey. Ayon sa tradisyong Griyego, itinatag ito ng mga Ionio sa pamumuno ni Androclus, anak ng haring Ateniense na si Codrus, sa tabi ng mas lumang dambana. Ang katanyagan nito ay ang templo ni Artemis: ibinigay ni Creso ng Lidia, na sumakop sa lungsod noong ika-6 na siglo BK, ang marami sa mga haligi nito. Noong 356 BK, sinunog ni Herostratus ang templo; muli itong itinayo at ibinilang sa Pitong Kababalaghan."
    - "Kinuha ni Alejandro ang lungsod mula sa mga Persiano noong 334 BK. Noong mga 290 BK, inilipat ni Lisimaco ang mga tao sa bagong pook sa pagitan ng mga burol, mas malapit sa nagbabagong daungan. Noong 133 BK, iniwan ni Attalus III ng Pergamo ang kaharian niya sa Roma, at pagkatapos ng paghihimagsik ni Aristonicus ay naging lalawigan ng Asia. Sa ilalim ng mga emperador, ang Efeso ay tirahan ng proconsul at isa sa pinakamalalaking lungsod ng Silangan, na may dulaan sa dalisdis ng Bundok Pion."
    - "Unang huminto rito nang sandali si Pablo at iniwan sina Aquila at Priscila, na nagturo kay Apolos. Pagbalik niya, nangatwiran siya sa sinagoga sa loob ng tatlong buwan at saka sa loob ng dalawang taon sa paaralan ni Tiranno. Ang platerong si Demetrio, na gumagawa ng mga pilak na dambana ni Artemis, ay nagpasimula ng gulo sa dulaan hanggang payapain ng kalihim ng bayan ang pulutong. Mula sa Efeso sumulat si Pablo sa mga taga-Corinto; nang maglaon ay tinawag niya ang mga matanda nito sa Mileto. Nanatili sa lungsod si Timoteo, dala ng liham sa mga taga-Efeso ang pangalan nito (kulang ang mga salitang sa Efeso sa ilang maagang manuskrito), at tinutugunan ng Pahayag ang una sa pitong iglesia rito."
    - "Ayon sa maagang tradisyon, nanirahan at inilibing sa Efeso ang apostol na si Juan, at sumulat si Ignacio sa iglesia nito. Noong dekada 260, sinamsam ng mga Goth ang lungsod at sinunog ang templo ni Artemis. Noong 431, nagpulong ang isang konsilyo sa Simbahan ni Maria, hinatulan si Nestorio at pinagtibay ang titulong Theotokos, Ina ng Dios, para kay Maria; ang ikalawang konsilyo noong 449 ay binawi sa Calcedonia noong 451. Unti-unting inubos ng pagkabaon ng daungan sa banlik ang kalakalan ng lungsod."
  da:
    - "Efesos ligger på Lilleasiens vestkyst, nær mundingen af Kaystros, ved Selçuk i Tyrkiet. Græsk tradition mente, at ionere under ledelse af Androklos, søn af den athenske konge Kodros, grundlagde den ved siden af en ældre helligdom. Dens berømmelse var Artemis-templet: Kroisos af Lydien, som indtog byen i 500-tallet f.Kr., skænkede mange af dets søjler. I 356 f.Kr. satte Herostratos ild på templet; det blev genopbygget og regnedes blandt De Syv Vidundere."
    - "Alexander tog byen fra perserne i 334 f.Kr. Omkring 290 f.Kr. flyttede Lysimachos folket til et nyt sted mellem bakkerne, nærmere den skiftende havn. I 133 f.Kr. efterlod Attalos 3. af Pergamon sit kongerige til Rom, og efter Aristonikos' oprør blev det provinsen Asia. Under kejserne var Efesos prokonsulens residens og en af Østens største byer, med et teater på skråningen af Pion-bjerget."
    - "Paulus standsede først kortvarigt her og efterlod Akvila og Priskilla, som underviste Apollos. Da han vendte tilbage, argumenterede han i synagogen i tre måneder og derefter i to år i Tyrannus' skole. Sølvsmeden Demetrius, der lavede sølvtempler for Artemis, vakte tumult i teatret, indtil stadsskriveren fik skaren til at falde til ro. Fra Efesos skrev Paulus til korintherne; senere kaldte han dens ældste til Milet. Timotheus blev i byen, Efeserbrevet bærer dens navn (nogle tidlige håndskrifter mangler ordene i Efesos), og Johannes' Åbenbaring henvender sig til den som den første af de syv menigheder."
    - "Tidlig tradition mener, at apostlen Johannes boede og blev begravet i Efesos, og Ignatius skrev til dens menighed. I 260'erne plyndrede goterne byen og brændte Artemis-templet. I 431 mødtes et koncil i Mariakirken, fordømte Nestorius og stadfæstede titlen Theotokos, Guds moder, for Maria; et andet koncil i 449 blev omstødt i Chalkedon i 451. Havnens tilsiltning drænede langsomt byens handel."
  sr:
    - "Ефес лежи на западној обали Мале Азије, близу ушћа Кајстра, код Селчука у Турској. Грчко предање држало је да су га Јонци под Андроклом, сином атинског краља Кодра, основали поред старијег светилишта. Његова слава био је храм Артемиде: Крез од Лидије, који је град заузео у 6. веку п. н. е., дао је многе његове стубове. Године 356. п. н. е. Херострат је запалио храм; био је обновљен и убрајан међу седам чуда света."
    - "Александар је узео град од Персијанаца 334. п. н. е. Око 290. п. н. е. Лизимах је преселио народ на ново место између брда, ближе луци која се померала. Године 133. п. н. е. Атал III Пергамски оставио је своје краљевство Риму, а после побуне Аристоника оно је постало провинција Азија. Под царевима Ефес је био седиште проконзула и један од највећих градова Истока, с позориштем на падини брда Пион."
    - "Павле се овде први пут накратко зауставио и оставио Акилу и Прискилу, који су поучавали Аполоа. Враћајући се, расправљао је у синагоги три месеца, а затим две године у школи Тирановој. Сребрар Димитрије, који је правио сребрна светилишта Артемиде, подигао је немире у позоришту док градски писар није умирио руљу. Из Ефеса је Павле писао Коринћанима; касније је позвао његове старешине у Милет. Тимотије је остао у граду, посланица Ефесцима носи његово име (неки рани рукописи немају речи у Ефесу), а Откривење њему упућује прву од седам цркава."
    - "Рано предање држи да је апостол Јован живео и био сахрањен у Ефесу, а Игњатије је писао његовој цркви. Током 260-их Готи су опљачкали град и спалили Артемидин храм. Године 431. сабор је заседао у цркви Марије, осудио Несторија и потврдио назив Теотокос, Мајка Божја, за Марију; други сабор 449. поништен је у Халкидону 451. Замуљивање луке полако је исцрпљивало град од трговине."
  hu:
    - "Efezus Kis-Ázsia nyugati partján fekszik, a Kaüsztrosz torkolata közelében, a törökországi Selçuk mellett. A görög hagyomány szerint ión telepesek alapították Androklosz, az athéni király, Kodrosz fia vezetésével, egy régebbi szentély mellett. Híre Artemisz temploma volt: Kroiszosz, a lüdiai király, aki a Kr. e. 6. században elfoglalta a várost, oszlopai közül sokat adományozott. Kr. e. 356-ban Hérosztratosz felgyújtotta a templomot; újjáépítették, és a hét csoda közé számították."
    - "Alexandrosz Kr. e. 334-ben vette el a várost a perzsáktól. Kr. e. 290 körül Lüszimakhosz a lakosságot a dombok közötti új helyre telepítette, közelebb az iszapolódó kikötőhöz. Kr. e. 133-ban III. Attalosz, Pergamon királya Rómára hagyta királyságát, és Arisztonikosz felkelése után Ázsia tartomány lett belőle. A császárok alatt Efezus a prokonzul székhelye és a Kelet egyik legnagyobb városa volt, a Pion-hegy lejtőjén lévő színházzal."
    - "Pál először röviden megállt itt, és otthagyta Akvilát és Priszcillát, akik Apollóst tanították. Visszatérve három hónapig vitatkozott a zsinagógában, majd két évig Türánnusz iskolájában. Démétriusz, az ezüstműves, aki Artemisz ezüst szentélyeit készítette, zendülést szított a színházban, amíg a városi írnok le nem csillapította a tömeget. Efezusból írt Pál a korinthusiaknak; később Milétoszba hívta annak véneit. Timóteus a városban maradt, az Efezusiakhoz írt levél viseli a nevét (néhány korai kéziratból hiányoznak az Efezusban szavak), és a Jelenések könyve a hét gyülekezet közül elsőként neki szól."
    - "A korai hagyomány szerint János apostol Efezusban élt és temették el, és Ignatiosz írt gyülekezetének. A 260-as években a gótok kifosztották a várost, és felégették Artemisz templomát. 431-ben a Mária-templomban zsinat ülésezett, elítélte Nesztoriosz tanítását, és megerősítette a Theotokosz, Isten Anyja címet Mária számára; egy második zsinatot, 449-ben, Khalkédónban 451-ben hatályon kívül helyeztek. A kikötő feliszapolódása lassan kiszívta a város kereskedelmét."
  fi:
    - "Efesos sijaitsee Vähän-Aasian länsirannikolla, Kaystroksen suun lähellä, Selçukin kohdalla Turkissa. Kreikkalaisen perinteen mukaan Ateenan kuninkaan Kodroksen poika Androklos johti ioonialaisia, jotka perustivat sen vanhemman pyhäkön viereen. Sen maine oli Artemiksen temppeli: Lyydian Kroisos, joka valtasi kaupungin 500-luvulla eaa., lahjoitti monia sen pylväistä. Vuonna 356 eaa. Herostratos sytytti temppelin tuleen; se rakennettiin uudelleen ja laskettiin seitsemän ihmeen joukkoon."
    - "Aleksandros otti kaupungin persialaisilta vuonna 334 eaa. Noin vuonna 290 eaa. Lysimakhos siirsi asukkaat uudelle paikalle kukkuloiden väliin, lähemmäs siirtyvää satamaa. Vuonna 133 eaa. Pergamonin Attalos III jätti kuningaskuntansa Roomalle, ja Aristonikoksen kapinan jälkeen siitä tuli Aasian provinssi. Keisarien aikana Efesos oli prokonsulin asuinpaikka ja yksi idän suurimmista kaupungeista, teatteri Pion-vuoren rinteellä."
    - "Paavali pysähtyi ensin täällä lyhyesti ja jätti Akylaksen ja Priskillan, jotka opettivat Apolloksen. Palattuaan hän väitteli synagogassa kolme kuukautta ja sitten kaksi vuotta Tyrannoksen koulussa. Hopeaseppä Demetrios, joka valmisti Artemiksen hopeisia pyhäkköjä, nostatti mellakan teatterissa, kunnes kaupunginkirjuri rauhoitti väkijoukon. Efesoksesta Paavali kirjoitti korinttolaisille; myöhemmin hän kutsui sen vanhimmat Miletokseen. Timoteus jäi kaupunkiin, Efesolaiskirje kantaa sen nimeä (joistakin varhaisista käsikirjoituksista sanat Efesoksessa puuttuvat), ja Ilmestyskirja osoittaa sille ensimmäisen seitsemästä seurakunnasta."
    - "Varhainen perinne pitää apostoli Johannesta Efesoksessa asuneena ja haudattuna, ja Ignatios kirjoitti sen seurakunnalle. 260-luvulla gootit ryöstivät kaupungin ja polttivat Artemiksen temppelin. Vuonna 431 kirkolliskokous kokoontui Marian kirkossa, tuomitsi Nestoriuksen ja vahvisti Mariasta nimen Theotokos, Jumalansynnyttäjä; toinen kirkolliskokous vuonna 449 kumottiin Kalkedonissa vuonna 451. Sataman liettyminen vähensi hitaasti kaupungin kauppaa."
  vi:
    - "Ê-phê-sô nằm trên bờ tây Tiểu Á, gần cửa sông Cayster, cạnh Selçuk ở Thổ Nhĩ Kỳ. Truyền thống Hy Lạp cho rằng người Ionia do Androclus, con của vua Athens Codrus, dẫn đầu đã lập nó cạnh một đền thờ cổ hơn. Danh tiếng của nó là đền thờ Artemis: Croesus của Lydia, người chiếm thành vào thế kỷ 6 TCN, đã dâng nhiều cột của nó. Năm 356 TCN, Herostratus phóng hỏa đền; nó được xây lại và được kể trong Bảy kỳ quan."
    - "A-léc-xan-đơ chiếm thành từ người Ba Tư năm 334 TCN. Khoảng năm 290 TCN, Lysimachus dời dân đến một địa điểm mới giữa các ngọn đồi, gần bến cảng đang dịch chuyển hơn. Năm 133 TCN, Attalus III của Bẹt-găm để lại vương quốc cho Rô-ma, và sau cuộc nổi dậy của Aristonicus nó trở thành tỉnh A-si. Dưới các hoàng đế, Ê-phê-sô là nơi ở của quan tổng trấn và là một trong những thành phố lớn nhất phương Đông, với một nhà hát trên sườn núi Pion."
    - "Phao-lô lần đầu dừng lại ở đây ngắn ngủi và để lại A-qui-la và Bê-rít-sin, những người đã dạy A-bô-lô. Khi quay lại, ông biện luận trong nhà hội ba tháng rồi hai năm trong trường của Ti-ra-nu. Thợ bạc Đê-mê-triu, người làm các khám thờ Artemis bằng bạc, gây ra một cuộc náo loạn trong nhà hát cho đến khi viên thư ký thành làm đám đông dịu xuống. Từ Ê-phê-sô, Phao-lô viết cho người Cô-rinh-tô; về sau ông gọi các trưởng lão của nó đến Mi-lê. Ti-mô-thê ở lại trong thành, thư gửi người Ê-phê-sô mang tên nó (một số bản chép tay sớm thiếu các chữ ở Ê-phê-sô), và trong sách Khải Huyền, thư đầu tiên trong bảy thư gửi bảy hội thánh là thư gửi cho hội thánh ở đây."
    - "Truyền thống sớm cho rằng sứ đồ Giăng sống và được chôn ở Ê-phê-sô, và Ignatius viết cho hội thánh của nó. Vào những năm 260, người Goth cướp phá thành và đốt đền Artemis. Năm 431, một công đồng họp trong Nhà thờ Ma-ri, kết án Nestorius và xác nhận danh hiệu Theotokos, Mẹ Đức Chúa Trời, cho Ma-ri; công đồng thứ hai năm 449 bị hủy bỏ tại Chalcedon năm 451. Việc bến cảng bị bồi lấp dần dần rút cạn thương mại của thành."
  ro:
    - "Efesul se află pe coasta de vest a Asiei Mici, lângă gura râului Caystros, lângă Selçuk din Turcia. Tradiția greacă spunea că ionienii conduși de Androclos, fiul regelui atenian Codros, l-au întemeiat lângă un sanctuar mai vechi. Faima lui era templul Artemidei: Cresus al Lidiei, care a luat cetatea în secolul al VI-lea î.Hr., a dăruit multe dintre coloanele lui. În 356 î.Hr., Herostrat a dat foc templului; a fost reconstruit și numărat printre cele Șapte Minuni."
    - "Alexandru a luat cetatea de la perși în 334 î.Hr. Pe la 290 î.Hr., Lisimah a mutat locuitorii într-un loc nou, între dealuri, mai aproape de portul care se tot schimba. În 133 î.Hr., Attalos al III-lea al Pergamului și-a lăsat regatul Romei, iar după răscoala lui Aristonicos a devenit provincia Asia. Sub împărați, Efesul a fost reședința proconsulului și unul dintre cele mai mari orașe ale Răsăritului, cu un teatru pe panta Muntelui Pion."
    - "Pavel s-a oprit aici întâi scurt timp și i-a lăsat pe Acvila și Priscila, care l-au învățat pe Apolo. Întors, a discutat în sinagogă trei luni și apoi doi ani în școala lui Tiran. Argintarul Dimitrie, care făcea altărașe de argint ale Artemidei, a stârnit o răscoală în teatru, până când secretarul cetății a liniștit mulțimea. Din Efes, Pavel a scris corintenilor; mai târziu i-a chemat pe bătrânii lui la Milet. Timotei a rămas în cetate, epistola către Efeseni îi poartă numele (din unele manuscrise timpurii lipsesc cuvintele „în Efes”), iar în Apocalipsă prima dintre scrisorile către cele șapte biserici îi este adresată ei."
    - "Tradiția timpurie spune că apostolul Ioan a trăit și a fost îngropat la Efes, iar Ignatie a scris bisericii lui. În anii 260, goții au jefuit cetatea și au ars templul Artemidei. În 431 s-a întrunit un sinod în Biserica Mariei, care l-a condamnat pe Nestorie și a confirmat pentru Maria titlul Theotokos, Născătoare de Dumnezeu; un al doilea sinod din 449 a fost anulat la Calcedon în 451. Colmatarea portului a secătuit încet comerțul cetății."
  bg:
    - "Ефес лежи на западния бряг на Мала Азия, близо до устието на Каистър, до Селчук в Турция. Гръцкото предание казва, че йонийци, водени от Андрокъл, син на атинския цар Кодър, го основали до по-старо светилище. Славата му бил храмът на Артемида: Крез от Лидия, който превзел града през VI в. пр.н.е., дарил много от колоните му. През 356 г. пр.н.е. Херострат подпалил храма; той бил възстановен и причислен към Седемте чудеса на света."
    - "Александър отнел града от персите през 334 г. пр.н.е. Около 290 г. пр.н.е. Лизимах преместил жителите на ново място между хълмовете, по-близо до местещото се пристанище. През 133 г. пр.н.е. Атал III от Пергам завещал царството си на Рим и след въстанието на Аристоник то станало провинция Азия. При императорите Ефес бил резиденция на проконсула и един от най-големите градове на Изтока, с театър на склона на планината Пион."
    - "Павел първо спрял тук за кратко и оставил Акила и Прискила, които наставили Аполос. Когато се върнал, той спорил в синагогата три месеца, а после две години в училището на Тиран. Среброделецът Димитър, който правел сребърни храмчета на Артемида, вдигнал бунт в театъра, докато градският писар не успокоил тълпата. От Ефес Павел писал на коринтяните; по-късно повикал презвитерите му в Милит. Тимотей останал в града, посланието към ефесяните носи името му (някои ранни ръкописи нямат думите „в Ефес“), а Откровение отправя към него първото от посланията до седемте църкви."
    - "Ранното предание казва, че апостол Йоан живял и бил погребан в Ефес, а Игнатий писал до църквата му. През 60-те години на III в. готите разграбили града и изгорили храма на Артемида. През 431 г. събор в църквата „Св. Мария“ осъдил Несторий и потвърдил за Мария титлата Теотокос, Богородица; втори събор през 449 г. бил отменен в Халкидон през 451 г. Затлачването на пристанището бавно отнело търговията на града."
