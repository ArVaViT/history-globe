body:
  en:
    - "Shinar is the Bible's name for Babylonia, the flat alluvial plain of the lower Tigris and Euphrates that the Mesopotamians themselves called Sumer and Akkad. Genesis lists its cities as “Babel, and Erech, and Accad, and Calneh, in the land of Shinar”: Babylon, Uruk (Warka) and Agade, whose site is still unfound; Calneh may be a place or, as some read the Hebrew, “all of them”. Egyptian and Hittite texts of the second millennium BC call Babylonia Sangar or Shanhar, and the biblical name is usually traced to that foreign form; a derivation from “Sumer” has also been argued."
    - "In Shinar the first builders “found a plain” and said, “let us build us a city and a tower, whose top may reach unto heaven”; they had “brick for stone, and slime had they for morter”, as Babylonian builders did. The city was named Babel, “because the LORD did there confound the language of all the earth”. Amraphel, “king of Shinar”, marched with Chedorlaomer against the cities of the plain; the identification with Hammurabi, once popular, is no longer accepted. Achan's loot at Jericho was “a goodly Babylonish garment”, in Hebrew a mantle of Shinar."
    - "Later the name stands for the land of exile. Nebuchadnezzar carried the Temple vessels “into the land of Shinar to the house of his god”; Isaiah promises to gather the remnant “from Shinar”; and in Zechariah's vision the woman called Wickedness is carried off to “the land of Shinar” to be given a house there. The great ziggurat of Babylon, Etemenanki, rebuilt by Nabopolassar and Nebuchadnezzar and described by Herodotus, is the building most often linked with the tower; travellers long pointed instead to the ruined ziggurat of Borsippa, Birs Nimrud. The region is southern Iraq, where the ruins of Babylon near Hilla were inscribed by UNESCO in 2019."
  ru:
    - "Сеннаар — библейское имя Вавилонии, плоской наносной равнины нижнего Тигра и Евфрата, которую сами жители Месопотамии называли Шумером и Аккадом. Книга Бытия перечисляет её города: «Вавилон, Эрех, Аккад и Халне в земле Сеннаар» — Вавилон, Урук (Варка) и Аккаде, место которого до сих пор не найдено; Халне может быть городом или, как читают еврейский текст некоторые, словами «все они». Египетские и хеттские тексты II тысячелетия до н. э. называют Вавилонию Сангар или Шанхар, и библейское имя обычно возводят к этой чужеземной форме; предлагали и выводить его из «Шумера»."
    - "В Сеннааре первые строители «нашли в земле Сеннаар равнину» и сказали: «построим себе город и башню, высотою до небес»; у них были «кирпичи вместо камней, а земляная смола вместо извести», как и у вавилонских строителей. Город назвали Вавилоном, «ибо там смешал Господь язык всей земли». Амрафел, царь Сеннаарский, шёл с Кедорлаомером на города равнины; отождествление его с Хаммурапи, когда-то популярное, больше не принимается. Среди добычи в Иерихоне Ахан увидел «одну прекрасную Сеннаарскую одежду»."
    - "Позже это имя означает землю плена. Навуходоносор отправил сосуды Храма «в землю Сеннаар, в дом бога своего»; Исаия обещает возвратить остаток народа, оставшийся и «в Сеннааре»; а в видении Захарии женщину по имени Нечестие уносят, «чтобы устроить для нее дом в земле Сеннаар». Великий зиккурат Вавилона Этеменанки, отстроенный Набопаласаром и Навуходоносором и описанный Геродотом, — постройка, которую чаще всего связывают с башней; путешественники же долго указывали на разрушенный зиккурат Борсиппы, Бирс-Нимруд. Этот край — юг Ирака, где развалины Вавилона близ Хиллы внесены в список ЮНЕСКО в 2019 г."
  uk:
    - "Сеннаар — біблійна назва Вавилонії, рівної наносної рівнини нижніх Тигру й Євфрату, яку самі месопотамці називали Шумером і Аккадом. Книга Буття перелічує її міста як «Бабилон, і Ерех, і Аккад, і Калне у Синеяр землї»: Вавилон, Урук (Варка) й Агаде, місце якого досі не знайдене; Калне може бути місцем або, як читають деякі єврейський текст, «усі вони». Єгипетські та хетські тексти II тис. до н. е. називають Вавилонію Сангар або Шанхар, і біблійну назву зазвичай виводять із цієї чужої форми; висувалося й походження від «Шумер»."
    - "У Сеннаарі перші будівничі «знайшли поділлє» і сказали: «Нумо споруджувати місто із баштою, щоб її верх був до небес»; була в них «цегла за камінь а земляна смола за вапну», як і в вавилонських будівничих. Місто назвали Бабель, бо «там помішав Господь мову всієї землї». Амрафел, цар Сеннаару, виступив разом із Кедорлаомером проти міст рівнини; ототожнення з Хаммурапі, колись популярне, більше не приймається. Здобич Ахана в Єрихоні — «гарне убраннє Синеарське», на івриті — плащ Сеннаару."
    - "Згодом назва означає край вигнання. Навуходоносор забрав посуд Храму «в край Сеннаар, у дім свого бога»; Ісая обіцяє зібрати останок «із Сеннару»; а в баченні Захарії жінку на ім'я Беззаконня несуть, щоб «виготовити їй пробуток у Сеннаар-землї». Великий зіґурат Вавилона, Етеменанкі, відбудований Набопаласаром і Навуходоносором та описаний Геродотом, — споруда, яку найчастіше пов'язують із баштою; мандрівники тривалий час вказували натомість на зруйнований зіґурат Борсіппи, Бірс-Німруд. Цей регіон — південний Ірак, де руїни Вавилона поблизу Гілли були внесені до списку ЮНЕСКО 2019 року."
  es:
    - "Sinar es el nombre bíblico de Babilonia, la llanura aluvial plana del bajo Tigris y Éufrates que los propios mesopotamios llamaban Sumer y Acad. El Génesis enumera sus ciudades como «Babel, y Erech, y Accad, y Calneh, en la tierra de Shinar»: Babilonia, Uruk (Warka) y Agadé, cuyo emplazamiento sigue sin hallarse; Calneh puede ser un lugar o, como leen algunos el hebreo, «todas ellas». Los textos egipcios e hititas del segundo milenio a. C. llaman a Babilonia Sangar o Shanhar, y el nombre bíblico suele remontarse a esa forma extranjera; también se ha defendido una derivación de «Sumer»."
    - "En Sinar los primeros constructores «hallaron una vega» y dijeron: «edifiquémonos una ciudad y una torre, cuya cúspide llegue al cielo»; tenían «el ladrillo en lugar de piedra, y el betún en lugar de mezcla», como hacían los constructores babilonios. La ciudad fue llamada Babel, «porque allí confundió Jehová el lenguaje de toda la tierra». Amrafel, «rey de Shinar», marchó con Quedorlaomer contra las ciudades de la llanura; la identificación con Hammurabi, antes popular, ya no se acepta. El botín de Acán en Jericó fue «un manto babilónico muy bueno», en hebreo un manto de Sinar."
    - "Más tarde el nombre designa la tierra del exilio. Nabucodonosor llevó los vasos del templo «á tierra de Sinar, á la casa de su dios»; Isaías promete reunir al remanente desde Sinar; y en la visión de Zacarías la mujer llamada Impiedad es llevada a «tierra de Shinar» para que allí se le edifique una casa. La gran ziggurat de Babilonia, Etemenanki, reconstruida por Nabopolasar y Nabucodonosor y descrita por Heródoto, es el edificio más a menudo vinculado con la torre; los viajeros señalaron durante mucho tiempo en cambio la ziggurat en ruinas de Borsipa, Birs Nimrud. La región es el sur de Irak, donde las ruinas de Babilonia, cerca de Hilla, fueron inscritas por la UNESCO en 2019."
  pt:
    - "Sinar é o nome bíblico da Babilônia, a planície aluvial plana do baixo Tigre e Eufrates que os próprios mesopotâmios chamavam Sumer e Acad. O Gênesis lista suas cidades como “Babel, Ereque, Acade e Calné, na terra de Sinar”: Babilônia, Uruk (Warka) e Agade, cujo local ainda não foi encontrado; Calné pode ser um lugar ou, como alguns leem o hebraico, “todas elas”. Textos egípcios e hititas do segundo milênio a.C. chamam a Babilônia Sangar ou Shanhar, e o nome bíblico costuma ser derivado dessa forma estrangeira; uma derivação de “Sumer” também foi defendida."
    - "Em Sinar os primeiros construtores “encontraram uma planície” e disseram: “vamos construir para nós uma cidade e uma torre cujo topo chegue até o céu”; tinham “tijolos em vez de pedras, e usavam piche como argamassa”, como faziam os construtores babilônios. A cidade se chamou Babel, “porque ali o SENHOR confundiu a língua de toda a terra”. Anrafel, “rei de Sinar”, marchou com Quedorlaomer contra as cidades da planície; a identificação com Hamurabi, outrora popular, já não é aceita. O saque de Acã em Jericó foi “uma bela capa babilônica”, em hebraico um manto de Sinar."
    - "Mais tarde o nome representa a terra do exílio. Nabucodonosor levou os utensílios do Templo “para a terra de Sinar, para a casa do seu deus”; Isaías promete reunir o remanescente “de Sinar”; e na visão de Zacarias a mulher chamada Maldade é levada “para a terra de Sinar” para ter ali uma casa. O grande zigurate da Babilônia, Etemenanki, reconstruído por Nabopolassar e Nabucodonosor e descrito por Heródoto, é o edifício mais ligado à torre; viajantes apontaram por muito tempo, em vez disso, o zigurate em ruínas de Borsipa, Birs Nimrud. A região é o sul do Iraque, onde as ruínas da Babilônia, perto de Hila, foram inscritas pela UNESCO em 2019."
  de:
    - "Schinar ist der biblische Name für Babylonien, die flache Schwemmlandebene des unteren Tigris und Euphrat, die die Mesopotamier selbst Sumer und Akkad nannten. Die Genesis zählt ihre Städte auf: „Babel, Erech, Akkad und Chalne im Lande Sinear“, also Babylon, Uruk (Warka) und Agade, dessen Stätte noch immer nicht gefunden ist; Kalne mag ein Ort sein oder, wie manche den hebräischen Text lesen, „sie alle“. Ägyptische und hethitische Texte des 2. Jahrtausends v. Chr. nennen Babylonien Sangar oder Schanhar, und der biblische Name wird meist auf diese fremde Form zurückgeführt; auch eine Ableitung von „Sumer“ wurde vertreten."
    - "In Schinar fanden die ersten Baumeister „ein ebenes Land im Lande Sinear“ und sagten: „Wohlauf, laßt uns eine Stadt und einen Turm bauen, des Spitze bis an den Himmel reiche“; sie „nahmen Ziegel zu Stein und Erdharz zu Kalk“, wie es babylonische Baumeister taten. Die Stadt hieß Babel, „daß der HERR daselbst verwirrt hatte aller Länder Sprache“. König Amrafel „von Sinear“ zog mit Kedorlaomer gegen die Städte der Ebene; die einst beliebte Gleichsetzung mit Hammurabi wird nicht mehr akzeptiert. Achan sah in Jericho unter dem Raub „einen köstlichen babylonischen Mantel“, hebräisch einen Mantel aus Schinar."
    - "Später steht der Name für das Land des Exils. Nebukadnezar führte die Tempelgefäße „ins Land Sinear in seines Gottes Haus“; Jesaja verheißt, den Rest „von Sinear“ zu sammeln; und in Sacharjas Vision wird die Frau namens Frevel ins „Land Sinear“ gebracht, damit ihr dort „ein Haus gebaut werde“. Die große Zikkurat von Babylon, Etemenanki, von Nabopolassar und Nebukadnezar neu gebaut und von Herodot beschrieben, ist das Bauwerk, das am häufigsten mit dem Turm verbunden wird; Reisende wiesen lange stattdessen auf die ruinöse Zikkurat von Borsippa, Birs Nimrud. Die Region ist der Südirak, wo die Ruinen von Babylon bei Hilla 2019 von der UNESCO eingetragen wurden."
  fr:
    - "Schinear est le nom biblique de la Babylonie, la plaine alluviale plate du bas Tigre et de l’Euphrate que les Mésopotamiens appelaient eux-mêmes Sumer et Akkad. La Genèse en énumère les villes : « Babel, Érec, Accad et Calné, au pays de Schinear » : Babylone, Uruk (Warka) et Agadé, dont le site reste introuvé ; Calné peut être un lieu ou, comme certains lisent l’hébreu, « toutes ». Des textes égyptiens et hittites du IIe millénaire av. J.-C. appellent la Babylonie Sangar ou Shanhar, et le nom biblique se rattache d’ordinaire à cette forme étrangère ; une dérivation de « Sumer » a aussi été soutenue."
    - "À Schinear, les premiers bâtisseurs « trouvèrent une plaine » et dirent : « Bâtissons-nous une ville et une tour dont le sommet touche au ciel » ; « la brique leur servit de pierre, et le bitume leur servit de ciment », comme aux bâtisseurs babyloniens. La ville fut nommée Babel, « car c’est là que l’Éternel confondit le langage de toute la terre ». Amraphel, « roi de Schinear », marcha avec Kedorlaomer contre les villes de la plaine ; l’identification avec Hammurabi, jadis courante, n’est plus admise. Le butin d’Acan à Jéricho comprenait « un beau manteau de Schinear »."
    - "Plus tard, le nom désigne le pays de l’exil. Nebucadnetsar emporta les ustensiles du Temple « au pays de Schinear, dans la maison de son dieu » ; Ésaïe promet de racheter le reste du peuple dispersé « à Schinear » ; et dans la vision de Zacharie la femme nommée Méchanceté est emportée « dans le pays de Schinear » pour y recevoir une maison. La grande ziggourat de Babylone, Etemenanki, rebâtie par Nabopolassar et Nebucadnetsar et décrite par Hérodote, est l’édifice le plus souvent lié à la tour ; les voyageurs désignèrent longtemps plutôt la ziggourat en ruine de Borsippa, Birs Nimrud. La région est le sud de l’Irak, où les ruines de Babylone près de Hilla furent inscrites par l’UNESCO en 2019."
  it:
    - "Sennaar è il nome biblico della Babilonia, la piatta pianura alluvionale del basso Tigri e dell’Eufrate che i Mesopotamici stessi chiamavano Sumer e Accad. La Genesi elenca le sue città come «Babel, Erec, Accad e Calne nel paese di Scinear»: Babilonia, Uruk (Warka) e Agade, il cui sito non è ancora stato trovato; Calne può essere un luogo o, come alcuni leggono l’ebraico, «tutte quante». Testi egizi e ittiti del II millennio a.C. chiamano la Babilonia Sangar o Shanhar, e il nome biblico si fa di solito risalire a quella forma straniera; è stata sostenuta anche una derivazione da «Sumer»."
    - "A Sennaar i primi costruttori «trovarono una pianura» e dissero: «edifichiamoci una città ed una torre di cui la cima giunga fino al cielo»; usarono «mattoni invece di pietre, e di bitume invece di calcina», come facevano i costruttori babilonesi. La città fu chiamata Babele, «perché l’Eterno confuse quivi il linguaggio di tutta la terra». Amrafel, «re di Scinear», marciò con Chedorlaomer contro le città della pianura; l’identificazione con Hammurabi, un tempo popolare, non è più accettata. Il bottino di Acan a Gerico fu «un bel mantello di Scinear»."
    - "In seguito il nome indica la terra dell’esilio. Nabucodonosor portò gli utensili del Tempio «nel paese di Scinear, nella casa del suo dio»; Isaia promette di riscattare il residuo da «Scinear»; e nella visione di Zaccaria la donna chiamata Malvagità è portata «Nel paese di Scinear» perché le si costruisca una casa. La grande ziggurat di Babilonia, Etemenanki, ricostruita da Nabopolassar e da Nabucodonosor e descritta da Erodoto, è l’edificio più spesso collegato con la torre; i viaggiatori hanno a lungo indicato invece la ziggurat in rovina di Borsippa, Birs Nimrud. La regione è l’Iraq meridionale, dove le rovine di Babilonia presso Hilla sono state iscritte dall’UNESCO nel 2019."
  pl:
    - "Szinear to biblijna nazwa Babilonii, płaskiej aluwialnej równiny dolnego Tygrysu i Eufratu, którą sami Mezopotamczycy nazywali Sumerem i Akadem. Księga Rodzaju wymienia jej miasta: „Babel, i Erech, i Achad, i Chalne w ziemi Senaar”: Babilon, Uruk (Warka) i Agade, którego miejsce wciąż nie jest odnalezione; Kalne może być miejscem albo, jak niektórzy czytają hebrajski, „wszystkie one”. Teksty egipskie i hetyckie II tysiąclecia p.n.e. nazywają Babilonię Sangar lub Szanhar i biblijną nazwę zwykle wywodzi się od tej obcej formy; argumentowano też pochodzenie od „Sumeru”."
    - "W Szinear pierwsi budowniczowie „znaleźli równinę w ziemi Senaar” i powiedzieli: „zbudujmy sobie miasto i wieżą, której by wierzch dosięgał do nieba”; „mieli cegłę miasto kamienia, a glinę iłowatą mieli miasto wapna”, jak budowniczowie babilońscy. Miasto nazwano Babel, „iż tam pomieszał Pan język wszystkiej ziemi”. Amrafel, „król Senaarski”, wyruszył z Kedorlaomerem przeciw miastom równiny; utożsamienie z Hammurabim, niegdyś popularne, nie jest już przyjmowane. Łupem Achana w Jerychu był „płaszcz babiloński jeden, piękny”, po hebrajsku płaszcz z Szinear."
    - "Później nazwa oznacza kraj wygnania. Nabuchodonozor zawiózł naczynia Świątyni „do ziemi Senaar, do domu boga swego”; Izajasz obiecuje zgromadzić ostatek „od Senaar”; a w widzeniu Zachariasza kobieta zwana Niegodziwością zostaje uniesiona tam, by dom dla niej stanął „w ziemi Senaar”. Wielka zikkurat Babilonu, Etemenanki, odbudowana przez Nabopolasara i Nabuchodonozora i opisana przez Herodota, to budowla najczęściej łączona z wieżą; podróżnicy długo wskazywali zamiast niej zrujnowaną zikkurat Borsippy, Birs Nimrud. Region to południowy Irak, gdzie ruiny Babilonu koło Hilli wpisano na listę UNESCO w 2019 roku."
  cs:
    - "Šineár je biblické jméno Babylonie, rovinaté nánosové roviny dolního Tigridu a Eufratu, kterou sami Mezopotámci nazývali Sumer a Akkad. Genesis uvádí její města: „Babylon a Erech, Achad a Chalne, v zemi Sinear“: Babylón, Uruk (Varka) a Agade, jejíž místo dosud nebylo nalezeno; Kalne může být místo nebo, jak někteří čtou hebrejský text, „všechna z nich“. Egyptské a chetitské texty 2. tisíciletí př. n. l. nazývají Babylonii Sangar či Šanhar a biblické jméno se obvykle odvozuje z této cizí podoby; argumentovalo se i odvozením od „Sumer“."
    - "V Šineáru první stavitelé „nalezli pole v zemi Sinear“ a řekli: „Nuže, vystavějme sobě město a věži, jejíž by vrch dosahal k nebi“; „měli cihly místo kamení, a zemi lepkou místo vápna“, jak dělali babylónští stavitelé. Město bylo nazváno Bábel, „nebo tu zmátl Hospodin jazyk vší země“. Amrafel, „král Sinearský“, táhl s Kedorlaomerem proti městům roviny; ztotožnění s Chammurapim, kdysi oblíbené, se už nepřijímá. Achanova kořist v Jerichu byl „plášť jeden Babylonský pěkný“, hebrejsky plášť ze Šineáru."
    - "Později jméno označuje zemi vyhnanství. Nebukadnesar odvezl chrámové nádoby „do země Sinear, do domu boha svého“; Izajáš slibuje shromáždit ostatek „od Sinear“; a v Zacharjášově vidění je žena zvaná Bezbožnost odnesena „v zemi Sinear“, aby tam měla dům. Velký zikkurat Babylóna, Etemenanki, přestavěný Nabopolasarem a Nebukadnesarem a popsaný Hérodotem, je stavba nejčastěji spojovaná s věží; cestovatelé dlouho ukazovali raději na zříceninu zikkuratu v Borsippě, Birs Nimrúd. Oblast je jižní Irák, kde byly zříceniny Babylóna poblíž Hilly roku 2019 zapsány UNESCO."
  nl:
    - "Sinear is de bijbelse naam voor Babylonië, de vlakke alluviale vlakte van de benedenloop van Tigris en Eufraat die de Mesopotamiërs zelf Sumer en Akkad noemden. Genesis noemt de steden “Babel, en Erech, en Accad, en Calne in het land Sinear”: Babylon, Uruk (Warka) en Agade, wier plaats nog niet gevonden is; Kalne kan een plaats zijn of, zoals sommigen het Hebreeuws lezen, “allemaal”. Egyptische en Hettitische teksten uit het 2e millennium v.Chr. noemen Babylonië Sangar of Shanhar, en de bijbelse naam wordt meestal tot die vreemde vorm herleid; een afleiding van “Sumer” is ook verdedigd."
    - "Van de eerste bouwers in Sinear, die “een laagte vonden”, heet het: “Kom aan, laat ons voor ons een stad bouwen, en een toren, welks opperste in den hemel zij”; “de tichel was hun voor steen, en het lijm was hun voor leem”, zoals Babylonische bouwers deden. De stad werd Babel genoemd, “want aldaar verwarde de HEERE de spraak der ganse aarde”. Amrafel, “den koning van Sinear”, trok met Kedorlaomer op tegen de steden van de vlakte; de gelijkstelling met Hammurabi, eens populair, wordt niet meer aanvaard. Achans buit te Jericho was “een schoon sierlijk Babylonisch overkleed”, in het Hebreeuws een mantel van Sinear."
    - "Later staat de naam voor het land van de ballingschap. Nebukadnessar voerde de tempelvaten mee en “bracht ze in het land van Sinear, in het huis zijns gods”; Jesaja belooft het overblijfsel te verzamelen “van Sinear”; en in Zacharia’s visioen wordt de vrouw genaamd Goddeloosheid weggevoerd om haar “een huis te bouwen in het land Sinear”. De grote ziggoerat van Babylon, Etemenanki, herbouwd door Nabopolassar en Nebukadnessar en beschreven door Herodotus, is het gebouw dat het vaakst met de toren wordt verbonden; reizigers wezen lang liever naar de verwoeste ziggoerat van Borsippa, Birs Nimrud. De streek is Zuid-Irak, waar de ruïnes van Babylon bij Hillah in 2019 door UNESCO werden ingeschreven."
  sv:
    - "Shinar är Bibelns namn på Babylonien, den platta flodslätten vid nedre Tigris och Eufrat som mesopotamierna själva kallade Sumer och Akkad. Första Moseboken räknar upp dess städer som ”Babel, Erek, Ackad och Kalne, i Sinears land”: Babylon, Uruk (Warka) och Agade, vars läge fortfarande är okänt; Kalne kan vara en ort eller, som vissa läser hebreiskan, ”alla dem”. Egyptiska och hettitiska texter från andra årtusendet f.Kr. kallar Babylonien Sangar eller Shanhar, och det bibliska namnet brukar härledas ur denna främmande form; en härledning från ”Sumer” har också förts fram."
    - "I Shinar ”funno” de första byggarna ”en lågslätt” och sade: ”Kom, låt oss bygga en stad åt oss och ett torn vars spets räcker upp i himmelen”; som babyloniska byggare gjorde: ”Teglet begagnade de såsom sten, och såsom murbruk begagnade de jordbeck”. Staden fick namnet Babel, ”eftersom HERREN där förbistrade hela jordens tungomål”. Amrafel, ”konung i Sinear”, tågade med Kedorlaomer mot slättstäderna; identifieringen med Hammurabi, som en gång var populär, godtas inte längre. Akans byte i Jeriko var ”en dyrbar mantel från Sinear”, på hebreiska en Shinar-mantel."
    - "Senare står namnet för landet i exil. Nebukadnessar förde tempelkärlen ”till Sinears land, in i sin guds hus”; Jesaja lovar att samla kvarlevan från ”Sinear”; och i Sakarjas syn förs kvinnan som kallas Ondskan bort till Sinear för att få ett hus där: ”i Sinears land”. Babylons stora ziggurat, Etemenanki, återuppbyggd av Nabopolassar och Nebukadnessar och beskriven av Herodotos, är den byggnad som oftast har förknippats med tornet; resenärer pekade länge i stället på den förfallna zigguraten i Borsippa, Birs Nimrud. Regionen är södra Irak, där ruinerna av Babylon nära Hilla skrevs in på Unescos världsarvslista 2019."
  nb:
    - "Sinear er Bibelens navn på Babylonia, den flate elvesletten ved nedre Tigris og Eufrat som mesopotamierne selv kalte Sumer og Akkad. Første Mosebok oppregner byene slik: «Babel og Erek og Akkad og Kalne i landet Sinear»: Babylon, Uruk (Warka) og Agade, hvis beliggenhet ennå ikke er funnet; Kalne kan være et sted eller, slik noen leser hebraisken, «dem alle». Egyptiske og hettittiske tekster fra 2. årtusen f.Kr. kaller Babylonia Sangar eller Shanhar, og det bibelske navnet utledes vanligvis av denne fremmede formen; en avledning fra «Sumer» er også blitt hevdet."
    - "I Sinear «fant de en slette», de første byggerne, og sa: «Kom, la oss bygge oss en by med et tårn som når op til himmelen»; de brukte «tegl istedenfor sten, og jordbek istedenfor kalk», slik babylonske byggere gjorde. Byen ble kalt Babel, «for der forvirret Herren hele jordens tungemål». Amrafel, «konge i Sinear», dro med Kedorlaomer mot slettebyene; identifikasjonen med Hammurabi, som en gang var populær, godtas ikke lenger. Akans bytte i Jeriko var «en kostelig babylonisk kappe», på hebraisk en kappe fra Sinear."
    - "Senere står navnet for eksilets land. Nebukadnesar førte tempelkarene «til Sinears land, til sin guds hus»; Jesaja lover at levningen skal reddes fra Sinear; og i Sakarjas syn bæres kvinnen som kalles Ugudeligheten bort til «Sinears land for å bygge et hus for henne der». Babylons store tempeltårn, Etemenanki, gjenreist av Nabopolassar og Nebukadnesar og beskrevet av Herodot, er bygningen som oftest knyttes til tårnet; reisende pekte lenge i stedet på den ødelagte ziggurat i Borsippa, Birs Nimrud. Området er det sørlige Irak, der ruinene av Babylon nær Hilla ble tatt opp på UNESCOs liste i 2019."
  tl:
    - "Ang Shinar ay ang pangalan ng Biblia para sa Babilonia, ang patag na kapatagang alubyal ng ibabang Tigris at Eufrates na tinawag mismo ng mga taga-Mesopotamia na Sumer at Akkad. Itinatala ng Genesis ang mga lunsod nito: “ang Babel, at ang Erech, at ang Accad, at ang Calneh, sa lupain ng Shinar”: ang Babilonia, ang Uruk (Warka) at ang Agade, na hindi pa natutuklasan ang kinaroroonan; ang Calneh ay maaaring isang lugar o, ayon sa pagbasa ng ilan sa Hebreo, “silang lahat”. Tinatawag ng mga tekstong Ehipsiyo at Heteo noong ikalawang milenyo BK ang Babilonia na Sangar o Shanhar, at ang pangalang biblikal ay karaniwang ibinabalik sa banyagang anyong iyon; may nagmungkahi ring hango ito sa “Sumer”."
    - "Sa Shinar, ang mga unang magtatayo ay “nakasumpong sila ng isang kapatagan” at nagsabi, “Magtayo tayo ng isang bayan natin at ng isang moog, na ang taluktok niyaon ay aabot hanggang sa langit”; “inari nilang bato ang laryo at ang betun ay inaring argamasa”, gaya ng ginawa ng mga manggagawang Babilonyo. Ang lunsod ay pinangalanang Babel, “sapagka't doon ginulo ng Panginoon ang wika ng buong lupa”. Si Amraphel, “hari sa Shinar”, ay nagmartsa kasama ni Chedorlaomer laban sa mga lunsod ng kapatagan; ang pagkakakilanlan sa kaniya kay Hammurabi, na dating popular, ay hindi na tinatanggap. Ang samsam ni Achan sa Jerico ay “mainam na balabal na yaring Babilonia”, sa Hebreo ay isang balabal ng Shinar."
    - "Pagkaraan, ang pangalan ay tumutukoy sa lupain ng pagkatapon. Dinala ni Nabucodonosor ang mga kasangkapan ng Templo “sa lupain ng Sinar sa bahay ng kaniyang dios”; ipinangako ni Isaias na titipunin ang nalabi “mula sa Sinar”; at sa pangitain ni Zacharias, ang babaing tinatawag na Kasamaan ay dinadala sa “lupain ng Shinar” upang ipagtayo siya roon ng bahay. Ang dakilang ziggurat ng Babilonia, ang Etemenanki, na itinayong muli nina Nabopolasar at Nabucodonosor at inilarawan ni Herodoto, ang gusaling pinakamadalas iugnay sa moog; matagal namang itinuro ng mga manlalakbay ang wasak na ziggurat ng Borsippa, ang Birs Nimrud. Ang rehiyon ay ang timog ng Iraq, kung saan ang mga guho ng Babilonia malapit sa Hilla ay isinama ng UNESCO sa talaan nito noong 2019."
