body:
  en:
    - "This Aphek was a town of Asher in the plain of Acco, listed at the end of the tribe's towns: “Ummah also, and Aphek, and Rehob: twenty and two cities with their villages.” Judges, spelling it Aphik, counts it among the towns whose Canaanite people Asher did not drive out: “nor of Helbah, nor of Aphik, nor of Rehob”. It is usually identified with Tel Afek, also called Tel Kurdani, a mound by the springs of the Na'aman stream east of Kiryat Bialik, south-east of Acre in northern Israel. W. Ewing in the International Standard Bible Encyclopedia instead took the Aphik of Judges to be the Aphek of Joshua 13:4 and suggested, with hesitation, Afqa on the Nahr Ibrahim in Lebanon."
    - "The springs, some thirty of them, feed the Na'aman, the ancient Belus. The round southern mound was a walled town in the Middle Bronze Age and was occupied in the Iron Age; a Hellenistic and Roman town spread to the north and lasted into the eighth century AD. The Crusaders built a fortified mill here, Recordane, named after Kurdani, whose water-driven millstones turned in its lower floor. The site is now the Ein Afek nature reserve."
  ru:
    - "Этот Афек — город Асира на равнине Акко, названный в конце списка городов колена: «Умма, Афек и Рехов: двадцать два города с селами их». Книга Судей называет его среди городов, ханаанских жителей которых Асир не изгнал: «Хелвы, Афека и Рехова». Его обычно отождествляют с Тель-Афеком, или Тель-Курдани, — холмом у источников реки Нааман к востоку от Кирьят-Бялика, к юго-востоку от Акко на севере Израиля. У. Юинг в Международной стандартной библейской энциклопедии, напротив, считал Афек из Книги Судей тем же, что и Афек из Нав 13:4, и осторожно предлагал Афку на реке Нахр-Ибрагим в Ливане."
    - "Источники — их около тридцати — питают Нааман, древний Бел. Круглый южный холм был обнесённым стеной городом в среднем бронзовом веке и был заселён в железном веке; эллинистический и римский город раскинулся к северу и просуществовал до VIII в. н. э. Крестоносцы построили здесь укреплённую мельницу Рекордан, названную по Курдани, жернова которой вращала вода в её нижнем этаже. Ныне это заповедник Эйн-Афек."
  cs:
    - "Tento Afek bylo město Ašeru v rovině Akko, uvedené na konci Ašerových měst: Jozue uvádí Umu, Afek a Rechob mezi dvaadvaceti městy s jejich vesnicemi. Kniha Soudců, kde je hebrejsky psáno Afik, jej počítá mezi města, jejichž kanaánský lid Ašer nevyhnal: „ani Helba, ani Afek, ani Rohob“. Obvykle se ztotožňuje s Tel Afek, zvaným také Tel Kurdani, pahorkem u pramenů potoka Na'aman východně od Kirjat Bialik, jihovýchodně od Akka v severním Izraeli. W. Ewing v International Standard Bible Encyclopedia naopak pokládal Afik ze Soudců za Afek z Joz 13,4 a váhavě navrhl Afku na Nahr Ibrahím v Libanonu."
    - "Prameny, asi třicet jich je, napájejí Na'aman, starověký Belos. Kulatý jižní pahorek byl opevněným městem ve střední době bronzové a byl osídlen i v době železné; helénistické a římské město se rozšířilo na sever a trvalo do osmého století n. l. Křižáci zde vystavěli opevněný mlýn Recordane, pojmenovaný podle Kurdani, v jehož spodním podlaží se otáčely vodou poháněné mlýnské kameny. Místo je dnes přírodní rezervací Ejn Afek."
  uk:
    - "Цей Афек був містом Асіра на рівнині Акко, зазначеним наприкінці переліку міст коліна: «А до того Умма, Афек та Рехоб: двайцять і два городи з їх селами». Книга Суддів, пишучи його Афік, зараховує його до міст, чиїх ханаанських мешканців Асір не вигнав: «Гелвийських, Афеківських та Реховських». Його зазвичай ототожнюють з Тель-Афеком, званим також Тель-Курдані, пагорбом біля джерел потоку Нааман на схід від Кір'ят-Бялика, на південний схід від Акри на півночі Ізраїлю. В. Юїнг в International Standard Bible Encyclopedia натомість вважав Афік із Суддів Афеком з Ісуса Навина 13:4 і з ваганнями запропонував Афку на Нагр-Ібрахім у Лівані."
    - "Джерела, близько тридцяти, живлять Нааман, давній Белус. Круглий південний пагорб був обнесеним муром містом середньої бронзової доби й був заселений у залізну добу; елліністичне й римське місто розрослося на північ і проіснувало до VIII ст. н. е. Хрестоносці збудували тут укріплений млин Рекордан, названий за Курдані, у нижньому поверсі якого оберталися водяні жорна. Нині місце — заповідник Ейн-Афек."
  pl:
    - "Ten Afek był miastem Aszera na równinie Akko, wymienionym na końcu miast tego pokolenia: „I Amma, i Afek, i Rohob, miast dwadzieścia i dwa, i wsi ich”. Księga Sędziów, w której Biblia Króla Jakuba pisze Aphik, zalicza go do miast, których kananejską ludność Aszer nie wypędził: „i w Helba, i w Afek, i w Rohob”. Utożsamia się go zwykle z Tel Afek, zwanym też Tel Kurdani, wzgórzem przy źródłach potoku Na'aman na wschód od Kirjat Bialik, na południowy wschód od Akki w północnym Izraelu. W. Ewing w International Standard Bible Encyclopedia uznał natomiast Afek z Księgi Sędziów (Aphik w Biblii Króla Jakuba) za Afek z Joz 13,4 i zasugerował, z wahaniem, Afkę nad Nahr Ibrahim w Libanie."
    - "Źródła, około trzydziestu, zasilają Na'aman, starożytny Belus. Okrągłe południowe wzgórze było miastem obwarowanym w średnim brązie i zamieszkiwane w epoce żelaza; miasto hellenistyczne i rzymskie rozrosło się na północ i przetrwało do VIII wieku n.e. Krzyżowcy zbudowali tu obwarowany młyn, Recordane, nazwany od Kurdaniego, którego wodne kamienie młyńskie obracały się na jego dolnej kondygnacji. Stanowisko jest dziś rezerwatem przyrody Ein Afek."
  es:
    - "Este Afec era una ciudad de Aser en la llanura de Aco, enumerada al final de las ciudades de la tribu: «Abraza también Umma, y Aphec, y Rehob: veinte y dos ciudades con sus aldeas». Jueces, que escribe el nombre Afik, la cuenta entre las ciudades cuyo pueblo cananeo Aser no expulsó: «y en Helba, y en Aphec, y en Rehod». Suele identificarse con Tel Afek, llamado también Tel Kurdani, un montículo junto a los manantiales del arroyo Naamán, al este de Kiryat Bialik, al sureste de Acre, en el norte de Israel. W. Ewing, en la International Standard Bible Encyclopedia, tomó en cambio el Afik de Jueces por el Afec de Josué 13:4 y sugirió, con vacilación, Afqa, en el Nahr Ibrahim, en el Líbano."
    - "Los manantiales, unos treinta, alimentan el Naamán, el antiguo Belo. El montículo redondo del sur fue una ciudad amurallada en el Bronce Medio y estuvo ocupado en la edad del Hierro; una ciudad helenística y romana se extendió al norte y duró hasta el siglo VIII d. C. Los cruzados construyeron aquí un molino fortificado, Recordane, nombrado por Kurdani, cuyas muelas movidas por agua giraban en su planta baja. El lugar es hoy la reserva natural de Ein Afek."
  pt:
    - "Esta Afeque era uma cidade de Aser na planície de Aco, listada no fim das cidades da tribo: “também Umá, e Afeque, e Reobe: vinte e duas cidades com as suas aldeias.” Juízes, que o grafa Aphik, a conta entre as cidades cujos habitantes cananeus Aser não expulsou: “nem de Helba, nem de Afeque, nem de Reobe”. É geralmente identificada com Tel Afek, também chamada Tel Kurdani, um montículo junto às nascentes do riacho Na'aman, a leste de Kiryat Bialik, a sudeste de Acre, no norte de Israel. W. Ewing, na International Standard Bible Encyclopedia, tomou em vez disso a Aphik de Juízes pela Afeque de Josué 13:4 e sugeriu, com hesitação, Afqa, no Nahr Ibrahim, no Líbano."
    - "As nascentes, umas trinta, alimentam o Na'aman, o antigo Belo. O montículo redondo do sul foi uma cidade murada na Idade do Bronze Médio e foi ocupado na Idade do Ferro; uma cidade helenística e romana se estendeu para o norte e durou até o século VIII d.C. Os cruzados construíram aqui um moinho fortificado, Recordane, nome derivado de Kurdani, cujas mós movidas a água giravam em seu andar inferior. O sítio é hoje a Reserva Natural de Ein Afek."
  de:
    - "Dieses Afek war eine Stadt Assers in der Ebene von Akko, am Ende der Städte des Stammes aufgeführt: „und schließt ein Umma, Aphek, Rehob. Zweiundzwanzig Städte und ihre Dörfer.“ Das Richterbuch, das es Aphik schreibt, zählt es zu den Städten, deren kanaanäische Bevölkerung Asser nicht vertrieb: „zu Helba, zu Aphik und zu Rehob“. Es wird gewöhnlich mit Tel Afek identifiziert, auch Tel Kurdani genannt, einem Hügel bei den Quellen des Baches Na'aman östlich von Kirjat Bialik, südöstlich von Akko im Norden Israels. W. Ewing hielt in der International Standard Bible Encyclopedia das Aphik des Richterbuchs stattdessen für das Afek von Josua 13,4 und schlug zögernd Afqa am Nahr Ibrahim im Libanon vor."
    - "Die Quellen, etwa dreißig, speisen den Na'aman, den antiken Belus. Der runde südliche Hügel war in der Mittelbronzezeit eine ummauerte Stadt und in der Eisenzeit bewohnt; eine hellenistische und römische Stadt breitete sich nach Norden aus und bestand bis ins achte Jahrhundert n. Chr. Die Kreuzfahrer errichteten hier eine befestigte Mühle, Recordane, nach Kurdani benannt, deren wassergetriebene Mühlsteine in ihrem Untergeschoss liefen. Die Stätte ist heute das Naturreservat Ein Afek."
  fr:
    - "Cet Aphek était une ville d’Aser dans la plaine d’Acco, citée à la fin des villes de la tribu : « De plus, Umma, Aphek et Rehob. Vingt-deux villes, et leurs villages. » Les Juges, qui écrivent Aphik, le comptent parmi les villes dont Aser ne chassa pas les habitants cananéens : « de Helba, d’Aphik et de Rehob ». On l’identifie d’ordinaire avec Tel Afek, aussi appelé Tel Kurdani, butte près des sources du ruisseau Na’aman, à l’est de Kiryat Bialik, au sud-est d’Acre, dans le nord d’Israël. W. Ewing, dans l’International Standard Bible Encyclopedia, a plutôt tenu l’Aphik des Juges pour l’Aphek de Josué 13:4 et suggéré, avec hésitation, Afqa sur le Nahr Ibrahim, au Liban."
    - "Les sources, une trentaine, alimentent le Na’aman, l’ancien Bélos. La butte ronde du sud fut une ville fortifiée au Bronze moyen et fut occupée à l’âge du Fer ; une ville hellénistique et romaine s’étendit au nord et dura jusqu’au VIIIe siècle apr. J.-C. Les croisés y bâtirent un moulin fortifié, Recordane, nommé d’après Kurdani, dont les meules mues par l’eau tournaient à l’étage inférieur. Le site est aujourd’hui la réserve naturelle d’Ein Afek."
  it:
    - "Questa Afek era una città di Aser nella piana di Acco, elencata alla fine delle città della tribù: «Ummah, Afek e Rehob: ventidue città e i loro villaggi». I Giudici, che la scrivono Afik, la annoverano tra le città i cui abitanti cananei Aser non cacciò: «di Helba, di Afik, di Rehob». È di solito identificata con Tel Afek, detta anche Tel Kurdani, un tell presso le sorgenti del torrente Naaman a est di Kiryat Bialik, a sud-est di Acri, nel nord di Israele. W. Ewing, nella International Standard Bible Encyclopedia, ritenne invece che l’Afik dei Giudici fosse l’Afek di Giosuè 13,4 e suggerì, con esitazione, Afqa sul Nahr Ibrahim in Libano."
    - "Le sorgenti, una trentina, alimentano il Naaman, l’antico Belo. Il tell meridionale, di forma circolare, fu una città murata nella media età del Bronzo e fu abitato nell’età del Ferro; una città ellenistica e romana si estese a nord e durò fino all’VIII secolo d.C. I Crociati vi costruirono un mulino fortificato, Recordane, dal nome di Kurdani, le cui macine azionate dall’acqua giravano al piano inferiore. Il sito è oggi la riserva naturale di Ein Afek."
  nl:
    - "Dit Afek was een stad van Aser in de vlakte van Akko, vermeld aan het einde van de steden van de stam: “En Umma, en Afek, en Rehob; twee en twintig steden en haar dorpen.” Richteren, dat het Afik spelt, rekent het tot de steden wier Kanaänitische bevolking Aser niet verdreef: “noch Chelba, noch Afik, noch Rechob”. Het wordt gewoonlijk vereenzelvigd met Tel Afek, ook Tel Kurdani genoemd, een heuvel bij de bronnen van de Na'aman-beek ten oosten van Kiryat Bialik, ten zuidoosten van Akko in het noorden van Israël. W. Ewing hield in de International Standard Bible Encyclopedia het Afik van Richteren daarentegen voor het Afek van Jozua 13:4 en suggereerde aarzelend Afqa aan de Nahr Ibrahim in Libanon."
    - "De bronnen, zo'n dertig, voeden de Na'aman, de antieke Belus. De ronde zuidelijke heuvel was in de midden-bronstijd een ommuurde stad en was in de ijzertijd bewoond; een hellenistische en Romeinse stad breidde zich naar het noorden uit en bestond tot in de achtste eeuw n.Chr. De kruisvaarders bouwden hier een versterkte molen, Recordane, genoemd naar Kurdani, waarvan de door water aangedreven molenstenen op de benedenverdieping draaiden. De plaats is nu het natuurreservaat Ein Afek."
  sv:
    - "Detta Afek var en stad i Asher på Ackos slätt, upptagen sist bland stammens städer: ”Umma, Afek och Rehob – tjugutvå städer med deras byar.” Domarboken, som skriver Afik, räknar den bland de städer vars kananeiska folk Asher inte fördrev: ”Helba, Afik och Rehob”. Den identifieras vanligen med Tel Afek, även kallad Tel Kurdani, en kulle vid källorna till bäcken Na'aman öster om Kiryat Bialik, sydost om Akko i norra Israel. W. Ewing i International Standard Bible Encyclopedia ansåg i stället att Afik i Domarboken är Afek i Josua 13:4 och föreslog, tveksamt, Afqa vid Nahr Ibrahim i Libanon."
    - "Källorna, omkring trettio till antalet, matar Na'aman, det antika Belus. Den runda södra kullen var en muromgärdad stad under mellersta bronsåldern och var bebodd under järnåldern; en hellenistisk och romersk stad bredde ut sig norrut och bestod in på 700-talet e.Kr. Korsfararna byggde här en befäst kvarn, Recordane, uppkallad efter Kurdani, vars vattendrivna kvarnstenar gick på dess nedre våning. Platsen är nu naturreservatet Ein Afek."
  nb:
    - "Denne Afek var en by i Asjer på Akko-sletten, oppført på slutten av stammens byer: «Dessuten fikk de Umma og Afek og Rehob, i alt to og tyve byer med tilhørende landsbyer.» Dommerboken, som skriver den Afik, regner den blant byene der Asjer ikke drev bort kana'anittene: «Helba og Afik og Rehob». Den identifiseres vanligvis med Tel Afek, også kalt Tel Kurdani, en tell ved kildene til Naaman-bekken øst for Kiryat Bialik, sørøst for Acre i Nord-Israel. W. Ewing i International Standard Bible Encyclopedia tok i stedet Afik i Dommerboken for å være Afek i Josva 13,4 og foreslo, med forbehold, Afqa ved Nahr Ibrahim i Libanon."
    - "Kildene, omtrent tretti i tallet, mater Naaman, det gamle Belus. Den runde sørlige tellen var en befestet by i mellombronsealder og var bebodd i jernalderen; en hellenistisk og romersk by bredte seg mot nord og varte inn på 700-tallet e.Kr. Korsfarerne bygde en befestet mølle her, Recordane, oppkalt etter Kurdani, hvis vanndrevne kvernsteiner gikk i nederste etasje. Stedet er nå naturreservatet Ein Afek."
  tl:
    - "Ang Aphec na ito ay bayan ng Aser sa kapatagan ng Acho, nakalista sa dulo ng mga bayan ng lipi: “Gayon din ang Umma, at Aphek, at Rehob: dalawang pu't dalawang bayan pati ng mga nayon ng mga yaon.” Binibilang ito ng Mga Hukom, na isinusulat itong Aphec, sa mga bayang ang mga Cananeo ay hindi pinalayas ni Aser: “ni ang taga Helba, ni ang taga Aphec, ni ang taga Rehob”. Karaniwang itinutumbas ito sa Tel Afek, tinatawag ding Tel Kurdani, isang burol sa tabi ng mga bukal ng batis ng Na'aman sa silangan ng Kiryat Bialik, sa timog-silangan ng Acre sa hilagang Israel. Itinuring naman ni W. Ewing sa International Standard Bible Encyclopedia na ang Aphec ng Mga Hukom ay ang Aphec ng Josue 13:4 at iminungkahi, nang may pag-aatubili, ang Afqa sa Nahr Ibrahim sa Libano."
    - "Pinapakain ng mga bukal, mga tatlumpu, ang Na'aman, ang sinaunang Belus. Ang bilog na burol sa timog ay bayang may pader noong Gitnang Panahon ng Tanso at tinirhan noong Panahon ng Bakal; kumalat sa hilaga ang bayang Helenistiko at Romano at tumagal hanggang ika-8 siglo AD. Nagtayo rito ang mga Krusado ng nakukutaang gilingan, ang Recordane, na ipinangalan sa Kurdani, na ang mga gilingang bato na pinaikot ng tubig ay umiikot sa ibabang palapag nito. Ang lugar ay ang reserbang pangkalikasan ng Ein Afek ngayon."
  da:
    - "Dette Afek var en by i Aser på Akkos slette, opregnet til sidst i stammens byer: »og Umma og Afek og Rehob; to og tyve Stæder og deres Landsbyer«. Dommerbogen, der staver det Afik, regner det blandt de byer, hvis kana'anæiske folk Aser ikke fordrev: »og Helba og Afik og Rehob«. Det identificeres sædvanligvis med Tel Afek, også kaldet Tel Kurdani, en tell ved kilderne til Na'aman-floden øst for Kiryat Bialik, sydøst for Acre i det nordlige Israel. W. Ewing i International Standard Bible Encyclopedia tog derimod Afik i Dommerbogen for at være Afek i Josva 13,4 og foreslog, med tøven, Afqa ved Nahr Ibrahim i Libanon."
    - "Kilderne, omkring tredive i alt, føder Na'aman, det gamle Belus. Den runde sydlige tell var en befæstet by i mellembronzealderen og var beboet i jernalderen; en hellenistisk og romersk by bredte sig mod nord og bestod ind i 700-tallet e.Kr. Korsfarerne byggede her en befæstet mølle, Recordane, opkaldt efter Kurdani, hvis vanddrevne møllesten drejede i dens nederste etage. Stedet er nu naturreservatet Ein Afek."
  sr:
    - "Овај Афек био је град Асиров на равници Ако, наведен на крају градова племена: „и Ама и Афек и Реов; двадесет и два града са селима својим“. Књига о Судијама, пишући Афик, убраја га међу градове чије Хананеје Асир није истерао: „ни из Хелве, ни из Афика, ни из Реова“. Обично се поистовећује са Тел Афеком, званим и Тел Курдани, хумком поред извора потока Наман источно од Кирјат Бјалика, југоисточно од Акре у северном Израелу. В. Јуинг је у International Standard Bible Encyclopedia уместо тога узео да је Афик из Судија исти што и Афек из Исуса Навина 13,4 и с оклевањем предложио Афку на Нахр Ибрахиму у Ливану."
    - "Извори, њих око тридесет, хране Наман, стари Бел. Округла јужна хумка била је утврђен град у средњем бронзаном добу и била је настањена у гвозденом добу; хеленистички и римски град ширио се на север и трајао до 8. века н. е. Крсташи су овде саградили утврђен млин, Рекордан, назван по Курданију, чији су воденични каменови окретани водом на доњем спрату. Налазиште је сада резерват природе Ејн Афек."
  hu:
    - "Ez az Áfek Áser városa volt az akkói síkságon, a törzs városainak jegyzékében a végén: „És Umma, Afék és Rehób. Huszonkét város és ezeknek falui.” A Bírák könyve, Áfik alakban írva, azon városok között számolja, amelyek kánaáni lakosait Áser nem űzte ki: „sem Helba, sem Afik, sem Rehob lakóit”. Általában a Tel Afekkel, másik nevén Tel Kurdanival azonosítják, az Akkától délkeletre, Izráel északi részén, Kiryat Bialiktól keletre fekvő Na'aman-patak forrásainál álló halommal. W. Ewing az International Standard Bible Encyclopediában ehelyett a Bírák Áfikját a Józsué 13,4 Áfekjével azonosította, és tétován a libanoni Nahr Ibrahim melletti Afqát javasolta."
    - "A forrásokból, amelyekből mintegy harminc van, a Na'aman, az ókori Belus táplálkozik. A kerek déli halom a középső bronzkorban fallal körülvett város volt, a vaskorban is lakták; hellenisztikus és római város terjedt el északra, és a Kr. u. 8. századig fennmaradt. A keresztesek itt erődített malmot építettek, Recordane-t, Kurdani után, amelynek alsó szintjén vízhajtású malomkövek forogtak. A hely ma az Ein Afek természetvédelmi terület."
  fi:
    - "Tämä Afek oli Asserin kaupunki Akkon tasangolla, lueteltuna sukukunnan kaupunkien lopussa: ”Umma, Afek ja Rehob – kaksikymmentä kaksi kaupunkia kylineen.” Tuomarien kirja, joka kirjoittaa nimen Afik, laskee sen kaupunkien joukkoon, joiden kanaanilaista väestöä Asser ei karkoittanut: ”Helban, Afekin ja Rehobin asukkaita”. Se samaistetaan yleensä Tel Afekiin, jota kutsutaan myös Tel Kurdaniksi, Na'aman-puron lähteiden vieressä olevaan kumpuun Kiryat Bialikista itään, Acresta kaakkoon Pohjois-Israelissa. W. Ewing sen sijaan piti International Standard Bible Encyclopediassa Tuomarien kirjan Afikia Joos. 13:4:n Afekina ja ehdotti epäröiden Afqaa Nahr Ibrahimin varrella Libanonissa."
    - "Lähteet, noin kolmekymmentä, ruokkivat Na'amania, muinaista Beluksta. Pyöreä eteläinen kumpu oli keskipronssikaudella muurein ympäröity kaupunki ja asuttu rautakaudella; hellenistinen ja roomalainen kaupunki levisi pohjoiseen ja kesti 700-luvulle jaa. Ristiretkeläiset rakensivat tänne linnoitetun myllyn, Recordanen, joka nimettiin Kurdanin mukaan ja jonka vesikäyttöiset myllynkivet pyörivät sen alakerrassa. Paikka on nykyisin Ein Afekin luonnonpuisto."
  vi:
    - "A-phéc này là một thành của A-se trên đồng bằng A-cô, được liệt kê ở cuối các thành của chi phái: “Lại còn có U-ma, A-phéc, và Rê-hốp”, hết thảy hai mươi hai thành cùng các làng của nó. Sách Các Quan Xét, viết là Aphik, kể nó trong các thành mà A-se không đuổi dân Ca-na-an: “dân ở Hên-ba, dân ở A-phéc hay là dân ở Rê-hốp”. Nó thường được đồng nhất với Tel Afek, còn gọi là Tel Kurdani, một gò bên các mạch nước của suối Na'aman phía đông Kiryat Bialik, phía đông nam Acre ở miền bắc Israel. W. Ewing trong International Standard Bible Encyclopedia lại cho rằng Aphik của sách Các Quan Xét là A-phéc của Giô-suê 13:4 và ngập ngừng đề nghị Afqa trên Nahr Ibrahim ở Li-ban."
    - "Các mạch nước, chừng ba mươi mạch, nuôi suối Na'aman, tức sông Belus thời cổ. Gò tròn phía nam là một thành có tường bao thời Đồ Đồng Giữa và có người ở vào thời Đồ Sắt; một thành thời Hy Lạp hóa và La Mã lan ra phía bắc và tồn tại đến thế kỷ 8. Quân Thập tự chinh xây tại đây một cối xay có công sự, Recordane, đặt theo Kurdani, với những cối đá chạy bằng sức nước quay ở tầng dưới. Địa điểm nay là khu bảo tồn thiên nhiên Ein Afek."
  ro:
    - "Acest Afec era o cetate a lui Așer în câmpia Acoului, înșirată la sfârșitul listei cetăților seminției: „Ama, Afec și Raov cetăți douăzeci și două și satele lor.” Judecătorii, scriindu-l Afik, îl numără printre cetățile ai căror locuitori canaaniți nu au fost alungați de Așer: Așer nu i-a alungat pe locuitorii din Helba, din Afec sau din Rehob. Este identificat de obicei cu Tel Afek, numit și Tel Kurdani, un tell lângă izvoarele pârâului Na'aman, la est de Kiryat Bialik, la sud-est de Acra, în nordul Israelului. W. Ewing, în International Standard Bible Encyclopedia, a socotit în schimb că Afikul din Judecători este Afecul din Iosua 13:4 și a sugerat, cu ezitare, Afqa de pe Nahr Ibrahim, în Liban."
    - "Izvoarele, vreo treizeci la număr, alimentează Na'aman, vechiul Belus. Tellul rotund din sud a fost o cetate cu ziduri în epoca bronzului mijlociu și a fost locuit în epoca fierului; o cetate elenistică și romană s-a întins spre nord și a durat până în secolul al VIII-lea d.Hr. Cruciații au construit aici o moară fortificată, Recordane, după numele Kurdani, ale cărei pietre de moară învârtite de apă se roteau la etajul de jos. Locul este acum rezervația naturală Ein Afek."
  bg:
    - "Този Афек бил град на Асир в равнината на Акон, изброен в края на градовете на племето: „и Ама, и Афек, и Роов, градове двадесет и два, и селата им“. Съдии, изписвайки го Афик, го числи сред градовете, чиито ханаански жители Асир не изгонил: „нито на Хелва, нито на Афек, нито на Роов“. Обикновено се отъждествява с Тел Афек, наричан още Тел Курдани, могила при изворите на потока Нааман, източно от Кирят Биалик, югоизточно от Акре в северен Израил. У. Юинг в „International Standard Bible Encyclopedia“ вместо това взел Афик от Съдии за Афек от Иисус Навин 13:4 и колебливо предложил Афка на Нахр Ибрахим в Ливан."
    - "Изворите, около тридесет на брой, захранват Нааман, древния Белус. Кръглата южна могила била укрепен град през средната бронзова епоха и била обитавана през желязната епоха; елинистически и римски град се разпрострял на север и просъществувал до VIII в. н.е. Кръстоносците построили тук укрепена мелница, Рекордан, наречена по Курдани, чиито воденични камъни, задвижвани от вода, се въртели в долния ѝ етаж. Мястото е днес природният резерват Ейн Афек."
