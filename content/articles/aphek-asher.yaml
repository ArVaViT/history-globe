# Overview article (ADR 0007). The Aphek/Aphik of Asher is usually placed at Tel Afek (Tel Kurdani) in the Acco plain (the map's point); Ewing (ISBE) took the Aphik of Judges for the Aphek of Josh 13:4 and suggested Afqa (see aphek-lebanon.yaml). Not the Apheks of the Sharon (aphek.yaml) or the Golan (aphek-golan.yaml).
