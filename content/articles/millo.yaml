body:
  en:
    - "The Millo was a structure in the City of David whose nature the Bible never explains; the Hebrew word means “filling”. When David took the stronghold of Zion he “built round about from Millo and inward”, or, as Chronicles has it, “from Millo round about”, while Joab restored the rest. Solomon's forced levy built “the house of the LORD, and his own house, and Millo, and the wall of Jerusalem”; the Millo was built after Pharaoh's daughter moved into her house, and it was while “Solomon built Millo, and repaired the breaches of the city of David his father” that Jeroboam, overseer of the labour, lifted his hand against the king. Hezekiah, preparing for Sennacherib, “repaired Millo in the city of David”. The house of Millo at Shechem is a different place, and whether the house of Millo where Joash was murdered was this Millo is not known."
    - "The best guess is that the Millo was an earth-and-stone fill, a terrace or platform that made building possible on the steep eastern ridge. The map keeps three answers: the Stepped Stone Structure, the City of David as a whole, and simply Jerusalem. Many identify it with the Stepped Stone Structure, the great mantle of stone laid over terraces on the ridge's eastern slope above the Gihon spring and excavated by Kathleen Kenyon, Yigal Shiloh and Eilat Mazar; when it was built, in the Late Bronze or the Iron Age, is debated, as is whether the large building Mazar found above it is David's palace. Others take the Millo to be the fill of the saddle between the City of David and the Temple Mount, the Ophel, which Solomon needed to join his palace to the Temple, or leave it somewhere in the city unlocated."
    - "The Stepped Stone Structure can be seen today in the City of David archaeological park south of the Temple Mount, with the remains of later houses built into its face."
  ru:
    - "Милло — сооружение в городе Давидовом, природу которого Библия нигде не объясняет; еврейское слово значит «насыпь, заполнение». Взяв крепость Сион, Давид «обстроил кругом от Милло и внутри», или, как говорит книга Паралипоменон, «начиная от Милло, всю окружность», а Иоав возобновил остальное. Подать, наложенная Соломоном, пошла на то, «чтобы построить храм Господень и дом свой, и Милло, и стену Иерусалимскую»; Милло построили после того, как дочь фараона перешла в свой дом, и именно когда «Соломон строил Милло, починивал повреждения в городе Давида, отца своего», Иеровоам, надзиравший за работами, поднял руку на царя. Езекия, готовясь к приходу Сеннахирима, «укрепил Милло в городе Давидовом». Дом Милло в Сихеме — другое место, а был ли дом Милло, где убили Иоаса, этим Милло, неизвестно."
    - "Вероятнее всего, Милло было насыпью из земли и камня, террасой или площадкой, позволявшей строить на крутом восточном гребне. Карта хранит три ответа: Ступенчатое каменное сооружение, город Давидов в целом и просто Иерусалим. Многие отождествляют Милло со Ступенчатым каменным сооружением — огромной каменной одеждой, уложенной поверх террас на восточном склоне гребня над источником Гион и раскопанной Кэтлин Кеньон, Игалем Шило и Эйлат Мазар; когда её возвели, в позднем бронзовом или в железном веке, спорно, как спорно и то, дворец ли Давида большое здание, найденное Мазар над ней. Другие считают Милло насыпью седловины между городом Давидовым и Храмовой горой, Офелом, которая была нужна Соломону, чтобы соединить дворец с Храмом, или оставляют его место в городе неопределённым."
    - "Ступенчатое каменное сооружение можно увидеть сегодня в археологическом парке «Город Давида» к югу от Храмовой горы, с остатками позднейших домов, встроенных в его склон."
  uk:
    - "Мілло було спорудою в Місті Давида, природу якої Біблія ніколи не пояснює; староєврейське слово означає «наповнення». Коли Давид узяв твердиню Сіон, він «утвердив його Давид навкруги, почавши від долини Милло, і з середини», або, як у Книзі Хронік, «забудував він місто навкруги, починаючи від долини Милло», а Йоав відновив решту. Примусова повинність Соломона будувала «щоб вибудовувати храм Господень і свою палату, і міст (над пропасттю) Милло й мур Ерусалимський»; Мілло було збудоване після того, як дочка фараона перейшла до свого дому, і саме тоді, коли «Соломон будував Милло та починив деякі ушкоди в городї Давида, батька свого», Єровоам, наглядач над працею, підняв руку на царя. Єзекія, готуючись до Сінаххеріба, «укріпив Милло в містї Давидовому». Дім Мілло в Сихемі — інше місце, а чи був дім Мілло, де вбили Йоаса, саме цим Мілло, невідомо."
    - "Найкраща здогадка — що Мілло було насипом із землі й каменю, терасою чи платформою, яка уможливила будівництво на крутому східному гребені. Мапа тримає три відповіді: Кам’яна ступінчаста споруда, Місто Давида загалом і просто Єрусалим. Багато хто ототожнює його з Кам’яною ступінчастою спорудою, великою кам’яною мантією, накладеною на тераси східного схилу гребеня над джерелом Гіхон і розкопаною Кетлін Кенйон, Ігалом Шило та Ейлат Мазар; коли вона була збудована, у пізню бронзову чи залізну добу, є предметом суперечки, як і те, чи велика будівля, яку Мазар знайшла над нею, є палацом Давида. Інші вважають Мілло насипом сідловини між Містом Давида і Храмовою горою, Офелом, який Соломонові був потрібен, щоб з’єднати свій палац із храмом, або залишають його десь у місті невстановленим."
    - "Кам’яну ступінчасту споруду можна побачити сьогодні в археологічному парку Міста Давида на південь від Храмової гори, з рештками пізніших будинків, вбудованих у її поверхню."
  es:
    - "El Milo era una estructura de la Ciudad de David cuya naturaleza la Biblia nunca explica; la palabra hebrea significa «relleno». Cuando David tomó la fortaleza de Sion, «edificó alrededor, desde Millo para adentro», o, como dice Crónicas, «desde Millo hasta la cerca», mientras Joab restauraba el resto. La leva forzosa de Salomón edificó «la casa de Jehová, y su casa, y á Millo, y el muro de Jerusalem»; el Milo se construyó después de que la hija del faraón se trasladara a su casa, y fue mientras «Salomón edificando á Millo, cerró el portillo de la ciudad de David su padre» cuando Jeroboam, capataz de los trabajos, alzó la mano contra el rey. Ezequías, preparándose para Senaquerib, «fortificó además á Millo en la ciudad de David». La casa de Milo en Siquem es un lugar distinto, y no se sabe si la casa de Milo donde fue asesinado Joás era este Milo."
    - "La mejor conjetura es que el Milo era un relleno de tierra y piedra, una terraza o plataforma que permitía construir en la empinada cresta oriental. El mapa mantiene tres respuestas: la Estructura de Piedras Escalonadas, la Ciudad de David en su conjunto y, simplemente, Jerusalén. Muchos lo identifican con la Estructura de Piedras Escalonadas, el gran manto de piedra sobre terrazas en la ladera oriental de la cresta, sobre el manantial de Gihón, y excavado por Kathleen Kenyon, Yigal Shiloh y Eilat Mazar; cuándo se construyó, en el Bronce Final o en la Edad del Hierro, se discute, y también si el gran edificio que Mazar halló sobre ella es el palacio de David. Otros toman el Milo por el relleno de la hondonada entre la Ciudad de David y el Monte del Templo, el Ofel, que Salomón necesitaba para unir palacio y Templo, o lo dejan en un lugar sin localizar."
    - "La Estructura de Piedras Escalonadas puede verse hoy en el parque arqueológico de la Ciudad de David, al sur del Monte del Templo, con los restos de casas posteriores construidas en su frente."
  pt:
    - "O Milo era uma estrutura na Cidade de Davi cuja natureza a Bíblia nunca explica; a palavra hebraica significa “preenchimento”. Quando Davi tomou a fortaleza de Sião, “construiu em redor, desde o Milo e para dentro”, ou, como dizem as Crônicas, “desde Milo até o entorno”, enquanto Joabe restaurou o resto. O trabalho forçado de Salomão construiu “a casa do SENHOR, a sua própria casa, o Milo, a muralha de Jerusalém”; o Milo foi construído depois que a filha do faraó passou para sua casa, e foi quando “Salomão construiu Milo e reparou a brecha da cidade de Davi, seu pai” que Jeroboão, supervisor do trabalho, levantou a mão contra o rei. Ezequias, preparando-se para Senaqueribe, “fortaleceu Milo na cidade de Davi”. A casa de Milo em Siquém é um lugar diferente, e não se sabe se a casa de Milo onde Joás foi assassinado era este Milo."
    - "O melhor palpite é que o Milo era um aterro de terra e pedra, um terraço ou plataforma que tornou possível construir na íngreme crista oriental. O mapa mantém três respostas: a Estrutura de Pedras Escalonadas, a Cidade de Davi como um todo e simplesmente Jerusalém. Muitos o identificam com a Estrutura de Pedras Escalonadas, o grande manto de pedra assentado sobre terraços na encosta oriental da crista acima da fonte de Giom e escavado por Kathleen Kenyon, Yigal Shiloh e Eilat Mazar; quando foi construída, no Bronze Recente ou na Idade do Ferro, é debatido, assim como se o grande edifício que Mazar achou acima dela é o palácio de Davi. Outros tomam o Milo pelo aterro da sela entre a Cidade de Davi e o Monte do Templo, o Ofel, de que Salomão precisava para unir seu palácio ao Templo, ou o deixam em algum ponto não localizado da cidade."
    - "A Estrutura de Pedras Escalonadas pode ser vista hoje no parque arqueológico da Cidade de Davi, ao sul do Monte do Templo, com os restos de casas posteriores construídas em sua face."
  de:
    - "Das Millo war ein Bauwerk in der Stadt Davids, dessen Art die Bibel nie erklärt; das hebräische Wort bedeutet „Füllung“. Als David die Burg Zion einnahm, heißt es: „David baute ringsumher von Millo an einwärts“, bei der Chronik „von Millo an bis ganz umher“, während Joab den Rest wiederherstellte. Salomos Fronleute bauten „des HERRN Haus und sein Haus und Millo und die Mauer Jerusalems“; das Millo entstand, nachdem die Tochter des Pharao in ihr Haus gezogen war, und als „Salomo Millo baute, verschloß er die Lücke an der Stadt Davids, seines Vaters“, hob Jerobeam, Aufseher der Fronarbeit, die Hand gegen den König. Hiskia, der sich auf Sanherib vorbereitete, „befestigte Millo an der Stadt Davids“. Das Haus Millo in Sichem ist ein anderer Ort, und ob das Haus Millo, in dem Joas ermordet wurde, dieser Millo war, ist nicht bekannt."
    - "Die beste Vermutung ist, dass das Millo eine Erd- und Steinaufschüttung war, eine Terrasse oder Plattform, die das Bauen am steilen Osthang ermöglichte. Die Karte führt drei Antworten: die Stufensteinstruktur, die Stadt Davids als Ganzes und schlicht Jerusalem. Viele setzen es mit der Stufensteinstruktur gleich, dem großen Steinmantel über Terrassen am Osthang des Rückens oberhalb der Gihonquelle, ausgegraben von Kathleen Kenyon, Yigal Shiloh und Eilat Mazar; wann sie gebaut wurde, in der Spätbronze- oder der Eisenzeit, ist umstritten, ebenso, ob das große Gebäude, das Mazar darüber fand, Davids Palast ist. Andere halten das Millo für die Aufschüttung des Sattels zwischen der Stadt Davids und dem Tempelberg, dem Ofel, den Salomo brauchte, um seinen Palast mit dem Tempel zu verbinden, oder lassen es irgendwo in der Stadt unlokalisiert."
    - "Die Stufensteinstruktur ist heute im archäologischen Park der Stadt Davids südlich des Tempelbergs zu sehen, mit den Resten späterer Häuser, die in ihre Front gebaut wurden."
  fr:
    - "Le Millo était une structure de la Cité de David dont la Bible n’explique jamais la nature ; le mot hébreu signifie « remplissage ». Quand David prit la forteresse de Sion, « il fit de tous côtés des constructions, en dehors et en dedans de Millo », ou, comme le dit le Chroniqueur, « depuis Millo et aux environs », tandis que Joab restaura le reste. La corvée de Salomon bâtit « la maison de l’Éternel et sa propre maison, Millo, et le mur de Jérusalem » ; le Millo fut bâti après que la fille de Pharaon eut gagné sa maison, et c’est tandis que « Salomon bâtissait Millo, et fermait la brèche de la cité de David, son père » que Jéroboam, surveillant des travaux, leva la main contre le roi. Ézéchias, se préparant contre Sanchérib, « fortifia Millo dans la cité de David ». La maison de Millo à Sichem est un autre lieu, et on ignore si la maison de Millo où Joas fut assassiné était ce Millo."
    - "La meilleure hypothèse est que le Millo était un remblai de terre et de pierres, terrasse ou plate-forme rendant possible la construction sur la pente raide de la crête orientale. La carte garde trois réponses : la structure à gradins de pierre, la Cité de David dans son ensemble, et simplement Jérusalem. Beaucoup y voient la structure à gradins de pierre, grand manteau de pierre posé sur des terrasses au flanc oriental de la crête, au-dessus du Guihon, fouillé par Kathleen Kenyon, Yigal Shiloh et Eilat Mazar ; sa date, Bronze récent ou âge du Fer, est débattue, tout comme celle du grand édifice que Mazar a trouvé au-dessus, palais de David ou non. D’autres y voient le remblai de la selle entre la Cité de David et le mont du Temple, l’Ophel, que Salomon devait combler pour relier son palais au Temple, ou le laissent non localisé dans la ville."
    - "La structure à gradins de pierre peut se voir aujourd’hui dans le parc archéologique de la Cité de David, au sud du mont du Temple, avec les restes de maisons plus tardives bâties contre sa face."
  it:
    - "Il Millo era una struttura della Città di Davide la cui natura la Bibbia non spiega mai; la parola ebraica significa «riempimento». Quando Davide prese la fortezza di Sion, «vi fece attorno delle costruzioni cominciando da Millo, e nell’interno», o, come dicono le Cronache, «cominciando da Millo, e tutto all’intorno», mentre Ioab restaurò il resto. La comandata di Salomone costruì «la casa dell’Eterno e la sua propria casa, Millo e le mura di Gerusalemme»; il Millo fu costruito dopo che la figlia del faraone si fu trasferita nella sua casa, e fu mentre «Salomone costruiva Millo e chiudeva la breccia della città di Davide suo padre» che Geroboamo, sovrintendente ai lavori, alzò la mano contro il re. Ezechia, preparandosi a Sennacherib, «fortificò Millo nella città di Davide». La casa di Millo a Sichem è un luogo diverso, e non si sa se quella dove fu assassinato Ioas fosse questo Millo."
    - "L’ipotesi migliore è che il Millo fosse un riempimento di terra e pietre, una terrazza o piattaforma che rese possibile costruire sul ripido crinale orientale. La mappa conserva tre risposte: la Struttura a gradini di pietra, la Città di Davide nel suo insieme, e semplicemente Gerusalemme. Molti lo identificano con la Struttura a gradini di pietra, il grande rivestimento di pietra su terrazze sul pendio orientale del crinale sopra la sorgente di Ghicon, scavato da Kathleen Kenyon, Yigal Shiloh ed Eilat Mazar; quando fu costruita, nel Bronzo Tardo o nell’età del Ferro, è discusso, come lo è che il grande edificio trovato sopra di essa dalla Mazar sia il palazzo di Davide. Altri vi vedono il riempimento della sella tra la Città di Davide e il Monte del Tempio, l’Ofel, necessario a Salomone per unire il suo palazzo al Tempio, o lo lasciano non localizzato nella città."
    - "La Struttura a gradini di pietra si può vedere oggi nel parco archeologico della Città di Davide a sud del Monte del Tempio, con i resti di case più tarde costruite sulla sua facciata."
  pl:
    - "Millo było budowlą w Mieście Dawida, której natury Biblia nigdy nie wyjaśnia; hebrajskie słowo znaczy „wypełnienie”. Gdy Dawid zdobył twierdzę Syjon, „pobudował je Dawid wszędy w koło od Mello, i wewnątrz”, albo, jak ma Księga Kronik, „od Mello aż w okrąg”, a Joab odbudował resztę. Przymusowy pobór Salomona był po to, „aby zbudował dom Pański, i dom swój, i Mello, i mury Jeruzalemskie”; Millo zbudowano po przeprowadzce córki faraona do jej domu i właśnie gdy „Salomon zbudowawszy Mello, zaprawił dziurę w mieście Dawida, ojca swego”, Jeroboam, nadzorca robót, podniósł rękę przeciw królowi. Ezechiasz, przygotowując się na Sennacheryba, „zmocnił Mello w mieście Dawidowem”. Dom Millo w Sychem to inne miejsce, a nie wiadomo, czy dom Millo, w którym zamordowano Joasza, był tym Millo."
    - "Najlepszy domysł jest taki, że Millo było wypełnieniem z ziemi i kamienia, tarasem lub platformą umożliwiającą budowę na stromym wschodnim grzbiecie. Mapa zachowuje trzy odpowiedzi: Strukturę Schodkowych Kamieni, Miasto Dawida jako całość i po prostu Jerozolimę. Wielu utożsamia je ze Strukturą Schodkowych Kamieni, wielkim płaszczem kamienia na tarasach wschodniego zbocza grzbietu nad źródłem Gichon, wykopywanym przez Kathleen Kenyon, Yigala Shiloha i Eilat Mazar; kiedy go zbudowano, w późnej epoce brązu czy w epoce żelaza, jest przedmiotem sporu, podobnie jak to, czy duży budynek, który Mazar znalazła nad nim, jest pałacem Dawida. Inni uważają Millo za wypełnienie siodła między Miastem Dawida a Górą Świątynną, Ofelem, którego Salomon potrzebował, by połączyć pałac ze Świątynią, albo zostawiają je gdzieś w mieście bez lokalizacji."
    - "Strukturę Schodkowych Kamieni można dziś zobaczyć w parku archeologicznym Miasta Dawida na południe od Góry Świątynnej, z resztkami późniejszych domów wbudowanych w jej lico."
  nl:
    - "De Millo was een bouwwerk in de Stad van David waarvan de aard door de Bijbel nooit wordt uitgelegd; het Hebreeuwse woord betekent “opvulling”. Toen David de burcht Sion innam: “David bouwde rondom van Millo af en binnenwaarts”, of zoals Kronieken het heeft, “hij bouwde de stad rondom, van Millo af, en rondom henen”, terwijl Joab de rest herstelde. Salomo's dwangarbeid diende “om het huis des HEEREN te bouwen, en zijn huis, en Millo, en den muur van Jeruzalem”; de Millo werd gebouwd nadat de dochter van de farao naar haar huis was verhuisd, en terwijl “Salomo bouwde Millo, en sloot de breuk der stad van zijn vader David toe”, hief Jerobeam, opziener van de arbeid, de hand tegen de koning op. Chizkia, ter voorbereiding op Sanherib, “versterkte Millo in de stad Davids”. Het huis van Millo bij Sichem is een andere plaats, en of dat waar Joas werd vermoord deze Millo was, is onbekend."
    - "De beste gok is dat de Millo een aarde-en-steenvulling was, een terras of platform dat bouwen op de steile oostelijke bergrug mogelijk maakte. De kaart houdt drie antwoorden: de Stenen Trapstructuur, de Stad van David als geheel, en eenvoudig Jeruzalem. Velen identificeren haar met de Stenen Trapstructuur, de grote mantel van steen over terrassen op de oosthelling van de rug boven de bron Gihon, opgegraven door Kathleen Kenyon, Yigal Shiloh en Eilat Mazar; wanneer die werd gebouwd, in de late bronstijd of de ijzertijd, wordt betwist, evenals of het grote gebouw dat Mazar erboven vond Davids paleis is. Anderen houden de Millo voor de opvulling van het zadel tussen de Stad van David en de Tempelberg, de Ofel, die Salomo nodig had om zijn paleis met de tempel te verbinden, of laten haar ergens in de stad ongelokaliseerd."
    - "De Stenen Trapstructuur is tegenwoordig te zien in het archeologisch park van de Stad van David ten zuiden van de Tempelberg, met de resten van latere huizen die in haar voorzijde zijn gebouwd."
  cs:
    - "Milo bylo zařízení ve Městě Davidově, jehož povahu Bible nikdy nevysvětluje; hebrejské slovo znamená „výplň“. Když David dobyl pevnost Sijón, „vystavěl je David vůkol od Mello až do vnitřku“, nebo, jak praví Kroniky, „vystavěl město vůkol a vůkol, od Mello až do okolku“, kdežto Joáb opravil zbytek. Šalomounova robota sloužila k tomu, „aby stavěl dům Hospodinův a dům svůj, a Mello i zdi Jeruzalémské“; Milo bylo vystavěno poté, co se dcera faraonova přestěhovala do svého domu, a právě když „vystavěv Šalomoun Mello, zavřel mezeru města Davidova otce svého“, pozdvihl Jarobeám, dozorce nad prací, ruku proti králi. Chizkijáš, připravující se na Senacheriba, „upevnil i Mello města Davidova“. Dům Milo v Šekemu je jiné místo, a není známo, zda dům Milo, kde byl zavražděn Joaš, je totéž Milo."
    - "Nejlepší dohad je, že Milo byl násyp ze země a kamení, terasa nebo plošina, která umožnila stavět na příkrém východním hřbetu. Mapa uvádí tři odpovědi: Stupňovitou kamennou stavbu, Město Davidovo jako celek a prostě Jeruzalém. Mnozí je ztotožňují se Stupňovitou kamennou stavbou, velkým pláštěm z kamene položeným na terasy na východním svahu hřbetu nad pramenem Gichón a vykopaným Kathleen Kenyonovou, Yigalem Shilohem a Eilat Mazarovou; kdy byla postavena, v pozdní době bronzové nebo v době železné, je sporné, stejně jako to, zda velká budova, kterou nad ní Mazarová našla, je Davidův palác. Jiní pokládají Milo za výplň sedla mezi Městem Davidovým a Chrámovou horou, Ofel, kterou Šalomoun potřeboval ke spojení svého paláce s chrámem, nebo je ponechávají někde ve městě neurčené."
    - "Stupňovitou kamennou stavbu lze dnes vidět v archeologickém parku Města Davidova jižně od Chrámové hory, se zbytky pozdějších domů vestavěných do jejího líce."
  sv:
    - "Millo var en konstruktion i Davids stad vars art Bibeln aldrig förklarar; det hebreiska ordet betyder ”utfyllnad”. När David intog borgen Sion ”uppförde David byggnader runt omkring, från Millo och vidare inåt”, eller, som Krönikeböckerna har det, ”från Millo och allt omkring”, medan Joav återställde resten. Salomos arbetsfolk byggde ”HERRENS hus och hans eget hus och Millo, ävensom Jerusalems murar”; Millo byggdes sedan faraos dotter flyttat in i sitt hus, och när ”Salomo byggde då på Millo; han ville befästa det blottade stället på sin fader Davids stad”, lyfte Jerobeam, arbetets uppsyningsman, handen mot kungen. Hiskia, som rustade sig mot Sanherib, ”befäste Millo i Davids stad”. Millohuset i Shekem är en annan plats, och huruvida Millohuset där Joash mördades var detta Millo är inte känt."
    - "Den bästa gissningen är att Millo var en fyllning av jord och sten, en terrass eller plattform som möjliggjorde byggande på den branta östra åsen. Kartan behåller tre svar: Stepped Stone Structure, Davids stad som helhet och helt enkelt Jerusalem. Många identifierar det med Stepped Stone Structure, det stora stenmantlet lagt över terrasser på åsens östra sluttning ovanför Gihonkällan och utgrävt av Kathleen Kenyon, Yigal Shiloh och Eilat Mazar; när den byggdes, under yngre bronsåldern eller järnåldern, är omdebatterat, liksom om den stora byggnad Mazar fann ovanför den är Davids palats. Andra tar Millo för fyllningen i sadeln mellan Davids stad och Tempelberget, Ofel, som Salomo behövde för att förena sitt palats med templet, eller lämnar det någonstans i staden olokaliserat."
    - "Stepped Stone Structure kan ses i dag i den arkeologiska parken Davids stad söder om Tempelberget, med lämningar av senare hus inbyggda i dess framsida."
  nb:
    - "Millo var en konstruksjon i Davidsbyen hvis natur Bibelen aldri forklarer; det hebraiske ordet betyr «fylling». Da David inntok Sions borg, «bygget rundt omkring fra Milo og innover», eller, som Krønikebøkene har det, «fra Millo og rundt omkring», mens Joab gjenreiste resten. Salomos pliktarbeidere bygde «Herrens hus og sitt eget hus og Millo og Jerusalems murer»; Millo ble bygget etter at faraos datter flyttet inn i sitt hus, og det var mens «Salomo bygget på Millo - han vilde lukke det åpne sted i sin far Davids stad» at Jeroboam, tilsynsmann for arbeidet, løftet hånd mot kongen. Hiskia, som forberedte seg på Sankerib, «satte også Millo i Davids stad i fast stand». Millo-huset i Sikem er et annet sted, og om Millo-huset der Joasj ble myrdet, var denne Millo, er ikke kjent."
    - "Det beste gjettet er at Millo var en fylling av jord og stein, en terrasse eller plattform som gjorde det mulig å bygge på den bratte østlige ryggen. Kartet beholder tre svar: Stepped Stone Structure, hele Davidsbyen, og ganske enkelt Jerusalem. Mange identifiserer den med Stepped Stone Structure, den store steinkappen lagt over terrasser på ryggens østlige skråning over Gihon-kilden og utgravd av Kathleen Kenyon, Yigal Shiloh og Eilat Mazar; når den ble bygget, i senbronsealderen eller jernalderen, er omdiskutert, likesom om den store bygningen Mazar fant over den er Davids palass. Andre tar Millo for å være fyllingen i sadelen mellom Davidsbyen og Tempelhøyden, Ofel, som Salomo trengte for å forbinde sitt palass med tempelet, eller lar den ligge et sted i byen uten å være lokalisert."
    - "Stepped Stone Structure kan sees i dag i den arkeologiske parken i Davidsbyen sør for Tempelhøyden, med restene av senere hus bygget inn i dens flate."
  tl:
    - "Ang Millo ay istruktura sa Bayan ni David na hindi ipinaliwanag ng Biblia; ang salitang Hebreo ay “pagpuno”. Nang kunin ni David ang kuta ng Sion, “itinayo ni David ang kuta sa palibot mula sa Millo, at sa loob”, o, sa Mga Cronica, “mula sa Millo hanggang sa palibot”, habang inayos ni Joab ang nalabi. Itinayo ng sapilitang paggawa ni Salomon ang “bahay ng Panginoon at ang kaniyang bahay, at ang Millo at ang kuta sa Jerusalem”; itinayo ang Millo pagkalipat ng anak ni Faraon sa kaniyang bahay, at habang “itinayo ni Salomon ang Millo at hinusay ang sira ng bayan ni David na kaniyang ama” itinaas ni Jeroboam, tagapamahala ng paggawa, ang kamay laban sa hari. Si Ezechias, na naghahanda laban kay Sennacherib, ay “pinagtibay ang Millo sa bayan ni David”. Ibang lugar ang bahay ng Millo sa Sichem, at hindi alam kung ito ang bahay ng Millo kung saan pinatay si Joas."
    - "Ang pinakamahusay na hula: ang Millo ay pagpuno ng lupa at bato, terasa o plataporma na nagpapahintulot magtayo sa matarik na silangang tagaytay. Pinananatili ng mapa ang tatlong sagot: ang Hagdang Batong Istruktura, ang Bayan ni David sa kabuuan, at Jerusalem lamang. Maraming kumikilala rito sa Hagdang Batong Istruktura, ang malaking balabal na bato sa mga terasa ng silangang dalisdis ng tagaytay sa itaas ng bukal ng Gihon, hinukay nina Kathleen Kenyon, Yigal Shiloh at Eilat Mazar; pinagtatalunan kung kailan ito itinayo, sa Huling Panahon ng Tanso o Panahon ng Bakal, gayundin kung palasyo ni David ang malaking gusaling natagpuan ni Mazar sa itaas nito. Para sa iba, pagpuno ng mababang bahagi ng tagaytay ang Millo sa pagitan ng Bayan ni David at ng Bundok ng Templo, ang Ophel, na kailangan ni Salomon upang ugnayin ang palasyo at Templo, o iniiwan itong di-natutukoy sa lungsod."
    - "Makikita ngayon ang Hagdang Batong Istruktura sa liwasang arkeolohikal ng Bayan ni David sa timog ng Bundok ng Templo, na may mga labi ng mas huling mga bahay na itinayo sa harapan nito."
