body:
  en:
    - "Daberath was a town of Issachar at the western foot of Mount Tabor, on the border with Zebulun, which Joshua draws from Sarid “eastward toward the sunrising unto the border of Chisloth-tabor, and then goeth out to Daberath, and goeth up to Japhia”. It was given to the Levites of the family of Gershon: “out of the tribe of Issachar, Kishon with her suburbs, Dabareh with her suburbs”, a grant Chronicles repeats. The name lives on in Daburiyya, the Arab village at Tabor's foot, and the ancient site is the ruin of Horvat Devora beside it; a few have equated Daberath with Rabbith, another town of Issachar, which the map keeps as a second candidate."
    - "Josephus knew the village as Dabaritta, in the Great Plain on the edge of Galilee: at the outbreak of the revolt in AD 66 its young men robbed the baggage of the wife of Ptolemy, King Agrippa's steward, and brought the spoil to Josephus at Tarichaeae, which nearly cost him his command. Eusebius lists Dabira as a village of Jews on Mount Tabor in the district of Diocaesarea, that is Sepphoris. The ruin has not been systematically excavated; the identification rests on the name and on its fit with Joshua's border."
    - "Today Daburiyya is an Arab town in Israel's Lower Galilee at the foot of the road that climbs Tabor, with the site of Horvat Devora on its outskirts."
  ru:
    - "Давраф — город Иссахара у западного подножия горы Фавор, на границе с Завулоном, которую книга Иисуса Навина ведёт от Сарида «к восточной стороне, к востоку солнца, до предела Кислоф-Фавора; отсюда идет к Даврафу и восходит к Иафии». Он был отдан левитам из рода Гирсона: «от колена Иссахарова: Кишион и предместья его, Давраф и предместья его», и Паралипоменон повторяет это. Имя живёт в Дабурии, арабской деревне у подножия Фавора, а древнее место — развалины Хорват-Девора рядом с ней; немногие отождествляли Давраф с Раввифом, другим городом Иссахара, который на карте отмечен вторым кандидатом."
    - "Иосиф Флавий знал селение как Дабаритту на Великой равнине у края Галилеи: в начале восстания 66 г. н. э. его молодёжь ограбила обоз жены Птолемея, управляющего царя Агриппы, и принесла добычу Иосифу в Тарихею, что едва не стоило ему командования. Евсевий числит Дабиру селением иудеев на горе Фавор в округе Диокесарии, то есть Сепфориса. Развалины систематически не раскапывали; отождествление держится на имени и на согласии с границей у Иисуса Навина."
    - "Сегодня Дабурия — арабский город в Нижней Галилее Израиля у начала дороги, поднимающейся на Фавор, с Хорват-Деворой на окраине."
  uk:
    - "Даврат був містом Іссахара біля західного підніжжя гори Фавор, на межі з Завулоном, яку Ісус Навин проводить від Сарида: «на схід сонця же повертає від Сарида на займище Кислот-Таборське, відсї йде на Даверат та тягнеться на Яфію». Його було віддано левітам з роду Гершона: «А від поколїння Іссахарового: Кисіон укупі з пасовищами його, Даверат з пасовищами його», — дар, який повторює Книга Хронік. Назва живе в Даббурії, арабському селі біля підніжжя Фавору, а давнє місце — це руїни Хорват-Девора поряд; дехто ототожнював Даврат із Раввітом, іншим містом Іссахара, що його мапа зберігає як другого кандидата."
    - "Йосиф Флавій знав село як Даваритту, у Великій рівнині на краю Галілеї: на початку повстання 66 р. н. е. його юнаки пограбували обоз дружини Птолемея, управителя царя Агриппи, і принесли здобич Йосифові в Тарихеї, що ледь не коштувало йому командування. Євсевій перелічує Дабіру як село юдеїв на горі Фавор в окрузі Діокесарії, тобто Сепфоріса. Руїни систематично не розкопано; ототожнення спирається на назву та на її відповідність межі Ісуса Навина."
    - "Сьогодні Даббурія — арабське місто в Нижній Галілеї в Ізраїлі біля підніжжя дороги, що здіймається на Фавор, а місце Хорват-Девора — на його околиці."
  es:
    - "Daberat era una ciudad de Isacar al pie occidental del monte Tabor, en la frontera con Zabulón, que Josué traza desde Sarid «hacia oriente, donde nace el sol al término de Chisiloth-tabor, sale á Dabrath, y sube á Japhia». Fue entregada a los levitas de la familia de Gersón: «de la tribu de Issachâr, á Cesión con sus ejidos, á Dabereth con sus ejidos», una concesión que repite Crónicas. El nombre pervive en Daburiyya, la aldea árabe al pie del Tabor, y el sitio antiguo es la ruina de Horvat Devora, junto a ella; unos pocos han equiparado Daberat con Rabit, otra ciudad de Isacar, que el mapa conserva como segunda candidata."
    - "Josefo conocía la aldea como Dabarita, en la Gran Llanura, en el borde de Galilea: al estallar la revuelta en el 66 d. C. sus jóvenes robaron el equipaje de la mujer de Tolomeo, administrador del rey Agripa, y llevaron el botín a Josefo en Tariquea, lo que estuvo a punto de costarle el mando. Eusebio enumera Dabira como una aldea de judíos en el monte Tabor, en el distrito de Diocesarea, es decir, Séforis. La ruina no ha sido excavada sistemáticamente; la identificación se apoya en el nombre y en su encaje con la frontera de Josué."
    - "Hoy Daburiyya es una ciudad árabe de la Baja Galilea israelí, al pie del camino que sube al Tabor, con el sitio de Horvat Devora en las afueras."
  pt:
    - "Daberate era uma cidade de Issacar, no sopé ocidental do Monte Tabor, na fronteira com Zebulom, que Josué traça a partir de Saride: “virava para o leste, em direção ao nascente do sol, até a fronteira de Quislote-Tabor. Saía para Daberate e subia a Jafia”. Foi dada aos levitas da família de Gérson: “Da tribo de Issacar, Quisiom com suas pastagens, Daberate com suas pastagens”, concessão que as Crônicas repetem. O nome vive em Daburiyya, a aldeia árabe ao pé do Tabor, e o antigo local é a ruína de Horvat Devora junto a ela; alguns identificaram Daberate com Rabite, outra cidade de Issacar, que o mapa mantém como segundo candidato."
    - "Josefo conhecia a aldeia como Dabaritta, na Grande Planície, na orla da Galileia: no início da revolta, em 66 d.C., seus jovens roubaram a bagagem da mulher de Ptolomeu, administrador do rei Agripa, e levaram o despojo a Josefo em Tariqueias, o que quase lhe custou o comando. Eusébio lista Dabira como aldeia de judeus no Monte Tabor, no distrito de Diocesareia, isto é, Séforis. A ruína não foi escavada sistematicamente; a identificação repousa no nome e em sua adequação à fronteira de Josué."
    - "Hoje Daburiyya é uma cidade árabe na Baixa Galileia, em Israel, ao pé da estrada que sobe o Tabor, com o local de Horvat Devora em seus arredores."
  de:
    - "Daberat war eine Stadt Issachars am Westfuß des Berges Tabor an der Grenze zu Sebulon, die Josua von Sarid aus zieht: „und wendet sich von Sarid gegen der Sonne Aufgang bis an die Grenze Kisloth-Thabor und kommt hinaus gen Dabrath und reicht hinauf gen Japhia“. Es wurde den Leviten aus der Familie Gerschon gegeben: „Von dem Stamme Isaschar … Kisjon und seine Vorstädte, Dabrath und seine Vorstädte“, eine Zuteilung, die die Chronik wiederholt. Der Name lebt in Daburiyya fort, dem arabischen Dorf am Fuß des Tabor, und der antike Ort ist die Ruine Horvat Devora daneben; einige haben Daberat mit Rabbit gleichgesetzt, einer anderen Stadt Issachars, was die Karte als zweiten Kandidaten bewahrt."
    - "Josephus kannte das Dorf als Dabaritta, in der Großen Ebene am Rand Galiläas: Beim Ausbruch des Aufstands im Jahr 66 n. Chr. raubten seine jungen Männer das Gepäck der Frau des Ptolemaios, des Verwalters König Agrippas, und brachten die Beute zu Josephus nach Tarichäa, was ihn beinahe sein Kommando kostete. Eusebius führt Dabira als jüdisches Dorf am Berg Tabor im Bezirk von Diokaisareia auf, das heißt Sepphoris. Die Ruine ist nicht systematisch ausgegraben; die Gleichsetzung beruht auf dem Namen und darauf, dass sie zu Josuas Grenze passt."
    - "Heute ist Daburiyya eine arabische Stadt im israelischen Untergaliläa am Fuß der Straße, die den Tabor hinaufführt, mit dem Ort Horvat Devora an ihrem Rand."
  fr:
    - "Dabrath était une ville d’Issacar au pied occidental du Mont Thabor, à la frontière de Zabulon, que Josué trace depuis Sarid : « elle tournait à l’orient, vers le soleil levant, jusqu’à la frontière de Kisloth-Thabor, continuait à Dabrath, et montait à Japhia ». Elle fut donnée aux Lévites de la famille de Guerschon : « de la tribu d’Issacar, Kischjon et sa banlieue, Dabrath et sa banlieue », une attribution que les Chroniques répètent. Le nom survit dans Daburiyya, le village arabe au pied du Thabor, et le site antique est la ruine de Horvat Devora à côté ; quelques-uns ont assimilé Dabrath à Rabbith, autre ville d’Issacar, que la carte garde comme deuxième candidate."
    - "Josèphe connaissait le village sous le nom de Dabaritta, dans la Grande Plaine, aux confins de la Galilée : au début de la révolte en 66 apr. J.-C., ses jeunes gens pillèrent les bagages de la femme de Ptolémée, intendant du roi Agrippa, et en apportèrent le butin à Josèphe à Tarichées, ce qui faillit lui coûter son commandement. Eusèbe mentionne Dabira comme un village de Juifs sur le mont Thabor, dans le district de Diocésarée, c’est-à-dire Sepphoris. La ruine n’a pas été fouillée systématiquement ; l’identification repose sur le nom et sur sa concordance avec la frontière de Josué."
    - "Aujourd’hui, Daburiyya est une ville arabe de Basse Galilée, en Israël, au pied de la route qui monte au Thabor, avec le site de Horvat Devora à sa périphérie."
  it:
    - "Daberat era una città di Issacar ai piedi occidentali del Monte Tabor, sul confine con Zabulon, che Giosuè traccia da Sarid: «ad oriente, verso il sol levante, sino al confine di Kisloth-Tabor; poi continuava verso Dabrath, e saliva a Iafia». Fu data ai Leviti della famiglia di Gherson: «della tribù d’Issacar, Kiscion e il suo contado, Dabrath e il suo contado», concessione che le Cronache ripetono. Il nome sopravvive in Daburiyya, il villaggio arabo ai piedi del Tabor, e l’antico sito è la rovina di Horvat Devora accanto ad esso; alcuni hanno identificato Daberat con Rabbit, un’altra città di Issacar, che la mappa conserva come secondo candidato."
    - "Giuseppe Flavio conosceva il villaggio come Dabaritta, nella Grande Pianura al margine della Galilea: allo scoppio della rivolta nel 66 d.C. i suoi giovani rubarono i bagagli della moglie di Tolomeo, amministratore del re Agrippa, e ne portarono il bottino a Giuseppe a Tarichea, il che per poco non gli costò il comando. Eusebio elenca Dabira come villaggio di Ebrei sul Monte Tabor nel distretto di Diocesarea, cioè Sefforis. La rovina non è stata scavata sistematicamente; l’identificazione poggia sul nome e sul suo accordo con il confine di Giosuè."
    - "Oggi Daburiyya è una cittadina araba nella Bassa Galilea in Israele, ai piedi della strada che sale sul Tabor, con il sito di Horvat Devora alla periferia."
  pl:
    - "Daberat było miastem Issachara u zachodniego podnóża góry Tabor, na granicy z Zabulonem, którą Jozue kreśli od Sarid „na wschód słońca ku granicy Chasalek Tabor, a stamtąd bieży do Daberet, i ciągnie się do Jafije”. Przekazano je lewitom z rodu Gerszona: „Z pokolenia Isaschar: Kiesyjon i przedmieścia jego; Daberet i przedmieścia jego”, co powtarza Księga Kronik. Nazwa żyje w Dabburiji, arabskiej wsi u stóp Taboru, a starożytnym stanowiskiem jest ruina Chorwat Dewora obok niej; nieliczni utożsamiali Daberat z Rabbit, innym miastem Issachara, które mapa zachowuje jako drugiego kandydata."
    - "Józef Flawiusz znał wieś jako Dabaritta, w Wielkiej Równinie na skraju Galilei: w chwili wybuchu powstania w 66 r. n.e. jej młodzi ludzie obrabowali bagaże żony Ptolemeusza, zarządcy króla Agryppy, i przynieśli łup Józefowi do Tarichei, co omal nie kosztowało go dowództwa. Euzebiusz wymienia Dabirę jako wieś Żydów na górze Tabor w okręgu Diokezarei, czyli Sefforis. Ruiny nie badano systematycznie wykopaliskami; utożsamienie opiera się na nazwie i na zgodności z granicą Jozuego."
    - "Dziś Dabburija to arabskie miasto w Dolnej Galilei w Izraelu, u podnóża drogi wspinającej się na Tabor, z miejscem Chorwat Dewora na obrzeżach."
  nl:
    - "Daberat was een stad van Issachar aan de westvoet van de Tabor, op de grens met Zebulon, die Jozua trekt vanaf Sarid “oostwaarts tegen den opgang der zon, tot de landpale van Chisloth-Thabor, en zij komt uit te Dobrath, en gaat opwaarts naar Jafia”. Zij werd gegeven aan de Levieten van het geslacht Gersom: “van den stam van Issaschar, Kisjon en haar voorsteden, en Dobrath en haar voorsteden”, een toewijzing die Kronieken herhaalt. De naam leeft voort in Daburiyya, het Arabische dorp aan de voet van de Tabor, en de oude plaats is de ruïne Horvat Devora ernaast; enkelen hebben Daberat gelijkgesteld met Rabbit, een andere stad van Issachar, wat de kaart als tweede kandidaat aanhoudt."
    - "Flavius Josephus kende het dorp als Dabaritta, in de Grote Vlakte aan de rand van Galilea: bij het uitbreken van de opstand in 66 n.Chr. beroofden de jongemannen ervan de bagage van de vrouw van Ptolemaeus, koning Agrippa's rentmeester, en brachten de buit naar Josephus te Tarichea, wat hem bijna zijn bevel kostte. Eusebius noemt Dabira een dorp van Joden op de Tabor in het district van Diocaesarea, dat is Sepforis. De ruïne is niet systematisch opgegraven; de identificatie berust op de naam en op de aansluiting bij Jozua's grens."
    - "Tegenwoordig is Daburiyya een Arabische stad in Neder-Galilea in Israël, aan de voet van de weg die de Tabor opklimt, met de plaats Horvat Devora aan de rand."
  cs:
    - "Daberat bylo město Isacharovo na západním úpatí hory Tábor, na hranici se Zebulunem, kterou Jozue vede od Saridu „nazpátek k východu slunce, ku pomezí Chazelet Tábor, a odtud táhne se k Daberet, a vstupuje do Jafie“. Bylo dáno levitům z rodu Geršonova: „Z pokolení Izacharova: Kesion a podměstí jeho, a Daberet s předměstím jeho“, což Letopisy opakují. Jméno žije dál v Daburiyyi, arabské vesnici u úpatí Táboru, a antické místo je zřícenina Horvat Devora vedle ní; někteří ztotožnili Daberat s Rabitem, dalším městem Isacharovým, což mapa zachovává jako druhého kandidáta."
    - "Josephus znal vesnici jako Dabarittu, ve Velké rovině na okraji Galileje: při vypuknutí povstání roku 66 n. l. její mladíci oloupili zavazadla manželky Ptolemaia, správce krále Agrippy, a přinesli kořist Josephovi do Tarichaií, což ho málem stálo velení. Eusebios uvádí Dabiru jako vesnici Židů na hoře Tábor v okrese Diokaisareie, tedy Sepforis. Zřícenina nebyla systematicky vykopána; ztotožnění spočívá na jménu a na shodě s Jozuovou hranicí."
    - "Dnes je Daburiyya arabské městečko v izraelské Dolní Galileji u paty cesty, která stoupá na Tábor, s lokalitou Horvat Devora na okraji."
  sv:
    - "Daverat var en stad i Isaskar vid Taborbergets västra fot, vid gränsen mot Sebulon, som Josua drar från Sarid ”österut mot solens uppgång, vände den sig åt Kislot-Tabors område och gick vidare till Dobrat och upp till Jafia”. Den gavs till leviterna av Gershons släkt: ”ur Isaskars stam Kisjon med dess utmarker, Dobrat med dess utmarker”, en gåva som Krönikeboken upprepar. Namnet lever kvar i Daburiyya, den arabiska byn vid Tabors fot, och den antika platsen är ruinen Horvat Devora intill; några har likställt Daverat med Rabbit, en annan stad i Isaskar, vilket kartan behåller som andra kandidat."
    - "Josefus kände byn som Dabaritta, i Stora slätten vid Galileens kant: när upproret bröt ut år 66 e.Kr. plundrade dess unga män bagaget åt hustrun till Ptolemaios, kung Agrippas förvaltare, och förde bytet till Josefus i Tarichea, vilket nästan kostade honom hans befäl. Eusebios förtecknar Dabira som en by med judar på Tabor i Diocaesareas, det vill säga Sepphoris, distrikt. Ruinen har inte grävts ut systematiskt; identifieringen vilar på namnet och på hur väl den passar Josuas gräns."
    - "I dag är Daburiyya en arabisk stad i Israels nedre Galileen vid foten av vägen som stiger upp mot Tabor, med platsen Horvat Devora i dess utkant."
  nb:
    - "Daberat var en by i Issakar ved den vestlige foten av Tabor, på grensen til Sebulon, som Josva trekker fra Sarid: «Mot øst, mot solens opgang, bøide den sig fra Sarid bort til Kislot-Tabors enemerker og gikk frem til Haddaberat og op til Jafia». Den ble gitt til levittene av Gersjons slekt: «av Issakars stamme: Kisjon med jorder, Daberat med jorder», en gave som Krønikebøkene gjentar. Navnet lever videre i Daburiyya, den arabiske landsbyen ved Tabors fot, og det gamle stedet er ruinen Horvat Devora ved siden av; noen få har satt Daberat lik Rabbit, en annen by i Issakar, som kartet beholder som en andre kandidat."
    - "Josefus kjente landsbyen som Dabaritta, i Den store sletten i kanten av Galilea: ved utbruddet av opprøret i 66 e.Kr. plyndret dens unge menn bagasjen til hustruen til Ptolemaios, kong Agrippas forvalter, og brakte byttet til Josefus i Tarikeai, noe som nesten kostet ham kommandoen. Eusebius fører opp Dabira som en jødisk landsby på Tabor i distriktet Diokaisarea, det vil si Sepforis. Ruinen er ikke systematisk gravd ut; identifiseringen hviler på navnet og på at den passer med Josvas grense."
    - "I dag er Daburiyya en arabisk by i Israels Nedre Galilea ved foten av veien som stiger opp Tabor, med stedet Horvat Devora i utkanten."
  tl:
    - "Ang Dabrath ay isang bayan ng Issachar sa kanlurang paanan ng Bundok Tabor, sa hangganan ng Zabulon, na iginuguhit ni Josue mula sa Sarid “sa dakong silanganan na dakong sinisikatan ng araw hanggang sa hangganan ng Chisiloth-tabor, at palabas sa Dabrath, at pasampa sa Japhia”. Ibinigay ito sa mga Levita ng angkan ni Gerson: “At sa lipi ni Issachar, ang Cesion pati ng mga nayon niyaon, ang Dabereth pati ng mga nayon niyaon”, isang kaloob na inuulit ng Mga Cronica. Nabubuhay ang pangalan sa Daburiyya, ang nayong Arabe sa paanan ng Tabor, at ang sinaunang pook ay ang guhong Horvat Devora sa tabi nito; iilan ang nagtutumbas sa Dabrath at Rabbit, isa pang bayan ng Issachar, na iniingatan ng mapa bilang ikalawang kandidato."
    - "Kilala ni Josefo ang nayon bilang Dabaritta, sa Malaking Kapatagan sa gilid ng Galilea: sa pagsiklab ng paghihimagsik noong 66 AD, ninakawan ng mga kabataan nito ang bagahe ng asawa ni Ptolemeo, katiwala ni Haring Agripa, at dinala ang samsam kay Josefo sa Tarichea, na halos ikinawala ng kaniyang pamumuno. Inililista ni Eusebio ang Dabira bilang nayon ng mga Judio sa Bundok Tabor sa distrito ng Diocaesarea, ibig sabihin ay Sepphoris. Hindi sistematikong nahukay ang guho; ang pagkilala ay nakabatay sa pangalan at sa pagkakatugma sa hangganan ni Josue."
    - "Ngayon, ang Daburiyya ay bayang Arabe sa Mababang Galilea ng Israel sa paanan ng daang umaakyat sa Tabor, na ang pook ng Horvat Devora ay nasa laylayan nito."
  da:
    - "Daberat var en by i Issakar ved den vestlige fod af Tabor, på grænsen til Zebulon, som Josva trækker fra Sarid »mod Østen, mod Solens Opgang, ved Kisloth-Thabors Landemærke, og gaar ud til Dabrath og gaar op til Jafia«. Den blev givet til leviterne af Gersjons slægt: »af Isaskars Stamme: Kisjon og dens Marker, Dabrath og dens Marker«, en tildeling, Krønikebøgerne gentager. Navnet lever videre i Daburiyya, den arabiske landsby ved Tabors fod, og det antikke sted er ruinen Horvat Devora ved siden af den; nogle få har ligestillet Daberat med Rabbit, en anden by i Issakar, som kortet beholder som en anden kandidat."
    - "Josefus kendte landsbyen som Dabaritta, på Den Store Slette i udkanten af Galilæa: Ved oprørets udbrud i 66 e.Kr. plyndrede dens unge mænd bagagen tilhørende hustruen til Ptolemaios, kong Agrippas forvalter, og bragte byttet til Josefus i Tarichea, hvilket næsten kostede ham hans kommando. Eusebios opfører Dabira som en jødisk landsby på Tabor i Diocæsareas distrikt, det vil sige Sepphoris. Ruinen er ikke systematisk udgravet; identifikationen hviler på navnet og på, at den passer til Josvas grænse."
    - "I dag er Daburiyya en arabisk by i Israels Nedre Galilæa ved foden af vejen, der klatrer op ad Tabor, med stedet Horvat Devora i udkanten."
  sr:
    - "Даврат је био град Исахаров у западном подножју Тавора, на граници са Завулоном, коју Исус Навин повлачи од Сариде „на исток до међе кислот-таворске, и иде на Даврат и излази до Јафе“. Дат је левитима из породице Гирсонове: „од племена Исахаровог: Кисон с подграђем, Даврот с подграђем“, давање које Летописи понављају. Име живи у Дабурији, арапском селу у подножју Тавора, а старо налазиште је рушевина Хорват Девора поред њега; неки су изједначили Даврат с Равитом, другим градом Исахаровим, што карта задржава као другог кандидата."
    - "Јосиф Флавије је знао село као Даварита, у Великој равници на ивици Галилеје: при избијању устанка 66. н. е. његови младићи опљачкали су пртљаг жене Птолемеја, управитеља краља Агрипе, и донели плен Јосифу Флавију у Таришеји, што га је замало коштало заповедништва. Јевсевије наводи Дабиру као јеврејско село на Тавору у округу Диокесареје, то јест Сефориса. Рушевина није систематски ископавана; поистовећивање се заснива на имену и на томе што се уклапа у Исусову међу."
    - "Данас је Дабурија арапски град у Доњој Галилеји у Израелу у подножју пута који се пење на Тавор, а налазиште Хорват Девора на његовом рубу."
  hu:
    - "Dábrat Issakár városa volt a Tábor-hegy nyugati lábánál, a Zebulonnal való határon, amelyet Józsué Száridtól így vezet: „napkelet felé fordul Kiszloth-Tábor határára, és tova megy Daberáthnak, és felmegy Jafiának”. A Gérsón családjából való lévitáknak adták: „Az Issakhár nemzetségéből pedig: Kisjont és annak legelőjét, Dobráthot, és annak legelőjét”, ezt a juttatást a Krónikák is megismétli. A név tovább él Daburiyyában, a Tábor lábánál fekvő arab faluban, az ókori hely pedig a mellette lévő Horvat Devora rom; néhányan Dábratot Rabbittal, Issakár egy másik városával azonosították, amit a térkép második jelöltként megtart."
    - "Josephus Dabarittaként ismerte a falut, Galilea szélén, a Nagy Síkságon: a Kr. u. 66-os felkelés kitörésekor fiataljai kirabolták Ptolemaiosz, Agrippa király intézője feleségének poggyászát, és a zsákmányt Josephushoz vitték Tarikheaiba, ami majdnem a parancsnokságába került. Eusebius Dabirát zsidó faluként sorolja fel a Tábor-hegyen, Diocaesarea, azaz Szepphórisz körzetében. A romot nem ásták ki rendszeresen; az azonosítás a néven és Józsué határához való illeszkedésen nyugszik."
    - "Daburiyya ma arab város Izrael Alsó-Galileájában, a Tábor-hegyre kapaszkodó út lábánál, külterületén a Horvat Devora helyével."
  fi:
    - "Daberat oli Isaskarin kaupunki Taborvuoren länsijuurella, Sebulonin rajalla, jonka Joosuan kirja vetää näin: ”Itään päin, auringonnousuun päin, kääntyy raja Saaridista Kislot-Taaborin alueelle ja jatkuu Daberatiin ja nousee Jaafiaan.” Se annettiin Gersonin suvun leeviläisille: ”Isaskarin sukukunnalta Kisjonin laidunmaineen, Daberatin laidunmaineen”, minkä Aikakirjat toistavat. Nimi elää Daburiyyassa, Taborin juurella olevassa arabikylässä, ja muinainen paikka on sen vieressä oleva Horvat Devoran rauniot; muutamat ovat rinnastaneet Daberatin Rabbitiin, toiseen Isaskarin kaupunkiin, jonka kartta säilyttää toisena ehdokkaana."
    - "Josefus tunsi kylän nimellä Dabaritta, Suuressa tasangossa Galilean reunalla: vuonna 66 jaa. kapinan puhjetessa sen nuoret miehet ryöstivät kuningas Agrippan taloudenhoitajan Ptolemaioksen vaimon matkatavarat ja toivat saaliin Josefukselle Tarichaiaan, mikä melkein maksoi hänelle komennon. Eusebios luettelee Dabiran juutalaisten kyläksi Taborvuorella Diokaisarean eli Sepphoriksen piirissä. Rauniota ei ole kaivettu järjestelmällisesti; tunnistus perustuu nimeen ja sopivuuteen Joosuan rajan kanssa."
    - "Nykyisin Daburiyya on arabikaupunki Israelin Ala-Galileassa Taborille johtavan tien juurella, ja Horvat Devoran paikka sen laidalla."
  vi:
    - "Đáp-rát là một thành của Y-sa-ca ở chân phía tây núi Tha-bô, trên ranh giới với Sa-bu-lôn, mà Giô-suê vẽ từ Sa-rít “vòng qua hướng đông, tức về hướng mặt trời mọc, trên giáp giới Kít-lốt-Tha-bô; đoạn đi về hướng Đáp-rát, và lên đến Gia-phia”. Thành được giao cho người Lê-vi thuộc gia tộc Ghẹt-sôn: “Lại lấy trong chi phái Y-sa-ca, Ki-si-ôn và đất chung quanh thành, Đáp-rát và đất chung quanh thành”, một sự ban cấp mà sách Sử Ký lặp lại. Tên còn lại ở Daburiyya, làng Ả Rập dưới chân Tha-bô, và địa điểm cổ là phế tích Horvat Devora cạnh đó; một vài người đồng nhất Đáp-rát với Ra-bít, một thành khác của Y-sa-ca, mà bản đồ giữ lại như ứng viên thứ hai."
    - "Josephus biết làng này là Dabaritta, trong Đại Đồng bằng ở rìa Ga-li-lê: khi cuộc nổi dậy bùng nổ năm 66, các thanh niên của nó cướp hành lý của vợ Ptolemy, quản gia của vua Ạc-ríp-ba, và đem chiến lợi phẩm đến cho Josephus tại Tarichaeae, điều suýt làm ông mất quyền chỉ huy. Eusebius liệt kê Dabira là một làng của người Do Thái trên núi Tha-bô trong vùng Diocaesarea, tức Sepphoris. Phế tích chưa được khai quật có hệ thống; sự đồng nhất dựa vào tên và vào sự phù hợp với ranh giới của Giô-suê."
    - "Ngày nay Daburiyya là một thị trấn Ả Rập ở hạ Ga-li-lê của Israel dưới chân con đường leo lên Tha-bô, với địa điểm Horvat Devora ở vùng ven."
  ro:
    - "Daberat era o cetate a lui Isahar la poalele de vest ale Muntelui Tabor, la hotarul cu Zabulon, pe care Iosua îl trasează de la Sarid „din preajma dela răsăritul Sames la hotarele Haselatdavor, și trece la Davrat, și se sue la Iafia”. A fost dată leviților din familia lui Gherșon: din tribul lui Isahar, Chison cu împrejurimile lui, Dabareh cu împrejurimile lui, o dăruire pe care o repetă Cronicile. Numele trăiește în Daburiyya, satul arab de la poalele Taborului, iar locul antic este ruina Horvat Devora de lângă el; câțiva au identificat Daberat cu Rabit, altă cetate a lui Isahar, pe care harta o păstrează ca al doilea candidat."
    - "Iosif Flaviu cunoștea satul ca Dabaritta, în Marea Câmpie, la marginea Galileii: la izbucnirea răscoalei din anul 66 d.Hr., tinerii lui au jefuit bagajele soției lui Ptolemeu, administratorul regelui Agripa, și au adus prada lui Iosif Flaviu la Tarichee, ceea ce aproape l-a costat comanda. Eusebiu înșiră Dabira ca un sat de iudei pe Muntele Tabor, în districtul Diocezareei, adică Sepphoris. Ruina nu a fost săpată sistematic; identificarea se sprijină pe nume și pe potrivirea cu hotarul lui Iosua."
    - "Astăzi Daburiyya este un oraș arab din Galileea de Jos a Israelului, la poalele drumului care urcă pe Tabor, cu locul Horvat Devora la periferia lui."
  bg:
    - "Даврат бил град на Исахар в западното подножие на Тавор, на границата със Завулон, която книгата Иисус Навин прокарва от Сарид „към изток слънца в предела на Кислот-тавор, и излазяше в Даврат, и възлазяше в Яфия“. Той бил даден на левитите от рода на Гирсон: „от Исахаровото племе, Кисион и предградията му, Даврат и предградията му“ — дар, който Летописи повтаря. Името живее в Дабурия, арабското село в подножието на Тавор, а древното място е руината Хорват Девора до него; неколцина са приравнявали Даврат с Рават, друг град на Исахар, който картата пази като втори кандидат."
    - "Йосиф Флавий познавал селото като Дабарита, във Великата равнина на края на Галилея: при избухването на въстанието през 66 г. н.е. младежите му ограбили багажа на жената на Птолемей, управителя на цар Агрипа, и донесли плячката на Йосиф в Тарихея, което едва не му струвало командването. Евсевий изброява Дабира като юдейско село на Тавор в окръга на Диокесария, тоест Сепфорис. Руината не е систематично разкопавана; отъждествяването почива на името и на съответствието ѝ с границата у Иисус Навин."
    - "Днес Дабурия е арабско градче в Долна Галилея в Израил в подножието на пътя, който се изкачва на Тавор, с мястото Хорват Девора в покрайнините си."
