# Overview article (ADR 0007). Mainstream facts only; Daburiyya and Horvat Devora at the foot of Tabor are the usual identification, Rabbith the app's second candidate.
id: daberath
place: a6a5e97
title:
  en: "Daberath"
  ru: "Давраф"
body:
  en:
    - "Daberath was a town of Issachar at the western foot of Mount Tabor, on the border with Zebulun, which Joshua draws from Sarid “eastward toward the sunrising unto the border of Chisloth-tabor, and then goeth out to Daberath, and goeth up to Japhia”. It was given to the Levites of the family of Gershon: “out of the tribe of Issachar, Kishon with her suburbs, Dabareh with her suburbs”, a grant Chronicles repeats. The name lives on in Daburiyya, the Arab village at Tabor's foot, and the ancient site is the ruin of Horvat Devora beside it; a few have equated Daberath with Rabbith, another town of Issachar, which the map keeps as a second candidate."
    - "Josephus knew the village as Dabaritta, in the Great Plain on the edge of Galilee: at the outbreak of the revolt in AD 66 its young men robbed the baggage of the wife of Ptolemy, King Agrippa's steward, and brought the spoil to Josephus at Tarichaeae, which nearly cost him his command. Eusebius lists Dabira as a village of Jews on Mount Tabor in the district of Diocaesarea, that is Sepphoris. The ruin has not been excavated; the identification rests on the name and on its fit with Joshua's border."
    - "Today Daburiyya is an Arab town in Israel's Lower Galilee at the foot of the road that climbs Tabor, with the site of Horvat Devora on its outskirts."
  ru:
    - "Давраф — город Иссахара у западного подножия горы Фавор, на границе с Завулоном, которую книга Иисуса Навина ведёт от Сарида «к восточной стороне, к востоку солнца, до предела Кислоф-Фавора; отсюда идет к Даврафу и восходит к Иафии». Он был отдан левитам из рода Гирсона: «от колена Иссахарова: Кишион и предместья его, Давраф и предместья его», и Паралипоменон повторяет это. Имя живёт в Дабурии, арабской деревне у подножия Фавора, а древнее место — развалины Хорват-Девора рядом с ней; немногие отождествляли Давраф с Раввифом, другим городом Иссахара, который на карте отмечен вторым кандидатом."
    - "Иосиф Флавий знал селение как Дабаритту на Великой равнине у края Галилеи: в начале восстания 66 г. н. э. его молодёжь ограбила обоз жены Птолемея, управляющего царя Агриппы, и принесла добычу Иосифу в Тарихею, что едва не стоило ему командования. Евсевий числит Дабиру селением иудеев на горе Фавор в округе Диокесарии, то есть Сепфориса. Развалины не раскапывали; отождествление держится на имени и на согласии с границей у Иисуса Навина."
    - "Сегодня Дабурия — арабский город в Нижней Галилее Израиля у начала дороги, поднимающейся на Фавор, с Хорват-Деворой на окраине."
