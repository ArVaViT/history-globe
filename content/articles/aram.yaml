body:
  en:
    - "Aram is the Hebrew name of the land of the Aramaeans, the Semitic people whose kingdoms lay north and north-east of Israel in what is now Syria, with Damascus as the greatest of them. The Greek Bible, the King James Version and the Russian Synodal translation nearly always render the name as Syria and the people as Syrians, so that where English readers see Syria the Hebrew says Aram. Genesis makes Aram a son of Shem, the brother of Elam and Asshur, with Uz, Hul, Gether and Mash for sons; a second Aram is a grandson of Abraham's brother Nahor. The name goes with others to mark the parts of the land: Aram-naharaim, “Aram of the two rivers”, the country of Haran beyond the Euphrates, Paddan-aram, where Jacob served Laban “the Syrian”, Aram-zobah, Aram-maacah, Aram-beth-rehob and Aram of Damascus."
    - "Balaam says that Balak brought him “from Aram, out of the mountains of the east”, which the Synodal Bible renders as Mesopotamia; Hosea remembers that “Jacob fled into the country of Syria”, in Hebrew the field of Aram; and Israel confessed before the altar, “A Syrian ready to perish was my father”. David put garrisons “in Syria of Damascus”, and Absalom lived “at Geshur in Syria”; the Chronicler says that Geshur and Aram took the villages of Jair in Gilead. In Judges 18 some modern translations read that Laish “had no dealings with Aram”, where the Hebrew text has “with any man”, adam; the two words differ by one letter. Amos says that the LORD brought the Aramaeans from Kir as he brought Israel from Egypt, and Zechariah's oracle on Hadrach, Damascus and Hamath names Aramaean cities known from Assyrian records."
    - "The Aramaeans appear in Assyrian annals about 1100 BC as nomads on the Euphrates, and by the tenth century had kingdoms from Damascus to the Khabur. Their states were named after founders, the house of Adini, of Agusi, of Bahiani, and Assyria absorbed them one by one, from Bit-Adini in 856 BC to Arpad in 740 and Damascus in 732. The Bible names their speech after them: Laban calls the heap of witness by an Aramaic name, Jegar-sahadutha, where Jacob says Galeed, and Hezekiah's officers ask the Rabshakeh to speak “in the Syrian language”, Aramaic, which the people on the wall did not know. The record of Aram here is placed at Damascus, the Aramaean city the Bible names most often."
  ru:
    - "Арам — еврейское имя земли арамеев, семитского народа, чьи царства лежали к северу и северо-востоку от Израиля, на землях нынешней Сирии, и величайшим из которых был Дамаск. Греческая Библия, английская Библия короля Иакова и русский Синодальный перевод почти всюду передают это имя как Сирия, а народ — как Сирияне или Сирийцы, так что там, где русский читатель видит Сирию, в еврейском тексте стоит Арам. Книга Бытия делает Арама сыном Сима, братом Елама и Ассура, с сыновьями Уцем, Хулом, Гефером и Машем; второй Арам — внук Нахора, брата Авраама. Имя входит в составные названия частей страны: Арам-Нахараим, «Арам двух рек», край Харрана за Евфратом, Паддан-Арам, где Иаков служил Лавану Арамеянину (в Синодальном переводе оба — Месопотамия), Арам-Цова, Арам-Мааха, Арам-Беф-Рехов и Арам Дамасский."
    - "Валаам говорит: «из Месопотамии привел меня Валак, царь Моава, от гор восточных», и в еврейском тексте здесь стоит Арам; Осия вспоминает: «Убежал Иаков на поля Сирийские», по-еврейски на поле Арама; Израиль исповедовал у жертвенника: «отец мой был странствующий Арамеянин». «поставил Давид охранные войска в Сирии Дамасской», а Авессалом жил «в Гессуре в Сирии»; летописец говорит, что Гессуряне и Сирияне взяли селения Иаира в Галааде. В 18-й главе Судей некоторые современные переводы читают, что Лаис не имел дела с Арамом, тогда как в еврейском тексте стоит «ни с кем», адам: два слова различаются одной буквой. Амос говорит, что Господь вывел Арамлян из Кира, как Израиля из Египта, а пророчество Захарии о Хадрахе, Дамаске и Емафе называет арамейские города, известные по ассирийским записям."
    - "Арамеи появляются в ассирийских анналах около 1100 г. до н. э. как кочевники на Евфрате, а к X веку имели царства от Дамаска до Хавора. Их государства звались по основателям — дом Адини, дом Агуси, дом Бахиани, — и Ассирия поглотила их одно за другим, от Бит-Адини в 856 г. до н. э. до Арпада в 740 г. и Дамаска в 732 г. Библия называет их речь их именем: Лаван дал груде свидетельства арамейское имя «Иегар-Сагадуфа», где Иаков сказал Галаад, а приближённые Езекии просили Рабсака: «говори рабам твоим по-арамейски», чтобы не понял народ на стене. Запись об Араме здесь помещена в Дамаске — арамейском городе, который Библия называет чаще всего."
  uk:
    - "Арам — єврейська назва країни арамеїв, семітського народу, чиї царства лежали на північ і північний схід від Ізраїлю на території нинішньої Сирії, з Дамаском як найбільшим із них. Грецька Біблія, Біблія короля Якова і російський Синодальний переклад майже завжди передають це ім'я як Сирія, а народ — як сирійці, так що там, де англійські читачі бачать Сирію, в єврейському тексті стоїть Арам. Буття робить Арама сином Сіма, братом Елама й Ассура, з синами Уцом, Хулом, Гефером і Машем; другий Арам — онук Авраамового брата Нахора. Ім'я входить до складу інших назв, що позначають частини краю: Арам-Нахараїм, «Арам двох річок», країна Харану за Євфратом, Падан-Арам, де Яків служив Лаванові Арамянину, Арам-Сува, Арам-Мааха, Арам-Бет-Рехов і Арам Дамаський."
    - "Валаам каже, що Валак покликав його «з Арану... з гір восточнїх» — Синодальний переклад передає це як Месопотамія; Осія пам'ятає, що «Втїк же Яков у землю Сирийську», єврейською — на поле Арама; а Ізраїль визнавав перед жертовником: «Блукаючий Арамій був батько мій». Давид поставив залоги «в Дамаській Сириї», а Авесалом жив «в Гессурі в Сириї»; хронікар каже, що Гешур і Арам забрали села Яіра в Гілеаді. У Суддів 18 деякі сучасні переклади читають, що Лаїш «не мав справ з Арамом», де єврейський текст має «нї з ким нїякої справи» (адам); обидва слова відрізняються однією літерою. Амос каже, що Господь вивів араміїв з Кіру, як вивів Ізраїль з Єгипту, а Захаріїне пророцтво про Хадрах, Дамаск і Хамат називає арамейські міста, відомі з ассирійських записів."
    - "Арамеї з'являються в ассирійських літописах близько 1100 р. до н. е. як кочовики на Євфраті, а до X століття мали царства від Дамаска до Хабуру. Їхні держави називалися за засновниками: дім Адіні, Агусі, Бахіані; Ассирія поглинала їх одну за одною, від Біт-Адіні у 856 р. до н. е. до Арпаду в 740-му і Дамаска в 732-му. Біблія називає їхню мову за ними: Лаван дає купі свідчення арамейську назву Єгар-Сагадута, де Яків каже Галлед, а урядовці Єзекії просять Рабсака говорити «по сирийськи», тобто арамейською, якої не розумів народ на мурі. Запис про Арам тут поміщено при Дамаску, арамейському місті, яке Біблія називає найчастіше."
  es:
    - "Aram es el nombre hebreo de la tierra de los arameos, el pueblo semita cuyos reinos se extendían al norte y al nordeste de Israel, en lo que hoy es Siria, con Damasco como el mayor de ellos. La Biblia griega, la versión del rey Jacobo y la traducción sinodal rusa casi siempre vierten el nombre como Siria y el pueblo como sirios, de modo que donde los lectores ingleses ven Siria el hebreo dice Aram. El Génesis hace de Aram un hijo de Sem, hermano de Elam y de Asur, con Uz, Hul, Geter y Mas por hijos; un segundo Aram es nieto de Nacor, hermano de Abraham. El nombre va con otros para marcar las partes de la tierra: Aram-naharaim, «Aram de los dos ríos», el país de Harán al otro lado del Éufrates, Padan-aram, donde Jacob sirvió a Labán «Arameo», Aram-soba, Aram-maaca, Aram-bet-rehob y Aram de Damasco."
    - "Balaam dice que Balac lo trajo «De Aram ... de los montes del oriente», que la Biblia sinodal vierte como Mesopotamia; Oseas recuerda que «Jacob huyó á tierra de Aram», en hebreo el campo de Aram; e Israel confesaba ante el altar: «Un Siro á punto de perecer fué mi padre». David puso guarniciones «en Siria la de Damasco», y Absalón vivió «en Gessur en Siria»; el Cronista dice que Gesur y Aram tomaron las aldeas de Jair en Galaad. En Jueces 18 algunas traducciones modernas leen que Lais no tenía tratos con Aram, donde el texto hebreo tiene «con nadie», adam; las dos palabras difieren en una letra. Amós dice que Jehová sacó a los arameos de Kir como sacó a Israel de Egipto, y el oráculo de Zacarías sobre Hadrac, Damasco y Hamat nombra ciudades arameas conocidas por los registros asirios."
    - "Los arameos aparecen en los anales asirios hacia 1100 a. C. como nómadas en el Éufrates, y en el siglo X tenían ya reinos desde Damasco hasta el Jabur. Sus estados recibían el nombre de sus fundadores, la casa de Adini, de Agusi, de Bahiani, y Asiria los absorbió uno a uno, desde Bit-Adini en 856 a. C. hasta Arfad en 740 y Damasco en 732. La Biblia nombra su lengua por ellos: Labán llama al montón del testimonio con un nombre arameo, Jegar-sahadutha, donde Jacob dice Galaad, y los oficiales de Ezequías piden al Rabsaces que hable «siriaco», es decir, arameo, que el pueblo sobre el muro no entendía. El registro de Aram se sitúa aquí en Damasco, la ciudad aramea que la Biblia nombra con más frecuencia."
  pt:
    - "Arã é o nome hebraico da terra dos arameus, o povo semita cujos reinos ficavam ao norte e nordeste de Israel, onde hoje é a Síria, sendo Damasco o maior deles. A Bíblia grega, a King James Version e a tradução sinodal russa quase sempre vertem o nome como Síria e o povo como sírios, de modo que onde o leitor inglês vê Síria o hebraico diz Arã. Gênesis faz de Arã filho de Sem, irmão de Elão e Assur, com Uz, Hul, Geter e Más por filhos; outro Arã é neto de Naor, irmão de Abraão. O nome se junta a outros para marcar partes da terra: Arã-Naaraim, “Arã dos dois rios”, o país de Harã além do Eufrates, Padã-Arã, onde Jacó serviu Labão, “o sírio”, Arã-Zobá, Arã-Maacá, Arã-Bete-Reobe e Arã de Damasco."
    - "Balaão diz que Balaque o trouxe “De Arã... das montanhas do Oriente”, que a Bíblia sinodal verte como Mesopotâmia; Oseias lembra que “Jacó fugiu para a terra de Arã”; e Israel confessava diante do altar: “Meu pai era um arameu prestes a perecer”. Davi pôs guarnições “na Síria de Damasco”, e Absalão viveu “em Gesur, na Síria”; o Cronista diz que Gesur e Arã tomaram as cidades de Jair em Gileade. Em Juízes 18, algumas traduções modernas leem que Laís não tinha relações com Arã, onde o texto hebraico tem “com mais ninguém”, adam; as duas palavras diferem por uma letra. Amós diz que o SENHOR tirou os arameus de Quir como tirou Israel do Egito, e o oráculo de Zacarias sobre Hadraque, Damasco e Hamate nomeia cidades arameias conhecidas dos registros assírios."
    - "Os arameus aparecem nos anais assírios por volta de 1100 a.C. como nômades no Eufrates e, no século X, já tinham reinos de Damasco ao Cabur. Seus Estados tinham nome de fundadores, a casa de Adini, de Agusi, de Bahiani, e a Assíria os absorveu um a um, de Bit-Adini em 856 a.C. a Arpade em 740 e Damasco em 732. A Bíblia dá nome à sua língua por eles: Labão chama o monte do testemunho por um nome aramaico, Jegar-Saaduta, onde Jacó diz Galeede, e os oficiais de Ezequias pedem a Rabsaqué que fale “em aramaico”, que o povo na muralha não conhecia. O registro de Arã é aqui situado em Damasco, a cidade arameia que a Bíblia mais nomeia."
  de:
    - "Aram ist der hebräische Name des Landes der Aramäer, des semitischen Volkes, dessen Königreiche nördlich und nordöstlich von Israel im heutigen Syrien lagen, mit Damaskus als größtem. Die griechische Bibel, die King-James-Bibel und die russische Synodalübersetzung geben den Namen fast immer als Syrien und das Volk als Syrer wieder, so dass dort, wo englische Leser Syrien lesen, im Hebräischen Aram steht. Das erste Buch Mose macht Aram zu einem Sohn Sems, Bruder von Elam und Assur, mit Us, Hul, Geter und Masch als Söhnen; ein zweiter Aram ist ein Enkel von Abrahams Bruder Nahor. Mit dem Namen werden Teile des Landes bezeichnet: Aram-Naharajim, „Aram der beiden Ströme“, das Land Haran jenseits des Euphrat, Paddan-Aram, wo Jakob Laban „dem Syrer“ diente, Aram-Zoba, Aram-Maacha, Aram-Bet-Rehob und Aram von Damaskus."
    - "Bileam sagt, Balak habe ihn aus Aram geholt: „Aus Syrien hat mich Balak, der Moabiter König, holen lassen von dem Gebirge gegen Aufgang“, was die Synodalbibel mit Mesopotamien wiedergibt; Hosea: „Jakob mußte fliehen in das Land Syrien“, hebräisch das Feld Arams; und Israel bekannte: „Mein Vater war ein Syrer und nahe dem Umkommen“. David legte Besatzungen „in das Syrien von Damaskus“, Absalom wohnte „zu Gessur in Syrien“; der Chronist sagt, Geschur und Aram hätten die Dörfer Jaïrs in Gilead genommen. In Richter 18 lesen manche modernen Übersetzungen, Lais habe keinen Umgang mit Aram gehabt, wo der hebräische Text „mit Leuten“ hat, adam; die Wörter unterscheiden sich um einen Buchstaben. Amos sagt, der HERR habe die Aramäer aus Kir geführt wie Israel aus Ägypten, und Sacharjas Spruch über Hadrach, Damaskus und Hamat nennt aramäische Städte aus assyrischen Quellen."
    - "Die Aramäer erscheinen in den assyrischen Annalen um 1100 v. Chr. als Nomaden am Euphrat und hatten im 10. Jahrhundert Königreiche von Damaskus bis zum Chabur. Ihre Staaten waren nach Gründern benannt, das Haus Adini, Agusi, Bahiani, und Assyrien verschlang sie einen nach dem anderen, von Bit-Adini 856 v. Chr. über Arpad 740 bis Damaskus 732. Die Bibel benennt ihre Sprache nach ihnen: Laban nennt den Zeugenhaufen mit einem aramäischen Namen, Jegar-Sahadutha, wo Jakob Gilead sagt, und Hiskias Beamte bitten den Rabsake, „auf syrisch“ zu reden, aramäisch, was das Volk auf der Mauer nicht verstand. Der Eintrag über Aram wird hier in Damaskus verortet, der aramäischen Stadt, die die Bibel am häufigsten nennt."
  fr:
    - "Aram est le nom hébreu du pays des Araméens, peuple sémitique dont les royaumes s’étendaient au nord et au nord-est d’Israël, dans l’actuelle Syrie, Damas étant le plus grand. La Bible grecque, la King James Version et la traduction synodale russe rendent presque toujours le nom par Syrie et le peuple par Syriens, de sorte que là où les lecteurs anglais voient Syrie, l’hébreu dit Aram. La Genèse fait d’Aram un fils de Sem, frère d’Élam et d’Assur, avec pour fils Uts, Hul, Guéter et Masch ; un second Aram est un petit-fils de Nachor, frère d’Abraham. Le nom accompagne d’autres pour marquer des parties du pays : Aram-Naharaïm, « Aram des deux fleuves », le pays de Haran au-delà de l’Euphrate, Paddan-Aram, où Jacob servit Laban « l’Araméen », Aram-Zoba, Aram-Maaca, Aram-Beth-Rehob et l’Aram de Damas."
    - "Balaam dit que Balak l’a fait venir « d’Aram… des montagnes de l’Orient », que la Bible synodale rend par Mésopotamie ; Osée rappelle que « Jacob s’enfuit au pays d’Aram » ; et Israël confessait devant l’autel : « Mon père était un Araméen nomade ». David mit des garnisons « dans la Syrie de Damas », et Absalom habitait « à Gueschur en Syrie » ; le Chroniste dit que Gueschur et Aram prirent les bourgs de Jaïr en Galaad. En Juges 18, certaines traductions modernes lisent que Laïsch n’avait pas de relations avec Aram, là où le texte hébreu porte « avec d’autres hommes », adam ; les deux mots diffèrent d’une lettre. Amos dit que l’Éternel fit venir les Araméens de Kir comme il fit sortir Israël d’Égypte, et l’oracle de Zacharie sur Hadrac, Damas et Hamath nomme des villes araméennes connues des annales assyriennes."
    - "Les Araméens paraissent dans les annales assyriennes vers 1100 av. J.-C. comme nomades sur l’Euphrate, et au Xe siècle ils avaient des royaumes de Damas au Khabour. Leurs États portaient le nom de fondateurs, maison d’Adini, d’Agusi, de Bahiani, et l’Assyrie les absorba un à un, de Bit-Adini en 856 av. J.-C. à Arpad en 740 et Damas en 732. La Bible nomme leur langue d’après eux : Laban appelle le monceau témoin d’un nom araméen, Jegar-Sahadutha, là où Jacob dit Galed, et les officiers d’Ézéchias prient le Rabschaké de parler « en araméen », que le peuple sur la muraille ne comprenait pas. Le dossier d’Aram est ici placé à Damas, la ville araméenne que la Bible nomme le plus souvent."
  it:
    - "Aram è il nome ebraico della terra degli Aramei, il popolo semitico i cui regni sorgevano a nord e a nord-est di Israele nell’odierna Siria, con Damasco la maggiore fra essi. La Bibbia greca, la King James Version e la traduzione sinodale russa rendono quasi sempre il nome come Siria e il popolo come Siri, così che dove i lettori inglesi vedono Siria l’ebraico dice Aram. La Genesi fa di Aram un figlio di Sem, fratello di Elam e Assur, con Uz, Cul, Gheter e Mas per figli; un secondo Aram è un nipote di Nacor, fratello di Abramo. Il nome si unisce ad altri per indicare le parti del paese: Aram-Naharàim, «Aram dei due fiumi», il paese di Carran al di là dell’Eufrate, Paddan-Aram, dove Giacobbe servì Labano «l’Arameo», Aram-Soba, Aram-Maaca, Aram-Bet-Recob e Aram di Damasco."
    - "Balaam dice che Balak lo fece venire «da Aram, [...] dalle montagne d’Oriente», che la Bibbia sinodale rende come Mesopotamia; Osea ricorda che Giacobbe fuggì «nella pianura d’Aram», in ebraico il campo di Aram; e Israele confessava davanti all’altare: «Mio padre era un Arameo errante». Davide pose guarnigioni «nella Siria di Damasco», e Assalonne visse «a Gheshur, in Siria»; il Cronista dice che i Gheshuriti e gli Aramei presero le borgate di Iair in Galaad. In Giudici 18 alcune traduzioni moderne leggono che Lais «non aveva relazioni con Aram», dove il testo ebraico ha «con alcuno», adam; le due parole differiscono per una lettera. Amos dice che il Signore trasse gli Aramei da Kir come trasse Israele dall’Egitto, e l’oracolo di Zaccaria su Adrac, Damasco e Camat nomina città aramee note dalle cronache assire."
    - "Gli Aramei compaiono negli annali assiri intorno al 1100 a.C. come nomadi sull’Eufrate, e nel X secolo avevano regni da Damasco al Khabur. I loro stati prendevano il nome dai fondatori, la casa di Adini, di Agusi, di Bahiani, e l’Assiria li assorbì uno a uno, da Bit-Adini nell’856 a.C. ad Arpad nel 740 e Damasco nel 732. La Bibbia dà il nome alla loro lingua: Labano chiama il mucchio di testimonianza con un nome aramaico, Iegar-Sahadutha, dove Giacobbe dice Galed, e gli ufficiali di Ezechia chiedono al Rabsache di parlare «in aramaico», che il popolo sulle mura non conosceva. Qui Aram è collocata a Damasco, la città aramea che la Bibbia nomina più spesso."
  pl:
    - "Aram to hebrajska nazwa kraju Aramejczyków, semickiego ludu, którego królestwa leżały na północ i północny wschód od Izraela na terenie dzisiejszej Syrii, z Damaszkiem jako największym z nich. Biblia grecka, Biblia króla Jakuba i rosyjski przekład synodalny niemal zawsze oddają tę nazwę jako Syria, a lud jako Syryjczyków, tak że tam, gdzie czytelnicy angielscy widzą Syrię, hebrajski mówi Aram. Księga Rodzaju czyni Arama synem Sema, bratem Elama i Aszura, z synami Us, Chul, Geter i Masz; drugi Aram jest wnukiem brata Abrahama, Nachora. Nazwa łączy się z innymi, by oznaczać części kraju: Aram Naharaim, „Aram dwóch rzek”, kraj Charanu za Eufratem, Paddan-Aram, gdzie Jakub służył Labanowi „Syryjczykowi”, Aram-Soba, Aram-Maaka, Aram-Bet-Rechob i Aram Damaszku."
    - "Balaam mówi: „Z Aram przywiódł mię Balak, król Moabski, z gór wschodnich”, co Biblia synodalna oddaje jako Mezopotamię; Ozeasz wspomina, że „uciekł Jakób z krainy Syryjskiej”, po hebrajsku z pola Aramu; a Izrael wyznawał przed ołtarzem: „Ojciec mój był ubogi Syryjczyk”. Dawid osadził załogi w „Syryją Damaską”, a Absalom mieszkał „w Giessur Syryjskim”; Kronikarz mówi, że Geszur i Aram zabrały wsie Jaira w Gileadzie. W Sdz 18 niektóre współczesne przekłady czytają, że Lajisz „nie miało stosunków z Aramem”, tam gdzie tekst hebrajski ma „z nikim”, adam; oba słowa różnią się jedną literą. Amos mówi, że Pan wyprowadził Aramejczyków z Kir, jak Izraela z Egiptu, a wyrocznia Zachariasza o Chadraku, Damaszku i Chamat wymienia miasta aramejskie znane z zapisów asyryjskich."
    - "Aramejczycy pojawiają się w annałach asyryjskich około 1100 r. p.n.e. jako koczownicy nad Eufratem, a w X wieku mieli królestwa od Damaszku po Chabur. Ich państwa nazywano od założycieli, dom Adiniego, Agusiego, Bahianiego, a Asyria wchłaniała je jedno po drugim, od Bit-Adini w 856 r. p.n.e. po Arpad w 740 i Damaszek w 732. Biblia nazywa od nich ich mowę: Laban nazywa kopiec świadectwa aramejską nazwą Jegar-Sahaduta, gdzie Jakub mówi Galeed, a urzędnicy Ezechiasza proszą Rabszakego, by mówił „po syryjsku”, czyli po aramejsku, którego lud na murze nie znał. Hasło Aramu umieszczono tu w Damaszku, aramejskim mieście, które Biblia wymienia najczęściej."
  nl:
    - "Aram is de Hebreeuwse naam van het land van de Arameeërs, het Semitische volk wier koninkrijken ten noorden en noordoosten van Israël lagen in wat nu Syrië is, met Damascus als grootste. De Griekse Bijbel, de King James Version en de Russische Synodale vertaling geven de naam bijna altijd weer als Syrië en het volk als Syriërs, zodat waar Engelse lezers Syria zien, het Hebreeuws Aram zegt. Genesis maakt Aram tot een zoon van Sem, de broer van Elam en Assur, met Uz, Chul, Geter en Mas als zonen; een tweede Aram is een kleinzoon van Abrahams broer Nachor. De naam gaat samen met andere om delen van het land aan te duiden: Aram-Naharaïm, “Aram van de twee rivieren”, het land van Haran voorbij de Eufraat, Paddan-Aram, waar Jakob Laban, “den Syriër”, diende, Aram-Soba, Aram-Maächa, Aram-Beth-Rechob en Aram van Damascus."
    - "Bileam zegt dat Balak hem liet halen “Uit Syrië... van het gebergte tegen het oosten”, wat de Synodale Bijbel met Mesopotamië weergeeft; Hosea herinnert eraan dat “Jakob vlood toch naar het veld van Syrië”, in het Hebreeuws het veld van Aram; en Israël beleed voor het altaar: “Mijn vader was een bedorven Syriër”. David legde bezettingen “in Syrië van Damaskus”, en Absalom woonde “te Gesur in Syrië”; de Kroniekschrijver zegt dat Gesur en Aram de dorpen van Jaïr in Gilead innamen. In Richteren 18 lezen sommige moderne vertalingen dat Lais niets met Aram te maken had, waar de Hebreeuwse tekst “met enigen mens” heeft, adam; de twee woorden verschillen in één letter. Amos zegt dat de HEER de Arameeërs uit Kir bracht zoals Hij Israël uit Egypte bracht, en Zacharia’s godsspraak over Chadrach, Damascus en Hamat noemt Arameese steden die uit Assyrische bronnen bekend zijn."
    - "De Arameeërs verschijnen omstreeks 1100 v.Chr. in Assyrische annalen als nomaden aan de Eufraat, en hadden in de tiende eeuw koninkrijken van Damascus tot de Khabur. Hun staten droegen de namen van stichters, het huis van Adini, van Agusi, van Bahiani, en Assyrië lijfde ze een voor een in, van Bit-Adini in 856 v.Chr. tot Arpad in 740 en Damascus in 732. De Bijbel noemt hun taal naar hen: Laban noemt de getuigenhoop met een Aramese naam, Jegar-Sahadutha, waar Jakob Galeëd zegt, en Chizkia’s hoofdlieden vragen de Rabsake “in het Syrisch” te spreken, Aramees, dat het volk op de muur niet kende. Het verslag van Aram wordt hier geplaatst te Damascus, de Arameese stad die de Bijbel het vaakst noemt."
  cs:
    - "Aram je hebrejské jméno země Aramejců, semitského národa, jehož království ležela severně a severovýchodně od Izraele v dnešní Sýrii, s Damaškem jako největším z nich. Řecká Bible, Bible krále Jakuba a ruský synodální překlad téměř vždy překládají jméno jako Sýrie a lid jako Syřany, takže tam, kde anglický čtenář vidí Sýrii, hebrejština říká Aram. Genesis činí z Arama syna Šémova, bratra Élama a Aššúra, s Ucem, Chulem, Geterem a Mašem za syny; druhý Aram je vnuk Abrahamova bratra Nachora. Jméno se spojuje s jinými k označení částí země: Aram-naharajim, „Aram dvou řek“, země Cháranu za Eufratem, Padan-aram, kde Jákob sloužil Labanovi „Syrskému“, Aram-sóba, Aram-maaka, Aram-bét-rechob a Aram Damašský."
    - "Bileám praví, že ho Balak přivedl „Z Aram … z hor východních“, což synodální Bible překládá jako Mezopotámie; Ozeáš připomíná, že „utekl byl Jákob z krajiny Syrské“, hebrejsky z pole Aramova; a Izrael vyznával před oltářem: „Syrský chudý otec můj“. O Davidovi se praví, že „osadil David stráží Syrii Damašskou“ a Abšalom bydlel „v Gessur v Syrii“; kronikář praví, že Gešur a Aram vzaly vsi Jairovy v Gileadu. V Soudcích 18 čtou některé moderní překlady, že Lajiš „neměl styky s Aramem“, kde hebrejský text má „s kterými lidmi“, adam; obě slova se liší jedním písmenem. Amos praví, že Hospodin vyvedl Aramejce z Kíru, jako vyvedl Izraele z Egypta, a Zacharjášovo proroctví o Chadrachu, Damašku a Chamatu jmenuje aramejská města známá z asyrských záznamů."
    - "Aramejci se v asyrských análech objevují kolem roku 1100 př. n. l. jako nomádi na Eufratu a v 10. století měli království od Damašku po Chabúr. Jejich státy byly pojmenovány podle zakladatelů, dům Adiniho, Agusiho, Bahianiho, a Asýrie je pohlcovala jeden po druhém, od Bít-Adini roku 856 př. n. l. po Arpád roku 740 a Damašek roku 732. Bible pojmenovává jejich řeč podle nich: Laban nazývá hromadu svědectví aramejským jménem Jegar-sahaduta, kde Jákob říká Galed, a Chizkijášovi úředníci žádají Rab-šakeho, aby mluvil „Syrsky“, aramejsky, čemuž lid na hradbě nerozuměl. Záznam o Aramu je zde vázán na Damašek, aramejské město, které Bible jmenuje nejčastěji."
  sv:
    - "Aram är det hebreiska namnet på arameernas land, det semitiska folk vars kungariken låg norr och nordost om Israel i nuvarande Syrien, med Damaskus som det största. Den grekiska Bibeln, King James-översättningen och den ryska synodalöversättningen återger nästan alltid namnet som Syrien och folket som syrier, så att där engelska läsare ser Syrien har hebreiskan Aram. Första Mosebok gör Aram till en son till Sem, bror till Elam och Assur, med Us, Hul, Geter och Mash som söner; ett andra Aram är ett barnbarn till Abrahams bror Nachor. Namnet förenas med andra för att markera landets delar: Aram-Naharajim, ”Aram mellan de två floderna”, Harrans land bortom Eufrat, Paddan-Aram, där Jakob tjänade ”araméen Laban”, Aram-Sova, Aram-Maaka, Aram-Bet-Rehov och Aram i Damaskus."
    - "Bileam säger: ”Från Aram hämtade mig Balak, från österns berg Moabs konung”, där synodalbibeln återger Aram som Mesopotamien; Hosea minns att ”Jakob flydde till Arams mark”; och Israel bekände vid altaret: ”Min fader var en hemlös aramé”. David insatte ”fogdar bland araméerna i Damaskus”, och Absalom bodde ”i Gesur i Aram”; Krönikeförfattaren säger att Geshur och Aram tog Jairs byar i Gilead. I Domarboken 18 läser några moderna översättningar att Lajish ”hade inga förbindelser med Aram”, där den hebreiska texten har ”med andra människor”, adam; de två orden skiljer sig åt med en bokstav. Amos säger att HERREN förde arameerna från Kir liksom han förde Israel från Egypten, och Sakarjas utsaga om Hadrak, Damaskus och Hamat nämner arameiska städer kända från assyriska källor."
    - "Arameerna förekommer i assyriska annaler omkring 1100 f.Kr. som nomader vid Eufrat, och på 900-talet f.Kr. hade de kungariken från Damaskus till Khabur. Deras stater fick namn efter grundare, Adinis hus, Agusis, Bahianis, och Assyrien uppslukade dem en efter en, från Bit-Adini år 856 f.Kr. till Arpad år 740 och Damaskus år 732. Bibeln nämner deras språk efter dem: Laban kallar vittnesröset med ett arameiskt namn, Jegar-Sahaduta, där Jakob säger Galed, och Hiskias män ber Rab-Shake tala ”på arameiska”, som folket på muren inte kunde. Arams punkt här är placerad i Damaskus, den arameiska stad som Bibeln nämner oftast."
  nb:
    - "Aram er det hebraiske navnet på landet til arameerne, det semittiske folket hvis riker lå nord og nordøst for Israel i det som nå er Syria, med Damaskus som det største. Den greske bibelen, King James-oversettelsen og den russiske synodaloversettelsen gjengir navnet nesten alltid som Syria og folket som syrere, slik at der engelske lesere ser Syria, sier hebraisk Aram. 1. Mosebok gjør Aram til en sønn av Sem, bror til Elam og Assur, med Us, Hul, Geter og Masj som sønner; en annen Aram er sønnesønn av Abrahams bror Nahor. Navnet inngår sammen med andre i betegnelser på landets deler: Aram-Naharajim, «Aram ved de to elvene», Harrans land hinsides Eufrat, Paddan-Aram, der Jakob tjente Laban «arameeren», Aram-Soba, Aram-Maaka, Aram-Bet-Rehob og Aram-Damaskus."
    - "Bileam sier at Balak hentet ham «Fra Aram … fra Østens fjell», noe synodalbibelen gjengir som Mesopotamia; Hosea minnes at «Jakob flyktet til Arams land»; og Israel bekjente foran alteret: «Min far var en omvankende araméer». David la krigsmannskap i «det damaskenske Syria», og Absalom bodde «i Gesur i Syria»; Krønikeskriveren sier at gesurittene og arameerne tok Jairs byer i Gilead. I Dommerboken 18 leser noen moderne oversettelser at Lajisj «ikke hadde noe med Aram å gjøre», der den hebraiske teksten har «med noget menneske», adam; de to ordene skiller seg med én bokstav. Amos sier at Herren førte arameerne opp fra Kir slik han førte Israel opp fra Egypt, og Sakarjas utsagn mot Hadrak, Damaskus og Hamat nevner arameiske byer kjent fra assyriske kilder."
    - "Arameerne opptrer i assyriske annaler omkring 1100 f.Kr. som nomader ved Eufrat, og på 900-tallet hadde de riker fra Damaskus til Khabur. Statene deres ble oppkalt etter grunnleggere, Adinis, Agusis og Bahianis hus, og Assyria slukte dem én etter én, fra Bit-Adini i 856 f.Kr. til Arpad i 740 og Damaskus i 732. Bibelen oppkaller språket deres etter dem: Laban gir vitnehaugen et arameisk navn, Jegar-Sahaduta, der Jakob sier Gal-Ed, og Hiskias embetsmenn ber Rabsjake tale «på syrisk, for vi forstår det sprog», arameisk, som folket på muren ikke forsto. Beretningen om Aram her er plassert i Damaskus, den arameiske byen Bibelen nevner oftest."
  tl:
    - "Ang Aram ay ang pangalang Hebreo ng lupain ng mga Arameo, ang bayang Semitiko na ang mga kaharian ay nasa hilaga at hilagang-silangan ng Israel sa ngayo'y Siria, na ang Damasco ang pinakadakila. Halos laging isinasalin ng Bibliyang Griyego, King James Version at Sinodal na Biblia ang pangalan bilang Siria at ang bayan bilang mga taga-Siria, kaya kung saan nakikita ng mga mambabasang Ingles ang Siria, ang Hebreo ay Aram. Anak ni Sem si Aram sa Genesis, kapatid ni Elam at Assur, na may mga anak na sina Uz, Hul, Gether at Mas; ang ikalawang Aram ay apo ng kapatid ni Abraham na si Nachor. Sinasamahan ng iba ang pangalan upang markahan ang mga bahagi ng lupain: Aram-naharaim, “Aram ng dalawang ilog”, ang bansa ng Haran sa kabila ng Eufrates, Padan-aram, kung saan naglingkod si Jacob kay Laban na “taga Siria”, Aram-soba, Aram-maacha, Aram-beth-rehob at Aram ng Damasco."
    - "Sinasabi ni Balaam, “Mula sa Aram ay dinala ako rito ni Balac”, “mula sa mga bundok ng Silanganan” (Mesopotamia sa Sinodal na Biblia); naaalala ni Oseas na “si Jacob ay tumakas na napatungo sa parang ng Aram”, sa King James Version ay “the country of Syria”; at ipinagtapat ng Israel sa altar, “Isang taga Siria na kamunti nang mamatay ang aking ama”. Naglagay si David ng pulutong “sa Siria sa Damasco”, tumira si Absalom “sa Gesur sa Siria”; sinakop ng Gessur at Aram ang mga bayan ni Jair sa Gilead. Sa Mga Hukom 18, binabasa ng ilang salin na “walang pakikipagkasundo” ang Lais sa Aram, ngunit “sa kaninoman”, adam, ang Hebreo; isang titik ang pagkakaiba. Sabi ni Amos, inilabas ng Panginoon ang mga Arameo mula sa Cir gaya ng Israel mula sa Egipto, at ang hula ni Zacharias sa Hadrach, Damasco at Hamath ay nagpapangalan ng mga lungsod na Arameo mula sa mga talaang Asirio."
    - "Lumilitaw ang mga Arameo sa mga salaysay ng Asiria noong mga 1100 BK bilang mga lagalag sa Eufrates, at pagsapit ng ika-10 siglo ay may mga kaharian mula Damasco hanggang Khabur. Ang kanilang mga estado ay ipinangalan sa mga nagtatag, ang sambahayan ng Adini, ng Agusi, ng Bahiani, at isa-isang isinanib ng Asiria, mula sa Bit-Adini noong 856 BK hanggang Arphad noong 740 at Damasco noong 732. Ipinangalan ng Biblia ang kanilang wika sa kanila: tinawag ni Laban ang bunton ng saksi sa pangalang Arameo, Jegarsahadutha, kung saan sinasabi ni Jacob na Galaad, at hiniling ng mga opisyal ni Ezechias kay Rabsaces na magsalita sa kanila “ng wikang Siria”, Arameo, na hindi alam ng bayan sa pader. Ang talaan ng Aram dito ay inilalagay sa Damasco, ang lungsod na Arameo na pinakamadalas pangalanan ng Biblia."
  da:
    - "Aram er det hebraiske navn på arameernes land, det semitiske folk, hvis riger lå nord og nordøst for Israel i det nuværende Syrien, med Damaskus som det største. Den græske bibel, King James Version og den russiske synodaloversættelse gengiver næsten altid navnet som Syrien og folket som syrerne, så hvor engelske læsere ser Syria, siger hebraisk Aram. Første Mosebog gør Aram til en søn af Sem, bror til Elam og Assur, med Uz, Hul, Geter og Masj til sønner; en anden Aram er et barnebarn af Abrahams bror Nahor. Navnet indgår sammen med andre i betegnelser for landets dele: Aram-Naharajim, »Aram ved de to floder«, landet omkring Karan hinsides Eufrat, Paddan-Aram, hvor Jakob tjente Laban »Syreren«, Aram-Soba, Aram-Maaka, Aram-Bet-Rehob og Aram-Damaskus."
    - "Bileam siger, at Balak lod ham hente »fra Syrien ... fra Bjergene mod Østen«, hvilket synodalbibelen gengiver som Mesopotamien; Hoseas husker, at »Jakob flyede til Arams Land«, på hebraisk Arams mark; og Israel bekendte ved alteret: »Min Fader var en omvankende Syrer«. David lagde besætning »i det damascenske Syrien«, og Absalon boede »i Gesur i Syrien«; Krønikeskriveren siger, at Gesjur og Aram tog Jairs byer i Gilead. I Dommerbogen 18 læser nogle moderne oversættelser, at Laisj »ikke havde noget at gøre med Aram«, hvor den hebraiske tekst har »med noget menneske«, adam; de to ord adskiller sig ved ét bogstav. Amos siger, at Herren førte arameerne op fra Kir, som han førte Israel op fra Egypten, og Zakarias' udsagn om Hadrak, Damaskus og Hamat nævner arameiske byer kendt fra assyriske optegnelser."
    - "Arameerne optræder i assyriske annaler omkring 1100 f.Kr. som nomader ved Eufrat, og i 900-tallet havde de riger fra Damaskus til Khabur. Deres stater var opkaldt efter grundlæggere, Adinis hus, Agusis, Bahianis, og Assyrien optog dem én efter én, fra Bit-Adini i 856 f.Kr. til Arpad i 740 og Damaskus i 732. Bibelen opkalder deres sprog efter dem: Laban kalder vidnehoben ved et arameisk navn, Jegar-Sahaduta, hvor Jakob siger Gilead, og Hizkijas embedsmænd beder Rabsjake tale »paa Syrisk«, arameisk, som folket på muren ikke forstod. Optegnelsen om Aram er her placeret ved Damaskus, den arameiske by, Bibelen nævner oftest."
  sr:
    - "Арам је хебрејско име земље Арамејаца, семитског народа чија су краљевства лежала северно и североисточно од Израиља у данашњој Сирији, с Дамаском као највећим међу њима. Грчка Библија, Библија краља Џејмса и руски синодални превод скоро увек преносе име као Сирија, а народ као Сирце, па где енглески читалац види Сирију, хебрејски каже Арам. Постање чини Арама сином Симовим, братом Елама и Асура, са синовима Уз, Ул, Гатер и Мас; други Арам је унук Аврамовог брата Нахора. Име с другима означава делове земље: Арам-Нахараим, „Арам двеју река“, земља Харана иза Еуфрата, Падан-Арам, где је Јаков служио Лавану „Сирину“, Арам-Сова, Арам-Маха, Арам-Вет-Реов и Арам Дамаска."
    - "Валам каже да га је Валак довео „Из Арама… с планине источне“, што синодална Библија преноси као Месопотамија; Осија се сећа: „Јаков побеже у земљу сирску“, на хебрејском поље Арама; а Израиљ је пред олтаром исповедао: „Отац мој беше сиромах Сирин“. Давид је поставио посаде „у Сирији што је под Дамаском“, а Авесалом је живео „у Гесуру у Сирији“; Летописац каже да су Гесур и Арам узели Јаирова села у Галаду. У Судијама 18 неки савремени преводи читају да Лаис „није имао посла с Арамом“, где хебрејски текст има „ништа ни с ким“, адам; две речи се разликују једним словом. Амос каже да је Господ извео Арамејце из Кира као што је извео Израиља, а Захаријино пророштво о Хадраху, Дамаску и Емату помиње арамејске градове познате из асирских записа."
    - "Арамејци се јављају у асирским аналима око 1100. п. н. е. као номади на Еуфрату, а до 10. века имали су краљевства од Дамаска до Хабура. Њихове државе назване су по оснивачима, дом Адинијев, Агусијев, Бахијанијев, а Асирија их је упијала једну по једну, од Бит-Адинија 856. п. н. е. до Арфада 740. и Дамаска 732. Библија по њима именује њихов говор: Лаван зове гомилу сведочанства арамејским именом, Јегар-Сахадута, где Јаков каже Галед, а Језекијини достојанственици моле Равсака да говори „сирски“, то јест арамејски, који народ на зиду није разумео. Запис о Араму овде је смештен у Дамаск, арамејски град који Библија најчешће именује."
  hu:
    - "Arám az arámiak földjének héber neve, annak a sémi népnek, amelynek királyságai Izráeltől északra és északkeletre feküdtek a mai Szíria területén, legnagyobbjuk Damaszkusszal. A görög Biblia, a King James-fordítás és az orosz szinodális fordítás szinte mindig Szíriának fordítja a nevet, a népet pedig szíriaiaknak, így ahol az angol olvasó Szíriát lát, a héberben Arám áll. A Teremtés könyve Arámot Szém fiává teszi, Élám és Asszúr testvérévé, fiai Úc, Húl, Géter és Más; egy második Arám Ábrahám testvérének, Náhornak unokája. A név más szavakkal együtt a föld részeit jelöli: Arám-Naharajim, „a két folyó Arámja”, az Eufráteszen túli Hárán országa, Pádán-Arám, ahol Jákób Lábánt, a „Siriából való” Lábánt szolgálta, Arám-Cóbá, Arám-Maaka, Arám-Bét-Rehób és a damaszkuszi Arám."
    - "Bálám így beszél: „Siriából hozatott engem Bálák, Moábnak királya kelet hegyeiről”; ezt a szinodális Biblia Mezopotámiának fordítja; Hóseás megemlékezik arról, hogy „Jákób Aram földére bujdosott”, a héberben Arám mezejére; és Izráel az oltár előtt így vallott: „Veszendő mesopotámiai vala az atyám”. Dávid állandó sereget helyezett „a damaskusi Siriába”, Absolon pedig „Gessurban” lakott, „mely Siriában van”; a Krónikák szerint Gesúr és Arám elvették Jaír falvait Gileádban. A Bírák 18-ban egyes modern fordítások úgy olvassák, hogy Laisnak nem volt dolga Arámmal, ahol a héber szöveg szerint senkivel nem volt dolga (ádám); a két szó egyetlen betűben tér el. Ámós azt mondja, hogy az Úr az arámiakat Kirből hozta, ahogyan Izráelt Egyiptomból, Zakariás Hadrák, Damaszkusz és Hamát elleni jövendölése pedig asszír forrásokból ismert arámi városokat nevez meg."
    - "Az arámiak a Kr. e. 1100 körüli asszír évkönyvekben az Eufrátesz menti nomádokként jelennek meg, a 10. századra pedig Damaszkusztól a Khaburig királyságaik voltak. Államaikat alapítóikról nevezték el: Bit-Adini, Bit-Agusi, Bit-Bahiani, és Asszíria sorra felszívta őket, a Kr. e. 856-os Bit-Adinitől a 740-es Arpádon át a 732-es Damaszkuszig. A Biblia beszédükről is megemlékezik: Lábán a tanúság halmát arámi néven, Jegár-Sahaduthának hívja, ahol Jákób Gálhédet mond, Ezékiás tisztjei pedig megkérik Rabsakét, hogy beszéljen velük „siriai nyelven”, vagyis arámiul, amelyet a falon lévő nép nem értett. Arám jelölése a térképen Damaszkuszhoz van téve, ahhoz az arámi városhoz, amelyet a Biblia a leggyakrabban megnevez."
  fi:
    - "Aram on heprealainen nimi aramealaisten maalle; tämän seemiläisen kansan kuningaskunnat sijaitsivat Israelin pohjois- ja koillispuolella nykyisessä Syyriassa, Damaskos suurimpana. Kreikkalainen Raamattu, King James ja venäläinen synodaalinen käännös kääntävät nimen lähes aina Syyriaksi ja kansan syyrialaisiksi, joten missä englannin lukija näkee Syyrian, heprea sanoo Aram. 1. Mooseksen kirja tekee Aramista Seemin pojan, Eelamin ja Assurin veljen, ja hänen poikansa ovat Uus, Huul, Geter ja Mas; toinen Aram on Abrahamin veljen Nahorin pojanpoika. Muut nimet merkitsevät maan osia: Aram-Naharaim, ”kahden joen Aram”, Harranin maa Eufratin takana, Paddan-Aram, jossa Jaakob palveli Laabania, aramilaista, Aram-Soba, Aram-Maaka, Aram-Beet-Rehob ja Damaskon Aram."
    - "Bileam sanoo, että Baalak toi hänet: ”Aramista nouti minut Baalak, idän vuorilta Mooabin kuningas”, ja synodaalinen Raamattu kääntää Aramin Mesopotamiaksi; Hoosea muistaa: ”Jaakob pakeni Aramin kedoille”, ja Israel tunnusti alttarin edessä: ”Minun isäni oli harhaileva aramilainen, joka meni Egyptiin”. Daavid asetti varusväkeä ”Damaskon Aramiin”, ja Absalom asui ”Gesurissa, Aramissa”; Aikakirjojen kirjoittaja sanoo Gesurin ja Aramin vallanneen Jairin kylät Gileadissa. Tuom. 18:ssa jotkin nykykäännökset lukevat, että Lais ei ollut tekemisissä Aramin kanssa, vaikka heprean tekstissä on ”tekemisissä muitten ihmisten kanssa”, adam; sanat eroavat yhdellä kirjaimella. Aamos sanoo Herran tuoneen aramealaiset Kiiristä kuten Israelin Egyptistä, ja Sakarjan ennustus Hadrakista, Damaskoksesta ja Hamatista nimeää assyrialaisista asiakirjoista tunnettuja aramealaisia kaupunkeja."
    - "Aramealaiset esiintyvät assyrialaisissa vuosikirjoissa noin 1100 eaa. Eufratin paimentolaisina, ja 900-luvulla heillä oli kuningaskuntia Damaskoksesta Khaburille. Niiden valtiot nimettiin perustajiensa mukaan, Adinin, Agusin ja Bahianin suku, ja Assyria nieli ne yksi kerrallaan, Bit-Adinista 856 eaa. Arpadiin 740 ja Damaskokseen 732. Raamattu nimeää niiden kielen niiden mukaan: Laban antaa todistuskasalle aramealaisen nimen Jegar-Saahaduta, missä Jaakob sanoo Galed, ja Hiskian upseerit pyytävät Rabsakea puhumaan ”araminkieltä”, aramean kieltä, jota muurilla oleva kansa ei ymmärtänyt. Aramin merkintä on tässä sijoitettu Damaskokseen, aramealaiseen kaupunkiin, jonka Raamattu nimeää useimmin."
  vi:
    - "A-ram là tên Hê-bơ-rơ của xứ người A-ram, dân Semit có các vương quốc nằm ở phía bắc và đông bắc Y-sơ-ra-ên trên vùng nay là Sy-ri, trong đó Đa-mách là lớn nhất. Kinh Thánh Hy Lạp, bản King James và bản dịch Synodal tiếng Nga hầu như luôn dịch tên này là Sy-ri và dân là người Sy-ri, nên ở chỗ người đọc tiếng Anh thấy Syria thì tiếng Hê-bơ-rơ nói Aram. Sáng Thế Ký cho A-ram là con của Sem, anh em của Ê-lam và A-su-rơ, có các con là Út-xơ, Hu-lơ, Ghê-te và Mách; một A-ram thứ hai là cháu của Na-cô, anh em Áp-ra-ham. Tên đi cùng các tên khác để chỉ các phần của xứ: A-ram Na-ha-ra-im, “A-ram của hai con sông”, xứ của Cha-ran bên kia sông Ơ-phơ-rát, Pha-đan A-ram, nơi Gia-cốp phục dịch La-ban, “người A-ram”, A-ram Xô-ba, A-ram Ma-a-ca, A-ram Bết-Rê-hốp và A-ram của Đa-mách."
    - "Ba-la-am nói rằng Ba-lác đã sai vời ông “từ A-ram, từ những núi Đông-phương”, mà bản Synodal dịch là Mê-sô-bô-ta-mi; Ô-sê nhớ lại rằng “Gia-cốp trốn đến ruộng A-ram”, trong tiếng Hê-bơ-rơ là đồng ruộng của A-ram; và Y-sơ-ra-ên xưng nhận trước bàn thờ: “Tổ phụ tôi là người A-ram phiêu lưu”. Đa-vít “lập đồn trong Đa-mách xứ Sy-ri”, và Áp-sa-lôm ở “tại Ghê-su-rơ trong Sy-ri”; tác giả sách Sử Ký nói rằng Ghê-su-rơ và A-ram chiếm các làng của Giai-rơ ở Ga-la-át. Trong Các Quan Xét 18, một số bản dịch hiện đại đọc rằng La-ít “không có giao dịch với A-ram”, nơi bản Hê-bơ-rơ có “với bất cứ ai”, adam; hai từ chỉ khác nhau một chữ cái. A-mốt nói rằng Đức Giê-hô-va đem người A-ram từ Ki-rơ ra như Ngài đem Y-sơ-ra-ên ra khỏi Ê-díp-tô, và lời sấm của Xa-cha-ri về Ha-đơ-rắc, Đa-mách và Ha-mát nêu các thành A-ram được biết từ các tài liệu A-si-ri."
    - "Người A-ram xuất hiện trong niên sử A-si-ri khoảng năm 1100 TCN như dân du mục bên sông Ơ-phơ-rát, và đến thế kỷ 10 đã có các vương quốc từ Đa-mách đến Khabur. Các nước của họ được đặt tên theo người sáng lập, nhà Adini, Agusi, Bahiani, và A-si-ri nuốt chúng từng nước một, từ Bit-Adini năm 856 TCN đến Ạt-bát năm 740 và Đa-mách năm 732. Kinh Thánh đặt tên thứ tiếng của họ theo họ: La-ban gọi đống đá chứng bằng một tên A-ram, Y-ê-ga Sa-ha-đu-ta, nơi Gia-cốp nói Ga-lét, và các quan của Ê-xê-chia xin Ráp-sa-kê nói “bằng tiếng Sy-ri”, tức tiếng A-ram, thứ tiếng mà dân trên tường thành không biết. Ghi chép về A-ram ở đây được đặt tại Đa-mách, thành A-ram được Kinh Thánh nêu nhiều nhất."
  ro:
    - "Aram este numele ebraic al țării aramenilor, poporul semit ale cărui regate se aflau la nord și la nord-est de Israel, în ceea ce este acum Siria, cu Damascul drept cel mai mare dintre ele. Biblia greacă, versiunea King James și traducerea sinodală rusă redau aproape întotdeauna numele ca Siria și poporul ca sirieni, așa că acolo unde cititorii englezi văd Siria, ebraica spune Aram. Geneza îl face pe Aram fiu al lui Sem, fratele lui Elam și al lui Așur, având ca fii pe Uț, Hul, Gheter și Maș; un al doilea Aram este nepot al fratelui lui Avraam, Nahor. Numele se însoțește cu altele pentru a marca părți ale țării: Aram-Naharaim, „Aramul celor două râuri”, țara Haranului dincolo de Eufrat, Padan-Aram, unde Iacov i-a slujit lui Laban sirianul, Aram-Țoba, Aram-Maaca, Aram-Bet-Rehob și Aramul Damascului."
    - "Balaam spune că Balac l-a chemat: „din Mesopotamia m’a chemat pre mine Valac împăratul lui Moav, din munți dela răsărit”, ceea ce Biblia sinodală redă ca Mesopotamia; Osea își amintește că „Și s’a dus Iacov în câmpul Siriei”, în ebraică câmpul Aramului; iar Israel mărturisea înaintea altarului că tatăl lui fusese un sirian pe cale să piară. David a pus garnizoane în Siria Damascului, iar Absalom a trăit „în Ghedsur în Siriea”; Cronicarul spune că Gheșur și Aram au luat satele lui Iair din Galaad. În Judecători 18, unele traduceri moderne citesc că Laiș nu avea legături cu Aram, acolo unde textul ebraic are „cu vreun om”, adam; cele două cuvinte diferă printr-o singură literă. Amos spune că Domnul i-a adus pe arameni din Chir așa cum l-a adus pe Israel din Egipt, iar oracolul lui Zaharia despre Hadrac, Damasc și Hamat numește cetăți arameene din analele asiriene."
    - "Aramenii apar în analele asiriene în jurul anului 1100 î.Hr. ca nomazi pe Eufrat, iar în secolul al X-lea aveau regate de la Damasc până la Habur. Statele lor au fost numite după întemeietori, casa lui Adini, a lui Agusi, a lui Bahiani, iar Asiria le-a absorbit pe rând, de la Bit-Adini în 856 î.Hr. până la Arpad în 740 și Damasc în 732. Biblia numește limba lor după ei: Laban numește movila mărturiei cu un nume aramaic, Iegar-Sahaduta, acolo unde Iacov spune Galeed, iar dregătorii lui Ezechia îl roagă pe Rabșache să vorbească „sirienește”, adică aramaica, pe care oamenii de pe zid nu o știau. Relatarea despre Aram este plasată aici la Damasc, cetatea aramee pe care Biblia o numește cel mai des."
  bg:
    - "Арам е еврейското име на земята на арамейците, семитския народ, чиито царства лежали на север и североизток от Израил в днешна Сирия, с Дамаск като най-голямото от тях. Гръцката Библия, Библията на крал Джеймс и руският Синодален превод почти винаги предават името като Сирия, а народа като сирийци, така че където англоезичните читатели виждат Сирия, еврейският казва Арам. Битие прави Арам син на Сим, брат на Елам и Асур, със синове Уц, Хул, Гетер и Маш; втори Арам е внук на брата на Авраам Нахор. Името се съчетава с други, за да отбележи частите на страната: Арам-Нахараим, „Арам на двете реки“, страната на Харан отвъд Ефрат, Падан-Арам, където Яков служил на „Лавана Сирина“, Арам-Сува, Арам-Маха, Арам-Бет-Рехов и Арам на Дамаск."
    - "Валаам казва, че Валак го довел „от Арам, От източните гори“, което Синодалната Библия предава като Месопотамия; Осия си спомня, че „Яков побегна в Сирийското поле“, на еврейски — полето на Арам; а Израил изповядвал пред олтара: „Отец ми беше един Сирианин скитаещ се“. Давид турил стражи „в Дамасковата Сирия“, а Авесалом живял „в Гесур, в Сирия“; Летописецът казва, че Гесур и Арам взели селата на Яир в Галаад. В Съдии 18 някои съвременни преводи четат, че Лаиш нямал връзки с Арам, докато в еврейския текст стои „с никого“ — адам; двете думи се различават с една буква. Амос казва, че Господ извел арамейците от Кир, както извел Израил от Египет, а прорицанието на Захария за Хадрах, Дамаск и Емат назовава арамейски градове, известни от асирийски записи."
    - "Арамейците се появяват в асирийските летописи около 1100 г. пр.н.е. като номади на Ефрат, а до X в. имали царства от Дамаск до Хабур. Държавите им били наречени по основатели — дома на Адини, на Агуси, на Бахиани, и Асирия ги погълнала една по една, от Бит-Адини през 856 г. пр.н.е. до Арпад през 740 г. и Дамаск през 732 г. Библията назовава езика им по тях: Лаван нарича купчината на свидетелството с арамейско име, Йегар-Сахадута, където Яков казва Галаад, а чиновниците на Езекия молят Рабсак да говори „по Сирийския език“, арамейски, който хората на стената не разбирали. Записът за Арам тук е поставен при Дамаск, арамейския град, назоваван най-често в Библията."
