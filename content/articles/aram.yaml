# Overview article (ADR 0007). Mainstream facts only; written about the name Aram and its uses, without restating the Syria article; the reading "Aram" in Judges 18 is given as a modern emendation.
id: aram
place: a3e66cd
title:
  en: "Aram"
  ru: "Арам"
body:
  en:
    - "Aram is the Hebrew name of the land of the Aramaeans, the Semitic people whose kingdoms lay north and north-east of Israel in what is now Syria, with Damascus as the greatest of them. The Greek Bible, the King James Version and the Russian Synodal translation nearly always render the name as Syria and the people as Syrians, so that where English readers see Syria the Hebrew says Aram. Genesis makes Aram a son of Shem, the brother of Elam and Asshur, with Uz, Hul, Gether and Mash for sons; a second Aram is a grandson of Abraham's brother Nahor. The name goes with others to mark the parts of the land: Aram-naharaim, “Aram of the two rivers”, the country of Haran beyond the Euphrates, Paddan-aram, where Jacob served Laban “the Syrian”, Aram-zobah, Aram-maacah, Aram-beth-rehob and Aram of Damascus."
    - "Balaam says that Balak brought him “from Aram, out of the mountains of the east”, which the Synodal Bible renders as Mesopotamia; Hosea remembers that “Jacob fled into the country of Syria”, in Hebrew the field of Aram; and Israel confessed before the altar, “A Syrian ready to perish was my father”. David put garrisons “in Syria of Damascus”, and Absalom lived “at Geshur in Syria”; the Chronicler says that Geshur and Aram took the villages of Jair in Gilead. In Judges 18 some modern translations read that Laish “had no dealings with Aram”, where the Hebrew text has “with any man”, adam; the two words differ by one letter. Amos says that the LORD brought the Aramaeans from Kir as he brought Israel from Egypt, and Zechariah's oracle on Hadrach, Damascus and Hamath names Aramaean cities known from Assyrian records."
    - "The Aramaeans appear in Assyrian annals about 1100 BC as nomads on the Euphrates, and by the tenth century had kingdoms from Damascus to the Khabur. Their states were named after founders, the house of Adini, of Agusi, of Bahiani, and Assyria absorbed them one by one, from Bit-Adini in 856 BC to Arpad in 740 and Damascus in 732. The Bible names their speech after them: Laban calls the heap of witness by an Aramaic name, Jegar-sahadutha, where Jacob says Galeed, and Hezekiah's officers ask the Rabshakeh to speak “in the Syrian language”, Aramaic, which the people on the wall did not know. The record of Aram here is placed at Damascus, the Aramaean city the Bible names most often."
  ru:
    - "Арам — еврейское имя земли арамеев, семитского народа, чьи царства лежали к северу и северо-востоку от Израиля, на землях нынешней Сирии, и величайшим из которых был Дамаск. Греческая Библия, английская Библия короля Иакова и русский Синодальный перевод почти всюду передают это имя как Сирия, а народ — как Сирияне или Сирийцы, так что там, где русский читатель видит Сирию, в еврейском тексте стоит Арам. Книга Бытия делает Арама сыном Сима, братом Елама и Ассура, с сыновьями Уцем, Хулом, Гефером и Машем; второй Арам — внук Нахора, брата Авраама. Имя входит в составные названия частей страны: Арам-Нахараим, «Арам двух рек», край Харрана за Евфратом, Паддан-Арам, где Иаков служил Лавану Арамеянину (в Синодальном переводе оба — Месопотамия), Арам-Цова, Арам-Мааха, Арам-Беф-Рехов и Арам Дамасский."
    - "Валаам говорит: «из Месопотамии привел меня Валак, царь Моава, от гор восточных», и в еврейском тексте здесь стоит Арам; Осия вспоминает: «Убежал Иаков на поля Сирийские», по-еврейски на поле Арама; Израиль исповедовал у жертвенника: «отец мой был странствующий Арамеянин». «поставил Давид охранные войска в Сирии Дамасской», а Авессалом жил «в Гессуре в Сирии»; летописец говорит, что Гессуряне и Сирияне взяли селения Иаира в Галааде. В 18-й главе Судей некоторые современные переводы читают, что Лаис не имел дела с Арамом, тогда как в еврейском тексте стоит «ни с кем», адам: два слова различаются одной буквой. Амос говорит, что Господь вывел Арамлян из Кира, как Израиля из Египта, а пророчество Захарии о Хадрахе, Дамаске и Емафе называет арамейские города, известные по ассирийским записям."
    - "Арамеи появляются в ассирийских анналах около 1100 г. до н. э. как кочевники на Евфрате, а к X веку имели царства от Дамаска до Хавора. Их государства звались по основателям — дом Адини, дом Агуси, дом Бахиани, — и Ассирия поглотила их одно за другим, от Бит-Адини в 856 г. до н. э. до Арпада в 740 г. и Дамаска в 732 г. Библия называет их речь их именем: Лаван дал груде свидетельства арамейское имя «Иегар-Сагадуфа», где Иаков сказал Галаад, а приближённые Езекии просили Рабсака: «говори рабам твоим по-арамейски», чтобы не понял народ на стене. Запись об Араме здесь помещена в Дамаске — арамейском городе, который Библия называет чаще всего."
