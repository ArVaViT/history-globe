body:
  en:
    - "Caesarea lies on the Mediterranean coast of the Sharon plain, on a stretch of shore with no natural harbour. In the Persian period a small Phoenician anchorage stood here, Strato's Tower, perhaps named after Straton, a king of Sidon; the Zenon papyri mention it in 259 BC. Alexander Jannaeus added it to the Hasmonean kingdom, Pompey made it a free town in 63 BC, and in 30 BC Augustus gave it to Herod the Great."
    - "From 22 BC Herod built a new city on the site and named it Caesarea after the emperor. Its harbour, Sebastos, was made with breakwaters of hydraulic concrete laid in the open sea; above it stood a temple of Roma and Augustus, with a theatre, a palace on a promontory and an aqueduct. The city was dedicated with games in about 10 BC. When Judea became a province in AD 6, Caesarea became the seat of its Roman governors; a stone found in the theatre in 1961 names Pontius Pilate as prefect of Judea."
    - "In Acts, Philip the evangelist settled in Caesarea, and at Peter's word the centurion Cornelius and his household were baptised there, gentiles received into the church. Herod Agrippa I died at Caesarea in AD 44, as both Acts and Josephus relate. Paul passed through the port several times and was held there for two years under the governor Felix and then under Festus, before he spoke before Agrippa II and sailed for Rome."
    - "Strife between the city's Greeks and Jews helped spark the revolt of AD 66. Vespasian made Caesarea a Roman colony, and after 135 it remained the capital of the province, now called Syria Palaestina. Origen settled there in the 230s, and the library gathered by him and Pamphilus served Eusebius, bishop of Caesarea from about 313, who recorded the martyrs who died in the city under Diocletian. Rabbis also taught there. In 333 the Pilgrim of Bordeaux was shown the bath of Cornelius, and about 390 Caesarea became the metropolis of Palaestina Prima."
  ru:
    - "Кесария стоит на средиземноморском берегу равнины Сарон, где нет естественной гавани. В персидское время здесь была небольшая финикийская стоянка, Башня Стратона, названная, возможно, по имени сидонского царя Стратона; в 259 г. до н. э. её упоминают папирусы Зенона. Александр Яннай присоединил её к Хасмонейскому царству, Помпей в 63 г. до н. э. сделал её свободным городом, а в 30 г. до н. э. Август отдал её Ироду Великому."
    - "С 22 г. до н. э. Ирод строил на этом месте новый город и назвал его Кесарией в честь императора. Его гавань, Себастос, была сооружена из волнорезов, отлитых из гидравлического бетона прямо в открытом море; над ней стоял храм Ромы и Августа, а рядом театр, дворец на мысу и водопровод. Город был освящён играми около 10 г. до н. э. Когда Иудея в 6 г. н. э. стала провинцией, Кесария сделалась резиденцией римских наместников; камень, найденный в театре в 1961 г., называет Понтия Пилата префектом Иудеи."
    - "По книге Деяний, в Кесарии поселился Филипп благовестник, а по слову Петра там крестились сотник Корнилий и дом его — язычники, принятые в церковь. В 44 г. н. э. в Кесарии умер Ирод Агриппа I, о чём рассказывают и Деяния, и Иосиф Флавий. Павел не раз проходил через этот порт, а затем провёл здесь в узах два года при правителе Феликсе и после него при Фесте, пока не говорил перед Агриппой II и не отплыл в Рим."
    - "Вражда между греками и иудеями города стала одним из поводов к восстанию 66 г. н. э. Веспасиан сделал Кесарию римской колонией, а после 135 г. она осталась столицей провинции, теперь называвшейся Сирией Палестинской. В 230-е годы здесь поселился Ориген, и собранная им и Памфилом библиотека служила Евсевию, епископу Кесарии примерно с 313 г., который описал мучеников, погибших в городе при Диоклетиане. Учили здесь и раввины. В 333 г. паломнику из Бордо показывали баню Корнилия, а около 390 г. Кесария стала митрополией Первой Палестины."
  uk:
    - "Кесарія лежить на середземноморському узбережжі Шаронської рівнини, на відтинку берега без природної гавані. У персидський період тут стояла невелика фінікійська пристань, Вежа Стратона, можливо, названа на честь Стратона, царя Сідона; папіруси Зенона згадують її в 259 р. до н. е. Александр Яннай додав її до хасмонейського царства, Помпей у 63 р. до н. е. зробив її вільним містом, а в 30 р. до н. е. Август віддав її Іродові Великому."
    - "З 22 р. до н. е. Ірод будував на цьому місці нове місто й назвав його Кесарією на честь імператора. Його гавань, Себаст, була зроблена з хвилерізів із гідравлічного бетону, покладених у відкритому морі; над нею стояв храм Роми й Августа, з театром, палацом на мисі та акведуком. Місто було освячене іграми близько 10 р. до н. е. Коли Юдея в 6 р. н. е. стала провінцією, Кесарія стала резиденцією її римських намісників; камінь, знайдений у театрі в 1961 р., називає Понтія Пилата префектом Юдеї."
    - "У Діяннях євангеліст Пилип оселився в Кесарії, і за словом Петра сотник Корнилій з усім домом був тут охрещений, — погани, прийняті до Церкви. Ірод Агриппа I помер у Кесарії в 44 р. н. е., як розповідають і Діяння, і Йосиф Флавій. Павло кілька разів проходив через цей порт і два роки перебував тут під вартою за намісника Феликса, а потім за Феста, перш ніж виступив перед Агриппою II і поплив до Риму."
    - "Чвари між грецьким і юдейським населенням міста допомогли розпалити повстання 66 р. н. е. Веспасіан зробив Кесарію римською колонією, а після 135 р. вона лишилася столицею провінції, що тепер звалася Сирія Палестина. Оріген оселився тут у 230-х рр., а бібліотека, зібрана ним і Памфілом, служила Євсевієві, єпископові Кесарії приблизно від 313 р., який записав мучеників, що загинули в місті за Діоклетіана. Тут також навчали рабини. У 333 р. Бордоському пілігримові показали купіль Корнилія, а близько 390 р. Кесарія стала митрополією Першої Палестини."
  es:
    - "Cesarea se halla en la costa mediterránea de la llanura de Sarón, en un tramo de litoral sin puerto natural. En el periodo persa había aquí un pequeño fondeadero fenicio, la Torre de Estratón, quizá llamada así por Estratón, un rey de Sidón; los papiros de Zenón la mencionan en el 259 a. C. Alejandro Janeo la añadió al reino asmoneo, Pompeyo la convirtió en ciudad libre en el 63 a. C., y en el 30 a. C. Augusto la entregó a Herodes el Grande."
    - "A partir del 22 a. C. Herodes construyó una ciudad nueva en el lugar y la llamó Cesarea en honor del emperador. Su puerto, Sebastos, se hizo con rompeolas de hormigón hidráulico depositados en mar abierto; sobre él se alzaba un templo de Roma y Augusto, con un teatro, un palacio en un promontorio y un acueducto. La ciudad fue inaugurada con juegos hacia el 10 a. C. Cuando Judea pasó a ser provincia en el 6 d. C., Cesarea se convirtió en sede de sus gobernadores romanos; una piedra hallada en el teatro en 1961 nombra a Poncio Pilato como prefecto de Judea."
    - "En los Hechos, Felipe el evangelista se estableció en Cesarea, y allí, a la palabra de Pedro, el centurión Cornelio y su casa fueron bautizados, gentiles recibidos en la Iglesia. Herodes Agripa I murió en Cesarea en el 44 d. C., como relatan tanto los Hechos como Josefo. Pablo pasó varias veces por el puerto y estuvo retenido allí dos años bajo el gobernador Félix y luego bajo Festo, antes de hablar ante Agripa II y zarpar hacia Roma."
    - "Las disputas entre los griegos y los judíos de la ciudad contribuyeron a desencadenar la revuelta del 66 d. C. Vespasiano hizo de Cesarea una colonia romana, y después del 135 siguió siendo la capital de la provincia, llamada ya Siria Palestina. Orígenes se estableció allí en la década del 230, y la biblioteca reunida por él y por Pánfilo sirvió a Eusebio, obispo de Cesarea desde alrededor del 313, que registró a los mártires que murieron en la ciudad bajo Diocleciano. También enseñaron allí rabinos. En el 333 al Peregrino de Burdeos le mostraron el baño de Cornelio, y hacia el 390 Cesarea se convirtió en metrópoli de Palestina Prima."
  pt:
    - "Cesareia fica na costa mediterrânea da planície de Sarom, num trecho de litoral sem porto natural. No período persa havia ali um pequeno ancoradouro fenício, a Torre de Estratão, talvez assim chamada por Estratão, rei de Sidom; os papiros de Zenão a mencionam em 259 a.C. Alexandre Janeu a acrescentou ao reino hasmoneu, Pompeu fez dela cidade livre em 63 a.C., e em 30 a.C. Augusto a deu a Herodes, o Grande."
    - "A partir de 22 a.C., Herodes construiu uma nova cidade no local e a chamou Cesareia em honra do imperador. Seu porto, Sebastos, foi feito com quebra-mares de concreto hidráulico lançados em mar aberto; acima dele erguiam-se um templo de Roma e Augusto, um teatro, um palácio num promontório e um aqueduto. A cidade foi dedicada com jogos por volta de 10 a.C. Quando a Judeia se tornou província, em 6 d.C., Cesareia passou a ser a sede de seus governadores romanos; uma pedra achada no teatro em 1961 nomeia Pôncio Pilatos como prefeito da Judeia."
    - "Em Atos, Filipe, o evangelista, fixou-se em Cesareia, e à palavra de Pedro o centurião Cornélio e sua casa foram batizados ali, gentios recebidos na igreja. Herodes Agripa I morreu em Cesareia em 44 d.C., como contam tanto Atos quanto Josefo. Paulo passou várias vezes pelo porto e ficou ali preso por dois anos sob o governador Félix, e depois sob Festo, antes de falar diante de Agripa II e navegar para Roma."
    - "As disputas entre gregos e judeus da cidade ajudaram a acender a revolta de 66 d.C. Vespasiano fez de Cesareia uma colônia romana, e depois de 135 ela continuou capital da província, então chamada Síria Palestina. Orígenes fixou-se ali na década de 230, e a biblioteca reunida por ele e Panfílio serviu a Eusébio, bispo de Cesareia desde cerca de 313, que registrou os mártires mortos na cidade sob Diocleciano. Rabinos também ensinaram ali. Em 333, o Peregrino de Bordéus viu o banho de Cornélio, e por volta de 390 Cesareia tornou-se metrópole da Palestina Prima."
  de:
    - "Caesarea liegt an der Mittelmeerküste der Scharon-Ebene, an einem Küstenstreifen ohne natürlichen Hafen. In der Perserzeit stand hier ein kleiner phönizischer Ankerplatz, der Stratonsturm, vielleicht nach Straton, einem König von Sidon, benannt; die Zenon-Papyri erwähnen ihn 259 v. Chr. Alexander Jannäus fügte ihn dem hasmonäischen Königreich hinzu, Pompeius machte ihn 63 v. Chr. zu einer freien Stadt, und 30 v. Chr. gab Augustus ihn Herodes dem Großen."
    - "Ab 22 v. Chr. baute Herodes an dieser Stelle eine neue Stadt und nannte sie nach dem Kaiser Caesarea. Ihr Hafen, Sebastos, wurde mit Wellenbrechern aus hydraulischem Beton angelegt, die man im offenen Meer verlegte; darüber stand ein Tempel für Roma und Augustus, dazu ein Theater, ein Palast auf einer Landzunge und ein Aquädukt. Die Stadt wurde um 10 v. Chr. mit Spielen eingeweiht. Als Judäa im Jahr 6 n. Chr. Provinz wurde, wurde Caesarea Sitz ihrer römischen Statthalter; ein 1961 im Theater gefundener Stein nennt Pontius Pilatus als Präfekten von Judäa."
    - "In der Apostelgeschichte ließ sich der Evangelist Philippus in Caesarea nieder, und auf Petrus’ Wort wurden dort der Hauptmann Kornelius und sein Haus getauft, Heiden, die in die Kirche aufgenommen wurden. Herodes Agrippa I. starb 44 n. Chr. in Caesarea, wie sowohl die Apostelgeschichte als auch Josephus berichten. Paulus kam mehrmals durch den Hafen und wurde dort zwei Jahre unter dem Statthalter Felix und danach unter Festus festgehalten, ehe er vor Agrippa II. sprach und nach Rom segelte."
    - "Streit zwischen den Griechen und Juden der Stadt trug dazu bei, den Aufstand von 66 n. Chr. zu entzünden. Vespasian machte Caesarea zu einer römischen Kolonie, und nach 135 blieb es die Hauptstadt der Provinz, die nun Syria Palaestina hieß. Origenes ließ sich dort in den 230er Jahren nieder, und die von ihm und Pamphilos gesammelte Bibliothek diente Eusebius, ab etwa 313 Bischof von Caesarea, der die Märtyrer aufzeichnete, die in der Stadt unter Diokletian starben. Auch Rabbinen lehrten dort. Im Jahr 333 wurde dem Pilger von Bordeaux das Bad des Kornelius gezeigt, und um 390 wurde Caesarea Metropole von Palaestina Prima."
  fr:
    - "Césarée se trouve sur la côte méditerranéenne de la plaine de Saron, sur un littoral sans port naturel. À l’époque perse, un petit mouillage phénicien s’y trouvait, la Tour de Straton, peut-être nommée d’après Straton, roi de Sidon ; les papyrus de Zénon la mentionnent en 259 av. J.-C. Alexandre Jannée l’ajouta au royaume hasmonéen, Pompée en fit une ville libre en 63 av. J.-C., et en 30 av. J.-C. Auguste la donna à Hérode le Grand."
    - "À partir de 22 av. J.-C., Hérode bâtit une ville nouvelle sur le site et la nomma Césarée en l’honneur de l’empereur. Son port, Sébastos, fut formé de brise-lames en béton hydraulique coulés en pleine mer ; au-dessus se dressaient un temple de Rome et d’Auguste, avec un théâtre, un palais sur un promontoire et un aqueduc. La ville fut dédiée par des jeux vers 10 av. J.-C. Lorsque la Judée devint province en 6 apr. J.-C., Césarée devint le siège de ses gouverneurs romains ; une pierre trouvée dans le théâtre en 1961 nomme Ponce Pilate préfet de Judée."
    - "Dans les Actes, Philippe l’évangéliste s’établit à Césarée, et sur la parole de Pierre le centurion Corneille et sa maison y furent baptisés, des païens reçus dans l’Église. Hérode Agrippa Ier mourut à Césarée en 44 apr. J.-C., comme le racontent les Actes et Josèphe. Paul passa plusieurs fois par le port et y fut retenu deux ans sous le gouverneur Félix, puis sous Festus, avant de parler devant Agrippa II et de s’embarquer pour Rome."
    - "Les luttes entre Grecs et Juifs de la ville contribuèrent à déclencher la révolte de 66 apr. J.-C. Vespasien fit de Césarée une colonie romaine, et après 135 elle demeura la capitale de la province, désormais appelée Syria Palaestina. Origène s’y établit dans les années 230, et la bibliothèque rassemblée par lui et par Pamphile servit à Eusèbe, évêque de Césarée vers 313, qui consigna les martyrs morts dans la ville sous Dioclétien. Des rabbins y enseignaient aussi. En 333, on montra au Pèlerin de Bordeaux le bain de Corneille, et vers 390 Césarée devint la métropole de la Palaestina Prima."
  it:
    - "Cesarea sorge sulla costa mediterranea della piana di Saròn, su un tratto di riva privo di porto naturale. In età persiana vi sorgeva un piccolo approdo fenicio, la Torre di Stratone, forse così chiamata da Stratone, re di Sidone; i papiri di Zenone la menzionano nel 259 a.C. Alessandro Ianneo la aggiunse al regno asmoneo, Pompeo ne fece una città libera nel 63 a.C. e nel 30 a.C. Augusto la diede a Erode il Grande."
    - "Dal 22 a.C. Erode costruì una nuova città sul sito e la chiamò Cesarea in onore dell’imperatore. Il suo porto, Sebastòs, fu realizzato con frangiflutti di calcestruzzo idraulico gettati in mare aperto; sopra di esso sorgevano un tempio di Roma e Augusto, un teatro, un palazzo su un promontorio e un acquedotto. La città fu inaugurata con giochi intorno al 10 a.C. Quando la Giudea divenne provincia nel 6 d.C., Cesarea fu la sede dei suoi governatori romani; una pietra trovata nel teatro nel 1961 nomina Ponzio Pilato come prefetto della Giudea."
    - "Negli Atti, Filippo l’evangelista si stabilì a Cesarea, e alla parola di Pietro il centurione Cornelio e la sua casa vi furono battezzati, pagani accolti nella Chiesa. Erode Agrippa I morì a Cesarea nel 44 d.C., come raccontano sia gli Atti sia Giuseppe Flavio. Paolo passò più volte per il porto e vi fu tenuto due anni sotto il governatore Felice e poi sotto Festo, prima di parlare davanti ad Agrippa II e salpare per Roma."
    - "I contrasti fra Greci ed Ebrei della città contribuirono a scatenare la rivolta del 66 d.C. Vespasiano fece di Cesarea una colonia romana, e dopo il 135 restò la capitale della provincia, ora chiamata Siria Palestina. Origene vi si stabilì negli anni 230, e la biblioteca da lui e da Panfilo raccolta servì a Eusebio, vescovo di Cesarea dal 313 circa, che registrò i martiri morti in città sotto Diocleziano. Vi insegnarono anche dei rabbini. Nel 333 al Pellegrino di Bordeaux fu mostrato il bagno di Cornelio, e intorno al 390 Cesarea divenne metropoli della Palestina Prima."
  pl:
    - "Cezarea leży na śródziemnomorskim wybrzeżu równiny Szaron, na odcinku brzegu bez naturalnego portu. W okresie perskim stała tu mała fenicka przystań, Wieża Stratona, nazwana być może od Stratona, króla Sydonu; papirusy Zenona wspominają ją w 259 r. p.n.e. Aleksander Janneusz dołączył ją do królestwa hasmonejskiego, Pompejusz uczynił ją wolnym miastem w 63 r. p.n.e., a w 30 r. p.n.e. August oddał ją Herodowi Wielkiemu."
    - "Od 22 r. p.n.e. Herod budował na tym miejscu nowe miasto i nazwał je Cezareą na cześć cesarza. Jego port, Sebastos, powstał z falochronów z betonu hydraulicznego układanych na otwartym morzu; nad nim stała świątynia Romy i Augusta, a poza tym teatr, pałac na cyplu i akwedukt. Miasto poświęcono igrzyskami około 10 r. p.n.e. Gdy w 6 r. n.e. Judea stała się prowincją, Cezarea została siedzibą jej rzymskich namiestników; kamień znaleziony w teatrze w 1961 r. wymienia Poncjusza Piłata jako prefekta Judei."
    - "W Dziejach Apostolskich ewangelista Filip osiadł w Cezarei, a na słowo Piotra setnik Korneliusz z całym domem został tam ochrzczony, poganie przyjęci do Kościoła. Herod Agryppa I zmarł w Cezarei w 44 r. n.e., jak opowiadają zarówno Dzieje, jak i Józef Flawiusz. Paweł kilkakrotnie przechodził przez ten port i był tu przetrzymywany dwa lata za namiestnika Feliksa, a potem za Festusa, zanim przemówił przed Agryppą II i odpłynął do Rzymu."
    - "Spory między greckimi i żydowskimi mieszkańcami miasta pomogły wzniecić powstanie 66 r. n.e. Wespazjan uczynił Cezareę rzymską kolonią, a po 135 r. pozostała stolicą prowincji, zwanej już Syria Palaestina. Orygenes osiadł tam w latach trzydziestych III w., a biblioteka zgromadzona przez niego i Pamfila służyła Euzebiuszowi, biskupowi Cezarei od około 313 r., który opisał męczenników zmarłych w tym mieście za Dioklecjana. Nauczali tam także rabini. W 333 r. Pielgrzymowi z Bordeaux pokazano łaźnię Korneliusza, a około 390 r. Cezarea stała się metropolią Palaestina Prima."
  nl:
    - "Caesarea ligt aan de Middellandse Zeekust van de Saronvlakte, aan een kuststrook zonder natuurlijke haven. In de Perzische tijd stond hier een kleine Fenicische ankerplaats, de Stratonstoren, misschien genoemd naar Straton, een koning van Sidon; de Zenon-papyri vermelden haar in 259 v.Chr. Alexander Jannaeus voegde haar toe aan het Hasmonese koninkrijk, Pompeius maakte haar in 63 v.Chr. tot vrije stad, en in 30 v.Chr. schonk Augustus haar aan Herodes de Grote."
    - "Vanaf 22 v.Chr. bouwde Herodes op de plaats een nieuwe stad en noemde haar Caesarea naar de keizer. De haven, Sebastos, werd gemaakt met golfbrekers van hydraulisch beton die in open zee werden gelegd; erboven stond een tempel van Roma en Augustus, met een theater, een paleis op een landtong en een aquaduct. De stad werd omstreeks 10 v.Chr. met spelen ingewijd. Toen Judea in 6 n.Chr. een provincie werd, werd Caesarea de zetel van de Romeinse gouverneurs; een steen die in 1961 in het theater werd gevonden noemt Pontius Pilatus als prefect van Judea."
    - "In Handelingen vestigde Filippus de evangelist zich in Caesarea, en op het woord van Petrus werden de hoofdman Cornelius en zijn huisgezin daar gedoopt, heidenen die in de kerk werden opgenomen. Herodes Agrippa I stierf in 44 n.Chr. in Caesarea, zoals zowel Handelingen als Flavius Josephus vertellen. Paulus kwam meermalen door de havenstad en werd er twee jaar vastgehouden onder de gouverneur Felix en daarna onder Festus, voordat hij voor Agrippa II sprak en naar Rome voer."
    - "Twisten tussen de Grieken en de Joden van de stad hielpen de opstand van 66 n.Chr. aan te wakkeren. Vespasianus maakte Caesarea tot Romeinse kolonie, en na 135 bleef zij de hoofdstad van de provincie, die nu Syria Palaestina heette. Origenes vestigde zich er in de jaren 230, en de bibliotheek die hij en Pamphilus verzamelden diende Eusebius, bisschop van Caesarea vanaf omstreeks 313, die de martelaren optekende die onder Diocletianus in de stad stierven. Ook rabbijnen onderwezen er. In 333 kreeg de Pelgrim van Bordeaux het bad van Cornelius te zien, en omstreeks 390 werd Caesarea de metropool van Palaestina Prima."
  cs:
    - "Cesarea leží na středomořském pobřeží Šaronské roviny, na úseku břehu bez přirozeného přístavu. V perském období tu stálo malé fénické kotviště, Stratonova věž, snad pojmenovaná po Stratonovi, králi sidónském; Zenónovy papyry ji zmiňují roku 259 př. n. l. Alexandr Jannaios ji připojil k hasmonejskému království, Pompeius z ní roku 63 př. n. l. učinil svobodné město a roku 30 př. n. l. ji Augustus dal Herodovi Velikému."
    - "Od roku 22 př. n. l. budoval Herodes na tomto místě nové město a pojmenoval je Cesarea po císaři. Jeho přístav Sebastos byl vytvořen vlnolamy z hydraulického betonu ukládaného na volném moři; nad ním stál chrám Romy a Augusta, divadlo, palác na výběžku a akvadukt. Město bylo vysvěceno hrami kolem roku 10 př. n. l. Když se roku 6 n. l. stalo Judsko provincií, stala se Cesarea sídlem jeho římských správců; kámen nalezený roku 1961 v divadle jmenuje Pontia Pilata jako prefekta Judska."
    - "Ve Skutcích se v Cesareji usadil evangelista Filip a tam byl na Petrovo slovo pokřtěn setník Kornelius s celou svou domácností, pohané přijatí do církve. Herodes Agrippa I. zemřel v Cesareji roku 44 n. l., jak vyprávějí Skutky i Josephus. Pavel přístavem několikrát procházel a byl tam dva roky držen za správce Felixe a poté za Festa, než promluvil před Agrippou II. a odplul do Říma."
    - "Svár mezi městskými Řeky a Židy pomohl zažehnout povstání roku 66 n. l. Vespasianus učinil z Cesareje římskou kolonii a po roce 135 zůstala hlavním městem provincie, nyní zvané Syria Palaestina. Órigenés se tam usadil ve 230. letech a knihovna, kterou shromáždili on a Pamfilos, posloužila Eusebiovi, biskupu cesarejskému od roku asi 313, který zaznamenal mučedníky, kteří ve městě zemřeli za Diocletiana. Učili tam i rabíni. Roku 333 byla Poutníkovi z Bordeaux ukázána Korneliova lázeň a kolem roku 390 se Cesarea stala metropolí Palaestiny Prima."
  sv:
    - "Caesarea ligger vid Medelhavskusten på Saronslätten, vid en strandremsa utan naturlig hamn. Under persisk tid låg här en liten fenicisk ankarplats, Stratons torn, kanske uppkallad efter Straton, en kung i Sidon; Zenonpapyrerna nämner den år 259 f.Kr. Alexander Jannaios lade den till det hasmoneiska riket, Pompejus gjorde den till en fri stad 63 f.Kr., och 30 f.Kr. gav Augustus den till Herodes den store."
    - "Från 22 f.Kr. byggde Herodes en ny stad på platsen och gav den namnet Caesarea efter kejsaren. Dess hamn, Sebastos, anlades med vågbrytare av hydraulisk betong lagd i öppet hav; ovanför den stod ett tempel för Roma och Augustus, med en teater, ett palats på en udde och en akvedukt. Staden invigdes med spel omkring 10 f.Kr. När Judeen blev provins år 6 e.Kr. blev Caesarea säte för dess romerska ståthållare; en sten som hittades i teatern 1961 nämner Pontius Pilatus som prefekt i Judeen."
    - "I Apostlagärningarna bosatte sig evangelisten Filippos i Caesarea, och på Petrus ord döptes centurionen Cornelius och hans hus där, hedningar som upptogs i kyrkan. Herodes Agrippa I dog i Caesarea år 44 e.Kr., som både Apostlagärningarna och Josefus berättar. Paulus passerade hamnen flera gånger och hölls där fången i två år under ståthållaren Felix och sedan under Festus, innan han talade inför Agrippa II och seglade till Rom."
    - "Stridigheter mellan stadens greker och judar bidrog till att utlösa upproret år 66 e.Kr. Vespasianus gjorde Caesarea till romersk koloni, och efter 135 förblev den provinsens huvudstad, som nu kallades Syria Palaestina. Origenes bosatte sig där på 230-talet, och biblioteket som han och Pamfilos samlade tjänade Eusebios, biskop i Caesarea från omkring 313, som skrev ner martyrerna som dog i staden under Diocletianus. Rabbiner undervisade också där. År 333 visades Pilgrimen från Bordeaux Cornelius bad, och omkring 390 blev Caesarea metropol för Palaestina Prima."
  nb:
    - "Cæsarea ligger på Middelhavskysten, på Sjaron-sletten, på en kyststrekning uten naturlig havn. I persertiden lå det en liten fønikisk ankerplass her, Stratons tårn, kanskje oppkalt etter Straton, en konge av Sidon; Zenon-papyrusene nevner det i 259 f.Kr. Aleksander Jannaios la det til det hasmoneiske riket, Pompeius gjorde det til en fri by i 63 f.Kr., og i 30 f.Kr. gav Augustus det til Herodes den store."
    - "Fra 22 f.Kr. bygde Herodes en ny by på stedet og kalte den Cæsarea etter keiseren. Havnen, Sebastos, ble laget med molo av hydraulisk betong lagt i åpent hav; over den sto et tempel for Roma og Augustus, med et teater, et palass på en odde og en akvedukt. Byen ble viet med leker omkring 10 f.Kr. Da Judea ble en provins i 6 e.Kr., ble Cæsarea sete for de romerske landshøvdingene; en stein funnet i teatret i 1961 nevner Pontius Pilatus som prefekt i Judea."
    - "I Apostlenes gjerninger slo evangelisten Filip seg ned i Cæsarea, og etter Peters ord ble høvedsmannen Kornelius og hans hus døpt der, hedninger tatt opp i menigheten. Herodes Agrippa I døde i Cæsarea i 44 e.Kr., slik både Apostlenes gjerninger og Josefus forteller. Paulus passerte havnen flere ganger og ble holdt der i to år under landshøvding Feliks og så under Festus, før han talte for Agrippa II og seilte til Roma."
    - "Strid mellom byens grekere og jøder var med på å antenne opprøret i 66 e.Kr. Vespasian gjorde Cæsarea til en romersk koloni, og etter 135 forble den provinsens hovedstad, som nå ble kalt Syria Palaestina. Origenes slo seg ned der i 230-årene, og biblioteket som han og Pamfilos samlet, tjente Eusebius, biskop av Cæsarea fra omkring 313, som opptegnet martyrene som døde i byen under Diokletian. Rabbinere underviste også der. I 333 ble pilegrimen fra Bordeaux vist Kornelius' bad, og omkring 390 ble Cæsarea metropol for Palaestina Prima."
  tl:
    - "Ang Cesarea ay nasa baybayin ng Mediteraneo ng kapatagan ng Saron, sa isang bahagi ng baybayin na walang likas na daungan. Noong panahong Persiano ay may maliit na daungang Fenicio rito, ang Tore ni Strato, marahil ipinangalan kay Straton, isang hari ng Sidon; binabanggit ito ng mga papiro ni Zenon noong 259 BK. Idinagdag ito ni Alejandro Janeo sa kahariang Hasmoneo, ginawa itong malayang bayan ni Pompeyo noong 63 BK, at noong 30 BK ibinigay ito ni Augusto kay Herodes na Dakila."
    - "Mula 22 BK, nagtayo si Herodes ng bagong lungsod sa pook at pinangalanang Cesarea sunod sa emperador. Ang daungan nito, ang Sebastos, ay ginawa sa pamamagitan ng mga pampigil-alon na gawa sa hydraulic concrete na inilatag sa bukas na dagat; sa itaas nito ay nakatayo ang templo ng Roma at Augusto, kasama ang dulaan, isang palasyo sa isang tangos at isang aqueduct. Itinalaga ang lungsod sa pamamagitan ng mga laro noong mga 10 BK. Nang maging lalawigan ang Judea noong 6 AD, ang Cesarea ang naging luklukan ng mga gobernador na Romano nito; isang batong natagpuan sa dulaan noong 1961 ang may pangalan ni Poncio Pilato bilang prepekto ng Judea."
    - "Sa Mga Gawa, nanirahan sa Cesarea si Felipe na ebanghelista, at sa salita ni Pedro ang senturyon na si Cornelio at ang kaniyang sambahayan ay binautismuhan doon, mga Hentil na tinanggap sa iglesia. Namatay sa Cesarea si Herodes Agripa I noong 44 AD, gaya ng isinasalaysay ng Mga Gawa at ni Josefo. Ilang beses dumaan si Pablo sa daungan at ibinilanggo roon nang dalawang taon sa ilalim ng gobernador na si Felix at pagkatapos ni Festo, bago siya nagsalita sa harap ni Agripa II at naglayag patungong Roma."
    - "Ang alitan ng mga Griyego at Judio ng lungsod ay nakatulong sa pagsiklab ng paghihimagsik noong 66 AD. Ginawa ni Vespasiano ang Cesarea na kolonyang Romano, at pagkatapos ng 135 ay nanatili itong kabisera ng lalawigan, na tinatawag na ngayong Siria Palaestina. Nanirahan doon si Origenes noong dekada 230, at ang aklatang tinipon niya at ni Pamphilo ang naglingkod kay Eusebio, obispo ng Cesarea mula mga 313, na nagtala ng mga martir na namatay sa lungsod sa ilalim ni Diocleciano. Nagturo rin doon ang mga rabbi. Noong 333 ay ipinakita sa Peregrino ng Bordeaux ang paliguan ni Cornelio, at noong mga 390 ang Cesarea ay naging metropolis ng Palaestina Prima."
  da:
    - "Cæsarea ligger ved Middelhavskysten på Saron-sletten, på en kyststrækning uden naturlig havn. I den persiske tid lå her en lille fønikisk ankerplads, Stratons Tårn, måske opkaldt efter Straton, en konge af Sidon; Zenon-papyrierne nævner den i 259 f.Kr. Alexander Jannæus føjede den til det hasmonæiske kongedømme, Pompejus gjorde den til en fri by i 63 f.Kr., og i 30 f.Kr. gav Augustus den til Herodes den Store."
    - "Fra 22 f.Kr. byggede Herodes en ny by på stedet og kaldte den Cæsarea efter kejseren. Dens havn, Sebastos, blev anlagt med bølgebrydere af hydraulisk beton, der var lagt ud i åbent hav; over den stod et tempel for Roma og Augustus, med et teater, et palads på en odde og et akvædukt. Byen blev indviet med lege omkring 10 f.Kr. Da Judæa blev en provins i 6 e.Kr., blev Cæsarea de romerske guvernørers sæde; en sten fundet i teatret i 1961 nævner Pontius Pilatus som præfekt i Judæa."
    - "I Apostlenes Gerninger slog evangelisten Filip sig ned i Cæsarea, og på Peters ord blev høvedsmanden Kornelius og hans husstand døbt dér, hedninger optaget i kirken. Herodes Agrippa 1. døde i Cæsarea i 44 e.Kr., som både Apostlenes Gerninger og Josefus beretter. Paulus passerede havnen flere gange og blev holdt dér i to år under guvernør Felix og derefter under Festus, før han talte for Agrippa 2. og sejlede til Rom."
    - "Stridigheder mellem byens grækere og jøder var med til at udløse oprøret i 66 e.Kr. Vespasian gjorde Cæsarea til en romersk koloni, og efter 135 forblev den provinsens hovedstad, nu kaldet Syria Palaestina. Origenes bosatte sig dér i 230'erne, og biblioteket, som han og Pamfilos samlede, tjente Eusebios, biskop af Cæsarea fra omkring 313, som optegnede martyrerne, der døde i byen under Diokletian. Rabbinere underviste også dér. I 333 blev Pilgrimmen fra Bordeaux vist Kornelius' bad, og omkring 390 blev Cæsarea metropolis for Palaestina Prima."
  sr:
    - "Цезареја лежи на средоземној обали Сарона, на делу обале без природне луке. У персијско доба овде је стајало мало феничанско пристаниште, Стратонова кула, можда названо по Стратону, цару Сидона; Зенонови папируси помињу је 259. п. н. е. Александар Јанеј ју је припојио хасмонејском краљевству, Помпеј ју је 63. п. н. е. учинио слободним градом, а 30. п. н. е. Август ју је дао Ироду Великом."
    - "Од 22. п. н. е. Ирод је на томе месту градио нов град и назвао га Цезареја по цару. Његова лука, Себастос, начињена је лукобранима од хидрауличног бетона положеног у отвореном мору; изнад ње стајао је храм Роме и Августа, с позориштем, палатом на рту и аквадуктом. Град је посвећен играма око 10. п. н. е. Када је Јудеја 6. н. е. постала провинција, Цезареја је постала седиште њених римских намесника; камен пронађен у позоришту 1961. именује Понтија Пилата као префекта Јудеје."
    - "У Делима апостолским Филип евангелиста настанио се у Цезареји, и на Петрову реч ту су крштени стотник Корнилије и његов дом, незнабошци примљени у цркву. Ирод Агрипа I умро је у Цезареји 44. н. е., како причају и Дела и Јосиф Флавије. Павле је неколико пута прошао кроз луку и ту је две године био држан под намесником Филиксом, а затим под Фистом, пре него што је говорио пред Агрипом II и отпловио у Рим."
    - "Свађа између градских Грка и Јевреја помогла је да букне устанак 66. н. е. Веспазијан је Цезареју учинио римском колонијом, а после 135. остала је престоница провинције, која се сада звала Сирија Палестина. Ориген се ту настанио 230-их, а библиотека коју су прикупили он и Памфил служила је Јевсевију, епископу Цезареје од око 313, који је забележио мученике што су у граду страдали под Диоклецијаном. Ту су поучавали и рабини. Године 333. Путнику из Бордоа показано је Корнилијево купатило, а око 390. Цезареја је постала митрополија Палестине Прима."
  hu:
    - "Cézárea a Sáron-síkság földközi-tengeri partján fekszik, a tengerpartnak azon a szakaszán, amelyen nincs természetes kikötő. A perzsa korban kis föníciai kikötőhely állt itt, Sztratón tornya, amelyet talán Sztratónról, Szidón egyik királyáról neveztek el; a Zénón-papiruszok Kr. e. 259-ben említik. Alexandrosz Jannaiosz a hasmóneus királysághoz csatolta, Pompeius Kr. e. 63-ban szabad várossá tette, Kr. e. 30-ban pedig Augusztus Nagy Heródesnek adta."
    - "Kr. e. 22-től Heródes új várost épített a helyén, és a császárról Cézáreának nevezte el. Kikötője, a Szebasztosz, a nyílt tengerbe rakott hidraulikus betonból épült hullámtörőkkel készült; fölötte Roma és Augusztus temploma állt, mellette színház, egy hegyfokon palota és vízvezeték. A várost Kr. e. 10 körül avatták fel játékokkal. Amikor Júdea Kr. u. 6-ban tartománnyá lett, Cézárea a római kormányzók székhelye lett; egy 1961-ben a színházban talált kő Poncius Pilátust nevezi meg Júdea prefektusaként."
    - "Az Apostolok cselekedeteiben Fülöp evangélista Cézáreában telepedett le, és Péter szavára itt keresztelték meg Kornélius századost házanépével, pogányokat, akiket az egyházba fogadtak. I. Agrippa Heródes Kr. u. 44-ben halt meg Cézáreában, ahogy az ApCsel és Josephus egyaránt elbeszéli. Pál többször átment a kikötőn, és két évig fogva tartották itt Félix, majd Fesztusz kormányzó alatt, mielőtt II. Agrippa előtt beszélt és Rómába hajózott."
    - "A város görögjei és zsidói közötti viszály hozzájárult a Kr. u. 66-os felkelés kirobbanásához. Vespasianus római gyarmattá tette Cézáreát, és 135 után a tartomány fővárosa maradt, amelyet ekkor már Syria Palaestinának hívtak. Órigenész a 230-as években telepedett le itt, és az általa és Pamphilosz által gyűjtött könyvtár szolgálta Eusebiust, aki 313 körül lett Cézárea püspöke, és feljegyezte a Diocletianus alatt a városban elhunyt vértanúkat. Rabbik is tanítottak itt. 333-ban a bordeaux-i zarándoknak megmutatták Kornélius fürdőjét, és 390 körül Cézárea Palaestina Prima metropolisza lett."
  fi:
    - "Kesarea sijaitsee Saronin tasangon Välimeren rannikolla, rantaviivan osuudella, jossa ei ole luonnollista satamaa. Persialaisaikana täällä oli pieni foinikialainen ankkuripaikka, Stratonin torni, ehkä Sidonin kuninkaan Stratonin mukaan nimetty; Zenonin papyrukset mainitsevat sen vuonna 259 eaa. Aleksandros Jannaios liitti sen hasmonealaiseen kuningaskuntaan, Pompeius teki siitä vapaan kaupungin vuonna 63 eaa., ja vuonna 30 eaa. Augustus antoi sen Herodes Suurelle."
    - "Vuodesta 22 eaa. Herodes rakensi paikalle uuden kaupungin ja nimesi sen Kesareaksi keisarin mukaan. Sen satama, Sebastos, tehtiin avomerelle laskettujen hydraulisesta betonista valmistettujen aallonmurtajien avulla; sen yläpuolella kohosi Rooman ja Augustuksen temppeli, teatteri, palatsi niemekkeellä ja akveduktti. Kaupunki vihittiin käyttöön peleillä noin vuonna 10 eaa. Kun Juudeasta tuli provinssi vuonna 6 jaa., Kesareasta tuli sen roomalaisten maaherrojen asuinpaikka; teatterista vuonna 1961 löydetty kivi nimeää Pontius Pilatuksen Juudean prefektiksi."
    - "Apostolien teoissa evankelista Filippos asettui Kesareaan, ja Pietarin sanan johdosta sadanpäällikkö Kornelius perheineen kastettiin siellä, pakanoita otettiin seurakuntaan. Herodes Agrippa I kuoli Kesareassa vuonna 44 jaa., kuten sekä Apostolien teot että Josefus kertovat. Paavali kulki sataman kautta useita kertoja ja oli siellä vangittuna kaksi vuotta käskynhaltija Felixin ja sitten Festuksen alaisuudessa, ennen kuin hän puhui Agrippa II:n edessä ja purjehti Roomaan."
    - "Kaupungin kreikkalaisten ja juutalaisten välinen kiista auttoi sytyttämään vuoden 66 jaa. kapinan. Vespasianus teki Kesareasta roomalaisen siirtokunnan, ja vuoden 135 jälkeen se pysyi maakunnan pääkaupunkina, joka nyt kantoi nimeä Syria Palaestina. Origenes asettui sinne 230-luvulla, ja hänen ja Pamfiloksen kokoama kirjasto palveli Eusebiosta, Kesarean piispaa noin vuodesta 313, joka kirjasi kaupungissa Diocletianuksen aikana kuolleet marttyyrit. Myös rabbit opettivat siellä. Vuonna 333 Bordeaux'n pyhiinvaeltajalle näytettiin Korneliuksen kylpylä, ja noin vuonna 390 Kesareasta tuli Palaestina Priman metropoli."
  vi:
    - "Sê-sa-rê nằm trên bờ Địa Trung Hải của đồng bằng Sa-rôn, trên một đoạn bờ biển không có hải cảng tự nhiên. Vào thời Ba Tư, một bến neo nhỏ của người Phê-ni-xi đứng ở đây, Tháp Strato, có lẽ đặt theo tên Straton, một vua của Si-đôn; các papyrus Zenon nhắc đến nó năm 259 TCN. A-léc-xan-đơ Jannaeus thêm nó vào vương quốc Hasmonean, Pompey biến nó thành thị trấn tự do năm 63 TCN, và năm 30 TCN Au-gút-tơ ban nó cho Hê-rốt Đại đế."
    - "Từ năm 22 TCN, Hê-rốt xây một thành mới trên địa điểm và đặt tên Sê-sa-rê theo tên hoàng đế. Cảng của nó, Sebastos, được làm bằng các đê chắn sóng bằng bê tông thủy lực đặt giữa biển khơi; phía trên có đền của Roma và Au-gút-tơ, cùng một nhà hát, một cung điện trên mũi đất và một cầu máng. Thành được khánh thành bằng các cuộc thi đấu vào khoảng năm 10 TCN. Khi Giu-đê trở thành một tỉnh năm 6, Sê-sa-rê trở thành trụ sở của các tổng đốc La Mã; một tảng đá tìm thấy trong nhà hát năm 1961 nêu tên Bôn-xơ Phi-lát là quan tổng trấn (praefectus) của Giu-đê."
    - "Trong sách Công vụ, Phi-líp nhà truyền giảng định cư ở Sê-sa-rê, và theo lời Phi-e-rơ, đội trưởng Cọt-nây cùng cả nhà ông được làm báp têm tại đó, là những người ngoại được nhận vào hội thánh. Hê-rốt Ạc-ríp-ba I qua đời tại Sê-sa-rê năm 44, như cả sách Công vụ và Josephus thuật lại. Phao-lô nhiều lần đi qua hải cảng này và bị giam ở đó hai năm dưới quyền tổng đốc Phê-lít rồi Phê-tu, trước khi ông nói trước Ạc-ríp-ba II và xuống tàu đi Rô-ma."
    - "Xung đột giữa người Hy Lạp và người Do Thái của thành đã góp phần châm ngòi cuộc nổi dậy năm 66. Vespasianus biến Sê-sa-rê thành thuộc địa La Mã, và sau năm 135 nó vẫn là thủ phủ của tỉnh, nay gọi là Syria Palaestina. Origen định cư ở đó vào những năm 230, và thư viện do ông cùng Pamphilus gom góp đã phục vụ Eusebius, giám mục Sê-sa-rê từ khoảng năm 313, người ghi lại các thánh tử đạo chết trong thành dưới thời Diocletianus. Các rabbi cũng giảng dạy ở đó. Năm 333, Người hành hương Bordeaux được chỉ cho thấy bồn tắm của Cọt-nây, và khoảng năm 390 Sê-sa-rê trở thành thủ phủ giáo tỉnh của Palaestina Prima."
  ro:
    - "Cezareea se află pe coasta Mediteranei a câmpiei Șaronului, pe o fâșie de țărm fără port natural. În perioada persană aici se afla un mic ancoraj fenician, Turnul lui Straton, numit poate după Straton, un rege al Sidonului; papirusurile lui Zenon îl pomenesc în 259 î.Hr. Alexandru Ianeu l-a adăugat regatului hasmoneu, Pompei l-a făcut oraș liber în 63 î.Hr., iar în 30 î.Hr. Augustus l-a dat lui Irod cel Mare."
    - "Începând din 22 î.Hr., Irod a zidit pe loc o cetate nouă și a numit-o Cezareea după împărat. Portul ei, Sebastos, a fost făcut cu dige din beton hidraulic așezate în largul mării; deasupra lui se înălța un templu al Romei și al lui Augustus, cu un teatru, un palat pe un promontoriu și un apeduct. Cetatea a fost inaugurată cu jocuri pe la 10 î.Hr. Când Iudeea a devenit provincie, în 6 d.Hr., Cezareea a devenit reședința guvernatorilor ei romani; o piatră găsită în teatru în 1961 îl numește pe Pontiu Pilat prefect al Iudeei."
    - "În Faptele Apostolilor, Filip evanghelistul s-a așezat în Cezareea, iar la cuvântul lui Petru sutașul Corneliu și casa lui au fost botezați acolo, neamuri primite în biserică. Irod Agripa I a murit la Cezareea în anul 44 d.Hr., după cum relatează și Faptele Apostolilor, și Iosif Flaviu. Pavel a trecut de mai multe ori prin port și a fost ținut acolo doi ani sub guvernatorul Felix și apoi sub Festus, înainte de a vorbi în fața lui Agripa al II-lea și de a naviga spre Roma."
    - "Conflictul dintre grecii și iudeii cetății a ajutat la declanșarea răscoalei din anul 66 d.Hr. Vespasian a făcut din Cezareea o colonie romană, iar după 135 ea a rămas capitala provinciei, numită acum Syria Palaestina. Origen s-a așezat acolo în anii 230, iar biblioteca adunată de el și de Pamfil i-a slujit lui Eusebiu, episcop al Cezareei din jurul anului 313, care a consemnat martirii morți în cetate sub Dioclețian. Și rabinii au învățat acolo. În 333, Pelerinului din Bordeaux i s-a arătat baia lui Corneliu, iar pe la 390 Cezareea a devenit metropola Palestinei Întâi."
  bg:
    - "Кесария лежи на средиземноморския бряг на Саронската равнина, на участък от брега без естествено пристанище. През персийския период тук имало малко финикийско котвено място, Стратоновата кула, наречена може би на Стратон, цар на Сидон; папирусите на Зенон я споменават през 259 г. пр.н.е. Александър Яней я присъединил към Хасмонейското царство, Помпей я направил свободен град през 63 г. пр.н.е., а през 30 г. пр.н.е. Август я дал на Ирод Велики."
    - "От 22 г. пр.н.е. Ирод построил на мястото нов град и го нарекъл Кесария на императора. Пристанището му, Себастос, било направено с вълноломи от хидравличен бетон, положени в открито море; над него стоял храм на Рома и Август, с театър, дворец на нос и акведукт. Градът бил осветен с игри около 10 г. пр.н.е. Когато Юдея станала провинция през 6 г. н.е., Кесария станала седалище на римските ѝ управители; камък, намерен в театъра през 1961 г., назовава Понтий Пилат префект на Юдея."
    - "В Деяния благовестникът Филип се заселил в Кесария, а по словото на Петър стотникът Корнилий и домът му били кръстени там — езичници, приети в църквата. Ирод Агрипа I умрял в Кесария през 44 г. н.е., както разказват и Деяния, и Йосиф Флавий. Павел минавал през пристанището няколко пъти и бил държан там две години при управителя Феликс и после при Фест, преди да говори пред Агрипа II и да отплава за Рим."
    - "Враждата между гърците и юдеите в града спомогнала за избухването на въстанието от 66 г. н.е. Веспасиан направил Кесария римска колония, а след 135 г. тя останала столица на провинцията, наричана вече Сирия Палестина. Ориген се заселил там през 30-те години на III в. и библиотеката, събрана от него и Памфил, служела на Евсевий, епископ на Кесария от около 313 г., който описал мъчениците, загинали в града при Диоклетиан. Там преподавали и равини. През 333 г. на Бордоския поклонник била показана банята на Корнилий, а около 390 г. Кесария станала митрополия на Първа Палестина."
