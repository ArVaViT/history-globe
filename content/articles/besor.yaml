# Overview article (ADR 0007). Mainstream facts only; Nahal HaBesor is the undisputed identification, Nahal Gerar being a tributary the map keeps as a second candidate.
id: besor
place: a57df09
title:
  en: "Besor"
  ru: "Поток Восор"
  uk: "Бесор"
  es: "Arroyo de Besor"
  pt: "Besor"
  de: "Bach Besor"
  fr: "Torrent de Besor"
body:
  en:
    - "The Besor is the largest wadi of the north-western Negeb, Nahal HaBesor, called Wadi Ghazzeh in its lower course. Rising in the Negeb highlands near Sede Boqer and fed through the Beersheba stream from the hills south of Hebron, it runs north-west past the ancient mounds of Tell el-Far'ah (South) and Tell Jemmeh, and reaches the Mediterranean south of Gaza. Dry for most of the year, it floods after winter rain, and its banks were settled from prehistoric times: Eann Macdonald's survey of 1929–1930 found Chalcolithic villages along its lower course. Nadav Na'aman has argued that this wadi, rather than Wadi el-Arish, was the “Brook of Egypt” of the Assyrian records; the second candidate on the map, Nahal Gerar, is the Besor's northern tributary."
    - "The Bible names the brook once, in David's pursuit of the Amalekites who had burned Ziklag. David and his six hundred men “came to the brook Besor, where those that were left behind stayed. But David pursued, he and four hundred men: for two hundred abode behind, which were so faint that they could not go over the brook Besor”. He overtook the raiders and recovered everything, and when he came back to the two hundred “whom they had made also to abide at the brook Besor”, some of his men would not share the spoil with them. David answered, “as his part is that goeth down to the battle, so shall his part be that tarrieth by the stuff: they shall part alike”, and from that day “he made it a statute and an ordinance for Israel unto this day”. Wherever Ziklag lay, and that is disputed, the Besor was the first great obstacle on the road south into the Amalekites' country."
    - "Today the Besor passes Eshkol National Park in Israel's western Negev, whose springs, Ein HaBesor, are the largest in its basin, before crossing into the Gaza Strip as Wadi Ghazzeh; around these springs the British army made its water base on the Gaza–Beersheba front in 1917."
  ru:
    - "Восор — самое большое вади северо-западного Негева, Нахаль-ха-Бесор, в нижнем течении называемое Вади-Газза. Оно начинается на Негевском нагорье у Сде-Бокера, принимает через поток Беэр-Шевы воды холмов к югу от Хеврона и бежит на северо-запад мимо древних холмов Телль-эль-Фара (Южного) и Телль-Джемме и достигает Средиземного моря южнее Газы. Сухое большую часть года, оно разливается после зимних дождей, а его берега заселялись с доисторических времён: разведка Иэнна Макдональда в 1929–1930 годах нашла вдоль нижнего течения селения медно-каменного века. Надав Нааман доказывал, что именно это вади, а не Вади-эль-Ариш, было «потоком Египетским» ассирийских записей; второй кандидат на карте, Нахаль-Герар, — северный приток Восора."
    - "Библия называет поток один раз, в погоне Давида за Амаликитянами, сжёгшими Секелаг. Давид с шестьюстами мужами «пришли к потоку Восор и усталые остановились там. И преследовал Давид сам и четыреста человек; двести же человек остановились, потому что были не в силах перейти поток Восорский». Он настиг грабителей и отбил всё, а когда вернулся к тем двумстам, «которых он оставил у потока Восор», часть его людей не хотела делиться с ними добычей. Давид ответил: «Какова часть ходившим на войну, такова часть должна быть и оставшимся при обозе: на всех должно разделить», «и поставил он это в закон и в правило для Израиля до сего дня». Где бы ни лежал Секелаг, а это спорно, Восор был первой большой преградой на дороге на юг, в страну Амаликитян."
    - "Сегодня Восор течёт мимо национального парка Эшколь в западном Негеве Израиля, чьи источники Эйн-ха-Бесор — самые обильные в его бассейне, а затем входит в сектор Газа как Вади-Газза; у этих источников британская армия в 1917 году устроила свою водную базу на фронте Газа — Беэр-Шева."
  uk:
    - "Бесор — найбільший вадій північно-західного Негеву, Нахаль-га-Бесор, званий вадієм Газза в нижній течії. Беручи початок у нагір'ї Негеву біля Сде-Бокера і живлений через потік Беер-Шеви з пагорбів на південь від Хеврону, він тече на північний захід повз давні пагорби Телль-ель-Фараг (Південний) і Телль-Джемме й досягає Середземного моря на південь від Гази. Сухий більшу частину року, він розливається після зимових дощів, і його береги були заселені з доісторичних часів: розвідка Ейнна Макдональда 1929–1930 рр. знайшла халколітичні села вздовж його нижньої течії. Надав Наамань стверджував, що саме цей вадій, а не вадій аль-Аріш, був «Єгипетським потоком» ассирійських записів; другий кандидат на мапі, Нахаль-Герар, — північна притока Бесору."
    - "Біблія називає потік один раз, у переслідуванні Давидом амалекитян, що спалили Ціклаг. Давид і його шість сотень «добігли вони до потока Босор, і декотрі помучені остались там. І погнав далїй Давид із чотирма сотнями чоловіка, тим часом як двістї, що були потомлені, зістались, бо не мали сили перейти потік Босорський». Він наздогнав нападників і повернув усе, а коли повернувся до двох сотень, «що їх покинуто коло потока Босор», дехто з його людей не хотів ділитися з ними здобиччю. Давид відповів: «яка частина тим, що ходили на війну, така мусить бути й тим, хто зостався при таборі: однаково всїх обдїлиться», і з того дня «Він се зробив установою й звичаєм ув Ізраїлї по сей день». Де б не лежав Ціклаг, а це спірне, Бесор був першою великою перешкодою на дорозі на південь у край амалекитян."
    - "Нині Бесор проходить повз національний парк Ешкол у західному Негеві Ізраїлю, чиї джерела, Ейн-га-Бесор, найбільші в його басейні, перш ніж перетнути смугу Гази як вадій Газза; біля цих джерел британське військо влаштувало водну базу на фронті Газа — Беер-Шева в 1917 році."
  es:
    - "El Besor es el mayor uadi del Néguev noroccidental, Nahal HaBesor, llamado uadi Ghazzeh en su curso bajo. Nace en las tierras altas del Néguev cerca de Sede Boqer y recibe, por el arroyo de Beerseba, las aguas de las colinas al sur de Hebrón; corre hacia el noroeste junto a los antiguos montículos de Tell el-Far'ah (Sur) y Tell Jemmeh, y llega al Mediterráneo al sur de Gaza. Seco la mayor parte del año, se desborda tras las lluvias de invierno, y sus orillas estuvieron pobladas desde tiempos prehistóricos: la prospección de Eann Macdonald de 1929–1930 halló aldeas calcolíticas a lo largo de su curso bajo. Nadav Na'aman ha sostenido que este uadi, y no el uadi el-Arish, era el «Torrente de Egipto» de los registros asirios; el segundo candidato del mapa, Nahal Gerar, es el afluente septentrional del Besor."
    - "La Biblia nombra el torrente una vez, en la persecución de David a los amalecitas que habían incendiado Siclag. David y sus seiscientos hombres «vinieron hasta el torrente de Besor, donde se quedaron algunos. Y David siguió el alcance con cuatrocientos hombres; porque se quedaron atrás doscientos, que cansados no pudieron pasar el torrente de Besor». Alcanzó a los asaltantes y lo recuperó todo; al volver a los doscientos «á los cuales habían hecho quedar en el torrente de Besor», algunos hombres no quisieron compartir el botín. David respondió: «igual parte ha de ser la de los que vienen á la batalla, y la de los que quedan con el bagaje: que partan juntamente», y desde aquel día «fué esto puesto por ley y ordenanza en Israel, hasta hoy». Dondequiera que estuviera Siclag (se discute), el Besor fue el primer gran obstáculo hacia el sur, la tierra de los amalecitas."
    - "Hoy el Besor pasa por el Parque Nacional Eshkol, en el Néguev occidental de Israel, cuyos manantiales, Ein HaBesor, son los mayores de su cuenca, antes de entrar en la Franja de Gaza como uadi Ghazzeh; en torno a estos manantiales el ejército británico estableció su base de agua en el frente Gaza–Beerseba en 1917."
  pt:
    - "O Besor é o maior uádi do noroeste do Neguebe, o Nahal HaBesor, chamado Wadi Ghazzeh em seu curso inferior. Nasce nas terras altas do Neguebe perto de Sede Boqer e é alimentado, pelo riacho de Berseba, a partir das colinas ao sul de Hebrom; corre para noroeste passando pelos antigos montículos de Tell el-Far'ah (Sul) e Tell Jemmeh e chega ao Mediterrâneo ao sul de Gaza. Seco na maior parte do ano, transborda após as chuvas de inverno, e suas margens foram povoadas desde a pré-história: o levantamento de Eann Macdonald em 1929–1930 achou aldeias calcolíticas em seu curso inferior. Nadav Na'aman sustentou que este uádi, e não o uádi el-Arish, era o “Ribeiro do Egito” dos registros assírios; o segundo candidato do mapa, Nahal Gerar, é o afluente setentrional do Besor."
    - "A Bíblia nomeia o riacho uma só vez, na perseguição de Davi aos amalequitas que haviam queimado Ziclague. Davi, com seus seiscentos homens, “chegou ao riacho de Besor, onde ficaram os que não puderam prosseguir”. Davi continuou com quatrocentos; “duzentos ficaram para trás porque estavam exaustos demais para atravessar o riacho de Besor”. Alcançou os saqueadores e recuperou tudo, e ao voltar aos duzentos, alguns de seus homens não quiseram partilhar o despojo com eles. Davi respondeu: “A parte de quem vai à batalha será igual à parte de quem fica com a bagagem. Todos receberão partes iguais”, e desde aquele dia “Davi estabeleceu isso como estatuto e ordenança para Israel, até o dia de hoje”. Onde quer que ficasse Ziclague, o que é discutido, o Besor foi o primeiro grande obstáculo no caminho para o sul, rumo à terra dos amalequitas."
    - "Hoje o Besor passa pelo Parque Nacional Eshkol, no Neguev ocidental de Israel, cujas fontes, Ein HaBesor, são as maiores de sua bacia, antes de entrar na Faixa de Gaza como Wadi Ghazzeh; em torno dessas fontes o exército britânico fez sua base de água na frente Gaza–Berseba em 1917."
  de:
    - "Der Besor ist das größte Wadi des nordwestlichen Negev, Nahal HaBesor, in seinem Unterlauf Wadi Ghazze genannt. Er entspringt im Negev-Hochland bei Sde Boker, wird über den Beerscheba-Bach aus den Bergen südlich von Hebron gespeist, fließt nach Nordwesten an den antiken Hügeln Tell el-Far'a (Süd) und Tell Dschemme vorbei und erreicht das Mittelmeer südlich von Gaza. Er ist die meiste Zeit des Jahres trocken, führt aber nach den Winterregen Hochwasser, und seine Ufer waren seit vorgeschichtlicher Zeit besiedelt: E. Macdonalds Survey von 1929–1930 fand chalkolithische Dörfer an seinem Unterlauf. Nadav Na'aman hat vertreten, dieses Wadi, nicht der Wadi el-Arisch, sei der „Bach Ägyptens“ der assyrischen Quellen; der zweite Kandidat auf der Karte, Nahal Gerar, ist der nördliche Zufluss des Besor."
    - "Die Bibel nennt ihn einmal: bei Davids Verfolgung der Amalekiter, die Ziklag verbrannt hatten. David und seine sechshundert Mann zogen hin, „und da sie kamen an den Bach Besor, blieben etliche stehen. David aber und die vierhundert Mann jagten nach; die zweihundert Mann aber, die stehen blieben, waren zu müde, über den Bach Besor zu gehen“. Er holte die Räuber ein, gewann alles zurück; einige seiner Männer wollten die Beute den zweihundert vorenthalten, die „am Bach Besor geblieben“ waren. David sagte: „Wie das Teil derjenigen, die in den Streit hinabgezogen sind, so soll auch sein das Teil derjenigen, die bei dem Geräte geblieben sind, und soll gleich geteilt werden“, und: „Das ist seit der Zeit und forthin in Israel Sitte und Recht geworden bis auf diesen Tag.“ Wo Ziklag lag, ist umstritten; der Besor war das erste große Hindernis auf dem Weg ins Amalekiterland."
    - "Heute fließt der Besor am Eschkol-Nationalpark im westlichen Negev Israels vorbei, dessen Quellen, Ein HaBesor, die größten in seinem Becken sind, ehe er als Wadi Ghazze in den Gazastreifen eintritt; bei diesen Quellen legte das britische Heer 1917 seine Wasserbasis an der Front Gaza–Beerscheba an."
  fr:
    - "Le Besor est le plus grand oued du nord-ouest du Négev, le Nahal HaBesor, appelé Wadi Ghazzeh dans son cours inférieur. Naissant dans les hautes terres du Négev près de Sede Boqer et alimenté par le ruisseau de Beer-Schéba depuis les collines au sud d’Hébron, il court vers le nord-ouest au long des anciens tertres de Tell el-Far’ah (Sud) et de Tell Jemmeh, et atteint la Méditerranée au sud de Gaza. À sec la plupart de l’année, il déborde après les pluies d’hiver, et ses rives furent habitées dès la préhistoire : la prospection d’Eann Macdonald en 1929-1930 a trouvé des villages chalcolithiques le long de son cours inférieur. Nadav Na’aman a soutenu que cet oued, plutôt que le Wadi el-Arish, était le « Torrent d’Égypte » des annales assyriennes ; le deuxième candidat de la carte, le Nahal Guérar, est l’affluent nord du Besor."
    - "La Bible nomme le torrent une fois, quand David poursuit les Amalécites qui avaient brûlé Tsiklag. David et ses six cents hommes « arrivèrent au torrent de Besor, où s’arrêtèrent ceux qui restaient en arrière. David continua la poursuite avec quatre cents hommes ; deux cents hommes s’arrêtèrent, trop fatigués pour passer le torrent de Besor ». Il rattrapa les pillards et reprit tout ; au retour, face aux deux cents « qu’on avait laissés au torrent de Besor », certains refusèrent de partager le butin. David répondit : « La part doit être la même pour celui qui est descendu sur le champ de bataille et pour celui qui est resté près des bagages : ensemble ils partageront », et « l’on a fait de cela jusqu’à ce jour une loi et une coutume en Israël ». Où que fût Tsiklag, ce qui est discuté, le Besor était le premier grand obstacle sur la route du sud chez les Amalécites."
    - "Aujourd’hui le Besor passe au parc national d’Eshkol, dans l’ouest du Négev israélien, dont les sources, Ein HaBesor, sont les plus grandes de son bassin, avant d’entrer dans la bande de Gaza sous le nom de Wadi Ghazzeh ; autour de ces sources l’armée britannique établit sa base d’eau sur le front Gaza-Beer-Schéba en 1917."
