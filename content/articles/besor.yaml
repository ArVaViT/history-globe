# Overview article (ADR 0007). Mainstream facts only; Nahal HaBesor is the undisputed identification, Nahal Gerar being a tributary the map keeps as a second candidate.
id: besor
place: a57df09
title:
  en: "Besor"
  ru: "Поток Восор"
body:
  en:
    - "The Besor is the largest wadi of the north-western Negeb, Nahal HaBesor, called Wadi Ghazzeh in its lower course. Rising in the Negeb highlands near Sede Boqer and fed through the Beersheba stream from the hills south of Hebron, it runs north-west past the ancient mounds of Tell el-Far'ah (South) and Tell Jemmeh, and reaches the Mediterranean south of Gaza. Dry for most of the year, it floods after winter rain, and its banks were settled from prehistoric times: Eann Macdonald's survey of 1929–1930 found Chalcolithic villages along its lower course. Nadav Na'aman has argued that this wadi, rather than Wadi el-Arish, was the “Brook of Egypt” of the Assyrian records; the second candidate on the map, Nahal Gerar, is the Besor's northern tributary."
    - "The Bible names the brook once, in David's pursuit of the Amalekites who had burned Ziklag. David and his six hundred men “came to the brook Besor, where those that were left behind stayed. But David pursued, he and four hundred men: for two hundred abode behind, which were so faint that they could not go over the brook Besor”. He overtook the raiders and recovered everything, and when he came back to the two hundred “whom they had made also to abide at the brook Besor”, some of his men would not share the spoil with them. David answered, “as his part is that goeth down to the battle, so shall his part be that tarrieth by the stuff: they shall part alike”, and from that day “he made it a statute and an ordinance for Israel unto this day”. Wherever Ziklag lay, and that is disputed, the Besor was the first great obstacle on the road south into the Amalekites' country."
    - "Today the Besor passes Eshkol National Park in Israel's western Negev, whose springs, Ein HaBesor, are the largest in its basin, before crossing into the Gaza Strip as Wadi Ghazzeh; around these springs the British army made its water base on the Gaza–Beersheba front in 1917."
  ru:
    - "Восор — самое большое вади северо-западного Негева, Нахаль-ха-Бесор, в нижнем течении называемое Вади-Газза. Оно начинается на Негевском нагорье у Сде-Бокера, принимает через поток Беэр-Шевы воды холмов к югу от Хеврона и бежит на северо-запад мимо древних холмов Телль-эль-Фара (Южного) и Телль-Джемме и достигает Средиземного моря южнее Газы. Сухое большую часть года, оно разливается после зимних дождей, а его берега заселялись с доисторических времён: разведка Иэнна Макдональда в 1929–1930 годах нашла вдоль нижнего течения селения медно-каменного века. Надав Нааман доказывал, что именно это вади, а не Вади-эль-Ариш, было «потоком Египетским» ассирийских записей; второй кандидат на карте, Нахаль-Герар, — северный приток Восора."
    - "Библия называет поток один раз, в погоне Давида за Амаликитянами, сжёгшими Секелаг. Давид с шестьюстами мужами «пришли к потоку Восор и усталые остановились там. И преследовал Давид сам и четыреста человек; двести же человек остановились, потому что были не в силах перейти поток Восорский». Он настиг грабителей и отбил всё, а когда вернулся к тем двумстам, «которых он оставил у потока Восор», часть его людей не хотела делиться с ними добычей. Давид ответил: «Какова часть ходившим на войну, такова часть должна быть и оставшимся при обозе: на всех должно разделить», «и поставил он это в закон и в правило для Израиля до сего дня». Где бы ни лежал Секелаг, а это спорно, Восор был первой большой преградой на дороге на юг, в страну Амаликитян."
    - "Сегодня Восор течёт мимо национального парка Эшколь в западном Негеве Израиля, чьи источники Эйн-ха-Бесор — самые обильные в его бассейне, а затем входит в сектор Газа как Вади-Газза; у этих источников британская армия в 1917 году устроила свою водную базу на фронте Газа — Беэр-Шева."
