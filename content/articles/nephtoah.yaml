# Overview article (ADR 0007). Mainstream facts only; a border spring known from two verses; the usual identification with Lifta is given, with the old alternative.
id: nephtoah
place: ac1fef1
title:
  en: "Nephtoah"
  ru: "Нефтоах"
body:
  en:
    - "Nephtoah, “the fountain of the water of Nephtoah” in the King James Version, is a spring on the border between Judah and Benjamin, west of Jerusalem. From the hill above the valley of Hinnom “the border was drawn from the top of the hill unto the fountain of the water of Nephtoah, and went out to the cities of mount Ephron”, and on to Kiriath-jearim; the description of Benjamin's border runs the same line from the other end. Nothing happens there in the Bible. An old suggestion read the name as “the wells of Merneptah”, after the pharaoh; it is now generally given up."
    - "The spring is usually identified with the one at Lifta, on the slope below the north-western entrance to Jerusalem, which fits the line of the border; Rashi, commenting on the Talmud, instead took the waters of Nephtoah for the spring of Etam, south of Bethlehem. Lifta was an Arab village whose people left in 1948; its stone houses still stand empty round the spring pool, and the place, called Mei Neftoah in Hebrew, was put on the World Monuments Watch list of endangered sites in 2018."
  ru:
    - "Нефтоах, в Синодальном переводе источник вод Нефтоах, — родник на границе Иуды и Вениамина к западу от Иерусалима. От горы над долиной Енномовой «от вершины горы предел поворачивает к источнику вод Нефтоах и идет к городам горы Ефрона», а далее к Кириаф-Иариму; описание предела Вениамина ведёт ту же линию с другого конца. В Библии там ничего не происходит. Старое предположение читало имя как «колодцы Мернептаха», по имени фараона; теперь от него обычно отказываются."
    - "Источник обычно отождествляют с родником в Лифте, на склоне ниже северо-западного въезда в Иерусалим, что подходит к ходу границы; Раши же в толковании на Талмуд считал воды Нефтоаха источником Етама к югу от Вифлеема. Лифта была арабским селением, жители которого ушли в 1948 году; его каменные дома до сих пор стоят пустыми вокруг водоёма у родника, а само место, по-еврейски Мей-Нефтоах, в 2018 году внесено в список World Monuments Watch как памятник под угрозой."
scripture:
  - Josh.15.8-Josh.15.9
  - Josh.18.15-Josh.18.16
sources:
  - "Rashi on Babylonian Talmud, Yoma 31a"
  - "C. R. Conder and H. H. Kitchener, The Survey of Western Palestine: Memoirs, vol. 3, Judaea (1883)"
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
  - "R. G. Boling and G. E. Wright, Joshua (Anchor Bible, 1982)"
