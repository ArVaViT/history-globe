body:
  en:
    - "Nephtoah, “the fountain of the water of Nephtoah” in the King James Version, is a spring on the border between Judah and Benjamin, west of Jerusalem. From the hill above the valley of Hinnom “the border was drawn from the top of the hill unto the fountain of the water of Nephtoah, and went out to the cities of mount Ephron”, and on to Kiriath-jearim; the description of Benjamin's border runs the same line from the other end. Nothing happens there in the Bible. An old suggestion read the name as “the wells of Merneptah”, after the pharaoh; it is now generally given up."
    - "The spring is usually identified with the one at Lifta, on the slope below the north-western entrance to Jerusalem, which fits the line of the border; rabbinic tradition, in the Talmud's discussion at Yoma 31a, instead took the waters of Nephtoah for the spring of Etam, south of Bethlehem. Lifta was an Arab village whose people left in 1948; its stone houses still stand empty round the spring pool, and the place, called Mei Neftoah in Hebrew, was put on the World Monuments Watch list of endangered sites in 2018."
  ru:
    - "Нефтоах, в Синодальном переводе источник вод Нефтоах, — родник на границе Иуды и Вениамина к западу от Иерусалима. От горы над долиной Енномовой «от вершины горы предел поворачивает к источнику вод Нефтоах и идет к городам горы Ефрона», а далее к Кириаф-Иариму; описание предела Вениамина ведёт ту же линию с другого конца. В Библии там ничего не происходит. Старое предположение читало имя как «колодцы Мернептаха», по имени фараона; теперь от него обычно отказываются."
    - "Источник обычно отождествляют с родником в Лифте, на склоне ниже северо-западного въезда в Иерусалим, что подходит к ходу границы; раввинская же традиция, в обсуждении Талмуда (трактат «Йома» 31a), считала воды Нефтоаха источником Етама к югу от Вифлеема. Лифта была арабским селением, жители которого ушли в 1948 году; его каменные дома до сих пор стоят пустыми вокруг водоёма у родника, а само место, по-еврейски Мей-Нефтоах, в 2018 году внесено в список World Monuments Watch как памятник под угрозой."
  uk:
    - "Нефтоах, криниця Нефтоах-води, — це джерело на межі між Юдою та Веніяміном, на захід від Єрусалима. Від пагорба над долиною Гінном: «Від вершин же гори повертає до криницї Нефтоах-води і йде далїй на городи Ефрон-гори», а далі до Кіріят-Єарима; опис межі Веніяміна проходить тією самою лінією з іншого кінця. У Біблії там нічого не відбувається. Давнє припущення читало назву як «колодязі Мернептаха» — за іменем фараона; нині його загалом залишили."
    - "Джерело зазвичай ототожнюють із тим, що в Ліфті, на схилі під північно-західним входом до Єрусалима, що відповідає лінії межі; рабинська традиція, в обговоренні Талмуду (трактат «Йома» 31a), натомість вважала води Нефтоаха джерелом Етама, на південь від Вифлеєма. Ліфта була арабським селом, мешканці якого залишили його 1948 року; її кам'яні будинки досі стоять порожні навколо басейну джерела, і місце, яке єврейською називається Мей-Нефтоах, 2018 року внесено до списку під загрозою World Monuments Watch."
  es:
    - "Neftoa, «la fuente de las aguas de Nephtoa» en la Reina-Valera, es un manantial en la frontera entre Judá y Benjamín, al oeste de Jerusalén. Desde la colina sobre el valle de Hinom, «rodea este término desde la cumbre del monte hasta la fuente de las aguas de Nephtoa, y sale á la ciudades del monte de Ephrón», y sigue hasta Quiriat-jearim; la descripción de la frontera de Benjamín recorre la misma línea desde el otro extremo. En la Biblia no sucede nada allí. Una antigua sugerencia leía el nombre como «los pozos de Merneptah», por el faraón; hoy se ha abandonado de forma general."
    - "El manantial se identifica por lo común con el de Lifta, en la ladera bajo la entrada noroeste de Jerusalén, lo que encaja con el trazado de la frontera; la tradición rabínica, en la discusión del Talmud en Yoma 31a, tomó en cambio las aguas de Neftoa por el manantial de Etam, al sur de Belén. Lifta era una aldea árabe cuyos habitantes se marcharon en 1948; sus casas de piedra siguen vacías en torno a la alberca del manantial, y el lugar, llamado en hebreo Mei Neftoah, fue incluido en 2018 en la lista World Monuments Watch de sitios en peligro."
  pt:
    - "Neftoa — na Bíblia King James, “a fonte das águas de Neftoa” — é uma fonte na fronteira entre Judá e Benjamim, a oeste de Jerusalém. Da colina acima do vale de Hinom, “a fronteira se estendia desde o topo do monte até a fonte das águas de Neftoa, e saía para as cidades do monte Efrom”, e daí a Quiriate-Jearim; a descrição da fronteira de Benjamim traça a mesma linha a partir da outra ponta. Nada acontece ali na Bíblia. Uma antiga sugestão lia o nome como “os poços de Merneptá”, o faraó; hoje ela está em geral abandonada."
    - "A fonte costuma ser identificada com a de Lifta, na encosta abaixo da entrada noroeste de Jerusalém, o que se ajusta ao traçado da fronteira; a tradição rabínica, na discussão do Talmude em Yoma 31a, tomou em vez disso as águas de Neftoa pela fonte de Etã, ao sul de Belém. Lifta era uma aldeia árabe cujos habitantes partiram em 1948; suas casas de pedra continuam vazias em volta do tanque da fonte, e o lugar, chamado Mei Neftoah em hebraico, foi incluído em 2018 na lista World Monuments Watch de sítios ameaçados."
  de:
    - "Neftoach, in der Lutherbibel der „Wasserbrunnen Nephthoa“, ist eine Quelle an der Grenze zwischen Juda und Benjamin, westlich von Jerusalem. Vom Hügel über dem Hinnomtal führt die Grenze: „kommt sie von des Berges Spitze zu dem Wasserbrunnen Nephthoa und kommt heraus zu den Städten des Gebirges Ephron“ und weiter nach Kirjat-Jearim; die Beschreibung der Grenze Benjamins verfolgt dieselbe Linie vom anderen Ende her. In der Bibel geschieht dort nichts. Eine alte Vermutung las den Namen als „die Brunnen des Merneptah“, nach dem Pharao; sie ist heute allgemein aufgegeben."
    - "Die Quelle wird meist mit der von Lifta gleichgesetzt, am Hang unterhalb des nordwestlichen Eingangs nach Jerusalem, was zum Grenzverlauf passt; die rabbinische Überlieferung dagegen hielt in der Erörterung des Talmud zu Joma 31a die Wasser von Neftoach für die Quelle von Etam südlich von Bethlehem. Lifta war ein arabisches Dorf, dessen Bewohner 1948 gingen; seine Steinhäuser stehen noch leer um das Quellbecken, und der Ort, hebräisch Mei Neftoach genannt, wurde 2018 auf die Watch List des World Monuments Fund gesetzt."
  fr:
    - "Nephthoach, « la source des eaux de Nephthoach » chez Louis Segond, est une source sur la frontière entre Juda et Benjamin, à l’ouest de Jérusalem. Depuis la colline au-dessus de la vallée de Hinnom, « du sommet de la montagne elle s’étendait jusqu’à la source des eaux de Nephthoach, continuait vers les villes de la montagne d’Éphron », puis vers Kirjath-Jearim ; la description de la frontière de Benjamin suit la même ligne depuis l’autre extrémité. Rien ne s’y passe dans la Bible. Une ancienne hypothèse lisait le nom comme « les puits de Merneptah », d’après le pharaon ; on l’abandonne aujourd’hui en général."
    - "La source est d’ordinaire identifiée à celle de Lifta, sur la pente sous l’entrée nord-ouest de Jérusalem, ce qui s’accorde avec le tracé de la frontière ; la tradition rabbinique, dans la discussion du Talmud en Yoma 31a, a plutôt pris les eaux de Nephthoach pour la source d’Étam, au sud de Bethléem. Lifta était un village arabe dont les habitants partirent en 1948 ; ses maisons de pierre se dressent encore, vides, autour du bassin de la source, et le lieu, appelé Mei Neftoah en hébreu, a été inscrit en 2018 sur la liste World Monuments Watch des sites en péril."
  it:
    - "Neftoach, «la sorgente delle acque di Neftoah», è una sorgente sul confine tra Giuda e Beniamino, a ovest di Gerusalemme. Dalla collina che sovrasta la valle di Hinnom «dal sommo del monte, il confine si estendeva fino alla sorgente delle acque di Neftoah, continuava verso le città del monte Efron», e oltre fino a Kiriat-Iearim; la descrizione del confine di Beniamino segue la stessa linea dall’altra estremità. Nella Bibbia lì non accade nulla. Un’antica proposta leggeva il nome come «le sorgenti di Merneptah», dal faraone; oggi è generalmente abbandonata."
    - "La sorgente è di solito identificata con quella di Lifta, sul pendio sotto l’ingresso nord-occidentale di Gerusalemme, che si accorda con il tracciato del confine; la tradizione rabbinica, nella discussione del Talmud a Yoma 31a, prese invece le acque di Neftoach per la sorgente di Etam, a sud di Betlemme. Lifta era un villaggio arabo i cui abitanti se ne andarono nel 1948; le sue case di pietra stanno ancora vuote attorno alla vasca della sorgente, e il luogo, chiamato in ebraico Mei Neftoah, fu inserito nel 2018 nella lista World Monuments Watch dei siti in pericolo."
  pl:
    - "Neftoach, w Biblii Króla Jakuba „the fountain of the water of Nephtoah”, to źródło na granicy między Judą a Beniaminem, na zachód od Jerozolimy. Od wzgórza nad doliną Hinnom „Obtacza też ta granica od wierzchu góry aż do źródła wody Neftoa, i bieży aż do miast góry Hefron”, a dalej do Kiriat-Jearim; opis granicy Beniamina biegnie tą samą linią od drugiego końca. W Biblii nic się tam nie dzieje. Dawna sugestia odczytywała nazwę jako „źródła Merneptaha”, od faraona; dziś jest powszechnie porzucona."
    - "Źródło utożsamia się zwykle z tym w Liftie, na zboczu poniżej północno-zachodniego wejścia do Jerozolimy, co pasuje do biegu granicy; tradycja rabiniczna, w dyskusji Talmudu w traktacie Joma 31a, uznała natomiast wody Neftoach za źródło Etam, na południe od Betlejem. Lifta była arabską wsią, której mieszkańcy odeszli w 1948 roku; jej kamienne domy wciąż stoją puste wokół sadzawki źródła, a miejsce, zwane po hebrajsku Mei Neftoach, w 2018 roku wpisano na listę zagrożonych obiektów World Monuments Watch."
  cs:
    - "Neftoach, v anglické Bibli krále Jakuba „the fountain of the water of Nephtoah“, je pramen na hranici mezi Judskem a Benjamínem, západně od Jeruzaléma. Od vrchu nad údolím Hinnom „obchází pak ta meze od vrchu té hory k studnici vody Neftoa, a vychází k městům hory Efron“ a dále ke Kirjat-jearímu; popis hranice Benjamínovy vede tutéž čáru od druhého konce. Nic se tam v Bibli neděje. Stará domněnka četla jméno jako „studny Merneptahovy“ podle faraona; dnes se obecně opouští."
    - "Pramen se obvykle ztotožňuje s pramenem v Lifta, na svahu pod severozápadním vjezdem do Jeruzaléma, což odpovídá průběhu hranice; rabínská tradice v rozpravě talmudu v traktátu Joma 31a naopak pokládala vody Neftoach za pramen Étamu, jižně od Betléma. Lifta byla arabská vesnice, jejíž obyvatelé odešli roku 1948; její kamenné domy stojí prázdné kolem pramenné nádrže a místo, hebrejsky zvané Mei Neftoach, bylo roku 2018 zařazeno na seznam World Monuments Watch ohrožených památek."
  nl:
    - "Neftoach, in de King James Version “the fountain of the water of Nephtoah”, is een bron op de grens tussen Juda en Benjamin, ten westen van Jeruzalem. Vanaf de heuvel boven het dal van Hinnom liep de grens “van de hoogte des bergs tot aan de waterfontein Nefthoah, en uitgaan tot de steden van het gebergte Efron”, en verder naar Kirjat-Jearim; de beschrijving van Benjamins grens volgt dezelfde lijn vanaf het andere uiteinde. Er gebeurt niets in de Bijbel op die plaats. Een oud voorstel las de naam als “de bronnen van Merneptah”, naar de farao; dat wordt nu algemeen opgegeven."
    - "De bron wordt meestal geïdentificeerd met die van Lifta, op de helling onder de noordwestelijke ingang van Jeruzalem, wat bij het verloop van de grens past; de rabbijnse traditie nam in de bespreking van de Talmoed in Joma 31a de wateren van Neftoach juist voor de bron van Etam, ten zuiden van Bethlehem. Lifta was een Arabisch dorp waarvan de bewoners in 1948 vertrokken; zijn stenen huizen staan nog leeg rond het bronbassin, en de plaats, in het Hebreeuws Mei Neftoach genoemd, werd in 2018 op de World Monuments Watch-lijst van bedreigde plaatsen gezet."
  sv:
    - "Neftoach, ”the fountain of the water of Nephtoah” i King James-översättningen, är en källa på gränsen mellan Juda och Benjamin, väster om Jerusalem. Från höjden ovanför Hinnoms dal går gränsen vidare: ”från toppen av detta berg drog sig gränsen fram till Neftoavattnets källa och vidare till städerna i Efrons bergsbygd”, och vidare till Kirjat-Jearim; beskrivningen av Benjamins gräns följer samma linje från andra änden. Ingenting sker där i Bibeln. Ett gammalt förslag läste namnet som ”Merneptahs källor”, efter farao; det är nu allmänt övergivet."
    - "Källan identifieras vanligen med den vid Lifta, på sluttningen nedanför den nordvästra ingången till Jerusalem, vilket passar gränsens sträckning; den rabbinska traditionen, i Talmuds diskussion vid Yoma 31a, tog i stället Neftoachs vatten för källan vid Etam, söder om Betlehem. Lifta var en arabisk by vars invånare lämnade den 1948; dess stenhus står ännu tomma kring källbassängen, och platsen, på hebreiska kallad Mei Neftoah, sattes 2018 upp på World Monuments Watch-listan över hotade platser."
  nb:
    - "Neftoa, «Neftoah-vannets kilde» i King James Version, er en kilde på grensen mellom Juda og Benjamin, vest for Jerusalem. Fra høyden over Hinnom-dalen «strakte grensen sig bort til Neftoah-vannets kilde og holdt frem til byene i Efrons fjellbygd», og videre til Kirjat-Jearim; beskrivelsen av Benjamins grense følger den samme linjen fra den andre enden. Ingenting skjer der i Bibelen. Et gammelt forslag leste navnet som «Merneptahs kilder», etter farao; det er nå stort sett oppgitt."
    - "Kilden identifiseres vanligvis med den ved Lifta, i skråningen under den nordvestlige inngangen til Jerusalem, som passer med grenselinjen; rabbinsk tradisjon tok derimot, i Talmuds drøfting i Yoma 31a, Neftoa-vannet for kilden i Etam, sør for Betlehem. Lifta var en arabisk landsby hvis innbyggere dro i 1948; steinhusene står fortsatt tomme rundt kildebassenget, og stedet, på hebraisk kalt Mei Neftoah, ble satt på World Monuments Watch-listen over truede steder i 2018."
  tl:
    - "Ang Nephtoa, “the fountain of the water of Nephtoah” sa King James Version, ay isang bukal sa hangganan ng Juda at Benjamin, sa kanluran ng Jerusalem. Mula sa burol sa itaas ng libis ng Hinnom, “ang hangganan ay paabot mula sa taluktok ng bundok hanggang sa bukal ng tubig ng Nephtoa, at palabas sa mga bayan ng bundok ng Ephron”, at patuloy sa Kiriath-jearim; ang paglalarawan sa hangganan ng Benjamin ay tumatahak sa iisang linya mula sa kabilang dulo. Walang nangyayari roon sa Bibliya. Isang lumang mungkahi ang bumasa sa pangalan bilang “mga balon ni Merneptah”, na hango sa pangalan ng faraon; karaniwan na itong itinatakwil ngayon."
    - "Karaniwang kinikilala ang bukal sa nasa Lifta, sa dalisdis sa ibaba ng hilagang-kanlurang pasukan ng Jerusalem, na akma sa linya ng hangganan; ang tradisyong rabiniko, sa talakayan ng Talmud sa Yoma 31a, ay itinuring sa halip na ang tubig ng Nephtoa ay ang bukal ng Etam, sa timog ng Bethlehem. Ang Lifta ay isang nayong Arabe na iniwan ng mga tao nito noong 1948; nakatayo pa rin ang mga bahay nitong bato na walang laman sa palibot ng tipunan ng tubig ng bukal, at ang lugar, na tinatawag na Mei Neftoah sa Hebreo, ay inilagay sa listahan ng World Monuments Watch ng mga pook na nanganganib noong 2018."
  da:
    - "Neftoa, »the fountain of the water of Nephtoah« i King James-oversættelsen, er en kilde på grænsen mellem Juda og Benjamin, vest for Jerusalem. Fra højen over Hinnoms Dal hedder det: »Landemærket bøjer sig fra Bjergets Top til Nefthoa Vandkilde og gaar ud til Stæderne paa Efrons Bjerg« og videre til Kirjat-Jearim; beskrivelsen af Benjamins grænse følger den samme linje fra den anden ende. Intet sker dér i Bibelen. Et ældre forslag læste navnet som »Merneptahs brønde«, efter faraoen; det er nu almindeligvis opgivet."
    - "Kilden identificeres sædvanligvis med den i Lifta, på skråningen under den nordvestlige indgang til Jerusalem, hvilket passer med grænsens linje; den rabbinske tradition, i Talmuds drøftelse i Yoma 31a, tog i stedet Neftoas vande for kilden Etam syd for Betlehem. Lifta var en arabisk landsby, hvis beboere forlod den i 1948; dens stenhuse står stadig tomme omkring kildebassinet, og stedet, på hebraisk kaldet Mei Neftoah, blev i 2018 sat på World Monuments Watch-listen over truede steder."
  sr:
    - "Нефтоје, „извор воде Нефтоје“ у Библији краља Џејмса, јесте извор на међи између Јуде и Венијамина, западно од Јерусалима. Од брда изнад долине Хином „савија међа с врха те горе к извору воде Нефтоје и излази на градове у гори Ефрону“, па даље на Киријат-Јарим; опис међе Венијаминове води исту линију с другог краја. У Библији се тамо ништа не догађа. Једна стара претпоставка читала је име као „извори Мернептаха“, по фараону; данас је углавном напуштена."
    - "Извор се обично поистовећује с оним у Лифти, на падини испод северозападног улаза у Јерусалим, што одговара линији међе; рабинско предање, у расправи Талмуда у Јоми 31а, уместо тога је воде Нефтоје сматрало изворима Етама, јужно од Витлејема. Лифта је била арапско село чији су становници отишли 1948; њене камене куће још стоје празне око базена извора, а место, на хебрејском зване Меј Нефтоах, стављено је 2018. на листу угрожених места Светског фонда за споменике."
  hu:
    - "A Neftóah (a King James Version-ben „the fountain of the water of Nephtoah”) egy forrás Júda és Benjámin határán, Jeruzsálemtől nyugatra. A Hinnom-völgy fölötti dombról „hajlik e határ a hegynek tetejétől a Neftoáh víznek kútfejéhez és kimegy az Efron hegyének városai felé”, majd tovább Kirját-Jeárimhoz; Benjámin határának leírása ugyanezt a vonalat futja be a másik végről. A Biblia szerint semmi sem történik ott. Egy régi javaslat a nevet „Merneptah kútjaiként” olvasta, a fáraó nyomán; ezt ma általában elvetik."
    - "A forrást általában a Lifta-beli forrással azonosítják, a Jeruzsálem északnyugati bejárata alatti lejtőn, ami illik a határ vonalához; a rabbinikus hagyomány, a Talmud Joma 31a-beli tárgyalásában ehelyett a Neftóah vizeit a Betlehemtől délre fekvő Étám forrásának tartotta. Lifta arab falu volt, amelynek lakói 1948-ban elhagyták; kőházai ma is üresen állnak a forrásmedence körül, és a hely, amelyet héberül Mei Neftoah néven neveznek, 2018-ban felkerült a veszélyeztetett helyek World Monuments Watch listájára."
  fi:
    - "Neftoah, King James -Raamatussa ”the fountain of the water of Nephtoah”, on lähde Juudan ja Benjaminin rajalla Jerusalemista länteen. Hinnomin laakson yläpuolisen kukkulan huipulta ”raja kaartuu Neftoahin veden lähteelle ja jatkuu Efronin vuoren kaupunkeihin” ja edelleen Kirjat-Jearimiin; Benjaminin rajan kuvaus kulkee saman linjan toisesta päästä. Raamatussa siellä ei tapahdu mitään. Vanha ehdotus luki nimen ”Merneptahin lähteiksi” faaraon mukaan; siitä on nyt yleisesti luovuttu."
    - "Lähde tunnistetaan yleensä Liftan lähteeksi Jerusalemin luoteissisäänkäynnin alapuolella rinteessä, mikä sopii rajan linjaan; rabbiininen perinne, Talmudin Yoma 31a:n käsittelyssä, katsoi sen sijaan Neftoahin vedet Etamin lähteeksi Betlehemistä etelään. Lifta oli arabikylä, jonka asukkaat lähtivät vuonna 1948; sen kivitalot seisovat yhä tyhjinä lähdealtaan ympärillä, ja paikka, jota heprean kielellä kutsutaan nimellä Mei Neftoah, otettiin World Monuments Watch -luetteloon uhanalaisten kohteiden joukkoon vuonna 2018."
  vi:
    - "Nép-thô-ách, “suối nước Nép-thô-ách” trong bản King James, là một dòng suối trên biên giới giữa Giu-đa và Bên-gia-min, phía tây Giê-ru-sa-lem. Từ ngọn đồi phía trên thung lũng Hi-nôm, “Giới hạn này chạy từ chót núi đến suối nước Nép-thô-ách, và ăn về hướng các thành của núi Ép-rôn”, rồi đi tiếp đến Ki-ri-át-Giê-a-rim; phần mô tả ranh giới Bên-gia-min chạy cùng đường ấy từ đầu bên kia. Trong Kinh Thánh không có sự kiện nào xảy ra ở đó. Một gợi ý cũ đọc tên này là “các giếng của Merneptah”, theo tên pharaô; ngày nay người ta nói chung đã bỏ ý ấy."
    - "Dòng suối thường được đồng nhất với suối ở Lifta, trên sườn dốc bên dưới lối vào tây bắc Giê-ru-sa-lem, phù hợp với đường biên giới; truyền thống rabbi, trong phần thảo luận của Talmud tại Yoma 31a, thì lại cho nước Nép-thô-ách là suối Ê-tam, phía nam Bết-lê-hem. Lifta là một làng của người A-ráp mà dân làng đã rời đi năm 1948; những ngôi nhà đá của nó vẫn đứng trống quanh hồ nước của suối, và nơi này, tiếng Hê-bơ-rơ gọi là Mei Neftoah, được đưa vào danh sách World Monuments Watch về các địa điểm bị đe dọa năm 2018."
  ro:
    - "Neftoah, „izvorul apelor Neftoah” în versiunea King James, este un izvor aflat pe hotarul dintre Iuda și Beniamin, la vest de Ierusalim. De pe dealul de deasupra văii Hinom hotarul era tras din vârful dealului până la izvorul apelor Neftoah și ieșea la cetățile muntelui Efron, apoi spre Chiriat-Iearim; descrierea hotarului lui Beniamin urmează aceeași linie de la celălalt capăt. În Biblie nu se petrece nimic acolo. O sugestie veche citea numele ca „fântânile lui Merneptah”, după faraon; astăzi este în general abandonată."
    - "Izvorul este identificat de obicei cu cel de la Lifta, pe povârnișul de sub intrarea nord-vestică în Ierusalim, ceea ce se potrivește cu linia hotarului; tradiția rabinică, în discuția din Talmud de la Yoma 31a, a socotit în schimb că apele Neftoah sunt izvorul Etam, la sud de Betleem. Lifta era un sat arab ai cărui locuitori l-au părăsit în 1948; casele lui de piatră stau și acum goale în jurul bazinului izvorului, iar locul, numit în ebraică Mei Neftoah, a fost pus în 2018 pe lista World Monuments Watch a siturilor amenințate."
  bg:
    - "Нефтоах, в Библията на крал Джеймс „изворът на водата на Нефтоах“, е извор на границата между Юда и Вениамин, на запад от Йерусалим. От хълма над долината Еном „преминваше пределът от върха на гората до източника на водата Нефетоя, и излазяше в градовете на гората Ефрон“ и продължавал до Кириат-Ярим; описанието на границата на Вениамин следва същата линия от другия край. В Библията там не се случва нищо. Едно старо предположение тълкувало името като „кладенците на Мернептах“, по името на фараона; днес то обикновено е изоставено."
    - "Изворът обикновено се отъждествява с извора при Лифта, на склона под северозападния вход на Йерусалим, което съответства на линията на границата; равинската традиция, в обсъждането в Талмуда в Йома 31а, вместо това смята водите на Нефтоах за извора на Етам, южно от Витлеем. Лифта било арабско село, чиито жители го напуснали през 1948 г.; каменните му къщи все още стоят празни около басейна на извора, а мястото, наричано на иврит Мей Нефтоах, през 2018 г. е включено в списъка World Monuments Watch на застрашените обекти."
