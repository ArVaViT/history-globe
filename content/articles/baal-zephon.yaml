# Overview article (ADR 0007). Mainstream facts only; the site depends on the route of the exodus, and the candidates on the map are given without choosing.
id: baal-zephon
place: a22663b
title:
  en: "Baal-zephon"
  ru: "Ваал-Цефон"
  uk: "Ваал-Цефон"
  es: "Baal-zefón"
  pt: "Baal-Zefom"
  de: "Baal-Zefon"
  fr: "Baal-Tsephon"
  it: "Baal-Zefon"
  pl: "Baal-Sefon"
  nl: "Baäl-Zefon"
  cs: "Báal-cefón"
  sv: "Baal-Sefon"
  nb: "Baal-Sefon"
body:
  en:
    - "Baal-zephon was the landmark of Israel's last camp before the sea. God told Moses that the people should “turn and encamp before Pi-hahiroth, between Migdol and the sea, over against Baal-zephon: before it shall ye encamp by the sea”; Pharaoh's army overtook them “encamping by the sea, beside Pi-hahiroth, before Baal-zephon”; and the list of stations repeats that from Etham they “turned again unto Pi-hahiroth, which is before Baal-zephon”. The name is a god's: Baal-zaphon, “lord of the north”, the Baal of Mount Zaphon north of Ugarit, a protector of sailors whose cult the Phoenicians carried to Egypt. The place was presumably a shrine of his on the Egyptian frontier."
    - "Where it stood depends on where the sea was crossed, and that is unknown. A Phoenician letter on papyrus found at Saqqara blesses its reader by Baal-zephon and all the gods of Tahpanhes, which led N. Aimé-Giron and W. F. Albright to place the shrine at Tahpanhes, Tell Defenneh in the eastern Delta, the first candidate on the map. Otto Eissfeldt argued that it was the sanctuary later known as that of Zeus Kasios on the sandbar of Lake Bardawil (Ras Qasrun, Zahr al-Qais on the map), where the Greeks worshipped the same storm god of the mountain under another name. Those who send Israel south toward the Gulf of Suez have found Baal-zephon at Jebel Ataqa or Jebel al-Murr above Suez, or at Arsinoe, the later Clysma, at the head of the gulf; others at al-Mahamdiyah near Pelusium. None of these sites has produced the name."
    - "Today the candidates lie across the north-east of Egypt, from the waterfront of Suez to the Mediterranean bar of Bardawil; Tell Defenneh is a mound in the desert some 14 km west of the Suez Canal, first excavated by Flinders Petrie in 1886."
  ru:
    - "Ваал-Цефон был ориентиром последнего стана Израиля перед морем. Бог велел Моисею, чтобы народ «обратились и расположились станом пред Пи-Гахирофом, между Мигдолом и между морем, пред Ваал-Цефоном; напротив его поставьте стан у моря»; войско фараона настигло их «расположившихся у моря, при Пи-Гахирофе пред Ваал-Цефоном»; а перечень станов повторяет, что из Ефама они «обратились к Пи-Гахирофу, что пред Ваал-Цефоном». Имя принадлежит богу: Ваал-Цафон, «владыка севера», Ваал горы Цафон к северу от Угарита, покровитель мореходов, чей культ финикийцы принесли в Египет. Место было, по-видимому, его святилищем на египетской границе."
    - "Где оно стояло, зависит от того, где переходили море, а это неизвестно. Финикийское письмо на папирусе, найденное в Саккаре, благословляет адресата Ваал-Цефоном и всеми богами Тафниса, и это привело Н. Эме-Жирона и У. Ф. Олбрайта к мысли поместить святилище в Тафнисе, Телль-Дефенне в восточной Дельте, — первый кандидат на карте. Отто Айсфельдт доказывал, что это святилище, позже известное как святилище Зевса Касия на песчаной косе озера Бардавиль (Рас-Касрун, на карте Захр-аль-Кайс), где греки чтили того же бога бури с горы под другим именем. Те, кто ведёт Израиль на юг к Суэцкому заливу, находили Ваал-Цефон на Джебель-Атаке или Джебель-аль-Мурре над Суэцем либо в Арсиное, позднейшем Клисме, у вершины залива; другие — в Эль-Махамдии близ Пелусия. Ни одно из этих мест не дало этого имени."
    - "Сегодня кандидаты рассыпаны по северо-востоку Египта, от набережной Суэца до средиземноморской косы Бардавиля; Телль-Дефенне — холм в пустыне примерно в 14 км к западу от Суэцкого канала, который первым раскапывал Флиндерс Питри в 1886 году."
  uk:
    - "Ваал-Цефон був орієнтиром останнього табору Ізраїлю перед морем. Бог наказав Мойсею, щоб Ізраїль «одвернули й отаборились перед Пі-Гахиротом, між Микдолом і морем; перед Бааль-Цефоном отаборитесь навпроти його, при морі»; військо фараона наздогнало їх, «як отаборились при морі, ... при Пі-Гахиротї, по близу Бааль-Цефону»; а перелік станів повторює, що від Етаму вони «повернули на Пі-Гахирот, що проти Бааль-Зефона». Це ім'я бога: Ваал-Цафон, «володар півночі», Ваал гори Цафон на північ від Угарита, покровитель мореплавців, чий культ фінікійці занесли до Єгипту. Місце, імовірно, було його святинею на єгипетському кордоні."
    - "Де воно стояло, залежить від того, де перетнули море, а це невідомо. Фінікійський лист на папірусі, знайдений у Саккарі, благословляє читача Ваал-Цафоном і всіма богами Тафніса, що привело Н. Еме-Жірона та В. Ф. Олбрайта до думки розмістити святиню в Тафнісі, Телль-Дефенне у східній дельті, перший кандидат на мапі. Отто Айсфельдт стверджував, що це святилище, відоме згодом як святилище Зевса Касія на піщаній косі озера Бардавіль (Рас-Касрун, Захр-аль-Кайс на мапі), де греки шанували того самого грозового бога гори під іншим ім'ям. Ті, хто відправляє Ізраїль на південь до Суецької затоки, шукають Ваал-Цефон на Джебель-Атака чи Джебель-аль-Мурр над Суецом, або в Арсиної, пізнішої Клісми, на вершині затоки; інші — в аль-Махамдії біля Пелусія. Жодне з цих місць не дало назви."
    - "Нині кандидати лежать по всьому північному сходу Єгипту, від набережної Суеца до середземноморської коси Бардавіль; Телль-Дефенне — пагорб у пустелі приблизно за 14 км на захід від Суецького каналу, вперше розкопаний Фліндерсом Петрі в 1886 році."
  es:
    - "Baal-zefón era el mojón del último campamento de Israel antes del mar. Dios dijo a Moisés que hablara a los hijos de Israel para que «den la vuelta, y asienten su campo delante de Pihahiroth, entre Migdol y la mar hacia Baalzephón: delante de él asentaréis el campo, junto á la mar»; el ejército del faraón los alcanzó «asentando el campo junto á la mar, al lado de Pihahiroth, delante de Baalzephón»; y la lista de estaciones repite que desde Etam «volvieron sobre Pi-hahiroth, que está delante de Baalsephon». El nombre es el de un dios: Baal-zafón, «señor del norte», el Baal del monte Zafón, al norte de Ugarit, protector de los marineros cuyo culto llevaron los fenicios a Egipto. El lugar era presumiblemente un santuario suyo en la frontera egipcia."
    - "Dónde estuvo depende de dónde se cruzó el mar, y eso se ignora. Una carta fenicia en papiro hallada en Saqqara bendice a su lector por Baal-zefón y todos los dioses de Tafnes, lo que llevó a N. Aimé-Giron y a W. F. Albright a situar el santuario en Tafnes, Tell Defenneh, en el Delta oriental, el primer candidato del mapa. Otto Eissfeldt sostuvo que era el santuario conocido más tarde como el de Zeus Kasios en el banco de arena de la laguna Bardawil (Ras Qasrun, Zahr al-Qais en el mapa), donde los griegos adoraban al mismo dios de la tormenta de la montaña con otro nombre. Quienes envían a Israel hacia el sur, al golfo de Suez, han hallado Baal-zefón en el Jebel Ataqa o el Jebel al-Murr, sobre Suez, o en Arsínoe, la posterior Clysma, en la cabecera del golfo; otros en al-Mahamdiyah, cerca de Pelusio. Ninguno de estos sitios ha dado el nombre."
    - "Hoy los candidatos se reparten por el nordeste de Egipto, desde el frente marítimo de Suez hasta el banco mediterráneo de Bardawil; Tell Defenneh es un montículo en el desierto a unos 14 km al oeste del canal de Suez, excavado por primera vez por Flinders Petrie en 1886."
  pt:
    - "Baal-Zefom era o marco do último acampamento de Israel antes do mar. Deus disse a Moisés: “Diga aos filhos de Israel que voltem e acampem diante de Pi-Hairote, entre Migdol e o mar, diante de Baal-Zefom. Vocês acamparão em frente a ele, junto ao mar”; o exército de Faraó os alcançou “enquanto acampavam junto ao mar, perto de Pi-Hairote, diante de Baal-Zefom”; e a lista das estações repete que, de Etã, “voltaram para Pi-Hairote, que fica em frente a Baal-Zefom”. O nome é de um deus: Baal-Zafom, “senhor do norte”, o Baal do monte Zafom, ao norte de Ugarit, protetor dos marinheiros cujo culto os fenícios levaram ao Egito. O lugar era presumivelmente um santuário seu na fronteira egípcia."
    - "Onde ficava depende de onde se atravessou o mar, e isso se ignora. Uma carta fenícia em papiro achada em Saqqara abençoa o leitor por Baal-Zefom e por todos os deuses de Tafnes, o que levou N. Aimé-Giron e W. F. Albright a situar o santuário em Tafnes, Tell Defenneh, no Delta oriental, o primeiro candidato do mapa. Otto Eissfeldt sustentou que era o santuário depois conhecido como o de Zeus Casio, no banco de areia do lago Bardawil (Ras Qasrun, Zahr al-Qais no mapa), onde os gregos adoravam o mesmo deus da tempestade da montanha sob outro nome. Os que mandam Israel para o sul, rumo ao golfo de Suez, acharam Baal-Zefom em Jebel Ataqa ou Jebel al-Murr, acima de Suez, ou em Arsínoe, depois Clisma, na cabeceira do golfo; outros em al-Mahamdiyah, perto de Pelúsio. Nenhum desses sítios rendeu o nome."
    - "Hoje os candidatos se espalham pelo nordeste do Egito, da orla de Suez ao banco mediterrâneo de Bardawil; Tell Defenneh é um montículo no deserto cerca de 14 km a oeste do canal de Suez, escavado primeiro por Flinders Petrie em 1886."
  de:
    - "Baal-Zefon war die Landmarke von Israels letztem Lager vor dem Meer. Gott sagte Mose, das Volk solle „sich herumlenken und sich lagern bei Pihachiroth, zwischen Migdol und dem Meer, gegen Baal-Zephon, und daselbst gegenüber sich lagern ans Meer“; das Heer des Pharao ereilte sie, „da sie sich gelagert hatten am Meer“, „bei Pihachiroth, gegen Baal-Zephon“; und die Stationenliste wiederholt: „Von Etham zogen sie aus und blieben in Pihachiroth, welches liegt gegen Baal-Zephon“. Der Name ist der eines Gottes: Baal-Zafon, „Herr des Nordens“, der Baal des Berges Zafon nördlich von Ugarit, ein Schutzherr der Seefahrer, dessen Kult die Phönizier nach Ägypten trugen. Der Ort war vermutlich ein Heiligtum von ihm an der ägyptischen Grenze."
    - "Wo er stand, hängt davon ab, wo das Meer durchquert wurde, und das ist unbekannt. Ein phönizischer Brief auf Papyrus aus Saqqara segnet seinen Leser bei Baal-Zefon und allen Göttern von Tachpanhes, was N. Aimé-Giron und W. F. Albright veranlasste, das Heiligtum nach Tachpanhes zu setzen, Tell Defenne im östlichen Delta, der erste Kandidat auf der Karte. Otto Eißfeldt vertrat, es sei das später als das des Zeus Kasios bekannte Heiligtum auf der Nehrung des Bardawil-Sees (Ras Qasrun, Zahr al-Qais auf der Karte), wo die Griechen denselben Sturmgott des Berges unter anderem Namen verehrten. Wer Israel nach Süden zum Golf von Suez schickt, hat Baal-Zefon am Dschebel Ataqa oder Dschebel al-Murr über Suez gefunden oder bei Arsinoë, dem späteren Klysma, am Kopf des Golfs; andere in al-Mahamdiya bei Pelusium. Keine dieser Stätten hat den Namen ergeben."
    - "Heute liegen die Kandidaten über den Nordosten Ägyptens verteilt, von der Uferfront von Suez bis zur Mittelmeernehrung von Bardawil; Tell Defenne ist ein Hügel in der Wüste etwa 14 km westlich des Suezkanals, 1886 erstmals von Flinders Petrie ausgegraben."
  fr:
    - "Baal-Tsephon était le repère du dernier campement d’Israël avant la mer. Dieu dit à Moïse que le peuple devait se détourner et camper « devant Pi-Hahiroth, entre Migdol et la mer, vis-à-vis de Baal-Tsephon ; c’est en face de ce lieu que vous camperez, près de la mer » ; l’armée de Pharaon les atteignit « campés près de la mer, vers Pi-Hahiroth, vis-à-vis de Baal-Tsephon » ; et la liste des étapes répète que d’Étham ils « se détournèrent vers Pi-Hahiroth, vis-à-vis de Baal-Tsephon ». Le nom est celui d’un dieu : Baal-Tsaphon, « seigneur du nord », le Baal du mont Tsaphon au nord d’Ougarit, protecteur des marins dont les Phéniciens portèrent le culte en Égypte. Le lieu était vraisemblablement un sanctuaire de ce dieu à la frontière égyptienne."
    - "Son emplacement dépend de l’endroit où la mer fut traversée, et on l’ignore. Une lettre phénicienne sur papyrus trouvée à Saqqara bénit son lecteur par Baal-Tsephon et tous les dieux de Tachpanès, ce qui amena N. Aimé-Giron et W. F. Albright à placer le sanctuaire à Tachpanès, Tell Defenneh, dans l’est du Delta, premier candidat de la carte. Otto Eissfeldt soutint que c’était le sanctuaire connu plus tard comme celui de Zeus Kasios sur le cordon sableux du lac Bardawil (Ras Qasrun, Zahr al-Qais sur la carte), où les Grecs adoraient le même dieu de l’orage de la montagne sous un autre nom. Ceux qui envoient Israël vers le sud, au golfe de Suez, ont placé Baal-Tsephon au Jebel Ataqa ou au Jebel al-Murr au-dessus de Suez, ou à Arsinoé, plus tard Clysma, à la tête du golfe ; d’autres à al-Mahamdiyah près de Péluse. Aucun de ces sites n’a livré le nom."
    - "Aujourd’hui les candidats s’étendent sur le nord-est de l’Égypte, du front de mer de Suez au cordon méditerranéen de Bardawil ; Tell Defenneh est un tertre dans le désert à quelque 14 km à l’ouest du canal de Suez, fouillé d’abord par Flinders Petrie en 1886."
  it:
    - "Baal-Zefon era il punto di riferimento dell’ultimo accampamento d’Israele prima del mare. Dio disse a Mosè: «Di’ ai figliuoli d’Israele che tornino indietro e s’accampino di rimpetto a Pi-Hahiroth, fra Migdol e il mare, di fronte a Baal-Tsefon; accampatevi di faccia a quel luogo presso il mare»; l’esercito del faraone li raggiunse «accampati presso il mare, vicino a Pi-Hahiroth, di fronte a Baal-Tsefon»; e l’elenco delle tappe ripete che da Etam «piegarono verso Pi-Hahiroth che è dirimpetto a Baal-Tsefon». Il nome è quello di un dio: Baal-Zafon, «signore del nord», il Baal del monte Zafon a nord di Ugarit, protettore dei marinai il cui culto i Fenici portarono in Egitto. Il luogo era presumibilmente un suo santuario sulla frontiera egiziana."
    - "Dove sorgesse dipende da dove fu attraversato il mare, ed è ignoto. Una lettera fenicia su papiro trovata a Saqqara benedice il suo lettore per Baal-Zefon e per tutti gli dèi di Tafni, il che portò N. Aimé-Giron e W. F. Albright a porre il santuario a Tafni, Tell Defenneh nel Delta orientale, il primo candidato sulla carta. Otto Eissfeldt sostenne che fosse il santuario poi noto come quello di Zeus Casio sulla lingua di sabbia del lago Bardawil (Ras Qasrun, Zahr al-Qais sulla carta), dove i Greci adoravano lo stesso dio della tempesta del monte con un altro nome. Chi manda Israele a sud verso il golfo di Suez ha trovato Baal-Zefon a Jebel Ataqa o Jebel al-Murr sopra Suez, o ad Arsinoe, la posteriore Clisma, in fondo al golfo; altri ad al-Mahamdiyah presso Pelusio. Nessuno di questi siti ha prodotto il nome."
    - "Oggi i candidati si trovano in tutto il nord-est dell’Egitto, dal lungomare di Suez alla lingua mediterranea di Bardawil; Tell Defenneh è un tell nel deserto a circa 14 km a ovest del Canale di Suez, scavato per la prima volta da Flinders Petrie nel 1886."
  pl:
    - "Baal-Sefon było punktem orientacyjnym ostatniego obozu Izraela przed morzem. Bóg powiedział Mojżeszowi: „Mów do synów Izraelskich, niech się wrócą i położą obozem przed Fihahirot między Migdoł, i między morzem, przeciw Baalsefon, przeciw jemu położycie obóz nad morzem”; wojsko Faraona dogoniło ich „w obozie nad morzem … nie daleko Fihahirot, przeciw Baalsefon”; a wykaz stacji powtarza, że z Etam „nawrócili się do Fihahyrot, które jest przeciw Baalsefon”. Nazwa jest nazwą boga: Baal-Safon, „pan północy”, Baal góry Safon na północ od Ugarit, opiekun żeglarzy, którego kult Fenicjanie zanieśli do Egiptu. Miejsce było zapewne jego sanktuarium na granicy egipskiej."
    - "Gdzie stało, zależy od tego, gdzie przekroczono morze, a to nie jest znane. Fenicki list na papirusie znaleziony w Sakkarze błogosławi czytelnika przez Baal-Sefona i wszystkich bogów Tachpanches, co skłoniło N. Aimé-Giron i W. F. Albrighta do umieszczenia sanktuarium w Tachpanches, Tell Defenneh we wschodniej Delcie, pierwszym kandydacie na mapie. Otto Eissfeldt dowodził, że było to sanktuarium znane później jako sanktuarium Zeusa Kasiosa na mierzei jeziora Bardawil (Ras Qasrun, Zahr al-Qais na mapie), gdzie Grecy czcili tego samego boga burzy góry pod innym imieniem. Ci, którzy wiodą Izraela na południe ku Zatoce Sueskiej, znaleźli Baal-Sefon na Dżabal Ataqa albo Dżabal al-Murr nad Sueskiem, albo w Arsinoe, późniejszym Klysma, u wylotu zatoki; inni w al-Mahamdiyah koło Peluzjum. Żadne z tych miejsc nie dało nazwy."
    - "Dziś kandydaci leżą w całym północno-wschodnim Egipcie, od nabrzeża Suezu po śródziemnomorską mierzeję Bardawil; Tell Defenneh to tell na pustyni około 14 km na zachód od Kanału Sueskiego, po raz pierwszy wykopywany przez Flindersa Petriego w 1886 roku."
  nl:
    - "Baäl-Zefon was het oriëntatiepunt van Israëls laatste kamp vóór de zee. God zei tot Mozes dat het volk moest “wederkeren, en zich legeren voor Pi-Hachiroth, tussen Migdol en tussen de zee, voor Baal-Zefon; daar tegenover zult gij u legeren aan de zee”; Farao’s leger achterhaalde hen, “daar zij zich gelegerd hadden aan de zee... nevens Pi-Hachiroth, voor Baal-Zefon”; en de lijst van standplaatsen herhaalt dat zij van Etam “keerden weder naar Pi-hachiroth, dat tegenover Baal-Sefon is”. De naam is die van een god: Baal-Zafon, “heer van het noorden”, de Baäl van de berg Zafon ten noorden van Ugarit, een beschermer van zeelieden wiens cultus de Feniciërs naar Egypte brachten. De plaats was vermoedelijk een heiligdom van hem aan de Egyptische grens."
    - "Waar het stond, hangt af van waar de zee werd overgestoken, en dat is onbekend. Een Fenicische brief op papyrus gevonden te Saqqara zegent zijn lezer bij Baal-Zafon en alle goden van Tachpanhes, wat N. Aimé-Giron en W. F. Albright ertoe bracht het heiligdom te plaatsen te Tachpanhes, Tell Defenneh in de oostelijke Delta, de eerste kandidaat op de kaart. Otto Eissfeldt betoogde dat het het heiligdom was dat later bekendstond als dat van Zeus Kasios op de zandbank van het Bardawilmeer (Ras Qasrun, Zahr al-Qais op de kaart), waar de Grieken dezelfde onweersgod van de berg onder een andere naam vereerden. Zij die Israël naar het zuiden richting de Golf van Suez laten trekken, vonden Baäl-Zefon bij Jebel Ataqa of Jebel al-Murr boven Suez, of bij Arsinoë, het latere Clysma, aan het hoofd van de golf; anderen bij al-Mahamdiyah nabij Pelusium. Geen van deze plaatsen leverde de naam op."
    - "Tegenwoordig liggen de kandidaten verspreid over het noordoosten van Egypte, van de waterkant van Suez tot de Middellandse-Zeebank van Bardawil; Tell Defenneh is een heuvel in de woestijn zo’n 14 km ten westen van het Suezkanaal, voor het eerst opgegraven door Flinders Petrie in 1886."
  cs:
    - "Báal-cefón byl orientačním bodem posledního tábora Izraele před mořem. Bůh řekl Mojžíšovi, aby se lid vrátil: „ať navrátíce se, rozbijí stany před Fiarot, mezi Magdalem a mořem, proti Belsefon; naproti němu rozbijete stany při moři“; Egypťané je postihli, „když se položili při moři, všickni vozové Faraonovi, a jezdci jeho i vojsko jeho podlé Fiarot, před Belsefon“; a seznam stanic opakuje, že z Etamu „navrátili se zase k Fiarot, jenž jest před Belsefon“. Jméno je jménem boha: Baal-cafón, „pán severu“, Baal hory Cafon severně od Ugaritu, ochránce námořníků, jehož kult Féničané přenesli do Egypta. Místo bylo zřejmě jeho svatyní na egyptské hranici."
    - "Kde stál, závisí na tom, kde bylo moře přejito, a to není známo. Fénický dopis na papyru nalezený v Sakkáře žehná čtenáři Baalem-cafónem a všemi bohy Tachpanchésu, což přivedlo N. Aimé-Girona a W. F. Albrighta k tomu, aby umístili svatyni do Tachpanchésu, Tell Defenneh ve východní deltě, prvního kandidáta na mapě. Otto Eissfeldt tvrdil, že jde o svatyni později známou jako svatyně Dia Kasia na písečné kose jezera Bardawil (Ras Qasrun, na mapě Zahr al-Qais), kde Řekové uctívali téhož bouřného boha hory pod jiným jménem. Ti, kdo vedou Izrael na jih k Suezskému zálivu, nalezli Báal-cefón na Jebel Ataqa nebo Jebel al-Murr nad Suezem, nebo v Arsinoé, pozdější Klysmě, na konci zálivu; jiní v al-Mahamdiyah u Pelúsia. Žádné z těchto míst jméno nevydalo."
    - "Dnes leží kandidáti napříč severovýchodem Egypta, od nábřeží Suezu po středozemní kosu Bardawil; Tell Defenneh je pahorek v poušti asi 14 km západně od Suezského průplavu, poprvé vykopaný Flindersem Petriem roku 1886."
  sv:
    - "Baal-Sefon var landmärket för Israels sista läger före havet. Gud sade åt Mose att folket skulle ”vända om och lägra sig framför Pi-Hahirot, mellan Migdol och havet; mitt framför Baal-Sefon skolen I lägra eder vid havet”; Faraos här hann upp dem ”där de voro lägrade vid havet, vid Pi-Hahirot, framför Baal-Sefon”; och förteckningen över stationerna upprepar att de från Etam ”vände om till Pi-Hahirot, som ligger mitt emot Baal-Sefon”. Namnet är en guds: Baal-Safon, ”nordens herre”, Baal på berget Safon norr om Ugarit, sjömännens beskyddare vars kult fenicierna förde till Egypten. Platsen var förmodligen en helgedom åt honom vid den egyptiska gränsen."
    - "Var den låg beror på var havet korsades, och det är okänt. Ett feniciskt brev på papyrus funnet i Saqqara välsignar läsaren vid Baal-Safon och alla Tachpanches gudar, vilket ledde N. Aimé-Giron och W. F. Albright att placera helgedomen i Tachpanches, Tell Defenneh i östra deltat, den första kandidaten på kartan. Otto Eissfeldt hävdade att det var helgedomen som senare kallades Zeus Kasios på sandbanken vid Bardawilsjön (Ras Qasrun, Zahr al-Qais på kartan), där grekerna dyrkade samma bergets stormgud under ett annat namn. De som skickar Israel söderut mot Suezbukten har funnit Baal-Sefon vid Jebel Ataqa eller Jebel al-Murr ovanför Suez, eller vid Arsinoe, det senare Klysma, vid buktens innersta del; andra vid al-Mahamdiyah nära Pelusium. Ingen av dessa platser har givit namnet."
    - "I dag ligger kandidaterna över hela nordöstra Egypten, från Suez hamnfront till Bardawils medelhavsbank; Tell Defenneh är en kulle i öknen omkring 14 km väster om Suezkanalen, först utgrävd av Flinders Petrie 1886."
  nb:
    - "Baal-Sefon var landemerket for Israels siste leir før havet. Gud sa til Moses at folket skulle «vende om og slå leir foran Pi-Hakirot, mellem Migdol og havet; midt imot Ba'al-Sefon, der skal I slå leir ved havet»; Faraos hær innhentet dem da de «lå i leir ved havet, alle Faraos vogner og hestfolk og hele hans hær, ved Pi-Hakirot, foran Ba'al-Sefon»; og stasjonslisten gjentar at de fra Etam «tok veien til Pi-Hakirot, som ligger midt imot Ba'al-Sefon». Navnet er en guds: Baal-Safon, «nordens herre», Baal på Safon-fjellet nord for Ugarit, en sjøfarendes beskytter hvis kult fønikerne førte til Egypt. Stedet var antakelig en helligdom for ham ved den egyptiske grensen."
    - "Hvor det lå, avhenger av hvor havet ble krysset, og det er ukjent. Et fønikisk brev på papyrus funnet i Saqqara velsigner leseren ved Baal-Sefon og alle Tahpanhes' guder, noe som fikk N. Aimé-Giron og W. F. Albright til å plassere helligdommen i Tahpanhes, Tell Defenneh i det østlige Deltaet, den første kandidaten på kartet. Otto Eissfeldt hevdet at det var helligdommen som senere var kjent som Zevs Kasios' på sandbanken ved Bardawil-sjøen (Ras Qasrun, Zahr al-Qais på kartet), der grekerne dyrket den samme stormguden fra fjellet under et annet navn. De som sender Israel sørover mot Suezbukta, har funnet Baal-Sefon ved Jebel Ataqa eller Jebel al-Murr over Suez, eller ved Arsinoë, det senere Klysma, innerst i bukta; andre ved al-Mahamdiyah nær Pelusium. Ingen av disse stedene har gitt navnet."
    - "I dag ligger kandidatene over hele det nordøstlige Egypt, fra havnefronten i Suez til Bardawils middelhavsbank; Tell Defenneh er en tell i ørkenen omtrent 14 km vest for Suezkanalen, først gravd ut av Flinders Petrie i 1886."
