# Overview article (ADR 0007). Mainstream facts only; Timnah of Samson = Tel Batash in the Sorek valley (not Timnath-serah, nor the Timnah of Gen 38); Sennacherib's campaign dated 701 BC.
id: timnah
place: a21f909
title:
  en: "Timnah"
  ru: "Фимнафа"
  uk: "Тімна"
  es: "Timna"
  pt: "Timna"
  de: "Timna"
  fr: "Thimna"
body:
  en:
    - "Timnah, the Timnath of Samson's story, is identified with Tel Batash, a mound on the flat floor of the Sorek valley between Beth-shemesh and Ekron. The Book of Joshua runs the border of Judah from Beth-shemesh past Timnah to the north side of Ekron, and Tel Batash lies on that line, downstream from Beth-shemesh and a few kilometres from Ekron (Tel Miqne). Amihai Mazar and George L. Kelm excavated the site in 1977–1989. It is a different place from Timnath-serah, Joshua's town in the hills of Ephraim."
    - "The town was founded in the Middle Bronze Age, about 1750–1550 BC, within earthen ramparts. In the Late Bronze Age a large two-storey house stood there, and a burnt layer of the fourteenth century BC held cylinder seals and scarabs of Amenhotep III and Queen Tiye. In the twelfth and eleventh centuries BC Philistine pottery and seals show a Philistine town. After a gap a stone wall and a gate were built in the eighth century BC; a jar handle stamped lmlk, the royal stamp of Judah, was found, though the household pottery is closer to that of the coast. In the seventh century the town prospered, with a citadel and olive-oil presses. Like Ekron, it was destroyed about 600 BC, probably by the Babylonians, and the mound was abandoned in the Persian period."
    - 'In the Book of Joshua Timnah stands on the northern border of Judah and is listed among the towns of Dan. "Samson went down to Timnath, and saw a woman in Timnath of the daughters of the Philistines." On the way, at the vineyards of Timnath, he tore apart a young lion, and at the wedding feast he put his riddle to thirty companions. When his wife was given to another man, he set the Philistines'' harvest on fire with foxes, and the Philistines burned her in revenge. Under Ahaz the Philistines took Timnah and its villages from Judah. In 701 BC Sennacherib of Assyria records that he besieged, conquered and plundered Eltekeh and Tamna before he dealt with Ekron.'
    - "No town rose on the mound again, and the name Timnah seems to have passed to Khirbet Tibna, a few kilometres away. In the early fourth century AD Eusebius refers Samson's Thamnatha to Thamna, which he describes as a very large village in the territory of Diospolis (Lod), halfway to Jerusalem; he gives the Philistine town no site of its own."
  ru:
    - "Фимнафу из истории Самсона отождествляют с Тель-Баташем — холмом на ровном дне долины Сорек между Вефсамисом и Екроном. Книга Иисуса Навина ведёт предел Иуды от Вефсамиса через Фимну к северной стороне Екрона, и Тель-Баташ лежит на этой линии — ниже Вефсамиса по долине и в нескольких километрах от Екрона (Тель-Микне). Раскопки здесь в 1977–1989 гг. вели Амихай Мазар и Джордж Л. Келм. Это не Фамнаф-Сараи — город Иисуса Навина на горе Ефремовой."
    - "Город основали в среднем бронзовом веке, около 1750–1550 гг. до н. э., внутри земляных валов. В позднем бронзовом веке здесь стоял большой двухэтажный дом, а в сгоревшем слое XIV века до н. э. нашли цилиндрические печати и скарабеи Аменхотепа III и царицы Тии. В XII–XI веках до н. э. филистимская керамика и печати показывают филистимский город. После перерыва в VIII веке до н. э. построили каменную стену и ворота; нашли ручку кувшина с оттиском lmlk — царским штампом Иудеи, хотя бытовая керамика ближе к прибрежной. В VII веке город процветал, в нём были цитадель и давильни для оливкового масла. Как и Екрон, он был разрушен около 600 г. до н. э., вероятно, вавилонянами, и в персидский период холм опустел."
    - "В книге Иисуса Навина Фимна стоит на северном пределе Иуды и названа среди городов Дана. «И пошел Самсон в Фимнафу и увидел в Фимнафе женщину из дочерей Филистимских». По дороге, у виноградников Фимнафских, он растерзал молодого льва, а на свадебном пиру загадал загадку тридцати брачным друзьям. Когда его жену отдали другому, он поджёг лисицами жатву Филистимскую, а филистимляне в отместку сожгли её. При Ахазе филистимляне взяли у Иудеи Фимну и зависящие от неё города. Ассирийский царь Сеннахирим сообщает, что в 701 г. до н. э. он осадил, взял и разграбил Елтеке и Тамну, прежде чем расправиться с Екроном."
    - "Города на холме больше не было, а имя Фимны, по-видимому, перешло к руинам Хирбет-Тибна в нескольких километрах отсюда. В начале IV века н. э. Евсевий относит Фимнафу Самсона к Фамне, которую описывает как очень большое селение в округе Диосполя (Лидды), на полпути к Иерусалиму; отдельного места для филистимского города он не указывает."
  uk:
    - "Тімна, Тимнат із розповіді про Самсона, ототожнюється з Тель-Баташем, пагорбом на рівному дні долини Сорек між Бет-Шемешем і Екроном. Книга Ісуса Навина веде межу Юди від Бет-Шемеша повз Тімну до північного боку Екрона, і Тель-Баташ лежить на цій лінії, нижче за течією від Бет-Шемеша і за кілька кілометрів від Екрона (Телль-Мікне). Аміхай Мазар і Джордж Л. Келм розкопували місце в 1977–1989 роках. Це інше місце, ніж Тімнат-Сера, місто Ісуса Навина в горах Єфрема."
    - "Місто було засноване в середню бронзову добу, близько 1750–1550 рр. до н. е., за земляними валами. У пізню бронзову добу там стояв великий двоповерховий будинок, а у випаленому шарі XIV ст. до н. е. знайшли циліндричні печатки й скарабеї Аменхотепа III і цариці Тіє. У XII–XI ст. до н. е. філістимська кераміка й печатки показують філістимське місто. Після перерви в VIII ст. до н. е. збудували кам’яний мур і браму; знайдено ручку глека з клеймом lmlk, царською печаткою Юди, хоч побутова кераміка ближча до прибережної. У VII столітті місто процвітало, з цитаделлю й олійницями. Як і Екрон, воно було зруйноване близько 600 р. до н. е., ймовірно, вавилонянами, і в перську добу пагорб покинули."
    - "У Книзі Ісуса Навина Тімна стоїть на північній межі Юди й перелічена серед міст Дана. «І пійшов Самсон у Тимнат, і запізнавсь із Филистійською дївчиною». Дорогою, біля виноградників Тімни, він роздер молодого лева, а на весільній учті загадав загадку тридцятьом супутникам. Коли його жінку віддали іншому, він запалив филистимські жнива лисицями, а филистимляни спалили її за помсту. За Ахаза филистимляни забрали Тімну з її селами в Юди. У 701 р. до н. е. Сінаххеріб Ассирійський записує, що облягав, здобув і пограбував Елтеке й Тамну, перш ніж узявся за Екрон."
    - "Місто на пагорбі більше не постало, а назва Тімна, схоже, перейшла до Хірбет-Тібни за кілька кілометрів. На початку IV століття н. е. Євсевій відносить Самсонову Тамнату до Тамни, яку описує як дуже велике село на території Діосполя (Лідди), на півдорозі до Єрусалима; філістимському місту він не дає власного місця."
  es:
    - "Timna, la Timnat de la historia de Sansón, se identifica con Tel Batash, un montículo en el suelo llano del valle de Sorec, entre Bet-semes y Ecrón. El libro de Josué hace correr la frontera de Judá desde Bet-semes, pasando por Timna, hasta el lado norte de Ecrón, y Tel Batash se halla en esa línea, río abajo de Bet-semes y a pocos kilómetros de Ecrón (Tel Miqne). Amihai Mazar y George L. Kelm excavaron el sitio en 1977–1989. Es un lugar distinto de Timnat-sera, la ciudad de Josué en las colinas de Efraín."
    - "La ciudad fue fundada en el Bronce Medio, hacia 1750–1550 a. C., dentro de murallas de tierra. En el Bronce Final se alzaba allí una gran casa de dos pisos, y un estrato quemado del siglo XIV a. C. contenía sellos cilíndricos y escarabeos de Amenhotep III y de la reina Tiy. En los siglos XII y XI a. C. la cerámica y los sellos filisteos muestran una ciudad filistea. Tras un hiato se construyeron una muralla de piedra y una puerta en el siglo VIII a. C.; se halló un asa de jarra con el sello lmlk, el sello real de Judá, aunque la cerámica doméstica es más cercana a la de la costa. En el siglo VII la ciudad prosperó, con una ciudadela y prensas de aceite de oliva. Como Ecrón, fue destruida hacia 600 a. C., probablemente por los babilonios, y el montículo fue abandonado en el período persa."
    - "En el libro de Josué, Timna está en la frontera norte de Judá y figura entre las ciudades de Dan. «Descendiendo Samsón á Timnah, vió en Timnah una mujer de las hijas de los Filisteos». De camino, en las viñas de Timnat, despedazó un cachorro de león, y en el banquete de bodas propuso su enigma a treinta compañeros. Cuando su mujer fue dada a otro hombre, prendió fuego con zorras a las mieses de los filisteos, y estos la quemaron a ella en venganza. Bajo Acaz, los filisteos tomaron a Judá Timna y sus aldeas. En 701 a. C. Senaquerib de Asiria registra que sitió, conquistó y saqueó Elteque y Tamna antes de ocuparse de Ecrón."
    - "No volvió a levantarse ninguna ciudad en el montículo, y el nombre Timna parece haber pasado a Khirbet Tibna, a pocos kilómetros. A comienzos del siglo IV d. C., Eusebio refiere la Thamnatha de Sansón a Thamna, que describe como una aldea muy grande en el territorio de Diospolis (Lida), a mitad de camino de Jerusalén; no da a la ciudad filistea un emplazamiento propio."
  pt:
    - "Timna, a Timnate da história de Sansão, é identificada com Tel Batash, um monte no plano vale de Soreque, entre Bete-Semes e Ecrom. O livro de Josué traça a fronteira de Judá de Bete-Semes, passando por Timna, até o lado norte de Ecrom, e Tel Batash fica nessa linha, rio abaixo de Bete-Semes e a poucos quilômetros de Ecrom (Tel Miqne). Amihai Mazar e George L. Kelm escavaram o sítio em 1977–1989. É um lugar diferente de Timnate-Sera, a cidade de Josué nas colinas de Efraim."
    - "A cidade foi fundada na Idade do Bronze Médio, por volta de 1750–1550 a.C., dentro de muralhas de terra. No Bronze Final, ali se erguia uma grande casa de dois andares, e uma camada queimada do século XIV a.C. continha selos cilíndricos e escaravelhos de Amenhotep III e da rainha Tiy. Nos séculos XII e XI a.C., cerâmica e selos filisteus mostram uma cidade filisteia. Depois de uma interrupção, construíram-se no século VIII a.C. uma muralha de pedra e um portão; foi achada uma alça de jarro com o carimbo lmlk, o selo real de Judá, embora a cerâmica doméstica seja mais próxima da da costa. No século VII a cidade prosperou, com uma cidadela e prensas de azeite. Como Ecrom, foi destruída por volta de 600 a.C., provavelmente pelos babilônios, e o monte foi abandonado no período persa."
    - "No livro de Josué, Timna está na fronteira norte de Judá e é listada entre as cidades de Dã. “Sansão desceu a Timna, e viu em Timna uma mulher das filhas dos filisteus.” No caminho, nas vinhas de Timna, ele despedaçou um leão novo e, no banquete de casamento, propôs seu enigma a trinta companheiros. Quando sua mulher foi dada a outro homem, ele incendiou a colheita dos filisteus com raposas, e os filisteus a queimaram em vingança. Sob Acaz, os filisteus tomaram de Judá Timna e suas aldeias. Em 701 a.C., Senaqueribe da Assíria registra que sitiou, conquistou e saqueou Elteque e Tamna antes de tratar com Ecrom."
    - "Nenhuma cidade se ergueu de novo no monte, e o nome Timna parece ter passado a Khirbet Tibna, a poucos quilômetros. No início do século IV d.C., Eusébio refere a Thamnatha de Sansão a Thamna, que descreve como uma aldeia muito grande no território de Diospolis (Lida), a meio caminho de Jerusalém; não dá à cidade filisteia sítio próprio."
  de:
    - "Timna, das Thimnath der Simson-Erzählung, wird mit Tel Batash gleichgesetzt, einem Hügel auf dem flachen Boden des Sorektals zwischen Bet-Schemesch und Ekron. Das Buch Josua führt die Grenze Judas von Bet-Schemesch an Timna vorbei zur Nordseite Ekrons, und Tel Batash liegt auf dieser Linie, flussabwärts von Bet-Schemesch und wenige Kilometer von Ekron (Tel Miqne). Amihai Mazar und George L. Kelm gruben die Stätte 1977–1989 aus. Es ist ein anderer Ort als Timnat-Serach, Josuas Stadt im Bergland Ephraim."
    - "Die Stadt wurde in der Mittelbronzezeit um 1750–1550 v. Chr. innerhalb von Erdwällen gegründet. In der Spätbronzezeit stand dort ein großes zweigeschossiges Haus, und eine Brandschicht des vierzehnten Jahrhunderts v. Chr. enthielt Rollsiegel und Skarabäen Amenophis' III. und der Königin Teje. Im zwölften und elften Jahrhundert v. Chr. zeigen philistäische Keramik und Siegel eine Philisterstadt. Nach einer Lücke wurden im achten Jahrhundert v. Chr. eine Steinmauer und ein Tor gebaut; ein Krughenkel mit lmlk-Stempel, dem königlichen Stempel Judas, wurde gefunden, doch steht die Haushaltskeramik der der Küste näher. Im siebten Jahrhundert blühte die Stadt mit Zitadelle und Olivenölpressen. Wie Ekron wurde sie um 600 v. Chr., wohl von den Babyloniern, zerstört, und der Hügel wurde in der Perserzeit aufgegeben."
    - "Im Buch Josua liegt Timna an der Nordgrenze Judas und wird unter den Städten Dans aufgeführt. „Simson ging gen Thimnath und sah ein Weib zu Thimnath unter den Töchtern der Philister.“ Unterwegs, bei den Weinbergen von Thimnath, zerriss er einen jungen Löwen, und beim Hochzeitsmahl gab er dreißig Gesellen sein Rätsel auf. Als seine Frau einem anderen gegeben wurde, steckte er mit Füchsen die Ernte der Philister in Brand, und die Philister verbrannten sie aus Rache. Unter Ahas nahmen die Philister Juda Timna und seine Dörfer ab. Sanherib von Assyrien berichtet, er habe 701 v. Chr. Elteke und Tamna belagert, erobert und geplündert, bevor er sich Ekron vornahm."
    - "Auf dem Hügel entstand keine Stadt mehr, und der Name Timna scheint auf Khirbet Tibna, wenige Kilometer entfernt, übergegangen zu sein. Anfang des vierten Jahrhunderts n. Chr. bezieht Eusebius Simsons Thamnatha auf Thamna, das er als sehr großes Dorf im Gebiet von Diospolis (Lydda) auf halbem Weg nach Jerusalem beschreibt; der Philisterstadt gibt er keinen eigenen Ort."
  fr:
    - "Thimna, la Thimnath du récit de Samson, est identifiée à Tel Batash, tertre sur le fond plat de la vallée de Sorek entre Beth-Schémesch et Ékron. Le livre de Josué fait courir la frontière de Juda de Beth-Schémesch, par Thimna, jusqu’au côté nord d’Ékron, et Tel Batash se trouve sur cette ligne, en aval de Beth-Schémesch et à quelques kilomètres d’Ékron (Tel Miqne). Amihai Mazar et George L. Kelm fouillèrent le site en 1977-1989. C’est un autre lieu que Thimnath-Sérach, ville de Josué dans les collines d’Éphraïm."
    - "La ville fut fondée à l’âge du bronze moyen, vers 1750-1550 av. J.-C., derrière des remparts de terre. Au bronze récent, une grande maison à deux étages s’y dressait, et une couche brûlée du XIVe siècle av. J.-C. contenait des sceaux-cylindres et des scarabées d’Amenhotep III et de la reine Tiyi. Aux XIIe et XIe siècles av. J.-C., la poterie et les sceaux philistins montrent une ville philistine. Après une interruption, un mur de pierre et une porte furent bâtis au VIIIe siècle av. J.-C. ; on y trouva une anse de jarre estampillée lmlk, le sceau royal de Juda, bien que la poterie domestique soit plus proche de celle de la côte. Au VIIe siècle, la ville prospéra, avec une citadelle et des pressoirs à huile d’olive. Comme Ékron, elle fut détruite vers 600 av. J.-C., probablement par les Babyloniens, et le tertre fut abandonné à l’époque perse."
    - "Dans le livre de Josué, Thimna se trouve à la frontière nord de Juda et figure parmi les villes de Dan. « Samson descendit à Thimna, et il y vit une femme parmi les filles des Philistins. » En chemin, aux vignes de Thimna, il déchira un jeune lion, et au festin de noces il posa son énigme à trente compagnons. Quand sa femme fut donnée à un autre, il incendia avec des renards la moisson des Philistins, et les Philistins la brûlèrent en représailles. Sous Achaz, les Philistins prirent Thimna et ses villages à Juda. En 701 av. J.-C., Sanchérib d’Assyrie consigne qu’il assiégea, conquit et pilla Eltheké et Tamna avant de s’occuper d’Ékron."
    - "Aucune ville ne s’éleva plus sur le tertre, et le nom de Thimna semble être passé à Khirbet Tibna, à quelques kilomètres. Au début du IVe siècle apr. J.-C., Eusèbe rapporte la Thamnatha de Samson à Thamna, qu’il décrit comme un très grand village du territoire de Diospolis (Lydde), à mi-chemin de Jérusalem ; il ne donne à la ville philistine aucun site propre."
